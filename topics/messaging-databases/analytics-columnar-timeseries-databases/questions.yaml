topic: "Analytics, Columnar & Time-Series Databases"
domain: messaging-databases
topic_slug: analytics-columnar-timeseries-databases
version: 1
questions:
  - id: analytics-columnar-timeseries-databases-001
    difficulty: beginner
    tags: [oltp, olap, workloads]
    question: |
      Which access pattern best characterizes an OLTP workload?
    options:
      - "Scanning billions of rows but projecting only two columns to compute an aggregate"
      - "Reading or updating a few rows identified by primary key, at high concurrency"
      - "Bulk-loading a fact table once per hour and never updating rows"
      - "Running a multi-minute GROUP BY across an entire year of history"
    answer: 1
    explanation: |
      OLTP (transaction processing) is dominated by short, selective operations on a
      few rows located by key, with many concurrent users and millisecond latency
      targets. The scan-and-aggregate patterns describe OLAP.
    ref: "concepts.md#oltp-vs-olap-workloads"

  - id: analytics-columnar-timeseries-databases-002
    difficulty: beginner
    tags: [oltp, olap, workloads]
    question: |
      An analytics query runs `SELECT region, SUM(revenue) FROM sales GROUP BY region`
      over a billion-row table. What kind of workload is this?
    options:
      - "OLAP — a large scan that projects few columns and aggregates"
      - "OLTP — a high-concurrency operation touching many individual rows"
      - "HTAP — using GROUP BY means it mixes transactional and analytic work"
      - "A point lookup because it returns one row per region"
    answer: 0
    explanation: |
      Scanning a huge table, projecting a couple of columns, and aggregating is the
      canonical OLAP pattern. The small result set does not make it a point lookup;
      the engine still must scan the underlying rows.
    ref: "concepts.md#oltp-vs-olap-workloads"

  - id: analytics-columnar-timeseries-databases-003
    difficulty: intermediate
    tags: [oltp, olap, offloading]
    question: |
      Analysts keep running heavy reporting queries against your production
      transactional PostgreSQL database, and application latency suffers. Which is the
      most mechanism-appropriate fix?
    options:
      - "Add more B-tree indexes to the OLTP tables so the reports run faster"
      - "Increase the transaction isolation level to SERIALIZABLE so reports run faster"
      - "Offload analytics to a read replica or a columnar warehouse fed by ETL/CDC"
      - "Convert every table to UNLOGGED to speed up the reports"
    answer: 2
    explanation: |
      Heavy scan-and-aggregate reports thrash the OLTP buffer cache and compete for
      resources. Indexes help selective lookups, not full-table scans. The standard
      pattern is to keep OLTP as the system of record and replicate data to a replica
      or columnar warehouse for analytics.
    ref: "concepts.md#oltp-vs-olap-workloads"

  - id: analytics-columnar-timeseries-databases-004
    difficulty: intermediate
    tags: [htap]
    question: |
      What does HTAP refer to?
    options:
      - "A columnar compression codec used exclusively inside Parquet row groups"
      - "Systems that serve both transactional and analytical workloads on one dataset"
      - "A synchronous replication protocol that links two OLTP primary nodes together"
      - "The high-availability failover tier bolted onto a time-series database engine"
    answer: 1
    explanation: |
      HTAP (Hybrid Transactional/Analytical Processing) systems aim to serve OLTP and
      OLAP on a single copy of the data, often by combining a row store for writes with
      a column store for reads.
    ref: "concepts.md#oltp-vs-olap-workloads"

  - id: analytics-columnar-timeseries-databases-005
    difficulty: beginner
    tags: [columnar, storage-layout]
    question: |
      In a column-oriented store, how is data physically laid out?
    options:
      - "All columns belonging to a single row are stored contiguously next to each other"
      - "Rows are stored in raw insertion order with no separation between the columns at all"
      - "All values of a single column are stored contiguously, separate from other columns"
      - "Each individual cell is stored in its own separate on-disk file for isolation"
    answer: 2
    explanation: |
      A column store groups all values of one column together in contiguous
      blocks/files, whereas a row store keeps all columns of a row together.
    ref: "concepts.md#row-vs-columnar-storage"

  - id: analytics-columnar-timeseries-databases-006
    difficulty: beginner
    tags: [columnar, io]
    question: |
      A 50-column table gets the query `SELECT AVG(age) FROM users`. Why is a columnar
      store faster than a row store here?
    options:
      - "It reads only the `age` column instead of every column of every row"
      - "It automatically caches the entire 50-column table in memory before scanning"
      - "It transparently rewrites the query to use a pre-built B-tree index on `age`"
      - "It skips the AVG computation entirely by reading a precomputed materialized total"
    answer: 0
    explanation: |
      Column projection: only the `age` column's blocks are read. A row store must read
      whole rows off disk because `age` is interleaved with the other 49 columns.
    ref: "concepts.md#row-vs-columnar-storage"

  - id: analytics-columnar-timeseries-databases-007
    difficulty: intermediate
    tags: [columnar, compression]
    question: |
      Why does columnar storage typically compress far better than row storage?
    options:
      - "A column holds values of one type and domain, so neighbors are similar and encode well"
      - "Column stores always place their data on faster NVMe SSDs than row stores do"
      - "Column stores encrypt every block, and the AES cipher incidentally shrinks the data"
      - "Row stores are forbidden by the SQL standard from using general-purpose compressors"
    answer: 0
    explanation: |
      Compression thrives on redundancy/similarity. Within a single column the values
      share a type and domain, so RLE, dictionary, delta, and general compressors all
      achieve much higher ratios than on heterogeneous rows.
    ref: "concepts.md#row-vs-columnar-storage"

  - id: analytics-columnar-timeseries-databases-008
    difficulty: intermediate
    tags: [columnar, vectorized-execution]
    question: |
      What is "vectorized execution" and why does columnar layout enable it?
    options:
      - "Executing one row at a time through an interpreter for maximum flexibility"
      - "Vectoring incoming writes across multiple disks in parallel for higher throughput"
      - "Running each individual query on its own dedicated GPU for hardware acceleration"
      - "Processing batches of like-typed column values through CPU-friendly (often SIMD) operators"
    answer: 3
    explanation: |
      Because a column is a dense array of one type, engines process it in batches
      (e.g. 1024 values) through tight, cache-friendly, often SIMD operators, rather
      than the tuple-at-a-time interpretation of a row engine.
    ref: "concepts.md#row-vs-columnar-storage"

  - id: analytics-columnar-timeseries-databases-009
    difficulty: intermediate
    tags: [columnar, updates, gotcha]
    question: |
      Why is a single-row `UPDATE` typically expensive in a column store?
    options:
      - "Column stores lack a WHERE clause, so UPDATE must rewrite the whole table"
      - "The row's fields are scattered across many separate, compressed column files/blocks"
      - "Every UPDATE triggers a mandatory full-table rebuild, as required by the SQL standard"
      - "Column stores are forced to re-sort the entire table from scratch on every single update"
    answer: 1
    explanation: |
      A single row's values live in N different column files (often compressed), so
      touching one row disturbs many blocks. This is why columnar systems are
      append/bulk-load, read-mostly, and penalize point updates.
    ref: "concepts.md#row-vs-columnar-storage"

  - id: analytics-columnar-timeseries-databases-010
    difficulty: intermediate
    tags: [columnar, decision]
    question: |
      For which query pattern does a row store beat a column store?
    options:
      - "Aggregating one column across the whole table"
      - "GROUP BY over billions of rows"
      - "`SELECT * FROM orders WHERE id = 42` returning the full row"
      - "Computing the average of a single column"
    answer: 2
    explanation: |
      Retrieving all columns of a single keyed row is cheap in a row store (one
      contiguous location) but expensive in a column store (gather from N column
      files). Row store wins for "few rows, all columns."
    ref: "concepts.md#row-vs-columnar-storage"

  - id: analytics-columnar-timeseries-databases-011
    difficulty: intermediate
    tags: [columnar, late-materialization]
    question: |
      What does "late materialization" mean in a columnar query engine?
    options:
      - "Delaying all dirty-page disk writes until the surrounding transaction finally commits"
      - "Loading the entire table into memory before the scan operator begins reading it"
      - "Materializing every dependent view up front before the query is allowed to start"
      - "Reconstructing full rows only at the end, operating on compressed column vectors as long as possible"
    answer: 3
    explanation: |
      Late materialization keeps data in compressed, column-vector form deep into the
      plan, reconstructing whole tuples only when finally required, which minimizes I/O
      and decompression work.
    ref: "concepts.md#row-vs-columnar-storage"

  - id: analytics-columnar-timeseries-databases-012
    difficulty: beginner
    tags: [compression, rle]
    question: |
      A column is sorted and contains long runs of the same value (e.g. `US` repeated
      10,000 times). Which encoding is most effective?
    options:
      - "Run-length encoding (RLE)"
      - "XOR float encoding"
      - "AES encryption"
      - "Hash partitioning"
    answer: 0
    explanation: |
      RLE stores `(value, run_length)`, so 10,000 consecutive `US` values collapse to
      a single `(US, 10000)` pair — ideal for sorted or low-cardinality columns.
    ref: "concepts.md#compression-schemes"

  - id: analytics-columnar-timeseries-databases-013
    difficulty: intermediate
    tags: [compression, dictionary]
    question: |
      A `status` column has values in `{ACTIVE, CLOSED, PENDING}`. Which encoding lets
      the engine evaluate `status = 'CLOSED'` as an integer comparison without decoding
      strings?
    options:
      - "Dictionary encoding"
      - "Delta encoding"
      - "Frame-of-reference encoding"
      - "Gzip only"
    answer: 0
    explanation: |
      Dictionary encoding maps each distinct value to a small integer code plus a
      dictionary. Equality/IN predicates are evaluated on the compact codes, so
      `CLOSED` becomes a single integer comparison.
    ref: "concepts.md#compression-schemes"

  - id: analytics-columnar-timeseries-databases-014
    difficulty: intermediate
    tags: [compression, delta, timestamps]
    question: |
      Which encoding is especially well suited to a column of regularly-spaced
      timestamps in time-series data?
    options:
      - "Dictionary encoding"
      - "Delta (and delta-of-delta) encoding"
      - "Run-length encoding of the full timestamp"
      - "Random hashing"
    answer: 1
    explanation: |
      Consecutive timestamps differ by a near-constant interval, so delta encoding
      stores small differences; delta-of-delta (Gorilla/Prometheus) stores the change
      in the delta, collapsing regular intervals to a few bits each.
    ref: "concepts.md#compression-schemes"

  - id: analytics-columnar-timeseries-databases-015
    difficulty: advanced
    tags: [compression, floats, gorilla]
    question: |
      Facebook's Gorilla compresses consecutive floating-point sensor readings by
      XOR-ing them. Why does this work well?
    options:
      - "XOR of any two floating-point values is mathematically guaranteed to be zero"
      - "XOR acts as a cipher that clamps every reading's range down to a fixed 8 bits"
      - "IEEE-754 floats cannot be delta-encoded at all, leaving XOR as the only choice"
      - "Similar readings share leading/trailing bits, so the XOR is mostly zeros and packs tightly"
    answer: 3
    explanation: |
      Adjacent readings tend to be close in value, so their IEEE-754 bit patterns share
      many leading and trailing bits; the XOR of the two has long zero runs that pack
      into a few bits.
    ref: "concepts.md#compression-schemes"

  - id: analytics-columnar-timeseries-databases-016
    difficulty: intermediate
    tags: [compression, bit-packing]
    question: |
      A dictionary-encoded column uses codes 0–7. Which technique stores each code in
      3 bits instead of a full 32-bit word?
    options:
      - "Bit-packing"
      - "Run-length encoding"
      - "Delta-of-delta"
      - "Snappy block compression"
    answer: 0
    explanation: |
      Bit-packing stores values using only the number of bits actually needed; codes
      0–7 fit in 3 bits, so eight codes pack into 3 bytes instead of 32 bytes.
    ref: "concepts.md#compression-schemes"

  - id: analytics-columnar-timeseries-databases-017
    difficulty: intermediate
    tags: [compression, lightweight-vs-general]
    question: |
      Why do columnar engines prefer lightweight encodings (RLE, dictionary, delta)
      even though a general compressor like Zstd is also applied?
    options:
      - "General compressors like Zstd silently corrupt columnar data on decode"
      - "Zstd cannot be applied to numeric columns, only to string and text columns"
      - "Lightweight encodings let operators filter/aggregate without fully decompressing"
      - "Lightweight encodings always achieve higher ratios than any general compressor"
    answer: 2
    explanation: |
      Lightweight encodings preserve enough structure that predicates and aggregates
      can run directly on encoded data (e.g. compare dictionary codes, sum over runs),
      avoiding full decompression. A general compressor is typically layered on top.
    ref: "concepts.md#compression-schemes"

  - id: analytics-columnar-timeseries-databases-018
    difficulty: advanced
    tags: [compression, cardinality, tuning]
    question: |
      You control the load order of a columnar table. Which choice most improves
      RLE/delta compression ratios?
    options:
      - "Load rows in random order to spread values evenly"
      - "Disable all encodings and rely on the file system"
      - "Load rows sorted by a high-cardinality UUID column"
      - "Sort the data by a low-cardinality column before loading"
    answer: 3
    explanation: |
      Sorting by a low-cardinality column groups equal/similar values together,
      lengthening runs and smoothing deltas, which dramatically improves RLE and delta
      encoding. Sort order is a genuine tuning knob in columnar stores.
    ref: "concepts.md#compression-schemes"

  - id: analytics-columnar-timeseries-databases-019
    difficulty: beginner
    tags: [parquet, formats]
    question: |
      Apache Parquet and Apache ORC are best described as:
    options:
      - "Row-oriented transactional storage engines"
      - "Open, columnar, on-disk file formats used in data lakes"
      - "Binary message-queue wire protocols for streaming ordered events"
      - "In-memory key-value caching libraries for accelerating hot lookups"
    answer: 1
    explanation: |
      Parquet and ORC are open columnar file formats. Data is split into row
      groups/stripes, stored column-by-column, compressed and encoded, and read in
      place by engines like Spark, Trino, and DuckDB.
    ref: "concepts.md#columnar-formats-and-data-lakes"

  - id: analytics-columnar-timeseries-databases-020
    difficulty: intermediate
    tags: [parquet, predicate-pushdown]
    question: |
      How does predicate pushdown (min-max pruning) work in Parquet?
    options:
      - "Per-row-group min/max statistics let the reader skip row groups that cannot match the WHERE clause"
      - "It rewrites the SQL into a chain of MapReduce jobs that scan the entire dataset"
      - "It builds a fresh B-tree index on every column at query time and probes it per row"
      - "It downloads the entire file to the client and applies the WHERE filter in memory"
    answer: 0
    explanation: |
      Each row group carries column statistics (min/max, null counts). If a row group's
      `[min,max]` range can't satisfy the predicate, the reader skips the entire row
      group without reading its data.
    ref: "concepts.md#columnar-formats-and-data-lakes"

  - id: analytics-columnar-timeseries-databases-021
    difficulty: intermediate
    tags: [parquet, row-groups]
    question: |
      Which statement about Parquet's internal layout is correct?
    options:
      - "Parquet stores each column as one giant file-wide column with no row grouping"
      - "Parquet cannot store any column statistics, so predicate pruning is impossible"
      - "Parquet is row-oriented within each page, interleaving all columns of a row"
      - "Parquet splits data into row groups; within a row group data is stored column-by-column"
    answer: 3
    explanation: |
      Parquet is columnar *within* row groups. This gives both column projection and
      row-group-level parallelism/pruning, and lets a reader fetch one row group
      without downloading the whole file.
    ref: "concepts.md#columnar-formats-and-data-lakes"

  - id: analytics-columnar-timeseries-databases-022
    difficulty: intermediate
    tags: [lakehouse, iceberg, delta]
    question: |
      What do table formats like Apache Iceberg, Delta Lake, and Apache Hudi add on top
      of raw Parquet files in object storage?
    options:
      - "They rewrite the underlying Parquet files into a row-oriented on-disk format"
      - "Automatic GPU acceleration applied transparently to every scan and join"
      - "A transactional table layer with ACID commits, schema evolution, and time travel"
      - "Transparent server-side encryption of the underlying object store and nothing else"
    answer: 2
    explanation: |
      Iceberg/Delta/Hudi provide a metadata/manifest layer over Parquet files giving
      ACID transactions, schema evolution, time-travel, and efficient file/partition
      pruning — the "lakehouse" model.
    ref: "concepts.md#columnar-formats-and-data-lakes"

  - id: analytics-columnar-timeseries-databases-023
    difficulty: intermediate
    tags: [data-lake, projection-pushdown]
    question: |
      A Trino query reads 2 of 40 columns from a 10 GB Parquet dataset and filters on a
      date. Which two mechanisms most reduce bytes read?
    options:
      - "Projection pushdown (read only requested column chunks) and predicate/min-max pruning of row groups"
      - "A full-table scan of all 40 columns followed by client-side filtering in Trino"
      - "Row-level locking with MVCC snapshots to isolate the concurrent readers"
      - "Encrypting the query result set and compressing the network channel to the client"
    answer: 0
    explanation: |
      Projection pushdown reads only the two requested column chunks; min-max
      statistics skip row groups whose date range can't match. Together they let the
      engine read a small fraction of the 10 GB.
    ref: "concepts.md#columnar-formats-and-data-lakes"

  - id: analytics-columnar-timeseries-databases-024
    difficulty: beginner
    tags: [mpp, warehouse]
    question: |
      What does MPP (as in an MPP data warehouse) stand for, and what does it do?
    options:
      - "Multi-Phase Persistence — it durably writes each row in several sequential phases"
      - "Massively Parallel Processing — it partitions data and runs query fragments in parallel across nodes"
      - "Managed Physical Partitioning — a service that manages on-disk partition placement"
      - "Message Passing Protocol — a broker-to-broker protocol for routing queries"
    answer: 1
    explanation: |
      MPP warehouses partition data across many nodes and execute a query as parallel
      fragments, each node scanning its slice locally before exchanging/aggregating
      partial results.
    ref: "concepts.md#mpp-warehouses-and-storagecompute-separation"

  - id: analytics-columnar-timeseries-databases-025
    difficulty: intermediate
    tags: [mpp, storage-compute-separation]
    question: |
      What is the primary benefit of separating storage from compute in a modern
      warehouse like Snowflake or BigQuery?
    options:
      - "It eliminates the need for columnar storage since compute reads rows directly"
      - "It removes the need to compress data because storage is billed separately"
      - "It guarantees serializable OLTP transactions across every compute cluster"
      - "Compute and storage scale independently; multiple compute clusters can read the same data without contention"
    answer: 3
    explanation: |
      With data in shared durable storage and stateless compute reading it on demand,
      you scale compute independently of storage and run isolated compute clusters
      (Snowflake virtual warehouses, BigQuery slots) against the same data.
    ref: "concepts.md#mpp-warehouses-and-storagecompute-separation"

  - id: analytics-columnar-timeseries-databases-026
    difficulty: intermediate
    tags: [mpp, shared-nothing]
    question: |
      In a classic shared-nothing MPP warehouse, what is a downside compared to the
      storage/compute-separated design?
    options:
      - "Resizing requires redistributing data, and storage and compute must scale together"
      - "It is architecturally unable to run any query fragments in parallel across nodes"
      - "It is incompatible with columnar storage and must store every table as rows"
      - "It provides no data locality, so every scan reads from a remote node"
    answer: 0
    explanation: |
      Shared-nothing nodes own their storage and CPU together, giving great locality
      but forcing data redistribution on resize and coupling storage and compute
      scaling (you pay for both even if you only need one).
    ref: "concepts.md#mpp-warehouses-and-storagecompute-separation"

  - id: analytics-columnar-timeseries-databases-027
    difficulty: advanced
    tags: [mpp, distribution-key, skew]
    question: |
      In Redshift, choosing a poor distribution key most directly causes what problem?
    options:
      - "Silent loss of the cluster's ACID transaction guarantees on that table"
      - "Block-level encryption failures when the skewed key is hashed to nodes"
      - "Automatic silent conversion of the affected table into a row store"
      - "Data skew — some nodes hold far more rows than others, creating stragglers"
    answer: 3
    explanation: |
      The distribution key determines how rows hash to nodes. A key with skewed value
      distribution concentrates rows on a few nodes, so those nodes become stragglers
      and dominate query time.
    ref: "concepts.md#mpp-warehouses-and-storagecompute-separation"

  - id: analytics-columnar-timeseries-databases-028
    difficulty: intermediate
    tags: [mpp, snowflake, isolation]
    question: |
      A company wants each analytics team to run heavy queries without slowing other
      teams, all against the same data. Which mechanism achieves this in Snowflake?
    options:
      - "Give each team its own independent virtual warehouse (compute) over the shared storage"
      - "Create a separate full physical copy of the data set for every analytics team"
      - "Lower the isolation level to READ UNCOMMITTED so queries never block each other"
      - "Add a dedicated covering index tuned to each team's most frequent queries"
    answer: 0
    explanation: |
      Storage/compute separation lets each team spin up an independent virtual
      warehouse that reads the central data in object storage, so one team's heavy
      query can't starve another's.
    ref: "concepts.md#mpp-warehouses-and-storagecompute-separation"

  - id: analytics-columnar-timeseries-databases-029
    difficulty: intermediate
    tags: [mpp, zone-maps, pruning]
    question: |
      What are "zone maps" (min-max block metadata) used for in a columnar warehouse
      such as Redshift?
    options:
      - "Transparently encrypting on-disk data blocks at rest for compliance"
      - "Skipping blocks whose min/max range cannot satisfy a query's predicate"
      - "Mapping each user's access permissions to their local time zone"
      - "Load-balancing incoming queries evenly across geographic regions"
    answer: 1
    explanation: |
      Zone maps store per-block min/max values so the engine can prune (skip) blocks
      that can't contain matching rows — the warehouse analog of Parquet row-group
      statistics. They are most effective when data is sorted on the filtered column.
    ref: "concepts.md#mpp-warehouses-and-storagecompute-separation"

  - id: analytics-columnar-timeseries-databases-030
    difficulty: beginner
    tags: [tsdb, workload]
    question: |
      What write pattern most defines a time-series database workload?
    options:
      - "Frequent random in-place updates to arbitrary rows anywhere in history"
      - "Single-row deletes scattered uniformly across the entire history of the series"
      - "Append-heavy, time-ordered writes where new data has the latest timestamp"
      - "Large multi-row ACID transactions spanning many normalized tables at once"
    answer: 2
    explanation: |
      TSDB ingest is overwhelmingly appends of the newest timestamp; existing points
      are rarely updated. This lets the engine keep recent time ranges hot and treat
      older ranges as immutable.
    ref: "concepts.md#time-series-databases"

  - id: analytics-columnar-timeseries-databases-031
    difficulty: intermediate
    tags: [tsdb, timescaledb, hypertable]
    question: |
      In TimescaleDB, what is a hypertable?
    options:
      - "Any hypertable is simply a table that has grown past one billion rows"
      - "An in-memory cache holding only the newest points before flush to disk"
      - "A materialized view that stores precomputed aggregates of the raw data"
      - "A logical table automatically partitioned into chunks by time"
    answer: 3
    explanation: |
      A hypertable presents as a single logical table but is transparently
      auto-partitioned into time-based chunks, so range queries touch only relevant
      chunks and old chunks can be compressed or dropped cheaply.
    ref: "concepts.md#time-series-databases"

  - id: analytics-columnar-timeseries-databases-032
    difficulty: intermediate
    tags: [tsdb, retention]
    question: |
      Why is dropping old data via a retention policy in a TSDB far cheaper than issuing
      row-by-row DELETEs?
    options:
      - "Old data is organized into time chunks/shards that can be dropped as whole units (a metadata operation)"
      - "The DELETE statement is disabled entirely in every time-series database engine"
      - "The TSDB compresses each DELETE statement into a compact batched log entry"
      - "Retention policies are offloaded to a GPU that erases rows in parallel"
    answer: 0
    explanation: |
      Because data is partitioned by time, expiring old data means dropping entire
      chunks/shards/blocks — a cheap metadata operation — instead of scanning and
      deleting individual rows and reclaiming space.
    ref: "concepts.md#time-series-databases"

  - id: analytics-columnar-timeseries-databases-033
    difficulty: intermediate
    tags: [tsdb, partitioning, range-query]
    question: |
      Why do TSDBs partition data by time interval?
    options:
      - "To enforce foreign-key constraints between rows in adjacent time intervals"
      - "Because the SQL standard mandates time-based partitioning for temporal columns"
      - "To guarantee serializable isolation across concurrent ingest and read queries"
      - "So range queries touch only relevant chunks, writes hit a small hot chunk, and old chunks expire cheaply"
    answer: 3
    explanation: |
      Time partitioning aligns storage with the dominant access pattern: `WHERE time
      BETWEEN a AND b` prunes to a few chunks, ingest concentrates on a small hot
      chunk, and retention drops whole old chunks.
    ref: "concepts.md#time-series-databases"

  - id: analytics-columnar-timeseries-databases-034
    difficulty: advanced
    tags: [tsdb, prometheus, storage]
    question: |
      Which describes Prometheus's local storage model?
    options:
      - "A single ever-growing row-oriented table protected by per-row locks"
      - "A write-ahead log plus a head block for recent data, periodically compacted into immutable time-window blocks"
      - "A global B-tree index built over every individual raw sample ingested"
      - "An in-memory-only store that keeps no durable on-disk copy at all"
    answer: 1
    explanation: |
      Prometheus ingests into an in-memory head block backed by a WAL for crash
      recovery, then compacts completed time windows into immutable on-disk blocks —
      matching the append-heavy, time-ordered workload.
    ref: "concepts.md#time-series-databases"

  - id: analytics-columnar-timeseries-databases-035
    difficulty: beginner
    tags: [downsampling, rollups]
    question: |
      What is the purpose of downsampling / roll-ups in a time-series system?
    options:
      - "To progressively increase the stored resolution of data as it ages"
      - "To encrypt historical data once it passes out of the hot window"
      - "To precompute coarser aggregates so long-range queries read small pre-aggregated tables"
      - "To replicate the raw high-resolution data to another geographic region"
    answer: 2
    explanation: |
      Roll-ups precompute coarser aggregates (1-min → 1-hour → 1-day). Long-range
      dashboards then query the small pre-aggregated series while raw high-resolution
      data is retained only briefly.
    ref: "concepts.md#downsampling-roll-ups--continuous-aggregates"

  - id: analytics-columnar-timeseries-databases-036
    difficulty: intermediate
    tags: [continuous-aggregate, timescaledb]
    question: |
      What distinguishes a TimescaleDB continuous aggregate from a plain materialized
      view?
    options:
      - "It is always stored in a row store rather than the columnar chunk format"
      - "It automatically disables compression on the underlying hypertable"
      - "It cannot be queried directly and is only readable by background jobs"
      - "It refreshes incrementally, recomputing only new/changed time buckets rather than the whole view"
    answer: 3
    explanation: |
      A continuous aggregate is an incrementally-refreshed materialized view over a
      hypertable: only recently changed time buckets are recomputed, avoiding a full
      recomputation of the entire aggregate.
    ref: "concepts.md#downsampling-roll-ups--continuous-aggregates"

  - id: analytics-columnar-timeseries-databases-037
    difficulty: intermediate
    tags: [prometheus, recording-rules]
    question: |
      What do Prometheus recording rules do?
    options:
      - "Continuously write every raw scrape sample straight to disk in uncompressed plaintext"
      - "Enforce the configured retention window by deleting time series once they age out"
      - "Define how firing alerts get routed and grouped before delivery to Alertmanager"
      - "Precompute expensive query expressions on a schedule and store the result as a new series"
    answer: 3
    explanation: |
      Recording rules evaluate potentially expensive PromQL expressions at regular
      intervals and store the results as new time series, so dashboards and alerts read
      the cheap precomputed series instead of recomputing each time.
    ref: "concepts.md#downsampling-roll-ups--continuous-aggregates"

  - id: analytics-columnar-timeseries-databases-038
    difficulty: advanced
    tags: [rollups, composability, aggregation]
    question: |
      You want to build hourly roll-ups from minute-level roll-ups without touching raw
      data. Which aggregate is NOT directly re-aggregable and needs a sketch or the
      component values?
    options:
      - "SUM of the per-bucket subtotals"
      - "MIN of the per-bucket minimums"
      - "COUNT(DISTINCT users)"
      - "MAX of the per-bucket maximums"
    answer: 2
    explanation: |
      SUM/MIN/MAX/COUNT are composable across buckets. AVG needs (sum, count).
      COUNT(DISTINCT) and percentiles are not directly re-aggregable and require
      sketches such as HyperLogLog or t-digest to combine buckets correctly.
    ref: "concepts.md#downsampling-roll-ups--continuous-aggregates"

  - id: analytics-columnar-timeseries-databases-039
    difficulty: intermediate
    tags: [rollups, tiered-retention]
    question: |
      A tiered retention strategy keeps raw data 7 days, 1-minute roll-ups 90 days, and
      1-hour roll-ups 2 years. What is the main benefit?
    options:
      - "It guarantees exactly-once ingestion so no duplicate samples are ever written to disk"
      - "It combines cheap long-range history at low resolution with short-term high-resolution detail"
      - "It removes the need for time-based partitioning by storing every resolution in one chunk"
      - "It makes every analytic query run under serializable isolation automatically"
    answer: 1
    explanation: |
      Tiered retention trades resolution for cost over time: recent data stays detailed
      for debugging, while long history is kept only as small low-resolution roll-ups,
      controlling storage and long-range query cost.
    ref: "concepts.md#downsampling-roll-ups--continuous-aggregates"

  - id: analytics-columnar-timeseries-databases-040
    difficulty: beginner
    tags: [cardinality, tsdb]
    question: |
      In Prometheus/InfluxDB terms, what is series cardinality?
    options:
      - "The number of individual samples the server ingests and appends per second across all series"
      - "The total on-disk size in bytes of the write-ahead log before its next compaction"
      - "The number of unique time series = distinct combinations of metric name plus all label/tag key-value pairs"
      - "The configured retention period, in days, before old series are expired from storage"
    answer: 2
    explanation: |
      Each unique metric-name-plus-label-set combination is a separate series with its
      own index entry and storage stream. Series cardinality counts those unique
      combinations.
    ref: "concepts.md#cardinality-explosion-in-tsdb"

  - id: analytics-columnar-timeseries-databases-041
    difficulty: intermediate
    tags: [cardinality, labels, gotcha]
    question: |
      Which label would most likely cause a cardinality explosion in Prometheus?
    options:
      - "`method` with values GET/POST/PUT/DELETE"
      - "`status` with values 200/404/500"
      - "`user_id` with millions of distinct values"
      - "`region` with values us-east/us-west/eu"
    answer: 2
    explanation: |
      Cardinality is multiplicative across labels. An unbounded, high-cardinality label
      like `user_id` creates millions of one-point series, ballooning the index and
      risking OOM. Bounded labels (method/status/region) are fine.
    ref: "concepts.md#cardinality-explosion-in-tsdb"

  - id: analytics-columnar-timeseries-databases-042
    difficulty: intermediate
    tags: [cardinality, oom]
    question: |
      A Prometheus server keeps running out of memory shortly after a deploy that added
      a new label. What is the most likely cause?
    options:
      - "The global scrape interval was lowered to 1s, so each target is polled far more often"
      - "The write-ahead log was compressed too aggressively, corrupting recently ingested blocks"
      - "Recording rules were disabled, forcing every dashboard to recompute its PromQL live"
      - "A high-cardinality value (e.g. request ID or full URL) was placed into a label, exploding series count"
    answer: 3
    explanation: |
      The classic Prometheus failure mode: an unbounded identifier (request ID, raw
      URL, session ID) in a label multiplies series count, growing the in-memory
      inverted index until the process OOMs.
    ref: "concepts.md#cardinality-explosion-in-tsdb"

  - id: analytics-columnar-timeseries-databases-043
    difficulty: intermediate
    tags: [cardinality, mitigation]
    question: |
      Which is a sound mitigation for TSDB cardinality explosion?
    options:
      - "Move unbounded identifiers out of tags/labels into fields or logs, keeping tags bounded"
      - "Add more high-cardinality tags so the series spread evenly across the storage shards"
      - "Increase the scrape frequency so each series is sampled at a finer time resolution"
      - "Disable block compression to save CPU cycles during the ingest hot path"
    answer: 0
    explanation: |
      Labels/tags should be bounded dimensions you group/filter by. Unbounded
      identifiers belong in fields or log lines (not indexed as separate series), or
      should be dropped/aggregated at ingest via relabeling.
    ref: "concepts.md#cardinality-explosion-in-tsdb"

  - id: analytics-columnar-timeseries-databases-044
    difficulty: intermediate
    tags: [decision, warehouse-vs-oltp]
    question: |
      A team asks whether they can "just add indexes to Postgres" to make full-table
      analytic aggregations fast. What is the correct mechanism-level response?
    options:
      - "Yes — a wide covering index always makes a GROUP BY over the whole table fast"
      - "Indexes help selective lookups, not scan-and-aggregate; the win comes from columnar layout, compression, and parallel scan"
      - "Indexes silently convert Postgres heap tables into a column store behind the scenes"
      - "Only raising isolation to SERIALIZABLE lets the planner make analytic scans fast"
    answer: 1
    explanation: |
      Indexes accelerate selective access to a few rows. Queries that read most of a
      table gain little; analytic performance comes from a different storage/execution
      model (columnar, compression, vectorized parallel scan).
    ref: "concepts.md#when-to-use-a-warehouse-vs-an-oltp-database"

  - id: analytics-columnar-timeseries-databases-045
    difficulty: beginner
    tags: [decision, architecture]
    question: |
      What is the standard architecture for serving both application transactions and
      heavy analytics?
    options:
      - "Run all heavy analytic queries directly on the OLTP primary alongside live traffic"
      - "Use a single time-series database as the store for both transactions and analytics"
      - "OLTP as the system of record, with data replicated into a warehouse/lake via ETL or CDC for analytics"
      - "Store all data only as Parquet files in object storage and drop the OLTP database"
    answer: 2
    explanation: |
      The transactional database remains the system of record; data flows to a
      columnar warehouse or lake via ETL/CDC so analytics never contend with (or slow)
      the OLTP workload.
    ref: "concepts.md#when-to-use-a-warehouse-vs-an-oltp-database"

  - id: analytics-columnar-timeseries-databases-046
    difficulty: intermediate
    tags: [decision, engine-choice]
    question: |
      An application needs millisecond point reads/writes by primary key for many
      concurrent users, with single-row updates and strong per-transaction consistency.
      Which engine fits?
    options:
      - "A columnar MPP warehouse like BigQuery tuned for large scan-and-aggregate queries"
      - "A row-oriented OLTP database like PostgreSQL or MySQL"
      - "A Parquet-on-S3 data lake queried on demand by a Trino cluster"
      - "A Prometheus time-series database ingesting append-only timestamped samples"
    answer: 1
    explanation: |
      Point reads/writes by key, single-row updates, high concurrency, and strong
      transactional consistency at millisecond latency are exactly what a row-oriented
      OLTP database is built for; warehouses/lakes/TSDBs target other workloads.
    ref: "concepts.md#when-to-use-a-warehouse-vs-an-oltp-database"

  - id: analytics-columnar-timeseries-databases-047
    difficulty: intermediate
    tags: [decision, tsdb]
    question: |
      For which workload is a time-series database the best fit?
    options:
      - "Storing and joining highly normalized customer and order tables behind an app"
      - "Running ad-hoc BI joins across large fact and dimension tables in a warehouse"
      - "Append-heavy metrics/sensor readings keyed by time with retention and downsampling needs"
      - "Serving a shopping cart that does frequent per-row updates under high concurrency"
    answer: 2
    explanation: |
      A TSDB shines when the primary key is time and the workload is append-heavy
      metrics with time-range queries, retention, and downsampling — not relational
      app data, BI joins, or transactional cart updates.
    ref: "concepts.md#when-to-use-a-warehouse-vs-an-oltp-database"

  - id: analytics-columnar-timeseries-databases-048
    difficulty: advanced
    tags: [bigquery, serverless, mpp]
    question: |
      How does BigQuery's compute model differ from Snowflake's virtual warehouses at
      the mechanism level?
    options:
      - "BigQuery runs on a fixed shared-nothing cluster whose nodes you must resize by hand"
      - "BigQuery hides nodes behind a serverless slot model, whereas Snowflake exposes explicitly-sized virtual warehouses"
      - "BigQuery stores its tables row-oriented while Snowflake keeps them in a columnar layout"
      - "BigQuery couples storage and compute together with no separation between the two"
    answer: 1
    explanation: |
      Both separate storage from compute over columnar storage. BigQuery is serverless,
      allocating query capacity as slots with no cluster to size, while Snowflake
      exposes user-controlled, sizeable virtual warehouses.
    ref: "concepts.md#mpp-warehouses-and-storagecompute-separation"
