topic: "Redis & Caching Strategies"
domain: messaging-databases
topic_slug: redis-caching-strategies
version: 1
questions:
  - id: redis-caching-strategies-001
    difficulty: beginner
    tags: [event-loop, single-threaded, performance]
    question: |
      Why can Redis treat individual commands like INCR or LPUSH as atomic without
      the application taking any locks?
    options:
      - "Command execution runs on a single thread, so commands never interleave"
      - "Redis wraps every command in a database transaction with rollback"
      - "Redis uses optimistic locking with per-key version numbers by default"
      - "The client library serializes commands before sending them"
    answer: 0
    explanation: |
      Redis processes each command to completion on one thread driven by an event loop.
      Because commands cannot interleave, operations like INCR and LPUSH are inherently
      atomic without application-level locks.
    ref: "concepts.md#single-threaded-event-loop-and-why-redis-is-fast"

  - id: redis-caching-strategies-002
    difficulty: beginner
    tags: [event-loop, performance, in-memory]
    question: |
      What is the primary reason Redis achieves microsecond-level latency for a GET?
    options:
      - "It compresses all values with LZ4 before caching them in RAM"
      - "Data lives in RAM, so a GET is an in-memory hash-table lookup with no disk seek"
      - "It caches parsed query plans in a shared buffer like a relational engine"
      - "It uses one dedicated OS thread per client connection to parallelize reads"
    answer: 1
    explanation: |
      Redis keeps the whole dataset in memory, so reads are hash-table lookups with no
      disk I/O on the hot path. Combined with efficient structures and multiplexed I/O,
      this yields tens-of-microseconds latency.
    ref: "concepts.md#single-threaded-event-loop-and-why-redis-is-fast"

  - id: redis-caching-strategies-003
    difficulty: intermediate
    tags: [event-loop, slow-commands, keys, scan]
    question: |
      A developer runs KEYS * on a production instance with 20 million keys and every
      other client suddenly times out. Why?
    options:
      - "KEYS replicates to every replica synchronously, saturating the replication link"
      - "KEYS acquires a global write lock on the keyspace that blocks all readers"
      - "KEYS is O(N) and runs on the single command thread, blocking all other clients until it finishes"
      - "KEYS triggers an immediate synchronous BGSAVE fork that pauses the server"
    answer: 2
    explanation: |
      KEYS scans the entire keyspace (O(N)) and executes on the one command thread, so no
      other command runs until it completes. Use SCAN, which returns results incrementally
      via a cursor.
    ref: "concepts.md#single-threaded-event-loop-and-why-redis-is-fast"

  - id: redis-caching-strategies-004
    difficulty: intermediate
    tags: [event-loop, io-threads, redis6]
    question: |
      What did the io-threads option introduced in Redis 6 actually parallelize?
    options:
      - "Execution of read and write commands spread across multiple CPU cores"
      - "Background RDB snapshotting so the fork stops competing for the main thread"
      - "Lua script evaluation, letting EVAL bodies run in parallel on worker threads"
      - "Reading requests from and writing replies to client sockets, while command execution stays single-threaded"
    answer: 3
    explanation: |
      io-threads parallelize the network I/O (parsing requests and writing replies).
      The command execution itself remains single-threaded, preserving atomicity.
    ref: "concepts.md#single-threaded-event-loop-and-why-redis-is-fast"

  - id: redis-caching-strategies-005
    difficulty: beginner
    tags: [data-structures, hash]
    question: |
      You need to store a user object with fields name, plan, and login-count, and update
      just the login count atomically. Which Redis type fits best?
    options:
      - "A Hash, using HINCRBY to bump the login-count field"
      - "A single String holding the object as JSON"
      - "A List, pushing each field as an ordered element"
      - "A separate String key for each object field"
    answer: 0
    explanation: |
      A Hash stores an object's fields together and supports HINCRBY for atomic per-field
      increments without read-modify-write of a whole JSON blob. Small hashes also use a
      compact listpack encoding.
    ref: "concepts.md#core-data-structures-and-their-use-cases"

  - id: redis-caching-strategies-006
    difficulty: beginner
    tags: [data-structures, set]
    question: |
      Which Redis type is the natural fit for storing the set of unique tags on an article
      and testing membership quickly?
    options:
      - "List (RPUSH / LRANGE), scanning the list for membership"
      - "Set (SADD / SISMEMBER)"
      - "Sorted set (ZADD), using rank order for membership"
      - "Stream (XADD), appending each tag as an entry"
    answer: 1
    explanation: |
      A Set stores unordered unique members and offers O(1) SISMEMBER membership tests plus
      set algebra (SINTER, SUNION), which is exactly what tag storage needs.
    ref: "concepts.md#core-data-structures-and-their-use-cases"

  - id: redis-caching-strategies-007
    difficulty: intermediate
    tags: [data-structures, encoding, memory]
    question: |
      A small hash with a few integer fields uses far less memory than expected. Why?
    options:
      - "Redis transparently gzip-compresses every field value before storing it"
      - "Integer fields are stored as shared pointers into a global interned-integer pool"
      - "Small hashes use a compact listpack encoding until hash-max-listpack-entries/-value is exceeded"
      - "Redis deduplicates identical field names across all hashes into one shared table"
    answer: 2
    explanation: |
      Small collections use compact encodings (listpack for small hashes/zsets, intset for
      integer-only sets). They upgrade to the general hashtable/skiplist only when the
      configured entry/value thresholds are exceeded.
    ref: "concepts.md#core-data-structures-and-their-use-cases"

  - id: redis-caching-strategies-008
    difficulty: intermediate
    tags: [data-structures, list, queue]
    question: |
      Which command lets a consumer block-wait for the next item on a Redis list used as a
      simple work queue, instead of polling?
    options:
      - "LRANGE"
      - "LINDEX"
      - "SUBSCRIBE"
      - "BLPOP"
    answer: 3
    explanation: |
      BLPOP (and BRPOP) blocks until an element is available or a timeout elapses, letting a
      worker wait for the next queued item without busy-polling with repeated LPOP.
    ref: "concepts.md#core-data-structures-and-their-use-cases"

  - id: redis-caching-strategies-009
    difficulty: beginner
    tags: [zset, leaderboard]
    question: |
      Which single command returns the top 10 players by score (highest first) from a
      leaderboard sorted set?
    options:
      - "ZREVRANGE leaderboard 0 9 WITHSCORES"
      - "ZRANGE leaderboard 0 9 WITHSCORES ASC"
      - "SORT leaderboard BY score DESC LIMIT 0 10"
      - "LRANGE leaderboard 0 9 REV WITHSCORES"
    answer: 0
    explanation: |
      ZREVRANGE returns members ordered by descending score; 0 9 selects the top ten, and
      WITHSCORES includes the scores. ZRANGE alone would return lowest scores first.
    ref: "concepts.md#sorted-sets-for-leaderboards-and-rate-limiting"

  - id: redis-caching-strategies-010
    difficulty: advanced
    tags: [zset, internals, skiplist]
    question: |
      What internal structures let a ZSET answer both "rank of member X" and "top N by
      score" efficiently?
    options:
      - "A single balanced B-tree keyed by member name for both queries"
      - "A skip list ordered by score plus a hash table mapping member to score"
      - "A red-black tree keyed only by score, with member rank scanned linearly"
      - "Two parallel sorted arrays kept in lockstep, one by member and one by score"
    answer: 1
    explanation: |
      A ZSET pairs a skip list (ordered by score, giving O(log N) rank/range) with a hash
      table (member to score, giving O(1) score lookup). The two together enable both range
      and point queries cheaply.
    ref: "concepts.md#sorted-sets-for-leaderboards-and-rate-limiting"

  - id: redis-caching-strategies-011
    difficulty: intermediate
    tags: [zset, rate-limiting, sliding-window]
    question: |
      In a sliding-window rate limiter built on a sorted set (score = timestamp), what does
      ZREMRANGEBYSCORE accomplish on each request?
    options:
      - "It increments the request counter atomically and returns the new total"
      - "It blocks and queues new requests server-side once the configured limit is reached"
      - "It removes entries older than the window so ZCARD reflects only the current window"
      - "It resets the entire sorted set to empty at the start of each window"
    answer: 2
    explanation: |
      ZREMRANGEBYSCORE drops entries whose timestamp score is older than (now - window), so
      a subsequent ZCARD counts only requests inside the sliding window. If that count
      exceeds the limit, you reject.
    ref: "concepts.md#sorted-sets-for-leaderboards-and-rate-limiting"

  - id: redis-caching-strategies-012
    difficulty: intermediate
    tags: [rate-limiting, fixed-window, tradeoffs]
    question: |
      Compared with a sliding-window limiter, a simple fixed-window counter (INCR + EXPIRE
      per minute) has which drawback?
    options:
      - "It cannot use EXPIRE to self-clean and must be swept by a background job"
      - "It requires a Lua script wrapping INCR and EXPIRE to be atomic at all"
      - "It stores the full per-request timestamp history and never frees that memory"
      - "It can allow up to roughly 2x the limit as a burst across the window boundary"
    answer: 3
    explanation: |
      Fixed windows are cheap but a client can send a full limit at the end of one window and
      another full limit at the start of the next, permitting ~2x burst near the boundary.
      Sliding windows smooth this out at higher cost.
    ref: "concepts.md#sorted-sets-for-leaderboards-and-rate-limiting"

  - id: redis-caching-strategies-013
    difficulty: advanced
    tags: [rate-limiting, lua, atomicity]
    question: |
      Why is wrapping a multi-step rate-limit check in a Lua EVAL script preferable to
      issuing the same commands separately from the client?
    options:
      - "The whole script executes atomically on the single thread, eliminating check-then-act races and extra round-trips"
      - "Lua scripts run on a dedicated scripting thread pool for extra parallel speed"
      - "Lua automatically retries the check on optimistic WATCH/MULTI conflicts for you"
      - "EVAL bypasses the AOF append path, making the limiter counters more durable"
    answer: 0
    explanation: |
      A Lua script runs to completion on Redis's single thread with no interleaving from
      other clients, so the read-decide-write sequence is atomic and needs one round-trip
      instead of racing separate commands.
    ref: "concepts.md#sorted-sets-for-leaderboards-and-rate-limiting"

  - id: redis-caching-strategies-014
    difficulty: intermediate
    tags: [hyperloglog, cardinality]
    question: |
      HyperLogLog (PFADD/PFCOUNT) is the right choice when you need to:
    options:
      - "Retrieve the exact enumerated list of every unique visitor seen"
      - "Approximate the count of distinct elements in tiny fixed memory (~12 KB, ~0.81% error)"
      - "Rank elements by access frequency and return the top-K heavy hitters"
      - "Store a compact per-user boolean flag indexed by numeric user id"
    answer: 1
    explanation: |
      HyperLogLog estimates cardinality (distinct count) in ~12 KB regardless of how many
      elements, with ~0.81% standard error. It cannot enumerate the members, only count them.
    ref: "concepts.md#streams-hyperloglog-bitmaps-and-geo"

  - id: redis-caching-strategies-015
    difficulty: intermediate
    tags: [bitmap, dau]
    question: |
      To compute how many users were active on BOTH of two days when activity is recorded
      with SETBIT dau:<date> <userid> 1, which operation gives the answer?
    options:
      - "PFMERGE of the two keys, then PFCOUNT"
      - "SINTER of the two keys, then SCARD"
      - "BITOP AND into a destination key, then BITCOUNT"
      - "ZINTERSTORE, then ZCARD"
    answer: 2
    explanation: |
      Bitmaps store one bit per user id. BITOP AND intersects the two day bitmaps into a
      destination, and BITCOUNT counts the set bits, giving the users active on both days.
    ref: "concepts.md#streams-hyperloglog-bitmaps-and-geo"

  - id: redis-caching-strategies-016
    difficulty: advanced
    tags: [streams, consumer-groups, pel]
    question: |
      A consumer in a Redis Streams consumer group crashes after reading messages but before
      XACK. What tracks those un-acknowledged messages and how are they reassigned?
    options:
      - "They are lost permanently the moment the consumer's connection drops"
      - "They are automatically re-broadcast to every consumer in the group via Pub/Sub"
      - "A background sweeper job re-runs XADD to duplicate them back onto the stream"
      - "The Pending Entries List (PEL) tracks them; XCLAIM/XAUTOCLAIM reassign them to another consumer"
    answer: 3
    explanation: |
      Each consumer group keeps a Pending Entries List of delivered-but-un-acked messages.
      XCLAIM/XAUTOCLAIM lets another consumer take ownership of messages idle past a
      threshold, giving at-least-once delivery despite a dead consumer.
    ref: "concepts.md#streams-hyperloglog-bitmaps-and-geo"

  - id: redis-caching-strategies-017
    difficulty: beginner
    tags: [geo, geospatial]
    question: |
      Redis geospatial commands (GEOADD, GEOSEARCH) are implemented on top of which
      underlying data structure?
    options:
      - "A Sorted set whose scores are geohash values"
      - "A Set holding longitude/latitude coordinate pair strings"
      - "A Hash keyed by discrete grid-cell identifier"
      - "A Stream appending each location update as an event"
    answer: 0
    explanation: |
      Geo commands encode longitude/latitude into a 52-bit geohash used as the score in a
      sorted set, so radius queries become score-range operations over the ZSET.
    ref: "concepts.md#streams-hyperloglog-bitmaps-and-geo"

  - id: redis-caching-strategies-018
    difficulty: beginner
    tags: [ttl, expiry]
    question: |
      What does TTL return for a key that exists but has no expiration set?
    options:
      - "0"
      - "-1"
      - "-2"
      - "nil"
    answer: 1
    explanation: |
      TTL returns -1 for a key with no expiry, -2 if the key does not exist, and the
      remaining seconds otherwise.
    ref: "concepts.md#ttl-expiry-and-eviction-policies"

  - id: redis-caching-strategies-019
    difficulty: intermediate
    tags: [ttl, expiry, active-passive]
    question: |
      By what two mechanisms does Redis actually remove keys whose TTL has elapsed?
    options:
      - "Only when the operating system reclaims the memory page holding that key"
      - "A single expiry sweep performed by the child process during each BGSAVE snapshot"
      - "Passively on access, plus an active background cycle that samples keys with TTLs"
      - "A dedicated expiry thread that scans every key continuously"
    answer: 2
    explanation: |
      Expired keys are removed lazily when accessed and by an active cycle (~10x/sec) that
      probabilistically samples keys from the expires dictionary. So an expired key can
      linger in memory until sampled or touched.
    ref: "concepts.md#ttl-expiry-and-eviction-policies"

  - id: redis-caching-strategies-020
    difficulty: intermediate
    tags: [eviction, maxmemory, default]
    question: |
      An engineer uses Redis purely as a cache but never sets maxmemory-policy. When memory
      fills up, what happens with the default policy?
    options:
      - "The oldest keys are automatically evicted (allkeys-lru)"
      - "Redis flushes the entire database to reclaim space instantly"
      - "Redis transparently swaps colder keys out to disk to free up RAM"
      - "Writes are rejected with an OOM error because the default is noeviction"
    answer: 3
    explanation: |
      The default maxmemory-policy is noeviction: once memory is full, write commands fail
      with 'OOM command not allowed'. For a cache you should set maxmemory plus an eviction
      policy such as allkeys-lru.
    ref: "concepts.md#ttl-expiry-and-eviction-policies"

  - id: redis-caching-strategies-021
    difficulty: intermediate
    tags: [eviction, volatile, ttl]
    question: |
      With maxmemory-policy set to volatile-lru, memory is full and writes start failing even
      though many keys exist. What is the most likely cause?
    options:
      - "volatile-lru only evicts keys that have a TTL, and too few keys have one"
      - "volatile-lru silently requires AOF persistence to be enabled first"
      - "volatile-lru evicts randomly and missed the large keys"
      - "volatile-lru never actually evicts anything; it only passively expires keys"
    answer: 0
    explanation: |
      volatile-* policies consider only keys that have a TTL set. If most keys have no
      expiration, there is nothing eligible to evict and writes can still hit OOM. Use
      allkeys-lru or ensure keys carry TTLs.
    ref: "concepts.md#ttl-expiry-and-eviction-policies"

  - id: redis-caching-strategies-022
    difficulty: advanced
    tags: [eviction, lru, lfu, sampling]
    question: |
      Redis's LRU and LFU eviction are described as "approximate." What does that mean
      mechanically?
    options:
      - "They pick keys uniformly at random from the whole keyspace, ignoring recency or frequency entirely"
      - "Redis samples maxmemory-samples candidate keys and evicts the best among the sample, not a globally exact LRU/LFU"
      - "They only run during the BGSAVE fork, evicting candidates while the snapshot child process is active"
      - "They maintain a global doubly-linked list threading every key in exact last-access order"
    answer: 1
    explanation: |
      Rather than maintain a global exact ordering, Redis samples a small number of keys
      (maxmemory-samples, default 5) and evicts the best candidate in that sample. More
      samples means closer to true LRU/LFU at higher CPU cost.
    ref: "concepts.md#ttl-expiry-and-eviction-policies"

  - id: redis-caching-strategies-023
    difficulty: intermediate
    tags: [persistence, rdb, fork, cow]
    question: |
      How does BGSAVE avoid blocking the main Redis process while writing a snapshot?
    options:
      - "It streams keys to disk one at a time in between servicing individual client commands"
      - "It pauses all incoming writes and only allows read commands for the duration of the dump"
      - "It fork()s a child that uses copy-on-write memory while the parent keeps serving"
      - "It offloads the entire snapshot dump to a connected replica over the replication link"
    answer: 2
    explanation: |
      BGSAVE forks a child process that shares memory copy-on-write with the parent. The
      child writes a consistent point-in-time image while the parent keeps serving clients;
      only pages modified during the dump get copied.
    ref: "concepts.md#persistence-rdb-vs-aof"

  - id: redis-caching-strategies-024
    difficulty: beginner
    tags: [persistence, aof, appendfsync, default]
    question: |
      What is the default appendfsync setting for AOF, and what is its worst-case data loss
      on a crash?
    options:
      - "always; effectively no loss"
      - "no; up to several minutes"
      - "everysec; up to about one minute"
      - "everysec; up to about one second of writes"
    answer: 3
    explanation: |
      The default appendfsync is everysec, which fsyncs the AOF once per second, bounding
      worst-case loss to roughly one second. 'always' loses almost nothing but is slowest;
      'no' defers to the OS flush.
    ref: "concepts.md#persistence-rdb-vs-aof"

  - id: redis-caching-strategies-025
    difficulty: intermediate
    tags: [persistence, rdb, aof, tradeoffs]
    question: |
      Which statement correctly contrasts RDB and AOF?
    options:
      - "RDB gives a smaller/faster-to-load file but a wider data-loss window; AOF gives better durability but larger files and slower replay"
      - "AOF always produces a smaller on-disk file and restarts faster than loading an RDB snapshot"
      - "RDB logs every individual write command as it happens; AOF instead stores a compact binary snapshot"
      - "RDB guarantees zero data loss on any crash; AOF files can never be used for backups or restores"
    answer: 0
    explanation: |
      RDB is a compact binary snapshot: fast to load and small, but you lose everything since
      the last snapshot on a crash. AOF logs writes for a tighter loss window (~1s with
      everysec) at the cost of larger files and slower replay on restart.
    ref: "concepts.md#persistence-rdb-vs-aof"

  - id: redis-caching-strategies-026
    difficulty: advanced
    tags: [persistence, aof-rewrite]
    question: |
      Why does Redis periodically perform an AOF rewrite (BGREWRITEAOF)?
    options:
      - "To convert the AOF command log into an equivalent compact RDB binary snapshot"
      - "To compact the ever-growing log into fewer commands that reproduce current state"
      - "To fsync the AOF to disk far more aggressively than the appendfsync setting allows"
      - "To stream the AOF file over to each connected replica for durable off-node storage"
    answer: 1
    explanation: |
      The AOF grows with every write. A rewrite produces a compact AOF that reproduces the
      current dataset using fewer commands, bounding file size and speeding restart replay.
      Redis 7 uses a multi-part AOF (base + incremental files).
    ref: "concepts.md#persistence-rdb-vs-aof"

  - id: redis-caching-strategies-027
    difficulty: advanced
    tags: [persistence, restart, aof, rdb]
    question: |
      When both RDB and AOF are enabled, which file does Redis load on restart, and why?
    options:
      - "The RDB snapshot, because its binary format always loads faster than replaying an AOF"
      - "Whichever of the two files currently has the smaller on-disk size at startup"
      - "The AOF, because it is the more complete and recent record of writes"
      - "It merges the two files key by key, preferring the newest value it finds in either"
    answer: 2
    explanation: |
      With both enabled, Redis loads the AOF on restart because it captures writes since the
      last snapshot and is therefore the more up-to-date, complete record.
    ref: "concepts.md#persistence-rdb-vs-aof"

  - id: redis-caching-strategies-028
    difficulty: beginner
    tags: [cache-aside, patterns]
    question: |
      In the cache-aside (lazy loading) pattern, what happens on a cache miss for a read?
    options:
      - "The cache library itself transparently loads the value from the database for you"
      - "The request fails immediately and the client is expected to retry the read later"
      - "The database asynchronously pushes the freshly-read value back into the cache itself"
      - "The application reads from the DB, then populates the cache with a TTL"
    answer: 3
    explanation: |
      In cache-aside the application manages the cache: on a miss it reads the database and
      then writes the value into the cache (usually with a TTL) so subsequent reads hit.
    ref: "concepts.md#cache-aside-read-through-write-through-and-write-behind"

  - id: redis-caching-strategies-029
    difficulty: intermediate
    tags: [write-behind, patterns, durability]
    question: |
      Which caching pattern offers the lowest write latency but risks losing acknowledged
      writes if the cache node crashes before flushing?
    options:
      - "Write-behind (write-back)"
      - "Cache-aside"
      - "Write-through"
      - "Read-through"
    answer: 0
    explanation: |
      Write-behind acks the write immediately after hitting the cache and flushes to the DB
      asynchronously. That minimizes write latency and can batch writes, but a crash before
      the flush loses acknowledged data and leaves the DB stale.
    ref: "concepts.md#cache-aside-read-through-write-through-and-write-behind"

  - id: redis-caching-strategies-030
    difficulty: intermediate
    tags: [write-through, read-through, patterns]
    question: |
      How does write-through differ from cache-aside on writes?
    options:
      - "Write-through deletes the cached key and lets the next read repopulate it"
      - "Write-through routes the write through the cache, which synchronously writes to the DB before acking"
      - "Write-through never touches the database at all, keeping the written value only in the cache"
      - "Write-through applies only to read-heavy workloads and is skipped entirely for write paths"
    answer: 1
    explanation: |
      In write-through, writes go through the caching layer, which synchronously updates the
      database before acknowledging, keeping cache and DB consistent at the cost of higher
      write latency. Cache-aside instead has the app write the DB and invalidate the cache.
    ref: "concepts.md#cache-aside-read-through-write-through-and-write-behind"

  - id: redis-caching-strategies-031
    difficulty: advanced
    tags: [invalidation, consistency, patterns]
    question: |
      On a database write, why is deleting the cached key generally safer than updating it in
      place?
    options:
      - "The DEL command executes measurably faster than an in-place SET update in Redis"
      - "Redis strings are immutable, so an existing key can never be overwritten in place"
      - "Updating in place can race with concurrent readers/writers and persist a stale value; deleting forces a fresh reload from the source of truth"
      - "Updating a key in place leaks the old allocation, whereas deleting reclaims that memory"
    answer: 2
    explanation: |
      Updating the cache in place invites lost-update/interleaving races where a stale value
      overwrites a fresh one. Deleting the key means the next read repopulates from the
      authoritative database, avoiding a persisted stale value.
    ref: "concepts.md#cache-aside-read-through-write-through-and-write-behind"

  - id: redis-caching-strategies-032
    difficulty: intermediate
    tags: [stampede, thundering-herd]
    question: |
      What is a cache stampede (thundering herd / dogpile)?
    options:
      - "The cache exhausts its maxmemory budget and evicts the entire keyspace at once"
      - "Replication lag between primary and replicas causes clients to read stale values"
      - "A single client floods the server with repeated O(N) KEYS commands, blocking it"
      - "A hot key expires and many concurrent requests all miss and hit the database at once, often recomputing the same value"
    answer: 3
    explanation: |
      A stampede occurs when a popular key expires or is missing and a burst of concurrent
      requests all miss simultaneously, hammering the DB and redundantly recomputing the same
      value.
    ref: "concepts.md#cache-invalidation-and-the-thundering-herd--stampede-problem"

  - id: redis-caching-strategies-033
    difficulty: intermediate
    tags: [stampede, mutex, coalescing]
    question: |
      Which technique ensures that when a hot key misses, only ONE worker recomputes it while
      others briefly wait and re-read?
    options:
      - "A short-lived lock (SET lock:key uuid NX PX ...) for request coalescing"
      - "Adding random TTL jitter so the hot key's expirations are spread over time"
      - "Increasing the maxmemory-samples value so eviction inspects more candidate keys"
      - "Switching the caching pattern from cache-aside over to synchronous write-through"
    answer: 0
    explanation: |
      A mutex/coalescing lock (SET ... NX PX) lets the first caller win the right to
      recompute; the others wait briefly and re-read the repopulated cache, so the DB sees a
      single recompute instead of a stampede.
    ref: "concepts.md#cache-invalidation-and-the-thundering-herd--stampede-problem"

  - id: redis-caching-strategies-034
    difficulty: intermediate
    tags: [ttl-jitter, invalidation]
    question: |
      Why add randomness (jitter) to cache TTLs?
    options:
      - "To make the approximate LRU/LFU eviction sampling more accurate under pressure"
      - "So many keys do not expire at the same instant and cause a synchronized flood of misses"
      - "To reduce overall memory usage by letting some keys expire sooner than intended"
      - "To force the per-key LFU access counters to decay noticeably faster over time"
    answer: 1
    explanation: |
      Setting TTL = base + random spread staggers expirations. Without jitter, keys populated
      together expire together, producing a synchronized wave of misses (a mini avalanche)
      that overwhelms the DB.
    ref: "concepts.md#cache-invalidation-and-the-thundering-herd--stampede-problem"

  - id: redis-caching-strategies-035
    difficulty: advanced
    tags: [invalidation, versioned-keys]
    question: |
      A team wants to invalidate a cached object without a race between delete and reload.
      Which approach avoids deleting and instead makes stale reads impossible?
    options:
      - "Disable TTLs entirely so the cached object simply never expires or reloads"
      - "Switch the maxmemory-policy over to allkeys-lfu so hot objects are kept longer"
      - "Use versioned keys (e.g. user:42:v7) and bump the version on write so readers fetch a fresh key"
      - "Increase the appendfsync setting to always so every write is durably flushed"
    answer: 2
    explanation: |
      Versioned keys let you bump a version identifier on write so subsequent reads target a
      brand-new key (a guaranteed miss that repopulates), while old versions age out via TTL.
      This sidesteps the delete-then-reload race.
    ref: "concepts.md#cache-invalidation-and-the-thundering-herd--stampede-problem"

  - id: redis-caching-strategies-036
    difficulty: intermediate
    tags: [penetration, negative-caching, bloom-filter]
    question: |
      Attackers repeatedly request random IDs that exist neither in the cache nor the
      database, so every request hits the DB. What are the two standard defenses?
    options:
      - "Increase the maxmemory limit and enable AOF persistence on the cache node"
      - "Switch the write path over to asynchronous write-behind (write-back) caching"
      - "Enable Redis Cluster and shard the keyspace across more primary nodes"
      - "Cache the negative (null) result with a short TTL and/or front the lookups with a Bloom filter"
    answer: 3
    explanation: |
      This is cache penetration. Caching a short-lived null sentinel stops repeated DB hits
      for the same missing key, and a Bloom filter can reject IDs that provably do not exist
      before they reach the DB.
    ref: "concepts.md#cache-penetration-avalanche-and-breakdown"

  - id: redis-caching-strategies-037
    difficulty: intermediate
    tags: [avalanche, ha, ttl-jitter]
    question: |
      Which scenario best describes a cache avalanche (as distinct from penetration or
      breakdown)?
    options:
      - "A large batch of keys expire at the same time (or the node goes down), flooding the DB with misses"
      - "Requests for keys that exist in neither the cache nor the database repeatedly pound the DB directly"
      - "One single extremely hot key expires and a burst of concurrent requests all stampede the DB at once"
      - "The database is slow to respond, so the cache gradually fills up with stale, outdated cached values"
    answer: 0
    explanation: |
      An avalanche is a mass simultaneous expiration (or a whole-node failure) that sends a
      flood of misses to the DB at once. Fixes include TTL jitter and high availability
      (replicas/Sentinel/Cluster) so one node failing does not wipe the cache.
    ref: "concepts.md#cache-penetration-avalanche-and-breakdown"

  - id: redis-caching-strategies-038
    difficulty: advanced
    tags: [breakdown, hot-key, logical-expiry]
    question: |
      For cache breakdown on a single extremely hot key, which mitigation avoids a hard
      expiry entirely?
    options:
      - "Negative caching of null sentinel values with a short TTL to block repeated misses for the same id"
      - "Logical expiry: store the value with an expiry timestamp, never let it hard-expire, and refresh asynchronously"
      - "A Bloom filter over the set of valid IDs to reject nonexistent keys before they ever reach the DB"
      - "Switching the maxmemory-policy over to volatile-ttl so keys carrying the shortest TTL are evicted first"
    answer: 1
    explanation: |
      Logical (soft) expiry keeps the value in Redis without a hard TTL, embedding an expiry
      timestamp; when it is 'logically' stale a single background worker refreshes it while
      others keep serving the old value, so the hot key is never simultaneously cold for all
      readers.
    ref: "concepts.md#cache-penetration-avalanche-and-breakdown"

  - id: redis-caching-strategies-039
    difficulty: intermediate
    tags: [replication, async, data-loss]
    question: |
      Redis replication is asynchronous by default. What consistency risk does that create on
      failover?
    options:
      - "Replicas can serve reads that are strictly newer than the primary because they apply writes first"
      - "Every write is silently duplicated and applied twice on each replica, doubling the stored values"
      - "The primary can ack a write to the client and crash before a replica receives it, losing that write on promotion"
      - "Replicas independently run their own expiry cycles, so their keyspaces steadily diverge from the primary"
    answer: 2
    explanation: |
      Because replication is async, a primary may confirm a write and then fail before the
      replica has it. If that replica is promoted, the acknowledged write is lost. WAIT and
      min-replicas-* reduce but do not eliminate this window.
    ref: "concepts.md#replication-sentinel-and-cluster"

  - id: redis-caching-strategies-040
    difficulty: advanced
    tags: [replication, wait, durability]
    question: |
      What does the WAIT command do, and what does it NOT guarantee?
    options:
      - "It permanently switches the whole replication link into fully synchronous mode for all future writes"
      - "It triggers an immediate failover, electing a new primary whenever the connected replicas fall behind"
      - "It guarantees the acknowledged write can never be lost under any node or network failure whatsoever"
      - "It blocks a write until N replicas acknowledge it, but it is not full consensus and does not roll back on timeout"
    answer: 3
    explanation: |
      WAIT numreplicas timeout blocks until that many replicas confirm the write, tightening
      durability. But it is not a consensus protocol: on timeout it simply returns how many
      acked and does not undo the write, so edge-case loss is still possible.
    ref: "concepts.md#replication-sentinel-and-cluster"

  - id: redis-caching-strategies-041
    difficulty: intermediate
    tags: [sentinel, ha, failover]
    question: |
      What does Redis Sentinel provide, and what does it NOT do?
    options:
      - "It monitors a primary/replicas and performs automatic failover, but it does not shard data"
      - "It partitions the keyspace across many nodes for scale but performs no health monitoring at all"
      - "It provides both automatic keyspace sharding and replica failover together within one Sentinel process"
      - "It only sends operator alerts about an unhealthy primary and can never actually promote a replica"
    answer: 0
    explanation: |
      Sentinel monitors a single-primary topology, reaches quorum that the primary is down,
      elects a leader Sentinel, promotes a replica, and reconfigures clients. It provides HA
      but does not partition/shard the keyspace.
    ref: "concepts.md#replication-sentinel-and-cluster"

  - id: redis-caching-strategies-042
    difficulty: intermediate
    tags: [cluster, hash-slots]
    question: |
      How does Redis Cluster decide which node owns a given key?
    options:
      - "Consistent hashing of each key onto a ring built from the primary node IP addresses"
      - "CRC16(key) mod 16384 maps the key to one of 16384 hash slots, and each primary owns a slot range"
      - "A central coordinator node assigns every key to a primary at write time and records the mapping"
      - "Plain round-robin distribution that assigns each successive key to the next primary in turn"
    answer: 1
    explanation: |
      Redis Cluster uses 16384 fixed hash slots; the slot is CRC16(key) mod 16384 and each
      primary owns a contiguous set of slots. Clients cache the slot map and are redirected
      with MOVED/ASK when it changes.
    ref: "concepts.md#replication-sentinel-and-cluster"

  - id: redis-caching-strategies-043
    difficulty: advanced
    tags: [cluster, crossslot, hash-tags]
    question: |
      A multi-key MGET across keys user:42:profile and user:42:cart fails with a CROSSSLOT
      error in Redis Cluster. How do you make such multi-key operations work?
    options:
      - "Disable the cluster-require-full-coverage setting so partial-slot reads are permitted across nodes"
      - "Wrap the MGET inside a MULTI/EXEC transaction so the two keys are fetched as one atomic unit"
      - "Use a hash tag so only the shared substring is hashed, e.g. {user42}:profile and {user42}:cart"
      - "Increase the total number of cluster hash slots well beyond the default 16384 to spread keys"
    answer: 2
    explanation: |
      Multi-key commands require all keys in the same slot. A hash tag {..} tells Redis to
      hash only the bracketed substring, so {user42}:profile and {user42}:cart share a slot
      and can be operated on together.
    ref: "concepts.md#replication-sentinel-and-cluster"

  - id: redis-caching-strategies-044
    difficulty: intermediate
    tags: [locks, set-nx, fencing]
    question: |
      When implementing a single-instance Redis lock with SET lock:res token NX PX 30000,
      why must the release step check the token before deleting?
    options:
      - "Because the DEL command runs measurably slower than UNLINK and must be avoided on release"
      - "To atomically refresh and extend the lock's remaining TTL at the moment the holder releases it"
      - "Because the NX flag on the original SET otherwise blocks any later deletion of that same key"
      - "To avoid deleting a lock that a different client acquired after your TTL expired"
    answer: 3
    explanation: |
      If your lock's TTL expired and another client acquired it, a blind DEL would delete
      their lock. Releasing must atomically verify the stored token matches yours (via a Lua
      script) and only then DEL, so you never release someone else's lock.
    ref: "concepts.md#distributed-locks-and-the-redlock-debate"

  - id: redis-caching-strategies-045
    difficulty: intermediate
    tags: [locks, set-nx, ttl]
    question: |
      In SET lock:res token NX PX 30000, what is the role of the PX 30000 argument?
    options:
      - "It sets a 30-second auto-expiry so a crashed lock holder does not deadlock the resource forever"
      - "It transparently retries the SET for up to 30 seconds until the lock key is successfully acquired"
      - "It forces an fsync of the lock key to the AOF so the lock survives a crash of the Redis process"
      - "It sets the lock key only when its current stored value already equals the supplied token string"
    answer: 0
    explanation: |
      PX 30000 gives the lock a 30-second TTL. If the holder crashes without releasing, the
      lock auto-expires so other clients can eventually acquire it, preventing a permanent
      deadlock. NX enforces mutual exclusion.
    ref: "concepts.md#distributed-locks-and-the-redlock-debate"

  - id: redis-caching-strategies-046
    difficulty: advanced
    tags: [redlock, fencing-token, correctness]
    question: |
      In Kleppmann's critique of Redlock, why can a TTL-based lock allow two clients to
      believe they hold the lock, and what is the recommended safeguard?
    options:
      - "Network-level compression corrupts the lock token in transit; enable TLS on all client connections"
      - "A process can pause (GC/network) after acquiring, its TTL expires, another client acquires it; use monotonic fencing tokens that the protected resource checks"
      - "Redis drops the lock key during the BGSAVE fork; disable RDB snapshotting to keep the lock intact"
      - "Wall-clock drift across replicas mis-times the TTL; switch the eviction policy over to volatile-ttl"
    answer: 1
    explanation: |
      A long GC or network pause can outlast the lock TTL, so the lock expires and another
      client acquires it while the first still thinks it holds it. A monotonically increasing
      fencing token, checked and enforced by the protected resource, rejects the stale
      writer, giving correctness a TTL lock alone cannot.
    ref: "concepts.md#distributed-locks-and-the-redlock-debate"

  - id: redis-caching-strategies-047
    difficulty: advanced
    tags: [redlock, algorithm]
    question: |
      What does the Redlock algorithm require to consider a lock successfully acquired?
    options:
      - "A single SET NX issued on one primary that then replicates the lock out to all of its replicas"
      - "A quorum of monitoring Sentinel processes agreeing that the lock key is currently free to take"
      - "Acquiring the lock on a majority (N/2+1) of independent Redis primaries within a bounded time budget"
      - "Writing the lock key to the AOF with appendfsync always so the acquisition is durably persisted"
    answer: 2
    explanation: |
      Redlock runs against N independent (non-replicated) Redis primaries; the client must
      SET NX PX on a majority (N/2+1) quickly enough that the elapsed time is less than the
      lock validity, otherwise it releases what it got and fails.
    ref: "concepts.md#distributed-locks-and-the-redlock-debate"

  - id: redis-caching-strategies-048
    difficulty: beginner
    tags: [pubsub, streams, delivery]
    question: |
      A subscriber using Redis Pub/Sub disconnects for two seconds during a burst of
      PUBLISH calls. What happens to those messages?
    options:
      - "They are buffered server-side in a per-subscriber backlog and delivered once it reconnects"
      - "They are appended to the AOF as they publish and replayed to the subscriber on reconnect"
      - "They are tracked and redelivered from the channel's Pending Entries List after reconnection"
      - "They are lost; Pub/Sub is fire-and-forget and delivers only to currently-connected subscribers"
    answer: 3
    explanation: |
      Pub/Sub is at-most-once with no persistence, history, or acknowledgment. Messages go
      only to clients connected at publish time, so a disconnected subscriber permanently
      misses whatever was published while it was away.
    ref: "concepts.md#pubsub-vs-streams"

  - id: redis-caching-strategies-049
    difficulty: intermediate
    tags: [pubsub, streams, comparison]
    question: |
      Which statement correctly contrasts Redis Streams with Pub/Sub?
    options:
      - "Streams persist an append-only log allowing replay and at-least-once delivery with consumer groups; Pub/Sub is ephemeral at-most-once with no replay"
      - "Both persist messages to an append-only log, but only Pub/Sub exposes consumer groups and XACK"
      - "Streams deliver at-most-once with no acknowledgment, whereas Pub/Sub is durable and at-least-once"
      - "Neither Streams nor Pub/Sub can load-balance messages across multiple competing consumers"
    answer: 0
    explanation: |
      Streams store a bounded append-only log, allow re-reading from any ID, and provide
      at-least-once delivery with consumer groups and XACK. Pub/Sub keeps nothing, offers no
      replay, and delivers at-most-once to connected subscribers only.
    ref: "concepts.md#pubsub-vs-streams"

  - id: redis-caching-strategies-050
    difficulty: advanced
    tags: [pubsub, sharded, cluster]
    question: |
      What problem does sharded Pub/Sub (SPUBLISH/SSUBSCRIBE, Redis 7) address in a Redis
      Cluster?
    options:
      - "It upgrades Pub/Sub to at-least-once delivery by persisting every message to the shard's AOF"
      - "It keeps a published message within its shard's slot instead of broadcasting it across all cluster nodes, improving scalability"
      - "It adds consumer groups and Pending Entries List tracking on top of the existing Pub/Sub channels"
      - "It fully replaces Redis Streams as the recommended primitive for durable, replayable work queues"
    answer: 1
    explanation: |
      In regular cluster Pub/Sub, messages are propagated to all nodes. Sharded Pub/Sub
      confines a message to the shard owning its channel's slot, reducing cross-node traffic
      and scaling better, while keeping the same at-most-once semantics.
    ref: "concepts.md#pubsub-vs-streams"

  - id: redis-caching-strategies-051
    difficulty: beginner
    tags: [event-loop, scan, keys]
    question: |
      Which command should you use instead of KEYS to iterate a large keyspace without
      blocking the server?
    options:
      - "GETALL"
      - "SORT"
      - "SCAN"
      - "DUMP"
    answer: 2
    explanation: |
      SCAN is cursor-based and returns keys in small incremental batches, so it does not
      monopolize the single command thread the way the O(N) KEYS command does.
    ref: "concepts.md#single-threaded-event-loop-and-why-redis-is-fast"

  - id: redis-caching-strategies-052
    difficulty: intermediate
    tags: [data-structures, string, counter]
    question: |
      Which Redis type and command best implement a page-view counter that must increment
      atomically under high concurrency?
    options:
      - "A List with LPUSH"
      - "A Set with SADD"
      - "A Hash with HGETALL"
      - "A String with INCR"
    answer: 3
    explanation: |
      A String holding an integer with INCR is the idiomatic atomic counter. Because
      execution is single-threaded, concurrent INCRs never lose updates.
    ref: "concepts.md#core-data-structures-and-their-use-cases"
