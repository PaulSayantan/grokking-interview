topic: "Soft Deletes, Auditing & Temporal Data"
domain: messaging-databases
topic_slug: soft-deletes-auditing-and-temporal-data
version: 1
questions:
  - id: soft-deletes-auditing-and-temporal-data-001
    difficulty: beginner
    tags: [soft-delete, definition]
    question: |
      What does a "soft delete" do instead of physically removing a row?
    options:
      - "It deletes the row physically but first copies the whole table into a backup snapshot"
      - "It moves the row into a separate archive database immediately as part of the delete"
      - "It marks the row as inactive (e.g. sets deleted_at) but leaves the bytes in the table"
      - "It compresses the row with page-level compression so it takes up less disk space"
    answer: 2
    explanation: |
      A soft delete replaces a physical DELETE with an UPDATE that marks the row
      inactive (a boolean flag or a deleted_at timestamp). The row still exists in
      the table and must be filtered out by readers. Nothing is moved or compressed.
    ref: "concepts.md#soft-delete-definition-and-motivation"

  - id: soft-deletes-auditing-and-temporal-data-002
    difficulty: beginner
    tags: [soft-delete, deleted-at, design]
    question: |
      Why is a nullable deleted_at TIMESTAMP usually preferred over an is_deleted
      boolean for soft deletes?
    options:
      - "It encodes both whether the row is deleted and when, which doubles as an audit fact and drives retention windows"
      - "A boolean deleted flag would violate first normal form by encoding two facts at once"
      - "An 8-byte timestamp takes less storage on disk than a single-byte boolean column"
      - "Boolean columns cannot participate in a btree index in most relational databases"
    answer: 0
    explanation: |
      deleted_at stores both the delete state (NULL = live, non-NULL = deleted) and
      the deletion time in one column. That timestamp is a free audit fact and lets
      you build retention/purge windows (e.g. hard-delete rows deleted over 90 days
      ago). A boolean throws away the "when."
    ref: "concepts.md#soft-delete-definition-and-motivation"

  - id: soft-deletes-auditing-and-temporal-data-003
    difficulty: beginner
    tags: [soft-delete, benefits]
    question: |
      Which is a genuine benefit of soft deletes over hard DELETEs?
    options:
      - "Tables shrink over time because the engine reclaims space as rows are marked deleted"
      - "Unique constraints become easier to satisfy since deleted rows drop out of the index"
      - "Queries automatically ignore deleted rows with no code or query changes required"
      - "Recoverability: deleted data can be restored without a full point-in-time database restore"
    answer: 3
    explanation: |
      Soft delete keeps the data, enabling undo/trash-can UX and recovery from
      accidental deletion without restoring the whole database. It does NOT make
      queries auto-filter (every reader must add the filter), does not shrink tables,
      and actually complicates unique constraints.
    ref: "concepts.md#soft-delete-definition-and-motivation"

  - id: soft-deletes-auditing-and-temporal-data-004
    difficulty: intermediate
    tags: [soft-delete, referential-integrity]
    question: |
      How does soft delete help with referential safety compared to a hard DELETE?
    options:
      - "It automatically converts every foreign-key column on the child into a nullable column"
      - "Child rows that still reference the parent do not become dangling FKs or trigger cascade deletes"
      - "It disables all foreign-key constraint checks on the table for the duration of the delete"
      - "It rewrites each orphaned child row to point at a hidden placeholder parent record"
    answer: 1
    explanation: |
      Because the parent row physically remains, foreign keys from child rows stay
      valid and ON DELETE CASCADE does not fire. This avoids the cascade-delete and
      dangling-reference problems of a hard DELETE. (Note the flip side: the FK now
      points at a logically-gone row, so app logic must still re-check liveness.)
    ref: "concepts.md#soft-delete-definition-and-motivation"

  - id: soft-deletes-auditing-and-temporal-data-005
    difficulty: intermediate
    tags: [soft-delete, data-leak, gotcha]
    question: |
      What is the most common and dangerous failure mode introduced by soft deletes?
    options:
      - "A query, JOIN, or report forgets the deleted_at IS NULL filter and silently surfaces deleted rows"
      - "The deleted_at timestamp overflows the 32-bit epoch and wraps around after January 2038"
      - "Foreign-key constraints are silently dropped from the table the moment a row is soft-deleted"
      - "The database exhausts its 32-bit transaction ID space and forces an emergency shutdown"
    answer: 0
    explanation: |
      Once you soft-delete, every read path must add WHERE deleted_at IS NULL. Missing
      it in even one endpoint, JOIN, or report re-exposes deleted data (cancelled
      orders, PII a user asked removed, double-counted analytics). It fails silently,
      which is what makes it so dangerous.
    ref: "concepts.md#soft-delete-trade-offs-and-gotchas"

  - id: soft-deletes-auditing-and-temporal-data-006
    difficulty: intermediate
    tags: [soft-delete, unique-constraint, gotcha]
    question: |
      A user soft-deletes their account and later tries to re-register with the same
      email, but gets a unique-constraint violation. Why?
    options:
      - "The database caches recently deleted email addresses in a reservation list for 24 hours"
      - "The email column carries a NOT NULL constraint that rejects the re-registration attempt"
      - "A plain UNIQUE(email) constraint still counts the soft-deleted row, so the 'live' new row conflicts with the dead one"
      - "The soft-delete UPDATE corrupts the unique index and leaves a stale phantom key entry"
    answer: 2
    explanation: |
      A standard UNIQUE(email) index includes deleted rows. The soft-deleted account's
      email still occupies the unique slot, so re-registration collides with a row that
      is logically gone. The fix is a partial/filtered unique index scoped to live rows.
    ref: "concepts.md#soft-delete-trade-offs-and-gotchas"

  - id: soft-deletes-auditing-and-temporal-data-007
    difficulty: advanced
    tags: [soft-delete, postgres, mvcc]
    question: |
      In PostgreSQL, why is it wrong to claim a soft-delete UPDATE is "lighter on
      dead-tuple pressure" than a hard DELETE?
    options:
      - "Because an UPDATE never touches any index entries, so it avoids all index-maintenance cost"
      - "Because an UPDATE creates a new tuple version (the old one is dead until VACUUM), and the row is never reclaimed at all"
      - "Because PostgreSQL rewrites and re-clusters the entire heap table on every single UPDATE"
      - "Because a DELETE in PostgreSQL removes the row in place and never creates any dead tuples"
    answer: 1
    explanation: |
      Under MVCC an UPDATE writes a new row version and leaves the old one dead until
      VACUUM, just like a DELETE creates a dead tuple. But the soft-deleted row then
      lives forever, so the space is never freed. Soft delete does not reduce dead-tuple
      or bloat pressure; it makes it permanent.
    ref: "concepts.md#soft-delete-trade-offs-and-gotchas"

  - id: soft-deletes-auditing-and-temporal-data-008
    difficulty: intermediate
    tags: [soft-delete, cascade, gotcha]
    question: |
      A parent row is soft-deleted. What happens to its child rows that were previously
      protected by ON DELETE CASCADE?
    options:
      - "They are automatically relocated into a dedicated orphan-holding table by the engine"
      - "The database refuses the soft-delete UPDATE until the child rows are removed first"
      - "They are cascade-soft-deleted automatically because the CASCADE rule fires on the UPDATE"
      - "They remain live and visible unless you explicitly soft-delete them too, leaving orphaned-but-visible rows"
    answer: 3
    explanation: |
      ON DELETE CASCADE only fires on a real DELETE. A soft-delete UPDATE does not
      trigger it, so children stay live and visible. You must soft-delete children
      yourself or accept orphaned-but-visible rows — a common consistency bug.
    ref: "concepts.md#soft-delete-trade-offs-and-gotchas"

  - id: soft-deletes-auditing-and-temporal-data-009
    difficulty: advanced
    tags: [soft-delete, query-planner]
    question: |
      A table is 95% soft-deleted rows. Beyond storage, what performance problem does
      this cause for queries against live rows?
    options:
      - "Autovacuum is permanently disabled once the dead-row fraction crosses ninety percent"
      - "Transactions can no longer commit because the deleted rows hold row-level write locks"
      - "Ordinary indexes and statistics are dominated by rows nobody queries, hurting selectivity estimates and cache hit rates"
      - "The primary key silently stops being unique once too many rows carry a deleted_at value"
    answer: 2
    explanation: |
      Dead-but-present rows bloat indexes and skew the planner's statistics toward data
      no query wants, worsening selectivity estimates and pushing useful pages out of
      cache. A partial index scoped to live rows mitigates this.
    ref: "concepts.md#soft-delete-trade-offs-and-gotchas"

  - id: soft-deletes-auditing-and-temporal-data-010
    difficulty: intermediate
    tags: [soft-delete, anti-pattern]
    question: |
      For which table is soft delete most clearly the WRONG choice?
    options:
      - "A high-churn sessions or rate-limit-counter table"
      - "An employees table with compliance requirements"
      - "A customers table used across the app"
      - "An orders table feeding financial reports"
    answer: 0
    explanation: |
      Transient, high-churn tables (sessions, queues, rate-limit counters) have nothing
      worth recovering and would accumulate huge dead-row bloat. Use hard delete or TTL.
      Business entities that need recovery/audit are exactly where soft delete pays off.
    ref: "concepts.md#soft-delete-trade-offs-and-gotchas"

  - id: soft-deletes-auditing-and-temporal-data-011
    difficulty: intermediate
    tags: [soft-delete, partial-index, postgres]
    question: |
      Which PostgreSQL construct lets you enforce email uniqueness only among non-deleted
      rows?
    options:
      - "CREATE UNIQUE INDEX ... ON users (COALESCE(email, ''))"
      - "CREATE UNIQUE INDEX ... ON users (email) WHERE deleted_at IS NULL"
      - "ALTER TABLE users ADD CONSTRAINT ... UNIQUE (email) DEFERRABLE"
      - "CREATE UNIQUE INDEX ... ON users (email) INCLUDE (deleted_at)"
    answer: 1
    explanation: |
      A partial (filtered) unique index with WHERE deleted_at IS NULL enforces the
      constraint only over live rows, so a deleted user's email no longer blocks
      re-registration. DEFERRABLE only changes when the check runs; INCLUDE adds a
      covering column but still indexes all rows.
    ref: "concepts.md#managing-soft-deletes-partial-indexes-views-and-constraints"

  - id: soft-deletes-auditing-and-temporal-data-012
    difficulty: advanced
    tags: [soft-delete, mysql, partial-index]
    question: |
      MySQL/InnoDB historically lacks partial-index syntax. What is a common workaround
      to allow re-use of a soft-deleted email while blocking live duplicates?
    options:
      - "Switch the table to the MyISAM engine, whose unique indexes ignore soft-deleted rows"
      - "Store all email addresses in lowercase so deleted and live values sort into separate buckets"
      - "Drop the unique constraint entirely and enforce email uniqueness only in application code"
      - "Use a generated/virtual column that is NULL when deleted, exploiting that unique indexes allow multiple NULLs"
    answer: 3
    explanation: |
      Since InnoDB has no WHERE-clause partial indexes, a common trick is a
      generated column that is NULL for deleted rows; because unique indexes permit
      multiple NULLs, deleted rows don't collide, while live rows still enforce
      uniqueness. Folding the row id into a composite unique key is another variant.
    ref: "concepts.md#managing-soft-deletes-partial-indexes-views-and-constraints"

  - id: soft-deletes-auditing-and-temporal-data-013
    difficulty: intermediate
    tags: [soft-delete, views, enforcement]
    question: |
      Why point application queries at a view like CREATE VIEW active_orders AS SELECT *
      FROM orders WHERE deleted_at IS NULL?
    options:
      - "It makes the deleted-row filter the default so readers can't forget it, reserving the base table for admin/restore/audit"
      - "Views prevent the underlying base table from ever growing beyond its current row count"
      - "It automatically hard-deletes old soft-deleted rows once they are read through the view"
      - "Views are always faster than base tables because the engine caches their result set"
    answer: 0
    explanation: |
      A view bakes the filter in so ordinary readers and BI tools cannot accidentally
      see deleted rows. The base table is reserved for admin/restore/audit access.
      Views are not inherently faster and do nothing about growth or purging.
    ref: "concepts.md#managing-soft-deletes-partial-indexes-views-and-constraints"

  - id: soft-deletes-auditing-and-temporal-data-014
    difficulty: advanced
    tags: [soft-delete, rls, orm, defense-in-depth]
    question: |
      Why is a database-level guard (e.g. PostgreSQL Row-Level Security) considered
      stronger than an ORM default scope for enforcing the deleted_at filter?
    options:
      - "ORM default scopes apply only to top-level SELECTs and are ignored inside any JOIN clause"
      - "ORM default scopes are far slower to evaluate because the predicate is added at runtime"
      - "RLS is applied by the engine for every session, whereas an ORM default scope is bypassed by raw SQL and non-ORM clients"
      - "RLS additionally compresses deleted rows on disk while hiding them from ordinary sessions"
    answer: 2
    explanation: |
      An ORM default scope only protects queries that go through the ORM; raw SQL,
      migrations, and other services bypass it. RLS enforces the predicate in the engine
      for every session regardless of client, giving defense-in-depth. Ideally use both.
    ref: "concepts.md#managing-soft-deletes-partial-indexes-views-and-constraints"

  - id: soft-deletes-auditing-and-temporal-data-015
    difficulty: intermediate
    tags: [soft-delete, partial-index, performance]
    question: |
      Besides uniqueness, what performance benefit does a partial index WHERE deleted_at
      IS NULL provide on a heavily soft-deleted table?
    options:
      - "It forces the query planner to use sequential scans that skip past the dead rows"
      - "It automatically vacuums dead tuples for the live rows each time the index is scanned"
      - "It reclaims the disk space held by soft-deleted rows as soon as the index is rebuilt"
      - "It indexes only the small fraction of live rows queries actually touch, keeping the index small and selective"
    answer: 3
    explanation: |
      A partial index only contains entries for live rows, so it stays small, more
      selective, and cache-friendly even when most of the table is dead. It does not
      vacuum or reclaim space — it just avoids indexing rows nobody queries.
    ref: "concepts.md#managing-soft-deletes-partial-indexes-views-and-constraints"

  - id: soft-deletes-auditing-and-temporal-data-016
    difficulty: beginner
    tags: [audit-columns, provenance]
    question: |
      What do the four audit columns created_at, created_by, updated_at, updated_by
      record?
    options:
      - "The full ordered history of every individual change ever applied to the row"
      - "Who created the row and when, and who last updated it and when"
      - "Which indexes the engine used to physically locate and write the row on disk"
      - "The transaction isolation level that was in effect when the row was last written"
    answer: 1
    explanation: |
      Audit columns capture the row's own provenance: creation actor/time (set once) and
      the most-recent update actor/time. They answer "who last touched this and when,"
      but keep only the latest actor — not the full change history.
    ref: "concepts.md#audit-columns-for-row-provenance"

  - id: soft-deletes-auditing-and-temporal-data-017
    difficulty: intermediate
    tags: [audit-columns, limitation]
    question: |
      A row has created_by/updated_by columns. A customer disputes a balance change made
      three edits ago. Can you identify who made that change from the audit columns?
    options:
      - "Yes, because created_by records the full ordered chain of every prior editor"
      - "Yes, because updated_by keeps an appended list of every editor who ever touched it"
      - "No — audit columns keep only the most recent actor, not intermediate versions"
      - "Yes, but only if the row was never soft-deleted at any point in its lifetime"
    answer: 2
    explanation: |
      updated_by is overwritten on each change, so it holds only the latest editor. To
      reconstruct who made an earlier change you need a row-versioned history/audit table
      or system-versioning. This limitation is the standard interview follow-up.
    ref: "concepts.md#audit-columns-for-row-provenance"

  - id: soft-deletes-auditing-and-temporal-data-018
    difficulty: intermediate
    tags: [audit-columns, triggers]
    question: |
      Why do teams often set updated_at via a BEFORE UPDATE trigger rather than in
      application code?
    options:
      - "So the timestamp is maintained even if the application forgets to set it or a direct SQL update occurs"
      - "Because application code has no reliable way to read the database server's current clock"
      - "To avoid ever having to declare a DEFAULT value on the updated_at timestamp column"
      - "Because a BEFORE UPDATE trigger is the only supported mechanism for writing a timestamp column"
    answer: 0
    explanation: |
      A trigger guarantees updated_at is refreshed on every write, including out-of-band
      or ad-hoc SQL updates that bypass the app. Relying solely on application code means
      any write path that forgets leaves a stale/misleading timestamp.
    ref: "concepts.md#audit-columns-for-row-provenance"

  - id: soft-deletes-auditing-and-temporal-data-019
    difficulty: beginner
    tags: [audit-table, history]
    question: |
      What is the purpose of a separate audit/history table (e.g. accounts_audit)?
    options:
      - "To enforce foreign-key constraints between the main table and its child rows automatically"
      - "To hold only the rows that have been soft-deleted so they can be purged on a fixed schedule"
      - "To speed up SELECTs on the main table by acting as a pre-materialized covering index"
      - "To store a copy of the row (before and/or after) on each change, preserving full change history"
    answer: 3
    explanation: |
      An audit/history table records each mutation (insert/update/delete) with a copy of
      the row image(s), timestamp, and actor, so the full sequence of versions can be
      reconstructed — something audit columns alone cannot do.
    ref: "concepts.md#audit--history-tables-triggers-vs-app-level-vs-cdc"

  - id: soft-deletes-auditing-and-temporal-data-020
    difficulty: advanced
    tags: [audit, triggers, completeness]
    question: |
      What is the key advantage of capturing audit records via database triggers rather
      than in application code?
    options:
      - "Triggers can record the business reason for a change because the app passes the intent into the trigger body"
      - "Triggers cannot be bypassed — they fire even for ad-hoc SQL and other applications, giving completeness"
      - "Triggers add zero overhead to writes since the audit insert runs on a separate background worker thread"
      - "Triggers automatically capture the authenticated end-user identity from the connecting client session"
    answer: 1
    explanation: |
      A trigger fires for every write regardless of source, so no mutation escapes the
      audit — completeness. The trade-offs are per-row overhead, DB-specific/hidden logic,
      and difficulty capturing the app-level user (needs a session variable).
    ref: "concepts.md#audit--history-tables-triggers-vs-app-level-vs-cdc"

  - id: soft-deletes-auditing-and-temporal-data-021
    difficulty: advanced
    tags: [audit, app-level, gotcha]
    question: |
      What is the main weakness of application-level auditing (e.g. Hibernate Envers,
      django-simple-history)?
    options:
      - "It is bypassed by any write that skips the application (migrations, DBA scripts, other services), leaving an incomplete audit"
      - "It only works on PostgreSQL and silently disables itself against MySQL or Oracle backends"
      - "It doubles the write latency of every table because each row is committed in two phases"
      - "It cannot record the user who made the change since the ORM strips identity before the write"
    answer: 0
    explanation: |
      App-level auditing captures rich context (user, request id, reason) but only for
      writes that go through the app. Migrations, direct DBA SQL, or other services
      writing to the DB produce unaudited changes — a completeness gap triggers avoid.
    ref: "concepts.md#audit--history-tables-triggers-vs-app-level-vs-cdc"

  - id: soft-deletes-auditing-and-temporal-data-022
    difficulty: advanced
    tags: [audit, cdc, trade-offs]
    question: |
      A team wants an audit trail with zero added latency on the write path that still
      captures every write. Which capture approach best fits, and what's the main
      downside?
    options:
      - "Manual audit inserts in each service; downside is higher storage cost"
      - "Application-level hooks; downside is per-row lock contention"
      - "Log-based CDC (e.g. Debezium reading the WAL/binlog); downside is it is asynchronous/eventually consistent and often lacks user context"
      - "Synchronous triggers; downside is they cannot capture DELETEs"
    answer: 2
    explanation: |
      Log-based CDC tails the WAL/binlog downstream, so it adds no write-path latency and
      captures all writes. The trade-offs are extra infrastructure, eventual consistency,
      and that the change log usually lacks the application user/reason for the change.
    ref: "concepts.md#audit--history-tables-triggers-vs-app-level-vs-cdc"

  - id: soft-deletes-auditing-and-temporal-data-023
    difficulty: intermediate
    tags: [audit, capture, summary]
    question: |
      Which statement best summarizes the trade-off among trigger, app-level, and
      CDC-based auditing?
    options:
      - "CDC = completeness, triggers = decoupling, app-level = zero latency"
      - "Triggers = completeness, app-level = business context, CDC = decoupling and zero write-latency"
      - "All three are functionally identical and differ only in the configuration syntax you write"
      - "Triggers = business context, app-level = guaranteed completeness, CDC = lower storage footprint"
    answer: 1
    explanation: |
      Triggers can't be bypassed (completeness) but lack easy user context; app-level has
      rich who/why context but is bypassed by out-of-band writes; CDC is decoupled and
      adds no write latency but is async and lacks actor context. Mature systems combine
      them.
    ref: "concepts.md#audit--history-tables-triggers-vs-app-level-vs-cdc"

  - id: soft-deletes-auditing-and-temporal-data-024
    difficulty: advanced
    tags: [audit, tamper-evidence, compliance]
    question: |
      Which technique makes an audit trail tamper-EVIDENT rather than merely
      append-only-by-convention?
    options:
      - "Adding a created_at column so every audit row records the wall-clock time it was written"
      - "Enabling autovacuum on the audit table so obsolete row versions are reclaimed automatically"
      - "Storing audit rows in a table with a monotonically increasing primary key that gaps reveal edits"
      - "Hash chaining, where each row stores H(prev_hash || row_data) so any retroactive edit breaks the chain"
    answer: 3
    explanation: |
      Hash chaining links each audit record to the previous via a cryptographic hash, so
      altering any past row invalidates every subsequent hash — making tampering
      detectable. This underpins ledger features (SQL Server 2022 ledger tables, QLDB).
    ref: "concepts.md#append-only-history-and-tamper-evidence"

  - id: soft-deletes-auditing-and-temporal-data-025
    difficulty: advanced
    tags: [audit, tamper-evidence, security]
    question: |
      Why is "append-only enforced only in application code" NOT true tamper-evidence?
    options:
      - "Because enforcing append-only in code violates first normal form on the audit table"
      - "Because application code runs too slowly to keep pace with the audit write volume"
      - "Because anyone with database credentials can still UPDATE or DELETE the audit rows directly"
      - "Because application code cannot INSERT rows into a table flagged as append-only by the engine"
    answer: 2
    explanation: |
      App-level append-only is bypassed by direct DB access. Real tamper-evidence needs
      DB-enforced permissions (INSERT-only), WORM storage, and/or cryptographic chaining.
      Against a sufficiently privileged insider you aim for detectability plus separation
      of duties, since tamper-proofing is effectively impossible.
    ref: "concepts.md#append-only-history-and-tamper-evidence"

  - id: soft-deletes-auditing-and-temporal-data-026
    difficulty: intermediate
    tags: [audit, worm, storage]
    question: |
      What does writing audit data to WORM storage (e.g. S3 Object Lock in compliance
      mode) guarantee?
    options:
      - "Even the account owner cannot delete or overwrite the data before its retention period expires"
      - "The data is automatically indexed for full-text search as each object is written"
      - "Writes complete faster than to a database because locking is skipped entirely"
      - "The data is encrypted at rest with a customer-managed key by default on every write"
    answer: 0
    explanation: |
      Write-Once-Read-Many storage with an immutability/compliance lock prevents deletion
      or modification until the retention window elapses — even by privileged users. This
      is a strong control against tampering with historical audit records.
    ref: "concepts.md#append-only-history-and-tamper-evidence"

  - id: soft-deletes-auditing-and-temporal-data-027
    difficulty: beginner
    tags: [temporal, valid-time]
    question: |
      In temporal data modeling, what does "valid time" (application time) represent?
    options:
      - "When the row was physically written to disk and flushed by the storage engine"
      - "The period during which a fact is true in the modeled real world"
      - "The time the last full backup of the table completed successfully"
      - "The transaction commit timestamp recorded by the database's write-ahead log"
    answer: 1
    explanation: |
      Valid time (application/business time) is when a fact holds in reality — e.g.
      "Alice's salary was $90k from 2023-01-01 to 2024-06-30." It is set by the
      application, can reference the future, and can be corrected.
    ref: "concepts.md#temporal-data-valid-time-vs-transaction-time"

  - id: soft-deletes-auditing-and-temporal-data-028
    difficulty: intermediate
    tags: [temporal, transaction-time]
    question: |
      Which property is TRUE of transaction time (system time) but NOT of valid time?
    options:
      - "It is set manually by the application at the moment the business event is entered"
      - "It can be freely corrected after the fact to fix an operator's data-entry mistake"
      - "It can reference facts that become true at a scheduled point in the future"
      - "It is append-only and cannot be back-dated, recording when the DB believed a fact"
    answer: 3
    explanation: |
      Transaction time records when data was stored in the database and is append-only —
      you cannot back-date what the system knew. Valid time, by contrast, is
      application-set, can be future-dated, and can be corrected. This asymmetry is the
      core of the two-axis model.
    ref: "concepts.md#temporal-data-valid-time-vs-transaction-time"

  - id: soft-deletes-auditing-and-temporal-data-029
    difficulty: advanced
    tags: [temporal, valid-time, transaction-time, scenario]
    question: |
      A raise was effective 2024-01-01 (in the real world) but was only entered into the
      HR system on 2024-01-15. Which time axes capture each date?
    options:
      - "2024-01-01 is valid time; 2024-01-15 is transaction time"
      - "Both are transaction time"
      - "2024-01-01 is transaction time; 2024-01-15 is valid time"
      - "Both are valid time"
    answer: 0
    explanation: |
      The effective date (when the raise is true in reality) is valid time; the entry
      date (when the DB recorded it) is transaction time. They diverge here, which is
      exactly why you need both axes to answer both "what was her salary on Jan 5?" and
      "what did the system think on Jan 5?".
    ref: "concepts.md#temporal-data-valid-time-vs-transaction-time"

  - id: soft-deletes-auditing-and-temporal-data-030
    difficulty: intermediate
    tags: [temporal, bitemporal]
    question: |
      What defines a bitemporal table?
    options:
      - "It supports only queries that specify exactly two WHERE clauses joined by AND"
      - "It stores rows across two different databases and reconciles them on read"
      - "It tracks both valid time and transaction time simultaneously, with two independent time periods per row"
      - "It keeps two physical copies of every row on separate disks for redundancy"
    answer: 2
    explanation: |
      A bitemporal table maintains two independent temporal dimensions — valid time and
      transaction time — so you can reproduce both what was true when, and what the
      system believed at any past moment. Essential for regulated finance/insurance.
    ref: "concepts.md#bitemporal-tables"

  - id: soft-deletes-auditing-and-temporal-data-031
    difficulty: advanced
    tags: [temporal, bitemporal, scenario]
    question: |
      Which question can ONLY be answered by a bitemporal design (not a single time
      axis)?
    options:
      - "What is the row's primary key value in the current version of the record?"
      - "How many rows are currently present in the table as of this instant?"
      - "What is the employee's current salary according to the latest stored version?"
      - "As of what we knew on March 1, what did we believe Alice's salary was for February?"
    answer: 3
    explanation: |
      Reproducing a past belief (transaction time = March 1) about a past reality (valid
      time = February) requires both axes. A single time axis can give either the audit
      trail or the effective-dated truth, but not the combination.
    ref: "concepts.md#bitemporal-tables"

  - id: soft-deletes-auditing-and-temporal-data-032
    difficulty: intermediate
    tags: [temporal, bitemporal, cost]
    question: |
      What is a realistic cost of adopting bitemporal tables?
    options:
      - "They cannot use indexes because the temporal period columns are non-deterministic"
      - "Four temporal columns, complex non-overlap constraints across both dimensions, and every query must pin both time axes"
      - "They require a specialized NoSQL database that supports interval keys natively"
      - "They prevent any updates to data once a row's transaction period has opened"
    answer: 1
    explanation: |
      Bitemporality adds two period pairs, constraints preventing overlap in both
      dimensions per key, and query complexity (pinning both axes). Most systems don't
      need it, but where regulators demand retroactive auditability, nothing else works.
    ref: "concepts.md#bitemporal-tables"

  - id: soft-deletes-auditing-and-temporal-data-033
    difficulty: intermediate
    tags: [sql-2011, system-versioning]
    question: |
      In SQL:2011, what makes a table "system-versioned"?
    options:
      - "Enabling MVCC on the table so each transaction sees its own row snapshot"
      - "Creating a BEFORE UPDATE trigger named system_version that copies the old row aside"
      - "Declaring PERIOD FOR SYSTEM_TIME plus WITH SYSTEM VERSIONING, so the engine automatically keeps old row versions on UPDATE/DELETE"
      - "Adding a version_number integer column that the application increments on each write"
    answer: 2
    explanation: |
      System-versioning uses a PERIOD FOR SYSTEM_TIME (row-start/row-end columns) and
      WITH SYSTEM VERSIONING. The engine maintains transaction-time automatically:
      updates/deletes close the current row's period and retain the old version as
      history. Constraints are enforced only on current rows.
    ref: "concepts.md#system-versioned-temporal-tables-sql2011"

  - id: soft-deletes-auditing-and-temporal-data-034
    difficulty: advanced
    tags: [sql-2011, query-syntax]
    question: |
      Which is the SQL:2011 standard syntax to see a system-versioned table's state as it
      was at a past instant?
    options:
      - "SELECT * FROM employees FOR SYSTEM_TIME AS OF TIMESTAMP '2024-03-01 00:00:00'"
      - "SELECT * FROM employees AT TIME '2024-03-01 00:00:00' USING SYSTEM PERIOD"
      - "SELECT * FROM employees SNAPSHOT AS OF '2024-03-01 00:00:00' TRANSACTION TIME"
      - "SELECT * FROM employees WHERE system_version = 'latest' AS OF '2024-03-01'"
    answer: 0
    explanation: |
      The standard time-travel clause is FOR SYSTEM_TIME AS OF <timestamp> (with range
      variants FOR SYSTEM_TIME BETWEEN ... AND ... and FROM ... TO ...). MariaDB, SQL
      Server, and Db2 use this; Oracle Flashback uses AS OF TIMESTAMP instead.
    ref: "concepts.md#system-versioned-temporal-tables-sql2011"

  - id: soft-deletes-auditing-and-temporal-data-035
    difficulty: advanced
    tags: [sql-2011, postgres, mysql, gotcha]
    question: |
      Which statement about native SQL:2011 system-versioned temporal tables is correct
      as of recent versions?
    options:
      - "Only PostgreSQL supports them natively, via the built-in temporal_tables core module since version 12"
      - "No mainstream relational database has yet implemented any part of the SQL:2011 temporal standard"
      - "PostgreSQL and MySQL both support them natively out of the box with the FOR SYSTEM_TIME clause"
      - "PostgreSQL (through 16) and MySQL have no native system-versioning; MariaDB, SQL Server, and Db2 do"
    answer: 3
    explanation: |
      MariaDB (10.3+), SQL Server (2016+), and Db2 provide native system-versioning;
      PostgreSQL (through 16) and MySQL do not — you emulate it with triggers/history
      tables or extensions. Assuming portability of "temporal tables" is a common trap.
    ref: "concepts.md#system-versioned-temporal-tables-sql2011"

  - id: soft-deletes-auditing-and-temporal-data-036
    difficulty: advanced
    tags: [sql-2011, constraints, gotcha]
    question: |
      In a SQL:2011 system-versioned table, how are primary-key and unique constraints
      enforced?
    options:
      - "Across all historical versions, so no two versions of a row may ever share a key value"
      - "Only on current (live) rows, since history necessarily repeats keys across versions"
      - "They are disabled entirely once system versioning is turned on for the table"
      - "Only on the oldest (initial) version of each row, which anchors the key for its lineage"
    answer: 1
    explanation: |
      History rows deliberately repeat the same key across versions of one entity, so
      constraints are enforced only on current rows. Otherwise keeping multiple versions
      of a row would violate the primary key.
    ref: "concepts.md#system-versioned-temporal-tables-sql2011"

  - id: soft-deletes-auditing-and-temporal-data-037
    difficulty: intermediate
    tags: [sql-2011, application-time]
    question: |
      What does an application-time period table (PERIOD FOR ... with the WITHOUT OVERLAPS
      clause) let you enforce?
    options:
      - "A temporal primary key ensuring no two rows for the same key have overlapping valid-time periods"
      - "That rows are always physically stored in strict valid-time period order on disk"
      - "That soft-deleted rows are automatically retained forever regardless of retention policy"
      - "That the database engine automatically manages the transaction-time period on every write"
    answer: 0
    explanation: |
      Application-time period tables model valid time and support temporal primary keys
      via WITHOUT OVERLAPS, which forbids overlapping validity periods for the same key,
      plus temporal referential integrity. The application manages the period columns.
    ref: "concepts.md#system-versioned-temporal-tables-sql2011"

  - id: soft-deletes-auditing-and-temporal-data-038
    difficulty: beginner
    tags: [scd, type-2]
    question: |
      In dimensional modeling, how does an SCD Type 2 handle a changed attribute?
    options:
      - "It adds an extra column that holds the single immediately-previous value of the attribute"
      - "It overwrites the old value in place, keeping no trace of what the attribute used to be"
      - "It inserts a new row (new surrogate key) for the changed version, with effective/expiry dates and a current flag"
      - "It deletes the dimension row and lets the fact table point at a null placeholder key"
    answer: 2
    explanation: |
      SCD Type 2 preserves full history by adding a new row per change: same natural key,
      new surrogate key, effective_date/end_date, and is_current flag. Overwriting is
      Type 1; adding a prior-value column is Type 3.
    ref: "concepts.md#slowly-changing-dimensions-scd-type-2"

  - id: soft-deletes-auditing-and-temporal-data-039
    difficulty: intermediate
    tags: [scd, type-1, type-3]
    question: |
      Which SCD type OVERWRITES the old value, keeping no history at all?
    options:
      - "Type 0"
      - "Type 1"
      - "Type 2"
      - "Type 3"
    answer: 1
    explanation: |
      Type 1 overwrites with the new value, retaining no history (like a plain UPDATE).
      Type 0 keeps the original and never changes it; Type 2 adds a new row for history;
      Type 3 adds a column for a single prior value.
    ref: "concepts.md#slowly-changing-dimensions-scd-type-2"

  - id: soft-deletes-auditing-and-temporal-data-040
    difficulty: advanced
    tags: [scd, surrogate-key, fact-table, scenario]
    question: |
      In an SCD Type 2 dimension, why do fact rows join to the surrogate key rather than
      the natural/business key?
    options:
      - "Because natural/business keys cannot be indexed and so would force a full table scan on every fact join"
      - "To avoid storing the dimension table at all, letting facts embed the attributes inline instead"
      - "Because integer surrogate keys are shorter to type and make hand-written ad-hoc queries easier to read"
      - "So each fact 'freezes' the dimension version that was current when the fact occurred (e.g. a 2023 order stays linked to the customer's 2023 city)"
    answer: 3
    explanation: |
      Each version of the dimension has its own surrogate key. A fact row references the
      surrogate key current at the time of the event, permanently associating the fact
      with the attribute values as they were then — the point of Type 2 history.
    ref: "concepts.md#slowly-changing-dimensions-scd-type-2"

  - id: soft-deletes-auditing-and-temporal-data-041
    difficulty: advanced
    tags: [scd, type-6, hybrid]
    question: |
      What characterizes an SCD Type 6 dimension?
    options:
      - "It stores only the original value forever and rejects any subsequent attribute change outright"
      - "It never stores any history, overwriting each attribute in place exactly like a Type 1 dimension"
      - "A hybrid of Types 1+2+3: a new row per change, an overwritten 'current' column across rows, and a prior-value column"
      - "It uses two separate physical databases, one holding current rows and one holding all historical versions"
    answer: 2
    explanation: |
      Type 6 (1+2+3) adds a new row (Type 2), overwrites a current-value column across all
      rows of the entity (Type 1), and keeps a prior-value column (Type 3), giving both
      full row history and fast access to the current value from any version.
    ref: "concepts.md#slowly-changing-dimensions-scd-type-2"

  - id: soft-deletes-auditing-and-temporal-data-042
    difficulty: intermediate
    tags: [scd, type-4, audit-table]
    question: |
      SCD Type 4 keeps current data in the main dimension and pushes changes to a
      separate history table. Which earlier pattern is this essentially the analytics
      name for?
    options:
      - "The audit/history-table pattern"
      - "Row-level security"
      - "Crypto-shredding"
      - "A partial unique index"
    answer: 0
    explanation: |
      Type 4 mirrors the audit/history-table approach: a current table plus a separate
      history table capturing versions. It closely resembles audit tables and CDC
      techniques applied to warehouse dimensions.
    ref: "concepts.md#slowly-changing-dimensions-scd-type-2"

  - id: soft-deletes-auditing-and-temporal-data-043
    difficulty: intermediate
    tags: [event-sourcing, audit]
    question: |
      Why is event sourcing described as the "ultimate" audit trail?
    options:
      - "Because it periodically deletes old events to save space once a snapshot has been taken"
      - "Because state is an append-only, immutable log of domain events, so the events themselves are a complete who/what/when record and any past state can be replayed"
      - "Because it requires no storage, keeping only the current aggregate state in memory"
      - "Because it disables all other logging, forcing every change through one central channel"
    answer: 1
    explanation: |
      In event sourcing, current state is a fold over an immutable event log; nothing is
      mutated or deleted. The event stream inherently captures every change (audit),
      supports replay to any point (temporal), and models deletion as an event — a
      complete audit by construction.
    ref: "concepts.md#event-sourcing-as-the-ultimate-audit-trail"

  - id: soft-deletes-auditing-and-temporal-data-044
    difficulty: advanced
    tags: [event-sourcing, trade-offs]
    question: |
      What is the main cost of using event sourcing purely to get a good audit trail?
    options:
      - "It cannot store timestamps, so events carry no reliable notion of when they occurred"
      - "It makes ordinary point queries impossible because every read must replay the full log"
      - "It only works on a single machine and cannot be distributed across multiple nodes"
      - "It is a system-wide architectural commitment (read models/projections, eventual consistency, event versioning), not a column you add to a table"
    answer: 3
    explanation: |
      Event sourcing implies CQRS-style projections, eventual consistency, and event
      schema evolution — a whole architecture. It also makes GDPR erasure acutely hard
      (you can't delete an event without breaking the log). Great audit, big commitment.
    ref: "concepts.md#event-sourcing-as-the-ultimate-audit-trail"

  - id: soft-deletes-auditing-and-temporal-data-045
    difficulty: intermediate
    tags: [gdpr, soft-delete]
    question: |
      Does a soft delete (deleted_at = now()) satisfy a GDPR Article 17 right-to-erasure
      request?
    options:
      - "No — every byte of personal data is still present; erasure requires anonymizing or hard-deleting the PII"
      - "Yes, as long as deleted_at is indexed so the regulator's audit query returns the row quickly"
      - "Only if the row is also compressed with page-level compression to shrink the retained PII"
      - "Yes, because marking the row deleted legally counts as removing the data under Article 17"
    answer: 0
    explanation: |
      Soft delete hides the row from normal queries but retains all the personal data.
      Right-to-erasure requires actually removing or anonymizing the PII (and remembering
      copies in backups, replicas, search indexes, and CDC sinks).
    ref: "concepts.md#gdpr-right-to-erasure-vs-immutable-history"

  - id: soft-deletes-auditing-and-temporal-data-046
    difficulty: advanced
    tags: [gdpr, crypto-shredding, event-sourcing]
    question: |
      An immutable event store or WORM backup cannot physically delete a user's records.
      What technique reconciles this with the right to erasure?
    options:
      - "Lowering the transaction isolation level so erasure requests skip the immutable events"
      - "Renaming the table so downstream consumers can no longer resolve the subject's records"
      - "Crypto-shredding: encrypt each subject's PII with a per-subject key, then destroy the key so the ciphertext becomes permanently unreadable"
      - "Setting a deleted_at timestamp on the events so replay logic filters them out on read"
    answer: 2
    explanation: |
      Crypto-shredding (crypto-erasure) stores PII encrypted per subject; deleting the
      key renders the retained ciphertext unrecoverable. This is the standard way to
      honor erasure in append-only event stores and immutable backups where physical
      deletion is impossible.
    ref: "concepts.md#gdpr-right-to-erasure-vs-immutable-history"

  - id: soft-deletes-auditing-and-temporal-data-047
    difficulty: advanced
    tags: [gdpr, anonymization, legal-basis]
    question: |
      Which statement about GDPR right-to-erasure vs an immutable audit trail is correct?
    options:
      - "Truly anonymized, non-re-identifiable data must still be erased on request under Article 17"
      - "Audit data can never be retained after an erasure request, regardless of any legal obligation"
      - "Erasure is absolute and always overrides every competing retention or record-keeping duty"
      - "Erasure is not absolute — data retained for a legal obligation (e.g. tax/KYC records) may lawfully be kept, and truly anonymized data falls outside GDPR"
    answer: 3
    explanation: |
      Article 17 has exemptions: data needed to meet legal obligations or to establish/
      defend legal claims can be retained. And if data is truly anonymized (not
      re-identifiable), GDPR no longer applies — so anonymization preserves audit
      structure without retaining identity.
    ref: "concepts.md#gdpr-right-to-erasure-vs-immutable-history"

  - id: soft-deletes-auditing-and-temporal-data-048
    difficulty: intermediate
    tags: [gdpr, anonymization]
    question: |
      What is the advantage of anonymizing personal fields (nulling name/email) rather
      than hard-deleting a whole record to honor erasure?
    options:
      - "It is faster to run because nulling a few columns skips the foreign-key cascade checks"
      - "It preserves the non-personal skeleton for referential integrity and aggregate analytics while removing identity"
      - "It automatically satisfies tax-retention laws by keeping the record for the mandated period"
      - "It compresses the row so the leftover non-personal columns take less space on disk"
    answer: 1
    explanation: |
      Anonymization overwrites the PII but keeps the row's structure, so foreign keys and
      aggregate reports still work while the individual is no longer identifiable. If the
      anonymization is irreversible, the data is outside GDPR's scope.
    ref: "concepts.md#gdpr-right-to-erasure-vs-immutable-history"

  - id: soft-deletes-auditing-and-temporal-data-049
    difficulty: intermediate
    tags: [retention, purge]
    question: |
      What is a retention policy meant to define?
    options:
      - "How often full and incremental backups are compressed and shipped off-site"
      - "Which columns of each table are indexed to keep historical scans fast"
      - "How long each class of data lives before it is purged or anonymized"
      - "The database's default transaction isolation level for read-heavy reporting"
    answer: 2
    explanation: |
      A retention policy sets how long each data class is kept before purge/anonymization,
      balancing storage cost and performance, legal maximums (data minimization) and
      minimums (e.g. tax records), and breach/subpoena risk (data you don't hold can't be
      exposed).
    ref: "concepts.md#data-retention-and-purge"

  - id: soft-deletes-auditing-and-temporal-data-050
    difficulty: advanced
    tags: [retention, partitioning, purge, performance]
    question: |
      For a huge append-only audit table, why is time-range partitioning with DROP
      PARTITION preferred over a bulk DELETE for purging old data?
    options:
      - "DROP PARTITION is a fast metadata operation, while a bulk DELETE rewrites indexes, generates huge WAL/redo, bloats the table, and competes with live traffic"
      - "Partitions automatically encrypt the old data they hold, so dropping one also shreds the keys"
      - "DELETE statements are silently disallowed against any table flagged as append-only audit storage"
      - "A single DELETE can never remove more than 1000 rows, so purging always needs many round trips"
    answer: 0
    explanation: |
      Dropping a whole partition is essentially a catalog operation — no per-row work, no
      dead tuples, no VACUUM storm, minimal logging. A bulk DELETE does per-row index
      maintenance, produces large WAL/redo, bloats the table, and contends with live
      queries.
    ref: "concepts.md#data-retention-and-purge"

  - id: soft-deletes-auditing-and-temporal-data-051
    difficulty: intermediate
    tags: [retention, ttl]
    question: |
      Which mechanism has some datastores automatically expire and purge rows past a set
      lifetime?
    options:
      - "A foreign-key constraint that cascades a delete once the row's lifetime elapses"
      - "A partial index that stops covering rows once they pass their configured expiry"
      - "A CHECK constraint that rejects any row whose age exceeds the retention window"
      - "A TTL feature (e.g. DynamoDB TTL, Cassandra TTL, MongoDB TTL index)"
    answer: 3
    explanation: |
      TTL (time-to-live) features let the engine purge expired rows in the background,
      implementing retention automatically. Constraints and indexes enforce integrity or
      speed lookups but do not expire data.
    ref: "concepts.md#data-retention-and-purge"

  - id: soft-deletes-auditing-and-temporal-data-052
    difficulty: beginner
    tags: [audit-columns, immutability]
    question: |
      Which audit column should be set once on insert and then never modified?
    options:
      - "updated_at"
      - "created_at"
      - "updated_by"
      - "deleted_at"
    answer: 1
    explanation: |
      created_at (and created_by) record the row's origin and should be immutable after
      insert. updated_at/updated_by change on every write; deleted_at is set when the row
      is soft-deleted.
    ref: "concepts.md#audit-columns-for-row-provenance"

  - id: soft-deletes-auditing-and-temporal-data-053
    difficulty: advanced
    tags: [temporal, scd, comparison]
    question: |
      How do SCD Type 2 and SQL:2011 system-versioning relate?
    options:
      - "Both keep row history, but SCD Type 2 is the warehouse (valid-time, surrogate-key) idiom for dimensions, while system-versioning is an OLTP engine feature tracking transaction time"
      - "System-versioning only works in data warehouses and is unavailable to any OLTP engine"
      - "SCD Type 2 tracks transaction time while system-versioning instead tracks valid application time"
      - "They are the exact same feature under two different vendor names for the identical mechanism"
    answer: 0
    explanation: |
      Both preserve historical versions, but at different layers: SCD Type 2 is a
      modeling convention for warehouse dimensions using surrogate keys and effective
      dates (valid-time flavored), whereas system-versioning is a database engine feature
      that automatically maintains transaction-time history.
    ref: "concepts.md#slowly-changing-dimensions-scd-type-2"

  - id: soft-deletes-auditing-and-temporal-data-054
    difficulty: intermediate
    tags: [soft-delete, foreign-key, scenario]
    question: |
      With soft deletes, nothing stops the app from creating a NEW child row against a
      soft-deleted parent. Why?
    options:
      - "Because the parent's primary key is silently regenerated the moment the row is soft-deleted"
      - "Because setting deleted_at automatically disables every foreign-key constraint on the parent table"
      - "Because the FK sees a physically-present (live to the DB) parent row, so the constraint passes even though the parent is logically deleted"
      - "Because child rows always ignore foreign keys once their parent carries a deleted_at value"
    answer: 2
    explanation: |
      A foreign key only checks that the referenced row exists physically. Soft delete
      leaves the parent present, so the FK is satisfied and a new child can be created
      against a logically-gone parent. Only application logic can re-check liveness.
    ref: "concepts.md#soft-delete-trade-offs-and-gotchas"

  - id: soft-deletes-auditing-and-temporal-data-055
    difficulty: advanced
    tags: [audit, triggers, user-context, gotcha]
    question: |
      A DB trigger writes audit rows but struggles to record the application USER who
      made a change. Why, and what is the usual remedy?
    options:
      - "Triggers physically execute before the client connection is authenticated, so the user identity does not exist yet and no workaround can recover it"
      - "The DB connection often uses a shared service account, so the app must pass the end-user identity via a session variable (e.g. SET LOCAL) that the trigger reads"
      - "Triggers are forbidden from reading the column values of the row being changed, so they have no access to any identity field at all"
      - "The captured user is always NULL because triggers run asynchronously on a background worker long after the transaction has committed"
    answer: 1
    explanation: |
      The trigger sees the DB session's identity (frequently a shared pooled service
      account), not the end user. The common remedy is for the app to set a session/local
      variable with the authenticated user id at the start of the transaction, which the
      trigger reads when writing the audit row.
    ref: "concepts.md#audit--history-tables-triggers-vs-app-level-vs-cdc"

  - id: soft-deletes-auditing-and-temporal-data-056
    difficulty: advanced
    tags: [gdpr, retention, scope]
    question: |
      A user exercises their right to erasure. Which is a commonly OVERLOOKED place their
      personal data may still persist?
    options:
      - "There is nowhere overlooked, because a delete on the primary table propagates automatically to every downstream system through the transaction log"
      - "Only the in-memory application cache, which is fully cleared the instant the primary row is deleted so no residual copy survives"
      - "Only the primary table ever needs handling, since replicas and indexes are rebuilt from it and therefore hold no independent personal data"
      - "Backups, read replicas, search indexes, and downstream CDC sinks may all hold copies that must also be addressed"
    answer: 3
    explanation: |
      Erasure must account for every copy: backups, replicas, search/analytics indexes,
      and any CDC/downstream sinks fed from the source. A single DELETE on the primary
      table leaves personal data scattered across these, which is a frequent compliance
      gap (and where crypto-shredding of backups helps).
    ref: "concepts.md#gdpr-right-to-erasure-vs-immutable-history"

  - id: soft-deletes-auditing-and-temporal-data-057
    difficulty: intermediate
    tags: [temporal, sql-2011, application-time, valid-time]
    question: |
      Which SQL:2011 feature corresponds to VALID (application) time, where the
      application manages the period columns?
    options:
      - "Generated (computed) columns, whose STORED expression derives the valid-time period from other columns on every insert and update"
      - "System-versioned tables (PERIOD FOR SYSTEM_TIME + WITH SYSTEM VERSIONING), whose start/end columns the application sets to model application time"
      - "Application-time period tables (PERIOD FOR <name>, e.g. with WITHOUT OVERLAPS)"
      - "Materialized views, which snapshot the valid-time period at each REFRESH and let the application edit the retained period columns directly"
    answer: 2
    explanation: |
      Application-time period tables model valid time: the application sets the
      start/end columns declared by PERIOD FOR, with optional temporal primary keys
      (WITHOUT OVERLAPS) and referential integrity. System-versioned tables instead let
      the engine manage transaction time.
    ref: "concepts.md#system-versioned-temporal-tables-sql2011"
