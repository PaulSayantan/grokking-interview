topic: "Serialization Formats & Schema Evolution"
domain: messaging-databases
topic_slug: schema-evolution-and-registry
version: 1
questions:
  - id: schema-evolution-and-registry-001
    difficulty: beginner
    tags: [serialization, fundamentals]
    question: |
      What is "serialization" in the context of a messaging or RPC system?
    options:
      - "Turning an in-memory object into a byte sequence that can be sent over the network or stored"
      - "Compressing a payload to reduce its size on disk"
      - "Encrypting a message so only the intended consumer can read it"
      - "Ordering messages so they are processed one at a time"
    answer: 0
    explanation: |
      Serialization (marshalling) converts an in-memory object into a byte sequence for
      transport or storage; deserialization reverses it. Compression and encryption are
      separate concerns that may be layered on top.
    ref: "concepts.md#why-serialization-formats-matter"

  - id: schema-evolution-and-registry-002
    difficulty: beginner
    tags: [serialization, trade-offs]
    question: |
      Which of these is NOT one of the primary axes on which a serialization format
      choice is evaluated?
    options:
      - "Size on the wire / disk"
      - "CPU cost to encode and decode"
      - "Cross-language interoperability"
      - "The programming language the broker itself is written in"
    answer: 3
    explanation: |
      Size, CPU cost, interop, human-readability, and schema-evolution support are the
      real axes. The implementation language of the broker is irrelevant to which
      payload format you choose.
    ref: "concepts.md#why-serialization-formats-matter"

  - id: schema-evolution-and-registry-003
    difficulty: intermediate
    tags: [text-vs-binary, json]
    question: |
      Why does JSON tend to produce larger payloads than a binary format like Protobuf
      for the same data?
    options:
      - "JSON always base64-encodes its values"
      - "JSON repeats human-readable field names in every record and encodes numbers as ASCII digits"
      - "JSON stores a full schema inside every message"
      - "JSON pads every field to a fixed 8-byte width"
    answer: 1
    explanation: |
      Text formats repeat the field names and delimiters in every record and encode
      numbers as ASCII text rather than packed bytes, making them verbose relative to
      tag-based binary encodings.
    ref: "concepts.md#text-vs-binary-trade-offs"

  - id: schema-evolution-and-registry-004
    difficulty: intermediate
    tags: [text-vs-binary, avro, protobuf]
    question: |
      Which statement about needing a schema to DECODE a message is correct?
    options:
      - "Both Protobuf and Avro require the external schema to structurally decode the bytes"
      - "Avro embeds field names in every record, so it never needs an external schema"
      - "Protobuf embeds field numbers in the bytes and can be structurally decoded without the schema, while Avro records cannot be decoded without the writer schema"
      - "JSON requires an external schema to decode"
    answer: 2
    explanation: |
      Protobuf writes field numbers (tags) into the bytes, so the structure is
      self-contained. Avro writes data positionally with no tags, so you must have the
      writer schema to decode it — which is why Avro pairs so naturally with a registry.
    ref: "concepts.md#text-vs-binary-trade-offs"

  - id: schema-evolution-and-registry-005
    difficulty: beginner
    tags: [json, use-cases]
    question: |
      For which use case is plain JSON generally the most appropriate wire format?
    options:
      - "A columnar analytics data lake optimized for scan performance"
      - "A multi-million-message-per-second internal event stream where size dominates cost"
      - "A public-facing external HTTP API where human readability and universal tooling matter"
      - "A latency-critical game state exchanged between C++ processes"
    answer: 2
    explanation: |
      JSON's universal support and human readability make it ideal for public/external
      APIs and low-volume human-facing data. High-volume streams and analytics favor
      compact binary formats.
    ref: "concepts.md#json-as-a-wire-format"

  - id: schema-evolution-and-registry-006
    difficulty: intermediate
    tags: [json, weak-types]
    question: |
      A team sends 64-bit account IDs in JSON and starts seeing corrupted IDs on the
      consumer. What is the most likely root cause?
    options:
      - "Most JSON parsers treat numbers as IEEE-754 doubles, so large 64-bit integers lose precision"
      - "JSON strips leading zeros from all strings"
      - "JSON cannot represent integers at all"
      - "The consumer's UTF-8 decoder is mangling the digits"
    answer: 0
    explanation: |
      JSON has a single number type that most parsers map to a double. Integers beyond
      2^53 lose precision, so large 64-bit IDs get corrupted — the usual fix is to
      encode them as strings.
    ref: "concepts.md#json-as-a-wire-format"

  - id: schema-evolution-and-registry-007
    difficulty: intermediate
    tags: [json, json-schema]
    question: |
      By default, what does plain JSON enforce about the shape of messages a producer emits?
    options:
      - "It enforces a registered schema and rejects unknown fields"
      - "It automatically versions each message"
      - "It requires all fields to be present in every message"
      - "Nothing — any producer can emit any shape, and consumers discover breakage at runtime unless you add JSON Schema validation"
    answer: 3
    explanation: |
      Plain JSON is schemaless: nothing enforces shape, so breakage is discovered at
      runtime. You can add JSON Schema (and even register it in a schema registry) to
      get validation and evolution enforcement.
    ref: "concepts.md#json-as-a-wire-format"

  - id: schema-evolution-and-registry-008
    difficulty: beginner
    tags: [protobuf, idl]
    question: |
      In a Protobuf `.proto` definition, what does the `= 3` mean in `string currency = 3;`?
    options:
      - "The field's default value is 3"
      - "The field's permanent wire-format field number (tag)"
      - "The field must appear at most 3 times"
      - "The maximum length of the string is 3"
    answer: 1
    explanation: |
      The `= N` assigns the field number, the permanent identity written into the wire
      format. It is not a default, count, or length — and it must never be changed once in use.
    ref: "concepts.md#protocol-buffers-protobuf"

  - id: schema-evolution-and-registry-009
    difficulty: intermediate
    tags: [protobuf, encoding]
    question: |
      Why does the Protobuf guide recommend using field numbers 1–15 for your most
      frequently-set fields?
    options:
      - "Numbers above 15 are reserved for Google internal use"
      - "Field numbers 1–15 encode their tag in a single byte, while 16–2047 take two bytes"
      - "Only 1–15 support the `optional` keyword"
      - "Numbers 1–15 are the only ones that can be indexed"
    answer: 1
    explanation: |
      The tag combines the field number and wire type into a varint. Numbers 1–15 fit
      the tag in one byte; 16–2047 need two. Hot fields in 1–15 shave bytes off every message.
    ref: "concepts.md#protocol-buffers-protobuf"

  - id: schema-evolution-and-registry-010
    difficulty: intermediate
    tags: [protobuf, grpc]
    question: |
      Protobuf is the default payload format for which RPC framework?
    options:
      - "GraphQL"
      - "SOAP"
      - "gRPC"
      - "JSON-RPC"
    answer: 2
    explanation: |
      gRPC uses Protobuf as its default IDL and wire format, with `protoc` generating
      typed client/server stubs across languages.
    ref: "concepts.md#protocol-buffers-protobuf"

  - id: schema-evolution-and-registry-011
    difficulty: advanced
    tags: [protobuf, unknown-fields, proto3]
    question: |
      In proto3, what happens when an old binary parses a message that contains a field
      it doesn't know about?
    options:
      - "It preserves the unknown field's bytes and re-emits them on serialization"
      - "It silently truncates the message at the unknown field"
      - "It throws a parse error and rejects the message"
      - "It converts the unknown field to null"
    answer: 0
    explanation: |
      proto3 preserves unknown fields, keeping their bytes and re-emitting them when the
      message is serialized again. This matters for proxies and round-tripping data
      through older code.
    ref: "concepts.md#protocol-buffers-protobuf"

  - id: schema-evolution-and-registry-012
    difficulty: beginner
    tags: [avro, fundamentals]
    question: |
      What is the defining characteristic of Apache Avro's encoding?
    options:
      - "It stores each field number as a two-byte tag"
      - "Field names are embedded before every value in the byte stream"
      - "It is a text format based on YAML"
      - "Data is encoded positionally against a schema, with no field tags in the bytes, so you need the writer schema to decode it"
    answer: 3
    explanation: |
      Avro encodes data positionally with no tags or field names in the bytes, which
      makes records tiny but means the writer schema is mandatory to decode them.
    ref: "concepts.md#apache-avro"

  - id: schema-evolution-and-registry-013
    difficulty: intermediate
    tags: [avro, schema-resolution]
    question: |
      Avro decoding is described as using "two schemas at once." Which two?
    options:
      - "A compressed schema and an uncompressed schema"
      - "A local schema and a remote schema"
      - "A key schema and a value schema"
      - "The writer schema (what produced the bytes) and the reader schema (what the consumer expects)"
    answer: 3
    explanation: |
      Avro's schema resolution reconciles the writer schema (used to encode) with the
      reader schema (expected by the consumer), matching fields by name and filling in
      defaults where they differ.
    ref: "concepts.md#apache-avro"

  - id: schema-evolution-and-registry-014
    difficulty: advanced
    tags: [avro, registry, wire-format]
    question: |
      On Kafka with Confluent's Avro serializer, what travels in the message alongside
      the Avro bytes instead of the full schema?
    options:
      - "A gzip-compressed copy of the schema"
      - "A magic byte plus a 4-byte schema ID that the consumer uses to fetch the writer schema from the registry"
      - "The full JSON schema in a header"
      - "A SHA-256 hash of the entire message"
    answer: 1
    explanation: |
      Confluent's wire format prepends a magic byte and a 4-byte schema ID. Consumers
      read the ID and fetch the writer schema from the registry (cached), keeping the
      payload small.
    ref: "concepts.md#apache-avro"

  - id: schema-evolution-and-registry-015
    difficulty: intermediate
    tags: [avro, protobuf, use-cases]
    question: |
      A common interview rule of thumb pairs formats with use cases. Which pairing is right?
    options:
      - "Avro for RPC service APIs, Protobuf for data lakes"
      - "JSON for high-volume internal streams, Avro for public APIs"
      - "Protobuf for gRPC/service RPC, Avro for data streams and analytics"
      - "Thrift for public HTTP APIs, JSON for gRPC"
    answer: 2
    explanation: |
      Protobuf shines for RPC (compiled into both sides, tags in the bytes), while Avro's
      tag-free records, rich defaults, and schema resolution fit long-lived Kafka streams
      and analytics.
    ref: "concepts.md#apache-avro"

  - id: schema-evolution-and-registry-016
    difficulty: intermediate
    tags: [thrift, formats]
    question: |
      How does Apache Thrift differ most notably from Protobuf?
    options:
      - "Thrift bundles a full RPC framework (transports, protocols, servers) in the box, not just a serialization format"
      - "Thrift is a text format while Protobuf is binary"
      - "Thrift has no IDL and requires no codegen"
      - "Thrift cannot represent nested structures"
    answer: 0
    explanation: |
      Both are IDL + codegen binary formats with field IDs, but Thrift ships a complete
      RPC stack (transports, protocols, servers), whereas Protobuf is primarily the
      serialization layer (with gRPC as the separate RPC framework).
    ref: "concepts.md#thrift-messagepack-and-other-formats"

  - id: schema-evolution-and-registry-017
    difficulty: intermediate
    tags: [messagepack, formats]
    question: |
      MessagePack is often called "binary JSON." What key capability does it NOT provide
      compared to Protobuf/Avro?
    options:
      - "Enforced schema and schema-evolution rules"
      - "A self-describing data model"
      - "A compact binary encoding"
      - "Support for maps and arrays"
    answer: 0
    explanation: |
      MessagePack maps the JSON data model to a compact, self-describing binary encoding
      but is schemaless — it gives you smaller/faster JSON-shaped payloads without the
      enforced schema evolution of Protobuf/Avro.
    ref: "concepts.md#thrift-messagepack-and-other-formats"

  - id: schema-evolution-and-registry-018
    difficulty: advanced
    tags: [formats, flatbuffers]
    question: |
      Which format family lets you READ fields without a separate parse/decode step
      ("zero-copy"), making it attractive for latency-critical reads?
    options:
      - "JSON and XML"
      - "CSV and YAML"
      - "Avro and Thrift"
      - "FlatBuffers and Cap'n Proto"
    answer: 3
    explanation: |
      FlatBuffers and Cap'n Proto lay out data so fields can be accessed directly in the
      buffer without deserialization, which suits games and latency-critical read paths.
    ref: "concepts.md#thrift-messagepack-and-other-formats"

  - id: schema-evolution-and-registry-019
    difficulty: beginner
    tags: [evolution, writer-reader]
    question: |
      In schema evolution, what is the "writer schema"?
    options:
      - "The schema the consumer expects to decode into"
      - "The schema the producer used to encode the bytes"
      - "The newest schema registered in the registry"
      - "The schema stored on disk in the broker"
    answer: 1
    explanation: |
      The writer schema is what the producer used to encode the data; the reader schema
      is what the consumer uses to decode. They are frequently different versions.
    ref: "concepts.md#schema-evolution-fundamentals"

  - id: schema-evolution-and-registry-020
    difficulty: intermediate
    tags: [evolution, backward, forward]
    question: |
      Which statement correctly defines backward vs forward compatibility?
    options:
      - "Backward and forward mean the same thing"
      - "Backward: an old reader can read new data. Forward: a new reader can read old data."
      - "Backward: a new reader can read old data. Forward: an old reader can read new data."
      - "Backward: producers deploy first. Forward: consumers deploy first."
    answer: 2
    explanation: |
      Backward compatibility = new code reads old data. Forward compatibility = old code
      reads new data (the reader ignores what it doesn't understand). The deploy-order
      implications follow from these definitions.
    ref: "concepts.md#schema-evolution-fundamentals"

  - id: schema-evolution-and-registry-021
    difficulty: intermediate
    tags: [evolution, scenario]
    question: |
      You ship new consumer code that must correctly process messages still being
      produced by old, not-yet-upgraded producers. Which compatibility property must hold?
    options:
      - "Forward compatibility"
      - "No compatibility is needed"
      - "Backward compatibility"
      - "Transitive-only compatibility"
    answer: 2
    explanation: |
      New reader reading old-writer data is exactly backward compatibility. That is why,
      under BACKWARD mode, you upgrade consumers first — they must handle both old and new data.
    ref: "concepts.md#schema-evolution-fundamentals"

  - id: schema-evolution-and-registry-022
    difficulty: beginner
    tags: [compatibility-modes, default]
    question: |
      What is the DEFAULT compatibility mode in Confluent Schema Registry?
    options:
      - "BACKWARD"
      - "FULL_TRANSITIVE"
      - "FORWARD"
      - "NONE"
    answer: 0
    explanation: |
      The default is BACKWARD: a new schema can read data written with the previous
      schema. Allowed changes are adding optional/defaulted fields and deleting fields.
    ref: "concepts.md#compatibility-modes-backward-forward-full-none"

  - id: schema-evolution-and-registry-023
    difficulty: intermediate
    tags: [compatibility-modes, backward]
    question: |
      Under BACKWARD compatibility, which client should you upgrade first?
    options:
      - "Producers, then consumers"
      - "Order does not matter"
      - "Both simultaneously in a big-bang deploy"
      - "Consumers, then producers"
    answer: 3
    explanation: |
      BACKWARD guarantees a new schema reads data from the previous schema, so consumers
      (readers) go first — they can handle both old and new data before producers switch.
    ref: "concepts.md#compatibility-modes-backward-forward-full-none"

  - id: schema-evolution-and-registry-024
    difficulty: intermediate
    tags: [compatibility-modes, forward]
    question: |
      Under FORWARD compatibility, which client should you upgrade first?
    options:
      - "Consumers"
      - "Producers"
      - "Neither — it is unsafe to upgrade either"
      - "The schema registry itself"
    answer: 1
    explanation: |
      FORWARD guarantees the previous schema can read data written with the new schema,
      so producers go first — old consumers can still read the newly-produced data.
    ref: "concepts.md#compatibility-modes-backward-forward-full-none"

  - id: schema-evolution-and-registry-025
    difficulty: advanced
    tags: [compatibility-modes, full]
    question: |
      A shared topic is consumed and produced by many independent teams that deploy on
      their own schedules and cannot coordinate order. Which compatibility mode best
      supports independent upgrades in either order?
    options:
      - "NONE"
      - "FULL (or FULL_TRANSITIVE)"
      - "FORWARD"
      - "BACKWARD"
    answer: 1
    explanation: |
      FULL guarantees both backward and forward compatibility, so producers and consumers
      can be upgraded independently in any order — ideal when teams cannot coordinate.
    ref: "concepts.md#compatibility-modes-backward-forward-full-none"

  - id: schema-evolution-and-registry-026
    difficulty: advanced
    tags: [compatibility-modes, transitive]
    question: |
      What distinguishes a TRANSITIVE compatibility mode from its non-transitive counterpart?
    options:
      - "Transitive modes disable compatibility checks entirely"
      - "Transitive modes only apply to Protobuf"
      - "Transitive modes check the new schema against ALL previously registered versions, not just the latest"
      - "Transitive modes require producers and consumers to share a schema ID"
    answer: 2
    explanation: |
      Non-transitive modes check only against the latest registered schema; transitive
      modes check against every prior version — needed when consumers may still see very
      old data (topic replay, compacted topics).
    ref: "concepts.md#compatibility-modes-backward-forward-full-none"

  - id: schema-evolution-and-registry-027
    difficulty: intermediate
    tags: [compatibility-modes, none]
    question: |
      What does setting a subject's compatibility mode to NONE actually do?
    options:
      - "It disables all compatibility checks so any schema change is accepted, with no safety guarantees"
      - "It guarantees full backward and forward compatibility"
      - "It rejects all new schema versions"
      - "It automatically rewrites incompatible schemas to be compatible"
    answer: 0
    explanation: |
      NONE turns off the checks entirely. It does not make evolution safe — it just stops
      the registry from stopping you, so it should be reserved for controlled migrations.
    ref: "concepts.md#compatibility-modes-backward-forward-full-none"

  - id: schema-evolution-and-registry-028
    difficulty: advanced
    tags: [compatibility-modes, transitive, scenario]
    question: |
      Your consumers frequently replay a topic from the very beginning, so they must be
      able to read data from ALL historical schema versions, not just the previous one.
      Which mode should you choose?
    options:
      - "BACKWARD"
      - "FORWARD"
      - "NONE"
      - "BACKWARD_TRANSITIVE"
    answer: 3
    explanation: |
      Because old data is still read on replay, you need a transitive mode. BACKWARD_TRANSITIVE
      checks each new schema against every prior version, guaranteeing the new consumer can
      read all historical data.
    ref: "concepts.md#compatibility-modes-backward-forward-full-none"

  - id: schema-evolution-and-registry-029
    difficulty: intermediate
    tags: [add-remove-fields, defaults]
    question: |
      Which single practice makes ADDING a field both backward- and forward-compatible?
    options:
      - "Making the new field required"
      - "Encrypting the new field"
      - "Placing the new field first in the schema"
      - "Giving the new field a default value"
    answer: 3
    explanation: |
      A default lets a reader fill in a missing value for old data (backward) while old
      readers simply ignore the new field (forward). Adding a defaulted field is the
      canonical safe additive change.
    ref: "concepts.md#adding-and-removing-fields-safely"

  - id: schema-evolution-and-registry-030
    difficulty: intermediate
    tags: [add-remove-fields, required]
    question: |
      Why is adding a NEW REQUIRED field (no default) to an existing schema unsafe for a
      new consumer reading old data?
    options:
      - "Required fields are always encrypted"
      - "Old data has no value for the field, so the new reader cannot satisfy the requirement"
      - "Required fields cannot be indexed"
      - "It doubles the message size"
    answer: 1
    explanation: |
      Old records were written without the field, so a new reader that requires it has no
      value to use — breaking backward compatibility. New fields should always be
      optional with a default.
    ref: "concepts.md#adding-and-removing-fields-safely"

  - id: schema-evolution-and-registry-031
    difficulty: advanced
    tags: [add-remove-fields, avro, rename]
    question: |
      Renaming a field is safe in Protobuf but breaks Avro. Why the difference?
    options:
      - "Avro compresses field names, so renaming corrupts the compression"
      - "Avro forbids all field changes"
      - "Protobuf matches fields by number (names are cosmetic) while Avro matches fields by name during schema resolution"
      - "Protobuf stores field names in the bytes and Avro does not"
    answer: 2
    explanation: |
      Protobuf keys fields by number, so the wire bytes are unaffected by a rename. Avro
      resolves fields by name, so a rename looks like dropping one field and adding
      another — use Avro aliases to rename safely.
    ref: "concepts.md#adding-and-removing-fields-safely"

  - id: schema-evolution-and-registry-032
    difficulty: intermediate
    tags: [add-remove-fields, remove]
    question: |
      Removing which kind of field is generally safe for evolution?
    options:
      - "An optional/defaulted field"
      - "A required field with no default"
      - "The field with the lowest field number"
      - "The primary key field"
    answer: 0
    explanation: |
      Removing an optional/defaulted field is safe: new readers just don't look for it,
      and old readers can fall back to its default. Removing a required field breaks
      forward compatibility because new data lacks it.
    ref: "concepts.md#adding-and-removing-fields-safely"

  - id: schema-evolution-and-registry-033
    difficulty: beginner
    tags: [protobuf, field-numbers]
    question: |
      What is the cardinal rule about Protobuf field numbers?
    options:
      - "A field number is a permanent identity — never change or reuse it for a different field"
      - "They must be sequential with no gaps"
      - "They must be unique across the entire codebase, not just the message"
      - "They should be reassigned each release for clarity"
    answer: 0
    explanation: |
      Only the number is written on the wire, so a field number permanently identifies a
      field. Changing or reusing it makes old bytes decode as the wrong field.
    ref: "concepts.md#protobuf-field-numbers-never-reuse-or-renumber"

  - id: schema-evolution-and-registry-034
    difficulty: advanced
    tags: [protobuf, field-numbers, reuse]
    question: |
      What is the documented worst-case consequence of reusing a deleted Protobuf field
      number for a new, differently-typed field?
    options:
      - "The build fails at compile time, so it can't happen in production"
      - "The registry auto-renumbers the field for you"
      - "The message simply grows by a few bytes"
      - "Old serialized data mis-decodes into the new field, with consequences up to data corruption and leaked PII"
    answer: 3
    explanation: |
      Old data (or an old peer) still carries bytes tagged with that number and wire type.
      A new field reusing it silently mis-decodes — the Protobuf docs cite consequences up
      to data corruption and leaked PII.
    ref: "concepts.md#protobuf-field-numbers-never-reuse-or-renumber"

  - id: schema-evolution-and-registry-035
    difficulty: intermediate
    tags: [protobuf, reserved]
    question: |
      When you delete a field from a Protobuf message, what should you do to prevent
      accidental reuse?
    options:
      - "Set its value to null in all producers"
      - "Use the `reserved` keyword to reserve its number (and ideally its name)"
      - "Increment the message version number"
      - "Move it to the end of the message"
    answer: 1
    explanation: |
      Reserving the deleted field's number (and name) with the `reserved` keyword makes
      the compiler reject any future attempt to reuse them, protecting both the wire
      format and JSON/TextFormat parsing.
    ref: "concepts.md#protobuf-field-numbers-never-reuse-or-renumber"

  - id: schema-evolution-and-registry-036
    difficulty: intermediate
    tags: [protobuf, rename, field-numbers]
    question: |
      "Why can you rename a Protobuf field freely but never renumber it?" What is the
      correct explanation?
    options:
      - "Names are validated at runtime while numbers are not"
      - "Renaming triggers a schema-registry check but renumbering does not"
      - "The wire format keys fields by number, not name; names exist only in the .proto for humans and codegen"
      - "Numbers are stored in a separate index that renaming updates automatically"
    answer: 2
    explanation: |
      On the wire, fields are tagged by number; names live only in the .proto for humans
      and code generation. Renaming changes nothing on the wire, but renumbering changes
      the key every byte is tagged with.
    ref: "concepts.md#protobuf-field-numbers-never-reuse-or-renumber"

  - id: schema-evolution-and-registry-037
    difficulty: beginner
    tags: [enum, proto3]
    question: |
      What is required of every proto3 enum?
    options:
      - "It must have exactly two values"
      - "All values must be negative"
      - "Its first value must be zero (e.g., STATUS_UNSPECIFIED = 0), used as the default"
      - "It must be declared inside a oneof"
    answer: 2
    explanation: |
      proto3 requires a zero value as the first entry, which serves as the default when
      the field is unset. Reserving slot 0 for UNSPECIFIED/UNKNOWN is the recommended pattern.
    ref: "concepts.md#enum-evolution-and-unknown-values"

  - id: schema-evolution-and-registry-038
    difficulty: advanced
    tags: [enum, unknown-values, scenario]
    question: |
      A producer starts emitting a new enum value. An old consumer with a strict `switch`
      and no default branch crashes. What is the correct lesson?
    options:
      - "Adding an enum value is a compatibility change; consumers should model an UNKNOWN/UNSPECIFIED and always have a default branch"
      - "Enum values can never be added"
      - "The registry should have auto-upgraded the consumer"
      - "The producer must roll back permanently"
    answer: 0
    explanation: |
      Adding an enum value is forward-dangerous for old consumers. Defensive handling — a
      default/else branch and an explicit UNKNOWN/UNSPECIFIED — lets consumers degrade
      gracefully instead of failing.
    ref: "concepts.md#enum-evolution-and-unknown-values"

  - id: schema-evolution-and-registry-039
    difficulty: advanced
    tags: [enum, avro, default]
    question: |
      How can Avro (1.9+) let you add an enum symbol safely so old readers don't error on
      an unknown symbol?
    options:
      - "By automatically renaming unknown symbols"
      - "By forbidding any new enum symbols"
      - "By storing every symbol's integer in the message header"
      - "By declaring a `default` symbol on the enum, which is used when the reader sees an unknown symbol"
    answer: 3
    explanation: |
      An Avro enum can declare a default symbol; if the reader encounters a symbol not in
      its schema, it resolves to that default rather than throwing — the safe way to add
      enum symbols.
    ref: "concepts.md#enum-evolution-and-unknown-values"

  - id: schema-evolution-and-registry-040
    difficulty: advanced
    tags: [proto3, presence, defaults]
    question: |
      In proto3, why can't you distinguish an unset scalar field from one explicitly set
      to its default (e.g., an int32 of 0), unless you take extra steps?
    options:
      - "proto3 deletes zero-valued fields from the schema"
      - "proto3 scalars have implicit presence; use the `optional` keyword or wrapper types to get explicit presence"
      - "proto3 stores all scalars as strings"
      - "proto3 randomizes default values"
    answer: 1
    explanation: |
      proto3 scalars have implicit presence: an unset int32 reads as 0, indistinguishable
      from a set 0. Marking the field `optional` (or using wrapper types) restores explicit
      "was it set?" semantics.
    ref: "concepts.md#defaults-optional-and-required"

  - id: schema-evolution-and-registry-041
    difficulty: advanced
    tags: [proto2, required, footgun]
    question: |
      Why did proto3 remove the `required` field label that proto2 had?
    options:
      - "Required fields made messages too large"
      - "A required field can never be safely added to or removed from an existing message, permanently breaking cross-version parsing"
      - "Required fields were incompatible with gRPC"
      - "Required fields could not be encrypted"
    answer: 1
    explanation: |
      `required` was a notorious footgun: you can never safely add or remove a required
      field, and a single one can make a message permanently unparseable across versions.
      proto3 dropped it; treat every field as optional-with-a-default.
    ref: "concepts.md#defaults-optional-and-required"

  - id: schema-evolution-and-registry-042
    difficulty: intermediate
    tags: [avro, defaults]
    question: |
      In Avro, how does adding a field with a `default` to the reader schema let a
      consumer read OLD data that lacks the field?
    options:
      - "The consumer rejects the old data"
      - "Avro fetches the value from the registry"
      - "Avro substitutes the reader's default value for the missing field during schema resolution"
      - "Avro throws an error and skips the record"
    answer: 2
    explanation: |
      During schema resolution, if the writer schema lacks a field that the reader schema
      has with a default, Avro substitutes that default — which is what makes adding a
      defaulted field backward-compatible.
    ref: "concepts.md#defaults-optional-and-required"

  - id: schema-evolution-and-registry-043
    difficulty: beginner
    tags: [registry, purpose]
    question: |
      What is the primary purpose of a schema registry like Confluent or Apicurio?
    options:
      - "To store versioned schemas and enforce compatibility, decoupling producers and consumers so they can deploy independently"
      - "To compress messages before they hit the broker"
      - "To route messages to the correct partition"
      - "To encrypt schemas at rest"
    answer: 0
    explanation: |
      A schema registry centrally stores versioned schemas and enforces compatibility
      rules, letting producer and consumer teams deploy independently instead of in lockstep.
    ref: "concepts.md#the-schema-registry-confluent-apicurio"

  - id: schema-evolution-and-registry-044
    difficulty: intermediate
    tags: [registry, decoupling]
    question: |
      How does a schema registry move a schema-compatibility failure from "runtime in
      production" to "earlier and cheaper"?
    options:
      - "By retrying failed messages until they succeed"
      - "By buffering messages until all consumers upgrade"
      - "By quarantining bad messages in a dead-letter queue"
      - "By rejecting an incompatible schema at REGISTRATION time (and in CI), before it is ever produced to the topic"
    answer: 3
    explanation: |
      The registry runs the compatibility check when a schema is registered (and you can
      run it in CI), so a bad change is rejected before deploy rather than blowing up
      consumers at runtime.
    ref: "concepts.md#the-schema-registry-confluent-apicurio"

  - id: schema-evolution-and-registry-045
    difficulty: advanced
    tags: [registry, consume-flow]
    question: |
      When a Confluent Avro consumer receives a record, how does it obtain the schema
      needed to decode it?
    options:
      - "It reads the full schema embedded in the record body"
      - "It asks the producer directly over a side channel"
      - "It reconstructs the schema from the field names in the payload"
      - "It reads the schema ID from the record header and fetches the writer schema from the registry (caching it locally)"
    answer: 3
    explanation: |
      The consumer reads the 4-byte schema ID from the header, fetches the corresponding
      writer schema from the registry (cached), and then decodes — resolving writer to
      reader schema for Avro.
    ref: "concepts.md#the-schema-registry-confluent-apicurio"

  - id: schema-evolution-and-registry-046
    difficulty: intermediate
    tags: [registry, apicurio, alternatives]
    question: |
      Which of these is an open-source, Confluent-API-compatible schema registry
      supporting Avro, Protobuf, and JSON Schema?
    options:
      - "Apache ZooKeeper"
      - "Apicurio Registry"
      - "HashiCorp Vault"
      - "Prometheus"
    answer: 1
    explanation: |
      Apicurio Registry (Red Hat) is a popular open-source alternative, API-compatible
      with Confluent's, supporting Avro/Protobuf/JSON Schema (and OpenAPI/AsyncAPI
      artifacts). AWS Glue Schema Registry is a managed alternative.
    ref: "concepts.md#the-schema-registry-confluent-apicurio"

  - id: schema-evolution-and-registry-047
    difficulty: beginner
    tags: [subject-naming, default-strategy]
    question: |
      Under the default TopicNameStrategy, what are the subjects for a Kafka topic named
      `orders`?
    options:
      - "`orders-1` and `orders-2`"
      - "`orders-schema`"
      - "`orders-key` and `orders-value`"
      - "`key-orders` and `value-orders`"
    answer: 2
    explanation: |
      TopicNameStrategy (the default) creates one subject per topic per key/value:
      `<topic>-key` and `<topic>-value`, so here `orders-key` and `orders-value`.
    ref: "concepts.md#subject-naming-strategies-and-who-validates"

  - id: schema-evolution-and-registry-048
    difficulty: advanced
    tags: [subject-naming, record-name-strategy, scenario]
    question: |
      You want to put SEVERAL different event types on a single topic, each evolving
      independently under its own compatibility history. Which subject naming strategy
      supports this?
    options:
      - "RecordNameStrategy (or TopicRecordNameStrategy)"
      - "TopicNameStrategy"
      - "PartitionNameStrategy"
      - "KeyOnlyStrategy"
    answer: 0
    explanation: |
      RecordNameStrategy uses the record's fully-qualified name as the subject, so
      multiple event types can share a topic and evolve independently.
      TopicRecordNameStrategy scopes that per topic.
    ref: "concepts.md#subject-naming-strategies-and-who-validates"

  - id: schema-evolution-and-registry-049
    difficulty: intermediate
    tags: [subject-naming, validation]
    question: |
      Where does the compatibility check primarily happen, and where does it NOT?
    options:
      - "At schema REGISTRATION (produce side / CI); the consumer just fetches the writer schema and decodes, it does not re-run the compatibility policy"
      - "At consume time only; producers never check"
      - "Inside the Kafka broker on every message"
      - "In the network layer during transmission"
    answer: 0
    explanation: |
      The registry enforces compatibility when a schema is registered (and you can run it
      in CI with a test-compatibility goal). The consumer only fetches and decodes; it
      does not re-evaluate the policy.
    ref: "concepts.md#subject-naming-strategies-and-who-validates"

  - id: schema-evolution-and-registry-050
    difficulty: intermediate
    tags: [subject-naming, per-subject-mode]
    question: |
      Where does a compatibility mode actually apply in Confluent Schema Registry?
    options:
      - "Globally across the whole cluster only"
      - "Per consumer group"
      - "Per partition"
      - "Per subject, so different topics/subjects can have different strictness (with a global default as fallback)"
    answer: 3
    explanation: |
      Compatibility is configured per subject (with a global default as fallback), so you
      can set FULL_TRANSITIVE on a critical shared topic and BACKWARD elsewhere. Set it
      deliberately rather than relying on the default.
    ref: "concepts.md#subject-naming-strategies-and-who-validates"

  - id: schema-evolution-and-registry-051
    difficulty: intermediate
    tags: [rest, openapi, contrast]
    question: |
      How does breaking-change handling typically differ between REST/OpenAPI and
      event-stream schemas?
    options:
      - "REST evolves one schema in place under a compatibility mode; streaming spins up a new URL version"
      - "REST tends to introduce a NEW version (e.g. /v1 to /v2) run in parallel, while event streaming tends to evolve one schema in place under a compatibility contract"
      - "Both always spin up parallel versions"
      - "Neither ever supports breaking changes"
    answer: 1
    explanation: |
      REST commonly versions explicitly (new URL/media type) and runs versions in parallel;
      event streaming favors evolving a single schema in place under a registry-enforced
      compatibility mode.
    ref: "concepts.md#contrast-with-rest-and-openapi-versioning"

  - id: schema-evolution-and-registry-052
    difficulty: advanced
    tags: [rest, openapi, enforcement]
    question: |
      What is a key difference in ENFORCEMENT between a Kafka schema registry and a
      typical REST/OpenAPI contract?
    options:
      - "OpenAPI automatically rejects incompatible server changes at deploy time, just like a registry"
      - "Neither enforces anything"
      - "The registry enforces compatibility automatically at register time (rejecting bad changes), whereas REST/OpenAPI compatibility is mostly manual via contract tests and linters"
      - "REST enforcement happens in the broker"
    answer: 2
    explanation: |
      A schema registry mechanically rejects incompatible schemas at registration. REST/OpenAPI
      compatibility is usually enforced by convention, contract tests, and linters rather
      than an automatic gate.
    ref: "concepts.md#contrast-with-rest-and-openapi-versioning"

  - id: schema-evolution-and-registry-053
    difficulty: beginner
    tags: [rest, openapi, shared-discipline]
    question: |
      Despite different tooling, what core discipline do REST/OpenAPI and event-stream
      schema evolution share?
    options:
      - "Both require a new URL for every change"
      - "Both forbid removing any field ever"
      - "Additive/optional changes are safe, while removing/renaming/retyping required fields is a breaking change"
      - "Both store schemas in the same registry"
    answer: 2
    explanation: |
      Both follow the same rule: additive/optional changes are safe; removing, renaming,
      or retyping required fields breaks consumers. Defaults and deprecation windows are
      how each avoids lockstep upgrades.
    ref: "concepts.md#contrast-with-rest-and-openapi-versioning"

  - id: schema-evolution-and-registry-054
    difficulty: expert
    tags: [kafka-streams, compatibility, scenario]
    question: |
      A Kafka Streams application reads from an input topic and writes to an output topic.
      Confluent notes Streams supports only FULL, FULL_TRANSITIVE, BACKWARD, and
      BACKWARD_TRANSITIVE, and that the Streams app must be upgraded before the upstream
      producer. What property of Streams apps drives this ordering requirement?
    options:
      - "A Streams app is simultaneously a consumer of its input and a producer of its output, so it must be able to read new data before producers emit it — favoring backward-style guarantees with consumers upgraded first"
      - "Streams apps produce faster than they consume"
      - "Streams apps do not use the schema registry"
      - "Streams apps always use NONE compatibility"
    answer: 0
    explanation: |
      A Streams app both consumes and produces, so it sits downstream of producers as a
      reader. It must handle new data before upstream producers emit it — hence the
      backward-style modes and upgrading the Streams app first.
    ref: "concepts.md#compatibility-modes-backward-forward-full-none"

  - id: schema-evolution-and-registry-055
    difficulty: expert
    tags: [avro, type-promotion, scenario]
    question: |
      A team wants to change an Avro field from `int` to `long` to hold larger values.
      Under Avro schema resolution, what is true?
    options:
      - "This is always a breaking change and requires a brand-new topic"
      - "The change is only safe if you also rename the field"
      - "Avro forbids all type changes without exception"
      - "Avro permits certain numeric type promotions such as int to long, so a reader with a long field can read data written with an int"
    answer: 3
    explanation: |
      Avro schema resolution allows a narrow set of numeric promotions (e.g., int to long,
      float to double). A reader expecting a long can read int-written data. Arbitrary type
      changes, however, remain unsafe.
    ref: "concepts.md#adding-and-removing-fields-safely"

  - id: schema-evolution-and-registry-056
    difficulty: expert
    tags: [scenario, migration, none]
    question: |
      You must make a genuinely breaking change (e.g., changing a field's type
      incompatibly) to a heavily-used subject. Which approach best balances safety and
      independence of deploys?
    options:
      - "Set the subject to NONE, register the breaking schema, and let consumers crash until they catch up"
      - "Introduce the change additively (new field alongside the old), migrate consumers, then remove the old field later under a compatibility mode — rather than an in-place incompatible change"
      - "Rename all Protobuf field numbers to force a fresh start"
      - "Delete the subject and recreate it with the same name"
    answer: 1
    explanation: |
      The safe pattern is a phased, additive migration: add the new representation
      alongside the old, move consumers over, then retire the old field — preserving
      compatibility throughout instead of flipping to NONE and breaking consumers.
    ref: "concepts.md#adding-and-removing-fields-safely"
