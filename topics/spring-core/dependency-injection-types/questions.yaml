topic: "Dependency Injection Types"
domain: spring-core
topic_slug: dependency-injection-types
version: 1
questions:
  - id: dependency-injection-types-001
    difficulty: beginner
    tags: [ioc, di, definitions]
    question: |
      What is the relationship between Inversion of Control (IoC) and Dependency Injection (DI)?
    options:
      - "They are two unrelated design patterns that must never be combined"
      - "DI is a specific way of implementing the broader IoC principle"
      - "IoC is a specific way of implementing the broader DI principle"
      - "IoC replaced DI in modern versions of Spring"
    answer: 1
    explanation: |
      IoC is the general principle of handing control of object creation and wiring to a
      container. DI is a specific technique that realizes IoC by injecting a component's
      collaborators. Every DI mechanism is a form of IoC, but IoC can also be achieved by other
      patterns such as the Service Locator pattern.
    ref: "concepts.md#ioc-and-dependency-injection"

  - id: dependency-injection-types-002
    difficulty: beginner
    tags: [ioc, container]
    question: |
      In Spring, which interface represents the core IoC container that instantiates beans and
      injects their dependencies?
    options:
      - "DispatcherServlet"
      - "DataSource"
      - "PlatformTransactionManager"
      - "BeanFactory (and its sub-interface ApplicationContext)"
    answer: 3
    explanation: |
      The Spring IoC container is represented by the BeanFactory interface and its richer
      sub-interface ApplicationContext. The container reads configuration metadata, instantiates
      beans, and injects their dependencies.
    ref: "concepts.md#ioc-and-dependency-injection"

  - id: dependency-injection-types-003
    difficulty: beginner
    tags: [di, coupling, benefits]
    question: |
      Which is a primary benefit of using Dependency Injection instead of having a class create
      its own collaborators with `new`?
    options:
      - "It guarantees the program uses less memory at runtime"
      - "It removes the need to compile the code"
      - "It produces loose coupling and makes the class easier to unit test with mocks"
      - "It automatically encrypts all injected objects"
    answer: 2
    explanation: |
      DI decouples a class from the concrete construction of its collaborators. Because
      dependencies are supplied from outside, you can pass in mocks or stubs during testing and
      swap implementations without changing the class — this is loose coupling and improved
      testability.
    ref: "concepts.md#ioc-and-dependency-injection"

  - id: dependency-injection-types-004
    difficulty: intermediate
    tags: [ioc, service-locator]
    question: |
      How does Dependency Injection differ from the Service Locator pattern, even though both
      are forms of IoC?
    options:
      - "Service Locator pushes dependencies into the object; DI pulls them from a registry"
      - "They are identical; the terms are interchangeable"
      - "Service Locator can only be used in XML configuration"
      - "DI pushes dependencies into the object; Service Locator has the object pull them from a registry"
    answer: 3
    explanation: |
      With DI, dependencies are pushed into the object by the container, so they are explicit and
      the class does not depend on any locator API. With Service Locator, the object actively
      pulls its dependencies from a registry, which couples it to the locator and hides
      dependencies. DI is generally preferred for testability and clarity.
    ref: "concepts.md#ioc-and-dependency-injection"

  - id: dependency-injection-types-005
    difficulty: beginner
    tags: [constructor-injection, basics]
    question: |
      In constructor injection, when are a bean's dependencies supplied?
    options:
      - "As arguments when the container instantiates the bean via its constructor"
      - "Only after all setters have been called"
      - "Lazily, the first time each dependency is used"
      - "Never; the bean must look them up itself"
    answer: 0
    explanation: |
      Constructor injection supplies dependencies as constructor arguments. The container
      resolves each argument and passes them when it instantiates the bean, so the bean is fully
      wired the moment construction completes.
    ref: "concepts.md#constructor-injection"

  - id: dependency-injection-types-006
    difficulty: beginner
    tags: [constructor-injection, autowired, spring-4-3]
    question: |
      Since Spring Framework 4.3, when is `@Autowired` optional on a constructor?
    options:
      - "When the class extends another Spring bean"
      - "When the class has exactly one constructor"
      - "Only when the constructor has no arguments"
      - "It is never optional; every constructor still needs @Autowired"
    answer: 1
    explanation: |
      Since Spring 4.3, if a class declares exactly one constructor, Spring will use it for
      autowiring automatically, so @Autowired is not required. With multiple constructors you must
      annotate exactly one with @Autowired.
    ref: "concepts.md#constructor-injection"

  - id: dependency-injection-types-007
    difficulty: intermediate
    tags: [constructor-injection, final, immutability]
    question: |
      Why can constructor-injected fields be declared `final` while setter-injected fields
      generally cannot?
    options:
      - "final fields are set once at construction time, which the constructor can do but a setter cannot"
      - "final has no effect on injected fields in Spring"
      - "Setter injection secretly removes the final modifier at runtime"
      - "Only static fields can be final, so it is unrelated to injection type"
    answer: 0
    explanation: |
      A final field must be assigned exactly once, during construction. Constructor injection
      assigns it in the constructor, satisfying that rule and giving immutability. A setter runs
      after construction and would need to reassign the field, which final forbids.
    ref: "concepts.md#constructor-injection"

  - id: dependency-injection-types-008
    difficulty: intermediate
    tags: [constructor-injection, circular-dependency]
    question: |
      What happens if two beans each require the other purely through constructor injection?
    options:
      - "Spring silently sets one of them to null"
      - "Spring merges the two beans into one"
      - "Spring throws an exception (e.g. BeanCurrentlyInCreationException) because the cycle cannot be resolved"
      - "Spring creates infinite copies of both beans"
    answer: 2
    explanation: |
      A mutual constructor dependency cannot be satisfied: neither bean can be constructed first
      because each needs the other already built. Spring detects this and throws (for example
      BeanCurrentlyInCreationException / UnsatisfiedDependencyException) at startup, surfacing the
      design problem early.
    ref: "concepts.md#constructor-injection"

  - id: dependency-injection-types-009
    difficulty: beginner
    tags: [constructor-injection, xml]
    question: |
      Which XML element is used to express constructor injection in Spring bean definitions?
    options:
      - "<property>"
      - "<constructor-arg>"
      - "<lookup-method>"
      - "<autowire>"
    answer: 1
    explanation: |
      <constructor-arg> supplies arguments to the bean's constructor in XML configuration.
      <property>, by contrast, corresponds to setter injection.
    ref: "concepts.md#constructor-injection"

  - id: dependency-injection-types-010
    difficulty: beginner
    tags: [setter-injection, basics]
    question: |
      How does setter injection supply dependencies to a bean?
    options:
      - "Through constructor parameters"
      - "By reading a static configuration file at class-load time"
      - "By reflection directly into private fields, bypassing any method"
      - "By calling JavaBean-style setter methods after the bean is instantiated"
    answer: 3
    explanation: |
      With setter injection, the container first instantiates the bean (typically via a no-arg
      constructor), then calls the annotated setter methods to inject each dependency after
      construction.
    ref: "concepts.md#setter-injection"

  - id: dependency-injection-types-011
    difficulty: intermediate
    tags: [setter-injection, partial-initialization]
    question: |
      Which statement about setter injection is correct?
    options:
      - "The bean is guaranteed fully initialized the moment its constructor returns"
      - "Setter-injected fields are always final"
      - "There is a window where the bean exists but some dependencies are still null, between construction and setter completion"
      - "Setter injection cannot be used with @Autowired"
    answer: 2
    explanation: |
      Because setters run after construction, the bean briefly exists in a partially-initialized
      state where dependencies are still null. This is one reason constructor injection is
      preferred for mandatory dependencies.
    ref: "concepts.md#setter-injection"

  - id: dependency-injection-types-012
    difficulty: beginner
    tags: [setter-injection, xml]
    question: |
      Which XML element corresponds to setter injection?
    options:
      - "<constructor-arg>"
      - "<property>"
      - "<qualifier>"
      - "<replaced-method>"
    answer: 1
    explanation: |
      The <property> element in XML is backed by a JavaBean setter; Spring calls the setter to
      inject the referenced value or bean. <constructor-arg> corresponds to constructor injection.
    ref: "concepts.md#setter-injection"

  - id: dependency-injection-types-013
    difficulty: intermediate
    tags: [setter-injection, optional-dependency]
    question: |
      How can you mark a setter-injected dependency as optional so Spring skips it when no
      matching bean exists?
    options:
      - "@Autowired(required = false) on the setter"
      - "@Primary on the setter"
      - "@Scope(\"prototype\") on the class"
      - "@Lazy on the field"
    answer: 0
    explanation: |
      @Autowired(required = false) (or @Nullable on the parameter) tells Spring the dependency is
      optional; if no matching bean is found, the setter is simply not invoked and any default
      value remains in place.
    ref: "concepts.md#setter-injection"

  - id: dependency-injection-types-014
    difficulty: beginner
    tags: [field-injection, basics]
    question: |
      What characterizes field injection in Spring?
    options:
      - "@Autowired is placed directly on a field and Spring sets it via reflection"
      - "Dependencies are passed as constructor arguments"
      - "Dependencies are read from environment variables only"
      - "It requires an explicit setter method for each field"
    answer: 0
    explanation: |
      Field injection places @Autowired (or @Inject / @Resource) directly on a field, and Spring
      populates the field reflectively after the object is constructed — no constructor or setter
      is needed.
    ref: "concepts.md#field-injection"

  - id: dependency-injection-types-015
    difficulty: beginner
    tags: [field-injection, boilerplate]
    question: |
      What is the most commonly cited *advantage* of field injection?
    options:
      - "It makes fields immutable"
      - "It is the only form that supports optional dependencies"
      - "It guarantees the class can be tested without Spring"
      - "It is the most concise form, requiring no constructor or setter boilerplate"
    answer: 3
    explanation: |
      Field injection's appeal is brevity: you annotate the field and skip constructor/setter
      code. However, it sacrifices immutability and testability, which is why it is discouraged in
      production code.
    ref: "concepts.md#field-injection"

  - id: dependency-injection-types-016
    difficulty: intermediate
    tags: [field-injection, final]
    question: |
      Why can't a field-injected dependency be declared `final`?
    options:
      - "Because Spring only injects into public fields"
      - "Because Spring assigns the field reflectively after construction, whereas a final field must be set during construction"
      - "Because final fields are not supported by the JVM"
      - "Because @Autowired removes the final modifier at compile time"
    answer: 1
    explanation: |
      A final field must be initialized during construction. Field injection sets the value
      reflectively after the object already exists, which conflicts with final's single-assignment
      at construction rule, so field-injected dependencies must be non-final and mutable.
    ref: "concepts.md#field-injection"

  - id: dependency-injection-types-017
    difficulty: beginner
    tags: [comparison, testability]
    question: |
      Which injection type makes it easiest to instantiate a class in a plain unit test without
      starting a Spring context?
    options:
      - "Field injection"
      - "Constructor injection"
      - "None of them can be tested without Spring"
      - "They are all equally easy"
    answer: 1
    explanation: |
      Constructor injection lets you write `new MyService(mockA, mockB)` directly in a test — no
      Spring context and no reflection needed. Field injection requires reflection or a running
      container to populate the fields.
    ref: "concepts.md#constructor-vs-setter-vs-field-injection"

  - id: dependency-injection-types-018
    difficulty: intermediate
    tags: [comparison, mandatory-optional]
    question: |
      According to Spring team guidance, which injection strategy fits mandatory versus optional
      dependencies?
    options:
      - "Constructor for optional, setter for mandatory"
      - "Field for mandatory, constructor for optional"
      - "Constructor for mandatory, setter for optional or changeable dependencies"
      - "Setter for everything, constructor for nothing"
    answer: 2
    explanation: |
      The Spring team recommends constructor injection for mandatory dependencies (guaranteed
      present, immutable) and setter injection for optional or reconfigurable dependencies, while
      generally avoiding field injection in production code.
    ref: "concepts.md#constructor-vs-setter-vs-field-injection"

  - id: dependency-injection-types-019
    difficulty: intermediate
    tags: [comparison, partial-construction]
    question: |
      Which injection type avoids the risk of a partially-constructed bean?
    options:
      - "Setter injection"
      - "Field injection"
      - "Constructor injection"
      - "All three carry the same risk"
    answer: 2
    explanation: |
      With constructor injection, all required dependencies are present the moment the constructor
      returns, so the bean is never partially constructed. Setter and field injection both leave a
      window where the object exists but dependencies are still null.
    ref: "concepts.md#constructor-vs-setter-vs-field-injection"

  - id: dependency-injection-types-020
    difficulty: beginner
    tags: [comparison, boilerplate]
    question: |
      Ordered from most to least boilerplate, how do the three injection types compare?
    options:
      - "Field > Setter > Constructor"
      - "Constructor > Setter > Field"
      - "Setter > Constructor > Field"
      - "They all require identical amounts of code"
    answer: 1
    explanation: |
      Constructor injection needs a constructor (most code), setter injection needs setter methods
      (medium), and field injection just annotates the field (least). Boilerplate, however, is a
      weak reason to choose field injection given its testability and immutability drawbacks.
    ref: "concepts.md#constructor-vs-setter-vs-field-injection"

  - id: dependency-injection-types-021
    difficulty: beginner
    tags: [why-constructor, immutability]
    question: |
      Which of these is a reason constructor injection is preferred for required dependencies?
    options:
      - "It allows dependencies to be declared final, enforcing immutability"
      - "It hides the dependencies from the class's API"
      - "It makes circular dependencies always succeed"
      - "It removes the need to write unit tests"
    answer: 0
    explanation: |
      Constructor injection lets dependencies be final, so they are set exactly once and cannot be
      reassigned. This immutability makes objects safer to share and reason about, and is one of
      the main reasons the Spring team recommends it.
    ref: "concepts.md#why-constructor-injection-is-preferred"

  - id: dependency-injection-types-022
    difficulty: intermediate
    tags: [why-constructor, mandatory-deps, fail-fast]
    question: |
      How does constructor injection enforce that mandatory dependencies are present?
    options:
      - "By logging a warning if a dependency is missing but continuing anyway"
      - "By retrying injection every few seconds until the dependency appears"
      - "By defaulting missing dependencies to null and continuing"
      - "By making it impossible to construct the object without supplying every required collaborator, failing at construction/startup time"
    answer: 3
    explanation: |
      You cannot instantiate a class without providing its constructor arguments, so a bean can
      never be created missing a required dependency. Problems surface at context startup /
      construction time rather than later as a NullPointerException.
    ref: "concepts.md#why-constructor-injection-is-preferred"

  - id: dependency-injection-types-023
    difficulty: intermediate
    tags: [why-constructor, srp, design-feedback]
    question: |
      Why is a long constructor parameter list sometimes considered a *useful* signal?
    options:
      - "It means the class is very well designed"
      - "It makes the dependencies explicit and flags that the class may be doing too much (violating SRP)"
      - "It improves runtime performance"
      - "It automatically splits the class into smaller ones"
    answer: 1
    explanation: |
      Constructor injection makes every dependency visible in one signature. A growing parameter
      list is honest feedback that the class has too many responsibilities (an SRP violation) —
      feedback that field injection hides because adding another @Autowired field is invisible.
    ref: "concepts.md#why-constructor-injection-is-preferred"

  - id: dependency-injection-types-024
    difficulty: beginner
    tags: [why-constructor, lombok, records]
    question: |
      Which feature helps reduce the boilerplate objection against constructor injection?
    options:
      - "Lombok's @RequiredArgsConstructor or Java records generating the constructor"
      - "Marking every field @Transient"
      - "Using System.out.println for wiring"
      - "Disabling the Spring container"
    answer: 0
    explanation: |
      Lombok's @RequiredArgsConstructor and Java records generate the constructor for you, and
      since Spring 4.3 a single constructor needs no @Autowired. Together these make constructor
      injection concise, removing most of the boilerplate complaint.
    ref: "concepts.md#why-constructor-injection-is-preferred"

  - id: dependency-injection-types-025
    difficulty: intermediate
    tags: [when-setter, optional-default]
    question: |
      Which scenario is the best fit for setter injection?
    options:
      - "A mandatory dependency that must never be null"
      - "A dependency you want to declare final for immutability"
      - "An optional dependency that has a sensible default and is only sometimes overridden"
      - "A dependency you want present before the constructor returns"
    answer: 2
    explanation: |
      Setter injection shines for optional or reconfigurable dependencies — especially ones with a
      reasonable default that only sometimes needs overriding (often paired with
      @Autowired(required = false)). Mandatory, immutable dependencies belong in the constructor.
    ref: "concepts.md#when-to-use-setter-injection"

  - id: dependency-injection-types-026
    difficulty: intermediate
    tags: [when-setter, reconfiguration]
    question: |
      Besides optional dependencies, which situation is a reasonable use of setter injection?
    options:
      - "When a dependency may need to be changed or re-injected after the bean is constructed"
      - "When you want the dependency to be final"
      - "When you want to guarantee no partially-initialized state"
      - "When you want to hide the dependency from all configuration"
    answer: 0
    explanation: |
      Setter injection supports reconfiguration: a dependency exposed via a setter can be changed
      or re-injected after construction (e.g. JMX-exposed re-settable configuration), which
      constructor injection cannot offer once the object is built.
    ref: "concepts.md#when-to-use-setter-injection"

  - id: dependency-injection-types-027
    difficulty: intermediate
    tags: [when-setter, circular-dependency]
    question: |
      How can setter (or field) injection sometimes resolve a circular dependency between two
      singleton beans that constructor injection cannot?
    options:
      - "It deletes one of the beans"
      - "It converts both beans to prototypes automatically"
      - "It is impossible; setter injection also fails on all cycles"
      - "Spring can construct both beans first, then wire them via setters afterward"
    answer: 3
    explanation: |
      Because setters run after construction, Spring can instantiate both singleton beans first
      and then inject the references, breaking the chicken-and-egg cycle. Constructor injection
      cannot, since each object needs the other already built. The cycle is still a design smell,
      though.
    ref: "concepts.md#when-to-use-setter-injection"

  - id: dependency-injection-types-028
    difficulty: beginner
    tags: [why-field-discouraged, testability]
    question: |
      What is a key reason field injection is discouraged?
    options:
      - "It makes the class impossible to compile"
      - "It makes the class hard to test without a Spring container because fields are set reflectively"
      - "It forces every field to be final"
      - "It doubles memory usage"
    answer: 1
    explanation: |
      Field injection sets values reflectively, so you cannot simply `new` the class and pass
      mocks. Tests must start a Spring context or use reflection utilities like
      ReflectionTestUtils.setField, which is fragile and verbose.
    ref: "concepts.md#why-field-injection-is-discouraged"

  - id: dependency-injection-types-029
    difficulty: intermediate
    tags: [why-field-discouraged, hidden-dependencies]
    question: |
      How does field injection tend to mask design problems?
    options:
      - "It reports SRP violations to the compiler"
      - "It prevents a class from having more than three dependencies"
      - "It makes it trivial to add many @Autowired fields, hiding that the class has too many responsibilities"
      - "It forces all dependencies into a single method signature"
    answer: 2
    explanation: |
      Because adding one more @Autowired field is effortless and invisible in the public API, a
      class can silently accumulate many dependencies. A long constructor parameter list would
      have made that bloat (and the likely SRP violation) obvious.
    ref: "concepts.md#why-field-injection-is-discouraged"

  - id: dependency-injection-types-030
    difficulty: intermediate
    tags: [why-field-discouraged, coupling, null]
    question: |
      If a field-injected class is instantiated with `new` outside of Spring, what typically
      happens?
    options:
      - "Spring intercepts the call and injects the fields anyway"
      - "The injected fields are null, leading to NullPointerExceptions at runtime"
      - "The JVM refuses to create the object"
      - "The fields are populated from environment variables"
    answer: 1
    explanation: |
      Nothing outside the DI container populates the reflectively-injected fields, so if you `new`
      the object yourself every injected field stays null and you get NullPointerExceptions.
      Constructor injection instead fails fast by requiring the arguments.
    ref: "concepts.md#why-field-injection-is-discouraged"

  - id: dependency-injection-types-031
    difficulty: beginner
    tags: [why-field-discouraged, legitimate-use]
    question: |
      Where is field injection most commonly considered acceptable?
    options:
      - "In production service classes with many dependencies"
      - "In test classes and quick prototypes where the Spring test context is always present"
      - "In final utility classes"
      - "Anywhere immutability is required"
    answer: 1
    explanation: |
      The mainstream acceptable use of field injection is in test classes and throwaway
      prototypes, where a Spring context is always available. Even there, constructor injection is
      often cleaner.
    ref: "concepts.md#why-field-injection-is-discouraged"

  - id: dependency-injection-types-032
    difficulty: intermediate
    tags: [method-injection, config-method]
    question: |
      What does Spring do with an arbitrary (non-setter) method annotated with `@Autowired`?
    options:
      - "It ignores the method entirely"
      - "It runs the method on every request to the bean"
      - "It only allows such methods on prototype beans"
      - "It calls the method once, resolving each parameter from the container"
    answer: 3
    explanation: |
      @Autowired is not limited to JavaBean setters. Spring will invoke any annotated method
      (including multi-argument ones) after construction, resolving each parameter from the
      context — a generalization of setter injection.
    ref: "concepts.md#method-injection"

  - id: dependency-injection-types-033
    difficulty: intermediate
    tags: [method-injection, lookup, scope-mismatch]
    question: |
      Lookup method injection primarily solves which problem?
    options:
      - "Injecting primitive values from properties files"
      - "Preventing circular dependencies"
      - "A singleton bean needing a fresh instance of a shorter-lived (e.g. prototype) bean on every use"
      - "Injecting a List of all beans of a type"
    answer: 2
    explanation: |
      A singleton is wired once, so a normally-injected prototype would be the same instance
      forever, defeating the prototype scope. Lookup method injection has Spring override a method
      (via CGLIB) so each call returns a fresh instance from the container.
    ref: "concepts.md#method-injection"

  - id: dependency-injection-types-034
    difficulty: intermediate
    tags: [method-injection, lookup, cglib]
    question: |
      Which constraint applies to a method used for lookup method injection with `@Lookup`?
    options:
      - "The method must be static"
      - "The method and its class must not be final, since Spring subclasses the class (CGLIB) to override the method"
      - "The method must be private"
      - "The class must be an interface"
    answer: 1
    explanation: |
      Spring generates a runtime CGLIB subclass that overrides the lookup method, so the class
      cannot be final and the method cannot be final, private, or static — otherwise it cannot be
      overridden.
    ref: "concepts.md#method-injection"

  - id: dependency-injection-types-035
    difficulty: intermediate
    tags: [method-injection, objectprovider, alternatives]
    question: |
      Which is a valid alternative to lookup method injection for a singleton that needs a new
      prototype instance each time?
    options:
      - "Injecting ObjectProvider<T> (or Provider/ObjectFactory) and calling it per use"
      - "Declaring the prototype field final"
      - "Marking the singleton with @Lazy"
      - "Using @Value on the prototype field"
    answer: 0
    explanation: |
      Injecting ObjectProvider<T> (or the JSR-330 Provider, or ObjectFactory) and calling
      getObject()/getIfAvailable() per use fetches a fresh prototype each time. Injecting the
      ApplicationContext and calling getBean() also works but is a discouraged Service Locator
      approach.
    ref: "concepts.md#method-injection"

  - id: dependency-injection-types-036
    difficulty: beginner
    tags: [collections, list-injection]
    question: |
      If you declare a constructor parameter of type `List<NotificationChannel>`, what does Spring
      inject?
    options:
      - "Only the primary NotificationChannel bean"
      - "An empty list always"
      - "All beans of type NotificationChannel found in the context"
      - "A single randomly chosen NotificationChannel bean"
    answer: 2
    explanation: |
      When you declare a List, Set, or array of an interface/type, Spring injects all beans that
      match that type. This is how you collect every implementation of an interface for
      dispatching or strategy patterns.
    ref: "concepts.md#injecting-collections-and-maps"

  - id: dependency-injection-types-037
    difficulty: intermediate
    tags: [collections, map-injection, bean-name]
    question: |
      When you inject a `Map<String, NotificationChannel>`, what are the map keys?
    options:
      - "The fully qualified class names"
      - "Randomly generated UUIDs"
      - "The @Order values as strings"
      - "The bean names of the matching beans"
    answer: 3
    explanation: |
      For a Map<String, T>, Spring populates it with all matching beans, keyed by their bean name
      (the String key) with the bean instances as values. This is handy for name-based lookup of
      implementations.
    ref: "concepts.md#injecting-collections-and-maps"

  - id: dependency-injection-types-038
    difficulty: intermediate
    tags: [collections, ordering, order-annotation]
    question: |
      How can you control the order of elements when Spring injects all beans of a type into a
      `List`?
    options:
      - "It is impossible to control the order"
      - "Rename the beans alphabetically"
      - "Use @Order (or the Ordered interface / @Priority) on the beans"
      - "Use @Scope(\"prototype\")"
    answer: 2
    explanation: |
      Without ordering hints, collection order is not guaranteed. Annotating beans with @Order
      (lower value = higher precedence), implementing the Ordered interface, or using @Priority
      lets you deterministically control the injected order.
    ref: "concepts.md#injecting-collections-and-maps"

  - id: dependency-injection-types-039
    difficulty: intermediate
    tags: [collections, empty, required]
    question: |
      By default, what happens if you autowire a required `List<Foo>` but there are no beans of
      type `Foo`?
    options:
      - "Spring injects an empty list"
      - "Spring injects null"
      - "Spring creates a default Foo bean automatically"
      - "Autowiring fails (e.g. NoSuchBeanDefinitionException) because the dependency is required"
    answer: 3
    explanation: |
      By default a required collection dependency with no matching beans causes autowiring to fail
      with NoSuchBeanDefinitionException. Marking it optional with @Autowired(required = false)
      yields an empty collection / no injection instead.
    ref: "concepts.md#injecting-collections-and-maps"

  - id: dependency-injection-types-040
    difficulty: beginner
    tags: [collections, xml-literal]
    question: |
      Which XML elements let you inject explicitly configured collection values (not beans by
      type)?
    options:
      - "<constructor-arg> only"
      - "<autowire> and <qualifier>"
      - "<list>, <set>, <map>, and <props>"
      - "<lookup-method> and <replaced-method>"
    answer: 2
    explanation: |
      Spring's XML supports <list>, <set>, <map>, and <props> elements to define literal
      collection and property values that are injected via constructor-arg or property. This is
      distinct from autowiring all beans of a type.
    ref: "concepts.md#injecting-collections-and-maps"

  - id: dependency-injection-types-041
    difficulty: intermediate
    tags: [annotations, jakarta, javax]
    question: |
      In Spring Framework 6.x (Jakarta EE 9+), which package provides the JSR-330 `@Inject`
      annotation?
    options:
      - "javax.inject"
      - "org.springframework.inject"
      - "java.inject"
      - "jakarta.inject"
    answer: 3
    explanation: |
      Spring Framework 6.x baselines on Jakarta EE 9+, so JSR-330 @Inject comes from jakarta.inject
      (and @Resource from jakarta.annotation). Spring 5.x and earlier used the javax.* equivalents.
    ref: "concepts.md#ioc-and-dependency-injection"

  - id: dependency-injection-types-042
    difficulty: intermediate
    tags: [annotations, autowired, resource]
    question: |
      What is the primary resolution strategy difference between `@Autowired` and `@Resource`?
    options:
      - "@Autowired resolves by type (then qualifier/name); @Resource resolves primarily by name"
      - "@Autowired resolves by name; @Resource resolves by type only"
      - "Both resolve strictly by fully qualified class name"
      - "@Resource cannot be used for injection at all"
    answer: 0
    explanation: |
      @Autowired (Spring's own) matches by type first, then narrows by qualifier or name.
      @Resource (JSR-250) matches primarily by name. @Inject (JSR-330) is by type, similar to
      @Autowired.
    ref: "concepts.md#field-injection"
