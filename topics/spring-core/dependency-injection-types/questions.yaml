topic: "Dependency Injection Types"
domain: spring-core
topic_slug: dependency-injection-types
version: 1
questions:
  - id: dependency-injection-types-001
    difficulty: beginner
    tags: [ioc, di, definitions]
    question: |
      What is the relationship between Inversion of Control (IoC) and Dependency Injection (DI)?
    options:
      - "They are two unrelated design patterns that must never be combined"
      - "DI is a specific way of implementing the broader IoC principle"
      - "IoC is a specific way of implementing the broader DI principle"
      - "IoC replaced DI in modern versions of Spring"
    answer: 1
    explanation: |
      IoC is the general principle of handing control of object creation and wiring to a
      container. DI is a specific technique that realizes IoC by injecting a component's
      collaborators. Every DI mechanism is a form of IoC, but IoC can also be achieved by other
      patterns such as the Service Locator pattern.
    ref: "concepts.md#ioc-and-dependency-injection"

  - id: dependency-injection-types-002
    difficulty: beginner
    tags: [ioc, container]
    question: |
      In Spring, which interface represents the core IoC container that instantiates beans and
      injects their dependencies?
    options:
      - "DispatcherServlet, Spring MVC's front controller"
      - "DataSource, the JDBC connection pool factory"
      - "PlatformTransactionManager, the transaction API"
      - "BeanFactory (and its sub-interface ApplicationContext)"
    answer: 3
    explanation: |
      The Spring IoC container is represented by the BeanFactory interface and its richer
      sub-interface ApplicationContext. The container reads configuration metadata, instantiates
      beans, and injects their dependencies.
    ref: "concepts.md#ioc-and-dependency-injection"

  - id: dependency-injection-types-003
    difficulty: beginner
    tags: [di, coupling, benefits]
    question: |
      Which is a primary benefit of using Dependency Injection instead of having a class create
      its own collaborators with `new`?
    options:
      - "It guarantees the program always uses less heap memory at runtime"
      - "It removes the need to compile the code before deployment"
      - "It produces loose coupling and makes the class easier to unit test with mocks"
      - "It automatically encrypts all injected objects in memory"
    answer: 2
    explanation: |
      DI decouples a class from the concrete construction of its collaborators. Because
      dependencies are supplied from outside, you can pass in mocks or stubs during testing and
      swap implementations without changing the class — this is loose coupling and improved
      testability.
    ref: "concepts.md#ioc-and-dependency-injection"

  - id: dependency-injection-types-004
    difficulty: intermediate
    tags: [ioc, service-locator]
    question: |
      How does Dependency Injection differ from the Service Locator pattern, even though both
      are forms of IoC?
    options:
      - "Service Locator pushes dependencies into the object; DI pulls them from a registry"
      - "They are identical; the two terms are fully interchangeable in practice"
      - "Service Locator can only be used in XML configuration, never annotations"
      - "DI pushes dependencies into the object; Service Locator has the object pull them from a registry"
    answer: 3
    explanation: |
      With DI, dependencies are pushed into the object by the container, so they are explicit and
      the class does not depend on any locator API. With Service Locator, the object actively
      pulls its dependencies from a registry, which couples it to the locator and hides
      dependencies. DI is generally preferred for testability and clarity.
    ref: "concepts.md#ioc-and-dependency-injection"

  - id: dependency-injection-types-005
    difficulty: beginner
    tags: [constructor-injection, basics]
    question: |
      In constructor injection, when are a bean's dependencies supplied?
    options:
      - "As arguments when the container instantiates the bean via its constructor"
      - "Only after every setter method on the bean has already been called"
      - "Lazily, the first time each dependency is actually used at runtime"
      - "Never; the bean must look them up itself from a static registry"
    answer: 0
    explanation: |
      Constructor injection supplies dependencies as constructor arguments. The container
      resolves each argument and passes them when it instantiates the bean, so the bean is fully
      wired the moment construction completes.
    ref: "concepts.md#constructor-injection"

  - id: dependency-injection-types-006
    difficulty: beginner
    tags: [constructor-injection, autowired, spring-4-3]
    question: |
      Since Spring Framework 4.3, when is `@Autowired` optional on a constructor?
    options:
      - "When the class extends another Spring-managed bean class"
      - "When the class has exactly one constructor"
      - "Only when the single constructor declares no arguments at all"
      - "It is never optional; every constructor still needs an explicit @Autowired"
    answer: 1
    explanation: |
      Since Spring 4.3, if a class declares exactly one constructor, Spring will use it for
      autowiring automatically, so @Autowired is not required. With multiple constructors you must
      annotate exactly one with @Autowired.
    ref: "concepts.md#constructor-injection"

  - id: dependency-injection-types-007
    difficulty: intermediate
    tags: [constructor-injection, final, immutability]
    question: |
      Why can constructor-injected fields be declared `final` while setter-injected fields
      generally cannot?
    options:
      - "final fields are set once at construction time, which the constructor can do but a setter cannot"
      - "final has no effect on injected fields once Spring manages the bean"
      - "Setter injection secretly strips the final modifier off the field at runtime"
      - "Only static fields may be declared final, so it is unrelated to injection type"
    answer: 0
    explanation: |
      A final field must be assigned exactly once, during construction. Constructor injection
      assigns it in the constructor, satisfying that rule and giving immutability. A setter runs
      after construction and would need to reassign the field, which final forbids.
    ref: "concepts.md#constructor-injection"

  - id: dependency-injection-types-008
    difficulty: intermediate
    tags: [constructor-injection, circular-dependency]
    question: |
      What happens if two beans each require the other purely through constructor injection?
    options:
      - "Spring silently sets one of the two constructor arguments to null"
      - "Spring transparently merges the two beans into a single instance"
      - "Spring throws an exception (e.g. BeanCurrentlyInCreationException) because the cycle cannot be resolved"
      - "Spring creates an unbounded number of copies of both beans"
    answer: 2
    explanation: |
      A mutual constructor dependency cannot be satisfied: neither bean can be constructed first
      because each needs the other already built. Spring detects this and throws (for example
      BeanCurrentlyInCreationException / UnsatisfiedDependencyException) at startup, surfacing the
      design problem early.
    ref: "concepts.md#constructor-injection"

  - id: dependency-injection-types-009
    difficulty: beginner
    tags: [constructor-injection, xml]
    question: |
      Which XML element is used to express constructor injection in Spring bean definitions?
    options:
      - "<property>"
      - "<constructor-arg>"
      - "<lookup-method>"
      - "<autowire>"
    answer: 1
    explanation: |
      <constructor-arg> supplies arguments to the bean's constructor in XML configuration.
      <property>, by contrast, corresponds to setter injection.
    ref: "concepts.md#constructor-injection"

  - id: dependency-injection-types-010
    difficulty: beginner
    tags: [setter-injection, basics]
    question: |
      How does setter injection supply dependencies to a bean?
    options:
      - "Through constructor parameters supplied at instantiation time"
      - "By reading a static configuration file at class-load time"
      - "By reflection directly into private fields, bypassing any method"
      - "By calling JavaBean-style setter methods after the bean is instantiated"
    answer: 3
    explanation: |
      With setter injection, the container first instantiates the bean (typically via a no-arg
      constructor), then calls the annotated setter methods to inject each dependency after
      construction.
    ref: "concepts.md#setter-injection"

  - id: dependency-injection-types-011
    difficulty: intermediate
    tags: [setter-injection, partial-initialization]
    question: |
      Which statement about setter injection is correct?
    options:
      - "The bean is guaranteed fully initialized the moment its constructor returns"
      - "Setter-injected fields are always declared final for immutability"
      - "There is a window where the bean exists but some dependencies are still null, between construction and setter completion"
      - "Setter injection cannot be combined with the @Autowired annotation"
    answer: 2
    explanation: |
      Because setters run after construction, the bean briefly exists in a partially-initialized
      state where dependencies are still null. This is one reason constructor injection is
      preferred for mandatory dependencies.
    ref: "concepts.md#setter-injection"

  - id: dependency-injection-types-012
    difficulty: beginner
    tags: [setter-injection, xml]
    question: |
      Which XML element corresponds to setter injection?
    options:
      - "<constructor-arg>"
      - "<property>"
      - "<qualifier>"
      - "<replaced-method>"
    answer: 1
    explanation: |
      The <property> element in XML is backed by a JavaBean setter; Spring calls the setter to
      inject the referenced value or bean. <constructor-arg> corresponds to constructor injection.
    ref: "concepts.md#setter-injection"

  - id: dependency-injection-types-013
    difficulty: intermediate
    tags: [setter-injection, optional-dependency]
    question: |
      How can you mark a setter-injected dependency as optional so Spring skips it when no
      matching bean exists?
    options:
      - "@Autowired(required = false) on the setter"
      - "@Primary on the setter"
      - "@Scope(\"prototype\") on the class"
      - "@Lazy on the field"
    answer: 0
    explanation: |
      @Autowired(required = false) (or @Nullable on the parameter) tells Spring the dependency is
      optional; if no matching bean is found, the setter is simply not invoked and any default
      value remains in place.
    ref: "concepts.md#setter-injection"

  - id: dependency-injection-types-014
    difficulty: beginner
    tags: [field-injection, basics]
    question: |
      What characterizes field injection in Spring?
    options:
      - "@Autowired is placed directly on a field and Spring sets it via reflection"
      - "Dependencies are passed exclusively as constructor arguments"
      - "Dependencies are read from OS environment variables only"
      - "It requires an explicit JavaBean setter method for each field"
    answer: 0
    explanation: |
      Field injection places @Autowired (or @Inject / @Resource) directly on a field, and Spring
      populates the field reflectively after the object is constructed — no constructor or setter
      is needed.
    ref: "concepts.md#field-injection"

  - id: dependency-injection-types-015
    difficulty: beginner
    tags: [field-injection, boilerplate]
    question: |
      What is the most commonly cited *advantage* of field injection?
    options:
      - "It makes the injected fields effectively immutable and final"
      - "It is the only form that supports optional dependencies"
      - "It guarantees the class can be tested without Spring"
      - "It is the most concise form, requiring no constructor or setter boilerplate"
    answer: 3
    explanation: |
      Field injection's appeal is brevity: you annotate the field and skip constructor/setter
      code. However, it sacrifices immutability and testability, which is why it is discouraged in
      production code.
    ref: "concepts.md#field-injection"

  - id: dependency-injection-types-016
    difficulty: intermediate
    tags: [field-injection, final]
    question: |
      Why can't a field-injected dependency be declared `final`?
    options:
      - "Because Spring is only able to inject into public non-final fields"
      - "Because Spring assigns the field reflectively after construction, whereas a final field must be set during construction"
      - "Because final instance fields are not supported by the JVM bytecode verifier"
      - "Because the @Autowired processor strips the final modifier at compile time"
    answer: 1
    explanation: |
      A final field must be initialized during construction. Field injection sets the value
      reflectively after the object already exists, which conflicts with final's single-assignment
      at construction rule, so field-injected dependencies must be non-final and mutable.
    ref: "concepts.md#field-injection"

  - id: dependency-injection-types-017
    difficulty: beginner
    tags: [comparison, testability]
    question: |
      Which injection type makes it easiest to instantiate a class in a plain unit test without
      starting a Spring context?
    options:
      - "Field injection"
      - "Constructor injection"
      - "None of them can be tested without Spring"
      - "They are all equally easy"
    answer: 1
    explanation: |
      Constructor injection lets you write `new MyService(mockA, mockB)` directly in a test — no
      Spring context and no reflection needed. Field injection requires reflection or a running
      container to populate the fields.
    ref: "concepts.md#constructor-vs-setter-vs-field-injection"

  - id: dependency-injection-types-018
    difficulty: intermediate
    tags: [comparison, mandatory-optional]
    question: |
      According to Spring team guidance, which injection strategy fits mandatory versus optional
      dependencies?
    options:
      - "Constructor for optional dependencies, setter for mandatory ones"
      - "Field for mandatory dependencies, constructor for optional ones"
      - "Constructor for mandatory, setter for optional or changeable dependencies"
      - "Setter injection for every dependency, constructor injection for none"
    answer: 2
    explanation: |
      The Spring team recommends constructor injection for mandatory dependencies (guaranteed
      present, immutable) and setter injection for optional or reconfigurable dependencies, while
      generally avoiding field injection in production code.
    ref: "concepts.md#constructor-vs-setter-vs-field-injection"

  - id: dependency-injection-types-019
    difficulty: intermediate
    tags: [comparison, partial-construction]
    question: |
      Which injection type avoids the risk of a partially-constructed bean?
    options:
      - "Setter injection"
      - "Field injection"
      - "Constructor injection"
      - "All three carry the same risk"
    answer: 2
    explanation: |
      With constructor injection, all required dependencies are present the moment the constructor
      returns, so the bean is never partially constructed. Setter and field injection both leave a
      window where the object exists but dependencies are still null.
    ref: "concepts.md#constructor-vs-setter-vs-field-injection"

  - id: dependency-injection-types-020
    difficulty: beginner
    tags: [comparison, boilerplate]
    question: |
      Ordered from most to least boilerplate, how do the three injection types compare?
    options:
      - "Field > Setter > Constructor"
      - "Constructor > Setter > Field"
      - "Setter > Constructor > Field"
      - "They all require identical amounts of code"
    answer: 1
    explanation: |
      Constructor injection needs a constructor (most code), setter injection needs setter methods
      (medium), and field injection just annotates the field (least). Boilerplate, however, is a
      weak reason to choose field injection given its testability and immutability drawbacks.
    ref: "concepts.md#constructor-vs-setter-vs-field-injection"

  - id: dependency-injection-types-021
    difficulty: beginner
    tags: [why-constructor, immutability]
    question: |
      Which of these is a reason constructor injection is preferred for required dependencies?
    options:
      - "It allows dependencies to be declared final, enforcing immutability"
      - "It hides the dependencies from the class's public API so callers never see them"
      - "It makes circular dependencies between beans always resolve successfully at startup"
      - "It removes the need to write unit tests for the class entirely"
    answer: 0
    explanation: |
      Constructor injection lets dependencies be final, so they are set exactly once and cannot be
      reassigned. This immutability makes objects safer to share and reason about, and is one of
      the main reasons the Spring team recommends it.
    ref: "concepts.md#why-constructor-injection-is-preferred"

  - id: dependency-injection-types-022
    difficulty: intermediate
    tags: [why-constructor, mandatory-deps, fail-fast]
    question: |
      How does constructor injection enforce that mandatory dependencies are present?
    options:
      - "By logging a warning if a required dependency is missing but constructing the bean anyway and continuing startup"
      - "By retrying the injection every few seconds in a background thread until the missing dependency eventually appears"
      - "By silently defaulting each missing constructor dependency to null and continuing to build the bean normally"
      - "By making it impossible to construct the object without supplying every required collaborator, failing at construction/startup time"
    answer: 3
    explanation: |
      You cannot instantiate a class without providing its constructor arguments, so a bean can
      never be created missing a required dependency. Problems surface at context startup /
      construction time rather than later as a NullPointerException.
    ref: "concepts.md#why-constructor-injection-is-preferred"

  - id: dependency-injection-types-023
    difficulty: intermediate
    tags: [why-constructor, srp, design-feedback]
    question: |
      Why is a long constructor parameter list sometimes considered a *useful* signal?
    options:
      - "It reliably means the class is very well designed and adheres closely to SOLID principles"
      - "It makes the dependencies explicit and flags that the class may be doing too much (violating SRP)"
      - "It improves runtime performance because a larger constructor lets Spring wire the bean faster"
      - "It causes Spring to automatically split the class into several smaller collaborating beans"
    answer: 1
    explanation: |
      Constructor injection makes every dependency visible in one signature. A growing parameter
      list is honest feedback that the class has too many responsibilities (an SRP violation) —
      feedback that field injection hides because adding another @Autowired field is invisible.
    ref: "concepts.md#why-constructor-injection-is-preferred"

  - id: dependency-injection-types-024
    difficulty: beginner
    tags: [why-constructor, lombok, records]
    question: |
      Which feature helps reduce the boilerplate objection against constructor injection?
    options:
      - "Lombok's @RequiredArgsConstructor or Java records generating the constructor"
      - "Marking every injected field @Transient so the constructor is generated for you automatically"
      - "Using System.out.println statements inside the constructor to wire the dependencies manually"
      - "Disabling the Spring container so constructors no longer need to declare their dependencies"
    answer: 0
    explanation: |
      Lombok's @RequiredArgsConstructor and Java records generate the constructor for you, and
      since Spring 4.3 a single constructor needs no @Autowired. Together these make constructor
      injection concise, removing most of the boilerplate complaint.
    ref: "concepts.md#why-constructor-injection-is-preferred"

  - id: dependency-injection-types-025
    difficulty: intermediate
    tags: [when-setter, optional-default]
    question: |
      Which scenario is the best fit for setter injection?
    options:
      - "A mandatory dependency that must never be null and is required for the bean to function"
      - "A dependency you want to declare final for immutability and set exactly once at construction"
      - "An optional dependency that has a sensible default and is only sometimes overridden"
      - "A dependency you need fully present and non-null before the bean's constructor returns"
    answer: 2
    explanation: |
      Setter injection shines for optional or reconfigurable dependencies — especially ones with a
      reasonable default that only sometimes needs overriding (often paired with
      @Autowired(required = false)). Mandatory, immutable dependencies belong in the constructor.
    ref: "concepts.md#when-to-use-setter-injection"

  - id: dependency-injection-types-026
    difficulty: intermediate
    tags: [when-setter, reconfiguration]
    question: |
      Besides optional dependencies, which situation is a reasonable use of setter injection?
    options:
      - "When a dependency may need to be changed or re-injected after the bean is constructed"
      - "When you want the dependency to be declared final and set exactly once during construction"
      - "When you want to guarantee the bean is never in a partially-initialized state at any point"
      - "When you want to hide the dependency entirely from all XML and annotation configuration"
    answer: 0
    explanation: |
      Setter injection supports reconfiguration: a dependency exposed via a setter can be changed
      or re-injected after construction (e.g. JMX-exposed re-settable configuration), which
      constructor injection cannot offer once the object is built.
    ref: "concepts.md#when-to-use-setter-injection"

  - id: dependency-injection-types-027
    difficulty: intermediate
    tags: [when-setter, circular-dependency]
    question: |
      How can setter (or field) injection sometimes resolve a circular dependency between two
      singleton beans that constructor injection cannot?
    options:
      - "It deletes one of the two beans from the context so the remaining bean has nothing to cycle with"
      - "It automatically converts both singleton beans to prototype scope so each cycle gets a fresh copy"
      - "It is impossible; setter injection also fails on every circular dependency exactly like constructor injection"
      - "Spring can construct both beans first, then wire them via setters afterward"
    answer: 3
    explanation: |
      Because setters run after construction, Spring can instantiate both singleton beans first
      and then inject the references, breaking the chicken-and-egg cycle. Constructor injection
      cannot, since each object needs the other already built. The cycle is still a design smell,
      though.
    ref: "concepts.md#when-to-use-setter-injection"

  - id: dependency-injection-types-028
    difficulty: beginner
    tags: [why-field-discouraged, testability]
    question: |
      What is a key reason field injection is discouraged?
    options:
      - "It makes the class impossible to compile without a running Spring container present on the classpath"
      - "It makes the class hard to test without a Spring container because fields are set reflectively"
      - "It forces every injected field to be declared final, which conflicts with reflective assignment"
      - "It roughly doubles the bean's runtime memory usage compared to constructor injection"
    answer: 1
    explanation: |
      Field injection sets values reflectively, so you cannot simply `new` the class and pass
      mocks. Tests must start a Spring context or use reflection utilities like
      ReflectionTestUtils.setField, which is fragile and verbose.
    ref: "concepts.md#why-field-injection-is-discouraged"

  - id: dependency-injection-types-029
    difficulty: intermediate
    tags: [why-field-discouraged, hidden-dependencies]
    question: |
      How does field injection tend to mask design problems?
    options:
      - "It reports SRP violations to the compiler, which then emits a warning about too many collaborators"
      - "It enforces a hard limit preventing a class from declaring more than three injected dependencies"
      - "It makes it trivial to add many @Autowired fields, hiding that the class has too many responsibilities"
      - "It forces all of the class's dependencies into a single long constructor method signature"
    answer: 2
    explanation: |
      Because adding one more @Autowired field is effortless and invisible in the public API, a
      class can silently accumulate many dependencies. A long constructor parameter list would
      have made that bloat (and the likely SRP violation) obvious.
    ref: "concepts.md#why-field-injection-is-discouraged"

  - id: dependency-injection-types-030
    difficulty: intermediate
    tags: [why-field-discouraged, coupling, null]
    question: |
      If a field-injected class is instantiated with `new` outside of Spring, what typically
      happens?
    options:
      - "Spring intercepts the plain new call via a global agent and injects the fields anyway"
      - "The injected fields are null, leading to NullPointerExceptions at runtime"
      - "The JVM refuses to create the object because its @Autowired fields are left unsatisfied"
      - "The fields are automatically populated from matching OS environment variables at construction"
    answer: 1
    explanation: |
      Nothing outside the DI container populates the reflectively-injected fields, so if you `new`
      the object yourself every injected field stays null and you get NullPointerExceptions.
      Constructor injection instead fails fast by requiring the arguments.
    ref: "concepts.md#why-field-injection-is-discouraged"

  - id: dependency-injection-types-031
    difficulty: beginner
    tags: [why-field-discouraged, legitimate-use]
    question: |
      Where is field injection most commonly considered acceptable?
    options:
      - "In production service classes with many dependencies that must be shared across threads"
      - "In test classes and quick prototypes where the Spring test context is always present"
      - "In final utility classes whose fields must stay immutable after construction completes"
      - "Anywhere strict immutability of the injected collaborators is a hard requirement"
    answer: 1
    explanation: |
      The mainstream acceptable use of field injection is in test classes and throwaway
      prototypes, where a Spring context is always available. Even there, constructor injection is
      often cleaner.
    ref: "concepts.md#why-field-injection-is-discouraged"

  - id: dependency-injection-types-032
    difficulty: intermediate
    tags: [method-injection, config-method]
    question: |
      What does Spring do with an arbitrary (non-setter) method annotated with `@Autowired`?
    options:
      - "It ignores the method entirely because @Autowired is only ever honored on JavaBean setters"
      - "It re-runs the method on every incoming request to the bean, re-resolving the parameters each time"
      - "It only permits such multi-argument methods on prototype-scoped beans, never on singletons"
      - "It calls the method once, resolving each parameter from the container"
    answer: 3
    explanation: |
      @Autowired is not limited to JavaBean setters. Spring will invoke any annotated method
      (including multi-argument ones) after construction, resolving each parameter from the
      context — a generalization of setter injection.
    ref: "concepts.md#method-injection"

  - id: dependency-injection-types-033
    difficulty: intermediate
    tags: [method-injection, lookup, scope-mismatch]
    question: |
      Lookup method injection primarily solves which problem?
    options:
      - "Injecting primitive values and String literals read from external properties files"
      - "Preventing circular dependencies between two mutually-referencing singleton beans"
      - "A singleton bean needing a fresh instance of a shorter-lived (e.g. prototype) bean on every use"
      - "Injecting a List containing every registered bean of a given interface type"
    answer: 2
    explanation: |
      A singleton is wired once, so a normally-injected prototype would be the same instance
      forever, defeating the prototype scope. Lookup method injection has Spring override a method
      (via CGLIB) so each call returns a fresh instance from the container.
    ref: "concepts.md#method-injection"

  - id: dependency-injection-types-034
    difficulty: intermediate
    tags: [method-injection, lookup, cglib]
    question: |
      Which constraint applies to a method used for lookup method injection with `@Lookup`?
    options:
      - "The method must be declared static so Spring can invoke it without an instance of the bean"
      - "The method and its class must not be final, since Spring subclasses the class (CGLIB) to override the method"
      - "The method must be private so that only the generated subclass is allowed to override it"
      - "The declaring type must be an interface rather than a concrete class for the override to work"
    answer: 1
    explanation: |
      Spring generates a runtime CGLIB subclass that overrides the lookup method, so the class
      cannot be final and the method cannot be final, private, or static — otherwise it cannot be
      overridden.
    ref: "concepts.md#method-injection"

  - id: dependency-injection-types-035
    difficulty: intermediate
    tags: [method-injection, objectprovider, alternatives]
    question: |
      Which is a valid alternative to lookup method injection for a singleton that needs a new
      prototype instance each time?
    options:
      - "Injecting ObjectProvider<T> (or Provider/ObjectFactory) and calling it per use"
      - "Declaring the prototype field final so a new instance is assigned on each access"
      - "Marking the enclosing singleton with @Lazy so it re-creates the prototype every call"
      - "Using @Value on the prototype field to have Spring supply a fresh instance each time"
    answer: 0
    explanation: |
      Injecting ObjectProvider<T> (or the JSR-330 Provider, or ObjectFactory) and calling
      getObject()/getIfAvailable() per use fetches a fresh prototype each time. Injecting the
      ApplicationContext and calling getBean() also works but is a discouraged Service Locator
      approach.
    ref: "concepts.md#method-injection"

  - id: dependency-injection-types-036
    difficulty: beginner
    tags: [collections, list-injection]
    question: |
      If you declare a constructor parameter of type `List<NotificationChannel>`, what does Spring
      inject?
    options:
      - "Only the single NotificationChannel bean that is annotated @Primary in the context"
      - "An empty list in every case, since Spring never auto-collects beans into a List"
      - "All beans of type NotificationChannel found in the context"
      - "A single randomly chosen NotificationChannel bean picked from the matching candidates"
    answer: 2
    explanation: |
      When you declare a List, Set, or array of an interface/type, Spring injects all beans that
      match that type. This is how you collect every implementation of an interface for
      dispatching or strategy patterns.
    ref: "concepts.md#injecting-collections-and-maps"

  - id: dependency-injection-types-037
    difficulty: intermediate
    tags: [collections, map-injection, bean-name]
    question: |
      When you inject a `Map<String, NotificationChannel>`, what are the map keys?
    options:
      - "The fully qualified class names of each bean"
      - "Randomly generated UUID strings per bean"
      - "The beans' @Order values as strings"
      - "The bean names of the matching beans"
    answer: 3
    explanation: |
      For a Map<String, T>, Spring populates it with all matching beans, keyed by their bean name
      (the String key) with the bean instances as values. This is handy for name-based lookup of
      implementations.
    ref: "concepts.md#injecting-collections-and-maps"

  - id: dependency-injection-types-038
    difficulty: intermediate
    tags: [collections, ordering, order-annotation]
    question: |
      How can you control the order of elements when Spring injects all beans of a type into a
      `List`?
    options:
      - "It is impossible to control the order once the beans are collected"
      - "Rename the beans so they sort alphabetically by their names"
      - "Use @Order (or the Ordered interface / @Priority) on the beans"
      - "Use @Scope(\"prototype\") on each of the matching beans"
    answer: 2
    explanation: |
      Without ordering hints, collection order is not guaranteed. Annotating beans with @Order
      (lower value = higher precedence), implementing the Ordered interface, or using @Priority
      lets you deterministically control the injected order.
    ref: "concepts.md#injecting-collections-and-maps"

  - id: dependency-injection-types-039
    difficulty: intermediate
    tags: [collections, empty, required]
    question: |
      By default, what happens if you autowire a required `List<Foo>` but there are no beans of
      type `Foo`?
    options:
      - "Spring silently injects an empty list and startup proceeds normally"
      - "Spring injects null into the field rather than any collection object"
      - "Spring creates a default Foo bean automatically and injects a single-element list"
      - "Autowiring fails (e.g. NoSuchBeanDefinitionException) because the dependency is required"
    answer: 3
    explanation: |
      By default a required collection dependency with no matching beans causes autowiring to fail
      with NoSuchBeanDefinitionException. Marking it optional with @Autowired(required = false)
      yields an empty collection / no injection instead.
    ref: "concepts.md#injecting-collections-and-maps"

  - id: dependency-injection-types-040
    difficulty: beginner
    tags: [collections, xml-literal]
    question: |
      Which XML elements let you inject explicitly configured collection values (not beans by
      type)?
    options:
      - "<constructor-arg> and <property> only"
      - "<autowire> and <qualifier>"
      - "<list>, <set>, <map>, and <props>"
      - "<lookup-method> and <replaced-method>"
    answer: 2
    explanation: |
      Spring's XML supports <list>, <set>, <map>, and <props> elements to define literal
      collection and property values that are injected via constructor-arg or property. This is
      distinct from autowiring all beans of a type.
    ref: "concepts.md#injecting-collections-and-maps"

  - id: dependency-injection-types-041
    difficulty: intermediate
    tags: [annotations, jakarta, javax]
    question: |
      In Spring Framework 6.x (Jakarta EE 9+), which package provides the JSR-330 `@Inject`
      annotation?
    options:
      - "javax.inject"
      - "org.springframework.inject"
      - "java.inject"
      - "jakarta.inject"
    answer: 3
    explanation: |
      Spring Framework 6.x baselines on Jakarta EE 9+, so JSR-330 @Inject comes from jakarta.inject
      (and @Resource from jakarta.annotation). Spring 5.x and earlier used the javax.* equivalents.
    ref: "concepts.md#ioc-and-dependency-injection"

  - id: dependency-injection-types-042
    difficulty: intermediate
    tags: [annotations, autowired, resource]
    question: |
      What is the primary resolution strategy difference between `@Autowired` and `@Resource`?
    options:
      - "@Autowired resolves by type (then qualifier/name); @Resource resolves primarily by name"
      - "@Autowired resolves by name; @Resource resolves by type only"
      - "Both resolve strictly by fully qualified class name"
      - "@Resource cannot be used for injection at all"
    answer: 0
    explanation: |
      @Autowired (Spring's own) matches by type first, then narrows by qualifier or name.
      @Resource (JSR-250) matches primarily by name. @Inject (JSR-330) is by type, similar to
      @Autowired.
    ref: "concepts.md#field-injection"

  - id: dependency-injection-types-043
    difficulty: expert
    tags: [resolution, primary, qualifier, precedence]
    question: |
      A type `PaymentGateway` has two beans: `stripe` (annotated `@Primary`) and `paypal`. An
      injection point is declared as `@Autowired @Qualifier("paypal") PaymentGateway gateway`.
      Which bean is injected, and why?
    options:
      - "stripe, because @Primary always takes precedence over any @Qualifier at the injection point"
      - "paypal, because a matching @Qualifier at the injection point is more specific and overrides the factory-wide @Primary default"
      - "Neither; the combination of @Primary and @Qualifier is contradictory and throws NoUniqueBeanDefinitionException"
      - "stripe, because @Qualifier only affects collection injection, not single-bean injection"
    answer: 1
    explanation: |
      @Qualifier at an injection point is more specific than @Primary. @Primary is a factory-wide
      default used only when nothing narrows the candidate set; a qualifier that matches a
      specific bean is a point-specific override, so `paypal` wins. @Qualifier absolutely applies
      to single-bean injection.
    ref: "concepts.md#how-the-container-resolves-an-injection-point"

  - id: dependency-injection-types-044
    difficulty: expert
    tags: [resolution, order, priority, tie-breaking]
    question: |
      Two beans of type `Validator` exist: `beanA` annotated `@Order(0)` and `beanB` annotated
      `@Order(5)`. Neither is `@Primary`. A single-valued injection point `@Autowired Validator v`
      (parameter/field name `v`, matching neither bean name) is resolved. What happens?
    options:
      - "beanA is injected because @Order(0) gives it the highest precedence for tie-breaking"
      - "beanB is injected because higher @Order values win single-injection ties"
      - "Injection fails with NoUniqueBeanDefinitionException because @Order does not break single-injection ties"
      - "Spring injects a List containing both beans wrapped in a proxy"
    answer: 2
    explanation: |
      @Order (and Ordered) only affect the ordering of collection/stream injection; they are
      ignored when breaking a tie for a single-valued injection point. Only @Primary, then
      @Priority, then a name match resolve single-injection ambiguity. With neither primary, no
      @Priority, and no name match, Spring throws NoUniqueBeanDefinitionException.
    ref: "concepts.md#ordering-order-vs-priority-and-tie-breaking"

  - id: dependency-injection-types-045
    difficulty: expert
    tags: [circular-dependency, prototype, scope]
    question: |
      Two prototype-scoped beans, A and B, depend on each other via setter injection. What is the
      result when the first of them is requested from the context?
    options:
      - "Spring throws BeanCurrentlyInCreationException because prototypes are not cached and no early reference can be exposed"
      - "Spring resolves the cycle using the early-reference singleton cache, just like singletons"
      - "Spring silently injects null into one of the beans and proceeds"
      - "Spring converts both beans to singletons to break the cycle"
    answer: 0
    explanation: |
      The three-level early-reference cache that resolves singleton setter/field cycles only
      applies to singletons — Spring does not cache prototype instances, so no early reference can
      be exposed. A prototype circular reference therefore always throws
      BeanCurrentlyInCreationException regardless of injection style.
    ref: "concepts.md#circular-dependency-resolution-internals"

  - id: dependency-injection-types-046
    difficulty: expert
    tags: [circular-dependency, cache, internals]
    question: |
      Which mechanism inside `DefaultSingletonBeanRegistry` allows Spring to resolve a
      setter-based circular dependency between two singleton beans?
    options:
      - "A background retry loop that re-attempts construction of both beans every few milliseconds until each one finally succeeds"
      - "A dependency-graph pre-sort that reorders bean creation up front so that no circular reference is ever encountered at runtime"
      - "A defensive-copy step that clones one bean so each participant holds its own fully independent duplicate of the other bean"
      - "A three-level cache (singletonObjects, earlySingletonObjects, singletonFactories) that exposes an early raw or proxied reference before the bean is fully initialized"
    answer: 3
    explanation: |
      Spring exposes a singleton's early reference through a singletonFactory (level 3) before the
      bean is fully initialized; a collaborator in the cycle obtains that early reference from
      earlySingletonObjects (level 2), breaking the chicken-and-egg. Constructor cycles cannot use
      this because the raw instance does not exist yet when the dependency is needed.
    ref: "concepts.md#circular-dependency-resolution-internals"

  - id: dependency-injection-types-047
    difficulty: advanced
    tags: [circular-dependency, lazy, workaround]
    question: |
      You have an unavoidable circular dependency between two singletons and want to keep
      constructor injection on both. What is the cleanest Spring-idiomatic way to break the cycle?
    options:
      - "Add @Lazy to one of the constructor injection points so Spring injects a lazy proxy instead of the fully resolved bean"
      - "Mark both beans @Primary so the container can decide which one of the pair to fully build first and break the cycle"
      - "Change both beans to prototype scope so a fresh short-lived instance is created on each side of the dependency"
      - "Add @Order annotations to both beans to force a deterministic construction order that resolves the cycle"
    answer: 0
    explanation: |
      Placing @Lazy on one constructor parameter makes Spring inject a lazy-initializing proxy;
      the real bean is resolved on first use, after both beans are constructed, breaking the
      constructor cycle without switching to setter injection. Scope changes and @Primary/@Order
      do not resolve a constructor cycle.
    ref: "concepts.md#circular-dependency-resolution-internals"

  - id: dependency-injection-types-048
    difficulty: expert
    tags: [lifecycle, constructor, postconstruct, timing]
    question: |
      A bean uses field injection for a `Repository` and references it inside its constructor
      body. What is the outcome?
    options:
      - "It works because Spring performs field injection before invoking the constructor"
      - "It works because @Autowired fields are initialized to a default proxy before construction"
      - "Spring reorders the calls so the field is set first, but logs a warning"
      - "It throws NullPointerException because field injection runs during populateBean, after the constructor returns, so the field is still null in the constructor"
    answer: 3
    explanation: |
      Field/setter injection is applied by AutowiredAnnotationBeanPostProcessor during
      populateBean, which runs after the constructor returns and before initialization callbacks.
      The field is null inside the constructor, so this throws NPE. Logic needing injected
      collaborators belongs in @PostConstruct; constructor injection avoids the problem entirely.
    ref: "concepts.md#injection-timing-beanpostprocessor-and-ordering-of-callbacks"

  - id: dependency-injection-types-049
    difficulty: advanced
    tags: [lifecycle, postconstruct, ordering]
    question: |
      For a bean that mixes constructor injection and field injection, which lifecycle point is
      the first at which ALL injected dependencies are guaranteed to be populated?
    options:
      - "Inside the constructor, once all argument resolution has finished"
      - "In a BeanNameAware.setBeanName callback, before any properties are populated"
      - "In a @PostConstruct method (after populateBean and Aware callbacks complete)"
      - "Only after the ApplicationContext finishes refreshing every bean in the context"
    answer: 2
    explanation: |
      Field/setter injection completes during populateBean, before Aware callbacks and
      @PostConstruct. @PostConstruct (then afterPropertiesSet, then custom init-method) is the
      earliest point where every injection style is guaranteed complete, which is why
      initialization work touching injected beans belongs there rather than in the constructor.
    ref: "concepts.md#injection-timing-beanpostprocessor-and-ordering-of-callbacks"

  - id: dependency-injection-types-050
    difficulty: expert
    tags: [thread-safety, final, memory-model, constructor]
    question: |
      From a Java Memory Model perspective, why does constructor injection with `final` fields
      give a stronger thread-safety guarantee for a shared singleton than setter injection?
    options:
      - "final fields cause Spring to wrap the bean so every method call is synchronized on a shared lock"
      - "Setter injection stores dependencies in thread-local storage, which is slower but safer"
      - "final fields set in the constructor are safely published and guaranteed visible to all threads without extra synchronization, and cannot be reassigned later"
      - "There is no difference; the JMM treats final and non-final injected fields identically"
    answer: 2
    explanation: |
      The JMM's final-field semantics guarantee that values assigned to final fields in a
      constructor are visible to any thread that sees the safely-published object, with no
      additional synchronization. Setter/field injection uses mutable non-final fields, which lose
      the immutability guarantee and could be reassigned from another thread, reintroducing a
      visibility hazard.
    ref: "concepts.md#thread-safety-and-concurrency-of-injected-state"

  - id: dependency-injection-types-051
    difficulty: advanced
    tags: [thread-safety, singleton, state]
    question: |
      A singleton service caches per-request mutable state in an `@Autowired`-set field so it can
      reuse it across method calls. Under concurrent load this corrupts data. What is the correct
      framing of the problem?
    options:
      - "The injection type is wrong; switching from field to constructor injection fixes the corruption"
      - "Spring should have created one singleton instance per thread automatically"
      - "Adding @Order to the bean serializes concurrent access to its methods and thereby fixes the race"
      - "DI does not provide per-request isolation for singletons; mutable per-request state must live in request/prototype scope or method-local variables, not on a shared singleton"
    answer: 3
    explanation: |
      The bug is stateful-singleton misuse, not an injection-style issue. A singleton is shared
      across all threads and DI adds no per-request isolation. Mutable per-request state belongs in
      request/prototype-scoped beans or method-local variables. Changing injection type or adding
      @Order does not address the shared-mutable-state race.
    ref: "concepts.md#thread-safety-and-concurrency-of-injected-state"

  - id: dependency-injection-types-052
    difficulty: expert
    tags: [objectprovider, resolution, api]
    question: |
      You inject `ObjectProvider<PaymentGateway>` where two candidate beans exist and neither is
      `@Primary`. Which call returns `null` instead of throwing?
    options:
      - "getObject()"
      - "getIfAvailable()"
      - "getIfUnique()"
      - "All three throw NoUniqueBeanDefinitionException"
    answer: 2
    explanation: |
      getIfUnique() returns null when there are zero OR multiple candidates, never throwing on
      ambiguity. getObject() and getIfAvailable() both throw NoUniqueBeanDefinitionException when
      more than one candidate matches (getIfAvailable only tolerates the zero-candidate case).
    ref: "concepts.md#objectprovider-objectfactory-and-provider-semantics"

  - id: dependency-injection-types-053
    difficulty: advanced
    tags: [objectprovider, prototype, scope-mismatch]
    question: |
      Why does injecting `ObjectProvider<Command>` into a singleton and calling `getObject()` per
      use correctly yield a fresh prototype each time, when a directly injected `Command` field
      would not?
    options:
      - "ObjectProvider caches every Command it creates and rotates through them"
      - "Spring re-runs field injection on the singleton before every method call"
      - "ObjectProvider forces the Command bean to become a singleton, which is faster"
      - "The ObjectProvider is a thin handle bound to the factory; each getObject() re-queries the container, which creates a new prototype instance per call"
    answer: 3
    explanation: |
      A directly injected Command is resolved once, so the singleton holds one instance forever. An
      ObjectProvider is injected once as a lightweight handle to the factory; each getObject()
      re-queries the container and, for a prototype target, produces a fresh instance — solving the
      singleton-needs-prototype problem without CGLIB lookup methods.
    ref: "concepts.md#objectprovider-objectfactory-and-provider-semantics"

  - id: dependency-injection-types-054
    difficulty: expert
    tags: [lookup, cglib, bean-method]
    question: |
      Why does lookup method injection (`@Lookup`) NOT work when applied to a `@Bean` method in a
      `@Configuration` class?
    options:
      - "@Bean methods are private by default and cannot be autowired"
      - "@Lookup is only allowed on interfaces, and @Bean methods return concrete classes"
      - "The container does not create the instance via new for a @Bean method, so it cannot generate a runtime CGLIB subclass to override the lookup method"
      - "@Bean methods run before the CGLIB proxy of the configuration class is created"
    answer: 2
    explanation: |
      Lookup method injection relies on Spring generating a CGLIB subclass that overrides the
      lookup method. For a @Bean method the user code performs the instantiation, so the container
      is not in charge of creating the instance and cannot substitute a runtime-generated subclass —
      hence @Lookup does not apply there.
    ref: "concepts.md#method-injection"

  - id: dependency-injection-types-055
    difficulty: advanced
    tags: [lookup, signature, constraints]
    question: |
      Which method signature is a VALID target for `@Lookup` lookup method injection?
    options:
      - "private final Command createCommand()"
      - "public static Command createCommand()"
      - "protected abstract Command createCommand()"
      - "public Command createCommand(String beanName)"
    answer: 2
    explanation: |
      A lookup method must be public or protected, non-final, non-static, and take no arguments;
      it may be abstract (subclass implements it) or concrete (subclass overrides it). The private
      final, static, and argument-taking variants all violate these CGLIB-override constraints.
    ref: "concepts.md#method-injection"

  - id: dependency-injection-types-056
    difficulty: advanced
    tags: [lookup, resolution, return-type]
    question: |
      What does Spring use to resolve the target bean when `@Lookup` is written with no explicit
      bean name (i.e. `@Lookup` alone)?
    options:
      - "The method name, matched against bean names"
      - "The method's declared return type"
      - "The first bean registered in the context"
      - "It throws because a bean name is mandatory"
    answer: 1
    explanation: |
      When no name is supplied, Spring resolves the lookup target by the method's declared return
      type (the idiomatic form). Supplying @Lookup("myCommand") instead resolves by that explicit
      bean name.
    ref: "concepts.md#method-injection"

  - id: dependency-injection-types-057
    difficulty: expert
    tags: [collections, generics, qualifier]
    question: |
      The context has beans `Handler<OrderEvent>` and `Handler<UserEvent>`. You inject
      `@Autowired Handler<OrderEvent> handler` (a single-valued point). What happens?
    options:
      - "NoUniqueBeanDefinitionException is thrown, because type erasure leaves both beans as the raw type Handler with no way to distinguish them"
      - "Spring injects whichever Handler bean was registered first, since erased generics cannot participate in autowiring resolution at all"
      - "The UserEvent handler is injected, because Spring breaks such raw-type ties by picking the candidate whose bean name sorts alphabetically last"
      - "The OrderEvent handler is injected, because since Spring 4.0 the generic type argument acts as an implicit qualifier resolved via ResolvableType"
    answer: 3
    explanation: |
      Since Spring 4.0, generic type arguments act as an automatic qualifier: Spring resolves the
      full parameterized type via ResolvableType, so Handler<OrderEvent> unambiguously selects the
      matching bean even though several raw Handler beans exist. No NoUniqueBeanDefinitionException
      occurs.
    ref: "concepts.md#injecting-collections-and-maps"

  - id: dependency-injection-types-058
    difficulty: advanced
    tags: [collections, list, ordering]
    question: |
      When Spring injects `List<Filter>` collecting all Filter beans, how is the element order
      determined?
    options:
      - "Always strictly alphabetical by bean name, since Spring sorts the matching beans lexicographically before populating the list"
      - "By @Order / Ordered (and @Priority); without such annotations order follows registration order but is not guaranteed by contract"
      - "By @Primary designation only; the bean marked @Primary is placed first and the remaining beans follow in registration order"
      - "The order is randomized on each startup, since Spring shuffles the matching beans to discourage order-dependent code"
    answer: 1
    explanation: |
      Collection/array/stream injection sorts elements by @Order/Ordered (with @Priority also
      honored), lower value first. Without ordering annotations the order tends to follow
      registration/declaration order, but that is not a guaranteed contract, so rely on @Order when
      order matters.
    ref: "concepts.md#ordering-order-vs-priority-and-tie-breaking"

  - id: dependency-injection-types-059
    difficulty: advanced
    tags: [constructor, multiple-constructors, autowired]
    question: |
      A component has two constructors, both annotated `@Autowired(required = false)`, and no
      no-arg constructor. How does Spring choose which constructor to use?
    options:
      - "It treats them as candidates and selects the greediest constructor whose dependencies can all be satisfied from the container"
      - "It throws at startup, because Spring permits @Autowired on at most one constructor and rejects a class that annotates two"
      - "It always selects the constructor with the fewest arguments, treating the smallest signature as the safest to instantiate"
      - "It invokes both annotated constructors in turn and merges the two partially-built instances into the final managed bean"
    answer: 0
    explanation: |
      Multiple @Autowired(required = false) constructors are treated as candidates; Spring picks
      the greediest one (most arguments) whose dependencies are all resolvable from the container.
      A single @Autowired with required = true would forbid this multi-candidate behavior because a
      required constructor must be used.
    ref: "concepts.md#constructor-injection"

  - id: dependency-injection-types-060
    difficulty: expert
    tags: [resolution, priority, single-injection]
    question: |
      Two beans of type `Codec` match a single injection point; neither is `@Primary` and the
      field name matches neither bean name. `beanX` is annotated `@Priority(10)` and `beanY`
      `@Priority(20)`. Which is injected?
    options:
      - "beanY, because @Priority tie-breaking treats the highest numeric value as the strongest preference and selects it"
      - "beanX, because @Priority tie-breaking selects the lowest numeric value as highest priority"
      - "Neither; @Priority only affects collection ordering, so it throws NoUniqueBeanDefinitionException"
      - "beanX, but only incidentally because it was registered first, since @Priority is ignored for single-injection points"
    answer: 1
    explanation: |
      When no @Primary resolves a single-injection tie, Spring consults jakarta.annotation.Priority
      and selects the candidate with the LOWEST numeric value as the highest priority — so
      beanX(@Priority(10)) wins. Unlike @Order, @Priority does participate in single-injection
      tie-breaking.
    ref: "concepts.md#ordering-order-vs-priority-and-tie-breaking"

  - id: dependency-injection-types-061
    difficulty: expert
    tags: [resolution, primary, no-unique]
    question: |
      Two beans of type `DataSource` are both annotated `@Primary`, and an injection point
      requires a single `DataSource` with no qualifier. What is the result?
    options:
      - "NoUniqueBeanDefinitionException, because more than one primary candidate is ambiguous"
      - "The first-registered of the two @Primary DataSource beans is chosen, with the later one treated as a redundant duplicate"
      - "Both DataSource beans are injected automatically as a List, since multiple primaries collapse into a collection dependency"
      - "Spring silently falls back to @Priority ordering and picks the higher-priority of the two @Primary DataSource beans"
    answer: 0
    explanation: |
      @Primary designates a single fallback default. Two @Primary beans of the same type make the
      choice ambiguous, so Spring throws NoUniqueBeanDefinitionException. @Primary is meant to mark
      exactly one candidate as the default.
    ref: "concepts.md#how-the-container-resolves-an-injection-point"

  - id: dependency-injection-types-062
    difficulty: advanced
    tags: [resolution, name-fallback, qualifier]
    question: |
      Two beans of type `Clock` exist, named `systemClock` and `testClock`, neither `@Primary`. A
      field is declared `@Autowired private Clock testClock;`. Why does injection succeed?
    options:
      - "Because Spring injects the first Clock bean it encounters in registration order, ignoring the field name entirely once a type match exists"
      - "Because @Autowired always resolves purely by field name first, checking the type only if no bean name matches the field"
      - "Because the field name `testClock` is used as an implicit qualifier and matches the bean name testClock as a final fallback step"
      - "It does not actually succeed; with two Clock beans and no @Primary, this injection point throws NoUniqueBeanDefinitionException at startup"
    answer: 2
    explanation: |
      After type match with no @Primary/@Qualifier/@Priority winner, Spring falls back to matching
      the field or parameter name against candidate bean names as an implicit qualifier. The field
      name testClock matches the bean testClock, so resolution succeeds. Name matching is a
      fallback, not the primary strategy.
    ref: "concepts.md#how-the-container-resolves-an-injection-point"

  - id: dependency-injection-types-063
    difficulty: expert
    tags: [circular-dependency, aop, proxy]
    question: |
      A bean participating in a setter-injection singleton cycle is also advised by AOP (so it
      will be wrapped in a proxy). Sometimes Spring throws BeanCurrentlyInCreationException with a
      message about being injected "in its raw version." Why?
    options:
      - "Because a bean advised by AOP is barred from participating in dependency injection at all, so any cycle involving a proxied bean is rejected outright"
      - "Because the early reference exposed during the cycle can be the raw (unproxied) instance, and if the final bean gets wrapped in a proxy afterward, the earlier injection would hold the wrong reference; Spring detects the mismatch and fails fast"
      - "Because CGLIB-based AOP proxies require constructor injection exclusively, and mixing them with setter-based cycles is an unsupported combination that Spring rejects"
      - "Because the AOP proxy for the advised bean is created strictly before its target instance, which inverts the cycle and makes the raw reference unavailable"
    answer: 1
    explanation: |
      In a cycle, another bean may receive the early raw reference before the target is wrapped by
      an AOP proxy. If the final bean is then proxied, the earlier injected reference would point at
      an unproxied instance — a correctness bug. Spring detects this wrapping mismatch and throws
      BeanCurrentlyInCreationException rather than silently injecting the unadvised object.
    ref: "concepts.md#circular-dependency-resolution-internals"

  - id: dependency-injection-types-064
    difficulty: advanced
    tags: [resolution, objectprovider, optional]
    question: |
      Which approach lets a bean depend on a collaborator that may legitimately be absent, WITHOUT
      failing at startup and WITHOUT eagerly resolving it, while still allowing repeated fresh
      lookups later?
    options:
      - "A required constructor parameter of the collaborator type, which lets Spring re-resolve a fresh instance on every later access"
      - "Injecting ObjectProvider<Collaborator> and calling getIfAvailable() when needed"
      - "A field annotated @Autowired with required = true, which tolerates the collaborator's absence by leaving the field null"
      - "Declaring the collaborator field final, so Spring defers its resolution until the value is first read at runtime"
    answer: 1
    explanation: |
      ObjectProvider defers resolution and tolerates absence: getIfAvailable() returns null (or a
      supplied default) when no bean exists, and each call re-queries the container. A required
      constructor param or required field would fail fast at startup; final does not address
      optionality.
    ref: "concepts.md#objectprovider-objectfactory-and-provider-semantics"

  - id: dependency-injection-types-065
    difficulty: expert
    tags: [resolution, self-injection, autowire-candidate]
    question: |
      During injection-point resolution, which two categories of beans does Spring deliberately
      exclude from the candidate set before applying qualifiers?
    options:
      - "Prototype-scoped beans and beans marked @Lazy, both of which are held back until the fully-eager singletons have been wired first"
      - "All beans defined in XML configuration and all beans declared via @Bean factory methods, leaving only component-scanned candidates"
      - "The bean being wired itself (self-reference) and beans marked autowire-candidate=false / defaultCandidate=false"
      - "Beans that carry neither a @Primary annotation nor an @Order value, since Spring requires one of the two to consider a candidate"
    answer: 2
    explanation: |
      doResolveDependency filters out self-references (a bean is not autowired into itself) and
      beans that opt out of being autowire candidates (autowire-candidate="false" in XML, or a
      qualifier with defaultCandidate=false). Scope, config source, @Primary, and @Order are not
      candidate-exclusion criteria.
    ref: "concepts.md#how-the-container-resolves-an-injection-point"

  - id: dependency-injection-types-066
    difficulty: advanced
    tags: [setter, optional, nullable, semantics]
    question: |
      What is the behavioral difference between `@Autowired(required = false)` on a setter and
      `@Autowired` with a `@Nullable`/`Optional<T>` parameter, when no matching bean exists?
    options:
      - "There is no difference; all three variants throw an UnsatisfiedDependencyException identically whenever no matching bean can be found"
      - "@Nullable actually makes the dependency mandatory, the exact opposite of required=false, so it fails fast when no bean exists"
      - "required=false skips calling the setter entirely (leaving any default), whereas @Nullable/Optional still invoke the method, passing null or Optional.empty()"
      - "Optional<T> caches and re-supplies the previously injected value, whereas required=false clears the field back to null when no bean is found"
    answer: 2
    explanation: |
      With required=false and no candidate, Spring does not invoke the injection method at all, so
      a pre-set default remains. With @Nullable or Optional<T>, the method is still invoked but
      receives null / Optional.empty(). This matters when a field has a sensible default you want to
      preserve versus explicitly overwrite.
    ref: "concepts.md#when-to-use-setter-injection"

  - id: dependency-injection-types-067
    difficulty: expert
    tags: [collections, map, ordering, contract]
    question: |
      You inject `Map<String, Handler>` and iterate it expecting `@Order`-based ordering. In
      practice the iteration order does not honor @Order. Why?
    options:
      - "@Order is honored only when declared in XML bean definitions, and the annotation form is silently ignored during Map injection"
      - "Maps in Java are fundamentally incapable of preserving any ordering, so Spring cannot apply @Order to a Map regardless of intent"
      - "You must additionally annotate the Map field itself with @Order for the container to sort the entries by their beans' @Order values"
      - "Map injection keys by bean name and does not guarantee @Order-based iteration order the way List/array/ordered-stream injection does"
    answer: 3
    explanation: |
      @Order/Ordered govern the element order of List, array, and orderedStream() injection. A
      plain Map is keyed by bean name and does not contractually apply @Order to iteration order.
      To get ordered iteration, inject a List (or use ObjectProvider.orderedStream()) and derive the
      map from it, or use a sorted structure explicitly.
    ref: "concepts.md#ordering-order-vs-priority-and-tie-breaking"

  - id: dependency-injection-types-068
    difficulty: advanced
    tags: [postconstructor, beanpostprocessor, resource]
    question: |
      Which BeanPostProcessor is responsible for processing `@Resource` and `@PostConstruct`, and
      how does its work relate to `@Autowired` processing on the same bean?
    options:
      - "AutowiredAnnotationBeanPostProcessor handles @Resource, @PostConstruct, and @Autowired all identically through one shared code path"
      - "@Resource is resolved by an annotation processor at compile time and baked into bytecode, so no runtime post-processor is involved"
      - "@PostConstruct is invoked by the DispatcherServlet after each web request completes, entirely separately from @Autowired field injection"
      - "CommonAnnotationBeanPostProcessor handles @Resource and @PostConstruct; it is ordered alongside AutowiredAnnotationBeanPostProcessor so both @Autowired and @Resource resolve predictably during populateBean/init"
    answer: 3
    explanation: |
      CommonAnnotationBeanPostProcessor (JSR-250) processes @Resource injection and
      @PostConstruct/@PreDestroy, while AutowiredAnnotationBeanPostProcessor handles
      @Autowired/@Inject. Both are registered and ordered so that on a bean using both, injection
      completes during populateBean and @PostConstruct runs afterward in a predictable sequence.
    ref: "concepts.md#injection-timing-beanpostprocessor-and-ordering-of-callbacks"

  - id: dependency-injection-types-069
    difficulty: expert
    tags: [resolution, generics, collection, filtering]
    question: |
      Given beans `Repository<User>` and `Repository<Order>`, what does injecting
      `List<Repository<User>>` produce?
    options:
      - "A list containing both repositories, because generics are erased at runtime and Spring can only match on the raw Repository type"
      - "An empty list, because parameterized generic collections such as List<Repository<User>> are not eligible for autowiring at all"
      - "A list containing only the Repository<User> bean, because the resolvable generic type filters the collection"
      - "NoUniqueBeanDefinitionException, because both Repository beans match the element type and Spring cannot choose between them"
    answer: 2
    explanation: |
      Spring resolves the full parameterized element type via ResolvableType, so
      List<Repository<User>> collects only beans whose resolvable generic matches Repository<User>.
      Erasure does not defeat this because Spring reads generic metadata from the injection point
      and bean definitions, not just the raw runtime class.
    ref: "concepts.md#injecting-collections-and-maps"

  - id: dependency-injection-types-070
    difficulty: advanced
    tags: [constructor, value, qualifier, parameters]
    question: |
      On a constructor, where must `@Value`, `@Qualifier`, and `@Nullable` be placed to affect a
      specific dependency, and what can be mixed?
    options:
      - "On the class declaration only; Spring reads them there and applies them positionally, since constructor parameters cannot carry these annotations"
      - "On the individual constructor parameters, and container-resolved beans can be freely mixed with @Value literals/SpEL and @Qualifier-narrowed candidates"
      - "Only on setter methods; @Value, @Qualifier, and @Nullable are silently ignored when placed on a constructor or its parameters"
      - "On the constructor itself as a single annotation that applies uniformly to every one of its parameters at once"
    answer: 1
    explanation: |
      Parameter-level annotations (@Value, @Qualifier, @Lazy, @Nullable) attach to individual
      constructor parameters, and a single constructor can mix autowired beans, @Value-resolved
      literals/SpEL, and @Qualifier-narrowed candidates. They are not class-level or a single
      constructor-level annotation.
    ref: "concepts.md#constructor-injection"

  - id: dependency-injection-types-071
    difficulty: expert
    tags: [circular-dependency, mixed, constructor]
    question: |
      In a cycle A -> B -> A, A injects B via its constructor while B injects A via a setter.
      Assuming A is the bean instantiated first, what happens at startup?
    options:
      - "The cycle resolves cleanly, because as long as at least one side uses setter injection Spring can always expose an early reference to break it"
      - "Spring reorders creation to build B first, so A's constructor gets a ready B and the constructor cycle is quietly avoided"
      - "It fails with BeanCurrentlyInCreationException, because the bean that starts the chain (A) uses constructor injection and its instance cannot be created before B is available"
      - "Spring injects a null into A's constructor to break the deadlock and then wires the real B in during a later phase"
    answer: 2
    explanation: |
      Early-reference resolution requires that the bean starting the chain already have a raw
      instance to expose. If A is requested first and needs B in its constructor, A's instance does
      not exist yet, so no early reference can break the cycle — Spring throws
      BeanCurrentlyInCreationException. A constructor dependency on the entry side defeats the
      setter-cycle escape hatch.
    ref: "concepts.md#circular-dependency-resolution-internals"

  - id: dependency-injection-types-072
    difficulty: advanced
    tags: [objectprovider, stream, ordering]
    question: |
      Which `ObjectProvider` method returns all matching candidates sorted according to
      `@Order`/`Ordered`?
    options:
      - "getObject()"
      - "getIfUnique()"
      - "orderedStream()"
      - "getIfAvailable()"
    answer: 2
    explanation: |
      orderedStream() streams all candidates in @Order/Ordered sequence. stream() returns them
      unordered (registration order). getObject/getIfAvailable/getIfUnique resolve a single bean,
      not the full ordered set.
    ref: "concepts.md#objectprovider-objectfactory-and-provider-semantics"

  - id: dependency-injection-types-073
    difficulty: expert
    tags: [resolution, resolvabletype, value-vs-bean]
    question: |
      In `doResolveDependency`, what is evaluated FIRST, before performing a type-based candidate
      search for an injection point?
    options:
      - "The @Order value of every bean currently registered in the application context"
      - "A cached qualifier/name shortcut or a @Value expression on the injection point"
      - "The alphabetical ordering of all bean names in the registry, evaluated up front"
      - "Whether each candidate bean is singleton- or prototype-scoped in the context"
    answer: 1
    explanation: |
      Resolution begins with shortcut/@Value handling: a previously resolved qualifier/name
      shortcut is checked, and a @Value expression is evaluated, before falling back to the
      type-match candidate search. Ordering, naming, and scope are not the first step.
    ref: "concepts.md#how-the-container-resolves-an-injection-point"

  - id: dependency-injection-types-074
    difficulty: advanced
    tags: [method-injection, config-method, required-false]
    question: |
      A bean has a multi-argument config method annotated `@Autowired(required = false)`, and one
      of that method's parameter types has no matching bean in the context. What does Spring do?
    options:
      - "Invokes the method, passing null for the unresolvable parameter and injecting the rest"
      - "Skips the entire method invocation, leaving all of its target fields at their existing values"
      - "Throws UnsatisfiedDependencyException, because required=false is ignored on multi-arg methods"
      - "Injects only the resolvable parameter by calling the method once per parameter"
    answer: 1
    explanation: |
      For an @Autowired(required = false) injection method, Spring resolves all of its arguments as
      a unit; if any one required argument cannot be satisfied, the whole method is skipped rather
      than invoked with a null. (A @Nullable parameter, by contrast, would let the method run with
      null for the missing argument.) This all-or-nothing behavior is a key difference from
      required=true, which would throw when the dependency is missing.
    ref: "concepts.md#method-injection"

  - id: dependency-injection-types-075
    difficulty: expert
    tags: [thread-safety, publication, singleton, visibility]
    question: |
      Why are setter-injected singleton dependencies usually visible correctly to other threads
      even though the fields are non-final?
    options:
      - "Because Spring wraps every singleton in a synchronized proxy that guards each field read behind an intrinsic lock"
      - "Because initialization happens-before the fully-built singleton is placed into singletonObjects and handed to consumers, providing safe publication; the residual risk is later reassignment from another thread"
      - "Because the JVM automatically promotes every @Autowired-set field to volatile so writes flush to main memory immediately"
      - "Because the JMM guarantees non-final instance fields are always visible across threads once the object's constructor has returned"
    answer: 1
    explanation: |
      The container completes injection/initialization before publishing the singleton into
      singletonObjects and handing it to consumers, so the happens-before relationship makes the
      dependency reference visible. The remaining hazard is application code reassigning the setter
      later from another thread; constructor + final forecloses that. Non-final fields are not
      automatically visible in the JMM.
    ref: "concepts.md#thread-safety-and-concurrency-of-injected-state"

  - id: dependency-injection-types-076
    difficulty: advanced
    tags: [collections, empty, optional, objectprovider]
    question: |
      You want to inject all beans of type `Plugin` into a `List<Plugin>`, but the list should be
      empty (not a startup failure) when no Plugin beans exist. Which options achieve this?
    options:
      - "Only declaring the List field final, which makes Spring inject an empty immutable list when no candidates exist"
      - "Marking each Plugin bean @Primary so the container substitutes an empty collection when none are found"
      - "Either @Autowired(required = false) on the List, or injecting ObjectProvider<Plugin> and using stream()/orderedStream()"
      - "Nothing works; an empty candidate set for a List always throws NoSuchBeanDefinitionException at context startup"
    answer: 2
    explanation: |
      A required List with no matching beans fails by default. Marking it @Autowired(required =
      false) yields an empty collection, and injecting ObjectProvider<Plugin> and streaming it also
      tolerates zero candidates gracefully. final and @Primary do not address the empty-candidate
      behavior.
    ref: "concepts.md#injecting-collections-and-maps"

  - id: dependency-injection-types-077
    difficulty: expert
    tags: [resolution, qualifier, custom-annotation]
    question: |
      A team defines a custom annotation `@Fast` meta-annotated with `@Qualifier` and puts it on
      one of several `Engine` beans, then injects `@Autowired @Fast Engine engine`. At which stage
      of resolution does `@Fast` take effect?
    options:
      - "It has no effect at all, because only the literal String-valued @Qualifier(\"name\") form is honored during resolution"
      - "Only as a last resort after type match and name-based fallback have both failed to select a single candidate"
      - "During @Primary evaluation, where the custom qualifier is treated as an override that outranks any @Primary bean"
      - "During qualifier narrowing, where custom qualifier annotations filter the candidate set just like @Qualifier(\"...\")"
    answer: 3
    explanation: |
      A custom annotation meta-annotated with @Qualifier acts as a first-class qualifier and
      participates in the qualifier-narrowing stage, filtering candidates before @Primary/@Priority
      and name fallback. It is not limited to String-valued @Qualifier and does not defer to name
      matching.
    ref: "concepts.md#how-the-container-resolves-an-injection-point"

  - id: dependency-injection-types-078
    difficulty: advanced
    tags: [lifecycle, aware, ordering]
    question: |
      Relative to field/setter injection, when do `Aware` interface callbacks (e.g.
      `ApplicationContextAware.setApplicationContext`) execute?
    options:
      - "Before the constructor runs, so the bean is Aware of its context even during instantiation"
      - "After @PostConstruct has completed but before afterPropertiesSet is invoked on the bean"
      - "Concurrently with injection, dispatched on a separate lifecycle thread managed by the container"
      - "After populateBean (field/setter injection) completes, and before @PostConstruct"
    answer: 3
    explanation: |
      The per-bean sequence is: constructor -> populateBean (field/setter injection) -> Aware
      callbacks -> @PostConstruct -> afterPropertiesSet -> custom init-method. So Aware callbacks
      run after injection completes and before @PostConstruct, on the same thread.
    ref: "concepts.md#injection-timing-beanpostprocessor-and-ordering-of-callbacks"
