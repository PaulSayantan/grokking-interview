topic: "Spring Expression Language (SpEL) and @Value"
domain: spring-core
topic_slug: spel-and-value
version: 1
questions:
  - id: spel-and-value-001
    difficulty: beginner
    tags: [spel, definition]
    question: |
      What is the Spring Expression Language (SpEL)?
    options:
      - "A runtime expression language for querying and manipulating an object graph, shipped in the spring-expression module"
      - "A server-side templating language for rendering HTML views in the Spring MVC and Thymeleaf layer"
      - "A build-time annotation processor that scans classes and generates bean definitions at compile time"
      - "A specialized SQL dialect used only by Spring Data JPA to translate repository method names to queries"
    answer: 0
    explanation: |
      SpEL is a runtime expression language (in the spring-expression module) that supports
      querying and manipulating an object graph at evaluation time. It is separate from view
      rendering and from any SQL dialect.
    ref: "concepts.md#what-is-spring-expression-language"

  - id: spel-and-value-002
    difficulty: beginner
    tags: [spel, module]
    question: |
      Which statement about SpEL's relationship to the Spring IoC container is correct?
    options:
      - "SpEL can only run inside a fully refreshed IoC container and cannot be parsed or evaluated standalone"
      - "SpEL is a standalone language that can be used independently but integrates deeply with the container"
      - "SpEL is only available once Spring Boot auto-configuration is enabled and the starters are on the classpath"
      - "SpEL replaces the IoC container entirely and becomes the sole mechanism for wiring beans together"
    answer: 1
    explanation: |
      The spring-expression module is standalone and can be used without the container, but it
      also integrates with the container so bean definitions and injected values can be computed
      dynamically.
    ref: "concepts.md#what-is-spring-expression-language"

  - id: spel-and-value-003
    difficulty: beginner
    tags: [spel, api]
    question: |
      In the standalone SpEL API, which type parses an expression String into an Expression object?
    options:
      - "EvaluationContext, which parses the raw String and holds the resulting node tree"
      - "BeanFactory, whose getBean lookup compiles the expression into an Expression object"
      - "ExpressionParser (e.g. SpelExpressionParser)"
      - "PropertySourcesPlaceholderConfigurer, which reads the String from a property source and parses it"
    answer: 2
    explanation: |
      ExpressionParser (commonly SpelExpressionParser) parses a String into an Expression. The
      EvaluationContext supplies the root object/variables, and Expression is the parsed form.
    ref: "concepts.md#what-is-spring-expression-language"

  - id: spel-and-value-004
    difficulty: intermediate
    tags: [spel, api]
    question: |
      What does an EvaluationContext provide when a SpEL expression is evaluated?
    options:
      - "Only the raw expression string, which the parser re-tokenizes on every evaluation call"
      - "The compiled bytecode of the whole application, so the expression can call any loaded class"
      - "The list of all beans that failed to initialize during the last context refresh cycle"
      - "The root object, variables, functions, property accessors, and type conversion support"
    answer: 3
    explanation: |
      The EvaluationContext supplies the root object, variables, functions, custom property
      accessors, a type locator, and the ConversionService used during evaluation.
    ref: "concepts.md#what-is-spring-expression-language"

  - id: spel-and-value-005
    difficulty: beginner
    tags: [placeholder, spel, key-difference]
    question: |
      What is the key difference between ${...} and #{...} in Spring?
    options:
      - "${...} looks up an external property value; #{...} evaluates a SpEL expression"
      - "They are fully identical and interchangeable, differing only in the character before the brace"
      - "${...} evaluates a SpEL expression while #{...} performs the named property lookup"
      - "${...} is valid only inside XML configuration and #{...} is valid only inside annotations"
    answer: 0
    explanation: |
      ${...} is a property placeholder resolved by PropertySourcesPlaceholderConfigurer (a lookup
      of a named property), while #{...} is a SpEL expression evaluated by the
      StandardBeanExpressionResolver.
    ref: "concepts.md#spel-expressions-versus-property-placeholders"

  - id: spel-and-value-006
    difficulty: intermediate
    tags: [placeholder, spel, order]
    question: |
      In the expression @Value("#{'${app.regions}'.split(',')}"), what happens first?
    options:
      - "The SpEL split(',') runs first on the literal token, then the ${app.regions} placeholder is resolved"
      - "The ${app.regions} placeholder is resolved first, then the resulting string is evaluated as SpEL"
      - "Both are resolved simultaneously in a single pass by the same StandardBeanExpressionResolver instance"
      - "It fails at startup because placeholder and SpEL syntax can never be nested within one expression"
    answer: 1
    explanation: |
      Property placeholders are resolved before SpEL is evaluated. So ${app.regions} is substituted
      into a literal string, and then SpEL calls split(',') on that string.
    ref: "concepts.md#spel-expressions-versus-property-placeholders"

  - id: spel-and-value-007
    difficulty: beginner
    tags: [placeholder, resolver]
    question: |
      Which infrastructure component resolves ${...} property placeholders?
    options:
      - "StandardBeanExpressionResolver, delegating each ${...} token to the SpEL engine for lookup"
      - "SpelExpressionParser, which treats ${...} as a variable reference into the Environment"
      - "PropertySourcesPlaceholderConfigurer (working with the Environment/PropertySources)"
      - "ConversionService, by converting the placeholder key string into its resolved property value"
    answer: 2
    explanation: |
      ${...} placeholders are resolved by PropertySourcesPlaceholderConfigurer, which reads from the
      Environment's property sources. SpEL (#{...}) is handled by StandardBeanExpressionResolver.
    ref: "concepts.md#spel-expressions-versus-property-placeholders"

  - id: spel-and-value-008
    difficulty: intermediate
    tags: [placeholder, missing]
    question: |
      With @Value("${app.timeout}") and no property named app.timeout defined and no default given,
      what is the typical result in plain Spring?
    options:
      - "The field is silently set to null and the context finishes refreshing without any warning"
      - "The field is set to the literal, unresolved string ${app.timeout} exactly as written in the annotation"
      - "The field is set to 0, the numeric zero-value that the resolver uses for any missing placeholder"
      - "Placeholder resolution fails (e.g. IllegalArgumentException: Could not resolve placeholder)"
    answer: 3
    explanation: |
      By default PropertySourcesPlaceholderConfigurer does not ignore unresolvable placeholders, so a
      missing property with no default causes a startup failure rather than a null or literal value.
    ref: "concepts.md#spel-expressions-versus-property-placeholders"

  - id: spel-and-value-009
    difficulty: intermediate
    tags: [placeholder, enable, spring-vs-boot]
    question: |
      In plain Spring Framework (not Spring Boot), how do you enable ${...} placeholder resolution?
    options:
      - "Register a PropertySourcesPlaceholderConfigurer bean (typically static) or use <context:property-placeholder>"
      - "It is always enabled by default in the core container with no extra bean or configuration required"
      - "Add @SpringBootApplication to the main class so the environment post-processors are auto-registered"
      - "Add any spring-boot-starter dependency to the classpath and the configurer is wired automatically"
    answer: 0
    explanation: |
      Plain Spring requires you to register a PropertySourcesPlaceholderConfigurer (usually a static
      @Bean) or use <context:property-placeholder>. Automatic registration is a Spring Boot feature.
    ref: "concepts.md#spel-expressions-versus-property-placeholders"

  - id: spel-and-value-010
    difficulty: beginner
    tags: [value, literal]
    question: |
      What does @Value("42") on an int field produce?
    options:
      - "A compilation error because a String cannot be an int"
      - "The int value 42 after type conversion"
      - "The literal string \"42\" ignored because the field is int"
      - "A lookup of a property named 42"
    answer: 1
    explanation: |
      A literal @Value string is converted to the target type by the container's ConversionService,
      so "42" becomes the int 42. It is not treated as a property lookup (that would need ${...}).
    ref: "concepts.md#value-with-literals-placeholders-and-defaults"

  - id: spel-and-value-011
    difficulty: beginner
    tags: [value, default]
    question: |
      What does @Value("${db.pool.size:10}") do when the property db.pool.size is not defined?
    options:
      - "Throws an IllegalArgumentException because the property is missing"
      - "Injects null since the colon default is ignored for numeric fields"
      - "Injects the default value 10"
      - "Injects the literal string db.pool.size as the field value"
    answer: 2
    explanation: |
      The syntax ${key:default} supplies a default used when the property is absent, so this injects
      10 when db.pool.size is not defined.
    ref: "concepts.md#value-with-literals-placeholders-and-defaults"

  - id: spel-and-value-012
    difficulty: intermediate
    tags: [value, default, syntax]
    question: |
      In the placeholder ${feature.flags:}, what is the default value?
    options:
      - "The literal string \"null\""
      - "There is no default; it is a syntax error"
      - "A single space character"
      - "An empty string"
    answer: 3
    explanation: |
      Everything after the first colon is the default. With nothing after the colon, the default is
      an empty string.
    ref: "concepts.md#value-with-literals-placeholders-and-defaults"

  - id: spel-and-value-013
    difficulty: intermediate
    tags: [value, conversion]
    question: |
      How is a resolved @Value string converted to a non-String target type like int or boolean?
    options:
      - "Via the container's ConversionService / PropertyEditor support"
      - "It is not converted at all; @Value can only populate String-typed fields and parameters"
      - "By calling the target type's toString() method and parsing the resulting characters back"
      - "By reflection that copies the field's existing default value and coerces it to the new type"
    answer: 0
    explanation: |
      The raw resolved string is converted to the target type using the container's
      ConversionService/PropertyEditor support, enabling int, boolean, arrays, List, Set, etc.
    ref: "concepts.md#value-with-literals-placeholders-and-defaults"

  - id: spel-and-value-014
    difficulty: intermediate
    tags: [value, static]
    question: |
      Can @Value inject a value into a static field?
    options:
      - "Yes, static fields are injected first, before any instance fields, during class loading"
      - "No — Spring does not inject values into static fields"
      - "Only if the field is also declared final, letting Spring treat it as a class constant"
      - "Only when using XML configuration, where a static-args element supports static injection"
    answer: 1
    explanation: |
      Spring cannot inject into static fields; @Value must be placed on instance fields, constructor
      parameters, or setter/method parameters.
    ref: "concepts.md#value-with-literals-placeholders-and-defaults"

  - id: spel-and-value-015
    difficulty: beginner
    tags: [value, constructor]
    question: |
      Which of these is a valid place to use @Value?
    options:
      - "Only on package-private fields, because Spring cannot reflectively set private ones"
      - "Only inside XML files, using a value attribute rather than the annotation form"
      - "On fields, constructor parameters, and setter/method parameters"
      - "Only on interface methods, so the value is supplied to every implementing class"
    answer: 2
    explanation: |
      @Value can annotate fields, constructor parameters (preferred for immutability), and
      setter/method parameters.
    ref: "concepts.md#value-with-literals-placeholders-and-defaults"

  - id: spel-and-value-016
    difficulty: beginner
    tags: [value, spel]
    question: |
      What does @Value("#{2 * 60 * 1000}") inject into a long field?
    options:
      - "The literal string \"2 * 60 * 1000\" stored verbatim because #{...} does not evaluate arithmetic"
      - "A property lookup failure, since #{...} is treated as a placeholder for a missing property key"
      - "The number 3, because SpEL counts the multiplication operators instead of computing the product"
      - "120000 (the evaluated arithmetic result)"
    answer: 3
    explanation: |
      #{...} is SpEL, so the arithmetic is evaluated at injection time producing 120000.
    ref: "concepts.md#value-with-spel-expressions"

  - id: spel-and-value-017
    difficulty: intermediate
    tags: [value, spel, context]
    question: |
      In a @Value SpEL expression, what is the "root object"?
    options:
      - "There is no root object; a bare identifier like foo.bar means bean foo's property bar"
      - "The current bean being created, so a bare identifier reads that bean's own instance fields"
      - "The Environment object, so a bare identifier is resolved as a property key from the environment"
      - "The application context itself, so foo.bar calls getBean('foo') and then reads its bar attribute"
    answer: 0
    explanation: |
      @Value SpEL is evaluated with no root object. A bare identifier is resolved as a bean name via
      the bean factory acting as the resolver, so foo.bar reads property bar of bean foo.
    ref: "concepts.md#value-with-spel-expressions"

  - id: spel-and-value-018
    difficulty: intermediate
    tags: [value, spel, when]
    question: |
      When is a @Value SpEL expression evaluated for a singleton bean?
    options:
      - "Continuously, as a live binding that updates when the property changes"
      - "Once, during dependency injection at bean creation time"
      - "Lazily, only the first time the field is read via reflection after the context has started"
      - "At compile time, when the annotation processor folds the expression into a constant value"
    answer: 1
    explanation: |
      SpEL in @Value is evaluated once during dependency injection (bean creation); it is not a live,
      continuously re-evaluated binding.
    ref: "concepts.md#value-with-spel-expressions"

  - id: spel-and-value-019
    difficulty: intermediate
    tags: [value, environment, spel]
    question: |
      Which predefined variables are available in the StandardEvaluationContext used for @Value SpEL?
    options:
      - "requestParams and sessionAttributes"
      - "modelAttributes and flashAttributes"
      - "systemProperties and systemEnvironment"
      - "none; SpEL has no predefined variables"
    answer: 2
    explanation: |
      The bean-expression StandardEvaluationContext exposes predefined variables including
      systemProperties and systemEnvironment, plus the bean factory and Environment.
    ref: "concepts.md#value-with-spel-expressions"

  - id: spel-and-value-020
    difficulty: beginner
    tags: [spel, bean-reference]
    question: |
      In SpEL, how do you reference a bean named myBean from the BeanFactory?
    options:
      - "#myBean"
      - "$myBean"
      - "&myBean"
      - "@myBean"
    answer: 3
    explanation: |
      @beanName references a bean from the factory (e.g. @myBean.someMethod()). &beanName returns the
      FactoryBean itself rather than the product it creates.
    ref: "concepts.md#referencing-beans-properties-and-methods"

  - id: spel-and-value-021
    difficulty: intermediate
    tags: [spel, factory-bean]
    question: |
      What does the & prefix mean in a SpEL bean reference, as in &myFactoryBean?
    options:
      - "It returns the FactoryBean instance itself rather than the object it produces"
      - "It returns the fully-built object that the FactoryBean produces at runtime"
      - "It forces the container to build a brand-new bean instance on each reference"
      - "It is rejected as invalid syntax with no dereference meaning in SpEL"
    answer: 0
    explanation: |
      Consistent with the container's FactoryBean dereference convention, &beanName returns the
      FactoryBean itself, while beanName (or @beanName) returns the produced object.
    ref: "concepts.md#referencing-beans-properties-and-methods"

  - id: spel-and-value-022
    difficulty: intermediate
    tags: [spel, safe-navigation]
    question: |
      What does the safe navigation operator ?. do in person?.name when person is null?
    options:
      - "Throws a NullPointerException"
      - "Returns null instead of throwing"
      - "Returns an empty string"
      - "Skips evaluation entirely and returns the expression unparsed"
    answer: 1
    explanation: |
      The safe navigation operator ?. returns null when the target is null instead of throwing a
      NullPointerException.
    ref: "concepts.md#referencing-beans-properties-and-methods"

  - id: spel-and-value-023
    difficulty: beginner
    tags: [spel, method-invocation]
    question: |
      Which SpEL expression correctly invokes a method?
    options:
      - "'abc'->toUpperCase"
      - "toUpperCase('abc')"
      - "'abc'.toUpperCase()"
      - "'abc'::toUpperCase"
    answer: 2
    explanation: |
      SpEL uses standard dot method-invocation syntax: 'abc'.toUpperCase() returns "ABC".
    ref: "concepts.md#referencing-beans-properties-and-methods"

  - id: spel-and-value-024
    difficulty: beginner
    tags: [spel, collections, indexing]
    question: |
      In SpEL, how do you access the value stored under key 'name' in a map?
    options:
      - "map.get['name']"
      - "map->name"
      - "map.name.value"
      - "map['name'] or map[name]"
    answer: 3
    explanation: |
      SpEL indexes maps with bracket syntax: map['name'] (or map[name] when name is a variable). The
      same bracket syntax indexes lists and arrays.
    ref: "concepts.md#collections-arrays-selection-and-projection"

  - id: spel-and-value-025
    difficulty: intermediate
    tags: [spel, selection]
    question: |
      What does the SpEL selection expression list.?[#this > 10] return?
    options:
      - "A new collection containing every element greater than 10"
      - "Only the single first element greater than 10, discarding the rest of the matches"
      - "A boolean flag reporting whether at least one element in the collection exceeds 10"
      - "An integer count of how many elements in the collection are greater than 10"
    answer: 0
    explanation: |
      Selection .?[...] filters a collection and returns a new collection of all matching elements;
      #this is the current element. First-match uses .^[] and last-match uses .$[].
    ref: "concepts.md#collections-arrays-selection-and-projection"

  - id: spel-and-value-026
    difficulty: intermediate
    tags: [spel, projection]
    question: |
      What does the SpEL projection expression members.![name] produce?
    options:
      - "A filtered collection of only those members whose name property is not null"
      - "A new collection containing the name of each member"
      - "Just the first member's name, taken from the head of the collection"
      - "A boolean reporting whether every member in the collection has a non-null name"
    answer: 1
    explanation: |
      Projection .![...] transforms each element, returning a new collection — here the list of each
      member's name property.
    ref: "concepts.md#collections-arrays-selection-and-projection"

  - id: spel-and-value-027
    difficulty: intermediate
    tags: [spel, selection, first-last]
    question: |
      Which SpEL operators return the first and last matching elements of a collection, respectively?
    options:
      - ".?[] and .![]"
      - ".first[] and .last[]"
      - ".^[] and .$[]"
      - ".<[] and .>[]"
    answer: 2
    explanation: |
      .^[...] returns the first matching element and .$[...] returns the last. .?[...] is selection
      (all matches) and .![...] is projection.
    ref: "concepts.md#collections-arrays-selection-and-projection"

  - id: spel-and-value-028
    difficulty: beginner
    tags: [spel, inline-list]
    question: |
      What does the SpEL expression {1, 2, 3, 4} create?
    options:
      - "A java.util.Set"
      - "An int array only"
      - "A String"
      - "A java.util.List"
    answer: 3
    explanation: |
      Inline list syntax {..} creates a java.util.List. Inline map syntax {key: value} creates a
      java.util.Map.
    ref: "concepts.md#collections-arrays-selection-and-projection"

  - id: spel-and-value-029
    difficulty: beginner
    tags: [spel, ternary]
    question: |
      What does the ternary expression @Value("#{@config.enabled ? 'ON' : 'OFF'}") do?
    options:
      - "Injects 'ON' if config.enabled is true, otherwise 'OFF'"
      - "Always injects 'ON' because the ternary condition is evaluated only once at parse time"
      - "Throws a SpelEvaluationException whenever config.enabled resolves to false at injection time"
      - "Injects the raw string \"@config.enabled ? 'ON' : 'OFF'\" verbatim without evaluating it"
    answer: 0
    explanation: |
      The SpEL ternary condition ? ifTrue : ifFalse selects between two values based on the boolean
      condition, injecting 'ON' when enabled is true and 'OFF' otherwise.
    ref: "concepts.md#operators-ternary-and-the-elvis-operator"

  - id: spel-and-value-030
    difficulty: intermediate
    tags: [spel, elvis]
    question: |
      What does the Elvis operator do in #{systemProperties['app.region'] ?: 'US'}?
    options:
      - "Concatenates the resolved region string together with the literal 'US' into one value"
      - "Uses the left value unless it is null, in which case it uses 'US'"
      - "Throws a SpelEvaluationException whenever the left operand resolves to null"
      - "Always returns 'US', ignoring whatever the app.region system property holds"
    answer: 1
    explanation: |
      The Elvis operator ?: is null-coalescing: it returns the left operand unless it is null, in
      which case it returns the right operand ('US').
    ref: "concepts.md#operators-ternary-and-the-elvis-operator"

  - id: spel-and-value-031
    difficulty: intermediate
    tags: [spel, elvis, placeholder]
    question: |
      How does the SpEL Elvis operator ?: differ from the placeholder default syntax ${key:default}?
    options:
      - "They are exactly the same feature, both handled by the placeholder resolver, just spelled differently"
      - "?: is only valid inside XML bean definitions while ${key:default} is only valid inside annotations"
      - "?: is null-coalescing on an evaluated SpEL value; ${key:default} supplies a default for a missing property"
      - "${key:default} is evaluated as a SpEL expression while ?: performs a named property-source lookup"
    answer: 2
    explanation: |
      Though they look similar, ?: is the SpEL null-coalescing operator (handled by the expression
      engine), while ${key:default} is placeholder-default syntax (handled by the placeholder
      resolver for a missing property).
    ref: "concepts.md#operators-ternary-and-the-elvis-operator"

  - id: spel-and-value-032
    difficulty: intermediate
    tags: [spel, operators, textual]
    question: |
      Which of the following is a valid textual alias for a relational/logical operator in SpEL?
    options:
      - "grt as the textual alias for the greater-than relational comparison operator"
      - "AND-IF as the textual alias for the logical short-circuiting AND operator"
      - "isGreater as the textual alias for the greater-than relational comparison operator"
      - "gt for greater-than and and for logical AND"
    answer: 3
    explanation: |
      SpEL provides textual aliases such as lt, gt, le, ge, eq, ne, and, or, not (handy in XML where
      < and & are awkward). 'gt' and 'and' are valid.
    ref: "concepts.md#operators-ternary-and-the-elvis-operator"

  - id: spel-and-value-033
    difficulty: beginner
    tags: [spel, operators, arithmetic]
    question: |
      Which operator computes exponentiation (power) in SpEL?
    options:
      - "^"
      - "**"
      - "pow"
      - "exp"
    answer: 0
    explanation: |
      SpEL uses ^ for the power operator (e.g. 2 ^ 3 == 8). It also supports + - * / % for the usual
      arithmetic and string concatenation with +.
    ref: "concepts.md#operators-ternary-and-the-elvis-operator"

  - id: spel-and-value-034
    difficulty: beginner
    tags: [spel, t-operator, static]
    question: |
      How do you access a static method or field in SpEL, such as Math.PI?
    options:
      - "static(java.lang.Math).PI"
      - "T(java.lang.Math).PI"
      - "@java.lang.Math.PI"
      - "class[java.lang.Math].PI"
    answer: 1
    explanation: |
      The T(...) operator returns a Class reference used to access statics, constants, and enums,
      e.g. T(java.lang.Math).PI or T(java.lang.Math).max(3, 7).
    ref: "concepts.md#type-access-with-t-operator-and-statics"

  - id: spel-and-value-035
    difficulty: intermediate
    tags: [spel, t-operator, java-lang]
    question: |
      Which of these T() references is valid without a fully qualified package name?
    options:
      - "T(Date) for java.util.Date"
      - "T(List) for java.util.List"
      - "T(Integer) for java.lang.Integer"
      - "T(TimeUnit) for java.util.concurrent.TimeUnit"
    answer: 2
    explanation: |
      Only classes in java.lang may be referenced by simple name in T(...), so T(Integer) works but
      java.util types like Date, List, and TimeUnit need their fully qualified names.
    ref: "concepts.md#type-access-with-t-operator-and-statics"

  - id: spel-and-value-036
    difficulty: intermediate
    tags: [spel, t-operator, enum]
    question: |
      How do you reference an enum constant such as TimeUnit.SECONDS in SpEL?
    options:
      - "enum(java.util.concurrent.TimeUnit.SECONDS)"
      - "@TimeUnit.SECONDS"
      - "$TimeUnit{SECONDS}"
      - "T(java.util.concurrent.TimeUnit).SECONDS"
    answer: 3
    explanation: |
      Enum constants are accessed through the T() type reference: T(java.util.concurrent.TimeUnit).SECONDS.
    ref: "concepts.md#type-access-with-t-operator-and-statics"

  - id: spel-and-value-037
    difficulty: intermediate
    tags: [spel, evaluation-context, security]
    question: |
      Which EvaluationContext is designed to restrict SpEL (disabling T(), constructors, and bean
      references) for untrusted or data-binding scenarios?
    options:
      - "SimpleEvaluationContext"
      - "StandardEvaluationContext"
      - "BeanExpressionContext"
      - "RestrictedEvaluationContext"
    answer: 0
    explanation: |
      SimpleEvaluationContext (since Spring 4.3.15) deliberately disables type references,
      constructors, and bean references. StandardEvaluationContext exposes the full language.
    ref: "concepts.md#type-access-with-t-operator-and-statics"

  - id: spel-and-value-038
    difficulty: beginner
    tags: [spel, use-cases]
    question: |
      Which of the following is a common, valid use case for SpEL in Spring?
    options:
      - "Compiling Java source files into class bytecode during the project's build phase"
      - "Computing a default with the Elvis operator in @Value, e.g. #{... ?: 'fallback'}"
      - "Replacing the embedded servlet container that dispatches inbound HTTP requests"
      - "Defining relational database table schemas and their column constraints"
    answer: 1
    explanation: |
      Typical SpEL use cases include computed defaults (Elvis), reading from other beans or the
      environment, and transforming configured properties. It is not a compiler or schema tool.
    ref: "concepts.md#common-use-cases-and-where-spel-is-evaluated"

  - id: spel-and-value-039
    difficulty: intermediate
    tags: [spel, where-evaluated]
    question: |
      For @Value and bean definitions, which component evaluates the #{...} SpEL, and when?
    options:
      - "The DispatcherServlet, re-evaluating the expression on each inbound HTTP request it handles"
      - "The JVM class loader, folding the expression into a constant when the class is first loaded"
      - "StandardBeanExpressionResolver, during bean creation / dependency injection"
      - "The garbage collector, re-resolving live @Value fields during each major collection cycle"
    answer: 2
    explanation: |
      SpEL for @Value and bean definitions is evaluated by StandardBeanExpressionResolver during bean
      creation/dependency injection (at startup for singletons).
    ref: "concepts.md#common-use-cases-and-where-spel-is-evaluated"

  - id: spel-and-value-040
    difficulty: intermediate
    tags: [spel, default-delimiters]
    question: |
      What are the default SpEL expression prefix and suffix used by the bean expression resolver?
    options:
      - "${ and }"
      - "%{ and }"
      - "<% and %>"
      - "#{ and }"
    answer: 3
    explanation: |
      The default SpEL prefix/suffix is #{ and } (configurable on the resolver). ${ } is the separate
      property-placeholder delimiter.
    ref: "concepts.md#common-use-cases-and-where-spel-is-evaluated"

  - id: spel-and-value-041
    difficulty: intermediate
    tags: [spel, annotations, use-cases]
    question: |
      In which of the following Spring features is SpEL commonly used?
    options:
      - "The condition, unless, and key attributes of caching annotations like @Cacheable"
      - "The @Override marker annotation from java.lang used to signal method overriding to the compiler"
      - "The naming convention of the package-info.java file that carries package-level annotations"
      - "The pattern-matching syntax used inside a project's .gitignore file to exclude paths"
    answer: 0
    explanation: |
      SpEL is used in caching annotation attributes (condition/unless/key), Spring Security
      @PreAuthorize/@PostAuthorize, Spring Data @Query, @Value, and bean definitions.
    ref: "concepts.md#common-use-cases-and-where-spel-is-evaluated"

  - id: spel-and-value-042
    difficulty: beginner
    tags: [placeholder, mnemonic, key-difference]
    question: |
      You only need to read a configured property value (no math or method calls). Which syntax is
      the simpler, more appropriate choice?
    options:
      - "#{...} SpEL"
      - "${...} property placeholder"
      - "%{...} placeholder"
      - "Either one, but SpEL is always required for properties"
    answer: 1
    explanation: |
      When you just need to read a configured property, ${...} is simpler and clearer. Reach for
      #{...} SpEL only when you must transform or compute a value or reference beans.
    ref: "concepts.md#spel-expressions-versus-property-placeholders"

  - id: spel-and-value-043
    difficulty: intermediate
    tags: [version, jakarta, framework]
    question: |
      Regarding Spring Framework 6.x (Jakarta baseline), which statement about @Value and the SpEL
      API is correct?
    options:
      - "@Value was relocated from the javax.annotation package to jakarta.annotation as part of the Spring 6 migration"
      - "SpEL was dropped from Spring 6 entirely and replaced by the Jakarta Expression Language (Jakarta EL) engine"
      - "@Value and the SpEL API are Spring's own types and keep their package names across 5.x and 6.x"
      - "In Spring 6 the @Value annotation only functions when Spring Boot auto-configuration is present on the classpath"
    answer: 2
    explanation: |
      The javax-to-jakarta migration in Spring 6 affected JSR-330/JSR-250 annotations, but @Value
      (org.springframework.beans.factory.annotation.Value) and the SpEL API are Spring's own types
      and keep their package names.
    ref: "concepts.md#common-use-cases-and-where-spel-is-evaluated"

  - id: spel-and-value-044
    difficulty: advanced
    tags: [spel, operators, null, relational]
    question: |
      A bean exposes an int property count whose value is 5. What does the SpEL expression
      #{@stats.count > null} evaluate to, and why?
    options:
      - "false, because comparing an int to null coerces null to 0 and 5 > 0 is then re-checked against null"
      - "It throws a SpelEvaluationException because null cannot participate in a relational comparison"
      - "false, because any comparison involving null short-circuits to false in SpEL"
      - "true, because SpEL treats null as 'nothing' and defines X > null as always true for any left operand"
    answer: 3
    explanation: |
      In SpEL, null is treated as 'nothing', not as zero. The language defines X > null as always
      true and X < null as always false, regardless of the left operand, and it never throws. To
      guard a number you must compare against 0, not null.
    ref: "concepts.md#operators-ternary-and-the-elvis-operator"

  - id: spel-and-value-045
    difficulty: expert
    tags: [spel, equality, comparable, bigdecimal]
    question: |
      What does #{new java.math.BigDecimal('1.0') == new java.math.BigDecimal('1.00')} evaluate to
      in SpEL, and how does that compare to the same expression in plain Java using equals()?
    options:
      - "SpEL returns false and Java equals() returns false, because both compare scale-sensitively"
      - "SpEL returns true and Java equals() returns true, because both ignore trailing zeros"
      - "SpEL returns true while BigDecimal.equals() returns false, because SpEL == uses Comparable.compareTo for comparable types"
      - "Both throw because BigDecimal is not directly comparable with =="
    answer: 2
    explanation: |
      For Comparable types SpEL's == delegates to compareTo, and BigDecimal.compareTo ignores scale,
      so 1.0 and 1.00 are equal (true). Java's BigDecimal.equals() is scale-sensitive and returns
      false. This divergence between SpEL == and equals() for Comparable types is a classic trap.
    ref: "concepts.md#operators-ternary-and-the-elvis-operator"

  - id: spel-and-value-046
    difficulty: advanced
    tags: [spel, order, placeholder, failure]
    question: |
      Given @Value("#{'${app.mode}'.toUpperCase()}") where property app.mode is NOT defined and has
      no default, what happens at startup?
    options:
      - "SpEL evaluates first, calling toUpperCase() on the literal '${app.mode}', yielding '${APP.MODE}'"
      - "The field is silently set to null because the placeholder is unresolvable"
      - "SpEL throws a SpelEvaluationException for an unknown variable app.mode"
      - "Placeholder resolution runs first and fails with 'Could not resolve placeholder app.mode' before SpEL ever executes"
    answer: 3
    explanation: |
      Property placeholders are resolved before SpEL runs. With no value and no default, the
      placeholder resolver throws IllegalArgumentException 'Could not resolve placeholder app.mode'
      at that earlier stage, so the SpEL toUpperCase() call is never reached.
    ref: "concepts.md#failure-modes-parse-time-versus-evaluation-time-errors"

  - id: spel-and-value-047
    difficulty: expert
    tags: [spel, security, evaluation-context]
    question: |
      A web endpoint evaluates a user-supplied string as SpEL to filter results. Which single choice
      most directly prevents T(java.lang.Runtime).getRuntime().exec(...) style remote code execution?
    options:
      - "Wrap the evaluation in a try/catch for SpelEvaluationException and log failures"
      - "Use a StandardEvaluationContext but set a low maxExpressionLength"
      - "Evaluate against a SimpleEvaluationContext, which disables T() type references, constructors, and bean references entirely"
      - "Enable SpelCompilerMode.IMMEDIATE so malicious expressions fail to compile"
    answer: 2
    explanation: |
      SimpleEvaluationContext deliberately excludes type references (T()), constructor invocation
      (new), and bean references, so exec-style expressions simply do not resolve. StandardEvaluationContext
      exposes the full language; length limits and compiler mode do not remove the dangerous features.
    ref: "concepts.md#evaluation-contexts-security-and-property-accessors"

  - id: spel-and-value-048
    difficulty: advanced
    tags: [spel, compiler, side-effects]
    question: |
      Why does Spring provide SpelCompilerMode.IMMEDIATE in addition to MIXED, given that MIXED
      silently recovers from compiled-expression failures?
    options:
      - "IMMEDIATE compiles faster because it skips the interpreted warm-up entirely"
      - "IMMEDIATE supports selection and projection while MIXED does not"
      - "MIXED can silently re-run an expression in interpreted mode after a compiled run partially executed, double-applying side effects; IMMEDIATE surfaces the failure instead"
      - "MIXED is only available in Spring 6.x, so IMMEDIATE exists for backward compatibility"
    answer: 2
    explanation: |
      For expressions with side effects, MIXED mode is dangerous: a compiled run can partially execute
      (mutating state) then fail, after which MIXED silently reverts to interpreted and may run part of
      the expression twice. IMMEDIATE propagates the exception to the caller rather than silently retrying.
    ref: "concepts.md#spel-compilation-spelcompilermode-and-performance"

  - id: spel-and-value-049
    difficulty: expert
    tags: [spel, compiler, limitations]
    question: |
      Which of these expressions can the SpEL bytecode compiler actually compile to a generated class?
    options:
      - "#{list.?[#this > 10]} (a selection that filters the collection down to matching elements)"
      - "#{@myBean.timeout} (a bean reference that reads a property off a container-managed bean)"
      - "#{payload.headers['id']} (property/index navigation on stably-typed objects)"
      - "#{list.![name]} (a projection that maps each element to one of its properties)"
    answer: 2
    explanation: |
      The compiler explicitly cannot handle selection, projection, bean references, array construction,
      overloaded operators, assignment, or expressions relying on the conversion service or custom
      accessors. Plain property/index navigation with stable types is exactly what it can compile.
    ref: "concepts.md#spel-compilation-spelcompilermode-and-performance"

  - id: spel-and-value-050
    difficulty: expert
    tags: [spel, compiler, type-stability]
    question: |
      An expression is parsed with SpelCompilerMode.IMMEDIATE. Its first evaluation returns an Integer;
      a later evaluation of the same expression would naturally return a Double. What happens?
    options:
      - "Nothing special; the compiler re-infers types on every call so both work"
      - "The compiler compiled against Integer from the first run; when the type diverges the compiled expression fails and, in IMMEDIATE mode, the caller receives the exception"
      - "SpEL automatically widens Integer to Double so the compiled form keeps working"
      - "The expression silently reverts to interpreted mode, exactly like MIXED"
    answer: 1
    explanation: |
      The compiler infers types from the first interpreted evaluation and assumes they are stable. If a
      later run yields a different type, the compiled expression fails; in IMMEDIATE mode that exception
      propagates to the caller (only MIXED silently reverts to interpreted).
    ref: "concepts.md#spel-compilation-spelcompilermode-and-performance"

  - id: spel-and-value-051
    difficulty: advanced
    tags: [value, lifecycle, postconstruct]
    question: |
      In a singleton with a field annotated @Value("${x}"), where is the field guaranteed to already
      hold its resolved value?
    options:
      - "Inside the no-arg constructor body, since fields are populated just before the constructor runs"
      - "Only after the ApplicationContext is fully refreshed and the first request arrives"
      - "Never for singletons; field @Value only works on prototypes"
      - "Inside a @PostConstruct method, but not inside the constructor"
    answer: 3
    explanation: |
      Field @Value is applied during the population phase, which runs after the constructor and before
      @PostConstruct. So the field is null in the constructor but populated by the time @PostConstruct
      executes. To have the value in the constructor, use constructor-parameter @Value.
    ref: "concepts.md#ordering-timing-and-lifecycle-of-value-resolution"

  - id: spel-and-value-052
    difficulty: advanced
    tags: [value, placeholder, static-bean, ordering]
    question: |
      Why is PropertySourcesPlaceholderConfigurer conventionally declared as a static @Bean method in
      a @Configuration class?
    options:
      - "Because BeanFactoryPostProcessors must be static to be thread-safe"
      - "Because it must be instantiated before other beans (it is a BeanFactoryPostProcessor); a non-static factory method can force the @Configuration class and its beans to initialize too early"
      - "Because static beans are exempt from the singleton scope and get a fresh instance per injection"
      - "Because @Value placeholders can only be resolved against beans that were declared with static factory methods"
    answer: 1
    explanation: |
      PropertySourcesPlaceholderConfigurer is a BeanFactoryPostProcessor and must run before the beans it
      configures. Declaring the factory method static lets the container create it without prematurely
      instantiating the enclosing @Configuration class and its other beans (which would also skip
      @Autowired/@Value processing on that config class, and Spring logs a warning).
    ref: "concepts.md#ordering-timing-and-lifecycle-of-value-resolution"

  - id: spel-and-value-053
    difficulty: expert
    tags: [value, prototype, evaluation-timing]
    question: |
      A prototype-scoped bean has @Value("#{T(java.lang.Math).random()}") double r. Two beans of this
      type are requested from the context. What is true about their r values?
    options:
      - "Both share the same value because the SpEL expression is evaluated once and cached at startup"
      - "Both are 0.0 because random() is not compilable and silently falls back to the field's default"
      - "It throws a SpelEvaluationException because the T() type operator is forbidden inside @Value expressions"
      - "Each instance gets a freshly evaluated (likely different) value, because @Value SpEL is re-evaluated for every new prototype instance"
    answer: 3
    explanation: |
      For prototype beans, @Value expressions are re-evaluated on each instance creation, so each gets a
      fresh random value. For singletons the expression is evaluated exactly once at startup. T() is fully
      allowed in the StandardEvaluationContext used for @Value.
    ref: "concepts.md#ordering-timing-and-lifecycle-of-value-resolution"

  - id: spel-and-value-054
    difficulty: advanced
    tags: [spel, safe-navigation, elvis]
    question: |
      Consider @Value("#{@userSvc.current.address.city ?: 'N/A'}") where current returns a non-null User
      but its address is null. What happens?
    options:
      - "It injects 'N/A' because the Elvis operator handles the null address"
      - "It injects null because safe navigation is implied by the Elvis operator"
      - "It throws a SpelEvaluationException on .city because Elvis only substitutes for a null final result, not for null intermediate navigation"
      - "It injects the literal unevaluated string 'address.city' because the chain after ?: is treated as text"
    answer: 2
    explanation: |
      The Elvis operator only supplies a default when the overall evaluated result is null; it does not
      guard intermediate navigation. Since address is null, accessing .city throws. You need safe
      navigation on the chain: @userSvc.current.address?.city ?: 'N/A'.
    ref: "concepts.md#failure-modes-parse-time-versus-evaluation-time-errors"

  - id: spel-and-value-055
    difficulty: advanced
    tags: [spel, selection, map]
    question: |
      A bean exposes a Map<String,Integer> scores. What type does #{@data.scores.?[value > 50]} return?
    options:
      - "A List<Integer> holding just the values that are strictly greater than 50"
      - "A List<Map.Entry<String,Integer>> of the matching entries in iteration order"
      - "A new Map<String,Integer> containing only the entries whose value exceeds 50"
      - "A Set<String> containing only the keys whose mapped value is greater than 50"
    answer: 2
    explanation: |
      Selection over a Map evaluates the expression against each Map.Entry (exposing key and value) and
      returns a NEW Map of the matching entries, not a list. Projection over a map instead returns a List.
    ref: "concepts.md#collections-arrays-selection-and-projection"

  - id: spel-and-value-056
    difficulty: expert
    tags: [spel, this, root, projection]
    question: |
      Evaluating "#root.inventions.![#root.name + ' invented ' + #this]" against an Inventor root object
      relies on which distinction between #this and #root?
    options:
      - "#this and #root are exact aliases in SpEL, so either token could be used interchangeably here with identical results"
      - "#root is the current element of the projection while #this refers to the whole collection being iterated over"
      - "#this is the current invention (varies per element) while #root stays fixed as the Inventor throughout the expression"
      - "#root is valid only inside selection expressions and not projection ones, so this whole expression fails to evaluate"
    answer: 2
    explanation: |
      Inside selection/projection, #this is the current element and changes each iteration, while #root
      always refers to the root context object of the whole expression. That lets the projection reach
      back to #root.name while transforming each #this invention.
    ref: "concepts.md#collections-arrays-selection-and-projection"

  - id: spel-and-value-057
    difficulty: advanced
    tags: [spel, string-operators]
    question: |
      What does #{'ab' * 2 + ('d' - 3)} evaluate to in SpEL?
    options:
      - "'abab' + 'a' which concatenates to 'ababa'"
      - "A SpelEvaluationException because '*' and '-' are not defined for strings"
      - "'ab2a' because 2 is appended literally"
      - "'abab1' because 'd' - 3 performs numeric subtraction of char code and yields 1"
    answer: 0
    explanation: |
      In SpEL, string '*' repeats ('ab' * 2 -> 'abab'), and '-' on a single-character string shifts the
      char code ('d' - 3 -> 'a'). Concatenation with + then produces 'ababa'.
    ref: "concepts.md#operators-ternary-and-the-elvis-operator"

  - id: spel-and-value-058
    difficulty: advanced
    tags: [spel, between, comparable]
    question: |
      What does #{1 between {5, 1}} evaluate to, and why?
    options:
      - "true, because between first sorts the two bounds into ascending order before it does the range comparison"
      - "false, because between expands to input >= 5 and input <= 1, and 1 >= 5 is false"
      - "true, because between is really a set-membership test and the value 1 is present in the set {5, 1}"
      - "It throws a SpelEvaluationException because the range endpoints {5, 1} are supplied out of ascending order"
    answer: 1
    explanation: |
      between is a shortcut for input >= low and input <= high using the operands in the given order. It
      does not reorder the bounds, so 1 between {5,1} becomes 1 >= 5 and 1 <= 1, which is false.
    ref: "concepts.md#operators-ternary-and-the-elvis-operator"

  - id: spel-and-value-059
    difficulty: expert
    tags: [spel, instanceof, boxing]
    question: |
      What are the results of #{1 instanceof T(int)} and #{1 instanceof T(Integer)} respectively?
    options:
      - "true and true, because the literal 1 stays a primitive int and instanceof also treats every int as an Integer"
      - "false and true, because the literal 1 is boxed to Integer, so it is not an instance of primitive int but is an Integer"
      - "true and false, because SpEL instanceof matches the primitive int form first and rejects the wrapper Integer form"
      - "Both throw a SpelEvaluationException because instanceof cannot be applied to a bare numeric literal in SpEL"
    answer: 1
    explanation: |
      SpEL immediately boxes primitive literals to their wrapper types. So 1 is an Integer object: it is
      NOT an instance of primitive T(int) (false) but IS an instance of T(Integer) (true).
    ref: "concepts.md#operators-ternary-and-the-elvis-operator"

  - id: spel-and-value-060
    difficulty: advanced
    tags: [spel, failure-modes, exceptions]
    question: |
      An application starts with @Value("#{@configService.getTimeout()}") but no bean named configService
      exists. When and how does this fail?
    options:
      - "At compile time, because an annotation processor validates every @Value bean reference against the known bean names"
      - "Silently at startup; the field is simply left null and the context finishes refreshing without any error"
      - "At startup during bean creation, as a BeanCreationException/BeanExpressionException wrapping a SpEL evaluation error for the unresolvable bean reference"
      - "Only later, when getTimeout() is first invoked at runtime through a lazily-created bean reference proxy"
    answer: 2
    explanation: |
      @Value SpEL is evaluated during dependency injection. The expression is syntactically valid, so it
      parses fine, but resolving @configService fails at evaluation time and surfaces as a
      BeanCreationException/BeanExpressionException at startup for the singleton.
    ref: "concepts.md#failure-modes-parse-time-versus-evaluation-time-errors"

  - id: spel-and-value-061
    difficulty: advanced
    tags: [spel, parse-vs-eval]
    question: |
      Which statement correctly distinguishes when a ParseException versus a SpelEvaluationException is
      thrown for a SpEL expression?
    options:
      - "ParseException is thrown for unknown properties and missing methods, while SpelEvaluationException is reserved for syntax errors in the raw expression text"
      - "ParseException occurs at parseExpression() for syntactically invalid expressions; SpelEvaluationException occurs at getValue() for a valid expression that fails at runtime (unknown property, missing method, conversion failure)"
      - "Both exceptions are thrown only at getValue() time; the parseExpression() phase never fails because parsing is fully deferred until evaluation"
      - "ParseException is thrown at getValue() during evaluation, while SpelEvaluationException is thrown earlier at parse time for malformed tokens"
    answer: 1
    explanation: |
      Parsing and evaluation are separate phases. Syntactic errors (unbalanced brackets, bad tokens) fail
      at parseExpression() with a ParseException; a well-formed expression that fails at runtime (unknown
      property EL1008E, method not found, conversion failure) throws SpelEvaluationException at getValue().
    ref: "concepts.md#failure-modes-parse-time-versus-evaluation-time-errors"

  - id: spel-and-value-062
    difficulty: expert
    tags: [spel, thread-safety, caching]
    question: |
      For performance, a team wants to reuse parsed SpEL across threads. Which approach is correct
      regarding thread-safety of the SpEL API?
    options:
      - "Parse once and cache the Expression; it is safe to evaluate concurrently as long as evaluation is read-only, since mutable state lives in the EvaluationContext, not the Expression"
      - "Re-parse the raw string on every thread on every call, because parsed Expression objects are single-use and cannot be reused after one getValue()"
      - "Share one StandardEvaluationContext holding a mutable root object across all threads, since EvaluationContext instances are fully internally synchronized"
      - "Confine each Expression to the exact thread that created it, because the parser binds the object to that thread's local storage"
    answer: 0
    explanation: |
      Parsing is the expensive phase, so parsed Expression objects should be cached and reused (Spring's
      BeanExpressionResolver does this). An Expression can be evaluated concurrently for read-only use;
      the mutable state that needs care (variables, root object) lives in the EvaluationContext.
    ref: "concepts.md#what-is-spring-expression-language"

  - id: spel-and-value-063
    difficulty: expert
    tags: [spel, config, maxExpressionLength, dos]
    question: |
      What is the purpose of SpelParserConfiguration's maxExpressionLength (default 10,000 chars) and
      maxOperations settings?
    options:
      - "They control how many characters of a failing expression are captured in log output for debugging and stack traces"
      - "They are guards that cap expression size and per-evaluation operation count to prevent pathological or malicious expressions from exhausting CPU/memory"
      - "They set the maximum number of distinct beans a single SpEL expression is permitted to reference by name during evaluation"
      - "They limit the total number of times a cached expression may be re-evaluated across the whole application lifetime"
    answer: 1
    explanation: |
      maxExpressionLength (default 10,000 chars, also via spring.context.expression.maxLength) and
      maxOperations (default ~10,000 per evaluation, via spring.expression.maxOperations) are resource
      guards that stop overly large or runaway expressions from consuming excessive resources.
    ref: "concepts.md#spel-compilation-spelcompilermode-and-performance"

  - id: spel-and-value-064
    difficulty: advanced
    tags: [spel, evaluation-context, property-accessor]
    question: |
      Why can SpEL resolve #{someMap.someKey} as a map lookup rather than treating someKey as a JavaBean
      property, in a context configured with a MapAccessor?
    options:
      - "SpEL hard-codes a special case for any expression whose left operand is a variable named someMap and always treats it as a map"
      - "Maps are the only Java type for which SpEL permits dot-navigation at all, so the key lookup is the only possible interpretation"
      - "The conversion service silently rewrites the parsed expression into the bracket form map['someKey'] before it is ever evaluated"
      - "The EvaluationContext holds an ordered list of PropertyAccessors; a MapAccessor placed ahead of the reflective accessor reports it can read the key from the map"
    answer: 3
    explanation: |
      An EvaluationContext consults an ordered list of PropertyAccessors until one can read the property.
      Adding a MapAccessor ahead of the ReflectivePropertyAccessor lets dot-navigation on a Map resolve as
      a key lookup. Custom PropertyAccessors similarly let SpEL navigate non-JavaBean structures.
    ref: "concepts.md#evaluation-contexts-security-and-property-accessors"

  - id: spel-and-value-065
    difficulty: advanced
    tags: [value, live-binding, refresh]
    question: |
      A plain @Value("${feature.timeout}") int timeout field needs to reflect a property value that can
      change at runtime. Which approach actually achieves that in core Spring?
    options:
      - "Nothing needed; @Value fields automatically re-resolve their placeholder whenever any underlying property source is mutated at runtime"
      - "Mark the field volatile so the placeholder resolver observes it and keeps re-pushing the current property value into it"
      - "Annotate the field with @Scheduled(fixedRate) so the container re-evaluates its placeholder on a fixed periodic interval"
      - "Inject the Environment (or an ObjectProvider) and read the property on demand each time it is needed, since a plain @Value field is resolved once at injection and never updates"
    answer: 3
    explanation: |
      @Value placeholders/SpEL are resolved once at injection time and never update afterward. To track
      runtime changes you need indirection: read from the injected Environment on demand, use an
      ObjectProvider/scoped lookup, or a mechanism like @RefreshScope (Spring Cloud, not core).
    ref: "concepts.md#ordering-timing-and-lifecycle-of-value-resolution"

  - id: spel-and-value-066
    difficulty: expert
    tags: [spel, simple-context, features-disabled]
    question: |
      Using SimpleEvaluationContext.forReadOnlyDataBinding(), which of the following expressions will
      FAIL to resolve because the feature is disabled?
    options:
      - "order.customer.name (nested property navigation)"
      - "items.?[price > 10] (collection selection is still available for property-based filters)"
      - "T(java.lang.System).currentTimeMillis() (a type reference)"
      - "status == 'ACTIVE' (a relational comparison)"
    answer: 2
    explanation: |
      SimpleEvaluationContext deliberately excludes T() type references, constructor invocation, and bean
      references. Property navigation, comparisons, and property-based selection remain available; the
      T(...) type reference does not resolve in this restricted context.
    ref: "concepts.md#evaluation-contexts-security-and-property-accessors"

  - id: spel-and-value-067
    difficulty: advanced
    tags: [spel, matches, regex, failure]
    question: |
      What does #{'5.0067' matches '^-?\\d+(\\.\\d{2})?$'} evaluate to, and what governs the result?
    options:
      - "true, because SpEL matches performs a partial find, succeeding as soon as any substring anywhere in the input matches"
      - "false, because matches requires the ENTIRE input to match the pattern and '5.0067' has three decimals"
      - "It throws a ParseException at parse time because the doubled backslashes make the regex pattern syntactically invalid"
      - "true, because SpEL strips the leading ^ and trailing $ anchors from the pattern before it applies the match"
    answer: 1
    explanation: |
      SpEL's matches uses full-match semantics (like Matcher.matches), so the whole input must match. The
      pattern allows at most two decimals, so '5.0067' fails and the result is false. An invalid pattern
      would throw a SpelEvaluationException at evaluation time, not parse time.
    ref: "concepts.md#operators-ternary-and-the-elvis-operator"

  - id: spel-and-value-068
    difficulty: expert
    tags: [spel, compiler, classloader]
    question: |
      In a plugin/modular deployment, an expression compiled with SpelCompilerMode.IMMEDIATE references a
      type only visible to a plugin's ClassLoader, but the parser was configured with the app's ClassLoader.
      What is the risk?
    options:
      - "None; the SpEL compiler always defines generated classes in the bootstrap system ClassLoader, which can see every type on every plugin path"
      - "Compiled expressions are defined in a child ClassLoader of the supplied one, which must see every type in the expression; if the plugin type is not visible, compilation/linking fails"
      - "The expression is silently rewritten to use reflective member access on the plugin type, so the ClassLoader visibility never matters"
      - "The parser eagerly copies the referenced plugin classes into the application ClassLoader so the compiled class can always link"
    answer: 1
    explanation: |
      Compiled SpEL expressions are defined in a child ClassLoader of the one you supply (or the thread
      context ClassLoader). That ClassLoader must be able to see all types referenced by the expression;
      otherwise the generated class cannot resolve them. This matters in OSGi/modular/plugin setups.
    ref: "concepts.md#spel-compilation-spelcompilermode-and-performance"

  - id: spel-and-value-069
    difficulty: advanced
    tags: [spel, power-operator, overflow]
    question: |
      What does @Value("#{(2^31) - 1}") inject into an int field?
    options:
      - "A SpelEvaluationException, because SpEL performs overflow detection on the ^ power operator and rejects results that exceed the int range"
      - "Integer.MAX_VALUE (2147483647), because ^ promotes 2^31 to a Long (2147483648) and (2^31)-1 narrows cleanly to the int max"
      - "The double 2.147483647E9, because SpEL evaluates the ^ power operator in floating point and loses integer precision"
      - "0, because 2^31 wraps around to Integer.MIN_VALUE like plain Java int math and then subtracting 1 lands back on 0"
    answer: 1
    explanation: |
      In SpEL, ^ is the power operator. Because 2^31 (2147483648) exceeds the int range, SpEL promotes it
      to a Long rather than wrapping like Java int math, so (2^31) - 1 is 2147483647L, which narrows to
      Integer.MAX_VALUE for the int field. It neither throws nor silently overflows to a negative value.
    ref: "concepts.md#operators-ternary-and-the-elvis-operator"

  - id: spel-and-value-070
    difficulty: expert
    tags: [spel, inline-list, immutability]
    question: |
      What is the difference between the SpEL inline lists {1, 2, 3} and {1, 2, someBean.value}
      regarding mutability and evaluation?
    options:
      - "Both inline lists are always rebuilt as fresh mutable ArrayLists on every single evaluation, regardless of whether their elements are literals"
      - "A purely-literal list like {1,2,3} is created once as an unmodifiable constant; a list with a non-literal element is rebuilt (and mutable) on each evaluation"
      - "Both inline lists are unmodifiable constants created once at parse time, because every SpEL inline list is always immutable by design"
      - "{1,2,3} is mutable while {1,2,someBean.value} is an unmodifiable constant, because referencing a bean freezes the list once evaluated"
    answer: 1
    explanation: |
      SpEL optimizes a list of only literals into a single unmodifiable constant list created at parse
      time. Once a non-literal element (like a property/bean reference) is present, the list must be
      reconstructed on each evaluation and is a normal mutable list.
    ref: "concepts.md#collections-arrays-selection-and-projection"

  - id: spel-and-value-071
    difficulty: advanced
    tags: [spel, safe-selection, null]
    question: |
      A bean method may return null instead of a list. Which SpEL expression safely returns null (rather
      than throwing) when the collection is null, while still filtering when it is present?
    options:
      - "@svc.getItems().?[active == true]"
      - "@svc.getItems()?.?[active == true]"
      - "@svc.getItems().?[active == true] ?: null"
      - "T(java.util.Optional).ofNullable(@svc.getItems()).?[active == true]"
    answer: 1
    explanation: |
      Safe collection selection uses ?.?[...]: when the operand collection is null it yields null instead
      of throwing, and otherwise it performs the selection. The plain .?[...] on a null operand would fail.
    ref: "concepts.md#collections-arrays-selection-and-projection"

  - id: spel-and-value-072
    difficulty: expert
    tags: [spel, conversion, generics]
    question: |
      Using SpEL to set a value: parser.parseExpression("booleanList[0]").setValue(ctx, obj, "false")
      where booleanList is a List<Boolean>. What happens and which SpEL capability makes it work?
    options:
      - "It stores the raw String 'false' directly into the list, because SpEL setValue never applies type conversion on writes"
      - "It throws a ClassCastException at write time because a String value can never be placed into a List<Boolean> slot"
      - "The generics-aware ConversionService converts the String 'false' to Boolean.FALSE before storing it"
      - "It only works if the list is declared as List<Object>, because generic element types erase the target type SpEL would convert to"
    answer: 2
    explanation: |
      SpEL's default ConversionService is generics-aware: it preserves the List<Boolean> element type and
      converts the incoming String 'false' to a Boolean before storing it. Note this reliance on the
      conversion service is one reason such expressions cannot be compiled.
    ref: "concepts.md#evaluation-contexts-security-and-property-accessors"

  - id: spel-and-value-073
    difficulty: advanced
    tags: [spel, increment, side-effects]
    question: |
      Given a writable int property counter starting at 0, evaluating "counter++ + 2" then "3 + ++counter"
      (in that order, same context/root) produces which two results?
    options:
      - "2 and 5 (postfix uses 0 then increments to 1; prefix increments 1 to 2 then adds to 3)"
      - "2 and 4 (SpEL applies both increments only after the addition, so counter stays 0 for the first line)"
      - "3 and 5 (SpEL applies both increments before the addition, so counter++ already reads 1)"
      - "It throws because ++ in SpEL requires a mutable variable rather than a writable property target"
    answer: 0
    explanation: |
      Postfix counter++ uses the current value 0 in the expression (result 2) then increments counter to
      1. Prefix ++counter then increments 1 to 2 first, so 3 + 2 = 5. SpEL supports ++/-- on writable
      properties and variables, applying standard prefix/postfix semantics.
    ref: "concepts.md#operators-ternary-and-the-elvis-operator"

  - id: spel-and-value-074
    difficulty: expert
    tags: [spel, this, root, value-context]
    question: |
      Inside a @Value SpEL expression like @Value("#{someBean.value}"), what does #root refer to, and why
      does a bare identifier resolve as a bean name?
    options:
      - "#root is the bean currently being created, so a bare identifier reads that bean's own instance fields directly"
      - "#root is the BeanExpressionContext and, since there is no user root object, a bare identifier is resolved by the bean factory acting as resolver, so someBean is looked up as a bean"
      - "#root is the Environment object, so a bare identifier is resolved as a property key looked up in the property sources"
      - "#root is always null, so a bare identifier fails to resolve at all unless it is explicitly prefixed with the @ bean marker"
    answer: 1
    explanation: |
      For @Value/bean-definition SpEL there is no user-supplied root object; the context is a
      BeanExpressionContext whose bean factory acts as a resolver, so a bare identifier like someBean is
      resolved as a bean name (equivalent to @someBean). @ is the explicit, always-correct form.
    ref: "concepts.md#value-with-spel-expressions"

  - id: spel-and-value-075
    difficulty: advanced
    tags: [spel, factory-bean, dereference]
    question: |
      A FactoryBean named dataSourceFactory produces a DataSource. In SpEL, what do #{dataSourceFactory}
      and #{&dataSourceFactory} return respectively?
    options:
      - "Both return the FactoryBean instance itself, because SpEL never triggers the getObject() product lookup"
      - "Both return the produced DataSource, because the & prefix is ignored for beans that implement FactoryBean"
      - "#{dataSourceFactory} returns the produced DataSource; #{&dataSourceFactory} returns the FactoryBean instance itself"
      - "#{dataSourceFactory} returns the FactoryBean, while #{&dataSourceFactory} throws because & is not a recognized SpEL token"
    answer: 2
    explanation: |
      Consistent with the container's dereference convention, a bare/@ bean reference returns the object
      the FactoryBean produces, while the & prefix returns the FactoryBean instance itself.
    ref: "concepts.md#referencing-beans-properties-and-methods"

  - id: spel-and-value-076
    difficulty: expert
    tags: [spel, nested-placeholder, default]
    question: |
      What does @Value("${primary.url:${fallback.url:http://localhost}}") do when primary.url is undefined
      but fallback.url is also undefined?
    options:
      - "Fails at startup, because the placeholder resolver permits only a single level of default and rejects a nested placeholder"
      - "Injects the nested default 'http://localhost', since the default of an unresolved placeholder can itself be another placeholder with its own default"
      - "Injects the literal, unresolved string '${fallback.url:http://localhost}' because the inner default is never re-processed"
      - "Injects null, because when both properties are missing the resolver abandons the default chain and yields no value"
    answer: 1
    explanation: |
      Placeholder defaults can nest: when primary.url is missing, its default ${fallback.url:http://localhost}
      is resolved, and since fallback.url is also missing, that placeholder's own default 'http://localhost'
      is used.
    ref: "concepts.md#value-with-literals-placeholders-and-defaults"

  - id: spel-and-value-077
    difficulty: advanced
    tags: [spel, elvis, empty-string, placeholder]
    question: |
      For @Value("#{'${cache.name:}' ?: 'default'}") where cache.name is undefined, what is injected, and
      what subtle point does this illustrate?
    options:
      - "'default', because the placeholder default is empty and the Elvis operator coerces an empty string to null before testing"
      - "An empty string, because the Elvis operator only replaces null (not empty string), and the placeholder resolves to ''"
      - "'default', because the Elvis operator always prefers its right-hand operand whenever the left side came from a placeholder"
      - "It throws a startup error because a placeholder default and the Elvis operator cannot be combined in one expression"
    answer: 1
    explanation: |
      The placeholder ${cache.name:} resolves to an empty string (its default), which SpEL sees as a
      non-null String. Elvis only substitutes for null, not empty string, so the empty string is injected.
      This is a common trap when mixing placeholder defaults with Elvis.
    ref: "concepts.md#operators-ternary-and-the-elvis-operator"

  - id: spel-and-value-078
    difficulty: expert
    tags: [spel, t-operator, enum, conversion]
    question: |
      Two ways to inject java.util.concurrent.TimeUnit.SECONDS: (A) @Value("#{T(java.util.concurrent.TimeUnit).SECONDS}")
      and (B) @Value("SECONDS") on a TimeUnit field. Which work and why?
    options:
      - "Only A works; a bare literal string can never be coerced into an enum without an explicitly registered converter"
      - "Both work: A is a SpEL type reference to the enum constant; B is a literal String that the ConversionService converts to the TimeUnit enum via its built-in enum converter"
      - "Only B works; the T() operator can reference plain classes but is not permitted to read enum constants"
      - "Neither works unless a custom String-to-TimeUnit converter is first registered with the ConversionService"
    answer: 1
    explanation: |
      A uses the T() type reference to read the enum constant directly. B relies on type conversion: the
      literal 'SECONDS' is converted to the TimeUnit enum by the ConversionService's built-in
      String-to-Enum converter (valueOf). Both yield TimeUnit.SECONDS.
    ref: "concepts.md#type-access-with-t-operator-and-statics"

  - id: spel-and-value-079
    difficulty: advanced
    tags: [spel, variables, this, standalone]
    question: |
      In the standalone SpEL API, how do you make a value available as #myVar inside an expression, and
      what naming constraint must you respect?
    options:
      - "Call context.setVariable('myVar', value); variable and function names share one namespace, so they must not collide"
      - "Prefix the value with @ in the expression, so no explicit registration on the EvaluationContext is required at all"
      - "Add the value to the systemProperties map, because SpEL reads all user-supplied variables exclusively from there"
      - "Variables cannot be user-defined in SpEL; only the built-in #this and #root references are ever available"
    answer: 0
    explanation: |
      User variables are registered via EvaluationContext.setVariable(name, value) and referenced with
      #name. Variables and functions share a common namespace, so their names must not overlap. #this and
      #root are always predefined in addition to any user variables.
    ref: "concepts.md#value-with-spel-expressions"

  - id: spel-and-value-080
    difficulty: expert
    tags: [spel, compiler, elvis-optional]
    question: |
      A hot-path expression uses Optional together with the Elvis operator and is configured with
      SpelCompilerMode.MIXED. What is the practical effect on compilation?
    options:
      - "It compiles normally to a generated class, because Optional together with the Elvis operator is fully supported by the bytecode compiler"
      - "The compiler cannot compile expressions using Optional with the null-safe or Elvis operator, so this expression permanently runs interpreted"
      - "MIXED mode forces immediate compilation and throws a SpelEvaluationException at the first Optional access on the hot path"
      - "The Elvis operator is silently rewritten into an equivalent ternary form so the expression always compiles cleanly"
    answer: 1
    explanation: |
      Among the compiler's documented limitations is that it cannot compile expressions using Optional
      with the null-safe or Elvis operator (alongside selection, projection, bean references, assignment,
      conversion-service reliance, etc.). Such expressions fall back to interpreted execution.
    ref: "concepts.md#spel-compilation-spelcompilermode-and-performance"

  - id: spel-and-value-081
    difficulty: advanced
    tags: [spel, first-last-match, null]
    question: |
      A bean exposes a List<Order>. What does #{@repo.orders.^[status == 'FAILED']} return when no order
      has status 'FAILED'?
    options:
      - "An empty list, because first-match .^[] returns a zero-length collection just like selection does when nothing matches"
      - "null, because first-match (.^[]) and last-match (.$[]) return null when no element matches"
      - "The first order in the list regardless of its status, since .^[] ignores the predicate and just takes the head element"
      - "A SpelEvaluationException indicating that no element matched the first-match predicate at evaluation time"
    answer: 1
    explanation: |
      The first-match operator .^[] (and last-match .$[]) returns a single element, or null when nothing
      matches. This differs from selection .?[], which returns an empty collection when nothing matches.
    ref: "concepts.md#collections-arrays-selection-and-projection"
