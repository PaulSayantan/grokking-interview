topic: "Spring Expression Language (SpEL) and @Value"
domain: spring-core
topic_slug: spel-and-value
version: 1
questions:
  - id: spel-and-value-001
    difficulty: beginner
    tags: [spel, definition]
    question: |
      What is the Spring Expression Language (SpEL)?
    options:
      - "A runtime expression language for querying and manipulating an object graph, shipped in the spring-expression module"
      - "A templating language for rendering HTML views in Spring MVC"
      - "A build-time annotation processor that generates bean definitions"
      - "A SQL dialect used only by Spring Data JPA"
    answer: 0
    explanation: |
      SpEL is a runtime expression language (in the spring-expression module) that supports
      querying and manipulating an object graph at evaluation time. It is separate from view
      rendering and from any SQL dialect.
    ref: "concepts.md#what-is-spring-expression-language"

  - id: spel-and-value-002
    difficulty: beginner
    tags: [spel, module]
    question: |
      Which statement about SpEL's relationship to the Spring IoC container is correct?
    options:
      - "SpEL can only run inside the IoC container and cannot be used standalone"
      - "SpEL is a standalone language that can be used independently but integrates deeply with the container"
      - "SpEL is only available when Spring Boot auto-configuration is enabled"
      - "SpEL replaces the IoC container entirely"
    answer: 1
    explanation: |
      The spring-expression module is standalone and can be used without the container, but it
      also integrates with the container so bean definitions and injected values can be computed
      dynamically.
    ref: "concepts.md#what-is-spring-expression-language"

  - id: spel-and-value-003
    difficulty: beginner
    tags: [spel, api]
    question: |
      In the standalone SpEL API, which type parses an expression String into an Expression object?
    options:
      - "EvaluationContext"
      - "BeanFactory"
      - "ExpressionParser (e.g. SpelExpressionParser)"
      - "PropertySourcesPlaceholderConfigurer"
    answer: 2
    explanation: |
      ExpressionParser (commonly SpelExpressionParser) parses a String into an Expression. The
      EvaluationContext supplies the root object/variables, and Expression is the parsed form.
    ref: "concepts.md#what-is-spring-expression-language"

  - id: spel-and-value-004
    difficulty: intermediate
    tags: [spel, api]
    question: |
      What does an EvaluationContext provide when a SpEL expression is evaluated?
    options:
      - "Only the raw expression string"
      - "The compiled bytecode of the application"
      - "The list of all beans that failed to initialize"
      - "The root object, variables, functions, property accessors, and type conversion support"
    answer: 3
    explanation: |
      The EvaluationContext supplies the root object, variables, functions, custom property
      accessors, a type locator, and the ConversionService used during evaluation.
    ref: "concepts.md#what-is-spring-expression-language"

  - id: spel-and-value-005
    difficulty: beginner
    tags: [placeholder, spel, key-difference]
    question: |
      What is the key difference between ${...} and #{...} in Spring?
    options:
      - "${...} looks up an external property value; #{...} evaluates a SpEL expression"
      - "They are identical and interchangeable"
      - "${...} evaluates SpEL; #{...} looks up properties"
      - "${...} is for XML only and #{...} is for annotations only"
    answer: 0
    explanation: |
      ${...} is a property placeholder resolved by PropertySourcesPlaceholderConfigurer (a lookup
      of a named property), while #{...} is a SpEL expression evaluated by the
      StandardBeanExpressionResolver.
    ref: "concepts.md#spel-expressions-versus-property-placeholders"

  - id: spel-and-value-006
    difficulty: intermediate
    tags: [placeholder, spel, order]
    question: |
      In the expression @Value("#{'${app.regions}'.split(',')}"), what happens first?
    options:
      - "The SpEL is evaluated, then the placeholder is resolved"
      - "The ${app.regions} placeholder is resolved first, then the resulting string is evaluated as SpEL"
      - "Both are resolved simultaneously by the same resolver"
      - "It fails because the two syntaxes cannot be combined"
    answer: 1
    explanation: |
      Property placeholders are resolved before SpEL is evaluated. So ${app.regions} is substituted
      into a literal string, and then SpEL calls split(',') on that string.
    ref: "concepts.md#spel-expressions-versus-property-placeholders"

  - id: spel-and-value-007
    difficulty: beginner
    tags: [placeholder, resolver]
    question: |
      Which infrastructure component resolves ${...} property placeholders?
    options:
      - "StandardBeanExpressionResolver"
      - "SpelExpressionParser"
      - "PropertySourcesPlaceholderConfigurer (working with the Environment/PropertySources)"
      - "ConversionService"
    answer: 2
    explanation: |
      ${...} placeholders are resolved by PropertySourcesPlaceholderConfigurer, which reads from the
      Environment's property sources. SpEL (#{...}) is handled by StandardBeanExpressionResolver.
    ref: "concepts.md#spel-expressions-versus-property-placeholders"

  - id: spel-and-value-008
    difficulty: intermediate
    tags: [placeholder, missing]
    question: |
      With @Value("${app.timeout}") and no property named app.timeout defined and no default given,
      what is the typical result in plain Spring?
    options:
      - "The field is silently set to null"
      - "The field is set to the literal string ${app.timeout}"
      - "The field is set to 0"
      - "Placeholder resolution fails (e.g. IllegalArgumentException: Could not resolve placeholder)"
    answer: 3
    explanation: |
      By default PropertySourcesPlaceholderConfigurer does not ignore unresolvable placeholders, so a
      missing property with no default causes a startup failure rather than a null or literal value.
    ref: "concepts.md#spel-expressions-versus-property-placeholders"

  - id: spel-and-value-009
    difficulty: intermediate
    tags: [placeholder, enable, spring-vs-boot]
    question: |
      In plain Spring Framework (not Spring Boot), how do you enable ${...} placeholder resolution?
    options:
      - "Register a PropertySourcesPlaceholderConfigurer bean (typically static) or use <context:property-placeholder>"
      - "It is always enabled with no configuration"
      - "Add @SpringBootApplication to the main class"
      - "Add a starter dependency to the classpath"
    answer: 0
    explanation: |
      Plain Spring requires you to register a PropertySourcesPlaceholderConfigurer (usually a static
      @Bean) or use <context:property-placeholder>. Automatic registration is a Spring Boot feature.
    ref: "concepts.md#spel-expressions-versus-property-placeholders"

  - id: spel-and-value-010
    difficulty: beginner
    tags: [value, literal]
    question: |
      What does @Value("42") on an int field produce?
    options:
      - "A compilation error because a String cannot be an int"
      - "The int value 42 after type conversion"
      - "The literal string \"42\" ignored because the field is int"
      - "A lookup of a property named 42"
    answer: 1
    explanation: |
      A literal @Value string is converted to the target type by the container's ConversionService,
      so "42" becomes the int 42. It is not treated as a property lookup (that would need ${...}).
    ref: "concepts.md#value-with-literals-placeholders-and-defaults"

  - id: spel-and-value-011
    difficulty: beginner
    tags: [value, default]
    question: |
      What does @Value("${db.pool.size:10}") do when the property db.pool.size is not defined?
    options:
      - "Throws an exception"
      - "Injects null"
      - "Injects the default value 10"
      - "Injects the string db.pool.size"
    answer: 2
    explanation: |
      The syntax ${key:default} supplies a default used when the property is absent, so this injects
      10 when db.pool.size is not defined.
    ref: "concepts.md#value-with-literals-placeholders-and-defaults"

  - id: spel-and-value-012
    difficulty: intermediate
    tags: [value, default, syntax]
    question: |
      In the placeholder ${feature.flags:}, what is the default value?
    options:
      - "The literal string \"null\""
      - "There is no default; it is a syntax error"
      - "A single space character"
      - "An empty string"
    answer: 3
    explanation: |
      Everything after the first colon is the default. With nothing after the colon, the default is
      an empty string.
    ref: "concepts.md#value-with-literals-placeholders-and-defaults"

  - id: spel-and-value-013
    difficulty: intermediate
    tags: [value, conversion]
    question: |
      How is a resolved @Value string converted to a non-String target type like int or boolean?
    options:
      - "Via the container's ConversionService / PropertyEditor support"
      - "It is not converted; only String fields are supported"
      - "By calling toString() on the target type"
      - "By reflection on the field's default value"
    answer: 0
    explanation: |
      The raw resolved string is converted to the target type using the container's
      ConversionService/PropertyEditor support, enabling int, boolean, arrays, List, Set, etc.
    ref: "concepts.md#value-with-literals-placeholders-and-defaults"

  - id: spel-and-value-014
    difficulty: intermediate
    tags: [value, static]
    question: |
      Can @Value inject a value into a static field?
    options:
      - "Yes, static fields are injected first"
      - "No — Spring does not inject values into static fields"
      - "Only if the field is also final"
      - "Only when using XML configuration"
    answer: 1
    explanation: |
      Spring cannot inject into static fields; @Value must be placed on instance fields, constructor
      parameters, or setter/method parameters.
    ref: "concepts.md#value-with-literals-placeholders-and-defaults"

  - id: spel-and-value-015
    difficulty: beginner
    tags: [value, constructor]
    question: |
      Which of these is a valid place to use @Value?
    options:
      - "Only on package-private fields"
      - "Only inside XML files"
      - "On fields, constructor parameters, and setter/method parameters"
      - "Only on interface methods"
    answer: 2
    explanation: |
      @Value can annotate fields, constructor parameters (preferred for immutability), and
      setter/method parameters.
    ref: "concepts.md#value-with-literals-placeholders-and-defaults"

  - id: spel-and-value-016
    difficulty: beginner
    tags: [value, spel]
    question: |
      What does @Value("#{2 * 60 * 1000}") inject into a long field?
    options:
      - "The literal string \"2 * 60 * 1000\""
      - "A property lookup failure"
      - "The number 3"
      - "120000 (the evaluated arithmetic result)"
    answer: 3
    explanation: |
      #{...} is SpEL, so the arithmetic is evaluated at injection time producing 120000.
    ref: "concepts.md#value-with-spel-expressions"

  - id: spel-and-value-017
    difficulty: intermediate
    tags: [value, spel, context]
    question: |
      In a @Value SpEL expression, what is the "root object"?
    options:
      - "There is no root object; a bare identifier like foo.bar means bean foo's property bar"
      - "The current bean being created"
      - "The Environment object"
      - "The application context itself"
    answer: 0
    explanation: |
      @Value SpEL is evaluated with no root object. A bare identifier is resolved as a bean name via
      the bean factory acting as the resolver, so foo.bar reads property bar of bean foo.
    ref: "concepts.md#value-with-spel-expressions"

  - id: spel-and-value-018
    difficulty: intermediate
    tags: [value, spel, when]
    question: |
      When is a @Value SpEL expression evaluated for a singleton bean?
    options:
      - "Continuously, as a live binding that updates when the property changes"
      - "Once, during dependency injection at bean creation time"
      - "Only when the field is first read via reflection"
      - "At compile time"
    answer: 1
    explanation: |
      SpEL in @Value is evaluated once during dependency injection (bean creation); it is not a live,
      continuously re-evaluated binding.
    ref: "concepts.md#value-with-spel-expressions"

  - id: spel-and-value-019
    difficulty: intermediate
    tags: [value, environment, spel]
    question: |
      Which predefined variables are available in the StandardEvaluationContext used for @Value SpEL?
    options:
      - "requestParams and sessionAttributes"
      - "modelAttributes and flashAttributes"
      - "systemProperties and systemEnvironment"
      - "none; SpEL has no predefined variables"
    answer: 2
    explanation: |
      The bean-expression StandardEvaluationContext exposes predefined variables including
      systemProperties and systemEnvironment, plus the bean factory and Environment.
    ref: "concepts.md#value-with-spel-expressions"

  - id: spel-and-value-020
    difficulty: beginner
    tags: [spel, bean-reference]
    question: |
      In SpEL, how do you reference a bean named myBean from the BeanFactory?
    options:
      - "#myBean"
      - "$myBean"
      - "&myBean"
      - "@myBean"
    answer: 3
    explanation: |
      @beanName references a bean from the factory (e.g. @myBean.someMethod()). &beanName returns the
      FactoryBean itself rather than the product it creates.
    ref: "concepts.md#referencing-beans-properties-and-methods"

  - id: spel-and-value-021
    difficulty: intermediate
    tags: [spel, factory-bean]
    question: |
      What does the & prefix mean in a SpEL bean reference, as in &myFactoryBean?
    options:
      - "It returns the FactoryBean instance itself rather than the object it produces"
      - "It returns the object produced by the FactoryBean"
      - "It creates a new bean instance each time"
      - "It is invalid syntax in SpEL"
    answer: 0
    explanation: |
      Consistent with the container's FactoryBean dereference convention, &beanName returns the
      FactoryBean itself, while beanName (or @beanName) returns the produced object.
    ref: "concepts.md#referencing-beans-properties-and-methods"

  - id: spel-and-value-022
    difficulty: intermediate
    tags: [spel, safe-navigation]
    question: |
      What does the safe navigation operator ?. do in person?.name when person is null?
    options:
      - "Throws a NullPointerException"
      - "Returns null instead of throwing"
      - "Returns an empty string"
      - "Skips evaluation entirely and returns the expression unparsed"
    answer: 1
    explanation: |
      The safe navigation operator ?. returns null when the target is null instead of throwing a
      NullPointerException.
    ref: "concepts.md#referencing-beans-properties-and-methods"

  - id: spel-and-value-023
    difficulty: beginner
    tags: [spel, method-invocation]
    question: |
      Which SpEL expression correctly invokes a method?
    options:
      - "'abc'->toUpperCase"
      - "toUpperCase('abc')"
      - "'abc'.toUpperCase()"
      - "'abc'::toUpperCase"
    answer: 2
    explanation: |
      SpEL uses standard dot method-invocation syntax: 'abc'.toUpperCase() returns "ABC".
    ref: "concepts.md#referencing-beans-properties-and-methods"

  - id: spel-and-value-024
    difficulty: beginner
    tags: [spel, collections, indexing]
    question: |
      In SpEL, how do you access the value stored under key 'name' in a map?
    options:
      - "map.get['name']"
      - "map->name"
      - "map.name.value"
      - "map['name'] or map[name]"
    answer: 3
    explanation: |
      SpEL indexes maps with bracket syntax: map['name'] (or map[name] when name is a variable). The
      same bracket syntax indexes lists and arrays.
    ref: "concepts.md#collections-arrays-selection-and-projection"

  - id: spel-and-value-025
    difficulty: intermediate
    tags: [spel, selection]
    question: |
      What does the SpEL selection expression list.?[#this > 10] return?
    options:
      - "A new collection containing every element greater than 10"
      - "The first element greater than 10"
      - "A boolean indicating whether any element is greater than 10"
      - "The count of elements greater than 10"
    answer: 0
    explanation: |
      Selection .?[...] filters a collection and returns a new collection of all matching elements;
      #this is the current element. First-match uses .^[] and last-match uses .$[].
    ref: "concepts.md#collections-arrays-selection-and-projection"

  - id: spel-and-value-026
    difficulty: intermediate
    tags: [spel, projection]
    question: |
      What does the SpEL projection expression members.![name] produce?
    options:
      - "The members whose name property is not null"
      - "A new collection containing the name of each member"
      - "The first member's name"
      - "A boolean for whether all members have a name"
    answer: 1
    explanation: |
      Projection .![...] transforms each element, returning a new collection — here the list of each
      member's name property.
    ref: "concepts.md#collections-arrays-selection-and-projection"

  - id: spel-and-value-027
    difficulty: intermediate
    tags: [spel, selection, first-last]
    question: |
      Which SpEL operators return the first and last matching elements of a collection, respectively?
    options:
      - ".?[] and .![]"
      - ".first[] and .last[]"
      - ".^[] and .$[]"
      - ".<[] and .>[]"
    answer: 2
    explanation: |
      .^[...] returns the first matching element and .$[...] returns the last. .?[...] is selection
      (all matches) and .![...] is projection.
    ref: "concepts.md#collections-arrays-selection-and-projection"

  - id: spel-and-value-028
    difficulty: beginner
    tags: [spel, inline-list]
    question: |
      What does the SpEL expression {1, 2, 3, 4} create?
    options:
      - "A java.util.Set"
      - "An int array only"
      - "A String"
      - "A java.util.List"
    answer: 3
    explanation: |
      Inline list syntax {..} creates a java.util.List. Inline map syntax {key: value} creates a
      java.util.Map.
    ref: "concepts.md#collections-arrays-selection-and-projection"

  - id: spel-and-value-029
    difficulty: beginner
    tags: [spel, ternary]
    question: |
      What does the ternary expression @Value("#{@config.enabled ? 'ON' : 'OFF'}") do?
    options:
      - "Injects 'ON' if config.enabled is true, otherwise 'OFF'"
      - "Always injects 'ON'"
      - "Throws if config.enabled is false"
      - "Injects the string \"@config.enabled ? 'ON' : 'OFF'\""
    answer: 0
    explanation: |
      The SpEL ternary condition ? ifTrue : ifFalse selects between two values based on the boolean
      condition, injecting 'ON' when enabled is true and 'OFF' otherwise.
    ref: "concepts.md#operators-ternary-and-the-elvis-operator"

  - id: spel-and-value-030
    difficulty: intermediate
    tags: [spel, elvis]
    question: |
      What does the Elvis operator do in #{systemProperties['app.region'] ?: 'US'}?
    options:
      - "Concatenates the region and 'US'"
      - "Uses the left value unless it is null, in which case it uses 'US'"
      - "Throws if the left value is null"
      - "Always returns 'US'"
    answer: 1
    explanation: |
      The Elvis operator ?: is null-coalescing: it returns the left operand unless it is null, in
      which case it returns the right operand ('US').
    ref: "concepts.md#operators-ternary-and-the-elvis-operator"

  - id: spel-and-value-031
    difficulty: intermediate
    tags: [spel, elvis, placeholder]
    question: |
      How does the SpEL Elvis operator ?: differ from the placeholder default syntax ${key:default}?
    options:
      - "They are the same feature with different spelling"
      - "?: only works in XML and ${key:default} only in annotations"
      - "?: is null-coalescing on an evaluated SpEL value; ${key:default} supplies a default for a missing property"
      - "${key:default} evaluates SpEL while ?: looks up properties"
    answer: 2
    explanation: |
      Though they look similar, ?: is the SpEL null-coalescing operator (handled by the expression
      engine), while ${key:default} is placeholder-default syntax (handled by the placeholder
      resolver for a missing property).
    ref: "concepts.md#operators-ternary-and-the-elvis-operator"

  - id: spel-and-value-032
    difficulty: intermediate
    tags: [spel, operators, textual]
    question: |
      Which of the following is a valid textual alias for a relational/logical operator in SpEL?
    options:
      - "grt for greater-than"
      - "AND-IF for logical AND"
      - "isGreater for greater-than"
      - "gt for greater-than and and for logical AND"
    answer: 3
    explanation: |
      SpEL provides textual aliases such as lt, gt, le, ge, eq, ne, and, or, not (handy in XML where
      < and & are awkward). 'gt' and 'and' are valid.
    ref: "concepts.md#operators-ternary-and-the-elvis-operator"

  - id: spel-and-value-033
    difficulty: beginner
    tags: [spel, operators, arithmetic]
    question: |
      Which operator computes exponentiation (power) in SpEL?
    options:
      - "^"
      - "**"
      - "pow"
      - "exp"
    answer: 0
    explanation: |
      SpEL uses ^ for the power operator (e.g. 2 ^ 3 == 8). It also supports + - * / % for the usual
      arithmetic and string concatenation with +.
    ref: "concepts.md#operators-ternary-and-the-elvis-operator"

  - id: spel-and-value-034
    difficulty: beginner
    tags: [spel, t-operator, static]
    question: |
      How do you access a static method or field in SpEL, such as Math.PI?
    options:
      - "static(java.lang.Math).PI"
      - "T(java.lang.Math).PI"
      - "@java.lang.Math.PI"
      - "class[java.lang.Math].PI"
    answer: 1
    explanation: |
      The T(...) operator returns a Class reference used to access statics, constants, and enums,
      e.g. T(java.lang.Math).PI or T(java.lang.Math).max(3, 7).
    ref: "concepts.md#type-access-with-t-operator-and-statics"

  - id: spel-and-value-035
    difficulty: intermediate
    tags: [spel, t-operator, java-lang]
    question: |
      Which of these T() references is valid without a fully qualified package name?
    options:
      - "T(Date) for java.util.Date"
      - "T(List) for java.util.List"
      - "T(Integer) for java.lang.Integer"
      - "T(TimeUnit) for java.util.concurrent.TimeUnit"
    answer: 2
    explanation: |
      Only classes in java.lang may be referenced by simple name in T(...), so T(Integer) works but
      java.util types like Date, List, and TimeUnit need their fully qualified names.
    ref: "concepts.md#type-access-with-t-operator-and-statics"

  - id: spel-and-value-036
    difficulty: intermediate
    tags: [spel, t-operator, enum]
    question: |
      How do you reference an enum constant such as TimeUnit.SECONDS in SpEL?
    options:
      - "enum(java.util.concurrent.TimeUnit.SECONDS)"
      - "@TimeUnit.SECONDS"
      - "$TimeUnit{SECONDS}"
      - "T(java.util.concurrent.TimeUnit).SECONDS"
    answer: 3
    explanation: |
      Enum constants are accessed through the T() type reference: T(java.util.concurrent.TimeUnit).SECONDS.
    ref: "concepts.md#type-access-with-t-operator-and-statics"

  - id: spel-and-value-037
    difficulty: intermediate
    tags: [spel, evaluation-context, security]
    question: |
      Which EvaluationContext is designed to restrict SpEL (disabling T(), constructors, and bean
      references) for untrusted or data-binding scenarios?
    options:
      - "SimpleEvaluationContext"
      - "StandardEvaluationContext"
      - "BeanExpressionContext"
      - "RestrictedEvaluationContext"
    answer: 0
    explanation: |
      SimpleEvaluationContext (since Spring 4.3.15) deliberately disables type references,
      constructors, and bean references. StandardEvaluationContext exposes the full language.
    ref: "concepts.md#type-access-with-t-operator-and-statics"

  - id: spel-and-value-038
    difficulty: beginner
    tags: [spel, use-cases]
    question: |
      Which of the following is a common, valid use case for SpEL in Spring?
    options:
      - "Compiling Java source files at build time"
      - "Computing a default with the Elvis operator in @Value, e.g. #{... ?: 'fallback'}"
      - "Replacing the servlet container"
      - "Defining database table schemas"
    answer: 1
    explanation: |
      Typical SpEL use cases include computed defaults (Elvis), reading from other beans or the
      environment, and transforming configured properties. It is not a compiler or schema tool.
    ref: "concepts.md#common-use-cases-and-where-spel-is-evaluated"

  - id: spel-and-value-039
    difficulty: intermediate
    tags: [spel, where-evaluated]
    question: |
      For @Value and bean definitions, which component evaluates the #{...} SpEL, and when?
    options:
      - "The servlet dispatcher, on each HTTP request"
      - "The JVM class loader, at class load time"
      - "StandardBeanExpressionResolver, during bean creation / dependency injection"
      - "The garbage collector, during collection cycles"
    answer: 2
    explanation: |
      SpEL for @Value and bean definitions is evaluated by StandardBeanExpressionResolver during bean
      creation/dependency injection (at startup for singletons).
    ref: "concepts.md#common-use-cases-and-where-spel-is-evaluated"

  - id: spel-and-value-040
    difficulty: intermediate
    tags: [spel, default-delimiters]
    question: |
      What are the default SpEL expression prefix and suffix used by the bean expression resolver?
    options:
      - "${ and }"
      - "%{ and }"
      - "<% and %>"
      - "#{ and }"
    answer: 3
    explanation: |
      The default SpEL prefix/suffix is #{ and } (configurable on the resolver). ${ } is the separate
      property-placeholder delimiter.
    ref: "concepts.md#common-use-cases-and-where-spel-is-evaluated"

  - id: spel-and-value-041
    difficulty: intermediate
    tags: [spel, annotations, use-cases]
    question: |
      In which of the following Spring features is SpEL commonly used?
    options:
      - "The condition, unless, and key attributes of caching annotations like @Cacheable"
      - "The @Override annotation from java.lang"
      - "The package-info.java file naming"
      - "The .gitignore file syntax"
    answer: 0
    explanation: |
      SpEL is used in caching annotation attributes (condition/unless/key), Spring Security
      @PreAuthorize/@PostAuthorize, Spring Data @Query, @Value, and bean definitions.
    ref: "concepts.md#common-use-cases-and-where-spel-is-evaluated"

  - id: spel-and-value-042
    difficulty: beginner
    tags: [placeholder, mnemonic, key-difference]
    question: |
      You only need to read a configured property value (no math or method calls). Which syntax is
      the simpler, more appropriate choice?
    options:
      - "#{...} SpEL"
      - "${...} property placeholder"
      - "%{...} placeholder"
      - "Either one, but SpEL is always required for properties"
    answer: 1
    explanation: |
      When you just need to read a configured property, ${...} is simpler and clearer. Reach for
      #{...} SpEL only when you must transform or compute a value or reference beans.
    ref: "concepts.md#spel-expressions-versus-property-placeholders"

  - id: spel-and-value-043
    difficulty: intermediate
    tags: [version, jakarta, framework]
    question: |
      Regarding Spring Framework 6.x (Jakarta baseline), which statement about @Value and the SpEL
      API is correct?
    options:
      - "@Value moved from javax to jakarta package in Spring 6"
      - "SpEL was removed in Spring 6 in favor of Jakarta EL"
      - "@Value and the SpEL API are Spring's own types and keep their package names across 5.x and 6.x"
      - "@Value only works with Spring Boot in version 6"
    answer: 2
    explanation: |
      The javax-to-jakarta migration in Spring 6 affected JSR-330/JSR-250 annotations, but @Value
      (org.springframework.beans.factory.annotation.Value) and the SpEL API are Spring's own types
      and keep their package names.
    ref: "concepts.md#common-use-cases-and-where-spel-is-evaluated"
