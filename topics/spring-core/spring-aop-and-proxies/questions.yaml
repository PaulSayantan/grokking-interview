topic: "Spring AOP and Proxies"
domain: spring-core
topic_slug: spring-aop-and-proxies
version: 1
questions:
  - id: spring-aop-and-proxies-001
    difficulty: beginner
    tags: [cross-cutting-concerns, aop-basics]
    question: |
      What is a "cross-cutting concern" in the context of AOP?
    options:
      - "Behaviour needed across many components but not central to any one component's core logic, such as logging or security"
      - "A concern that only applies to a single method in a single class"
      - "A compilation error caused by mixing two frameworks"
      - "A database transaction that spans multiple tables"
    answer: 0
    explanation: |
      A cross-cutting concern is functionality (logging, security, transactions, caching, metrics)
      that is required in many places across the codebase but is not the primary business
      responsibility of any single component. AOP modularizes it into an aspect.
    ref: "concepts.md#cross-cutting-concerns"

  - id: spring-aop-and-proxies-002
    difficulty: beginner
    tags: [cross-cutting-concerns, tangling-scattering]
    question: |
      When the same logging/transaction boilerplate is copied into many business methods,
      what two problems does AOP aim to eliminate?
    options:
      - "Boxing and unboxing"
      - "Deadlock and starvation"
      - "Memory leaks and stack overflows"
      - "Code tangling and code scattering"
    answer: 3
    explanation: |
      Tangling is when one method mixes business logic with unrelated concerns; scattering is when
      the same concern is duplicated across many methods/classes. AOP centralizes the concern in one
      aspect so business code stays clean.
    ref: "concepts.md#cross-cutting-concerns"

  - id: spring-aop-and-proxies-003
    difficulty: beginner
    tags: [terminology, aspect]
    question: |
      In Spring's @AspectJ style, what is an "aspect"?
    options:
      - "A module (a class annotated with @Aspect) that encapsulates a cross-cutting concern along with its advice and pointcuts"
      - "A single method execution during runtime"
      - "The proxy object created around a bean"
      - "A predicate that matches join points"
    answer: 0
    explanation: |
      An aspect is the unit of modularity for a cross-cutting concern. In Spring it is a class marked
      with @Aspect that bundles advice (the code) and pointcuts (where it applies).
    ref: "concepts.md#core-aop-terminology"

  - id: spring-aop-and-proxies-004
    difficulty: beginner
    tags: [terminology, join-point]
    question: |
      In Spring AOP, what kind of join point is supported?
    options:
      - "Field read and write"
      - "Method execution only"
      - "Constructor invocation"
      - "Exception handler blocks"
    answer: 1
    explanation: |
      Spring AOP's join point model is limited to method execution. Field access, constructor calls,
      and static initializers are only advisable with full AspectJ, not Spring AOP.
    ref: "concepts.md#core-aop-terminology"

  - id: spring-aop-and-proxies-005
    difficulty: beginner
    tags: [terminology, pointcut]
    question: |
      What is a pointcut?
    options:
      - "The action executed at a matched location"
      - "A predicate/expression that matches join points and determines where advice applies"
      - "The original object being advised"
      - "The process of linking aspects to targets"
    answer: 1
    explanation: |
      A pointcut is an expression that selects join points. Advice is bound to a pointcut and runs at
      any join point the pointcut matches. Spring uses the AspectJ pointcut expression language.
    ref: "concepts.md#core-aop-terminology"

  - id: spring-aop-and-proxies-006
    difficulty: beginner
    tags: [terminology, advice]
    question: |
      What is "advice" in AOP?
    options:
      - "The action taken by an aspect at a join point — the actual code that runs"
      - "The class that bundles cross-cutting logic"
      - "The expression that matches methods"
      - "The proxy created around the target"
    answer: 0
    explanation: |
      Advice is the code an aspect executes at a matched join point. The advice type (@Before, @After,
      @Around, etc.) determines when it runs relative to the method.
    ref: "concepts.md#core-aop-terminology"

  - id: spring-aop-and-proxies-007
    difficulty: beginner
    tags: [terminology, weaving]
    question: |
      "Weaving" refers to which activity?
    options:
      - "Compiling Java source into bytecode"
      - "Linking aspects with target objects to create the advised object"
      - "Serializing a bean to disk"
      - "Injecting dependencies into a constructor"
    answer: 1
    explanation: |
      Weaving is the process of applying aspects to targets to produce an advised object. Spring AOP
      performs this at runtime through proxies; AspectJ can weave at compile, post-compile, or load time.
    ref: "concepts.md#core-aop-terminology"

  - id: spring-aop-and-proxies-008
    difficulty: beginner
    tags: [terminology, target, proxy]
    question: |
      What is the difference between the "target object" and the "proxy" in Spring AOP?
    options:
      - "The target is the original bean with business logic; the proxy is the wrapper Spring creates to intercept calls and apply advice"
      - "They are two names for the same object"
      - "The proxy holds the business logic; the target only forwards calls"
      - "The target is used at compile time and the proxy at runtime, but they never coexist"
    answer: 0
    explanation: |
      The target is the real, unadvised bean. The proxy wraps the target: callers interact with the
      proxy, which applies advice and then delegates to the target.
    ref: "concepts.md#core-aop-terminology"

  - id: spring-aop-and-proxies-009
    difficulty: beginner
    tags: [advice-types, before]
    question: |
      When does @Before advice run relative to the advised method?
    options:
      - "After the method returns normally"
      - "Only if the method throws an exception"
      - "Before the method executes"
      - "It replaces the method entirely"
    answer: 2
    explanation: |
      @Before advice runs before the join point (the method). It cannot stop the method from running
      except by throwing an exception.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-010
    difficulty: beginner
    tags: [advice-types, after-returning]
    question: |
      @AfterReturning advice is invoked in which situation?
    options:
      - "Every time the method finishes, whether it returns or throws"
      - "Only when the method completes normally (returns without throwing)"
      - "Only when the method throws an exception"
      - "Before the method starts"
    answer: 1
    explanation: |
      @AfterReturning runs only after a normal return and can bind the returned value via the
      'returning' attribute. If the method throws, @AfterReturning does not run.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-011
    difficulty: beginner
    tags: [advice-types, after-throwing]
    question: |
      Which advice type runs only when the advised method exits by throwing an exception?
    options:
      - "@After"
      - "@AfterReturning"
      - "@AfterThrowing"
      - "@Before"
    answer: 2
    explanation: |
      @AfterThrowing runs only when the method throws, and can bind the thrown exception via the
      'throwing' attribute. It does not run on normal return.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-012
    difficulty: beginner
    tags: [advice-types, after-finally]
    question: |
      What are the semantics of @After advice?
    options:
      - "It runs before the method, like a guard"
      - "It runs only on successful return"
      - "It can prevent the method from executing"
      - "It runs after the method regardless of whether it returned normally or threw (finally semantics)"
    answer: 3
    explanation: |
      @After is a finally-style advice: it executes after the method completes for any outcome —
      normal return or exception.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-013
    difficulty: beginner
    tags: [advice-types, around]
    question: |
      Which advice type is the most powerful, able to run code before and after the method,
      prevent it from executing, and change its return value?
    options:
      - "@Before"
      - "@After"
      - "@Around"
      - "@AfterReturning"
    answer: 2
    explanation: |
      @Around surrounds the join point. It receives a ProceedingJoinPoint, can run logic before/after,
      choose whether to call proceed(), replace the return value, and handle exceptions.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-014
    difficulty: intermediate
    tags: [advice-types, around, proceeding-join-point]
    question: |
      In an @Around advice method, what happens if you forget to call proceed() on the ProceedingJoinPoint?
    options:
      - "Spring calls the target method automatically after the advice returns"
      - "A compilation error occurs"
      - "The advice is skipped and the method runs normally"
      - "The target method is never executed"
    answer: 3
    explanation: |
      In @Around advice, the target method runs only when you explicitly call proceed(). Omitting it
      means the underlying method is never invoked — a common bug when authoring around advice.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-015
    difficulty: intermediate
    tags: [advice-types, join-point-parameter]
    question: |
      Which parameter type does @Around require that the other advice types do NOT use?
    options:
      - "JoinPoint"
      - "ProceedingJoinPoint"
      - "MethodInvocation"
      - "InvocationHandler"
    answer: 1
    explanation: |
      @Around uses ProceedingJoinPoint (which adds proceed()). @Before/@After/@AfterReturning/
      @AfterThrowing can take a plain JoinPoint for introspection but cannot proceed.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-016
    difficulty: intermediate
    tags: [advice-types, capturing-values]
    question: |
      You want advice that can read the value a method returned and log it, but only when the method
      succeeds. Which annotation and attribute do you use?
    options:
      - "@After with the 'returning' attribute"
      - "@AfterReturning with the 'returning' attribute"
      - "@AfterThrowing with the 'throwing' attribute"
      - "@Before with the 'result' attribute"
    answer: 1
    explanation: |
      @AfterReturning(pointcut = "...", returning = "result") binds the returned value to the named
      parameter and runs only on normal completion.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-017
    difficulty: intermediate
    tags: [advice-types, scenario]
    question: |
      You need to implement a retry mechanism that calls the target method up to three times if it
      throws. Which advice type makes this feasible?
    options:
      - "@Before, because it runs before the method"
      - "@AfterThrowing, because it catches the exception"
      - "@Around, because it controls invocation and can call proceed() multiple times"
      - "@After, because it always runs"
    answer: 2
    explanation: |
      Only @Around controls invocation: it can call proceed() in a loop, catching exceptions between
      attempts, which is exactly what retry logic requires. Other advice types cannot re-invoke the method.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-018
    difficulty: beginner
    tags: [aspect-declaration, aspect-annotation]
    question: |
      Which annotation marks a class as an aspect in Spring's @AspectJ style?
    options:
      - "@Aspect"
      - "@Component"
      - "@Advice"
      - "@Pointcut"
    answer: 0
    explanation: |
      @Aspect (from org.aspectj.lang.annotation) marks the class as an aspect. Note it must still be a
      Spring bean (e.g., add @Component) to be picked up.
    ref: "concepts.md#aspect-declaration-and-enableaspectjautoproxy"

  - id: spring-aop-and-proxies-019
    difficulty: intermediate
    tags: [aspect-declaration, bean-registration]
    question: |
      Is annotating a class with only @Aspect enough for Spring to treat it as a working aspect?
    options:
      - "Yes, @Aspect alone registers the class as a bean and activates advice"
      - "No, @Aspect must be combined with @Transactional"
      - "No, you also need it to be a Spring bean (e.g., @Component) and you must enable auto-proxying"
      - "Yes, provided the class implements the Aspect interface"
    answer: 2
    explanation: |
      @Aspect does not by itself register a Spring bean — Spring ignores @Aspect-only classes for
      autodetection. You need @Component/@Bean plus @EnableAspectJAutoProxy (or <aop:aspectj-autoproxy/>)
      to activate proxy creation.
    ref: "concepts.md#aspect-declaration-and-enableaspectjautoproxy"

  - id: spring-aop-and-proxies-020
    difficulty: beginner
    tags: [aspect-declaration, enable-aspectj-autoproxy]
    question: |
      What does @EnableAspectJAutoProxy do?
    options:
      - "It compiles aspects into the target bytecode at build time"
      - "It disables all proxying to improve performance"
      - "It activates @AspectJ support, registering a BeanPostProcessor that creates AOP proxies for beans matched by aspects"
      - "It converts the application to use full AspectJ load-time weaving"
    answer: 2
    explanation: |
      @EnableAspectJAutoProxy registers an AnnotationAwareAspectJAutoProxyCreator (a BeanPostProcessor)
      that wraps matched beans in AOP proxies at creation time. XML equivalent: <aop:aspectj-autoproxy/>.
    ref: "concepts.md#aspect-declaration-and-enableaspectjautoproxy"

  - id: spring-aop-and-proxies-021
    difficulty: intermediate
    tags: [aspect-declaration, pointcut-annotation]
    question: |
      What is the purpose of the @Pointcut annotation on an empty method?
    options:
      - "It defines advice that runs when the method is called"
      - "It defines a named, reusable pointcut expression that advice annotations can reference by the method name"
      - "It marks the method as a join point to be advised"
      - "It disables proxying for that method"
    answer: 1
    explanation: |
      @Pointcut on an empty method gives a name to a pointcut expression so multiple advice methods can
      reference it (e.g., @Before("serviceLayer()")), keeping expressions DRY.
    ref: "concepts.md#aspect-declaration-and-enableaspectjautoproxy"

  - id: spring-aop-and-proxies-022
    difficulty: intermediate
    tags: [aspect-declaration, pointcut-designators]
    question: |
      Which pointcut designator is most commonly used to match method execution join points in Spring AOP?
    options:
      - "get(...)"
      - "handler(...)"
      - "initialization(...)"
      - "execution(...)"
    answer: 3
    explanation: |
      execution(...) matches method execution join points and is the primary designator in Spring AOP.
      Designators like get/set/handler/initialization exist in AspectJ but are not supported by Spring AOP.
    ref: "concepts.md#aspect-declaration-and-enableaspectjautoproxy"

  - id: spring-aop-and-proxies-023
    difficulty: intermediate
    tags: [aspect-declaration, annotation-pointcut]
    question: |
      Which pointcut designator matches any method that carries a specific annotation?
    options:
      - "within(...)"
      - "bean(...)"
      - "@annotation(...)"
      - "target(...)"
    answer: 2
    explanation: |
      @annotation(com.example.Audited) matches join points where the executing method is annotated with
      the given annotation — a common way to drive advice off custom annotations.
    ref: "concepts.md#aspect-declaration-and-enableaspectjautoproxy"

  - id: spring-aop-and-proxies-024
    difficulty: beginner
    tags: [proxies, jdk-dynamic-proxy]
    question: |
      A JDK dynamic proxy in Spring AOP proxies based on what?
    options:
      - "The concrete class by generating a subclass"
      - "The interfaces implemented by the target"
      - "Static methods of the target"
      - "Private fields of the target"
    answer: 1
    explanation: |
      JDK dynamic proxies (java.lang.reflect.Proxy) implement the target's interface(s). Only methods
      declared on those interfaces can be advised, and the proxy is not an instance of the concrete class.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: spring-aop-and-proxies-025
    difficulty: beginner
    tags: [proxies, cglib]
    question: |
      How does a CGLIB proxy work?
    options:
      - "It generates a runtime subclass of the target class and overrides its methods"
      - "It implements the target's interfaces at runtime"
      - "It rewrites the target's source code before compilation"
      - "It wraps the target in a Java record"
    answer: 0
    explanation: |
      CGLIB creates a dynamically generated subclass of the target and overrides methods to insert
      advice. This is why it does not require the target to implement any interface.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: spring-aop-and-proxies-026
    difficulty: intermediate
    tags: [proxies, cglib-limitations]
    question: |
      Which of the following is a limitation of CGLIB proxies that follows from its subclassing approach?
    options:
      - "It cannot proxy classes that implement interfaces"
      - "It requires all methods to be static"
      - "It cannot override final methods or proxy final classes"
      - "It can only advise a single method per class"
    answer: 2
    explanation: |
      Because CGLIB subclasses the target and overrides methods, it cannot subclass final classes or
      override final/private methods. Since Spring 4.0 it uses Objenesis, so a no-arg constructor is
      not strictly required.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: spring-aop-and-proxies-027
    difficulty: intermediate
    tags: [proxies, selection]
    question: |
      In plain Spring Framework (defaults), a bean whose target class implements an interface and
      where proxyTargetClass is left at its default will be proxied using which mechanism?
    options:
      - "A JDK dynamic proxy"
      - "CGLIB"
      - "No proxy at all"
      - "AspectJ load-time weaving"
    answer: 0
    explanation: |
      With the default proxyTargetClass=false and at least one interface present, Spring uses a JDK
      dynamic proxy. CGLIB is used only when there is no interface or when proxyTargetClass=true.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: spring-aop-and-proxies-028
    difficulty: intermediate
    tags: [proxies, selection, no-interface]
    question: |
      If a target bean implements no interfaces, which proxy will Spring AOP create?
    options:
      - "It throws an error because a proxy cannot be created"
      - "A JDK dynamic proxy"
      - "A CGLIB proxy"
      - "It uses the bean directly without any proxy"
    answer: 2
    explanation: |
      JDK dynamic proxies require an interface. With no interface available, Spring falls back to CGLIB
      (subclass) proxying — this is forced regardless of the proxyTargetClass setting.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: spring-aop-and-proxies-029
    difficulty: intermediate
    tags: [proxies, proxy-target-class]
    question: |
      How do you force Spring to always use CGLIB proxies even when interfaces are present?
    options:
      - "Set @EnableAspectJAutoProxy(proxyTargetClass = true)"
      - "Remove all interfaces from the class"
      - "Annotate each method with @ForceCglib"
      - "Set spring.aop.jdk = false in the interface"
    answer: 0
    explanation: |
      @EnableAspectJAutoProxy(proxyTargetClass = true) (or <aop:aspectj-autoproxy proxy-target-class=
      "true"/>) forces class-based CGLIB proxies for all proxied beans.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: spring-aop-and-proxies-030
    difficulty: intermediate
    tags: [proxies, injection-gotcha]
    question: |
      With JDK dynamic proxies, why can autowiring a bean by its concrete implementation class fail?
    options:
      - "Because the proxy is a subclass of the implementation"
      - "Because the JDK proxy implements the interface but is NOT an instance of the concrete class"
      - "Because JDK proxies cannot be injected at all"
      - "Because concrete classes cannot be Spring beans"
    answer: 1
    explanation: |
      A JDK dynamic proxy is an instance of the interface(s), not of the concrete implementation class.
      Autowiring by the concrete type fails; you should inject by the interface type instead.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: spring-aop-and-proxies-031
    difficulty: intermediate
    tags: [proxies, spring-vs-boot-default]
    question: |
      Which statement about proxy defaults is correct?
    options:
      - "Plain Spring Framework and Spring Boot both default to CGLIB"
      - "Plain Spring Framework defaults to JDK proxies when interfaces exist, while Spring Boot defaults to CGLIB (proxyTargetClass=true)"
      - "Both default to JDK dynamic proxies"
      - "Spring Boot never uses proxies for AOP"
    answer: 1
    explanation: |
      Plain Spring Framework prefers interface-based JDK proxies by default; Spring Boot flips the AOP
      default to CGLIB so injection by concrete type works out of the box. This is a common gotcha.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: spring-aop-and-proxies-032
    difficulty: beginner
    tags: [self-invocation, proxy-bypass]
    question: |
      Why can advice fail to run for a method call made from within the same object?
    options:
      - "Because a call via 'this' goes directly to the target and bypasses the proxy, so no advice is applied"
      - "Because internal calls are executed on a background thread"
      - "Because internal methods are automatically final"
      - "Because Spring caches the first result and skips advice"
    answer: 0
    explanation: |
      Spring AOP applies advice only when calls pass through the proxy. A self-invocation via 'this'
      hits the target directly, bypassing the proxy, so advice (transactions, caching, custom aspects)
      does not run.
    ref: "concepts.md#self-invocation-limitation"

  - id: spring-aop-and-proxies-033
    difficulty: intermediate
    tags: [self-invocation, transactional]
    question: |
      A public method outer() (no transaction) internally calls this.inner(), which is annotated
      @Transactional(REQUIRES_NEW). What happens to inner()'s transaction when outer() is invoked?
    options:
      - "A new transaction is started for inner() as declared"
      - "outer() automatically inherits inner()'s transaction settings"
      - "inner()'s @Transactional is ignored because the internal call bypasses the proxy"
      - "A runtime exception is thrown for the missing proxy"
    answer: 2
    explanation: |
      The self-invocation this.inner() does not pass through the proxy, so the transactional advice on
      inner() is silently skipped. To get a real transaction, route the call through the proxy or move
      inner() to a separate bean.
    ref: "concepts.md#self-invocation-limitation"

  - id: spring-aop-and-proxies-034
    difficulty: intermediate
    tags: [self-invocation, fixes]
    question: |
      Which of these is NOT a valid way to make advice apply to what would otherwise be a self-invocation?
    options:
      - "Move the called method into a separate bean and inject it"
      - "Inject the bean into itself and call through the injected reference"
      - "Use AopContext.currentProxy() with exposeProxy = true"
      - "Mark the internal method as private so Spring re-routes it through the proxy"
    answer: 3
    explanation: |
      Making a method private does not route calls through the proxy — private methods are never advised
      anyway. Valid fixes are extracting to another bean, self-injection, AopContext.currentProxy(), or
      using full AspectJ weaving.
    ref: "concepts.md#self-invocation-limitation"

  - id: spring-aop-and-proxies-035
    difficulty: intermediate
    tags: [self-invocation, aspectj]
    question: |
      Why does full AspectJ (compile/load-time weaving) not suffer from the self-invocation limitation?
    options:
      - "Because AspectJ disables all internal method calls"
      - "Because AspectJ runs every method on a proxy thread"
      - "Because AspectJ weaves advice into the actual bytecode, so there is no proxy to bypass"
      - "Because AspectJ only advises static methods"
    answer: 2
    explanation: |
      AspectJ modifies the target's bytecode directly, so advice is embedded in the method itself.
      There is no proxy indirection, hence internal (self) calls are advised too.
    ref: "concepts.md#self-invocation-limitation"

  - id: spring-aop-and-proxies-036
    difficulty: beginner
    tags: [spring-aop-vs-aspectj, weaving-time]
    question: |
      When does Spring AOP perform weaving, compared with AspectJ?
    options:
      - "Spring AOP weaves at compile time; AspectJ weaves at runtime"
      - "Spring AOP weaves at runtime via proxies; AspectJ can weave at compile, post-compile, or load time by modifying bytecode"
      - "Both weave only at load time"
      - "Neither performs weaving"
    answer: 1
    explanation: |
      Spring AOP is a runtime, proxy-based approach. AspectJ is a full weaver that modifies bytecode at
      compile time, post-compile, or via a load-time weaving agent.
    ref: "concepts.md#spring-aop-vs-aspectj"

  - id: spring-aop-and-proxies-037
    difficulty: intermediate
    tags: [spring-aop-vs-aspectj, capabilities]
    question: |
      Which capability does full AspectJ provide that Spring AOP does not?
    options:
      - "Using @Before and @Around annotations"
      - "Matching method execution join points"
      - "Advising constructor calls and field access, and advising non-Spring objects created with new"
      - "Using the execution(...) pointcut designator"
    answer: 2
    explanation: |
      AspectJ supports a much richer join point model (constructors, field get/set, static init, etc.)
      and can advise any object, including ones not managed by Spring. Spring AOP is limited to method
      execution on Spring beans.
    ref: "concepts.md#spring-aop-vs-aspectj"

  - id: spring-aop-and-proxies-038
    difficulty: intermediate
    tags: [spring-aop-vs-aspectj, scope]
    question: |
      Which objects can Spring AOP advise?
    options:
      - "Any Java object, including those created with new"
      - "Only classes annotated with @Aspect"
      - "Only static utility methods"
      - "Only Spring-managed beans"
    answer: 3
    explanation: |
      Because Spring AOP works by wrapping beans in proxies at container creation time, it can only
      advise Spring-managed beans. AspectJ can advise arbitrary objects, including those created with new.
    ref: "concepts.md#spring-aop-vs-aspectj"

  - id: spring-aop-and-proxies-039
    difficulty: intermediate
    tags: [spring-aop-vs-aspectj, tradeoffs]
    question: |
      Which statement best captures when to choose Spring AOP versus full AspectJ?
    options:
      - "Always use AspectJ because it is simpler to set up"
      - "Use Spring AOP only for compile-time weaving"
      - "Use Spring AOP for method-level cross-cutting on beans with zero build changes; reach for AspectJ when you need constructor/field join points, non-Spring objects, or self-invocation advising"
      - "AspectJ cannot use the same annotations as Spring AOP, so they are never interchangeable"
    answer: 2
    explanation: |
      Spring AOP covers the common method-execution cases with no extra build tooling. Full AspectJ is
      warranted for richer join points, advising non-Spring/new-created objects, or when self-invocation
      must be advised. They share annotation and pointcut syntax.
    ref: "concepts.md#spring-aop-vs-aspectj"

  - id: spring-aop-and-proxies-040
    difficulty: beginner
    tags: [spring-aop-vs-aspectj, shared-syntax]
    question: |
      Regarding pointcut expression language and advice annotations, how do Spring AOP and AspectJ relate?
    options:
      - "Spring AOP invented its own syntax that AspectJ later copied"
      - "They use completely different, incompatible annotations"
      - "AspectJ has no annotations; only Spring AOP does"
      - "Spring AOP reuses AspectJ's annotations (@Aspect, @Before, etc.) and pointcut expression language, but not AspectJ's weaver"
    answer: 3
    explanation: |
      Spring's @AspectJ style borrows AspectJ's annotations and pointcut expression language for
      familiarity, but the underlying runtime is Spring's proxy mechanism, not the AspectJ weaver.
    ref: "concepts.md#spring-aop-vs-aspectj"

  - id: spring-aop-and-proxies-041
    difficulty: intermediate
    tags: [advice-types, ordering]
    question: |
      How do you control the relative precedence between two different aspects that advise the same join point?
    options:
      - "By the alphabetical order of the aspect class names"
      - "By implementing Ordered or annotating with @Order (lower value = higher precedence)"
      - "By the order the aspects were compiled"
      - "It is random and cannot be controlled"
    answer: 1
    explanation: |
      Ordering between separate aspects is set via the Ordered interface or @Order; a lower value means
      higher precedence (runs earlier on the way in). Ordering within one aspect is determined by advice type.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-042
    difficulty: beginner
    tags: [proxies, method-visibility]
    question: |
      Can Spring AOP advise a private method?
    options:
      - "Yes, private methods are always advised"
      - "Only if the method is also static"
      - "Only when using JDK dynamic proxies"
      - "No, private methods are never advised by Spring AOP proxies"
    answer: 3
    explanation: |
      Private methods cannot be overridden or intercepted by either proxy mechanism, so Spring AOP never
      advises them. CGLIB also cannot advise final methods, and JDK proxies only see interface methods.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"
