topic: "Spring AOP and Proxies"
domain: spring-core
topic_slug: spring-aop-and-proxies
version: 1
questions:
  - id: spring-aop-and-proxies-001
    difficulty: beginner
    tags: [cross-cutting-concerns, aop-basics]
    question: |
      What is a "cross-cutting concern" in the context of AOP?
    options:
      - "Behaviour needed across many components but not central to any one component's core logic, such as logging or security"
      - "A concern that applies to exactly one method in a single class and therefore needs no special modularization"
      - "A compilation error that arises when two AOP frameworks are placed on the same classpath together"
      - "A single database transaction that atomically spans multiple tables within one relational schema"
    answer: 0
    explanation: |
      A cross-cutting concern is functionality (logging, security, transactions, caching, metrics)
      that is required in many places across the codebase but is not the primary business
      responsibility of any single component. AOP modularizes it into an aspect.
    ref: "concepts.md#cross-cutting-concerns"

  - id: spring-aop-and-proxies-002
    difficulty: beginner
    tags: [cross-cutting-concerns, tangling-scattering]
    question: |
      When the same logging/transaction boilerplate is copied into many business methods,
      what two problems does AOP aim to eliminate?
    options:
      - "Boxing and unboxing"
      - "Deadlock and starvation"
      - "Memory leaks and stack overflows"
      - "Code tangling and code scattering"
    answer: 3
    explanation: |
      Tangling is when one method mixes business logic with unrelated concerns; scattering is when
      the same concern is duplicated across many methods/classes. AOP centralizes the concern in one
      aspect so business code stays clean.
    ref: "concepts.md#cross-cutting-concerns"

  - id: spring-aop-and-proxies-003
    difficulty: beginner
    tags: [terminology, aspect]
    question: |
      In Spring's @AspectJ style, what is an "aspect"?
    options:
      - "A module (a class annotated with @Aspect) that encapsulates a cross-cutting concern along with its advice and pointcuts"
      - "A single method execution captured at runtime as one discrete point in the program's control flow"
      - "The dynamically generated proxy object that Spring wraps around a target bean at container startup"
      - "A boolean predicate expression whose sole job is to match join points where advice should apply"
    answer: 0
    explanation: |
      An aspect is the unit of modularity for a cross-cutting concern. In Spring it is a class marked
      with @Aspect that bundles advice (the code) and pointcuts (where it applies).
    ref: "concepts.md#core-aop-terminology"

  - id: spring-aop-and-proxies-004
    difficulty: beginner
    tags: [terminology, join-point]
    question: |
      In Spring AOP, what kind of join point is supported?
    options:
      - "Field read and write"
      - "Method execution only"
      - "Constructor invocation"
      - "Exception handler blocks"
    answer: 1
    explanation: |
      Spring AOP's join point model is limited to method execution. Field access, constructor calls,
      and static initializers are only advisable with full AspectJ, not Spring AOP.
    ref: "concepts.md#core-aop-terminology"

  - id: spring-aop-and-proxies-005
    difficulty: beginner
    tags: [terminology, pointcut]
    question: |
      What is a pointcut?
    options:
      - "The concrete action executed by an aspect at each matched location in the code"
      - "A predicate/expression that matches join points and determines where advice applies"
      - "The original, unwrapped object whose methods are being advised at runtime"
      - "The startup process of linking aspects to their target objects to form advised beans"
    answer: 1
    explanation: |
      A pointcut is an expression that selects join points. Advice is bound to a pointcut and runs at
      any join point the pointcut matches. Spring uses the AspectJ pointcut expression language.
    ref: "concepts.md#core-aop-terminology"

  - id: spring-aop-and-proxies-006
    difficulty: beginner
    tags: [terminology, advice]
    question: |
      What is "advice" in AOP?
    options:
      - "The action taken by an aspect at a join point — the actual code that runs"
      - "The @Aspect-annotated class that bundles all of a cross-cutting concern's logic together"
      - "The AspectJ pointcut expression that selects which methods the concern should match"
      - "The runtime proxy Spring generates and wraps around the target bean at startup time"
    answer: 0
    explanation: |
      Advice is the code an aspect executes at a matched join point. The advice type (@Before, @After,
      @Around, etc.) determines when it runs relative to the method.
    ref: "concepts.md#core-aop-terminology"

  - id: spring-aop-and-proxies-007
    difficulty: beginner
    tags: [terminology, weaving]
    question: |
      "Weaving" refers to which activity?
    options:
      - "Compiling Java source files down into JVM bytecode during the project's build phase"
      - "Linking aspects with target objects to create the advised object"
      - "Serializing a fully initialized bean to disk so it can be restored on the next startup"
      - "Injecting collaborating dependencies into a bean's constructor as the container wires it"
    answer: 1
    explanation: |
      Weaving is the process of applying aspects to targets to produce an advised object. Spring AOP
      performs this at runtime through proxies; AspectJ can weave at compile, post-compile, or load time.
    ref: "concepts.md#core-aop-terminology"

  - id: spring-aop-and-proxies-008
    difficulty: beginner
    tags: [terminology, target, proxy]
    question: |
      What is the difference between the "target object" and the "proxy" in Spring AOP?
    options:
      - "The target is the original bean with business logic; the proxy is the wrapper Spring creates to intercept calls and apply advice"
      - "They are simply two interchangeable names Spring uses for one and the same runtime object"
      - "The proxy holds all the business logic while the target merely forwards each call onward to it"
      - "The target is used at compile time and the proxy at runtime, but they never coexist"
    answer: 0
    explanation: |
      The target is the real, unadvised bean. The proxy wraps the target: callers interact with the
      proxy, which applies advice and then delegates to the target.
    ref: "concepts.md#core-aop-terminology"

  - id: spring-aop-and-proxies-009
    difficulty: beginner
    tags: [advice-types, before]
    question: |
      When does @Before advice run relative to the advised method?
    options:
      - "After the method returns normally"
      - "Only if the method throws an exception"
      - "Before the method executes"
      - "It replaces the method entirely"
    answer: 2
    explanation: |
      @Before advice runs before the join point (the method). It cannot stop the method from running
      except by throwing an exception.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-010
    difficulty: beginner
    tags: [advice-types, after-returning]
    question: |
      @AfterReturning advice is invoked in which situation?
    options:
      - "Every time the method finishes, regardless of whether it returns a value or throws an exception"
      - "Only when the method completes normally (returns without throwing)"
      - "Only when the method exits abnormally by propagating an exception up to its caller"
      - "Before the method starts, so it can inspect and veto the pending invocation"
    answer: 1
    explanation: |
      @AfterReturning runs only after a normal return and can bind the returned value via the
      'returning' attribute. If the method throws, @AfterReturning does not run.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-011
    difficulty: beginner
    tags: [advice-types, after-throwing]
    question: |
      Which advice type runs only when the advised method exits by throwing an exception?
    options:
      - "@After"
      - "@AfterReturning"
      - "@AfterThrowing"
      - "@Before"
    answer: 2
    explanation: |
      @AfterThrowing runs only when the method throws, and can bind the thrown exception via the
      'throwing' attribute. It does not run on normal return.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-012
    difficulty: beginner
    tags: [advice-types, after-finally]
    question: |
      What are the semantics of @After advice?
    options:
      - "It runs before the method executes, acting as a guard that can inspect the incoming arguments"
      - "It runs only when the method returns successfully, binding the returned value for post-processing"
      - "It can intercept and prevent the method from executing at all by short-circuiting the invocation"
      - "It runs after the method regardless of whether it returned normally or threw (finally semantics)"
    answer: 3
    explanation: |
      @After is a finally-style advice: it executes after the method completes for any outcome —
      normal return or exception.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-013
    difficulty: beginner
    tags: [advice-types, around]
    question: |
      Which advice type is the most powerful, able to run code before and after the method,
      prevent it from executing, and change its return value?
    options:
      - "@Before"
      - "@After"
      - "@Around"
      - "@AfterReturning"
    answer: 2
    explanation: |
      @Around surrounds the join point. It receives a ProceedingJoinPoint, can run logic before/after,
      choose whether to call proceed(), replace the return value, and handle exceptions.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-014
    difficulty: intermediate
    tags: [advice-types, around, proceeding-join-point]
    question: |
      In an @Around advice method, what happens if you forget to call proceed() on the ProceedingJoinPoint?
    options:
      - "Spring calls the target method automatically after the advice returns"
      - "A compilation error occurs"
      - "The advice is skipped and the method runs normally"
      - "The target method is never executed"
    answer: 3
    explanation: |
      In @Around advice, the target method runs only when you explicitly call proceed(). Omitting it
      means the underlying method is never invoked — a common bug when authoring around advice.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-015
    difficulty: intermediate
    tags: [advice-types, join-point-parameter]
    question: |
      Which parameter type does @Around require that the other advice types do NOT use?
    options:
      - "JoinPoint"
      - "ProceedingJoinPoint"
      - "MethodInvocation"
      - "InvocationHandler"
    answer: 1
    explanation: |
      @Around uses ProceedingJoinPoint (which adds proceed()). @Before/@After/@AfterReturning/
      @AfterThrowing can take a plain JoinPoint for introspection but cannot proceed.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-016
    difficulty: intermediate
    tags: [advice-types, capturing-values]
    question: |
      You want advice that can read the value a method returned and log it, but only when the method
      succeeds. Which annotation and attribute do you use?
    options:
      - "@After with the 'returning' attribute"
      - "@AfterReturning with the 'returning' attribute"
      - "@AfterThrowing with the 'throwing' attribute"
      - "@Before with the 'result' attribute"
    answer: 1
    explanation: |
      @AfterReturning(pointcut = "...", returning = "result") binds the returned value to the named
      parameter and runs only on normal completion.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-017
    difficulty: intermediate
    tags: [advice-types, scenario]
    question: |
      You need to implement a retry mechanism that calls the target method up to three times if it
      throws. Which advice type makes this feasible?
    options:
      - "@Before, because it runs before the method and can loop until the invocation finally succeeds"
      - "@AfterThrowing, because it catches the exception and then transparently re-issues the original call"
      - "@Around, because it controls invocation and can call proceed() multiple times"
      - "@After, because it always runs and can therefore keep re-triggering the method on each failure"
    answer: 2
    explanation: |
      Only @Around controls invocation: it can call proceed() in a loop, catching exceptions between
      attempts, which is exactly what retry logic requires. Other advice types cannot re-invoke the method.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-018
    difficulty: beginner
    tags: [aspect-declaration, aspect-annotation]
    question: |
      Which annotation marks a class as an aspect in Spring's @AspectJ style?
    options:
      - "@Aspect"
      - "@Component"
      - "@Advice"
      - "@Pointcut"
    answer: 0
    explanation: |
      @Aspect (from org.aspectj.lang.annotation) marks the class as an aspect. Note it must still be a
      Spring bean (e.g., add @Component) to be picked up.
    ref: "concepts.md#aspect-declaration-and-enableaspectjautoproxy"

  - id: spring-aop-and-proxies-019
    difficulty: intermediate
    tags: [aspect-declaration, bean-registration]
    question: |
      Is annotating a class with only @Aspect enough for Spring to treat it as a working aspect?
    options:
      - "Yes, @Aspect alone registers the class as a bean and activates advice"
      - "No, @Aspect only works once it is also combined with @Transactional on the class"
      - "No, you also need it to be a Spring bean (e.g., @Component) and you must enable auto-proxying"
      - "Yes, provided the class implements the org.aspectj.Aspect marker interface Spring scans for"
    answer: 2
    explanation: |
      @Aspect does not by itself register a Spring bean — Spring ignores @Aspect-only classes for
      autodetection. You need @Component/@Bean plus @EnableAspectJAutoProxy (or <aop:aspectj-autoproxy/>)
      to activate proxy creation.
    ref: "concepts.md#aspect-declaration-and-enableaspectjautoproxy"

  - id: spring-aop-and-proxies-020
    difficulty: beginner
    tags: [aspect-declaration, enable-aspectj-autoproxy]
    question: |
      What does @EnableAspectJAutoProxy do?
    options:
      - "It compiles aspects into the target bytecode at build time"
      - "It disables all AOP proxying so calls hit target beans directly to improve runtime performance"
      - "It activates @AspectJ support, registering a BeanPostProcessor that creates AOP proxies for beans matched by aspects"
      - "It converts the application to use full AspectJ load-time weaving"
    answer: 2
    explanation: |
      @EnableAspectJAutoProxy registers an AnnotationAwareAspectJAutoProxyCreator (a BeanPostProcessor)
      that wraps matched beans in AOP proxies at creation time. XML equivalent: <aop:aspectj-autoproxy/>.
    ref: "concepts.md#aspect-declaration-and-enableaspectjautoproxy"

  - id: spring-aop-and-proxies-021
    difficulty: intermediate
    tags: [aspect-declaration, pointcut-annotation]
    question: |
      What is the purpose of the @Pointcut annotation on an empty method?
    options:
      - "It defines advice whose body executes every time the annotated empty method is called at runtime"
      - "It defines a named, reusable pointcut expression that advice annotations can reference by the method name"
      - "It marks the annotated method itself as a join point that surrounding aspects should target and advise"
      - "It disables proxying for that specific method so the container invokes it directly without any advice"
    answer: 1
    explanation: |
      @Pointcut on an empty method gives a name to a pointcut expression so multiple advice methods can
      reference it (e.g., @Before("serviceLayer()")), keeping expressions DRY.
    ref: "concepts.md#aspect-declaration-and-enableaspectjautoproxy"

  - id: spring-aop-and-proxies-022
    difficulty: intermediate
    tags: [aspect-declaration, pointcut-designators]
    question: |
      Which pointcut designator is most commonly used to match method execution join points in Spring AOP?
    options:
      - "get(...)"
      - "handler(...)"
      - "initialization(...)"
      - "execution(...)"
    answer: 3
    explanation: |
      execution(...) matches method execution join points and is the primary designator in Spring AOP.
      Designators like get/set/handler/initialization exist in AspectJ but are not supported by Spring AOP.
    ref: "concepts.md#aspect-declaration-and-enableaspectjautoproxy"

  - id: spring-aop-and-proxies-023
    difficulty: intermediate
    tags: [aspect-declaration, annotation-pointcut]
    question: |
      Which pointcut designator matches any method that carries a specific annotation?
    options:
      - "within(...)"
      - "bean(...)"
      - "@annotation(...)"
      - "target(...)"
    answer: 2
    explanation: |
      @annotation(com.example.Audited) matches join points where the executing method is annotated with
      the given annotation — a common way to drive advice off custom annotations.
    ref: "concepts.md#aspect-declaration-and-enableaspectjautoproxy"

  - id: spring-aop-and-proxies-024
    difficulty: beginner
    tags: [proxies, jdk-dynamic-proxy]
    question: |
      A JDK dynamic proxy in Spring AOP proxies based on what?
    options:
      - "The concrete target class, which it proxies by generating a runtime subclass of it"
      - "The interfaces implemented by the target"
      - "The static methods declared on the target, which it re-binds through a generated dispatch table"
      - "The private fields of the target, which it intercepts on each read and write via reflection"
    answer: 1
    explanation: |
      JDK dynamic proxies (java.lang.reflect.Proxy) implement the target's interface(s). Only methods
      declared on those interfaces can be advised, and the proxy is not an instance of the concrete class.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: spring-aop-and-proxies-025
    difficulty: beginner
    tags: [proxies, cglib]
    question: |
      How does a CGLIB proxy work?
    options:
      - "It generates a runtime subclass of the target class and overrides its methods"
      - "It implements each of the target's declared interfaces with a runtime-generated handler class"
      - "It rewrites the target's Java source code to inject advice before the compiler processes it"
      - "It wraps the target inside an immutable Java record that forwards every accessor call onward"
    answer: 0
    explanation: |
      CGLIB creates a dynamically generated subclass of the target and overrides methods to insert
      advice. This is why it does not require the target to implement any interface.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: spring-aop-and-proxies-026
    difficulty: intermediate
    tags: [proxies, cglib-limitations]
    question: |
      Which of the following is a limitation of CGLIB proxies that follows from its subclassing approach?
    options:
      - "It cannot proxy any class that also happens to implement one or more interfaces"
      - "It requires every method on the target class to be declared static before it can subclass it"
      - "It cannot override final methods or proxy final classes"
      - "It can advise only a single method per class because the generated subclass overrides just one slot"
    answer: 2
    explanation: |
      Because CGLIB subclasses the target and overrides methods, it cannot subclass final classes or
      override final/private methods. Since Spring 4.0 it uses Objenesis, so a no-arg constructor is
      not strictly required.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: spring-aop-and-proxies-027
    difficulty: intermediate
    tags: [proxies, selection]
    question: |
      In plain Spring Framework (defaults), a bean whose target class implements an interface and
      where proxyTargetClass is left at its default will be proxied using which mechanism?
    options:
      - "A JDK dynamic proxy"
      - "CGLIB"
      - "No proxy at all"
      - "AspectJ load-time weaving"
    answer: 0
    explanation: |
      With the default proxyTargetClass=false and at least one interface present, Spring uses a JDK
      dynamic proxy. CGLIB is used only when there is no interface or when proxyTargetClass=true.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: spring-aop-and-proxies-028
    difficulty: intermediate
    tags: [proxies, selection, no-interface]
    question: |
      If a target bean implements no interfaces, which proxy will Spring AOP create?
    options:
      - "It throws an error because a proxy cannot be created"
      - "A JDK dynamic proxy"
      - "A CGLIB proxy"
      - "It uses the bean directly without any proxy"
    answer: 2
    explanation: |
      JDK dynamic proxies require an interface. With no interface available, Spring falls back to CGLIB
      (subclass) proxying — this is forced regardless of the proxyTargetClass setting.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: spring-aop-and-proxies-029
    difficulty: intermediate
    tags: [proxies, proxy-target-class]
    question: |
      How do you force Spring to always use CGLIB proxies even when interfaces are present?
    options:
      - "Set @EnableAspectJAutoProxy(proxyTargetClass = true)"
      - "Remove all interfaces from the class so Spring has no choice but to subclass it with CGLIB"
      - "Annotate each method that must be class-proxied with the @ForceCglib marker from the aop package"
      - "Set the property spring.aop.jdk = false in application.properties to turn off JDK proxying globally"
    answer: 0
    explanation: |
      @EnableAspectJAutoProxy(proxyTargetClass = true) (or <aop:aspectj-autoproxy proxy-target-class=
      "true"/>) forces class-based CGLIB proxies for all proxied beans.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: spring-aop-and-proxies-030
    difficulty: intermediate
    tags: [proxies, injection-gotcha]
    question: |
      With JDK dynamic proxies, why can autowiring a bean by its concrete implementation class fail?
    options:
      - "Because the JDK proxy is a generated subclass of the implementation and shadows its concrete type"
      - "Because the JDK proxy implements the interface but is NOT an instance of the concrete class"
      - "Because JDK dynamic proxies are never eligible for autowiring and must be looked up manually instead"
      - "Because a concrete implementation class annotated as a component cannot be registered as a Spring bean"
    answer: 1
    explanation: |
      A JDK dynamic proxy is an instance of the interface(s), not of the concrete implementation class.
      Autowiring by the concrete type fails; you should inject by the interface type instead.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: spring-aop-and-proxies-031
    difficulty: intermediate
    tags: [proxies, spring-vs-boot-default]
    question: |
      Which statement about proxy defaults is correct?
    options:
      - "Plain Spring Framework and Spring Boot both default to CGLIB class proxies in every scenario"
      - "Plain Spring Framework defaults to JDK proxies when interfaces exist, while Spring Boot defaults to CGLIB (proxyTargetClass=true)"
      - "Both plain Spring Framework and Spring Boot default to interface-based JDK dynamic proxies everywhere"
      - "Spring Boot never uses proxies for AOP and instead relies on compile-time AspectJ weaving by default"
    answer: 1
    explanation: |
      Plain Spring Framework prefers interface-based JDK proxies by default; Spring Boot flips the AOP
      default to CGLIB so injection by concrete type works out of the box. This is a common gotcha.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: spring-aop-and-proxies-032
    difficulty: beginner
    tags: [self-invocation, proxy-bypass]
    question: |
      Why can advice fail to run for a method call made from within the same object?
    options:
      - "Because a call via 'this' goes directly to the target and bypasses the proxy, so no advice is applied"
      - "Because internal calls are dispatched to a background thread pool where the proxy is unavailable"
      - "Because methods invoked internally are automatically promoted to final and can no longer be overridden"
      - "Because Spring caches the first invocation's result and therefore skips re-running advice on later calls"
    answer: 0
    explanation: |
      Spring AOP applies advice only when calls pass through the proxy. A self-invocation via 'this'
      hits the target directly, bypassing the proxy, so advice (transactions, caching, custom aspects)
      does not run.
    ref: "concepts.md#self-invocation-limitation"

  - id: spring-aop-and-proxies-033
    difficulty: intermediate
    tags: [self-invocation, transactional]
    question: |
      A public method outer() (no transaction) internally calls this.inner(), which is annotated
      @Transactional(REQUIRES_NEW). What happens to inner()'s transaction when outer() is invoked?
    options:
      - "A brand-new independent transaction is started for inner() exactly as its REQUIRES_NEW declares"
      - "outer() automatically inherits inner()'s transaction settings and both run in one shared transaction"
      - "inner()'s @Transactional is ignored because the internal call bypasses the proxy"
      - "A runtime exception is thrown at the call site because the required proxy for inner() is missing"
    answer: 2
    explanation: |
      The self-invocation this.inner() does not pass through the proxy, so the transactional advice on
      inner() is silently skipped. To get a real transaction, route the call through the proxy or move
      inner() to a separate bean.
    ref: "concepts.md#self-invocation-limitation"

  - id: spring-aop-and-proxies-034
    difficulty: intermediate
    tags: [self-invocation, fixes]
    question: |
      Which of these is NOT a valid way to make advice apply to what would otherwise be a self-invocation?
    options:
      - "Move the called method into a separate bean and inject it"
      - "Inject the bean into itself and call through the injected reference"
      - "Use AopContext.currentProxy() with exposeProxy = true"
      - "Mark the internal method as private so Spring re-routes it through the proxy"
    answer: 3
    explanation: |
      Making a method private does not route calls through the proxy — private methods are never advised
      anyway. Valid fixes are extracting to another bean, self-injection, AopContext.currentProxy(), or
      using full AspectJ weaving.
    ref: "concepts.md#self-invocation-limitation"

  - id: spring-aop-and-proxies-035
    difficulty: intermediate
    tags: [self-invocation, aspectj]
    question: |
      Why does full AspectJ (compile/load-time weaving) not suffer from the self-invocation limitation?
    options:
      - "Because AspectJ rewrites internal 'this' calls into external proxy calls during its weaving pass"
      - "Because AspectJ dispatches every advised method through a dedicated per-aspect proxy worker thread"
      - "Because AspectJ weaves advice into the actual bytecode, so there is no proxy to bypass"
      - "Because AspectJ only ever advises static methods, which are immune to the self-invocation problem"
    answer: 2
    explanation: |
      AspectJ modifies the target's bytecode directly, so advice is embedded in the method itself.
      There is no proxy indirection, hence internal (self) calls are advised too.
    ref: "concepts.md#self-invocation-limitation"

  - id: spring-aop-and-proxies-036
    difficulty: beginner
    tags: [spring-aop-vs-aspectj, weaving-time]
    question: |
      When does Spring AOP perform weaving, compared with AspectJ?
    options:
      - "Spring AOP weaves at compile time via a bytecode step, whereas AspectJ defers all weaving to runtime"
      - "Spring AOP weaves at runtime via proxies; AspectJ can weave at compile, post-compile, or load time by modifying bytecode"
      - "Both Spring AOP and AspectJ weave exclusively at load time using a shared JVM instrumentation agent"
      - "Neither Spring AOP nor AspectJ performs any weaving; both resolve advice purely through reflection at call time"
    answer: 1
    explanation: |
      Spring AOP is a runtime, proxy-based approach. AspectJ is a full weaver that modifies bytecode at
      compile time, post-compile, or via a load-time weaving agent.
    ref: "concepts.md#spring-aop-vs-aspectj"

  - id: spring-aop-and-proxies-037
    difficulty: intermediate
    tags: [spring-aop-vs-aspectj, capabilities]
    question: |
      Which capability does full AspectJ provide that Spring AOP does not?
    options:
      - "Using the @Before and @Around advice annotations, which Spring AOP has no way to recognize"
      - "Matching method execution join points, which lie beyond Spring AOP's proxy-based capabilities"
      - "Advising constructor calls and field access, and advising non-Spring objects created with new"
      - "Using the execution(...) pointcut designator, which Spring AOP cannot evaluate at all"
    answer: 2
    explanation: |
      AspectJ supports a much richer join point model (constructors, field get/set, static init, etc.)
      and can advise any object, including ones not managed by Spring. Spring AOP is limited to method
      execution on Spring beans.
    ref: "concepts.md#spring-aop-vs-aspectj"

  - id: spring-aop-and-proxies-038
    difficulty: intermediate
    tags: [spring-aop-vs-aspectj, scope]
    question: |
      Which objects can Spring AOP advise?
    options:
      - "Any Java object, including those created with new"
      - "Only classes annotated with @Aspect"
      - "Only static utility methods"
      - "Only Spring-managed beans"
    answer: 3
    explanation: |
      Because Spring AOP works by wrapping beans in proxies at container creation time, it can only
      advise Spring-managed beans. AspectJ can advise arbitrary objects, including those created with new.
    ref: "concepts.md#spring-aop-vs-aspectj"

  - id: spring-aop-and-proxies-039
    difficulty: intermediate
    tags: [spring-aop-vs-aspectj, tradeoffs]
    question: |
      Which statement best captures when to choose Spring AOP versus full AspectJ?
    options:
      - "Always use AspectJ because its bytecode weaver is simpler to set up, needs no extra build plugins, and runs faster than any proxy-based dispatch at every join point"
      - "Use Spring AOP only for compile-time weaving, since its proxies are generated once during the Maven build phase and then frozen into the packaged jar for runtime use"
      - "Use Spring AOP for method-level cross-cutting on beans with zero build changes; reach for AspectJ when you need constructor/field join points, non-Spring objects, or self-invocation advising"
      - "AspectJ cannot use the same annotations as Spring AOP, so the two frameworks are never interchangeable and a project must commit to exactly one of them up front"
    answer: 2
    explanation: |
      Spring AOP covers the common method-execution cases with no extra build tooling. Full AspectJ is
      warranted for richer join points, advising non-Spring/new-created objects, or when self-invocation
      must be advised. They share annotation and pointcut syntax.
    ref: "concepts.md#spring-aop-vs-aspectj"

  - id: spring-aop-and-proxies-040
    difficulty: beginner
    tags: [spring-aop-vs-aspectj, shared-syntax]
    question: |
      Regarding pointcut expression language and advice annotations, how do Spring AOP and AspectJ relate?
    options:
      - "Spring AOP invented its own pointcut syntax and annotation set, which the AspectJ project later adopted wholesale"
      - "They use completely different, mutually incompatible annotations, so a pointcut written for one will not compile under the other"
      - "AspectJ exposes no annotations at all and is purely XML-driven, whereas only Spring AOP offers the @Aspect style"
      - "Spring AOP reuses AspectJ's annotations (@Aspect, @Before, etc.) and pointcut expression language, but not AspectJ's weaver"
    answer: 3
    explanation: |
      Spring's @AspectJ style borrows AspectJ's annotations and pointcut expression language for
      familiarity, but the underlying runtime is Spring's proxy mechanism, not the AspectJ weaver.
    ref: "concepts.md#spring-aop-vs-aspectj"

  - id: spring-aop-and-proxies-041
    difficulty: intermediate
    tags: [advice-types, ordering]
    question: |
      How do you control the relative precedence between two different aspects that advise the same join point?
    options:
      - "By the alphabetical order of the aspect class names, which Spring sorts before building the chain"
      - "By implementing Ordered or annotating with @Order (lower value = higher precedence)"
      - "By the order the aspects were compiled, since javac records declaration order into the class file"
      - "It is entirely random per run and cannot be controlled by any configuration or annotation"
    answer: 1
    explanation: |
      Ordering between separate aspects is set via the Ordered interface or @Order; a lower value means
      higher precedence (runs earlier on the way in). Ordering within one aspect is determined by advice type.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-042
    difficulty: beginner
    tags: [proxies, method-visibility]
    question: |
      Can Spring AOP advise a private method?
    options:
      - "Yes, private methods are always advised because the proxy reflectively invokes them by name"
      - "Only if the method is also declared static, letting the proxy bind it through a class-level hook"
      - "Only when using JDK dynamic proxies, which expose private members via the interface handler"
      - "No, private methods are never advised by Spring AOP proxies"
    answer: 3
    explanation: |
      Private methods cannot be overridden or intercepted by either proxy mechanism, so Spring AOP never
      advises them. CGLIB also cannot advise final methods, and JDK proxies only see interface methods.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: spring-aop-and-proxies-043
    difficulty: advanced
    tags: [advice-types, around, return-type-trap]
    question: |
      An engineer writes an @Around advice to log timing, declaring it as:
      `@Around("...") public void logTiming(ProceedingJoinPoint pjp) throws Throwable { pjp.proceed(); }`.
      The advised service method `String findName()` normally returns a non-null name, but after adding the
      aspect every caller receives null. What is the root cause?
    options:
      - "proceed() must be called exactly twice so the framework can capture and then republish the return value"
      - "The advice method is declared to return void, so Spring returns null to the caller and discards the value produced by proceed()"
      - "@Around cannot advise methods that return String; only Object-returning target methods are ever supported"
      - "The pointcut silently rebound the return value to null because the 'returning' attribute was not specified"
    answer: 1
    explanation: |
      A void @Around always returns null to the caller regardless of what proceed() yields. The advice must
      declare Object (or a matching type) and return the result of proceed(). This is a classic silent
      corruption bug for non-void targets.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-044
    difficulty: advanced
    tags: [advice-types, proceed-arguments, argument-binding]
    question: |
      You want an @Around advice to trim and normalize a String argument before the target sees it. Which
      approach actually changes the argument the target method receives?
    options:
      - "Call pjp.proceed(new Object[]{normalized}) passing the modified arguments explicitly"
      - "Mutate the args array returned by pjp.getArgs() in place; Spring re-reads it before invoking the target"
      - "Reassign the bound parameter in the advice; Spring forwards the updated local variable automatically"
      - "Annotate the parameter with @Modifying so the container substitutes the new value before invoking the target"
    answer: 0
    explanation: |
      Only the proceed(Object[]) overload substitutes arguments for the target. Calling proceed() with no
      args forwards the originals; mutating getArgs() or reassigning a local does not change what the target
      receives in Spring's proxy model.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-045
    difficulty: expert
    tags: [advice-types, argument-binding, matching]
    question: |
      An aspect declares `@AfterReturning(pointcut="execution(* com.app.Repo.load(..))", returning="r")
      public void audit(List<?> r)`. The method `load()` matches the execution pointcut but sometimes returns
      a single entity (not a List). What happens on those invocations?
    options:
      - "A ClassCastException is thrown when Spring tries to bind the non-List return value to the parameter r"
      - "The advice still runs but with r quietly set to null because the returned type did not match List"
      - "The advice is skipped for that invocation because the returning parameter's type acts as an additional match filter"
      - "Spring wraps the single returned entity in a one-element singleton List and passes that to the advice"
    answer: 2
    explanation: |
      The type of the 'returning' parameter narrows the match: @AfterReturning only fires when the actual
      returned value is assignable to that type. When load() returns a non-List, the advice simply does not
      run for that invocation — no exception, no null call.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-046
    difficulty: advanced
    tags: [advice-types, ordering, same-aspect]
    question: |
      Within a SINGLE @Aspect class, both an @Around and a @Before advice match the same join point. On the
      way IN to the method, in what order do they execute?
    options:
      - "@Before runs first, then @Around's pre-proceed code, because @Before has the highest type precedence"
      - "They run concurrently on separate threads that Spring joins before the target method executes"
      - "Ordering is undefined because both advices happen to be declared in the very same aspect class"
      - "@Around's pre-proceed code runs first, then @Before, then proceed() reaches the target"
    answer: 3
    explanation: |
      Within one aspect, precedence by advice type is @Around > @Before > @After > @AfterReturning >
      @AfterThrowing. So the @Around's code before proceed() runs first, then @Before, then the target. Only
      two advices of the SAME type in the same aspect have undefined relative order.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-047
    difficulty: expert
    tags: [advice-types, ordering, after-finally]
    question: |
      In a single aspect matching one join point where the target throws, you have an @After, an
      @AfterThrowing, and an @AfterReturning method. Which run, and in what effective order relative to each
      other?
    options:
      - "Only @AfterThrowing runs; @After and @AfterReturning are both skipped whenever the target throws"
      - "@AfterReturning then @After run in that order, and @AfterThrowing is skipped because the value was captured"
      - "@AfterThrowing runs, then @After runs (finally semantics); @AfterReturning does not run"
      - "All three run in declaration order regardless of whether the target returned normally or threw"
    answer: 2
    explanation: |
      On an exception, @AfterReturning is skipped. @AfterThrowing fires, and @After (after-finally semantics)
      is effectively invoked after it. Despite @After having higher listed type-precedence, it behaves like a
      finally block and runs after the returning/throwing advice.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-048
    difficulty: expert
    tags: [proxies, this-vs-target, pointcut-designators]
    question: |
      A pointcut uses `this(com.app.OrderServiceImpl)` to match. OrderServiceImpl implements OrderService and
      is proxied with the plain-Spring default (JDK dynamic proxy). Does the advice apply, and why?
    options:
      - "No — this() matches the PROXY's type, and a JDK proxy is not an instance of OrderServiceImpl (only of the interface)"
      - "Yes — the target is an OrderServiceImpl, and this() always resolves to the underlying target's concrete type"
      - "Yes — this() and target() are exact aliases in Spring AOP and both test the same runtime object"
      - "No — this() is not a supported pointcut designator in Spring AOP and is silently ignored at match time"
    answer: 0
    explanation: |
      this() matches on the proxy object's runtime type. A JDK dynamic proxy implements the interface but is
      NOT an instance of the concrete class, so this(OrderServiceImpl) fails to match. Using target(OrderServiceImpl)
      would match because it tests the target instance.
    ref: "concepts.md#advisor-chain-methodinterceptor-and-matching"

  - id: spring-aop-and-proxies-049
    difficulty: advanced
    tags: [proxies, aoputils, target-class]
    question: |
      A bean is CGLIB-proxied. You call `advisedBean.getClass().getName()` for logging. What do you observe,
      and how should you recover the real business class?
    options:
      - "You get the original business class name unchanged, so no special unwrapping handling is ever needed"
      - "getClass() throws a NoClassDefFoundError because the generated proxy carries no class metadata at all"
      - "You get 'java.lang.reflect.Proxy'; call Proxy.getInvocationHandler() on it to unwrap the real target"
      - "You get a generated name like MyService$$SpringCGLIB$$0; use AopProxyUtils.ultimateTargetClass(bean) to get the real class"
    answer: 3
    explanation: |
      A CGLIB proxy is a generated subclass, so getClass() returns a synthetic name (e.g. $$SpringCGLIB$$).
      AopProxyUtils.ultimateTargetClass() (and AopUtils.isCglibProxy/isAopProxy) let you introspect the real
      target class behind the proxy.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: spring-aop-and-proxies-050
    difficulty: expert
    tags: [proxies, cglib, fields, objenesis]
    question: |
      A CGLIB-proxied bean has a public field `count` that its own constructor sets to 10. External code reads
      `proxy.count` directly (not via a getter). What value is most likely observed and why?
    options:
      - "10, because CGLIB eagerly copies every field value from the target into the proxy subclass at wrap time, keeping the two instances perfectly in sync for direct reads"
      - "A NullPointerException, because direct field access on a proxy is intercepted by the advisor chain and rejected unless it is routed through a matching getter method"
      - "0/default, because the proxy subclass is instantiated via Objenesis without running the constructor, so its own field is uninitialized while the state lives on the target"
      - "10, because public field reads are advised and intercepted by the proxy at runtime in exactly the same way that ordinary method invocations are dispatched"
    answer: 2
    explanation: |
      Proxies intercept methods, not fields. The CGLIB subclass is created via Objenesis, bypassing the
      constructor, so its own copy of 'count' stays at the default. Real state lives on the (separately wired)
      target; direct field reads on the proxy see uninitialized values. Always expose state via methods.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: spring-aop-and-proxies-051
    difficulty: advanced
    tags: [self-invocation, async, threading]
    question: |
      A bean's method `public void schedule()` internally calls `this.runJob()`, where runJob() is annotated
      @Async. Callers report the job runs on the request thread and blocks, not in the background. Why?
    options:
      - "The self-invocation this.runJob() bypasses the proxy, so the async advice never applies and the method runs synchronously on the caller's thread"
      - "@Async requires a return type of Future or CompletableFuture; void-returning @Async methods always run synchronously"
      - "The task executor pool was exhausted, so Spring quietly fell back to running the job on the caller's thread"
      - "@Async cannot be combined with any other advised bean method declared in the same class as the caller"
    answer: 0
    explanation: |
      Because the call is a self-invocation via 'this', it does not pass through the proxy, so the @Async
      interceptor never runs. The method executes synchronously on the caller's thread. Fix by moving runJob()
      to another bean or invoking through a proxy reference.
    ref: "concepts.md#self-invocation-limitation"

  - id: spring-aop-and-proxies-052
    difficulty: expert
    tags: [self-invocation, aopcontext, expose-proxy]
    question: |
      Code calls `((OrderService) AopContext.currentProxy()).inner()` to defeat self-invocation, but at runtime
      it throws IllegalStateException: "Cannot find current proxy". What is the fix?
    options:
      - "Add @Transactional to inner() so that a wrapping proxy is finally created and registered for the call"
      - "Switch the container from CGLIB to JDK dynamic proxies so the thread-local proxy holder is populated"
      - "Call AopContext.currentProxy() from a @PostConstruct method instead of from the business method"
      - "Enable exposeProxy, e.g. @EnableAspectJAutoProxy(exposeProxy = true), so the proxy is bound to the thread-local"
    answer: 3
    explanation: |
      AopContext.currentProxy() reads a ThreadLocal that is only populated when exposeProxy is enabled. Without
      @EnableAspectJAutoProxy(exposeProxy = true) (or the XML equivalent), the proxy is not exposed and the call
      throws. Note this adds a small per-call ThreadLocal cost.
    ref: "concepts.md#self-invocation-limitation"

  - id: spring-aop-and-proxies-053
    difficulty: expert
    tags: [self-invocation, constructor, lifecycle]
    question: |
      A @Transactional method `refresh()` is invoked from inside the bean's own constructor. No transaction is
      started. Beyond the usual "this-call bypasses the proxy" reasoning, what is the more fundamental cause?
    options:
      - "Constructors are forbidden from participating in any transaction by explicit Java Language Specification rules that reserve transactional scope for post-construction method calls only"
      - "The PlatformTransactionManager bean is only initialized after every other bean's constructor has finished running, so at this point it is still null and cannot begin a transaction"
      - "At construction time the AOP proxy does not exist yet — it is created by a BeanPostProcessor after the bean is fully initialized — so there is no proxy to route through at all"
      - "@Transactional is read only at compile time by an annotation processor, and that processor deliberately excludes constructor bodies from the set of woven, transaction-managed methods"
    answer: 2
    explanation: |
      The auto-proxy creator wraps the bean in postProcessAfterInitialization, AFTER construction and
      initialization complete. During the constructor the proxy simply does not exist, so any advised call
      (self or otherwise) cannot be intercepted. The same applies to @PostConstruct/afterPropertiesSet.
    ref: "concepts.md#proxy-creation-internals-and-bean-post-processing"

  - id: spring-aop-and-proxies-054
    difficulty: advanced
    tags: [proxy-creation, bean-post-processor, timing]
    question: |
      At which point in a normally-created singleton bean's lifecycle does the AOP auto-proxy creator wrap it
      in a proxy?
    options:
      - "In postProcessAfterInitialization, after the target is instantiated, populated, and its init callbacks have run"
      - "During instantiation in postProcessBeforeInstantiation, well before any dependencies are injected into the bean"
      - "Lazily, on the first external method call, when the auto-proxy creator builds the proxy just in time"
      - "At context refresh, before any singleton bean is instantiated, so the proxy is ready ahead of wiring"
    answer: 0
    explanation: |
      AbstractAutoProxyCreator is a BeanPostProcessor that wraps the fully initialized target in
      postProcessAfterInitialization. This ordering is exactly why constructor- and init-callback-time internal
      calls run on the raw target and are not advised.
    ref: "concepts.md#proxy-creation-internals-and-bean-post-processing"

  - id: spring-aop-and-proxies-055
    difficulty: expert
    tags: [proxy-creation, circular-dependency, early-reference]
    question: |
      Two singleton beans A and B form a circular dependency, and A must be AOP-proxied. How does Spring
      generally still inject the correct (proxied) A into B?
    options:
      - "It fails immediately with a BeanCurrentlyInCreationException, since Spring treats circular dependencies among AOP-proxied singletons as strictly unresolvable"
      - "It injects the raw unproxied target into B first, then transparently swaps that reference for the finished proxy once the application context finishes refreshing"
      - "It builds two entirely separate proxy instances for A, one dedicated to B's injection point and another for direct container lookups, and keeps them in sync"
      - "It exposes an early bean reference (via getEarlyBeanReference on the auto-proxy creator) so the proxy is created early and B receives the proxy, not the raw target"
    answer: 3
    explanation: |
      For circular singletons, Spring's three-level cache lets a SmartInstantiationAwareBeanPostProcessor
      supply an early reference via getEarlyBeanReference, letting the auto-proxy creator build the proxy early
      so B is wired with the proxy. If early exposure is inconsistent, Spring raises an error rather than inject
      a raw target where a proxy is expected.
    ref: "concepts.md#proxy-creation-internals-and-bean-post-processing"

  - id: spring-aop-and-proxies-056
    difficulty: expert
    tags: [ordering, transactional, custom-aspect]
    question: |
      You have a custom @Aspect that must run BEFORE the transaction begins (e.g., to set a tenant context that
      the transaction's connection must see). By default your aspect seems to run inside the transaction. How do
      you correctly force it outside?
    options:
      - "Move the aspect logic into a @PostConstruct method so it executes once during bean initialization, well before any transactional method is ever invoked"
      - "Give your aspect a lower @Order value than the transaction advisor so it has higher precedence and runs first on the way in"
      - "Set proxyTargetClass=true, since forcing CGLIB class proxies causes Spring to evaluate custom aspects ahead of the built-in transaction advisor"
      - "Annotate the aspect with @Primary so the container promotes it to the front of the interceptor chain ahead of the transaction manager"
    answer: 1
    explanation: |
      @Transactional, @Cacheable, @Async and custom aspects are all advisors in one interceptor chain ordered
      by precedence. The transaction advisor sits at a low precedence (near LOWEST_PRECEDENCE) by default, so
      giving your aspect a lower @Order value (higher precedence) makes it run before the transaction is opened.
    ref: "concepts.md#proxy-creation-internals-and-bean-post-processing"

  - id: spring-aop-and-proxies-057
    difficulty: advanced
    tags: [aspect-thread-safety, singleton, state]
    question: |
      An @Aspect @Component keeps a non-synchronized `private int callCount` field that it increments in advice
      to "count calls". Under concurrent load the count is wrong. What is the fundamental issue?
    options:
      - "The aspect bean is a singleton shared across all threads, so a plain int field is a shared mutable variable subject to race conditions"
      - "Spring instantiates a fresh aspect object for every calling thread, so the per-thread counts are never aggregated back into a single shared total"
      - "Advice methods are stateless by contract and are forbidden from reading or maintaining any instance field between invocations"
      - "The generated proxy defensively resets every aspect field back to zero before each intercepted call, discarding the previously accumulated count"
    answer: 0
    explanation: |
      Aspects are singletons by default; one instance serves all threads. Mutable fields are shared state and
      need atomicity (e.g. AtomicInteger/LongAdder) or other synchronization. Per-invocation state should live
      on the stack, not on the aspect.
    ref: "concepts.md#thread-safety-and-performance"

  - id: spring-aop-and-proxies-058
    difficulty: expert
    tags: [pointcut-performance, static-vs-dynamic-matching]
    question: |
      Which pointcut is evaluated on EVERY invocation (runtime/dynamic matching) rather than matched once and
      cached (static matching)?
    options:
      - "execution(* com.app.service.*.*(..))"
      - "within(com.app.service..*)"
      - "execution(* com.app.Svc.pay(..)) && args(amount) where amount is a bound, typed runtime parameter"
      - "@within(com.app.Auditable)"
    answer: 2
    explanation: |
      Pointcuts based purely on method/type structure (execution, within, @within, @annotation) are static and
      cached. Runtime-binding designators like args()/this()/target() that check the actual argument/object at
      call time require per-invocation evaluation, which is costlier on hot paths.
    ref: "concepts.md#advisor-chain-methodinterceptor-and-matching"

  - id: spring-aop-and-proxies-059
    difficulty: advanced
    tags: [pointcut-scope, startup-cost, over-proxying]
    question: |
      A team adds an aspect with pointcut `execution(* com..*(..))` for a narrow debugging purpose and later
      notices slower startup and unexpected beans becoming proxies. What best explains this?
    options:
      - "The broad pointcut forces the auto-proxy creator to test nearly every bean and wrap all matches, proxying far more beans than intended and adding startup and per-call indirection"
      - "A wildcard pointcut disables the auto-proxy creator's internal advisor-match cache entirely, forcing every bean to be re-evaluated from scratch on each access"
      - "Using the '..' wildcard inside execution() silently switches the application over to AspectJ load-time weaving, which instruments classes as the classloader loads them"
      - "A pointcut containing wildcards must be recompiled into a fresh matcher every time any bean in the context is created, adding steady per-bean overhead"
    answer: 0
    explanation: |
      An overly broad pointcut makes the auto-proxy creator evaluate advisor matches against a huge set of
      beans and proxy every match, inflating startup work and introducing needless per-call indirection. Scope
      pointcuts narrowly with within()/bean() to avoid over-proxying.
    ref: "concepts.md#advisor-chain-methodinterceptor-and-matching"

  - id: spring-aop-and-proxies-060
    difficulty: expert
    tags: [advisor-chain, method-interceptor, proceed]
    question: |
      In Spring AOP's runtime model, how are @Before/@AfterReturning advices ultimately executed relative to
      the interceptor chain built for a proxied method?
    options:
      - "They are dispatched by a separate advice scheduler that runs entirely outside the method's invocation chain and reports results back afterwards"
      - "They are inlined directly into the target's bytecode at proxy-creation time, so no interceptor indirection is involved at call time"
      - "They execute only when an @Around advice is also present on the same join point to explicitly drive the underlying proceed() call"
      - "They are adapted into MethodInterceptors placed in the chain; a ReflectiveMethodInvocation walks the chain, each interceptor calling proceed() to reach the next link and finally the target"
    answer: 3
    explanation: |
      Every advice becomes an Advisor and is adapted to an org.aopalliance MethodInterceptor. A
      ReflectiveMethodInvocation (JDK) or CGLIB equivalent walks the chain; each interceptor calls
      invocation.proceed() to advance, with before/after adapters invoking their advice at the right moment
      around the target call.
    ref: "concepts.md#advisor-chain-methodinterceptor-and-matching"

  - id: spring-aop-and-proxies-061
    difficulty: advanced
    tags: [configuration-proxy, cglib, distinction]
    question: |
      Someone claims "@Configuration classes are proxied by the AOP auto-proxy creator." Why is this incorrect,
      and what actually proxies them?
    options:
      - "@Configuration classes are treated as plain beans and are never wrapped by any proxy under any circumstances, so inter-@Bean calls simply create new instances"
      - "They are CGLIB-enhanced by the ConfigurationClassEnhancer to enforce singleton semantics across inter-@Bean method calls — a separate mechanism from the AOP AbstractAutoProxyCreator"
      - "They are JDK dynamic proxied because @Configuration is internally treated as an interface that the container implements at runtime"
      - "They are wrapped by the transaction advisor, which is what intercepts and shares the results of calls between their @Bean factory methods"
    answer: 1
    explanation: |
      @Configuration classes get a CGLIB subclass created by the ConfigurationClassEnhancer so that calling one
      @Bean method from another returns the shared singleton rather than a new instance. This is distinct from
      the AOP auto-proxy creator that applies aspects/advisors.
    ref: "concepts.md#proxy-creation-internals-and-bean-post-processing"

  - id: spring-aop-and-proxies-062
    difficulty: advanced
    tags: [proxies, injection, getbean, jdk]
    question: |
      With plain-Spring defaults (JDK proxies), a service is proxied and you call
      `context.getBean(OrderServiceImpl.class)`. What is the likely outcome?
    options:
      - "It returns the proxy successfully, because a JDK dynamic proxy is generated as a direct subclass of OrderServiceImpl and therefore matches the concrete type"
      - "It bypasses the proxy layer and returns the raw, unadvised target instance so that the caller gets the concrete OrderServiceImpl directly"
      - "It quietly constructs and returns a brand-new instance of OrderServiceImpl separate from the registered singleton to satisfy the concrete-type request"
      - "It fails to find a matching bean because the exposed proxy type is the interface, not the concrete class"
    answer: 3
    explanation: |
      Under JDK proxying the bean's exposed type is the interface; the proxy is not an instance of the concrete
      class. Requesting the bean by concrete type OrderServiceImpl fails to match. Request/inject by the
      interface type instead (or force CGLIB).
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: spring-aop-and-proxies-063
    difficulty: expert
    tags: [cglib, final-method, silent-non-advising]
    question: |
      A CGLIB-proxied @Service has ONE method marked `final` alongside several non-final methods that an
      aspect should advise. What actually happens at runtime?
    options:
      - "Spring aborts context startup with a proxy-creation exception, because the presence of any final method makes the class ineligible for CGLIB subclassing"
      - "The entire class is rejected for proxying once a final method is detected, so none of its methods — final or not — end up being advised at runtime"
      - "The proxy is still created and the non-final methods are advised, but the final method is silently NOT advised (Spring may log a warning) because CGLIB cannot override it"
      - "All methods, including the final one, are advised via a reflection fallback"
    answer: 2
    explanation: |
      CGLIB subclasses the target and overrides methods. A final method cannot be overridden, so it is simply
      left unadvised (Spring logs an info/warning) while the proxy is still created and the other methods are
      advised normally. This differs from a final *class*, which cannot be subclassed at all and therefore
      does prevent CGLIB proxying entirely.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: spring-aop-and-proxies-064
    difficulty: expert
    tags: [advice-types, around, exception-swallowing]
    question: |
      An @Around advice wraps proceed() in try/catch, logs the exception, and returns null instead of
      rethrowing. A downstream @AfterThrowing advice in a different, lower-precedence aspect never fires for
      those failures. Why?
    options:
      - "Because the higher-precedence @Around caught the exception and returned normally, the join point appears to complete successfully to the rest of the chain, so @AfterThrowing sees no throw"
      - "@AfterThrowing only ever fires for checked exceptions, so runtime exceptions caught by an @Around are outside the set of throwables it can observe"
      - "@AfterThrowing and @Around are mutually exclusive and cannot both be registered against the same join point in one interceptor chain"
      - "Spring deactivates all after-advice, including @AfterThrowing, on any join point where an @Around advice is also present"
    answer: 0
    explanation: |
      Advice runs as a chain. If a higher-precedence @Around catches the exception and returns a value, the
      invocation completes normally from the perspective of interceptors closer to the caller, so their
      @AfterThrowing never triggers (their @AfterReturning might instead). Swallowing exceptions in @Around
      changes observed outcomes for the rest of the chain.
    ref: "concepts.md#advisor-chain-methodinterceptor-and-matching"

  - id: spring-aop-and-proxies-065
    difficulty: advanced
    tags: [aspectj, ltw, self-invocation]
    question: |
      A team must have self-invoked @Transactional calls actually start transactions without restructuring the
      code. Which approach genuinely achieves this?
    options:
      - "Switch every proxy to CGLIB via proxyTargetClass=true, since class-based subclass proxies are able to intercept internal 'this' calls that JDK proxies miss"
      - "Use full AspectJ load-time (or compile-time) weaving, which weaves advice into the bytecode so internal 'this' calls are advised — no proxy to bypass"
      - "Mark the inner method as public and non-final, which lets the container re-route internal self-calls back out through the wrapping proxy"
      - "Increase the transaction timeout so that the delayed self-invoked call has enough time to acquire and open its own transactional connection"
    answer: 1
    explanation: |
      Only bytecode weaving (AspectJ CTW/LTW) removes the self-invocation limitation, because advice lives in
      the method itself rather than in a wrapping proxy. Changing proxy type or method modifiers does not help;
      the proxy is still bypassed by 'this' calls.
    ref: "concepts.md#spring-aop-vs-aspectj"

  - id: spring-aop-and-proxies-066
    difficulty: expert
    tags: [proxies, equals-hashcode, collections]
    question: |
      Two beans are placed in a HashSet: a JDK-proxied bean and, elsewhere, its raw target. Assuming default
      behavior, which statement is most accurate about Object methods on the proxy?
    options:
      - "The proxy always delegates equals/hashCode straight through to the target instance, so a proxy and its raw target are guaranteed to be treated as equal keys"
      - "Calling hashCode() on a JDK proxy throws UnsupportedOperationException, because Object methods are deliberately left unimplemented on the generated proxy class"
      - "The proxy and its target are guaranteed to share an identical hashCode, because the proxying layer copies the target's identity hash into the proxy at creation"
      - "Object methods like equals/hashCode are generally not routed through advice, and JDK proxies handle equals/hashCode with proxy-level semantics — so proxy and target need not be equal, which can surprise code using them as set/map keys"
    answer: 3
    explanation: |
      equals/hashCode/toString on proxies are generally not advised, and JDK proxies apply their own
      equals/hashCode handling at the proxy level. Treating a proxy and its target as interchangeable keys in
      hash-based collections can lead to lookups that miss.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: spring-aop-and-proxies-067
    difficulty: advanced
    tags: [advice-types, least-powerful, design]
    question: |
      A reviewer flags an aspect that uses @Around merely to record a metric after the method returns, without
      touching arguments, the return value, or invocation control. What is the correct critique?
    options:
      - "@Around is perfectly fine here and should in fact always be the default choice for metrics, since it uniformly wraps the call regardless of what the advice needs"
      - "The advice should use the least powerful form that suffices — here @AfterReturning (or @After) — because @Around invites bugs like a forgotten proceed(), wrong return type, or swallowed exceptions"
      - "Metrics that fire after a method returns can only be captured with @Before advice, since it is the sole type able to reliably read timing information"
      - "@Around must be replaced with a dedicated BeanPostProcessor, because recording metrics is an infrastructure concern that lies outside the aspect model entirely"
    answer: 1
    explanation: |
      Spring's guidance is to use the least powerful advice that meets the need. If you do not need to control
      invocation or mutate inputs/outputs, @AfterReturning/@After is safer than @Around, which can silently
      break behavior via a missing proceed(), void return type, or swallowed exception.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-068
    difficulty: expert
    tags: [ordering, same-type, undefined]
    question: |
      Two @After advice methods declared in the SAME aspect both match one join point. You need a guaranteed
      execution order between them. What does Spring's model say and what is the recommended fix?
    options:
      - "They are guaranteed to run in the exact source-declaration order in which they appear in the class file, so no additional fix is ever needed"
      - "They run strictly in alphabetical order of their method names, so renaming the two advice methods is the supported way to control which runs first"
      - "Their relative order is undefined (reflection cannot recover javac declaration order); split them into separate @Aspect classes and order those with @Order, or merge them into one advice"
      - "The second matching @After method is silently discarded, so only the first one declared in the aspect ever executes for that join point"
    answer: 2
    explanation: |
      For two advices of the same type in the same aspect, ordering is undefined because declaration order is
      not recoverable via reflection. To impose order, refactor into separate aspects (ordered via @Order/
      Ordered) or collapse them into a single advice method.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-069
    difficulty: advanced
    tags: [proxies, transactional, checked-exception-rollback]
    question: |
      This is primarily an AOP-mechanics question: a @Transactional method throws a checked IOException and the
      transaction unexpectedly commits. Ignoring rollback-rule configuration, what does this reveal about how
      Spring's transaction ADVICE decides to roll back?
    options:
      - "The proxy failed to intercept the method entirely, so no transaction was ever started and there was simply nothing for Spring to roll back"
      - "Checked exceptions are propagated outside the interceptor chain by design and therefore never reach the transaction advice's rollback decision"
      - "A self-invocation through 'this' bypassed the proxy on the way out, which forced the surrounding transaction to commit rather than roll back"
      - "The transaction interceptor (an around-style advisor) applies a default rollback rule of rolling back only on unchecked exceptions and Errors; a checked exception commits unless a rollbackFor rule says otherwise"
    answer: 3
    explanation: |
      @Transactional is implemented as an around-style advisor. Its default rollback policy rolls back on
      RuntimeException/Error and commits on checked exceptions. The commit is the advice behaving as designed,
      not a proxy failure — you would add rollbackFor to change it.
    ref: "concepts.md#advisor-chain-methodinterceptor-and-matching"

  - id: spring-aop-and-proxies-070
    difficulty: expert
    tags: [proxies, objenesis, constructor-double-invocation]
    question: |
      On a particular locked-down JVM, debug logs show a CGLIB-proxied bean's constructor running TWICE. What
      does this indicate about how the proxy was instantiated?
    options:
      - "Spring deliberately invokes each proxied bean's constructor twice as a built-in validation step to confirm the constructor is deterministic and side-effect free"
      - "The JVM could not bypass constructor invocation via Objenesis, so Spring fell back to normal instantiation, causing the constructor to run for both the proxy subclass and the target"
      - "Two distinct aspects match the bean, and each one independently generates its own CGLIB subclass, so the target constructor is invoked once per proxy"
      - "Setting proxyTargetClass=true always causes the target constructor to execute twice, once for the interface view and once for the class-based subclass"
    answer: 1
    explanation: |
      Normally Objenesis creates the CGLIB proxy without invoking the constructor, so it runs once (on the
      target). If the JVM disallows constructor bypassing, Spring falls back to standard instantiation and the
      constructor can execute twice — which Spring logs at debug level. Keep constructors side-effect-free.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: spring-aop-and-proxies-071
    difficulty: advanced
    tags: [aspect-declaration, aspect-not-advised]
    question: |
      An @Aspect @Component class also contains business-like methods that happen to match its own service-layer
      pointcut. Developers are surprised the aspect does not advise itself. Why does Spring avoid this?
    options:
      - "Aspect classes are compiled in a separate weaving pass ahead of the container and therefore can never be registered as ordinary Spring beans in the first place"
      - "Placing @Component on a class explicitly disables all proxying for it, so an @Aspect @Component can never be wrapped or advised by anything"
      - "By design, aspect beans are not themselves auto-proxied by the aspects they define, preventing infinite recursion and confusing self-advising; the auto-proxy creator skips advisor/aspect infrastructure beans"
      - "Pointcut expressions that use the execution() designator are not permitted to match methods declared inside the very aspect class that defines them"
    answer: 2
    explanation: |
      The auto-proxy creator treats aspect/advisor infrastructure beans as non-advisable (isInfrastructureClass),
      so an aspect does not get wrapped by its own advice. This avoids recursive self-advising and keeps the
      aspect's own methods free of the concern it defines.
    ref: "concepts.md#proxy-creation-internals-and-bean-post-processing"

  - id: spring-aop-and-proxies-072
    difficulty: expert
    tags: [ordering, around-nesting, multiple-aspects]
    question: |
      Aspect A (@Order(1)) and Aspect B (@Order(2)) each have an @Around advice on the same method. What is the
      execution nesting?
    options:
      - "B wraps A because a higher @Order value takes outer precedence: B-before, A-before, target, A-after, B-after, with the target reached at the innermost point"
      - "They execute sequentially as two independent chains, A completing its full before-and-after cycle first and then B doing the same, so the target actually runs twice"
      - "The relative order of @Around advices declared across two different aspects is left undefined by Spring and cannot be pinned down by @Order at all"
      - "A wraps B: A-before, B-before, target, B-after, A-after (A has higher precedence, runs outermost on the way in and last on the way out)"
    answer: 3
    explanation: |
      Lower @Order value = higher precedence = outermost on entry. So A (order 1) runs its pre-proceed code
      first and its post-proceed code last, wrapping B (order 2), which wraps the target. The target executes
      once, at the innermost point.
    ref: "concepts.md#advice-types"

  - id: spring-aop-and-proxies-073
    difficulty: advanced
    tags: [thread-safety, proxy-sharing, per-call-state]
    question: |
      Why is a single Spring AOP proxy instance safe to share across many concurrent threads, even for an
      @Around advice that times execution?
    options:
      - "Because Spring creates a fresh clone of the proxy and its advisor chain for every thread that enters the method, giving each caller its own isolated interceptor instances"
      - "Because per-invocation state (the MethodInvocation, local variables like start time) lives on each thread's stack, and the proxy/advisor chain themselves are stateless dispatch structures"
      - "Because every proxied method acquires a single global monitor lock before dispatching, so concurrent threads are queued and only one call walks the advisor chain at a time"
      - "Because Spring confines all @Around advice execution to one dedicated dispatcher thread, so the timing logic never actually runs on more than a single thread concurrently"
    answer: 1
    explanation: |
      The proxy and its interceptor chain are stateless with respect to a given call; each invocation's state
      (including local timing variables and the MethodInvocation) is on the calling thread's stack. Problems
      only arise if you add mutable fields to the aspect/target, which are shared.
    ref: "concepts.md#thread-safety-and-performance"

  - id: spring-aop-and-proxies-074
    difficulty: expert
    tags: [pointcut-designators, this-target-binding]
    question: |
      A pointcut `@Around("... && target(t)")` binds the target object to parameter `t` typed as an interface
      `Repo`. Under JDK proxying, what does `t` reference at runtime?
    options:
      - "The proxy object itself, because target() resolves to whatever the caller is currently holding a reference to, which under proxying is always the wrapping proxy instance"
      - "Null, because argument binding through target() is unsupported with JDK dynamic proxies and Spring silently passes null rather than raising a match error"
      - "The raw target (unproxied) instance, because target() binds the target behind the proxy"
      - "A freshly cloned copy of the target that Spring instantiates per invocation, so mutations to t never leak back into the shared singleton bean"
    answer: 2
    explanation: |
      target() binds the actual target instance behind the proxy, so t is the raw unproxied object. If you
      instead call advised methods on t, those internal calls would bypass the proxy (self-invocation).
      Contrast with this(), which binds the proxy.
    ref: "concepts.md#advisor-chain-methodinterceptor-and-matching"

  - id: spring-aop-and-proxies-075
    difficulty: advanced
    tags: [spring-aop-vs-aspectj, join-point-model]
    question: |
      A requirement is to run advice whenever a specific FIELD is written on any object (including objects
      created with new, not Spring beans). Which technology can satisfy this and why?
    options:
      - "Spring AOP, using its built-in get()/set() field pointcut designators, which the proxy evaluates on every field read and write to any managed bean"
      - "Full AspectJ (compile-time or load-time weaving), because its join point model includes field get/set and it can weave non-Spring, new-created objects — capabilities Spring AOP's method-execution-only proxy model lacks"
      - "Spring AOP with proxyTargetClass=true, since forcing CGLIB subclass proxies extends interception from method calls to direct field access on the generated subclass"
      - "Neither technology can advise field access, because both are strictly limited to intercepting method-execution join points on their respective managed objects"
    answer: 1
    explanation: |
      Field get/set join points and advising arbitrary (non-Spring, new-created) objects are AspectJ-only
      capabilities. Spring AOP is limited to method-execution join points on Spring-managed beans via proxies,
      so it cannot intercept field writes.
    ref: "concepts.md#spring-aop-vs-aspectj"

  - id: spring-aop-and-proxies-076
    difficulty: expert
    tags: [proxy-creation, multiple-bpp, merging]
    question: |
      A bean matches advisors from BOTH @Transactional and a custom @Aspect. How many proxy objects wrap the
      bean, and how are the concerns combined?
    options:
      - "Two nested proxies wrap the bean, one per concern, because the transaction infrastructure and the @Aspect support each register their own independent auto-proxy creator that proxies in turn"
      - "No proxy is created at all, because the transactional advisor and the custom aspect advisor conflict and cancel each other out during advisor resolution"
      - "One proxy is built solely for the transaction advice, while the custom aspect is instead applied by Spring through direct reflective invocation at each call site"
      - "A single proxy whose interceptor chain contains all matching advisors, ordered by advisor precedence; the auto-proxy creator does not re-proxy an already-proxied bean"
    answer: 3
    explanation: |
      A single AnnotationAwareAspectJAutoProxyCreator collects all matching advisors (transaction advisor plus
      custom aspect advisors) into one proxy's interceptor chain, ordered by precedence. It merges advisors
      rather than stacking multiple proxies.
    ref: "concepts.md#proxy-creation-internals-and-bean-post-processing"

  - id: spring-aop-and-proxies-077
    difficulty: advanced
    tags: [performance, jdk-vs-cglib-dispatch]
    question: |
      Considering pure per-call dispatch cost (ignoring startup), how do JDK and CGLIB proxy invocations
      generally compare, and how significant is it?
    options:
      - "JDK proxies are always dramatically faster because the JIT fully inlines reflective Method.invoke calls to zero cost, while CGLIB's generated subclasses defeat inlining entirely"
      - "CGLIB's generated FastClass/index-based dispatch is generally faster than JDK reflective invocation, but for both the per-call overhead is small and usually negligible next to I/O; it only matters on very hot in-memory paths with broad pointcuts"
      - "Both proxy mechanisms add such heavy per-call overhead that AOP should be avoided in service-tier code and replaced with hand-written wrapper classes wherever possible"
      - "There is no measurable difference between them, because JDK and CGLIB proxies both ultimately dispatch through the same java.lang.reflect.Method reflective path at call time"
    answer: 1
    explanation: |
      CGLIB uses generated dispatch (FastClass/index) that tends to be faster than JDK reflective Method
      invocation, but the difference is minor. The dominant cost in real services is I/O; proxy overhead only
      surfaces on tight in-memory loops, especially with dynamic/broad pointcuts.
    ref: "concepts.md#thread-safety-and-performance"

  - id: spring-aop-and-proxies-078
    difficulty: expert
    tags: [advice-types, proceed-multiple, idempotency]
    question: |
      An @Around retry advice calls proceed() up to 3 times on failure. The advised method is NOT idempotent
      (it charges a credit card). What is the crucial correctness concern this design exposes about @Around?
    options:
      - "proceed() may be invoked at most once per @Around advice, because the ProceedingJoinPoint is consumed on the first call, so implementing any retry loop is fundamentally impossible"
      - "Because @Around fully controls invocation and may call proceed() multiple times, it can re-execute a non-idempotent target and cause duplicate side effects (e.g., double charges); retry advice must be paired with idempotency or applied only to safe operations"
      - "@Around automatically enrolls each proceed() attempt in its own transaction and rolls back the side effects of every failed attempt before the next one, so double charges cannot occur"
      - "Retries are always safe because Spring fingerprints each invocation's arguments and transparently deduplicates identical calls made within the same interceptor chain"
    answer: 1
    explanation: |
      @Around's power to call proceed() zero, one, or many times means retry logic will genuinely re-run the
      target and its side effects. For non-idempotent operations this causes duplicates. The aspect gives no
      automatic rollback or dedup — the target must be idempotent or retries restricted to safe methods.
    ref: "concepts.md#advice-types"
