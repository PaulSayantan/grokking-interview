topic: "Bean Lifecycle and Lifecycle Callbacks"
domain: spring-core
topic_slug: bean-lifecycle-callbacks
version: 1
questions:
  - id: bean-lifecycle-callbacks-001
    difficulty: beginner
    tags: [lifecycle, phases, order]
    question: |
      In the Spring bean lifecycle for a singleton, which phase happens
      immediately AFTER the bean is instantiated (constructor called)?
    options:
      - "Destruction callbacks such as @PreDestroy"
      - "Dependency population (setter/field injection)"
      - "BeanPostProcessor postProcessAfterInitialization"
      - "The custom destroy-method named in @Bean(destroyMethod)"
    answer: 1
    explanation: |
      After instantiation, the container populates the bean's properties
      (setter and field injection). Only after dependencies are injected do the
      aware callbacks, before-init post-processors, and init callbacks run.
    ref: "concepts.md#overview-of-the-bean-lifecycle"

  - id: bean-lifecycle-callbacks-002
    difficulty: beginner
    tags: [init, order]
    question: |
      When a single bean uses all three initialization mechanisms, in what order
      does Spring invoke them?
    options:
      - "init-method -> afterPropertiesSet() -> @PostConstruct"
      - "afterPropertiesSet() -> @PostConstruct -> custom init-method"
      - "custom init-method -> @PostConstruct -> afterPropertiesSet()"
      - "@PostConstruct -> afterPropertiesSet() -> custom init-method"
    answer: 3
    explanation: |
      The fixed order is @PostConstruct first, then
      InitializingBean.afterPropertiesSet(), then the custom init-method
      (@Bean initMethod or XML init-method).
    ref: "concepts.md#the-three-init-and-destroy-mechanisms-and-their-order"

  - id: bean-lifecycle-callbacks-003
    difficulty: beginner
    tags: [destroy, order]
    question: |
      For a singleton bean using all three destruction mechanisms, which callback
      runs FIRST at container shutdown?
    options:
      - "@PreDestroy"
      - "DisposableBean.destroy()"
      - "The custom destroy-method"
      - "BeanPostProcessor postProcessBeforeInitialization"
    answer: 0
    explanation: |
      Destruction order mirrors initialization: @PreDestroy runs first, then
      DisposableBean.destroy(), then the custom destroy-method.
    ref: "concepts.md#the-three-init-and-destroy-mechanisms-and-their-order"

  - id: bean-lifecycle-callbacks-004
    difficulty: beginner
    tags: [prototype, destroy]
    question: |
      What does the Spring container do about destruction callbacks for a
      prototype-scoped bean?
    options:
      - "It calls @PreDestroy but not DisposableBean.destroy()"
      - "It calls all destruction callbacks when the JVM exits"
      - "It does not call any destruction callbacks for the prototype"
      - "It calls destruction callbacks only if the bean implements DisposableBean"
    answer: 2
    explanation: |
      Spring does not manage the full lifecycle of prototype beans. After
      creating, configuring, and handing the instance to the client, the
      container keeps no reference to it, so no destruction callbacks fire.
    ref: "concepts.md#prototype-bean-lifecycle-and-destruction"

  - id: bean-lifecycle-callbacks-005
    difficulty: beginner
    tags: [beanpostprocessor, definition]
    question: |
      A BeanPostProcessor operates on what?
    options:
      - "Already-instantiated bean instances, around their initialization"
      - "Bean definitions (metadata) before any bean is instantiated"
      - "Only beans declared in XML, never annotation-scanned ones"
      - "The application context's environment properties"
    answer: 0
    explanation: |
      A BeanPostProcessor works on actual bean instances, giving before-init and
      after-init hooks. Working on bean definitions is the job of a
      BeanFactoryPostProcessor.
    ref: "concepts.md#beanpostprocessor"

  - id: bean-lifecycle-callbacks-006
    difficulty: beginner
    tags: [beanfactorypostprocessor, definition]
    question: |
      When does a BeanFactoryPostProcessor execute relative to bean instantiation?
    options:
      - "After all singletons have been fully initialized and their init callbacks have run"
      - "Once for every bean instance right after its constructor is called"
      - "Only during context shutdown, just before destruction callbacks fire"
      - "After definitions are loaded but before any (non-lazy) singleton is instantiated"
    answer: 3
    explanation: |
      BeanFactoryPostProcessor runs after all bean definitions are loaded but
      before any non-lazy singleton bean is instantiated, so it can modify
      definition metadata (e.g., resolve placeholders).
    ref: "concepts.md#beanfactorypostprocessor"

  - id: bean-lifecycle-callbacks-007
    difficulty: beginner
    tags: [aware, beannameaware]
    question: |
      Which interface would a bean implement to receive its own bean id/name from
      the container?
    options:
      - "ApplicationContextAware"
      - "BeanFactoryAware"
      - "BeanNameAware"
      - "EnvironmentAware"
    answer: 2
    explanation: |
      BeanNameAware.setBeanName(String) delivers the bean's configured id/name.
      The others deliver the context, the bean factory, and the environment
      respectively.
    ref: "concepts.md#aware-interfaces"

  - id: bean-lifecycle-callbacks-008
    difficulty: beginner
    tags: [annotations, jsr250]
    question: |
      Which pair of annotations marks initialization and destruction callbacks
      that are NOT part of the Spring API itself (JSR-250 / Jakarta annotations)?
    options:
      - "@PostConstruct and @PreDestroy"
      - "@Init and @Destroy"
      - "@AfterCreate and @BeforeDestroy"
      - "@Autowired and @Value"
    answer: 0
    explanation: |
      @PostConstruct and @PreDestroy are JSR-250 annotations
      (jakarta.annotation in Spring 6, javax.annotation in Spring 5). They carry
      no coupling to Spring types, unlike InitializingBean/DisposableBean.
    ref: "concepts.md#the-three-init-and-destroy-mechanisms-and-their-order"

  - id: bean-lifecycle-callbacks-009
    difficulty: beginner
    tags: [interfaces, init, destroy]
    question: |
      Which two Spring interfaces provide initialization and destruction callback
      methods?
    options:
      - "BeanNameAware and BeanFactoryAware"
      - "InitializingBean and DisposableBean"
      - "BeanPostProcessor and BeanFactoryPostProcessor"
      - "Lifecycle and SmartLifecycle"
    answer: 1
    explanation: |
      InitializingBean declares afterPropertiesSet() and DisposableBean declares
      destroy(). Implementing them couples the bean class to Spring.
    ref: "concepts.md#the-three-init-and-destroy-mechanisms-and-their-order"

  - id: bean-lifecycle-callbacks-010
    difficulty: beginner
    tags: [bean-annotation, init, destroy]
    question: |
      How do you declare a custom init and destroy method on a @Bean method in a
      @Configuration class?
    options:
      - "@Bean(initMethod = \"start\", destroyMethod = \"stop\")"
      - "@Bean(onCreate = \"start\", onDestroy = \"stop\")"
      - "@Init(\"start\") @Destroy(\"stop\")"
      - "@Bean.lifecycle(\"start\", \"stop\")"
    answer: 0
    explanation: |
      The @Bean annotation accepts initMethod and destroyMethod attributes naming
      no-arg methods on the bean class to be invoked by the container.
    ref: "concepts.md#the-three-init-and-destroy-mechanisms-and-their-order"

  - id: bean-lifecycle-callbacks-011
    difficulty: beginner
    tags: [shutdown, singleton]
    question: |
      In a standalone (non-web) application, what must you do so that a singleton's
      @PreDestroy / destroy() callbacks actually run?
    options:
      - "Nothing; they always run when the last bean is garbage collected"
      - "Mark the bean as @Lazy so the container flushes it on JVM exit"
      - "Set destroyMethod to an empty string to auto-register a shutdown hook"
      - "Close the context (ctx.close()) or register a shutdown hook"
    answer: 3
    explanation: |
      Destruction callbacks fire when the context is closed. Call ctx.close()
      explicitly or ctx.registerShutdownHook() so they run on JVM exit.
    ref: "concepts.md#startup-and-shutdown-lifecycle-and-smartlifecycle"

  - id: bean-lifecycle-callbacks-012
    difficulty: beginner
    tags: [constructor, injection]
    question: |
      Inside a bean's constructor, which dependencies are guaranteed to be
      available?
    options:
      - "All @Autowired field-injected dependencies"
      - "Setter-injected dependencies"
      - "Constructor-injected dependencies"
      - "None; all injection happens after the init-method"
    answer: 2
    explanation: |
      Constructor injection supplies dependencies during instantiation, so they
      are available in the constructor. Field and setter injection happen in the
      later property-population phase.
    ref: "concepts.md#instantiation-and-dependency-population"

  - id: bean-lifecycle-callbacks-013
    difficulty: beginner
    tags: [aop, proxy]
    question: |
      Spring AOP typically wraps a bean in a proxy during which lifecycle hook?
    options:
      - "BeanFactoryPostProcessor.postProcessBeanFactory"
      - "The constructor, via CGLIB subclass generation"
      - "BeanPostProcessor.postProcessAfterInitialization"
      - "@PostConstruct, right after dependency injection"
    answer: 2
    explanation: |
      Auto-proxy creators are BeanPostProcessors that return a proxy from
      postProcessAfterInitialization, replacing the raw bean so callers get the
      proxy.
    ref: "concepts.md#beanpostprocessor"

  - id: bean-lifecycle-callbacks-014
    difficulty: intermediate
    tags: [beanpostprocessor, replace]
    question: |
      What is the effect of returning a different (wrapping) object from
      BeanPostProcessor.postProcessAfterInitialization?
    options:
      - "It throws an exception; you must return the same instance"
      - "The original bean is used and the returned object is ignored"
      - "The returned object replaces the bean that callers receive"
      - "Both objects are registered under the same name"
    answer: 2
    explanation: |
      The object returned from postProcessAfterInitialization replaces the bean
      instance in the container. This is precisely how AOP proxies are
      substituted for the original bean.
    ref: "concepts.md#beanpostprocessor"

  - id: bean-lifecycle-callbacks-015
    difficulty: intermediate
    tags: [aware, timing]
    question: |
      When are the *Aware callbacks (e.g., BeanNameAware, ApplicationContextAware)
      invoked in the lifecycle?
    options:
      - "Before the bean is instantiated, from within the constructor call itself"
      - "After property population, before before-init BeanPostProcessors and @PostConstruct"
      - "After all initialization callbacks have completed, once the bean is fully ready"
      - "Only during context shutdown, immediately before the destroy callbacks"
    answer: 1
    explanation: |
      Aware callbacks run after dependencies are populated but before the
      before-init BeanPostProcessor hooks (and thus before @PostConstruct and
      afterPropertiesSet()).
    ref: "concepts.md#aware-interfaces"

  - id: bean-lifecycle-callbacks-016
    difficulty: intermediate
    tags: [postconstruct, mechanism]
    question: |
      Through what mechanism does Spring actually invoke @PostConstruct methods?
    options:
      - "A BeanFactoryPostProcessor that rewrites the bean definition"
      - "The JVM's finalizer thread, invoked lazily on first access"
      - "Directly from the bean's constructor via reflective bytecode weaving"
      - "A BeanPostProcessor (CommonAnnotationBeanPostProcessor) in its before-init hook"
    answer: 3
    explanation: |
      CommonAnnotationBeanPostProcessor detects @PostConstruct/@PreDestroy and
      invokes @PostConstruct from its postProcessBeforeInitialization hook, which
      is why it runs before afterPropertiesSet().
    ref: "concepts.md#beanpostprocessor"

  - id: bean-lifecycle-callbacks-017
    difficulty: intermediate
    tags: [prototype, init]
    question: |
      For a prototype-scoped bean, which callbacks DOES the container still invoke?
    options:
      - "Both initialization and destruction callbacks"
      - "Only destruction callbacks"
      - "Initialization callbacks, but not destruction callbacks"
      - "Neither initialization nor destruction callbacks"
    answer: 2
    explanation: |
      The container instantiates, configures, and runs initialization callbacks
      for each prototype instance, but does not track it afterward, so
      destruction callbacks are never invoked.
    ref: "concepts.md#prototype-bean-lifecycle-and-destruction"

  - id: bean-lifecycle-callbacks-018
    difficulty: intermediate
    tags: [bfpp, placeholder]
    question: |
      Why is PropertySourcesPlaceholderConfigurer implemented as a
      BeanFactoryPostProcessor rather than a BeanPostProcessor?
    options:
      - "It needs to run once per bean instance"
      - "It creates AOP proxies for beans"
      - "It must resolve ${...} placeholders in bean definitions before beans are instantiated"
      - "It only works on prototype beans"
    answer: 2
    explanation: |
      Placeholder resolution rewrites the bean definitions (metadata) and must
      happen before any singleton is instantiated, which is exactly what a
      BeanFactoryPostProcessor does.
    ref: "concepts.md#beanfactorypostprocessor"

  - id: bean-lifecycle-callbacks-019
    difficulty: intermediate
    tags: [comparison, bpp, bfpp]
    question: |
      Which statement correctly distinguishes BeanFactoryPostProcessor from
      BeanPostProcessor?
    options:
      - "BeanFactoryPostProcessor acts on already-created instances during initialization; BeanPostProcessor rewrites bean definitions before instantiation"
      - "BeanFactoryPostProcessor acts on definitions and runs before any singleton is instantiated; BeanPostProcessor acts on instances during initialization"
      - "Both operate exclusively on fully instantiated bean instances, differing only in whether they run before or after the init callbacks"
      - "BeanPostProcessor always runs first to wrap instances, and only afterward does BeanFactoryPostProcessor adjust bean definitions"
    answer: 1
    explanation: |
      Factory post-processors modify definitions before instantiation; bean
      post-processors modify instances during initialization. The factory
      processors necessarily complete before the bean processors begin.
    ref: "concepts.md#beanfactorypostprocessor"

  - id: bean-lifecycle-callbacks-020
    difficulty: intermediate
    tags: [inferred, destroy, bean]
    question: |
      For a @Bean method that returns an object with a public no-arg close()
      method, what does Spring do by default regarding destruction?
    options:
      - "Nothing, unless you set destroyMethod explicitly"
      - "It infers and calls close() (or shutdown()) on shutdown"
      - "It always calls a method literally named destroy()"
      - "It throws an error requiring you to specify destroyMethod"
    answer: 1
    explanation: |
      @Bean uses INFER_METHOD by default, so Spring looks for a public no-arg
      close() or shutdown() method and calls it at shutdown. Set destroyMethod =
      \"\" to disable this inference.
    ref: "concepts.md#the-three-init-and-destroy-mechanisms-and-their-order"

  - id: bean-lifecycle-callbacks-021
    difficulty: intermediate
    tags: [field-injection, constructor]
    question: |
      A field annotated with @Autowired is accessed inside the bean's constructor.
      What is the result?
    options:
      - "The field already holds the injected dependency provided by the container"
      - "The field is null because field injection happens after instantiation"
      - "A compilation error occurs because the field is referenced before injection"
      - "The container injects it eagerly before the constructor runs"
    answer: 1
    explanation: |
      Field injection occurs during the populateBean phase, after the constructor
      has already executed. So the field is still null in the constructor; use
      @PostConstruct for logic that needs it.
    ref: "concepts.md#instantiation-and-dependency-population"

  - id: bean-lifecycle-callbacks-022
    difficulty: intermediate
    tags: [prototype, singleton, injection]
    question: |
      A prototype bean is injected once into a singleton via a normal @Autowired
      field. How many prototype instances does the singleton effectively use over
      its life?
    options:
      - "A fresh instance created automatically on every method call"
      - "Exactly one, captured at singleton creation time"
      - "Exactly one distinct instance per accessing thread"
      - "Zero, because the prototype injection is silently skipped"
    answer: 1
    explanation: |
      Ordinary injection resolves the prototype once when the singleton is
      created. To get fresh instances, use @Lookup, ObjectProvider/Provider, or a
      scoped proxy.
    ref: "concepts.md#prototype-bean-lifecycle-and-destruction"

  - id: bean-lifecycle-callbacks-023
    difficulty: intermediate
    tags: [aware, groups]
    question: |
      Which of these aware callbacks is delivered via a dedicated BeanPostProcessor
      (ApplicationContextAwareProcessor) rather than directly by invokeAwareMethods?
    options:
      - "BeanNameAware"
      - "BeanFactoryAware"
      - "ApplicationContextAware"
      - "BeanClassLoaderAware"
    answer: 2
    explanation: |
      BeanNameAware, BeanFactoryAware, and BeanClassLoaderAware are called
      directly by invokeAwareMethods. The ApplicationContext-family aware
      interfaces, including ApplicationContextAware, are handled by
      ApplicationContextAwareProcessor.
    ref: "concepts.md#aware-interfaces"

  - id: bean-lifecycle-callbacks-024
    difficulty: intermediate
    tags: [recommendation, best-practice]
    question: |
      For a third-party class you cannot modify but that has a startup() method,
      what is the recommended way to have Spring call it on initialization?
    options:
      - "Add @PostConstruct to the method"
      - "Make the class implement InitializingBean"
      - "Use @Bean(initMethod = \"startup\")"
      - "There is no way without changing the class"
    answer: 2
    explanation: |
      Since you cannot annotate or change the class, declaring it as a @Bean with
      initMethod (or XML init-method) lets Spring call the existing method by name
      without coupling the class to Spring.
    ref: "concepts.md#the-three-init-and-destroy-mechanisms-and-their-order"

  - id: bean-lifecycle-callbacks-025
    difficulty: intermediate
    tags: [smartlifecycle, startup]
    question: |
      What does SmartLifecycle add over the plain Lifecycle interface?
    options:
      - "Nothing meaningful; SmartLifecycle is merely an alias for Lifecycle"
      - "It replaces @PostConstruct as the primary initialization callback"
      - "It disables destruction callbacks in favor of stop()-based teardown"
      - "getPhase() for ordering and isAutoStartup() for automatic start"
    answer: 3
    explanation: |
      SmartLifecycle adds getPhase() (phase ordering for start/stop),
      isAutoStartup() (start automatically with the context), and a
      callback-style stop(Runnable) for asynchronous shutdown.
    ref: "concepts.md#startup-and-shutdown-lifecycle-and-smartlifecycle"

  - id: bean-lifecycle-callbacks-026
    difficulty: intermediate
    tags: [javax, jakarta, versions]
    question: |
      In Spring Framework 6.x, which package do @PostConstruct and @PreDestroy
      come from?
    options:
      - "javax.annotation"
      - "jakarta.annotation"
      - "org.springframework.annotation"
      - "java.lang.annotation"
    answer: 1
    explanation: |
      Spring Framework 6 migrated to Jakarta EE, so these annotations live in
      jakarta.annotation. Spring 5 and earlier used javax.annotation.
    ref: "concepts.md#the-three-init-and-destroy-mechanisms-and-their-order"

  - id: bean-lifecycle-callbacks-027
    difficulty: intermediate
    tags: [phases, before-after-init]
    question: |
      Which lifecycle hook runs immediately BEFORE the initialization callbacks
      (@PostConstruct, afterPropertiesSet, init-method)?
    options:
      - "BeanPostProcessor.postProcessAfterInitialization"
      - "BeanPostProcessor.postProcessBeforeInitialization"
      - "DisposableBean.destroy(), the container's destruction callback"
      - "BeanFactoryPostProcessor.postProcessBeanFactory"
    answer: 1
    explanation: |
      postProcessBeforeInitialization runs after aware callbacks and just before
      the init callbacks. In fact @PostConstruct is fired from within a
      before-init post-processor.
    ref: "concepts.md#overview-of-the-bean-lifecycle"

  - id: bean-lifecycle-callbacks-028
    difficulty: intermediate
    tags: [prototype, cleanup]
    question: |
      Who is responsible for releasing expensive resources held by a
      prototype-scoped bean?
    options:
      - "The Spring container, at context shutdown"
      - "The garbage collector automatically calls destroy()"
      - "The client code that obtained the prototype"
      - "A BeanFactoryPostProcessor invoked during context shutdown"
    answer: 2
    explanation: |
      Because Spring does not track prototype instances, the calling client must
      clean them up (e.g., via explicit disposal or a custom BeanPostProcessor
      that retains references).
    ref: "concepts.md#prototype-bean-lifecycle-and-destruction"

  - id: bean-lifecycle-callbacks-029
    difficulty: intermediate
    tags: [beandefinitionregistrypostprocessor, config]
    question: |
      Which extension point can ADD or REMOVE bean definitions, and processes
      @Configuration/@Bean/@ComponentScan?
    options:
      - "BeanPostProcessor, whose after-init hook can register new bean definitions"
      - "BeanDefinitionRegistryPostProcessor (e.g., ConfigurationClassPostProcessor)"
      - "InitializingBean, whose afterPropertiesSet callback adds and removes definitions"
      - "ApplicationContextAwareProcessor, which registers @Configuration-derived definitions"
    answer: 1
    explanation: |
      BeanDefinitionRegistryPostProcessor is a BeanFactoryPostProcessor
      sub-interface whose postProcessBeanDefinitionRegistry can add/remove
      definitions. ConfigurationClassPostProcessor uses it to process
      @Configuration classes.
    ref: "concepts.md#beanfactorypostprocessor"

  - id: bean-lifecycle-callbacks-030
    difficulty: beginner
    tags: [instantiation, initialization]
    question: |
      Which statement about instantiation versus initialization is correct?
    options:
      - "They are the same phase, since the constructor performs the init callbacks itself"
      - "Instantiation (constructor) happens before initialization (init callbacks)"
      - "Initialization always happens before instantiation of the object"
      - "Initialization only applies to prototype beans, never to singletons"
    answer: 1
    explanation: |
      Instantiation creates the object; initialization (aware callbacks,
      @PostConstruct, afterPropertiesSet, init-method) happens later, after
      dependency population.
    ref: "concepts.md#overview-of-the-bean-lifecycle"

  - id: bean-lifecycle-callbacks-031
    difficulty: intermediate
    tags: [disable-inference, destroy]
    question: |
      You have a @Bean returning a DataSource with a close() method, but you do NOT
      want Spring to call close() at shutdown. What do you set?
    options:
      - "destroyMethod = \"close\" to explicitly point at the close method"
      - "destroyMethod = \"\" (empty string)"
      - "initMethod = \"\" to suppress the matching destroy inference"
      - "@Lazy on the bean so it is never eligible for destruction"
    answer: 1
    explanation: |
      Setting destroyMethod to an empty string disables the default close/shutdown
      inference for that @Bean, so Spring will not auto-invoke close().
    ref: "concepts.md#the-three-init-and-destroy-mechanisms-and-their-order"

  - id: bean-lifecycle-callbacks-032
    difficulty: intermediate
    tags: [scenario, order, callbacks]
    question: |
      A bean implements InitializingBean and also has an @PostConstruct method and
      a @Bean initMethod. During startup you log a message from each. In what order
      do the log lines appear?
    options:
      - "initMethod, then afterPropertiesSet, then @PostConstruct"
      - "afterPropertiesSet, then initMethod, then @PostConstruct"
      - "@PostConstruct, then afterPropertiesSet, then initMethod"
      - "All three run simultaneously in an undefined order"
    answer: 2
    explanation: |
      The deterministic order is @PostConstruct (via
      CommonAnnotationBeanPostProcessor before-init), then
      InitializingBean.afterPropertiesSet(), then the custom init-method.
    ref: "concepts.md#the-three-init-and-destroy-mechanisms-and-their-order"

  - id: bean-lifecycle-callbacks-033
    difficulty: intermediate
    tags: [circular, injection]
    question: |
      Which kind of circular dependency between two singletons can Spring generally
      resolve?
    options:
      - "One expressed purely through constructor injection"
      - "One expressed through setter/field injection"
      - "Any circular dependency, always, regardless of injection style"
      - "None; every circular dependency fails with an unrecoverable error"
    answer: 1
    explanation: |
      Spring resolves setter/field-injection circular references using early bean
      references (the three-level cache). Pure constructor-injection cycles throw
      BeanCurrentlyInCreationException.
    ref: "concepts.md#instantiation-and-dependency-population"

  - id: bean-lifecycle-callbacks-034
    difficulty: beginner
    tags: [aware, applicationcontext]
    question: |
      Which interface lets a bean obtain a reference to the ApplicationContext via
      a callback?
    options:
      - "ApplicationContextAware"
      - "BeanNameAware"
      - "InitializingBean"
      - "DisposableBean"
    answer: 0
    explanation: |
      ApplicationContextAware.setApplicationContext(ApplicationContext) delivers
      the context. Modern code often prefers injecting ApplicationContext via
      @Autowired instead.
    ref: "concepts.md#aware-interfaces"

  - id: bean-lifecycle-callbacks-035
    difficulty: intermediate
    tags: [bpp, scope, container]
    question: |
      A BeanPostProcessor registered in a child ApplicationContext applies to which
      beans?
    options:
      - "Beans in the same container only"
      - "Beans in the parent context only"
      - "All beans in every context in the JVM"
      - "Only prototype-scoped beans"
    answer: 0
    explanation: |
      A BeanPostProcessor is scoped to its own container; it post-processes beans
      defined in the same context, not beans defined in a parent context.
    ref: "concepts.md#beanpostprocessor"

  - id: bean-lifecycle-callbacks-036
    difficulty: intermediate
    tags: [ordering, bpp]
    question: |
      How can a BeanPostProcessor control its execution order relative to other
      BeanPostProcessors?
    options:
      - "By implementing PriorityOrdered or Ordered"
      - "By its bean name, which Spring sorts alphabetically only"
      - "Ordering cannot be controlled once the beans are registered"
      - "By setting a @Scope value that dictates processor precedence"
    answer: 0
    explanation: |
      Spring honors PriorityOrdered first, then Ordered, then registration order
      when sequencing multiple BeanPostProcessors.
    ref: "concepts.md#beanpostprocessor"

  - id: bean-lifecycle-callbacks-037
    difficulty: beginner
    tags: [detection, annotation-config]
    question: |
      What must be present for Spring to process @PostConstruct and @PreDestroy
      annotations?
    options:
      - "Nothing; they work with a plain BeanFactory and no configuration"
      - "The bean must be prototype-scoped so the container re-scans its annotations on each lookup"
      - "The annotated methods must be public and static so the container can reflectively invoke them"
      - "CommonAnnotationBeanPostProcessor must be registered (e.g., via component scanning or annotation-config)"
    answer: 3
    explanation: |
      Detection of @PostConstruct/@PreDestroy requires
      CommonAnnotationBeanPostProcessor, which is registered automatically with
      annotation-config, @ComponentScan, or AnnotationConfigApplicationContext.
    ref: "concepts.md#the-three-init-and-destroy-mechanisms-and-their-order"

  - id: bean-lifecycle-callbacks-038
    difficulty: intermediate
    tags: [bfpp, restriction]
    question: |
      What should a BeanFactoryPostProcessor avoid doing in postProcessBeanFactory?
    options:
      - "Reading bean definition property values to log the configured metadata"
      - "Modifying the scope attribute on existing bean definitions before instantiation"
      - "Instantiating beans (calling getBean and forcing early creation)"
      - "Resolving ${...} placeholder values against the configured property sources"
    answer: 2
    explanation: |
      A BeanFactoryPostProcessor should operate on definitions, not instantiate
      beans. Forcing premature bean instantiation can bypass other
      post-processors and cause subtle problems.
    ref: "concepts.md#beanfactorypostprocessor"

  - id: bean-lifecycle-callbacks-039
    difficulty: intermediate
    tags: [web-scope, destruction]
    question: |
      Unlike plain prototype beans, request- and session-scoped beans in a
      web-aware container:
    options:
      - "Never have any initialization or destruction callbacks invoked by the container"
      - "Are treated exactly like eager singletons, created once at context refresh"
      - "Cannot use @PostConstruct because web scopes skip the annotation post-processor"
      - "Have their destruction callbacks invoked when the request/session ends"
    answer: 3
    explanation: |
      Web scopes are managed by the web-aware container, which invokes destruction
      callbacks at the end of the request or session, unlike plain prototypes
      whose destruction is never called.
    ref: "concepts.md#prototype-bean-lifecycle-and-destruction"

  - id: bean-lifecycle-callbacks-040
    difficulty: beginner
    tags: [populate, phase-name]
    question: |
      The lifecycle phase where Spring performs setter and field injection of
      collaborators is commonly called:
    options:
      - "Instantiation, where the constructor allocates the bean object"
      - "Destruction, where the container releases the bean at shutdown"
      - "Aware callbacks, where the bean receives container references"
      - "Populate properties (dependency population)"
    answer: 3
    explanation: |
      After instantiation, the populateBean phase resolves and injects
      dependencies (setter/field injection) before the initializeBean phase runs
      aware and init callbacks.
    ref: "concepts.md#instantiation-and-dependency-population"

  - id: bean-lifecycle-callbacks-041
    difficulty: intermediate
    tags: [mnemonic, comparison]
    question: |
      Which mnemonic correctly captures the difference between the two
      post-processor types?
    options:
      - "BeanFactoryPostProcessor works on the finished products; BeanPostProcessor rewrites the recipes"
      - "BeanFactoryPostProcessor works on the factory (definitions); BeanPostProcessor works on the products (instances)"
      - "Both work only on singleton instances and ignore prototype and scoped beans entirely"
      - "BeanPostProcessor runs during context shutdown while BeanFactoryPostProcessor runs at startup"
    answer: 1
    explanation: |
      BeanFactoryPostProcessor edits the factory's recipes (bean definitions);
      BeanPostProcessor works on the produced instances. Definition processing
      finishes before instance processing begins.
    ref: "concepts.md#beanfactorypostprocessor"

  - id: bean-lifecycle-callbacks-042
    difficulty: beginner
    tags: [ready, phase]
    question: |
      After which step is a singleton bean considered fully initialized and ready
      for use?
    options:
      - "After instantiation completes, but before any dependency injection occurs"
      - "After postProcessAfterInitialization completes"
      - "As soon as the constructor returns, even before property population runs"
      - "After context shutdown, once all destruction callbacks have finished"
    answer: 1
    explanation: |
      The bean is ready once all init callbacks and the after-init
      BeanPostProcessor hooks (including any AOP proxying) have completed.
    ref: "concepts.md#overview-of-the-bean-lifecycle"

  - id: bean-lifecycle-callbacks-043
    difficulty: advanced
    tags: [circular, three-level-cache, internals]
    question: |
      In Spring's singleton three-level cache, what specifically lives in the
      third level (singletonFactories) and why is a third level needed at all
      instead of just an "early object" map?
    options:
      - "It stores fully initialized singletons so repeated getBean calls are O(1); the other two levels are only used for prototypes"
      - "It stores ObjectFactory lambdas that, when invoked, run the getEarlyBeanReference chain of SmartInstantiationAwareBeanPostProcessors, so an early (possibly AOP) proxy is created lazily and at most once"
      - "It stores bean definitions awaiting placeholder resolution, which is why BeanFactoryPostProcessors read from it"
      - "It stores weak references to destroyed beans so shutdown can re-run @PreDestroy idempotently"
    answer: 1
    explanation: |
      Level 3 holds ObjectFactory callbacks. When a mid-creation bean is
      referenced, its factory runs getEarlyBeanReference (SmartInstantiationAware
      BPPs), producing the early proxy on demand and only once; the reference is
      then promoted to level 2 (earlySingletonObjects). A two-level design could
      not create the early proxy lazily/exactly-once.
    ref: "concepts.md#instantiation-and-dependency-population"

  - id: bean-lifecycle-callbacks-044
    difficulty: expert
    tags: [circular, aop, exception]
    question: |
      Two singletons A and B form a setter-injection cycle. A is advised by a
      custom BeanPostProcessor that wraps it in a proxy only in
      postProcessAfterInitialization (not via the standard early-reference
      mechanism). B captures A mid-creation. What is the most likely outcome?
    options:
      - "Startup succeeds; B silently ends up holding the raw A while callers of A get the proxy"
      - "Startup succeeds and B is retroactively updated to point at the final proxy of A"
      - "Spring throws BeanCurrentlyInCreationException because the final wrapped A differs from the early raw reference already injected into B"
      - "Spring falls back to constructor injection for A to resolve the mismatch"
    answer: 2
    explanation: |
      Spring detects that the object it finished initializing (the proxy) is not
      the same early reference already handed to B. Since it cannot retroactively
      fix B, it throws BeanCurrentlyInCreationException about A being injected in
      its raw version but eventually wrapped. The fix is to break the cycle (e.g.
      @Lazy), not rely on early-reference identity.
    ref: "concepts.md#instantiation-and-dependency-population"

  - id: bean-lifecycle-callbacks-045
    difficulty: advanced
    tags: [lazy, circular, constructor]
    question: |
      A and B require each other via CONSTRUCTOR injection, which normally throws
      BeanCurrentlyInCreationException. A colleague adds @Lazy to A's constructor
      parameter of type B. Why does this fix the cycle?
    options:
      - "@Lazy injects a lazy-resolution proxy for B, so B's real creation is deferred and the cycle never forms during instantiation"
      - "@Lazy silently promotes B to prototype scope, and prototype beans are exempt from Spring's circular-dependency detection"
      - "@Lazy rewrites A's constructor to use setter injection automatically at compile time, so the cycle becomes resolvable"
      - "@Lazy disables the three-level singleton cache, so early raw references are always permitted between the two beans"
    answer: 0
    explanation: |
      @Lazy on the injection point supplies a lazy-resolution proxy instead of
      forcing B's creation, so no circular instantiation occurs. This is why @Lazy
      can break even constructor-injection cycles, which are otherwise
      unresolvable.
    ref: "concepts.md#instantiation-and-dependency-population"

  - id: bean-lifecycle-callbacks-046
    difficulty: expert
    tags: [beanpostprocessor, ordering, programmatic]
    question: |
      You register two BeanPostProcessors: one is a bean implementing Ordered with
      order 0; the other you add via
      beanFactory.addBeanPostProcessor(...) from a BeanFactoryPostProcessor,
      implementing Ordered with order -100. At runtime, which runs first for an
      ordinary bean?
    options:
      - "The order 0 bean, because programmatically added BPPs are appended in call order and do NOT participate in the Ordered sort"
      - "The order -100 one, because Spring collects every registered BPP into one list and globally sorts it by Ordered"
      - "Whichever BPP's bean name sorts first alphabetically, since Spring falls back to name comparison for BPPs"
      - "They run concurrently on separate infrastructure threads, so the relative order is genuinely undefined"
    answer: 0
    explanation: |
      Only BPPs registered as beans and wired via registerBeanPostProcessors are
      sorted by PriorityOrdered/Ordered. BPPs added programmatically through
      addBeanPostProcessor are simply appended in call order and ignore Ordered.
      So relative execution depends on insertion, not the order value.
    ref: "concepts.md#beanpostprocessor"

  - id: bean-lifecycle-callbacks-047
    difficulty: expert
    tags: [beanpostprocessor, early-instantiation, auto-proxy]
    question: |
      A BeanPostProcessor bean @Autowires a @Transactional service TxSvc. At
      startup Spring logs that TxSvc "is not eligible for getting processed by all
      BeanPostProcessors (for example: not eligible for auto-proxying)". What is
      happening and the cleanest fix?
    options:
      - "The BPP forces TxSvc to instantiate before the auto-proxy creator can process it, so TxSvc is a raw unproxied instance; inject it @Lazy or via ObjectProvider so it is not created early"
      - "TxSvc has a malformed propagation attribute in its @Transactional annotation; remove and re-add the annotation to clear it"
      - "TxSvc must be annotated @Primary so the auto-proxy creator treats it as the canonical bean eligible for proxying"
      - "Move TxSvc into a parent context, because beans defined in a parent are always proxied before child-context BPPs run"
    answer: 0
    explanation: |
      BPPs are instantiated eagerly before ordinary beans, dragging their
      dependencies in too early to be auto-proxied. TxSvc ends up unproxied (no
      transactions). Making the dependency @Lazy or ObjectProvider-wrapped avoids
      forcing its early creation.
    ref: "concepts.md#beanpostprocessor"

  - id: bean-lifecycle-callbacks-048
    difficulty: expert
    tags: [instantiationaware, short-circuit, internals]
    question: |
      An InstantiationAwareBeanPostProcessor returns a non-null object from
      postProcessBeforeInstantiation for bean "widget". Which callbacks still run
      on that returned object?
    options:
      - "All of them: constructor, populateBean, aware callbacks, @PostConstruct, then both BPP hooks"
      - "Only populateBean and @PostConstruct still run; the constructor is skipped since the object already exists"
      - "Only postProcessAfterInitialization; normal instantiation, population, and init callbacks are all skipped"
      - "None; the object is returned to the caller with no further processing at all"
    answer: 2
    explanation: |
      A non-null return from postProcessBeforeInstantiation short-circuits normal
      creation: Spring skips instantiation, population, and init callbacks, and
      only postProcessAfterInitialization is still applied to the substitute
      object. This is the lowest-level interception point.
    ref: "concepts.md#beanpostprocessor"

  - id: bean-lifecycle-callbacks-049
    difficulty: advanced
    tags: [smartlifecycle, phase, ordering]
    question: |
      Component B (SmartLifecycle) must start only after component A
      (SmartLifecycle) is running, and A must not be stopped until B has stopped.
      Which phase assignment achieves this?
    options:
      - "A phase 50, B phase 100"
      - "A phase 100, B phase 50"
      - "Both phase 0; ordering is guaranteed by class name"
      - "A phase Integer.MAX_VALUE, B phase Integer.MIN_VALUE"
    answer: 0
    explanation: |
      Startup goes low-to-high phase, shutdown is the reverse. Giving A the lower
      phase (50) starts A first; giving B the higher phase (100) starts it after A
      and stops it before A on shutdown. That satisfies both constraints.
    ref: "concepts.md#startup-and-shutdown-lifecycle-and-smartlifecycle"

  - id: bean-lifecycle-callbacks-050
    difficulty: expert
    tags: [smartlifecycle, default-phase, rationale]
    question: |
      SmartLifecycle.DEFAULT_PHASE is Integer.MAX_VALUE, whereas a plain Lifecycle
      bean is treated as phase 0. What behavioral consequence does this default
      have for an auto-started SmartLifecycle bean relative to a plain Lifecycle
      bean?
    options:
      - "The SmartLifecycle bean starts last and stops first, so it is torn down before the plain Lifecycle bean"
      - "The SmartLifecycle bean starts first and stops first, so it is torn down before the plain Lifecycle bean"
      - "The SmartLifecycle bean starts last and stops last, remaining active until every other component has stopped"
      - "Phase is ignored for auto-started beans, so both the smart and plain beans start and stop in one undifferentiated batch"
    answer: 0
    explanation: |
      With phase Integer.MAX_VALUE, the smart bean starts after everything (highest
      phase = last to start) and, because shutdown reverses, stops first. The
      rationale: a component started last typically depends on everything before
      it, so it should be shut down first.
    ref: "concepts.md#startup-and-shutdown-lifecycle-and-smartlifecycle"

  - id: bean-lifecycle-callbacks-051
    difficulty: expert
    tags: [smartlifecycle, stop-callback, timeout]
    question: |
      A SmartLifecycle bean overrides stop(Runnable callback) to trigger an async
      drain but forgets to ever call callback.run(). What is the observable effect
      at context shutdown?
    options:
      - "Shutdown aborts immediately with an IllegalStateException complaining the stop callback was never signalled"
      - "The bean is silently skipped and, as a knock-on effect, its @PreDestroy destruction callback never runs either"
      - "Context shutdown blocks on that phase for the full per-phase timeout (default 30 seconds) before proceeding"
      - "Nothing noticeable; Spring detects phase completion by polling isRunning() instead of waiting on the callback"
    answer: 2
    explanation: |
      DefaultLifecycleProcessor waits for each bean in a phase to invoke the
      callback, up to timeoutPerShutdownPhase (default 30s). Forgetting
      callback.run() stalls shutdown for the entire timeout on that phase before
      Spring gives up and continues.
    ref: "concepts.md#startup-and-shutdown-lifecycle-and-smartlifecycle"

  - id: bean-lifecycle-callbacks-052
    difficulty: advanced
    tags: [lifecycle, stop, predestroy, ordering]
    question: |
      For a Lifecycle bean that also has @PreDestroy, which statement about the
      relationship between stop() and @PreDestroy at shutdown is most accurate?
    options:
      - "On an orderly close() stop() runs before destruction callbacks, but on a failed/stopped refresh Spring may run destroy callbacks without a preceding stop()"
      - "@PreDestroy always runs before stop(), because destruction callbacks are sequenced ahead of the Lifecycle stop phase"
      - "stop() and @PreDestroy are internally the same callback, so Spring simply invokes the one method twice at shutdown"
      - "stop() only runs for prototype-scoped beans while @PreDestroy is reserved exclusively for singleton-scoped beans"
    answer: 0
    explanation: |
      On a normal shutdown, Lifecycle beans receive stop (in phase order) before
      destruction callbacks. But this guarantee does not hold on hot/failed
      refresh, where destroy methods can run without a preceding stop. Do not rely
      on stop() always preceding @PreDestroy.
    ref: "concepts.md#startup-and-shutdown-lifecycle-and-smartlifecycle"

  - id: bean-lifecycle-callbacks-053
    difficulty: advanced
    tags: [failure, refresh, singleton]
    question: |
      A non-lazy singleton's @PostConstruct throws a RuntimeException during
      context startup. What happens?
    options:
      - "Spring logs a warning, leaves the half-created bean registered in the singleton cache, and continues context startup"
      - "The exception is wrapped in a BeanCreationException and propagates, aborting context refresh; the half-created bean is not left in the singleton cache"
      - "Spring retries the @PostConstruct method up to three times with a backoff before finally reporting failure"
      - "Only that one bean is skipped and marked unavailable; the context still starts successfully without it"
    answer: 1
    explanation: |
      An exception in an init callback propagates out of getBean as a
      BeanCreationException and aborts refresh for a non-lazy singleton (the whole
      context fails to start). The partially created bean is not registered in the
      singleton cache. This is why init callbacks are the place to fail fast.
    ref: "concepts.md#exceptions-and-failure-modes-during-the-lifecycle"

  - id: bean-lifecycle-callbacks-054
    difficulty: expert
    tags: [failure, destroy, refresh]
    question: |
      During refresh(), beans X and Y are fully created (each with a @PreDestroy),
      then bean Z's afterPropertiesSet() throws and refresh fails. Which
      destruction callbacks run?
    options:
      - "None; a failed refresh skips all destruction"
      - "X, Y, and Z all get @PreDestroy called"
      - "X and Y get @PreDestroy (they were already fully created and registered as disposable); Z does not, because it never finished creation"
      - "Only Z, as part of rolling back its own creation"
    answer: 2
    explanation: |
      On a failed refresh Spring calls destroyBeans() on the singletons it had
      already fully created and registered as disposable (X, Y), so their
      @PreDestroy runs. Z threw during init, never reached the disposable
      registration point, so its destroy callbacks do not run.
    ref: "concepts.md#exceptions-and-failure-modes-during-the-lifecycle"

  - id: bean-lifecycle-callbacks-055
    difficulty: advanced
    tags: [failure, destroy, exception-handling]
    question: |
      During ctx.close(), one singleton's @PreDestroy throws an exception. What
      does the container do?
    options:
      - "Catches and logs the exception and continues destroying the remaining beans; close() itself does not fail"
      - "Aborts close() immediately and rethrows the exception, leaving all the remaining singletons undestroyed"
      - "Restarts the entire shutdown sequence from the first bean, re-invoking every destruction callback again"
      - "Marks the context as running again and reschedules that bean's @PreDestroy for a single retry attempt"
    answer: 0
    explanation: |
      Exceptions from destruction callbacks are caught and logged, not propagated.
      Spring continues destroying the other beans, and close() completes. A broken
      @PreDestroy neither blocks other cleanup nor fails the close call.
    ref: "concepts.md#exceptions-and-failure-modes-during-the-lifecycle"

  - id: bean-lifecycle-callbacks-056
    difficulty: advanced
    tags: [dependson, destruction, ordering]
    question: |
      Beans A and B have no injection relationship, but B is annotated
      @DependsOn("A"). In what order are they created and destroyed?
    options:
      - "A created before B; B destroyed before A"
      - "A created before B; A destroyed before B"
      - "B created before A; B destroyed before A"
      - "Creation and destruction order are both undefined without an injection edge"
    answer: 0
    explanation: |
      @DependsOn forces A to be created before B even without injection.
      Destruction is the reverse of creation, so B is destroyed before A, ensuring
      B's dependency (A) is still valid during B's @PreDestroy.
    ref: "concepts.md#ordering-of-bean-creation-depends-on-and-destruction"

  - id: bean-lifecycle-callbacks-057
    difficulty: expert
    tags: [smartlifecycle, dependson, ordering-independence]
    question: |
      A bean uses SmartLifecycle for start/stop AND has @PreDestroy. Its stop()
      order is governed by phase, while its @PreDestroy order is governed by
      creation dependencies. Why can these two orderings legitimately differ?
    options:
      - "Because Lifecycle phase ordering controls start()/stop() while bean creation/destruction dependency order controls instantiation and destroy callbacks; they are independent mechanisms"
      - "They cannot differ; Spring always synchronizes the SmartLifecycle phase value with the bean's creation-dependency order so both sequences match exactly"
      - "Because @PreDestroy is only ever invoked for prototype-scoped beans, whereas stop() applies solely to singleton-scoped SmartLifecycle components"
      - "Because implementing SmartLifecycle disables all destruction callbacks entirely, so @PreDestroy never actually runs alongside stop() at shutdown"
    answer: 0
    explanation: |
      Phase ordering (SmartLifecycle) and dependency-based creation/destruction
      ordering are separate systems. stop() follows phases; @PreDestroy follows
      reverse creation order. So a bean may be stopped in one order and destroyed
      in another.
    ref: "concepts.md#ordering-of-bean-creation-depends-on-and-destruction"

  - id: bean-lifecycle-callbacks-058
    difficulty: expert
    tags: [thread-safety, postconstruct, deadlock]
    question: |
      Why can spawning a thread inside a @PostConstruct that then calls
      applicationContext.getBean(...) on a bean currently mid-creation lead to a
      deadlock?
    options:
      - "getBean is not thread-safe at all, so a concurrent call corrupts the shared singleton cache and crashes the JVM heap"
      - "The JVM forbids spawning any new thread while a bean's @PostConstruct is still executing, throwing an IllegalThreadStateException"
      - "@PostConstruct methods run on a dedicated single-threaded lifecycle executor that cannot be re-entered from a nested getBean call"
      - "Singleton creation synchronizes on the singleton cache; the new thread blocks trying to acquire that lock while the creating thread waits for the new thread, producing a circular wait"
    answer: 3
    explanation: |
      getSingleton in DefaultSingletonBeanRegistry holds a lock on the singleton
      cache during creation. If a @PostConstruct spawns a thread that calls getBean
      for a bean whose creation lock is held by the initializing thread, and the
      initializing thread waits on the spawned thread, you get a classic circular
      wait deadlock.
    ref: "concepts.md#thread-safety-and-timing-of-lifecycle-callbacks"

  - id: bean-lifecycle-callbacks-059
    difficulty: advanced
    tags: [postconstruct, context-ready, events]
    question: |
      You need logic that runs only after EVERY singleton in the context is fully
      initialized (e.g., cross-bean warmup). Why is @PostConstruct the wrong tool,
      and what is appropriate?
    options:
      - "@PostConstruct is fine; the container guarantees it fires only once every other singleton in the context is fully constructed and initialized"
      - "Use a static initializer block on the bean class, since the JVM defers running it until the very last managed bean has been created"
      - "Use a BeanFactoryPostProcessor, whose postProcessBeanFactory hook is invoked after all singleton instances have finished their init callbacks"
      - "@PostConstruct runs while its own bean is being created, before other beans may exist; use a ContextRefreshedEvent listener or SmartLifecycle.start(), which run after all singletons are initialized"
    answer: 3
    explanation: |
      @PostConstruct fires during the owning bean's creation and cannot assume
      other beans exist yet. For 'whole context ready' logic use
      ContextRefreshedEvent (or ApplicationReadyEvent under Boot) or
      SmartLifecycle.start(), which run after all singletons are initialized.
    ref: "concepts.md#thread-safety-and-timing-of-lifecycle-callbacks"

  - id: bean-lifecycle-callbacks-060
    difficulty: advanced
    tags: [init, aop, proxy, self-invocation]
    question: |
      A @Service has a @PostConstruct that calls its own @Cacheable /
      @Transactional method via this.doWork(). Does the caching/transaction advice
      apply during initialization?
    options:
      - "Yes; the proxy intercepts every call including internal self-invocations, so the advice fully applies during @PostConstruct"
      - "It throws an AopConfigException at startup because advised methods are illegal to call while the bean is still initializing"
      - "Yes, but only the @Cacheable advice applies during init; the @Transactional advice is deliberately suppressed until after startup"
      - "No; init callbacks run on the raw target instance before the after-init post-processor creates the proxy, so self-invocation from @PostConstruct bypasses the advice"
    answer: 3
    explanation: |
      Init callbacks run on the target instance, and the AOP proxy is created later
      in postProcessAfterInitialization. A this.method() call during @PostConstruct
      goes straight to the target, bypassing the proxy, so transaction/cache advice
      does not apply. (Plain self-invocation has the same problem generally.)
    ref: "concepts.md#the-three-init-and-destroy-mechanisms-and-their-order"

  - id: bean-lifecycle-callbacks-061
    difficulty: expert
    tags: [dedup, init, same-method]
    question: |
      A bean implements InitializingBean and is also declared with
      @Bean(initMethod = "afterPropertiesSet"). How many times does
      afterPropertiesSet() run at initialization?
    options:
      - "Twice: once for the interface, once for the named init-method"
      - "Once: Spring deduplicates when multiple mechanisms resolve to the same method name"
      - "Zero: the duplicate registration is treated as a conflict, so Spring cancels both invocations and skips the method entirely"
      - "Three times: once via the interface, once via the named init-method, and once because @PostConstruct is implied for it"
    answer: 1
    explanation: |
      When multiple lifecycle mechanisms resolve to the same method name, Spring
      runs that method exactly once. So afterPropertiesSet() is invoked a single
      time despite being reachable via both the interface and the named
      init-method.
    ref: "concepts.md#the-three-init-and-destroy-mechanisms-and-their-order"

  - id: bean-lifecycle-callbacks-062
    difficulty: expert
    tags: [postconstruct, inheritance, order]
    question: |
      A superclass Base and its subclass Child each declare a (different)
      @PostConstruct method. In what order does Spring invoke them, and what is the
      @PreDestroy order?
    options:
      - "Child @PostConstruct first, then Base; @PreDestroy: Base first, then Child"
      - "Only Child's @PostConstruct runs because it overrides the concept"
      - "Both @PostConstruct run in parallel; @PreDestroy order is undefined"
      - "Base @PostConstruct first, then Child; @PreDestroy: Child first, then Base"
    answer: 3
    explanation: |
      Spring invokes the superclass @PostConstruct before the subclass one
      (parent-first, mirroring construction). @PreDestroy is the reverse: subclass
      (Child) first, then superclass (Base). JSR-250 allows one @PostConstruct per
      class in the hierarchy.
    ref: "concepts.md#the-three-init-and-destroy-mechanisms-and-their-order"

  - id: bean-lifecycle-callbacks-063
    difficulty: advanced
    tags: [postconstruct, validity, spec]
    question: |
      Which of the following @PostConstruct method signatures is INVALID per the
      JSR-250 contract Spring enforces?
    options:
      - "A private no-arg void method"
      - "A protected no-arg method with a non-void return type (return value ignored)"
      - "A public static no-arg void method"
      - "A package-private no-arg void method"
    answer: 2
    explanation: |
      @PostConstruct methods must be non-static and take no arguments. A private
      method works (Spring makes it accessible reflectively), and a non-void return
      is tolerated but ignored. A static method is invalid.
    ref: "concepts.md#the-three-init-and-destroy-mechanisms-and-their-order"

  - id: bean-lifecycle-callbacks-064
    difficulty: advanced
    tags: [bfpp, bpp, ordering, phases]
    question: |
      Consider these four hooks for a single non-lazy singleton startup:
      (1) BeanDefinitionRegistryPostProcessor.postProcessBeanDefinitionRegistry,
      (2) BeanFactoryPostProcessor.postProcessBeanFactory,
      (3) BeanPostProcessor.postProcessBeforeInitialization,
      (4) @PostConstruct. What is their correct chronological order?
    options:
      - "3, 4, 1, 2"
      - "1, 2, 4, 3"
      - "2, 1, 4, 3"
      - "1, 2, 3, 4"
    answer: 3
    explanation: |
      Registry post-processing runs first (can add/remove definitions), then
      factory post-processing on definitions, both before any singleton is
      instantiated. Later, per-bean, postProcessBeforeInitialization runs and
      @PostConstruct fires from within that before-init phase (so 3 then 4).
    ref: "concepts.md#beanfactorypostprocessor"

  - id: bean-lifecycle-callbacks-065
    difficulty: expert
    tags: [bfpp, early-instantiation, side-effect]
    question: |
      Inside postProcessBeanFactory, a developer calls
      beanFactory.getBean(DataSource.class) to "warm it up." What is the primary
      risk?
    options:
      - "None whatsoever; BeanFactoryPostProcessors are explicitly designed to instantiate and warm up singleton beans early in the refresh"
      - "It forces premature instantiation of the DataSource (and its dependencies) before other BeanPostProcessors are registered, so it may miss auto-proxying/@PostConstruct and behave as a raw instance"
      - "It permanently switches the DataSource bean definition to prototype scope, so a brand-new connection pool is built on every subsequent injection"
      - "It causes the placeholder resolver to silently skip all ${...} substitution in that definition, leaving the JDBC URL unresolved at runtime"
    answer: 1
    explanation: |
      BFPPs run before BPPs are registered and before normal instantiation.
      Calling getBean there instantiates the bean too early, so BPP-based features
      (auto-proxying, @PostConstruct via CommonAnnotationBeanPostProcessor) may not
      be applied, yielding a broken/raw instance. BFPPs should touch definitions,
      not instances.
    ref: "concepts.md#beanfactorypostprocessor"

  - id: bean-lifecycle-callbacks-066
    difficulty: advanced
    tags: [prototype, cleanup, scoped-proxy]
    question: |
      A singleton needs a FRESH prototype instance per business call AND needs each
      one properly disposed. Which combination actually achieves both?
    options:
      - "Field-inject the prototype once and manually invoke its @PreDestroy method from the singleton's own shutdown callback each call"
      - "Switch the prototype to request scope so the web container automatically creates and disposes a fresh instance on every call"
      - "Mark the prototype @Lazy so Spring begins tracking each created instance and reliably invokes its destruction callbacks per call"
      - "Use ObjectProvider/@Lookup to obtain a new instance per call, and have the client explicitly release/close each one, since the container never calls prototype destruction callbacks"
    answer: 3
    explanation: |
      A plain field injection captures one instance. ObjectProvider/@Lookup yields
      a fresh prototype per call, but Spring still never invokes prototype
      destruction callbacks, so the client must dispose each instance itself.
    ref: "concepts.md#prototype-bean-lifecycle-and-destruction"

  - id: bean-lifecycle-callbacks-067
    difficulty: expert
    tags: [prototype, destructionaware, bpp]
    question: |
      You want a prototype bean's cleanup to run automatically. Which approach can
      make that happen, and what is the fundamental reason plain prototypes lack
      it?
    options:
      - "Implement DisposableBean on the prototype; Spring always honors its destroy() callback for prototype instances at context close"
      - "Register a custom BeanPostProcessor (or DestructionAwareBeanPostProcessor) that retains references and invokes cleanup, because the container itself keeps no reference to prototype instances after handing them out"
      - "Add @PreDestroy to the prototype; the CommonAnnotationBeanPostProcessor then tracks each instance and fires the callback at shutdown"
      - "Set scope to prototype together with an explicit destroyMethod attribute, which re-enables the container's per-instance destruction tracking"
    answer: 1
    explanation: |
      The container forgets prototype instances after creation, so no built-in
      mechanism (DisposableBean, @PreDestroy, destroy-method) fires. To get
      automatic cleanup you must retain references yourself, e.g. via a custom
      BeanPostProcessor that tracks and later disposes them.
    ref: "concepts.md#prototype-bean-lifecycle-and-destruction"

  - id: bean-lifecycle-callbacks-068
    difficulty: advanced
    tags: [aware, timing, ordering]
    question: |
      For a bean implementing BeanNameAware, ApplicationContextAware, and having a
      @PostConstruct, what is the invocation order of the three?
    options:
      - "@PostConstruct runs first, then setBeanName is delivered, and setApplicationContext fires last just before the init-method"
      - "All three fire from within the constructor itself, before any dependency population or before-init post-processing occurs"
      - "setApplicationContext is delivered first, then setBeanName via invokeAwareMethods, and finally @PostConstruct after both aware hooks"
      - "setBeanName (via invokeAwareMethods), then setApplicationContext (via ApplicationContextAwareProcessor before-init), then @PostConstruct (via CommonAnnotationBeanPostProcessor before-init)"
    answer: 3
    explanation: |
      invokeAwareMethods calls setBeanName first. Then before-init BPPs run:
      ApplicationContextAwareProcessor delivers setApplicationContext, and
      CommonAnnotationBeanPostProcessor invokes @PostConstruct. Both aware and
      @PostConstruct occur after population; the direct aware methods precede the
      BPP-driven ones.
    ref: "concepts.md#aware-interfaces"

  - id: bean-lifecycle-callbacks-069
    difficulty: expert
    tags: [aware, ordering, bpp]
    question: |
      Two before-init BeanPostProcessors are in play: ApplicationContextAware
      Processor and CommonAnnotationBeanPostProcessor (@PostConstruct). Suppose a
      @PostConstruct method needs the ApplicationContext obtained via
      ApplicationContextAware. Is that safe, and why?
    options:
      - "Unsafe; @PostConstruct is always sequenced ahead of every aware callback, so the injected ApplicationContext is still null when it runs"
      - "Safe; ApplicationContextAwareProcessor is ordered ahead of the @PostConstruct-processing BPP, so setApplicationContext has already run when @PostConstruct executes"
      - "Safe, but only if the bean additionally implements InitializingBean so afterPropertiesSet forces the aware callback to run first"
      - "Unsafe; all aware callbacks are deferred until after every initialization callback, so the context is unavailable inside @PostConstruct"
    answer: 1
    explanation: |
      Both are before-init hooks, but ApplicationContextAwareProcessor runs earlier
      in the before-init chain than CommonAnnotationBeanPostProcessor, so the
      context is injected before @PostConstruct. Relying on that ordering is a
      documented and safe pattern.
    ref: "concepts.md#aware-interfaces"

  - id: bean-lifecycle-callbacks-070
    difficulty: advanced
    tags: [shutdown, jvm, predestroy]
    question: |
      A standalone app creates an AnnotationConfigApplicationContext, uses beans,
      then the main method returns without calling close(). No shutdown hook was
      registered. What happens to singleton @PreDestroy callbacks on normal JVM
      exit?
    options:
      - "They run automatically because the JVM finalizes the context and flushes its destruction callbacks on normal exit"
      - "They run after a default 30-second grace period once the main thread has returned from the method"
      - "They run only for the subset of beans that implement DisposableBean, but not for @PreDestroy-annotated ones"
      - "They do not run, because the context was never closed and no shutdown hook was registered"
    answer: 3
    explanation: |
      Destruction callbacks fire only when the context is closed. Without
      ctx.close() or ctx.registerShutdownHook(), @PreDestroy/destroy() on
      singletons never run. There is no automatic finalization-based cleanup.
    ref: "concepts.md#startup-and-shutdown-lifecycle-and-smartlifecycle"

  - id: bean-lifecycle-callbacks-071
    difficulty: expert
    tags: [inferred-destroy, autocloseable, double-close]
    question: |
      A @Bean returns a class implementing AutoCloseable and you also set
      destroyMethod = "shutdown" explicitly. The class has both close() and
      shutdown(). At shutdown, what does Spring call?
    options:
      - "Both close() (inferred) and shutdown() (explicit), risking a double close"
      - "Only shutdown(), because an explicit destroyMethod overrides the close()/shutdown() inference"
      - "Only close(), because implementing AutoCloseable always takes precedence over any explicitly named destroyMethod"
      - "Neither method, because specifying both an AutoCloseable close() and an explicit destroyMethod disables destruction outright"
    answer: 1
    explanation: |
      An explicitly set destroyMethod overrides the default inference. Inference
      (looking for close()/shutdown()) only applies when destroyMethod is left at
      INFER_METHOD. So only the explicitly named shutdown() is invoked, not close().
    ref: "concepts.md#the-three-init-and-destroy-mechanisms-and-their-order"

  - id: bean-lifecycle-callbacks-072
    difficulty: advanced
    tags: [bpp, self-processing, infrastructure]
    question: |
      Which statement about how BeanPostProcessors process each other is correct?
    options:
      - "A BeanPostProcessor's own before-init and after-init hooks are reflexively applied to itself as it is being initialized by the container"
      - "BeanPostProcessors are forbidden from processing any other bean that is flagged as an internal infrastructure component of the container"
      - "Every registered BeanPostProcessor post-processes all the other BeanPostProcessors, regardless of the relative order in which they were created"
      - "A BeanPostProcessor is never post-processed by its own hooks, and it only sees other beans (including other BPPs) that were created earlier than it"
    answer: 3
    explanation: |
      A BPP does not run its callbacks on itself, and since BPPs are created early
      and in a specific order, a given BPP can only affect beans (including other
      BPPs) instantiated after it. Ordering among BPP beans thus determines what
      infrastructure each one sees.
    ref: "concepts.md#beanpostprocessor"

  - id: bean-lifecycle-callbacks-073
    difficulty: expert
    tags: [thread-safety, prototype, concurrency]
    question: |
      Under concurrent load, two threads each request the same prototype-scoped
      bean whose @PostConstruct mutates a shared static counter without
      synchronization. Compared to a singleton, what is the key difference and
      risk?
    options:
      - "No difference; Spring acquires the same singleton-cache lock for prototype and singleton creation alike, so all init callbacks are globally serialized"
      - "Prototypes never run @PostConstruct or any other init callback, so there is no shared-state mutation and therefore no possible race between the two threads"
      - "Prototype creation is not globally serialized like singleton creation, so both init callbacks run concurrently and the unsynchronized shared mutation can race"
      - "Spring automatically synchronizes access to any static field mutated inside a bean's init callbacks, so the shared counter increments safely with no race"
    answer: 2
    explanation: |
      Singleton creation is guarded by the singleton-cache lock (created once), but
      prototype creation is not globally serialized: concurrent requests build
      independent instances and run their init callbacks in parallel. Shared state
      touched during prototype init must be thread-safe.
    ref: "concepts.md#thread-safety-and-timing-of-lifecycle-callbacks"

  - id: bean-lifecycle-callbacks-074
    difficulty: advanced
    tags: [populate, instantiationaware, injection]
    question: |
      Which BeanPostProcessor variant is responsible for applying @Autowired /
      @Value field and setter injection, and in which phase does its relevant hook
      run?
    options:
      - "A plain BeanPostProcessor whose postProcessAfterInitialization hook performs @Autowired/@Value injection after the init callbacks have already completed"
      - "A BeanFactoryPostProcessor that reads the bean definitions and injects @Autowired/@Value values into them before any bean instance is ever created"
      - "AutowiredAnnotationBeanPostProcessor, an InstantiationAwareBeanPostProcessor, whose postProcessProperties runs during the property-population phase (before init callbacks)"
      - "ApplicationContextAwareProcessor, which performs @Autowired and @Value injection during the aware-callback phase alongside setApplicationContext"
    answer: 2
    explanation: |
      AutowiredAnnotationBeanPostProcessor implements
      InstantiationAwareBeanPostProcessor; its postProcessProperties hook injects
      @Autowired/@Value during populateBean, after instantiation and before init
      callbacks, which is why those fields are null in the constructor but set by
      @PostConstruct.
    ref: "concepts.md#instantiation-and-dependency-population"

  - id: bean-lifecycle-callbacks-075
    difficulty: expert
    tags: [depends-on, tie-break, registration-order]
    question: |
      Two singleton beans have no dependency relationship and no @DependsOn. Your
      code accidentally relies on bean A being created before bean B. Why is this
      fragile?
    options:
      - "Because Spring creates beans in reverse alphabetical order of their bean names, and a simple rename of either class would silently flip which one is built first"
      - "Because singletons are deliberately created in a randomized order on every application run, so any assumed A-before-B ordering holds only by pure chance"
      - "Because with no dependency edge, creation order falls back to bean-definition registration order (for component scanning, effectively classpath/filesystem order), which is not a contract you should depend on"
      - "It is not fragile at all; bean-definition registration order is a documented, guaranteed part of the container's public API that you may safely depend on"
    answer: 2
    explanation: |
      Without an injection edge or @DependsOn, ties are broken by registration
      order, which for component scanning is essentially classpath/filesystem
      order and can vary across builds/environments. Encode real ordering needs
      with @DependsOn or an injection dependency instead.
    ref: "concepts.md#ordering-of-bean-creation-depends-on-and-destruction"

  - id: bean-lifecycle-callbacks-076
    difficulty: expert
    tags: [early-reference, this-escape, publication]
    question: |
      A singleton registers "this" as a listener with an external registry from
      inside its own constructor. Why is this dangerous in the context of the bean
      lifecycle?
    options:
      - "Constructors are forbidden from referencing 'this' in Spring-managed beans, and the container throws an IllegalStateException the moment such an escape is detected"
      - "It publishes a partially constructed object: dependencies (field/setter injected) and init callbacks have not run yet, so the registry may invoke methods on an incompletely initialized bean"
      - "Spring detects the escaped 'this' reference and defensively creates a duplicate bean instance for the container, leaving two copies registered under one name"
      - "The external registry reference pins the bean in memory so it can never be garbage collected, causing a memory leak but posing no correctness or initialization issue"
    answer: 1
    explanation: |
      At constructor time, field/setter injection and init callbacks have not
      happened. Escaping 'this' exposes a partially constructed object; the
      external registry could call back into the bean before it is fully
      initialized. Defer such registration to @PostConstruct or SmartLifecycle.start().
    ref: "concepts.md#thread-safety-and-timing-of-lifecycle-callbacks"

  - id: bean-lifecycle-callbacks-077
    difficulty: advanced
    tags: [bpp, exception, refresh]
    question: |
      A custom BeanPostProcessor throws from postProcessAfterInitialization while
      processing a non-lazy singleton during startup. What is the effect?
    options:
      - "The exception is quietly swallowed and logged at debug level, and the raw unprocessed bean is registered and used as-is"
      - "Only that bean's after-init phase is skipped, but the partially processed instance is still registered and made available for injection"
      - "It propagates and fails that bean's creation, and since the bean is a non-lazy singleton, aborts context refresh"
      - "Spring quietly retries the bean through the before-init hook instead, and uses whatever instance that second pass returns"
    answer: 2
    explanation: |
      BPP hooks run inline within initializeBean, so a thrown exception propagates
      and fails the bean's creation. For a non-lazy singleton that aborts refresh.
      BPPs are as capable of breaking startup as init callbacks are.
    ref: "concepts.md#exceptions-and-failure-modes-during-the-lifecycle"

  - id: bean-lifecycle-callbacks-078
    difficulty: expert
    tags: [smartlifecycle, negative-phase, plain-lifecycle]
    question: |
      A SmartLifecycle bean S returns getPhase() = -50 and isAutoStartup() = true.
      A plain Lifecycle bean L (phase 0) is also present. Relative to L, when does
      S start and stop?
    options:
      - "S starts after L and stops after L"
      - "S starts before L and stops after L"
      - "S starts after L and stops before L"
      - "They start and stop together because L is not a SmartLifecycle"
    answer: 1
    explanation: |
      Startup goes low-to-high phase, so S (-50) starts before L (0). Shutdown is
      the reverse, so S stops after L. A negative phase places a SmartLifecycle
      bean before standard phase-0 components on startup and after them on
      shutdown.
    ref: "concepts.md#startup-and-shutdown-lifecycle-and-smartlifecycle"
