topic: "Exception Handling in the Web Layer"
domain: spring-core
topic_slug: web-exception-handling
version: 1
questions:
  - id: web-exception-handling-001
    difficulty: beginner
    tags: [exception-handler, basics]
    question: |
      What does a method annotated with `@ExceptionHandler` inside a `@Controller` do?
    options:
      - "It handles exceptions thrown by handler methods in that same controller"
      - "It handles exceptions thrown anywhere in the entire application by default"
      - "It intercepts exceptions thrown by servlet filters before the DispatcherServlet"
      - "It registers a global servlet error page for the entire web container"
    answer: 0
    explanation: |
      A controller-local `@ExceptionHandler` method handles exceptions raised by
      `@RequestMapping`/`@GetMapping` etc. handler methods declared in the same controller.
      To share handling across controllers you use `@ControllerAdvice`.
    ref: "concepts.md#exceptionhandler-controller-local"

  - id: web-exception-handling-002
    difficulty: beginner
    tags: [controller-advice, global]
    question: |
      Which annotation makes an exception-handling class apply globally across many controllers?
    options:
      - "@ExceptionHandler"
      - "@ResponseStatus"
      - "@RequestMapping"
      - "@ControllerAdvice"
    answer: 3
    explanation: |
      `@ControllerAdvice` is a `@Component` specialization that lets `@ExceptionHandler`,
      `@InitBinder`, and `@ModelAttribute` methods apply across controllers, rather than being
      scoped to a single controller.
    ref: "concepts.md#controlleradvice-and-restcontrolleradvice-global"

  - id: web-exception-handling-003
    difficulty: beginner
    tags: [rest-controller-advice, response-body]
    question: |
      How does `@RestControllerAdvice` differ from `@ControllerAdvice`?
    options:
      - "It combines @ControllerAdvice with @ResponseBody so return values are written to the response body"
      - "It restricts advice to only @RestController beans and adds no serialization behavior of its own"
      - "It disables view resolution application-wide and forces every controller to return raw strings"
      - "It is required before any @ExceptionHandler method will be detected and registered by Spring"
    answer: 0
    explanation: |
      `@RestControllerAdvice` is meta-annotated with both `@ControllerAdvice` and `@ResponseBody`.
      Return values from its handler methods are serialized (e.g. to JSON) as the response body
      instead of being treated as view names.
    ref: "concepts.md#controlleradvice-and-restcontrolleradvice-global"

  - id: web-exception-handling-004
    difficulty: beginner
    tags: [response-status, exception-class]
    question: |
      What is the effect of annotating a custom exception class with
      `@ResponseStatus(HttpStatus.NOT_FOUND)`?
    options:
      - "The exception is silently swallowed and the client receives an empty 200 response"
      - "The exception is logged at WARN level but the response status stays 200 OK regardless"
      - "When the exception propagates unhandled, the response status is set to 404"
      - "Spring refuses to start unless a matching @ExceptionHandler is registered for that type"
    answer: 2
    explanation: |
      `ResponseStatusExceptionResolver` detects `@ResponseStatus` on an exception and sets the
      corresponding HTTP status (404 here) when that exception propagates out of the handler.
    ref: "concepts.md#mapping-exceptions-to-http-status-with-responsestatus"

  - id: web-exception-handling-005
    difficulty: beginner
    tags: [problem-detail, rfc-7807]
    question: |
      Which class did Spring Framework 6 introduce to represent RFC 7807 error responses?
    options:
      - "ErrorAttributes"
      - "ApiError"
      - "ResponseStatusException"
      - "ProblemDetail"
    answer: 3
    explanation: |
      `org.springframework.http.ProblemDetail` is the Spring 6 representation of an RFC 7807
      "Problem Details for HTTP APIs" body, serialized as `application/problem+json`.
    ref: "concepts.md#problemdetail-rfc-7807-in-spring-6"

  - id: web-exception-handling-006
    difficulty: beginner
    tags: [handler-exception-resolver, spi]
    question: |
      What is `HandlerExceptionResolver` in Spring MVC?
    options:
      - "An annotation for marking exception classes so the container maps them to status codes"
      - "The low-level SPI the DispatcherServlet uses to resolve exceptions into responses"
      - "A utility class that formats exception stack traces and writes them to a rolling log file"
      - "A Spring Boot-only auto-configuration bean that wires up the default /error endpoint"
    answer: 1
    explanation: |
      `HandlerExceptionResolver` is the strategy interface `DispatcherServlet` delegates to when a
      handler throws. `@ExceptionHandler`, `@ResponseStatus`, and the default MVC handling are all
      built on implementations of this SPI.
    ref: "concepts.md#handlerexceptionresolver-concept"

  - id: web-exception-handling-007
    difficulty: beginner
    tags: [response-entity-exception-handler, base-class]
    question: |
      What is the primary purpose of extending `ResponseEntityExceptionHandler` in a
      `@ControllerAdvice`?
    options:
      - "To disable all of Spring's default exception handling and start entirely from scratch"
      - "To get ready-made handlers for standard Spring MVC exceptions that you can customize"
      - "To automatically retry failed requests a configurable number of times before responding"
      - "To register the advice class as a servlet filter that runs ahead of the DispatcherServlet"
    answer: 1
    explanation: |
      `ResponseEntityExceptionHandler` provides `@ExceptionHandler` methods for the framework's
      standard exceptions (e.g. `MethodArgumentNotValidException`, `HttpMessageNotReadableException`),
      which you can override for consistent, body-carrying responses.
    ref: "concepts.md#responseentityexceptionhandler"

  - id: web-exception-handling-008
    difficulty: beginner
    tags: [status, default]
    question: |
      A controller-local `@ExceptionHandler` returns a plain DTO object (no `ResponseEntity`,
      no `@ResponseStatus`). What HTTP status does the response get by default?
    options:
      - "500"
      - "400"
      - "200"
      - "204"
    answer: 2
    explanation: |
      A returned body defaults to HTTP 200. To signal an error status you must add
      `@ResponseStatus(...)` to the handler method or return a `ResponseEntity` with the desired status.
    ref: "concepts.md#exceptionhandler-controller-local"

  - id: web-exception-handling-009
    difficulty: beginner
    tags: [response-status-exception, dynamic]
    question: |
      Which class lets you set the HTTP status of an error at runtime without creating a
      dedicated exception class?
    options:
      - "ResponseStatusException"
      - "HttpServerErrorException"
      - "ResponseEntityExceptionHandler"
      - "ProblemDetail"
    answer: 0
    explanation: |
      `ResponseStatusException` (Spring 5+) is thrown with a status chosen at runtime, e.g.
      `throw new ResponseStatusException(HttpStatus.NOT_FOUND, "...")`, avoiding a proliferation of
      exception classes.
    ref: "concepts.md#mapping-exceptions-to-http-status-with-responsestatus"

  - id: web-exception-handling-010
    difficulty: beginner
    tags: [rfc-7807, media-type]
    question: |
      What media type does Spring use when serializing a `ProblemDetail` response?
    options:
      - "application/json"
      - "text/plain"
      - "application/error+xml"
      - "application/problem+json"
    answer: 3
    explanation: |
      RFC 7807 defines `application/problem+json` (and `application/problem+xml`) for problem
      detail bodies, and Spring sets this content type when returning a `ProblemDetail`.
    ref: "concepts.md#problemdetail-rfc-7807-in-spring-6"

  - id: web-exception-handling-011
    difficulty: beginner
    tags: [controller-advice, methods]
    question: |
      Besides `@ExceptionHandler`, which method types can a `@ControllerAdvice` class contain to
      assist controllers globally?
    options:
      - "@Scheduled and @Async methods"
      - "@Bean and @Configuration methods"
      - "@InitBinder and @ModelAttribute methods"
      - "@Transactional and @Cacheable methods"
    answer: 2
    explanation: |
      `@ControllerAdvice` can host `@ExceptionHandler`, `@InitBinder` (shared data-binder config),
      and `@ModelAttribute` (shared model population) methods.
    ref: "concepts.md#controlleradvice-and-restcontrolleradvice-global"

  - id: web-exception-handling-012
    difficulty: beginner
    tags: [precedence, local-vs-global]
    question: |
      An exception is thrown by a controller that has its own matching `@ExceptionHandler`, and a
      `@ControllerAdvice` also has a matching handler. Which one handles it?
    options:
      - "The controller-local @ExceptionHandler"
      - "The @ControllerAdvice one, because global handlers always win"
      - "Both are invoked in sequence"
      - "Neither; the exception propagates to the container"
    answer: 0
    explanation: |
      A controller-local `@ExceptionHandler` takes precedence for exceptions thrown by that
      controller. `@ControllerAdvice` handlers are only consulted when the controller has no
      matching local handler.
    ref: "concepts.md#controlleradvice-and-restcontrolleradvice-global"

  - id: web-exception-handling-013
    difficulty: beginner
    tags: [problem-detail, fields]
    question: |
      Which of the following is a standard RFC 7807 `ProblemDetail` field?
    options:
      - "stackTrace"
      - "correlationId"
      - "severity"
      - "detail"
    answer: 3
    explanation: |
      RFC 7807 standard members are `type`, `title`, `status`, `detail`, and `instance`. Other
      values (like `correlationId`) are custom extension members added via `setProperty(...)`.
    ref: "concepts.md#problemdetail-rfc-7807-in-spring-6"

  - id: web-exception-handling-014
    difficulty: beginner
    tags: [default-handler-exception-resolver]
    question: |
      What does `DefaultHandlerExceptionResolver` do?
    options:
      - "Discovers and invokes matching @ExceptionHandler methods across all controllers"
      - "Translates standard Spring MVC exceptions into appropriate HTTP status codes"
      - "Maps configured exception class names to JSP view names for error-page rendering"
      - "Serializes any thrown exception into an RFC 7807 ProblemDetail response body"
    answer: 1
    explanation: |
      `DefaultHandlerExceptionResolver` maps framework exceptions such as
      `HttpRequestMethodNotSupportedException` or `MissingServletRequestParameterException` to the
      correct status codes (e.g. 405, 400).
    ref: "concepts.md#handlerexceptionresolver-concept"

  - id: web-exception-handling-015
    difficulty: beginner
    tags: [scope, controller-advice]
    question: |
      By default, which controllers does a `@ControllerAdvice` (with no attributes) apply to?
    options:
      - "Only controllers in the same package"
      - "Only @RestController-annotated controllers"
      - "All controllers in the application"
      - "None until explicitly registered per controller"
    answer: 2
    explanation: |
      Without narrowing attributes, `@ControllerAdvice` applies to all controllers. You can scope it
      with `basePackages`, `annotations`, or `assignableTypes`.
    ref: "concepts.md#controlleradvice-and-restcontrolleradvice-global"

  - id: web-exception-handling-016
    difficulty: beginner
    tags: [error-response-design]
    question: |
      Which is a recommended practice when building error responses for 5xx errors in a public API?
    options:
      - "Return a generic message to the client and log the details server-side with a correlation id"
      - "Return the full server-side stack trace to the client so they can self-diagnose the failure"
      - "Always return HTTP 200 with an error flag in the body so clients need not inspect status codes"
      - "Echo back the raw exception's getMessage() verbatim so the client sees the exact internal cause"
    answer: 0
    explanation: |
      Leaking stack traces or internal messages is a security and usability risk. Return a generic
      message plus a correlation id, and keep the detailed diagnostics in server logs.
    ref: "concepts.md#building-consistent-error-responses"

  - id: web-exception-handling-017
    difficulty: intermediate
    tags: [matching, hierarchy]
    question: |
      Two `@ExceptionHandler` methods could match a thrown exception: one for `RuntimeException`
      and one for its subclass `OrderNotFoundException`. Which is chosen?
    options:
      - "The one declared first in the class, since Spring matches handlers by source order"
      - "The RuntimeException handler, because Spring always prefers the broadest assignable type"
      - "The OrderNotFoundException handler, because it is the closest match in the hierarchy"
      - "Both handlers run in sequence and their returned bodies are merged into one response"
    answer: 2
    explanation: |
      Spring selects the handler whose declared exception type is the closest match to the thrown
      type in the exception hierarchy (most specific), not by declaration order.
    ref: "concepts.md#exceptionhandler-controller-local"

  - id: web-exception-handling-018
    difficulty: intermediate
    tags: [pipeline, order]
    question: |
      What is the default order of the built-in `HandlerExceptionResolver`s registered by
      `@EnableWebMvc`?
    options:
      - "DefaultHandlerExceptionResolver, ResponseStatusExceptionResolver, ExceptionHandlerExceptionResolver"
      - "ResponseStatusExceptionResolver, ExceptionHandlerExceptionResolver, DefaultHandlerExceptionResolver"
      - "SimpleMappingExceptionResolver, ExceptionHandlerExceptionResolver, DefaultHandlerExceptionResolver"
      - "ExceptionHandlerExceptionResolver, ResponseStatusExceptionResolver, DefaultHandlerExceptionResolver"
    answer: 3
    explanation: |
      The default order is `ExceptionHandlerExceptionResolver` (annotation handlers) first, then
      `ResponseStatusExceptionResolver`, then `DefaultHandlerExceptionResolver`.
    ref: "concepts.md#the-exception-resolution-pipeline"

  - id: web-exception-handling-019
    difficulty: intermediate
    tags: [handler-exception-resolver, contract]
    question: |
      In `HandlerExceptionResolver.resolveException(...)`, what does returning `null` signify?
    options:
      - "The response has been fully written and flushed to the client already"
      - "The exception could not be resolved by this resolver; try the next one"
      - "A default container error page should be rendered for the request"
      - "The exception should be re-thrown immediately to the container"
    answer: 1
    explanation: |
      Returning `null` means this resolver does not handle the exception, so `DispatcherServlet`
      consults the next resolver. Returning a `ModelAndView` (even an empty one) signals it was handled.
    ref: "concepts.md#handlerexceptionresolver-concept"

  - id: web-exception-handling-020
    difficulty: intermediate
    tags: [response-status, reason]
    question: |
      What happens when `@ResponseStatus(value = HttpStatus.NOT_FOUND, reason = "Order not found")`
      is used on an exception and that exception propagates?
    options:
      - "Spring calls response.sendError(404, reason), typically producing a container error page"
      - "Spring returns a ProblemDetail JSON body automatically with the reason mapped to its detail field"
      - "Spring ignores the reason string entirely and only sets the numeric status on the response"
      - "Spring throws an IllegalStateException because reason cannot be combined with a 4xx status code"
    answer: 0
    explanation: |
      When `reason` is set, `ResponseStatusExceptionResolver.applyStatusAndReason` calls
      `HttpServletResponse.sendError(status, reason)`, which commits the response and typically
      triggers the container's error page (or `/error` under Boot). An empty `reason` still goes
      through `sendError` (the single-argument `sendError(status)`), so the error-page mechanism
      applies either way; the `reason` only controls whether a message string is attached.
    ref: "concepts.md#mapping-exceptions-to-http-status-with-responsestatus"

  - id: web-exception-handling-021
    difficulty: intermediate
    tags: [response-entity-exception-handler, spring6]
    question: |
      In Spring Framework 6, what is the default body produced by
      `ResponseEntityExceptionHandler` for the framework exceptions it handles?
    options:
      - "An empty body (you must fill it in)"
      - "A plain-text error string"
      - "A ProblemDetail (RFC 7807) body"
      - "The raw exception's toString()"
    answer: 2
    explanation: |
      A key Spring 6 change: `ResponseEntityExceptionHandler`'s handled exceptions implement
      `ErrorResponse`, and the default body is now a `ProblemDetail`. In Spring 5 the default body
      was empty.
    ref: "concepts.md#responseentityexceptionhandler"

  - id: web-exception-handling-022
    difficulty: intermediate
    tags: [scope, assignable-types]
    question: |
      Which `@ControllerAdvice` declaration limits the advice to only `OrderController` and
      `PaymentController`?
    options:
      - "@ControllerAdvice(basePackages = {\"OrderController\", \"PaymentController\"})"
      - "@ControllerAdvice(annotations = {OrderController.class, PaymentController.class})"
      - "@ControllerAdvice(assignableTypes = {OrderController.class, PaymentController.class})"
      - "@ControllerAdvice(value = {OrderController.class, PaymentController.class})"
    answer: 2
    explanation: |
      `assignableTypes` targets specific controller classes (and subtypes). `basePackages` takes
      package names, and `annotations` targets controllers bearing a given annotation.
    ref: "concepts.md#controlleradvice-and-restcontrolleradvice-global"

  - id: web-exception-handling-023
    difficulty: intermediate
    tags: [handle-exception-internal]
    question: |
      When extending `ResponseEntityExceptionHandler`, which protected method is the central hook
      to attach a common body or logging before the `ResponseEntity` is built?
    options:
      - "resolveException"
      - "afterPropertiesSet"
      - "doResolveException"
      - "handleExceptionInternal"
    answer: 3
    explanation: |
      `handleExceptionInternal(...)` is the single final customization point through which the
      framework exception handlers funnel; overriding it lets you inject a consistent body, headers,
      or logging.
    ref: "concepts.md#responseentityexceptionhandler"

  - id: web-exception-handling-024
    difficulty: intermediate
    tags: [error-response, interface]
    question: |
      What does implementing the `ErrorResponse` interface (Spring 6) on a custom exception give you?
    options:
      - "Automatic retry of the failed request with exponential backoff and jitter between attempts"
      - "A contract exposing an HttpStatusCode, HttpHeaders, and a ProblemDetail body"
      - "Automatic registration of the exception class as a HandlerExceptionResolver bean at startup"
      - "Transactional rollback of the surrounding service call whenever the exception is thrown"
    answer: 1
    explanation: |
      `ErrorResponse` is a strategy interface that exposes an `HttpStatusCode`, `HttpHeaders`, and a
      `ProblemDetail` body, letting the framework render a consistent RFC 7807 response. Built-in
      exceptions like `ResponseStatusException` already implement it.
    ref: "concepts.md#problemdetail-rfc-7807-in-spring-6"

  - id: web-exception-handling-025
    difficulty: intermediate
    tags: [arguments, exception-handler]
    question: |
      Which is NOT a supported way to inject data into an `@ExceptionHandler` method?
    options:
      - "The thrown exception instance (or a supertype)"
      - "HttpServletRequest / HttpServletResponse"
      - "@RequestBody binding of the original request payload"
      - "The WebRequest (or NativeWebRequest) abstraction over the current request"
    answer: 2
    explanation: |
      `@ExceptionHandler` methods accept the exception, request/response objects, `WebRequest`,
      `HandlerMethod`, `Locale`, etc., but they do not re-bind the original request via `@RequestBody`,
      `@RequestParam`, or `@PathVariable`.
    ref: "concepts.md#exceptionhandler-controller-local"

  - id: web-exception-handling-026
    difficulty: intermediate
    tags: [response-status, handler-method]
    question: |
      An `@ExceptionHandler` method is annotated with `@ResponseStatus(HttpStatus.NOT_FOUND)` and
      returns a DTO. What status does the response carry?
    options:
      - "200, because returning a body always resets the status back to OK"
      - "500, because no ResponseEntity was used to carry an explicit status"
      - "It is undefined and depends on the servlet container's default error mapping"
      - "404, from the @ResponseStatus on the handler method"
    answer: 3
    explanation: |
      `@ResponseStatus` on the handler method sets the response status (404) for the returned body,
      overriding the default 200.
    ref: "concepts.md#mapping-exceptions-to-http-status-with-responsestatus"

  - id: web-exception-handling-027
    difficulty: intermediate
    tags: [simple-mapping-exception-resolver]
    question: |
      Which built-in resolver maps exception class names to view names, typically used in
      server-rendered (JSP) applications?
    options:
      - "SimpleMappingExceptionResolver"
      - "ExceptionHandlerExceptionResolver"
      - "ResponseStatusExceptionResolver"
      - "DefaultHandlerExceptionResolver"
    answer: 0
    explanation: |
      `SimpleMappingExceptionResolver` maps exception types to error-page view names. It is opt-in
      (not registered by default) and suits classic view-rendering apps.
    ref: "concepts.md#handlerexceptionresolver-concept"

  - id: web-exception-handling-028
    difficulty: intermediate
    tags: [jakarta, spring6]
    question: |
      In Spring Framework 6, what is the correct import for the servlet request type used in an
      `@ExceptionHandler` method parameter?
    options:
      - "javax.servlet.http.HttpServletRequest"
      - "org.springframework.http.HttpRequest"
      - "jakarta.servlet.http.HttpServletRequest"
      - "spring.servlet.HttpServletRequest"
    answer: 2
    explanation: |
      Spring Framework 6 migrated to Jakarta EE 9+, so the servlet types live under
      `jakarta.servlet.*`. Spring 5 used `javax.servlet.*`.
    ref: "concepts.md#exceptionhandler-controller-local"

  - id: web-exception-handling-029
    difficulty: intermediate
    tags: [problem-detail, extension]
    question: |
      How do you add a custom (non-standard) field such as `orderId` to a `ProblemDetail`?
    options:
      - "It is not allowed; only the five RFC 7807 fields are permitted"
      - "Call setProperty(\"orderId\", value) to add an extension member"
      - "Subclass ProblemDetail and add a typed orderId getter field"
      - "Set it through the reason attribute of the @ResponseStatus annotation"
    answer: 1
    explanation: |
      RFC 7807 allows arbitrary extension members. `ProblemDetail.setProperty(name, value)` adds
      custom fields alongside the standard `type`, `title`, `status`, `detail`, and `instance`.
    ref: "concepts.md#problemdetail-rfc-7807-in-spring-6"

  - id: web-exception-handling-030
    difficulty: intermediate
    tags: [pipeline, propagation]
    question: |
      What happens if none of the registered `HandlerExceptionResolver`s handle a thrown exception?
    options:
      - "The DispatcherServlet returns HTTP 200 with an empty body and logs nothing"
      - "Spring silently ignores the exception and commits the partially written response"
      - "The request is retried automatically once before the failure is surfaced to the client"
      - "The exception is re-thrown and propagates to the servlet container"
    answer: 3
    explanation: |
      If no resolver produces a `ModelAndView`, `DispatcherServlet` re-throws the exception, which
      propagates to the servlet container (rendering a generic error page, or forwarding to `/error`
      under Spring Boot).
    ref: "concepts.md#the-exception-resolution-pipeline"

  - id: web-exception-handling-031
    difficulty: intermediate
    tags: [validation, method-argument-not-valid]
    question: |
      Which framework exception does `ResponseEntityExceptionHandler` provide a handler for when
      `@Valid` bean validation fails on a `@RequestBody`?
    options:
      - "MethodArgumentNotValidException"
      - "ConstraintViolationException"
      - "HttpMessageNotReadableException"
      - "IllegalArgumentException"
    answer: 0
    explanation: |
      Validation failures on an `@Valid @RequestBody` argument raise
      `MethodArgumentNotValidException`, for which `ResponseEntityExceptionHandler` provides the
      overridable `handleMethodArgumentNotValid` method (400 Bad Request).
    ref: "concepts.md#responseentityexceptionhandler"

  - id: web-exception-handling-032
    difficulty: intermediate
    tags: [ordering, catch-all]
    question: |
      What is the recommended placement of a global `@ExceptionHandler(Exception.class)` catch-all?
    options:
      - "In the highest-priority advice so it runs first and short-circuits the others"
      - "Duplicated inside every controller individually so each owns its own fallback"
      - "As the final, lowest-precedence fallback so it does not shadow specific handlers"
      - "Never; a broad Exception.class handler is forbidden and rejected at startup"
    answer: 2
    explanation: |
      A broad `Exception.class` handler should be the last-resort fallback (lowest precedence advice)
      so more specific handlers are matched first. Spring still prefers the most specific exception
      match, but keeping the catch-all low in precedence avoids surprises.
    ref: "concepts.md#building-consistent-error-responses"

  - id: web-exception-handling-033
    difficulty: intermediate
    tags: [web-mvc-configurer, resolvers]
    question: |
      In a `WebMvcConfigurer`, what is the difference between `extendHandlerExceptionResolvers`
      and `configureHandlerExceptionResolvers`?
    options:
      - "They are aliases with identical behavior"
      - "extendHandlerExceptionResolvers adds to the defaults; configureHandlerExceptionResolvers replaces them"
      - "extendHandlerExceptionResolvers replaces the defaults; configureHandlerExceptionResolvers adds to them"
      - "Both remove all default resolvers"
    answer: 1
    explanation: |
      `extendHandlerExceptionResolvers` appends custom resolvers to the default list, while
      `configureHandlerExceptionResolvers` replaces the defaults entirely (rarely what you want).
    ref: "concepts.md#handlerexceptionresolver-concept"

  - id: web-exception-handling-034
    difficulty: intermediate
    tags: [scope, filters]
    question: |
      Does an `@ExceptionHandler` (local or in `@ControllerAdvice`) catch exceptions thrown by a
      servlet `Filter`?
    options:
      - "Yes, every servlet-layer exception is routed through @ExceptionHandler resolvers"
      - "Only if the filter itself is additionally annotated with @ControllerAdvice"
      - "Only for unchecked RuntimeExceptions raised inside the filter's doFilter method"
      - "No, filters run outside the DispatcherServlet and need their own error handling"
    answer: 3
    explanation: |
      Spring MVC exception handling only covers exceptions arising within `DispatcherServlet`
      (controller methods, adapters, interceptors). Servlet filters execute before/around the
      DispatcherServlet and must handle their own errors.
    ref: "concepts.md#the-exception-resolution-pipeline"

  - id: web-exception-handling-035
    difficulty: intermediate
    tags: [response-status-vs-exception]
    question: |
      When would you prefer `ResponseStatusException` over `@ResponseStatus` on an exception class?
    options:
      - "When the status needs to be decided at runtime or you want to avoid many exception classes"
      - "When the same exception type must always map to one fixed, compile-time status code"
      - "When your code is forbidden from throwing exceptions and must signal errors via return codes"
      - "When you need the error to resolve to a server-rendered JSP view instead of a body"
    answer: 0
    explanation: |
      `@ResponseStatus` bakes a fixed status into the exception type. `ResponseStatusException` lets
      you choose the status dynamically at throw time, avoiding the need for a separate exception
      class per status.
    ref: "concepts.md#mapping-exceptions-to-http-status-with-responsestatus"

  - id: web-exception-handling-036
    difficulty: intermediate
    tags: [problem-detail, factory]
    question: |
      Which is a valid way to create a `ProblemDetail` for a 404 with a detail message?
    options:
      - "new ProblemDetail(404, \"Order not found\")"
      - "ProblemDetail.of(\"Order not found\").status(404)"
      - "ProblemDetail.forStatusAndDetail(HttpStatus.NOT_FOUND, \"Order not found\")"
      - "ProblemDetail.builder().notFound().build()"
    answer: 2
    explanation: |
      `ProblemDetail` exposes static factory methods such as
      `forStatus(...)` and `forStatusAndDetail(HttpStatusCode, String)`; it has no public
      constructor for arbitrary use like the other options suggest.
    ref: "concepts.md#problemdetail-rfc-7807-in-spring-6"

  - id: web-exception-handling-037
    difficulty: intermediate
    tags: [catching, ignores-response-status]
    question: |
      If you write an `@ExceptionHandler` that catches an exception carrying `@ResponseStatus`,
      what happens to that annotation's status?
    options:
      - "It still forces the status onto the response"
      - "It is ignored; your handler now controls the response"
      - "Spring throws an IllegalStateException at startup"
      - "The status is merged with your handler's return value"
    answer: 1
    explanation: |
      Once an `@ExceptionHandler` catches the exception, the `@ResponseStatus` on the exception class
      no longer applies. Your handler is responsible for setting the status (via `ResponseEntity` or
      its own `@ResponseStatus`).
    ref: "concepts.md#mapping-exceptions-to-http-status-with-responsestatus"

  - id: web-exception-handling-038
    difficulty: intermediate
    tags: [consistent-errors, approaches]
    question: |
      Which approach best ensures that BOTH your domain exceptions AND Spring's framework
      exceptions produce the same error-body shape?
    options:
      - "Add @ResponseStatus to every exception class, since that annotation also reshapes framework exception bodies"
      - "Use only controller-local @ExceptionHandler methods, which uniformly intercept framework exceptions across the app"
      - "Rely on the servlet container's default error page, which renders both exception types with one shared JSON template"
      - "Extend ResponseEntityExceptionHandler and override handleExceptionInternal to attach a common body"
    answer: 3
    explanation: |
      Extending `ResponseEntityExceptionHandler` lets you customize both framework exceptions (via
      the overridable methods / `handleExceptionInternal`) and your own domain exceptions in one
      advice, yielding one consistent body shape.
    ref: "concepts.md#building-consistent-error-responses"

  - id: web-exception-handling-039
    difficulty: intermediate
    tags: [exception-handler-resolver]
    question: |
      Which built-in resolver is responsible for locating and invoking `@ExceptionHandler` and
      `@ControllerAdvice` methods?
    options:
      - "ExceptionHandlerExceptionResolver"
      - "ResponseStatusExceptionResolver"
      - "DefaultHandlerExceptionResolver"
      - "SimpleMappingExceptionResolver"
    answer: 0
    explanation: |
      `ExceptionHandlerExceptionResolver` is the resolver that discovers and dispatches to matching
      `@ExceptionHandler` methods, whether controller-local or in a `@ControllerAdvice`.
    ref: "concepts.md#the-exception-resolution-pipeline"

  - id: web-exception-handling-040
    difficulty: beginner
    tags: [rfc-7807, spring-vs-boot]
    question: |
      Is `ProblemDetail` support available in plain Spring Framework 6 without Spring Boot?
    options:
      - "No, it requires Spring Boot auto-configuration to register the ProblemDetail message converter"
      - "No, it only works inside Spring GraphQL, which owns the sole ProblemDetail serializer implementation"
      - "Yes, it is a Spring Framework 6 feature usable in plain Spring MVC and WebFlux"
      - "Yes, but only for XML responses, since ProblemDetail lacks a registered JSON serializer in core"
    answer: 2
    explanation: |
      `ProblemDetail` and `ErrorResponse` are Spring Framework 6 features and work in plain Spring
      MVC/WebFlux. Spring Boot 3 merely adds a convenience property
      (`spring.mvc.problemdetails.enabled`) to auto-enable them for framework exceptions.
    ref: "concepts.md#problemdetail-rfc-7807-in-spring-6"

  - id: web-exception-handling-041
    difficulty: beginner
    tags: [response-entity, control]
    question: |
      What is the advantage of returning a `ResponseEntity<T>` from an `@ExceptionHandler` method?
    options:
      - "It automatically retries the request with a configurable backoff before responding"
      - "It gives full control over status code, headers, and body"
      - "It bypasses HttpMessageConverters and writes the body as raw bytes directly to the stream"
      - "It is required before any @ControllerAdvice handler method will be detected by Spring"
    answer: 1
    explanation: |
      `ResponseEntity` lets the handler set the HTTP status, response headers, and body explicitly,
      giving the most control over the error response.
    ref: "concepts.md#exceptionhandler-controller-local"

  - id: web-exception-handling-042
    difficulty: intermediate
    tags: [ordering, multiple-advices]
    question: |
      How is the relative precedence of multiple `@ControllerAdvice` beans determined?
    options:
      - "Alphabetically by bean name"
      - "By the number of @ExceptionHandler methods they contain"
      - "It is random and cannot be controlled"
      - "By @Order / Ordered / @Priority"
    answer: 3
    explanation: |
      Multiple `@ControllerAdvice` beans are ordered using `@Order`, the `Ordered` interface, or
      `@Priority`, which controls the sequence in which they are consulted.
    ref: "concepts.md#controlleradvice-and-restcontrolleradvice-global"

  - id: web-exception-handling-043
    difficulty: expert
    tags: [advice-ordering, shadowing, controller-advice]
    question: |
      Advice A (`@Order(1)`) declares `@ExceptionHandler(Exception.class)`. Advice B (`@Order(2)`)
      declares `@ExceptionHandler(OrderNotFoundException.class)`. A controller (with no local
      handler) throws `OrderNotFoundException`. Which handler runs, and why?
    options:
      - "A's handler, because the resolver iterates advices in @Order sequence and the FIRST advice with any match wins; B is never consulted"
      - "B's handler, because Spring always selects the most specific exception match across all advices"
      - "Both run in order, A first then B, and the framework merges their two returned bodies into one response"
      - "Neither; the resolver detects the cross-advice ambiguity and raises an IllegalStateException at request time"
    answer: 0
    explanation: |
      Specificity via `ExceptionDepthComparator` only decides *within* one advice. Across advices,
      `ExceptionHandlerExceptionResolver` iterates `ControllerAdviceBean`s in `@Order` sequence and
      stops at the first advice that has any matching handler. A (order 1) matches `Exception`, so
      A wins and B's more specific handler is never reached. This is why the catch-all belongs in the
      lowest-priority advice.
    ref: "concepts.md#controlleradvice-and-restcontrolleradvice-global"

  - id: web-exception-handling-044
    difficulty: expert
    tags: [matching, ambiguity, exception-depth-comparator]
    question: |
      A single `@ControllerAdvice` has `@ExceptionHandler(InterfaceA.class)` and
      `@ExceptionHandler(InterfaceB.class)`. A thrown exception implements BOTH interfaces at the
      same inheritance depth. What happens?
    options:
      - "The handler declared first in source order is chosen, since ties fall back to declaration order"
      - "Spring throws IllegalStateException reporting an ambiguous @ExceptionHandler mapping"
      - "Spring silently invokes both and merges their return values"
      - "The exception propagates unhandled because neither is a class match"
    answer: 1
    explanation: |
      `ExceptionHandlerMethodResolver` collects all assignable mappings and sorts by depth. When two
      mappings tie at the same minimal depth (possible via unrelated interfaces), Spring throws
      `IllegalStateException("Ambiguous @ExceptionHandler method mapped for ...")` — an eager,
      fail-fast error rather than an arbitrary pick.
    ref: "concepts.md#exceptionhandler-controller-local"

  - id: web-exception-handling-045
    difficulty: expert
    tags: [mapping-keys, annotation-vs-parameter]
    question: |
      A handler is declared `@ExceptionHandler({IOException.class, SQLException.class}) public
      ResponseEntity<?> h(Exception ex)`. A `RuntimeException` (unrelated to IOException/SQLException)
      is thrown and no other handler exists. Does this handler match it?
    options:
      - "No, because when the annotation lists exception types, those become the mapping keys; the parameter type Exception is ignored for matching"
      - "Yes, because the method parameter type is Exception, which is a supertype of RuntimeException"
      - "Yes, because Spring unions the annotation values with the parameter type"
      - "It throws at startup because the parameter type is broader than the annotation values"
    answer: 0
    explanation: |
      When `@ExceptionHandler` declares explicit types, THOSE are the mapping keys — here
      `IOException` and `SQLException`. The parameter type is only used to derive mappings when the
      annotation value is empty. So a `RuntimeException` does not match, and it falls through.
    ref: "concepts.md#exceptionhandler-controller-local"

  - id: web-exception-handling-046
    difficulty: advanced
    tags: [cause-unwrapping, matching]
    question: |
      A service wraps the real error: it throws `ServiceException` whose cause is
      `OrderNotFoundException`. An advice has handlers for BOTH `ServiceException` and
      `OrderNotFoundException`. Which one is invoked (Spring 5.3+)?
    options:
      - "The OrderNotFoundException handler, because Spring unwraps getCause() first and always prefers the deepest wrapped cause"
      - "Neither; once an exception is wrapped inside another its cause is never inspected by the resolver chain"
      - "Both handlers run, the cause handler first and then the wrapper handler, with their bodies concatenated"
      - "The ServiceException handler, because the top-level exception is matched against all handlers first, and cause unwrapping only happens if nothing matches the top level"
    answer: 3
    explanation: |
      Spring first tries the top-level exception type against all candidate handlers. Only if none
      match does it unwrap `getCause()` and retry. Since `ServiceException` has a handler, that wins;
      the cause handler is never consulted. A handler for the wrapper shadows one for the cause.
    ref: "concepts.md#exceptionhandler-controller-local"

  - id: web-exception-handling-047
    difficulty: expert
    tags: [pre-empt, response-status, ordering]
    question: |
      An exception class is annotated `@ResponseStatus(HttpStatus.NOT_FOUND)`. A high-priority
      `@ControllerAdvice` also has `@ExceptionHandler(Exception.class)` returning a 500 body.
      The controller throws that exception. What status does the client see?
    options:
      - "404, because @ResponseStatus on the exception class always takes precedence over any @ExceptionHandler that also matches"
      - "404, because ResponseStatusExceptionResolver is registered with higher precedence than the annotation resolver"
      - "500, because ExceptionHandlerExceptionResolver runs before ResponseStatusExceptionResolver, and the catch-all @ExceptionHandler matches first"
      - "The request fails with an ambiguity error because two competing resolvers both claim the exception at once"
    answer: 2
    explanation: |
      `ExceptionHandlerExceptionResolver` is first in the chain. The catch-all `@ExceptionHandler
      (Exception.class)` matches and handles the exception, returning 500. `@ResponseStatus` is only
      honored by `ResponseStatusExceptionResolver`, which never runs because an earlier resolver
      already handled it. A matching `@ExceptionHandler` pre-empts `@ResponseStatus`.
    ref: "concepts.md#ordering-and-precedence-across-mechanisms"

  - id: web-exception-handling-048
    difficulty: advanced
    tags: [send-error, response-status, reason]
    question: |
      In a pure REST app, a `@ResponseStatus(code = HttpStatus.NOT_FOUND, reason = "Missing")`
      exception propagates unhandled. A client with `Accept: application/json` often receives an
      HTML error page instead of JSON. Why?
    options:
      - "Because @ResponseStatus unregisters all HttpMessageConverters for the duration of that request, leaving only the HTML writer"
      - "Because a non-empty reason triggers response.sendError(code, reason), which commits the response and forwards to the container error page, bypassing your message converters"
      - "Because Spring MVC never negotiates JSON for 404 responses and always renders them as an HTML status page"
      - "Because the reason attribute overrides content negotiation and pins the ProblemDetail's content type to text/html"
    answer: 1
    explanation: |
      A present `reason` makes `ResponseStatusExceptionResolver` call `sendError(code, reason)`, which
      commits the response and triggers the container's error-page mechanism (or `/error` under Boot)
      — an HTML page, not your JSON. To get a real JSON/`ProblemDetail` body written by message
      converters, handle the exception with an `@ExceptionHandler`/`@ControllerAdvice`
      (e.g. `ResponseEntityExceptionHandler`) rather than letting `ResponseStatusExceptionResolver`
      resolve it. Note `ResponseStatusException` is also resolved by that resolver via the same
      `sendError` path, so throwing it does not by itself avoid the forward.
    ref: "concepts.md#mapping-exceptions-to-http-status-with-responsestatus"

  - id: web-exception-handling-049
    difficulty: advanced
    tags: [interceptor, after-completion, pipeline]
    question: |
      A `HandlerInterceptor.afterCompletion(...)` method throws a RuntimeException. Will your
      `@ControllerAdvice` `@ExceptionHandler` handle it?
    options:
      - "No, afterCompletion runs after the DispatcherServlet's try block (during cleanup), so its exception propagates to the container and is not resolvable"
      - "Yes, every interceptor callback including afterCompletion is wrapped by processHandlerException and routed through the resolver chain"
      - "Only if the interceptor is additionally registered as a @ControllerAdvice bean so its exceptions become resolvable"
      - "Yes, but only the highest-priority advice is consulted for interceptor-thrown exceptions during cleanup"
    answer: 0
    explanation: |
      Only `preHandle` and `postHandle` are inside `doDispatch`'s try block. `afterCompletion`
      executes afterward during cleanup/rendering, outside the region routed to
      `processHandlerException`. An exception there propagates to the servlet container.
    ref: "concepts.md#the-exception-resolution-pipeline"

  - id: web-exception-handling-050
    difficulty: expert
    tags: [null-handler, no-handler-found, controller-advice]
    question: |
      With `NoHandlerFoundException` enabled, a request hits no mapped handler. Why can a
      controller-LOCAL `@ExceptionHandler` never handle this, while a `@ControllerAdvice` can?
    options:
      - "Because NoHandlerFoundException is a checked exception, and controller-local @ExceptionHandler methods are restricted to unchecked runtime types"
      - "Because NoHandlerFoundException is resolved exclusively by DefaultHandlerExceptionResolver, which ignores advices"
      - "Because controller-local handlers only fire for exceptions thrown after the response has already begun streaming to the client"
      - "Because the handler argument passed to the resolver is null; ExceptionHandlerExceptionResolver needs a HandlerMethod to locate controller-local handlers, so only advice-based handlers are eligible"
    answer: 3
    explanation: |
      When no handler is matched, the `handler` passed to `resolveException` is `null`. Controller-
      local `@ExceptionHandler` lookup requires the failing `HandlerMethod`'s class; with a null
      handler there is none, so only `@ControllerAdvice` handlers (context-wide) can match.
    ref: "concepts.md#the-exception-resolution-pipeline"

  - id: web-exception-handling-051
    difficulty: advanced
    tags: [thread-safety, controller-advice, concurrency]
    question: |
      A `@RestControllerAdvice` stores `private Exception lastError;` in an instance field and reads
      it inside its handler to build the response. Under concurrent load, what is the defect?
    options:
      - "None; Spring instantiates a fresh advice bean per request, so the lastError field is naturally isolated"
      - "It causes a memory leak because the retained exception references pin their stack traces and are never garbage-collected"
      - "A data race: the advice is a singleton shared across request threads, so one request can observe another request's exception"
      - "It forces every request to serialize on the shared field, killing throughput while still returning correct results"
    answer: 2
    explanation: |
      `@ControllerAdvice` beans are singletons invoked concurrently. Mutable instance state creates a
      race where threads clobber and read each other's values. Keep handlers stateless; take request
      data via method parameters (`WebRequest`, `HttpServletRequest`) or inject request-scoped beans.
    ref: "concepts.md#controlleradvice-and-restcontrolleradvice-global"

  - id: web-exception-handling-052
    difficulty: expert
    tags: [response-committed, streaming, failure-mode]
    question: |
      A handler returns a `StreamingResponseBody` that writes 5 MB and then throws midway. Your
      `@ExceptionHandler(IOException.class)` returning a 500 ProblemDetail appears to "run" but the
      client still receives status 200 with a truncated body. Why?
    options:
      - "Because exceptions thrown from a StreamingResponseBody are deliberately swallowed and never routed to any resolver"
      - "Because once the first bytes were flushed the response was committed; the status line and headers are frozen, so the resolver cannot change 200 to 500"
      - "Because ProblemDetail can only be serialized to a buffered response and is skipped entirely for streaming bodies"
      - "Because @ExceptionHandler supports only ResponseEntity return types, never ProblemDetail, when the handler was a stream"
    answer: 1
    explanation: |
      After the response is committed (bytes flushed to the client), status and headers cannot be
      altered. The resolver may run but can only stop writing; it cannot rewrite an already-sent 200
      into a 500. Streaming/SSE responses are especially prone to this.
    ref: "concepts.md#failure-modes-when-handling-an-exception"

  - id: web-exception-handling-053
    difficulty: expert
    tags: [handler-throws, recursion, failure-mode]
    question: |
      Your `@ExceptionHandler(Exception.class)` itself throws a `NullPointerException` while building
      the error body. What does Spring MVC do?
    options:
      - "It logs both the original and the handler-thrown exception and lets the new exception propagate to the container; it does NOT recursively re-run your advices"
      - "It re-resolves the NullPointerException through the same advices, potentially recursing"
      - "It silently swallows the handler failure and returns HTTP 200 with an empty body to the client"
      - "It retries the original @ExceptionHandler method up to three times before giving up on a response"
    answer: 0
    explanation: |
      `ExceptionHandlerExceptionResolver` does not recursively re-resolve an exception thrown by the
      handler itself. It logs the original and the newly thrown exception, and the new one propagates
      to the container. There is no infinite recursion, but no second chance from your advices either.
    ref: "concepts.md#failure-modes-when-handling-an-exception"

  - id: web-exception-handling-054
    difficulty: advanced
    tags: [content-negotiation, problem-detail, failure-mode]
    question: |
      A client sends `Accept: application/xml` (with no XML converter configured for the error type).
      An exception occurs and your handler returns a `ProblemDetail`. What is the likely outcome?
    options:
      - "Spring detects the missing XML converter and transparently falls back to JSON, returning 500 with application/problem+json"
      - "The request hangs on the blocked write until the server's async negotiation timeout finally elapses and closes it"
      - "The ProblemDetail is silently serialized as plain text using the object's toString() representation as a fallback"
      - "A secondary HttpMediaTypeNotAcceptableException is raised during rendering, and the client ends up with a 406 from the container rather than your intended body"
    answer: 3
    explanation: |
      `ProblemDetail` is still written by an `HttpMessageConverter` subject to content negotiation.
      If no converter can satisfy the client's `Accept`, a fresh `HttpMediaTypeNotAcceptableException`
      arises while rendering the error body, typically surfacing as a 406 — a secondary failure.
    ref: "concepts.md#failure-modes-when-handling-an-exception"

  - id: web-exception-handling-055
    difficulty: advanced
    tags: [response-entity-exception-handler, constraint-violation]
    question: |
      You extend `ResponseEntityExceptionHandler` and expect it to format ALL validation errors
      uniformly. A `@Validated` service bean (outside the web layer) fails a constraint and raises
      `ConstraintViolationException`, but it is NOT formatted like your other errors. Why?
    options:
      - "Because ConstraintViolationException is always intercepted first by ResponseStatusExceptionResolver, which formats it before your base class is ever consulted"
      - "Because @Validated switches the bean to method-level proxying, which deactivates every handler inherited from ResponseEntityExceptionHandler"
      - "Because ConstraintViolationException is a Jakarta Bean Validation type, not a Spring MVC exception; ResponseEntityExceptionHandler does not declare a handler for it"
      - "Because the base class only handles exceptions originating from @RequestBody deserialization, while service-layer beans are routed to a separate resolver"
    answer: 2
    explanation: |
      `ResponseEntityExceptionHandler` handles `MethodArgumentNotValidException` (from `@Valid
      @RequestBody`) but NOT `ConstraintViolationException`, which comes from Jakarta Bean Validation
      on a `@Validated` bean and is not a Spring MVC exception. You must add your own handler for it.
      (Note: since Spring 6.1, validation on *controller* method parameters raises
      `HandlerMethodValidationException`, which the base class does handle — so the un-handled case is
      specifically the `ConstraintViolationException` from `@Validated` beans.)
    ref: "concepts.md#responseentityexceptionhandler"

  - id: web-exception-handling-056
    difficulty: expert
    tags: [handle-exception-internal, null-body, spring6]
    question: |
      In Spring 6, you call `handleExceptionInternal(ex, null, headers, HttpStatus.NOT_FOUND, request)`
      passing a NULL body. What body does the client receive?
    options:
      - "An empty response body with only the 404 status line, behaving exactly as it did in Spring 5"
      - "The exception's ProblemDetail (from ErrorResponse.updateAndGetBody(...)) is substituted as the body when the exception implements ErrorResponse"
      - "A plain-text body containing ex.toString(), which Spring writes via the StringHttpMessageConverter fallback"
      - "An HTTP 500 error, because passing a null body to handleExceptionInternal is rejected as an illegal argument"
    answer: 1
    explanation: |
      In Spring 6, `handleExceptionInternal` substitutes the exception's `ProblemDetail`
      (via `ErrorResponse.updateAndGetBody(...)`) when the body is null and the exception implements
      `ErrorResponse`. So a null body no longer means "empty response" as it did in Spring 5.
    ref: "concepts.md#responseentityexceptionhandler"

  - id: web-exception-handling-057
    difficulty: advanced
    tags: [advice-discovery, child-context, dispatcher-servlet]
    question: |
      A `@ControllerAdvice` bean is defined ONLY in a second `DispatcherServlet`'s own child
      context. Why does it not affect requests served by the first `DispatcherServlet`?
    options:
      - "Because ExceptionHandlerExceptionResolver scans for advices per DispatcherServlet context at startup; each servlet builds its own view, and a bean in another servlet's context is invisible"
      - "Because @ControllerAdvice beans are only ever discovered from the root WebApplicationContext, so servlet child contexts cannot contribute advices at all"
      - "Because @ControllerAdvice beans must be declared prototype-scoped before Spring will share their handlers across separate DispatcherServlet instances"
      - "Because advices registered in a child context are silently ignored once the first DispatcherServlet has finished its startup initialization"
    answer: 0
    explanation: |
      Advice discovery happens once per `DispatcherServlet`'s `ExceptionHandlerExceptionResolver`
      (in `afterPropertiesSet`). Beans in the root context are visible to all servlets, but a bean
      only in servlet-2's child context is not visible to servlet-1's resolver.
    ref: "concepts.md#controlleradvice-and-restcontrolleradvice-global"

  - id: web-exception-handling-058
    difficulty: advanced
    tags: [model-and-view, contract, custom-resolver]
    question: |
      A custom `HandlerExceptionResolver` fully writes a JSON error to the response and then returns
      `new ModelAndView()` (an empty ModelAndView). What does `DispatcherServlet` conclude?
    options:
      - "The exception was not handled, so DispatcherServlet moves on and consults the next resolver in the configured chain"
      - "It throws immediately, because an empty ModelAndView carrying neither a view nor a model is rejected as an invalid return value"
      - "It falls back to rendering a default error view whose logical name is derived from the empty ModelAndView instance"
      - "The exception is handled and the response is already written, so no view rendering occurs"
    answer: 3
    explanation: |
      Returning an empty (`isEmpty()`) `ModelAndView` means "handled; response already fully written,
      do not render a view." Returning `null` would mean "not handled, try the next resolver." A
      non-empty `ModelAndView` would trigger view rendering.
    ref: "concepts.md#handlerexceptionresolver-concept"

  - id: web-exception-handling-059
    difficulty: expert
    tags: [extend-resolvers, ordering, cannot-pre-empt]
    question: |
      You add a custom resolver via `WebMvcConfigurer.extendHandlerExceptionResolvers(...)` intending
      it to run BEFORE `ExceptionHandlerExceptionResolver`. It never fires for exceptions your
      `@ControllerAdvice` also matches. Why, and what actually fixes it?
    options:
      - "You must annotate the custom resolver with @Primary, which promotes it ahead of the built-in resolvers in the composite ordering"
      - "Custom resolvers registered this way are hard-wired to run last no matter their order value, and there is no supported way to change it"
      - "extendHandlerExceptionResolvers appends after the defaults, so it only sees exceptions the defaults declined; to pre-empt you must register a resolver bean with a lower order (often replacing the default config)"
      - "It only fires for checked exceptions by design, so re-declaring it to target RuntimeException makes it run ahead of the annotation resolver"
    answer: 2
    explanation: |
      `extendHandlerExceptionResolvers` appends to the end of the ordered list, so your resolver runs
      after the built-ins and only sees what they declined. To run first you need a resolver bean with
      a lower `Ordered` value (and typically to reconfigure rather than merely extend).
    ref: "concepts.md#handlerexceptionresolver-concept"

  - id: web-exception-handling-060
    difficulty: advanced
    tags: [response-status-inheritance, meta-annotation]
    question: |
      `BaseDomainException` is annotated `@ResponseStatus(HttpStatus.CONFLICT)`.
      `StockConflictException extends BaseDomainException` adds no annotation. It propagates
      unhandled. What status is set?
    options:
      - "500, because @ResponseStatus is not an inherited annotation and the resolver only inspects the concrete thrown class"
      - "409, because @ResponseStatus is discovered via findMergedAnnotation, which walks superclasses and meta-annotations"
      - "200, because the subclass declares no annotation of its own and the resolver leaves the default success status in place"
      - "It throws a configuration error at resolution time because the concrete subclass carries no @ResponseStatus of its own"
    answer: 1
    explanation: |
      `ResponseStatusExceptionResolver` uses `AnnotatedElementUtils.findMergedAnnotation`, which
      resolves `@ResponseStatus` through superclasses and meta-annotations. So the subclass inherits
      the parent's 409.
    ref: "concepts.md#mapping-exceptions-to-http-status-with-responsestatus"

  - id: web-exception-handling-061
    difficulty: advanced
    tags: [init-binder, model-attribute, exception-handler]
    question: |
      Are `@InitBinder` and `@ModelAttribute` methods (in the same controller/advice) applied when an
      `@ExceptionHandler` method is invoked?
    options:
      - "No; @ExceptionHandler methods are invoked without data binding, so @InitBinder/@ModelAttribute are not applied, though argument resolvers and return-value handlers still are"
      - "Yes, they run exactly as they would for a normal @RequestMapping method, with the full binding and model-population lifecycle applied first"
      - "Only @ModelAttribute methods run to pre-populate the model; @InitBinder is skipped because there is no data binder to configure for an error"
      - "Only @InitBinder methods run to set up the binder; @ModelAttribute is skipped because the error path never populates the model"
    answer: 0
    explanation: |
      There is no request-body/parameter binding for exception handlers, so `@InitBinder` and
      `@ModelAttribute` are not applied. The method is still invoked through `InvocableHandlerMethod`,
      so supported argument resolvers and return-value handlers (message converters, view resolution)
      apply.
    ref: "concepts.md#exceptionhandler-controller-local"

  - id: web-exception-handling-062
    difficulty: expert
    tags: [async, deferred-result, timeout]
    question: |
      A controller returns a `DeferredResult`. It never completes, and the async timeout elapses.
      How does `AsyncRequestTimeoutException` reach your `@ControllerAdvice`, given the original
      request thread already returned?
    options:
      - "It cannot reach the advice at all; async timeouts complete the response directly and bypass the exception-resolution chain entirely"
      - "The container performs an ASYNC error dispatch that re-enters DispatcherServlet, which routes AsyncRequestTimeoutException through the resolver chain on the dispatched thread"
      - "Spring's async task executor polls the DeferredResult from a background worker and invokes the matching advice method directly on that thread"
      - "The advice is invoked back on the original request thread, which Spring reconstructs from a captured ThreadLocal request snapshot"
    answer: 1
    explanation: |
      On timeout the container issues an async error dispatch that re-enters `DispatcherServlet`; the
      `AsyncRequestTimeoutException` (or your set error result) is then processed through the normal
      resolver chain, so `@ExceptionHandler`/`ResponseEntityExceptionHandler` can handle it.
    ref: "concepts.md#failure-modes-when-handling-an-exception"

  - id: web-exception-handling-063
    difficulty: expert
    tags: [async, raw-thread, invisible]
    question: |
      Inside a `@GetMapping` method you spawn a raw `new Thread(() -> { throw new RuntimeException(); })`
      and return immediately. The thread throws. Does any `@ExceptionHandler` see it?
    options:
      - "Yes; Spring MVC installs a request-scoped uncaught-exception handler that captures exceptions from every thread spawned during the request"
      - "Yes, but only when the surrounding advice class is itself annotated @Async so its handlers run on the same executor"
      - "No; only exceptions surfaced through the managed Callable/DeferredResult contract (or thrown on the request thread) go through the resolver chain — a raw thread's exception is invisible to Spring MVC"
      - "Only when the spawned thread is created as a daemon thread, since Spring can then attach it to the request lifecycle"
    answer: 2
    explanation: |
      Spring MVC exception handling covers exceptions thrown on the request thread or surfaced via the
      managed async contracts (`Callable`, `DeferredResult`, `CompletableFuture` return values). An
      exception on a bare thread you spawned is outside that contract and never reaches the resolvers.
    ref: "concepts.md#failure-modes-when-handling-an-exception"

  - id: web-exception-handling-064
    difficulty: advanced
    tags: [problem-detail, controller, response-body]
    question: |
      A plain `@Controller` (not `@RestController`, method not `@ResponseBody`) has an
      `@ExceptionHandler` that returns a `ProblemDetail`. What happens?
    options:
      - "It is detected as a ProblemDetail and serialized automatically as application/problem+json, regardless of the missing @ResponseBody"
      - "The ProblemDetail is treated as a model attribute (view-resolution path), NOT serialized, because there is no @ResponseBody semantics"
      - "Spring throws an error at return time because a ProblemDetail is not a permitted model attribute type in view resolution"
      - "It returns HTTP 500, because ProblemDetail responses are only supported inside a @RestController or @RestControllerAdvice"
    answer: 1
    explanation: |
      Without `@ResponseBody`/`@RestController`, a returned object — including a `ProblemDetail` — is
      interpreted as a model attribute and routed to view resolution, not written via message
      converters. You need `@ResponseBody` (or `@RestControllerAdvice`) for serialization.
    ref: "concepts.md#problemdetail-rfc-7807-in-spring-6"

  - id: web-exception-handling-065
    difficulty: expert
    tags: [problem-detail, extension, collision]
    question: |
      You build a `ProblemDetail` and call `pd.setProperty("status", "critical")` as an extension
      member (intending a business "status"). What is the risk?
    options:
      - "None whatsoever; extension members are serialized under a separate nested object, keeping them isolated from the standard fields"
      - "Spring throws an IllegalArgumentException from setProperty because the five reserved RFC 7807 names are rejected as extension keys"
      - "The extension key collides with the standard RFC 7807 'status' member during flattened top-level serialization, producing a malformed/ambiguous body"
      - "The property is silently discarded during serialization, leaving only the numeric status member and having no other observable effect"
    answer: 2
    explanation: |
      Extension properties are serialized flattened at the top level alongside the standard members.
      A key that collides with a standard name (`status`, `title`, `type`, `detail`, `instance`) is a
      bug — the RFC 7807 `status` is an integer HTTP status, and your string clobbers/duplicates it.
    ref: "concepts.md#problemdetail-rfc-7807-in-spring-6"

  - id: web-exception-handling-066
    difficulty: advanced
    tags: [problem-detail, i18n, message-source]
    question: |
      You set a `MessageSource` on your `ResponseEntityExceptionHandler` subclass to localize
      ProblemDetail messages. By default, what message code resolves the `detail` for a framework
      exception?
    options:
      - "The exception's literal getMessage() text, which is passed through verbatim and never routed through the MessageSource for lookup"
      - "problemDetail. + the fully-qualified exception class name, with arguments from getDetailMessageArguments()"
      - "error. + the numeric HTTP status code, so all exceptions mapping to the same status share one detail message key"
      - "problemDetail.default, a single shared fallback key used for the detail of every framework exception alike"
    answer: 1
    explanation: |
      `ErrorResponse` uses the code `problemDetail.` + the fully-qualified exception class name for
      `detail` (and `problemDetail.title.` + class name for the title), with substitution arguments
      from `getDetailMessageArguments()`. `handleExceptionInternal` localizes when a `MessageSource`
      is present.
    ref: "concepts.md#problemdetail-rfc-7807-in-spring-6"

  - id: web-exception-handling-067
    difficulty: expert
    tags: [override-dead-code, ordering, response-entity-exception-handler]
    question: |
      You override `handleMethodArgumentNotValid` in your `ResponseEntityExceptionHandler` subclass,
      but a SEPARATE `@ControllerAdvice(@Order(HIGHEST_PRECEDENCE))` also declares
      `@ExceptionHandler(MethodArgumentNotValidException.class)`. Which runs?
    options:
      - "The higher-order advice's handler; the base class methods are ordinary @ExceptionHandler methods with no special elevation, so advice ordering decides and your override is dead code"
      - "Your subclass override always wins, because ResponseEntityExceptionHandler's framework methods are registered with an elevated internal priority"
      - "Both handlers are invoked in advice order and the two returned ResponseEntity bodies are merged into a single response"
      - "Spring fails fast at startup, rejecting the context because two advices both declare a handler for MethodArgumentNotValidException"
    answer: 0
    explanation: |
      `ResponseEntityExceptionHandler`'s methods are just normal `@ExceptionHandler` methods. Nothing
      elevates them. A higher-`@Order` advice with a matching handler wins, making your override dead
      code. Precedence is by advice order/locality, not by subclassing the base class.
    ref: "concepts.md#responseentityexceptionhandler"

  - id: web-exception-handling-068
    difficulty: advanced
    tags: [caching, concurrent-hash-map, performance]
    question: |
      How does `ExceptionHandlerMethodResolver` avoid walking the exception hierarchy on every
      request for a repeated exception type?
    options:
      - "It rebuilds the full exception-to-method mapping table on every request to guarantee the most current handler is always chosen"
      - "It caches resolved (exceptionType -> Method) lookups in a ConcurrentHashMap after the first tree walk"
      - "It marks the entire resolve method as synchronized so only one request thread performs hierarchy matching at any moment"
      - "It disables further hierarchy matching after the first exception and blindly reuses whichever handler was selected last"
    answer: 1
    explanation: |
      After the first `getMappedMethod` tree walk for a given exception type, the result is cached in
      a `ConcurrentHashMap`, so subsequent occurrences of that type are O(1) lookups — thread-safe and
      allocation-free on the hot path.
    ref: "concepts.md#exceptionhandler-controller-local"

  - id: web-exception-handling-069
    difficulty: expert
    tags: [response-committed, abstract-resolver, headers]
    question: |
      `AbstractHandlerExceptionResolver.doResolveException` is reached but the response is already
      committed. What is its documented behavior (Spring 4.3.9+)?
    options:
      - "It skips resolution and returns null, logging a warning that the response is already committed"
      - "It forcibly calls response.resetBuffer() to discard the sent bytes and then rewrites the status line and error body"
      - "It throws an IllegalStateException to abort the request once it detects the response can no longer be modified"
      - "It buffers the newly built error body internally and replays it on the client's next request to the same URL"
    answer: 0
    explanation: |
      When the response is committed, `AbstractHandlerExceptionResolver` cannot change status/headers,
      so it declines (returns null) and logs a warning. This is where the "response committed → cannot
      handle" rule lives for the built-in resolvers.
    ref: "concepts.md#handlerexceptionresolver-concept"

  - id: web-exception-handling-070
    difficulty: advanced
    tags: [prevent-response-caching, headers]
    question: |
      By default, what side effect does `AbstractHandlerExceptionResolver` have on the response
      headers of a resolved error (beyond status/body)?
    options:
      - "It adds a Retry-After header advising the client how many seconds to wait before retrying the failed request"
      - "It adds an X-Error-Id correlation header populated with a generated identifier for tracing the error in logs"
      - "It strips every custom header the handler set on the response so only the error status and body remain"
      - "It sets Cache-Control headers to prevent caching of the error response (preventResponseCaching)"
    answer: 3
    explanation: |
      `AbstractHandlerExceptionResolver` has a `preventResponseCaching` behavior that, when enabled,
      writes `Cache-Control` (no-store style) headers so error responses are not cached. It does not
      add correlation or Retry-After headers automatically.
    ref: "concepts.md#handlerexceptionresolver-concept"

  - id: web-exception-handling-071
    difficulty: expert
    tags: [same-class, catch-all, depth]
    question: |
      One class both `extends ResponseEntityExceptionHandler` AND adds
      `@ExceptionHandler(Exception.class)`. A `HttpMessageNotReadableException` is thrown. Which
      method handles it?
    options:
      - "Your Exception.class catch-all, because it is declared in the subclass and subclass methods win"
      - "Neither; declaring both in one class is a configuration error"
      - "The inherited handleHttpMessageNotReadable path, because within one advice ExceptionDepthComparator picks the more specific match over Exception.class"
      - "Both, in declaration order"
    answer: 2
    explanation: |
      Within a single advice class, `ExceptionDepthComparator` selects the closest match. The base
      class's handler for `HttpMessageNotReadableException` (mapped via the framework method) is far
      more specific than `Exception.class`, so it wins. The catch-all only fires for otherwise
      unmatched exceptions.
    ref: "concepts.md#responseentityexceptionhandler"

  - id: web-exception-handling-072
    difficulty: advanced
    tags: [http-message-not-writable, failure-mode]
    question: |
      Your error DTO includes a field backed by an uninitialized lazy Hibernate proxy. When the
      handler serializes it, what exception class typically surfaces, and when?
    options:
      - "MethodArgumentNotValidException, raised at binding time when Spring detects the uninitialized proxy before invoking the handler"
      - "HttpMessageNotWritableException, during the message-converter write of the error body — a secondary failure while rendering the error"
      - "HttpMessageNotReadableException, raised while deserializing the incoming request body before the handler even runs"
      - "ResponseStatusException, thrown deliberately by the converter with a 500 status when it encounters the unresolvable proxy"
    answer: 1
    explanation: |
      Serialization problems (unresolvable lazy proxy, no serializer) raise
      `HttpMessageNotWritableException` during the converter's write phase — a secondary failure that
      occurs while rendering the error body, after the primary exception was "handled."
    ref: "concepts.md#failure-modes-when-handling-an-exception"

  - id: web-exception-handling-073
    difficulty: expert
    tags: [view-rendering, not-resolvable, pipeline]
    question: |
      A controller returns a view name; during `View.render(...)` the template throws. Why is your
      `@ExceptionHandler` generally NOT a reliable place to catch this?
    options:
      - "Because rendering occurs after handler execution, outside the region routed to processHandlerException; DispatcherServlet triggers afterCompletion and rethrows rather than re-running the resolver chain"
      - "Because exceptions thrown inside a view template are always checked exceptions, and the resolver chain is hard-wired to ignore checked types raised during rendering"
      - "Because @ExceptionHandler methods only match exceptions that carry a @ResponseStatus annotation, and view templates throw plain runtime errors that lack one"
      - "Because the view layer renders on a detached worker thread, so the ThreadLocal request context the resolver chain relies on is no longer available during render"
    answer: 0
    explanation: |
      Exception resolution wraps handler execution (and pre/postHandle). View rendering happens
      afterward; a render failure leads `DispatcherServlet` to trigger `afterCompletion` and rethrow,
      not to re-enter the resolver chain, so `@ExceptionHandler` is not a dependable catch point.
    ref: "concepts.md#the-exception-resolution-pipeline"

  - id: web-exception-handling-074
    difficulty: advanced
    tags: [response-status-exception, headers, subclasses]
    question: |
      Which capability do `ResponseStatusException` subclasses like `MethodNotAllowedException` and
      `UnsupportedMediaTypeStatusException` add beyond a plain status?
    options:
      - "They automatically re-dispatch the failed request using a corrected HTTP method or media type inferred from the exception"
      - "They bypass every registered HandlerExceptionResolver and write their status directly to the servlet response themselves"
      - "They force the error body to be serialized as XML regardless of the client's Accept header or configured converters"
      - "They let you attach response headers relevant to the error (e.g. Allow, Accept) via the exception itself"
    answer: 3
    explanation: |
      These `ErrorResponse`-implementing subclasses carry status, a ProblemDetail body, AND relevant
      headers (e.g. `Allow` for 405, `Accept` for 415). When resolved by an `@ExceptionHandler`
      /`ResponseEntityExceptionHandler` (via the `ErrorResponseException` handler), the headers and a
      `ProblemDetail` body are written by message converters. Note that if `ResponseStatusExceptionResolver`
      resolves the exception instead, it copies the headers onto the response but then calls
      `sendError`, so the body is the container error page rather than a `ProblemDetail`.
    ref: "concepts.md#mapping-exceptions-to-http-status-with-responsestatus"

  - id: web-exception-handling-075
    difficulty: expert
    tags: [composite, ordering, dispatcher]
    question: |
      Under `@EnableWebMvc`, how does `DispatcherServlet` actually consult the three default
      resolvers?
    options:
      - "It autowires each resolver as a separate bean and re-sorts the full set by @Order on every incoming request before delegating"
      - "WebMvcConfigurationSupport builds a fixed-order list and wraps it in a single HandlerExceptionResolverComposite (registered at LOWEST_PRECEDENCE), which iterates in order and returns the first non-null result"
      - "It selects one resolver at random per request and only falls through to another when the chosen one returns null"
      - "It invokes all three resolvers and merges each ModelAndView they return into one combined view before rendering"
    answer: 1
    explanation: |
      The three defaults are assembled into a fixed-order list and wrapped in a single
      `HandlerExceptionResolverComposite`. The composite iterates the inner list in order, returning
      the first non-null `ModelAndView`. This is why appended custom resolvers run last.
    ref: "concepts.md#ordering-and-precedence-across-mechanisms"

  - id: web-exception-handling-076
    difficulty: advanced
    tags: [local-vs-advice, precedence, absolute]
    question: |
      A controller declares a local `@ExceptionHandler(Exception.class)` (broad), while a
      `@ControllerAdvice` has a very specific `@ExceptionHandler(OrderNotFoundException.class)`. The
      controller throws `OrderNotFoundException`. Which runs?
    options:
      - "The controller-local broad handler, because a controller-local @ExceptionHandler pre-empts every advice regardless of specificity"
      - "The advice's specific OrderNotFoundException handler, because Spring always ranks exception-type specificity above where the handler is declared"
      - "Both handlers run in sequence, the controller-local one first and then the advice's, with the second overwriting the first response"
      - "Neither handler runs; the split between a local broad match and an advice-level specific match causes the exception to propagate to the container"
    answer: 0
    explanation: |
      Locality dominates: the failing controller's own `ExceptionHandlerMethodResolver` is consulted
      first, and any local match (even a broad `Exception.class`) is used before advices are ever
      considered. The specific advice handler never runs.
    ref: "concepts.md#ordering-and-precedence-across-mechanisms"

  - id: web-exception-handling-077
    difficulty: expert
    tags: [error-attribute, servlet, 500]
    question: |
      When `handleExceptionInternal` produces a 500-level response in Spring 6, which request
      attribute does it set so downstream (e.g. container error) infrastructure can see the original
      exception?
    options:
      - "jakarta.servlet.error.exception"
      - "spring.mvc.exception"
      - "org.springframework.web.originalException"
      - "javax.servlet.error.exception"
    answer: 0
    explanation: |
      For 5xx responses it sets the `jakarta.servlet.error.exception` request attribute (Jakarta EE 9
      namespace in Spring 6), exposing the original exception to downstream error handling. `javax.*`
      was the Spring 5 name.
    ref: "concepts.md#responseentityexceptionhandler"

  - id: web-exception-handling-078
    difficulty: advanced
    tags: [pre-handle, interceptor, resolvable]
    question: |
      A `HandlerInterceptor.preHandle(...)` throws a RuntimeException before the controller runs.
      Can a `@ControllerAdvice` `@ExceptionHandler` handle it?
    options:
      - "No, exceptions thrown from any HandlerInterceptor callback are excluded from the resolver chain and propagate straight to the servlet container"
      - "Yes; preHandle executes inside DispatcherServlet's try block, so its exception is routed to processHandlerException and the resolver chain"
      - "Only if the target controller method has already begun executing, since the resolver chain activates only once the handler is entered"
      - "Only exceptions raised in afterCompletion are resolvable by advices; preHandle failures are considered pre-dispatch and bypass processHandlerException"
    answer: 1
    explanation: |
      `applyPreHandle` runs inside `doDispatch`'s try block. An exception there is caught and routed
      to `processHandlerException`, so the resolver chain (and your advices) can handle it — unlike
      `afterCompletion`, which runs after the try block.
    ref: "concepts.md#the-exception-resolution-pipeline"

  - id: web-exception-handling-079
    difficulty: expert
    tags: [error-response, get-body, lazy]
    question: |
      A custom exception implements `ErrorResponse` and lazily builds its `ProblemDetail` in
      `getBody()` using a `MessageSource`-backed detail. Why is it important that this build be
      idempotent and side-effect free?
    options:
      - "Because the framework guarantees getBody() is invoked exactly once per request, so idempotency and side effects make no observable difference"
      - "Because the ErrorResponse contract explicitly forbids consulting a MessageSource from inside getBody(), so any localization there is illegal"
      - "Because the framework may invoke getBody() (and detail-message resolution) more than once across resolution/rendering, and stateful side effects there would produce inconsistent or racy bodies"
      - "Because ProblemDetail instances are fully immutable once constructed and therefore cannot be assembled lazily inside getBody() at all"
    answer: 2
    explanation: |
      `getBody()`/detail resolution may be invoked more than once (e.g. during resolution and while
      rendering/localizing). Non-idempotent or stateful logic there risks inconsistent bodies and, on
      shared exception instances, races. Keep it pure and deterministic.
    ref: "concepts.md#problemdetail-rfc-7807-in-spring-6"
