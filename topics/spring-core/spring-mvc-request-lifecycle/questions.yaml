topic: "Spring MVC and the Request Lifecycle"
domain: spring-core
topic_slug: spring-mvc-request-lifecycle
version: 1
questions:
- id: spring-mvc-request-lifecycle-001
  difficulty: beginner
  tags: [dispatcherservlet, front-controller]
  question: |
    Which design pattern does the Spring MVC DispatcherServlet implement?
  options:
  - "Front Controller"
  - "Data Access Object"
  - "Singleton registry"
  - "Service Locator"
  answer: 0
  explanation: |
    DispatcherServlet is the classic Front Controller: a single servlet receives all matching
    requests and dispatches them to the appropriate handlers, centralizing cross-cutting concerns.
  ref: "concepts.md#dispatcherservlet-as-front-controller"

- id: spring-mvc-request-lifecycle-002
  difficulty: beginner
  tags: [dispatcherservlet, servlet]
  question: |
    What is the DispatcherServlet, technically?
  options:
  - "An HttpServlet that the servlet container maps to a URL pattern"
  - "A plain Java class registered as a Spring bean only"
  - "A servlet Filter the container wraps around each request"
  - "An annotation processor that runs at compile time"
  answer: 0
  explanation: |
    DispatcherServlet extends HttpServlet (via FrameworkServlet). The servlet container maps it to
    a URL pattern (commonly "/"), and it then delegates to Spring MVC components.
  ref: "concepts.md#dispatcherservlet-as-front-controller"

- id: spring-mvc-request-lifecycle-003
  difficulty: intermediate
  tags: [dispatcherservlet, application-context]
  question: |
    In the classic two-context Spring MVC setup, which statement about the root and servlet
    WebApplicationContext is correct?
  options:
  - "The root context can see beans defined in the servlet (child) context"
  - "Each context is fully isolated at runtime; neither can resolve the other's beans by type or name"
  - "The servlet (child) context can see beans in the root (parent) context, but not vice versa"
  - "There can only ever be a single shared WebApplicationContext for the whole application"
  answer: 2
  explanation: |
    The DispatcherServlet's child context (controllers, view resolvers) can access beans in the
    root context (services, repositories) established by ContextLoaderListener, but the root cannot
    see the child's beans.
  ref: "concepts.md#dispatcherservlet-as-front-controller"

- id: spring-mvc-request-lifecycle-004
  difficulty: intermediate
  tags: [dispatcherservlet, strategy-beans]
  question: |
    Which of the following is NOT one of the special strategy beans DispatcherServlet detects?
  options:
  - "ViewResolver"
  - "HandlerMapping"
  - "MultipartResolver"
  - "TransactionManager"
  answer: 3
  explanation: |
    HandlerMapping, ViewResolver, and MultipartResolver are all DispatcherServlet strategy beans.
    TransactionManager is a data/transaction concern, not part of the DispatcherServlet's web
    dispatch strategies.
  ref: "concepts.md#dispatcherservlet-as-front-controller"

- id: spring-mvc-request-lifecycle-005
  difficulty: beginner
  tags: [request-flow, ordering]
  question: |
    In the Spring MVC request lifecycle, which component does DispatcherServlet consult FIRST to
    determine how to handle an incoming request?
  options:
  - "ViewResolver"
  - "HandlerAdapter"
  - "HttpMessageConverter"
  - "HandlerMapping"
  answer: 3
  explanation: |
    DispatcherServlet first asks its HandlerMapping(s) to find the handler (and interceptors) for
    the request, producing a HandlerExecutionChain. Only afterward is a HandlerAdapter selected.
  ref: "concepts.md#request-processing-flow"

- id: spring-mvc-request-lifecycle-006
  difficulty: intermediate
  tags: [request-flow, handler-execution-chain]
  question: |
    What does a HandlerMapping return to the DispatcherServlet?
  options:
  - "A fully rendered HTTP response with status, headers, and serialized body"
  - "A ViewResolver instance chosen for the request's Accept header and locale"
  - "Only the raw controller class name as a String for later reflection"
  - "A HandlerExecutionChain containing the handler plus any matching interceptors"
  answer: 3
  explanation: |
    A HandlerMapping returns a HandlerExecutionChain: the selected handler object together with the
    ordered list of HandlerInterceptors that apply to the request.
  ref: "concepts.md#request-processing-flow"

- id: spring-mvc-request-lifecycle-007
  difficulty: intermediate
  tags: [request-flow, view-vs-body]
  question: |
    A controller method annotated with @ResponseBody returns a POJO. Which path does the response
    take?
  options:
  - "The POJO's toString() is resolved as a logical view name by a ViewResolver"
  - "It is forwarded to a JSP whose name matches the POJO's class by default"
  - "It is serialized directly to the response body by an HttpMessageConverter, skipping view resolution"
  - "It triggers an HTTP redirect to a URL derived from the POJO's fields"
  answer: 2
  explanation: |
    With @ResponseBody the return value is written to the body via an HttpMessageConverter (e.g.
    Jackson for JSON). View resolution is bypassed entirely.
  ref: "concepts.md#request-processing-flow"

- id: spring-mvc-request-lifecycle-008
  difficulty: intermediate
  tags: [request-flow, interceptors]
  question: |
    During the dispatch flow, in what order do a chain of interceptors' preHandle and postHandle
    methods execute?
  options:
  - "preHandle in registration order; postHandle in reverse order"
  - "Both preHandle and postHandle run in registration order"
  - "Both preHandle and postHandle run in reverse registration order"
  - "preHandle in reverse order; postHandle in registration order"
  answer: 0
  explanation: |
    Interceptor preHandle methods run in registration order on the way in; postHandle (and
    afterCompletion) run in reverse order on the way out, forming a nested wrapping.
  ref: "concepts.md#request-processing-flow"

- id: spring-mvc-request-lifecycle-009
  difficulty: beginner
  tags: [handler-mapping]
  question: |
    What is the primary responsibility of a HandlerMapping?
  options:
  - "To map an incoming request to the handler that should process it"
  - "To serialize the handler's return value into JSON using Jackson"
  - "To render the selected view into the final HTML response"
  - "To open and manage the database transaction around each handler"
  answer: 0
  explanation: |
    HandlerMapping performs routing: given a request it decides which handler (and interceptors)
    should process it.
  ref: "concepts.md#handlermapping-and-handleradapter"

- id: spring-mvc-request-lifecycle-010
  difficulty: beginner
  tags: [handler-adapter]
  question: |
    Why does DispatcherServlet use a HandlerAdapter instead of calling the handler directly?
  options:
  - "To cache each handler's results between requests keyed by URL"
  - "To compress the HTTP response body before it is flushed to the client"
  - "To open a pooled database connection before every handler runs"
  - "To provide a uniform way to invoke different kinds of handlers"
  answer: 3
  explanation: |
    A handler can be many things (annotated method, Controller interface, HttpRequestHandler,
    RouterFunction). The HandlerAdapter whose supports() returns true provides a uniform
    invocation, decoupling DispatcherServlet from handler types.
  ref: "concepts.md#handlermapping-and-handleradapter"

- id: spring-mvc-request-lifecycle-011
  difficulty: intermediate
  tags: [handler-mapping, defaults]
  question: |
    Which HandlerMapping is responsible for mapping requests to @RequestMapping annotated
    controller methods in modern Spring MVC?
  options:
  - "BeanNameUrlHandlerMapping"
  - "SimpleUrlHandlerMapping"
  - "RequestMappingHandlerMapping"
  - "RouterFunctionMapping"
  answer: 2
  explanation: |
    RequestMappingHandlerMapping maps requests to @RequestMapping-annotated @Controller methods and
    is the default modern mapping installed by @EnableWebMvc.
  ref: "concepts.md#handlermapping-and-handleradapter"

- id: spring-mvc-request-lifecycle-012
  difficulty: intermediate
  tags: [handler-adapter, argument-resolvers]
  question: |
    Which HandlerAdapter invokes @RequestMapping methods and owns the argument resolvers, return
    value handlers, and HttpMessageConverters?
  options:
  - "SimpleControllerHandlerAdapter"
  - "HttpRequestHandlerAdapter"
  - "RequestMappingHandlerAdapter"
  - "HandlerFunctionAdapter"
  answer: 2
  explanation: |
    RequestMappingHandlerAdapter invokes annotated handler methods and holds the
    HandlerMethodArgumentResolvers, HandlerMethodReturnValueHandlers, and message converters.
  ref: "concepts.md#handlermapping-and-handleradapter"

- id: spring-mvc-request-lifecycle-013
  difficulty: beginner
  tags: [rest-controller, annotations]
  question: |
    @RestController is a composed annotation equivalent to combining which two annotations?
  options:
  - "@Component and @RequestMapping"
  - "@Service and @ResponseBody"
  - "@Controller and @ResponseBody"
  - "@Controller and @RequestBody"
  answer: 2
  explanation: |
    @RestController is meta-annotated with @Controller and @ResponseBody, so every handler method's
    return value is written to the response body by default.
  ref: "concepts.md#controller-vs-restcontroller"

- id: spring-mvc-request-lifecycle-014
  difficulty: beginner
  tags: [controller, view-name]
  question: |
    In a plain @Controller, what does a handler method that returns a String represent by default?
  options:
  - "The literal text written directly as the response body content"
  - "A redirect URL that always issues a 302 to the client"
  - "A logical view name to be resolved and rendered"
  - "The HTTP status reason phrase attached to a 200 response"
  answer: 2
  explanation: |
    By default a String returned from a @Controller method is treated as a logical view name that a
    ViewResolver resolves into a View. To return data you add @ResponseBody.
  ref: "concepts.md#controller-vs-restcontroller"

- id: spring-mvc-request-lifecycle-015
  difficulty: intermediate
  tags: [controller, responsebody]
  question: |
    You have a @Controller (not @RestController) and want one method to return a JSON string
    directly as the response body. What do you do?
  options:
  - "Nothing special; @Controller returns bodies by default"
  - "Change the return type to void"
  - "Add @RequestBody to the method"
  - "Annotate that method with @ResponseBody"
  answer: 3
  explanation: |
    A plain @Controller treats returns as view names, so you must annotate the specific method (or
    its return value) with @ResponseBody to write the value to the body instead.
  ref: "concepts.md#controller-vs-restcontroller"

- id: spring-mvc-request-lifecycle-016
  difficulty: beginner
  tags: [rest-controller, stereotype]
  question: |
    Which stereotype annotation is @Controller itself a specialization of, making it eligible for
    component scanning?
  options:
  - "@Component"
  - "@Service"
  - "@Repository"
  - "@Bean"
  answer: 0
  explanation: |
    @Controller is meta-annotated with @Component, so it is picked up by component scanning like the
    other stereotypes.
  ref: "concepts.md#controller-vs-restcontroller"

- id: spring-mvc-request-lifecycle-017
  difficulty: beginner
  tags: [request-mapping, shortcuts]
  question: |
    @GetMapping("/x") is a shortcut equivalent to which longer form?
  options:
  - "@RequestMapping(path=\"/x\", method=RequestMethod.POST)"
  - "@RequestMapping(path=\"/x\", consumes=\"application/json\")"
  - "@RequestMapping(path=\"/x\", method=RequestMethod.GET)"
  - "@PathVariable(\"/x\")"
  answer: 2
  explanation: |
    @GetMapping is a composed annotation that pins the HTTP method to GET, equivalent to
    @RequestMapping(method = RequestMethod.GET).
  ref: "concepts.md#requestmapping-and-http-method-shortcuts"

- id: spring-mvc-request-lifecycle-018
  difficulty: intermediate
  tags: [request-mapping, consumes-produces]
  question: |
    In @RequestMapping, what does the 'consumes' attribute constrain?
  options:
  - "The Content-Type of the incoming request body"
  - "The Accept header of the client and the response media type"
  - "The set of query parameters that must be present"
  - "The HTTP methods allowed"
  answer: 0
  explanation: |
    'consumes' restricts the mapping to requests whose Content-Type matches (i.e. what the handler
    can consume). 'produces' matches the client's Accept header and sets the response type.
  ref: "concepts.md#requestmapping-and-http-method-shortcuts"

- id: spring-mvc-request-lifecycle-019
  difficulty: intermediate
  tags: [request-mapping, class-level]
  question: |
    A controller class is annotated @RequestMapping("/api/books") and a method with
    @GetMapping("/{id}"). What URL does the method handle?
  options:
  - "GET /{id}"
  - "GET /api/books only"
  - "GET /api/books/{id}"
  - "POST /api/books/{id}"
  answer: 2
  explanation: |
    Class-level @RequestMapping sets a base path that is combined with the method-level mapping, so
    the effective mapping is GET /api/books/{id}.
  ref: "concepts.md#requestmapping-and-http-method-shortcuts"

- id: spring-mvc-request-lifecycle-020
  difficulty: intermediate
  tags: [request-mapping, status-codes]
  question: |
    A request matches a mapped path but uses an HTTP method the handler does not support. What does
    Spring MVC typically return?
  options:
  - "404 Not Found"
  - "415 Unsupported Media Type"
  - "500 Internal Server Error"
  - "405 Method Not Allowed"
  answer: 3
  explanation: |
    A path match with a wrong HTTP verb yields 405 Method Not Allowed. A total lack of a matching
    mapping gives 404, a bad Content-Type gives 415, and an Accept mismatch gives 406.
  ref: "concepts.md#requestmapping-and-http-method-shortcuts"

- id: spring-mvc-request-lifecycle-021
  difficulty: beginner
  tags: [path-variable]
  question: |
    Which annotation binds a value from a URI template segment such as {id} in "/users/{id}"?
  options:
  - "@PathVariable"
  - "@RequestParam"
  - "@RequestBody"
  - "@RequestHeader"
  answer: 0
  explanation: |
    @PathVariable binds the value of a URI template variable (e.g. {id}) from the path to a method
    parameter.
  ref: "concepts.md#method-argument-annotations"

- id: spring-mvc-request-lifecycle-022
  difficulty: beginner
  tags: [request-param]
  question: |
    Which annotation is used to bind a query-string parameter like ?page=2 to a method parameter?
  options:
  - "@PathVariable"
  - "@ModelAttribute"
  - "@RequestParam"
  - "@RequestBody"
  answer: 2
  explanation: |
    @RequestParam binds query parameters (and form fields / multipart parts) to method parameters,
    with support for required and defaultValue.
  ref: "concepts.md#method-argument-annotations"

- id: spring-mvc-request-lifecycle-023
  difficulty: beginner
  tags: [request-body]
  question: |
    What does @RequestBody do?
  options:
  - "Binds a single named query-string parameter to the method argument after type conversion"
  - "Extracts a single URI template variable such as {id} from the request path and binds it"
  - "Deserializes the entire HTTP request body into the parameter via an HttpMessageConverter"
  - "Reads a single named HTTP request header value and injects it into the method parameter"
  answer: 2
  explanation: |
    @RequestBody uses an HttpMessageConverter (chosen by the request Content-Type) to deserialize
    the whole body — for example JSON into a POJO.
  ref: "concepts.md#method-argument-annotations"

- id: spring-mvc-request-lifecycle-024
  difficulty: intermediate
  tags: [request-param, defaults]
  question: |
    What is the default value of the 'required' attribute of @RequestParam, and what happens if a
    required parameter is missing?
  options:
  - "required defaults to false; the parameter is set to null silently"
  - "required defaults to true; a missing parameter causes a 500 error always"
  - "required defaults to true; a missing parameter causes a 400 Bad Request"
  - "required defaults to false; a missing parameter causes a 404"
  answer: 2
  explanation: |
    @RequestParam is required by default. A missing required param throws
    MissingServletRequestParameterException, which maps to 400 Bad Request. Setting defaultValue
    implicitly makes it optional.
  ref: "concepts.md#method-argument-annotations"

- id: spring-mvc-request-lifecycle-025
  difficulty: intermediate
  tags: [model-attribute, data-binding]
  question: |
    How does @ModelAttribute differ from @RequestBody when binding a request to an object?
  options:
  - "@ModelAttribute binds query/form parameters onto object fields via WebDataBinder; @RequestBody deserializes the body via a message converter"
  - "They are identical, interchangeable annotations that both delegate to the same WebDataBinder to populate the target object from the request"
  - "@ModelAttribute may only be applied to GET requests while @RequestBody may only be applied to POST requests"
  - "@ModelAttribute deserializes the JSON request body via a converter while @RequestBody binds query-string parameters onto object fields"
  answer: 0
  explanation: |
    @ModelAttribute uses the WebDataBinder to populate an object's fields from query/form
    parameters (participating in BindingResult), whereas @RequestBody deserializes the raw body
    (e.g. JSON) with an HttpMessageConverter.
  ref: "concepts.md#method-argument-annotations"

- id: spring-mvc-request-lifecycle-026
  difficulty: intermediate
  tags: [model-attribute, method-level]
  question: |
    What is the effect of putting @ModelAttribute on a separate (non-handler) method in a
    controller?
  options:
  - "It defines an additional request mapping whose path is derived from the method's name"
  - "It disables view resolution for the whole controller so every handler writes to the response body"
  - "It runs before each handler method in that controller and adds its return value to the model"
  - "It marks the method as an exception handler invoked when a handler in the controller throws"
  answer: 2
  explanation: |
    A method-level @ModelAttribute is invoked before each handler in the controller, and its return
    value is added to the model, making it available to every view/handler.
  ref: "concepts.md#method-argument-annotations"

- id: spring-mvc-request-lifecycle-027
  difficulty: intermediate
  tags: [request-body, validation]
  question: |
    Which annotation is typically combined with @RequestBody to trigger bean validation on the
    deserialized object?
  options:
  - "@Validated only at class level"
  - "@ModelAttribute"
  - "@ResponseStatus"
  - "@Valid"
  answer: 3
  explanation: |
    Adding @Valid (or @Validated) before @RequestBody triggers JSR-380 bean validation on the
    deserialized object; violations produce a MethodArgumentNotValidException (400).
  ref: "concepts.md#method-argument-annotations"

- id: spring-mvc-request-lifecycle-028
  difficulty: beginner
  tags: [view-resolver]
  question: |
    What is the role of a ViewResolver in Spring MVC?
  options:
  - "To map a logical view name to an actual View that can render the response"
  - "To bind incoming request parameters to the handler method's arguments during invocation"
  - "To choose which HandlerAdapter is used to invoke the selected handler for a request"
  - "To parse multipart uploads and expose each part as a MultipartFile to the controller"
  answer: 0
  explanation: |
    A ViewResolver maps a logical view name (plus the Locale) to a View instance, which then
    renders the model into the response.
  ref: "concepts.md#viewresolver-and-view-rendering"

- id: spring-mvc-request-lifecycle-029
  difficulty: intermediate
  tags: [view-resolver, jsp]
  question: |
    An InternalResourceViewResolver is configured with prefix "/WEB-INF/views/" and suffix ".jsp".
    A handler returns the view name "home". Which resource is rendered?
  options:
  - "/home"
  - "/WEB-INF/views/home.jsp"
  - "home.jsp in the classpath root"
  - "/WEB-INF/home"
  answer: 1
  explanation: |
    InternalResourceViewResolver wraps the logical name with the prefix and suffix, producing
    /WEB-INF/views/home.jsp.
  ref: "concepts.md#viewresolver-and-view-rendering"

- id: spring-mvc-request-lifecycle-030
  difficulty: intermediate
  tags: [view-resolver, redirect-forward]
  question: |
    A handler returns the String "redirect:/login". What does Spring MVC do?
  options:
  - "Renders a view literally named 'redirect:/login'"
  - "Performs a server-side forward without changing the URL"
  - "Returns the string as the response body"
  - "Issues an HTTP redirect to /login via a RedirectView"
  answer: 3
  explanation: |
    The "redirect:" prefix triggers a RedirectView producing an HTTP redirect (302) to the target,
    causing the client to issue a new request. "forward:" instead does a server-internal dispatch.
  ref: "concepts.md#viewresolver-and-view-rendering"

- id: spring-mvc-request-lifecycle-031
  difficulty: intermediate
  tags: [view-resolver, body-path]
  question: |
    For which of the following returns is the ViewResolver chain skipped?
  options:
  - "A String view name from a @Controller"
  - "A ModelAndView with a view name"
  - "A ResponseEntity<UserDto> from any controller"
  - "null from a handler that expects view-name translation"
  answer: 2
  explanation: |
    ResponseEntity (like @ResponseBody) sends the value down the body path serialized by a message
    converter, so view resolution is skipped. View names and ModelAndView go through the resolver.
  ref: "concepts.md#viewresolver-and-view-rendering"

- id: spring-mvc-request-lifecycle-032
  difficulty: beginner
  tags: [interceptor, filter]
  question: |
    Which component is defined by the Servlet specification and managed by the servlet container
    (not by DispatcherServlet)?
  options:
  - "Servlet Filter"
  - "HandlerInterceptor"
  - "HandlerAdapter"
  - "ViewResolver"
  answer: 0
  explanation: |
    A Servlet Filter (jakarta.servlet.Filter) is a Servlet-spec component managed by the container;
    it runs outside/around DispatcherServlet. HandlerInterceptor is a Spring MVC construct.
  ref: "concepts.md#handlerinterceptor-vs-servlet-filter"

- id: spring-mvc-request-lifecycle-033
  difficulty: intermediate
  tags: [interceptor, callbacks]
  question: |
    Which HandlerInterceptor callback runs AFTER the handler executes but BEFORE the view is
    rendered, and can modify the ModelAndView?
  options:
  - "preHandle"
  - "afterCompletion"
  - "doFilter"
  - "postHandle"
  answer: 3
  explanation: |
    postHandle runs after the handler but before view rendering and receives the ModelAndView,
    allowing modification. afterCompletion runs after rendering (even on exception).
  ref: "concepts.md#handlerinterceptor-vs-servlet-filter"

- id: spring-mvc-request-lifecycle-034
  difficulty: intermediate
  tags: [interceptor, prehandle]
  question: |
    What happens if a HandlerInterceptor's preHandle method returns false?
  options:
  - "The handler runs but the view is skipped"
  - "Spring throws an exception immediately"
  - "Processing stops; the handler is not invoked"
  - "The request is forwarded to the next interceptor only"
  answer: 2
  explanation: |
    Returning false from preHandle halts the dispatch: the handler (and remaining chain) is not
    invoked. The interceptor is expected to have written the response itself.
  ref: "concepts.md#handlerinterceptor-vs-servlet-filter"

- id: spring-mvc-request-lifecycle-035
  difficulty: intermediate
  tags: [interceptor, filter, comparison]
  question: |
    Which statement best captures a difference between a Servlet Filter and a Spring
    HandlerInterceptor?
  options:
  - "A Filter has direct access to the chosen handler object and the ModelAndView, while a HandlerInterceptor sees only the raw request and response"
  - "A HandlerInterceptor runs entirely outside DispatcherServlet on the raw request, while a Filter runs inside it with access to the ModelAndView"
  - "A HandlerInterceptor knows the chosen handler and can access the ModelAndView; a Filter operates on raw request/response outside DispatcherServlet"
  - "Filters and HandlerInterceptors are identical in scope and capability, so the two are freely interchangeable in a Spring MVC application"
  answer: 2
  explanation: |
    Because a HandlerInterceptor runs inside DispatcherServlet, it knows the resolved handler and
    can access the ModelAndView. A Filter works on raw request/response and runs around
    DispatcherServlet without MVC knowledge.
  ref: "concepts.md#handlerinterceptor-vs-servlet-filter"

- id: spring-mvc-request-lifecycle-036
  difficulty: beginner
  tags: [response-entity]
  question: |
    What does ResponseEntity<T> represent?
  options:
  - "Only the response body, with no control over status or headers"
  - "Only the HTTP status code and reason phrase, with no body or headers"
  - "The incoming request's headers and body as received from the client"
  - "The entire HTTP response: status code, headers, and body"
  answer: 3
  explanation: |
    ResponseEntity models the whole HTTP response — status line, headers, and body — giving the
    handler full programmatic control.
  ref: "concepts.md#responseentity"

- id: spring-mvc-request-lifecycle-037
  difficulty: intermediate
  tags: [response-entity, status]
  question: |
    Why might you return ResponseEntity<T> instead of just annotating a method with @ResponseBody?
  options:
  - "ResponseEntity routes the response through a ViewResolver, so its returned body value is resolved as a logical view name"
  - "ResponseEntity is required for GET requests, since plain @ResponseBody only functions on POST and PUT handler methods"
  - "@ResponseBody cannot serialize objects to JSON; it is limited to writing raw String and byte[] payloads to the body"
  - "ResponseEntity lets you set the status code and headers dynamically per invocation, not just the body"
  answer: 3
  explanation: |
    @ResponseBody controls only the body (status defaults to 200). ResponseEntity additionally lets
    you set the status and headers dynamically for each call — e.g. 201 with a Location header, or
    404 with no body.
  ref: "concepts.md#responseentity"

- id: spring-mvc-request-lifecycle-038
  difficulty: intermediate
  tags: [response-entity, builder]
  question: |
    Which expression correctly builds a 201 Created response with a Location header and a body?
  options:
  - "ResponseEntity.ok().body(saved)"
  - "ResponseEntity.notFound().body(saved)"
  - "ResponseEntity.created(location).body(saved)"
  - "ResponseEntity.noContent().body(saved)"
  answer: 2
  explanation: |
    ResponseEntity.created(location) sets status 201 and the Location header from the given URI;
    .body(saved) attaches the body. ok() is 200, notFound() is 404, noContent() is 204.
  ref: "concepts.md#responseentity"

- id: spring-mvc-request-lifecycle-039
  difficulty: intermediate
  tags: [response-entity, http-entity]
  question: |
    ResponseEntity is a subclass of which type, which carries headers and a body but no status?
  options:
  - "RequestEntity"
  - "ModelAndView"
  - "HttpServletResponse"
  - "HttpEntity"
  answer: 3
  explanation: |
    ResponseEntity extends HttpEntity (headers + body) and adds a status code. RequestEntity is the
    request-side counterpart, also an HttpEntity subclass.
  ref: "concepts.md#responseentity"

- id: spring-mvc-request-lifecycle-040
  difficulty: beginner
  tags: [request-flow, view-render]
  question: |
    After a ViewResolver produces a View, what does DispatcherServlet call to generate the final
    output?
  options:
  - "view.render(model, request, response)"
  - "handler.invoke(model, request, response) to re-run the controller method"
  - "converter.write(model, request, response) to serialize the view into JSON"
  - "mapping.match(model, request, response) to re-resolve the handler chain"
  answer: 0
  explanation: |
    The View's render(model, request, response) method writes the actual output (e.g. HTML) using
    the model data.
  ref: "concepts.md#viewresolver-and-view-rendering"

- id: spring-mvc-request-lifecycle-041
  difficulty: intermediate
  tags: [controller, threading]
  question: |
    By default, what scope are @Controller beans, and what does that imply for how you write them?
  options:
  - "Prototype; a new instance per request, so fields are safe for request state"
  - "Singleton; they should be stateless because they serve concurrent requests"
  - "Request; the container creates a fresh controller instance for every HTTP session and discards it on session timeout"
  - "Singleton; but you must synchronize every handler method to serialize concurrent request threads safely"
  answer: 1
  explanation: |
    Controllers are singletons by default and serve requests concurrently on multiple threads, so
    they must be stateless; per-request data belongs in method arguments/request scope, not fields.
  ref: "concepts.md#controller-vs-restcontroller"

- id: spring-mvc-request-lifecycle-042
  difficulty: intermediate
  tags: [jakarta, versions]
  question: |
    In Spring Framework 6.x, which package do the servlet types (e.g. HttpServletRequest) belong
    to?
  options:
  - "javax.servlet.*"
  - "jakarta.servlet.*"
  - "org.springframework.servlet.*"
  - "java.servlet.*"
  answer: 1
  explanation: |
    Spring Framework 6.x targets Jakarta EE 9+, so servlet types live under jakarta.servlet.*.
    Spring 5.x and earlier used javax.servlet.*.
  ref: "concepts.md#dispatcherservlet-as-front-controller"

- id: spring-mvc-request-lifecycle-043
  difficulty: intermediate
  tags: [enable-web-mvc, configuration]
  question: |
    What does @EnableWebMvc primarily do in a Spring (non-Boot) MVC application?
  options:
  - "Starts an embedded Tomcat server and binds it to port 8080 for the dispatcher"
  - "Scans the classpath for @Entity classes and wires up the JPA persistence context"
  - "Registers the well-configured MVC infrastructure beans (handler mapping, adapter, converters, etc.)"
  - "Enables method-level security by activating the global @PreAuthorize interceptor chain"
  answer: 2
  explanation: |
    @EnableWebMvc imports DelegatingWebMvcConfiguration, registering the core MVC beans like
    RequestMappingHandlerMapping/Adapter and message converters, customizable via WebMvcConfigurer.
  ref: "concepts.md#dispatcherservlet-as-front-controller"

- id: spring-mvc-request-lifecycle-044
  difficulty: beginner
  tags: [request-flow, no-match]
  question: |
    If no HandlerMapping finds a handler for a request, what does DispatcherServlet do by default?
  options:
  - "Returns 200 OK with an empty body and a default Content-Length of zero"
  - "Renders a default JSP located at /WEB-INF/views/default.jsp as a fallback view"
  - "Throws a compile-time error, refusing to start the servlet until a handler is mapped"
  - "Responds with 404 Not Found"
  answer: 3
  explanation: |
    When no mapping matches, there is no handler to invoke, and DispatcherServlet responds with 404
    Not Found.
  ref: "concepts.md#request-processing-flow"

- id: spring-mvc-request-lifecycle-045
  difficulty: intermediate
  tags: [content-negotiation, message-converter]
  question: |
    For a @RestController returning a POJO, how does Spring MVC decide whether to serialize it as
    JSON or XML?
  options:
  - "It always uses JSON regardless of the client, because Jackson is hardwired as the sole converter"
  - "By content negotiation, matching the client's Accept header against the available HttpMessageConverters"
  - "By reading a @ResponseStatus annotation, whose value attribute names the target media type"
  - "By the servlet container's global setting only, ignoring any per-request headers the client sends"
  answer: 1
  explanation: |
    Content negotiation matches the request's Accept header (and configured strategies) against the
    media types supported by the registered HttpMessageConverters to choose the serialization.
  ref: "concepts.md#request-processing-flow"

- id: spring-mvc-request-lifecycle-046
  difficulty: expert
  tags: [interceptor, response-body, ordering]
  question: |
    A @RestController handler returns a POJO. A HandlerInterceptor's postHandle tries to add a
    response header and mutate the ModelAndView. What actually happens?
  options:
  - "postHandle receives a null ModelAndView, and adding the header is typically ineffective because the body was already written (and the response likely committed) during HandlerAdapter.handle"
  - "The header is added and the JSON is re-serialized with the mutated model before it reaches the client, because postHandle runs prior to any body write"
  - "postHandle is never invoked at all for @RestController methods, since @ResponseBody handlers are excluded from the interceptor chain entirely"
  - "Spring throws IllegalStateException because postHandle detects the committed response and aborts the dispatch to prevent a corrupt body"
  answer: 0
  explanation: |
    For @ResponseBody/ResponseEntity returns, RequestResponseBodyMethodProcessor writes the body via
    an HttpMessageConverter during HandlerAdapter.handle(), before postHandle runs. The ModelAndView
    is null and the response is often already committed, so header/status changes in postHandle are
    silently ineffective. Use ResponseBodyAdvice or a Filter instead.
  ref: "concepts.md#request-processing-flow"

- id: spring-mvc-request-lifecycle-047
  difficulty: advanced
  tags: [interceptor, aftercompletion, exceptions]
  question: |
    Three interceptors A, B, C are registered in that order. B's preHandle returns true, but the
    handler throws an exception. C's preHandle was reached and returned true before the handler ran.
    Which afterCompletion methods run and in what order?
  options:
  - "None run, because the handler threw and DispatcherServlet skips all completion callbacks on error"
  - "C, B, A afterCompletion run (reverse order), each receiving the exception"
  - "Only A.afterCompletion runs, because A is the outermost interceptor and absorbs the thrown exception"
  - "A, B, C afterCompletion run in registration order, each receiving a null exception argument"
  answer: 1
  explanation: |
    DispatcherServlet tracks the last successfully executed preHandle and, on completion (including
    exceptions), invokes afterCompletion in reverse order for exactly those interceptors whose
    preHandle returned true. postHandle is skipped on exception, but afterCompletion still fires with
    the exception argument.
  ref: "concepts.md#request-processing-flow"

- id: spring-mvc-request-lifecycle-048
  difficulty: expert
  tags: [exception-resolver, ordering]
  question: |
    An exception is thrown that (a) is annotated with @ResponseStatus(HttpStatus.CONFLICT) and (b)
    also matches an @ExceptionHandler method in the same controller that returns a 422 body. Which
    response does the client receive, and why?
  options:
  - "409 Conflict, because @ResponseStatus is evaluated before any @ExceptionHandler"
  - "500, because two resolvers both match the exception and Spring aborts the ambiguous resolution with an error"
  - "422 from the @ExceptionHandler, because ExceptionHandlerExceptionResolver runs before ResponseStatusExceptionResolver in the resolver chain"
  - "Both are applied: the status line becomes 409 Conflict while the body is taken from the 422 @ExceptionHandler method"
  answer: 2
  explanation: |
    @EnableWebMvc orders resolvers as ExceptionHandlerExceptionResolver, then
    ResponseStatusExceptionResolver, then DefaultHandlerExceptionResolver. The first to return a
    non-null ModelAndView wins, so the matching @ExceptionHandler (422) handles it and
    @ResponseStatus is never consulted.
  ref: "concepts.md#exception-resolution-internals"

- id: spring-mvc-request-lifecycle-049
  difficulty: expert
  tags: [exception-handler, matching]
  question: |
    A controller has @ExceptionHandler(RuntimeException.class) and @ExceptionHandler(Exception.class).
    A handler throws an IllegalArgumentException (a RuntimeException). Which one is invoked?
  options:
  - "The Exception.class handler, because Spring always routes to the broadest declared type to guarantee a match"
  - "Whichever handler is declared first in the source file, since Spring resolves ties by lexical method order"
  - "Neither; the two overlapping handlers form an ambiguous match and Spring throws IllegalStateException at startup"
  - "The RuntimeException.class handler, because Spring selects the closest supertype of the thrown exception in the class hierarchy"
  answer: 3
  explanation: |
    ExceptionHandlerMethodResolver chooses the @ExceptionHandler whose declared type is the nearest
    supertype (most specific match) of the thrown exception. RuntimeException is closer to
    IllegalArgumentException than Exception, so it wins. Ambiguity only arises when two candidates
    are equally specific.
  ref: "concepts.md#exception-resolution-internals"

- id: spring-mvc-request-lifecycle-050
  difficulty: advanced
  tags: [controller-advice, exception-handler]
  question: |
    A controller defines a local @ExceptionHandler(IllegalStateException.class), and a
    @ControllerAdvice also defines @ExceptionHandler(IllegalStateException.class). The controller's
    handler throws IllegalStateException. Which one handles it?
  options:
  - "The controller-local @ExceptionHandler, which always takes precedence over global @ControllerAdvice for that controller"
  - "The @ControllerAdvice handler, because globally-scoped advice is registered later and overrides any controller-local handlers"
  - "Both run in sequence: the controller-local handler executes first, then the @ControllerAdvice handler post-processes the same exception"
  - "It is ambiguous because two equally-specific handlers match, so DispatcherServlet abandons resolution and returns a 500 error"
  answer: 0
  explanation: |
    Spring first looks for a matching @ExceptionHandler within the controller itself; only if none
    matches does it consult @ControllerAdvice beans. A controller-local handler always wins for its
    own controller.
  ref: "concepts.md#exception-resolution-internals"

- id: spring-mvc-request-lifecycle-051
  difficulty: advanced
  tags: [filter, exception-resolver]
  question: |
    An exception is thrown inside a Servlet Filter's doFilter, before the request reaches
    DispatcherServlet. Can a Spring @ExceptionHandler / HandlerExceptionResolver handle it?
  options:
  - "Yes, HandlerExceptionResolver registers a thread-wide catch that intercepts every exception thrown anywhere in the request thread"
  - "No, HandlerExceptionResolvers only handle exceptions arising from the handler or rendering inside DispatcherServlet; a filter exception propagates to container error handling"
  - "Yes, but only if the filter is a DelegatingFilterProxy, which forwards its exceptions into the DispatcherServlet resolver chain"
  - "No, but @ControllerAdvice specifically intercepts filter exceptions through a dedicated pre-dispatch advice hook"
  answer: 1
  explanation: |
    HandlerExceptionResolvers operate inside DispatcherServlet.doDispatch, around handler invocation
    and view rendering. A filter runs outside DispatcherServlet, so its exceptions bypass MVC
    exception resolution and go to the container's error handling (e.g. the error page/dispatch).
  ref: "concepts.md#filter-ordering-and-delegatingfilterproxy"

- id: spring-mvc-request-lifecycle-052
  difficulty: expert
  tags: [handler-mapping, ambiguous, path-matching]
  question: |
    Two @GetMapping methods match GET /users/42: one mapped "/users/{id}" and one mapped
    "/users/42". What happens?
  options:
  - "IllegalStateException at startup, because Spring rejects any two mappings whose path patterns overlap during context refresh"
  - "The first declared method is invoked, since Spring resolves overlaps by the source-declaration order of the handler methods"
  - "The exact pattern /users/42 is selected, because RequestMappingInfo comparison ranks a literal path as more specific than a {var} template"
  - "A 500 error at request time, because Spring never disambiguates overlapping patterns and fails the dispatch"
  answer: 2
  explanation: |
    When multiple mappings match, Spring sorts matching RequestMappingInfos by specificity: an exact
    literal path outranks a URI-template variable, which outranks wildcards. The most specific
    (/users/42) wins. Only truly equally-specific matches raise the ambiguous-mapping error at
    request time.
  ref: "concepts.md#handlermapping-ordering-and-path-matching"

- id: spring-mvc-request-lifecycle-053
  difficulty: advanced
  tags: [handler-mapping, ordering]
  question: |
    In an @EnableWebMvc application, why do requests to @RequestMapping controller methods take
    precedence over the static-resource handler when a URL could match both?
  options:
  - "Static resources are only served if no controller exists anywhere in the application, so any @Controller globally suppresses the resource handler"
  - "DispatcherServlet always checks controllers last, after every resource handler has already been given a chance to match the URL"
  - "The servlet container, not Spring, decides this precedence by consulting its own welcome-file and default-servlet ordering rules"
  - "RequestMappingHandlerMapping has a lower order value (0) than the resource SimpleUrlHandlerMapping (near Integer.MAX_VALUE), and DispatcherServlet uses the first HandlerMapping that returns a match"
  answer: 3
  explanation: |
    DispatcherServlet consults HandlerMappings sorted by Ordered. RequestMappingHandlerMapping is
    order 0; the resource-handling SimpleUrlHandlerMapping is ordered near Integer.MAX_VALUE. The
    first mapping to return a non-null chain wins, so annotated controllers are matched before static
    resources.
  ref: "concepts.md#handlermapping-ordering-and-path-matching"

- id: spring-mvc-request-lifecycle-054
  difficulty: expert
  tags: [path-pattern, migration]
  question: |
    After migrating to Spring 6 with the default PathPatternParser, a mapping @GetMapping("/files/**/report")
    that worked under AntPathMatcher now fails to be parsed. Why?
  options:
  - "PathPattern only permits ** as the final path segment; it cannot appear in the middle of a pattern"
  - "PathPattern requires all wildcard segments to be lowercase, so an uppercase path token silently breaks parsing"
  - "PathPattern does not support wildcards at all; only {var} URI templates are accepted by the parser now"
  - "The ** token must be escaped as \\*\\* under PathPattern, otherwise the parser treats it as a literal path"
  answer: 0
  explanation: |
    PathPattern (the Spring 5.3+/6 default) restricts ** to the end of the pattern. Patterns like
    /files/**/report that embed ** mid-path were legal with AntPathMatcher but are rejected by
    PathPatternParser, a common migration break.
  ref: "concepts.md#handlermapping-ordering-and-path-matching"

- id: spring-mvc-request-lifecycle-055
  difficulty: advanced
  tags: [path-matching, trailing-slash, migration]
  question: |
    A team upgrades to Spring 6 and clients calling GET /users/ (with a trailing slash) suddenly get
    404, though /users still works. What changed?
  options:
  - "Spring 6 now requires every mapped path to end with a trailing slash, so it is /users itself that should now be returning 404 rather than /users/"
  - "Trailing-slash matching is deprecated and disabled by default; /users no longer implicitly matches /users/, so you must map both or add a redirect"
  - "The PathPatternParser silently strips the trailing slash from every incoming URI before matching, so /users/ collapses to an empty segment and can never match a handler"
  - "This is an unintended regression that is fixed simply by re-enabling the old suffix pattern matching flag on the configured path matcher"
  answer: 1
  explanation: |
    Spring 6 removed the default trailing-slash match (setUseTrailingSlashMatch), just as suffix
    pattern matching was disabled. A mapping for /users no longer also matches /users/. You must
    declare both variants explicitly or configure a redirect.
  ref: "concepts.md#handlermapping-ordering-and-path-matching"

- id: spring-mvc-request-lifecycle-056
  difficulty: expert
  tags: [async, threading, thread-pool]
  question: |
    A handler returns a Callable<Report>. Under a default (unconfigured) Spring MVC async setup,
    where does the Callable run, and what is the production concern?
  options:
  - "On the same container request thread that entered the handler, which is simply held open until the Callable returns, so there is no additional resourcing concern to worry about"
  - "On the servlet container's own request thread pool (e.g. Tomcat's worker threads), which is already bounded and tuned, so reusing it for the Callable is always perfectly safe"
  - "On a SimpleAsyncTaskExecutor, which creates a new thread per task and does NOT pool threads; under load this can exhaust resources, so a real bounded executor should be configured"
  - "On the JVM's common ForkJoinPool, which is sized to the available processors and is therefore bounded and safe for blocking report generation by default"
  answer: 2
  explanation: |
    By default Spring MVC executes Callable results on a SimpleAsyncTaskExecutor, which spawns a new
    thread per task rather than pooling. That is fine for demos but risky under load; you should
    configure a proper bounded AsyncTaskExecutor via WebMvcConfigurer.configureAsyncSupport.
  ref: "concepts.md#async-request-processing"

- id: spring-mvc-request-lifecycle-057
  difficulty: expert
  tags: [async, dispatcher, re-dispatch]
  question: |
    When a DeferredResult is completed from a background thread, how does Spring MVC produce the
    final response?
  options:
  - "The background thread writes the serialized result directly to the original response output stream while the container's request thread stays blocked and waiting on it"
  - "DispatcherServlet re-runs the full handler-mapping lookup and re-invokes the original controller method a second time so it can return the now-available value"
  - "Spring opens a brand-new HTTP connection back to the client and pushes the completed result over that separate side channel once the background thread finishes"
  - "The container re-dispatches the request to DispatcherServlet as a DispatcherType.ASYNC dispatch; the mapping/handler is not re-run, but the produced value flows through return-value handling and rendering"
  answer: 3
  explanation: |
    Setting the async result triggers a container ASYNC re-dispatch back into DispatcherServlet. The
    handler is not re-invoked; instead the resolved value is passed through the return-value handlers
    and rendering. Filters/interceptors mapped for ASYNC run on this second dispatch.
  ref: "concepts.md#async-request-processing"

- id: spring-mvc-request-lifecycle-058
  difficulty: expert
  tags: [async, threadlocal, security-context]
  question: |
    A controller returns a Callable that reads SecurityContextHolder.getContext() (default
    MODE_THREADLOCAL). It returns null/anonymous even though the caller was authenticated. Why?
  options:
  - "SecurityContextHolder is ThreadLocal-bound; the Callable runs on a different thread that does not inherit the original thread's context unless it is explicitly propagated"
  - "Spring Security proactively clears the SecurityContext the instant async processing starts, so any Callable that runs afterward always observes an empty, anonymous context"
  - "Callable return values are executed inside a dedicated unauthenticated sandbox by design, so they always run stripped of the caller's authentication for isolation reasons"
  - "DeferredResult must be used instead, because a Callable is fundamentally unable to read the security context under any threading mode or explicit propagation strategy"
  answer: 0
  explanation: |
    With MODE_THREADLOCAL the SecurityContext lives in a ThreadLocal on the request thread. The
    Callable executes on a separate executor thread that does not see that ThreadLocal unless
    propagated (e.g. DelegatingSecurityContextRunnable, a TaskDecorator, or MODE_INHERITABLETHREADLOCAL).
  ref: "concepts.md#async-request-processing"

- id: spring-mvc-request-lifecycle-059
  difficulty: advanced
  tags: [async, interceptor]
  question: |
    Which interceptor callback should you implement to observe the exact moment the container thread
    is released for an async handler (before the result is available)?
  options:
  - "postHandle on a plain HandlerInterceptor, which the container fires the moment concurrent handling begins and the request thread is handed back"
  - "afterConcurrentHandlingStarted on an AsyncHandlerInterceptor"
  - "afterCompletion on a plain HandlerInterceptor, which is invoked once immediately at the point the container thread is released for async processing"
  - "preHandle, which Spring deliberately re-invokes a second time at the exact moment concurrent handling starts and the container thread is freed"
  answer: 1
  explanation: |
    AsyncHandlerInterceptor adds afterConcurrentHandlingStarted, called when concurrent handling
    begins and the container thread is released. Regular postHandle/afterCompletion for the initial
    dispatch are not invoked at that point; they run on the later ASYNC dispatch.
  ref: "concepts.md#async-request-processing"

- id: spring-mvc-request-lifecycle-060
  difficulty: advanced
  tags: [data-binding, binding-result, ordering]
  question: |
    A handler is public String submit(@Valid @ModelAttribute Form form, Model model,
    BindingResult errors). Validation fails. What happens?
  options:
  - "The violations are placed into the BindingResult and the method still runs normally, because any Errors parameter anywhere in the signature is automatically bound to the validated form object"
  - "The intervening Model parameter transparently absorbs the binding errors and forwards them to the view, so the request succeeds and re-renders the form with messages"
  - "A BindException (400) is thrown instead of populating BindingResult, because the BindingResult parameter does not immediately follow the @ModelAttribute parameter"
  - "Spring silently ignores the validation entirely, because @Valid placed on an @ModelAttribute parameter is only honored for @RequestBody arguments and is a no-op here"
  answer: 2
  explanation: |
    An Errors/BindingResult parameter must immediately follow the model attribute it reports on. Here
    Model sits between form and errors, so Spring does not treat errors as the binding result for
    form; validation failure raises BindException (400) rather than letting you inspect the errors.
  ref: "concepts.md#data-binding-type-conversion-and-validation-internals"

- id: spring-mvc-request-lifecycle-061
  difficulty: advanced
  tags: [validation, request-body, model-attribute]
  question: |
    How does a validation failure differ between @Valid @RequestBody (no following Errors) and
    @Valid @ModelAttribute (with a following BindingResult)?
  options:
  - "Both cases throw MethodArgumentNotValidException (400) identically, because the presence or absence of an Errors parameter has no bearing on how Spring reports constraint violations"
  - "The @ModelAttribute case throws the exception and aborts, while the @RequestBody case records the violations silently into an implicit BindingResult and lets the handler run"
  - "Neither annotation triggers any bean validation at all unless @Validated is additionally placed at the controller class level to switch on the validation infrastructure"
  - "@RequestBody throws MethodArgumentNotValidException (400); @ModelAttribute records violations in the BindingResult so the handler can run and re-render the form"
  answer: 3
  explanation: |
    For @RequestBody with no adjacent Errors, violations throw MethodArgumentNotValidException (400).
    For @ModelAttribute with a following BindingResult, violations are stored there and the handler
    still executes, which is how form re-display works.
  ref: "concepts.md#data-binding-type-conversion-and-validation-internals"

- id: spring-mvc-request-lifecycle-062
  difficulty: expert
  tags: [init-binder, security, data-binding]
  question: |
    An @InitBinder method calls binder.setAllowedFields("name", "email"). What is the primary purpose
    and effect?
  options:
  - "It restricts data binding to only those fields, mitigating mass-assignment attacks by ignoring any other submitted request parameters when populating the object"
  - "It marks name and email as mandatory inputs, so the WebDataBinder throws a binding exception and rejects the request whenever either parameter is absent from the submission"
  - "It aliases the incoming request parameters, renaming whatever keys the client sends to name and email before the WebDataBinder maps them onto the target object's properties"
  - "It registers name and email as globally-scoped model attributes, exposing their bound values to every other controller and view across the entire application context"
  answer: 0
  explanation: |
    setAllowedFields limits which fields WebDataBinder will bind from request parameters. Any other
    submitted parameters are ignored, preventing mass-assignment/over-posting where an attacker sets
    unintended fields (e.g. isAdmin). It does not make fields required.
  ref: "concepts.md#data-binding-type-conversion-and-validation-internals"

- id: spring-mvc-request-lifecycle-063
  difficulty: advanced
  tags: [type-conversion, status-codes]
  question: |
    A handler has @RequestParam int age and the request sends ?age=abc. What exception/status
    results, and how does it differ from omitting the parameter entirely?
  options:
  - "Both the unconvertible value and the omitted parameter throw the identical MissingServletRequestParameterException (400), since Spring treats an unparseable value as functionally equivalent to a missing one"
  - "abc throws MethodArgumentTypeMismatchException (400) from conversion failure; omitting it throws MissingServletRequestParameterException (400) from a missing required param"
  - "The value abc yields 415 Unsupported Media Type because the primitive type cannot consume a text token, whereas omitting the parameter entirely yields a 400 Bad Request instead"
  - "The value abc is silently coerced to the int default of 0 and the handler runs, whereas omitting the required parameter altogether throws and resolves to a 400 Bad Request"
  answer: 1
  explanation: |
    A present-but-unconvertible value triggers a type conversion failure
    (MethodArgumentTypeMismatchException), whereas a missing required parameter triggers
    MissingServletRequestParameterException. Both resolve to 400 via DefaultHandlerExceptionResolver
    but are distinct exceptions you can handle separately.
  ref: "concepts.md#data-binding-type-conversion-and-validation-internals"

- id: spring-mvc-request-lifecycle-064
  difficulty: expert
  tags: [validated, validation-groups]
  question: |
    Which statement correctly distinguishes Spring's @Validated from Jakarta's @Valid on a handler
    parameter?
  options:
  - "Jakarta's @Valid is the annotation that carries the value attribute for validation groups, while Spring's @Validated is the older group-unaware form retained only for backward compatibility"
  - "They are exactly identical annotations that merely live in different packages, so which one you choose is purely a stylistic import preference with no behavioral difference at all"
  - "Only @Validated supports validation groups; additionally, @Validated at the class level enables method-level validation via MethodValidationPostProcessor, which throws ConstraintViolationException"
  - "@Validated is only ever honored on @RequestBody parameters and @Valid is only ever honored on @ModelAttribute parameters, so the two are not interchangeable across argument types"
  answer: 2
  explanation: |
    Spring's @Validated adds validation-group support (jakarta @Valid has none) and, when placed on a
    class, activates AOP-based method-parameter validation via MethodValidationPostProcessor, whose
    failures surface as ConstraintViolationException rather than MethodArgumentNotValidException.
  ref: "concepts.md#data-binding-type-conversion-and-validation-internals"

- id: spring-mvc-request-lifecycle-065
  difficulty: expert
  tags: [message-converters, configuration, gotcha]
  question: |
    A developer overrides WebMvcConfigurer.configureMessageConverters(List) and adds only a custom
    converter. Afterwards, JSON responses from @RestController break. Why?
  options:
  - "configureMessageConverters is restricted to registering XML-family converters only, so adding a converter through it can never affect how JSON payloads are serialized by the handlers"
  - "Custom HttpMessageConverters are simply not permitted to participate in JSON handling at all, because Jackson serialization is wired directly into DispatcherServlet and cannot be overridden"
  - "The callback must return the mutated converter list back to the framework, and forgetting to return it silently discards all of the pre-registered default converters including Jackson"
  - "configureMessageConverters REPLACES the entire default converter list, so Jackson (and String/ByteArray) converters are lost; extendMessageConverters should be used to append instead"
  answer: 3
  explanation: |
    Implementing configureMessageConverters and adding to the passed list replaces the default set
    entirely (Jackson, String, ByteArray, etc. are gone). To keep defaults and add/tweak, override
    extendMessageConverters instead.
  ref: "concepts.md#content-negotiation-internals"

- id: spring-mvc-request-lifecycle-066
  difficulty: advanced
  tags: [content-negotiation, status-codes]
  question: |
    A @GetMapping(produces = "application/json") handler receives a request with Accept:
    application/xml, and no converter/mapping can satisfy XML. What does Spring return?
  options:
  - "406 Not Acceptable, because the requested media type cannot be produced by the mapping/converters"
  - "200 OK carrying the JSON body anyway, because Spring falls back to the handler's produces type and ignores an Accept header it cannot satisfy"
  - "415 Unsupported Media Type, because the mismatch between the client's requested XML and the handler's declared JSON is classified as an unsupported content type"
  - "500 Internal Server Error, because the converter chain fails to serialize the object into the requested XML and the resulting exception propagates uncaught"
  answer: 0
  explanation: |
    When the client's acceptable media types cannot be satisfied by the mapping's produces condition
    and available converters, Spring returns 406 Not Acceptable. 415 is for an unsupported request
    Content-Type (the consumes side).
  ref: "concepts.md#content-negotiation-internals"

- id: spring-mvc-request-lifecycle-067
  difficulty: expert
  tags: [content-negotiation, spring6, path-extension]
  question: |
    In Spring 6 with default configuration, a client requests GET /report.json expecting JSON via
    the extension. What is the default behavior?
  options:
  - "Path-extension content negotiation remains enabled by default in Spring 6, so the trailing .json is parsed as a format hint and deterministically selects the JSON converter"
  - "Path-extension (suffix) content negotiation is disabled by default; the .json is treated as part of the path, not a format hint, so negotiation relies on the Accept header"
  - "Spring rejects the request outright with an error, because file-style extensions on mapped paths are strictly forbidden by the default PathPatternParser configuration"
  - "The .json path extension is always given priority over and overrides whatever media type the client advertises in its Accept header for the request"
  answer: 1
  explanation: |
    Spring 6 disables path-extension content negotiation by default (security/ambiguity reasons).
    The Accept header is the primary strategy; a .json suffix is not interpreted as a format request
    unless explicitly configured.
  ref: "concepts.md#content-negotiation-internals"

- id: spring-mvc-request-lifecycle-068
  difficulty: expert
  tags: [thread-safety, controller, state]
  question: |
    A @Controller stores the current request's user in a private instance field during preprocessing
    and reads it later in the same method chain. Under concurrent load, users occasionally see each
    other's data. What is the root cause?
  options:
  - "DispatcherServlet itself is not thread-safe and processes concurrent requests unsynchronized, so its shared dispatch state leaks one user's data into another user's response"
  - "Spring instantiates a fresh controller bean for every incoming request by default, so per-request instance fields are isolated and this cross-talk cannot actually occur"
  - "@Controller beans are singletons shared across concurrent request threads; a mutable instance field is shared state, so one request overwrites another's value"
  - "The root cause is undersized servlet-container worker thread pool tuning, which forces distinct requests to be multiplexed onto and interleaved within a single reused thread"
  answer: 2
  explanation: |
    Controllers are singletons by default and handle concurrent requests on multiple threads. A
    mutable instance field is shared mutable state; concurrent requests race on it. Per-request state
    must live in method parameters, request-scoped beans, or ThreadLocal-based holders.
  ref: "concepts.md#frameworkservlet-initialization-and-thread-safety"

- id: spring-mvc-request-lifecycle-069
  difficulty: advanced
  tags: [initialization, strategies, lifecycle]
  question: |
    When does DispatcherServlet resolve its strategy beans (HandlerMappings, HandlerAdapters,
    ViewResolvers, etc.) from the WebApplicationContext?
  options:
  - "On every incoming request, re-scanning the WebApplicationContext freshly each time so that newly added strategy beans are always picked up immediately"
  - "Lazily on first use, resolving and caching each strategy type only the first time an incoming request actually needs that particular category of strategy"
  - "At compile time, where an annotation processor bakes the concrete strategy bean references into the generated DispatcherServlet before the application ever starts"
  - "Once, during servlet initialization / context refresh via onRefresh() -> initStrategies(), and then reused for all requests"
  answer: 3
  explanation: |
    DispatcherServlet.onRefresh() calls initStrategies() to populate its strategy fields once at
    servlet init (or on context refresh). Those references are then reused across all requests, which
    is why the strategies must be thread-safe/effectively immutable.
  ref: "concepts.md#frameworkservlet-initialization-and-thread-safety"

- id: spring-mvc-request-lifecycle-070
  difficulty: advanced
  tags: [request-context-holder, threadlocal, async]
  question: |
    Deep in a service class you call RequestContextHolder.getRequestAttributes() to read a
    request-scoped bean, and it works on normal requests but returns null inside a @Async method.
    Why?
  options:
  - "RequestContextHolder is backed by a ThreadLocal populated on the request thread; an @Async method runs on a different thread that does not inherit those attributes unless propagated"
  - "RequestContextHolder is deliberately disabled for any code invoked outside of a controller class, so service-layer lookups against it return null once the call leaves the web layer"
  - "@Async methods run in a restricted execution mode that forbids access to any Spring-managed beans, so the request-scoped lookup fails along with all other bean access there"
  - "Request scope is only active during the view-rendering phase of the lifecycle, and an @Async task typically runs before rendering, so the request attributes have not yet been established"
  answer: 0
  explanation: |
    RequestContextHolder uses a ThreadLocal set up per request thread (by FrameworkServlet or
    RequestContextFilter). An @Async task executes on a separate thread without those attributes, so
    request-scoped lookups fail unless the context is explicitly propagated to the async thread.
  ref: "concepts.md#frameworkservlet-initialization-and-thread-safety"

- id: spring-mvc-request-lifecycle-071
  difficulty: expert
  tags: [filter, once-per-request, dispatch]
  question: |
    Why does Spring provide OncePerRequestFilter rather than relying on a plain Filter, and when does
    it matter?
  options:
  - "It arranges for the filter's logic to execute a single time per servlet instance lifetime rather than per request, amortizing setup cost across all requests for performance"
  - "A single request can traverse the filter chain multiple times across FORWARD/INCLUDE/ASYNC dispatches; OncePerRequestFilter uses a request attribute to ensure doFilterInternal executes only once per request"
  - "It transparently caches the outcome of the filter and replays it for subsequent requests that target the same URL path, avoiding recomputation on repeated hits"
  - "It guarantees ordering by forcing the filter to run strictly before DispatcherServlet in the chain, a positioning that an ordinary container-registered Filter can never achieve"
  answer: 1
  explanation: |
    Because a request may re-enter the filter chain on internal dispatches (forward, include, async
    re-dispatch), a naive filter could run several times. OncePerRequestFilter guards with a
    per-request attribute so its logic runs a single time per request.
  ref: "concepts.md#filter-ordering-and-delegatingfilterproxy"

- id: spring-mvc-request-lifecycle-072
  difficulty: advanced
  tags: [delegating-filter-proxy, spring-security]
  question: |
    What problem does DelegatingFilterProxy solve, and how is it typically used (e.g. by Spring
    Security)?
  options:
  - "It adapts an existing Spring HandlerInterceptor so the servlet container can register and run it as a standard jakarta.servlet.Filter in the chain"
  - "It relocates registered filters to execute inside DispatcherServlet's dispatch loop so that they gain MVC awareness and direct access to the resolved ModelAndView"
  - "It is a thin container-managed Filter that delegates to a Spring-managed bean of type Filter (found by name in the WebApplicationContext), giving the real filter full dependency injection"
  - "It consolidates several separately-registered filters into one combined filter instance to reduce chain traversal overhead and improve per-request performance"
  answer: 2
  explanation: |
    The servlet container instantiates filters directly, bypassing Spring DI. DelegatingFilterProxy
    is registered with the container but delegates each call to a Spring bean Filter (by name), so
    the actual filter is a fully wired Spring bean. Spring Security's springSecurityFilterChain is
    wired exactly this way.
  ref: "concepts.md#filter-ordering-and-delegatingfilterproxy"

- id: spring-mvc-request-lifecycle-073
  difficulty: advanced
  tags: [filter, interceptor, request-wrapping]
  question: |
    You need to read and cache the raw request body so it can be logged and still consumed by
    @RequestBody deserialization. Which mechanism is appropriate and why?
  options:
  - "A HandlerInterceptor.preHandle, because it can substitute a ContentCachingRequestWrapper for the incoming request before the handler runs"
  - "postHandle, because the fully buffered request body is still readable there once the handler has finished executing and returned"
  - "An @InitBinder method, because it runs early enough to capture and cache the raw body before WebDataBinder populates the object"
  - "A Filter that wraps the request (e.g. ContentCachingRequestWrapper), because filters can replace/wrap the request/response objects while interceptors cannot"
  answer: 3
  explanation: |
    Only a Filter can wrap/replace the request and response objects. A wrapper like
    ContentCachingRequestWrapper buffers the body so it can be read for logging and still be
    available to the message converter. HandlerInterceptors receive the existing objects and cannot
    wrap them.
  ref: "concepts.md#handlerinterceptor-vs-servlet-filter"

- id: spring-mvc-request-lifecycle-074
  difficulty: expert
  tags: [redirect, flash-attributes, model]
  question: |
    A handler returns "redirect:/summary" and adds an attribute via
    model.addAttribute("orderId", 42) (a simple Long). What happens to orderId after the redirect?
  options:
  - "It is appended to the redirect URL as a query parameter (/summary?orderId=42) because plain model attributes on a redirect are exposed as query params, not carried in the request"
  - "It is preserved as a request attribute on the forwarded request and is automatically available in the /summary handler's model"
  - "It is stored in the HTTP session indefinitely and must be manually cleared by the /summary handler after it is read"
  - "It is silently discarded during the redirect, since only RedirectAttributes flash attributes are able to survive across the new request"
  answer: 0
  explanation: |
    On a redirect, primitive/simple model attributes are appended to the target URL as query
    parameters (subject to the redirect's URI handling). To carry attributes across the new request
    without exposing them in the URL, use RedirectAttributes flash attributes, which the
    FlashMapManager stores briefly.
  ref: "concepts.md#viewresolver-and-view-rendering"

- id: spring-mvc-request-lifecycle-075
  difficulty: expert
  tags: [flash-attributes, flash-map-manager]
  question: |
    How do flash attributes survive a POST-redirect-GET, and when are they removed?
  options:
  - "They are written permanently into the HTTP session under a fixed key and remain there until the developer explicitly removes them after reading"
  - "FlashMapManager saves them (typically in the session) before the redirect and DispatcherServlet retrieves and then removes them on the subsequent matching request, making them available for exactly one request"
  - "They are Base64-encoded and appended to the redirect Location URL, then decoded back into model attributes when the follow-up GET arrives"
  - "They live in an InheritableThreadLocal that is carried across both the POST and the redirected GET by the same request-handling thread"
  answer: 1
  explanation: |
    RedirectAttributes flash attributes are handed to the FlashMapManager, which persists them
    (usually in the session) keyed to the target. On the next matching request DispatcherServlet
    surfaces them into the model and removes them, so they exist for a single subsequent request.
  ref: "concepts.md#request-processing-flow"

- id: spring-mvc-request-lifecycle-076
  difficulty: advanced
  tags: [response-entity, response-status, precedence]
  question: |
    A handler method is annotated @ResponseStatus(HttpStatus.ACCEPTED) but returns
    ResponseEntity.ok(body) (status 200). What status does the client receive?
  options:
  - "202 Accepted, because the method-level @ResponseStatus annotation always overrides any status set on the returned ResponseEntity"
  - "500 Internal Server Error, because Spring detects two conflicting declared statuses and aborts the response as an ambiguous configuration"
  - "200 OK, because the status carried by the returned ResponseEntity takes precedence over @ResponseStatus for that invocation"
  - "204 No Content, which Spring emits as a neutral compromise default whenever a method's annotation and its ResponseEntity disagree"
  answer: 2
  explanation: |
    When a handler returns a ResponseEntity, its explicit status is used for the response. The static
    @ResponseStatus on the method is effectively overridden by the per-invocation status of the
    ResponseEntity.
  ref: "concepts.md#responseentity"

- id: spring-mvc-request-lifecycle-077
  difficulty: advanced
  tags: [handler-adapter, argument-resolver, extensibility]
  question: |
    You want a custom controller parameter type (e.g. a @CurrentUser User) to be injected
    automatically. Which extension point resolves it, and where is it registered?
  options:
  - "A HandlerMapping, registered via WebMvcConfigurer.addInterceptors so it can inject the parameter during routing"
  - "A ViewResolver, registered as a default strategy entry in DispatcherServlet.properties on the classpath"
  - "An HttpMessageConverter, registered via configureMessageConverters so it can deserialize the parameter from the body"
  - "A HandlerMethodArgumentResolver, registered on the RequestMappingHandlerAdapter (e.g. via WebMvcConfigurer.addArgumentResolvers)"
  answer: 3
  explanation: |
    Method-parameter injection is handled by HandlerMethodArgumentResolvers owned by
    RequestMappingHandlerAdapter. You add a custom resolver via
    WebMvcConfigurer.addArgumentResolvers (which appends to the adapter's resolver list).
  ref: "concepts.md#handlermapping-and-handleradapter"

- id: spring-mvc-request-lifecycle-078
  difficulty: expert
  tags: [handler-adapter, supports, dispatch]
  question: |
    DispatcherServlet has multiple HandlerAdapters. After a HandlerMapping returns a handler, how
    does DispatcherServlet decide which adapter invokes it?
  options:
  - "It iterates the HandlerAdapters and uses the first whose supports(handler) returns true; if none supports it, a ServletException is thrown"
  - "It uses whichever adapter has the lowest @Order value, invoking it regardless of the concrete handler type returned"
  - "The HandlerMapping returns the chosen HandlerAdapter alongside the handler inside the HandlerExecutionChain"
  - "It always delegates to RequestMappingHandlerAdapter, since that adapter can invoke every kind of handler object"
  answer: 0
  explanation: |
    getHandlerAdapter iterates the ordered adapters and returns the first whose supports(handler) is
    true (e.g. RequestMappingHandlerAdapter supports HandlerMethod, SimpleControllerHandlerAdapter
    supports Controller). If none matches, it throws ServletException ("No adapter for handler").
  ref: "concepts.md#handlermapping-and-handleradapter"

- id: spring-mvc-request-lifecycle-079
  difficulty: expert
  tags: [request-body, model-attribute, get]
  question: |
    A developer writes @GetMapping and a parameter @RequestBody Filter filter, expecting to bind
    query parameters. What is the likely outcome?
  options:
  - "The individual query-string parameters are automatically bound onto the Filter object's matching fields via the WebDataBinder"
  - "@RequestBody attempts to read and deserialize the HTTP request body via a message converter; a typical GET has no body/Content-Type, commonly yielding an error (e.g. 400 unreadable or 415) rather than binding query params"
  - "Spring silently rewrites @RequestBody as @ModelAttribute for GET requests so the query parameters bind as intended"
  - "It always returns 405 Method Not Allowed, because @RequestBody is disallowed on any GET-mapped handler method"
  answer: 1
  explanation: |
    @RequestBody always targets the request body via an HttpMessageConverter selected by
    Content-Type; it does not read query parameters. For a bodyless GET this generally fails (unread
    able body / unsupported media type). Query/form binding is @ModelAttribute's or @RequestParam's
    job.
  ref: "concepts.md#method-argument-annotations"

- id: spring-mvc-request-lifecycle-080
  difficulty: advanced
  tags: [exception-resolver, empty-modelandview]
  question: |
    In the HandlerExceptionResolver chain, what is the significance of a resolver returning a
    non-null but EMPTY ModelAndView versus returning null?
  options:
  - "Empty and null are treated identically, so both simply advance DispatcherServlet to the next resolver in the configured chain"
  - "An empty ModelAndView signals success and makes DispatcherServlet emit a 204 No Content response automatically, without invoking any view"
  - "An empty ModelAndView signals the exception was handled (response already written, nothing to render), stopping the chain; null means 'not handled here', so DispatcherServlet tries the next resolver"
  - "Null means the exception was handled and the chain stops, whereas a non-null empty ModelAndView means it was left unhandled for the next resolver"
  answer: 2
  explanation: |
    Returning null indicates the resolver did not handle the exception, so the next resolver is
    tried. A non-null (possibly empty) ModelAndView indicates it was handled; an empty one means the
    response was fully written and there is nothing to render.
  ref: "concepts.md#exception-resolution-internals"

- id: spring-mvc-request-lifecycle-081
  difficulty: advanced
  tags: [interceptor, filter, exception-scope]
  question: |
    For authentication that must reject unauthenticated requests before any controller logic and be
    able to short-circuit with its own response body, which is generally the better fit and why?
  options:
  - "A HandlerInterceptor, because its preHandle runs before any Servlet Filter in the chain and can reject the request first"
  - "An @ExceptionHandler, because it is consulted before the handler runs and can preempt controller logic with its own body"
  - "A method-level @ModelAttribute, because it executes before each handler in the controller and can abort unauthenticated calls"
  - "A Filter (as Spring Security uses), because it runs outside/around DispatcherServlet, can wrap request/response, and applies uniformly regardless of MVC handler resolution"
  answer: 3
  explanation: |
    Security concerns that must apply to all requests and may wrap the request/response are best done
    as filters, which run before DispatcherServlet and independently of handler mapping. That is why
    Spring Security is filter-based. Interceptors are for lighter, MVC-aware, handler-tied checks.
  ref: "concepts.md#handlerinterceptor-vs-servlet-filter"

- id: spring-mvc-request-lifecycle-082
  difficulty: expert
  tags: [context-hierarchy, bean-resolution]
  question: |
    A service bean is defined in BOTH the root context and the DispatcherServlet's child context
    (same type). A controller in the child context autowires it by type. Which instance is injected,
    and can a root-context bean autowire the controller?
  options:
  - "The child-context instance is injected (the child is queried first / shadows the parent); and no, a root-context bean cannot see or autowire beans defined only in the child context"
  - "The root-context instance is injected (the parent is queried first); and yes, a root-context bean can autowire a child-context controller by type"
  - "Injection is ambiguous because two beans of the same type are visible, so the child context fails to start in every such case"
  - "Both instances are injected together as a collection, and Spring leaves it to the controller to pick which one to use"
  answer: 0
  explanation: |
    A child context resolves its own beans before delegating to the parent, so the child-context
    instance shadows the root one for the controller. Visibility is one-directional: the child sees
    parent beans, but the root cannot see child beans, so a root bean cannot autowire the controller.
  ref: "concepts.md#dispatcherservlet-as-front-controller"

- id: spring-mvc-request-lifecycle-083
  difficulty: expert
  tags: [request-flow, response-committed, exceptions]
  question: |
    A streaming @RestController handler writes half of a large JSON body, then throws an exception
    mid-serialization (response already committed). What does the client observe and why can't a
    HandlerExceptionResolver fix it?
  options:
  - "A clean 500 error page fully replaces the partial body, because Spring discards everything already written and re-renders the error view"
  - "The client receives a truncated/partial body with the already-sent status (e.g. 200); because the response is committed, headers/status cannot be changed, so exception resolution cannot produce a proper error response"
  - "Spring buffers the entire response in memory, so it can throw away the partial output and send a fresh 500 status instead"
  - "The request is transparently retried from the very start on a new thread, and the client only ever sees the second, complete attempt"
  answer: 1
  explanation: |
    Once the response is committed (status/headers flushed and part of the body written), the status
    and headers are immutable. A HandlerExceptionResolver can no longer craft a proper error
    response; the client sees a truncated body with the originally-sent status. This is why partial
    writes and commit state matter for error handling.
  ref: "concepts.md#exception-resolution-internals"
