topic: "Actuator, Observability, and Production Concerns"
domain: spring-core
topic_slug: actuator-observability
version: 1
questions:
  - id: actuator-observability-001
    difficulty: beginner
    tags: [actuator, basics, spring-boot]
    question: |
      Which statement most accurately describes Spring Boot Actuator?
    options:
      - "It is part of the core Spring Framework (spring-context) and is always present in any Spring application."
      - "It is a Spring Boot module that auto-configures production-ready monitoring and management endpoints."
      - "It is a standalone metrics backend that replaces Prometheus."
      - "It is a build plugin that packages the application into an executable jar."
    answer: 1
    explanation: |
      Actuator ships as the Spring Boot module `spring-boot-actuator` (typically added via
      `spring-boot-starter-actuator`). It auto-configures management/monitoring endpoints. It is not
      part of plain Spring Framework core, not a metrics backend, and not a build/packaging plugin.
    ref: "concepts.md#what-actuator-is-and-why-it-exists"

  - id: actuator-observability-002
    difficulty: beginner
    tags: [actuator, base-path, endpoints]
    question: |
      By default, under which base path are Actuator web endpoints served?
    options:
      - "/admin"
      - "/management"
      - "/actuator"
      - "/api/health"
    answer: 2
    explanation: |
      The default base path is `/actuator`, so health is reached at `GET /actuator/health`. It can be
      changed with `management.endpoints.web.base-path`.
    ref: "concepts.md#what-actuator-is-and-why-it-exists"

  - id: actuator-observability-003
    difficulty: beginner
    tags: [health, endpoints]
    question: |
      Which endpoint reports whether the application and its dependencies are healthy?
    options:
      - "/actuator/info"
      - "/actuator/beans"
      - "/actuator/health"
      - "/actuator/env"
    answer: 2
    explanation: |
      `/actuator/health` returns an aggregated status (UP/DOWN/OUT_OF_SERVICE/UNKNOWN) built from the
      registered health indicators.
    ref: "concepts.md#key-endpoints-health-info-metrics-env-beans-loggers"

  - id: actuator-observability-004
    difficulty: beginner
    tags: [loggers, endpoints]
    question: |
      What makes the `/actuator/loggers` endpoint especially useful in production?
    options:
      - "It streams all application logs to the browser in real time over a WebSocket connection."
      - "It permanently rewrites the logback.xml configuration file on disk at runtime."
      - "It exports the application's log output directly to Prometheus for scraping."
      - "It lets you view and change log levels at runtime without restarting the app."
    answer: 3
    explanation: |
      `GET /actuator/loggers/<name>` shows a logger's level, and a `POST` with
      `{"configuredLevel":"DEBUG"}` changes it live — no redeploy or restart needed.
    ref: "concepts.md#key-endpoints-health-info-metrics-env-beans-loggers"

  - id: actuator-observability-005
    difficulty: beginner
    tags: [beans, endpoints]
    question: |
      What does the `/actuator/beans` endpoint show?
    options:
      - "The current JVM heap usage broken down by memory pool and generation."
      - "Only the beans annotated with @RestController, grouped by their request mappings."
      - "The resolved values of all environment properties across every property source."
      - "Every bean registered in the ApplicationContext, with type, scope, and dependencies."
    answer: 3
    explanation: |
      `/actuator/beans` dumps the full bean list of the context, useful for debugging wiring.
      Environment values are shown by `/actuator/env`.
    ref: "concepts.md#key-endpoints-health-info-metrics-env-beans-loggers"

  - id: actuator-observability-006
    difficulty: beginner
    tags: [exposure, defaults]
    question: |
      In modern Spring Boot, which endpoint is exposed over HTTP by default?
    options:
      - "All endpoints are exposed over HTTP by default."
      - "`health` and `beans`."
      - "Only `health`."
      - "No endpoints are exposed at all until you enable them."
    answer: 2
    explanation: |
      By default only `health` is exposed over the web. Others are opted in via
      `management.endpoints.web.exposure.include`.
    ref: "concepts.md#exposing-and-securing-endpoints"

  - id: actuator-observability-007
    difficulty: beginner
    tags: [exposure, configuration]
    question: |
      Which property exposes a specific set of endpoints (e.g. health, info, metrics) over HTTP?
    options:
      - "management.endpoints.web.exposure.include"
      - "management.endpoints.enabled-by-default"
      - "spring.actuator.web.endpoints.expose"
      - "server.actuator.endpoints.web.include"
    answer: 0
    explanation: |
      `management.endpoints.web.exposure.include=health,info,metrics` controls which endpoints are
      reachable over the web; `.exclude` removes some.
    ref: "concepts.md#exposing-and-securing-endpoints"

  - id: actuator-observability-008
    difficulty: beginner
    tags: [micrometer, metrics]
    question: |
      What best describes Micrometer's role?
    options:
      - "A logging framework that replaces SLF4J and Logback as Spring Boot's default backend."
      - "A dependency-injection container that manages the lifecycle and wiring of Spring beans."
      - "A distributed tracing UI similar to Zipkin that visualizes span timelines across services."
      - "A vendor-neutral application metrics facade that exports to backends like Prometheus or Datadog."
    answer: 3
    explanation: |
      Micrometer is a vendor-neutral metrics facade — "SLF4J for metrics." Code records against its
      API and Micrometer exports to whichever backend you configure.
    ref: "concepts.md#micrometer-as-the-metrics-facade"

  - id: actuator-observability-009
    difficulty: beginner
    tags: [micrometer, meters]
    question: |
      Which Micrometer meter type is appropriate for a value that only ever increases, such as the
      total number of requests served?
    options:
      - "Gauge"
      - "Timer"
      - "Counter"
      - "DistributionSummary"
    answer: 2
    explanation: |
      A Counter represents a monotonically increasing count (requests, errors). A Gauge is for
      up/down instantaneous values, a Timer for durations.
    ref: "concepts.md#micrometer-as-the-metrics-facade"

  - id: actuator-observability-010
    difficulty: beginner
    tags: [health-indicator, custom]
    question: |
      To add a custom check to `/actuator/health`, which interface do you typically implement?
    options:
      - "MetricsContributor"
      - "InfoContributor"
      - "EndpointFilter"
      - "HealthIndicator"
    answer: 3
    explanation: |
      Implementing `HealthIndicator` (returning a `Health` object) adds a component to the aggregated
      health. `InfoContributor` populates `/info`, not `/health`.
    ref: "concepts.md#custom-health-indicators"

  - id: actuator-observability-011
    difficulty: beginner
    tags: [liveness, readiness, kubernetes]
    question: |
      In Kubernetes terms, what happens when a container's LIVENESS probe fails?
    options:
      - "The container is restarted."
      - "Traffic is stopped but the container keeps running."
      - "The application logs a warning and continues normally."
      - "The pod is scaled up."
    answer: 0
    explanation: |
      A failing liveness probe signals the app is broken beyond recovery, so the platform restarts the
      container. Readiness failure only stops traffic routing without a restart.
    ref: "concepts.md#liveness-and-readiness-probes"

  - id: actuator-observability-012
    difficulty: beginner
    tags: [readiness, kubernetes]
    question: |
      What does a failing READINESS probe cause the orchestrator to do?
    options:
      - "Immediately restart the container and reschedule it onto another node."
      - "Delete the pod permanently and remove it from the ReplicaSet's desired count."
      - "Stop routing traffic to the instance without restarting it."
      - "Increase the JVM heap size and trigger a full garbage-collection cycle."
    answer: 2
    explanation: |
      Readiness answers "can I accept traffic right now?" On failure the instance is removed from the
      load balancer but not restarted, so it can recover and rejoin.
    ref: "concepts.md#liveness-and-readiness-probes"

  - id: actuator-observability-013
    difficulty: beginner
    tags: [logging, slf4j]
    question: |
      What is the default logging implementation used by Spring Boot?
    options:
      - "java.util.logging (JUL)"
      - "Log4j 1.x"
      - "Logback (behind the SLF4J facade)"
      - "System.out.println"
    answer: 2
    explanation: |
      Spring Boot uses SLF4J as the facade and Logback as the default backend, with Log4j2 and JUL as
      supported alternatives.
    ref: "concepts.md#logging-and-observability-basics"

  - id: actuator-observability-014
    difficulty: beginner
    tags: [info, endpoints]
    question: |
      Which endpoint is designed to expose arbitrary application information such as build version or
      git commit?
    options:
      - "/actuator/metrics"
      - "/actuator/info"
      - "/actuator/mappings"
      - "/actuator/configprops"
    answer: 1
    explanation: |
      `/actuator/info` is populated by `InfoContributor` beans (env `info.*` properties, build info,
      git info) and is empty by default.
    ref: "concepts.md#key-endpoints-health-info-metrics-env-beans-loggers"

  - id: actuator-observability-015
    difficulty: beginner
    tags: [shutdown, endpoints, defaults]
    question: |
      Which Actuator endpoint is DISABLED by default because it stops the application?
    options:
      - "health"
      - "metrics"
      - "shutdown"
      - "loggers"
    answer: 2
    explanation: |
      The `shutdown` endpoint gracefully stops the app and is disabled by default; it must be
      explicitly enabled and should never be exposed publicly.
    ref: "concepts.md#exposing-and-securing-endpoints"

  - id: actuator-observability-016
    difficulty: beginner
    tags: [security]
    question: |
      How are Actuator endpoints secured in current Spring Boot?
    options:
      - "Via a built-in `sensitive` flag on each endpoint that requires basic auth when set to true."
      - "They cannot be secured in-process; you must put a network firewall or reverse proxy in front."
      - "By setting management.security.enabled=true, which turns on Actuator's own auto-managed login."
      - "By adding Spring Security and using EndpointRequest matchers in a SecurityFilterChain."
    answer: 3
    explanation: |
      The old `sensitive` flag was removed. Today you secure endpoints with Spring Security, using
      `EndpointRequest.toAnyEndpoint()` / `EndpointRequest.to(...)` matchers.
    ref: "concepts.md#exposing-and-securing-endpoints"

  - id: actuator-observability-017
    difficulty: beginner
    tags: [metrics, endpoints]
    question: |
      Using the metrics endpoint, how do you view a single named metric such as JVM memory used?
    options:
      - "GET /actuator/metrics/jvm.memory.used"
      - "GET /actuator/jvm.memory.used"
      - "POST /actuator/metrics with the metric name in the body"
      - "GET /actuator/health/jvm.memory.used"
    answer: 0
    explanation: |
      `GET /actuator/metrics` lists names; `GET /actuator/metrics/{name}` drills into one, and
      `?tag=key:value` filters by dimension.
    ref: "concepts.md#key-endpoints-health-info-metrics-env-beans-loggers"

  - id: actuator-observability-018
    difficulty: beginner
    tags: [observability, pillars]
    question: |
      The three commonly cited pillars of observability are:
    options:
      - "Metrics, logs, and traces."
      - "CPU, memory, and disk."
      - "Controllers, services, and repositories."
      - "Health, info, and env."
    answer: 0
    explanation: |
      Observability is usually framed as metrics (Micrometer), logs (SLF4J/Logback), and distributed
      traces (Micrometer Tracing / OpenTelemetry).
    ref: "concepts.md#logging-and-observability-basics"

  - id: actuator-observability-019
    difficulty: intermediate
    tags: [enablement, exposure]
    question: |
      What is the difference between ENABLING and EXPOSING an Actuator endpoint?
    options:
      - "They are two interchangeable names for one setting; Boot treats enablement and exposure as the same flag."
      - "Enabling controls whether the endpoint bean exists; exposing controls whether it is reachable over web or JMX."
      - "Enabling selects the endpoint's web path, while exposing simply assigns the JMX object name it uses."
      - "Exposing is what creates the endpoint bean, and enabling is the gate that then makes it reachable."
    answer: 1
    explanation: |
      Enablement (`management.endpoint.<id>.enabled`) decides whether the endpoint bean is created;
      exposure (`management.endpoints.web.exposure.*`) decides whether an enabled endpoint is
      reachable. Both gates must pass.
    ref: "concepts.md#exposing-and-securing-endpoints"

  - id: actuator-observability-020
    difficulty: intermediate
    tags: [health, aggregation]
    question: |
      An app has three health indicators: db=UP, diskSpace=UP, paymentService=DOWN. With default
      aggregation, what is the overall `/actuator/health` status?
    options:
      - "UP, because a majority of the indicators report UP."
      - "UNKNOWN, because the mixed indicator results conflict."
      - "OUT_OF_SERVICE, because one dependency is unavailable."
      - "DOWN, because any DOWN drags the aggregate to DOWN."
    answer: 3
    explanation: |
      The default StatusAggregator orders DOWN > OUT_OF_SERVICE > UP > UNKNOWN, so a single DOWN makes
      the aggregate DOWN.
    ref: "concepts.md#key-endpoints-health-info-metrics-env-beans-loggers"

  - id: actuator-observability-021
    difficulty: intermediate
    tags: [health, show-details]
    question: |
      Which property controls whether component details are shown in the `/actuator/health` response?
    options:
      - "management.endpoint.health.show-details"
      - "management.health.details.enabled"
      - "management.endpoints.web.exposure.include"
      - "management.endpoint.health.sensitive"
    answer: 0
    explanation: |
      `management.endpoint.health.show-details` accepts `never`, `when-authorized`, or `always`.
      Keeping it `never`/`when-authorized` avoids leaking internal details to anonymous callers.
    ref: "concepts.md#key-endpoints-health-info-metrics-env-beans-loggers"

  - id: actuator-observability-022
    difficulty: intermediate
    tags: [exposure, precedence]
    question: |
      Given:
      management.endpoints.web.exposure.include=*
      management.endpoints.web.exposure.exclude=env,beans
      Which endpoints are reachable over the web?
    options:
      - "Only env and beans are reachable."
      - "Only health, because include=* is ignored when exclude is set."
      - "None; the two settings conflict and disable everything."
      - "All endpoints except env and beans."
    answer: 3
    explanation: |
      `include=*` exposes all endpoints, and `exclude` takes precedence, so every endpoint except
      `env` and `beans` is reachable.
    ref: "concepts.md#exposing-and-securing-endpoints"

  - id: actuator-observability-023
    difficulty: intermediate
    tags: [security, endpoint-request]
    question: |
      In a SecurityFilterChain, which expression matches ALL Actuator endpoints regardless of a
      customized base path?
    options:
      - "antMatcher(\"/actuator/**\")"
      - "requestMatchers(\"/**\")"
      - "EndpointRequest.to(\"all\")"
      - "EndpointRequest.toAnyEndpoint()"
    answer: 3
    explanation: |
      `EndpointRequest.toAnyEndpoint()` matches all endpoints and correctly honors a customized base
      path, unlike a hard-coded ant pattern.
    ref: "concepts.md#exposing-and-securing-endpoints"

  - id: actuator-observability-024
    difficulty: intermediate
    tags: [security, management-port]
    question: |
      Why do teams commonly set `management.server.port` to a different port than the application?
    options:
      - "It is a hard requirement, because Actuator refuses to start unless bound to its own port."
      - "Because Actuator endpoints are unable to share a servlet port with Spring MVC controllers."
      - "To double the number of available worker threads by giving the app a second connector pool."
      - "To isolate management endpoints on an internal port not exposed by the public load balancer."
    answer: 3
    explanation: |
      Serving management endpoints on a separate port lets you bind them to an internal network and
      keep them off the public load balancer — a common hardening technique.
    ref: "concepts.md#exposing-and-securing-endpoints"

  - id: actuator-observability-025
    difficulty: intermediate
    tags: [health-indicator, naming]
    question: |
      A health indicator bean is named `paymentServiceHealthIndicator`. Under which key does it appear
      in the `/actuator/health` components?
    options:
      - "paymentServiceHealthIndicator"
      - "paymentService"
      - "HealthIndicator"
      - "health.paymentService"
    answer: 1
    explanation: |
      Actuator strips the `HealthIndicator` suffix from the bean name, so the component key becomes
      `paymentService`.
    ref: "concepts.md#custom-health-indicators"

  - id: actuator-observability-026
    difficulty: intermediate
    tags: [health-indicator, reactive]
    question: |
      In a reactive (WebFlux) application, which interface should a non-blocking custom health check
      implement?
    options:
      - "HealthIndicator returning Health"
      - "CompletableHealthIndicator returning Future<Health>"
      - "ReactiveHealthIndicator returning Mono<Health>"
      - "AsyncHealthContributor returning Flux<Health>"
    answer: 2
    explanation: |
      `ReactiveHealthIndicator` returns `Mono<Health>` so the check does not block event-loop threads
      on the reactive stack.
    ref: "concepts.md#custom-health-indicators"

  - id: actuator-observability-027
    difficulty: intermediate
    tags: [micrometer, tags, cardinality]
    question: |
      Why should you avoid tagging a Micrometer metric with a value like a raw user ID or a URL
      containing path variables?
    options:
      - "Because Micrometer tag values must always be numeric, and a user ID or raw URL is a string."
      - "Because Micrometer forbids attaching more than one tag key to any single registered metric."
      - "Because tag values are silently stripped out when metrics are scraped over the HTTP endpoint."
      - "Because it causes unbounded tag cardinality, exploding time-series in the backend."
    answer: 3
    explanation: |
      Each distinct tag-value combination is a separate time series. Unbounded values (user IDs, raw
      URLs) explode cardinality and can overwhelm the metrics backend. Keep tag values bounded.
    ref: "concepts.md#micrometer-as-the-metrics-facade"

  - id: actuator-observability-028
    difficulty: intermediate
    tags: [micrometer, gauge, counter]
    question: |
      You need to track the current number of items in an in-memory queue, which rises and falls over
      time. Which meter fits best?
    options:
      - "Counter"
      - "Timer"
      - "Gauge"
      - "LongTaskTimer"
    answer: 2
    explanation: |
      A Gauge samples an instantaneous value that can go up or down, ideal for a queue size or cache
      entry count. A Counter can only increase.
    ref: "concepts.md#micrometer-as-the-metrics-facade"

  - id: actuator-observability-029
    difficulty: intermediate
    tags: [micrometer, registry]
    question: |
      What is the primary role of a Micrometer `MeterRegistry`?
    options:
      - "It is the central component that creates and holds meters and hands them to exporters."
      - "It is the registry that stores and resolves every Spring bean definition in the context."
      - "It parses application.yml and binds the resulting properties into configuration beans."
      - "It is the HTTP controller that renders the JSON body served by the /actuator/health endpoint."
    answer: 0
    explanation: |
      `MeterRegistry` is the central Micrometer interface for creating/registering meters. Backends
      provide implementations (e.g. `PrometheusMeterRegistry`); `SimpleMeterRegistry` is in-memory.
    ref: "concepts.md#micrometer-as-the-metrics-facade"

  - id: actuator-observability-030
    difficulty: intermediate
    tags: [prometheus, metrics]
    question: |
      To let Prometheus scrape your Spring Boot app, you add `micrometer-registry-prometheus` and
      expose which endpoint?
    options:
      - "/actuator/metrics"
      - "/actuator/prometheus"
      - "/actuator/scrape"
      - "/prometheus/metrics"
    answer: 1
    explanation: |
      The Prometheus registry adds a `prometheus` endpoint; once exposed, Prometheus scrapes
      `GET /actuator/prometheus` in its text exposition format.
    ref: "concepts.md#micrometer-as-the-metrics-facade"

  - id: actuator-observability-031
    difficulty: intermediate
    tags: [liveness, anti-pattern]
    question: |
      Why is it an anti-pattern to include an external database check in the LIVENESS probe?
    options:
      - "Liveness probes are sandboxed by the kubelet and cannot open any outbound network connection."
      - "A transient DB outage would make the probe fail and cause repeated container restarts, worsening the outage."
      - "Database connectivity checks are only permitted inside the info endpoint, never in a health group."
      - "Liveness probes are evaluated only once during container startup, so an added check would never run again."
    answer: 1
    explanation: |
      Liveness failure triggers a restart. Coupling it to an external dependency means a DB blip
      restarts pods in a loop. External-dependency checks belong in readiness, not liveness.
    ref: "concepts.md#liveness-and-readiness-probes"

  - id: actuator-observability-032
    difficulty: intermediate
    tags: [liveness, readiness, health-groups]
    question: |
      When liveness/readiness probes are enabled, at which paths are they exposed?
    options:
      - "/actuator/liveness and /actuator/readiness"
      - "/actuator/health/liveness and /actuator/health/readiness"
      - "/actuator/probes/live and /actuator/probes/ready"
      - "/health/live and /health/ready"
    answer: 1
    explanation: |
      They are pre-defined health groups served at `/actuator/health/liveness` and
      `/actuator/health/readiness`.
    ref: "concepts.md#liveness-and-readiness-probes"

  - id: actuator-observability-033
    difficulty: intermediate
    tags: [graceful-shutdown, readiness]
    question: |
      What does enabling graceful shutdown (`server.shutdown=graceful`) do with respect to readiness?
    options:
      - "It immediately terminates every in-flight request and closes their connections without draining."
      - "It flips readiness to REFUSING_TRAFFIC first so in-flight requests can drain before the server stops."
      - "It disables the readiness probe entirely and lets the balancer keep routing new traffic in."
      - "It schedules a full container restart after a fixed grace-period delay measured in seconds."
    answer: 1
    explanation: |
      Graceful shutdown switches readiness to REFUSING_TRAFFIC, stops accepting new requests, and lets
      active requests finish before the server closes.
    ref: "concepts.md#liveness-and-readiness-probes"

  - id: actuator-observability-034
    difficulty: intermediate
    tags: [tracing, sleuth]
    question: |
      Which library is the modern successor to Spring Cloud Sleuth for distributed tracing?
    options:
      - "Micrometer Tracing (with OpenTelemetry or Brave bridges)"
      - "Logback Classic (the default SLF4J logging backend in Boot)"
      - "Spring Retry (declarative method-level retry support)"
      - "Resilience4j (circuit breakers and rate limiters)"
    answer: 0
    explanation: |
      Micrometer Tracing replaced Spring Cloud Sleuth; it generates/propagates trace and span IDs and
      bridges to OpenTelemetry or Brave/Zipkin.
    ref: "concepts.md#logging-and-observability-basics"

  - id: actuator-observability-035
    difficulty: intermediate
    tags: [observation-api, spring-framework-6]
    question: |
      What is the main advantage of Micrometer's Observation API introduced with Spring Framework 6?
    options:
      - "It replaces Spring Security as the framework's authentication and authorization layer."
      - "It compresses and rotates application log files on disk automatically at runtime."
      - "It removes the need for a MeterRegistry by exporting metrics straight to the backend."
      - "A single instrumentation point produces both metrics and traces (and can drive logs)."
    answer: 3
    explanation: |
      The Observation API lets you instrument once and derive both timers (metrics) and spans
      (traces), avoiding duplicate instrumentation. It lives at the framework/Micrometer layer.
    ref: "concepts.md#logging-and-observability-basics"

  - id: actuator-observability-036
    difficulty: intermediate
    tags: [observation-api, cardinality]
    question: |
      In the Observation API, what is the difference between low-cardinality and high-cardinality key
      values?
    options:
      - "Low-cardinality keys become metric tags; high-cardinality keys are attached only to traces/spans."
      - "Low-cardinality keys are ignored; only high-cardinality keys are recorded."
      - "High-cardinality keys become metric tags; low-cardinality keys go to logs only."
      - "There is no difference between them; both kinds of keys always become metric tags on the meter."
    answer: 0
    explanation: |
      Low-cardinality (bounded) keys are safe as metric tags; high-cardinality keys (e.g. an order id)
      are added only to spans so they never blow up metric cardinality.
    ref: "concepts.md#logging-and-observability-basics"

  - id: actuator-observability-037
    difficulty: intermediate
    tags: [loggers, http]
    question: |
      Which HTTP request changes the level of logger `com.example.app` to DEBUG at runtime?
    options:
      - "GET /actuator/loggers/com.example.app?level=DEBUG"
      - "POST /actuator/loggers/com.example.app with body {\"configuredLevel\":\"DEBUG\"}"
      - "PUT /actuator/loggers with body {\"level\":\"DEBUG\"}"
      - "DELETE /actuator/loggers/com.example.app"
    answer: 1
    explanation: |
      You POST to `/actuator/loggers/<name>` with `{"configuredLevel":"DEBUG"}`. Posting a null
      configuredLevel resets to the inherited level.
    ref: "concepts.md#key-endpoints-health-info-metrics-env-beans-loggers"

  - id: actuator-observability-038
    difficulty: intermediate
    tags: [env, security]
    question: |
      Why are `/actuator/env`, `/actuator/configprops`, and `/actuator/heapdump` considered sensitive?
    options:
      - "They perform expensive full-heap scans on every call and often crash the app under load."
      - "They can leak configuration, secrets, or memory contents, so they should require authentication."
      - "They were deprecated in Boot 3.0 and now return an empty 410 Gone response."
      - "They function only on the reactive WebFlux stack and vanish on the servlet stack."
    answer: 1
    explanation: |
      These endpoints expose configuration values, bound properties, and memory contents, which can
      reveal secrets or internals. They should be authenticated and not exposed publicly.
    ref: "concepts.md#exposing-and-securing-endpoints"

  - id: actuator-observability-039
    difficulty: intermediate
    tags: [health, custom-status]
    question: |
      You define a custom health Status and want it to return a specific HTTP status code. Where do
      you configure that mapping?
    options:
      - "management.endpoint.health.status.http-mapping"
      - "server.error.status-codes"
      - "management.endpoints.web.exposure.include"
      - "It cannot be customized; custom statuses always return 200."
    answer: 0
    explanation: |
      `management.endpoint.health.status.http-mapping.*` maps status values to HTTP codes, and
      `...status.order` sets aggregation ordering for custom statuses.
    ref: "concepts.md#custom-health-indicators"

  - id: actuator-observability-040
    difficulty: intermediate
    tags: [micrometer, meter-binder]
    question: |
      What is the purpose of a Micrometer `MeterBinder`?
    options:
      - "To bind incoming HTTP request paths to their matching @RestController handler methods."
      - "To bind properties from application.yml into strongly-typed @ConfigurationProperties beans."
      - "To secure the /actuator/metrics endpoint by wiring it into the Spring Security filter chain."
      - "To contribute a pre-built set of metrics (e.g. JVM memory, GC, threads, connection pools) to a registry."
    answer: 3
    explanation: |
      A `MeterBinder` registers a bundle of related meters (JVM, system, Logback, Tomcat, HikariCP,
      etc.). Spring Boot auto-registers many of these out of the box.
    ref: "concepts.md#micrometer-as-the-metrics-facade"

  - id: actuator-observability-041
    difficulty: beginner
    tags: [availability, states]
    question: |
      Which pair of values represents the possible ReadinessState in Spring Boot's availability model?
    options:
      - "CORRECT and BROKEN"
      - "UP and DOWN"
      - "ACCEPTING_TRAFFIC and REFUSING_TRAFFIC"
      - "STARTED and STOPPED"
    answer: 2
    explanation: |
      `ReadinessState` is `ACCEPTING_TRAFFIC` / `REFUSING_TRAFFIC`. `LivenessState` (`CORRECT`/`BROKEN`)
      is the liveness equivalent.
    ref: "concepts.md#liveness-and-readiness-probes"

  - id: actuator-observability-042
    difficulty: beginner
    tags: [micrometer, framework-vs-boot]
    question: |
      Which statement about Micrometer and Spring is correct?
    options:
      - "Micrometer only works inside a Spring Boot application and fails to start in a plain Java program."
      - "Micrometer ships as a core part of the spring-context module and cannot be pulled in as a separate dependency."
      - "Micrometer is an independent library; Spring Boot's contribution is auto-configuring the registry, common tags, and meter binders."
      - "Micrometer requires Spring Security on the classpath before it will record any metric at all."
    answer: 2
    explanation: |
      Micrometer is a standalone library usable without Spring. Boot adds auto-configuration: the
      registry, common tags, MeterBinders, and wiring of `/actuator/metrics`.
    ref: "concepts.md#micrometer-as-the-metrics-facade"

  - id: actuator-observability-043
    difficulty: advanced
    tags: [custom-endpoint, operations, http]
    question: |
      You define `@Endpoint(id="features")` with a `@ReadOperation public Boolean one(@Selector String name)`
      that returns `toggles.get(name)`. A client calls `GET /actuator/features/unknownFlag` for a name
      that is not present in the map. What HTTP status does Actuator return?
    options:
      - "404 Not Found, because a @ReadOperation that returns null is mapped to a 404 response."
      - "200 OK with a JSON body of `null`, because the method completed without throwing."
      - "204 No Content, because there is no body to send back."
      - "400 Bad Request, because the @Selector value did not match any known resource."
    answer: 0
    explanation: |
      For Actuator's operation model, a `@ReadOperation` returning `null` maps to **404 Not Found**
      (a value maps to 200). By contrast a `@WriteOperation`/`@DeleteOperation` returning null maps to
      204, and a missing *required* parameter maps to 400. The method did not throw, so it is the
      null-return-to-404 rule that applies.
    ref: "concepts.md#writing-custom-endpoints"

  - id: actuator-observability-044
    difficulty: advanced
    tags: [custom-endpoint, parameters, binding]
    question: |
      A custom `@WriteOperation` is written as `public void update(CustomData data)` where `CustomData`
      is your own class with two fields. The endpoint is exposed over HTTP and you POST a matching JSON
      body. What happens?
    options:
      - "It works: Actuator deserializes the JSON body into the CustomData parameter using Jackson."
      - "It fails to bind because Actuator operations only accept simple-typed parameters; each root JSON property must map to its own simple parameter."
      - "It works only if CustomData is annotated with @ConfigurationProperties so its fields become relaxed-bound."
      - "It works over JMX by mapping the object to an MBean attribute but silently ignores the body over HTTP."
    answer: 1
    explanation: |
      Actuator's endpoint operation model binds each **root JSON property to a separate simple-typed
      parameter** (via `ApplicationConversionService`). You cannot bind a whole custom object as one
      parameter. You would write `update(String name, int counter)` instead. This is a deliberate
      limitation of the technology-agnostic operation model, not a Jackson issue.
    ref: "concepts.md#writing-custom-endpoints"

  - id: actuator-observability-045
    difficulty: advanced
    tags: [custom-endpoint, caching]
    question: |
      Two of your custom read operations exist on the same endpoint: `all()` with no parameters, and
      `one(@Selector String name)`. `management.endpoint.features.cache.time-to-live=30s` is set. A
      client hits each operation twice in quick succession. Which responses can be served from the
      Actuator response cache?
    options:
      - "Both operations are cached, because caching is configured per-endpoint and applies to every operation."
      - "Neither is cached, because Actuator only caches the built-in health and info endpoints."
      - "Only `all()` can be cached; `one(...)` takes a @Selector parameter and is therefore never cached."
      - "Only `one(...)` is cached, because parameterized operations are the ones worth caching."
    answer: 2
    explanation: |
      Actuator only auto-caches **read operations that take no parameters**. `all()` qualifies and is
      cached for the TTL; `one(@Selector ...)` is parameterized (a selector, query param, Principal, or
      SecurityContext all count) and is never cached. This is also why rapid `/health` calls can return
      an identical body within the TTL window.
    ref: "concepts.md#writing-custom-endpoints"

  - id: actuator-observability-046
    difficulty: expert
    tags: [custom-endpoint, parameters, compilation]
    question: |
      A colleague's custom `@WriteOperation public void set(String name, boolean enabled)` works
      perfectly on their machine but, once deployed through a hand-rolled build, every POST returns
      400 Bad Request complaining about a missing `name`/`enabled` parameter even though the JSON body
      is correct. What is the most likely root cause?
    options:
      - "The endpoint was exposed over JMX only, so incoming HTTP POST requests are unable to carry a request body at all."
      - "The primitive boolean is not a supported operation parameter type and must be declared as the boxed Boolean wrapper."
      - "A @WriteOperation is required to declare a non-void return type; void operations reject every parameter passed in the body."
      - "The class was compiled without the `-parameters` flag, so Actuator cannot resolve the JSON body keys to the reflective parameter names."
    answer: 3
    explanation: |
      Actuator maps JSON body keys to operation parameters **by reflective parameter name**, which is
      only retained when compiling with `-parameters`. Spring Boot's Gradle/Maven tooling enables this
      automatically; a hand-rolled build that omits it leaves parameter names as `arg0`/`arg1`, so the
      real names cannot be matched and required parameters appear missing (400).
    ref: "concepts.md#writing-custom-endpoints"

  - id: actuator-observability-047
    difficulty: advanced
    tags: [custom-endpoint, extensions, web]
    question: |
      You want to keep a technology-neutral `@Endpoint` but add an HTTP-only operation (returning
      different HTTP status codes) that augments it — exactly how the health endpoint maps status to
      HTTP codes. Which construct is designed for this, and what is its key constraint?
    options:
      - "@EndpointWebExtension referencing the endpoint; an endpoint may have at most one web extension."
      - "A second @Endpoint bean declared with the same id string; Actuator merges duplicate ids into one endpoint automatically."
      - "@RestControllerEndpoint, which is the only way to control HTTP status and can be declared any number of times."
      - "A @ControllerAdvice bean that scans for the endpoint id and rewrites its response status via an exception handler."
    answer: 0
    explanation: |
      `@EndpointWebExtension` (and `@EndpointJmxExtension`) augment an existing endpoint with
      technology-specific operations; an endpoint may have **at most one extension of each type**. This
      is precisely how Actuator's health web extension maps `Status` to HTTP codes without polluting
      the technology-neutral `@Endpoint`.
    ref: "concepts.md#writing-custom-endpoints"

  - id: actuator-observability-048
    difficulty: advanced
    tags: [enablement, exposure, security]
    question: |
      Your `SecurityFilterChain` uses `EndpointRequest.to("shutdown")` to require an admin role for the
      shutdown endpoint, but you left `management.endpoint.shutdown.enabled` at its default. A test that
      expects that matcher to protect a request finds the matcher never matches anything. Why?
    options:
      - "EndpointRequest.to(...) only matches endpoints exposed over JMX, so it never produces a matcher for the HTTP filter chain."
      - "shutdown is disabled by default, so no endpoint bean exists and there is nothing for the matcher to resolve to."
      - "EndpointRequest matchers require the target endpoint to first be listed in management.endpoints.web.exposure.exclude."
      - "The matcher matches, but Spring Security evaluates it after the controller, so it appears inert."
    answer: 1
    explanation: |
      A disabled endpoint has **no bean at all** — it cannot be discovered, secured, cached, or
      extended. `EndpointRequest.to("shutdown")` resolves against the registered endpoints and, finding
      none, matches nothing. You must enable (and expose) the endpoint for the matcher to have a target.
    ref: "concepts.md#exposing-and-securing-endpoints"

  - id: actuator-observability-049
    difficulty: expert
    tags: [exposure, discovery, jmx]
    question: |
      A `@WebEndpoint`-annotated custom endpoint is present and enabled, and you have configured
      `management.endpoints.jmx.exposure.include=*`. The endpoint does not appear as a JMX MBean. Which
      explanation is correct?
    options:
      - "The JMX exposure include=* wildcard applies only to Boot's built-in endpoints and silently skips any custom ones."
      - "The endpoint must also be added to management.endpoints.web.exposure.exclude before the JMX supplier will register it."
      - "@WebEndpoint restricts the endpoint to the web technology; it is absent from the JmxEndpointsSupplier regardless of JMX exposure settings."
      - "JMX endpoints require the endpoint class to implement a separate MBean interface named after the endpoint id."
    answer: 2
    explanation: |
      Actuator builds a separate supplier per technology (`WebEndpointsSupplier`,
      `JmxEndpointsSupplier`, ...). `@WebEndpoint` marks the endpoint as web-only, so it is never
      collected by the JMX supplier — no amount of JMX exposure configuration will surface it. Use a
      plain `@Endpoint` if you want both technologies.
    ref: "concepts.md#writing-custom-endpoints"

  - id: actuator-observability-050
    difficulty: advanced
    tags: [sanitization, env, configprops]
    question: |
      In Spring Boot 3.x, with default settings, a caller hits `/actuator/env` (exposed) and sees every
      property value rendered as `******`, including plainly non-secret values like `server.port`. A
      teammate insists old Boot showed these values. What changed and how do you show them again?
    options:
      - "Nothing changed between versions; you must be misreading the response, because env values are always rendered in full by default."
      - "The env endpoint was removed entirely in Boot 3 and what you see is a static deprecation placeholder page."
      - "Values only appear once management.endpoints.web.exposure.include lists env explicitly with a trailing `.*` wildcard suffix."
      - "Boot 3 sanitizes ALL values by default; set management.endpoint.env.show-values to always or when-authorized (and it applies unless a SanitizingFunction masks a value)."
    answer: 3
    explanation: |
      Boot 3 changed the default so `/env`, `/configprops`, and `/quartz` **fully sanitize all values**
      (`******`). A value shows only when `show-values` is `always` or `when-authorized` AND no
      `SanitizingFunction` masks it. Older Boot relied on key-name heuristics (`password`, `secret`,
      ...) and otherwise showed values, so `server.port` used to be visible.
    ref: "concepts.md#key-endpoints-health-info-metrics-env-beans-loggers"

  - id: actuator-observability-051
    difficulty: expert
    tags: [sanitization, security, roles]
    question: |
      You set `management.endpoint.env.show-values=when-authorized` and
      `management.endpoint.env.roles=admin`. Which statement precisely describes when an env property
      value is rendered unsanitized?
    options:
      - "Only for a caller who is authenticated AND holds the `admin` role, AND provided no applicable SanitizingFunction still masks that value."
      - "For any caller whatsoever, because the when-authorized mode unconditionally reveals values once it has been configured."
      - "Only for callers coming in through the JMX connector; HTTP callers always receive fully masked ****** values regardless of role."
      - "For any authenticated caller regardless of role, because the roles setting only ever affects the separate beans endpoint."
    answer: 0
    explanation: |
      `when-authorized` reveals values only to an authenticated caller holding the endpoint's `roles`
      (here `admin`). Even then, a matching `SanitizingFunction` bean can still mask specific values —
      show-values and sanitizing functions are ANDed. (Over JMX all users are treated as authorized,
      the opposite of the distractor.)
    ref: "concepts.md#key-endpoints-health-info-metrics-env-beans-loggers"

  - id: actuator-observability-052
    difficulty: advanced
    tags: [health, caching, staleness]
    question: |
      An on-call engineer scripts a loop that polls `/actuator/health` every 200 ms during an incident
      and notices the JSON is byte-for-byte identical for stretches even though a downstream indicator
      is flapping. Assuming default configuration plus a non-zero
      `management.endpoint.health.cache.time-to-live`, what is happening?
    options:
      - "The health indicators are evaluated exactly once during context refresh at startup and their result is then cached permanently for the process lifetime."
      - "Actuator caches the parameterless read response for the TTL, so within each window the indicators are not re-invoked and the body is reused."
      - "The load balancer sitting in front is caching the response body for you; Actuator itself never performs any caching of health results."
      - "Byte-identical responses prove the downstream dependency is genuinely stable, and the apparent flapping is merely a metrics-collection artifact."
    answer: 1
    explanation: |
      Health is a parameterless read operation, so Actuator's endpoint cache reuses the computed
      response for the configured TTL. Within a TTL window the indicators are not re-run, so rapid
      polls return an identical body even while the real state changes. Lower the TTL (or set it to 0)
      if you need fresher reads.
    ref: "concepts.md#key-endpoints-health-info-metrics-env-beans-loggers"

  - id: actuator-observability-053
    difficulty: expert
    tags: [health-indicator, timeout, threads]
    question: |
      A blocking `HealthIndicator` calls `downstream.ping()` on an HTTP client configured with no read
      timeout. During a downstream stall, `/actuator/health` requests start piling up and Tomcat worker
      threads become exhausted. What is the accurate diagnosis and fix?
    options:
      - "HealthIndicator.health() runs asynchronously on a dedicated scheduler, so it can never exhaust request threads; the real culprit here is long garbage-collection pauses."
      - "Actuator automatically aborts any indicator after a built-in 1-second timeout, so the stall you see must actually originate inside the Spring Security filter chain."
      - "health() runs synchronously on the request thread with no built-in per-indicator timeout, so a hanging call pins threads; give the client a hard read/connect timeout (or run the check reactively with .timeout())."
      - "Setting management.endpoint.health.show-details=never disables execution of the indicators entirely and therefore resolves the hang."
    answer: 2
    explanation: |
      Indicators execute **synchronously on the request thread** and there is **no built-in
      per-indicator timeout**. A hanging downstream call blocks that thread, and repeated probes exhaust
      the pool — a classic self-inflicted outage. The fix is a hard client timeout, a reactive check
      with `.timeout(...)`, or caching the result; not any Actuator-level toggle.
    ref: "concepts.md#custom-health-indicators"

  - id: actuator-observability-054
    difficulty: advanced
    tags: [health, contributor, hierarchy]
    question: |
      You need a single `/actuator/health` component `db` that itself nests the results of three
      separate datasource checks. Which abstraction models this "named tree of child checks"?
    options:
      - "A single HealthIndicator that concatenates the three statuses into one string detail."
      - "Three separate @Endpoint beans sharing the id `db`."
      - "A StatusAggregator, which is the only way to nest components."
      - "A CompositeHealthContributor whose children are the individual indicators."
    answer: 3
    explanation: |
      The health type hierarchy has `HealthContributor` as the root marker, with `HealthIndicator` as
      the leaf and `CompositeHealthContributor` as a **named tree of children**. A composite lets one
      `db` component nest multiple datasource checks, each appearing as a nested component in the JSON.
    ref: "concepts.md#custom-health-indicators"

  - id: actuator-observability-055
    difficulty: expert
    tags: [health, reactive, bridging]
    question: |
      A Servlet (Spring MVC) application registers a bean implementing `ReactiveHealthIndicator`
      returning `Mono<Health>`. When `/actuator/health` is queried, what does Actuator do?
    options:
      - "It bridges the worlds by subscribing to and blocking on the Mono to obtain the Health for the Servlet endpoint."
      - "It ignores the bean, because ReactiveHealthIndicator is only recognized on the WebFlux stack."
      - "It throws at startup, because a reactive indicator cannot be registered in a Servlet context."
      - "It returns UNKNOWN for that component, because the Servlet endpoint cannot subscribe to a Mono."
    answer: 0
    explanation: |
      Actuator bridges the reactive and blocking worlds: a `ReactiveHealthIndicator` queried from the
      Servlet endpoint is `.block()`-ed to obtain the `Health`, and conversely a blocking
      `HealthIndicator` queried from the reactive endpoint is adapted to run on a bounded-elastic
      scheduler. The reactive indicator is honored, not ignored.
    ref: "concepts.md#custom-health-indicators"

  - id: actuator-observability-056
    difficulty: advanced
    tags: [health, groups, additional-path]
    question: |
      Your load balancer can only reach the main server port, but you run Actuator on a separate
      management port (`management.server.port`). You still want a readiness signal on the main port.
      Which mechanism achieves this?
    options:
      - "Set management.server.port back to the main port, since Actuator can only publish a readiness signal on the port that serves application traffic."
      - "Use a health group with an additional-path bound to the server, e.g. management.endpoint.health.group.readiness.additional-path=server:/readyz."
      - "Expose the whole /actuator base path on both connectors by adding a second base-path entry to management.endpoints.web.exposure.include."
      - "Readiness is only ever available at /actuator/health/readiness on the management port; there is no alternative."
    answer: 1
    explanation: |
      Health groups support an `additional-path` that can map a group onto the **main server port**
      (`server:/readyz`) while the rest of Actuator stays on the management port. This is the standard
      way to give an LB a readiness endpoint it can actually reach.
    ref: "concepts.md#custom-health-indicators"

  - id: actuator-observability-057
    difficulty: expert
    tags: [micrometer, meter-identity, registration]
    question: |
      Somewhere in the codebase, one path registers `registry.counter("api.calls", "region", "us")`
      and another later does `registry.timer("api.calls")` (same name, different meter type). With a
      Prometheus registry, what is the expected outcome?
    options:
      - "Both coexist happily; Micrometer namespaces meters by type internally."
      - "The timer overwrites the counter and previously recorded counts are migrated."
      - "It is a conflicting registration: a name cannot back two different meter types (or inconsistent tag key sets), so registration fails/throws rather than silently merging."
      - "Prometheus automatically renames the second registration to api.calls_2 and keeps both series side by side."
    answer: 2
    explanation: |
      A meter's identity is name + tags, and a given name must map to a single meter type with a
      consistent tag-key set — Prometheus/most backends cannot represent otherwise. Registering the same
      name as both a counter and a timer (or with inconsistent tag keys) is a conflicting registration
      and fails; it does not silently coexist or auto-rename.
    ref: "concepts.md#micrometer-as-the-metrics-facade"

  - id: actuator-observability-058
    difficulty: expert
    tags: [micrometer, gauge, garbage-collection]
    question: |
      You write `Gauge.builder("cache.entries", buildLocalCache(), Cache::size).register(registry);`
      passing a freshly built cache directly to the builder and keeping no other reference to it. After
      a GC cycle the metric reports `NaN` or vanishes. Why?
    options:
      - "Micrometer gauges are reset to NaN at the end of every scrape interval, so you must re-register the meter after each collection to keep a live value."
      - "Cache::size returns an int rather than a double, so it is not a valid ToDoubleFunction and Micrometer silently discards the gauge during registration."
      - "Prometheus renders any gauge whose sampled value exceeds Integer.MAX_VALUE as NaN, because its text exposition format cannot encode integers beyond 32 bits."
      - "A Micrometer gauge holds only a weak reference to the observed object; with no strong reference the cache is collected and the gauge can no longer sample it."
    answer: 3
    explanation: |
      Micrometer gauges reference the measured object **weakly** to avoid memory leaks. If nothing else
      keeps it strongly reachable, it is garbage-collected and the gauge reports `NaN`/disappears.
      Always retain a strong reference to the object a gauge observes (store the cache in a field).
    ref: "concepts.md#micrometer-as-the-metrics-facade"

  - id: actuator-observability-059
    difficulty: advanced
    tags: [micrometer, meter-filter, ordering]
    question: |
      A `MeterFilter` that adds a common tag `region=eu` is registered, but a specific counter created
      earlier during context refresh lacks the tag. All later meters have it. What explains the
      inconsistency?
    options:
      - "MeterFilters run at meter registration time; a meter created before the filter was added is not retroactively modified."
      - "MeterFilters are only invoked for Timer and DistributionSummary meters, and Counters are exempt from common-tag filtering by design."
      - "Common tags are applied lazily at scrape time, so the discrepancy is a display bug that self-corrects."
      - "The counter was created on a different thread from the filter registration, and MeterFilters are stored in a thread-local so they never apply across threads."
    answer: 0
    explanation: |
      `MeterFilter`s are applied **when a meter is registered**, in the order filters were added. A
      meter that was already created before the filter existed is not retouched — so ordering and
      timing both matter. Ensure common-tag filters are registered before any meter is created (Boot
      does this early via `MeterRegistryCustomizer`).
    ref: "concepts.md#micrometer-as-the-metrics-facade"

  - id: actuator-observability-060
    difficulty: expert
    tags: [micrometer, timer, percentiles, histogram]
    question: |
      Two instances of a service both configure their request `Timer` with
      `publishPercentiles(0.99)`. Your dashboard averages the two exported p99 values to get a "fleet
      p99." A staff engineer says this number is meaningless. Why, and what should you have done?
    options:
      - "Nothing is wrong; averaging per-instance p99s is the standard way to compute a fleet p99."
      - "Client-side publishPercentiles are computed in-process and are not aggregatable across instances; publish a percentile histogram (bucket counts) and let the backend compute the quantile (e.g. histogram_quantile)."
      - "The p99 is meaningless only because the two instances have different sampling rates; align management.tracing.sampling.probability."
      - "publishPercentiles was deprecated in Micrometer 1.9; for request latency you must switch to a LongTaskTimer, whose p99 values are safely averageable across instances."
    answer: 1
    explanation: |
      `publishPercentiles(...)` computes percentiles **in-process** per instance; you cannot average
      p99s across hosts to get a real fleet p99. To aggregate correctly, emit a **percentile histogram**
      (`publishPercentileHistogram()`) so the backend receives bucket counts and computes the quantile
      over the merged distribution (e.g. Prometheus `histogram_quantile`).
    ref: "concepts.md#micrometer-as-the-metrics-facade"

  - id: actuator-observability-061
    difficulty: advanced
    tags: [micrometer, gauge, api]
    question: |
      What does `registry.gauge("queue.size", myQueue, q -> q.size())` return, and why does that
      surprise developers who assign it to a variable expecting to call `.increment()` later?
    options:
      - "It returns the Gauge meter; the surprise is that Gauge has no increment() method."
      - "It returns void, so assigning the call to a variable is a compile error and the queue can only be observed through the builder API instead."
      - "It returns the object you passed in (myQueue), not a meter handle; developers expect a Meter but get their own object back."
      - "It returns a Counter, because Micrometer converts gauges to counters when a lambda is supplied."
    answer: 2
    explanation: |
      The convenience overload `MeterRegistry.gauge(name, stateObject, valueFunction)` returns the
      **state object you passed in** (`myQueue`), not the `Gauge` meter — a deliberate API choice so you
      can register in one line. To get the meter handle, use `Gauge.builder(...).register(registry)`.
      Gauges have no increment(); their value is sampled via the function.
    ref: "concepts.md#micrometer-as-the-metrics-facade"

  - id: actuator-observability-062
    difficulty: expert
    tags: [observation-api, handlers, wiring]
    question: |
      You instrument code with `Observation.createNotStarted("checkout", registry).observe(() -> run())`.
      In a plain Spring app you have an `ObservationRegistry` but registered **no** `ObservationHandler`.
      What is recorded, and what does `run()` do?
    options:
      - "run() is skipped entirely, because the ObservationRegistry dispatches your lambda through a handler and with none registered there is nothing to execute it."
      - "A timer is recorded automatically from the observation name, and ObservationHandlers are only ever needed to add the tracing spans on top."
      - "The call throws IllegalStateException at start(), because an ObservationRegistry validates that at least one handler is present before it will begin an observation."
      - "run() executes normally, but nothing is recorded (no timer, no span) because there are no handlers to react to the lifecycle."
    answer: 3
    explanation: |
      `.observe(...)` always runs your code, but an `ObservationRegistry` with **zero handlers records
      nothing** — no timer, no span. Metrics appear only when a meter observation handler is registered;
      spans only when a tracing handler is registered. Adding Micrometer Tracing to the classpath is
      what makes Boot register the tracing handler, turning existing observations into spans.
    ref: "concepts.md#logging-and-observability-basics"

  - id: actuator-observability-063
    difficulty: expert
    tags: [observation-api, scope, mdc, tracing]
    question: |
      A developer hand-codes `Observation obs = Observation.start("job", registry); doWork(); obs.stop();`
      (no scope opened, no try/finally scope). A span is exported for the job, but log lines emitted
      inside `doWork()` carry no traceId/spanId, and a nested observation is not parented to it. What is
      the precise cause?
    options:
      - "Without opening a scope, the observation never becomes 'current' on the thread, so trace context/MDC is not populated and nested code is not correlated to it."
      - "stop() was invoked on a different thread than start(), which corrupts the span's parent linkage and strips the trace context out of the MDC."
      - "Micrometer Tracing populates the MDC only through the Brave bridge; the OpenTelemetry bridge exports spans but never writes traceId/spanId into the logging context."
      - "Log correlation only works when management.tracing.sampling.probability is set to 1.0, so unsampled requests like this one omit the traceId/spanId from their log lines."
    answer: 0
    explanation: |
      The span exists (start/stop ran the handlers) but **opening a scope** is what makes the
      observation current on the thread and populates trace context / MDC for correlation and parenting.
      Using `.observe(...)` (or an explicit `try (var scope = obs.openScope()) { ... }`) fixes it.
      Hand-rolling start/stop without a scope is the classic mistake.
    ref: "concepts.md#logging-and-observability-basics"

  - id: actuator-observability-064
    difficulty: advanced
    tags: [observation-api, predicate, filter]
    question: |
      You want to (a) completely stop recording observations for Actuator's own endpoint requests, and
      (b) add a `deployment.region` key to every remaining observation's context at stop time. Which
      two components are the idiomatic fit, respectively?
    options:
      - "An ObservationHandler for (a) (returning null from onStart discards the observation) and an ObservationConvention for (b) (which appends key-values at stop time)."
      - "An ObservationPredicate for (a) (produces a no-op when it returns false) and an ObservationFilter for (b) (mutates the context, running before onStop)."
      - "A MeterFilter.deny() for (a) (which suppresses the whole observation pipeline) and a SanitizingFunction for (b) (which injects the deployment.region key)."
      - "An ObservationConvention for (a) (whose empty name skips recording) and an ObservationPredicate for (b) (which rewrites the context to add the region key)."
    answer: 1
    explanation: |
      An `ObservationPredicate` decides whether a real observation vs a **no-op** is created — ideal for
      suppressing actuator noise. An `ObservationFilter` **mutates the context** (add/remove
      key-values) and runs at stop, before the handlers' `onStop`. Conventions are for default
      naming/key-values, not suppression, and MeterFilter/SanitizingFunction are unrelated layers.
    ref: "concepts.md#logging-and-observability-basics"

  - id: actuator-observability-065
    difficulty: expert
    tags: [observation-api, handler, supports-context]
    question: |
      In an app with both a metrics handler and a tracing handler registered, you create a custom
      `Observation.Context` subtype for a batch job and expect only your custom handler to react to it,
      while the built-in handlers still handle standard contexts. Which handler method makes this
      selective behavior possible?
    options:
      - "onStart(), by throwing an exception for unsupported context types so Micrometer skips that handler for the rest of the observation lifecycle."
      - "onScopeOpened(), which Micrometer invokes only for the specific context instances that this particular handler originally created."
      - "supportsContext(Context), which each handler uses to opt into only the context types it understands."
      - "getName(), whose returned string Micrometer matches against each observation's name to decide which handler should receive that context."
    answer: 2
    explanation: |
      `ObservationHandler.supportsContext(Context)` lets each handler declare which context types it
      applies to. The metrics/tracing handlers return true for standard contexts, and your custom
      handler can return true only for your batch context — so handlers cleanly ignore contexts they
      do not understand rather than all firing on everything.
    ref: "concepts.md#logging-and-observability-basics"

  - id: actuator-observability-066
    difficulty: advanced
    tags: [tracing, sampling, logs]
    question: |
      With `management.tracing.sampling.probability=0.1`, an engineer claims "90% of our requests have
      no trace id in the logs, which breaks correlation." Evaluate this claim.
    options:
      - "Correct: unsampled requests get no trace/span ids at all, so their logs cannot be correlated."
      - "Correct, but only on the OpenTelemetry bridge; the Brave bridge always writes trace and span ids into the MDC regardless of the configured sampling probability."
      - "Incorrect: the sampling probability only governs how many Micrometer metric samples are exported and has no bearing whatsoever on trace ids or log correlation."
      - "Incorrect: trace and span ids are always generated and placed in the MDC; sampling only controls whether the trace is recorded/exported, so logs still carry ids for unsampled requests."
    answer: 3
    explanation: |
      Sampling decides whether a trace is **recorded/exported**, not whether ids exist. Trace/span ids
      are always generated and placed in the MDC, so even unsampled requests log correlatable ids
      (you just will not find the corresponding spans in the tracing backend). The claim conflates
      "not exported" with "no id."
    ref: "concepts.md#logging-and-observability-basics"

  - id: actuator-observability-067
    difficulty: expert
    tags: [tracing, propagation, distributed]
    question: |
      Service A (Brave bridge, B3 propagation) calls Service B (OTel bridge, W3C traceparent). Each
      service produces valid traces in isolation, but in the backend every hop starts a brand-new trace
      instead of continuing the caller's trace. What is the root cause?
    options:
      - "A propagation-format mismatch: A sends B3 headers while B only reads W3C traceparent, so B cannot extract the upstream context and starts a fresh trace."
      - "The sampling probability differs between the two services, so B rejects A's incoming spans and opens a fresh trace whenever the upstream sampling decision disagrees with its own."
      - "The Brave and OpenTelemetry bridges cannot interoperate on the wire at all, so cross-service continuity requires both hops to run byte-identical tracing library versions."
      - "The wall-clock skew between the two hosts exceeds the trace's time-to-live window, so B discards A's context as expired and starts a brand-new trace per hop."
    answer: 0
    explanation: |
      Trace continuity depends on both services agreeing on the **propagation format** in the wire
      headers. A emits B3; B only parses W3C `traceparent`, so it cannot read A's context and begins a
      new trace per hop. Configure `management.tracing.propagation.type` consistently across the fleet
      (or enable multi-format reading).
    ref: "concepts.md#logging-and-observability-basics"

  - id: actuator-observability-068
    difficulty: advanced
    tags: [tracing, bridge, configuration]
    question: |
      A build includes BOTH `micrometer-tracing-bridge-otel` and `micrometer-tracing-bridge-brave`.
      What is the correct characterization?
    options:
      - "This is required: the OpenTelemetry bridge handles the metrics side while the Brave bridge handles the spans, so both must be present for full observability."
      - "It is a configuration error; Micrometer Tracing is a facade and you must add exactly one bridge implementation, not both."
      - "Both are fine to include; Micrometer benchmarks the two bridges at startup and picks whichever produces spans faster on a per-request basis."
      - "Both bridges are needed only when you use the Observation API to instrument code; if you create spans through the Tracer directly you pick just one."
    answer: 1
    explanation: |
      Micrometer Tracing is a **facade**; the actual tracer comes from exactly one bridge —
      `micrometer-tracing-bridge-otel` OR `micrometer-tracing-bridge-brave` — plus a reporter/exporter.
      Having both on the classpath is a misconfiguration that leads to ambiguous/duplicate wiring.
    ref: "concepts.md#logging-and-observability-basics"

  - id: actuator-observability-069
    difficulty: advanced
    tags: [health, status-aggregator, custom-status]
    question: |
      You introduce a custom status `FROZEN` and want it to be treated as worse than `OUT_OF_SERVICE`
      but better than `DOWN` in the aggregate, and to return HTTP 503. Which combination configures
      this correctly?
    options:
      - "Only management.endpoints.web.exposure.include=health; custom statuses inherit DOWN's behavior automatically."
      - "A @Bean StatusAggregator is the only option; the two status.* properties do not affect custom values."
      - "management.endpoint.health.status.order to place FROZEN in the severity list, and management.endpoint.health.status.http-mapping.FROZEN=503 for the HTTP code."
      - "server.error.status-codes.FROZEN=503 to map the HTTP code, plus a MeterFilter registered on the MeterRegistry to place FROZEN in the severity ordering."
    answer: 2
    explanation: |
      `management.endpoint.health.status.order` defines the severity ordering used by the default
      `StatusAggregator` (so you position FROZEN between OUT_OF_SERVICE and DOWN), and
      `management.endpoint.health.status.http-mapping.FROZEN=503` maps the aggregate status to an HTTP
      code. Both are needed; exposure alone does nothing for ordering/codes.
    ref: "concepts.md#custom-health-indicators"

  - id: actuator-observability-070
    difficulty: expert
    tags: [liveness, readiness, availability, events]
    question: |
      A warmup component publishes `AvailabilityChangeEvent.publish(publisher, this, ReadinessState.REFUSING_TRAFFIC)`
      while priming a cache, then ACCEPTING_TRAFFIC when done. During the refusing window, what is true
      about the liveness probe and pod lifecycle in Kubernetes?
    options:
      - "Liveness also flips to BROKEN whenever readiness is set to REFUSING_TRAFFIC, so Kubernetes restarts the pod repeatedly for the entire duration of the warmup window."
      - "Publishing an AvailabilityChangeEvent for readiness has no effect at all unless management.server.port is configured to serve the probe groups on a separate connector."
      - "Both liveness and readiness are recomputed from HealthIndicators, ignoring the published event."
      - "Only readiness is affected: the pod stays running and is temporarily removed from Service endpoints (no traffic), while liveness remains CORRECT so no restart occurs."
    answer: 3
    explanation: |
      Readiness and liveness are independent signals. Publishing `REFUSING_TRAFFIC` moves the readiness
      group to DOWN, so the pod is pulled from the Service's endpoints (no traffic) but **keeps
      running**; liveness stays `CORRECT`, so Kubernetes does not restart it. The state machine is
      driven by `AvailabilityChangeEvent`s on the `ApplicationEventPublisher`.
    ref: "concepts.md#liveness-and-readiness-probes"

  - id: actuator-observability-071
    difficulty: advanced
    tags: [liveness, readiness, availability, auto-config]
    question: |
      In a non-Kubernetes environment, `/actuator/health/liveness` and `/actuator/health/readiness`
      return 404, but they start working once you deploy to Kubernetes. What governs whether these two
      probe groups are auto-registered, and what backs each group's status when they are?
    options:
      - "The probe groups only exist when Spring Security is on the classpath; each group's status is derived from the http.server.requests metric."
      - "The probe groups are auto-registered when Boot detects a Kubernetes environment (or when management.endpoint.health.probes.enabled=true), and each is backed by the in-memory ApplicationAvailability state (LivenessState / ReadinessState), not by scanning all HealthIndicators."
      - "They are always registered on every stack; the 404 must be caused by a missing exposure.include entry for liveness and readiness."
      - "They are registered only when a DataSource bean exists, and both groups aggregate every HealthIndicator in the context."
    answer: 1
    explanation: |
      Boot auto-detects a Kubernetes environment (deployment platform) and registers the `liveness` and
      `readiness` health groups; you can also force them on any platform with
      `management.endpoint.health.probes.enabled=true`. Their status is driven by the framework-level
      `ApplicationAvailability` abstraction — the `livenessState` (`CORRECT`/`BROKEN`) and
      `readinessState` (`ACCEPTING_TRAFFIC`/`REFUSING_TRAFFIC`) contributors updated via
      `AvailabilityChangeEvent`s — rather than by aggregating arbitrary external HealthIndicators.
    ref: "concepts.md#liveness-and-readiness-probes"

  - id: actuator-observability-072
    difficulty: expert
    tags: [security, endpoint-request, exclusions]
    question: |
      Consider:
      `http.securityMatcher(EndpointRequest.toAnyEndpoint().excluding("health"))
           .authorizeHttpRequests(r -> r.anyRequest().hasRole("ADMIN"));`
      What is the effect on requests to `/actuator/health` versus `/actuator/metrics`?
    options:
      - "Both require ADMIN, because toAnyEndpoint() always takes precedence and silently re-includes any endpoint passed to excluding()."
      - "This filter chain does not match /actuator/health at all (it is excluded from the securityMatcher), so health falls through to other chains/defaults; /actuator/metrics is matched and requires ADMIN."
      - "/actuator/health is permitted and /actuator/metrics is denied to everyone, because excluding() means deny."
      - "Neither is matched, because calling excluding() on the request matcher voids the whole securityMatcher and leaves the chain applying to no requests at all."
    answer: 1
    explanation: |
      `excluding("health")` narrows the chain's **securityMatcher** so this chain does not apply to the
      health endpoint — health is left to be handled by another `SecurityFilterChain` or default rules
      (often permitAll). `/actuator/metrics` is still matched by this chain and requires ADMIN.
      `excluding` scopes the matcher; it does not itself mean "deny."
    ref: "concepts.md#exposing-and-securing-endpoints"

  - id: actuator-observability-073
    difficulty: advanced
    tags: [exposure, jmx, web, independence]
    question: |
      A team sets `management.endpoints.web.exposure.include=health,info` and never touches JMX
      settings. A tool connecting over JMX finds none of the custom `@Endpoint` beans exposed. Which
      statement is correct about default JMX exposure in modern Boot?
    options:
      - "Web and JMX exposure are backed by a single shared setting, so declaring web include=health,info automatically publishes those same endpoints as JMX MBeans through the one exposure supplier."
      - "JMX exposure defaults to a wildcard that publishes every enabled endpoint as an MBean, so the endpoints are already registered and the connecting tool is simply pointed at the wrong MBean domain."
      - "In modern Boot, JMX exposure defaults to exposing nothing; web and JMX exposure are configured independently, so the JMX tool sees nothing until management.endpoints.jmx.exposure.include is set."
      - "Custom @Endpoint beans are inherently web-only and are skipped by the JmxEndpointsSupplier entirely, so they can never be surfaced as MBeans no matter how JMX exposure is configured."
    answer: 2
    explanation: |
      Web and JMX exposure are **independent** properties. Modern Boot exposes nothing over JMX by
      default (older Boot 2.0 exposed all over JMX). Setting only web exposure does not surface anything
      over JMX; you would configure `management.endpoints.jmx.exposure.include` separately. (Plain
      `@Endpoint` beans are eligible for both technologies — only `@WebEndpoint` is web-only.)
    ref: "concepts.md#exposing-and-securing-endpoints"

  - id: actuator-observability-074
    difficulty: expert
    tags: [health, contributor-registry, runtime]
    question: |
      A plugin system loads modules after application startup and wants each module to contribute its
      own health check that appears in `/actuator/health` immediately, without a context restart. Which
      mechanism supports this?
    options:
      - "It is impossible; the set of health contributors is permanently frozen when the ApplicationContext finishes refreshing, so any module loaded afterward can never appear in the aggregated health report."
      - "Trigger a full re-scan by calling refresh() on the running ApplicationContext, which re-runs component scanning and picks up the new module's HealthIndicator bean without an actual process restart."
      - "Append the module's check to management.endpoint.health.group.* at runtime by POSTing the updated property through the /actuator/env endpoint, which rebinds the health groups on the fly."
      - "Register/unregister the contributor at runtime via the HealthContributorRegistry (ReactiveHealthContributorRegistry on the reactive stack)."
    answer: 3
    explanation: |
      All contributors are collected into a `HealthContributorRegistry` (reactive:
      `ReactiveHealthContributorRegistry`) that supports **dynamic register/unregister at runtime** —
      exactly the hook a plugin system needs to add checks after startup without a context restart.
    ref: "concepts.md#custom-health-indicators"

  - id: actuator-observability-075
    difficulty: advanced
    tags: [enablement, global-default, opt-in]
    question: |
      A security-conscious team wants every Actuator endpoint to be opt-in: no endpoint bean should
      exist unless explicitly turned on. Which single property flips the default, and what must they
      then do per endpoint?
    options:
      - "management.endpoints.enabled-by-default=false; then set management.endpoint.<id>.enabled=true for each endpoint they want."
      - "management.endpoints.web.exposure.include=none; then re-add each endpoint they want to that exposure list, since clearing exposure also destroys the endpoint bean itself."
      - "management.endpoint.all.enabled=false to disable the whole group at once; then flip the per-endpoint sensitive flag back to false for each endpoint they want to switch on."
      - "spring.actuator.default=disabled to turn every endpoint off globally; then annotate each endpoint bean they want active with the @Enabled marker so Boot re-creates it."
    answer: 0
    explanation: |
      `management.endpoints.enabled-by-default=false` makes every endpoint opt-in at the **bean**
      (enablement) level; each desired endpoint must then set `management.endpoint.<id>.enabled=true`.
      Exposure is a separate later gate. There is no `sensitive` flag or `@Enabled` annotation in modern
      Boot.
    ref: "concepts.md#exposing-and-securing-endpoints"

  - id: actuator-observability-076
    difficulty: expert
    tags: [micrometer, composite-registry, binders]
    question: |
      Actuator uses a `CompositeMeterRegistry` and you later add a second delegate registry (say a
      Datadog registry) at runtime. What happens to previously registered meters, common-tag
      MeterFilters, and MeterBinders with respect to the newly added delegate?
    options:
      - "Nothing propagates backward; the composite forwards only meters created after the delegate was added, so every counter, timer, and gauge registered earlier stays invisible to the Datadog backend until the code re-registers each one by hand."
      - "The composite propagates its meters and applies its filters to the newly added delegate as delegates are added, so existing meters appear in the new backend too."
      - "The delegate list is fixed at context refresh, so the application must be fully restarted before the new Datadog registry will receive any meters, filters, or binder output at all."
      - "Only gauges propagate to a late-added delegate, because they are re-sampled on every scrape; counters and timers hold accumulated state and therefore remain pinned to the original delegate."
    answer: 1
    explanation: |
      A `CompositeMeterRegistry` fans out to its delegates and, when a delegate is added, it registers
      the composite's existing meters into that delegate and applies the composite's filters — so a
      newly added backend receives the already-registered meters, not just future ones. Binders bind to
      the composite once and flow through.
    ref: "concepts.md#micrometer-as-the-metrics-facade"

  - id: actuator-observability-077
    difficulty: advanced
    tags: [observation-api, convention, precedence]
    question: |
      For an HTTP server observation you register a custom `ObservationConvention`, and there is also a
      matching `GlobalObservationConvention` plus the built-in default. Which naming/key-value
      convention wins, and in what order are they considered?
    options:
      - "The built-in default convention always wins to guarantee fleet-wide naming consistency, and both custom and global conventions are silently discarded during observation start."
      - "The GlobalObservationConvention always wins because it is registered directly on the ObservationRegistry, overriding any convention passed at the individual instrumentation point."
      - "An explicitly-supplied custom convention wins; otherwise a matching GlobalObservationConvention; otherwise the default convention."
      - "The three conventions are merged field-by-field, with the built-in default taking precedence on any conflicting name or key-value so it can never be fully overridden."
    answer: 2
    explanation: |
      Convention precedence is: an explicitly-passed **custom** convention > a matching
      **GlobalObservationConvention** > the **default** convention. This lets you override naming/tags
      at a single instrumentation point, or globally, while a sensible default remains as a fallback.
    ref: "concepts.md#logging-and-observability-basics"

  - id: actuator-observability-078
    difficulty: expert
    tags: [loggers, reset, semantics]
    question: |
      A logger `com.example.svc` has no explicitly configured level and inherits INFO from its parent.
      An operator POSTs `{"configuredLevel":"DEBUG"}` to raise it, then later POSTs
      `{"configuredLevel":null}`. What is the effect of the second POST?
    options:
      - "It sets the level to OFF, fully silencing the logger, because Actuator maps a null configuredLevel to the lowest-priority threshold that suppresses all events."
      - "It is rejected with a 400 Bad Request, because the loggers endpoint validates that configuredLevel is a non-null, recognized level name before applying any change."
      - "It permanently pins the logger at DEBUG until the next restart, because Actuator treats a null configuredLevel as an explicit 'no change' instruction and keeps the prior override."
      - "It resets the configuredLevel to null, so the logger goes back to inheriting its parent's effective level (INFO)."
    answer: 3
    explanation: |
      Posting a null `configuredLevel` **clears** the explicit level, so the logger reverts to
      inheriting its parent's effective level (INFO here) — the same state as before the DEBUG override.
      It is not OFF, not rejected, and not a no-op.
    ref: "concepts.md#key-endpoints-health-info-metrics-env-beans-loggers"
