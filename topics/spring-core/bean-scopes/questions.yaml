topic: "Bean Scopes"
domain: spring-core
topic_slug: bean-scopes
version: 1
questions:
  - id: bean-scopes-001
    difficulty: beginner
    tags: [singleton, default-scope]
    question: |
      What is the default scope of a Spring bean when no scope is explicitly declared?
    options:
      - "prototype"
      - "singleton"
      - "request"
      - "application"
    answer: 1
    explanation: |
      If you do not specify a scope, Spring uses `singleton` by default: one shared
      instance per bean definition per container.
    ref: "concepts.md#singleton-scope"

  - id: bean-scopes-002
    difficulty: beginner
    tags: [singleton, container]
    question: |
      A Spring "singleton" bean means there is exactly one instance per what?
    options:
      - "One per JVM, shared across all classloaders in the process"
      - "One per executing thread, a fresh instance per thread"
      - "One per Spring IoC container (per bean definition)"
      - "One per HTTP request, discarded when the response completes"
    answer: 2
    explanation: |
      A Spring singleton is one instance per bean definition per IoC container. It is NOT
      the GoF singleton (one per JVM). Two ApplicationContexts in the same JVM each get
      their own instance.
    ref: "concepts.md#singleton-scope"

  - id: bean-scopes-003
    difficulty: intermediate
    tags: [singleton, gof, container]
    question: |
      You start two separate ApplicationContext instances in the same JVM, both loading the
      same configuration. How many instances of a given singleton-scoped bean exist?
    options:
      - "One, shared across both contexts"
      - "Two, one per context"
      - "Zero until first requested"
      - "It throws a duplicate-bean exception"
    answer: 1
    explanation: |
      Singleton scope is per-container, not per-JVM. Each ApplicationContext manages its own
      set of singletons, so two contexts produce two instances of the same definition.
    ref: "concepts.md#singleton-scope"

  - id: bean-scopes-004
    difficulty: intermediate
    tags: [singleton, eager, lazy]
    question: |
      By default, when does Spring instantiate singleton-scoped beans?
    options:
      - "Lazily, on the first getBean() call that resolves them"
      - "Only when the JVM begins its shutdown sequence"
      - "Once per thread that first accesses them, cached per thread"
      - "Eagerly, during container startup/refresh"
    answer: 3
    explanation: |
      Singletons are created eagerly at startup (preInstantiateSingletons) so wiring problems
      surface immediately. Use @Lazy / lazy-init to defer creation until first use.
    ref: "concepts.md#singleton-scope"

  - id: bean-scopes-005
    difficulty: beginner
    tags: [prototype, new-instance]
    question: |
      What does prototype scope guarantee?
    options:
      - "A new bean instance is created every time the bean is requested"
      - "One instance shared per active HTTP session"
      - "One instance for the whole container, shared everywhere"
      - "One instance per thread, cached in a ThreadLocal"
    answer: 0
    explanation: |
      Prototype scope produces a brand-new instance on every request for the bean (every
      injection, getBean, or provider call). Spring treats it like a replacement for `new`.
    ref: "concepts.md#prototype-scope"

  - id: bean-scopes-006
    difficulty: beginner
    tags: [prototype, lifecycle, destruction]
    question: |
      Which lifecycle callbacks does the container invoke for a prototype-scoped bean?
    options:
      - "Both initialization and destruction callbacks, on every instance"
      - "Only destruction callbacks, skipping initialization entirely"
      - "Initialization callbacks yes, destruction callbacks no"
      - "Neither initialization nor destruction callbacks are ever run"
    answer: 2
    explanation: |
      Init callbacks (@PostConstruct, afterPropertiesSet, init-method) run on every prototype.
      But the container does NOT call destruction callbacks for prototypes; the client is
      responsible for cleanup because Spring keeps no reference to the instance.
    ref: "concepts.md#prototype-scope"

  - id: bean-scopes-007
    difficulty: intermediate
    tags: [prototype, cleanup]
    question: |
      Who is responsible for releasing expensive resources held by a prototype-scoped bean?
    options:
      - "The Spring container, on context close"
      - "The client code that obtained the instance"
      - "The garbage collector automatically calls @PreDestroy"
      - "A BeanFactoryPostProcessor at startup"
    answer: 1
    explanation: |
      Since Spring does not track prototype instances or call their destruction callbacks, the
      client must clean up (or a custom BeanPostProcessor holding references must do it).
    ref: "concepts.md#prototype-scope"

  - id: bean-scopes-008
    difficulty: beginner
    tags: [prototype, when-to-use]
    question: |
      Which kind of object is the best candidate for prototype scope?
    options:
      - "A stateless service or DAO reused safely across all callers"
      - "A configuration holder shared by everyone in the container"
      - "A stateful per-operation object that must not be shared"
      - "A read-only constant registry loaded once at startup"
    answer: 2
    explanation: |
      Prototype fits stateful objects that must not be shared (per-operation command, builder,
      accumulator). Stateless services/DAOs/config holders should stay singletons.
    ref: "concepts.md#prototype-scope"

  - id: bean-scopes-009
    difficulty: beginner
    tags: [web-scopes, count]
    question: |
      How many scopes does Spring Framework support out of the box, and how many require a
      web-aware context?
    options:
      - "Four scopes, two web-only"
      - "Six scopes, four web-only"
      - "Six scopes, two web-only"
      - "Five scopes, three web-only"
    answer: 1
    explanation: |
      Spring supports six scopes: singleton and prototype (always available) plus request,
      session, application, and websocket (require a web-aware ApplicationContext).
    ref: "concepts.md#web-scopes-request-session-application-websocket"

  - id: bean-scopes-010
    difficulty: beginner
    tags: [web-scopes, request]
    question: |
      A request-scoped bean lives for the duration of what?
    options:
      - "A single HTTP request"
      - "An HTTP session"
      - "The whole ServletContext"
      - "The entire application context"
    answer: 0
    explanation: |
      Request scope creates one instance per HTTP request, discarded when the request completes.
    ref: "concepts.md#web-scopes-request-session-application-websocket"

  - id: bean-scopes-011
    difficulty: beginner
    tags: [web-scopes, session]
    question: |
      A session-scoped bean is bound to which lifecycle?
    options:
      - "A WebSocket frame"
      - "A single method call"
      - "An HTTP session (HttpSession)"
      - "A single HTTP request"
    answer: 2
    explanation: |
      Session scope produces one instance per user's HttpSession, shared across all requests
      in that session and discarded when the session is invalidated.
    ref: "concepts.md#web-scopes-request-session-application-websocket"

  - id: bean-scopes-012
    difficulty: beginner
    tags: [web-scopes, application, singleton]
    question: |
      How does application scope differ from singleton scope?
    options:
      - "Application scope creates a brand-new instance for every incoming HTTP request"
      - "Application scope is one per ServletContext and exposed as a ServletContext attribute"
      - "They are identical in every respect and interchangeable at runtime"
      - "Application scope beans are never destroyed, even when the context closes"
    answer: 1
    explanation: |
      Application scope is a singleton per ServletContext (not per ApplicationContext) and is
      additionally exposed/visible as a ServletContext attribute to plain servlet code.
    ref: "concepts.md#web-scopes-request-session-application-websocket"

  - id: bean-scopes-013
    difficulty: intermediate
    tags: [web-scopes, websocket]
    question: |
      WebSocket scope is associated with which lifecycle and application style?
    options:
      - "The ServletContext lifecycle in any traditional servlet web app"
      - "A single HTTP request in stateless REST controller applications"
      - "A WebSocket session in STOMP-over-WebSocket applications"
      - "A thread-local bound to worker threads in batch jobs"
    answer: 2
    explanation: |
      WebSocket scope binds a bean to the lifecycle of a WebSocket session and applies to
      STOMP-over-WebSocket applications.
    ref: "concepts.md#web-scopes-request-session-application-websocket"

  - id: bean-scopes-014
    difficulty: intermediate
    tags: [web-scopes, annotations]
    question: |
      Which composed annotation is a shortcut for @Scope("request") with a target-class proxy?
    options:
      - "@RequestScope"
      - "@RequestMapping"
      - "@Scoped"
      - "@WebScope"
    answer: 0
    explanation: |
      @RequestScope is a composed shortcut equal to @Scope(value="request",
      proxyMode=TARGET_CLASS). Similar shortcuts exist: @SessionScope and @ApplicationScope.
    ref: "concepts.md#web-scopes-request-session-application-websocket"

  - id: bean-scopes-015
    difficulty: intermediate
    tags: [web-scopes, jakarta, javax]
    question: |
      In Spring Framework 6.x and later, which servlet API namespace backs the web scopes?
    options:
      - "javax.servlet.*"
      - "jakarta.servlet.*"
      - "org.springframework.servlet.*"
      - "java.net.http.*"
    answer: 1
    explanation: |
      Spring Framework 6.0+ baselines on Jakarta EE 9+, so servlet types are jakarta.servlet.*
      (HttpServletRequest, HttpSession, ServletContext). Spring 5 used javax.servlet.*.
    ref: "concepts.md#web-scopes-request-session-application-websocket"

  - id: bean-scopes-016
    difficulty: intermediate
    tags: [web-scopes, setup, thread-binding]
    question: |
      Inside a standard Spring MVC DispatcherServlet application, what setup is required to use
      request and session scopes?
    options:
      - "You must register RequestContextListener manually in web.xml first"
      - "You must add an aop:scoped-proxy to every request-scoped bean definition"
      - "No special setup; DispatcherServlet already binds the request to the thread"
      - "You must enable a custom Scope implementation and register it by name"
    answer: 2
    explanation: |
      Within Spring MVC no special setup is needed; DispatcherServlet binds request/session
      state to the serving thread. RequestContextListener/Filter are only needed outside
      DispatcherServlet (e.g. JSF or other frameworks).
    ref: "concepts.md#web-scopes-request-session-application-websocket"

  - id: bean-scopes-017
    difficulty: beginner
    tags: [thread-safety, singleton]
    question: |
      Does Spring make singleton beans thread-safe automatically?
    options:
      - "Yes, Spring synchronizes all singleton method calls"
      - "Yes, but only for beans explicitly marked @ThreadSafe"
      - "No; thread safety is the developer's responsibility"
      - "Only in web-aware contexts backed by a servlet container"
    answer: 2
    explanation: |
      Spring provides no synchronization for singletons shared across threads. Thread safety
      is the developer's responsibility; the usual approach is to keep singletons stateless.
    ref: "concepts.md#singleton-thread-safety-responsibility"

  - id: bean-scopes-018
    difficulty: intermediate
    tags: [thread-safety, stateless]
    question: |
      What is the recommended way to make a shared singleton bean safe under concurrent access?
    options:
      - "Keep it stateless, holding per-call data in local variables"
      - "Add @Transactional to every method so calls are serialized"
      - "Rely on the container's built-in per-bean locking mechanism"
      - "Mark all mutable fields as transient to avoid sharing them"
    answer: 0
    explanation: |
      Stateless singletons are inherently thread-safe. Keep mutable per-call data in local
      variables/parameters (thread stack). If mutable shared state is unavoidable, guard it
      yourself or narrow the scope.
    ref: "concepts.md#singleton-thread-safety-responsibility"

  - id: bean-scopes-019
    difficulty: intermediate
    tags: [thread-safety, mutable-state]
    question: |
      A singleton service needs to hold mutable per-user data. Which is the most idiomatic
      Spring solution?
    options:
      - "Synchronize every public method on the singleton so a global lock serializes all callers"
      - "Move the stateful part into a narrower scope (e.g. session/request/prototype) injected via a scoped proxy or provider"
      - "Switch the bean to prototype scope so a new instance is created at every injection point"
      - "Store the data in static fields shared process-wide across all request threads"
    answer: 1
    explanation: |
      Rather than synchronizing a singleton, the idiomatic fix is to put the per-user mutable
      state in a session/request/prototype-scoped bean and inject it into the stateless
      singleton via a scoped proxy or ObjectProvider.
    ref: "concepts.md#singleton-thread-safety-responsibility"

  - id: bean-scopes-020
    difficulty: intermediate
    tags: [prototype, singleton, injection-problem]
    question: |
      You inject a prototype-scoped bean into a singleton with plain @Autowired. What actually
      happens at runtime?
    options:
      - "The singleton gets a fresh prototype instance on every method call, re-resolved through the container each time"
      - "The singleton is given a single prototype instance once at wiring time and reuses it forever"
      - "Spring throws a BeanCreationException at startup because scopes are incompatible for injection"
      - "The prototype is silently converted to a singleton definition and shared across the whole context"
    answer: 1
    explanation: |
      Injection happens once, when the container wires the singleton. So the singleton captures
      one prototype instance and reuses it; you never get a fresh prototype per call this way.
    ref: "concepts.md#injecting-a-prototype-into-a-singleton"

  - id: bean-scopes-021
    difficulty: intermediate
    tags: [prototype, singleton, objectprovider]
    question: |
      Which injection type lets a singleton fetch a fresh prototype instance on demand via a
      getObject() call, without holding onto the instance?
    options:
      - "ObjectProvider<T> (or ObjectFactory<T>)"
      - "A plain @Autowired field of the prototype type"
      - "A List<T> collection injection point"
      - "A field annotated with @Value(\"#{...}\")"
    answer: 0
    explanation: |
      ObjectProvider<T> (and the simpler ObjectFactory<T>) let you call getObject() on demand
      to obtain the current/fresh instance each time, so a singleton can pull a new prototype
      per call without storing it.
    ref: "concepts.md#injecting-a-prototype-into-a-singleton"

  - id: bean-scopes-022
    difficulty: intermediate
    tags: [prototype, objectprovider, api]
    question: |
      Which extra capabilities does ObjectProvider add over the simpler ObjectFactory?
    options:
      - "getIfAvailable() and getIfUnique() plus stream access"
      - "Automatic transaction management around each getObject() call"
      - "Compile-time proxy generation for the resolved target type"
      - "Session persistence of the resolved instance across requests"
    answer: 0
    explanation: |
      ObjectProvider (Spring 4.3+) extends ObjectFactory with richer access: getIfAvailable(),
      getIfUnique(), and stream/iterator methods, in addition to getObject().
    ref: "concepts.md#injecting-a-prototype-into-a-singleton"

  - id: bean-scopes-023
    difficulty: intermediate
    tags: [scoped-proxy, prototype]
    question: |
      When a scoped proxy is declared for a prototype bean, what happens on each method call
      to the injected proxy?
    options:
      - "A new target instance is created and the call is forwarded to it"
      - "The same cached target instance, resolved once at startup, handles every call"
      - "The call fails with an exception because prototype beans cannot be given a scoped proxy"
      - "The proxy blocks until the previous invocation finishes before serving the next one"
    answer: 0
    explanation: |
      With a scoped proxy on a prototype, every method call on the shared proxy creates a new
      target instance to which the call is then forwarded.
    ref: "concepts.md#injecting-a-prototype-into-a-singleton"

  - id: bean-scopes-024
    difficulty: intermediate
    tags: [scoped-proxy, cglib, jdk]
    question: |
      With proxyMode = TARGET_CLASS, what kind of proxy does Spring create for a scoped bean?
    options:
      - "A JDK dynamic proxy requiring an interface"
      - "A compile-time generated proxy"
      - "A CGLIB class-based proxy"
      - "No proxy; it uses reflection directly"
    answer: 2
    explanation: |
      TARGET_CLASS produces a CGLIB class-based proxy (no interface needed), but it cannot
      intercept private or final methods. INTERFACES produces a JDK proxy requiring an interface.
    ref: "concepts.md#injecting-a-prototype-into-a-singleton"

  - id: bean-scopes-025
    difficulty: intermediate
    tags: [scoped-proxy, interfaces, jdk]
    question: |
      To use proxyMode = INTERFACES (a JDK dynamic proxy) for a scoped bean, what must be true?
    options:
      - "The bean class must be declared final so the JDK proxy can seal it"
      - "The bean class must implement at least one interface"
      - "The bean must be prototype-scoped for a JDK proxy to be generated"
      - "CGLIB must be excluded from the classpath to force the JDK proxy path"
    answer: 1
    explanation: |
      A JDK dynamic proxy (INTERFACES mode) proxies interface methods, so the bean's class must
      implement at least one interface.
    ref: "concepts.md#injecting-a-prototype-into-a-singleton"

  - id: bean-scopes-026
    difficulty: beginner
    tags: [lookup, method-injection]
    question: |
      What does the @Lookup annotation do?
    options:
      - "It caches the method's return value so later calls skip re-execution"
      - "It marks a method to trigger a transaction rollback when it throws"
      - "It tells Spring to override the method so it returns a fresh bean instance on each call"
      - "It registers the method as an application event listener callback"
    answer: 2
    explanation: |
      @Lookup enables method injection: Spring generates a CGLIB subclass overriding the method
      to return a fresh (e.g. prototype) bean instance on each invocation.
    ref: "concepts.md#injecting-a-prototype-into-a-singleton"

  - id: bean-scopes-027
    difficulty: intermediate
    tags: [lookup, cglib, limitations]
    question: |
      Because @Lookup / method injection relies on CGLIB subclassing, which restriction applies?
    options:
      - "The bean class and lookup method must not be final or private"
      - "The bean must implement Serializable so the subclass can be persisted"
      - "The lookup method must be declared static and take no arguments"
      - "The enclosing bean must itself be request-scoped for the override to apply"
    answer: 0
    explanation: |
      Method injection generates a subclass at runtime, so the target class and the overridden
      lookup method cannot be final or private.
    ref: "concepts.md#injecting-a-prototype-into-a-singleton"

  - id: bean-scopes-028
    difficulty: intermediate
    tags: [web-scopes, scoped-proxy, why]
    question: |
      Why is a scoped proxy typically required when injecting a request- or session-scoped bean
      into a singleton?
    options:
      - "Because the singleton is created lazily and the proxy defers its instantiation until first access"
      - "Because the shorter-lived bean may not even exist when the singleton is wired, so the proxy resolves the current instance per call"
      - "Because request- and session-scoped beans cannot be autowired into any other bean at all"
      - "Because the scoped proxy disables Spring's thread-safety checks on the injected bean"
    answer: 1
    explanation: |
      At singleton wiring time there may be no active request/session. A scoped proxy is injected
      instead; on each call it resolves the real bean from the current request/session.
    ref: "concepts.md#injecting-a-prototype-into-a-singleton"

  - id: bean-scopes-029
    difficulty: intermediate
    tags: [prototype, singleton, jsr330]
    question: |
      What is the JSR-330 standard equivalent used to obtain a fresh instance on demand,
      similar to Spring's ObjectFactory?
    options:
      - "jakarta.inject.Provider<T> with get()"
      - "jakarta.annotation.Resource with a lookup name"
      - "java.util.Supplier<T> from the JDK, with get()"
      - "jakarta.enterprise.inject.Instance<T>, via select()"
    answer: 0
    explanation: |
      The JSR-330 equivalent is jakarta.inject.Provider<T> (javax.inject.Provider pre-Spring 6),
      whose get() returns a fresh instance on each call.
    ref: "concepts.md#injecting-a-prototype-into-a-singleton"

  - id: bean-scopes-030
    difficulty: beginner
    tags: [custom-scopes, override]
    question: |
      Which built-in scopes can you NOT override or redefine?
    options:
      - "request and session"
      - "application and websocket"
      - "All scopes can be freely overridden"
      - "singleton and prototype"
    answer: 3
    explanation: |
      You can define custom scopes (or, as bad practice, redefine web scopes), but you cannot
      override the built-in singleton and prototype scopes.
    ref: "concepts.md#custom-scopes"

  - id: bean-scopes-031
    difficulty: intermediate
    tags: [custom-scopes, scope-interface]
    question: |
      To create a custom scope, which interface must you implement?
    options:
      - "org.springframework.beans.factory.config.Scope"
      - "org.springframework.context.ApplicationScope"
      - "java.util.function.Supplier"
      - "org.springframework.beans.factory.BeanFactory"
    answer: 0
    explanation: |
      A custom scope implements org.springframework.beans.factory.config.Scope, providing
      get(), remove(), registerDestructionCallback(), resolveContextualObject(), and
      getConversationId().
    ref: "concepts.md#custom-scopes"

  - id: bean-scopes-032
    difficulty: intermediate
    tags: [custom-scopes, registration]
    question: |
      Which method registers a custom Scope implementation with the container?
    options:
      - "ConfigurableBeanFactory.registerScope(String, Scope)"
      - "ApplicationContext.addScope(Scope)"
      - "BeanDefinition.setScopeClass(Scope)"
      - "Environment.registerScope(Scope)"
    answer: 0
    explanation: |
      You register a scope programmatically via ConfigurableBeanFactory.registerScope(name,
      scope), or declaratively with CustomScopeConfigurer.
    ref: "concepts.md#custom-scopes"

  - id: bean-scopes-033
    difficulty: intermediate
    tags: [custom-scopes, configurer]
    question: |
      Which class lets you register custom scopes declaratively via bean configuration?
    options:
      - "CustomScopeConfigurer"
      - "PropertySourcesPlaceholderConfigurer"
      - "CommonAnnotationBeanPostProcessor"
      - "ScopeMetadataResolver"
    answer: 0
    explanation: |
      CustomScopeConfigurer is a BeanFactoryPostProcessor that registers a map of custom scopes
      declaratively, e.g. mapping "thread" to a SimpleThreadScope.
    ref: "concepts.md#custom-scopes"

  - id: bean-scopes-034
    difficulty: intermediate
    tags: [custom-scopes, simplethreadscope]
    question: |
      Which statement about SimpleThreadScope is correct?
    options:
      - "It is registered automatically by default under the scope name 'thread'"
      - "It transparently replaces the built-in singleton scope for every bean"
      - "It is provided by Spring but must be registered manually before use"
      - "It is only available on the classpath when running under Spring Boot"
    answer: 2
    explanation: |
      SimpleThreadScope is a ThreadLocal-backed scope shipped with Spring but NOT registered by
      default; you must register it (e.g. registerScope("thread", new SimpleThreadScope())).
      It also does not clean up ThreadLocal state in pooled threads.
    ref: "concepts.md#custom-scopes"

  - id: bean-scopes-035
    difficulty: beginner
    tags: [scope-declaration, annotations]
    question: |
      Which annotation declares a bean's scope in annotation-based configuration?
    options:
      - "@Bean"
      - "@Scope"
      - "@Component"
      - "@Qualifier"
    answer: 1
    explanation: |
      @Scope("prototype") (or the shortcuts @RequestScope, @SessionScope, @ApplicationScope)
      declares the scope. In XML it's the scope="..." attribute.
    ref: "concepts.md#prototype-scope"

  - id: bean-scopes-036
    difficulty: intermediate
    tags: [singleton, same-class-two-names]
    question: |
      You declare the same class under two different bean names, both singleton-scoped. How many
      instances does the container hold?
    options:
      - "One shared instance, because both names resolve to the same class"
      - "Zero, because neither definition is instantiated until first injected"
      - "Two, because scope is keyed on the bean definition, not the type"
      - "It throws a NoUniqueBeanDefinitionException at container startup"
    answer: 2
    explanation: |
      Singleton scope is per bean definition. Two definitions of the same class produce two
      distinct singleton instances.
    ref: "concepts.md#singleton-scope"

  - id: bean-scopes-037
    difficulty: beginner
    tags: [prototype, new-operator]
    question: |
      Spring documentation describes the container's role for a prototype bean as a replacement
      for what?
    options:
      - "The Java `new` operator"
      - "A static factory method"
      - "The finalize() method"
      - "A thread pool"
    answer: 0
    explanation: |
      For prototypes, the container instantiates and configures the object then hands it off,
      acting as a replacement for the Java `new` operator, keeping no further record of it.
    ref: "concepts.md#prototype-scope"

  - id: bean-scopes-038
    difficulty: beginner
    tags: [web-scopes, outside-dispatcher]
    question: |
      Outside of Spring MVC's DispatcherServlet (for example in a JSF application), what must you
      register to enable request and session scopes?
    options:
      - "Only a CustomScopeConfigurer bean, nothing else"
      - "Nothing; they work everywhere automatically"
      - "RequestContextListener or RequestContextFilter"
      - "A dedicated child ApplicationContext bean"
    answer: 2
    explanation: |
      Outside DispatcherServlet you register RequestContextListener or RequestContextFilter;
      all three do the same job of binding the HTTP request to the serving thread.
    ref: "concepts.md#web-scopes-request-session-application-websocket"

  - id: bean-scopes-039
    difficulty: beginner
    tags: [scopes, comparison]
    question: |
      Which pair correctly matches scope to number of instances?
    options:
      - "singleton = new per request; prototype = one per container"
      - "singleton = one per container; prototype = new per request for the bean"
      - "singleton = one per session; prototype = one per JVM"
      - "singleton = one per thread; prototype = one per request"
    answer: 1
    explanation: |
      Singleton yields one shared instance per container; prototype yields a new instance each
      time the bean is requested.
    ref: "concepts.md#prototype-scope"

  - id: bean-scopes-040
    difficulty: intermediate
    tags: [prototype, injection-problem, fresh-instance]
    question: |
      Which of the following will NOT give a singleton a fresh prototype instance on each use?
    options:
      - "Injecting ObjectProvider and calling getObject() each time"
      - "Declaring the prototype with a scoped proxy"
      - "Using @Lookup method injection"
      - "Plain @Autowired of the prototype into a field"
    answer: 3
    explanation: |
      Plain @Autowired wires once and keeps the same prototype forever. ObjectProvider, a scoped
      proxy, or @Lookup method injection all yield a fresh instance per use.
    ref: "concepts.md#injecting-a-prototype-into-a-singleton"

  - id: bean-scopes-041
    difficulty: beginner
    tags: [web-scopes, availability]
    question: |
      Which scope is available in a plain (non-web) ApplicationContext?
    options:
      - "request"
      - "session"
      - "prototype"
      - "websocket"
    answer: 2
    explanation: |
      Only singleton and prototype work in any container. request, session, application, and
      websocket require a web-aware ApplicationContext.
    ref: "concepts.md#prototype-scope"

  - id: bean-scopes-042
    difficulty: beginner
    tags: [singleton, lifecycle, destruction]
    question: |
      When are singleton beans' destruction callbacks (e.g. @PreDestroy) invoked?
    options:
      - "After every method call"
      - "When the container is closed/shut down"
      - "Never; only prototypes get them"
      - "On the first getBean() call"
    answer: 1
    explanation: |
      The container manages the full singleton lifecycle, invoking destruction callbacks when
      the context is closed. (Prototypes, by contrast, get no destruction callbacks.)
    ref: "concepts.md#singleton-scope"

  - id: bean-scopes-043
    difficulty: advanced
    tags: [singleton, circular-reference, constructor-injection]
    question: |
      Two singleton beans A and B depend on each other. With CONSTRUCTOR injection on both
      sides and no other annotations, what happens at container startup?
    options:
      - "Both are created; the three-level cache exposes an early reference that satisfies the cycle"
      - "Startup fails with BeanCurrentlyInCreationException because a half-built constructor-injected singleton cannot be exposed early"
      - "Spring silently converts one of them to prototype scope to break the cycle"
      - "Both beans are created lazily on first use, avoiding the cycle entirely"
    answer: 1
    explanation: |
      The three-level cache can expose an early reference only after a bean's constructor has
      returned (setter/field injection). With constructor injection on both sides, neither can
      be instantiated first, so Spring throws BeanCurrentlyInCreationException. Setter/field
      cycles between singletons can be resolved via the early-reference cache.
    ref: "concepts.md#singleton-scope"

  - id: bean-scopes-044
    difficulty: advanced
    tags: [singleton, circular-reference, lazy]
    question: |
      You have an unavoidable constructor-injection cycle between two singletons. Which minimal
      change lets the context start without redesigning the dependencies?
    options:
      - "Annotate one of the two constructor injection points with @Lazy so a lazy proxy is injected there"
      - "Annotate both beans with @Primary so the container picks a winner and short-circuits the cycle"
      - "Switch both beans to prototype scope so early references break the constructor dependency"
      - "Add @DependsOn on each bean pointing at the other"
    answer: 0
    explanation: |
      Marking ONE injection point @Lazy makes Spring inject a lazy-resolving proxy, so that
      constructor completes without forcing the other bean's eager creation, breaking the
      cycle. Prototype scope cannot participate in early-reference resolution and @DependsOn
      only reinforces ordering (it would deadlock the cycle, not resolve it).
    ref: "concepts.md#singleton-scope"

  - id: bean-scopes-045
    difficulty: advanced
    tags: [singleton, destruction, ordering, depends-on]
    question: |
      Bean X is declared @DependsOn("Y") and both are singletons. What is the guaranteed
      creation and destruction ordering?
    options:
      - "Y created before X; on shutdown X destroyed before Y"
      - "X created before Y; on shutdown Y destroyed before X"
      - "Creation order is undefined but both are destroyed simultaneously"
      - "Y created before X; on shutdown Y destroyed before X"
    answer: 0
    explanation: |
      @DependsOn forces Y to be fully instantiated before X. Destruction is the mirror image:
      dependents are destroyed before their dependencies, so X is destroyed before Y. Spring
      destroys singletons in reverse of the effective initialization order.
    ref: "concepts.md#singleton-scope"

  - id: bean-scopes-046
    difficulty: expert
    tags: [singleton, thread-safety, creation-lock]
    question: |
      Two threads simultaneously call getBean() for the same not-yet-created @Lazy singleton
      whose constructor is expensive. What does Spring guarantee?
    options:
      - "Each thread gets its own instance because @Lazy beans skip the singleton creation lock and are built per caller"
      - "The second thread receives a partially initialized instance from the early-reference cache"
      - "The container synchronizes singleton creation so the object is instantiated once and both threads receive the same fully published instance"
      - "Spring throws BeanCurrentlyInCreationException on the thread that loses the race to create it first"
    answer: 2
    explanation: |
      DefaultSingletonBeanRegistry synchronizes on the singletonObjects map during
      getSingleton, so concurrent first-time creation collapses to a single instantiation that
      is safely published to both callers. This is creation-time locking only; it does not
      make subsequent business-method calls thread-safe.
    ref: "concepts.md#singleton-scope"

  - id: bean-scopes-047
    difficulty: advanced
    tags: [singleton, lazy, eager]
    question: |
      A bean B is annotated @Lazy. A non-lazy singleton A has `@Autowired B b;` (a plain field,
      injection point NOT marked @Lazy). When is B instantiated?
    options:
      - "At container startup, because A eagerly needs a concrete B to inject"
      - "Only when a method is first called on B"
      - "Never, until getBean(B.class) is called explicitly"
      - "Once per method call on A"
    answer: 0
    explanation: |
      @Lazy on the bean definition only defers creation until something requires it. A is a
      non-lazy singleton created eagerly, and its plain injection point demands a real B, so B
      is instantiated at startup anyway. Deferral would require marking the INJECTION POINT
      @Lazy (injecting a proxy).
    ref: "concepts.md#singleton-scope"

  - id: bean-scopes-048
    difficulty: expert
    tags: [prototype, configuration, proxyBeanMethods]
    question: |
      In a @Configuration(proxyBeanMethods = false) "lite" config, a prototype @Bean method
      `foo()` is called directly by another @Bean method `bar()`. What does bar() receive?
    options:
      - "A plain new object from the direct Java method call, bypassing the container and its post-processing"
      - "A fresh container-managed prototype each call, because @Bean methods always route through getBean"
      - "The same cached singleton instance, because lite configs cache all @Bean results"
      - "A CGLIB scoped proxy that lazily resolves a fresh prototype target on each method call"
    answer: 0
    explanation: |
      With proxyBeanMethods = false there is no CGLIB config proxy to intercept inter-bean
      method calls, so `foo()` is an ordinary Java call returning a `new` object that skips
      container instantiation/post-processing. Only full @Configuration (proxyBeanMethods =
      true) routes such calls through getBean to preserve scope semantics.
    ref: "concepts.md#prototype-scope"

  - id: bean-scopes-049
    difficulty: advanced
    tags: [prototype, startup, fail-fast]
    question: |
      A prototype-scoped bean has a misconfigured dependency that would fail at instantiation.
      When is this error surfaced?
    options:
      - "At container refresh, during preInstantiateSingletons"
      - "Lazily, only when the prototype is first requested"
      - "Immediately, because Spring validates all definitions eagerly"
      - "Never; prototype wiring errors are suppressed"
    answer: 1
    explanation: |
      Prototypes are not eagerly instantiated at refresh(); they are created on demand. So a
      broken prototype definition is discovered only at first request, unlike singletons which
      fail fast at startup.
    ref: "concepts.md#prototype-scope"

  - id: bean-scopes-050
    difficulty: expert
    tags: [prototype, destruction, scoped-proxy]
    question: |
      A prototype bean holding a JDBC connection is injected via a scoped proxy into a
      singleton. You call methods on it across many requests. Regarding cleanup, what is true?
    options:
      - "The scoped proxy tracks every created target and calls @PreDestroy on context close"
      - "Only the most recently created prototype gets its @PreDestroy called"
      - "@PreDestroy runs automatically after each method call on the proxy"
      - "The container never invokes destruction callbacks on any of the prototype instances; you must release resources yourself"
    answer: 3
    explanation: |
      Spring keeps no reference to prototype instances, so destruction callbacks are never
      invoked for them even behind a scoped proxy. Deterministic cleanup requires client-side
      management (e.g. ObjectProvider + try/finally, or a manager bean).
    ref: "concepts.md#prototype-scope"

  - id: bean-scopes-051
    difficulty: advanced
    tags: [prototype, objectprovider, stream]
    question: |
      A singleton injects `ObjectProvider<Task>` where Task is prototype-scoped, and calls
      `provider.stream().count()` twice. How many Task instances are created in total?
    options:
      - "Zero; stream() is lazy and count() does not materialize elements"
      - "One, reused across both stream() calls"
      - "Two, one materialized per stream() invocation that pulls the element"
      - "It throws because prototypes cannot be streamed"
    answer: 2
    explanation: |
      ObjectProvider.stream() materializes matching beans; for a prototype each terminal
      traversal creates a fresh instance. Two stream/count cycles that each pull the single
      matching definition create two Task instances.
    ref: "concepts.md#injecting-a-prototype-into-a-singleton"

  - id: bean-scopes-052
    difficulty: expert
    tags: [web-scopes, async, thread-binding]
    question: |
      A controller injects a request-scoped bean via a scoped proxy, then hands work to an
      @Async method that calls a method on that proxy. What is the most likely outcome?
    options:
      - "It works, because request scope is inherited by @Async executor threads automatically"
      - "It silently returns a new singleton instance on the async thread"
      - "It blocks until the original request completes, then resolves the bean"
      - "It throws (e.g. BeanCreationException / ScopeNotActiveException: No thread-bound request found) on the async thread"
    answer: 3
    explanation: |
      The request context is bound (via RequestContextHolder) to the servlet thread and is NOT
      inherited by pooled @Async threads by default. Invoking the scoped proxy there finds no
      bound request and fails. Fixes include capturing data before crossing threads or
      propagating context with a task decorator.
    ref: "concepts.md#web-scopes-request-session-application-websocket"

  - id: bean-scopes-053
    difficulty: expert
    tags: [web-scopes, session, concurrency, thread-safety]
    question: |
      A session-scoped bean holds a mutable List. A user opens two browser tabs firing
      concurrent requests in the same HttpSession. What must you consider?
    options:
      - "The bean can be accessed concurrently by both request threads, so its mutable state is not automatically thread-safe"
      - "Nothing; session scope guarantees single-threaded access per user"
      - "Spring serializes all requests in one session, so no synchronization is ever needed"
      - "Each tab gets its own session-scoped instance, eliminating sharing"
    answer: 0
    explanation: |
      A single HttpSession can service multiple simultaneous requests, so one session-scoped
      instance may be touched by several threads concurrently. "One per user" does not imply
      single-threaded; mutable session state still needs synchronization.
    ref: "concepts.md#web-scopes-request-session-application-websocket"

  - id: bean-scopes-054
    difficulty: advanced
    tags: [web-scopes, session, serialization, clustering]
    question: |
      An application runs in a cluster that replicates HTTP sessions across nodes. What
      requirement does this impose on session-scoped beans?
    options:
      - "They must be annotated @Clustered so Spring enrolls them in the replication channel"
      - "They must be converted to application scope so every node shares one ServletContext copy"
      - "Nothing; Spring transparently reconstructs them from the bean definition on each node"
      - "They (and their held state) should be Serializable, since they live as session attributes that get serialized for replication"
    answer: 3
    explanation: |
      Session-scoped beans are stored as HttpSession attributes; a container that replicates or
      persists sessions serializes those attributes. The bean and its state must be
      Serializable or replication fails.
    ref: "concepts.md#web-scopes-request-session-application-websocket"

  - id: bean-scopes-055
    difficulty: advanced
    tags: [web-scopes, application, singleton, distinction]
    question: |
      What is a defensible, precise difference between an application-scoped bean and a
      container singleton in a web app?
    options:
      - "Application scope is one per ServletContext and exposed as a ServletContext attribute (visible to plain servlets), whereas a singleton is one per ApplicationContext and not published to the servlet context"
      - "There is no difference at all; @ApplicationScope is just a documented alias for singleton scope, and the two resolve to the exact same BeanDefinition metadata at runtime"
      - "Application scope creates a brand-new instance for every incoming HTTP request, whereas a singleton is instantiated only once and then shared across the entire container"
      - "Singletons are serialized to disk during the container's orderly shutdown so they can be restored on restart, whereas application-scoped beans are simply discarded"
    answer: 0
    explanation: |
      Application scope binds one instance to the ServletContext and publishes it as a
      ServletContext attribute reachable by non-Spring servlet code. A singleton is scoped to
      the ApplicationContext and is not exposed to the servlet context. If multiple contexts
      share one ServletContext they'd share the application-scoped bean but not singletons.
    ref: "concepts.md#web-scopes-request-session-application-websocket"

  - id: bean-scopes-056
    difficulty: expert
    tags: [scoped-proxy, cglib, identity]
    question: |
      A @RequestScope bean with a public field `count` is injected (via its default scoped
      proxy) into a singleton. Code does `bean.count = 5;` directly on the injected reference,
      then later reads `bean.count`. What is the pitfall?
    options:
      - "It correctly stores 5 on the current request's resolved target instance, because CGLIB scoped proxies intercept field writes and forward them to the per-request bean"
      - "The field write hits the CGLIB proxy's own (unused) field, not the resolved target; only method calls are routed to the real bean"
      - "It throws IllegalAccessException at runtime because the CGLIB subclass marks all inherited instance fields final to protect proxy integrity"
      - "It transparently creates a fresh request-scoped target instance on the field write and stores the value 5 on that newly created bean"
    answer: 1
    explanation: |
      A TARGET_CLASS scoped proxy is a generated subclass that intercepts METHOD calls to
      resolve the target; direct field access touches the proxy's own inherited field, not the
      per-request target. State must be accessed through methods, not fields, on a scoped
      proxy.
    ref: "concepts.md#injecting-a-prototype-into-a-singleton"

  - id: bean-scopes-057
    difficulty: expert
    tags: [scoped-proxy, final, cglib, failure]
    question: |
      You annotate a bean with @Scope(value = "session", proxyMode = TARGET_CLASS) but the
      class is declared `final`. What happens?
    options:
      - "It works fine; CGLIB proxies a final class by rewriting its bytecode in place to strip the final modifier before generating the subclass"
      - "Spring silently detects the final class and falls back to generating a JDK dynamic proxy against the class's implemented interfaces"
      - "The bean is created successfully but the proxy quietly delegates every call to one shared singleton instance instead of a per-session target"
      - "Context creation fails because CGLIB cannot subclass a final class to build the proxy"
    answer: 3
    explanation: |
      A TARGET_CLASS scoped proxy is a CGLIB subclass of the target. A final class cannot be
      subclassed, so proxy creation fails at context startup. You would need a non-final class,
      or INTERFACES mode with an implemented interface.
    ref: "concepts.md#injecting-a-prototype-into-a-singleton"

  - id: bean-scopes-058
    difficulty: expert
    tags: [scoped-proxy, interfaces, classcastexception]
    question: |
      A session-scoped bean uses @Scope(value="session", proxyMode=INTERFACES) and implements
      MyService. A singleton injects it as the concrete class `MyServiceImpl impl`. What is the
      likely result?
    options:
      - "It works fine, because a JDK dynamic proxy generated for INTERFACES mode also implements the concrete MyServiceImpl class alongside its interfaces"
      - "Spring detects the concrete-type injection point and silently upgrades the proxy to a CGLIB class-based proxy that extends MyServiceImpl"
      - "The bean is injected successfully but every method call throws UnsupportedOperationException because JDK proxies cannot dispatch concrete methods"
      - "Injection fails / ClassCastException because a JDK dynamic proxy implements only the interface, not MyServiceImpl"
    answer: 3
    explanation: |
      INTERFACES mode yields a JDK dynamic proxy that implements the bean's interfaces, not the
      concrete class. Injecting/casting to MyServiceImpl fails because the proxy is not an
      instance of that class. Inject by the interface type, or use TARGET_CLASS.
    ref: "concepts.md#injecting-a-prototype-into-a-singleton"

  - id: bean-scopes-059
    difficulty: advanced
    tags: [scoped-proxy, singleton-proxy, identity]
    question: |
      When a request-scoped bean is injected into a singleton through a scoped proxy, what is
      the lifetime of the object stored in the singleton's field?
    options:
      - "A single long-lived proxy (itself effectively a singleton); only the target it delegates to changes per request"
      - "A brand-new proxy object is generated at the start of each HTTP request and reassigned into the singleton's field by a request-scoped BeanPostProcessor"
      - "The field holds the actual request-scoped target directly, and Spring swaps in the freshly resolved target instance at the beginning of each request"
      - "The field is set to null between requests and repopulated with a resolved target only once the next request thread is bound"
    answer: 0
    explanation: |
      The injected reference is one stable, long-lived proxy object. The proxy delegates each
      method call to the current request's target resolved via RequestContextHolder, so the
      field never changes even though behavior routes to different backing instances.
    ref: "concepts.md#injecting-a-prototype-into-a-singleton"

  - id: bean-scopes-060
    difficulty: expert
    tags: [objectprovider, scope-not-active, web-scopes]
    question: |
      Instead of a scoped proxy, a singleton injects `ObjectProvider<CartBean>` for a
      session-scoped CartBean, and calls `provider.getObject()` on a thread with no bound
      session. What is the behavior, and how would getIfAvailable() differ?
    options:
      - "getObject() quietly returns null when no scope is active, while getIfAvailable() is the stricter call that throws ScopeNotActiveException in that situation"
      - "Both calls silently create and return a fresh singleton-scoped fallback instance so the singleton always receives a usable non-null CartBean"
      - "getObject() throws (e.g. ScopeNotActiveException); getIfAvailable() lets you handle absence, typically returning null"
      - "Both calls block the current thread until a session is eventually bound to it, then resolve and return the session-scoped CartBean"
    answer: 2
    explanation: |
      With no active scope, getObject() throws (ScopeNotActiveException / BeanCreationException),
      surfacing the failure explicitly. getIfAvailable() is designed to tolerate absence and
      returns null (or your supplied default), which is why ObjectProvider is chosen when you
      want to detect missing scope rather than defer failure to a proxied method call.
    ref: "concepts.md#injecting-a-prototype-into-a-singleton"

  - id: bean-scopes-061
    difficulty: advanced
    tags: [lookup, method-injection, internals]
    question: |
      How does Spring implement an @Lookup method that returns a fresh prototype?
    options:
      - "It rewrites the original method's bytecode in place at load time using a java.lang.instrument agent so the compiled body directly calls getBean()"
      - "It generates a CGLIB subclass overriding the method body to call getBean() for the target on each invocation"
      - "It eagerly resolves one instance at wiring time, caches it in a field, and returns that same cached object via reflective method invocation on every call"
      - "It wraps the whole enclosing bean in a JDK dynamic proxy whose InvocationHandler intercepts the lookup method and resolves the target type"
    answer: 1
    explanation: |
      Method injection uses a CGLIB-generated subclass that overrides the abstract/concrete
      lookup method to delegate to the container's getBean for the target type, returning a
      fresh instance each call. Hence the class and method cannot be final or private.
    ref: "concepts.md#injecting-a-prototype-into-a-singleton"

  - id: bean-scopes-062
    difficulty: advanced
    tags: [prototype, singleton, wiring-once, code-analysis]
    question: |
      A singleton `Counter` prototype-injected plainly (`@Autowired Counter c;`) exposes
      c.incrementAndGet(). Two different requests call the singleton's method that calls
      c.incrementAndGet(). What sequence of values is returned?
    options:
      - "1 then 1, because a plain @Autowired prototype field is re-resolved from the container on every method call, giving a fresh zero-valued Counter each time"
      - "1 then 2, because the same single Counter instance was captured once at wiring time and is shared"
      - "It throws a BeanCreationException at startup, because Spring forbids autowiring a prototype-scoped bean into a singleton without a scoped proxy"
      - "Random, non-deterministic values, because Spring recreates the injected Counter at unpredictable intervals as it garbage-collects stale prototypes"
    answer: 1
    explanation: |
      Plain @Autowired wires the prototype exactly once when the singleton is created, so the
      singleton holds ONE Counter forever. Both calls hit the same instance, yielding 1 then 2
      - defeating the intended per-use freshness. Use ObjectProvider, a scoped proxy, or
      @Lookup for a fresh instance.
    ref: "concepts.md#injecting-a-prototype-into-a-singleton"

  - id: bean-scopes-063
    difficulty: advanced
    tags: [custom-scopes, get-contract]
    question: |
      In a custom Scope, what must Scope.get(name, objectFactory) do to honor the scope's
      identity semantics?
    options:
      - "Return the cached object for the current context if present, otherwise create it via objectFactory.getObject() and cache it under that context"
      - "Always call objectFactory.getObject() on every access so a brand-new object is produced each time, giving every lookup within the same context a distinct instance"
      - "Ignore the supplied objectFactory entirely and construct the target bean directly via reflection on its declared no-arg constructor, bypassing container post-processing"
      - "Return a lazily-initialized scoped proxy that wraps the objectFactory and defers all creation until the first method is invoked on it"
    answer: 0
    explanation: |
      get() must resolve the current conversation context (thread/tenant/etc.), return the
      cached instance if one exists, else create it via the supplied ObjectFactory (triggering
      full creation + init) and cache it. Returning a new object every time silently breaks
      scope identity.
    ref: "concepts.md#custom-scopes"

  - id: bean-scopes-064
    difficulty: expert
    tags: [custom-scopes, destruction-callback, leak]
    question: |
      Your custom Scope stores registerDestructionCallback runnables but never invokes them.
      What is the consequence, and which shipped scope shares this exact flaw?
    options:
      - "No consequence whatsoever; the container tracks every scoped bean and invokes their destruction callbacks on context close regardless, and no shipped scope has this issue"
      - "The context refuses to start and fails at refresh, because firing registered destruction callbacks is a mandatory part of the Scope contract that Spring validates eagerly"
      - "Only prototype-scoped beans nested inside that scope leak resources; any singletons in the scope are still reliably cleaned up by the container on shutdown"
      - "@PreDestroy/DisposableBean never run for beans in that scope, leaking resources; SimpleThreadScope has the same flaw (registers but never fires callbacks on thread return)"
    answer: 3
    explanation: |
      The scope owns firing of destruction callbacks when its conversation ends. If it never
      does, no destruction lifecycle runs and resources leak. SimpleThreadScope exhibits this:
      it does not clean up ThreadLocal state or fire callbacks when a pooled thread is returned.
    ref: "concepts.md#custom-scopes"

  - id: bean-scopes-065
    difficulty: advanced
    tags: [custom-scopes, registration-order]
    question: |
      A bean is defined with @Scope("tenant") but no Scope named "tenant" is registered. When
      and how does this fail?
    options:
      - "At compile time, because the annotation processor validates every @Scope name against the set of scopes registered in the configuration classes"
      - "When the bean is first requested, with IllegalStateException: No Scope registered for scope name 'tenant'"
      - "At context refresh, which aborts with a duplicate bean-definition error because the unresolved scope name collides with the reserved built-in scope registry"
      - "Never; Spring silently defaults any unknown or unregistered scope name back to singleton and logs only a debug-level warning"
    answer: 1
    explanation: |
      Custom scopes must be registered (registerScope/CustomScopeConfigurer) before use. An
      unregistered scope name is only detected when the container tries to resolve the bean,
      throwing IllegalStateException: No Scope registered for scope name '...'.
    ref: "concepts.md#custom-scopes"

  - id: bean-scopes-066
    difficulty: advanced
    tags: [custom-scopes, configurer, bean-factory-post-processor]
    question: |
      Why is CustomScopeConfigurer implemented as a BeanFactoryPostProcessor rather than an
      ordinary bean?
    options:
      - "So it can rewrite the bytecode of scoped bean classes at load time to inject the scope-resolution logic directly into their compiled methods"
      - "Because only beans implementing BeanFactoryPostProcessor are permitted to be prototype-scoped, and custom scope registration must itself run in a prototype"
      - "So the configurer is lazy-initialized by default and its scope registrations are deferred until the first scoped bean is actually requested"
      - "So scopes are registered during the post-processing phase, before singleton pre-instantiation, ensuring scope names are known when scoped definitions are resolved"
    answer: 3
    explanation: |
      Scope registration must happen before beans that use those scopes are instantiated.
      Running as a BeanFactoryPostProcessor places registration in the early post-processing
      phase, before preInstantiateSingletons, so the scope name is available when needed.
    ref: "concepts.md#custom-scopes"

  - id: bean-scopes-067
    difficulty: expert
    tags: [factorybean, scoped-proxy, edge-case]
    question: |
      You place <aop:scoped-proxy/> on a FactoryBean definition (a bean implementing
      FactoryBean<T>). What exactly gets scoped/proxied?
    options:
      - "The T object returned by FactoryBean.getObject(), while the underlying factory instance is left unproxied"
      - "Both the factory bean and the product it manufactures, scoped and proxied together in lockstep on every call"
      - "The FactoryBean itself, not the product of getObject()"
      - "Nothing at all; Spring rejects <aop:scoped-proxy/> on any FactoryBean definition with a configuration error at startup"
    answer: 2
    explanation: |
      The scoped-proxy directive applies to the FactoryBean bean definition itself, scoping the
      factory instance, not the T produced by getObject(). This is a subtle trap when you
      intended to scope the product.
    ref: "concepts.md#custom-scopes"

  - id: bean-scopes-068
    difficulty: advanced
    tags: [singleton, thread-safety, design]
    question: |
      A singleton service must maintain a per-invocation running total across several private
      helper methods. Which design is both correct and idiomatic under concurrency?
    options:
      - "Store the running total in a mutable instance field and synchronize every public method so a single lock serializes all concurrent callers"
      - "Store the total in a local variable / parameter passed between the helper methods, keeping the singleton stateless"
      - "Store the running total in a static class-level field so all helper methods can read and update it without passing parameters around"
      - "Change the service to prototype scope so the container hands out a fresh instance with its own total at every injection point"
    answer: 1
    explanation: |
      Per-invocation state belongs on the thread stack: a local variable passed to helpers. The
      singleton stays stateless and inherently thread-safe with no locking. Instance/static
      fields would be shared across threads; prototype-scoping a service is usually the wrong
      hammer.
    ref: "concepts.md#singleton-thread-safety-responsibility"

  - id: bean-scopes-069
    difficulty: expert
    tags: [singleton, threadlocal, thread-safety]
    question: |
      A singleton legitimately needs per-thread mutable context and uses a ThreadLocal field.
      In a servlet container with a request-handling thread pool, what is the key risk?
    options:
      - "Stale/leaked values: because threads are reused from the pool, a value set in one request may persist into a later unrelated request unless explicitly removed"
      - "ThreadLocal fields are strictly forbidden inside singleton beans and the container throws an IllegalStateException when it detects one during wiring"
      - "Each incoming request is always assigned a brand-new, freshly created thread, so any per-thread state is discarded automatically and no cleanup is ever needed"
      - "Spring installs a request filter that automatically calls remove() on every ThreadLocal in the application at the end of each request, so leaks cannot occur"
    answer: 0
    explanation: |
      Pooled threads are reused, so a ThreadLocal not cleared (remove()) at request end leaks
      into the next task on that thread, causing cross-request data bleed and memory retention.
      This is the same class of hazard behind SimpleThreadScope's lack of pool cleanup.
    ref: "concepts.md#singleton-thread-safety-responsibility"

  - id: bean-scopes-070
    difficulty: advanced
    tags: [scoped-proxy, aop, ordering]
    question: |
      A request-scoped bean is both @Transactional and injected via a scoped proxy into a
      singleton. How do the proxies compose on a method call?
    options:
      - "The injection-point scoped proxy resolves the current request's target first, then that target's own transactional advice applies on the call"
      - "Only a single proxy is ever permitted per bean, so the scoped proxy wins and the @Transactional advice is silently ignored on every call"
      - "The transactional proxy takes over scope resolution itself, and the separate scoped proxy is discarded as redundant during context startup"
      - "It throws a BeanCreationException at startup, because a single bean definition cannot legally carry both a scoped proxy and a transactional proxy"
    answer: 0
    explanation: |
      The scoped proxy sits at the injection point and resolves the per-request target; the
      resolved target is itself an AOP proxy carrying transactional advice, which then applies.
      The two proxy layers stack rather than conflict.
    ref: "concepts.md#injecting-a-prototype-into-a-singleton"

  - id: bean-scopes-071
    difficulty: advanced
    tags: [singleton, circular-reference, three-level-cache]
    question: |
      A setter/field circular reference between two singletons is resolved by exposing an early
      object reference before initialization completes. Which three internal caches implement
      this mechanism in DefaultSingletonBeanRegistry?
    options:
      - "beanDefinitionMap, mergedBeanDefinitions, aliasMap"
      - "singletonObjects, earlySingletonObjects, singletonFactories"
      - "primaryCache, secondaryCache, tertiaryCache"
      - "resolvableDependencies, scopes, disposableBeans"
    answer: 1
    explanation: |
      Spring's three-level cache is singletonObjects (fully initialized), earlySingletonObjects
      (early reference), and singletonFactories (factory that can produce the early reference,
      e.g. an early AOP proxy). It lets a not-yet-initialized singleton be exposed to satisfy a
      setter/field cycle; constructor cycles cannot use it and throw
      BeanCurrentlyInCreationException.
    ref: "concepts.md#singleton-scope"

  - id: bean-scopes-072
    difficulty: expert
    tags: [prototype, circular-reference]
    question: |
      Two prototype beans P and Q depend on each other (field injection). What happens when P
      is requested?
    options:
      - "Resolved cleanly via the same three-level early-reference cache Spring uses for singletons, exposing a half-built P to satisfy Q's dependency"
      - "Succeeds by having P and Q each share a single reused instance, since Spring caches the first prototype of each type to close the cycle"
      - "Fails with BeanCurrentlyInCreationException, because Spring cannot cache a half-built prototype to expose an early reference"
      - "Spring silently converts both prototype definitions to singleton scope so the early-reference cache can resolve the circular dependency"
    answer: 2
    explanation: |
      The early-reference cache is a singleton mechanism. Prototypes are never cached
      mid-construction, so a prototype-to-prototype circular reference cannot be resolved and
      throws BeanCurrentlyInCreationException regardless of constructor vs field injection.
    ref: "concepts.md#prototype-scope"

  - id: bean-scopes-073
    difficulty: expert
    tags: [scoped-proxy, private-method, npe]
    question: |
      A TARGET_CLASS scoped proxy is created for a session bean. Some framework code invokes a
      final method on the proxy that reads an instance field. Why might this NPE?
    options:
      - "Because CGLIB cannot override final methods, so the call hits the proxy's own shell (target not resolved), reading an uninitialized field"
      - "Because final methods are intercepted by CGLIB advice and always coerced to return null whenever the backing field is unset"
      - "Because session-scoped beans are created with all their instance fields left null until the first HTTP request binds them"
      - "Because the CGLIB proxy is deliberately designed to throw a NullPointerException on any direct field read to force method access"
    answer: 0
    explanation: |
      CGLIB cannot override final/private/static methods, so such a call executes on the proxy
      subclass shell without resolving/delegating to the real target. The shell's fields are
      never populated, so reading them yields null and can NPE. Interception only covers
      overridable methods.
    ref: "concepts.md#injecting-a-prototype-into-a-singleton"

  - id: bean-scopes-074
    difficulty: advanced
    tags: [web-scopes, request, getbean-vs-proxy]
    question: |
      Within an active request, calling context.getBean(MyRequestBean.class) twice returns what?
    options:
      - "Two different instances each call, because getBean bypasses the request cache and re-instantiates like a prototype"
      - "The same instance for that request (request scope caches per request); a new instance only appears in a different request"
      - "The CGLIB scoped proxy object both times, never the resolved per-request target instance behind it"
      - "One process-wide singleton shared across every request thread for the entire life of the context"
    answer: 1
    explanation: |
      Request scope caches one instance per HTTP request. Repeated lookups within the same
      request return that cached instance; a new instance is created only for a different
      request. It is not prototype-like within a single request.
    ref: "concepts.md#web-scopes-request-session-application-websocket"

  - id: bean-scopes-075
    difficulty: expert
    tags: [web-scopes, injected-request, proxy]
    question: |
      A singleton bean directly injects `HttpServletRequest request;` by type in a
      WebApplicationContext and stores it in a field. Why is this safe despite the singleton
      outliving any single request?
    options:
      - "Spring re-copies the current thread-bound request into the singleton's field at the start of every method invocation"
      - "It is not safe at all; this by-type injection throws an UnsatisfiedDependencyException during context startup"
      - "Spring injects a proxy for HttpServletRequest that delegates to the current thread-bound request, so the stored reference always resolves correctly"
      - "HttpServletRequest is itself a container-managed singleton in Spring, so a single shared instance serves every request"
    answer: 2
    explanation: |
      A WebApplicationContext injects a PROXY for request/response/session/WebRequest that
      resolves to the current thread-bound instance on each access. So a singleton can safely
      hold the reference; each method call routes to the right per-request object.
    ref: "concepts.md#web-scopes-request-session-application-websocket"

  - id: bean-scopes-076
    difficulty: advanced
    tags: [prototype, objectprovider, cleanup, pattern]
    question: |
      You need a fresh prototype per operation AND deterministic resource cleanup. Which
      pattern best achieves both?
    options:
      - "Inject the prototype via a scoped proxy and rely on its @PreDestroy firing when the context closes"
      - "Use plain @Autowired for the single injected instance and call a reset() method to clear state between operations"
      - "Inject ObjectProvider<T>, call getObject() per operation, and release the resource in a try/finally (or try-with-resources) since the container won't"
      - "Make the bean a singleton and synchronize every operation so a global lock serializes access to its resource"
    answer: 2
    explanation: |
      ObjectProvider gives a fresh prototype per getObject() call, and because the container
      never invokes prototype destruction callbacks, the client wraps usage in try/finally or
      try-with-resources to release resources deterministically. A scoped proxy would still
      leave cleanup unhandled.
    ref: "concepts.md#injecting-a-prototype-into-a-singleton"

  - id: bean-scopes-077
    difficulty: expert
    tags: [singleton, destruction-order, dependency]
    question: |
      Singleton A is injected into singleton B (B depends on A). During context shutdown, what
      is the destruction order and why does it matter?
    options:
      - "A destroyed before B, following creation order, so B's @PreDestroy may fail touching an already-torn-down A"
      - "Destruction order is nondeterministic across a shutdown, so @PreDestroy callbacks must never reference any collaborator"
      - "B destroyed before A, so B can still safely use A in its @PreDestroy; Spring destroys dependents before their dependencies"
      - "Both are destroyed concurrently on separate shutdown threads, with no ordering guarantee between the two beans"
    answer: 2
    explanation: |
      Spring destroys beans in reverse initialization order, honoring dependencies: the
      dependent (B) is destroyed before the dependency (A). This lets B's @PreDestroy safely
      use A. The reverse would risk using an already-torn-down collaborator.
    ref: "concepts.md#singleton-scope"

  - id: bean-scopes-078
    difficulty: advanced
    tags: [websocket, scope, proxy]
    question: |
      Which statement about websocket scope in Spring Framework is accurate?
    options:
      - "There is a composed @WebSocketScope shortcut, directly analogous to @RequestScope, that presets proxyMode = TARGET_CLASS"
      - "It behaves identically to application scope, binding one shared instance to the ServletContext for the whole app"
      - "It has no dedicated shortcut annotation, is bound to a WebSocket session, and is typically declared with proxyMode = TARGET_CLASS since it is injected into longer-lived beans; it applies to STOMP-over-WebSocket apps"
      - "It works in any plain non-web ApplicationContext without a web-aware context or servlet support"
    answer: 2
    explanation: |
      Unlike request/session/application, websocket scope has no composed shortcut annotation.
      It binds to a WebSocket session's attributes, needs a scoped proxy (TARGET_CLASS) when
      injected into longer-lived beans, and applies to STOMP-over-WebSocket messaging apps in a
      web-aware context.
    ref: "concepts.md#web-scopes-request-session-application-websocket"
