topic: "Configuration, Profiles, and Externalized Properties"
domain: spring-core
topic_slug: configuration-profiles-properties
version: 1
questions:
  - id: configuration-profiles-properties-001
    difficulty: beginner
    tags: [configuration, bean, java-config]
    question: |
      In a Java-based Spring configuration, what determines the name of a bean
      declared with a plain @Bean method?
    options:
      - "The fully qualified class name of the return type"
      - "A random UUID assigned by the container"
      - "The name of the @Bean method"
      - "The name of the enclosing @Configuration class"
    answer: 2
    explanation: |
      By default the @Bean method name becomes the bean name and the method's
      return value is the registered bean instance. You can override it with
      the @Bean(name=...) attribute.
    ref: "concepts.md#configuration-and-bean"

  - id: configuration-profiles-properties-002
    difficulty: beginner
    tags: [configuration, annotations]
    question: |
      What is the primary purpose of the @Configuration annotation?
    options:
      - "It schedules a class for periodic execution"
      - "It exposes a class as a REST controller"
      - "It marks a class as read-only at runtime"
      - "It marks a class as a source of bean definitions for the container"
    answer: 3
    explanation: |
      @Configuration designates a class whose @Bean methods define beans
      managed by the Spring container.
    ref: "concepts.md#configuration-and-bean"

  - id: configuration-profiles-properties-003
    difficulty: intermediate
    tags: [configuration, cglib, proxy, singleton]
    question: |
      With the default @Configuration (proxyBeanMethods = true), what happens
      when one @Bean method directly calls another @Bean method in the same class?
    options:
      - "A new instance is created on every call, bypassing the container"
      - "A CGLIB proxy intercepts the call and returns the container-managed singleton"
      - "The call throws an IllegalStateException at runtime"
      - "The call is ignored and null is returned"
    answer: 1
    explanation: |
      A full @Configuration class is enhanced with a CGLIB subclass that
      intercepts inter-bean method calls so they return the existing managed
      singleton instead of re-executing the method body.
    ref: "concepts.md#configuration-and-bean"

  - id: configuration-profiles-properties-004
    difficulty: intermediate
    tags: [configuration, proxybeanmethods, lite-mode]
    question: |
      What is a consequence of declaring @Bean methods with
      @Configuration(proxyBeanMethods = false) or in a plain @Component ("lite" mode)?
    options:
      - "Beans can no longer be singletons under any circumstance"
      - "Direct calls between @Bean methods are NOT intercepted, so they run the method again instead of returning the managed singleton"
      - "The @Bean methods are ignored entirely"
      - "The container refuses to start"
    answer: 1
    explanation: |
      Without CGLIB enhancement there is no interception, so a direct call to
      another @Bean method executes the method body again rather than returning
      the container-managed bean. proxyBeanMethods=false is a startup
      optimization for configs with no inter-bean calls.
    ref: "concepts.md#configuration-and-bean"

  - id: configuration-profiles-properties-005
    difficulty: beginner
    tags: [configuration, bootstrap, application-context]
    question: |
      Which class bootstraps the core Spring container from an annotated
      @Configuration class?
    options:
      - "ClassPathXmlApplicationContext"
      - "AnnotationConfigApplicationContext"
      - "FileSystemResourceLoader"
      - "SpringApplication"
    answer: 1
    explanation: |
      AnnotationConfigApplicationContext accepts @Configuration classes (or
      packages to scan). SpringApplication is a Spring Boot construct, not core
      framework.
    ref: "concepts.md#configuration-and-bean"

  - id: configuration-profiles-properties-006
    difficulty: intermediate
    tags: [configuration, bean, destroy-method]
    question: |
      By default, what does @Bean do about destroy callbacks?
    options:
      - "It auto-detects a public close() or shutdown() method and calls it on shutdown"
      - "It never calls any destroy method"
      - "It calls a method literally named destroy() only"
      - "It calls finalize() on the bean"
    answer: 0
    explanation: |
      @Bean's destroyMethod defaults to auto-detecting a public close() or
      shutdown() method. Set destroyMethod = "" to disable this inference.
    ref: "concepts.md#configuration-and-bean"

  - id: configuration-profiles-properties-007
    difficulty: intermediate
    tags: [configuration, bean, dependency-injection]
    question: |
      What is the idiomatic way for a @Bean method to obtain a bean defined in
      another @Configuration class?
    options:
      - "Declare it as a parameter of the @Bean method so the container autowires it"
      - "Use new to construct it directly"
      - "Read it from a static field"
      - "It is impossible to reference beans across configuration classes"
    answer: 0
    explanation: |
      @Bean method parameters are autowired by the container (by type), which
      is the clean way to reference beans from other configuration classes.
    ref: "concepts.md#configuration-and-bean"

  - id: configuration-profiles-properties-008
    difficulty: beginner
    tags: [propertysource, annotations]
    question: |
      What does @PropertySource do?
    options:
      - "Creates a new database connection pool"
      - "Registers a REST endpoint"
      - "Adds a properties file to the Environment's set of PropertySources"
      - "Enables component scanning"
    answer: 2
    explanation: |
      @PropertySource, declared on a @Configuration class, contributes a
      properties file to the Environment so its keys become resolvable.
    ref: "concepts.md#propertysource-annotation"

  - id: configuration-profiles-properties-009
    difficulty: intermediate
    tags: [propertysource, yaml, limitations]
    question: |
      Out of the box, can @PropertySource load a .yml/.yaml file in core Spring
      Framework?
    options:
      - "Yes, YAML is fully supported by default"
      - "No; it supports .properties files, and YAML requires a custom PropertySourceFactory"
      - "Yes, but only in web applications"
      - "No, @PropertySource cannot load any external file"
    answer: 1
    explanation: |
      Core @PropertySource understands .properties (and XML properties) files.
      Loading YAML requires supplying a custom PropertySourceFactory. Built-in
      application.yml handling is a Spring Boot feature.
    ref: "concepts.md#propertysource-annotation"

  - id: configuration-profiles-properties-010
    difficulty: intermediate
    tags: [propertysource, ignore-not-found]
    question: |
      By default, what happens if the resource referenced by @PropertySource
      does not exist?
    options:
      - "The context silently ignores it"
      - "An exception is thrown during context startup"
      - "The application waits until the file appears"
      - "A blank file is created automatically"
    answer: 1
    explanation: |
      A missing @PropertySource resource throws by default. Set
      ignoreResourceNotFound = true to make the file optional.
    ref: "concepts.md#propertysource-annotation"

  - id: configuration-profiles-properties-011
    difficulty: intermediate
    tags: [propertysource, placeholders]
    question: |
      What does @PropertySource("classpath:${env.name}.properties") demonstrate?
    options:
      - "That the location string can contain placeholders resolved against already-registered sources"
      - "That @PropertySource can only use absolute paths"
      - "That YAML is being loaded"
      - "That the file will be created if missing"
    answer: 0
    explanation: |
      The resource location supports ${...} placeholders resolved against
      property sources that are already present (e.g. system properties).
    ref: "concepts.md#propertysource-annotation"

  - id: configuration-profiles-properties-012
    difficulty: beginner
    tags: [propertysource, repeatable]
    question: |
      Since Java 8, @PropertySource is:
    options:
      - "Repeatable, so multiple can be placed on one configuration class"
      - "Allowed only once per entire application"
      - "Deprecated in favor of @Bean"
      - "Only usable on interfaces"
    answer: 0
    explanation: |
      @PropertySource is repeatable; you can declare several on one class (or
      use the @PropertySources container). Ordering affects which value wins.
    ref: "concepts.md#propertysource-annotation"

  - id: configuration-profiles-properties-013
    difficulty: beginner
    tags: [environment, abstraction]
    question: |
      The Spring Environment abstraction models which two aspects of an
      application's runtime configuration?
    options:
      - "Threads and memory"
      - "Profiles and properties"
      - "Controllers and views"
      - "Sessions and cookies"
    answer: 1
    explanation: |
      Environment represents the active/default profiles and the available
      properties (delegating to an ordered list of PropertySources).
    ref: "concepts.md#environment-abstraction"

  - id: configuration-profiles-properties-014
    difficulty: intermediate
    tags: [environment, precedence, property-source]
    question: |
      In a StandardEnvironment, which source is checked FIRST when resolving a
      property?
    options:
      - "OS environment variables (systemEnvironment)"
      - "JVM system properties (systemProperties)"
      - "Files added via @PropertySource"
      - "JNDI entries"
    answer: 1
    explanation: |
      For a StandardEnvironment, systemProperties (-D flags) take precedence
      over systemEnvironment (OS env vars); both precede @PropertySource files.
      First matching source wins.
    ref: "concepts.md#environment-abstraction"

  - id: configuration-profiles-properties-015
    difficulty: beginner
    tags: [environment, api]
    question: |
      Which Environment method returns null (rather than throwing) when a
      property key is absent?
    options:
      - "getRequiredProperty(String)"
      - "getProperty(String)"
      - "acceptsProfiles(...)"
      - "getActiveProfiles()"
    answer: 1
    explanation: |
      getProperty returns null for a missing key, while getRequiredProperty
      throws IllegalStateException when the key is not found.
    ref: "concepts.md#environment-abstraction"

  - id: configuration-profiles-properties-016
    difficulty: intermediate
    tags: [environment, required-property]
    question: |
      What does Environment.getRequiredProperty("db.url") do if the key is
      missing?
    options:
      - "Returns an empty string"
      - "Returns null"
      - "Throws IllegalStateException"
      - "Returns the string 'null'"
    answer: 2
    explanation: |
      getRequiredProperty throws IllegalStateException when the property is not
      present, unlike getProperty which returns null.
    ref: "concepts.md#environment-abstraction"

  - id: configuration-profiles-properties-017
    difficulty: intermediate
    tags: [environment, property-source, api]
    question: |
      A PropertySource<T> in Spring is best described as:
    options:
      - "A thread pool for property loading"
      - "A cache eviction policy"
      - "A servlet filter"
      - "A named source of key/value pairs (backed by a Map, Properties, env vars, etc.)"
    answer: 3
    explanation: |
      A PropertySource is a named abstraction over some key/value backing store.
      The Environment holds an ordered MutablePropertySources of them.
    ref: "concepts.md#environment-abstraction"

  - id: configuration-profiles-properties-018
    difficulty: intermediate
    tags: [environment, mutable-property-sources, override]
    question: |
      Programmatically, how can you make a custom map of properties take
      precedence over all existing sources?
    options:
      - "env.getPropertySources().addFirst(new MapPropertySource(...))"
      - "env.getPropertySources().addLast(new MapPropertySource(...))"
      - "You cannot change PropertySource ordering at runtime"
      - "Delete the systemProperties source"
    answer: 0
    explanation: |
      MutablePropertySources.addFirst(...) puts your source at the highest
      precedence position, so its keys are resolved before the others.
    ref: "concepts.md#environment-abstraction"

  - id: configuration-profiles-properties-019
    difficulty: beginner
    tags: [value, placeholder]
    question: |
      In @Value("${mail.host}"), the ${...} syntax denotes:
    options:
      - "A regular expression match"
      - "A SpEL expression evaluated by the SpEL engine"
      - "A property placeholder resolved against the Environment"
      - "A Java string template literal"
    answer: 2
    explanation: |
      ${...} is a property placeholder resolved by a
      PropertySourcesPlaceholderConfigurer against the Environment's sources.
    ref: "concepts.md#value-with-placeholders-and-defaults"

  - id: configuration-profiles-properties-020
    difficulty: beginner
    tags: [value, default]
    question: |
      What does @Value("${mail.port:25}") mean?
    options:
      - "Inject mail.port, or 25 if the property is not defined"
      - "Always inject 25"
      - "Inject mail.port only between 0 and 25"
      - "Multiply mail.port by 25"
    answer: 0
    explanation: |
      The colon separates the placeholder key from a default value: if
      mail.port is absent, 25 is used.
    ref: "concepts.md#value-with-placeholders-and-defaults"

  - id: configuration-profiles-properties-021
    difficulty: intermediate
    tags: [value, missing-property, exception]
    question: |
      What happens when @Value("${mail.host}") has no default and mail.host is
      not resolvable?
    options:
      - "The field is set to null silently"
      - "An IllegalArgumentException (could not resolve placeholder) is thrown during bean creation"
      - "The field is set to an empty string"
      - "The container skips creating the bean but logs nothing"
    answer: 1
    explanation: |
      Unresolvable placeholders without a default cause an
      IllegalArgumentException at bean creation, unless the placeholder
      configurer is set to ignore unresolvable placeholders.
    ref: "concepts.md#value-with-placeholders-and-defaults"

  - id: configuration-profiles-properties-022
    difficulty: intermediate
    tags: [value, spel, placeholder]
    question: |
      Which statement about ${...} versus #{...} in @Value is correct?
    options:
      - "They are the same mechanism with different syntax"
      - "${...} is a property placeholder; #{...} is a SpEL expression; they are independent and can be nested"
      - "#{...} is resolved against PropertySources; ${...} is SpEL"
      - "Both are evaluated only in Spring Boot"
    answer: 1
    explanation: |
      ${...} placeholders are resolved against the Environment, while #{...}
      is evaluated by SpEL. They can be nested, e.g. #{'${some.key}'.trim()}.
    ref: "concepts.md#value-with-placeholders-and-defaults"

  - id: configuration-profiles-properties-023
    difficulty: intermediate
    tags: [value, nesting, spel]
    question: |
      In @Value("#{'${app.name}'.toUpperCase()}"), what is the order of
      evaluation?
    options:
      - "SpEL runs first, then the placeholder is resolved"
      - "The ${app.name} placeholder is resolved first, then the SpEL expression runs on the resulting string"
      - "Both are evaluated simultaneously and merged"
      - "Neither is evaluated; the literal string is injected"
    answer: 1
    explanation: |
      Placeholder resolution happens first (producing a literal string), then
      the surrounding SpEL expression executes, e.g. calling toUpperCase().
    ref: "concepts.md#value-with-placeholders-and-defaults"

  - id: configuration-profiles-properties-024
    difficulty: beginner
    tags: [pspc, placeholder-configurer]
    question: |
      What kind of Spring component is PropertySourcesPlaceholderConfigurer?
    options:
      - "A BeanPostProcessor that proxies beans"
      - "An ApplicationListener for context events"
      - "A BeanFactoryPostProcessor that resolves ${...} placeholders"
      - "A servlet Filter"
    answer: 2
    explanation: |
      PSPC is a BeanFactoryPostProcessor that resolves ${...} placeholders in
      bean definitions and @Value annotations against the Environment.
    ref: "concepts.md#propertysourcesplaceholderconfigurer"

  - id: configuration-profiles-properties-025
    difficulty: intermediate
    tags: [pspc, static-bean, bean-factory-post-processor]
    question: |
      Why should the @Bean method that returns a
      PropertySourcesPlaceholderConfigurer be declared static?
    options:
      - "Static methods run faster"
      - "Because it is a BeanFactoryPostProcessor that must be instantiated very early, before the @Configuration class is enhanced/fully processed"
      - "Because non-static @Bean methods are not allowed in Spring"
      - "To make the bean prototype-scoped"
    answer: 1
    explanation: |
      As a BeanFactoryPostProcessor, PSPC is created early. A non-static method
      would force premature instantiation of the enclosing @Configuration class
      and prevent its proper CGLIB enhancement, so the method must be static.
    ref: "concepts.md#propertysourcesplaceholderconfigurer"

  - id: configuration-profiles-properties-026
    difficulty: intermediate
    tags: [pspc, auto-registration]
    question: |
      When you use annotation-based configuration, do you normally need to
      declare a PropertySourcesPlaceholderConfigurer manually for @Value("${...}")
      to work?
    options:
      - "Yes, always, or placeholders will never resolve"
      - "No, one is registered automatically; you declare one only to customize it"
      - "No, @Value never needs any configurer"
      - "Only in web applications"
    answer: 1
    explanation: |
      Annotation config (and <context:property-placeholder/>) auto-registers a
      PSPC, so @Value placeholders work out of the box. You declare one
      explicitly only to customize behavior such as null value or ignore-unresolvable.
    ref: "concepts.md#propertysourcesplaceholderconfigurer"

  - id: configuration-profiles-properties-027
    difficulty: intermediate
    tags: [pspc, legacy, comparison]
    question: |
      Compared to the legacy PropertyPlaceholderConfigurer, what does
      PropertySourcesPlaceholderConfigurer resolve placeholders against?
    options:
      - "Only its own local Properties object"
      - "The Environment's full set of PropertySources (system properties, env vars, @PropertySource files, etc.)"
      - "Only OS environment variables"
      - "Only files on the classpath named placeholder.properties"
    answer: 1
    explanation: |
      PSPC (Spring 3.1+) integrates with the Environment's PropertySources. The
      older PropertyPlaceholderConfigurer resolved only against its local
      Properties plus system props via systemPropertiesMode.
    ref: "concepts.md#propertysourcesplaceholderconfigurer"

  - id: configuration-profiles-properties-028
    difficulty: beginner
    tags: [profile, annotations]
    question: |
      What does the @Profile annotation do?
    options:
      - "Activates a profile automatically at startup"
      - "Measures method execution time"
      - "Conditionally registers a bean or configuration only when the named profile(s) are active"
      - "Defines a caching region"
    answer: 2
    explanation: |
      @Profile marks a bean/config as eligible for registration only when its
      profile expression matches the active profiles. It does not itself
      activate any profile.
    ref: "concepts.md#profile"

  - id: configuration-profiles-properties-029
    difficulty: beginner
    tags: [profile, activation, spring-profiles-active]
    question: |
      Which system property activates one or more profiles at startup?
    options:
      - "spring.active.profiles"
      - "spring.profiles.active"
      - "spring.profile.enable"
      - "profiles.spring.on"
    answer: 1
    explanation: |
      -Dspring.profiles.active=prod,us-east (comma-separated) activates
      profiles. The env var equivalent is SPRING_PROFILES_ACTIVE.
    ref: "concepts.md#profile"

  - id: configuration-profiles-properties-030
    difficulty: beginner
    tags: [profile, multiple, activation]
    question: |
      How do you activate multiple profiles via spring.profiles.active?
    options:
      - "Separate them with commas, e.g. prod,us-east"
      - "You can only ever activate one profile"
      - "Separate them with semicolons only"
      - "Wrap them in square brackets"
    answer: 0
    explanation: |
      Multiple active profiles are comma-separated; beans from every active
      profile are additively registered.
    ref: "concepts.md#profile"

  - id: configuration-profiles-properties-031
    difficulty: intermediate
    tags: [profile, expressions, operators]
    question: |
      Which @Profile expression registers a bean only when prod is active AND
      us-east is active?
    options:
      - "@Profile(\"prod, us-east\")"
      - "@Profile(\"prod & us-east\")"
      - "@Profile(\"prod | us-east\")"
      - "@Profile(\"!prod us-east\")"
    answer: 1
    explanation: |
      Spring 5.1+ supports profile expression operators: & (AND), | (OR), !
      (NOT), and parentheses. "prod & us-east" requires both to be active.
    ref: "concepts.md#profile"

  - id: configuration-profiles-properties-032
    difficulty: intermediate
    tags: [profile, negation]
    question: |
      What does @Profile("!prod") mean?
    options:
      - "The bean is registered only when the prod profile is NOT active"
      - "The bean is registered only when prod is active"
      - "The bean is never registered"
      - "It is a syntax error"
    answer: 0
    explanation: |
      The ! operator negates: the bean is eligible whenever the prod profile is
      not among the active profiles.
    ref: "concepts.md#profile"

  - id: configuration-profiles-properties-033
    difficulty: intermediate
    tags: [profile, no-profile, always-registered]
    question: |
      A bean that has NO @Profile annotation is:
    options:
      - "Registered only when the default profile is active"
      - "Registered regardless of which profiles are active"
      - "Never registered unless a profile is set"
      - "Registered only in web applications"
    answer: 1
    explanation: |
      Beans without any @Profile are always registered irrespective of the
      active profiles. @Profile only gates the annotated beans.
    ref: "concepts.md#profile"

  - id: configuration-profiles-properties-034
    difficulty: intermediate
    tags: [profile, programmatic, refresh]
    question: |
      When activating profiles programmatically on an
      AnnotationConfigApplicationContext, when must setActiveProfiles(...) be called?
    options:
      - "After refresh(), any time"
      - "Before refresh() (e.g. via getEnvironment().setActiveProfiles(...))"
      - "It cannot be done programmatically"
      - "Only inside a @Bean method"
    answer: 1
    explanation: |
      You set active profiles on the Environment before calling refresh(), so
      that profile conditions are evaluated with the intended profiles active.
    ref: "concepts.md#profile"

  - id: configuration-profiles-properties-035
    difficulty: intermediate
    tags: [profile, testing, active-profiles]
    question: |
      In the spring-test module, which annotation activates profiles for a test
      class?
    options:
      - "@ActiveProfiles"
      - "@TestProfile"
      - "@EnableProfiles"
      - "@ProfileTest"
    answer: 0
    explanation: |
      @ActiveProfiles("test") from spring-test sets the active profiles for the
      test's ApplicationContext.
    ref: "concepts.md#profile"

  - id: configuration-profiles-properties-036
    difficulty: beginner
    tags: [default-profile, definition]
    question: |
      What is the name of the default profile in Spring if it is not changed?
    options:
      - "main"
      - "default"
      - "base"
      - "none"
    answer: 1
    explanation: |
      The default profile is named "default"; getDefaultProfiles() returns
      {"default"} unless overridden via spring.profiles.default.
    ref: "concepts.md#default-profile"

  - id: configuration-profiles-properties-037
    difficulty: intermediate
    tags: [default-profile, activation]
    question: |
      A bean annotated @Profile("default") is registered:
    options:
      - "Always, no matter what"
      - "Only when no other profile has been activated"
      - "Only when the prod profile is active"
      - "Never"
    answer: 1
    explanation: |
      @Profile("default") beans are used only when no active profile is set.
      Activating any profile removes "default" from effect and skips them.
    ref: "concepts.md#default-profile"

  - id: configuration-profiles-properties-038
    difficulty: intermediate
    tags: [default-profile, override, property]
    question: |
      Which setting changes the NAME of the default profile?
    options:
      - "spring.profiles.active"
      - "spring.profiles.default"
      - "spring.profiles.include"
      - "spring.default.profile.name"
    answer: 1
    explanation: |
      spring.profiles.default (system property/env var) or
      ConfigurableEnvironment.setDefaultProfiles(...) changes the default
      profile name. spring.profiles.active sets ACTIVE profiles instead.
    ref: "concepts.md#default-profile"

  - id: configuration-profiles-properties-039
    difficulty: intermediate
    tags: [default-profile, active-profile, distinction]
    question: |
      What is the key distinction between "active" and "default" profiles?
    options:
      - "Active profiles are always ignored; default profiles always win"
      - "Default profiles apply only when no active profiles are set; active profiles are the ones explicitly switched on"
      - "They are two names for the same thing"
      - "Default profiles can only be set in tests"
    answer: 1
    explanation: |
      Default profiles serve as a fallback used only when no active profile is
      configured; active profiles are those explicitly enabled via
      spring.profiles.active, setActiveProfiles, or @ActiveProfiles.
    ref: "concepts.md#default-profile"

  - id: configuration-profiles-properties-040
    difficulty: beginner
    tags: [profile, config-class]
    question: |
      Can @Profile be placed on an entire @Configuration class?
    options:
      - "No, it is only valid on fields"
      - "No, it is only valid on @Bean methods"
      - "Yes, and it then gates all beans defined in that class"
      - "Yes, but it has no effect on the beans inside"
    answer: 2
    explanation: |
      @Profile can annotate a @Bean method, a @Component, or a whole
      @Configuration class; on a class it conditions all contained beans.
    ref: "concepts.md#profile"

  - id: configuration-profiles-properties-041
    difficulty: intermediate
    tags: [environment, type-conversion]
    question: |
      How does Environment.getProperty("timeout", Integer.class) convert the
      value?
    options:
      - "It uses the Environment's ConversionService to convert the String to the target type"
      - "It always returns null for non-String types"
      - "It parses using reflection on the caller class"
      - "It requires the property to already be an Integer object"
    answer: 0
    explanation: |
      The typed getProperty overload converts the raw String using the
      Environment's ConversionService (a DefaultConversionService by default).
    ref: "concepts.md#environment-abstraction"

  - id: configuration-profiles-properties-042
    difficulty: intermediate
    tags: [propertysource, precedence, last-wins]
    question: |
      If two @PropertySource entries in the same set both define app.timeout,
      which value is used?
    options:
      - "The one from the first-listed @PropertySource"
      - "The one from the last-listed @PropertySource"
      - "The values are concatenated"
      - "Startup fails due to a duplicate key"
    answer: 1
    explanation: |
      For a given @PropertySource set, later declarations override earlier ones
      for the same key, so the last-listed source wins.
    ref: "concepts.md#propertysource-annotation"

  - id: configuration-profiles-properties-043
    difficulty: beginner
    tags: [environment, injection]
    question: |
      How can a bean obtain the Environment in Java configuration?
    options:
      - "By injecting it with @Autowired Environment env"
      - "Only through a static factory"
      - "By extending EnvironmentAware is impossible in Java config"
      - "The Environment is never accessible to beans"
    answer: 0
    explanation: |
      The Environment is a container-managed bean; @Autowired Environment env
      injects it. You can also implement EnvironmentAware or call
      ctx.getEnvironment().
    ref: "concepts.md#environment-abstraction"

  - id: configuration-profiles-properties-044
    difficulty: intermediate
    tags: [pspc, null-value]
    question: |
      What does PropertySourcesPlaceholderConfigurer.setNullValue("@null")
      configure?
    options:
      - "A token string that, when resolved, is treated as a null injected value"
      - "The default value for all placeholders"
      - "A profile name"
      - "The encoding used to read files"
    answer: 0
    explanation: |
      setNullValue defines a sentinel token; when a placeholder resolves to
      that token, the injected value becomes null instead of the literal string.
    ref: "concepts.md#propertysourcesplaceholderconfigurer"

  - id: configuration-profiles-properties-045
    difficulty: intermediate
    tags: [configuration, import, composition]
    question: |
      Which annotation lets one @Configuration class pull in the bean
      definitions of another?
    options:
      - "@Inject"
      - "@Lookup"
      - "@Autowired"
      - "@Import"
    answer: 3
    explanation: |
      @Import(OtherConfig.class) composes configuration classes so their beans
      are registered together. @Autowired/@Inject are for dependency injection,
      not config composition.
    ref: "concepts.md#configuration-and-bean"
