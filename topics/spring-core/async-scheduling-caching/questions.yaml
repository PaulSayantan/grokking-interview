topic: "Asynchronous, Scheduled, and Caching Support"
domain: spring-core
topic_slug: async-scheduling-caching
version: 1
questions:
  - id: async-scheduling-caching-001
    difficulty: beginner
    tags: [async, enable-async]
    question: |
      Which annotation must be present on a @Configuration class to activate
      processing of @Async annotations in a plain Spring Framework application?
    options:
      - "@EnableExecutor"
      - "@EnableAsync"
      - "@EnableScheduling"
      - "@AsyncSupport"
    answer: 1
    explanation: |
      @Async methods are only intercepted when @EnableAsync is present on a
      configuration class. Without it, Spring registers no async post-processor
      and the annotated methods simply run synchronously on the caller's thread.
    ref: "concepts.md#enabling-asynchronous-execution-with-enableasync-and-async"
  - id: async-scheduling-caching-002
    difficulty: beginner
    tags: [async, behavior]
    question: |
      What is the primary effect of calling a properly configured @Async method?
    options:
      - "The method's result is cached so that all subsequent calls are skipped entirely"
      - "The method runs twice, once synchronously and once asynchronously"
      - "The caller thread blocks until the method finishes on a background thread"
      - "The method runs on a separate thread and control returns to the caller immediately"
    answer: 3
    explanation: |
      @Async submits the invocation to a TaskExecutor and returns to the caller
      right away, so the work happens on a different thread without blocking the
      caller.
    ref: "concepts.md#enabling-asynchronous-execution-with-enableasync-and-async"
  - id: async-scheduling-caching-003
    difficulty: beginner
    tags: [async, executor]
    question: |
      On what does an @Async method execute?
    options:
      - "A dedicated JVM finalizer thread for cleanup"
      - "The main application bootstrap thread"
      - "A TaskExecutor (Spring's Executor abstraction)"
      - "The JVM's background garbage-collector thread"
    answer: 2
    explanation: |
      @Async work is dispatched to a Spring TaskExecutor. If you do not define
      one, Spring falls back to a SimpleAsyncTaskExecutor by default.
    ref: "concepts.md#configuring-the-taskexecutor-for-async"
  - id: async-scheduling-caching-004
    difficulty: intermediate
    tags: [async, return-types, void]
    question: |
      For a @Async method that returns void, how are exceptions thrown inside
      the method surfaced?
    options:
      - "They are wrapped in a returned Future object that the caller can later inspect"
      - "They are rethrown synchronously on the caller's own thread the moment they occur"
      - "They silently terminate the entire application by shutting down the JVM process"
      - "They are routed to an AsyncUncaughtExceptionHandler (default just logs them); the caller never sees them"
    answer: 3
    explanation: |
      A void @Async method cannot propagate exceptions to the caller because the
      caller already returned. Spring hands such exceptions to an
      AsyncUncaughtExceptionHandler, which by default logs them.
    ref: "concepts.md#async-return-types-void-future-and-completablefuture"
  - id: async-scheduling-caching-005
    difficulty: intermediate
    tags: [async, return-types, future]
    question: |
      For an @Async method returning Future<T>, when does an exception thrown in
      the method body reach the caller?
    options:
      - "Immediately when the method is called"
      - "Only after the application context is closed"
      - "When the caller invokes future.get()"
      - "Never; Future methods cannot throw"
    answer: 2
    explanation: |
      With a Future/CompletableFuture return type, the exception is captured and
      re-thrown (wrapped) when the caller calls get(), giving the caller a chance
      to observe failures.
    ref: "concepts.md#async-return-types-void-future-and-completablefuture"
  - id: async-scheduling-caching-006
    difficulty: intermediate
    tags: [async, completablefuture]
    question: |
      Which return type is the recommended modern choice for an @Async method
      that needs to support non-blocking composition of the result?
    options:
      - "void"
      - "Callable<T>"
      - "CompletableFuture<T>"
      - "Optional<T>"
    answer: 2
    explanation: |
      CompletableFuture supports composition operators such as thenApply and
      thenCompose and is the preferred type in modern Spring. ListenableFuture is
      deprecated in Spring 6 in its favor.
    ref: "concepts.md#async-return-types-void-future-and-completablefuture"
  - id: async-scheduling-caching-007
    difficulty: beginner
    tags: [async, return-types]
    question: |
      Which of these is NOT a valid return type for an @Async method?
    options:
      - "void (the method returns no value to the caller)"
      - "Future<String> (a classic java.util.concurrent Future)"
      - "CompletableFuture<String> (a composable async result)"
      - "A plain String (returned directly, not wrapped in a Future)"
    answer: 3
    explanation: |
      @Async methods must return void or a Future subtype. A directly returned
      value type such as String is not supported and causes an error at proxy
      time, because there is no way to hand a plain synchronous value back after
      returning immediately.
    ref: "concepts.md#async-return-types-void-future-and-completablefuture"
  - id: async-scheduling-caching-008
    difficulty: intermediate
    tags: [async, executor, default]
    question: |
      In Spring 6, if no TaskExecutor or bean named "taskExecutor" is defined,
      what does @Async use by default?
    options:
      - "A SimpleAsyncTaskExecutor, which by default creates a new thread per task and does not pool them"
      - "A fixed thread pool sized at exactly 10 reusable worker threads"
      - "Nothing at all; the annotated method just runs synchronously on the caller"
      - "The JVM-wide common ForkJoinPool shared with parallel streams"
    answer: 0
    explanation: |
      When no suitable executor bean is found, Spring falls back to a
      SimpleAsyncTaskExecutor. By default it does not reuse or bound threads
      (a new thread per task), so production code should define a real pool.
    ref: "concepts.md#configuring-the-taskexecutor-for-async"
  - id: async-scheduling-caching-009
    difficulty: intermediate
    tags: [async, executor, configuration]
    question: |
      Which interface do you implement to customize the executor and the
      uncaught-exception handler used by @Async?
    options:
      - "AsyncConfigurer"
      - "AsyncCustomizer"
      - "ExecutorConfigurer"
      - "TaskExecutorFactory"
    answer: 0
    explanation: |
      Implementing AsyncConfigurer lets you override getAsyncExecutor() and
      getAsyncUncaughtExceptionHandler() to plug in your own thread pool and
      exception handling.
    ref: "concepts.md#configuring-the-taskexecutor-for-async"
  - id: async-scheduling-caching-010
    difficulty: intermediate
    tags: [async, threadpooltaskexecutor, sizing]
    question: |
      For a ThreadPoolTaskExecutor with corePoolSize=2, queueCapacity=10, and
      maxPoolSize=5, when are threads created beyond the 2 core threads?
    options:
      - "Never; maxPoolSize is ignored when a queue is set"
      - "Only after the queue of 10 is full, up to maxPoolSize=5"
      - "Immediately for every submitted task until 5 threads exist"
      - "Only when the application context is refreshed"
    answer: 1
    explanation: |
      Like java.util.concurrent.ThreadPoolExecutor, tasks first fill core threads,
      then queue up to queueCapacity, and only when the queue is full are extra
      threads created up to maxPoolSize.
    ref: "concepts.md#configuring-the-taskexecutor-for-async"
  - id: async-scheduling-caching-011
    difficulty: intermediate
    tags: [async, named-executor]
    question: |
      What does @Async("emailExecutor") accomplish?
    options:
      - "It delays execution by the value of the emailExecutor property"
      - "It routes this method's execution to the TaskExecutor bean named emailExecutor"
      - "It disables async for methods except emailExecutor"
      - "It names the async thread emailExecutor for logging only"
    answer: 1
    explanation: |
      The value attribute of @Async names a specific executor bean, letting
      different methods use different thread pools.
    ref: "concepts.md#enabling-asynchronous-execution-with-enableasync-and-async"
  - id: async-scheduling-caching-012
    difficulty: beginner
    tags: [scheduling, enable-scheduling]
    question: |
      Which annotation enables detection and execution of @Scheduled methods?
    options:
      - "@EnableAsync"
      - "@EnableTasks"
      - "@ScheduledSupport"
      - "@EnableScheduling"
    answer: 3
    explanation: |
      @EnableScheduling registers the ScheduledAnnotationBeanPostProcessor that
      finds @Scheduled methods and registers them with a TaskScheduler.
    ref: "concepts.md#enabling-scheduling-with-enablescheduling-and-scheduled"
  - id: async-scheduling-caching-013
    difficulty: intermediate
    tags: [scheduling, method-signature]
    question: |
      What are the signature constraints for a classic @Scheduled method?
    options:
      - "It must take a single Date argument"
      - "It must be static and public"
      - "It must take no arguments and return void"
      - "It must return a boolean indicating success"
    answer: 2
    explanation: |
      A @Scheduled method cannot accept parameters (the scheduler has nothing to
      pass) and its return value is not observed (void). Since Spring 6.1 a
      CompletableFuture/reactive return is allowed for one-shot reactive tasks,
      but classic tasks are void and argument-free.
    ref: "concepts.md#enabling-scheduling-with-enablescheduling-and-scheduled"
  - id: async-scheduling-caching-014
    difficulty: intermediate
    tags: [scheduling, task-scheduler, threads]
    question: |
      By default, how many threads does Spring's scheduler use to run @Scheduled
      tasks, and what is the consequence?
    options:
      - "A single thread, so a long-running task can delay other scheduled tasks"
      - "As many threads as available CPU cores, auto-detected at context startup"
      - "One thread per task, so tasks never delay each other"
      - "Exactly ten pooled threads regardless of the number of scheduled tasks"
    answer: 0
    explanation: |
      The default TaskScheduler is single-threaded, so all scheduled tasks share
      one thread and an overrunning task can delay the others. Define a
      ThreadPoolTaskScheduler with a larger pool to parallelize.
    ref: "concepts.md#enabling-scheduling-with-enablescheduling-and-scheduled"
  - id: async-scheduling-caching-015
    difficulty: beginner
    tags: [scheduling, fixed-rate, fixed-delay]
    question: |
      From which point in time does fixedRate measure the interval to the next
      execution?
    options:
      - "From the start of the previous execution"
      - "From midnight at the start of the current calendar day"
      - "From application startup only, once at the very first run"
      - "From the end of the previous execution"
    answer: 0
    explanation: |
      fixedRate schedules the next run a fixed number of milliseconds after the
      previous run began, giving a fixed frequency independent of execution time.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"
  - id: async-scheduling-caching-016
    difficulty: beginner
    tags: [scheduling, fixed-delay]
    question: |
      From which point does fixedDelay measure the interval to the next execution?
    options:
      - "From the next matching scheduled cron boundary time"
      - "From the JVM launch time, fixed at process start"
      - "From the start of the previous execution"
      - "From the end (completion) of the previous execution"
    answer: 3
    explanation: |
      fixedDelay schedules the next run a fixed number of milliseconds after the
      previous run finishes, guaranteeing a gap between consecutive executions.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"
  - id: async-scheduling-caching-017
    difficulty: intermediate
    tags: [scheduling, fixed-rate, fixed-delay, scenario]
    question: |
      A task takes about 7 seconds to run. Which configuration guarantees at
      least a 5-second gap between the end of one run and the start of the next?
    options:
      - "initialDelay = 5000 with no other attribute"
      - "cron = \"*/5 * * * * *\""
      - "fixedRate = 5000"
      - "fixedDelay = 5000"
    answer: 3
    explanation: |
      fixedDelay measures from completion, so it always leaves the specified gap
      after the previous run ends regardless of execution time. fixedRate measures
      from the start and would not guarantee that gap.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"
  - id: async-scheduling-caching-018
    difficulty: beginner
    tags: [scheduling, initial-delay]
    question: |
      What does the initialDelay attribute of @Scheduled control?
    options:
      - "The delay before the first execution, combined with fixedRate or fixedDelay"
      - "The timezone offset applied when interpreting a cron expression"
      - "The delay inserted between every subsequent recurring execution"
      - "The maximum time a task may run before being forcibly cancelled"
    answer: 0
    explanation: |
      initialDelay delays only the first execution; the recurring cadence is still
      governed by fixedRate or fixedDelay.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"
  - id: async-scheduling-caching-019
    difficulty: intermediate
    tags: [scheduling, cron, fields]
    question: |
      How many fields does a Spring cron expression have, and what is the first
      field?
    options:
      - "Six fields; the first field is seconds"
      - "Seven fields; the first field is milliseconds"
      - "Five fields; the first field is minutes"
      - "Six fields; the first field is minutes"
    answer: 0
    explanation: |
      Spring cron expressions have 6 fields: second, minute, hour, day-of-month,
      month, day-of-week. This differs from the classic Unix 5-field crontab,
      which has no seconds field.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"
  - id: async-scheduling-caching-020
    difficulty: intermediate
    tags: [scheduling, cron]
    question: |
      What does the cron expression "0 0 9 * * MON-FRI" fire on?
    options:
      - "Every 9 seconds on weekdays throughout the whole day"
      - "09:00 on the first calendar day of each month"
      - "09:00:00 every weekday (Monday through Friday)"
      - "Nine times per hour Monday through Friday"
    answer: 2
    explanation: |
      Fields are second=0, minute=0, hour=9, day-of-month=*, month=*,
      day-of-week=MON-FRI, so it triggers at 09:00:00 on weekdays.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"
  - id: async-scheduling-caching-021
    difficulty: intermediate
    tags: [scheduling, cron, timezone]
    question: |
      Which @Scheduled attribute specifies the time zone used to interpret a cron
      expression?
    options:
      - "timezone"
      - "offset"
      - "locale"
      - "zone"
    answer: 3
    explanation: |
      The zone attribute (e.g. zone = "America/New_York") sets the time zone for
      a cron trigger; without it the server's local time zone is used.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"
  - id: async-scheduling-caching-022
    difficulty: beginner
    tags: [caching, enable-caching]
    question: |
      Which annotation activates Spring's declarative caching annotations?
    options:
      - "@EnableAsync"
      - "@CacheSupport"
      - "@EnableCacheManager"
      - "@EnableCaching"
    answer: 3
    explanation: |
      @EnableCaching turns on the caching advice so @Cacheable, @CachePut, and
      @CacheEvict are honored.
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-023
    difficulty: beginner
    tags: [caching, cacheable]
    question: |
      When does the body of a @Cacheable method actually execute?
    options:
      - "On every invocation, because @Cacheable runs the body first and then compares its result to the stored one"
      - "Only during the first application startup, after which the method is permanently disabled by the proxy"
      - "Only on a cache miss; on a hit the cached value is returned and the body is skipped"
      - "Only when the cache region is manually cleared by an administrator through the CacheManager API"
    answer: 2
    explanation: |
      @Cacheable consults the cache first. On a hit it returns the stored value
      and skips the method; on a miss it runs the method and stores the result.
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-024
    difficulty: intermediate
    tags: [caching, cacheput]
    question: |
      How does @CachePut differ from @Cacheable?
    options:
      - "@CachePut consults the cache first and skips the method body on a hit, exactly like @Cacheable"
      - "@CachePut always executes the method and updates the cache with the result"
      - "@CachePut runs the method and then deletes the matching cache entry once execution completes"
      - "@CachePut only reads the existing value from the cache and never writes a new entry back"
    answer: 1
    explanation: |
      @CachePut always runs the method and puts the fresh return value into the
      cache, making it ideal for update operations. Unlike @Cacheable, it never
      skips execution.
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-025
    difficulty: beginner
    tags: [caching, cacheevict]
    question: |
      What does @CacheEvict do?
    options:
      - "Runs the method and adds its return value as a fresh entry in the cache region"
      - "Removes one or all entries from a cache region"
      - "Serializes the entire cache region to disk for durable persistence between restarts"
      - "Reads an entry from the cache and returns it to the caller without modifying the region"
    answer: 1
    explanation: |
      @CacheEvict removes cached data: a specific key by default, or the entire
      region when allEntries = true.
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-026
    difficulty: intermediate
    tags: [caching, cacheevict, all-entries]
    question: |
      Which @CacheEvict attribute clears every entry in the named cache rather
      than a single key?
    options:
      - "flush = true"
      - "allEntries = true"
      - "clearAll = true"
      - "evictAll = true"
    answer: 1
    explanation: |
      Setting allEntries = true evicts the whole cache region; without it, only
      the entry for the resolved key is removed.
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-027
    difficulty: intermediate
    tags: [caching, key, spel]
    question: |
      By default (no key specified), how does Spring compute the cache key for a
      method with a single argument?
    options:
      - "It uses the single argument itself as the key via SimpleKeyGenerator"
      - "It requires you to always specify the key attribute explicitly or bean creation fails at startup"
      - "It combines the declaring method name and class name into the key, ignoring the argument value"
      - "It always uses a constant integer key of 0, so every argument maps to the same entry"
    answer: 0
    explanation: |
      The default SimpleKeyGenerator uses the sole parameter as the key. With
      multiple parameters it builds a SimpleKey from all of them; with none it
      uses an empty SimpleKey.
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-028
    difficulty: intermediate
    tags: [caching, unless, condition]
    question: |
      What is the difference between the condition and unless attributes on a
      caching annotation?
    options:
      - "condition is evaluated after invocation and can see #result; unless is evaluated before the method runs"
      - "Both are evaluated once at application startup and then cached as constants for every later call"
      - "condition applies only to @CacheEvict operations, whereas unless applies only to @Cacheable caching"
      - "condition is evaluated before invocation; unless is evaluated after and can reference #result"
    answer: 3
    explanation: |
      condition gates whether caching applies and is checked before the method
      runs, so it cannot see the result. unless is checked after execution and can
      use #result, e.g. unless = "#result == null".
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-029
    difficulty: intermediate
    tags: [caching, sync, stampede]
    question: |
      Which @Cacheable option serializes concurrent cache misses for the same key
      so the method runs only once (avoiding a cache stampede)?
    options:
      - "lock = true"
      - "single = true"
      - "sync = true"
      - "atomic = true"
    answer: 2
    explanation: |
      @Cacheable(sync = true) ensures that when multiple threads miss on the same
      key concurrently, only one computes the value while the others wait.
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-030
    difficulty: intermediate
    tags: [caching, cacheevict, before-invocation]
    question: |
      What does @CacheEvict(beforeInvocation = true) change compared to the
      default?
    options:
      - "Eviction happens twice, once before the method runs and once again after it returns"
      - "It disables eviction entirely, turning the annotation into a no-op that leaves the cache intact"
      - "Eviction happens before the method runs, so it occurs even if the method throws"
      - "It stores the method's return value into the cache first and only then evicts the old entry"
    answer: 2
    explanation: |
      By default eviction occurs after a successful return. With
      beforeInvocation = true, the entry is removed before the method executes, so
      the cache is cleared even if the method throws an exception.
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-031
    difficulty: beginner
    tags: [caching, cache-manager]
    question: |
      In plain Spring Framework (not Spring Boot), what must you provide for
      @EnableCaching to work?
    options:
      - "A TaskScheduler bean"
      - "A CacheManager bean"
      - "An @Async executor bean"
      - "Nothing; a CacheManager is auto-created"
    answer: 1
    explanation: |
      @EnableCaching does not create a CacheManager. In core Spring you must
      declare a CacheManager bean yourself. Spring Boot differs by auto-configuring
      one.
    ref: "concepts.md#the-cachemanager-abstraction"
  - id: async-scheduling-caching-032
    difficulty: intermediate
    tags: [caching, cache-manager, spi]
    question: |
      What does the CacheManager abstraction primarily provide?
    options:
      - "A thread pool for running cache operations asynchronously"
      - "A registry that returns named Cache instances via getCache(name)"
      - "A concrete distributed cache implementation with built-in TTL"
      - "Automatic JSON serialization of all cached objects"
    answer: 1
    explanation: |
      CacheManager is an SPI whose main job is to hand out named Cache instances.
      It is a thin abstraction; TTL, eviction, and serialization are backend
      concerns handled by the underlying provider.
    ref: "concepts.md#the-cachemanager-abstraction"
  - id: async-scheduling-caching-033
    difficulty: intermediate
    tags: [caching, cache-manager, implementations]
    question: |
      Which CacheManager is a simple in-JVM implementation backed by
      ConcurrentHashMap with no TTL or size limit, suitable for tests?
    options:
      - "JCacheCacheManager"
      - "RedisCacheManager"
      - "ConcurrentMapCacheManager"
      - "CaffeineCacheManager"
    answer: 2
    explanation: |
      ConcurrentMapCacheManager stores entries in ConcurrentHashMaps. It is simple
      and unbounded (no expiry/size limits), so it is best for dev and tests, not
      production.
    ref: "concepts.md#the-cachemanager-abstraction"
  - id: async-scheduling-caching-034
    difficulty: intermediate
    tags: [caching, ttl, backend]
    question: |
      If you need time-based expiration (TTL) of cache entries, why is
      ConcurrentMapCacheManager insufficient?
    options:
      - "TTL requires @Cacheable(ttl = ...) which is unsupported"
      - "The abstraction does not implement TTL itself; you need a backend like Caffeine, Redis, or a JCache provider"
      - "TTL is only available when @EnableCaching sets expireAfter"
      - "ConcurrentMapCacheManager supports TTL only in Spring 6.2+"
    answer: 1
    explanation: |
      Expiration and eviction are backend responsibilities. ConcurrentMapCacheManager
      has none, so for TTL you use Caffeine, Redis, or a JSR-107 provider that
      supports it.
    ref: "concepts.md#the-cachemanager-abstraction"
  - id: async-scheduling-caching-035
    difficulty: beginner
    tags: [proxy, aop, self-invocation]
    question: |
      Why does calling a @Cacheable or @Async method from another method in the
      SAME class (via this) usually bypass the caching/async behavior?
    options:
      - "The internal call does not pass through the Spring proxy, so the advice never runs"
      - "Annotations are honored only on the very first bean instance the container creates during refresh"
      - "The JVM inlines all same-class method calls at JIT time, stripping their annotations from bytecode"
      - "Spring applies caching and async advice only to the first annotated method it discovers per class"
    answer: 0
    explanation: |
      The advice lives in a proxy that wraps the bean from the outside. An internal
      this call goes directly to the target object, so the proxy is not involved
      and the async/caching advice is skipped. This is the classic self-invocation
      caveat.
    ref: "concepts.md#proxy-aop-basis-and-the-self-invocation-caveat"
  - id: async-scheduling-caching-036
    difficulty: intermediate
    tags: [proxy, aop, jdk-cglib]
    question: |
      When does Spring use a CGLIB (class-based) proxy instead of a JDK dynamic
      (interface-based) proxy for these features?
    options:
      - "When the bean implements no interface, or proxyTargetClass = true is set"
      - "Always; JDK dynamic proxies were removed and are never used for these features"
      - "Only for @Scheduled beans, while @Async and caching always use JDK dynamic proxies"
      - "Only when the bean is annotated with @Primary and marked as the autowiring candidate"
    answer: 0
    explanation: |
      Spring uses a JDK dynamic proxy when the target implements an interface, and
      a CGLIB subclass proxy when it does not (or when proxyTargetClass = true
      forces class-based proxying).
    ref: "concepts.md#proxy-aop-basis-and-the-self-invocation-caveat"
  - id: async-scheduling-caching-037
    difficulty: intermediate
    tags: [proxy, aop, aspectj, self-invocation]
    question: |
      Which approach genuinely makes self-invocation of an @Async method work,
      because the advice is woven into the class bytecode itself?
    options:
      - "Setting proxyTargetClass = true so a CGLIB subclass proxy is used"
      - "Increasing the executor pool size to add spare worker threads"
      - "Marking the target method final so the JVM inlines the call"
      - "Using mode = ASPECTJ (compile-time or load-time weaving)"
    answer: 3
    explanation: |
      AspectJ weaving inserts the advice directly into the target class, so even
      internal this calls are intercepted. Proxy mode (the default) cannot do this
      regardless of proxyTargetClass.
    ref: "concepts.md#proxy-aop-basis-and-the-self-invocation-caveat"
  - id: async-scheduling-caching-038
    difficulty: intermediate
    tags: [proxy, method-visibility]
    question: |
      With the default proxy-based mechanism, which method visibility is required
      for @Async / @Cacheable advice to be applied?
    options:
      - "protected visibility only"
      - "private methods only"
      - "public and non-final"
      - "static methods only"
    answer: 2
    explanation: |
      Default proxies advise public, non-final methods. Private, static, or final
      methods are not intercepted (CGLIB cannot override final/static; JDK proxies
      only expose interface methods).
    ref: "concepts.md#proxy-aop-basis-and-the-self-invocation-caveat"
  - id: async-scheduling-caching-039
    difficulty: beginner
    tags: [proxy, spring-bean]
    question: |
      For @Async, @Scheduled, or @Cacheable behavior to take effect, the object
      must be:
    options:
      - "Declared final on the class definition itself"
      - "A static utility class exposing only static methods"
      - "A Spring-managed bean obtained from the container"
      - "Created with the new keyword in application code"
    answer: 2
    explanation: |
      Only Spring-managed beans get wrapped in proxies. If you instantiate the
      object yourself with new, there is no proxy and none of the declarative
      behavior applies.
    ref: "concepts.md#proxy-aop-basis-and-the-self-invocation-caveat"
  - id: async-scheduling-caching-040
    difficulty: intermediate
    tags: [caching, cacheable, cacheput, conflict]
    question: |
      Why should you avoid placing both @Cacheable and @CachePut on the same
      method?
    options:
      - "Their behaviors conflict: @Cacheable skips the method on a hit while @CachePut always executes it"
      - "Spring throws a compilation error whenever two cache annotations appear on one method"
      - "It doubles the memory used because each result is stored under two separate keys"
      - "@CachePut silently disables @EnableCaching for the entire application context"
    answer: 0
    explanation: |
      @Cacheable wants to skip execution on a hit, but @CachePut wants to always
      execute and update the cache. Combining them produces contradictory,
      confusing behavior, so they should not be used together on one method.
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-041
    difficulty: beginner
    tags: [async, class-level]
    question: |
      What happens if you place @Async at the class level rather than on a single
      method?
    options:
      - "Only the first method declared in source order becomes asynchronous"
      - "It is ignored at startup because @Async is a method-only annotation"
      - "Only the constructor runs asynchronously on a background thread"
      - "All public methods of the class become asynchronous"
    answer: 3
    explanation: |
      @Async can be applied at the type level, in which case every (proxyable)
      method of the class is treated as asynchronous.
    ref: "concepts.md#enabling-asynchronous-execution-with-enableasync-and-async"
  - id: async-scheduling-caching-042
    difficulty: intermediate
    tags: [scheduling, cron, disabled]
    question: |
      In Spring 5.3+, what does a @Scheduled cron value of "-" mean?
    options:
      - "The task fires once every second, treating '-' as a wildcard"
      - "The scheduled task is disabled (Scheduled.CRON_DISABLED)"
      - "The task runs exactly once immediately at context startup"
      - "It is an invalid expression that throws a parse exception at startup"
    answer: 1
    explanation: |
      The special cron value "-" (Scheduled.CRON_DISABLED) disables the task,
      which is handy when the expression is supplied via a property and you want to
      turn it off.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"
  - id: async-scheduling-caching-043
    difficulty: intermediate
    tags: [caching, null-values]
    question: |
      By default, what happens when a @Cacheable method's cached value for a key
      is null?
    options:
      - "Nulls are never stored, forcing the method to run on every invocation"
      - "The null is stored and counts as a cache hit, so the method is not re-run"
      - "Spring throws a NullPointerException back to the calling code"
      - "The entire cache region is cleared automatically to stay consistent"
    answer: 1
    explanation: |
      Spring's abstraction stores null values by default (allowNullValues = true),
      so a cached null is a legitimate hit and the method body is skipped until the
      entry is evicted.
    ref: "concepts.md#the-cachemanager-abstraction"
  - id: async-scheduling-caching-044
    difficulty: beginner
    tags: [scheduling, async, combined]
    question: |
      What is the effect of annotating a method with BOTH @Scheduled and @Async?
    options:
      - "Each scheduled trigger runs on the async executor instead of blocking the scheduler thread"
      - "The method runs twice per trigger, once on each of the two thread pools"
      - "It causes a configuration error rejected at context startup"
      - "Scheduling is disabled and only the async behavior remains active"
    answer: 0
    explanation: |
      The two features compose: the scheduler fires the trigger, and because the
      method is @Async, the actual work is handed to the TaskExecutor, freeing the
      scheduler thread.
    ref: "concepts.md#enabling-scheduling-with-enablescheduling-and-scheduled"
  - id: async-scheduling-caching-045
    difficulty: advanced
    tags: [async, executor, resolution, precedence]
    question: |
      A method is annotated @Async("reportExecutor"). The context defines a
      ThreadPoolTaskExecutor bean named reportExecutor, an AsyncConfigurer whose
      getAsyncExecutor() returns a different pool, and a bean named taskExecutor.
      Which executor actually runs the method, and why?
    options:
      - "The AsyncConfigurer executor, because AsyncConfigurer always wins over qualifiers"
      - "A SimpleAsyncTaskExecutor, because the ambiguity forces the default fallback"
      - "The bean named taskExecutor, because Spring prefers that conventional name"
      - "The bean named reportExecutor, because the @Async value qualifier takes precedence over all fallbacks"
    answer: 3
    explanation: |
      The @Async value qualifier is resolved first: Spring looks up the executor
      bean by that name/qualifier. Only when no qualifier is present does it fall
      back to the AsyncConfigurer executor, then a unique/taskExecutor-named bean,
      then SimpleAsyncTaskExecutor. So the explicitly named reportExecutor wins.
    ref: "concepts.md#enabling-asynchronous-execution-with-enableasync-and-async"
  - id: async-scheduling-caching-046
    difficulty: expert
    tags: [async, transactional, threading]
    question: |
      Service A has a @Transactional method that calls, through a proxy, an @Async
      @Transactional method on service B. What is true about the transaction(s)?
    options:
      - "B joins A's transaction because REQUIRED propagation transparently reuses the caller's active transaction across the async hand-off"
      - "Both run inside A's single transaction because @Async reuses the caller thread and its bound transactional resources for B"
      - "B starts its own independent transaction on the executor thread; it cannot join A's because A's transactional resources are bound to the caller thread"
      - "B's @Transactional is ignored entirely because the @Async proxy strips all transaction advice off methods it dispatches asynchronously"
    answer: 2
    explanation: |
      @Async dispatches B to another thread. Transaction context and its
      ThreadLocal-bound resources live on the caller thread, so they do not
      propagate. B therefore begins a brand-new transaction on the executor
      thread; there is nothing to join. Expecting REQUIRED to reuse A's transaction
      across the async boundary is a classic mistake.
    ref: "concepts.md#enabling-asynchronous-execution-with-enableasync-and-async"
  - id: async-scheduling-caching-047
    difficulty: advanced
    tags: [async, return-types, exception-handler]
    question: |
      You registered a custom AsyncUncaughtExceptionHandler, but exceptions thrown
      by an @Async method returning CompletableFuture<Order> never reach it. Why?
    options:
      - "The handler only fires for @Async methods returning void; for Future/CompletableFuture the exception is stored in the future and surfaces on get()/join()"
      - "Custom handlers must be registered via an @EnableAsync(handler = ...) attribute, otherwise the AsyncConfigurer's handler is silently ignored"
      - "CompletableFuture silently swallows every exception thrown in the body unless you explicitly chain an exceptionally() stage on it"
      - "The handler only fires when proxyTargetClass is true and the bean is proxied by a CGLIB subclass rather than a JDK dynamic proxy"
    answer: 0
    explanation: |
      AsyncUncaughtExceptionHandler is invoked only for void-returning async
      methods, where the caller has no future to inspect. For a Future/
      CompletableFuture return, the exception is captured into the future and
      re-thrown (wrapped in ExecutionException) when the caller calls get()/join().
    ref: "concepts.md#async-return-types-void-future-and-completablefuture"
  - id: async-scheduling-caching-048
    difficulty: expert
    tags: [async, threadpooltaskexecutor, saturation]
    question: |
      A ThreadPoolTaskExecutor is configured corePoolSize=2, maxPoolSize=50,
      queueCapacity=10000. Under a sustained burst of 40 concurrent @Async
      submissions, roughly how many worker threads will be active?
    options:
      - "50, because a sustained burst immediately scales the pool straight up to maxPoolSize before touching the queue"
      - "40, because each in-flight task is given its own dedicated worker thread on submission"
      - "2, because tasks fill the large queue before any thread beyond core is created; maxPoolSize is only reached once the queue is full"
      - "0, because all 40 tasks are rejected up front since the queue capacity already exceeds maxPoolSize"
    answer: 2
    explanation: |
      The ThreadPoolExecutor algorithm creates threads up to corePoolSize, then
      queues, and only spawns threads toward maxPoolSize when the queue is full.
      With a 10000-slot queue, 40 tasks never fill it, so the pool stays at 2
      threads. A huge queue effectively caps concurrency at corePoolSize.
    ref: "concepts.md#configuring-the-taskexecutor-for-async"
  - id: async-scheduling-caching-049
    difficulty: expert
    tags: [async, rejection, back-pressure]
    question: |
      With corePoolSize=2, maxPoolSize=2, queueCapacity=0 and the default rejection
      policy, what happens when a 3rd task is submitted while both threads are busy?
    options:
      - "The task is silently dropped and immediately returns an already-completed future to the caller"
      - "The task waits in an unbounded overflow queue until one of the two threads becomes free"
      - "A new temporary worker thread is spun up beyond maxPoolSize just to run this third task"
      - "The submit call throws RejectedExecutionException synchronously on the caller thread"
    answer: 3
    explanation: |
      With no queue capacity and the pool at max, the default AbortPolicy rejects
      the task, throwing RejectedExecutionException on the caller's thread at submit
      time. CallerRunsPolicy would instead run it on the caller thread (back
      pressure); AbortPolicy simply fails fast.
    ref: "concepts.md#configuring-the-taskexecutor-for-async"
  - id: async-scheduling-caching-050
    difficulty: expert
    tags: [async, task-decorator, context-propagation]
    question: |
      An @Async method logs without the correlation id that request-scoped MDC
      normally provides, and cannot read the SecurityContext. What is the correct
      framework-level fix?
    options:
      - "Mark the method @Transactional so the transaction synchronization carries MDC and SecurityContext across the thread boundary"
      - "Increase corePoolSize so each fresh worker thread inherits the caller's ThreadLocal context on creation"
      - "Configure a TaskDecorator on the ThreadPoolTaskExecutor to capture and re-establish MDC/SecurityContext around each task"
      - "Switch the executor to SimpleAsyncTaskExecutor, which automatically copies all inheritable ThreadLocals to its threads"
    answer: 2
    explanation: |
      ThreadLocal-based context (MDC, SecurityContext, request scope) does not
      cross the thread boundary automatically. A TaskDecorator wraps each submitted
      Runnable to snapshot the caller's context and restore it on the worker
      thread (and clean it up after), which is the intended extension point.
    ref: "concepts.md#configuring-the-taskexecutor-for-async"
  - id: async-scheduling-caching-051
    difficulty: advanced
    tags: [async, postconstruct, lifecycle]
    question: |
      A bean puts @Async on a method annotated @PostConstruct, expecting
      initialization to run in the background. What actually happens?
    options:
      - "The @PostConstruct method runs synchronously during initialization (not async), because the async proxy is not yet applied to internal lifecycle calls"
      - "Initialization runs asynchronously on an executor thread and the bean is fully usable immediately after construction returns"
      - "The context fails to start, throwing a circular-proxy exception during bean post-processing of the lifecycle callback"
      - "The init method runs twice per bean: once synchronously during init and once again asynchronously on a worker thread"
    answer: 0
    explanation: |
      Lifecycle callbacks are invoked directly by the container during bean
      initialization, before the async proxy governs external calls. So an @Async
      @PostConstruct runs synchronously on the initializing thread; you cannot make
      init logic async this way.
    ref: "concepts.md#enabling-asynchronous-execution-with-enableasync-and-async"
  - id: async-scheduling-caching-052
    difficulty: advanced
    tags: [async, future, null]
    question: |
      An @Async method declared to return CompletableFuture<User> returns null in
      one branch. What is the consequence for a caller doing result.thenApply(...)?
    options:
      - "Spring transparently substitutes CompletableFuture.completedFuture(null) so the caller still gets a valid future"
      - "The caller receives a normally completed future that simply holds a null User value inside it"
      - "The proxy returns null, so the caller gets a NullPointerException when it dereferences the future"
      - "The null branch is reclassified as void and its outcome is routed to the AsyncUncaughtExceptionHandler"
    answer: 2
    explanation: |
      A Future-returning @Async method must return a non-null Future. Returning
      null makes the proxy hand back null, and any caller chaining on it hits an
      NPE. Always return CompletableFuture.completedFuture(value), even for null
      payloads (wrap it), never a null future.
    ref: "concepts.md#async-return-types-void-future-and-completablefuture"
  - id: async-scheduling-caching-053
    difficulty: advanced
    tags: [async, simpleasynctaskexecutor, production]
    question: |
      Why is the default SimpleAsyncTaskExecutor fallback considered dangerous for
      production @Async workloads unless configured?
    options:
      - "It runs every submitted task inline on the caller's own thread, silently defeating asynchronous execution"
      - "It serializes all tasks onto one shared background thread, creating a throughput bottleneck under load"
      - "It only supports void return types and rejects any Future or CompletableFuture result at invocation"
      - "It has no queue and by default creates a new thread per task, so a load spike can spawn unbounded threads and exhaust resources"
    answer: 3
    explanation: |
      SimpleAsyncTaskExecutor does not pool or queue by default; each task gets a
      fresh thread. Under load this creates threads without bound, risking OOM/
      thread exhaustion. You must set a concurrency limit or use a real pool
      (ThreadPoolTaskExecutor) in production.
    ref: "concepts.md#configuring-the-taskexecutor-for-async"
  - id: async-scheduling-caching-054
    difficulty: expert
    tags: [scheduling, fixed-rate, overlap, concurrency]
    question: |
      A @Scheduled(fixedRate = 1000) method typically takes 3 seconds. A
      ThreadPoolTaskScheduler with poolSize=5 is configured. What is the observable
      behavior?
    options:
      - "Multiple executions of the method run concurrently, because fixedRate fires on schedule and separate pool threads pick up overlapping invocations"
      - "Executions are strictly serialized, with each run starting exactly 1s after the previous one has finished"
      - "The scheduler silently drops any fire that would overlap a running task, so it effectively runs once every 3s"
      - "Spring throws a configuration exception at startup because fixedRate is shorter than the method's execution time"
    answer: 0
    explanation: |
      fixedRate anchors fire times to the planned schedule, not completion. With a
      multi-threaded scheduler, a fire that comes due while a prior run is still
      executing is dispatched to another pool thread, so executions overlap. On a
      single-threaded scheduler they would instead bunch up without overlapping.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"
  - id: async-scheduling-caching-055
    difficulty: advanced
    tags: [scheduling, fixed-delay, overlap]
    question: |
      Why can a @Scheduled(fixedDelay = 1000) task NEVER overlap with itself,
      regardless of scheduler pool size?
    options:
      - "Because fixedDelay tasks are always pinned by Spring to a single dedicated thread, so the pool size setting is ignored"
      - "Because Spring acquires an exclusive lock on the bean instance for the entire delay duration, blocking any re-entry"
      - "Because fixedDelay quietly disables the scheduler's thread pool and pins every run onto one reserved worker thread"
      - "Because the next start is anchored to the previous execution's completion, so at most one invocation is ever in flight"
    answer: 3
    explanation: |
      fixedDelay schedules the next run only after the current one completes (plus
      the delay). The next fire time is not known until completion, so there is by
      construction only ever a single execution active at a time, independent of
      pool size.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"
  - id: async-scheduling-caching-056
    difficulty: expert
    tags: [scheduling, double-initialization, scope]
    question: |
      A developer reports that a @Scheduled(fixedRate = 60000) method fires three
      times every minute. Which explanation is most consistent with proxy/registration
      internals?
    options:
      - "The default single-threaded scheduler internally multiplies every fire by its configured pool size, so a pool of three yields three triggers"
      - "fixedRate always dispatches each scheduled fire three times as a built-in at-least-once delivery guarantee against missed runs"
      - "Three live instances of the @Scheduled bean exist (e.g. prototype scope or double registration via @Configurable plus container), each registering its own trigger"
      - "When fixedRate is used instead of an explicit cron expression, the cron parser silently defaults its repeat count to three per interval"
    answer: 2
    explanation: |
      ScheduledAnnotationBeanPostProcessor registers a trigger per live bean
      instance. If the class is instantiated multiple times (prototype scope, or
      registered both by the container and by @Configurable weaving), each instance
      schedules the method, so it fires once per instance per interval.
    ref: "concepts.md#enabling-scheduling-with-enablescheduling-and-scheduled"
  - id: async-scheduling-caching-057
    difficulty: advanced
    tags: [scheduling, task-scheduler, resolution]
    question: |
      An application defines two TaskScheduler beans, neither named taskScheduler,
      and @Scheduled methods without a scheduler qualifier. What happens at startup?
    options:
      - "Spring deterministically picks the first TaskScheduler bean sorted alphabetically by bean name and quietly ignores the other candidate"
      - "Spring transparently merges both TaskScheduler beans into a single CompositeTaskScheduler that round-robins tasks between them"
      - "Startup fails / the tasks cannot resolve a unique scheduler, because with multiple candidates Spring needs one named taskScheduler or a scheduler qualifier"
      - "Both TaskScheduler beans register every @Scheduled method independently, so each task ends up running twice and doubles its executions"
    answer: 2
    explanation: |
      With exactly one TaskScheduler it is used automatically; with several, Spring
      falls back to one named taskScheduler or the per-method scheduler qualifier
      (6.1+). Multiple unqualified candidates with no conventional name are
      ambiguous and cannot be resolved.
    ref: "concepts.md#enabling-scheduling-with-enablescheduling-and-scheduled"
  - id: async-scheduling-caching-058
    difficulty: advanced
    tags: [scheduling, exception, resilience]
    question: |
      A @Scheduled(fixedRate = 5000) method throws a RuntimeException on one
      execution. What happens to subsequent executions?
    options:
      - "The scheduler cancels this task's registration permanently after the very first exception, so it never fires again"
      - "The scheduler automatically retries the failed execution three times with a short backoff before giving up on that run"
      - "The exception propagates up to the main application thread and brings down the whole context with an unhandled error"
      - "The exception is logged by the trigger's error handler and future executions continue on schedule"
    answer: 3
    explanation: |
      A thrown exception from a scheduled run is caught by the task's error handler
      (logged by default) and does not cancel the recurring schedule. Subsequent
      fires proceed normally. This differs from a Future task where you would
      inspect the exception explicitly.
    ref: "concepts.md#enabling-scheduling-with-enablescheduling-and-scheduled"
  - id: async-scheduling-caching-059
    difficulty: expert
    tags: [scheduling, initial-delay, cron]
    question: |
      Which @Scheduled configuration is invalid or meaningless?
    options:
      - "@Scheduled(cron = \"0 0 * * * *\", initialDelay = 10000)"
      - "@Scheduled(fixedRate = 5000, initialDelay = 10000)"
      - "@Scheduled(fixedDelayString = \"PT30S\")"
      - "@Scheduled(cron = \"-\")"
    answer: 0
    explanation: |
      initialDelay only applies to fixedRate/fixedDelay tasks; it has no meaning for
      a cron trigger, which fires at the next matching wall-clock time. Combining
      cron with initialDelay is rejected/ignored. The others are all valid
      (Duration string, disabled cron, initialDelay with fixedRate).
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"
  - id: async-scheduling-caching-060
    difficulty: expert
    tags: [scheduling, cron, day-of-week, edge-case]
    question: |
      In Spring's 6-field cron, what does "0 0 12 15 * MON" do, and what is the
      subtle trap?
    options:
      - "Fires at 12:00 on the 15th of the month OR on any Monday, because when both day-of-month and day-of-week are restricted they are OR-combined"
      - "Fires at 12:00 only on a day that is BOTH the 15th of the month AND a Monday, because Spring AND-combines the two day fields"
      - "Throws a parse error at startup, because Spring forbids restricting both the day-of-month and day-of-week fields at once"
      - "Fires at 12:00 every Monday and silently ignores the day-of-month field entirely, since day-of-week always takes priority"
    answer: 1
    explanation: |
      Spring's CronExpression AND-combines day-of-month and day-of-week when both
      are restricted (neither is * or ?): the job fires only on a day that is both
      the 15th AND a Monday. This is a deliberate Spring deviation from Unix/Vixie
      crontab, which OR-combines them. Expecting Unix-style OR (every 15th plus every
      Monday) is the trap; use ? in one field to disable that constraint.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"
  - id: async-scheduling-caching-061
    difficulty: advanced
    tags: [scheduling, simpleasynctaskscheduler, virtual-threads]
    question: |
      With Spring 6.1's SimpleAsyncTaskScheduler and virtual threads enabled, why
      is fixedRate/cron recommended over fixedDelay?
    options:
      - "fixedDelay was deprecated in Spring 6.1 in favor of fixedRate whenever virtual threads are enabled on the scheduler"
      - "Virtual threads are structurally incapable of running fixedDelay tasks, so the scheduler rejects them at registration time"
      - "SimpleAsyncTaskScheduler fires each fixedRate/cron execution on a fresh (virtual) thread, but fixed-delay tasks must run on the single scheduler thread because the next delay can only be measured after completion"
      - "fixedRate allocates measurably less memory per fire than fixedDelay because it skips the completion-timestamp bookkeeping"
    answer: 2
    explanation: |
      SimpleAsyncTaskScheduler uses one scheduler thread and spins up a new thread
      per execution for rate/cron triggers. Fixed-delay semantics require waiting
      for each task to finish before scheduling the next, so those tasks stay on
      the single scheduler thread, negating the virtual-thread advantage.
    ref: "concepts.md#enabling-scheduling-with-enablescheduling-and-scheduled"
  - id: async-scheduling-caching-062
    difficulty: expert
    tags: [scheduling, scheduling-configurer, dynamic-trigger]
    question: |
      You need a scheduled task whose interval is read from a database and can
      change at runtime. Which mechanism is appropriate?
    options:
      - "Use @Scheduled(fixedRateString = \"${db.rate}\") and Spring will re-read the property and refresh the interval automatically on every fire"
      - "Implement SchedulingConfigurer and register a Trigger (e.g. via ScheduledTaskRegistrar) whose nextExecution is computed dynamically each cycle"
      - "Annotate the method with @Scheduled(cron = \"#{dynamic}\") using SpEL that re-evaluates each fire"
      - "Set fixedRate = -1 as a sentinel that tells the scheduler to recompute the interval from the database before every execution"
    answer: 1
    explanation: |
      Static annotation attributes are resolved once. For a runtime-variable
      schedule, implement SchedulingConfigurer and register a custom Trigger with
      the ScheduledTaskRegistrar; the Trigger's nextExecution method is called after
      each run and can consult live state to compute the next fire time.
    ref: "concepts.md#enabling-scheduling-with-enablescheduling-and-scheduled"
  - id: async-scheduling-caching-063
    difficulty: expert
    tags: [caching, sync, limitations]
    question: |
      Which combination will cause Spring to reject the configuration at startup?
    options:
      - "@Cacheable(cacheNames = \"a\", sync = true, condition = \"#id > 0\")"
      - "@Cacheable(cacheNames = {\"a\", \"b\"}, sync = true)"
      - "@Cacheable(cacheNames = \"a\", key = \"#id\")"
      - "@Cacheable(cacheNames = \"a\", unless = \"#result == null\")"
    answer: 1
    explanation: |
      sync = true imposes documented limitations: exactly one cache may be named,
      unless() is not supported, and it cannot be combined with other cache
      operations. Specifying two caches with sync=true violates the single-cache
      rule and is rejected. condition is still allowed with sync.
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-064
    difficulty: expert
    tags: [caching, sync, unless]
    question: |
      Why does @Cacheable not permit the unless attribute when sync = true?
    options:
      - "The unless attribute is only ever valid on @CachePut and @CacheEvict, and was never wired into @Cacheable's interceptor regardless of sync"
      - "sync mode collapses the operation into a single atomic get-or-compute callback, leaving no separate post-computation point at which to evaluate unless and veto the put"
      - "unless can only reference #result, and @Cacheable never exposes a return value to its SpEL context, so the expression could not be evaluated"
      - "It is an arbitrary restriction with no technical basis; unless works fine but is disallowed"
    answer: 1
    explanation: |
      With sync=true the interceptor uses the provider's atomic get(key, loader)
      compute callback rather than distinct get-then-put steps. There is no discrete
      post-invocation stage to run unless and reject storing the value, so unless is
      not supported. condition (pre-invocation) remains valid.
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-065
    difficulty: advanced
    tags: [caching, exception, miss]
    question: |
      A @Cacheable method throws an exception while computing a value on a cache
      miss. What is the cache state afterward?
    options:
      - "The thrown exception is itself cached under the key, so subsequent calls rethrow the stored exception without ever running the method again"
      - "The entire named cache region is proactively evicted as a safety measure, so every other key must be recomputed on its next access too"
      - "A null placeholder value is stored under the key to prevent the failing computation from being retried on later calls"
      - "Nothing is stored; the exception propagates and the next call retries the method"
    answer: 3
    explanation: |
      Spring caches only successful return values. If the method throws during a
      miss, no entry is written, the exception propagates to the caller, and the
      next invocation with the same key will attempt the method again. There is no
      built-in negative/exception caching.
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-066
    difficulty: expert
    tags: [caching, cache-evict, before-invocation, consistency]
    question: |
      A method @CacheEvict(value = "users", key = "#id") deletes a user from the DB
      but the DB delete throws. With the DEFAULT eviction timing, what is the risk?
    options:
      - "The default (beforeInvocation = false) skips eviction because the method threw, so a now-deleted-intended user may remain cached as stale data if the failure is partial or retried"
      - "The entry is evicted twice, once before and once after the method, and the second eviction raises a missing-key error"
      - "The default timing always evicts the entry before the method body runs, so a thrown delete leaves no stale data behind at all"
      - "The thrown exception automatically escalates the eviction to allEntries = true, clearing the whole users region as a fallback"
    answer: 0
    explanation: |
      With beforeInvocation = false (default), eviction runs only after a successful
      return. If the method throws, the entry is left in the cache. For delete-style
      operations where you must not serve stale data even on partial failure,
      beforeInvocation = true evicts up front regardless of outcome.
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-067
    difficulty: expert
    tags: [caching, transaction-aware, consistency]
    question: |
      A @Transactional method annotated @CacheEvict evicts an entry, then the
      surrounding transaction rolls back. With a plain CacheManager, what is the
      inconsistency and the fix?
    options:
      - "There is no inconsistency, because a plain CacheManager automatically enlists cache operations in the transaction and rolls them back on failure"
      - "The fix is to set beforeInvocation = false, which by design defers the eviction until after the surrounding transaction successfully commits"
      - "The transaction rollback automatically re-inserts the evicted entry back into the cache from an internal undo log, restoring consistency"
      - "The eviction already happened at the method boundary while the DB change was undone, leaving the cache missing an entry that still exists in the DB; wrap the manager in TransactionAwareCacheManagerProxy to defer cache ops until commit"
    answer: 3
    explanation: |
      By default cache operations occur immediately at method boundaries, not at
      commit. A rollback leaves the cache mutated but the DB unchanged. Wrapping the
      CacheManager in a TransactionAwareCacheManagerProxy registers cache mutations
      as transaction synchronizations so they apply only after a successful commit.
    ref: "concepts.md#the-cachemanager-abstraction"
  - id: async-scheduling-caching-068
    difficulty: advanced
    tags: [caching, spel, result]
    question: |
      In which of these is #result available in the SpEL expression?
    options:
      - "The condition attribute of @Cacheable, which is evaluated before the method body runs to decide whether caching applies"
      - "The key attribute of @Cacheable, which Spring evaluates up front to compute the lookup key before invoking the method"
      - "The unless attribute of @Cacheable and the key of @CachePut"
      - "The condition attribute of @CacheEvict(beforeInvocation = true), which is checked ahead of the method so no return value exists yet"
    answer: 2
    explanation: |
      #result reflects the method's return value and is only available after the
      method runs: in unless, in @CachePut key expressions, and in
      @CacheEvict(beforeInvocation = false). Pre-invocation expressions (condition,
      @Cacheable key, beforeInvocation=true evict) cannot see #result.
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-069
    difficulty: expert
    tags: [caching, spel, optional, result]
    question: |
      A method returns Optional<Book> and is annotated
      @Cacheable(cacheNames = "books", unless = "#result?.hardback"). What does
      #result refer to inside unless?
    options:
      - "The Optional<Book> wrapper object itself, so navigating #result?.hardback would fail to resolve the hardback property at evaluation time"
      - "The unwrapped Book instance (or null), because Spring exposes the actual value inside wrapper types like Optional to #result"
      - "A SimpleKey instance derived from the method arguments, which is what #result always binds to in a caching SpEL expression"
      - "The literal cache-name string \"books\" configured in cacheNames, which #result aliases inside the unless expression"
    answer: 1
    explanation: |
      For wrapper return types such as Optional and CompletableFuture, Spring
      exposes the unwrapped underlying value as #result, not the wrapper. So
      #result?.hardback safely navigates the Book (null-safe), letting unless veto
      caching of hardbacks.
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-070
    difficulty: advanced
    tags: [caching, key-generator, mutable]
    question: |
      A @Cacheable method keys on a single mutable object argument (default key
      generation). Code puts an entry, then mutates that same object's fields, then
      calls again with it. What is the likely outcome?
    options:
      - "The second call may miss, because the default SimpleKeyGenerator uses the argument itself as the key and its equals/hashCode now differ after mutation"
      - "The second call is always a guaranteed hit, because the default key generator uses object reference identity rather than equals/hashCode"
      - "Spring throws an IllegalArgumentException at invocation, because mutable objects are explicitly rejected as cache keys by the key generator"
      - "The cache transparently re-indexes the stored entry to the mutated field values, so the second call still resolves to the same entry"
    answer: 0
    explanation: |
      With one argument the default key is that argument, so lookups depend on its
      equals/hashCode. Mutating fields that participate in those methods changes the
      computed key, making the previously stored entry unreachable (a miss). Cache
      keys should be immutable/value-based.
    ref: "concepts.md#the-cachemanager-abstraction"
  - id: async-scheduling-caching-071
    difficulty: expert
    tags: [caching, cache-resolver, cache-manager]
    question: |
      What happens if a single @Cacheable specifies BOTH cacheManager = "cmA" and
      cacheResolver = "myResolver"?
    options:
      - "The named cacheManager cmA takes priority and Spring silently drops the myResolver reference during interceptor setup"
      - "The myResolver CacheResolver is used for selection while cmA is quietly retained and applied only as a fallback manager"
      - "Configuration fails: cacheManager and cacheResolver are mutually exclusive, and a custom CacheResolver ignores a CacheManager anyway"
      - "The two are transparently merged into a single CompositeCacheManager that consults both the resolver and cmA in turn"
    answer: 2
    explanation: |
      cacheManager and cacheResolver are mutually exclusive (as are key and
      keyGenerator). Specifying both throws, because a CacheResolver fully controls
      cache selection and would ignore the CacheManager. Choose one: cacheManager
      for static selection, cacheResolver for runtime resolution.
    ref: "concepts.md#the-cachemanager-abstraction"
  - id: async-scheduling-caching-072
    difficulty: advanced
    tags: [caching, allow-null-values, backend]
    question: |
      A CacheManager is configured with allowNullValues = false and a @Cacheable
      method returns null on a miss. What is the effect?
    options:
      - "The null is stored under the key anyway and counts as a legitimate hit, so the method body is skipped on every subsequent call"
      - "The @EnableCaching advice is silently disabled for that one method, and it reverts to plain uncached invocation from then on"
      - "Spring transparently converts the null into an empty Optional and caches that wrapper, so later calls return the empty Optional"
      - "The method re-executes on every call because null is never cached, and depending on the backend a null store attempt may even throw"
    answer: 3
    explanation: |
      With allowNullValues = false, null results are not stored, so each call misses
      and re-runs the method; some backends also reject storing null. With the
      default allowNullValues = true, Spring wraps null so it is a legitimate cached
      hit. unless = "#result == null" is the portable way to intentionally skip
      caching nulls.
    ref: "concepts.md#the-cachemanager-abstraction"
  - id: async-scheduling-caching-073
    difficulty: expert
    tags: [caching, cache-error-handler, resilience]
    question: |
      Redis backs the CacheManager and Redis becomes unreachable. With the default
      SimpleCacheErrorHandler, what is the blast radius, and how do you contain it?
    options:
      - "The default handler rethrows cache backend exceptions, so a cache outage turns into method-call failures; supply a custom CacheErrorHandler that logs and continues so the method still runs against the source of truth"
      - "Cache errors are always swallowed at every layer, so a Redis outage stays completely invisible to callers and the method quietly returns stale or empty data without any exception ever being logged"
      - "Spring automatically detects the unreachable backend and transparently swaps in a ConcurrentMapCacheManager for the duration of the outage, so every cache operation keeps succeeding against an in-JVM map"
      - "The @Cacheable method is skipped entirely whenever the backend is down, and the caller receives a null result immediately without the underlying method body ever executing against the database"
    answer: 0
    explanation: |
      SimpleCacheErrorHandler rethrows exceptions from the cache backend, so a Redis
      outage propagates as application errors. A custom CacheErrorHandler (via
      CachingConfigurer) can log-and-swallow get/put/evict failures, letting the
      method execute against the underlying data store instead of failing.
    ref: "concepts.md#the-cachemanager-abstraction"
  - id: async-scheduling-caching-074
    difficulty: expert
    tags: [caching, stampede, sync, concurrency]
    question: |
      Ten threads simultaneously call a @Cacheable (sync = false) method with the
      same, currently-uncached key. How many times does the method body run, and
      what fixes it to run once?
    options:
      - "Once, because @Cacheable always performs an atomic get-or-compute per key by default, transparently locking concurrent callers on a miss without any extra configuration"
      - "Exactly twice, because Spring runs the body once to compute the value and a second time to verify it matches before writing the entry into the cache"
      - "Zero times, because the very first concurrent miss disables caching for that key and returns a null placeholder to every waiting thread until the entry is evicted"
      - "Potentially all ten times (independent get/compute/put per thread); set sync = true so the provider locks the key and only one thread computes"
    answer: 3
    explanation: |
      Without sync, each concurrent miss independently runs the method and puts,
      causing a cache stampede (up to ten executions). sync = true instructs the
      provider to lock the entry so only one thread computes while the rest block
      and then read the freshly cached value.
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-075
    difficulty: expert
    tags: [proxy, ordering, transactional, caching]
    question: |
      With both @Cacheable and @Transactional on a method and caching advice
      ordered OUTSIDE transaction advice, what happens on a cache hit?
    options:
      - "A transaction is always started and a DB connection acquired before the cache is ever consulted, because the transaction interceptor is hard-wired to run outermost regardless of the configured advisor ordering"
      - "The cache is consulted first; on a hit the cached value is returned without ever beginning a transaction or acquiring a DB connection"
      - "The method body always runs to completion on a hit so that the transaction interceptor has an active persistence context to populate before the cached value is compared and returned"
      - "Spring rejects the bean at context startup because caching and transaction advice cannot be layered on the same method and must be split across two collaborating beans"
    answer: 1
    explanation: |
      Advisor order determines nesting. With caching outermost, a hit short-circuits
      before the transaction interceptor runs, so no transaction begins and no
      connection is acquired. If the transaction advisor were outermost, a
      transaction would open even for hits. Order is tunable via the order
      attributes on the @EnableXxx annotations.
    ref: "concepts.md#proxy-aop-basis-and-the-self-invocation-caveat"
  - id: async-scheduling-caching-076
    difficulty: expert
    tags: [proxy, async, ordering, transactional, threading]
    question: |
      A method is @Async and @Transactional with @Async ordered outermost. On which
      thread does the transaction run?
    options:
      - "On the caller thread, before the task is submitted, because the transaction interceptor always begins the transaction synchronously prior to the async hand-off regardless of advisor ordering"
      - "On the executor (worker) thread, because advice inside the async advisor executes after the hand-off to the executor"
      - "On a dedicated transaction-manager thread that Spring reserves exclusively for committing transactions started inside asynchronous tasks"
      - "The transaction is silently ignored because the @Async proxy strips all transaction advice off any method it dispatches asynchronously to the executor"
    answer: 1
    explanation: |
      Because @Async hands the invocation to the executor, any advice nested inside
      it (here @Transactional) runs on the worker thread. So the transaction begins
      and commits on the executor thread, which is generally what you want. Reversing
      the order would open the transaction on the caller thread, spanning the wrong
      thread.
    ref: "concepts.md#proxy-aop-basis-and-the-self-invocation-caveat"
  - id: async-scheduling-caching-077
    difficulty: advanced
    tags: [proxy, self-invocation, aop-context]
    question: |
      A team wants an internal this-call to a @Cacheable method to actually hit the
      cache, without splitting the class into two beans. Which approach works with
      proxy mode (not AspectJ)?
    options:
      - "Enable exposeProxy = true and call AopContext.currentProxy() then invoke the method through that proxy reference"
      - "Mark the target method final so the JVM pins it and the CGLIB proxy routes even internal this-calls through the cache advice automatically"
      - "Add @Primary to the bean so the container injects the proxy back into the bean itself and internal calls are intercepted by the caching advisor"
      - "Nothing works in proxy mode at all; only attaching a load-time JVM weaving agent at startup can make an internal call hit the cache advice"
    answer: 0
    explanation: |
      In proxy mode you can re-enter through the advice by retrieving the outer
      proxy from the thread-local exposed when exposeProxy = true, via
      AopContext.currentProxy(), and calling the method on it. It couples code to
      Spring AOP (a downside), but it does route the internal call through the cache
      advice. AspectJ weaving is the cleaner alternative.
    ref: "concepts.md#proxy-aop-basis-and-the-self-invocation-caveat"
  - id: async-scheduling-caching-078
    difficulty: advanced
    tags: [proxy, jdk-cglib, injection]
    question: |
      A bean implements an interface and is @Async. Another component autowires the
      concrete class type (not the interface) by field. With default proxying, what
      is the likely result?
    options:
      - "It always works, because a JDK dynamic proxy generates a subclass of the concrete class as well as implementing the interface, so it is assignable to either injection point"
      - "Injection may fail because the JDK dynamic proxy implements only the interface, not the concrete class, so it is not assignable to the concrete type (unless proxyTargetClass = true forces CGLIB)"
      - "Spring detects the type mismatch and injects the raw unproxied target instance instead, so the async advice silently stops being applied to that method"
      - "The context creates two separate beans for the class, one wrapped in a JDK proxy and one in a CGLIB proxy, and injects whichever matches the field type"
    answer: 1
    explanation: |
      With an interface present, Spring creates a JDK dynamic proxy that implements
      the interface but is not a subclass of the concrete class. Autowiring by the
      concrete type then fails to match the proxy. Injecting by the interface, or
      forcing CGLIB with proxyTargetClass = true, resolves it.
    ref: "concepts.md#proxy-aop-basis-and-the-self-invocation-caveat"
  - id: async-scheduling-caching-079
    difficulty: expert
    tags: [caching, caching-annotation, multiple-ops]
    question: |
      A save method must update the entry under key #entity.id in cache "books" and
      also evict a "bookLists" region. What is the correct construct?
    options:
      - "Put both @Cacheable and @CacheEvict directly on the method and Spring merges them into a single operation that stores the entry and clears the other region in one pass"
      - "Use @Caching to group a @CachePut(value=\"books\", key=\"#entity.id\") and a @CacheEvict(value=\"bookLists\", allEntries=true) on the same method"
      - "Call the two cache operations manually via the CacheManager API, because a single method may legally carry only one cache annotation at a time"
      - "Use a single @CachePut declaring two value arrays and a second key attribute so it writes the entity entry and evicts the list region in one annotation"
    answer: 1
    explanation: |
      @Caching aggregates multiple, potentially different cache operations on one
      method: here a @CachePut to refresh the entity entry and a @CacheEvict to clear
      the derived list region. A single method can carry several operations only via
      @Caching (or repeated annotations where supported), not by stacking @Cacheable
      and @CachePut which conflict.
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-080
    difficulty: expert
    tags: [async, completablefuture, composition, pitfall]
    question: |
      A controller calls three @Async CompletableFuture-returning services and then
      immediately does a.join(); b.join(); c.join() sequentially before combining.
      What is the performance characteristic?
    options:
      - "The three tasks still run concurrently on executor threads (they were submitted before the first join), so total wait is about the slowest; joining sequentially does not serialize their execution"
      - "The three calls run fully in parallel and total latency is roughly the slowest of the three, but only because the controller method must itself be annotated @Async for the submissions to overlap"
      - "The blocking join() calls force the three tasks to execute strictly one after another on the executor, so total latency becomes the sum of all three task durations"
      - "The first join() call implicitly cancels the other two outstanding futures, so only the first task ever completes and the remaining results come back null"
    answer: 0
    explanation: |
      All three @Async methods are invoked (and thus submitted to the executor)
      before any join, so they execute concurrently. Sequential join() calls only
      block the caller until each completes; the total wait approximates the slowest
      task, not the sum. Serialization would only occur if you invoked-then-joined
      one before invoking the next.
    ref: "concepts.md#async-return-types-void-future-and-completablefuture"
  - id: async-scheduling-caching-081
    difficulty: advanced
    tags: [async, cancellation, future]
    question: |
      A caller holds the Future from an @Async task that is already running and
      calls future.cancel(true). What does this reliably accomplish?
    options:
      - "It immediately and forcibly aborts the running task mid-execution and automatically rolls back any side effects it had already performed before the cancel call arrived"
      - "It requests interruption; a not-yet-started task will not run, but a running task is only aborted if its code actually responds to Thread interruption"
      - "It always throws a CancellationException from inside the running method body at the exact point execution had reached, unwinding the call stack immediately"
      - "It permanently reduces the executor's pool size by one, retiring the worker thread that was running the cancelled task so it is never reused"
    answer: 1
    explanation: |
      cancel(true) prevents a queued task from starting and signals interruption to
      a running one, but code that never checks the interrupt flag or blocks on
      interruptible operations keeps running to completion. Cancellation is
      cooperative, not a forced abort, and it does not undo side effects.
    ref: "concepts.md#async-return-types-void-future-and-completablefuture"
  - id: async-scheduling-caching-082
    difficulty: expert
    tags: [async, return-type, validation, proxy]
    question: |
      An @Async method is declared to return int. When is the problem detected, and
      what is the behavior?
    options:
      - "At compile time, because the annotation processor validates @Async return types during compilation and rejects any non-void, non-Future type outright"
      - "At context startup, because the async post-processor inspects every @Async signature during bean creation and fails fast when it finds an unsupported int return type"
      - "When the method is actually invoked through the proxy, where an unsupported return type triggers a runtime failure; the proxy itself is still created for the bean"
      - "Never; the primitive int result is silently autoboxed into a completed Future that the caller can inspect exactly as if a Future had been declared"
    answer: 2
    explanation: |
      @Async requires void or a Future subtype. An unsupported type like int is not
      caught at compile time, and the async proxy is still applied to the bean. The
      failure surfaces at invocation time when the interceptor cannot adapt the
      return value to an async result.
    ref: "concepts.md#async-return-types-void-future-and-completablefuture"
