topic: "Asynchronous, Scheduled, and Caching Support"
domain: spring-core
topic_slug: async-scheduling-caching
version: 1
questions:
  - id: async-scheduling-caching-001
    difficulty: beginner
    tags: [async, enable-async]
    question: |
      Which annotation must be present on a @Configuration class to activate
      processing of @Async annotations in a plain Spring Framework application?
    options:
      - "@EnableExecutor"
      - "@EnableAsync"
      - "@EnableScheduling"
      - "@AsyncSupport"
    answer: 1
    explanation: |
      @Async methods are only intercepted when @EnableAsync is present on a
      configuration class. Without it, Spring registers no async post-processor
      and the annotated methods simply run synchronously on the caller's thread.
    ref: "concepts.md#enabling-asynchronous-execution-with-enableasync-and-async"
  - id: async-scheduling-caching-002
    difficulty: beginner
    tags: [async, behavior]
    question: |
      What is the primary effect of calling a properly configured @Async method?
    options:
      - "The method is cached so subsequent calls are skipped"
      - "The method runs twice, once synchronously and once asynchronously"
      - "The caller thread blocks until the method finishes on a background thread"
      - "The method runs on a separate thread and control returns to the caller immediately"
    answer: 3
    explanation: |
      @Async submits the invocation to a TaskExecutor and returns to the caller
      right away, so the work happens on a different thread without blocking the
      caller.
    ref: "concepts.md#enabling-asynchronous-execution-with-enableasync-and-async"
  - id: async-scheduling-caching-003
    difficulty: beginner
    tags: [async, executor]
    question: |
      On what does an @Async method execute?
    options:
      - "A dedicated JVM finalizer thread"
      - "The main application thread"
      - "A TaskExecutor (Spring's Executor abstraction)"
      - "The garbage collector thread"
    answer: 2
    explanation: |
      @Async work is dispatched to a Spring TaskExecutor. If you do not define
      one, Spring falls back to a SimpleAsyncTaskExecutor by default.
    ref: "concepts.md#configuring-the-taskexecutor-for-async"
  - id: async-scheduling-caching-004
    difficulty: intermediate
    tags: [async, return-types, void]
    question: |
      For a @Async method that returns void, how are exceptions thrown inside
      the method surfaced?
    options:
      - "They are wrapped in a Future the caller can inspect"
      - "They are rethrown on the caller's thread immediately"
      - "They silently terminate the entire application"
      - "They are routed to an AsyncUncaughtExceptionHandler (default just logs them); the caller never sees them"
    answer: 3
    explanation: |
      A void @Async method cannot propagate exceptions to the caller because the
      caller already returned. Spring hands such exceptions to an
      AsyncUncaughtExceptionHandler, which by default logs them.
    ref: "concepts.md#async-return-types-void-future-and-completablefuture"
  - id: async-scheduling-caching-005
    difficulty: intermediate
    tags: [async, return-types, future]
    question: |
      For an @Async method returning Future<T>, when does an exception thrown in
      the method body reach the caller?
    options:
      - "Immediately when the method is called"
      - "Only after the application context is closed"
      - "When the caller invokes future.get()"
      - "Never; Future methods cannot throw"
    answer: 2
    explanation: |
      With a Future/CompletableFuture return type, the exception is captured and
      re-thrown (wrapped) when the caller calls get(), giving the caller a chance
      to observe failures.
    ref: "concepts.md#async-return-types-void-future-and-completablefuture"
  - id: async-scheduling-caching-006
    difficulty: intermediate
    tags: [async, completablefuture]
    question: |
      Which return type is the recommended modern choice for an @Async method
      that needs to support non-blocking composition of the result?
    options:
      - "void"
      - "Callable<T>"
      - "CompletableFuture<T>"
      - "Optional<T>"
    answer: 2
    explanation: |
      CompletableFuture supports composition operators such as thenApply and
      thenCompose and is the preferred type in modern Spring. ListenableFuture is
      deprecated in Spring 6 in its favor.
    ref: "concepts.md#async-return-types-void-future-and-completablefuture"
  - id: async-scheduling-caching-007
    difficulty: beginner
    tags: [async, return-types]
    question: |
      Which of these is NOT a valid return type for an @Async method?
    options:
      - "void"
      - "Future<String>"
      - "CompletableFuture<String>"
      - "A plain String (returned directly, not wrapped in a Future)"
    answer: 3
    explanation: |
      @Async methods must return void or a Future subtype. A directly returned
      value type such as String is not supported and causes an error at proxy
      time, because there is no way to hand a plain synchronous value back after
      returning immediately.
    ref: "concepts.md#async-return-types-void-future-and-completablefuture"
  - id: async-scheduling-caching-008
    difficulty: intermediate
    tags: [async, executor, default]
    question: |
      In Spring 6, if no TaskExecutor or bean named "taskExecutor" is defined,
      what does @Async use by default?
    options:
      - "A SimpleAsyncTaskExecutor, which by default creates a new thread per task and does not pool them"
      - "A fixed thread pool of 10 threads"
      - "Nothing; the method runs synchronously"
      - "The common ForkJoinPool"
    answer: 0
    explanation: |
      When no suitable executor bean is found, Spring falls back to a
      SimpleAsyncTaskExecutor. By default it does not reuse or bound threads
      (a new thread per task), so production code should define a real pool.
    ref: "concepts.md#configuring-the-taskexecutor-for-async"
  - id: async-scheduling-caching-009
    difficulty: intermediate
    tags: [async, executor, configuration]
    question: |
      Which interface do you implement to customize the executor and the
      uncaught-exception handler used by @Async?
    options:
      - "AsyncConfigurer"
      - "AsyncCustomizer"
      - "ExecutorConfigurer"
      - "TaskExecutorFactory"
    answer: 0
    explanation: |
      Implementing AsyncConfigurer lets you override getAsyncExecutor() and
      getAsyncUncaughtExceptionHandler() to plug in your own thread pool and
      exception handling.
    ref: "concepts.md#configuring-the-taskexecutor-for-async"
  - id: async-scheduling-caching-010
    difficulty: intermediate
    tags: [async, threadpooltaskexecutor, sizing]
    question: |
      For a ThreadPoolTaskExecutor with corePoolSize=2, queueCapacity=10, and
      maxPoolSize=5, when are threads created beyond the 2 core threads?
    options:
      - "Never; maxPoolSize is ignored when a queue is set"
      - "Only after the queue of 10 is full, up to maxPoolSize=5"
      - "Immediately for every submitted task until 5 threads exist"
      - "Only when the application context is refreshed"
    answer: 1
    explanation: |
      Like java.util.concurrent.ThreadPoolExecutor, tasks first fill core threads,
      then queue up to queueCapacity, and only when the queue is full are extra
      threads created up to maxPoolSize.
    ref: "concepts.md#configuring-the-taskexecutor-for-async"
  - id: async-scheduling-caching-011
    difficulty: intermediate
    tags: [async, named-executor]
    question: |
      What does @Async("emailExecutor") accomplish?
    options:
      - "It delays execution by the value of the emailExecutor property"
      - "It routes this method's execution to the TaskExecutor bean named emailExecutor"
      - "It disables async for methods except emailExecutor"
      - "It names the async thread emailExecutor for logging only"
    answer: 1
    explanation: |
      The value attribute of @Async names a specific executor bean, letting
      different methods use different thread pools.
    ref: "concepts.md#enabling-asynchronous-execution-with-enableasync-and-async"
  - id: async-scheduling-caching-012
    difficulty: beginner
    tags: [scheduling, enable-scheduling]
    question: |
      Which annotation enables detection and execution of @Scheduled methods?
    options:
      - "@EnableAsync"
      - "@EnableTasks"
      - "@ScheduledSupport"
      - "@EnableScheduling"
    answer: 3
    explanation: |
      @EnableScheduling registers the ScheduledAnnotationBeanPostProcessor that
      finds @Scheduled methods and registers them with a TaskScheduler.
    ref: "concepts.md#enabling-scheduling-with-enablescheduling-and-scheduled"
  - id: async-scheduling-caching-013
    difficulty: intermediate
    tags: [scheduling, method-signature]
    question: |
      What are the signature constraints for a classic @Scheduled method?
    options:
      - "It must take a single Date argument"
      - "It must be static and public"
      - "It must take no arguments and return void"
      - "It must return a boolean indicating success"
    answer: 2
    explanation: |
      A @Scheduled method cannot accept parameters (the scheduler has nothing to
      pass) and its return value is not observed (void). Since Spring 6.1 a
      CompletableFuture/reactive return is allowed for one-shot reactive tasks,
      but classic tasks are void and argument-free.
    ref: "concepts.md#enabling-scheduling-with-enablescheduling-and-scheduled"
  - id: async-scheduling-caching-014
    difficulty: intermediate
    tags: [scheduling, task-scheduler, threads]
    question: |
      By default, how many threads does Spring's scheduler use to run @Scheduled
      tasks, and what is the consequence?
    options:
      - "A single thread, so a long-running task can delay other scheduled tasks"
      - "As many threads as CPU cores, auto-detected"
      - "One thread per task, so tasks never delay each other"
      - "Exactly ten threads regardless of the number of tasks"
    answer: 0
    explanation: |
      The default TaskScheduler is single-threaded, so all scheduled tasks share
      one thread and an overrunning task can delay the others. Define a
      ThreadPoolTaskScheduler with a larger pool to parallelize.
    ref: "concepts.md#enabling-scheduling-with-enablescheduling-and-scheduled"
  - id: async-scheduling-caching-015
    difficulty: beginner
    tags: [scheduling, fixed-rate, fixed-delay]
    question: |
      From which point in time does fixedRate measure the interval to the next
      execution?
    options:
      - "From the start of the previous execution"
      - "From midnight of the current day"
      - "From application startup only"
      - "From the end of the previous execution"
    answer: 0
    explanation: |
      fixedRate schedules the next run a fixed number of milliseconds after the
      previous run began, giving a fixed frequency independent of execution time.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"
  - id: async-scheduling-caching-016
    difficulty: beginner
    tags: [scheduling, fixed-delay]
    question: |
      From which point does fixedDelay measure the interval to the next execution?
    options:
      - "From the scheduled cron boundary"
      - "From the JVM launch time"
      - "From the start of the previous execution"
      - "From the end (completion) of the previous execution"
    answer: 3
    explanation: |
      fixedDelay schedules the next run a fixed number of milliseconds after the
      previous run finishes, guaranteeing a gap between consecutive executions.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"
  - id: async-scheduling-caching-017
    difficulty: intermediate
    tags: [scheduling, fixed-rate, fixed-delay, scenario]
    question: |
      A task takes about 7 seconds to run. Which configuration guarantees at
      least a 5-second gap between the end of one run and the start of the next?
    options:
      - "initialDelay = 5000 with no other attribute"
      - "cron = \"*/5 * * * * *\""
      - "fixedRate = 5000"
      - "fixedDelay = 5000"
    answer: 3
    explanation: |
      fixedDelay measures from completion, so it always leaves the specified gap
      after the previous run ends regardless of execution time. fixedRate measures
      from the start and would not guarantee that gap.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"
  - id: async-scheduling-caching-018
    difficulty: beginner
    tags: [scheduling, initial-delay]
    question: |
      What does the initialDelay attribute of @Scheduled control?
    options:
      - "The delay before the first execution, combined with fixedRate or fixedDelay"
      - "The timezone offset applied to a cron expression"
      - "The delay between every subsequent execution"
      - "The maximum time a task may run before being cancelled"
    answer: 0
    explanation: |
      initialDelay delays only the first execution; the recurring cadence is still
      governed by fixedRate or fixedDelay.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"
  - id: async-scheduling-caching-019
    difficulty: intermediate
    tags: [scheduling, cron, fields]
    question: |
      How many fields does a Spring cron expression have, and what is the first
      field?
    options:
      - "Six fields; the first field is seconds"
      - "Seven fields; the first field is milliseconds"
      - "Five fields; the first field is minutes"
      - "Six fields; the first field is minutes"
    answer: 0
    explanation: |
      Spring cron expressions have 6 fields: second, minute, hour, day-of-month,
      month, day-of-week. This differs from the classic Unix 5-field crontab,
      which has no seconds field.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"
  - id: async-scheduling-caching-020
    difficulty: intermediate
    tags: [scheduling, cron]
    question: |
      What does the cron expression "0 0 9 * * MON-FRI" fire on?
    options:
      - "Every 9 seconds on weekdays"
      - "09:00 on the first day of each month"
      - "09:00:00 every weekday (Monday through Friday)"
      - "Nine times per hour Monday through Friday"
    answer: 2
    explanation: |
      Fields are second=0, minute=0, hour=9, day-of-month=*, month=*,
      day-of-week=MON-FRI, so it triggers at 09:00:00 on weekdays.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"
  - id: async-scheduling-caching-021
    difficulty: intermediate
    tags: [scheduling, cron, timezone]
    question: |
      Which @Scheduled attribute specifies the time zone used to interpret a cron
      expression?
    options:
      - "timezone"
      - "offset"
      - "locale"
      - "zone"
    answer: 3
    explanation: |
      The zone attribute (e.g. zone = "America/New_York") sets the time zone for
      a cron trigger; without it the server's local time zone is used.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"
  - id: async-scheduling-caching-022
    difficulty: beginner
    tags: [caching, enable-caching]
    question: |
      Which annotation activates Spring's declarative caching annotations?
    options:
      - "@EnableAsync"
      - "@CacheSupport"
      - "@EnableCacheManager"
      - "@EnableCaching"
    answer: 3
    explanation: |
      @EnableCaching turns on the caching advice so @Cacheable, @CachePut, and
      @CacheEvict are honored.
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-023
    difficulty: beginner
    tags: [caching, cacheable]
    question: |
      When does the body of a @Cacheable method actually execute?
    options:
      - "On every invocation, always"
      - "Only the first time the application starts"
      - "Only on a cache miss; on a hit the cached value is returned and the body is skipped"
      - "Only when the cache is manually cleared"
    answer: 2
    explanation: |
      @Cacheable consults the cache first. On a hit it returns the stored value
      and skips the method; on a miss it runs the method and stores the result.
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-024
    difficulty: intermediate
    tags: [caching, cacheput]
    question: |
      How does @CachePut differ from @Cacheable?
    options:
      - "@CachePut skips the method on a hit, just like @Cacheable"
      - "@CachePut always executes the method and updates the cache with the result"
      - "@CachePut deletes the cache entry after execution"
      - "@CachePut only reads from the cache and never writes"
    answer: 1
    explanation: |
      @CachePut always runs the method and puts the fresh return value into the
      cache, making it ideal for update operations. Unlike @Cacheable, it never
      skips execution.
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-025
    difficulty: beginner
    tags: [caching, cacheevict]
    question: |
      What does @CacheEvict do?
    options:
      - "Adds a new entry to the cache"
      - "Removes one or all entries from a cache region"
      - "Serializes the cache to disk"
      - "Reads an entry from the cache without modifying it"
    answer: 1
    explanation: |
      @CacheEvict removes cached data: a specific key by default, or the entire
      region when allEntries = true.
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-026
    difficulty: intermediate
    tags: [caching, cacheevict, all-entries]
    question: |
      Which @CacheEvict attribute clears every entry in the named cache rather
      than a single key?
    options:
      - "flush = true"
      - "allEntries = true"
      - "clearAll = true"
      - "evictAll = true"
    answer: 1
    explanation: |
      Setting allEntries = true evicts the whole cache region; without it, only
      the entry for the resolved key is removed.
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-027
    difficulty: intermediate
    tags: [caching, key, spel]
    question: |
      By default (no key specified), how does Spring compute the cache key for a
      method with a single argument?
    options:
      - "It uses the single argument itself as the key via SimpleKeyGenerator"
      - "It requires you to always specify key explicitly or it fails"
      - "It uses the method name only, ignoring arguments"
      - "It always uses a constant key of 0"
    answer: 0
    explanation: |
      The default SimpleKeyGenerator uses the sole parameter as the key. With
      multiple parameters it builds a SimpleKey from all of them; with none it
      uses an empty SimpleKey.
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-028
    difficulty: intermediate
    tags: [caching, unless, condition]
    question: |
      What is the difference between the condition and unless attributes on a
      caching annotation?
    options:
      - "condition is evaluated after invocation; unless is evaluated before"
      - "Both are evaluated only at application startup"
      - "condition applies to eviction only; unless applies to caching only"
      - "condition is evaluated before invocation; unless is evaluated after and can reference #result"
    answer: 3
    explanation: |
      condition gates whether caching applies and is checked before the method
      runs, so it cannot see the result. unless is checked after execution and can
      use #result, e.g. unless = "#result == null".
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-029
    difficulty: intermediate
    tags: [caching, sync, stampede]
    question: |
      Which @Cacheable option serializes concurrent cache misses for the same key
      so the method runs only once (avoiding a cache stampede)?
    options:
      - "lock = true"
      - "single = true"
      - "sync = true"
      - "atomic = true"
    answer: 2
    explanation: |
      @Cacheable(sync = true) ensures that when multiple threads miss on the same
      key concurrently, only one computes the value while the others wait.
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-030
    difficulty: intermediate
    tags: [caching, cacheevict, before-invocation]
    question: |
      What does @CacheEvict(beforeInvocation = true) change compared to the
      default?
    options:
      - "Eviction happens twice, before and after the method"
      - "It disables eviction entirely"
      - "Eviction happens before the method runs, so it occurs even if the method throws"
      - "It caches the result before evicting"
    answer: 2
    explanation: |
      By default eviction occurs after a successful return. With
      beforeInvocation = true, the entry is removed before the method executes, so
      the cache is cleared even if the method throws an exception.
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-031
    difficulty: beginner
    tags: [caching, cache-manager]
    question: |
      In plain Spring Framework (not Spring Boot), what must you provide for
      @EnableCaching to work?
    options:
      - "A TaskScheduler bean"
      - "A CacheManager bean"
      - "An @Async executor bean"
      - "Nothing; a CacheManager is auto-created"
    answer: 1
    explanation: |
      @EnableCaching does not create a CacheManager. In core Spring you must
      declare a CacheManager bean yourself. Spring Boot differs by auto-configuring
      one.
    ref: "concepts.md#the-cachemanager-abstraction"
  - id: async-scheduling-caching-032
    difficulty: intermediate
    tags: [caching, cache-manager, spi]
    question: |
      What does the CacheManager abstraction primarily provide?
    options:
      - "A thread pool for running cache operations asynchronously"
      - "A registry that returns named Cache instances via getCache(name)"
      - "A concrete distributed cache implementation with built-in TTL"
      - "Automatic JSON serialization of all cached objects"
    answer: 1
    explanation: |
      CacheManager is an SPI whose main job is to hand out named Cache instances.
      It is a thin abstraction; TTL, eviction, and serialization are backend
      concerns handled by the underlying provider.
    ref: "concepts.md#the-cachemanager-abstraction"
  - id: async-scheduling-caching-033
    difficulty: intermediate
    tags: [caching, cache-manager, implementations]
    question: |
      Which CacheManager is a simple in-JVM implementation backed by
      ConcurrentHashMap with no TTL or size limit, suitable for tests?
    options:
      - "JCacheCacheManager"
      - "RedisCacheManager"
      - "ConcurrentMapCacheManager"
      - "CaffeineCacheManager"
    answer: 2
    explanation: |
      ConcurrentMapCacheManager stores entries in ConcurrentHashMaps. It is simple
      and unbounded (no expiry/size limits), so it is best for dev and tests, not
      production.
    ref: "concepts.md#the-cachemanager-abstraction"
  - id: async-scheduling-caching-034
    difficulty: intermediate
    tags: [caching, ttl, backend]
    question: |
      If you need time-based expiration (TTL) of cache entries, why is
      ConcurrentMapCacheManager insufficient?
    options:
      - "TTL requires @Cacheable(ttl = ...) which is unsupported"
      - "The abstraction does not implement TTL itself; you need a backend like Caffeine, Redis, or a JCache provider"
      - "TTL is only available when @EnableCaching sets expireAfter"
      - "ConcurrentMapCacheManager supports TTL only in Spring 6.2+"
    answer: 1
    explanation: |
      Expiration and eviction are backend responsibilities. ConcurrentMapCacheManager
      has none, so for TTL you use Caffeine, Redis, or a JSR-107 provider that
      supports it.
    ref: "concepts.md#the-cachemanager-abstraction"
  - id: async-scheduling-caching-035
    difficulty: beginner
    tags: [proxy, aop, self-invocation]
    question: |
      Why does calling a @Cacheable or @Async method from another method in the
      SAME class (via this) usually bypass the caching/async behavior?
    options:
      - "The internal call does not pass through the Spring proxy, so the advice never runs"
      - "Annotations only work on the first bean created"
      - "The JVM inlines all same-class calls, removing annotations"
      - "Spring caches only the first method in a class"
    answer: 0
    explanation: |
      The advice lives in a proxy that wraps the bean from the outside. An internal
      this call goes directly to the target object, so the proxy is not involved
      and the async/caching advice is skipped. This is the classic self-invocation
      caveat.
    ref: "concepts.md#proxy-aop-basis-and-the-self-invocation-caveat"
  - id: async-scheduling-caching-036
    difficulty: intermediate
    tags: [proxy, aop, jdk-cglib]
    question: |
      When does Spring use a CGLIB (class-based) proxy instead of a JDK dynamic
      (interface-based) proxy for these features?
    options:
      - "When the bean implements no interface, or proxyTargetClass = true is set"
      - "Always; JDK dynamic proxies are never used"
      - "Only for @Scheduled beans, never for @Async or caching"
      - "Only when the bean is annotated with @Primary"
    answer: 0
    explanation: |
      Spring uses a JDK dynamic proxy when the target implements an interface, and
      a CGLIB subclass proxy when it does not (or when proxyTargetClass = true
      forces class-based proxying).
    ref: "concepts.md#proxy-aop-basis-and-the-self-invocation-caveat"
  - id: async-scheduling-caching-037
    difficulty: intermediate
    tags: [proxy, aop, aspectj, self-invocation]
    question: |
      Which approach genuinely makes self-invocation of an @Async method work,
      because the advice is woven into the class bytecode itself?
    options:
      - "Setting proxyTargetClass = true"
      - "Increasing the executor pool size"
      - "Marking the method final"
      - "Using mode = ASPECTJ (compile-time or load-time weaving)"
    answer: 3
    explanation: |
      AspectJ weaving inserts the advice directly into the target class, so even
      internal this calls are intercepted. Proxy mode (the default) cannot do this
      regardless of proxyTargetClass.
    ref: "concepts.md#proxy-aop-basis-and-the-self-invocation-caveat"
  - id: async-scheduling-caching-038
    difficulty: intermediate
    tags: [proxy, method-visibility]
    question: |
      With the default proxy-based mechanism, which method visibility is required
      for @Async / @Cacheable advice to be applied?
    options:
      - "protected only"
      - "private"
      - "public and non-final"
      - "static"
    answer: 2
    explanation: |
      Default proxies advise public, non-final methods. Private, static, or final
      methods are not intercepted (CGLIB cannot override final/static; JDK proxies
      only expose interface methods).
    ref: "concepts.md#proxy-aop-basis-and-the-self-invocation-caveat"
  - id: async-scheduling-caching-039
    difficulty: beginner
    tags: [proxy, spring-bean]
    question: |
      For @Async, @Scheduled, or @Cacheable behavior to take effect, the object
      must be:
    options:
      - "Declared final"
      - "A static utility class"
      - "A Spring-managed bean obtained from the container"
      - "Created with the new keyword in application code"
    answer: 2
    explanation: |
      Only Spring-managed beans get wrapped in proxies. If you instantiate the
      object yourself with new, there is no proxy and none of the declarative
      behavior applies.
    ref: "concepts.md#proxy-aop-basis-and-the-self-invocation-caveat"
  - id: async-scheduling-caching-040
    difficulty: intermediate
    tags: [caching, cacheable, cacheput, conflict]
    question: |
      Why should you avoid placing both @Cacheable and @CachePut on the same
      method?
    options:
      - "Their behaviors conflict: @Cacheable skips the method on a hit while @CachePut always executes it"
      - "Spring throws a compilation error for any double annotation"
      - "It doubles the memory used by every cache entry"
      - "@CachePut silently disables @EnableCaching"
    answer: 0
    explanation: |
      @Cacheable wants to skip execution on a hit, but @CachePut wants to always
      execute and update the cache. Combining them produces contradictory,
      confusing behavior, so they should not be used together on one method.
    ref: "concepts.md#enabling-caching-with-enablecaching-cacheable-cacheevict-and-cacheput"
  - id: async-scheduling-caching-041
    difficulty: beginner
    tags: [async, class-level]
    question: |
      What happens if you place @Async at the class level rather than on a single
      method?
    options:
      - "Only the first method declared becomes asynchronous"
      - "It is ignored; @Async is method-only"
      - "Only the constructor becomes asynchronous"
      - "All public methods of the class become asynchronous"
    answer: 3
    explanation: |
      @Async can be applied at the type level, in which case every (proxyable)
      method of the class is treated as asynchronous.
    ref: "concepts.md#enabling-asynchronous-execution-with-enableasync-and-async"
  - id: async-scheduling-caching-042
    difficulty: intermediate
    tags: [scheduling, cron, disabled]
    question: |
      In Spring 5.3+, what does a @Scheduled cron value of "-" mean?
    options:
      - "The task runs every second"
      - "The scheduled task is disabled (Scheduled.CRON_DISABLED)"
      - "The task runs once at startup"
      - "It is an invalid expression that throws an exception"
    answer: 1
    explanation: |
      The special cron value "-" (Scheduled.CRON_DISABLED) disables the task,
      which is handy when the expression is supplied via a property and you want to
      turn it off.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"
  - id: async-scheduling-caching-043
    difficulty: intermediate
    tags: [caching, null-values]
    question: |
      By default, what happens when a @Cacheable method's cached value for a key
      is null?
    options:
      - "Nulls are never stored, forcing the method to run every time"
      - "The null is stored and counts as a cache hit, so the method is not re-run"
      - "Spring throws a NullPointerException"
      - "The entire cache is cleared automatically"
    answer: 1
    explanation: |
      Spring's abstraction stores null values by default (allowNullValues = true),
      so a cached null is a legitimate hit and the method body is skipped until the
      entry is evicted.
    ref: "concepts.md#the-cachemanager-abstraction"
  - id: async-scheduling-caching-044
    difficulty: beginner
    tags: [scheduling, async, combined]
    question: |
      What is the effect of annotating a method with BOTH @Scheduled and @Async?
    options:
      - "Each scheduled trigger runs on the async executor instead of blocking the scheduler thread"
      - "The method runs twice per trigger"
      - "It causes a configuration error"
      - "Scheduling is disabled and only async remains"
    answer: 0
    explanation: |
      The two features compose: the scheduler fires the trigger, and because the
      method is @Async, the actual work is handed to the TaskExecutor, freeing the
      scheduler thread.
    ref: "concepts.md#enabling-scheduling-with-enablescheduling-and-scheduled"
