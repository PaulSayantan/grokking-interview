topic: "Advanced Bean Wiring: FactoryBean, Lazy, and Custom Registration"
domain: spring-core
topic_slug: advanced-bean-wiring
version: 1
questions:
  - id: advanced-bean-wiring-001
    difficulty: beginner
    tags: [factorybean, basics]
    question: |
      A class implements `FactoryBean<Connection>` and is registered under the
      name `conn`. What does `ctx.getBean("conn")` return?
    options:
      - "The result of the factory's getObject() method (a Connection)"
      - "The FactoryBean instance itself, not the object it produces"
      - "A CGLIB proxy wrapping the FactoryBean's getObject() output"
      - "null, because FactoryBeans cannot be looked up by their plain name"
    answer: 0
    explanation: |
      When a FactoryBean is registered under a name, asking for that plain name
      returns the product of `getObject()` — the container transparently unwraps
      the factory. To get the FactoryBean itself you must prefix with `&`.
    ref: "concepts.md#factorybean-versus-a-bean-factory-method"

  - id: advanced-bean-wiring-002
    difficulty: beginner
    tags: [factorybean, ampersand-prefix]
    question: |
      Given a FactoryBean registered as `conn`, how do you retrieve the
      FactoryBean instance itself rather than the object it produces?
    options:
      - "ctx.getBean(\"conn.factory\")"
      - "ctx.getBean(\"@conn\")"
      - "ctx.getBean(\"&conn\")"
      - "ctx.getBean(\"conn\", FactoryBean.class)"
    answer: 2
    explanation: |
      Prefixing the bean name with `&` (the constant
      `BeanFactory.FACTORY_BEAN_PREFIX`) dereferences to the FactoryBean
      instance itself instead of its `getObject()` product.
    ref: "concepts.md#factorybean-versus-a-bean-factory-method"

  - id: advanced-bean-wiring-003
    difficulty: beginner
    tags: [factorybean, interface]
    question: |
      Which method of `FactoryBean<T>` produces the object that the container
      actually exposes as the bean?
    options:
      - "getObjectType()"
      - "isSingleton()"
      - "getBean()"
      - "getObject()"
    answer: 3
    explanation: |
      `getObject()` returns the instance exposed as the bean. `getObjectType()`
      reports the type (may be null), and `isSingleton()` says whether the
      product is cached.
    ref: "concepts.md#factorybean-versus-a-bean-factory-method"

  - id: advanced-bean-wiring-004
    difficulty: intermediate
    tags: [factorybean, get-object-type]
    question: |
      What is the consequence of a FactoryBean's `getObjectType()` returning
      `null`?
    options:
      - "The context refresh fails immediately with a BeanCreationException naming the untyped factory"
      - "The product is always downgraded to prototype scope and re-created on every single lookup"
      - "Type-based autowiring and getBeansOfType matching are weakened, since the container cannot know the product type without instantiating the factory"
      - "The FactoryBean is silently ignored and its bean definition is dropped before instantiation"
    answer: 2
    explanation: |
      Returning `null` means the product type is unknown until instantiation.
      That degrades type-based autowiring and `getBeansOfType` matching because
      the container cannot match by type without creating the factory's product.
    ref: "concepts.md#factorybean-versus-a-bean-factory-method"

  - id: advanced-bean-wiring-005
    difficulty: intermediate
    tags: [factorybean, bean-method, comparison]
    question: |
      When is implementing `FactoryBean<T>` typically preferred over just
      writing a `@Bean` factory method?
    options:
      - "Whenever you need a singleton bean rather than a prototype-scoped one"
      - "Only when the produced bean has no injected collaborators of its own"
      - "It is always preferred because @Bean methods can only expose prototype beans"
      - "For framework/library integration and cases where the product type is only known at runtime and must be advertised via getObjectType()"
    answer: 3
    explanation: |
      For ordinary application code a `@Bean` method is simpler and equally
      capable. `FactoryBean` shines for infrastructure that Spring must
      recognize as a factory (proxies, JNDI, mapper factories) or when the
      exposed type must be reported before the product exists.
    ref: "concepts.md#factorybean-versus-a-bean-factory-method"

  - id: advanced-bean-wiring-006
    difficulty: intermediate
    tags: [factorybean, singleton]
    question: |
      What does returning `true` from a FactoryBean's `isSingleton()` control?
    options:
      - "Whether the product of getObject() is cached and reused rather than recreated on each request"
      - "Whether the FactoryBean instance itself is stored as a singleton in the container"
      - "Whether the product is created eagerly at refresh instead of on first access"
      - "Whether the produced bean is eligible for by-type autowiring into collaborators"
    answer: 0
    explanation: |
      `isSingleton()` declares whether the object returned by `getObject()`
      should be cached (one shared instance) or produced fresh each time the
      bean is requested.
    ref: "concepts.md#factorybean-versus-a-bean-factory-method"

  - id: advanced-bean-wiring-007
    difficulty: intermediate
    tags: [factorybean, smartfactorybean]
    question: |
      Which interface extends `FactoryBean<T>` and adds `isEagerInit()` so a
      singleton factory's product can be created during context refresh?
    options:
      - "EagerFactoryBean"
      - "SmartFactoryBean"
      - "InitializingFactoryBean"
      - "AbstractFactoryBean"
    answer: 1
    explanation: |
      `SmartFactoryBean<T>` adds `isPrototype()` and `isEagerInit()`. When
      `isEagerInit()` returns true, the singleton product is created eagerly at
      refresh instead of lazily on first access.
    ref: "concepts.md#factorybean-versus-a-bean-factory-method"

  - id: advanced-bean-wiring-008
    difficulty: beginner
    tags: [lazy, startup]
    question: |
      By default, when are singleton beans instantiated in a Spring
      ApplicationContext?
    options:
      - "Lazily, only when first requested"
      - "Never until the application explicitly calls a create() method"
      - "Eagerly, during context refresh (startup)"
      - "Only after the first HTTP request is received"
    answer: 2
    explanation: |
      Singletons are eagerly instantiated during context refresh by default.
      `@Lazy` defers a singleton's creation until first requested/injected.
    ref: "concepts.md#lazy-initialization-with-lazy"

  - id: advanced-bean-wiring-009
    difficulty: beginner
    tags: [lazy, annotation]
    question: |
      What does placing `@Lazy` on a `@Component` singleton do?
    options:
      - "Silently switches the bean's scope from singleton to prototype"
      - "Prevents the bean from being autowired into any other component"
      - "Forces the bean to be instantiated first, ahead of all other beans"
      - "Defers the bean's creation until it is first requested or injected somewhere that resolves it"
    answer: 3
    explanation: |
      `@Lazy` on a bean definition marks that singleton to be created on first
      use rather than eagerly at startup.
    ref: "concepts.md#lazy-initialization-with-lazy"

  - id: advanced-bean-wiring-010
    difficulty: intermediate
    tags: [lazy, injection-point, proxy]
    question: |
      What does `@Lazy` on an injection point (e.g. `@Autowired @Lazy Foo foo`)
      actually inject?
    options:
      - "A lazy-resolution proxy; the real bean is resolved on the first method call"
      - "A null reference that stays null until the bean is created somewhere else"
      - "A brand-new prototype instance produced on every single field access"
      - "The FactoryBean responsible for producing Foo, rather than Foo itself"
    answer: 0
    explanation: |
      At an injection point, `@Lazy` injects a proxy that stands in for the
      dependency; the actual bean is fetched from the container the first time a
      method is invoked on the proxy.
    ref: "concepts.md#lazy-initialization-with-lazy"

  - id: advanced-bean-wiring-011
    difficulty: intermediate
    tags: [lazy, circular-dependency]
    question: |
      How can `@Lazy` be used to break a constructor-injection circular
      dependency between beans A and B?
    options:
      - "Mark both A and B with @Lazy so that neither bean is ever actually created"
      - "Mark one side's constructor parameter @Lazy so it receives a proxy, letting that bean finish constructing"
      - "@Lazy has no effect on constructor cycles and cannot break them in any way"
      - "Add @Lazy to the @Configuration class so the entire context startup is deferred"
    answer: 1
    explanation: |
      Constructor cycles otherwise throw `BeanCurrentlyInCreationException`.
      Marking one constructor parameter `@Lazy` injects a proxy instead of the
      fully built bean, so the first bean can complete construction and break
      the cycle.
    ref: "concepts.md#lazy-initialization-with-lazy"

  - id: advanced-bean-wiring-012
    difficulty: intermediate
    tags: [lazy, eager-consumer]
    question: |
      A bean `X` is annotated `@Lazy`, but a non-lazy singleton `Y` injects `X`
      directly (not through a lazy proxy). When is `X` created?
    options:
      - "Never, because the @Lazy marker on X always overrides its consumers"
      - "Only when application code explicitly calls ctx.getBean(\"X\") at runtime"
      - "After the context is fully closed, during the destruction callback phase"
      - "Eagerly during startup, because the eager consumer Y forces its creation"
    answer: 3
    explanation: |
      `@Lazy` on the bean has no delaying effect if an eager consumer resolves
      it at startup. To truly defer, the injection point must also be lazy (or
      go through a proxy / ObjectProvider).
    ref: "concepts.md#lazy-initialization-with-lazy"

  - id: advanced-bean-wiring-013
    difficulty: beginner
    tags: [lazy, constructor-cycle]
    question: |
      Which kind of circular dependency canNOT be resolved by Spring's ordinary
      singleton early-reference mechanism (and thus may need `@Lazy`)?
    options:
      - "Setter-injection cycles"
      - "Field-injection cycles"
      - "Constructor-injection cycles"
      - "Cycles involving prototype scope only"
    answer: 2
    explanation: |
      Field/setter singleton cycles can be resolved via early references, but
      constructor-injection cycles cannot and throw
      `BeanCurrentlyInCreationException` — a common reason to apply `@Lazy` to
      one side.
    ref: "concepts.md#lazy-initialization-with-lazy"

  - id: advanced-bean-wiring-014
    difficulty: beginner
    tags: [objectprovider, on-demand]
    question: |
      What is the primary purpose of injecting an `ObjectProvider<Foo>` instead
      of `Foo` directly?
    options:
      - "To obtain Foo on demand and to express optional or multiple candidates without failing at injection time"
      - "To force Foo into singleton scope regardless of its declared scope"
      - "To make Foo eagerly initialized during context refresh instead of later"
      - "To resolve Foo directly from a static registry, bypassing the Spring container"
    answer: 0
    explanation: |
      `ObjectProvider<T>` provides deferred, on-demand lookup and handles
      optionality (`getIfAvailable`), uniqueness (`getIfUnique`), and
      multiplicity (`stream`) gracefully.
    ref: "concepts.md#objectprovider-and-objectfactory-for-on-demand-lookup"

  - id: advanced-bean-wiring-015
    difficulty: beginner
    tags: [objectfactory, interface]
    question: |
      What single method does the `ObjectFactory<T>` interface declare?
    options:
      - "getIfAvailable()"
      - "stream()"
      - "getObject()"
      - "provide()"
    answer: 2
    explanation: |
      `ObjectFactory<T>` declares only `getObject()`. `ObjectProvider<T>`
      extends it and adds the richer `getIfAvailable`, `getIfUnique`, and stream
      methods.
    ref: "concepts.md#objectprovider-and-objectfactory-for-on-demand-lookup"

  - id: advanced-bean-wiring-016
    difficulty: intermediate
    tags: [objectprovider, prototype]
    question: |
      A singleton bean needs a fresh prototype instance on each use. How can an
      injected `ObjectProvider<Task>` provide it (Task is prototype-scoped)?
    options:
      - "Store the result of a single getObject() call in a field and reuse that instance"
      - "Inject Task directly, since the field is re-resolved to a new instance on each access"
      - "Use taskProvider.getIfUnique(), which caches and returns one shared instance"
      - "Call taskProvider.getObject() each time, which performs a fresh lookup and returns a new Task"
    answer: 3
    explanation: |
      Each `getObject()` call triggers a fresh container lookup. For a prototype
      bean that yields a new instance every call — a lightweight alternative to
      `@Lookup` or scoped proxies.
    ref: "concepts.md#objectprovider-and-objectfactory-for-on-demand-lookup"

  - id: advanced-bean-wiring-017
    difficulty: intermediate
    tags: [objectprovider, optional]
    question: |
      Which `ObjectProvider` method returns a supplied default when no matching
      bean exists, avoiding a startup failure?
    options:
      - "getObject(), which returns a null default when no candidate bean is found"
      - "getIfAvailable(Supplier<T> default)"
      - "stream(), which yields an empty stream and a default element when none match"
      - "orderedStream(), which substitutes the supplied default at the head of the stream"
    answer: 1
    explanation: |
      `getIfAvailable(Supplier<T>)` returns the supplied default when there are
      zero candidates, letting you provide a graceful fallback (e.g. a no-op
      implementation).
    ref: "concepts.md#objectprovider-and-objectfactory-for-on-demand-lookup"

  - id: advanced-bean-wiring-018
    difficulty: intermediate
    tags: [objectprovider, getifavailable, getifunique]
    question: |
      With multiple candidate beans (and none marked primary), how do
      `getIfAvailable()` and `getIfUnique()` differ?
    options:
      - "getIfAvailable() throws on ambiguity, while getIfUnique() returns null when there are multiple candidates"
      - "Both return null whenever more than one candidate bean is present"
      - "getIfAvailable() returns null on ambiguity, while getIfUnique() throws NoUniqueBeanDefinitionException"
      - "Both throw NoSuchBeanDefinitionException as soon as candidates are ambiguous"
    answer: 0
    explanation: |
      `getIfAvailable()` returns null only for zero candidates but throws on
      ambiguity (unless one is primary). `getIfUnique()` returns null when there
      are zero OR multiple candidates.
    ref: "concepts.md#objectprovider-and-objectfactory-for-on-demand-lookup"

  - id: advanced-bean-wiring-019
    difficulty: intermediate
    tags: [objectprovider, stream, ordering]
    question: |
      Which `ObjectProvider` method returns all matching beans as a stream that
      honors `@Order` / `Ordered`?
    options:
      - "stream()"
      - "getIfUnique()"
      - "orderedStream()"
      - "iterator()"
    answer: 2
    explanation: |
      `orderedStream()` returns matching beans in a stream that respects
      `@Order` / the `Ordered` interface. Plain `stream()` does not guarantee
      ordering.
    ref: "concepts.md#objectprovider-and-objectfactory-for-on-demand-lookup"

  - id: advanced-bean-wiring-020
    difficulty: intermediate
    tags: [objectprovider, jsr330, jakarta]
    question: |
      In Spring Framework 6.x, which JSR-330 provider type can be injected with
      "call .get() to obtain the bean" semantics (given the API jar is present)?
    options:
      - "javax.inject.Provider"
      - "org.springframework.inject.Provider"
      - "java.util.function.Supplier only"
      - "jakarta.inject.Provider"
    answer: 3
    explanation: |
      Spring 6 targets Jakarta EE 9+, so the JSR-330 provider is
      `jakarta.inject.Provider` (it was `javax.inject.Provider` in Spring 5).
      `ObjectProvider` is Spring's native superset.
    ref: "concepts.md#objectprovider-and-objectfactory-for-on-demand-lookup"

  - id: advanced-bean-wiring-021
    difficulty: intermediate
    tags: [objectprovider, lazy]
    question: |
      Does injecting an `ObjectProvider<Foo>` cause `Foo` to be created at
      injection time?
    options:
      - "No, the target is only created when getObject() (or a lookup method) is called"
      - "Yes, ObjectProvider eagerly resolves its target when injected"
      - "Yes, but only when Foo is a singleton, since singletons resolve eagerly"
      - "Only if Foo has no dependencies of its own, so it can be built immediately"
    answer: 0
    explanation: |
      `ObjectProvider` is lazy by nature: injecting it does not create the
      target; only calling `getObject()`/`getIfAvailable()` triggers the lookup.
      This makes it another way to defer or break wiring.
    ref: "concepts.md#objectprovider-and-objectfactory-for-on-demand-lookup"

  - id: advanced-bean-wiring-022
    difficulty: beginner
    tags: [lookup, method-injection]
    question: |
      What problem does `@Lookup` method injection primarily solve?
    options:
      - "Injecting the very same shared singleton instance into many collaborating beans"
      - "Letting a singleton obtain a fresh prototype-scoped bean on each call instead of freezing one instance"
      - "Making a prototype-scoped bean behave like a shared singleton across the context"
      - "Removing the need for a Spring container by resolving beans from a static registry"
    answer: 1
    explanation: |
      `@Lookup` addresses the scope-mismatch where a singleton needs a new
      prototype each invocation. Spring overrides the lookup method to return a
      fresh bean from the container every call.
    ref: "concepts.md#lookup-method-injection-with-lookup"

  - id: advanced-bean-wiring-023
    difficulty: intermediate
    tags: [lookup, cglib]
    question: |
      How does Spring implement a `@Lookup` method?
    options:
      - "By reflection on a stored field that Spring populates with a fresh instance"
      - "By replacing the method body with a JDK dynamic proxy backed by an InvocationHandler"
      - "By generating a CGLIB subclass that overrides the method to call getBean(...)"
      - "By caching a single instance at startup and returning that cached reference each call"
    answer: 2
    explanation: |
      Spring uses CGLIB to create a runtime subclass overriding the `@Lookup`
      method; the generated override delegates to `getBean(...)` to fetch a
      fresh instance each call.
    ref: "concepts.md#lookup-method-injection-with-lookup"

  - id: advanced-bean-wiring-024
    difficulty: intermediate
    tags: [lookup, resolution]
    question: |
      How does `@Lookup` (with no value) determine which bean to return?
    options:
      - "By the method name"
      - "By the first bean registered in the context"
      - "It always returns null"
      - "By the method's return type"
    answer: 3
    explanation: |
      `@Lookup` with no value resolves the bean by the method's return type.
      `@Lookup("beanName")` resolves by name instead.
    ref: "concepts.md#lookup-method-injection-with-lookup"

  - id: advanced-bean-wiring-025
    difficulty: intermediate
    tags: [lookup, constraints]
    question: |
      Which constraint applies to a `@Lookup` method because Spring subclasses
      the containing class?
    options:
      - "The method (and class) must not be final or private, so it can be overridden"
      - "The method must be declared static so the container can invoke it without an instance"
      - "The method must return void and assign the looked-up bean to a field instead"
      - "The method must accept exactly one argument naming the target bean to resolve"
    answer: 0
    explanation: |
      Because CGLIB subclassing is used, the containing class and the lookup
      method cannot be final or private, and the method should take no
      arguments so the signature can be overridden.
    ref: "concepts.md#lookup-method-injection-with-lookup"

  - id: advanced-bean-wiring-026
    difficulty: intermediate
    tags: [lookup, alternatives]
    question: |
      Which modern approach achieves the same "fresh instance per call" as
      `@Lookup` without CGLIB subclassing or an abstract method?
    options:
      - "Injecting the prototype directly with @Autowired, which re-resolves it on every access"
      - "Calling getObject() on an injected ObjectProvider<T> (or .get() on a Provider<T>)"
      - "Marking the singleton @Lazy so its dependencies are re-created on each invocation"
      - "Using a static factory field that hands out a new instance whenever it is read"
    answer: 1
    explanation: |
      An injected `ObjectProvider<T>.getObject()` (or JSR-330
      `Provider<T>.get()`) fetches a fresh instance per call without subclassing
      or an abstract class — usually the preferred modern alternative to
      `@Lookup`.
    ref: "concepts.md#lookup-method-injection-with-lookup"

  - id: advanced-bean-wiring-027
    difficulty: beginner
    tags: [bean-definition, metadata]
    question: |
      A `BeanDefinition` in Spring represents what?
    options:
      - "A fully constructed, ready-to-use bean instance held in the singleton cache"
      - "A thread pool the container uses to create beans concurrently at refresh"
      - "The container's metadata describing a bean (class, scope, args, etc.), not an instance"
      - "A cache of the autowired dependencies that have already been injected into a bean"
    answer: 2
    explanation: |
      A `BeanDefinition` is metadata: the bean's class, scope, constructor args,
      property values, lazy flag, and so on — describing how to create the bean,
      not the instance itself.
    ref: "concepts.md#programmatic-bean-registration-with-beandefinitionregistry"

  - id: advanced-bean-wiring-028
    difficulty: intermediate
    tags: [bdrpp, registration]
    question: |
      Which interface's callback is the primary hook for programmatically ADDING
      new bean definitions after they are loaded but before beans are
      instantiated?
    options:
      - "BeanPostProcessor (postProcessBeforeInitialization on each new instance)"
      - "InitializingBean (afterPropertiesSet, called once the bean is fully wired)"
      - "ApplicationListener (onApplicationEvent, fired after the context is refreshed)"
      - "BeanDefinitionRegistryPostProcessor (postProcessBeanDefinitionRegistry)"
    answer: 3
    explanation: |
      `BeanDefinitionRegistryPostProcessor.postProcessBeanDefinitionRegistry`
      runs early, after definitions load and before instantiation, and receives
      the `BeanDefinitionRegistry` so you can register more definitions.
    ref: "concepts.md#programmatic-bean-registration-with-beandefinitionregistry"

  - id: advanced-bean-wiring-029
    difficulty: intermediate
    tags: [post-processors, comparison]
    question: |
      Which statement correctly distinguishes the three post-processor types?
    options:
      - "BeanDefinitionRegistryPostProcessor adds definitions and BeanFactoryPostProcessor mutates existing definitions (both on metadata), while BeanPostProcessor operates on instances during initialization"
      - "All three operate exclusively on already-created bean instances during their initialization phase"
      - "BeanPostProcessor adds new definitions to the registry, while the other two only mutate live instances"
      - "They are three interchangeable names for one and the same post-processor interface"
    answer: 0
    explanation: |
      BDRPP adds definitions; BFPP mutates existing definitions — both act on
      metadata before instantiation. BPP acts on already-created bean instances
      during initialization.
    ref: "concepts.md#programmatic-bean-registration-with-beandefinitionregistry"

  - id: advanced-bean-wiring-030
    difficulty: intermediate
    tags: [registerbean, functional]
    question: |
      What does `ctx.registerBean("svc", MyService.class, () -> new MyService("x"))`
      on an AnnotationConfigApplicationContext do?
    options:
      - "Immediately creates and returns a fully initialized MyService instance eagerly"
      - "Registers a bean definition whose instance creation is delegated to the supplied Supplier (functional registration)"
      - "Registers MyService only if no other bean of that exact type is already present"
      - "Throws an exception because Suppliers are not permitted as bean instance creators"
    answer: 1
    explanation: |
      The `registerBean` overload with a `Supplier` (Spring 5+) registers a
      definition that delegates instance creation to your supplier — the
      functional-registration style underpinning much of Spring's AOT/native
      support.
    ref: "concepts.md#programmatic-bean-registration-with-beandefinitionregistry"

  - id: advanced-bean-wiring-031
    difficulty: beginner
    tags: [import, configuration]
    question: |
      Which types can be passed to `@Import` on a `@Configuration` class?
    options:
      - "Only other @Configuration classes, whose @Bean methods are then merged in"
      - "Only XML file paths, resolved relative to the importing class's package"
      - "Only classes annotated with @Component that are also on the component-scan path"
      - "@Configuration classes, ImportSelector implementations, and ImportBeanDefinitionRegistrar implementations"
    answer: 3
    explanation: |
      `@Import` accepts `@Configuration` classes (uses their `@Bean` methods),
      `ImportSelector` implementations (return class names to import), and
      `ImportBeanDefinitionRegistrar` implementations (register definitions
      directly).
    ref: "concepts.md#importing-configuration-with-import-and-registrars"

  - id: advanced-bean-wiring-032
    difficulty: intermediate
    tags: [import-selector]
    question: |
      What does an `ImportSelector.selectImports(AnnotationMetadata)` method
      return?
    options:
      - "An array of fully-qualified class names to import"
      - "A list of already-instantiated bean instances to register"
      - "A BeanDefinitionRegistry handle for adding definitions"
      - "void; it registers the selected beans as a side effect"
    answer: 0
    explanation: |
      `ImportSelector` returns a `String[]` of fully-qualified class names for
      Spring to import, chosen at runtime from the importing class's annotation
      metadata. It does not register definitions directly.
    ref: "concepts.md#importing-configuration-with-import-and-registrars"

  - id: advanced-bean-wiring-033
    difficulty: intermediate
    tags: [import-registrar]
    question: |
      How does `ImportBeanDefinitionRegistrar` differ from `ImportSelector`?
    options:
      - "It returns an array of class names, while ImportSelector registers definitions itself"
      - "There is no difference; the two are simply aliases for the same import hook"
      - "It registers bean definitions directly against the BeanDefinitionRegistry, while ImportSelector returns class names to import"
      - "It can only import XML configuration files rather than annotated Java classes"
    answer: 2
    explanation: |
      A registrar receives the `BeanDefinitionRegistry` and registers
      definitions directly (often reading annotation attributes), whereas a
      selector merely returns class names for Spring to import. Registrars power
      `@EnableXxx`-style annotations.
    ref: "concepts.md#importing-configuration-with-import-and-registrars"

  - id: advanced-bean-wiring-034
    difficulty: intermediate
    tags: [deferred-import-selector]
    question: |
      When are the imports from a `DeferredImportSelector` processed relative to
      regular `@Configuration` imports?
    options:
      - "Before any regular imports, so they can pre-empt other configuration"
      - "They are never processed unless a profile is explicitly activated"
      - "In a nondeterministic order interleaved with regular imports"
      - "After all @Configuration-declared regular imports are processed"
    answer: 3
    explanation: |
      A `DeferredImportSelector`'s selections are processed after regular
      imports, enabling ordering/overriding scenarios. This is the mechanism
      behind Spring Boot's `@EnableAutoConfiguration` (auto-configuration itself
      being a Boot feature).
    ref: "concepts.md#importing-configuration-with-import-and-registrars"

  - id: advanced-bean-wiring-035
    difficulty: intermediate
    tags: [import-registrar, aware]
    question: |
      What can an `ImportBeanDefinitionRegistrar` do to receive the Environment
      or the bean ClassLoader as callbacks?
    options:
      - "Implement Aware interfaces such as EnvironmentAware or BeanClassLoaderAware"
      - "Nothing; registrars are denied all access to context objects by design"
      - "Annotate fields with @Autowired, which the config parser injects before parsing"
      - "Extend AnnotationConfigApplicationContext to inherit the context accessors"
    answer: 0
    explanation: |
      Registrars may implement `Aware` interfaces (`EnvironmentAware`,
      `BeanFactoryAware`, `ResourceLoaderAware`, `BeanClassLoaderAware`) to
      receive the corresponding context objects before
      `registerBeanDefinitions` runs.
    ref: "concepts.md#importing-configuration-with-import-and-registrars"

  - id: advanced-bean-wiring-036
    difficulty: beginner
    tags: [conditional, basics]
    question: |
      What does `@Conditional(SomeCondition.class)` on a `@Bean` method do?
    options:
      - "Delays the bean's creation until it is first requested at runtime"
      - "Registers the bean only if SomeCondition.matches(...) returns true"
      - "Switches the bean to prototype scope whenever the condition holds"
      - "Registers two copies of the bean, one per matches() invocation"
    answer: 1
    explanation: |
      `@Conditional` registers the bean/configuration only when the supplied
      `Condition.matches(...)` returns true, evaluated at
      definition-registration time.
    ref: "concepts.md#conditional-registration-with-conditional"

  - id: advanced-bean-wiring-037
    difficulty: intermediate
    tags: [conditional, condition-context]
    question: |
      Which does `ConditionContext` (passed to `Condition.matches`) give access
      to?
    options:
      - "Only the fully constructed bean instance currently being created, before its init methods run"
      - "Only the raw OS-level system environment variables, excluding any registered Spring property sources"
      - "The BeanDefinitionRegistry, bean factory, Environment, ResourceLoader, and ClassLoader"
      - "The current servlet HTTP request and response objects bound to the calling thread"
    answer: 2
    explanation: |
      `ConditionContext` exposes the `BeanDefinitionRegistry`,
      `ConfigurableListableBeanFactory`, `Environment`, `ResourceLoader`, and
      `ClassLoader`, so a condition can inspect properties, classpath, and
      existing definitions.
    ref: "concepts.md#conditional-registration-with-conditional"

  - id: advanced-bean-wiring-038
    difficulty: intermediate
    tags: [conditional, profile]
    question: |
      How is `@Profile` related to `@Conditional` in Spring Framework?
    options:
      - "They are entirely unrelated features that share no common evaluation machinery in the container"
      - "@Conditional is implemented on top of @Profile, delegating every match decision to the active profile set"
      - "@Profile fully replaced and deprecated @Conditional as of the Spring Framework 6 release line"
      - "@Profile is meta-annotated with @Conditional(ProfileCondition.class); it is a specialization"
    answer: 3
    explanation: |
      `@Profile` is built on top of `@Conditional` via `ProfileCondition`. Use
      `@Profile` for the common environment case and a custom `@Conditional` for
      arbitrary logic.
    ref: "concepts.md#conditional-registration-with-conditional"

  - id: advanced-bean-wiring-039
    difficulty: intermediate
    tags: [conditional, spring-vs-boot]
    question: |
      Which of the following is part of Spring Boot, NOT core Spring Framework?
    options:
      - "@Conditional"
      - "The Condition interface"
      - "@ConditionalOnMissingBean"
      - "@Profile"
    answer: 2
    explanation: |
      Core Spring ships only the generic `@Conditional` + `Condition` SPI (and
      `@Profile`). Ready-made conditions like `@ConditionalOnMissingBean`,
      `@ConditionalOnClass`, and `@ConditionalOnProperty` live in Spring Boot's
      autoconfigure module.
    ref: "concepts.md#conditional-registration-with-conditional"

  - id: advanced-bean-wiring-040
    difficulty: beginner
    tags: [conditional, condition-interface]
    question: |
      What must a class implement to be usable as the value of `@Conditional`?
    options:
      - "The Condition interface with a matches(ConditionContext, AnnotatedTypeMetadata) method"
      - "The FactoryBean interface, whose getObject() is consulted to decide whether the bean registers"
      - "The BeanPostProcessor interface, returning false from postProcessBeforeInitialization to veto it"
      - "The ApplicationListener interface, reacting to a ContextRefreshedEvent to accept or reject the bean"
    answer: 0
    explanation: |
      `@Conditional` takes one or more `Condition` implementations; each defines
      `boolean matches(ConditionContext, AnnotatedTypeMetadata)` evaluated when
      deciding whether to register the definition.
    ref: "concepts.md#conditional-registration-with-conditional"

  - id: advanced-bean-wiring-041
    difficulty: beginner
    tags: [factorybean, bean-method, comparison]
    question: |
      Which statement about a `@Bean` factory method versus a FactoryBean is
      correct?
    options:
      - "A @Bean method stores the FactoryBean under the plain name; a FactoryBean instead stores its product and exposes the factory under that name"
      - "With a @Bean method the container stores the returned object directly; with a FactoryBean the container stores the factory and creates the product via getObject()"
      - "Neither a @Bean method nor a FactoryBean can control whether the resulting bean is singleton- or prototype-scoped; scope is fixed"
      - "@Bean methods cannot have collaborators injected as method parameters, so they are limited to constructing dependency-free objects"
    answer: 1
    explanation: |
      A `@Bean` method's return value becomes the bean directly. A FactoryBean
      is stored as the factory, and its `getObject()` produces the exposed bean
      (retrievable plainly; the factory itself via `&name`).
    ref: "concepts.md#factorybean-versus-a-bean-factory-method"

  - id: advanced-bean-wiring-042
    difficulty: intermediate
    tags: [objectprovider, getobject, ambiguity]
    question: |
      With exactly one matching candidate, what does `ObjectProvider.getObject()`
      do, and what if there were multiple non-primary candidates?
    options:
      - "Returns null for the single candidate and null again when several non-primary candidates match"
      - "Returns a one-element list for the single candidate and a multi-element list when several match"
      - "Throws NoSuchBeanDefinitionException for the single candidate and again when several match"
      - "Returns the single bean; would throw NoUniqueBeanDefinitionException for multiple non-primary candidates"
    answer: 3
    explanation: |
      `getObject()` returns the sole candidate when there is one. With multiple
      candidates and no primary, it throws `NoUniqueBeanDefinitionException`;
      with zero it throws `NoSuchBeanDefinitionException`.
    ref: "concepts.md#objectprovider-and-objectfactory-for-on-demand-lookup"

  - id: advanced-bean-wiring-043
    difficulty: expert
    tags: [factorybean, bean-post-processor, lifecycle]
    question: |
      A `FactoryBean<Widget>` returns from `getObject()` a `Widget` that has an
      `@Autowired Repo repo` field and a `@PostConstruct init()` method. After
      the context refreshes, `repo` is null and `init()` never ran, even though
      `Repo` is a valid bean. Why?
    options:
      - "The object returned by getObject() does not go through Spring's full bean-creation lifecycle: its properties are not populated, its init methods are not called, and postProcessBeforeInitialization is not applied to it"
      - "The @Autowired and @PostConstruct annotations are unconditionally stripped from any type that appears as the generic parameter of a FactoryBean, because Spring reads the parameter reflectively without a target instance"
      - "Declaring a FactoryBean disables all annotation post-processing across the entire ApplicationContext until refresh has fully completed, deferring every field injection and init callback to the first getBean call"
      - "The Widget class must itself implement FactoryBean and be registered separately in order for its fields to be injected and its lifecycle callbacks to run"
    answer: 0
    explanation: |
      Spring treats the FactoryBean instance as a fully managed bean, but the
      product of getObject() is constructed by your code, not by the container's
      creation pipeline. Spring only passes the product through
      postProcessAfterInitialization (enabling AOP proxying); it does not inject
      fields or invoke init callbacks. You must wire and initialize the product
      yourself inside getObject().
    ref: "concepts.md#factorybean-versus-a-bean-factory-method"

  - id: advanced-bean-wiring-044
    difficulty: expert
    tags: [factorybean, bean-post-processor, aop]
    question: |
      Given that a FactoryBean's product skips most of the bean lifecycle, how
      does an @Transactional or other AOP aspect still manage to wrap the object
      returned by a FactoryBean's getObject()?
    options:
      - "AOP simply does not apply to FactoryBean products at all; you must construct and register the transactional proxy yourself inside getObject() before returning it"
      - "Spring passes the product through postProcessAfterInitialization (via postProcessObjectFromFactoryBean), and the auto-proxy creator is a BeanPostProcessor that wraps it there"
      - "Spring detects the matching aspect and re-runs the complete bean-creation lifecycle for the product, including field injection and init callbacks, so proxying can occur"
      - "The FactoryBean instance itself is what gets proxied, and that proxy transparently intercepts and advises every getObject() invocation on it"
    answer: 1
    explanation: |
      The one lifecycle touchpoint the product does receive is
      postProcessAfterInitialization, applied via
      FactoryBeanRegistrySupport.postProcessObjectFromFactoryBean. Because the
      AOP auto-proxy creator is a BeanPostProcessor acting in that phase, it can
      still wrap the product even though field injection and init callbacks were
      skipped.
    ref: "concepts.md#factorybean-versus-a-bean-factory-method"

  - id: advanced-bean-wiring-045
    difficulty: expert
    tags: [factorybean, type-matching, generics]
    question: |
      A `@Bean` method is declared `public FactoryBean myFactory() { ... }`
      (raw `FactoryBean`, no generic argument) and its `getObjectType()` returns
      the real product type only after construction. What is the consequence for
      the container at startup compared to declaring `FactoryBean<Product>`?
    options:
      - "No difference whatsoever; Spring always instantiates every FactoryBean eagerly during refresh regardless of whether its generic product type is declared"
      - "The raw FactoryBean declaration is rejected by the Spring 6 configuration parser and causes a hard context startup failure at refresh time"
      - "The raw declaration forces Spring to instantiate the FactoryBean early to call getObjectType() for type matching, whereas the parameterized declaration lets Spring infer the product type from generics without instantiating it"
      - "The parameterized FactoryBean<Product> declaration actually disables by-type autowiring of the product, forcing consumers to inject it by explicit name"
    answer: 2
    explanation: |
      Spring can read the declared generic type argument (FactoryBean<Product>)
      to learn the product type without creating the factory. A raw FactoryBean
      hides that information, so the container must instantiate the factory to
      call getObjectType() during type matching — a hidden eager initialization.
    ref: "concepts.md#factorybean-versus-a-bean-factory-method"

  - id: advanced-bean-wiring-046
    difficulty: expert
    tags: [factorybean, bean-post-processor, infrastructure]
    question: |
      You see the log warning "Bean 'x' is not eligible for getting processed by
      all BeanPostProcessors (for example: not eligible for auto-proxying)".
      Which scenario most directly causes this for a FactoryBean-related bean?
    options:
      - "The FactoryBean returned null from getObject(), so the container logs the ineligibility warning and substitutes a placeholder bean in its place"
      - "The FactoryBean's getObjectType() reported a primitive type such as int, which auto-proxying cannot subclass or wrap with an interface proxy"
      - "The bean was looked up with the & prefix in a getBean call, which permanently marks that name as ineligible for later post-processing"
      - "A bean is instantiated during the early infrastructure phase (e.g. it is or is depended upon by a BeanPostProcessor / BeanFactoryPostProcessor) before all ordinary BeanPostProcessors are registered, so it skips their processing"
    answer: 3
    explanation: |
      Beans pulled into existence during the early infrastructure phase — such
      as BeanPostProcessors, BeanFactoryPostProcessors, and their dependencies —
      are created before the full set of ordinary BeanPostProcessors is
      registered. They therefore miss processing like AOP auto-proxying, which is
      exactly what the warning reports.
    ref: "concepts.md#factorybean-versus-a-bean-factory-method"

  - id: advanced-bean-wiring-047
    difficulty: advanced
    tags: [factorybean, caching, isSingleton]
    question: |
      A FactoryBean has `isSingleton()` return `true` but its `getObject()`
      contains `return new Widget();` and increments a counter each call. After
      the context is up, code calls `ctx.getBean("widget")` five times. How many
      times does `getObject()` execute, and why?
    options:
      - "Five times; the container ignores isSingleton() for lookups and calls getObject() afresh on every single getBean invocation"
      - "Zero times; the product is materialized only once during context refresh and never on any subsequent getBean lookup"
      - "Five times, but the container keeps only the first Widget it built and quietly discards the four later ones"
      - "Once; the singleton product is stored in the container's factoryBeanObjectCache and reused for subsequent lookups"
    answer: 3
    explanation: |
      When isSingleton() is true, Spring caches the product in a dedicated
      factoryBeanObjectCache keyed by bean name and reuses it, so getObject()
      runs once. Returning a fresh instance from getObject() does not defeat this
      cache — you would need isSingleton() to return false for per-lookup
      creation.
    ref: "concepts.md#factorybean-versus-a-bean-factory-method"

  - id: advanced-bean-wiring-048
    difficulty: advanced
    tags: [factorybean, ampersand-prefix, type]
    question: |
      With a `FactoryBean<Connection>` registered as `conn`, which pair of
      results is correct?
    options:
      - "getBean(\"conn\", Connection.class) -> the FactoryBean; getBean(\"&conn\") -> a Connection"
      - "Both getBean(\"conn\") and getBean(\"&conn\") return a Connection, since Spring unwraps the factory in either case"
      - "getBean(\"&conn\") throws IllegalArgumentException because the & dereference prefix is honored only in XML bean definitions"
      - "getBean(\"conn\") -> a Connection; getBean(\"&conn\", FactoryBean.class) -> the FactoryBean instance"
    answer: 3
    explanation: |
      The plain name yields the product (Connection); the &-prefixed name yields
      the FactoryBean instance itself. Requesting getBean("conn", Connection.class)
      returns the product and getBean("&conn", FactoryBean.class) returns the
      factory. The & prefix works programmatically, not only in XML.
    ref: "concepts.md#factorybean-versus-a-bean-factory-method"

  - id: advanced-bean-wiring-049
    difficulty: advanced
    tags: [lazy, injection-point, proxy, jdk-cglib]
    question: |
      `@Autowired @Lazy PaymentGateway gw;` is declared where `PaymentGateway`
      is a concrete class (not an interface). What proxy does Spring inject, and
      what must be true of the class?
    options:
      - "A JDK dynamic proxy; the class must implement at least one interface"
      - "No proxy at all; @Lazy on a concrete type just delays the field assignment"
      - "A CGLIB subclass proxy; the class must be non-final and proxyable"
      - "A java.lang.reflect.Proxy over Object; the class is irrelevant"
    answer: 2
    explanation: |
      The lazy-resolution proxy is built with ProxyFactory. For a concrete class
      target it creates a CGLIB subclass proxy, so the class must be non-final
      (and the relevant methods non-final). Only when the injection type is an
      interface does Spring create a JDK dynamic proxy.
    ref: "concepts.md#lazy-initialization-with-lazy"

  - id: advanced-bean-wiring-050
    difficulty: expert
    tags: [lazy, circular-dependency, constructor]
    question: |
      To break a constructor cycle, `A(@Lazy B b)` receives a lazy proxy. But
      A's constructor body also calls `b.warmUp()`. What happens at startup?
    options:
      - "Nothing changes; the lazy proxy fully isolates A from B for the object's entire lifetime, so the cycle is always broken"
      - "The proxy resolves B when warmUp() is invoked during A's construction, re-entering B's creation while A is still being created and throwing BeanCurrentlyInCreationException"
      - "The warmUp() call is silently queued and buffered on the lazy proxy, then replayed against the real B only after context refresh completes"
      - "Spring detects the in-constructor call and automatically rewrites B's wiring to setter injection so the cycle resolves transparently"
    answer: 1
    explanation: |
      The lazy proxy defers only the lookup, not the eventual need for a real B.
      Invoking a method on the proxy inside A's constructor forces B's resolution
      mid-cycle, reintroducing the circular-creation failure. The @Lazy fix works
      only if A does not call into B during its own construction.
    ref: "concepts.md#lazy-initialization-with-lazy"

  - id: advanced-bean-wiring-051
    difficulty: advanced
    tags: [lazy, definition-vs-injection-point]
    question: |
      `HeavyBean` is annotated `@Lazy` on its definition. Singleton `Consumer`
      (not lazy) declares `@Autowired HeavyBean heavy;` with NO `@Lazy` on that
      field. When is `HeavyBean` created?
    options:
      - "Eagerly at startup, because the eager Consumer's dependency must be satisfied and the injection point is not itself lazy, overriding the definition's laziness"
      - "On the first method call against heavy, because @Lazy placed on a bean definition always defers creation regardless of who injects it"
      - "Never during normal operation, unless application code explicitly invokes ctx.getBean(HeavyBean.class) at some later point"
      - "Only after the context is closed, as part of the singleton destruction and cleanup phase during shutdown"
    answer: 0
    explanation: |
      @Lazy on a definition is overridden when a non-lazy singleton depends on
      that bean: the container must create it at startup to satisfy the
      dependency. Real deferral requires the injection point itself to be @Lazy
      (a proxy) or to use ObjectProvider.
    ref: "concepts.md#lazy-initialization-with-lazy"

  - id: advanced-bean-wiring-052
    difficulty: expert
    tags: [lazy, proxy, identity]
    question: |
      A field injected with `@Autowired @Lazy Cache cache;` (Cache is a concrete
      class) is compared elsewhere with `cache == ctx.getBean(Cache.class)`.
      What is the result and why?
    options:
      - "true, because Spring transparently unwraps the lazy proxy to its target before evaluating any == reference comparison"
      - "It throws a ClassCastException, because the CGLIB proxy type is not assignment-compatible with the concrete Cache class"
      - "false, because 'cache' is a CGLIB proxy object whose identity differs from the real singleton returned by getBean, even though the proxy delegates to that same singleton"
      - "true, because the container interns every @Lazy proxy so that it and its target share one canonical reference"
    answer: 2
    explanation: |
      The @Lazy proxy is a distinct object standing in for the bean; reference
      identity against the real bean is false. The proxy's TargetSource resolves
      to the same singleton on invocation, so behavior is correct, but ==,
      identity-sensitive maps, and (for non-matching types) instanceof can be
      surprising.
    ref: "concepts.md#lazy-initialization-with-lazy"

  - id: advanced-bean-wiring-053
    difficulty: advanced
    tags: [lazy, startup, error-timing]
    question: |
      A bean's constructor throws an exception due to a misconfiguration. It is
      injected everywhere via `@Lazy` proxies. What is the practical effect on
      failure timing?
    options:
      - "The failure is deferred: the context refreshes successfully and the exception surfaces only at the first method call on a proxy, potentially in production traffic rather than at startup"
      - "The context still fails fast during refresh, because @Lazy proxies force construction at wiring time and cannot delay constructor errors"
      - "The constructor exception is caught and swallowed permanently, and the affected bean silently resolves to null everywhere it was injected"
      - "Spring transparently retries the failing construction on every subsequent proxy method call until it eventually succeeds"
    answer: 0
    explanation: |
      Because the lazy proxy defers creation to first use, construction-time
      errors no longer break startup; they appear on first invocation. This trades
      fail-fast startup for the risk of a runtime failure under load — an
      important trade-off when applying @Lazy broadly.
    ref: "concepts.md#lazy-initialization-with-lazy"

  - id: advanced-bean-wiring-054
    difficulty: advanced
    tags: [objectprovider, ordering, stream]
    question: |
      Beans B1 (@Order(2)), B2 (@Order(1)), B3 (no @Order) all implement
      `Handler`. An `ObjectProvider<Handler>` is injected. How do `stream()` and
      `orderedStream()` differ in what they yield?
    options:
      - "Both stream() and orderedStream() yield the handlers as B2, B1, B3, having applied the @Order sequence identically"
      - "stream() yields them in registration/definition order ignoring @Order; orderedStream() yields them sorted by @Order (and Ordered/@Priority)"
      - "stream() sorts the handlers ascending by @Order value, whereas orderedStream() deliberately returns them in raw unsorted definition order"
      - "Both methods throw an IllegalStateException because B3 carries no @Order and mixed ordering is disallowed"
    answer: 1
    explanation: |
      stream() returns candidates in definition order and ignores @Order, mirroring
      List<T> injection semantics only partially — it is orderedStream() that
      applies @Order, Ordered, and @Priority sorting. This is a frequent source of
      "why aren't my handlers ordered" bugs.
    ref: "concepts.md#objectprovider-and-objectfactory-for-on-demand-lookup"

  - id: advanced-bean-wiring-055
    difficulty: expert
    tags: [objectprovider, prototype, lifecycle, destruction]
    question: |
      A singleton pulls prototype-scoped `Session` beans via
      `sessionProvider.getObject()` in a loop and each `Session` implements
      `DisposableBean` with a `destroy()` that releases a socket. After the app
      runs for hours, sockets are exhausted. What is the root cause?
    options:
      - "ObjectProvider retains a strong reference to every prototype it creates, so their destroy() methods only fire at context shutdown"
      - "getObject() actually reuses one cached Session, so its destroy() is invoked prematurely while other callers still hold the socket"
      - "Spring does not manage the full lifecycle of prototype beans: it never calls destroy()/DisposableBean on them, so the caller is responsible for cleanup"
      - "Prototype destruction callbacks run only when the owning bean is additionally annotated @Lazy, which this Session is missing at its injection point"
    answer: 2
    explanation: |
      For prototypes, Spring creates and hands off the instance but does not track
      it or invoke destruction callbacks. Each getObject() yields a new Session
      whose destroy() Spring never calls; the client owns cleanup. This is a
      well-known prototype gotcha, independent of whether ObjectProvider or @Lookup
      obtained the instance.
    ref: "concepts.md#objectprovider-and-objectfactory-for-on-demand-lookup"

  - id: advanced-bean-wiring-056
    difficulty: advanced
    tags: [objectprovider, getifunique, primary]
    question: |
      Two `CacheManager` beans exist; one is annotated `@Primary`. What does
      `provider.getIfUnique()` return?
    options:
      - "null, because two candidates match and getIfUnique() ignores the @Primary marker when counting them"
      - "It throws NoUniqueBeanDefinitionException, since @Primary influences autowiring but never getIfUnique() resolution"
      - "A nondeterministically chosen one of the two, decided by bean-registration order rather than the @Primary flag"
      - "The @Primary bean, because 'unique' means unambiguously resolvable to one, and @Primary provides that resolution"
    answer: 3
    explanation: |
      getIfUnique() returns null only when the container cannot resolve a single
      unambiguous candidate. With a @Primary marker among multiple candidates the
      resolution is unambiguous, so the primary is returned rather than null.
    ref: "concepts.md#objectprovider-and-objectfactory-for-on-demand-lookup"

  - id: advanced-bean-wiring-057
    difficulty: expert
    tags: [objectprovider, priority, order, autowiring]
    question: |
      Three `Validator` beans exist: two carry only `@Order(1)` and `@Order(2)`,
      the third carries only `@jakarta.annotation.Priority(5)`. None is
      `@Primary`, and a single `@Autowired Validator v;` is declared (not a
      collection). Which bean is injected, and why?
    options:
      - "The @Priority(5) bean is injected: @Order does not participate in single-injection candidate selection, whereas @Priority does; since it is the only candidate carrying @Priority, determineHighestPriorityCandidate selects it unambiguously"
      - "The @Order(1) bean wins, because the lowest @Order value always decides single-injection autowiring just as it decides collection ordering"
      - "It throws NoUniqueBeanDefinitionException, because three candidates match, none is @Primary, and @Priority is ignored during single-value selection"
      - "The container silently injects the first-registered bean, falling back to definition order once @Order and @Priority both fail to disambiguate"
    answer: 0
    explanation: |
      For single-value autowiring, @Order is used only for collection/stream
      ordering, never to pick one winner; @Primary and @Priority participate in
      selecting a single candidate. In determineHighestPriorityCandidate,
      candidates without @Priority return null and are skipped, so the lone
      @Priority(5) bean is chosen unambiguously (no exception). It would throw
      only if two candidates tied at the same highest @Priority. This
      @Order-vs-@Priority distinction for single injection is a classic trap.
    ref: "concepts.md#objectprovider-and-objectfactory-for-on-demand-lookup"

  - id: advanced-bean-wiring-058
    difficulty: advanced
    tags: [objectprovider, lazy, cycle-breaking, identity]
    question: |
      A team replaces `@Lazy` field injection with an injected
      `ObjectProvider<Foo>` to break a cycle. Compared to the @Lazy proxy
      approach, what is a concrete advantage regarding the returned object?
    options:
      - "ObjectProvider guarantees Foo is created eagerly at refresh, avoiding the deferred-construction pitfalls that @Lazy proxies introduce"
      - "ObjectProvider makes Foo thread-confined to the calling thread, handing each thread its own private instance of the singleton"
      - "ObjectProvider automatically caches the resolved Foo in a ThreadLocal, so repeated getObject() calls skip the container lookup"
      - "ObjectProvider.getObject() returns the real Foo bean (no proxy), so identity, equals, and instanceof behave normally"
    answer: 3
    explanation: |
      ObjectProvider defers resolution without introducing a proxy: getObject()
      returns the actual bean, so reference identity and type checks are exact.
      The trade-off versus @Lazy is an explicit getObject() call at the use site
      instead of a transparent field.
    ref: "concepts.md#objectprovider-and-objectfactory-for-on-demand-lookup"

  - id: advanced-bean-wiring-059
    difficulty: advanced
    tags: [objectprovider, thread-safety]
    question: |
      Is it safe to store an injected `ObjectProvider<Foo>` in a field of a
      singleton and call it concurrently from many threads?
    options:
      - "No; ObjectProvider holds mutable per-lookup state internally and must be guarded by external synchronization before concurrent use"
      - "Only if Foo is a singleton; for prototypes the provider corrupts its internal candidate cache under concurrent getObject() calls"
      - "Yes; the provider is a thin handle to the container, and each getObject()/stream() is an independent lookup with no shared mutable state in the handle"
      - "No; a fresh ObjectProvider must be injected per request scope, because a singleton-held one is not safe across threads"
    answer: 2
    explanation: |
      An ObjectProvider is a stateless handle onto the BeanFactory; concurrent
      calls each perform their own lookup. For singletons you get the shared
      instance, for prototypes a fresh instance per call — both thread-safe at
      the provider level (the beans' own thread-safety is a separate concern).
    ref: "concepts.md#objectprovider-and-objectfactory-for-on-demand-lookup"

  - id: advanced-bean-wiring-060
    difficulty: expert
    tags: [lookup, bean-method, failure-mode]
    question: |
      A class `Worker` declares `@Lookup protected Command newCommand() { return null; }`
      and is registered via a `@Bean` method: `@Bean Worker worker() { return new Worker(); }`.
      Calling `worker.newCommand()` returns null. Why does @Lookup silently fail here?
    options:
      - "@Lookup only works on abstract methods, and because this newCommand() has a concrete body the annotation is silently disregarded"
      - "The bean was created by a @Bean factory method returning a plain instance, so Spring did not create a CGLIB subclass; without the subclass the @Lookup method is never overridden and its original body runs"
      - "@Lookup requires the return type to be an interface, and Command being a concrete class prevents Spring from generating the override"
      - "The method must be declared public for @Lookup to take effect, so a protected newCommand() is never intercepted by the container"
    answer: 1
    explanation: |
      @Lookup relies on Spring instantiating the bean via CGLIB subclassing.
      When you return an already-constructed instance from a @Bean method (or a
      Supplier), Spring stores that plain object and never generates the
      overriding subclass, so the placeholder body executes and returns null.
      @Lookup works on component-scanned/container-instantiated beans.
    ref: "concepts.md#lookup-method-injection-with-lookup"

  - id: advanced-bean-wiring-061
    difficulty: advanced
    tags: [lookup, resolution, by-name]
    question: |
      Two beans implement `Report`: `pdfReport` and `csvReport`. A class declares
      `@Lookup("csvReport") protected abstract Report make();`. What does `make()`
      return and on what basis?
    options:
      - "The csvReport, resolved by name because @Lookup has an explicit value"
      - "The pdfReport, chosen by return type since @Lookup ignores its explicit string value and always matches by class"
      - "It throws NoUniqueBeanDefinitionException, because two Report beans exist and @Lookup cannot disambiguate between them by name"
      - "A composite proxy that merges both Report beans and delegates each call to whichever was registered first"
    answer: 0
    explanation: |
      @Lookup with an explicit value resolves by bean name (getBean(name)), so it
      returns csvReport unambiguously. @Lookup with no value would resolve by
      return type and, with two candidates and no primary, would fail on
      ambiguity.
    ref: "concepts.md#lookup-method-injection-with-lookup"

  - id: advanced-bean-wiring-062
    difficulty: expert
    tags: [lookup, scoped-proxy, comparison, identity]
    question: |
      Contrast injecting a `@Scope(value="prototype", proxyMode=TARGET_CLASS)`
      bean as an ordinary field versus using `@Lookup`. Which statement is
      accurate about the object the caller holds?
    options:
      - "Both approaches hand the caller the real prototype instance directly, with no proxy object standing in between at any point"
      - "@Lookup returns a proxy on each call while the scoped-proxy approach injects the real prototype bean directly into the field"
      - "The scoped-proxy field holds a single proxy object that creates a new target per method invocation; @Lookup returns the real prototype instance on each method call"
      - "Both approaches hold a proxy object, and those two proxies are identical to each other by reference across the container"
    answer: 2
    explanation: |
      With a scoped proxy the injected field is one proxy object; each method
      invocation on it resolves a fresh target under the hood (so it is
      transparent but is a proxy). @Lookup instead returns the actual prototype
      instance each time the lookup method is called. This affects identity and
      instanceof semantics.
    ref: "concepts.md#lookup-method-injection-with-lookup"

  - id: advanced-bean-wiring-063
    difficulty: advanced
    tags: [lookup, constraints, cglib]
    question: |
      Which combination would prevent Spring from applying @Lookup and cause a
      startup/definition failure or a non-overridden method?
    options:
      - "A private or final @Lookup method, or a final declaring class, because CGLIB cannot override it"
      - "A protected abstract no-arg method declared on an otherwise non-final component-scanned class that Spring instantiates"
      - "A @Lookup method whose declared return type happens to be a prototype-scoped bean rather than a singleton one"
      - "A method annotated @Lookup(\"beanName\") that resolves its target by an explicit bean name instead of by type"
    answer: 0
    explanation: |
      CGLIB subclassing requires the declaring class to be non-final and the
      @Lookup method to be non-final, non-private, and non-static so it can be
      overridden. Private/final methods or a final class defeat the mechanism.
    ref: "concepts.md#lookup-method-injection-with-lookup"

  - id: advanced-bean-wiring-064
    difficulty: expert
    tags: [bdrpp, bfpp, ordering, static-bean]
    question: |
      A `@Configuration` class exposes a `BeanFactoryPostProcessor` via a
      NON-static `@Bean` method. What negative effect does this commonly cause?
    options:
      - "Nothing; whether a BFPP @Bean method is static or non-static is a purely stylistic choice with no effect on initialization order"
      - "It forces the declaring @Configuration class to be instantiated very early to obtain the BFPP, before other BFPPs can post-process that config class — producing warnings and skipping full @Configuration enhancement/@Bean proxying for it"
      - "It silently reclassifies the BFPP as a BeanPostProcessor, so its callbacks fire per-instance during initialization instead"
      - "It causes the BFPP's postProcessBeanFactory to run after all beans are instantiated rather than before, inverting the phase"
    answer: 1
    explanation: |
      Because BFPPs must be instantiated in the early phase, a non-static @Bean
      BFPP drags its whole @Configuration class into early instantiation before
      other BFPPs can process it. Spring recommends declaring such @Bean methods
      static so the config class is not prematurely created.
    ref: "concepts.md#programmatic-bean-registration-with-beandefinitionregistry"

  - id: advanced-bean-wiring-065
    difficulty: expert
    tags: [bfpp, premature-instantiation, gotcha]
    question: |
      Inside a `BeanFactoryPostProcessor.postProcessBeanFactory`, code calls
      `beanFactory.getBean(SomeService.class)` to reconfigure it. What is the
      most serious consequence?
    options:
      - "It is perfectly safe, because BFPPs are guaranteed to run only after every singleton bean has already been fully created"
      - "It throws IllegalStateException, because calling getBean is strictly forbidden inside any post-processor callback by contract"
      - "It forces SomeService (and its dependencies) to be instantiated too early — during the BFPP phase, before all BeanPostProcessors are registered — so those beans may skip post-processing such as AOP proxying"
      - "It quietly returns only the bean's definition metadata rather than an instance, so no premature instantiation ever occurs"
    answer: 2
    explanation: |
      BFPPs run before ordinary beans exist. Fetching a real bean there triggers
      premature instantiation that bypasses BeanPostProcessors registered later,
      commonly breaking auto-proxying (@Transactional, @Async). BFPPs should
      operate on definitions/metadata, not instantiate beans.
    ref: "concepts.md#programmatic-bean-registration-with-beandefinitionregistry"

  - id: advanced-bean-wiring-066
    difficulty: expert
    tags: [bdrpp, ordering, priorityordered]
    question: |
      Two `BeanDefinitionRegistryPostProcessor`s exist: one implements
      `PriorityOrdered`, another implements `Ordered`. A third is registered by
      the first one at runtime. In what order does Spring invoke their
      `postProcessBeanDefinitionRegistry` methods?
    options:
      - "In arbitrary order, because BDRPPs ignore both PriorityOrdered and Ordered and run purely by registration sequence"
      - "Ordered ones first because they were declared directly as beans, then the PriorityOrdered ones, then the runtime-registered remainder"
      - "All postProcessBeanFactory methods run first, before any postProcessBeanDefinitionRegistry callback is invoked on any of the three"
      - "PriorityOrdered ones first, then Ordered ones, then any newly registered/remaining ones, with Spring re-scanning the registry between groups to catch BDRPPs added by earlier BDRPPs"
    answer: 3
    explanation: |
      PostProcessorRegistrationDelegate invokes BDRPPs in PriorityOrdered, then
      Ordered, then the remainder, re-scanning the registry between groups since a
      BDRPP may register another. Only after all registry callbacks are done does
      Spring call their postProcessBeanFactory methods.
    ref: "concepts.md#programmatic-bean-registration-with-beandefinitionregistry"

  - id: advanced-bean-wiring-067
    difficulty: advanced
    tags: [bean-post-processor, ordering, programmatic]
    question: |
      A `BeanPostProcessor` is added programmatically with
      `beanFactory.addBeanPostProcessor(bpp)` and it implements `Ordered` with a
      high order value. Where in the execution sequence does it run relative to
      auto-detected BPPs?
    options:
      - "Its high Ordered value places it last among all BeanPostProcessors, after every auto-detected one has already run"
      - "It throws at registration, because a BeanPostProcessor added programmatically is not permitted to also implement Ordered"
      - "It runs only for beans created after it was added, and among those it is sequenced strictly by its Ordered value"
      - "Programmatically added BPPs ignore the Ordered interface; they run in registration order and always before auto-detected BeanPostProcessors"
    answer: 3
    explanation: |
      BeanPostProcessors added directly via addBeanPostProcessor do not respect
      Ordered; their execution order is the registration order, and they always
      run before auto-detected BPPs. Ordering via Ordered/PriorityOrdered applies
      only to auto-detected ones.
    ref: "concepts.md#programmatic-bean-registration-with-beandefinitionregistry"

  - id: advanced-bean-wiring-068
    difficulty: advanced
    tags: [registerbean, supplier, aot]
    question: |
      Why does the functional `registerBean(name, Type.class, supplier, customizers...)`
      style matter for Spring's AOT / GraalVM native-image support?
    options:
      - "It marks all such beans lazy, which GraalVM native images require in order to avoid build-time initialization failures"
      - "It forces the registered beans into prototype scope, which the native-image compiler is able to optimize more aggressively"
      - "It disables the runtime BeanFactory entirely at build time, replacing it with a static lookup table baked into the image"
      - "It registers a definition whose creation is an explicit instance supplier rather than reflective class instantiation, which AOT can translate into generated, reflection-free registration code"
    answer: 3
    explanation: |
      Supplier-based registration expresses bean creation as explicit code rather
      than reflective instantiation. Spring's AOT engine generates such
      registerBean-style calls at build time, minimizing runtime reflection —
      which is central to GraalVM native-image compatibility.
    ref: "concepts.md#programmatic-bean-registration-with-beandefinitionregistry"

  - id: advanced-bean-wiring-069
    difficulty: expert
    tags: [import-registrar, deferred, ordering]
    question: |
      An `ImportBeanDefinitionRegistrar` R1 tries to register a bean only if a
      bean registered by another registrar R2 is absent, using
      `registry.containsBeanDefinition(...)`. Why is this unreliable?
    options:
      - "Registrars are handed a read-only view and cannot access the BeanDefinitionRegistry to query existing definitions at all"
      - "containsBeanDefinition always returns false inside a registrar, because definitions are not yet committed during the registrar phase"
      - "ImportBeanDefinitionRegistrars run during configuration-class parsing in a non-guaranteed relative order, so R1 may run before R2 has registered its bean; overriding-by-absence semantics belong to the deferred (DeferredImportSelector) phase"
      - "Registrars can observe only XML-defined bean definitions and are blind to any that were declared through annotations"
    answer: 2
    explanation: |
      Registrar callbacks fire at the end of parsing each importing config class,
      with no guaranteed cross-registrar ordering, so 'register if other bean
      absent' is order-dependent. Reliable override-by-absence is what the
      deferred selector phase (and Boot's conditions built on it) is for.
    ref: "concepts.md#importing-configuration-with-import-and-registrars"

  - id: advanced-bean-wiring-070
    difficulty: expert
    tags: [import-selector, aware, autowired]
    question: |
      An `ImportSelector` needs the active `Environment` to decide which classes
      to import. A developer adds `@Autowired Environment env;` to the selector,
      but it is null. What is the correct fix and why?
    options:
      - "Annotate the selector with @Component so it is picked up by component scanning and turned into a managed bean with @Autowired honored"
      - "Implement EnvironmentAware; selectors/registrars are instantiated directly by the config parser (not as managed beans), so field @Autowired does not run, but Aware callbacks are invoked before selectImports"
      - "Call a static ctx.getEnvironment() accessor from within selectImports to fetch the active Environment on demand at parse time"
      - "Move the selector logic into a @Configuration class and inject Environment there, since selectors themselves can never obtain it"
    answer: 1
    explanation: |
      ImportSelectors and registrars are created directly by
      ConfigurationClassPostProcessor, not registered as beans, so @Autowired/@Value
      injection never fires. Spring honors the Aware interfaces
      (EnvironmentAware, ResourceLoaderAware, BeanFactoryAware, BeanClassLoaderAware)
      and invokes them before selectImports/registerBeanDefinitions.
    ref: "concepts.md#importing-configuration-with-import-and-registrars"

  - id: advanced-bean-wiring-071
    difficulty: advanced
    tags: [deferred-import-selector, grouping, ordering]
    question: |
      What does a `DeferredImportSelector` returning a `Group` from
      `getImportGroup()` enable that a plain `ImportSelector` cannot?
    options:
      - "It batches and de-duplicates selections across multiple deferred selectors into a group that can be ordered together, giving deterministic ordering across a whole family of imports"
      - "It lets the selector register bean definitions directly against the registry, exactly as an ImportBeanDefinitionRegistrar would"
      - "It causes the grouped imports to be processed before regular @Configuration imports, letting them pre-empt other configuration"
      - "It converts every class named by the group into a prototype-scoped bean instead of the default singleton"
    answer: 0
    explanation: |
      The Group mechanism collects selections from deferred selectors, ordering
      and de-duplicating them as a unit. This deterministic grouping is what makes
      large conditional import sets (e.g. Boot auto-configuration) predictable; in
      plain Spring it enforces a total order across selectors.
    ref: "concepts.md#importing-configuration-with-import-and-registrars"

  - id: advanced-bean-wiring-072
    difficulty: advanced
    tags: [import-registrar, ordering, deferred-phase]
    question: |
      Relative to regular `@Import`ed `@Configuration` classes and
      `ImportSelector`s, when do `ImportBeanDefinitionRegistrar`s and
      `DeferredImportSelector`s run?
    options:
      - "Registrars run first of all, ahead of any @Configuration-class parsing, so they can seed definitions before selectors execute"
      - "Both registrars and DeferredImportSelectors run strictly before any regular @Import of a @Configuration class is resolved"
      - "Registrars run at the end of parsing their importing config class, while DeferredImportSelectors run only after every other @Configuration class has been processed"
      - "DeferredImportSelectors always run before ImportBeanDefinitionRegistrars, regardless of which config class imported them"
    answer: 2
    explanation: |
      Regular configuration imports and selectors are resolved during parsing;
      registrars' registerBeanDefinitions runs at the end of parsing the importing
      class; DeferredImportSelectors are processed last, after all other
      @Configuration classes, enabling ordering/overriding.
    ref: "concepts.md#importing-configuration-with-import-and-registrars"

  - id: advanced-bean-wiring-073
    difficulty: expert
    tags: [conditional, evaluation-timing, ordering]
    question: |
      A custom `@Conditional` on a `@Bean` method checks
      `ctx.getRegistry().containsBeanDefinition("other")` and registers only if
      absent. The same "other" bean is a component-scanned class elsewhere.
      Sometimes the condition matches, sometimes not, across builds. Why?
    options:
      - "Conditions are evaluated during configuration parsing / definition registration and see only definitions registered so far; whether 'other' is already registered depends on parse/scan order, making absence checks order-dependent"
      - "Conditions are evaluated lazily at bean-instantiation time, long after the full registry is populated, so containsBeanDefinition always sees every definition; the flakiness comes purely from JVM class-loading order varying between builds"
      - "The containsBeanDefinition lookup keeps an internal probabilistic cache that is invalidated on a timer, so repeated calls within one refresh can disagree about whether 'other' is present"
      - "@Conditional implementations are sandboxed and cannot reach the live BeanDefinitionRegistry, so containsBeanDefinition actually resolves against a stale snapshot captured before component scanning began"
    answer: 0
    explanation: |
      @Conditional runs at definition-registration time, not at instantiation,
      and sees only what has been registered up to that point. An absence check
      against a component-scanned bean therefore depends on scan/parse ordering —
      exactly why Boot's bean conditions defer to a late phase for determinism.
    ref: "concepts.md#conditional-registration-with-conditional"

  - id: advanced-bean-wiring-074
    difficulty: expert
    tags: [conditional, configuration-condition, phase]
    question: |
      To make a condition that decides based on other bean definitions more
      reliable, which interface and setting lets you defer evaluation until the
      REGISTER_BEAN phase (when more definitions are visible)?
    options:
      - "Implement Ordered and return LOWEST_PRECEDENCE so the condition is evaluated dead last, after every other definition has been registered by higher-precedence configuration classes"
      - "Implement ConfigurationCondition and return ConfigurationPhase.REGISTER_BEAN from getConfigurationPhase()"
      - "Annotate the condition class with @DeferredConditional(phase = REGISTER_BEAN), a meta-annotation that reschedules matches() into the deferred import-selector phase automatically"
      - "Return false from matches() on the container's first evaluation pass and true on the mandatory second pass, since Spring re-invokes every condition twice once all definitions are loaded"
    answer: 1
    explanation: |
      ConfigurationCondition adds getConfigurationPhase(); returning REGISTER_BEAN
      defers evaluation to when individual @Bean methods are registered (more
      definitions visible), versus PARSE_CONFIGURATION which decides whether the
      @Configuration class is even parsed. Choosing the wrong phase causes
      conditions that only sometimes work.
    ref: "concepts.md#conditional-registration-with-conditional"

  - id: advanced-bean-wiring-075
    difficulty: advanced
    tags: [conditional, component, definition-source]
    question: |
      A `@Conditional(OnFlag.class)` is placed on the `@Component`-annotated
      class `FeatureX`. Elsewhere a `@Bean FeatureX featureX()` method (no
      condition) also defines a bean of that type. If the flag is off, is a
      FeatureX bean present?
    options:
      - "No; a class-level @Conditional registers a global type filter, so once the flag is off the container vetoes every definition whose target type is FeatureX, including the unconditional @Bean method"
      - "No; Spring detects two definitions for the same type and aborts refresh with a ConflictingBeanDefinitionException before either FeatureX bean can be registered"
      - "Yes; the condition is attached to the component-scan definition source only. The unconditional @Bean method still registers a FeatureX bean because the condition does not apply to the Java type globally"
      - "No; the @Conditional silently propagates from the scanned class onto the matching @Bean method by type, so only the scanned definition survives while the @Bean one is suppressed"
    answer: 2
    explanation: |
      Conditions attach to the specific definition source (here, the scanned
      component), not to the type across the container. An independent @Bean
      method with no condition still registers its FeatureX bean regardless of the
      flag.
    ref: "concepts.md#conditional-registration-with-conditional"

  - id: advanced-bean-wiring-076
    difficulty: advanced
    tags: [conditional, profile, spring-vs-boot]
    question: |
      Which statement is precisely correct about condition support in plain
      Spring Framework 6 (no Spring Boot on the classpath)?
    options:
      - "@ConditionalOnProperty and @ConditionalOnMissingBean ship in the spring-context module, so plain Spring can gate beans on properties and on the absence of other beans without any Boot dependency"
      - "@Profile is a Spring Boot-only feature contributed by spring-boot-autoconfigure; core Spring Framework 6 offers no environment-profile support of its own"
      - "Core Spring provides @ConditionalOnClass for classpath checks but deliberately omits @ConditionalOnBean, which was left exclusively to the Boot autoconfigure module"
      - "Only the generic @Conditional + Condition SPI and @Profile (built on @Conditional via ProfileCondition) are available; the @ConditionalOnX family lives in spring-boot-autoconfigure"
    answer: 3
    explanation: |
      Core Spring ships @Conditional/Condition and @Profile (a meta-annotation
      using ProfileCondition). The rich @ConditionalOnClass/OnBean/OnMissingBean/
      OnProperty conditions are Spring Boot additions in the autoconfigure module.
    ref: "concepts.md#conditional-registration-with-conditional"

  - id: advanced-bean-wiring-077
    difficulty: expert
    tags: [smartfactorybean, eager-init, ordering]
    question: |
      A singleton `FactoryBean` implements `SmartFactoryBean` with
      `isEagerInit()` returning `true`. What behavior does this force during
      context refresh, and what stays the same?
    options:
      - "The FactoryBean instance itself is skipped during refresh and created only lazily on first &-dereference, while its product is what gets built eagerly ahead of the factory"
      - "Both the FactoryBean and the object returned by getObject() are silently downgraded to prototype scope, so a fresh product is fabricated on every single container lookup"
      - "It disables the container's factoryBeanObjectCache for that bean, forcing getObject() to re-execute on every access even though isSingleton() still returns true"
      - "The product of getObject() is created eagerly at the end of refresh (during preInstantiateSingletons) instead of on first access; the &-dereferenced factory retrieval and product caching semantics are unchanged"
    answer: 3
    explanation: |
      isEagerInit() true tells the container to materialize the singleton product
      during preInstantiateSingletons rather than lazily on first getBean. It does
      not change &-dereferencing or the singleton product cache; it only changes
      when the product is first produced.
    ref: "concepts.md#factorybean-versus-a-bean-factory-method"

  - id: advanced-bean-wiring-078
    difficulty: expert
    tags: [objectprovider, getobject-args, prototype]
    question: |
      A prototype-scoped `Report` bean has a constructor `Report(String title)`.
      A singleton injects `ObjectProvider<Report>` and needs a new `Report` with a
      runtime-computed title on each call. Which call correctly creates it, and
      what is the constraint?
    options:
      - "provider.getObject(title); the varargs overload forwards the args to getBean(name, args), which the container applies to the prototype's constructor/factory — usable only for prototype (non-singleton) beans, since explicit args cannot be applied to an already-cached singleton"
      - "provider.getIfAvailable(() -> new Report(title)); the getObject() method takes no parameters, so the supplier overload is the only way to feed a runtime-computed title into the constructor"
      - "provider.getObject(title) works uniformly for singletons too, since the container transparently replaces the cached singleton instance with a freshly-argument-constructed one on each call"
      - "You must call provider.stream().findFirst().get() to obtain the pooled prototype, then assign the computed title reflectively through a field setter afterward"
    answer: 0
    explanation: |
      ObjectProvider<T> declares getObject(Object... args), which delegates to
      BeanFactory.getBean(name, args) so the supplied arguments feed the target's
      constructor/factory method. Because explicit arguments only make sense when a
      fresh instance is created per call, this is valid for prototype-scoped beans;
      passing args to resolve a shared singleton is not supported (the cached
      instance already exists). getIfAvailable(Supplier) is a different mechanism —
      a fallback when no bean exists — not a way to pass constructor args.
    ref: "concepts.md#objectprovider-and-objectfactory-for-on-demand-lookup"
