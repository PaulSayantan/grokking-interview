topic: "Spring Data and Persistence Integration"
domain: spring-core
topic_slug: spring-data-persistence
version: 1
questions:
  - id: spring-data-persistence-001
    difficulty: beginner
    tags: [jpa, hibernate, spring-data, definitions]
    question: |
      Which statement correctly describes the relationship between JPA, Hibernate, and Spring Data JPA?
    options:
      - "JPA is a specification, Hibernate is an implementation of it, and Spring Data JPA is a repository abstraction built on top of a JPA provider"
      - "Hibernate is the specification, JPA is Hibernate's reference implementation, and Spring Data JPA replaces both at runtime"
      - "All three are competing ORM engines that each open their own JDBC connections and talk to the database directly"
      - "Spring Data JPA is the underlying specification that both Hibernate and JPA implement as concrete runtime providers"
    answer: 0
    explanation: |
      JPA (Jakarta/Java Persistence API) is a specification of interfaces and annotations. Hibernate
      is the most common implementation (provider) of that spec. Spring Data JPA is a library that
      generates repository implementations on top of a JPA provider — it is not itself an ORM.
    ref: "concepts.md#spring-data-vs-jpa-vs-hibernate"

  - id: spring-data-persistence-002
    difficulty: beginner
    tags: [jpa, specification]
    question: |
      What is JPA?
    options:
      - "A specification (set of interfaces and annotations) for object-relational mapping in Java"
      - "A concrete ORM runtime that generates SQL and manages connections"
      - "A Spring-only annotation library with no relationship to Jakarta EE"
      - "A JDBC database driver bundled with the JDK that speaks each vendor's wire protocol directly"
    answer: 0
    explanation: |
      JPA defines interfaces (like EntityManager) and annotations (@Entity, @Id) but ships no runtime.
      A provider such as Hibernate or EclipseLink implements it.
    ref: "concepts.md#spring-data-vs-jpa-vs-hibernate"

  - id: spring-data-persistence-003
    difficulty: intermediate
    tags: [spring-data, orm, delegation]
    question: |
      Which statement about Spring Data JPA is TRUE?
    options:
      - "It is itself a full ORM engine that maps objects to tables and generates the SQL dialect at runtime"
      - "It can only be used together with JdbcTemplate, which it wraps to execute every repository method"
      - "It requires Spring Boot auto-configuration to function and cannot be bootstrapped in a plain Spring context"
      - "It delegates all actual persistence to a JPA provider such as Hibernate and mainly removes boilerplate"
    answer: 3
    explanation: |
      Spring Data JPA is an abstraction/code-generation layer. It generates repository proxies but
      delegates the real ORM work (SQL generation, dirty checking) to the JPA provider, typically
      Hibernate. It is not an ORM and does not require Spring Boot.
    ref: "concepts.md#spring-data-vs-jpa-vs-hibernate"

  - id: spring-data-persistence-004
    difficulty: intermediate
    tags: [namespace, jakarta, versions]
    question: |
      In Spring Framework 6.x (with Spring Data 3.x and Hibernate 6.x), which package namespace is used for persistence annotations like @Entity and @Id?
    options:
      - "javax.persistence.*"
      - "jakarta.persistence.*"
      - "org.springframework.persistence.*"
      - "java.sql.persistence.*"
    answer: 1
    explanation: |
      Spring Framework 6 moved to Jakarta EE 9+, which renamed the namespace from javax.persistence.*
      to jakarta.persistence.*. Spring 5 / Spring Data 2 still use javax.persistence.*.
    ref: "concepts.md#spring-data-vs-jpa-vs-hibernate"

  - id: spring-data-persistence-005
    difficulty: beginner
    tags: [repository, hierarchy, marker]
    question: |
      What does the base Spring Data `Repository<T, ID>` interface declare?
    options:
      - "The full set of CRUD methods such as save, findById, and deleteById, inherited by all sub-interfaces"
      - "Only the paging and sorting methods findAll(Sort) and findAll(Pageable) for ordered access"
      - "No methods at all — it is a marker interface capturing the entity and id types"
      - "Only a single save() method that every concrete repository must override by hand"
    answer: 2
    explanation: |
      Repository<T, ID> is a marker interface with no methods. It tells Spring Data the interface is
      a managed repository and captures the domain type and id type via generics.
    ref: "concepts.md#repository-abstraction-hierarchy"

  - id: spring-data-persistence-006
    difficulty: beginner
    tags: [crud-repository, methods]
    question: |
      Which methods does `CrudRepository<T, ID>` provide?
    options:
      - "Paging and sorting methods such as findAll(Pageable) and findAll(Sort), but no plain save or delete"
      - "JPA-specific batching methods such as flush, saveAndFlush, and deleteAllInBatch only"
      - "Generic CRUD methods such as save, findById, findAll, count, and deleteById"
      - "Reactive, non-blocking Mono/Flux returning methods only, for use with R2DBC drivers"
    answer: 2
    explanation: |
      CrudRepository adds the standard create/read/update/delete operations: save, saveAll, findById,
      existsById, findAll, count, deleteById, delete, and so on.
    ref: "concepts.md#repository-abstraction-hierarchy"

  - id: spring-data-persistence-007
    difficulty: beginner
    tags: [paging-and-sorting-repository]
    question: |
      What does `PagingAndSortingRepository` add on top of basic repository operations?
    options:
      - "Methods to accept a Sort and a Pageable for sorting and pagination"
      - "Automatic second-level caching of every query result keyed by method arguments"
      - "Native SQL execution support that bypasses JPQL parsing for raw vendor queries"
      - "Declarative transaction management annotations applied to each generated method"
    answer: 0
    explanation: |
      PagingAndSortingRepository adds findAll(Sort) and findAll(Pageable), enabling sorted and paged
      access to the data.
    ref: "concepts.md#pageable-and-sort"

  - id: spring-data-persistence-008
    difficulty: intermediate
    tags: [jpa-repository, methods]
    question: |
      Which method is specific to `JpaRepository` (not present in the plain `CrudRepository`)?
    options:
      - "findById(ID id)"
      - "count()"
      - "deleteById(ID id)"
      - "saveAndFlush(entity)"
    answer: 3
    explanation: |
      JpaRepository adds JPA-specific conveniences like flush(), saveAndFlush(), deleteAllInBatch(),
      and getReferenceById(). The others are inherited from CrudRepository.
    ref: "concepts.md#repository-abstraction-hierarchy"

  - id: spring-data-persistence-009
    difficulty: intermediate
    tags: [repository, proxy, startup]
    question: |
      How does Spring Data provide a working implementation for an interface like `UserRepository extends JpaRepository<User, Long>`?
    options:
      - "You must hand-write a UserRepositoryImpl class implementing every declared method yourself"
      - "The interface is compiled directly into bytecode with concrete method bodies by the Java compiler"
      - "Hibernate scans the interface at build time and writes a generated .class file to the output directory"
      - "Spring Data generates a proxy implementation at runtime (backed by SimpleJpaRepository for JPA)"
    answer: 3
    explanation: |
      Spring Data creates a dynamic proxy at startup via a repository factory (JpaRepositoryFactoryBean),
      with SimpleJpaRepository as the default backing implementation. You do not write an Impl for the
      standard methods.
    ref: "concepts.md#repository-abstraction-hierarchy"

  - id: spring-data-persistence-010
    difficulty: intermediate
    tags: [find-by-id, get-reference-by-id]
    question: |
      What is the difference between `findById` and `getReferenceById` on a JpaRepository?
    options:
      - "They are identical aliases that both call EntityManager.find and return an Optional result"
      - "findById returns a lazy proxy and defers the query while getReferenceById always runs an immediate SELECT"
      - "getReferenceById caches its result in the second-level cache while findById always bypasses every cache"
      - "findById executes a SELECT immediately and returns Optional; getReferenceById returns a lazy proxy and defers the DB hit"
    answer: 3
    explanation: |
      findById calls EntityManager.find, runs a SELECT, and returns Optional.empty() when absent.
      getReferenceById calls EntityManager.getReference, returning a lazy proxy that hits the DB only
      when a property is accessed (throwing EntityNotFoundException lazily if missing).
    ref: "concepts.md#repository-abstraction-hierarchy"

  - id: spring-data-persistence-011
    difficulty: beginner
    tags: [derived-queries, method-names]
    question: |
      What is a "derived query method" in Spring Data?
    options:
      - "A query written in raw SQL inside an external orm.xml mapping file loaded at startup"
      - "A query Spring Data builds automatically by parsing the repository method's name"
      - "A database stored procedure invoked by name through an @Procedure annotation binding"
      - "A method that can only be called after the query is compiled at first invocation"
    answer: 1
    explanation: |
      Spring Data parses method names like findByLastName into a subject and predicate and generates
      the JPQL automatically, so no query string is needed.
    ref: "concepts.md#derived-query-methods"

  - id: spring-data-persistence-012
    difficulty: beginner
    tags: [derived-queries, keywords]
    question: |
      Which repository method name is a valid derived query for finding users whose last name equals a value AND whose first name equals a value?
    options:
      - "findByLastNameAndFirstName(String last, String first)"
      - "findLastNameFirstName(String last, String first)"
      - "queryLastNamePlusFirstName(String last, String first)"
      - "getWhereLastNameFirstName(String last, String first)"
    answer: 0
    explanation: |
      Derived queries combine properties with the And keyword: findByLastNameAndFirstName. The subject
      (findBy) and property names must match the entity fields.
    ref: "concepts.md#derived-query-methods"

  - id: spring-data-persistence-013
    difficulty: intermediate
    tags: [derived-queries, validation]
    question: |
      When are derived query method names validated against the entity's properties?
    options:
      - "Never — invalid names silently return null instead of raising any error at all"
      - "Only the first time the method is invoked at runtime, when the query string is lazily built"
      - "Only when the application shuts down and Spring Data verifies the metamodel during teardown"
      - "At application startup when the repository proxy is created"
    answer: 3
    explanation: |
      Spring Data parses and validates method names at bootstrap (when creating the repository proxy),
      so a typo in a property name fails fast at startup rather than at first call.
    ref: "concepts.md#derived-query-methods"

  - id: spring-data-persistence-014
    difficulty: intermediate
    tags: [derived-queries, traversal]
    question: |
      For a `User` that has an `Address` with a `city` property, how do you unambiguously express a derived query on `address.city`?
    options:
      - "findByAddress.city"
      - "findByAddress_City"
      - "findByAddress->City"
      - "findByAddress::City"
    answer: 1
    explanation: |
      An underscore disambiguates nested property traversal: findByAddress_City clearly means
      address.city rather than a property literally named addressCity.
    ref: "concepts.md#derived-query-methods"

  - id: spring-data-persistence-015
    difficulty: intermediate
    tags: [derived-queries, limiting]
    question: |
      What does the derived method `findTop3ByStatusOrderByCreatedAtDesc(Status status)` return?
    options:
      - "All users with the given status, always sorted ascending by createdAt regardless of the Desc keyword"
      - "The first 3 users with the given status, ordered by createdAt descending"
      - "Exactly one user, or an IncorrectResultSizeDataAccessException thrown if more than 3 rows match"
      - "A long count of the users that currently have the given status value"
    answer: 1
    explanation: |
      Top3 limits the result to 3 rows; OrderByCreatedAtDesc sorts descending by createdAt. find/read/get
      are equivalent subject keywords.
    ref: "concepts.md#derived-query-methods"

  - id: spring-data-persistence-016
    difficulty: beginner
    tags: [query-annotation, jpql]
    question: |
      What does the `@Query` annotation on a repository method let you do?
    options:
      - "Define an explicit JPQL or native SQL query for the method"
      - "Mark the method as transactional so it always runs inside its own read-write transaction"
      - "Enable query-result caching for the method, storing rows in the second-level cache by argument"
      - "Convert the repository method into an auto-exposed REST endpoint via Spring Data REST"
    answer: 0
    explanation: |
      @Query lets you declare the query text explicitly (JPQL by default, or native SQL with
      nativeQuery = true) when method-name derivation is not enough.
    ref: "concepts.md#the-query-annotation-jpql-and-native"

  - id: spring-data-persistence-017
    difficulty: intermediate
    tags: [query-annotation, jpql, native]
    question: |
      What is a key difference between a JPQL query and a native SQL query in @Query?
    options:
      - "JPQL is executed against the database engine while native SQL is interpreted row-by-row inside the JVM"
      - "Native SQL is portable across every database while JPQL is compiled and locked to a single vendor dialect"
      - "JPQL operates on entity classes/fields and is portable across databases; native SQL operates on tables/columns and is DB-specific"
      - "JPQL cannot bind any query parameters, whereas only native SQL supports positional and named parameters"
    answer: 2
    explanation: |
      JPQL is expressed in terms of entities and fields and the provider translates it to the target
      dialect, making it portable. Native SQL targets actual tables/columns and can use vendor-specific
      features but is tied to a database.
    ref: "concepts.md#the-query-annotation-jpql-and-native"

  - id: spring-data-persistence-018
    difficulty: intermediate
    tags: [query-annotation, native]
    question: |
      How do you make a `@Query` execute raw native SQL instead of JPQL?
    options:
      - "Set sql = true"
      - "Set nativeQuery = true"
      - "Prefix the query with NATIVE:"
      - "Annotate the method with @Native"
    answer: 1
    explanation: |
      @Query(value = "...", nativeQuery = true) tells Spring Data to run the string as raw SQL against
      the database rather than parsing it as JPQL.
    ref: "concepts.md#the-query-annotation-jpql-and-native"

  - id: spring-data-persistence-019
    difficulty: intermediate
    tags: [query-annotation, modifying]
    question: |
      Why must an UPDATE or DELETE `@Query` method also be annotated with `@Modifying`?
    options:
      - "To make the update method thread-safe so concurrent callers can invoke it without locking"
      - "To enable second-level caching of the affected rows so the update is reused across sessions"
      - "To register the method as a named query whose JPQL is precompiled and cached once at startup"
      - "So Spring executes it as a DML update (executeUpdate) rather than a SELECT (getResultList)"
    answer: 3
    explanation: |
      Without @Modifying, Spring Data assumes a SELECT and calls getResultList(). @Modifying signals a
      DML statement so it runs executeUpdate(); such methods return affected-row counts and need an
      active transaction.
    ref: "concepts.md#the-query-annotation-jpql-and-native"

  - id: spring-data-persistence-020
    difficulty: beginner
    tags: [query-annotation, param, binding]
    question: |
      In a JPQL @Query, how is the named parameter `:status` bound to a method argument?
    options:
      - "By annotating the argument with @Param(\"status\")"
      - "By naming the argument statusValue"
      - "It is bound automatically only if the argument is the first one"
      - "By annotating the argument with @Bind(\"status\")"
    answer: 0
    explanation: |
      Named parameters (:status) are bound using @Param("status") on the corresponding method argument.
      Positional parameters use ?1, ?2 and do not need @Param.
    ref: "concepts.md#the-query-annotation-jpql-and-native"

  - id: spring-data-persistence-021
    difficulty: beginner
    tags: [pageable, page-index]
    question: |
      In Spring Data, what is the index of the FIRST page when constructing a `PageRequest`?
    options:
      - "1"
      - "0"
      - "-1"
      - "It depends on the database"
    answer: 1
    explanation: |
      Page numbers in Spring Data are 0-based, so PageRequest.of(0, 20) requests the first page. This
      is a common off-by-one trap.
    ref: "concepts.md#pageable-and-sort"

  - id: spring-data-persistence-022
    difficulty: beginner
    tags: [pageable, page-request]
    question: |
      Which expression correctly requests page 2 (third page) with 20 items each, sorted by createdAt descending?
    options:
      - "PageRequest.of(2, 20, Sort.by(\"createdAt\").descending())"
      - "PageRequest.of(3, 20).sort(\"createdAt\")"
      - "new PageRequest(20, 2, \"createdAt DESC\")"
      - "Pageable.of(2, 20, \"createdAt\", DESC)"
    answer: 0
    explanation: |
      PageRequest.of(page, size, sort) is the standard factory. Page index 2 is the third page (0-based),
      size 20, and Sort.by(...).descending() sets the order.
    ref: "concepts.md#pageable-and-sort"

  - id: spring-data-persistence-023
    difficulty: intermediate
    tags: [page, slice, count-query]
    question: |
      What is the main difference between returning a `Page<T>` and a `Slice<T>` from a repository method?
    options:
      - "Page returns a reactive Flux of results while Slice blocks the calling thread until every row is fully materialized"
      - "Slice supports Sort-based ordering of its content but Page deliberately strips all sorting to keep its COUNT query cheap"
      - "Page can only be used with nativeQuery = true methods, whereas Slice is restricted to derived JPQL queries exclusively"
      - "Page runs an additional COUNT query to expose total elements/pages; Slice only knows whether a next slice exists and skips the count"
    answer: 3
    explanation: |
      Page carries total metadata (getTotalElements/getTotalPages) which requires an extra COUNT query.
      Slice only tracks hasNext() and issues no count query, making it cheaper for "load more" UIs.
    ref: "concepts.md#pageable-and-sort"

  - id: spring-data-persistence-024
    difficulty: intermediate
    tags: [sort]
    question: |
      Which statement about the `Sort` abstraction is correct?
    options:
      - "Sort can only ever sort by a single property, so ordering by lastName then age requires two separate queries"
      - "Sort is only usable inside nativeQuery = true methods and is silently ignored when applied to derived JPQL queries"
      - "Sort automatically paginates results, defaulting to the first 20 rows unless a page size is explicitly supplied"
      - "Sort describes ordering and can chain multiple properties, e.g. Sort.by(\"lastName\").ascending().and(Sort.by(\"age\").descending())"
    answer: 3
    explanation: |
      Sort describes ordering only (no paging). Multiple orders can be combined via and(), each with its
      own direction.
    ref: "concepts.md#pageable-and-sort"

  - id: spring-data-persistence-025
    difficulty: intermediate
    tags: [page, metadata]
    question: |
      Given `Page<User> page = repo.findByStatus(status, pageable);`, which call returns the total number of matching rows across all pages?
    options:
      - "page.getContent().size()"
      - "page.getNumberOfElements()"
      - "page.getTotalElements()"
      - "page.getSize()"
    answer: 2
    explanation: |
      getTotalElements() returns the total count across all pages. getContent().size() and
      getNumberOfElements() give the current page's row count, and getSize() is the page size.
    ref: "concepts.md#pageable-and-sort"

  - id: spring-data-persistence-026
    difficulty: beginner
    tags: [jdbc-template, purpose]
    question: |
      What does Spring's `JdbcTemplate` primarily do for you?
    options:
      - "Provides full ORM mapping with automatic dirty checking, lazy loading, and a first-level entity cache like Hibernate"
      - "Automatically generates the SQL for you by parsing repository method names such as findByLastNameAndStatus"
      - "Manages distributed XA transactions across microservices, coordinating a two-phase commit between their databases"
      - "Handles JDBC plumbing (connections, statements, result sets) and exception translation while you supply SQL and row mapping"
    answer: 3
    explanation: |
      JdbcTemplate removes boilerplate JDBC resource management and translates SQLException into
      DataAccessException, but it does no ORM — you write SQL and map rows yourself.
    ref: "concepts.md#jdbctemplate-basics"

  - id: spring-data-persistence-027
    difficulty: beginner
    tags: [jdbc-template, row-mapper]
    question: |
      What is the role of a `RowMapper<T>` when using `JdbcTemplate.query(...)`?
    options:
      - "It defines how each row of the ResultSet is converted into an object"
      - "It opens the JDBC connection before the query runs and closes it once every row has been read"
      - "It builds the parameterized SQL string dynamically by inspecting the mapped object's field names"
      - "It manages the surrounding transaction boundary, committing after the last row is mapped successfully"
    answer: 0
    explanation: |
      A RowMapper's mapRow(rs, rowNum) is invoked once per row to produce a domain object from the
      current ResultSet row.
    ref: "concepts.md#jdbctemplate-basics"

  - id: spring-data-persistence-028
    difficulty: intermediate
    tags: [jdbc-template, query-for-object]
    question: |
      What happens when `JdbcTemplate.queryForObject(...)` returns no rows?
    options:
      - "It returns null silently, leaving the caller to null-check the result before using it"
      - "It returns an empty Optional, since queryForObject wraps its single result in Optional by default"
      - "It returns a default-constructed instance of the requested type with all fields left at their defaults"
      - "It throws EmptyResultDataAccessException"
    answer: 3
    explanation: |
      queryForObject expects exactly one row. Zero rows throws EmptyResultDataAccessException; more than
      one throws IncorrectResultSizeDataAccessException.
    ref: "concepts.md#jdbctemplate-basics"

  - id: spring-data-persistence-029
    difficulty: intermediate
    tags: [jdbc-template, named-parameters]
    question: |
      Which Spring class supports named parameters like `:name` instead of positional `?` placeholders?
    options:
      - "SimpleJdbcTemplate"
      - "JpaTemplate"
      - "HibernateTemplate"
      - "NamedParameterJdbcTemplate"
    answer: 3
    explanation: |
      NamedParameterJdbcTemplate wraps a JdbcTemplate and binds :name placeholders using a
      MapSqlParameterSource or BeanPropertySqlParameterSource.
    ref: "concepts.md#jdbctemplate-basics"

  - id: spring-data-persistence-030
    difficulty: intermediate
    tags: [jdbc-template, update]
    question: |
      What does `JdbcTemplate.update("INSERT INTO users ...", args...)` return?
    options:
      - "The generated primary key"
      - "The number of rows affected"
      - "A ResultSet of the inserted rows"
      - "A boolean success flag"
    answer: 1
    explanation: |
      update() is used for INSERT/UPDATE/DELETE and returns the count of affected rows. Generated keys
      are retrieved separately via a KeyHolder.
    ref: "concepts.md#jdbctemplate-basics"

  - id: spring-data-persistence-031
    difficulty: beginner
    tags: [data-access-exception, unchecked]
    question: |
      Spring's `DataAccessException` hierarchy is rooted at a class that extends which type?
    options:
      - "Exception (checked)"
      - "RuntimeException (unchecked)"
      - "SQLException"
      - "Throwable directly"
    answer: 1
    explanation: |
      DataAccessException extends RuntimeException, so it is unchecked. This keeps DAO signatures clean
      and enables default transaction rollback on runtime exceptions.
    ref: "concepts.md#dataaccessexception-hierarchy-and-exception-translation"

  - id: spring-data-persistence-032
    difficulty: intermediate
    tags: [data-access-exception, technology-agnostic]
    question: |
      Why is the DataAccessException hierarchy considered "technology-agnostic"?
    options:
      - "Because it only works with JDBC and must be re-declared separately for each JPA or Hibernate data source"
      - "Because it forces every layer above the DAO to catch checked exceptions and rethrow them as runtime types"
      - "Because the same exception types can represent equivalent errors regardless of whether JDBC, JPA, or Hibernate raised them"
      - "Because it maps one-to-one with a single vendor's SQL error codes only, ignoring the portable SQLState values"
    answer: 2
    explanation: |
      Spring translates native exceptions (SQLException, PersistenceException, Hibernate exceptions) into
      a common hierarchy, so upper layers catch portable, meaningful exceptions rather than
      vendor-specific ones.
    ref: "concepts.md#dataaccessexception-hierarchy-and-exception-translation"

  - id: spring-data-persistence-033
    difficulty: intermediate
    tags: [repository-annotation, exception-translation]
    question: |
      Besides marking a class for component scanning, what does the `@Repository` annotation enable on a DAO?
    options:
      - "Automatic caching of all query results keyed by method arguments in the second-level cache"
      - "Automatic translation of native persistence exceptions into Spring's DataAccessException hierarchy"
      - "Automatic REST endpoint exposure, publishing each DAO method as a JSON HTTP resource at startup"
      - "Automatic sharding of writes across multiple databases based on the entity's primary-key hash"
    answer: 1
    explanation: |
      @Repository makes a bean eligible for persistence exception translation. A
      PersistenceExceptionTranslationPostProcessor adds AOP advice that converts native exceptions into
      DataAccessException subtypes.
    ref: "concepts.md#dataaccessexception-hierarchy-and-exception-translation"

  - id: spring-data-persistence-034
    difficulty: intermediate
    tags: [data-access-exception, integrity]
    question: |
      A unique-constraint violation on insert would most appropriately surface as which Spring exception?
    options:
      - "EmptyResultDataAccessException, since the duplicate row is rejected and effectively returns nothing"
      - "DataIntegrityViolationException (or its subclass DuplicateKeyException)"
      - "QueryTimeoutException, raised because the constraint check made the insert exceed its statement timeout"
      - "BadSqlGrammarException, because a rejected unique insert is reported by the driver as malformed SQL"
    answer: 1
    explanation: |
      Constraint violations (unique, NOT NULL, foreign key) map to DataIntegrityViolationException;
      duplicate-key violations specifically map to its subclass DuplicateKeyException.
    ref: "concepts.md#dataaccessexception-hierarchy-and-exception-translation"

  - id: spring-data-persistence-035
    difficulty: intermediate
    tags: [jdbc-template, exception-translation]
    question: |
      Does `JdbcTemplate` need the `@Repository` annotation to translate `SQLException` into a `DataAccessException`?
    options:
      - "Yes, translation only happens on @Repository beans that the exception-translation post-processor advises"
      - "No — JdbcTemplate performs translation internally via a SQLExceptionTranslator"
      - "No, but only if Hibernate is also on the classpath to contribute its own dialect-based translator"
      - "Yes, and it also needs @Transactional so the translating AOP advice can wrap each query call"
    answer: 1
    explanation: |
      JdbcTemplate translates SQLException internally using a SQLExceptionTranslator (error-code based,
      falling back to SQLState), so you get the DataAccessException hierarchy even without @Repository.
    ref: "concepts.md#dataaccessexception-hierarchy-and-exception-translation"

  - id: spring-data-persistence-036
    difficulty: beginner
    tags: [n-plus-1, definition]
    question: |
      What is the N+1 select problem?
    options:
      - "Running a single query that mistakenly returns N+1 rows because of an off-by-one in the LIMIT clause"
      - "Issuing 1 query to load N parent entities, then N more queries (one per parent) to load a lazy association"
      - "A locking conflict that arises when N+1 transactions try to update the same rows concurrently"
      - "A rounding error in pagination totals where the reported page count is one higher than the actual"
    answer: 1
    explanation: |
      N+1 occurs when the ORM loads N parents with one query, then fires an extra query per parent to
      fetch a lazy association, totaling N+1 queries instead of one or two.
    ref: "concepts.md#the-n-plus-1-problem"

  - id: spring-data-persistence-037
    difficulty: intermediate
    tags: [n-plus-1, fetch-type]
    question: |
      Which JPA fetch type is the default for a `@OneToMany` collection, and contributes to N+1 when iterated?
    options:
      - "FetchType.EAGER"
      - "FetchType.LAZY"
      - "FetchType.BATCH"
      - "FetchType.JOIN"
    answer: 1
    explanation: |
      @OneToMany (and @ManyToMany) default to LAZY, so each parent's collection is loaded on first
      access — iterating N parents fires N extra queries. (@ManyToOne/@OneToOne default to EAGER.)
    ref: "concepts.md#the-n-plus-1-problem"

  - id: spring-data-persistence-038
    difficulty: intermediate
    tags: [n-plus-1, fixes]
    question: |
      Which of the following is an effective way to avoid the N+1 problem?
    options:
      - "Use a JOIN FETCH in JPQL or an @EntityGraph to load the association in one query"
      - "Wrap every lazy-association getter call in a try/catch block that retries the load once on failure"
      - "Increase the database connection pool size so the per-parent queries can all run in parallel"
      - "Switch all queries to native SQL without changing the underlying fetch strategy at all"
    answer: 0
    explanation: |
      JOIN FETCH (or @EntityGraph, batch fetching, or DTO projections) loads parents and their
      associations together, collapsing the N+1 queries into one or a few.
    ref: "concepts.md#the-n-plus-1-problem"

  - id: spring-data-persistence-039
    difficulty: intermediate
    tags: [n-plus-1, entity-graph]
    question: |
      What does annotating a repository method with `@EntityGraph(attributePaths = "books")` do?
    options:
      - "It cascades a delete to the books association whenever the parent row is removed by that query"
      - "It declaratively tells the provider to eagerly fetch the books association for that query, avoiding N+1"
      - "It caches the books collection in the second-level cache permanently across every transaction"
      - "It permanently rewrites the books association's mapping metadata from @OneToMany to @ManyToOne"
    answer: 1
    explanation: |
      An entity graph specifies a fetch plan for a specific query, so the provider joins/fetches the
      named attribute(s) in the same query rather than lazily per parent.
    ref: "concepts.md#the-n-plus-1-problem"

  - id: spring-data-persistence-040
    difficulty: beginner
    tags: [entity-manager, session, persistence-context]
    question: |
      In JPA, which interface represents the persistence context / unit of work, and what is Hibernate's native equivalent?
    options:
      - "EntityManager (JPA) and Session (Hibernate)"
      - "SessionFactory (JPA) and EntityManager (Hibernate)"
      - "Connection (JPA) and Statement (Hibernate)"
      - "Repository (JPA) and DAO (Hibernate)"
    answer: 0
    explanation: |
      JPA's EntityManager and Hibernate's Session both represent the persistence context. In fact
      Hibernate's Session extends jakarta.persistence.EntityManager.
    ref: "concepts.md#entitymanager-vs-session"

  - id: spring-data-persistence-041
    difficulty: intermediate
    tags: [entity-manager, thread-safety]
    question: |
      Which statement about thread-safety of JPA/Hibernate objects is correct?
    options:
      - "EntityManager and Session are thread-safe singletons that can be shared freely across all request threads"
      - "EntityManagerFactory/SessionFactory are thread-safe and typically singletons, while EntityManager/Session are not thread-safe and are short-lived"
      - "Both the factories and the managers are non-thread-safe and must be recreated fresh for every single request"
      - "Only the EntityManager is thread-safe, so the factory that builds it must be locked before each call"
    answer: 1
    explanation: |
      The factories (EntityManagerFactory/SessionFactory) are expensive, thread-safe singletons. The
      EntityManager/Session are lightweight, not thread-safe, and used per transaction/request.
    ref: "concepts.md#entitymanager-vs-session"

  - id: spring-data-persistence-042
    difficulty: intermediate
    tags: [entity-manager, unwrap]
    question: |
      How can you access Hibernate's native `Session` API from a JPA `EntityManager` when you need a Hibernate-only feature?
    options:
      - "em.getSession()"
      - "em.cast(Session)"
      - "em.unwrap(Session.class)"
      - "You cannot — the APIs are completely separate"
    answer: 2
    explanation: |
      EntityManager.unwrap(Session.class) returns the underlying provider-specific implementation,
      letting you use Hibernate features (like StatelessSession or filters) when needed.
    ref: "concepts.md#entitymanager-vs-session"

  - id: spring-data-persistence-043
    difficulty: intermediate
    tags: [entity-manager, persistence-context, injection]
    question: |
      How does Spring typically inject an `EntityManager` into a DAO, and what is special about it?
    options:
      - "Via @Autowired, which constructs and injects a brand-new EntityManager instance on every single method call"
      - "Via @PersistenceContext, which injects a shared, transaction-scoped proxy that routes to the correct thread-bound EntityManager"
      - "Via a static factory method that returns one global singleton EntityManager reused across every request"
      - "It cannot be injected; you must call EntityManagerFactory.createEntityManager() manually every time"
    answer: 1
    explanation: |
      @PersistenceContext injects a shared EntityManager proxy. Spring routes each call to the actual
      EntityManager bound to the current transaction/thread, so it is used safely across requests.
    ref: "concepts.md#entitymanager-vs-session"

  - id: spring-data-persistence-044
    difficulty: beginner
    tags: [entity-states]
    question: |
      In JPA, an entity that was previously managed but whose persistence context has been closed is in which state?
    options:
      - "Transient"
      - "Managed"
      - "Detached"
      - "Removed"
    answer: 2
    explanation: |
      A detached entity was once managed but is no longer tracked (context closed or entity evicted).
      Transient means never associated; managed means currently tracked; removed means scheduled for
      deletion.
    ref: "concepts.md#entitymanager-vs-session"

  - id: spring-data-persistence-045
    difficulty: advanced
    tags: [repository, transactions, simple-jpa-repository, readonly]
    question: |
      A service method annotated `@Transactional` (read-write) calls `userRepository.save(user)`.
      Given that `SimpleJpaRepository` is annotated `@Transactional(readOnly = true)` at the class
      level and `@Transactional` (read-write) on `save`, what actually governs the transaction that
      `save` runs in?
    options:
      - "The repository's own @Transactional starts a brand-new nested transaction that is read-write only for save"
      - "The repository's class-level readOnly = true wins, so the save silently runs read-only and is not persisted"
      - "Because the default propagation is REQUIRED, save joins the caller's already-active read-write transaction and the repository's own annotations are effectively ignored"
      - "A new read-only connection is opened for save while the caller's transaction is suspended"
    answer: 2
    explanation: |
      With REQUIRED propagation, an already-active transaction is joined rather than a new one being
      started. The repository's readOnly hint only takes effect when the repository method itself
      begins the transaction. That is precisely why placing @Transactional on the service layer (not
      the repository) is the recommended pattern.
    ref: "concepts.md#repository-abstraction-hierarchy"

  - id: spring-data-persistence-046
    difficulty: expert
    tags: [readonly, flush-mode, hibernate, dirty-checking]
    question: |
      Inside a `@Transactional(readOnly = true)` method you load a managed entity, mutate one of its
      fields, and return. No exception is thrown and nothing is persisted. What is the most precise
      explanation of why the change was not written?
    options:
      - "readOnly sets the Hibernate FlushMode to MANUAL, so automatic dirty-checking flush is skipped and the pending UPDATE is never issued"
      - "readOnly makes the entity immutable, so the setter call throws silently and is swallowed"
      - "readOnly detaches every loaded entity immediately after loading, so the setter operates on a detached copy"
      - "readOnly opens a separate read-only EntityManager whose changes are discarded at method exit"
    answer: 0
    explanation: |
      For read-only transactions Spring switches Hibernate to FlushMode.MANUAL and hints the JDBC
      connection read-only. The entity is still managed and the setter succeeds in memory, but because
      no automatic flush occurs, the UPDATE is never emitted. This is a performance optimization and a
      well-known footgun when a mutation was actually intended.
    ref: "concepts.md#transaction-semantics-in-the-data-layer"

  - id: spring-data-persistence-047
    difficulty: advanced
    tags: [derived-queries, delete, bulk, lifecycle]
    question: |
      A repository declares `long deleteByStatus(Status status);` (a derived delete, not a
      `@Modifying @Query`). Compared with a `@Modifying @Query("delete from User u where u.status = :s")`
      method, how does the derived version behave?
    options:
      - "Both compile down to the identical single bulk DELETE statement and share the same execution plan, so they are fully interchangeable in every respect"
      - "The derived version first SELECTs the matching entities into the persistence context and removes them one by one, firing @PreRemove callbacks and cascades; the @Modifying version issues one bulk DELETE that bypasses the context"
      - "The derived version throws at application startup because deleteBy is parsed as an unknown derived subject keyword and fails repository proxy creation"
      - "The @Modifying bulk version fires all JPA lifecycle callbacks and cascades while the derived deleteBy version quietly bypasses every one of them"
    answer: 1
    explanation: |
      Derived deletes load the entities and delete them individually so JPA lifecycle callbacks and
      cascades run; the return value is the count (or the entities if the method returns a collection).
      A @Modifying bulk delete runs a single SQL DELETE and bypasses the persistence context and
      callbacks entirely.
    ref: "concepts.md#derived-query-methods"

  - id: spring-data-persistence-048
    difficulty: expert
    tags: [modifying, bulk-update, persistence-context, stale-state]
    question: |
      Within one transaction you load `user` (managed), then call a `@Modifying` bulk update
      `update User u set u.status = 'BANNED' where u.id = :id` for that same id, then read
      `user.getStatus()`. Without any extra flags, what does `user.getStatus()` return and why?
    options:
      - "The original (pre-update) status, because a bulk update runs directly against the database and does not touch the already-loaded entity in the first-level cache"
      - "BANNED, because a @Modifying bulk update automatically refreshes every managed entity in the context that matches its WHERE clause"
      - "null, because the bulk update evicts the previously-loaded entity from the persistence context and leaves its reference uninitialized"
      - "It throws OptimisticLockingFailureException because the bulk update bumped the entity's @Version column out from under it"
    answer: 0
    explanation: |
      Bulk JPQL updates execute straight against the database and never synchronize the first-level
      cache, so the previously-loaded managed instance keeps its stale in-memory state. Use
      @Modifying(clearAutomatically = true) to clear the context afterward (aware that it discards
      un-flushed changes) so a subsequent read reloads fresh state.
    ref: "concepts.md#the-query-annotation-jpql-and-native"

  - id: spring-data-persistence-049
    difficulty: expert
    tags: [modifying, version, optimistic-locking, bulk]
    question: |
      Why can a `@Modifying` JPQL bulk `update` silently undermine optimistic locking for other
      concurrent transactions?
    options:
      - "Because bulk updates always escalate to a table-level pessimistic write lock that starves every optimistic reader until the statement commits"
      - "Because bulk updates do not increment the @Version column (unless you set it explicitly) and do not fire the WHERE version = ? check, so concurrent version-based conflict detection is bypassed"
      - "Because bulk updates are always promoted to a separate REQUIRES_NEW transaction that commits ahead of the caller and hides the version change"
      - "Because @Modifying forces FlushMode.MANUAL for the whole session, which globally disables @Version tracking for every entity"
    answer: 1
    explanation: |
      A JPQL bulk update neither increments @Version nor participates in the optimistic version check
      unless you explicitly write set u.version = u.version + 1. Managed entities elsewhere still hold
      the old version, so their later optimistic updates may succeed or fail incorrectly relative to
      the bulk change. Bulk updates also skip cascades and lifecycle callbacks.
    ref: "concepts.md#optimistic-and-pessimistic-locking"

  - id: spring-data-persistence-050
    difficulty: advanced
    tags: [page, count-query, optimization, pageable-execution-utils]
    question: |
      The claim "returning `Page<T>` always triggers an extra COUNT query" is an over-simplification.
      When does Spring Data legitimately skip the count query for a `Page`?
    options:
      - "When PageableExecutionUtils can infer the total arithmetically — e.g. the first page comes back with fewer rows than the requested page size, or a non-first page returns short"
      - "Whenever the method is annotated @Query with nativeQuery = true, since native SQL cannot be counted separately"
      - "Never — a Page always issues its own dedicated count query by design, regardless of the returned content"
      - "Only when the repository extends PagingAndSortingRepository directly rather than the wider JpaRepository interface"
    answer: 0
    explanation: |
      PageableExecutionUtils avoids the count query when the total is derivable from the returned
      content: a first page shorter than the page size means the content size is the total; a short
      non-first page lets it compute offset + content size. Otherwise it runs the count.
    ref: "concepts.md#pageable-and-sort"

  - id: spring-data-persistence-051
    difficulty: expert
    tags: [join-fetch, pageable, hibernate, in-memory-pagination]
    question: |
      A method uses `@Query("select a from Author a join fetch a.books")` and also accepts a
      `Pageable`. In production against a large table it triggers `HHH000104` and eventually OOMs.
      What is happening and what is the correct fix?
    options:
      - "Hibernate correctly applies LIMIT/OFFSET in the generated SQL but the JDBC driver silently ignores the clause, so the whole table streams back; the fix is enabling a vendor-specific driver paging flag"
      - "Because a collection join fetch multiplies rows, Hibernate cannot safely apply SQL LIMIT/OFFSET, so it fetches the entire result set and paginates in memory; fix with a two-step query — page parent IDs first, then fetch children for that page (or use @EntityGraph/@BatchSize)"
      - "The distinct keyword is missing from the JPQL, which forces the optimizer into a full table scan on every page; simply adding distinct restores index usage and fixes it"
      - "Pageable is fundamentally incompatible with a fetch-join @Query and must be replaced with manual setFirstResult/setMaxResults calls on the EntityManager"
    answer: 1
    explanation: |
      Applying a SQL limit to a collection-fetch join would truncate a parent's children, so Hibernate
      warns (HHH000104) and paginates in memory after loading everything. The standard remedy is to
      page the root entities/IDs without the fetch join, then fetch the associations for just that page
      via an IN query, @EntityGraph, or @BatchSize.
    ref: "concepts.md#the-n-plus-1-problem"

  - id: spring-data-persistence-052
    difficulty: expert
    tags: [n-plus-1, multiple-bag-fetch, hibernate, collections]
    question: |
      An entity has two `List`-typed collections both mapped `@OneToMany`. A query does
      `join fetch a.books join fetch a.awards`. Hibernate throws
      `MultipleBagFetchException: cannot simultaneously fetch multiple bags`. Which fix is valid AND
      why does the exception occur?
    options:
      - "Two List (bag) fetches produce an ambiguous cartesian product that cannot be mapped back into two lists; fix by changing one collection to a Set, or adding @OrderColumn to make it an indexed List, or fetching one collection per query / using @BatchSize"
      - "The exception is a known Hibernate regression; simply retry the query with the hibernate.query.passDistinctThrough=true hint enabled and both bags then map correctly"
      - "Bags can never be fetched in a query at all, so you must permanently switch both @OneToMany associations over to @ManyToOne to make the fetch join legal"
      - "The exception is raised only under EAGER fetch; flipping both collections to LAZY silently resolves it while still keeping everything in a single fetch-join query"
    answer: 0
    explanation: |
      A bag (unordered List) has no positional identity, so fetching two bags in one query yields a
      cartesian product Hibernate cannot deterministically distribute across the two lists. Making one a
      Set (or an @OrderColumn-indexed List), or fetching the collections in separate queries / via
      @BatchSize, resolves it.
    ref: "concepts.md#the-n-plus-1-problem"

  - id: spring-data-persistence-053
    difficulty: advanced
    tags: [merge, persist, detached, entity-manager]
    question: |
      You load an entity, close the transaction (it becomes detached), later call
      `managed = em.merge(detached)`, then continue to mutate the original `detached` reference and
      call `flush()`. Why are those later mutations lost?
    options:
      - "merge schedules the passed-in detached instance for deletion, so any further use of that reference afterward is undefined behavior"
      - "merge copies state onto (and returns) a distinct managed instance; the original argument stays detached, so mutations to it are not tracked and never flushed"
      - "flush() only writes entities that were originally created through persist, and it silently ignores any instance that came back from a merge call"
      - "The detached entity must first be re-attached by calling em.persist on it, otherwise the subsequent merge is treated as a no-op"
    answer: 1
    explanation: |
      merge does not attach the passed-in instance; it returns a separate managed copy. Dirty checking
      tracks only that returned instance. Continuing to modify the original detached reference has no
      effect on the persistent state — a very common bug. Always use the return value of merge.
    ref: "concepts.md#entitymanager-vs-session"

  - id: spring-data-persistence-054
    difficulty: expert
    tags: [save, isnew, assigned-id, persist, merge, performance]
    question: |
      An entity uses an application-assigned (non-generated) `@Id` and no `@Version`. Every call to
      `repository.save(newEntity)` for a brand-new row issues an extra `SELECT` before the `INSERT`.
      What is the root cause and a correct remedy?
    options:
      - "Because EntityInformation.isNew returns false for a non-null assigned id, save() calls merge (which SELECTs to load current state) instead of persist; implement Persistable.isNew, or add a @Version / @CreatedDate field so newness can be detected without a SELECT"
      - "Spring Data unconditionally runs a SELECT before every INSERT to check for duplicates, so the only remedy is to bypass the repository with a hand-written native @Query insert"
      - "The extra SELECT is Hibernate validating that the id generator is registered; switching the id to GenerationType.IDENTITY removes the pre-insert lookup entirely"
      - "The SELECT comes from the second-level cache warming its region on first access; disabling the L2 cache for that entity removes the redundant query"
    answer: 0
    explanation: |
      SimpleJpaRepository.save uses isNew to choose persist vs merge. With an assigned id and no
      version, the id is non-null so isNew is false, so save does a merge, which fetches the row first.
      Implementing Persistable (custom isNew) or adding a @Version/@CreatedDate marker lets Spring
      detect newness and call persist directly.
    ref: "concepts.md#entitymanager-vs-session"

  - id: spring-data-persistence-055
    difficulty: expert
    tags: [flush-order, action-queue, hibernate, ordering]
    question: |
      Within one transaction you `persist(childReferencingParent)` and then `remove(oldParent)` in
      that Java order, yet on commit you get a foreign-key violation in an order you did not expect.
      What best explains Hibernate's behavior?
    options:
      - "Hibernate executes the emitted SQL in the exact order the persist and remove methods are invoked on the EntityManager, so your Java call order is literally the SQL order and the sequencing bug is yours"
      - "On flush Hibernate reorders operations by type via the ActionQueue (inserts, then updates, then collection ops, then deletes), not by call order, so the emitted SQL sequence differs from your method-call sequence"
      - "Both persist and remove are deferred until commit, where Hibernate sorts every pending statement alphabetically by mapped entity name before emitting them, so the FK order depends purely on class naming"
      - "The remove action is always flushed before any persist action regardless of the associations between them, which Hibernate documents as a fixed, non-configurable ordering rule of its flush phase"
    answer: 1
    explanation: |
      Hibernate's ActionQueue groups and orders pending actions by category on flush — inserts first,
      then updates, then collection removals/updates, then entity deletes — preserving insertion order
      within each category. This write-behind reordering is why call order does not equal SQL order,
      and why manual flush is sometimes needed to force a particular sequence.
    ref: "concepts.md#persistence-context-lifecycle-and-flush-timing"

  - id: spring-data-persistence-056
    difficulty: advanced
    tags: [exception-translation, boundary, flush, commit]
    question: |
      A DAO annotated `@Repository` inserts a row that violates a unique constraint, but the exception
      surfaces to the caller as a raw `PersistenceException` rather than a Spring
      `DataIntegrityViolationException`. What is the most likely reason?
    options:
      - "The constraint violation is thrown at flush/commit time, which happens at the transaction boundary outside the @Repository method, so the AOP translation advisor around the DAO is no longer on the call stack"
      - "The @Repository annotation never enables persistence-exception translation at all; only JdbcTemplate can convert native exceptions into the DataAccessException hierarchy, so a JPA DAO always sees raw provider exceptions"
      - "DataIntegrityViolationException is a checked exception, so the translation advisor cannot throw it implicitly and the DAO must catch the native exception and rethrow the Spring type by hand"
      - "Exception translation is wired only around read operations, so it fires for SELECT queries but is deliberately skipped for INSERT/UPDATE writes where constraint violations arise"
    answer: 0
    explanation: |
      Native persistence exceptions are frequently deferred until flush/commit, which occurs at the
      transaction boundary — typically the service layer — after the @Repository method has returned
      and its translation interceptor is off the stack. Spring's JpaTransactionManager does translate
      on commit for JPA, but this timing asymmetry is why the raw exception can escape.
    ref: "concepts.md#dataaccessexception-hierarchy-and-exception-translation"

  - id: spring-data-persistence-057
    difficulty: advanced
    tags: [duplicate-key, data-integrity, jpa, jdbc, translation]
    question: |
      Why is it unreliable to catch `DuplicateKeyException` specifically to handle a unique-constraint
      violation coming from a JPA/Hibernate write?
    options:
      - "DuplicateKeyException does not exist anywhere in Spring's DataAccessException hierarchy and was removed in Spring 5, so any code referencing it fails to compile against modern Spring Data releases"
      - "JPA/Hibernate writes typically surface unique violations as the more general DataIntegrityViolationException, because the fine-grained duplicate-key discrimination lives in the JDBC error-code translator rather than the JPA dialect"
      - "DuplicateKeyException is raised only for primary-key collisions and never for secondary unique-index violations across every persistence technology, so a plain unique constraint can never trigger it"
      - "Hibernate silently suppresses all constraint-violation exceptions on write and instead returns an affected-row count of 0, leaving the caller to detect the duplicate by inspecting that count"
    answer: 1
    explanation: |
      The precise mapping to DuplicateKeyException depends on vendor error codes handled by the JDBC
      SQLExceptionTranslator. Through the JPA/Hibernate path the violation is usually reported as the
      broader DataIntegrityViolationException, so code should catch that (the superclass) for ORM
      writes rather than relying on the more specific subtype.
    ref: "concepts.md#dataaccessexception-hierarchy-and-exception-translation"

  - id: spring-data-persistence-058
    difficulty: advanced
    tags: [transient, non-transient, retry, hierarchy]
    question: |
      A retry framework wants to retry only data-access failures where retrying the identical
      operation might succeed. Which branch of the DataAccessException hierarchy should it key off,
      and which example belongs to it?
    options:
      - "TransientDataAccessException — e.g. a deadlock-loser or lock-timeout failure, where a later retry may succeed"
      - "NonTransientDataAccessException — e.g. a deadlock-loser or lock-timeout failure, since these are the canonical transient errors Spring files under the non-transient branch for retry frameworks to target"
      - "BadSqlGrammarException — because malformed SQL is inherently retryable, and re-issuing the identical statement lets the parser succeed once the query cache has warmed on the second attempt"
      - "DataIntegrityViolationException — because constraint violations clear themselves on retry once the conflicting row from the first attempt has been rolled back by the transaction manager"
    answer: 0
    explanation: |
      TransientDataAccessException marks failures where retrying the same call may succeed (deadlock
      loser, lock acquisition timeout, transient connectivity). NonTransientDataAccessException (bad
      SQL grammar, constraint violation) will keep failing until the underlying cause is fixed, so
      retrying is pointless.
    ref: "concepts.md#dataaccessexception-hierarchy-and-exception-translation"

  - id: spring-data-persistence-059
    difficulty: advanced
    tags: [jdbc-template, connection, transactions, datasource-utils]
    question: |
      When a `JdbcTemplate` runs inside a Spring `@Transactional` method, how does it obtain its JDBC
      `Connection`, and why does this matter?
    options:
      - "It opens a fresh Connection straight from the DriverManager on every call and immediately puts it in autocommit mode, so each statement silently commits on its own and runs outside the surrounding @Transactional boundary"
      - "It obtains the Connection via DataSourceUtils.getConnection(dataSource), which returns the transaction-bound connection when a Spring transaction is active, so the template participates in the same transaction rather than opening a second connection"
      - "It requires the caller to wrap it in an explicit TransactionTemplate.execute block, and without that wrapper every JdbcTemplate statement is auto-committed independently and ignores @Transactional entirely"
      - "It reuses one global Connection instance shared across all request threads, serialized behind an internal lock, so concurrent transactional methods queue up on that single shared connection"
    answer: 1
    explanation: |
      JdbcTemplate acquires connections through DataSourceUtils, which is transaction-aware: when a
      Spring-managed transaction is bound to the thread, it hands back that same connection so the
      template's statements are part of the transaction. Otherwise it borrows and releases a connection
      per operation.
    ref: "concepts.md#jdbctemplate-basics"

  - id: spring-data-persistence-060
    difficulty: expert
    tags: [jdbc-template, query-for-object, null, primitives]
    question: |
      `int total = jdbc.queryForObject("SELECT SUM(amount) FROM orders WHERE user_id = ?", Integer.class, userId);`
      For a user with no orders, `SUM` returns SQL NULL. What happens?
    options:
      - "The query returns exactly one row whose single column is NULL, so queryForObject returns a null Integer, and unboxing it into the int primitive throws NullPointerException"
      - "queryForObject throws EmptyResultDataAccessException, because a SUM that evaluates to NULL is treated by Spring as having produced no result row for the requested Integer type"
      - "It returns 0, because Spring's single-column extractor coerces a NULL aggregate to the boxed type's primitive default before handing the value back to the caller"
      - "It throws IncorrectResultSizeDataAccessException, because a NULL aggregate is counted as zero rows and queryForObject strictly demands exactly one matching row"
    answer: 0
    explanation: |
      An aggregate like SUM over zero rows still returns one row containing NULL, so there is exactly
      one row (no EmptyResult exception). queryForObject returns null, and autounboxing null to int
      throws NPE. Guard with COALESCE(SUM(amount), 0) or read into a Long/Integer and null-check.
    ref: "concepts.md#jdbctemplate-basics"

  - id: spring-data-persistence-061
    difficulty: expert
    tags: [jdbc-template, result-set-extractor, row-mapper, joins]
    question: |
      You must map a one-to-many join (parent LEFT JOIN children) into a `List<Parent>` where each
      parent holds its children, using `JdbcTemplate`. Why is a `RowMapper<Parent>` the wrong tool,
      and what is correct?
    options:
      - "RowMapper is the correct tool here; you return one Parent per row and Spring's query() method automatically deduplicates parents by equals/hashCode and folds the child rows into each parent's collection"
      - "The join duplicates parent columns across child rows, and a RowMapper produces one object per row with no way to deduplicate, yielding repeated parents; a ResultSetExtractor that reads the whole ResultSet and assembles a Map<parentId, Parent> is the right approach"
      - "You must switch to NamedParameterJdbcTemplate, which detects the one-to-many join and auto-groups the repeated joined rows into a nested List<Parent> for you"
      - "RowCallbackHandler is the required tool because it processes rows statefully and returns the fully grouped List<Parent> directly from its handleRow callback"
    answer: 1
    explanation: |
      A LEFT JOIN repeats each parent's columns once per child. A RowMapper is invoked per row and
      cannot merge rows, so parents get duplicated. A ResultSetExtractor sees the entire ResultSet and
      can build a keyed map, appending children to the already-seen parent — the JDBC way to avoid an
      N+1 without an ORM.
    ref: "concepts.md#jdbctemplate-basics"

  - id: spring-data-persistence-062
    difficulty: advanced
    tags: [pageable, keyset, seek, scroll, deep-offset]
    question: |
      A report screen paginates a 50-million-row table with `LIMIT 20 OFFSET 2000000` and gets
      progressively slower on later pages. What is the cause and the recommended advanced remedy?
    options:
      - "The extra COUNT query dominates on deep pages; switching the return type from Page to Slice removes the offset cost entirely and makes every page load in constant time"
      - "The JDBC fetch size is set too small for deep pages; raising it via setFetchSize lets the driver skip directly to the offset row, making OFFSET pagination effectively constant-time"
      - "OFFSET forces the database to scan and discard all rows before the offset (O(offset)); keyset/seek pagination (WHERE (created_at, id) < (?, ?) ORDER BY ... LIMIT 20), modeled by Spring Data's Scroll/ScrollPosition, makes each page O(page size)"
      - "An explicit ORDER BY is missing; once you add one the database can binary-search to the offset via the sort index, which makes OFFSET paging constant-time regardless of how deep the page is"
    answer: 2
    explanation: |
      OFFSET n still reads and throws away n rows, so deep pages cost more and more. Keyset (seek)
      pagination remembers the last row's ordering key and filters with a comparison, letting an index
      jump straight to the next page. Spring Data 3.1+ supports this via Scroll/ScrollPosition and
      keyset positions.
    ref: "concepts.md#pageable-and-sort"

  - id: spring-data-persistence-063
    difficulty: advanced
    tags: [derived-queries, order-by, sort, conflict]
    question: |
      A method is declared `List<User> findByStatusOrderByCreatedAtAsc(Status s, Sort sort)` and the
      caller passes `Sort.by("lastName").descending()`. What ordering does the generated SQL apply?
    options:
      - "Only the dynamic Sort (last_name DESC) is applied; the static OrderByCreatedAtAsc in the method name is completely overridden because a runtime Sort argument always takes precedence over parsed name ordering"
      - "Only the static OrderBy (created_at ASC) is applied; the Sort parameter is silently ignored for any derived method whose name already contains an OrderBy clause"
      - "Both — the dynamic Sort is appended after the static OrderBy, giving ORDER BY created_at ASC, last_name DESC; to make ordering fully dynamic, drop the OrderBy from the method name"
      - "It fails during repository proxy creation at startup, because Spring Data forbids a derived method name containing OrderBy from also declaring a Sort parameter and reports the two as a conflicting-ordering configuration error"
    answer: 2
    explanation: |
      A static OrderBy in the method name and a dynamic Sort argument are combined, not mutually
      exclusive; the dynamic ordering is appended to the static one. If you want ordering to be fully
      controlled by the caller, remove OrderBy from the name and rely solely on the Sort/Pageable.
    ref: "concepts.md#derived-query-methods"

  - id: spring-data-persistence-064
    difficulty: expert
    tags: [self-invocation, transactional, proxy, aop]
    question: |
      In a `@Service` bean, method `a()` (no annotation) calls `this.b()`, where `b()` is annotated
      `@Transactional(propagation = REQUIRES_NEW)`. A client calls `a()`. What happens regarding b's
      transaction?
    options:
      - "A new independent transaction is started for b() exactly as annotated, because Spring evaluates @Transactional per target method regardless of whether the call arrived through the proxy or through this"
      - "Spring rewrites the bean's bytecode at load time so that even a this-qualified self-invocation is routed back through the transactional proxy, so REQUIRES_NEW is honored for b()"
      - "Because the call to b() is a self-invocation through this (not the Spring proxy), the transactional advice is bypassed and b() runs with no new transaction — it executes non-transactionally (or in a() 's transaction if one exists)"
      - "It throws an exception at invocation because REQUIRES_NEW propagation is only legal on public methods and b() being package-private makes the transactional advice reject the call"
    answer: 2
    explanation: |
      Spring's declarative transactions are proxy-based. Calling b() via this does not pass through the
      proxy, so the @Transactional advice never runs and REQUIRES_NEW is ignored. To honor it, call
      through an injected self-reference, split into another bean, or use AspectJ weaving.
    ref: "concepts.md#transaction-semantics-in-the-data-layer"

  - id: spring-data-persistence-065
    difficulty: advanced
    tags: [lazy-initialization, transactions, osiv, fetch]
    question: |
      A controller renders a view that calls `order.getLineItems().size()` on an `Order` returned from
      a `@Transactional` service method, and it throws `LazyInitializationException`. Which statement
      is the best senior-level assessment?
    options:
      - "Enable Open Session in View so the persistence context stays open through view rendering — this is the officially recommended production fix and carries no query-count or connection-holding penalty of any kind"
      - "Change the lineItems association to FetchType.EAGER globally, which fully resolves the error and has no downside since eager fetching never affects unrelated queries or memory footprint"
      - "The persistence context closed when the service transaction ended, so the lazy collection can no longer initialize; the right fix is to fetch what the view needs inside the transaction (JOIN FETCH, @EntityGraph, or a DTO projection) rather than relying on OSIV"
      - "Wrap the order.getLineItems() getter in a try/catch that swallows the LazyInitializationException and returns an empty collection, which is a safe and idiomatic way to handle detached associations"
    answer: 2
    explanation: |
      The exception means the association is accessed after the persistence context closed. OSIV would
      hide it by keeping the context open during rendering, but that reintroduces N+1 during view
      rendering off any transaction. The clean fix is to fetch exactly what the view needs within the
      transactional boundary via JOIN FETCH, @EntityGraph, or a projection.
    ref: "concepts.md#transaction-semantics-in-the-data-layer"

  - id: spring-data-persistence-066
    difficulty: expert
    tags: [optimistic-locking, version, force-increment, aggregate]
    question: |
      An aggregate root `Order` has a `@Version`. You modify only a child `LineItem` (its own entity)
      but need the whole `Order` aggregate to be optimistically guarded so two concurrent line-item
      edits conflict. Which mechanism enforces this?
    options:
      - "Acquire LockModeType.PESSIMISTIC_READ on the LineItem query, which takes a shared row lock on the child and automatically propagates an aggregate-level guard up to the owning Order"
      - "Nothing extra is needed, because Hibernate propagates any child mutation up the association and automatically bumps the owning Order's @Version column on every LineItem change"
      - "Acquire LockModeType.OPTIMISTIC_FORCE_INCREMENT on the Order, which increments the Order's version even though only the child changed, so concurrent edits collide on the version check"
      - "Move the @Version column from the Order onto each LineItem and rely on cascade so that incrementing a child's version transparently guards the whole aggregate against concurrent edits"
    answer: 2
    explanation: |
      Modifying a child does not by itself bump the parent's version. OPTIMISTIC_FORCE_INCREMENT
      explicitly increments the aggregate root's version even when the root itself was not modified,
      enforcing aggregate-level optimistic locking so concurrent child edits detect a conflict.
    ref: "concepts.md#optimistic-and-pessimistic-locking"

  - id: spring-data-persistence-067
    difficulty: advanced
    tags: [pessimistic-locking, lock-annotation, for-update, exceptions]
    question: |
      A Spring Data method is annotated `@Lock(LockModeType.PESSIMISTIC_WRITE)`. Which set of
      statements is correct?
    options:
      - "It emits SELECT ... FOR UPDATE, requires an active transaction, releases the lock at commit/rollback, and a failure to acquire surfaces as PessimisticLockingFailureException / CannotAcquireLockException"
      - "It emits SELECT ... FOR SHARE, acquires only a shared read lock that still permits concurrent writers, works fine outside any transaction, and is guaranteed never to time out while waiting"
      - "It actually performs optimistic locking under the hood by comparing a @Version column at flush time, throwing OptimisticLockingFailureException on a version mismatch rather than taking any database row lock"
      - "It loads the row into the shared second-level cache and blocks every other read of that entity across all sessions globally until the JVM is restarted or the cache region is manually evicted"
    answer: 0
    explanation: |
      PESSIMISTIC_WRITE takes an exclusive row lock (SELECT ... FOR UPDATE), requires and lives within a
      transaction, and releases at commit/rollback. Acquisition failures/timeouts map to
      PessimisticLockingFailureException or CannotAcquireLockException; timeout is tunable via
      jakarta.persistence.lock.timeout.
    ref: "concepts.md#optimistic-and-pessimistic-locking"

  - id: spring-data-persistence-068
    difficulty: expert
    tags: [requires-new, connection-pool, deadlock, transactions]
    question: |
      Under heavy load, a code path where an outer `@Transactional` method calls an inner
      `@Transactional(propagation = REQUIRES_NEW)` method starts intermittently hanging and timing out
      acquiring connections. What is the most likely root cause?
    options:
      - "REQUIRES_NEW bypasses the configured connection pool entirely and forces the inner transaction to open a raw DriverManager connection, so pool exhaustion is impossible and the hang must come from elsewhere"
      - "REQUIRES_NEW reuses the very same physical connection as the suspended outer transaction, so the nested pair only ever holds one connection and therefore cannot deadlock or exhaust the pool"
      - "REQUIRES_NEW suspends the outer transaction but keeps its connection checked out while the inner method borrows a second connection from the pool; enough concurrent nesting exhausts the pool and threads deadlock waiting for connections"
      - "The hang is caused by a storm of optimistic-lock retries repeatedly re-reading the @Version column, and is entirely unrelated to the REQUIRES_NEW propagation or the connection pool"
    answer: 2
    explanation: |
      REQUIRES_NEW suspends (but does not release) the outer transaction's connection and acquires a
      new one for the inner transaction. Each active outer+inner pair holds two connections
      simultaneously; under concurrency this can exhaust the pool, and threads block indefinitely
      waiting for a connection that other blocked threads are holding.
    ref: "concepts.md#transaction-semantics-in-the-data-layer"

  - id: spring-data-persistence-069
    difficulty: advanced
    tags: [identity, sequence, generation, flush-timing]
    question: |
      Why does `GenerationType.IDENTITY` prevent Hibernate from batching inserts and force immediate
      SQL on `persist`, whereas `GenerationType.SEQUENCE` does not?
    options:
      - "IDENTITY is implemented with a hidden database trigger that fires outside Hibernate's ActionQueue, so the provider cannot intercept or batch the resulting inserts the way it can for sequence-backed ids"
      - "SEQUENCE forces an immediate INSERT on every persist to reserve the value, whereas IDENTITY buffers the row and defers the actual INSERT until commit, which is what enables its batching"
      - "With IDENTITY the generated key is only known after the row is inserted, so Hibernate must execute the INSERT immediately on persist to obtain the id, defeating write-behind batching; with SEQUENCE it can pre-fetch ids and defer/batch the inserts"
      - "Both IDENTITY and SEQUENCE defer their INSERTs to commit in exactly the same way and batch identically; the only real difference between them is cross-database portability of the generation strategy"
    answer: 2
    explanation: |
      IDENTITY columns yield their value only upon insertion, so Hibernate cannot keep the entity's id
      unknown in the persistence context — it must insert right away on persist, which prevents JDBC
      batch inserts. SEQUENCE (and TABLE) generators obtain ids up front, letting Hibernate defer and
      batch the actual INSERTs on flush.
    ref: "concepts.md#persistence-context-lifecycle-and-flush-timing"

  - id: spring-data-persistence-070
    difficulty: expert
    tags: [batch, clear, stateless-session, memory, dirty-checking]
    question: |
      A batch job persists 1,000,000 entities in one transaction and slows to a crawl while memory
      climbs. Which explanation and remedy pair is most accurate?
    options:
      - "The slowdown is pure network round-trip latency between the app and the database, so the only real remedy is provisioning faster database hardware or a lower-latency network link"
      - "Hibernate copies every INSERT into the shared second-level cache as it goes, so the cache grows without bound; disabling the L2 cache for that entity fully resolves both the memory growth and the slowdown"
      - "The root problem is optimistic-locking overhead re-checking the @Version column on each row, so removing the @Version field makes the batch run in constant memory at full throughput"
      - "The persistence context accumulates all managed entities, so each flush's dirty-check snapshot comparison grows more expensive and memory bloats; remedy by periodically flush() + clear() in chunks, enabling JDBC batch size, or using a StatelessSession that bypasses the context, L1 cache, and dirty checking"
    answer: 3
    explanation: |
      Every persisted entity stays managed, so the first-level cache grows unbounded and each flush
      must snapshot-compare an ever-larger set, degrading throughput and memory. Chunked flush()+clear()
      keeps the context small; a StatelessSession skips the context/L1 cache/dirty checking entirely
      for maximum bulk throughput. Setting a JDBC batch size further helps.
    ref: "concepts.md#persistence-context-lifecycle-and-flush-timing"

  - id: spring-data-persistence-071
    difficulty: advanced
    tags: [first-level-cache, identity, entity-manager]
    question: |
      Within a single transaction you call `em.find(User.class, 1L)` twice. What is guaranteed about
      the two returned references and the SQL issued?
    options:
      - "Two distinct object instances are returned and two separate SELECTs are issued, because JPA performs no caching within a single transaction and always re-reads the row on each find call"
      - "The second call returns a fresh detached copy of the entity and always issues a new SELECT, since the persistence context only retains the most recently loaded instance for one lookup"
      - "The behavior is unspecified and depends on the provider unless the shared second-level cache is explicitly enabled and configured for the User entity's region"
      - "The exact same object instance is returned both times (persistence-context identity guarantee) and the second find is served from the first-level cache with no additional SELECT"
    answer: 3
    explanation: |
      The persistence context guarantees identity within a transaction: repeated finds for the same id
      return the same managed instance, and the second lookup is satisfied from the first-level cache
      without hitting the database. This guarantee does not extend across transactions unless the L2
      cache is enabled.
    ref: "concepts.md#entitymanager-vs-session"

  - id: spring-data-persistence-072
    difficulty: expert
    tags: [distinct, hibernate, pass-distinct-through, join-fetch]
    question: |
      In `select distinct a from Author a join fetch a.books`, what is the purpose of the Hibernate
      hint `hibernate.query.passDistinctThrough = false` (available since Hibernate 5.2.2)?
    options:
      - "It deduplicates authors strictly at the database level by injecting an extra SQL DISTINCT over the joined rows, which is required for the in-memory result to come back without duplicate parents"
      - "It disables the join fetch on a.books and quietly falls back to lazy loading, so the collection is fetched per-author on first access instead of in the original query"
      - "It forces the query to return raw Object[] tuples of joined columns instead of managed Author entities, leaving the caller to assemble the entities manually"
      - "It keeps the in-memory deduplication of parent entities that JPQL distinct performs, while suppressing the redundant and costly SQL-level DISTINCT that would otherwise be sent to the database"
    answer: 3
    explanation: |
      When join-fetching a collection, JPQL distinct is needed to deduplicate parent references in
      memory, but the same DISTINCT pushed to SQL is pointless overhead (it operates on the full joined
      rows). passDistinctThrough=false tells Hibernate to deduplicate entities in memory without
      emitting SQL DISTINCT.
    ref: "concepts.md#the-n-plus-1-problem"

  - id: spring-data-persistence-073
    difficulty: advanced
    tags: [count-query, native, pageable]
    question: |
      A paginated repository method uses `@Query(value = "SELECT ... FROM users u JOIN ...",
      nativeQuery = true)` returning `Page<User>` with a `Pageable`. Why does Spring often require an
      explicit `countQuery`, and what breaks without it?
    options:
      - "Native queries cannot be paged at all, so Spring rejects any Pageable argument on a nativeQuery method unless you also supply a countQuery to make the pagination syntactically legal"
      - "The countQuery attribute only controls the ORDER BY clause applied to each page, not the total-row calculation, so omitting it merely disables sorting and is otherwise completely harmless"
      - "Spring transparently runs the main SELECT a second time, streams the full result set back, and counts the rows in application memory, so an explicit countQuery is purely a performance optimization"
      - "For native SQL, Spring cannot reliably derive the count query by transforming the SELECT the way it can for JPQL, so without an explicit countQuery you get an incorrect total or a runtime error deriving it"
    answer: 3
    explanation: |
      With JPQL Spring understands the query structure and can auto-generate a count query. With raw
      native SQL it cannot safely rewrite arbitrary SQL into a correct COUNT, so you must provide
      countQuery; otherwise getTotalElements() is wrong or Spring fails trying to derive it.
    ref: "concepts.md#the-query-annotation-jpql-and-native"

  - id: spring-data-persistence-074
    difficulty: expert
    tags: [spel, injection, query-annotation, parameters]
    question: |
      Two `@Query` variants inject a user-supplied value: (A) `where u.name = ?#{[0]}` and
      (B) building the JPQL string by concatenating the raw argument into the query text. What is the
      key correctness/security difference?
    options:
      - "They are functionally and security-wise equivalent, because Spring Data internally rewrites both forms into the identical bound-parameter query plan before execution"
      - "(B) is the safer of the two, because the JPQL parser fully validates and escapes any concatenated argument text, neutralizing malicious input before the query runs"
      - "(A) is actually the injectable one, because the ?#{...} SpEL syntax disables normal parameter binding and splices its evaluated string straight into the query text"
      - "(A) splices the SpEL result as a bound parameter, which is safe against injection, whereas (B) interpolates raw text into the query and is vulnerable to JPQL/SQL injection"
    answer: 3
    explanation: |
      The ?#{...} SpEL form evaluates to a value that is passed as a bind parameter, so it is not
      concatenated into the query text and is injection-safe. Concatenating raw user input into the
      query string bypasses parameter binding and opens a JPQL/SQL injection hole. Distinguishing bound
      parameters from string interpolation is a core security point.
    ref: "concepts.md#the-query-annotation-jpql-and-native"

  - id: spring-data-persistence-075
    difficulty: advanced
    tags: [projections, native-query, interface-projection]
    question: |
      A closed interface projection with getters `getFullName()` and `getOrderCount()` is used with a
      `nativeQuery = true` method and returns empty/null values. What is the most likely cause?
    options:
      - "Interface projections are categorically unsupported with native queries, so Spring returns empty proxies for every nativeQuery = true method that declares a projection return type"
      - "Closed interface projections are only wired up for JPQL @Query methods and always resolve to null when the underlying query is flagged nativeQuery = true"
      - "The projection interface must explicitly extend Serializable before Spring will populate its accessors from a native result set, and otherwise leaves them null"
      - "The selected column aliases in the native SQL do not match the projection's getter-derived property names (e.g. missing AS full_name / AS order_count), so Spring cannot bind the columns to the projection accessors"
    answer: 3
    explanation: |
      For native queries, Spring maps result columns to a closed interface projection by matching column
      aliases to the getter-derived property names. If the SQL does not alias columns to match (e.g.
      SELECT concat(...) AS fullName, count(*) AS orderCount), the binding fails and you get
      null/empty values.
    ref: "concepts.md#the-query-annotation-jpql-and-native"

  - id: spring-data-persistence-076
    difficulty: advanced
    tags: [repository-hierarchy, no-repository-bean, base-repository]
    question: |
      You create a custom base interface `BaseRepository<T, ID> extends JpaRepository<T, ID>` with
      shared methods, intended to be extended by concrete repositories. Why must it be annotated
      `@NoRepositoryBean`?
    options:
      - "To make every method it declares transactional by default, wrapping each in an implicit read-write @Transactional boundary at proxy-creation time"
      - "To exclude the interface from Spring's component scanning for security reasons, keeping its shared methods off the publicly exposed bean surface"
      - "To force all subinterfaces that extend it to declare their queries as native SQL rather than deriving them from method names or JPQL"
      - "So Spring Data does not try to create a proxy/instance for the intermediate base interface itself — only concrete entity-specific repositories should get proxies"
    answer: 3
    explanation: |
      @NoRepositoryBean marks an intermediate repository interface so Spring Data skips generating a
      bean/proxy for it (it has no concrete entity type to bind). Only the concrete repositories that
      extend it and fix T/ID get instantiated as proxies.
    ref: "concepts.md#repository-abstraction-hierarchy"

  - id: spring-data-persistence-077
    difficulty: expert
    tags: [fragment, custom-implementation, ordering, resolution]
    question: |
      A repository extends two custom fragment interfaces, `FragmentA` and `FragmentB`, both of which
      (via their Impl classes) declare a method with the same signature. Which implementation wins when
      that method is called?
    options:
      - "The base SimpleJpaRepository implementation always wins over any custom fragment, so the fragment methods are shadowed and effectively never invoked"
      - "Spring Data detects the duplicated signature and throws an ambiguous-fragment error at startup, refusing to create the repository proxy until one is removed"
      - "Spring Data resolves the method to the first fragment in the interface's declaration order, and consults the base SimpleJpaRepository last"
      - "The fragment whose Impl class name sorts alphabetically first wins, because Spring Data orders discovered fragment beans by simple class name before binding the method"
    answer: 2
    explanation: |
      With multiple fragments, Spring Data resolves a call to the first fragment (in declaration order
      on the repository interface) that implements the signature; the default store implementation
      (SimpleJpaRepository) is consulted last. Declaration order is therefore the tie-breaker.
    ref: "concepts.md#repository-abstraction-hierarchy"

  - id: spring-data-persistence-078
    difficulty: advanced
    tags: [clear-automatically, data-loss, modifying, persistence-context]
    question: |
      What is the subtle data-loss risk of adding `@Modifying(clearAutomatically = true)` to a bulk
      update method?
    options:
      - "It commits the surrounding transaction early right after the bulk update, so a subsequent rollback in the same method can no longer undo the bulk statement's changes"
      - "It disables optimistic @Version checking for the remainder of the transaction, letting later concurrent writes overwrite the bulk-updated rows without any conflict detection"
      - "It triggers a second synchronization pass over the context, flushing twice and thereby duplicating every pending INSERT queued before the bulk update"
      - "It calls EntityManager.clear() after the update, detaching ALL managed entities in the context and silently discarding any of their un-flushed pending changes"
    answer: 3
    explanation: |
      clearAutomatically clears the entire persistence context after the bulk statement, which detaches
      every managed entity. Any un-flushed modifications on those entities are lost. Pairing it with
      flushAutomatically = true (flush before the bulk op) mitigates this, but clearing is still a
      blunt, context-wide operation to use carefully.
    ref: "concepts.md#the-query-annotation-jpql-and-native"

  - id: spring-data-persistence-079
    difficulty: expert
    tags: [rollback-rules, checked-exception, transactional]
    question: |
      A `@Transactional` service method throws a custom *checked* exception (`extends Exception`) after
      writing a row. With default settings, what happens to the write, and how do you change the
      behavior?
    options:
      - "The write is rolled back, because Spring's default rollback policy triggers on any Throwable — checked or unchecked — that escapes a @Transactional method"
      - "The method fails with an IllegalStateException at the transaction boundary, because Spring forbids checked exceptions from propagating out of a @Transactional method"
      - "The write is committed only when the checked exception is a subclass of SQLException; every other checked exception forces an automatic rollback instead"
      - "The write is COMMITTED, because Spring's default rollback rules only roll back on unchecked (RuntimeException) and Error; to roll back on the checked exception, use @Transactional(rollbackFor = MyCheckedException.class)"
    answer: 3
    explanation: |
      Spring's default rollback policy rolls back on RuntimeException and Error but commits when a
      checked exception propagates. So the row is committed despite the checked exception. Override with
      rollbackFor (or make the exception unchecked) to force rollback. This is why DataAccessException
      being unchecked conveniently triggers rollback automatically.
    ref: "concepts.md#transaction-semantics-in-the-data-layer"

  - id: spring-data-persistence-080
    difficulty: advanced
    tags: [flush, commit, semantics, visibility]
    question: |
      Within an open transaction you call `em.flush()` after persisting an entity. Which statement is
      the most accurate description of what flush does?
    options:
      - "flush commits the surrounding transaction, making the queued changes permanent and immediately visible to every other concurrent transaction the moment it returns"
      - "flush pushes the pending SQL (INSERT/UPDATE/DELETE) to the database so subsequent queries in the same transaction see the changes and constraints fire, but the transaction remains open and can still roll back"
      - "flush merely evicts and clears the first-level cache, detaching managed entities while issuing no SQL to the database at all"
      - "flush is a complete no-op unless FlushMode is explicitly set to MANUAL, in which case it becomes the only way to emit any DML"
    answer: 1
    explanation: |
      flush synchronizes the persistence context to the database — emitting the queued DML so
      later queries see the changes and constraint violations surface — but it does NOT commit. The
      transaction is still open and can roll back everything, including the flushed statements.
    ref: "concepts.md#persistence-context-lifecycle-and-flush-timing"
