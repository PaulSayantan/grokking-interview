topic: "@Autowired, @Qualifier, and Autowiring Resolution"
domain: spring-core
topic_slug: autowired-qualifier-autowiring-resolution
version: 1
questions:
  - id: autowired-qualifier-autowiring-resolution-001
    difficulty: beginner
    tags: [autowired, resolution, by-type]
    question: |
      By default, how does @Autowired select which bean to inject?
    options:
      - "By type first, using name only as a fallback tiebreaker"
      - "By the bean's name only, ignoring its declared type"
      - "By the order in which beans were registered"
      - "By the bean's scope, favoring singleton beans"
    answer: 0
    explanation: |
      @Autowired matches candidates by type first. The injection point's name (field or
      parameter name) is used only as a fallback qualifier when multiple candidates of the
      type exist.
    ref: "concepts.md#how-autowired-resolves-dependencies"

  - id: autowired-qualifier-autowiring-resolution-002
    difficulty: beginner
    tags: [autowired, required]
    question: |
      What is the default value of the `required` attribute on @Autowired?
    options:
      - "false"
      - "It has no such attribute"
      - "It depends on the injection point type"
      - "true"
    answer: 3
    explanation: |
      @Autowired(required = true) is the default. A required dependency that cannot be
      satisfied causes container startup to fail.
    ref: "concepts.md#how-autowired-resolves-dependencies"

  - id: autowired-qualifier-autowiring-resolution-003
    difficulty: beginner
    tags: [autowired, injection-points]
    question: |
      Which of these can @Autowired be placed on?
    options:
      - "Only instance fields, and never on any kind of method"
      - "Only constructors, since injection must happen at instantiation"
      - "Constructors, setter methods, arbitrary config methods, and fields"
      - "Only static fields and static factory methods on the class"
    answer: 2
    explanation: |
      @Autowired works on constructors, setters, arbitrary methods (injecting all params),
      and fields. It is not supported on static members.
    ref: "concepts.md#how-autowired-resolves-dependencies"

  - id: autowired-qualifier-autowiring-resolution-004
    difficulty: intermediate
    tags: [autowired, resolution-order]
    question: |
      Which sequence best describes @Autowired's resolution when several beans match by type?
    options:
      - "bean/field name -> type -> @Qualifier -> @Primary -> error"
      - "type -> @Qualifier -> @Primary -> bean/field name -> error"
      - "@Primary -> @Qualifier -> bean/field name, skipping type"
      - "bean scope -> type -> bean/field name, ignoring @Qualifier"
    answer: 1
    explanation: |
      Spring narrows by type, then any @Qualifier at the injection point, then @Primary, then
      the injection point name. If still not unique, it throws NoUniqueBeanDefinitionException.
    ref: "concepts.md#how-autowired-resolves-dependencies"

  - id: autowired-qualifier-autowiring-resolution-005
    difficulty: intermediate
    tags: [autowired, generics]
    question: |
      Will `@Autowired Store<String> store;` match a bean of type `Store<Integer>`?
    options:
      - "Yes, generics are erased at runtime so any Store bean matches"
      - "Only if the Store<Integer> bean is additionally marked @Primary"
      - "No, Spring is generics-aware and requires the type argument to match"
      - "Only when the field switches to @Resource with a matching name"
    answer: 2
    explanation: |
      Since Spring 4.0, autowiring is generics-aware. Store<String> will not match a
      Store<Integer> bean; the parameterized type is part of the matching.
    ref: "concepts.md#how-autowired-resolves-dependencies"

  - id: autowired-qualifier-autowiring-resolution-006
    difficulty: beginner
    tags: [ambiguity, exception]
    question: |
      Two beans implement the same interface and a field is autowired by that interface type
      with no qualifier or primary. What happens at startup?
    options:
      - "One bean is chosen at random from the matching candidates"
      - "Both beans are injected together as a synthesized list"
      - "The field is quietly left null and startup continues"
      - "NoUniqueBeanDefinitionException is thrown"
    answer: 3
    explanation: |
      With two type-matching candidates and no way to disambiguate, Spring throws
      NoUniqueBeanDefinitionException ("expected single matching bean but found 2").
    ref: "concepts.md#nouniquebeandefinitionexception-on-ambiguity"

  - id: autowired-qualifier-autowiring-resolution-007
    difficulty: intermediate
    tags: [ambiguity, exception, hierarchy]
    question: |
      NoUniqueBeanDefinitionException is a subclass of which exception?
    options:
      - "NoSuchBeanDefinitionException"
      - "BeanCreationException"
      - "IllegalArgumentException"
      - "BeanCurrentlyInCreationException"
    answer: 0
    explanation: |
      NoUniqueBeanDefinitionException extends NoSuchBeanDefinitionException; it specifically
      signals that more than one candidate was found for a single-value injection point.
    ref: "concepts.md#nouniquebeandefinitionexception-on-ambiguity"

  - id: autowired-qualifier-autowiring-resolution-008
    difficulty: intermediate
    tags: [ambiguity, resolution]
    question: |
      Which of the following does NOT resolve a NoUniqueBeanDefinitionException for a single-value injection point?
    options:
      - "Adding @Qualifier at the injection point"
      - "Marking one candidate @Primary"
      - "Marking BOTH candidate beans @Primary"
      - "Renaming the field to match one bean's name"
    answer: 2
    explanation: |
      Two @Primary beans of the same type reintroduce ambiguity and still cause
      NoUniqueBeanDefinitionException. Only one candidate per type may be primary.
    ref: "concepts.md#nouniquebeandefinitionexception-on-ambiguity"

  - id: autowired-qualifier-autowiring-resolution-009
    difficulty: intermediate
    tags: [ambiguity, no-bean]
    question: |
      A required @Autowired field of type Foo matches ZERO beans. Which exception is thrown?
    options:
      - "NoUniqueBeanDefinitionException"
      - "NoSuchBeanDefinitionException"
      - "BeanInstantiationException"
      - "No exception; the field stays null"
    answer: 1
    explanation: |
      Zero matches for a required dependency throws NoSuchBeanDefinitionException. The
      "no unique" variant is only for the too-many case.
    ref: "concepts.md#nouniquebeandefinitionexception-on-ambiguity"

  - id: autowired-qualifier-autowiring-resolution-010
    difficulty: beginner
    tags: [qualifier, primary]
    question: |
      Where is @Primary typically declared?
    options:
      - "At the injection point, right beside @Autowired"
      - "In application.properties under a spring.primary key"
      - "On the interface being implemented by the beans"
      - "On the bean definition (class or @Bean method)"
    answer: 3
    explanation: |
      @Primary is declared on the producing bean definition to mark it as the default
      candidate among several of the same type.
    ref: "concepts.md#qualifier-vs-primary"

  - id: autowired-qualifier-autowiring-resolution-011
    difficulty: intermediate
    tags: [qualifier, primary, precedence]
    question: |
      Bean A is @Primary. An injection point declares @Qualifier("b") for bean B. Which is injected?
    options:
      - "Bean B, because @Qualifier at the injection point overrides @Primary"
      - "Bean A, because @Primary outranks any injection-point qualifier"
      - "Neither; the conflict throws NoUniqueBeanDefinitionException at startup"
      - "Both are injected, since each carries a valid selection marker"
    answer: 0
    explanation: |
      @Qualifier at the injection point is more specific than @Primary and therefore
      overrides it. Bean B is injected.
    ref: "concepts.md#qualifier-vs-primary"

  - id: autowired-qualifier-autowiring-resolution-012
    difficulty: beginner
    tags: [qualifier]
    question: |
      What does @Qualifier("audit") on an injection point do?
    options:
      - "Forces creation of a brand-new bean instance named 'audit'"
      - "Marks the matched bean as the type's primary default candidate"
      - "Selects the candidate that carries the qualifier 'audit' or is named 'audit'"
      - "Disables autowiring for that field so it stays null"
    answer: 2
    explanation: |
      @Qualifier narrows candidates to the one with a matching @Qualifier value, or, failing
      that, a bean whose name equals the qualifier string.
    ref: "concepts.md#qualifier-vs-primary"

  - id: autowired-qualifier-autowiring-resolution-013
    difficulty: intermediate
    tags: [qualifier, custom]
    question: |
      How do you create a custom qualifier annotation such as @Genre?
    options:
      - "Extend the abstract Qualifier base class in your annotation"
      - "Meta-annotate the custom annotation with @Qualifier"
      - "Register it manually as a bean in the DefaultListableBeanFactory"
      - "Custom qualifiers are not supported; use string @Qualifier only"
    answer: 1
    explanation: |
      A custom qualifier is a new annotation meta-annotated with @Qualifier. It can also
      declare attributes for richer matching.
    ref: "concepts.md#qualifier-vs-primary"

  - id: autowired-qualifier-autowiring-resolution-014
    difficulty: intermediate
    tags: [qualifier, primary, comparison]
    question: |
      Which statement about @Primary vs @Qualifier is correct?
    options:
      - "@Primary is a per-injection choice; @Qualifier is the global type default"
      - "Both must always be declared together or neither has any effect"
      - "@Qualifier can only appear on bean definitions, never at injection points"
      - "@Primary is a global default per type; @Qualifier is a per-injection-point selection"
    answer: 3
    explanation: |
      @Primary provides one global default per type; @Qualifier makes a specific choice at a
      particular injection point and takes precedence.
    ref: "concepts.md#qualifier-vs-primary"

  - id: autowired-qualifier-autowiring-resolution-015
    difficulty: beginner
    tags: [optional, required-false]
    question: |
      What happens to a field annotated @Autowired(required = false) when no matching bean exists?
    options:
      - "The field is left null and startup continues"
      - "Startup fails with NoSuchBeanDefinitionException"
      - "A proxy bean is auto-created"
      - "The field is set to Optional.empty()"
    answer: 0
    explanation: |
      With required=false and no candidate, Spring simply leaves the field null (or skips the
      setter) rather than failing.
    ref: "concepts.md#required-false-and-optional-and-objectprovider"

  - id: autowired-qualifier-autowiring-resolution-016
    difficulty: beginner
    tags: [optional]
    question: |
      When you declare `@Autowired Optional<AuditListener> listener;` and no bean exists, what is injected?
    options:
      - "null"
      - "A NoSuchBeanDefinitionException is thrown"
      - "Optional.empty()"
      - "Optional.of(null)"
    answer: 2
    explanation: |
      Spring supports java.util.Optional for optional dependencies, injecting Optional.empty()
      when no matching bean is present, so the field is never null.
    ref: "concepts.md#required-false-and-optional-and-objectprovider"

  - id: autowired-qualifier-autowiring-resolution-017
    difficulty: intermediate
    tags: [objectprovider]
    question: |
      Which ObjectProvider method returns the bean only if exactly one candidate exists (else null)?
    options:
      - "getObject()"
      - "getIfAvailable()"
      - "getIfUnique()"
      - "stream()"
    answer: 2
    explanation: |
      getIfUnique() returns the bean only when a single candidate matches, returning null if
      there are zero or multiple candidates, avoiding NoUniqueBeanDefinitionException.
    ref: "concepts.md#required-false-and-optional-and-objectprovider"

  - id: autowired-qualifier-autowiring-resolution-018
    difficulty: intermediate
    tags: [objectprovider, lazy]
    question: |
      What is a key characteristic of ObjectProvider<T> compared to injecting T directly?
    options:
      - "It eagerly injects all matching candidates as an immutable set"
      - "It is a lazy, programmatic handle that defers the lookup until you call it"
      - "It only works with prototype-scoped beans, never singletons"
      - "It cannot be used with @Autowired, only with @Resource"
    answer: 1
    explanation: |
      ObjectProvider defers resolution to call time and offers getIfAvailable/getIfUnique/
      stream, cleanly expressing optionality and multiplicity.
    ref: "concepts.md#required-false-and-optional-and-objectprovider"

  - id: autowired-qualifier-autowiring-resolution-019
    difficulty: intermediate
    tags: [required-false, method]
    question: |
      A setter annotated @Autowired(required = false) takes one parameter whose type has no matching bean. What does Spring do?
    options:
      - "Calls the setter with null"
      - "Throws NoSuchBeanDefinitionException"
      - "Calls the setter with a newly created default instance"
      - "Skips calling the setter entirely"
    answer: 3
    explanation: |
      A required=false method is skipped altogether when any of its parameters cannot be
      satisfied, rather than being invoked with null.
    ref: "concepts.md#required-false-and-optional-and-objectprovider"

  - id: autowired-qualifier-autowiring-resolution-020
    difficulty: beginner
    tags: [nullable, optional]
    question: |
      Which annotation on a parameter/field signals to Spring that the dependency is optional (like required=false)?
    options:
      - "@Nullable"
      - "@Optional"
      - "@Lazy"
      - "@Empty"
    answer: 0
    explanation: |
      @Nullable (Spring's or a JSR-305 variant) marks a dependency as optional, equivalent to
      required=false for that injection point.
    ref: "concepts.md#required-false-and-optional-and-objectprovider"

  - id: autowired-qualifier-autowiring-resolution-021
    difficulty: beginner
    tags: [resource, by-name]
    question: |
      What is the default resolution strategy of @Resource (JSR-250)?
    options:
      - "By type first, using the bean name only as a tiebreaker"
      - "By matching @Qualifier metadata on candidate beans only"
      - "By name first, then falling back to type"
      - "By the declared bean scope, favoring singleton beans"
    answer: 2
    explanation: |
      @Resource resolves by name first (the name attribute or the field/property name), then
      falls back to type if no name match is found.
    ref: "concepts.md#resource-by-name-vs-inject-vs-autowired"

  - id: autowired-qualifier-autowiring-resolution-022
    difficulty: intermediate
    tags: [inject, jsr330]
    question: |
      How does @Inject (JSR-330) differ from @Autowired?
    options:
      - "@Inject resolves by name; @Autowired by type"
      - "@Inject has no required attribute; use Provider<T> or Optional for optionality"
      - "@Inject can only be applied to fields, never to constructors or setters"
      - "@Inject cannot be combined with any qualifier annotation such as @Named"
    answer: 1
    explanation: |
      @Inject is by-type like @Autowired but has no 'required' attribute. Optionality is
      expressed via Provider<T> or Optional. It uses JSR-330 @Qualifier/@Named.
    ref: "concepts.md#resource-by-name-vs-inject-vs-autowired"

  - id: autowired-qualifier-autowiring-resolution-023
    difficulty: intermediate
    tags: [resource, constructor]
    question: |
      Which injection styles does @Resource support?
    options:
      - "Constructor injection only, resolving each parameter by name"
      - "All three styles: constructor, field, and setter injection alike"
      - "Only multi-parameter config methods, never plain field injection"
      - "Field and setter injection, but NOT constructor injection"
    answer: 3
    explanation: |
      @Resource supports field and setter injection but does not support constructor
      injection.
    ref: "concepts.md#resource-by-name-vs-inject-vs-autowired"

  - id: autowired-qualifier-autowiring-resolution-024
    difficulty: intermediate
    tags: [jakarta, javax, spring6]
    question: |
      In Spring Framework 6.x, which package hosts @Resource and @Inject?
    options:
      - "jakarta.annotation and jakarta.inject"
      - "javax.annotation and javax.inject, unchanged since Spring 5"
      - "org.springframework.annotation and org.springframework.inject"
      - "java.annotation and java.inject in the core JDK modules"
    answer: 0
    explanation: |
      Spring Framework 6 runs on Jakarta EE 9+ namespaces: jakarta.annotation.Resource and
      jakarta.inject.Inject. Spring 5 used the javax.* equivalents.
    ref: "concepts.md#resource-by-name-vs-inject-vs-autowired"

  - id: autowired-qualifier-autowiring-resolution-025
    difficulty: intermediate
    tags: [resource, qualifier]
    question: |
      How do you disambiguate a specific bean with @Resource?
    options:
      - "By adding @Qualifier next to @Resource"
      - "By using @Primary at the injection point"
      - "By using @Resource's name attribute"
      - "@Resource cannot target a specific bean"
    answer: 2
    explanation: |
      @Resource does not use @Qualifier for narrowing; it selects a specific bean via its
      name attribute (or the defaulted field/property name).
    ref: "concepts.md#resource-by-name-vs-inject-vs-autowired"

  - id: autowired-qualifier-autowiring-resolution-026
    difficulty: beginner
    tags: [inject, named]
    question: |
      Which annotation is the JSR-330 counterpart used with @Inject to select a bean by name?
    options:
      - "@Qualifier from Spring"
      - "@Named"
      - "@Resource"
      - "@Primary"
    answer: 1
    explanation: |
      JSR-330 provides @Named (and its own @Qualifier meta-annotation) to select a specific
      bean when using @Inject.
    ref: "concepts.md#resource-by-name-vs-inject-vs-autowired"

  - id: autowired-qualifier-autowiring-resolution-027
    difficulty: beginner
    tags: [collections, list]
    question: |
      What is injected into `@Autowired List<Notifier> notifiers;` when three Notifier beans exist?
    options:
      - "Only the @Primary Notifier, if one is marked"
      - "NoUniqueBeanDefinitionException is thrown"
      - "An empty list, since collections are optional"
      - "All three Notifier beans"
    answer: 3
    explanation: |
      Declaring a List/array/Set of a type asks for all matching beans, so all three are
      injected rather than triggering ambiguity errors.
    ref: "concepts.md#injecting-list-map-and-array-of-beans"

  - id: autowired-qualifier-autowiring-resolution-028
    difficulty: intermediate
    tags: [collections, map]
    question: |
      When injecting `@Autowired Map<String, Notifier> map;`, what are the map keys?
    options:
      - "The bean names"
      - "The fully-qualified class names"
      - "Sequential integers as strings"
      - "The @Qualifier values only"
    answer: 0
    explanation: |
      For a Map<String, T> injection, Spring uses the bean names as keys and the bean
      instances as values.
    ref: "concepts.md#injecting-list-map-and-array-of-beans"

  - id: autowired-qualifier-autowiring-resolution-029
    difficulty: intermediate
    tags: [collections, ordering]
    question: |
      What controls the element order of an injected `List<T>` of beans?
    options:
      - "Strictly alphabetical bean-name order in every case"
      - "Nondeterministic JVM reflection order with no guarantees"
      - "@Order, @Priority, and the Ordered interface"
      - "Whichever single bean is marked @Primary, placed first"
    answer: 2
    explanation: |
      Collection/array element ordering respects @Order, JSR-250 @Priority, and the Ordered
      interface. @Primary affects single-value selection, not list order.
    ref: "concepts.md#injecting-list-map-and-array-of-beans"

  - id: autowired-qualifier-autowiring-resolution-030
    difficulty: intermediate
    tags: [collections, empty, required]
    question: |
      By default, what happens if you autowire `List<Foo>` but no Foo beans exist?
    options:
      - "An empty, immutable list is injected automatically"
      - "It is treated as an unsatisfied required dependency and fails"
      - "The field is quietly left null and startup continues"
      - "A single default Foo instance is created and wrapped"
    answer: 1
    explanation: |
      By default a collection with no matching beans is an unsatisfied required dependency and
      startup fails. Use required=false or ObjectProvider to allow an empty result.
    ref: "concepts.md#injecting-list-map-and-array-of-beans"

  - id: autowired-qualifier-autowiring-resolution-031
    difficulty: intermediate
    tags: [collections, qualifier]
    question: |
      What does a @Qualifier on a `List<T>` injection point do?
    options:
      - "It is silently ignored for any collection injection point"
      - "It triggers a NoUniqueBeanDefinitionException at startup"
      - "It collapses the list down to a single matching bean"
      - "It filters the collection to only beans carrying that qualifier"
    answer: 3
    explanation: |
      A qualifier on a collection injection point restricts the injected elements to those
      beans that carry the matching qualifier, allowing grouping of a subset.
    ref: "concepts.md#injecting-list-map-and-array-of-beans"

  - id: autowired-qualifier-autowiring-resolution-032
    difficulty: beginner
    tags: [constructor, single-constructor]
    question: |
      Since Spring 4.3, when can you omit @Autowired on a constructor?
    options:
      - "When the class has exactly one constructor"
      - "Never; @Autowired on a constructor is always mandatory"
      - "Only when the constructor has no parameters"
      - "Only for constructors declared inside @Configuration classes"
    answer: 0
    explanation: |
      Spring 4.3+ implicitly autowires the sole constructor of a class, so @Autowired can be
      omitted when there is exactly one constructor.
    ref: "concepts.md#autowired-on-constructor-and-single-constructor-optionality"

  - id: autowired-qualifier-autowiring-resolution-033
    difficulty: intermediate
    tags: [constructor, multiple]
    question: |
      A class has TWO constructors and you want Spring to use one for injection. What must you do?
    options:
      - "Nothing; Spring picks the one with more parameters automatically"
      - "Add @Primary to the constructor that should be preferred for injection"
      - "Annotate exactly one with @Autowired (required=true), or mark several with required=false"
      - "Annotate both constructors with @Autowired(required=true) and let Spring merge them"
    answer: 2
    explanation: |
      With multiple constructors Spring won't guess. Annotate one with @Autowired
      (required=true), or annotate several with required=false so Spring chooses the greediest
      satisfiable one.
    ref: "concepts.md#autowired-on-constructor-and-single-constructor-optionality"

  - id: autowired-qualifier-autowiring-resolution-034
    difficulty: intermediate
    tags: [constructor, qualifier]
    question: |
      How do you apply a qualifier to a specific constructor parameter?
    options:
      - "Put @Qualifier on the class so it applies to every parameter"
      - "Put @Qualifier directly on the constructor parameter"
      - "Constructor parameters cannot be individually qualified"
      - "Use @Primary on the parameter to mark it as preferred"
    answer: 1
    explanation: |
      @Qualifier can be placed directly on an individual constructor parameter to select the
      intended candidate for that parameter.
    ref: "concepts.md#autowired-on-constructor-and-single-constructor-optionality"

  - id: autowired-qualifier-autowiring-resolution-035
    difficulty: intermediate
    tags: [constructor, circular]
    question: |
      Why can a true A-to-B, B-to-A circular dependency fail with pure constructor injection?
    options:
      - "Constructor injection was disabled for cyclic beans in Spring 6"
      - "Constructor injection silently ignores @Autowired on cyclic beans"
      - "Circular dependencies are always resolved fine with constructors"
      - "Neither bean can be constructed before the other, causing BeanCurrentlyInCreationException"
    answer: 3
    explanation: |
      Constructor injection requires the collaborator at instantiation, so a true cycle
      cannot be resolved and throws BeanCurrentlyInCreationException. Setter/field injection
      or @Lazy can break the cycle.
    ref: "concepts.md#autowired-on-constructor-and-single-constructor-optionality"

  - id: autowired-qualifier-autowiring-resolution-036
    difficulty: beginner
    tags: [constructor, benefits]
    question: |
      Which is a commonly cited advantage of constructor injection?
    options:
      - "It allows fields to be declared final and guarantees fully-initialized objects"
      - "It eliminates the need to write any unit tests for the bean"
      - "It makes every declared dependency optional and nullable by default"
      - "It removes the need for a Spring container to instantiate the bean"
    answer: 0
    explanation: |
      Constructor injection enables final fields, guarantees a fully-initialized object, makes
      mandatory dependencies explicit, and eases unit testing.
    ref: "concepts.md#autowired-on-constructor-and-single-constructor-optionality"

  - id: autowired-qualifier-autowiring-resolution-037
    difficulty: beginner
    tags: [autowired, source]
    question: |
      Which processor is responsible for handling @Autowired annotations?
    options:
      - "CommonAnnotationBeanPostProcessor"
      - "ConfigurationClassPostProcessor"
      - "AutowiredAnnotationBeanPostProcessor"
      - "PropertySourcesPlaceholderConfigurer"
    answer: 2
    explanation: |
      AutowiredAnnotationBeanPostProcessor processes @Autowired (and @Value, and JSR-330
      @Inject). CommonAnnotationBeanPostProcessor handles JSR-250 @Resource.
    ref: "concepts.md#how-autowired-resolves-dependencies"

  - id: autowired-qualifier-autowiring-resolution-038
    difficulty: intermediate
    tags: [autowired, method]
    question: |
      What does @Autowired on a method with multiple parameters do?
    options:
      - "Only the first parameter is injected; the remaining ones are left as null"
      - "Each parameter is resolved independently by type/qualifier and the method is invoked"
      - "It is silently ignored unless the method is a JavaBean-style setter taking one argument"
      - "It throws an error because methods can have only one injected parameter"
    answer: 1
    explanation: |
      A @Autowired method has all its parameters injected, each resolved independently by
      type and any qualifier, and the method is then invoked.
    ref: "concepts.md#how-autowired-resolves-dependencies"

  - id: autowired-qualifier-autowiring-resolution-039
    difficulty: beginner
    tags: [comparison, annotations]
    question: |
      Which annotation is Spring-specific (not a JSR standard)?
    options:
      - "@Resource"
      - "@Inject"
      - "@Autowired"
      - "@Named"
    answer: 2
    explanation: |
      @Autowired is Spring-specific. @Resource is JSR-250, while @Inject and @Named are
      JSR-330 standard annotations.
    ref: "concepts.md#resource-by-name-vs-inject-vs-autowired"

  - id: autowired-qualifier-autowiring-resolution-040
    difficulty: intermediate
    tags: [objectprovider, fallback]
    question: |
      Which ObjectProvider call supplies a fallback instance when no bean is available?
    options:
      - "getObject(), which returns a freshly built default instance when no bean is present"
      - "getIfUnique(), which substitutes the supplied fallback whenever multiple candidates match"
      - "getIfAvailable(Supplier<T> defaultSupplier)"
      - "stream(), which emits the fallback element as the sole item when the stream is empty"
    answer: 2
    explanation: |
      getIfAvailable(Supplier) returns the bean if present, otherwise the value produced by
      the supplied fallback, avoiding null handling.
    ref: "concepts.md#required-false-and-optional-and-objectprovider"

  - id: autowired-qualifier-autowiring-resolution-041
    difficulty: intermediate
    tags: [resource, inject, autowired, optional]
    question: |
      Which statement about expressing optional dependencies is correct?
    options:
      - "@Autowired supports required=false; @Inject has no required attribute"
      - "@Inject supports required=false; @Autowired must instead wrap the field in Optional"
      - "@Resource has a required=false attribute that suppresses the by-name lookup failure"
      - "None of the three annotations can express optionality; a missing bean always fails startup"
    answer: 0
    explanation: |
      @Autowired has required=false. @Inject has no such attribute (use Provider/Optional),
      and @Resource has no built-in optional flag either.
    ref: "concepts.md#resource-by-name-vs-inject-vs-autowired"

  - id: autowired-qualifier-autowiring-resolution-042
    difficulty: beginner
    tags: [qualifier, primary, count]
    question: |
      How many beans of a given type should be marked @Primary?
    options:
      - "As many as you like; Spring simply keeps the last-registered primary"
      - "At least two, so there is always a backup primary if one fails to start"
      - "Zero; @Primary is only valid alongside @Resource, never with @Autowired"
      - "Exactly one, to serve as the default"
    answer: 3
    explanation: |
      Only one bean per type should be @Primary. Multiple primaries of the same type
      reintroduce ambiguity and cause NoUniqueBeanDefinitionException.
    ref: "concepts.md#qualifier-vs-primary"

  - id: autowired-qualifier-autowiring-resolution-043
    difficulty: expert
    tags: [constructor, name-fallback, parameters, failure-mode]
    question: |
      A class has a single constructor with two same-typed candidates disambiguated only by
      parameter names matching bean names (no @Qualifier). It works when run from the IDE but
      throws NoUniqueBeanDefinitionException in the production JAR. What is the MOST likely cause?
    options:
      - "The production JAR was built without the -parameters (or -g debug) flag, so parameter names became arg0/arg1 and the name-based fallback could not match a bean"
      - "The IDE silently adds @Primary to the first candidate at compile time"
      - "Constructor injection ignores bean-name fallback entirely, so it only ever worked by accident of classpath ordering"
      - "Spring caches parameter names from the last successful run and the production process had a cold cache"
    answer: 0
    explanation: |
      Constructor/method parameter-name fallback needs the names to survive compilation. Without
      -parameters (Java 8+) or debug symbols, names appear as arg0, arg1, ... and Spring cannot
      match them to bean names, so ambiguity is no longer broken. @Qualifier does not depend on
      parameter names and is the robust fix. Field-name fallback is unaffected because field names
      always survive.
    ref: "concepts.md#how-autowired-resolves-dependencies"

  - id: autowired-qualifier-autowiring-resolution-044
    difficulty: expert
    tags: [priority, order, single-value, selection]
    question: |
      Three beans of type Handler exist: A (@Priority(1)), B (@Priority(2)), and C (@Order(0),
      no @Priority). A field `@Autowired Handler h;` (no qualifier, no @Primary) is resolved.
      Which bean is injected, and why?
    options:
      - "C, because @Order(0) is the lowest ordering value and wins single-value selection"
      - "B, because higher @Priority numbers indicate higher precedence"
      - "None; NoUniqueBeanDefinitionException, because @Order and @Priority cannot be mixed"
      - "A, because determineHighestPriorityCandidate uses JSR-250 @Priority (lowest number wins) for single-value ties, and @Order is ignored for single-value selection"
    answer: 3
    explanation: |
      For single-value injection, Spring's determineAutowireCandidate consults @Primary, then
      @Priority (lowest number = highest precedence), then name fallback. @Order/Ordered only
      affects collection ordering, never single-bean selection. A has the lowest @Priority number,
      so A wins; C's @Order is irrelevant here.
    ref: "concepts.md#nouniquebeandefinitionexception-on-ambiguity"

  - id: autowired-qualifier-autowiring-resolution-045
    difficulty: expert
    tags: [priority, primary, precedence]
    question: |
      Among candidates of one type, bean X is @Primary and bean Y has @Priority(0) (the highest
      possible priority). A single-value injection point has no qualifier. Which wins?
    options:
      - "X, because determinePrimaryCandidate runs before determineHighestPriorityCandidate"
      - "Y, because @Priority(0) is the strongest possible precedence and beats @Primary"
      - "Neither; combining @Primary and @Priority on different beans of one type is a configuration error that throws at startup"
      - "Whichever bean was registered first in the BeanFactory"
    answer: 0
    explanation: |
      In determineAutowireCandidate, the @Primary check runs first and short-circuits. Only if no
      primary is found does Spring fall back to the @Priority comparison. So X (the primary) wins
      over Y despite Y's priority.
    ref: "concepts.md#nouniquebeandefinitionexception-on-ambiguity"

  - id: autowired-qualifier-autowiring-resolution-046
    difficulty: advanced
    tags: [required-false, ambiguity, optional]
    question: |
      A field `@Autowired(required = false) PaymentGateway gw;` has TWO matching beans and no
      qualifier or @Primary. What happens?
    options:
      - "NoUniqueBeanDefinitionException is still thrown; required=false suppresses only the zero-candidate case, not ambiguity"
      - "gw is left null because required=false suppresses all resolution errors"
      - "One of the two beans is chosen arbitrarily since the dependency is optional"
      - "gw is populated with a List containing both beans"
    answer: 0
    explanation: |
      required=false relaxes the "no candidate" requirement, letting the field stay null when
      nothing matches. It does NOT resolve ambiguity: with multiple candidates and no tiebreaker,
      NoUniqueBeanDefinitionException is still thrown. Optional<T> behaves identically; only
      ObjectProvider.getIfUnique() returns null on multiplicity.
    ref: "concepts.md#required-false-and-optional-and-objectprovider"

  - id: autowired-qualifier-autowiring-resolution-047
    difficulty: expert
    tags: [objectprovider, ambiguity, getifavailable, getifunique]
    question: |
      Two beans of type Cache exist. You inject `ObjectProvider<Cache> provider;` into a singleton.
      What do provider.getIfAvailable() and provider.getIfUnique() return?
    options:
      - "getIfAvailable() throws NoUniqueBeanDefinitionException; getIfUnique() returns null"
      - "Both throw NoUniqueBeanDefinitionException because two candidates exist"
      - "Both return null, silently swallowing the ambiguity"
      - "getIfAvailable() returns the @Primary one or throws if none; getIfUnique() throws NoUniqueBeanDefinitionException"
    answer: 0
    explanation: |
      getIfAvailable() means "give me the single available bean" and still throws
      NoUniqueBeanDefinitionException when multiple non-primary candidates exist. getIfUnique() is
      specifically designed to return null when the match is not unique (zero or more than one),
      making it the safe choice for optional-and-possibly-ambiguous lookups.
    ref: "concepts.md#required-false-and-optional-and-objectprovider"

  - id: autowired-qualifier-autowiring-resolution-048
    difficulty: expert
    tags: [objectprovider, prototype, scope, lazy]
    question: |
      A singleton service needs a FRESH prototype-scoped Task on each call. Which injection
      correctly delivers a new instance every time, and why?
    options:
      - "Inject `Task task;` directly by constructor; Spring re-injects a new prototype before each method call"
      - "Inject `ObjectProvider<Task> tasks;` and call tasks.getObject() per use, because the provider defers the getBean lookup so each call creates a new prototype"
      - "Inject `Task task;` as a field with @Scope(\"prototype\") on the field"
      - "Inject `List<Task> tasks;` and remove the first element each call"
    answer: 1
    explanation: |
      Injecting a prototype directly into a singleton resolves it once and freezes that single
      instance for the singleton's life. ObjectProvider (or ObjectFactory/@Lookup/scoped proxy)
      defers resolution, so each getObject() triggers a new getBean call and thus a new prototype.
    ref: "concepts.md#required-false-and-optional-and-objectprovider"

  - id: autowired-qualifier-autowiring-resolution-049
    difficulty: expert
    tags: [qualifier, metadata, bean-name, fallback]
    question: |
      Two beans both declare @Qualifier("primary") as a class-level annotation. An injection point
      declares `@Autowired @Qualifier("primary") Foo foo;`. There is NO bean literally named
      "primary". What happens?
    options:
      - "The qualifier string is treated as a bean name; since no bean is named 'primary', NoSuchBeanDefinitionException is thrown"
      - "NoUniqueBeanDefinitionException is thrown, because the qualifier-metadata path already matched two candidates and the bean-name fallback never runs"
      - "The first-registered bean wins because @Qualifier metadata matches are ordered"
      - "Both beans are injected as a collection since they share a qualifier group"
    answer: 1
    explanation: |
      Spring first matches @Qualifier against beans' own qualifier metadata. Two beans carry
      @Qualifier("primary"), so both match and the injection point is ambiguous. The
      "treat qualifier as bean name" fallback only runs when the metadata path finds no match, so
      it never fires here — the result is NoUniqueBeanDefinitionException.
    ref: "concepts.md#qualifier-vs-primary"

  - id: autowired-qualifier-autowiring-resolution-050
    difficulty: advanced
    tags: [qualifier, custom, attributes]
    question: |
      Given a custom `@Genre(value, legacy)` qualifier (meta-annotated with @Qualifier), bean
      ActionA is @Genre(value="action", legacy=true) and ActionB is @Genre(value="action"). The
      injection point is `@Autowired @Genre(value="action", legacy=true) MovieCatalog c;`. Which
      bean matches?
    options:
      - "Both, because value=\"action\" matches both and legacy is ignored"
      - "ActionB, because default attribute values take precedence"
      - "Neither, because custom qualifiers cannot carry more than one attribute"
      - "ActionA only, because ALL declared qualifier attributes (value AND legacy) must match"
    answer: 3
    explanation: |
      Custom qualifiers match on all their attributes. The injection point requires
      value=action AND legacy=true, which only ActionA satisfies. ActionB has legacy defaulting to
      false, so it is excluded. This attribute-level matching is a key advantage of custom
      qualifiers over plain string qualifiers.
    ref: "concepts.md#qualifier-vs-primary"

  - id: autowired-qualifier-autowiring-resolution-051
    difficulty: advanced
    tags: [primary, injection-point, misuse]
    question: |
      A developer places @Primary at the injection point (`@Autowired @Primary Foo foo;`) hoping
      to break an ambiguity between two Foo beans. What is the effect?
    options:
      - "It works: the injection point's @Primary designates the preferred candidate"
      - "It throws a compile-time error because @Primary is not allowed on fields"
      - "It disables autowiring for that field, leaving it null"
      - "It has no disambiguating effect; @Primary is only honored on bean definitions, so NoUniqueBeanDefinitionException still occurs"
    answer: 3
    explanation: |
      @Primary is only meaningful on bean definitions (the producer side). At an injection point it
      is inert and does not resolve ambiguity. The correct tool at the injection point is
      @Qualifier. The ambiguity therefore remains unresolved.
    ref: "concepts.md#qualifier-vs-primary"

  - id: autowired-qualifier-autowiring-resolution-052
    difficulty: expert
    tags: [collections, collection-bean, aggregation]
    question: |
      A config defines `@Bean List<Notifier> notifiers() { return List.of(a); }` AND there are
      three individual @Component Notifier beans. What does `@Autowired List<Notifier> list;`
      receive?
    options:
      - "The explicit List<Notifier> bean (containing only a), because a matching bean of the collection type takes precedence over element aggregation"
      - "A merged list of all four (the @Bean list plus the three components)"
      - "A list of all three individual Notifier components, ignoring the @Bean List"
      - "NoUniqueBeanDefinitionException, because both a collection bean and elements match"
    answer: 0
    explanation: |
      If an actual bean of the exact collection type exists, Spring injects that bean rather than
      aggregating individual element beans. Element aggregation only happens when no single bean of
      the collection type matches. So the explicit @Bean List<Notifier> wins.
    ref: "concepts.md#injecting-list-map-and-array-of-beans"

  - id: autowired-qualifier-autowiring-resolution-053
    difficulty: advanced
    tags: [collections, map, key-type]
    question: |
      What is the difference in behavior between `@Autowired Map<String, Notifier> m1;` and
      `@Autowired Map<Class<?>, Notifier> m2;` when several Notifier beans exist and no actual Map
      bean is defined?
    options:
      - "Both aggregate all Notifier beans, keyed by bean name vs. by class respectively"
      - "Both fail because Map injection requires an explicitly defined Map bean"
      - "m1 fails and m2 aggregates keyed by the runtime Class of each bean"
      - "m1 aggregates Notifier beans keyed by bean name; m2 does NOT aggregate — it is treated as an ordinary type-matched dependency and fails if no matching Map bean exists"
    answer: 3
    explanation: |
      Map aggregation is only triggered for Map<String, T> (keys are bean names). A Map with any
      other key type (e.g. Class<?>) is not a recognized aggregation shape; Spring treats it as a
      normal by-type dependency needing an actual matching Map bean, and fails if none exists.
    ref: "concepts.md#injecting-list-map-and-array-of-beans"

  - id: autowired-qualifier-autowiring-resolution-054
    difficulty: expert
    tags: [collections, ordering, order, priority]
    question: |
      An injected `List<Filter>` contains beans: X (@Order(10)), Y (no ordering annotation), and
      Z (@Order(-5)). What is the resulting element order?
    options:
      - "[Z, X, Y] — ordered by @Order ascending, with the unannotated bean placed last"
      - "[Y, Z, X] — unannotated beans come first"
      - "[X, Y, Z] — declaration/registration order is preserved regardless of @Order"
      - "[Z, Y, X] — @Order sorts all beans and Y is treated as @Order(0)"
    answer: 0
    explanation: |
      AnnotationAwareOrderComparator sorts by @Order/Ordered ascending (lower value = earlier).
      Z(-5) then X(10). A bean with NO ordering annotation is treated as lowest precedence
      (effectively Ordered.LOWEST_PRECEDENCE) and sorts last, so Y ends up after X. Result:
      [Z, X, Y].
    ref: "concepts.md#injecting-list-map-and-array-of-beans"

  - id: autowired-qualifier-autowiring-resolution-055
    difficulty: expert
    tags: [constructor, circular, lazy, proxy]
    question: |
      Two singletons A and B have a mutual constructor dependency. Adding `@Lazy` to A's
      constructor parameter of type B fixes the BeanCurrentlyInCreationException. Why does this work
      even though it is constructor injection?
    options:
      - "@Lazy converts the constructor injection into setter injection behind the scenes, so B is wired in a later populate-bean phase after A is fully instantiated"
      - "@Lazy causes Spring to inject a lazy-resolving proxy for B into A's constructor, deferring the real B lookup until first method call, by which time B exists"
      - "@Lazy disables the singleton cache so both beans are recreated on demand, and each fresh instance is wired independently, which sidesteps the mutual reference"
      - "@Lazy marks B as prototype, and prototype beans never participate in cycles because Spring skips them entirely during the singleton pre-instantiation phase"
    answer: 1
    explanation: |
      @Lazy on the injection point makes Spring pass a lazy proxy instead of the real bean. The
      proxy is created immediately (satisfying A's constructor), and the actual B is resolved only
      when a method is first invoked on the proxy, breaking the instantiation-time cycle.
    ref: "concepts.md#autowired-on-constructor-and-single-constructor-optionality"

  - id: autowired-qualifier-autowiring-resolution-056
    difficulty: expert
    tags: [circular, prototype, scope, failure-mode]
    question: |
      Setter/field injection can resolve a singleton A-to-B/B-to-A cycle but the SAME setter cycle
      throws BeanCurrentlyInCreationException when both beans are @Scope("prototype"). Why?
    options:
      - "Cycle resolution relies on early exposure of a partially-built singleton via the third-level singletonFactories cache; prototypes are never cached or early-exposed, so no reference is available to break the cycle"
      - "Prototype beans are not proxied, and the CGLIB proxy is the only mechanism Spring uses to hold the early cyclic reference needed to close the loop"
      - "Prototype beans are created lazily on first getBean, so neither one ever starts construction during refresh and the setter cycle is silently deferred forever"
      - "Spring forbids @Autowired on prototype-scoped beans entirely, rejecting the definition at refresh with a BeanDefinitionValidationException"
    answer: 0
    explanation: |
      Singleton cycle resolution depends on exposing a raw, not-yet-populated singleton early (the
      third-level cache) so the collaborator can wire to it. Prototypes are not stored in the
      singleton registry and get no early reference, so a prototype-prototype cycle cannot be
      broken and throws BeanCurrentlyInCreationException.
    ref: "concepts.md#autowired-on-constructor-and-single-constructor-optionality"

  - id: autowired-qualifier-autowiring-resolution-057
    difficulty: advanced
    tags: [constructor, multiple, greedy]
    question: |
      A bean has three constructors, all annotated @Autowired(required=false), taking (), (A), and
      (A, B) respectively. Beans A exists but B does not. Which constructor does Spring use?
    options:
      - "The no-arg constructor, because required=false always prefers the simplest"
      - "The (A) constructor — the greediest constructor whose dependencies are ALL satisfiable"
      - "The (A, B) constructor, invoking it with null for B since required=false permits missing arguments"
      - "None; multiple @Autowired constructors always throw at startup, even when all are marked required=false"
    answer: 1
    explanation: |
      With several required=false constructors, Spring picks the greediest (most parameters) whose
      dependencies can all be satisfied. (A,B) is greediest but B is missing, so it is skipped;
      (A) is satisfiable and greedier than (), so (A) is chosen.
    ref: "concepts.md#autowired-on-constructor-and-single-constructor-optionality"

  - id: autowired-qualifier-autowiring-resolution-058
    difficulty: advanced
    tags: [resource, by-name, by-type, fallback]
    question: |
      A field `@Resource private DataSource metrics;` is declared. There is NO bean named
      "metrics", but there IS exactly one DataSource bean named "primaryDs" marked @Primary. What
      is injected?
    options:
      - "Nothing; @Resource is strictly by-name, so it throws NoSuchBeanDefinitionException"
      - "primaryDs, because @Resource falls back to by-type resolution (honoring @Primary) when the name match fails"
      - "A newly created DataSource named 'metrics', auto-registered by @Resource when no existing bean matches the derived name"
      - "It throws NoUniqueBeanDefinitionException because @Resource ignores @Primary and treats every DataSource as an equal by-type candidate"
    answer: 1
    explanation: |
      @Resource is name-first, but when the derived/declared name matches no bean it falls back to
      by-type resolution and at that stage honors @Primary (and a field @Qualifier). With one
      primary DataSource, primaryDs is injected. This surprises those who assume @Resource is purely
      name-based.
    ref: "concepts.md#resource-by-name-vs-inject-vs-autowired"

  - id: autowired-qualifier-autowiring-resolution-059
    difficulty: advanced
    tags: [inject, classpath, jsr330, failure-mode]
    question: |
      A class uses `@Inject` on a field, but neither jakarta.inject nor javax.inject is on the
      classpath. What is the runtime behavior?
    options:
      - "Startup fails with ClassNotFoundException for the @Inject annotation"
      - "The annotation is not recognized; the injection point is left unprocessed (a silent no-op), so the field stays null"
      - "Spring transparently substitutes @Autowired semantics, rewriting the injection point to by-type resolution during metadata scanning"
      - "The bean definition is rejected and the bean is not registered, failing context refresh with an UnsatisfiedDependencyException"
    answer: 1
    explanation: |
      AutowiredAnnotationBeanPostProcessor only registers support for @Inject if the JSR-330 API is
      present on the classpath. Without it, @Inject is simply not scanned; the field is never
      injected and stays null. There is no ClassNotFoundException because the annotation class is
      only referenced reflectively when present.
    ref: "concepts.md#resource-by-name-vs-inject-vs-autowired"

  - id: autowired-qualifier-autowiring-resolution-060
    difficulty: expert
    tags: [post-processor, ordering, resource, autowired]
    question: |
      Which statement about the post-processors handling @Autowired and @Resource is correct?
    options:
      - "Both @Autowired and @Resource are handled by AutowiredAnnotationBeanPostProcessor, with @Resource treated internally as a name-scoped alias of @Autowired during populateBean"
      - "@Resource is resolved at compile time by an annotation processor; @Autowired is resolved at runtime via reflection during bean instantiation"
      - "@Autowired/@Value/@Inject are handled by AutowiredAnnotationBeanPostProcessor; @Resource/@PostConstruct/@PreDestroy by CommonAnnotationBeanPostProcessor, both during the populate-bean phase before @PostConstruct"
      - "CommonAnnotationBeanPostProcessor handles @Autowired and runs after @PostConstruct, injecting dependencies only once the lifecycle callbacks have already completed"
    answer: 2
    explanation: |
      AutowiredAnnotationBeanPostProcessor processes @Autowired, @Value, and JSR-330 @Inject.
      CommonAnnotationBeanPostProcessor processes JSR-250 @Resource, @PostConstruct, and
      @PreDestroy. Both are InstantiationAwareBeanPostProcessors that inject during populateBean,
      after instantiation and before lifecycle callbacks like @PostConstruct.
    ref: "concepts.md#resource-by-name-vs-inject-vs-autowired"

  - id: autowired-qualifier-autowiring-resolution-061
    difficulty: expert
    tags: [internals, metadata, cache, thread-safety]
    question: |
      How does AutowiredAnnotationBeanPostProcessor avoid re-scanning a class's injection points for
      every instance of that class?
    options:
      - "It disables reflection after the first bean is created and thereafter copies the field values directly from that first instance"
      - "It caches an InjectionMetadata object per class (keyed by class name) in a ConcurrentHashMap and reuses it for subsequent instances"
      - "It serializes injection metadata to disk between runs and reloads the cached file at the next context startup"
      - "It only supports singleton beans, so there is never more than one instance to scan"
    answer: 1
    explanation: |
      The processor builds InjectionMetadata (the list of annotated fields/methods) once per class
      and caches it in a concurrent map keyed by class name. New instances of the same class reuse
      the cached metadata, so reflective scanning is not repeated per instance and lookups stay
      thread-safe.
    ref: "concepts.md#autowiring-internals-thread-safety-and-ordering"

  - id: autowired-qualifier-autowiring-resolution-062
    difficulty: expert
    tags: [parent-context, hierarchy, ambiguity]
    question: |
      A child ApplicationContext defines one Cache bean; its parent context defines another Cache
      bean. A bean in the child does `@Autowired Cache cache;` with no qualifier. What is the most
      accurate outcome?
    options:
      - "By-type autowiring searches the child factory and its ancestors, so two candidates are visible and NoUniqueBeanDefinitionException can be thrown across the merged set"
      - "The parent's bean always wins because ancestor contexts are fully refreshed and resolved before any child injection point is processed"
      - "Only the child's bean is ever considered; the parent is invisible to autowiring"
      - "Parent and child beans are automatically merged into a List and injected, since cross-context candidates of one type are always aggregated"
    answer: 0
    explanation: |
      DefaultListableBeanFactory includes ancestor bean definitions when resolving by-type
      dependencies. So a child injection point sees candidates from both contexts, and ambiguity is
      computed across the merged set — a NoUniqueBeanDefinitionException can appear only once the
      contexts are combined.
    ref: "concepts.md#autowiring-internals-thread-safety-and-ordering"

  - id: autowired-qualifier-autowiring-resolution-063
    difficulty: advanced
    tags: [bean-method, parameters, autowiring]
    question: |
      In a @Configuration class, `@Bean OrderService orderService(PaymentGateway gw, @Qualifier("fast") Inventory inv) {...}`
      has no @Autowired on the method or parameters. How are gw and inv supplied?
    options:
      - "They must be null unless @Autowired is explicitly added to each parameter, since @Bean methods opt out of automatic parameter resolution"
      - "Only gw is injected by type; the @Qualifier-annotated parameter stays unset because @Qualifier needs an accompanying @Autowired to activate"
      - "Spring passes the raw BeanFactory as each argument and you must look the collaborators up manually inside the method body"
      - "Each @Bean method parameter is autowired by type/qualifier automatically, just like constructor parameters"
    answer: 3
    explanation: |
      Parameters of a @Bean factory method are resolved as dependencies by the container using
      by-type matching plus any @Qualifier, without needing @Autowired. This is the configuration-
      class analog of constructor injection.
    ref: "concepts.md#autowiring-internals-thread-safety-and-ordering"

  - id: autowired-qualifier-autowiring-resolution-064
    difficulty: expert
    tags: [bean-post-processor, early-init, null, failure-mode]
    question: |
      A developer writes a custom BeanPostProcessor and annotates a collaborator field with
      @Autowired, but it is null at runtime. What is the underlying reason and the correct fix?
    options:
      - "BeanPostProcessors are instantiated very early, before regular-bean autowiring machinery is fully ready, so field @Autowired into them may be skipped; inject via constructor/@Bean or use ObjectProvider/lazy lookup"
      - "@Autowired only works on beans annotated @Component; BeanPostProcessors are infrastructure beans and must declare their collaborators with @Resource instead"
      - "BeanPostProcessors cannot hold instance fields at all; the dependency must be moved into a static initializer block that runs at class load"
      - "The field must be declared static for a BeanPostProcessor to receive injection, because only static members are populated during early infrastructure setup"
    answer: 0
    explanation: |
      BeanPostProcessors and other infrastructure beans are created before the full autowiring
      support for ordinary beans is in place, so annotation-based injection into them is unreliable
      (often null). Provide dependencies through the constructor (e.g. via a static @Bean method) or
      resolve them lazily with ObjectProvider.
    ref: "concepts.md#autowiring-internals-thread-safety-and-ordering"

  - id: autowired-qualifier-autowiring-resolution-065
    difficulty: advanced
    tags: [collections, self-reference, aggregation]
    question: |
      A @Component EventBus implements Listener and also injects `@Autowired List<Listener> listeners;`.
      There are two OTHER Listener beans. By default, what does listeners contain?
    options:
      - "All three listeners including EventBus itself, since a bean is always a valid candidate for its own collection injection points"
      - "An empty list, because self-injection is forbidden and Spring drops the whole collection when the consumer is also a candidate"
      - "NoUniqueBeanDefinitionException, because EventBus is both a consumer and a candidate"
      - "Only the two other listeners; the self bean is excluded from collection aggregation by default"
    answer: 3
    explanation: |
      When aggregating a collection, Spring excludes the currently-created bean (self) from the
      injected collection by default to avoid a bean grouping itself. So EventBus receives only the
      two other Listener beans. (Self would be included only if it were the sole candidate.)
    ref: "concepts.md#injecting-list-map-and-array-of-beans"

  - id: autowired-qualifier-autowiring-resolution-066
    difficulty: advanced
    tags: [generics, collections, resolvable-type]
    question: |
      Beans exist for Repository<User> (userRepo) and Repository<Order> (orderRepo). What does
      `@Autowired List<Repository<User>> repos;` receive?
    options:
      - "Both repos, because generic type arguments are erased for collection element matching"
      - "Only userRepo, because Spring's generics-aware matching filters collection elements by the parameterized element type"
      - "orderRepo, chosen by registration order because the container ignores type arguments and returns the last-registered candidate"
      - "An empty list, because parameterized collection injection is unsupported and Spring cannot resolve nested generic element types"
    answer: 1
    explanation: |
      Spring resolves the element type as Repository<User> using ResolvableType and only aggregates
      beans matching that parameterized type. userRepo matches; orderRepo (Repository<Order>) does
      not. Generics-aware matching applies to collection elements too, not just single injections.
    ref: "concepts.md#injecting-list-map-and-array-of-beans"

  - id: autowired-qualifier-autowiring-resolution-067
    difficulty: expert
    tags: [value, autowired, resolution]
    question: |
      A field carries both `@Autowired` and `@Value("${cache.name}")`. How is it resolved?
    options:
      - "Type-based autowiring runs first, then @Value overwrites it with the property value"
      - "@Value supplies an explicit value/expression resolved via the Environment/SpEL, short-circuiting bean-type matching for that field"
      - "A conflict between the two annotations is detected and startup fails with a BeanCreationException on that field"
      - "Both annotations are ignored because they cannot be combined, so the field is left at its Java default value"
    answer: 1
    explanation: |
      @Value provides an explicit value resolved through the Environment and SpEL
      (BeanExpressionResolver), which bypasses type-based bean matching for that injection point.
      Combining it with @Autowired is redundant, but @Value's explicit value determines the result.
    ref: "concepts.md#autowiring-internals-thread-safety-and-ordering"

  - id: autowired-qualifier-autowiring-resolution-068
    difficulty: advanced
    tags: [optional, nullable, dependency-descriptor]
    question: |
      Which set of mechanisms all funnel into Spring treating a single-value dependency as
      optional (not required)?
    options:
      - "@Autowired(required=false), Optional<T>, @Nullable, and a Kotlin nullable type (Foo?)"
      - "@Qualifier, @Primary, and @Order, which together mark a dependency optional by relaxing DependencyDescriptor.isRequired()"
      - "@Value, @Resource(name=...), and @Named, each of which suppresses the unsatisfied-dependency check for a single-value injection point"
      - "@Lazy, @Scope, and ObjectFactory only, since deferring resolution is the sole way Spring records a dependency as non-required"
    answer: 0
    explanation: |
      required=false, Optional<T>, @Nullable, and Kotlin's nullable types all resolve to
      DependencyDescriptor.isRequired() returning false, so an unsatisfied dependency does not fail
      startup. The other options are about selection/scoping, not optionality.
    ref: "concepts.md#required-false-and-optional-and-objectprovider"

  - id: autowired-qualifier-autowiring-resolution-069
    difficulty: expert
    tags: [primary, two-primaries, exception]
    question: |
      determinePrimaryCandidate finds TWO beans of the same type both marked @Primary while
      resolving a single-value injection point. What is the result?
    options:
      - "The first-registered primary is used, since determinePrimaryCandidate returns the earliest match it encounters"
      - "Both primaries are demoted and @Priority is consulted instead, with the lowest priority number selected as the winner"
      - "The bean whose name matches the injection-point field name is chosen as the final tiebreaker"
      - "NoUniqueBeanDefinitionException is thrown, with a message about more than one 'primary' bean"
    answer: 3
    explanation: |
      determinePrimaryCandidate explicitly throws NoUniqueBeanDefinitionException when it finds more
      than one primary candidate among the matches — two primaries are as ambiguous as none. Only a
      single primary can break the tie.
    ref: "concepts.md#nouniquebeandefinitionexception-on-ambiguity"

  - id: autowired-qualifier-autowiring-resolution-070
    difficulty: advanced
    tags: [lazy, ambiguity, timing]
    question: |
      A latent by-type ambiguity exists, but instead of failing at context refresh it only blows up
      the first time a certain method runs in production. Which injection style most plausibly
      caused this deferral?
    options:
      - "Plain field @Autowired of a singleton, which always fails at refresh"
      - "Constructor injection, which never detects ambiguity because collaborators are resolved after the bean is already fully constructed"
      - "An @Lazy injection or an ObjectProvider/ObjectFactory that defers the actual lookup until first use, so ambiguity is detected only then"
      - "Map<String,T> injection, which suppresses ambiguity permanently by silently keeping only the first candidate per bean name"
    answer: 2
    explanation: |
      By-type ambiguity is reported when the injection point is actually resolved. @Lazy proxies and
      ObjectProvider/ObjectFactory defer resolution to first use, so a latent ambiguity surfaces at
      runtime rather than at refresh. Eager singleton field injection would fail at startup instead.
    ref: "concepts.md#how-autowired-resolves-dependencies"

  - id: autowired-qualifier-autowiring-resolution-071
    difficulty: expert
    tags: [priority, tie, exception]
    question: |
      Two candidate beans of one type both carry @Priority(1) (the same highest priority) and there
      is no @Primary and no qualifier. What does determineHighestPriorityCandidate do?
    options:
      - "Throws NoUniqueBeanDefinitionException because multiple beans share the same highest priority"
      - "Falls back to alphabetical bean-name order and injects the candidate that sorts first"
      - "Picks one arbitrarily since they tie, using whichever candidate the bean-definition iterator yields first"
      - "Injects both candidates wrapped in a synthesized collection for the single-value field"
    answer: 0
    explanation: |
      When two candidates share the same highest @Priority value, the tie cannot be broken and
      determineHighestPriorityCandidate throws NoUniqueBeanDefinitionException, just as two @Primary
      beans do. Priorities must be distinct to designate a single winner.
    ref: "concepts.md#nouniquebeandefinitionexception-on-ambiguity"

  - id: autowired-qualifier-autowiring-resolution-072
    difficulty: advanced
    tags: [resource, inject, autowired, comparison]
    question: |
      Which statement most precisely distinguishes @Resource, @Inject, and @Autowired regarding
      constructor injection and optionality?
    options:
      - "All three support constructor injection and expose an identical required flag for optionality"
      - "Only @Resource supports constructor injection with a required flag; @Autowired and @Inject are restricted to field and setter injection"
      - "@Autowired supports constructor injection and required=false; @Inject supports constructor injection but has no required attribute; @Resource supports neither constructor injection nor a required flag"
      - "@Inject supports a required=false attribute for constructor injection, while @Autowired and @Resource offer no such optionality flag at all"
    answer: 2
    explanation: |
      @Autowired: constructor injection + required attribute. @Inject: constructor injection but no
      required attribute (use Provider/Optional). @Resource: field/setter only (no constructor
      injection) and no required flag. This is the precise three-way distinction.
    ref: "concepts.md#resource-by-name-vs-inject-vs-autowired"

  - id: autowired-qualifier-autowiring-resolution-073
    difficulty: expert
    tags: [self-injection, proxy, aop]
    question: |
      A service self-injects `@Autowired MyService self;` to invoke an @Transactional method
      internally so the transaction advice applies. Why does calling self.method() work when
      this.method() would not?
    options:
      - "Spring injects the AOP proxy (not the raw instance) for self references, so calls through 'self' pass through the transactional advice, whereas 'this' bypasses the proxy"
      - "The 'this' reference and the injected 'self' point to the identical target object, so both routes pass equally through the transactional advice"
      - "Self-injection is rejected as an illegal cycle and always throws BeanCurrentlyInCreationException during the singleton pre-instantiation phase"
      - "Self-injection forces Spring to unwrap and inject the raw target, disabling proxying entirely, so neither 'self' nor 'this' applies the advice"
    answer: 0
    explanation: |
      When a bean is proxied (e.g. for @Transactional), self-injection resolves to the proxy, not
      the target. Calling through the injected 'self' reference goes through the proxy's advice
      chain; internal 'this' calls invoke the target directly and skip the advice. Self-injection is
      supported since Spring 4.3.
    ref: "concepts.md#how-autowired-resolves-dependencies"

  - id: autowired-qualifier-autowiring-resolution-074
    difficulty: advanced
    tags: [collections, empty, objectprovider]
    question: |
      You want an injected `List<Plugin>` to be an empty list (not a startup failure) when no Plugin
      beans exist. Which approaches achieve this?
    options:
      - "Nothing works; an empty candidate set is always an unsatisfied required dependency that fails context refresh for collection injection points"
      - "Mark the List field @Primary so the container treats the absent collection as an acceptable default and injects an empty list"
      - "Use @Autowired(required=false) on the List, or inject ObjectProvider<Plugin> and call stream()/orderedStream()"
      - "Add @Qualifier(\"none\") to the List so it matches a reserved empty qualifier group and yields a zero-element collection"
    answer: 2
    explanation: |
      By default an empty collection is an unsatisfied required dependency and fails. Marking the
      injection required=false yields an empty (or null) collection, and ObjectProvider's
      stream()/orderedStream() naturally yields an empty stream with no candidates.
    ref: "concepts.md#injecting-list-map-and-array-of-beans"

  - id: autowired-qualifier-autowiring-resolution-075
    difficulty: expert
    tags: [doresolvedependency, internals, selection-order]
    question: |
      In DefaultListableBeanFactory.doResolveDependency, after multiple type matches are found,
      determineAutowireCandidate applies its tiebreakers in which order before giving up?
    options:
      - "bean-name fallback first, then @Primary, then @Priority, returning the earliest injection-point-name match before any annotation is consulted"
      - "@Priority first (highest number wins), then @Primary, then qualifier metadata re-evaluated against each remaining candidate's class annotations"
      - "@Primary, then @Priority (@javax/jakarta), then bean-name/qualifier-name fallback; if none isolate a single bean it returns null and doResolveDependency throws NoUniqueBeanDefinitionException"
      - "@Order first (lowest value wins), then @Primary, then @Qualifier metadata, mirroring how collection element ordering is computed"
    answer: 2
    explanation: |
      determineAutowireCandidate runs determinePrimaryCandidate first, then
      determineHighestPriorityCandidate (@Priority, lowest number wins), then a name-based fallback
      (injection-point name equals bean name / qualifier). If all fail, it returns null and the
      caller throws NoUniqueBeanDefinitionException. @Order is not part of single-value selection.
    ref: "concepts.md#nouniquebeandefinitionexception-on-ambiguity"

  - id: autowired-qualifier-autowiring-resolution-076
    difficulty: advanced
    tags: [resource, name-derivation, setter]
    question: |
      For `@Resource private DataSource auditLog;` (no name attribute), what bean name does Spring
      look for first?
    options:
      - "The type name DataSource"
      - "A random UUID until a match is found"
      - "The field name 'auditLog'"
      - "The fully-qualified class of the declaring bean"
    answer: 2
    explanation: |
      @Resource without an explicit name derives the name from the field (or the property name for
      a setter) — here 'auditLog'. It looks for a bean named auditLog first, only falling back to
      by-type resolution if no such bean exists.
    ref: "concepts.md#resource-by-name-vs-inject-vs-autowired"

  - id: autowired-qualifier-autowiring-resolution-077
    difficulty: expert
    tags: [order, injection-timing, postconstruct]
    question: |
      Within a single bean, a developer's field-injected dependency A reads another field-injected
      dependency B inside a plain method that A's setter calls. Sometimes B is still null. What is
      the correct principle and remedy?
    options:
      - "Field injection follows the declared top-to-bottom source order deterministically, so simply reorder the fields to guarantee B is populated before A's setter runs"
      - "Mark both fields @Lazy so their proxies resolve simultaneously in a single atomic populate step, ensuring neither is null when the other is read"
      - "Use @Order on the two fields to force the exact injection sequence, since the container honors @Order for intra-bean field population"
      - "There is no guaranteed ordering among a bean's field/method injection points; move cross-dependency logic into a @PostConstruct method that runs after all injection completes"
    answer: 3
    explanation: |
      Spring does not guarantee a cross-field injection order you can rely on. Logic that needs all
      dependencies present must run in @PostConstruct (or the constructor, for constructor
      injection), which executes after the populate-bean phase completes. @Order does not apply to
      intra-bean injection ordering.
    ref: "concepts.md#autowiring-internals-thread-safety-and-ordering"

  - id: autowired-qualifier-autowiring-resolution-078
    difficulty: advanced
    tags: [inject, named, provider, optionality]
    question: |
      Using strict JSR-330 only, how do you express an optional-and-lazy dependency and select a
      specific candidate by name?
    options:
      - "@Inject @Named(\"fast\") combined with a required=false attribute on @Inject, which JSR-330 defines specifically for optional-and-lazy injection points"
      - "Inject javax/jakarta inject Provider<T> together with @Named(\"fast\"); Provider.get() defers lookup and @Named selects the candidate, since @Inject has no required attribute"
      - "@Autowired(required=false) with @Qualifier(\"fast\"), which is the only cross-container-portable form of an optional named lookup"
      - "@Resource(name=\"fast\") wrapped in a java.util.Optional, since @Resource is the JSR-330 standard for lazy by-name selection"
    answer: 1
    explanation: |
      JSR-330's @Inject has no required flag, so optionality/laziness is expressed with Provider<T>
      (its get() defers resolution). @Named selects the specific candidate by name. This is the
      framework-neutral, JSR-330-portable idiom.
    ref: "concepts.md#resource-by-name-vs-inject-vs-autowired"

  - id: autowired-qualifier-autowiring-resolution-079
    difficulty: expert
    tags: [primary, collections, misconception]
    question: |
      A team marks one of five Handler beans @Primary expecting `@Autowired List<Handler> handlers;`
      to place it first. What actually happens?
    options:
      - "The @Primary handler is hoisted to index 0 of the list and the remaining four follow in bean-registration order"
      - "Only the @Primary handler is injected, collapsing the collection to a single element of size one"
      - "@Primary has no effect on collection injection; all five handlers are injected and order is governed by @Order/Ordered/@Priority (unannotated beans last)"
      - "NoUniqueBeanDefinitionException is thrown because a @Primary marker conflicts with multi-element collection aggregation at refresh"
    answer: 2
    explanation: |
      @Primary only breaks single-value ties; it plays no role in collection aggregation or
      ordering. All five beans are injected, and element order is determined by @Order/Ordered and
      @Priority via AnnotationAwareOrderComparator, with unannotated beans placed last.
    ref: "concepts.md#qualifier-vs-primary"

  - id: autowired-qualifier-autowiring-resolution-080
    difficulty: advanced
    tags: [qualifier, collections, map, filtering]
    question: |
      Ten Validator beans exist; three carry @Qualifier("payment"). What does
      `@Autowired @Qualifier("payment") Map<String, Validator> validators;` inject?
    options:
      - "All ten validators keyed by bean name, because @Qualifier is silently ignored on any Map aggregation injection point"
      - "Only the three @Qualifier(\"payment\") validators, keyed by their bean names"
      - "A single validator, because placing a qualifier on a Map collapses it into a single-value selection of the matching bean"
      - "NoUniqueBeanDefinitionException, because a qualifier is not permitted to be combined with Map aggregation and triggers an ambiguity error"
    answer: 1
    explanation: |
      A @Qualifier on a Map<String, T> injection point filters the aggregated entries exactly the way
      it filters a List/array: only beans carrying the matching qualifier are included, and the map is
      still keyed by bean name. So the injected map holds precisely the three "payment" validators —
      qualifier-based grouping works for Map aggregation, not just List/Set/array.
    ref: "concepts.md#injecting-list-map-and-array-of-beans"

  - id: autowired-qualifier-autowiring-resolution-081
    difficulty: expert
    tags: [circular, aop, raw-injection, failure-mode]
    question: |
      A singleton A (setter-injected with B) and singleton B (setter-injected with A) form a cycle,
      and A is subject to an AOP proxy created by a BeanPostProcessor. Startup intermittently throws
      BeanCurrentlyInCreationException about A. What is the root cause?
    options:
      - "Setter injection can never resolve any circular dependency, so any A-to-B/B-to-A cycle fails regardless of the AOP proxy involvement"
      - "AOP proxies are always prototype-scoped internally and therefore can never be early-exposed in the singleton factory cache to close a cycle"
      - "B may wire to A's raw early-exposed instance before A is wrapped by its AOP proxy, so Spring detects that the final proxied A differs from the injected raw A and refuses to silently allow the mismatch"
      - "The @Autowired setter for A is invoked twice during cycle resolution, corrupting the singleton cache and aborting instantiation"
    answer: 2
    explanation: |
      Cycle resolution exposes A's raw instance early. If A must later be wrapped by an AOP proxy,
      B might have already been injected with the raw (unproxied) A, creating an inconsistency
      between the early reference and the final proxied bean; Spring guards against this, which can
      surface as BeanCurrentlyInCreationException. Restructuring the cycle or using @Lazy avoids it.
    ref: "concepts.md#autowired-on-constructor-and-single-constructor-optionality"

  - id: autowired-qualifier-autowiring-resolution-082
    difficulty: advanced
    tags: [objectprovider, orderedstream, ordering]
    question: |
      How does ObjectProvider<T>.orderedStream() differ from stream() for multiple candidates?
    options:
      - "orderedStream() returns only the @Primary candidate as its first and sole element, whereas stream() emits every matching bean"
      - "They are functionally identical; orderedStream() is merely a deprecated alias retained for backward source compatibility"
      - "orderedStream() applies @Order/Ordered/@Priority ordering to the candidates, whereas stream() yields them in the factory's default (registration) order"
      - "orderedStream() throws NoUniqueBeanDefinitionException whenever more than one candidate matches, while stream() tolerates multiplicity"
    answer: 2
    explanation: |
      orderedStream() sorts candidates using AnnotationAwareOrderComparator (honoring
      @Order/Ordered/@Priority), matching List injection ordering. Plain stream() returns them in
      the factory's default order without applying ordering annotations.
    ref: "concepts.md#required-false-and-optional-and-objectprovider"

