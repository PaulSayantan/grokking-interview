topic: 'IoC Container: ApplicationContext vs BeanFactory'
domain: spring-core
topic_slug: ioc-container-applicationcontext-vs-beanfactory
version: 1
questions:
- id: ioc-container-applicationcontext-vs-beanfactory-001
  difficulty: beginner
  tags:
  - ioc
  - principle
  - definition
  question: |
    What does "Inversion of Control" (IoC) mean in the context of the Spring container?
  options:
  - Control over object creation and dependency wiring is moved out of application code and handed to
    an external container
  - The application code retains full control over creating and looking up its own dependencies
  - Beans are instantiated lazily on first access and the container never eagerly creates singletons
    at startup
  - The database connection layer drives program flow, invoking business objects as rows are read from
    the tables
  answer: 0
  explanation: |
    IoC inverts control: instead of an object constructing or looking up its own
    collaborators, an external component (the Spring container) creates and injects
    them. Dependency Injection is Spring's implementation of this principle.
  ref: concepts.md#inversion-of-control-principle-and-why-it-matters
- id: ioc-container-applicationcontext-vs-beanfactory-002
  difficulty: beginner
  tags:
  - ioc
  - dependency-injection
  question: |
    How does Dependency Injection (DI) relate to Inversion of Control (IoC)?
  options:
  - DI and IoC are unrelated concepts that address entirely separate concerns in the framework
  - IoC is a specific technique used to implement the broader DI principle
  - DI is the specific implementation of the broader IoC principle used by Spring
  - DI has superseded IoC in modern Spring, which dropped the older inversion-of-control model in 5.x
  answer: 2
  explanation: |
    IoC is the general principle of inverting control. DI is one concrete way to
    achieve it (injecting collaborators via constructors, setters, or fields), and
    it is the approach Spring favors over the Service Locator pattern.
  ref: concepts.md#inversion-of-control-principle-and-why-it-matters
- id: ioc-container-applicationcontext-vs-beanfactory-003
  difficulty: beginner
  tags:
  - ioc
  - benefits
  - testability
  question: |
    Which is a primary benefit of using Inversion of Control / Dependency Injection?
  options:
  - It guarantees the application uses less memory than any alternative
  - It couples business classes tightly to concrete implementations for speed
  - It promotes loose coupling and improves testability by allowing mocks to be injected
  - It removes the need for interfaces entirely by wiring concrete classes directly by field name
  answer: 2
  explanation: |
    DI lets classes depend on abstractions rather than concrete types, which loosens
    coupling and makes unit testing easy because you can inject mocks or stubs
    without starting a container.
  ref: concepts.md#inversion-of-control-principle-and-why-it-matters
- id: ioc-container-applicationcontext-vs-beanfactory-004
  difficulty: intermediate
  tags:
  - ioc
  - hollywood-principle
  question: |
    The "Hollywood Principle" — "Don't call us, we'll call you" — is often used to describe IoC. What does it convey?
  options:
  - Your application code drives the framework by continuously polling it for the next task to perform
  - The framework calls your code at the appropriate time, rather than your code driving the framework
  - You must instantiate every collaborator manually with the new keyword before handing it to the container
  - The container is only active during application shutdown, staying dormant while requests are served
  answer: 1
  explanation: |
    Under IoC the framework is in charge: it instantiates your objects and invokes
    lifecycle callbacks at the right moments, rather than your code explicitly
    orchestrating the framework.
  ref: concepts.md#inversion-of-control-principle-and-why-it-matters
- id: ioc-container-applicationcontext-vs-beanfactory-005
  difficulty: beginner
  tags:
  - container
  - beans
  - definition
  question: |
    In Spring, what is the term for the objects that the IoC container instantiates, wires, and manages?
  options:
  - Modules
  - Servlets
  - Beans
  - Records
  answer: 2
  explanation: |
    The objects that form the backbone of a Spring application and are managed by the
    IoC container are called beans.
  ref: concepts.md#the-job-of-the-ioc-container
- id: ioc-container-applicationcontext-vs-beanfactory-006
  difficulty: intermediate
  tags:
  - container
  - bean-definition
  - metadata
  question: |
    What does the container parse configuration metadata into as an internal "recipe" for each bean?
  options:
  - A BeanDefinition
  - A BeanWrapper
  - A ProxyFactory
  - A PropertySource
  answer: 0
  explanation: |
    The container reads configuration (XML, @Configuration classes, or scanned
    annotations) and turns it into BeanDefinition objects that describe a bean's
    class, scope, constructor args, property values, init/destroy methods, and more.
  ref: concepts.md#the-job-of-the-ioc-container
- id: ioc-container-applicationcontext-vs-beanfactory-007
  difficulty: beginner
  tags:
  - container
  - responsibilities
  question: |
    Which of the following is NOT a responsibility of the Spring IoC container?
  options:
  - Instantiating beans according to their definitions
  - Injecting dependencies between beans
  - Applying lifecycle callbacks such as @PostConstruct and @PreDestroy
  - Compiling your Java source code into bytecode
  answer: 3
  explanation: |
    The container instantiates beans, injects dependencies, manages scopes, and
    applies lifecycle callbacks and post-processing. Compiling source code is the
    job of the Java compiler, not the container.
  ref: concepts.md#the-job-of-the-ioc-container
- id: ioc-container-applicationcontext-vs-beanfactory-008
  difficulty: beginner
  tags:
  - container
  - scopes
  - singleton
  question: |
    What is the default bean scope in the Spring IoC container?
  options:
  - prototype
  - request
  - singleton
  - session
  answer: 2
  explanation: |
    By default beans are singletons: the container maintains a single shared instance
    per container. Prototype creates a new instance per lookup, and request/session
    are web scopes.
  ref: concepts.md#the-job-of-the-ioc-container
- id: ioc-container-applicationcontext-vs-beanfactory-009
  difficulty: beginner
  tags:
  - beanfactory
  - root-interface
  question: |
    Which interface is the root interface of the Spring IoC container?
  options:
  - ApplicationContext
  - Environment
  - ResourceLoader
  - BeanFactory
  answer: 3
  explanation: |
    org.springframework.beans.factory.BeanFactory is the fundamental root interface
    of the container. ApplicationContext extends it with additional features.
  ref: concepts.md#beanfactory-the-basic-container
- id: ioc-container-applicationcontext-vs-beanfactory-010
  difficulty: intermediate
  tags:
  - beanfactory
  - lazy-init
  question: |
    By default, when does a plain BeanFactory (e.g., DefaultListableBeanFactory) instantiate a singleton bean?
  options:
  - Eagerly, pre-instantiating every non-lazy singleton the moment the factory object is constructed
  - Never — it merely stores the bean definitions and leaves instantiation to the calling code
  - Lazily, only when the bean is first requested via getBean(...)
  - On a fixed timer that fires a few seconds after the factory finishes startup
  answer: 2
  explanation: |
    A plain BeanFactory is lazy: it does not pre-instantiate singletons. A bean is
    created on first request, giving a lighter footprint but deferring error
    discovery.
  ref: concepts.md#beanfactory-the-basic-container
- id: ioc-container-applicationcontext-vs-beanfactory-011
  difficulty: intermediate
  tags:
  - beanfactory
  - post-processors
  question: |
    Which statement about a plain BeanFactory is correct?
  options:
  - It automatically detects and registers BeanPostProcessors declared as beans
  - It requires you to register BeanPostProcessors programmatically for them to be applied
  - It publishes application events out of the box through a pre-wired ApplicationEventMulticaster
  - It provides a built-in MessageSource so message internationalization works without any extra setup
  answer: 1
  explanation: |
    A plain BeanFactory does not auto-register post-processors; you must call
    addBeanPostProcessor(...) yourself. It also lacks i18n, event publishing, and
    resource loading — those are ApplicationContext features.
  ref: concepts.md#beanfactory-the-basic-container
- id: ioc-container-applicationcontext-vs-beanfactory-012
  difficulty: intermediate
  tags:
  - beanfactory
  - defaultlistablebeanfactory
  question: |
    What is the role of DefaultListableBeanFactory in Spring?
  options:
  - It is a deprecated class retained only for backward compatibility and slated for removal in Spring 7
  - It is the canonical full-featured BeanFactory implementation and the engine used internally by ApplicationContext
    implementations
  - It is usable only inside web applications and requires an active servlet container to function
  - It is the common base class from which all Spring MVC controllers and handler beans inherit
  answer: 1
  explanation: |
    DefaultListableBeanFactory is the standard, full-featured BeanFactory. Every
    ApplicationContext implementation uses one internally as its bean-holding engine.
  ref: concepts.md#beanfactory-the-basic-container
- id: ioc-container-applicationcontext-vs-beanfactory-013
  difficulty: beginner
  tags:
  - beanfactory
  - lookup
  - getbean
  question: |
    Which methods does BeanFactory provide for retrieving beans?
  options:
  - fetch(String) and fetch(Class)
  - resolve(Class) only
  - lookup(String) only
  - getBean(String) and getBean(Class)
  answer: 3
  explanation: |
    BeanFactory exposes overloaded getBean methods, including getBean(String) by name
    and getBean(Class) by type.
  ref: concepts.md#beanfactory-the-basic-container
- id: ioc-container-applicationcontext-vs-beanfactory-014
  difficulty: beginner
  tags:
  - applicationcontext
  - relationship
  question: |
    What is the relationship between ApplicationContext and BeanFactory?
  options:
  - They are completely independent interfaces with no inheritance relationship between them at all
  - BeanFactory extends ApplicationContext, inheriting its events and i18n while stripping them back
  - ApplicationContext extends BeanFactory, adding enterprise features
  - ApplicationContext replaced BeanFactory, which was removed from the framework in the Spring 5 release
  answer: 2
  explanation: |
    ApplicationContext is a superset: it extends BeanFactory (through
    ListableBeanFactory and HierarchicalBeanFactory) and adds features like events,
    i18n, and resource loading.
  ref: concepts.md#applicationcontext-the-enterprise-container
- id: ioc-container-applicationcontext-vs-beanfactory-015
  difficulty: intermediate
  tags:
  - applicationcontext
  - eager-init
  question: |
    By default, how does an ApplicationContext initialize non-lazy singleton beans?
  options:
  - Lazily, deferring each singleton's construction until the first getBean call that requests it
  - Eagerly, during container startup (at the end of refresh())
  - It never initializes singletons automatically and requires an explicit preInstantiate call
  - Only when the JVM begins its shutdown sequence, as part of the registered shutdown hook
  answer: 1
  explanation: |
    An ApplicationContext eagerly pre-instantiates non-lazy singletons during
    refresh(), which gives fail-fast behavior — configuration errors surface at
    startup rather than on first use.
  ref: concepts.md#applicationcontext-the-enterprise-container
- id: ioc-container-applicationcontext-vs-beanfactory-016
  difficulty: beginner
  tags:
  - applicationcontext
  - features
  question: |
    Which of these is a feature provided by ApplicationContext but NOT by a plain BeanFactory?
  options:
  - Basic dependency injection of collaborators into beans via constructors, setters, and fields
  - Bean lookup by type, returning the single matching instance for a requested class token
  - Internationalization via MessageSource and application event publishing
  - Storing parsed bean definitions as the metadata recipes the container later instantiates from
  answer: 2
  explanation: |
    Basic DI, lookup, and definition storage are common to both. i18n (MessageSource),
    event publishing, resource loading, and automatic post-processor registration are
    ApplicationContext additions.
  ref: concepts.md#applicationcontext-the-enterprise-container
- id: ioc-container-applicationcontext-vs-beanfactory-017
  difficulty: intermediate
  tags:
  - applicationcontext
  - autowired
  - post-processors
  question: |
    Why do annotations like @Autowired and @PostConstruct "just work" in an ApplicationContext but not automatically in a plain BeanFactory?
  options:
  - Because ApplicationContext ignores those annotations and instead injects everything by matching field names
  - Because ApplicationContext automatically detects and registers the required BeanPostProcessors
  - Because a BeanFactory rewrites the bytecode of your beans at load time to inline the dependencies
  - Because those annotations are compiled away by an ApplicationContext-only annotation processor
  answer: 1
  explanation: |
    ApplicationContext automatically registers the post-processors (e.g.,
    AutowiredAnnotationBeanPostProcessor, CommonAnnotationBeanPostProcessor) that
    implement annotation handling. A plain BeanFactory would need them registered by
    hand.
  ref: concepts.md#applicationcontext-the-enterprise-container
- id: ioc-container-applicationcontext-vs-beanfactory-018
  difficulty: intermediate
  tags:
  - applicationcontext
  - resourceloader
  question: |
    Because ApplicationContext is also a ResourceLoader, which capability does it offer?
  options:
  - Compiling resource files such as templates and properties into executable class files at startup
  - 'Loading resources such as classpath: or file: locations via getResource(...)'
  - Automatically scanning the filesystem and deleting resource files it detects are unused
  - Encrypting all bean definitions at rest so the configuration cannot be read from disk
  answer: 1
  explanation: |
    ApplicationContext implements ResourceLoader (actually ResourcePatternResolver),
    so getResource("classpath:...") returns Resource abstractions for reading files,
    URLs, and classpath resources.
  ref: concepts.md#applicationcontext-the-enterprise-container
- id: ioc-container-applicationcontext-vs-beanfactory-019
  difficulty: intermediate
  tags:
  - applicationcontext
  - events
  question: |
    Which ApplicationContext capability supports publishing and listening for application events?
  options:
  - ApplicationEventPublisher (with ApplicationListener / @EventListener)
  - MessageSource, which resolves and broadcasts application events to listener beans
  - ResourceLoader, whose getResource callbacks deliver events to @EventListener methods
  - Environment, which buffers published events and replays them to listeners at startup
  answer: 0
  explanation: |
    ApplicationContext implements ApplicationEventPublisher, enabling event
    publishing and consumption via ApplicationListener beans or @EventListener
    methods. This is not available in a plain BeanFactory.
  ref: concepts.md#applicationcontext-the-enterprise-container
- id: ioc-container-applicationcontext-vs-beanfactory-020
  difficulty: beginner
  tags:
  - applicationcontext
  - recommendation
  question: |
    What is the general recommendation for which container to use in typical applications?
  options:
  - Always use a plain BeanFactory for best performance
  - Use ApplicationContext unless there is a specific reason not to
  - Alternate between BeanFactory and ApplicationContext on a per-request basis
  - Never use either container; instantiate and wire every collaborator manually
  answer: 1
  explanation: |
    The Spring reference documentation recommends ApplicationContext for essentially
    all applications and treats plain BeanFactory usage as a rare, special-case
    choice.
  ref: concepts.md#applicationcontext-the-enterprise-container
- id: ioc-container-applicationcontext-vs-beanfactory-021
  difficulty: intermediate
  tags:
  - applicationcontext
  - fail-fast
  question: |
    A benefit of ApplicationContext's eager singleton initialization is:
  options:
  - Lower memory usage than any other container approach because singletons are never cached
  - Fail-fast behavior — misconfiguration is detected at startup rather than on first use
  - Beans are never created until explicitly requested, so startup does no instantiation work
  - It disables all lifecycle callbacks such as @PostConstruct and @PreDestroy at runtime
  answer: 1
  explanation: |
    Eagerly creating singletons at startup surfaces wiring/configuration errors
    immediately (fail-fast) and avoids slowing the first request with lazy
    construction.
  ref: concepts.md#applicationcontext-the-enterprise-container
- id: ioc-container-applicationcontext-vs-beanfactory-022
  difficulty: beginner
  tags:
  - implementations
  - xml
  question: |
    Which ApplicationContext implementation loads XML bean definitions from the classpath?
  options:
  - AnnotationConfigApplicationContext
  - FileSystemXmlApplicationContext
  - GenericApplicationContext
  - ClassPathXmlApplicationContext
  answer: 3
  explanation: |
    ClassPathXmlApplicationContext loads XML configuration files located on the
    classpath. FileSystemXmlApplicationContext loads them from the file system.
  ref: concepts.md#common-applicationcontext-implementations
- id: ioc-container-applicationcontext-vs-beanfactory-023
  difficulty: beginner
  tags:
  - implementations
  - annotation-config
  question: |
    Which ApplicationContext implementation is the standard choice for Java-based configuration using @Configuration classes and component scanning?
  options:
  - ClassPathXmlApplicationContext
  - FileSystemXmlApplicationContext
  - AnnotationConfigApplicationContext
  - XmlWebApplicationContext
  answer: 2
  explanation: |
    AnnotationConfigApplicationContext reads @Configuration classes and/or scans for
    @Component-annotated classes, with no XML required.
  ref: concepts.md#common-applicationcontext-implementations
- id: ioc-container-applicationcontext-vs-beanfactory-024
  difficulty: intermediate
  tags:
  - implementations
  - filesystem
  question: |
    What distinguishes FileSystemXmlApplicationContext from ClassPathXmlApplicationContext?
  options:
  - It loads XML definitions from file-system paths rather than the classpath
  - It only supports annotation-based configuration and rejects any XML definition files
  - It does not support singleton beans and treats every declared bean as a prototype
  - It cannot publish application events because it omits the ApplicationEventPublisher
  answer: 0
  explanation: |
    Both load XML bean definitions, but FileSystemXmlApplicationContext resolves
    paths against the file system (absolute or relative), while
    ClassPathXmlApplicationContext resolves them on the classpath.
  ref: concepts.md#common-applicationcontext-implementations
- id: ioc-container-applicationcontext-vs-beanfactory-025
  difficulty: intermediate
  tags:
  - implementations
  - generic-application-context
  question: |
    What is a distinguishing characteristic of GenericApplicationContext?
  options:
  - It accepts only XML configuration files and rejects programmatic or annotation-based registration
  - It is format-agnostic — you attach reader/scanner delegates or register beans programmatically, then
    call refresh() once
  - It automatically calls refresh() multiple times, re-parsing definitions each time a bean is added
  - It cannot be used for annotation-based beans and requires an external XML descriptor for every bean
  answer: 1
  explanation: |
    GenericApplicationContext is not tied to a single config format. You register
    definitions via readers/scanners or programmatically, then invoke refresh()
    exactly once. AnnotationConfigApplicationContext is built on top of it.
  ref: concepts.md#common-applicationcontext-implementations
- id: ioc-container-applicationcontext-vs-beanfactory-026
  difficulty: intermediate
  tags:
  - implementations
  - refresh
  - generic
  question: |
    When using GenericApplicationContext, what must you do before retrieving beans, and how often?
  options:
  - Call start() before every getBean call
  - Call refresh() before each bean lookup
  - Call refresh() exactly once after registering definitions
  - Nothing — beans are available immediately with no method call
  answer: 2
  explanation: |
    Unlike the XML/annotation context constructors that refresh automatically, a
    GenericApplicationContext requires you to call refresh() yourself, and it must be
    called exactly once.
  ref: concepts.md#common-applicationcontext-implementations
- id: ioc-container-applicationcontext-vs-beanfactory-027
  difficulty: beginner
  tags:
  - implementations
  - web
  question: |
    In a classic (non-Boot) Spring MVC application, which component typically creates the root ApplicationContext?
  options:
  - The DispatcherServlet only
  - A plain BeanFactory
  - The JVM automatically
  - ContextLoaderListener
  answer: 3
  explanation: |
    In classic Spring MVC, ContextLoaderListener creates the root web application
    context, and each DispatcherServlet creates its own child servlet context.
  ref: concepts.md#common-applicationcontext-implementations
- id: ioc-container-applicationcontext-vs-beanfactory-028
  difficulty: intermediate
  tags:
  - implementations
  - code
  question: |
    Consider this code:

    ```java
    ApplicationContext ctx =
        new AnnotationConfigApplicationContext(AppConfig.class);
    OrderService svc = ctx.getBean(OrderService.class);
    ```

    What happens when the constructor runs?
  options:
  - Nothing happens until getBean is later invoked; the constructor merely records the config class as a no-op
  - The context reads AppConfig, processes @Bean methods/scanning, and refreshes so beans are ready to
    retrieve
  - It throws immediately because AnnotationConfigApplicationContext accepts only XML resource locations
  - It only stores the configuration class name as a string and defers all parsing until shutdown
  answer: 1
  explanation: |
    The AnnotationConfigApplicationContext constructor registers the given
    configuration class, performs scanning/parsing, and calls refresh() internally,
    so the container is fully initialized and beans can be retrieved.
  ref: concepts.md#common-applicationcontext-implementations
- id: ioc-container-applicationcontext-vs-beanfactory-029
  difficulty: beginner
  tags:
  - refresh
  - startup
  question: |
    Which method centralizes the startup sequence of a ConfigurableApplicationContext?
  options:
  - refresh()
  - start()
  - getBean()
  - init()
  answer: 0
  explanation: |
    refresh() (implemented in AbstractApplicationContext) runs the ordered sequence of
    phases that takes a context from "configured" to "fully initialized and ready."
  ref: concepts.md#container-startup-and-the-refresh-method
- id: ioc-container-applicationcontext-vs-beanfactory-030
  difficulty: intermediate
  tags:
  - refresh
  - eager-singletons
  question: |
    During refresh(), in which phase are the remaining non-lazy singleton beans instantiated?
  options:
  - prepareRefresh()
  - obtainFreshBeanFactory()
  - finishBeanFactoryInitialization()
  - finishRefresh()
  answer: 2
  explanation: |
    finishBeanFactoryInitialization() calls preInstantiateSingletons() on the
    underlying bean factory, which is where eager creation of non-lazy singletons
    happens.
  ref: concepts.md#container-startup-and-the-refresh-method
- id: ioc-container-applicationcontext-vs-beanfactory-031
  difficulty: intermediate
  tags:
  - refresh
  - post-processors
  - difference
  question: |
    What is the key difference between a BeanFactoryPostProcessor and a BeanPostProcessor?
  options:
  - They are two interchangeable names for the exact same extension point registered in the same phase
  - BeanFactoryPostProcessor modifies bean definitions before instantiation; BeanPostProcessor intercepts
    bean instances during initialization
  - BeanPostProcessor modifies definitions; BeanFactoryPostProcessor wraps instances
  - Both run only at container shutdown, editing definitions and instances during the destroy sequence
  answer: 1
  explanation: |
    A BeanFactoryPostProcessor operates on bean definitions (metadata) before any bean
    is instantiated, while a BeanPostProcessor intercepts already-created bean
    instances around their initialization callbacks (enabling proxying, annotation
    injection, etc.).
  ref: concepts.md#container-startup-and-the-refresh-method
- id: ioc-container-applicationcontext-vs-beanfactory-032
  difficulty: intermediate
  tags:
  - refresh
  - configuration-class
  question: |
    During refresh(), which post-processor parses @Configuration classes?
  options:
  - AutowiredAnnotationBeanPostProcessor
  - ConfigurationClassPostProcessor (a BeanFactoryPostProcessor)
  - CommonAnnotationBeanPostProcessor
  - MessageSource
  answer: 1
  explanation: |
    ConfigurationClassPostProcessor is a BeanFactoryPostProcessor invoked in the
    invokeBeanFactoryPostProcessors() phase; it parses @Configuration classes and
    registers their @Bean definitions.
  ref: concepts.md#container-startup-and-the-refresh-method
- id: ioc-container-applicationcontext-vs-beanfactory-033
  difficulty: beginner
  tags:
  - refresh
  - shutdown
  question: |
    What happens when an ApplicationContext is closed (via close() or a shutdown hook)?
  options:
  - Nothing happens; all beans are left running and the container keeps holding their references indefinitely
  - It converts every singleton into a prototype and reissues fresh instances on the next getBean call
  - It recreates all beans from scratch by re-running refresh() before finally releasing the context
  - It publishes ContextClosedEvent and destroys singletons, invoking @PreDestroy and destroy callbacks
  answer: 3
  explanation: |
    On close(), the context publishes ContextClosedEvent, destroys singleton beans
    (calling @PreDestroy, DisposableBean.destroy(), and custom destroy methods), and
    releases resources.
  ref: concepts.md#container-startup-and-the-refresh-method
- id: ioc-container-applicationcontext-vs-beanfactory-034
  difficulty: intermediate
  tags:
  - refresh
  - event
  question: |
    Which event is published at the end of a successful refresh()?
  options:
  - ContextClosedEvent
  - ContextStoppedEvent
  - ContextRefreshedEvent
  - ContextStartedEvent
  answer: 2
  explanation: |
    finishRefresh() publishes ContextRefreshedEvent to signal that the context is
    fully initialized and ready, and it also starts Lifecycle beans.
  ref: concepts.md#container-startup-and-the-refresh-method
- id: ioc-container-applicationcontext-vs-beanfactory-035
  difficulty: beginner
  tags:
  - beanfactory
  - when-to-use
  question: |
    In which scenario might a plain BeanFactory (rather than ApplicationContext) be an appropriate choice?
  options:
  - A severely memory-constrained environment where the extra infrastructure of ApplicationContext is
    undesirable
  - A standard enterprise web application serving many concurrent users through a servlet container
  - Any application that relies on @Autowired, since only a plain BeanFactory can process that annotation
  - An application that needs internationalization and application-event publishing across its components
  answer: 0
  explanation: |
    A plain BeanFactory is a niche choice justified mainly by very tight memory
    constraints or embedded/library use, where the lighter footprint matters and the
    enterprise features are not needed.
  ref: concepts.md#when-a-plain-beanfactory-would-ever-be-used
- id: ioc-container-applicationcontext-vs-beanfactory-036
  difficulty: intermediate
  tags:
  - beanfactory
  - trade-offs
  question: |
    If you choose a plain BeanFactory and do not register any post-processors, what is a likely consequence?
  options:
  - Annotation-driven features like @Autowired and @PostConstruct will not work
  - The application will start faster than any ApplicationContext but with all features intact
  - Beans will still be created eagerly at startup, because a BeanFactory pre-instantiates all singletons
  - Internationalization will remain available, since MessageSource is built into every BeanFactory
  answer: 0
  explanation: |
    Without manually registering the relevant post-processors, annotation-driven
    injection and lifecycle features do not function, because a plain BeanFactory does
    not auto-register them.
  ref: concepts.md#when-a-plain-beanfactory-would-ever-be-used
- id: ioc-container-applicationcontext-vs-beanfactory-037
  difficulty: intermediate
  tags:
  - beanfactory
  - framework-internal
  question: |
    Which statement about Spring's internal use of BeanFactory is accurate?
  options:
  - Spring never touches BeanFactory internally, building ApplicationContext on its own registry instead
  - Spring uses DefaultListableBeanFactory internally as the engine inside every ApplicationContext
  - BeanFactory is only instantiated inside Spring's own unit tests and never at application runtime
  - ApplicationContext deliberately avoids any BeanFactory internally to keep its memory footprint smaller
  answer: 1
  explanation: |
    Even when you use an ApplicationContext, a DefaultListableBeanFactory is used
    internally to hold definitions and create beans. Library authors sometimes also
    use a bare bean factory to embed a minimal container.
  ref: concepts.md#when-a-plain-beanfactory-would-ever-be-used
- id: ioc-container-applicationcontext-vs-beanfactory-038
  difficulty: intermediate
  tags:
  - beanfactory
  - lazy-trade-off
  question: |
    Which trade-off do you accept by relying on a plain BeanFactory's lazy singleton behavior?
  options:
  - Configuration errors are discovered later, at first getBean, rather than at startup
  - Every singleton is silently converted into a prototype and re-created on each getBean call
  - You automatically gain application-event publishing through a built-in event multicaster
  - You permanently lose the ability to look up any bean by name, retaining only by-type lookup
  answer: 0
  explanation: |
    Lazy initialization defers bean creation to first access, so you lose the
    fail-fast advantage — misconfiguration surfaces on first getBean instead of at
    startup.
  ref: concepts.md#when-a-plain-beanfactory-would-ever-be-used
- id: ioc-container-applicationcontext-vs-beanfactory-039
  difficulty: beginner
  tags:
  - jakarta
  - javax
  - versions
  question: |
    Regarding annotation packages, which statement is correct for Spring Framework 6.x?
  options:
  - Spring 6.x uses the javax.* namespace for annotations like PostConstruct
  - Spring 6.x migrated to the jakarta.* namespace (e.g., jakarta.annotation.PostConstruct)
  - Spring 6.x removed @PostConstruct support, requiring an explicit init-method on every bean
  - The core IoC container concepts were fundamentally redesigned in the Spring 6.x release
  answer: 1
  explanation: |
    Spring Framework 6.x moved to the jakarta.* namespace (e.g.,
    jakarta.annotation.PostConstruct, jakarta.inject.Inject), whereas 5.x and earlier
    used javax.*. The core IoC container concepts are unchanged; only package names
    differ.
  ref: concepts.md#common-follow-up-questions
- id: ioc-container-applicationcontext-vs-beanfactory-040
  difficulty: intermediate
  tags:
  - lazy
  - applicationcontext
  question: |
    In an ApplicationContext, how can you make a singleton bean initialize lazily instead of eagerly?
  options:
  - It is impossible; ApplicationContext beans are always eager
  - Change its scope to prototype, which is the only way
  - Annotate it with @Lazy (or set lazy-init="true" in XML)
  - Call refresh() a second time to reset its eager init
  answer: 2
  explanation: |
    Marking a bean with @Lazy (or lazy-init="true" in XML) makes the ApplicationContext
    defer its creation until first requested, overriding the default eager singleton
    behavior.
  ref: concepts.md#applicationcontext-the-enterprise-container
- id: ioc-container-applicationcontext-vs-beanfactory-041
  difficulty: beginner
  tags:
  - applicationcontext
  - is-a-beanfactory
  question: |
    Is every ApplicationContext also a BeanFactory?
  options:
  - No, the two are unrelated interfaces and an ApplicationContext is never a BeanFactory
  - Only under Spring Boot, whose auto-configuration retrofits BeanFactory behavior onto the context
  - Only when you configure the context with XML, since annotation-based contexts drop the BeanFactory role
  - Yes, because ApplicationContext extends BeanFactory, so an ApplicationContext is a BeanFactory with
    added features
  answer: 3
  explanation: |
    Because ApplicationContext extends BeanFactory (via ListableBeanFactory and
    HierarchicalBeanFactory), every ApplicationContext is a BeanFactory that also
    provides enterprise capabilities.
  ref: concepts.md#common-follow-up-questions
- id: ioc-container-applicationcontext-vs-beanfactory-042
  difficulty: intermediate
  tags:
  - spring-boot
  - contrast
  question: |
    How does Spring Boot relate to the core IoC container discussed here?
  options:
  - Spring Boot replaces the core IoC container with its own unrelated dependency-resolution mechanism
  - Spring Boot still creates an ApplicationContext and calls refresh(); auto-configuration is layered
    on top of the same container
  - Spring Boot bypasses ApplicationContext entirely and wires beans through a bare plain BeanFactory
  - Spring Boot removes the concept of beans, replacing them with auto-configured component records
  answer: 1
  explanation: |
    Spring Boot's SpringApplication builds on the same core container: it creates an
    ApplicationContext (often a web variant) and calls refresh(). Auto-configuration
    is a Boot feature layered on the identical Spring Framework IoC machinery.
  ref: concepts.md#common-follow-up-questions
- id: ioc-container-applicationcontext-vs-beanfactory-043
  difficulty: expert
  tags:
  - internals
  - singleton-cache
  - circular-dependency
  question: |
    Spring's DefaultSingletonBeanRegistry uses a three-level cache (singletonObjects,
    earlySingletonObjects, singletonFactories). At which exact point in doCreateBean
    is a bean's early reference exposed via addSingletonFactory, and why does that
    point matter?
  options:
  - After the constructor returns but before populateBean runs, which is precisely why setter/field
    cycles can be resolved but constructor cycles cannot
  - Before the constructor is invoked, so that even constructor arguments can be resolved from the
    early cache
  - After full initialization (BeanPostProcessors and @PostConstruct have run), so only completely
    ready beans are ever exposed to collaborators
  - Only when close() is called, as part of orderly singleton teardown
  answer: 0
  explanation: |
    doCreateBean instantiates the bean (constructor), then calls addSingletonFactory to
    publish an early reference, then populateBean (injection), then initializeBean.
    Because the early reference exists only after construction, a collaborator in a
    setter/field cycle can obtain it — but a constructor cycle has no such window, so
    it cannot be resolved.
  ref: concepts.md#bean-creation-internals-and-the-singleton-cache
- id: ioc-container-applicationcontext-vs-beanfactory-044
  difficulty: expert
  tags:
  - internals
  - circular-dependency
  - aop
  - exception
  question: |
    A singleton bean A is involved in a setter-based circular reference with B, and A
    is also targeted by a custom BeanPostProcessor that wraps A in a decorator during
    postProcessAfterInitialization (not via the standard AOP SmartInstantiationAware
    proxy path). What is the most likely outcome at startup?
  options:
  - Startup succeeds and B receives the fully wrapped, final version of A because Spring re-injects
    wrapped instances into all collaborators
  - Spring silently injects the raw (unwrapped) A into B and the wrapped A everywhere else, with no
    error
  - Spring throws BeanCurrentlyInCreationException because the raw early reference injected into B
    does not equal the wrapped instance that becomes the final singleton
  - The BeanPostProcessor is skipped entirely for A because A participates in a cycle
  answer: 2
  explanation: |
    The early reference exposed to B is the raw instance. If the final singleton ends up
    being a different (wrapped) object created by a late BeanPostProcessor, Spring
    detects that B holds a stale raw reference and throws
    BeanCurrentlyInCreationException. The AOP auto-proxy creator avoids this because it
    is a SmartInstantiationAwareBeanPostProcessor whose getEarlyBeanReference exposes the
    proxy early.
  ref: concepts.md#bean-creation-internals-and-the-singleton-cache
- id: ioc-container-applicationcontext-vs-beanfactory-045
  difficulty: advanced
  tags:
  - circular-dependency
  - constructor-injection
  - lazy
  question: |
    Two singletons, A and B, each require the other via constructor injection. Which
    approach resolves the cycle WITHOUT converting either to setter/field injection?
  options:
  - Mark both classes @Primary so the container knows which to build first
  - Change both beans to prototype scope, which disables cycle detection
  - Increase the container's thread pool so both constructors can run in parallel
  - Annotate one of the constructor parameters with @Lazy so a lazy proxy is injected and the real
    bean is resolved on first method call
  answer: 3
  explanation: |
    @Lazy on one constructor injection point causes Spring to inject a lazy-initializing
    proxy; the actual target is resolved on first use, after both beans have been
    constructed. ObjectProvider<T> achieves the same deferral. @Primary and scope changes
    do not break a constructor cycle.
  ref: concepts.md#circular-dependencies-and-injection-styles
- id: ioc-container-applicationcontext-vs-beanfactory-046
  difficulty: advanced
  tags:
  - circular-dependency
  - exception
  question: |
    What exception does the container throw for an unresolvable constructor-based
    circular dependency detected during refresh()?
  options:
  - NoUniqueBeanDefinitionException, raised because two candidate beans match the ambiguous injection point
  - BeanCurrentlyInCreationException (typically wrapped in a BeanCreationException /
    UnsatisfiedDependencyException)
  - BeanDefinitionOverrideException, raised because the same bean name was registered twice in the context
  - ApplicationContextException, raised because the context cannot complete its refresh() lifecycle phase
  answer: 1
  explanation: |
    A constructor cycle cannot expose an early reference, so when the container re-enters
    creation of a bean already in creation, it throws BeanCurrentlyInCreationException,
    generally surfaced wrapped in BeanCreationException / UnsatisfiedDependencyException.
  ref: concepts.md#circular-dependencies-and-injection-styles
- id: ioc-container-applicationcontext-vs-beanfactory-047
  difficulty: advanced
  tags:
  - circular-dependency
  - spring-boot
  - versions
  question: |
    A setter-injection circular dependency worked on the raw Spring Framework but fails
    fast when the same beans run under Spring Boot 2.6+. What best explains this?
  options:
  - Spring Boot 2.6+ flipped its default to allowCircularReferences=false, a Boot policy over the
    same core switch that still defaults to true in the framework
  - Spring Framework 6 removed support for circular dependencies entirely
  - The beans were accidentally changed to constructor injection during the upgrade
  - Boot uses a plain BeanFactory that cannot resolve any cycles
  answer: 0
  explanation: |
    The core container still defaults allowCircularReferences to true. Spring Boot 2.6+
    changed its own default to false to discourage cycles, so a setter/field cycle that
    previously worked now fails fast under Boot. It is a Boot configuration policy, not a
    change to the container's capability.
  ref: concepts.md#circular-dependencies-and-injection-styles
- id: ioc-container-applicationcontext-vs-beanfactory-048
  difficulty: expert
  tags:
  - autowiring
  - primary
  - priority
  - resolution-order
  question: |
    Two beans of type MovieCatalog exist: one @Bean method annotated @Primary, and one
    @Component annotated @Priority(1). A plain by-type @Autowired MovieCatalog injection
    point is resolved. Which wins, and why?
  options:
  - The @Priority(1) bean, because a lower @Priority value always takes precedence over everything
    else
  - Neither; the presence of both @Primary and @Priority is contradictory and throws
    NoUniqueBeanDefinitionException
  - The @Primary bean, because @Primary takes precedence over @Priority in the resolution order
  - Whichever bean was defined first during configuration parsing
  answer: 2
  explanation: |
    Spring resolves single-valued ambiguity as @Primary first, then @Priority, then
    qualifier/bean-name match. Since @Primary outranks @Priority, the @Primary bean is
    injected. Note @Priority cannot even be placed on @Bean methods (it is class-level).
  ref: concepts.md#autowiring-resolution-and-ambiguity
- id: ioc-container-applicationcontext-vs-beanfactory-049
  difficulty: advanced
  tags:
  - autowiring
  - bean-name-fallback
  question: |
    Three beans implement Notifier with no @Primary/@Priority/@Qualifier. A field is
    declared: @Autowired private Notifier smsNotifier; and one of the beans is named
    "smsNotifier". What happens?
  options:
  - Injection fails with NoUniqueBeanDefinitionException because there are three candidates
  - The bean named "smsNotifier" is injected, because Spring falls back to matching the
    injection-point name against bean names
  - All three beans are merged and injected as a single synthesized composite Notifier delegate
  - The bean defined first in registration order is injected, since Spring resolves ties by scan order
  answer: 1
  explanation: |
    After @Primary and @Priority fail to disambiguate, Spring uses the injection-point
    name (the field/parameter name) as an implicit qualifier and matches it against bean
    names. The field name smsNotifier matches the bean named smsNotifier, resolving the
    ambiguity.
  ref: concepts.md#autowiring-resolution-and-ambiguity
- id: ioc-container-applicationcontext-vs-beanfactory-050
  difficulty: advanced
  tags:
  - autowiring
  - collections
  - ordering
  question: |
    You inject @Autowired private List<Validator> validators; and there are four
    Validator beans, some annotated @Order. What is true?
  options:
  - Injection fails because the four candidate Validator beans are ambiguous for a single injection point
  - The list is injected empty because Spring does not support injecting beans into collection types
  - Only the @Primary-annotated Validator is added to the list and the other three beans are skipped
  - All four beans are injected into the list, ordered according to @Order / Ordered / @Priority
  answer: 3
  explanation: |
    For collection, array, and Map injection points ambiguity is not an error: all
    matching beans are injected. When ordering annotations are present, the elements are
    sorted by @Order / Ordered / @Priority.
  ref: concepts.md#autowiring-resolution-and-ambiguity
- id: ioc-container-applicationcontext-vs-beanfactory-051
  difficulty: expert
  tags:
  - autowiring
  - default-candidate
  - versions
  question: |
    A @Bean is declared with defaultCandidate=false and @Qualifier("audit"). Elsewhere a
    plain by-type injection point @Autowired AuditSink sink exists (no qualifier), and
    this is the only AuditSink bean. What happens at startup?
  options:
  - Injection fails (no eligible candidate by plain type) because defaultCandidate=false excludes it
    from injection points that lack a matching qualifier
  - The bean is injected normally because it is the only candidate of its type in the whole context
  - Spring silently auto-adds the "audit" qualifier onto the plain injection point so the two now match
  - The container throws BeanDefinitionOverrideException because defaultCandidate collides with the qualifier
  answer: 0
  explanation: |
    A bean with defaultCandidate=false (Spring 6.2+) is only available to injection
    points that carry a matching qualifier. A plain by-type injection point without the
    qualifier will not see it, so resolution fails with no eligible candidate — a
    frequent "expected 1 bean but found 0" surprise.
  ref: concepts.md#autowiring-resolution-and-ambiguity
- id: ioc-container-applicationcontext-vs-beanfactory-052
  difficulty: expert
  tags:
  - beanpostprocessor
  - ordering
  - order-annotation
  question: |
    A developer writes a BeanPostProcessor and annotates the class with @Order(0),
    expecting it to run before another one. It runs in an unexpected position anyway.
    What is the root cause?
  options:
  - '@Order values on a post-processor must be negative before the container will honor them at all'
  - BeanPostProcessors cannot be ordered at all; they always run in alphabetical class-name order
  - BeanPostProcessor registration ordering honors the PriorityOrdered/Ordered interfaces, not the
    @Order annotation; the BPP must implement Ordered/PriorityOrdered
  - The @Order annotation only takes effect on @Configuration classes and is ignored everywhere else
  answer: 2
  explanation: |
    For BeanPostProcessor registration, AbstractApplicationContext sorts by the
    PriorityOrdered and Ordered interfaces (via getOrder()), not by the @Order
    annotation. To order a BPP reliably you must implement Ordered or PriorityOrdered.
    @Order does drive sorting of injected collections, but not BPP registration.
  ref: concepts.md#beanpostprocessor-ordering-and-infrastructure-beans
- id: ioc-container-applicationcontext-vs-beanfactory-053
  difficulty: expert
  tags:
  - beanpostprocessor
  - early-instantiation
  - configuration
  question: |
    A @Configuration class declares a non-static @Bean method returning a
    BeanPostProcessor, and that method also injects a repository bean as a parameter.
    Users observe that some beans skip AOP proxying and log "not eligible for getting
    processed by all BeanPostProcessors". Why?
  options:
  - Because @Bean methods that return a BeanPostProcessor are illegal and are silently ignored at parse time
  - Because AOP proxying is globally disabled the moment any custom BeanPostProcessor is registered
  - Because BeanPostProcessors must be declared in XML configuration and are never picked up from Java config
  - Because the non-static BPP factory method forces early instantiation of the configuration class
    and the injected repository before all BPPs are registered, causing those beans to bypass later
    post-processing
  answer: 3
  explanation: |
    BeanPostProcessor beans (and their dependencies) are instantiated very early, before
    the full BPP set is registered. A non-static @Bean BPP method forces the enclosing
    @Configuration instance and its injected collaborators to be created early, so those
    collaborators escape post-processing by BPPs registered afterward. Declaring such
    methods static and dependency-free avoids this.
  ref: concepts.md#beanpostprocessor-ordering-and-infrastructure-beans
- id: ioc-container-applicationcontext-vs-beanfactory-054
  difficulty: advanced
  tags:
  - beanfactorypostprocessor
  - registry-post-processor
  - ordering
  question: |
    Within invokeBeanFactoryPostProcessors(), why do
    BeanDefinitionRegistryPostProcessors (e.g., ConfigurationClassPostProcessor) run as
    an earlier sub-phase than ordinary BeanFactoryPostProcessors?
  options:
  - Because they are the only post-processors permitted to modify fully instantiated bean instances
  - Because they add or modify bean definitions that ordinary BeanFactoryPostProcessors must be able
    to see and operate on afterward
  - Because they run on a separate background thread to speed up the overall container startup phase
  - Because ordinary BeanFactoryPostProcessors were deprecated in Spring 6 and now execute last for compatibility
  answer: 1
  explanation: |
    BeanDefinitionRegistryPostProcessor is a sub-interface that can register new bean
    definitions. Those definitions must exist before regular BeanFactoryPostProcessors
    run, so the registry post-processors execute first (themselves ordered by
    PriorityOrdered, then Ordered, then the rest).
  ref: concepts.md#beanpostprocessor-ordering-and-infrastructure-beans
- id: ioc-container-applicationcontext-vs-beanfactory-055
  difficulty: expert
  tags:
  - thread-safety
  - singleton
  - state
  question: |
    A singleton @Service stores per-call data in an instance field and reads it back
    later in the same method chain. Under load, requests see each other's data. What is
    the correct diagnosis and fix?
  options:
  - Singleton beans are shared across threads and the container does not synchronize your fields;
    store per-call state in local variables, request/prototype scope, or ThreadLocal
  - The container failed to synchronize the bean's fields; wrap every service method in a synchronized block so concurrent requests are serialized one at a time
  - Change the bean to eager initialization so the container clones a per-thread copy of its instance fields the moment each request thread enters the method
  - Mark the bean @Primary so the container promotes it to a thread-confined scope and hands each request thread its own isolated primary copy
  answer: 0
  explanation: |
    A singleton is one shared instance; mutable instance fields are visible to all
    threads. The container guarantees single creation but does not isolate your state.
    Keep singletons stateless — use method-local variables, a narrower scope, or
    ThreadLocal for per-request data.
  ref: concepts.md#thread-safety-and-concurrency-in-the-container
- id: ioc-container-applicationcontext-vs-beanfactory-056
  difficulty: expert
  tags:
  - prototype
  - lifecycle
  - destroy
  question: |
    Which statement about prototype-scoped beans and lifecycle callbacks is correct?
  options:
  - The container invokes @PreDestroy on prototypes when the context closes, just like singletons
  - Prototype beans never receive @PostConstruct callbacks because the container skips initialization entirely for any non-singleton scope and returns the raw constructed object
  - The container instantiates and configures a prototype but does not manage its full lifecycle;
    destroy callbacks are NOT invoked, so cleanup is the caller's responsibility
  - Prototype beans are cached in the singleton registry and reused exactly like singletons once the first getBean call has created and initialized the instance
  answer: 2
  explanation: |
    For prototypes the container runs initialization (including @PostConstruct) and hands
    the instance over, then forgets it. It does not track prototypes for destruction, so
    @PreDestroy/DisposableBean.destroy() are not called automatically. Cleanup must be
    handled by the caller or a custom mechanism.
  ref: concepts.md#thread-safety-and-concurrency-in-the-container
- id: ioc-container-applicationcontext-vs-beanfactory-057
  difficulty: advanced
  tags:
  - thread-safety
  - singleton-creation
  question: |
    Two threads call getBean("dataSource") simultaneously for a not-yet-created
    singleton. What does the container guarantee?
  options:
  - Each thread gets its own separate instance because the container falls back to prototype semantics whenever two threads race on the same not-yet-created singleton
  - The singleton is created exactly once; creation is guarded by synchronization on the singleton
    registry, and both threads receive the same instance
  - One thread receives the fully built bean and the other receives null, since only the first caller through the registry lock is allowed to complete construction
  - The container throws BeanCurrentlyInCreationException for the second thread, treating the concurrent access as an unresolvable circular dependency on the in-progress singleton
  answer: 1
  explanation: |
    Singleton creation in DefaultSingletonBeanRegistry is guarded so a given singleton is
    created only once even under concurrent first access; both callers get the same
    shared instance. (Init-time cross-thread lookups of other in-progress singletons can
    still risk deadlock.)
  ref: concepts.md#thread-safety-and-concurrency-in-the-container
- id: ioc-container-applicationcontext-vs-beanfactory-058
  difficulty: expert
  tags:
  - factorybean
  - name-prefix
  - getbean
  question: |
    myFactory is a bean implementing FactoryBean<Connection> whose getObject() returns a
    Connection. What do getBean("myFactory") and getBean("&myFactory") return,
    respectively?
  options:
  - Both return the FactoryBean instance itself, because the container always hands back the factory object and leaves the caller to invoke getObject() manually
  - Both return a Connection produced by getObject(), since the & prefix is just a naming convention that resolves to the same product as the bare name
  - getBean("myFactory") returns the FactoryBean; getBean("&myFactory") throws because & is not a
    valid bean-name character and the container rejects it as a malformed lookup
  - getBean("myFactory") returns the Connection (the product of getObject()); getBean("&myFactory")
    returns the FactoryBean instance itself
  answer: 3
  explanation: |
    A FactoryBean contributes its product to the container. getBean("myFactory") returns
    getObject()'s result (the Connection). The & prefix (BeanFactory.FACTORY_BEAN_PREFIX)
    dereferences to the FactoryBean instance itself.
  ref: concepts.md#factorybean-and-the-getbean-name-prefix
- id: ioc-container-applicationcontext-vs-beanfactory-059
  difficulty: advanced
  tags:
  - factorybean
  - factory-method
  - distinction
  question: |
    Which statement correctly distinguishes a FactoryBean from a factory method (a @Bean
    method or XML factory-method)?
  options:
  - A FactoryBean is an interface a bean implements so the container injects its getObject() product
    and supports the & dereference prefix, whereas a factory method is merely a way to instantiate a
    bean with no &-prefix semantics
  - They are identical; FactoryBean is simply the annotation-based form of a factory method, and both support the & dereference prefix interchangeably
  - A factory method supports the & prefix to return the factory itself, while a FactoryBean has no such dereference mechanism and only ever yields its product
  - FactoryBean can only be used in XML configuration via a factory-bean attribute, and the container ignores it entirely when declared through Java config
  answer: 0
  explanation: |
    FactoryBean<T> is an interface whose getObject() supplies the bean the container
    injects, and it uniquely supports the & dereference prefix. A factory method is just
    an instantiation strategy (@Bean method / factory-method) and has no such prefix
    semantics.
  ref: concepts.md#factorybean-and-the-getbean-name-prefix
- id: ioc-container-applicationcontext-vs-beanfactory-060
  difficulty: expert
  tags:
  - bean-definition-overriding
  - registration-order
  question: |
    In a plain DefaultListableBeanFactory (framework defaults), two bean definitions are
    registered under the same name "cache" at different times. What is the result?
  options:
  - A ConflictingBeanDefinitionException is thrown immediately, because a raw factory rejects any second registration under a name that is already taken
  - Both definitions coexist under the shared name and getBean("cache") returns a list containing both registered instances
  - The later-registered definition silently overrides the earlier one, because
    allowBeanDefinitionOverriding defaults to true
  - The earlier definition always wins; later registrations under the same name are silently discarded to protect the first-registered bean
  answer: 2
  explanation: |
    At the framework level allowBeanDefinitionOverriding is true, so a same-name
    registration silently replaces the previous definition — the later one wins, which
    makes registration order significant. (Spring Boot flips this default to false,
    turning it into a BeanDefinitionOverrideException.)
  ref: concepts.md#bean-definition-overriding-and-registration-order
- id: ioc-container-applicationcontext-vs-beanfactory-061
  difficulty: advanced
  tags:
  - component-scanning
  - conflict
  - exception
  question: |
    Two different classes in a scanned package both resolve to the bean name
    "reportService" (e.g., via default naming). Unlike duplicate @Bean methods, what does
    component scanning do?
  options:
  - Silently keeps whichever class is scanned last, applying the same later-wins override rule that duplicate @Bean methods use
  - Renames one bean automatically by appending a numeric suffix so both scanned classes register side by side without collision
  - Merges the two classes into one composite bean that delegates method calls to whichever implementation the container resolves at runtime
  - Throws ConflictingBeanDefinitionException, because scanning cannot infer which class was
    intended to override the other
  answer: 3
  explanation: |
    Component scanning treats a same-name collision from two distinct classes as an error
    (ConflictingBeanDefinitionException) because it cannot know intent. This differs from
    duplicate @Bean methods, where the later definition silently overrides under default
    framework settings.
  ref: concepts.md#bean-definition-overriding-and-registration-order
- id: ioc-container-applicationcontext-vs-beanfactory-062
  difficulty: advanced
  tags:
  - spring-boot
  - overriding
  - versions
  question: |
    A microservice defines a bean and also imports a library that defines a bean of the
    same name. It ran on plain Spring but throws BeanDefinitionOverrideException on Spring
    Boot. What is the cause?
  options:
  - Spring Boot removed support for registering more than one bean definition per type, so any duplicate name now aborts the context
  - Spring Boot sets allowBeanDefinitionOverriding=false by default, converting the silent override
    into a startup failure
  - The library bean is annotated @Primary, and Spring Boot forbids @Primary on beans that share a name with an application-defined bean
  - Boot swaps in a plain BeanFactory whose registry rejects any second registration under a name that already exists
  answer: 1
  explanation: |
    Boot defaults allowBeanDefinitionOverriding to false, so a same-name definition that
    silently overrode on the raw framework now fails at startup with
    BeanDefinitionOverrideException. It is a Boot policy over the same underlying switch.
  ref: concepts.md#bean-definition-overriding-and-registration-order
- id: ioc-container-applicationcontext-vs-beanfactory-063
  difficulty: expert
  tags:
  - scoped-proxy
  - request-scope
  - injection
  question: |
    A request-scoped bean is injected directly (no proxy) into a singleton controller.
    What is the problem, and what is the standard fix?
  options:
  - The singleton captures a single request-scoped instance at creation time and reuses it forever;
    inject a scoped proxy (proxyMode=TARGET_CLASS) so each call routes to the current request's
    instance
  - No problem; Spring transparently re-injects the correct request-scoped instance into the singleton's field at the start of every incoming request
  - The application will not start because a request-scoped bean can never be injected into a singleton without an active web request present at refresh time
  - The fix is to make the controller prototype-scoped so a new controller and its request bean are created together on each invocation
  answer: 0
  explanation: |
    A singleton is wired once, so a directly injected request-scoped bean would be frozen
    to one instance. A scoped proxy (ScopedProxyMode.TARGET_CLASS or INTERFACES) injects
    a proxy that dispatches each invocation to the correct request-scoped target for the
    current context.
  ref: concepts.md#scoped-beans-and-proxy-injection
- id: ioc-container-applicationcontext-vs-beanfactory-064
  difficulty: advanced
  tags:
  - prototype
  - singleton
  - lookup-injection
  question: |
    A singleton needs a fresh prototype instance on every method invocation. Which
    mechanisms achieve this? (Choose the most complete answer.)
  options:
  - Only changing the singleton itself to prototype scope, which then cascades a fresh instance of every injected prototype on each call
  - Marking the prototype @Primary, which signals the container to re-resolve and re-inject it on every method invocation
  - '@Lookup method injection, ObjectProvider<T>.getObject(), or Provider<T>.get() — each resolves
    a new prototype per call rather than capturing one at wiring time'
  - Calling refresh() before each invocation so the container rebuilds the prototype and re-injects it into the singleton
  answer: 2
  explanation: |
    Because a singleton is wired once, injecting a prototype directly captures a single
    instance. @Lookup method injection, ObjectProvider<T>, and JSR-330 Provider<T> all
    defer resolution to call time, returning a new prototype on each invocation.
  ref: concepts.md#scoped-beans-and-proxy-injection
- id: ioc-container-applicationcontext-vs-beanfactory-065
  difficulty: advanced
  tags:
  - objectprovider
  - optional-dependency
  question: |
    You have an injection point that should tolerate zero or many candidate beans without
    throwing NoSuchBeanDefinitionException or NoUniqueBeanDefinitionException. Which API
    is designed for this?
  options:
  - A raw @Autowired field, which silently resolves to null when zero or many candidates exist and never throws either exception
  - ObjectProvider<T>, using getIfAvailable(), getIfUnique(), stream(), or orderedStream()
  - '@Primary placed on the injection point itself, which suppresses both exceptions by picking one arbitrary candidate'
  - getBean(Class) invoked inside a static initializer, which defers resolution until after all ambiguity has been cleared
  answer: 1
  explanation: |
    ObjectProvider<T> provides getIfAvailable() (0 or 1), getIfUnique() (unique or null),
    and stream()/orderedStream() (0..n), letting you handle optional and multi-valued
    dependencies gracefully without the exceptions that plain by-type injection would
    throw.
  ref: concepts.md#scoped-beans-and-proxy-injection
- id: ioc-container-applicationcontext-vs-beanfactory-066
  difficulty: expert
  tags:
  - refresh
  - ordering
  - bfpp-vs-bpp
  question: |
    Consider a @Value("${feature.flag}") placeholder and a custom AOP proxy on the same
    bean. In refresh(), which ordering of infrastructure makes both work, and why can't a
    BeanPostProcessor resolve the placeholder?
  options:
  - Placeholders are resolved by a BeanPostProcessor after instantiation once the instance's fields
    are visible, while AOP proxying happens earlier in a BeanFactoryPostProcessor that rewrites the
    bean definition
  - Placeholders are resolved lazily at getBean time by the ResourceLoader, which reads the property source on demand as each bean is first requested
  - Both the placeholder substitution and the AOP proxy are handled by the same post-processor in phase 6, so their ordering relative to each other never matters
  - PropertySourcesPlaceholderConfigurer is a BeanFactoryPostProcessor that edits bean definitions
    in phase 5 before instantiation, while the AOP proxy is applied by a BeanPostProcessor during
    initialization in phase 11 — a BPP is too late to alter definition-level placeholders
  answer: 3
  explanation: |
    Placeholder resolution operates on bean definitions and is done by
    PropertySourcesPlaceholderConfigurer, a BeanFactoryPostProcessor, before any bean is
    instantiated. AOP proxying wraps instances via a BeanPostProcessor during
    initialization. A BeanPostProcessor sees instances, not definitions, so it cannot
    perform definition-level placeholder substitution.
  ref: concepts.md#beanpostprocessor-ordering-and-infrastructure-beans
- id: ioc-container-applicationcontext-vs-beanfactory-067
  difficulty: advanced
  tags:
  - refresh
  - idempotency
  - generic-context
  question: |
    With a GenericApplicationContext, what happens if you call refresh() a second time
    after the context is already active?
  options:
  - It throws IllegalStateException — GenericApplicationContext supports only a single refresh,
    unlike contexts backed by a re-loadable definition source
  - It re-parses all registered definitions and hot-reloads every bean safely, discarding the previous singletons and rebuilding them from scratch
  - It silently does nothing, because the context detects it is already active and treats the second refresh as an idempotent no-op
  - It switches the context to lazy initialization mode, deferring all subsequent singleton creation until the next getBean call
  answer: 0
  explanation: |
    GenericApplicationContext is designed for a single refresh; calling refresh() again
    throws IllegalStateException ("GenericApplicationContext does not support multiple
    refresh attempts"). XML-backed contexts can be refreshed repeatedly because they can
    reload their definition source.
  ref: concepts.md#common-applicationcontext-implementations
- id: ioc-container-applicationcontext-vs-beanfactory-068
  difficulty: expert
  tags:
  - beanfactory
  - manual-setup
  - annotations
  question: |
    You build a raw DefaultListableBeanFactory and register a bean whose fields use
    @Autowired, but injection never happens. What is the minimal fix consistent with how
    a plain BeanFactory works?
  options:
  - Nothing is needed; @Autowired always works because the compiler inlines the injection at build time, independent of any container support
  - Switch every field to setter injection, which a plain BeanFactory always processes automatically even without any registered post-processor
  - Manually register an AutowiredAnnotationBeanPostProcessor (e.g., via addBeanPostProcessor),
    because a plain BeanFactory does not auto-detect post-processors
  - Call preInstantiateSingletons() twice so the second eager pass performs the annotation-driven field injection the first pass skipped
  answer: 2
  explanation: |
    A plain BeanFactory does not auto-register post-processors. Annotation-driven
    injection requires manually adding AutowiredAnnotationBeanPostProcessor (and
    CommonAnnotationBeanPostProcessor for @PostConstruct/@Resource). An
    ApplicationContext does this automatically.
  ref: concepts.md#beanfactory-the-basic-container
- id: ioc-container-applicationcontext-vs-beanfactory-069
  difficulty: expert
  tags:
  - hierarchical-beanfactory
  - parent-child
  - lookup
  question: |
    In a parent-child context hierarchy (e.g., classic Spring MVC root + DispatcherServlet
    contexts), a bean of type Foo exists in both. A component in the child context does
    @Autowired Foo. Which is injected, and can the parent see the child's bean?
  options:
  - The parent's Foo is always injected because parent definitions take precedence, and visibility is bidirectional so the parent can also see the child's bean
  - Both Foo beans are injected together as a List, since the child merges its own definitions with the parent's for every by-type lookup
  - Injection fails with NoUniqueBeanDefinitionException because the container flattens parent and child
    into one namespace where two Foo beans now collide
  - The child's own Foo is injected (child definitions take precedence for its own beans), and the
    parent CANNOT see beans defined in the child
  answer: 3
  explanation: |
    Contexts form a HierarchicalBeanFactory: a child can see parent beans, but the parent
    cannot see child beans. When resolving its own injection point, the child's local
    definition takes precedence over the parent's. Visibility is one-directional
    (child -> parent).
  ref: concepts.md#common-applicationcontext-implementations
- id: ioc-container-applicationcontext-vs-beanfactory-070
  difficulty: advanced
  tags:
  - applicationcontext
  - eager-init
  - lazy
  - failure-mode
  question: |
    A misconfigured singleton (e.g., a missing required dependency) exists in the context.
    It is annotated @Lazy. In an ApplicationContext, when does the failure surface?
  options:
  - Immediately at refresh(), because ApplicationContext always eagerly validates all beans
    regardless of @Lazy
  - Only when the bean is first requested/injected, because @Lazy defers its creation past the eager
    preInstantiateSingletons phase
  - Never; @Lazy beans skip dependency checking entirely, so a missing required dependency is silently tolerated for the life of the context
  - At context close(), during destruction, when the container finally attempts to instantiate the deferred bean in order to run its @PreDestroy callback
  answer: 1
  explanation: |
    Eager initialization normally gives fail-fast behavior, but @Lazy opts a bean out of
    finishBeanFactoryInitialization()'s eager pass. Its creation — and thus its failure —
    is deferred until first access, sacrificing fail-fast for that bean.
  ref: concepts.md#applicationcontext-the-enterprise-container
- id: ioc-container-applicationcontext-vs-beanfactory-071
  difficulty: expert
  tags:
  - factorybean
  - lifecycle
  - early-init
  question: |
    Why can a FactoryBean whose getObject() is consulted during type matching cause other
    beans to be instantiated earlier than expected, and how does Spring mitigate it?
  options:
  - To answer a by-type getBeanNamesForType query the container may need the FactoryBean
    instantiated to learn its product type; Spring uses getObjectType() to avoid fully creating the
    product where possible
  - It cannot; FactoryBeans are always the very last beans created, so type matching never needs to touch them and nothing is instantiated early
  - Spring disables all FactoryBeans during type matching, resolving product types purely from generic signatures so no factory is ever created early
  - FactoryBeans are only ever created at context close(), which is why they can never trigger any early instantiation of other beans
  answer: 0
  explanation: |
    Determining a FactoryBean's product type for autowiring/type queries may require the
    FactoryBean itself to be created early. Spring calls getObjectType() to determine the
    product type without necessarily invoking getObject(), reducing premature
    instantiation, but poorly implemented FactoryBeans can still trigger early creation.
  ref: concepts.md#factorybean-and-the-getbean-name-prefix
- id: ioc-container-applicationcontext-vs-beanfactory-072
  difficulty: advanced
  tags:
  - refresh
  - listeners
  - early-events
  question: |
    An ApplicationListener bean also depends on a service that publishes an event during
    its own @PostConstruct. Given the refresh() phase ordering, what determines whether
    the listener receives that event?
  options:
  - Listeners always receive every event regardless of timing, because the multicaster records the full history and replays all past events to any listener the moment it registers
  - Events published during @PostConstruct are always lost, since the container defers listener registration until after every bean's initialization has completed
  - Events published before initApplicationEventMulticaster()/registerListeners() are buffered as
    early application events and replayed once the multicaster and listeners are ready; timing
    relative to those phases governs delivery
  - The listener must itself be registered as a BeanFactoryPostProcessor to receive early events, since only definition-phase beans are wired to the multicaster in time
  answer: 2
  explanation: |
    refresh() sets up the event multicaster (phase 8) and registers listeners (phase 10)
    before finishing bean initialization. Events fired before the multicaster exists are
    stored as early application events and multicast once listeners are registered, so
    the phase in which the event is published determines delivery.
  ref: concepts.md#container-startup-and-the-refresh-method
- id: ioc-container-applicationcontext-vs-beanfactory-073
  difficulty: expert
  tags:
  - concurrency
  - deadlock
  - singleton-lock
  - versions
  question: |
    A singleton's @PostConstruct spawns a background thread that immediately calls
    getBean() for another singleton still under construction on the main thread. What is
    the risk, and what changed in Spring 6.2?
  options:
  - No risk whatsoever; singleton creation is entirely lock-free, so the background thread's getBean
    simply proceeds in parallel and both singletons finish constructing independently
  - Because singleton creation holds the singleton lock, the cross-thread getBean can deadlock;
    Spring 6.2 reworked singleton locking (background/lenient locking) to reduce such deadlocks,
    though init-time cross-thread lookups remain hazardous
  - The background thread always receives a fresh prototype copy of the in-progress singleton, so the
    two constructions never touch the same object and no contention can arise
  - Spring 6.2 removed singleton scope entirely, so every bean now defaults to prototype and the
    cross-thread getBean simply builds a brand-new independent instance with no shared state
  answer: 1
  explanation: |
    Singleton creation is guarded by a lock; init-time cross-thread getBean calls for
    in-progress singletons can produce lock-ordering deadlocks. Spring 6.2 revised
    singleton locking to be more lenient/background-aware to mitigate this, but such
    patterns are still risky and best avoided.
  ref: concepts.md#thread-safety-and-concurrency-in-the-container
- id: ioc-container-applicationcontext-vs-beanfactory-074
  difficulty: advanced
  tags:
  - beanfactory
  - applicationcontext
  - getbeanprovider
  question: |
    Which capability is available on both BeanFactory and ApplicationContext for
    programmatic, lazy, ambiguity-tolerant access to beans, added to the BeanFactory
    interface in Spring 5.1?
  options:
  - getMessage(...) for internationalization, declared on the base BeanFactory interface since Spring
    5.1 so message resolution works even without an ApplicationContext
  - getResource(...) for resource loading, promoted onto the BeanFactory interface in Spring 5.1 to
    give raw factories classpath and filesystem location resolution out of the box
  - publishEvent(...) for application events, added to the BeanFactory contract in Spring 5.1 so a plain
    factory can multicast events to listener beans
  - getBeanProvider(Class), returning an ObjectProvider for deferred and optional/plural resolution
  answer: 3
  explanation: |
    getBeanProvider(Class) / getBeanProvider(ResolvableType) were added to the
    BeanFactory interface in Spring 5.1 and return an ObjectProvider (the ObjectProvider
    type itself dates to 4.3), giving lazy, optional (getIfAvailable), unique
    (getIfUnique), and streaming access. getMessage, publishEvent, and getResource are
    ApplicationContext-only features.
  ref: concepts.md#beanfactory-the-basic-container
- id: ioc-container-applicationcontext-vs-beanfactory-075
  difficulty: expert
  tags:
  - configuration
  - full-vs-lite
  - cglib
  question: |
    A @Bean method calls another @Bean method directly within a @Configuration class to
    reuse a singleton. What container mechanism guarantees the second call returns the
    SAME singleton rather than a new object, and when is that guarantee lost?
  options:
  - The @Configuration class is enhanced by a CGLIB subclass that intercepts inter-bean method calls
    and routes them through the container; the guarantee is lost if the class is treated as a "lite"
    @Bean source (e.g., proxyBeanMethods=false or plain @Component)
  - The JVM's own method-return caching memoizes every @Bean method after its first invocation, so
    Java itself guarantees the same instance is returned in all cases regardless of container mode
  - The guarantee holds only for prototype-scoped @Bean methods, because Spring intercepts inter-bean
    calls exclusively for prototypes and lets singleton methods run as ordinary Java calls
  - It holds only when both @Bean methods are declared static, since Spring can intercept static
    factory methods but never instance-level ones inside a @Configuration class
  answer: 0
  explanation: |
    Full @Configuration classes are CGLIB-enhanced so inter-bean method invocations are
    intercepted and return the managed singleton. With proxyBeanMethods=false (lite mode)
    or @Bean methods in a non-@Configuration component, no interception occurs and a direct
    call creates a new, unmanaged instance.
  ref: concepts.md#container-startup-and-the-refresh-method
- id: ioc-container-applicationcontext-vs-beanfactory-076
  difficulty: advanced
  tags:
  - scoped-proxy
  - proxy-mode
  - internals
  question: |
    For @Scope(value="request", proxyMode=ScopedProxyMode.TARGET_CLASS), how does the
    injected proxy resolve the correct target on each call?
  options:
  - It captures the bean from the very first request and permanently caches that instance, reusing it
    for every subsequent request regardless of which request context is currently active
  - It constructs a brand-new target bean on every single method call, bypassing the request scope
    entirely and behaving exactly as if the bean were declared prototype-scoped
  - It is a CGLIB subclass proxy that, per invocation, looks up the current scope's target instance
    (via the registered Scope) and delegates to it
  - It throws an exception whenever invoked outside an active web request, since the proxy itself
    cannot be constructed or injected until a live request context is present in the container
  answer: 2
  explanation: |
    A TARGET_CLASS scoped proxy is a CGLIB subclass that, on each method call, asks the
    registered Scope (e.g., request scope) for the current context's target and delegates
    to it — so the singleton holds a stable proxy while the real target varies per scope.
  ref: concepts.md#scoped-beans-and-proxy-injection
- id: ioc-container-applicationcontext-vs-beanfactory-077
  difficulty: advanced
  tags:
  - beanfactory
  - lazy
  - fail-fast
  - trade-off
  question: |
    A team switches a batch tool from AnnotationConfigApplicationContext to a manually
    wired DefaultListableBeanFactory to shave startup memory. A typo in a bean's required
    property now goes unnoticed until production. What container behavior explains the
    regression?
  options:
  - The BeanFactory did validate the property against the bean definition at registration time but
    deliberately suppressed the resulting error to keep its startup footprint minimal
  - The typo would have been caught at compile time under ApplicationContext, because that container
    type-checks every property name against the bean class during annotation processing
  - DefaultListableBeanFactory is unable to hold property values at all, so the mistyped property was
    silently dropped from the definition before the bean was ever created
  - A plain BeanFactory initializes singletons lazily on first getBean, so it lost the
    ApplicationContext's eager, fail-fast validation at startup
  answer: 3
  explanation: |
    ApplicationContext eagerly creates non-lazy singletons at refresh(), catching such
    errors at startup. A plain BeanFactory defers creation to first getBean, so the
    misconfiguration surfaces only when the affected bean is first accessed — potentially
    in production.
  ref: concepts.md#when-a-plain-beanfactory-would-ever-be-used
- id: ioc-container-applicationcontext-vs-beanfactory-078
  difficulty: expert
  tags:
  - smartinitializingsingleton
  - lifecycle
  - callbacks
  question: |
    You need a callback that runs AFTER all singletons in the context have been eagerly
    instantiated (e.g., to build an index over every bean of a type), still during
    refresh(). Which mechanism fits best?
  options:
  - InitializingBean.afterPropertiesSet(), which the container defers until every bean in the context
    exists, including lazily created ones, and then invokes once per bean as a whole-context callback
  - SmartInitializingSingleton.afterSingletonsInstantiated(), invoked at the end of
    preInstantiateSingletons() once all non-lazy singletons exist
  - A BeanFactoryPostProcessor, which runs after all singletons are fully instantiated and so can
    safely iterate over every ready bean instance to build the cross-bean index
  - A @PreDestroy method, which the container invokes once immediately after the last singleton is
    created so late callbacks can index every bean before the context is handed to callers
  answer: 1
  explanation: |
    afterPropertiesSet()/@PostConstruct fire during each individual bean's init, when
    other beans may not yet exist. SmartInitializingSingleton.afterSingletonsInstantiated()
    is called once, after all non-lazy singletons have been created at the end of
    preInstantiateSingletons(), which is exactly when a cross-bean index can be built.
  ref: concepts.md#container-startup-and-the-refresh-method
