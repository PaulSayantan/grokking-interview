topic: "Testing Spring Applications"
domain: spring-core
topic_slug: testing-spring-applications
version: 1
questions:
  - id: testing-spring-applications-001
    difficulty: beginner
    tags: [spring-test, module, dependency]
    question: |
      Which artifact provides Spring's core testing support, including the Spring TestContext Framework?
    options:
      - "spring-boot-starter-test"
      - "spring-context-support"
      - "junit-jupiter-engine"
      - "spring-test"
    answer: 3
    explanation: |
      The `spring-test` module (org.springframework:spring-test) contains the Spring TestContext
      Framework, MockMvc, servlet mocks, and related testing utilities. It is part of core Spring and
      independent of Spring Boot; spring-boot-starter-test is a Boot convenience that pulls it in.
    ref: "concepts.md#spring-test-module"

  - id: testing-spring-applications-002
    difficulty: beginner
    tags: [spring-test, testcontext, runner]
    question: |
      The Spring TestContext Framework is described as "agnostic to the test runner." What does this mean?
    options:
      - "It integrates with JUnit 4, JUnit 5 (Jupiter), and TestNG"
      - "It can only be used with JUnit 5"
      - "It replaces the need for any test runner"
      - "It requires Spring Boot to select a runner"
    answer: 0
    explanation: |
      The TestContext Framework is independent of the underlying test framework and integrates with
      JUnit 4 (SpringRunner), JUnit 5 Jupiter (SpringExtension), and TestNG. It provides context
      management, DI, transactions, and profiles regardless of the runner.
    ref: "concepts.md#spring-test-module"

  - id: testing-spring-applications-003
    difficulty: beginner
    tags: [spring-test, mockito, bundling]
    question: |
      Does the spring-test module bundle a mocking library like Mockito and the JUnit test engine?
    options:
      - "Yes, both Mockito and JUnit are included in spring-test"
      - "Yes, but only Mockito"
      - "No, Spring provides its own mocking framework instead of Mockito"
      - "No, you add Mockito and a JUnit engine as separate dependencies"
    answer: 3
    explanation: |
      spring-test provides the TestContext Framework and MockMvc, but you pull in Mockito and a JUnit
      (or TestNG) engine separately. Spring integrates with these libraries rather than bundling or
      replacing them.
    ref: "concepts.md#spring-test-module"

  - id: testing-spring-applications-004
    difficulty: intermediate
    tags: [spring-test, jakarta, namespace]
    question: |
      Which namespace does Spring Framework 6.x use for the servlet/EE APIs (relevant to its test mocks)?
    options:
      - "jakarta.*"
      - "javax.*"
      - "org.springframework.ee.*"
      - "spring.servlet.*"
    answer: 0
    explanation: |
      Spring Framework 6.x runs on Jakarta EE and uses the `jakarta.*` namespace, whereas Spring 5.x
      and earlier used `javax.*`. This affects servlet mocks and any EE APIs referenced in tests.
    ref: "concepts.md#spring-test-module"

  - id: testing-spring-applications-005
    difficulty: beginner
    tags: [context-configuration, config-source]
    question: |
      What is the primary purpose of the @ContextConfiguration annotation on an integration test?
    options:
      - "To roll back the database after each test"
      - "To create Mockito mocks for the test"
      - "To declare which configuration (component classes or XML locations) to load into the ApplicationContext"
      - "To start an embedded web server"
    answer: 2
    explanation: |
      @ContextConfiguration tells the TestContext Framework which configuration to load — via
      `classes = ...` (component/@Configuration classes) or `locations = ...` (XML/Groovy resources).
    ref: "concepts.md#contextconfiguration-and-springjunitconfig"

  - id: testing-spring-applications-006
    difficulty: intermediate
    tags: [springjunitconfig, composed-annotation]
    question: |
      @SpringJUnitConfig is a composed annotation equivalent to which combination?
    options:
      - "@ExtendWith(SpringExtension.class) + @ContextConfiguration"
      - "@ExtendWith(MockitoExtension.class) + @ContextConfiguration"
      - "@RunWith(SpringRunner.class) + @WebAppConfiguration"
      - "@SpringBootTest + @Transactional"
    answer: 0
    explanation: |
      @SpringJUnitConfig combines @ExtendWith(SpringExtension.class) and @ContextConfiguration into a
      single JUnit 5 annotation, so you don't have to declare both separately.
    ref: "concepts.md#contextconfiguration-and-springjunitconfig"

  - id: testing-spring-applications-007
    difficulty: intermediate
    tags: [springjunitwebconfig, web]
    question: |
      How does @SpringJUnitWebConfig differ from @SpringJUnitConfig?
    options:
      - "It additionally applies @WebAppConfiguration to load a WebApplicationContext"
      - "It disables the SpringExtension"
      - "It forces every test method to commit its transaction"
      - "It only works with the reactive WebFlux stack"
    answer: 0
    explanation: |
      @SpringJUnitWebConfig is @SpringJUnitConfig plus @WebAppConfiguration, so it loads a
      WebApplicationContext (with a MockServletContext) suitable for web-layer integration tests.
    ref: "concepts.md#contextconfiguration-and-springjunitconfig"

  - id: testing-spring-applications-008
    difficulty: intermediate
    tags: [context-configuration, junit5, extension]
    question: |
      On JUnit 5, if you use a bare @ContextConfiguration (not the composed @SpringJUnitConfig), what
      else must you add for the TestContext Framework to participate?
    options:
      - "@RunWith(SpringRunner.class)"
      - "@EnableAutoConfiguration"
      - "Nothing; @ContextConfiguration activates it by itself"
      - "@ExtendWith(SpringExtension.class)"
    answer: 3
    explanation: |
      With bare @ContextConfiguration on JUnit 5 you must register the SpringExtension via
      @ExtendWith(SpringExtension.class). @SpringJUnitConfig already composes that in for you.
    ref: "concepts.md#contextconfiguration-and-springjunitconfig"

  - id: testing-spring-applications-009
    difficulty: intermediate
    tags: [context-configuration, nested-config]
    question: |
      If @SpringJUnitConfig is used without specifying `classes` or `locations`, what does Spring do by default?
    options:
      - "Throws an error because configuration is required"
      - "Loads the entire classpath as configuration"
      - "Looks for a static nested @Configuration class inside the test class"
      - "Falls back to Spring Boot auto-configuration"
    answer: 2
    explanation: |
      When no explicit config source is given, the TestContext Framework auto-detects a static nested
      @Configuration class declared within the test class and uses it as the configuration.
    ref: "concepts.md#contextconfiguration-and-springjunitconfig"

  - id: testing-spring-applications-010
    difficulty: intermediate
    tags: [context-configuration, junit4]
    question: |
      What is the JUnit 4 equivalent for activating the Spring TestContext Framework?
    options:
      - "@ExtendWith(SpringExtension.class)"
      - "@SpringJUnitConfig"
      - "@RunWith(SpringRunner.class)"
      - "@TestExecutionListeners"
    answer: 2
    explanation: |
      On JUnit 4 you use @RunWith(SpringRunner.class) (an alias for SpringJUnit4ClassRunner) together
      with @ContextConfiguration. The JUnit 5 counterpart is @ExtendWith(SpringExtension.class).
    ref: "concepts.md#contextconfiguration-and-springjunitconfig"

  - id: testing-spring-applications-011
    difficulty: beginner
    tags: [caching, performance]
    question: |
      Why does the Spring TestContext Framework cache the ApplicationContext across tests?
    options:
      - "To guarantee each test gets a brand-new context"
      - "To roll back the database automatically"
      - "Because JUnit requires a shared context"
      - "Because loading a context is expensive, so it is built once and reused across matching tests"
    answer: 3
    explanation: |
      Building a context (scanning, bean instantiation, connection pools) is costly, so the framework
      builds it once and reuses it across all tests that request an equivalent configuration, greatly
      speeding up the suite.
    ref: "concepts.md#loading-and-caching-the-application-context-across-tests"

  - id: testing-spring-applications-012
    difficulty: intermediate
    tags: [caching, cache-key]
    question: |
      Two test classes will SHARE the same cached ApplicationContext when which condition holds?
    options:
      - "They are in the same package"
      - "They both extend the same base class"
      - "They declare the same combination of context-defining attributes (classes/locations, profiles, property sources, etc.)"
      - "They run within the same test method"
    answer: 2
    explanation: |
      The context cache is keyed by the attributes that define the context — config classes/locations,
      initializers, active profiles, test property sources, the ContextLoader, etc. Identical
      combinations share one cached context; any difference produces a separate one.
    ref: "concepts.md#loading-and-caching-the-application-context-across-tests"

  - id: testing-spring-applications-013
    difficulty: intermediate
    tags: [caching, dirties-context]
    question: |
      What does @DirtiesContext do?
    options:
      - "Marks the context as invalid so it is removed from the cache and closed"
      - "Forces every bean to be a prototype"
      - "Rolls back the current transaction"
      - "Disables dependency injection for the test"
    answer: 0
    explanation: |
      @DirtiesContext signals that a test mutated the context, so the framework evicts it from the
      cache and closes it. The next matching test then rebuilds the context, so it should be used
      sparingly to preserve caching benefits.
    ref: "concepts.md#loading-and-caching-the-application-context-across-tests"

  - id: testing-spring-applications-014
    difficulty: intermediate
    tags: [caching, max-size]
    question: |
      What is the default maximum number of contexts held by the TestContext cache (with LRU eviction)?
    options:
      - "1"
      - "8"
      - "32"
      - "unlimited"
    answer: 2
    explanation: |
      By default the context cache holds up to 32 contexts using LRU eviction, configurable via the
      `spring.test.context.cache.maxSize` SpringProperties/JVM setting.
    ref: "concepts.md#loading-and-caching-the-application-context-across-tests"

  - id: testing-spring-applications-015
    difficulty: intermediate
    tags: [caching, profiles, ordering]
    question: |
      Do @ActiveProfiles({"a","b"}) and @ActiveProfiles({"b","a"}) produce different cached contexts?
    options:
      - "Yes, profile order always creates distinct contexts"
      - "Yes, but only on JUnit 4"
      - "No, because profiles are ignored in the cache key"
      - "No, Spring normalizes/sorts the profile names so they are treated as the same context"
    answer: 3
    explanation: |
      Active profiles are part of the cache key, but Spring sorts the profile names when computing it,
      so {"a","b"} and {"b","a"} are order-independent and resolve to the same cached context.
    ref: "concepts.md#loading-and-caching-the-application-context-across-tests"

  - id: testing-spring-applications-016
    difficulty: intermediate
    tags: [caching, slow-suite]
    question: |
      A team notices their integration suite is slow despite context caching. Which is the MOST likely cause?
    options:
      - "Too many distinct context configurations (varying profiles/property sources/mock beans) and overuse of @DirtiesContext"
      - "Using @Autowired instead of constructor injection"
      - "Running tests on JUnit 5 instead of JUnit 4"
      - "Declaring @Test on every method"
    answer: 0
    explanation: |
      Each distinct configuration combination creates a separate context, and every @DirtiesContext
      forces a rebuild. Gratuitously varying profiles, property sources, or mock-bean sets multiplies
      the number of contexts and defeats caching.
    ref: "concepts.md#loading-and-caching-the-application-context-across-tests"

  - id: testing-spring-applications-017
    difficulty: beginner
    tags: [mock, mockito]
    question: |
      Where does the @Mock annotation come from, and does it register a Spring bean?
    options:
      - "From Spring; it registers a mock bean in the context"
      - "From JUnit; it replaces a bean in the context"
      - "From Mockito; it creates a standalone mock that is NOT a Spring bean"
      - "From Spring Boot; it starts an embedded server"
    answer: 2
    explanation: |
      @Mock is a Mockito annotation that creates a standalone mock object. It has nothing to do with the
      Spring container — the mock is not registered as a bean nor injected into other Spring beans.
    ref: "concepts.md#mockbean-and-mock-and-how-they-differ"

  - id: testing-spring-applications-018
    difficulty: intermediate
    tags: [mockbean, context]
    question: |
      What does Spring Boot's @MockBean do that @Mock does not?
    options:
      - "It creates a mock without needing Mockito"
      - "It disables the Spring context"
      - "It rolls back the transaction after the test"
      - "It creates a Mockito mock AND registers/replaces it as a bean in the ApplicationContext"
    answer: 3
    explanation: |
      @MockBean creates a Mockito mock and registers it into the loaded ApplicationContext, replacing
      any existing bean of that type, so other beans receive the mock via DI. It requires a Spring
      context; @Mock is just a bare mock.
    ref: "concepts.md#mockbean-and-mock-and-how-they-differ"

  - id: testing-spring-applications-019
    difficulty: intermediate
    tags: [mock, injectmocks, unit-test]
    question: |
      In a pure Mockito unit test, which annotation typically constructs the class-under-test and injects the @Mock collaborators?
    options:
      - "@Autowired"
      - "@MockBean"
      - "@InjectMocks"
      - "@ContextConfiguration"
    answer: 2
    explanation: |
      @InjectMocks (Mockito) instantiates the class under test and injects the declared @Mock objects
      into it — no Spring container involved. This is the standard pattern for context-free unit tests.
    ref: "concepts.md#mockbean-and-mock-and-how-they-differ"

  - id: testing-spring-applications-020
    difficulty: intermediate
    tags: [mockbean, cache-key]
    question: |
      How do @MockBean definitions relate to the context cache?
    options:
      - "They are ignored by the cache"
      - "They always force a brand-new context per method"
      - "They disable caching entirely"
      - "They participate in the context cache key, so tests with different mock-bean sets get different contexts"
    answer: 3
    explanation: |
      Because @MockBean changes the bean definitions, it participates in the cache key. Tests declaring
      different sets of @MockBean end up with different cached contexts.
    ref: "concepts.md#mockbean-and-mock-and-how-they-differ"

  - id: testing-spring-applications-021
    difficulty: intermediate
    tags: [mockitobean, spring-6.2, framework]
    question: |
      Which core Spring Framework 6.2 annotation is the framework's own equivalent of Boot's @MockBean?
    options:
      - "@MockitoBean"
      - "@MockBean"
      - "@SpyBean"
      - "@TestConfiguration"
    answer: 0
    explanation: |
      Spring Framework 6.2 introduced bean-override annotations in core spring-test, including
      @MockitoBean (and @MockitoSpyBean, @TestBean). @MockitoBean replaces a context bean with a mock,
      superseding Boot's @MockBean going forward.
    ref: "concepts.md#mockbean-and-mock-and-how-they-differ"

  - id: testing-spring-applications-022
    difficulty: beginner
    tags: [mock, unit-vs-integration]
    question: |
      Which annotation is appropriate for a fast unit test that uses NO Spring container?
    options:
      - "@MockBean"
      - "@MockitoBean"
      - "@SpringJUnitConfig"
      - "@Mock"
    answer: 3
    explanation: |
      @Mock is the right choice for context-free unit tests — it produces a bare Mockito mock without
      loading any ApplicationContext. @MockBean/@MockitoBean require a Spring context.
    ref: "concepts.md#mockbean-and-mock-and-how-they-differ"

  - id: testing-spring-applications-023
    difficulty: beginner
    tags: [mockmvc, web]
    question: |
      What does MockMvc let you do?
    options:
      - "Exercise Spring MVC controllers through the DispatcherServlet without a running servlet container"
      - "Start a real Tomcat server on a random port"
      - "Mock the database layer only"
      - "Generate load-test traffic against a deployed endpoint"
    answer: 0
    explanation: |
      MockMvc drives controllers through the full MVC infrastructure (DispatcherServlet, handler
      mapping, converters, advice) in-process, without starting a real servlet container or opening a
      network socket.
    ref: "concepts.md#mockmvc-for-web-layer-tests"

  - id: testing-spring-applications-024
    difficulty: intermediate
    tags: [mockmvc, standalone]
    question: |
      What characterizes MockMvcBuilders.standaloneSetup(...)?
    options:
      - "It requires a fully loaded WebApplicationContext"
      - "It starts an embedded server"
      - "It registers specific controller instances directly, without needing a Spring context"
      - "It can only test reactive WebFlux controllers"
    answer: 2
    explanation: |
      standaloneSetup registers the given controller instance(s) with the minimal MVC infrastructure
      and does not require a Spring context — you supply collaborators yourself. It's ideal for focused,
      unit-like controller tests.
    ref: "concepts.md#mockmvc-for-web-layer-tests"

  - id: testing-spring-applications-025
    difficulty: intermediate
    tags: [mockmvc, webappcontext]
    question: |
      When would you build MockMvc via MockMvcBuilders.webAppContextSetup(wac)?
    options:
      - "When you want your real MVC beans, filters, and @ControllerAdvice to participate (integration flavour)"
      - "When you want to avoid loading any Spring context"
      - "When testing a plain POJO service"
      - "When you need to open a real HTTP socket"
    answer: 0
    explanation: |
      webAppContextSetup builds MockMvc from a loaded WebApplicationContext so all real MVC beans,
      filters, and advice participate — the integration-style setup. standaloneSetup is the
      context-free alternative.
    ref: "concepts.md#mockmvc-for-web-layer-tests"

  - id: testing-spring-applications-026
    difficulty: beginner
    tags: [mockmvc, fluent-api]
    question: |
      In the MockMvc fluent API, which call performs assertions on the result of a request?
    options:
      - "perform(...)"
      - "build()"
      - "param(...)"
      - "andExpect(...)"
    answer: 3
    explanation: |
      After perform(requestBuilder) returns ResultActions, you chain .andExpect(matcher) to assert on
      status, content, headers, JSON paths, etc. Matchers come from MockMvcResultMatchers.
    ref: "concepts.md#mockmvc-for-web-layer-tests"

  - id: testing-spring-applications-027
    difficulty: intermediate
    tags: [mockmvc, webflux, webtestclient]
    question: |
      For testing the reactive WebFlux stack, which tool is the analogue of MockMvc?
    options:
      - "MockMvc still applies to WebFlux"
      - "TestRestTemplate"
      - "MockRestServiceServer"
      - "WebTestClient"
    answer: 3
    explanation: |
      MockMvc targets the servlet (Spring MVC) stack. For the reactive WebFlux stack, WebTestClient is
      the equivalent server-side test client.
    ref: "concepts.md#mockmvc-for-web-layer-tests"

  - id: testing-spring-applications-028
    difficulty: intermediate
    tags: [mockmvc, framework-vs-boot]
    question: |
      Which statement about MockMvc and Spring Boot's @WebMvcTest is correct?
    options:
      - "@WebMvcTest is core spring-test; MockMvc is Spring Boot only"
      - "MockMvc is core spring-test; @WebMvcTest is a Spring Boot slice that auto-configures MockMvc"
      - "Both are Spring Boot only"
      - "Both are core spring-test with no Boot involvement"
    answer: 1
    explanation: |
      MockMvc and @WebAppConfiguration are core spring-test primitives. @WebMvcTest and
      @AutoConfigureMockMvc are Spring Boot conveniences that auto-configure MockMvc and load only the
      web layer, layered on top of the same MockMvc primitive.
    ref: "concepts.md#mockmvc-for-web-layer-tests"

  - id: testing-spring-applications-029
    difficulty: beginner
    tags: [transactional, rollback]
    question: |
      What is the default behaviour when a test method is annotated with @Transactional?
    options:
      - "The transaction commits after the method"
      - "The transaction is rolled back after the method by default"
      - "No transaction is started"
      - "The test fails unless you call commit() manually"
    answer: 1
    explanation: |
      For tests, the TransactionalTestExecutionListener rolls back the transaction at the end of each
      test method by default, keeping the database clean between tests. This differs from production
      beans, which commit on success.
    ref: "concepts.md#transactional-test-rollback"

  - id: testing-spring-applications-030
    difficulty: intermediate
    tags: [transactional, commit]
    question: |
      Which annotation makes a @Transactional test method actually COMMIT instead of rolling back?
    options:
      - "@Rollback(true)"
      - "@Commit"
      - "@DirtiesContext"
      - "@AfterTransaction"
    answer: 1
    explanation: |
      @Commit (or the older @Rollback(false)) overrides the default rollback so the test's transaction
      is committed. @Rollback(true) is the explicit form of the default rollback behaviour.
    ref: "concepts.md#transactional-test-rollback"

  - id: testing-spring-applications-031
    difficulty: intermediate
    tags: [transactional, requirement]
    question: |
      For @Transactional test rollback to work, what must be present in the ApplicationContext?
    options:
      - "An embedded web server"
      - "A @MockBean of the repository"
      - "The SpringBootTest bootstrapper"
      - "A PlatformTransactionManager bean"
    answer: 3
    explanation: |
      A PlatformTransactionManager bean must exist for transactional tests. If several are present, you
      select one with @Transactional(transactionManager = "...").
    ref: "concepts.md#transactional-test-rollback"

  - id: testing-spring-applications-032
    difficulty: intermediate
    tags: [transactional, before-transaction]
    question: |
      What is the purpose of @BeforeTransaction and @AfterTransaction methods in a transactional test?
    options:
      - "They run inside the test's transaction to modify data"
      - "They replace @BeforeEach and @AfterEach entirely"
      - "They run outside the test's transaction boundary, e.g. to set up or verify data separately"
      - "They force the context to be rebuilt"
    answer: 2
    explanation: |
      @BeforeTransaction and @AfterTransaction mark methods that run outside the test method's
      transaction boundary — useful for setup or verification that must occur in its own transaction.
    ref: "concepts.md#transactional-test-rollback"

  - id: testing-spring-applications-033
    difficulty: intermediate
    tags: [transactional, flush, gotcha]
    question: |
      Why might a @Transactional test pass even though the data was never truly persisted?
    options:
      - "Because rollback happens and changes may never be flushed, so constraint/ID behaviour isn't exercised"
      - "Because @Transactional disables assertions"
      - "Because the context cache stores stale data"
      - "Because MockMvc intercepts the database calls"
    answer: 0
    explanation: |
      Since everything runs in one rolled-back transaction, entities may never be flushed/committed, so
      constraints and ID generation aren't truly exercised. Force EntityManager.flush() or use @Commit
      when you need to verify real persistence.
    ref: "concepts.md#transactional-test-rollback"

  - id: testing-spring-applications-034
    difficulty: beginner
    tags: [active-profiles, profiles]
    question: |
      What does @ActiveProfiles declare for a test?
    options:
      - "Which bean-definition profiles are active when the test's ApplicationContext is loaded"
      - "Which test methods to run first"
      - "Which mock beans to create"
      - "Whether the transaction commits or rolls back"
    answer: 0
    explanation: |
      @ActiveProfiles sets the active bean-definition profiles for the test context, so beans guarded
      by @Profile are included/excluded accordingly. It is the test-time counterpart of setting
      spring.profiles.active.
    ref: "concepts.md#profiles-in-tests-with-activeprofiles"

  - id: testing-spring-applications-035
    difficulty: intermediate
    tags: [active-profiles, inherit]
    question: |
      What does @ActiveProfiles(inheritProfiles = false) do?
    options:
      - "Disables all profiles for the test"
      - "Forces the parent context to be reloaded"
      - "Prevents a subclass from inheriting the superclass's active profiles"
      - "Makes profiles case-insensitive"
    answer: 2
    explanation: |
      By default (inheritProfiles = true) a subclass inherits the superclass's profiles. Setting it to
      false stops that inheritance so only the subclass's declared profiles apply.
    ref: "concepts.md#profiles-in-tests-with-activeprofiles"

  - id: testing-spring-applications-036
    difficulty: intermediate
    tags: [active-profiles, resolver]
    question: |
      How can you activate profiles dynamically/programmatically for a test (e.g. based on an env var)?
    options:
      - "Use @DirtiesContext"
      - "Use @Commit"
      - "Profiles cannot be resolved dynamically"
      - "Use @ActiveProfiles with an ActiveProfilesResolver via the resolver attribute"
    answer: 3
    explanation: |
      Implement ActiveProfilesResolver and reference it with @ActiveProfiles(resolver = MyResolver.class)
      to compute the active profiles programmatically at runtime.
    ref: "concepts.md#profiles-in-tests-with-activeprofiles"

  - id: testing-spring-applications-037
    difficulty: intermediate
    tags: [active-profiles, test-property-source]
    question: |
      Which annotation complements @ActiveProfiles to override individual property values for a test?
    options:
      - "@DirtiesContext"
      - "@TestPropertySource"
      - "@WebAppConfiguration"
      - "@Rollback"
    answer: 1
    explanation: |
      @TestPropertySource lets you supply property file locations or inlined properties for the test
      context, complementing @ActiveProfiles which selects the active bean profiles.
    ref: "concepts.md#profiles-in-tests-with-activeprofiles"

  - id: testing-spring-applications-038
    difficulty: beginner
    tags: [unit-vs-integration, definition]
    question: |
      What is the defining difference between a Spring unit test and an integration test?
    options:
      - "Unit tests use JUnit 5 and integration tests use JUnit 4"
      - "Unit tests always use a database; integration tests never do"
      - "A unit test loads NO Spring context, while an integration test boots an ApplicationContext"
      - "Integration tests cannot use mocks"
    answer: 2
    explanation: |
      A unit test uses no Spring container — you `new` the class and inject mocks. An integration test
      boots an ApplicationContext (via the TestContext Framework) to exercise wiring, AOP, transactions,
      and I/O.
    ref: "concepts.md#unit-test-versus-integration-test"

  - id: testing-spring-applications-039
    difficulty: intermediate
    tags: [unit-vs-integration, guidance]
    question: |
      Which is the recommended balance according to the "test pyramid" guidance?
    options:
      - "Mostly integration tests, a few unit tests"
      - "A broad base of fast unit tests with a focused layer of integration tests"
      - "Only integration tests, since they are more realistic"
      - "Equal numbers of every kind, always"
    answer: 1
    explanation: |
      Integration tests are slower and more brittle, so a healthy suite is a broad base of unit tests
      covering logic with a focused set of integration tests verifying wiring, transactions, and I/O.
    ref: "concepts.md#unit-test-versus-integration-test"

  - id: testing-spring-applications-040
    difficulty: intermediate
    tags: [unit-vs-integration, subtle]
    question: |
      A "small" test class is annotated with @ExtendWith(SpringExtension.class) and @ContextConfiguration and injects real beans. How should it be classified?
    options:
      - "A unit test, because it is small"
      - "Neither; it is a mock test"
      - "A slice test that requires Spring Boot"
      - "An integration test, because it boots and pays for a Spring container"
    answer: 3
    explanation: |
      Loading a context and injecting real beans makes it an integration test regardless of size — you
      are paying for the container. A true unit test uses no Spring context at all.
    ref: "concepts.md#unit-test-versus-integration-test"

  - id: testing-spring-applications-041
    difficulty: beginner
    tags: [springboottest, boot, contrast]
    question: |
      Which statement about @SpringBootTest is correct?
    options:
      - "It is part of the core spring-test module"
      - "It is a Spring Boot annotation that bootstraps the context with auto-configuration and config discovery"
      - "It disables the Spring container"
      - "It is only used for unit tests"
    answer: 1
    explanation: |
      @SpringBootTest lives in Spring Boot (org.springframework.boot.test.context), not core spring-test.
      It uses Boot's bootstrapper, discovers @SpringBootConfiguration, and applies auto-configuration.
    ref: "concepts.md#springboottest-as-a-boot-slice-contrasted"

  - id: testing-spring-applications-042
    difficulty: intermediate
    tags: [springboottest, core-equivalent]
    question: |
      In a NON-Boot Spring project, what is the core-framework way to write an integration test equivalent to @SpringBootTest?
    options:
      - "Use @SpringJUnitConfig / @ContextConfiguration with explicit configuration classes"
      - "Use @SpringBootTest anyway"
      - "You cannot write integration tests without Spring Boot"
      - "Use @Mock and @InjectMocks only"
    answer: 0
    explanation: |
      Core Spring uses @SpringJUnitConfig / @ContextConfiguration where you name the config explicitly
      (no auto-configuration or main-class discovery). MockMvc is wired by hand and rollback via
      @Transactional.
    ref: "concepts.md#springboottest-as-a-boot-slice-contrasted"

  - id: testing-spring-applications-043
    difficulty: intermediate
    tags: [springboottest, slices]
    question: |
      Which of these is a Spring Boot "slice" test annotation that loads only part of the application?
    options:
      - "@ContextConfiguration"
      - "@SpringJUnitConfig"
      - "@ActiveProfiles"
      - "@WebMvcTest"
    answer: 3
    explanation: |
      @WebMvcTest is a Boot slice that loads only the web layer and auto-configures MockMvc. Others like
      @DataJpaTest, @JsonTest are also slices. @ContextConfiguration and @SpringJUnitConfig are core
      framework annotations.
    ref: "concepts.md#springboottest-as-a-boot-slice-contrasted"

  - id: testing-spring-applications-044
    difficulty: intermediate
    tags: [springboottest, web-environment]
    question: |
      How do you make @SpringBootTest start an embedded server on a random port for real HTTP tests?
    options:
      - "@SpringBootTest(webEnvironment = WebEnvironment.RANDOM_PORT)"
      - "@WebAppConfiguration"
      - "@SpringJUnitWebConfig"
      - "@Transactional(readOnly = false)"
    answer: 0
    explanation: |
      @SpringBootTest(webEnvironment = RANDOM_PORT) (or DEFINED_PORT) starts an embedded server so you
      can make real HTTP calls with TestRestTemplate/WebTestClient. Core spring-test has no built-in
      embedded-server support.
    ref: "concepts.md#springboottest-as-a-boot-slice-contrasted"

  - id: testing-spring-applications-045
    difficulty: beginner
    tags: [springboottest, config-discovery]
    question: |
      A key contrast: how does core Spring find configuration for an integration test versus Spring Boot?
    options:
      - "Core Spring auto-discovers a main class; Boot requires explicit classes"
      - "Core Spring requires explicit classes/locations (or a nested @Configuration); Boot auto-discovers @SpringBootConfiguration"
      - "Both auto-discover configuration identically"
      - "Neither needs any configuration source"
    answer: 1
    explanation: |
      In core Spring you name the config explicitly via classes/locations (or rely on a nested
      @Configuration). Spring Boot instead searches upward for @SpringBootConfiguration (your
      @SpringBootApplication) and applies auto-configuration.
    ref: "concepts.md#springboottest-as-a-boot-slice-contrasted"

  - id: testing-spring-applications-046
    difficulty: expert
    tags: [testexecutionlisteners, ordering, defaults]
    question: |
      A developer adds a custom listener to capture metrics with @TestExecutionListeners(AuditListener.class)
      on a test class. Afterwards @Autowired fields are null, @Transactional no longer rolls back, and @Sql
      scripts don't run. What happened and what is the correct fix?
    options:
      - "A bare @TestExecutionListeners REPLACES the default listener set, so DependencyInjection/Transactional/SqlScripts listeners are gone; add mergeMode = MergeMode.MERGE_WITH_DEFAULTS"
      - "Custom listeners always run before defaults and consume the test instance; annotate AuditListener with @Order(Integer.MAX_VALUE)"
      - "@Autowired stopped working because the SpringExtension was disabled by the annotation; re-add @ExtendWith(SpringExtension.class)"
      - "The context cache evicted the context; add @DirtiesContext(classMode = AFTER_CLASS) to force a fresh load"
    answer: 0
    explanation: |
      By default declaring any listener via @TestExecutionListeners switches OFF the framework defaults
      (DependencyInjectionTestExecutionListener, TransactionalTestExecutionListener,
      SqlScriptsTestExecutionListener, etc.), so DI, rollback, and @Sql silently stop. The fix is
      mergeMode = MergeMode.MERGE_WITH_DEFAULTS, which merges the custom listener with the defaults and
      re-sorts by AnnotationAwareOrderComparator.
    ref: "concepts.md#testexecutionlisteners-and-execution-order"

  - id: testing-spring-applications-047
    difficulty: expert
    tags: [testexecutionlisteners, ordering, dependency-injection]
    question: |
      Relative to the default TestExecutionListener ordering, when is @Autowired dependency injection into
      the test instance performed versus when the test's transaction is started?
    options:
      - "Transaction is started at prepareTestInstance, injection happens later at beforeTestMethod"
      - "Both happen simultaneously inside a single combined callback so ordering is undefined"
      - "DependencyInjectionTestExecutionListener injects during prepareTestInstance/beforeTestMethod BEFORE TransactionalTestExecutionListener opens the transaction, because DI is ordered ahead of the transactional listener"
      - "Injection is skipped entirely for transactional tests; beans are resolved lazily on first access"
    answer: 2
    explanation: |
      DependencyInjectionTestExecutionListener is ordered ahead of TransactionalTestExecutionListener, so
      the test instance is populated with dependencies before the transactional listener opens the test
      transaction at beforeTestMethod. This ordering is why injected repositories are ready when the
      transaction begins.
    ref: "concepts.md#testexecutionlisteners-and-execution-order"

  - id: testing-spring-applications-048
    difficulty: advanced
    tags: [testexecutionlisteners, discovery, spring-factories]
    question: |
      How are the DEFAULT TestExecutionListeners discovered and ordered by the framework?
    options:
      - "They are discovered via SpringFactoriesLoader (spring.factories) and sorted by AnnotationAwareOrderComparator honoring Ordered/@Order"
      - "They are hard-coded in the SpringExtension in a fixed array and cannot be reordered"
      - "They are scanned as @Component beans from the loaded ApplicationContext"
      - "They are read alphabetically from the org.springframework.test.context package"
    answer: 0
    explanation: |
      Default listeners are registered through SpringFactoriesLoader under the
      org.springframework.test.context.TestExecutionListener key in spring.factories, then sorted by
      AnnotationAwareOrderComparator (which honors the Ordered interface and @Order). This is also how
      third-party libraries (Boot, Spring Security) contribute listeners automatically.
    ref: "concepts.md#testexecutionlisteners-and-execution-order"

  - id: testing-spring-applications-049
    difficulty: advanced
    tags: [mockito, reset, listener, caching]
    question: |
      Why does the framework need a MockitoResetTestExecutionListener that resets @MockitoBean mocks after
      each test method?
    options:
      - "Because Mockito mocks are not thread-safe and must be recreated per thread"
      - "Because @MockitoBean mocks are prototype-scoped and get garbage collected otherwise"
      - "Because resetting is required to make the mock visible to @Autowired fields"
      - "Because the ApplicationContext (and thus the mock instances) is cached and reused across methods, so stubbing/verification state would leak into later methods without a reset"
    answer: 3
    explanation: |
      The context is cached and shared, meaning the same mock instances persist across test methods. Without
      resetting them after each method (default MockReset.AFTER), stubbing and interaction state from one
      test would leak into the next, causing flaky order-dependent failures.
    ref: "concepts.md#bean-override-internals-with-testbean-mockitobean-and-mockitospybean"

  - id: testing-spring-applications-050
    difficulty: expert
    tags: [mockitobean, mockitospybean, strategy]
    question: |
      A test declares @MockitoSpyBean PaymentGateway gateway, but the context defines no PaymentGateway bean.
      Contrast this with @MockitoBean PaymentGateway gateway in the same situation.
    options:
      - "@MockitoSpyBean fails because WRAP requires exactly one existing candidate to wrap; @MockitoBean succeeds because REPLACE_OR_CREATE creates a new mock bean when none exists"
      - "Both create a new bean automatically since bean overrides use REPLACE_OR_CREATE"
      - "Both fail; bean override annotations always require an existing bean unless enforceOverride=false"
      - "@MockitoSpyBean succeeds by creating an empty spy; @MockitoBean fails because it defaults to REPLACE"
    answer: 0
    explanation: |
      @MockitoSpyBean uses the WRAP strategy, which wraps an existing instance and therefore requires
      exactly one candidate bean — it fails if none exists. @MockitoBean uses REPLACE_OR_CREATE, so it
      creates a brand-new mock bean when no matching bean is present (unless enforceOverride=true switches
      it to strict REPLACE).
    ref: "concepts.md#bean-override-internals-with-testbean-mockitobean-and-mockitospybean"

  - id: testing-spring-applications-051
    difficulty: advanced
    tags: [testbean, factory-method, convention]
    question: |
      For a field annotated with a bare @TestBean of type CustomService, what must the accompanying factory
      method look like by default?
    options:
      - "A static, no-argument method named customService() returning a CustomService-compatible type"
      - "An instance method named createCustomService() returning a mock"
      - "A static method named customServiceTestOverride() taking the original bean as an argument"
      - "A @Bean-annotated method in a nested @Configuration class"
    answer: 0
    explanation: |
      @TestBean requires a static, no-arg factory method whose return type is compatible with the field, and
      whose name defaults to the field name (here customService). There is no "TestOverride" suffix (that is
      not the @TestBean convention); use the methodName attribute or a FQCN#method reference to point
      elsewhere.
    ref: "concepts.md#bean-override-internals-with-testbean-mockitobean-and-mockitospybean"

  - id: testing-spring-applications-052
    difficulty: expert
    tags: [bean-override, selection, heuristics]
    question: |
      The context has two beans of type NotificationSender: "emailSender" and "smsSender". A test declares
      @MockitoBean NotificationSender emailSender; with no @Qualifier. What happens?
    options:
      - "It fails as ambiguous because bean override uses the same autowiring resolution as @Autowired"
      - "It mocks BOTH beans since the type matches two candidates"
      - "It uses the field name emailSender as a fallback qualifier and mocks the bean named emailSender"
      - "It creates a third new mock bean because REPLACE_OR_CREATE always creates on ambiguity"
    answer: 2
    explanation: |
      Bean-override selection is by type first; when multiple candidates match, the field name is used as a
      fallback qualifier (or you add @Qualifier / the name attribute). Since a bean named emailSender exists,
      that one is replaced. The infrastructure does not run full autowiring resolution.
    ref: "concepts.md#bean-override-internals-with-testbean-mockitobean-and-mockitospybean"

  - id: testing-spring-applications-053
    difficulty: advanced
    tags: [bean-override, caching, cache-key]
    question: |
      Two integration test classes have identical @ContextConfiguration, profiles, and property sources, but
      class A adds @MockitoBean Clock clock and class B does not. How many contexts are cached?
    options:
      - "Two — the bean-override handlers contribute a ContextCustomizer that is part of the cache key, so A and B get different contexts"
      - "One — bean overrides are applied after context load and don't affect the cache key"
      - "One — only @ActiveProfiles and @TestPropertySource affect the cache key"
      - "Three — each @MockitoBean forces a brand-new context per method"
    answer: 0
    explanation: |
      Bean overrides contribute a ContextCustomizer built from the set of override handlers, which is part
      of the merged context configuration and therefore the cache key. A class with @MockitoBean gets a
      different cached context from one without, even with otherwise identical configuration.
    ref: "concepts.md#bean-override-internals-with-testbean-mockitobean-and-mockitospybean"

  - id: testing-spring-applications-054
    difficulty: expert
    tags: [sql, transaction-mode, isolated]
    question: |
      A @Transactional test seeds data with @Sql(scripts="seed.sql", config=@SqlConfig(transactionMode=ISOLATED)),
      then a service method annotated @Transactional(propagation=REQUIRES_NEW) reads that data. Why is ISOLATED
      necessary here, and what must you also add?
    options:
      - "ISOLATED commits the seed data in its own transaction so the REQUIRES_NEW method (a separate transaction) can see it; you must add an AFTER_TEST_METHOD cleanup script because the seed won't be rolled back"
      - "ISOLATED is unnecessary; INFERRED would let the REQUIRES_NEW method see the data because it joins the test transaction"
      - "ISOLATED disables the test transaction entirely, so nothing needs cleanup"
      - "ISOLATED runs the script on a background thread; you must add @DirtiesContext to reset it"
    answer: 0
    explanation: |
      A REQUIRES_NEW method suspends the test transaction and runs in its own transaction, so it cannot see
      uncommitted data written inside the test transaction. ISOLATED commits the seed in a separate
      transaction, making it visible — but because it commits, the test rollback won't undo it, so you must
      provide an AFTER_TEST_METHOD cleanup script.
    ref: "concepts.md#executing-sql-scripts-with-sql"

  - id: testing-spring-applications-055
    difficulty: advanced
    tags: [sql, merge-mode, override]
    question: |
      A test class has @Sql("/schema.sql") at class level. A method adds @Sql("/data.sql"). The method fails
      because the table doesn't exist. What is the cause?
    options:
      - "Class-level @Sql only runs once per class and had already been consumed"
      - "@Sql scripts run after the test method by default, so schema.sql hadn't executed yet"
      - "The default @SqlMergeMode is OVERRIDE, so the method-level @Sql REPLACES the class-level one; schema.sql never runs for that method. Add @SqlMergeMode(MERGE)"
      - "class-level @Sql requires executionPhase=BEFORE_TEST_CLASS to run at all"
    answer: 2
    explanation: |
      By default @SqlMergeMode is OVERRIDE: a method-level @Sql replaces class-level declarations for that
      method, so /schema.sql does not run and the table is missing. Annotating with @SqlMergeMode(MERGE)
      combines both so schema and data both execute.
    ref: "concepts.md#executing-sql-scripts-with-sql"

  - id: testing-spring-applications-056
    difficulty: advanced
    tags: [sql, execution-phase, listener]
    question: |
      Which listener executes @Sql scripts, and what is the DEFAULT execution phase?
    options:
      - "SqlScriptsTestExecutionListener; scripts run BEFORE_TEST_METHOD by default"
      - "TransactionalTestExecutionListener; scripts run after commit"
      - "DependencyInjectionTestExecutionListener; scripts run during prepareTestInstance"
      - "SqlScriptsTestExecutionListener; scripts run AFTER_TEST_METHOD by default"
    answer: 0
    explanation: |
      The default-registered SqlScriptsTestExecutionListener runs @Sql scripts, and the default
      executionPhase is BEFORE_TEST_METHOD. You can switch to AFTER_TEST_METHOD for cleanup, or (since 6.1)
      BEFORE_TEST_CLASS / AFTER_TEST_CLASS at class level.
    ref: "concepts.md#executing-sql-scripts-with-sql"

  - id: testing-spring-applications-057
    difficulty: expert
    tags: [sql, inferred, transaction]
    question: |
      With @SqlConfig(transactionMode = INFERRED) (the default) on a test class annotated @Transactional,
      how are the @Sql script's changes handled at the end of the test?
    options:
      - "The script commits immediately and its changes persist regardless of the test transaction"
      - "The script runs in a nested savepoint that is committed even if the test rolls back"
      - "The script runs with no transaction and its changes always persist"
      - "The script joins the test's transaction and its changes are rolled back with the test"
    answer: 3
    explanation: |
      With INFERRED and an active Spring-managed (test) transaction, the script joins that transaction, so
      its changes are rolled back along with the test by TransactionalTestExecutionListener — no manual
      cleanup needed. ISOLATED would instead commit in a separate transaction.
    ref: "concepts.md#executing-sql-scripts-with-sql"

  - id: testing-spring-applications-058
    difficulty: expert
    tags: [transactional, propagation, requires-new]
    question: |
      A @Transactional test calls a service method annotated @Transactional(propagation = REQUIRES_NEW) that
      inserts an audit row. After the suite, the audit table contains rows from the tests. Why?
    options:
      - "REQUIRES_NEW suspends the test transaction and runs in a new transaction that commits independently, so those inserts are NOT rolled back by the test"
      - "The test's rollback only affects the primary datasource, not audit tables"
      - "@Transactional on tests never actually rolls back inserts, only updates"
      - "Because the context is cached, committed data survives between contexts"
    answer: 0
    explanation: |
      REQUIRES_NEW suspends the outer (test) transaction and opens a brand-new transaction that commits on
      its own. The test's rollback only affects the outer transaction, so the audit rows written by the
      REQUIRES_NEW method persist and leak across tests.
    ref: "concepts.md#transactional-test-rollback"

  - id: testing-spring-applications-059
    difficulty: expert
    tags: [transactional, jpa, lazy-loading, false-negative]
    question: |
      An entity has a LAZY association. In production, accessing it outside the service throws
      LazyInitializationException, but the @Transactional integration test accessing the same association
      passes. Why is the test misleading?
    options:
      - "The test uses a different JPA provider that eagerly fetches everything"
      - "@Transactional tests disable lazy loading via a global flag"
      - "The single test transaction (and its persistence context) stays open for the whole test method, so the lazy association loads successfully — masking the production failure that occurs after the session closes"
      - "MockMvc keeps the Hibernate session open across requests"
    answer: 2
    explanation: |
      Because the test runs in one open transaction for the entire method, the persistence context/session
      remains open, so lazy associations resolve fine. In production the session is already closed when the
      association is touched, throwing LazyInitializationException — a false negative created by the test's
      transaction boundary.
    ref: "concepts.md#transactional-test-rollback"

  - id: testing-spring-applications-060
    difficulty: advanced
    tags: [transactional, flush, persistence]
    question: |
      A @Transactional test saves an entity with a unique constraint that the code violates, yet the test
      passes without an exception. What is the most likely explanation?
    options:
      - "The unique constraint is disabled inside test transactions"
      - "The context cache returned a stale entity that passed validation"
      - "Rollback repairs the constraint violation automatically"
      - "The persist is never flushed to the database before rollback, so the constraint is never checked; force EntityManager.flush() or @Commit to exercise it"
    answer: 3
    explanation: |
      JPA can defer the INSERT until flush/commit. Since the transaction rolls back and may never flush,
      the database-level unique constraint is never evaluated, so the violation goes undetected. Forcing
      flush() (or committing via @Commit) triggers the constraint check.
    ref: "concepts.md#transactional-test-rollback"

  - id: testing-spring-applications-061
    difficulty: expert
    tags: [caching, jvm, fork, parallelism]
    question: |
      A team enables parallel test execution with forkCount=4 in Surefire hoping to speed up their
      integration suite, but total context-build time INCREASES. Why?
    options:
      - "Parallel forks corrupt the shared context cache, forcing rebuilds"
      - "forkCount=4 disables the context cache entirely as a safety measure"
      - "@DirtiesContext is triggered automatically when running in parallel"
      - "The context cache is a static per-JVM singleton, so each of the 4 forks maintains its own cache and rebuilds the same contexts independently, reducing overall cache reuse"
    answer: 3
    explanation: |
      The ContextCache is a static, JVM-wide structure held per fork. With multiple forks, each JVM builds
      its own copies of the contexts instead of sharing one cache, so a suite tuned for a single JVM can see
      more total context builds. This is a genuine trade-off between parallelism and cache reuse.
    ref: "concepts.md#loading-and-caching-the-application-context-across-tests"

  - id: testing-spring-applications-062
    difficulty: expert
    tags: [caching, dirties-context, hierarchy]
    question: |
      In a @ContextHierarchy test with a shared parent and a child context, @DirtiesContext with the default
      hierarchyMode is applied. What gets evicted and closed?
    options:
      - "Only the child context; the parent is always preserved"
      - "Nothing until JVM shutdown; @DirtiesContext only flags for later"
      - "With the default EXHAUSTIVE mode, the entire context hierarchy (parent included) is closed and evicted, because the parent may be shared and referenced by the dirtied child"
      - "Only beans marked @DirtiesContext, not whole contexts"
    answer: 2
    explanation: |
      The default hierarchyMode for @DirtiesContext is EXHAUSTIVE, which removes and closes the whole
      hierarchy — parents and children — since a parent could be shared with the affected child. Using
      CURRENT_LEVEL restricts eviction to the current level and below.
    ref: "concepts.md#loading-and-caching-the-application-context-across-tests"

  - id: testing-spring-applications-063
    difficulty: expert
    tags: [caching, shared-state, order-dependence]
    question: |
      A singleton bean holds a mutable counter. TestA increments it and passes; TestB asserts the counter is
      0 and passes when run alone but fails when the whole class runs. Root cause and correct remedy?
    options:
      - "JUnit ordering bug; annotate with @TestMethodOrder"
      - "TestB needs @Transactional to isolate state"
      - "The cached context is shared, so both tests see the same singleton instance and TestA's mutation leaks into TestB; mark the mutating test (or class) with @DirtiesContext, or avoid mutating shared singletons"
      - "The counter should be a prototype bean so JUnit resets it automatically"
    answer: 2
    explanation: |
      Context caching means both tests share the same singleton instance. TestA's mutation persists into
      TestB, producing an order-dependent failure. The correct remedy is @DirtiesContext on the mutating
      test (forcing a fresh context afterward) or, better, not mutating shared singleton state in tests.
    ref: "concepts.md#loading-and-caching-the-application-context-across-tests"

  - id: testing-spring-applications-064
    difficulty: advanced
    tags: [constructor-injection, springextension, parameter-resolver]
    question: |
      How is SpringExtension able to inject dependencies into a JUnit 5 test's CONSTRUCTOR parameters?
    options:
      - "It uses reflection to set private fields after construction"
      - "It rewrites the test bytecode at load time to add setters"
      - "It requires the test class to extend AbstractJUnit4SpringContextTests"
      - "It implements JUnit Jupiter's ParameterResolver, so it can resolve constructor, method, and lifecycle parameters from the ApplicationContext"
    answer: 3
    explanation: |
      SpringExtension implements JUnit Jupiter's ParameterResolver API, which lets Spring resolve parameters
      of test constructors, test methods, and lifecycle callback methods from the context (for @Autowired /
      @Qualifier / @Value parameters or ApplicationContext types).
    ref: "concepts.md#constructor-injection-testconstructor-and-nested-tests"

  - id: testing-spring-applications-065
    difficulty: expert
    tags: [testconstructor, autowire-mode, precedence]
    question: |
      A test constructor has parameters but NO @Autowired annotation, and one parameter is a JUnit
      TestInfo. Without any extra configuration, what happens?
    options:
      - "Spring autowires all parameters and fails because TestInfo is not a bean"
      - "Spring ignores the constructor and uses field injection instead"
      - "The test fails to start because mixing Spring and JUnit parameter resolution is forbidden"
      - "Because the constructor isn't autowirable (no @Autowired, no @TestConstructor(ALL), default mode not changed), Spring only resolves explicitly annotated parameters and JUnit resolves TestInfo"
    answer: 3
    explanation: |
      A constructor is only fully autowirable if it is @Autowired, or @TestConstructor(autowireMode = ALL)
      is present, or the global spring.test.constructor.autowire.mode is set to all. Otherwise Spring only
      resolves explicitly annotated parameters and lets JUnit resolve the rest (e.g. TestInfo). When the
      whole constructor IS autowirable, no other JUnit resolver may touch its parameters.
    ref: "concepts.md#constructor-injection-testconstructor-and-nested-tests"

  - id: testing-spring-applications-066
    difficulty: expert
    tags: [constructor-injection, per-class, dirties-context]
    question: |
      Why is constructor injection discouraged when combining @TestInstance(PER_CLASS) with a method-level
      @DirtiesContext that closes the context between methods?
    options:
      - "PER_CLASS is incompatible with SpringExtension entirely"
      - "Constructor injection is slower than field injection under PER_CLASS"
      - "The single PER_CLASS test instance is created once with constructor-injected beans; if @DirtiesContext closes that context mid-class, the instance keeps references to beans from a now-closed context. Prefer field/setter injection here"
      - "@DirtiesContext cannot run at method level under PER_CLASS"
    answer: 2
    explanation: |
      With PER_CLASS the test instance (and its constructor-injected dependencies) is created once for the
      whole class. A method-level @DirtiesContext that closes the context leaves the instance holding beans
      from a closed context. Field/setter injection re-populates per method-appropriate lifecycle, avoiding
      the stale references.
    ref: "concepts.md#constructor-injection-testconstructor-and-nested-tests"

  - id: testing-spring-applications-067
    difficulty: advanced
    tags: [nested, configuration-inheritance, profiles]
    question: |
      An outer test class is @SpringJUnitConfig(AppConfig.class). It has two @Nested classes, one
      @ActiveProfiles("a") and one @ActiveProfiles("b"). What is true?
    options:
      - "The nested classes lose the outer @SpringJUnitConfig and must redeclare it"
      - "@ActiveProfiles on @Nested classes is ignored; the outer profile always wins"
      - "Only the first @Nested class inherits configuration; the second must use @ContextConfiguration"
      - "Nested classes inherit the enclosing AppConfig by default (INHERIT), and each distinct profile set yields a different cached context, so two contexts are created"
    answer: 3
    explanation: |
      @Nested classes inherit the enclosing class's Spring configuration by default
      (@NestedTestConfiguration(INHERIT)), so both inherit AppConfig but layer their own profiles. Since
      profiles are part of the cache key, the two distinct profile sets create two separate cached contexts.
      Use OVERRIDE mode to stop inheritance.
    ref: "concepts.md#constructor-injection-testconstructor-and-nested-tests"

  - id: testing-spring-applications-068
    difficulty: expert
    tags: [dynamic-property-source, testcontainers, static]
    question: |
      What are the requirements for a @DynamicPropertySource method, and how are its values resolved?
    options:
      - "It must be an instance method returning a Map; values are read once at class load"
      - "It must be a static method returning Properties, eagerly evaluated before the JVM starts"
      - "It must be annotated @Bean and return a PropertySource"
      - "It must be static, take a single DynamicPropertyRegistry, and register values as Suppliers that are resolved lazily when the property is first read"
    answer: 3
    explanation: |
      A @DynamicPropertySource method must be static and accept a single DynamicPropertyRegistry; you add
      properties as Suppliers (registry.add("k", supplier)) that are resolved lazily. This is why it suits
      Testcontainers, whose URLs/ports are only known after the container starts. These properties also
      participate in the context cache key.
    ref: "concepts.md#context-hierarchy-and-dynamic-property-sources"

  - id: testing-spring-applications-069
    difficulty: advanced
    tags: [context-hierarchy, parent-child, caching]
    question: |
      What is a genuine performance advantage of @ContextHierarchy (parent/child contexts) in a large test
      suite?
    options:
      - "Child contexts never need dependency injection"
      - "Hierarchies disable the context cache to save memory"
      - "A shared parent context can be cached and reused across multiple test classes while their child contexts differ, avoiding rebuilding the expensive shared infrastructure"
      - "Parent contexts bypass @DirtiesContext eviction permanently"
    answer: 2
    explanation: |
      With @ContextHierarchy the parent (e.g. shared infrastructure like datasources) can be cached and
      reused across classes while each class supplies a different child context. This avoids rebuilding the
      expensive parent per class, a real lever for suite performance.
    ref: "concepts.md#context-hierarchy-and-dynamic-property-sources"

  - id: testing-spring-applications-070
    difficulty: advanced
    tags: [dynamic-property-source, initializer, comparison]
    question: |
      How does @DynamicPropertySource differ from registering properties via
      @ContextConfiguration(initializers = ...)?
    options:
      - "@DynamicPropertySource runs after the context is refreshed; initializers run after all tests"
      - "There is no difference; they are aliases"
      - "@DynamicPropertySource is declarative with lazily-evaluated Suppliers added before refresh, whereas an ApplicationContextInitializer runs imperative setup code at a fixed bootstrap point before refresh"
      - "Initializers cannot register property sources at all"
    answer: 2
    explanation: |
      @DynamicPropertySource is a declarative static method whose Supplier values are evaluated lazily when
      first read, added to the Environment before refresh. An ApplicationContextInitializer runs arbitrary
      imperative code against the context at a fixed point during bootstrap (the older Testcontainers
      approach). Both can register properties, but the mechanism and evaluation timing differ.
    ref: "concepts.md#context-hierarchy-and-dynamic-property-sources"

  - id: testing-spring-applications-071
    difficulty: expert
    tags: [mockmvc, standalone, fidelity]
    question: |
      A controller test passes with MockMvcBuilders.standaloneSetup(controller) but the same request 500s in
      production. The controller relies on a custom @ControllerAdvice exception handler and a custom Jackson
      module. Why the discrepancy?
    options:
      - "standaloneSetup uses a real servlet container that behaves differently"
      - "standaloneSetup builds a minimal defaulted MVC setup; your custom @ControllerAdvice and Jackson module are NOT registered unless added explicitly, so behavior diverges from the full context"
      - "standaloneSetup always disables exception handling"
      - "The production failure is unrelated; standaloneSetup and webAppContextSetup are identical"
    answer: 1
    explanation: |
      standaloneSetup registers only the given controller with a minimal, defaulted MVC infrastructure —
      custom @ControllerAdvice, message converters/Jackson modules, interceptors, and argument resolvers are
      absent unless you register them on the builder. webAppContextSetup uses the real beans and reproduces
      production behavior, which is why fidelity-sensitive tests should use it.
    ref: "concepts.md#mockmvc-for-web-layer-tests"

  - id: testing-spring-applications-072
    difficulty: expert
    tags: [mockmvc, security, filters]
    question: |
      An endpoint requires authentication (returns 401 unauthenticated in production). A MockMvc test built
      with webAppContextSetup(wac).build() gets 200 for an unauthenticated request. What is the most likely
      cause?
    options:
      - "MockMvc always bypasses authentication by design and cannot test security"
      - "The Spring Security filter chain is not applied unless you add it (e.g. .apply(springSecurity()) or .addFilters(...)); a bare MockMvc dispatches straight to the controller"
      - "The 401 requires a real socket, which MockMvc never opens"
      - "webAppContextSetup disables all filters permanently"
    answer: 1
    explanation: |
      MockMvc dispatches through the DispatcherServlet but does not automatically include servlet filters
      like Spring Security's filter chain. You must register them, e.g. via Security's springSecurity()
      MockMvc configurer or addFilters(...). Without it, the request reaches the controller unfiltered and
      returns 200.
    ref: "concepts.md#mockmvc-for-web-layer-tests"

  - id: testing-spring-applications-073
    difficulty: advanced
    tags: [mockmvc, async, dispatch]
    question: |
      A controller returns a DeferredResult/Callable. A MockMvc test asserts the JSON body directly after
      perform(...) and fails/finds an empty body. What is missing?
    options:
      - "You must call asyncDispatch(mvcResult) to complete the async request before asserting the final response"
      - "Async controllers cannot be tested with MockMvc at all"
      - "You must start a real embedded server for async"
      - "You must annotate the test with @Async"
    answer: 0
    explanation: |
      For async controllers, the initial perform returns before the deferred result completes. You capture
      the MvcResult (andReturn()) and re-dispatch with asyncDispatch(mvcResult) to obtain the final
      response, then assert on it. MockMvc simulates async dispatch rather than running it on a container.
    ref: "concepts.md#mockmvc-for-web-layer-tests"

  - id: testing-spring-applications-074
    difficulty: advanced
    tags: [testbean, enforce-override, strategy]
    question: |
      A test declares @TestBean(enforceOverride = true) on a field whose type has NO matching bean in the
      context. What is the outcome?
    options:
      - "A new bean is created from the factory method because @TestBean defaults to REPLACE_OR_CREATE"
      - "The test fails: enforceOverride=true switches the strategy to strict REPLACE, which requires an existing bean to override"
      - "The field is left null and the test proceeds"
      - "enforceOverride only affects Mockito annotations, not @TestBean"
    answer: 1
    explanation: |
      @TestBean normally uses REPLACE_OR_CREATE (creates the bean if absent). Setting enforceOverride=true
      makes it strict REPLACE, so if no corresponding bean exists the override fails rather than creating
      one. The same enforceOverride semantics apply to @MockitoBean.
    ref: "concepts.md#bean-override-internals-with-testbean-mockitobean-and-mockitospybean"

  - id: testing-spring-applications-075
    difficulty: advanced
    tags: [mockitobean, type-level, repeatable]
    question: |
      How do you use @MockitoBean at the TYPE (class) level rather than on a field, and what constraint applies?
    options:
      - "You cannot; @MockitoBean is only valid on fields"
      - "Supply the bean(s) to mock via the types attribute, e.g. @MockitoBean(types = {OrderService.class, UserService.class}); the annotation is repeatable, and when a name is given, types must contain a single type"
      - "You must combine it with @TestConfiguration and a nested class"
      - "Type-level mocking requires enforceOverride = true"
    answer: 1
    explanation: |
      At the type level you specify targets via the types attribute (there is no field to infer from). The
      annotation is repeatable and usable as a meta-annotation; if you provide an explicit name, types must
      contain exactly one type.
    ref: "concepts.md#bean-override-internals-with-testbean-mockitobean-and-mockitospybean"

  - id: testing-spring-applications-076
    difficulty: expert
    tags: [caching, failure, spring-6.1]
    question: |
      In Spring Framework 6.1+, what happens the second time a test requests a context configuration whose
      initial load already failed with a bean-creation exception?
    options:
      - "The framework retries the full context load, potentially failing slowly again"
      - "The framework remembers the load failure for that cache key and fails fast with the recorded exception instead of retrying the expensive load"
      - "The framework silently returns an empty context"
      - "The test is skipped automatically"
    answer: 1
    explanation: |
      As of Spring 6.1 the context cache records load failures, so subsequent tests requesting the same
      (broken) configuration fail fast with the cached exception rather than repeatedly attempting the slow,
      doomed load. Before 6.1 each matching test retried the load.
    ref: "concepts.md#loading-and-caching-the-application-context-across-tests"

  - id: testing-spring-applications-077
    difficulty: advanced
    tags: [mockitospybean, factorybean, scoped-proxy]
    question: |
      Which statement about @MockitoSpyBean's WRAP behavior is correct?
    options:
      - "For a FactoryBean target, it wraps the FactoryBean itself, not the produced object"
      - "It can spy a scoped-proxy bean (proxyMode = TARGET_CLASS) without issue"
      - "For a FactoryBean target it wraps the object the factory PRODUCES, and it cannot spy a scoped-proxy target (that fails with an exception)"
      - "It creates a new instance to spy even when the bean is missing"
    answer: 2
    explanation: |
      With WRAP, a FactoryBean's produced object is wrapped in the spy (not the factory). Spying a
      scoped-proxy target (e.g. @Scope(proxyMode = TARGET_CLASS)) is unsupported and throws. WRAP also
      requires exactly one existing candidate, so it never creates a bean.
    ref: "concepts.md#bean-override-internals-with-testbean-mockitobean-and-mockitospybean"

  - id: testing-spring-applications-078
    difficulty: expert
    tags: [testexecutionlisteners, sql, transaction, ordering]
    question: |
      Given the default listener ordering, why can an @Sql script with INFERRED mode detect and join the
      test's transaction?
    options:
      - "Because SqlScriptsTestExecutionListener starts its own transaction independent of the test"
      - "Because TransactionalTestExecutionListener opens the test transaction before SqlScriptsTestExecutionListener runs, so at beforeTestMethod the SQL listener sees an active Spring-managed transaction and joins it"
      - "Because @Sql always runs on a separate thread that inherits the transaction"
      - "Because the SQL listener runs before DI, guaranteeing a transaction exists"
    answer: 1
    explanation: |
      The transactional listener is ordered so the test transaction is active by the time
      SqlScriptsTestExecutionListener executes the scripts at beforeTestMethod. With INFERRED mode the SQL
      listener detects that active Spring-managed transaction and joins it, so the script's changes roll back
      with the test.
    ref: "concepts.md#testexecutionlisteners-and-execution-order"

  - id: testing-spring-applications-079
    difficulty: advanced
    tags: [bean-override, non-singleton, factorybean]
    question: |
      What happens when a bean-override annotation (e.g. @MockitoBean or @TestBean with REPLACE) targets a
      PROTOTYPE-scoped bean or a FactoryBean?
    options:
      - "The override is rejected because only singletons can be overridden"
      - "A prototype target is replaced with a singleton (its definition converted to singleton); for a FactoryBean, REPLACE replaces the FactoryBean itself with a singleton"
      - "The prototype scope is preserved and a new mock is produced on each getBean call"
      - "The FactoryBean's getObjectType() is ignored and the raw factory is injected"
    answer: 1
    explanation: |
      Overriding a non-singleton converts the bean definition to singleton and replaces it with the single
      override instance. For a FactoryBean, REPLACE/REPLACE_OR_CREATE replaces the FactoryBean itself with a
      singleton (whereas WRAP/spy wraps the produced object).
    ref: "concepts.md#bean-override-internals-with-testbean-mockitobean-and-mockitospybean"

  - id: testing-spring-applications-080
    difficulty: expert
    tags: [nested-test-configuration, override, inherit]
    question: |
      A base test class uses @NestedTestConfiguration(OVERRIDE). What is the effect on its @Nested classes?
    options:
      - "Nested classes still inherit the enclosing configuration; OVERRIDE only affects profiles"
      - "Nested classes (and their subclasses/nested classes recursively) STOP inheriting the enclosing class's Spring configuration and must declare their own"
      - "OVERRIDE forces every nested class to share a single context"
      - "OVERRIDE is only valid on the @Nested class itself, not the enclosing class"
    answer: 1
    explanation: |
      The default @NestedTestConfiguration mode is INHERIT (nested classes inherit enclosing config).
      OVERRIDE flips this so nested classes no longer inherit and must supply their own configuration; the
      mode applies recursively to the annotated class and its subclasses/nested classes.
    ref: "concepts.md#constructor-injection-testconstructor-and-nested-tests"

  - id: testing-spring-applications-081
    difficulty: advanced
    tags: [caching, diagnostics, logging]
    question: |
      What is the quickest built-in way to diagnose why a test suite is creating far more ApplicationContexts
      than expected?
    options:
      - "Add @DirtiesContext to every class and count the rebuilds"
      - "Set the org.springframework.test.context.cache logger to DEBUG to log ContextCache hit/miss/size statistics"
      - "Increase spring.test.context.cache.maxSize until the warnings stop"
      - "Run each test class in its own JVM fork"
    answer: 1
    explanation: |
      Enabling DEBUG logging for org.springframework.test.context.cache makes the framework log ContextCache
      statistics (hit count, miss count, size, parent contexts), which quickly reveals how many distinct
      contexts are being built and why — the fastest diagnostic for context proliferation.
    ref: "concepts.md#loading-and-caching-the-application-context-across-tests"
