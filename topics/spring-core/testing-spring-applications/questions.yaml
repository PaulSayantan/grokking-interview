topic: "Testing Spring Applications"
domain: spring-core
topic_slug: testing-spring-applications
version: 1
questions:
  - id: testing-spring-applications-001
    difficulty: beginner
    tags: [spring-test, module, dependency]
    question: |
      Which artifact provides Spring's core testing support, including the Spring TestContext Framework?
    options:
      - "spring-boot-starter-test"
      - "spring-context-support"
      - "junit-jupiter-engine"
      - "spring-test"
    answer: 3
    explanation: |
      The `spring-test` module (org.springframework:spring-test) contains the Spring TestContext
      Framework, MockMvc, servlet mocks, and related testing utilities. It is part of core Spring and
      independent of Spring Boot; spring-boot-starter-test is a Boot convenience that pulls it in.
    ref: "concepts.md#spring-test-module"

  - id: testing-spring-applications-002
    difficulty: beginner
    tags: [spring-test, testcontext, runner]
    question: |
      The Spring TestContext Framework is described as "agnostic to the test runner." What does this mean?
    options:
      - "It integrates with JUnit 4, JUnit 5 (Jupiter), and TestNG"
      - "It can only be used with JUnit 5"
      - "It replaces the need for any test runner"
      - "It requires Spring Boot to select a runner"
    answer: 0
    explanation: |
      The TestContext Framework is independent of the underlying test framework and integrates with
      JUnit 4 (SpringRunner), JUnit 5 Jupiter (SpringExtension), and TestNG. It provides context
      management, DI, transactions, and profiles regardless of the runner.
    ref: "concepts.md#spring-test-module"

  - id: testing-spring-applications-003
    difficulty: beginner
    tags: [spring-test, mockito, bundling]
    question: |
      Does the spring-test module bundle a mocking library like Mockito and the JUnit test engine?
    options:
      - "Yes, both Mockito and JUnit are included in spring-test"
      - "Yes, but only Mockito"
      - "No, Spring provides its own mocking framework instead of Mockito"
      - "No, you add Mockito and a JUnit engine as separate dependencies"
    answer: 3
    explanation: |
      spring-test provides the TestContext Framework and MockMvc, but you pull in Mockito and a JUnit
      (or TestNG) engine separately. Spring integrates with these libraries rather than bundling or
      replacing them.
    ref: "concepts.md#spring-test-module"

  - id: testing-spring-applications-004
    difficulty: intermediate
    tags: [spring-test, jakarta, namespace]
    question: |
      Which namespace does Spring Framework 6.x use for the servlet/EE APIs (relevant to its test mocks)?
    options:
      - "jakarta.*"
      - "javax.*"
      - "org.springframework.ee.*"
      - "spring.servlet.*"
    answer: 0
    explanation: |
      Spring Framework 6.x runs on Jakarta EE and uses the `jakarta.*` namespace, whereas Spring 5.x
      and earlier used `javax.*`. This affects servlet mocks and any EE APIs referenced in tests.
    ref: "concepts.md#spring-test-module"

  - id: testing-spring-applications-005
    difficulty: beginner
    tags: [context-configuration, config-source]
    question: |
      What is the primary purpose of the @ContextConfiguration annotation on an integration test?
    options:
      - "To roll back the database after each test"
      - "To create Mockito mocks for the test"
      - "To declare which configuration (component classes or XML locations) to load into the ApplicationContext"
      - "To start an embedded web server"
    answer: 2
    explanation: |
      @ContextConfiguration tells the TestContext Framework which configuration to load — via
      `classes = ...` (component/@Configuration classes) or `locations = ...` (XML/Groovy resources).
    ref: "concepts.md#contextconfiguration-and-springjunitconfig"

  - id: testing-spring-applications-006
    difficulty: intermediate
    tags: [springjunitconfig, composed-annotation]
    question: |
      @SpringJUnitConfig is a composed annotation equivalent to which combination?
    options:
      - "@ExtendWith(SpringExtension.class) + @ContextConfiguration"
      - "@ExtendWith(MockitoExtension.class) + @ContextConfiguration"
      - "@RunWith(SpringRunner.class) + @WebAppConfiguration"
      - "@SpringBootTest + @Transactional"
    answer: 0
    explanation: |
      @SpringJUnitConfig combines @ExtendWith(SpringExtension.class) and @ContextConfiguration into a
      single JUnit 5 annotation, so you don't have to declare both separately.
    ref: "concepts.md#contextconfiguration-and-springjunitconfig"

  - id: testing-spring-applications-007
    difficulty: intermediate
    tags: [springjunitwebconfig, web]
    question: |
      How does @SpringJUnitWebConfig differ from @SpringJUnitConfig?
    options:
      - "It additionally applies @WebAppConfiguration to load a WebApplicationContext"
      - "It disables the SpringExtension"
      - "It forces every test method to commit its transaction"
      - "It only works with the reactive WebFlux stack"
    answer: 0
    explanation: |
      @SpringJUnitWebConfig is @SpringJUnitConfig plus @WebAppConfiguration, so it loads a
      WebApplicationContext (with a MockServletContext) suitable for web-layer integration tests.
    ref: "concepts.md#contextconfiguration-and-springjunitconfig"

  - id: testing-spring-applications-008
    difficulty: intermediate
    tags: [context-configuration, junit5, extension]
    question: |
      On JUnit 5, if you use a bare @ContextConfiguration (not the composed @SpringJUnitConfig), what
      else must you add for the TestContext Framework to participate?
    options:
      - "@RunWith(SpringRunner.class)"
      - "@EnableAutoConfiguration"
      - "Nothing; @ContextConfiguration activates it by itself"
      - "@ExtendWith(SpringExtension.class)"
    answer: 3
    explanation: |
      With bare @ContextConfiguration on JUnit 5 you must register the SpringExtension via
      @ExtendWith(SpringExtension.class). @SpringJUnitConfig already composes that in for you.
    ref: "concepts.md#contextconfiguration-and-springjunitconfig"

  - id: testing-spring-applications-009
    difficulty: intermediate
    tags: [context-configuration, nested-config]
    question: |
      If @SpringJUnitConfig is used without specifying `classes` or `locations`, what does Spring do by default?
    options:
      - "Throws an error because configuration is required"
      - "Loads the entire classpath as configuration"
      - "Looks for a static nested @Configuration class inside the test class"
      - "Falls back to Spring Boot auto-configuration"
    answer: 2
    explanation: |
      When no explicit config source is given, the TestContext Framework auto-detects a static nested
      @Configuration class declared within the test class and uses it as the configuration.
    ref: "concepts.md#contextconfiguration-and-springjunitconfig"

  - id: testing-spring-applications-010
    difficulty: intermediate
    tags: [context-configuration, junit4]
    question: |
      What is the JUnit 4 equivalent for activating the Spring TestContext Framework?
    options:
      - "@ExtendWith(SpringExtension.class)"
      - "@SpringJUnitConfig"
      - "@RunWith(SpringRunner.class)"
      - "@TestExecutionListeners"
    answer: 2
    explanation: |
      On JUnit 4 you use @RunWith(SpringRunner.class) (an alias for SpringJUnit4ClassRunner) together
      with @ContextConfiguration. The JUnit 5 counterpart is @ExtendWith(SpringExtension.class).
    ref: "concepts.md#contextconfiguration-and-springjunitconfig"

  - id: testing-spring-applications-011
    difficulty: beginner
    tags: [caching, performance]
    question: |
      Why does the Spring TestContext Framework cache the ApplicationContext across tests?
    options:
      - "To guarantee each test gets a brand-new context"
      - "To roll back the database automatically"
      - "Because JUnit requires a shared context"
      - "Because loading a context is expensive, so it is built once and reused across matching tests"
    answer: 3
    explanation: |
      Building a context (scanning, bean instantiation, connection pools) is costly, so the framework
      builds it once and reuses it across all tests that request an equivalent configuration, greatly
      speeding up the suite.
    ref: "concepts.md#loading-and-caching-the-application-context-across-tests"

  - id: testing-spring-applications-012
    difficulty: intermediate
    tags: [caching, cache-key]
    question: |
      Two test classes will SHARE the same cached ApplicationContext when which condition holds?
    options:
      - "They are in the same package"
      - "They both extend the same base class"
      - "They declare the same combination of context-defining attributes (classes/locations, profiles, property sources, etc.)"
      - "They run within the same test method"
    answer: 2
    explanation: |
      The context cache is keyed by the attributes that define the context — config classes/locations,
      initializers, active profiles, test property sources, the ContextLoader, etc. Identical
      combinations share one cached context; any difference produces a separate one.
    ref: "concepts.md#loading-and-caching-the-application-context-across-tests"

  - id: testing-spring-applications-013
    difficulty: intermediate
    tags: [caching, dirties-context]
    question: |
      What does @DirtiesContext do?
    options:
      - "Marks the context as invalid so it is removed from the cache and closed"
      - "Forces every bean to be a prototype"
      - "Rolls back the current transaction"
      - "Disables dependency injection for the test"
    answer: 0
    explanation: |
      @DirtiesContext signals that a test mutated the context, so the framework evicts it from the
      cache and closes it. The next matching test then rebuilds the context, so it should be used
      sparingly to preserve caching benefits.
    ref: "concepts.md#loading-and-caching-the-application-context-across-tests"

  - id: testing-spring-applications-014
    difficulty: intermediate
    tags: [caching, max-size]
    question: |
      What is the default maximum number of contexts held by the TestContext cache (with LRU eviction)?
    options:
      - "1"
      - "8"
      - "32"
      - "unlimited"
    answer: 2
    explanation: |
      By default the context cache holds up to 32 contexts using LRU eviction, configurable via the
      `spring.test.context.cache.maxSize` SpringProperties/JVM setting.
    ref: "concepts.md#loading-and-caching-the-application-context-across-tests"

  - id: testing-spring-applications-015
    difficulty: intermediate
    tags: [caching, profiles, ordering]
    question: |
      Do @ActiveProfiles({"a","b"}) and @ActiveProfiles({"b","a"}) produce different cached contexts?
    options:
      - "Yes, profile order always creates distinct contexts"
      - "Yes, but only on JUnit 4"
      - "No, because profiles are ignored in the cache key"
      - "No, Spring normalizes/sorts the profile names so they are treated as the same context"
    answer: 3
    explanation: |
      Active profiles are part of the cache key, but Spring sorts the profile names when computing it,
      so {"a","b"} and {"b","a"} are order-independent and resolve to the same cached context.
    ref: "concepts.md#loading-and-caching-the-application-context-across-tests"

  - id: testing-spring-applications-016
    difficulty: intermediate
    tags: [caching, slow-suite]
    question: |
      A team notices their integration suite is slow despite context caching. Which is the MOST likely cause?
    options:
      - "Too many distinct context configurations (varying profiles/property sources/mock beans) and overuse of @DirtiesContext"
      - "Using @Autowired instead of constructor injection"
      - "Running tests on JUnit 5 instead of JUnit 4"
      - "Declaring @Test on every method"
    answer: 0
    explanation: |
      Each distinct configuration combination creates a separate context, and every @DirtiesContext
      forces a rebuild. Gratuitously varying profiles, property sources, or mock-bean sets multiplies
      the number of contexts and defeats caching.
    ref: "concepts.md#loading-and-caching-the-application-context-across-tests"

  - id: testing-spring-applications-017
    difficulty: beginner
    tags: [mock, mockito]
    question: |
      Where does the @Mock annotation come from, and does it register a Spring bean?
    options:
      - "From Spring; it registers a mock bean in the context"
      - "From JUnit; it replaces a bean in the context"
      - "From Mockito; it creates a standalone mock that is NOT a Spring bean"
      - "From Spring Boot; it starts an embedded server"
    answer: 2
    explanation: |
      @Mock is a Mockito annotation that creates a standalone mock object. It has nothing to do with the
      Spring container — the mock is not registered as a bean nor injected into other Spring beans.
    ref: "concepts.md#mockbean-and-mock-and-how-they-differ"

  - id: testing-spring-applications-018
    difficulty: intermediate
    tags: [mockbean, context]
    question: |
      What does Spring Boot's @MockBean do that @Mock does not?
    options:
      - "It creates a mock without needing Mockito"
      - "It disables the Spring context"
      - "It rolls back the transaction after the test"
      - "It creates a Mockito mock AND registers/replaces it as a bean in the ApplicationContext"
    answer: 3
    explanation: |
      @MockBean creates a Mockito mock and registers it into the loaded ApplicationContext, replacing
      any existing bean of that type, so other beans receive the mock via DI. It requires a Spring
      context; @Mock is just a bare mock.
    ref: "concepts.md#mockbean-and-mock-and-how-they-differ"

  - id: testing-spring-applications-019
    difficulty: intermediate
    tags: [mock, injectmocks, unit-test]
    question: |
      In a pure Mockito unit test, which annotation typically constructs the class-under-test and injects the @Mock collaborators?
    options:
      - "@Autowired"
      - "@MockBean"
      - "@InjectMocks"
      - "@ContextConfiguration"
    answer: 2
    explanation: |
      @InjectMocks (Mockito) instantiates the class under test and injects the declared @Mock objects
      into it — no Spring container involved. This is the standard pattern for context-free unit tests.
    ref: "concepts.md#mockbean-and-mock-and-how-they-differ"

  - id: testing-spring-applications-020
    difficulty: intermediate
    tags: [mockbean, cache-key]
    question: |
      How do @MockBean definitions relate to the context cache?
    options:
      - "They are ignored by the cache"
      - "They always force a brand-new context per method"
      - "They disable caching entirely"
      - "They participate in the context cache key, so tests with different mock-bean sets get different contexts"
    answer: 3
    explanation: |
      Because @MockBean changes the bean definitions, it participates in the cache key. Tests declaring
      different sets of @MockBean end up with different cached contexts.
    ref: "concepts.md#mockbean-and-mock-and-how-they-differ"

  - id: testing-spring-applications-021
    difficulty: intermediate
    tags: [mockitobean, spring-6.2, framework]
    question: |
      Which core Spring Framework 6.2 annotation is the framework's own equivalent of Boot's @MockBean?
    options:
      - "@MockitoBean"
      - "@MockBean"
      - "@SpyBean"
      - "@TestConfiguration"
    answer: 0
    explanation: |
      Spring Framework 6.2 introduced bean-override annotations in core spring-test, including
      @MockitoBean (and @MockitoSpyBean, @TestBean). @MockitoBean replaces a context bean with a mock,
      superseding Boot's @MockBean going forward.
    ref: "concepts.md#mockbean-and-mock-and-how-they-differ"

  - id: testing-spring-applications-022
    difficulty: beginner
    tags: [mock, unit-vs-integration]
    question: |
      Which annotation is appropriate for a fast unit test that uses NO Spring container?
    options:
      - "@MockBean"
      - "@MockitoBean"
      - "@SpringJUnitConfig"
      - "@Mock"
    answer: 3
    explanation: |
      @Mock is the right choice for context-free unit tests — it produces a bare Mockito mock without
      loading any ApplicationContext. @MockBean/@MockitoBean require a Spring context.
    ref: "concepts.md#mockbean-and-mock-and-how-they-differ"

  - id: testing-spring-applications-023
    difficulty: beginner
    tags: [mockmvc, web]
    question: |
      What does MockMvc let you do?
    options:
      - "Exercise Spring MVC controllers through the DispatcherServlet without a running servlet container"
      - "Start a real Tomcat server on a random port"
      - "Mock the database layer only"
      - "Generate load-test traffic against a deployed endpoint"
    answer: 0
    explanation: |
      MockMvc drives controllers through the full MVC infrastructure (DispatcherServlet, handler
      mapping, converters, advice) in-process, without starting a real servlet container or opening a
      network socket.
    ref: "concepts.md#mockmvc-for-web-layer-tests"

  - id: testing-spring-applications-024
    difficulty: intermediate
    tags: [mockmvc, standalone]
    question: |
      What characterizes MockMvcBuilders.standaloneSetup(...)?
    options:
      - "It requires a fully loaded WebApplicationContext"
      - "It starts an embedded server"
      - "It registers specific controller instances directly, without needing a Spring context"
      - "It can only test reactive WebFlux controllers"
    answer: 2
    explanation: |
      standaloneSetup registers the given controller instance(s) with the minimal MVC infrastructure
      and does not require a Spring context — you supply collaborators yourself. It's ideal for focused,
      unit-like controller tests.
    ref: "concepts.md#mockmvc-for-web-layer-tests"

  - id: testing-spring-applications-025
    difficulty: intermediate
    tags: [mockmvc, webappcontext]
    question: |
      When would you build MockMvc via MockMvcBuilders.webAppContextSetup(wac)?
    options:
      - "When you want your real MVC beans, filters, and @ControllerAdvice to participate (integration flavour)"
      - "When you want to avoid loading any Spring context"
      - "When testing a plain POJO service"
      - "When you need to open a real HTTP socket"
    answer: 0
    explanation: |
      webAppContextSetup builds MockMvc from a loaded WebApplicationContext so all real MVC beans,
      filters, and advice participate — the integration-style setup. standaloneSetup is the
      context-free alternative.
    ref: "concepts.md#mockmvc-for-web-layer-tests"

  - id: testing-spring-applications-026
    difficulty: beginner
    tags: [mockmvc, fluent-api]
    question: |
      In the MockMvc fluent API, which call performs assertions on the result of a request?
    options:
      - "perform(...)"
      - "build()"
      - "param(...)"
      - "andExpect(...)"
    answer: 3
    explanation: |
      After perform(requestBuilder) returns ResultActions, you chain .andExpect(matcher) to assert on
      status, content, headers, JSON paths, etc. Matchers come from MockMvcResultMatchers.
    ref: "concepts.md#mockmvc-for-web-layer-tests"

  - id: testing-spring-applications-027
    difficulty: intermediate
    tags: [mockmvc, webflux, webtestclient]
    question: |
      For testing the reactive WebFlux stack, which tool is the analogue of MockMvc?
    options:
      - "MockMvc still applies to WebFlux"
      - "TestRestTemplate"
      - "MockRestServiceServer"
      - "WebTestClient"
    answer: 3
    explanation: |
      MockMvc targets the servlet (Spring MVC) stack. For the reactive WebFlux stack, WebTestClient is
      the equivalent server-side test client.
    ref: "concepts.md#mockmvc-for-web-layer-tests"

  - id: testing-spring-applications-028
    difficulty: intermediate
    tags: [mockmvc, framework-vs-boot]
    question: |
      Which statement about MockMvc and Spring Boot's @WebMvcTest is correct?
    options:
      - "@WebMvcTest is core spring-test; MockMvc is Spring Boot only"
      - "MockMvc is core spring-test; @WebMvcTest is a Spring Boot slice that auto-configures MockMvc"
      - "Both are Spring Boot only"
      - "Both are core spring-test with no Boot involvement"
    answer: 1
    explanation: |
      MockMvc and @WebAppConfiguration are core spring-test primitives. @WebMvcTest and
      @AutoConfigureMockMvc are Spring Boot conveniences that auto-configure MockMvc and load only the
      web layer, layered on top of the same MockMvc primitive.
    ref: "concepts.md#mockmvc-for-web-layer-tests"

  - id: testing-spring-applications-029
    difficulty: beginner
    tags: [transactional, rollback]
    question: |
      What is the default behaviour when a test method is annotated with @Transactional?
    options:
      - "The transaction commits after the method"
      - "The transaction is rolled back after the method by default"
      - "No transaction is started"
      - "The test fails unless you call commit() manually"
    answer: 1
    explanation: |
      For tests, the TransactionalTestExecutionListener rolls back the transaction at the end of each
      test method by default, keeping the database clean between tests. This differs from production
      beans, which commit on success.
    ref: "concepts.md#transactional-test-rollback"

  - id: testing-spring-applications-030
    difficulty: intermediate
    tags: [transactional, commit]
    question: |
      Which annotation makes a @Transactional test method actually COMMIT instead of rolling back?
    options:
      - "@Rollback(true)"
      - "@Commit"
      - "@DirtiesContext"
      - "@AfterTransaction"
    answer: 1
    explanation: |
      @Commit (or the older @Rollback(false)) overrides the default rollback so the test's transaction
      is committed. @Rollback(true) is the explicit form of the default rollback behaviour.
    ref: "concepts.md#transactional-test-rollback"

  - id: testing-spring-applications-031
    difficulty: intermediate
    tags: [transactional, requirement]
    question: |
      For @Transactional test rollback to work, what must be present in the ApplicationContext?
    options:
      - "An embedded web server"
      - "A @MockBean of the repository"
      - "The SpringBootTest bootstrapper"
      - "A PlatformTransactionManager bean"
    answer: 3
    explanation: |
      A PlatformTransactionManager bean must exist for transactional tests. If several are present, you
      select one with @Transactional(transactionManager = "...").
    ref: "concepts.md#transactional-test-rollback"

  - id: testing-spring-applications-032
    difficulty: intermediate
    tags: [transactional, before-transaction]
    question: |
      What is the purpose of @BeforeTransaction and @AfterTransaction methods in a transactional test?
    options:
      - "They run inside the test's transaction to modify data"
      - "They replace @BeforeEach and @AfterEach entirely"
      - "They run outside the test's transaction boundary, e.g. to set up or verify data separately"
      - "They force the context to be rebuilt"
    answer: 2
    explanation: |
      @BeforeTransaction and @AfterTransaction mark methods that run outside the test method's
      transaction boundary — useful for setup or verification that must occur in its own transaction.
    ref: "concepts.md#transactional-test-rollback"

  - id: testing-spring-applications-033
    difficulty: intermediate
    tags: [transactional, flush, gotcha]
    question: |
      Why might a @Transactional test pass even though the data was never truly persisted?
    options:
      - "Because rollback happens and changes may never be flushed, so constraint/ID behaviour isn't exercised"
      - "Because @Transactional disables assertions"
      - "Because the context cache stores stale data"
      - "Because MockMvc intercepts the database calls"
    answer: 0
    explanation: |
      Since everything runs in one rolled-back transaction, entities may never be flushed/committed, so
      constraints and ID generation aren't truly exercised. Force EntityManager.flush() or use @Commit
      when you need to verify real persistence.
    ref: "concepts.md#transactional-test-rollback"

  - id: testing-spring-applications-034
    difficulty: beginner
    tags: [active-profiles, profiles]
    question: |
      What does @ActiveProfiles declare for a test?
    options:
      - "Which bean-definition profiles are active when the test's ApplicationContext is loaded"
      - "Which test methods to run first"
      - "Which mock beans to create"
      - "Whether the transaction commits or rolls back"
    answer: 0
    explanation: |
      @ActiveProfiles sets the active bean-definition profiles for the test context, so beans guarded
      by @Profile are included/excluded accordingly. It is the test-time counterpart of setting
      spring.profiles.active.
    ref: "concepts.md#profiles-in-tests-with-activeprofiles"

  - id: testing-spring-applications-035
    difficulty: intermediate
    tags: [active-profiles, inherit]
    question: |
      What does @ActiveProfiles(inheritProfiles = false) do?
    options:
      - "Disables all profiles for the test"
      - "Forces the parent context to be reloaded"
      - "Prevents a subclass from inheriting the superclass's active profiles"
      - "Makes profiles case-insensitive"
    answer: 2
    explanation: |
      By default (inheritProfiles = true) a subclass inherits the superclass's profiles. Setting it to
      false stops that inheritance so only the subclass's declared profiles apply.
    ref: "concepts.md#profiles-in-tests-with-activeprofiles"

  - id: testing-spring-applications-036
    difficulty: intermediate
    tags: [active-profiles, resolver]
    question: |
      How can you activate profiles dynamically/programmatically for a test (e.g. based on an env var)?
    options:
      - "Use @DirtiesContext"
      - "Use @Commit"
      - "Profiles cannot be resolved dynamically"
      - "Use @ActiveProfiles with an ActiveProfilesResolver via the resolver attribute"
    answer: 3
    explanation: |
      Implement ActiveProfilesResolver and reference it with @ActiveProfiles(resolver = MyResolver.class)
      to compute the active profiles programmatically at runtime.
    ref: "concepts.md#profiles-in-tests-with-activeprofiles"

  - id: testing-spring-applications-037
    difficulty: intermediate
    tags: [active-profiles, test-property-source]
    question: |
      Which annotation complements @ActiveProfiles to override individual property values for a test?
    options:
      - "@DirtiesContext"
      - "@TestPropertySource"
      - "@WebAppConfiguration"
      - "@Rollback"
    answer: 1
    explanation: |
      @TestPropertySource lets you supply property file locations or inlined properties for the test
      context, complementing @ActiveProfiles which selects the active bean profiles.
    ref: "concepts.md#profiles-in-tests-with-activeprofiles"

  - id: testing-spring-applications-038
    difficulty: beginner
    tags: [unit-vs-integration, definition]
    question: |
      What is the defining difference between a Spring unit test and an integration test?
    options:
      - "Unit tests use JUnit 5 and integration tests use JUnit 4"
      - "Unit tests always use a database; integration tests never do"
      - "A unit test loads NO Spring context, while an integration test boots an ApplicationContext"
      - "Integration tests cannot use mocks"
    answer: 2
    explanation: |
      A unit test uses no Spring container — you `new` the class and inject mocks. An integration test
      boots an ApplicationContext (via the TestContext Framework) to exercise wiring, AOP, transactions,
      and I/O.
    ref: "concepts.md#unit-test-versus-integration-test"

  - id: testing-spring-applications-039
    difficulty: intermediate
    tags: [unit-vs-integration, guidance]
    question: |
      Which is the recommended balance according to the "test pyramid" guidance?
    options:
      - "Mostly integration tests, a few unit tests"
      - "A broad base of fast unit tests with a focused layer of integration tests"
      - "Only integration tests, since they are more realistic"
      - "Equal numbers of every kind, always"
    answer: 1
    explanation: |
      Integration tests are slower and more brittle, so a healthy suite is a broad base of unit tests
      covering logic with a focused set of integration tests verifying wiring, transactions, and I/O.
    ref: "concepts.md#unit-test-versus-integration-test"

  - id: testing-spring-applications-040
    difficulty: intermediate
    tags: [unit-vs-integration, subtle]
    question: |
      A "small" test class is annotated with @ExtendWith(SpringExtension.class) and @ContextConfiguration and injects real beans. How should it be classified?
    options:
      - "A unit test, because it is small"
      - "Neither; it is a mock test"
      - "A slice test that requires Spring Boot"
      - "An integration test, because it boots and pays for a Spring container"
    answer: 3
    explanation: |
      Loading a context and injecting real beans makes it an integration test regardless of size — you
      are paying for the container. A true unit test uses no Spring context at all.
    ref: "concepts.md#unit-test-versus-integration-test"

  - id: testing-spring-applications-041
    difficulty: beginner
    tags: [springboottest, boot, contrast]
    question: |
      Which statement about @SpringBootTest is correct?
    options:
      - "It is part of the core spring-test module"
      - "It is a Spring Boot annotation that bootstraps the context with auto-configuration and config discovery"
      - "It disables the Spring container"
      - "It is only used for unit tests"
    answer: 1
    explanation: |
      @SpringBootTest lives in Spring Boot (org.springframework.boot.test.context), not core spring-test.
      It uses Boot's bootstrapper, discovers @SpringBootConfiguration, and applies auto-configuration.
    ref: "concepts.md#springboottest-as-a-boot-slice-contrasted"

  - id: testing-spring-applications-042
    difficulty: intermediate
    tags: [springboottest, core-equivalent]
    question: |
      In a NON-Boot Spring project, what is the core-framework way to write an integration test equivalent to @SpringBootTest?
    options:
      - "Use @SpringJUnitConfig / @ContextConfiguration with explicit configuration classes"
      - "Use @SpringBootTest anyway"
      - "You cannot write integration tests without Spring Boot"
      - "Use @Mock and @InjectMocks only"
    answer: 0
    explanation: |
      Core Spring uses @SpringJUnitConfig / @ContextConfiguration where you name the config explicitly
      (no auto-configuration or main-class discovery). MockMvc is wired by hand and rollback via
      @Transactional.
    ref: "concepts.md#springboottest-as-a-boot-slice-contrasted"

  - id: testing-spring-applications-043
    difficulty: intermediate
    tags: [springboottest, slices]
    question: |
      Which of these is a Spring Boot "slice" test annotation that loads only part of the application?
    options:
      - "@ContextConfiguration"
      - "@SpringJUnitConfig"
      - "@ActiveProfiles"
      - "@WebMvcTest"
    answer: 3
    explanation: |
      @WebMvcTest is a Boot slice that loads only the web layer and auto-configures MockMvc. Others like
      @DataJpaTest, @JsonTest are also slices. @ContextConfiguration and @SpringJUnitConfig are core
      framework annotations.
    ref: "concepts.md#springboottest-as-a-boot-slice-contrasted"

  - id: testing-spring-applications-044
    difficulty: intermediate
    tags: [springboottest, web-environment]
    question: |
      How do you make @SpringBootTest start an embedded server on a random port for real HTTP tests?
    options:
      - "@SpringBootTest(webEnvironment = WebEnvironment.RANDOM_PORT)"
      - "@WebAppConfiguration"
      - "@SpringJUnitWebConfig"
      - "@Transactional(readOnly = false)"
    answer: 0
    explanation: |
      @SpringBootTest(webEnvironment = RANDOM_PORT) (or DEFINED_PORT) starts an embedded server so you
      can make real HTTP calls with TestRestTemplate/WebTestClient. Core spring-test has no built-in
      embedded-server support.
    ref: "concepts.md#springboottest-as-a-boot-slice-contrasted"

  - id: testing-spring-applications-045
    difficulty: beginner
    tags: [springboottest, config-discovery]
    question: |
      A key contrast: how does core Spring find configuration for an integration test versus Spring Boot?
    options:
      - "Core Spring auto-discovers a main class; Boot requires explicit classes"
      - "Core Spring requires explicit classes/locations (or a nested @Configuration); Boot auto-discovers @SpringBootConfiguration"
      - "Both auto-discover configuration identically"
      - "Neither needs any configuration source"
    answer: 1
    explanation: |
      In core Spring you name the config explicitly via classes/locations (or rely on a nested
      @Configuration). Spring Boot instead searches upward for @SpringBootConfiguration (your
      @SpringBootApplication) and applies auto-configuration.
    ref: "concepts.md#springboottest-as-a-boot-slice-contrasted"
