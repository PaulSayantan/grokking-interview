topic: "Cloud Platforms & Managed Services for DevOps"
domain: devops-cicd
topic_slug: cloud-platforms-and-managed-services
version: 1
questions:
  - id: cloud-platforms-and-managed-services-001
    difficulty: beginner
    tags: [service-models, iaas, paas, saas]
    question: |
      In the IaaS / PaaS / SaaS spectrum, what fundamentally changes as you move from
      IaaS toward SaaS?
    options:
      - The provider operates a larger share of the stack, so you manage less
      - The workload always becomes cheaper per unit of usage
      - You gain more control over the underlying operating system
      - The provider stops being responsible for physical hardware
    answer: 0
    explanation: |
      The service models describe how much of the stack the provider operates. Moving from
      IaaS to SaaS shifts more layers (OS, runtime, then the whole app) to the provider, so
      you manage less. It does not guarantee lower cost and generally reduces (not increases)
      your OS-level control.
    ref: "concepts.md#cloud-service-models-iaas-paas-saas-faas"

  - id: cloud-platforms-and-managed-services-002
    difficulty: beginner
    tags: [faas, serverless, definition]
    question: |
      "Serverless" (FaaS) is best described as which of the following?
    options:
      - Code runs without any physical servers existing in the datacenter
      - You provision dedicated servers but the provider patches them
      - You don't provision or manage servers and don't pay for idle capacity
      - A pricing model billed only per gigabyte of object storage used
    answer: 2
    explanation: |
      Serverless still runs on servers — you just don't provision or manage them, and you're
      billed per invocation / GB-second rather than for idle capacity. Claiming "no servers
      exist" is a common misconception.
    ref: "concepts.md#cloud-service-models-iaas-paas-saas-faas"

  - id: cloud-platforms-and-managed-services-003
    difficulty: intermediate
    tags: [faas, scenario, cost]
    question: |
      A thumbnail-generation job is triggered a few thousand times a day in unpredictable
      bursts and is idle most of the time. Which compute model fits best and why?
    options:
      - A permanently-running VM, because it avoids cold starts
      - A dedicated bare-metal server, for maximum isolation
      - A reserved-instance fleet sized for peak, for predictable cost
      - FaaS/serverless, because it scales to zero and bills per invocation
    answer: 3
    explanation: |
      A spiky, event-driven, mostly-idle workload is the textbook fit for serverless: it
      scales to zero (no charge when idle) and bills per invocation. Always-on VMs or reserved
      fleets pay for idle capacity that this workload doesn't need.
    ref: "concepts.md#cloud-service-models-iaas-paas-saas-faas"

  - id: cloud-platforms-and-managed-services-004
    difficulty: intermediate
    tags: [paas, service-models]
    question: |
      In a PaaS offering (e.g. App Engine, Cloud Run, Elastic Beanstalk), which is the
      customer still primarily responsible for?
    options:
      - Patching the underlying operating system
      - Managing the hypervisor and physical servers
      - Replacing failed physical disks
      - The application code and its configuration
    answer: 3
    explanation: |
      PaaS takes the OS, runtime, and patching off your plate; you provide and configure the
      application code. Hardware, hypervisor, and OS patching are the provider's job in PaaS.
    ref: "concepts.md#cloud-service-models-iaas-paas-saas-faas"

  - id: cloud-platforms-and-managed-services-005
    difficulty: beginner
    tags: [service-models, examples]
    question: |
      Which of these is an example of SaaS rather than IaaS or PaaS?
    options:
      - Amazon EC2
      - Google Compute Engine
      - Salesforce
      - AWS Elastic Beanstalk
    answer: 2
    explanation: |
      Salesforce is a finished application consumed over the network (SaaS). EC2 and GCE are
      IaaS (raw VMs); Elastic Beanstalk is PaaS (you supply app code, it runs it).
    ref: "concepts.md#cloud-service-models-iaas-paas-saas-faas"

  - id: cloud-platforms-and-managed-services-006
    difficulty: intermediate
    tags: [shared-responsibility, security]
    question: |
      In the cloud shared responsibility model, which layer does the customer ALWAYS own,
      regardless of service model?
    options:
      - The hypervisor and virtualization layer
      - The physical security of the datacenter
      - The managed-service control plane
      - Their data and identity/access (IAM) configuration
    answer: 3
    explanation: |
      Across every service model the customer always owns their data and their IAM/access
      configuration — who can access what. The hypervisor, physical facilities, and managed
      control plane are the provider's responsibility.
    ref: "concepts.md#the-shared-responsibility-model"

  - id: cloud-platforms-and-managed-services-007
    difficulty: intermediate
    tags: [shared-responsibility, breaches]
    question: |
      Which statement about the shared responsibility model is most accurate?
    options:
      - Most real cloud breaches are caused by provider hardware failures
      - The responsibility boundary is fixed and identical across all service models
      - The boundary shifts with the service model, and most breaches stem from customer misconfiguration
      - Choosing SaaS makes the customer responsible for zero security concerns
    answer: 2
    explanation: |
      The boundary moves with the service model (higher abstraction = more the provider owns),
      but the customer never fully offloads security — most breaches are customer-side
      misconfiguration (public buckets, over-broad IAM). Even in SaaS the customer owns access
      config and their data.
    ref: "concepts.md#the-shared-responsibility-model"

  - id: cloud-platforms-and-managed-services-008
    difficulty: advanced
    tags: [shared-responsibility, scenario, iaas]
    question: |
      A team runs an application on IaaS VMs. A critical unpatched OS vulnerability is
      exploited. Under the shared responsibility model, who was responsible for that patch?
    options:
      - The cloud provider, since they own the infrastructure
      - The customer, since OS patching is the customer's job on IaaS
      - Neither — IaaS OS patching is fully automated by the provider
      - The provider, because the VM runs on their hypervisor
    answer: 1
    explanation: |
      On IaaS the provider secures the hardware/hypervisor, but the customer owns the guest OS,
      including patching. An unpatched OS on an IaaS VM is the customer's responsibility. (On
      PaaS/serverless the provider would patch the OS/runtime.)
    ref: "concepts.md#the-shared-responsibility-model"

  - id: cloud-platforms-and-managed-services-009
    difficulty: beginner
    tags: [compute, vms, containers]
    question: |
      Compared to a full VM, a container primarily differs in that it:
    options:
      - Runs its own separate guest operating-system kernel
      - Provides stronger isolation than hypervisor-based VMs
      - Shares the host kernel and isolates only the userspace/process
      - Cannot be scheduled or scaled by an orchestrator like Kubernetes
    answer: 2
    explanation: |
      Containers share the host OS kernel and isolate userspace via namespaces/cgroups, which
      makes them lighter and faster to start than VMs but gives weaker isolation than a
      hypervisor-based VM.
    ref: "concepts.md#compute-options-vms-vs-containers-vs-serverless"

  - id: cloud-platforms-and-managed-services-010
    difficulty: intermediate
    tags: [compute, scenario, vms]
    question: |
      A team must run a legacy stateful application that needs a specific OS kernel module and
      full OS-level control. Which compute option fits best?
    options:
      - Serverless functions, which expose kernel modules on request
      - A managed container service with no host access
      - A SaaS product that ships the required kernel module built in
      - A VM (IaaS), for full OS control
    answer: 3
    explanation: |
      Needing a specific kernel module and OS-level control points to a VM (IaaS), where you
      own the guest OS. Serverless and managed containers abstract the OS away, and SaaS is a
      finished app, none of which allow kernel-level control.
    ref: "concepts.md#compute-options-vms-vs-containers-vs-serverless"

  - id: cloud-platforms-and-managed-services-011
    difficulty: intermediate
    tags: [serverless, cold-start, gotcha]
    question: |
      Which is a genuine limitation to consider before choosing serverless (FaaS) for a
      workload?
    options:
      - It cannot be triggered by events such as queue messages or uploads
      - It always requires you to patch the underlying operating system yourself
      - Cold starts and per-invocation cost at very high sustained volume
      - It cannot scale automatically and needs manual instance provisioning
    answer: 2
    explanation: |
      Serverless auto-scales and removes OS patching, but real constraints include cold-start
      latency, execution-time limits, statelessness, and that at very high sustained volume
      per-invocation billing can exceed a reserved fleet's cost.
    ref: "concepts.md#compute-options-vms-vs-containers-vs-serverless"

  - id: cloud-platforms-and-managed-services-012
    difficulty: advanced
    tags: [compute, cost, scenario]
    question: |
      For a high-throughput, latency-sensitive service running at steady near-100%
      utilization around the clock, which is generally the most cost-effective and
      predictable choice?
    options:
      - Serverless functions, because they scale to zero
      - A reserved/committed VM or container fleet
      - On-demand spot instances for the primary path
      - A new managed SaaS subscription per request
    answer: 1
    explanation: |
      Serverless wins on cost for low/spiky utilization. For steady, high, always-on load a
      reserved/committed fleet amortizes the always-on cost and avoids cold-start latency.
      Spot is inappropriate for a latency-sensitive primary path (it can be reclaimed).
    ref: "concepts.md#compute-options-vms-vs-containers-vs-serverless"

  - id: cloud-platforms-and-managed-services-013
    difficulty: beginner
    tags: [managed-services, definition]
    question: |
      What does a managed database service (e.g. RDS, Cloud SQL) primarily take off a team's
      plate compared to self-hosting the same database?
    options:
      - The need to write any SQL queries or tune query execution plans
      - All licensing costs for the underlying database engine and its edition
      - The need to design a data model and normalize the schema
      - Provisioning, patching, backups, replication, and failover
    answer: 3
    explanation: |
      Managed services handle the undifferentiated heavy lifting of operating stateful
      infrastructure — provisioning, patching, backups, replication, and automated failover.
      You still design schemas and write queries.
    ref: "concepts.md#managed-vs-self-hosted-services"

  - id: cloud-platforms-and-managed-services-014
    difficulty: intermediate
    tags: [managed-services, tradeoffs, cost]
    question: |
      When engineers say self-hosting a database is "cheaper," what is the most important cost
      they usually underestimate?
    options:
      - The cost of the SQL language itself
      - The cost of writing application code
      - Network cable and rack space in the cloud
      - On-call engineering time and operational risk
    answer: 3
    explanation: |
      The instance bill is often lower for self-hosting, but the dominant real cost is engineer
      time and operational risk (patching, backups, 24/7 on-call for failover). Small teams
      usually come out ahead on managed services once that's accounted for.
    ref: "concepts.md#managed-vs-self-hosted-services"

  - id: cloud-platforms-and-managed-services-015
    difficulty: intermediate
    tags: [managed-services, scenario, decision]
    question: |
      A five-person startup needs a production Postgres database. Which reasoning is
      strongest?
    options:
      - Self-host on EC2 — the raw instance bill is always cheaper than any managed database
      - Always self-host to avoid all vendor lock-in and keep full control over every version
      - Use managed (RDS/Cloud SQL); self-host only for an unsupported feature/scale/compliance need plus ops capacity
      - Use a SaaS analytics product instead of running any transactional database at all
    answer: 2
    explanation: |
      The senior answer defaults to managed for a small team (offloads backups/failover/
      patching so they can ship) and reserves self-hosting for concrete needs — unsupported
      version/feature, extreme-scale cost, or compliance — and only when ops capacity exists.
    ref: "concepts.md#managed-vs-self-hosted-services"

  - id: cloud-platforms-and-managed-services-016
    difficulty: advanced
    tags: [managed-services, lock-in, tradeoffs]
    question: |
      Which is a legitimate reason to self-host a service (e.g. Kafka) instead of using the
      cloud's managed equivalent?
    options:
      - You need a plugin/version the managed service doesn't support and you have ops capacity
      - Self-hosting is guaranteed to deliver strictly higher availability than any managed option
      - Managed services expose no configuration knobs and can never be tuned for your workload
      - Self-hosting always removes the need to take and test your own backups
    answer: 0
    explanation: |
      A valid self-host driver is needing a version/feature/plugin the managed offering lacks
      (or extreme-scale cost, or strict compliance) combined with the ops capacity to run it.
      Self-hosting is not inherently more available and does not remove backup needs.
    ref: "concepts.md#managed-vs-self-hosted-services"

  - id: cloud-platforms-and-managed-services-017
    difficulty: beginner
    tags: [big-three, equivalents, object-storage]
    question: |
      Which set correctly maps the "object storage" primitive across AWS, GCP, and Azure?
    options:
      - S3 / Cloud Storage / Blob Storage
      - EC2 / Compute Engine / Virtual Machines
      - RDS / Cloud SQL / Azure SQL
      - Lambda / Cloud Functions / Azure Functions
    answer: 0
    explanation: |
      Object storage is S3 (AWS), Cloud Storage (GCP), and Blob Storage (Azure). The other
      rows map compute (EC2/GCE/VMs), managed relational DB, and serverless functions.
    ref: "concepts.md#the-big-three-aws-gcp-azure-and-core-equivalents"

  - id: cloud-platforms-and-managed-services-018
    difficulty: beginner
    tags: [big-three, kubernetes]
    question: |
      Which service is the managed Kubernetes offering on Google Cloud?
    options:
      - EKS
      - AKS
      - GKE
      - ECS
    answer: 2
    explanation: |
      GKE (Google Kubernetes Engine) is GCP's managed Kubernetes. EKS is AWS, AKS is Azure,
      and ECS is AWS's own (non-Kubernetes) container orchestrator.
    ref: "concepts.md#the-big-three-aws-gcp-azure-and-core-equivalents"

  - id: cloud-platforms-and-managed-services-019
    difficulty: intermediate
    tags: [big-three, serverless, equivalents]
    question: |
      An architect describes a design using "a serverless function store triggered by object
      uploads." Which trio are the equivalent function services across the big three?
    options:
      - Lambda / Cloud Functions / Azure Functions
      - Amazon DynamoDB / Firestore / Cosmos DB
      - AWS VPC / Google VPC / Azure VNet
      - AWS IAM / Cloud IAM / Azure Entra ID
    answer: 0
    explanation: |
      Serverless functions are Lambda (AWS), Cloud Functions (GCP), and Azure Functions
      (Azure). The other rows are NoSQL databases, virtual networks, and identity services
      respectively.
    ref: "concepts.md#the-big-three-aws-gcp-azure-and-core-equivalents"

  - id: cloud-platforms-and-managed-services-020
    difficulty: intermediate
    tags: [big-three, interview, primitives]
    question: |
      An interviewer says "use any cloud you like." What is the best way to present your
      architecture?
    options:
      - Commit to one vendor's brand names throughout and refuse to translate any component to another cloud
      - Refuse to sketch anything until the interviewer first commits to a specific cloud and its exact service tier
      - Reason in generic primitives (object store, managed DB, L7 LB) and name a concrete service as an example
      - Avoid naming any concrete service and describe every component purely with the vendor's internal product codenames
    answer: 2
    explanation: |
      Reasoning in primitives ("an object store — say S3") shows you understand the concept
      rather than one vendor's branding, and it maps cleanly onto any cloud. Naming an example
      keeps it concrete.
    ref: "concepts.md#the-big-three-aws-gcp-azure-and-core-equivalents"

  - id: cloud-platforms-and-managed-services-021
    difficulty: beginner
    tags: [regions, azs, definition]
    question: |
      What is an Availability Zone (AZ)?
    options:
      - One or more discrete datacenters within a region with independent power, cooling, and networking
      - A CDN edge location placed close to end users purely to cache static content and terminate TLS near them
      - A geographic region sited on a different continent that replicates every other region's data synchronously
      - A purely logical billing boundary with no physical datacenter behind it, used only to group invoices
    answer: 0
    explanation: |
      An AZ is one or more physically isolated datacenters within a region, with independent
      power/cooling/networking, interconnected by low-latency links so a single datacenter
      failure doesn't take the whole region down.
    ref: "concepts.md#regions-availability-zones-and-high-availability"

  - id: cloud-platforms-and-managed-services-022
    difficulty: intermediate
    tags: [ha, azs, gotcha, scenario]
    question: |
      A team runs three instances of their service, all in the same Availability Zone, behind
      a load balancer. Is this a highly available deployment?
    options:
      - Yes — running three separate instances is by itself sufficient for HA no matter where they sit
      - No — an AZ (datacenter) failure takes all three down; HA requires spreading across AZs
      - Yes — the load balancer health-checks the instances, so it guarantees HA regardless of their placement
      - No — real HA is impossible on one provider and requires spanning at least two separate cloud vendors
    answer: 1
    explanation: |
      Instance count alone isn't HA. All three in one AZ share a failure domain — one
      datacenter failure kills them all. Real HA spreads instances across multiple AZs.
      Multi-cloud is not required for HA.
    ref: "concepts.md#regions-availability-zones-and-high-availability"

  - id: cloud-platforms-and-managed-services-023
    difficulty: intermediate
    tags: [regions, multi-region, dr]
    question: |
      What does a multi-REGION deployment protect against that a multi-AZ deployment does not?
    options:
      - A single instance crashing while the rest of the fleet in that same datacenter keeps serving traffic
      - A whole-region outage (and it also serves users globally)
      - A misconfigured security group rule that accidentally blocks the service's inbound listener port
      - A single expired TLS certificate on the public load balancer that breaks HTTPS termination
    answer: 1
    explanation: |
      Multi-AZ protects against a single datacenter/AZ failure; multi-region protects against
      an entire region going down and enables serving users closer geographically — at the
      cost of cross-region latency, replication complexity, and money.
    ref: "concepts.md#regions-availability-zones-and-high-availability"

  - id: cloud-platforms-and-managed-services-024
    difficulty: intermediate
    tags: [regions, selection, latency]
    question: |
      Which factors most directly drive the choice of which REGION to deploy in?
    options:
      - Latency to users, data residency/compliance, and cost
      - The maximum number of AZs a single load balancer instance is allowed to attach to in that region
      - The programming language and web framework the application happens to be written in
      - The console theme and UI color scheme the provider shows for resources in that region
    answer: 0
    explanation: |
      Region selection is driven by proximity/latency to users, legal data-residency and
      compliance requirements, and per-region pricing differences. AZ count is a secondary
      consideration within a region.
    ref: "concepts.md#regions-availability-zones-and-high-availability"

  - id: cloud-platforms-and-managed-services-025
    difficulty: advanced
    tags: [ha, managed-db, multi-az]
    question: |
      A managed relational database is configured in "Multi-AZ" mode. What does this
      primarily provide?
    options:
      - A synchronous standby in another AZ with automatic failover
      - A globally distributed active-active write cluster accepting writes in every region at once
      - Automatically provisioned read replicas placed in every region worldwide for local reads
      - Automatic downsizing of the primary instance class overnight to cut the compute bill
    answer: 0
    explanation: |
      Multi-AZ for a managed DB keeps a synchronous standby in a different AZ and fails over
      automatically if the primary's AZ fails. It's HA within a region, not a global
      active-active or a cost-optimization feature.
    ref: "concepts.md#regions-availability-zones-and-high-availability"

  - id: cloud-platforms-and-managed-services-026
    difficulty: beginner
    tags: [lock-in, definition]
    question: |
      What is "vendor lock-in" in a cloud context?
    options:
      - A security feature that pins your account to a single region so resources can never be created elsewhere
      - A billing discount you unlock by contractually committing all future workloads to one vendor for a term
      - The cost/difficulty of switching providers due to dependence on proprietary services and APIs
      - A compliance requirement that forces all of an account's data to be stored inside one Availability Zone
    answer: 2
    explanation: |
      Vendor lock-in is the switching cost created by depending on a provider's proprietary
      services and APIs — the deeper you adopt them, the harder and more expensive it is to
      move.
    ref: "concepts.md#cloud-agnostic-vs-vendor-lock-in"

  - id: cloud-platforms-and-managed-services-027
    difficulty: intermediate
    tags: [lock-in, cloud-agnostic, tradeoffs]
    question: |
      What is the core trade-off of building a strictly cloud-agnostic (portable)
      architecture?
    options:
      - It is always cheaper and faster to build because you reuse one codebase unchanged on every cloud
      - You gain portability but pay continuously in extra engineering and forgo the best native services
      - It eliminates all operational burden by pushing every abstraction layer onto the provider to run for you
      - It removes the need for high-availability design because a portable app can always be redeployed elsewhere
    answer: 1
    explanation: |
      Staying portable preserves the option to move but costs you continuously: you build/
      operate portable abstraction layers and can't use each cloud's best native managed
      services. It's a deliberate optionality-vs-velocity trade.
    ref: "concepts.md#cloud-agnostic-vs-vendor-lock-in"

  - id: cloud-platforms-and-managed-services-028
    difficulty: advanced
    tags: [lock-in, interview, judgment]
    question: |
      Which is the most senior way to reason about vendor lock-in for a given service?
    options:
      - Refuse to adopt anything proprietary under any circumstances, even where a native service is far superior
      - Treat lock-in as irrelevant and always pick the most proprietary option to maximize short-term velocity
      - Weigh switching cost against velocity gained per service and decide deliberately
      - Pick whichever service has the longest, most feature-loaded name, assuming it must be the most capable
    answer: 2
    explanation: |
      The mature stance rejects both dogmatic extremes: evaluate each service's switching cost
      versus the velocity/capability it buys, accept lock-in where the payoff is large and
      migration unlikely, and isolate provider-specific code so future moves are bounded.
    ref: "concepts.md#cloud-agnostic-vs-vendor-lock-in"

  - id: cloud-platforms-and-managed-services-029
    difficulty: intermediate
    tags: [lock-in, middle-ground, portability]
    question: |
      Which practice reflects the pragmatic middle ground most teams take on lock-in?
    options:
      - Maintain a full parallel rewrite of the entire application for every cloud and run them all simultaneously
      - Use portable interfaces where cheap (containers, standard SQL, Terraform) and isolate proprietary code behind abstractions
      - Ban all managed services outright and self-host every database, queue, and cache to stay fully neutral
      - Store all application state only in provider-proprietary formats to squeeze out maximum short-term speed
    answer: 1
    explanation: |
      The common middle ground uses portable interfaces where the cost is low (containers,
      Kubernetes, standard SQL, Terraform/OpenTofu), accepts lock-in where a native service is
      dramatically better, and wraps provider-specific code so a migration is bounded.
    ref: "concepts.md#cloud-agnostic-vs-vendor-lock-in"

  - id: cloud-platforms-and-managed-services-030
    difficulty: beginner
    tags: [multi-cloud, hybrid, definitions]
    question: |
      What distinguishes "hybrid cloud" from "multi-cloud"?
    options:
      - They are exactly the same thing and the two terms are used interchangeably by every provider
      - Hybrid combines public cloud with on-prem/private datacenter; multi-cloud uses more than one public cloud
      - Hybrid means spreading a single provider's workload across two regions for disaster recovery only
      - Multi-cloud means using only one provider but replicating its resources across multiple regions
    answer: 1
    explanation: |
      Hybrid cloud mixes public cloud with on-prem/private infrastructure; multi-cloud uses
      more than one public cloud provider. Multiple regions of a single provider is neither.
    ref: "concepts.md#multi-cloud-and-hybrid-cloud-reality"

  - id: cloud-platforms-and-managed-services-031
    difficulty: intermediate
    tags: [multi-cloud, reality, costs]
    question: |
      Which is a real cost/downside of running a single application active-active across two
      public clouds?
    options:
      - It makes load balancers impossible to use because traffic can never cross between two provider networks
      - It automatically halves your total cloud bill by letting each provider undercut the other on every request
      - It removes the need for any IAM configuration since a shared federated identity spans both clouds by default
      - Cross-cloud egress charges, lowest-common-denominator architecture, and doubled operational surface
    answer: 3
    explanation: |
      True active-active multi-cloud for one app is expensive: you pay cross-cloud egress, you
      must architect to the lowest common denominator (forgoing best native services), and you
      double the operational surface (two IAM/network models, two on-call skill sets).
    ref: "concepts.md#multi-cloud-and-hybrid-cloud-reality"

  - id: cloud-platforms-and-managed-services-032
    difficulty: advanced
    tags: [multi-cloud, interview, justification]
    question: |
      Which is the STRONGEST justification for a deliberate multi-cloud strategy?
    options:
      - A vague desire for "no single point of failure" with no specific outage scenario actually identified
      - A concrete driver: regulatory/sovereignty rules, negotiating leverage, or a unique best-of-breed service
      - It is inherently more reliable than a single well-architected cloud because two providers rarely fail together
      - It is cheaper because you can play the vendors off against each other and re-bid every request in real time
    answer: 1
    explanation: |
      Multi-cloud should be justified by a concrete driver — compliance/sovereignty, avoiding
      one vendor's leverage, or a unique service. "Reliability" alone is weak: a well-designed
      multi-AZ (or multi-region) single-cloud deployment already gives strong HA, and
      multi-cloud often adds failure modes.
    ref: "concepts.md#multi-cloud-and-hybrid-cloud-reality"

  - id: cloud-platforms-and-managed-services-033
    difficulty: advanced
    tags: [multi-cloud, reliability, gotcha]
    question: |
      An architect proposes active-active multi-cloud "so we have no single point of failure."
      What is the best critique?
    options:
      - Multi-cloud is banned by regulators in most regions, so the design cannot legally be built at all
      - A multi-AZ (or multi-region) single-cloud design already gives strong HA; multi-cloud often adds complexity and failure modes rather than net availability
      - Multi-cloud always reduces end-user latency because requests are automatically routed to the nearer provider
      - Single-cloud deployments are technically capped at one AZ, so only a second cloud can add redundancy
    answer: 1
    explanation: |
      Spreading across AZs (and optionally regions) on one cloud already delivers strong HA.
      Layering a second cloud for reliability commonly introduces more complexity, more moving
      parts, and egress cost — often adding failure modes rather than removing them.
    ref: "concepts.md#multi-cloud-and-hybrid-cloud-reality"

  - id: cloud-platforms-and-managed-services-034
    difficulty: intermediate
    tags: [multi-cloud, reality, practice]
    question: |
      In practice, most real-world "multi-cloud" looks like which of the following?
    options:
      - A single workload running fully active-active across two clouds with synchronized state for instant failover
      - Every service in the estate duplicated identically on all three hyperscalers and kept in constant lockstep
      - Workload-partitioned (app on cloud A, analytics on cloud B) or acquired accidentally
      - One production VM image copied to a second cloud on a nightly schedule as a cold standby for the whole app
    answer: 2
    explanation: |
      Genuine single-workload active-active multi-cloud is rare and costly. Most "multi-cloud"
      is workload-partitioned (different systems on different clouds) or accumulated through
      acquisitions and team choices — not one app spanning clouds for failover.
    ref: "concepts.md#multi-cloud-and-hybrid-cloud-reality"

  - id: cloud-platforms-and-managed-services-035
    difficulty: beginner
    tags: [managed-cicd, services]
    question: |
      Which set are AWS's first-party CI/CD building blocks?
    options:
      - Cloud Build, Deployment Manager, and Artifact Registry
      - Azure Pipelines, Bicep, and Azure DevOps Boards
      - CodeBuild, CodeDeploy, and CodePipeline
      - GitHub Actions, GitLab CI, and CircleCI
    answer: 2
    explanation: |
      AWS's native delivery tooling is CodeCommit/CodeBuild/CodeDeploy/CodePipeline (with
      CloudFormation/CDK for IaC). Cloud Build is GCP, Azure Pipelines/Bicep is Azure, and
      Actions/GitLab CI are provider-neutral tools.
    ref: "concepts.md#managed-cicd-and-iac-services"

  - id: cloud-platforms-and-managed-services-036
    difficulty: intermediate
    tags: [managed-cicd, oidc, secrets]
    question: |
      What is the recommended modern pattern for letting a CI/CD pipeline authenticate to a
      cloud, instead of storing long-lived cloud access keys as CI secrets?
    options:
      - Hard-code the root account's long-lived access keys directly in the pipeline YAML so any job can use them
      - Use OIDC federation so the pipeline assumes a short-lived cloud role
      - Email the long-lived credentials to each engineer so they can paste them into their pipeline runs by hand
      - Disable authentication entirely for the CI service account and rely on the network perimeter to block misuse
    answer: 1
    explanation: |
      OIDC federation lets the pipeline exchange a short-lived identity token for temporary
      cloud credentials (assuming a role), eliminating long-lived static keys in CI secrets.
      Deeper secret-injection mechanics live in this domain's secrets-management topic.
    ref: "concepts.md#managed-cicd-and-iac-services"

  - id: cloud-platforms-and-managed-services-037
    difficulty: intermediate
    tags: [managed-cicd, iac, tradeoffs]
    question: |
      Which statement best captures the trade-off between provider-native IaC (CloudFormation/
      ARM/Bicep) and Terraform/OpenTofu?
    options:
      - Native IaC is cloud-agnostic; Terraform only works on one cloud
      - Native IaC integrates deeply with one cloud but locks you in; Terraform is multi-cloud but you manage remote state/locking
      - The two are functionally identical, so the choice never affects portability, state handling, or drift detection
      - Terraform needs no configuration files at all because it auto-discovers and imports every existing cloud resource itself
    answer: 1
    explanation: |
      Provider-native IaC integrates tightly with its cloud (managed state, native drift
      detection) but locks you in; Terraform/OpenTofu is cloud-agnostic and multi-provider but
      you host and lock remote state. It's the same lock-in-vs-portability trade applied to IaC.
    ref: "concepts.md#managed-cicd-and-iac-services"

  - id: cloud-platforms-and-managed-services-038
    difficulty: intermediate
    tags: [managed-cicd, iac, equivalents]
    question: |
      Which is Azure's native infrastructure-as-code language/tooling?
    options:
      - CloudFormation / CDK
      - Deployment Manager
      - ARM templates / Bicep
      - Cloud Build
    answer: 2
    explanation: |
      Azure's native IaC is ARM templates and the higher-level Bicep DSL. CloudFormation/CDK is
      AWS, Deployment Manager is GCP, and Cloud Build is GCP's build service.
    ref: "concepts.md#managed-cicd-and-iac-services"

  - id: cloud-platforms-and-managed-services-039
    difficulty: beginner
    tags: [finops, tagging, cost]
    question: |
      Why is consistent resource tagging (team, env, cost-center, service) foundational to
      cloud cost management?
    options:
      - Tags automatically apply a per-resource discount, lowering the hourly rate the provider bills for each one
      - Tags are a mandatory prerequisite for a resource to boot, and the provider refuses to start any untagged instance
      - Tags make spend attributable, so you can tell which team/service is costing what
      - Tags encrypt the resource's data at rest using a provider-managed key derived from each tag's key/value pair
    answer: 2
    explanation: |
      Tagging attributes spend to teams/services/environments, which is the foundation of all
      cost visibility — without it you can't tell who spent what. Tags don't change price, gate
      boot, or provide encryption.
    ref: "concepts.md#cost-management-and-finops-basics"

  - id: cloud-platforms-and-managed-services-040
    difficulty: intermediate
    tags: [finops, spot, gotcha]
    question: |
      Spot / preemptible instances offer up to ~90% savings. Which workload are they
      appropriate for?
    options:
      - A stateful primary production database, since the provider guarantees spot capacity is never reclaimed mid-transaction
      - Fault-tolerant, interruptible workloads like batch jobs, CI runners, or stateless workers
      - A latency-critical payment API's main request path, because spot instances are pinned and exempt from preemption
      - The only replica of critical data, relying on spot's built-in durable snapshotting to survive any reclamation event
    answer: 1
    explanation: |
      Spot/preemptible capacity can be reclaimed by the provider with little notice, so it
      suits only interruptible, fault-tolerant workloads (batch, CI, stateless workers). Using
      it for a stateful primary or latency-critical path risks losing the workload.
    ref: "concepts.md#cost-management-and-finops-basics"

  - id: cloud-platforms-and-managed-services-041
    difficulty: intermediate
    tags: [finops, purchase-options, matching]
    question: |
      For a steady, predictable baseline of always-on compute, which purchase option minimizes
      cost?
    options:
      - On-demand at the full published hourly rate, which is the cheapest option for any workload that runs continuously
      - Spot/preemptible instances, since their deep discount also applies unchanged to steady always-on baseline capacity
      - Reserved Instances / Savings Plans / Committed Use (1–3 year commitment)
      - A new per-seat SaaS subscription that resells the same compute to you at a lower effective rate than committed use
    answer: 2
    explanation: |
      Predictable, always-on baseline load is the ideal fit for committed-use discounts
      (Reserved Instances / Savings Plans), which trade a 1–3 year commitment for up to ~70%
      off. On-demand overpays for steady load; spot risks reclamation.
    ref: "concepts.md#cost-management-and-finops-basics"

  - id: cloud-platforms-and-managed-services-042
    difficulty: intermediate
    tags: [finops, egress, gotcha]
    question: |
      Which is the classic "hidden" charge that surprises teams on their cloud bill?
    options:
      - Per-gigabyte charges for data ingress (traffic coming into the cloud), which quietly dominate most bills
      - A large flat monthly fee levied just for keeping an account open, billed even when every resource is idle
      - Metered charges for reading the provider's documentation and console help pages, priced per page viewed
      - Data transfer OUT (egress), including cross-region and often cross-AZ traffic
    answer: 3
    explanation: |
      Ingress is usually free or cheap, but egress — data out to the internet, and frequently
      cross-region and cross-AZ transfer — is billed and often surprises teams with chatty
      traffic or large downloads. Keep traffic in-AZ and front heavy egress with a CDN.
    ref: "concepts.md#cost-management-and-finops-basics"

  - id: cloud-platforms-and-managed-services-043
    difficulty: advanced
    tags: [finops, scenario, investigation]
    question: |
      Your monthly cloud bill suddenly doubled. What is the best FIRST step to investigate?
    options:
      - Immediately delete the largest instances to stop the bleeding, before checking what they actually run
      - Switch the entire company to a different cloud provider this week to escape the higher rates outright
      - Attribute the spend using tags/cost tooling to find which service or team grew
      - Turn off all production traffic until the finance team can manually reconcile every line of the invoice
    answer: 2
    explanation: |
      Start with visibility: use tags and cost tooling to attribute the increase to a specific
      service/team, then check egress spikes and orphaned resources, then rightsize and commit
      steady load, and finally add budgets/policy. Blindly deleting or migrating is reckless.
    ref: "concepts.md#cost-management-and-finops-basics"

  - id: cloud-platforms-and-managed-services-044
    difficulty: beginner
    tags: [finops, rightsizing]
    question: |
      "Rightsizing" in cloud cost optimization means:
    options:
      - Buying the largest possible instance class up front so there is permanent headroom for any future spike
      - Matching instance size to actual measured utilization to cut waste
      - Permanently deleting all non-production dev, test, and staging environments to remove their entire cost line
      - Moving every workload to serverless regardless of its traffic shape, on the assumption it is always cheaper
    answer: 1
    explanation: |
      Rightsizing means using utilization metrics to match instance size to real demand,
      eliminating the waste of over-provisioned, idle-heavy instances — the most common source
      of cloud overspend.
    ref: "concepts.md#cost-management-and-finops-basics"

  - id: cloud-platforms-and-managed-services-045
    difficulty: intermediate
    tags: [finops, definition]
    question: |
      What is "FinOps"?
    options:
      - A vendor tool that automatically negotiates and re-signs your cloud contracts to secure the lowest published rates
      - A specific type of reserved instance that bundles a fixed monthly cost-reporting dashboard into its hourly price
      - The finance department's purchase-order approval workflow that must sign off before any cloud resource is created
      - A practice bringing engineering, finance, and product together to manage cloud cost as an ongoing engineering concern
    answer: 3
    explanation: |
      FinOps is a cultural/operational practice (visibility → optimization → governance) that
      unites engineering, finance, and product to treat cloud cost as a continuous engineering
      responsibility, not a one-off procurement task.
    ref: "concepts.md#cost-management-and-finops-basics"

  - id: cloud-platforms-and-managed-services-046
    difficulty: advanced
    tags: [service-models, scenario, faas-limits]
    question: |
      A batch job routinely runs for 45 minutes per execution. Why is a typical FaaS/
      serverless function a poor fit?
    options:
      - Serverless functions cannot be triggered on a fixed schedule, so a recurring batch job could never start them
      - Functions have execution-time limits, so a 45-minute run may be cut off
      - Serverless functions have no mechanism to read input data from object storage, databases, or an event payload
      - Functions are physically unable to write any logs, so a long batch job would run with no observability at all
    answer: 1
    explanation: |
      FaaS platforms impose maximum execution durations, so a long-running 45-minute job can
      exceed the limit. Long batch work is better on containers/VMs or a managed batch service.
      Serverless can be scheduled, read data, and log fine.
    ref: "concepts.md#cloud-service-models-iaas-paas-saas-faas"

  - id: cloud-platforms-and-managed-services-047
    difficulty: intermediate
    tags: [big-three, identity, equivalents]
    question: |
      Which service provides identity and access management on Microsoft Azure?
    options:
      - IAM, the identity service Azure adopted after acquiring the name from AWS for its own directory
      - Cloud IAM, which is the identity and access service branded identically across Azure and Google Cloud
      - Entra ID (formerly Azure AD) with RBAC
      - Key Vault, Azure's central directory service that stores every user and group as well as its role assignments
    answer: 2
    explanation: |
      Azure identity is Entra ID (formerly Azure Active Directory) combined with RBAC. AWS
      calls it IAM, GCP calls it Cloud IAM, and Key Vault is Azure's secrets store, not its
      identity service.
    ref: "concepts.md#the-big-three-aws-gcp-azure-and-core-equivalents"

  - id: cloud-platforms-and-managed-services-048
    difficulty: advanced
    tags: [ha, cost, scenario, tradeoffs]
    question: |
      A team wants higher availability but is cost-conscious. Which is the most sensible first
      step before considering multi-region or multi-cloud?
    options:
      - Immediately deploy active-active across two cloud providers, accepting cross-cloud egress as the cheapest path to HA
      - Spread instances and the managed database across multiple AZs in one region
      - Move every workload to spot instances to save money, treating their reclamation risk as irrelevant to availability
      - Run everything in a single AZ but buy much bigger instances, on the theory that larger hosts rarely fail together
    answer: 1
    explanation: |
      Multi-AZ within one region is the standard, cost-effective HA baseline — it survives a
      datacenter failure without the egress cost and doubled complexity of multi-region or
      multi-cloud. Bigger single-AZ instances don't add HA, and spot reduces availability.
    ref: "concepts.md#regions-availability-zones-and-high-availability"
