topic: "CI/CD Pipeline Concepts"
domain: devops-cicd
topic_slug: cicd-pipeline-concepts
version: 1

questions:
  - id: cicd-pipeline-concepts-001
    difficulty: beginner
    tags: [deployment-pipeline, definition]
    question: |
      In Humble & Farley's *Continuous Delivery*, what is a "deployment pipeline"?
    options:
      - "A dedicated network appliance that streams compiled build artifacts directly onto production servers over a persistent connection"
      - "An automated implementation of the build, deploy, test, and release process that gives everyone visibility into a change's path from commit to release"
      - "A branching strategy that keeps release branches strictly separate from development branches until a scheduled merge window"
      - "A read-only dashboard that only displays the version number currently deployed to production and nothing else"
    answer: 1
    explanation: |
      The deployment pipeline is defined as an automated implementation of the application's
      build, deploy, test, and release process. Each commit is a release candidate that the
      pipeline tries to disprove as cheaply as possible, and it gives the whole team
      visibility into the flow of changes.
    ref: "concepts.md#the-deployment-pipeline-humble--farley"

  - id: cicd-pipeline-concepts-002
    difficulty: beginner
    tags: [pipeline-stages, ordering]
    question: |
      Why are the fast unit tests and compile step ("commit stage") placed at the start of a
      pipeline rather than after the integration and end-to-end tests?
    options:
      - "Because unit tests require a snapshot of live production data that the runner can only fetch during the very first stage of the run"
      - "Because integration and end-to-end stages run on isolated agents that are technically blocked from cloning the source code repository"
      - "To deliberately make the pipeline run more slowly and thoroughly so that every commit is examined for the maximum possible duration"
      - "So the cheapest, fastest checks fail first, giving fast feedback and not wasting expensive later stages on a doomed change"
    answer: 3
    explanation: |
      Stages are ordered fastest/cheapest first. A change that fails compilation or unit
      tests should be rejected in seconds, before it consumes slow, expensive integration/E2E
      stages. This is the "fail fast, fail cheap" principle behind fast feedback.
    ref: "concepts.md#pipeline-stages-build-test-package-scan-deploy"

  - id: cicd-pipeline-concepts-003
    difficulty: beginner
    tags: [ci, principles]
    question: |
      Which practice is central to Continuous Integration?
    options:
      - "Developers keep long-lived feature branches and merge quarterly"
      - "Only the designated release manager holds the credentials to trigger the build, so integration is centralized on one person"
      - "The build is deliberately scheduled to run just once a week overnight to batch all of the day's accumulated changes together"
      - "Developers integrate their work into a shared mainline frequently, each integration verified by an automated build and tests"
    answer: 3
    explanation: |
      CI is the practice of merging into a shared mainline frequently (at least daily), with
      each integration verified by an automated self-testing build. Frequent small merges
      keep integration problems small and easy to fix.
    ref: "concepts.md#continuous-integration-principles"

  - id: cicd-pipeline-concepts-004
    difficulty: intermediate
    tags: [ci, green-build, culture]
    question: |
      Under CI discipline, what is the correct response when the mainline build turns red?
    options:
      - "Continue building new features on top of it; someone will fix it eventually"
      - "Revert the entire day's work automatically without investigation"
      - "Switch everyone to a private branch until the next release"
      - "Fixing the broken build becomes the team's top priority; don't build on a broken mainline"
    answer: 3
    explanation: |
      A broken mainline blocks the whole team, so fixing (or reverting) it is the top
      priority. Building on top of a red build compounds the problem. Keeping the build green
      is a core CI principle.
    ref: "concepts.md#continuous-integration-principles"

  - id: cicd-pipeline-concepts-005
    difficulty: intermediate
    tags: [ci, anti-pattern, trunk-based]
    question: |
      A team runs a CI server, but developers work on feature branches that live for three to
      four weeks before merging. Why is this NOT really continuous integration?
    options:
      - "Integration is deferred for weeks, so you still get large, painful merges — CI is a behavior (integrate often), not just a tool"
      - "CI is only genuine when it runs on a paid commercial CI server; free or self-hosted runners don't satisfy the definition"
      - "CI strictly forbids the creation of any branches whatsoever, requiring every developer to commit directly to a single working copy"
      - "The CI server is technically limited to building only the default branch and cannot be pointed at any feature branch"
    answer: 0
    explanation: |
      CI is the *practice* of integrating frequently, not merely owning a CI server.
      Long-lived branches defer integration, producing exactly the big, risky merges CI aims
      to avoid ("continuous isolation"). Trunk-based development embodies real CI.
    ref: "concepts.md#continuous-integration-principles"

  - id: cicd-pipeline-concepts-006
    difficulty: intermediate
    tags: [cd, delivery, deployment, definitions]
    question: |
      What distinguishes Continuous Delivery from Continuous Deployment?
    options:
      - "Continuous Delivery deploys to prod automatically; Continuous Deployment requires manual approval"
      - "Continuous Delivery keeps every change deployable with a manual release gate; Continuous Deployment removes that gate so every green change goes to prod automatically"
      - "They are simply two interchangeable names for the exact same process and the industry uses them at random"
      - "Continuous Delivery applies only to packaged libraries, whereas Continuous Deployment applies only to long-running network services"
    answer: 1
    explanation: |
      Continuous Delivery automates everything up to a deployable state but keeps a human
      decision (button press) to release to prod. Continuous Deployment is the superset that
      removes that manual gate: every change passing the pipeline is deployed to production
      automatically.
    ref: "concepts.md#ci-vs-continuous-delivery-vs-continuous-deployment"

  - id: cicd-pipeline-concepts-007
    difficulty: intermediate
    tags: [cd, deployment, prerequisites]
    question: |
      True continuous deployment (every green change auto-shipped to prod) most depends on
      which combination?
    options:
      - "Weekly release-planning meetings and a change advisory board that signs off each production push"
      - "A single large release branch that accumulates changes and is merged to the mainline once a month"
      - "High automated-test confidence, strong monitoring, and fast rollback (often with canary/feature flags)"
      - "Disabling all pipeline gates including the automated test suite so changes flow straight through unimpeded"
    answer: 2
    explanation: |
      Without a human gate, safety must come from automation: comprehensive tests, robust
      production monitoring, and fast rollback — typically paired with canary releases and
      feature flags to limit blast radius.
    ref: "concepts.md#ci-vs-continuous-delivery-vs-continuous-deployment"

  - id: cicd-pipeline-concepts-008
    difficulty: beginner
    tags: [artifacts, definition]
    question: |
      In a CI/CD pipeline, what is an "artifact"?
    options:
      - "A residual bug left over from a previous release that resurfaces when the new build is deployed"
      - "The concrete, versioned output of the build (e.g., a jar, container image, or zipped bundle) that later stages deploy"
      - "An inline documentation comment embedded in the pipeline YAML file to describe a build step"
      - "A locally cached copy of the git commit history kept on the runner to speed up checkouts"
    answer: 1
    explanation: |
      An artifact is the deployable output the build produces — a jar, container image,
      tarball, Lambda zip, etc. Downstream stages consume the artifact the build produced
      rather than rebuilding it.
    ref: "concepts.md#artifacts-flowing-between-stages"

  - id: cicd-pipeline-concepts-009
    difficulty: intermediate
    tags: [artifacts, promotion, immutability]
    question: |
      Why is promoting a mutable reference like the container tag `latest` between staging and
      prod considered an anti-pattern?
    options:
      - "The `latest` tag is a reserved keyword owned by the container registry and images carrying it are rejected at deploy time"
      - "Staging and prod can end up running different bytes; you should promote an immutable version or content digest so the tested bits equal the shipped bits"
      - "Mutable tags are pulled uncompressed and are therefore measurably slower to download than immutable digest-pinned images"
      - "The literal word 'latest' is disallowed by production admission controllers and must be renamed before promotion"
    answer: 1
    explanation: |
      A tag like `latest` can point at different images over time, so staging and prod may run
      different bytes — breaking the guarantee that what you tested is what you ship. Promote
      an immutable version or, better, a content digest (image@sha256:...).
    ref: "concepts.md#artifacts-flowing-between-stages"

  - id: cicd-pipeline-concepts-010
    difficulty: intermediate
    tags: [artifacts, storage, registry]
    question: |
      What is the role of an artifact repository (e.g., Nexus, Artifactory, a container
      registry) versus short-lived pipeline artifacts?
    options:
      - "It stores immutable, versioned artifacts durably so deploys across separate runs and environments can pull the same bits"
      - "It fully replaces the need for version control of source code by storing every commit as a binary snapshot"
      - "It only stores test logs and code-coverage reports temporarily, discarding them after each pipeline run completes"
      - "It compiles the source code on demand at deploy time so each environment gets a freshly built binary"
    answer: 0
    explanation: |
      Short-lived pipeline artifacts pass files between jobs of a single run. An artifact
      repository stores immutable versioned artifacts durably, enabling build-once/deploy-many
      across separate pipeline runs and multiple environments.
    ref: "concepts.md#artifacts-flowing-between-stages"

  - id: cicd-pipeline-concepts-011
    difficulty: intermediate
    tags: [build-once, promotion, 12-factor]
    question: |
      What does the "build once, deploy many" principle require?
    options:
      - "Rebuilding the artifact separately for each environment with environment-specific compiler flags"
      - "Building the artifact directly inside the production environment to guarantee it is always freshly compiled against live libraries"
      - "Deploying the same artifact but recompiling dependencies in each environment"
      - "Building the deployable artifact exactly once and promoting that same immutable artifact through dev, staging, and prod, with per-environment behavior supplied via configuration"
    answer: 3
    explanation: |
      Build once, deploy many means one immutable artifact is promoted through all
      environments; environment-specific behavior comes from injected config (12-Factor
      factor III), not from rebuilding. This guarantees the tested bits are the shipped bits.
    ref: "concepts.md#build-once-deploy-many-artifact-promotion"

  - id: cicd-pipeline-concepts-012
    difficulty: advanced
    tags: [build-once, scenario, correctness]
    question: |
      A team's pipeline recompiles the app from source in a separate job for each environment
      (dev, staging, prod) using floating dependency versions. What is the main risk?
    options:
      - "The pipeline scheduler will refuse to run more than one compile job at a time and will serialize the environments indefinitely"
      - "Prod runs a binary that was never the one validated in staging, because a floating dependency or timestamp can differ, silently invalidating prior testing"
      - "Environment-specific configuration can no longer be injected at deploy time once the app is recompiled per environment"
      - "It becomes technically impossible to store any of the resulting artifacts in a shared binary registry for later reuse"
    answer: 1
    explanation: |
      Rebuilding per environment with unpinned (floating) versions means each build can pull
      different dependency bytes, so the prod binary may differ from the staging one that
      passed tests. Build once and promote the same immutable artifact to keep tested == shipped.
    ref: "concepts.md#build-once-deploy-many-artifact-promotion"

  - id: cicd-pipeline-concepts-013
    difficulty: beginner
    tags: [environments, promotion]
    question: |
      In a typical dev → staging → prod flow, what does "promotion" mean?
    options:
      - "Advancing the same artifact to the next environment after it passes that environment's checks"
      - "Giving the developer who authored the change a pay raise once their commit reaches production successfully"
      - "Renaming the artifact with an environment-specific label the moment it lands in the production registry"
      - "Rebuilding the artifact from source with higher compiler optimization flags for each subsequent environment"
    answer: 0
    explanation: |
      Promotion is advancing the same immutable artifact to the next environment (e.g.,
      staging → prod) once it passes that stage's gates. Config differs per environment; the
      artifact does not.
    ref: "concepts.md#environments-and-promotion-dev--staging--prod"

  - id: cicd-pipeline-concepts-014
    difficulty: intermediate
    tags: [environments, staging, fidelity]
    question: |
      Why should a staging environment mirror production as closely as possible?
    options:
      - "So developers can rehearse typing the real production passwords and credentials before the actual release"
      - "Because cloud providers bill at a discounted rate when staging and production run byte-identical configurations"
      - "So the artifact can be recompiled with production-only settings just before it is promoted upward"
      - "The closer staging matches prod (topology, config surface, data shape), the more representative and trustworthy the test signal is, reducing 'works in staging, breaks in prod' incidents"
    answer: 3
    explanation: |
      Staging divergence is a top source of deploy incidents. High-fidelity staging gives
      representative test results; using the same IaC/manifests with only env-specific
      variables minimizes drift.
    ref: "concepts.md#environments-and-promotion-dev--staging--prod"

  - id: cicd-pipeline-concepts-015
    difficulty: intermediate
    tags: [environments, preview, ephemeral]
    question: |
      What is a "preview" (per-PR) environment?
    options:
      - "A read-only mirror of the aggregated production logs exposed for support engineers to inspect"
      - "The final production environment simply renamed for marketing purposes during a launch campaign"
      - "A single shared, long-lived QA server that the whole company queues to use for manual testing"
      - "An ephemeral environment spun up per pull request and torn down on merge, giving per-change isolation for higher-fidelity testing"
    answer: 3
    explanation: |
      Preview/PR environments are created on demand for a single pull request and destroyed
      when it merges/closes, giving each change an isolated, prod-like target to validate
      before merge.
    ref: "concepts.md#environments-and-promotion-dev--staging--prod"

  - id: cicd-pipeline-concepts-016
    difficulty: beginner
    tags: [pipeline-as-code, definition]
    question: |
      What does "pipeline as code" mean?
    options:
      - "Writing the application itself in a specialized programming language that has been optimized for CI/CD pipelines"
      - "Automatically generating the application's source code from a declarative pipeline specification file"
      - "Defining the pipeline in a version-controlled file in the repo (e.g., .gitlab-ci.yml, Jenkinsfile) instead of clicking it together in a server UI"
      - "Storing every pipeline run's execution logs and console output inside the source code repository alongside the code"
    answer: 2
    explanation: |
      Pipeline as code keeps the pipeline definition in a versioned file alongside the code,
      so pipeline changes are reviewed, versioned, and rolled back like any other code —
      unlike opaque UI-configured ("click-ops") jobs.
    ref: "concepts.md#pipeline-as-code"

  - id: cicd-pipeline-concepts-017
    difficulty: intermediate
    tags: [pipeline-as-code, iac, distinction]
    question: |
      How does pipeline-as-code differ from Infrastructure as Code (IaC)?
    options:
      - "They are completely identical; both terms are just alternative names for the Terraform tool itself"
      - "Pipeline-as-code is what provisions the servers and networks, while IaC is the part that runs the unit tests"
      - "Pipeline-as-code defines the build/deploy *process*; IaC (e.g., Terraform) defines the *infrastructure* the app runs on — complementary, both in version control"
      - "IaC is configured through a server's web UI while pipeline-as-code is the only one of the two kept in git"
    answer: 2
    explanation: |
      Pipeline-as-code describes how to build/test/deploy; IaC describes the infrastructure
      (networks, VMs, clusters) the software runs on. Both are version-controlled and
      complementary, but they solve different problems.
    ref: "concepts.md#pipeline-as-code"

  - id: cicd-pipeline-concepts-018
    difficulty: beginner
    tags: [triggers, push, pr]
    question: |
      Which trigger is best suited to validate a change *before* it is merged into the
      mainline?
    options:
      - "A pull-request trigger configured as a required status check"
      - "A nightly scheduled (cron) trigger that runs the full suite once the mainline is quiet"
      - "A tag trigger that fires whenever a semantic version tag is pushed to the repository"
      - "A manual workflow dispatch invoked by an engineer only after the change has already merged"
    answer: 0
    explanation: |
      A pull-request trigger runs the build/tests on the proposed change and can be set as a
      required status check, blocking merge until it passes — validating the change before it
      reaches the mainline.
    ref: "concepts.md#pipeline-triggers"

  - id: cicd-pipeline-concepts-019
    difficulty: intermediate
    tags: [triggers, release, tag]
    question: |
      A team wants a release build/deploy to fire only when they publish a version like
      `v1.2.3`. Which trigger fits?
    options:
      - "A push trigger that fires on any branch push"
      - "A pull-request trigger on any open PR"
      - "A schedule trigger firing every 5 minutes"
      - "A tag trigger (e.g., on tags matching `v*`)"
    answer: 3
    explanation: |
      Tag triggers fire when a git tag is pushed, commonly used to start release
      builds/deploys keyed to a semantic version tag such as v1.2.3.
    ref: "concepts.md#pipeline-triggers"

  - id: cicd-pipeline-concepts-020
    difficulty: intermediate
    tags: [triggers, schedule, cron]
    question: |
      Which task is the best fit for a scheduled (cron) trigger rather than a push trigger?
    options:
      - "A nightly dependency vulnerability scan / nightly build"
      - "Blocking a pull-request merge until the required status checks pass"
      - "Deploying an urgent hotfix the instant a commit lands on the mainline"
      - "Running the unit-test suite on every single commit that is pushed"
    answer: 0
    explanation: |
      Scheduled triggers are time-based, ideal for periodic work like nightly builds,
      dependency/vulnerability scans, and cleanup — not for reacting to individual commits.
    ref: "concepts.md#pipeline-triggers"

  - id: cicd-pipeline-concepts-021
    difficulty: beginner
    tags: [gates, definition]
    question: |
      What is a pipeline "gate"?
    options:
      - "A firewall rule protecting the CI server's inbound port from unauthorized network access"
      - "The physical door to the data center that houses the build agents and runners"
      - "A cache key string used to look up and restore previously downloaded dependencies"
      - "A condition that must be satisfied for the pipeline to proceed (an automated check result or a manual approval)"
    answer: 3
    explanation: |
      A gate is any condition required to advance: an automated check (tests pass, scan clean,
      coverage threshold) or a manual approval that authorizes a step such as a prod deploy.
    ref: "concepts.md#gates-and-approvals"

  - id: cicd-pipeline-concepts-022
    difficulty: intermediate
    tags: [gates, approvals, flow]
    question: |
      A team adds a mandatory manual approval before *every* deploy, including staging on each
      commit. From a DORA perspective, what is the likely downside?
    options:
      - "It mathematically guarantees a change failure rate of exactly zero across every deployment"
      - "It strips the immutability from the promoted artifact, forcing a rebuild at each approval step"
      - "It adds latency and lowers deployment frequency/flow without necessarily adding safety, especially if approvals become rubber-stamps"
      - "It disables the dependency cache so every gated build must refetch its dependencies from scratch"
    answer: 2
    explanation: |
      Over-gating destroys flow and reduces deployment frequency. Manual approval only adds
      value for genuine business/risk decisions; rubber-stamped approvals add latency without
      safety. Prefer automated quality gates and reserve human approval for high-risk steps.
    ref: "concepts.md#gates-and-approvals"

  - id: cicd-pipeline-concepts-023
    difficulty: intermediate
    tags: [gates, automated, quality]
    question: |
      Which of these is an *automated* gate rather than a manual approval?
    options:
      - "A release manager manually clicking the 'approve' button in the deployment UI"
      - "A canary analysis step that blocks promotion if the canary's error rate exceeds the budget"
      - "A weekly change advisory board meeting convened to review the pending release"
      - "An emailed sign-off from the product owner confirming the release may proceed"
    answer: 1
    explanation: |
      Automated gates decide continuation from a check result — tests passing, scans clean,
      coverage met, or a canary's error rate staying under budget. The others are human
      approvals.
    ref: "concepts.md#gates-and-approvals"

  - id: cicd-pipeline-concepts-024
    difficulty: beginner
    tags: [parallel, sequential]
    question: |
      When must two pipeline stages run sequentially rather than in parallel?
    options:
      - "When one stage depends on another's output or ordering enforces safety (e.g., deploy needs the built artifact; scan must precede deploy)"
      - "Whenever the pipeline is defined with more than three distinct stages in total"
      - "Only on weekends, when reduced runner capacity forbids concurrent job execution"
      - "Always — sequential execution is mandatory and parallelism is never permitted in a pipeline"
    answer: 0
    explanation: |
      Sequential ordering is required when there's a real dependency (deploy consumes the
      build output) or a safety ordering (scan before deploy). Independent work can and should
      run in parallel to cut wall-clock time.
    ref: "concepts.md#parallel-vs-sequential-stages-fan-outfan-in-matrix-builds"

  - id: cicd-pipeline-concepts-025
    difficulty: intermediate
    tags: [fan-out, fan-in, parallelization]
    question: |
      What does a fan-out/fan-in pattern accomplish in a pipeline?
    options:
      - "It serially runs every test on a single runner one after another purely to minimize compute cost"
      - "It fans out one stage into many parallel jobs (e.g., sharded test suite), then a downstream job fans in to wait for all shards and aggregate results"
      - "It duplicates the entire pipeline once for each developer so everyone gets a private isolated run"
      - "It disables all dependency and build caching in order to guarantee bit-for-bit correctness"
    answer: 1
    explanation: |
      Fan-out splits work across many parallel jobs (e.g., test shards) to cut wall-clock
      time; fan-in is the downstream job that waits for all of them and aggregates their
      results — the standard way to parallelize a slow test suite.
    ref: "concepts.md#parallel-vs-sequential-stages-fan-outfan-in-matrix-builds"

  - id: cicd-pipeline-concepts-026
    difficulty: intermediate
    tags: [matrix, cross-platform]
    question: |
      A matrix build with `os: [ubuntu, macos]` and `java: ['17', '21', '23']` produces how
      many jobs, and why use it?
    options:
      - "2 jobs, one per operating system, ignoring the listed Java versions entirely"
      - "1 job that internally loops over all of the OS and Java combinations in sequence"
      - "6 jobs (2 × 3), to verify the same job across every combination of OS and Java version"
      - "5 jobs, allocating exactly one job per unique parameter value listed in the matrix"
    answer: 2
    explanation: |
      A matrix runs the same job across the Cartesian product of parameters — 2 OSes × 3 Java
      versions = 6 parallel jobs — providing cross-platform/cross-version verification.
    ref: "concepts.md#parallel-vs-sequential-stages-fan-outfan-in-matrix-builds"

  - id: cicd-pipeline-concepts-027
    difficulty: advanced
    tags: [matrix, fail-fast, scenario]
    question: |
      In a GitHub Actions matrix, the team wants to see *which* OS/Java combinations fail
      rather than cancelling the rest at the first failure. What should they set?
    options:
      - "`fail-fast: false` on the matrix strategy"
      - "`fail-fast: true` on the matrix strategy"
      - "Remove the matrix and hand-write each job"
      - "`continue-on-error: true` on the whole workflow so failures are ignored"
    answer: 0
    explanation: |
      The matrix default `fail-fast: true` cancels remaining jobs on the first failure (good
      for quick feedback). Setting `fail-fast: false` lets every combination run so you can
      see exactly which OS/version combos break.
    ref: "concepts.md#parallel-vs-sequential-stages-fan-outfan-in-matrix-builds"

  - id: cicd-pipeline-concepts-028
    difficulty: beginner
    tags: [caching, dependencies, speed]
    question: |
      What is the primary purpose of caching dependencies in a pipeline?
    options:
      - "To avoid re-downloading/rebuilding expensive-to-recreate files between runs, speeding up the build"
      - "To permanently and durably store the final production artifact for later deployment"
      - "To guarantee that every build is fully reproducible and bit-for-bit deterministic"
      - "To replace the need for a lockfile by pinning dependency versions inside the cache"
    answer: 0
    explanation: |
      Caching stores expensive-to-recreate files (downloaded dependencies, compiled outputs)
      so subsequent runs restore them instead of refetching/rebuilding — the biggest lever on
      commit-stage speed. It's an optimization, not a correctness input.
    ref: "concepts.md#caching-dependencies-and-the-build-cache"

  - id: cicd-pipeline-concepts-029
    difficulty: intermediate
    tags: [caching, cache-key, lockfile]
    question: |
      Why is a dependency cache key commonly derived from a hash of the lockfile (e.g.,
      `hashFiles('**/pom.xml')`)?
    options:
      - "To make the cache key look random and cryptographically secure against tampering"
      - "Because the lockfile is the only file on the runner a cache key is technically able to read"
      - "So a change in dependencies changes the key and forces a cache miss/refetch, while unchanged dependencies get a fast cache hit"
      - "To ensure the cache entry never expires and is retained permanently across all future runs"
    answer: 2
    explanation: |
      Keying on the lockfile hash makes the cache automatically invalidate when dependencies
      change (key changes → miss → refetch) and reuse the cache when they don't (hit). The key
      must include everything that affects the cached output.
    ref: "concepts.md#caching-dependencies-and-the-build-cache"

  - id: cicd-pipeline-concepts-030
    difficulty: advanced
    tags: [caching, correctness, gotcha]
    question: |
      A build only succeeds when a warm cache is present and fails from a clean cache. What
      does this indicate?
    options:
      - "The cache is working exactly as intended and there is nothing wrong with the build at all"
      - "The cache key string has exceeded the maximum allowed length and is being silently truncated"
      - "The build is not reproducible/correct — it depends on stale cached state; a cache miss must still produce a correct build"
      - "The runner simply needs more memory allocated to hold the full dependency tree in cache"
    answer: 2
    explanation: |
      Caches are a performance optimization, never a correctness input. If the build works
      only with a warm cache, it depends on leftover/poisoned state and isn't reproducible. A
      cache miss must still yield a correct build.
    ref: "concepts.md#caching-dependencies-and-the-build-cache"

  - id: cicd-pipeline-concepts-031
    difficulty: intermediate
    tags: [reproducible-builds, determinism]
    question: |
      What is a reproducible (deterministic) build?
    options:
      - "A build that can be automatically restarted from the last successful step if it crashes"
      - "A build that is only permitted to run on certified, identically-configured reproducible hardware"
      - "A build where the same source and inputs always produce a bit-for-bit identical artifact, regardless of when or where it runs"
      - "A build that stamps a freshly generated random version number into the artifact each time"
    answer: 2
    explanation: |
      Reproducibility means identical inputs yield a bit-identical output every time,
      independent of build time/host. It underpins supply-chain verification (SLSA), reliable
      rollback, and trustworthy caching.
    ref: "concepts.md#idempotent-and-reproducible-builds"

  - id: cicd-pipeline-concepts-032
    difficulty: advanced
    tags: [reproducible-builds, enemies]
    question: |
      Which of these most directly *breaks* build reproducibility?
    options:
      - "Embedding the current wall-clock timestamp and using floating (unpinned) dependency versions"
      - "Pinning every dependency to an exact version via a committed lockfile checked into the repo"
      - "Setting SOURCE_DATE_EPOCH and sorting file inputs into a stable, canonical ordering"
      - "Running the build inside a hermetic sandbox with no network or ambient host access"
    answer: 0
    explanation: |
      Embedded timestamps and floating dependency versions make outputs vary between builds,
      breaking bit-for-bit reproducibility. Pinning/locking dependencies, setting
      SOURCE_DATE_EPOCH, sorting inputs, and hermetic builds all *improve* reproducibility.
    ref: "concepts.md#idempotent-and-reproducible-builds"

  - id: cicd-pipeline-concepts-033
    difficulty: intermediate
    tags: [idempotent, retry]
    question: |
      What does it mean for a pipeline step (like `terraform apply` or a deploy) to be
      idempotent?
    options:
      - "Running it again produces the same result without harmful side effects, converging to the desired state rather than duplicating work"
      - "It is hard-locked so that it can only ever be executed exactly one time and then refuses to run"
      - "It reliably runs faster on the second invocation because of warm dependency and layer caching"
      - "It always provisions a brand-new, distinct set of resources on every single run it performs"
    answer: 0
    explanation: |
      An idempotent step can be safely re-run: it converges to the same end state instead of
      duplicating resources or causing harm. Idempotency is what lets you retry a flaky
      pipeline step safely.
    ref: "concepts.md#idempotent-and-reproducible-builds"

  - id: cicd-pipeline-concepts-034
    difficulty: advanced
    tags: [reproducible, idempotent, distinction]
    question: |
      Which statement correctly distinguishes "reproducible" from "idempotent"?
    options:
      - "Reproducible = same inputs yield an identical artifact (a property of the build); idempotent = re-running a step is safe and converges (a property of a step/deploy)"
      - "Reproducible means a step is safe to retry and converges; idempotent means the build emits a bit-identical output"
      - "They are exact synonyms, both describing how a warm cache is restored between pipeline runs"
      - "Reproducible applies strictly to deployment steps, whereas idempotent applies strictly to the compilation phase"
    answer: 0
    explanation: |
      Reproducibility is about build output determinism (same inputs → identical artifact);
      idempotency is about retry-safety of a step/deploy (re-running converges without harm).
      Both make pipelines trustworthy.
    ref: "concepts.md#idempotent-and-reproducible-builds"

  - id: cicd-pipeline-concepts-035
    difficulty: beginner
    tags: [runners, ephemeral, definition]
    question: |
      What is an "ephemeral" build runner/agent?
    options:
      - "A runner permanently shared by all teams and reused across every job they submit"
      - "A runner created fresh for a single job and destroyed afterward, giving a clean environment per run"
      - "A runner that is only powered on and available to accept jobs during overnight hours"
      - "A runner deliberately provisioned with no outbound network access for security isolation"
    answer: 1
    explanation: |
      Ephemeral runners are provisioned per job and torn down after, so no state leaks between
      jobs. This contrasts with persistent/static runners reused across many jobs.
    ref: "concepts.md#ephemeral-build-agents-and-runners"

  - id: cicd-pipeline-concepts-036
    difficulty: intermediate
    tags: [runners, ephemeral, benefits]
    question: |
      Which is a key benefit of ephemeral runners over persistent ones?
    options:
      - "They always start with a warm dependency cache and the full toolchain preinstalled and ready"
      - "Clean, reproducible environments and security isolation — a compromised job can't persist and poison later jobs; blast radius is one run"
      - "They completely remove any need for dependency caching because fetches are instantaneous on them"
      - "They eliminate the need to define the pipeline as code, letting you configure it purely in the UI"
    answer: 1
    explanation: |
      Ephemeral runners provide a clean, reproducible environment per job and strong security
      isolation (a compromised job can't persist state/malware into the next job). The
      trade-off is cold starts, mitigated by explicit caching and pre-baked images.
    ref: "concepts.md#ephemeral-build-agents-and-runners"

  - id: cicd-pipeline-concepts-037
    difficulty: advanced
    tags: [runners, security, supply-chain]
    question: |
      Why are persistent self-hosted runners on a public repository considered a
      supply-chain risk?
    options:
      - "They are inherently slower than cloud-hosted runners because self-hosted machines are hard-capped to a single CPU core"
      - "They are incapable of executing matrix builds, since the matrix strategy only ever functions on provider-hosted runners"
      - "They automatically publish the checked-out source code to a public internet endpoint every time a job starts on them"
      - "A malicious pull request can run arbitrary code on the runner and poison it (or steal long-lived secrets) for later jobs"
    answer: 3
    explanation: |
      On public repos, a fork PR can execute arbitrary code on a persistent self-hosted
      runner, allowing it to poison the machine for subsequent jobs or exfiltrate long-lived
      secrets. Use ephemeral, isolated runners for untrusted workloads.
    ref: "concepts.md#ephemeral-build-agents-and-runners"

  - id: cicd-pipeline-concepts-038
    difficulty: beginner
    tags: [dora, metrics, four-keys]
    question: |
      Which set correctly lists the four key DORA metrics?
    options:
      - "Lines of code shipped, unit-test coverage percentage, open bug count, and rolling monthly uptime"
      - "Average CPU usage, peak memory consumption, disk I/O throughput, and network round-trip latency"
      - "Deployment Frequency, Lead Time for Changes, Change Failure Rate, and Failed Deployment Recovery Time"
      - "Sprint velocity, committed story points, burndown-chart rate, and per-iteration cycle count"
    answer: 2
    explanation: |
      DORA's four keys are two throughput metrics — Deployment Frequency and Lead Time for
      Changes — and two stability metrics — Change Failure Rate and Failed Deployment
      Recovery Time (formerly Mean Time to Restore).
    ref: "concepts.md#dora-metrics-measuring-the-pipeline"

  - id: cicd-pipeline-concepts-039
    difficulty: intermediate
    tags: [dora, lead-time, definition]
    question: |
      How does DORA define "Lead Time for Changes"?
    options:
      - "The total hours a single developer spends actively writing a new feature"
      - "The elapsed calendar time between two consecutive tagged production releases"
      - "The time it takes to fully onboard and ramp up a newly hired engineer"
      - "The time from code being committed to that code running in production"
    answer: 3
    explanation: |
      Lead Time for Changes measures the elapsed time from code commit to that code running in
      production — a throughput metric capturing how quickly changes flow through the pipeline.
    ref: "concepts.md#dora-metrics-measuring-the-pipeline"

  - id: cicd-pipeline-concepts-040
    difficulty: intermediate
    tags: [dora, change-failure-rate]
    question: |
      What does Change Failure Rate (CFR) measure?
    options:
      - "The percentage of unit tests in the CI suite that fail on their first execution during a build"
      - "The percentage of deployments to production that cause a failure requiring remediation (hotfix, rollback, or patch)"
      - "The running count of git merge conflicts developers resolve across the mainline each week"
      - "The overall ratio of failed CI builds to successful CI builds measured across the pipeline"
    answer: 1
    explanation: |
      CFR is the share of production deployments that result in degraded service needing
      remediation — a rollback, hotfix, or patch. It's a stability metric, not a measure of
      CI test failures or build failures.
    ref: "concepts.md#dora-metrics-measuring-the-pipeline"

  - id: cicd-pipeline-concepts-041
    difficulty: advanced
    tags: [dora, scenario, throughput-stability]
    question: |
      A manager proposes deploying to prod only once a month "to reduce failures." What does
      the DORA/Accelerate research suggest about this?
    options:
      - "It's the optimal strategy; the research proves that deploying less frequently always yields strictly fewer production failures"
      - "It likely makes things worse — larger, riskier batches tend to raise change failure rate and lengthen recovery; elite teams deploy smaller and more often to be both faster and safer"
      - "Deployment frequency and stability are statistically independent variables, so cutting the cadence has no measurable effect either way"
      - "It automatically improves lead time for changes by giving each batch a longer window to be validated before shipping"
    answer: 1
    explanation: |
      The research shows throughput and stability are not a trade-off: elite teams excel at
      both. Big infrequent batches are harder to reason about and roll back, raising CFR and
      recovery time. Deploying smaller and more often (with tests/canary/rollback) is safer.
    ref: "concepts.md#dora-metrics-measuring-the-pipeline"

  - id: cicd-pipeline-concepts-042
    difficulty: advanced
    tags: [dora, scenario, interpretation]
    question: |
      Team A deploys on demand (multiple times/day), lead time under an hour, CFR ~10%, and
      recovers from failed deploys in under an hour. Where do these numbers place them?
    options:
      - "Squarely in the 'low' performer band, since a 10% change failure rate is far too high for any higher tier"
      - "Impossible numbers — deploying multiple times per day mathematically forces the change failure rate well above 10%"
      - "In the 'elite' performer band across all four keys"
      - "Fundamentally unmeasurable, because DORA bands cannot be assigned without knowing the team's total engineer headcount"
    answer: 2
    explanation: |
      On-demand deploys, <1h lead time, single-digit-to-low-teens CFR, and <1h recovery all
      sit in the elite band of the State of DevOps reports — demonstrating that high throughput
      and high stability coexist.
    ref: "concepts.md#dora-metrics-measuring-the-pipeline"

  - id: cicd-pipeline-concepts-043
    difficulty: intermediate
    tags: [pipeline-stages, scenario, ordering]
    question: |
      A pipeline runs stages in this order: deploy-to-prod → build → unit-tests → security-scan.
      What is wrong?
    options:
      - "Nothing at all; the pipeline scheduler reorders stages by dependency at runtime, so any authored order works fine"
      - "Security scanning should never appear in a deployment pipeline and belongs solely in a separate offline audit process"
      - "Deploy happens before the artifact is even built, tested, or scanned — the fast/cheap verification stages must precede deploy (build → test → scan → deploy)"
      - "Unit tests should only ever execute directly against the live production environment after the deploy completes"
    answer: 2
    explanation: |
      You can't deploy an artifact you haven't built, and deploying before tests/scan defeats
      fail-fast and lets defects reach prod. The correct order runs cheap verification first:
      build → test → scan → deploy.
    ref: "concepts.md#pipeline-stages-build-test-package-scan-deploy"

  - id: cicd-pipeline-concepts-044
    difficulty: intermediate
    tags: [scan, shift-left, stages]
    question: |
      In pipeline terms, what does "shift left" mean for security scanning?
    options:
      - "Move scans (SAST/SCA/IaC) earlier in the pipeline so problems are caught before reaching expensive later stages"
      - "Relocate every security scan so it runs only against the live production environment after release"
      - "Physically render the scan results panel on the left-hand half of the CI dashboard screen"
      - "Turn off security scanning entirely as a way to shorten total pipeline wall-clock time"
    answer: 0
    explanation: |
      Shifting left means running security checks earlier (commit/build stage) so issues are
      found cheaply, before they reach costly integration, staging, or prod stages. Details
      live in the devsecops-and-pipeline-security topic.
    ref: "concepts.md#pipeline-stages-build-test-package-scan-deploy"

  - id: cicd-pipeline-concepts-045
    difficulty: intermediate
    tags: [ci, fast-feedback, commit-stage]
    question: |
      Why should the commit stage (compile + unit tests + lint) be kept fast, ideally under
      ~10 minutes?
    options:
      - "Because most CI servers enforce a hard 10-minute job timeout and abort any commit build that exceeds it"
      - "Because unit-test assertions grow statistically inaccurate once a build has been running longer than 10 minutes"
      - "Slow commit builds discourage frequent commits and delay feedback, undermining the whole point of CI"
      - "Because a faster commit stage directly reduces the byte size of the final compiled artifact produced"
    answer: 2
    explanation: |
      Developers wait on the commit stage. If it's slow, they commit less often and get
      delayed feedback — defeating CI's goal of fast, frequent integration. Slow acceptance/E2E
      tests belong in later stages.
    ref: "concepts.md#continuous-integration-principles"

  - id: cicd-pipeline-concepts-046
    difficulty: advanced
    tags: [triggers, pattern, scenario]
    question: |
      Which trigger design cleanly separates "validate the change" from "release the change"?
    options:
      - "Wire up a single push-to-any-branch trigger that runs the identical build, test, and deploy flow for every commit"
      - "Rely solely on one nightly cron trigger to batch together all validation builds and every production deployment"
      - "Fire a manual trigger to run the unit tests and an automatic trigger to push each change straight to production"
      - "PR trigger runs tests as a required check; push-to-main builds/publishes the artifact and deploys to staging; a tag or manual trigger promotes to prod"
    answer: 3
    explanation: |
      A common, clean pattern: PR trigger validates the change (required status check),
      push-to-main produces and publishes the artifact plus auto-deploys to staging, and a
      tag/manual trigger promotes the same artifact to prod — separating validation from release.
    ref: "concepts.md#pipeline-triggers"

  - id: cicd-pipeline-concepts-047
    difficulty: beginner
    tags: [jobs, stages, terminology]
    question: |
      In common pipeline terminology, how do stages, jobs, and steps relate?
    options:
      - "A single step is the outermost unit that contains multiple stages, and each of those stages in turn contains the jobs"
      - "A stage is a logical phase containing one or more jobs (units of work on an agent), and a job runs steps/tasks"
      - "Stages and jobs are just two interchangeable names for the exact same pipeline construct with no real distinction"
      - "A job is the top-level container that holds multiple stages, and every one of those stages wraps exactly one step"
    answer: 1
    explanation: |
      A stage is a logical phase of the pipeline (build, test, deploy). It holds one or more
      jobs, each a unit of work executed on an agent/runner, and each job runs a sequence of
      steps/tasks.
    ref: "concepts.md#pipeline-stages-build-test-package-scan-deploy"

  - id: cicd-pipeline-concepts-048
    difficulty: intermediate
    tags: [12-factor, config, build-once]
    question: |
      Per the 12-Factor App methodology and build-once/deploy-many, where should
      environment-specific values (DB URLs, feature flags, secrets) come from?
    options:
      - "Baked in by compiling a distinct, separate artifact for each target environment during its own build"
      - "Injected from the environment/config at deploy time, keeping the artifact identical across environments"
      - "Hard-coded directly in the source and swapped with a scripted find-and-replace just before each deploy"
      - "Encoded into the git tag name so the values travel with the release tag pushed for each environment"
    answer: 1
    explanation: |
      12-Factor factor III keeps config in the environment. The artifact stays identical
      across environments; env-specific config (DB URLs, flags, secrets) is injected at deploy
      time — enabling build-once/deploy-many.
    ref: "concepts.md#build-once-deploy-many-artifact-promotion"

  - id: cicd-pipeline-concepts-049
    difficulty: advanced
    tags: [dora, mtr, distinction]
    question: |
      In DORA terms, "Failed Deployment Recovery Time" (formerly MTTR) most directly measures
      what?
    options:
      - "How long the commit stage takes to compile the source into a deployable artifact"
      - "The mean elapsed time developers let pass between two successive commits to the mainline"
      - "The time needed to provision a brand-new environment end-to-end using a Terraform apply"
      - "How long it takes to recover from a failed deployment / restore service after a change-related failure"
    answer: 3
    explanation: |
      This stability metric captures how quickly a team restores service after a failed
      deployment. It's distinct from general incident MTTR discussed in the SRE/reliability
      topic, but conceptually related to fast rollback and recovery.
    ref: "concepts.md#dora-metrics-measuring-the-pipeline"

  - id: cicd-pipeline-concepts-050
    difficulty: intermediate
    tags: [gates, environments, protection-rules]
    question: |
      Modern platforms implement approval gates via "environment protection rules." Which is
      an example?
    options:
      - "Requiring named reviewers, a wait timer, and allowed branches before a job can deploy to the 'production' environment"
      - "Requiring that the dependency cache key be derived from a hash of the committed lockfile contents"
      - "Pinning every third-party dependency to an exact version inside the project's build manifest"
      - "Sharding the slow test suite across many parallel runners to cut the total wall-clock time"
    answer: 0
    explanation: |
      Environment protection rules gate a deploy job with things like required reviewers, wait
      timers, allowed branches, and deployment windows — the platform-native way to model
      approvals and safe promotion to production.
    ref: "concepts.md#gates-and-approvals"
