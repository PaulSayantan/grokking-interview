topic: "Testing Strategy in CI/CD"
domain: devops-cicd
topic_slug: testing-strategy-in-cicd
version: 1
questions:
  - id: testing-strategy-in-cicd-001
    difficulty: beginner
    tags: [pipeline-stages, fail-fast]
    question: |
      In a well-ordered CI/CD pipeline, which set of tests should run first?
    options:
      - "Fast static checks and unit tests"
      - "End-to-end tests against staging"
      - "Load and stress tests"
      - "Post-deploy smoke tests"
    answer: 0
    explanation: |
      The fail-fast principle orders stages cheapest/fastest first: lint, type-check,
      compile, then unit tests. They give the highest signal per second and reject a
      broken commit before you spend money on slow integration and E2E stages.
    ref: "concepts.md#where-tests-fit-in-the-pipeline"

  - id: testing-strategy-in-cicd-002
    difficulty: beginner
    tags: [pipeline-stages, ordering]
    question: |
      Which ordering reflects progressively more expensive and more realistic pipeline stages?
    options:
      - "E2E -> integration -> unit -> static checks"
      - "Deploy -> unit -> smoke -> integration -> E2E"
      - "Static checks -> unit -> integration -> E2E -> deploy -> smoke"
      - "Unit -> E2E -> static checks -> integration"
    answer: 2
    explanation: |
      Cheapest and most isolated first (static, unit), then real dependencies
      (integration), then the whole system (E2E), then deploy, then a post-deploy
      smoke check against the running system.
    ref: "concepts.md#where-tests-fit-in-the-pipeline"

  - id: testing-strategy-in-cicd-003
    difficulty: beginner
    tags: [test-pyramid]
    question: |
      What does the "test pyramid" recommend?
    options:
      - "Mostly end-to-end tests, few unit tests"
      - "Many fast unit tests, fewer integration tests, very few slow E2E tests"
      - "Equal numbers of every test type"
      - "Only integration tests, since they are the most realistic"
    answer: 1
    explanation: |
      The pyramid (Cohn/Fowler) puts a broad base of fast, cheap unit tests, fewer
      integration tests, and a thin cap of slow, brittle E2E tests. An inverted pyramid
      (mostly E2E) yields slow, flaky pipelines.
    ref: "concepts.md#where-tests-fit-in-the-pipeline"

  - id: testing-strategy-in-cicd-004
    difficulty: intermediate
    tags: [fail-fast, ordering, cost]
    question: |
      What is the guiding principle for choosing which tests run earliest in a pipeline?
    options:
      - "Alphabetical order of test file names"
      - "The order tests were written in"
      - "Slowest tests first so they have the most time"
      - "Cost multiplied by failure probability — cheap, likely-to-fail tests first"
    answer: 3
    explanation: |
      The pipeline is a filter. Running cheap tests that are most likely to catch a
      mistake first rejects the most bad builds for the least compute, shortening the
      feedback loop.
    ref: "concepts.md#where-tests-fit-in-the-pipeline"

  - id: testing-strategy-in-cicd-005
    difficulty: beginner
    tags: [fail-fast]
    question: |
      What does "fail-fast" mean in a CI/CD pipeline?
    options:
      - "Stop or block promotion at the first failing gate instead of running everything"
      - "Run all tests then report every failure at the end"
      - "Skip tests to make the pipeline finish faster"
      - "Retry failing tests until they pass"
    answer: 0
    explanation: |
      Fail-fast stops at the first failing gate, saving compute and shortening feedback.
      It is the opposite of running the whole suite regardless and reporting only at the end.
    ref: "concepts.md#fail-fast-and-stage-gating"

  - id: testing-strategy-in-cicd-006
    difficulty: intermediate
    tags: [github-actions, sequencing]
    question: |
      In GitHub Actions, how do you ensure an integration job only runs after the unit job succeeds?
    options:
      - "Put both jobs in the same matrix"
      - "Set `continue-on-error: true` on the unit job"
      - "Add `needs: unit` to the integration job"
      - "Use `if: always()` on the integration job"
    answer: 2
    explanation: |
      Jobs in Actions run in parallel by default. `needs:` creates an ordering
      dependency, so the integration job only starts if the referenced job succeeded.
    ref: "concepts.md#fail-fast-and-stage-gating"

  - id: testing-strategy-in-cicd-007
    difficulty: intermediate
    tags: [matrix, fail-fast]
    question: |
      You run a nightly matrix across 12 OS/runtime combinations and want to see ALL
      failures in one run, not just the first. What should you set?
    options:
      - "fail-fast: false on the matrix strategy"
      - "fail-fast: true on the matrix strategy"
      - "needs: [] on every job"
      - "retries: 3 on each job"
    answer: 0
    explanation: |
      With the default fail-fast: true, one matrix failure cancels its siblings. For a
      "tell me everything that's broken" nightly run, set fail-fast: false so every
      combination runs to completion.
    ref: "concepts.md#fail-fast-and-stage-gating"

  - id: testing-strategy-in-cicd-008
    difficulty: intermediate
    tags: [gitlab, jenkins, sequencing]
    question: |
      Which statement about stage sequencing is correct?
    options:
      - "In GitLab CI, all stages always run in parallel regardless of failures"
      - "In GitLab CI, a stage starts only if the previous stage succeeded"
      - "Jenkins declarative stages run in random order"
      - "GitHub Actions jobs are strictly sequential by default"
    answer: 1
    explanation: |
      GitLab CI stages run sequentially and a stage only begins if the prior stage
      passed (needs: can create a DAG for earlier starts). Jenkins declarative stages run
      in order; GitHub Actions jobs run in parallel unless sequenced with needs:.
    ref: "concepts.md#fail-fast-and-stage-gating"

  - id: testing-strategy-in-cicd-009
    difficulty: beginner
    tags: [quality-gates]
    question: |
      What is a "quality gate" in a pipeline?
    options:
      - "A pass/fail condition that blocks promotion when not met"
      - "A dashboard that displays test results"
      - "A tool that formats code automatically"
      - "The stage that deploys to production"
    answer: 0
    explanation: |
      A quality gate turns a measurement into enforcement: coverage below a floor, new
      critical findings, or failing tests cause the pipeline to fail and block promotion.
    ref: "concepts.md#quality-gates-and-coverage-thresholds"

  - id: testing-strategy-in-cicd-010
    difficulty: intermediate
    tags: [coverage, diff-coverage]
    question: |
      A large legacy service sits at 82% coverage. New code keeps shipping untested yet
      the global number barely moves. Which gate best prevents this?
    options:
      - "Raise the global coverage threshold to 95%"
      - "Remove the coverage gate entirely"
      - "Gate on coverage of new/changed code (diff/patch coverage)"
      - "Count only integration-test coverage"
    answer: 2
    explanation: |
      A global number lets untested new code hide behind a large tested legacy base.
      Gating on diff/patch coverage ("new code must be >= X%") forces each change to be
      tested, and the overall number drifts up naturally.
    ref: "concepts.md#quality-gates-and-coverage-thresholds"

  - id: testing-strategy-in-cicd-011
    difficulty: intermediate
    tags: [coverage, assertions]
    question: |
      Why is high line coverage a "necessary but not sufficient" quality signal?
    options:
      - "Because coverage tools are always inaccurate"
      - "Because code can be executed without any assertion verifying its behavior"
      - "Because coverage only counts integration tests"
      - "Because coverage slows down the pipeline"
    answer: 1
    explanation: |
      Coverage measures which lines executed, not whether tests actually assert correct
      behavior. 100% coverage with no assertions verifies nothing — which is why mutation
      testing (does the test catch injected bugs?) is a stronger signal.
    ref: "concepts.md#quality-gates-and-coverage-thresholds"

  - id: testing-strategy-in-cicd-012
    difficulty: advanced
    tags: [mutation-testing]
    question: |
      What does mutation testing (e.g. PIT, Stryker) measure that line coverage cannot?
    options:
      - "How fast the tests run"
      - "How many lines of code exist"
      - "Whether the code compiles"
      - "Whether the tests actually detect deliberately injected faults"
    answer: 3
    explanation: |
      Mutation testing injects small changes (mutants) into the code and checks whether
      tests fail. A surviving mutant means the tests execute that code but do not verify
      its behavior — a gap line coverage cannot reveal. It is slower, so it is often a
      periodic/nightly gate.
    ref: "concepts.md#quality-gates-and-coverage-thresholds"

  - id: testing-strategy-in-cicd-013
    difficulty: intermediate
    tags: [sonarqube, quality-gates]
    question: |
      SonarQube's default "Clean as You Code" quality gate primarily evaluates conditions on:
    options:
      - "New/changed code in the current change"
      - "The entire codebase's historical totals"
      - "Only the test files"
      - "Randomly sampled files"
    answer: 0
    explanation: |
      SonarQube's default gate focuses on NEW code (coverage on new code, duplication on
      new code, zero new blocker/critical issues), so teams improve incrementally without
      being blocked by legacy debt.
    ref: "concepts.md#quality-gates-and-coverage-thresholds"

  - id: testing-strategy-in-cicd-014
    difficulty: beginner
    tags: [parallelization, wall-clock]
    question: |
      What is the primary goal of sharding a test suite across multiple runners?
    options:
      - "Increase total CPU time used"
      - "Guarantee tests never flake"
      - "Reduce wall-clock time by running subsets in parallel"
      - "Reduce the number of tests"
    answer: 2
    explanation: |
      Sharding splits one suite across N machines so wall-clock time approximates
      serial-time/N plus overhead. It targets the time engineers actually feel, not total
      CPU consumption.
    ref: "concepts.md#parallelization-sharding-and-test-splitting"

  - id: testing-strategy-in-cicd-015
    difficulty: intermediate
    tags: [sharding, balancing]
    question: |
      Naive sharding by file count leaves one runner much slower than the others. What is
      the standard fix?
    options:
      - "Sort tests alphabetically before splitting"
      - "Run all tests on a single large runner"
      - "Delete the slow tests"
      - "Balance shards using historical per-test timing data"
    answer: 3
    explanation: |
      Timing-based splitters use recorded per-test durations to balance shards so every
      runner finishes at roughly the same time, instead of dumping all slow tests onto one
      shard while others idle.
    ref: "concepts.md#parallelization-sharding-and-test-splitting"

  - id: testing-strategy-in-cicd-016
    difficulty: advanced
    tags: [parallelization, overhead]
    question: |
      A team increases shards from 4 to 32 but the pipeline gets slower. What is the most
      likely cause?
    options:
      - "Tests started passing more often"
      - "The runners have too many CPU cores"
      - "The test pyramid became too tall"
      - "Fixed per-job overhead (checkout, install, container pulls) is now paid 32 times"
    answer: 3
    explanation: |
      Parallelism has diminishing returns: each runner pays fixed setup overhead. If a
      shard spends 90s booting to run a few seconds of tests, adding shards multiplies
      overhead and can net-slow the pipeline. Cache deps and find the crossover point.
    ref: "concepts.md#parallelization-sharding-and-test-splitting"

  - id: testing-strategy-in-cicd-017
    difficulty: intermediate
    tags: [sharding, matrix]
    question: |
      What is the difference between "sharding" and a "matrix/fan-out"?
    options:
      - "Sharding splits one suite across machines; a matrix runs the same suite across configs (OS/versions)"
      - "They are identical terms"
      - "Sharding runs slower tests; matrix runs faster tests"
      - "Matrix reduces coverage; sharding increases it"
    answer: 0
    explanation: |
      Sharding partitions a single test suite across N runners to cut wall-clock time. A
      matrix fans the same suite out across different configurations (OS, language
      versions) to verify compatibility.
    ref: "concepts.md#parallelization-sharding-and-test-splitting"

  - id: testing-strategy-in-cicd-018
    difficulty: advanced
    tags: [intra-process-parallelism, isolation]
    question: |
      To safely run tests in parallel within one process (JUnit 5 parallel, pytest-xdist),
      what must be true of the tests?
    options:
      - "They must all use the same shared database row"
      - "They must run in a fixed alphabetical order"
      - "They must be isolated — no shared mutable state, unique schemas/temp dirs"
      - "They must all be end-to-end tests"
    answer: 2
    explanation: |
      Intra-process parallelism uses all cores per runner, but only works if tests do not
      share mutable state and each uses isolated resources (unique DB schema, temp dir).
      Otherwise they race and produce flaky results.
    ref: "concepts.md#parallelization-sharding-and-test-splitting"

  - id: testing-strategy-in-cicd-019
    difficulty: intermediate
    tags: [test-impact-analysis, selection]
    question: |
      What is "test impact analysis" (predictive test selection)?
    options:
      - "Running the full suite on every commit"
      - "Running only the tests affected by a change, based on a code-to-test dependency graph"
      - "Randomly sampling 10% of tests"
      - "Running tests in order of last failure"
    answer: 1
    explanation: |
      Test impact analysis uses a dependency graph (build-graph, coverage map, or change
      scope) to run only the tests a change could affect, dramatically shrinking PR
      feedback time in large repos.
    ref: "concepts.md#test-selection-and-test-impact-analysis"

  - id: testing-strategy-in-cicd-020
    difficulty: advanced
    tags: [test-selection, safety]
    question: |
      What is the key risk of relying on test selection for PR feedback, and how is it mitigated?
    options:
      - "It runs too many tests; mitigate by deleting tests"
      - "It only works with Jenkins; mitigate by switching CI tools"
      - "It always increases flakiness; mitigate by disabling retries"
      - "An incorrect impact graph can skip a test that would have failed; run the full suite on main/nightly"
    answer: 3
    explanation: |
      Reflection, DI, dynamic config, and dynamic imports can make the impact graph wrong,
      so a relevant test gets skipped and a bug ships. Mitigate by running the full suite
      on the main branch / pre-merge / nightly — selection must never be the only place a
      test runs.
    ref: "concepts.md#test-selection-and-test-impact-analysis"

  - id: testing-strategy-in-cicd-021
    difficulty: intermediate
    tags: [monorepo, selection, gitlab]
    question: |
      In a monorepo, a job should only run when files under `services/billing/` change.
      Which GitLab CI feature expresses this?
    options:
      - "`rules: - changes: [services/billing/**/*]`"
      - "`retry: 2`"
      - "`fail-fast: false`"
      - "`needs: [deploy]`"
    answer: 0
    explanation: |
      GitLab's `rules:changes` (and GitHub's `paths:` filters, Nx `affected`) scope the
      pipeline to only run jobs for packages whose files changed — a change-scope form of
      test selection.
    ref: "concepts.md#test-selection-and-test-impact-analysis"

  - id: testing-strategy-in-cicd-022
    difficulty: advanced
    tags: [selection, sharding, composition]
    question: |
      How do test selection and sharding relate?
    options:
      - "They are mutually exclusive — you must pick one"
      - "Sharding replaces the need for selection"
      - "They compose: select the affected tests, then shard those across runners"
      - "Selection only works after sharding"
    answer: 2
    explanation: |
      Selection reduces WHICH tests run; sharding runs the chosen tests on more machines.
      They stack: first pick the affected tests, then split that reduced set across runners.
    ref: "concepts.md#test-selection-and-test-impact-analysis"

  - id: testing-strategy-in-cicd-023
    difficulty: beginner
    tags: [flaky-tests]
    question: |
      What defines a "flaky" test?
    options:
      - "A test that always fails"
      - "A test that takes longer than one minute"
      - "A test with no assertions"
      - "A test that passes or fails non-deterministically on the same code"
    answer: 3
    explanation: |
      Flakiness is non-determinism: the same code yields both pass and fail across runs,
      typically from timing/races, order dependence, shared state, network, or time/randomness.
    ref: "concepts.md#flaky-tests-quarantine-and-retry-policy"

  - id: testing-strategy-in-cicd-024
    difficulty: intermediate
    tags: [flaky-tests, quarantine]
    question: |
      What does it mean to "quarantine" a flaky test at the pipeline level?
    options:
      - "Delete the test permanently"
      - "Move it to a non-blocking lane that still runs and reports, but does not gate the pipeline"
      - "Run it 100 times until it passes"
      - "Convert it to a unit test"
    answer: 1
    explanation: |
      Quarantine isolates a known-flaky test into a lane that runs and reports but does
      not block the merge, keeping the main gate trustworthy while preserving coverage.
      The test stays quarantined (with a tracking ticket/SLA) until fixed.
    ref: "concepts.md#flaky-tests-quarantine-and-retry-policy"

  - id: testing-strategy-in-cicd-025
    difficulty: advanced
    tags: [flaky-tests, retry, anti-pattern]
    question: |
      Why is "retry the whole job up to 3 times until it goes green" considered an anti-pattern?
    options:
      - "It can mask real intermittent product bugs and multiplies CI cost"
      - "It is too slow to configure"
      - "Retries are not supported by any CI tool"
      - "It always deletes test results"
    answer: 0
    explanation: |
      Blanket job-level retries hide genuine intermittent failures (e.g. a race in the
      code under test) and burn compute. Prefer bounded per-test retry, surface a flake
      report, and quarantine — not silent whole-job reruns.
    ref: "concepts.md#flaky-tests-quarantine-and-retry-policy"

  - id: testing-strategy-in-cicd-026
    difficulty: intermediate
    tags: [flaky-tests, trust]
    question: |
      Why are flaky tests especially harmful to a team's testing culture?
    options:
      - "They increase code coverage artificially"
      - "They make the pipeline faster"
      - "They erode trust so people reflexively rerun, and real failures hide among the noise"
      - "They only affect end-to-end tests"
    answer: 2
    explanation: |
      When failures are often "just flakes," engineers stop trusting red builds and rerun
      reflexively — so a genuine regression gets dismissed as noise. Trustworthiness of the
      gate is the whole point.
    ref: "concepts.md#flaky-tests-quarantine-and-retry-policy"

  - id: testing-strategy-in-cicd-027
    difficulty: intermediate
    tags: [contract-testing, pact]
    question: |
      What do contract tests (e.g. Pact) verify?
    options:
      - "That the entire system is deployed and running end-to-end"
      - "That a consumer and provider agree on the shape of their interaction, without a full environment"
      - "That the database schema is normalized"
      - "That code coverage exceeds 80%"
    answer: 1
    explanation: |
      Contract tests verify provider/consumer agreement on request/response or message
      shapes at near-unit speed, giving integration-like confidence without standing up
      both services together.
    ref: "concepts.md#contract-testing-and-the-can-i-deploy-gate"

  - id: testing-strategy-in-cicd-028
    difficulty: advanced
    tags: [can-i-deploy, pact-broker]
    question: |
      What question does the Pact `can-i-deploy` gate answer before a deployment?
    options:
      - "Is the code coverage high enough?"
      - "Are there any lint errors?"
      - "Has the artifact been signed?"
      - "Given the versions currently in the target environment, is this version compatible with all its integration partners?"
    answer: 3
    explanation: |
      `can-i-deploy` asks the broker whether the version being deployed is verified
      compatible with the versions already in the target environment (e.g. production),
      and blocks the deploy (non-zero exit) if any contract is unsatisfied.
    ref: "concepts.md#contract-testing-and-the-can-i-deploy-gate"

  - id: testing-strategy-in-cicd-029
    difficulty: advanced
    tags: [contract-testing, consumer-driven]
    question: |
      In consumer-driven contract testing with Pact, where is the contract generated?
    options:
      - "The provider generates it from its OpenAPI spec"
      - "The broker generates it automatically"
      - "The consumer generates it from a test against a mock provider, then publishes it to the broker"
      - "The CI runner generates it from logs"
    answer: 2
    explanation: |
      The consumer's test runs against a mock provider and produces the pact file, which
      is published to the broker. The provider then verifies it can satisfy every
      consumer's pact.
    ref: "concepts.md#contract-testing-and-the-can-i-deploy-gate"

  - id: testing-strategy-in-cicd-030
    difficulty: advanced
    tags: [contract-testing, independent-deploy]
    question: |
      Why does a `can-i-deploy` gate let teams deploy provider and consumer services independently?
    options:
      - "Because it disables all other tests"
      - "Because it deploys both services simultaneously"
      - "Because the broker enforces compatibility, so a service ships only when it won't break partners currently in prod"
      - "Because it merges the two repositories"
    answer: 2
    explanation: |
      Independent deployability comes from the broker tracking verified compatibility.
      Each service can ship on its own schedule because the gate refuses any deploy that
      would break a partner currently running in the target environment.
    ref: "concepts.md#contract-testing-and-the-can-i-deploy-gate"

  - id: testing-strategy-in-cicd-031
    difficulty: beginner
    tags: [smoke-tests, post-deploy]
    question: |
      What is a post-deploy "smoke test"?
    options:
      - "A full regression suite run before merging"
      - "A static analysis scan of the source code"
      - "A load test that saturates the service"
      - "A shallow set of checks against the running deployed system to confirm it is alive and serving"
    answer: 3
    explanation: |
      Smoke tests are a shallow go/no-go set run right after deploy — health endpoint 200,
      login works, a canonical read/write path works — confirming this deployment in this
      environment is healthy before promotion.
    ref: "concepts.md#post-deploy-smoke-and-synthetic-tests"

  - id: testing-strategy-in-cicd-032
    difficulty: intermediate
    tags: [ci-green, environment-drift]
    question: |
      CI is fully green but the deploy still broke production. What is the best explanation?
    options:
      - "The unit tests were too fast"
      - "CI tests build artifacts; config, secrets, DNS, network policy, and infra differ in the deployed environment"
      - "Coverage was below 100%"
      - "The pipeline used fail-fast"
    answer: 1
    explanation: |
      Passing CI proves the artifact is correct, not that the deployed environment is.
      Config/secrets/DNS/infra differences surface only against the running system — which
      is why post-deploy smoke tests and synthetic monitoring exist.
    ref: "concepts.md#post-deploy-smoke-and-synthetic-tests"

  - id: testing-strategy-in-cicd-033
    difficulty: intermediate
    tags: [synthetic-monitoring]
    question: |
      How does synthetic monitoring differ from a post-deploy smoke test?
    options:
      - "Synthetic monitoring runs once at build time only"
      - "They are the same thing"
      - "Synthetic monitoring replaces unit tests"
      - "Synthetic monitoring runs continuously on a schedule in production to catch regressions between deploys"
    answer: 3
    explanation: |
      A smoke test is a one-shot go/no-go check at deploy time. Synthetic monitoring runs
      the same style of checks continuously from outside the system to measure user-facing
      availability/latency and catch regressions between deployments.
    ref: "concepts.md#post-deploy-smoke-and-synthetic-tests"

  - id: testing-strategy-in-cicd-034
    difficulty: advanced
    tags: [canary-analysis, progressive-delivery]
    question: |
      In automated canary analysis (Argo Rollouts, Flagger, Kayenta), what drives the
      promote-or-rollback decision?
    options:
      - "The number of lines of code changed"
      - "Whether the commit message contains 'fix'"
      - "Comparing the new version's error rate and latency against a baseline"
      - "The alphabetical order of the service name"
    answer: 2
    explanation: |
      Canary analysis routes a slice of traffic to the new version and compares its error
      rate/latency to the baseline; if metrics stay within thresholds it auto-promotes,
      otherwise it auto-rolls-back — pairing naturally with post-deploy checks.
    ref: "concepts.md#post-deploy-smoke-and-synthetic-tests"

  - id: testing-strategy-in-cicd-035
    difficulty: intermediate
    tags: [smoke-tests, production-safety]
    question: |
      What is a key property a smoke test running against production should have?
    options:
      - "It should mutate as much data as possible to be thorough"
      - "It should be tiny, fast, and non-destructive"
      - "It should replace the staging E2E suite"
      - "It should run for at least 30 minutes"
    answer: 1
    explanation: |
      Against prod a smoke test must be small, fast, and non-destructive — a go/no-go
      health confirmation, not a regression suite. Deep functional testing belongs earlier
      in staging E2E.
    ref: "concepts.md#post-deploy-smoke-and-synthetic-tests"

  - id: testing-strategy-in-cicd-036
    difficulty: beginner
    tags: [performance-tests, tools]
    question: |
      Which tools are commonly used for performance/load testing in a pipeline?
    options:
      - "CodeQL, Semgrep, SonarQube"
      - "Pact, Spring Cloud Contract"
      - "gitleaks, TruffleHog"
      - "k6, Gatling, JMeter, Locust"
    answer: 3
    explanation: |
      k6, Gatling, JMeter, and Locust generate load and assert latency/error-rate
      thresholds. The others listed are SAST/contract/secret-scanning tools, not load
      generators.
    ref: "concepts.md#performance-and-security-tests-in-the-pipeline"

  - id: testing-strategy-in-cicd-037
    difficulty: intermediate
    tags: [performance-budget, gates]
    question: |
      How should performance tests typically be structured across a pipeline?
    options:
      - "Run a short smoke-level load test per pipeline with threshold assertions; run full soak/stress nightly"
      - "Run a full multi-hour soak test on every commit"
      - "Never run them in CI"
      - "Only run them after an incident"
    answer: 0
    explanation: |
      A short per-pipeline perf smoke (low load, assert p95/error-rate budget) catches
      regressions cheaply, while heavier soak/stress runs happen nightly. A performance
      budget becomes a gate that fails the build on regression.
    ref: "concepts.md#performance-and-security-tests-in-the-pipeline"

  - id: testing-strategy-in-cicd-038
    difficulty: intermediate
    tags: [security-tests, dast, placement]
    question: |
      DAST (dynamic application security testing, e.g. OWASP ZAP) is best placed where in the pipeline?
    options:
      - "Before compilation, on source code"
      - "As the very first static check"
      - "Against a deployed running target, typically post-deploy on staging"
      - "Only in the artifact-signing stage"
    answer: 2
    explanation: |
      DAST scans a running application, so it needs a deployed target — usually staging
      after deploy. SAST/SCA/secret-scanning are static and run early and fast on the code
      and dependencies.
    ref: "concepts.md#performance-and-security-tests-in-the-pipeline"

  - id: testing-strategy-in-cicd-039
    difficulty: advanced
    tags: [non-functional-gates, noise]
    question: |
      Load-test numbers vary on shared CI hardware and security scanners emit false
      positives. What is the recommended way to gate on these without alienating developers?
    options:
      - "Block every merge on the exact absolute number"
      - "Remove all non-functional gates"
      - "Run them only after production incidents"
      - "Gate on thresholds/deltas with tolerance and allow documented suppressions with expiry"
    answer: 3
    explanation: |
      Non-functional gates are noisy. Gating on thresholds/deltas with tolerance, and
      permitting time-boxed documented suppressions, keeps the gate credible; a flaky
      absolute gate just gets disabled by frustrated engineers.
    ref: "concepts.md#performance-and-security-tests-in-the-pipeline"

  - id: testing-strategy-in-cicd-040
    difficulty: beginner
    tags: [security-scanning, sca]
    question: |
      Which category of scan checks your third-party dependencies for known CVEs?
    options:
      - "SAST"
      - "SCA (software composition analysis)"
      - "DAST"
      - "Secret scanning"
    answer: 1
    explanation: |
      SCA (Dependabot, Snyk, Trivy, npm/pip audit) inspects dependencies for known
      vulnerabilities. SAST analyzes your own source, DAST tests a running app, and secret
      scanning looks for leaked credentials.
    ref: "concepts.md#performance-and-security-tests-in-the-pipeline"

  - id: testing-strategy-in-cicd-041
    difficulty: beginner
    tags: [reporting, junit-xml]
    question: |
      What is the de-facto standard machine-readable format for publishing test results to CI systems?
    options:
      - "A plain .txt log file"
      - "A screenshot PNG"
      - "JUnit XML"
      - "A CSV of commit hashes"
    answer: 2
    explanation: |
      JUnit XML is consumed by GitHub, GitLab, Jenkins, and Bitbucket to render per-test
      pass/fail and surface failing assertions. Other formats (Cucumber, TAP, Allure) exist
      but JUnit XML is the common denominator.
    ref: "concepts.md#test-result-reporting-and-trends"

  - id: testing-strategy-in-cicd-042
    difficulty: intermediate
    tags: [reporting, artifacts]
    question: |
      In GitLab CI, why add `artifacts: when: always` (or `if: always()` in GitHub Actions)
      to a test-report step?
    options:
      - "To make the tests run faster"
      - "To skip the report on failure"
      - "So test reports upload even when a prior step failed — exactly when you need them"
      - "To encrypt the report"
    answer: 2
    explanation: |
      By default, upload steps are skipped once a prior step fails — which is precisely
      when the failure report matters most. `when: always` / `if: always()` ensures reports
      and artifacts are collected on failure too.
    ref: "concepts.md#test-result-reporting-and-trends"

  - id: testing-strategy-in-cicd-043
    difficulty: intermediate
    tags: [reporting, trends]
    question: |
      What is the main value of tracking test result TRENDS over many runs (pass rate,
      duration, flake rate)?
    options:
      - "It guarantees zero flaky tests"
      - "It reveals a slowly rotting suite or creeping slowdown before it becomes a crisis"
      - "It replaces the need for a quality gate"
      - "It makes each individual run faster"
    answer: 1
    explanation: |
      A single run is a snapshot; trends expose gradual degradation — rising duration,
      falling pass rate, growing flake rate — giving you time to act before the suite
      becomes untrustworthy or unbearably slow.
    ref: "concepts.md#test-result-reporting-and-trends"

  - id: testing-strategy-in-cicd-044
    difficulty: intermediate
    tags: [keeping-fast, lead-time, dora]
    question: |
      DORA/Accelerate research links fast feedback and short lead time to elite delivery.
      What happens to a suite that becomes too slow?
    options:
      - "It automatically becomes more reliable"
      - "It improves coverage"
      - "It reduces flakiness"
      - "Engineers skip, disable, or bypass it, undermining its value"
    answer: 3
    explanation: |
      Slow suites get skipped or bypassed, and the batch of changes per run grows so
      failures are harder to localize. Keeping the suite fast is a first-class engineering
      goal, not a nicety.
    ref: "concepts.md#keeping-the-suite-fast"

  - id: testing-strategy-in-cicd-045
    difficulty: intermediate
    tags: [keeping-fast, target]
    question: |
      A common practical target for the required PR feedback loop is:
    options:
      - "Under about 10 minutes"
      - "Under 2 hours"
      - "Exactly 45 minutes"
      - "There is no reason to bound it"
    answer: 0
    explanation: |
      Beyond ~10 minutes developers context-switch and batch more changes per run, making
      failures harder to localize. Optimize the critical path to merge; slower full suites
      can run post-merge/nightly.
    ref: "concepts.md#keeping-the-suite-fast"

  - id: testing-strategy-in-cicd-046
    difficulty: advanced
    tags: [keeping-fast, scenario]
    question: |
      Your required PR pipeline takes 45 minutes and its slowest stage is a broad E2E
      suite. Which combination best cuts feedback time while keeping safety?
    options:
      - "Delete the E2E tests and rely on unit tests only"
      - "Retry the whole job until it passes faster"
      - "Right-size the pyramid (push confidence to contract/integration/unit), shard with timing balance, cache deps, and run test selection on PRs with the full suite on main"
      - "Move everything to a single very large runner"
    answer: 2
    explanation: |
      The durable fix is layered: shift confidence down the pyramid, parallelize/shard with
      balanced timing, cache dependencies/build output, and apply impact-based selection on
      PRs while keeping a full-suite safety net on main. Deleting E2E outright sacrifices
      safety; retries and one big runner don't address the structural cost.
    ref: "concepts.md#keeping-the-suite-fast"

  - id: testing-strategy-in-cicd-047
    difficulty: intermediate
    tags: [caching, remote-cache]
    question: |
      How does a remote build/test cache (Bazel, Gradle, Nx, Turborepo) speed up pipelines?
    options:
      - "By skipping tests that failed last time"
      - "By deleting the dependency graph"
      - "By running every target twice for safety"
      - "By reusing results for unchanged targets so they aren't rebuilt or retested"
    answer: 3
    explanation: |
      Remote caches key on inputs; if a target's inputs are unchanged, its prior build/test
      result is reused instead of recomputed. Combined with the dependency graph this avoids
      redundant work across runs and machines.
    ref: "concepts.md#keeping-the-suite-fast"

  - id: testing-strategy-in-cicd-048
    difficulty: intermediate
    tags: [test-environments, testcontainers]
    question: |
      What problem does Testcontainers solve for integration tests?
    options:
      - "It mocks the code under test"
      - "It starts a real Postgres/Kafka/Redis in a disposable container inside the test run"
      - "It generates load against production"
      - "It signs build artifacts"
    answer: 1
    explanation: |
      Testcontainers spins up real dependencies in containers scoped to the test run, giving
      real behavior without a shared long-lived server and without the cross-test
      interference that shared environments cause.
    ref: "concepts.md#test-environments-and-data-management"

  - id: testing-strategy-in-cicd-049
    difficulty: advanced
    tags: [test-environments, ephemeral, scenario]
    question: |
      Every pipeline deploys to one shared staging environment serially, and one team's
      bad deploy fails everyone's E2E. What is the best remedy?
    options:
      - "Run E2E tests less often"
      - "Give one team exclusive access to staging"
      - "Disable E2E tests entirely"
      - "Use ephemeral per-change environments (or hermetic container-backed tests) for isolation and parallelism"
    answer: 3
    explanation: |
      Ephemeral per-PR environments (preview envs, vcluster, K8s namespaces, Compose) or
      hermetic container-backed tests trade a little spin-up cost for isolation and
      parallelism, eliminating the shared-staging bottleneck and the "who broke staging"
      problem.
    ref: "concepts.md#test-environments-and-data-management"

  - id: testing-strategy-in-cicd-050
    difficulty: intermediate
    tags: [test-data, service-virtualization]
    question: |
      When testing against an unreliable third-party API you do not control, what is the
      recommended approach for deterministic tests?
    options:
      - "Call the real API every run"
      - "Skip the tests that touch it"
      - "Use service virtualization/mocking (WireMock, Mountebank) to stub the external dependency"
      - "Copy production data into the tests"
    answer: 2
    explanation: |
      Stubbing external dependencies you do not control (WireMock, Mountebank) keeps tests
      deterministic and avoids vendor rate limits and outages. Real dependencies you DO
      control are better run for real via containers.
    ref: "concepts.md#test-environments-and-data-management"

  - id: testing-strategy-in-cicd-051
    difficulty: intermediate
    tags: [test-data, isolation]
    question: |
      Why should tests avoid depending on production-copied data and instead use seeded,
      isolated fixtures?
    options:
      - "Production data is always too small"
      - "It creates privacy risk and flakiness; isolated deterministic fixtures keep tests idempotent and order-independent"
      - "Seeded fixtures increase coverage automatically"
      - "Production data cannot be read by tests"
    answer: 1
    explanation: |
      Prod-copied data raises privacy concerns and changes underneath you, causing
      flakiness. Deterministic seeded fixtures, isolated per test (unique schema/tenant) and
      reset between runs, keep tests idempotent and order-independent.
    ref: "concepts.md#test-environments-and-data-management"

  - id: testing-strategy-in-cicd-052
    difficulty: beginner
    tags: [scope, pointer]
    question: |
      Which of these belongs to the dedicated "testing" domain rather than this pipeline-
      focused topic?
    options:
      - "Where smoke tests run relative to deploy"
      - "How to shard a suite across runners"
      - "The can-i-deploy gate"
      - "The test-double taxonomy (stub/mock/fake/spy) and how to write good assertions"
    answer: 3
    explanation: |
      The craft of writing tests — test doubles, AAA structure, TDD/BDD, framework
      specifics — lives in the testing domain. This topic covers pipeline mechanics: staging,
      gating, sharding, selection, quarantine, contract gates, and post-deploy checks.
    ref: "concepts.md#pointer-the-testing-discipline-itself"

  - id: testing-strategy-in-cicd-053
    difficulty: advanced
    tags: [scenario, gating, fail-fast]
    question: |
      A pipeline runs a 30-minute E2E suite BEFORE the 2-minute unit tests, and only reports
      failures at the very end. Which two changes most improve it?
    options:
      - "Reorder so cheap unit/static checks run first (fail-fast), and block promotion at the first failing gate"
      - "Delete the unit tests and keep only E2E"
      - "Add more E2E tests earlier"
      - "Run everything on one runner with no ordering"
    answer: 0
    explanation: |
      The suite violates fail-fast ordering. Putting cheap, high-signal checks first and
      failing at the first gate rejects bad builds in minutes instead of after a 30-minute
      E2E run, without losing any coverage.
    ref: "concepts.md#fail-fast-and-stage-gating"

  - id: testing-strategy-in-cicd-054
    difficulty: advanced
    tags: [scenario, coverage, mutation]
    question: |
      A service reports 95% line coverage yet regressions keep shipping. Investigation shows
      many tests execute code but assert almost nothing. What is the strongest next step?
    options:
      - "Raise the coverage threshold to 100%"
      - "Delete the assertion-free tests to lower coverage"
      - "Add mutation testing to measure whether tests actually catch injected faults, and gate on diff coverage"
      - "Switch to only end-to-end tests"
    answer: 2
    explanation: |
      High coverage with weak assertions is the classic false-confidence trap. Mutation
      testing exposes tests that execute but don't verify behavior, and gating on diff
      coverage focuses effort on new code. Raising the line-coverage number alone doesn't fix
      missing assertions.
    ref: "concepts.md#quality-gates-and-coverage-thresholds"

  - id: testing-strategy-in-cicd-055
    difficulty: advanced
    tags: [scenario, contract-testing]
    question: |
      Team A owns a provider API; Team B consumes it. Team A wants to change a response field
      but not break B, and both deploy independently. Which pipeline mechanism directly enables this?
    options:
      - "A shared end-to-end environment deployed nightly"
      - "Higher unit-test coverage on Team A's service"
      - "A blue-green deployment of Team A's service"
      - "Consumer-driven contract tests plus a can-i-deploy gate against the broker"
    answer: 3
    explanation: |
      Consumer-driven contracts capture B's expectations; the provider verifies them and
      runs can-i-deploy before shipping, so A is blocked only if the change would break a
      consumer currently in production — enabling safe independent deploys.
    ref: "concepts.md#contract-testing-and-the-can-i-deploy-gate"
