topic: Deployment Strategies
domain: devops-cicd
topic_slug: deployment-strategies
version: 1
questions:
- id: deployment-strategies-001
  difficulty: beginner
  tags:
  - fundamentals
  - deploy-vs-release
  question: |
    What is the core distinction between "deploy" and "release" that feature flags exploit?
  options:
  - Deploy is for staging only; release is for production only
  - Deploy is manual; release is always automated
  - Deploy pushes code bits to servers; release exposes the behavior to users
  - They are synonyms with no meaningful difference
  answer: 2
  explanation: |
    Deploy = shipping the binary/artifact to running infrastructure. Release = making the
    new behavior visible to users. Feature flags decouple them: you can deploy dark (code
    present but off) and release later by flipping a toggle without redeploying.
  ref: concepts.md#why-deployment-strategy-matters
- id: deployment-strategies-002
  difficulty: beginner
  tags:
  - levers
  - blast-radius
  - trade-offs
  question: |
    Deployment strategies fundamentally trade off among three levers. Which set best
    captures them?
  options:
  - Language, framework, and cloud provider
  - CPU, memory, and disk
  - Commit frequency, PR size, and reviewer count
  - Blast radius, rollback speed/reliability, and cost/complexity
  answer: 3
  explanation: |
    Every strategy choice balances how many users a bad release hurts (blast radius), how
    quickly/safely you can revert (rollback), and how much extra infrastructure and
    operational sophistication it demands (cost/complexity).
  ref: concepts.md#why-deployment-strategy-matters
- id: deployment-strategies-003
  difficulty: beginner
  tags:
  - recreate
  - downtime
  question: |
    What is the defining characteristic of the "recreate" deployment strategy?
  options:
  - It terminates all old instances before starting new ones, causing downtime
  - It shifts traffic 1% at a time while analyzing metrics
  - It runs two full environments and flips a router
  - It mirrors production traffic to a discarded copy
  answer: 0
  explanation: |
    Recreate stops all old-version instances, then starts the new version. There is a
    window with zero instances serving traffic, so it incurs downtime. It never runs two
    versions simultaneously.
  ref: concepts.md#recreate-deployment
- id: deployment-strategies-004
  difficulty: intermediate
  tags:
  - recreate
  - version-compatibility
  question: |
    When is recreate deployment genuinely the right choice despite its downtime?
  options:
  - When you want the smallest possible blast radius
  - When old and new versions cannot coexist (e.g., an incompatible schema/format change)
  - When you need instant rollback
  - When you have precise traffic-shifting infrastructure
  answer: 1
  explanation: |
    Recreate is appropriate when the two versions cannot safely run at the same time —
    an exclusive lock, an incompatible on-disk/schema format — or in dev environments and
    apps where a maintenance window is acceptable. Otherwise its availability is the worst.
  ref: concepts.md#recreate-deployment
- id: deployment-strategies-005
  difficulty: beginner
  tags:
  - rolling
  - kubernetes
  - defaults
  question: |
    A rolling update deploys a new version by:
  options:
  - Incrementally replacing old instances with new ones until fully migrated
  - Flipping DNS to a pre-warmed second environment
  - Sending a copy of traffic to the new version and discarding responses
  - Stopping everything and restarting on the new version
  answer: 0
  explanation: |
    Rolling update replaces instances gradually — add new, drain/remove old, repeat. It is
    the Kubernetes default and requires no second full environment (only surge capacity).
  ref: concepts.md#rolling-update
- id: deployment-strategies-006
  difficulty: intermediate
  tags:
  - rolling
  - maxsurge
  - maxunavailable
  - zero-downtime
  question: |
    In a Kubernetes RollingUpdate, which configuration guarantees no capacity drops below
    the desired count during the roll (zero-downtime floor)?
  options:
  - 'maxSurge: 0 and maxUnavailable: 25%'
  - 'maxUnavailable: 100%'
  - 'strategy.type: Recreate'
  - 'maxUnavailable: 0 with maxSurge greater than 0'
  answer: 3
  explanation: |
    maxUnavailable: 0 means no pod may be missing below desired count, and maxSurge > 0
    lets the controller add new pods before removing old ones — always adding before
    subtracting, so serving capacity never dips.
  ref: concepts.md#rolling-update
- id: deployment-strategies-007
  difficulty: intermediate
  tags:
  - rolling
  - rollback
  - mixed-versions
  question: |
    Which is a genuine drawback of rolling updates compared with blue-green?
  options:
  - Rollback is slow because it is another rolling update in reverse, not an instant switch
  - Rolling updates require double the infrastructure
  - Rolling updates cause guaranteed downtime
  - Rolling updates cannot use health checks
  answer: 0
  explanation: |
    A rolling update's rollback is another gradual roll in the opposite direction — not a
    one-step flip. Meanwhile both versions serve traffic during the roll, so the release
    must be backward compatible.
  ref: concepts.md#rolling-update
- id: deployment-strategies-008
  difficulty: beginner
  tags:
  - blue-green
  - instant-rollback
  question: |
    What is the headline benefit of a blue-green deployment?
  options:
  - It uses no extra infrastructure
  - It routes by user attribute for experiments
  - It shifts traffic 1% at a time
  - Instant cutover and instant rollback by flipping the router back to the old environment
  answer: 3
  explanation: |
    Blue-green keeps two full environments; you flip the router to send 100% to green and,
    if it misbehaves, flip back to blue instantly. That instant, reliable rollback is its
    signature advantage — at the cost of ~2x infrastructure.
  ref: concepts.md#blue-green-deployment
- id: deployment-strategies-009
  difficulty: advanced
  tags:
  - blue-green
  - database
  - migration
  - rollback
  question: |
    A team does blue-green with a shared database. During the green deploy, a migration
    dropped a column that blue's code still reads. Green turns out to be buggy. What is the
    real problem with "just flip back to blue"?
  options:
  - Blue-green does not support databases at all
  - The destructive migration already changed the shared schema, so blue now runs against a schema 
    it cannot handle — the data is not rolled back by flipping
  - Flipping back requires re-provisioning both environments from scratch
  - The router cannot flip more than once
  answer: 1
  explanation: |
    Blue-green gives "free rollback" only for stateless app code. A non-backward-compatible
    migration on the shared DB is not undone by flipping traffic — blue now points at an
    incompatible schema. This is why blue-green must be paired with expand/contract migrations.
  ref: concepts.md#blue-green-deployment
- id: deployment-strategies-010
  difficulty: intermediate
  tags:
  - blue-green
  - cost
  - blast-radius
  question: |
    Which statement about blue-green deployment is TRUE?
  options:
  - Blue-green inherently limits blast radius to 1-5% of traffic
  - Blue-green never requires backward-compatible schema changes
  - At cutover, 100% of users move to the new version at once, so a bad-but-smoke-tests-passing 
    release still has full blast radius until you flip back
  - Blue-green requires a service mesh to function
  answer: 2
  explanation: |
    Blue-green is an all-at-once switch: everyone hits green at t=0. Its strength is instant
    rollback, not limited blast radius — canary is what limits blast radius by shifting a
    small percentage first.
  ref: concepts.md#blue-green-deployment
- id: deployment-strategies-011
  difficulty: beginner
  tags:
  - canary
  - blast-radius
  question: |
    What is the primary goal of a canary deployment?
  options:
  - To route users by geography for a marketing experiment
  - To eliminate the need for any monitoring
  - To limit blast radius by exposing a small subset of traffic first and progressively rolling 
    forward only if metrics stay healthy
  - To avoid running two versions at the same time
  answer: 2
  explanation: |
    Canary releases to a small traffic slice (e.g., 1-5%), monitors health/business metrics,
    and progressively increases only while healthy — otherwise it aborts. The point is a
    small early-warning sample that limits blast radius.
  ref: concepts.md#canary-deployment
- id: deployment-strategies-012
  difficulty: intermediate
  tags:
  - canary
  - automated-analysis
  - rollback
  question: |
    What makes automated canary analysis (e.g., Argo Rollouts AnalysisRun) powerful?
  options:
  - It doubles the number of environments
  - It compares canary vs baseline on metrics like error rate and latency and automatically aborts 
    the rollout if the canary is worse
  - It rewrites application code to fix bugs
  - It guarantees the canary never receives real traffic
  answer: 1
  explanation: |
    Automated analysis queries metrics (error rate, p99 latency, saturation, business KPIs)
    and compares canary against baseline; if the canary is statistically worse the rollout is
    aborted and rolled back — no human watching a dashboard required.
  ref: concepts.md#canary-deployment
- id: deployment-strategies-013
  difficulty: intermediate
  tags:
  - canary
  - rolling
  - comparison
  question: |
    How does a canary deployment differ from an ordinary rolling update?
  options:
  - Canary holds a fixed small percentage and analyzes metrics with a defined rollback trigger; 
    rolling just replaces pods and relies on readiness probes
  - Canary causes downtime while rolling does not
  - Rolling requires two full environments; canary requires one
  - There is no difference; they are the same thing
  answer: 0
  explanation: |
    A rolling update swaps pods incrementally but does not hold a deliberate small percentage
    and run metric analysis with an automated abort. Canary is metric-gated, deliberate traffic
    shifting with a defined rollback trigger.
  ref: concepts.md#canary-deployment
- id: deployment-strategies-014
  difficulty: intermediate
  tags:
  - bake-time
  - canary
  question: |
    In a canary/progressive rollout, what is "bake time"?
  options:
  - The time to compile the new artifact
  - The time DNS takes to propagate
  - The period each traffic step waits to gather enough metric signal before proceeding
  - The warm-up time for the JVM
  answer: 2
  explanation: |
    Bake time is the pause at each step long enough to collect meaningful metrics. A "canary"
    that jumps to 100% in seconds isn't really a canary because there's no signal to judge health.
  ref: concepts.md#canary-deployment
- id: deployment-strategies-015
  difficulty: intermediate
  tags:
  - canary
  - ab-testing
  - comparison
  question: |
    What is the key conceptual difference between canary and A/B testing?
  options:
  - Canary is about release safety (technical metrics); A/B testing is a business experiment routed 
    by user attribute to compare outcomes
  - A/B testing causes downtime; canary does not
  - Canary always runs longer than A/B tests
  - A/B testing never involves multiple versions
  answer: 0
  explanation: |
    Canary answers "is this build stable?" via random % and technical metrics (errors,
    latency). A/B testing answers "which variant performs better?" by routing on a user
    attribute (geo, cohort, header) and comparing business metrics over a longer window.
  ref: concepts.md#canary-vs-ab-testing
- id: deployment-strategies-016
  difficulty: intermediate
  tags:
  - ab-testing
  - routing
  question: |
    A team routes logged-in users in Germany to variant B and everyone else to variant A,
    then measures checkout conversion over two weeks. Which technique is this?
  options:
  - A/B testing
  - Blue-green deployment
  - Shadow deployment
  - Recreate deployment
  answer: 0
  explanation: |
    Routing by a user attribute (geo + logged-in state) to compare a business metric
    (conversion) over time to statistical significance is A/B testing — a controlled
    experiment, not a safety mechanism like canary.
  ref: concepts.md#canary-vs-ab-testing
- id: deployment-strategies-017
  difficulty: intermediate
  tags:
  - shadow
  - mirroring
  question: |
    In a shadow (traffic-mirroring) deployment, what happens to the new version's responses?
  options:
  - They are returned to 5% of users
  - They replace the old version's responses immediately
  - They are discarded (or compared offline); the old version still serves the real users
  - They are cached and served on the next request
  answer: 2
  explanation: |
    Shadow deployment sends a copy of real requests to the new version in parallel while the
    old version serves users; the new version's responses are discarded or diffed offline, so
    users are never affected. It validates the new version under real production traffic.
  ref: concepts.md#shadow-mirror-or-dark-deployment
- id: deployment-strategies-018
  difficulty: advanced
  tags:
  - shadow
  - side-effects
  - idempotency
  question: |
    What is the most dangerous pitfall of shadow deployment if not handled carefully?
  options:
  - It always causes user-facing downtime
  - It requires DNS changes that break TLS
  - 'Un-suppressed side effects: the shadow version writing to the DB, sending emails, or calling payment
    APIs causes duplicate writes/charges'
  - 'It cannot handle HTTP GET requests'
  answer: 2
  explanation: |
    Mirroring copies real requests. If the shadow version isn't isolated from side-effecting
    downstreams, you get duplicate DB writes, duplicate emails, or double charges. Shadow is
    safe mainly for read/idempotent paths or requires stubbed downstreams.
  ref: concepts.md#shadow-mirror-or-dark-deployment
- id: deployment-strategies-019
  difficulty: beginner
  tags:
  - feature-flags
  - deploy-vs-release
  question: |
    What does a feature flag primarily enable?
  options:
  - Compiling code faster
  - Automatically scaling pods
  - Encrypting secrets in the pipeline
  - Turning new behavior on/off at runtime, decoupling deploying code from releasing the feature
  answer: 3
  explanation: |
    A feature flag wraps new behavior in a runtime conditional, so code can be deployed dark
    and released later by flipping the toggle — no redeploy. This is the cleanest expression
    of deploy ≠ release.
  ref: concepts.md#feature-flags-decoupling-deploy-from-release
- id: deployment-strategies-020
  difficulty: intermediate
  tags:
  - feature-flags
  - kill-switch
  - trunk-based
  question: |
    Which capability is a direct benefit of feature flags?
  options:
  - Eliminating the need for a database
  - 'Making all deployments blue-green automatically'
  - Guaranteeing backward-compatible schemas
  - 'An instant kill switch: turn a bad feature off in seconds without a rollback deploy'
  answer: 3
  explanation: |
    Flags give an instant kill switch (disable a misbehaving feature without redeploying),
    support trunk-based development (merge incomplete features off), gradual rollouts, and
    feature-level A/B — but they don't fix schema compatibility for you.
  ref: concepts.md#feature-flags-decoupling-deploy-from-release
- id: deployment-strategies-021
  difficulty: intermediate
  tags:
  - feature-flags
  - flag-debt
  question: |
    What is "flag debt" and how should you manage it?
  options:
  - Long-lived forgotten flags create untested combinatorial code paths; treat release flags as 
    temporary and remove them after rollout
  - The cost of the flag vendor's license; negotiate it down
  - The latency added by evaluating flags; cache them forever
  - The number of flags allowed per environment; request a quota increase
  answer: 0
  explanation: |
    Forgotten, long-lived flags multiply code paths that are confusing and untested. Release
    toggles should be short-lived and removed once fully rolled out. (Ops/permission toggles
    may live longer by design.)
  ref: concepts.md#feature-flags-decoupling-deploy-from-release
- id: deployment-strategies-022
  difficulty: beginner
  tags:
  - progressive-delivery
  - definition
  question: |
    "Progressive delivery" is best described as:
  options:
  - Deploying only on Fridays
  - A branching strategy for monorepos
  - Continuous delivery where the release is gradual and metric-gated, promoting or rolling back 
    automatically
  - A way to encrypt build artifacts
  answer: 2
  explanation: |
    Progressive delivery is the umbrella for canary + automated analysis + feature flags +
    gradual traffic shifting done automatically, with the system promoting or aborting based
    on metrics rather than a human clicking through steps.
  ref: concepts.md#progressive-delivery
- id: deployment-strategies-023
  difficulty: intermediate
  tags:
  - argo-rollouts
  - canary
  - kubernetes
  question: |
    In Argo Rollouts, which two step types drive a canary's traffic progression and pacing?
  options:
  - setWeight and pause
  - apply and delete
  - scaleUp and scaleDown
  - commit and push
  answer: 0
  explanation: |
    An Argo Rollouts canary is an ordered list of steps: setWeight (percentage of traffic to
    the canary) and pause (bake/analyze, with an optional duration). analysis templates can
    abort the rollout if metrics are unhealthy.
  ref: concepts.md#progressive-delivery
- id: deployment-strategies-024
  difficulty: intermediate
  tags:
  - progressive-delivery
  - tools
  question: |
    Which pair are Kubernetes progressive-delivery controllers that automate canary/blue-green
    with metric analysis?
  options:
  - Terraform and Ansible
  - Prometheus and Grafana
  - Argo Rollouts and Flagger
  - Jenkins and GitLab CI
  answer: 2
  explanation: |
    Argo Rollouts and Flagger are the two common Kubernetes controllers that codify canary,
    blue-green, and A/B strategies with automated metric analysis and traffic shifting.
    Terraform/Ansible are IaC/config; Prometheus/Grafana are observability.
  ref: concepts.md#progressive-delivery
- id: deployment-strategies-025
  difficulty: beginner
  tags:
  - rollback
  - roll-forward
  question: |
    What is the difference between rollback and roll-forward?
  options:
  - Rollback ships a fix forward; roll-forward reverts to the old version
  - They both mean redeploying the same version
  - Rollback reverts to the previous known-good version; roll-forward ships a new fix on top of the 
    current version
  - Rollback only applies to databases; roll-forward only to code
  answer: 2
  explanation: |
    Rollback = go back to the last known-good release. Roll-forward (fix-forward) = keep the
    new version and deploy a new fix on top. Which is safer depends on whether state changes
    are reversible.
  ref: concepts.md#rollback-vs-roll-forward
- id: deployment-strategies-026
  difficulty: advanced
  tags:
  - roll-forward
  - migration
  - incident
  question: |
    A bad release already ran an irreversible migration that rewrote data into a new format.
    A bug is found. Why is roll-forward usually the safer recovery here?
  options:
  - Rolling back is always faster, so it is preferred
  - The old version cannot correctly handle the migrated data, so reverting to it is dangerous; 
    shipping a fix on the new version avoids going backward over the migration
  - Roll-forward requires no testing
  - Migrations can always be reversed instantly
  answer: 1
  explanation: |
    Once a non-reversible migration has run, the old code no longer fits the data. Rolling
    back would point known-good code at an incompatible/rewritten dataset. Rolling forward
    keeps you on the new schema and fixes the bug there.
  ref: concepts.md#rollback-vs-roll-forward
- id: deployment-strategies-027
  difficulty: intermediate
  tags:
  - rollback
  - stateless
  - best-practice
  question: |
    For a purely stateless application bug (no schema/data change), what is generally the
    best first recovery action?
  options:
  - Roll forward with a hotfix written under incident pressure
  - Recreate the entire cluster
  - Disable all health checks
  - Rollback to the known-good version because it is fast and reverts to a known state
  answer: 3
  explanation: |
    For stateless code bugs, rollback is fast and returns you to a known-good state with low
    cognitive load. Roll-forward is reserved for when rollback would be unsafe (e.g., after an
    irreversible migration).
  ref: concepts.md#rollback-vs-roll-forward
- id: deployment-strategies-028
  difficulty: beginner
  tags:
  - zero-downtime
  - schema
  - compatibility
  question: |
    Why must changes be backward compatible for a zero-downtime rolling/canary/blue-green deploy?
  options:
  - Because the load balancer requires it
  - Because for a moment old and new code run simultaneously against the same database
  - Because Kubernetes forbids incompatible images
  - Because feature flags demand it
  answer: 1
  explanation: |
    Any gradual or overlapping deploy has a window where both versions run at once against the
    same data store. If the change isn't backward compatible, one of the two running versions
    breaks — hence the need for additive, compatible changes.
  ref: concepts.md#zero-downtime-deploys-and-backward-compatible-schema-expandcontract
- id: deployment-strategies-029
  difficulty: intermediate
  tags:
  - expand-contract
  - schema
  - parallel-change
  question: |
    What are the three phases of the expand/contract (parallel-change) pattern, in order?
  options:
  - Contract, migrate, expand
  - Expand (add additively), migrate (dual-write/backfill), contract (drop old after nothing uses 
    it)
  - Backup, restore, verify
  - Deploy, release, monitor
  answer: 1
  explanation: |
    Expand: add the new element additively (nullable column/new table) so old and new code
    both work. Migrate: dual-write and backfill. Contract: once no running code depends on the
    old element, drop it in a later deploy.
  ref: concepts.md#zero-downtime-deploys-and-backward-compatible-schema-expandcontract
- id: deployment-strategies-030
  difficulty: advanced
  tags:
  - expand-contract
  - rename-column
  - zero-downtime
  question: |
    What is the correct zero-downtime way to "rename" a database column?
  options:
  - Issue a single ALTER TABLE ... RENAME COLUMN during the deploy
  - Drop the old column first, then add the new one
  - Add the new column, dual-write both, backfill, switch reads to the new column, then drop the old
    one in a later deploy
  - Rename it in code only and leave the DB unchanged
  answer: 2
  explanation: |
    A single RENAME breaks whichever running version doesn't know the new name. The safe path
    is add-new → dual-write → backfill → switch reads → drop-old across multiple deploys, so
    both versions always find a schema they understand.
  ref: concepts.md#zero-downtime-deploys-and-backward-compatible-schema-expandcontract
- id: deployment-strategies-031
  difficulty: intermediate
  tags:
  - graceful-shutdown
  - zero-downtime
  - kubernetes
  question: |
    Besides schema compatibility, what is required for a truly zero-downtime rollout when pods
    are terminated?
  options:
  - 'Graceful shutdown: drain in-flight requests on SIGTERM and deregister from the load balancer before
    exiting'
  - Deleting all readiness probes
  - 'Setting maxUnavailable to 100%'
  - Disabling autoscaling
  answer: 0
  explanation: |
    Terminating pods must first stop receiving new traffic (deregister from the LB) and let
    in-flight requests finish (SIGTERM handling, preStop hook, terminationGracePeriodSeconds).
    Otherwise clients see dropped/failed requests mid-roll.
  ref: concepts.md#zero-downtime-deploys-and-backward-compatible-schema-expandcontract
- id: deployment-strategies-032
  difficulty: intermediate
  tags:
  - traffic-shifting
  - mesh
  - dns
  question: |
    Why is DNS weighting (e.g., Route 53 weighted records) a poor mechanism for tight canary control?
  options:
  - DNS cannot express percentages at all
  - DNS only works for internal services
  - It requires a service mesh anyway
  - TTL/client caching makes the traffic shift slow and imprecise
  answer: 3
  explanation: |
    DNS resolution is cached per its TTL across resolvers and clients, so a weight change
    propagates slowly and imprecisely. It's fine for coarse blue-green flips but poor for the
    precise, fast weight changes canary needs — a mesh/smart ingress is better.
  ref: concepts.md#traffic-shifting-and-health-check-gating
- id: deployment-strategies-033
  difficulty: intermediate
  tags:
  - health-checks
  - readiness
  - liveness
  question: |
    What does a Kubernetes readiness probe control?
  options:
  - Whether the container is restarted
  - How fast the image is pulled
  - The pod's CPU limit
  - Whether the pod is included in the load-balancer/service pool to receive traffic right now
  answer: 3
  explanation: |
    A failing readiness probe removes the pod from the service endpoints so it receives no
    traffic (without killing it). This is what makes rolling updates safe — a new pod that
    isn't ready never serves users. Liveness, by contrast, triggers restarts.
  ref: concepts.md#traffic-shifting-and-health-check-gating
- id: deployment-strategies-034
  difficulty: advanced
  tags:
  - liveness
  - readiness
  - incident
  - gotcha
  question: |
    An overly aggressive liveness probe that checks a downstream dependency causes what classic
    failure during a dependency blip?
  options:
  - Faster deployments
  - Automatic rollback to the previous version
  - A restart loop of otherwise-healthy pods, turning a minor blip into an outage
  - Reduced memory usage
  answer: 2
  explanation: |
    Liveness failures restart the container. If liveness checks an external dependency, a
    transient dependency issue restart-loops healthy pods and amplifies the incident. Use
    readiness (not liveness) for dependency checks and keep external deps out of liveness.
  ref: concepts.md#traffic-shifting-and-health-check-gating
- id: deployment-strategies-035
  difficulty: intermediate
  tags:
  - health-checks
  - metrics
  - gating
  question: |
    Why should a rollout gate on application/business metrics in addition to process-level probes?
  options:
  - Because probes are deprecated
  - Because metrics are cheaper than probes
  - Because probes only work in staging
  - Because a process can pass readiness/liveness while still returning 500s or wrong results
  answer: 3
  explanation: |
    Readiness/liveness only confirm the process is up and responsive at a basic level. An app
    can be "ready" yet serving errors or bad data. Gating on error rate / SLO burn catches
    failures that process-level probes miss.
  ref: concepts.md#traffic-shifting-and-health-check-gating
- id: deployment-strategies-036
  difficulty: intermediate
  tags:
  - traffic-shifting
  - replica-ratio
  - precision
  question: |
    Without a service mesh or smart ingress, how does Kubernetes approximate canary traffic weight,
    and what's the limitation?
  options:
  - By editing DNS TTLs; the limit is TLS renegotiation
  - 'By CPU throttling; the limit is memory'
  - 'By replica ratio (canary pods : stable pods); it can''t do fine weights like 1% with only a few pods'
  - It cannot do canary at all without a mesh
  answer: 2
  explanation: |
    Plain Kubernetes approximates weight via the ratio of canary to stable pods (5:95 ≈ 5%).
    This is coarse — you can't express 1% with 3 pods. Precise request-level weighting needs a
    traffic router (Istio, NGINX, ALB weighted target groups, SMI).
  ref: concepts.md#traffic-shifting-and-health-check-gating
- id: deployment-strategies-037
  difficulty: beginner
  tags:
  - dora
  - metrics
  - definition
  question: |
    Which of the following is one of the four key DORA metrics?
  options:
  - Lines of code per commit
  - Lead time for changes (commit to running in production)
  - Number of open pull requests
  - Container image size
  answer: 1
  explanation: |
    The four DORA keys are deployment frequency, lead time for changes, change failure rate,
    and failed deployment recovery time (formerly MTTR). Lead time for changes measures commit
    to production.
  ref: concepts.md#dora-metrics-and-how-strategy-affects-them
- id: deployment-strategies-038
  difficulty: intermediate
  tags:
  - dora
  - change-failure-rate
  - definition
  question: |
    What does the DORA "change failure rate" measure?
  options:
  - The percentage of unit tests that fail in CI
  - The number of failed login attempts
  - The ratio of rolled-back branches
  - The percentage of deployments to production that cause a failure requiring remediation
  answer: 3
  explanation: |
    Change failure rate is the proportion of deployments that result in degraded service and
    require immediate remediation (hotfix, rollback, patch). Elite performers keep it low
    (roughly 0-15%).
  ref: concepts.md#dora-metrics-and-how-strategy-affects-them
- id: deployment-strategies-039
  difficulty: advanced
  tags:
  - dora
  - throughput-vs-stability
  - accelerate
  question: |
    A core finding of the DORA/Accelerate research about throughput and stability is that:
  options:
  - You must trade deployment frequency against stability — faster always means more failures
  - Stability metrics don't matter if you deploy often
  - Elite teams improve throughput AND stability together; safe, small, reversible releases enable 
    frequent deploys with low change-failure rate
  - Only large batch releases are stable
  answer: 2
  explanation: |
    DORA found high performers are not forced to trade speed for stability — they achieve both.
    Small, automated, safely reversible deployments (canary, blue-green, flags) lower change
    failure rate and recovery time while raising deployment frequency.
  ref: concepts.md#dora-metrics-and-how-strategy-affects-them
- id: deployment-strategies-040
  difficulty: intermediate
  tags:
  - dora
  - recovery-time
  - mttr
  question: |
    Which deployment-strategy capability most directly improves DORA "failed deployment recovery time"?
  options:
  - Instant rollback (blue-green flip) or automated canary abort / feature-flag kill switch
  - Larger release batches
  - Removing all health checks
  - Deploying only during business hours
  answer: 0
  explanation: |
    Recovery time is how fast you get back to healthy after a bad deploy. Instant rollback
    (blue-green), automated canary abort, and feature-flag kill switches all shrink this
    metric dramatically compared with slow reverse-rolls.
  ref: concepts.md#dora-metrics-and-how-strategy-affects-them
- id: deployment-strategies-041
  difficulty: intermediate
  tags:
  - decision-guide
  - selection
  - scenario
  question: |
    A high-traffic stateless API team has strong Prometheus metrics and a service mesh, and
    wants the smallest possible blast radius on each release. Which strategy fits best?
  options:
  - Recreate
  - Canary with automated analysis
  - Shadow only
  - Manual scheduled maintenance windows
  answer: 1
  explanation: |
    With good metrics and a mesh for precise weighting, canary with automated analysis gives
    the smallest blast radius (1-5% first) and auto-rollback on regression — exactly what this
    team wants.
  ref: concepts.md#choosing-a-strategy-decision-guide
- id: deployment-strategies-042
  difficulty: intermediate
  tags:
  - decision-guide
  - blue-green
  - scenario
  question: |
    A team's top requirement is the ability to revert instantly and completely if a release is
    bad, they have budget for extra capacity, and their app is stateless with a compatible
    schema. Which strategy is the most natural fit?
  options:
  - Blue-green
  - Recreate
  - Shadow
  - A/B testing
  answer: 0
  explanation: |
    Blue-green's defining benefit is instant, complete rollback by flipping back to the old
    environment. With budget for ~2x capacity, a stateless app, and compatible schema, it fits
    the "instant revert" requirement best.
  ref: concepts.md#choosing-a-strategy-decision-guide
- id: deployment-strategies-043
  difficulty: advanced
  tags:
  - scenario
  - whats-wrong
  - blue-green
  - migration
  question: |
    A team runs blue-green against one shared DB and, as part of the green deploy, applies a
    migration that renames a column in a single ALTER statement. What's the flaw in this plan?
  options:
  - Blue-green cannot use a load balancer
  - If green must be rolled back, blue's code references the old column name that no longer exists —
    rollback is broken; the schema change should be additive (expand/contract)
  - Migrations must always run before the blue deploy
  - Nothing is wrong; renames are always safe
  answer: 1
  explanation: |
    A one-shot rename makes the schema incompatible with blue. If green is buggy and you flip
    back, blue breaks against the renamed column. The fix is expand/contract: add the new
    column, dual-write/backfill, switch reads, drop the old one later.
  ref: concepts.md#zero-downtime-deploys-and-backward-compatible-schema-expandcontract
- id: deployment-strategies-044
  difficulty: intermediate
  tags:
  - scenario
  - whats-wrong
  - canary
  question: |
    A pipeline "canary" sets 50% weight, waits 5 seconds, then promotes to 100% with no metric
    analysis. Why is this not a meaningful canary?
  options:
  - There is essentially no bake time and no metric-gated decision, so it doesn't limit blast radius
    or catch regressions — it's just a fast rollout
  - 50% is not a valid weight
  - Canaries must always start at exactly 1%
  - You cannot promote to 100% in a canary
  answer: 0
  explanation: |
    A canary's value comes from a small initial slice, real bake time to gather signal, and an
    automated go/no-go on metrics. Jumping 50%→100% in 5s with no analysis exposes half of users
    immediately and provides no rollback trigger — it's not limiting blast radius.
  ref: concepts.md#canary-deployment
- id: deployment-strategies-045
  difficulty: beginner
  tags:
  - scenario
  - feature-flags
  - kill-switch
  question: |
    A newly released feature is causing errors for some users, but the underlying deploy is
    otherwise healthy. The feature was shipped behind a flag. What's the fastest safe mitigation?
  options:
  - Roll back the entire deployment and rebuild the cluster
  - Flip the feature flag off (kill switch) to disable just the bad feature instantly
  - Recreate all pods
  - Wait for the next scheduled release
  answer: 1
  explanation: |
    Because the feature is behind a flag, you can disable just that feature in seconds without
    redeploying or rolling back healthy code. That's the kill-switch benefit of decoupling
    release from deploy.
  ref: concepts.md#feature-flags-decoupling-deploy-from-release
- id: deployment-strategies-046
  difficulty: advanced
  tags:
  - scenario
  - shadow
  - side-effects
  question: |
    An engineer proposes shadowing production traffic to a new payment-processing service to
    test it under load, mirroring all POST /charge requests to the shadow. What must be true
    to do this safely?
  options:
  - Nothing special; shadow traffic never has side effects
  - The shadow service's downstream side effects (actual charges) must be stubbed/isolated, or 
    you'll double-charge customers
  - The shadow must serve 50% of real users
  - Payment endpoints cannot be tested any other way
  answer: 1
  explanation: |
    Mirroring a non-idempotent, side-effecting endpoint like POST /charge without isolating the
    downstream would execute real duplicate charges. Shadowing such paths requires stubbing the
    payment downstream or otherwise ensuring the mirrored requests cause no real side effects.
  ref: concepts.md#shadow-mirror-or-dark-deployment
- id: deployment-strategies-047
  difficulty: intermediate
  tags:
  - scenario
  - dora
  - interpretation
  question: |
    A team reports: deploys once every 3 weeks, lead time of 2 weeks, change failure rate 30%,
    recovery time ~2 days. By DORA standards, what should they prioritize?
  options:
  - Nothing — these are elite numbers
  - Deploying even less frequently to be safe
  - Removing health checks to speed up deploys
  - Smaller, more frequent, automated and reversible releases (e.g., trunk-based + canary/flags) to 
    raise frequency and cut failure rate and recovery time
  answer: 3
  explanation: |
    These are low-performer numbers across all four keys. The DORA-backed fix is smaller batches,
    automation, and safe reversibility (trunk-based development, canary/blue-green, feature flags),
    which improve throughput and stability together.
  ref: concepts.md#dora-metrics-and-how-strategy-affects-them
- id: deployment-strategies-048
  difficulty: intermediate
  tags:
  - recreate
  - rolling
  - comparison
  - scenario
  question: |
    Which statement correctly contrasts recreate and rolling update?
  options:
  - Both cause downtime by design
  - Recreate has downtime and never runs two versions at once; rolling has no downtime (with the 
    right knobs) but runs both versions simultaneously during the roll
  - Rolling requires two full environments while recreate needs none
  - Recreate limits blast radius better than rolling
  answer: 1
  explanation: |
    Recreate stops all old instances first (downtime, no coexistence). Rolling adds/removes
    incrementally (zero-downtime with maxUnavailable: 0 + surge) but has both versions live
    during the roll, requiring backward compatibility.
  ref: concepts.md#recreate-deployment
- id: deployment-strategies-049
  difficulty: advanced
  tags:
  - argo-rollouts
  - blue-green
  - resource-cost
  question: |
    In Argo Rollouts, canary with traffic routing can keep the stable ReplicaSet at 100% during
    the update (like blue-green's double pods). What option reduces that resource cost?
  options:
  - 'Setting maxUnavailable to 100%'
  - 'dynamicStableScale: true, which scales the stable set down as the canary weight increases'
  - Disabling the analysis step
  - Switching to the Recreate strategy
  answer: 1
  explanation: |
    By default canary-with-traffic-routing can run roughly double pods. dynamicStableScale: true
    lets the controller scale the stable ReplicaSet down as canary weight rises, cutting the
    resource overhead at some cost to instant full rollback capacity.
  ref: concepts.md#progressive-delivery
- id: deployment-strategies-050
  difficulty: intermediate
  tags:
  - progressive-delivery
  - feature-flags
  - combination
  question: |
    Why are a deployment strategy (e.g., canary) and feature flags described as complementary
    rather than redundant?
  options:
  - The strategy gets the binary out safely (deploy); flags control when a feature is exposed to 
    users (release) — combining them gives the finest control
  - Feature flags replace the need to deploy safely
  - Canary and flags do exactly the same thing
  - Flags are only for databases; canary only for code
  answer: 0
  explanation: |
    A flag doesn't ship your binary safely — you still need canary/rolling to deploy. And a
    safe deploy doesn't control per-feature exposure — that's the flag. Together: deploy safely,
    then release the feature independently with a toggle.
  ref: concepts.md#feature-flags-decoupling-deploy-from-release
- id: deployment-strategies-051
  difficulty: advanced
  tags:
  - dora
  - fifth-metric
  - reliability
  question: |
    Beyond the original four keys, DORA later emphasized an additional operational signal.
    Which best describes it?
  options:
  - Number of microservices deployed
  - Total cloud spend per month
  - Average pull-request size
  - Reliability / operational performance (meeting user-facing SLOs), reflecting how well the 
    software performs in production
  answer: 3
  explanation: |
    DORA added a reliability dimension — operational performance and meeting SLOs — recognizing
    that delivery speed and stability must translate into dependable service for users. The SLO
    alerting math lives in the SRE/observability topics.
  ref: concepts.md#dora-metrics-and-how-strategy-affects-them
- id: deployment-strategies-052
  difficulty: beginner
  tags:
  - decision-guide
  - shadow
  - blast-radius
  question: |
    Which deployment technique exposes users to zero risk from the new version because they
    never receive its responses?
  options:
  - Canary
  - Blue-green
  - Rolling update
  - Shadow (traffic mirroring)
  answer: 3
  explanation: |
    Shadow deployment mirrors a copy of requests to the new version while the old version
    continues to serve users; the new version's responses are discarded. Users are unaffected,
    giving zero user-facing blast radius (the risk is side effects, not user impact).
  ref: concepts.md#choosing-a-strategy-decision-guide
