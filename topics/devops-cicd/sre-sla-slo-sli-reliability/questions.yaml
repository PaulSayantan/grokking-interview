topic: "SRE: SLA, SLO, SLI & Reliability"
domain: devops-cicd
topic_slug: sre-sla-slo-sli-reliability
version: 1
questions:
  - id: sre-sla-slo-sli-reliability-001
    difficulty: beginner
    tags: [sre, definition, google]
    question: |
      Which statement best captures the founding idea of Site Reliability
      Engineering (SRE)?
    options: ["Operations should be fully outsourced to a managed cloud provider that owns reliability", "Developers should never be permitted to touch any production systems directly", "Operations is treated as a software problem, staffed by engineers who automate the work", "Reliability is guaranteed simply by buying more redundant server hardware"]
    answer: 2
    explanation: |
      SRE is 'what happens when you ask a software engineer to design an operations
      team' (Ben Treynor Sloss). Its core premise is that operations is a software
      problem: hire engineers who write code to automate the ops work and improve
      reliability, rather than scaling manual effort.
    ref: "concepts.md#what-sre-is-googles-approach"

  - id: sre-sla-slo-sli-reliability-002
    difficulty: beginner
    tags: [sli, definition, metrics]
    question: |
      An SLI (Service Level Indicator) is best described as what?
    options: ["A quantitative measurement of some aspect of the service, usually a good/valid ratio", "A contractual promise to customers that carries financial penalties if missed", "The maximum total downtime a service is allowed to incur per year", "A written runbook policy describing exactly what happens during an incident"]
    answer: 0
    explanation: |
      An SLI is a quantitative measure of the level of service, best expressed as a
      ratio of good events to valid events (e.g. successful requests / all valid
      requests), scaled to a percentage. The contract is the SLA; the target is the SLO.
    ref: "concepts.md#sli--service-level-indicator"

  - id: sre-sla-slo-sli-reliability-003
    difficulty: beginner
    tags: [slo, definition, target]
    question: |
      What is an SLO (Service Level Objective)?
    options: ["The raw metric collected straight from the load balancer", "A legal contract that is signed with each customer", "The roster of on-call engineers assigned to a service", "A target value or range for an SLI, measured over a time window"]
    answer: 3
    explanation: |
      An SLO is the target (value or range) for an SLI over a defined window, e.g.
      '99.9% of requests succeed over 28 days.' It is an internal engineering goal, not
      a customer contract.
    ref: "concepts.md#slo--service-level-objective"

  - id: sre-sla-slo-sli-reliability-004
    difficulty: beginner
    tags: [sla, definition, contract]
    question: |
      What distinguishes an SLA from an SLO?
    options: ["An SLA carries no consequences at all, whereas the SLO is the one that does", "An SLA is an external contract with a consequence (usually service credits) for missing it", "An SLA is always looser to measure than an SLO and needs no underlying metric", "An SLA and an SLO are simply two different names for the very same thing"]
    answer: 1
    explanation: |
      An SLA is an explicit or implicit contract with users that includes consequences
      — typically financial service credits — for missing the SLOs it contains. An SLO
      is just the internal engineering target with no contractual penalty.
    ref: "concepts.md#sla--service-level-agreement"

  - id: sre-sla-slo-sli-reliability-005
    difficulty: intermediate
    tags: [slo, sla, relationship]
    question: |
      In a well-run service, how do the internal SLO and the external SLA relate?
    options: ["The SLO is stricter than the SLA, giving margin to react before breaching the contract", "The SLA is stricter than the SLO so you always beat your contract", "They must be set to identical values for the contract to remain legally valid", "The SLO is only ever defined for services that have no external SLA"]
    answer: 0
    explanation: |
      The internal SLO is set tighter than the external SLA. You alert and react on the
      SLO so you have a safety margin before you actually breach the SLA and owe
      customers credits. E.g. SLA 99.9%, SLO 99.95%.
    ref: "concepts.md#sli-vs-slo-vs-sla--the-comparison"

  - id: sre-sla-slo-sli-reliability-006
    difficulty: beginner
    tags: [error-budget, definition]
    question: |
      If a service has an SLO of 99.9%, what is its error budget?
    options: ["99.9%", "1%", "0.1%", "0.01%"]
    answer: 2
    explanation: |
      The error budget is 100% - SLO. For a 99.9% SLO, the error budget is 0.1% — the
      fraction of requests (or time) you are allowed to fail before breaching the SLO.
    ref: "concepts.md#error-budgets"

  - id: sre-sla-slo-sli-reliability-007
    difficulty: intermediate
    tags: [availability, nines, math]
    question: |
      Approximately how much downtime per month does a 99.9% (three nines)
      availability target permit?
    options: ["About 4.3 minutes", "About 43 minutes", "About 7 hours", "About 26 seconds"]
    answer: 1
    explanation: |
      99.9% allows 0.1% downtime. Over ~30 days that is roughly 43 minutes per month
      (about 8.77 hours per year). Each additional nine divides allowed downtime by 10.
    ref: "concepts.md#availability-math-the-nines"

  - id: sre-sla-slo-sli-reliability-008
    difficulty: intermediate
    tags: [availability, nines, math]
    question: |
      Approximately how much downtime per month does 99.99% (four nines) allow?
    options: ["About 43 minutes", "About 26 seconds", "About 1 hour", "About 4.3 minutes"]
    answer: 3
    explanation: |
      99.99% allows 0.01% downtime, roughly 4.3 minutes per month (about 52.6 minutes
      per year). This is a common interview conversion to have memorized.
    ref: "concepts.md#availability-math-the-nines"

  - id: sre-sla-slo-sli-reliability-009
    difficulty: beginner
    tags: [toil, definition]
    question: |
      In SRE, 'toil' refers to work that is best described as which of the following?
    options: ["Manual, repetitive, automatable work with no enduring value that scales linearly with the service", "Any task that an individual engineer happens to personally find tedious or dislikes", "Design and architecture work for building brand-new product features", "Attending routine status meetings and answering internal email threads"]
    answer: 0
    explanation: |
      Toil has six specific properties: manual, repetitive, automatable, tactical,
      devoid of enduring value, and scaling O(n) with service growth. It is not merely
      'work you dislike,' and administrative overhead (email/meetings) is separate.
    ref: "concepts.md#toil-and-the-50-cap"

  - id: sre-sla-slo-sli-reliability-010
    difficulty: beginner
    tags: [toil, 50-percent-cap]
    question: |
      What is the recommended cap on the fraction of an SRE's time spent on toil?
    options: ["No more than 90%", "No more than 50%", "At least 50%", "Exactly 100%"]
    answer: 1
    explanation: |
      Google's SRE model caps toil at 50% so that at least half of an SRE's time goes
      to engineering work (automation, reliability improvements) that reduces future
      toil. Otherwise the team degenerates into a pure ops team that can never dig out.
    ref: "concepts.md#toil-and-the-50-cap"

  - id: sre-sla-slo-sli-reliability-011
    difficulty: intermediate
    tags: [sre, devops, relationship]
    question: |
      Which slogan best captures the relationship between SRE and DevOps?
    options: ["SRE replaces DevOps", "DevOps is a subset of SRE", "SRE and DevOps are unrelated", "class SRE implements interface DevOps"]
    answer: 3
    explanation: |
      DevOps is a philosophy/culture; SRE is a concrete, opinionated implementation of
      it. Google frames this as 'class SRE implements interface DevOps' — SRE provides
      specific practices (SLOs, error budgets, toil cap) that satisfy DevOps principles.
    ref: "concepts.md#sre-vs-devops"

  - id: sre-sla-slo-sli-reliability-012
    difficulty: beginner
    tags: [reliability-target, error-budget]
    question: |
      Why is 100% considered the wrong reliability target for almost any service?
    options: ["Because customers do not actually care about the reliability of the service", "Because standard monitoring tools are technically unable to measure a full 100%", "It is effectively unreachable, costs exponentially more than users can perceive, and leaves zero error budget to ship changes", "Because commercial SLAs explicitly forbid stating any 100% availability target"]
    answer: 2
    explanation: |
      100% is unattainable (dependencies, networks, and client devices all fail), the
      last fraction of a nine costs far more than users notice, and a 100% target leaves
      no error budget — removing your ability to ship changes at all.
    ref: "concepts.md#slo--service-level-objective"

  - id: sre-sla-slo-sli-reliability-013
    difficulty: intermediate
    tags: [error-budget-policy, feature-freeze]
    question: |
      What is the typical response defined by an error-budget policy when the budget is
      exhausted?
    options: ["Immediately raise the SLO to 100% so the budget can never be exhausted again", "Fire or formally discipline the on-call engineer held responsible for the burn", "Freeze feature releases, allowing only reliability and P0 fixes until the budget recovers", "Disable all monitoring and alerting so the budget-exhaustion pages stop firing"]
    answer: 2
    explanation: |
      An error-budget policy, agreed in advance, typically triggers a feature freeze
      when the budget is exhausted: only reliability fixes, bug fixes, and P0 security
      patches ship until the budget replenishes, refocusing the team on reliability.
    ref: "concepts.md#error-budget-policy-gating-releases"

  - id: sre-sla-slo-sli-reliability-014
    difficulty: intermediate
    tags: [sli, latency, percentile]
    question: |
      Why should a latency SLI use a percentile (e.g. p99) rather than the mean?
    options: ["The mean hides the tail latency where real users actually suffer", "The mean is far more computationally expensive to calculate than a percentile", "Percentiles are strictly mandated by every commercial SLA contract", "The mean value simply cannot be plotted on a time-series graph"]
    answer: 0
    explanation: |
      Averages mask the tail — a few very slow requests barely move the mean but
      represent real users having a bad experience. A high percentile (p95/p99) captures
      that tail, which is why latency SLIs are expressed as 'X% of requests under N ms.'
    ref: "concepts.md#sli--service-level-indicator"

  - id: sre-sla-slo-sli-reliability-015
    difficulty: intermediate
    tags: [sli, measurement, user-experience]
    question: |
      Where is it generally best to measure an availability SLI?
    options: ["As deep inside the backend as possible, right at the database storage layer", "Only within automated unit tests run before each deployment", "At the continuous-integration build and compile step", "As close to the user's experience as possible, e.g. at the load balancer or client"]
    answer: 3
    explanation: |
      Good SLIs are measured as close to the user as practical — at the load balancer or
      client — because that reflects what users actually experience. Measuring deep in
      the backend can show 'healthy' while users see errors from layers in front.
    ref: "concepts.md#sli--service-level-indicator"

  - id: sre-sla-slo-sli-reliability-016
    difficulty: advanced
    tags: [error-budget, requests, math, scenario]
    question: |
      A service handles 20,000,000 valid requests over its 28-day SLO window with a
      99.95% availability SLO. Roughly how many failed requests can it tolerate before
      breaching the SLO?
    options: ["About 1,000", "About 10,000", "About 100,000", "About 200,000"]
    answer: 1
    explanation: |
      Error budget = 1 - 0.9995 = 0.0005 (0.05%). 0.0005 x 20,000,000 = 10,000 requests.
      A request-based error budget is simply the budget fraction times total valid
      requests in the window.
    ref: "concepts.md#error-budgets"

  - id: sre-sla-slo-sli-reliability-017
    difficulty: intermediate
    tags: [dora, four-keys, metrics]
    question: |
      Which set correctly lists the four key DORA metrics?
    options: ["Deployment frequency, lead time for changes, change failure rate, failed deployment recovery time", "Code coverage, cyclomatic complexity, open bug count, and sprint story points completed", "CPU utilization, memory footprint, disk I/O wait, and total network throughput", "SLI, SLO, SLA, and remaining error-budget percentage"]
    answer: 0
    explanation: |
      The DORA four keys are deployment frequency and lead time for changes (velocity),
      plus change failure rate and failed deployment recovery time (stability, the
      latter formerly called time to restore / MTTR).
    ref: "concepts.md#dora-metrics-the-reliabilityvelocity-link"

  - id: sre-sla-slo-sli-reliability-018
    difficulty: intermediate
    tags: [dora, velocity-vs-stability]
    question: |
      DORA research classifies its four keys into two categories. Which pair measures
      stability (as opposed to velocity)?
    options: ["Deployment frequency together with lead time for changes", "Lead time for changes together with change failure rate", "Change failure rate and failed deployment recovery time", "Deployment frequency together with failed deployment recovery time"]
    answer: 2
    explanation: |
      Velocity = deployment frequency + lead time for changes. Stability = change
      failure rate + failed deployment recovery time. Elite performers score well on
      both simultaneously — the two are not a trade-off.
    ref: "concepts.md#dora-metrics-the-reliabilityvelocity-link"

  - id: sre-sla-slo-sli-reliability-019
    difficulty: advanced
    tags: [dora, interpretation, scenario]
    question: |
      A team deploys 30 times per day with a lead time of 2 hours, but its change
      failure rate is 42% and recovery takes 6 hours. How should this be interpreted?
    options: ["Clearly elite performance, since 30 deploys a day automatically qualifies as elite", "Not elite — velocity is high but stability is poor; the metrics must be read together", "The two-hour lead time alone proves the team is a low performer overall", "DORA metrics do not apply to any team that deploys this frequently in a day"]
    answer: 1
    explanation: |
      High deployment frequency and short lead time are only half the picture. A 42%
      change failure rate and 6-hour recovery are far from elite stability. DORA's value
      comes from reading velocity and stability together; fast but broken is reckless.
    ref: "concepts.md#dora-metrics-the-reliabilityvelocity-link"

  - id: sre-sla-slo-sli-reliability-020
    difficulty: advanced
    tags: [availability, dependencies, math]
    question: |
      A service depends serially on 4 components, each independently available 99.9% of
      the time. What is the approximate availability ceiling of the service?
    options: ["99.9%", "99.99%", "100%", "99.6%"]
    answer: 3
    explanation: |
      Serial (hard) dependencies multiply: 0.999^4 ≈ 0.996, i.e. about 99.6%. Long
      dependency chains lower your ceiling, which is why high nines are expensive and
      redundancy (parallel paths) is needed to raise availability above a component.
    ref: "concepts.md#availability-math-the-nines"

  - id: sre-sla-slo-sli-reliability-021
    difficulty: intermediate
    tags: [error-budget, incentive, culture]
    question: |
      What is the primary organizational benefit of an error budget?
    options: ["It turns the velocity-vs-reliability debate into a shared, data-driven, self-regulating decision", "It eliminates the need for monitoring by proving reliability from budget accounting alone", "It contractually guarantees zero downtime for the whole SLO measurement window", "It lets managers rank and rate engineers by the number of failures each has caused"]
    answer: 0
    explanation: |
      The error budget is a common incentive: when budget remains, dev can ship and take
      risks; when it is exhausted, reliability work takes priority. It replaces
      subjective arguments with a shared, quantitative resource both sides manage.
    ref: "concepts.md#error-budgets"

  - id: sre-sla-slo-sli-reliability-022
    difficulty: advanced
    tags: [error-budget-policy, pipeline, gating, scenario]
    question: |
      A CD pipeline has a stage that queries the SLO tool and fails if the remaining
      error budget is <= 0 for feature-type changes. What is this an example of?
    options: ["A canary deployment that shifts traffic gradually to the new version", "An error-budget gate wiring the policy directly into the release pipeline", "A blue-green switch that flips all traffic between two identical environments", "A load test that drives synthetic traffic to measure capacity headroom"]
    answer: 1
    explanation: |
      Querying the remaining error budget and blocking non-critical (feature) deploys
      when it is exhausted is an automated error-budget gate — it enforces the
      error-budget policy in the pipeline rather than relying on a manual meeting.
    ref: "concepts.md#error-budget-policy-gating-releases"

  - id: sre-sla-slo-sli-reliability-023
    difficulty: beginner
    tags: [postmortem, blameless]
    question: |
      What does 'blameless' mean in a blameless postmortem?
    options: ["No postmortem document is written at all, so nobody is publicly embarrassed", "Only managers and senior leadership are permitted to attend the review meeting", "The engineer who caused the incident is named in the report and formally disciplined", "It focuses on systems and processes rather than punishing individuals"]
    answer: 3
    explanation: |
      Blameless postmortems assume people acted rationally with the information they had,
      so they examine what about the system allowed the failure — not who to punish. This
      preserves psychological safety, so people share honestly and real fixes get made.
    ref: "concepts.md#blameless-postmortems-intro"

  - id: sre-sla-slo-sli-reliability-024
    difficulty: intermediate
    tags: [postmortem, action-items]
    question: |
      Beyond a narrative timeline, what must a good postmortem produce?
    options: ["A ranked list of the employees to reprimand for the outage", "A binding promise that the team will never deploy to production again", "Prioritized, owned, tracked action items with due dates", "A customer-facing press release drafted by the communications team"]
    answer: 2
    explanation: |
      A postmortem's value is prevention: it should end in prioritized action items that
      are owned and tracked to completion, not just a story of what happened. Without
      tracked follow-through, the same incident recurs.
    ref: "concepts.md#blameless-postmortems-intro"

  - id: sre-sla-slo-sli-reliability-025
    difficulty: intermediate
    tags: [sre-topologies, centralized, embedded]
    question: |
      What is a key trade-off between a centralized SRE team and embedded SREs?
    options: ["Centralized SREs are barred from writing code, whereas only embedded SREs may automate", "Embedded SRE is always cheaper to staff and strictly better on every dimension", "Centralized gives consistency and economy of scale but risks becoming a bottleneck; embedded gives product context but risks inconsistency", "There is no meaningful difference between the two models beyond where the desks sit"]
    answer: 2
    explanation: |
      Centralized SRE brings consistent standards and shared tooling but can be a
      bottleneck and detached from product context. Embedded SRE brings deep product
      context and speed but risks inconsistent practices and scope creep. Many orgs
      run a hybrid.
    ref: "concepts.md#sre-team-topologies-embedded-vs-centralized"

  - id: sre-sla-slo-sli-reliability-026
    difficulty: intermediate
    tags: [toil, automation, prioritization]
    question: |
      When deciding which toil to automate first, what generally gives the best return?
    options: ["The highest-frequency, highest-effort toil", "The rarest tasks that occur roughly once a year at most", "Whatever script is easiest to write, no matter how seldom it runs", "Only the one-off tasks that will provably never happen a second time"]
    answer: 0
    explanation: |
      Automating high-frequency, high-effort toil yields the best ROI. Automating a
      once-a-year task rarely pays off (the classic 'is it worth the time?' trade-off).
      Target the toil that consumes the most cumulative human time.
    ref: "concepts.md#reducing-toil-via-automation"

  - id: sre-sla-slo-sli-reliability-027
    difficulty: advanced
    tags: [toil, automation, gotcha]
    question: |
      Which is a real risk when reducing toil through automation?
    options: ["Automation always eliminates every source of future toil once and permanently", "Automation is technically impossible to apply to genuinely repetitive tasks", "Automated tasks can never be observed, logged, or monitored after they run", "Automating a broken process just makes the mistakes happen faster, and brittle scripts can themselves become toil"]
    answer: 3
    explanation: |
      Automating a broken process propagates errors faster, and fragile scripts everyone
      must babysit become a new form of toil. Good automation is idempotent, observable,
      and safe to re-run — and sometimes eliminating the task beats automating it.
    ref: "concepts.md#reducing-toil-via-automation"

  - id: sre-sla-slo-sli-reliability-028
    difficulty: intermediate
    tags: [sla, service-credits, contract]
    question: |
      What is the most common consequence written into a commercial SLA when the target
      is missed?
    options: ["Immediate termination of the engineering team responsible for the outage", "Service credits (partial refunds) to the customer, usually claim-based", "A public apology posted to the status page and nothing more", "A permanent increase in the customer's monthly subscription price"]
    answer: 1
    explanation: |
      SLAs typically specify service credits — a percentage refund tied to how far below
      target the service fell. Credits are usually claim-based (the customer must request
      them) and the SLA lists exclusions like scheduled maintenance and force majeure.
    ref: "concepts.md#sla--service-level-agreement"

  - id: sre-sla-slo-sli-reliability-029
    difficulty: beginner
    tags: [sli, ratio, formula]
    question: |
      Which formula best expresses a well-formed SLI?
    options: ["good events / valid events x 100%", "total requests / failed requests, expressed as a raw count", "total downtime minutes x the number of affected users", "the SLO target value minus the contractual SLA value"]
    answer: 0
    explanation: |
      A good SLI is a ratio of good events to valid events, scaled to a percentage. This
      keeps it between 0 and 100%, maps directly to an SLO target, and its complement is
      the error budget.
    ref: "concepts.md#sli--service-level-indicator"

  - id: sre-sla-slo-sli-reliability-030
    difficulty: advanced
    tags: [slo, window, rolling-vs-calendar]
    question: |
      Why do many teams prefer a rolling SLO window (e.g. trailing 28 days) over a
      calendar-aligned one?
    options: ["Rolling windows need no measurement because they average themselves out over time", "Calendar-aligned windows are explicitly illegal under most commercial SLA contracts", "Rolling windows avoid abrupt resets at a calendar boundary and reflect recent user experience continuously", "Rolling windows always report a strictly higher availability number than calendar ones"]
    answer: 2
    explanation: |
      A rolling window continuously reflects the recent past and does not 'forgive' a bad
      day just because the month rolled over. Calendar windows are still used when they
      must align with monthly SLA reporting, but rolling windows better track real
      recent experience.
    ref: "concepts.md#slo--service-level-objective"

  - id: sre-sla-slo-sli-reliability-031
    difficulty: intermediate
    tags: [sli-slo-sla, identification, scenario]
    question: |
      A dashboard shows 'measured 99.94% success this month.' In SRE terms, the value
      99.94% here is which of the following?
    options: ["An SLA", "An SLI value", "An error-budget policy", "A toil metric"]
    answer: 1
    explanation: |
      A measured value like 99.94% is an SLI (the indicator's current reading). The
      target it is compared against (e.g. '>= 99.9%') is the SLO, and a contractual
      promise around that target with a penalty would be the SLA.
    ref: "concepts.md#sli-vs-slo-vs-sla--the-comparison"

  - id: sre-sla-slo-sli-reliability-032
    difficulty: advanced
    tags: [burn-rate, error-budget, alerting]
    question: |
      A 'burn rate' of 10x for a service means what?
    options: ["The service is currently running ten times more available than its SLO target requires", "There are exactly ten separate SLOs defined and actively tracked for the service", "The service credit owed under the SLA for this window works out to ten percent", "The error budget is being consumed 10x faster than the sustainable rate, exhausting it in a tenth of the window"]
    answer: 3
    explanation: |
      A 1x burn rate exactly exhausts the budget by the end of the window; a 10x burn
      rate consumes it ten times faster, exhausting it in one-tenth of the window. Fast
      burn rates drive urgent alerts. The detailed burn-rate alert math lives in the
      observability domain.
    ref: "concepts.md#error-budgets"

  - id: sre-sla-slo-sli-reliability-033
    difficulty: intermediate
    tags: [availability, nines, math]
    question: |
      Roughly how much downtime per year does a 99% (two nines) availability target
      allow?
    options: ["About 3.65 days", "About 8.77 hours", "About 52 minutes", "About 5 minutes"]
    answer: 0
    explanation: |
      99% permits 1% downtime. 1% of a 365-day year is about 3.65 days. This is why 'two
      nines' is considered weak for user-facing services — days of allowed outage per year.
    ref: "concepts.md#availability-math-the-nines"

  - id: sre-sla-slo-sli-reliability-034
    difficulty: expert
    tags: [availability, nines, five-nines, math]
    question: |
      A stakeholder demands five nines (99.999%) availability. About how much total
      downtime per year does that permit, and what does it imply operationally?
    options: ["About 8.7 hours — easily handled by manual on-call response", "About 5.26 minutes — so tightly budgeted that recovery must be near-fully automated", "About 52 minutes — routine for most teams", "About 26 seconds — but only if there are no dependencies"]
    answer: 1
    explanation: |
      99.999% allows only ~5.26 minutes of downtime per year (~26 s/month). Human
      detect-and-respond loops cannot fit in that budget, so five nines effectively
      mandates automated failover and self-healing — and is very expensive to justify.
    ref: "concepts.md#availability-math-the-nines"

  - id: sre-sla-slo-sli-reliability-035
    difficulty: intermediate
    tags: [slo, design, philosophy]
    question: |
      What guidance do the Google SRE books give about how tight to set an SLO?
    options: ["Set it as tight as is technically possible, ideally a full 100% with zero budget", "Copy a direct competitor's published SLA figure exactly, whatever your users need", "Derive it from the single slowest server in the fleet during peak load hours", "Set it as loose as you can get away with, since every extra nine costs effort and shrinks the error budget"]
    answer: 3
    explanation: |
      SLOs should be as loose as you can get away with while keeping users happy. Every
      additional nine costs real engineering effort and reduces the error budget — your
      freedom to ship. Over-tight SLOs waste effort chasing reliability users won't notice.
    ref: "concepts.md#slo--service-level-objective"

  - id: sre-sla-slo-sli-reliability-036
    difficulty: intermediate
    tags: [dora, misuse, culture]
    question: |
      What is a well-known misuse of DORA metrics?
    options: ["Using them at the team level to guide sustained delivery improvement", "Reporting deployment frequency and lead time together as one velocity view", "Weaponizing them as individual performance KPIs, which invites gaming", "Tracking them over successive quarters to spot regressions and trends"]
    answer: 2
    explanation: |
      DORA metrics are team-level improvement signals, not individual scorecards. Ranking
      engineers by deploy count or lead time encourages gaming and destroys the metrics'
      value; they must also be read as velocity-and-stability together.
    ref: "concepts.md#dora-metrics-the-reliabilityvelocity-link"

  - id: sre-sla-slo-sli-reliability-037
    difficulty: beginner
    tags: [sre, devops, distinction]
    question: |
      Which statement most accurately contrasts DevOps and SRE?
    options: ["DevOps is simply a CI/CD tooling suite, whereas SRE is a dedicated programming language for ops", "They are entirely unrelated disciplines with no shared practices, goals, or common origin", "DevOps is a broad philosophy/culture; SRE is a specific implementation of it with concrete practices", "SRE was invented first and DevOps later emerged specifically to replace and deprecate it"]
    answer: 2
    explanation: |
      DevOps is the culture/philosophy (reduce silos, accept failure, automate, measure).
      SRE is one prescriptive way to implement it, adding SLOs, error budgets, a 50% toil
      cap, and blameless postmortems. They are complementary, not competing.
    ref: "concepts.md#sre-vs-devops"

  - id: sre-sla-slo-sli-reliability-038
    difficulty: advanced
    tags: [toil, not-toil, classification]
    question: |
      Which of the following is NOT toil under the SRE definition?
    options: ["Designing and coding an autoscaler to remove manual capacity changes", "Manually restarting the same crashed service every single morning to clear its memory leak", "Copy-pasting the identical config change across 40 production hosts one host at a time by hand", "Rubber-stamping a queue of identical quota-increase requests one by one with no policy check"]
    answer: 0
    explanation: |
      Designing and building an autoscaler is engineering work with enduring value that
      reduces future toil — it is exactly what the 50% engineering time is for. The other
      three are manual, repetitive, automatable, and scale with the service: classic toil.
    ref: "concepts.md#toil-and-the-50-cap"

  - id: sre-sla-slo-sli-reliability-039
    difficulty: intermediate
    tags: [error-budget, over-reliability, signal]
    question: |
      A team consistently ends every SLO window with nearly its entire error budget
      unspent. What does this most likely indicate?
    options: ["The team is performing optimally and the SLO should be tightened further toward 100%", "The external SLA has already been breached and customer service credits are now owed", "The monitoring pipeline is silently broken and simply failing to record any of the real errors", "The SLO is set too high; the team may be over-investing in reliability at the cost of shipping speed"]
    answer: 3
    explanation: |
      An always-full error budget suggests the SLO is stricter than users require. The
      team could safely loosen the SLO (or ship faster / take more risks) — a never-spent
      budget signals over-investment in reliability relative to velocity.
    ref: "concepts.md#error-budgets"

  - id: sre-sla-slo-sli-reliability-040
    difficulty: intermediate
    tags: [sli-menu, categories]
    question: |
      Which of these is a standard SLI category from the SRE 'SLI menu'?
    options: ["Number of lines of production code committed per engineer during the window", "Freshness (fraction of data views refreshed within a threshold)", "Total employee headcount currently assigned to operate and maintain the service", "Number of internal status and planning meetings the team holds each week"]
    answer: 1
    explanation: |
      Standard SLI categories include availability, latency, correctness/quality,
      freshness, and throughput/durability. Freshness measures whether data/views are
      updated within a threshold — relevant for pipelines and derived data. Code lines
      and headcount are not user-facing service indicators.
    ref: "concepts.md#sli--service-level-indicator"

  - id: sre-sla-slo-sli-reliability-041
    difficulty: advanced
    tags: [error-budget-policy, enforcement, gotcha]
    question: |
      Leadership overrides the feature freeze every single time the error budget is
      exhausted so the roadmap can ship. What is the consequence?
    options: ["The error-budget policy is effectively dead — it becomes theatre with no real enforcement", "The remaining error budget automatically doubles to absorb the additional feature releases", "The external SLA is automatically renegotiated in the customer's favor to a looser target", "Reliability improves over time because the team keeps shipping features straight through the freeze"]
    answer: 0
    explanation: |
      An error-budget policy only works if the pre-agreed policy — not a person under
      roadmap pressure — makes the decision. Overriding the freeze every time removes all
      enforcement, so the policy stops governing the velocity-vs-reliability trade-off.
    ref: "concepts.md#error-budget-policy-gating-releases"

  - id: sre-sla-slo-sli-reliability-042
    difficulty: intermediate
    tags: [sla, internal-services, no-sla]
    question: |
      Can a service legitimately have SLOs but no SLA?
    options: ["No — every SLO is legally required to be wrapped inside a signed customer SLA", "No — an SLO can only ever be defined as a clause that lives inside an enclosing SLA", "Yes — internal services (and those with no paying external customers) often publish SLOs without any contractual SLA", "Yes, but only during the window in which the service is fully offline for maintenance"]
    answer: 2
    explanation: |
      An SLA implies an external contract with consequences. Internal services and those
      without paying external customers commonly define SLOs (engineering targets) with
      no SLA at all. Every SLA is built on SLOs, but not every SLO has an SLA.
    ref: "concepts.md#sli-vs-slo-vs-sla--the-comparison"

  - id: sre-sla-slo-sli-reliability-043
    difficulty: advanced
    tags: [toil, scaling, why-cap]
    question: |
      Why does uncapped toil ultimately limit a service's ability to scale?
    options: ["Toil directly degrades CPU and memory performance, making the servers themselves run slower", "Toil scales O(n) with the service, so growth eventually consumes 100% of the team, capping scale at manual throughput", "Toil automatically counts as an SLA violation the moment an engineer performs it", "Toil enlarges the available error budget, which then tempts the team into shipping too fast"]
    answer: 1
    explanation: |
      Because toil grows linearly with the service, unbounded toil eventually saturates
      the team, leaving no time for engineering. Scale then becomes limited by human
      manual throughput. Capping toil (and automating it) decouples growth from headcount.
    ref: "concepts.md#toil-and-the-50-cap"

  - id: sre-sla-slo-sli-reliability-044
    difficulty: intermediate
    tags: [reducing-toil, gitops, iac, tools]
    question: |
      Which combination of tools is most aligned with the SRE goal of automating toil in
      deployment and infrastructure operations?
    options: ["Tracking desired infrastructure state in spreadsheets and applying it via manual SSH sessions", "Emailing free-text change requests to a shared ops queue for an operator to action by hand", "Manually editing the config on each host in turn and restarting every process by hand afterward", "Terraform/Ansible for infra, CD pipelines for releases, and Argo CD/Flux (GitOps) for reconciling cluster state"]
    answer: 3
    explanation: |
      Automating toil means replacing manual work with code: declarative infra
      (Terraform/Ansible), automated releases (CI/CD pipelines), and GitOps reconciliation
      (Argo CD/Flux) so desired state is applied automatically. Self-healing (autoscaling,
      auto-rollback) removes the human entirely.
    ref: "concepts.md#reducing-toil-via-automation"

  - id: sre-sla-slo-sli-reliability-045
    difficulty: advanced
    tags: [availability, request-vs-time-based, scenario]
    question: |
      A service reports 100% uptime (the process never crashed) yet returned HTTP 500 for
      3% of requests this month. Which SLI type reveals the problem?
    options: ["Request-based (success-ratio) availability, which shows only 97% of requests succeeded", "Time-based (uptime) availability, which already fully captured the outage as downtime minutes", "Neither one — with the process never crashing, the service was in fact perfectly reliable", "A freshness SLI measuring whether the served data was refreshed within its staleness threshold"]
    answer: 0
    explanation: |
      Time-based uptime can read 100% while the service serves errors. A request-based
      availability SLI (successful responses / valid requests) exposes that only 97%
      succeeded — which is why request-based SLIs are usually the better user proxy.
    ref: "concepts.md#availability-math-the-nines"

  - id: sre-sla-slo-sli-reliability-046
    difficulty: beginner
    tags: [dora, fifth-metric, reliability]
    question: |
      Which additional metric did later DORA reports add, explicitly connecting DORA to
      SRE?
    options: ["Lines of code shipped per developer, as a proxy for raw delivery throughput", "Reliability (operational performance against SLOs)", "Number of Jira tickets closed per sprint across the delivery team", "Cloud infrastructure spend per month as an efficiency-of-delivery indicator"]
    answer: 1
    explanation: |
      Later DORA reports added reliability — operational performance measured against
      SLOs — as a fifth metric, tying the delivery-performance research directly to SRE's
      SLO/error-budget model. High performers ship fast and stay reliable.
    ref: "concepts.md#dora-metrics-the-reliabilityvelocity-link"

  - id: sre-sla-slo-sli-reliability-047
    difficulty: advanced
    tags: [sre-topologies, production-readiness-review]
    question: |
      What is a production readiness review (PRR) in the SRE engagement model?
    options: ["A mandatory line-by-line code review of every individual commit before it is merged", "A quarterly financial audit of the infrastructure and cloud spend for the service", "A periodic performance review that formally rates the on-call engineer's incident record", "A review before an SRE team agrees to onboard/support a service, often negotiating the SLO and error-budget policy"]
    answer: 3
    explanation: |
      A PRR is the handshake before SRE takes on operational support for a service. It
      assesses whether the service meets reliability standards and is where the SLO and
      error-budget policy are typically negotiated as part of onboarding.
    ref: "concepts.md#sre-team-topologies-embedded-vs-centralized"

  - id: sre-sla-slo-sli-reliability-048
    difficulty: intermediate
    tags: [postmortem, trigger-criteria]
    question: |
      Why should postmortem trigger criteria be agreed on in advance?
    options: ["To speed up assigning individual blame for the incident to a responsible engineer", "To keep the bar so high that the team almost never has to write a postmortem at all", "So there is an objective, pre-agreed bar (e.g. user-visible impact, data loss, SLO breach) for when a postmortem is required", "Because industry regulators legally mandate exactly one postmortem be filed per calendar year"]
    answer: 2
    explanation: |
      Pre-agreed triggers — such as user-visible downtime beyond a threshold, data loss,
      emergency intervention, or an SLO breach — remove ambiguity and defensiveness about
      whether an incident 'deserves' a postmortem, so learning happens consistently.
    ref: "concepts.md#blameless-postmortems-intro"

  - id: sre-sla-slo-sli-reliability-049
    difficulty: expert
    tags: [error-budget, sla, credits, scenario]
    question: |
      A team's SLA promises 99.9% with credits below that; their internal SLO is 99.95%.
      During a bad month the SLI lands at 99.92%. What is the situation?
    options: ["Both the SLO and SLA are breached; customers get credits", "The SLA is breached but the SLO is met", "The SLO is breached (triggering internal policy) but the SLA is still met, so no credits are owed", "Neither is breached and there is nothing to act on"]
    answer: 2
    explanation: |
      99.92% is below the 99.95% SLO (so the internal error-budget policy should react)
      but still above the 99.9% SLA (so no contractual credits are owed). This is exactly
      why the SLO is set stricter than the SLA — the margin catches problems first.
    ref: "concepts.md#sli-vs-slo-vs-sla--the-comparison"

  - id: sre-sla-slo-sli-reliability-050
    difficulty: intermediate
    tags: [sre, automate-away, philosophy]
    question: |
      Which phrase best expresses a core SRE aspiration about the nature of the job?
    options: ["Automate this year's job away so scale is decoupled from headcount", "Hire one additional dedicated operator for every new server the fleet adds", "Concentrate all operational knowledge inside a single senior engineer's head for consistency", "Freeze the system and never change anything at all once it is confirmed working"]
    answer: 0
    explanation: |
      SRE aims to make growth sublinear in human effort — automating away recurring work
      so the next unit of scale does not require a proportional unit of headcount. This
      is the deeper purpose behind the toil cap and the 'operations as software' stance.
    ref: "concepts.md#what-sre-is-googles-approach"

