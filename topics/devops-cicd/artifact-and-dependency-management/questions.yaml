topic: "Artifact & Dependency Management"
domain: devops-cicd
topic_slug: artifact-and-dependency-management
version: 1
questions:
  - id: artifact-and-dependency-management-001
    difficulty: beginner
    tags: [artifacts, definitions]
    question: |
      In CI/CD terms, what is a "build artifact"?
    options:
      - "A deployable output of a build, such as a JAR, wheel, container image, or zipped bundle"
      - "The source code stored in the Git repository"
      - "The YAML file that defines the pipeline"
      - "A log file produced while tests run"
    answer: 0
    explanation: |
      An artifact is the deployable output of a build step (JAR/WAR, wheel, npm tarball, Go
      binary, .deb/.rpm, container image, Lambda zip). It is distinct from source code (in
      Git) and from the dependencies the build consumes.
    ref: "concepts.md#build-artifacts-and-artifact-repositories"

  - id: artifact-and-dependency-management-002
    difficulty: beginner
    tags: [artifact-repository, tooling]
    question: |
      Which of the following is an artifact/binary repository manager?
    options:
      - "Prometheus"
      - "Terraform"
      - "JFrog Artifactory"
      - "Ansible"
    answer: 2
    explanation: |
      JFrog Artifactory is a universal artifact repository (Maven, npm, PyPI, Docker, Helm,
      etc.). Sonatype Nexus, GitHub Packages, and cloud registries (ECR, CodeArtifact) are
      others. Prometheus is monitoring, Terraform is IaC, Ansible is config management.
    ref: "concepts.md#build-artifacts-and-artifact-repositories"

  - id: artifact-and-dependency-management-003
    difficulty: beginner
    tags: [artifact-repository, anti-pattern]
    question: |
      Why is committing compiled binaries directly into a Git repository considered an
      anti-pattern?
    options:
      - "Git cannot store binary files at all"
      - "Binaries are automatically encrypted and become unreadable"
      - "Git refuses to push files larger than 1 KB"
      - "It bloats the repo, makes history hard to prune, and loses format-native package tooling"
    answer: 3
    explanation: |
      Git is for source; artifact repositories are for outputs. Storing binaries in Git
      bloats the repo and history and gives up the format-aware tooling (pip/maven/docker
      clients), checksums, retention, and access control a repository manager provides.
    ref: "concepts.md#build-artifacts-and-artifact-repositories"

  - id: artifact-and-dependency-management-004
    difficulty: intermediate
    tags: [artifact-repository, benefits]
    question: |
      What advantage does a dedicated artifact repository provide over storing build outputs
      in a plain object bucket you manage yourself?
    options:
      - "It compiles your code for you"
      - "It is format-aware (speaks Maven/pip/docker protocols), stores checksums, and enforces retention and access control"
      - "It eliminates the need for a lockfile"
      - "It guarantees your tests always pass"
    answer: 1
    explanation: |
      A repository manager understands package formats and their native protocols, exposes
      correct metadata/indexes, stores integrity checksums, and adds access control, audit,
      retention, and proxying — none of which a raw bucket gives you.
    ref: "concepts.md#build-artifacts-and-artifact-repositories"

  - id: artifact-and-dependency-management-005
    difficulty: beginner
    tags: [immutability, definitions]
    question: |
      What does it mean for a published artifact version to be "immutable"?
    options:
      - "It can never be deleted from the repository"
      - "It cannot be deployed to production"
      - "It has no version number"
      - "Its bytes never change once published under that version"
    answer: 3
    explanation: |
      Immutability means the content bound to a given version is fixed forever. If
      my-service:1.4.2 exists, it is exactly one set of bytes. This is what lets you trust
      that what you tested is what you deploy, and makes caching and rollback reliable.
    ref: "concepts.md#immutable-artifacts-and-versioning"

  - id: artifact-and-dependency-management-006
    difficulty: beginner
    tags: [semver, versioning]
    question: |
      Under Semantic Versioning (MAJOR.MINOR.PATCH), which change increments the MAJOR
      number?
    options:
      - "A backward-incompatible (breaking) API change"
      - "A backward-compatible bug fix"
      - "A new backward-compatible feature"
      - "A documentation-only update"
    answer: 0
    explanation: |
      SemVer: MAJOR = incompatible/breaking changes, MINOR = new backward-compatible
      functionality, PATCH = backward-compatible bug fixes. Breaking changes bump MAJOR so
      consumers know to expect incompatibilities.
    ref: "concepts.md#immutable-artifacts-and-versioning"

  - id: artifact-and-dependency-management-007
    difficulty: intermediate
    tags: [semver, build-metadata]
    question: |
      In a version like `1.4.2+sha.a1b2c3`, what is the `+sha.a1b2c3` portion, per SemVer?
    options:
      - "A pre-release identifier that lowers precedence"
      - "The MAJOR version"
      - "Build metadata, which is ignored when comparing version precedence"
      - "An invalid string that most tools reject"
    answer: 2
    explanation: |
      The `+...` suffix is build metadata (SemVer). It is allowed and commonly used to embed
      a commit SHA or build number, but it is ignored for precedence ordering. Pre-release
      identifiers use `-` (e.g. `1.0.0-rc.1`) and DO affect precedence.
    ref: "concepts.md#immutable-artifacts-and-versioning"

  - id: artifact-and-dependency-management-008
    difficulty: intermediate
    tags: [mutable-tags, containers, latest]
    question: |
      Why is deploying a container image by the `:latest` tag to production discouraged?
    options:
      - "`latest` images are always larger than versioned ones"
      - "`latest` is a mutable tag, so you don't actually know what content you're running and nodes can pull different images"
      - "Kubernetes cannot pull the `latest` tag"
      - "`latest` disables health checks"
    answer: 1
    explanation: |
      `latest` is mutable — it can be re-pointed to different content at any time. Deploying
      it means you can't say what's actually running, rollback is meaningless ("roll back to
      what?"), and two nodes pulling at different times can get different images. Pin an
      immutable version or a digest.
    ref: "concepts.md#immutable-artifacts-and-versioning"

  - id: artifact-and-dependency-management-009
    difficulty: advanced
    tags: [digest, immutability, containers]
    question: |
      Which reference to a container image is the strongest guarantee that you are running
      exactly the content you intend?
    options:
      - "The `:latest` tag"
      - "A major-only tag like `:1`"
      - "A content-addressed digest, e.g. `@sha256:...`"
      - "The repository name with no tag"
    answer: 2
    explanation: |
      A digest (`@sha256:...`) is content-addressed: it names the exact bytes and cannot be
      moved to different content. Tags — even `:1.4.2` — are pointers a registry could in
      principle re-point unless tag immutability is enforced; the digest can't lie.
    ref: "concepts.md#immutable-artifacts-and-versioning"

  - id: artifact-and-dependency-management-010
    difficulty: intermediate
    tags: [snapshot, maven, versioning]
    question: |
      In Maven, how does a `-SNAPSHOT` version differ from a release version, and where does
      it belong?
    options:
      - "SNAPSHOTs are immutable release builds meant for production"
      - "SNAPSHOTs are just release versions with a longer name"
      - "SNAPSHOTs cannot be published to any repository"
      - "SNAPSHOTs are mutable-by-design pre-release builds and must not ship to production"
    answer: 3
    explanation: |
      SNAPSHOT versions are deliberately mutable pre-release builds — the same coordinate can
      resolve to newer bytes over time. They are fine for development/integration but must
      never be promoted to production, where you require immutable release versions.
    ref: "concepts.md#immutable-artifacts-and-versioning"

  - id: artifact-and-dependency-management-011
    difficulty: beginner
    tags: [build-once, principle]
    question: |
      What does the "build once, promote many" principle mean?
    options:
      - "Build the artifact a single time and move the same binary through every environment"
      - "Build the artifact separately for each environment to optimize per-env"
      - "Build many artifacts and pick the best one at deploy time"
      - "Rebuild only for production but reuse dev builds elsewhere"
    answer: 0
    explanation: |
      Build-once-promote-many means the artifact is built exactly once and the same bytes
      flow through dev → staging → prod. You never rebuild per environment, so what you
      tested is exactly what you ship.
    ref: "concepts.md#build-once-promote-many"

  - id: artifact-and-dependency-management-012
    difficulty: intermediate
    tags: [build-once, rationale]
    question: |
      Why does rebuilding an artifact separately for production undermine the pipeline's
      guarantees?
    options:
      - "It is slower but otherwise equivalent"
      - "The production binary was never the artifact that passed staging tests — deps, base image, or toolchain may differ"
      - "Rebuilding changes the source code"
      - "Production requires a different programming language"
    answer: 1
    explanation: |
      A prod rebuild is a different build than the one staging validated. Re-resolved
      transitive dependencies, a drifted base image, or a changed toolchain can reintroduce
      "works on my machine" at the environment level. Promoting identical bytes avoids this.
    ref: "concepts.md#build-once-promote-many"

  - id: artifact-and-dependency-management-013
    difficulty: intermediate
    tags: [build-once, twelve-factor, config]
    question: |
      Build-once-promote-many requires that environment differences be handled how?
    options:
      - "By baking each environment's values into the build"
      - "By maintaining a separate Git branch per environment"
      - "By recompiling with environment-specific flags"
      - "By externalizing config/secrets and injecting them at run time, so one artifact behaves differently per environment"
    answer: 3
    explanation: |
      Per 12-Factor "Config", environment-specific values must be externalized and injected
      (env vars/secrets/config), not baked into the artifact. The same bytes behave
      differently per environment via injected config; baking env values in breaks the model.
    ref: "concepts.md#build-once-promote-many"

  - id: artifact-and-dependency-management-014
    difficulty: beginner
    tags: [promotion, definitions]
    question: |
      What is "artifact promotion"?
    options:
      - "Rebuilding the artifact with optimizations for the target environment"
      - "Advertising a new release on social media"
      - "Advancing a specific artifact version to a higher environment without changing its bytes"
      - "Increasing the artifact's version number automatically"
    answer: 2
    explanation: |
      Promotion advances a specific, already-built artifact from a lower to a higher
      environment/maturity (e.g. staging → prod) with identical bytes — via repository/label
      moves, status properties, or a GitOps manifest update. A promotion that recompiles is
      not a promotion.
    ref: "concepts.md#artifact-promotion-across-environments"

  - id: artifact-and-dependency-management-015
    difficulty: intermediate
    tags: [promotion, digest, verification]
    question: |
      During promotion, what verifies that the artifact reaching production is the exact one
      that was tested?
    options:
      - "Matching the artifact's checksum/digest (e.g. SHA-256) against what was tested"
      - "The wall-clock time of the deploy"
      - "The number of pipeline stages it passed through"
      - "The name of the engineer who approved it"
    answer: 0
    explanation: |
      You promote by digest/checksum: verify the SHA-256 of the promoted artifact matches the
      one that passed tests. This is what makes "promote, don't rebuild" verifiable end to
      end.
    ref: "concepts.md#artifact-promotion-across-environments"

  - id: artifact-and-dependency-management-016
    difficulty: intermediate
    tags: [promotion, repositories, gates]
    question: |
      A team wants only vetted artifacts to be pullable by production. Which repository design
      supports this best?
    options:
      - "One shared repository for every build, prod pulls whatever is newest"
      - "Separate snapshot/dev repositories from release repositories, and promote artifacts (with gates) into the release repo"
      - "Delete each artifact right after deploy to save space"
      - "Use `:latest` everywhere so prod always gets recent code"
    answer: 1
    explanation: |
      Separating snapshot/dev repos from release repos means only artifacts that pass gates
      (tests, approvals, scans) are promoted into the release repo that prod pulls from. The
      maturity label travels with the artifact.
    ref: "concepts.md#artifact-promotion-across-environments"

  - id: artifact-and-dependency-management-017
    difficulty: beginner
    tags: [dependencies, transitive]
    question: |
      What are "transitive dependencies"?
    options:
      - "Dependencies you declare directly in your manifest"
      - "Dependencies that only exist during testing"
      - "The dependencies of your dependencies, pulled in indirectly"
      - "Dependencies written in a different language"
    answer: 2
    explanation: |
      Transitive dependencies are the dependencies of the packages you declare. They
      typically dominate the tree (declare 10, end up with hundreds) and are where surprises
      — behavior changes and vulnerabilities — most often hide.
    ref: "concepts.md#dependency-management-lockfiles-and-pinning"

  - id: artifact-and-dependency-management-018
    difficulty: beginner
    tags: [lockfile, definitions]
    question: |
      What does a lockfile (e.g. `package-lock.json`, `poetry.lock`, `Cargo.lock`) record?
    options:
      - "The exact resolved version (and often checksum) of every dependency, direct and transitive"
      - "Only the top-level dependencies you asked for"
      - "The list of files that changed in the last commit"
      - "Which team members are allowed to edit dependencies"
    answer: 0
    explanation: |
      A lockfile pins the exact resolved version of the entire dependency tree — direct and
      transitive — often with hashes, so a later install reproduces the identical set. That's
      what makes installs deterministic.
    ref: "concepts.md#dependency-management-lockfiles-and-pinning"

  - id: artifact-and-dependency-management-019
    difficulty: intermediate
    tags: [npm, ci, lockfile]
    question: |
      Why prefer `npm ci` over `npm install` in a CI pipeline?
    options:
      - "`npm ci` upgrades all dependencies to their latest versions"
      - "`npm ci` skips downloading dependencies entirely"
      - "`npm ci` ignores the lockfile for speed"
      - "`npm ci` installs the exact lockfile tree, and fails if package.json and the lockfile disagree"
    answer: 3
    explanation: |
      `npm ci` does a clean, deterministic install: it wipes node_modules and installs
      exactly what the lockfile specifies, erroring if the lockfile and package.json are out
      of sync. `npm install` may mutate the lockfile and re-resolve, which is non-deterministic
      for CI.
    ref: "concepts.md#dependency-management-lockfiles-and-pinning"

  - id: artifact-and-dependency-management-020
    difficulty: intermediate
    tags: [pinning, ranges, determinism]
    question: |
      A build's CI resolves `^1.4.0` and gets `1.4.7` today but `1.4.9` next week without any
      code change. What's the root cause and best fix?
    options:
      - "A CI bug; retry the build"
      - "A floating/range version is re-resolving; commit and honor a lockfile to pin the exact resolved versions"
      - "The registry is corrupted; switch registries"
      - "Nothing is wrong; versions should always float in CI"
    answer: 1
    explanation: |
      The caret range `^1.4.0` allows any `>=1.4.0 <2.0.0`, so installs are non-deterministic
      over time. Committing a lockfile and using a lockfile-honoring install (npm ci, poetry
      install) pins the exact resolved versions so builds are reproducible.
    ref: "concepts.md#dependency-management-lockfiles-and-pinning"

  - id: artifact-and-dependency-management-021
    difficulty: advanced
    tags: [hashes, go-sum, pip, integrity]
    question: |
      What extra guarantee do `go.sum` and pip's `--require-hashes` give beyond pinning a
      version number?
    options:
      - "They store cryptographic hashes, so an install fails if a registry serves tampered bytes for a pinned version"
      - "They make the build run faster"
      - "They automatically upgrade to newer patch versions"
      - "They remove the need for a lockfile"
    answer: 0
    explanation: |
      Version pinning says "same version"; stored hashes say "same bytes". If a registry (or
      a man-in-the-middle) serves altered content for a pinned version, hash verification
      fails the install. This upgrades reproducibility from version-level to byte-level.
    ref: "concepts.md#dependency-management-lockfiles-and-pinning"

  - id: artifact-and-dependency-management-022
    difficulty: advanced
    tags: [dependency-confusion, security]
    question: |
      What is a "dependency confusion" (substitution) attack?
    options:
      - "Two developers editing the lockfile at once"
      - "A build failing because a dependency was deleted"
      - "An attacker publishes a higher version under your private package's name on a public registry so the resolver picks the malicious one"
      - "Using two package managers in the same repo"
    answer: 2
    explanation: |
      If a private package name is also resolvable from a public registry, an attacker can
      publish a higher-versioned package of that name publicly; a naive resolver picks the
      "newer" public one. Mitigate with scoped names, resolving internal names from your local
      repo first, and not letting the public proxy shadow internal names.
    ref: "concepts.md#dependency-management-lockfiles-and-pinning"

  - id: artifact-and-dependency-management-023
    difficulty: intermediate
    tags: [lockfile, libraries, applications]
    question: |
      For a reusable library (as opposed to a deployable application), how should you
      generally declare dependency versions?
    options:
      - "Pin every dependency to an exact version so consumers get exactly your tree"
      - "Omit dependencies entirely and let consumers guess"
      - "Only ever use the `latest` tag"
      - "Declare compatible ranges so consumers can resolve versions that co-exist with their other deps"
    answer: 3
    explanation: |
      Applications benefit from exact pinning (they own the final deployment). Libraries
      should declare ranges so downstream consumers can resolve a single compatible version
      across many libraries; over-pinning a library forces version conflicts on consumers.
    ref: "concepts.md#dependency-management-lockfiles-and-pinning"

  - id: artifact-and-dependency-management-024
    difficulty: beginner
    tags: [reproducible-builds, definitions]
    question: |
      What is a reproducible (deterministic) build?
    options:
      - "A build that can be re-run if it fails"
      - "A build that produces bit-for-bit identical output from the same source and declared inputs, regardless of when or where it runs"
      - "A build that finishes in under one minute"
      - "A build that only runs on the developer's laptop"
    answer: 1
    explanation: |
      Reproducibility means the artifact is a pure function of its inputs: same source + same
      pinned inputs → identical bytes anywhere, anytime. This underpins verifiability
      (rebuild and confirm it matches source) and safe caching.
    ref: "concepts.md#reproducible-builds"

  - id: artifact-and-dependency-management-025
    difficulty: intermediate
    tags: [reproducible-builds, non-determinism]
    question: |
      Which of these is a common source of NON-determinism that breaks reproducible builds?
    options:
      - "Committing a lockfile with hashes"
      - "Sorting files explicitly before archiving them"
      - "Pinning the compiler by digest"
      - "Embedding a build timestamp or a floating base-image tag into the artifact"
    answer: 3
    explanation: |
      Baked-in timestamps and floating tags (like a `:latest` base image) make outputs differ
      between runs. Fixes include normalizing timestamps (SOURCE_DATE_EPOCH), pinning the base
      image/toolchain by digest, and sorting inputs deterministically.
    ref: "concepts.md#reproducible-builds"

  - id: artifact-and-dependency-management-026
    difficulty: advanced
    tags: [reproducible-builds, build-once, distinction]
    question: |
      How do "reproducible builds" and "build once, promote many" differ?
    options:
      - "Build-once means you never rebuild between environments; reproducibility means IF you rebuild you get identical bytes"
      - "They are two names for the same practice"
      - "Reproducibility applies only to containers; build-once only to JARs"
      - "Build-once is about speed; reproducibility is about security only"
    answer: 0
    explanation: |
      They solve different problems and are complementary. Build-once-promote-many avoids
      rebuilding between environments entirely. Reproducibility ensures that when you DO
      rebuild (audit, DR, verification) you get identical output. You want both.
    ref: "concepts.md#reproducible-builds"

  - id: artifact-and-dependency-management-027
    difficulty: beginner
    tags: [caching, ci, purpose]
    question: |
      What is the main purpose of dependency caching in CI?
    options:
      - "To store the final deployable artifact permanently"
      - "To encrypt dependencies at rest"
      - "To persist resolved dependencies between runs so jobs don't re-download the whole tree every time"
      - "To replace the lockfile"
    answer: 2
    explanation: |
      CI runners start clean, so without a cache every job re-downloads all dependencies —
      slow and hard on upstream registries. Caching persists the package-manager cache/resolved
      deps across runs to speed builds and reduce upstream load.
    ref: "concepts.md#dependency-caching-in-ci"

  - id: artifact-and-dependency-management-028
    difficulty: intermediate
    tags: [caching, cache-key, lockfile]
    question: |
      What should a CI dependency cache be keyed on for correctness?
    options:
      - "The branch name"
      - "A hash of the lockfile, so the cache invalidates exactly when dependencies change"
      - "The current date"
      - "The pipeline run number"
    answer: 1
    explanation: |
      Keying on the lockfile hash means the key changes precisely when dependencies change:
      unchanged → instant restore; changed → fetch fresh. Keying on a branch name or date
      yields stale or poisoned caches.
    ref: "concepts.md#dependency-caching-in-ci"

  - id: artifact-and-dependency-management-029
    difficulty: intermediate
    tags: [caching, artifacts, distinction]
    question: |
      What is the key difference between a CI "cache" and a CI "artifact"?
    options:
      - "They are identical concepts with different names"
      - "A cache is required; an artifact is optional"
      - "A cache is a best-effort speed optimization the build must survive without; an artifact is a required build output passed on or published"
      - "Artifacts are stored in memory; caches are stored on disk"
    answer: 2
    explanation: |
      A cache may be missing or evicted, so the build must still work if it's absent — it's
      purely a speed optimization. An artifact is a required output (e.g. the built binary,
      test reports) that is passed between stages or published. Never treat a cache as a
      source of truth.
    ref: "concepts.md#dependency-caching-in-ci"

  - id: artifact-and-dependency-management-030
    difficulty: advanced
    tags: [caching, github-actions, scenario]
    question: |
      Given this GitHub Actions cache step, what will happen when a developer edits
      `pom.xml`?

      ```yaml
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      ```
    options:
      - "The cache key is unchanged, so the old cache is reused as-is"
      - "The build fails because the key changed"
      - "All previous caches are permanently deleted"
      - "The `hashFiles` result changes, producing a new key; the closest `restore-keys` match seeds it, then a fresh cache is saved"
    answer: 3
    explanation: |
      `hashFiles('**/pom.xml')` changes when pom.xml changes, so the primary key is new (a
      cache miss). `restore-keys` lets it warm-start from the most recent matching prefix,
      then the job saves a new cache under the new key. This is correct lockfile/manifest-based
      keying.
    ref: "concepts.md#dependency-caching-in-ci"

  - id: artifact-and-dependency-management-031
    difficulty: intermediate
    tags: [caching, resilience, proxy]
    question: |
      Besides speed, how does dependency caching (or a proxy) improve build resilience?
    options:
      - "Combined with offline/proxy modes, a public registry outage or rate limit won't stop the build"
      - "It makes tests deterministic"
      - "It automatically fixes vulnerable dependencies"
      - "It removes the need to pin versions"
    answer: 0
    explanation: |
      Once dependencies are cached (or served by a proxy), the build no longer depends on the
      upstream public registry being reachable, so outages and rate limits (e.g. Docker Hub
      pull limits) don't break your pipeline.
    ref: "concepts.md#dependency-caching-in-ci"

  - id: artifact-and-dependency-management-032
    difficulty: beginner
    tags: [proxy, registries, definitions]
    question: |
      In repository-manager terminology, what is a "remote" (proxy) repository?
    options:
      - "A repository that stores only the artifacts you publish"
      - "A caching mirror of an upstream public registry that fetches and caches on first request"
      - "A repository located on a developer's laptop"
      - "A backup copy of your Git history"
    answer: 1
    explanation: |
      A remote/proxy repository mirrors an upstream public registry (npmjs.org, Maven Central,
      PyPI, Docker Hub): the first request fetches and caches the artifact, later requests are
      served from cache. Local/hosted repos hold your own artifacts.
    ref: "concepts.md#package-registries-and-proxies"

  - id: artifact-and-dependency-management-033
    difficulty: intermediate
    tags: [proxy, virtual-repo, aggregation]
    question: |
      What is the role of a "virtual" (group) repository?
    options:
      - "It compiles source into artifacts"
      - "It stores secrets for the pipeline"
      - "It runs vulnerability scans"
      - "It aggregates several local and remote repositories behind a single URL for clients"
    answer: 3
    explanation: |
      A virtual/group repository exposes one endpoint that aggregates multiple local (hosted)
      and remote (proxy) repositories, so clients configure a single URL and the manager
      resolves across all of them.
    ref: "concepts.md#package-registries-and-proxies"

  - id: artifact-and-dependency-management-034
    difficulty: intermediate
    tags: [proxy, availability, left-pad]
    question: |
      How does proxying public dependencies through your own repository protect against the
      "package unpublished/deleted upstream" problem (e.g. left-pad)?
    options:
      - "It prevents anyone from ever publishing packages"
      - "It automatically rewrites your code to remove the dependency"
      - "The cached copy in your proxy can't be changed or removed out from under you, so builds keep working even if the upstream package disappears"
      - "It forces the upstream author to keep the package forever"
    answer: 2
    explanation: |
      Once your proxy has cached a version, that copy is under your control — an upstream
      unpublish or mutation can't break your builds. This is a major reason to consume public
      packages through a proxy rather than directly.
    ref: "concepts.md#package-registries-and-proxies"

  - id: artifact-and-dependency-management-035
    difficulty: advanced
    tags: [proxy, governance, security]
    question: |
      Why is a proxy/virtual repository a useful place to enforce dependency governance?
    options:
      - "It is a single choke point where you can scan, apply allow/deny policy, and block known-bad versions before they reach developers"
      - "It is the only place code can be compiled"
      - "It automatically writes unit tests"
      - "It replaces the need for code review"
    answer: 0
    explanation: |
      Routing all dependency consumption through one manager creates a central control point:
      you can scan incoming packages, enforce license/allow-deny policy, and block flagged
      versions org-wide — far easier than policing every developer machine and CI job
      independently.
    ref: "concepts.md#package-registries-and-proxies"

  - id: artifact-and-dependency-management-036
    difficulty: beginner
    tags: [sca, scanning, definitions]
    question: |
      What does Software Composition Analysis (SCA) do?
    options:
      - "Compiles your source into a binary"
      - "Inventories your dependency tree and flags components with known vulnerabilities (CVEs) or non-compliant licenses"
      - "Runs your unit tests in parallel"
      - "Deploys artifacts to production"
    answer: 1
    explanation: |
      SCA analyzes the composition of your software — its open-source/third-party dependencies
      — often via an SBOM, and flags known-vulnerable components and license issues. Tools
      include Trivy, Grype, Snyk, Dependabot, and OWASP Dependency-Check.
    ref: "concepts.md#vulnerability-scanning-of-dependencies-sca"

  - id: artifact-and-dependency-management-037
    difficulty: intermediate
    tags: [sca, transitive, remediation]
    question: |
      An SCA scan flags a high-severity CVE in a transitive dependency you never declared
      directly. What is the typical fix?
    options:
      - "Ignore it because you didn't declare it directly"
      - "Delete your lockfile"
      - "Bump the direct dependency to a version whose updated tree pulls in the patched transitive dependency (or add an override)"
      - "Rename your own package"
    answer: 2
    explanation: |
      Most CVEs are transitive. You usually can't edit the transitive dep directly; instead you
      upgrade the direct dependency to a release that pulls in the patched transitive version,
      or use a resolution/override mechanism to force the fixed version.
    ref: "concepts.md#vulnerability-scanning-of-dependencies-sca"

  - id: artifact-and-dependency-management-038
    difficulty: advanced
    tags: [sca, registry-scanning, continuous]
    question: |
      Why is continuously re-scanning already-stored artifacts in the registry valuable, even
      if nothing was rebuilt?
    options:
      - "New CVEs get disclosed over time, so a version that was clean when built can be flagged later without any rebuild"
      - "Artifacts change their own bytes over time"
      - "It speeds up future builds"
      - "It reduces the artifact's file size"
    answer: 0
    explanation: |
      Vulnerabilities are disclosed continuously. An artifact clean at build time can become
      known-vulnerable tomorrow when a new CVE lands. Registry-side continuous scanning surfaces
      this against your stored/deployed artifacts without needing a rebuild.
    ref: "concepts.md#vulnerability-scanning-of-dependencies-sca"

  - id: artifact-and-dependency-management-039
    difficulty: intermediate
    tags: [sca, boundaries, cross-reference]
    question: |
      Deep mechanics of SAST/DAST/SCA as pipeline gates, and SBOM/signing/provenance formats,
      are primarily owned by which topics?
    options:
      - "This artifact-management topic owns all of it end to end"
      - "The observability domain"
      - "The networking domain"
      - "devsecops-and-pipeline-security (scanning gates) and software-supply-chain-security (SBOM, signing, provenance)"
    answer: 3
    explanation: |
      Scanning-as-a-gate mechanics live in devops-cicd/devsecops-and-pipeline-security; SBOM
      formats, signing, and provenance/attestations live in
      devops-cicd/software-supply-chain-security. Artifact management references them but
      doesn't re-teach them.
    ref: "concepts.md#vulnerability-scanning-of-dependencies-sca"

  - id: artifact-and-dependency-management-040
    difficulty: beginner
    tags: [retention, cleanup, purpose]
    question: |
      Why do artifact repositories need retention/cleanup policies?
    options:
      - "To make artifacts immutable"
      - "Because they grow without bound as every CI run pushes snapshots/layers, so old, unneeded artifacts must be reclaimed"
      - "To compile artifacts faster"
      - "To rename artifacts automatically"
    answer: 1
    explanation: |
      Every pipeline run can push a snapshot or image layers, so storage grows without bound.
      Retention policies (keep-last-N, age-based, prune snapshots) reclaim space and reduce
      noise — while carefully preserving what you might need for rollback/audit.
    ref: "concepts.md#artifact-retention-and-cleanup"

  - id: artifact-and-dependency-management-041
    difficulty: advanced
    tags: [retention, scenario, gotcha]
    question: |
      A team sets a blanket rule: "delete every artifact older than 30 days." What is the
      danger?
    options:
      - "It can delete the artifact currently running in production if it was built more than 30 days ago"
      - "Nothing; age is a perfect cleanup criterion"
      - "It will only ever delete snapshots"
      - "It makes builds non-reproducible"
    answer: 0
    explanation: |
      Pure age-based deletion doesn't know what's deployed. A stable release running in prod
      that was built 31 days ago would be deleted, destroying your ability to roll back or
      audit it. Retention must explicitly protect deployed/promoted/released artifacts.
    ref: "concepts.md#artifact-retention-and-cleanup"

  - id: artifact-and-dependency-management-042
    difficulty: intermediate
    tags: [retention, releases, snapshots]
    question: |
      What is a sound retention strategy that balances storage savings with safety?
    options:
      - "Delete releases aggressively; keep every snapshot forever"
      - "Never delete anything, ever"
      - "Aggressively prune snapshot/PR/dev builds by age or last-N, but retain released/promoted and currently-deployed artifacts long-term"
      - "Delete artifacts immediately after they're built"
    answer: 2
    explanation: |
      Snapshots, PR builds, and dev-tag artifacts are disposable and can be pruned by age or
      last-N. Released/promoted artifacts and anything deployed to prod must be retained
      long-term (and legal holds honored) so rollback and audit remain possible.
    ref: "concepts.md#artifact-retention-and-cleanup"

  - id: artifact-and-dependency-management-043
    difficulty: advanced
    tags: [retention, oci, garbage-collection]
    question: |
      In an OCI container registry, what actually reclaims disk space, and what's the nuance
      with shared layers?
    options:
      - "Deleting a tag immediately frees all its bytes"
      - "Layers are never shared, so any deletion frees its full size"
      - "Space is reclaimed only by deleting the entire repository"
      - "Garbage collection frees blobs no longer referenced by any manifest; a layer still referenced by another image is not deleted"
    answer: 3
    explanation: |
      Deleting a tag just removes a pointer. Space is reclaimed when garbage collection runs
      and finds blobs with no referencing manifest. Because layers are content-addressed and
      shared, reference counting/GC prevents deleting a layer another image still needs.
    ref: "concepts.md#artifact-retention-and-cleanup"

  - id: artifact-and-dependency-management-044
    difficulty: beginner
    tags: [provenance, definitions, supply-chain]
    question: |
      What is build "provenance"?
    options:
      - "The license attached to a dependency"
      - "Verifiable metadata about how an artifact was produced (source commit, builder, dependencies, parameters)"
      - "The physical server an artifact is stored on"
      - "The number of downloads an artifact has"
    answer: 1
    explanation: |
      Provenance is verifiable metadata describing how an artifact was built: which source
      commit, which builder/build service, which inputs and parameters. An attestation is a
      signed statement binding that provenance to a specific artifact by digest.
    ref: "concepts.md#provenance-and-attestations-supply-chain-link"

  - id: artifact-and-dependency-management-045
    difficulty: intermediate
    tags: [slsa, provenance, supply-chain]
    question: |
      What does the SLSA framework define?
    options:
      - "A programming language for pipelines"
      - "A container image format"
      - "A dependency lockfile standard"
      - "Maturity levels for build provenance, with higher levels requiring a hardened, non-falsifiable build service"
    answer: 3
    explanation: |
      SLSA (Supply-chain Levels for Software Artifacts) defines increasing levels of build
      integrity/provenance. Higher levels demand a hardened, tamper-resistant build service so
      the provenance can't be forged. Building blocks include in-toto attestations, Sigstore/
      cosign, and SBOMs.
    ref: "concepts.md#provenance-and-attestations-supply-chain-link"

  - id: artifact-and-dependency-management-046
    difficulty: advanced
    tags: [provenance, promote-by-digest, trust]
    question: |
      How do a signed attestation and an immutable digest together make "promote by digest"
      trustworthy?
    options:
      - "The digest names exact bytes, and the signed attestation proves those bytes came from the expected source/builder — so a promotion gate can verify both content and origin"
      - "They make the artifact download faster"
      - "They allow the artifact to be modified safely after promotion"
      - "They eliminate the need for any tests"
    answer: 0
    explanation: |
      The digest pins the exact content you're promoting; the signed provenance/attestation
      proves that content was produced by the expected build service from the expected source
      (not a compromised laptop). Verifying both at the promotion gate closes the loop with
      build-once-promote-many.
    ref: "concepts.md#provenance-and-attestations-supply-chain-link"

  - id: artifact-and-dependency-management-047
    difficulty: intermediate
    tags: [scenario, latest, rollback]
    question: |
      A service is deployed via the tag `myapp:latest`, and last night's deploy broke prod.
      The team wants to roll back but can't determine what the previous good image was. What
      practice would have prevented this?
    options:
      - "Deploying more frequently"
      - "Increasing the CPU on the nodes"
      - "Deploying by an immutable version/digest so each deploy references exact, recoverable content"
      - "Disabling health checks"
    answer: 2
    explanation: |
      `latest` is mutable, so there's no record of which exact image the previous deploy used —
      rollback has no target. Deploying immutable versions/digests means every deploy points to
      recoverable, exact content, making rollback a matter of redeploying the prior digest.
    ref: "concepts.md#immutable-artifacts-and-versioning"

  - id: artifact-and-dependency-management-048
    difficulty: advanced
    tags: [scenario, build-once, promotion]
    question: |
      A pipeline runs `docker build` in the dev stage, then runs `docker build` AGAIN in the
      prod stage from the same Dockerfile before deploying. From an artifact-management view,
      what is the flaw?
    options:
      - "Nothing; rebuilding is a safe optimization"
      - "The prod image is a separate build that was never tested in dev — base image or deps may have drifted; it should promote the dev-built image by digest instead"
      - "Docker cannot build the same Dockerfile twice"
      - "The dev image should be deleted before the prod build"
    answer: 1
    explanation: |
      Two builds produce two potentially different images (re-pulled base image, re-resolved
      deps). The prod image was never the artifact dev/staging validated. The fix is to build
      once, publish, and promote that exact image by digest through to prod.
    ref: "concepts.md#build-once-promote-many"

  - id: artifact-and-dependency-management-049
    difficulty: intermediate
    tags: [scenario, cache-key, poisoning]
    question: |
      A team keys their CI dependency cache on the branch name (`key: cache-${CI_BRANCH}`).
      They notice builds sometimes install outdated dependencies even after updating the
      lockfile. What's the cause?
    options:
      - "The registry is down"
      - "The lockfile is corrupt"
      - "The cache key doesn't change when the lockfile changes, so a stale cache keeps being restored"
      - "Branch names are too long"
    answer: 2
    explanation: |
      Keying on branch name means the key is stable across lockfile changes, so CI keeps
      restoring the old cache — stale dependencies. Keying on the lockfile hash makes the cache
      invalidate exactly when dependencies change.
    ref: "concepts.md#dependency-caching-in-ci"

  - id: artifact-and-dependency-management-050
    difficulty: intermediate
    tags: [lockfile, ecosystems, matching]
    question: |
      Which manifest/lockfile pairing is correct?
    options:
      - "`go.mod` is the lockfile and `go.sum` is the manifest"
      - "`package-lock.json` is the manifest and `package.json` is the lockfile"
      - "`Cargo.lock` is the manifest and `Cargo.toml` is the lockfile"
      - "`pyproject.toml` is the manifest and `poetry.lock` is the lockfile"
    answer: 3
    explanation: |
      The manifest states what you want; the lockfile records what you resolved. For Poetry,
      pyproject.toml is the manifest and poetry.lock is the lockfile. (npm: package.json →
      package-lock.json; Rust: Cargo.toml → Cargo.lock; Go: go.mod → go.sum.)
    ref: "concepts.md#dependency-management-lockfiles-and-pinning"

  - id: artifact-and-dependency-management-051
    difficulty: beginner
    tags: [registries, container, tooling]
    question: |
      Which of these is a container image (OCI) registry?
    options:
      - "Amazon ECR"
      - "Grafana"
      - "Jenkins"
      - "PagerDuty"
    answer: 0
    explanation: |
      Amazon ECR (Elastic Container Registry) stores OCI/Docker images, as do Docker Hub,
      GHCR, and Google Artifact Registry. Grafana is dashboards, Jenkins is CI, PagerDuty is
      on-call/alerting.
    ref: "concepts.md#build-artifacts-and-artifact-repositories"

  - id: artifact-and-dependency-management-052
    difficulty: intermediate
    tags: [immutability, enforcement, registry]
    question: |
      What does enabling "tag immutability" on a registry (e.g. ECR) accomplish?
    options:
      - "It compresses images to save space"
      - "It prevents an existing tag from being overwritten with different content, enforcing that a version means one set of bytes"
      - "It makes all images public"
      - "It automatically deletes untagged images"
    answer: 1
    explanation: |
      Tag immutability makes the registry reject any push that would repoint an existing tag to
      different content. This enforces the "a version = fixed bytes" contract at the registry
      level, so you can trust a tag the way you'd trust a digest.
    ref: "concepts.md#immutable-artifacts-and-versioning"

  - id: artifact-and-dependency-management-053
    difficulty: advanced
    tags: [scenario, dependency-confusion, mitigation]
    question: |
      Your org uses an internal package `@myco/auth-utils`. A build unexpectedly pulls a
      version of it from the public npm registry. Which combination best prevents this
      dependency-confusion risk?
    options:
      - "Publish the internal package publicly too"
      - "Always run `npm install` instead of `npm ci`"
      - "Delete the lockfile before each build"
      - "Use a scoped name mapped to your private registry, resolve internal scopes only from your local repo, and prevent the public proxy from shadowing internal names"
    answer: 3
    explanation: |
      Scope-to-registry mapping (e.g. `@myco:registry=<private>`), resolving internal scopes
      only from your local/hosted repo, and configuring the virtual/proxy so public can't
      shadow internal names together ensure the internal package can't be hijacked by a public
      higher-versioned imposter.
    ref: "concepts.md#dependency-management-lockfiles-and-pinning"

  - id: artifact-and-dependency-management-054
    difficulty: intermediate
    tags: [scenario, retention, protection]
    question: |
      You need to reclaim registry storage but must guarantee production can always roll back.
      Which retention rule is safest?
    options:
      - "Delete everything not pushed in the last 7 days, no exceptions"
      - "Delete all images with a version tag, keep only `latest`"
      - "Prune untagged and snapshot/PR images by last-N/age, but exclude any image with a release/promoted status or that is currently deployed"
      - "Delete images at random until under the storage quota"
    answer: 2
    explanation: |
      Safe cleanup targets disposable images (untagged, snapshots, PR builds) while explicitly
      excluding released/promoted and currently-deployed images so rollback and audit are never
      compromised. Blanket age rules or keeping only `latest` break rollback.
    ref: "concepts.md#artifact-retention-and-cleanup"

  - id: artifact-and-dependency-management-055
    difficulty: intermediate
    tags: [caching, offline, docker-hub]
    question: |
      A CI pipeline intermittently fails at the dependency-install step with rate-limit errors
      from a public registry. Which two-part fix best addresses this at the artifact-management
      layer?
    options:
      - "Route dependency pulls through an internal proxy/mirror and enable a lockfile-keyed cache with offline preference"
      - "Retry the whole pipeline until it passes"
      - "Upgrade all dependencies to their latest versions"
      - "Move the build to a faster runner"
    answer: 0
    explanation: |
      Rate limits and outages on public registries are best mitigated by consuming through an
      internal proxy (cached copies) plus a lockfile-keyed dependency cache with
      `--prefer-offline`. This removes the hard dependency on the upstream being reachable on
      every run.
    ref: "concepts.md#package-registries-and-proxies"

  - id: artifact-and-dependency-management-056
    difficulty: expert
    tags: [scenario, promotion, digest, integrity]
    question: |
      A release process tags the tested image `1.4.2`, but the promotion job later runs
      `docker build -t myrepo/app:1.4.2 .` and pushes it to the prod registry. QA passed on
      the original image. What is the core integrity problem?
    options:
      - "The version number is too low"
      - "The prod `1.4.2` is a freshly built image, not the bytes QA validated; promotion must copy/retag the tested image (verified by digest), not rebuild"
      - "The image should have used `latest`"
      - "Two registries can never hold the same tag"
    answer: 1
    explanation: |
      Rebuilding under the same tag silently substitutes different bytes for the version QA
      approved — the classic promotion pitfall. Correct promotion copies/retags the exact
      tested image and verifies the digest matches, so prod runs precisely what was validated.
    ref: "concepts.md#artifact-promotion-across-environments"
