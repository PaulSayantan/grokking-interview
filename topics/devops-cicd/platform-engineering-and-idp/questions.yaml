topic: "Platform Engineering & Internal Developer Platforms"
domain: devops-cicd
topic_slug: platform-engineering-and-idp
version: 1
questions:
  - id: platform-engineering-and-idp-001
    difficulty: beginner
    tags: [platform-engineering, devops, definition]
    question: |
      Platform engineering is best described as which of the following?
    options:
      - A rebranding of manual, ticket-driven central IT operations
      - A framework for writing unit tests inside CI pipelines
      - The product-centric evolution of DevOps that builds a self-service internal platform to reduce developer cognitive load
      - A Kubernetes networking specification
    answer: 2
    explanation: |
      Platform engineering is the product-managed evolution of DevOps: a dedicated platform team
      builds an Internal Developer Platform of self-service tools and golden paths so stream-aligned
      teams ship faster with less cognitive load. It is neither a return to ticket-driven ops nor a
      testing or networking spec.
    ref: "concepts.md#platform-engineering-as-the-evolution-of-devops"

  - id: platform-engineering-and-idp-002
    difficulty: beginner
    tags: [idp, portal, backstage]
    question: |
      What is the relationship between an Internal Developer Platform (IDP) and a developer portal
      such as Backstage?
    options:
      - They are two names for exactly the same thing
      - The portal is the entire platform; the IDP is just its database
      - An IDP can only exist if you run Backstage
      - The portal is a UI/catalog front door; the IDP is the whole self-service capability behind it
    answer: 3
    explanation: |
      A developer portal (e.g. Backstage) is the discovery/UX front door — a pane of glass. The IDP
      is the full self-service layer (templates, IaC, pipelines, runtime) behind it. You can have an
      IDP with no portal (CLI/API/Git-driven), so they are not synonyms.
    ref: "concepts.md#internal-developer-platform-idp-and-developer-portals"

  - id: platform-engineering-and-idp-003
    difficulty: beginner
    tags: [golden-paths, paved-road]
    question: |
      What is a "golden path" (a.k.a. Netflix's "paved road")?
    options:
      - An opinionated, well-supported, documented end-to-end route to building and running common software
      - A mandatory pipeline that every team is legally required to use
      - The fastest network route between two data centers
      - A Git branch reserved for production releases
    answer: 0
    explanation: |
      A golden path / paved road is an opinionated, supported, documented default way to build and
      run a common kind of service. It is supported rather than mandatory — teams can leave it but
      then own the extra work.
    ref: "concepts.md#golden-paths-and-paved-roads"

  - id: platform-engineering-and-idp-004
    difficulty: beginner
    tags: [platform-as-a-product, customers]
    question: |
      In the "platform as a product" mindset, who are the platform's customers?
    options:
      - External paying end users of the company's product
      - The finance and procurement departments
      - Third-party open-source maintainers
      - The organization's own internal developers
    answer: 3
    explanation: |
      Platform-as-a-product treats the internal platform like a real product whose customers are the
      organization's developers. That framing drives user research, a roadmap, a PM, and DevEx-based
      success metrics.
    ref: "concepts.md#platform-as-a-product"

  - id: platform-engineering-and-idp-005
    difficulty: beginner
    tags: [self-service, definition]
    question: |
      Which characteristic is the defining test of a genuine self-service platform?
    options:
      - A human approves and executes each infrastructure request via a ticket
      - Developers can provision what they need on demand with no human in the request path
      - All infrastructure is provisioned once and never changed
      - Only the platform team is allowed to run Terraform
    answer: 1
    explanation: |
      Self-service means a developer gets what they need through a template/CLI/API/Git commit with
      automation doing the work — no ticket, no waiting on a human. If a human must approve or execute
      each request, it is a service desk, not a platform.
    ref: "concepts.md#self-service-infrastructure-and-scaffolding"

  - id: platform-engineering-and-idp-006
    difficulty: beginner
    tags: [team-topologies, team-types]
    question: |
      Team Topologies defines four fundamental team types. Which set is correct?
    options:
      - Stream-aligned, Platform, Enabling, Complicated-subsystem
      - Frontend, Backend, QA, Ops
      - Scrum, Kanban, Waterfall, Lean
      - Dev, SRE, Security, Networking
    answer: 0
    explanation: |
      Team Topologies (Skelton & Pais) names four fundamental team types: stream-aligned, platform,
      enabling, and complicated-subsystem. The other lists mix job titles or methodologies.
    ref: "concepts.md#team-topologies-and-platform-teams"

  - id: platform-engineering-and-idp-007
    difficulty: beginner
    tags: [cognitive-load, definition]
    question: |
      What is the platform's primary role with respect to a stream-aligned team's cognitive load?
    options:
      - Increase germane load so teams learn more tools
      - Eliminate all intrinsic domain complexity
      - Minimize extraneous (accidental) load so teams focus on the value-adding domain
      - Transfer all ownership of the service to the platform team
    answer: 2
    explanation: |
      The platform reduces extraneous (accidental) cognitive load from tool sprawl, freeing a team's
      limited mental budget for germane, business-differentiating work. It cannot remove intrinsic
      domain complexity, and it should not take ownership away from teams.
    ref: "concepts.md#cognitive-load-and-you-build-it-you-run-it"

  - id: platform-engineering-and-idp-008
    difficulty: beginner
    tags: [backstage, catalog]
    question: |
      Which Backstage capability serves as the central registry of all software and its owners?
    options:
      - TechDocs
      - Software Templates (Scaffolder)
      - The plugin marketplace
      - Software Catalog
    answer: 3
    explanation: |
      The Software Catalog is Backstage's central registry of components, APIs, systems, and resources
      with ownership metadata (via catalog-info.yaml). TechDocs handles docs, the Scaffolder creates
      new projects, and plugins extend functionality.
    ref: "concepts.md#internal-developer-platform-idp-and-developer-portals"

  - id: platform-engineering-and-idp-009
    difficulty: intermediate
    tags: [devops, evolution, anti-pattern]
    question: |
      A company renames its ticket-driven ops team the "platform team" but keeps requiring engineers
      to file tickets and wait for manual provisioning. Why is this not platform engineering?
    options:
      - Because real platform engineering requires self-service with no human in the request path; a ticket queue is still a bottleneck
      - Because platform teams must be larger than ops teams
      - Because platform teams are only allowed to use Kubernetes
      - Because the ops team did not adopt agile ceremonies
    answer: 0
    explanation: |
      Rebranding a gatekeeping ops queue does not create a platform. Platform engineering requires
      self-service (no human in the request path), a product mindset, and voluntary adoption. A ticket
      queue is a bottleneck with a new name — a recognized anti-pattern.
    ref: "concepts.md#platform-engineering-as-the-evolution-of-devops"

  - id: platform-engineering-and-idp-010
    difficulty: intermediate
    tags: [golden-paths, mandatory, autonomy]
    question: |
      A platform lead insists every team MUST use the golden path with no exceptions. What is the main
      problem with making golden paths strictly mandatory?
    options:
      - Mandatory paths are always technically impossible to enforce
      - It removes team autonomy and, by forcing adoption, hides whether the path is actually good
      - Mandatory paths make CI pipelines run slower
      - It violates the OpenGitOps specification
    answer: 1
    explanation: |
      Golden paths are meant to be supported-but-optional. Mandating them removes autonomy and, more
      subtly, masks the adoption signal: if teams only use it because they must, you lose feedback on
      whether it is genuinely better. Make the safe path the easy path instead.
    ref: "concepts.md#golden-paths-and-paved-roads"

  - id: platform-engineering-and-idp-011
    difficulty: intermediate
    tags: [platform-as-a-product, adoption, anti-pattern]
    question: |
      A team builds an elaborate IDP with no user research, no PM, and measures success by features
      shipped. Adoption stalls. What anti-pattern is this?
    options:
      - The "thinnest viable platform" anti-pattern
      - The "X-as-a-Service" anti-pattern
      - The "error budget" anti-pattern
      - The "build it and they will come" anti-pattern
    answer: 3
    explanation: |
      Building what engineers think is cool without user research or a product feedback loop, and
      measuring features rather than developer outcomes, is the classic "build it and they will come"
      failure. Platform-as-a-product means treating developers as customers and measuring adoption/DevEx.
    ref: "concepts.md#platform-as-a-product"

  - id: platform-engineering-and-idp-012
    difficulty: intermediate
    tags: [dora, metrics, four-keys]
    question: |
      Which set correctly lists the four key DORA (Accelerate) delivery metrics?
    options:
      - Deployment frequency, lead time for changes, change failure rate, failed-deployment recovery time
      - Lines of code, commits per day, PRs merged, code coverage
      - CPU utilization, memory usage, error rate, latency
      - Sprint velocity, story points, burndown rate, cycle count
    answer: 0
    explanation: |
      The four DORA keys are deployment frequency, lead time for changes, change failure rate, and
      time to restore/recover from a failed deployment. Recent DORA reports add reliability as a fifth
      focus. Activity counts like lines of code are explicitly not good productivity measures.
    ref: "concepts.md#developer-experience-devex-metrics"

  - id: platform-engineering-and-idp-013
    difficulty: intermediate
    tags: [space, metrics]
    question: |
      The SPACE framework was created primarily to counter which measurement mistake?
    options:
      - Measuring reliability using SLOs
      - Using declarative infrastructure
      - Reducing developer productivity to a single dimension or metric
      - Storing desired state in Git
    answer: 2
    explanation: |
      SPACE (Satisfaction, Performance, Activity, Communication/collaboration, Efficiency/flow)
      argues productivity is multidimensional and warns against optimizing a single metric. It also
      stresses combining perceptual (survey) data with system data.
    ref: "concepts.md#developer-experience-devex-metrics"

  - id: platform-engineering-and-idp-014
    difficulty: intermediate
    tags: [team-topologies, interaction-modes]
    question: |
      Which interaction mode should a mature platform team primarily use with stream-aligned teams?
    options:
      - Collaboration
      - X-as-a-Service
      - Facilitation
      - Continuous pairing
    answer: 1
    explanation: |
      A platform team's target interaction mode is X-as-a-Service: stream-aligned teams consume the
      platform with minimal coordination. Collaboration is high-bandwidth and used briefly during
      co-design; facilitation is the enabling team's mode.
    ref: "concepts.md#team-topologies-and-platform-teams"

  - id: platform-engineering-and-idp-015
    difficulty: intermediate
    tags: [platform-vs-sre-vs-devops]
    question: |
      What most clearly distinguishes an SRE team's focus from a platform team's focus?
    options:
      - SRE writes frontend code; platform writes backend code
      - SRE only exists at Google; platform teams exist everywhere else
      - There is no difference; the terms are interchangeable
      - SRE focuses on run-time reliability (SLOs, error budgets); platform focuses on developer self-service experience
    answer: 3
    explanation: |
      SRE is reliability engineering: SLOs, error budgets, toil reduction for running systems. Platform
      engineering is a product discipline that packages capabilities for developer self-service. They
      complement each other; a platform can productize SRE practices, but their primary focus differs.
    ref: "concepts.md#platform-engineering-vs-sre-vs-devops"

  - id: platform-engineering-and-idp-016
    difficulty: intermediate
    tags: [you-build-it-you-run-it, cognitive-load]
    question: |
      Does platform engineering contradict the "you build it, you run it" principle?
    options:
      - No, it makes full ownership sustainable by lowering the extraneous load that made it crushing
      - Yes, because the platform team takes over running all services
      - Yes, because it forbids teams from deploying
      - No, because "you build it, you run it" was never a real principle
    answer: 0
    explanation: |
      Teams still run what they build, but on top of a platform that removes undifferentiated
      complexity. Platform engineering resolves the tension "you build it, you run it" created by
      lowering extraneous cognitive load rather than re-centralizing ownership.
    ref: "concepts.md#cognitive-load-and-you-build-it-you-run-it"

  - id: platform-engineering-and-idp-017
    difficulty: intermediate
    tags: [abstraction, leaky, escape-hatch]
    question: |
      Why is it important that a platform's abstractions provide escape hatches?
    options:
      - Escape hatches make CI builds faster
      - All non-trivial abstractions leak, so users need a way to get underneath and debug when they do
      - Escape hatches are required by the SLSA framework
      - They allow the platform team to bill teams for usage
    answer: 1
    explanation: |
      By the Law of Leaky Abstractions, every non-trivial abstraction eventually leaks. When it does,
      users need enough transparency and an escape hatch (raw Terraform, custom manifests) to cope and
      debug — otherwise the black box erodes trust and teams abandon the platform.
    ref: "concepts.md#abstraction-without-hiding-too-much"

  - id: platform-engineering-and-idp-018
    difficulty: intermediate
    tags: [when, scale, over-engineering]
    question: |
      A 3-person startup with a single service asks whether it should build an Internal Developer
      Platform. What is the best answer?
    options:
      - Yes — every company needs an IDP from day one
      - Yes — because Gartner predicts most orgs will have platform teams
      - No — with few teams and little duplication, an IDP is premature; ship product first
      - No — IDPs are only legal for companies with over 10,000 employees
    answer: 2
    explanation: |
      Platform engineering pays off at scale, where duplication and toil are high. For a tiny team
      with one service it is over-engineering; they should build product. Start with a thinnest viable
      platform later, seeded from real repeated pain — not from hype.
    ref: "concepts.md#when-platform-engineering-makes-sense"

  - id: platform-engineering-and-idp-019
    difficulty: intermediate
    tags: [backstage, scaffolder, golden-paths]
    question: |
      In Backstage, which capability turns a golden path into something a developer can "click to
      create" — scaffolding a new repo pre-wired with CI, IaC, and catalog registration?
    options:
      - TechDocs
      - The Software Catalog
      - The search plugin
      - Software Templates (Scaffolder)
    answer: 3
    explanation: |
      Backstage Software Templates (the Scaffolder) let developers fill a form to generate a new
      service pre-wired with CI, IaC, and automatic catalog registration — operationalizing the golden
      path. The catalog registers it; TechDocs handles docs.
    ref: "concepts.md#internal-developer-platform-idp-and-developer-portals"

  - id: platform-engineering-and-idp-020
    difficulty: intermediate
    tags: [self-service, guardrails, policy-as-code]
    question: |
      Self-service infrastructure without guardrails commonly leads to teams provisioning oversized,
      insecure, or expensive resources. Which approach best adds guardrails without slowing the happy path?
    options:
      - Encode policy-as-code (e.g. OPA/Conftest, Sentinel) and safe module defaults into the paved road
      - Require a manual security review ticket for every request
      - Disable self-service entirely
      - Give every developer full cloud admin access and trust them
    answer: 0
    explanation: |
      Guardrails belong in the paved road: policy-as-code (OPA/Conftest, Sentinel), opinionated module
      defaults, quotas, and cost visibility enforce safety automatically without adding a human gate.
      That keeps self-service fast while preventing foot-guns.
    ref: "concepts.md#self-service-infrastructure-and-scaffolding"

  - id: platform-engineering-and-idp-021
    difficulty: intermediate
    tags: [team-topologies, enabling, platform]
    question: |
      How does an enabling team differ from a platform team?
    options:
      - Enabling teams provide a durable as-a-service product; platform teams coach temporarily
      - Enabling teams coach/mentor other teams temporarily; platform teams provide a durable self-service product
      - They are the same; both run the CI system
      - Enabling teams only handle security; platform teams only handle networking
    answer: 1
    explanation: |
      An enabling team helps stream-aligned teams learn new skills/tech and then moves on (facilitation
      mode). A platform team provides a durable internal product consumed as-a-service. Confusing the
      two is a common exam trap.
    ref: "concepts.md#team-topologies-and-platform-teams"

  - id: platform-engineering-and-idp-022
    difficulty: intermediate
    tags: [thinnest-viable-platform, product]
    question: |
      What does "Thinnest Viable Platform (TVP)" advise?
    options:
      - Build the most feature-complete platform possible before releasing it
      - Never document the platform to keep it thin
      - Outsource the platform to a third-party vendor immediately
      - Start with the smallest thing that genuinely helps (even a curated docs page) and grow by demand
    answer: 3
    explanation: |
      TVP means starting with the minimum that reduces real pain — even a well-curated set of
      paved-road defaults on a wiki — and growing based on demonstrated demand, rather than building a
      big-bang platform up front.
    ref: "concepts.md#platform-as-a-product"

  - id: platform-engineering-and-idp-023
    difficulty: advanced
    tags: [dora, individual-metrics, gotcha]
    question: |
      A manager proposes ranking individual engineers by their personal deployment frequency and
      commit counts. Why is this a misuse of DORA/SPACE metrics?
    options:
      - Because DORA metrics can only be computed monthly
      - Because deployment frequency is not a real DORA metric
      - Because these are team/system metrics; using them to rank individuals drives gaming and destroys trust
      - Because commit counts are the single best productivity measure
    answer: 2
    explanation: |
      DORA and SPACE metrics are team- and system-level. Weaponizing them to evaluate individuals
      encourages gaming (tiny meaningless deploys, commit padding) and erodes the trust the data depends
      on. Activity metrics like commit counts are notoriously misleading as productivity measures.
    ref: "concepts.md#developer-experience-devex-metrics"

  - id: platform-engineering-and-idp-024
    difficulty: advanced
    tags: [abstraction, over-abstraction, debuggability]
    question: |
      A platform exposes only a single opaque "deploy" button. When deployments fail, only the platform
      team can diagnose them. Which principle is being violated?
    options:
      - Over-abstraction — the black box hides so much that on-platform incidents are undebuggable by app teams
      - Under-abstraction — the platform exposes too much raw complexity
      - The X-as-a-Service interaction mode
      - The four OpenGitOps principles
    answer: 0
    explanation: |
      This is over-abstraction: the abstraction hides too much, so failures are undebuggable by the
      teams that own the service. A good rule of thumb is that if an on-platform incident can only be
      resolved by the platform team, the abstraction is too opaque.
    ref: "concepts.md#abstraction-without-hiding-too-much"

  - id: platform-engineering-and-idp-025
    difficulty: advanced
    tags: [team-topologies, collaboration, transition]
    question: |
      A platform team has co-designed a capability with a pilot stream-aligned team using intense
      collaboration for three months and never transitions away from it. Why is staying in permanent
      collaboration a problem?
    options:
      - Collaboration is forbidden by Team Topologies
      - Collaboration produces lower-quality code than pairing
      - It violates change-failure-rate targets
      - Permanent high-bandwidth collaboration turns the platform into a shared dependency/bottleneck instead of an as-a-service offering
    answer: 3
    explanation: |
      Collaboration is meant to be a bounded, high-bandwidth mode used to discover something new, then
      transition to X-as-a-Service once the interface stabilizes. Staying in permanent collaboration
      makes the platform team a shared dependency everyone waits on — a bottleneck.
    ref: "concepts.md#team-topologies-and-platform-teams"

  - id: platform-engineering-and-idp-026
    difficulty: advanced
    tags: [devex, cognitive-load, feedback-loops]
    question: |
      The 2023 DevEx paper (Noda, Storey, Forsgren, Greiler) highlights three core dimensions of
      developer experience. Which set is it?
    options:
      - Latency, throughput, availability
      - Flow state, feedback loops, and cognitive load
      - Deployment frequency, lead time, change failure rate
      - Satisfaction, activity, efficiency
    answer: 1
    explanation: |
      The DevEx framework centers on flow state, fast feedback loops, and cognitive load, and stresses
      that perceptual (survey) data is essential because system metrics alone miss the friction
      developers actually feel. The other lists are SRE golden signals, DORA keys, or SPACE dimensions.
    ref: "concepts.md#developer-experience-devex-metrics"

  - id: platform-engineering-and-idp-027
    difficulty: advanced
    tags: [platform-vs-sre, ownership, gotcha]
    question: |
      A platform team is being made the default on-call for every application it hosts. Why is this
      generally the wrong model?
    options:
      - Because service reliability ownership should stay with the stream-aligned team; the platform provides the means to run well, not the accountability for every app
      - Because on-call is illegal for platform teams
      - Because SRE teams should never carry a pager
      - Because platform teams cannot access production
    answer: 0
    explanation: |
      "You build it, you run it" keeps ownership with the stream-aligned team. The platform team should
      run the platform reliably (its own SLOs) and enable app teams to run their services well — not
      become the ops team paged for everyone's incidents.
    ref: "concepts.md#platform-engineering-vs-sre-vs-devops"

  - id: platform-engineering-and-idp-028
    difficulty: advanced
    tags: [golden-paths, maintenance, trust]
    question: |
      Why can an abandoned, out-of-date golden path be worse than having no golden path at all?
    options:
      - Because stale paths automatically delete production data
      - Because golden paths must be rewritten in a new language yearly
      - Because a stale path that no longer works or is insecure erodes trust and pushes teams off the platform
      - Because unused paths increase cloud costs directly
    answer: 2
    explanation: |
      Golden paths must be actively maintained and version-upgraded. A stale, broken, or insecure path
      that teams still rely on erodes trust in the platform — worse than no path, because it actively
      misleads and burns users who followed the "supported" route.
    ref: "concepts.md#golden-paths-and-paved-roads"

  - id: platform-engineering-and-idp-029
    difficulty: advanced
    tags: [self-service, iac, terraform, modules]
    question: |
      A platform publishes versioned, opinionated Terraform modules (e.g. a "paved-service" module with
      SLO dashboards and secrets wiring baked in) that app teams consume. What is the primary benefit of
      this approach over teams writing raw HCL?
    options:
      - It makes Terraform state files unnecessary
      - It removes the need for any CI pipeline
      - It guarantees zero-downtime deployments automatically
      - Good defaults (security, observability, cost) are encoded once and reused, giving consistency without every team relearning the details
    answer: 3
    explanation: |
      Curated, versioned modules encode good defaults once and let teams consume them, delivering
      consistency and reduced cognitive load without each team hand-writing and maintaining raw HCL.
      State files are still required, and CI/deploy strategy remain separate concerns.
    ref: "concepts.md#self-service-infrastructure-and-scaffolding"

  - id: platform-engineering-and-idp-030
    difficulty: advanced
    tags: [when, too-early, too-late]
    question: |
      Which pair correctly describes the two failure modes that bracket the "when to build a platform"
      decision?
    options:
      - Too cheap vs too expensive
      - Too early (polishing tooling nobody needs) vs too late (years of snowflake per-team infra that is costly to converge)
      - Too declarative vs too imperative
      - Too many tests vs too few tests
    answer: 1
    explanation: |
      Building too early wastes effort on tooling nobody needs while the business starves for features;
      building too late leaves years of divergent snowflake infrastructure that is expensive to
      consolidate. The honest answer measures duplication and toil before deciding.
    ref: "concepts.md#when-platform-engineering-makes-sense"

  - id: platform-engineering-and-idp-031
    difficulty: intermediate
    tags: [cognitive-load, types]
    question: |
      Team Topologies distinguishes three types of cognitive load. Which type should the platform aim
      to minimize for stream-aligned teams?
    options:
      - Extraneous load (accidental complexity from tools, process, environment)
      - Intrinsic load (the inherent difficulty of the domain)
      - Germane load (effort spent learning the value-adding domain)
      - Emotional load
    answer: 0
    explanation: |
      The platform targets extraneous load — accidental complexity from tools, process, and
      environment. It cannot remove intrinsic domain difficulty, and germane load (learning the
      value-adding domain) is where you want the team to spend its budget.
    ref: "concepts.md#cognitive-load-and-you-build-it-you-run-it"

  - id: platform-engineering-and-idp-032
    difficulty: intermediate
    tags: [devops, autonomy-duplication]
    question: |
      "Every team does everything itself" DevOps solved silos but created a new trade-off. What was it,
      and how does platform engineering address it?
    options:
      - It created too much documentation; platforms delete docs
      - It created faster networks; platforms slow them down
      - It removed testing; platforms add it back
      - It traded silos for autonomy-but-with-duplication/overload; platforms give shared golden paths so teams keep autonomy without re-inventing how to ship
    answer: 3
    explanation: |
      DIY DevOps gave autonomy but forced every team to duplicate CI/CD, IaC, and observability plumbing
      and master all of it. Platform engineering resolves the autonomy-vs-duplication tension via shared,
      self-service golden paths — autonomy over what to build, consistency in how to ship.
    ref: "concepts.md#platform-engineering-as-the-evolution-of-devops"

  - id: platform-engineering-and-idp-033
    difficulty: intermediate
    tags: [backstage, framework, gotcha]
    question: |
      Which statement about Backstage is accurate?
    options:
      - It is a fully turnkey, zero-effort SaaS developer portal
      - It is a proprietary Netflix product for the paved road
      - It is an open-source framework (created at Spotify, now a CNCF project) that you assemble and maintain yourself
      - It provisions cloud infrastructure directly out of the box with no plugins
    answer: 2
    explanation: |
      Backstage is an open-source framework created at Spotify and donated to the CNCF. It is something
      you assemble, host, and maintain — not turnkey — and the portal itself typically does not
      provision infrastructure; it sits atop an orchestration/control-plane layer.
    ref: "concepts.md#internal-developer-platform-idp-and-developer-portals"

  - id: platform-engineering-and-idp-034
    difficulty: advanced
    tags: [platform-as-a-product, voluntary-adoption, signal]
    question: |
      Why is voluntary adoption considered a feature (not a bug) of the platform-as-a-product model?
    options:
      - Because if teams route around a platform that is worse than DIY, that signal tells you the product needs improving
      - Because it lets the platform team avoid accountability
      - Because voluntary adoption is required by the DORA report
      - Because mandatory adoption is technically impossible in the cloud
    answer: 0
    explanation: |
      With voluntary adoption, teams only use the platform if it is genuinely better; if they route
      around it, that is honest feedback that the product is lacking. Mandating adoption hides this
      signal, so DevEx and adoption rate become the north-star KPIs.
    ref: "concepts.md#platform-as-a-product"

  - id: platform-engineering-and-idp-035
    difficulty: intermediate
    tags: [compliance-by-construction, golden-paths, security]
    question: |
      A team scaffolds a new service from the golden-path template and automatically gets SAST scanning,
      Vault-based secret injection, an SLO dashboard, and a safe rollout strategy. What principle does
      this illustrate?
    options:
      - Gatekeeping — a human blocks the release until checks pass
      - Compliance by construction — governance becomes a byproduct of following the convenient path
      - NoOps — no operations are ever required
      - Chaos engineering
    answer: 1
    explanation: |
      When the paved road bakes in security, observability, and safe deploys, following it automatically
      yields compliance — governance as a byproduct of convenience rather than a manual gate. That is a
      core value of golden paths.
    ref: "concepts.md#golden-paths-and-paved-roads"

  - id: platform-engineering-and-idp-036
    difficulty: beginner
    tags: [platform-vs-sre-vs-devops, definitions]
    question: |
      Which mapping of discipline to primary focus is correct?
    options:
      - DevOps = reliability SLOs; SRE = culture; Platform = testing
      - DevOps = networking; SRE = frontend; Platform = databases
      - All three have identical focus areas
      - DevOps = culture/practices; SRE = reliability engineering; Platform engineering = developer self-service product
    answer: 3
    explanation: |
      DevOps is a culture/set of practices breaking Dev/Ops silos; SRE is Google's reliability
      engineering implementation (SLOs, error budgets); platform engineering is a product discipline
      delivering developer self-service. They complement but focus differently.
    ref: "concepts.md#platform-engineering-vs-sre-vs-devops"

  - id: platform-engineering-and-idp-037
    difficulty: advanced
    tags: [under-abstraction, value, gotcha]
    question: |
      A "platform" simply hands teams raw Kubernetes manifests and raw Terraform with no opinionated
      wrappers, defaults, or scaffolding. What is the weakness of this under-abstraction?
    options:
      - It hides too much complexity from teams
      - It automatically makes deployments non-declarative
      - It provides little value over teams doing everything themselves, so it barely reduces cognitive load
      - It forces mandatory adoption
    answer: 2
    explanation: |
      Under-abstraction exposes the full raw complexity, so the platform adds little value beyond what
      teams could do alone and fails to reduce extraneous cognitive load. The sweet spot is a thinnest
      viable platform that hides extraneous complexity while keeping escape hatches.
    ref: "concepts.md#abstraction-without-hiding-too-much"

  - id: platform-engineering-and-idp-038
    difficulty: intermediate
    tags: [devex-metrics, platform-signals]
    question: |
      Which of these is a particularly useful platform-specific DevEx signal (beyond the generic DORA
      keys)?
    options:
      - Time-to-first-deploy for a new hire or a newly scaffolded service
      - Number of Slack messages sent per engineer
      - Total gigabytes of logs stored
      - Number of open-source stars on the company repo
    answer: 0
    explanation: |
      Time-to-first-deploy (for a new hire or a new service) directly measures how well the platform's
      onboarding and self-service work. Message counts, log volume, and repo stars are not meaningful
      DevEx signals.
    ref: "concepts.md#developer-experience-devex-metrics"

  - id: platform-engineering-and-idp-039
    difficulty: advanced
    tags: [when, scenario, signals]
    question: |
      An engineering org has 15 teams each maintaining its own hand-rolled CI, Terraform, and deploy
      scripts; onboarding a new service takes weeks; security is inconsistent. What does this pattern
      most strongly indicate?
    options:
      - The org should delete DevOps entirely
      - Strong signals that investing in a platform (starting with a thinnest viable platform) is justified
      - The org has too few engineers for any platform work
      - The org should mandate a single programming language first
    answer: 1
    explanation: |
      Heavy duplication of CI/IaC/deploy plumbing, slow onboarding, and inconsistent security across
      many teams are precisely the signals that platform engineering pays off. The right move is a
      thinnest viable platform seeded from the most-duplicated pain point.
    ref: "concepts.md#when-platform-engineering-makes-sense"

  - id: platform-engineering-and-idp-040
    difficulty: intermediate
    tags: [portal-vs-platform, orchestration]
    question: |
      In a common IDP reference architecture, where does a developer portal like Backstage typically sit
      relative to the component that actually provisions resources?
    options:
      - The portal itself provisions all cloud resources directly
      - The portal replaces the need for any IaC
      - The portal runs inside each application container
      - The portal sits on top of an orchestrator/control-plane (e.g. Crossplane, Humanitec, Terraform/Argo) that does the provisioning
    answer: 3
    explanation: |
      A portal is primarily a discovery/UX layer; it usually sits on top of an orchestration or
      control-plane layer (Crossplane, Kratix, Humanitec, or Terraform/Argo behind the scenes) that
      performs the actual provisioning, often GitOps-reconciled.
    ref: "concepts.md#internal-developer-platform-idp-and-developer-portals"

  - id: platform-engineering-and-idp-041
    difficulty: beginner
    tags: [golden-path, golden-cage]
    question: |
      What is meant by the warning "golden path, not golden cage"?
    options:
      - An abstraction so rigid it can't accommodate real needs will push teams off the platform entirely
      - The golden path should be locked so tightly that no one can leave it
      - Golden paths must always be painted gold in the UI
      - The path should only be available to senior engineers
    answer: 0
    explanation: |
      "Golden path, not golden cage" warns that an over-rigid abstraction that cannot flex to real needs
      becomes a cage; teams will abandon it. The path should cover the common case while allowing an
      off-road escape hatch.
    ref: "concepts.md#abstraction-without-hiding-too-much"

  - id: platform-engineering-and-idp-042
    difficulty: advanced
    tags: [team-topologies, cognitive-load, team-scope]
    question: |
      According to Team Topologies, how should a team's set of owned domains be sized?
    options:
      - Teams should own as many domains as possible to maximize utilization
      - Every team should own exactly one microservice, always
      - A team should own a domain small enough that its total cognitive load fits
      - Domain ownership should be assigned randomly each sprint
    answer: 2
    explanation: |
      Team Topologies advises limiting the number and complexity of domains a team owns so that total
      cognitive load fits within the team's capacity. The platform reduces extraneous load, but domain
      scope must still be bounded to keep intrinsic + germane load manageable.
    ref: "concepts.md#cognitive-load-and-you-build-it-you-run-it"

  - id: platform-engineering-and-idp-043
    difficulty: intermediate
    tags: [platform-as-a-product, slo]
    question: |
      If the platform is run as a product, what should be true about the platform's own reliability?
    options:
      - The platform needs no reliability targets because it is internal
      - Only external products can have SLOs
      - Reliability is solely the app teams' concern
      - The platform itself should have SLOs, since app teams depend on it as a service
    answer: 3
    explanation: |
      Because stream-aligned teams consume the platform as-a-service, the platform's own reliability
      matters and should be governed by SLOs (see the SRE/SLO topic). Treating it as a real product
      means holding it to a reliability standard.
    ref: "concepts.md#platform-as-a-product"

  - id: platform-engineering-and-idp-044
    difficulty: advanced
    tags: [dora, scenario, interpretation]
    question: |
      A team reports very high deployment frequency but also a 40% change failure rate and long recovery
      times. What is the correct interpretation?
    options:
      - High deployment frequency alone proves elite performance
      - Deployment frequency must be read alongside stability metrics; high failure and slow recovery indicate the delivery process is not actually healthy
      - Change failure rate is irrelevant if you deploy often
      - The team should stop deploying entirely
    answer: 1
    explanation: |
      DORA pairs throughput (deployment frequency, lead time) with stability (change failure rate,
      recovery time) precisely so you don't optimize speed at the cost of stability. A 40% change failure
      rate with slow recovery signals an unhealthy process despite frequent deploys.
    ref: "concepts.md#developer-experience-devex-metrics"

  - id: platform-engineering-and-idp-045
    difficulty: intermediate
    tags: [team-topologies, devops-team-antipattern]
    question: |
      Team Topologies explicitly flags which of the following as an anti-pattern?
    options:
      - A siloed "DevOps team" or "tools team" that becomes a bottleneck between Dev and Ops
      - A stream-aligned team owning its service end-to-end
      - A platform team operating in X-as-a-Service mode
      - An enabling team coaching a stream-aligned team temporarily
    answer: 0
    explanation: |
      A siloed "DevOps team" or "tools team" that inserts itself as a handoff/bottleneck between Dev and
      Ops is a named anti-pattern. The healthy patterns are stream-aligned ownership, platform as
      X-as-a-Service, and temporary enabling-team facilitation.
    ref: "concepts.md#team-topologies-and-platform-teams"

  - id: platform-engineering-and-idp-046
    difficulty: advanced
    tags: [progressive-disclosure, abstraction]
    question: |
      Which design technique lets a platform abstraction stay simple for the common case yet expose
      advanced knobs when experts need them?
    options:
      - Mandatory adoption
      - Removing all documentation
      - Progressive disclosure — sensible defaults up front, advanced options available on demand
      - Collapsing everything into a single opaque button
    answer: 2
    explanation: |
      Progressive disclosure keeps the happy path simple with good defaults while surfacing advanced
      parameters only when needed. It balances "hide extraneous complexity" against "don't hide so much
      that experts can't get underneath" — the core abstraction tension.
    ref: "concepts.md#abstraction-without-hiding-too-much"
