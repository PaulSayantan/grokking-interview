topic: "GitOps"
domain: devops-cicd
topic_slug: gitops
version: 1
questions:
- id: gitops-001
  difficulty: beginner
  tags: [gitops, definition, principles]
  question: |
    Which statement best captures the core idea of GitOps?
  options:
  - A CI pipeline runs kubectl apply against the cluster on every merge
  - The entire desired state is declared in Git and an automated agent continuously reconciles the environment to match
  - Developers SSH into servers to apply changes recorded in a changelog
  - Infrastructure is provisioned once and never changed afterward
  answer: 1
  explanation: |
    GitOps means the desired state of the system is expressed declaratively and stored in
    Git, and a software agent continuously pulls that state and reconciles the live
    environment to match it. A pipeline running kubectl apply is push-based CD, not GitOps.
  ref: "concepts.md#gitops-principles"

- id: gitops-002
  difficulty: beginner
  tags: [opengitops, principles]
  question: |
    The OpenGitOps project defines four principles. Which set correctly names them?
  options:
  - Imperative, Mutable, Pushed Manually, Reconciled Once
  - Scripted, Versioned, Pulled Automatically, Monitored
  - Declarative, Versioned and Immutable, Pulled Automatically, Continuously Reconciled
  - Declarative, Encrypted, Pushed Automatically, Audited
  answer: 2
  explanation: |
    OpenGitOps v1.0.0 lists: Declarative; Versioned and Immutable; Pulled Automatically;
    Continuously Reconciled. These four together distinguish GitOps from ordinary
    pipeline-driven deployment.
  ref: "concepts.md#gitops-principles"

- id: gitops-003
  difficulty: intermediate
  tags: [principles, declarative]
  question: |
    A team stores an ordered shell script of kubectl commands in Git and runs it from CI.
    Which OpenGitOps principle does this MOST clearly violate?
  options:
  - Declarative
  - Versioned and Immutable
  - Pulled Automatically
  - Continuously Reconciled
  answer: 0
  explanation: |
    An ordered script of commands is imperative (it says HOW step by step), violating the
    Declarative principle which requires expressing the desired end state. (It also violates
    Pulled Automatically and Continuously Reconciled, but the imperative script most directly
    breaks Declarative.)
  ref: "concepts.md#gitops-principles"

- id: gitops-004
  difficulty: beginner
  tags: [source-of-truth, audit]
  question: |
    In GitOps, why does Git effectively provide an audit log "for free"?
  options:
  - Because Git encrypts every commit by default
  - Because the cluster writes its events back into the repository
  - Because Git prevents any change from ever being reverted
  - Because every change is a commit with author, timestamp, diff, and (with PRs) reviewers
  answer: 3
  explanation: |
    Every change to desired state is a Git commit carrying author, timestamp, and diff; if
    changes go through pull requests you also capture reviewers and approvals. Answering
    "who changed prod and when" becomes a git log/blame query.
  ref: "concepts.md#git-as-the-single-source-of-truth-and-audit-log"

- id: gitops-005
  difficulty: intermediate
  tags: [source-of-truth, desired-vs-observed]
  question: |
    Git is the source of truth in GitOps. Which of the following is it the source of truth for?
  options:
  - The desired state (what should be running)
  - Current pod IP addresses
  - Autoscaler-chosen replica counts at runtime
  - Live values injected by an external secrets store
  answer: 0
  explanation: |
    Git holds the DESIRED state, not observed/runtime facts. Pod IPs, HPA-chosen replica
    counts, and externally injected secret values are runtime state and are not stored in
    Git. Confusing the two leads to fighting the reconciler.
  ref: "concepts.md#git-as-the-single-source-of-truth-and-audit-log"

- id: gitops-006
  difficulty: intermediate
  tags: [reconciliation, control-loop]
  question: |
    The GitOps reconciliation loop repeatedly does which sequence?
  options:
  - Build image, run tests, push to registry
  - Wait for a webhook, then destroy and recreate all resources
  - Snapshot the cluster, upload to Git, then delete the snapshot
  - Observe desired and actual state, diff them, then apply to converge
  answer: 3
  explanation: |
    The loop observes desired state (Git) and actual state (cluster), computes the diff, and
    applies changes to converge actual toward desired — continuously. This is the same
    controller pattern Kubernetes itself uses.
  ref: "concepts.md#the-reconciliation-loop"

- id: gitops-007
  difficulty: advanced
  tags: [reconciliation, level-triggered]
  question: |
    Why is GitOps reconciliation described as "level-triggered" rather than "edge-triggered,"
    and why does that matter?
  options:
  - It reacts exactly once to each Git event, so missed events are lost
  - It triggers only on the rising edge of a webhook signal
  - It applies changes only when a human clicks a button
  - It continuously converges toward the desired level, so it self-heals even if an event/sync was missed
  answer: 3
  explanation: |
    Level-triggered means the agent continuously drives actual state toward the declared
    level, rather than reacting once to an edge/event. If a sync is missed or a resource is
    deleted out of band, the next loop still notices the gap and fixes it — that is why
    GitOps self-heals.
  ref: "concepts.md#the-reconciliation-loop"

- id: gitops-008
  difficulty: intermediate
  tags: [reconciliation, idempotency]
  question: |
    What happens when the reconciliation loop runs and the cluster is already in sync with Git?
  options:
  - It errors because there is nothing to apply
  - It recreates every resource from scratch
  - It force-pushes a new commit to Git
  - It performs a no-op because applying the declared state is idempotent
  answer: 3
  explanation: |
    Reconciliation is idempotent: applying the already-satisfied desired state changes
    nothing (a no-op). This is a direct consequence of the declarative model.
  ref: "concepts.md#the-reconciliation-loop"

- id: gitops-009
  difficulty: beginner
  tags: [pull-model, push-model]
  question: |
    In the GitOps pull model, where do the cluster credentials that apply manifests live?
  options:
  - Inside the target cluster, held by the in-cluster agent
  - In the CI system that builds the image
  - On each developer's laptop
  - In the Git hosting provider
  answer: 0
  explanation: |
    In the pull model an agent runs inside the cluster and applies manifests locally, so
    credentials stay in the cluster. No external system (like CI) needs a kubeconfig.
  ref: "concepts.md#pull-model-vs-push-model"

- id: gitops-010
  difficulty: intermediate
  tags: [pull-model, security]
  question: |
    Why is the pull model generally considered more secure than the push model?
  options:
  - Because Git repositories cannot be compromised
  - Because it disables all RBAC in the cluster
  - Because credentials stay inside the cluster and only outbound connections to Git are needed
  - Because it encrypts all container images automatically
  answer: 2
  explanation: |
    Two reasons: cluster credentials never leave the cluster (a CI compromise cannot reach
    prod), and the cluster only makes outbound connections to Git rather than exposing its
    API to external pushers. This shrinks the attack surface.
  ref: "concepts.md#pull-model-vs-push-model"

- id: gitops-011
  difficulty: advanced
  tags: [pull-model, drift, push-model]
  question: |
    Compared with a push pipeline that runs kubectl apply only on merge, what does the pull
    model additionally give you regarding drift?
  options:
  - Nothing; both behave identically for drift
  - Drift is corrected only when someone reruns the pipeline
  - Drift is continuously detected and can be self-healed between deploys
  - Drift detection requires a separate paid product
  answer: 2
  explanation: |
    A push pipeline only reconciles when it happens to run (on merge). The pull model's agent
    continuously observes the cluster, so out-of-band drift is detected between deploys and
    can be automatically reverted (self-heal).
  ref: "concepts.md#pull-model-vs-push-model"

- id: gitops-012
  difficulty: intermediate
  tags: [pull-model, clarification]
  question: |
    A candidate claims "pull model means Argo CD polls Git, and push model means webhooks."
    What is the accurate correction?
  options:
  - They are right; polling equals pull and webhooks equal push
  - Webhooks are impossible in GitOps
  - Polling is not supported by Argo CD or Flux
  - Pull vs push refers to how desired state reaches the cluster (in-cluster agent applies), not whether polling or webhooks trigger it
  answer: 3
  explanation: |
    Pull vs push describes WHO applies changes to the cluster: in the pull model an agent
    inside the cluster applies them. Both Argo CD and Flux can be triggered by polling OR
    webhooks; the trigger mechanism is orthogonal to the pull/push distinction.
  ref: "concepts.md#pull-model-vs-push-model"

- id: gitops-013
  difficulty: beginner
  tags: [argocd, application]
  question: |
    In Argo CD, what is the core unit represented by the Application CRD?
  options:
  - A mapping of a Git repo/path/revision (source) to a target cluster/namespace (destination)
  - A single container image in a registry
  - A Prometheus alerting rule
  - A CI pipeline definition
  answer: 0
  explanation: |
    An Argo CD Application maps a source (Git repoURL, path, targetRevision) to a destination
    (cluster + namespace), and tracks its sync status (Synced/OutOfSync) and health status.
  ref: "concepts.md#argo-cd"

- id: gitops-014
  difficulty: intermediate
  tags: [argocd, sync-status, health-status]
  question: |
    Argo CD tracks two independent statuses for an Application. What are they?
  options:
  - Build status and test status
  - CPU status and memory status
  - Commit status and merge status
  - Sync status (Synced/OutOfSync) and health status (Healthy/Degraded/Progressing)
  answer: 3
  explanation: |
    Sync status says whether live objects match Git (Synced vs OutOfSync); health status says
    whether those objects are actually working (Healthy, Progressing, Degraded, etc.). They
    are independent — an app can be Synced but Degraded.
  ref: "concepts.md#argo-cd"

- id: gitops-015
  difficulty: intermediate
  tags: [argocd, tooling]
  question: |
    Which manifest formats does Argo CD support natively for rendering desired state?
  options:
  - Only plain Kubernetes YAML
  - Only Terraform HCL
  - Plain YAML, Helm, Kustomize, and Jsonnet
  - Only Docker Compose files
  answer: 2
  explanation: |
    Argo CD natively renders plain YAML, Helm charts, Kustomize overlays, and Jsonnet, then
    diffs the rendered result against live objects.
  ref: "concepts.md#argo-cd"

- id: gitops-016
  difficulty: beginner
  tags: [flux, toolkit]
  question: |
    How is Flux structured compared to Argo CD?
  options:
  - As the GitOps Toolkit: a set of composable, CRD-driven controllers
  - As a single monolithic controller with a built-in UI
  - As a Jenkins plugin
  - As a Terraform provider
  answer: 0
  explanation: |
    Flux is the GitOps Toolkit — a set of controllers (source, kustomize, helm, notification,
    image-automation) driven by CRDs — rather than one big application controller. It has no
    official first-class UI.
  ref: "concepts.md#flux"

- id: gitops-017
  difficulty: intermediate
  tags: [flux, controllers]
  question: |
    In Flux, which controller is responsible for reconciling HelmRelease objects?
  options:
  - source-controller
  - notification-controller
  - helm-controller
  - image-reflector-controller
  answer: 2
  explanation: |
    helm-controller reconciles HelmRelease objects (managing Helm releases). source-controller
    fetches artifacts (GitRepository/HelmRepository/OCIRepository/Bucket);
    kustomize-controller applies Kustomizations.
  ref: "concepts.md#flux"

- id: gitops-018
  difficulty: intermediate
  tags: [flux, argocd, comparison]
  question: |
    Which capability is BUILT IN to Flux but provided as a separate add-on (Argo CD Image
    Updater) for Argo CD?
  options:
  - Reconciling plain YAML
  - Applying Kustomize overlays
  - Storing manifests in Git
  - Automatically watching a container registry and committing updated image tags back to Git
  answer: 3
  explanation: |
    Flux ships image-reflector and image-automation controllers that watch registries and
    commit new image tags/digests back to Git. Argo CD provides similar functionality via the
    separate Argo CD Image Updater add-on.
  ref: "concepts.md#flux"

- id: gitops-019
  difficulty: intermediate
  tags: [app-of-apps, bootstrapping]
  question: |
    What is the "app-of-apps" pattern in Argo CD?
  options:
  - A single Application whose Git path contains other Application manifests, so syncing it creates the children
  - A way to merge multiple Git repos into one
  - A Helm chart that packages Prometheus
  - A CI job that generates Dockerfiles
  answer: 0
  explanation: |
    App-of-apps uses a root Application pointing at a directory of child Application manifests.
    Syncing the root creates/updates all children, bootstrapping an entire cluster from one
    object.
  ref: "concepts.md#app-of-apps-and-applicationsets"

- id: gitops-020
  difficulty: advanced
  tags: [applicationset, generators]
  question: |
    A platform team must deploy the same app to every registered cluster, and the cluster list
    changes over time. Which Argo CD mechanism fits best?
  options:
  - Manually create one Application per cluster and update by hand
  - An ApplicationSet with a cluster generator that templates Applications
  - A single Application with prune disabled
  - A Jenkins matrix build
  answer: 1
  explanation: |
    ApplicationSet generates Applications from a template plus a generator (list, cluster, Git,
    matrix, PR, SCM). A cluster generator automatically produces an Application per registered
    cluster, adapting as the set changes — far better than hand-maintaining each one.
  ref: "concepts.md#app-of-apps-and-applicationsets"

- id: gitops-021
  difficulty: intermediate
  tags: [sync-waves, ordering]
  question: |
    In Argo CD, resources annotated with sync-wave are applied in what order?
  options:
  - Highest wave number first, descending
  - Alphabetically by resource name only
  - From the lowest wave number to the highest
  - Randomly, since order is not guaranteed
  answer: 2
  explanation: |
    Argo CD applies sync waves from the lowest number to the highest. Waves default to 0 and
    can be negative, letting you run something before all other resources.
  ref: "concepts.md#sync-waves-and-hooks"

- id: gitops-022
  difficulty: beginner
  tags: [sync-waves, defaults]
  question: |
    If you do not annotate a resource with a sync-wave in Argo CD, which wave is it assigned?
  options:
  - Wave 0
  - Wave 1
  - The highest wave in the app
  - No wave; it is skipped
  answer: 0
  explanation: |
    Both hooks and resources default to wave 0. To make a resource run earlier you give it a
    negative wave; to run later, a higher positive wave.
  ref: "concepts.md#sync-waves-and-hooks"

- id: gitops-023
  difficulty: intermediate
  tags: [sync-hooks, phases]
  question: |
    You need to run a database migration BEFORE the application manifests are applied during an
    Argo CD sync. Which hook phase should the migration Job use?
  options:
  - PreSync
  - PostSync
  - SyncFail
  - Skip
  answer: 0
  explanation: |
    PreSync runs before the main manifests are applied — ideal for DB migrations. If a PreSync
    hook fails, the whole sync fails and stops. PostSync (after healthy) suits smoke
    tests/notifications.
  ref: "concepts.md#sync-waves-and-hooks"

- id: gitops-024
  difficulty: advanced
  tags: [sync-waves, health, stall]
  question: |
    An Argo CD sync using multiple waves stalls partway through and never advances to the next
    wave. What is a likely cause?
  options:
  - Git is unreachable, so no manifests were rendered
  - A resource in the current wave has no health check or never reports Healthy, and Argo waits before proceeding
  - Sync waves are not supported for Deployments
  - The Application has prune disabled
  answer: 1
  explanation: |
    Argo CD waits for resources in a wave to become Healthy before moving to the next wave. A
    resource that lacks a health assessment or never reaches Healthy can block progression.
    Order dependencies with waves and ensure health is reportable.
  ref: "concepts.md#sync-waves-and-hooks"

- id: gitops-025
  difficulty: beginner
  tags: [drift, definition]
  question: |
    In GitOps, what is "drift"?
  options:
  - The time it takes for a build to complete
  - The gradual increase in image size over time
  - Any divergence between the live cluster state and the desired state in Git
  - A network latency metric
  answer: 2
  explanation: |
    Drift is any difference between what is actually running in the cluster and what Git
    declares. The reconciliation loop detects it by diffing; policy decides whether to alert
    or auto-correct.
  ref: "concepts.md#drift-detection-and-self-heal"

- id: gitops-026
  difficulty: intermediate
  tags: [self-heal, drift]
  question: |
    With Argo CD selfHeal enabled, someone runs `kubectl edit` to change a live Deployment's
    replica count that is pinned in Git. What happens?
  options:
  - The change persists permanently and Git is updated to match
  - Argo CD deletes the Deployment entirely
  - Nothing, because self-heal only applies to new resources
  - Argo CD detects the divergence and reverts the cluster back to what Git declares
  answer: 3
  explanation: |
    selfHeal makes the agent revert manual live edits back to the Git-declared state, so
    out-of-band changes are ephemeral. Git remains the source of truth; the manual edit is
    undone on the next reconcile.
  ref: "concepts.md#drift-detection-and-self-heal"

- id: gitops-027
  difficulty: intermediate
  tags: [prune, drift]
  question: |
    A manifest file is deleted from Git, but the Argo CD Application has prune DISABLED. What is
    the effect on the object it defined?
  options:
  - The object is immediately deleted from the cluster
  - The object is left running (orphaned) in the cluster
  - The whole Application is deleted
  - Git rejects the deletion
  answer: 1
  explanation: |
    Without prune, removing a manifest from Git leaves the corresponding object orphaned and
    still running. Enabling prune=true makes Argo delete cluster objects that were removed from
    Git.
  ref: "concepts.md#drift-detection-and-self-heal"

- id: gitops-028
  difficulty: advanced
  tags: [self-heal, hpa, ignoredifferences]
  question: |
    An HPA manages replicas at runtime, but the Deployment's replicas field is also set in Git
    with selfHeal on. The result is constant thrashing. What is the correct fix?
  options:
  - Disable the HPA permanently
  - Turn off reconciliation for the whole cluster
  - Use ignoreDifferences to exclude the HPA-managed replicas field from the diff
  - Commit the current replica count every minute via CI
  answer: 2
  explanation: |
    Some fields are meant to change at runtime (HPA-managed replicas). Configuring Argo's
    ignoreDifferences to exclude that field stops self-heal from fighting the HPA, ending the
    thrashing while keeping GitOps for everything else.
  ref: "concepts.md#drift-detection-and-self-heal"

- id: gitops-029
  difficulty: advanced
  tags: [prune, outage, scenario]
  question: |
    A team enables automated sync with prune. A developer renames several manifest files in a
    single PR. On the next sync, production objects disappear. Why?
  options:
  - Renaming files corrupts the YAML so Argo skips them
  - prune deletes objects that no longer appear in Git; renamed files look like removed-then-added resources if the object identity changed
  - Argo CD always deletes everything when files are renamed
  - Self-heal recreated the objects with different names
  answer: 1
  explanation: |
    prune deletes cluster objects that are no longer present in the rendered Git state. If a
    rename changes the resulting object identity (or a file is removed without an equivalent
    replacement), prune removes the old objects — a well-known footgun of enabling auto-sync +
    prune without care.
  ref: "concepts.md#drift-detection-and-self-heal"

- id: gitops-030
  difficulty: beginner
  tags: [rollback, git-revert]
  question: |
    In GitOps, how do you roll back a bad deployment?
  options:
  - Make Git describe the previous good state (typically git revert); the agent reconciles the cluster back
  - SSH into each node and downgrade manually
  - Delete the cluster and recreate it
  - Disable the reconciliation agent
  answer: 0
  explanation: |
    Because Git is the source of truth, rollback is a Git operation. git revert creates a new
    commit undoing the bad change; the agent then reconciles the cluster back to the prior
    state, keeping the audit trail intact.
  ref: "concepts.md#rollback-via-git-revert"

- id: gitops-031
  difficulty: intermediate
  tags: [rollback, git-revert, git-reset]
  question: |
    Why is `git revert` preferred over `git reset`/force-push for GitOps rollback on a shared
    branch?
  options:
  - revert is faster to type
  - reset is not a real Git command
  - revert automatically restarts all pods
  - revert keeps an append-only, reviewable audit trail and does not rewrite shared history
  answer: 3
  explanation: |
    git revert adds a new commit that undoes the change, preserving an honest, append-only
    history (the rollback is itself reviewable). Reset/force-push rewrites shared history,
    which breaks collaborators and destroys the audit trail GitOps relies on.
  ref: "concepts.md#rollback-via-git-revert"

- id: gitops-032
  difficulty: intermediate
  tags: [rollback, imperative, drift]
  question: |
    An engineer rolls back using `kubectl rollout undo` instead of a Git change while the Argo
    CD app has selfHeal on. What is the likely outcome?
  options:
  - The rollback is durable and Git is updated automatically
  - Argo detects drift from Git and re-applies the bad version, undoing the manual rollback
  - The cluster is deleted
  - Nothing happens because rollout undo is blocked
  answer: 1
  explanation: |
    kubectl rollout undo makes the live state diverge from Git. With selfHeal on, Argo
    reconciles the cluster back to what Git says (the bad version). The durable fix is a Git
    commit (git revert), not an imperative command.
  ref: "concepts.md#rollback-via-git-revert"

- id: gitops-033
  difficulty: beginner
  tags: [promotion, environments]
  question: |
    How is environment promotion (dev to staging to prod) typically done in GitOps?
  options:
  - By manually editing resources in the prod cluster
  - Through Git — e.g. a PR that bumps the tested artifact into the higher environment's path/branch
  - By restarting the reconciliation agent
  - By emailing the ops team a tarball
  answer: 1
  explanation: |
    Promotion happens through Git: a pull request copies/bumps the validated artifact (image
    digest/manifest) from the lower environment's path/branch to the higher one. The PR
    approval is the gate and the audit record.
  ref: "concepts.md#environment-promotion"

- id: gitops-034
  difficulty: intermediate
  tags: [promotion, kustomize, overlays]
  question: |
    Using Kustomize for environments, what does a "base + overlays" layout achieve for
    promotion?
  options:
  - It encrypts secrets automatically
  - It removes the need for a Git repository
  - Shared manifests live in base; overlays patch only per-env differences, so promotion changes just the pinned image digest
  - It disables drift detection
  answer: 2
  explanation: |
    A shared base plus per-environment overlays means each environment differs only by small
    patches (replicas, limits, hostnames). Promotion typically changes just the pinned image
    digest in the higher overlay, inheriting everything else and minimizing inter-env drift.
  ref: "concepts.md#environment-promotion"

- id: gitops-035
  difficulty: intermediate
  tags: [promotion, image-digest]
  question: |
    Why should promotion pin an immutable image DIGEST rather than a mutable tag like `latest`?
  options:
  - Digests are shorter and easier to read
  - Because tags are not allowed in Kubernetes
  - Because digests disable image caching
  - So that what was tested in staging is bit-for-bit identical to what runs in prod
  answer: 3
  explanation: |
    A mutable tag can point at different content over time, so what you tested may not be what
    ships. Pinning the immutable digest guarantees the exact artifact validated in staging is
    the one promoted to prod.
  ref: "concepts.md#environment-promotion"

- id: gitops-036
  difficulty: advanced
  tags: [promotion, risk, branch-strategy]
  question: |
    A team keeps all environments in one shared branch of one repo. What risk does this create
    for promotion, and how is it mitigated?
  options:
  - No risk; single-branch is the recommended GitOps layout
  - A merge can hit prod immediately; mitigate by separating envs (path/branch/repo) and gating prod with review + protected branches
  - It makes rollback impossible; mitigate by disabling Git history
  - It prevents drift detection; mitigate by turning off self-heal
  answer: 1
  explanation: |
    Sharing one branch across all environments makes it easy to promote accidentally — a merge
    reaches prod at once. Separating environments by path/branch/repo and protecting prod with
    review and branch protection makes promotion deliberate.
  ref: "concepts.md#environment-promotion"

- id: gitops-037
  difficulty: beginner
  tags: [secrets, base64]
  question: |
    Why is committing a raw Kubernetes Secret manifest (base64-encoded) to Git unsafe?
  options:
  - Base64 is encoding, not encryption, so anyone with repo read access can decode the value
  - Base64 makes the file too large for Git
  - Kubernetes rejects base64 Secrets
  - Git strips base64 fields automatically
  answer: 0
  explanation: |
    Base64 is trivially reversible encoding, not encryption. Committing a raw Secret exposes
    the value to anyone who can read the repo. Secrets must be encrypted (SOPS, Sealed Secrets)
    or externalized (External Secrets, Vault).
  ref: "concepts.md#secrets-in-gitops"

- id: gitops-038
  difficulty: intermediate
  tags: [secrets, sealed-secrets]
  question: |
    How do Bitnami Sealed Secrets keep the "in Git" property while remaining safe?
  options:
  - They store the plaintext in Git but hide it in a comment
  - You encrypt with a cluster-side controller's public key and commit the encrypted SealedSecret; the controller decrypts in-cluster
  - They upload secrets to a public registry
  - They disable RBAC so anyone can read them
  answer: 1
  explanation: |
    With Sealed Secrets you encrypt the secret using the in-cluster controller's public key and
    commit the resulting encrypted SealedSecret. Only the controller (with the private key)
    can decrypt it in-cluster, so the encrypted blob is safe to store in Git.
  ref: "concepts.md#secrets-in-gitops"

- id: gitops-039
  difficulty: intermediate
  tags: [secrets, external-secrets]
  question: |
    With the External Secrets Operator (ESO), what actually lives in Git?
  options:
  - The plaintext secret value
  - Only a reference/pointer; the real value is fetched from an external store like Vault or AWS Secrets Manager
  - An encrypted copy of the secret
  - Nothing related to secrets at all
  answer: 1
  explanation: |
    ESO stores only a reference in Git (an ExternalSecret pointing at a key in Vault/AWS
    Secrets Manager/etc.). The operator fetches the real value from the external store and
    creates the Kubernetes Secret. This centralizes rotation and policy in the store.
  ref: "concepts.md#secrets-in-gitops"

- id: gitops-040
  difficulty: advanced
  tags: [secrets, rotation, tradeoffs]
  question: |
    A team wants secrets that rotate automatically from a central store without re-committing to
    Git on each rotation. Which approach fits best?
  options:
  - Sealed Secrets, re-encrypting and committing on every rotation
  - SOPS-encrypted values committed to Git
  - External Secrets Operator / Vault, where Git holds only a reference and the store manages rotation
  - Base64-encoded Secret manifests
  answer: 2
  explanation: |
    With Sealed Secrets/SOPS the encrypted material lives in Git, so rotation means
    re-encrypting and committing. Externalizing via ESO/Vault keeps only a reference in Git;
    the store rotates the value centrally, so no Git commit is needed per rotation.
  ref: "concepts.md#secrets-in-gitops"

- id: gitops-041
  difficulty: intermediate
  tags: [gitops-vs-cd, distinction]
  question: |
    A team's pipeline builds an image, then runs `helm upgrade` from the CI runner using a
    stored kubeconfig. Is this GitOps, and why?
  options:
  - Yes, because it uses Helm
  - Yes, because the manifests are in Git
  - No; it is push-based CD — CI holds cluster creds and there is no in-cluster agent continuously reconciling
  - No; GitOps requires Jenkins specifically
  answer: 2
  explanation: |
    Pushing helm upgrade from CI with a kubeconfig is pipeline-driven push CD. It lacks the
    pull + continuous-reconciliation properties (an in-cluster agent pulling from Git) that
    define GitOps, and it keeps cluster credentials in CI.
  ref: "concepts.md#gitops-vs-traditional-cd"

- id: gitops-042
  difficulty: intermediate
  tags: [gitops-vs-cd, ci-role]
  question: |
    In a healthy GitOps setup, where does CI's responsibility typically END?
  options:
  - When it runs kubectl apply against prod
  - When it SSHes into the cluster to restart pods
  - CI has no role at all in GitOps
  - When it commits the new image digest/manifest to the config repo (or opens a PR)
  answer: 3
  explanation: |
    GitOps concerns CD (delivery to the environment). CI still builds, tests, and produces the
    artifact; its job ends by committing the new image digest/manifest to the config repo (or
    opening a PR). The GitOps agent then reconciles from there.
  ref: "concepts.md#gitops-vs-traditional-cd"

- id: gitops-043
  difficulty: advanced
  tags: [gitops-vs-cd, repo-layout]
  question: |
    Why is separating the application source repo from the deployment/config repo a common
    GitOps practice?
  options:
  - Because Git cannot store code and YAML together
  - So CI on the app repo does not itself trigger reconciliation, and the config repo gets its own review/RBAC
  - To make builds slower on purpose
  - Because Argo CD only reads from repos named "config"
  answer: 1
  explanation: |
    Separating repos prevents app-code CI from directly triggering cluster changes, lets the
    config/deploy repo enforce its own review and RBAC (who can change prod), and keeps a clean
    boundary between "what the app is" and "what is deployed."
  ref: "concepts.md#gitops-vs-traditional-cd"

- id: gitops-044
  difficulty: beginner
  tags: [progressive-delivery, definition]
  question: |
    What does "progressive delivery" add on top of a basic deploy?
  options:
  - It gradually shifts traffic to the new version while watching metrics, with automated analysis and rollback
  - It compresses container images before shipping
  - It replaces Git with a database
  - It deploys to all users instantly with no checks
  answer: 0
  explanation: |
    Progressive delivery (canary, blue-green) gradually shifts traffic to the new version and
    uses automated metric analysis to promote or roll back. On GitOps the strategy itself is
    declared in Git.
  ref: "concepts.md#progressive-delivery-on-gitops"

- id: gitops-045
  difficulty: intermediate
  tags: [progressive-delivery, argo-rollouts]
  question: |
    What does Argo Rollouts provide for progressive delivery on Kubernetes?
  options:
  - A Rollout resource with canary/blue-green strategies plus AnalysisTemplates that query metrics and auto-abort on bad results
  - A replacement for Git
  - A container registry
  - A YAML linter
  answer: 0
  explanation: |
    Argo Rollouts offers a Rollout resource (a Deployment drop-in) supporting canary and
    blue-green strategies with traffic shaping, and AnalysisTemplates that query
    Prometheus/etc. to automatically abort (roll back) on bad metrics.
  ref: "concepts.md#progressive-delivery-on-gitops"

- id: gitops-046
  difficulty: intermediate
  tags: [progressive-delivery, flagger, flux]
  question: |
    Which progressive-delivery operator is commonly paired with Flux to automate canary analysis
    and promotion?
  options:
  - Sealed Secrets
  - Kustomize
  - Flagger
  - Jsonnet
  answer: 2
  explanation: |
    Flagger is a progressive-delivery operator frequently used with Flux; it automates canary
    analysis and promotion using a service mesh/ingress plus metric checks.
  ref: "concepts.md#progressive-delivery-on-gitops"

- id: gitops-047
  difficulty: advanced
  tags: [progressive-delivery, gitops-fit]
  question: |
    Why does declaring the rollout strategy and analysis criteria as manifests in Git fit the
    GitOps model well?
  options:
  - Because it hides the strategy from reviewers
  - Because it eliminates the need for metrics
  - Because it forces manual approval for every request
  - Because the delivery strategy becomes versioned, reviewed, and reconciled like everything else, with automatic rollback on a failed canary
  answer: 3
  explanation: |
    Putting the Rollout spec and AnalysisTemplates in Git makes the delivery strategy itself
    declarative, versioned, reviewed, and reconciled. On a failed canary the controller aborts
    and shifts traffic back automatically — rollback with the same GitOps guarantees.
  ref: "concepts.md#progressive-delivery-on-gitops"

- id: gitops-048
  difficulty: advanced
  tags: [scenario, drift, self-heal, principles]
  question: |
    Given: Argo CD with automated sync, selfHeal=true, prune=true. An SRE hotfixes prod by
    editing a live ConfigMap during an incident but does not commit to Git. Minutes later the
    fix vanishes. What is the correct explanation AND durable fix?
  options:
  - Argo crashed; restart the controller
  - selfHeal reverted the uncommitted live edit back to Git state; the durable fix is to commit the change to Git so reconciliation preserves it
  - prune deleted the ConfigMap because it was edited
  - Git rejected the ConfigMap; re-run CI
  answer: 1
  explanation: |
    With selfHeal on, any live change not reflected in Git is reverted on the next reconcile —
    so an uncommitted hotfix disappears. The durable fix is to put the change in Git (a commit/
    PR); then reconciliation preserves it. This is GitOps working as designed: Git is the
    source of truth.
  ref: "concepts.md#drift-detection-and-self-heal"
