topic: "DevSecOps & Pipeline Security"
domain: devops-cicd
topic_slug: devsecops-and-pipeline-security
version: 1
questions:
  - id: devsecops-and-pipeline-security-001
    difficulty: beginner
    tags: [shift-left, culture, devsecops]
    question: |
      What does "shift-left security" primarily mean in a DevSecOps context?
    options:
      - "Moving all security testing to a dedicated team after release"
      - "Running security scans only on the left-most (primary) branch"
      - "Shifting production traffic gradually to a new version"
      - "Moving security checks earlier in the delivery lifecycle (IDE, pre-commit, PR CI)"
    answer: 3
    explanation: |
      Shift-left means moving security checks earlier (leftward) in the timeline — into the IDE,
      pre-commit hooks, and PR pipeline — so defects are caught when they are cheapest to fix,
      rather than in a late pen-test or in production.
    ref: "concepts.md#shift-left-security-and-the-devsecops-culture"

  - id: devsecops-and-pipeline-security-002
    difficulty: beginner
    tags: [sast, static-analysis]
    question: |
      Which statement best describes SAST (Static Application Security Testing)?
    options:
      - "It attacks a running application from the outside with malicious payloads"
      - "It inventories third-party dependencies and matches them to known CVEs"
      - "It analyzes source code, bytecode, or binaries without executing them"
      - "It instruments the running app with an agent during functional tests"
    answer: 2
    explanation: |
      SAST reads source/bytecode/binaries without running them, flagging insecure code patterns and
      pointing at the exact file and line. Attacking a running app is DAST; dependency-CVE matching
      is SCA; in-process instrumentation is IAST.
    ref: "concepts.md#sast--static-application-security-testing"

  - id: devsecops-and-pipeline-security-003
    difficulty: beginner
    tags: [dast, dynamic-analysis]
    question: |
      A DAST tool such as OWASP ZAP requires which of the following to run?
    options:
      - "A running, deployed instance of the application"
      - "Read access to the full source code repository"
      - "A signed SBOM in CycloneDX format"
      - "An instrumentation agent compiled into the binary"
    answer: 0
    explanation: |
      DAST tests the application dynamically from the outside like an attacker, so it needs a
      running/deployed instance. It does not read source (that's SAST) and does not need an SBOM or
      in-process agent (that's IAST).
    ref: "concepts.md#dast-and-iast--testing-the-running-application"

  - id: devsecops-and-pipeline-security-004
    difficulty: beginner
    tags: [sca, dependencies, cve]
    question: |
      What does Software Composition Analysis (SCA) primarily do?
    options:
      - "Identifies third-party/open-source dependencies and flags those with known CVEs"
      - "Rewrites insecure code patterns automatically"
      - "Fuzzes API endpoints of a running service"
      - "Scans container base images for OS-package vulnerabilities only"
    answer: 0
    explanation: |
      SCA inventories your direct and transitive third-party dependencies and matches them against
      vulnerability databases (NVD, GitHub Advisory, OSV), often checking licenses too. It is the
      complement to SAST, which covers your own code.
    ref: "concepts.md#sca--software-composition-analysis-dependency-cve-scanning"

  - id: devsecops-and-pipeline-security-005
    difficulty: beginner
    tags: [secret-scanning, credentials]
    question: |
      What is the goal of secret scanning in a pipeline?
    options:
      - "To encrypt secrets at rest in the CI secret store"
      - "To rotate cloud credentials on a fixed schedule"
      - "To inject secrets into the build environment at runtime"
      - "To detect hard-coded credentials, keys, and tokens in code, commits, and history"
    answer: 3
    explanation: |
      Secret scanning detects hard-coded credentials (API keys, cloud keys, tokens, private keys) in
      source, commits, and history using patterns and entropy analysis. Encryption, rotation, and
      injection are secrets-management concerns, not detection.
    ref: "concepts.md#secret-scanning--pre-commit-and-ci"

  - id: devsecops-and-pipeline-security-006
    difficulty: beginner
    tags: [iac-scanning, terraform]
    question: |
      Tools like Checkov and tfsec are used to do what?
    options:
      - "Statically scan infrastructure-as-code for insecure configuration before it is applied"
      - "Load-test infrastructure after deployment"
      - "Sign container images with cosign"
      - "Rotate Terraform state-file encryption keys"
    answer: 0
    explanation: |
      Checkov, tfsec, Terrascan, and KICS statically analyze IaC (Terraform, CloudFormation, K8s
      YAML) for insecure configuration — public buckets, open security groups, unencrypted storage —
      before `terraform apply` creates the resources.
    ref: "concepts.md#iac-scanning--terraform-cloudformation-kubernetes-manifests"

  - id: devsecops-and-pipeline-security-007
    difficulty: beginner
    tags: [image-scanning, trivy, containers]
    question: |
      What does a container image scanner such as Trivy or Grype primarily inspect?
    options:
      - "Live network traffic to the running container"
      - "OS packages and application dependencies baked into the image layers, plus embedded secrets"
      - "The Kubernetes RBAC policy of the cluster"
      - "The developer's source-control commit history"
    answer: 1
    explanation: |
      Image scanning is essentially SCA applied to the whole image: it inspects OS packages
      (apt/apk/yum) and app dependencies in the layers, plus embedded secrets and misconfigurations,
      including those inherited from the base image.
    ref: "concepts.md#container-image-scanning--trivy-grype"

  - id: devsecops-and-pipeline-security-008
    difficulty: beginner
    tags: [policy-as-code, opa]
    question: |
      Open Policy Agent (OPA) policies are written in which language?
    options:
      - "HCL"
      - "YAML"
      - "Rego"
      - "Python"
    answer: 2
    explanation: |
      OPA is a general-purpose policy engine whose policies are written in Rego; it evaluates JSON
      input and returns allow/deny decisions. Conftest runs Rego policies against config files in the
      pipeline.
    ref: "concepts.md#policy-as-code--opa-conftest-kyverno"

  - id: devsecops-and-pipeline-security-009
    difficulty: beginner
    tags: [oidc, least-privilege, ci-credentials]
    question: |
      What is the main security advantage of using OIDC federation for a CI job's cloud access
      instead of a stored long-lived access key?
    options:
      - "It makes builds run faster"
      - "It removes the need for IAM roles entirely"
      - "It encrypts the build logs automatically"
      - "No long-lived secret is stored in CI; credentials are short-lived and scoped"
    answer: 3
    explanation: |
      With OIDC, CI presents a short-lived signed identity token and the cloud mints temporary,
      scoped credentials (e.g. via STS). No static long-lived key is stored, and leaked tokens expire
      in minutes, drastically shrinking the blast radius.
    ref: "concepts.md#least-privilege-for-ci--oidc-vs-long-lived-keys"

  - id: devsecops-and-pipeline-security-010
    difficulty: beginner
    tags: [gates, advisory]
    question: |
      In pipeline security, what is the difference between a "gate" and an "advisory" check?
    options:
      - "A gate runs faster than an advisory check"
      - "A gate only runs in production; advisory checks run in staging"
      - "A gate fails/blocks the pipeline on a finding; an advisory check reports but lets it proceed"
      - "A gate scans code; an advisory check scans dependencies"
    answer: 2
    explanation: |
      A gate returns a non-zero result and blocks the build/merge on a finding; an advisory check
      surfaces the finding but allows the pipeline to continue. Choosing which findings gate versus
      advise is the central DevSecOps tuning decision.
    ref: "concepts.md#security-gates-vs-advisory-findings--breaking-the-build"

  - id: devsecops-and-pipeline-security-011
    difficulty: intermediate
    tags: [sast, false-positives]
    question: |
      Teams frequently disable SAST tooling. Which characteristic of SAST is most often the reason?
    options:
      - "It cannot point to a specific line of code"
      - "It has a high false-positive rate because it lacks runtime context"
      - "It requires a fully deployed environment"
      - "It only works on interpreted languages"
    answer: 1
    explanation: |
      Because SAST has no runtime context, it flags patterns that may not be exploitable (e.g. a
      "tainted" value validated elsewhere), producing many false positives. Unmanaged noise trains
      developers to ignore the tool — the main cause of abandonment.
    ref: "concepts.md#sast--static-application-security-testing"

  - id: devsecops-and-pipeline-security-012
    difficulty: intermediate
    tags: [dast, sast, comparison]
    question: |
      Compared with SAST, DAST typically has which pair of characteristics?
    options:
      - "Runs earlier in the pipeline and gives precise code locations"
      - "Requires source code and finds unhit code paths"
      - "Runs later against a running app and has lower false positives but poor code-location info"
      - "Produces an SBOM and checks dependency licenses"
    answer: 2
    explanation: |
      DAST runs later (needs a deployed app), confirms exploitable issues so it has low false
      positives, but because it works from the outside it gives poor code-location detail. SAST is the
      opposite: early, precise location, but noisier.
    ref: "concepts.md#dast-and-iast--testing-the-running-application"

  - id: devsecops-and-pipeline-security-013
    difficulty: intermediate
    tags: [iast, hybrid]
    question: |
      How does IAST combine the strengths of SAST and DAST?
    options:
      - "An in-process agent observes code paths and runtime data flow during tests, giving low false positives with precise code location"
      - "It runs source analysis and dependency scanning in one pass"
      - "It replays production traffic against a static copy of the code"
      - "It signs the artifact and verifies provenance at deploy time"
    answer: 0
    explanation: |
      IAST instruments the running application with an agent while tests exercise it, so it sees both
      the runtime data flow (like DAST, low false positives) and the exact code path/line (like SAST).
      Its limit is that it only covers code paths the tests actually hit.
    ref: "concepts.md#dast-and-iast--testing-the-running-application"

  - id: devsecops-and-pipeline-security-014
    difficulty: intermediate
    tags: [sca, transitive, lockfiles]
    question: |
      Why do effective SCA tools read lockfiles (e.g. package-lock.json, poetry.lock, go.sum) rather
      than only top-level manifests?
    options:
      - "Lockfiles are encrypted and safer to parse"
      - "Lockfiles contain the fully resolved, pinned transitive dependency tree where most vulnerable components hide"
      - "Top-level manifests are not committed to version control"
      - "Lockfiles include the application's own source code"
    answer: 1
    explanation: |
      Most vulnerable components are pulled in indirectly (transitively). Lockfiles capture the fully
      resolved, pinned set of every direct and transitive dependency, so SCA must read them to see the
      real dependency tree, not just top-level declarations.
    ref: "concepts.md#sca--software-composition-analysis-dependency-cve-scanning"

  - id: devsecops-and-pipeline-security-015
    difficulty: intermediate
    tags: [log4shell, sca, incident]
    question: |
      Log4Shell (CVE-2021-44228) is often cited as the canonical SCA example because it was a
      critical RCE in:
    options:
      - "A widely used, often transitive, open-source logging dependency"
      - "The Linux kernel"
      - "A proprietary internal service"
      - "The TLS handshake protocol"
    answer: 0
    explanation: |
      Log4Shell was a critical remote-code-execution flaw in Log4j, a ubiquitous logging library
      usually present as a transitive dependency. Teams with an SBOM + SCA could quickly answer "am I
      affected and where?"; teams without spent days searching.
    ref: "concepts.md#sca--software-composition-analysis-dependency-cve-scanning"

  - id: devsecops-and-pipeline-security-016
    difficulty: intermediate
    tags: [secret-scanning, pre-commit, ci]
    question: |
      Why is a pre-commit secret-scanning hook considered a helper rather than an enforceable
      control?
    options:
      - "It cannot detect high-entropy strings"
      - "It only scans binary files"
      - "It requires cloud credentials to run"
      - "It runs locally and can be bypassed (e.g. git commit --no-verify)"
    answer: 3
    explanation: |
      A pre-commit hook runs on the developer's machine and can be skipped with `--no-verify` or a
      missing hook install. The enforceable backstop is server-side push protection / CI scanning,
      which can actually reject the push.
    ref: "concepts.md#secret-scanning--pre-commit-and-ci"

  - id: devsecops-and-pipeline-security-017
    difficulty: intermediate
    tags: [secret-scanning, remediation, git-history]
    question: |
      A developer accidentally committed an AWS access key, then deleted the file in a follow-up
      commit. What is the correct primary remediation?
    options:
      - "Nothing further — the file is gone from the latest commit"
      - "Add the file to .gitignore"
      - "Squash the two commits together"
      - "Immediately rotate/revoke the exposed credential"
    answer: 3
    explanation: |
      Git retains the secret in history and in every clone/fork, so deleting the file does not
      un-expose it. The credential must be treated as compromised and rotated/revoked immediately;
      history rewriting is cleanup, not remediation.
    ref: "concepts.md#secret-scanning--pre-commit-and-ci"

  - id: devsecops-and-pipeline-security-018
    difficulty: intermediate
    tags: [iac-scanning, terraform, scenario]
    question: |
      Given this Terraform, which finding would an IaC scanner most likely raise?

      resource "aws_security_group_rule" "ssh" {
        type        = "ingress"
        from_port   = 22
        to_port     = 22
        protocol    = "tcp"
        cidr_blocks = ["0.0.0.0/0"]
      }
    options:
      - "The rule uses TCP instead of UDP"
      - "The resource is missing a provider block"
      - "SSH (port 22) is exposed to the entire internet (0.0.0.0/0)"
      - "The port range is too narrow"
    answer: 2
    explanation: |
      Allowing ingress on port 22 from 0.0.0.0/0 opens SSH to the whole internet — a classic
      misconfiguration Checkov/tfsec flag. Scanning the code/plan in the PR catches this before the
      security group is ever created.
    ref: "concepts.md#iac-scanning--terraform-cloudformation-kubernetes-manifests"

  - id: devsecops-and-pipeline-security-019
    difficulty: intermediate
    tags: [image-scanning, base-image, attack-surface]
    question: |
      Which change most effectively reduces the number of CVEs reported by a container image
      scanner?
    options:
      - "Adding more RUN layers to the Dockerfile"
      - "Renaming the image tag to 'latest'"
      - "Running the scan less frequently"
      - "Switching to a minimal base image such as distroless or Alpine/scratch"
    answer: 3
    explanation: |
      Base-image choice is the biggest lever: a full Debian base carries hundreds of OS packages
      (and their CVEs), while distroless/Alpine/scratch carry far fewer, shrinking both findings and
      attack surface. Rebuilding on a slimmer, patched base fixes more than chasing individual CVEs.
    ref: "concepts.md#container-image-scanning--trivy-grype"

  - id: devsecops-and-pipeline-security-020
    difficulty: intermediate
    tags: [image-scanning, registry, cve]
    question: |
      Why should container images be re-scanned in the registry over time, even if the image bits
      never change?
    options:
      - "New CVEs may be disclosed against packages already inside the image"
      - "Image digests drift over time"
      - "The registry compresses layers differently each day"
      - "Scanning resets the image's creation timestamp"
    answer: 0
    explanation: |
      An image that was clean at build time can later be flagged when a new CVE is published against a
      package it contains — nothing in the image changed, the vulnerability knowledge did. Continuous
      re-scanning surfaces newly disclosed risks.
    ref: "concepts.md#container-image-scanning--trivy-grype"

  - id: devsecops-and-pipeline-security-021
    difficulty: intermediate
    tags: [image-scanning, trivy, gate, scenario]
    question: |
      A pipeline runs: `trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed $IMG`.
      What does `--ignore-unfixed` accomplish here?
    options:
      - "It ignores all CRITICAL vulnerabilities"
      - "It fails the build only on HIGH/CRITICAL vulnerabilities that have a patched version available"
      - "It skips scanning the base image layers"
      - "It suppresses the scan output entirely"
    answer: 1
    explanation: |
      `--ignore-unfixed` limits the gate to vulnerabilities with a fix available, so the pipeline
      doesn't block on CVEs the team literally cannot remediate yet. Combined with `--exit-code 1`, it
      hard-fails only on fixable HIGH/CRITICAL findings.
    ref: "concepts.md#container-image-scanning--trivy-grype"

  - id: devsecops-and-pipeline-security-022
    difficulty: intermediate
    tags: [gates, policy, adoption]
    question: |
      Which gating policy best sustains long-term developer adoption of security scanning?
    options:
      - "Hard-fail the build on every finding of any severity"
      - "Never fail the build; log everything for later review"
      - "Gate on critical/high, fixable, ideally reachable findings; keep the long tail advisory and tracked"
      - "Only scan the main branch once per release"
    answer: 2
    explanation: |
      Blanket hard-failing on every finding maximizes false-positive friction and pushes teams to
      bypass checks; never failing provides no protection. The balanced approach gates on
      high-severity, fixable, reachable issues and keeps low-signal findings advisory but tracked.
    ref: "concepts.md#security-gates-vs-advisory-findings--breaking-the-build"

  - id: devsecops-and-pipeline-security-023
    difficulty: intermediate
    tags: [gates, diff-aware, baseline]
    question: |
      A legacy repository has thousands of pre-existing SAST findings. How can the team introduce a
      SAST gate without blocking all work on day one?
    options:
      - "Delete the old findings from the database"
      - "Raise the severity threshold to 'informational'"
      - "Run the scan only at midnight"
      - "Use diff-aware/baseline scanning that gates only on newly introduced findings"
    answer: 3
    explanation: |
      Diff-aware (baseline) scanning records the existing backlog and gates only on findings newly
      introduced by a change, so a legacy repo can adopt gating immediately while chipping away at the
      backlog over time.
    ref: "concepts.md#security-gates-vs-advisory-findings--breaking-the-build"

  - id: devsecops-and-pipeline-security-024
    difficulty: intermediate
    tags: [policy-as-code, conftest, iac]
    question: |
      What is Conftest's role in a CI pipeline?
    options:
      - "It runs OPA/Rego policies against structured config files (Terraform plan JSON, K8s YAML, Dockerfiles)"
      - "It performs dynamic testing of a running web app"
      - "It signs artifacts and stores provenance attestations"
      - "It manages long-lived cloud credentials for runners"
    answer: 0
    explanation: |
      Conftest is the CI-native way to evaluate OPA/Rego policies against structured configuration
      files (Terraform plan JSON, Kubernetes YAML, Dockerfiles), letting you gate IaC on
      organizational policy inside the pipeline.
    ref: "concepts.md#policy-as-code--opa-conftest-kyverno"

  - id: devsecops-and-pipeline-security-025
    difficulty: intermediate
    tags: [policy-as-code, kyverno, admission]
    question: |
      Where do Kyverno and OPA Gatekeeper enforce policy?
    options:
      - "In the developer's IDE before commit"
      - "At the Kubernetes admission boundary, rejecting non-compliant resources at apply time"
      - "Inside the container image build only"
      - "In the DNS resolution path"
    answer: 1
    explanation: |
      Kyverno and OPA Gatekeeper act as Kubernetes admission controllers, rejecting non-compliant
      resources when they are applied. They are the runtime backstop to the pipeline-side policy
      check — defense in depth against out-of-band applies.
    ref: "concepts.md#policy-as-code--opa-conftest-kyverno"

  - id: devsecops-and-pipeline-security-026
    difficulty: intermediate
    tags: [oidc, github-actions, scenario]
    question: |
      In this GitHub Actions job, why is `id-token: write` required?

      permissions:
        id-token: write
        contents: read
      jobs:
        deploy:
          steps:
            - uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: arn:aws:iam::111122223333:role/ci-deploy
    options:
      - "It grants the job write access to the repository contents"
      - "It enables pushing container images to a registry"
      - "It is required to read repository secrets"
      - "It allows the job to request an OIDC identity token used to assume the AWS role"
    answer: 3
    explanation: |
      `id-token: write` lets the workflow request a short-lived OIDC token from GitHub, which
      configure-aws-credentials exchanges via STS AssumeRoleWithWebIdentity for temporary AWS
      credentials — so no long-lived key is stored.
    ref: "concepts.md#least-privilege-for-ci--oidc-vs-long-lived-keys"

  - id: devsecops-and-pipeline-security-027
    difficulty: advanced
    tags: [oidc, trust-policy, scenario]
    question: |
      An AWS IAM role for CI has a trust policy that federates GitHub's OIDC provider but omits any
      condition on the `sub` claim (it trusts `repo:my-org/*`). Why is this dangerous?
    options:
      - "The role will expire too quickly to be useful"
      - "OIDC tokens cannot be verified without a sub condition"
      - "Any workflow in the org — including an attacker-triggered one — could assume the role"
      - "It forces the use of long-lived keys instead"
    answer: 2
    explanation: |
      A too-loose trust policy (wildcard repo, no sub/aud condition) lets any workflow in the org — or
      an attacker's PR-triggered workflow — assume the role. The trust must be pinned to the exact
      repo and ref/environment via the sub claim.
    ref: "concepts.md#least-privilege-for-ci--oidc-vs-long-lived-keys"

  - id: devsecops-and-pipeline-security-028
    difficulty: advanced
    tags: [ppe, pipeline-security, github-actions]
    question: |
      What is Poisoned Pipeline Execution (PPE)?
    options:
      - "Injecting SQL into a production database via the app"
      - "Getting attacker-controlled code to run inside the CI environment, often via untrusted PRs or a modified pipeline definition"
      - "Corrupting the artifact repository's storage disk"
      - "Overloading runners with too many parallel jobs"
    answer: 1
    explanation: |
      PPE is when an attacker causes malicious code to execute within the CI environment — e.g. a fork
      PR triggering a workflow that reads secrets, or a modified pipeline definition run with
      privileges. It is a top OWASP CI/CD risk because CI holds credentials and deploys to prod.
    ref: "concepts.md#protecting-the-pipeline-itself--ppe-dependency-confusion-runners"

  - id: devsecops-and-pipeline-security-029
    difficulty: advanced
    tags: [pull-request-target, secrets, github-actions]
    question: |
      Why is GitHub Actions' `pull_request_target` trigger considered dangerous when handling forked
      pull requests?
    options:
      - "It runs with the secrets and permissions of the base repository while potentially executing untrusted PR code"
      - "It cannot access the repository at all"
      - "It disables all caching for the job"
      - "It only runs on the default branch"
    answer: 0
    explanation: |
      Unlike `pull_request`, `pull_request_target` runs in the context of the base repo — with its
      secrets and write token — while the PR may contain attacker-controlled changes. Mishandled, it
      enables PPE/secret theft, so privileged secret-bearing steps must not run untrusted PR code.
    ref: "concepts.md#protecting-the-pipeline-itself--ppe-dependency-confusion-runners"

  - id: devsecops-and-pipeline-security-030
    difficulty: advanced
    tags: [dependency-confusion, supply-chain]
    question: |
      Which scenario describes a dependency confusion (substitution) attack?
    options:
      - "A dependency's license changes to a copyleft license"
      - "Two teams import different major versions of the same library"
      - "An attacker publishes a public package with the same name as an internal package but a higher version, and a misconfigured resolver pulls the public one"
      - "A CVE is disclosed in a transitive dependency"
    answer: 2
    explanation: |
      Dependency confusion exploits resolvers that fall back to public registries: the attacker
      publishes a public package matching an internal name with a higher version, tricking the build
      into fetching malicious code. Mitigations: namespace internal packages and pin a trusted private
      registry.
    ref: "concepts.md#protecting-the-pipeline-itself--ppe-dependency-confusion-runners"

  - id: devsecops-and-pipeline-security-031
    difficulty: advanced
    tags: [action-pinning, supply-chain, github-actions]
    question: |
      Why does hardening guidance recommend pinning a third-party GitHub Action to a full commit SHA
      instead of a tag like `@v3`?
    options:
      - "SHAs make the workflow file shorter"
      - "Tags are not supported by GitHub Actions"
      - "Pinning to a SHA runs the action faster"
      - "A mutable tag can be repointed by whoever controls it, silently changing what runs; a SHA is immutable"
    answer: 3
    explanation: |
      A tag is a mutable pointer; the maintainer (or an attacker who compromises the repo) can move
      `@v3` to malicious code that then executes in your pipeline. A full commit SHA is immutable, so
      you always run exactly the reviewed code.
    ref: "concepts.md#protecting-the-pipeline-itself--ppe-dependency-confusion-runners"

  - id: devsecops-and-pipeline-security-032
    difficulty: advanced
    tags: [runners, isolation, pipeline-security]
    question: |
      What is the main security risk of persistent, shared self-hosted CI runners, and the preferred
      mitigation?
    options:
      - "They are too slow; use larger instances"
      - "State can leak between jobs (secrets/cache); prefer ephemeral, single-use runners"
      - "They cannot run containers; switch to VMs"
      - "They cost more; consolidate onto one runner"
    answer: 1
    explanation: |
      Persistent shared runners retain state between jobs, so a malicious job can read the next
      tenant's secrets or cache. Ephemeral, single-use runners eliminate cross-job leakage, and
      untrusted workloads should never share a runner holding prod credentials.
    ref: "concepts.md#protecting-the-pipeline-itself--ppe-dependency-confusion-runners"

  - id: devsecops-and-pipeline-security-033
    difficulty: intermediate
    tags: [culture, gates, dora]
    question: |
      According to the DORA/Accelerate research, heavyweight change-approval boards (external manual
      approval) tend to:
    options:
      - "Improve both speed and stability significantly"
      - "Have no measurable effect on delivery"
      - "Correlate with worse stability and speed without reducing risk"
      - "Only affect security incidents, not delivery metrics"
    answer: 2
    explanation: |
      Accelerate found that external, heavyweight change-approval processes correlate with worse
      stability and slower delivery without reducing risk. DevSecOps prefers peer review plus
      automated policy (guardrails) over a central approval committee.
    ref: "concepts.md#shift-left-security-and-the-devsecops-culture"

  - id: devsecops-and-pipeline-security-034
    difficulty: intermediate
    tags: [guardrails, gates, culture]
    question: |
      In DevSecOps, how are "guardrails" distinguished from "gates"?
    options:
      - "Guardrails are manual approvals; gates are automated"
      - "They are synonyms"
      - "Guardrails only apply to infrastructure; gates only to application code"
      - "Guardrails are automated, self-service, in-workflow feedback that scale; gates are manual approvals that stop the line"
    answer: 3
    explanation: |
      Guardrails give automated, self-service feedback where developers work (a failing PR check) and
      scale across teams; gates are manual approvals that halt delivery. DevSecOps favors guardrails
      plus peer review over central gates.
    ref: "concepts.md#shift-left-security-and-the-devsecops-culture"

  - id: devsecops-and-pipeline-security-035
    difficulty: advanced
    tags: [reachability, sca, noise]
    question: |
      Advanced SCA tools perform "reachability analysis." What does that reduce?
    options:
      - "The size of the container image"
      - "Noise from CVEs in dependency code the application never actually calls"
      - "The number of transitive dependencies downloaded"
      - "The time to sign an SBOM"
    answer: 1
    explanation: |
      Reachability analysis determines whether the vulnerable function of a dependency is actually
      called by your code. A CVE you never reach is lower risk, so reachability cuts alert fatigue by
      prioritizing exploitable findings.
    ref: "concepts.md#sca--software-composition-analysis-dependency-cve-scanning"

  - id: devsecops-and-pipeline-security-036
    difficulty: intermediate
    tags: [pipeline-stages, ordering, scenario]
    question: |
      A team wants the fastest feedback. Which ordering places security scans most appropriately by
      cost/stage?
    options:
      - "DAST on every commit; SAST and secret scanning only before release"
      - "All scans run only in production"
      - "Image scanning first, then compile the code"
      - "Secret scan + SAST + SCA on the PR (early); DAST/IAST in staging against the running app (later)"
    answer: 3
    explanation: |
      Cheap, source/config-level scans (secret, SAST, SCA, IaC) belong early on the PR for fast
      feedback; DAST/IAST need a running deployment so they run later against staging. Running DAST on
      every commit is slow and impractical.
    ref: "concepts.md#dast-and-iast--testing-the-running-application"

  - id: devsecops-and-pipeline-security-037
    difficulty: advanced
    tags: [policy-as-code, defense-in-depth, scenario]
    question: |
      An org enforces "no container runs as root" only as a CI Conftest gate. An engineer bypasses CI
      and runs `kubectl apply` manually with a root container. What defense would have caught this?
    options:
      - "A faster CI runner"
      - "An admission-time policy engine (Kyverno/Gatekeeper) enforcing the same rule at apply time"
      - "A longer OIDC token lifetime"
      - "Renaming the deployment"
    answer: 1
    explanation: |
      A CI-only policy is bypassable by out-of-band applies. Enforcing the same policy at the
      Kubernetes admission boundary (Kyverno/Gatekeeper) provides defense in depth, rejecting the
      non-compliant resource regardless of how it was submitted.
    ref: "concepts.md#policy-as-code--opa-conftest-kyverno"

  - id: devsecops-and-pipeline-security-038
    difficulty: advanced
    tags: [gates, break-glass, waiver]
    question: |
      What is the recommended way to handle a genuine emergency where a security gate is blocking a
      critical hotfix?
    options:
      - "Permanently disable the gate for the repository"
      - "Add a silent inline suppression comment and forget it"
      - "Use a documented, audited, time-boxed exception/waiver with an owner and expiry"
      - "Delete the scanner from the pipeline"
    answer: 2
    explanation: |
      A break-glass exception should be documented, audited, owned, and time-boxed (with an expiry),
      so emergencies aren't blocked forever while the waiver stays visible and temporary — unlike
      silent suppressions or permanently disabling the gate.
    ref: "concepts.md#security-gates-vs-advisory-findings--breaking-the-build"

  - id: devsecops-and-pipeline-security-039
    difficulty: intermediate
    tags: [token-scope, github-token, least-privilege]
    question: |
      What is the least-privilege default for a workflow's `GITHUB_TOKEN` permissions?
    options:
      - "Full admin on the organization"
      - "`contents: read` (and only widen to write for jobs that truly need it)"
      - "`write-all`"
      - "No permissions at all, which disables checkout"
    answer: 1
    explanation: |
      Least privilege means starting from read-only (`contents: read`) and granting write scopes only
      to the specific jobs that need them (e.g. `id-token: write` for OIDC, `packages: write` to
      publish). Broad `write-all` tokens expand the blast radius of any compromise.
    ref: "concepts.md#least-privilege-for-ci--oidc-vs-long-lived-keys"

  - id: devsecops-and-pipeline-security-040
    difficulty: intermediate
    tags: [scope, sbom, cross-reference]
    question: |
      This DevSecOps topic covers SAST/DAST/SCA/scanning in the pipeline. Which concern is explicitly
      deferred to the `software-supply-chain-security` topic?
    options:
      - "Running Semgrep on a pull request"
      - "Gating a Trivy scan on critical CVEs"
      - "Configuring OIDC for a CI job"
      - "SLSA levels, provenance attestation, and artifact/SBOM signing"
    answer: 3
    explanation: |
      This topic owns the pipeline scanners and gates. Supply-chain integrity — SLSA levels, build
      provenance, and signing of artifacts/SBOMs — is deepened in `software-supply-chain-security`,
      while vuln classes live in the security domain and deploy secrets in `secrets-management`.
    ref: "concepts.md#sca--software-composition-analysis-dependency-cve-scanning"

  - id: devsecops-and-pipeline-security-041
    difficulty: beginner
    tags: [sca, sbom]
    question: |
      An SBOM (Software Bill of Materials) is most directly related to which pipeline scan?
    options:
      - "DAST"
      - "Secret scanning"
      - "SCA (software composition analysis)"
      - "IAST"
    answer: 2
    explanation: |
      SCA typically emits or consumes an SBOM (CycloneDX/SPDX) — a machine-readable inventory of
      components — which it then matches against vulnerability databases. The SBOM as a signed
      supply-chain artifact is expanded in software-supply-chain-security.
    ref: "concepts.md#sca--software-composition-analysis-dependency-cve-scanning"

  - id: devsecops-and-pipeline-security-042
    difficulty: advanced
    tags: [shift-right, runtime, culture]
    question: |
      Why is "shift left AND shield right" considered more complete than shift-left alone?
    options:
      - "Static analysis is always wrong"
      - "Shielding right replaces the need for any early scanning"
      - "Static/early scans can't see runtime auth logic, real config, and newly disclosed deps, so runtime/DAST and prod posture checks remain necessary"
      - "Production monitoring is cheaper than pre-commit hooks"
    answer: 2
    explanation: |
      Early static analysis cannot verify runtime auth/session logic, actual deployed configuration,
      or CVEs disclosed after build. Combining early scanning with runtime protection and production
      posture checks (shield right) covers what static analysis inherently misses.
    ref: "concepts.md#shift-left-security-and-the-devsecops-culture"

  - id: devsecops-and-pipeline-security-043
    difficulty: intermediate
    tags: [sast, scanning, blind-spots]
    question: |
      Which class of problem is SAST fundamentally unable to detect on its own?
    options:
      - "SQL string concatenation in your source"
      - "A runtime misconfiguration or a CVE in a third-party binary dependency"
      - "Use of eval on user input in your code"
      - "A hard-coded key literal in a source file"
    answer: 1
    explanation: |
      SAST reads your own code, so it catches insecure code patterns like injection sinks and
      hard-coded keys, but it cannot see runtime/config issues or vulnerabilities inside third-party
      binaries — those need DAST/config scanning and SCA respectively.
    ref: "concepts.md#sast--static-application-security-testing"

  - id: devsecops-and-pipeline-security-044
    difficulty: advanced
    tags: [scenario, gates, false-positive]
    question: |
      A pipeline hard-fails on every SCA finding including LOW severity and unfixable CVEs. Developers
      have started adding blanket ignore rules. What is the best corrective action?
    options:
      - "Remove SCA entirely since it's being ignored"
      - "Increase the failure to also block on informational findings"
      - "Move SCA to run only quarterly"
      - "Re-tune the gate to block only high-severity, fixable (ideally reachable) findings and make the rest advisory/tracked"
    answer: 3
    explanation: |
      The blanket ignores are a symptom of over-strict gating causing alert fatigue. Re-tuning to gate
      only on actionable (high-severity, fixable, reachable) findings while tracking the rest as
      advisory restores signal and sustainable adoption.
    ref: "concepts.md#security-gates-vs-advisory-findings--breaking-the-build"

  - id: devsecops-and-pipeline-security-045
    difficulty: intermediate
    tags: [iac-scanning, timing, terraform]
    question: |
      When should IaC scanning ideally run relative to `terraform apply`?
    options:
      - "After apply, so it can scan the live resources"
      - "On the code/plan in the PR, before apply, so misconfigurations are caught before resources exist"
      - "Only during the monthly audit"
      - "Never — runtime admission control replaces it"
    answer: 1
    explanation: |
      Scanning the IaC code or the plan in the PR catches issues (open security groups, public
      buckets) before `apply` creates the resources — free to fix in review. Post-apply, the misconfig
      already exists and may already be exploited.
    ref: "concepts.md#iac-scanning--terraform-cloudformation-kubernetes-manifests"

  - id: devsecops-and-pipeline-security-046
    difficulty: advanced
    tags: [pipeline-security, threat-model, culture]
    question: |
      Why is the CI/CD system itself often described as one of the highest-value targets in the SDLC?
    options:
      - "It stores the most log data"
      - "It is the slowest component to patch"
      - "It can deploy to production and holds every credential, so owning it lets an attacker bypass all downstream code scanning"
      - "It is the only system exposed to the public internet"
    answer: 2
    explanation: |
      The pipeline can push to prod and holds the credentials, and it runs arbitrary code. An attacker
      who controls it can deploy malicious artifacts regardless of how well the application code was
      scanned — so pipeline integrity is foundational.
    ref: "concepts.md#protecting-the-pipeline-itself--ppe-dependency-confusion-runners"

  - id: devsecops-and-pipeline-security-047
    difficulty: intermediate
    tags: [oidc, environment-protection, least-privilege]
    question: |
      Beyond OIDC, which practice further restricts which CI job may assume a production role?
    options:
      - "Increasing the token TTL to 24 hours"
      - "Using environment protection rules so only the designated prod job/environment can assume the prod role, and pinning the trust to that ref/environment"
      - "Sharing one broad role across all jobs for simplicity"
      - "Storing the role ARN as a plaintext secret"
    answer: 1
    explanation: |
      Environment protection rules plus a trust policy pinned to the specific repo and
      ref/environment ensure only the intended prod deploy job can assume the prod role — enforcing
      least privilege beyond just using short-lived OIDC credentials.
    ref: "concepts.md#least-privilege-for-ci--oidc-vs-long-lived-keys"

  - id: devsecops-and-pipeline-security-048
    difficulty: beginner
    tags: [dast, iast, comparison]
    question: |
      Which tool typically has the LOWEST false-positive rate because it confirms issues against a
      running application?
    options:
      - "SAST"
      - "Secret scanning on history"
      - "License scanning"
      - "DAST"
    answer: 3
    explanation: |
      DAST attacks the running application and observes real responses, so a reported issue is
      generally exploitable — giving it low false positives compared with SAST's pattern-based,
      context-free analysis.
    ref: "concepts.md#dast-and-iast--testing-the-running-application"

  - id: devsecops-and-pipeline-security-049
    difficulty: intermediate
    tags: [secret-scanning, entropy]
    question: |
      Besides fixed provider patterns (e.g. AWS `AKIA` keys), how do secret scanners catch unknown
      credential formats?
    options:
      - "By decrypting the repository"
      - "By running the application and watching network calls"
      - "By entropy analysis — flagging high-randomness strings that resemble keys/tokens"
      - "By checking file modification timestamps"
    answer: 2
    explanation: |
      Secret scanners combine provider-specific regexes with entropy analysis: high-randomness strings
      statistically resemble generated keys/tokens, letting the scanner flag secrets that don't match
      a known fixed pattern.
    ref: "concepts.md#secret-scanning--pre-commit-and-ci"

  - id: devsecops-and-pipeline-security-050
    difficulty: advanced
    tags: [image-scanning, admission, defense-in-depth]
    question: |
      A team scans images in CI but attackers sometimes deploy unscanned images directly. Which
      additional control enforces "only scanned/signed images run"?
    options:
      - "A faster CI pipeline"
      - "A larger container registry"
      - "Longer image retention in the registry"
      - "A Kubernetes admission controller that blocks unsigned/unscanned images at deploy time"
    answer: 3
    explanation: |
      CI scanning alone doesn't stop out-of-band deploys. An admission controller can reject images
      that aren't signed or haven't passed scanning, enforcing the policy at the cluster boundary as
      defense in depth alongside CI and registry scanning.
    ref: "concepts.md#container-image-scanning--trivy-grype"
