topic: "Git & Branching Strategies"
domain: devops-cicd
topic_slug: git-and-branching-strategies
version: 1
questions:
  - id: git-and-branching-strategies-001
    difficulty: beginner
    tags: [git-internals, commits, snapshots]
    question: |
      How does a Git commit store the state of your project?
    options:
      - "As a diff (patch) against its parent commit"
      - "As a compressed copy of only the files that changed, with no reference to unchanged files"
      - "As a full snapshot of the tree, referencing blobs (deduplicated by content hash)"
      - "As a list of line-level edits applied to the previous commit"
    answer: 2
    explanation: |
      A commit points at a root tree that represents a full snapshot; unchanged files reuse the
      same blob objects because Git is content-addressable (identical content hashes identically).
      Diffs are computed on demand by comparing two trees — they are not what a commit stores.
    ref: "concepts.md#gits-object-model-commits-refs-and-head"

  - id: git-and-branching-strategies-002
    difficulty: beginner
    tags: [git-internals, branches, refs]
    question: |
      What, concretely, is a Git branch?
    options:
      - "A movable pointer (ref) to a single commit"
      - "A full copy of the repository at a point in time"
      - "A snapshot of the working tree stored in the index"
      - "A separate remote server that mirrors main"
    answer: 0
    explanation: |
      A branch is just a tiny file under .git/refs/heads/ containing a commit SHA — a movable
      pointer. That is why creating a branch is O(1) and Git branching is considered "cheap."
    ref: "concepts.md#gits-object-model-commits-refs-and-head"

  - id: git-and-branching-strategies-003
    difficulty: intermediate
    tags: [git-internals, head, detached-head]
    question: |
      You run `git checkout <sha>` (a commit, not a branch), make two commits, then
      `git checkout main`. What happens to those two commits?
    options:
      - "They are automatically merged into main"
      - "They become a new branch named after the SHA"
      - "They are on no branch (detached HEAD) and can be lost/garbage-collected once HEAD moves"
      - "Git refuses to let you leave until you name them"
    answer: 2
    explanation: |
      Checking out a raw commit detaches HEAD. Commits made there belong to no branch; once HEAD
      moves away they become unreferenced (recoverable via reflog for a while, then GC'd). You'd
      keep them with `git branch <name> <sha>` before switching.
    ref: "concepts.md#gits-object-model-commits-refs-and-head"

  - id: git-and-branching-strategies-004
    difficulty: beginner
    tags: [git-internals, object-model]
    question: |
      In Git's object model, which object type actually stores filenames (the directory listing)?
    options:
      - "blob"
      - "commit"
      - "tag"
      - "tree"
    answer: 3
    explanation: |
      A blob holds raw file content with no name. The tree object maps names to blobs and subtrees
      — that is where filenames and directory structure live. The commit points at one root tree.
    ref: "concepts.md#gits-object-model-commits-refs-and-head"

  - id: git-and-branching-strategies-005
    difficulty: intermediate
    tags: [staging, index, reset]
    question: |
      You staged a file with `git add` but decided not to include it in the next commit. Which
      command unstages it while leaving your edits on disk intact?
    options:
      - "git checkout -- <file>"
      - "git reset HEAD <file>  (a.k.a. git restore --staged <file>)"
      - "git reset --hard"
      - "git stash drop"
    answer: 1
    explanation: |
      Unstaging means copying HEAD's version back into the index without touching the working tree
      — `git reset HEAD <file>` / `git restore --staged`. `git checkout -- <file>` would discard
      your working-tree edits, and `reset --hard` would blow away everything.
    ref: "concepts.md#the-three-areas-working-tree-index-staging-and-repository"

  - id: git-and-branching-strategies-006
    difficulty: intermediate
    tags: [reset, working-tree, index]
    question: |
      What is the difference between `git reset --soft HEAD~1` and `git reset --hard HEAD~1`?
    options:
      - "There is no difference; --hard is just an alias"
      - "--soft discards the working tree; --hard keeps it"
      - "--soft creates a new commit; --hard deletes the repository"
      - "--soft moves the branch pointer back but leaves index and working tree unchanged; --hard also resets index and working tree to the target"
    answer: 3
    explanation: |
      `--soft` only moves the branch pointer (your changes stay staged). `--mixed` (default) also
      resets the index. `--hard` resets the branch pointer, index, AND working tree — destroying
      uncommitted changes. Knowing which areas each touches is the whole trick.
    ref: "concepts.md#the-three-areas-working-tree-index-staging-and-repository"

  - id: git-and-branching-strategies-007
    difficulty: beginner
    tags: [merge, fast-forward]
    question: |
      Under what condition can Git perform a fast-forward merge of `feature` into `main`?
    options:
      - "Only when `main` has not diverged — its tip is an ancestor of `feature` — so the pointer can just move forward"
      - "Whenever both branches have new commits"
      - "Only when there are merge conflicts to resolve"
      - "Only when you pass --no-ff"
    answer: 0
    explanation: |
      A fast-forward is possible only when main hasn't advanced since feature branched off, so
      main's tip is an ancestor of feature's tip. Git simply advances the main pointer; no merge
      commit is created and history stays linear.
    ref: "concepts.md#fast-forward-vs-three-way-merge"

  - id: git-and-branching-strategies-008
    difficulty: intermediate
    tags: [merge, no-ff, auditability]
    question: |
      A team wants every merged feature to appear as one visible, easily-revertable unit on `main`,
      even when a fast-forward would be possible. What should they use?
    options:
      - "git merge --ff-only"
      - "git merge --no-ff"
      - "git rebase main"
      - "git cherry-pick"
    answer: 1
    explanation: |
      `--no-ff` forces a merge commit even when a fast-forward is possible, so each feature is a
      distinct join in history that can be reverted as a unit. `--ff-only` does the opposite
      (refuses anything but a fast-forward).
    ref: "concepts.md#fast-forward-vs-three-way-merge"

  - id: git-and-branching-strategies-009
    difficulty: intermediate
    tags: [merge, three-way, merge-base]
    question: |
      What three inputs does Git use to compute a standard (three-way) merge?
    options:
      - "The two branch tips only"
      - "The reflog, the index, and the stash"
      - "The two branch tips plus their merge base (common ancestor)"
      - "HEAD, the remote, and the working tree"
    answer: 2
    explanation: |
      A three-way merge compares the two branch tips against their nearest common ancestor (the
      merge base) to decide what each side changed and combine them, recording a merge commit with
      two parents when the branches diverged.
    ref: "concepts.md#fast-forward-vs-three-way-merge"

  - id: git-and-branching-strategies-010
    difficulty: intermediate
    tags: [rebase, merge, history]
    question: |
      What does `git rebase main` (run while on `feature`) do to your feature commits?
    options:
      - "Merges main into feature and creates a merge commit"
      - "Deletes feature's commits and resets to main"
      - "Pushes feature to the remote main branch"
      - "Replays feature's commits on top of main's tip as new commits with new hashes, producing linear history"
    answer: 3
    explanation: |
      Rebase reapplies each of feature's commits onto the current main tip, creating brand-new
      commit objects (new SHAs) and a linear history — as if you had started your work from the
      latest main. The original commits are abandoned (recoverable via reflog).
    ref: "concepts.md#merge-vs-rebase"

  - id: git-and-branching-strategies-011
    difficulty: advanced
    tags: [rebase, golden-rule, shared-history]
    question: |
      Why is the "golden rule of rebasing" — never rebase commits others have already pulled —
      so important?
    options:
      - "Rebasing rewrites commit hashes, so collaborators who based work on the old commits get divergent history and painful conflicts"
      - "Rebasing deletes the remote repository"
      - "Rebasing is slower than merging"
      - "Rebasing cannot be undone under any circumstance"
    answer: 0
    explanation: |
      Because rebase creates new commit objects with new hashes, anyone who already has the old
      commits now has a fork of history. Their next pull/push diverges and conflicts. Rewrite only
      private (unpushed) history; use merge/revert for shared branches.
    ref: "concepts.md#merge-vs-rebase"

  - id: git-and-branching-strategies-012
    difficulty: intermediate
    tags: [cherry-pick, backport]
    question: |
      What does `git cherry-pick <sha>` do?
    options:
      - "Merges the entire branch containing that commit"
      - "Moves the branch pointer to that commit"
      - "Applies the diff introduced by that single commit onto the current branch as a new commit"
      - "Reverts that commit everywhere it appears"
    answer: 2
    explanation: |
      Cherry-pick takes the change introduced by one commit and reapplies it on your current branch
      as a new commit (new hash). It's ideal for backporting a specific fix (e.g., onto a release
      branch) without merging the whole source branch.
    ref: "concepts.md#cherry-pick"

  - id: git-and-branching-strategies-013
    difficulty: advanced
    tags: [cherry-pick, dependencies, gotcha]
    question: |
      A developer cherry-picks a bug-fix commit onto a release branch but it fails to apply
      cleanly. What is the most likely reason?
    options:
      - "Cherry-pick requires the target branch to be empty"
      - "The fix depends on an earlier commit that was not also picked, so the context differs"
      - "Cherry-pick only works within the same branch"
      - "Cherry-pick cannot create new commits"
    answer: 1
    explanation: |
      Cherry-pick applies only that commit's diff, not its ancestors. If the fix relies on code
      introduced by an earlier commit that isn't present on the release branch, the context won't
      match and you get conflicts. You'd need to pick the prerequisite commit too.
    ref: "concepts.md#cherry-pick"

  - id: git-and-branching-strategies-014
    difficulty: intermediate
    tags: [revert, reset, shared-branch]
    question: |
      A bad commit was already pushed to the shared `main` branch. What is the safe way to undo it?
    options:
      - "git reset --hard HEAD~1 and force-push"
      - "Delete and recreate main"
      - "git stash the commit"
      - "git revert <sha>, which adds a new commit applying the inverse change"
    answer: 3
    explanation: |
      `git revert` creates a new forward commit that undoes the change, preserving history — safe
      on a shared branch. `git reset` rewrites history and, combined with force-push, would clobber
      collaborators who already pulled the commit.
    ref: "concepts.md#reset-vs-revert-undoing-changes-safely"

  - id: git-and-branching-strategies-015
    difficulty: beginner
    tags: [revert, reset]
    question: |
      Which statement about `git revert` vs `git reset` is correct?
    options:
      - "revert moves history forward with an inverse commit; reset moves the branch pointer backward, rewriting history"
      - "Both rewrite history identically"
      - "revert is destructive; reset is non-destructive"
      - "reset is only for tags; revert is only for branches"
    answer: 0
    explanation: |
      revert = forward-moving inverse commit (history preserved, safe on shared branches). reset =
      move the branch pointer backward, dropping later commits (rewrites history; safe only on
      local/unpushed work).
    ref: "concepts.md#reset-vs-revert-undoing-changes-safely"

  - id: git-and-branching-strategies-016
    difficulty: advanced
    tags: [force-push, force-with-lease, safety]
    question: |
      You cleaned up your local branch with rebase and must update the remote. Why prefer
      `git push --force-with-lease` over `git push --force`?
    options:
      - "--force-with-lease is faster"
      - "--force-with-lease skips CI checks"
      - "--force-with-lease refuses to overwrite the remote if someone else pushed commits you haven't seen, preventing you from clobbering their work"
      - "There is no difference"
    answer: 2
    explanation: |
      `--force-with-lease` only overwrites the remote branch if its tip is still what you last saw;
      if a teammate pushed in the meantime it aborts. Bare `--force` overwrites unconditionally and
      can silently destroy others' commits.
    ref: "concepts.md#reset-vs-revert-undoing-changes-safely"

  - id: git-and-branching-strategies-017
    difficulty: beginner
    tags: [stash]
    question: |
      What does `git stash` do?
    options:
      - "Permanently deletes your uncommitted changes"
      - "Shelves uncommitted (working-tree and staged) changes onto a stack and restores a clean working tree"
      - "Creates a new commit on main"
      - "Pushes your changes to the remote"
    answer: 1
    explanation: |
      Stash saves your uncommitted changes onto a local stack and reverts the working tree to HEAD,
      letting you switch context (e.g., an urgent hotfix) without committing half-done work. Restore
      with `git stash pop` (reapply + drop) or `apply` (reapply + keep).
    ref: "concepts.md#stash"

  - id: git-and-branching-strategies-018
    difficulty: intermediate
    tags: [reflog, recovery]
    question: |
      A developer ran `git reset --hard` and lost several commits. What is the standard way to
      recover them?
    options:
      - "Reclone the repository from the remote"
      - "The commits are permanently gone immediately"
      - "Run git fsck --delete"
      - "Use `git reflog` to find the pre-reset SHA, then reset/branch to it"
    answer: 3
    explanation: |
      The reflog records every movement of HEAD/branch tips locally, so the commits are still
      referenced (and thus not yet garbage-collected). Find the SHA from before the reset in
      `git reflog` and `git reset --hard <sha>` or `git branch recover <sha>`.
    ref: "concepts.md#reflog-the-safety-net"

  - id: git-and-branching-strategies-019
    difficulty: intermediate
    tags: [reflog, local]
    question: |
      Which statement about the reflog is TRUE?
    options:
      - "It is a local-only log of HEAD/ref movements and entries expire (defaults ~90/30 days)"
      - "It is shared with everyone when they clone the repo"
      - "It permanently stores every commit forever"
      - "It records changes on the remote server"
    answer: 0
    explanation: |
      The reflog is local to your clone, not transferred on clone/fetch, and its entries expire
      (default 90 days for reachable, 30 for unreachable). It's a personal safety net for recovering
      from resets/rebases, not a shared history.
    ref: "concepts.md#reflog-the-safety-net"

  - id: git-and-branching-strategies-020
    difficulty: intermediate
    tags: [merge-conflicts, semantic-conflict]
    question: |
      A merge completes with no textual conflicts, but the application now behaves incorrectly.
      What kind of problem is this and what catches it?
    options:
      - "A textual conflict; Git catches it automatically"
      - "A fast-forward error; the merge base is wrong"
      - "A semantic conflict; Git cannot detect it — only tests catch it"
      - "A reflog corruption; run git gc"
    answer: 2
    explanation: |
      A semantic (logical) conflict is when both sides merge cleanly at the text level but the
      combined behavior is wrong (e.g., one side renamed a function the other still calls in a way
      Git can't see). Git only detects textual overlaps; automated tests are what catch semantic
      breakage — a core argument for integrating frequently.
    ref: "concepts.md#merge-conflicts"

  - id: git-and-branching-strategies-021
    difficulty: intermediate
    tags: [merge-conflicts, rerere, tooling]
    question: |
      What does enabling Git's `rerere` (reuse recorded resolution) feature do?
    options:
      - "It disables merge conflicts entirely"
      - "It rebases automatically on every pull"
      - "It signs your commits"
      - "It records how you resolved a conflict and replays that resolution automatically if the same conflict recurs"
    answer: 3
    explanation: |
      rerere remembers your conflict resolutions and re-applies them when the identical conflict
      shows up again — especially useful across repeated rebases of a long-lived branch, where the
      same conflicts keep reappearing.
    ref: "concepts.md#merge-conflicts"

  - id: git-and-branching-strategies-022
    difficulty: advanced
    tags: [merge-conflicts, batch-size, integration]
    question: |
      Two teams merge to `main` daily and rarely conflict; another team merges a 3-week branch and
      hits "merge hell." What is the underlying principle?
    options:
      - "Conflict likelihood is random and unrelated to branch age"
      - "Conflict risk scales with how long and how far branches diverge; frequent small merges are the cheapest conflict-avoidance"
      - "Larger teams always conflict more regardless of merge frequency"
      - "Conflicts only happen when using rebase"
    answer: 1
    explanation: |
      Divergence is the driver: the longer a branch lives, the more both sides change the same code
      and the harder the eventual reconciliation. Short-lived branches and frequent integration keep
      diffs small and conflicts rare — a foundational CI argument.
    ref: "concepts.md#merge-conflicts"

  - id: git-and-branching-strategies-023
    difficulty: intermediate
    tags: [git-flow, branching-model]
    question: |
      In Git Flow, where does a `hotfix/*` branch start, and where does it merge back?
    options:
      - "Starts from main (production); merges to both main and develop"
      - "Starts from develop; merges only to develop"
      - "Starts from a feature branch; merges to release"
      - "Starts from main; merges only to main"
    answer: 0
    explanation: |
      Hotfixes patch production, so they branch off main and, when done, merge back into both main
      (to release the fix) and develop (so the next release also contains it). Forgetting the merge
      back to develop is a classic Git Flow bug.
    ref: "concepts.md#git-flow"

  - id: git-and-branching-strategies-024
    difficulty: intermediate
    tags: [git-flow, when-to-use]
    question: |
      For which kind of software is Git Flow's `develop`/`release`/`hotfix` structure the best fit?
    options:
      - "A web service deployed continuously many times a day"
      - "A one-developer prototype with no releases"
      - "Any project regardless of release cadence"
      - "Software with explicit, versioned releases and multiple maintained versions (mobile, desktop, on-prem, libraries)"
    answer: 3
    explanation: |
      Git Flow's release-management branches earn their keep when you ship discrete versioned
      releases to users who don't auto-update and you support several versions at once. For a
      continuously deployed web service, the develop/release ceremony delays integration for little
      benefit.
    ref: "concepts.md#git-flow"

  - id: git-and-branching-strategies-025
    difficulty: intermediate
    tags: [git-flow, anti-ci]
    question: |
      Why is Git Flow often considered hostile to continuous integration?
    options:
      - "It forbids automated tests"
      - "It doesn't allow pull requests"
      - "Its multiple long-lived branches and develop->release->main promotion chain delay integration and breed conflicts"
      - "It requires a monorepo"
    answer: 2
    explanation: |
      CI means integrating frequently into a shared trunk. Git Flow's long-lived develop and release
      branches plus its promotion chain hold work apart for longer, so integration and conflict
      discovery are deferred — the opposite of what CI rewards.
    ref: "concepts.md#git-flow"

  - id: git-and-branching-strategies-026
    difficulty: beginner
    tags: [github-flow, branching-model]
    question: |
      Which best describes GitHub Flow?
    options:
      - "main + develop + release + hotfix long-lived branches"
      - "main is always deployable; create a short-lived branch, open a PR, merge after review + green checks, then deploy — no develop/release branches"
      - "Everyone commits directly to main with no review ever"
      - "One branch per environment that code flows through"
    answer: 1
    explanation: |
      GitHub Flow is deliberately minimal: keep main deployable, branch short-lived off main, review
      via PR with CI checks, merge, and deploy. There is no develop or release branch — it suits web
      apps with a single continuously deployed production version.
    ref: "concepts.md#github-flow"

  - id: git-and-branching-strategies-027
    difficulty: intermediate
    tags: [gitlab-flow, environment-branches]
    question: |
      What does GitLab Flow add on top of GitHub Flow's simplicity?
    options:
      - "Long-lived environment (or release) branches — e.g. code flows main -> staging -> production — to model promotion"
      - "A mandatory develop branch like Git Flow"
      - "A ban on pull/merge requests"
      - "Automatic rebasing of all branches nightly"
    answer: 0
    explanation: |
      GitLab Flow keeps short branches + MRs but introduces environment branches so that code flows
      downstream (main -> pre-prod -> production) and each branch reflects what's deployed there. It
      fits teams that can't push main straight to production or must support released versions.
    ref: "concepts.md#gitlab-flow"

  - id: git-and-branching-strategies-028
    difficulty: intermediate
    tags: [gitlab-flow, promotion-direction]
    question: |
      In GitLab Flow's environment-branch model, if an urgent fix is needed in `production`, what is
      the recommended flow?
    options:
      - "Commit directly to production and never merge it anywhere else"
      - "Make the fix upstream (e.g. on main) then cherry-pick it downstream to the production branch"
      - "Delete the production branch and recreate it"
      - "Make the fix on production then merge production back up to main"
    answer: 1
    explanation: |
      GitLab Flow keeps changes flowing one direction (upstream -> downstream). Fixes are made
      upstream (main) so they aren't lost, then cherry-picked into the downstream environment/release
      branch for urgency. Committing only to the downstream branch would drop the fix from future
      releases.
    ref: "concepts.md#gitlab-flow"

  - id: git-and-branching-strategies-029
    difficulty: beginner
    tags: [trunk-based-development, dora]
    question: |
      What is Trunk-Based Development (TBD)?
    options:
      - "A model with many long-lived branches merged quarterly"
      - "A model where main is never deployed"
      - "Everyone integrates into a single shared trunk frequently (at least daily); branches, if used, are short-lived (< a day)"
      - "A rule that only one person may commit per day"
    answer: 2
    explanation: |
      TBD centers on a single trunk into which everyone integrates at least daily. Branches, if used,
      live hours to a day. Maximizing integration frequency shrinks batches and conflicts — the CI-
      native model DORA research associates with high delivery performance.
    ref: "concepts.md#trunk-based-development-the-ci-native-model"

  - id: git-and-branching-strategies-030
    difficulty: intermediate
    tags: [trunk-based-development, dora, four-keys]
    question: |
      According to DORA/Accelerate, why does trunk-based development predict higher delivery
      performance?
    options:
      - "It removes the need for any testing"
      - "It lets teams skip code review"
      - "Frequent integration means small batches, fewer conflicts, lower change-failure rate, and faster lead time"
      - "It requires fewer engineers"
    answer: 2
    explanation: |
      DORA found TBD is a statistically significant predictor of performance across the four keys.
      Integrating continuously keeps change size small, which reduces conflicts and change-failure
      rate and shortens lead time for changes. Teams do best with few active branches merged in under
      a day and no long code freezes.
    ref: "concepts.md#trunk-based-development-the-ci-native-model"

  - id: git-and-branching-strategies-031
    difficulty: advanced
    tags: [trunk-based-development, prerequisites]
    question: |
      A team switches to committing to trunk daily but has almost no automated tests and slow CI.
      What is the likely outcome?
    options:
      - "Breakage spreads faster because TBD depends on strong automated tests and fast CI feedback on every commit"
      - "Delivery performance improves automatically because TBD is always better"
      - "Nothing changes; tests are irrelevant to TBD"
      - "The repository becomes corrupted"
    answer: 0
    explanation: |
      TBD and CI are a package deal. Without a reliable test suite and fast pipeline feedback,
      integrating to a shared trunk daily just propagates breakage to everyone quickly. The safety
      of TBD comes from catching regressions automatically on each commit.
    ref: "concepts.md#trunk-based-development-the-ci-native-model"

  - id: git-and-branching-strategies-032
    difficulty: advanced
    tags: [dora, branching, metrics]
    question: |
      Accelerate/DORA guidance on branching for high performers includes which of the following?
    options:
      - "Maintain at least ten active long-lived branches"
      - "Freeze code for a week before every release"
      - "Never use branches under any circumstances"
      - "Keep active branches few (typically < 3), merge branches in less than a day, and avoid long code freezes / integration phases"
    answer: 3
    explanation: |
      DORA's research links high performance to fewer than three active branches, branch lifetimes
      under a day, and the absence of code freezes and big-bang integration phases — all forms of
      keeping integration continuous.
    ref: "concepts.md#trunk-based-development-the-ci-native-model"

  - id: git-and-branching-strategies-033
    difficulty: intermediate
    tags: [feature-flags, deploy-vs-release]
    question: |
      How do feature flags let a team merge unfinished work to trunk safely?
    options:
      - "They wrap new behavior in a runtime toggle so incomplete/risky code ships dark and is enabled selectively, decoupling deploy from release"
      - "They delete unfinished code before deploy"
      - "They prevent the code from being compiled"
      - "They automatically create a long-lived branch"
    answer: 0
    explanation: |
      A feature flag gates new behavior behind a runtime condition, so code can be merged and
      deployed while switched off, then enabled per environment/user or gradually. This decouples
      deploy (shipping the binary) from release (flipping the flag) and enables instant rollback
      without redeploying.
    ref: "concepts.md#feature-flags-and-branch-by-abstraction"

  - id: git-and-branching-strategies-034
    difficulty: advanced
    tags: [branch-by-abstraction, refactor]
    question: |
      What is "branch by abstraction"?
    options:
      - "Creating one Git branch per abstraction layer"
      - "A way to auto-resolve merge conflicts"
      - "Introducing an abstraction over the code you're changing, building the new implementation behind it incrementally on trunk, then switching over and removing the old path"
      - "A Git command that abstracts branch names"
    answer: 2
    explanation: |
      Branch by abstraction is a code technique (not a Git branch) for doing large changes on trunk:
      add an abstraction layer, incrementally build the replacement behind it in small merged steps,
      flip to the new implementation, then delete the old one — avoiding a long-lived branch.
    ref: "concepts.md#feature-flags-and-branch-by-abstraction"

  - id: git-and-branching-strategies-035
    difficulty: advanced
    tags: [feature-flags, tech-debt, lifecycle]
    question: |
      What is the main ongoing cost of relying heavily on feature flags?
    options:
      - "Flag lifecycle management — stale flags become dead conditional code and multiply test combinations, so they must be tracked and retired"
      - "They make deploys impossible"
      - "They require rebasing every commit"
      - "They break semantic versioning"
    answer: 0
    explanation: |
      Feature flags are the enabler for TBD at scale, but each flag adds branching in the code and a
      new dimension of test combinations. Unretired flags accumulate as dead code and complexity, so
      mature teams actively track and remove stale flags.
    ref: "concepts.md#feature-flags-and-branch-by-abstraction"

  - id: git-and-branching-strategies-036
    difficulty: intermediate
    tags: [long-lived-branches, ci, integration]
    question: |
      Which is a direct consequence of keeping a feature branch alive for several weeks under CI?
    options:
      - "Faster feedback because CI runs less often"
      - "The branch automatically stays in sync with main"
      - "Change-failure rate always drops"
      - "Integration is delayed, so conflicts and semantic breakage are discovered late in one large batch"
    answer: 3
    explanation: |
      A long-lived branch is un-integrated work by definition. CI can't tell you the code integrates
      until it's on the shared branch, so you find conflicts and semantic issues all at once at merge
      time (big-bang integration), against a main that has moved underneath you.
    ref: "concepts.md#why-long-lived-branches-hurt-ci"

  - id: git-and-branching-strategies-037
    difficulty: intermediate
    tags: [long-lived-branches, change-failure-rate]
    question: |
      Why are small, frequent merges generally safer than one big merge, in DORA terms?
    options:
      - "Big merges are always blocked by Git"
      - "Large diffs are harder to review and more likely to cause a change failure; small changes lower change-failure rate and are easier to review"
      - "Small merges skip CI"
      - "Frequency has no effect on failure rate"
    answer: 1
    explanation: |
      Batch size drives risk. A huge diff is hard to review thoroughly and more likely to introduce a
      failure; many small merges are each easy to reason about and revert, which correlates with a
      lower change-failure rate — one of the four DORA keys.
    ref: "concepts.md#why-long-lived-branches-hurt-ci"

  - id: git-and-branching-strategies-038
    difficulty: beginner
    tags: [pull-request, review-flow]
    question: |
      In a typical PR/MR workflow, when does CI usually run automatically?
    options:
      - "Only after merging to main"
      - "Only once per week on a schedule"
      - "On the PR/MR when the branch is pushed/updated, so results become required status checks before merge"
      - "Never; CI is manual"
    answer: 2
    explanation: |
      CI is triggered on the pull/merge request (on push and updates), running build, tests, lint,
      and scans. Those job results become the required status checks that must be green before the
      branch can be merged.
    ref: "concepts.md#pullmerge-request-review-flow"

  - id: git-and-branching-strategies-039
    difficulty: intermediate
    tags: [merge-strategies, squash]
    question: |
      What does "Squash and merge" do when landing a PR?
    options:
      - "Collapses all of the branch's commits into a single commit on main"
      - "Keeps every branch commit plus a merge commit"
      - "Rebases main onto the branch"
      - "Deletes main history"
    answer: 0
    explanation: |
      Squash-and-merge combines the branch's commits into one commit on main, giving a clean linear
      history with one revertable unit per PR (at the cost of losing intermediate commits). It pairs
      well with trunk-based development's messy short-lived branches.
    ref: "concepts.md#pullmerge-request-review-flow"

  - id: git-and-branching-strategies-040
    difficulty: intermediate
    tags: [merge-strategies, comparison]
    question: |
      Which describes "Rebase and merge" (as offered by PR platforms)?
    options:
      - "Creates a merge commit with two parents"
      - "Squashes everything into one commit"
      - "Reverts the branch"
      - "Replays the branch's commits onto main with no merge commit, keeping individual commits but with new hashes"
    answer: 3
    explanation: |
      Rebase-and-merge reapplies each branch commit on top of main so history stays linear with no
      merge commit; the individual commits are preserved but get new SHAs. It differs from squash
      (one commit) and merge-commit (preserves branch shape with a join).
    ref: "concepts.md#pullmerge-request-review-flow"

  - id: git-and-branching-strategies-041
    difficulty: intermediate
    tags: [branch-protection, required-checks]
    question: |
      Which set of controls best keeps `main` always deployable?
    options:
      - "Allow direct pushes and skip CI to move faster"
      - "Require PRs (no direct push), require green status checks up-to-date with base, and require reviews/approvals"
      - "Only require signed commits"
      - "Only run CI nightly on main"
    answer: 1
    explanation: |
      Branch protection enforces the gate at merge time: no direct pushes, CI checks must pass (often
      with "require branches up to date" so the check ran against current main), and required reviews
      (optionally from CODEOWNERS). That's the standard answer to "how do you keep main deployable?"
    ref: "concepts.md#protecting-main-branch-protection--required-checks"

  - id: git-and-branching-strategies-042
    difficulty: advanced
    tags: [merge-queue, ci, race]
    question: |
      Two PRs each pass CI independently against `main`, but combining them breaks the build. Which
      mechanism prevents this from landing on `main`?
    options:
      - "Requiring more reviewers"
      - "Squash merging"
      - "A merge queue / merge train that serializes merges and re-runs CI on the prospective combined result before landing"
      - "Signed commits"
    answer: 2
    explanation: |
      "Passed against main independently" doesn't guarantee they pass together (a semantic race). A
      merge queue (GitHub) / merge train (GitLab) / Bors/Zuul serializes merges and tests the combined
      result before it lands, keeping main green under high merge volume.
    ref: "concepts.md#protecting-main-branch-protection--required-checks"

  - id: git-and-branching-strategies-043
    difficulty: intermediate
    tags: [branch-protection, up-to-date]
    question: |
      Why do teams often enable "require branches to be up to date before merging" alongside required
      status checks?
    options:
      - "So the required checks ran against the current state of main, reducing the chance that a stale branch passes but breaks main"
      - "To make CI run slower on purpose"
      - "To force everyone to use rebase"
      - "To disable code review"
    answer: 0
    explanation: |
      Requiring the branch to be up to date means CI evaluated the branch merged with the latest
      main, not an old snapshot. It reduces (though a merge queue more fully prevents) the case where
      a stale-but-green branch breaks main once combined with newer changes.
    ref: "concepts.md#protecting-main-branch-protection--required-checks"

  - id: git-and-branching-strategies-044
    difficulty: beginner
    tags: [semver, versioning]
    question: |
      Under Semantic Versioning, which part of `MAJOR.MINOR.PATCH` do you bump for a backward-
      compatible bug fix?
    options:
      - "MAJOR"
      - "MINOR"
      - "PATCH"
      - "You must bump all three"
    answer: 2
    explanation: |
      PATCH is for backward-compatible bug fixes, MINOR for backward-compatible new functionality,
      and MAJOR for incompatible/breaking API changes. The version is a compatibility contract for
      consumers and dependency resolvers.
    ref: "concepts.md#semantic-versioning-semver"

  - id: git-and-branching-strategies-045
    difficulty: intermediate
    tags: [semver, breaking-change]
    question: |
      A library adds a new optional method (no existing behavior changes) and also removes a
      deprecated public method. What is the correct SemVer bump?
    options:
      - "PATCH, because it's a small change"
      - "MINOR, because a method was added"
      - "No bump is needed"
      - "MAJOR, because removing a public method is a breaking (incompatible) change"
    answer: 3
    explanation: |
      SemVer keys off compatibility, not effort. Removing a public method breaks consumers relying on
      it, which is an incompatible API change and therefore a MAJOR bump — even though another part of
      the change (adding a method) would only be MINOR. The highest-impact change wins.
    ref: "concepts.md#semantic-versioning-semver"

  - id: git-and-branching-strategies-046
    difficulty: intermediate
    tags: [conventional-commits, automation]
    question: |
      In Conventional Commits, a commit `feat!: remove legacy config loader` (with the `!`) signals
      which SemVer bump to release tooling?
    options:
      - "PATCH"
      - "MAJOR (breaking change)"
      - "MINOR"
      - "No change"
    answer: 1
    explanation: |
      A `!` after the type (or a `BREAKING CHANGE:` footer) marks a breaking change, which tools like
      semantic-release map to a MAJOR bump. Plain `feat` maps to MINOR and `fix` to PATCH.
    ref: "concepts.md#conventional-commits--automated-releases"

  - id: git-and-branching-strategies-047
    difficulty: intermediate
    tags: [conventional-commits, semantic-release]
    question: |
      What problem do Conventional Commits + tools like semantic-release solve in a delivery pipeline?
    options:
      - "They let tooling parse commit intent to automatically compute the next SemVer number, generate a changelog, tag, and publish — no human guesses the version"
      - "They compile the code faster"
      - "They replace the need for tests"
      - "They enforce branch protection"
    answer: 0
    explanation: |
      Structured commit messages (feat/fix/feat!) let release tooling analyze history since the last
      tag, derive the correct version bump, produce a CHANGELOG, tag, and publish automatically —
      turning "cut a release" into a deterministic pipeline step.
    ref: "concepts.md#conventional-commits--automated-releases"

  - id: git-and-branching-strategies-048
    difficulty: intermediate
    tags: [monorepo, polyrepo, ci]
    question: |
      A team runs a large monorepo and CI is getting slow because every commit triggers building and
      testing everything. What is the standard fix?
    options:
      - "Split into hundreds of polyrepos immediately"
      - "Run CI only once a week"
      - "Use build tooling with change/affected-target detection so pipelines only build and test what the commit actually touched"
      - "Disable tests on the monorepo"
    answer: 2
    explanation: |
      Monorepos require affected-target detection (Bazel, Nx, Turborepo, Pants) so CI scopes work to
      the projects a change impacts. Without it, CI time scales with the whole repo. This is the
      characteristic CI challenge of monorepos.
    ref: "concepts.md#monorepo-vs-polyrepo"

  - id: git-and-branching-strategies-049
    difficulty: intermediate
    tags: [monorepo, polyrepo, tradeoffs]
    question: |
      Which is a genuine advantage of a monorepo over polyrepos?
    options:
      - "Smaller clone sizes"
      - "Simpler fine-grained per-project access control"
      - "Independent per-service versioning by default"
      - "Atomic cross-project commits and easy large-scale refactors across shared code"
    answer: 3
    explanation: |
      A monorepo lets one commit change multiple projects atomically and makes cross-cutting
      refactors and shared-code management easier. The other listed items (small clones, fine-grained
      access control, independent versioning) are actually strengths of the polyrepo approach.
    ref: "concepts.md#monorepo-vs-polyrepo"

  - id: git-and-branching-strategies-050
    difficulty: advanced
    tags: [polyrepo, dependency-drift]
    question: |
      An organization uses polyrepos (one repo per service). Which downside are they most likely to
      face?
    options:
      - "Being forced to test the entire codebase on every commit"
      - "Cross-cutting changes span many PRs and dependencies/versions drift between repos"
      - "Inability to give teams independent CI"
      - "Mandatory atomic commits across all services"
    answer: 1
    explanation: |
      Polyrepos give clear ownership and independent CI, but a change that touches many services
      requires coordinated PRs across repos, and shared libraries tend to drift to different versions
      across repos. Cross-repo coordination and dependency management is the polyrepo tax.
    ref: "concepts.md#monorepo-vs-polyrepo"

  - id: git-and-branching-strategies-051
    difficulty: beginner
    tags: [merge, ff-only, linear-history]
    question: |
      What does `git merge --ff-only` do if a fast-forward is NOT possible?
    options:
      - "Aborts with an error instead of creating a merge commit"
      - "Silently creates a merge commit"
      - "Rebases automatically"
      - "Deletes the branch"
    answer: 0
    explanation: |
      `--ff-only` only completes if the merge can be a fast-forward (keeping linear history); if the
      branches diverged it refuses and errors out rather than creating a merge commit. Teams use it
      to enforce linear history.
    ref: "concepts.md#fast-forward-vs-three-way-merge"

  - id: git-and-branching-strategies-052
    difficulty: advanced
    tags: [rebase, pull, workflow]
    question: |
      Why is `git pull --rebase` on your own not-yet-pushed local commits considered safe, while
      rebasing already-pushed shared commits is not?
    options:
      - "Because --rebase never changes any hashes"
      - "Because pull always merges instead of rebasing"
      - "Because it only affects the remote, not local history"
      - "Because only your local unpushed commits get rewritten onto the updated upstream; no one else has those commits yet, so no one's history diverges"
    answer: 3
    explanation: |
      `pull --rebase` replays your local, unpublished commits on top of the fetched upstream tip,
      giving linear history. Since those commits weren't shared, rewriting their hashes affects no
      one else. Rebasing commits others already pulled violates the golden rule.
    ref: "concepts.md#merge-vs-rebase"

  - id: git-and-branching-strategies-053
    difficulty: intermediate
    tags: [git-internals, tags, refs]
    question: |
      What is the difference between a branch and an annotated tag in Git?
    options:
      - "They are identical"
      - "A tag can point to multiple commits; a branch points to one"
      - "A branch is a movable pointer that advances with new commits; an annotated tag is a fixed, named pointer (its own object with metadata), typically used to mark a release"
      - "A branch stores file content; a tag stores diffs"
    answer: 2
    explanation: |
      Branches move as you commit; annotated tags are stable named pointers (stored as their own
      object with tagger/message) meant to mark specific points like release versions. This is why
      Git Flow tags each release commit on main.
    ref: "concepts.md#gits-object-model-commits-refs-and-head"
