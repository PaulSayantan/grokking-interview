topic: "Configuration Management (Ansible)"
domain: devops-cicd
topic_slug: configuration-management-ansible
version: 1
questions:
  - id: configuration-management-ansible-001
    difficulty: beginner
    tags: [terraform, provisioning, comparison]
    question: |
      How do Terraform and Ansible relate in a typical infrastructure workflow?
    options:
      - "They are direct competitors that do exactly the same job"
      - "Terraform provisions the infrastructure; Ansible configures the software on the hosts — they are complementary"
      - "Ansible provisions cloud VPCs and load balancers; Terraform installs packages on hosts"
      - "Both keep a central state file and cannot be used together"
    answer: 1
    explanation: |
      Terraform provisions infrastructure (VMs, networks, LBs) and keeps state to plan
      diffs. Ansible configures what runs inside existing hosts (packages, files,
      services). The common pairing runs terraform apply first, then ansible-playbook.
    ref: "concepts.md#configuration-management-vs-provisioning"

  - id: configuration-management-ansible-002
    difficulty: beginner
    tags: [agentless, ssh, model]
    question: |
      What does it mean that Ansible is "agentless"?
    options:
      - "It requires a lightweight agent daemon on every managed host"
      - "It only works on hosts running a special Ansible OS"
      - "There is no persistent agent on managed hosts; the control node connects over SSH (or WinRM)"
      - "It cannot manage remote machines, only localhost"
    answer: 2
    explanation: |
      Ansible installs no daemon on targets. A control node pushes configuration over SSH
      (WinRM for Windows); the only real requirement on a target is SSH access and usually
      Python. Nothing to install, patch, or secure on every node.
    ref: "concepts.md#the-ansible-execution-model-agentless-push-over-ssh"

  - id: configuration-management-ansible-003
    difficulty: beginner
    tags: [idempotency, core-concept]
    question: |
      What does "idempotent" mean for an Ansible playbook?
    options:
      - "Re-running it on a host already in the desired state makes no further changes"
      - "It can only be run once safely"
      - "It always reports every task as changed on every run"
      - "It rolls back all changes automatically when it finishes"
    answer: 0
    explanation: |
      Idempotency means applying the operation once or many times yields the same result.
      Ansible modules check actual vs declared state and only act on a diff, so a converged
      host shows no changes on re-runs. This makes it safe to re-run to correct drift.
    ref: "concepts.md#idempotency-and-desired-state-convergence"

  - id: configuration-management-ansible-004
    difficulty: beginner
    tags: [playbook, structure]
    question: |
      In Ansible, what is a playbook?
    options:
      - "A single shell command executed on one host"
      - "The central state file recording all managed resources"
      - "A binary agent installed on each managed node"
      - "A YAML file containing one or more plays that map host groups to ordered tasks"
    answer: 3
    explanation: |
      A playbook is the YAML file you run with ansible-playbook. It holds plays; each play
      binds a set of hosts to an ordered list of tasks, and each task calls one module.
    ref: "concepts.md#playbooks-plays-and-tasks"

  - id: configuration-management-ansible-005
    difficulty: beginner
    tags: [inventory]
    question: |
      What is the Ansible inventory?
    options:
      - "The list of modules available on the control node"
      - "The list of managed hosts, organized into groups"
      - "A log of every change Ansible has ever made"
      - "The encrypted store of all secrets"
    answer: 1
    explanation: |
      The inventory is the set of hosts Ansible manages, arranged into groups (static INI/YAML
      or dynamic via a cloud plugin). Groups let you target subsets and attach group variables.
    ref: "concepts.md#inventory-hosts-and-groups"

  - id: configuration-management-ansible-006
    difficulty: beginner
    tags: [module, unit-of-work]
    question: |
      What is an Ansible module?
    options:
      - "A group of hosts in the inventory"
      - "A schedule for pull-based runs"
      - "A Jinja2 filter"
      - "The unit of work a task invokes (e.g. apt, template, service)"
    answer: 3
    explanation: |
      A module is the unit of work — apt, copy, template, service, user, etc. Each task
      calls exactly one module. Well-written modules are idempotent, checking state before
      acting.
    ref: "concepts.md#modules-and-idempotency"

  - id: configuration-management-ansible-007
    difficulty: intermediate
    tags: [push, pull, comparison]
    question: |
      How does Ansible's push model differ from Puppet's and Chef's pull model?
    options:
      - "Ansible agents pull a catalog on a schedule; Puppet pushes from a master"
      - "Both push from a central master with no agents involved"
      - "Ansible pushes config from a control node when you run it; Puppet/Chef agents pull their catalog from a server on a schedule"
      - "Both are pull-based; the only difference is the language"
    answer: 2
    explanation: |
      Ansible is push-based: a control node initiates the run and pushes config out over
      SSH when you trigger it. Puppet/Chef install agents that periodically pull their
      catalog/recipes from a central server, giving continuous convergence without a push.
    ref: "concepts.md#ansible-vs-chef-puppet-and-salt"

  - id: configuration-management-ansible-008
    difficulty: intermediate
    tags: [command, shell, idempotency]
    question: |
      A playbook contains: `- ansible.builtin.shell: systemctl restart nginx`. Why is this
      a code-smell for idempotency?
    options:
      - "shell is deprecated and no longer works"
      - "shell always executes and reports changed on every run, restarting nginx even when nothing changed"
      - "shell cannot escalate privileges with become"
      - "shell runs on the control node, not the target"
    answer: 1
    explanation: |
      command/shell/raw are the escape hatch and are not idempotent — they run every time
      and always report changed, bouncing nginx on every run. Use the service/systemd module
      (idempotent) or guard with creates/changed_when.
    ref: "concepts.md#modules-and-idempotency"

  - id: configuration-management-ansible-009
    difficulty: intermediate
    tags: [handlers, notify]
    question: |
      A task deploys a config file with `notify: Restart nginx`. When does the handler run?
    options:
      - "Only if the task reported changed, and it runs once at the end of the play"
      - "Immediately after the task, on every run"
      - "Before any tasks in the play begin"
      - "Once per host in the inventory regardless of changes"
    answer: 0
    explanation: |
      A handler runs only when notified by a task that reported changed, and it runs once
      at the end of the play even if notified many times. If the config task reports ok
      (no change), the handler never fires — so converged runs don't needlessly restart nginx.
    ref: "concepts.md#handlers-and-notify"

  - id: configuration-management-ansible-010
    difficulty: intermediate
    tags: [facts, gather]
    question: |
      What are Ansible "facts"?
    options:
      - "Encrypted secrets stored by Ansible Vault"
      - "Handlers that run at the end of a play"
      - "The list of tasks that changed in the last run"
      - "Variables Ansible auto-discovers about each host (OS, IPs, CPU, memory) at play start"
    answer: 3
    explanation: |
      Facts are host attributes gathered by the setup module at play start — OS family, IP
      addresses, CPU/memory, distribution version — exposed under ansible_facts. They make
      playbooks portable and conditional (e.g. apt on Debian, yum on RedHat).
    ref: "concepts.md#facts-and-gathering"

  - id: configuration-management-ansible-011
    difficulty: intermediate
    tags: [template, copy, jinja2]
    question: |
      What is the difference between the `copy` and `template` modules?
    options:
      - "copy is idempotent but template is not"
      - "template runs on the control node; copy runs on the target"
      - "copy ships a file verbatim; template renders Jinja2 (variables/facts) before writing"
      - "There is no difference; they are aliases"
    answer: 2
    explanation: |
      copy transfers a file as-is; template renders it through Jinja2 first, substituting
      variables and facts. Both are idempotent — they only write when the resulting content
      differs from what's on the host.
    ref: "concepts.md#templates-and-jinja2"

  - id: configuration-management-ansible-012
    difficulty: intermediate
    tags: [roles, reuse]
    question: |
      What problem do Ansible roles primarily solve?
    options:
      - "Encrypting secrets at rest"
      - "Organizing and reusing configuration as a standard directory layout (tasks, handlers, templates, defaults)"
      - "Provisioning cloud infrastructure with state tracking"
      - "Scheduling pull-based runs on agents"
    answer: 1
    explanation: |
      A role is the standard unit of reuse and organization — a fixed directory layout
      bundling tasks, handlers, templates, files, vars and defaults so a capability (nginx,
      postgres) can be dropped into any playbook. Playbooks become thin lists of roles.
    ref: "concepts.md#roles-and-ansible-galaxy"

  - id: configuration-management-ansible-013
    difficulty: intermediate
    tags: [galaxy, collections]
    question: |
      What is Ansible Galaxy?
    options:
      - "A dynamic inventory plugin for AWS"
      - "A GUI for running playbooks"
      - "The templating engine Ansible uses"
      - "The public hub for sharing and installing roles and collections"
    answer: 3
    explanation: |
      Ansible Galaxy is the community hub for sharing roles and collections. You install
      them with ansible-galaxy install and pin them in requirements.yml. Collections are the
      modern packaging unit — namespaced bundles of roles, modules and plugins.
    ref: "concepts.md#roles-and-ansible-galaxy"

  - id: configuration-management-ansible-014
    difficulty: beginner
    tags: [ad-hoc]
    question: |
      What is an ad-hoc command in Ansible?
    options:
      - "Running a single module against hosts without writing a playbook (e.g. `ansible web -m ping`)"
      - "A task that runs only when notified by another task"
      - "A scheduled run triggered by an agent"
      - "A command that automatically becomes idempotent"
    answer: 0
    explanation: |
      An ad-hoc command runs one module against a host pattern directly from the CLI —
      ansible <pattern> -m <module> -a "<args>" — for quick one-offs like checking uptime or
      disk. Anything you want repeatable and reviewed belongs in a versioned playbook.
    ref: "concepts.md#ad-hoc-commands"

  - id: configuration-management-ansible-015
    difficulty: intermediate
    tags: [vault, secrets]
    question: |
      What does Ansible Vault do?
    options:
      - "Issues short-lived dynamic database credentials with automatic rotation"
      - "Provisions a HashiCorp Vault cluster"
      - "Encrypts sensitive data/files so secrets can live in git alongside playbooks"
      - "Scans playbooks for hardcoded secrets"
    answer: 2
    explanation: |
      Ansible Vault encrypts variables and files (AES-256) with a passphrase so ciphertext
      can be committed to git; the passphrase is supplied at run time. It is static secret
      storage — no leases, rotation, or dynamic issuance like HashiCorp Vault.
    ref: "concepts.md#ansible-vault-secrets-in-configuration"

  - id: configuration-management-ansible-016
    difficulty: intermediate
    tags: [immutable, bake, drift]
    question: |
      What is the key idea of immutable infrastructure ("bake") versus mutable configuration
      ("configure")?
    options:
      - "Immutable means you SSH in and patch each running host by hand"
      - "Immutable infrastructure requires an agent on every host"
      - "Mutable infrastructure eliminates configuration drift by design"
      - "Immutable builds a complete image once and replaces hosts to change anything; mutable modifies long-lived hosts in place"
    answer: 3
    explanation: |
      Immutable = bake a fully-configured artifact (AMI via Packer, or a container image)
      once and never modify running hosts — to change, build a new image and replace
      instances. Mutable = converge long-lived hosts in place. Immutable eliminates drift and
      makes rollback a redeploy of the old image.
    ref: "concepts.md#mutable-configuration-vs-immutable-images-bake-vs-configure"

  - id: configuration-management-ansible-017
    difficulty: intermediate
    tags: [drift, definition]
    question: |
      What is "configuration drift"?
    options:
      - "The lag between pushing config and hosts pulling it"
      - "The gap that opens between the intended configuration (in code) and the actual state of hosts over time"
      - "The time it takes fact-gathering to complete"
      - "The delay before a handler fires"
    answer: 1
    explanation: |
      Drift is the divergence between what's declared in code and the real state of hosts,
      caused by manual hotfixes, failed partial runs, auto-updates and one-off SSH sessions.
      It is the root cause of "works on one box, not the other" and unreproducible incidents.
    ref: "concepts.md#configuration-drift-and-where-cm-fits-today"

  - id: configuration-management-ansible-018
    difficulty: intermediate
    tags: [check-mode, dry-run]
    question: |
      Which Ansible feature is the closest analogue to `terraform plan` — previewing changes
      without applying them?
    options:
      - "--check (with --diff)"
      - "gather_facts: true"
      - "ansible-galaxy install"
      - "notify handlers"
    answer: 0
    explanation: |
      Running a playbook with --check performs a dry run: modules report what they would
      change without changing anything, and --diff shows the content differences. It's the
      CM equivalent of a plan. Modules lacking check support will warn.
    ref: "concepts.md#modules-and-idempotency"

  - id: configuration-management-ansible-019
    difficulty: intermediate
    tags: [state, terraform, comparison]
    question: |
      Which statement about state is TRUE for Ansible versus Terraform?
    options:
      - "Both maintain a central state file that must be locked during runs"
      - "Ansible keeps a state file; Terraform is stateless"
      - "Neither tool has any concept of desired state"
      - "Ansible is stateless (no state file); the 'state' is whatever modules find on the host at run time, while Terraform keeps a state file to plan diffs"
    answer: 3
    explanation: |
      Terraform maintains a state file so it can diff declared vs recorded infra and plan
      changes. Ansible has no central state file — each module inspects the host live and
      converges it to declared state. That's why Ansible is often called stateless.
    ref: "concepts.md#configuration-management-vs-provisioning"

  - id: configuration-management-ansible-020
    difficulty: advanced
    tags: [dynamic-inventory, cloud]
    question: |
      Why is a dynamic inventory (e.g. the aws_ec2 plugin) important in an autoscaling cloud
      environment?
    options:
      - "It encrypts the inventory file at rest"
      - "It returns currently-running instances (optionally grouped by tag) so you never hand-edit IPs as hosts come and go"
      - "It makes ad-hoc commands idempotent"
      - "It converts push mode into pull mode"
    answer: 1
    explanation: |
      Static inventories rot when instances are created and destroyed by autoscaling. A
      dynamic inventory queries the cloud provider at run time for live hosts and can group
      them by tag, keeping CM correct without hand-maintaining IP lists.
    ref: "concepts.md#inventory-hosts-and-groups"

  - id: configuration-management-ansible-021
    difficulty: advanced
    tags: [handlers, failure, gotcha]
    question: |
      A play changes a config file (notifying a restart handler) but a later task in the
      same play fails before handlers flush. What is the likely consequence?
    options:
      - "The whole play automatically rolls back all changes"
      - "The handler always runs first, so the service is definitely restarted"
      - "The notified handler may not run, so the config changed but the service was not restarted — a half-applied state"
      - "Facts are re-gathered and the play restarts from the top"
    answer: 2
    explanation: |
      Handlers run at the end of the play by default. If a task fails before that flush, the
      notified handler may be skipped, leaving the config updated but the service not
      restarted. --force-handlers or an earlier meta: flush_handlers mitigates this.
    ref: "concepts.md#handlers-and-notify"

  - id: configuration-management-ansible-022
    difficulty: advanced
    tags: [shell, changed_when, idempotency]
    question: |
      You must run a legacy `command`/`shell` task but want it to behave idempotently. Which
      is a valid approach?
    options:
      - "Add `become: true` to the task"
      - "Set gather_facts: false"
      - "Move it into a handler"
      - "Guard it with `creates=`/`removes=`, or set `when:`/`changed_when:` so it only runs or reports changed when appropriate"
    answer: 3
    explanation: |
      command/shell aren't idempotent on their own. creates= skips the task if a file
      already exists; changed_when redefines when it reports changed; when: conditions it.
      These guards restore idempotent behavior. Prefer a real module when one exists.
    ref: "concepts.md#modules-and-idempotency"

  - id: configuration-management-ansible-023
    difficulty: advanced
    tags: [defaults, vars, precedence]
    question: |
      Inside a role, where should you put a tunable value you expect callers to override?
    options:
      - "defaults/main.yml, because defaults have the lowest precedence and are easily overridden"
      - "vars/main.yml, because it has the highest precedence"
      - "meta/main.yml, because it stores dependencies"
      - "handlers/main.yml, so it runs last"
    answer: 0
    explanation: |
      defaults/main.yml holds the lowest-precedence variables, designed to be overridden by
      the caller (group_vars, host_vars, extra-vars). vars/main.yml is high precedence and
      hard to override, so it's the wrong place for tunables.
    ref: "concepts.md#roles-and-ansible-galaxy"

  - id: configuration-management-ansible-024
    difficulty: advanced
    tags: [immutable, ansible, packer]
    question: |
      In an immutable-infrastructure workflow, what role does Ansible typically play?
    options:
      - "It is no longer used at all"
      - "It bakes the image (e.g. as Packer's Ansible provisioner running playbooks against the build instance); the running fleet is never touched"
      - "It continuously mutates the running fleet on a schedule"
      - "It replaces Terraform for provisioning"
    answer: 1
    explanation: |
      Immutable doesn't kill Ansible — it moves it left into image build. Packer's Ansible
      provisioner runs playbooks against a build instance to bake a fully-configured AMI or
      container image; the running instances are then replaced, never configured in place.
    ref: "concepts.md#mutable-configuration-vs-immutable-images-bake-vs-configure"

  - id: configuration-management-ansible-025
    difficulty: advanced
    tags: [drift, anti-drift]
    question: |
      Which approach is the STRONGEST guarantee against configuration drift?
    options:
      - "Running an idempotent Ansible playbook once at host creation"
      - "Using ad-hoc commands to fix hosts as issues appear"
      - "Documenting all manual changes in a wiki"
      - "Immutable infrastructure — never mutate a running host, so drift cannot accumulate"
    answer: 3
    explanation: |
      Idempotent scheduled runs re-converge and fight drift, but the strongest guarantee is
      immutable infra: if you never modify a running host and instead replace it from a
      baked image, there is nothing to drift. One-time runs and wikis do not prevent drift.
    ref: "concepts.md#configuration-drift-and-where-cm-fits-today"

  - id: configuration-management-ansible-026
    difficulty: intermediate
    tags: [become, privilege]
    question: |
      What does `become: true` do in a play or task?
    options:
      - "Enables fact-gathering"
      - "Switches Ansible from push to pull mode"
      - "Performs privilege escalation (e.g. sudo) to run tasks as root or another user"
      - "Encrypts the task output"
    answer: 2
    explanation: |
      become handles privilege escalation — by default sudo to root — so tasks that need
      elevated rights (installing packages, editing /etc) can run. Even though Ansible is
      agentless, the SSH user still needs the appropriate become rights on the host.
    ref: "concepts.md#playbooks-plays-and-tasks"

  - id: configuration-management-ansible-027
    difficulty: intermediate
    tags: [module-status, changed]
    question: |
      A module reports "ok" (not "changed") for a task. What does this indicate?
    options:
      - "The host was already in the desired state, so the module made no change"
      - "The task failed silently"
      - "The task was skipped by a when condition"
      - "A handler was triggered"
    answer: 0
    explanation: |
      ok means the module found the host already matching the declared state, so it did
      nothing. changed means it made a change (and can fire handlers). Distinguishing ok vs
      changed is exactly what lets you use changed as a meaningful signal.
    ref: "concepts.md#modules-and-idempotency"

  - id: configuration-management-ansible-028
    difficulty: advanced
    tags: [agentless, tradeoff, scale]
    question: |
      What is a genuine downside of Ansible's agentless push model at very large scale?
    options:
      - "It requires installing an agent on every node"
      - "It cannot use variables or templates"
      - "It cannot manage more than one host at a time"
      - "Push fans out many SSH connections per run and does not self-heal drift between runs, unlike scheduled pull agents"
    answer: 3
    explanation: |
      Agentless push is simple and needs nothing on nodes, but each run fans out SSH
      connections and enforcement only happens when you trigger a run. Pull-based agents
      (Puppet/Chef) check in on a schedule, continuously correcting drift and scaling to huge
      fleets more cleanly.
    ref: "concepts.md#ansible-vs-chef-puppet-and-salt"

  - id: configuration-management-ansible-029
    difficulty: intermediate
    tags: [jinja2, filters]
    question: |
      In `{{ db_host | default('localhost') }}`, what is `default('localhost')`?
    options:
      - "A handler"
      - "A Jinja2 filter that supplies a fallback value if db_host is undefined"
      - "A module argument"
      - "An inventory group"
    answer: 1
    explanation: |
      Jinja2 filters transform values with the pipe syntax. default('localhost') returns
      'localhost' when db_host is undefined. Filters (default, to_json, b64encode, etc.) are
      the idiomatic way to manipulate data in templates and variable expressions.
    ref: "concepts.md#templates-and-jinja2"

  - id: configuration-management-ansible-030
    difficulty: advanced
    tags: [vault, hashicorp, comparison]
    question: |
      Why might you use HashiCorp Vault instead of Ansible Vault for deploy-time secrets?
    options:
      - "Ansible Vault cannot encrypt anything"
      - "Ansible Vault requires an agent on each host"
      - "HashiCorp Vault offers dynamic secrets, leases, rotation and audit, whereas Ansible Vault is static file encryption with a shared passphrase"
      - "HashiCorp Vault stores its secrets in plaintext in git"
    answer: 2
    explanation: |
      Ansible Vault encrypts files/vars statically and commits ciphertext to git — no
      rotation, leasing or per-request issuance. HashiCorp Vault is a full secrets platform
      with dynamic credentials, leases, rotation and audit, better for pipeline/deploy
      secrets. See secrets-management for the broader picture.
    ref: "concepts.md#ansible-vault-secrets-in-configuration"

  - id: configuration-management-ansible-031
    difficulty: intermediate
    tags: [facts, conditionals, os]
    question: |
      Why do playbooks often branch on `ansible_facts['os_family']`?
    options:
      - "To encrypt output per OS"
      - "To force handlers to run immediately"
      - "Because facts are required for become to work"
      - "To make the playbook portable — e.g. use apt on Debian and yum on RedHat based on the discovered OS"
    answer: 3
    explanation: |
      Facts like os_family let one playbook adapt to heterogeneous fleets — installing with
      the correct package manager, sizing configs to available RAM, or templating the host's
      own IP. This portability is a core reason facts are gathered.
    ref: "concepts.md#facts-and-gathering"

  - id: configuration-management-ansible-032
    difficulty: intermediate
    tags: [gather_facts, performance]
    question: |
      A large-fleet playbook doesn't reference any host facts but is slow to start. What is
      a reasonable optimization?
    options:
      - "Set gather_facts: false (or use a fact cache) to skip the setup round-trip when facts aren't needed"
      - "Enable become for every task"
      - "Convert all tasks to shell commands"
      - "Move all tasks into handlers"
    answer: 0
    explanation: |
      Fact-gathering adds an SSH round-trip and Python run per host at play start. If the
      playbook doesn't use facts, gather_facts: false removes that cost; alternatively a fact
      cache reuses facts across runs.
    ref: "concepts.md#facts-and-gathering"

  - id: configuration-management-ansible-033
    difficulty: advanced
    tags: [rolling, serial, deploy]
    question: |
      Which play-level setting lets Ansible update hosts in small batches (a rolling
      deployment) instead of all at once?
    options:
      - "gather_facts"
      - "serial (optionally with max_fail_percentage)"
      - "notify"
      - "become"
    answer: 1
    explanation: |
      serial controls how many hosts a play converges at a time (e.g. serial: 2 or a
      percentage), enabling rolling updates; max_fail_percentage and any_errors_fatal tune
      when to abort the rollout. This orchestration control is a strength of push mode.
    ref: "concepts.md#playbooks-plays-and-tasks"

  - id: configuration-management-ansible-034
    difficulty: intermediate
    tags: [collections, packaging]
    question: |
      What is an Ansible "collection"?
    options:
      - "A group of hosts in the inventory"
      - "A set of encrypted secrets"
      - "A cache of gathered facts"
      - "A namespaced, distributable bundle of roles, modules and plugins (e.g. amazon.aws, community.general)"
    answer: 3
    explanation: |
      Collections are the modern packaging/distribution unit — namespaced bundles containing
      roles, modules and plugins (e.g. ansible.builtin, amazon.aws, community.general),
      installable from Galaxy and pinned in requirements.yml.
    ref: "concepts.md#roles-and-ansible-galaxy"

  - id: configuration-management-ansible-035
    difficulty: advanced
    tags: [kubernetes, gitops, where-cm-fits]
    question: |
      In a container/Kubernetes environment, where does Ansible still typically fit?
    options:
      - "Managing application config inside the cluster (ConfigMaps/Secrets)"
      - "Replacing GitOps for app deployment"
      - "Baking images, bootstrapping/hardening the nodes themselves, bare metal and network gear, and legacy fleets"
      - "As the in-cluster reconciliation controller"
    answer: 2
    explanation: |
      Inside Kubernetes, app config is handled by ConfigMaps/Secrets delivered via GitOps.
      Ansible's territory is the layer below and beside the cluster: baking images,
      bootstrapping/hardening nodes, bare metal and network gear, and legacy/stateful fleets.
    ref: "concepts.md#configuration-drift-and-where-cm-fits-today"

  - id: configuration-management-ansible-036
    difficulty: intermediate
    tags: [scenario, terraform, ansible, pipeline]
    question: |
      A pipeline needs to stand up 10 new EC2 instances and then install and configure the
      app on them. What is the idiomatic tool split?
    options:
      - "Terraform to provision the instances, then Ansible to install/configure the app on them"
      - "Ansible for both provisioning and configuration; Terraform not needed"
      - "Terraform for both; Ansible not needed"
      - "Puppet to provision and Ansible to destroy"
    answer: 0
    explanation: |
      Terraform provisions the instances (and keeps state), then Ansible configures the
      software on those hosts — often using a dynamic inventory to discover the freshly
      created instances. This terraform apply → ansible-playbook sequence is the standard
      pairing.
    ref: "concepts.md#configuration-management-vs-provisioning"

  - id: configuration-management-ansible-037
    difficulty: advanced
    tags: [scenario, drift, self-heal]
    question: |
      An engineer manually edits /etc/nginx/nginx.conf on a host managed by an idempotent
      playbook. The playbook is scheduled to run nightly. What happens on the next run?
    options:
      - "Nothing — Ansible only touches files it created"
      - "The template task detects the file differs from the rendered desired state, rewrites it (changed), and notifies the restart handler — reverting the manual edit"
      - "The run fails because the file was modified"
      - "The manual edit is preserved and merged with the template"
    answer: 1
    explanation: |
      Because the desired-state template no longer matches the file, the module rewrites it
      and reports changed, firing the restart handler. This is self-healing convergence:
      idempotent scheduled runs revert manual drift back to what's in code.
    ref: "concepts.md#idempotency-and-desired-state-convergence"

  - id: configuration-management-ansible-038
    difficulty: advanced
    tags: [scenario, snowflake, pets-cattle]
    question: |
      Over a year, three "identical" web servers each received one-off manual fixes and now
      behave differently, and an incident can't be reproduced. What anti-pattern is this,
      and the best long-term fix?
    options:
      - "It's a push-model limitation; switch to Chef"
      - "It's insufficient fact-gathering; enable more facts"
      - "It's a Jinja2 templating bug; stop using templates"
      - "It's snowflake servers from config drift; move toward immutable infrastructure (bake images, replace hosts) and/or enforce idempotent CM runs"
    answer: 3
    explanation: |
      Hand-tended, divergent, unreproducible hosts are snowflakes born of drift. The durable
      fix is immutable infrastructure — bake a common image and replace hosts so drift can't
      accumulate — backed by idempotent CM to re-converge where hosts stay mutable.
    ref: "concepts.md#mutable-configuration-vs-immutable-images-bake-vs-configure"

  - id: configuration-management-ansible-039
    difficulty: intermediate
    tags: [task-order, execution]
    question: |
      How are tasks within a play executed?
    options:
      - "In parallel with random ordering across tasks"
      - "In an order derived automatically from resource dependencies"
      - "Top-to-bottom in the order written (across the batch of hosts), one task at a time"
      - "Only the changed tasks run; ok tasks are skipped"
    answer: 2
    explanation: |
      Ansible runs tasks in the order written, top-to-bottom, moving to the next task after
      the current one completes across the host batch. This gives imperative ordering with
      declarative per-task state — unlike Puppet's dependency-graph ordering.
    ref: "concepts.md#playbooks-plays-and-tasks"

  - id: configuration-management-ansible-040
    difficulty: advanced
    tags: [no_log, secrets, gotcha]
    question: |
      A task passes a secret to a module and you don't want it appearing in Ansible's output
      or logs. Which option helps?
    options:
      - "no_log: true on the task"
      - "gather_facts: false"
      - "become: true"
      - "changed_when: false"
    answer: 0
    explanation: |
      no_log: true suppresses a task's arguments and output from the console and logs,
      preventing secrets from leaking. It's a standard safeguard when tasks handle sensitive
      data, complementing Ansible Vault for the at-rest side.
    ref: "concepts.md#ansible-vault-secrets-in-configuration"

  - id: configuration-management-ansible-041
    difficulty: beginner
    tags: [chef-puppet-salt, agent]
    question: |
      Which pair of tools are traditionally AGENT-based and PULL-based (agents pull a catalog
      from a server on a schedule)?
    options:
      - "Ansible and Terraform"
      - "Ansible and Salt-SSH"
      - "Packer and Vagrant"
      - "Puppet and Chef"
    answer: 3
    explanation: |
      Puppet and Chef install agents (puppet daemon, chef-client) that pull their
      catalog/recipes from a central server on a schedule (pull model). Ansible is agentless
      and push-based; Salt can run either agent or agentless.
    ref: "concepts.md#ansible-vs-chef-puppet-and-salt"

  - id: configuration-management-ansible-042
    difficulty: advanced
    tags: [execution, python, how-it-works]
    question: |
      For most modules, how does Ansible actually execute a task on a target host?
    options:
      - "It sends the YAML to a resident agent that interprets it"
      - "It copies a small module (usually Python) to the target, runs it there over SSH, collects JSON results, and removes it"
      - "It executes everything on the control node and rsyncs the result"
      - "It compiles the playbook to a binary and installs it permanently"
    answer: 1
    explanation: |
      Ansible transfers a small module to the target, executes it locally on that host over
      the SSH connection, gathers structured JSON output, and cleans up. The module logic
      runs on the target, not the control node — no persistent agent involved.
    ref: "concepts.md#the-ansible-execution-model-agentless-push-over-ssh"

  - id: configuration-management-ansible-043
    difficulty: advanced
    tags: [inventory, precedence, gotcha]
    question: |
      A variable is defined in group_vars/all, in host_vars for a host, and passed on the
      CLI with `-e`. Which value wins?
    options:
      - "group_vars/all, because it applies to everything"
      - "host_vars, because host is more specific than a group"
      - "The command-line extra-var (-e), which has the highest precedence"
      - "They are merged into a list"
    answer: 2
    explanation: |
      Ansible has a defined precedence order: extra-vars (-e) beat almost everything, then
      more specific scopes like host_vars override group_vars, and specific groups override
      all. So the CLI -e value wins here — a common gotcha.
    ref: "concepts.md#inventory-hosts-and-groups"

  - id: configuration-management-ansible-044
    difficulty: intermediate
    tags: [scenario, ad-hoc, appropriate-use]
    question: |
      Which task is the BEST fit for an ad-hoc command rather than a playbook?
    options:
      - "A quick one-off check of free disk space across the db group during an incident"
      - "The repeatable, reviewed configuration of the production web tier"
      - "The versioned baseline hardening applied to every new host"
      - "A scheduled nightly convergence run"
    answer: 0
    explanation: |
      Ad-hoc commands shine for quick, investigative one-offs (checking disk, uptime,
      reachability) — especially during incidents. Anything repeatable, reviewed, or
      scheduled belongs in a versioned playbook in git, since ad-hoc runs aren't recorded or
      reviewed.
    ref: "concepts.md#ad-hoc-commands"

  - id: configuration-management-ansible-045
    difficulty: intermediate
    tags: [state, declarative]
    question: |
      What does `state: present` (vs `state: absent`) express in a module like apt or user?
    options:
      - "The literal command to run on the shell"
      - "Whether to run the task in check mode"
      - "Whether to gather facts first"
      - "The desired end state — the resource should exist (present) or not exist (absent) — letting the module decide whether work is needed"
    answer: 3
    explanation: |
      state: present/absent/started declares the desired end state rather than a procedure.
      The module checks whether the host already matches and only acts on a diff — the
      declarative core that makes tasks idempotent.
    ref: "concepts.md#modules-and-idempotency"

  - id: configuration-management-ansible-046
    difficulty: advanced
    tags: [scenario, immutable-tradeoff]
    question: |
      A team goes fully immutable (bake AMIs, replace on change) and complains that a
      one-line config tweak now requires a full image rebuild and rolling replace. Which
      statement best characterizes this?
    options:
      - "It's a bug in Ansible; immutable infra should allow in-place edits"
      - "It's the expected trade-off: immutable eliminates drift and gives trivial rollback, at the cost of rebuilding/redeploying even for tiny changes"
      - "They should abandon immutability entirely and hand-edit hosts"
      - "It means Terraform is misconfigured"
    answer: 1
    explanation: |
      Immutable infrastructure trades slower small changes (rebuild + replace) for no drift,
      reproducibility, and rollback-by-redeploy. The rebuild cost is inherent to the model,
      not a defect — teams accept it for the reliability gains, sometimes reserving mutable
      CM for rapid-iteration or legacy cases.
    ref: "concepts.md#mutable-configuration-vs-immutable-images-bake-vs-configure"

  - id: configuration-management-ansible-047
    difficulty: intermediate
    tags: [check-diff, audit, drift]
    question: |
      You want to REPORT configuration drift on a fleet without changing anything (an audit
      job). What's the right invocation?
    options:
      - "ansible-playbook site.yml (a normal run)"
      - "ansible-galaxy install -r requirements.yml"
      - "ansible-playbook site.yml --check --diff"
      - "ansible-vault encrypt site.yml"
    answer: 2
    explanation: |
      --check performs a dry run (no changes) and --diff shows what would change. Together
      they surface drift for a compliance/audit report without mutating hosts — the
      non-destructive way to detect divergence between code and reality.
    ref: "concepts.md#configuration-drift-and-where-cm-fits-today"

  - id: configuration-management-ansible-048
    difficulty: beginner
    tags: [templates, module]
    question: |
      Which module renders a Jinja2 `.j2` file with the play's variables/facts and writes the
      result to the target host?
    options:
      - "git"
      - "shell"
      - "setup"
      - "template"
    answer: 3
    explanation: |
      The template module renders a .j2 file through Jinja2 (substituting variables and
      facts) and writes it to the target. It's the workhorse for generating config files and
      is idempotent — it only writes when the rendered content differs.
    ref: "concepts.md#templates-and-jinja2"
