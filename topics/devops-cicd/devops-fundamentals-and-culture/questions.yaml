topic: "DevOps Fundamentals & Culture"
domain: devops-cicd
topic_slug: devops-fundamentals-and-culture
version: 1
questions:
  - id: devops-fundamentals-and-culture-001
    difficulty: beginner
    tags: [definition, culture, tools]
    question: |
      Which statement best captures what DevOps is?
    options:
      - "A specific job title held by the one engineer responsible for building and maintaining the team's Jenkins pipelines"
      - "A single automation tool that compiles, tests, and then deploys every code change straight to production servers"
      - "A combination of culture, practices, and tools aimed at optimising the whole flow from idea to running software"
      - "A newer delivery methodology intended to fully replace Agile and its iterative, sprint-based planning ceremonies"
    answer: 2
    explanation: |
      DevOps is not a title, a single tool, or a replacement for Agile. It is a
      combination of culture (shared ownership, blamelessness), practices (CI/CD,
      IaC), and tools that together optimise the end-to-end delivery flow and break
      the dev/ops silo.
    ref: "concepts.md#what-devops-is-and-is-not"

  - id: devops-fundamentals-and-culture-002
    difficulty: beginner
    tags: [wall-of-confusion, silos]
    question: |
      The "wall of confusion" in traditional software delivery refers to what?
    options:
      - "The friction at the hand-off boundary between Development (incentivised on change) and Operations (incentivised on stability)"
      - "Poorly organised technical documentation written by developers that operations staff struggle to follow during releases"
      - "A misconfigured network firewall rule that silently blocks automated deployments from reaching production hosts"
      - "The steep learning curve engineers face when a team adopts an unfamiliar new programming language mid-project"
    answer: 0
    explanation: |
      Dev is measured on shipping change while Ops is measured on stability; those
      conflicting incentives create friction, finger-pointing, and slow, risky
      releases at the hand-off boundary — the wall of confusion.
    ref: "concepts.md#the-wall-of-confusion--breaking-silos"

  - id: devops-fundamentals-and-culture-003
    difficulty: beginner
    tags: [calms]
    question: |
      What does the acronym CALMS stand for?
    options:
      - "Culture, Automation, Lean, Measurement, Sharing"
      - "Continuous, Agile, Lean, Monitoring, Security"
      - "Culture, Agile, Logging, Metrics, Scaling"
      - "Collaboration, Automation, Lean, Microservices, Security"
    answer: 0
    explanation: |
      CALMS = Culture, Automation, Lean, Measurement, Sharing. It is the standard
      model for assessing DevOps maturity, and it deliberately leads with Culture.
    ref: "concepts.md#calms-framework"

  - id: devops-fundamentals-and-culture-004
    difficulty: intermediate
    tags: [calms, lean]
    question: |
      In CALMS, what does the "L" (Lean) pillar primarily emphasise?
    options:
      - "Choosing lightweight, minimal-runtime programming languages to keep the codebase small and fast"
      - "Reducing the total number of provisioned servers and environments purely to cut infrastructure cost"
      - "Writing as little project documentation as possible so engineers can spend more of their time coding"
      - "Small batch sizes, limiting work in progress, and eliminating waste across the value stream"
    answer: 3
    explanation: |
      The Lean pillar borrows from Lean manufacturing: small batches, limited WIP,
      waste elimination, and optimising the whole value stream. It is the most
      commonly-missed letter in CALMS.
    ref: "concepts.md#calms-framework"

  - id: devops-fundamentals-and-culture-005
    difficulty: intermediate
    tags: [calms, culture]
    question: |
      A candidate lists "Jenkins, Terraform, and Kubernetes" as the essence of
      DevOps. Using the CALMS model, what is the strongest critique?
    options:
      - "Those particular tools are outdated legacy choices and should be swapped for more modern equivalents before anything else"
      - "DevOps is a purely cultural movement that has nothing to do with automation tools or the CALMS Automation pillar"
      - "They have listed only Automation and ignored Culture, which CALMS puts first as the hardest and most important pillar"
      - "They forgot to name the specific programming language and framework the delivery pipeline is actually built around"
    answer: 2
    explanation: |
      Tools map to the Automation pillar only. CALMS deliberately leads with Culture
      (shared ownership, blamelessness); a tools-first answer signals an incomplete,
      tooling-centric understanding of DevOps.
    ref: "concepts.md#calms-framework"

  - id: devops-fundamentals-and-culture-006
    difficulty: beginner
    tags: [three-ways]
    question: |
      What are the Three Ways described in The DevOps Handbook / The Phoenix Project?
    options:
      - "Plan, Build, and Deploy — the three sequential phases every change moves through"
      - "Dev, Test, and Prod — the three standard environments a release is promoted across"
      - "People, Process, and Technology — the three pillars any transformation must align"
      - "Flow, Feedback, and Continual Learning/Experimentation"
    answer: 3
    explanation: |
      The Three Ways are: the First Way (Flow, left-to-right), the Second Way
      (Feedback, right-to-left), and the Third Way (Continual Learning and
      Experimentation). They are cumulative principles underpinning DevOps.
    ref: "concepts.md#the-three-ways"

  - id: devops-fundamentals-and-culture-007
    difficulty: intermediate
    tags: [three-ways, feedback]
    question: |
      Automated monitoring, telemetry, and "stop the line" when something breaks are
      practices belonging to which of the Three Ways?
    options:
      - "The First Way (Flow), which governs the left-to-right movement of work to the customer"
      - "The Second Way (Feedback)"
      - "The Third Way (Continual Learning), which centres on experimentation and organisational learning"
      - "None of the Three Ways — monitoring and telemetry sit entirely outside that model"
    answer: 1
    explanation: |
      The Second Way is about creating fast, constant feedback flowing right-to-left:
      automated tests, monitoring, telemetry, and stopping the line (Andon) when a
      defect appears. Shift-left testing and observability are Second Way practices.
    ref: "concepts.md#the-three-ways"

  - id: devops-fundamentals-and-culture-008
    difficulty: intermediate
    tags: [three-ways, learning]
    question: |
      Blameless postmortems, game days, and chaos engineering are most directly
      practices of which of the Three Ways?
    options:
      - "The First Way (Flow), concerned with optimising the left-to-right delivery of work"
      - "The Second Way (Feedback), concerned with fast right-to-left signals from production"
      - "The Third Way (Continual Learning and Experimentation)"
      - "They are not part of the Three Ways and belong instead to a separate maturity model"
    answer: 2
    explanation: |
      The Third Way fosters a culture of experimentation and learning from both
      success and failure. Blameless postmortems, game days, and chaos engineering
      are Third Way practices.
    ref: "concepts.md#the-three-ways"

  - id: devops-fundamentals-and-culture-009
    difficulty: intermediate
    tags: [ci-cd, continuous-integration]
    question: |
      What is the core practice of Continuous Integration (CI)?
    options:
      - "Automatically deploying every commit that compiles straight through to the production environment"
      - "Continuously integrating third-party vendor APIs and external services into the running application"
      - "Running load and performance tests continuously against the live production system around the clock"
      - "Developers frequently merging to a shared mainline, with each merge triggering an automated build and test"
    answer: 3
    explanation: |
      CI is about integrating (merging) to a shared mainline frequently so branches
      don't diverge, with each merge verified by an automated build and test to catch
      integration problems early. It ends at a tested, built artifact.
    ref: "concepts.md#ci-vs-continuous-delivery-vs-continuous-deployment"

  - id: devops-fundamentals-and-culture-010
    difficulty: intermediate
    tags: [ci-cd, continuous-delivery, continuous-deployment]
    question: |
      What is the key difference between Continuous Delivery and Continuous
      Deployment?
    options:
      - "Continuous Delivery always packages releases as containers, whereas Continuous Deployment ships them onto long-lived virtual machines"
      - "Continuous Delivery keeps a manual human decision to release to production; Continuous Deployment pushes every passing change to production automatically"
      - "Continuous Deployment only ever promotes builds to the staging environment and is deliberately blocked from touching production"
      - "There is no meaningful difference; the two terms are simply interchangeable names for the exact same delivery practice"
    answer: 1
    explanation: |
      Both automate the pipeline up to a production-ready state. Continuous Delivery
      keeps a manual "button push" release decision; Continuous Deployment removes
      that gate and deploys every passing change to production automatically.
    ref: "concepts.md#ci-vs-continuous-delivery-vs-continuous-deployment"

  - id: devops-fundamentals-and-culture-011
    difficulty: intermediate
    tags: [ci-cd, gotcha]
    question: |
      An engineer says: "We do Continuous Delivery, which means every commit that
      passes tests is automatically released to our users with no human involved."
      What is wrong with this statement?
    options:
      - "That describes Continuous Deployment; Continuous Delivery keeps a manual production release decision"
      - "Nothing at all — that description matches the textbook definition of Continuous Delivery precisely"
      - "Continuous Delivery deliberately skips automated testing and relies solely on manual QA sign-off before release"
      - "Continuous Delivery is technically unable to deploy anything to a staging environment ahead of production"
    answer: 0
    explanation: |
      Automatically releasing every passing commit with no human gate is Continuous
      Deployment. Continuous Delivery makes every change releasable and typically
      auto-deploys to staging, but the final promotion to production is a manual
      decision.
    ref: "concepts.md#ci-vs-continuous-delivery-vs-continuous-deployment"

  - id: devops-fundamentals-and-culture-012
    difficulty: advanced
    tags: [ci-cd, relationship]
    question: |
      Which relationship between the practices is correct?
    options:
      - "Continuous Deployment implies Continuous Delivery, but not vice versa"
      - "Continuous Delivery implies Continuous Deployment, but not the other way around"
      - "The two practices are mutually exclusive and can never coexist in one pipeline"
      - "Continuous Integration cannot function at all unless Continuous Deployment is also in place"
    answer: 0
    explanation: |
      Continuous Deployment is a superset: if every passing change auto-deploys to
      prod, you necessarily have a system that is always releasable (Continuous
      Delivery). The reverse is not true — you can have Delivery with a manual gate
      and no auto-deploy.
    ref: "concepts.md#ci-vs-continuous-delivery-vs-continuous-deployment"

  - id: devops-fundamentals-and-culture-013
    difficulty: beginner
    tags: [dora, metrics]
    question: |
      Which set correctly lists the DORA four key metrics?
    options:
      - "Lines of code, commits per day, test coverage, uptime"
      - "CPU utilisation, memory usage, latency, throughput"
      - "Deployment frequency, lead time for changes, change failure rate, time to restore service"
      - "Story points, velocity, sprint burndown, cycle time"
    answer: 2
    explanation: |
      DORA's four keys are deployment frequency and lead time for changes
      (throughput), plus change failure rate and time to restore service / failed
      deployment recovery time (stability).
    ref: "concepts.md#the-dora-four-key-metrics"

  - id: devops-fundamentals-and-culture-014
    difficulty: intermediate
    tags: [dora, throughput, stability]
    question: |
      Which two DORA metrics measure stability (as opposed to throughput/velocity)?
    options:
      - "Deployment frequency and lead time for changes"
      - "Deployment frequency and change failure rate"
      - "Lead time for changes and time to restore service"
      - "Change failure rate and time to restore service"
    answer: 3
    explanation: |
      DORA splits its four keys into two throughput metrics (deployment frequency,
      lead time for changes) and two stability metrics (change failure rate, time to
      restore service / recovery time).
    ref: "concepts.md#the-dora-four-key-metrics"

  - id: devops-fundamentals-and-culture-015
    difficulty: intermediate
    tags: [dora, lead-time]
    question: |
      In DORA, "lead time for changes" specifically measures the time from what to
      what?
    options:
      - "From code committed to code successfully running in production"
      - "From the initial idea or feature request all the way to running live in production"
      - "From the start of a production incident through to its full resolution and recovery"
      - "From the opening day of a development sprint through to that sprint's closing day"
    answer: 0
    explanation: |
      DORA's change lead time is commit → running in production. The broader "idea →
      prod" measure is product lead time, not the DORA change lead time.
    ref: "concepts.md#the-dora-four-key-metrics"

  - id: devops-fundamentals-and-culture-016
    difficulty: advanced
    tags: [dora, scenario, misuse]
    question: |
      A manager starts scoring individual developers on personal deployment
      frequency and ranks the team by it. According to DORA guidance, what is the
      primary problem?
    options:
      - "Deployment frequency is not actually one of the four official DORA metrics and should be dropped from any scorecard"
      - "Deployment frequency is a metric that teams should always work to minimise rather than maximise over time"
      - "DORA metrics are system-level outcome measures, not individual productivity KPIs; using them per-developer invites gaming and destroys their value"
      - "Lead time for changes is the only one of the four keys that can legitimately be attributed to an individual developer"
    answer: 2
    explanation: |
      DORA metrics measure the whole delivery system's performance. Weaponising them
      as per-developer KPIs encourages gaming (e.g. trivial deploys) and undermines
      the collaborative behaviour they are meant to reflect.
    ref: "concepts.md#the-dora-four-key-metrics"

  - id: devops-fundamentals-and-culture-017
    difficulty: advanced
    tags: [dora, accelerate, tradeoff]
    question: |
      What is the central empirical finding of the Accelerate research regarding
      speed and stability?
    options:
      - "Teams must fundamentally trade off delivery speed against stability, because gains in one always come at the cost of the other"
      - "Elite performers achieve high throughput AND high stability together; they are not a trade-off"
      - "Stability of the system ceases to matter as long as a team is deploying changes frequently enough to keep up"
      - "Raw delivery speed turns out to be largely irrelevant to the organisation's underlying commercial and business outcomes"
    answer: 1
    explanation: |
      Accelerate showed that elite performers excel at throughput (DF, lead time) and
      stability (change failure rate, recovery) simultaneously — speed and stability
      reinforce each other rather than trading off.
    ref: "concepts.md#the-dora-four-key-metrics"

  - id: devops-fundamentals-and-culture-018
    difficulty: advanced
    tags: [dora, scenario, bands]
    question: |
      Team A deploys multiple times per day, has a change lead time under a day, a
      change failure rate around 10%, and restores service in under an hour. Which
      DORA performance band best describes them?
    options:
      - "Low"
      - "Medium"
      - "Cannot be determined from these metrics"
      - "Elite"
    answer: 3
    explanation: |
      On-demand (multiple daily) deploys, sub-day lead time, low change failure rate,
      and sub-hour recovery all sit in the elite band across the four keys.
    ref: "concepts.md#the-dora-four-key-metrics"

  - id: devops-fundamentals-and-culture-019
    difficulty: intermediate
    tags: [dora, change-failure-rate]
    question: |
      What does the DORA "change failure rate" measure?
    options:
      - "The percentage of deployments to production that result in a degraded service requiring remediation (hotfix, rollback)"
      - "The percentage of unit tests that fail during the CI build stage before any artifact is ever produced"
      - "The raw count of bugs that reviewers flag during pull-request code review, before the change is merged"
      - "The percentage of pull requests that reviewers reject and send back for rework before they are merged"
    answer: 0
    explanation: |
      Change failure rate is the proportion of production deployments that cause a
      failure needing a fix such as a hotfix, rollback, or patch. It is a stability
      metric, not a CI test-pass rate.
    ref: "concepts.md#the-dora-four-key-metrics"

  - id: devops-fundamentals-and-culture-020
    difficulty: beginner
    tags: [you-build-it-you-run-it, ownership]
    question: |
      The principle "you build it, you run it" (Werner Vogels, Amazon) means what?
    options:
      - "Only senior staff-level engineers are permitted to run production systems, while junior developers are restricted to writing code"
      - "Developers are expected to physically assemble and configure their own build machines and laptops before writing any code"
      - "The team that develops a service is also responsible for operating it in production, including on-call"
      - "Operations teams take over and write all of the application's business logic once developers hand off the initial design"
    answer: 2
    explanation: |
      It means the development team also operates its service in production and
      carries the pager, creating a tight feedback loop so operability and
      reliability are designed in rather than externalised to a separate ops team.
    ref: "concepts.md#you-build-it-you-run-it"

  - id: devops-fundamentals-and-culture-021
    difficulty: advanced
    tags: [you-build-it-you-run-it, cognitive-load, platform]
    question: |
      A common criticism of pure "you build it, you run it" at scale is that it
      raises team cognitive load. What organisational response addresses this?
    options:
      - "Return to a fully centralised operations team that owns every deployment and gatekeeps all releases to production"
      - "Introduce a platform team that provides self-service paved roads for the undifferentiated operational heavy lifting"
      - "Slow the release cadence and deploy far less frequently so each team has fewer production changes to operate"
      - "Outsource all operational and on-call duties to an external managed-services vendor under a support contract"
    answer: 1
    explanation: |
      Platform Engineering addresses the cognitive-load problem: a platform team owns
      the undifferentiated heavy lifting (CI/CD, runtime, observability plumbing) as
      self-service, so product teams keep ownership without drowning in complexity.
    ref: "concepts.md#you-build-it-you-run-it"

  - id: devops-fundamentals-and-culture-022
    difficulty: beginner
    tags: [shift-left]
    question: |
      "Shift-left" in DevOps refers to what?
    options:
      - "Physically relocating production servers to a data centre on the west coast to reduce user-facing latency"
      - "A front-end styling convention of aligning UI buttons and form elements to the left margin of the page"
      - "Reducing the number of developers assigned to a team so that coordination overhead and hand-offs shrink"
      - "Moving activities like testing and security earlier in the delivery timeline, closer to commit time"
    answer: 3
    explanation: |
      Shift-left moves late-stage activities (testing, security scanning) earlier —
      closer to the developer and commit time — because defects are far cheaper to fix
      the earlier they are caught. It is a fast-feedback (Second Way) practice.
    ref: "concepts.md#shift-left"

  - id: devops-fundamentals-and-culture-023
    difficulty: intermediate
    tags: [shift-left, shift-right]
    question: |
      What does the complementary idea of "shift-right" add to shift-left?
    options:
      - "Restricting all production deployments to Friday afternoons so the whole team is present for any release fallout"
      - "Consolidating every testing activity into a single manual QA phase performed by a separate team just before release"
      - "Testing and observing in production (canaries, feature flags, synthetic monitoring, chaos) because some behaviour only shows under real traffic"
      - "Rewriting the application's source files so that code and comments are read from right to left instead"
    answer: 2
    explanation: |
      Shift-right validates under real production conditions using canaries, feature
      flags, synthetic monitoring, and chaos experiments. Mature teams do both:
      shift-left to catch defects cheaply, shift-right to validate under reality.
    ref: "concepts.md#shift-left"

  - id: devops-fundamentals-and-culture-024
    difficulty: beginner
    tags: [blameless, postmortem, culture]
    question: |
      What is the core assumption behind a blameless culture?
    options:
      - "People generally act reasonably given the information and tools they had, so human error is a symptom of deeper systemic problems"
      - "Nobody on the team is ever held responsible for anything, so incidents simply pass without any follow-up or ownership"
      - "Only engineering managers and team leads can be blamed for incidents, shielding individual contributors from any scrutiny"
      - "Incidents should never be openly discussed or documented, so that the engineers involved are spared any embarrassment"
    answer: 0
    explanation: |
      Blameless culture assumes human error is a symptom, not a root cause: people
      act reasonably given their context, so the fix is in the system. This maximises
      honest information flow needed to actually improve.
    ref: "concepts.md#blameless-culture--postmortems"

  - id: devops-fundamentals-and-culture-025
    difficulty: intermediate
    tags: [blameless, accountability, gotcha]
    question: |
      Which statement about blameless postmortems is correct?
    options:
      - "Blameless means there is no accountability at all, so teams never track or follow up on any resulting action items"
      - "Blameless means the incident is never formally written down, so no timeline or contributing-factors record is ever kept"
      - "Blameless means only the on-call engineer reviews it privately, and the findings are never shared with the wider team"
      - "Blameless removes fear of individual punishment so the truth surfaces, while accountability shifts to producing action items that fix the system"
    answer: 3
    explanation: |
      Blameless does not mean no accountability. It removes punishment of individuals
      so honest information surfaces; the team is still accountable for follow-up
      action items that make the system more resilient.
    ref: "concepts.md#blameless-culture--postmortems"

  - id: devops-fundamentals-and-culture-026
    difficulty: intermediate
    tags: [blameless, psychological-safety]
    question: |
      Why is blamelessness considered pragmatic rather than merely "being nice"?
    options:
      - "It legally guarantees that production incidents will occur less often once a blameless policy is formally adopted"
      - "If people fear punishment they hide information and stop reporting near-misses, which reduces safety; blamelessness maximises honest reporting"
      - "It directly lowers monthly cloud infrastructure spend by cutting the compute resources incidents consume"
      - "It lets engineering managers skip writing postmortems entirely and close incidents without any documentation"
    answer: 1
    explanation: |
      Punishment drives information underground: people hide mistakes and avoid
      reporting near-misses, degrading safety. Blamelessness maximises the honest
      information flow needed to fix systems, which is why it is pragmatic.
    ref: "concepts.md#blameless-culture--postmortems"

  - id: devops-fundamentals-and-culture-027
    difficulty: beginner
    tags: [conways-law]
    question: |
      Conway's Law states that:
    options:
      - "Systems inevitably fail at the most inconvenient possible time, a pessimistic restatement of Murphy's Law for software"
      - "Adding more developers to a project that is already running late will only make that project finish even later"
      - "Organisations design systems that mirror their own communication structure"
      - "Any change reaching the production environment must first receive at least two independent reviewer approvals"
    answer: 2
    explanation: |
      Conway's Law (1968) observes that a system's architecture ends up mirroring the
      communication structure of the organisation that builds it.
    ref: "concepts.md#conways-law"

  - id: devops-fundamentals-and-culture-028
    difficulty: advanced
    tags: [conways-law, inverse-conway]
    question: |
      What is the "Inverse Conway Manoeuvre"?
    options:
      - "Deliberately restructuring teams/communication to induce a desired target architecture"
      - "Rolling a production deployment back to its previous version after a failed release is detected in monitoring"
      - "Consolidating all of an organisation's microservices back into a single deployable monolithic application"
      - "Renaming services with neutral labels so that their underlying coupling is hidden from architecture reviews"
    answer: 0
    explanation: |
      Since architecture mirrors org structure, the Inverse Conway Manoeuvre shapes
      teams first — small, autonomous, service-owning — to induce the architecture you
      want (e.g. loosely-coupled microservices).
    ref: "concepts.md#conways-law"

  - id: devops-fundamentals-and-culture-029
    difficulty: advanced
    tags: [conways-law, scenario, microservices]
    question: |
      A large company with a single centralised, hand-off-heavy org structure
      struggles to run independently-deployable microservices. Through the lens of
      Conway's Law, what is the most likely explanation?
    options:
      - "Microservices are always a bad architectural idea and no organisation should ever attempt to run them at scale"
      - "They selected the wrong programming language for their services, and switching languages would resolve the friction"
      - "They have provisioned too few physical servers, so simply adding more compute capacity would fix the problem"
      - "Their communication structure is monolithic, so it fights the loosely-coupled architecture they are trying to run"
    answer: 3
    explanation: |
      Conway's Law predicts architecture mirrors communication structure. A
      monolithic, hand-off-heavy org has a communication structure that resists the
      autonomy microservices require, so the target design and the org fight each
      other.
    ref: "concepts.md#conways-law"

  - id: devops-fundamentals-and-culture-030
    difficulty: intermediate
    tags: [sre, devops, relationship]
    question: |
      Google frames the relationship between SRE and DevOps with which analogy?
    options:
      - "SRE and DevOps are entirely unrelated disciplines that emerged independently and share no common goals or principles"
      - "class SRE implements interface DevOps — SRE is a concrete, prescriptive implementation of the DevOps philosophy"
      - "DevOps is a narrow subset of SRE that concerns itself solely with automating the final deployment step to production"
      - "SRE fully replaced DevOps as an approach and rendered the older DevOps philosophy obsolete and no longer practised"
    answer: 1
    explanation: |
      Google describes it as "class SRE implements interface DevOps": DevOps is the
      abstract philosophy, and SRE is one concrete, prescriptive implementation
      centred on SLOs and error budgets.
    ref: "concepts.md#devops-vs-sre-vs-platform-engineering"

  - id: devops-fundamentals-and-culture-031
    difficulty: intermediate
    tags: [sre, error-budgets]
    question: |
      Which artifacts are most characteristic of SRE specifically?
    options:
      - "The CALMS maturity model and the Three Ways, which are the defining conceptual frameworks of SRE practice"
      - "Golden-path templates and a self-service developer portal that product teams use to provision infrastructure"
      - "SLIs/SLOs, error budgets, and toil reduction"
      - "Gantt charts and story-point estimates used to plan and forecast the delivery of upcoming feature work"
    answer: 2
    explanation: |
      SRE's signature artifacts are SLIs/SLOs, error budgets, and systematic toil
      reduction. CALMS/Three Ways are DevOps framing; golden paths/portals are
      Platform Engineering artifacts.
    ref: "concepts.md#devops-vs-sre-vs-platform-engineering"

  - id: devops-fundamentals-and-culture-032
    difficulty: advanced
    tags: [platform-engineering, idp, cognitive-load]
    question: |
      What is the primary purpose of Platform Engineering / an Internal Developer
      Platform (IDP)?
    options:
      - "To provide self-service paved roads / golden paths that reduce product-team cognitive load while preserving their autonomy"
      - "To centralise every deployment back into a single gatekeeping operations team that approves and executes all releases"
      - "To automate software delivery so thoroughly that the organisation no longer needs to employ application developers"
      - "To replace public cloud providers with on-premises hardware that the platform team racks and manages in-house"
    answer: 0
    explanation: |
      Platform Engineering treats internal developers as customers and provides
      self-service infrastructure (golden paths, portals) so product teams keep
      autonomy without drowning in operational complexity — it enables DevOps at scale.
    ref: "concepts.md#devops-vs-sre-vs-platform-engineering"

  - id: devops-fundamentals-and-culture-033
    difficulty: intermediate
    tags: [devops-vs-agile]
    question: |
      What is the clearest distinction between Agile and DevOps?
    options:
      - "They are identical approaches under two different names, so any distinction between them is purely marketing"
      - "DevOps applies exclusively to hardware and infrastructure projects, whereas Agile applies exclusively to software"
      - "Agile is fundamentally about tooling and automation, whereas DevOps is fundamentally about upfront project planning"
      - "Agile optimises how you iteratively build software; DevOps extends the flow through delivery and operations to running software"
    answer: 3
    explanation: |
      Agile optimises iterative building of software; DevOps is complementary and
      extends that flow through delivery and operations, all the way to reliably
      running software in production.
    ref: "concepts.md#what-devops-is-and-is-not"

  - id: devops-fundamentals-and-culture-034
    difficulty: intermediate
    tags: [silos, self-service]
    question: |
      Which lever does NOT directly help break the dev/ops silo?
    options:
      - "Shared ownership across dev and ops, embodied in the you-build-it-you-run-it operating model"
      - "Self-service infrastructure provisioned via infrastructure-as-code and automated delivery pipelines"
      - "Requiring all deploys to route through a single manual change-approval board"
      - "Small, frequent changes that keep the blast radius of any single deployment as low as possible"
    answer: 2
    explanation: |
      Routing every deploy through a single manual approval board re-creates the wall
      of confusion — a hand-off/gate. Shared ownership, self-service tooling, and
      small frequent changes are the levers that dissolve the silo.
    ref: "concepts.md#the-wall-of-confusion--breaking-silos"

  - id: devops-fundamentals-and-culture-035
    difficulty: intermediate
    tags: [devops-engineer, anti-pattern]
    question: |
      Why can hiring a single "DevOps engineer" to sit between dev and ops be an
      anti-pattern?
    options:
      - "Because engineers with the DevOps title command salaries too high for most teams to justify hiring one"
      - "Because it can rebuild the wall of confusion with one person as the bottleneck/gate, instead of distributing the capability"
      - "Because DevOps practices only work on teams of ten or more engineers and cannot function on smaller teams"
      - "Because DevOps work must be performed entirely by dedicated operations staff rather than by application developers"
    answer: 1
    explanation: |
      Centralising DevOps in one gatekeeping individual re-creates the hand-off wall
      with a single bottleneck. The goal is to distribute the capability across teams
      and provide self-service platforms, not to insert a new intermediary.
    ref: "concepts.md#what-devops-is-and-is-not"

  - id: devops-fundamentals-and-culture-036
    difficulty: beginner
    tags: [three-ways, flow]
    question: |
      The First Way (Flow) primarily focuses on what?
    options:
      - "Identifying and punishing the individual engineers whose changes caused a production incident to occur"
      - "Maximising the number of concurrently open feature branches so that more work can proceed in parallel"
      - "Restricting all deployments to scheduled overnight maintenance windows to minimise the risk of disruption"
      - "Optimising the whole left-to-right flow of work from Development to Operations to the customer"
    answer: 3
    explanation: |
      The First Way emphasises systems thinking: optimise the entire left-to-right
      flow, make work visible, reduce batch sizes and hand-offs, and never pass a
      known defect downstream. CI/CD and trunk-based development live here.
    ref: "concepts.md#the-three-ways"

  - id: devops-fundamentals-and-culture-037
    difficulty: advanced
    tags: [dora, reliability, fifth-metric]
    question: |
      Recent DORA research often adds a fifth measure beyond the original four keys.
      What is it?
    options:
      - "Reliability (operational performance against SLOs)"
      - "The total number of independently deployable microservices in the architecture"
      - "The cumulative lines of application code shipped in each production release"
      - "The average cloud infrastructure cost incurred per production deployment"
    answer: 0
    explanation: |
      DORA added reliability — operational performance measured against SLOs/user
      expectations — as a fifth measure alongside the four throughput/stability keys.
    ref: "concepts.md#the-dora-four-key-metrics"

  - id: devops-fundamentals-and-culture-038
    difficulty: intermediate
    tags: [origin, history]
    question: |
      Which is commonly cited as a canonical origin moment of the DevOps movement?
    options:
      - "Google open-sourcing the Kubernetes container orchestrator in 2014, which first unified dev and ops workflows"
      - "The 2001 publication of the Agile Manifesto, whose seventeen signatories formally defined the DevOps movement"
      - "Allspaw & Hammond's '10+ Deploys per Day' talk at Velocity 2009 and Patrick Debois' DevOpsdays"
      - "Amazon's public launch of AWS in 2006, which is widely regarded as the founding event of the DevOps discipline"
    answer: 2
    explanation: |
      DevOps emerged around 2009: Patrick Debois coined "DevOpsdays," and Allspaw &
      Hammond's "10+ Deploys per Day at Flickr" talk at Velocity 2009 is the canonical
      origin story.
    ref: "concepts.md#what-devops-is-and-is-not"

  - id: devops-fundamentals-and-culture-039
    difficulty: advanced
    tags: [postmortem, wording]
    question: |
      Which action-item wording best reflects a blameless postmortem?
    options:
      - "\"Alice pushed bad config and caused the outage; she must be more careful.\""
      - "\"The deploy tool allowed an unreviewed config push; add mandatory review and validation for config changes.\""
      - "\"The on-call engineer failed to notice the alert in time and should be moved off the rotation as a consequence.\""
      - "\"Nobody in particular is responsible for the outage, so no action items or follow-up work need to be recorded.\""
    answer: 1
    explanation: |
      Blameless postmortems name systemic contributing factors and mechanisms to fix
      ("the tool allowed X; add a guardrail") rather than blaming an individual, and
      they always produce concrete action items.
    ref: "concepts.md#blameless-culture--postmortems"

  - id: devops-fundamentals-and-culture-040
    difficulty: intermediate
    tags: [three-ways, feedback-direction]
    question: |
      In the Three Ways, which direction does the Second Way (Feedback) flow?
    options:
      - "Right-to-left (amplifying signals from Ops/customer back upstream to Dev)"
      - "Left-to-right (the flow of work from Dev to Ops and on to the customer)"
      - "Top-to-bottom (directives cascading from management down to the engineering teams)"
      - "It has no inherent direction, since feedback in the Second Way flows equally in every direction"
    answer: 0
    explanation: |
      The First Way is left-to-right flow; the Second Way is the right-to-left
      feedback loop that amplifies signals (from production/customers) back upstream so
      problems are seen and fixed quickly.
    ref: "concepts.md#the-three-ways"

  - id: devops-fundamentals-and-culture-041
    difficulty: advanced
    tags: [scenario, dora, diagnosis]
    question: |
      A team deploys once a month, takes ~3 weeks from commit to production, has a
      30% change failure rate, and often needs several days to recover. On the DORA
      throughput dimensions, where do they sit, and what is the most useful first
      improvement lever?
    options:
      - "They already sit in the elite performance band on throughput, so no improvement lever is warranted"
      - "They should halt all production deployments until their change failure rate has been driven down to zero"
      - "They should replace the DORA keys with lines-of-code shipped as their primary throughput measure"
      - "They are low/medium throughput; reducing batch size and increasing deployment frequency (smaller, more frequent changes) is the highest-leverage first move"
    answer: 3
    explanation: |
      Monthly deploys and multi-week lead time are low-to-medium throughput. Smaller
      batches and more frequent deploys typically reduce blast radius and lead time and
      often improve stability too — the Accelerate finding that speed and stability rise
      together.
    ref: "concepts.md#the-dora-four-key-metrics"

  - id: devops-fundamentals-and-culture-042
    difficulty: intermediate
    tags: [calms, sharing]
    question: |
      Which activities best exemplify the "Sharing" pillar of CALMS?
    options:
      - "Keeping runbooks locked to the ops team on the grounds that restricting access improves operational security"
      - "Blameless postmortems, shared internal docs/tooling, and ChatOps that spread knowledge across dev and ops"
      - "Designating a single expert to be the sole owner of all deployment and release knowledge for the team"
      - "Cutting the number of recurring team meetings to zero so engineers have uninterrupted time to write code"
    answer: 1
    explanation: |
      Sharing means spreading knowledge, tooling, and responsibility across dev and
      ops — blameless postmortems, shared docs and tooling, and ChatOps. Hoarding
      knowledge in one team or person works against it.
    ref: "concepts.md#calms-framework"

  - id: devops-fundamentals-and-culture-043
    difficulty: intermediate
    tags: [sre, platform, complementary]
    question: |
      Which statement about DevOps, SRE, and Platform Engineering is most accurate?
    options:
      - "They are mutually exclusive competing methodologies, so an organisation is forced to adopt exactly one and drop the rest"
      - "Both SRE and Platform Engineering explicitly reject DevOps culture and were created as replacements for it"
      - "They are complementary — a mature org has a DevOps culture, applies SRE practices to reliability, and provides a platform to scale it"
      - "Platform Engineering only ever applies to early-stage startups and offers no value to larger enterprises"
    answer: 2
    explanation: |
      The three are complementary layers: DevOps is the umbrella philosophy, SRE is a
      prescriptive reliability implementation, and Platform Engineering productises
      self-service to scale the capability while reducing cognitive load.
    ref: "concepts.md#devops-vs-sre-vs-platform-engineering"

  - id: devops-fundamentals-and-culture-044
    difficulty: beginner
    tags: [definition, tools-vs-culture]
    question: |
      "We installed a full CI/CD toolchain but kept the same siloed teams and manual
      approval gates." Which best describes the likely outcome?
    options:
      - "The same silos with faster scripts — tools alone are not DevOps without the cultural/ownership change"
      - "The organisation is now fully practising DevOps, since owning a complete CI/CD toolchain is what defines it"
      - "Achieving DevOps is impossible here unless the newly installed toolchain is first uninstalled and removed"
      - "The existing teams will automatically adopt a blameless culture as a direct side effect of the new tooling"
    answer: 0
    explanation: |
      Tools enable DevOps but are not DevOps. Without changing incentives, ownership,
      and hand-offs, a toolchain just makes the existing silos run their scripts
      faster — the wall of confusion remains.
    ref: "concepts.md#what-devops-is-and-is-not"

  - id: devops-fundamentals-and-culture-045
    difficulty: advanced
    tags: [team-topologies, conways-law, platform]
    question: |
      In Team Topologies terms, how do stream-aligned teams and platform teams relate
      to Conway's Law?
    options:
      - "They deliberately ignore Conway's Law entirely, since team shape has no effect on the resulting architecture"
      - "Platform teams exist chiefly to slow down stream-aligned teams by adding review gates ahead of every release"
      - "Conway's Law applies only to hardware and manufacturing companies, not to software delivery organisations"
      - "Stream-aligned teams own a slice of value end-to-end and a platform team reduces their cognitive load — an intentional org shape chosen to produce the desired architecture"
    answer: 3
    explanation: |
      Team Topologies applies Conway's Law deliberately: stream-aligned teams own
      end-to-end value and platform teams lower their cognitive load, an intentional
      communication structure shaped to yield loosely-coupled, independently-deployable
      services.
    ref: "concepts.md#conways-law"

  - id: devops-fundamentals-and-culture-046
    difficulty: intermediate
    tags: [ci, branching, integration]
    question: |
      Why is frequent merging to a shared mainline the heart of Continuous
      Integration?
    options:
      - "Because it lets each developer work in isolation on a long-lived feature branch for several weeks at a time"
      - "Because it prevents branches from diverging, so integration conflicts and defects are caught early and cheaply by automated build/test"
      - "Because merging often removes the need to write any automated tests, since the merge itself validates correctness"
      - "Because it pushes each merged change straight to the production environment while bypassing any staging step"
    answer: 1
    explanation: |
      CI's whole point is to stop long-lived branches diverging. Frequent merges plus
      automated build/test surface integration problems early, when they are small and
      cheap, rather than in a painful "big bang" merge later.
    ref: "concepts.md#ci-vs-continuous-delivery-vs-continuous-deployment"
