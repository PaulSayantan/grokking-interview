topic: "CI/CD Tooling: GitHub Actions, GitLab CI & Jenkins"
domain: devops-cicd
topic_slug: cicd-tooling-actions-gitlab-jenkins
version: 1
questions:
  - id: cicd-tooling-actions-gitlab-jenkins-001
    difficulty: beginner
    tags: [github-actions, model, jobs]
    question: |
      In GitHub Actions, how do jobs within a single workflow behave by default
      with respect to ordering?
    options:
      - "They run sequentially in the order written"
      - "They run only after manual approval of each job"
      - "They run in parallel unless `needs:` establishes a dependency"
      - "They run alphabetically by job name"
    answer: 2
    explanation: |
      Jobs in a GitHub Actions workflow run in parallel by default. You create an
      ordering/dependency by adding `needs:` to a job, which makes it wait for the
      named job(s) to succeed first. Steps within a job, by contrast, run sequentially.
    ref: "concepts.md#github-actions-core-model"

  - id: cicd-tooling-actions-gitlab-jenkins-002
    difficulty: beginner
    tags: [github-actions, hierarchy]
    question: |
      What is the correct hierarchy of GitHub Actions concepts, from largest to smallest?
    options:
      - "Workflow → Job → Step (a step may use an Action)"
      - "Job → Workflow → Step → Action"
      - "Action → Step → Job → Workflow"
      - "Pipeline → Stage → Job → Runner"
    answer: 0
    explanation: |
      A workflow contains jobs; each job contains steps; a step is either a shell
      command (`run:`) or invokes a reusable action (`uses:`). "Pipeline → Stage → Job"
      is GitLab/Jenkins terminology, not GitHub Actions.
    ref: "concepts.md#github-actions-core-model"

  - id: cicd-tooling-actions-gitlab-jenkins-003
    difficulty: intermediate
    tags: [github-actions, data-sharing, gotcha]
    question: |
      A GitHub Actions job writes `build/output.txt`, and a second job that lists it in
      `needs:` tries to read the same path but finds nothing. What is the cause?
    options:
      - "The second job started before the first finished"
      - "`needs:` does not actually enforce ordering"
      - "The file was deleted by the cache action"
      - "Each job runs on a fresh runner, so filesystem state is not shared; files must be passed via artifacts or outputs"
    answer: 3
    explanation: |
      Each GitHub Actions job runs on its own fresh runner with no shared filesystem.
      To move files between jobs you must upload/download an artifact, or expose small
      values as job outputs. `needs:` correctly ordered them; the state simply did not
      carry over.
    ref: "concepts.md#github-actions-core-model"

  - id: cicd-tooling-actions-gitlab-jenkins-004
    difficulty: beginner
    tags: [github-actions, triggers]
    question: |
      Which `on:` trigger lets a GitHub Actions workflow be invoked manually from the UI
      or API?
    options:
      - "workflow_call"
      - "workflow_dispatch"
      - "schedule"
      - "repository_dispatch"
    answer: 1
    explanation: |
      `workflow_dispatch` enables a manual "Run workflow" trigger. `workflow_call` makes a
      workflow reusable by another workflow, `schedule` runs on cron, and
      `repository_dispatch` is triggered by an external API event.
    ref: "concepts.md#github-actions-core-model"

  - id: cicd-tooling-actions-gitlab-jenkins-005
    difficulty: intermediate
    tags: [github-actions, security, supply-chain]
    question: |
      What is the recommended way to reference a third-party action to reduce
      supply-chain risk?
    options:
      - "Pin to a full commit SHA (e.g. `foo/bar@a1b2c3d`)"
      - "Always use the `@latest` tag"
      - "Use a floating major-version tag like `@v3`"
      - "Copy the action's code into your repo and never update it"
    answer: 0
    explanation: |
      Tags are mutable and can be re-pointed at malicious commits (as in the 2025
      tj-actions/changed-files incident). Pinning to a full commit SHA makes the
      referenced code immutable, closing that attack vector while letting you update
      deliberately.
    ref: "concepts.md#github-actions-core-model"

  - id: cicd-tooling-actions-gitlab-jenkins-006
    difficulty: beginner
    tags: [github-actions, runners]
    question: |
      What is a defining characteristic of GitHub-hosted runners?
    options:
      - "They are long-lived machines you patch yourself"
      - "They can only run on Linux"
      - "They are ephemeral VMs provisioned per job and destroyed afterward"
      - "They give direct access to your private network by default"
    answer: 2
    explanation: |
      GitHub-hosted runners are fresh VMs created for each job and torn down when it
      finishes, giving clean isolation. They come in Linux/Windows/macOS flavours and,
      being in GitHub's cloud, have no default access to your private networks.
    ref: "concepts.md#github-actions-runners-hosted-vs-self-hosted"

  - id: cicd-tooling-actions-gitlab-jenkins-007
    difficulty: intermediate
    tags: [github-actions, self-hosted, security]
    question: |
      Why is it dangerous to attach self-hosted runners to a public repository?
    options:
      - "Public repos cannot use YAML workflows"
      - "A forked pull request can execute arbitrary code on your runner, and a non-ephemeral runner may leak state to later jobs"
      - "GitHub bills extra for public-repo self-hosted runners"
      - "Self-hosted runners cannot check out public code"
    answer: 1
    explanation: |
      Anyone can fork a public repo and open a PR whose workflow runs on your self-hosted
      runner — arbitrary code execution on your infrastructure. Because default self-hosted
      runners persist between jobs, a malicious job can also poison the environment for
      subsequent builds.
    ref: "concepts.md#github-actions-runners-hosted-vs-self-hosted"

  - id: cicd-tooling-actions-gitlab-jenkins-008
    difficulty: intermediate
    tags: [github-actions, self-hosted, use-cases]
    question: |
      Which requirement most justifies choosing a self-hosted runner over a GitHub-hosted one?
    options:
      - "You want zero infrastructure maintenance"
      - "You want GitHub to auto-patch the OS"
      - "You are building a small open-source project"
      - "You need the runner to reach resources on a private network or use GPU/custom hardware"
    answer: 3
    explanation: |
      Self-hosted runners are the answer when jobs must reach private/on-prem resources,
      need special hardware (GPUs, large machines), or a particular OS/architecture. The
      other options are exactly the strengths of hosted runners.
    ref: "concepts.md#github-actions-runners-hosted-vs-self-hosted"

  - id: cicd-tooling-actions-gitlab-jenkins-009
    difficulty: beginner
    tags: [github-actions, matrix]
    question: |
      What does a GitHub Actions build matrix accomplish?
    options:
      - "It runs the same job across combinations of parameters (e.g. OS × language version) in parallel"
      - "It encrypts secrets used across jobs"
      - "It merges multiple workflows into one file"
      - "It caches dependencies between runs"
    answer: 0
    explanation: |
      A matrix expands one job definition into parallel jobs over the Cartesian product
      of its variables (OS, runtime versions, etc.), the standard way to test broad
      compatibility from a single job block.
    ref: "concepts.md#matrix-builds-in-github-actions"

  - id: cicd-tooling-actions-gitlab-jenkins-010
    difficulty: intermediate
    tags: [github-actions, matrix, fail-fast]
    question: |
      A matrix has `strategy: { matrix: { os: [ubuntu, macos], node: [18, 20, 22] } }`
      with one `exclude` entry. Roughly how many jobs run, and what does the default
      `fail-fast` do?
    options:
      - "6 jobs; fail-fast has no effect on matrices"
      - "1 job; fail-fast retries it"
      - "5 jobs; fail-fast=true means the whole workflow is skipped"
      - "5 jobs; with default fail-fast=true, one failing job cancels the remaining in-progress matrix jobs"
    answer: 3
    explanation: |
      2×3 = 6 combinations minus one exclude = 5 jobs. `fail-fast` defaults to true, so the
      moment any matrix job fails, GitHub cancels the other in-progress matrix jobs to give
      fast feedback. Set `fail-fast: false` when you want the full failure picture.
    ref: "concepts.md#matrix-builds-in-github-actions"

  - id: cicd-tooling-actions-gitlab-jenkins-011
    difficulty: intermediate
    tags: [github-actions, matrix]
    question: |
      Which matrix key adds a specific extra combination (or extends an existing one)
      rather than removing combinations?
    options:
      - "exclude"
      - "include"
      - "max-parallel"
      - "fail-fast"
    answer: 1
    explanation: |
      `include` adds extra matrix combinations or extra properties to matching ones;
      `exclude` removes combinations. `max-parallel` caps concurrency and `fail-fast`
      controls cancellation behavior.
    ref: "concepts.md#matrix-builds-in-github-actions"

  - id: cicd-tooling-actions-gitlab-jenkins-012
    difficulty: intermediate
    tags: [github-actions, reuse, composite]
    question: |
      You want to package a repeated sequence of steps (checkout + auth + cache) so it can
      be dropped into any job as a single `uses:` step. What should you build?
    options:
      - "A reusable workflow via workflow_call"
      - "A matrix"
      - "A composite action"
      - "A shared library"
    answer: 2
    explanation: |
      A composite action bundles multiple steps into one reusable `uses:` step that runs
      inside the caller's job — ideal for a repeated step sequence. A reusable workflow
      reuses whole jobs, not a step sequence, and shared libraries are a Jenkins concept.
    ref: "concepts.md#reusable-workflows-and-composite-actions"

  - id: cicd-tooling-actions-gitlab-jenkins-013
    difficulty: advanced
    tags: [github-actions, reuse, reusable-workflow]
    question: |
      What most accurately distinguishes a reusable workflow from a composite action in
      GitHub Actions?
    options:
      - "They are two names for the same thing"
      - "A composite action can only be written in Docker; a reusable workflow only in JavaScript"
      - "A reusable workflow cannot accept inputs or secrets"
      - "A reusable workflow reuses entire jobs (called via workflow_call), while a composite action reuses a sequence of steps inside a job"
    answer: 3
    explanation: |
      A reusable workflow is a whole workflow (its own jobs) invoked with `workflow_call`
      and `uses: owner/repo/.github/workflows/x.yml@ref`; it accepts `inputs` and `secrets`.
      A composite action bundles steps into one step that runs within the caller's job.
      Rule of thumb: composite = reuse steps, reusable workflow = reuse jobs.
    ref: "concepts.md#reusable-workflows-and-composite-actions"

  - id: cicd-tooling-actions-gitlab-jenkins-014
    difficulty: beginner
    tags: [github-actions, secrets]
    question: |
      How are GitHub Actions secrets treated in workflow logs?
    options:
      - "They are automatically masked (redacted) in logs"
      - "They are printed in plaintext for debugging"
      - "They are only visible to repo admins in logs"
      - "They are stored in the artifact bundle"
    answer: 0
    explanation: |
      Secrets referenced as `${{ secrets.NAME }}` are masked/redacted in logs. Note masking
      is best-effort — transformations like base64-encoding a secret can defeat it — so you
      still must never deliberately echo secrets.
    ref: "concepts.md#secrets-environments-and-oidc-to-cloud"

  - id: cicd-tooling-actions-gitlab-jenkins-015
    difficulty: intermediate
    tags: [github-actions, environments, gates]
    question: |
      What capability do GitHub Actions "environments" add beyond storing scoped secrets?
    options:
      - "They compile the workflow into a container"
      - "Deployment protection rules such as required reviewers, wait timers, and branch restrictions"
      - "They automatically create cloud infrastructure"
      - "They convert the workflow to GitLab CI syntax"
    answer: 1
    explanation: |
      Environments (e.g. staging, production) add deployment protection rules: required
      reviewers (a manual approval gate), wait timers, and allowed branches, along with
      environment-scoped secrets. They are the standard way to gate production deploys.
    ref: "concepts.md#secrets-environments-and-oidc-to-cloud"

  - id: cicd-tooling-actions-gitlab-jenkins-016
    difficulty: advanced
    tags: [github-actions, oidc, cloud]
    question: |
      A team wants to deploy to AWS from GitHub Actions without storing long-lived AWS
      access keys. Using OIDC, which workflow permission is required and what is the core
      mechanism?
    options:
      - "`contents: write`; the workflow commits keys to the repo"
      - "`packages: write`; GitHub stores the AWS keys encrypted"
      - "`id-token: write`; the workflow mints a short-lived OIDC token that AWS exchanges (via a scoped trust policy) for temporary credentials"
      - "No permission needed; keys are injected automatically"
    answer: 2
    explanation: |
      OIDC deploys require `permissions: id-token: write` so the job can mint an OIDC token.
      AWS's IAM role trust policy, scoped to the repo/branch, exchanges that token for
      temporary STS credentials. No standing secret exists to leak or rotate.
    ref: "concepts.md#secrets-environments-and-oidc-to-cloud"

  - id: cicd-tooling-actions-gitlab-jenkins-017
    difficulty: intermediate
    tags: [github-actions, secrets, forks, security]
    question: |
      By default, are repository secrets passed to a workflow triggered by a `pull_request`
      from a fork?
    options:
      - "No — fork PRs do not receive the repo's secrets by default, a deliberate protection"
      - "Yes, always"
      - "Only if the fork owner is a collaborator's relative"
      - "Yes, but only write-scoped secrets"
    answer: 0
    explanation: |
      Workflows triggered by a fork's `pull_request` do not receive secrets by default. If
      they did, anyone could open a PR that exfiltrates them. This is a core protection
      shared across CI tools.
    ref: "concepts.md#secrets-environments-and-oidc-to-cloud"

  - id: cicd-tooling-actions-gitlab-jenkins-018
    difficulty: beginner
    tags: [gitlab-ci, model, config-file]
    question: |
      Where is a GitLab CI pipeline defined by default?
    options:
      - "In `.github/workflows/ci.yml`"
      - "In a `Jenkinsfile`"
      - "In the GitLab web UI only, not in the repo"
      - "In a `.gitlab-ci.yml` file at the repository root"
    answer: 3
    explanation: |
      GitLab CI reads a single `.gitlab-ci.yml` at the repo root by default (the path is
      configurable). `.github/workflows/*.yml` is GitHub Actions and `Jenkinsfile` is
      Jenkins.
    ref: "concepts.md#gitlab-ci-core-model-and-pipeline-config"

  - id: cicd-tooling-actions-gitlab-jenkins-019
    difficulty: intermediate
    tags: [gitlab-ci, stages]
    question: |
      In a GitLab CI pipeline with `stages: [build, test, deploy]` and no `needs:`, how do
      jobs execute?
    options:
      - "All jobs across all stages run in parallel"
      - "Every job runs strictly one at a time in file order"
      - "Jobs in the same stage run in parallel; a stage begins only after the previous stage fully succeeds"
      - "Only the first job of each stage runs"
    answer: 2
    explanation: |
      By default GitLab runs stages sequentially: all jobs in a stage run in parallel, and
      the next stage starts only once the current stage succeeds entirely. `needs:` can
      override this into a DAG.
    ref: "concepts.md#gitlab-ci-core-model-and-pipeline-config"

  - id: cicd-tooling-actions-gitlab-jenkins-020
    difficulty: intermediate
    tags: [gitlab-ci, allow-failure]
    question: |
      What does `allow_failure: true` do for a GitLab CI job?
    options:
      - "It retries the job until it passes"
      - "The job can fail without failing the overall pipeline"
      - "It marks the job as manual"
      - "It skips the job entirely"
    answer: 1
    explanation: |
      `allow_failure: true` lets a job fail without blocking the pipeline — useful for
      non-blocking checks (e.g. an experimental lint). The job is shown as failed/allowed
      but the pipeline continues.
    ref: "concepts.md#gitlab-ci-core-model-and-pipeline-config"

  - id: cicd-tooling-actions-gitlab-jenkins-021
    difficulty: intermediate
    tags: [gitlab-ci, artifacts, data-sharing]
    question: |
      A GitLab `build` job produces a binary that a later `deploy` job needs. What keyword
      makes the binary available downstream?
    options:
      - "`cache:`"
      - "`needs:` alone"
      - "`environment:`"
      - "`artifacts: { paths: [...] }`"
    answer: 3
    explanation: |
      `artifacts:` declares files to persist and pass to jobs in later stages. `cache:` is a
      speed optimization for dependencies and is not a reliable correctness mechanism for
      passing build outputs; `needs:` controls ordering, not file transfer.
    ref: "concepts.md#gitlab-ci-core-model-and-pipeline-config"

  - id: cicd-tooling-actions-gitlab-jenkins-022
    difficulty: beginner
    tags: [gitlab-ci, runners, executors]
    question: |
      In GitLab CI, what determines *how* a runner executes a job (in a container, on the
      shell, in a pod, etc.)?
    options:
      - "The runner's executor (shell, Docker, Kubernetes, etc.)"
      - "The stage name"
      - "The `artifacts` keyword"
      - "The commit message"
    answer: 0
    explanation: |
      A GitLab Runner's executor defines the execution environment: shell (on the host),
      Docker (a fresh container per job), Kubernetes (a pod per job), or autoscaling VMs.
      This is independent of stage or job names.
    ref: "concepts.md#gitlab-ci-runners-and-executors"

  - id: cicd-tooling-actions-gitlab-jenkins-023
    difficulty: intermediate
    tags: [gitlab-ci, runners, tags]
    question: |
      A GitLab job specifies `tags: [docker, arm64]`. What is the effect of these tags?
    options:
      - "They label the produced artifact"
      - "They route the job only to runners that advertise matching tags"
      - "They enable Docker layer caching"
      - "They set environment variables named docker and arm64"
    answer: 1
    explanation: |
      Runner tags are a routing mechanism: a job with `tags:` runs only on runners
      registered with all those tags. This is how you target, say, an arm64 Docker-executor
      runner among a shared pool.
    ref: "concepts.md#gitlab-ci-runners-and-executors"

  - id: cicd-tooling-actions-gitlab-jenkins-024
    difficulty: beginner
    tags: [gitlab-ci, runners, docker]
    question: |
      With the Docker executor, what does the job-level `image:` keyword specify?
    options:
      - "The base image for the final deployed container"
      - "The runner's host operating system"
      - "The container image in which that job's script runs"
      - "The registry credentials"
    answer: 2
    explanation: |
      Under the Docker executor, `image:` sets the container the job's `script` runs inside,
      giving each job a clean, reproducible environment. It is unrelated to what the app is
      ultimately deployed as.
    ref: "concepts.md#gitlab-ci-runners-and-executors"

  - id: cicd-tooling-actions-gitlab-jenkins-025
    difficulty: advanced
    tags: [gitlab-ci, needs, dag]
    question: |
      What does adding `needs:` to GitLab CI jobs change about pipeline execution?
    options:
      - "It converts the stage-ordered pipeline into a DAG, letting a job start as soon as its named dependencies finish instead of waiting for its whole stage"
      - "Nothing; needs is only documentation"
      - "It forces all jobs to run sequentially"
      - "It disables artifacts between jobs"
    answer: 0
    explanation: |
      `needs:` creates a directed acyclic graph: a job runs the instant its listed
      dependencies complete, rather than waiting for every job in prior stages. This
      shortens the critical path — e.g. a fast job can gate a deploy without waiting on
      slow siblings.
    ref: "concepts.md#gitlab-ci-needs-dag-and-includes"

  - id: cicd-tooling-actions-gitlab-jenkins-026
    difficulty: intermediate
    tags: [gitlab-ci, includes, reuse]
    question: |
      Which GitLab CI keyword pulls YAML from another project, a remote URL, or a
      GitLab-provided template into your pipeline for DRY reuse?
    options:
      - "`extends:`"
      - "`needs:`"
      - "`rules:`"
      - "`include:`"
    answer: 3
    explanation: |
      `include:` composes external configuration: `local`, `file`+`project` (another repo),
      `remote` (URL), or `template` (built-in, e.g. SAST). `extends:` reuses a single job
      definition, `needs:` builds a DAG, and `rules:` controls when jobs run.
    ref: "concepts.md#gitlab-ci-needs-dag-and-includes"

  - id: cicd-tooling-actions-gitlab-jenkins-027
    difficulty: intermediate
    tags: [gitlab-ci, anchors, hidden-jobs]
    question: |
      In GitLab CI, what is a "hidden job" (a key starting with a dot, like `.deploy-base`)
      typically used for?
    options:
      - "A job that runs only on the default branch"
      - "A template/base definition that is not executed itself but is reused via extends or YAML anchors"
      - "A secret job visible only to admins"
      - "A job that runs in the background as a daemon"
    answer: 1
    explanation: |
      A key prefixed with `.` is a hidden job: GitLab does not run it, but you can inherit
      from it with `extends:` or splice it in via a YAML anchor (`&`/`<<: *`). It's a core
      DRY building block.
    ref: "concepts.md#gitlab-ci-needs-dag-and-includes"

  - id: cicd-tooling-actions-gitlab-jenkins-028
    difficulty: beginner
    tags: [jenkins, architecture, controller]
    question: |
      In Jenkins' distributed build model, what is the recommended role of the controller
      (historically called the "master") in production?
    options:
      - "Run all builds directly for speed"
      - "Store secrets only, nothing else"
      - "Schedule builds, serve the UI/API, and store config — while delegating build execution to agents"
      - "Act purely as a load balancer with no state"
    answer: 2
    explanation: |
      The controller orchestrates: scheduling, UI/API, and configuration. Builds should run
      on agents, not the controller, for security and scalability. Running workloads on the
      controller is an anti-pattern.
    ref: "concepts.md#jenkins-architecture-and-the-controller-agent-model"

  - id: cicd-tooling-actions-gitlab-jenkins-029
    difficulty: intermediate
    tags: [jenkins, agents, labels]
    question: |
      How does a Jenkins pipeline target a build to run on a Linux agent that also has
      Docker?
    options:
      - "`runs-on: [self-hosted, linux, docker]`"
      - "`tags: [linux, docker]`"
      - "`image: linux-docker`"
      - "`agent { label 'linux && docker' }`"
    answer: 3
    explanation: |
      Jenkins pins work to nodes by label using `agent { label '...' }` with boolean label
      expressions. `runs-on` is GitHub Actions, `tags:` is GitLab, and `image:` selects a
      container in GitLab's Docker executor.
    ref: "concepts.md#jenkins-architecture-and-the-controller-agent-model"

  - id: cicd-tooling-actions-gitlab-jenkins-030
    difficulty: intermediate
    tags: [jenkins, ephemeral, kubernetes]
    question: |
      How does modern Jenkins achieve ephemeral, isolated build environments comparable to
      cloud runners?
    options:
      - "By running everything on one large static agent"
      - "By provisioning a fresh agent pod per build via the Kubernetes plugin and tearing it down afterward"
      - "By disabling all plugins during builds"
      - "By running builds on the controller in a sandbox"
    answer: 1
    explanation: |
      The Kubernetes (or EC2/Docker) plugin lets Jenkins spin up a fresh agent pod/instance
      per build and destroy it after, giving clean isolation and autoscaling — Jenkins'
      equivalent of ephemeral runners, replacing long-lived "pet" agents.
    ref: "concepts.md#jenkins-architecture-and-the-controller-agent-model"

  - id: cicd-tooling-actions-gitlab-jenkins-031
    difficulty: beginner
    tags: [jenkins, pipeline, jenkinsfile]
    question: |
      What is a `Jenkinsfile`?
    options:
      - "A text file, checked into the repo, that defines the pipeline as code (Groovy-based)"
      - "A binary artifact produced by a build"
      - "The Jenkins controller's config database"
      - "A plugin manifest"
    answer: 0
    explanation: |
      A `Jenkinsfile` is the pipeline-as-code definition committed to the repository. It is
      written in Groovy-based declarative or scripted syntax and versioned alongside the
      application code.
    ref: "concepts.md#jenkins-declarative-vs-scripted-pipeline"

  - id: cicd-tooling-actions-gitlab-jenkins-032
    difficulty: intermediate
    tags: [jenkins, declarative, scripted]
    question: |
      What best characterizes the difference between declarative and scripted Jenkins
      pipelines?
    options:
      - "Declarative is written in YAML; scripted in JSON"
      - "Scripted pipelines cannot be stored in a Jenkinsfile"
      - "Declarative uses a structured, validated `pipeline { }` model (recommended default); scripted is free-form Groovy (`node { }`) with maximum flexibility but fewer guardrails"
      - "Declarative pipelines cannot use stages"
    answer: 2
    explanation: |
      Declarative pipelines use an opinionated `pipeline { agent; stages; steps; post }`
      structure that is easier to read and validated up front — the recommended default.
      Scripted pipelines are full Groovy programs offering more power at the cost of
      maintainability. Both live in a Jenkinsfile.
    ref: "concepts.md#jenkins-declarative-vs-scripted-pipeline"

  - id: cicd-tooling-actions-gitlab-jenkins-033
    difficulty: intermediate
    tags: [jenkins, declarative, post]
    question: |
      In a declarative Jenkins pipeline, what is the `post` block used for?
    options:
      - "Defining HTTP POST endpoints"
      - "Posting the artifact to a registry"
      - "Declaring input parameters"
      - "Running steps after the pipeline/stage based on outcome (e.g. `always`, `success`, `failure`)"
    answer: 3
    explanation: |
      The `post` section defines conditional post-build actions keyed by result —
      `always`, `success`, `failure`, `unstable`, etc. — commonly used for notifications
      and cleanup (e.g. `cleanWs()`).
    ref: "concepts.md#jenkins-declarative-vs-scripted-pipeline"

  - id: cicd-tooling-actions-gitlab-jenkins-034
    difficulty: intermediate
    tags: [jenkins, plugins]
    question: |
      What is the double-edged trade-off of Jenkins' large plugin ecosystem?
    options:
      - "Plugins make Jenkins extremely extensible, but plugin sprawl, version conflicts, and unpatched plugins are a significant maintenance and security surface"
      - "Plugins are free but slow the UI slightly"
      - "Plugins only work on the controller, never on agents"
      - "Plugins must be rewritten for every Jenkins release"
    answer: 0
    explanation: |
      ~1,800+ plugins let Jenkins integrate with almost anything, its core strength. But
      that same extensibility brings dependency/version conflicts and a large,
      often-unpatched security surface — the classic Jenkins maintenance burden.
    ref: "concepts.md#jenkins-plugins-and-shared-libraries"

  - id: cicd-tooling-actions-gitlab-jenkins-035
    difficulty: advanced
    tags: [jenkins, shared-libraries, reuse]
    question: |
      Several teams want to share a common `standardBuild()` pipeline step across many
      Jenkins jobs. Which Jenkins feature is the right tool?
    options:
      - "Matrix builds"
      - "A Jenkins Shared Library loaded with `@Library` (`vars/`, `src/`)"
      - "Reusable workflows"
      - "GitLab includes"
    answer: 1
    explanation: |
      Jenkins Shared Libraries host reusable Groovy code (custom steps in `vars/`, classes
      in `src/`) in a Git repo, loaded via `@Library`. They are the Jenkins analogue of
      GitHub reusable workflows / GitLab `include` for cross-project pipeline reuse.
    ref: "concepts.md#jenkins-plugins-and-shared-libraries"

  - id: cicd-tooling-actions-gitlab-jenkins-036
    difficulty: intermediate
    tags: [jenkins, credentials, secrets]
    question: |
      In a declarative Jenkins pipeline, how are stored credentials typically injected into
      a build?
    options:
      - "Hard-coded into the Jenkinsfile"
      - "By committing them to a `.env` file in the repo"
      - "Only by manually typing them at build start"
      - "Via the Credentials plugin using `withCredentials` or `environment { X = credentials('id') }`"
    answer: 3
    explanation: |
      Jenkins stores secrets in the Credentials plugin's scoped stores and injects them at
      runtime with `withCredentials` blocks or `environment { X = credentials('id') }`,
      keeping them out of the Jenkinsfile and masked in logs.
    ref: "concepts.md#jenkins-plugins-and-shared-libraries"

  - id: cicd-tooling-actions-gitlab-jenkins-037
    difficulty: intermediate
    tags: [comparison, hosting]
    question: |
      Which statement about hosting models is correct?
    options:
      - "Jenkins offers a fully-managed SaaS just like GitHub Actions"
      - "GitHub Actions has no self-hosted option"
      - "Jenkins is self-hosted only, while GitHub Actions and GitLab CI offer managed SaaS options plus self-hosted runners"
      - "GitLab CI cannot be self-managed"
    answer: 2
    explanation: |
      Jenkins is a server you run yourself (no official SaaS). GitHub Actions and GitLab CI
      both provide managed/SaaS execution and also support self-hosted/self-managed runners,
      giving flexibility Jenkins lacks out of the box.
    ref: "concepts.md#choosing-between-github-actions-gitlab-ci-and-jenkins"

  - id: cicd-tooling-actions-gitlab-jenkins-038
    difficulty: intermediate
    tags: [comparison, decision]
    question: |
      A team on an air-gapped on-prem network needs full control over the CI server and has
      heavy existing plugin/customization investment. Which tool is the most defensible
      choice?
    options:
      - "Jenkins"
      - "GitHub Actions (GitHub-hosted)"
      - "GitLab.com SaaS runners"
      - "None can run on-prem"
    answer: 0
    explanation: |
      Jenkins' strengths — self-hosted, air-gap capable, maximally extensible/customizable —
      make it the natural fit here, accepting the maintenance cost. SaaS-first options assume
      cloud connectivity the scenario rules out.
    ref: "concepts.md#choosing-between-github-actions-gitlab-ci-and-jenkins"

  - id: cicd-tooling-actions-gitlab-jenkins-039
    difficulty: beginner
    tags: [comparison, config-files]
    question: |
      Match each tool to its pipeline definition file.
    options:
      - "GitHub Actions → Jenkinsfile; GitLab → .github/workflows; Jenkins → .gitlab-ci.yml"
      - "GitHub Actions → .github/workflows/*.yml; GitLab CI → .gitlab-ci.yml; Jenkins → Jenkinsfile"
      - "All three use .gitlab-ci.yml"
      - "GitHub Actions and Jenkins both use Jenkinsfile"
    answer: 1
    explanation: |
      GitHub Actions uses YAML files under `.github/workflows/`, GitLab CI uses a root
      `.gitlab-ci.yml`, and Jenkins uses a Groovy `Jenkinsfile`. Knowing these on sight is
      table stakes.
    ref: "concepts.md#choosing-between-github-actions-gitlab-ci-and-jenkins"

  - id: cicd-tooling-actions-gitlab-jenkins-040
    difficulty: intermediate
    tags: [runners, cost, scale]
    question: |
      For a team with very high, steady CI volume and jobs needing private-network access,
      which factor most favors self-hosted runners over cloud/hosted runners?
    options:
      - "Cloud runners cannot run tests"
      - "Self-hosted runners require no maintenance"
      - "At high steady volume, per-minute cloud billing gets expensive, and self-hosted runners can reach private resources — at the cost of you owning patching, scaling, and isolation"
      - "Cloud runners are always slower"
    answer: 2
    explanation: |
      Hosted runners bill per minute, which adds up at sustained high volume, and they lack
      default private-network access. Self-hosted runners solve both but shift patching,
      scaling, and — critically — isolation responsibility onto you.
    ref: "concepts.md#self-hosted-vs-cloud-runners-security-cost-and-scale"

  - id: cicd-tooling-actions-gitlab-jenkins-041
    difficulty: advanced
    tags: [runners, security, self-hosted]
    question: |
      What is the single most important security practice for self-hosted runners to match
      the isolation guarantee of cloud runners?
    options:
      - "Give them admin credentials so builds never fail"
      - "Run them directly on the CI controller"
      - "Reuse one warm runner for all jobs to save cost"
      - "Make them ephemeral (single-use, destroyed after one job) and never expose them to untrusted forks/PRs"
    answer: 3
    explanation: |
      The biggest gap vs cloud runners is state leaking between builds. Ephemeral,
      single-use runners plus never running untrusted fork code close that gap — preventing
      cache poisoning, secret residue, and cross-build contamination.
    ref: "concepts.md#self-hosted-vs-cloud-runners-security-cost-and-scale"

  - id: cicd-tooling-actions-gitlab-jenkins-042
    difficulty: beginner
    tags: [ephemeral, isolation]
    question: |
      What defines an "ephemeral" runner?
    options:
      - "A runner that executes exactly one job and is then destroyed, giving each build a clean environment"
      - "A runner that only runs at night"
      - "A runner with no network access"
      - "A runner shared across all repositories permanently"
    answer: 0
    explanation: |
      An ephemeral runner is single-use: it runs one job then is torn down. Each build gets
      a pristine environment, eliminating cross-build state and secret residue.
    ref: "concepts.md#ephemeral-runners-and-autoscaling"

  - id: cicd-tooling-actions-gitlab-jenkins-043
    difficulty: intermediate
    tags: [ephemeral, github-actions, autoscaling]
    question: |
      Which tool is used to autoscale ephemeral GitHub Actions self-hosted runners on
      Kubernetes, creating a runner pod per queued job?
    options:
      - "Argo CD"
      - "GitLab Runner"
      - "Actions Runner Controller (ARC)"
      - "Terraform Cloud"
    answer: 2
    explanation: |
      Actions Runner Controller (ARC) runs on Kubernetes and provisions ephemeral runner
      pods on demand per queued job, then removes them. Argo CD is GitOps CD, GitLab Runner
      is GitLab's agent, and Terraform Cloud is IaC.
    ref: "concepts.md#ephemeral-runners-and-autoscaling"

  - id: cicd-tooling-actions-gitlab-jenkins-044
    difficulty: intermediate
    tags: [ephemeral, tradeoffs, cache]
    question: |
      What is a common downside of ephemeral runners, and how is it typically mitigated?
    options:
      - "They leak secrets; mitigated by disabling logs"
      - "They lose warm local caches and pay cold-start latency; mitigated with remote caches and pre-baked images"
      - "They cannot run parallel jobs; mitigated by matrices"
      - "They only support Windows; mitigated by containers"
    answer: 1
    explanation: |
      Because each ephemeral runner starts fresh, it has no warm local cache and pays
      cold-start cost. Teams mitigate this with shared/remote caches and pre-baked runner
      images containing common toolchains and dependencies.
    ref: "concepts.md#ephemeral-runners-and-autoscaling"

  - id: cicd-tooling-actions-gitlab-jenkins-045
    difficulty: intermediate
    tags: [reuse, templating, best-practice]
    question: |
      What is the recommended practice for sharing pipeline logic across many repositories
      without a single change breaking every consumer at once?
    options:
      - "Copy-paste the pipeline into each repo and update manually"
      - "Store the pipeline only in the CI server UI"
      - "Use one giant workflow file for the whole org"
      - "Centralize shared logic in one versioned templates/shared-library repo and pin consumers to a tag or ref"
    answer: 3
    explanation: |
      A single versioned repo (ci-templates / shared library) referenced by pinned
      tag/ref gives DRY reuse while insulating consumers: they upgrade deliberately, so an
      unversioned change can't break all downstream pipelines simultaneously.
    ref: "concepts.md#pipeline-reuse-and-templating"

  - id: cicd-tooling-actions-gitlab-jenkins-046
    difficulty: advanced
    tags: [reuse, cross-tool, mapping]
    question: |
      Which mapping of "reuse whole jobs/pipeline" mechanisms across the three tools is
      correct?
    options:
      - "GitHub reusable workflows ↔ GitLab include/extends ↔ Jenkins shared libraries"
      - "GitHub matrix ↔ GitLab cache ↔ Jenkins plugins"
      - "GitHub secrets ↔ GitLab tags ↔ Jenkins agents"
      - "GitHub environments ↔ GitLab stages ↔ Jenkins post blocks"
    answer: 0
    explanation: |
      For reusing jobs/whole pipelines: GitHub reusable workflows (`workflow_call`), GitLab
      `include`/`extends`, and Jenkins shared libraries are the parallel mechanisms. The
      other options mix unrelated concepts.
    ref: "concepts.md#pipeline-reuse-and-templating"

  - id: cicd-tooling-actions-gitlab-jenkins-047
    difficulty: intermediate
    tags: [secrets, oidc, cross-tool]
    question: |
      Across GitHub Actions, GitLab CI, and Jenkins, what is the modern hardened pattern for
      authenticating to a cloud provider from a pipeline?
    options:
      - "Store a long-lived cloud access key as a CI secret in each tool"
      - "Use OIDC / short-lived federated credentials instead of stored long-lived cloud keys"
      - "Embed the key in the pipeline file and mask it"
      - "Email the key to the runner at build time"
    answer: 1
    explanation: |
      All three tools support OIDC federation to AWS/GCP/Azure, exchanging a short-lived
      identity token for temporary credentials. This removes the standing long-lived key
      that would otherwise need storing, rotating, and could leak.
    ref: "concepts.md#secrets-handling-across-ci-tools"

  - id: cicd-tooling-actions-gitlab-jenkins-048
    difficulty: intermediate
    tags: [secrets, masking, gotcha]
    question: |
      Why is relying solely on log masking to protect a secret risky?
    options:
      - "Masking slows the build significantly"
      - "Masking deletes the secret after one use"
      - "Masking only works on Jenkins"
      - "Masking is best-effort and can be defeated by transforming the secret (e.g. base64-encoding it) before printing"
    answer: 3
    explanation: |
      Masking matches the literal secret value in output; if a job transforms it (base64,
      reversing, splitting) the transformed form isn't matched and leaks. Hence the rule:
      never echo secrets, and prefer short-lived credentials over relying on masking.
    ref: "concepts.md#secrets-handling-across-ci-tools"

  - id: cicd-tooling-actions-gitlab-jenkins-049
    difficulty: intermediate
    tags: [patterns, cache, artifacts]
    question: |
      A pipeline uses caching to speed up dependency installs but relies on the cache to
      pass a compiled binary between jobs, and it intermittently fails. What is the correct
      fix?
    options:
      - "Increase the cache size limit"
      - "Disable caching entirely and rebuild in every job"
      - "Use artifacts (or job outputs) to pass build outputs between jobs; caches are a best-effort speed optimization, not a guaranteed transfer mechanism"
      - "Move both jobs into the same stage"
    answer: 2
    explanation: |
      Caches are opportunistic and may be missing or stale — they optimize speed, not
      correctness. Passing required build outputs between jobs must use artifacts (GitHub
      upload/download-artifact, GitLab `artifacts:`) or declared job outputs.
    ref: "concepts.md#common-pipeline-patterns-and-gotchas"

  - id: cicd-tooling-actions-gitlab-jenkins-050
    difficulty: intermediate
    tags: [patterns, concurrency]
    question: |
      On a busy branch, rapid successive pushes each start a full pipeline, wasting minutes
      on soon-obsolete runs. Which pattern addresses this?
    options:
      - "Concurrency control that cancels superseded runs (GitHub `concurrency:`, GitLab `interruptible: true`)"
      - "Add more runners"
      - "Increase the matrix size"
      - "Switch to scripted pipelines"
    answer: 0
    explanation: |
      Concurrency/interruptible settings cancel in-flight runs when a newer commit
      supersedes them, so only the latest change consumes full pipeline capacity — saving
      minutes and giving faster feedback on what matters.
    ref: "concepts.md#common-pipeline-patterns-and-gotchas"

  - id: cicd-tooling-actions-gitlab-jenkins-051
    difficulty: intermediate
    tags: [patterns, monorepo, path-filters]
    question: |
      In a monorepo, what pipeline feature avoids running every job on every commit
      regardless of which files changed?
    options:
      - "Larger runners"
      - "Path/change filters (GitHub `paths:`, GitLab `rules:changes`)"
      - "Disabling artifacts"
      - "Using scripted pipelines"
    answer: 1
    explanation: |
      Path/change filters run a job only when relevant files change, so a commit touching
      one service doesn't rebuild and retest the entire monorepo — a major minute-saver at
      scale.
    ref: "concepts.md#common-pipeline-patterns-and-gotchas"

  - id: cicd-tooling-actions-gitlab-jenkins-052
    difficulty: beginner
    tags: [patterns, idempotency, ephemeral]
    question: |
      Why should CI jobs be written to be self-contained and not depend on leftover state
      from a previous job on the same runner?
    options:
      - "Because YAML forbids shared state"
      - "Because it makes logs shorter"
      - "Because only the first job is allowed to write files"
      - "Because runners may be ephemeral or shared, so leftover state may not exist or may belong to another build — leading to flaky, non-reproducible results"
    answer: 3
    explanation: |
      Runners are often ephemeral (fresh each job) or shared, so assuming files/state from a
      prior job persist is unreliable and causes flaky, non-reproducible builds. Jobs should
      set up what they need explicitly and pass data via artifacts/outputs.
    ref: "concepts.md#common-pipeline-patterns-and-gotchas"
