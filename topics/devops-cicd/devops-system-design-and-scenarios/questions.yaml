topic: "DevOps System Design & Scenario Questions"
domain: devops-cicd
topic_slug: devops-system-design-and-scenarios
version: 1
questions:
  - id: devops-system-design-and-scenarios-001
    difficulty: beginner
    tags: [method, requirements, interview]
    question: |
      In a DevOps design interview, what should you do first when asked to "design a
      CI/CD pipeline for our app"?
    options:
      - "Clarify requirements and constraints (scale, deploy target, compliance, existing stack)"
      - "Immediately name a tool such as Jenkins and start configuring it"
      - "Draw the detailed Kubernetes pod networking and service-mesh diagram first"
      - "Write the Terraform for the VPC subnets and route tables right away"
    answer: 0
    explanation: |
      Senior candidates clarify before designing: team size, monorepo vs polyrepo,
      runtime/deploy target, SLA, compliance, RTO/RPO, and greenfield vs migration.
      Jumping straight to a tool signals you design in a vacuum.
    ref: "concepts.md#how-to-approach-a-devops-design-or-scenario-question"

  - id: devops-system-design-and-scenarios-002
    difficulty: beginner
    tags: [method, invariants]
    question: |
      Which of these is an "invariant" you'd typically state up front and protect
      throughout a CI/CD design?
    options:
      - "Rebuild the artifact separately from source in every environment you deploy to"
      - "Store production secrets inside the container image so they ship with the build"
      - "Always give CI long-lived admin cloud keys for convenience across every environment"
      - "Build once and promote the same immutable artifact through environments"
    answer: 3
    explanation: |
      Build-once/deploy-many guarantees you test exactly what you ship. Rebuilding per
      env, baking secrets into images, and long-lived admin keys are all anti-patterns.
    ref: "concepts.md#how-to-approach-a-devops-design-or-scenario-question"

  - id: devops-system-design-and-scenarios-003
    difficulty: intermediate
    tags: [method, trade-offs]
    question: |
      An interviewer says your answer "listed tools but never explained your choices."
      What is the most effective correction?
    options:
      - "Add even more tools to the answer to show the breadth of your knowledge"
      - "Pick whatever tool is the most popular right now and use it for absolutely everything"
      - "For each choice, state the benefit tied to a requirement, the cost, and when you'd pick the alternative"
      - "Avoid committing to any choices and just list all the available options as equally valid"
    answer: 2
    explanation: |
      Scenario questions grade method and trade-offs. The formula "I'd choose X because
      [benefit for requirement]; the cost is [downside]; I'd switch to Y if [condition]"
      demonstrates reasoning, not recitation.
    ref: "concepts.md#articulating-trade-offs-the-meta-skill"

  - id: devops-system-design-and-scenarios-004
    difficulty: beginner
    tags: [pipeline, build-once]
    question: |
      Why is "build once, deploy many" a core principle when designing a pipeline?
    options:
      - "It makes the resulting container image smaller by stripping unused build layers"
      - "It removes the need for any automated testing before promotion to production"
      - "It lets each environment compile against a different language and runtime version"
      - "It guarantees the artifact tested in staging is byte-for-byte what runs in prod"
    answer: 3
    explanation: |
      Producing one immutable artifact and promoting it means every environment runs the
      same bits, so tests are meaningful. Rebuilding per environment can introduce subtle
      differences (dependency versions, timestamps) that invalidate testing.
    ref: "concepts.md#designing-a-cicd-pipeline-for-a-microservices-application"

  - id: devops-system-design-and-scenarios-005
    difficulty: intermediate
    tags: [pipeline, microservices, stages]
    question: |
      What is a sensible ordering of stages for a microservice pipeline?
    options:
      - "Deploy to prod → build the artifact → run tests → scan for vulnerabilities afterward"
      - "Publish the artifact → build it → deploy to every environment → run tests at the end"
      - "Build once → unit/component tests → static analysis (SAST/SCA/IaC scan) → publish signed artifact → deploy/promote → post-deploy verify"
      - "Scan the repo → deploy straight to prod → build the artifact → roll back on failure"
    answer: 2
    explanation: |
      The value stream flows commit → build → test → scan → immutable artifact →
      promote/deploy → verify/observe. Fast cheap checks run early to fail fast; you
      never deploy before building/testing.
    ref: "concepts.md#designing-a-cicd-pipeline-for-a-microservices-application"

  - id: devops-system-design-and-scenarios-006
    difficulty: intermediate
    tags: [microservices, contract-testing]
    question: |
      For many independently deployable services, which testing approach best catches
      breaking API changes without a slow full end-to-end matrix on every commit?
    options:
      - "Consumer-driven contract testing (e.g., Pact) between services"
      - "Only manual QA sign-off by a dedicated tester before each and every release"
      - "Running the entire end-to-end suite against every service on every single commit"
      - "Skipping integration concerns entirely and relying on production monitoring to catch breaks"
    answer: 0
    explanation: |
      Contract tests verify each producer/consumer pair against an agreed contract, so a
      breaking change is caught cheaply and locally without spinning up the whole system.
      Full E2E on every commit is slow and flaky at scale.
    ref: "concepts.md#designing-a-cicd-pipeline-for-a-microservices-application"

  - id: devops-system-design-and-scenarios-007
    difficulty: intermediate
    tags: [microservices, distributed-monolith]
    question: |
      What is a "distributed monolith," and why is it a warning sign in a microservices
      design?
    options:
      - "A monolith deployed across many servers behind a load balancer; it is always the ideal design"
      - "A single service that has simply grown very large in code size and line count over time"
      - "A CI pipeline that builds many independent artifacts in parallel on separate runners"
      - "Services that must be deployed together in lockstep, losing independent deployability"
    answer: 3
    explanation: |
      If services are so tightly coupled they can only be released together, you get the
      complexity of microservices without independent deployability — the worst of both.
      Contracts and versioning keep services independently deployable.
    ref: "concepts.md#designing-a-cicd-pipeline-for-a-microservices-application"

  - id: devops-system-design-and-scenarios-008
    difficulty: advanced
    tags: [monorepo, ci-scaling, affected-targets]
    question: |
      A team moves 40 services into a monorepo and CI time explodes because every commit
      triggers every build. What is the correct fix?
    options:
      - "Use affected-target detection (build graph like Bazel/Nx or path filters) plus remote caching"
      - "Disable all the test stages to speed up CI and re-enable them just before release"
      - "Split the monorepo back into 40 separate repos immediately with no other tooling changes"
      - "Run all 40 builds strictly sequentially on one very large high-core-count machine"
    answer: 0
    explanation: |
      A monorepo without affected-graph tooling rebuilds everything on every commit.
      Build graphs (Bazel/Nx/Turborepo) or CI path filters build only changed targets,
      and remote caching reuses prior outputs — that's what makes monorepo CI scale.
    ref: "concepts.md#monorepo-vs-polyrepo-for-cicd"

  - id: devops-system-design-and-scenarios-009
    difficulty: intermediate
    tags: [monorepo, polyrepo, trade-offs]
    question: |
      Which statement correctly contrasts monorepo and polyrepo for CI/CD?
    options:
      - "Polyrepo makes atomic cross-service changes trivial to land in a single pull request"
      - "Monorepo makes atomic cross-service changes easy but needs strong caching/selective builds to scale CI"
      - "Monorepo gives finer-grained per-service repository access control than a polyrepo setup does"
      - "Polyrepo completely eliminates all version drift and dependency skew between services"
    answer: 1
    explanation: |
      Monorepos enable atomic cross-service commits but require affected-graph builds and
      caching or CI blows up. Polyrepos scope builds naturally and offer finer access
      control, but atomic changes span many PRs and version drift is easier.
    ref: "concepts.md#monorepo-vs-polyrepo-for-cicd"

  - id: devops-system-design-and-scenarios-010
    difficulty: intermediate
    tags: [polyrepo, shared-library]
    question: |
      In a polyrepo setup, what is the main pain of changing a widely used shared library?
    options:
      - "The change fans out into many coordinated PRs and version bumps across repos"
      - "It is technically impossible to change a shared library once it is used in a polyrepo"
      - "Shared libraries in a polyrepo cannot be versioned or published to an artifact registry"
      - "CI compute cost per individual repo increases dramatically once a library is shared"
    answer: 0
    explanation: |
      With code split across repos, a shared-library change requires coordinated PRs and
      version bumps in every consuming repo, so contract testing and disciplined
      versioning become essential to avoid breakage.
    ref: "concepts.md#monorepo-vs-polyrepo-for-cicd"

  - id: devops-system-design-and-scenarios-011
    difficulty: beginner
    tags: [zero-downtime, database, expand-contract]
    question: |
      Zero-downtime deployment requires which condition to hold during the rollout?
    options:
      - "Only the new version ever runs at any given instant during the entire rollout"
      - "The database must be taken offline briefly while the new version is being swapped in"
      - "Old and new versions run simultaneously for a window, so changes must be backward-compatible"
      - "All users must be forcibly logged out during the swap so no active sessions remain"
    answer: 2
    explanation: |
      Rolling/canary/blue-green all have a window where both versions serve traffic. Every
      change (especially schema) must be backward-compatible during that overlap or one
      version breaks.
    ref: "concepts.md#designing-a-zero-downtime-deployment-strategy--db-migration--rollback"

  - id: devops-system-design-and-scenarios-012
    difficulty: advanced
    tags: [zero-downtime, database, migration]
    question: |
      You must rename a column and start using the new name, with zero downtime. Which
      sequence is safe?
    options:
      - "Add the new column (expand) → dual-write/backfill → deploy new code → drop old column in a LATER release (contract)"
      - "Rename the column in place and deploy the new code that uses it in the same single release"
      - "Drop the old column first to keep the schema clean, then deploy the new application code"
      - "Add the new column as NOT NULL without a default value, then deploy the new code on top"
    answer: 0
    explanation: |
      Expand/contract (parallel change): make additive backward-compatible changes,
      dual-write and backfill, deploy new code, and only remove the old column in a later
      release after all instances run new code. Renaming/dropping in one release breaks
      the version still using the old name during the overlap.
    ref: "concepts.md#designing-a-zero-downtime-deployment-strategy--db-migration--rollback"

  - id: devops-system-design-and-scenarios-013
    difficulty: advanced
    tags: [zero-downtime, rollback, database]
    question: |
      Why can a destructive DB migration (drop/rename) make application rollback
      impossible?
    options:
      - "It silently corrupts the container image layers stored in the registry during deploy"
      - "Rollback is fundamentally never possible in any deployment that touches a database"
      - "Once the old schema is gone, the previous code version can no longer run against the new schema"
      - "It permanently disables the load balancer health checks that gate the rollout"
    answer: 2
    explanation: |
      If you drop/rename what the old code depends on, rolling the app back to the
      previous version leaves it running against an incompatible schema. Expand/contract
      keeps rollback safe; where a change must be destructive, plan to roll forward.
    ref: "concepts.md#designing-a-zero-downtime-deployment-strategy--db-migration--rollback"

  - id: devops-system-design-and-scenarios-014
    difficulty: intermediate
    tags: [zero-downtime, database, locking]
    question: |
      Which migration detail is most likely to break a zero-downtime deploy on a large
      table?
    options:
      - "A long-running ALTER that takes a heavy lock on a large table"
      - "Adding a nullable column with no default to the end of the table definition"
      - "Creating a brand-new, separate table that no existing queries reference yet"
      - "Adding a new index concurrently in the background without blocking writes"
    answer: 0
    explanation: |
      Additive changes (nullable column, new table, concurrent index) are safe. A
      long-running ALTER that locks a big table stalls queries and causes an effective
      outage; use online-DDL tooling or additive steps instead.
    ref: "concepts.md#designing-a-zero-downtime-deployment-strategy--db-migration--rollback"

  - id: devops-system-design-and-scenarios-015
    difficulty: intermediate
    tags: [iac, terraform, modules]
    question: |
      What is the primary benefit of using Terraform modules for dev/staging/prod?
    options:
      - "Modules make Terraform state files completely unnecessary for tracking resources"
      - "Modules automatically encrypt all secrets and sensitive variables passed into them"
      - "Each environment instantiates the same module with different variables, killing copy-paste drift"
      - "Modules remove the need for a remote backend by storing everything in the module itself"
    answer: 2
    explanation: |
      A module encapsulates a reusable unit; each environment calls it with different
      inputs (sizes, counts, CIDRs). The definition stays DRY and identical across envs
      while parameters vary, eliminating drift from copy-pasted configs.
    ref: "concepts.md#designing-multi-environment-infrastructure-with-iac"

  - id: devops-system-design-and-scenarios-016
    difficulty: advanced
    tags: [iac, terraform, state, isolation]
    question: |
      Which practice most strongly bounds the blast radius of a bad `terraform apply` so
      dev can never accidentally modify prod?
    options:
      - "Using a single shared state file that spans all of the environments together"
      - "Running apply directly without ever generating and reviewing a plan step first"
      - "Storing the state file locally on each individual engineer's laptop workstation"
      - "Separate state per environment (distinct backends/state files)"
    answer: 3
    explanation: |
      Separate state per environment means an apply in dev operates only on dev's state
      and resources. A single shared state or local state files makes cross-environment
      accidents and team conflicts far more likely.
    ref: "concepts.md#designing-multi-environment-infrastructure-with-iac"

  - id: devops-system-design-and-scenarios-017
    difficulty: intermediate
    tags: [iac, promotion]
    question: |
      How should infrastructure changes be "promoted" across environments with IaC?
    options:
      - "Hand-edit the resources directly in the cloud console separately for each environment"
      - "Only ever change prod directly by hand and then copy the changes back down to dev"
      - "Promote the same versioned module (git tag) — apply in dev, then staging, then prod, gated in a pipeline"
      - "Regenerate all of the infrastructure from scratch independently for each environment"
    answer: 2
    explanation: |
      Treat infra like code: pin a module version, apply it through dev → staging → prod
      with plan-in-CI and apply-on-approval. Console edits cause drift and are not
      reproducible.
    ref: "concepts.md#designing-multi-environment-infrastructure-with-iac"

  - id: devops-system-design-and-scenarios-018
    difficulty: intermediate
    tags: [terraform, state, locking]
    question: |
      Why do teams use remote Terraform state with a lock (e.g., S3 + DynamoDB lock)?
    options:
      - "To prevent concurrent applies from corrupting shared state and to share state across the team"
      - "To make terraform plan run without any cloud provider credentials configured at all"
      - "To avoid ever having to run terraform apply against the real infrastructure again"
      - "To store secrets in plaintext safely on individual engineer laptops without a backend"
    answer: 0
    explanation: |
      Remote state lets the team share one source of truth; the lock serializes applies so
      two people can't corrupt state simultaneously. State can hold sensitive values, so
      the backend must be encrypted and access-restricted.
    ref: "concepts.md#terraform-state-locking-and-drift-at-scale"

  - id: devops-system-design-and-scenarios-019
    difficulty: advanced
    tags: [terraform, state, scale]
    question: |
      A single monolithic Terraform state for an entire account makes every plan slow and
      risky. What is the recommended structural fix?
    options:
      - "Delete the state file periodically so Terraform regenerates it fresh on the next plan"
      - "Split state by blast radius / change frequency and reference outputs via remote state data sources"
      - "Edit the state JSON by hand to delete the slow resources so plan skips them entirely"
      - "Disable state locking so concurrent plans and applies can run at the same time"
    answer: 1
    explanation: |
      Splitting state (e.g., networking/IAM separate from app infra) keeps plans fast and
      bounds risk; cross-references use `terraform_remote_state`/data sources. Never
      hand-edit state — use `state mv/rm/import`.
    ref: "concepts.md#terraform-state-locking-and-drift-at-scale"

  - id: devops-system-design-and-scenarios-020
    difficulty: intermediate
    tags: [terraform, drift]
    question: |
      Someone changed a security group in the cloud console. How do you detect and handle
      this "drift" with Terraform?
    options:
      - "Terraform cannot detect console changes at all, so out-of-band edits stay invisible until something breaks"
      - "Delete and recreate the entire environment from scratch so the live state matches the code again"
      - "Ignore it; Terraform silently overwrites the drift back to desired state on the next scheduled refresh"
      - "Run `terraform plan` (e.g., periodically in CI) to surface drift, then reconcile by reverting or importing"
    answer: 3
    explanation: |
      `plan` compares real infrastructure to desired state and reports drift. Running it
      periodically in CI catches out-of-band changes; you reconcile by re-applying to
      revert or importing the change into config.
    ref: "concepts.md#terraform-state-locking-and-drift-at-scale"

  - id: devops-system-design-and-scenarios-021
    difficulty: beginner
    tags: [secrets, fleet]
    question: |
      Where should application secrets for a large fleet be stored?
    options:
      - "Committed to git in an encrypted-at-rest repo so the whole team can pull them on checkout"
      - "Baked into the container image at build time so every environment ships with them preloaded"
      - "In a secrets manager (Vault / cloud secret store), injected at deploy/runtime"
      - "Hard-coded in the Dockerfile as ENV lines so the runtime reads them straight from the layer"
    answer: 2
    explanation: |
      Secrets belong in a dedicated store (Vault, AWS/GCP secret managers) and are injected
      at runtime, never committed to git or baked into images where they leak into every
      layer and registry copy.
    ref: "concepts.md#secrets-management-for-a-fleet"

  - id: devops-system-design-and-scenarios-022
    difficulty: advanced
    tags: [secrets, oidc, ci]
    question: |
      What is the modern best practice for authenticating a GitHub Actions job to a cloud
      provider without long-lived static keys?
    options:
      - "Store a long-lived admin access key as an encrypted repository secret and read it into each job"
      - "Email the static credentials to the runner at job start and have the workflow parse them from the inbox"
      - "Embed the secret access key directly in the workflow YAML and rotate it manually once a quarter"
      - "OIDC federation: the CI job exchanges a short-lived identity token for a scoped cloud IAM role"
    answer: 3
    explanation: |
      OIDC lets the pipeline present a signed token that the cloud trusts to assume a
      scoped role, issuing short-lived credentials. This removes long-lived static keys
      stored as CI secrets — a top hardening practice.
    ref: "concepts.md#secrets-management-for-a-fleet"

  - id: devops-system-design-and-scenarios-023
    difficulty: advanced
    tags: [secrets, gitops, kubernetes]
    question: |
      In a GitOps workflow you want secrets to live in git safely. Which approach fits?
    options:
      - "Commit plaintext secrets directly; a private repo with restricted membership is confidential enough"
      - "Sealed Secrets / SOPS: store ciphertext in git that only the cluster can decrypt"
      - "Disable GitOps for anything involving secrets and deploy those pieces manually with kubectl instead"
      - "Base64-encode the secrets before committing them so the values are obfuscated in the manifests"
    answer: 1
    explanation: |
      Sealed Secrets and SOPS encrypt secret values so the ciphertext can safely live in
      git; only the cluster (holding the private key) can decrypt. Base64 is encoding, not
      encryption, and plaintext in git is a leak.
    ref: "concepts.md#secrets-management-for-a-fleet"

  - id: devops-system-design-and-scenarios-024
    difficulty: intermediate
    tags: [secrets, kubernetes, external-secrets]
    question: |
      What does the External Secrets Operator do in a Kubernetes fleet?
    options:
      - "Encrypts container images at rest in the registry before pods pull and run them"
      - "Rotates and renews the TLS certificates terminated on the cluster's ingress load balancers"
      - "Scans application source and manifests for hardcoded credentials and blocks the offending commits"
      - "Syncs secrets from an external store (Vault/cloud) into native Kubernetes Secrets for pods to consume"
    answer: 3
    explanation: |
      ESO watches a source of truth (Vault, AWS/GCP secret managers) and materializes the
      values as Kubernetes Secrets, so pods consume them normally while the real source
      stays centralized and auditable.
    ref: "concepts.md#secrets-management-for-a-fleet"

  - id: devops-system-design-and-scenarios-025
    difficulty: advanced
    tags: [secrets, vault, dynamic]
    question: |
      What advantage do Vault "dynamic secrets" (e.g., per-app short-lived DB credentials)
      provide?
    options:
      - "They never expire, so long-running jobs never have to re-authenticate mid-flight"
      - "They can be committed to git without risk because Vault re-signs them on every checkout"
      - "Credentials are minted on demand and short-lived, so a leaked credential expires quickly and rotation is automatic"
      - "They eliminate the need for any access-control policy since each credential is unique per app"
    answer: 2
    explanation: |
      Dynamic secrets are generated per request with a short TTL, so exposure windows are
      tiny and rotation is built in. That's far safer than a static shared DB password that
      lives forever.
    ref: "concepts.md#secrets-management-for-a-fleet"

  - id: devops-system-design-and-scenarios-026
    difficulty: intermediate
    tags: [migration, brownfield, cd]
    question: |
      You're moving a team from manual deploys to automated CD. What should you establish
      first?
    options:
      - "Continuous deployment straight to prod with no gates on day one so the team feels the speed"
      - "A canary release strategy first, rolling out to 5% of traffic before you have any automated tests"
      - "Delete the old manual runbook immediately so nobody is tempted to fall back to hand deploys"
      - "Reliable CI: every commit builds and tests automatically, with everything in version control"
    answer: 3
    explanation: |
      You can't safely automate deploys you can't reproducibly build and test. Establish CI
      and build-once artifacts first, then codify deploys, add safety nets, and only later
      remove the human gate.
    ref: "concepts.md#migrating-from-manual-deploys-to-automated-cd"

  - id: devops-system-design-and-scenarios-027
    difficulty: intermediate
    tags: [migration, rollback, safety]
    question: |
      When automating deploys, what must exist BEFORE you remove the human approval and go
      fully continuous?
    options:
      - "A bigger release batch size so fewer risky deploys reach production each week"
      - "Automated smoke tests, health checks, and a scripted, tested rollback"
      - "A single giant weekly release window so all changes are reviewed together at once"
      - "Manual database edits applied by an on-call engineer during each deploy window"
    answer: 1
    explanation: |
      Removing the human is only safe once machines catch failures (smoke tests, health
      gates) and can recover fast (scripted rollback). Introduce a safe strategy
      (blue-green/canary) first so failures have small blast radius.
    ref: "concepts.md#migrating-from-manual-deploys-to-automated-cd"

  - id: devops-system-design-and-scenarios-028
    difficulty: intermediate
    tags: [migration, batch-size, dora]
    question: |
      Which mindset best reflects the DORA research when migrating toward frequent
      deploys?
    options:
      - "Reduce batch size — smaller, more frequent changes are easier to test and roll back, and improve stability"
      - "Bigger, less frequent releases are safer because each one gets more thorough manual QA before shipping"
      - "Speed and stability are a strict trade-off; pick one and accept you cannot improve the other metric"
      - "Skip the metrics entirely; experienced engineers' intuition about risk is enough to guide the migration"
    answer: 0
    explanation: |
      DORA shows small batches raise throughput AND stability together. Frequent tiny
      changes are lower risk per change and recover faster; large infrequent releases
      concentrate risk.
    ref: "concepts.md#migrating-from-manual-deploys-to-automated-cd"

  - id: devops-system-design-and-scenarios-029
    difficulty: advanced
    tags: [platform, idp, self-service]
    question: |
      What is the core goal of an internal developer platform (IDP) / self-service
      platform?
    options:
      - "Force every team through a manual ops ticket for each change so the platform team can review it"
      - "Let product teams ship independently on paved-road golden paths while the platform encodes standards"
      - "Centralize all deploys so only the platform team can release, keeping a single point of control"
      - "Remove all standards so teams do whatever they want with their own bespoke pipelines and tooling"
    answer: 1
    explanation: |
      An IDP provides golden paths (templates, self-service provisioning) so teams move
      fast with security/observability/compliance baked in. It balances standardization
      (leverage) with autonomy (velocity), avoiding ticket-driven bottlenecks.
    ref: "concepts.md#designing-a-self-service-developer-platform-idp"

  - id: devops-system-design-and-scenarios-030
    difficulty: advanced
    tags: [platform, guardrails, policy-as-code]
    question: |
      In a self-service platform, how do you enforce standards across many teams without
      becoming a review bottleneck?
    options:
      - "Guardrails via policy-as-code (e.g., OPA/Conftest, Kyverno) plus golden-path templates"
      - "Manually review every PR and every deploy by a dedicated platform team sitting in the release path"
      - "Trust teams to remember and apply all the standards unaided, then audit them quarterly for lapses"
      - "Freeze all deploys until a platform engineer verifies the standards are met by hand on each release"
    answer: 0
    explanation: |
      Guardrails-not-gates: policy-as-code automatically enforces rules, and golden-path
      templates make the compliant option the easy default. Manual gates don't scale and
      become the bottleneck.
    ref: "concepts.md#designing-a-self-service-developer-platform-idp"

  - id: devops-system-design-and-scenarios-031
    difficulty: intermediate
    tags: [platform, product-thinking]
    question: |
      "Platform as a product" implies which behavior from the platform team?
    options:
      - "Ship the platform once and never iterate, treating it as finished internal infrastructure"
      - "Treat internal developers as customers: measure adoption/DX, own reliability, and maintain a roadmap"
      - "Ignore developer feedback to keep the standards rigid and identical across every team forever"
      - "Mandate platform usage org-wide without ever measuring whether it actually helps teams ship faster"
    answer: 1
    explanation: |
      Product thinking means measuring adoption and developer experience, owning the
      platform's reliability, and evolving it based on user needs — otherwise teams route
      around a platform that doesn't help them.
    ref: "concepts.md#designing-a-self-service-developer-platform-idp"

  - id: devops-system-design-and-scenarios-032
    difficulty: intermediate
    tags: [ci-scaling, diagnosis]
    question: |
      CI takes 45 minutes. Before optimizing, what should you do first?
    options:
      - "Buy the largest high-core-count runners available immediately and assume more CPU fixes it"
      - "Delete about half the tests so the suite finishes faster and re-add them selectively later"
      - "Move everything into a single monorepo on the assumption shared caching will speed it up"
      - "Measure where time goes — queue time vs build vs test vs deploy — and target the biggest contributor"
    answer: 3
    explanation: |
      Optimize the actual constraint. Long queue time → scale runners; long test time →
      parallelize/select; rebuilding unchanged targets → caching/affected graph. Guessing
      wastes effort.
    ref: "concepts.md#scaling-ci-runner-fleet-caching-and-parallelization"

  - id: devops-system-design-and-scenarios-033
    difficulty: intermediate
    tags: [ci-scaling, caching]
    question: |
      Your CI reuses a dependency cache but occasionally serves stale build outputs.
      What's the root issue?
    options:
      - "The cache key isn't scoped correctly, so it returns outputs that don't match the current inputs"
      - "Caching should never be used in CI because artifacts must be rebuilt fresh on every commit"
      - "The runners are provisioned with too much memory, so they hold onto old outputs across jobs"
      - "Tests are running in parallel, and parallel shards overwrite each other's cached results"
    answer: 0
    explanation: |
      Cache correctness depends on the key. Too-loose keys serve stale/poisoned results;
      too-tight keys miss and slow builds. Key on the true inputs (lockfiles, source
      hashes) so hits are frequent and always valid.
    ref: "concepts.md#scaling-ci-runner-fleet-caching-and-parallelization"

  - id: devops-system-design-and-scenarios-034
    difficulty: advanced
    tags: [ci-scaling, runners, ephemeral]
    question: |
      Why prefer autoscaled ephemeral runners (fresh per job) for a busy CI fleet?
    options:
      - "They keep warm state and dependencies between jobs to speed up subsequent build steps"
      - "They remove the need for any remote caching because the local disk is always pre-populated"
      - "They absorb bursts without paying for idle capacity and improve security/reproducibility via clean environments"
      - "They guarantee tests never fail because each job runs in a pristine, fully isolated sandbox"
    answer: 2
    explanation: |
      On-demand runners scale with load so you don't pay for idle capacity, and a fresh
      environment per job prevents state leakage between builds — better reproducibility
      and a smaller security surface.
    ref: "concepts.md#scaling-ci-runner-fleet-caching-and-parallelization"

  - id: devops-system-design-and-scenarios-035
    difficulty: intermediate
    tags: [ci-scaling, parallelization, flaky-tests]
    question: |
      A slow test suite dominates CI and has several flaky tests eroding trust. Which
      combination addresses both?
    options:
      - "Run everything sequentially and automatically rerun the whole pipeline three times on any failure"
      - "Delete all the currently failing tests permanently so the suite goes green and stays fast"
      - "Only run the full test suite once a week on a schedule and let commits merge without it in between"
      - "Shard/parallelize the suite and quarantine flaky tests so they don't block or mask real failures"
    answer: 3
    explanation: |
      Sharding across parallel jobs cuts wall-clock time; quarantining known-flaky tests
      keeps them from blocking the pipeline or hiding real regressions while they're fixed
      (pipeline-level flaky management).
    ref: "concepts.md#scaling-ci-runner-fleet-caching-and-parallelization"

  - id: devops-system-design-and-scenarios-036
    difficulty: intermediate
    tags: [deploy-frequency, trunk-based, feature-flags]
    question: |
      Which pair most directly enables deploying to production at any time, safely?
    options:
      - "GitFlow with long-lived release branches and a manual QA sign-off before each merge to main"
      - "Trunk-based development plus feature flags (deploy dark, release by toggle)"
      - "Quarterly release trains that batch every team's changes into one large coordinated deploy window"
      - "Disabling the automated test gates so green builds ship to production without waiting on the suite"
    answer: 1
    explanation: |
      Trunk-based development keeps main always releasable; feature flags hide unfinished
      work so you can deploy anytime and decouple deploy from release. This is the classic
      high-frequency, low-risk combination.
    ref: "concepts.md#reducing-deploy-time-and-increasing-deploy-frequency-safely"

  - id: devops-system-design-and-scenarios-037
    difficulty: advanced
    tags: [deploy-frequency, dora, stability]
    question: |
      A manager insists you must slow down deploys to improve stability. What does the
      DORA evidence say?
    options:
      - "Correct — deploying less often always means fewer failures, since each rare release gets far more manual scrutiny before it ships"
      - "Stability and deploy speed are fundamentally unrelated dimensions, so improving one has no measurable effect on the other at all"
      - "Elite teams achieve high deploy frequency AND low change-failure rate; small batches plus automation deliver speed and stability together"
      - "You should stop measuring stability entirely and focus purely on raising raw deploy throughput as fast as possible instead"
    answer: 2
    explanation: |
      DORA/Accelerate found throughput and stability move together for elite performers.
      Small batches, automated testing, and progressive delivery let you go fast without
      raising change-failure rate.
    ref: "concepts.md#reducing-deploy-time-and-increasing-deploy-frequency-safely"

  - id: devops-system-design-and-scenarios-038
    difficulty: beginner
    tags: [incident, mitigation, mttr]
    question: |
      Prod is down right after a deploy. What should you do first?
    options:
      - "Start a full root-cause analysis, tracing logs and metrics to the exact commit, before touching anything in production"
      - "Mitigate immediately — roll back the recent deploy (or fail over / toggle a flag) to stop the bleeding"
      - "Wait until normal business hours so the whole team can investigate together with full staffing before acting"
      - "Rewrite the failing service from scratch and redeploy a clean build once the corrected code passes CI"
    answer: 1
    explanation: |
      Mitigate before diagnose: restore service first, and since most incidents follow a
      change, rollback is usually the fastest lever. Root-causing a live outage before
      stopping impact just prolongs it.
    ref: "concepts.md#designing-incident-response-for-an-outage"

  - id: devops-system-design-and-scenarios-039
    difficulty: intermediate
    tags: [incident, roles, incident-commander]
    question: |
      In a structured incident response, what is the role of the Incident Commander (IC)?
    options:
      - "To coordinate the response, assign roles (comms/ops), and drive the incident to resolution"
      - "To personally write and merge all the code fixes while the rest of the responders stand by and wait"
      - "To identify and assign blame to whichever engineer's change caused the outage so it can be recorded"
      - "To approve the next quarter's engineering roadmap and reprioritize feature work based on the outage"
    answer: 0
    explanation: |
      The IC owns coordination and decision-making during the incident, delegating comms
      and hands-on ops so the response is organized. Blame is explicitly out of scope — the
      follow-up is a blameless postmortem.
    ref: "concepts.md#designing-incident-response-for-an-outage"

  - id: devops-system-design-and-scenarios-040
    difficulty: intermediate
    tags: [incident, what-changed, observability]
    question: |
      Why is "what changed?" often the highest-yield first diagnostic question in an
      outage?
    options:
      - "Because changes are almost always irrelevant to incidents, which are instead driven by random hardware and network faults"
      - "Because most incidents are triggered by a recent change, so deploy markers/config changes quickly point to the cause"
      - "Because it identifies which engineer to hold accountable faster than any other diagnostic question you could ask"
      - "Because it lets you resolve the outage without ever consulting dashboards, traces, or other observability tooling"
    answer: 1
    explanation: |
      Empirically most incidents follow a deploy or config change, so correlating the
      timeline with deploy markers and recent changes (visible in observability) narrows
      the cause fast and often confirms rollback as the fix.
    ref: "concepts.md#designing-incident-response-for-an-outage"

  - id: devops-system-design-and-scenarios-041
    difficulty: intermediate
    tags: [incident, postmortem, culture]
    question: |
      What is the purpose of a blameless postmortem?
    options:
      - "To formally identify the single engineer responsible and apply disciplinary action so the mistake is not repeated"
      - "To close the incident quickly with no written documentation once service has been fully restored to normal"
      - "To confirm that nothing about the current system needs to change because the outage was a one-off fluke"
      - "To build a timeline, find systemic contributing causes, and produce action items so it doesn't recur"
    answer: 3
    explanation: |
      Blameless postmortems focus on systemic fixes, not individuals, so people report
      honestly and the organization actually learns. Owned action items prevent recurrence.
    ref: "concepts.md#designing-incident-response-for-an-outage"

  - id: devops-system-design-and-scenarios-042
    difficulty: beginner
    tags: [dr, rto, rpo]
    question: |
      What do RTO and RPO measure in disaster recovery?
    options:
      - "RTO = the acceptable amount of data loss in a failure; RPO = the acceptable length of downtime during recovery"
      - "RTO = acceptable downtime (recovery time); RPO = acceptable data loss (recovery point)"
      - "Both simply measure the total monthly dollar cost of running and maintaining the disaster-recovery solution"
      - "RTO = the number of regions you replicate into; RPO = the number of point-in-time backups you retain"
    answer: 1
    explanation: |
      RTO is how fast you must be back (max downtime); RPO is how much data you can afford
      to lose (how far back the last usable backup is). Together they drive DR architecture
      and cost.
    ref: "concepts.md#disaster-recovery-rto-rpo-and-runbooks"

  - id: devops-system-design-and-scenarios-043
    difficulty: advanced
    tags: [dr, strategies, cost]
    question: |
      A business needs near-zero RTO/RPO and will pay for it. Which DR strategy fits?
    options:
      - "Backup and restore — periodic snapshots to object storage, rebuilding the environment from scratch after a disaster"
      - "Pilot light — a minimal always-on core in the second region that is scaled up only once a failover is triggered"
      - "Multi-site active/active (full capacity serving in two or more regions)"
      - "No DR plan at all, accepting whatever downtime and data loss occur and rebuilding manually if disaster strikes"
    answer: 2
    explanation: |
      Active/active runs full capacity in multiple regions serving live traffic, so
      failover is near-instant with minimal data loss — the highest cost tier. Backup/
      restore and pilot light trade lower cost for slower recovery.
    ref: "concepts.md#disaster-recovery-rto-rpo-and-runbooks"

  - id: devops-system-design-and-scenarios-044
    difficulty: intermediate
    tags: [dr, runbook, testing]
    question: |
      Why do experienced teams insist on regularly testing DR runbooks (e.g., game days)?
    options:
      - "Because an untested runbook often fails in a real outage — backups that were never restored, missing failover steps"
      - "Because runbooks exist purely to satisfy compliance auditors and are never actually meant to be executed by responders"
      - "Because deliberately triggering DR causes a controlled outage, and surviving that outage is what proves the system is resilient"
      - "Because disaster recovery procedures are never actually needed once the primary region is configured for high availability"
    answer: 0
    explanation: |
      The classic failure is discovering during a real incident that the backup isn't
      restorable or the failover steps are wrong. Regular tested failovers turn a hopeful
      document into a reliable procedure.
    ref: "concepts.md#disaster-recovery-rto-rpo-and-runbooks"

  - id: devops-system-design-and-scenarios-045
    difficulty: beginner
    tags: [dora, four-keys]
    question: |
      Which set correctly lists the four DORA key metrics?
    options:
      - "CPU utilization, memory consumption, disk I/O, and network bandwidth measured across the production fleet"
      - "Lines of code shipped, number of commits merged, total pull-request count, and number of active reviewers"
      - "Deployment frequency, lead time for changes, change-failure rate, failed-deployment recovery time (MTTR)"
      - "Service uptime percentage, request latency, sustained throughput, and total monthly infrastructure cost"
    answer: 2
    explanation: |
      DORA's four keys are deployment frequency and lead time for changes (throughput) plus
      change-failure rate and time to restore/recover (stability). Elite teams score high
      on both dimensions simultaneously.
    ref: "concepts.md#reliability-gating-dora-metrics-and-error-budgets-in-releases"

  - id: devops-system-design-and-scenarios-046
    difficulty: intermediate
    tags: [slo, error-budget, gating]
    question: |
      With a 99.9% availability SLO, what is the error budget and how is it used to gate
      releases?
    options:
      - "The budget equals the SLO itself at 99.9%, and you should gate releases only once it climbs back above 50%"
      - "There is no error budget at all; you simply deploy whenever you want regardless of the service's current reliability"
      - "The budget is 9.9% (ten times one minus the SLO), and it is ignored entirely when making release decisions"
      - "Budget is 0.1% (1 − SLO); when it's exhausted, gate/freeze risky changes and prioritize reliability work"
    answer: 3
    explanation: |
      Error budget = 1 − SLO = 0.1% here. You spend it on feature velocity; once it's burned
      you gate risky releases and shift to reliability work, making risk-taking a
      data-driven decision. (SLO alerting math lives in the observability domain.)
    ref: "concepts.md#reliability-gating-dora-metrics-and-error-budgets-in-releases"

  - id: devops-system-design-and-scenarios-047
    difficulty: advanced
    tags: [dora, scenario, change-failure-rate]
    question: |
      A team deploys 30×/day with a 2% change-failure rate and 15-minute MTTR; another
      deploys once/month with a 30% change-failure rate and multi-day recovery. What does
      DORA conclude?
    options:
      - "The monthly team is safer precisely because it deploys rarely, concentrating risk into a few heavily reviewed releases"
      - "The high-frequency team is the elite performer — high throughput AND high stability"
      - "Deploy frequency on its own determines performance, so the 30×/day team wins regardless of its failure and recovery numbers"
      - "Both teams are effectively equivalent once you average their throughput and stability metrics together over a year"
    answer: 1
    explanation: |
      Elite performers combine high throughput (frequent deploys, short lead time) with
      high stability (low change-failure rate, fast recovery). The frequent-deploy team
      wins on all four keys; rare deploys with high failure and slow recovery is the
      low-performer profile.
    ref: "concepts.md#reliability-gating-dora-metrics-and-error-budgets-in-releases"

  - id: devops-system-design-and-scenarios-048
    difficulty: advanced
    tags: [trade-offs, gitops, push-vs-pull]
    question: |
      When articulating the trade-off of GitOps (pull-based) vs push-based deploys, which
      framing is correct?
    options:
      - "Pull-based GitOps adds auditability, self-healing, and drift correction at the cost of more moving parts vs a simpler push pipeline"
      - "Push-based deploys are always the superior choice because their simpler pipeline has fewer components to operate and debug"
      - "Pull-based GitOps removes the need for a git repository entirely, since the in-cluster agent stores desired state itself"
      - "Push-based deploys are inherently more auditable because the pipeline logs every command it runs against the cluster"
    answer: 0
    explanation: |
      GitOps has an in-cluster agent (Argo CD/Flux) continuously reconcile desired state
      from git — auditable, self-healing, drift-correcting — versus a simpler push pipeline
      that lacks continuous reconciliation. Naming benefit, cost, and when-to-switch is the
      trade-off skill.
    ref: "concepts.md#articulating-trade-offs-the-meta-skill"

  - id: devops-system-design-and-scenarios-049
    difficulty: intermediate
    tags: [trade-offs, delivery-vs-deployment]
    question: |
      What is the trade-off between continuous delivery and continuous deployment?
    options:
      - "They are exactly the same thing, just two interchangeable names the industry uses for one identical release process"
      - "Continuous delivery keeps a human approval gate (control); continuous deployment auto-releases every passing change (speed/less toil)"
      - "Continuous deployment requires no automated testing at all, since every commit is pushed to production the moment it lands"
      - "Continuous delivery by definition can never reach production; it only ever builds artifacts for the staging environment"
    answer: 1
    explanation: |
      Both keep main deployable; delivery stops at a human-gated release for control,
      deployment ships every green build automatically for speed and reduced toil — which
      you choose depends on risk tolerance and test confidence.
    ref: "concepts.md#articulating-trade-offs-the-meta-skill"

  - id: devops-system-design-and-scenarios-050
    difficulty: intermediate
    tags: [config, twelve-factor, secrets]
    question: |
      Following 12-Factor, how should environment-specific config and secrets relate to the
      built artifact?
    options:
      - "Bake the config and secrets directly into a separate image built for each environment so they ship together"
      - "The artifact is environment-agnostic; config and secrets are injected at deploy/runtime"
      - "Store all config values only inside the source code repository, committed alongside the application code itself"
      - "Rebuild the artifact separately for each environment with that environment's config compiled in at build time"
    answer: 1
    explanation: |
      12-Factor separates config from code: one immutable artifact runs everywhere, with
      environment config and secrets injected at deploy/runtime. Baking config in breaks
      build-once/deploy-many and leaks secrets into images.
    ref: "concepts.md#designing-a-cicd-pipeline-for-a-microservices-application"
