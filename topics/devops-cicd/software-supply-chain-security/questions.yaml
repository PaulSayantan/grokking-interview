topic: Software Supply Chain Security
domain: devops-cicd
topic_slug: software-supply-chain-security
version: 1
questions:
- id: software-supply-chain-security-001
  difficulty: beginner
  tags:
  - threat-model
  - definitions
  question: |
    What does "software supply chain security" primarily concern itself with,
    as distinct from classic application security?
  options:
  - Making the application UI accessible to users with disabilities
  - Minimizing the CPU and memory footprint of the running service
  - Proving the integrity and provenance of every input and build step that produced an artifact
  - Ensuring the database uses the correct indexes so that read-heavy queries return quickly under load
  answer: 2
  explanation: |
    Supply chain security is about integrity and provenance across the whole path from
    source to production — can you prove the artifact was built from the intended source,
    by the intended process, with the intended dependencies, and not tampered with. Classic
    AppSec focuses on flaws in your own code; supply chain security also covers third-party
    code and the build infrastructure itself.
  ref: concepts.md#the-software-supply-chain-threat-model
- id: software-supply-chain-security-002
  difficulty: beginner
  tags:
  - threat-model
  - attack-surface
  question: |
    Which of the following is an attack surface that is UNIQUE to a supply-chain view
    and often overlooked by candidates who only think about "vulnerable libraries"?
  options:
  - The build system / CI runner itself
  - SQL injection in the login form
  - A weak TLS cipher suite on the load balancer
  - An overly permissive CORS policy
  answer: 0
  explanation: |
    The build system is a first-class attack surface. A perfectly clean source and clean
    dependencies processed by a compromised build can still produce a malicious artifact —
    this is exactly the SolarWinds class of attack. Naming the build system (not just
    dependencies) is the senior-level insight.
  ref: concepts.md#the-software-supply-chain-threat-model
- id: software-supply-chain-security-003
  difficulty: intermediate
  tags:
  - threat-model
  - leverage
  question: |
    What property makes supply-chain attacks especially attractive to attackers?
  options:
  - They are always easier to execute than a simple phishing email campaign against staff
  - They cannot be detected by any tooling once the malicious dependency has been published
  - They only affect open-source projects, never commercial ones
  - Leverage — compromising one widely-used link reaches everyone downstream
  answer: 3
  explanation: |
    The defining property is leverage: compromise one popular dependency, action, or build
    step and you reach every downstream consumer who trusted it — potentially thousands of
    victims who made no mistake in their own code. That amplification is why defenders rely
    on verifiability and defense in depth.
  ref: concepts.md#the-software-supply-chain-threat-model
- id: software-supply-chain-security-004
  difficulty: intermediate
  tags:
  - solarwinds
  - build-compromise
  question: |
    The SolarWinds (SUNBURST) attack is the canonical example of which attack class?
  options:
  - SQL injection, where crafted input reaches the database because query parameters are left unescaped
  - Build system compromise (the build process was subverted so the output differed from the source)
  - Typosquatting, where a malicious package is published under a name that resembles a popular one
  - A leaked TLS private key that let attackers decrypt intercepted traffic between clients and the server
  answer: 1
  explanation: |
    In SolarWinds, attackers implanted malicious code in the Orion build process, so signed
    builds shipped malware while the source code looked clean. It is the textbook build-
    compromise case, and it motivates hardened/isolated builds (SLSA L3) and reproducible
    builds.
  ref: concepts.md#notable-attacks-solarwinds-log4shell-dependency-confusion-typosquatting
- id: software-supply-chain-security-005
  difficulty: intermediate
  tags:
  - log4shell
  - sbom
  question: |
    Why is Log4Shell (CVE-2021-44228) best described as a supply-chain *management*
    problem rather than a supply-chain *attack*?
  options:
  - Because it was a deliberate backdoor secretly inserted into the source by a malicious project maintainer
  - Because it only affected the CI build server and never reached any applications running in production
  - Because it was caused by a typosquatted package name that developers installed by mistyping the dependency
  - Because it was a vulnerability in a widely-used dependency, and the pain was that orgs couldn't quickly
    find where they used it
  answer: 3
  explanation: |
    Log4Shell was a vulnerability (RCE) in the ubiquitous log4j library — not an attacker
    poisoning the chain. The supply-chain lesson is that many victims could not quickly
    answer "where do we use log4j, and in what version?" That inventory gap is exactly what
    an SBOM solves.
  ref: concepts.md#notable-attacks-solarwinds-log4shell-dependency-confusion-typosquatting
- id: software-supply-chain-security-006
  difficulty: intermediate
  tags:
  - dependency-confusion
  - scenario
  question: |
    A team's internal build for `payments-sdk` suddenly resolved to a public package of the
    same name with a higher version number, which contained malware. What happened?
  options:
  - A dependency confusion attack — a public package shadowed the internal name via a higher version
  - A typosquatting attack — a developer misspelled the package name and pulled a lookalike instead
  - The build server ran out of disk space and silently pulled a cached copy from a public mirror
  - The lockfile hash was too strong and forced the resolver to fall back to an alternate public version
  answer: 0
  explanation: |
    This is dependency confusion: an attacker publishes a public package with the same name
    as a private/internal one and a higher version, and a resolver that checks both sources
    prefers the higher-versioned public (malicious) package. Fix with scoping/namespacing
    and configuring resolution so internal names never fall through to public registries.
  ref: concepts.md#notable-attacks-solarwinds-log4shell-dependency-confusion-typosquatting
- id: software-supply-chain-security-007
  difficulty: beginner
  tags:
  - typosquatting
  question: |
    A malicious package published under the name `reqeusts` (close to the popular
    `requests`) is an example of what?
  options:
  - Dependency confusion
  - A reproducible build
  - Typosquatting
  - A transparency log
  answer: 2
  explanation: |
    Typosquatting publishes malicious packages under names close to popular ones, hoping
    developers install them by typo or copy-paste. Lockfiles with recorded hashes, allowlists,
    and install-time scanning defend against it.
  ref: concepts.md#notable-attacks-solarwinds-log4shell-dependency-confusion-typosquatting
- id: software-supply-chain-security-008
  difficulty: advanced
  tags:
  - codecov
  - ci-security
  question: |
    In the 2021 Codecov breach, a tampered bash uploader script exfiltrated CI secrets from
    thousands of pipelines. Which control most directly mitigates this class of attack?
  options:
  - Using a stronger database password with regular rotation enforced by the central secrets manager
  - Pinning third-party scripts/actions by immutable digest and running CI with least-privilege tokens
  - Increasing the CI runner's memory so the uploader script cannot exhaust its allocated heap space
  - Switching the pipeline configuration format from YAML to JSON to reduce parsing ambiguities
  answer: 1
  explanation: |
    The Codecov uploader was a mutable third-party script running inside pipelines with
    access to secrets. Pinning the exact reviewed bytes (by digest/SHA) prevents silent
    substitution, and least-privilege/read-only CI tokens limit what a compromised step can
    steal.
  ref: concepts.md#notable-attacks-solarwinds-log4shell-dependency-confusion-typosquatting
- id: software-supply-chain-security-009
  difficulty: advanced
  tags:
  - xz
  - maintainer-takeover
  question: |
    The XZ Utils backdoor (CVE-2024-3094) had zero known CVEs at the time it was planted.
    Why would traditional SCA (software composition analysis) have failed to catch it?
  options:
  - SCA matches components against known-vulnerability databases, and no CVE existed for the fresh backdoor
    yet
  - SCA only scans container images and operating-system packages, never application libraries
  - SCA cannot read compressed archives like .xz, so the backdoor payload stayed invisible to it
  - SCA only runs against deployed workloads in production and never during the CI build stage
  answer: 0
  explanation: |
    SCA finds *known* vulnerabilities by matching component versions against CVE/vuln
    databases. A freshly-planted backdoor has no CVE, so SCA reports nothing. Supply-chain
    controls (reproducible builds, provenance, maintainer/Scorecard signals) are what give a
    chance of catching such cases.
  ref: concepts.md#notable-attacks-solarwinds-log4shell-dependency-confusion-typosquatting
- id: software-supply-chain-security-010
  difficulty: intermediate
  tags:
  - devsecops
  - distinction
  question: |
    How does supply-chain security differ from general DevSecOps in the question each
    primarily answers?
  options:
  - DevSecOps only asks 'is this fast enough?' while supply chain security only asks 'is this cheap enough?'
  - They are completely identical terms with no meaningful difference in scope or the questions they ask
  - Supply chain security only applies to open-source code, while DevSecOps covers only proprietary code
  - DevSecOps mostly asks 'is there a known weakness?'; supply chain asks 'is this the thing I think it
    is, and can I verify it?'
  answer: 3
  explanation: |
    General DevSecOps (SAST/DAST/SCA/IaC scanning) is largely detective — finding known
    vulnerabilities and misconfigurations. Supply-chain security adds a provenance/integrity
    layer — proving an artifact was built from the intended source by the intended process
    and hasn't been tampered with. You need both.
  ref: concepts.md#supply-chain-security-vs-general-devsecops
- id: software-supply-chain-security-011
  difficulty: advanced
  tags:
  - devsecops
  - distinction
  - scenario
  question: |
    A dependency has zero known CVEs but contains a brand-new, undisclosed backdoor. Which
    statement is most accurate?
  options:
  - SAST will always catch it because it scans your own source code and every dependency's internal logic too
  - SCA finds nothing (no CVE), but supply-chain controls like provenance, reproducible builds, and maintainer
    signals offer a chance to catch it
  - SCA will flag it because a package with a very high download count is automatically audited by the registry
  - Nothing can ever help here; once a backdoor has no CVE the situation is genuinely hopeless for defenders
  answer: 1
  explanation: |
    With no CVE, SCA has nothing to match. SAST scans *your* code, not the dependency's
    hidden logic. Supply-chain controls — provenance/attestations, reproducible builds, and
    posture signals (OpenSSF Scorecard, maintenance/code-review) — are the complementary
    layer that addresses novel/malicious components.
  ref: concepts.md#supply-chain-security-vs-general-devsecops
- id: software-supply-chain-security-012
  difficulty: intermediate
  tags:
  - devsecops
  - sca-overlap
  question: |
    Which control is best described as the "overlap zone" that appears in both DevSecOps and
    supply-chain conversations?
  options:
  - DAST (dynamic application security testing)
  - Load testing to measure the service's throughput limits
  - SCA (software composition analysis) of dependencies
  - Linting source files for code-style consistency
  answer: 2
  explanation: |
    SCA is a dependency control: it's a security scan (DevSecOps) but it operates on third-
    party components (supply chain). It's the natural overlap between the two disciplines,
    whereas provenance/attestation is distinctly a supply-chain concept.
  ref: concepts.md#supply-chain-security-vs-general-devsecops
- id: software-supply-chain-security-013
  difficulty: beginner
  tags:
  - slsa
  - framework
  question: |
    What does the SLSA framework provide?
  options:
  - A domain-specific programming language for authoring CI/CD pipeline definitions
  - A container runtime that executes each build step inside an isolated sandbox
  - A replacement for Git that versions built artifacts instead of source code
  - An incremental set of security requirements (levels) for producing software artifacts
  answer: 3
  explanation: |
    SLSA ("Supply-chain Levels for Software Artifacts") is an OpenSSF framework defining
    incremental levels of security requirements for building artifacts, centered (in v1.0)
    on the Build track (L0–L3).
  ref: concepts.md#slsa-framework-levels-provenance-and-build-integrity
- id: software-supply-chain-security-014
  difficulty: intermediate
  tags:
  - slsa
  - levels
  question: |
    In SLSA v1.0's Build track, what does Build Level 1 (L1) require?
  options:
  - Provenance that describes how the artifact was built — though it may be unsigned and thus forgeable
  - A hardened, isolated build platform whose signing keys are unreachable to any user-defined build step
  - Reproducible bit-for-bit builds independently verified by at least three separate rebuilder parties
  - Admission control at deploy time that rejects any artifact lacking a valid signature and attestation
  answer: 0
  explanation: |
    L1 requires that provenance exists describing the build (platform, process, top-level
    inputs). At L1 the provenance may be unsigned, so it is "trivial to bypass or forge" —
    it provides visibility and consistency, not tamper-resistance. Signing arrives at L2.
  ref: concepts.md#slsa-framework-levels-provenance-and-build-integrity
- id: software-supply-chain-security-015
  difficulty: advanced
  tags:
  - slsa
  - levels
  - l2-vs-l3
  question: |
    What is the key distinction between SLSA Build L2 and Build L3?
  options:
  - L2 requires attaching a full SBOM to every build while L3 explicitly drops that SBOM requirement entirely
  - L2 is intended only for open-source projects whereas L3 is reserved for commercial closed-source vendors
  - L2 signs provenance from a hosted platform (prevents tampering *after* the build); L3 hardens/isolates
    the platform so signing keys are unreachable to build steps (prevents tampering *during* the build)
  - L2 mandates provenance in the SPDX format while L3 switches the required provenance format to CycloneDX
  answer: 2
  explanation: |
    L2 adds signed provenance generated by a hosted build platform, which prevents tampering
    after the build (the signature would break). L3 hardens the platform: build runs are
    isolated from one another and signing secrets are inaccessible to user-defined build
    steps, preventing tampering during the build — the SolarWinds class.
  ref: concepts.md#slsa-framework-levels-provenance-and-build-integrity
- id: software-supply-chain-security-016
  difficulty: intermediate
  tags:
  - slsa
  - provenance
  question: |
    What information does SLSA "provenance" capture about an artifact?
  options:
  - The artifact's runtime CPU, memory, and network usage while it serves live production traffic
  - What was built (digest), from what source/inputs, by which build platform, and how (entry point/parameters)
  - The number of unit and integration tests that passed during the build's verification stage
  - The list of end users and organizations that downloaded the artifact from the registry
  answer: 1
  explanation: |
    Provenance is machine-readable metadata answering what was built (artifact digest), from
    what (source repo + commit and resolved inputs), by whom/what (the build platform
    identity), and how (build entry point/parameters). Consumers compare it against expected
    values to detect tampering.
  ref: concepts.md#slsa-framework-levels-provenance-and-build-integrity
- id: software-supply-chain-security-017
  difficulty: advanced
  tags:
  - slsa
  - solarwinds
  - scenario
  question: |
    Which combination of controls would most directly have detected/prevented a SolarWinds-
    style build compromise?
  options:
  - SLSA L3 hardened/isolated builds plus reproducible builds (an independent rebuild would mismatch the
    tampered binary)
  - A stronger password policy plus mandatory MFA on all developer email and corporate VPN accounts
  - Rate limiting on the public API to blunt automated credential-stuffing and scraping attempts
  - Encrypting the production database at rest with customer-managed KMS keys and scheduled rotation
  answer: 0
  explanation: |
    Signing alone (L2) wouldn't help — the compromised build would sign the malicious
    artifact. L3 hardens/isolates the build environment, and reproducible builds let an
    independent rebuilder detect that the shipped binary no longer matches the source. That
    combination targets the build-tampering root cause.
  ref: concepts.md#slsa-framework-levels-provenance-and-build-integrity
- id: software-supply-chain-security-018
  difficulty: beginner
  tags:
  - hermetic-builds
  question: |
    What best describes a "hermetic" build?
  options:
  - A build that runs only on Fridays during a scheduled low-traffic release window each week
  - A build that produces the smallest possible container image by aggressively stripping layers
  - A build that skips the automated test stage entirely in order to shorten total pipeline run time
  - A build that declares all inputs up front and runs with no network access, using only pre-fetched
    pinned dependencies
  answer: 3
  explanation: |
    A hermetic build declares all its inputs in advance and runs with no network access, so
    it can only use pre-fetched, pinned dependencies. This removes the "build reached out and
    pulled something unexpected" risk and makes the input set auditable. Bazel and Nix are
    built around this.
  ref: concepts.md#hermetic-and-reproducible-builds
- id: software-supply-chain-security-019
  difficulty: intermediate
  tags:
  - reproducible-builds
  question: |
    What is the security payoff of a reproducible (bit-for-bit deterministic) build?
  options:
  - It makes the artifact start up and run measurably faster in production by pre-optimizing the compiled output
  - It lets independent parties rebuild from source and confirm they get identical bytes, so a tampered
    build stands out
  - It automatically encrypts all build secrets and injected environment variables at rest inside the artifact
  - It removes the need for any dependency pinning because deterministic output guarantees inputs never change
  answer: 1
  explanation: |
    Reproducibility turns trust into verification: if the same source + inputs always yields
    identical bytes, multiple independent rebuilders can confirm the artifact matches the
    source, so a tampered/backdoored build no longer matches and is exposed.
  ref: concepts.md#hermetic-and-reproducible-builds
- id: software-supply-chain-security-020
  difficulty: advanced
  tags:
  - reproducible-builds
  - nondeterminism
  question: |
    Which of these is a common source of NON-determinism that must be eliminated to achieve
    reproducible builds?
  options:
  - Using a compiled language instead of an interpreted one, since native machine code is inherently nondeterministic
  - Having more than one developer commit to the repository during the same release window as the build runs
  - Embedded build timestamps, nondeterministic file ordering, absolute paths, locale, and random seeds
  - Storing source code in Git rather than in a content-addressed artifact store that hashes each revision
  answer: 2
  explanation: |
    Reproducibility requires eliminating nondeterminism: embedded timestamps, file/archive
    ordering, absolute paths, locale-dependent output, and random seeds all cause otherwise-
    identical builds to differ byte-for-byte. Toolchains normalize these (e.g., SOURCE_DATE_EPOCH).
  ref: concepts.md#hermetic-and-reproducible-builds
- id: software-supply-chain-security-021
  difficulty: beginner
  tags:
  - sbom
  - definitions
  question: |
    What is an SBOM (Software Bill of Materials)?
  options:
  - A pricing sheet that enumerates per-seat and per-core license costs for every commercial component you ship
  - A contributor roster listing the developers who wrote each module along with their commit counts and code ownership
  - A machine-readable inventory of every component in an artifact, with versions, suppliers, and relationships
    (including transitive deps)
  - A prioritized vulnerability scan report ranking each detected CVE by CVSS severity and exploitability score
  answer: 2
  explanation: |
    An SBOM is a formal, machine-readable inventory of everything in an artifact — components,
    versions, suppliers, licenses, and dependency relationships including transitive ones.
    It's the "ingredient label" for software.
  ref: concepts.md#sbom-software-bill-of-materials-spdx-cyclonedx
- id: software-supply-chain-security-022
  difficulty: intermediate
  tags:
  - sbom
  - formats
  question: |
    Which pair are the two dominant SBOM formats, and their stewards?
  options:
  - SPDX (Linux Foundation) and CycloneDX (OWASP)
  - YAML (Google) and JSON (Amazon)
  - Dockerfile (Docker Inc.) and Helm (CNCF)
  - Terraform (HashiCorp) and Ansible (Red Hat)
  answer: 0
  explanation: |
    SPDX is stewarded by the Linux Foundation (an ISO/IEC 5962 standard, license-focused
    heritage). CycloneDX is an OWASP project, security-first and lightweight (supports VEX,
    SaaSBOM, ML-BOM). Both are the standard SBOM formats.
  ref: concepts.md#sbom-software-bill-of-materials-spdx-cyclonedx
- id: software-supply-chain-security-023
  difficulty: intermediate
  tags:
  - sbom
  - generation
  question: |
    When is SBOM generation typically MOST accurate?
  options:
  - Weeks after release, reconstructed from memory and changelog notes once the on-call engineer has time
  - Only from the final running container in production, by inspecting the live process memory and open file handles
  - It doesn't matter when you generate it, since the resolved dependency set is identical at every stage
  - During the build, when the dependency resolver knows the exact resolved versions
  answer: 3
  explanation: |
    Generating during the build is most accurate because the resolver knows the exact
    resolved versions and full transitive tree. Scanning a built artifact/image after the
    fact (Syft, Trivy) is convenient but can miss or misidentify components.
  ref: concepts.md#sbom-software-bill-of-materials-spdx-cyclonedx
- id: software-supply-chain-security-024
  difficulty: advanced
  tags:
  - sbom
  - sca
  - distinction
  question: |
    A colleague says "we generate SBOMs, so we're covered on vulnerabilities." Why is that
    reasoning flawed?
  options:
  - SBOMs automatically patch the vulnerable components they list by pinning them to the latest safe release
  - SBOMs are inventory, not analysis — you still must feed them into vulnerability/VEX tooling to learn
    what's vulnerable
  - SBOMs are strictly a license-compliance artifact and expose only license identifiers, never component versions
  - SBOMs replace the need for a build system by acting as a self-contained, buildable description of the artifact
  answer: 1
  explanation: |
    An SBOM lists components; it doesn't by itself tell you which are vulnerable. Its power is
    answering "do we use X, and where?" instantly. You still feed it into SCA/VEX tooling to
    match against vulnerability databases.
  ref: concepts.md#sbom-software-bill-of-materials-spdx-cyclonedx
- id: software-supply-chain-security-025
  difficulty: beginner
  tags:
  - signing
  - sigstore
  - cosign
  question: |
    What is the primary purpose of signing a container image or artifact?
  options:
  - To compress its layers so it downloads faster and consumes less bandwidth from the registry on pull
  - To automatically scan it for known vulnerabilities and attach the resulting CVE report to the manifest
  - To convert it to a different CPU architecture so the same image can run on both arm64 and amd64 nodes
  - To bind it to an identity so a consumer can verify it hasn't been tampered with and came from an expected
    signer
  answer: 3
  explanation: |
    Signing binds an artifact to a signer identity so consumers can verify integrity (not
    tampered) and origin (from an expected identity). Sigstore's cosign is the dominant tool
    for signing OCI images and other artifacts.
  ref: concepts.md#artifact-signing-and-verification-sigstore-cosign-in-toto
- id: software-supply-chain-security-026
  difficulty: advanced
  tags:
  - sigstore
  - keyless
  - fulcio
  - rekor
  question: |
    In Sigstore keyless signing, what is the role of Fulcio and Rekor respectively?
  options:
  - Fulcio is the object store that holds the signed artifacts; Rekor is the build platform that produces them
  - Fulcio issues short-lived certificates binding an ephemeral key to an OIDC identity; Rekor is the
    transparency log recording signing events
  - Fulcio is the OCI container registry that hosts images; Rekor is the CI runner that executes the signing job
  - Fulcio scans components for known CVEs; Rekor generates the SBOM inventory that travels with the artifact
  answer: 1
  explanation: |
    Fulcio is the certificate authority that verifies an OIDC token and issues a short-lived
    certificate binding the signer's identity to an ephemeral public key. Rekor is the
    tamper-evident transparency log that records the signing event (artifact hash, public key,
    signature) for public auditability.
  ref: concepts.md#artifact-signing-and-verification-sigstore-cosign-in-toto
- id: software-supply-chain-security-027
  difficulty: advanced
  tags:
  - sigstore
  - keyless
  - key-management
  question: |
    How does Sigstore keyless signing eliminate the traditional burden of long-lived signing
    key management?
  options:
  - It uses ephemeral in-memory keys plus short-lived Fulcio certs tied to an OIDC identity, so there
    is nothing long-lived to steal or rotate
  - It uses one shared organization-wide password that every signer enters, so there is only a single secret to protect
  - It stores the long-lived private key in the Git repository so any authorized committer can re-sign releases
  - It disables signing entirely and instead relies on TLS transport encryption to guarantee artifact integrity
  answer: 0
  explanation: |
    Keyless signing generates an ephemeral keypair, obtains a short-lived certificate from
    Fulcio bound to an OIDC identity, signs, then discards the private key — with the event
    logged in Rekor for verification. Because keys are ephemeral, there's no long-lived key to
    leak, rotate, or distribute.
  ref: concepts.md#artifact-signing-and-verification-sigstore-cosign-in-toto
- id: software-supply-chain-security-028
  difficulty: advanced
  tags:
  - in-toto
  - attestations
  question: |
    What is an in-toto attestation?
  options:
  - A compression format for container layers that deduplicates shared files across images in the registry
  - A type of load balancer health check that probes an artifact endpoint before routing production traffic to it
  - A signed statement about an artifact (a subject → predicate claim), such as its SLSA provenance, SBOM,
    or scan results
  - A Git branch protection rule that blocks force-pushes and requires reviews before merging to the release branch
  answer: 2
  explanation: |
    An in-toto attestation is a signed statement about an artifact — a subject (the artifact)
    linked to a predicate (a claim like SLSA provenance, an SBOM, test/scan results, review
    status). It's how provenance, SBOMs, and policy evidence travel with the artifact and get
    verified downstream.
  ref: concepts.md#artifact-signing-and-verification-sigstore-cosign-in-toto
- id: software-supply-chain-security-029
  difficulty: intermediate
  tags:
  - signing
  - digest
  - tags
  question: |
    Why must artifact signatures bind to an immutable content digest (`@sha256:...`) rather
    than a tag?
  options:
  - Tags are mutable and can be repointed to different bytes, so a signature 'on a tag' is meaningless
  - Digests are shorter and easier to type than the equivalent human-readable version tag on a release
  - Signatures cannot technically reference a content digest, so binding to a tag is the only option cosign supports
  - Tags cost more to store in the registry because each one is indexed separately from the underlying blob
  answer: 0
  explanation: |
    Tags are mutable pointers — they can be repointed to different content after signing. A
    signature only has meaning if it binds to the exact immutable bytes, i.e., the content
    digest. Signing/verifying by digest is a core rule.
  ref: concepts.md#artifact-signing-and-verification-sigstore-cosign-in-toto
- id: software-supply-chain-security-030
  difficulty: intermediate
  tags:
  - rekor
  - transparency-log
  question: |
    Why should an identity owner monitor the Rekor transparency log?
  options:
  - To measure how fast their builds run and track pipeline duration trends across successive releases
  - To reduce their cloud storage bill by pruning signature blobs that are older than the retention window
  - To find latency and throughput performance regressions in production before customers notice them
  - To detect unexpected signing events performed under their identity
  answer: 3
  explanation: |
    Rekor is an append-only, publicly auditable log of signing events. If someone signs
    artifacts under your identity unexpectedly, monitoring the log surfaces it — turning
    compromise into a detectable event.
  ref: concepts.md#artifact-signing-and-verification-sigstore-cosign-in-toto
- id: software-supply-chain-security-031
  difficulty: beginner
  tags:
  - lockfiles
  - pinning
  question: |
    What does a lockfile (e.g., `package-lock.json`, `poetry.lock`, `go.sum`) provide beyond
    simple version pinning of top-level dependencies?
  options:
  - It encrypts the source code at rest so only authorized developers on the team can read the repository
  - It runs the unit and integration test suites automatically before any dependency is allowed to install
  - It pins the entire transitive dependency tree to exact versions and records a cryptographic hash of
    each package
  - It deploys the built application to the production environment once the dependency install succeeds
  answer: 2
  explanation: |
    A lockfile pins the full transitive tree to exact versions and records a cryptographic
    hash for each package, so the install can verify the downloaded bytes match. That hash is
    the integrity control on top of reproducibility.
  ref: concepts.md#dependency-pinning-lockfiles-and-integrity-verification
- id: software-supply-chain-security-032
  difficulty: intermediate
  tags:
  - lockfiles
  - ci
  - npm
  question: |
    In CI, why is `npm ci` preferred over `npm install` for reproducible, verifiable builds?
  options:
  - '`npm ci` is just a shorthand alias for `npm install` with identical resolution and lockfile behavior'
  - '`npm ci` installs strictly from the lockfile and fails on mismatch, whereas `npm install` may rewrite
    the lockfile and resolve new versions'
  - '`npm install` cannot install any packages in a CI environment and errors unless a TTY is attached'
  - '`npm ci` skips the integrity and audit checks to run faster, trading verification for shorter build times'
  answer: 1
  explanation: |
    `npm ci` performs a clean, strict install directly from the lockfile and errors if
    package.json and the lockfile disagree. `npm install` can mutate the lockfile and resolve
    new versions — undesirable in CI where you want the exact, reviewed tree.
  ref: concepts.md#dependency-pinning-lockfiles-and-integrity-verification
- id: software-supply-chain-security-033
  difficulty: advanced
  tags:
  - integrity
  - hashes
  - pip
  question: |
    A team commits a hash-pinned `requirements.txt` but installs with plain `pip install -r
    requirements.txt`. Why does this weaken the intended integrity guarantee?
  options:
  - pip cannot read requirements.txt files that contain hash annotations and silently ignores the whole file
  - Without `--require-hashes`, pip won't strictly enforce the recorded hashes, so a tampered package
    could still install
  - Hashes are an npm-only feature and pip discards them entirely, so recording them in pip has no effect at all
  - The recorded hashes make every install measurably slower and should be stripped before committing the file
  answer: 1
  explanation: |
    The security value of hashes only materializes when the install command enforces them.
    `pip install --require-hashes` rejects any package whose bytes don't match; plain install
    does not enforce that mode consistently. A lockfile/hash you don't enforce buys little.
  ref: concepts.md#dependency-pinning-lockfiles-and-integrity-verification
- id: software-supply-chain-security-034
  difficulty: advanced
  tags:
  - go
  - checksum-db
  question: |
    What role does the Go checksum database (sum.golang.org) together with `go.sum` play?
  options:
  - It compiles Go code faster by caching pre-built module object files keyed on their version string
  - It stores your private source code in a hosted mirror so builds can fetch it without registry access
  - It replaces the need for a local Go compiler by distributing prebuilt binaries for each module version
  - It provides a global transparency log of module hashes so everyone sees the same bytes for a given
    module version
  answer: 3
  explanation: |
    `go.sum` records expected module hashes locally, and the Go checksum database is a global,
    transparency-log-backed record of module hashes. Together they ensure a given module
    version resolves to the same verified bytes for everyone, detecting tampering.
  ref: concepts.md#dependency-pinning-lockfiles-and-integrity-verification
- id: software-supply-chain-security-035
  difficulty: intermediate
  tags:
  - dependency-confusion
  - defenses
  question: |
    Which defense most directly prevents dependency-confusion attacks?
  options:
  - Namespacing/scoping internal packages and configuring resolution so internal names never fall through
    to public registries
  - Increasing unit and integration test coverage to 100% so malicious code paths are exercised and caught
  - Using a faster CI runner so the vulnerable dependency window is open for less wall-clock time per build
  - Deploying more frequently so any confused dependency is quickly replaced by the next release
  answer: 0
  explanation: |
    Dependency confusion abuses name resolution across multiple sources. Scoping/namespacing
    (e.g., npm scopes, controlled Maven groupIds) makes names unsquattable publicly, and
    configuring the client so internal names resolve only against the private registry
    (no public fall-through) closes the substitution path.
  ref: concepts.md#dependency-confusion-typosquatting-and-trusted-sources
- id: software-supply-chain-security-036
  difficulty: intermediate
  tags:
  - trusted-sources
  - proxy
  - registry
  question: |
    Why proxy public package registries through your own registry (Artifactory/Nexus/
    CodeArtifact)?
  options:
  - To make cached packages larger by re-bundling their transitive dependencies into a single fat archive
  - To freeze dependencies permanently so the team never has to update or re-resolve them after the first pull
  - To control caching, get an audit trail, survive upstream deletions, and apply policy at the proxy
  - To bypass all authentication against upstream registries by terminating credentials at the proxy boundary
  answer: 2
  explanation: |
    A proxying registry caches public packages (surviving the 'left-pad' deletion problem),
    provides an audit trail of what was pulled, and lets you enforce policy/allowlists and
    block confusable names — all while giving your builds a stable, controlled source.
  ref: concepts.md#dependency-confusion-typosquatting-and-trusted-sources
- id: software-supply-chain-security-037
  difficulty: advanced
  tags:
  - registry-security
  - publish-tokens
  question: |
    Which practice reduces the risk that a stolen publish token leads to a malicious package
    version in your own registry?
  options:
  - Sharing one publish token across all developers for convenience
  - Removing authentication from the registry entirely so any client may publish freely
  - Enforcing least-privilege publish tokens and 2FA on registry accounts
  - Publishing packages only over plain HTTP instead of TLS so uploads complete faster
  answer: 2
  explanation: |
    Publish-token theft is a common compromise vector. Least-privilege, scoped tokens and 2FA
    on accounts that can publish reduce both the likelihood and blast radius of a token
    compromise producing a malicious package version.
  ref: concepts.md#dependency-confusion-typosquatting-and-trusted-sources
- id: software-supply-chain-security-038
  difficulty: intermediate
  tags:
  - github-actions
  - pinning
  - digest
  question: |
    In a GitHub Actions workflow, which reference to a third-party action is the most
    tamper-resistant?
  options:
  - '`uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3` (full commit SHA)'
  - '`uses: actions/checkout@v4`'
  - '`uses: actions/checkout@main`'
  - '`uses: actions/checkout@latest`'
  answer: 0
  explanation: |
    A full commit SHA is immutable — it always refers to the exact reviewed bytes. Tags
    (`@v4`), branches (`@main`), and `@latest` are mutable and can be repointed by upstream
    (or an attacker who takes over the repo), so they are not true pins.
  ref: concepts.md#pinning-third-party-actions-and-images-by-digest-not-tag
- id: software-supply-chain-security-039
  difficulty: intermediate
  tags:
  - containers
  - base-image
  - digest
  question: |
    Which `FROM` line in a Dockerfile is pinned in a way that resists tag repointing?
  options:
  - '`FROM nginx:latest`'
  - '`FROM nginx:1.27.3@sha256:0c86...` (tag plus content digest)'
  - '`FROM nginx:1.27`'
  - '`FROM nginx`'
  answer: 1
  explanation: |
    Pinning to the content digest (`@sha256:...`) binds the build to immutable bytes; the tag
    is only a human-readable convenience. Plain tags like `latest` or even `1.27` can be
    repointed to different content, so they don't provide integrity.
  ref: concepts.md#pinning-third-party-actions-and-images-by-digest-not-tag
- id: software-supply-chain-security-040
  difficulty: advanced
  tags:
  - github-actions
  - pinning
  - gotcha
  question: |
    A team pins all third-party actions to Git tags like `@v3` and believes they are
    protected against upstream tampering. Why is this belief mistaken?
  options:
  - Git tags are cryptographically immutable once pushed, so the belief is entirely correct
  - GitHub Actions can only be referenced by branch name, never by a version tag like `@v3`
  - Referencing an action by tag causes GitHub to encrypt the action's code at rest automatically
  - Git tags are mutable and can be force-moved, so `@v3` can silently point to different code later
  answer: 3
  explanation: |
    Git tags can be deleted and re-created (force-moved) to point at different commits. So
    `@v3` is not a true pin; only a full commit SHA is immutable. Automate SHA pinning with
    tools like Dependabot or pin-github-action to keep it maintainable.
  ref: concepts.md#pinning-third-party-actions-and-images-by-digest-not-tag
- id: software-supply-chain-security-041
  difficulty: beginner
  tags:
  - openssf-scorecard
  question: |
    What is OpenSSF Scorecard?
  options:
  - A billing dashboard that tracks per-contributor cloud spend across open-source projects
  - A container registry that hosts signed images and enforces pull-time policy on each layer
  - A drop-in replacement for lockfiles that pins transitive dependencies by cryptographic hash
  - An automated tool that scores a repository against security heuristics (checks) from 0 to 10
  answer: 3
  explanation: |
    OpenSSF Scorecard automatically assesses a repository against security 'checks' (branch
    protection, code review, pinned dependencies, dangerous workflows, etc.), scoring each 0–10
    and rolling them into a weighted aggregate. It helps triage the posture of your repos and
    your dependencies.
  ref: concepts.md#openssf-scorecard-measuring-project-security-posture
- id: software-supply-chain-security-042
  difficulty: intermediate
  tags:
  - openssf-scorecard
  - checks
  question: |
    Which of the following is a genuine OpenSSF Scorecard check?
  options:
  - Startup-Time (how quickly the built binary boots and becomes ready to serve traffic)
  - Dangerous-Workflow (risky patterns in GitHub Actions workflows)
  - Database-Index (whether every query-heavy table column has a covering index defined)
  - UI-Contrast (whether foreground and background colors meet accessibility contrast ratios)
  answer: 1
  explanation: |
    Dangerous-Workflow (critical weight) checks for risky GitHub Actions patterns such as
    untrusted input flowing into pull_request_target. Other real checks include Branch-
    Protection, Token-Permissions, Code-Review, Maintained, Vulnerabilities, Signed-Releases,
    and Pinned-Dependencies.
  ref: concepts.md#openssf-scorecard-measuring-project-security-posture
- id: software-supply-chain-security-043
  difficulty: advanced
  tags:
  - openssf-scorecard
  - maintainer-takeover
  question: |
    Why are Scorecard signals like "Maintained" and "Code-Review" valuable for catching risks
    that CVE-based SCA cannot?
  options:
  - They detect published CVEs faster than SCA by querying the vulnerability database on every commit
  - They automatically open and merge pull requests that patch the flagged component to a safe version
  - They flag posture/maintenance risk (e.g., abandoned or unreviewed projects) that correlates with maintainer-takeover
    cases where no CVE exists
  - They measure the library's runtime latency and memory footprint under representative production load
  answer: 2
  explanation: |
    In maintainer-takeover incidents (like event-stream) there was no CVE for SCA to find, but
    poor maintenance signals and lack of code review would have flagged elevated risk.
    Scorecard measures security *posture*, complementing CVE-based analysis.
  ref: concepts.md#openssf-scorecard-measuring-project-security-posture
- id: software-supply-chain-security-044
  difficulty: intermediate
  tags:
  - openssf-scorecard
  - interpretation
  question: |
    A dependency scores 9/10 on OpenSSF Scorecard. What does this actually tell you?
  options:
  - The project follows good security practices/posture, which correlates with lower supply-chain risk
    but is not a proof of exploit-free code
  - The code has been formally verified to be free of any exploitable bug or memory-safety flaw
  - The project ships with zero direct or transitive dependencies, so its attack surface is empty
  - The project has the fastest build and lowest runtime latency of any library in its category
  answer: 0
  explanation: |
    Scorecard measures practices and posture (branch protection, review, pinning, maintenance),
    not whether the code is exploit-free. A high score correlates with lower supply-chain risk
    and good hygiene, but it's a posture signal — not a vulnerability guarantee.
  ref: concepts.md#openssf-scorecard-measuring-project-security-posture
- id: software-supply-chain-security-045
  difficulty: beginner
  tags:
  - admission-control
  question: |
    What is the role of an admission controller in a supply-chain context (e.g., in
    Kubernetes)?
  options:
  - It intercepts requests to run workloads and can reject images that aren't signed by a trusted identity
    or lack required attestations
  - It scales the number of running pods up and down automatically based on observed CPU utilization
  - It compresses and deduplicates container image layers to reduce registry storage and pull time
  - It rotates the cluster's TLS serving certificates before they expire and reloads them without downtime
  answer: 0
  explanation: |
    A Kubernetes admission controller intercepts resource creation (e.g., pods) and can
    enforce policy at the runtime boundary — rejecting images that aren't signed by a trusted
    identity or that lack required attestations (SLSA provenance, SBOM). It's the verification
    half of sign-then-verify.
  ref: concepts.md#admission-control-verifying-signatures-at-deploy-time
- id: software-supply-chain-security-046
  difficulty: intermediate
  tags:
  - admission-control
  - tools
  question: |
    Which tools can act as a Kubernetes admission gate that verifies cosign signatures and
    in-toto attestations?
  options:
  - Prometheus, Grafana, and Loki
  - Terraform, Ansible, and Packer
  - Sigstore Policy Controller, Kyverno, and OPA/Gatekeeper
  - Jenkins, GitLab CI, and CircleCI
  answer: 2
  explanation: |
    Sigstore Policy Controller, Kyverno, and OPA/Gatekeeper can enforce image-verification
    policies at admission — checking cosign signatures and attestations before a workload is
    allowed to run. The others are monitoring, IaC, or CI tools, not admission controllers.
  ref: concepts.md#admission-control-verifying-signatures-at-deploy-time
- id: software-supply-chain-security-047
  difficulty: advanced
  tags:
  - admission-control
  - enforce
  - scenario
  question: |
    A team signs all images and generates provenance, and has a Kyverno policy — but it's set
    to `validationFailureAction: Audit`. An unsigned image gets deployed to production. Why?
  options:
  - Kyverno can enforce resource quotas but has no ability to verify cosign signatures on images at all
  - The unsigned image exceeded Kyverno's payload-inspection size limit, so the policy skipped checking it
  - Attaching any cosign signature to an image automatically exempts it from all admission-control policies
  - '`Audit` only logs violations without blocking; only `Enforce` actually rejects non-compliant workloads'
  answer: 3
  explanation: |
    With `Audit`, the policy records violations but still admits the workload. Only
    `Enforce` blocks non-compliant (e.g., unsigned) images. Without an enforcing gate,
    signatures and provenance are documentation, not a control — the chain is only as strong
    as its enforcement point.
  ref: concepts.md#admission-control-verifying-signatures-at-deploy-time
- id: software-supply-chain-security-048
  difficulty: advanced
  tags:
  - admission-control
  - end-to-end
  question: |
    Which statement best captures why admission control is essential even after you sign
    artifacts and attach provenance?
  options:
  - Signing an artifact automatically blocks it from ever running anywhere unless the signer is trusted
  - Without an enforcing verification point at deploy time, signatures and attestations are never checked,
    so they don't prevent anything
  - Admission control fully replaces the need to sign artifacts, since the gate inspects the bytes itself
  - Provenance can only be verified during the build stage and is meaningless once the artifact is deployed
  answer: 1
  explanation: |
    Signing and attestation produce evidence; admission control is the enforcement point that
    *verifies* that evidence before code runs. Without a gate that verifies (and enforces),
    unsigned or untrusted images can still deploy — the machinery upstream provides no
    protection if nothing checks it.
  ref: concepts.md#admission-control-verifying-signatures-at-deploy-time
- id: software-supply-chain-security-049
  difficulty: advanced
  tags:
  - end-to-end
  - scenario
  question: |
    You're asked to secure a service's supply chain end-to-end. Which ordering of controls is
    most coherent?
  options:
  - Deploy to production first and only revisit dependency pinning, SBOMs, and signing after a security incident forces the issue
  - Sign the final image with cosign but skip provenance, SBOM generation, digest pinning, and any admission-time verification
  - Pin & verify deps → build hermetically on a hardened runner emitting signed provenance → generate/attach
    SBOM → sign the image (cosign) with attestations → pin base images/actions by digest → verify signatures
    & provenance at admission
  - Run CVE scans only against workloads already live in production and perform no security checks at build time
  answer: 2
  explanation: |
    A coherent end-to-end story pins and verifies inputs, hardens the build to emit signed
    provenance (SLSA), produces an SBOM, signs the artifact with attestations, pins base
    images/actions by immutable digest, and — critically — verifies signatures and provenance
    at admission so only provably-trusted images run.
  ref: concepts.md#the-software-supply-chain-threat-model
- id: software-supply-chain-security-050
  difficulty: intermediate
  tags:
  - sbom
  - log4shell
  - scenario
  question: |
    A new critical CVE drops in a widely-used library. Your security team must know within an
    hour which of 300 services are affected. Which capability makes this fast?
  options:
  - Maintaining a queryable, per-build SBOM inventory across all services
  - Having reproducible, bit-for-bit deterministic builds that any party can independently rebuild and verify
  - Using blue-green deployments so the affected version can be rolled back instantly with zero downtime
  - Operating a large, horizontally-scaled CI runner fleet so every service can be rebuilt in parallel quickly
  answer: 0
  explanation: |
    This is the Log4Shell lesson: with per-build SBOMs stored and queryable, you can answer
    "which services ship the affected component/version?" in minutes. Reproducible builds and
    deployment strategies don't directly solve the inventory question.
  ref: concepts.md#sbom-software-bill-of-materials-spdx-cyclonedx
- id: software-supply-chain-security-051
  difficulty: expert
  tags:
  - slsa
  - l1-gotcha
  question: |
    A vendor claims "we are SLSA L1, so our artifacts are protected against tampering." What
    is the most precise rebuttal?
  options:
  - L1 mandates reproducible bit-for-bit builds and signed provenance, so the tamper-resistance claim is fully correct
  - L1 requires deploy-time admission control that verifies every artifact, which makes tampering impossible
  - SLSA levels only address license compliance and have no relationship to artifact tampering at any level
  - L1 provenance may be unsigned and is trivial to forge; tamper-resistance requires at least L2 (signed
    provenance)
  answer: 3
  explanation: |
    L1 only requires that provenance exists; it can be unsigned and thus forgeable. It gives
    visibility/consistency, not integrity. Tamper-resistance starts at L2 (signed provenance
    from a hosted platform), and tamper-resistance *during* the build requires L3.
  ref: concepts.md#slsa-framework-levels-provenance-and-build-integrity
- id: software-supply-chain-security-052
  difficulty: expert
  tags:
  - verification
  - digest
  - cosign
  - scenario
  question: |
    A pipeline runs `cosign verify` against an image referenced by the tag `app:prod`. Even
    if verification passes, what subtle risk remains?
  options:
  - None — resolving and verifying an image by its tag is fully safe because tags are immutable once pushed
  - The tag `app:prod` can be repointed between verification and deployment (or to different bytes than
    were signed), so verification should bind to the immutable digest
  - cosign is unable to verify OCI container images and only supports plain file and blob artifacts
  - Verification always fails when the reference is a tag, so the passing result must be a false positive
  answer: 1
  explanation: |
    Verifying/deploying by mutable tag opens a time-of-check/time-of-use gap: the tag can be
    repointed to different content than what was signed/verified. Resolve the tag to its
    digest and verify + deploy that exact digest to close the gap.
  ref: concepts.md#artifact-signing-and-verification-sigstore-cosign-in-toto
