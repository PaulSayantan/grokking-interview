topic: "Infrastructure as Code (Terraform)"
domain: devops-cicd
topic_slug: infrastructure-as-code-terraform
version: 1
questions:
- id: infrastructure-as-code-terraform-001
  difficulty: beginner
  tags: [iac, benefits, snowflakes]
  question: |
    In IaC terminology, what is a "snowflake" server?
  options:
  - A server provisioned entirely from version-controlled code
  - A server running an immutable, pre-baked image
  - A server configured manually/ad-hoc that nobody can reliably reproduce
  - A server managed by a scheduled drift-detection job
  answer: 2
  explanation: |
    A snowflake is a hand-configured, one-of-a-kind server whose exact state isn't
    captured anywhere, so it can't be reproduced or audited. IaC eliminates snowflakes by
    defining infrastructure in versioned, repeatable code.
  ref: "concepts.md#infrastructure-as-code-benefits"

- id: infrastructure-as-code-terraform-002
  difficulty: beginner
  tags: [iac, benefits, version-control]
  question: |
    Which benefit is the DIRECT result of keeping infrastructure definitions in Git?
  options:
  - You get history, diffs, code review, and the ability to revert infra changes
  - Infrastructure automatically scales with traffic
  - Cloud costs are automatically reduced
  - State locking becomes unnecessary
  answer: 0
  explanation: |
    Storing infra as code in version control makes every change a reviewable, auditable
    commit with full history and revert capability — the same discipline as application
    code. It does not by itself autoscale or reduce cost.
  ref: "concepts.md#infrastructure-as-code-benefits"

- id: infrastructure-as-code-terraform-003
  difficulty: intermediate
  tags: [declarative, imperative, idempotency]
  question: |
    Terraform is described as a declarative tool. What does that mean in practice?
  options:
  - You write ordered, step-by-step commands to create each resource
  - Every apply always destroys and recreates all resources
  - It only works with a single cloud provider
  - You describe the desired end state and Terraform computes the actions needed
  answer: 3
  explanation: |
    Declarative means you specify WHAT the end state should be; Terraform diffs that
    against reality and figures out HOW (create/update/destroy) to converge. Imperative
    tools instead require you to script the ordered steps yourself.
  ref: "concepts.md#declarative-vs-imperative-iac"

- id: infrastructure-as-code-terraform-004
  difficulty: intermediate
  tags: [declarative, idempotency]
  question: |
    Why is idempotency a key property of declarative IaC?
  options:
  - It guarantees resources are always destroyed and recreated
  - Applying the same config repeatedly converges to the same result without side effects
  - It makes the config run faster on each apply
  - It removes the need for a state file
  answer: 1
  explanation: |
    Idempotency means re-applying an unchanged config is a safe no-op — Terraform only acts
    when reality differs from the declared state. Imperative scripts must hand-code this
    behavior; declarative tools get it by comparing desired state to recorded state.
  ref: "concepts.md#declarative-vs-imperative-iac"

- id: infrastructure-as-code-terraform-005
  difficulty: beginner
  tags: [workflow, plan, apply]
  question: |
    Which Terraform command performs a dry run, showing what would change WITHOUT
    modifying any infrastructure?
  options:
  - terraform apply
  - terraform init
  - terraform plan
  - terraform destroy
  answer: 2
  explanation: |
    `terraform plan` refreshes state, diffs desired config against current state, and prints
    the execution plan (create/update/destroy) without making changes. It's the safety gate
    before `apply`.
  ref: "concepts.md#terraform-core-workflow-init-plan-apply-destroy"

- id: infrastructure-as-code-terraform-006
  difficulty: beginner
  tags: [workflow, init, providers]
  question: |
    What does `terraform init` do?
  options:
  - Destroys all resources tracked in state
  - Applies the last saved plan
  - Detects drift against the real infrastructure
  - Downloads providers/modules and configures the state backend
  answer: 3
  explanation: |
    `init` initializes the working directory: it downloads provider plugins and modules and
    sets up the configured backend. It must run first and again after adding
    providers/modules.
  ref: "concepts.md#terraform-core-workflow-init-plan-apply-destroy"

- id: infrastructure-as-code-terraform-007
  difficulty: intermediate
  tags: [workflow, ci, saved-plan]
  question: |
    In CI, why is it recommended to run `terraform plan -out=plan.tfplan` and then
    `terraform apply plan.tfplan` instead of a bare `terraform apply`?
  options:
  - It applies exactly the reviewed plan, closing the gap between plan and apply
  - It skips the need for a remote backend
  - It disables state locking for speed
  - It automatically imports existing resources
  answer: 0
  explanation: |
    Applying a saved plan file guarantees you execute precisely what was reviewed, with no
    window for the real world (or config) to change between plan and apply — important for
    safe automated applies.
  ref: "concepts.md#terraform-core-workflow-init-plan-apply-destroy"

- id: infrastructure-as-code-terraform-008
  difficulty: intermediate
  tags: [resources, data-sources]
  question: |
    What is the key difference between a Terraform `resource` and a `data` source?
  options:
  - Resources are read-only; data sources are created and destroyed by Terraform
  - Resources are managed (created/updated/destroyed); data sources are read-only lookups
  - Both create infrastructure, but data sources run faster
  - Data sources store state while resources do not
  answer: 1
  explanation: |
    A `resource` is an object Terraform creates, updates, and destroys to match config. A
    `data` source only READS existing/external information; Terraform never mutates it.
    Using a data source for something you want Terraform to own is a common mistake.
  ref: "concepts.md#hcl-providers-resources-and-data-sources"

- id: infrastructure-as-code-terraform-009
  difficulty: beginner
  tags: [providers, hcl]
  question: |
    What is a Terraform "provider"?
  options:
  - The remote backend that stores state
  - A reusable folder of resources with inputs and outputs
  - The DAG Terraform builds from resource references
  - A plugin implementing the API/CRUD operations for a platform (AWS, GCP, k8s, ...)
  answer: 3
  explanation: |
    A provider is a plugin that knows how to talk to a specific platform's API (AWS, Azure,
    Kubernetes, GitHub, etc.). Terraform core is provider-agnostic; the provider does the
    actual API calls. Providers are versioned separately from core.
  ref: "concepts.md#hcl-providers-resources-and-data-sources"

- id: infrastructure-as-code-terraform-010
  difficulty: intermediate
  tags: [dependency-graph, dag]
  question: |
    How does Terraform normally determine that a security group must be created before an
    instance that references it?
  options:
  - Alphabetical order of resource names
  - The order resources appear in the .tf file
  - An implicit dependency inferred from the instance referencing the SG's attribute
  - It always creates all resources simultaneously
  answer: 2
  explanation: |
    Terraform builds a DAG from references. When `aws_instance.web` uses
    `aws_security_group.sg.id`, Terraform infers an implicit dependency and orders creation
    accordingly. Implicit dependencies (via references) are the preferred mechanism.
  ref: "concepts.md#the-terraform-dependency-graph"

- id: infrastructure-as-code-terraform-011
  difficulty: intermediate
  tags: [dependency-graph, depends-on]
  question: |
    When would you use an explicit `depends_on` instead of relying on implicit
    dependencies?
  options:
  - For a hidden dependency Terraform cannot infer from any attribute reference
  - Always, because implicit dependencies are unreliable
  - To make Terraform apply resources faster in parallel
  - To store the resource in a separate state file
  answer: 0
  explanation: |
    `depends_on` is for dependencies Terraform can't detect through references — e.g. IAM
    eventual consistency where one resource must exist before another even though no
    attribute is referenced. Overusing it (when an implicit dependency exists) is
    unnecessary.
  ref: "concepts.md#the-terraform-dependency-graph"

- id: infrastructure-as-code-terraform-012
  difficulty: advanced
  tags: [dependency-graph, destroy, parallelism]
  question: |
    Which statements about Terraform's dependency graph are correct?
  options:
  - It may contain cycles as long as they are small
  - It is a DAG; destroys walk it in reverse and independent nodes apply in parallel
  - Terraform applies every resource strictly sequentially in file order
  - The graph only includes resources, never data sources
  answer: 1
  explanation: |
    The graph must be acyclic (a cycle is an error). Terraform applies independent nodes
    concurrently (default parallelism 10) while respecting dependency order, and walks the
    graph in reverse on destroy. Data sources are part of the graph too.
  ref: "concepts.md#the-terraform-dependency-graph"

- id: infrastructure-as-code-terraform-013
  difficulty: intermediate
  tags: [state, purpose]
  question: |
    Which of the following is NOT a reason Terraform maintains a state file?
  options:
  - To map config resource addresses to real-world object IDs
  - To cache attributes so diffs are fast without querying everything each run
  - To encrypt all your cloud credentials at rest
  - To track dependencies and detect resources that should be destroyed
  answer: 2
  explanation: |
    State exists to bind config to real object IDs, cache attributes for performance, store
    dependency metadata, and notice deletions. It is NOT a credential store, and it is not
    inherently encrypted — that's a backend concern.
  ref: "concepts.md#terraform-state-and-why-it-exists"

- id: infrastructure-as-code-terraform-014
  difficulty: intermediate
  tags: [state, safety]
  question: |
    An engineer wants to rename a resource in state. What is the correct approach?
  options:
  - Hand-edit terraform.tfstate with a text editor
  - Delete the state file and re-run apply
  - Run `terraform destroy` then recreate everything
  - Use `terraform state mv` to move the resource within state
  answer: 3
  explanation: |
    State is precious and should never be hand-edited. `terraform state mv` safely renames
    or moves a resource's entry. Deleting state makes Terraform forget what it manages and
    risks recreating everything.
  ref: "concepts.md#terraform-state-and-why-it-exists"

- id: infrastructure-as-code-terraform-015
  difficulty: beginner
  tags: [remote-state, backends, teams]
  question: |
    Why do teams use a remote state backend (e.g. S3, Terraform Cloud) instead of local
    state?
  options:
  - Local state runs faster than remote for large teams
  - Shared single source of truth, locking, encryption at rest, and access control
  - Remote state removes the need for `terraform plan`
  - It lets each engineer keep a private divergent copy of state
  answer: 1
  explanation: |
    Remote state gives the whole team one shared, access-controlled, encrypted, lockable
    source of truth — and keeps secrets off individual laptops. Local state doesn't work
    for teams because copies diverge.
  ref: "concepts.md#remote-state-backends"

- id: infrastructure-as-code-terraform-016
  difficulty: intermediate
  tags: [remote-state, cross-stack]
  question: |
    A network stack outputs a VPC ID; an application stack (separate config/state) needs
    it. Which mechanism reads one config's outputs from another?
  options:
  - The `terraform_remote_state` data source
  - A `provisioner` block
  - "`terraform import`"
  - "`terraform force-unlock`"
  answer: 0
  explanation: |
    The `terraform_remote_state` data source reads another configuration's outputs from its
    backend, a common way to share values (like a VPC ID) across separately-managed stacks.
  ref: "concepts.md#remote-state-backends"

- id: infrastructure-as-code-terraform-017
  difficulty: intermediate
  tags: [state-locking, concurrency]
  question: |
    What problem does state locking prevent?
  options:
  - Drift caused by manual console edits
  - Secrets being stored in plaintext in state
  - Concurrent writes corrupting state when multiple applies run at once
  - Providers being downloaded twice
  answer: 2
  explanation: |
    Locking serializes state-writing operations so two simultaneous applies can't corrupt
    state or make conflicting changes. Terraform acquires a lock before writing and releases
    it after.
  ref: "concepts.md#state-locking"

- id: infrastructure-as-code-terraform-018
  difficulty: advanced
  tags: [state-locking, s3, dynamodb]
  question: |
    With the classic S3 backend, what has traditionally been used to provide state locking?
  options:
  - An SQS queue
  - A DynamoDB table holding a conditional lock item
  - A local .terraform.lock.hcl file
  - CloudWatch alarms
  answer: 1
  explanation: |
    The classic S3 backend uses a DynamoDB table (conditional PutItem on a LockID) for
    locking. Newer Terraform/OpenTofu also support S3-native locking via a conditional-write
    lock object, reducing the need for DynamoDB. (`.terraform.lock.hcl` is the provider
    dependency lock, unrelated to state locking.)
  ref: "concepts.md#state-locking"

- id: infrastructure-as-code-terraform-019
  difficulty: advanced
  tags: [state-locking, force-unlock]
  question: |
    A CI apply crashed and left a stale lock, blocking new runs. What is the appropriate,
    cautious action?
  options:
  - Set `-lock=false` permanently on all future applies
  - Delete the DynamoDB table
  - Hand-edit the state file to clear the lock flag
  - Verify no other apply is running, then `terraform force-unlock <LOCK_ID>`
  answer: 3
  explanation: |
    `terraform force-unlock <LOCK_ID>` releases a stale lock, but only after confirming no
    other apply is actually in progress. Disabling locking entirely reintroduces the
    corruption risk locking exists to prevent.
  ref: "concepts.md#state-locking"

- id: infrastructure-as-code-terraform-020
  difficulty: advanced
  tags: [sensitive, state, secrets]
  question: |
    Does marking a Terraform output or variable `sensitive = true` encrypt that value in
    the state file?
  options:
  - No, it only redacts the value from CLI output/logs; state still holds plaintext
  - Yes, it encrypts the value at rest in state
  - Yes, but only if a remote backend is used
  - No, it removes the value from state entirely
  answer: 0
  explanation: |
    `sensitive = true` only suppresses the value in plan/apply output and logs. The state
    file still stores it in plaintext. To protect it you must encrypt the backend and
    restrict access — or avoid materializing secrets into state at all.
  ref: "concepts.md#sensitive-data-in-state"

- id: infrastructure-as-code-terraform-021
  difficulty: intermediate
  tags: [sensitive, secrets, best-practice]
  question: |
    Which practice best reduces the risk of secrets sitting in Terraform state?
  options:
  - Commit state to Git so it's backed up
  - Encrypt/lock the backend, restrict access, and prefer external secret managers
  - Rename secret variables so they aren't obvious
  - Run `terraform apply -lock=false` to avoid contention
  answer: 1
  explanation: |
    Because state is effectively plaintext, treat read access to the backend as read access
    to secrets: encrypt at rest, restrict access, version the bucket, and prefer fetching
    secrets from Vault/Secrets Manager at runtime rather than storing them in state. Never
    commit state to Git.
  ref: "concepts.md#sensitive-data-in-state"

- id: infrastructure-as-code-terraform-022
  difficulty: intermediate
  tags: [drift, source-of-truth]
  question: |
    Someone manually changed an instance's tags in the AWS console. What will the next
    `terraform apply` (with the tags still declared in HCL) tend to do?
  options:
  - Preserve the manual change and update the HCL automatically
  - Ignore the resource entirely
  - Delete the instance and recreate it
  - Revert the tags back to what the configuration declares
  answer: 3
  explanation: |
    Terraform treats its config (reconciled with state) as the source of truth. A plan will
    show a diff to bring reality back in line with config, so apply "corrects" the drift by
    reverting the manual change. This is why out-of-band edits are dangerous with IaC.
  ref: "concepts.md#state-as-source-of-truth-vs-the-real-world-drift"

- id: infrastructure-as-code-terraform-023
  difficulty: intermediate
  tags: [drift, three-way]
  question: |
    When Terraform runs `plan`, which three things does it reconcile?
  options:
  - Git history, CI logs, and provider versions
  - Only the state file and the config
  - The HCL config (desired), the state file (recorded), and the real world (actual)
  - Only the config and the provider registry
  answer: 2
  explanation: |
    Plan refreshes the state from the real world, then diffs the recorded state and desired
    config to compute what must change. Config, state, and real world are three distinct
    things plan reconciles.
  ref: "concepts.md#state-as-source-of-truth-vs-the-real-world-drift"

- id: infrastructure-as-code-terraform-024
  difficulty: advanced
  tags: [drift-detection, ci, exit-code]
  question: |
    A team wants a scheduled CI job that alarms when production infrastructure has drifted.
    Which approach fits best?
  options:
  - Run `terraform plan -detailed-exitcode` and alert when it returns exit code 2
  - Run `terraform destroy` nightly and recreate
  - Run `terraform apply -auto-approve` nightly
  - Disable the remote backend during the check
  answer: 0
  explanation: |
    `plan -detailed-exitcode` returns 0 (no changes), 2 (changes/drift present), or 1
    (error). A scheduled job can treat exit 2 as a drift alarm — catching drift early before
    a surprise revert during a future apply.
  ref: "concepts.md#drift-detection"

- id: infrastructure-as-code-terraform-025
  difficulty: advanced
  tags: [drift-detection, refresh-only]
  question: |
    An intentional out-of-band change was made and you want to accept the real-world value
    into state WITHOUT making any other changes. Which command fits?
  options:
  - terraform destroy
  - terraform import
  - terraform force-unlock
  - terraform apply -refresh-only
  answer: 3
  explanation: |
    `terraform apply -refresh-only` (formerly `terraform refresh`) updates state to match
    the real world without applying other configuration changes — useful when you want to
    accept a deliberate out-of-band change rather than revert it.
  ref: "concepts.md#drift-detection"

- id: infrastructure-as-code-terraform-026
  difficulty: beginner
  tags: [modules, reuse]
  question: |
    What is a Terraform module?
  options:
  - A remote backend for storing state
  - A reusable, encapsulated group of resources with inputs (variables) and outputs
  - A CLI command that detects drift
  - A provider plugin for a specific cloud
  answer: 1
  explanation: |
    A module is a folder of .tf files with a defined input/output interface that packages a
    set of resources for reuse and composition. The root config is itself a module that
    calls child modules.
  ref: "concepts.md#modules"

- id: infrastructure-as-code-terraform-027
  difficulty: intermediate
  tags: [modules, versioning, registry]
  question: |
    When consuming a module from the Terraform Registry, why should you pin a `version`?
  options:
  - Pinning is required or `init` fails
  - To reduce the size of the state file
  - To make builds reproducible and avoid unexpected changes from new module releases
  - To enable state locking
  answer: 2
  explanation: |
    Pinning a version (or Git ref) ensures reproducible builds: without it, a new upstream
    release could silently change your infrastructure. Always constrain versions for
    registry/remote modules.
  ref: "concepts.md#modules"

- id: infrastructure-as-code-terraform-028
  difficulty: advanced
  tags: [modules, state]
  question: |
    Where do the resources created inside a child module live?
  options:
  - In the same state as the root config that calls the module
  - In a separate state file, one per module
  - Only in the module registry, not in state
  - In the provider's own database, not Terraform state
  answer: 0
  explanation: |
    Modules don't get separate state; a child module's resources are recorded in the same
    state as the root module that instantiates it (namespaced under `module.<name>`). Modules
    are an organizational/reuse construct, not a state-isolation boundary.
  ref: "concepts.md#modules"

- id: infrastructure-as-code-terraform-029
  difficulty: beginner
  tags: [variables, outputs, locals]
  question: |
    In a Terraform module, what is an `output` used for?
  options:
  - To accept a parameter from the caller
  - To define a private intermediate expression
  - To configure the remote backend
  - To expose a value from the module (shown after apply / consumed by a parent)
  answer: 3
  explanation: |
    `output` exposes a return value from a module — displayed after apply and consumable by
    a parent module or via `terraform_remote_state`. `variable` is the input; `locals` are
    private intermediate expressions.
  ref: "concepts.md#variables-outputs-and-locals"

- id: infrastructure-as-code-terraform-030
  difficulty: intermediate
  tags: [variables, locals]
  question: |
    You need a value that callers of your module can override from the CLI. Which construct
    should you use?
  options:
  - A `local` value
  - A `variable`
  - An `output`
  - A `data` source
  answer: 1
  explanation: |
    Only `variable`s are settable from outside (via -var, tfvars, TF_VAR_* env). `locals`
    are computed inside the module and cannot be overridden by the caller; outputs are
    return values, not inputs.
  ref: "concepts.md#variables-outputs-and-locals"

- id: infrastructure-as-code-terraform-031
  difficulty: advanced
  tags: [variables, precedence]
  question: |
    Given a variable with a default, a `terraform.tfvars` entry, and an explicit
    `-var` flag on the CLI, which value wins?
  options:
  - The default always wins
  - The value in terraform.tfvars
  - The explicit `-var` flag on the command line
  - Terraform errors due to conflicting definitions
  answer: 2
  explanation: |
    Variable precedence (later wins): defaults → TF_VAR_* env → terraform.tfvars →
    *.auto.tfvars → explicit -var/-var-file on the CLI. The command-line flag has the
    highest precedence.
  ref: "concepts.md#variables-outputs-and-locals"

- id: infrastructure-as-code-terraform-032
  difficulty: intermediate
  tags: [variables, validation]
  question: |
    What does a `validation` block inside a `variable` provide?
  options:
  - A condition that rejects invalid inputs with a custom error message
  - Encryption of the variable's value in state
  - Automatic conversion between types
  - Locking of the variable during apply
  answer: 0
  explanation: |
    A `validation` block lets you assert a condition on the input (e.g. env must be one of
    dev/staging/prod) and return a custom error message when it fails — catching bad inputs
    early rather than at apply time.
  ref: "concepts.md#variables-outputs-and-locals"

- id: infrastructure-as-code-terraform-033
  difficulty: advanced
  tags: [workspaces, environments, isolation]
  question: |
    HashiCorp cautions against using CLI workspaces for prod-vs-dev isolation. Why?
  options:
  - Workspaces cannot store state remotely
  - They share one backend and often one set of credentials, giving weak isolation
  - They require a separate provider per workspace
  - They don't support the `terraform.workspace` variable
  answer: 1
  explanation: |
    CLI workspaces are multiple named states on the SAME backend/config and often the same
    credentials, so blast radius and isolation are weak — easy to fat-finger prod. Strong
    environment separation is better achieved with directory/repo-per-environment (separate
    backends/accounts).
  ref: "concepts.md#workspaces-vs-directory-per-environment"

- id: infrastructure-as-code-terraform-034
  difficulty: intermediate
  tags: [workspaces, ephemeral]
  question: |
    For which use case are CLI workspaces a GOOD fit?
  options:
  - Long-lived, strongly isolated production vs development environments
  - Storing secrets separately from state
  - Replacing the need for modules
  - Ephemeral parallel copies of the same config, such as per-PR environments
  answer: 3
  explanation: |
    Workspaces shine for ephemeral, short-lived parallel variants of the same
    configuration (e.g. a temporary environment per pull request). They're not the
    recommended tool for strongly isolated long-lived prod/dev.
  ref: "concepts.md#workspaces-vs-directory-per-environment"

- id: infrastructure-as-code-terraform-035
  difficulty: intermediate
  tags: [directory-per-env, isolation]
  question: |
    A team wants dev, staging, and prod to use SEPARATE cloud accounts and credentials with
    strong blast-radius isolation. Which layout best supports this?
  options:
  - A single config using CLI workspaces
  - One giant state file for all three environments
  - A directory (or repo) per environment, each with its own backend/state and creds
  - Provisioners that switch accounts at runtime
  answer: 2
  explanation: |
    Directory/repo-per-environment gives each env its own backend state key and can use
    different accounts/credentials, providing the strongest isolation — the recommended
    pattern for prod-grade separation.
  ref: "concepts.md#workspaces-vs-directory-per-environment"

- id: infrastructure-as-code-terraform-036
  difficulty: intermediate
  tags: [provisioners, last-resort]
  question: |
    Why does HashiCorp describe provisioners (local-exec/remote-exec) as a "last resort"?
  options:
  - They are imperative actions Terraform can't model in state, breaking the declarative model
  - They are slower than data sources
  - They only work on Windows hosts
  - They require Terraform Cloud
  answer: 0
  explanation: |
    Provisioners run imperative scripts inside a declarative tool; their effects aren't
    tracked in state, so Terraform can't detect drift on them, and remote-exec is
    connectivity-dependent and flaky. Prefer user_data/cloud-init, pre-baked images, or a
    real provider resource.
  ref: "concepts.md#provisioners-as-a-last-resort"

- id: infrastructure-as-code-terraform-037
  difficulty: advanced
  tags: [provisioners, tainting]
  question: |
    What happens to a resource when its creation-time provisioner fails?
  options:
  - Terraform ignores the failure and continues
  - The entire state file is deleted
  - The provisioner is automatically retried forever
  - The resource is tainted and marked for recreation on the next apply
  answer: 3
  explanation: |
    A failed provisioner taints the resource, so Terraform plans to destroy and recreate it
    on the next apply. This surprising behavior is one reason provisioners are discouraged
    in favor of declarative alternatives.
  ref: "concepts.md#provisioners-as-a-last-resort"

- id: infrastructure-as-code-terraform-038
  difficulty: intermediate
  tags: [provisioners, alternatives]
  question: |
    You need to install packages on a new EC2 instance at boot. What is the preferred
    approach over a remote-exec provisioner?
  options:
  - SSH in manually after apply
  - Use cloud-init/user_data or a pre-baked image (Packer)
  - Add a `depends_on` to the instance
  - Store the install script in state
  answer: 1
  explanation: |
    Cloud-native user_data/cloud-init or pre-baked golden images (built with Packer) handle
    bootstrap declaratively and reliably, without the flakiness and untracked side effects
    of remote-exec provisioners.
  ref: "concepts.md#provisioners-as-a-last-resort"

- id: infrastructure-as-code-terraform-039
  difficulty: intermediate
  tags: [import, adoption]
  question: |
    A resource was created by hand and you want Terraform to manage it WITHOUT recreating
    it. What does `terraform import` accomplish?
  options:
  - It deletes the resource and recreates it under management
  - It only prints the resource's current attributes
  - It writes the resource into state (classic command does not generate the HCL for you)
  - It moves the resource to a different cloud account
  answer: 2
  explanation: |
    Import maps a real object into state so Terraform manages it going forward, without
    recreating it. The classic command populates STATE only — you must write matching HCL
    yourself, or a plan will show differences.
  ref: "concepts.md#importing-existing-infrastructure"

- id: infrastructure-as-code-terraform-040
  difficulty: advanced
  tags: [import, import-block]
  question: |
    What advantage does the `import {}` block (Terraform 1.5+) have over the classic
    `terraform import` command?
  options:
  - It is declarative, runs during plan/apply, and can generate config with -generate-config-out
  - It encrypts the state file
  - It removes the need for a backend
  - It automatically fixes drift on all resources
  answer: 0
  explanation: |
    The `import` block declares imports in config so they run as part of plan/apply, and
    `-generate-config-out` can scaffold the matching HCL — a more repeatable, reviewable
    workflow than the imperative classic command.
  ref: "concepts.md#importing-existing-infrastructure"

- id: infrastructure-as-code-terraform-041
  difficulty: beginner
  tags: [immutable, mutable]
  question: |
    What characterizes IMMUTABLE infrastructure?
  options:
  - Servers are patched and reconfigured in place while running
  - To change a server you build a new image and replace the instance rather than modify it
  - The state file can never be changed
  - Resources are created but never destroyed
  answer: 1
  explanation: |
    Immutable infrastructure never modifies a running server; changes mean building a new
    image and replacing the instance. This yields reproducibility, easy rollback, and no
    config drift — the opposite of in-place (mutable) patching.
  ref: "concepts.md#immutable-vs-mutable-infrastructure"

- id: infrastructure-as-code-terraform-042
  difficulty: intermediate
  tags: [immutable, lifecycle]
  question: |
    Which Terraform feature supports the immutable pattern of replacing a resource without
    downtime by creating the new one before destroying the old?
  options:
  - depends_on
  - sensitive = true
  - lifecycle { create_before_destroy = true }
  - backend "s3"
  answer: 2
  explanation: |
    `lifecycle { create_before_destroy = true }` tells Terraform to provision the
    replacement before destroying the original, minimizing downtime during immutable
    replacement (the `-/+` replace action).
  ref: "concepts.md#immutable-vs-mutable-infrastructure"

- id: infrastructure-as-code-terraform-043
  difficulty: intermediate
  tags: [comparison, cloudformation]
  question: |
    What is a key distinction between Terraform and AWS CloudFormation?
  options:
  - Terraform is AWS-only; CloudFormation is multi-cloud
  - Both require you to manage your own state file identically
  - CloudFormation uses HCL while Terraform uses YAML
  - Terraform is cloud-agnostic via providers; CloudFormation is AWS-only
  answer: 3
  explanation: |
    Terraform is multi-cloud through its provider ecosystem, whereas CloudFormation is
    AWS-only. Also, Terraform manages its own state, while CloudFormation state is managed
    for you by AWS as stacks.
  ref: "concepts.md#terraform-vs-pulumi-cloudformation-and-cdk"

- id: infrastructure-as-code-terraform-044
  difficulty: advanced
  tags: [comparison, cdk]
  question: |
    Which statement about AWS CDK is accurate?
  options:
  - CDK lets you write code in real languages that synthesizes down to CloudFormation templates
  - CDK is a competing state engine that replaces CloudFormation
  - CDK is multi-cloud and provider-based like Terraform
  - CDK uses HCL as its configuration language
  answer: 0
  explanation: |
    CDK lets you author infrastructure in general-purpose languages (TypeScript, Python,
    etc.), which it synthesizes into CloudFormation templates — CFN remains the deployment
    engine and state manager. It is AWS-focused, not multi-cloud provider-based.
  ref: "concepts.md#terraform-vs-pulumi-cloudformation-and-cdk"

- id: infrastructure-as-code-terraform-045
  difficulty: intermediate
  tags: [comparison, opentofu, pulumi]
  question: |
    Which pairing is correct?
  options:
  - OpenTofu is an AWS-only tool; Pulumi uses HCL only
  - Pulumi is AWS-only; OpenTofu replaces CloudFormation
  - OpenTofu is the open-source fork of Terraform; Pulumi uses general-purpose languages
  - OpenTofu and CDK are the same product
  answer: 2
  explanation: |
    OpenTofu is the Linux Foundation open-source fork created after Terraform's BUSL
    relicensing (drop-in compatible for most configs). Pulumi lets you define infra in real
    languages (TS/Python/Go/C#) rather than a purpose-built DSL.
  ref: "concepts.md#terraform-vs-pulumi-cloudformation-and-cdk"

- id: infrastructure-as-code-terraform-046
  difficulty: intermediate
  tags: [ci, plan-on-pr]
  question: |
    In the recommended "plan in CI, apply on merge" workflow, what runs on a PULL REQUEST?
  options:
  - terraform apply -auto-approve
  - fmt/validate/plan plus policy scanning, with the plan posted as a PR comment (no apply)
  - terraform destroy to reset the environment
  - Nothing; all Terraform runs happen after merge only
  answer: 1
  explanation: |
    On a PR you run fmt -check, validate, plan, and policy/security scans (tflint,
    tfsec/Checkov, OPA/Sentinel), and surface the plan diff for review. Apply happens only
    after merge to main — never on PRs.
  ref: "concepts.md#plan-in-ci-apply-on-merge"

- id: infrastructure-as-code-terraform-047
  difficulty: advanced
  tags: [ci, oidc, credentials]
  question: |
    What is the preferred way to give a CI job cloud credentials for Terraform applies?
  options:
  - Store long-lived static access keys as plaintext repo variables
  - Share a single admin key across all pipelines
  - Embed credentials in the state file
  - Use OIDC federation from the CI system to a short-lived, least-privilege cloud role
  answer: 3
  explanation: |
    OIDC federation (e.g. GitHub Actions OIDC → AWS IAM role) issues short-lived,
    least-privilege credentials with no long-lived secrets to leak or rotate — the modern
    best practice over static keys. (See the secrets-management topic.)
  ref: "concepts.md#plan-in-ci-apply-on-merge"

- id: infrastructure-as-code-terraform-048
  difficulty: advanced
  tags: [ci, scenario, locking]
  question: |
    Two merge-to-main pipeline runs for the same Terraform stack start nearly
    simultaneously. With a properly configured remote backend, what happens?
  options:
  - State locking makes the second run wait or fail to acquire the lock until the first finishes
  - Both apply concurrently and merge their changes automatically
  - The second run silently overwrites the first run's state
  - Terraform randomly picks one run to cancel
  answer: 0
  explanation: |
    A locking backend serializes the applies: the first run holds the lock, and the second
    must wait or fails to acquire it until released. This is exactly the concurrent-write
    corruption that state locking prevents.
  ref: "concepts.md#state-locking"

- id: infrastructure-as-code-terraform-049
  difficulty: beginner
  tags: [workflow, validate, fmt]
  question: |
    Which command checks configuration syntax and internal consistency WITHOUT making any
    API calls to the cloud?
  options:
  - terraform apply
  - terraform destroy
  - terraform validate
  - terraform import
  answer: 2
  explanation: |
    `terraform validate` checks syntax, references, and type consistency of the
    configuration offline (no provider API calls). `terraform fmt` canonicalizes formatting;
    neither talks to the cloud like plan/apply do.
  ref: "concepts.md#terraform-core-workflow-init-plan-apply-destroy"

- id: infrastructure-as-code-terraform-050
  difficulty: intermediate
  tags: [hcl, meta-arguments]
  question: |
    In HCL, what does the `for_each` meta-argument let you do?
  options:
  - Encrypt a resource's attributes in state
  - Force a resource to be destroyed before creation
  - Read data from another Terraform state
  - Create multiple instances of a resource from a map or set of items
  answer: 3
  explanation: |
    `for_each` (like `count`) is a meta-argument for creating multiple copies of a resource
    or module — from a map/set with `for_each`, or a number with `count` — each keyed
    distinctly in state.
  ref: "concepts.md#hcl-providers-resources-and-data-sources"
