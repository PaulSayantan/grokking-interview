topic: "Incident Management & Troubleshooting"
domain: devops-cicd
topic_slug: incident-management-and-troubleshooting
version: 1
questions:
  - id: incident-management-and-troubleshooting-001
    difficulty: beginner
    tags: [definition, incident, impact]
    question: |
      What best distinguishes a production "incident" from an ordinary bug or problem?
    options:
      - "An incident is an unplanned disruption/degradation that materially impacts users or violates an SLO and needs a response now"
      - "An incident is any code defect found in production"
      - "An incident is any ticket assigned to the on-call engineer"
      - "An incident is a change that was deployed outside business hours"
    answer: 0
    explanation: |
      Incidents are defined by impact and urgency, not effort. A one-line typo that takes
      down checkout is an incident; a hard week of debugging on a non-customer-facing job
      may never be one. Impact is what triggers the incident process and severity sizing.
    ref: "concepts.md#why-incident-management-matters"

  - id: incident-management-and-troubleshooting-002
    difficulty: beginner
    tags: [lifecycle, phases]
    question: |
      Which sequence best captures the incident lifecycle in order?
    options:
      - "Learn → detect → mitigate → triage → resolve"
      - "Detect → triage → mitigate → resolve → learn"
      - "Triage → detect → resolve → mitigate → learn"
      - "Detect → resolve → mitigate → triage → learn"
    answer: 1
    explanation: |
      The standard arc is detect (alert/report) → triage (severity, declare, page) →
      mitigate (stop the bleeding) → resolve (durable fix, verify, stand down) → learn
      (blameless postmortem with action items).
    ref: "concepts.md#the-incident-lifecycle"

  - id: incident-management-and-troubleshooting-003
    difficulty: intermediate
    tags: [mitigate, resolve, phases]
    question: |
      An engineer rolls back a bad deploy; error rates return to normal and customers are
      fine, but the underlying bug is still in the code. In lifecycle terms, what is the
      correct status?
    options:
      - "Resolved — customers are healthy again"
      - "Detected but not triaged"
      - "Mitigated but not resolved — impact stopped, root cause not yet fixed"
      - "Learned — the postmortem is complete"
    answer: 2
    explanation: |
      Mitigation ends customer impact; resolution means the underlying cause is durably
      fixed. Rolling back stops the bleeding (mitigated) but the bug still exists, so it is
      not yet resolved. Stopping at mitigation is how incidents recur.
    ref: "concepts.md#the-incident-lifecycle"

  - id: incident-management-and-troubleshooting-004
    difficulty: beginner
    tags: [severity, sev-levels]
    question: |
      In a typical SEV scale, which is worse: a SEV1 or a SEV3?
    options:
      - "SEV3 — higher numbers mean higher severity"
      - "It depends on which was reported first"
      - "They are equal; the number only indicates the team"
      - "SEV1 — lower numbers mean higher severity/impact"
    answer: 3
    explanation: |
      By near-universal convention, a lower SEV number means higher impact. SEV1 is a
      critical, broad outage or data/security event; SEV3 is moderate, limited-scope impact.
    ref: "concepts.md#incident-severity-levels-sev1-to-sev4"

  - id: incident-management-and-troubleshooting-005
    difficulty: intermediate
    tags: [severity, priority]
    question: |
      What is the difference between an incident's severity and its priority?
    options:
      - "Severity measures customer impact; priority measures the order in which work is done"
      - "They are two words for the same thing"
      - "Severity is set by the customer; priority is set by legal"
      - "Priority always equals severity minus one"
    answer: 0
    explanation: |
      Severity classifies impact; priority orders work. They usually correlate, but a
      low-severity issue can be high-priority (e.g. a small leak that will become a SEV1
      soon), and vice versa.
    ref: "concepts.md#incident-severity-levels-sev1-to-sev4"

  - id: incident-management-and-troubleshooting-006
    difficulty: intermediate
    tags: [severity, triage, uncertainty]
    question: |
      A pager fires and you cannot yet tell how many customers are affected. What is the
      recommended severity approach?
    options:
      - "Wait until you know the full scope before assigning any severity"
      - "Always default to the lowest severity to avoid over-paging people"
      - "Declare high (conservatively) and downgrade later as you learn the scope"
      - "Assign a random severity and adjust after the postmortem"
    answer: 2
    explanation: |
      When blast radius is unknown, declare high and downgrade. Under-calling a real SEV1 as
      a SEV3 wastes the most precious resource in an incident — time. Downgrading later is
      cheap; under-responding is expensive.
    ref: "concepts.md#incident-severity-levels-sev1-to-sev4"

  - id: incident-management-and-troubleshooting-007
    difficulty: beginner
    tags: [roles, incident-commander]
    question: |
      What is the primary responsibility of the Incident Commander (IC)?
    options:
      - "To personally debug and fix the technical problem"
      - "To answer all customer support tickets during the outage"
      - "To write the code fix and merge it"
      - "To coordinate the response, make decisions, and delegate — not to touch the keyboard"
    answer: 3
    explanation: |
      The IC owns the incident, not the fix. They coordinate, decide, delegate, and keep the
      timeline. If the IC starts debugging, nobody is steering — which is exactly the failure
      the role exists to prevent.
    ref: "concepts.md#incident-command-roles"

  - id: incident-management-and-troubleshooting-008
    difficulty: intermediate
    tags: [roles, comms]
    question: |
      Why is the Communications (Comms) role kept separate from the Operations/Tech Lead
      during an incident?
    options:
      - "So stakeholder/customer updates don't interrupt the people applying the fix"
      - "So that legal can review every technical command before it runs"
      - "Because the Ops lead is not allowed to know the incident severity"
      - "It isn't — one person should always do both"
    answer: 0
    explanation: |
      Comms owns status-page and stakeholder updates so that answering 'any update?' doesn't
      interrupt the engineer typing the rollback command. Separating coordination, fixing,
      and communicating lets each proceed without contention.
    ref: "concepts.md#incident-command-roles"

  - id: incident-management-and-troubleshooting-009
    difficulty: intermediate
    tags: [roles, scale, seniority]
    question: |
      Which statement about incident-command roles is TRUE?
    options:
      - "The IC must always be the most senior engineer present"
      - "Every incident legally requires at least four distinct people"
      - "For a small incident one person may hold all roles; IC is about coordination, not seniority"
      - "The Ops Lead makes all final decisions, overriding the IC"
    answer: 2
    explanation: |
      The roles are a framework to scale into, not mandatory headcount — one person can wear
      all hats on a small incident. IC is a coordination role independent of seniority; a
      mid-level engineer can be IC while a principal is the Ops Lead.
    ref: "concepts.md#incident-command-roles"

  - id: incident-management-and-troubleshooting-010
    difficulty: intermediate
    tags: [roles, ic-scenario]
    question: |
      During a SEV1, the person acting as IC is also the team's best debugger and keeps
      diving into logs. What is the recommended fix?
    options:
      - "Let them do both — combining roles is more efficient"
      - "Hand off one of the roles so coordination and hands-on work aren't done by the same person"
      - "Remove the IC role entirely and let everyone self-organize"
      - "Escalate to the CEO to make all decisions"
    answer: 1
    explanation: |
      Coordination and debugging compete for attention. If the IC keeps debugging, steering
      collapses; if they keep commanding, the best hands sit idle. The answer is to hand off
      one role so both jobs get done.
    ref: "concepts.md#incident-command-roles"

  - id: incident-management-and-troubleshooting-011
    difficulty: beginner
    tags: [metrics, mttr]
    question: |
      What does MTTR most commonly stand for in incident management?
    options:
      - "Mean Time To Recover/Restore/Repair"
      - "Maximum Time To Reboot"
      - "Mean Time To Release"
      - "Median Time To Retry"
    answer: 0
    explanation: |
      MTTR is Mean Time To Recover/Restore/Repair — the time from failure (or detection) to
      service restored. It is overloaded (recover vs restore vs repair vs resolve), so you
      should always state which endpoint you mean.
    ref: "concepts.md#mttd-mtta-mttr-and-mtbf-the-incident-metrics"

  - id: incident-management-and-troubleshooting-012
    difficulty: intermediate
    tags: [metrics, mttd, mtta]
    question: |
      Which metric measures the time from an alert firing to the on-call engineer
      responding to it?
    options:
      - "MTTD (Mean Time To Detect)"
      - "MTBF (Mean Time Between Failures)"
      - "MTTA (Mean Time To Acknowledge)"
      - "MTTR (Mean Time To Recover)"
    answer: 2
    explanation: |
      MTTA is the gap between an alert firing and the on-call acknowledging it. MTTD is
      fault→noticed; MTTR is fault→restored; MTBF is the healthy time between incidents.
    ref: "concepts.md#mttd-mtta-mttr-and-mtbf-the-incident-metrics"

  - id: incident-management-and-troubleshooting-013
    difficulty: intermediate
    tags: [metrics, mtbf, mttr]
    question: |
      What is the key difference between MTBF and MTTR?
    options:
      - "MTBF measures recovery speed; MTTR measures failure frequency"
      - "MTBF applies only to hardware; MTTR applies only to software"
      - "They are the same metric with different names"
      - "MTBF measures how often failures occur (reliability); MTTR measures how fast you recover"
    answer: 3
    explanation: |
      MTBF (Mean Time Between Failures) is about frequency/reliability — the healthy interval
      between incidents. MTTR is about recovery speed. Availability ≈ MTBF/(MTBF+MTTR).
    ref: "concepts.md#mttd-mtta-mttr-and-mtbf-the-incident-metrics"

  - id: incident-management-and-troubleshooting-014
    difficulty: advanced
    tags: [metrics, availability, sre]
    question: |
      A service has MTBF ≈ 100 hours and MTTR ≈ 1 hour. Using availability ≈ MTBF/(MTBF+MTTR),
      which lever is generally the cheaper way for many teams to raise availability?
    options:
      - "Lowering MTTR (faster recovery) is often cheaper and more achievable than never failing"
      - "Only raising MTBF by eliminating every possible failure"
      - "Availability cannot be improved once MTBF is fixed"
      - "Reducing MTTA has no effect on availability at all"
    answer: 0
    explanation: |
      For 100/(100+1) ≈ 99.0%, halving MTTR to 0.5h yields 100/100.5 ≈ 99.5%. The SRE bet is
      that assuming failure and optimizing recovery (lower MTTR) is usually cheaper than
      chasing zero failures (infinite MTBF).
    ref: "concepts.md#mttd-mtta-mttr-and-mtbf-the-incident-metrics"

  - id: incident-management-and-troubleshooting-015
    difficulty: advanced
    tags: [metrics, mean, percentiles]
    question: |
      Why can relying on the "mean" in MTTR be misleading?
    options:
      - "Because the mean always equals the maximum recovery time"
      - "Because the mean ignores incidents shorter than one hour"
      - "Because MTTR cannot be computed for software systems"
      - "Because a few very long incidents can dominate the mean, hiding it; medians/percentiles often tell a truer story"
    answer: 3
    explanation: |
      Means are skewed by tails: a handful of multi-hour outages can dwarf many quick
      recoveries. Medians and percentiles often better represent the typical incident.
    ref: "concepts.md#mttd-mtta-mttr-and-mtbf-the-incident-metrics"

  - id: incident-management-and-troubleshooting-016
    difficulty: intermediate
    tags: [detection, alerting, symptom-based]
    question: |
      Why are symptom/SLO-based alerts (e.g. "checkout error rate > 2%") generally preferred
      over cause-based alerts (e.g. "CPU at 90%") for incident detection?
    options:
      - "Because CPU alerts are impossible to configure"
      - "Because symptom alerts never require a runbook"
      - "Because symptom alerts catch actual user pain regardless of the underlying cause, while cause alerts create noise"
      - "Because SLOs are only relevant to the finance team"
    answer: 2
    explanation: |
      Symptom/SLO alerts fire on user-visible impact whatever the cause, so they catch real
      problems and reduce noise. Cause alerts (high CPU) often fire without user impact,
      creating fatigue. The burn-rate math lives in the Observability domain.
    ref: "concepts.md#detection-escalation-and-paging"

  - id: incident-management-and-troubleshooting-017
    difficulty: beginner
    tags: [paging, notification]
    question: |
      What should distinguish something that "pages" (wakes) an on-call engineer from
      something that merely "notifies" them?
    options:
      - "A page should be reserved for actionable, urgent, user-impacting conditions; notifications are FYI with no immediate action"
      - "Pages are sent by email; notifications are sent by SMS"
      - "Pages are for SEV4 only; notifications are for SEV1"
      - "There is no difference; both wake the engineer"
    answer: 0
    explanation: |
      Paging (call/SMS/push that wakes someone) must be reserved for actionable, urgent,
      user-impacting conditions. Non-urgent FYIs should be notifications (email/chat) or
      tickets, so every page is worth waking a human for.
    ref: "concepts.md#detection-escalation-and-paging"

  - id: incident-management-and-troubleshooting-018
    difficulty: intermediate
    tags: [escalation, paging]
    question: |
      What is the purpose of an escalation policy in a paging tool like PagerDuty/Opsgenie?
    options:
      - "To ensure an unacknowledged page automatically moves to the next responder (secondary, lead) and never dead-ends"
      - "To send the same page to every employee in the company at once"
      - "To delay all pages by 30 minutes to reduce noise"
      - "To automatically resolve incidents without human involvement"
    answer: 0
    explanation: |
      An escalation policy defines who is paged next if no one acknowledges: primary →
      secondary → lead → manager. Its whole point is that an unacknowledged page always
      escalates to a human rather than being missed.
    ref: "concepts.md#detection-escalation-and-paging"

  - id: incident-management-and-troubleshooting-019
    difficulty: advanced
    tags: [alert-fatigue, reliability, paging]
    question: |
      Why is alert fatigue considered a reliability risk, not just an annoyance?
    options:
      - "Because noisy alerts increase cloud costs directly"
      - "Because fatigue automatically raises the severity of every incident"
      - "Because alerts consume too much network bandwidth"
      - "Because responders desensitized by frequent non-actionable pages start ignoring pages and may miss the real SEV1"
    answer: 3
    explanation: |
      When on-call is paged constantly for non-actionable noise, they stop trusting pages and
      may miss a genuine critical alert. Actionable-only paging is therefore a reliability
      control. Alert quality is covered deeply in the Observability domain.
    ref: "concepts.md#detection-escalation-and-paging"

  - id: incident-management-and-troubleshooting-020
    difficulty: intermediate
    tags: [mitigate-first, stop-the-bleeding]
    question: |
      What is the guiding principle behind "mitigate before you diagnose"?
    options:
      - "Never roll back a deploy until you have written the postmortem"
      - "During an active incident, restore service by the fastest safe means; save root-cause analysis for the postmortem"
      - "Always reproduce the bug in production before doing anything"
      - "Diagnose the root cause fully, then decide whether to respond"
    answer: 1
    explanation: |
      The job during an incident is to stop customer pain quickly (roll back, fail over,
      scale, flag off), not to understand why it broke. Diagnosis belongs in the postmortem
      when you're no longer under fire.
    ref: "concepts.md#mitigate-before-you-diagnose-stop-the-bleeding"

  - id: incident-management-and-troubleshooting-021
    difficulty: intermediate
    tags: [scenario, rollback, mitigate-first]
    question: |
      You deploy at 2:00pm; at 2:03pm error rates spike and the pager fires. What is the best
      FIRST action?
    options:
      - "Add more logging and try to reproduce the issue locally"
      - "Scale the database up and wait to see if it self-heals"
      - "Open a postmortem document and start the 5 Whys"
      - "Roll back the 2:00pm deploy, since the timing strongly implicates it, then investigate on the reverted system"
    answer: 3
    explanation: |
      The tight correlation between deploy and spike screams 'the deploy did it.' Roll back
      first to end customer impact, then diagnose at leisure. Adding logging to reproduce
      while customers burn is the classic trap.
    ref: "concepts.md#mitigate-before-you-diagnose-stop-the-bleeding"

  - id: incident-management-and-troubleshooting-022
    difficulty: intermediate
    tags: [mitigate-first, feature-flags]
    question: |
      Which of the following is a valid fast mitigation that does NOT require a code redeploy?
    options:
      - "Disabling the offending feature via a feature flag"
      - "Rewriting the failing service in a new language"
      - "Performing a full database schema migration"
      - "Waiting for the next scheduled release train"
    answer: 0
    explanation: |
      Feature flags decouple release from deploy, so you can turn off the offending behavior
      instantly without shipping new code. Other fast mitigations include rollback, failover,
      scaling, and load shedding.
    ref: "concepts.md#mitigate-before-you-diagnose-stop-the-bleeding"

  - id: incident-management-and-troubleshooting-023
    difficulty: advanced
    tags: [rollback, roll-forward, database]
    question: |
      In which situation is rolling back usually NOT a safe mitigation, forcing a
      roll-forward (fix-forward) instead?
    options:
      - "A stateless service returning 500s right after a deploy"
      - "An irreversible database migration or already-corrupted data that old code cannot read"
      - "A load balancer misconfiguration that can be reverted"
      - "A feature flag that was accidentally turned on"
    answer: 1
    explanation: |
      When a migration is irreversible, data is already corrupted, or a schema change made
      data unreadable by old code, rollback can worsen things — you must roll forward with a
      fast fix. Knowing when rollback is unsafe is a senior signal.
    ref: "concepts.md#mitigate-before-you-diagnose-stop-the-bleeding"

  - id: incident-management-and-troubleshooting-024
    difficulty: intermediate
    tags: [troubleshooting, recent-change]
    question: |
      In systematic troubleshooting, why is "what changed recently?" usually the first
      question to ask?
    options:
      - "Because changes are never the cause of incidents"
      - "Because it identifies who to blame for the outage"
      - "Because it is required by law"
      - "Because most production incidents are triggered by a recent change (deploy, config, flag, infra), so correlating the start time with the change log localizes the cause fast"
    answer: 3
    explanation: |
      The large majority of incidents are change-induced. Correlating the incident's start
      time with the change log (deploys, config pushes, flag flips, infra changes) is the
      fastest way to narrow the search — and it is diagnostic, not about blame.
    ref: "concepts.md#systematic-troubleshooting"

  - id: incident-management-and-troubleshooting-025
    difficulty: intermediate
    tags: [troubleshooting, bisection]
    question: |
      What does a bisection / divide-and-conquer troubleshooting approach look like in
      practice?
    options:
      - "Changing five variables at once to find the fix faster"
      - "Rebooting every server in the fleet simultaneously"
      - "Repeatedly halving the problem space — client vs server, one AZ vs all, this service vs its dependency, git bisect on commits"
      - "Only reading the most recent log line and stopping there"
    answer: 2
    explanation: |
      Bisection halves the search space each step (client or server? one AZ or all? which
      service? which commit via git bisect?), converging quickly instead of flailing. It
      pairs with changing one variable at a time.
    ref: "concepts.md#systematic-troubleshooting"

  - id: incident-management-and-troubleshooting-026
    difficulty: intermediate
    tags: [troubleshooting, one-variable]
    question: |
      Why should you change only one variable at a time while troubleshooting?
    options:
      - "So you can attribute cause — if you change five things at once you won't know which fixed (or worsened) it"
      - "To make the incident last longer"
      - "Because tooling only allows one change per hour"
      - "Because multiple changes are forbidden by DORA"
    answer: 0
    explanation: |
      Changing one variable at a time preserves attribution. If you change many things
      simultaneously and things improve (or degrade), you can't tell which change was
      responsible, undermining both the fix and the learning.
    ref: "concepts.md#systematic-troubleshooting"

  - id: incident-management-and-troubleshooting-027
    difficulty: intermediate
    tags: [troubleshooting, dependencies, boring-causes]
    question: |
      An app is failing intermittently with no recent code change. Which set of "boring"
      infrastructure causes is worth checking early?
    options:
      - "Only the application's business logic"
      - "The number of open pull requests"
      - "The color scheme of the dashboard"
      - "DNS resolution, expired TLS certs, disk full, connection-pool exhaustion, downstream throttling/quotas"
    answer: 3
    explanation: |
      A whole class of infra causes — DNS, cert expiry, disk full, pool exhaustion,
      downstream on fire, rate limits/quotas — is easy to overlook while staring at your own
      code. 'It's always DNS' is a meme because it's often true.
    ref: "concepts.md#systematic-troubleshooting"

  - id: incident-management-and-troubleshooting-028
    difficulty: intermediate
    tags: [troubleshooting, signals, observability]
    question: |
      What role do metrics, logs, and traces play in systematic troubleshooting?
    options:
      - "They are read to narrow the search space with data before forming theories, rather than guessing"
      - "They replace the need for any mitigation"
      - "They should be ignored during incidents to save time"
      - "They only matter after the incident is fully resolved"
    answer: 0
    explanation: |
      Signals (RED/USE metrics, logs, traces) tell you where it hurts so you can narrow the
      problem before hypothesizing. The mechanics of these signals are covered in the
      Observability domain; here they drive the troubleshooting method.
    ref: "concepts.md#systematic-troubleshooting"

  - id: incident-management-and-troubleshooting-029
    difficulty: beginner
    tags: [rca, five-whys]
    question: |
      What is the "5 Whys" technique?
    options:
      - "Asking five different teams to vote on the cause"
      - "Iteratively asking 'why?' to drill from the surface symptom down to deeper contributing causes"
      - "A rule that every incident must have exactly five root causes"
      - "A paging escalation policy with five levels"
    answer: 1
    explanation: |
      The 5 Whys drills from symptom to underlying cause by repeatedly asking why. Action
      items should then target the deeper answers (e.g. add a saturation alert and a test),
      not just the surface symptom (restart the app).
    ref: "concepts.md#root-cause-analysis-and-the-5-whys"

  - id: incident-management-and-troubleshooting-030
    difficulty: intermediate
    tags: [rca, timing, mitigation]
    question: |
      When should root-cause analysis primarily happen?
    options:
      - "Before mitigating, so you never roll back the wrong thing"
      - "During triage, before the severity is assigned"
      - "Only if a customer files a complaint"
      - "After mitigation, when customers are no longer in pain and you're not under fire"
    answer: 3
    explanation: |
      RCA is a post-mitigation activity. Its goal is preventing recurrence, not stopping the
      current bleeding — so it happens once impact is over, typically as part of the
      postmortem.
    ref: "concepts.md#root-cause-analysis-and-the-5-whys"

  - id: incident-management-and-troubleshooting-031
    difficulty: advanced
    tags: [rca, human-error, blameless]
    question: |
      In blameless root-cause analysis, why is "human error" rejected as a root cause?
    options:
      - "Because humans never make mistakes"
      - "Because blaming the human is the fastest fix"
      - "Because it's a symptom of a system that allowed the mistake — the deeper question is why the system had no guardrail, confirmation, or canary"
      - "Because only automated systems can cause incidents"
    answer: 2
    explanation: |
      'The engineer ran the wrong command' points to a system that permitted it (no guardrail,
      confusing UI, no confirmation, no canary). Asking why the system allowed it — not
      punishing the person — is the essence of blamelessness.
    ref: "concepts.md#root-cause-analysis-and-the-5-whys"

  - id: incident-management-and-troubleshooting-032
    difficulty: advanced
    tags: [rca, contributing-factors, swiss-cheese]
    question: |
      What is a key limitation of the linear 5 Whys for complex outages?
    options:
      - "It requires special software to run"
      - "Real outages usually have multiple contributing factors (Swiss-cheese model), so hunting for one single root cause can oversimplify"
      - "It can only be applied to hardware failures"
      - "It always produces exactly the right fix"
    answer: 1
    explanation: |
      Complex incidents rarely reduce to one culprit; several holes line up (Swiss cheese).
      Modern practice identifies multiple contributing factors. The 5 Whys is a fine starting
      tool but shouldn't force a single-cause narrative.
    ref: "concepts.md#root-cause-analysis-and-the-5-whys"

  - id: incident-management-and-troubleshooting-033
    difficulty: beginner
    tags: [postmortem, blameless]
    question: |
      What does "blameless" mean in a blameless postmortem?
    options:
      - "The analysis focuses on systems and contributing factors rather than punishing individuals"
      - "No postmortem is written so no one can be blamed"
      - "Only managers are allowed to attend"
      - "The engineer who caused it must apologize publicly"
    answer: 0
    explanation: |
      Blameless means examining systemic and contributing factors, assuming people acted
      reasonably with the information they had — never punishing individuals. This preserves
      psychological safety and honesty.
    ref: "concepts.md#blameless-postmortems-and-action-items"

  - id: incident-management-and-troubleshooting-034
    difficulty: intermediate
    tags: [postmortem, blameless, culture]
    question: |
      Why does a blame culture actually harm reliability?
    options:
      - "It makes postmortems too short"
      - "It has no effect; blame is neutral"
      - "Because it speeds up incident resolution too much"
      - "Because if naming a mistake gets you punished, people hide failures — and you lose the information needed to make systems safer"
    answer: 3
    explanation: |
      Blame optimizes for concealment. When admitting a mistake is dangerous, people stop
      volunteering the truth, so you lose the exact data that would prevent recurrence.
      Blameless culture is what makes learning possible.
    ref: "concepts.md#blameless-postmortems-and-action-items"

  - id: incident-management-and-troubleshooting-035
    difficulty: intermediate
    tags: [postmortem, action-items]
    question: |
      What is the actual deliverable/payload of a postmortem?
    options:
      - "A beautifully formatted document that everyone reads once"
      - "A ranking of engineers by number of incidents caused"
      - "A short list of owned, tracked, prioritized, verifiable action items"
      - "An apology email to customers"
    answer: 2
    explanation: |
      The document exists to produce action items. Good ones are owned (a named person),
      tracked (a real ticket with a due date), specific/verifiable, and prioritized. A
      postmortem with no tracked action items is theater.
    ref: "concepts.md#blameless-postmortems-and-action-items"

  - id: incident-management-and-troubleshooting-036
    difficulty: advanced
    tags: [postmortem, action-items, anti-pattern]
    question: |
      A team writes thorough postmortems but keeps suffering the same outage every few weeks.
      Which anti-pattern most likely explains this?
    options:
      - "Their postmortems produce no owned, tracked action items — so nothing actually changes"
      - "They declare severity too conservatively"
      - "They mitigate too quickly"
      - "They page too many people"
    answer: 0
    explanation: |
      The classic failure is a lovely doc everyone nods at and forgets. Without owned,
      tracked action items landing in the backlog, the systemic cause is never fixed and the
      incident recurs.
    ref: "concepts.md#blameless-postmortems-and-action-items"

  - id: incident-management-and-troubleshooting-037
    difficulty: beginner
    tags: [runbooks]
    question: |
      What is a runbook in the context of incident response?
    options:
      - "A log of every deploy ever made"
      - "A documented, often step-by-step procedure for handling a known situation, ideally linked from the alert"
      - "A list of all employees on the team"
      - "The source code of the affected service"
    answer: 1
    explanation: |
      A runbook is a concrete procedure for a known scenario ('if the payment queue backs up,
      do X, Y, Z; here are the dashboards'). Linking alerts to their runbook means a paged
      on-call isn't starting from zero at 3am.
    ref: "concepts.md#runbooks-and-playbooks"

  - id: incident-management-and-troubleshooting-038
    difficulty: intermediate
    tags: [runbooks, mttr]
    question: |
      How do good runbooks help incident response?
    options:
      - "They eliminate the need for on-call rotations entirely"
      - "They replace the need for monitoring"
      - "They increase severity automatically"
      - "They reduce MTTR and cognitive load and spread knowledge beyond the one person who knows the fix"
    answer: 3
    explanation: |
      Runbooks lower MTTR and cognitive load, democratize tribal knowledge, and make on-call
      survivable for newcomers. Fully deterministic runbooks are candidates for automation
      or self-healing.
    ref: "concepts.md#runbooks-and-playbooks"

  - id: incident-management-and-troubleshooting-039
    difficulty: intermediate
    tags: [runbooks, staleness]
    question: |
      Why can a stale runbook be worse than having no runbook at all?
    options:
      - "Because it takes up disk space"
      - "Because runbooks must be deleted every month by policy"
      - "Because it can send a responder down a dead end (e.g. referencing a decommissioned host), wasting time during an incident"
      - "Because it automatically raises the incident severity"
    answer: 2
    explanation: |
      A runbook pointing at a decommissioned host or obsolete steps actively misleads the
      responder, costing time. Runbooks must be kept alive — postmortem action items are a
      prime source of new/updated entries.
    ref: "concepts.md#runbooks-and-playbooks"

  - id: incident-management-and-troubleshooting-040
    difficulty: beginner
    tags: [status-page, comms]
    question: |
      What is the primary purpose of a public status page during an incident?
    options:
      - "To provide a single public source of truth about impact and progress, reducing the support/exec firestorm"
      - "To publish the root cause and assign blame in real time"
      - "To advertise new features"
      - "To collect customer payment information"
    answer: 0
    explanation: |
      A status page is the single public source of truth: acknowledge fast, then update on a
      regular cadence. It reduces the distracting firestorm of support tickets, exec pings,
      and social-media chatter that otherwise pulls responders away.
    ref: "concepts.md#status-pages-and-incident-communication"

  - id: incident-management-and-troubleshooting-041
    difficulty: intermediate
    tags: [comms, cadence]
    question: |
      Which communication practice is recommended during an ongoing incident?
    options:
      - "Go dark until you have the complete root-cause story, then post once"
      - "Post detailed internal debugging logs to the public status page"
      - "Only communicate after the postmortem is signed off"
      - "Post regular updates on a cadence even when there's no news ('still investigating, next update in 30 min')"
    answer: 3
    explanation: |
      Cadence beats content: steady 'no change yet' updates build trust, while silence reads
      as incompetence. Also keep external comms honest but measured, without premature
      root-cause claims you may have to retract.
    ref: "concepts.md#status-pages-and-incident-communication"

  - id: incident-management-and-troubleshooting-042
    difficulty: intermediate
    tags: [comms, internal-external]
    question: |
      How should internal (eng/exec) and external (customer) incident communications differ?
    options:
      - "Internal can be detailed and technical; external should be honest but measured — impact, scope, ETA-if-known — without premature root-cause claims"
      - "They should be identical to avoid confusion"
      - "External comms should include full stack traces and debugging logs"
      - "Internal comms should never mention the incident"
    answer: 0
    explanation: |
      Internal audiences can handle technical detail; customer-facing comms should state
      impact, scope, and ETA-if-known honestly but avoid premature root-cause claims that
      might later be retracted.
    ref: "concepts.md#status-pages-and-incident-communication"

  - id: incident-management-and-troubleshooting-043
    difficulty: beginner
    tags: [on-call, rotation]
    question: |
      What does "on-call" mean in operations?
    options:
      - "A permanent assignment of one engineer to fix all bugs forever"
      - "A rotation of engineers responsible for responding to pages for a service during a defined window"
      - "A meeting held after every deploy"
      - "A type of automated test"
    answer: 1
    explanation: |
      On-call is a rotation (often weekly) of engineers responsible for responding to pages
      for a service. It operationalizes 'you build it, you run it' and typically has primary
      and secondary responders with an escalation policy.
    ref: "concepts.md#on-call-basics"

  - id: incident-management-and-troubleshooting-044
    difficulty: intermediate
    tags: [on-call, sustainability, sre]
    question: |
      Per Google SRE guidance, why should on-call load be kept sustainable (a minority of the
      job, with caps on incidents per shift)?
    options:
      - "To make on-call shifts longer"
      - "Because sustainable on-call increases the number of incidents"
      - "So responders aren't burned out or overloaded and can respond effectively during a real event"
      - "Because it eliminates the need for runbooks"
    answer: 2
    explanation: |
      Overloaded, exhausted responders make poor decisions and miss signals. Sustainable
      on-call (bounded incidents per shift, compensation, follow-the-sun) keeps responders
      effective. Chronic pager noise is a bug to fix, not a rite of passage.
    ref: "concepts.md#on-call-basics"

  - id: incident-management-and-troubleshooting-045
    difficulty: intermediate
    tags: [on-call, follow-the-sun]
    question: |
      What problem does a "follow-the-sun" on-call model primarily address?
    options:
      - "It reduces cloud storage costs"
      - "It guarantees zero incidents"
      - "It eliminates the need for an incident commander"
      - "It uses teams in different time zones so people aren't paged at 3am, keeping on-call humane for global orgs"
    answer: 3
    explanation: |
      Follow-the-sun hands off on-call between geographically distributed teams so each
      handles pages during their daytime, avoiding middle-of-the-night pages — a humane
      pattern for global organizations.
    ref: "concepts.md#on-call-basics"

  - id: incident-management-and-troubleshooting-046
    difficulty: intermediate
    tags: [dora, metrics, change-failure-rate]
    question: |
      Which DORA metric directly measures the percentage of deployments that cause a failure
      requiring remediation (rollback, hotfix, incident)?
    options:
      - "Change Failure Rate"
      - "Lead Time for Changes"
      - "Deployment Frequency"
      - "Mean Time Between Failures"
    answer: 0
    explanation: |
      Change Failure Rate (CFR) is the share of deployments that lead to a failure needing
      remediation. It directly ties incident-causing changes to the delivery system and is
      one of DORA's four keys.
    ref: "concepts.md#how-incidents-connect-to-dora-metrics"

  - id: incident-management-and-troubleshooting-047
    difficulty: advanced
    tags: [dora, mttr, time-to-restore]
    question: |
      DORA's "time to restore service" (a.k.a. failed deployment recovery time) is essentially
      which incident concept viewed through the delivery lens?
    options:
      - "MTBF — how long between incidents"
      - "MTTD — how fast you detect a fault"
      - "MTTR — how fast you restore service after an incident/failed deploy"
      - "Deployment Frequency"
    answer: 2
    explanation: |
      DORA's time-to-restore is your incident MTTR (customer impact ended) seen from the
      delivery angle. Elite performers deploy often AND recover fast — the two goals reinforce
      each other via small, reversible changes and practiced response.
    ref: "concepts.md#how-incidents-connect-to-dora-metrics"

  - id: incident-management-and-troubleshooting-048
    difficulty: advanced
    tags: [dora, scenario, small-changes]
    question: |
      Two teams ship the same features. Team A deploys tiny changes many times a day with
      automated rollback; Team B deploys one big release monthly. Why does Team A typically
      have a lower time-to-restore?
    options:
      - "Because monthly releases are always bug-free"
      - "Because time-to-restore only depends on team size"
      - "Because Team A never has incidents"
      - "Because small, frequent, reversible changes shrink blast radius and make rollback fast and reliable, so recovery is quicker"
    answer: 3
    explanation: |
      Small frequent deploys mean each change is easy to identify and revert, shrinking blast
      radius and speeding rollback — the delivery practices that give DORA elite teams both
      high throughput and low recovery time.
    ref: "concepts.md#how-incidents-connect-to-dora-metrics"

  - id: incident-management-and-troubleshooting-049
    difficulty: intermediate
    tags: [scale, boundaries, reliability-domain]
    question: |
      This DevOps topic gives the delivery framing of incidents. Where do the deep on-call
      process, chaos engineering, and error-budget-driven policy live?
    options:
      - "In this same topic, later sections"
      - "In the upcoming Reliability & Operations domain, with alerting math in Observability"
      - "In the Git & Branching Strategies topic"
      - "Nowhere — they aren't covered anywhere"
    answer: 1
    explanation: |
      The deep incident/on-call/chaos process belongs to the upcoming Reliability &
      Operations domain; alert quality and SLO burn-rate math live in Observability
      (slo-based-alerting-and-error-budgets). This topic covers the DevOps/delivery framing.
    ref: "concepts.md#on-call-basics"

  - id: incident-management-and-troubleshooting-050
    difficulty: intermediate
    tags: [scenario, lifecycle, comms, mitigate]
    question: |
      During a SEV1 the IC assigns roles, the Ops lead is rolling back, and stakeholders keep
      pinging the incident channel asking for updates, distracting responders. What is the
      correct move?
    options:
      - "Have the Ops lead stop the rollback to answer each stakeholder"
      - "Ignore all stakeholders until the incident is fully resolved"
      - "Route stakeholder questions to the Comms lead, who posts regular status-page/exec updates so Ops can focus on the fix"
      - "Escalate the severity to SEV0 to silence the channel"
    answer: 2
    explanation: |
      Communication is a first-class workstream owned by the Comms lead precisely so
      stakeholder questions don't interrupt the person applying the fix. Comms posts
      regular-cadence updates while Ops focuses on mitigation.
    ref: "concepts.md#status-pages-and-incident-communication"
