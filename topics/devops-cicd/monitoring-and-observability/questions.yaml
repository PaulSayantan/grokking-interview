topic: "Monitoring & Observability (DevOps view)"
domain: devops-cicd
topic_slug: monitoring-and-observability
version: 1
questions:
- id: monitoring-and-observability-001
  difficulty: beginner
  tags: [pillars, fundamentals]
  question: |
    What are the conventional "three pillars" of observability?
  options:
  - Dashboards, alerts, and runbooks
  - Metrics, logs, and traces
  - Uptime, latency, and cost
  - CPU, memory, and disk
  answer: 1
  explanation: |
    The three pillars are metrics (cheap aggregatable time series), logs (detailed
    timestamped events), and traces (the causal path of a request across services).
    Each answers different questions and has different cost/cardinality profiles.
  ref: "concepts.md#three-pillars-recap-and-the-devops-boundary"
- id: monitoring-and-observability-002
  difficulty: beginner
  tags: [monitoring-vs-observability]
  question: |
    Which statement best captures the distinction between monitoring and observability?
  options:
  - Monitoring is for production; observability is for staging
  - They are the same thing with different marketing names
  - Monitoring watches known failure modes via predefined signals; observability lets you debug unknown failure modes after the fact
  - Observability replaces the need for any alerting
  answer: 2
  explanation: |
    Monitoring is watching failure modes you anticipated (predefined dashboards/alerts).
    Observability is the property that lets you ask new, unanticipated questions about
    internal state from the outside without shipping new code. You need both.
  ref: "concepts.md#three-pillars-recap-and-the-devops-boundary"
- id: monitoring-and-observability-003
  difficulty: intermediate
  tags: [boundary, scope]
  question: |
    In a DevOps interview, which framing of "monitoring & observability" is most on-target
    for this delivery-pipeline topic?
  options:
  - Deriving PromQL queries and OpenTelemetry span internals from scratch
  - Tuning the Prometheus TSDB compaction settings
  - Explaining log-index sharding and cardinality budgets in depth
  - How observability serves delivery — deploy markers, DORA, release gates, and rollback
  answer: 3
  explanation: |
    The deep mechanics (PromQL, OTel, cardinality, SLO math) belong to the dedicated
    observability/SRE domains. The DevOps framing is how these signals plug into the
    pipeline: deploy markers, DORA metrics, smoke/synthetic gates, and automated rollback.
  ref: "concepts.md#three-pillars-recap-and-the-devops-boundary"
- id: monitoring-and-observability-004
  difficulty: beginner
  tags: [deploy-markers]
  question: |
    What is a "deployment marker" (annotation) in an observability backend?
  options:
  - A timestamped record of a deploy's time/version/environment overlaid on metrics
  - A feature flag that hides a release
  - A unit test that runs before deploy
  - A firewall rule that opens traffic to a new version
  answer: 0
  explanation: |
    A deployment marker is a timestamped event (with version/env/service tags) pushed at
    release time, shown as a vertical line on dashboards so you can correlate a metric
    change with the exact deploy that caused it.
  ref: "concepts.md#deployment-markers-and-annotations"
- id: monitoring-and-observability-005
  difficulty: intermediate
  tags: [deploy-markers, correlation]
  question: |
    Why are deployment markers considered a prerequisite for automated rollback?
  options:
  - They speed up the build cache
  - They encrypt secrets used during deploy
  - They record which version is running so the system knows the last known-good to revert to
  - They replace readiness probes
  answer: 2
  explanation: |
    Automated rollback must know which version to revert to. Markers record version and
    time, letting the system (and humans) correlate a regression with a deploy and revert
    to the last known-good artifact.
  ref: "concepts.md#deployment-markers-and-annotations"
- id: monitoring-and-observability-006
  difficulty: intermediate
  tags: [deploy-markers, gotcha]
  question: |
    A team stamps the deployment marker at the *start* of a 20-minute rolling deploy, then
    is confused that the marker line does not align with the observed latency spike. What is
    the fix?
  options:
  - Emit the marker as close to the actual traffic cutover as possible, not at pipeline start
  - Remove the marker entirely and rely on logs
  - Increase the metric scrape interval to 5 minutes
  - Stamp the marker a day later once the dashboard is reviewed
  answer: 0
  explanation: |
    A marker at pipeline start precedes the real cutover by the full rollout duration, so it
    will not line up with the metric change. Emit it at (or near) the traffic cutover so
    correlation works.
  ref: "concepts.md#deployment-markers-and-annotations"
- id: monitoring-and-observability-007
  difficulty: intermediate
  tags: [deploy-markers, tags]
  question: |
    Which set of tags/labels makes a deployment marker most useful for on-call correlation?
  options:
  - Random UUID only
  - Just the wall-clock timestamp
  - The runner's IP address and OS version
  - Version, environment, service, and who/what triggered the deploy
  answer: 3
  explanation: |
    Rich tags (version, environment, service, trigger/actor) let responders filter markers
    to the relevant service/env and immediately answer "what changed?" during an incident.
  ref: "concepts.md#deployment-markers-and-annotations"
- id: monitoring-and-observability-008
  difficulty: beginner
  tags: [dora, four-keys]
  question: |
    Which of the following is one of the DORA four key metrics?
  options:
  - Lines of code per developer
  - Number of open pull requests
  - Story points completed per sprint
  - Change Failure Rate
  answer: 3
  explanation: |
    The DORA four keys are Deployment Frequency, Lead Time for Changes, Change Failure Rate,
    and Failed Deployment Recovery Time. The others are activity/output proxies, not DORA
    delivery-performance metrics.
  ref: "concepts.md#dora-metrics-the-four-keys"
- id: monitoring-and-observability-009
  difficulty: intermediate
  tags: [dora, categories]
  question: |
    DORA splits its four keys into two categories. Which pairing is correct?
  options:
  - Deployment Frequency and Lead Time measure throughput; Change Failure Rate and Recovery Time measure stability
  - All four measure stability
  - Deployment Frequency and Change Failure Rate measure speed; the others measure cost
  - Lead Time and Recovery Time measure throughput; the others measure security
  answer: 0
  explanation: |
    Deployment Frequency and Lead Time for Changes are throughput (speed) metrics; Change
    Failure Rate and Failed Deployment Recovery Time are stability metrics. The Accelerate
    research found the two are not a trade-off — elite teams excel at both.
  ref: "concepts.md#dora-metrics-the-four-keys"
- id: monitoring-and-observability-010
  difficulty: intermediate
  tags: [dora, lead-time, definition]
  question: |
    How is DORA "Lead Time for Changes" defined?
  options:
  - Time from idea/ticket creation to code committed
  - Time a PR waits for review
  - Time from code committed to that change running in production
  - Time to restore service after an incident
  answer: 2
  explanation: |
    Lead Time for Changes measures commit → running in production. (The broader
    idea-to-delivery time is "product lead time"; recovery time is a separate DORA key.)
  ref: "concepts.md#dora-metrics-the-four-keys"
- id: monitoring-and-observability-011
  difficulty: advanced
  tags: [dora, cfr, scenario]
  question: |
    Team A deploys 100×/day with 5 failing deploys/day. Team B deploys 2×/month with 1
    failing deploy/month. Comparing Change Failure Rate, what is true?
  options:
  - Team A's CFR is 50%, worse than Team B
  - Team B's CFR is 5%, better than Team A
  - Team A's CFR is 5%; Team B's is 50% — Team A is healthier on CFR
  - CFR cannot be computed from this data
  answer: 2
  explanation: |
    CFR is a rate: A = 5/100 = 5%; B = 1/2 = 50%. Small, frequent deploys typically lower
    both blast radius and CFR. Counting failures instead of the rate would mislead here.
  ref: "concepts.md#dora-metrics-the-four-keys"
- id: monitoring-and-observability-012
  difficulty: intermediate
  tags: [dora, elite]
  question: |
    According to DORA performance clusters, roughly what lead time and recovery time
    characterize "elite" performers?
  options:
  - Both between 1 and 6 months
  - Lead time of about a week and recovery within a day
  - Lead time of a month; recovery is not measured
  - Lead time under 1 hour and recovery time under 1 hour
  answer: 3
  explanation: |
    Elite performers deploy on demand and show lead time under an hour and failed-deployment
    recovery under an hour. Longer times map to high/medium/low clusters.
  ref: "concepts.md#dora-metrics-the-four-keys"
- id: monitoring-and-observability-013
  difficulty: advanced
  tags: [dora, anti-patterns]
  question: |
    What is the main risk of using DORA metrics as individual-developer performance targets?
  options:
  - They become too expensive to compute
  - They are encrypted and cannot be shared
  - People game them (e.g. splitting one change into ten deploys to inflate frequency)
  - They automatically trigger rollbacks
  answer: 2
  explanation: |
    DORA keys are system-level outcome metrics. Weaponizing them against individuals causes
    gaming — inflating deploy frequency by fragmenting changes, or hiding failures — which
    destroys their value as honest signals.
  ref: "concepts.md#dora-metrics-the-four-keys"
- id: monitoring-and-observability-014
  difficulty: advanced
  tags: [dora, fifth-metric]
  question: |
    Beyond the original four keys, what fifth measure did DORA later add to reflect SRE
    practice?
  options:
  - Reliability (operational performance / meeting user expectations)
  - Test coverage percentage
  - Cloud spend per deploy
  - Number of microservices
  answer: 0
  explanation: |
    DORA added reliability as a fifth measure — how well the service meets user
    expectations operationally — connecting delivery throughput/stability with SRE-style
    SLO outcomes.
  ref: "concepts.md#dora-metrics-the-four-keys"
- id: monitoring-and-observability-015
  difficulty: intermediate
  tags: [dora, computation]
  question: |
    From which readily-available data can you compute DORA lead time for changes?
  options:
  - Commit timestamp to deployment timestamp
  - The number of Slack messages during a release
  - The size of the container image
  - The number of reviewers on a PR
  answer: 0
  explanation: |
    Lead time = deploy timestamp − commit timestamp, both of which the VCS and deploy tool
    already record. Deploy frequency comes from deploy events; CFR and recovery from
    incident/rollback records.
  ref: "concepts.md#dora-metrics-the-four-keys"
- id: monitoring-and-observability-016
  difficulty: beginner
  tags: [pipeline-monitoring]
  question: |
    Why should the CI/CD pipeline itself be treated as a monitored system?
  options:
  - Because pipelines never fail and monitoring proves it
  - Only to satisfy compliance audits
  - Because runners require antivirus scanning
  - Because a slow or flaky pipeline directly hurts throughput and feedback latency for every commit
  answer: 3
  explanation: |
    The pipeline is production infrastructure for engineers. Slow builds, long queue times,
    and flaky tests tax every change, raise DORA lead time, and erode trust — so its signals
    must be tracked.
  ref: "concepts.md#monitoring-the-pipeline-itself"
- id: monitoring-and-observability-017
  difficulty: intermediate
  tags: [pipeline-monitoring, queue-time]
  question: |
    Builds run quickly once started, but developers complain feedback is slow. Pipeline
    metrics show high "queue time." What does this most likely indicate?
  options:
  - The tests are flaky
  - The application has a memory leak
  - Runner/agent starvation — jobs wait for an executor before running
  - The container image is too large
  answer: 2
  explanation: |
    High queue (wait) time with fast run time means jobs are waiting for an available
    runner/agent. The fix is more concurrency/runners, not faster tests. Queue time + run
    time = feedback latency.
  ref: "concepts.md#monitoring-the-pipeline-itself"
- id: monitoring-and-observability-018
  difficulty: intermediate
  tags: [pipeline-monitoring, flaky]
  question: |
    Which metric best captures pipeline "flakiness"?
  options:
  - Total number of lines changed per commit
  - The size of the artifact repository
  - The number of environment variables
  - The fraction of failures that pass on retry with no code change
  answer: 3
  explanation: |
    Flaky rate = failures that later pass on retry without any code change. It signals
    non-deterministic tests/infrastructure and, if hidden by retries, silently erodes trust
    in the pipeline.
  ref: "concepts.md#monitoring-the-pipeline-itself"
- id: monitoring-and-observability-019
  difficulty: advanced
  tags: [pipeline-monitoring, anti-pattern]
  question: |
    A team retries red builds until they turn green and reports a 98% success rate. Why is
    this metric misleading?
  options:
  - Retrying until green ("retry roulette") hides flakiness and inflates apparent success while destroying feedback latency
  - It counts only first-attempt failures
  - Success rate is irrelevant to delivery
  - Retries make builds deterministic
  answer: 0
  explanation: |
    Retrying until green masks flaky tests: the reported success rate looks healthy while
    real feedback latency balloons and genuine failures may be retried away. Track
    first-attempt pass rate and flaky rate separately.
  ref: "concepts.md#monitoring-the-pipeline-itself"
- id: monitoring-and-observability-020
  difficulty: beginner
  tags: [golden-signals]
  question: |
    What are Google SRE's "four golden signals"?
  options:
  - Build, test, deploy, monitor
  - CPU, memory, disk, and network
  - Availability, durability, cost, and security
  - Latency, traffic, errors, and saturation
  answer: 3
  explanation: |
    The four golden signals are latency, traffic, errors, and saturation — the minimum set
    to watch for any user-facing service, and an ideal release health check during/after a
    deploy.
  ref: "concepts.md#the-four-golden-signals-as-a-release-health-check"
- id: monitoring-and-observability-021
  difficulty: intermediate
  tags: [golden-signals, latency]
  question: |
    When watching latency as a golden signal, which practice matters most?
  options:
  - Track only the mean latency
  - Only measure latency during business hours
  - Separate successful-request latency from failed-request latency and watch tail percentiles (p95/p99)
  - Convert latency to a single daily average
  answer: 2
  explanation: |
    Averages hide tail pain and fast-failing errors can flatter the mean. Separate success
    vs failure latency and watch p95/p99 so tail regressions during a rollout are visible.
  ref: "concepts.md#the-four-golden-signals-as-a-release-health-check"
- id: monitoring-and-observability-022
  difficulty: intermediate
  tags: [golden-signals, saturation]
  question: |
    Which golden signal does "queue depth / how full the most-constrained resource is" map to?
  options:
  - Traffic
  - Errors
  - Saturation
  - Latency
  answer: 2
  explanation: |
    Saturation measures how "full" the service is — the resource closest to its limit
    (CPU, memory, queue depth). It often predicts imminent latency/error degradation.
  ref: "concepts.md#the-four-golden-signals-as-a-release-health-check"
- id: monitoring-and-observability-023
  difficulty: advanced
  tags: [golden-signals, red, use]
  question: |
    How do the RED and USE methods relate to the golden signals?
  options:
  - RED replaces golden signals; USE is obsolete
  - RED (Rate, Errors, Duration) targets request-driven services; USE (Utilization, Saturation, Errors) targets resources
  - Both only apply to databases
  - USE measures user experience directly and RED measures cost
  answer: 1
  explanation: |
    RED (Rate/Errors/Duration) is a request-service view ≈ traffic+errors+latency; USE
    (Utilization/Saturation/Errors) is a resource view emphasizing saturation. They are
    complementary lenses onto the same golden-signal ideas.
  ref: "concepts.md#the-four-golden-signals-as-a-release-health-check"
- id: monitoring-and-observability-024
  difficulty: advanced
  tags: [golden-signals, canary, gate]
  question: |
    During a canary deploy, how are the golden signals used as a release gate?
  options:
  - They are ignored until the rollout is 100% complete
  - Only saturation is checked, and only on the old version
  - They are averaged across a month before any decision
  - The canary version's signals are compared against the baseline; a regression halts or rolls back the rollout
  answer: 3
  explanation: |
    Progressive-delivery controllers (Argo Rollouts, Flagger) query the golden signals for
    the canary vs baseline; a regression in latency/errors/etc. aborts promotion and shifts
    traffic back to stable.
  ref: "concepts.md#the-four-golden-signals-as-a-release-health-check"
- id: monitoring-and-observability-025
  difficulty: beginner
  tags: [smoke-test]
  question: |
    What is a post-deploy smoke test?
  options:
  - A load test simulating peak traffic for hours
  - A static code-analysis scan
  - A small, fast set of checks run right after deploy to confirm the release is minimally healthy
  - A database backup verification job
  answer: 2
  explanation: |
    A smoke test is a quick "is it on fire?" check run immediately after deploy against the
    just-deployed environment (e.g. hit /health, place one test order). Failure gates
    promotion or triggers rollback.
  ref: "concepts.md#post-deploy-smoke-tests-and-synthetic-monitoring-as-a-release-gate"
- id: monitoring-and-observability-026
  difficulty: intermediate
  tags: [synthetic-monitoring]
  question: |
    How does synthetic monitoring differ from a post-deploy smoke test?
  options:
  - Synthetic monitoring runs once in the pipeline; smoke tests run continuously
  - Synthetic monitoring runs scripted transactions against production continuously; a smoke test is a one-shot in-pipeline release gate
  - They are identical
  - Synthetic monitoring only inspects logs, never sends requests
  answer: 1
  explanation: |
    Synthetic (active/probe) monitoring runs scripted transactions against production
    continuously from multiple locations, catching issues any time — including at zero
    traffic. A smoke test is a single in-pipeline gate for the current release.
  ref: "concepts.md#post-deploy-smoke-tests-and-synthetic-monitoring-as-a-release-gate"
- id: monitoring-and-observability-027
  difficulty: intermediate
  tags: [synthetic-monitoring, zero-traffic]
  question: |
    What is a key advantage of synthetic monitoring over relying solely on real-user metrics?
  options:
  - It eliminates the need for any real users
  - It is cheaper than collecting any metrics
  - It replaces the need for deployment markers
  - It gives a health signal even when there is little or no real traffic (e.g. 3 a.m.)
  answer: 3
  explanation: |
    Because synthetics generate their own scripted traffic continuously, they surface
    outages/regressions before or without a real user hitting them — valuable during
    low-traffic windows.
  ref: "concepts.md#post-deploy-smoke-tests-and-synthetic-monitoring-as-a-release-gate"
- id: monitoring-and-observability-028
  difficulty: advanced
  tags: [smoke-test, gotcha, scenario]
  question: |
    A post-deploy smoke test mocks the database and leaves test orders in the system. What
    are the two problems with this design?
  options:
  - It runs too fast and uses too little CPU
  - It cannot be written in YAML
  - It requires a second Kubernetes cluster
  - Mocking dependencies gives false confidence, and non-idempotent test data pollutes production
  answer: 3
  explanation: |
    Smoke tests are black-box checks that should exercise real dependencies to be
    meaningful; mocking the DB defeats the point. And test data must be idempotent/cleanable
    so it does not pollute prod.
  ref: "concepts.md#post-deploy-smoke-tests-and-synthetic-monitoring-as-a-release-gate"
- id: monitoring-and-observability-029
  difficulty: intermediate
  tags: [smoke-test, pipeline, scenario]
  question: |
    In the GitLab CI stage below, what happens if the smoke test's curl to /health fails?

    smoke-test:
      stage: verify
      needs: [deploy-prod]
      script:
        - curl -sf https://checkout.example.com/health || exit 1
  options:
  - Nothing; verify stages never affect the pipeline result
  - The job exits non-zero, failing the pipeline and enabling rollback of the deploy
  - The deploy job automatically re-runs the build
  - GitLab silently marks the pipeline green
  answer: 1
  explanation: |
    `curl -sf ... || exit 1` returns non-zero on failure, which fails the smoke-test job and
    the pipeline. That failure is what gates the release and lets a rollback step run.
  ref: "concepts.md#post-deploy-smoke-tests-and-synthetic-monitoring-as-a-release-gate"
- id: monitoring-and-observability-030
  difficulty: beginner
  tags: [health-checks, readiness]
  question: |
    In Kubernetes, what does a failing *readiness* probe cause?
  options:
  - The container is restarted immediately
  - The whole node is drained
  - The instance is removed from the load-balancer/service endpoints but not restarted
  - The deployment is rolled back automatically
  answer: 2
  explanation: |
    A failed readiness probe pulls the instance out of the service's endpoints so it stops
    receiving traffic; it is not restarted. This is the primitive that gates traffic during
    rolling deploys.
  ref: "concepts.md#health-checks-and-readiness-for-deploy-gating"
- id: monitoring-and-observability-031
  difficulty: beginner
  tags: [health-checks, liveness]
  question: |
    What does a failing *liveness* probe cause?
  options:
  - The container is restarted
  - The instance keeps serving traffic normally
  - A new version is deployed
  - The load balancer scales out
  answer: 0
  explanation: |
    A failed liveness probe means the process is considered wedged, so the orchestrator
    restarts the container. Liveness should be cheap and independent of downstream services.
  ref: "concepts.md#health-checks-and-readiness-for-deploy-gating"
- id: monitoring-and-observability-032
  difficulty: advanced
  tags: [health-checks, liveness, outage, scenario]
  question: |
    An engineer makes the liveness probe call a downstream payments API. When payments has a
    brief blip, the whole service crash-loops. What is the root cause?
  options:
  - Liveness probes should always call downstream services
  - The readiness probe interval was too long
  - The startup probe was missing
  - A liveness probe that depends on a downstream turns a partial degradation into a mass restart storm
  answer: 3
  explanation: |
    Liveness restarts the pod. Coupling it to a downstream means every replica fails liveness
    when that dependency blips, restarting them all at once — escalating a partial issue into
    a total outage. Keep liveness shallow and dependency-free.
  ref: "concepts.md#health-checks-and-readiness-for-deploy-gating"
- id: monitoring-and-observability-033
  difficulty: intermediate
  tags: [health-checks, startup]
  question: |
    What problem does a Kubernetes *startup* probe solve?
  options:
  - It encrypts secrets during boot
  - It measures DORA lead time
  - It holds off liveness/readiness checks until a slow-booting app finishes initializing, so warm-up is not mistaken for a hang
  - It replaces the need for readiness probes entirely
  answer: 2
  explanation: |
    Startup probes give slow-starting apps time to initialize before liveness/readiness kick
    in, preventing the orchestrator from killing a container that is simply still warming up.
  ref: "concepts.md#health-checks-and-readiness-for-deploy-gating"
- id: monitoring-and-observability-034
  difficulty: advanced
  tags: [health-checks, zero-downtime]
  question: |
    Why does a correctly configured readiness probe enable zero-downtime rolling deploys?
  options:
  - It makes the build faster
  - Traffic is routed to a new instance only once it reports ready, so requests never hit a not-yet-initialized instance
  - It disables the old version instantly
  - It caches responses at the load balancer
  answer: 1
  explanation: |
    During a rolling update, new pods receive traffic only after passing readiness. Combined
    with graceful shutdown of old pods, no request is routed to an instance that cannot yet
    serve it — achieving zero downtime.
  ref: "concepts.md#health-checks-and-readiness-for-deploy-gating"
- id: monitoring-and-observability-035
  difficulty: intermediate
  tags: [health-checks, design]
  question: |
    Which health-check design follows best practice?
  options:
  - Make /healthz (liveness) deep-check all downstreams and /ready (readiness) shallow
  - Point both probes at the same downstream database
  - Disable probes and rely on manual checks
  - Make /ready check the dependencies the instance genuinely needs and keep /healthz shallow
  answer: 3
  explanation: |
    Readiness should verify the instance can actually serve (needed dependencies warm),
    gating traffic; liveness should stay shallow so transient downstream issues do not trigger
    restart storms.
  ref: "concepts.md#health-checks-and-readiness-for-deploy-gating"
- id: monitoring-and-observability-036
  difficulty: beginner
  tags: [automated-rollback]
  question: |
    What is "automated rollback on SLO breach"?
  options:
  - Manually paging an engineer to revert
  - The pipeline/controller automatically reverts to the last known-good version when health signals regress
  - Deleting the metrics that show a regression
  - Rebuilding the artifact from scratch on failure
  answer: 1
  explanation: |
    Automated rollback watches health signals (golden signals, error rate, SLO burn) during
    and after a deploy and, on a regression/breach, reverts to the last known-good version
    without a human in the fast path.
  ref: "concepts.md#automated-rollback-on-slo-breach"
- id: monitoring-and-observability-037
  difficulty: intermediate
  tags: [automated-rollback, canary, tools]
  question: |
    In Argo Rollouts, what mechanism decides whether to promote or abort a canary based on
    metrics?
  options:
  - A CronJob that emails the team
  - The readiness probe alone
  - An AnalysisTemplate that runs a metric query (e.g. Prometheus) against the canary
  - A manual Slack approval only
  answer: 2
  explanation: |
    Argo Rollouts uses AnalysisTemplates (Flagger has an analogous mechanism) to query
    metrics like success rate/latency against the canary; if the success condition fails, the
    rollout aborts and shifts traffic back to stable.
  ref: "concepts.md#automated-rollback-on-slo-breach"
- id: monitoring-and-observability-038
  difficulty: intermediate
  tags: [automated-rollback, bake-time]
  question: |
    What is the purpose of "bake time" in a progressive rollout?
  options:
  - To compile the artifact more thoroughly
  - To warm the CDN cache
  - To rotate secrets between steps
  - A deliberate soak period so slow-burning issues (leaks, load-dependent errors) surface before full promotion
  answer: 3
  explanation: |
    Bake time is a soak at each canary step giving slow-manifesting problems (memory leaks,
    error spikes under sustained load) time to appear before you promote to more traffic.
  ref: "concepts.md#automated-rollback-on-slo-breach"
- id: monitoring-and-observability-039
  difficulty: advanced
  tags: [automated-rollback, database, prerequisite]
  question: |
    Why is backward-compatible (expand/contract) database migration a prerequisite for
    confident automated rollback?
  options:
  - Rollback is only safe if the previous app version can run against the current database
  - Because migrations make the pipeline faster
  - Because it reduces the container image size
  - It is not related to rollback at all
  answer: 0
  explanation: |
    Rolling back reverts the app to the prior artifact, but the database is still at the new
    schema. Only backward-compatible (expand/contract) changes let the old version keep
    working, so rollback is safe.
  ref: "concepts.md#automated-rollback-on-slo-breach"
- id: monitoring-and-observability-040
  difficulty: intermediate
  tags: [automated-rollback, rollback-vs-rollforward]
  question: |
    How do "rollback" and "roll-forward" differ?
  options:
  - Rollback ships a new fix; roll-forward reverts to the old artifact
  - They are the same operation
  - Rollback reverts to the prior artifact; roll-forward ships a new fix
  - Rollback only applies to databases; roll-forward only to code
  answer: 2
  explanation: |
    Rollback reverts to the previously deployed (known-good) artifact — fast and safe when
    changes are backward-compatible. Roll-forward fixes the problem by shipping a new version
    instead of reverting.
  ref: "concepts.md#automated-rollback-on-slo-breach"
- id: monitoring-and-observability-041
  difficulty: advanced
  tags: [automated-rollback, aws, alarm]
  question: |
    Besides canary metric analysis, what is another common trigger for automated rollback?
  options:
  - The number of files changed in the commit
  - The developer's local test results
  - The size of the Git repository
  - An alarm/SLO burn-rate breach within a bake window (e.g. AWS CodeDeploy rollback on a CloudWatch alarm)
  answer: 3
  explanation: |
    Deploys can be tied to alarms/SLO burn-rate; a breach within the bake window trips
    rollback. AWS CodeDeploy, for example, can auto-rollback when a configured CloudWatch
    alarm fires.
  ref: "concepts.md#automated-rollback-on-slo-breach"
- id: monitoring-and-observability-042
  difficulty: advanced
  tags: [automated-rollback, testing]
  question: |
    Why must the rollback path itself be tested?
  options:
  - Because untested rollbacks are not a real safety net and may fail when you need them most
  - Because testing rollback increases deploy frequency
  - Rollbacks never need testing since they use old code
  - To satisfy the linter
  answer: 0
  explanation: |
    A rollback you have never exercised may fail (bad artifact retention, incompatible schema,
    broken automation) precisely during an incident. Treat rollback as a first-class, tested
    procedure.
  ref: "concepts.md#automated-rollback-on-slo-breach"
- id: monitoring-and-observability-043
  difficulty: beginner
  tags: [alerting]
  question: |
    Per SRE alerting guidance, what should you primarily alert (page) on?
  options:
  - Every metric that crosses a static threshold
  - Symptoms users feel (e.g. checkout error rate high), not internal causes like CPU 80%
  - Only disk usage
  - Every deploy event
  answer: 1
  explanation: |
    Alert on user-facing symptoms (SLO burn, golden-signal regressions), not causes. Cause
    alerts (CPU high) are noisy and miss novel failures; symptom alerts catch what actually
    hurts users.
  ref: "concepts.md#alerting-and-routing-to-on-call"
- id: monitoring-and-observability-044
  difficulty: intermediate
  tags: [alerting, actionable]
  question: |
    What is the guiding rule for whether something should page an on-call engineer?
  options:
  - Every log line above INFO should page
  - Page as often as possible to stay vigilant
  - Only page during business hours regardless of severity
  - Every page must be actionable — if there is nothing to do, make it a ticket or dashboard, not a page
  answer: 3
  explanation: |
    Non-actionable pages cause alert fatigue and make real pages get ignored. If a human
    cannot do anything about it right now, it should be a ticket/dashboard entry, not a page.
  ref: "concepts.md#alerting-and-routing-to-on-call"
- id: monitoring-and-observability-045
  difficulty: intermediate
  tags: [alerting, routing, correlation]
  question: |
    Why is it valuable for an alert routed to on-call to include the recent deployment marker?
  options:
  - It makes the alert email longer
  - It disables the alert after one deploy
  - It answers "what changed?" in the page itself, speeding correlation of the incident to a deploy
  - It encrypts the alert payload
  answer: 2
  explanation: |
    Carrying deploy context (version/time) in the page lets the responder immediately suspect
    a recent release, cutting time-to-diagnosis and supporting a quick rollback decision.
  ref: "concepts.md#alerting-and-routing-to-on-call"
- id: monitoring-and-observability-046
  difficulty: advanced
  tags: [alerting, burn-rate, boundary]
  question: |
    Where does the detailed multi-window multi-burn-rate alerting math primarily live, per
    this topic's scope?
  options:
  - It is fully derived here in the DevOps topic
  - In the SRE/observability SLO topics — this DevOps topic references it and focuses on deploy context and gating
  - Nowhere; burn-rate alerting is deprecated
  - In the Terraform documentation
  answer: 1
  explanation: |
    Burn-rate windows and the on-call/postmortem process are owned by the SRE and
    observability topics. The DevOps framing is that alerts carry deploy context and can
    gate/rollback releases — with a pointer to the deeper math.
  ref: "concepts.md#alerting-and-routing-to-on-call"
- id: monitoring-and-observability-047
  difficulty: intermediate
  tags: [error-budget, release-gate]
  question: |
    How does an error budget act as a release gate?
  options:
  - When the budget is exhausted, policy can freeze feature releases and redirect effort to reliability
  - It automatically approves all deploys
  - It measures build duration
  - It replaces readiness probes
  answer: 0
  explanation: |
    Error budget = 100% − SLO. A healthy budget means ship fast; an exhausted budget triggers
    a policy to freeze features and focus on reliability. This makes observability a control
    input to delivery, not just a readout.
  ref: "concepts.md#error-budgets-and-dora-as-release-gates"
- id: monitoring-and-observability-048
  difficulty: intermediate
  tags: [slo, sli, definitions]
  question: |
    Which relationship among SLI, SLO, and error budget is correct?
  options:
  - SLO is a measured indicator; SLI is a target; error budget is the SLO itself
  - They are three names for the same number
  - SLI is a measured indicator; SLO is a target for that indicator; error budget = 100% − SLO
  - Error budget = SLO + SLI
  answer: 2
  explanation: |
    An SLI is a measured indicator (e.g. success rate); an SLO is a target for that SLI; the
    error budget is the allowed unreliability, 100% − SLO. Deep math lives in the SRE/
    observability topics.
  ref: "concepts.md#error-budgets-and-dora-as-release-gates"
- id: monitoring-and-observability-049
  difficulty: advanced
  tags: [dora, cfr, scorecard, scenario]
  question: |
    After a process change, a team's Change Failure Rate climbs steadily. What is the most
    reasonable interpretation using DORA as a scorecard?
  options:
  - The team is deploying too infrequently
  - CFR rising is always good
  - Recovery time must have improved
  - Their release gates (tests, canary, smoke checks) may be too weak or their changes too large
  answer: 3
  explanation: |
    Rising CFR is a retrospective signal that quality gates are insufficient or changes are
    too big/risky. It prompts strengthening tests/canary/smoke checks or shrinking change
    size — using DORA as a control loop, not a punishment.
  ref: "concepts.md#error-budgets-and-dora-as-release-gates"
- id: monitoring-and-observability-050
  difficulty: beginner
  tags: [traces, pillars]
  question: |
    In a distributed system, which observability pillar is most essential for finding *where*
    latency or errors originate across services?
  options:
  - Metrics
  - Logs
  - Traces
  - Deployment markers
  answer: 2
  explanation: |
    Traces follow one request's causal path (spans) across services, making them the right
    tool for localizing where latency or errors arise in a distributed call chain. Deep OTel
    trace mechanics live in the observability domain.
  ref: "concepts.md#three-pillars-recap-and-the-devops-boundary"
