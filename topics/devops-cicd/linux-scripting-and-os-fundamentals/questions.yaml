topic_slug: linux-scripting-and-os-fundamentals
version: 1
questions:
  - id: linux-scripting-and-os-fundamentals-001
    difficulty: beginner
    tags: [bash, shebang, portability]
    question: |
      Why do many scripts start with `#!/usr/bin/env bash` instead of `#!/bin/bash`?
    options:
      - "It resolves bash via PATH, so the script works where bash lives in a non-standard location"
      - "It runs the script faster by caching the interpreter and skipping the PATH lookup"
      - "It forces the script to run under /bin/sh in strict POSIX mode for portability"
      - "It is required by the kernel for the script's execute bit to be honored at all"
    answer: 0
    explanation: |
      `#!/usr/bin/env bash` asks `env` to find `bash` on the user's `PATH`, which is more
      portable across systems (e.g. Homebrew bash on macOS, or a newer bash earlier on PATH)
      than hardcoding `/bin/bash`.
    ref: "concepts.md#bash-scripting-fundamentals"

  - id: linux-scripting-and-os-fundamentals-002
    difficulty: beginner
    tags: [bash, variables, syntax]
    question: |
      Which assignment correctly sets a bash variable?
    options:
      - "name = prod"
      - "let name = prod"
      - "name=prod"
      - "$name = prod"
    answer: 2
    explanation: |
      Bash assignment must have NO spaces around `=`: `name=prod`. Adding spaces makes bash
      try to run `name` as a command. You dereference with `$name` or `${name}`.
    ref: "concepts.md#bash-scripting-fundamentals"

  - id: linux-scripting-and-os-fundamentals-003
    difficulty: intermediate
    tags: [bash, quoting, word-splitting]
    question: |
      A script contains `rm $file` where `file="my report.txt"`. What happens?
    options:
      - "It deletes the single file 'my report.txt' correctly because bash preserves the spaces"
      - "Unquoted expansion word-splits into two arguments, so rm tries to delete 'my' and 'report.txt'"
      - "It errors because bash variables are not allowed to hold whitespace characters"
      - "It deletes nothing because rm silently ignores any argument that came from a variable"
    answer: 1
    explanation: |
      Unquoted `$file` is subject to word-splitting on IFS, so the value becomes two
      arguments. `rm` then tries to remove `my` and `report.txt`. Always double-quote:
      `rm "$file"`.
    ref: "concepts.md#bash-scripting-fundamentals"

  - id: linux-scripting-and-os-fundamentals-004
    difficulty: intermediate
    tags: [bash, sh, portability]
    question: |
      A script uses `[[ ... ]]`, arrays, and `set -o pipefail`, but its shebang is
      `#!/bin/sh` and `/bin/sh` is dash. What is the likely result?
    options:
      - "It runs identically since dash aliases itself to bash for these features"
      - "It runs correctly but a bit slower as dash emulates each bash feature"
      - "dash automatically re-execs the script under bash when it sees bashisms"
      - "It fails or misbehaves because those are bash features not in POSIX sh/dash"
    answer: 3
    explanation: |
      `[[ ]]`, arrays, and `set -o pipefail` are bashisms. Under dash (a POSIX sh), they
      are unsupported and the script errors or behaves incorrectly. The shebang must match
      the features used.
    ref: "concepts.md#bash-scripting-fundamentals"

  - id: linux-scripting-and-os-fundamentals-005
    difficulty: beginner
    tags: [bash, quoting]
    question: |
      What is the difference between "$var" and '$var' in bash?
    options:
      - "There is no difference; both forms perform identical variable expansion"
      - "Single quotes expand $var; double quotes keep the literal text $var"
      - "Double quotes expand $var; single quotes treat it as the literal text $var"
      - "Both forms are literal; only backticks trigger any expansion here"
    answer: 2
    explanation: |
      Double quotes allow variable/command expansion while preserving the value as one word.
      Single quotes suppress ALL expansion, so `'$var'` is the literal string `$var`.
    ref: "concepts.md#bash-scripting-fundamentals"

  - id: linux-scripting-and-os-fundamentals-006
    difficulty: intermediate
    tags: [bash, conditionals, test-operators]
    question: |
      Which test checks that a file exists AND is non-empty?
    options:
      - "[[ -e \"$f\" && -d \"$f\" ]]"
      - "[[ -z \"$f\" && -e \"$f\" ]]"
      - "[[ -f \"$f\" && -s \"$f\" ]]"
      - "[[ -x \"$f\" && -r \"$f\" ]]"
    answer: 2
    explanation: |
      `-f` tests a regular file exists, `-s` tests it is non-empty (size > 0). Combined with
      `&&` inside `[[ ]]` it checks both. `-e` only tests existence, `-z` tests empty string,
      `-x` tests executable.
    ref: "concepts.md#variables-conditionals-loops-and-functions"

  - id: linux-scripting-and-os-fundamentals-007
    difficulty: intermediate
    tags: [bash, loops, read]
    question: |
      What is the safest way to read a file line by line in bash?
    options:
      - "while read -r line; do ...; done < file"
      - "for line in $(cat file); do ...; done"
      - "for line in file; do ...; done"
      - "cat file | for line; do ...; done"
    answer: 0
    explanation: |
      `while read -r line; do ...; done < file` reads whole lines safely; `-r` prevents
      backslash mangling. Iterating over `$(cat file)` word-splits on whitespace and glob-
      expands, breaking on spaces and newlines.
    ref: "concepts.md#variables-conditionals-loops-and-functions"

  - id: linux-scripting-and-os-fundamentals-008
    difficulty: intermediate
    tags: [bash, functions, return]
    question: |
      In bash, what does a function's `return` statement actually return?
    options:
      - "Any string or complex data structure the caller can assign directly"
      - "An exit status (0-255); real data is passed out via echo + command substitution"
      - "A floating-point number computed from the function's final expression"
      - "The value of the last variable that was assigned inside the function body"
    answer: 1
    explanation: |
      `return` sets an exit status (0-255), not a value. To "return data" you `echo` it and
      capture with command substitution: `result=$(myfunc)`. `local` scopes variables inside
      a function.
    ref: "concepts.md#variables-conditionals-loops-and-functions"

  - id: linux-scripting-and-os-fundamentals-009
    difficulty: beginner
    tags: [bash, positional-args]
    question: |
      In a bash script, what does "$@" represent?
    options:
      - "All positional arguments, each preserved as a separate word"
      - "The exit code of the last command that ran before the call"
      - "The total number of positional arguments that were passed in"
      - "The name of the script as it was invoked on the command line"
    answer: 0
    explanation: |
      `"$@"` expands to all positional arguments, quoting each as its own word (so args with
      spaces stay intact). `$#` is the count, `$0` is the script name, `$?` is the last exit
      code.
    ref: "concepts.md#variables-conditionals-loops-and-functions"

  - id: linux-scripting-and-os-fundamentals-010
    difficulty: beginner
    tags: [exit-codes, success]
    question: |
      What exit code conventionally indicates that a command succeeded?
    options:
      - "1"
      - "-1"
      - "0"
      - "200"
    answer: 2
    explanation: |
      By convention `0` means success; any non-zero value (1-255) signals some kind of
      failure. This is the basis of `&&`, `||`, and CI step pass/fail.
    ref: "concepts.md#exit-codes-and-"

  - id: linux-scripting-and-os-fundamentals-011
    difficulty: intermediate
    tags: [exit-codes, dollar-question]
    question: |
      After running `grep -q ERROR app.log`, what does `$?` tell you?
    options:
      - "The total number of matching lines grep found in the file"
      - "The name of the file where the first match was located"
      - "The line number where grep found the very first match"
      - "0 if a match was found, non-zero if not (or on error)"
    answer: 3
    explanation: |
      `$?` holds the exit status of the last command. `grep` exits 0 when it finds a match,
      1 when it finds none, and 2 on error. `-q` suppresses output so you rely on the code.
    ref: "concepts.md#exit-codes-and-"

  - id: linux-scripting-and-os-fundamentals-012
    difficulty: advanced
    tags: [exit-codes, signals, oom]
    question: |
      A CI job's container exits with code 137. What is the most likely cause?
    options:
      - "A shell syntax error in the script that aborted parsing before execution"
      - "A command-not-found error because a required binary was missing from PATH"
      - "The script completed and returned a normal success status to the runner"
      - "The process was killed by SIGKILL (128+9), typically the OOM killer or a memory limit"
    answer: 3
    explanation: |
      Exit code `128 + N` means terminated by signal N. `137 = 128 + 9` is SIGKILL, most
      often the OOM killer or a container/CI memory limit terminating the process — not a
      code bug.
    ref: "concepts.md#exit-codes-and-"

  - id: linux-scripting-and-os-fundamentals-013
    difficulty: intermediate
    tags: [exit-codes, command-not-found]
    question: |
      A script logs exit code 127. What does that typically mean?
    options:
      - "Permission denied"
      - "Out of memory"
      - "Command not found"
      - "Successful with warnings"
    answer: 2
    explanation: |
      `127` conventionally means "command not found" (often a typo or a missing binary/PATH
      issue). `126` means the command was found but is not executable.
    ref: "concepts.md#exit-codes-and-"

  - id: linux-scripting-and-os-fundamentals-014
    difficulty: intermediate
    tags: [set-e, pipefail, strict-mode]
    question: |
      What does `set -o pipefail` change about a pipeline like `curl badurl | tee out.txt`?
    options:
      - "The pipeline fails if any command in it fails, instead of reporting only the final command's status"
      - "Nothing changes; a pipeline's status always comes from its first command regardless"
      - "It disables the pipe entirely and runs each command sequentially instead"
      - "It makes tee ignore its stdin so the file out.txt is left empty"
    answer: 0
    explanation: |
      Without pipefail a pipeline's status is that of the LAST command (`tee`, which
      succeeds), masking curl's failure. `pipefail` makes the pipeline fail if any command
      in it fails (the status becomes that of the last command to exit non-zero).
    ref: "concepts.md#set--euo-pipefail-safe-scripting"

  - id: linux-scripting-and-os-fundamentals-015
    difficulty: beginner
    tags: [set-u, strict-mode]
    question: |
      What does `set -u` (nounset) do in a bash script?
    options:
      - "Automatically unsets all shell variables when the script exits"
      - "Disables command substitution so $(...) is left untouched"
      - "Makes the script treat variable names as case-insensitive"
      - "Treats the use of an unset variable as an error, catching typos"
    answer: 3
    explanation: |
      `set -u` causes the script to error when it references a variable that was never set,
      which catches typos and missing-config bugs instead of silently expanding to an empty
      string.
    ref: "concepts.md#set--euo-pipefail-safe-scripting"

  - id: linux-scripting-and-os-fundamentals-016
    difficulty: advanced
    tags: [set-e, gotchas, local]
    question: |
      Why can `local result=$(some_failing_command)` hide a failure even under `set -e`?
    options:
      - "local silently disables set -e for the rest of the script's execution"
      - "The exit status of the `local` builtin (0) masks the command substitution's failure"
      - "set -e never applies to any statement written inside a function body"
      - "Command substitution always returns 0 no matter what the inner command does"
    answer: 1
    explanation: |
      When you combine `local` (or `declare`) with an assignment, the builtin's own success
      (exit 0) becomes the statement's status, hiding the failure of the substituted command.
      Split the declaration from the assignment to preserve the failure.
    ref: "concepts.md#set--euo-pipefail-safe-scripting"

  - id: linux-scripting-and-os-fundamentals-017
    difficulty: advanced
    tags: [set-e, gotchas, conditionals]
    question: |
      Under `set -e`, in which case does a failing command NOT abort the script?
    options:
      - "When it appears in an if/while condition or is followed by || / part of &&"
      - "When it happens to be the very last command in the script file"
      - "When it only writes an error message to stderr but still exits"
      - "set -e always aborts on any non-zero exit, no exceptions"
    answer: 0
    explanation: |
      `set -e` deliberately does not trigger for commands whose status is being tested:
      inside `if`/`while` conditions, on the left of `&&`/`||`, or when followed by `||`.
      This is a common source of "why didn't my script stop?" confusion.
    ref: "concepts.md#set--euo-pipefail-safe-scripting"

  - id: linux-scripting-and-os-fundamentals-018
    difficulty: intermediate
    tags: [redirection, stderr, stdout]
    question: |
      What does `command > out.txt 2>&1` do?
    options:
      - "Sends stdout to out.txt and discards stderr"
      - "Sends stderr to out.txt and stdout to the terminal"
      - "Sends both stdout and stderr to out.txt"
      - "Reads out.txt as input for the command"
    answer: 2
    explanation: |
      `> out.txt` redirects stdout to the file, then `2>&1` points stderr at "wherever
      stdout now goes" — the file. So both streams land in out.txt. `&> out.txt` is a bash
      shorthand for the same.
    ref: "concepts.md#pipes-redirection-and-command-substitution"

  - id: linux-scripting-and-os-fundamentals-019
    difficulty: advanced
    tags: [redirection, order, gotcha]
    question: |
      How does `command 2>&1 > out.txt` differ from `command > out.txt 2>&1`?
    options:
      - "They are identical because bash normalizes redirection order before running"
      - "The first sends stderr to the terminal (stdout's original target) and only stdout to the file"
      - "The first discards all output since pointing stderr at stdout cancels both streams"
      - "The first sends both to the terminal because out.txt is never actually opened"
    answer: 1
    explanation: |
      Redirections apply left to right. In `2>&1 > out.txt`, stderr is first pointed at
      stdout's CURRENT target (the terminal), then stdout is redirected to the file — so
      stderr still goes to the terminal. Order matters.
    ref: "concepts.md#pipes-redirection-and-command-substitution"

  - id: linux-scripting-and-os-fundamentals-020
    difficulty: intermediate
    tags: [pipes, stderr]
    question: |
      In `program | grep pattern`, which stream of `program` does the pipe carry to grep?
    options:
      - "Both stdout and stderr, because a pipe merges the two streams automatically"
      - "stderr only, leaving stdout to print directly on the terminal"
      - "Neither; a pipe only forwards the left command's numeric exit code"
      - "stdout only; stderr goes to the terminal unless redirected"
    answer: 3
    explanation: |
      A pipe connects the left command's stdout to the right command's stdin. stderr is not
      piped; it bypasses the pipe to the terminal unless you first merge it with `2>&1`.
    ref: "concepts.md#pipes-redirection-and-command-substitution"

  - id: linux-scripting-and-os-fundamentals-021
    difficulty: beginner
    tags: [command-substitution]
    question: |
      Which is the preferred, nestable syntax for command substitution in modern bash?
    options:
      - "`command`"
      - "${command}"
      - "$(command)"
      - "$[command]"
    answer: 2
    explanation: |
      `$(command)` is preferred: it nests cleanly and is more readable than backticks.
      `${var}` is variable expansion, not command substitution.
    ref: "concepts.md#pipes-redirection-and-command-substitution"

  - id: linux-scripting-and-os-fundamentals-022
    difficulty: intermediate
    tags: [grep, cli, options]
    question: |
      Which grep flag combination makes it recursive and prints line numbers when searching a source tree?
    options:
      - "grep -v -c"
      - "grep -qo"
      - "grep -rn"
      - "grep -iz"
    answer: 2
    explanation: |
      `-r` searches recursively through directories; `-n` prints line numbers. `-v` inverts,
      `-c` counts, `-q` is quiet (exit-code only), `-o` prints only the match, `-i` ignores
      case.
    ref: "concepts.md#essential-text--search-cli-grep-find-xargs-cut-sort-uniq"

  - id: linux-scripting-and-os-fundamentals-023
    difficulty: advanced
    tags: [find, xargs, filenames, safety]
    question: |
      Why use `find . -name '*.tmp' -print0 | xargs -0 rm` instead of `find ... | xargs rm`?
    options:
      - "It is faster because NUL-delimited input lets xargs skip its argument-parsing step"
      - "It sorts the matched files alphabetically before handing them to rm"
      - "`-print0`/`-0` use NUL separators so filenames with spaces or newlines are handled safely"
      - "It avoids recursing into subdirectories, limiting rm to the current directory"
    answer: 2
    explanation: |
      By default xargs splits on whitespace, breaking filenames containing spaces or
      newlines. `find -print0` and `xargs -0` delimit with the NUL byte (which cannot appear
      in a filename), making the pipeline robust.
    ref: "concepts.md#essential-text--search-cli-grep-find-xargs-cut-sort-uniq"

  - id: linux-scripting-and-os-fundamentals-024
    difficulty: intermediate
    tags: [sort, uniq, pipeline]
    question: |
      Why must you `sort` before `uniq` in `sort file | uniq -c`?
    options:
      - "uniq requires numeric input, so sort must first convert each line to a number"
      - "uniq only removes ADJACENT duplicate lines, so identical lines must be grouped first"
      - "sort is what actually counts the lines, and uniq -c only formats those totals"
      - "There is no reason; uniq scans the whole file and finds duplicates in any order"
    answer: 1
    explanation: |
      `uniq` collapses only consecutive identical lines. Sorting first groups all duplicates
      together so `uniq -c` can count them. This is the basis of the classic "top N" one-liner.
    ref: "concepts.md#essential-text--search-cli-grep-find-xargs-cut-sort-uniq"

  - id: linux-scripting-and-os-fundamentals-025
    difficulty: intermediate
    tags: [tail, logs, follow]
    question: |
      Which command continuously streams new lines appended to a growing log file?
    options:
      - "tail -f app.log"
      - "head -f app.log"
      - "cat -f app.log"
      - "grep -f app.log"
    answer: 0
    explanation: |
      `tail -f` follows a file, printing new lines as they are written — the standard "watch
      the log" move. `tail -F` additionally re-opens the file if it is rotated. `less +F`
      also follows.
    ref: "concepts.md#essential-text--search-cli-grep-find-xargs-cut-sort-uniq"

  - id: linux-scripting-and-os-fundamentals-026
    difficulty: advanced
    tags: [awk, cli, one-liner, scenario]
    question: |
      You want the top 10 client IPs (first field) from an access log. Which pipeline works?
    options:
      - "grep -c . access.log | sort -rn | uniq | head"
      - "cut -f1 access.log | uniq | sort | head"
      - "awk '{print $1}' access.log | sort | uniq -c | sort -rn | head"
      - "sed 's/ /\\n/g' access.log | sort | uniq -c | head"
    answer: 2
    explanation: |
      `awk '{print $1}'` extracts the IP column, `sort` groups them, `uniq -c` counts each,
      `sort -rn` orders by count descending, and `head` shows the top 10. `uniq` without a
      prior `sort` would miss non-adjacent duplicates.
    ref: "concepts.md#sed-and-awk"

  - id: linux-scripting-and-os-fundamentals-027
    difficulty: intermediate
    tags: [sed, in-place, substitution]
    question: |
      What does `sed -i.bak 's/8080/9090/g' config.ini` do?
    options:
      - "Prints lines 8080 through 9090 of config.ini to the terminal without editing it"
      - "Replaces all occurrences of 8080 with 9090 in the file in place, saving the original as config.ini.bak"
      - "Deletes every line containing 8080 and writes the remainder to config.ini.bak"
      - "Replaces only the first 8080 on each line and prints the result without editing the file"
    answer: 1
    explanation: |
      `s/8080/9090/g` substitutes all (`g`) occurrences per line; `-i` edits the file in
      place, and the `.bak` suffix keeps a backup copy. Without `g` only the first match per
      line changes.
    ref: "concepts.md#sed-and-awk"

  - id: linux-scripting-and-os-fundamentals-028
    difficulty: intermediate
    tags: [awk, fields, separator]
    question: |
      In awk, what does `$NF` refer to?
    options:
      - "The total number of fields on the current line"
      - "The value of the very first field on the current line"
      - "The current input record (line) number being processed"
      - "The value of the last field on the current line"
    answer: 3
    explanation: |
      `NF` is the field count; `$NF` is the value of the last field. `$1` is the first
      field, `$0` is the whole line, and `NR` is the current record (line) number.
    ref: "concepts.md#sed-and-awk"

  - id: linux-scripting-and-os-fundamentals-029
    difficulty: intermediate
    tags: [awk, field-separator, scenario]
    question: |
      Which command prints just the usernames (first colon-separated field) from /etc/passwd?
    options:
      - "awk '{print $1}' /etc/passwd"
      - "grep -f1 /etc/passwd"
      - "awk -F: '{print $1}' /etc/passwd"
      - "sed '1p' /etc/passwd"
    answer: 2
    explanation: |
      `/etc/passwd` is colon-delimited, so you must set the field separator with `-F:`.
      Without it, awk splits on whitespace and the whole line is one field. `cut -d: -f1`
      also works.
    ref: "concepts.md#sed-and-awk"

  - id: linux-scripting-and-os-fundamentals-030
    difficulty: beginner
    tags: [tools, grep-sed-awk]
    question: |
      Which tool is the best fit for editing/substituting text in a stream line by line?
    options:
      - "sed"
      - "grep"
      - "wc"
      - "sort"
    answer: 0
    explanation: |
      Rule of thumb: grep FINDS matching lines, sed EDITS/substitutes lines in a stream, and
      awk works with COLUMNS and aggregates. Substitution is sed's core job.
    ref: "concepts.md#sed-and-awk"

  - id: linux-scripting-and-os-fundamentals-031
    difficulty: beginner
    tags: [processes, ps, monitoring]
    question: |
      Which command gives a live, continuously updating view of processes and CPU/memory usage?
    options:
      - "ps aux"
      - "ls -l"
      - "df -h"
      - "top"
    answer: 3
    explanation: |
      `top` (and the friendlier `htop`) is interactive and refreshes live. `ps aux` is a
      one-time snapshot. In top, `P` sorts by CPU and `M` by memory.
    ref: "concepts.md#processes-and-signals"

  - id: linux-scripting-and-os-fundamentals-032
    difficulty: advanced
    tags: [signals, sigterm, sigkill]
    question: |
      What is the key difference between SIGTERM (15) and SIGKILL (9)?
    options:
      - "SIGTERM is faster than SIGKILL because signal 15 is delivered ahead of signal 9"
      - "SIGTERM is catchable and lets the app clean up; SIGKILL cannot be caught or handled and kills immediately"
      - "SIGKILL politely asks the process to exit, while SIGTERM forcibly terminates it with no cleanup"
      - "They are aliases for the same behavior; the kernel treats signals 9 and 15 identically"
    answer: 1
    explanation: |
      SIGTERM is a polite, catchable request — the app can trap it to drain and clean up.
      SIGKILL cannot be caught, blocked, or handled; the kernel removes the process with no
      cleanup. Orchestrators send SIGTERM first, SIGKILL only if it hangs.
    ref: "concepts.md#processes-and-signals"

  - id: linux-scripting-and-os-fundamentals-033
    difficulty: advanced
    tags: [signals, graceful-shutdown, scenario]
    question: |
      A container's app is killed abruptly on deploy, dropping in-flight requests. It never
      drains connections. What is the most likely fix?
    options:
      - "Trap SIGTERM in the app to finish in-flight work before exiting"
      - "Send SIGKILL sooner so the process exits before draining connections"
      - "Run the app as root so it has permission to finish in-flight requests"
      - "Disable the health check so the orchestrator never triggers a redeploy"
    answer: 0
    explanation: |
      Orchestrators send SIGTERM first to allow graceful shutdown, then SIGKILL after a
      grace period. If the app doesn't trap SIGTERM to drain connections, it dies mid-request.
      The fix is a SIGTERM handler that stops accepting new work and finishes current work.
    ref: "concepts.md#processes-and-signals"

  - id: linux-scripting-and-os-fundamentals-034
    difficulty: intermediate
    tags: [nice, priority, processes]
    question: |
      What does `nice -n 10 heavy_job` do?
    options:
      - "Runs heavy_job with higher CPU priority because a positive nice value boosts it"
      - "Limits heavy_job to 10 seconds of CPU time before the scheduler stops it"
      - "Runs heavy_job with lower scheduling priority (higher niceness = nicer = lower priority)"
      - "Runs heavy_job as a detached background daemon fixed at nice level 10"
    answer: 2
    explanation: |
      Niceness ranges from -20 (highest priority) to +19 (lowest). A higher nice value means
      the process is "nicer" and yields CPU, so `-n 10` lowers its priority. `renice` adjusts
      a running process.
    ref: "concepts.md#processes-and-signals"

  - id: linux-scripting-and-os-fundamentals-035
    difficulty: beginner
    tags: [permissions, chmod, octal]
    question: |
      What permissions does `chmod 755 script.sh` grant?
    options:
      - "rwxrwxrwx — full read/write/execute for owner, group, and other alike"
      - "rw-r--r-- — owner read/write, others read"
      - "r-------- — only the owner can read, with no group or other access"
      - "rwxr-xr-x — owner read/write/execute, group and other read/execute"
    answer: 3
    explanation: |
      Each octal digit sums r(4)+w(2)+x(1). 7=rwx (owner), 5=r-x (group), 5=r-x (other), so
      `755` = rwxr-xr-x. It is the typical mode for an executable script.
    ref: "concepts.md#file-permissions-and-ownership"

  - id: linux-scripting-and-os-fundamentals-036
    difficulty: advanced
    tags: [permissions, directories, execute]
    question: |
      On a directory, what does the execute (x) permission control?
    options:
      - "Whether you can execute the files stored inside the directory as if they were programs"
      - "Whether the directory automatically runs a startup script whenever it is opened"
      - "Nothing at all; the execute bit is simply ignored when set on a directory"
      - "Whether you can enter/traverse the directory and access files by path (cd into it, reach entries)"
    answer: 3
    explanation: |
      On a directory, `x` grants traversal — the ability to `cd` into it and access entries
      by path. Without `x` you may see names (with `r`) but cannot use the files. `r` alone
      lists names; `w` allows creating/deleting entries.
    ref: "concepts.md#file-permissions-and-ownership"

  - id: linux-scripting-and-os-fundamentals-037
    difficulty: advanced
    tags: [permissions, sticky-bit, setuid]
    question: |
      Why is /tmp typically set to mode 1777 (sticky bit set)?
    options:
      - "So that only the root user can write to it, blocking all normal user writes"
      - "So that files placed in it are automatically deleted a few minutes after use"
      - "So it is world-writable but only a file's owner (or root) can delete that file"
      - "To automatically set the execute bit on every file created inside the directory"
    answer: 2
    explanation: |
      The sticky bit (leading 1) on a world-writable directory restricts deletion: even
      though anyone can create files, only the file's owner (or root) can remove it,
      preventing users from deleting each other's files in /tmp.
    ref: "concepts.md#file-permissions-and-ownership"

  - id: linux-scripting-and-os-fundamentals-038
    difficulty: intermediate
    tags: [permissions, chown]
    question: |
      What does `chown deploy:web app.log` do?
    options:
      - "Changes the file's owner to 'deploy' and its group to 'web'"
      - "Sets the read and write permission bits for the deploy user on the file"
      - "Removes app.log whenever its current owner happens to be the deploy user"
      - "Changes the file's group to web but deliberately leaves its owner unchanged"
    answer: 0
    explanation: |
      `chown user:group file` sets both owner and group. `chown` handles ownership; `chmod`
      handles the permission bits. Ownership determines which triad (user/group/other) applies
      to a given accessor.
    ref: "concepts.md#file-permissions-and-ownership"

  - id: linux-scripting-and-os-fundamentals-039
    difficulty: beginner
    tags: [systemd, systemctl, services]
    question: |
      Which command restarts a systemd-managed service named nginx?
    options:
      - "service nginx bounce"
      - "systemd nginx --restart"
      - "journalctl restart nginx"
      - "systemctl restart nginx"
    answer: 3
    explanation: |
      `systemctl restart nginx` stops and starts the unit. `systemctl` is the control tool
      for systemd units; `journalctl` reads their logs.
    ref: "concepts.md#systemd-and-services-systemctl-journalctl"

  - id: linux-scripting-and-os-fundamentals-040
    difficulty: intermediate
    tags: [systemd, enable, start, gotcha]
    question: |
      You ran `systemctl enable myapp` but after a reboot test the service was running, yet
      right now it is not running. Why?
    options:
      - "`enable` is deprecated and unreliable, so you must use `start` for boot persistence instead"
      - "`enable` only configures the service to start on boot; it does not start it now — use `enable --now` or also run `start`"
      - "The service started but immediately crashed, and systemd gave up after one failed retry"
      - "`enable` silently failed because it requires root privileges that your session did not have"
    answer: 1
    explanation: |
      `enable` creates the boot-time symlink (persistent) but does not start the service in
      the current session. `start` runs it now (this boot only). You usually want both:
      `systemctl enable --now myapp`.
    ref: "concepts.md#systemd-and-services-systemctl-journalctl"

  - id: linux-scripting-and-os-fundamentals-041
    difficulty: intermediate
    tags: [systemd, daemon-reload, unit-files]
    question: |
      You edited /etc/systemd/system/myapp.service but `systemctl restart myapp` still uses
      the old config. What did you forget?
    options:
      - "To run `systemctl daemon-reload` so systemd re-reads the changed unit files"
      - "To reboot the machine, since systemd only parses unit files during early boot"
      - "To purge the journal with `journalctl --vacuum`, which also clears the cached unit"
      - "To run `chmod +x` on the unit file so systemd is permitted to load the new version"
    answer: 0
    explanation: |
      systemd caches unit definitions. After editing a `.service` file you must
      `systemctl daemon-reload` for the change to take effect, then restart the service.
    ref: "concepts.md#systemd-and-services-systemctl-journalctl"

  - id: linux-scripting-and-os-fundamentals-042
    difficulty: intermediate
    tags: [journalctl, logs, systemd]
    question: |
      Which command follows the live logs for the systemd unit 'api' like tail -f?
    options:
      - "tail -f api"
      - "systemctl logs api"
      - "journalctl -u api -f"
      - "dmesg -u api"
    answer: 2
    explanation: |
      `journalctl -u api -f` shows logs scoped to the `api` unit and follows new entries
      live. `--since`, `-n`, and `-p` further filter by time, count, and priority.
    ref: "concepts.md#systemd-and-services-systemctl-journalctl"

  - id: linux-scripting-and-os-fundamentals-043
    difficulty: intermediate
    tags: [systemd, restart-policy, unit-files]
    question: |
      In a systemd unit, what does `Restart=on-failure` provide?
    options:
      - "It reboots the entire machine whenever the service exits with a non-zero status"
      - "systemd automatically restarts the service if it exits with a non-zero status or is killed by a signal"
      - "It disables all automatic restarts, so the unit stays dead until you restart it by hand"
      - "It restarts the service on a fixed nightly schedule regardless of whether it failed"
    answer: 1
    explanation: |
      `Restart=on-failure` gives you supervision for free: systemd relaunches the process
      when it fails (non-zero exit or killed by an uncaught signal). `RestartSec` sets the
      delay between attempts.
    ref: "concepts.md#systemd-and-services-systemctl-journalctl"

  - id: linux-scripting-and-os-fundamentals-044
    difficulty: beginner
    tags: [package-managers, apt, dnf]
    question: |
      Which pairing correctly matches a distro family to its package manager?
    options:
      - "Ubuntu ships with dnf as its default manager, while RHEL relies on apt for .deb packages"
      - "Every mainstream Linux distribution standardizes on apt, regardless of its package format"
      - "Alpine uses yum with .rpm packages, matching the Red Hat family's tooling exactly"
      - "Debian/Ubuntu use apt (.deb); RHEL/Fedora/Amazon Linux use dnf/yum (.rpm)"
    answer: 3
    explanation: |
      Debian/Ubuntu use `apt`/`dpkg` with `.deb` packages; the Red Hat family (RHEL, Fedora,
      Amazon Linux) uses `dnf` (modern) or `yum` (legacy) with `.rpm`. Alpine uses `apk`.
    ref: "concepts.md#package-managers-apt-yum-dnf"

  - id: linux-scripting-and-os-fundamentals-045
    difficulty: intermediate
    tags: [package-managers, apt-update, gotcha]
    question: |
      Why should a provisioning script run `apt-get update` before `apt-get install`?
    options:
      - "Because `update` upgrades every already-installed package to its newest version first"
      - "Because `apt-get install` always fails unless the machine is rebooted immediately before it"
      - "To refresh the local package index so install pulls current versions and can find newly added packages"
      - "Because `update` silently downloads and applies all pending security patches on its own"
    answer: 2
    explanation: |
      `apt-get update` refreshes the package index (metadata). Without it, `install` may fail
      to find a package or pull a stale version. In Dockerfiles you also combine update+install
      +cleanup in one RUN layer to keep images small.
    ref: "concepts.md#package-managers-apt-yum-dnf"

  - id: linux-scripting-and-os-fundamentals-046
    difficulty: beginner
    tags: [cron, schedule, syntax]
    question: |
      In a crontab line, what schedule does `0 2 * * *` represent?
    options:
      - "Daily at 02:00"
      - "Every 2 minutes, around the clock, on every day of the week"
      - "At 2 seconds past the start of every single minute of the day"
      - "Once a month, at midnight on the 2nd day of each month"
    answer: 0
    explanation: |
      Cron fields are minute hour day-of-month month day-of-week. `0 2 * * *` = minute 0 of
      hour 2, every day — i.e. 02:00 daily. `*/15 * * * *` would be every 15 minutes.
    ref: "concepts.md#cron-and-scheduled-jobs"

  - id: linux-scripting-and-os-fundamentals-047
    difficulty: advanced
    tags: [cron, environment, path, scenario]
    question: |
      A backup script runs fine from your shell but fails silently when scheduled in cron.
      What is the most likely cause?
    options:
      - "Cron is unable to execute shell scripts and can only launch compiled binaries"
      - "Cron jobs always run strictly as the root user, so a non-root script is rejected"
      - "The backup script must be compiled to a binary before cron is willing to run it"
      - "Cron runs with a minimal environment (short PATH, profile not sourced), so relative binaries/paths and unset vars break it"
    answer: 3
    explanation: |
      Cron does not source your login profile and provides a minimal PATH and environment.
      Scripts relying on interactive-shell PATH or env vars fail. Fix: use absolute paths,
      set needed env vars explicitly, and redirect output to a log to see errors.
    ref: "concepts.md#cron-and-scheduled-jobs"

  - id: linux-scripting-and-os-fundamentals-048
    difficulty: intermediate
    tags: [cron, systemd-timers]
    question: |
      What advantage do systemd timers offer over classic cron jobs?
    options:
      - "They execute the job directly without ever needing an associated .service unit"
      - "Built-in journald logging, dependency ordering, and Persistent= to catch up missed runs"
      - "They deliberately cannot be scheduled by calendar time, only by system boot events"
      - "They need no configuration files whatsoever and schedule themselves automatically"
    answer: 1
    explanation: |
      systemd timers (a `.timer` + `.service` pair) integrate with journald for logging,
      support dependency ordering, and `Persistent=true` runs a missed job after downtime.
      Cron is simpler and ubiquitous but lacks native logging.
    ref: "concepts.md#cron-and-scheduled-jobs"

  - id: linux-scripting-and-os-fundamentals-049
    difficulty: intermediate
    tags: [ssh, keys, asymmetric]
    question: |
      In SSH key-based authentication, which key goes into the server's ~/.ssh/authorized_keys?
    options:
      - "The private key"
      - "Both keys"
      - "The public key"
      - "A copy of the password"
    answer: 2
    explanation: |
      The PUBLIC key is placed in the server's `authorized_keys`; the PRIVATE key stays on
      the client and never leaves it. The server challenges the client to prove it holds the
      matching private key without transmitting it.
    ref: "concepts.md#ssh-and-keys"

  - id: linux-scripting-and-os-fundamentals-050
    difficulty: advanced
    tags: [ssh, permissions, troubleshooting, scenario]
    question: |
      You copied your private key to a new machine but SSH still prompts for a password and
      ignores the key. What is the most common cause?
    options:
      - "The key was generated too recently and needs time to propagate to the server first"
      - "You must regenerate the key as RSA, because sshd silently rejects all ed25519 keys"
      - "Permissions are too open — SSH refuses keys/dirs that are group- or world-readable (need ~/.ssh 700, private key 600)"
      - "The remote server is completely down, so it falls back to prompting for a password"
    answer: 2
    explanation: |
      SSH enforces strict permissions: it will not use a private key or `~/.ssh` that others
      can read. Set `~/.ssh` to 700 and the private key to 600. This is a very common
      "why won't my key work" issue.
    ref: "concepts.md#ssh-and-keys"

  - id: linux-scripting-and-os-fundamentals-051
    difficulty: beginner
    tags: [env-vars, export]
    question: |
      What is the difference between `VAR=x` and `export VAR=x` in a shell?
    options:
      - "There is no functional difference; both forms behave identically in every context"
      - "Without export, VAR is only a shell variable not inherited by child processes; export puts it in the environment for children"
      - "`export` additionally marks the variable read-only so it can never be reassigned later"
      - "`VAR=x` is only valid inside scripts and is rejected when typed at an interactive prompt"
    answer: 1
    explanation: |
      A plain assignment creates a shell variable visible only to the current shell.
      `export` promotes it into the environment so child processes inherit it — essential for
      passing config (12-Factor style) to programs you launch.
    ref: "concepts.md#environment-variables-and-path"

  - id: linux-scripting-and-os-fundamentals-052
    difficulty: intermediate
    tags: [path, environment]
    question: |
      What is the PATH environment variable, and how does the shell use it?
    options:
      - "A registry of every package currently installed on the system, kept in sync by the package manager"
      - "A pointer holding only the current working directory, updated each time you cd elsewhere"
      - "The complete list of environment variable names that have been exported in the shell"
      - "A colon-separated list of directories the shell searches left-to-right to locate commands"
    answer: 3
    explanation: |
      `PATH` is a colon-separated directory list searched in order for an executable matching
      a typed command name. `which`/`command -v` shows which match wins; prepending a dir makes
      it take precedence over system binaries.
    ref: "concepts.md#environment-variables-and-path"

  - id: linux-scripting-and-os-fundamentals-053
    difficulty: advanced
    tags: [path, security]
    question: |
      Why is it dangerous to put `.` (the current directory) in your PATH, especially before
      system directories?
    options:
      - "It measurably slows down command lookup by adding one more directory to scan each time"
      - "It breaks shell tab completion for command names in every directory you visit"
      - "A malicious executable dropped in a directory you cd into could run instead of the real system command"
      - "It consumes excessive memory because the shell must cache the directory's full contents"
    answer: 2
    explanation: |
      With `.` early in PATH, cd-ing into an attacker-controlled directory containing a fake
      `ls` (or similar) would run that instead of the real binary — a classic privilege-
      escalation/trojan vector. Keep `.` out of PATH.
    ref: "concepts.md#environment-variables-and-path"

  - id: linux-scripting-and-os-fundamentals-054
    difficulty: advanced
    tags: [disk, df, du, inodes, scenario]
    question: |
      `df -h` shows plenty of free space, but writes fail with "No space left on device".
      What should you check?
    options:
      - "Inode exhaustion with `df -i` — the filesystem can run out of inodes (many tiny files) while bytes remain free"
      - "Available RAM with `free -h`, since low free memory is what actually triggers ENOSPC on writes"
      - "The system CPU load with `top`, because a saturated CPU stalls the writeback and blocks writes"
      - "Open listening ports with `ss`, in case a leaked socket is silently consuming the disk quota"
    answer: 0
    explanation: |
      A filesystem has a finite number of inodes. Millions of tiny files can exhaust inodes
      while `df -h` still shows free bytes, causing ENOSPC. `df -i` reveals inode usage.
    ref: "concepts.md#disk-memory-and-network-diagnostics"

  - id: linux-scripting-and-os-fundamentals-055
    difficulty: intermediate
    tags: [memory, free, buff-cache]
    question: |
      When reading `free -h`, which column best reflects memory actually available for new
      applications?
    options:
      - "free"
      - "shared"
      - "total"
      - "available"
    answer: 3
    explanation: |
      Linux uses spare RAM for reclaimable buff/cache, so a low `free` value is normal. The
      `available` column estimates what can be given to new apps (free + reclaimable cache),
      making it the number to watch.
    ref: "concepts.md#disk-memory-and-network-diagnostics"

  - id: linux-scripting-and-os-fundamentals-056
    difficulty: intermediate
    tags: [network, ss, ports, scenario]
    question: |
      Which command shows which process is listening on TCP port 8080?
    options:
      - "df -h | grep 8080   (or du -x :8080 to see the port's usage)"
      - "ss -ltnp | grep 8080   (or lsof -i :8080)"
      - "ps aux | grep 8080   (or pgrep --port 8080 for the listener)"
      - "top -p 8080   (or htop --port 8080 for the socket owner)"
    answer: 1
    explanation: |
      `ss -ltnp` lists listening (`-l`) TCP (`-t`) sockets numerically (`-n`) with the owning
      process (`-p`); `ss` replaces the older `netstat`. `lsof -i :8080` also identifies the
      process holding the port.
    ref: "concepts.md#disk-memory-and-network-diagnostics"

  - id: linux-scripting-and-os-fundamentals-057
    difficulty: advanced
    tags: [disk, du, lsof, deleted-files, scenario]
    question: |
      `du -sh /var/log` reports far less than the space `df` says is used on that filesystem.
      What is a likely explanation?
    options:
      - "A deleted file is still held open by a running process, so its space is not reclaimed until the fd closes (find it with lsof | grep deleted)"
      - "du is always inaccurate because it rounds every file up to the nearest 4KB block and then double-counts hard links"
      - "The filesystem is corrupt and its superblock byte counter has drifted, so a full fsck is needed to reconcile df with du"
      - "df counts RAM and swap toward the used total, so cached pages inflate the figure well above the on-disk file sizes"
    answer: 0
    explanation: |
      When a process holds a file open and the file is unlinked, the disk space is not freed
      until the process closes the descriptor (or restarts). `du` (which walks the directory
      tree) misses it, but `df` still counts it. `lsof | grep deleted` finds the culprit.
    ref: "concepts.md#disk-memory-and-network-diagnostics"

  - id: linux-scripting-and-os-fundamentals-058
    difficulty: beginner
    tags: [logs, locations]
    question: |
      On a systemd-based server, where do you read the logs for a specific service unit?
    options:
      - "Always in a fixed /var/log/service.txt file that systemd creates per unit at first start"
      - "In /etc/systemd/, where each unit appends its runtime stdout beside its own .service definition"
      - "Via journalctl -u <unit> (the systemd journal)"
      - "In the process's memory only, dumped to disk exclusively when the service crashes with a core file"
    answer: 2
    explanation: |
      systemd captures each unit's stdout/stderr into the binary journal, queried with
      `journalctl -u <unit>`. Traditional files like `/var/log/syslog` (Debian) or
      `/var/log/messages` (RHEL) hold general system messages; apps may also log to
      `/var/log/<app>/`.
    ref: "concepts.md#log-locations-and-inspection"

  - id: linux-scripting-and-os-fundamentals-059
    difficulty: advanced
    tags: [logs, oom, dmesg, scenario]
    question: |
      A service keeps dying and you suspect the OOM killer. Where do you look for confirmation?
    options:
      - "/etc/passwd, where the kernel appends an 'Out of memory' line next to the killed process's owning user account"
      - "The kernel ring buffer via `dmesg` or `journalctl -k` for an 'Out of memory: Killed process' message"
      - "The crontab, since the OOM killer records each reaped PID as a commented-out job entry for later review"
      - "~/.ssh/known_hosts, which the kernel repurposes to log the memory-pressure event and the terminated PID"
    answer: 1
    explanation: |
      The OOM killer logs to the kernel ring buffer, visible with `dmesg` or `journalctl -k`.
      An "Out of memory: Killed process" entry correlates with a 137 (SIGKILL) exit code and
      confirms memory pressure.
    ref: "concepts.md#log-locations-and-inspection"

  - id: linux-scripting-and-os-fundamentals-060
    difficulty: intermediate
    tags: [logs, logrotate, disk, scenario]
    question: |
      The root filesystem filled up because /var/log grew unbounded. Which tool is designed
      to prevent this?
    options:
      - "logrotate — it rotates, compresses, and prunes logs on size/time triggers"
      - "chmod — tightening the log directory to mode 000 stops daemons from writing further and caps its growth"
      - "journalctl -f — following the journal live streams old entries out of /var/log and frees the space as it prints"
      - "cron only — a bare crontab entry auto-truncates any file in /var/log once it crosses a size threshold"
    answer: 0
    explanation: |
      `logrotate` (config in /etc/logrotate.d/) rotates, compresses, and deletes old logs on
      size or time triggers, preventing a full disk. Diagnose the immediate incident with
      `df -h` then `du -sh /var/log/*`.
    ref: "concepts.md#log-locations-and-inspection"

  - id: linux-scripting-and-os-fundamentals-061
    difficulty: intermediate
    tags: [bash, heredoc, redirection]
    question: |
      In a here-doc, why write `cat <<'EOF'` (quoted delimiter) instead of `cat <<EOF`?
    options:
      - "It makes the here-doc run faster because bash reads a quoted body in one buffered pass instead of line by line"
      - "It is required for the here-doc to work at all, since an unquoted EOF delimiter is a syntax error in modern bash"
      - "Quoting the delimiter suppresses variable and command expansion inside the body, keeping it literal"
      - "It converts the text to uppercase before feeding it to the command, mirroring the ${var^^} expansion operator"
    answer: 2
    explanation: |
      An unquoted here-doc delimiter allows `$var` and `$(...)` expansion in the body.
      Quoting the delimiter (`<<'EOF'`) makes the body literal — useful for config files or
      scripts you don't want the current shell to interpolate.
    ref: "concepts.md#pipes-redirection-and-command-substitution"

  - id: linux-scripting-and-os-fundamentals-062
    difficulty: intermediate
    tags: [sudo, permissions, security]
    question: |
      What is the recommended way to run a single command as root, and why?
    options:
      - "Use `sudo` — it runs the one command with elevated privileges per /etc/sudoers and leaves an audit trail"
      - "Log in directly as root for everything, since a single persistent root session is simpler to audit than per-command elevation"
      - "chmod 777 the command so any user can run it, which grants it root authority automatically at execution time"
      - "Set the setuid bit on your interactive shell so every command you type afterward inherits root privileges seamlessly"
    answer: 0
    explanation: |
      `sudo` grants scoped, per-command elevation governed by `/etc/sudoers` and logs who ran
      what, which is far safer and more auditable than logging in as root or opening up
      permissions.
    ref: "concepts.md#file-permissions-and-ownership"
