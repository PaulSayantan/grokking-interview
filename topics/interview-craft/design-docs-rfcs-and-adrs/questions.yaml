topic: "Design Docs, RFCs & Architecture Decision Records"
domain: interview-craft
topic_slug: design-docs-rfcs-and-adrs
version: 1
questions:
  - id: design-docs-rfcs-and-adrs-001
    difficulty: beginner
    tags: [engineering-writing, leverage, senior-signal]
    question: |
      Why is engineering writing considered a core senior/staff-level skill rather than
      optional overhead?
    options:
      - "Because managers require a fixed number of docs per quarter"
      - "Because documentation is only needed for compliance audits"
      - "Because writing is faster than talking to teammates"
      - "Because a written artifact scales your influence to everyone who reads it — now and in the future — without you being in the room"
    answer: 3
    explanation: |
      Writing is a force multiplier: a doc read by 20 people (including future-you and new
      hires) delivers far more leverage than a conversation heard by 2. That's why
      published ladders and Staff Engineer literature list writing as an explicit staff
      competency — influence at that level flows through artifacts.
    ref: "concepts.md#engineering-writing-as-a-seniorstaff-skill"

  - id: design-docs-rfcs-and-adrs-002
    difficulty: intermediate
    tags: [engineering-writing, framing, scope-signal]
    question: |
      A candidate is asked "tell me about a design you led." Which answer signals the
      highest scope?
    options:
      - "I built the whole thing myself and it just worked, no docs needed."
      - "I wrote the design doc after we shipped so we'd have documentation."
      - "I wrote an RFC first to align three teams; the review surfaced a data-migration risk we'd missed, which changed the rollout and avoided a backfill outage."
      - "I picked the design I liked and started coding immediately to save time."
    answer: 2
    explanation: |
      The strong answer uses writing *upstream* of code to align multiple teams and to
      find risks before building — org-level scope and writing-as-a-thinking-tool. "I
      built it myself" signals IC scope; "documented after shipping" treats writing as
      compliance; "started coding immediately" skips alignment entirely.
    ref: "concepts.md#engineering-writing-as-a-seniorstaff-skill"

  - id: design-docs-rfcs-and-adrs-003
    difficulty: beginner
    tags: [artifacts, adr, definition]
    question: |
      What does ADR stand for, and what is its defining scope?
    options:
      - "Automated Deployment Report — a log of each production deploy"
      - "Architecture Decision Record — a lightweight record of one architecturally-significant decision, its context, and consequences"
      - "Application Design Requirement — the full requirements spec for an app"
      - "Advanced Design Review — a mandatory sign-off meeting before shipping"
    answer: 1
    explanation: |
      An ADR (Architecture Decision Record) captures a *single* architecturally-significant
      decision along with the context that forced it and the consequences it brings —
      Michael Nygard's lightweight format.
    ref: "concepts.md#architecture-decision-records-adrs-the-nygard-format"

  - id: design-docs-rfcs-and-adrs-004
    difficulty: intermediate
    tags: [artifacts, doc-vs-rfc-vs-adr, judgment]
    question: |
      Which statement best captures the difference between a design doc, an RFC, and an
      ADR?
    options:
      - "They are three names for the exact same artifact"
      - "ADRs are for startups, design docs for FAANG, and RFCs for open source"
      - "An RFC is longer than a design doc, which is longer than an ADR, and that is the only difference"
      - "A design doc explores how to build a system; an RFC is a proposal posture seeking consensus/feedback; an ADR is a short, immutable record of one decision and why"
    answer: 3
    explanation: |
      Design doc = "how will we build this?" (a snapshot of the whole solution); RFC = the
      consensus-seeking *posture* around a proposal; ADR = the immutable "receipt" for one
      decision and its rationale. RFC vs design doc is largely cultural naming; ADR differs
      in granularity and durability.
    ref: "concepts.md#design-doc-vs-rfc-vs-adr-which-artifact-when"

  - id: design-docs-rfcs-and-adrs-005
    difficulty: intermediate
    tags: [doc-vs-rfc-vs-adr, right-sizing, judgment]
    question: |
      You need to change a config default that is trivially reversible and affects one
      internal service. What does right-sizing the process look like?
    options:
      - "Write a full multi-page RFC and hold a cross-team review meeting"
      - "File 10 ADRs, one per config key touched"
      - "Make the change with a clear PR description — a heavyweight RFC is overkill for a low-blast-radius, easily-reversed decision"
      - "Skip any explanation entirely; config changes never need context"
    answer: 2
    explanation: |
      Matching process weight to the decision's blast radius and reversibility is itself a
      judgment signal. A small, two-way-door change needs a clear PR description, not a
      full RFC and review meeting. Reserve heavyweight process for significant,
      hard-to-reverse, cross-cutting decisions.
    ref: "concepts.md#design-doc-vs-rfc-vs-adr-which-artifact-when"

  - id: design-docs-rfcs-and-adrs-006
    difficulty: beginner
    tags: [design-doc, problem-statement, structure]
    question: |
      Which section should a design doc lead with?
    options:
      - "A crisp problem statement (ideally quantified) — what problem this doc exists to solve"
      - "The full implementation details and code snippets"
      - "A list of every library version the project uses"
      - "The author's personal preference for the technology"
    answer: 0
    explanation: |
      If a reviewer can't tell what problem you're solving in the first half-page, the rest
      is noise. Strong problem statements are specific and often quantified ("p99 is 1.8s
      against a 300ms SLO"), not "search is slow." Solution detail comes later.
    ref: "concepts.md#anatomy-of-a-design-doc--rfc"

  - id: design-docs-rfcs-and-adrs-007
    difficulty: intermediate
    tags: [design-doc, failure-mode, structure]
    question: |
      A reviewer opens a design doc that is entirely proposed implementation — no problem
      statement, no alternatives, no trade-offs. What does this most signal?
    options:
      - "Admirable focus and efficiency"
      - "That the problem must be obvious and needs no statement"
      - "That the author is senior because they are decisive"
      - "'I already decided; here's the code I want to write' — which invites rubber-stamping or nitpicking rather than engagement with the decision"
    answer: 3
    explanation: |
      A doc that is all solution and no problem/alternatives/trade-offs reads as a
      pre-made decision looking for approval. It denies reviewers the chance to engage with
      the actual choice, so they either rubber-stamp or nitpick. Lead with problem and
      alternatives.
    ref: "concepts.md#anatomy-of-a-design-doc--rfc"

  - id: design-docs-rfcs-and-adrs-008
    difficulty: beginner
    tags: [goals-non-goals, scoping]
    question: |
      What is a "non-goal" in a design doc?
    options:
      - "A goal the author forgot to write down"
      - "A goal that failed in a previous project"
      - "A feature that is technically impossible"
      - "Something that could reasonably be a goal but is explicitly chosen NOT to be pursued in this design"
    answer: 3
    explanation: |
      Non-goals are the underrated half of scoping: things that could reasonably be goals
      but you deliberately exclude (e.g. "multi-region is a non-goal for v1"). They prevent
      scope creep, surface disagreement early, and demonstrate you understand the full space.
    ref: "concepts.md#goals-and-non-goals-scoping-the-argument"

  - id: design-docs-rfcs-and-adrs-009
    difficulty: intermediate
    tags: [goals-non-goals, quality]
    question: |
      Which is a well-formed non-goal?
    options:
      - "Non-goal: supporting on-prem deployment (all target customers are cloud; revisit if the enterprise segment materializes)"
      - "Non-goal: having bugs"
      - "Non-goal: being slow"
      - "Non-goal: making the system worse"
    answer: 0
    explanation: |
      A good non-goal is a real temptation you're resisting, with a reason and a
      revisit condition. "Supporting on-prem (cloud-only customers; revisit later)" is a
      genuine scoping cut. "Being slow / having bugs" aren't non-goals — they're goals
      phrased backwards.
    ref: "concepts.md#goals-and-non-goals-scoping-the-argument"

  - id: design-docs-rfcs-and-adrs-010
    difficulty: intermediate
    tags: [goals-non-goals, review, scope-creep]
    question: |
      In review, someone asks "what about multi-region support?" for a v1 design. The doc
      already lists it as an explicit non-goal. What is the value of having done that?
    options:
      - "It lets the author ignore the reviewer entirely"
      - "It proves multi-region is impossible"
      - "It converts a potential scope-creep argument into a quick, pre-decided answer — and if the reviewer thinks it *should* be a goal, that disagreement surfaces now, cheaply"
      - "It means the reviewer's comment can be deleted without reply"
    answer: 2
    explanation: |
      Explicit non-goals prevent scope creep and surface the *right* disagreement early: if
      a reviewer believes a non-goal should be a goal, that's the cheap conversation to have
      before building — not after. It doesn't license ignoring the reviewer.
    ref: "concepts.md#goals-and-non-goals-scoping-the-argument"

  - id: design-docs-rfcs-and-adrs-011
    difficulty: advanced
    tags: [alternatives-considered, judgment, senior-signal]
    question: |
      Why is the "alternatives considered" section widely called the part of a design doc
      that best demonstrates judgment?
    options:
      - "Because it is the longest section"
      - "Because reviewers skip it, so mistakes there are safe"
      - "Because it lists competitor companies"
      - "Because it shows you explored the solution space, and explains why the chosen design beats the others for the stated goals — preempting the 'did you consider X?' question"
    answer: 3
    explanation: |
      The alternatives section demonstrates *why the chosen solution is best given the
      goals* and answers the "did you think about X?" every reviewer has. Exploring the
      space rather than tunnel-visioning on the first idea is the core judgment signal.
    ref: "concepts.md#alternatives-considered-the-section-that-shows-judgment"

  - id: design-docs-rfcs-and-adrs-012
    difficulty: advanced
    tags: [alternatives-considered, weak-vs-strong]
    question: |
      Which is the strongest "alternatives considered" entry?
    options:
      - "We could use DynamoDB but Postgres is just better."
      - "DynamoDB: gives effortless horizontal scale and no store ops. Rejected for v1 because orders need multi-item transactions and joins across order/payment/line-item, which Postgres gives for free. We'd revisit if a single table's writes outgrow primary+replica Postgres — which our 5k-TPS projection is well under."
      - "We didn't consider anything else; the first idea was fine."
      - "DynamoDB is what a big company would use, so we should too."
    answer: 1
    explanation: |
      A strong alternative steel-mans the option (names what it wins), rejects it *for this
      context* tied to a goal/constraint, and states the condition under which it would
      win. The others are dogmatic, strawman, tunnel-visioned, or cargo-cult.
    ref: "concepts.md#alternatives-considered-the-section-that-shows-judgment"

  - id: design-docs-rfcs-and-adrs-013
    difficulty: intermediate
    tags: [alternatives-considered, interview, red-flag]
    question: |
      In a design interview you say "I only considered this one approach." Why is this a
      red flag at senior+?
    options:
      - "It suggests first-idea/tunnel-vision bias — interviewers ask 'what else did you consider?' specifically to see if you explored the space"
      - "It shows you are fast and decisive, which is always good"
      - "It is fine; considering alternatives wastes interview time"
      - "It means you must be an expert who needs no alternatives"
    answer: 0
    explanation: |
      "What else did you consider?" is asked precisely to test whether you explored the
      space or fixated on the first idea. At senior+, tunnel vision reads as a judgment
      gap. Even "I considered the status quo / doing nothing" counts as an alternative.
    ref: "concepts.md#alternatives-considered-the-section-that-shows-judgment"

  - id: design-docs-rfcs-and-adrs-014
    difficulty: advanced
    tags: [alternatives-considered, thinking-tool, maturity]
    question: |
      A candidate says: "Writing the alternatives section actually changed my mind — I'd
      planned to use an event-sourced design, but laying out the operational cost made me
      pick the simpler CRUD approach." What does this demonstrate?
    options:
      - "That the candidate is indecisive and can't be trusted"
      - "That event sourcing is always wrong"
      - "That the candidate wasted time writing"
      - "That the doc functioned as a genuine thinking tool that improved the decision, not a post-hoc justification — a strong maturity signal"
    answer: 3
    explanation: |
      The strongest candidates note that the *act of writing* the alternatives section
      changed their design. That's proof the doc did its job as a thinking tool, and it
      demonstrates the maturity to update on your own analysis rather than defend a first
      instinct.
    ref: "concepts.md#alternatives-considered-the-section-that-shows-judgment"

  - id: design-docs-rfcs-and-adrs-015
    difficulty: intermediate
    tags: [trade-offs, credibility]
    question: |
      Why should a design doc state the trade-offs of its OWN chosen design, not just why
      the alternatives lost?
    options:
      - "To pad the document length"
      - "Because reviewers require exactly one trade-off per page"
      - "Because naming what your chosen design costs builds reviewer trust; a doc with zero stated trade-offs reads as naïve or as advocacy"
      - "Because it lets you avoid making a decision"
    answer: 2
    explanation: |
      Every design gives something up. Naming the cost of your chosen approach ("adds a
      cache, so we accept up-to-60s staleness, fine for a leaderboard") signals honest
      analysis. A doc that presents a flawless-looking design with no acknowledged costs
      reads as advocacy, not engineering.
    ref: "concepts.md#trade-offs-risks-and-open-questions"

  - id: design-docs-rfcs-and-adrs-016
    difficulty: intermediate
    tags: [risks, mitigations, framing]
    question: |
      Which way of documenting a risk is strongest?
    options:
      - "Risk: the backfill could double DB load during migration. Mitigation: throttle to 10%, run off-peak, abort if replica lag > 5s."
      - "Omit risks so the design looks solid"
      - "Risk: something might go wrong at some point."
      - "There are no risks with this design."
    answer: 0
    explanation: |
      A named risk with a concrete, testable mitigation (and abort criterion) is *more*
      reassuring than a doc that pretends there are none. Vague ("something might go
      wrong") or absent risks signal the author hasn't stress-tested the idea.
    ref: "concepts.md#trade-offs-risks-and-open-questions"

  - id: design-docs-rfcs-and-adrs-017
    difficulty: advanced
    tags: [open-questions, maturity, counterintuitive]
    question: |
      An engineer hides all unresolved questions from a design doc to look decisive. Why is
      this a mistake?
    options:
      - "Honestly listing open questions is a maturity signal that invites reviewers to help where they add most value; hiding them causes blindsiding in review or production"
      - "Because docs must have exactly five open questions"
      - "It isn't a mistake — never show uncertainty"
      - "Because open questions make the doc too long"
    answer: 0
    explanation: |
      Counterintuitively, *stating* open questions (and risks and trade-offs) makes a doc
      more credible. It directs reviewers to where they can add most value and prevents
      false confidence. Hiding them to look decisive leads to being blindsided later.
    ref: "concepts.md#trade-offs-risks-and-open-questions"

  - id: design-docs-rfcs-and-adrs-018
    difficulty: intermediate
    tags: [rollout, migration, operational-maturity]
    question: |
      For a schema/data change, which migration ordering reflects the safe, senior instinct?
    options:
      - "Delete the old column, then hope the new code works"
      - "Add the new path, backfill data, verify, switch reads over, then remove the old path — incremental and reversible at each step"
      - "Do everything in one big-bang deploy at peak traffic"
      - "Switch reads to the new column before it has any data"
    answer: 1
    explanation: |
      Safe migrations are incremental and reversible: dual-write/add new path, backfill,
      verify, cut reads over, then clean up the old path. Big-bang cutovers with no phasing
      and no rollback are the classic junior rollout.
    ref: "concepts.md#rollout-migration-and-operational-readiness"

  - id: design-docs-rfcs-and-adrs-019
    difficulty: intermediate
    tags: [rollout, rollback, one-way-door]
    question: |
      A design doc describes a rollout with no rollback plan. What is the concern?
    options:
      - "A rollout without a rollback is effectively a one-way door dressed up as a two-way door — you can't undo a bad change fast"
      - "Rollback plans are unnecessary if tests pass"
      - "It makes the doc too long"
      - "Rollback is only for databases"
    answer: 0
    explanation: |
      Without a fast rollback, a bad canary can't be undone quickly — the change is really a
      one-way door. Strong rollout sections pair phasing/flags with an explicit,
      fast rollback and abort criteria so a mistake affects 1% before 100%.
    ref: "concepts.md#rollout-migration-and-operational-readiness"

  - id: design-docs-rfcs-and-adrs-020
    difficulty: advanced
    tags: [rollout, operational-readiness, on-call]
    question: |
      Beyond phasing and rollback, which operational concern most belongs in a strong
      rollout section?
    options:
      - "The author's favorite editor settings"
      - "A list of every meeting held during design"
      - "Observability and on-call impact: which metrics/alarms confirm it's working, what tells you to abort, and who gets paged for new failure modes"
      - "The commit hashes of unrelated services"
    answer: 2
    explanation: |
      A design isn't done if it can't be operated. Senior reviewers look for observability
      (what signals success/abort) and on-call impact (new runbooks, alarms, who's paged).
      Naming these unprompted is an operational-maturity signal.
    ref: "concepts.md#rollout-migration-and-operational-readiness"

  - id: design-docs-rfcs-and-adrs-021
    difficulty: intermediate
    tags: [skimmability, bluf, audience]
    question: |
      What does "BLUF" (bottom line up front) mean for a design doc, and why does it matter?
    options:
      - "Put the conclusion in a footnote so readers must finish"
      - "Bury the decision on the last page to build suspense"
      - "Bold every line so nothing stands out"
      - "Lead with a short TL;DR — the problem, the proposal, and the ask — because busy senior reviewers may only read that summary"
    answer: 3
    explanation: |
      BLUF means opening with a five-sentence summary: the problem, the proposal, and the
      ask. A director or cross-team staff engineer may read only that, so it must stand
      alone. Docs nobody finishes have zero leverage.
    ref: "concepts.md#writing-for-the-audience-and-skimmability"

  - id: design-docs-rfcs-and-adrs-022
    difficulty: intermediate
    tags: [skimmability, audience, structure]
    question: |
      The same design doc is read by peers, your manager, and an adjacent team. What's the
      senior approach to structure?
    options:
      - "Write only for peers; others can figure it out"
      - "Write three completely separate documents with no shared source of truth"
      - "Structure so each audience finds its part — design detail for peers, scope/risk/timeline for managers, interface/impact for adjacent teams"
      - "Use maximum jargon so only experts can read it"
    answer: 2
    explanation: |
      Good docs serve multiple audiences at the right altitude within one document: peers
      want design detail, managers want scope/risk/timeline, adjacent teams want the
      interface and impact on them. Structure and headings let each find their part.
    ref: "concepts.md#writing-for-the-audience-and-skimmability"

  - id: design-docs-rfcs-and-adrs-023
    difficulty: intermediate
    tags: [skimmability, failure-mode]
    question: |
      A doc is a wall of stream-of-consciousness text: no summary, no headings, the key
      decision buried on page 6. What does this signal about the author?
    options:
      - "They are thorough and detail-oriented"
      - "They are writing to offload their own brain rather than to serve a reader — a clarity/seniority gap"
      - "They are protecting proprietary information"
      - "They are following best practice for design docs"
    answer: 1
    explanation: |
      Length is not thoroughness. A doc with no summary, no headings, and the decision
      buried deep signals the author wrote to dump their thoughts, not to serve a reader.
      Skimmable structure (headings, bullets, tables, a diagram) is the senior instinct.
    ref: "concepts.md#writing-for-the-audience-and-skimmability"

  - id: design-docs-rfcs-and-adrs-024
    difficulty: beginner
    tags: [adr, nygard, sections]
    question: |
      What are the core sections of a Michael Nygard ADR?
    options:
      - "Title, Status, Context, Decision, Consequences"
      - "Abstract, Methods, Results, Discussion"
      - "Executive Summary, Budget, Timeline, Sign-off"
      - "Problem, Code, Tests, Deploy"
    answer: 0
    explanation: |
      Nygard's lightweight ADR format is Title, Status (Proposed → Accepted →
      Deprecated/Superseded), Context (the forces at play), Decision ("We will…"), and
      Consequences (what becomes easier AND harder).
    ref: "concepts.md#architecture-decision-records-adrs-the-nygard-format"

  - id: design-docs-rfcs-and-adrs-025
    difficulty: intermediate
    tags: [adr, immutability, one-decision]
    question: |
      Which two properties define a good ADR?
    options:
      - "It is long, and it is approved by a VP"
      - "It records exactly one decision, and it is immutable — superseded by a new ADR rather than edited in place"
      - "It contains code, and it is auto-generated"
      - "It is secret, and it is deleted after the project ships"
    answer: 1
    explanation: |
      A good ADR is specific (one decision per record, so its status stays meaningful) and
      immutable (you don't edit an accepted ADR; you write a new superseding one). This
      preserves the *history* of thinking, which is the whole point.
    ref: "concepts.md#architecture-decision-records-adrs-the-nygard-format"

  - id: design-docs-rfcs-and-adrs-026
    difficulty: intermediate
    tags: [adr, consequences, honesty]
    question: |
      Which ADR Consequences section is strongest?
    options:
      - "This decision has only benefits."
      - "Consequences: TBD."
      - "We gain transactions and referential integrity for free; we accept that scaling later will require app-level sharding."
      - "The consequences are self-evident from the code."
    answer: 2
    explanation: |
      The Consequences section is where ADRs earn their keep by naming both the good and
      the bad. "Gain transactions for free; accept sharding later" tells future-you exactly
      what was signed up for. An ADR listing only upsides is advocacy, not a record.
    ref: "concepts.md#architecture-decision-records-adrs-the-nygard-format"

  - id: design-docs-rfcs-and-adrs-027
    difficulty: advanced
    tags: [adr, superseding, immutability]
    question: |
      You wrote ADR-014 six months ago; the decision no longer holds because a constraint
      changed. What's the correct action?
    options:
      - "Edit ADR-014 in place to describe the new decision"
      - "Write a new ADR that supersedes it, and set ADR-014's status to 'Superseded by ADR-N' — preserving the decision history"
      - "Delete ADR-014 so it doesn't confuse anyone"
      - "Leave ADR-014 unchanged and just do the new thing without any record"
    answer: 1
    explanation: |
      ADRs are immutable. When a decision changes, write a *new* ADR that supersedes the
      old one and flip the old status to "Superseded by ADR-N." Editing or deleting the old
      record destroys the history of why things were once decided differently.
    ref: "concepts.md#architecture-decision-records-adrs-the-nygard-format"

  - id: design-docs-rfcs-and-adrs-028
    difficulty: intermediate
    tags: [adr, status, lifecycle]
    question: |
      Which sequence of ADR status values is valid in the Nygard lifecycle?
    options:
      - "Merged → Deployed → Archived"
      - "Draft → Final → Immutable → Deleted"
      - "Proposed → Accepted → Superseded (by a later ADR)"
      - "Open → In Progress → Done"
    answer: 2
    explanation: |
      An ADR is Proposed, then Accepted (or Rejected). An accepted decision may later become
      Deprecated or be Superseded by a newer ADR. The other sequences borrow deploy/ticket
      vocabulary, not decision-record status.
    ref: "concepts.md#architecture-decision-records-adrs-the-nygard-format"

  - id: design-docs-rfcs-and-adrs-029
    difficulty: advanced
    tags: [why-record, rationale, onboarding]
    question: |
      What is the primary, durable value of a decision record like an ADR?
    options:
      - "It documents WHAT was decided, which the code already shows"
      - "It preserves the RATIONALE — the WHY — which is what you need to safely change the decision later and to onboard people into years of reasoning"
      - "It satisfies an audit checkbox"
      - "It replaces the need for any code comments"
    answer: 1
    explanation: |
      The code already tells you *what* was decided. Only the ADR tells you *why* — and
      "why" is exactly what you need to safely change it later, to onboard new engineers into
      years of reasoning, and to avoid re-litigating settled debates.
    ref: "concepts.md#why-record-decisions-future-you-onboarding-and-not-re-litigating"

  - id: design-docs-rfcs-and-adrs-030
    difficulty: intermediate
    tags: [why-record, re-litigating, context]
    question: |
      A new engineer is frustrated and wants to re-argue "should we have used
      microservices?" How does an existing ADR help?
    options:
      - "It gives the context the decision was made in, turning a rehash into a productive re-decision: 'if that context changed, write a superseding ADR'"
      - "It forbids the topic from ever being discussed again"
      - "It proves microservices are always correct"
      - "It lets the team ignore the new engineer's concern"
    answer: 0
    explanation: |
      Without a record, teams re-argue settled decisions every time someone new is
      frustrated. An ADR provides the decision's context so the conversation becomes
      evidence-based: has the context changed enough to justify a superseding ADR? That's
      productive, not a rehash.
    ref: "concepts.md#why-record-decisions-future-you-onboarding-and-not-re-litigating"

  - id: design-docs-rfcs-and-adrs-031
    difficulty: intermediate
    tags: [why-record, incident, future-you]
    question: |
      Six months on, an engineer is about to "simplify" a consumer by removing its
      idempotency handling. What role does an ADR ideally play here?
    options:
      - "None; ADRs are only read during onboarding"
      - "It tells the engineer which editor to use"
      - "It automatically blocks the code change"
      - "It records why the queue is at-least-once and the consumer must be idempotent — stopping the 'fix' that would reintroduce the bug it was avoiding"
    answer: 3
    explanation: |
      A key payoff of decision records is protecting future maintainers: the ADR explains
      that at-least-once delivery is *why* the consumer is idempotent, so nobody "simplifies"
      it and reintroduces the exact bug it was designed to avoid.
    ref: "concepts.md#why-record-decisions-future-you-onboarding-and-not-re-litigating"

  - id: design-docs-rfcs-and-adrs-032
    difficulty: intermediate
    tags: [review-process, async, consensus]
    question: |
      How do mature orgs typically run design review at scale?
    options:
      - "Every doc requires a mandatory two-hour meeting with the whole company"
      - "Largely asynchronously — share the doc, collect inline comments, resolve threads, and pull people into a sync meeting only for contentious unresolved points"
      - "The author presents slides and no written doc is used"
      - "Reviews are skipped to move faster"
    answer: 1
    explanation: |
      Async-first review scales far better than "present slides in a meeting": share the
      doc, collect inline comments, resolve threads, and reserve synchronous time for the
      one or two genuinely contested points.
    ref: "concepts.md#the-review-process-async-comments-consensus-and-disagree-and-commit"

  - id: design-docs-rfcs-and-adrs-033
    difficulty: intermediate
    tags: [review-process, author-behavior]
    question: |
      As the author driving a doc review, which behavior is strongest?
    options:
      - "Ignore comments you disagree with so the doc stays clean"
      - "Accept every single comment without pushback to avoid conflict"
      - "Argue only in comment threads and never update the doc itself"
      - "Engage every substantive comment (reply, resolve, or capture as an open question), separate blocking from non-blocking feedback, and fold resolutions back into the doc"
    answer: 3
    explanation: |
      Good authors engage each substantive comment, distinguish blocking issues from nits,
      and update the doc (the source of truth) so the next reader sees the current state.
      Ignoring comments loses trust; capitulating to every nit signals no conviction.
    ref: "concepts.md#the-review-process-async-comments-consensus-and-disagree-and-commit"

  - id: design-docs-rfcs-and-adrs-034
    difficulty: advanced
    tags: [disagree-and-commit, leadership-principle, behavioral]
    question: |
      Which story best demonstrates "disagree and commit"?
    options:
      - "I was overruled on the design, stayed resentful, and said 'I told you so' when a minor issue appeared."
      - "I pushed hard with data for the event-sourced design and lost the argument on operational complexity; I disagreed, but committed fully and helped make the chosen design succeed."
      - "I refused to work on the design I disagreed with until they changed it."
      - "I quietly kept building my preferred version on the side."
    answer: 1
    explanation: |
      Disagree-and-commit means: once a decision is made through legitimate discussion,
      you commit fully — even if you argued the other side — instead of relitigating or
      slow-walking. Voicing disagreement with data, then wholeheartedly supporting the
      outcome, is the seniority signal. The others show ego over outcome.
    ref: "concepts.md#the-review-process-async-comments-consensus-and-disagree-and-commit"

  - id: design-docs-rfcs-and-adrs-035
    difficulty: advanced
    tags: [disagree-and-commit, behavioral, star]
    question: |
      "Tell me about a time you disagreed with a technical decision." Which arc is strongest?
    options:
      - "I voiced the disagreement once with data at the right altitude, the group decided against me, and I committed fully and helped it succeed."
      - "I kept raising the same objection in every meeting until people gave in."
      - "I disagreed silently and never said anything, then complained afterward."
      - "I escalated to my skip-level immediately without discussing with the team."
    answer: 0
    explanation: |
      The strong arc: raise the disagreement with data, once, at the right level; accept the
      group's decision; commit fully. The weak arcs are relitigating endlessly, staying
      silent then complaining, or escalating over the team's head as a first move.
    ref: "concepts.md#the-review-process-async-comments-consensus-and-disagree-and-commit"

  - id: design-docs-rfcs-and-adrs-036
    difficulty: intermediate
    tags: [review-process, failure-mode]
    question: |
      Which pair of review behaviors are BOTH failure modes at opposite extremes?
    options:
      - "Asking clarifying questions and updating the doc"
      - "Defending the doc against all feedback as an approval formality; AND capitulating to every comment with no conviction"
      - "Setting a deadline and highlighting the section needing eyes"
      - "Resolving threads and distinguishing blocking from non-blocking"
    answer: 1
    explanation: |
      Two opposite failure modes: the author who treats review as a rubber-stamp and fights
      all feedback (ego over outcome), and the author who caves to every comment (no
      conviction). Strong reviewers hold opinions firmly *and* update on good arguments.
    ref: "concepts.md#the-review-process-async-comments-consensus-and-disagree-and-commit"

  - id: design-docs-rfcs-and-adrs-037
    difficulty: intermediate
    tags: [written-culture, amazon-6-pager, narrative]
    question: |
      What is the reasoning behind Amazon's "6-pager" narrative memos (read silently at the
      start of a meeting) replacing PowerPoint?
    options:
      - "Slides are more expensive to produce"
      - "Reading is faster than presenting for everyone"
      - "The narrative structure of full sentences and paragraphs forces clearer thinking; you can hide a hand-wavy idea behind bullet points but not behind prose"
      - "It lets executives skip the meeting entirely"
    answer: 2
    explanation: |
      The premise (per Bezos) is that writing a good narrative memo forces better thought
      and understanding. Prose exposes gaps that bullets hide: "• improves scalability"
      survives a slide, but the full sentence about the trade-off cannot be written without
      confronting it.
    ref: "concepts.md#written-argument-culture-strong-opinions-loosely-held"

  - id: design-docs-rfcs-and-adrs-038
    difficulty: intermediate
    tags: [written-culture, strong-opinions-loosely-held]
    question: |
      What does "strong opinions, loosely held" mean in a doc/review context?
    options:
      - "Never commit to any position so you can't be wrong"
      - "Hold your opinion no matter what anyone says"
      - "Propose a clear, well-reasoned design and argue it vigorously, but update immediately when the evidence or a better argument appears"
      - "Only share opinions in private to avoid conflict"
    answer: 2
    explanation: |
      It's the antidote to both fence-sitting and ego-driven digging-in: form a definite,
      well-reasoned position (strong opinion), invite attack, and genuinely change it when a
      reviewer is right (loosely held).
    ref: "concepts.md#written-argument-culture-strong-opinions-loosely-held"

  - id: design-docs-rfcs-and-adrs-039
    difficulty: advanced
    tags: [written-culture, narrative-vs-slides, judgment]
    question: |
      Why does the sentence "This shards writes by customer-id, which removes the
      single-writer bottleneck but breaks cross-customer transactions" illustrate why
      narrative beats slides for decisions?
    options:
      - "Writing the full sentence forces the author to confront and expose the trade-off, whereas a bullet like '• improves scalability' can hide it"
      - "It is shorter than a slide bullet"
      - "It uses a technical term, which impresses reviewers"
      - "Slides cannot contain the word 'customer-id'"
    answer: 0
    explanation: |
      Full sentences make thinking auditable: you cannot write that sentence without stating
      both the win (removes the bottleneck) and the cost (breaks cross-customer
      transactions). A bullet lets you assert the upside and skip the trade-off entirely.
    ref: "concepts.md#written-argument-culture-strong-opinions-loosely-held"

  - id: design-docs-rfcs-and-adrs-040
    difficulty: advanced
    tags: [clarity, seniority-signal, communication]
    question: |
      In an interview, the interviewer has to work hard to follow your rambling design
      explanation even though the underlying design was good. How is this scored?
    options:
      - "It doesn't matter as long as the design is correct"
      - "The difficulty following you IS the signal — clarity of communication is read as clarity of thinking, and compressing complexity for the audience is exactly the staff-level skill"
      - "It counts in your favor because complex ideas should sound complex"
      - "Interviewers only grade the final diagram, not the explanation"
    answer: 1
    explanation: |
      At staff level clarity isn't a nice-to-have — it *is* the job. If the interviewer must
      work to follow you, that's the signal regardless of design quality. Structure spoken
      answers like a doc: BLUF, then the argument, then the trade-off.
    ref: "concepts.md#clarity-as-a-seniority-signal"

  - id: design-docs-rfcs-and-adrs-041
    difficulty: intermediate
    tags: [clarity, weak-vs-strong, communication]
    question: |
      "Walk me through a design decision." Which response demonstrates the strongest clarity?
    options:
      - "The problem was X (quantified). Of three options I'll focus on the two real contenders. I chose A for constraint Y; it cost us Z, acceptable because W. Here's how we rolled it out safely."
      - "A chronological narration of everything you tried, with no clear problem or explicit decision."
      - "It was complicated; you had to be there to understand it."
      - "We used the framework everyone uses, so there wasn't really a decision."
    answer: 0
    explanation: |
      The strong answer follows a thinking structure — problem, alternatives, decision,
      trade-off, rollout — in under two minutes. The weak versions meander, cop out, or deny
      that any judgment was exercised.
    ref: "concepts.md#clarity-as-a-seniority-signal"

  - id: design-docs-rfcs-and-adrs-042
    difficulty: intermediate
    tags: [clarity, jargon, altitude]
    question: |
      Which habit best signals clear thinking to a senior interviewer?
    options:
      - "Explaining a hard concept in simple language and pitching each part at the right altitude for its audience (architecture with peers, scope/risk with leadership)"
      - "Using dense jargon to sound authoritative"
      - "Adding as many acronyms as possible"
      - "Refusing to summarize because details matter"
    answer: 0
    explanation: |
      Jargon-dense writing usually hides fuzzy thinking; the ability to explain a hard idea
      plainly signals you truly understand it. Talking at the right altitude for each
      audience is part of the same clarity skill.
    ref: "concepts.md#clarity-as-a-seniority-signal"

  - id: design-docs-rfcs-and-adrs-043
    difficulty: advanced
    tags: [interview, critique-doc, feedback-tone]
    question: |
      You're asked to critique a design doc in an interview. Where should you look first for
      the highest-value critique?
    options:
      - "Formatting and typos"
      - "Whether the author used your preferred programming language"
      - "The frame — is the problem clear, are goals/non-goals stated — and whether alternatives were considered and why rejected; a missing/thin alternatives section is the highest-value catch"
      - "The length of each paragraph"
    answer: 2
    explanation: |
      Checking the frame (clear problem, goals/non-goals) and the alternatives section
      catches far more than nitpicking the diagram. A missing or thin "alternatives
      considered" is usually the highest-value critique to raise.
    ref: "concepts.md#in-interviews-writing-or-critiquing-a-design-doc"

  - id: design-docs-rfcs-and-adrs-044
    difficulty: advanced
    tags: [interview, critique-doc, feedback-tone]
    question: |
      When critiquing a design doc in an interview, why does the TONE of your feedback matter
      to your score?
    options:
      - "It doesn't; only the technical accuracy of the critique is graded"
      - "Because you should never point out any problems"
      - "Because harsh feedback proves you have high standards"
      - "How you give feedback is a proxy for how you'll behave in real design/code review — interviewers watch whether your critique would make an author defensive or grateful"
    answer: 3
    explanation: |
      The *how* of feedback is evaluated: lead with what's good and the intent you
      understand, frame issues as questions ("what problem is this solving?"), and
      distinguish blocking from nits. Staff engineers make people *want* their review.
    ref: "concepts.md#in-interviews-writing-or-critiquing-a-design-doc"

  - id: design-docs-rfcs-and-adrs-045
    difficulty: advanced
    tags: [interview, drive-alignment, lifecycle]
    question: |
      "How would you drive alignment on a big cross-team decision?" Which answer is strongest?
    options:
      - "I'd convince the loudest engineer and the rest would follow."
      - "I'd write an RFC, socialize it async with affected teams, resolve objections in the doc, escalate the one or two truly contested points to a short decision meeting, then record the outcome as ADRs and disagree-and-commit."
      - "I'd just build a prototype and let it speak for itself."
      - "I'd have my manager mandate the decision top-down."
    answer: 1
    explanation: |
      The strong answer describes a *process*, not heroics or authority: RFC → async
      socialization → resolve objections in-doc → escalate only the contested points →
      record as ADRs → disagree-and-commit. That demonstrates the whole decision lifecycle.
    ref: "concepts.md#in-interviews-writing-or-critiquing-a-design-doc"

  - id: design-docs-rfcs-and-adrs-046
    difficulty: intermediate
    tags: [interview, write-doc, judgment]
    question: |
      Asked to quickly draft a design doc in an interview, what's the fastest way to signal
      judgment?
    options:
      - "Dive straight into implementation classes and method signatures"
      - "List only the chosen solution and assert it's obviously correct"
      - "Write the longest document possible to show effort"
      - "Start with problem/goals/non-goals, include an explicit alternatives-considered section (even brief), name a trade-off and a risk with a mitigation, and add a short rollout note"
    answer: 3
    explanation: |
      Even under time pressure, framing (problem/goals/non-goals) plus an explicit
      alternatives section is the fastest judgment signal, reinforced by a named trade-off,
      a risk+mitigation, and a rollout note. Diving into implementation skips the decision.
    ref: "concepts.md#in-interviews-writing-or-critiquing-a-design-doc"

  - id: design-docs-rfcs-and-adrs-047
    difficulty: advanced
    tags: [failure-modes, weak-vs-strong, summary]
    question: |
      Across all these artifacts, what is the meta-signal that separates senior/staff
      engineers from junior ones in how they treat writing?
    options:
      - "Seniors write more words than juniors"
      - "Seniors use more diagrams than prose"
      - "Seniors avoid writing and rely on meetings"
      - "Seniors treat writing as a tool for better decisions and broader influence; juniors treat it as a documentation chore done after the fact"
    answer: 3
    explanation: |
      The unifying meta-signal: senior/staff engineers use writing to find bugs in their
      thinking *before* building and to scale influence across an org, not as compliance
      documentation produced after shipping. That framing dissolves most common failure
      modes on its own.
    ref: "concepts.md#weak-vs-strong-failure-modes-interviewers-penalize"

  - id: design-docs-rfcs-and-adrs-048
    difficulty: intermediate
    tags: [failure-modes, scope-signal, weak-vs-strong]
    question: |
      Which statement in a behavioral answer most signals individual-contributor (rather
      than staff) scope?
    options:
      - "I aligned four teams via an RFC and the review changed our rollout plan."
      - "I recorded the decision as an ADR so future maintainers understood the why."
      - "I built it and it worked."
      - "I disagreed in review, then committed and helped the chosen design succeed."
    answer: 2
    explanation: |
      "I built it and it worked" describes individual output with no alignment, influence, or
      durable record — IC-level scope. The others demonstrate cross-team alignment, decision
      recording, and disagree-and-commit, which are staff-level signals.
    ref: "concepts.md#weak-vs-strong-failure-modes-interviewers-penalize"
