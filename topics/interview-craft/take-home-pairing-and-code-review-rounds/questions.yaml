topic: "Take-Home Projects, Pairing & Code-Review Rounds"
domain: interview-craft
topic_slug: take-home-pairing-and-code-review-rounds
version: 1
questions:
  - id: take-home-pairing-and-code-review-rounds-001
    difficulty: beginner
    tags: [purpose, signals, realistic-work]
    question: |
      Why do product companies and startups increasingly use take-home, pairing, and
      code-review rounds instead of only whiteboard algorithm puzzles?
    options:
      - "They are a better proxy for the day-to-day job: writing maintainable code and collaborating"
      - "They are cheaper and faster to administer than a structured whiteboard interview loop"
      - "They let the company postpone the hiring decision indefinitely without ever committing"
      - "They test rote memorization of classic data structures and algorithms far more thoroughly"
    answer: 0
    explanation: |
      These realistic-work rounds sample signals a whiteboard can't: whether you write code a
      team would maintain and whether you collaborate like a senior teammate. The through-line
      is "would I want this person on my team on a normal Tuesday?"
    ref: "concepts.md#what-these-rounds-actually-test"

  - id: take-home-pairing-and-code-review-rounds-002
    difficulty: beginner
    tags: [signals, pragmatism, craftsmanship]
    question: |
      Across take-home, pairing, and code-review rounds, what three qualities are all of them
      fundamentally testing?
    options:
      - "Speed, memorization, and syntax recall"
      - "Feature count, lines of code, and cleverness"
      - "Pragmatism, communication, and craftsmanship"
      - "Framework knowledge, tooling, and typing speed"
    answer: 2
    explanation: |
      Every one of these rounds is a pragmatism + communication + craftsmanship test. The
      right move is almost always the one that shows judgment and teamwork over raw cleverness
      or feature-count.
    ref: "concepts.md#what-these-rounds-actually-test"

  - id: take-home-pairing-and-code-review-rounds-003
    difficulty: intermediate
    tags: [take-home, anti-signals, over-engineering]
    question: |
      Which of these is an ANTI-signal that hurts you most in a take-home submission?
    options:
      - "A clear README that explains your key design trade-offs"
      - "Over-engineering with abstractions the prompt never required"
      - "Meaningful automated tests exercising the core business logic"
      - "A documented one-command setup-and-run recipe"
    answer: 1
    explanation: |
      Over-engineering reads as poor judgment, not sophistication. Every unrequested
      abstraction is something the reviewer must evaluate and you must justify. Tests, a
      README, and easy setup are all positive signals.
    ref: "concepts.md#what-these-rounds-actually-test"

  - id: take-home-pairing-and-code-review-rounds-004
    difficulty: beginner
    tags: [take-home, time-box, scoping]
    question: |
      A take-home says "spend about 4 hours." The prompt clearly contains more than 4 hours of
      work. What is the strongest interpretation?
    options:
      - "Spend as many hours as it takes to implement every listed feature completely and perfectly"
      - "Skip the take-home entirely and ask the company to give you a live interview instead"
      - "Implement every feature as an empty stub so that on inspection nothing appears to be missing"
      - "The under-specification and over-scoping are the test; what you build and consciously cut is the signal"
    answer: 3
    explanation: |
      Take-homes are deliberately larger than the time-box. Scoping to the box — building the
      core loop and consciously naming what you cut — is precisely what's being evaluated.
    ref: "concepts.md#take-home-scope-to-the-time-box"

  - id: take-home-pairing-and-code-review-rounds-005
    difficulty: intermediate
    tags: [take-home, time-box, prioritization]
    question: |
      You realize a "~3 hour" take-home would take 10 hours to fully complete. Which approach
      best demonstrates senior judgment?
    options:
      - "Build a thin vertical slice of the core loop with tests in the time-box, then document what you cut and why"
      - "Spend the full 10 hours regardless of the box so the reviewer sees your maximum effort"
      - "Submit an outline of what you would have built with no working code"
      - "Build all of the requested features end-to-end but skip writing any tests to save time"
    answer: 0
    explanation: |
      Honor the time-box: a working, tested core slice plus a README naming deferred features
      beats a sprawling over-budget submission. Going 10 hours signals poor prioritization and
      disadvantages candidates with other commitments.
    ref: "concepts.md#take-home-scope-to-the-time-box"

  - id: take-home-pairing-and-code-review-rounds-006
    difficulty: intermediate
    tags: [take-home, scoping, cuts]
    question: |
      When the take-home time-box forces you to cut something, what should you cut?
    options:
      - "Quality — ship more features even if untested and rough"
      - "The README and docs — well-written code should speak for itself"
      - "Features — keep the smaller solution tested and readable, and name the cuts"
      - "Error handling — reviewers only ever exercise the happy path anyway"
    answer: 2
    explanation: |
      Cut features, not quality. A smaller, tested, readable solution with a clear README that
      names the deferred features outscores a sprawling, untested one.
    ref: "concepts.md#take-home-scope-to-the-time-box"

  - id: take-home-pairing-and-code-review-rounds-007
    difficulty: intermediate
    tags: [take-home, depth-vs-breadth]
    question: |
      Two take-home candidates: A builds every requested feature at 50% (nothing fully works);
      B builds the core feature end-to-end with tests and defers the rest. Who reads as more
      senior?
    options:
      - "A — broader coverage across every feature demonstrates more ambition and range"
      - "Neither is stronger; only the total line count of the submission actually matters"
      - "A, because touching more of the written spec proves they read the prompt carefully"
      - "B — depth on a working, tested core beats breadth of half-built stubs"
    answer: 3
    explanation: |
      A working request-to-response-to-test path beats three half-built features. Depth on the
      core, plus a documented plan for the rest, is the stronger signal.
    ref: "concepts.md#take-home-scope-to-the-time-box"

  - id: take-home-pairing-and-code-review-rounds-008
    difficulty: beginner
    tags: [take-home, runnable, setup]
    question: |
      What is the FIRST thing a reviewer tries to establish when they open your take-home
      submission?
    options:
      - "Whether the code shows off advanced or exotic language features"
      - "Whether it runs — can they start it quickly with a clear recipe"
      - "How many distinct design patterns you managed to work into the solution"
      - "Whether you adopted the newest bleeding-edge version of the framework"
    answer: 1
    explanation: |
      "Does it run?" comes first. If a reviewer can't start it in a couple of minutes, the
      quality inside barely matters. Provide a one-command setup and pin versions.
    ref: "concepts.md#take-home-working-tested-readable-beats-feature-complete"

  - id: take-home-pairing-and-code-review-rounds-009
    difficulty: intermediate
    tags: [take-home, tests, senior-bar]
    question: |
      For a senior candidate, what does submitting a take-home with ZERO tests most signal?
    options:
      - "Well-placed confidence in the correctness of one's own code"
      - "An efficient, disciplined use of the limited take-home time-box"
      - "A near-automatic ding — tests are the clearest proxy for production-quality code"
      - "That the submitted code must be simple enough not to warrant any tests"
    answer: 2
    explanation: |
      Tests are the clearest proxy for "this person writes production code." A senior-level
      submission with no tests is close to an automatic mark-down, regardless of how the code
      looks.
    ref: "concepts.md#take-home-working-tested-readable-beats-feature-complete"

  - id: take-home-pairing-and-code-review-rounds-010
    difficulty: intermediate
    tags: [take-home, tests, coverage]
    question: |
      What kind of test coverage best demonstrates senior judgment in a small take-home?
    options:
      - "Meaningful tests on the core logic and nasty edge cases like empty/bad input and boundaries"
      - "A full 100% line-coverage suite, including trivial getters and setters"
      - "A single smoke test that merely confirms the application starts up"
      - "No tests at all, but a README note saying you know how to test"
    answer: 0
    explanation: |
      You don't need 100% coverage; you need meaningful tests on the core logic and the hard
      edge cases. That shows you think about the unhappy path, which is the production mindset.
    ref: "concepts.md#take-home-working-tested-readable-beats-feature-complete"

  - id: take-home-pairing-and-code-review-rounds-011
    difficulty: intermediate
    tags: [take-home, readability, cleanup]
    question: |
      Before submitting a take-home, which cleanup step most improves the craftsmanship signal?
    options:
      - "Adding dense inline comments explaining what nearly every line does"
      - "Running the linter/formatter and deleting dead code and commented-out experiments"
      - "Renaming files and folders to look more enterprise-y and elaborate"
      - "Adding a general configuration system to allow for future flexibility"
    answer: 1
    explanation: |
      Readability is what a reviewer feels immediately. Consistent formatting, clear names, and
      removing dead/commented-out code make the submission read like a real, reviewable PR.
    ref: "concepts.md#take-home-working-tested-readable-beats-feature-complete"

  - id: take-home-pairing-and-code-review-rounds-012
    difficulty: advanced
    tags: [take-home, commits, production]
    question: |
      What does a strong senior take-home submission most resemble?
    options:
      - "A single squashed 'final' commit that dumps all of the code in at once"
      - "A research prototype with many half-finished experimental branches left in"
      - "A maximal feature set with commented-out alternative implementations kept for reference"
      - "A small, real PR: cohesive commits, a green test suite, a README, and no TODO landmines"
    answer: 3
    explanation: |
      The submission should communicate that your on-the-job work would be reviewable and
      shippable: cohesive commits, passing tests, a README, and no leftover TODO landmines.
    ref: "concepts.md#take-home-working-tested-readable-beats-feature-complete"

  - id: take-home-pairing-and-code-review-rounds-013
    difficulty: beginner
    tags: [take-home, readme]
    question: |
      Why is the README often weighted nearly as heavily as the code in a take-home?
    options:
      - "Reviewers don't actually read the code, only the prose documentation"
      - "It is the only file that reliably gets committed to the repository"
      - "It's where you demonstrate the judgment and reasoning the code alone can't show"
      - "A thorough README fully replaces the need for any automated tests"
    answer: 2
    explanation: |
      Reviewers read the README first. It turns "here's some code" into "here's an engineer
      reasoning about a problem" — surfacing assumptions, trade-offs, and next steps.
    ref: "concepts.md#take-home-the-readme-is-half-the-grade"

  - id: take-home-pairing-and-code-review-rounds-014
    difficulty: intermediate
    tags: [take-home, readme, next-steps]
    question: |
      Why is the "what I'd do with more time" section considered the highest-leverage part of a
      take-home README?
    options:
      - "It demonstrates senior awareness of gaps (scaling, security, observability) without spending hours building them"
      - "It gives you a documented excuse to avoid writing any automated tests"
      - "It provides a dedicated place to apologize for the shortcomings of the code"
      - "It pads out the document with extra sections so it looks more thorough"
    answer: 0
    explanation: |
      Naming the gaps you consciously chose not to fill proves you saw them — which is more
      senior than silently leaving them or pretending nothing is missing.
    ref: "concepts.md#take-home-the-readme-is-half-the-grade"

  - id: take-home-pairing-and-code-review-rounds-015
    difficulty: intermediate
    tags: [take-home, readme, assumptions]
    question: |
      The take-home prompt is ambiguous about whether user IDs are globally unique. What's the
      best way to handle this?
    options:
      - "Email the company back repeatedly until someone answers the question for you"
      - "Implement both possible interpretations at once to be safe and cover all cases"
      - "Ignore the ambiguity entirely and hope that it doesn't end up mattering"
      - "Pick a reasonable interpretation, implement it, and document the assumption in the README"
    answer: 3
    explanation: |
      Resolving ambiguity with a stated assumption ("I assumed per-tenant uniqueness") is
      exactly what the README's assumptions section is for and shows decisive judgment.
    ref: "concepts.md#take-home-the-readme-is-half-the-grade"

  - id: take-home-pairing-and-code-review-rounds-016
    difficulty: beginner
    tags: [take-home, readme, contents]
    question: |
      Which set of items best belongs in a senior take-home README?
    options:
      - "Only the single command needed to run the project"
      - "Run instructions, assumptions, design rationale, trade-offs, and what you'd do with more time"
      - "An exhaustive list of every technology and tool you have ever used"
      - "A lengthy apology for the parts of the prompt you didn't finish"
    answer: 1
    explanation: |
      A strong README covers how to run it, the assumptions you made, your design/approach and
      why, the key trade-offs, and an explicit next-steps / left-out section.
    ref: "concepts.md#take-home-the-readme-is-half-the-grade"

  - id: take-home-pairing-and-code-review-rounds-017
    difficulty: advanced
    tags: [take-home, over-engineering, yagni]
    question: |
      In a small take-home, a candidate adds a generic plugin/strategy framework to handle a
      single current use case "in case we need more later." How does this most likely read?
    options:
      - "As over-engineering and poor judgment — a YAGNI violation the problem never required"
      - "As forward-thinking, extensible architecture that impresses experienced reviewers"
      - "As a neutral, stylistic choice that has no real bearing on the evaluation"
      - "As the expected senior-level approach to designing for future extensibility"
    answer: 0
    explanation: |
      Speculative frameworks for a single case violate YAGNI and signal poor judgment. Build
      for the requirements plus obvious near-term needs; if you can't justify an abstraction in
      one sentence tied to a real requirement, delete it.
    ref: "concepts.md#take-home-production-minded-without-over-engineering"

  - id: take-home-pairing-and-code-review-rounds-018
    difficulty: advanced
    tags: [take-home, production-minded, balance]
    question: |
      What is the target middle-ground between "too junior" and "over-built" in a take-home?
    options:
      - "Maximum abstraction everywhere so that the code is fully future-proof"
      - "Happy-path implementation only, since after all it is just an interview"
      - "Production-minded pragmatism: real-code hallmarks applied proportionally to a small problem"
      - "As many separate microservices as possible to show off your scale awareness"
    answer: 2
    explanation: |
      The target is production-minded pragmatism: validation, meaningful tests, error handling,
      and sensible structure applied in proportion to the problem's size — not gold-plating.
    ref: "concepts.md#take-home-production-minded-without-over-engineering"

  - id: take-home-pairing-and-code-review-rounds-019
    difficulty: intermediate
    tags: [take-home, production-minded, hallmarks]
    question: |
      Which is a production-minded hallmark worth including even in a small take-home?
    options:
      - "A speculative caching layer that the prompt never actually asked for"
      - "Input validation and explicit error handling on the boundaries"
      - "Deep, multi-level inheritance hierarchies added for future flexibility"
      - "Configuration options for values that in practice will never change"
    answer: 1
    explanation: |
      Boundary validation and explicit error handling are proportionate production hallmarks.
      The other options are over-engineering: abstractions and config the problem doesn't need.
    ref: "concepts.md#take-home-production-minded-without-over-engineering"

  - id: take-home-pairing-and-code-review-rounds-020
    difficulty: intermediate
    tags: [take-home, justification, abstraction]
    question: |
      A reviewer asks why you introduced a particular abstraction in your take-home. What's the
      best position to be in?
    options:
      - "Unable to explain it — you added the abstraction 'just in case' it helped later"
      - "Arguing on principle that more abstraction is essentially always better"
      - "Blaming the framework or language for effectively requiring the abstraction"
      - "Able to justify it in one sentence tied to a real requirement, or you shouldn't have added it"
    answer: 3
    explanation: |
      The rule is: if you add an abstraction, be ready to justify it in one sentence tied to a
      real requirement; if you can't, it shouldn't be there. This demonstrates deliberate,
      pragmatic design.
    ref: "concepts.md#take-home-production-minded-without-over-engineering"

  - id: take-home-pairing-and-code-review-rounds-021
    difficulty: beginner
    tags: [pairing, think-out-loud]
    question: |
      In a pairing/live-coding round, what is the primary thing being measured?
    options:
      - "How fast you can physically type out the code"
      - "Whether you choose to use a bare editor like vim or a full IDE"
      - "How you work through the problem out loud — your reasoning, not just the final code"
      - "The sheer number of edge cases you quietly handle without saying anything"
    answer: 2
    explanation: |
      The interviewer can only score what they observe. A talkative candidate who reasons
      clearly but needs a nudge often outscores a silent one who reaches the answer without
      narration.
    ref: "concepts.md#pairing--live-coding-think-out-loud-and-communicate-intent"

  - id: take-home-pairing-and-code-review-rounds-022
    difficulty: intermediate
    tags: [pairing, narration, intent]
    question: |
      What's the most effective way to "think out loud" during live coding?
    options:
      - "Read out loud every single keystroke and character as you type it"
      - "Narrate intent and why — what you're about to do and the reasoning — not a keystroke play-by-play"
      - "Stay completely silent until the whole solution compiles and runs"
      - "Explain your entire career and life story upfront to build rapport"
    answer: 1
    explanation: |
      Narrate intent before mechanics: "I'll start with a brute-force pass, then optimize the
      lookup." A keystroke play-by-play adds noise; silence gives the interviewer nothing to
      score.
    ref: "concepts.md#pairing--live-coding-think-out-loud-and-communicate-intent"

  - id: take-home-pairing-and-code-review-rounds-023
    difficulty: intermediate
    tags: [pairing, plan, redirect]
    question: |
      Why is stating your plan/approach before you start coding valuable in a pairing round?
    options:
      - "It lets the interviewer redirect you before you waste time on the wrong path"
      - "It fills up otherwise-awkward silence so you have room to think"
      - "It proves to the interviewer that you memorized the underlying algorithm"
      - "It signals confidently that you don't really need any of their input"
    answer: 0
    explanation: |
      Restating the problem and sketching your approach lets the interviewer catch a wrong
      direction early — a gift, not a risk. It's the same trade-off articulation senior rounds
      reward.
    ref: "concepts.md#pairing--live-coding-think-out-loud-and-communicate-intent"

  - id: take-home-pairing-and-code-review-rounds-024
    difficulty: intermediate
    tags: [pairing, communication, extremes]
    question: |
      Which two communication extremes both FAIL a pairing round?
    options:
      - "Asking clarifying questions and testing the code incrementally"
      - "Narrating your intent clearly and running the code often"
      - "Stating a plan up front and flagging your assumptions"
      - "Total silence, and non-stop chatter that never produces code"
    answer: 3
    explanation: |
      Silence leaves the interviewer unable to follow or help; constant chatter that never
      produces code is equally bad. Aim for running commentary tied to actual progress.
    ref: "concepts.md#pairing--live-coding-think-out-loud-and-communicate-intent"

  - id: take-home-pairing-and-code-review-rounds-025
    difficulty: beginner
    tags: [pairing, clarifying-questions]
    question: |
      On an under-specified pairing prompt, what should you do FIRST?
    options:
      - "Start coding immediately to show initiative and a bias for action"
      - "Ask clarifying questions about inputs, output, scale, and edge cases"
      - "Pick the most complex possible interpretation of the prompt and build that"
      - "Wait silently and let the interviewer volunteer more detail on their own"
    answer: 1
    explanation: |
      Jumping straight to code on an under-specified prompt is a mid-level tell. Sharp
      clarifying questions ("can input be empty? how large is N?") are themselves a strong
      seniority signal.
    ref: "concepts.md#pairing-clarify-first-then-build-and-test-incrementally"

  - id: take-home-pairing-and-code-review-rounds-026
    difficulty: intermediate
    tags: [pairing, incremental, testing]
    question: |
      Which working style best demonstrates seniority during live coding?
    options:
      - "Write 60 lines all at once, then run it a single time at the very end and hope"
      - "Optimize the solution prematurely before any of it actually works"
      - "Avoid running the code at all so you don't accidentally reveal bugs"
      - "Get a trivial version running, then extend in small verifiable steps, testing as you go"
    answer: 3
    explanation: |
      Incremental progress with frequent runs means that when something breaks you know exactly
      which small change caused it. Testing as you go shows the same test-mindedness reviewers
      value in a take-home.
    ref: "concepts.md#pairing-clarify-first-then-build-and-test-incrementally"

  - id: take-home-pairing-and-code-review-rounds-027
    difficulty: intermediate
    tags: [pairing, edge-cases, clarify]
    question: |
      A candidate says: "Should I optimize for read or write?" and "Is the dataset bounded?"
      before coding. How does this read?
    options:
      - "As scoping and seniority — good questions save you from building the wrong thing"
      - "As stalling and a way to avoid actually starting to write code"
      - "As a clear lack of confidence in your own technical ability"
      - "As irrelevant, since the interviewer wants to see code, not talk"
    answer: 0
    explanation: |
      Treat clarifying questions as scoping, not stalling. Two sharp questions can save you from
      building the wrong thing and signal seniority faster than any line of code.
    ref: "concepts.md#pairing-clarify-first-then-build-and-test-incrementally"

  - id: take-home-pairing-and-code-review-rounds-028
    difficulty: intermediate
    tags: [pairing, example, shared-understanding]
    question: |
      Before writing code in a pairing round, why is it useful to trace one concrete
      input-to-output example by hand?
    options:
      - "It wastes time that the interviewer would rather see you spend coding"
      - "It proves to the interviewer that you can do arithmetic in your head"
      - "It confirms you and the interviewer share the same understanding of the problem"
      - "It fully replaces the need to actually run the code later on"
    answer: 2
    explanation: |
      Working an example by hand confirms shared understanding before you invest in code,
      catching misunderstandings while they're cheap to fix.
    ref: "concepts.md#pairing-clarify-first-then-build-and-test-incrementally"

  - id: take-home-pairing-and-code-review-rounds-029
    difficulty: beginner
    tags: [pairing, hints]
    question: |
      During pairing, the interviewer offers a hint. How should you interpret it?
    options:
      - "As definitive proof that you have already failed the interview"
      - "As a deliberate trap set to test whether you will cave under pressure"
      - "As a signal that you should defend your original approach even harder"
      - "As collaboration — a gift, exactly what a teammate would do in real pairing"
    answer: 3
    explanation: |
      Interviewers give hints deliberately. A hint is not a failure; how you receive it is
      graded. Engaging with it is the senior move — the room is collaborative, not adversarial.
    ref: "concepts.md#pairing-take-hints-gracefully-and-collaborate-as-a-teammate"

  - id: take-home-pairing-and-code-review-rounds-030
    difficulty: advanced
    tags: [pairing, hints, disagreement]
    question: |
      You genuinely believe a hint points to a worse approach than yours. What's the strongest
      response?
    options:
      - "Quietly ignore the hint and keep coding the problem your own way"
      - "Briefly discuss the trade-off openly, then adapt rather than digging in to prove you're right"
      - "Insist firmly that you are correct and refuse to change your approach"
      - "Silently switch to their approach without offering any explanation"
    answer: 1
    explanation: |
      Discuss the trade-off briefly and openly, then move on. Digging in to win — even when
      you're right — reads worse than adapting, because it predicts friction in real code review.
    ref: "concepts.md#pairing-take-hints-gracefully-and-collaborate-as-a-teammate"

  - id: take-home-pairing-and-code-review-rounds-031
    difficulty: intermediate
    tags: [pairing, hints, anti-signal]
    question: |
      Interviewer: "What happens with an empty input?" Which response sends the WEAKEST signal?
    options:
      - "\"Good catch — let me add a guard and a test for that.\""
      - "\"Let me handle that edge case now.\""
      - "\"It won't be empty,\" then moving on without addressing it"
      - "\"Right, empty input should return an error — I'll add it.\""
    answer: 2
    explanation: |
      Dismissing the hint ("it won't be empty") ignores a collaborative nudge and skips a real
      edge case. Engaging and adding a guard/test is the strong response to the same hint.
    ref: "concepts.md#pairing-take-hints-gracefully-and-collaborate-as-a-teammate"

  - id: take-home-pairing-and-code-review-rounds-032
    difficulty: intermediate
    tags: [pairing, collaboration, teammate]
    question: |
      What mindset toward the interviewer best demonstrates senior collaboration in a pairing
      round?
    options:
      - "Treat them as a pair — use 'we' and 'let's', bounce ideas off them"
      - "Treat them as a distant judge you have to impress from across the room"
      - "Treat them as an obstacle in your way that you have to route around"
      - "Treat them as irrelevant once you fully understand the problem yourself"
    answer: 0
    explanation: |
      Treating the interviewer as a pair, not a judge, mirrors your next standup rather than a
      test. Collaborative language and shared idea-bouncing are the behaviors they're imagining
      on the team.
    ref: "concepts.md#pairing-take-hints-gracefully-and-collaborate-as-a-teammate"

  - id: take-home-pairing-and-code-review-rounds-033
    difficulty: intermediate
    tags: [pairing, nerves, stuck]
    question: |
      You're stuck on the optimal solution during live coding and time is passing. What's the
      strongest move?
    options:
      - "Keep grinding silently on the optimal approach until the insight finally comes"
      - "Say so, implement the brute-force version to have something working, then optimize from there"
      - "Give up on this one and ask the interviewer for a different problem"
      - "Pretend you're almost done while quietly stalling for more time"
    answer: 1
    explanation: |
      A working slow solution beats an elegant non-solution, and you can improve from there.
      Naming that you'll start with brute force and optimize is composed, senior behavior.
    ref: "concepts.md#pairing-manage-nerves-and-recover-from-being-stuck"

  - id: take-home-pairing-and-code-review-rounds-034
    difficulty: intermediate
    tags: [pairing, debugging, composure]
    question: |
      Your code throws an unexpected error mid-pairing. What best demonstrates a senior signal?
    options:
      - "Randomly changing lines one at a time until the error finally goes away"
      - "Deleting the entire failing section and quietly starting it over from scratch"
      - "Blaming the environment or the tooling and simply moving on"
      - "Debugging systematically out loud: state a hypothesis, test it, then the next"
    answer: 3
    explanation: |
      Calm, methodical debugging under pressure — narrating a hypothesis, testing it, iterating
      — is a strong senior signal. Flailing or silent panic is the opposite.
    ref: "concepts.md#pairing-manage-nerves-and-recover-from-being-stuck"

  - id: take-home-pairing-and-code-review-rounds-035
    difficulty: intermediate
    tags: [pairing, recovery, wrong-path]
    question: |
      Twenty minutes in, you realize your current approach is a dead end. What impresses an
      interviewer most?
    options:
      - "Naming it and backing out: 'This isn't working — let me step back and reconsider'"
      - "Pushing forward on the dead-end approach to avoid admitting the mistake"
      - "Silently deleting everything you wrote and hoping they didn't notice"
      - "Blaming the problem statement for being unclear and under-specified"
    answer: 0
    explanation: |
      Recovering gracefully — naming the wrong path and resetting — impresses more than never
      stumbling. Spiraling or hiding the reset is the weaker signal.
    ref: "concepts.md#pairing-manage-nerves-and-recover-from-being-stuck"

  - id: take-home-pairing-and-code-review-rounds-036
    difficulty: beginner
    tags: [pairing, nerves, preparation]
    question: |
      Which reduces avoidable friction and nerves on the day of a live-coding round?
    options:
      - "Learning a brand-new programming language the night before the round"
      - "Skipping all practice beforehand in order to stay mentally 'fresh'"
      - "Practicing out-loud coding and pre-setting up your editor, language, and runtime"
      - "Disabling your linter and formatter so that nothing distracts you"
    answer: 2
    explanation: |
      Interviewers know nerves aren't inability, but preparation — practicing narration and
      having your environment ready — removes friction so composure is easier to show.
    ref: "concepts.md#pairing-manage-nerves-and-recover-from-being-stuck"

  - id: take-home-pairing-and-code-review-rounds-037
    difficulty: beginner
    tags: [code-review, prioritization]
    question: |
      In a code-review round, what is the reviewer primarily testing?
    options:
      - "Whether you can rewrite the entire pull request yourself from scratch"
      - "How many total review comments you are able to leave on the diff"
      - "Whether you know the language's official style guide by heart"
      - "Prioritization — whether you catch what actually matters, in the order that matters"
    answer: 3
    explanation: |
      The test is prioritization: juniors nitpick formatting, seniors find the race condition.
      Finding the highest-severity issues first is the signal.
    ref: "concepts.md#code-review-round-what-senior-reviewers-catch"

  - id: take-home-pairing-and-code-review-rounds-038
    difficulty: intermediate
    tags: [code-review, severity-order]
    question: |
      Which review-severity ordering reflects how a senior reviewer prioritizes?
    options:
      - "Correctness and edge cases, then security, then tests, then readability, with style nits last"
      - "Style nits first, then formatting, then naming conventions, then correctness"
      - "Tests first, then style and formatting, and only then correctness of the logic"
      - "Whatever line happens to appear first in the diff, working straight top to bottom"
    answer: 0
    explanation: |
      Review roughly in severity order: correctness and edge cases, security, concurrency,
      tests, readability, and style/nits last. Leading with nits is the classic junior tell.
    ref: "concepts.md#code-review-round-what-senior-reviewers-catch"

  - id: take-home-pairing-and-code-review-rounds-039
    difficulty: advanced
    tags: [code-review, correctness, anti-signal]
    question: |
      A PR has a planted correctness bug that breaks the feature and a couple of inconsistent
      variable names. A candidate flags only the naming. What does this signal?
    options:
      - "Meticulous attention to detail that is genuinely worthy of a senior engineer"
      - "A thorough and complete review that covers everything that matters"
      - "Junior-level prioritization — missing the correctness bug while nitpicking naming is the fastest way to read as junior"
      - "That the planted correctness bug must not actually be very important"
    answer: 2
    explanation: |
      Missing a planted correctness bug while flagging a naming nit is the fastest way to read
      as junior. The bug that breaks the feature is the highest-value catch.
    ref: "concepts.md#code-review-round-what-senior-reviewers-catch"

  - id: take-home-pairing-and-code-review-rounds-040
    difficulty: intermediate
    tags: [code-review, security]
    question: |
      Which of these belongs in the SECURITY tier of a senior code review?
    options:
      - "Inconsistent indentation across a few of the changed files"
      - "A query built by string-concatenating unvalidated user input (SQL injection)"
      - "A loop variable named x instead of a clearer name like index"
      - "A missing blank line separating two adjacent function definitions"
    answer: 1
    explanation: |
      SQL/command injection, unvalidated input, committed secrets, and missing authz are
      security-tier issues — high priority. The others are style nits, the lowest tier.
    ref: "concepts.md#code-review-round-what-senior-reviewers-catch"

  - id: take-home-pairing-and-code-review-rounds-041
    difficulty: advanced
    tags: [code-review, concurrency]
    question: |
      Reviewing a PR, you spot shared mutable state updated from multiple threads without
      synchronization. How should you classify this?
    options:
      - "A low-priority style preference that comes down to taste"
      - "Something that is genuinely out of scope for a code review"
      - "A minor nit to mention only if you happen to have spare time"
      - "A high-severity concurrency/correctness issue (race condition) worth flagging prominently"
    answer: 3
    explanation: |
      Race conditions and shared mutable state are high-severity concurrency issues that sit
      near the top of the review priority order — well above readability or style.
    ref: "concepts.md#code-review-round-what-senior-reviewers-catch"

  - id: take-home-pairing-and-code-review-rounds-042
    difficulty: intermediate
    tags: [code-review, triage, communication]
    question: |
      Even before finding a specific issue, what's a strong thing to do at the start of a
      code-review round?
    options:
      - "Silently start leaving comments on the very first line of the diff"
      - "Announce upfront that you would prefer to just rewrite the whole PR"
      - "Verbalize your triage order: correctness and edge cases, then security, tests, readability, nits last"
      - "Ask the interviewer whether you can simply skip this round"
    answer: 2
    explanation: |
      Stating your triage order up front signals that you know what matters, framing the whole
      review around severity rather than diff order.
    ref: "concepts.md#code-review-round-what-senior-reviewers-catch"

  - id: take-home-pairing-and-code-review-rounds-043
    difficulty: beginner
    tags: [code-review, feedback, tone]
    question: |
      Beyond finding problems, what else does the code-review round assess?
    options:
      - "How you communicate — feedback tone predicts how you'll behave on the team"
      - "How quickly you can read the diff and approve the pull request"
      - "How many different programming languages you happen to know"
      - "Whether you can memorize the team's entire coding style guide"
    answer: 0
    explanation: |
      Finding problems is half the round; how you phrase them is the other half. Harsh, vague,
      or dogmatic feedback predicts team friction regardless of how sharp your eye is.
    ref: "concepts.md#code-review-round-give-kind-specific-actionable-feedback"

  - id: take-home-pairing-and-code-review-rounds-044
    difficulty: intermediate
    tags: [code-review, feedback, specific]
    question: |
      Which review comment best demonstrates senior feedback craft?
    options:
      - "\"This whole section of code is sloppy, please just fix it.\""
      - "\"Line 42: this dereferences user before the null check on line 45 — it'll NPE when the lookup misses.\""
      - "\"You always over-complicate things like this in your code.\""
      - "\"I don't really like this, it doesn't feel right to me.\""
    answer: 1
    explanation: |
      Strong feedback is specific (points to the line), explains the concrete risk, and
      critiques the code, not the person. The others are vague, personal, or both.
    ref: "concepts.md#code-review-round-give-kind-specific-actionable-feedback"

  - id: take-home-pairing-and-code-review-rounds-045
    difficulty: intermediate
    tags: [code-review, blockers, nits]
    question: |
      Why is it valuable to label a review comment as a blocker versus a "nit"?
    options:
      - "It lets you leave a larger number of review comments overall"
      - "It makes the finished review look longer and more thorough"
      - "It distinguishes what must change before merge from optional polish, so the author can prioritize"
      - "It signals to the author that you couldn't find any real issues"
    answer: 2
    explanation: |
      Distinguishing blockers from nits (prefixing optional polish with "nit:") is a widely-used
      convention that helps the author prioritize and shows you understand review severity.
    ref: "concepts.md#code-review-round-give-kind-specific-actionable-feedback"

  - id: take-home-pairing-and-code-review-rounds-046
    difficulty: advanced
    tags: [code-review, failure-modes]
    question: |
      Which pair of behaviors are the two classic FAILURE modes of a code-review round?
    options:
      - "Asking clarifying questions and acknowledging the well-written code"
      - "Prioritizing correctness issues first and clearly labeling minor nits"
      - "Being specific about problems and offering concrete suggestions"
      - "The rubber-stamp that misses planted bugs, and the nitpick storm that buries a critical flaw under formatting comments"
    answer: 3
    explanation: |
      Rubber-stamping ("looks good") misses the planted bugs; a nitpick storm buries a real
      security or correctness flaw under twenty style comments. Both fail; prioritize ruthlessly.
    ref: "concepts.md#code-review-round-give-kind-specific-actionable-feedback"

  - id: take-home-pairing-and-code-review-rounds-047
    difficulty: intermediate
    tags: [code-review, questions, feedback]
    question: |
      You suspect an endpoint might be reachable without authentication, but you're unsure of
      the surrounding context. What's the best-phrased comment?
    options:
      - "\"This is completely insecure. Rejected until it's fixed.\""
      - "\"Is this endpoint reachable without auth? If so, we need a check here.\""
      - "\"Whoever wrote this clearly doesn't understand security at all.\""
      - "Say nothing at all about it, since you aren't fully certain"
    answer: 1
    explanation: |
      A question surfaces context you lack, is less confrontational, and still flags the risk.
      It beats an accusatory verdict and beats staying silent about a potential security hole.
    ref: "concepts.md#code-review-round-give-kind-specific-actionable-feedback"

  - id: take-home-pairing-and-code-review-rounds-048
    difficulty: intermediate
    tags: [code-review, acknowledge, tone]
    question: |
      Why do senior reviewers deliberately acknowledge good code, not just problems?
    options:
      - "It calibrates the feedback, builds trust, and models a healthy review culture"
      - "To pad out the length of the overall review with extra comments"
      - "Because every pull request must receive an equal amount of praise and criticism"
      - "To give yourself an excuse to avoid flagging any of the real issues"
    answer: 0
    explanation: |
      Noting a clean abstraction or good test isn't fluff — it calibrates your critical feedback
      and builds the trust that makes reviews collaborative rather than adversarial.
    ref: "concepts.md#code-review-round-give-kind-specific-actionable-feedback"

  - id: take-home-pairing-and-code-review-rounds-049
    difficulty: intermediate
    tags: [being-reviewed, ego, collaboration]
    question: |
      An interviewer pushes back hard on a decision in your take-home. What response best
      signals senior collaboration?
    options:
      - "Defend the decision at length regardless of the merit of their argument"
      - "Assume good intent, engage with the reasoning, and concede or discuss the trade-off with data"
      - "Immediately agree to every point they raise just to avoid any conflict"
      - "Point out that the reviewer simply misunderstood the genius of your design"
    answer: 1
    explanation: |
      Being reviewed graciously means treating feedback as about the code, engaging with the
      reasoning, conceding real issues, and discussing genuine trade-offs with data — not ego.
    ref: "concepts.md#being-reviewed-graciously"

  - id: take-home-pairing-and-code-review-rounds-050
    difficulty: advanced
    tags: [being-reviewed, correctness-vs-preference]
    question: |
      When your code is critiqued, how should you treat a correctness issue versus a style
      preference?
    options:
      - "Argue both of them equally hard to protect your original design"
      - "Defend the correctness issues, since you deliberately wrote it that way on purpose"
      - "Concede correctness issues immediately; discuss style/preference as trade-offs and defer to team conventions"
      - "Dismiss both the correctness issue and the style note as matters of taste"
    answer: 2
    explanation: |
      Separate preference from correctness: concede correctness issues right away, and treat
      style/preference as trade-offs, deferring to team conventions where they exist.
    ref: "concepts.md#being-reviewed-graciously"

  - id: take-home-pairing-and-code-review-rounds-051
    difficulty: intermediate
    tags: [being-reviewed, red-flag, defensiveness]
    question: |
      Which behavior when being reviewed is the clearest RED FLAG to a hiring manager?
    options:
      - "Saying 'good point, I hadn't considered that particular case'"
      - "Explaining your original reasoning and then changing your mind"
      - "Thanking the reviewer for helping to improve the code overall"
      - "Getting defensive and digging in to defend a clearly weaker choice by emotion or authority"
    answer: 3
    explanation: |
      Disagreeing badly — emotionally or by authority — and defending a clearly weaker choice is
      a red flag. Disagreeing well, with data, and knowing when to concede is the senior skill.
    ref: "concepts.md#being-reviewed-graciously"

  - id: take-home-pairing-and-code-review-rounds-052
    difficulty: beginner
    tags: [being-reviewed, mindset]
    question: |
      What single mindset underlies both reviewing well and being reviewed well?
    options:
      - "Separating ego from code and optimizing for the codebase and the relationship over winning"
      - "Being right as often as you possibly can in every exchange"
      - "Leaving or accepting as few review comments as you possibly can"
      - "Deferring entirely to whoever happens to hold the higher title"
    answer: 0
    explanation: |
      Reviewing and being reviewed are the same muscle: separate ego from code, prioritize what
      matters, and optimize for the codebase and relationship over being right — the core
      collaboration signal these rounds hunt for.
    ref: "concepts.md#being-reviewed-graciously"
