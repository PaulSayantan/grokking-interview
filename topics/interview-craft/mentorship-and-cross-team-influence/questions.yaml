topic: "Mentorship, Multiplier Impact & Cross-Team Influence"
domain: interview-craft
topic_slug: mentorship-and-cross-team-influence
version: 1
questions:
  - id: mentorship-and-cross-team-influence-001
    difficulty: beginner
    tags: [multiplier, fundamentals, leverage]
    question: |
      What is the core idea of the "multiplier effect" that interviewers listen for at
      senior/staff level?
    options:
      - "Being the single indispensable go-to expert that every teammate depends on directly in order to get their own day-to-day work done"
      - "Consistently shipping more code, more features, and more closed tickets than anyone else on your team does over the course of each sprint"
      - "Your impact is measured by how much you raise the output of the people and systems around you, not just your own output"
      - "Working consistently longer hours than your peers do so that you can personally step in and unblock the team whenever it stalls or gets stuck"
    answer: 2
    explanation: |
      The multiplier effect (Grove's "output = your org's output + orgs you influence")
      means your impact scales through others. Personal output and being the indispensable
      expert cap out at Senior and can even be anti-signals (bottleneck / single point of
      failure).
    ref: "concepts.md#the-multiplier-effect"

  - id: mentorship-and-cross-team-influence-002
    difficulty: intermediate
    tags: [multiplier, bottleneck, anti-signal]
    question: |
      In an interview, a candidate says: "I'm the go-to person on my team — everyone comes
      to me whenever they're stuck." What signal does this most likely send?
    options:
      - "A bottleneck / single-point-of-failure signal, which is the opposite of a multiplier"
      - "A strong multiplier signal, because personally helping many people scales your impact"
      - "A sponsorship signal, because being the expert others rely on advances their careers"
      - "A clear staff-level scope signal, since being everyone's first point of contact proves broad reach"
    answer: 0
    explanation: |
      Being the indispensable go-to person means bus-factor of one and doesn't scale — it's
      a bottleneck. The multiplier move is to remove yourself from the critical path (docs,
      runbooks, teaching, growing owners), making yourself unnecessary for what you built.
    ref: "concepts.md#the-multiplier-effect"

  - id: mentorship-and-cross-team-influence-003
    difficulty: intermediate
    tags: [multiplier, leverage, unblocking]
    question: |
      You keep getting pinged to unblock teammates on the same recurring issue. Which
      response demonstrates the highest leverage?
    options:
      - "Answer each ping as quickly as you can so that no teammate ever stays blocked waiting on you"
      - "Ask your manager to tell people to stop pinging you and route the questions elsewhere instead"
      - "Block off protected focus time on your calendar and ignore the pings until your own work is completely done"
      - "Convert the recurring fix into a durable artifact — a runbook, lint rule, or taught pattern — so people stop needing you"
    answer: 3
    explanation: |
      Direct unblocking is real but the lowest-leverage form because it doesn't compound.
      The multiplier move is turning a one-off unblock into something durable (doc, tooling,
      taught principle) that removes you from the loop permanently.
    ref: "concepts.md#the-multiplier-effect"

  - id: mentorship-and-cross-team-influence-004
    difficulty: beginner
    tags: [sponsorship, mentorship, definitions]
    question: |
      What is the key difference between mentorship and sponsorship?
    options:
      - "Mentorship is reserved for junior engineers, whereas sponsorship applies only between engineers at the same level"
      - "Mentorship gives advice; sponsorship spends your capital to create opportunity and visibility for someone"
      - "Mentorship is a paid, formally compensated arrangement, whereas sponsorship is always done on a purely voluntary basis"
      - "They are simply two different words describing the exact same career-support activity with no meaningful distinction"
    answer: 1
    explanation: |
      Mentorship advises (talks to the person); sponsorship amplifies (talks about the
      person, often when they're not in the room) and costs you political capital by putting
      your reputation behind them. Sponsorship helps people who have skill but lack
      opportunity.
    ref: "concepts.md#mentorship-vs-sponsorship"

  - id: mentorship-and-cross-team-influence-005
    difficulty: intermediate
    tags: [sponsorship, examples]
    question: |
      Which of the following is an act of SPONSORSHIP (not merely mentorship)?
    options:
      - "Reviewing someone's design doc in detail and suggesting concrete improvements to their approach"
      - "Meeting with them every week to give ongoing career advice and answer their questions"
      - "Recommending to your director that they lead the high-visibility project, and backing them"
      - "Answering their technical questions thoroughly in Slack whenever they reach out for help"
    answer: 2
    explanation: |
      Recommending someone for a visible leadership opportunity and vouching for them spends
      your capital and shapes their trajectory — that's sponsorship. The others are advice
      (mentorship). Sponsorship acts include nominating for talks, forwarding wins to wider
      audiences, and naming them in staffing/promotion discussions.
    ref: "concepts.md#mentorship-vs-sponsorship"

  - id: mentorship-and-cross-team-influence-006
    difficulty: advanced
    tags: [sponsorship, follow-up, phrasing]
    question: |
      Interviewer: "Did you mentor them or sponsor them — what did you actually do?" Which
      answer best demonstrates sponsorship?
    options:
      - "I mentored her a lot over the whole year and she gradually grew, with my guidance, into a genuinely great and capable engineer"
      - "I gave her detailed line-by-line feedback on every single one of her pull requests, consistently, for a solid six months straight"
      - "I made a real point of always being available to her whenever she had questions or needed to talk through a hard problem she was stuck on"
      - "I told our director she should lead the payments cutover and that I'd back her, then handed her the design review to run while I stayed quiet"
    answer: 3
    explanation: |
      The strong answer names a specific capital-spending act (recommending her to lead,
      vouching, handing over a visible forum). The others describe advice/availability —
      mentorship — which reads more junior and un-scoped when the question is about
      sponsorship.
    ref: "concepts.md#mentorship-vs-sponsorship"

  - id: mentorship-and-cross-team-influence-007
    difficulty: advanced
    tags: [sponsorship, bias, equity]
    question: |
      Why is the mentorship-vs-sponsorship distinction especially important for
      underrepresented engineers?
    options:
      - "They tend to be over-mentored (given advice) and under-sponsored (few people spend capital to advance them), when what they often lacked was opportunity, not skill"
      - "They inherently need substantially more advice, coaching, and hands-on guidance than other engineers do in order to eventually reach the same level of competence"
      - "Sponsorship is a formal legal and compliance requirement for underrepresented engineers specifically, whereas ordinary mentorship remains entirely optional and discretionary"
      - "They should only ever be mentored and never actually sponsored for anything, so as to carefully avoid creating any appearance of favoritism or unfair preferential treatment"
    answer: 0
    explanation: |
      A well-documented bias: underrepresented engineers get abundant advice but little
      sponsorship. The instinct to mentor can even imply they aren't good enough, when the
      real gap is opportunity and visibility — which sponsorship, not more advice, provides.
    ref: "concepts.md#mentorship-vs-sponsorship"

  - id: mentorship-and-cross-team-influence-008
    difficulty: intermediate
    tags: [code-review, teaching, mentorship]
    question: |
      What most distinguishes a senior-level code review from a junior one?
    options:
      - "It catches a larger number of defects overall and consistently leaves a noticeably higher volume of detailed comments on the pull request"
      - "It transfers judgment — explains the why/principle, separates blocking issues from preferences, and asks questions so the author reaches the answer"
      - "It approves changes considerably faster than a typical junior review would, specifically in order to keep the whole team unblocked and shipping quickly"
      - "It rewrites the author's code directly and thoroughly into the reviewer's own preferred style and conventions before finally approving the change"
    answer: 1
    explanation: |
      Review as teaching transfers judgment: explain the principle, label "nit" vs
      "blocking," ask guiding questions, and praise good decisions. Done well, you end up
      reviewing less over time because the author internalized the pattern — that's the
      multiplier.
    ref: "concepts.md#growing-engineers-onboarding-code-review-docs-talks"

  - id: mentorship-and-cross-team-influence-009
    difficulty: intermediate
    tags: [delegation, growing-engineers, deadline]
    question: |
      A hard task is due soon. You could do it fastest yourself. What is the
      multiplier-oriented choice, and why is it a strong seniority signal?
    options:
      - "Do it entirely yourself, since you're the fastest, to guarantee the tight deadline is hit"
      - "Split it into small trivial pieces so that no one on the team has to think hard about any part"
      - "Pair the stretch task with a growing engineer plus a safety net — slower now, but builds durable capacity"
      - "Assign it to the most senior person available so that execution risk is kept to an absolute minimum"
    answer: 2
    explanation: |
      Delegating something you could do faster yourself (with a safety net) is a classic
      multiplier move: it costs time now but builds team capacity forever. Grabbing every
      hard task yourself is the hero/bottleneck anti-pattern.
    ref: "concepts.md#growing-engineers-onboarding-code-review-docs-talks"

  - id: mentorship-and-cross-team-influence-010
    difficulty: beginner
    tags: [onboarding, leverage, docs]
    question: |
      Why is investing in a great onboarding doc/process considered high-leverage
      multiplier work?
    options:
      - "The improvement compounds across every future hire, cutting ramp time for many people, not just one"
      - "It impresses your manager during performance review as a visible, well-documented deliverable"
      - "It lets you avoid having to answer the same new-hire questions personally over and over again"
      - "It is generally the single fastest and most reliable way for an engineer to get promoted"
    answer: 0
    explanation: |
      Onboarding is write-once, benefit-many: cutting median ramp-to-first-PR helps every
      future hire and compounds with headcount. That reach is what makes it leverage rather
      than a one-off favor.
    ref: "concepts.md#growing-engineers-onboarding-code-review-docs-talks"

  - id: mentorship-and-cross-team-influence-011
    difficulty: intermediate
    tags: [docs, tech-talks, leverage]
    question: |
      You find yourself answering the same architectural question 1:1 several times a
      month. What is the highest-leverage response?
    options:
      - "Keep answering the question individually every single time it comes up so that each person always gets fully tailored, personalized, context-specific help from you"
      - "Tell people to just search back through past Slack messages and threads where you have already answered the exact same architectural question several times before"
      - "Escalate to your manager that people keep asking you the same recurring thing over and over, and ask them to step in and intervene on your behalf"
      - "Convert the recurring answer into a durable artifact — a design doc, FAQ, or recorded brown-bag — that teaches many without you"
    answer: 3
    explanation: |
      Docs and talks are write-once, teach-many leverage. Spotting a recurring 1:1 question
      and converting it into a durable artifact is a signature staff move — it keeps
      teaching after you've moved on.
    ref: "concepts.md#growing-engineers-onboarding-code-review-docs-talks"

  - id: mentorship-and-cross-team-influence-012
    difficulty: beginner
    tags: [influence-without-authority, fundamentals]
    question: |
      "Influence without authority" primarily means:
    options:
      - "Getting your own manager to formally mandate, through the reporting chain, that all of the other teams have to follow the approach that you happen to prefer"
      - "Getting teams and leaders who don't report to you to adopt your approach through trust, data, relationships, and writing"
      - "Having the most senior title in the room so that everyone else present defers to your opinion by default whenever a decision comes up"
      - "Being assigned formal ownership of other teams' roadmaps so that you can directly set and reprioritize the work that they take on"
    answer: 1
    explanation: |
      Staff impact happens at scopes where you have no authority, so "I'd tell them to do
      it" fails. Influence comes from banked trust, compelling writing, data/shipped proof,
      and meeting people in their own incentives — not mandate.
    ref: "concepts.md#influence-without-authority"

  - id: mentorship-and-cross-team-influence-013
    difficulty: advanced
    tags: [influence-without-authority, escalation, anti-signal]
    question: |
      Interviewer: "How did you get another team to adopt your approach when they resisted?"
      Which answer is the weakest signal?
    options:
      - "I got my manager to escalate to their manager so they'd be told to do it"
      - "I wrote up the problem with data and prototyped the fix, then piloted it with the team most in pain"
      - "I found the shared goal, framed the change around their on-call pain, and built a coalition"
      - "I pre-socialized the proposal 1:1 and addressed objections before the big meeting"
    answer: 0
    explanation: |
      Escalation-first signals you can't move people without a hammer and burns the
      relationship you'll need later. It's a legitimate last resort, but leading with it is
      the classic weak answer. The others are genuine influence-without-authority tactics.
    ref: "concepts.md#influence-without-authority"

  - id: mentorship-and-cross-team-influence-014
    difficulty: intermediate
    tags: [influence-without-authority, trust]
    question: |
      A colleague describes influence as a "bank account." What's the practical implication
      for getting a cross-team favor?
    options:
      - "You can freely withdraw influence at any time that you like, entirely regardless of how you have actually behaved toward that team in the past"
      - "Influence is effectively unlimited and never runs out, as long as you happen to hold a sufficiently senior title somewhere on the org chart"
      - "You can only spend the trust you've already deposited, so build the relationship (deliver, help, give credit) before you need it"
      - "The best overall strategy is to carefully save up all of your favors over time and then cash them all in together for one single big ask"
    answer: 2
    explanation: |
      Trust is banked through reliable delivery, unprompted help, and giving credit. You can
      only spend what you've deposited, so the relationship must exist before the favor — you
      can't cold-ask a team you've never helped and expect a yes.
    ref: "concepts.md#influence-without-authority"

  - id: mentorship-and-cross-team-influence-015
    difficulty: advanced
    tags: [influence-without-authority, evidence, pilot]
    question: |
      Two teams disagree on whether to adopt your new shared library. Beyond a well-written
      RFC, what most reliably converts skeptics?
    options:
      - "A longer version of the document that adds even more technical detail and justification"
      - "A company-wide email from leadership formally announcing that the decision has been made"
      - "A vote across both teams in which whichever team has the majority of people simply wins"
      - "A working pilot on one willing team that produces real adoption/reliability data — show, don't mandate"
    answer: 3
    explanation: |
      Adoption follows evidence, not slides. A pilot on one team that yields real data
      ("their incidents dropped") is the strongest proof and gives you social proof to pull
      the rest. Show, don't tell.
    ref: "concepts.md#influence-without-authority"

  - id: mentorship-and-cross-team-influence-016
    difficulty: intermediate
    tags: [influence-without-authority, framing, incentives]
    question: |
      When persuading another team to take on migration work, which framing works best?
    options:
      - "Explain to them in detail exactly how much this migration work is going to help your own team's roadmap, goals, and delivery timeline this quarter"
      - "Frame the ask in their goals/incentives — e.g., 'this cuts your on-call load' — and understand what they're measured on"
      - "Emphasize repeatedly that senior leadership specifically wants this done and is expecting the whole migration to be completed fairly soon"
      - "Point out to them that adopting it is simply the technically correct and objectively right thing to do from a pure engineering standpoint"
    answer: 1
    explanation: |
      Meeting people where they are — framing the change in their incentives and what they're
      measured on — is core to influence without authority. "It helps my roadmap" or "it's
      technically correct" ignores their motivation.
    ref: "concepts.md#influence-without-authority"

  - id: mentorship-and-cross-team-influence-017
    difficulty: advanced
    tags: [influence-without-authority, coalition, meetings]
    question: |
      Why do experienced staff engineers pre-socialize a proposal 1:1 before presenting it
      in a large cross-team meeting?
    options:
      - "To avoid ever having to hold the large cross-team meeting at all, since aligning everyone one-on-one beforehand makes the group session entirely unnecessary and redundant"
      - "Because large meetings are fundamentally a waste of everyone's time, and a series of quick one-on-one conversations is always strictly more efficient than gathering people together"
      - "Because asking people to change their mind publicly is hard; addressing objections privately first and lining up a coalition makes the meeting a confirmation, not a fight"
      - "To make sure that only their own allies and supporters end up getting invited into the room, so that any potential opponents never get a real chance to voice objections"
    answer: 2
    explanation: |
      People rarely reverse positions in public. Pre-socializing surfaces objections you can
      address privately and lines up a supportive coalition, so the meeting ratifies
      alignment rather than becoming a debate you might lose.
    ref: "concepts.md#influence-without-authority"

  - id: mentorship-and-cross-team-influence-018
    difficulty: intermediate
    tags: [standards, adoption, golden-path]
    question: |
      You want your team's good practice to become the org-wide standard. What is usually
      the HARDEST part?
    options:
      - "Adoption — a perfect standard nobody follows is zero leverage"
      - "Writing the standard document itself and getting the technical details exactly right"
      - "Getting your own manager's formal approval and sign-off before you publish it"
      - "Choosing the right formatting and structure for the standard document you publish"
    answer: 0
    explanation: |
      The standard is the easy part; adoption is the hard part. The lever is making the
      right way the easy way (a paved road/golden path) and enforcing with tooling, so
      compliance is less work than deviating.
    ref: "concepts.md#driving-org-wide-standards--adoption"

  - id: mentorship-and-cross-team-influence-019
    difficulty: advanced
    tags: [standards, tooling, enforcement]
    question: |
      Which approach best drives durable adoption of a new engineering standard across many
      teams?
    options:
      - "Publish a detailed policy document and remind people in code review comments to follow it"
      - "Mandate it in a company-wide all-hands and set a single hard cutover date for every team at once"
      - "Ask each individual team lead to manually police adherence to the standard within their own team"
      - "Ship a paved-path library/template and enforce with CI checks and defaults, so the right way is the easy way"
    answer: 3
    explanation: |
      Golden paths plus tooling enforcement (linters, CI, defaults) scale; policy docs and
      code-review policing don't and breed resentment. Big-bang mandates usually stall
      without a paved path and migration support.
    ref: "concepts.md#driving-org-wide-standards--adoption"

  - id: mentorship-and-cross-team-influence-020
    difficulty: advanced
    tags: [standards, migration, scope-signal]
    question: |
      A candidate says: "I published a coding standard and told teams to follow it for all
      new code." What's missing for this to be a strong staff-level adoption story?
    options:
      - "Nothing at all is missing — simply publishing a clear, well-written standard and telling every team to follow it is entirely sufficient on its own"
      - "A longer and much more detailed version of the standard document that carefully covers even more edge cases, scenarios, and exceptions"
      - "A pilot, tooling enforcement, and a credible migration path (codemod + deadline) for existing code, plus measured adoption"
      - "Formal approval and an explicit public endorsement from more senior leaders sitting higher up the organizational chart than the candidate"
    answer: 2
    explanation: |
      "New code only" leaves a two-world mess and no proof of adoption. Strong stories pilot
      first, enforce with tooling, provide a migration path for existing code, and cite
      measured adoption (e.g., 0→90% in a quarter) — that's leverage, judgment, and influence.
    ref: "concepts.md#driving-org-wide-standards--adoption"

  - id: mentorship-and-cross-team-influence-021
    difficulty: beginner
    tags: [standards, pain, motivation]
    question: |
      What is the most persuasive basis for introducing a new org-wide standard?
    options:
      - "Real, documented pain — e.g., '3 incidents from inconsistent retry logic'"
      - "Personal style preference and how you individually like to see the code written"
      - "The fact that it's what a famous, well-known tech company is reported to do"
      - "The argument that it will make the codebase look cleaner and more consistent overall"
    answer: 0
    explanation: |
      Standards rooted in demonstrated pain (incidents, cost, toil) land; aesthetic or
      appeal-to-authority arguments don't. Data-backed pain gives teams a reason to change
      that maps to their own outcomes.
    ref: "concepts.md#driving-org-wide-standards--adoption"

  - id: mentorship-and-cross-team-influence-022
    difficulty: intermediate
    tags: [disagree-and-commit, amazon-lp, definitions]
    question: |
      "Have Backbone; Disagree and Commit" has two halves people often forget. What are
      they?
    options:
      - "Keep arguing your own position relentlessly until you eventually win the debate, then carefully document afterward exactly why you had been right all along"
      - "Respectfully challenge decisions you disagree with BEFORE the decision, then commit fully once it's made even if it wasn't your call"
      - "Stay completely quiet during the whole discussion to preserve team harmony, then afterward simply follow along with whatever orders happen to come down"
      - "Escalate any and every disagreement straight up the chain to senior leadership, then just wait patiently for them to hand down an official binding ruling"
    answer: 1
    explanation: |
      Backbone = voice a data-backed objection before the decision, even when uncomfortable.
      Commit = once decided, support it wholly (no undermining, no "told you so"), even if you
      argued the other way. Missing either half is the failure mode.
    ref: "concepts.md#navigating-cross-team-disagreement-disagree--commit"

  - id: mentorship-and-cross-team-influence-023
    difficulty: advanced
    tags: [disagree-and-commit, behavioral, strong-answer]
    question: |
      "Tell me about a time you disagreed with a decision but had to go along with it."
      Which answer is strongest?
    options:
      - "I disagreed with the call but just went along with it quietly the whole time, because I wanted to avoid creating any conflict or friction with the team that had made the decision"
      - "I knew for certain that I was right about it, so I kept pushing my case again and again in every forum until they eventually gave in and reconsidered the decision the way I wanted"
      - "I raised a data-backed objection before the call; the owner decided otherwise, and I then committed genuinely, helped it succeed, and learned my read had been incomplete"
      - "I went along with the decision as asked, but I made a point of quietly letting everyone know afterward that I had accurately predicted all of the problems that ended up happening"
    answer: 2
    explanation: |
      The strong answer shows both halves: backbone (objected with data before the decision)
      and commit (backed it wholly and helped it succeed). "Just went along" lacks backbone;
      "kept pushing" or "told you so" lacks commit. Never frame it as steamrolling a peer.
    ref: "concepts.md#navigating-cross-team-disagreement-disagree--commit"

  - id: mentorship-and-cross-team-influence-024
    difficulty: intermediate
    tags: [disagree-and-commit, understand-first]
    question: |
      Two teams are "disagreeing" about an approach. What should a staff engineer do first?
    options:
      - "Analyze both options purely on their technical merits, pick whichever one is objectively superior, and then push hard for the team to adopt that approach without much further discussion"
      - "Escalate the disagreement straight up to a VP so that they can step in with their authority and simply break the tie between the two teams however they see fit and move things forward"
      - "Propose a middle-ground compromise that roughly splits the difference between the two positions, so that each side gives up part of what it wanted and everyone can move on quickly"
      - "Seek to understand — restate the other side's position until they agree you've got it, since much disagreement is different context, not different values"
    answer: 3
    explanation: |
      Much cross-team "disagreement" dissolves once you surface the different constraints/
      context each side carries. Restating their position first depersonalizes it and often
      reveals a shared goal at the "why" level even when the "how" differs.
    ref: "concepts.md#navigating-cross-team-disagreement-disagree--commit"

  - id: mentorship-and-cross-team-influence-025
    difficulty: advanced
    tags: [disagree-and-commit, trust, commit-visibly]
    question: |
      A cross-team decision goes against your recommendation. Which action best builds your
      long-term influence?
    options:
      - "Quietly deprioritize the work so that it fails and thereby ends up proving your original point"
      - "Publicly back the decision and actively help make it succeed"
      - "Tell your own team that you disagreed with it so they clearly know it wasn't your idea"
      - "Wait for the decision to fail on its own, then propose your original plan again afterward"
    answer: 1
    explanation: |
      Committing visibly — backing the decision and helping it succeed — deposits trust for
      next time. Undermining, distancing, or waiting for failure destroys the relationship
      capital that staff influence depends on.
    ref: "concepts.md#navigating-cross-team-disagreement-disagree--commit"

  - id: mentorship-and-cross-team-influence-026
    difficulty: beginner
    tags: [glue-work, definitions]
    question: |
      In Tanya Reilly's "Being Glue," what is "glue work"?
    options:
      - "The essential non-coding work that holds projects together — onboarding, design review, unblocking, cross-team coordination, keeping everyone aligned"
      - "Writing the most complex, technically challenging, and architecturally difficult code that exists anywhere on the entire team's codebase"
      - "Only the specific, well-defined pieces of work that have been directly and explicitly assigned to you by your manager during planning"
      - "Refactoring the old, poorly documented legacy code that nobody else on the team is willing to touch or take ownership of anymore"
    answer: 0
    explanation: |
      Glue work is the coordination/leadership work that often decides whether a project
      ships. Reilly frames it as real technical leadership that is frequently invisible and
      undervalued by promotion processes.
    ref: "concepts.md#glue-work--the-recognition-problem"

  - id: mentorship-and-cross-team-influence-027
    difficulty: advanced
    tags: [glue-work, recognition, career-risk]
    question: |
      What is the "recognition problem" with glue work, and the nuanced correct response?
    options:
      - "Glue work is fundamentally worthless and never valued in promotion cases, so the correct move is to firmly refuse to do any of it at all and focus only on shipping code"
      - "Glue work reliably leads to a promotion every time, so the smart strategy is to simply take on as much of it as you possibly can and let the rest of your technical work slide"
      - "It's real leadership but often labeled 'not technical enough' and can be career-limiting if you do only it — so make it visible, get the title/mandate, and balance it with promotable technical work"
      - "Only engineering managers should ever be responsible for doing any of the glue work on a team, and individual contributors should decline it and redirect it to their manager"
    answer: 2
    explanation: |
      Glue work is high-leverage AND a career risk. The resolution isn't refusing it; it's
      making it visible via artifacts, getting a tech-lead title/mandate, and balancing it
      with unambiguously technical work so you don't become "the coordinator who doesn't code."
    ref: "concepts.md#glue-work--the-recognition-problem"

  - id: mentorship-and-cross-team-influence-028
    difficulty: advanced
    tags: [glue-work, visibility, artifacts]
    question: |
      You've been doing a lot of invisible cross-team coordination that's keeping a launch on
      track. Which response best both delivers AND gets it recognized?
    options:
      - "Keep quietly doing all of the cross-team coordination behind the scenes, trusting that good work ultimately speaks for itself and will be noticed by the right people in the end"
      - "Deliberately stop doing the coordination entirely for a while so that people clearly notice its sudden absence and finally come to appreciate how much value it was quietly adding"
      - "Go to your manager directly and tell them that you firmly believe you have earned and deserve a promotion on the strength of all of this invisible coordination work you've been doing"
      - "Make it explicit: write the launch-tracking doc, get named tech lead, and ensure the retrospective credits the coordination as why the project shipped"
    answer: 3
    explanation: |
      Turning invisible glue into artifacts, getting the tech-lead mandate, and framing the
      retrospective to credit coordination as the reason for success both delivers the work
      and gets it recognized — the self-awareness to do this is itself a staff skill.
    ref: "concepts.md#glue-work--the-recognition-problem"

  - id: mentorship-and-cross-team-influence-029
    difficulty: intermediate
    tags: [glue-work, balance, skill-growth]
    question: |
      Reilly warns: "If you only do glue, you will only get better at glue." What's the
      practical takeaway for a career-conscious engineer?
    options:
      - "Refuse to ever do any glue work at all, under any circumstances whatsoever, at any point across the entire span of your engineering career"
      - "Balance the portfolio — pair glue work with unambiguously technical, promotable work so your core skills keep growing"
      - "Do glue work exclusively and constantly, all of the time, so that over time you become completely and utterly indispensable to the team"
      - "Deliberately wait until you have already reached the staff level in your career before you agree to take on any of the glue work at all"
    answer: 1
    explanation: |
      You get better at what you spend time on. Doing only glue lets core technical skills
      atrophy and risks the "not technical enough" label. The move is a balanced portfolio,
      not abstinence from glue.
    ref: "concepts.md#glue-work--the-recognition-problem"

  - id: mentorship-and-cross-team-influence-030
    difficulty: intermediate
    tags: [glue-work, distribution, fairness]
    question: |
      As a tech lead, you notice one engineer keeps volunteering for all the non-promotable
      glue tasks. What's the best leadership response?
    options:
      - "Track and rotate the glue work deliberately so it isn't silently absorbed by whoever volunteers"
      - "Let them just keep doing it, since after all someone on the team has to do this work"
      - "Reassign all of the glue tasks to the most junior person available on the team instead"
      - "Stop tracking the glue work altogether so as to avoid turning it into a big deal"
    answer: 0
    explanation: |
      Glue work is distributed unfairly (studies show some groups are asked and volunteer far
      more). A good leader makes non-promotable work explicit, tracks it, and rotates it so
      it doesn't quietly stall one person's career.
    ref: "concepts.md#glue-work--the-recognition-problem"

  - id: mentorship-and-cross-team-influence-031
    difficulty: intermediate
    tags: [junior-mistake, blameless, ownership]
    question: |
      A junior engineer pushed a change that took down production. Which response best
      demonstrates senior-level leadership?
    options:
      - "Report the incident to their manager right away so that it's formally documented on the record, and let the manager decide what performance consequences the engineer should face for it"
      - "Fix the broken production problem yourself as quickly as you possibly can, and then tell the junior engineer firmly and directly that they must never make a mistake like that ever again"
      - "Roll back together, run a blameless review of why such a change reached prod without a guardrail, add the missing CI gate, and give feedback privately — with them leading the fix"
      - "Point out clearly in the shared team channel exactly who it was that caused the production outage, so that everyone on the team can see what happened and learn from the incident together"
    answer: 2
    explanation: |
      Strong = protect the person (blameless, private feedback), fix the system (the missing
      guardrail lets any junior make this mistake), and grow them (they lead the fix, owning
      the learning). Blaming, scapegoating, or taking over the recovery are anti-signals.
    ref: "concepts.md#handling-a-junior-making-a-mistake"

  - id: mentorship-and-cross-team-influence-032
    difficulty: advanced
    tags: [junior-mistake, system-thinking, multiplier]
    question: |
      Why does a senior engineer treat a junior's prod-breaking mistake primarily as a
      SYSTEM failure?
    options:
      - "To avoid having to have an awkward, uncomfortable, and potentially confidence-damaging one-on-one conversation with the junior engineer about the serious mistake that they made"
      - "Because if a bad change could reach prod without a test/review/guardrail, the system failed — and fixing the guardrail prevents the NEXT person's mistake too (that's the multiplier)"
      - "Because junior engineers are never genuinely responsible for the code that they write and ship, so the accountability for any failure has to land somewhere else entirely by default"
      - "To deliberately shift the blame for the outage away from the individual engineer and onto the central tooling and infrastructure team who owned the deployment pipeline instead"
    answer: 1
    explanation: |
      A single mistake exposes a missing safeguard. Fixing the guardrail (CI check, required
      review, staged rollout) turns one incident into an org-wide protection — leverage. It
      isn't about excusing the person; it's about not relying on humans never erring.
    ref: "concepts.md#handling-a-junior-making-a-mistake"

  - id: mentorship-and-cross-team-influence-033
    difficulty: intermediate
    tags: [junior-mistake, feedback, coaching]
    question: |
      How should feedback about a junior's mistake be delivered?
    options:
      - "Publicly and directly in front of the whole assembled team, so that every single person present can learn from the junior engineer's mistake together"
      - "Only within the formal written postmortem document afterward, rather than through any kind of direct face-to-face conversation with the engineer themselves"
      - "Routed indirectly through their own manager rather than delivered directly by you, in order to keep the entire feedback process appropriately formal and documented"
      - "Privately and specifically, while preserving their confidence to keep taking risks — coach privately, credit publicly"
    answer: 3
    explanation: |
      Coach privately, credit publicly. Public criticism erodes confidence and risk-taking;
      specific private feedback grows the person. If you were the reviewer/lead, owning your
      share of the miss is a maturity signal.
    ref: "concepts.md#handling-a-junior-making-a-mistake"

  - id: mentorship-and-cross-team-influence-034
    difficulty: advanced
    tags: [junior-mistake, mentor-ownership]
    question: |
      You were the reviewer who approved the junior's flawed change. In telling this story,
      what maturity signal should you include?
    options:
      - "Owning your share — as the reviewer/lead, part of the miss was yours — which reads as maturity, not weakness"
      - "That the junior engineer alone was fully responsible for it, since they were the one who wrote the code"
      - "That you definitely would have caught the problem in review if you hadn't been so busy at the time"
      - "That code review is really just a formality anyway and can't be expected to catch everything"
    answer: 0
    explanation: |
      Acknowledging that, as the approving reviewer, part of the mistake is yours signals
      ownership and maturity. Deflecting all blame onto the junior or making excuses reads as
      the opposite of accountability.
    ref: "concepts.md#handling-a-junior-making-a-mistake"

  - id: mentorship-and-cross-team-influence-035
    difficulty: intermediate
    tags: [measuring-impact, outcome-vs-effort]
    question: |
      Which is an OUTCOME/leverage metric for mentorship rather than an effort/vanity metric?
    options:
      - "I mentored a total of five different engineers over the course of the year"
      - "I spent roughly ten hours every single week helping people across the team"
      - "Three of them now own services independently and I sponsored two promotions"
      - "I made sure to attend every one of my mentees' daily stand-up meetings"
    answer: 2
    explanation: |
      Outcome metrics describe the mentees' results and independence (they own services,
      they got promoted). "Mentored five," "spent ten hours," and "attended stand-ups" are
      effort/vanity metrics — activity, not impact.
    ref: "concepts.md#measuring-mentorship--multiplier-impact"

  - id: mentorship-and-cross-team-influence-036
    difficulty: advanced
    tags: [measuring-impact, platform, translation]
    question: |
      "How do you measure the impact of platform/infra work that doesn't map to revenue?"
      What's the strongest approach?
    options:
      - "Count up the total number of lines of code that were written along with the raw number of services and libraries that were shipped on the platform overall"
      - "Simply say that platform and infrastructure work is inherently invisible and cannot be meaningfully measured or quantified in any credible way at all"
      - "Report how many planning sessions, design reviews, and cross-team meetings you personally attended over the course of building out the platform work"
      - "Translate to money, time, or risk — engineering-hours saved (× loaded cost), incidents/on-call avoided, or revenue the work enabled — with honest baseline→after magnitude"
    answer: 3
    explanation: |
      Platform impact translates into money, time, or risk: hours saved, incidents avoided,
      or revenue enabled. Baseline→after with honest magnitude and population beats false
      precision, and beats un-measurable claims or raw output counts.
    ref: "concepts.md#measuring-mentorship--multiplier-impact"

  - id: mentorship-and-cross-team-influence-037
    difficulty: intermediate
    tags: [measuring-impact, credibility, false-precision]
    question: |
      Which impact statement is most credible in an interview?
    options:
      - "I improved the overall productivity of my team by exactly 23.4 percent last year"
      - "I roughly halved new-service setup time — from about two weeks to about a day — for around 30 engineers"
      - "I made basically everyone on the team way more productive than they had been before"
      - "I was, by a clear margin, the single most impactful engineer on the entire platform team"
    answer: 1
    explanation: |
      Honest magnitude with a stated population ("roughly halved... for ~30 engineers") is
      credible. Suspiciously precise single numbers, vague superlatives, and
      self-declarations of being "most impactful" undercut trust.
    ref: "concepts.md#measuring-mentorship--multiplier-impact"

  - id: mentorship-and-cross-team-influence-038
    difficulty: advanced
    tags: [measuring-impact, multiplier-tell]
    question: |
      What's the tell that a candidate's metrics describe a genuine force-multiplier rather
      than a strong individual contributor?
    options:
      - "The metrics are about other people's output (their ramp time, throughput, promotions) or the system's health (fewer incidents)"
      - "Every single metric that they choose to cite is fundamentally about how much the candidate personally shipped, wrote, and built on their own"
      - "The metrics they present consistently use the largest and most impressive-sounding numbers possible in order to make their individual impact seem bigger"
      - "The metrics they cite all tie directly, cleanly, and unambiguously back to the company's top-line revenue and profit figures for the year"
    answer: 0
    explanation: |
      A multiplier's metrics center on others' output and system health, not personal
      activity. If every number is "how much I did," it describes a strong IC — the unit of
      impact hasn't shifted to the team/org.
    ref: "concepts.md#measuring-mentorship--multiplier-impact"

  - id: mentorship-and-cross-team-influence-039
    difficulty: beginner
    tags: [senior-vs-staff, unit-of-impact]
    question: |
      What most fundamentally separates a great Senior IC from a force-multiplier Staff+
      engineer?
    options:
      - "Staff engineers simply write more code and produce more of it than senior engineers do"
      - "Staff engineers stop writing code entirely and transition into a purely people-management role"
      - "The unit of impact shifts from their own output to the output of the people and systems around them"
      - "Staff engineers have a larger number of direct reports on the org chart than senior engineers"
    answer: 2
    explanation: |
      It's a change in the unit of impact: Senior optimizes their own output; Staff optimizes
      everyone's. Staff is not "manager" (no reports) and not "Senior who codes more" — it's a
      different optimization target.
    ref: "concepts.md#great-senior-ic-vs-force-multiplier-staff"

  - id: mentorship-and-cross-team-influence-040
    difficulty: intermediate
    tags: [senior-vs-staff, problem-solving]
    question: |
      A Senior solves the problem in front of them. What does the force-multiplier version
      look like?
    options:
      - "Solve the very same problem, just faster and more efficiently than anyone else on the team could"
      - "Solve the problem and then carefully document the fact that they were the one who solved it"
      - "Solve the problem and then immediately move straight on to the next ticket in the queue"
      - "Solve the class of problem so it doesn't recur, and often make others able to solve it too"
    answer: 3
    explanation: |
      The multiplier attacks the class of problem (so it stops recurring) and enables others
      to solve similar problems — leverage that outlives their involvement. Just solving
      faster is still individual output.
    ref: "concepts.md#great-senior-ic-vs-force-multiplier-staff"

  - id: mentorship-and-cross-team-influence-041
    difficulty: advanced
    tags: [senior-vs-staff, reframe, storytelling]
    question: |
      For any accomplishment, what second clause turns a Senior-level answer into a
      Staff-level one?
    options:
      - "...and I left the team able to build the next one without me — here's who grew and what compounds"
      - "...and it turned out to be by far the hardest and most complex thing I have ever built"
      - "...and I managed to deliver the whole thing considerably faster than we had originally estimated"
      - "...and I did it entirely on my own without needing help or input from anyone else on the team"
    answer: 0
    explanation: |
      Staff answers add the leverage/compounding clause: the team can now do X-class work
      without you, and named people grew. "It was hard" or "I did it alone" keep the story at
      Senior (or worse, signal a bottleneck).
    ref: "concepts.md#great-senior-ic-vs-force-multiplier-staff"

  - id: mentorship-and-cross-team-influence-042
    difficulty: intermediate
    tags: [senior-vs-staff, credit]
    question: |
      How does a force-multiplier typically handle credit for a multi-team win?
    options:
      - "Takes sole credit for the entire win in order to clearly demonstrate their own individual impact"
      - "Distributes credit and is measured by the team's win, while still making clear what they personally drove"
      - "Avoids mentioning the project or the win at all in order to come across as humble and modest"
      - "Credits only their own manager for the win and leaves out the contributions of everyone else"
    answer: 1
    explanation: |
      Multipliers distribute credit and are judged by the team's outcome, while still being
      able to articulate what they personally drove. Taking sole credit for a multi-team win
      is the opposite of a multiplier signal.
    ref: "concepts.md#great-senior-ic-vs-force-multiplier-staff"

  - id: mentorship-and-cross-team-influence-043
    difficulty: advanced
    tags: [storytelling, leverage, weak-vs-strong]
    question: |
      Two candidates describe fixing a flaky shared HTTP client. Which is the stronger
      (staff-level) story?
    options:
      - "I rewrote the shared HTTP client from scratch with proper retries, sensible timeouts, and exponential backoff with jitter, and it completely fixed our own team's recurring production outages within a single sprint, so our on-call pages for that service dropped noticeably right away"
      - "I sent out a broad message telling everyone across the whole org to immediately stop using the old flaky HTTP client, and to go ahead and switch over instead to whatever more reliable alternative library each of their teams happened to prefer or already had experience with"
      - "I wrote an RFC with incident data, piloted a fixed client with the team most in pain, used that proof to build a coalition, added a CI check and codemod; six teams migrated in a quarter, cross-service retry incidents went to ~zero, and two engineers led their teams' migrations — I sponsored one onto the platform team"
      - "I escalated the flaky shared client problem all the way up to senior leadership, laid out the pattern of incidents for them, and they then stepped in and formally mandated across the whole org that every single team was required to fix it by a hard deadline"
    answer: 2
    explanation: |
      The strong story shows scope (org-wide), influence (RFC/pilot/coalition, no mandate),
      leverage (six teams + grew two people + sponsorship), and evidence (incident data). The
      first is a solid Senior story (one team, no leverage); the others are weak/anti-signals.
    ref: "concepts.md#behavioral-stories-that-show-leverage"

  - id: mentorship-and-cross-team-influence-044
    difficulty: intermediate
    tags: [storytelling, pronouns, credit]
    question: |
      In a behavioral story about a multi-team project, why is pure "we did everything"
      language a problem?
    options:
      - "It ends up sounding far too collaborative and team-oriented for a senior candidate"
      - "It simply takes too long to say and wastes valuable time in the behavioral interview"
      - "It is grammatically incorrect to describe your own accomplishments using the word 'we'"
      - "The interviewer can't tell what YOU personally did, so you get no credit for the leverage you created"
    answer: 3
    explanation: |
      "We with no I" hides your contribution — you get no credit for leverage. But the
      opposite ("I with no we," taking sole credit for a team win) reads as anti-multiplier.
      The staff register is "I drove/aligned/enabled, and here's how the team won."
    ref: "concepts.md#behavioral-stories-that-show-leverage"

  - id: mentorship-and-cross-team-influence-045
    difficulty: advanced
    tags: [storytelling, result, compounding]
    question: |
      What's the single most important upgrade to the Result section of a story to signal
      multiplier impact?
    options:
      - "Name the gains to OTHER people and the system — who/what got better beyond you — and note what compounds without your involvement"
      - "Clearly report the specific delivery deadline that you personally managed to hit on the project in the end"
      - "List out in full every one of the technologies, frameworks, and tools that you personally used on the project"
      - "Explain in careful detail exactly how hard, complex, and technically challenging the underlying problem really was"
    answer: 0
    explanation: |
      Multiplier Results end not at "we shipped" but at "here's who/what got better beyond me
      and what keeps compounding without me." That leverage clause is what distinguishes a
      staff Result from a Senior one.
    ref: "concepts.md#behavioral-stories-that-show-leverage"

  - id: mentorship-and-cross-team-influence-046
    difficulty: beginner
    tags: [multiplier, grove, leverage]
    question: |
      Andy Grove's leverage principle from "High Output Management" — which Staff+ ICs
      inherit without the reporting line — states that your effective output equals:
    options:
      - "The total number of hours that you personally put in and work each week"
      - "Your own work PLUS the leverage you add to everyone else's output"
      - "The total number of separate projects that you personally lead and own end to end"
      - "Your own raw code output minus the number of bugs that you personally introduced"
    answer: 1
    explanation: |
      Grove: managerial output = the output of your org + the output of orgs you influence.
      Staff ICs inherit the same math without authority — your impact is your work plus the
      leverage you add to others, which is why "I shipped a lot" caps at Senior.
    ref: "concepts.md#the-multiplier-effect"

  - id: mentorship-and-cross-team-influence-047
    difficulty: advanced
    tags: [influence-without-authority, boundary, cross-reference]
    question: |
      An interviewer asks you to drive a live whiteboard system design. Within THIS topic's
      scope, what should you rely on?
    options:
      - "This topic's own behavioral and influence frameworks, since those effectively double as the technical design method that you will need at the whiteboard"
      - "Nothing in particular beyond soft skills — behavioral, communication, and influence abilities fully and completely cover the technical system-design rounds on their own"
      - "Only back-of-the-envelope estimation numbers and the rough capacity and throughput math that those quick calculations let you work out on the spot"
      - "The dedicated technical system-design interview method (system-design/interview-method-scenario-playbooks); this topic owns the behavioral/influence craft, not the whiteboard method"
    answer: 3
    explanation: |
      This domain owns behavioral, communication, and influence craft. The technical
      system-design interview method (driving a whiteboard design) lives in
      system-design/interview-method-scenario-playbooks — point there rather than re-teaching it.
    ref: "concepts.md#influence-without-authority"

  - id: mentorship-and-cross-team-influence-048
    difficulty: intermediate
    tags: [sponsorship, cost, capital]
    question: |
      What makes sponsorship costlier and scarcer than mentorship?
    options:
      - "It requires significantly more of your calendar time and far more standing scheduled meetings than ordinary mentorship typically ever does"
      - "It requires you to obtain explicit formal approval from your own manager every single time before you are allowed to do it for someone"
      - "You put your own reputation/political capital on the line by vouching for someone — if they stumble, it reflects on you"
      - "It can only ever be done once per year, and only during the narrow formal promotion and calibration cycle window when decisions are made"
    answer: 2
    explanation: |
      Mentorship mainly costs time; sponsorship costs political capital because you vouch for
      someone and stake your reputation. That risk is exactly why it moves trajectories and
      why it's the scarcer, higher-leverage act.
    ref: "concepts.md#mentorship-vs-sponsorship"

  - id: mentorship-and-cross-team-influence-049
    difficulty: advanced
    tags: [influence-without-authority, writing, scale]
    question: |
      Why is writing (docs/RFCs) considered one of the highest-leverage tools for influence
      at scale?
    options:
      - "A crisp document scales your argument to rooms you're not in and lets many people engage async — it's how one person aligns dozens"
      - "It creates a durable documented paper trail that can be used to protect you politically later on if things end up going wrong on the project"
      - "It is simply much faster overall to write everything down once than it is to go and talk through the same points with each person individually"
      - "It lets you conveniently avoid having to build any actual working relationships with the people who sit across on all of the other teams"
    answer: 0
    explanation: |
      Writing scales an argument beyond the meetings you can attend and lets people engage on
      their own time, which is how a single person aligns many teams. It complements, not
      replaces, banked trust and relationships.
    ref: "concepts.md#influence-without-authority"

  - id: mentorship-and-cross-team-influence-050
    difficulty: intermediate
    tags: [junior-mistake, stabilize-first]
    question: |
      A junior's change is actively causing a production incident. What's the right ordering
      of your response?
    options:
      - "Deliver the coaching and feedback conversation first, and only then go and fix the actual incident"
      - "Stabilize first — roll back/mitigate with them — and do the learning conversation after the fire is out"
      - "Write up the full incident postmortem document first, before doing anything to mitigate the problem"
      - "Wait a while to see whether the incident happens to self-resolve on its own before taking any action"
    answer: 1
    explanation: |
      Stabilize before teaching: fix the immediate impact (with them, not for them), then do
      the blameless learning once the fire is out. Coaching mid-incident is poorly timed and
      delaying mitigation to teach or document is harmful.
    ref: "concepts.md#handling-a-junior-making-a-mistake"
