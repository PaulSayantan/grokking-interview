topic: "Hiring-Manager Round & Project Deep-Dive"
domain: interview-craft
topic_slug: hiring-manager-and-project-deep-dive
version: 1
questions:
  - id: hiring-manager-and-project-deep-dive-001
    difficulty: beginner
    tags: [hm-round, purpose, fit]
    question: |
      What is the primary purpose of the hiring-manager (HM) round in a senior backend loop?
    options:
      - "A final coding gate to confirm you can implement algorithms"
      - "Fit, motivation, and seniority calibration — plus screening for red flags"
      - "A formality where the decision has already been made before you walk in"
      - "To rigorously test your system-design and scalability skills in depth"
    answer: 1
    explanation: |
      The HM round is not a technical gate. The manager assesses whether you fit the team,
      why you're motivated, whether your scope matches the level, and whether there are red
      flags worth a veto. The technical rounds prove capability; the HM decides "will I want
      this person on my team."
    ref: "concepts.md#what-the-hiring-manager-round-is-really-for"

  - id: hiring-manager-and-project-deep-dive-002
    difficulty: intermediate
    tags: [hm-round, two-way, mindset]
    question: |
      The HM round is unique in the loop because the interviewer has skin in the outcome —
      they'll live with the hire. What's the best way to leverage that?
    options:
      - "Treat it as a hostile interrogation and stay strictly on the defensive the whole time"
      - "Keep every answer as short as possible so you never risk saying anything wrong"
      - "Treat it as a two-way conversation and ask sharp questions back about the role"
      - "Focus on impressing them by listing how many different technologies and frameworks you know"
    answer: 2
    explanation: |
      The HM is the most skeptical but most persuadable person in the loop, and they're also
      selling the role. Treating it as a two-way conversation — engaging and asking sharp
      reverse questions — demonstrates seniority and lets you evaluate them too.
    ref: "concepts.md#what-the-hiring-manager-round-is-really-for"

  - id: hiring-manager-and-project-deep-dive-003
    difficulty: intermediate
    tags: [red-flags, ownership]
    question: |
      During the HM round a candidate repeatedly explains past setbacks by blaming previous
      managers and "a dysfunctional team." What signal does this most likely send?
    options:
      - "Strong self-awareness and refreshing honesty about difficult situations"
      - "Healthy assertiveness and candor that the hiring manager will genuinely value"
      - "Deep technical expertise and hard-won engineering experience"
      - "A red flag: low ownership and a risk they'll badmouth this team too"
    answer: 3
    explanation: |
      Blaming past teams/managers is a classic red flag. It signals low ownership and predicts
      the candidate will speak the same way about the new team. Even when a past situation was
      genuinely bad, the mature move is to frame it around what you learned and what you want next.
    ref: "concepts.md#what-the-hiring-manager-round-is-really-for"

  - id: hiring-manager-and-project-deep-dive-004
    difficulty: intermediate
    tags: [subtext, why-leaving, retention]
    question: |
      An HM asks "Why are you looking to leave your current role?" What is the underlying
      question they're really testing?
    options:
      - "Your retention risk and emotional maturity"
      - "Whether you have a grievance they can sympathize with"
      - "How much compensation you currently earn"
      - "Which specific technologies you dislike"
    answer: 0
    explanation: |
      "Why leaving?" is a proxy for retention risk and maturity. The strong answer moves
      *toward* something (larger scope, new problems) rather than fleeing a grievance. Answering
      with complaints about a current employer signals you'll do the same to them.
    ref: "concepts.md#what-the-hiring-manager-is-really-asking-subtext"

  - id: hiring-manager-and-project-deep-dive-005
    difficulty: advanced
    tags: [subtext, decoding]
    question: |
      What is the senior-level skill when an HM asks a seemingly simple question like "Tell me
      about a project you're proud of"?
    options:
      - "List as many projects as you can remember to show off the sheer breadth of your experience"
      - "Answer the literal surface question with a plain chronological summary of the project timeline"
      - "Diagnose the underlying question (scope, your actual role, judgment) and answer to that"
      - "Redirect to the most impressive-sounding project even if you were peripheral"
    answer: 2
    explanation: |
      HM questions are proxies. "Proud of" is really testing scope, your genuine role, and your
      judgment. The senior signal is answering the underlying question — a project you drove,
      with the hard decisions and trade-offs — not the literal surface prompt.
    ref: "concepts.md#what-the-hiring-manager-is-really-asking-subtext"

  - id: hiring-manager-and-project-deep-dive-006
    difficulty: beginner
    tags: [project-selection, ownership]
    question: |
      When choosing a project to deep-dive, which selection criterion matters most?
    options:
      - "The project with the most famous, impressive-sounding name that recruiters will instantly recognize"
      - "The most recent project you touched, regardless of how deeply you were actually involved in it"
      - "The project with the largest team and headcount so that you come across as well-connected"
      - "A project where you personally made the hard technical calls and can defend them"
    answer: 3
    explanation: |
      Depth of ownership beats prestige. Pick a project where you made the hard decisions and can
      go multiple "why?"s deep, because interviewers drill precisely to find the seam between
      "I built this" and "I was near the team that built this."
    ref: "concepts.md#choosing-the-right-project-to-deep-dive"

  - id: hiring-manager-and-project-deep-dive-007
    difficulty: intermediate
    tags: [project-selection, preparation]
    question: |
      Why is it recommended to prepare 2-3 different deep-dive projects rather than one?
    options:
      - "So you can pick based on what the interviewer probes (scaling vs ambiguity vs incident)"
      - "To fill more of the available time so the interviewer has room to ask fewer hard follow-up questions"
      - "Because most interviewers formally require you to bring exactly three prepared projects"
      - "To prove that you have worked at three or more different companies over your career"
    answer: 0
    explanation: |
      Having a scaling story, an ambiguity/greenfield story, and an incident/reliability story
      lets you match the project to what the interviewer wants to explore. Each should have a
      crisp 60-second overview: problem, your role, key decision, outcome.
    ref: "concepts.md#choosing-the-right-project-to-deep-dive"

  - id: hiring-manager-and-project-deep-dive-008
    difficulty: advanced
    tags: [project-selection, exaggeration]
    question: |
      A candidate targeting a senior role considers deep-diving a well-known, high-prestige
      platform they were only peripherally involved in. Why is this risky?
    options:
      - "Prestige projects are considered off-limits and are essentially never asked about in loops"
      - "Interviewers drill to find the gap between real ownership and proximity, exposing thin knowledge"
      - "It is effectively against confidentiality rules to discuss famous, high-profile projects in interviews"
      - "It will make the interviewer jealous of the high-profile work and count against you"
    answer: 1
    explanation: |
      Interviewers use the deep-dive drill specifically to separate people who did the work from
      people who were near it. A modest project you owned deeply beats a famous project you can't
      defend three "why?"s deep — the exaggeration is what gets you down-leveled or vetoed.
    ref: "concepts.md#choosing-the-right-project-to-deep-dive"

  - id: hiring-manager-and-project-deep-dive-009
    difficulty: intermediate
    tags: [depth-spiral, structure]
    question: |
      What is the best way to open a project deep-dive?
    options:
      - "Immediately dive straight into the low-level code and implementation details to demonstrate technical depth"
      - "Recite the entire architecture from end to end in one continuous pass without pausing for input"
      - "Give ~90 seconds of framing (problem, constraints, your role), then invite the interviewer to steer"
      - "Ask the interviewer to sketch out how they would design the whole system first"
    answer: 2
    explanation: |
      Open with ~90 seconds of context, then pause and offer directions to drill ("data model,
      scaling, or migration — where's most useful?"). This reads the audience and manages the
      interview collaboratively rather than monologuing.
    ref: "concepts.md#structuring-the-deep-dive-the-depth-spiral"

  - id: hiring-manager-and-project-deep-dive-010
    difficulty: advanced
    tags: [depth-spiral, altitude]
    question: |
      An interviewer asks a broad question about your system's write path. What does answering
      "at the right altitude" mean?
    options:
      - "Always give the deepest possible detail immediately"
      - "Stay abstract and high-level no matter what they ask"
      - "Refuse to answer until they specify the exact layer"
      - "Start one level up, then descend on demand — and offer the next level explicitly"
    answer: 3
    explanation: |
      Dumping every detail unprompted reads junior; staying abstract when they want depth reads
      evasive. The senior move is to start slightly high, then offer to descend: "The write path
      used an outbox pattern — want me to walk the failure modes?"
    ref: "concepts.md#structuring-the-deep-dive-the-depth-spiral"

  - id: hiring-manager-and-project-deep-dive-011
    difficulty: intermediate
    tags: [depth-spiral, numbers, credibility]
    question: |
      Which habit most quickly builds credibility during an architecture deep-dive?
    options:
      - "Bringing concrete numbers unprompted (RPS, p99 budget, data size)"
      - "Using as much dense technical jargon and acronyms as possible to sound authoritative"
      - "Name-dropping the senior architects and staff engineers you worked alongside on the project"
      - "Avoiding specific numbers entirely so the interviewer can't pin you down on a figure later"
    answer: 0
    explanation: |
      Concrete figures ("~40k RPS peak, p99 budget 200 ms, ~2 TB hot data") are the fastest
      credibility signal and pre-empt the "how do you know it worked?" drill. Vague claims invite
      skeptical follow-ups.
    ref: "concepts.md#structuring-the-deep-dive-the-depth-spiral"

  - id: hiring-manager-and-project-deep-dive-012
    difficulty: intermediate
    tags: [drilling, exaggeration]
    question: |
      Why do senior interviewers use a funnel of increasingly specific follow-ups ("why not X?",
      "what broke?") during a deep-dive?
    options:
      - "To fill the remaining time and keep the candidate talking until the round is over"
      - "To deliberately confuse the candidate and see how they react under pressure"
      - "Because they don't actually understand the project themselves and are hoping you'll explain it"
      - "Because each deeper layer is harder to fake, revealing real ownership vs. proximity"
    answer: 3
    explanation: |
      The funnel exists to answer "did you actually do this and understand it?" People who were
      peripheral run out of answers by layer two or three; people who owned it get *more* precise
      as you go deeper. Résumés inflate; drilling deflates.
    ref: "concepts.md#why-interviewers-drill-for-depth-detecting-exaggeration"

  - id: hiring-manager-and-project-deep-dive-013
    difficulty: advanced
    tags: [drilling, tells]
    question: |
      A candidate says "we used a queue for reliability" but can't explain delivery semantics,
      retries, or the dead-letter queue when drilled. What tell is this?
    options:
      - "An appropriate level of abstraction that a senior engineer is expected to operate at"
      - "Vagueness under pressure — a sign they didn't own that decision"
      - "A sign they're being admirably concise and efficient with the interviewer's time"
      - "Clear evidence of strong system-design skill and architectural judgment"
    answer: 1
    explanation: |
      Vagueness that collapses under drilling is a classic tell that the candidate was near the
      work, not driving it. Someone who owned the queue would know its delivery semantics,
      retry/backoff, and DLQ handling cold.
    ref: "concepts.md#why-interviewers-drill-for-depth-detecting-exaggeration"

  - id: hiring-manager-and-project-deep-dive-014
    difficulty: advanced
    tags: [drilling, honesty, scoping]
    question: |
      During a deep-dive you're drilled on the ML model, but you owned the serving layer, not the
      model. What's the strongest response?
    options:
      - "Bluff your way through the model architecture and training details so you seem broad and well-rounded"
      - "Claim you designed and trained the model yourself so you don't come across as narrow or over-specialized"
      - "Say 'the model wasn't mine — I owned the serving layer, and there the hard part was...' then pivot to real depth"
      - "Say 'I don't really remember the details' and then go silent, waiting for the next question"
    answer: 2
    explanation: |
      Honest scoping *raises* trust. Naming what you didn't own and pivoting to what you did —
      with real depth — is the counter-strategy to the exaggeration detector. Bluffing collapses
      under the next follow-up and reads as low integrity.
    ref: "concepts.md#why-interviewers-drill-for-depth-detecting-exaggeration"

  - id: hiring-manager-and-project-deep-dive-015
    difficulty: intermediate
    tags: [i-vs-we, scope, integrity]
    question: |
      What is the disciplined way to use "I" versus "we" when describing a project?
    options:
      - "Use 'we' for shared team context and 'I' for your specific actions and decisions"
      - "Use 'I' for everything you describe to maximize the personal credit you're seen to deserve"
      - "Use 'we' for everything you describe so you come across as a humble, collaborative team player"
      - "Avoid both pronouns entirely and describe everything in the neutral passive voice throughout"
    answer: 0
    explanation: |
      "We" describes the team's context ("we needed to cut latency by half"); "I" describes your
      contribution ("I proposed the cache, prototyped it, drove the rollout"). Using both
      deliberately lets the interviewer see the team situation and your specific leverage.
    ref: "concepts.md#owning-your-scope-honestly-i-vs-we"

  - id: hiring-manager-and-project-deep-dive-016
    difficulty: advanced
    tags: [i-vs-we, credit-hiding, seniority]
    question: |
      A senior candidate describes every accomplishment as "we did X, we did Y," never
      distinguishing their own contribution. Why is this a problem at senior+ levels?
    options:
      - "It's not a problem at all; humility and deflecting credit to the team are always the best posture"
      - "It leaves the interviewer unable to assess the candidate, reading as low ownership or low level"
      - "It shows they take too much credit for themselves at the expense of their teammates"
      - "It specifically reveals that the candidate is technically incompetent and hiding behind the team"
    answer: 1
    explanation: |
      Credit-hiding ("we did everything") is the symmetric failure to credit-grabbing. It's
      especially fatal for senior+ because the interviewer can't isolate *your* leverage, which
      reads as low ownership or a mis-level. Be generous with team credit but precise about your part.
    ref: "concepts.md#owning-your-scope-honestly-i-vs-we"

  - id: hiring-manager-and-project-deep-dive-017
    difficulty: advanced
    tags: [i-vs-we, overclaiming]
    question: |
      Why is overclaiming ("I built the whole platform") considered the single most common
      deep-dive killer?
    options:
      - "Interviewers instinctively dislike confident candidates and penalize any strong claim of ownership"
      - "When drilling exposes the gap between the claim and reality, they down-level or veto for the exaggeration itself"
      - "It violates a common company policy that forbids claiming individual ownership of shared work"
      - "Platforms are never built by individuals so it's implausible on its face only"
    answer: 1
    explanation: |
      The problem isn't the gap in what you did — it's the dishonesty the gap reveals. Once
      drilling exposes an inflated "I," the interviewer stops trusting everything else you said.
      Under-claiming is safer but caps your level; the goal is precise.
    ref: "concepts.md#owning-your-scope-honestly-i-vs-we"

  - id: hiring-manager-and-project-deep-dive-018
    difficulty: intermediate
    tags: [weak-vs-strong, trade-offs]
    question: |
      Which answer to "tell me about a hard technical decision" sends the strongest senior signal?
    options:
      - "'We had performance problems so I added Redis and it got faster.'"
      - "'I made the site faster, which was clearly the right call.'"
      - "'p99 was ~900ms vs a 300ms budget; I weighed a cache, denormalization, and a read replica, chose the cache for [reason], accepted 30s stale prices, cut p99 to ~180ms, and would add stampede protection next time.'"
      - "'The team decided to use caching and it worked out well.'"
    answer: 2
    explanation: |
      The strong answer has numbers, alternatives considered, an explicit trade-off with a
      stakeholder sign-off, a measured outcome, and an owned mistake with the lesson — the full
      depth spiral. The others lack alternatives, numbers, trade-offs, or personal ownership.
    ref: "concepts.md#weak-vs-strong-deep-dive-answers"

  - id: hiring-manager-and-project-deep-dive-019
    difficulty: intermediate
    tags: [weak-vs-strong, alternatives]
    question: |
      An interviewer notices a candidate presents every design decision as obvious and inevitable,
      with no paths not taken. Why does this weaken the answer?
    options:
      - "Real engineering involves alternatives and trade-offs, so no-alternatives reads as shallow or borrowed"
      - "It shows the candidate is overly decisive, which interviewers view as a negative trait"
      - "Interviewers generally prefer candidates who appear indecisive and non-committal about choices"
      - "It proves the underlying project was too easy and trivial to be worth discussing in depth"
    answer: 0
    explanation: |
      Every real decision had paths not taken. Presenting choices as inevitable suggests the
      candidate didn't actually wrestle with the decision (or is reciting someone else's). Naming
      the alternatives and why you rejected them is core to demonstrating judgment.
    ref: "concepts.md#weak-vs-strong-deep-dive-answers"

  - id: hiring-manager-and-project-deep-dive-020
    difficulty: beginner
    tags: [resume-walkthrough, narrative]
    question: |
      What's the biggest mistake when answering "walk me through your resume"?
    options:
      - "Mentioning your current role and what you're responsible for there today"
      - "Keeping the whole narrative tight and under about three minutes long"
      - "Ending the narrative with a clear hook about why you want this particular role"
      - "Giving a chronological recital of every job and date"
    answer: 3
    explanation: |
      A chronological recital ("then in 2019... then in 2021...") is the failure mode. It's a
      storytelling test: lead with positioning, hit 2-3 scope-jump beats, state the through-line,
      and hook to this role.
    ref: "concepts.md#walk-me-through-your-resume-and-career-narrative"

  - id: hiring-manager-and-project-deep-dive-021
    difficulty: intermediate
    tags: [resume-walkthrough, structure]
    question: |
      Which structure best serves a 2-3 minute "walk me through your resume" answer?
    options:
      - "Every job you've ever held, walked through in roughly equal detail and depth"
      - "A comprehensive list of every programming language and technology you know"
      - "One-line positioning, 2-3 beats that each show a scope jump, a through-line, and a hook to this role"
      - "Your full education history and degrees, followed by your personal hobbies and interests"
    answer: 2
    explanation: |
      The senior move is a narrative arc: position yourself in one line, show 2-3 moves that each
      demonstrate growing scope, articulate the through-line connecting them, and hook to the
      target role. Editing out the noise is itself a seniority signal.
    ref: "concepts.md#walk-me-through-your-resume-and-career-narrative"

  - id: hiring-manager-and-project-deep-dive-022
    difficulty: intermediate
    tags: [resume-walkthrough, editing, seniority]
    question: |
      Why is deliberately skipping parts of your history during the resume walkthrough a *positive*
      seniority signal?
    options:
      - "It conveniently hides the employment gaps and weak spots the interviewer would dislike seeing"
      - "Knowing what matters and what's noise demonstrates judgment and self-editing"
      - "Shorter answers always score higher with interviewers regardless of the actual content"
      - "It leaves more of the remaining time open for the interviewer to talk and fill the round"
    answer: 1
    explanation: |
      A staff engineer knows what's signal and what's noise. Curating your story to serve the arc
      — rather than reciting everything — demonstrates the same judgment you'd apply to technical
      scoping. Rambling through every detail reads as an inability to prioritize.
    ref: "concepts.md#walk-me-through-your-resume-and-career-narrative"

  - id: hiring-manager-and-project-deep-dive-023
    difficulty: beginner
    tags: [why-company, motivation]
    question: |
      Which answer to "why do you want to work here?" is the weakest signal?
    options:
      - "'You're migrating a monolith to event-driven services, which is exactly the problem I want to keep solving.'"
      - "'I use your API weekly and care about the developer experience you're building.'"
      - "'Great culture, growth opportunity, and competitive comp.'"
      - "'Your eng-blog post on your sharding strategy connected to work I did last year.'"
    answer: 2
    explanation: |
      "Great culture / growth / comp" applies to almost every company, so it reads as
      mass-applying — a near-negative signal. Strong answers are specific to *them* and connect to
      *you*: their tech, product decisions, mission, or public engineering work.
    ref: "concepts.md#why-this-company--why-this-role-motivation"

  - id: hiring-manager-and-project-deep-dive-024
    difficulty: intermediate
    tags: [why-company, recipe]
    question: |
      What three ingredients make up a strong "why this company/role" answer?
    options:
      - "Salary target, start date, and preferred title"
      - "A list of their direct competitors that you interviewed with and ultimately rejected"
      - "How long you realistically plan to stay in the role and what your current notice period is"
      - "Something specific about them, why it connects to you, and what you'd contribute"
    answer: 3
    explanation: |
      The recipe: (1) something specific about them (product decision, tech, scale, mission),
      (2) why it genuinely connects to you, and (3) what you'd contribute in their problem space.
      This proves you did homework and reframes motivation as mutual fit.
    ref: "concepts.md#why-this-company--why-this-role-motivation"

  - id: hiring-manager-and-project-deep-dive-025
    difficulty: intermediate
    tags: [why-leaving, badmouthing]
    question: |
      When asked why you're leaving your current job, why should you never badmouth your current
      employer — even if the criticism is valid?
    options:
      - "Because the interviewer might personally know your current manager and repeat what you said"
      - "Because it is legally prohibited to discuss or criticize former employers during interviews"
      - "Because it signals you'll speak the same way about them later — frame toward what you want next instead"
      - "Because criticism of a workplace is never actually valid or worth voicing"
    answer: 2
    explanation: |
      Badmouthing predicts you'll do the same to the new company and reads as low maturity. Move
      *toward* something — "the scope has plateaued; I want larger systems and cross-team
      influence" — rather than airing a grievance.
    ref: "concepts.md#why-this-company--why-this-role-motivation"

  - id: hiring-manager-and-project-deep-dive-026
    difficulty: advanced
    tags: [architecture, end-to-end, specificity]
    question: |
      When asked to whiteboard a system *you actually built* (not a generic design), what most
      distinguishes a strong answer from a textbook design?
    options:
      - "Using more industry buzzwords and trendy patterns than the standard textbook version would"
      - "Specificity and hindsight: real numbers, the actual incident that shaped a choice, the deadline compromise you made"
      - "Drawing more boxes and arrows on the whiteboard than a normal reference design would have"
      - "Avoiding any mention of failures, limits, or bottlenecks so the design looks flawless"
    answer: 1
    explanation: |
      Because it's *your* real system, the differentiator is specificity and hindsight — real
      traffic numbers, the incident that drove a decision, the compromise under deadline, and the
      next bottleneck. A generic textbook answer here signals you didn't actually own it.
    ref: "concepts.md#discussing-a-past-architecture-end-to-end"

  - id: hiring-manager-and-project-deep-dive-027
    difficulty: advanced
    tags: [architecture, datastore, defending-choices]
    question: |
      While walking through a past architecture, the interviewer asks why you chose Postgres over
      DynamoDB. What's the strongest kind of response?
    options:
      - "'Postgres is just objectively better and pretty much everyone in the industry uses it.'"
      - "'The team already knew Postgres well, so we didn't really consider any other datastore options.'"
      - "'We needed transactions across order and inventory tables; the scaling ceiling was single-primary write throughput, which we were ~18 months from hitting.'"
      - "'I don't really remember the reasoning; someone else on the team decided that part.'"
    answer: 2
    explanation: |
      A strong answer defends the choice with the actual requirement (cross-table transactions),
      names the real scaling limit, and shows you understood the ceiling and runway. Blanket
      preference, pure familiarity, or "someone else decided" all fail the depth drill.
    ref: "concepts.md#discussing-a-past-architecture-end-to-end"

  - id: hiring-manager-and-project-deep-dive-028
    difficulty: advanced
    tags: [architecture, hindsight, self-awareness]
    question: |
      An interviewer drills a design choice you'd now make differently. What's the best response?
    options:
      - "Rigidly defend the original decision to appear consistent and confident in your past judgment"
      - "Blame the constraints you were under at the time and refuse to seriously engage with the critique"
      - "Claim the original decision was flawless and would hold up even with unlimited hindsight"
      - "Say you'd change it and explain the new reasoning, showing growth"
    answer: 3
    explanation: |
      "Given today's traffic I'd shard on customer_id from the start" shows growth and
      self-awareness. Rigidly defending a decision you privately doubt reads as an inability to
      learn — a bigger red flag than the original imperfect choice.
    ref: "concepts.md#discussing-a-past-architecture-end-to-end"

  - id: hiring-manager-and-project-deep-dive-029
    difficulty: intermediate
    tags: [architecture, coverage, seams]
    question: |
      When explaining a system end-to-end, which element most differentiates a senior answer?
    options:
      - "Listing every single microservice in the system by name and its responsibility"
      - "Describing the CI/CD build and deployment pipeline in exhaustive step-by-step detail"
      - "Naming the seams — where it's fragile, what you'd redesign, and the next bottleneck"
      - "Reciting the exact library and framework versions used across every service"
    answer: 2
    explanation: |
      Covering entry-to-data-at-rest is table stakes; the senior differentiator is understanding
      the system's *seams*: where it's fragile, what you'd redesign, and the next scaling ceiling.
      That shows you think about evolution and limits, not just the happy path.
    ref: "concepts.md#discussing-a-past-architecture-end-to-end"

  - id: hiring-manager-and-project-deep-dive-030
    difficulty: intermediate
    tags: [self-awareness, weakness]
    question: |
      Which answer to "what's a weakness of yours?" best demonstrates self-awareness?
    options:
      - "'Honestly, I care too much about my work and tend to work too hard for my own good.'"
      - "'I don't really have any weaknesses that meaningfully affect the quality of my work.'"
      - "'I used to over-engineer for scale we didn't have; now I ship the simple version and instrument it first.'"
      - "'I'm a bit of a perfectionist, which is really just a strength in disguise if anything.'"
    answer: 2
    explanation: |
      A real weakness owned without deflection, plus what you changed, proves coachability. Humble-
      brags ("I care too much," "perfectionist") and "no weaknesses" signal a lack of self-awareness,
      which HMs weight heavily because uncoachable engineers are a net negative on a team.
    ref: "concepts.md#showing-curiosity-self-awareness-and-what-youd-do-differently"

  - id: hiring-manager-and-project-deep-dive-031
    difficulty: intermediate
    tags: [what-would-you-do-differently, reflection]
    question: |
      A candidate answers "what would you do differently on that project?" with "Honestly nothing,
      it went great." Why is this a weak answer?
    options:
      - "Every real project has a regret; 'nothing' signals low self-awareness or a trivial project"
      - "It's actually a perfect answer that projects confidence and pride in the work"
      - "It's far too long and overloaded with unnecessary detail for the question"
      - "It takes too much personal credit for what was really the whole team's work"
    answer: 0
    explanation: |
      "Nothing" is essentially a wrong answer to a self-awareness probe. Every real project has a
      regret. The strong answer names a specific alternative and the lesson, and distinguishes
      what you knew then from now — avoiding hindsight bias.
    ref: "concepts.md#showing-curiosity-self-awareness-and-what-youd-do-differently"

  - id: hiring-manager-and-project-deep-dive-032
    difficulty: advanced
    tags: [what-would-you-do-differently, hindsight-bias]
    question: |
      What makes "what would you do differently?" answers especially strong at the senior+ level?
    options:
      - "Claiming you'd change nothing at all because your original judgment turned out to be perfect"
      - "Blaming everything you'd change on factors that were entirely outside of your own control"
      - "Listing ten different things you regret about the project to demonstrate deep humility"
      - "Distinguishing what you knew *then* from what you know *now*, avoiding hindsight bias"
    answer: 3
    explanation: |
      "With what we knew, the monolith was right; the mistake was not carving seams for later
      extraction" separates the decision's process from its outcome. This shows mature judgment —
      you evaluate decisions by the information available at the time, not just how they turned out.
    ref: "concepts.md#showing-curiosity-self-awareness-and-what-youd-do-differently"

  - id: hiring-manager-and-project-deep-dive-033
    difficulty: intermediate
    tags: [curiosity, coachability]
    question: |
      During the round the interviewer pushes back on one of your design choices. What response
      best signals coachability?
    options:
      - "Defend the choice firmly to show conviction, dismissing the pushback as not fully informed"
      - "Immediately abandon your position and agree with them to avoid any appearance of conflict"
      - "Engage genuinely with their point, explore it, and update if it's sound"
      - "Change the subject to a different topic where you feel technically stronger and more secure"
    answer: 2
    explanation: |
      Coachability is engaging with pushback out of genuine curiosity — exploring the interviewer's
      point and updating when it's valid — rather than reflexively defending or capitulating.
      HMs weight this heavily; a smart engineer who can't take feedback is a net negative.
    ref: "concepts.md#showing-curiosity-self-awareness-and-what-youd-do-differently"

  - id: hiring-manager-and-project-deep-dive-034
    difficulty: advanced
    tags: [seniority, scope, calibration]
    question: |
      Interviewers calibrate your level primarily by what?
    options:
      - "The sheer number of distinct projects you're able to list off during the round"
      - "The scope of your stories — depth (difficulty you resolved) and breadth (teams, ambiguity, time-horizon)"
      - "The prestige and brand recognition of the companies listed on your resume"
      - "How many total years of professional engineering experience you have accumulated"
    answer: 1
    explanation: |
      Level is read from scope, not count or tenure. Two axes matter: depth (technical difficulty
      you personally resolved) and breadth (how many teams, how much ambiguity, and what time
      horizon your impact spanned). Pick stories that sit at the target level.
    ref: "concepts.md#matching-seniority-to-the-depth-and-breadth-of-your-examples"

  - id: hiring-manager-and-project-deep-dive-035
    difficulty: advanced
    tags: [seniority, scope-mismatch]
    question: |
      A candidate interviewing for a Staff role leads with "I fixed a really hard bug" as their
      flagship story. What's the likely calibration problem?
    options:
      - "None at all — a hard debugging story is always a strong staff-level signal on its own"
      - "It's far too broad and unfocused to serve as a flagship story at any level"
      - "It shows far too much breadth across systems and nowhere near enough technical depth"
      - "It's a strong mid-level story but thin for Staff, which expects cross-team direction and ambiguity resolution"
    answer: 3
    explanation: |
      A hard-bug fix demonstrates solid execution (mid/senior depth) but not the cross-team
      technical direction, ambiguity resolution, and multiplier impact expected at Staff. Leading
      with an under-scoped story invites a down-level. Match stories to the target level.
    ref: "concepts.md#matching-seniority-to-the-depth-and-breadth-of-your-examples"

  - id: hiring-manager-and-project-deep-dive-036
    difficulty: advanced
    tags: [seniority, stretch-level, story-order]
    question: |
      You're targeting a stretch level above your current one. How should you order your stories?
    options:
      - "Lead with a solid at-level story to establish credibility, then follow with one that reaches up"
      - "Open with your single most ambitious stretch story right away to set a high anchor for your level"
      - "Only tell stories from clearly below your current level so nothing can wobble under drilling"
      - "Tell your stories in strict chronological order regardless of their scope or relevance to the level"
    answer: 0
    explanation: |
      Lead with a story at your current level to establish credibility, then follow with a stretch
      story to show readiness. Opening with the stretch is risky — if it wobbles under drilling,
      you've capped yourself before proving your baseline.
    ref: "concepts.md#matching-seniority-to-the-depth-and-breadth-of-your-examples"

  - id: hiring-manager-and-project-deep-dive-037
    difficulty: intermediate
    tags: [seniority, mid-vs-senior, rubric]
    question: |
      According to the scope rubric, what best characterizes a *Senior* (vs. mid) engineer's
      flagship story?
    options:
      - "Delivered a well-specified feature reliably with solid debugging"
      - "Set company-wide technical strategy and influenced direction well beyond their own org"
      - "Owned a project/component end-to-end, made and defended real trade-offs, handled some ambiguity"
      - "Wrote the most lines of code and shipped the most commits on the team that year"
    answer: 2
    explanation: |
      Senior scope is end-to-end ownership of a project/component with defended trade-offs and
      some ambiguity. Delivering a well-specified feature is a mid-level signal; setting org-wide
      strategy is staff+. The rubric maps scope to level.
    ref: "concepts.md#matching-seniority-to-the-depth-and-breadth-of-your-examples"

  - id: hiring-manager-and-project-deep-dive-038
    difficulty: intermediate
    tags: [salary, anchoring, deflection]
    question: |
      The HM asks early "what are your salary expectations?" What's the strongest response for
      this stage?
    options:
      - "Immediately state your exact target number to be transparent"
      - "'I'd like to understand the scope and level first — I'm confident we can align on comp. What band is this budgeted at?'"
      - "Refuse to discuss compensation at all and change the subject"
      - "State your current salary up front and use it as the anchor for the whole conversation"
    answer: 1
    explanation: |
      The HM round is signal-gathering, not the negotiation. Deflect number-anchoring without
      stonewalling by turning it around to scope/level and asking their band. Blurting a specific
      number early can under-sell you or price you out before scope is established.
    ref: "concepts.md#salary-leveling-and-level-signals-in-the-hm-round"

  - id: hiring-manager-and-project-deep-dive-039
    difficulty: intermediate
    tags: [leveling, comp, title]
    question: |
      Why is fighting for a title without regard to level generally a mistake?
    options:
      - "Titles are far more important than money for your long-term career trajectory"
      - "Titles genuinely never matter at all in the tech industry, so it's a wasted fight"
      - "Recruiters ignore titles entirely and look only at your years of experience"
      - "Level maps to the comp band; a title with the same band is hollow — the leverage is level"
    answer: 3
    explanation: |
      Level determines the comp band. A fancier title within the same band gives you little; the
      real leverage is getting slotted at the higher level. Your deep-dive stories must show the
      scope that justifies that level — the HM connects the two.
    ref: "concepts.md#salary-leveling-and-level-signals-in-the-hm-round"

  - id: hiring-manager-and-project-deep-dive-040
    difficulty: advanced
    tags: [salary, honesty, disclosure]
    question: |
      Regarding your *current* compensation during the HM round, what's the best posture?
    options:
      - "Never lie about it, but you're not obligated to disclose it — anchor on market/target instead"
      - "Always disclose your current compensation fully and up front to build trust with the manager"
      - "Inflate your current number upward so you can anchor the negotiation higher later on"
      - "Flatly refuse to discuss any numbers whatsoever and shut the compensation conversation down"
    answer: 0
    explanation: |
      Never lie about current comp, but you're not obligated to disclose it (and it's illegal to
      ask in many US states). Anchor the conversation on market rate and your target for the
      level, not on your history — which can under-price you.
    ref: "concepts.md#salary-leveling-and-level-signals-in-the-hm-round"

  - id: hiring-manager-and-project-deep-dive-041
    difficulty: beginner
    tags: [reverse-questions, engagement]
    question: |
      The HM asks "any questions for me?" and the candidate says "no, I think you've covered
      everything." Why is this a weak move?
    options:
      - "It's perfectly fine and simply shows the interview was thorough and covered everything"
      - "It signals to the manager that the candidate is overqualified for the role"
      - "No questions reads as disengaged or junior; the reverse-question segment is graded"
      - "It shortens the scheduled interview slot, which tends to annoy a busy hiring manager"
    answer: 2
    explanation: |
      "Any questions?" is a graded part of the round. Having none signals low interest or junior
      thinking. Prepared, HM-specific questions double as your due diligence and signal seniority
      through what you choose to probe.
    ref: "concepts.md#reverse-questions-for-the-hiring-manager"

  - id: hiring-manager-and-project-deep-dive-042
    difficulty: intermediate
    tags: [reverse-questions, targeting]
    question: |
      Which reverse question is best suited specifically to a *hiring manager* (as opposed to a
      recruiter or peer)?
    options:
      - "'So what exactly does the company do and what are the main products?'"
      - "'What's the PTO policy, the 401k match, and the rest of the benefits package?'"
      - "'How many more rounds are left in the loop and when will I hear back?'"
      - "'What does success look like for this role in the first 6-12 months?'"
    answer: 3
    explanation: |
      The HM owns team health, roadmap, and your growth, so ask about success criteria, technical
      challenges, and how scope will evolve. Careers-page questions signal no homework, and
      comp/perks questions belong to the recruiter.
    ref: "concepts.md#reverse-questions-for-the-hiring-manager"

  - id: hiring-manager-and-project-deep-dive-043
    difficulty: advanced
    tags: [reverse-questions, listening]
    question: |
      Why does asking a reverse question that builds on something the HM said earlier ("you
      mentioned the migration — how far along is it?") send an especially strong signal?
    options:
      - "It shows the interviewer that you memorized a script of questions ahead of time"
      - "It signals you were actively listening and think in systems, not just checking a box"
      - "It subtly flatters the interviewer, nudging them toward giving you a better rating"
      - "It proves to them that you already know more about the migration than they do"
    answer: 1
    explanation: |
      Building on what they said demonstrates active listening and systems thinking, versus firing
      off a canned list. Prepare 6-8 questions but ask the 2-3 most relevant to what actually came
      up in the conversation.
    ref: "concepts.md#reverse-questions-for-the-hiring-manager"

  - id: hiring-manager-and-project-deep-dive-044
    difficulty: advanced
    tags: [reverse-questions, team-health]
    question: |
      A candidate wants to assess burnout risk and team health via a reverse question to the HM.
      Which question does this best?
    options:
      - "'What's the maximum amount of vacation time I would be able to take each year?'"
      - "'Do people on this team regularly end up working evenings and weekends here?'"
      - "'How does the team handle on-call and incidents?'"
      - "'Is the manager here difficult to work for, or has the team had issues with them?'"
    answer: 2
    explanation: |
      Asking how on-call and incidents are handled surfaces team health and burnout risk in a
      professional, senior way — it reads as operational maturity rather than as fishing about
      hours or putting the manager on the spot.
    ref: "concepts.md#reverse-questions-for-the-hiring-manager"

  - id: hiring-manager-and-project-deep-dive-045
    difficulty: intermediate
    tags: [conflict, disagree-and-commit, subtext]
    question: |
      An HM asks "tell me about a time you disagreed with a technical decision." What are they
      really testing?
    options:
      - "Whether you make conflict worse or better — disagree-and-commit and empathy for the other view"
      - "Whether you turned out to be technically right in the end and won the argument"
      - "How many technical arguments you typically win against your peers"
      - "Whether you avoid technical conflict entirely and simply defer to others"
    answer: 0
    explanation: |
      The subtext is "do you make things better or worse on a team?" The strong answer shows
      disagree-then-commit, genuine empathy for the other side's reasoning, and focus on the
      outcome — not a story about proving you were right.
    ref: "concepts.md#what-the-hiring-manager-is-really-asking-subtext"

  - id: hiring-manager-and-project-deep-dive-046
    difficulty: advanced
    tags: [staff-archetype, scope, impact]
    question: |
      A Staff candidate is asked for their proudest impact. Which framing best matches Staff-level
      scope (per Larson's archetypes and ladder rubrics)?
    options:
      - "'I personally wrote the single most performance-critical module in the entire system.'"
      - "'I closed the most tickets and shipped the most features on my team last quarter.'"
      - "'I was always the very first person to respond whenever an on-call page fired off.'"
      - "'I drove the technical direction of a cross-team migration, resolved the ambiguity in the sequencing, and the approach became the standard other teams adopted.'"
    answer: 3
    explanation: |
      Staff scope is cross-team technical direction, ambiguity resolution, and multiplier impact
      (others adopting your approach) — matching archetypes like Tech Lead/Architect/Solver. The
      other options are strong individual-contributor/execution signals but under-scoped for Staff.
    ref: "concepts.md#matching-seniority-to-the-depth-and-breadth-of-your-examples"

  - id: hiring-manager-and-project-deep-dive-047
    difficulty: intermediate
    tags: [boundary, technical-round, cross-reference]
    question: |
      In the project deep-dive, the interviewer asks you to design a *new* generic system on the
      whiteboard (not one you built). How does this differ from the deep-dive, and where does that
      skill live?
    options:
      - "It's essentially identical to the deep-dive, so you should treat it the exact same way"
      - "It's the technical system-design method (driving a whiteboard, capacity math) — a different skill covered by the system-design interview-method topic"
      - "It means your project deep-dive failed to convince them and they're now starting over"
      - "It's a trick question designed to trap you, and you should politely decline to answer"
    answer: 1
    explanation: |
      A deep-dive interrogates a system you actually built (specificity + hindsight). Designing a
      new generic system is the technical system-design method — driving a whiteboard, capacity
      estimation, API design — which lives in system-design/interview-method-scenario-playbooks.
    ref: "concepts.md#discussing-a-past-architecture-end-to-end"

  - id: hiring-manager-and-project-deep-dive-048
    difficulty: intermediate
    tags: [incident, ownership, story]
    question: |
      When telling an incident story in the HM round, what is the behavioral angle the interviewer
      most wants (versus the process mechanics)?
    options:
      - "How you demonstrated ownership — driving the response, communicating, and the blameless lesson"
      - "The exact runbook steps and the specific alerting thresholds you configured for the service"
      - "A complete list of every monitoring and observability tool in your production stack"
      - "Whose fault the incident ultimately was and which person or team caused it"
    answer: 0
    explanation: |
      Here the incident is a lens for ownership: how you drove the response, communicated under
      pressure, and turned it into a blameless improvement. The reliability *process* mechanics
      (runbooks, alerting, postmortem tooling) live in devops-cicd/observability — don't make the
      story about tools or blame.
    ref: "concepts.md#what-the-hiring-manager-round-is-really-for"
