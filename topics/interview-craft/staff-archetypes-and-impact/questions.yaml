topic: "Staff+ Archetypes & Demonstrating Impact"
domain: interview-craft
topic_slug: staff-archetypes-and-impact
version: 1
questions:
  - id: staff-archetypes-and-impact-001
    difficulty: beginner
    tags: [archetypes, multiplier, fundamentals]
    question: |
      Compared to a Senior engineer, what fundamentally changes about the "unit of
      impact" an interviewer expects at Staff+ level?
    options:
      - "You are expected to write more code, faster and with fewer bugs, shipping features single-handedly at roughly double a Senior's throughput"
      - "You are expected to stop coding entirely and spend your days in planning meetings, roadmap reviews, and status syncs instead of building"
      - "Your impact is measured by the increased output of the people and systems around you, not just your own output"
      - "You are expected to manage a team of direct reports, own their performance reviews, and handle their career growth and hiring decisions"
    answer: 2
    explanation: |
      Staff+ is a change in the unit of impact — from your individual output to the
      leverage you create across the org (multiplier effect). It is not "Senior but faster,"
      not a move to people-management (that is the manager track), and not the end of coding.
    ref: "concepts.md#multiplier-impact-leverage-over-individual-output"
  - id: staff-archetypes-and-impact-002
    difficulty: beginner
    tags: [archetypes, tech-lead]
    question: |
      In Will Larson's taxonomy, which Staff archetype "guides the approach and execution of
      one team or a cluster of teams, partnering closely with one to a few managers"?
    options:
      - "Tech Lead"
      - "Architect"
      - "Right Hand"
      - "Solver"
    answer: 0
    explanation: |
      That is the Tech Lead — the most common archetype (~one per eight engineers) and the
      most accessible entry into Staff, closest to strong Senior work. The Architect owns a
      critical area's direction, the Solver dives on hard problems, and the Right Hand
      extends a senior leader's capacity.
    ref: "concepts.md#the-four-staff-archetypes"
  - id: staff-archetypes-and-impact-003
    difficulty: beginner
    tags: [archetypes, solver]
    question: |
      Leadership drops an engineer onto the org's most critical, high-risk, poorly-defined
      problem and trusts them to go deep until it is resolved, then move to the next fire.
      Which archetype does this best describe?
    options:
      - "Tech Lead"
      - "Solver"
      - "Right Hand"
      - "Architect"
    answer: 1
    explanation: |
      This is the Solver: a trusted agent who dives deep on the gnarliest problems. They do
      little org maneuvering because leadership has already picked the priority, and they
      move on once the problem is contained.
    ref: "concepts.md#the-four-staff-archetypes"
  - id: staff-archetypes-and-impact-004
    difficulty: intermediate
    tags: [archetypes, right-hand]
    question: |
      Which statement about the "Right Hand" archetype is most accurate?
    options:
      - "It is the most common archetype and the usual entry point into Staff roles"
      - "It is defined by owning the long-term architecture of a single critical technical area"
      - "It is defined by parachuting into the hardest technical problem and solving it alone"
      - "It extends a senior leader's (director/VP) capacity, operating as a senior org leader without managing people, and is the rarest archetype, appearing only at real scale"
    answer: 3
    explanation: |
      The Right Hand extends an executive's scope and authority without direct management,
      and is the rarest archetype — it emerges only at hundreds/thousands of engineers. The
      most-common/entry archetype is Tech Lead; area-direction is the Architect; lone
      hard-problem diving is the Solver.
    ref: "concepts.md#the-four-staff-archetypes"
  - id: staff-archetypes-and-impact-005
    difficulty: intermediate
    tags: [archetypes, architect, failure-mode]
    question: |
      A candidate describes their ideal Architect role as "I design the system, write the
      spec, hand it to the teams, and move on — I don't get involved in implementation." Why
      is this a weak signal for the Architect archetype?
    options:
      - "Architects should never write design documents at all; they are expected to give only verbal guidance and let the teams capture the details themselves"
      - "Architects are not permitted to own any technical area directly, because owning an area is exclusively the Tech Lead's job and would blur the two archetypes"
      - "A strong Architect is embedded and hands-on, maintaining deep understanding of business and technical constraints and earning authority through involvement — not designing-and-throwing-over-the-wall"
      - "The Architect archetype does not exist below the VP level and is only ever created for the very largest organizations with thousands of engineers"
    answer: 2
    explanation: |
      Larson stresses the effective Architect is embedded, hands-on, and advocates for
      approaches using *earned* organizational authority — not an ivory-tower figure who
      designs and disappears. The "throw it over the wall" framing is the classic anti-pattern.
    ref: "concepts.md#the-four-staff-archetypes"
  - id: staff-archetypes-and-impact-006
    difficulty: intermediate
    tags: [archetypes, pairings]
    question: |
      Larson notes two natural pairings among the archetypes based on how they relate to
      people and problems. Which pairing "works with the same people on the same problems for
      years, building deep team cohesion"?
    options:
      - "Tech Lead and Architect"
      - "Solver and Right Hand"
      - "Architect and Solver"
      - "Tech Lead and Right Hand"
    answer: 0
    explanation: |
      Tech Lead and Architect stay embedded with the same people/problems over years
      (cohesion). Solver and Right Hand "bounce from fire to fire" — more transactional
      interactions but tightly aligned to leadership priorities.
    ref: "concepts.md#the-four-staff-archetypes"
  - id: staff-archetypes-and-impact-007
    difficulty: advanced
    tags: [archetypes, story-selection, judgment]
    question: |
      A job description emphasizes "set technical direction for the team, mentor engineers,
      and drive execution." Which story should you LEAD with to best match the implied
      archetype?
    options:
      - "A time you parachuted alone into a failing project and personally rewrote the core of it over a single weekend to save the launch"
      - "A time you represented engineering in the VP's weekly staff meeting and ran a cross-org program spanning several teams you didn't own"
      - "A time you spent six months owning the company-wide storage architecture, setting its direction across many teams and platforms"
      - "A time you set a team's technical vision, unblocked its members, and delegated work to grow engineers so the team's throughput rose"
    answer: 3
    explanation: |
      The JD signals a Tech Lead role (direction + mentoring + team execution). Lead with a
      team-throughput/vision/delegation story. The lone-rewrite is a Solver story, the VP
      staff-meeting is a Right Hand story, and company-wide storage is an Architect story —
      each under-matches this specific role.
    ref: "concepts.md#reading-which-archetype-the-role-wants"
  - id: staff-archetypes-and-impact-008
    difficulty: advanced
    tags: [archetypes, solver, multiplier]
    question: |
      Your strongest material is a Solver-style story: you alone diagnosed and fixed a brutal
      distributed-systems bug. The role wants a multiplier. What is the best way to raise the
      story to the staff bar without inventing new material?
    options:
      - "Drop the story entirely and find different material, because a lone deep-dive Solver story can never demonstrate genuine staff-level impact"
      - "Add the leverage layer: the runbook/pattern you documented, who you taught it to, and what you standardized so the class of bug can't recur"
      - "Exaggerate the number of engineers who chipped in and reframe the diagnosis as a team effort so the whole thing sounds more collaborative"
      - "Reframe it as a coding-round anecdote showcasing your algorithm and data-structure skills under time pressure rather than a systems story"
    answer: 1
    explanation: |
      A lone deep-dive under-sells you for a multiplier role. Keep the story but add the
      durable-artifact + teaching + prevention layer — that converts individual heroics into
      org leverage. Deleting it or fabricating collaborators are both wrong; the leverage was
      likely real, you just did not narrate it.
    ref: "concepts.md#reading-which-archetype-the-role-wants"
  - id: staff-archetypes-and-impact-009
    difficulty: intermediate
    tags: [reverse-question, archetypes, scope]
    question: |
      Which reverse-question best helps you decode which archetype a Staff role actually
      wants, while also signaling that you think in terms of scope and leverage?
    options:
      - "What does success look like in the first year — is it more about guiding a specific team, owning a technical area across teams, or parachuting into whatever's hardest?"
      - "What is the total compensation band for this level, including the base salary, equity grant, and annual bonus target?"
      - "How many LeetCode problems and algorithm patterns should I practice to be fully prepared for the coding rounds in the loop?"
      - "Will I be allowed to work from home on Fridays, and what is the team's general policy on remote and hybrid schedules?"
    answer: 0
    explanation: |
      This question simultaneously reveals the target archetype (Tech Lead vs Architect vs
      Solver) and shows you frame roles in scope/leverage terms — a staff signal itself. The
      others are logistics or don't reveal archetype.
    ref: "concepts.md#reading-which-archetype-the-role-wants"
  - id: staff-archetypes-and-impact-010
    difficulty: beginner
    tags: [multiplier, leverage, fundamentals]
    question: |
      What does "leverage" mean in the context of staff-level impact?
    options:
      - "Using financial debt and borrowed capital to fund larger engineering projects than the budget would otherwise allow"
      - "Negotiating a higher salary and a larger equity grant by playing a competing offer against your current employer"
      - "Your total impact = your own work plus the increased output of everyone you affected (direction set, people unblocked, engineers grown)"
      - "Working longer hours than everyone else on the team so you personally ship far more features over the course of a year"
    answer: 2
    explanation: |
      Leverage is the multiplier: impact beyond your own hands via direction-setting,
      unblocking, mentoring/sponsoring, editing, finishing stalled work, and org-wide
      standards/tooling. It is the defining staff signal, unrelated to financial leverage or
      raw hours.
    ref: "concepts.md#multiplier-impact-leverage-over-individual-output"
  - id: staff-archetypes-and-impact-011
    difficulty: intermediate
    tags: [multiplier, weak-vs-strong, business-framing]
    question: |
      Which is the STRONGER (more staff-level) version of the same accomplishment?
    options:
      - "I rewrote the payments service end to end and cut its p99 latency by a solid 40% over the previous implementation."
      - "I spent three months profiling and optimizing the payments service until it was about as fast as I could possibly make it."
      - "I fixed the payments latency problem; it was genuinely hard and took a lot of late nights and weekends to finally crack."
      - "Payments latency was blocking three product teams. I cut it 40%, but the lasting win was the async pattern and load-test harness I documented — two teams adopted it and I paired with their leads — so checkout feature velocity roughly doubled."
    answer: 3
    explanation: |
      The strong version names beneficiaries (three teams), the durable artifact (pattern +
      harness), the teaching (paired with leads), and the business outcome (feature velocity).
      That is the multiplier made legible. The others are pure individual output or effort.
    ref: "concepts.md#multiplier-impact-leverage-over-individual-output"
  - id: staff-archetypes-and-impact-012
    difficulty: advanced
    tags: [multiplier, editing, leverage]
    question: |
      Larson describes "editing" as a high-leverage staff activity. Which example best
      illustrates it?
    options:
      - "Writing every line of a critical service yourself to personally guarantee its quality and correctness before it ships"
      - "A 15-minute conversation or a single review comment that re-scopes a stalled project and changes its trajectory"
      - "Insisting on reviewing every pull request across the entire org before it is allowed to merge into the main branch"
      - "Rewriting a teammate's design doc from scratch on your own, without telling them, so it matches your preferred approach"
    answer: 1
    explanation: |
      "Editing" is a small, high-privilege intervention — a comment, re-scope, or brief
      conversation — that shifts a project's outcome using your experience and organizational
      standing. Doing all the work yourself or gatekeeping every PR is the opposite of leverage.
    ref: "concepts.md#multiplier-impact-leverage-over-individual-output"
  - id: staff-archetypes-and-impact-013
    difficulty: advanced
    tags: [multiplier, finishing, leverage]
    question: |
      A capable engineer's project has stalled for months. Which action demonstrates the most
      staff-level leverage?
    options:
      - "Take the project over and finish it yourself so it ships on time and you can be sure it meets the quality bar"
      - "Escalate to their manager and recommend putting them on a formal performance improvement plan for missing the deadline"
      - "Coach them to re-scope it — cutting the six-month slog into a two-week shippable slice — so they finish it and grow"
      - "Wait quietly and stay out of it; if the project is genuinely important, someone above you will eventually notice and escalate it"
    answer: 2
    explanation: |
      Larson's "finish things" leverage: help re-scope to unlock delivery, which finishes the
      work AND grows the person. Taking it over yourself removes leverage and their growth;
      escalating to a PIP or waiting are avoidance, not multiplier behavior.
    ref: "concepts.md#multiplier-impact-leverage-over-individual-output"
  - id: staff-archetypes-and-impact-014
    difficulty: intermediate
    tags: [glue-work, invisible-impact]
    question: |
      What is "glue work" (Tanya Reilly's term), and why does it matter at staff level?
    options:
      - "Writing shared utility libraries and common frameworks; it matters because code reuse saves the org time and reduces duplication"
      - "Pair-programming with junior engineers on their assigned tickets; it matters because it speeds up their day-to-day delivery"
      - "The onboarding and compliance paperwork HR requires for new hires; it matters because every team has to complete it"
      - "The unglamorous cross-team coordination — design docs, unblocking meetings, launch checklists, spotting the gap nobody owns — that holds a project together; essential staff leverage but often invisible if not narrated"
    answer: 3
    explanation: |
      Glue work is the coordination/ownership-of-the-gaps that makes projects succeed. It is
      genuine staff-level leverage, but it is the work most likely to go uncredited — so you
      must narrate it by the outcome it enabled and the judgment it required.
    ref: "concepts.md#glue-work-and-the-invisible-impact-trap"
  - id: staff-archetypes-and-impact-015
    difficulty: advanced
    tags: [glue-work, narration, judgment]
    question: |
      Which is the strongest way to narrate glue work in an interview so it reads as a staff
      signal rather than "I kept things organized"?
    options:
      - "I made sure all the meeting notes were tidy and kept the Jira board up to date so everyone could see the current status."
      - "No one owned cross-team API compatibility for the launch — I spotted that gap, built a compatibility matrix, ran a weekly 20-minute sync, and we shipped on time with zero breaking-change incidents; the matrix is now the standard for launches."
      - "I volunteered for all the boring coordination and scheduling tasks that nobody else on the teams actually wanted to do."
      - "I attended every team's daily standup across the whole program so I always knew exactly what was going on everywhere."
    answer: 1
    explanation: |
      The strong version names the gap spotted (judgment — you saw the org-level risk others
      missed), the leverage (matrix + lightweight sync), and the outcome (on-time, zero
      incidents, now standard). That reframes "organizing" as seeing and closing an org risk.
      The others describe busywork without judgment or outcome.
    ref: "concepts.md#glue-work-and-the-invisible-impact-trap"
  - id: staff-archetypes-and-impact-016
    difficulty: advanced
    tags: [glue-work, automation, judgment, failure-mode]
    question: |
      You have been the human "glue" running a fragile manual release-coordination process
      for a year. In a staff interview, what is the most sophisticated way to talk about it?
    options:
      - "Emphasize how indispensable you became to the release, since you were the only person who truly understood the whole process end to end"
      - "Describe in detail how many hours each week you personally spent keeping the fragile process running smoothly without incidents"
      - "Explain that you recognized being the permanent human glue was a risk, so you automated/templated the process (a bot and a checklist) so it no longer depended on you, freeing you for higher-leverage work"
      - "Say you deliberately avoided the release-coordination work entirely, because that kind of glue work is beneath a staff-level engineer"
    answer: 2
    explanation: |
      Staff judgment includes knowing when to turn yourself into a system rather than being
      the permanent human glue. Bragging about indispensability or hours-spent signals you
      created a bus-factor risk; refusing glue outright ignores real org needs. The mature
      move is glue-then-systematize.
    ref: "concepts.md#glue-work-and-the-invisible-impact-trap"
  - id: staff-archetypes-and-impact-017
    difficulty: intermediate
    tags: [business-framing, impact]
    question: |
      Why is translating technical outcomes into business terms (dollars, users, risk,
      velocity) considered a key differentiator between a Senior and a Staff answer?
    options:
      - "Because interviewers ultimately only care about money and revenue, not about the underlying engineering that produced it"
      - "Because staff engineers are trusted to make business-aware technical calls; connecting tech to business impact shows you understand *why* the work mattered, while pure tech-speak signals you need a manager to find your impact"
      - "Because business framing conveniently lets you avoid getting into the messy technical details you may not remember well"
      - "Because tying work to business outcomes is the single and only way to get a promotion at essentially any company"
    answer: 1
    explanation: |
      Staff+ engineers are trusted with business-aware judgment. Tying tech to \$/users/risk/
      velocity shows you see the point of the work. Staying purely in tech-speak reads as
      "strong engineer who needs a manager to connect them to impact" — a downlevel signal.
    ref: "concepts.md#business-impact-framing-tie-tech-to-dollars-users-risk"
  - id: staff-archetypes-and-impact-018
    difficulty: intermediate
    tags: [business-framing, weak-vs-strong]
    question: |
      Which answer demonstrates the strongest business-impact framing?
    options:
      - "I refactored the checkout service using the strangler-fig pattern to reduce coupling and make future changes safer."
      - "I migrated us onto a cleaner, more modular architecture that the engineers on the team find much nicer to work in day to day."
      - "I closed 40 technical-debt tickets last quarter across the checkout codebase, more than anyone else on the team that period."
      - "I cut checkout p99 from 300ms to 90ms; at ~2M daily checkouts that ~2% conversion lift is on the order of tens of millions in annual GMV, which is why we prioritized it."
    answer: 3
    explanation: |
      The strong answer connects a concrete technical result to a business quantity (GMV via
      conversion) with a defensible estimate. The others stay in tech-speak or count activity
      (tickets closed) with no line to why the business cared.
    ref: "concepts.md#business-impact-framing-tie-tech-to-dollars-users-risk"
  - id: staff-archetypes-and-impact-019
    difficulty: advanced
    tags: [business-framing, estimation, honesty]
    question: |
      An interviewer asks the revenue impact of a latency win, but you never had the exact
      figure. What is the best response?
    options:
      - "Estimate defensibly and flag it as an estimate: 'I don't have the precise figure, but at ~2M daily checkouts a 2% conversion lift is on the order of tens of millions in annual GMV — that's the scale of why it mattered.'"
      - "Invent a precise-sounding number like '$4.2M in annual revenue' on the spot so the impact lands as concrete and quantified"
      - "Say 'I honestly don't know the revenue number' and quickly move the conversation on to the technical details of the fix"
      - "Say that estimating revenue impact is really the product manager's job and not something an engineer is expected to know"
    answer: 0
    explanation: |
      Showing you *think* in business terms via a defensible, clearly-labeled estimate beats
      both false precision (dishonest, collapses on probing) and "I don't know" (misses the
      staff signal). Deflecting to the PM signals you don't connect your work to impact.
    ref: "concepts.md#business-impact-framing-tie-tech-to-dollars-users-risk"
  - id: staff-archetypes-and-impact-020
    difficulty: intermediate
    tags: [business-framing, failure-mode]
    question: |
      A candidate answers every impact question purely in tech-speak ("I introduced a message
      queue, sharded the DB, and adopted the strangler pattern") with no connection to
      business outcomes. What does this most likely signal to a staff interviewer?
    options:
      - "That the candidate is clearly operating above the staff level and should probably be considered for a principal-track role"
      - "That the candidate is a genuinely great communicator who can explain deep technical decisions with real clarity and precision"
      - "That the candidate is a strong engineer who may still need a manager to connect them to impact — a downlevel signal at staff"
      - "Nothing at all — pure technical depth and breadth is exactly and only what staff interviews are designed to measure"
    answer: 2
    explanation: |
      Pure tech-speak with no business line is a classic downlevel signal at staff: it reads
      as "needs a manager to find their impact." Staff loops explicitly weight business-aware
      judgment, not technical depth alone.
    ref: "concepts.md#business-impact-framing-tie-tech-to-dollars-users-risk"
  - id: staff-archetypes-and-impact-021
    difficulty: beginner
    tags: [leading-without-authority, influence]
    question: |
      What does "leading without authority" mean at Staff+ level?
    options:
      - "Getting teams that don't report to you to change what they do, through influence — credibility, shared goals, data, and trust — rather than org power"
      - "Being promoted onto the management track so that you are granted formal authority to direct the work of other teams"
      - "Making unilateral technical decisions on your own and then enforcing them across the teams regardless of their objections"
      - "Only leading projects that happen to be staffed entirely by your own direct reports, where you already hold the authority"
    answer: 0
    explanation: |
      Staff engineers frequently need teams they don't own to change course. With no
      commanding authority, they lead via influence: credibility, aligning to shared goals,
      data/prototypes, and trust. It is not about becoming a manager or issuing edicts.
    ref: "concepts.md#leading-without-authority"
  - id: staff-archetypes-and-impact-022
    difficulty: advanced
    tags: [leading-without-authority, scenario, judgment]
    question: |
      Two teams you don't manage are drifting toward three duplicate auth implementations. No
      one owns consolidation. Which approach best demonstrates staff-level influence?
    options:
      - "Escalate immediately to your manager and ask them to use their authority to force all the teams to standardize on one implementation"
      - "Quietly build the shared auth library yourself and merge it into their services, so the teams have no real choice but to adopt it"
      - "Post in the wide company channel that the teams are duplicating effort and wasting time, and that they need to coordinate better"
      - "Write a one-page problem statement framed around each team's own pain, build a small prototype, do 1:1s with each tech lead before the architecture forum, and let the teams co-own the interface"
    answer: 3
    explanation: |
      The strong move frames the problem in *their* terms, brings a prototype (evidence not
      opinion), builds consensus in 1:1s before the meeting (nemawashi), and gives co-ownership
      so it's genuinely theirs. Escalating first, force-merging a shadow system, or
      public shaming all signal an inability to influence peers.
    ref: "concepts.md#leading-without-authority"
  - id: staff-archetypes-and-impact-023
    difficulty: advanced
    tags: [leading-without-authority, data, credibility]
    question: |
      A senior peer strongly disagrees with your proposed approach in a design review. Which
      response best builds staff-level credibility?
    options:
      - "Bring data or a small prototype/benchmark to test both positions, and publicly change your mind if the evidence favors theirs"
      - "Restate your original position more forcefully and repeatedly in the review until the peer eventually stops raising objections"
      - "Pull rank by pointing to your title, your staff level, and your greater number of years of experience in the domain"
      - "Verbally agree with them in the room to avoid an awkward conflict, and then quietly go build your own version afterward anyway"
    answer: 0
    explanation: |
      Strong opinions loosely held: let data and prototypes resolve it, and changing your mind
      publicly when the evidence points the other way actually *builds* credibility. Pushing
      harder, pulling rank, or covertly building your version all erode trust and influence.
    ref: "concepts.md#leading-without-authority"
  - id: staff-archetypes-and-impact-024
    difficulty: intermediate
    tags: [leading-without-authority, escalation]
    question: |
      When is escalating to a manager or VP a *strong* staff move rather than a weak one?
    options:
      - "As your very first response, the moment any peer disagrees with you, so a leader can settle the dispute before it drags on"
      - "Never under any circumstances — reaching for escalation always signals that you are unable to influence your peers on your own"
      - "As a last resort, brought with clear options and a recommendation rather than just a complaint, when you've genuinely exhausted peer-level alignment"
      - "Whenever a decision is taking a bit longer than you'd personally like, to speed things along and keep the project on schedule"
    answer: 2
    explanation: |
      Escalation isn't inherently weak — knowing *when* to escalate and doing it *well* (as a
      last resort, with options and a recommendation, not a complaint) is itself a staff
      signal. Escalating first-thing or over minor delays is the weak pattern; "never" is also
      wrong because some decisions genuinely need a leader.
    ref: "concepts.md#leading-without-authority"
  - id: staff-archetypes-and-impact-025
    difficulty: advanced
    tags: [leading-without-authority, failure-mode]
    question: |
      Which of these answers to "how did you get another team to adopt your approach?" is the
      WEAKEST seniority signal?
    options:
      - "I framed it around their on-call pain and let them co-own the interface, so it became their solution too."
      - "I kept pushing back in every meeting until they finally gave in."
      - "I built a prototype and benchmarked it so the data made the case for me."
      - "I ran 1:1s with each lead beforehand to understand and address their concerns."
    answer: 1
    explanation: |
      "Kept pushing until they gave in" is wearing people down, not aligning them — the weak
      pattern. The others (framing in their terms + co-ownership, data/prototype, pre-meeting
      1:1s) are all genuine influence techniques that produce real buy-in.
    ref: "concepts.md#leading-without-authority"
  - id: staff-archetypes-and-impact-026
    difficulty: beginner
    tags: [sponsorship, mentorship, definitions]
    question: |
      What is the core difference between mentorship and sponsorship?
    options:
      - "Mentorship is a paid, formal arrangement, whereas sponsorship is done informally and without any compensation involved"
      - "Mentorship is strictly for junior engineers early in their careers, whereas sponsorship is reserved only for same-level peers"
      - "They are fundamentally the same activity, just described with two different words that people use interchangeably"
      - "Mentorship is advising (talking *to* someone, sharing knowledge/feedback); sponsorship is advocating (talking *about* someone to decision-makers and spending your capital to create opportunities for them)"
    answer: 3
    explanation: |
      "Mentors talk to you; sponsors talk about you when you're not in the room." Sponsorship
      spends your reputation/capital to create opportunities (stretch projects, promo advocacy),
      which is higher-scope and higher-risk than advising.
    ref: "concepts.md#sponsorship-vs-mentorship"
  - id: staff-archetypes-and-impact-027
    difficulty: intermediate
    tags: [sponsorship, scenario, leverage]
    question: |
      Which action is an example of SPONSORSHIP rather than mentorship?
    options:
      - "Putting a promising engineer's name forward to lead a high-visibility migration and publicly backing them to the decision-makers"
      - "Explaining to a junior engineer how you personally would approach a tricky design problem they are currently stuck on"
      - "Reviewing someone's pull request carefully and giving them detailed, constructive feedback on how to improve the code"
      - "Answering an engineer's questions about how the legacy codebase works during an informal chat over coffee"
    answer: 0
    explanation: |
      Sponsorship = advocacy that spends your capital: nominating someone for a stretch
      opportunity and publicly backing them to those who decide. The others are all mentorship
      (advising, feedback, answering questions).
    ref: "concepts.md#sponsorship-vs-mentorship"
  - id: staff-archetypes-and-impact-028
    difficulty: advanced
    tags: [sponsorship, mentorship, failure-mode]
    question: |
      A candidate's every people-growth story is "I mentored junior engineers by answering
      their questions and reviewing their code." Why might this leave them scored at Senior
      rather than Staff?
    options:
      - "Mentorship is essentially worthless as a signal and staff interviewers deliberately ignore any story that centers on it"
      - "Because junior engineers actually cannot be mentored in a meaningful way — only same-level peers are able to benefit from it"
      - "It's all 1:1 advising; without at least one sponsorship story (spending your capital to create opportunities) and a direction-setting story, it reads as Senior-scope growth, not staff-level leverage"
      - "Because reviewing other engineers' code is simply not considered part of a staff-level engineer's actual job responsibilities"
    answer: 2
    explanation: |
      Mentorship is valuable but if *every* story is 1:1 advice you look Senior. Adding
      sponsorship (you had capital and spent it advocating for others) and direction-setting
      demonstrates the higher-scope leverage the staff bar expects.
    ref: "concepts.md#sponsorship-vs-mentorship"
  - id: staff-archetypes-and-impact-029
    difficulty: intermediate
    tags: [sponsorship, risk]
    question: |
      Compared to mentorship, sponsorship carries more personal risk for the staff engineer.
      Why is that risk itself a positive seniority signal?
    options:
      - "It shows you are reckless and cavalier with your decisions, taking on risk without thinking through the potential downside"
      - "It shows you have accumulated organizational capital AND are willing to spend it to multiply others — you put your reputation on the line to create their opportunity"
      - "It shows you tend to avoid taking direct responsibility for outcomes by attaching your name to other people's work instead"
      - "It shows you generally prefer working alone rather than with others, and lean on sponsorship to keep collaboration at arm's length"
    answer: 1
    explanation: |
      Sponsorship puts your reputation on the line ("I vouched for them"). Doing it
      demonstrates you both *have* organizational capital and *choose to spend it* on growing
      others — a multiplier act that requires and signals real standing.
    ref: "concepts.md#sponsorship-vs-mentorship"
  - id: staff-archetypes-and-impact-030
    difficulty: intermediate
    tags: [staff-project, definition]
    question: |
      What best characterizes a "staff project" — the flagship story most staff+ loops probe
      for?
    options:
      - "The single hardest algorithm or data structure you have ever designed and implemented entirely on your own"
      - "A project your manager scoped in full detail, planned out, and then handed to you as a well-defined task to execute"
      - "Any sufficiently large project where you personally wrote more than 10,000 lines of production code end to end"
      - "A large, ambiguous, cross-team/cross-org effort that YOU drove — you defined scope, aligned teams you didn't own, made real trade-offs, and delivered a durable, measurable outcome"
    answer: 3
    explanation: |
      The staff project is a big, fuzzy, cross-team effort you *drove* (not one handed to you
      fully-scoped). It's where archetype, leverage, business framing, and leading-without-
      authority all show up at once. Line count and lone algorithm feats aren't the point.
    ref: "concepts.md#the-staff-project-driving-a-big-ambiguous-cross-team-effort"
  - id: staff-archetypes-and-impact-031
    difficulty: advanced
    tags: [staff-project, ownership, depth-probe]
    question: |
      A candidate claims "we migrated to microservices" as their staff project but cannot
      answer "who decided the service boundaries and why?" What is the likely outcome, and the
      lesson?
    options:
      - "They get downleveled: the depth-probe exposes that they didn't actually drive the project. Lesson: only claim projects whose judgment calls you can defend several follow-ups deep"
      - "No real impact on the result — interviewers rarely probe design decisions that deeply at the staff level anyway"
      - "They pass the round, because simply having led a microservices migration is impressive enough on its own to clear the bar"
      - "The interviewer will politely move on to a completely different topic in order to spare the candidate any embarrassment"
    answer: 0
    explanation: |
      Staff interviewers dig until they find the edge of your ownership. If you scoped the
      work you can go deep; if your manager really drove it, the depth-probe exposes it and you
      get downleveled. Only claim projects where you can defend the key judgment calls.
    ref: "concepts.md#the-staff-project-driving-a-big-ambiguous-cross-team-effort"
  - id: staff-archetypes-and-impact-032
    difficulty: advanced
    tags: [staff-project, preparation]
    question: |
      How deeply should you prepare your primary staff project before a loop?
    options:
      - "Just the headline result and the top-line metric — interviewers at this level rarely ask more than one or two follow-ups"
      - "Memorize a fixed, polished 90-second script covering the highlights and refuse to deviate from it no matter what they ask"
      - "To 'depth-3': able to survive three follow-ups deep on the trade-offs, the org dynamics, and what you'd do differently — because interviewers dig until they hit the edge of your ownership"
      - "Prepare five different shallow projects instead of one deep one, so you always have another example ready to switch to"
    answer: 2
    explanation: |
      Prepare one project to depth-3: you should withstand "why X over Y?" three follow-ups
      deep on trade-offs, org dynamics, and lessons. That depth is exactly what distinguishes
      real ownership from a rehearsed headline. A rigid script or many shallow stories fail
      the probe.
    ref: "concepts.md#the-staff-project-driving-a-big-ambiguous-cross-team-effort"
  - id: staff-archetypes-and-impact-033
    difficulty: intermediate
    tags: [staff-project, signals]
    question: |
      Which of the following is LEAST important in making a project read as "staff-sized"?
    options:
      - "You resolved genuine ambiguity by defining scope and success metrics yourself"
      - "You personally wrote the largest share of the code among everyone involved"
      - "It had cross-team blast radius, requiring you to align teams you didn't own"
      - "You can articulate the real trade-offs and what you chose not to do, with a measurable outcome"
    answer: 1
    explanation: |
      Staff-sizing is about ambiguity resolved, cross-team blast radius, driving the direction,
      defensible trade-offs, and measurable durable outcome — NOT about writing the most code.
      Volume of personal code is a Senior/individual metric, not a staff signal.
    ref: "concepts.md#the-staff-project-driving-a-big-ambiguous-cross-team-effort"
  - id: staff-archetypes-and-impact-034
    difficulty: beginner
    tags: [measuring-impact, metrics]
    question: |
      When narrating impact, what structure makes a metric credible?
    options:
      - "Just state the single biggest-sounding number you can find, with no baseline or context, so the impact lands as large"
      - "Avoid numbers entirely and instead describe in detail how difficult, stressful, and demanding the work felt at the time"
      - "Only cite metrics that are precise to two decimal places, since exact-looking figures always read as more credible"
      - "Give baseline → after → over what population (e.g. 'lead time dropped from ~2 weeks to 2 days across ~8 teams')"
    answer: 3
    explanation: |
      A credible metric has a baseline, an after, and the population/scope it applies to.
      "Trust me it was big" doesn't score, but neither does a lone impressive-sounding number
      with no baseline or scope.
    ref: "concepts.md#measuring-and-narrating-impact"
  - id: staff-archetypes-and-impact-035
    difficulty: intermediate
    tags: [measuring-impact, velocity, leverage]
    question: |
      You want to demonstrate MULTIPLIER impact (leverage), not just individual output. Which
      metric family best supports that claim?
    options:
      - "The total number of lines of production code you personally wrote across the project from start to finish"
      - "The number of hours you worked per week and how many late nights and weekends you put into the effort"
      - "Velocity/leverage metrics: teams unblocked, deploy frequency, lead time, onboarding time, number of teams adopting your solution"
      - "The number of planning and coordination meetings you personally attended over the course of the initiative"
    answer: 2
    explanation: |
      Multiplier claims are best backed by velocity/leverage metrics — teams unblocked, deploy
      frequency, lead time, adoption count — because they measure the *increased output of
      others*. Personal LOC and hours measure individual effort, not leverage.
    ref: "concepts.md#measuring-and-narrating-impact"
  - id: staff-archetypes-and-impact-036
    difficulty: advanced
    tags: [measuring-impact, vanity-metrics, failure-mode]
    question: |
      Which pair of narration habits does the material call out as anti-patterns to avoid?
    options:
      - "Vanity metrics (e.g. 'I wrote 12 design docs' — output, not outcome) and false precision (e.g. '+23.4%' with no credible source)"
      - "Framing every metric as a clear baseline-to-after change and always naming the affected population and scope"
      - "Estimating impact defensibly from reasonable assumptions and clearly labeling those estimates as estimates"
      - "Using 'we' for the shared team outcomes while being crisp about 'I' for your own specific decisions and calls"
    answer: 0
    explanation: |
      Vanity metrics measure activity/output, not outcome; false precision fabricates
      credibility that collapses under scrutiny. Honest magnitude with baseline/population is
      the fix. The other options describe *good* narration habits.
    ref: "concepts.md#measuring-and-narrating-impact"
  - id: staff-archetypes-and-impact-037
    difficulty: advanced
    tags: [measuring-impact, we-vs-i, credit]
    question: |
      How should you balance "we" and "I" when narrating a collaborative staff project?
    options:
      - "Use 'I' for absolutely everything in the story so that your personal contribution is completely unmistakable to the interviewer"
      - "Use 'we' for the team outcome but be crisp about 'I' for your specific decisions and leverage — all-'we' hides your contribution, all-'I' reads as a credit-taker"
      - "Use 'we' for everything throughout the whole story so that you consistently come across as a humble and collaborative team player"
      - "Avoid personal pronouns entirely and describe all the events neutrally in the passive voice to keep the focus on the work"
    answer: 1
    explanation: |
      Staff work is collaborative, so credit the team ("we shipped X") but be precise about
      your own decisions/leverage ("I decided the rollout order and unblocked two teams").
      All-"I" reads as credit-taking (can't collaborate); all-"we" hides what *you* did.
    ref: "concepts.md#measuring-and-narrating-impact"
  - id: staff-archetypes-and-impact-038
    difficulty: intermediate
    tags: [measuring-impact, people-metrics, sponsorship]
    question: |
      You claim strong people-growth leverage. Which phrasing best quantifies it at staff
      level?
    options:
      - "3 of the 5 engineers I sponsored for stretch roles were promoted within a year."
      - "I mentored a lot of people across several different teams over the course of many years."
      - "I'm widely known as the go-to person that everyone comes to with their hardest questions on my team."
      - "I really care about helping the people around me grow and reach their full potential as engineers."
    answer: 0
    explanation: |
      People leverage should be quantified with outcomes: sponsored → promoted, with numbers
      and a timeframe. The others are unquantified sentiment or reputation claims that don't
      demonstrate measurable multiplier impact.
    ref: "concepts.md#measuring-and-narrating-impact"
  - id: staff-archetypes-and-impact-039
    difficulty: intermediate
    tags: [judgment-over-coding, loop-design]
    question: |
      Why do staff+ interview loops weight judgment and influence more heavily than raw coding
      speed?
    options:
      - "Because staff engineers never write code anymore and spend all of their time in design and planning discussions"
      - "Because coding rounds are actually prohibited by hiring policy once a candidate is being assessed at the staff level"
      - "Because companies simply assume every staff candidate is already equally strong at coding, so it isn't worth testing"
      - "Because the failure mode at staff is rarely 'can't code' — it's 'built the wrong thing,' 'made a costly call,' or 'couldn't align teams'; loops are designed to find those risks, and judgment shows up in trade-off/behavioral/design rounds, not in coding speed"
    answer: 3
    explanation: |
      The expensive staff failure modes are judgment/influence failures, not coding-speed
      failures — so loops emphasize behavioral, design, and deep-dive rounds where judgment is
      visible. Coding still exists (no-red-flags bar) but carries less weight.
    ref: "concepts.md#why-staff-interviews-weigh-judgment-and-influence-over-coding"
  - id: staff-archetypes-and-impact-040
    difficulty: intermediate
    tags: [judgment-over-coding, coding-round]
    question: |
      At staff+ level, what is the realistic purpose of the coding round?
    options:
      - "To clear a 'no red flags / can still build' bar — coding still matters, but its weight drops and its purpose shifts from 'fastest' to 'competent and no concerns'"
      - "To identify the single fastest algorithmic problem-solver among the candidates and rank them primarily on raw coding speed"
      - "It serves no real assessment purpose at this level and is only kept around out of institutional habit and tradition"
      - "To fully replace the system-design and behavioral rounds, since coding ability is a reliable proxy for both of those"
    answer: 0
    explanation: |
      Coding doesn't vanish at staff — but the bar is "no red flags, can still build," not
      "fastest LeetCode." Keep coding sharp enough to avoid a no-hire while over-indexing prep
      on story depth, trade-offs, and scope narration.
    ref: "concepts.md#why-staff-interviews-weigh-judgment-and-influence-over-coding"
  - id: staff-archetypes-and-impact-041
    difficulty: advanced
    tags: [judgment-over-coding, reverse-question, leveling]
    question: |
      A staff loop turns out to be entirely algorithm puzzles with no design or behavioral
      depth. Which reverse-question is both fair and reveals how the company levels?
    options:
      - "Why is this loop so much easier and more narrowly scoped than what I had been led to expect for this level?"
      - "Since I'm interviewing at a senior level, could we just skip the algorithm coding rounds altogether for me?"
      - "How does this loop assess staff-level scope and influence, versus individual coding ability?"
      - "Do you honestly realize that algorithm puzzles like these are essentially a complete waste of everyone's time?"
    answer: 2
    explanation: |
      An all-puzzle loop is a yellow flag about how a company levels. Asking how the loop
      assesses staff scope/influence vs individual coding is fair, professional, and diagnostic
      — companies that level well answer crisply. The other options are dismissive or
      confrontational.
    ref: "concepts.md#why-staff-interviews-weigh-judgment-and-influence-over-coding"
  - id: staff-archetypes-and-impact-042
    difficulty: advanced
    tags: [failure-modes, root-cause, judgment]
    question: |
      An interviewer asks about a production incident. Which answer best signals staff-level
      judgment?
    options:
      - "I restarted the affected service and it came back up healthy, so we considered it resolved and moved on with our day."
      - "I traced it to an unbounded queue under load, added backpressure and an alert on queue depth, then wrote a runbook and a design guideline so the whole class of issue can't recur across our services."
      - "I added a retry with a short backoff around the failing call so the error stopped showing up for users in the dashboard."
      - "I escalated the incident to the on-call engineer for that service and let them own the diagnosis and the fix from there."
    answer: 1
    explanation: |
      Staff judgment = diagnosis of the root cause + a systemic fix + prevention that
      generalizes (runbook/guideline across services). Restarting or adding a blind retry
      solves the symptom; punting to on-call shows no ownership.
    ref: "concepts.md#weak-vs-strong-staff-answers-failure-modes-interviewers-penalize"
  - id: staff-archetypes-and-impact-043
    difficulty: advanced
    tags: [failure-modes, credit-taking]
    question: |
      A candidate repeatedly says "I single-handedly designed, built, and shipped the entire
      platform that the whole org now uses." Even if impressive, why can this HURT at staff
      level?
    options:
      - "Because building an internal platform is not actually considered a staff-level activity in most engineering organizations"
      - "Because owning and delivering a platform is always the engineering manager's responsibility rather than an IC's job"
      - "Because interviewers tend to instinctively dislike candidates who come across as confident and sure of themselves"
      - "Because the all-'I' credit-taking framing suggests they can't do collaborative/multiplier work — and it invites a depth-probe that may expose the contributions of others they erased"
    answer: 3
    explanation: |
      "Single-handedly / I did everything" reads as a credit-taker who can't collaborate — the
      opposite of the multiplier signal — and invites probing that exposes erased collaborators.
      Staff work is inherently collaborative; crisp "I" for your decisions + "we" for the
      outcome is stronger.
    ref: "concepts.md#weak-vs-strong-staff-answers-failure-modes-interviewers-penalize"
  - id: staff-archetypes-and-impact-044
    difficulty: expert
    tags: [failure-modes, three-questions, synthesis]
    question: |
      According to the material, every strong staff story should implicitly answer three
      questions. Which set is correct?
    options:
      - "How big was it (scope)? Did you make the right call and can you defend the trade-off (judgment)? How did it make the org better beyond your own output (leverage/influence)?"
      - "How much code did you personally write? How many hours did you put in? And how many bugs did you find and fix?"
      - "Who was your manager on the project? What was your official job title at the time? And what was your salary then?"
      - "How new and cutting-edge is the technology? How trendy is the stack right now? And how complex is the resulting code?"
    answer: 0
    explanation: |
      Scope + judgment + leverage/influence are the three implicit questions. A story that hits
      all three honestly scores at staff; one that only shows "I built a hard thing well" scores
      at Senior regardless of how hard the thing was.
    ref: "concepts.md#weak-vs-strong-staff-answers-failure-modes-interviewers-penalize"
  - id: staff-archetypes-and-impact-045
    difficulty: advanced
    tags: [preening, work-on-what-matters, judgment]
    question: |
      Larson warns against "preening." What is it, and why is it dangerous?
    options:
      - "Spending too long polishing code style and formatting; dangerous because it quietly wastes time that could go to real work"
      - "Refusing to take on any visible or public-facing work at all; dangerous because you end up overlooked when credit is handed out"
      - "Low-impact but high-visibility work; dangerous because companies often conflate visibility with impact, so it can be rewarded short-term while undermining real growth and impact"
      - "Over-preparing and over-rehearsing for interviews; dangerous because you end up sounding scripted, robotic, and rehearsed"
    answer: 2
    explanation: |
      Preening is a seductive subset of "snacking": low-impact, high-visibility work.
      It's dangerous because visibility gets mistaken for impact — optimizing for it may pay
      off short-term but leaves you accountable for missing real impact, and interviewers can
      often tell.
    ref: "concepts.md#measuring-and-narrating-impact"
  - id: staff-archetypes-and-impact-046
    difficulty: expert
    tags: [work-on-what-matters, existential, prioritization]
    question: |
      Applying Larson's "work on what matters," how should a staff engineer prioritize when
      the company faces an existential threat (e.g. a make-or-break reliability crisis) versus
      an efficiency improvement?
    options:
      - "Always choose the efficiency work first, because it has a cleaner ROI calculation and a more predictable, measurable payoff"
      - "Address the existential issue first — nothing else matters if the company doesn't survive that round; efficiency logic doesn't apply when the walls are crashing down"
      - "Choose whichever of the two happens to be more visible to senior leadership, so your contribution gets properly noticed"
      - "Split your time exactly 50/50 between the two efforts regardless of the stakes, so that neither one is ever fully neglected"
    answer: 1
    explanation: |
      Existential issues come first: if the company loses a survival round, nothing else you
      did will matter. Efficiency/ROI reasoning is for when the walls aren't crashing down.
      Choosing by visibility is preening; a rigid 50/50 ignores the stakes.
    ref: "concepts.md#multiplier-impact-leverage-over-individual-output"
  - id: staff-archetypes-and-impact-047
    difficulty: intermediate
    tags: [boundaries, cross-reference]
    question: |
      In this library, where does the TECHNICAL system-design interview method (how to drive a
      whiteboard design) live, relative to this topic?
    options:
      - "It lives in system-design/interview-method-scenario-playbooks; this topic points there and focuses on behavioral, career, communication, and impact-narration instead"
      - "It is fully re-taught here inside this staff-archetypes topic, which duplicates the whiteboard design method in its own dedicated section"
      - "It lives entirely within the dsa-coding domain, alongside the algorithm and data-structure interview preparation material"
      - "There is no such system-design interview-method content authored anywhere in this library at the present time"
    answer: 0
    explanation: |
      The technical system-design method is owned by
      system-design/interview-method-scenario-playbooks. This interview-craft topic covers the
      non-technical craft (archetypes, impact, influence, narration) and cross-references
      rather than duplicating the design method.
    ref: "concepts.md#why-staff-interviews-weigh-judgment-and-influence-over-coding"
  - id: staff-archetypes-and-impact-048
    difficulty: advanced
    tags: [archetypes, scope, scenario]
    question: |
      A recruiter says the role is to "partner with the VP of Engineering on a cross-org
      technical-debt program spanning six teams, representing engineering in leadership
      forums." Which archetype should you prepare stories for, and what kind of story fits
      best?
    options:
      - "Solver — a story about diving deep and solving one especially gnarly production bug entirely on your own"
      - "Tech Lead — a story about running one team's daily standup and keeping its sprint work on track week to week"
      - "Architect — a story about designing the data schema and API for one service and documenting it for the team"
      - "Right Hand — a story about executing a senior leader's agenda across many teams you didn't own, coordinating and representing the effort at the org level"
    answer: 3
    explanation: |
      "Partner with the VP / cross-org program / represent engineering" signals the Right Hand
      archetype: extending a senior leader's capacity across many teams. Bring a story of
      driving a leader's agenda org-wide, not a lone bug-fix, single-team standup, or single
      schema design.
    ref: "concepts.md#reading-which-archetype-the-role-wants"
  - id: staff-archetypes-and-impact-049
    difficulty: expert
    tags: [glue-work, prioritization, judgment]
    question: |
      Larson advises doing new-value / unsupported glue work "as little as you can, but no
      less." What judgment does this capture for a promo-track staff engineer?
    options:
      - "Glue work is always beneath a staff engineer, so you should decline to do any of it and leave it for more junior people"
      - "Do as much glue work as you possibly can, because the visibility it brings you will always help your case at promo time"
      - "Teaching an org to value something new is the hardest work and often fails without support, so do the essential minimum — but don't neglect genuinely critical glue that no one else will attend to"
      - "Only take on glue work in the cases where your manager has explicitly assigned it to you as part of your formal goals"
    answer: 2
    explanation: |
      The maxim balances two failure modes: unsupported new-value work often erodes without
      org backing (and can stall a promo if it crowds out visible technical leadership), yet
      some critical glue truly won't happen unless you do it. So do the minimum necessary — but
      no less than that.
    ref: "concepts.md#glue-work-and-the-invisible-impact-trap"
  - id: staff-archetypes-and-impact-050
    difficulty: expert
    tags: [synthesis, scenario, judgment, multiplier]
    question: |
      In a hiring-manager round you have one story: you led a nine-month effort to replace a
      brittle shared data pipeline used by five teams. Which single-sentence framing opens the
      story with the strongest staff signal?
    options:
      - "I wrote a brand-new data pipeline from scratch that was far cleaner and more maintainable than the old brittle one."
      - "Our old pipeline caused ~2 incidents/month and blocked five teams from shipping; there was no owner, so I defined the scope and success metrics, aligned the five teams on a phased migration I didn't have authority over, and we cut pipeline incidents to near zero while unblocking those teams' roadmaps."
      - "It was easily the hardest project of my entire career, and I worked long nights and most weekends to finally deliver it."
      - "My manager asked me to lead the effort, and I made sure that all of the tickets across the teams got done on time."
    answer: 1
    explanation: |
      The strong opener hits all three staff questions at once: scope (five teams, ~2
      incidents/month), judgment/ambiguity (no owner, you defined scope and drove a phased
      migration), leverage/influence (aligned teams you didn't own, unblocked their roadmaps),
      and outcome (incidents to near zero). The others are individual-output, effort-only, or
      manager-scoped executor framings.
    ref: "concepts.md#the-staff-project-driving-a-big-ambiguous-cross-team-effort"
