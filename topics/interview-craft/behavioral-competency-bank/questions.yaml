topic: "The Competency Bank: Conflict, Failure, Ambiguity & More"
domain: interview-craft
topic_slug: behavioral-competency-bank
version: 1
questions:
  - id: behavioral-competency-bank-001
    difficulty: beginner
    tags: [story-bank, preparation, mapping]
    question: |
      What is the recommended way to prepare for a behavioral loop that
      probes many different competencies (conflict, failure, ambiguity,
      influence, etc.)?
    options: ["Build a bank of 8–12 real stories, each tagged to the competencies it can demonstrate", "Memorize a single perfect story and steer every question toward it", "Improvise fresh examples in the moment so answers feel spontaneous", "Prepare only for the one competency the company is known to weight most"]
    answer: 0
    explanation: |
      Most strong stories cover 2–4 competencies, so a bank of 8–12 real,
      tagged stories can cover the whole rubric while keeping recall instant
      under pressure. One story can't cover everything, and improvising loses
      the structure and quantified results interviewers score on.
    ref: "concepts.md#mapping-stories-to-competencies"
  - id: behavioral-competency-bank-002
    difficulty: intermediate
    tags: [conflict, disagree-and-commit, signal]
    question: |
      An interviewer asks about a technical disagreement. Which ending best
      demonstrates the "disagree and commit" signal rather than an ego signal?
    options: ["You held your ground firmly until the other person finally admitted that you had been right all along", "You escalated to your manager, who reviewed both positions and ultimately ruled in your favor", "You avoided the disagreement to keep the peace and did it your own way quietly", "You lost the argument on the merits, committed fully to the team's choice, and helped make it succeed"]
    answer: 3
    explanation: |
      "Have Backbone; Disagree and Commit" values committing fully to a
      decision even when you argued against it. A story where you lost, then
      committed and drove success, shows maturity and that you can be trusted
      with autonomy — far stronger than an "I was right" or escalation ending.
    ref: "concepts.md#conflict-and-disagreement"
  - id: behavioral-competency-bank-003
    difficulty: intermediate
    tags: [conflict, data-over-ego]
    question: |
      In a conflict story, what most reliably signals that you disagree
      productively rather than just forcefully?
    options: ["You describe how strongly and how many times you re-argued your position until they backed down", "You brought data (a benchmark, prototype, or cost model) and can articulate the other side's strongest argument", "You note that everyone in the room eventually came around and agreed with your position", "You explain that you were the more experienced engineer in the room, so your view naturally carried more weight"]
    answer: 1
    explanation: |
      Productive disagreement is data over ego plus genuine listening: bringing
      evidence and being able to steelman the opposing view shows you engaged
      with the substance, not the personalities. Volume, seniority, and
      "everyone agreed with me" all read as ego signals.
    ref: "concepts.md#conflict-and-disagreement"
  - id: behavioral-competency-bank-004
    difficulty: advanced
    tags: [failure, ownership, red-flag]
    question: |
      "Tell me about your biggest failure." Which answer is the strongest?
    options: ["'I shipped an un-canaried Friday config change that took down checkout for 40 minutes; I owned the postmortem and drove a policy that all config changes go through the canary pipeline.'", "'Honestly my biggest failure is that I care too much and set the bar so high that the team sometimes struggled to keep up with my standards.'", "'A project failed, but honestly it was because QA missed the bug and the PM kept changing requirements.'", "'We shipped about two weeks late because of some integration delays, but the launch turned out to be a huge success with customers anyway.'"]
    answer: 0
    explanation: |
      The strong answer has a real cost, explicit personal ownership, a root
      cause in the candidate's own judgment, and a systemic fix that stuck.
      The others are the three classic traps: humblebrag, throwing others
      under the bus, and a fake failure that dodges the question.
    ref: "concepts.md#failure-mistakes-and-the-time-you-were-wrong-trap"
  - id: behavioral-competency-bank-005
    difficulty: advanced
    tags: [wrong, updating, trap]
    question: |
      "Tell me about a time you were wrong." What is the trap, and what signal
      is really being tested?
    options: ["The trap is admitting fault at all; the test is whether you can stay confident and never concede you were mistaken", "The trap is picking a technical example instead of an interpersonal one; the test is really your communication and storytelling skills", "The trap is giving too much specific detail; the test is whether you can keep the answer high-level and abstract", "The trap is reframing it into a story where you turned out right; the test is intellectual honesty and updating on evidence"]
    answer: 3
    explanation: |
      Many candidates smuggle in a story where they were ultimately right. The
      question tests whether you can hold a position, be proven wrong by
      evidence, and update — being wrong and changing is the win condition, not
      a confession to minimize.
    ref: "concepts.md#failure-mistakes-and-the-time-you-were-wrong-trap"
  - id: behavioral-competency-bank-006
    difficulty: intermediate
    tags: [failure, growth, structure]
    question: |
      A failure story is missing one element that interviewers most penalize
      its absence. Which element makes a failure story land?
    options: ["A concrete behavior change afterward, with evidence it stuck", "A dramatic, high-visibility incident that lots of senior people were watching at the time", "A careful explanation of which teammates and other stakeholders were also partly responsible for it", "A reassurance that the same problem never happened again, mostly because you got lucky afterward"]
    answer: 0
    explanation: |
      Without "here's what I do differently now" (and ideally proof it caught
      later problems), the story has no growth signal — the whole point of the
      failure question. Drama, spreading blame, and luck don't demonstrate
      learning.
    ref: "concepts.md#failure-mistakes-and-the-time-you-were-wrong-trap"
  - id: behavioral-competency-bank-007
    difficulty: advanced
    tags: [failed-project, sunk-cost, judgment]
    question: |
      What most distinguishes a strong "a project that failed" answer from a
      strong "a personal mistake" answer?
    options: ["The failed-project answer should assign no blame to yourself since the project was a team effort", "The failed-project answer should focus on how you eventually rescued the project to success", "There is no meaningful difference between the two; you can safely use the exact same story to answer either question", "The failed-project answer should show judgment about systemic causes and knowing when to cut losses, fighting sunk-cost bias"]
    answer: 3
    explanation: |
      A failed project tests reasoning about systemic failure, sunk cost, and
      when to kill something — recognizing failure early and cutting losses is
      the signal. It still needs your leverage points (some ownership), and a
      genuine failure, not a secretly-rescued success.
    ref: "concepts.md#a-project-that-failed-vs-a-mistake-you-made"
  - id: behavioral-competency-bank-008
    difficulty: intermediate
    tags: [failed-project, ownership, selection]
    question: |
      Which "failed project" story is the weakest choice to tell?
    options: ["A project where you validated the riskiest assumption late and had to stop, then repurposed the work", "A project you argued to kill early after A/B data showed no lift", "A project on another team where you were a bystander and had no real role", "A project that failed on a market assumption you now test cheaply up front"]
    answer: 2
    explanation: |
      A story where you were a bystander with no agency shows no ownership and
      nothing to score. The strong options all reveal your judgment — killing
      early, fighting sunk cost, and extracting a transferable lesson.
    ref: "concepts.md#a-project-that-failed-vs-a-mistake-you-made"
  - id: behavioral-competency-bank-009
    difficulty: intermediate
    tags: [difficult-teammate, empathy, red-flag]
    question: |
      Asked about a difficult teammate, a candidate says: "He was toxic and
      lazy and everyone on the team hated working with him." What does this
      most signal to the interviewer?
    options: ["That the candidate holds admirably high standards for collaboration and won't tolerate poor teammates", "That the candidate may badmouth colleagues — and might badmouth us — with no empathy or agency shown", "That the teammate really was the entire problem and the candidate was simply an innocent victim of it", "That the candidate is refreshingly honest and direct about problems most people would sugar-coat"]
    answer: 1
    explanation: |
      Labeling a person's character (rather than describing behavior and
      impact) tells the interviewer more about the candidate than the teammate:
      it predicts badmouthing and shows no empathy or agency. Strong answers
      describe behavior neutrally and show effort to understand and improve.
    ref: "concepts.md#dealing-with-a-difficult-teammate-or-manager"
  - id: behavioral-competency-bank-010
    difficulty: advanced
    tags: [difficult-manager, managing-up, agency]
    question: |
      Your manager reviews every decision in detail, slowing the team down.
      Which response best demonstrates emotional maturity and agency?
    options: ["Keep your head down and quietly wait it out until an opening lets you transfer to a different team", "Complain to skip-level leadership that the manager is a micromanager who is slowing everyone down", "Assume the manager is accountable for a fragile system, proactively send a weekly plan and risk-list to reduce their uncertainty, and earn more autonomy", "Ignore the reviews entirely and start making the decisions unilaterally so the team can move faster"]
    answer: 2
    explanation: |
      Seeking to understand the pressure driving the behavior and then reducing
      the manager's uncertainty ("managing up") shows empathy plus agency and
      often earns trust and autonomy. Avoidance, going over their head first,
      and defiance all read as immaturity.
    ref: "concepts.md#dealing-with-a-difficult-teammate-or-manager"
  - id: behavioral-competency-bank-011
    difficulty: advanced
    tags: [deadline, scope, heroics]
    question: |
      Two weeks from a hard launch date, it's clear the full feature won't be
      ready. Which response sends the strongest senior signal?
    options: ["Commit to the date and plan to work nights and weekends to personally push it over the line", "Triage must-haves vs deferrable, propose shipping the core flow now with the dashboard following, and get stakeholder buy-in on the trade-off", "Silently cut test coverage and code review to hit the date, betting it works out", "Keep the risk to yourself and hope the remaining work goes faster than expected"]
    answer: 1
    explanation: |
      The strong signal under pressure is transparent scope negotiation, not
      heroics or corner-cutting. Making the trade-off explicit and protecting
      quality/communication beats a death march (poor planning, doesn't scale)
      or hiding risk (which erodes trust and reliability).
    ref: "concepts.md#tight-deadlines-and-working-under-pressure"
  - id: behavioral-competency-bank-012
    difficulty: intermediate
    tags: [deadline, hero-antipattern]
    question: |
      Why is "I worked 90-hour weeks and personally saved the launch" a weak
      answer to a working-under-pressure question?
    options: ["It shows you can't code fast enough, so you have to make up the gap with sheer extra hours", "It reveals that you don't really care about the product, only about being seen as a hard worker", "It's actually a strong answer that clearly demonstrates commitment and a willingness to sacrifice", "It signals poor planning, is unsustainable, and doesn't scale — effort isn't impact"]
    answer: 3
    explanation: |
      The hero narrative signals that the crunch resulted from poor planning and
      that your approach is unsustainable and unscalable. Interviewers want
      prioritization, early de-risking, and scope negotiation — effort is not a
      substitute for impact.
    ref: "concepts.md#tight-deadlines-and-working-under-pressure"
  - id: behavioral-competency-bank-013
    difficulty: intermediate
    tags: [ambiguity, driving-clarity, passivity]
    question: |
      The ask is "make onboarding better" — no metric, no scope. Which response
      best demonstrates handling ambiguity at a senior level?
    options: ["Interview recent signups, find the drop-off is at email verification, and write a one-page problem statement with a target metric", "Ask your manager to write a detailed spec with metrics and scope, and wait until that document exists before acting", "Start rebuilding the onboarding UI immediately, since it clearly needs work and shipping something shows initiative", "Escalate to leadership that the requirements are far too vague for anyone to reasonably act on"]
    answer: 0
    explanation: |
      Senior+ engineers make ambiguity explicit and then reduce it cheaply
      (talk to users, gather data) and produce a durable artifact that aligns
      others. Waiting for a spec or escalating is passive; jumping to build
      skips framing the actual problem.
    ref: "concepts.md#handling-ambiguity-and-driving-clarity"
  - id: behavioral-competency-bank-014
    difficulty: advanced
    tags: [ambiguity, reversible-decisions, one-way-door]
    question: |
      Under high ambiguity, how should the reversibility of a decision change
      how you handle it?
    options: ["For reversible (two-way door) decisions, decide fast and iterate; for irreversible (one-way door) ones, invest more in de-risking first", "Always gather the maximum possible data and build consensus before any decision, regardless of whether it is reversible", "Reversibility is irrelevant to how you decide; under ambiguity, moving fast always wins over deliberation", "Make the irreversible decisions quickly and early so that the ambiguity forces the whole team to commit"]
    answer: 0
    explanation: |
      The one-way vs two-way door judgment is core to driving clarity: reversible
      calls should be made fast and iterated on, while irreversible ones justify
      more investment in reducing uncertainty. Treating all decisions the same
      wastes time or takes reckless risk.
    ref: "concepts.md#handling-ambiguity-and-driving-clarity"
  - id: behavioral-competency-bank-015
    difficulty: advanced
    tags: [influence, without-authority, escalation]
    question: |
      You want three teams to adopt a shared auth library. Which approach best
      demonstrates influence without authority?
    options: ["Escalate to your manager and ask leadership to mandate that the other three teams adopt the library", "Announce in a company-wide email that your library is now the official new standard for authentication", "Wait patiently for leadership to set a top-down policy that requires every team to adopt it", "Start with the team in the most pain, build the migration tooling for them so their cost is near-zero, and turn their success into a case study others pull toward"]
    answer: 3
    explanation: |
      Influence without authority works by building a coalition, reducing the
      other side's cost, and using evidence so teams end up wanting the outcome.
      Reaching for authority (mandate/announcement/policy) outsources the
      persuasion and burns goodwill — it isn't influence.
    ref: "concepts.md#influencing-without-authority"
  - id: behavioral-competency-bank-016
    difficulty: intermediate
    tags: [influence, framing, metrics]
    question: |
      When trying to influence another team to adopt your proposal, how should
      you frame it?
    options: ["In terms of how much it will advance your own team's roadmap and quarterly goals if they help", "In terms of their metrics and incentives — e.g. 'this cuts your on-call load'", "By emphasizing how much work you have already personally put into building the thing", "By stressing that senior leadership wants it done and is expecting everyone to get on board"]
    answer: 1
    explanation: |
      Effective influence speaks the other side's metrics and incentives, not
      yours. Framing around their pain ("cuts your on-call load") gives them a
      reason to say yes; appeals to your effort, your roadmap, or authority don't
      move a team you don't manage.
    ref: "concepts.md#influencing-without-authority"
  - id: behavioral-competency-bank-017
    difficulty: advanced
    tags: [influence, staff-signal, seniority]
    question: |
      Why is "influencing without authority" often described as the senior→staff
      dividing line?
    options: ["Because staff engineers are formally granted authority and headcount over the other teams they work with", "Because senior engineers work in isolation and essentially never need to influence anyone else to succeed", "Because staff impact scales through influence across teams they don't manage, leaving standards/platforms behind, rather than through personal output", "Because at the staff level it comes down mainly to being louder and more persuasive in meetings"]
    answer: 2
    explanation: |
      Staff+ engineers rarely have positional authority over the teams they
      affect; their leverage comes from trust, data, and framing that changes how
      other teams and leaders behave — the essence of the Architect/Tech Lead
      archetypes. Senior engineers primarily influence their immediate team.
    ref: "concepts.md#influencing-without-authority"
  - id: behavioral-competency-bank-018
    difficulty: intermediate
    tags: [above-and-beyond, ownership, judgment]
    question: |
      Which is the strongest "went above and beyond" story?
    options: ["'I stayed at the office until midnight every single night for a month straight to finish all of my assigned tasks.'", "'I gold-plated a feature with a bunch of extra configuration options that nobody had actually asked for.'", "'I volunteered to take on every single task that was offered to me, regardless of how it ranked in priority.'", "'Error rates were creeping up with no clear owner, so I built a cross-service dashboard, ran a fix-it week, and cut p99 errors 60%.'"]
    answer: 3
    explanation: |
      Above-and-beyond is ownership of an unowned outcome plus the judgment that
      it mattered, ideally with a lasting mechanism and a real result. Long hours,
      gold-plating, and indiscriminate volunteering are effort or poor
      prioritization, not impact.
    ref: "concepts.md#going-above-and-beyond"
  - id: behavioral-competency-bank-019
    difficulty: advanced
    tags: [prioritization, trade-off, saying-no]
    question: |
      A security hardening task and a revenue feature are both due. Which
      reasoning best demonstrates prioritization judgment?
    options: ["Work hardest on whichever one feels most urgent this week and hope that both of them still get done in time", "Score them on impact and reversibility: sequence the irreversible security risk first, tell the PM the feature slips three weeks and why", "Do the revenue feature first, because it directly brings in money and that always comes before hardening", "Split your time evenly between the two so that neither of the two stakeholders ends up unhappy with you"]
    answer: 1
    explanation: |
      Strong prioritization names the trade-off axis and explicit criteria
      (impact, reversibility, risk), then communicates a defensible "no." A
      breach is irreversible while a feature is a two-way door, so the risk
      asymmetry makes sequencing security first defensible. Urgency ≠ importance,
      and splitting evenly dodges the decision.
    ref: "concepts.md#prioritization-and-trade-off-decisions"
  - id: behavioral-competency-bank-020
    difficulty: intermediate
    tags: [prioritization, communication, "no"]
    question: |
      What element do interviewers most want to hear in a prioritization story?
    options: ["A clearly communicated 'no' — what you deprioritized, why, and how stakeholders accepted it", "That you somehow managed to fit absolutely everything in without having to drop or defer anything at all", "That you consistently deferred to whichever stakeholder happened to ask for their thing the most loudly", "That you avoided committing to a decision yourself until someone more senior above you finally chose for you"]
    answer: 0
    explanation: |
      Prioritization judgment is about saying no and defending why with explicit
      criteria and opportunity-cost reasoning. "I did everything" conflates effort
      with judgment, and deferring to loudness or upward avoidance shows no
      ownership of the trade-off.
    ref: "concepts.md#prioritization-and-trade-off-decisions"
  - id: behavioral-competency-bank-021
    difficulty: intermediate
    tags: [feedback, coachability, defensiveness]
    question: |
      In a review, your manager says your design docs are too solution-first and
      skip problem framing. Your gut reaction is defensive. What's the best
      response to describe in an interview?
    options: ["Explain that you simply prefer diving straight into solutions and that the feedback doesn't really fit your working style", "Point out that the feedback was delivered rather poorly in the review, so you decided to set it aside for now", "Ask your manager to assign you only implementation work going forward so you can avoid having to write design docs", "Acknowledge that reviewers did keep asking 'why this approach?', start leading with a problem statement and alternatives-considered section, and note the improved review cycles"]
    answer: 3
    explanation: |
      Coachability means receiving feedback without defending, separating the
      valid signal from the delivery, acting visibly, and showing the arc of
      change with evidence. Rejecting it, dismissing it on delivery, or avoiding
      the skill entirely all signal a fixed mindset.
    ref: "concepts.md#receiving-hard-feedback-and-showing-growth"
  - id: behavioral-competency-bank-022
    difficulty: intermediate
    tags: [feedback, weakness, humblebrag]
    question: |
      "What's an area you're working on?" Which answer best demonstrates
      self-awareness and agency?
    options: ["'Honestly, I'm a bit of a perfectionist — I just care too much and hold my work to too high a bar.'", "'I don't really have any weaknesses that meaningfully affect my day-to-day work performance.'", "'I'm working on delegating instead of doing everything myself,' with a concrete example of how", "'Other people would probably have to tell you that; I genuinely can't think of a single one myself.'"]
    answer: 2
    explanation: |
      A real, specific weakness plus a concrete improvement plan shows
      self-awareness and agency — the actual signal. The perfectionist
      humblebrag, denial, and deflection all read as evasion or lack of
      reflection.
    ref: "concepts.md#receiving-hard-feedback-and-showing-growth"
  - id: behavioral-competency-bank-023
    difficulty: advanced
    tags: [story-selection, stakes, tension]
    question: |
      Which story is the weakest choice for a behavioral competency answer,
      regardless of how the candidate tells it?
    options: ["A migration where a wrong data-model call risked corrupting customer records", "A tense vendor-selection disagreement across three teams under a deadline", "An incident where a config you shipped took down checkout", "A routine ticket that you closed where everything went smoothly and nothing was ever really at risk"]
    answer: 3
    explanation: |
      A story with no stakes and no tension gives the interviewer nothing to
      score — there's no judgment to demonstrate. Real money, users, deadlines,
      or relationships at risk are what make a competency story evaluable.
    ref: "concepts.md#picking-stories-with-real-stakes"
  - id: behavioral-competency-bank-024
    difficulty: advanced
    tags: [story-selection, individual-role, we-vs-i]
    question: |
      A useful gut check for story selection: if the story would be equally true
      had a competent colleague been in your seat, what does that mean?
    options: ["It's not really about you — pick a moment where your specific judgment or action changed the outcome", "It's a safe, low-risk story to tell since nothing about it can be picked apart or challenged", "It shows that you collaborate and work well on teams, which is really the main thing being scored", "It means the story is probably too advanced and high-scope for the level of the role you're targeting"]
    answer: 0
    explanation: |
      The interviewer scores you, so the Action must isolate your specific
      contribution ("I") with the team credited in the Result. If anyone could
      have produced the same outcome, the story doesn't demonstrate your judgment.
    ref: "concepts.md#picking-stories-with-real-stakes"
  - id: behavioral-competency-bank-025
    difficulty: beginner
    tags: [red-flag, no-conflict, honesty]
    question: |
      Asked "tell me about a conflict you had at work," a candidate says "I get
      along with everyone; I've honestly never had a conflict." Why is this a
      red flag?
    options: ["It signals either no self-awareness, no real stakes in their work, or a lack of candor — and gives nothing to evaluate", "It shows the candidate is far too agreeable and conflict-averse to ever lead a team effectively", "It proves the candidate deliberately avoids all difficult or high-stakes work where friction could arise", "It's actually fine; a track record of conflict-free collaboration is the ideal answer to give here"]
    answer: 0
    explanation: |
      Everyone at a senior level has had substantive disagreements; claiming none
      reads as evasion or lack of reflection and leaves the interviewer nothing to
      score. The fix is a real, well-bounded conflict with a mature resolution.
    ref: "concepts.md#red-flag-answers-interviewers-penalize"
  - id: behavioral-competency-bank-026
    difficulty: intermediate
    tags: [red-flag, blame, ownership]
    question: |
      Which of these is the most damaging red-flag pattern in a failure or
      conflict answer?
    options: ["Quantifying the result with a specific, concrete metric that shows the impact of your actions", "Using 'I' rather than 'we' when describing the actions that you personally took in the story", "Blaming teammates, QA, or the PM with no personal ownership", "Admitting openly that the situation was genuinely stressful and difficult to work through at the time"]
    answer: 2
    explanation: |
      Throwing others under the bus predicts you'll blame teammates in real
      failures and signals poor ownership. Even if others contributed, an answer
      with zero personal accountability is disqualifying. Metrics, "I," and
      candor are all strengths.
    ref: "concepts.md#red-flag-answers-interviewers-penalize"
  - id: behavioral-competency-bank-027
    difficulty: advanced
    tags: [seniority, scope, staff-bar]
    question: |
      Two candidates each tell a "successful" conflict story. What most often
      caps a candidate at senior rather than staff?
    options: ["Telling a story that happened to involve a serious production incident with real customer impact", "Using hard data and evidence rather than opinion to support their position in the disagreement", "Every story shows them personally heroing, with no leverage, mentoring, or lasting mechanism left behind", "Admitting that the conflict was genuinely uncomfortable and hard to sit with while it was happening"]
    answer: 2
    explanation: |
      A subtle staff-level red flag is showing you can do the work but not scale
      it: no multiplier impact, no mechanism that prevents recurrence, no
      influence beyond your own hands. Absence of leverage caps your level even
      when each story "succeeds."
    ref: "concepts.md#red-flag-answers-interviewers-penalize"
  - id: behavioral-competency-bank-028
    difficulty: advanced
    tags: [seniority, conflict, staff-scope]
    question: |
      How does a staff-level conflict story typically differ from a senior-level
      one?
    options: ["Staff stories avoid conflict entirely and steer around it to demonstrate diplomacy and restraint", "Staff stories are always about decisively winning the argument and getting the other side to back down", "There is no real difference in the scope of the story, only in the job title attached to the candidate", "Staff engineers de-escalate conflict between other people/teams and install a mechanism so that class of conflict stops recurring"]
    answer: 3
    explanation: |
      Scope scales with level: a senior engineer resolves conflict with a peer and
      preserves the relationship; a staff engineer resolves conflict across teams,
      finds the shared goal both sides forgot, and installs a decision-making
      mechanism (RFC process, tie-break owner) to prevent recurrence.
    ref: "concepts.md#conflict-and-disagreement"
  - id: behavioral-competency-bank-029
    difficulty: intermediate
    tags: [mapping, second-example, depth]
    question: |
      An interviewer says "give me a different example of the same thing." What
      is this testing, and how should your bank be prepared?
    options: ["It tests memory; the trick is to memorize one flagship story word-for-word and recite it back verbatim", "It tests the depth of your experience vs one rehearsed tale; carry two stories per high-frequency competency", "It tests patience; the move is to deflect by re-telling the first story with a few more granular details added", "It tests honesty; the right response is to admit outright that you only have one real example to draw on"]
    answer: 1
    explanation: |
      Interviewers ask for a second example to distinguish real depth from a
      single rehearsed story (and sometimes because loop members compare notes).
      Keeping two stories for high-frequency competencies like conflict, failure,
      and ambiguity covers this.
    ref: "concepts.md#mapping-stories-to-competencies"
  - id: behavioral-competency-bank-030
    difficulty: intermediate
    tags: [difficult-teammate, assume-positive-intent]
    question: |
      What should you do first when addressing a "difficult" senior teammate who
      keeps blocking changes?
    options: ["Assume positive intent and seek to understand what pressure or incentive is driving the behavior (they may be protecting reliability)", "Route around them by quietly gathering approvals from other reviewers so their objections never block the change", "Document each instance of their behavior in a running log to build a paper-trail case for escalating later", "Match their energy and push back twice as hard in reviews to establish yourself as someone not to steamroll"]
    answer: 0
    explanation: |
      Assuming positive intent and understanding the driver ("the difficult senior
      engineer is often protecting reliability") lets you find the shared goal and
      address the behavior directly and privately. Routing around, case-building,
      and escalation are last resorts, not first moves.
    ref: "concepts.md#dealing-with-a-difficult-teammate-or-manager"
  - id: behavioral-competency-bank-031
    difficulty: advanced
    tags: [ambiguity, artifact, durability]
    question: |
      Why is producing a written artifact (one-pager, scoping doc, decision log)
      part of handling ambiguity well?
    options: ["It creates a documented paper trail that shields you from blame if the project later fails", "It's a mandatory step required by most companies' formal engineering and review processes", "It makes your clarity durable and shared across stakeholders instead of living only in your head", "It deliberately slows the team down just enough to keep anyone from making rushed decisions"]
    answer: 2
    explanation: |
      Driving clarity means the alignment survives beyond a hallway conversation:
      a shared artifact turns an ambiguous ask into a scoped problem multiple teams
      can align on. It's about durability and alignment, not self-protection or
      process compliance.
    ref: "concepts.md#handling-ambiguity-and-driving-clarity"
  - id: behavioral-competency-bank-032
    difficulty: beginner
    tags: [structure, star, result]
    question: |
      In a competency story's Result, what most strengthens the signal?
    options: ["A long, vivid description of just how hard the whole team worked to get there", "A complete list naming everyone who was involved and which group they came from", "An honest acknowledgment that the results were genuinely hard to measure precisely", "A quantified outcome like 'cut onboarding drop-off 15%' rather than 'it went well'"]
    answer: 3
    explanation: |
      A quantified result ("reduced p99 by 40%," "+15% completion") shows real
      impact and lets the interviewer evaluate the outcome. Vague endings, effort
      descriptions, and rosters don't demonstrate that your actions moved a metric.
    ref: "concepts.md#picking-stories-with-real-stakes"
  - id: behavioral-competency-bank-033
    difficulty: advanced
    tags: [failure, staff-bar, mechanism]
    question: |
      At the staff level, what should the "fix" in a failure story ideally be?
    options: ["A personal note-to-self, kept in your journal, to simply be more careful next time", "A sincere promise that going forward you'll always double-check your own work before shipping", "A heartfelt apology delivered to everyone on the team who was affected by the incident", "A mechanism — a review gate, guardrail, or policy — that protects others, proportional to your scope"]
    answer: 3
    explanation: |
      A staff engineer's failure should involve real scope and lead to a systemic
      fix (a review gate or guardrail) that protects the whole team/org, not just a
      personal reminder. The failure and its fix should be proportional to the
      level.
    ref: "concepts.md#failure-mistakes-and-the-time-you-were-wrong-trap"
  - id: behavioral-competency-bank-034
    difficulty: intermediate
    tags: [conflict, steelman, listening]
    question: |
      An interviewer probes: "What did the other person think?" Why does this
      follow-up matter in a conflict story?
    options: ["It checks whether you can recall the fine-grained details of the situation accurately", "It's essentially a filler question with no real scoring purpose behind it at all", "It tests empathy and whether the resolution was mutual — can you articulate the other side's view?", "It tests whether you eventually wore them down and got them to agree with your position"]
    answer: 2
    explanation: |
      Being able to state the opposing view fairly (steelman it) and describe a
      mutual resolution shows you listened and separated the person from the
      position — core to productive disagreement. It's not about winning them over.
    ref: "concepts.md#conflict-and-disagreement"
  - id: behavioral-competency-bank-035
    difficulty: intermediate
    tags: [deadline, non-negotiables, quality]
    question: |
      Under a tight deadline, which items should generally NOT be cut to hit the
      date?
    options: ["A purely nice-to-have analytics dashboard", "A secondary cosmetic UI polish pass", "Data integrity, security, and a rollback path", "An entirely optional configuration screen"]
    answer: 2
    explanation: |
      Scope negotiation cuts nice-to-haves, but data integrity, security, and a
      rollback path are non-negotiables — trading them away for a date signals
      you'll sacrifice reliability under pressure, a serious red flag. Cosmetic and
      optional features are the right things to defer.
    ref: "concepts.md#tight-deadlines-and-working-under-pressure"
  - id: behavioral-competency-bank-036
    difficulty: advanced
    tags: [deadline, staff-bar, prevention]
    question: |
      How is delivery-under-pressure judged differently at the staff level?
    options: ["Staff engineers are expected to simply work harder and put in longer hours than everyone else", "Staff engineers are judged on preventing the crunch — raising risk early, cutting scope proactively, and building slack into plans", "Staff engineers should escalate every single deadline risk straight to leadership the moment it appears", "Staff engineers are largely exempt from deadline pressure and can set their own timelines"]
    answer: 1
    explanation: |
      Heroics under pressure is a junior signal dressed up. Staff engineers prevent
      the fire drill by surfacing risk early, negotiating scope proactively, and
      building estimation buffers — the crunch shouldn't have happened.
    ref: "concepts.md#tight-deadlines-and-working-under-pressure"
  - id: behavioral-competency-bank-037
    difficulty: intermediate
    tags: [feedback, delivery-vs-signal]
    question: |
      A teammate gives you blunt, poorly-delivered feedback. What's the mature
      way to handle it?
    options: ["Dismiss the feedback outright because the delivery was rude and unprofessional", "Respond in kind with equally blunt criticism to set a firm boundary with them", "Report the poor delivery to your manager before you even consider the content itself", "Separate the valid signal from the poor delivery and extract the core that's actionable"]
    answer: 3
    explanation: |
      Poor delivery doesn't make feedback wrong. Maturity is separating signal from
      delivery, extracting the valid core, and acting on it. Dismissing it,
      retaliating, or focusing on the delivery all forfeit the growth signal.
    ref: "concepts.md#receiving-hard-feedback-and-showing-growth"
  - id: behavioral-competency-bank-038
    difficulty: advanced
    tags: [above-and-beyond, staff-bar, strategic]
    question: |
      What should "above and beyond" look like at the staff level specifically?
    options: ["Personally grinding out extra individual tasks on nights and weekends until it's all done", "Volunteering for the single most visible project so that leadership is sure to notice you", "Spotting a strategic gap (a missing platform capability or unowned reliability risk) and mobilizing others to close it", "Taking on far more tickets than anyone else on the team to prove your raw output"]
    answer: 2
    explanation: |
      At staff level, above-and-beyond means seeing a strategic, org-level gap and
      mobilizing people to fix it — leverage, not personal grind. Extra individual
      output and visibility-chasing are lower-scope signals.
    ref: "concepts.md#going-above-and-beyond"
  - id: behavioral-competency-bank-039
    difficulty: intermediate
    tags: [red-flag, past-employer, professionalism]
    question: |
      A candidate spends time explaining how bad their previous company and
      manager were. What does this most predict to the interviewer?
    options: ["That the candidate has unusually sharp judgment about which companies are well-run and worth joining", "That the candidate will likely badmouth this company too, if hired", "That the candidate is being refreshingly honest and direct where others would diplomatically hedge", "That the previous company and its managers were genuinely the ones at fault in the situation"]
    answer: 1
    explanation: |
      Badmouthing a past employer predicts you'll badmouth the current one. Even
      with a bad experience, the professional move is to frame it as a learning and
      stay neutral about people — the interviewer is watching how you talk about
      others.
    ref: "concepts.md#red-flag-answers-interviewers-penalize"
  - id: behavioral-competency-bank-040
    difficulty: expert
    tags: [prioritization, staff-bar, portfolio]
    question: |
      How does prioritization scope differ between senior and staff engineers?
    options: ["Staff engineers prioritize portfolios and roadmaps and say no to whole projects, aligned to strategy; senior engineers prioritize within a project's backlog", "Senior engineers set overall company strategy, while staff engineers mostly prioritize their own individual task lists", "Both operate at exactly the same scope, so the engineer's level makes no real difference here", "Staff engineers don't really do prioritization at all, since that responsibility belongs entirely to managers"]
    answer: 0
    explanation: |
      Scope scales with level: senior engineers make trade-offs within a project's
      backlog, while staff engineers prioritize across a portfolio or roadmap and
      can say no to entire projects in service of strategy.
    ref: "concepts.md#prioritization-and-trade-off-decisions"
  - id: behavioral-competency-bank-041
    difficulty: intermediate
    tags: [mapping, story-reuse]
    question: |
      During a loop, which practice around reusing stories is acceptable?
    options: ["Reusing one strong story across two related competency probes is fine; telling a weak, low-stakes story just because it 'technically matches' is not", "Never reuse a story under any circumstances; every question demands a completely brand-new example each time", "Always reuse the exact same flagship story throughout, since that kind of consistency reads as confidence", "Only ever reuse a story in cases where the interviewer has explicitly given you permission to"]
    answer: 0
    explanation: |
      Map each probe to the strongest banked story for that signal. Reusing a
      strong story across related competencies is fine (unless asked for a
      different example); forcing a weak story just because it technically fits the
      label wastes a slot.
    ref: "concepts.md#mapping-stories-to-competencies"
  - id: behavioral-competency-bank-042
    difficulty: advanced
    tags: [influence, coalition, adoption]
    question: |
      Why does "make it their idea" — co-authoring and crediting generously —
      matter for influence without authority?
    options: ["Because openly taking credit for your own ideas is considered unprofessional in most engineering cultures", "Because adoption beats authorship — the outcome sticks when the other side owns and wants it", "Because sharing authorship protects you from taking the blame later if the idea ends up failing", "Because managers tend to prefer and promote engineers who consistently stay modest and humble about wins"]
    answer: 1
    explanation: |
      Influence is measured by whether the other side ends up owning and wanting
      the outcome. Sharing credit and co-authoring drives adoption; clinging to
      authorship can block the very buy-in you need. It's about the outcome
      sticking, not modesty or self-protection.
    ref: "concepts.md#influencing-without-authority"
  - id: behavioral-competency-bank-043
    difficulty: expert
    tags: [story-selection, stakes, level-appropriate]
    question: |
      A staff candidate tells a well-structured story about fixing a $50
      edge-case bug they found. Why might this still underperform?
    options: ["Bug-fix stories are simply never an appropriate thing to bring up in any engineering interview", "The stakes don't scale with the level — staff stories should carry org-level stakes (a company bet, a platform many teams depend on)", "It leans on the word 'I' far too heavily and comes across as self-centered throughout", "It fails to cite even a single specific, quantified metric anywhere in the entire answer"]
    answer: 1
    explanation: |
      Even a clean STAR story fails to signal staff scope if the stakes are tiny.
      Staff-level stories should involve bets the company made, platforms many
      teams depend on, or decisions that shaped a roadmap — the stakes must match
      the level.
    ref: "concepts.md#picking-stories-with-real-stakes"
  - id: behavioral-competency-bank-044
    difficulty: intermediate
    tags: [failure, follow-up, reflection]
    question: |
      "What would you do differently if you faced that again?" What is the wrong
      way to answer?
    options: ["Name a specific change in your approach and clearly explain the reasoning behind it", "Describe an earlier point in the timeline where you would step in and intervene next time", "'Nothing, honestly — it went great and I'd do the same thing.'", "Explain a concrete guardrail or safeguard you would put in place before starting next time"]
    answer: 2
    explanation: |
      This follow-up tests reflection. "Nothing, it went great" signals no
      self-awareness or growth — the opposite of the intended signal. A real answer
      names a concrete change, an earlier intervention point, or a preventive
      mechanism.
    ref: "concepts.md#common-follow-up-questions"
  - id: behavioral-competency-bank-045
    difficulty: advanced
    tags: [difficult-teammate, systemic, staff-bar]
    question: |
      A staff engineer notices two teams repeatedly clashing over ownership of a
      shared service. What's the strongest response?
    options: ["Personally step in to mediate each individual dispute one at a time as it happens to arise", "Recognize the friction is systemic (unclear ownership) and fix the system so the class of conflict stops, while modeling the behavior for juniors", "Recommend that leadership reorganize the two clashing teams by merging them together into a single team", "Advise each engineer involved to simply be more patient and accommodating with one another going forward"]
    answer: 1
    explanation: |
      Senior engineers repair one relationship; staff engineers notice a dynamic is
      systemic (unclear ownership breeding turf conflict), fix the underlying
      system, and model good behavior because juniors are watching. Mediating each
      instance treats symptoms, not the cause.
    ref: "concepts.md#dealing-with-a-difficult-teammate-or-manager"
  - id: behavioral-competency-bank-046
    difficulty: intermediate
    tags: [follow-up, individual-role, we-vs-i]
    question: |
      "What was your specific contribution vs. the team's?" Why do interviewers
      ask this?
    options: ["To isolate your individual role — so don't hide behind 'we'; use 'I' for your actions", "To check whether you are genuinely a collaborative team player who works well alongside others", "To see whether you will greedily take all of the credit for the team's shared work", "To test whether you can actually remember the names of the teammates you worked alongside"]
    answer: 0
    explanation: |
      This follow-up isolates what you personally did, because the interviewer is
      scoring you. Vague "we" language can signal a passenger; use "I" for your
      actions (crediting the team in the result) so your contribution is legible.
    ref: "concepts.md#common-follow-up-questions"
  - id: behavioral-competency-bank-047
    difficulty: beginner
    tags: [failure, structure, ownership]
    question: |
      Which sequence best structures a strong failure/mistake answer?
    options: ["Blame the surrounding context → carefully minimize the impact it had → and then quickly move on", "Real mistake with real cost → own your part explicitly → root cause in your judgment → the lesson → the behavior change with evidence it stuck", "Pick a small mistake → explain that it wasn't really your fault at all → say you'd do exactly the same again", "Open with a big dramatic failure → describe the chaos in vivid detail → end simply with 'we somehow survived'"]
    answer: 1
    explanation: |
      The ownership-plus-growth arc — real cost, explicit ownership, root cause in
      your own judgment, the lesson, and a behavior change that stuck — is what
      demonstrates the growth signal. The others deflect, minimize, or omit the
      lesson.
    ref: "concepts.md#failure-mistakes-and-the-time-you-were-wrong-trap"
  - id: behavioral-competency-bank-048
    difficulty: advanced
    tags: [ambiguity, staff-bar, org-scope]
    question: |
      How does handling ambiguity look different at the staff+ level?
    options: ["Staff engineers should wait for leadership to step in and remove the ambiguity for them", "Staff engineers deliberately avoid ambiguous projects altogether in order to protect their spotless track record", "Staff+ handle ambiguity that spans organizational boundaries (unclear ownership, competing mandates) and produce artifacts that align leaders, not just a team", "There's no real difference at all; ambiguity gets handled in exactly the same way at every level"]
    answer: 2
    explanation: |
      At staff+, ambiguity is organizational — unclear ownership, competing
      mandates across teams — and the artifacts you produce must align leaders, not
      just your immediate team. Waiting or avoiding ambiguity is the opposite of the
      expected signal.
    ref: "concepts.md#handling-ambiguity-and-driving-clarity"
  - id: behavioral-competency-bank-049
    difficulty: intermediate
    tags: [feedback, close-the-loop, arc]
    question: |
      Which feedback story shows the strongest growth arc?
    options: ["Feedback you immediately agreed with and forgot about", "Feedback you disagreed with at first, sat with, eventually integrated, and closed the loop on with the person who gave it", "Feedback you rejected because you had a good reason", "Feedback you were given but never had a chance to act on"]
    answer: 1
    explanation: |
      The strongest arc shows initial disagreement, reflection, genuine integration,
      and closing the loop — proof the feedback actually changed you. Instant
      agreement, rejection, or no action all weaken the growth signal.
    ref: "concepts.md#receiving-hard-feedback-and-showing-growth"
  - id: behavioral-competency-bank-050
    difficulty: advanced
    tags: [failed-project, staff-bar, prevention]
    question: |
      What turns a "project that failed" story into a strong staff-level answer?
    options: ["Emphasizing how much code was written before it was cancelled", "Proving the failure was entirely outside your control", "Showing you turned the failure into organizational risk reduction — e.g. a lightweight validation gate before a team commits a quarter", "Explaining that you never make bets that could fail"]
    answer: 2
    explanation: |
      Staff engineers are expected to prevent doomed projects. The strongest version
      converts one failure into a mechanism that reduces organizational risk (a
      validation gate before committing a team-quarter), showing systemic learning
      rather than sunk effort or blamelessness.
    ref: "concepts.md#a-project-that-failed-vs-a-mistake-you-made"
  - id: behavioral-competency-bank-051
    difficulty: beginner
    tags: [conflict, structure, beats]
    question: |
      Which of these is NOT one of the four beats of a strong conflict story?
    options: ["You demonstrated that you never actually had to compromise", "The disagreement was substantive (a real trade-off, not a personality clash)", "You advocated with data, not volume", "You genuinely listened and can steelman the other side"]
    answer: 0
    explanation: |
      A strong conflict story is substantive, data-driven, shows genuine listening,
      and ends in resolution and commitment. "Never had to compromise" is an ego
      signal, not a beat — often the strongest version is one where you
      disagreed-and-committed to the other side's choice.
    ref: "concepts.md#conflict-and-disagreement"
  - id: behavioral-competency-bank-052
    difficulty: intermediate
    tags: [red-flag, table, self-reflection]
    question: |
      Which pair correctly matches a red-flag answer to why it sinks a candidate?
    options: ["'I've never had a failure' → signals no self-awareness, no stakes, or dishonesty", "Quantifying your results with hard metrics → comes across as boastful and self-promoting", "Admitting the situation was stressful → reveals that you crack and buckle under pressure", "Using 'I' to describe the actions you took → makes you sound arrogant and credit-hungry"]
    answer: 0
    explanation: |
      Claiming you've never failed signals a lack of self-awareness, no real stakes,
      or dishonesty — everyone has a real failure with a good ending to tell.
      Quantifying results, admitting stress, and owning your actions with "I" are
      all strengths, not red flags.
    ref: "concepts.md#red-flag-answers-interviewers-penalize"
  - id: behavioral-competency-bank-053
    difficulty: advanced
    tags: [influence, credibility, relationship]
    question: |
      Why does building relationships and credibility before you need them matter
      for influence without authority?
    options: ["Because a strong prior relationship lets you skip having to bring any real evidence to the ask later", "Because established credibility essentially guarantees that your proposals will end up approved", "Because you can't make a withdrawal from an account you never funded — trust must be built before the ask", "Because it's an effective way to bank a stock of favors that you can later call in when needed"]
    answer: 2
    explanation: |
      Influence runs on trust: helping teams before you need them funds the account
      you later draw on. It doesn't replace evidence, guarantee approval, or reduce
      to transactional favor-trading — it's the credibility that makes people
      willing to hear the ask at all.
    ref: "concepts.md#influencing-without-authority"
  - id: behavioral-competency-bank-054
    difficulty: intermediate
    tags: [mapping, senior-vs-staff, bank-composition]
    question: |
      For a staff-level candidate, how should the story bank be composed
      differently from a senior candidate's?
    options: ["It should contain more stories overall, regardless of scope", "It should focus entirely on individual technical achievements", "It should avoid any stories involving failure or conflict", "At least half the stories should show cross-team scope, lasting mechanisms, or org-level judgment"]
    answer: 3
    explanation: |
      Senior stories are scoped to one team and project; at staff+ at least half the
      bank should demonstrate cross-team scope, lasting mechanisms, or org-level
      judgment — you didn't just fix the thing, you changed how the org does the
      thing.
    ref: "concepts.md#mapping-stories-to-competencies"
  - id: behavioral-competency-bank-055
    difficulty: expert
    tags: [failed-project, sunk-cost, riskiest-assumption]
    question: |
      A team spent a quarter building a real-time recommendations engine on the
      unvalidated assumption that latency was the conversion blocker; A/B data
      later showed no lift. Which lesson best demonstrates staff-level judgment?
    options: ["Put the riskiest assumption behind the cheapest possible test first, before committing a team-quarter", "Next time, invest even more up front to make the recommendations engine faster and lower-latency still", "Avoid running A/B tests on these projects so the results can't undermine a roadmap already committed to", "Build out the full system as planned but keep a documented backup plan ready in case it happens to fail"]
    answer: 0
    explanation: |
      The transferable staff lesson is to validate the assumption that, if false,
      kills the project — cheaply and first — rather than sinking a quarter and
      fighting sunk-cost bias later. The other options double down on the original
      mistake or avoid the evidence.
    ref: "concepts.md#a-project-that-failed-vs-a-mistake-you-made"
  - id: behavioral-competency-bank-056
    difficulty: intermediate
    tags: [deadline, de-risk, sequencing]
    question: |
      Under a tight deadline, why front-load the riskiest work?
    options: ["To knock out the hardest parts early while your energy and motivation are still at their peak", "Because riskier, more technically difficult work tends to look more impressive to stakeholders", "To deliberately save the easy, low-effort work as a kind of reward for the very end", "So surprises surface early, with time left to react and renegotiate scope"]
    answer: 3
    explanation: |
      De-risking early means uncertainty resolves while there's still time to
      respond — you can renegotiate scope or adjust the plan before it's too late.
      It's about managing risk timing, not motivation or optics.
    ref: "concepts.md#tight-deadlines-and-working-under-pressure"
  - id: behavioral-competency-bank-057
    difficulty: advanced
    tags: [follow-up, killed-project, sunk-cost]
    question: |
      "When did you decide NOT to do something, or to kill a project?" What is
      this follow-up primarily probing?
    options: ["Whether you have the persistence to always finish absolutely everything that you start", "Prioritization and sunk-cost judgment — the maturity to stop investing when the evidence says so", "Whether you have a long enough list of fully completed projects available to discuss", "How faithfully and closely you follow the direction that leadership hands down to you"]
    answer: 1
    explanation: |
      This probes prioritization judgment and the ability to fight sunk-cost bias —
      knowing when to stop is a senior+ signal. Persistence for its own sake and
      blind direction-following are not what's being tested.
    ref: "concepts.md#common-follow-up-questions"
