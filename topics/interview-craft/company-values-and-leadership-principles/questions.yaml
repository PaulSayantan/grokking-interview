topic: "Company Values & Leadership Principles (Amazon LPs et al.)"
domain: interview-craft
topic_slug: company-values-and-leadership-principles
version: 1
questions:
  - id: company-values-and-leadership-principles-001
    difficulty: beginner
    tags: [why-values, culture-fit, fundamentals]
    question: |
      What is the primary reason large companies score behavioral interviews against a
      published set of values or leadership principles?
    options:
      - "To let interviewers hire people they personally like"
      - "To give many interviewers a consistent, evidence-based rubric so the bar is applied the same way"
      - "To make the interview shorter"
      - "To avoid asking any technical questions"
    answer: 1
    explanation: |
      A published rubric is the anti-bias, consistency mechanism: instead of "I liked them,"
      an interviewer must cite specific behavior mapped to a named value. It lets hundreds of
      interviewers evaluate to the same bar and forces evidence over vibes.
    ref: "concepts.md#why-values-based-interviewing-exists"

  - id: company-values-and-leadership-principles-002
    difficulty: beginner
    tags: [amazon-lps, count, fundamentals]
    question: |
      How many Leadership Principles does Amazon currently evaluate candidates against?
    options:
      - "10"
      - "14"
      - "16"
      - "12"
    answer: 2
    explanation: |
      Amazon has 16 Leadership Principles. It expanded from 14 to 16 in 2021 with the
      addition of "Strive to be Earth's Best Employer" and "Success and Scale Bring Broad
      Responsibility."
    ref: "concepts.md#amazons-16-leadership-principles"

  - id: company-values-and-leadership-principles-003
    difficulty: intermediate
    tags: [bar-raiser, amazon, process]
    question: |
      What is distinctive about the Bar Raiser in an Amazon interview loop?
    options:
      - "They are always the hiring manager for the role"
      - "They only ask coding questions"
      - "They score the candidate after everyone else agrees"
      - "They are a trained interviewer from outside the hiring team with effective veto power over the hire"
    answer: 3
    explanation: |
      The Bar Raiser is deliberately from outside the hiring team, is detached from the
      team's short-term staffing pressure, and holds veto power. Their job is protecting the
      long-term bar: "would this person raise the average of the team?"
    ref: "concepts.md#the-bar-raiser-role"

  - id: company-values-and-leadership-principles-004
    difficulty: intermediate
    tags: [star, we-vs-i, ownership, scenario]
    question: |
      An interviewer asks, "Tell me about a time you improved system reliability." You answer
      mostly with "we did this, we decided that." What is the most likely problem?
    options:
      - "The interviewer cannot tell what YOU specifically did, so they cannot score your individual contribution"
      - "The story is too technical"
      - "You should have used a hypothetical instead"
      - "Reliability is not a valid topic for behavioral rounds"
    answer: 0
    explanation: |
      Interviewers must score *you*, and Amazon debriefs are written and evidence-based. An
      all-"we" answer is un-scorable. Deliberately say "I decided / I built / I convinced"
      for your contributions while still crediting the team for theirs.
    ref: "concepts.md#hitting-the-intended-value-without-sounding-robotic"

  - id: company-values-and-leadership-principles-005
    difficulty: intermediate
    tags: [dive-deep, root-cause, scenario]
    question: |
      Which answer best demonstrates the "Dive Deep" signal for a latency problem?
    options:
      - "Latency was high so we added more servers and it improved"
      - "The dashboard was green, so I assumed it was fine"
      - "My team told me the database was slow, so we upgraded it"
      - "p99 spiked only for logged-in users, so I pulled traces, found a serial fan-out re-fetching the same permission set, added a request-scoped cache, and cut p99 from 2s to 180ms"
    answer: 3
    explanation: |
      Dive Deep is about you personally getting into the mechanism and data. The strong
      answer names the specific mechanism, shows first-person investigation, quantifies the
      result, and implicitly rejects the shallow "add servers" fix.
    ref: "concepts.md#dive-deep-and-ownership-the-most-probed-for-engineers"

  - id: company-values-and-leadership-principles-006
    difficulty: advanced
    tags: [disagree-and-commit, nuance, scenario]
    question: |
      Which story best demonstrates "Have Backbone; Disagree and Commit"?
    options:
      - "I disagreed with the plan, argued until I won, and the other person was proven wrong"
      - "I disagreed but stayed quiet in the meeting, then complained afterward"
      - "I pushed back on the big-bang cutover with data, the team chose it anyway, and I fully committed and helped make it succeed"
      - "I disagreed, said nothing changed, and I just went along with it"
    answer: 2
    explanation: |
      The LP is two behaviors in sequence: genuinely disagree (with data, respectfully), then
      commit fully once the decision is made — even against you. Winning the argument alone
      shows backbone but no *commit*; going along silently shows neither.
    ref: "concepts.md#disagree-and-commit-the-nuance-interviewers-test"

  - id: company-values-and-leadership-principles-007
    difficulty: beginner
    tags: [ownership, signal, scenario]
    question: |
      Which behavior most strongly signals "Ownership" in an engineering behavioral round?
    options:
      - "Finishing all your assigned sprint tickets on time"
      - "Taking on a cross-cutting problem no one owned and driving it to done while considering downstream consequences"
      - "Politely declining work outside your team's scope"
      - "Escalating every ambiguous issue to your manager immediately"
    answer: 1
    explanation: |
      Ownership means acting beyond your assigned boundary and thinking long-term — taking an
      un-owned problem, thinking about downstream/next-quarter impact, and never saying
      "that's not my job." Just finishing your tickets is baseline IC scope.
    ref: "concepts.md#dive-deep-and-ownership-the-most-probed-for-engineers"

  - id: company-values-and-leadership-principles-008
    difficulty: intermediate
    tags: [other-companies, netflix, values]
    question: |
      Netflix's culture is built around which core concept, and what does its "keeper test"
      imply for your behavioral stories?
    options:
      - "Freedom & Responsibility; candor and collaboration matter, so a story where you were right but torched a relationship scores badly"
      - "Frugality; you should emphasize how little budget you used"
      - "Customer Obsession; you should only tell customer stories"
      - "Bias for Action; you should never mention any planning"
    answer: 0
    explanation: |
      Netflix runs on "Freedom & Responsibility," high autonomy plus high judgment, with a
      no-brilliant-jerks norm. The keeper test rewards candor and collaboration together, so
      winning an argument while damaging trust is a poor signal there.
    ref: "concepts.md#other-companies-values"

  - id: company-values-and-leadership-principles-009
    difficulty: intermediate
    tags: [robotic, delivery, scenario]
    question: |
      Why can explicitly saying "This demonstrates my Ownership Leadership Principle" actually
      hurt your score?
    options:
      - "Interviewers are not allowed to hear the word Ownership"
      - "It is factually inaccurate to name an LP"
      - "It uses too many words"
      - "It reads as canned/robotic; the signal lands harder when specific actions let the trained interviewer map it themselves"
    answer: 3
    explanation: |
      The craft is making the behavior obvious through specifics so the interviewer connects
      it to the value themselves. Reciting value names like a checklist reads as rehearsed and
      can lower the score. Let the actions speak, and mirror company vocabulary lightly.
    ref: "concepts.md#hitting-the-intended-value-without-sounding-robotic"

  - id: company-values-and-leadership-principles-010
    difficulty: beginner
    tags: [hypothetical, star, failure-mode]
    question: |
      An interviewer asks, "Tell me about a time you handled a production incident." What is
      the weakest way to open your answer?
    options:
      - "\"When our checkout service went down last March, I was on call and...\""
      - "\"The hardest incident I owned was a payment outage where...\""
      - "\"Generally, what I would do in an incident is...\""
      - "\"There was a time our deploy pipeline pushed a bad build and I...\""
    answer: 2
    explanation: |
      Answering a "tell me about a time" question with a hypothetical ("what I would do") is
      the single most common disqualifier — it reads as "I have no real example." Always
      anchor to a concrete past situation.
    ref: "concepts.md#the-lp-per-question-structure"

  - id: company-values-and-leadership-principles-011
    difficulty: advanced
    tags: [scope, leveling, staff, scenario]
    question: |
      A staff-level candidate's best "Ownership" story is "I owned all my sprint tickets and
      never missed a deadline." Even if true, why might this hurt them?
    options:
      - "It is dishonest"
      - "The value is demonstrated but at IC scope, so it fails the leveling bar and can get them down-leveled"
      - "Ownership is not probed for staff candidates"
      - "Deadlines are irrelevant to interviewers"
    answer: 1
    explanation: |
      Your examples themselves must be senior. A staff Ownership story spans multiple teams
      and quarters (owning a cross-org program), not a single sprint. A story that tops out at
      IC scope technically shows the value but signals the wrong level.
    ref: "concepts.md#mapping-your-stories-to-specific-principles"

  - id: company-values-and-leadership-principles-012
    difficulty: intermediate
    tags: [story-bank, mapping, prep]
    question: |
      What is the recommended way to prepare for a values-based loop with 16 principles?
    options:
      - "Build 6-8 strong layered stories and tag each to the 2-4 principles it can credibly demonstrate"
      - "Write one distinct story for each of the 16 principles"
      - "Memorize the definitions and recite them"
      - "Prepare a single flexible story you can stretch to any principle"
    answer: 0
    explanation: |
      You don't need 16 stories. Build 6-8 strong stories and map each to multiple principles
      by emphasizing different slices. Stretching one thin story across everything fails under
      follow-up drilling; a matrix of stories-to-values reveals prep gaps.
    ref: "concepts.md#mapping-your-stories-to-specific-principles"

  - id: company-values-and-leadership-principles-013
    difficulty: intermediate
    tags: [bar-raiser, quantify, debrief, scenario]
    question: |
      Given that Amazon interviewers submit written, data-driven debriefs, which phrasing is
      most useful to an interviewer?
    options:
      - "\"We improved performance a lot\""
      - "\"The system got much faster after our changes\""
      - "\"I profiled the hot path, found an N+1 query, added a covering index and cache, and cut p99 from 800ms to 120ms, recovering ~$40k/mo in abandoned-checkout revenue\""
      - "\"Everyone agreed it was a good outcome\""
    answer: 2
    explanation: |
      Interviewers must transcribe specific, quantified, first-person evidence into the
      debrief tool. "We improved performance" is un-writable; the detailed, measured,
      first-person version is exactly what they can paste and defend.
    ref: "concepts.md#the-bar-raiser-role"

  - id: company-values-and-leadership-principles-014
    difficulty: beginner
    tags: [past-behavior, prediction, why-values]
    question: |
      Why do values-based rounds insist on real past examples rather than hypotheticals?
    options:
      - "Past behavior in a comparable situation is the best available predictor of future behavior"
      - "Hypotheticals take too long to answer"
      - "Interviewers are not allowed to ask 'what would you do'"
      - "Real examples are easier to grade automatically"
    answer: 0
    explanation: |
      The core premise of behavioral interviewing is that past behavior predicts future
      behavior. That is why the format is "tell me about a time" and why hypotheticals are
      distrusted — they don't demonstrate what you have actually done.
    ref: "concepts.md#why-values-based-interviewing-exists"

  - id: company-values-and-leadership-principles-015
    difficulty: advanced
    tags: [disagree-and-commit, judgment, scenario]
    question: |
      You disagreed with a decision, lost, committed fully, and later it turned out you were
      right. What is the strongest way to close that story?
    options:
      - "\"That proves I should have gotten my way, and I'd fight harder next time\""
      - "\"I'd still commit again — a functioning team can't re-litigate every decision, and my job was to help the chosen path succeed\""
      - "\"After that I stopped disagreeing with anyone\""
      - "\"I reminded everyone that I had been right all along\""
    answer: 1
    explanation: |
      The mature signal is judgment about when backbone is worth spending. Saying you'd commit
      again — because teams can't re-litigate every call — shows both backbone and team-first
      commitment. "I told you so" reads as combative and undermines the commit half.
    ref: "concepts.md#disagree-and-commit-the-nuance-interviewers-test"

  - id: company-values-and-leadership-principles-016
    difficulty: intermediate
    tags: [other-companies, google, oxygen]
    question: |
      Google's evaluation deliberately values "emergent leadership" and intellectual humility
      (informed by Project Oxygen). Which story best fits a Google behavioral round?
    options:
      - "A time you took formal command and directed everyone by authority"
      - "A time you saved the most money on a project"
      - "A time you stepped up to lead an effort without being the boss, and a time you were wrong and updated your view"
      - "A time you disagreed and never backed down"
    answer: 2
    explanation: |
      Emergent leadership means leading without positional authority; Project Oxygen found the
      best managers coach rather than command, and Google prizes intellectual humility. A
      lead-without-authority story plus a "was wrong and updated" story hit both signals.
    ref: "concepts.md#other-companies-values"

  - id: company-values-and-leadership-principles-017
    difficulty: intermediate
    tags: [reading-values, prep, checklist]
    question: |
      Before a non-Amazon loop, what is a critical preparation step regarding company values?
    options:
      - "Bring your Amazon LP stories since all companies value the same things"
      - "Assume the company has no values and prepare generically"
      - "Find the company's actual published values and re-tag your story bank to them"
      - "Only prepare technical answers because values rounds are unscored"
    answer: 2
    explanation: |
      Values rounds are open-book — the rubric is published. Bringing the wrong company's
      values (e.g., Amazon LPs to a non-Amazon loop) is an unforced error. Find the actual
      list, decode what each value rewards behaviorally, and re-map your stories.
    ref: "concepts.md#reading-a-companys-values-before-the-loop"

  - id: company-values-and-leadership-principles-018
    difficulty: advanced
    tags: [failure-modes, symptom-vs-cause, scenario]
    question: |
      An interviewer probing Dive Deep hears: "The service was slow, so we doubled the
      instance count and it got better." Why is this a weak Dive Deep answer?
    options:
      - "It uses too few technical terms"
      - "Adding servers is never a valid action"
      - "It is too long"
      - "It solves the symptom without demonstrating that you investigated the actual mechanism/root cause"
    answer: 3
    explanation: |
      Dive Deep rewards getting into the mechanism and data. "Add servers" treats the symptom
      (capacity) without showing you found the root cause — this fails both Dive Deep and
      Insist on Highest Standards. The strong version identifies why it was slow.
    ref: "concepts.md#common-failure-modes-interviewers-penalize"

  - id: company-values-and-leadership-principles-019
    difficulty: beginner
    tags: [culture-add, bias, why-values]
    question: |
      Modern loops prefer "culture add / values alignment" over the older "culture fit."
      Why?
    options:
      - "It sounds more modern"
      - "\"Culture fit\" as \"people like us / I'd get a beer with them\" imports bias; values alignment focuses on demonstrated behaviors and outcomes"
      - "It lets interviewers skip the values entirely"
      - "It only applies to junior candidates"
    answer: 1
    explanation: |
      The discredited version of "culture fit" (people like us) smuggles in bias. Culture add
      / values alignment asks whether you demonstrate the behaviors the company needs — framed
      around behaviors and outcomes, not personality or shared background.
    ref: "concepts.md#why-values-based-interviewing-exists"

  - id: company-values-and-leadership-principles-020
    difficulty: intermediate
    tags: [lp-per-question, focus, scenario]
    question: |
      When asked an Ownership question, why is it usually better to tell a story where
      ownership is the sharpest signal rather than a mega-story covering four LPs at once?
    options:
      - "A single-focus story makes the target LP easy for the interviewer to score, whereas a diluted story muddies the signal they must assess"
      - "Shorter stories are always better"
      - "Interviewers dislike hearing about multiple achievements"
      - "You should never reuse a story for more than one LP"
    answer: 0
    explanation: |
      One story = one LP focus. The interviewer is assigned to assess a specific principle;
      diluting the focus across many LPs makes it harder for them to score the one they need.
      Let them pull other threads with follow-ups if they want.
    ref: "concepts.md#the-lp-per-question-structure"

  - id: company-values-and-leadership-principles-021
    difficulty: advanced
    tags: [disagree-and-commit, failure-mode, scenario]
    question: |
      A candidate tells a "Disagree and Commit" story that is purely about winning an argument
      where the other person was wrong. What does the interviewer most likely conclude?
    options:
      - "Strong on both backbone and commit"
      - "Strong commit but no backbone"
      - "Strong backbone but zero 'commit' demonstrated, and possibly combative"
      - "Perfect answer, nothing missing"
    answer: 2
    explanation: |
      A pure "I won the argument" story shows backbone but never demonstrates the *commit*
      half — genuinely committing to a decision that went against you. It can also read as
      combative. The LP requires both halves in sequence.
    ref: "concepts.md#disagree-and-commit-the-nuance-interviewers-test"

  - id: company-values-and-leadership-principles-022
    difficulty: intermediate
    tags: [reverse-questions, values, maturity]
    question: |
      Preparing reverse questions that probe whether a company's stated values are real
      primarily accomplishes what?
    options:
      - "It intimidates the interviewer"
      - "It replaces the need to prepare stories"
      - "It guarantees a higher offer"
      - "It protects you (checking the culture is genuine) and signals maturity"
    answer: 3
    explanation: |
      Reverse questions that test whether values are lived (not just posters) both protect you
      from a mismatch and signal senior maturity. Cross-reference the leveling/negotiation
      topic for a fuller reverse-question list.
    ref: "concepts.md#reading-a-companys-values-before-the-loop"

  - id: company-values-and-leadership-principles-023
    difficulty: beginner
    tags: [amazon-lps, customer-obsession, definition]
    question: |
      Amazon's "Customer Obsession" principle is best summarized as:
    options:
      - "Always agree with whatever the customer says"
      - "Start from the customer and work backwards, earning and keeping their trust"
      - "Prioritize competitors over customers"
      - "Focus on internal stakeholders first"
    answer: 1
    explanation: |
      Customer Obsession means starting with the customer and working backwards — a phrase
      rooted in Amazon's 1997 shareholder letter. It is not blind agreement; it is
      relentlessly earning and keeping customer trust.
    ref: "concepts.md#amazons-16-leadership-principles"

  - id: company-values-and-leadership-principles-024
    difficulty: intermediate
    tags: [amazon-lps, most-probed, engineers]
    question: |
      For engineering candidates specifically, which two Amazon LPs are the most heavily and
      repeatedly probed?
    options:
      - "Ownership and Dive Deep"
      - "Frugality and Think Big"
      - "Strive to be Earth's Best Employer and Success and Scale Bring Broad Responsibility"
      - "Are Right A Lot and Learn and Be Curious"
    answer: 0
    explanation: |
      Ownership and Dive Deep are probed most for engineers because they best predict senior
      engineering behavior: acting beyond your boundary/thinking long-term, and personally
      getting into the mechanism and data.
    ref: "concepts.md#dive-deep-and-ownership-the-most-probed-for-engineers"

  - id: company-values-and-leadership-principles-025
    difficulty: advanced
    tags: [robotic, vocabulary, scenario]
    question: |
      Which technique helps you hit a target value naturally rather than robotically?
    options:
      - "Announce each LP by name before the relevant sentence"
      - "Front-load the signal through specific action verbs and let the interviewer connect it to the value, mirroring company vocabulary lightly"
      - "Repeat the value name at least three times"
      - "Avoid mentioning any outcomes so it seems humble"
    answer: 1
    explanation: |
      Make the behavior obvious via specifics and action verbs; let the trained interviewer
      map it to the value (it lands harder when they do). Light vocabulary mirroring ("two-way
      door," "work backwards") shows cultural fluency without checklist recitation.
    ref: "concepts.md#hitting-the-intended-value-without-sounding-robotic"

  - id: company-values-and-leadership-principles-026
    difficulty: intermediate
    tags: [we-vs-i, over-correction, failure-mode]
    question: |
      A candidate over-corrects the "we" trap and describes a large project as if they did
      everything alone. What new problem does this create?
    options:
      - "None; taking all credit is always best"
      - "It makes the story too short"
      - "It violates NDA rules"
      - "It removes the collaboration signal, which interviewers also assess (Earn Trust, Hire & Develop)"
    answer: 3
    explanation: |
      The fix for the "we" fog is making *your* actions unmistakable, not claiming sole credit
      for a team win. Credit-hogging fails Earn Trust / Hire & Develop the Best. Attribute
      honestly: "I" for your parts, credit the team for theirs.
    ref: "concepts.md#hitting-the-intended-value-without-sounding-robotic"

  - id: company-values-and-leadership-principles-027
    difficulty: intermediate
    tags: [other-companies, meta, values]
    question: |
      Meta's values include "Move Fast," "Focus on Long-Term Impact," and "Meta, Metamates,
      Me." A behavioral round there most rewards which combination?
    options:
      - "Slow deliberate consensus and minimal risk"
      - "Speed, measurable impact, direct communication, and company-first thinking"
      - "Frugality and avoiding all mistakes"
      - "Working strictly within your own team's boundaries"
    answer: 1
    explanation: |
      Meta's values emphasize moving fast, focusing on long-term measurable impact, being
      direct with colleagues, and putting the company first ("Meta, Metamates, Me"). Stories
      showing speed plus quantified long-term impact and direct communication align well.
    ref: "concepts.md#other-companies-values"

  - id: company-values-and-leadership-principles-028
    difficulty: advanced
    tags: [ownership, cross-team, scenario, staff]
    question: |
      Which incident story most strongly signals Ownership at a senior level?
    options:
      - "\"It wasn't my team's service, but it was hitting our customers, so I paged myself in, rolled back the bad deploy, then filed the fix for the missing rollback alarm\""
      - "\"It wasn't my service so I filed a ticket for the owning team and waited\""
      - "\"I noticed the alert but it wasn't my on-call rotation\""
      - "\"I told my manager another team broke something\""
    answer: 0
    explanation: |
      Ownership is acting beyond your boundary and thinking long-term. Paging yourself into
      someone else's outage because it hurt customers, fixing it, then closing the systemic
      gap (missing alarm) shows Ownership plus Bias for Action and Insist on Highest Standards.
    ref: "concepts.md#dive-deep-and-ownership-the-most-probed-for-engineers"

  - id: company-values-and-leadership-principles-029
    difficulty: beginner
    tags: [amazon-lps, bias-for-action, definition]
    question: |
      "Bias for Action" rewards which behavior?
    options:
      - "Reckless decisions with no thought"
      - "Waiting for complete certainty before any move"
      - "Taking calculated, often-reversible risks quickly because speed matters, not endless analysis"
      - "Delegating all decisions upward"
    answer: 2
    explanation: |
      Bias for Action values speed and calculated, reversible ("two-way door") risk-taking —
      not recklessness and not analysis paralysis. The signal is shipping and iterating when a
      decision is reversible.
    ref: "concepts.md#amazons-16-leadership-principles"

  - id: company-values-and-leadership-principles-030
    difficulty: intermediate
    tags: [reflection, learn-be-curious, failure-mode, scenario]
    question: |
      When asked "what would you do differently?", a candidate gets defensive and says
      "nothing, it went perfectly." Which values does this most undermine?
    options:
      - "Frugality and Think Big"
      - "Customer Obsession only"
      - "None; a flawless project is the ideal answer"
      - "Learn and Be Curious, and Earn Trust (self-criticism)"
    answer: 3
    explanation: |
      Inability to reflect, or defensiveness, fails Learn and Be Curious and the self-critical
      dimension of Earn Trust. A thoughtful "here's what I'd change" shows growth; "nothing
      went wrong" reads as lack of self-awareness.
    ref: "concepts.md#common-failure-modes-interviewers-penalize"

  - id: company-values-and-leadership-principles-031
    difficulty: advanced
    tags: [dive-deep, drilling, scenario]
    question: |
      An interviewer keeps asking "why?" three levels deep about a bug you described. What is
      this most likely testing?
    options:
      - "Whether you can talk for a long time"
      - "Dive Deep — whether you personally understood the mechanism or are repeating a summary"
      - "Your typing speed"
      - "Whether you can name every LP"
    answer: 1
    explanation: |
      Repeated "why" drilling tests Dive Deep: can you explain the mechanism several levels
      down without hand-waving? "My team told me" or "the dashboard was green" collapses under
      this; genuine investigation holds up.
    ref: "concepts.md#dive-deep-and-ownership-the-most-probed-for-engineers"

  - id: company-values-and-leadership-principles-032
    difficulty: intermediate
    tags: [star, length, delivery]
    question: |
      Roughly how long should the core of a STAR behavioral answer run before you pause for
      the interviewer to drill?
    options:
      - "About 2-4 minutes, then stop and let them ask follow-ups"
      - "About 30 seconds"
      - "10-15 minutes of continuous detail"
      - "As long as possible to fill the time"
    answer: 0
    explanation: |
      Aim for ~2-4 minutes, then stop and let the interviewer drill. Over-talking buries the
      signal; the follow-up questions are where the real evidence gets pulled, so leave room
      for them.
    ref: "concepts.md#hitting-the-intended-value-without-sounding-robotic"

  - id: company-values-and-leadership-principles-033
    difficulty: beginner
    tags: [amazon-lps, expansion-2021, history]
    question: |
      Which two Leadership Principles did Amazon add in 2021, expanding the list to 16?
    options:
      - "Customer Obsession and Ownership"
      - "Dive Deep and Have Backbone"
      - "Strive to be Earth's Best Employer, and Success and Scale Bring Broad Responsibility"
      - "Think Big and Frugality"
    answer: 2
    explanation: |
      In 2021 Amazon added "Strive to be Earth's Best Employer" and "Success and Scale Bring
      Broad Responsibility," bringing the total from 14 to 16.
    ref: "concepts.md#amazons-16-leadership-principles"

  - id: company-values-and-leadership-principles-034
    difficulty: advanced
    tags: [bar-raiser, panel-consistency, scenario]
    question: |
      Your loop went well in four rounds, but in one round you gave shallow, credit-hogging
      answers. Why can that single round still sink the hire?
    options:
      - "Amazon debriefs on written, specific evidence and a Bar Raiser's strong 'no' can veto an otherwise positive loop; consistency across the panel matters"
      - "It cannot; four positives always outweigh one negative"
      - "Only the hiring manager's opinion counts"
      - "Shallow answers are automatically re-scored as positive"
    answer: 0
    explanation: |
      The loop runs on written, data-driven debrief, and the Bar Raiser protects the long-term
      bar with veto power. One round of shallow, credit-hogging evidence can be the data point
      that tanks the loop despite other positives.
    ref: "concepts.md#the-bar-raiser-role"

  - id: company-values-and-leadership-principles-035
    difficulty: intermediate
    tags: [story-bank, matrix, prep, scenario]
    question: |
      You build a matrix of your stories (rows) against a company's values (columns). One
      value has zero strong stories mapped to it. What does that mean?
    options:
      - "That value is unimportant and can be ignored"
      - "It is a prep gap; go find a real example before the loop"
      - "You should invent a story for it"
      - "You should map an unrelated story to it anyway"
    answer: 1
    explanation: |
      A column with no strong story is a prep gap to close with a *real* example — never a
      fabricated one, which collapses under drilling. A story serving four-plus values is your
      workhorse to know cold.
    ref: "concepts.md#mapping-your-stories-to-specific-principles"

  - id: company-values-and-leadership-principles-036
    difficulty: advanced
    tags: [other-companies, startups, generalist, scenario]
    question: |
      Interviewing at an early-stage startup with values like "bias to ship" and "customer-
      first," which story profile resonates most?
    options:
      - "Being scrappy and generalist — shipping a customer-facing fix end to end without much process, staying close to the customer"
      - "Navigating a heavyweight multi-quarter approval process"
      - "Optimizing a mature system by 2% over a year"
      - "Delegating all hands-on work to specialists"
    answer: 0
    explanation: |
      Startups reward scrappiness, generalist range, comfort without process, and direct
      customer contact. A story of shipping something end-to-end and staying close to the
      customer fits far better than heavyweight-process or narrow-specialist narratives.
    ref: "concepts.md#other-companies-values"

  - id: company-values-and-leadership-principles-037
    difficulty: intermediate
    tags: [reading-values, decode, prep]
    question: |
      "Decoding what a value rewards behaviorally" means what, in practice?
    options:
      - "Memorizing the exact wording of the value"
      - "Counting how many values the company has"
      - "Translating each value into 'a story that demonstrates it looks like ___' and knowing its boundaries (e.g., Bias for Action rewards reversible speed, not recklessness)"
      - "Ranking values from best to worst"
    answer: 2
    explanation: |
      Decoding means translating each value into the concrete behavior/story that proves it —
      and understanding its limits (Bias for Action = reversible speed, not recklessness). That
      lets you pick the right story and avoid the caricature version of the value.
    ref: "concepts.md#reading-a-companys-values-before-the-loop"

  - id: company-values-and-leadership-principles-038
    difficulty: beginner
    tags: [amazon-lps, dive-deep, definition]
    question: |
      Amazon's "Dive Deep" principle is best captured by which phrase?
    options:
      - "Delegate details to others and stay high-level"
      - "Trust the dashboards and move on"
      - "Focus only on strategy, never data"
      - "Stay connected to the details, audit frequently, and treat no task as beneath you"
    answer: 3
    explanation: |
      Dive Deep means staying connected to the details, auditing frequently, being skeptical
      when metrics and anecdote differ, and believing no task is beneath you. It is the
      opposite of only operating on summaries.
    ref: "concepts.md#amazons-16-leadership-principles"

  - id: company-values-and-leadership-principles-039
    difficulty: advanced
    tags: [failure-modes, consolidated, scenario]
    question: |
      Which of these answers would an interviewer most likely score as the strongest overall?
    options:
      - "\"We shipped a migration and it went well\""
      - "\"I owned the un-owned DB migration, found the root-cause lock contention in the query plans, shipped a reversible dual-write cutover, and cut p99 60% while ending the weekly outage\""
      - "\"I generally believe in owning problems end to end\""
      - "\"My team migrated the database and I helped where I could\""
    answer: 1
    explanation: |
      The strong answer is first-person, specific, root-cause-driven, and quantified — hitting
      Ownership, Dive Deep, Bias for Action, and Deliver Results at once. The others are vague,
      hypothetical, or fog the individual contribution.
    ref: "concepts.md#common-failure-modes-interviewers-penalize"

  - id: company-values-and-leadership-principles-040
    difficulty: intermediate
    tags: [amazon-lps, are-right, scenario]
    question: |
      An interviewer probes "Are Right, A Lot." Which behavior best demonstrates it?
    options:
      - "Being confident and never changing your mind"
      - "Always agreeing with the most senior person"
      - "Having strong judgment while actively seeking diverse perspectives and working to disconfirm your own views"
      - "Making decisions only after everyone unanimously agrees"
    answer: 2
    explanation: |
      Are Right, A Lot pairs strong judgment with actively seeking diverse perspectives and
      disconfirming your own beliefs. It is not stubborn certainty; the signal is good instincts
      *plus* the humility to test and update them.
    ref: "concepts.md#amazons-16-leadership-principles"

  - id: company-values-and-leadership-principles-041
    difficulty: advanced
    tags: [disagree-and-commit, manager, scenario]
    question: |
      "Tell me about a time you disagreed with your manager." Which follow-up is the
      interviewer most likely driving toward, and what should your story therefore contain?
    options:
      - "How loudly you argued; the story should emphasize the fight"
      - "Whether you eventually got promoted; emphasize the reward"
      - "What happened AFTER the decision; the story needs a decision that went against you and you making it succeed"
      - "How you avoided the manager afterward"
    answer: 2
    explanation: |
      The high-value probe is the commit half: what happened after the decision. The strongest
      story has genuine disagreement, a decision that went against you, and you committing fully
      to help it succeed — not just the argument.
    ref: "concepts.md#disagree-and-commit-the-nuance-interviewers-test"

  - id: company-values-and-leadership-principles-042
    difficulty: beginner
    tags: [lp-per-question, format, fundamentals]
    question: |
      Amazon-style behavioral questions are pre-mapped so that each question assesses:
    options:
      - "A random topic chosen live"
      - "Your coding ability"
      - "The hiring manager's personal preference"
      - "A specific Leadership Principle the interviewer must evaluate"
    answer: 3
    explanation: |
      Each interviewer is assigned specific LPs and each question is mapped to one, so the panel
      covers the full set. Knowing the question targets a specific LP lets you front-load the
      right signal.
    ref: "concepts.md#the-lp-per-question-structure"

  - id: company-values-and-leadership-principles-043
    difficulty: intermediate
    tags: [metrics, deliver-results, failure-mode, scenario]
    question: |
      Two candidates describe the same project. One says "it got better"; the other says
      "checkout conversion rose 12% and p99 dropped from 800ms to 120ms." Why does the second
      score higher on Deliver Results and Dive Deep?
    options:
      - "Quantified outcomes give the interviewer writable, defensible evidence of real, measured impact"
      - "It is longer"
      - "It uses the word conversion"
      - "Metrics are only relevant for data-science roles"
    answer: 0
    explanation: |
      "It got better" is un-writable and unverifiable; quantified impact is the exact evidence
      the interviewer transcribes into the debrief. Numbers signal Deliver Results and that you
      dove deep enough to measure the mechanism.
    ref: "concepts.md#common-failure-modes-interviewers-penalize"

  - id: company-values-and-leadership-principles-044
    difficulty: advanced
    tags: [scope, staff, ownership, comparison]
    question: |
      Which pair correctly contrasts an IC-scope vs a staff-scope Ownership story?
    options:
      - "IC: 'I owned my sprint tickets' / Staff: 'I owned the cross-org reliability program spanning multiple teams and quarters'"
      - "IC: 'I owned the cross-org reliability program' / Staff: 'I owned my sprint tickets'"
      - "Both are identical in scope"
      - "IC and staff stories should never differ"
    answer: 0
    explanation: |
      Scope is what separates levels. IC Ownership tops out at your own tickets/component; staff
      Ownership spans multiple teams and quarters (a cross-org program). Matching your story's
      scope to your target level is essential to avoid being down-leveled.
    ref: "concepts.md#mapping-your-stories-to-specific-principles"

  - id: company-values-and-leadership-principles-045
    difficulty: intermediate
    tags: [vocabulary, two-way-door, scenario]
    question: |
      Casually saying "I treated it as a two-way door, so I shipped and iterated" during an
      Amazon loop primarily signals what?
    options:
      - "That you are showing off vocabulary"
      - "That you skipped planning"
      - "Cultural fluency and calculated Bias for Action, framing the decision as reversible"
      - "Nothing; the phrase is meaningless"
    answer: 2
    explanation: |
      "Two-way door" is Amazon shorthand for a reversible decision. Using it lightly and
      correctly signals cultural fluency and frames your speed as calculated (Bias for Action) —
      as long as it's natural, not a robotic recitation of LP names.
    ref: "concepts.md#hitting-the-intended-value-without-sounding-robotic"

  - id: company-values-and-leadership-principles-046
    difficulty: beginner
    tags: [amazon-lps, earn-trust, definition]
    question: |
      "Earn Trust" is demonstrated by which of these?
    options:
      - "Never admitting a mistake so you look strong"
      - "Keeping information from teammates to maintain an edge"
      - "Only trusting your own judgment"
      - "Listening attentively, speaking candidly, being self-critical, and treating others respectfully"
    answer: 3
    explanation: |
      Earn Trust means listening, speaking candidly, being vocally self-critical, and treating
      others respectfully — benchmarking yourself against the best. Hiding mistakes or hoarding
      information is the opposite signal.
    ref: "concepts.md#amazons-16-leadership-principles"

  - id: company-values-and-leadership-principles-047
    difficulty: advanced
    tags: [cross-reference, boundary, technical-round, scenario]
    question: |
      During a values round, an interviewer asks how you'd drive a whiteboard system design.
      What is the best framing for where the deep technical design *method* is owned?
    options:
      - "This topic; values rounds fully cover the technical design method"
      - "The system-design interview-method topic owns the technical whiteboard method; this topic owns the behavioral/values angle"
      - "No topic covers it"
      - "The coding-round topics own it"
    answer: 1
    explanation: |
      By design, the technical system-design method (driving a whiteboard design) is owned by
      system-design/interview-method-scenario-playbooks. This topic owns the behavioral/values
      craft. Knowing the boundary keeps your prep and answers scoped correctly.
    ref: "concepts.md#reading-a-companys-values-before-the-loop"

  - id: company-values-and-leadership-principles-048
    difficulty: intermediate
    tags: [failure-modes, wrong-company, scenario]
    question: |
      A candidate walks into a Netflix loop and repeatedly frames answers around Amazon's 16
      Leadership Principles by name. Why is this a mistake?
    options:
      - "It signals you didn't research the company's actual values (Freedom & Responsibility), and reciting another company's framework reads as tone-deaf"
      - "Netflix has no values to align to"
      - "Amazon LPs are secret and cannot be mentioned"
      - "Netflix only evaluates coding"
    answer: 0
    explanation: |
      Bringing the wrong company's values is a listed failure mode. It shows you didn't do the
      open-book prep of reading Netflix's actual "Freedom & Responsibility" culture, and reciting
      Amazon LPs by name at a non-Amazon loop reads as canned and tone-deaf.
    ref: "concepts.md#common-failure-modes-interviewers-penalize"
