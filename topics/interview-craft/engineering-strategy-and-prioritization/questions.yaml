topic: "Engineering Strategy & Prioritization"
domain: interview-craft
topic_slug: engineering-strategy-and-prioritization
version: 1
questions:
  - id: engineering-strategy-and-prioritization-001
    difficulty: beginner
    tags: [strategy-definition, will-larson, staff-signal]
    question: |
      In an interview, what best distinguishes an engineering *strategy* from a *roadmap*?
    options:
      - "A strategy is a line of reasoning that helps people make decisions under uncertainty; a roadmap is a list of planned work"
      - "A strategy is simply a longer document with more line items and finer detail than a roadmap, which stays high-level"
      - "A strategy is owned and authored by managers, while a roadmap is owned and maintained by the engineering team"
      - "A strategy is always framed in OKRs and objectives, whereas a roadmap is expressed purely in two-week sprint units"
    answer: 0
    explanation: |
      Will Larson's working definition: a strategy is a document/reasoning that helps you
      decide under uncertainty — someone can infer what to do without asking you. A list of
      planned work with no decision-making logic is a roadmap, not a strategy.
    ref: "concepts.md#what-strategy-is-and-why-its-a-staff-signal"
  - id: engineering-strategy-and-prioritization-002
    difficulty: intermediate
    tags: [rumelt, kernel, diagnosis]
    question: |
      Rumelt's "kernel of good strategy" has three parts in order. What are they?
    options:
      - "Goals, metrics, deadlines"
      - "Vision, mission, values"
      - "Diagnosis, guiding policy, coherent actions"
      - "Objectives, key results, initiatives"
    answer: 2
    explanation: |
      Rumelt's kernel is Diagnosis (name the core challenge) → Guiding policy (the overall
      approach) → Coherent actions (concrete, mutually reinforcing steps). Leading with
      diagnosis is the staff-level tell.
    ref: "concepts.md#what-strategy-is-and-why-its-a-staff-signal"
  - id: engineering-strategy-and-prioritization-003
    difficulty: intermediate
    tags: [bad-strategy, rumelt, scenario]
    question: |
      Asked to set a platform team's strategy, a candidate says: "We'll improve
      reliability, increase velocity, AND cut cost across the board." Per Rumelt, what's
      the main problem?
    options:
      - "It's far too ambitious a set of outcomes for any single team to realistically attempt within one planning cycle"
      - "It fails to name the specific technologies, tools, or platforms the team would adopt to achieve each of the goals"
      - "It should have attached a concrete deadline and target date to each of the three goals so progress is trackable"
      - "It states goals without a diagnosis of the core challenge or a coherent, focused approach — a bad-strategy tell"
    answer: 3
    explanation: |
      Bad strategy mistakes goals for strategy and lists incoherent objectives without
      facing the real challenge. There's no diagnosis of the binding constraint and no
      focused guiding policy — just a wish list of everything-at-once.
    ref: "concepts.md#what-strategy-is-and-why-its-a-staff-signal"
  - id: engineering-strategy-and-prioritization-004
    difficulty: advanced
    tags: [strategy, scenario, weak-vs-strong]
    question: |
      An interviewer asks "what's your technical strategy for next year?" Which opening
      best signals staff-level thinking?
    options:
      - "We'll migrate to Kubernetes, add full monitoring and observability, modernize CI, and steadily pay down our accumulated tech debt."
      - "First I'd diagnose the binding constraint — say it's delivery speed — then set a guiding policy and the coherent actions that follow from it."
      - "I'd survey each engineer about what they'd most like to work on next year, then build the roadmap bottom-up from their preferences."
      - "I'd research what the top-performing teams in our industry are doing and copy their technology choices and initiatives closely."
    answer: 1
    explanation: |
      Leading with diagnosis (the constraint) then guiding policy then actions is the
      Rumelt kernel and the staff tell. A project list, a bottom-up wish-poll, or
      cargo-culting competitors all skip the diagnosis.
    ref: "concepts.md#what-strategy-is-and-why-its-a-staff-signal"
  - id: engineering-strategy-and-prioritization-005
    difficulty: intermediate
    tags: [decide-what-to-work-on, altitude, scenario]
    question: |
      "How do you decide what to work on?" Which answer signals the *right altitude* for a
      staff+ candidate?
    options:
      - "I pull the highest-priority ticket from the top of our Jira backlog and work down the queue in the order it's ranked."
      - "I work on whatever my manager assigns me for the sprint, trusting that they have the full context to set the right priorities."
      - "I start from the outcome we're accountable for, find the constraint most limiting it, score the options, and make explicit what we're not doing."
      - "I take the tickets that are the most technically interesting to me or the ones I can realistically finish the fastest."
    answer: 2
    explanation: |
      Starting from the goal/metric, finding the bottleneck, scoring, and stating the
      explicit trade-off is outcome-oriented senior thinking. Consuming the backlog or
      picking by interest outsources judgment and reads as low scope.
    ref: "concepts.md#how-do-you-decide-what-to-work-on"
  - id: engineering-strategy-and-prioritization-006
    difficulty: advanced
    tags: [decide-what-to-work-on, constraint, theory-of-constraints]
    question: |
      Your team's goal is to reduce checkout latency, but a stakeholder keeps pushing UI
      polish work. Applying constraint-based prioritization, what's the strongest move?
    options:
      - "Focus effort on the specific bottleneck limiting checkout latency; work off the constraint rarely moves the metric"
      - "Split the team evenly between the latency work and the UI polish so both streams progress and every stakeholder stays happy"
      - "Do the UI polish first because it's the more visible, demo-able work that stakeholders will immediately notice and appreciate"
      - "Alternate between the two workstreams each sprint so that both the latency goal and the UI polish make steady progress"
    answer: 0
    explanation: |
      Theory-of-constraints thinking: the metric moves only when you work on the binding
      constraint. Spreading effort or chasing visibility over the bottleneck feels
      productive but doesn't move the accountable outcome.
    ref: "concepts.md#how-do-you-decide-what-to-work-on"
  - id: engineering-strategy-and-prioritization-007
    difficulty: beginner
    tags: [rice, framework, formula]
    question: |
      What is the RICE prioritization formula?
    options:
      - "Reach + Impact + Confidence + Effort"
      - "Reach × Impact ÷ (Confidence × Effort)"
      - "(Reach + Impact) × Confidence × Effort"
      - "(Reach × Impact × Confidence) ÷ Effort"
    answer: 3
    explanation: |
      RICE = (Reach × Impact × Confidence) ÷ Effort. Effort is in the denominator because
      more effort is worse; Confidence (a percentage) discounts optimistic Impact
      estimates.
    ref: "concepts.md#prioritization-frameworks-and-when-to-use-each"
  - id: engineering-strategy-and-prioritization-008
    difficulty: intermediate
    tags: [rice, worked-example, effort]
    question: |
      Feature A: (Reach 10000 × Impact 2 × Confidence 0.8) ÷ Effort 4. Feature B: (Reach
      2000 × Impact 3 × Confidence 1.0) ÷ Effort 1. Which wins by RICE, and what's the
      lesson?
    options:
      - "A wins — a reach of 10000 dwarfs 2000, and higher reach always dominates the final RICE score"
      - "B wins (6000 vs 4000) — effort in the denominator means the small, sure, cheap bet often beats the splashy big one"
      - "They score equally once you round, so break the tie by picking the feature with the higher raw reach"
      - "A wins because its Reach × Impact product of 20000 comfortably exceeds B's Reach × Impact of 6000"
    answer: 1
    explanation: |
      A = (10000×2×0.8)/4 = 4000. B = (2000×3×1.0)/1 = 6000. B wins despite lower reach.
      The lesson to voice: effort in the denominator is why a small sure thing often beats
      a big splashy bet.
    ref: "concepts.md#prioritization-frameworks-and-when-to-use-each"
  - id: engineering-strategy-and-prioritization-009
    difficulty: intermediate
    tags: [wsjf, cost-of-delay, framework]
    question: |
      What is the WSJF (Weighted Shortest Job First) formula used in SAFe?
    options:
      - "Job Size ÷ Cost of Delay"
      - "Cost of Delay × Job Size"
      - "Cost of Delay ÷ Job Size (Duration)"
      - "Reach × Impact ÷ Effort"
    answer: 2
    explanation: |
      WSJF = Cost of Delay ÷ Job Duration (Size). Cost of Delay itself combines
      user-business value, time criticality, and risk-reduction/opportunity-enablement.
      It sequences a queue to maximize value delivered over time.
    ref: "concepts.md#prioritization-frameworks-and-when-to-use-each"
  - id: engineering-strategy-and-prioritization-010
    difficulty: advanced
    tags: [wsjf, sequencing, scenario]
    question: |
      You have two backlog items with roughly equal Cost of Delay, but one is half the
      size of the other. By WSJF, which do you do first and why?
    options:
      - "The larger one — with equal Cost of Delay, the bigger job ultimately delivers more total value to the business"
      - "Whichever one the loudest or most senior stakeholder is pushing hardest for at the moment you plan the sprint"
      - "The one that's more technically interesting or that the team is most motivated and energized to build first"
      - "The smaller one — equal value in less time yields a higher WSJF, delivering value sooner and freeing capacity"
    answer: 3
    explanation: |
      WSJF = CoD ÷ duration, so with equal CoD the shorter job scores higher. Shortest
      weighted job first maximizes total value delivered over time — this is the answer to
      "five equally important things, what order?"
    ref: "concepts.md#prioritization-frameworks-and-when-to-use-each"
  - id: engineering-strategy-and-prioritization-011
    difficulty: intermediate
    tags: [eisenhower, framework, urgent-important]
    question: |
      Which prioritization tool is best suited to sorting reactive firefighting from
      strategic work and protecting time for important-but-not-urgent tasks?
    options:
      - "The Eisenhower (urgent/important) matrix"
      - "RICE scoring, which ranks by Reach × Impact × Confidence ÷ Effort across a product backlog"
      - "MoSCoW, sorting items into Must-have, Should-have, Could-have, and Won't-have-this-time buckets"
      - "WSJF, sequencing a queue by Cost of Delay divided by job size to maximize value over time"
    answer: 0
    explanation: |
      The Eisenhower matrix sorts by urgent × important and forces the do/schedule/
      delegate/drop decision — ideal for protecting Important-but-Not-Urgent strategic
      work from the tyranny of the urgent.
    ref: "concepts.md#prioritization-frameworks-and-when-to-use-each"
  - id: engineering-strategy-and-prioritization-012
    difficulty: intermediate
    tags: [moscow, scoping, release]
    question: |
      When scoping a single release with stakeholders under a fixed deadline, which
      framework and which of its categories is most valuable?
    options:
      - "RICE — and specifically the Reach factor, since it tells you how many users each candidate item will touch"
      - "MoSCoW — and the 'Won't (this time)' box, which makes the cut explicit"
      - "ICE — and specifically the Ease factor, since a fixed deadline means you should favor the simplest items to build"
      - "WSJF — and specifically the job-size factor, which lets you fit the shortest jobs inside the fixed deadline window"
    answer: 1
    explanation: |
      MoSCoW (Must/Should/Could/Won't) is built for release scoping. The 'Won't this time'
      box is the valuable one — it makes the cut an explicit, shared decision rather than a
      silent drop.
    ref: "concepts.md#prioritization-frameworks-and-when-to-use-each"
  - id: engineering-strategy-and-prioritization-013
    difficulty: intermediate
    tags: [ice, framework, startup]
    question: |
      A scrappy growth team lacks reliable reach data but needs to rank experiments fast.
      Which framework fits best?
    options:
      - "ICE (Impact × Confidence × Ease) — a quick first cut when you lack reach data"
      - "WSJF, because for a growth team the cost of delay is always the single dominant factor to optimize for"
      - "A full RICE analysis, forcing the team to source precise reach numbers for every experiment before ranking"
      - "The Eisenhower urgent/important matrix, sorting each experiment into do, schedule, delegate, or drop"
    answer: 0
    explanation: |
      ICE (Impact × Confidence × Ease) is the fast, scrappy ranking used when you don't
      have solid reach numbers — common in early-stage growth work. It's more subjective
      than RICE but good for a quick first cut.
    ref: "concepts.md#prioritization-frameworks-and-when-to-use-each"
  - id: engineering-strategy-and-prioritization-014
    difficulty: advanced
    tags: [frameworks, judgment, override]
    question: |
      Your RICE analysis ranks feature X first, but X ignores a hard compliance deadline on
      feature Y. What's the strongest thing to say in an interview?
    options:
      - "The RICE score is the objective decision, so we trust the numbers and build X first regardless of anything else."
      - "I'd throw out the RICE analysis entirely and just go with my own gut feel about which feature matters more."
      - "Frameworks inform but don't decide — I'd override the score for the compliance deadline; the number organizes the conversation, judgment makes the call."
      - "I'd keep re-running and tweaking the RICE inputs until X and Y come out tied, so I don't have to make the hard call."
    answer: 2
    explanation: |
      Treating the score as gospel is a junior tell; ignoring the framework entirely is the
      opposite failure. The mature answer: the framework organizes the discussion, but
      judgment (here, a hard deadline the model didn't capture) overrides.
    ref: "concepts.md#prioritization-frameworks-and-when-to-use-each"
  - id: engineering-strategy-and-prioritization-015
    difficulty: intermediate
    tags: [cost-of-delay, economic, framing]
    question: |
      What question best captures the senior, *economic* lens on prioritization?
    options:
      - "How technically hard is this to build, and how much engineering effort will it take us to ship?"
      - "How many story points is it, and can we fit that estimate inside the current sprint's capacity?"
      - "Which team member is most interested in owning this and would most enjoy working on it next?"
      - "What does it cost us per week that we DON'T have this yet?"
    answer: 3
    explanation: |
      Cost of delay reframes priority as the economic loss per unit time of NOT having
      something. Junior prioritization asks "how hard is it?"; senior prioritization asks
      "what does waiting cost us?" — the language of the people funding the team.
    ref: "concepts.md#cost-of-delay-and-opportunity-cost"
  - id: engineering-strategy-and-prioritization-016
    difficulty: advanced
    tags: [sunk-cost, opportunity-cost, scenario]
    question: |
      A project is 6 months in but is no longer the best bet. A stakeholder argues "we've
      invested too much to stop now." What's the senior response?
    options:
      - "Agree — we've already spent six months, so we should push through and finish it to justify that investment."
      - "The 6 months are sunk; the only question is whether the *remaining* work is the best use of the next engineer-month."
      - "Cut the team on the project in half so it can limp toward completion without burning much additional cost."
      - "Restart the whole thing from scratch with a cleaner, better design so the next six months aren't wasted too."
    answer: 1
    explanation: |
      Sunk costs are irrelevant to a forward-looking decision. The senior framing evaluates
      the ROI of the *remaining* work against opportunity cost. Finishing purely to justify
      past spend is the sunk-cost fallacy.
    ref: "concepts.md#cost-of-delay-and-opportunity-cost"
  - id: engineering-strategy-and-prioritization-017
    difficulty: intermediate
    tags: [opportunity-cost, saying-yes]
    question: |
      Why is "is this worth doing?" the wrong question when prioritizing?
    options:
      - "Because literally everything on the backlog is worth doing, so the test passes universally and never helps you choose"
      - "Because 'worth' is inherently subjective and can never be measured objectively enough to prioritize a backlog with"
      - "Because almost everything is worth doing; the real question is whether it's the *best* use of the next engineer-month — every yes is a no to something else"
      - "Because deciding what's worth doing is a management responsibility, not something individual engineers should weigh in on"
    answer: 2
    explanation: |
      Opportunity cost: nearly everything passes "is it worth doing?", so that test can't
      prioritize. Every yes is a no to the best alternative use of that time — so the right
      question is whether it's the *best* use of scarce engineering time.
    ref: "concepts.md#cost-of-delay-and-opportunity-cost"
  - id: engineering-strategy-and-prioritization-018
    difficulty: advanced
    tags: [cost-of-delay, cd3, quantify]
    question: |
      A feature would unlock ~$50k/week of revenue but the team wants to do a "fun"
      refactor first. What's the strongest way to make the trade-off visible?
    options:
      - "Frame it in cost of delay: delaying the feature a quarter costs ~$650k, which makes the refactor's timing an expensive choice we should justify explicitly"
      - "Let the team hold a vote on which of the two they would rather build first and go with the majority's choice"
      - "Do the fun refactor first, since developer happiness and morale ultimately matter more than any single feature's revenue"
      - "Escalate the sequencing question up to the VP and ask them to just pick one of the two options for the team"
    answer: 0
    explanation: |
      Converting to cost of delay ($50k/week → ~$650k/quarter) makes the economic cost of
      sequencing the refactor first concrete and fundable-language. It doesn't forbid the
      refactor — it forces a conscious, justified trade.
    ref: "concepts.md#cost-of-delay-and-opportunity-cost"
  - id: engineering-strategy-and-prioritization-019
    difficulty: intermediate
    tags: [business-outcomes, impact, weak-vs-strong]
    question: |
      "Tell me about your biggest impact." Which answer demonstrates the strongest sense of
      impact?
    options:
      - "I rewrote our entire monolith into microservices — it was a huge, complex, multi-quarter project that touched every part of the system."
      - "I wrote the most code and closed the most tickets of anyone on the team over the course of last quarter."
      - "I introduced three new technologies to our stack, modernizing the way the team builds and ships software."
      - "I led splitting checkout out of the monolith, which took checkout from weekly to 5×/day deploys, cut incident MTTR from hours to minutes, and unblocked the mobile team."
    answer: 3
    explanation: |
      The strong answer chains technical work to engineering metrics (deploy frequency,
      MTTR) and to a business/team outcome (unblocked mobile). The others describe scope of
      *effort* or activity, not scope of *impact* — no numbers, no "which meant..."
    ref: "concepts.md#connecting-technical-work-to-business-outcomes-and-okrs"
  - id: engineering-strategy-and-prioritization-020
    difficulty: intermediate
    tags: [business-outcomes, chain, technique]
    question: |
      What's the technique for connecting a piece of technical work to something leadership
      cares about?
    options:
      - "Describe the technical difficulty and engineering complexity of the work in as much precise detail as you possibly can"
      - "Chain it up: technical work → engineering metric → product metric → business outcome"
      - "List every technology, framework, and tool the team used to deliver the project from start to finish"
      - "Emphasize how many hours and how much effort the team poured into completing the project on time"
    answer: 1
    explanation: |
      The chain (technical work → eng metric like p99/error rate → product metric like
      conversion/churn → business outcome like revenue/cost/risk) translates activity into
      the impact leadership funds. Effort and tech-name lists don't make that leap.
    ref: "concepts.md#connecting-technical-work-to-business-outcomes-and-okrs"
  - id: engineering-strategy-and-prioritization-021
    difficulty: intermediate
    tags: [okrs, objectives, key-results]
    question: |
      In OKR terms, which is the correctly structured pair?
    options:
      - "Objective: 'ship the caching layer'; Key Result: 'use Redis as the caching technology for it'"
      - "Objective: 'p99 latency under 500ms'; Key Result: 'Make the checkout flow feel trustworthy to users'"
      - "Objective: 'Make checkout trustworthy'; Key Results: 'p99 < 500ms; cart-abandonment < 20%'"
      - "Objective: 'work hard and stay focused this quarter'; Key Result: 'try our best on every task we pick up'"
    answer: 2
    explanation: |
      The Objective is the qualitative direction ("Make checkout trustworthy"); Key Results
      are the measurable outcomes (p99, abandonment). The staff move is mapping roadmap
      items to KRs — and cutting work that maps to no KR.
    ref: "concepts.md#connecting-technical-work-to-business-outcomes-and-okrs"
  - id: engineering-strategy-and-prioritization-022
    difficulty: advanced
    tags: [business-outcomes, okr, prioritization]
    question: |
      Reviewing the roadmap, you find a proposed project that maps to none of the team's
      Key Results. What's the strongest signal you can send?
    options:
      - "Build it anyway — shipping more features is always better for the product and for the team's momentum"
      - "Quietly leave it on the roadmap so that nobody who proposed or championed it ends up feeling bad about it"
      - "Add a brand-new Key Result to the team's OKRs specifically so the proposed project maps to something and is justified"
      - "Flag it as a candidate to cut: work that maps to no KR is deprioritizable, and voicing that shows outcome focus"
    answer: 3
    explanation: |
      Work that serves no Key Result is a prime candidate to cut. Naming that out loud
      demonstrates you optimize for outcomes over output. Inventing a KR to retrofit the
      project (or keeping it for politeness) is the failure mode.
    ref: "concepts.md#connecting-technical-work-to-business-outcomes-and-okrs"
  - id: engineering-strategy-and-prioritization-023
    difficulty: intermediate
    tags: [tech-debt, investment-framing, scenario]
    question: |
      "How do you balance tech debt against feature work?" Which framing is the hire
      signal?
    options:
      - "Treat debt as an investment decision with a return: quantify its cost, target the high-interest debt, and fund a standing allocation"
      - "Always fix the tech debt first before any feature work, because code quality is non-negotiable and comes ahead of everything"
      - "Only touch tech debt opportunistically, when there happens to be spare time left over between shipping feature commitments"
      - "Schedule a full rewrite of the whole system to eliminate all the accumulated debt at once in a single dedicated project"
    answer: 0
    explanation: |
      Both extremes (always-first, only-spare-time) fail. The hire signal treats debt as an
      investment with a measurable return — quantify the interest, prioritize high-interest
      debt on the critical path, and sustain a standing allocation rather than a heroic
      big-bang.
    ref: "concepts.md#tech-debt-vs-features-articulating-the-balance"
  - id: engineering-strategy-and-prioritization-024
    difficulty: advanced
    tags: [tech-debt, high-interest, critical-path]
    question: |
      Two areas both have significant tech debt. Which should you prioritize paying down?
    options:
      - "Whichever area has the most lines of messy, ugly code, since that's the clearest measure of how much debt exists"
      - "The debt in frequently-changed code on the critical path — it charges the most interest; debt in stable, rarely-touched corners can wait"
      - "The oldest debt that has been sitting in the codebase longest, regardless of where it lives or how often it's touched"
      - "Neither one right now — tech debt should only ever be addressed during a dedicated, separately-scheduled rewrite effort"
    answer: 1
    explanation: |
      Not all debt is equal. Debt on the critical path / in frequently-changed code charges
      high interest (constant workarounds, incidents); debt in a stable, rarely-touched
      corner charges little. Paying down debt nobody's paying interest on is waste.
    ref: "concepts.md#tech-debt-vs-features-articulating-the-balance"
  - id: engineering-strategy-and-prioritization-025
    difficulty: advanced
    tags: [tech-debt, funding, velocity]
    question: |
      You want approval to refactor a module. Which pitch is most likely to get funded?
    options:
      - "Refactoring this module first makes the next three roadmap features ~2× faster to build"
      - "The code in this module is ugly, hard to read, and no longer follows the industry best practices we care about"
      - "The team would be happier and more motivated working with a cleaner, better-organized version of this module"
      - "Other companies in our space have already modernized their equivalent modules, so we're falling behind by not doing it"
    answer: 0
    explanation: |
      Debt paydown framed as *velocity investment* that accelerates the roadmap gets
      approved; framed as *cleanliness* it gets deferred. Tie the work to a feature it
      unblocks and the business value it accelerates.
    ref: "concepts.md#tech-debt-vs-features-articulating-the-balance"
  - id: engineering-strategy-and-prioritization-026
    difficulty: intermediate
    tags: [tech-debt, big-bang-rewrite, anti-pattern]
    question: |
      An interviewer probes your view on a proposed multi-quarter rewrite "to finally do it
      right." What's the senior response?
    options:
      - "A full rewrite from scratch is the cleanest and most thorough way to eliminate all the accumulated debt at once"
      - "Freeze all feature work across the team until the multi-quarter rewrite is fully complete and shipped to production"
      - "Prefer incremental, ship-as-you-go refactoring (strangler-fig) that delivers value along the way over a big-bang rewrite with no intermediate value"
      - "Rewrite the system in full but keep the old version running forever alongside it as a permanent fallback and backup"
    answer: 2
    explanation: |
      The big-bang rewrite is a classic anti-pattern interviewers probe. Incremental
      strangler-fig refactoring delivers value continuously and de-risks; advocating a
      multi-quarter rewrite with no intermediate value is usually a red flag.
    ref: "concepts.md#tech-debt-vs-features-articulating-the-balance"
  - id: engineering-strategy-and-prioritization-027
    difficulty: advanced
    tags: [saying-no, stakeholder, scenario]
    question: |
      A VP asks you to squeeze a pet feature into the current sprint. Which response best
      demonstrates senior judgment?
    options:
      - "Sure, we'll find a way to fit it into this sprint. (then quietly drop some of the already-committed work to make room)"
      - "No, I'm sorry — that feature simply isn't in the sprint we already planned, so we can't take it on right now."
      - "Let me escalate this request up to my manager and let them make the call on whether it belongs in the sprint."
      - "Happy to — to pull it in I'd have to drop the committed payments retry fix, our top reliability item. If this matters more I'll swap and flag it; if not I'll slot it first next sprint. Which do you prefer?"
    answer: 3
    explanation: |
      The strong pattern is yes-if / no-because + alternative: acknowledge value, anchor on
      the commitment, make the trade-off visible and *theirs*, offer a path. Silent yes
      burns the team; blunt no is politically costly; deferring the decision abdicates.
    ref: "concepts.md#saying-no-managing-the-backlog-and-defending-priorities"
  - id: engineering-strategy-and-prioritization-028
    difficulty: intermediate
    tags: [saying-no, seniority-signal]
    question: |
      Why is the ability to say "no" well considered a strong seniority signal?
    options:
      - "Because senior engineers are expected to be difficult to work with and to push back on nearly every request they get"
      - "Because juniors say yes to everything and overcommit; protecting focus by declining, deferring, or trading — with the trade-off made visible — protects the team's priorities"
      - "Because saying no to incoming requests is the most effective way to reduce the amount of work you personally have to do"
      - "Because senior engineers operate independently and no longer need to seek approval or buy-in from stakeholders for their work"
    answer: 1
    explanation: |
      Saying yes to everything leads to late delivery and burnout. Seniors protect focus by
      making the cost of each yes visible and trading consciously. The skill is a *good*
      no (with an alternative), not obstruction.
    ref: "concepts.md#saying-no-managing-the-backlog-and-defending-priorities"
  - id: engineering-strategy-and-prioritization-029
    difficulty: intermediate
    tags: [backlog, hygiene, scenario]
    question: |
      Your backlog has hundreds of tickets, many over a year old and never actioned. What
      view signals senior thinking?
    options:
      - "Keep every ticket forever — you never know when an old idea might suddenly become relevant to the business again"
      - "Sort the entire backlog by creation date and work strictly oldest-first so nothing ever gets unfairly skipped over"
      - "A backlog is a prioritized queue you actively prune; close stale items that are never going to happen — attention is the scarce resource"
      - "Assign every single ticket in the backlog to a named owner so that none of them are left orphaned or unaccounted for"
    answer: 2
    explanation: |
      A healthy backlog is a pruned, prioritized queue — not an infinite dumping ground.
      Ruthlessly closing never-going-to-happen items ("haven't done it in a year → close
      it") signals you manage attention as a scarce resource.
    ref: "concepts.md#saying-no-managing-the-backlog-and-defending-priorities"
  - id: engineering-strategy-and-prioritization-030
    difficulty: advanced
    tags: [saying-no, trade-off-visible, quotable]
    question: |
      Which line best captures the core skill of prioritization and saying no?
    options:
      - "Every yes is a no to something else — I just make the no visible."
      - "The customer is always right, so we build what they ask."
      - "We'll get to everything eventually if we work hard enough."
      - "It's not my job to push back on priorities."
    answer: 0
    explanation: |
      "Every yes is a no to something else — I just make the no visible" captures the whole
      skill: prioritization is about surfacing the trade-off, not pleasing everyone or
      pretending capacity is infinite.
    ref: "concepts.md#saying-no-managing-the-backlog-and-defending-priorities"
  - id: engineering-strategy-and-prioritization-031
    difficulty: advanced
    tags: [sequencing, de-risk-first, scenario]
    question: |
      Sequencing a risky 6-month project, a junior does the easy known parts first for
      early progress. What does senior sequencing do differently, and why?
    options:
      - "It also does the easy, well-understood parts first, in order to build early momentum and visible progress"
      - "It schedules every part of the project to run in parallel from day one so the whole thing finishes faster"
      - "It deliberately leaves the risky part for last, so the team is far more experienced and capable by the time they reach it"
      - "It front-loads the biggest unknown/highest-risk part, because discovering a fatal problem in week 2 is cheap and in week 20 is a disaster"
    answer: 3
    explanation: |
      De-risk-first: tackle the scariest, most uncertain part early (a spike/prototype). If
      it's going to fail, fail cheap. Doing easy known parts first for visible progress
      defers the risk to when it's most expensive.
    ref: "concepts.md#sequencing-de-risk-first-thin-slices-reversible-first"
  - id: engineering-strategy-and-prioritization-032
    difficulty: intermediate
    tags: [sequencing, thin-slices, walking-skeleton]
    question: |
      What does a "thin vertical slice" (walking skeleton) mean in sequencing, and what's
      the anti-pattern?
    options:
      - "Build all of the backend services first and then all of the frontend on top; the anti-pattern is interleaving or mixing the layers"
      - "Ship a tiny end-to-end path touching every layer (UI→API→DB→deploy) early; the anti-pattern is completing one horizontal layer at a time so nothing works until the end"
      - "Build only the user interface and mock out everything behind it indefinitely, wiring up the real backend at the very end"
      - "Split the work strictly by team so that each team independently owns and completes exactly one horizontal layer of the stack"
    answer: 1
    explanation: |
      A thin vertical slice is a small end-to-end path through every layer that is
      shippable and generates feedback early, flushing out integration risk. Building all of
      one horizontal layer first means nothing works until the very end.
    ref: "concepts.md#sequencing-de-risk-first-thin-slices-reversible-first"
  - id: engineering-strategy-and-prioritization-033
    difficulty: advanced
    tags: [sequencing, reversible, one-way-door]
    question: |
      Using the one-way/two-way door framing, how should you sequence decisions in a
      project?
    options:
      - "Make every decision slowly and deliberately with heavy analysis, regardless of whether it's easily reversible or not"
      - "Make the irreversible, one-way-door decisions first in order to lock in the overall design as early as possible"
      - "Make reversible (two-way-door) decisions fast and early; defer irreversible (one-way-door) commitments until you've learned enough"
      - "Avoid committing to any decision at all until you have gathered every piece of information you could possibly want"
    answer: 2
    explanation: |
      Bezos's framing: two-way-door (reversible) decisions should be made fast and cheaply;
      one-way-door (hard-to-reverse) decisions deserve deliberation. In sequencing, prefer
      reversible steps early to keep options open and delay the irreversible commitment.
    ref: "concepts.md#sequencing-de-risk-first-thin-slices-reversible-first"
  - id: engineering-strategy-and-prioritization-034
    difficulty: advanced
    tags: [sequencing, migration, scenario]
    question: |
      "How would you sequence a risky six-month migration?" Which answer is strongest?
    options:
      - "Do the data migration first to get the scary part out of the way early, and then build all the new features on top of it"
      - "Build all of the new services first in isolation, then migrate everything over in one big cutover at the very end"
      - "Do the easiest, lowest-risk components first so you can quickly show stakeholders the team is making visible progress"
      - "Front-load the most-likely-wrong integration as a week-one spike, ship a thin end-to-end slice by week three, and keep the irreversible data migration as late as possible"
    answer: 3
    explanation: |
      Combine the heuristics: de-risk the biggest unknown early (spike), get a thin
      end-to-end slice shipping/learning fast, and defer the irreversible step (data
      migration) until everything reversible is validated. Note that doing the migration
      first confuses "scary" with "irreversible" — a one-way door to delay, not rush.
    ref: "concepts.md#sequencing-de-risk-first-thin-slices-reversible-first"
  - id: engineering-strategy-and-prioritization-035
    difficulty: intermediate
    tags: [roadmapping, now-next-later, dates]
    question: |
      Why do many modern teams prefer a "Now / Next / Later" roadmap over a Gantt chart of
      fixed dates?
    options:
      - "Because theme-based horizons set direction and sequence without over-promising exact dates, which is honest about uncertainty"
      - "Because delivery dates never actually matter to stakeholders, so there is no point in putting any of them on a roadmap"
      - "Because a Now/Next/Later format lets the team conveniently avoid ever committing to delivering anything at all"
      - "Because Gantt charts are technically difficult and time-consuming to produce and keep updated with the right tooling"
    answer: 0
    explanation: |
      A roadmap communicates direction and sequence, not dated promises. Now/Next/Later
      (theme-based) sets direction without over-promising specific dates — the modern
      default over a Gantt chart of fixed deadlines it can't reliably hit.
    ref: "concepts.md#roadmapping-short-term-delivery-vs-long-term-health"
  - id: engineering-strategy-and-prioritization-036
    difficulty: advanced
    tags: [roadmapping, short-vs-long, balance]
    question: |
      What's the risk of a roadmap that spends an entire quarter on invisible infrastructure
      with nothing shippable, even if the work is technically right?
    options:
      - "There is no real risk at all, as long as the infrastructure work itself turns out to be technically correct in the end"
      - "It's a trust-killer — stakeholders see no progress; interleaving visible wins with foundation work maintains trust and funding"
      - "The infrastructure will inevitably turn out to be the wrong design, because a full quarter is simply too long to plan ahead"
      - "Infrastructure and foundational work should never appear on a roadmap at all, since it isn't visible to stakeholders anyway"
    answer: 1
    explanation: |
      Holding both horizons means shipping enough near-term value to keep trust while
      investing long-term. A quarter of pure foundation with nothing visible kills
      stakeholder trust before the payoff lands — interleave visible wins with the invisible
      work.
    ref: "concepts.md#roadmapping-short-term-delivery-vs-long-term-health"
  - id: engineering-strategy-and-prioritization-037
    difficulty: advanced
    tags: [roadmapping, deadline, moscow, scenario]
    question: |
      "We're behind — do we cut the refactor to hit the deadline?" Which is the strongest
      answer?
    options:
      - "MoSCoW the scope, ship the must-haves on time, take on only the specific debt that's on the critical path now, and defer the rest with a tracked follow-up — flagging which corners we're cutting."
      - "Yes, cut the refactor and ship it now — we'll come back and clean up the debt once the deadline pressure is behind us."
      - "No, quality has to come first, so we hold the refactor in scope and let the delivery date slip until it's properly done."
      - "Add more engineers onto the project so we have the capacity to hit both the deadline and complete the full refactor."
    answer: 0
    explanation: |
      The strong answer separates must-have from nice-to-have, protects the deadline on
      must-haves, addresses only critical-path debt now, and makes the cut corners a
      *conscious, tracked* decision. "Later never comes" and "date always slips" are both
      failure modes; adding people late is Brooks's Law.
    ref: "concepts.md#roadmapping-short-term-delivery-vs-long-term-health"
  - id: engineering-strategy-and-prioritization-038
    difficulty: intermediate
    tags: [roadmapping, capacity-split, policy]
    question: |
      What's the benefit of committing to a capacity split (e.g., ~70% features / ~20%
      health / ~10% exploration)?
    options:
      - "It guarantees that every project the team takes on will reliably ship on time and within its original estimate"
      - "It completely eliminates the need to prioritize items within each of the feature, health, and exploration buckets"
      - "It makes the short-term/long-term balance a standing *policy* rather than a fight to be re-litigated every sprint"
      - "It gives the team a way to gradually avoid ever having to do any customer-facing feature work at all again"
    answer: 2
    explanation: |
      A capacity split turns the horizon balance into a policy, so health and exploration
      are protected by default instead of losing every sprint to feature pressure. You still
      prioritize within each bucket.
    ref: "concepts.md#roadmapping-short-term-delivery-vs-long-term-health"
  - id: engineering-strategy-and-prioritization-039
    difficulty: intermediate
    tags: [build-vs-buy, differentiation, default]
    question: |
      What's the default senior bias on build-vs-buy, and the reasoning behind it?
    options:
      - "Build everything in-house for maximum control, since owning the full stack yourself is always worth the investment"
      - "Always buy or adopt off-the-shelf, because building anything yourself is never worth the engineering time it takes"
      - "Decide each case by whichever of the two options the team happens to find the more technically interesting to work on"
      - "Buy/adopt unless it's core to your competitive differentiation, because engineering time is the scarcest resource and rebuilding a commodity is opportunity cost"
    answer: 3
    explanation: |
      Default: buy/adopt the undifferentiated heavy lifting, build only what's core to your
      differentiation. Engineering time is scarcest; spending it rebuilding a commodity
      (auth, queues, email) steals from the actual product. Wanting to build everything "for
      control" or fun is a junior/over-engineering tell.
    ref: "concepts.md#build-vs-buy-the-senior-decision"
  - id: engineering-strategy-and-prioritization-040
    difficulty: advanced
    tags: [build-vs-buy, tco, hidden-cost]
    question: |
      In a build-vs-buy analysis, what cost do "build" estimates most commonly undercount?
    options:
      - "The initial development time it takes to write the first working version and ship it to production"
      - "Ongoing maintenance, on-call, and keeping feature parity over time (total cost of ownership)"
      - "The licensing cost of the programming language and the core frameworks the team would build it on"
      - "The cost of the engineering time spent writing and reviewing the design doc before any code is written"
    answer: 1
    explanation: |
      Build estimates almost always undercount perpetual maintenance, on-call burden, and
      the effort to reach and keep feature parity — the real TCO. A strong candidate weighs
      TCO, not just initial build cost. (Naïve "always buy" conversely ignores lock-in and
      per-scale pricing.)
    ref: "concepts.md#build-vs-buy-the-senior-decision"
  - id: engineering-strategy-and-prioritization-041
    difficulty: advanced
    tags: [build-vs-buy, scenario, differentiation]
    question: |
      A startup needs authentication and considers building a custom identity system "for
      full control." What's the strongest senior guidance?
    options:
      - "Build it in-house — for a startup, full control over the authentication system is always worth the engineering investment"
      - "Build a simpler, stripped-down version of auth now and then invest in building the full custom identity system later on"
      - "Auth is undifferentiated heavy lifting; adopt or buy it and spend the saved engineering time on what's actually core to the product's differentiation"
      - "Skip authentication entirely for now and defer building or buying it until the product has real traction and users"
    answer: 2
    explanation: |
      Auth is a commodity, not the startup's differentiation. Buying/adopting it frees the
      scarcest resource — engineering time — for the actual product. "Build for control" is
      the classic over-engineering trap here.
    ref: "concepts.md#build-vs-buy-the-senior-decision"
  - id: engineering-strategy-and-prioritization-042
    difficulty: advanced
    tags: [build-vs-buy, lock-in, abstraction]
    question: |
      You decide to adopt a third-party vendor but worry about lock-in. What's a mature way
      to hedge?
    options:
      - "Adopt/buy now but keep an abstraction layer so you could swap the provider later if pricing or lock-in becomes a problem"
      - "Build the whole thing in-house instead, so you avoid taking on any external dependency or vendor relationship at all"
      - "Sign the longest-term contract the vendor offers in order to lock in today's pricing for as many years as possible"
      - "Integrate two competing vendors simultaneously for every feature so you're never dependent on either one of them alone"
    answer: 0
    explanation: |
      The mature build-vs-buy answer often lands on "buy/adopt now, but wrap it in an
      abstraction so we could swap later." That captures the time-to-market benefit while
      mitigating lock-in — weighing both sides rather than defaulting to build.
    ref: "concepts.md#build-vs-buy-the-senior-decision"
  - id: engineering-strategy-and-prioritization-043
    difficulty: advanced
    tags: [star, prioritization-story, structure]
    question: |
      Telling a "hard prioritization call" story, where should you spend most of your words?
    options:
      - "On the technical mechanics and implementation details of exactly what you and the team ended up building"
      - "On how many hours and how much sustained effort the team put in to get the project across the finish line"
      - "On generously praising all the stakeholders and partner teams who were involved in and supported the decision"
      - "On the decision reasoning — *why* you chose that and not the alternatives — since the interviewer is buying your judgment"
    answer: 3
    explanation: |
      In a strategy/prioritization STAR, the decision reasoning is the star — the
      interviewer is grading judgment. Spend words on why-this-not-that, not on
      implementation mechanics or effort.
    ref: "concepts.md#telling-the-story-a-strategy--hard-prioritization-star"
  - id: engineering-strategy-and-prioritization-044
    difficulty: advanced
    tags: [star, credit, failure-mode]
    question: |
      Which is a common failure mode when telling a strategy story in a senior interview?
    options:
      - "Naming a concrete, measurable business result at the end of the story to close it out on impact"
      - "Taking sole credit ('I decided') for what was a team/stakeholder call, instead of 'I drove/facilitated'"
      - "Explaining clearly why you chose one particular option over the alternatives you had considered"
      - "Anchoring the whole decision on a specific metric that the choice was meant to move or protect"
    answer: 1
    explanation: |
      Failure modes include taking sole credit for a collaborative call, all-mechanics/
      no-reasoning, no metric or business tie, and a story where you merely executed
      someone else's priorities (low scope). "I drove/facilitated" credits the team while
      showing your leadership.
    ref: "concepts.md#telling-the-story-a-strategy--hard-prioritization-star"
  - id: engineering-strategy-and-prioritization-045
    difficulty: expert
    tags: [star, strong-answer, why-it-scores]
    question: |
      A candidate's prioritization story: diagnoses with a metric, scores options with
      RICE but overrides it using cost of delay, says no with data + an alternative, and
      closes with a business result *and* that they were then trusted with cross-team
      roadmap calls. Why does this score at staff level?
    options:
      - "Because it uses the word RICE and correctly names a well-known prioritization framework by its acronym"
      - "Because it walks through a great deal of precise technical detail about how the underlying system was built"
      - "Because it shows metric-anchored diagnosis, framework use *plus* judgment override, a good no, and both a business result and a scope-expansion result"
      - "Because the candidate clearly worked long hours and put in heroic personal effort to get the outcome"
    answer: 2
    explanation: |
      It hits every staff signal: leads with a metric-anchored diagnosis, uses a framework
      and overrides it with economic judgment, says no with data and an alternative, and
      closes with a business result plus a scope-expansion (now owns cross-team calls) —
      demonstrating growth in scope.
    ref: "concepts.md#telling-the-story-a-strategy--hard-prioritization-star"
  - id: engineering-strategy-and-prioritization-046
    difficulty: advanced
    tags: [seniority-ladder, scope, staff]
    question: |
      By published-ladder scope definitions, which prioritization behavior signals *staff*
      (L6) rather than senior (L5)?
    options:
      - "Deciding the order in which to tackle the subtasks within your own individually-assigned feature"
      - "Owning and maintaining the roadmap for a single component that your team is responsible for"
      - "Finishing the tickets you've been assigned in an efficient order that gets you done sooner"
      - "Setting team or multi-team technical strategy, deciding what a team should NOT do, and resolving cross-team prioritization conflicts"
    answer: 3
    explanation: |
      Ladders (Dropbox, CircleCI, GitLab, RtR) map level to decision scope. Staff owns
      team/multi-team strategy, decides what a team won't do, ties direction to business
      outcomes, and resolves cross-team conflicts. Subtask ordering and single-component
      roadmaps are mid/senior scope.
    ref: "concepts.md#the-seniority-rubric-what-scope-of-strategy-signals-what-level"
  - id: engineering-strategy-and-prioritization-047
    difficulty: advanced
    tags: [seniority, scope-upgrade, what-not-to-do]
    question: |
      What's the fastest way to upgrade the perceived *scope* of a prioritization answer?
    options:
      - "Show you decided what NOT to do and influenced *others'* priorities — e.g., convincing two teams to deprioritize their asks to unblock a shared platform"
      - "Go into more technical detail about the implementation and the engineering complexity behind the work you shipped"
      - "Mention exactly how many story points the work came out to and how that compared to the team's usual velocity"
      - "Emphasize that you personally wrote all of the code and handled the entire implementation single-handedly"
    answer: 0
    explanation: |
      Deciding what NOT to do and influencing others' priorities is staff-scoped;
      "I finished my tickets in the right order" is not. Cross-team influence and explicit
      cuts signal the higher altitude ladders reward.
    ref: "concepts.md#the-seniority-rubric-what-scope-of-strategy-signals-what-level"
  - id: engineering-strategy-and-prioritization-048
    difficulty: expert
    tags: [staff-archetypes, larson, scope]
    question: |
      In Larson's Staff Engineer archetypes, which one operates at *organizational* strategy
      scope alongside senior leadership?
    options:
      - "The Tech Lead, who drives a single team's day-to-day execution and sequencing"
      - "The Right Hand"
      - "The Solver, who is parachuted into the thorniest priority and ambiguity problems"
      - "The Architect, who owns the long-term technical direction for a specific area"
    answer: 1
    explanation: |
      The Right Hand operates at org-strategy scope alongside leadership. The Tech Lead
      drives a team's execution/sequencing, the Architect owns technical direction for an
      area, and the Solver is deployed at the thorniest priority/ambiguity problems.
    ref: "concepts.md#the-seniority-rubric-what-scope-of-strategy-signals-what-level"
  - id: engineering-strategy-and-prioritization-049
    difficulty: intermediate
    tags: [decide-what-to-work-on, failure-mode]
    question: |
      Why does answering "I work on whatever's highest priority in Jira" score poorly on a
      staff+ "how do you decide what to work on" question?
    options:
      - "Because it outsources judgment to whoever wrote the tickets — interviewers want to hear that *you* formed a view of what mattered and influenced the backlog"
      - "Because Jira is an inferior tool and interviewers expect senior engineers to prefer more modern planning software"
      - "Because a staff+ engineer should never rely on a backlog at all and ought to track their work some other way"
      - "Because the items ranked highest-priority in a backlog are, more often than not, actually the wrong things to build"
    answer: 0
    explanation: |
      Consuming the backlog as given outsources prioritization judgment. Staff+ signal is
      forming your own view of what matters (from the goal/constraint) and *influencing* the
      backlog, not just executing it.
    ref: "concepts.md#how-do-you-decide-what-to-work-on"
  - id: engineering-strategy-and-prioritization-050
    difficulty: intermediate
    tags: [frameworks, wrong-tool, judgment]
    question: |
      An interviewer asks how you'd prioritize the response to a live "the site is down"
      incident. Reaching for a full RICE spreadsheet would signal what?
    options:
      - "Strong rigor and a disciplined, repeatable prioritization process that others on the team can follow"
      - "That you consistently value data-driven decisions and refuse to prioritize anything on gut feel alone"
      - "Pattern-matching a framework without thinking — RICE is for comparing product bets, not an active incident where urgency dominates"
      - "That you're being appropriately careful and methodical rather than reacting hastily under time pressure"
    answer: 2
    explanation: |
      Naming the right framework for the situation matters; applying RICE to a live incident
      (where urgency, not comparative reach/effort, dominates) signals mechanical
      pattern-matching. Judgment is choosing the right tool, not always the same one.
    ref: "concepts.md#prioritization-frameworks-and-when-to-use-each"
  - id: engineering-strategy-and-prioritization-051
    difficulty: beginner
    tags: [strategy, diagnosis, definition]
    question: |
      What is the "diagnosis" step of Rumelt's strategy kernel?
    options:
      - "The list of concrete, mutually reinforcing tasks the team will actually execute to carry out the plan"
      - "The revenue or growth target for the year that the strategy is ultimately meant to help the team hit"
      - "The overall approach or guiding policy the team will take to deal with the challenge it faces"
      - "Naming the one core challenge, stripped of noise, that the strategy addresses"
    answer: 3
    explanation: |
      Diagnosis names the single core challenge clearly (e.g., "checkout latency, not
      features, is the constraint"). The overall approach is the guiding policy; the tasks
      are the coherent actions; the revenue target is a goal, not a diagnosis.
    ref: "concepts.md#what-strategy-is-and-why-its-a-staff-signal"
  - id: engineering-strategy-and-prioritization-052
    difficulty: advanced
    tags: [cost-of-delay, quantify, business-language]
    question: |
      When justifying a priority to the people who fund your team, which framing is
      strongest?
    options:
      - "This is by far the most technically elegant and well-architected solution of all the options on the table"
      - "Each week we delay this loses roughly N customers / $X in revenue"
      - "The team really wants to build this and is genuinely excited and motivated to take the work on next"
      - "It lets us adopt the newest, most modern technology in our stack and keeps our engineering skills current"
    answer: 1
    explanation: |
      Converting a priority to "~$X/week while we wait" or "~N customers per week of delay"
      speaks the language of the people funding the team and shows you optimize for impact
      over personal or technical interest.
    ref: "concepts.md#cost-of-delay-and-opportunity-cost"
  - id: engineering-strategy-and-prioritization-053
    difficulty: intermediate
    tags: [tech-debt, standing-allocation, policy]
    question: |
      Why is a standing capacity allocation for health work preferable to periodic
      stop-the-world cleanups?
    options:
      - "It gives the team permission to completely ignore tech debt during all of the rest of its working time"
      - "It guarantees that zero tech debt will ever accumulate in the codebase again once the allocation is in place"
      - "A steady tax continuously services debt so it never needs a scary, high-risk bankruptcy-style rewrite"
      - "It conveniently shifts all of the unglamorous tech-debt cleanup work onto the team's most junior engineers"
    answer: 2
    explanation: |
      A standing allocation (e.g., ~20% capacity) continuously services debt so it never
      compounds into a stop-the-world rewrite. "A steady tax beats a bankruptcy" — sustained
      investment over heroic one-time cleanups.
    ref: "concepts.md#tech-debt-vs-features-articulating-the-balance"
  - id: engineering-strategy-and-prioritization-054
    difficulty: advanced
    tags: [saying-no, yes-if, pattern]
    question: |
      What's wrong with responding to a mid-sprint request with just a bare "no, it's not
      in the sprint," even when you're technically right?
    options:
      - "It's politically costly and makes you look inflexible; the stronger pattern is 'yes-if / no-because + alternative' that keeps the relationship intact"
      - "Nothing is wrong with it — protecting the committed sprint is always the correct call no matter who is asking"
      - "It's too slow a response to give in the moment; a good engineer should be able to answer such a request instantly"
      - "It gives away far too much information about the team's internal sprint planning and current commitments"
    answer: 0
    explanation: |
      A bare no is rigid and damages relationships even when correct. The strong pattern
      acknowledges the value, anchors on the commitment, makes the trade-off visible and
      theirs, and offers a path (defer, smaller version, or trade).
    ref: "concepts.md#saying-no-managing-the-backlog-and-defending-priorities"
  - id: engineering-strategy-and-prioritization-055
    difficulty: advanced
    tags: [strategy, coherent-actions, definition]
    question: |
      In Rumelt's kernel, what makes a set of "coherent actions" coherent?
    options:
      - "They are all assigned to and owned by the same single engineer so responsibility stays in one place"
      - "They each carry a firm deadline and target date so the team can track progress against a schedule"
      - "They are ranked against one another by RICE score so the highest-scoring action is always done first"
      - "They are concrete steps that mutually reinforce each other in service of the guiding policy"
    answer: 3
    explanation: |
      Coherent actions are concrete, *mutually reinforcing* steps that carry out the guiding
      policy — pulling in the same direction. A soup of contradictory or unrelated
      objectives is the incoherence that marks bad strategy.
    ref: "concepts.md#what-strategy-is-and-why-its-a-staff-signal"
  - id: engineering-strategy-and-prioritization-056
    difficulty: expert
    tags: [scope, ladder, story-matching]
    question: |
      You're interviewing for a staff (L6) role. Which prioritization story best matches the
      level?
    options:
      - "How you chose the optimal data structure for a performance-critical hot loop and shaved off latency"
      - "How you decided what your team would NOT do this year and defended that cut to leadership, resolving conflicts with two other teams"
      - "How you decided the order of your own sprint tasks so that you could finish your assigned work faster"
      - "How you tracked down and fixed a tricky, elusive production bug while under significant time pressure"
    answer: 1
    explanation: |
      A staff loop wants a story at team/multi-team decision scope: deciding what the team
      won't do, defending it to leadership, resolving cross-team conflicts. Data-structure
      choice, personal task ordering, and bug-fixing are lower-scope stories.
    ref: "concepts.md#the-seniority-rubric-what-scope-of-strategy-signals-what-level"
