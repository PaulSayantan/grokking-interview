topic: "Leveling, Negotiation & Reverse Questions"
domain: interview-craft
topic_slug: leveling-negotiation-and-reverse-questions
version: 1
questions:
- id: leveling-negotiation-and-reverse-questions-001
  difficulty: beginner
  tags: [leveling, mechanics, debrief]
  question: |
    At a company like Amazon, who ultimately decides the level a candidate is placed at
    after the loop?
  options:
  - "The debrief / hiring committee, calibrated against the scope the stories proved (with a Bar Raiser
    owning consistency)"
  - "The single interviewer who liked the candidate most"
  - "The recruiter alone, based on the résumé"
  - "The candidate, by choosing which offer band to accept"
  answer: 0
  explanation: |
    Leveling is a committee decision, not a single interviewer's call. Each interviewer files
    independent feedback with a leveling recommendation and evidence; a debrief reconciles
    them. At Amazon a Bar Raiser (not on the hiring team) owns bar and leveling consistency.
    The level is calibrated to the scope your stories demonstrably proved you owned.
  ref: "concepts.md#how-leveling-is-decided"

- id: leveling-negotiation-and-reverse-questions-002
  difficulty: intermediate
  tags: [leveling, mixed-signal, calibration]
  question: |
    Two interviewers saw clear Senior-level scope; two saw only Mid-level scope. What is the
    most likely leveling outcome, and what does it imply for your prep?
  options:
  - "The committee splits the difference and always offers the higher level to close the candidate"
  - "Ambiguous signal defaults down, so you must bring consistent senior-scope framing to every round"
  - "Only the coding round matters, so the behavioral inconsistency is ignored"
  - "The recruiter overrides the panel and picks the level the candidate prefers"
  answer: 1
  explanation: |
    When signal is mixed, committees rarely gamble up — the cost of a bad senior hire is
    higher, so ambiguity defaults down. That's why one round where you only conveyed
    feature-level scope can cap you. Bring the same level of scope/impact framing to every
    round, including the ones that feel junior.
  ref: "concepts.md#how-leveling-is-decided"

- id: leveling-negotiation-and-reverse-questions-003
  difficulty: intermediate
  tags: [leveling, scope, senior-bar]
  question: |
    Which statement best demonstrates the scope evidence that clears a senior+ leveling bar?
  options:
  - "I always finished my assigned tickets on time and had few bugs"
  - "I have eight years of experience and know several languages"
  - "I attended all the design reviews and gave feedback when asked"
  - "I owned the payments migration end-to-end across three teams and set the idempotency standard they
    still follow"
  answer: 3
  explanation: |
    Senior+ leveling is about scope owned end-to-end, autonomous decisions, and multiplier
    impact. The payments-migration answer proves cross-team ownership plus a standard others
    follow (multiplier). Finishing tickets is task completion; tenure and attendance are not
    scope signals.
  ref: "concepts.md#how-leveling-is-decided"

- id: leveling-negotiation-and-reverse-questions-004
  difficulty: beginner
  tags: [down-leveling, definition]
  question: |
    What is "down-leveling"?
  options:
  - "A promotion that skips a level"
  - "Being offered a level below the one you targeted (often below your current title)"
  - "Reducing the number of interview rounds"
  - "Lowering the base salary while keeping the level"
  answer: 1
  explanation: |
    Down-leveling is receiving an offer at a level below your target, typically because the
    loop's scope evidence didn't clearly clear the higher bar or the company's bands are
    stricter. It sets your pay band, scope, and promo clock lower from day one.
  ref: "concepts.md#down-leveling-risk-and-how-to-protect-against-it"

- id: leveling-negotiation-and-reverse-questions-005
  difficulty: advanced
  tags: [down-leveling, signing-bonus, tradeoff]
  question: |
    A company down-levels you but offers a large one-time signing bonus "to make up for it."
    What is the soundest way to evaluate this?
  options:
  - "A one-time bonus does not fix a permanently lower pay band or slower equity; weigh the long-term
    band and promo cost, and consider pushing back or walking"
  - "Accept immediately — the bonus makes the total the same"
  - "Always reject any offer that includes a signing bonus"
  - "Take it and quit after collecting the bonus"
  answer: 0
  explanation: |
    A signing bonus is one-time cash; the level sets a permanent pay band, scope, equity size,
    and promo clock. Recovering a level internally is a slow, uncertain grind. Level almost
    always beats one-time cash — do the multi-year math and consider a rebuttal or walking.
  ref: "concepts.md#down-leveling-risk-and-how-to-protect-against-it"

- id: leveling-negotiation-and-reverse-questions-006
  difficulty: intermediate
  tags: [down-leveling, pushback, evidence]
  question: |
    You believe you were down-leveled unfairly. Which response is most likely to actually
    change the outcome?
  options:
  - "Insist you deserve the higher level because you have more years than the bar"
  - "Threaten to post about it on social media"
  - "Accept quietly and hope for a fast internal promotion"
  - "Ask what scope evidence they'd have needed for the higher level, then present a relevant project
    or reference you didn't get to discuss"
  answer: 3
  explanation: |
    Companies re-level when given a concrete, evidence-based reason. Asking for the specific
    scope gap turns a feelings dispute into data, and lets you supply missing evidence (a
    project, a reference, or an extra senior-scope round). Tenure arguments and threats don't
    move committees; silent acceptance forfeits the leverage.
  ref: "concepts.md#down-leveling-risk-and-how-to-protect-against-it"

- id: leveling-negotiation-and-reverse-questions-007
  difficulty: beginner
  tags: [asking-level, early, recruiter]
  question: |
    Why should a senior candidate ask about the target level early with the recruiter?
  options:
  - "To skip the technical rounds"
  - "So the loop is calibrated to the right bar and you bring level-appropriate stories, avoiding a mis-leveled
    outcome"
  - "Because it locks in the maximum salary automatically"
  - "It has no effect; level is decided only after the loop"
  answer: 1
  explanation: |
    Knowing the target level lets you calibrate your stories to the right scope and ensures
    interviewers probe for the right signal. Going through a full loop mis-leveled usually
    ends in a down-level or a rejection for over-reaching. Recruiters expect senior candidates
    to ask — it reads as commercial awareness.
  ref: "concepts.md#asking-about-level-early"

- id: leveling-negotiation-and-reverse-questions-008
  difficulty: intermediate
  tags: [asking-level, phrasing, signal]
  question: |
    Which is the strongest way to ask about level early without seeming presumptuous?
  options:
  - "I'll only interview if you guarantee Staff up front"
  - "What's the highest level you've ever hired, and can I get that?"
  - "What level is this role scoped for, and what would tip it to the higher level? I want my experience
    to map to what you need"
  - "Don't worry about level, just put me wherever"
  answer: 2
  explanation: |
    Framing it as alignment ("map my experience to what you need") plus asking what tips it
    higher gives you the scope to demonstrate, and reads as commercial awareness. A hard
    demand is presumptuous; deferring entirely forfeits calibration.
  ref: "concepts.md#asking-about-level-early"

- id: leveling-negotiation-and-reverse-questions-009
  difficulty: beginner
  tags: [total-comp, components]
  question: |
    Tech "total compensation" (TC) is typically made up of which components?
  options:
  - "Base salary only"
  - "Base salary and annual bonus only"
  - "Equity and perks only"
  - "Base salary + bonus + equity + sign-on bonus"
  answer: 3
  explanation: |
    TC is a package: base salary, an annual bonus (a target %, not guaranteed), equity (RSUs
    or options vesting over ~4 years), and a one-time sign-on bonus. At senior+, equity is
    often the largest component, so comparing offers on base alone is a classic mistake.
  ref: "concepts.md#total-compensation-base--bonus--equity--sign-on"

- id: leveling-negotiation-and-reverse-questions-010
  difficulty: intermediate
  tags: [total-comp, comparison, vesting]
  question: |
    Offer A: $180k base, $50k target bonus, $600k equity over 4 years. Offer B: $210k base,
    no bonus, $200k equity over 4 years. What's the right way to compare them?
  options:
  - "Compare base only — A is worse because $180k < $210k"
  - "Pick B because a higher base is always better"
  - "Compute average annual total comp over 4 years (A ≈ $380k, B ≈ $260k), and eye the year-by-year curve"
  - "Only equity matters, so pick A regardless of everything else"
  answer: 2
  explanation: |
    Compare average annual TC over the vesting horizon: A is ~$180k + $50k + $150k/yr ≈ $380k;
    B is ~$210k + $50k/yr ≈ $260k. Base-only comparison is the classic error. Also inspect the
    year-by-year curve, especially with back-loaded vesting.
  ref: "concepts.md#total-compensation-base--bonus--equity--sign-on"

- id: leveling-negotiation-and-reverse-questions-011
  difficulty: advanced
  tags: [total-comp, amazon, sign-on, vesting]
  question: |
    Why does Amazon typically front-load large Year-1 and Year-2 signing bonuses?
  options:
  - "To avoid paying any equity at all"
  - "Because its RSUs vest on a back-loaded 5/15/40/40 schedule, so sign-on bridges the low early-year
    equity"
  - "Because base salaries are illegal to raise there"
  - "To make the offer expire faster"
  answer: 1
  explanation: |
    Amazon's RSU vesting is back-loaded (5% year 1, 15% year 2, 40%, 40%), so early-year
    equity is small. Front-loaded sign-on bonuses smooth Year-1/Year-2 cash. The honest number
    to compare is average annual TC over 4 years, watching how the curve rises later.
  ref: "concepts.md#total-compensation-base--bonus--equity--sign-on"

- id: leveling-negotiation-and-reverse-questions-012
  difficulty: intermediate
  tags: [total-comp, flexible-levers]
  question: |
    At senior+ levels, which components of an offer usually have the most negotiating room?
  options:
  - "Base salary, because it is almost never band-capped"
  - "The bonus target percentage only"
  - "None — offers are always final"
  - "Equity and sign-on bonus, since base is often constrained by the level's band"
  answer: 3
  explanation: |
    Base is often capped by the level's band, so it has the least give. Equity and sign-on
    typically have the most flexibility at senior+. Ask for a specific flexible lever rather
    than a vague "more."
  ref: "concepts.md#total-compensation-base--bonus--equity--sign-on"

- id: leveling-negotiation-and-reverse-questions-013
  difficulty: beginner
  tags: [benchmarking, levels-fyi, data]
  question: |
    What is the primary role of levels.fyi in an offer conversation?
  options:
  - "To ground your expectations and asks in real, level- and location-mapped total-comp data (and map
    titles across companies)"
  - "To apply to jobs automatically"
  - "To negotiate on your behalf with the recruiter"
  - "To guarantee a specific salary"
  answer: 0
  explanation: |
    levels.fyi provides crowd-sourced TC by company/level/location and maps titles across
    companies (Google L5 ≈ Meta E5 ≈ Amazon L6). It turns negotiation from a feelings argument
    into a defensible, data-backed one and tells you the realistic ceiling.
  ref: "concepts.md#benchmarking-with-market-data-levelsfyi"

- id: leveling-negotiation-and-reverse-questions-014
  difficulty: intermediate
  tags: [benchmarking, anchoring, phrasing]
  question: |
    Which counter uses market data most effectively?
  options:
  - "I think I'm worth a lot more, honestly"
  - "Just give me your best number and I'll decide"
  - "My friend at another company makes double, so match that"
  - "levels.fyi puts L6 TC in this market at $X–$Y; my offer's at the low end — can we get to the midpoint
    on equity?"
  answer: 3
  explanation: |
    A named source + a specific number + a specific flexible lever is a request a recruiter
    can take to the committee. Vague "I'm worth more," passivity, and unverifiable hearsay all
    lack the defensible, level- and location-specific data that moves an offer.
  ref: "concepts.md#benchmarking-with-market-data-levelsfyi"

- id: leveling-negotiation-and-reverse-questions-015
  difficulty: intermediate
  tags: [benchmarking, location, level-mapping]
  question: |
    When pulling comp data to benchmark an offer, what is the most important thing to control
    for?
  options:
  - "The company's stock ticker symbol"
  - "The interviewer's personal salary"
  - "Level and location — don't compare a Bay Area L6 to a remote-Midwest L5"
  - "The number of interview rounds you did"
  answer: 2
  explanation: |
    Comp is level- and location-specific. Comparing across mismatched levels or geographies
    produces a meaningless anchor. Pull the level-specific, market-specific band, and use
    cross-company title mapping to argue level equivalence.
  ref: "concepts.md#benchmarking-with-market-data-levelsfyi"

- id: leveling-negotiation-and-reverse-questions-016
  difficulty: intermediate
  tags: [expectations-trap, anchoring]
  question: |
    A recruiter asks in the first screen, "What are your salary expectations?" Why is
    naming a specific low number here risky?
  options:
  - "It's illegal to answer at all"
  - "The number you give early can become the ceiling for the whole negotiation"
  - "Recruiters always double whatever you say"
  - "It has no effect on the final offer"
  answer: 1
  explanation: |
    Whoever names a number first often sets the anchor. A low number in the first screen can
    cap the entire negotiation. Deflect to the role's budgeted band first; if pressed, anchor
    high-but-defensible on researched market data.
  ref: "concepts.md#the-what-are-your-expectations-trap"

- id: leveling-negotiation-and-reverse-questions-017
  difficulty: intermediate
  tags: [expectations-trap, current-salary, deflect]
  question: |
    The recruiter asks what you currently make. What is the strongest response?
  options:
  - "State your exact current salary to seem transparent"
  - "Refuse to answer anything and end the call"
  - "I'd rather focus on the value of this role — what's the band you've budgeted for this level?"
  - "Give a number 5% above your current salary"
  answer: 2
  explanation: |
    Naming current comp anchors you to your old job, not the new role's value, and lets them
    offer a small bump instead of market rate (several jurisdictions now ban the question).
    Deflecting to the budgeted band flips the anchor to them without being combative.
  ref: "concepts.md#the-what-are-your-expectations-trap"

- id: leveling-negotiation-and-reverse-questions-018
  difficulty: advanced
  tags: [expectations-trap, range, anchoring]
  question: |
    If you must give an expectations range, how should you construct it?
  options:
  - "Set the bottom at a number you'd actually accept and place your target in the middle of what they'll
    likely offer, anchored on market data"
  - "Make the bottom a number you'd be unhappy to accept, to look flexible"
  - "Give a single exact number with no range"
  - "Give a range far above market so they know you're serious"
  answer: 0
  explanation: |
    They may hear the bottom of your range as the offer, so never state a floor you'd resent.
    Set the bottom to something acceptable and anchor the target on researched market data.
    An absurdly high range signals you haven't done homework and burns credibility.
  ref: "concepts.md#the-what-are-your-expectations-trap"

- id: leveling-negotiation-and-reverse-questions-019
  difficulty: beginner
  tags: [negotiation, leverage, competing-offers]
  question: |
    What is the strongest *honest* form of leverage in a comp negotiation?
  options:
  - "A fabricated competing offer with an inflated number"
  - "Threatening to badmouth the company"
  - "Refusing to speak until they raise the number"
  - "A genuine competing offer, stated factually with its real number"
  answer: 3
  explanation: |
    A real competing offer, stated factually ("I have an offer at $Y TC; I'd prefer to join
    you if we can close the gap"), is the strongest honest leverage. Fabricating one is an
    integrity risk that can get an offer rescinded; threats damage the relationship.
  ref: "concepts.md#negotiating-respectfully-with-data-and-leverage"

- id: leveling-negotiation-and-reverse-questions-020
  difficulty: advanced
  tags: [negotiation, framing, collaborative]
  question: |
    Which negotiation opener is most likely to get the recruiter advocating for you internally?
  options:
  - "I'm excited about the team and want to say yes. Here's the gap and the data behind it — what can
    we do on equity or sign-on?"
  - "$250k or I walk — final answer"
  - "Everyone knows you underpay, so fix it"
  - "I'll accept whatever, I just really need a job"
  answer: 0
  explanation: |
    Collaborative, data-backed framing ("help me get to yes") turns the recruiter into your
    advocate with the committee. Ultimatums are adversarial and risky; insults poison the
    relationship; desperation signals you undervalue yourself and invites a lowball.
  ref: "concepts.md#negotiating-respectfully-with-data-and-leverage"

- id: leveling-negotiation-and-reverse-questions-021
  difficulty: intermediate
  tags: [negotiation, failure-modes, re-trading]
  question: |
    Which behavior during negotiation is most likely to damage the relationship or get an
    offer pulled?
  options:
  - "Asking for a few days to consider the written offer"
  - "Agreeing to terms, then re-opening them (re-trading) or issuing an exploding ultimatum"
  - "Countering once, respectfully, with market data"
  - "Asking whether equity or sign-on has room"
  answer: 1
  explanation: |
    Re-trading (agreeing then re-opening) and exploding ultimatums read as bad-faith and are
    what actually damage relationships or trigger a rescind. Asking for time, countering once
    with data, and probing flexible levers are all normal and expected.
  ref: "concepts.md#negotiating-respectfully-with-data-and-leverage"

- id: leveling-negotiation-and-reverse-questions-022
  difficulty: intermediate
  tags: [negotiation, specific-lever]
  question: |
    Your base is at the top of the band but you want more TC. What's the most effective ask?
  options:
  - "Ask for a specific flexible lever: additional equity or a larger sign-on"
  - "Just ask for 'more money' and let them figure it out"
  - "Demand a base above the band ceiling"
  - "Ask for a title change instead of comp"
  answer: 0
  explanation: |
    When base is band-capped, target the components with give — equity and sign-on — and ask
    for them specifically. A vague "more" is easy to deflect; demanding base above the ceiling
    isn't something the recruiter can grant.
  ref: "concepts.md#negotiating-respectfully-with-data-and-leverage"

- id: leveling-negotiation-and-reverse-questions-023
  difficulty: beginner
  tags: [close, in-writing, on-the-spot]
  question: |
    A recruiter calls with a verbal offer and asks you to accept right now. What's the best
    move?
  options:
  - "Accept immediately so they don't rescind"
  - "Reject on the spot to seem in demand"
  - "Thank them, express excitement, and ask for the full details in writing with a date to respond"
  - "Ask them to call back after you've resigned your current job"
  answer: 2
  explanation: |
    Never accept on the spot — it forecloses negotiation and any competing process. Express
    enthusiasm, ask for the written breakdown, and buy a reasonable window (days to a week) to
    review and counter. Never resign a current job on a verbal offer.
  ref: "concepts.md#never-accept-on-the-spot-get-it-in-writing"

- id: leveling-negotiation-and-reverse-questions-024
  difficulty: intermediate
  tags: [close, in-writing, details]
  question: |
    Why is it important to get every offer component in writing before agreeing?
  options:
  - "Because verbal offers are legally binding anyway"
  - "Because details omitted from writing (bonus %, vesting schedule, refresh policy, start date, remote
    status) are the ones that later 'weren't what we discussed'"
  - "Because it's the only way to negotiate base salary"
  - "Because HR requires you to print it"
  answer: 1
  explanation: |
    Verbal offers and "trust me" assurances aren't binding. Anything not written down — bonus
    target, vesting schedule, refresh policy, level, title, start date, remote status — is
    what later gets disputed. Get the full breakdown in writing before you commit.
  ref: "concepts.md#never-accept-on-the-spot-get-it-in-writing"

- id: leveling-negotiation-and-reverse-questions-025
  difficulty: advanced
  tags: [close, exploding-offer, pressure]
  question: |
    A company gives you a 24-hour "exploding" deadline to accept. What does this signal and
    how should you respond?
  options:
  - "It's normal; accept within 24 hours no matter what"
  - "It means the role is prestigious; you should feel lucky"
  - "It's a pressure tactic and a mild red flag; respond calmly and ask for a reasonable window (days,
    not hours)"
  - "Immediately decline the offer out of principle"
  answer: 2
  explanation: |
    Extreme deadline pressure is a tactic to foreclose negotiation and competing offers, and
    it's itself a mild red flag about the culture. A company that genuinely wants you can grant
    a reasonable window. Respond calmly and ask for the time you need.
  ref: "concepts.md#never-accept-on-the-spot-get-it-in-writing"

- id: leveling-negotiation-and-reverse-questions-026
  difficulty: beginner
  tags: [equity, rsus-vs-options]
  question: |
    What is the key difference between RSUs and stock options?
  options:
  - "RSUs become shares as they vest (value = share price × units); options are the right to *buy* shares
    at a fixed strike price, worth money only if the price exceeds the strike"
  - "RSUs are only for executives; options are for engineers"
  - "They are identical; the names are interchangeable"
  - "Options never require any payment to own the shares"
  answer: 0
  explanation: |
    An RSU converts to a share on vest with no purchase needed (value = current price × units).
    An option is the right to buy at a fixed strike; it's worth money only when the share price
    exceeds the strike, and you must exercise (pay the strike) to own the shares. Options are
    common at startups.
  ref: "concepts.md#equity-nuances-rsus-vs-options-vesting-refreshers"

- id: leveling-negotiation-and-reverse-questions-027
  difficulty: intermediate
  tags: [equity, cliff, vesting]
  question: |
    Under a standard "4-year vest with a 1-year cliff," what happens if you leave after 10
    months?
  options:
  - "You keep 10/48 of the grant"
  - "You keep 25% of the grant"
  - "You keep the full grant"
  - "You get zero equity — nothing vests before the 1-year cliff"
  answer: 3
  explanation: |
    The cliff means nothing vests until month 12; leaving before the cliff forfeits all equity.
    After the cliff, the first chunk (often 25%) vests and the rest accrues monthly/quarterly.
    This is why the cliff and vesting schedule matter as much as the headline number.
  ref: "concepts.md#equity-nuances-rsus-vs-options-vesting-refreshers"

- id: leveling-negotiation-and-reverse-questions-028
  difficulty: advanced
  tags: [equity, refreshers, comp-cliff]
  question: |
    Why should you ask about the refresher (annual-grant) policy before accepting an offer
    heavy on initial equity?
  options:
  - "Refreshers replace your base salary"
  - "Refreshers are taxed at 0%"
  - "Without refreshers, TC can fall off a cliff around year 4-5 when the initial grant fully vests"
  - "Refreshers guarantee the stock price will rise"
  answer: 2
  explanation: |
    Refreshers are additional grants awarded during employment that offset the drop when your
    initial 4-year grant runs out. Without them, comp can crater around year 4-5 even if
    year-1 looked great. Always ask about the refresh/annual-grant policy.
  ref: "concepts.md#equity-nuances-rsus-vs-options-vesting-refreshers"

- id: leveling-negotiation-and-reverse-questions-029
  difficulty: intermediate
  tags: [equity, questions, valuation]
  question: |
    When a recruiter quotes an equity number, which question most improves your ability to
    value it accurately?
  options:
  - "Is the grant quoted in shares or dollars, and at what share price?"
  - "How many people have this grant?"
  - "What color is the stock certificate?"
  - "Can I sell it before it vests?"
  answer: 0
  explanation: |
    A grant quoted in shares at a stale or projected price can wildly mislead. Knowing whether
    it's shares or dollars and the assumed share price lets you value RSUs at the current price.
    Also ask about vesting schedule, cliff, and refresh policy.
  ref: "concepts.md#equity-nuances-rsus-vs-options-vesting-refreshers"

- id: leveling-negotiation-and-reverse-questions-030
  difficulty: intermediate
  tags: [startup-equity, percent-ownership]
  question: |
    A startup offers you "100,000 shares." Why is this number alone nearly meaningless?
  options:
  - "Because share counts are always fake"
  - "Because startups never issue real shares"
  - "Because 100,000 is too small to matter at any company"
  - "Without the fully-diluted shares outstanding (the denominator), you can't compute your percentage
    ownership"
  answer: 3
  explanation: |
    Ownership is your shares ÷ fully-diluted shares outstanding. 100,000 shares could be 5% or
    0.01% depending on the total. Always ask for the percentage on a fully-diluted basis, not
    just the share count.
  ref: "concepts.md#startup-equity-percent-ownership-dilution-and-strike-price"

- id: leveling-negotiation-and-reverse-questions-031
  difficulty: advanced
  tags: [startup-equity, dilution]
  question: |
    What does "dilution" mean for your startup equity over time?
  options:
  - "Your shares automatically increase each year"
  - "Future funding rounds issue new shares, shrinking your percentage ownership (e.g., 0.5% today may
    become 0.2% after two rounds)"
  - "The company buys back your shares at a premium"
  - "Your strike price falls to zero"
  answer: 1
  explanation: |
    Each funding round issues new shares, so your percentage shrinks unless you're topped up.
    Early equity carries more dilution risk (and more upside). Model dilution when valuing an
    early-stage offer — today's 0.5% is not tomorrow's 0.5%.
  ref: "concepts.md#startup-equity-percent-ownership-dilution-and-strike-price"

- id: leveling-negotiation-and-reverse-questions-032
  difficulty: advanced
  tags: [startup-equity, preferences, common-vs-preferred]
  question: |
    A startup touts a "$1B valuation," yet employees' common shares might pay little in an
    exit. Why?
  options:
  - "Common shares are worth more than preferred shares"
  - "Valuations have no effect on payouts"
  - "Investors hold preferred stock with liquidation preferences that pay out *before* employees' common
    stock"
  - "Employees are always paid first in an acquisition"
  answer: 2
  explanation: |
    Investors hold preferred stock with liquidation preferences; in an exit those preferences
    pay out before common (employee) shares. Stacked preferences can leave common holders with
    little even at a high headline valuation. Value startup equity soberly.
  ref: "concepts.md#startup-equity-percent-ownership-dilution-and-strike-price"

- id: leveling-negotiation-and-reverse-questions-033
  difficulty: intermediate
  tags: [startup-equity, exercise-window, options]
  question: |
    For startup stock options, why does the post-termination exercise window matter?
  options:
  - "It determines your base salary"
  - "It sets the company's valuation"
  - "It guarantees a buyer for your shares"
  - "It's often only ~90 days to exercise vested options after you leave, requiring real cash to buy them
    or you forfeit them"
  answer: 3
  explanation: |
    Many plans give only ~90 days after leaving to exercise vested options, which means paying
    the strike out of pocket (plus possible taxes) or losing them. A short window plus a high
    strike can make "vested" equity practically unrealizable. Ask about it before signing.
  ref: "concepts.md#startup-equity-percent-ownership-dilution-and-strike-price"

- id: leveling-negotiation-and-reverse-questions-034
  difficulty: advanced
  tags: [startup-equity, red-flag, opacity]
  question: |
    A startup won't share your percentage ownership or basic cap-table details. How should you
    read this?
  options:
  - "It's normal; percentage is never disclosed"
  - "The opacity is itself a red flag — you can't value the equity, and refusal to share basics is a warning
    sign"
  - "It means the equity is definitely worthless"
  - "It's a good sign they're protecting you"
  answer: 1
  explanation: |
    You can't value options without percentage on a fully-diluted basis, the 409A/strike, the
    last round's price, and the preferences. Refusing to share these basics is a red flag about
    transparency and how they treat employees. Never accept on share count alone.
  ref: "concepts.md#startup-equity-percent-ownership-dilution-and-strike-price"

- id: leveling-negotiation-and-reverse-questions-035
  difficulty: beginner
  tags: [reverse-questions, scored, signal]
  question: |
    When an interviewer asks "Do you have any questions for me?", what should you assume about
    how it's treated?
  options:
  - "It's just filler and isn't evaluated"
  - "It only matters to the recruiter, not interviewers"
  - "It's a trick and you should decline to ask anything"
  - "It's scored — good questions signal engagement and seniority, and asking none is a negative signal"
  answer: 3
  explanation: |
    The closing question slot is evaluated. Thoughtful questions demonstrate curiosity, fit
    evaluation, and seniority; asking nothing reads as disinterest or passivity. It's also your
    window to interview them, so always come prepared with more questions than you'll need.
  ref: "concepts.md#reverse-questions-why-any-questions-for-me-is-scored"

- id: leveling-negotiation-and-reverse-questions-036
  difficulty: intermediate
  tags: [reverse-questions, tailoring]
  question: |
    You have three back-to-back interviews: a peer engineer, an EM, and a skip-level director.
    What's the best approach to reverse questions?
  options:
  - "Tailor questions to each role — codebase/tech to the engineer, team health to the EM, strategy to
    the director"
  - "Ask all three the exact same list of questions"
  - "Only ask the director questions; the others don't matter"
  - "Ask only about compensation in every round"
  answer: 0
  explanation: |
    Tailoring shows you understand who's in front of you and what they can speak to: ask the
    engineer about the codebase and trade-offs, the EM about team health and success metrics,
    the skip-level about org strategy. Comp questions belong with the recruiter, not peers.
  ref: "concepts.md#reverse-questions-why-any-questions-for-me-is-scored"

- id: leveling-negotiation-and-reverse-questions-037
  difficulty: intermediate
  tags: [reverse-questions, bad-questions, failure-mode]
  question: |
    Which reverse question is most likely to *hurt* you when asked of a peer engineer?
  options:
  - "What's the biggest technical challenge the team faces in the next 6-12 months?"
  - "How are technical disagreements resolved here?"
  - "Where's the most technical debt and how do you decide to pay it down?"
  - "What's the WFH policy, PTO, and can I negotiate more vacation?"
  answer: 3
  explanation: |
    Leading with perks/comp/WFH to a peer engineer reads as low interest in the work and
    misreads the audience — those belong with the recruiter. The other three are
    seniority-signaling questions about challenges, decision-making, and tech debt.
  ref: "concepts.md#reverse-questions-why-any-questions-for-me-is-scored"

- id: leveling-negotiation-and-reverse-questions-038
  difficulty: intermediate
  tags: [reverse-questions, seniority-signal, success]
  question: |
    Which reverse question best signals an impact/outcome orientation to a hiring manager?
  options:
  - "How is success measured for this role in the first 6 and 12 months?"
  - "How many vacation days do I get?"
  - "What time does everyone go home?"
  - "Do I have to do code reviews?"
  answer: 0
  explanation: |
    Asking how success is measured shows you're already thinking in terms of outcomes and
    impact — a senior signal — and the answer tells you exactly how you'll be judged. The
    others read as junior or perk-focused.
  ref: "concepts.md#reverse-questions-that-signal-seniority"

- id: leveling-negotiation-and-reverse-questions-039
  difficulty: advanced
  tags: [reverse-questions, seniority-signal, cross-team]
  question: |
    Which reverse question most demonstrates staff-level, cross-team thinking?
  options:
  - "How big is the codebase?"
  - "What IDE does everyone use?"
  - "How does this team influence and get influenced by other teams and the broader architecture?"
  - "Is lunch provided?"
  answer: 2
  explanation: |
    Asking about cross-team influence and architectural context shows you think beyond your own
    team's boundary — the scope axis that defines staff+. Tooling/logistics questions are fine
    but neutral; they don't signal seniority.
  ref: "concepts.md#reverse-questions-that-signal-seniority"

- id: leveling-negotiation-and-reverse-questions-040
  difficulty: intermediate
  tags: [reverse-questions, decision-making, seniority-signal]
  question: |
    Why is "How are technical decisions made and disagreements resolved — RFCs, a tech-lead
    call, or consensus?" a strong senior question?
  options:
  - "It shows you want to avoid all conflict"
  - "It probes the team's decision-making culture and shows you think about how technical direction and
    disagreement actually get handled"
  - "It's a trick to see if they use your favorite process"
  - "It signals you don't want to make decisions yourself"
  answer: 1
  explanation: |
    Senior engineers care about how decisions and disagreements are resolved because that
    determines whether good technical judgment actually lands. The question surfaces the
    team's process maturity and shows you think about organizational mechanics, not just code.
  ref: "concepts.md#reverse-questions-that-signal-seniority"

- id: leveling-negotiation-and-reverse-questions-041
  difficulty: intermediate
  tags: [red-flags, on-call, burnout]
  question: |
    Which reverse question best surfaces a potential burnout / poor-operations red flag?
  options:
  - "What's the company mission statement?"
  - "How old is the company?"
  - "What's the office address?"
  - "What does on-call look like — rotation frequency, pager load, and is it compensated?"
  answer: 3
  explanation: |
    Asking about on-call rotation frequency, pager load, and comp surfaces operational health.
    Constant pages, weekly rotations, or uncompensated on-call point to a burnout culture and
    brittle systems. Watch how they answer, not just what they say.
  ref: "concepts.md#red-flag-detecting-reverse-questions"

- id: leveling-negotiation-and-reverse-questions-042
  difficulty: advanced
  tags: [red-flags, attrition, consistency]
  question: |
    You ask several interviewers "Why did the last person in this role leave?" and get
    inconsistent, evasive answers. How should you weigh this?
  options:
  - "Ignore it; people just forget details"
  - "Inconsistent answers to the same question are a louder red flag than any single response — likely
    a retention or culture problem"
  - "It proves the team is honest and diverse"
  - "It means you asked the question wrong"
  answer: 1
  explanation: |
    Asking the same question across interviewers is a deliberate cross-check. Evasion or
    contradictory stories about attrition often signal a management or culture problem the team
    is papering over. Consistency (or its absence) is itself the signal.
  ref: "concepts.md#red-flag-detecting-reverse-questions"

- id: leveling-negotiation-and-reverse-questions-043
  difficulty: intermediate
  tags: [red-flags, tech-debt, tone]
  question: |
    You ask how the team balances tech debt against feature pressure and the manager says,
    "Honestly, we never have time for that." What's the best read?
  options:
  - "It's a red flag pointing toward a death-march culture and brittle systems; probe further and factor
    it into your decision"
  - "It's a great sign — they ship fast"
  - "It means they have no tech debt"
  - "It's irrelevant to your role"
  answer: 0
  explanation: |
    "We never have time for that" signals feature pressure crowding out sustainability —
    brittle systems, mounting debt, and likely burnout. The reverse question did its job as a
    due-diligence tool; weigh it (calmly, without accusing) in your decision.
  ref: "concepts.md#red-flag-detecting-reverse-questions"

- id: leveling-negotiation-and-reverse-questions-044
  difficulty: intermediate
  tags: [red-flags, role-open, backfill]
  question: |
    Why ask "Is this role open due to growth or backfill?"
  options:
  - "To find out the salary band"
  - "Because backfill roles always pay more"
  - "Repeated backfill for the same role can indicate a retention/culture problem, while growth is usually
    healthier"
  - "To learn the company's founding date"
  answer: 2
  explanation: |
    A growth role means the team is expanding; a role that keeps getting backfilled may signal
    people keep leaving it — a retention or management issue worth probing. It's a low-key way
    to surface churn.
  ref: "concepts.md#red-flag-detecting-reverse-questions"

- id: leveling-negotiation-and-reverse-questions-045
  difficulty: beginner
  tags: [research, preparation, interest]
  question: |
    Why does researching the company before the loop matter beyond just answering questions?
  options:
  - "It guarantees you'll pass the coding round"
  - "It powers tailored reverse questions, credible comp benchmarking, red-flag radar, and answers that
    connect your experience to their problems"
  - "It lets you skip the behavioral round"
  - "It's only needed for startups, not big companies"
  answer: 1
  explanation: |
    Research is the foundation for everything else in this topic: better tailored questions,
    informed leveling/comp benchmarks, red-flag awareness, and answers that map your experience
    to their actual problems. Senior candidates are expected to have done it.
  ref: "concepts.md#researching-the-company-and-interviewer"

- id: leveling-negotiation-and-reverse-questions-046
  difficulty: intermediate
  tags: [research, engineering-blog, specificity]
  question: |
    Which use of company research most effectively signals genuine, senior interest?
  options:
  - "I read your homepage — you make software, right?"
  - "I didn't have time to look you up, sorry"
  - "I saw on your engineering blog you moved to event-driven ingestion — how's that trade-off working
    out operationally?"
  - "I read you're a big company, so you must be stable"
  answer: 2
  explanation: |
    One specific, informed reference (from their eng blog, a talk, or GitHub) turned into a
    trade-off question instantly separates you from candidates who did zero prep and gives the
    interviewer an easy, engaged conversation. Generic or absent research reads as low interest.
  ref: "concepts.md#researching-the-company-and-interviewer"

- id: leveling-negotiation-and-reverse-questions-047
  difficulty: intermediate
  tags: [research, startup, equity-risk]
  question: |
    When researching a startup specifically, which factors most inform your evaluation of the
    offer's equity risk?
  options:
  - "Funding stage, last round, and runway — they inform dilution and how real the equity is"
  - "The founders' favorite programming languages"
  - "The number of office plants"
  - "How many blog posts they publish per month"
  answer: 0
  explanation: |
    Stage, last round, and runway tell you how much dilution is likely, how solid the valuation
    is, and whether the company can survive to a liquidity event. These directly shape how much
    you should weight the equity vs. cash in the offer.
  ref: "concepts.md#researching-the-company-and-interviewer"

- id: leveling-negotiation-and-reverse-questions-048
  difficulty: intermediate
  tags: [research, interviewer, linkedin, tailoring]
  question: |
    Why look up your interviewers' backgrounds (e.g., on LinkedIn) before the loop?
  options:
  - "To comment on their personal life during the interview"
  - "To tailor your reverse questions to each person's role — architecture to the staff engineer, team
    health to the EM"
  - "To find out their exact salary"
  - "To decide whether to show up at all"
  answer: 1
  explanation: |
    Knowing each interviewer's role and tenure lets you ask the questions they can best answer
    (a staff engineer about architecture, an EM about team health), which makes the reverse-
    question slot land. Keep it professional — it's about role, not personal life.
  ref: "concepts.md#researching-the-company-and-interviewer"

- id: leveling-negotiation-and-reverse-questions-049
  difficulty: advanced
  tags: [close, decision-flow, integration]
  question: |
    Following a sound offer-close process, what should happen immediately after you receive a
    verbal offer?
  options:
  - "Accept it before it disappears"
  - "Resign your current job to show commitment"
  - "Do not accept on the spot; get the full breakdown in writing, then benchmark TC against market data
    before countering"
  - "Counter aggressively before seeing anything in writing"
  answer: 2
  explanation: |
    The close flow is: don't accept on the spot → get base/bonus/equity+vesting/sign-on in
    writing → benchmark against levels.fyi for level and market → counter respectfully on
    flexible levers if below market → evaluate fit and red flags → decide by your stated date.
    Countering before you have the written details is premature.
  ref: "concepts.md#the-offer-close-decision-flow"

- id: leveling-negotiation-and-reverse-questions-050
  difficulty: advanced
  tags: [leveling, walk-away, decision]
  question: |
    A company insists on down-leveling you to Senior despite a strong loop, citing stricter
    bands, and won't budge on level or add meaningful comp. What's the most strategically sound
    option to seriously weigh?
  options:
  - "Weigh a walk-away and interviewing elsewhere at the correct level, since a down-level anchors your
    pay band and next-job baseline for years"
  - "Accept and plan to prove yourself for a fast internal promotion"
  - "Accept and immediately start interviewing to quit in three months"
  - "Demand the higher level or threaten legal action"
  answer: 0
  explanation: |
    A down-level compounds: it sets your pay band, scope, promo clock, and your next job's
    anchor. Internal promos are slow and uncertain. When level and comp are both stuck,
    declining and interviewing elsewhere at the right level is often the higher-EV move.
    Threats and churn-and-burn plans damage you more than the company.
  ref: "concepts.md#down-leveling-risk-and-how-to-protect-against-it"
