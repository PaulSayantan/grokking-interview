topic: "Incident Leadership & Blameless Postmortems (Behavioral)"
domain: interview-craft
topic_slug: incident-leadership-behavioral
version: 1
questions:
  - id: incident-leadership-behavioral-001
    difficulty: beginner
    tags: [why-outage-question, signal, fundamentals]
    question: |
      Why do senior/staff interviewers consider "tell me about a production outage you
      handled" a high-signal behavioral question?
    options:
      - "A real incident compresses ownership, calm communication, systems-thinking, and follow-through into one hard-to-fake story"
      - "It tests whether you have memorized the standard incident-response runbooks and can recite their steps in order"
      - "It reveals how many outages your company has had over the past year and how those numbers compare to competitors"
      - "It measures how quickly you can type terminal commands and navigate dashboards while under acute time pressure"
    answer: 0
    explanation: |
      An outage is a forcing function: it surfaces ownership under pressure, real-time
      prioritization, communication, and prevention — signals that are easy to claim
      abstractly but hard to fake inside a concrete incident timeline.
    ref: "concepts.md#why-the-outage-question-is-high-signal"

  - id: incident-leadership-behavioral-002
    difficulty: intermediate
    tags: [why-outage-question, ownership, story-selection]
    question: |
      You have two outage stories: (A) one you merely observed and followed a runbook for, and
      (B) one you partly caused, then owned, mitigated, and turned into a systemic fix. Which is
      the stronger interview story, and why?
    options:
      - "A — staying blameless by only observing means you look more competent and never risk being tied to a failure"
      - "A — it shows you can follow established runbooks and procedures precisely, which is what interviewers value most"
      - "B — owning a mistake you contributed to, then fixing the system, is the purest test of accountability and growth"
      - "Neither counts; interviewers only credit outages you personally resolved alone from start to finish with no help"
    answer: 2
    explanation: |
      Interviewers often prefer a story where you contributed to the incident, because owning
      your own mistake and turning it into a systemic improvement demonstrates accountability
      and learning far more powerfully than an outage you only observed.
    ref: "concepts.md#why-the-outage-question-is-high-signal"

  - id: incident-leadership-behavioral-003
    difficulty: beginner
    tags: [story-arc, opening, stakes]
    question: |
      What is the best way to OPEN an outage story?
    options:
      - "With the exact stack trace and the specific offending line of code you eventually tracked down"
      - "With a detailed description of the team's on-call rotation policy and its escalation tiers"
      - "With a vivid account of how stressed and overwhelmed you felt throughout the whole ordeal"
      - "With the stakes and your role: what broke, the blast radius, and that you were on the hook"
    answer: 3
    explanation: |
      Leading with stakes and your role ("checkout API 500-ing at peak, ~8% of orders failing,
      I was on call") establishes blast radius, urgency, and personal ownership in one sentence.
      Technical minutiae and feelings come later, if at all.
    ref: "concepts.md#the-incident-story-arc-the-beats-that-score"

  - id: incident-leadership-behavioral-004
    difficulty: intermediate
    tags: [story-arc, sequence, beats]
    question: |
      Which ordering of beats best matches the incident arc interviewers pattern-match against?
    options:
      - "Diagnose root cause → fix the code → declare severity → tell stakeholders → quietly close it out"
      - "Take ownership → mitigate first → communicate → diagnose root cause → blameless postmortem → follow-through"
      - "Communicate broadly → wait for a lead to take charge → diagnose slowly → apologize to everyone"
      - "Mitigate quickly → close the incident → move straight on to other work without any postmortem"
    answer: 1
    explanation: |
      The recognizable senior arc is: take ownership and assess severity, stop the bleeding
      (mitigate), communicate to stakeholders, then diagnose root cause, then run a blameless
      postmortem and land the follow-through that prevents recurrence.
    ref: "concepts.md#the-incident-story-arc-the-beats-that-score"

  - id: incident-leadership-behavioral-005
    difficulty: beginner
    tags: [mitigate-first, prioritization]
    question: |
      During a customer-impacting outage, what should your FIRST priority be?
    options:
      - "Restore service with a low-risk mitigation (e.g., roll back), then diagnose"
      - "Understand the exact root cause completely before you touch anything"
      - "Start writing the postmortem document while the incident is still ongoing"
      - "Find out which engineer's change caused it so they can own the fix"
    answer: 0
    explanation: |
      Mitigate first, diagnose second: when customers are impacted the priority is to restore
      service via a reversible, low-risk action (rollback, failover, feature-flag off). Root
      cause analysis happens after the bleeding stops.
    ref: "concepts.md#mitigate-first-diagnose-second"

  - id: incident-leadership-behavioral-006
    difficulty: intermediate
    tags: [mitigate-first, red-flag, judgment]
    question: |
      A candidate proudly says: "I spent 40 minutes reading logs during the outage to find the
      exact buggy line, then patched it." Why might this weaken their story?
    options:
      - "Forty minutes is far too fast to plausibly find the exact buggy line, so the story sounds invented"
      - "Reading logs is not a legitimate debugging technique that serious engineers rely on during an outage"
      - "They should have escalated to a manager immediately instead of trying to debug the problem themselves"
      - "It shows they optimized for their own curiosity over customer impact — they diagnosed before mitigating"
    answer: 3
    explanation: |
      Debugging before mitigating leaves customers down while you satisfy your need to
      understand. The senior instinct is to restore service quickly (e.g., roll back), then
      take your time on root cause with no clock pressure.
    ref: "concepts.md#mitigate-first-diagnose-second"

  - id: incident-leadership-behavioral-007
    difficulty: advanced
    tags: [mitigate-first, nuance, judgment]
    question: |
      You're paged for errors that started right after a schema migration deploy, but a blind
      rollback could corrupt data because the migration is only half-applied. What response best
      demonstrates staff-level judgment?
    options:
      - "Roll back immediately regardless of the half-applied migration, since mitigation always comes first no matter the risk"
      - "Ignore mitigation entirely and complete a full, exhaustive root-cause analysis before taking any corrective action at all"
      - "Diagnose just enough to find a safe mitigation (e.g., a forward-fix feature flag), then apply it — naming the trade-off explicitly"
      - "Wait patiently for the half-applied migration to finish on its own and simply hope the elevated error rate subsides"
    answer: 2
    explanation: |
      "Mitigate first" is a judgment heuristic, not a blind rule. When a naive rollback is
      unsafe, diagnosing just enough to find a safe mitigation — and articulating that
      trade-off — shows judgment rather than rule-following.
    ref: "concepts.md#mitigate-first-diagnose-second"

  - id: incident-leadership-behavioral-008
    difficulty: intermediate
    tags: [mitigate-first, techniques]
    question: |
      Which of these is a legitimate MITIGATION (restores service without requiring root cause),
      as opposed to a diagnosis step?
    options:
      - "Reading the slow-query log to understand which query regressed"
      - "Rolling back the most recent deploy to restore service"
      - "Bisecting commits to find the offending change"
      - "Reproducing the bug locally in a debugger"
    answer: 1
    explanation: |
      Mitigations are reversible, low-risk actions that restore service without knowing the
      root cause: rollback, failover, load-shedding, circuit breakers, feature flags, scaling
      up. The other options are diagnostic activities that come after service is stable.
    ref: "concepts.md#mitigate-first-diagnose-second"

  - id: incident-leadership-behavioral-009
    difficulty: beginner
    tags: [communication, cadence]
    question: |
      During an ongoing incident where you don't yet have answers, what is the best
      communication behavior?
    options:
      - "Stay silent until you have a confirmed root cause, to avoid spreading wrong information"
      - "Only update senior leadership directly, and skip support and dependent teams entirely"
      - "Wait for stakeholders to explicitly ask you before sharing any status at all"
      - "Post regular status updates on a fixed cadence even when there's no new news"
    answer: 3
    explanation: |
      Regular cadence beats perfect information. "Still investigating, service stable via
      rollback, next update in 15" is a valuable update — it tells stakeholders they don't need
      to escalate. Silence during an incident reads as loss of control.
    ref: "concepts.md#communicating-during-an-incident"

  - id: incident-leadership-behavioral-010
    difficulty: intermediate
    tags: [communication, audience, altitude]
    question: |
      Leadership joins the incident channel and asks for a status. What should you tell them?
    options:
      - "Blast radius, current mitigation status, ETA, and whether you need more people"
      - "The full stack trace, the suspect code path, and a line-by-line walkthrough of the failing function"
      - "A detailed history of the codebase's accumulated technical debt and how it built up over the years"
      - "Nothing substantive yet — just tell them you'll circle back with details after the incident is fully resolved"
    answer: 0
    explanation: |
      Communicate at the right altitude for the audience. Leadership wants blast radius, ETA,
      and whether to pull in more people — not stack traces. Matching altitude to audience is a
      communication-maturity signal.
    ref: "concepts.md#communicating-during-an-incident"

  - id: incident-leadership-behavioral-011
    difficulty: advanced
    tags: [communication, delegation, staff-signal]
    question: |
      You're the incident commander on a large SEV1 and you're also the person best able to
      write the fix. What is the strongest move?
    options:
      - "Do both — type the fix yourself while also personally posting every stakeholder update in the channel"
      - "Stop communicating entirely and go dark until the fix is written, tested, and fully deployed to prod"
      - "Delegate a dedicated comms lead so you can focus on the fix, keeping a fixed update cadence"
      - "Hand off the whole incident to someone else and step away so you aren't distracted by the pressure"
    answer: 2
    explanation: |
      Separating the comms role from the fix role in a large incident is a staff-level move.
      The responders can focus while stakeholders still get a steady cadence of updates. Trying
      to do both degrades both.
    ref: "concepts.md#communicating-during-an-incident"

  - id: incident-leadership-behavioral-012
    difficulty: beginner
    tags: [incident-commander, role]
    question: |
      What is the incident commander (IC) primarily responsible for?
    options:
      - "Personally writing and deploying the code fix that resolves the underlying defect"
      - "Assigning blame to whoever caused the incident so accountability is clear afterward"
      - "Approving the budget for the new infrastructure needed to prevent future incidents"
      - "Coordinating the response — severity, roles, decisions, and pulling in help — not necessarily debugging"
    answer: 3
    explanation: |
      The IC owns coordination: declaring severity, assigning roles (ops, comms, scribe), making
      the mitigate-vs-diagnose call, and deciding when to escalate. A great IC often touches no
      code — the role is coordination, not heroics.
    ref: "concepts.md#being-the-incident-commander-ic"

  - id: incident-leadership-behavioral-013
    difficulty: intermediate
    tags: [incident-commander, escalation]
    question: |
      Twenty minutes into an outage you're still debugging alone and not converging. You page
      the database on-call expert. How does this read in an interview?
    options:
      - "As a mature escalation call — knowing when to pull in expertise is a strength, not an admission of failure"
      - "As a failure — a strong engineer should have been able to solve the problem entirely on their own"
      - "As panic — reaching out for help always signals that you have lost control of the situation"
      - "As poor planning — a well-prepared on-call should never need to pull in help during an incident"
    answer: 0
    explanation: |
      Escalating to the right expert at the right moment is a strength. "I paged the DB on-call
      at 20 minutes because I judged we were past responsible solo-debugging time" shows
      judgment about when heroics stop being responsible.
    ref: "concepts.md#being-the-incident-commander-ic"

  - id: incident-leadership-behavioral-014
    difficulty: intermediate
    tags: [incident-commander, anti-pattern, hero]
    question: |
      A candidate describes single-handedly resolving a major outage: they refused to pull
      anyone in, didn't post updates, and fixed everything alone at 3am. What signal does this
      most likely send to a senior interviewer?
    options:
      - "Strong ownership and technical brilliance — clearly the best kind of engineer"
      - "A coordination and trust risk — heroics don't scale and often hide missing documentation and teamwork"
      - "Excellent delegation skills, since they clearly knew how to distribute the work across the team"
      - "A model of blameless culture, because they took the whole incident on themselves without blaming anyone"
    answer: 1
    explanation: |
      The lone-hero pattern reads as a coordination and trust risk even when the incident was
      resolved. It suggests the person won't escalate, won't communicate, and leaves no
      shareable record — behaviors that don't scale on a team.
    ref: "concepts.md#being-the-incident-commander-ic"

  - id: incident-leadership-behavioral-015
    difficulty: intermediate
    tags: [incident-commander, timeline, scribe]
    question: |
      Why should the IC (or a scribe) capture timestamps and events LIVE during an incident?
    options:
      - "To have documented evidence you can use to blame the responsible engineer later in the postmortem"
      - "Because compliance regulations legally require a cryptographically signed log of every keystroke made"
      - "It isn't really important, since the full timeline can always be rebuilt perfectly from memory afterward"
      - "To keep the postmortem accurate and avoid reconstructing (and unconsciously sanitizing) events after the fact"
    answer: 3
    explanation: |
      A live timeline keeps the postmortem factual and removes the temptation to reconstruct
      events later, which tends to sanitize or distort what actually happened. Accurate
      timelines make blameless analysis possible.
    ref: "concepts.md#being-the-incident-commander-ic"

  - id: incident-leadership-behavioral-016
    difficulty: beginner
    tags: [blameless, definition, culture]
    question: |
      What does a "blameless" postmortem focus on?
    options:
      - "Identifying precisely which individual made the mistake so they can be corrected and retrained"
      - "Determining whether the incident was severe enough to warrant writing a full postmortem at all"
      - "The systems and processes that allowed the incident, assuming people acted in good faith with the information they had"
      - "Documenting exactly who was on call and who touched what during the incident so that individual accountability is unambiguously clear afterward"
    answer: 2
    explanation: |
      A blameless postmortem investigates contributing causes without indicting individuals,
      assuming everyone acted in good faith. The operating principle: you can't fix people, but
      you can fix systems and processes.
    ref: "concepts.md#blameless-postmortem-culture"

  - id: incident-leadership-behavioral-017
    difficulty: intermediate
    tags: [blameless, psychological-safety, reliability]
    question: |
      Why is blamelessness treated as a RELIABILITY investment, not just a niceness?
    options:
      - "If people fear punishment they hide mistakes and stop escalating, so the organization stops learning and gets less reliable"
      - "It makes postmortem meetings noticeably shorter and cheaper to run across the whole engineering org"
      - "It lets managers avoid the difficult accountability conversations they would otherwise have to hold"
      - "It effectively guarantees that the same class of incident will never recur once the meeting is done"
    answer: 0
    explanation: |
      Blame destroys the information you need: fear of punishment makes people conceal mistakes,
      stop escalating, and write dishonest postmortems. Psychological safety keeps the honest
      signal flowing, which is what actually improves reliability.
    ref: "concepts.md#blameless-postmortem-culture"

  - id: incident-leadership-behavioral-018
    difficulty: intermediate
    tags: [blameless, root-cause, human-error]
    question: |
      In a blameless framing, how should "an engineer pushed a bad config that took down prod"
      be understood?
    options:
      - "As clear proof the engineer needs more training, closer supervision, and a performance review"
      - "As an unavoidable cost of doing business that the team simply has to accept and move past"
      - "As a compelling reason to require explicit managerial sign-off on every single production deploy"
      - "As a symptom of a system with no guardrail — the real defect is that a bad config could reach prod without validation"
    answer: 3
    explanation: |
      Human error is a symptom, not a root cause. If one person's config could take down prod,
      the systemic defect is the absence of a guardrail (validation, canary, review). The
      blameless question is why the system made the mistake easy and its impact severe.
    ref: "concepts.md#blameless-postmortem-culture"

  - id: incident-leadership-behavioral-019
    difficulty: advanced
    tags: [blameless, action-items, anti-pattern]
    question: |
      A candidate's outage story ends: "...and we agreed everyone would be more careful and
      double-check before deploying." Why is this a weak ending?
    options:
      - "It's far too short — a credible postmortem should always be a long, detailed, multi-page document with many carefully written sections and appendices"
      - "'Be more careful' is exhortation, not a control; a strong postmortem produces a systemic guardrail that stops the next person from making the same mistake"
      - "It doesn't clearly assign blame to the specific person whose change triggered the outage in the first place"
      - "It doesn't mention how stressful and difficult the whole incident was for the on-call responders who handled it"
    answer: 1
    explanation: |
      Carefulness is not a control. The blame-and-exhort anti-pattern relies on humans not
      erring. Interviewers want a systemic action item — a canary, an automated check, a
      guardrail — that prevents the whole class of mistake from recurring.
    ref: "concepts.md#blameless-postmortem-culture"

  - id: incident-leadership-behavioral-020
    difficulty: intermediate
    tags: [blameless, framing, phrasing]
    question: |
      Which sentence best demonstrates blameless framing in a postmortem?
    options:
      - "Priya pushed a bad config and single-handedly broke the entire checkout flow for customers."
      - "The on-call engineer wasn't paying close attention to the alerts and missed the early warning signs."
      - "A config change reached prod without validation because the pipeline had no schema check."
      - "We need to start holding people accountable for careless, rushed deploys so this stops happening."
    answer: 2
    explanation: |
      Blameless framing describes the system gap ("no schema check in the pipeline") rather than
      indicting a person. It points at a fixable process, which is both more accurate and more
      actionable than assigning fault.
    ref: "concepts.md#blameless-postmortem-culture"

  - id: incident-leadership-behavioral-021
    difficulty: intermediate
    tags: [own-your-mistake, accountability]
    question: |
      Your story is about a migration YOU shipped that dropped an index and caused the outage.
      How should you take ownership?
    options:
      - "Diffuse it with passive voice: 'mistakes were made and somehow the bad deploy just ended up going out to prod'"
      - "Blame the review process and the approvers who signed off so it doesn't come across as being your personal fault"
      - "Emphasize at length how terrible, guilty, and personally responsible you felt about it for a long while afterward"
      - "First person and specific: 'I shipped the migration that dropped the index' — then pivot to the systemic gap that let it reach prod"
    answer: 3
    explanation: |
      Take clear, specific, first-person ownership, then pivot to the systemic learning (what
      the system was missing that let your mistake reach prod). That pivot turns a personal
      error into an org-level improvement — the strongest accountability signal.
    ref: "concepts.md#owning-your-own-mistake-in-a-postmortem-story"

  - id: incident-leadership-behavioral-022
    difficulty: advanced
    tags: [own-your-mistake, self-flagellation, balance]
    question: |
      Why is excessive self-blame ("I felt awful, couldn't sleep, I'm so sorry, it was all my
      fault") ALSO a weak signal, even though it sounds accountable?
    options:
      - "It centers your feelings over the fix, can read as fragile, and is ironically un-blameless — you're just blaming a person who happens to be you"
      - "It shows far too much confidence and unwarranted self-assurance about your own abilities as an engineer under real production pressure"
      - "Interviewers genuinely don't care about emotions at all and will penalize any mention of feelings in a story"
      - "It simply takes far too long to say out loud within the tight time limits of a fast-paced behavioral interview"
    answer: 0
    explanation: |
      Accountability without self-flagellation is the balance. Groveling centers your feelings
      instead of the systemic fix, reads as fragile, and contradicts the blameless mindset — you
      are blaming a person, who happens to be you, instead of examining the system.
    ref: "concepts.md#owning-your-own-mistake-in-a-postmortem-story"

  - id: incident-leadership-behavioral-023
    difficulty: intermediate
    tags: [own-your-mistake, pivot, systemic]
    question: |
      After owning that you wrote the query that lost its index, what is the "money shot" that
      makes the story land at a senior level?
    options:
      - "Apologizing repeatedly and profusely to the whole team for the trouble you caused them"
      - "Explaining how genuinely rare it is for someone as careful as you to make a mistake like this"
      - "Pivoting to what the system was missing that let your mistake reach prod, then owning and shipping the systemic fix"
      - "Listing out everyone else who reviewed and approved the change before it ever went to prod"
    answer: 2
    explanation: |
      The pivot from "my mistake" to "the system gap my mistake exposed" — plus owning the
      action item and shipping it — converts a personal error into a durable org improvement.
      That is the highest-value part of the story.
    ref: "concepts.md#owning-your-own-mistake-in-a-postmortem-story"

  - id: incident-leadership-behavioral-024
    difficulty: intermediate
    tags: [weak-vs-strong, contrast, mitigate]
    question: |
      Compared to a weak outage answer, what does the strong version add in the MIDDLE (action)
      section?
    options:
      - "More vivid, minute-by-minute detail about how stressful and exhausting the long night of the outage really was for you"
      - "Mitigate-before-diagnose, active stakeholder communication, and the IC role — with root cause coming only after service was stable"
      - "A longer, more thorough list of all the technologies, frameworks, and services that happened to be involved in the outage"
      - "A clear, pointed emphasis on identifying which specific teammate actually wrote the buggy code that ended up failing"
    answer: 1
    explanation: |
      The strong action section restores service first, communicates on a cadence, shows the IC
      role, and only then diagnoses root cause — versus the weak version that debugs first, stays
      silent, and implies blame.
    ref: "concepts.md#weak-vs-strong-a-worked-example"

  - id: incident-leadership-behavioral-025
    difficulty: intermediate
    tags: [weak-vs-strong, results, quantify]
    question: |
      What makes the RESULT section of a strong outage story convincing?
    options:
      - "A heartfelt statement that the whole on-call team felt greatly relieved and grateful once the incident was finally over"
      - "A confident, forward-looking promise that this exact kind of outage will simply never be allowed to happen again, ever"
      - "A satisfied note that both your direct manager and your skip-level manager were genuinely impressed by just how calmly and professionally you handled the whole thing"
      - "Quantified recovery and impact plus prevention that generalizes — e.g., 'recovered in under 15 min; added an automated gate that has caught two regressions since'"
    answer: 3
    explanation: |
      Strong results are quantified (recovery time, impact avoided) and include prevention that
      generalizes beyond the single incident, with evidence the fix works. Vague relief or
      unsupported promises don't demonstrate impact.
    ref: "concepts.md#weak-vs-strong-a-worked-example"

  - id: incident-leadership-behavioral-026
    difficulty: beginner
    tags: [anti-pattern, blame]
    question: |
      Which of these is a clear anti-pattern that turns an outage story into a NEGATIVE signal?
    options:
      - "Saying 'it was the intern's fault' or 'the other team's change is what actually broke it'"
      - "Rolling back the most recent deploy to restore customer service before anything else"
      - "Posting regular status updates to stakeholders roughly every 15 minutes during the incident"
      - "Running a thorough blameless postmortem afterward to find the systemic contributing causes"
    answer: 0
    explanation: |
      Blaming a person or another team — even if factually true — reads as someone who points
      fingers when things go wrong. It's one of the fastest ways to convert an incident story
      into a negative signal.
    ref: "concepts.md#anti-patterns-interviewers-penalize"

  - id: incident-leadership-behavioral-027
    difficulty: intermediate
    tags: [anti-pattern, hiding, ownership]
    question: |
      A candidate says: "I quietly fixed it myself and didn't bother telling anyone — it wasn't
      really a big deal." What's wrong with this?
    options:
      - "Nothing is wrong at all — quietly fixing things on your own is efficient, low-drama, and a mark of a mature engineer"
      - "They should have taken considerably more time and been far more thorough before declaring the issue fully fixed"
      - "Concealing and minimizing an incident is the opposite of ownership and blameless culture; hiding removes the org's chance to learn"
      - "They should have pointed at the monitoring and alerting system for failing to catch and alert on the problem much sooner"
    answer: 2
    explanation: |
      Hiding or minimizing an incident prevents the organization from learning and undermines
      trust. Transparency — surfacing what happened and its impact — is core to ownership and
      blameless culture.
    ref: "concepts.md#anti-patterns-interviewers-penalize"

  - id: incident-leadership-behavioral-028
    difficulty: intermediate
    tags: [anti-pattern, we-vs-i, attribution]
    question: |
      Why is an outage story told entirely in "we" ("we noticed, we rolled back, we fixed it")
      problematic?
    options:
      - "It sounds arrogant and self-important to the interviewer listening to the story"
      - "It strongly implies the responding team was far too large for the incident's scope"
      - "'We' is grammatically incorrect and should never be used when telling interview stories"
      - "The interviewer can't score what YOU personally did or decided if you never say 'I'"
    answer: 3
    explanation: |
      Behavioral scoring attributes actions to the individual. If everything is "we," the
      interviewer literally cannot credit your specific decisions and ownership. Use "I" for
      your actions and "we" for genuine team efforts.
    ref: "concepts.md#anti-patterns-interviewers-penalize"

  - id: incident-leadership-behavioral-029
    difficulty: advanced
    tags: [anti-pattern, over-correction, credibility]
    question: |
      A candidate tells an outage story in which they did everything right, made zero mistakes,
      and everyone else failed. Why might this backfire?
    options:
      - "It proves fairly conclusively that they are simply overqualified and too senior for the particular open role"
      - "It triggers a credibility check — real incidents are messy and involve your own missteps; a zero-self-implication story reads as sanitized or low-ownership"
      - "Interviewers generally much prefer clean, tidy, drama-free stories that involve no interpersonal conflict or disagreement between teammates at all"
      - "It ends up coming across as far too humble and overly self-effacing about their own real contributions to the fix"
    answer: 1
    explanation: |
      A flawless-self, everyone-else-failed story strains credibility because real incidents are
      messy. It also signals low ownership (nothing was yours to own) and can read as sanitized.
      Some honest self-implication makes the story stronger.
    ref: "concepts.md#anti-patterns-interviewers-penalize"

  - id: incident-leadership-behavioral-030
    difficulty: intermediate
    tags: [anti-pattern, symptom-fix, prevention]
    question: |
      "I restarted the box and everything was fine, so we closed it out." Why is this a weak
      resolution?
    options:
      - "It's a symptom fix with no root-cause understanding and no systemic change, so the problem can recur"
      - "Restarting a box is never a valid mitigation technique during a real production incident"
      - "It should have taken considerably longer to properly diagnose and close out the issue"
      - "Boxes and servers should never be restarted in production under any circumstances at all"
    answer: 0
    explanation: |
      Restarting may be a fine mitigation, but stopping there — no root cause, no prevention —
      means the underlying defect remains and will recur. Senior engineers follow through to a
      systemic fix.
    ref: "concepts.md#anti-patterns-interviewers-penalize"

  - id: incident-leadership-behavioral-031
    difficulty: intermediate
    tags: [leadership-principles, ownership, dive-deep]
    question: |
      Which two Amazon Leadership Principles is the "tell me about an outage" question most
      designed to elicit?
    options:
      - "Frugality and Bias for Action"
      - "Think Big and Invent and Simplify"
      - "Hire and Develop the Best and Learn and Be Curious"
      - "Ownership and Dive Deep"
    answer: 3
    explanation: |
      The outage question is built to surface Ownership (stepping toward the problem, owning your
      own mistake, driving prevention) and Dive Deep (going past the symptom to the true root
      cause). A good story contains a beat for each.
    ref: "concepts.md#mapping-incident-stories-to-leadership-principles"

  - id: incident-leadership-behavioral-032
    difficulty: beginner
    tags: [leadership-principles, count, accuracy]
    question: |
      How many Leadership Principles does Amazon currently publish?
    options:
      - "10"
      - "14"
      - "16"
      - "22"
    answer: 2
    explanation: |
      Amazon currently publishes 16 Leadership Principles, after "Strive to be Earth's Best
      Employer" and "Success and Scale Bring Broad Responsibility" were added to the original 14.
    ref: "concepts.md#mapping-incident-stories-to-leadership-principles"

  - id: incident-leadership-behavioral-033
    difficulty: intermediate
    tags: [leadership-principles, customer-obsession, mitigate]
    question: |
      In an outage story, which behavior most directly demonstrates Customer Obsession?
    options:
      - "Spending time carefully understanding the bug's exact mechanism before taking any action at all"
      - "Mitigating to restore customer service first, before satisfying your own need to understand root cause"
      - "Documenting the incident in great detail so the timeline and impact are captured thoroughly"
      - "Assigning the follow-up prevention work fairly and evenly across everyone on the team"
    answer: 1
    explanation: |
      Prioritizing restoring customer service (mitigate first) over your own curiosity is the
      clearest Customer Obsession beat in an incident story. Root-cause understanding is
      important but comes after customers are unblocked.
    ref: "concepts.md#mapping-incident-stories-to-leadership-principles"

  - id: incident-leadership-behavioral-034
    difficulty: advanced
    tags: [leadership-principles, naming, delivery]
    question: |
      At a company that uses named leadership principles, what's the best way to signal them in
      your story?
    options:
      - "Recite the matching label right after each action you describe: 'this part shows Dive Deep, and this next part clearly shows Ownership'"
      - "Deliberately steer away from any behavior that maps to a named principle so that you come across as fully unrehearsed and natural"
      - "Only ever tell carefully chosen incident stories that map neatly and cleanly to exactly one leadership principle at a time"
      - "Describe the behavior concretely and let the interviewer map it to the principle, while ensuring the story actually contains those beats"
    answer: 3
    explanation: |
      Naming the behavior (diving into the slow-query log) and letting the interviewer map it to
      the principle feels authentic; explicitly reciting labels feels rehearsed. But do make sure
      the story genuinely contains the beats the question targets.
    ref: "concepts.md#mapping-incident-stories-to-leadership-principles"

  - id: incident-leadership-behavioral-035
    difficulty: intermediate
    tags: [follow-up, your-role, we-vs-i]
    question: |
      The interviewer probes: "What was YOUR specific role?" What is this follow-up guarding
      against?
    options:
      - "'We' stories where your personal actions and decisions are indistinguishable from the team's"
      - "Whether you genuinely understand the underlying technology stack the service was built on"
      - "Whether the incident was actually severe enough to be worth discussing in an interview"
      - "How long the incident lasted in total from the first page to the final resolution"
    answer: 0
    explanation: |
      This probe exists to break through "we" narration and pin down what you personally did and
      decided. Be ready with concrete first-person actions: the calls you made, what you owned,
      what you communicated.
    ref: "concepts.md#common-follow-up-questions"

  - id: incident-leadership-behavioral-036
    difficulty: intermediate
    tags: [follow-up, done-differently, reflection]
    question: |
      "What would you have done differently?" is best answered with...
    options:
      - "'Nothing at all — honestly the whole response went perfectly from start to finish'"
      - "A pointed list of the teammates who should have done a noticeably better job during it"
      - "A systemic insight (a guardrail or process change you'd add), not 'I'd have been more careful'"
      - "An honest admission that even now you're still not entirely sure what actually went wrong"
    answer: 2
    explanation: |
      This tests reflection and blamelessness. The strong answer names a systemic improvement you
      recognized — not personal exhortation ("more careful") and not blaming others. It shows you
      learn at the level of systems.
    ref: "concepts.md#common-follow-up-questions"

  - id: incident-leadership-behavioral-037
    difficulty: advanced
    tags: [follow-up, rollback-vs-forward, judgment]
    question: |
      "How did you decide to roll back versus fix forward?" is primarily testing...
    options:
      - "Real-time risk judgment under uncertainty — the trade-off you weighed between the two options"
      - "Your working knowledge of git commands and how to revert commits cleanly under pressure"
      - "Whether you happen to prefer one particular deployment tool or platform over another one"
      - "How fast you can physically type commands into a terminal while the incident is unfolding"
    answer: 0
    explanation: |
      This probes decision-making under uncertainty. Explain the risk trade-off: rollback is
      usually the fastest, lowest-risk path to restore service, but a forward-fix may be
      necessary when rollback is unsafe (e.g., mid-migration). Show you weighed it.
    ref: "concepts.md#common-follow-up-questions"

  - id: incident-leadership-behavioral-038
    difficulty: advanced
    tags: [follow-up, prevention, staff-scope]
    question: |
      "How did you prevent this whole CLASS of problem, not just this instance?" is the
      staff-level probe. What does a strong answer show?
    options:
      - "That you patched the exact bug quickly and got the service back to healthy in record time"
      - "That you documented the single incident thoroughly with a complete timeline and impact summary"
      - "That you assigned the follow-up fix to the most junior engineer so they could learn from it"
      - "That you can generalize from one incident to a category of risk and change the system so the category can't recur"
    answer: 3
    explanation: |
      Staff engineers generalize: from one dropped-index incident to "no migration can reach prod
      without a plan-regression check." Preventing the class, not just the instance, is the
      hallmark of staff-scope impact.
    ref: "concepts.md#common-follow-up-questions"

  - id: incident-leadership-behavioral-039
    difficulty: intermediate
    tags: [follow-up, prevention-worked, evidence]
    question: |
      "Did the fix actually prevent recurrence?" is testing follow-through. The best answer
      includes...
    options:
      - "A confident 'yes, definitely — it's completely handled now' with no supporting specifics"
      - "Concrete evidence: it hasn't recurred and the guardrail has caught N similar regressions since"
      - "A note that you moved to a different team shortly after the incident was resolved"
      - "An explanation that truly preventing recurrence is essentially impossible in practice"
    answer: 1
    explanation: |
      Follow-through is proven with evidence: the class hasn't recurred and the guardrail has
      caught later regressions. Vague confidence doesn't demonstrate that the learning was real
      and durable.
    ref: "concepts.md#common-follow-up-questions"

  - id: incident-leadership-behavioral-040
    difficulty: advanced
    tags: [scenario, judgment, mitigate, communication]
    question: |
      You're paged: a new deploy 15 minutes ago correlates with a spike in 500s on the login
      service, ~10% of logins failing. What is the strongest first sequence of actions?
    options:
      - "Open the code, hunt down the exact bug in the new deploy, patch it, and ship the patch forward"
      - "Ask in a channel who wrote the deploy so that person can jump in and fix their own bug"
      - "Roll back the deploy to restore service, start a status thread with a 15-min update cadence, then diagnose root cause"
      - "Wait a full 30 minutes to see whether the elevated error rate happens to recover on its own"
    answer: 2
    explanation: |
      The deploy is the highest-probability cause and rollback is a safe, fast mitigation.
      Restore service first, communicate on a cadence, then diagnose. Debugging first, blaming,
      or waiting all leave customers impacted.
    ref: "concepts.md#the-incident-story-arc-the-beats-that-score"

  - id: incident-leadership-behavioral-041
    difficulty: advanced
    tags: [scenario, blameless, postmortem, leadership]
    question: |
      In the postmortem, a teammate starts pressing the engineer whose change triggered the
      outage. As the senior person in the room, what's the best intervention?
    options:
      - "Let the pressuring continue unchecked — real accountability requires everyone in the room knowing exactly who to blame for it"
      - "Defend the engineer by openly downplaying the whole thing and insisting the outage really wasn't that bad in the end anyway"
      - "End the postmortem early and quietly reschedule it for another day to avoid the growing conflict in the room right now"
      - "Redirect to systems: 'The question isn't who typed it, it's why our pipeline let an unvalidated change reach prod' and steer toward a guardrail"
    answer: 3
    explanation: |
      Modeling blamelessness — redirecting from "who" to "why did the system allow it" and toward
      a concrete guardrail — protects psychological safety and produces a durable fix. That
      intervention is itself a strong leadership signal.
    ref: "concepts.md#blameless-postmortem-culture"

  - id: incident-leadership-behavioral-042
    difficulty: intermediate
    tags: [scenario, communication, silence]
    question: |
      Two hours into a major incident you still don't have root cause, but service is stable via
      a rollback. Stakeholders have gone quiet. What should you do?
    options:
      - "Say nothing at all until you finally have the confirmed root cause, so you avoid adding noise"
      - "Post an update anyway: service stable via rollback, still investigating root cause, next update in 30 min"
      - "Go ahead and close out the incident now, since customer-facing service has already been restored"
      - "Ask the watching stakeholders to stop monitoring the channel so you can work without distraction"
    answer: 1
    explanation: |
      Even with service stable and no root cause yet, a status update maintains trust and signals
      the situation is under control. Silence — or prematurely closing before root cause and
      prevention — undercuts the ownership signal.
    ref: "concepts.md#communicating-during-an-incident"

  - id: incident-leadership-behavioral-043
    difficulty: intermediate
    tags: [scenario, own-your-mistake, phrasing]
    question: |
      Which closing line best demonstrates accountability without self-flagellation for an
      outage you caused?
    options:
      - "'I own that I wrote the query that lost its index; the real gap was no plan-regression check in the migration gate, so I added one — it's caught two regressions since'"
      - "'It was honestly a broad team failure — plenty of people missed it at various points along the way, so it really wasn't just me'"
      - "'I felt genuinely terrible and guilty about it for many weeks afterward, and to be completely honest I still find myself replaying it and thinking about it a lot even now'"
      - "'The reviewers looked closely at the change and approved it too, so realistically it wasn't really on me alone at the end of the day'"
    answer: 0
    explanation: |
      This line takes specific first-person ownership, pivots to the systemic gap, describes the
      fix you shipped, and provides evidence it works — accountability plus systemic prevention,
      with no groveling and no blame-shifting.
    ref: "concepts.md#owning-your-own-mistake-in-a-postmortem-story"

  - id: incident-leadership-behavioral-044
    difficulty: beginner
    tags: [scenario, incident-commander, structure]
    question: |
      You get paged for a SEV2 and several engineers are already jumping in with different
      theories and stepping on each other. As IC, what's your first move?
    options:
      - "Pick whichever theory is being argued the loudest in the channel and have the whole group immediately chase that one down"
      - "Tell everyone to just keep working independently on whatever fix each of them personally thinks is best in the moment"
      - "Hold back and simply wait to see whose competing theory ends up turning out to be the correct one before acting"
      - "Impose structure: declare the severity and current plan, assign an ops lead, a comms lead, and a scribe so everyone rows in one direction"
    answer: 3
    explanation: |
      The IC's job is coordination. Declaring severity, making the current plan explicit, and
      assigning roles prevents duplicated work and chaos, so the response is organized rather
      than a scramble.
    ref: "concepts.md#being-the-incident-commander-ic"

  - id: incident-leadership-behavioral-045
    difficulty: advanced
    tags: [scenario, prevention, staff-scope, judgment]
    question: |
      After resolving an outage caused by a missing index, which follow-through best signals
      staff-level scope?
    options:
      - "Re-add the one specific missing index that regressed, verify the hot query is fast again, and then close out the incident ticket"
      - "Add an automated plan-regression / slow-query check to the migration pipeline so no future migration can silently degrade a hot query"
      - "Email the whole engineering team a standing reminder to always carefully double-check their indexes whenever writing new migrations"
      - "Add a mandatory manual step where a designated senior engineer personally reviews every single migration line by line before it ships"
    answer: 1
    explanation: |
      Re-adding the one index fixes the instance; a reminder is exhortation; a manual gate
      doesn't scale. An automated pipeline check prevents the whole class of problem — the
      generalizing, systemic fix that signals staff scope.
    ref: "concepts.md#common-follow-up-questions"

  - id: incident-leadership-behavioral-046
    difficulty: intermediate
    tags: [scenario, boundary, cross-reference]
    question: |
      An interviewer asks about the SLO/alerting configuration and error-budget policy that
      governs your on-call. Where does that PROCESS-mechanics content properly live, versus the
      behavioral story angle taught here?
    options:
      - "It's identical to the behavioral story angle; there's really no meaningful distinction between them"
      - "It belongs squarely to the system-design whiteboard method and how you diagram service architectures"
      - "The SLO/alerting/error-budget mechanics live in devops-cicd/observability; this topic owns the leadership/story angle on incidents"
      - "It belongs to the salary-negotiation topic, since on-call compensation is negotiated as part of an offer"
    answer: 2
    explanation: |
      This topic is the behavioral/storytelling angle (how to tell an incident story that shows
      leadership). The reliability process mechanics — SLOs, alerting, error budgets, runbooks —
      live in devops-cicd/observability.
    ref: "concepts.md#why-the-outage-question-is-high-signal"

  - id: incident-leadership-behavioral-047
    difficulty: intermediate
    tags: [scenario, communication, message-ownership]
    question: |
      Your outage was clearly caused by your team's change and support is asking what to tell
      customers. What's the strongest communication approach?
    options:
      - "Downplay it: tell support it was really just a minor, short-lived glitch that has already been quietly fixed on our end"
      - "Say nothing at all to support until the full written postmortem is completely finalized and formally signed off on first"
      - "Redirect support to file a formal ticket through the normal channel and then wait for it to be triaged through the queue"
      - "Own the message: 'We caused this, here's the impact and who's affected, here's our plan and ETA' at the right altitude for support"
    answer: 3
    explanation: |
      Owning the message — clear impact, scope, and plan — beats vague reassurance and builds
      trust. Sandbagging or going silent when you know the cause erodes credibility with
      stakeholders and customers.
    ref: "concepts.md#communicating-during-an-incident"

  - id: incident-leadership-behavioral-048
    difficulty: advanced
    tags: [scenario, story-selection, seniority]
    question: |
      You're a staff candidate choosing an incident story. Which best showcases staff-level
      impact?
    options:
      - "A time you coordinated a cross-team incident response, then drove org-level follow-through that hardened a shared system against a whole class of failures"
      - "A time you personally fixed a genuinely tricky, deeply buried bug during a chaotic outage far faster than anyone else on the team could"
      - "A time you stayed up all night entirely alone resolving a difficult, sprawling outage without ever pulling in any help from anyone"
      - "A time you personally found the true root cause of a nasty incident but then someone else on the team actually implemented the fix"
    answer: 0
    explanation: |
      Staff scope is about coordination across teams and org-level, generalizing follow-through
      that changes systems for many teams — not individual heroics or a single clever fix. The
      cross-team, class-of-failure story best demonstrates staff impact.
    ref: "concepts.md#being-the-incident-commander-ic"
