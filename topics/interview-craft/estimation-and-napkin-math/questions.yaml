topic: "Estimation & Napkin Math (Numbers to Know)"
domain: interview-craft
topic_slug: estimation-and-napkin-math
version: 1

questions:
  - id: estimation-and-napkin-math-001
    difficulty: beginner
    tags: [method, signals, judgment]
    question: |
      In a system-design interview you're asked to estimate storage for a photo app.
      What are interviewers primarily scoring with this question?
    options:
      - "Whether you can produce an exact, precise byte figure down to the last megabyte without stating any assumptions"
      - "Whether you have memorized the exact on-disk size of a standard JPEG at a fixed resolution and quality setting"
      - "Whether you can reason under uncertainty: state assumptions, round, and sanity-check the order of magnitude"
      - "Whether you can do long division and multi-digit multiplication quickly in your head under time pressure"
    answer: 2
    explanation: |
      Estimation questions are a judgment probe disguised as arithmetic. Real systems get
      sized by load tests, not napkin math. The signal is decomposition, explicit
      assumptions, aggressive rounding, and an order-of-magnitude sanity check — not a
      precise number.
    ref: "concepts.md#why-interviewers-want-the-method-not-the-number"

  - id: estimation-and-napkin-math-002
    difficulty: beginner
    tags: [method, order-of-magnitude]
    question: |
      Your estimate lands about 3x off the "textbook" number but you narrated every
      assumption clearly. How is this typically judged?
    options:
      - "A pass — being within one order of magnitude with visible reasoning is the bar"
      - "A fail — any deviation from the textbook number disqualifies the whole answer"
      - "Irrelevant — interviewers only grade the final number, not how you got there"
      - "A fail unless you apologize for the 3x gap and redo the arithmetic from scratch"
    answer: 0
    explanation: |
      Landing within roughly one order of magnitude with well-narrated reasoning is a pass.
      The number is the artifact; the reasoning is the signal. A confident precise-looking
      number with hidden assumptions is actually worse.
    ref: "concepts.md#why-interviewers-want-the-method-not-the-number"

  - id: estimation-and-napkin-math-003
    difficulty: intermediate
    tags: [weak-vs-strong, phrasing]
    question: |
      Which response to "roughly how much storage does this photo service need?" best
      demonstrates senior estimation craft?
    options:
      - "It'll need a big database, probably a few servers, and some cloud storage — we can work out the exact sizes later once it's built."
      - "Impossible to say anything useful without real production metrics and load tests, so I'd rather not put a number on it yet."
      - "Let me quietly compute the exact figure to the nearest gigabyte first, and I'll give you one precise number before we discuss design."
      - "Assume 100M DAU, 2 photos/day, ~1.5 MB each → ~300 TB/day, order of 100 PB/year before dedup — so object storage plus CDN, and retention will dominate cost; how long do we keep originals?"
    answer: 3
    explanation: |
      The strong answer shows variables, rounding, an order-of-magnitude result, and — the
      senior move — translates the number into a decision (object storage + CDN) and
      surfaces the dominant cost driver (retention) as a clarifying question.
    ref: "concepts.md#why-interviewers-want-the-method-not-the-number"

  - id: estimation-and-napkin-math-004
    difficulty: beginner
    tags: [method, steps]
    question: |
      What is the correct first step of the estimation method before doing any arithmetic?
    options:
      - "Pick the biggest plausible number first so your estimate is never accused of being too low"
      - "Clarify the metric and scope — peak vs average, and over what time window"
      - "Start multiplying rough assumptions together immediately to save time on the clock"
      - "State the final answer first, then work backward to invent supporting assumptions"
    answer: 1
    explanation: |
      Step one is clarifying exactly what you're sizing (peak QPS? bytes/day?) and the time
      window. Asking "average or peak?" up front prevents an answer that's off by the peak
      factor.
    ref: "concepts.md#the-estimation-method-assume-round-sanity-check-show-the-work"

  - id: estimation-and-napkin-math-005
    difficulty: intermediate
    tags: [method, narration]
    question: |
      You do the entire QPS calculation silently in your head and announce only "about 40,000
      QPS." The number is correct. Why might this still score poorly?
    options:
      - "Silent arithmetic earns no signal — interviewers score the visible reasoning, not just the result"
      - "40,000 is far too round a figure to be believable as a real system's measured throughput"
      - "You should have divided by exactly 86,400 seconds per day instead of rounding to 100,000"
      - "You need to carry at least three significant decimal places for the QPS figure to count"
    answer: 0
    explanation: |
      Even a correct result from silent math earns little credit. The interviewer is scoring
      how you decompose, assume, and sanity-check. Narrating each step is the whole point.
    ref: "concepts.md#the-estimation-method-assume-round-sanity-check-show-the-work"

  - id: estimation-and-napkin-math-006
    difficulty: intermediate
    tags: [method, assumptions]
    question: |
      Which phrasing best signals that you understand napkin math is a starting point, not a
      substitute for measurement?
    options:
      - "This is exactly how much traffic the system will get in production once it launches."
      - "The number is really whatever the interviewer wants it to be, so I'll just match their expectation."
      - "We won't truly know until we ship and measure, so estimating anything up front is basically pointless."
      - "I'm assuming a 4x peak factor; in a real system I'd confirm that against traffic dashboards."
    answer: 3
    explanation: |
      Framing assumptions as things you'd normally validate with load tests/dashboards shows
      mature judgment: you can reason now, and you know where the real numbers come from.
    ref: "concepts.md#the-estimation-method-assume-round-sanity-check-show-the-work"

  - id: estimation-and-napkin-math-007
    difficulty: beginner
    tags: [latency, ram, network]
    question: |
      Roughly how does a main-memory (RAM) reference compare to a round trip within the same
      datacenter?
    options:
      - "RAM is about the same speed as an in-datacenter round trip (~0.5 ms each)"
      - "RAM is roughly 100x slower than a same-datacenter network round trip"
      - "RAM is on the order of thousands of times faster (~100 ns vs ~0.5 ms)"
      - "A same-datacenter network round trip is actually faster than a RAM reference"
    answer: 2
    explanation: |
      RAM reference is ~100 ns; an in-DC round trip is ~500,000 ns (0.5 ms) — RAM is roughly
      5,000x faster. This ratio is why we cache in memory and avoid unnecessary network hops.
    ref: "concepts.md#latency-numbers-every-engineer-should-know"

  - id: estimation-and-napkin-math-008
    difficulty: intermediate
    tags: [latency, geography, physics]
    question: |
      A user in London hits your US-East API and it feels slow. What number should anchor your
      first-cut explanation?
    options:
      - "L1 cache latency of ~0.5 ns — the per-request CPU work is what dominates the delay"
      - "The ~150 ms transatlantic round-trip time — a speed-of-light bound, before any server work"
      - "Disk seek time of ~10 ms — the database's spinning-disk reads are the real bottleneck here"
      - "Mutex lock/unlock at ~25 ns — lock contention on the server is what dominates the slowdown"
    answer: 1
    explanation: |
      Cross-continent latency (~150 ms RTT) is physics — unavoidable — and it dominates
      before any handler runs, especially if the design makes multiple chatty round trips.
      That reframes the fix toward edge/CDN and regional presence.
    ref: "concepts.md#latency-numbers-every-engineer-should-know"

  - id: estimation-and-napkin-math-009
    difficulty: beginner
    tags: [latency, ordering]
    question: |
      Order these from fastest to slowest: SSD random read, L1 cache reference, disk seek,
      main-memory reference.
    options:
      - "L1 cache → main memory → SSD random read → disk seek"
      - "Main memory → L1 cache → disk seek → SSD random read"
      - "SSD random read → L1 cache → main memory → disk seek"
      - "Disk seek → SSD random read → main memory → L1 cache"
    answer: 0
    explanation: |
      L1 (~0.5 ns) < main memory (~100 ns) < SSD random read (~16–150 µs) < disk seek
      (~10 ms). The point is knowing the relative orders of magnitude, not exact figures.
    ref: "concepts.md#latency-numbers-every-engineer-should-know"

  - id: estimation-and-napkin-math-010
    difficulty: advanced
    tags: [latency, design-decision]
    question: |
      Which design conclusion follows most directly from the latency numbers (RAM ~100 ns,
      disk seek ~10 ms, in-DC round trip ~0.5 ms)?
    options:
      - "Random disk I/O and chatty cross-service calls are effectively free and can be ignored when sizing latency"
      - "Always prefer reading from disk over RAM to save on expensive memory hardware costs"
      - "Network latency never matters inside a datacenter, so any number of internal round trips is fine"
      - "Cache hot data in memory, avoid random disk I/O, and minimize chatty cross-service round trips"
    answer: 3
    explanation: |
      Because RAM (~100 ns) is ~5,000x faster than an in-DC round trip (~0.5 ms) and
      ~100,000x faster than a disk seek (~10 ms), the natural conclusions are: cache in
      memory, avoid random disk I/O, and reduce chatty inter-service calls.
    ref: "concepts.md#latency-numbers-every-engineer-should-know"

  - id: estimation-and-napkin-math-011
    difficulty: beginner
    tags: [powers-of-two, data-sizes]
    question: |
      For napkin math, 2^10 (1,024) is most usefully approximated as:
    options:
      - "10^2"
      - "10^3 (~1 thousand)"
      - "10^6"
      - "exactly 1,000 with no error"
    answer: 1
    explanation: |
      2^10 = 1,024 ≈ 10^3. Likewise 2^20 ≈ 10^6 and 2^30 ≈ 10^9. The ~2.4% error per 2^10
      almost never matters at estimation precision and makes byte math trivial.
    ref: "concepts.md#powers-of-two-and-data-sizes"

  - id: estimation-and-napkin-math-012
    difficulty: intermediate
    tags: [powers-of-two, keys, ids]
    question: |
      Your ID space must hold more than ~4.3 billion distinct values. What does that number
      correspond to, and what's the implication?
    options:
      - "It's 2^16 (~65 thousand); a 2-byte short integer key is plenty for this range"
      - "It's 2^64 (~1.8 × 10^19); you're already at the ceiling and set forever, no wider key needed"
      - "It's 2^32 (the IPv4 / 32-bit unsigned int range); you've outgrown a 32-bit key, use 64-bit"
      - "It's 10^9 (one billion); store it as a 4-byte float since that comfortably covers a billion"
    answer: 2
    explanation: |
      2^32 ≈ 4.3 billion — the IPv4 address count and the unsigned 32-bit int range. Needing
      more values means moving to a 64-bit key (2^63 ≈ 9.2 × 10^18). Recognizing this instantly
      is a classic napkin-math skill.
    ref: "concepts.md#powers-of-two-and-data-sizes"

  - id: estimation-and-napkin-math-013
    difficulty: intermediate
    tags: [powers-of-two, row-sizing]
    question: |
      You size a table row: a 16-byte UUID, an 8-byte timestamp, a 4-byte int counter, and
      ~72 bytes of text. About how big is one row for estimation?
    options:
      - "~100 bytes"
      - "~28 bytes"
      - "~1 KB"
      - "~16 bytes"
    answer: 0
    explanation: |
      16 + 8 + 4 + 72 = 100 bytes. Memorizing common field sizes (UUID 16 B, long/timestamp
      8 B, int 4 B, ASCII char 1 B) lets you sum a row quickly for storage math.
    ref: "concepts.md#powers-of-two-and-data-sizes"

  - id: estimation-and-napkin-math-014
    difficulty: beginner
    tags: [qps, seconds-per-day]
    question: |
      What rounded value for "seconds per day" makes QPS-from-DAU math easy to do out loud?
    options:
      - "~1,000 (10^3), since a day is roughly a thousand seconds"
      - "~10,000 (10^4), which is close enough to 86,400 for mental math"
      - "~1,000,000 (10^6), rounding a day up to a million seconds"
      - "~100,000 (10^5), since 86,400 rounds up"
    answer: 3
    explanation: |
      86,400 seconds/day rounds to ~100,000 (10^5). Memorizing this turns most QPS
      calculations into shifting the decimal, keeping the mental math reliable.
    ref: "concepts.md#qps-from-dau"

  - id: estimation-and-napkin-math-015
    difficulty: intermediate
    tags: [qps, worked-example]
    question: |
      100M DAU, each doing 20 actions/day. What's the approximate average QPS?
    options:
      - "~2,000 QPS"
      - "~200,000 QPS"
      - "~20,000 QPS"
      - "~2,000,000 QPS"
    answer: 2
    explanation: |
      Actions/day = 100M × 20 = 2 × 10^9. Divide by ~10^5 s/day → ~20,000 average QPS. A peak
      factor (say ×5) would push peak toward ~100K QPS, implying a fleet plus caching.
    ref: "concepts.md#qps-from-dau"

  - id: estimation-and-napkin-math-016
    difficulty: intermediate
    tags: [qps, peak-factor]
    question: |
      Why should you multiply average QPS by a peak factor (often 2x–10x) when sizing a fleet?
    options:
      - "To make the final number look bigger and more impressive to the interviewer"
      - "Because provisioning for average traffic means falling over during daily/launch spikes; you size for peak"
      - "Because average QPS is always computed incorrectly and needs a correction multiplier"
      - "Because the peak factor conveniently cancels out the seconds-per-day term in the formula"
    answer: 1
    explanation: |
      Traffic is bursty (evening surges, launches, Black Friday). Sizing for average means
      you get paged at the spike. State a peak factor assumption (2x smooth, up to 10x spiky)
      and size for peak.
    ref: "concepts.md#qps-from-dau"

  - id: estimation-and-napkin-math-017
    difficulty: advanced
    tags: [qps, sanity-check]
    question: |
      Your math yields "1M DAU → 5M average QPS." What's the right reaction?
    options:
      - "Accept it and move on to the design — the arithmetic is finished so the number stands"
      - "Increase the peak factor further until the fleet size justifies the 5M QPS figure"
      - "Assume every user really does make 5 requests every second continuously all day long"
      - "Recognize it's implausible: 1M DAU can't produce 5M sustained QPS, so an actions-per-user or seconds term is off by orders of magnitude"
    answer: 3
    explanation: |
      A gut anchor (1M DAU ≈ tens of QPS avg for typical usage) flags this as absurd. 5M QPS
      from 1M DAU implies each user hammers the system continuously — a sign the
      actions/user or the seconds-per-day division went wrong.
    ref: "concepts.md#qps-from-dau"

  - id: estimation-and-napkin-math-018
    difficulty: intermediate
    tags: [storage, formula]
    question: |
      Which formula best captures storage sizing over time?
    options:
      - "items per day × bytes per item × retention period × replication factor"
      - "requests per second × bytes per response, summed over the retention window"
      - "arrival rate × average latency, scaled by the replication factor"
      - "daily active users × peak factor × average session length"
    answer: 0
    explanation: |
      Storage is a volume-over-time calculation: items/day × bytes/item × retention ×
      replication (plus index/metadata overhead). Retention and object size usually dominate.
    ref: "concepts.md#storage-sizing"

  - id: estimation-and-napkin-math-019
    difficulty: advanced
    tags: [storage, dominant-factor]
    question: |
      In most storage estimates, which factors tend to dominate the total — and what's the key
      clarifying question?
    options:
      - "Request rate dominates the storage total; the key clarifying question is peak QPS"
      - "Replication factor is negligible for storage totals, so you can safely ignore it"
      - "Object size and retention dominate; ask how long we keep data and whether we store originals plus thumbnails plus backups"
      - "CPU speed dominates the storage total; the key clarifying question is which processor generation"
    answer: 2
    explanation: |
      Object size and retention usually dominate storage, not request rate. Media is ~1000x+
      text records. So ask about retention policy and what variants/backups you keep — that
      question moves the estimate the most.
    ref: "concepts.md#storage-sizing"

  - id: estimation-and-napkin-math-020
    difficulty: intermediate
    tags: [storage, worked-example]
    question: |
      500M text writes/day, each ~300 bytes. Roughly how much raw storage per day (before
      replication)?
    options:
      - "~1.5 GB/day"
      - "~15 GB/day"
      - "~1.5 TB/day"
      - "~150 GB/day"
    answer: 3
    explanation: |
      500M × 300 B = 1.5 × 10^11 B ≈ 150 GB/day. Over a year that's ~55 TB raw, ~165 TB at
      3x replication — tractable on a sharded cluster; media would dwarf it.
    ref: "concepts.md#storage-sizing"

  - id: estimation-and-napkin-math-021
    difficulty: intermediate
    tags: [bandwidth, formula]
    question: |
      How do you estimate egress bandwidth for a read-heavy service?
    options:
      - "bytes per item × retention period, converted to bytes per second"
      - "requests per second × bytes per response"
      - "daily active users × actions per user, divided by seconds per day"
      - "average concurrency × average request latency, in bytes"
    answer: 1
    explanation: |
      Bandwidth is throughput in bytes/s: requests/s × bytes/response. Read-heavy media
      systems are usually bandwidth-bound; write-heavy logging systems are storage-bound.
    ref: "concepts.md#bandwidth-estimation"

  - id: estimation-and-napkin-math-022
    difficulty: advanced
    tags: [bandwidth, worked-example, cdn]
    question: |
      20,000 image reads/s at ~200 KB each. Roughly what egress, and what does it imply?
    options:
      - "~4 GB/s (~32 Gbps); it far exceeds one NIC, so a CDN offload is mandatory"
      - "~40 MB/s (~0.3 Gbps); a single commodity server handles it easily with room to spare"
      - "~400 KB/s (~3 Mbps); bandwidth is a complete non-issue and needs no special handling"
      - "~4 TB/s (~32 Tbps); the public internet physically cannot carry a stream this large"
    answer: 0
    explanation: |
      20,000 × 200 KB = 4 × 10^9 B/s = ~4 GB/s ≈ 32 Gbps. A 10 Gbps NIC does ~1.25 GB/s, so
      this needs CDN offload — the estimate directly drives the architecture decision.
    ref: "concepts.md#bandwidth-estimation"

  - id: estimation-and-napkin-math-023
    difficulty: intermediate
    tags: [bandwidth, bits-bytes]
    question: |
      A "1 Gbps" network link and a "GB" of storage — what's the trap in bandwidth math?
    options:
      - "They're effectively the same unit at this scale, so no conversion is needed"
      - "You must multiply the storage figure by 8 to convert bytes into bits per second"
      - "Bits and bytes only differ for text payloads, not for media or binary blobs"
      - "Links are quoted in bits/s and storage in bytes; divide link speed by 8 to get bytes/s, or you'll be off by ~8x"
    answer: 3
    explanation: |
      Network speeds are in bits per second (Gbps); storage is in bytes. Divide by 8 to
      convert. Mixing bits and bytes is an instant ~8x (order-of-magnitude-ish) error that
      interviewers catch.
    ref: "concepts.md#bandwidth-estimation"

  - id: estimation-and-napkin-math-024
    difficulty: intermediate
    tags: [littles-law, formula]
    question: |
      Little's Law states L = λW. What do the terms mean for capacity planning?
    options:
      - "L = latency in ms, λ = offered load in QPS, W = width of the connection pool"
      - "L = number of links, λ = per-hop latency, W = number of worker threads available"
      - "L = average concurrent requests in the system, λ = arrival rate (req/s), W = average time in system (s)"
      - "L = load factor, λ = count of lambda functions, W = wait-queue depth in requests"
    answer: 2
    explanation: |
      Little's Law: the average number of in-flight requests L equals arrival rate λ times
      average time-in-system W. It bridges throughput to the concurrency (threads/connections/
      servers) you need.
    ref: "concepts.md#littles-law-for-capacity"

  - id: estimation-and-napkin-math-025
    difficulty: advanced
    tags: [littles-law, worked-example]
    question: |
      10,000 req/s, each holding a thread for 50 ms. About how many concurrent in-flight
      requests must the system support?
    options:
      - "~500"
      - "~50, dividing the rate by the per-request time"
      - "~5,000, multiplying the rate by 0.5 seconds"
      - "~50,000, since every request needs its own thread"
    answer: 0
    explanation: |
      L = λW = 10,000 × 0.05 s = 500 concurrent in-flight requests. At ~200 threads/box that's
      ~3 boxes plus headroom. Naming and applying Little's Law is a strong senior signal.
    ref: "concepts.md#littles-law-for-capacity"

  - id: estimation-and-napkin-math-026
    difficulty: advanced
    tags: [littles-law, throughput]
    question: |
      A DB connection pool has 200 connections and each query averages 20 ms. What's the
      approximate max throughput before requests queue?
    options:
      - "~1,000 queries/s, dividing the pool size by the query time in seconds incorrectly"
      - "~4,000 queries/s, using a 50 ms average query time instead of 20 ms"
      - "~40,000 queries/s, multiplying the pool size by 200 rather than dividing by 0.02 s"
      - "~10,000 queries/s"
    answer: 3
    explanation: |
      Rearranging Little's Law, λ = L / W = 200 / 0.02 s = 10,000 queries/s max. Beyond that,
      requests queue and latency spikes — the pool becomes the bottleneck.
    ref: "concepts.md#littles-law-for-capacity"

  - id: estimation-and-napkin-math-027
    difficulty: advanced
    tags: [littles-law, signal]
    question: |
      An interviewer asks "how many application servers do you need?" Which response best
      signals senior capacity reasoning?
    options:
      - "As many as we can afford — more servers is always the safer engineering choice here."
      - "Use Little's Law: concurrency = throughput × latency; at 10K req/s and 50 ms that's 500 in-flight, ~200 threads/box → ~3 boxes plus headroom and redundancy."
      - "One sufficiently large, vertically scaled server should be able to handle almost anything."
      - "It really depends on too many unknowns, so I can't responsibly commit to any number."
    answer: 1
    explanation: |
      Applying Little's Law (capacity = throughput × latency) and translating to a box count
      with headroom/redundancy demonstrates you understand the two levers — reduce W or raise
      L — rather than guessing.
    ref: "concepts.md#littles-law-for-capacity"

  - id: estimation-and-napkin-math-028
    difficulty: intermediate
    tags: [read-write-ratio, architecture]
    question: |
      A social feed is ~1000:1 read-heavy. Which architectural direction does that ratio push
      you toward?
    options:
      - "Append-only LSM-tree stores, write batching, and sharding on the write key"
      - "Synchronous strong consistency and a quorum read on every single request"
      - "Caching, read replicas, denormalization, and fan-out-on-write"
      - "A single large unindexed table scanned in full on each read request"
    answer: 2
    explanation: |
      Read-heavy systems justify aggressive caching, read replicas, denormalization, and
      fan-out-on-write. Establishing the read:write ratio early is the single assumption that
      most changes the design.
    ref: "concepts.md#reads-vs-writes-ratio-and-common-ratios"

  - id: estimation-and-napkin-math-029
    difficulty: intermediate
    tags: [read-write-ratio, write-heavy]
    question: |
      An IoT telemetry ingest pipeline is write-heavy (writes ≈ or > reads). What fits best?
    options:
      - "Append-only / LSM-tree stores, batching, and sharding by write key"
      - "Fan-out-on-write to precomputed read caches"
      - "A read-replica farm with a 95% cache hit rate"
      - "Strong-consistency two-phase commits on every event"
    answer: 0
    explanation: |
      Write-heavy workloads (logging, metrics, IoT, event streams) push toward append-only
      stores, LSM-tree DBs, batching, and sharding on the write key — the opposite of the
      read-optimized playbook.
    ref: "concepts.md#reads-vs-writes-ratio-and-common-ratios"

  - id: estimation-and-napkin-math-030
    difficulty: advanced
    tags: [cache-hit-rate, ratios]
    question: |
      50,000 read QPS hit a cache with a 90% hit rate. If you improve the hit rate to 95%, how
      does DB-facing load change?
    options:
      - "From 5,000 QPS to 4,500 QPS — a negligible 10% reduction in DB load"
      - "From 45,000 QPS to 40,000 QPS — most reads still fall through to the database"
      - "It doesn't change at all; the cache hit rate only affects read latency, not DB load"
      - "From 5,000 QPS to 2,500 QPS — it halves"
    answer: 3
    explanation: |
      At 90% hit rate, 10% (5,000 QPS) reaches the DB. At 95%, only 5% (2,500 QPS) does —
      halved. That's why the last few points of hit rate are so valuable and why you should
      state the assumed hit rate.
    ref: "concepts.md#reads-vs-writes-ratio-and-common-ratios"

  - id: estimation-and-napkin-math-031
    difficulty: intermediate
    tags: [ratios, dau-mau]
    question: |
      You're given MAU but need DAU for QPS math. Which ratio helps, and roughly what range?
    options:
      - "Read:write ratio, ~100:1 — multiply MAU by that to recover the daily figure"
      - "DAU:MAU stickiness ratio, ~0.1–0.5 for a sticky product"
      - "Peak:average traffic ratio, ~10x — apply it to MAU to get daily actives"
      - "Compression ratio, ~2–10x — divide MAU by it to estimate DAU for the math"
    answer: 1
    explanation: |
      DAU:MAU (stickiness) is typically ~0.1–0.5 for a sticky product. State it as an
      assumption to derive DAU from MAU, then feed it into the QPS formula.
    ref: "concepts.md#reads-vs-writes-ratio-and-common-ratios"

  - id: estimation-and-napkin-math-032
    difficulty: intermediate
    tags: [throughput-anchors, sanity]
    question: |
      Your napkin math implies a single relational DB instance serving 500K simple QPS with no
      sharding or cache. What do the throughput anchors tell you?
    options:
      - "That's a normal, sustainable load for a single well-tuned Postgres box on modern hardware"
      - "Databases have no meaningful throughput ceiling, so one instance can serve any QPS"
      - "That's ~50–500x a single-instance ballpark (~1K–10K QPS); add sharding/caching/replicas or recheck the numbers"
      - "You should switch the instance to a spinning-disk HDD to raise its query throughput"
    answer: 2
    explanation: |
      A single relational instance handles ~1K–10K simple queries/s before sharding/
      replication. 500K on one box is off by orders of magnitude — the anchor tells you to add
      caching/sharding/replicas or recheck your inputs.
    ref: "concepts.md#throughput-ballparks-and-sanity-anchors"

  - id: estimation-and-napkin-math-033
    difficulty: intermediate
    tags: [throughput-anchors, cache]
    question: |
      Which of these is a reasonable order-of-magnitude anchor to carry into an interview?
    options:
      - "An in-memory cache node handles ~100K+ ops/s, far more than a relational instance"
      - "An in-memory cache node (Redis/Memcached) handles only ~100 ops/s, less than a relational DB"
      - "A 10 Gbps NIC moves ~10 GB/s of application traffic in each direction"
      - "A single spinning-disk HDD sustains ~1 million random IOPS under normal load"
    answer: 0
    explanation: |
      An in-memory cache node does ~100K+ ops/s — much higher than a relational DB's ~1K–10K
      QPS. (A 10 Gbps NIC is ~1.25 GB/s; an HDD is ~100 random IOPS.) These anchors are the
      "does my answer smell right?" filter.
    ref: "concepts.md#throughput-ballparks-and-sanity-anchors"

  - id: estimation-and-napkin-math-034
    difficulty: advanced
    tags: [throughput-anchors, phrasing]
    question: |
      How should you frame throughput anchors when you cite them in an interview?
    options:
      - "As exact, guaranteed hard limits that hold across all hardware and every workload"
      - "As fixed numbers you memorized and don't need to justify or contextualize further"
      - "As essentially irrelevant, since hardware varies too much for any anchor to help"
      - "As 'on the order of' starting hypotheses you'd validate with a load test"
    answer: 3
    explanation: |
      Hardware and workloads vary hugely. Say "on the order of" and frame anchors as starting
      hypotheses to validate with a load test. Quoting a single precise throughput as fact
      reads as junior overconfidence.
    ref: "concepts.md#throughput-ballparks-and-sanity-anchors"

  - id: estimation-and-napkin-math-035
    difficulty: advanced
    tags: [worked-estimate, closing-the-loop]
    question: |
      After estimating a URL shortener at ~300K peak read QPS, ~270 TB over 5 years, 100:1
      read-heavy, which closing statement best earns staff-level marks?
    options:
      - "So it clearly needs some kind of database behind it. What's the next question?"
      - "So the numbers say this is a read-optimized cache-and-shard problem with modest storage; the interesting risk is the 300K peak read QPS and hot-key distribution, which I'd validate with a load test."
      - "So we should rewrite the whole service in a faster compiled language to keep up."
      - "So I'll go with whatever database technology you'd personally prefer for this."
    answer: 1
    explanation: |
      The senior/staff move is closing the loop: numbers → architecture (cache + shard) →
      the one risk worth calling out (peak read QPS and hot keys) plus how you'd validate it.
    ref: "concepts.md#putting-it-together-a-worked-capacity-estimate"

  - id: estimation-and-napkin-math-036
    difficulty: intermediate
    tags: [worked-estimate, qps]
    question: |
      A read-heavy service sees 100M new items/day and 10B reads/day. Using ~10^5 s/day, what
      are the approximate average write and read QPS?
    options:
      - "~1,000 write QPS and ~100,000 read QPS"
      - "~10 write QPS and ~1,000 read QPS"
      - "~100,000 write QPS and ~10M read QPS"
      - "~100 write QPS and ~10,000 read QPS"
    answer: 0
    explanation: |
      Writes = 100M / 10^5 ≈ 1,000 QPS. Reads = 10B / 10^5 ≈ 100,000 QPS average. The 100:1
      read:write ratio is exactly what pushes the design toward caching, replicas, and edge
      serving.
    ref: "concepts.md#putting-it-together-a-worked-capacity-estimate"

  - id: estimation-and-napkin-math-037
    difficulty: beginner
    tags: [failure-modes, paralysis]
    question: |
      A candidate responds to an estimation prompt with "it depends, I really can't say
      without data." What failure mode is this, and how is it read?
    options:
      - "Appropriate caution — interviewers reward candidates who wait for real data"
      - "False precision — the candidate stated a spuriously exact number they can't back up"
      - "Analysis paralysis / refusing to commit — read as an inability to reason under uncertainty"
      - "A bits-versus-bytes unit error that throws the estimate off by roughly 8x"
    answer: 2
    explanation: |
      Refusing to commit signals you can't reason under uncertainty — the exact skill being
      tested. The fix is to pick reasonable assumptions, state them, and proceed.
    ref: "concepts.md#common-failure-modes-interviewers-penalize"

  - id: estimation-and-napkin-math-038
    difficulty: intermediate
    tags: [failure-modes, false-precision]
    question: |
      A candidate confidently answers "42,347 QPS." Why might a rounded "~40,000 QPS" actually
      score better?
    options:
      - "Because 40,000 happens to be the single mathematically correct value here"
      - "Because interviewers have a stylistic aversion to seeing the digit 7 in answers"
      - "Because precise-looking numbers are always arithmetically wrong by definition"
      - "Because round numbers signal you know it's an estimate, while spurious precision signals you misunderstand the exercise"
    answer: 3
    explanation: |
      False precision (42,347 QPS) betrays a misunderstanding — the inputs were rough
      assumptions. A rounded figure shows you know it's an order-of-magnitude estimate, which
      is the whole point.
    ref: "concepts.md#common-failure-modes-interviewers-penalize"

  - id: estimation-and-napkin-math-039
    difficulty: intermediate
    tags: [failure-modes, decision]
    question: |
      A candidate computes "300K peak QPS" and immediately moves on without comment. What's the
      missing move?
    options:
      - "Nothing — a well-computed number like 300K QPS stands entirely on its own"
      - "Tie the number to a decision: e.g., '300K QPS means one box won't do it — we need a fleet plus caching'"
      - "Recompute the same 300K figure three more times to be sure it's correct"
      - "Add more significant figures so the 300K number looks more precise and rigorous"
    answer: 1
    explanation: |
      Not tying the number to a decision is a common fail. Always finish an estimate with "…so
      the design needs X" — the number only matters because it drives an architectural choice.
    ref: "concepts.md#common-failure-modes-interviewers-penalize"

  - id: estimation-and-napkin-math-040
    difficulty: advanced
    tags: [failure-modes, sanity-check]
    question: |
      A candidate cheerfully concludes "so we need ~50 PB/day for this chat app" and keeps
      going. Which failure mode is most on display?
    options:
      - "A missing order-of-magnitude sanity check — 50 PB/day for a chat app should make them flinch and recheck"
      - "False precision — quoting 50 PB/day as if it were an exact, measured figure"
      - "Bits-versus-bytes confusion — mixing up Gbps and GB somewhere in the pipeline"
      - "Analysis paralysis — freezing up and refusing to commit to any storage number"
    answer: 0
    explanation: |
      The most common fail is accepting an absurd result without flinching. 50 PB/day for text
      chat is wildly off; a sanity check would catch a bad per-message size or a unit slip.
    ref: "concepts.md#common-failure-modes-interviewers-penalize"

  - id: estimation-and-napkin-math-041
    difficulty: beginner
    tags: [method, rounding, follow-up]
    question: |
      An interviewer challenges: "Rounding 86,400 to 100,000 is a ~16% error — why is that OK?"
      What's the best answer?
    options:
      - "It isn't really OK; I should always divide by 86,400 exactly to stay accurate"
      - "Because 100,000 is a clean power of two that makes the binary arithmetic simpler"
      - "At estimation precision I care about order of magnitude, and one significant figure keeps mental math reliable; a ~15% skew never flips the 'one box vs a fleet' decision — I'd use exact numbers only if the decision were close"
      - "Because interviewers usually can't check my mental arithmetic anyway, so it hardly matters"
    answer: 2
    explanation: |
      Rounding is defensible because a ~15% skew doesn't change an order-of-magnitude
      conclusion, and it keeps the math reliable. The mature caveat is that you'd use exact
      figures only when the decision is genuinely close.
    ref: "concepts.md#common-follow-up-questions"

  - id: estimation-and-napkin-math-042
    difficulty: advanced
    tags: [follow-up, compression, media]
    question: |
      "Your storage estimate ignores compression and media — redo it." What's the strongest
      response?
    options:
      - "Compression doesn't meaningfully affect storage estimates, so my figure stands unchanged"
      - "Media is negligible next to text records, so adding it in changes essentially nothing"
      - "I'd just multiply the whole estimate by 10 to be safe and leave it at that"
      - "Text compresses ~2–5x so my raw figure is an upper bound; media is ~1000x text and would dominate, so I'd split blob storage from the metadata DB and estimate each separately"
    answer: 3
    explanation: |
      The strong answer notes text compresses ~2–5x (raw = upper bound) and that media
      dwarfs text (~1000x), so you separate blob storage from metadata and estimate them
      independently — showing you know what dominates.
    ref: "concepts.md#common-follow-up-questions"

  - id: estimation-and-napkin-math-043
    difficulty: beginner
    tags: [scope, boundary]
    question: |
      Where does the estimation craft (numbers, ratios, narration) fit relative to the
      technical system-design interview method?
    options:
      - "It's the reasoning you plug into the system-design method (owned by system-design/interview-method-scenario-playbooks) to size components"
      - "It fully replaces the system-design interview method, making the whiteboard steps unnecessary"
      - "It only applies to coding and algorithm interviews, not to system-design rounds at all"
      - "It's essentially unrelated to system design and belongs to a separate interview track"
    answer: 0
    explanation: |
      This topic owns the estimation craft — the numbers, ratios, and how you narrate the
      math — that you plug into the whiteboard-driving method taught in
      system-design/interview-method-scenario-playbooks.
    ref: "concepts.md#why-interviewers-want-the-method-not-the-number"

  - id: estimation-and-napkin-math-044
    difficulty: advanced
    tags: [method, units, failure-modes]
    question: |
      Why does a senior estimator deliberately carry units (req/s, bytes/day) through each
      stage of the calculation?
    options:
      - "To make the answer look longer and more thorough to the interviewer"
      - "Because carrying units makes a dimension error (e.g., a dropped ÷8 or a mixed-up per-day term) immediately visible"
      - "Because carrying the units through actually changes the final computed number"
      - "Because interviewers strictly require every quantity to be expressed in SI units"
    answer: 1
    explanation: |
      Narrating units at each stage surfaces dimension errors instantly — a bits/bytes slip
      or a lost seconds-per-day term jumps out when the units don't cancel to what you expect.
    ref: "concepts.md#the-estimation-method-assume-round-sanity-check-show-the-work"
