topic: "API Security & Hardening (OWASP API Top 10)"
domain: rest-api-design
topic_slug: api-security-and-hardening
version: 1
questions:
  - id: api-security-and-hardening-001
    difficulty: beginner
    tags: [owasp, top-10, overview]
    question: |
      Which risk sits at #1 (API1:2023) in the OWASP API Security Top 10
      2023 edition?
    options:
      - "Broken Object Level Authorization"
      - "Injection (SQL, OS, or LDAP)"
      - "Security Misconfiguration (API8)"
      - "Server-Side Request Forgery (SSRF)"
    answer: 0
    explanation: |
      Broken Object Level Authorization (BOLA / IDOR) is API1:2023, the top
      API risk. Unlike classic web apps where Injection often leads, API
      breaches are dominated by object-level authorization failures.
    ref: "concepts.md#the-owasp-api-security-top-10-2023-at-a-glance"

  - id: api-security-and-hardening-002
    difficulty: intermediate
    tags: [owasp, edition-changes, bopla]
    question: |
      In the 2023 edition, what happened to the old "Excessive Data Exposure"
      and "Mass Assignment" categories from 2019?
    options:
      - "They were removed entirely in 2023 as no longer considered relevant"
      - "They were merged into the Security Misconfiguration category (API8)"
      - "They were merged into Broken Object Property Level Authorization (BOPLA)"
      - "They were promoted to the API1 and API2 top slots respectively"
    answer: 2
    explanation: |
      2023 combined Excessive Data Exposure (read side) and Mass Assignment
      (write side) into API3:2023 Broken Object Property Level Authorization,
      recognizing both as field-level authorization failures.
    ref: "concepts.md#the-owasp-api-security-top-10-2023-at-a-glance"

  - id: api-security-and-hardening-003
    difficulty: beginner
    tags: [authentication, authorization, concepts]
    question: |
      What distinction does OWASP emphasize as the root of most API breaches?
    options:
      - "Encryption (reversible with a key) vs hashing (one-way digest)"
      - "REST (resource endpoints) vs GraphQL (single query endpoint)"
      - "Stateless tokens vs stateful server-side session storage"
      - "Authentication (who are you) vs authorization (are you allowed to touch this)"
    answer: 3
    explanation: |
      Most API breaches are authorization failures: the caller is
      authenticated but the server fails to verify they may access the
      specific object, function, or field. Authentication alone can't catch it.
    ref: "concepts.md#the-owasp-api-security-top-10-2023-at-a-glance"

  - id: api-security-and-hardening-004
    difficulty: beginner
    tags: [bola, idor, api1]
    question: |
      A logged-in user calls `GET /invoices/1001` (their own) successfully,
      then changes it to `GET /invoices/1002` with the same valid token and
      receives another user's invoice. Which risk is this?
    options:
      - "Broken Object Level Authorization (BOLA)"
      - "Broken Authentication (API2)"
      - "Security Misconfiguration (API8)"
      - "Unrestricted Resource Consumption (API4)"
    answer: 0
    explanation: |
      This is textbook BOLA/IDOR: authentication passes (valid token) but the
      server never checks that invoice 1002 belongs to the caller. The fix is
      an object-level ownership check on every access.
    ref: "concepts.md#api1-broken-object-level-authorization"

  - id: api-security-and-hardening-005
    difficulty: intermediate
    tags: [bola, uuid, api1]
    question: |
      A team switches invoice ids from sequential integers to random UUIDs to
      stop the increment attack. Are they now protected from BOLA?
    options:
      - "Yes — unguessable random ids make object enumeration and BOLA effectively impossible"
      - "Yes — as long as the UUIDs are version 4 (fully random rather than sequential)"
      - "No — UUIDs raise discovery difficulty but are not access control; ownership must still be checked"
      - "No — but only because UUIDs can theoretically collide and expose another record"
    answer: 2
    explanation: |
      Unguessable ids raise the bar for discovery but leak via URLs, logs,
      referrers, and screenshots. Authorization must still verify the object
      belongs to the authenticated principal; UUIDs are not a substitute.
    ref: "concepts.md#api1-broken-object-level-authorization"

  - id: api-security-and-hardening-006
    difficulty: advanced
    tags: [bola, enforcement, api1]
    question: |
      Why can't a generic API gateway or a shared middleware filter reliably
      prevent BOLA on its own?
    options:
      - "Gateways can't read the Authorization header or decode the bearer token inside it"
      - "Gateways only inspect outbound responses, never the inbound request path or its body"
      - "BOLA only occurs over HTTP/2 multiplexed streams, which gateways cannot fully parse"
      - "BOLA requires knowing the object's owner, which only the application data layer knows"
    answer: 3
    explanation: |
      Object-level authorization depends on the relationship between the
      caller and the specific object (its owner/tenant), which lives in the
      application. It must be enforced in the code path that loads the object.
    ref: "concepts.md#api1-broken-object-level-authorization"

  - id: api-security-and-hardening-007
    difficulty: intermediate
    tags: [authentication, jwt, api2]
    question: |
      A JWT arrives with header `{"alg":"none"}` and no signature. What should
      a hardened verifier do?
    options:
      - "Accept it as long as the payload claims like exp and aud are valid"
      - "Reject it; never honor 'none' and pin the expected algorithm server-side"
      - "Accept it only for read-only GET endpoints that never mutate state"
      - "Re-sign it with the server's key and continue processing normally"
    answer: 1
    explanation: |
      `alg: none` means no signature; honoring it lets an attacker forge any
      token. Reject `none` outright and pin the expected algorithm rather than
      trusting the token header to choose it.
    ref: "concepts.md#api2-broken-authentication"

  - id: api-security-and-hardening-008
    difficulty: advanced
    tags: [authentication, jwt, algorithm-confusion, api2]
    question: |
      In a JWT "algorithm confusion" (RS256→HS256) attack, what does the
      attacker exploit?
    options:
      - "The verifier picking the algorithm from the token header, letting the attacker sign HS256 using the public RSA key as the HMAC secret"
      - "A weak, low-entropy HMAC secret that the attacker recovers offline by brute-forcing a captured token"
      - "A hash collision in the SHA-256 function that lets two different payloads share one signature"
      - "An expired public signing certificate that the verifier continues to trust past its validity window"
    answer: 0
    explanation: |
      If the server chooses the verification algorithm from the token's `alg`
      header, an attacker sets alg to HS256 and signs using the server's public
      RSA key (which is public) as the HMAC key. Pin the algorithm server-side.
    ref: "concepts.md#api2-broken-authentication"

  - id: api-security-and-hardening-009
    difficulty: beginner
    tags: [authentication, credentials, api2]
    question: |
      Why is `GET /account?access_token=eyJhbGci...` a broken-authentication
      anti-pattern?
    options:
      - "Query strings have a strict length cap that truncates long access tokens"
      - "GET requests are inherently unauthenticated and cannot carry any credential"
      - "Tokens in URLs land in access logs, browser history, and referrer headers, leaking the credential"
      - "It forces the browser to send an extra CORS preflight for every request"
    answer: 2
    explanation: |
      Credentials in the query string are recorded by proxies, server logs,
      browser history, and Referer headers. Send them in the Authorization
      header (or a Secure HttpOnly cookie) instead.
    ref: "concepts.md#api2-broken-authentication"

  - id: api-security-and-hardening-010
    difficulty: intermediate
    tags: [authentication, jwt, revocation, api2]
    question: |
      A self-contained JWT can't be "un-issued" on logout. What is the
      standard way to limit the damage of a stolen but not-yet-expired token?
    options:
      - "Store the JWT in browser localStorage instead of a cookie for safety"
      - "Encrypt the JWT payload with AES so a stolen token can't be read"
      - "Add more identity claims to the token so the server can re-verify it"
      - "Keep token lifetimes short and use refresh tokens or a revocation/denylist"
    answer: 3
    explanation: |
      Because JWTs are stateless, revocation is hard. Short access-token
      lifetimes plus refresh tokens (and optionally a server-side denylist)
      bound the window a leaked token remains useful.
    ref: "concepts.md#api2-broken-authentication"

  - id: api-security-and-hardening-011
    difficulty: intermediate
    tags: [bopla, mass-assignment, api3]
    question: |
      A profile form only exposes name and email, but the API binds the whole
      request body onto the entity, so `PATCH /users/me {"isAdmin": true}`
      escalates privileges. What is this called?
    options:
      - "Mass Assignment"
      - "Excessive Data Exposure"
      - "Broken Function Level Authorization"
      - "Server-Side Request Forgery"
    answer: 0
    explanation: |
      Mass assignment (the write half of BOPLA/API3) occurs when client JSON
      is bound directly to internal fields. Bind only an explicit allowlist of
      writable properties; reject or ignore read-only fields like isAdmin.
    ref: "concepts.md#api3-broken-object-property-level-authorization"

  - id: api-security-and-hardening-012
    difficulty: intermediate
    tags: [bopla, excessive-data-exposure, api3]
    question: |
      An endpoint returns the full user entity including `passwordHash` and
      `internalRiskScore`, trusting the mobile app to hide them. Which BOPLA
      half is this, and the fix?
    options:
      - "Mass Assignment; bind an allowlisted request DTO of writable fields"
      - "Broken Authentication; rotate the signing keys and revoke issued tokens"
      - "Excessive Data Exposure; return an explicit response DTO/allowlist of fields"
      - "Security Misconfiguration; add the standard set of security response headers"
    answer: 2
    explanation: |
      Serializing the whole entity and relying on the client to hide fields is
      Excessive Data Exposure (read half of BOPLA). Fix it by returning an
      explicit response DTO/schema — an allowlist of fields — defined in OpenAPI.
    ref: "concepts.md#api3-broken-object-property-level-authorization"

  - id: api-security-and-hardening-013
    difficulty: intermediate
    tags: [bopla, dto, api3]
    question: |
      What single design discipline addresses BOTH halves of BOPLA (excessive
      exposure and mass assignment)?
    options:
      - "Applying a strict rate limit to every endpoint so oversharing is throttled"
      - "Switching all resource ids to random UUIDs so fields can't be enumerated"
      - "Terminating TLS at the gateway so the entity is never exposed in transit"
      - "Return a DTO and bind a DTO — treat the wire schema as a deliberate projection in both directions"
    answer: 3
    explanation: |
      Explicit, allowlisted request and response schemas (DTOs) stop the server
      from over-serializing (read) and over-binding (write). Never blindly
      serialize/deserialize the whole domain object.
    ref: "concepts.md#api3-broken-object-property-level-authorization"

  - id: api-security-and-hardening-014
    difficulty: beginner
    tags: [resource-consumption, rate-limit, api4]
    question: |
      Which HTTP status code and header pair correctly signals that a client
      has exceeded a rate limit and when it may retry?
    options:
      - "403 Forbidden with WWW-Authenticate"
      - "429 Too Many Requests with Retry-After"
      - "503 Service Unavailable with Allow"
      - "400 Bad Request with Location"
    answer: 1
    explanation: |
      429 Too Many Requests indicates throttling; Retry-After tells the client
      how long to back off. RateLimit-* headers can additionally expose the
      limit, remaining quota, and reset window.
    ref: "concepts.md#api4-unrestricted-resource-consumption"

  - id: api-security-and-hardening-015
    difficulty: intermediate
    tags: [resource-consumption, pagination, api4]
    question: |
      A list endpoint honors `?limit=` with no upper bound, so a client sends
      `?limit=10000000`. Which API4 control is missing?
    options:
      - "A pagination cap that clamps the maximum page size"
      - "Mandatory TLS enforcement on the list endpoint to encrypt the oversized response"
      - "An anti-CSRF synchronizer token bound to the caller's session cookie"
      - "A restrictive Content-Security-Policy header returned with every list response"
    answer: 0
    explanation: |
      Unbounded page sizes are a resource-consumption amplification vector.
      Clamp limit to a sane maximum server-side so a single request can't force
      the server to fetch and serialize millions of rows.
    ref: "concepts.md#api4-unrestricted-resource-consumption"

  - id: api-security-and-hardening-016
    difficulty: intermediate
    tags: [resource-consumption, dos, api4]
    question: |
      Which status code best signals a rejected oversized request body, and
      why should the check happen early?
    options:
      - "422 Unprocessable Content; because the body is semantically invalid"
      - "500 Internal Server Error; the server crashed on the big body"
      - "413 Content Too Large; reject before allocating memory or making downstream calls so the limit itself isn't a DoS"
      - "206 Partial Content; the server processed part of the body"
    answer: 2
    explanation: |
      413 Content Too Large is the correct status. Validating size/scope before
      buffering the whole body or fanning out to dependencies prevents the
      request from consuming resources just to be rejected.
    ref: "concepts.md#api4-unrestricted-resource-consumption"

  - id: api-security-and-hardening-017
    difficulty: intermediate
    tags: [resource-consumption, denial-of-wallet, api4]
    question: |
      Beyond CPU/memory DoS, what additional cloud-era harm does API4
      explicitly cover?
    options:
      - "SQL injection through unvalidated query parameters on the list endpoint"
      - "Session fixation where an attacker pins a victim's pre-authenticated session id"
      - "Clickjacking that frames the API's responses inside an attacker-controlled page"
      - "Financial exhaustion ('denial of wallet') from unbounded SMS, compute, or third-party API spend"
    answer: 3
    explanation: |
      In pay-per-use clouds, unbounded consumption directly translates to cost.
      Uncapped upstream calls, messaging, or compute can drain a budget even
      without taking the service down.
    ref: "concepts.md#api4-unrestricted-resource-consumption"

  - id: api-security-and-hardening-018
    difficulty: beginner
    tags: [bfla, api5]
    question: |
      A normal user sends `DELETE /admin/users/42` with their ordinary token
      and it succeeds. Which risk is this?
    options:
      - "Broken Function Level Authorization"
      - "Broken Object Level Authorization"
      - "Improper Inventory Management"
      - "Unsafe Consumption of APIs"
    answer: 0
    explanation: |
      Broken Function Level Authorization (API5) is calling a privileged
      operation you shouldn't. BFLA is about the function/role; BOLA is about
      the specific object. Role checks must be enforced on every route/method.
    ref: "concepts.md#api5-broken-function-level-authorization"

  - id: api-security-and-hardening-019
    difficulty: intermediate
    tags: [bfla, bola, comparison, api5]
    question: |
      What is the crispest distinction between BOLA (API1) and BFLA (API5)?
    options:
      - "BOLA is strictly about read operations, while BFLA governs only writes and destructive methods"
      - "BOLA is a REST-only vulnerability, whereas BFLA arises only in GraphQL resolver layers"
      - "BOLA is accessing the wrong object; BFLA is invoking the wrong function/operation for your role"
      - "BOLA is purely an authentication failure, while BFLA is purely an authorization failure"
    answer: 2
    explanation: |
      Both are authorization gaps. BOLA = wrong object (another user's record
      by changing an id). BFLA = wrong function/role (an admin operation as a
      regular user). Both need consistent server-side checks.
    ref: "concepts.md#api5-broken-function-level-authorization"

  - id: api-security-and-hardening-020
    difficulty: intermediate
    tags: [bfla, ui, api5]
    question: |
      "The edit button is only shown to admins, so regular users can't modify
      articles." Why is this insufficient?
    options:
      - "It is sufficient once the edit button is disabled in the server-rendered HTML template"
      - "It is perfectly fine as long as each article is addressed by an unguessable random UUID"
      - "It only fails over plaintext HTTP; a TLS-encrypted connection closes the gap entirely"
      - "Hiding UI controls is not authorization; a user can send PUT /articles/9 directly to the API"
    answer: 3
    explanation: |
      Client-side UI is not a security boundary. The API must enforce the role
      check on every method and route; an attacker crafts the request directly
      regardless of what the UI shows.
    ref: "concepts.md#api5-broken-function-level-authorization"

  - id: api-security-and-hardening-021
    difficulty: intermediate
    tags: [business-flows, api6, anti-automation]
    question: |
      An attacker scripts the legitimate, authorized "buy ticket" endpoint to
      grab all concert tickets for resale. No BOLA, no injection. Which risk?
    options:
      - "Broken Authentication (API2:2023 credential/token flaws)"
      - "Unrestricted Access to Sensitive Business Flows"
      - "Security Misconfiguration (API8:2023 hardening gaps)"
      - "Server-Side Request Forgery (API7:2023 URL-fetch abuse)"
    answer: 1
    explanation: |
      API6 covers automated abuse of a business flow whose value assumes
      human-scale, fair use. Each request is valid and authorized; the gap is
      the lack of anti-automation controls on the flow.
    ref: "concepts.md#api6-unrestricted-access-to-sensitive-business-flows"

  - id: api-security-and-hardening-022
    difficulty: advanced
    tags: [business-flows, api6, mitigation]
    question: |
      Why is a per-IP rate limit often inadequate as the sole mitigation for
      API6 business-flow abuse?
    options:
      - "Attackers rotate IPs; you also need per-user/per-flow limits and bot/velocity detection"
      - "Per-IP limits mostly break legitimate CDN and corporate-proxy traffic rather than abuse"
      - "Per-IP rate limiting only functions correctly once the endpoint is served over HTTP/3"
      - "Client IP addresses are encrypted under TLS, so a per-IP counter can never read them"
    answer: 0
    explanation: |
      Sophisticated abuse rotates IPs and uses botnets, so per-IP limits alone
      are evadable. Effective API6 defense adds per-customer/per-flow caps,
      device fingerprinting, CAPTCHA/proof-of-work, and non-human pattern detection.
    ref: "concepts.md#api6-unrestricted-access-to-sensitive-business-flows"

  - id: api-security-and-hardening-023
    difficulty: beginner
    tags: [ssrf, api7]
    question: |
      An "import avatar from URL" endpoint fetches whatever URL the client
      supplies. What class of vulnerability does this most directly risk?
    options:
      - "Cross-Site Scripting (stored XSS)"
      - "Broken Object Level Authorization"
      - "Server-Side Request Forgery (SSRF)"
      - "Improper Inventory Management"
    answer: 2
    explanation: |
      Fetching a client-controlled URL server-side is the definition of SSRF
      (API7). The attacker can make the server reach internal-only addresses it
      couldn't hit directly.
    ref: "concepts.md#api7-server-side-request-forgery"

  - id: api-security-and-hardening-024
    difficulty: advanced
    tags: [ssrf, cloud, metadata, api7]
    question: |
      A classic cloud SSRF payload points the server at
      `http://169.254.169.254/latest/meta-data/...`. What is the attacker
      typically after?
    options:
      - "A denial-of-service crash that exhausts the metadata service's connection pool"
      - "The server's TLS private key, exported in PEM form from the metadata endpoint"
      - "The victim client's authenticated session cookie stored in the metadata cache"
      - "Temporary cloud IAM credentials from the instance metadata service"
    answer: 3
    explanation: |
      169.254.169.254 is the link-local instance metadata endpoint. Reaching it
      via SSRF can leak temporary IAM credentials, enabling broad cloud access.
      Defenses include IMDSv2, egress controls, and blocking link-local ranges.
    ref: "concepts.md#api7-server-side-request-forgery"

  - id: api-security-and-hardening-025
    difficulty: advanced
    tags: [ssrf, dns-rebinding, api7]
    question: |
      A team validates that the submitted hostname isn't a private IP, then
      fetches it. Why can this still be bypassed?
    options:
      - "DNS rebinding/redirects: the name can resolve to a public IP at check time and a private IP at fetch time; re-check after DNS resolution and block redirects to internal IPs"
      - "TLS termination strips the hostname before the resolver ever sees it, voiding the check"
      - "Private IP ranges are always IPv6, so an IPv4-only validator can never detect them"
      - "The client-supplied Host header silently overrides DNS resolution during the fetch"
    answer: 0
    explanation: |
      Checking the hostname/string isn't enough — DNS can rebind between the
      check and the fetch, and HTTP redirects can point to internal targets.
      Resolve DNS, block private/link-local ranges post-resolution, and don't
      follow redirects to internal addresses.
    ref: "concepts.md#api7-server-side-request-forgery"

  - id: api-security-and-hardening-026
    difficulty: intermediate
    tags: [ssrf, defense, api7]
    question: |
      Which is the strongest primary control for SSRF on a URL-fetching
      endpoint?
    options:
      - "A denylist of known-bad IP ranges only, refreshed nightly from a threat feed"
      - "Rate limiting the endpoint to a few fetches per minute per calling client"
      - "An allowlist of permitted schemes (https) and hosts/domains — deny by default"
      - "Returning 404 instead of 403 so the fetch target's existence stays hidden"
    answer: 2
    explanation: |
      Allowlisting the destination (scheme + host/domain) and denying by
      default is far more robust than a denylist, which is perpetually
      incomplete. Combine with post-DNS private-range blocking and egress controls.
    ref: "concepts.md#api7-server-side-request-forgery"

  - id: api-security-and-hardening-027
    difficulty: beginner
    tags: [misconfiguration, api8]
    question: |
      Which of the following is a Security Misconfiguration (API8) rather than
      an authorization flaw?
    options:
      - "A user reads another user's order by incrementing the numeric id in the request path"
      - "A normal user successfully calling an admin-only DELETE with their ordinary token"
      - "Binding untrusted client JSON directly onto a privileged isAdmin entity field"
      - "Verbose error responses leaking stack traces and framework versions, plus permissive CORS"
    answer: 3
    explanation: |
      Verbose errors, permissive CORS, missing security headers, default
      credentials, and unpatched components are Security Misconfiguration
      (API8). The other options are BOLA, BFLA, and BOPLA respectively.
    ref: "concepts.md#api8-security-misconfiguration"

  - id: api-security-and-hardening-028
    difficulty: intermediate
    tags: [misconfiguration, injection, api8]
    question: |
      In the 2023 edition, where does classic injection (SQL/OS/LDAP) largely
      sit, and what is the primary contract-level defense against SQL injection?
    options:
      - "It remains standalone at API1:2023; the primary defense is switching ids to random UUIDs"
      - "It's folded under Security Misconfiguration (API8); the defense is parameterized queries / prepared statements"
      - "It sits at API4:2023 resource consumption; the defense is aggressive per-client rate limiting"
      - "It is now API10:2023 unsafe consumption; the defense is enforcing TLS on every hop"
    answer: 1
    explanation: |
      Injection is no longer the standalone API #1 and is largely covered under
      Security Misconfiguration. The definitive SQL-injection defense is
      parameterized queries; escaping is only a fallback.
    ref: "concepts.md#api8-security-misconfiguration"

  - id: api-security-and-hardening-029
    difficulty: intermediate
    tags: [misconfiguration, xxe, api8]
    question: |
      An API parses XML request bodies with external entities enabled. What
      attack does this most directly enable?
    options:
      - "XML External Entity (XXE) injection — reading local files or SSRF via entities"
      - "Cross-Site Request Forgery riding the victim's ambient session cookie"
      - "Clickjacking that frames the parsed XML response in a hidden iframe"
      - "JWT algorithm confusion downgrading the request's RS256 signature to HS256"
    answer: 0
    explanation: |
      Parsing XML with external entities enabled allows XXE, which can read
      local files or trigger SSRF. Disable external entity resolution (or prefer
      JSON). This falls under Security Misconfiguration.
    ref: "concepts.md#api8-security-misconfiguration"

  - id: api-security-and-hardening-030
    difficulty: intermediate
    tags: [inventory, api9, zombie-apis]
    question: |
      A retired `/v1` API is still running next to `/v2` and never received the
      BOLA fix; an attacker uses it to dump data. Which risk does this
      illustrate?
    options:
      - "Unsafe Consumption of APIs (over-trusting an upstream service's response)"
      - "Broken Authentication (accepting a forged or expired bearer token)"
      - "Improper Inventory Management"
      - "Unrestricted Resource Consumption (an unbounded, uncapped request load)"
    answer: 2
    explanation: |
      Forgotten hosts and old, unpatched versions ("zombie"/"shadow" APIs) are
      Improper Inventory Management (API9). Attackers target the weakest
      variant, so old versions must be documented and actually retired.
    ref: "concepts.md#api9-improper-inventory-management"

  - id: api-security-and-hardening-031
    difficulty: intermediate
    tags: [inventory, api9, deprecation]
    question: |
      Which practice most directly mitigates Improper Inventory Management?
    options:
      - "Adding more security response headers such as HSTS and X-Content-Type-Options"
      - "Increasing JWT expiry times so tokens survive across version migrations"
      - "Reflecting the caller's Origin header into the CORS allowlist for every host"
      - "Maintaining a complete, owned inventory of hosts/versions and a formal deprecation process that actually turns old versions off"
    answer: 3
    explanation: |
      API9 is about knowing what you run. A current inventory (with owners and
      data classification), documented endpoints (OpenAPI as source of truth),
      and real retirement of deprecated versions are the core mitigations.
    ref: "concepts.md#api9-improper-inventory-management"

  - id: api-security-and-hardening-032
    difficulty: intermediate
    tags: [unsafe-consumption, api10, third-party]
    question: |
      Which behavior is the essence of API10:2023 Unsafe Consumption of APIs?
    options:
      - "Trusting data from third-party/upstream APIs more than user input and applying weaker validation"
      - "Serializing the full entity and exposing too many internal fields to clients"
      - "Allowing unlimited request body sizes that exhaust server memory on parse"
      - "Hiding admin endpoints in the UI instead of enforcing role checks on them"
    answer: 0
    explanation: |
      API10 warns that developers over-trust responses from integrated services.
      If an upstream is compromised or malicious, that trust becomes your
      vulnerability. Validate upstream data like user input.
    ref: "concepts.md#api10-unsafe-consumption-of-apis"

  - id: api-security-and-hardening-033
    difficulty: advanced
    tags: [unsafe-consumption, api10, redirects]
    question: |
      Which set of practices best mitigates Unsafe Consumption of APIs?
    options:
      - "Blindly follow every redirect and skip request timeouts entirely to maximize throughput"
      - "Return the upstream service's raw error bodies verbatim to the calling client"
      - "Validate/schema-check upstream responses, use TLS with cert verification, cap timeouts and response size, and don't blindly follow redirects"
      - "Disable upstream TLS certificate verification to avoid intermittent handshake failures"
    answer: 2
    explanation: |
      Treat upstream data as untrusted: schema-validate it, use verified TLS,
      enforce timeouts and size caps, and restrict/refuse redirects (allowlist
      redirect targets). These are the API10 defenses.
    ref: "concepts.md#api10-unsafe-consumption-of-apis"

  - id: api-security-and-hardening-034
    difficulty: beginner
    tags: [cors, browser, concept]
    question: |
      What does CORS (Cross-Origin Resource Sharing) actually control?
    options:
      - "Server-side authorization enforced uniformly for browser and non-browser clients alike"
      - "Which TLS cipher suites and protocol versions the server will negotiate on the handshake"
      - "The per-client request rate limit and the burst quota the API grants each origin"
      - "Whether a browser lets a page on one origin READ responses from an API on another origin"
    answer: 3
    explanation: |
      CORS is a browser mechanism that relaxes the Same-Origin Policy so a page
      can read cross-origin responses only if the API opts in. It is not
      server-side access control — non-browser clients ignore it entirely.
    ref: "concepts.md#cors-misconfiguration"

  - id: api-security-and-hardening-035
    difficulty: advanced
    tags: [cors, credentials, misconfiguration]
    question: |
      Which CORS configuration is the genuinely dangerous one that lets a
      malicious site read a logged-in user's data?
    options:
      - "Access-Control-Allow-Origin: * returned on public, unauthenticated endpoints with no credentials"
      - "Reflecting the request's Origin into Access-Control-Allow-Origin together with Access-Control-Allow-Credentials: true"
      - "A strict server-side allowlist echoing back only exact-matched, pre-approved origins"
      - "Setting Access-Control-Max-Age to 600 so preflight results are cached for ten minutes"
    answer: 1
    explanation: |
      Wildcard ACAO can't be combined with credentials (browsers block it).
      The real breach is reflecting the caller's Origin AND allowing
      credentials, which trusts every origin and exposes authenticated data.
    ref: "concepts.md#cors-misconfiguration"

  - id: api-security-and-hardening-036
    difficulty: intermediate
    tags: [cors, preflight, options]
    question: |
      For a `PUT` request carrying an `Authorization` header, what does the
      browser do before sending the actual request?
    options:
      - "Sends an OPTIONS preflight with Access-Control-Request-Method/Headers and checks the CORS response"
      - "Nothing special; it sends the PUT directly since the Authorization header is a simple header"
      - "Sends a HEAD request first to check the response's content length before the real PUT"
      - "Silently downgrades the PUT to a GET until the server opts into cross-origin writes"
    answer: 0
    explanation: |
      Non-simple requests trigger a CORS preflight: an OPTIONS request
      advertising the intended method and headers. The browser only sends the
      real request if the server's Access-Control-* response permits it.
    ref: "concepts.md#cors-misconfiguration"

  - id: api-security-and-hardening-037
    difficulty: intermediate
    tags: [cors, security, misconception]
    question: |
      A developer says "our CORS policy is locked down, so our API is
      protected." Why is this reasoning flawed?
    options:
      - "CORS rules apply only to GET requests, so any POST, PUT, or DELETE call is exempt from the browser's cross-origin checks"
      - "CORS was deprecated years ago and superseded by Content-Security-Policy, which now makes all cross-origin access decisions"
      - "CORS only restricts what browsers let scripts read; non-browser clients (curl, servers) ignore it, so it never replaces authn/authz"
      - "CORS enforcement functions only over HTTP/2 connections, so an HTTP/1.1 API is never subject to any cross-origin restriction"
    answer: 2
    explanation: |
      CORS is enforced by browsers, not servers. A direct HTTP client ignores
      it completely. It governs cross-origin reads in browsers and must never be
      treated as a substitute for real authentication and authorization.
    ref: "concepts.md#cors-misconfiguration"

  - id: api-security-and-hardening-038
    difficulty: beginner
    tags: [csrf, cookies, concept]
    question: |
      What makes an API endpoint susceptible to CSRF?
    options:
      - "Accepting a JSON request body, since the application/json content type is inherently forgeable across origins by any site"
      - "Returning HTTP 200 for error conditions, which lets a cross-site page silently retry the forged request until it succeeds"
      - "Using UUIDs for resource ids, because their randomness lets an attacker guess valid targets to forge requests against"
      - "Authenticating via a credential the browser attaches automatically (a cookie), so a cross-site page can trigger authenticated state-changing requests"
    answer: 3
    explanation: |
      CSRF exploits ambient credentials the browser sends automatically —
      cookies, HTTP Basic, client certs. A malicious page can cause the browser
      to send an authenticated request without ever reading the credential.
    ref: "concepts.md#csrf-for-cookie-authenticated-apis"

  - id: api-security-and-hardening-039
    difficulty: intermediate
    tags: [csrf, bearer-token, concept]
    question: |
      Why is an API that authenticates purely with a `Bearer` token in the
      `Authorization` header inherently resistant to CSRF?
    options:
      - "The token isn't attached automatically by the browser and a cross-site page can't read/set the Authorization header, so there's no ambient authority to hijack"
      - "Bearer tokens are always encrypted with the server's public key, so a cross-site page can capture but never actually use one"
      - "Bearer tokens expire the instant the tab that issued them loses focus, so a forged cross-site request always arrives too late"
      - "The Authorization header is exempt from the same-origin policy and bypasses CORS, so the browser refuses to forward it cross-site"
    answer: 0
    explanation: |
      CSRF needs an ambient credential the browser sends on its own. Bearer
      tokens must be added explicitly by client code and can't be read/set by a
      cross-site page, so there's nothing for a forged request to leverage.
    ref: "concepts.md#csrf-for-cookie-authenticated-apis"

  - id: api-security-and-hardening-040
    difficulty: intermediate
    tags: [csrf, samesite, cookies]
    question: |
      Which cookie attribute helps mitigate CSRF by blocking the cookie on
      cross-site subrequests such as a POST initiated from another site?
    options:
      - "HttpOnly"
      - "Secure"
      - "SameSite=Lax (or Strict)"
      - "Domain"
    answer: 2
    explanation: |
      SameSite=Lax/Strict stops the browser from attaching the cookie on
      cross-site requests, mitigating CSRF. HttpOnly blocks JS access (XSS),
      and Secure forces TLS — different protections.
    ref: "concepts.md#csrf-for-cookie-authenticated-apis"

  - id: api-security-and-hardening-041
    difficulty: advanced
    tags: [csrf, custom-header, defense]
    question: |
      Why does requiring a custom header (e.g., `X-Requested-With`) on
      state-changing requests help defend a cookie-authenticated API against
      CSRF?
    options:
      - "Custom headers are transmitted over a separately encrypted TLS channel that a cross-site page has no key to decrypt or replay"
      - "Setting any custom request header automatically strips the browser's ambient session cookies, so the forged call arrives unauthenticated"
      - "Requiring a custom header makes every state-changing request idempotent, so a replayed cross-site request has no cumulative effect"
      - "A simple cross-site HTML form can't set custom headers, and adding one forces a CORS preflight that the attacker's origin will fail"
    answer: 3
    explanation: |
      Cross-site form posts can't add arbitrary headers; setting a custom header
      via script turns the request "non-simple", triggering a preflight the
      malicious origin can't pass. This is a common CSRF mitigation.
    ref: "concepts.md#csrf-for-cookie-authenticated-apis"

  - id: api-security-and-hardening-042
    difficulty: beginner
    tags: [headers, hsts]
    question: |
      What does the `Strict-Transport-Security` (HSTS) response header do?
    options:
      - "Encrypts the response body with an extra layer of AES on top of TLS so intermediaries can never read it"
      - "Tells the browser to use HTTPS for all future requests to the host for a max-age period"
      - "Blocks a page on another origin from reading the response, acting as a server-enforced cross-origin access control"
      - "Sets and rotates a per-session anti-CSRF synchronizer token that the browser echoes on every subsequent request"
    answer: 1
    explanation: |
      HSTS instructs browsers to only connect over HTTPS to the host for the
      given max-age (optionally includeSubDomains/preload), preventing protocol
      downgrade and SSL-strip attacks after the first HTTPS response.
    ref: "concepts.md#security-response-headers"

  - id: api-security-and-hardening-043
    difficulty: intermediate
    tags: [headers, nosniff, content-type]
    question: |
      Why should a JSON API send `X-Content-Type-Options: nosniff` alongside an
      accurate `Content-Type: application/json`?
    options:
      - "It stops the browser from MIME-sniffing the body into HTML/JS, mitigating some content-sniffing XSS"
      - "It transparently gzip-compresses the JSON payload so large responses transfer faster over the wire"
      - "It enables shared HTTP caching of the JSON response across browsers, proxies, and CDN edge nodes"
      - "It signals to the client that the JSON response is idempotent and therefore safe to retry automatically"
    answer: 0
    explanation: |
      nosniff forces the browser to honor the declared Content-Type instead of
      guessing. Combined with a correct JSON content type, it prevents a JSON
      response from being interpreted as executable HTML/JS.
    ref: "concepts.md#security-response-headers"

  - id: api-security-and-hardening-044
    difficulty: intermediate
    tags: [headers, cache-control, sensitive-data]
    question: |
      Which header keeps a response containing personal or secret data out of
      shared/browser caches?
    options:
      - "ETag"
      - "Access-Control-Allow-Origin"
      - "Cache-Control: no-store"
      - "Vary: Accept"
    answer: 2
    explanation: |
      Cache-Control: no-store instructs caches (browser, CDN, proxy) not to
      retain the response, preventing sensitive data from lingering in a shared
      cache.
    ref: "concepts.md#security-response-headers"

  - id: api-security-and-hardening-045
    difficulty: beginner
    tags: [injection, validation, allowlist]
    question: |
      What is the recommended validation strategy for untrusted API input?
    options:
      - "Denylist a curated set of known-bad characters and payload signatures, refreshed from a threat feed, and reject any input that matches"
      - "Trust the client-side validation the app already performs and re-check only the few fields that failed on the last submission"
      - "Skip input validation entirely and instead escape the data on output at every rendering or query boundary"
      - "Allowlist: define what is valid (types, formats, ranges, lengths) via schema and reject everything else"
    answer: 3
    explanation: |
      Allowlist validation against a declared schema is robust; denylists of
      "bad characters" are perpetually incomplete. Enforce the request schema
      server-side and reject non-conforming input before processing.
    ref: "concepts.md#input-injection-and-validation"

  - id: api-security-and-hardening-046
    difficulty: intermediate
    tags: [injection, sql, parameterized]
    question: |
      For preventing SQL injection, which control is the definitive primary
      defense rather than a fallback?
    options:
      - "Parameterized queries / prepared statements that keep data separate from query structure"
      - "Manually escaping single and double quotes in every input string before concatenating it into the SQL text"
      - "Rejecting any request whose body exceeds 1MB, on the basis that injection payloads must be large to be effective"
      - "Sending a strict Content-Security-Policy header so the database refuses to execute injected query fragments"
    answer: 0
    explanation: |
      Parameterized queries bind input as data, never as query structure,
      eliminating SQL injection at the source. Escaping is a secondary fallback
      and is error-prone.
    ref: "concepts.md#input-injection-and-validation"

  - id: api-security-and-hardening-047
    difficulty: intermediate
    tags: [validation, client-side, gotcha]
    question: |
      A team relies on the mobile app to validate field lengths and formats.
      Why is this a security problem?
    options:
      - "Client-side checks run more slowly than server-side ones and add noticeable latency to every field the user edits"
      - "Validating in the mobile app breaks the CORS preflight negotiation the browser performs before each state-changing call"
      - "Client-side validation is UX only; an attacker crafts requests directly, so validation must be enforced server-side"
      - "Validating on the client forces responses to be marked no-store, preventing any useful caching of the API's output"
    answer: 2
    explanation: |
      Attackers bypass the app and hit the API directly, so any check that only
      runs client-side offers no protection. Validation must be enforced on the
      server for every request.
    ref: "concepts.md#input-injection-and-validation"

  - id: api-security-and-hardening-048
    difficulty: intermediate
    tags: [error-leakage, misconfiguration, problem-details]
    question: |
      A 500 response returns a full stack trace, the SQL that failed, and the
      framework version. What's the recommended hardened alternative?
    options:
      - "Return HTTP 200 with a success envelope and bury the full stack trace inside a nested field the client is expected to ignore"
      - "Return the same verbose stack trace and SQL, but only over TLS so that eavesdroppers on the wire cannot read the diagnostics"
      - "Return a bare 404 with an empty body for every error class so attackers can never distinguish one failure mode from another"
      - "Return a generic structured error (RFC 9457 problem+json) with a stable code and a correlation/trace id; log the details server-side only"
    answer: 3
    explanation: |
      Verbose errors map your stack and topology for attackers. Return a
      generic problem+json with a stable error code and a trace id, and keep the
      diagnostic detail in server logs keyed by that id.
    ref: "concepts.md#not-leaking-data-in-errors-and-responses"

  - id: api-security-and-hardening-049
    difficulty: advanced
    tags: [error-leakage, enumeration, login]
    question: |
      A login endpoint returns "user not found" vs "wrong password" depending
      on the case. Why is this a vulnerability?
    options:
      - "It slows the response measurably because the server performs an extra database lookup to craft the more specific message"
      - "It is a username-enumeration oracle; return a uniform 'invalid credentials' instead"
      - "It breaks JWT validation because the distinct error strings change the token's audience claim before it is signed"
      - "It requires the server to emit an extra CORS header on the login response, widening the endpoint's attack surface"
    answer: 1
    explanation: |
      Distinct messages let an attacker enumerate valid usernames. Return a
      single uniform "invalid credentials" response (and watch for timing
      differences) so the endpoint doesn't reveal which accounts exist.
    ref: "concepts.md#not-leaking-data-in-errors-and-responses"

  - id: api-security-and-hardening-050
    difficulty: advanced
    tags: [error-leakage, bola, status-codes]
    question: |
      To harden against BOLA probing, why might an API return `404 Not Found`
      instead of `403 Forbidden` for an object the caller doesn't own?
    options:
      - "403 confirms the object exists (an existence oracle); 404 avoids revealing that objects the caller shouldn't know about are present"
      - "404 responses are cached far longer than 403 responses by default, so returning 404 reduces repeated probing load on the server"
      - "403 is not a valid REST status code for object access, so conformant clients silently discard it and retry the request as a 404"
      - "Returning 404 disables CORS for the response, which prevents a malicious cross-origin page from ever reading the forbidden object"
    answer: 0
    explanation: |
      Returning 403 tells the attacker the resource exists but is forbidden,
      leaking existence. Returning 404 for objects the caller may not access
      avoids that oracle. It's a deliberate trade-off tied to BOLA hardening.
    ref: "concepts.md#not-leaking-data-in-errors-and-responses"

  - id: api-security-and-hardening-051
    difficulty: beginner
    tags: [tls, transport]
    question: |
      Why must API traffic be carried over TLS (HTTPS) rather than plaintext
      HTTP?
    options:
      - "TLS compresses the payload as part of the handshake, so encrypted responses are meaningfully smaller than plaintext ones"
      - "TLS performs per-object authorization by embedding the caller's ownership claims into the negotiated session key material"
      - "Plaintext exposes credentials, tokens, and data to eavesdropping and man-in-the-middle tampering"
      - "Plain HTTP cannot carry JSON bodies at all, so any API returning JSON is technically required to negotiate TLS first"
    answer: 2
    explanation: |
      Without TLS, anyone on the network path can read tokens/credentials/data
      and tamper with requests. TLS protects data in transit and integrity;
      it's table stakes for any API.
    ref: "concepts.md#tls-everywhere"

  - id: api-security-and-hardening-052
    difficulty: advanced
    tags: [tls, authorization, gotcha]
    question: |
      "We use TLS everywhere, so we're secure." Which statement corrects this
      claim?
    options:
      - "TLS also enforces object-level authorization by verifying the caller owns each resource named in the encrypted request"
      - "TLS replaces the need for authentication, since a valid certificate chain already proves exactly which user is calling"
      - "TLS prevents mass assignment by stripping any request fields the client is not permitted to bind before decryption"
      - "TLS protects data in transit but does nothing for authorization — a perfectly encrypted request can still be a BOLA attack"
    answer: 3
    explanation: |
      TLS secures the channel, not the logic. An encrypted request can still
      access another user's object (BOLA), escalate a function (BFLA), or
      over-bind fields. TLS and OWASP authz controls are complementary.
    ref: "concepts.md#tls-everywhere"

  - id: api-security-and-hardening-053
    difficulty: intermediate
    tags: [tls, mtls, service-to-service]
    question: |
      For strong service-to-service authentication on internal APIs, which
      transport-layer mechanism is commonly used?
    options:
      - "Mutual TLS (mTLS), where both client and server present certificates"
      - "HTTP Basic authentication over a plaintext connection, sending the shared username and password on every internal call"
      - "SameSite=Strict cookies pinned to each service host, relying on the browser to withhold them on cross-service requests"
      - "A long-lived static API key passed in the query string of every internal request and rotated on a quarterly schedule"
    answer: 0
    explanation: |
      mTLS has both peers present and validate certificates, giving strong
      cryptographic client authentication — a common choice for internal /
      zero-trust service-to-service traffic.
    ref: "concepts.md#tls-everywhere"

  - id: api-security-and-hardening-054
    difficulty: intermediate
    tags: [tls, termination, internal-hop]
    question: |
      TLS terminates at a load balancer and traffic to the backend is
      plaintext on the "internal" network. Why is this still a concern?
    options:
      - "It roughly doubles request latency because the load balancer must fully buffer and re-frame each plaintext response before forwarding"
      - "It breaks HSTS entirely, since the header can only be honored when TLS runs unbroken all the way to the backend origin"
      - "Internal traffic is still a target (insider/lateral movement); secure the LB-to-backend hop with mTLS or a trusted private path"
      - "It prevents any downstream caching, because caches refuse to store a response whose final hop traveled over plaintext HTTP"
    answer: 2
    explanation: |
      "Internal" isn't automatically safe — attackers who gain a foothold can
      sniff the plaintext hop. Secure the load-balancer-to-backend segment too
      (mTLS or a genuinely isolated network).
    ref: "concepts.md#tls-everywhere"

  - id: api-security-and-hardening-055
    difficulty: beginner
    tags: [cookies, httponly, secure]
    question: |
      Which cookie attributes should a session cookie carry to reduce theft
      via XSS and prevent transmission over plaintext?
    options:
      - "Domain and Path only, scoping the cookie so foreign hosts and paths can neither read nor transmit it"
      - "Max-Age and Expires only, expiring the cookie quickly so a stolen copy stops working before it can be replayed"
      - "SameSite=None and nothing else, letting the browser withhold the cookie whenever a script tries to read it"
      - "HttpOnly and Secure"
    answer: 3
    explanation: |
      HttpOnly blocks JavaScript from reading the cookie (mitigating XSS
      theft), and Secure ensures it's only sent over TLS. SameSite additionally
      helps with CSRF but is a separate concern.
    ref: "concepts.md#csrf-for-cookie-authenticated-apis"

  - id: api-security-and-hardening-056
    difficulty: intermediate
    tags: [jwt, claims, api2]
    question: |
      Beyond checking the signature, which JWT claims should a resource server
      validate to avoid accepting a token minted for another service?
    options:
      - "Only exp; issuer and audience are optional once the signature checks out"
      - "exp (expiry) plus iss (issuer) and aud (audience), and nbf where applicable"
      - "Only the sub claim, which already identifies the intended principal"
      - "None — a valid signature already proves the token is authentic"
    answer: 1
    explanation: |
      A valid signature isn't enough: validate exp so it isn't expired, and
      iss/aud so a token issued for a different issuer/audience isn't accepted.
      nbf should be honored when present.
    ref: "concepts.md#api2-broken-authentication"

  - id: api-security-and-hardening-057
    difficulty: advanced
    tags: [oauth, spa, grants]
    question: |
      A mobile app and a browser SPA both need to authenticate users against
      your OAuth 2.1 authorization server. Which grant should they use, and why
      is the older SPA-era choice now forbidden?
    options:
      - "Implicit grant (response_type=token); it returns the token straight from the authorization endpoint, sparing a token-endpoint round trip"
      - "Resource Owner Password Credentials; the app collects the user's password directly and exchanges it for tokens at the endpoint"
      - "Authorization Code with PKCE; OAuth 2.1 removes the Implicit grant because returning tokens in the URL fragment leaks them via history/referrer"
      - "Client Credentials; it is by far the simplest grant and works uniformly for SPAs, mobile apps, and machine clients alike"
    answer: 2
    explanation: |
      OAuth 2.1 makes Authorization Code + PKCE the default for all interactive
      clients and removes Implicit (tokens in the fragment leak) and ROPC (app
      handling passwords defeats delegation). Client Credentials is for
      machine-to-machine, not user auth.
    ref: "concepts.md#oauth-20-and-21-flows"

  - id: api-security-and-hardening-058
    difficulty: expert
    tags: [oauth, pkce, code-interception]
    question: |
      What specific attack does PKCE (RFC 7636) mitigate that a plain
      Authorization Code flow for a public client does not?
    options:
      - "Interception of the authorization code (e.g., via a malicious app registering the redirect scheme), because the code can't be exchanged without the matching code_verifier"
      - "Brute-forcing the access token's HMAC signature offline after capturing a single token from the authorization redirect response"
      - "Reading the access token directly out of the URL fragment after the authorization server redirects it back to the browser tab"
      - "Replaying an already-expired refresh token against the token endpoint to silently mint a fresh access token for the public client"
    answer: 0
    explanation: |
      PKCE binds the code to the client that started the flow: the client sends a
      code_challenge up front and must present the code_verifier at the token
      endpoint. An intercepted code is useless without the verifier, defeating
      authorization-code interception on public/native clients.
    ref: "concepts.md#oauth-20-and-21-flows"

  - id: api-security-and-hardening-059
    difficulty: advanced
    tags: [oauth, redirect-uri, misconfiguration]
    question: |
      Why does OAuth 2.1 require exact-string matching of the redirect URI rather
      than allowing wildcard or prefix matching?
    options:
      - "Exact matching is faster to compute, sparing the authorization server a costly wildcard pattern match on each redirect"
      - "Loose matching lets an attacker register or exploit a matching URL to have the code/token redirected to a host they control"
      - "Wildcards break the PKCE code_challenge, leaving the code_verifier check at the token endpoint unable to bind the flow"
      - "Prefix matching is fundamentally incompatible with HTTPS callback URIs, whose host must be fixed before the TLS handshake"
    answer: 1
    explanation: |
      Wildcard/prefix redirect matching lets an attacker craft a URI that still
      matches but points somewhere they control, redirecting the authorization
      code or token. Exact-string matching closes that open-redirect-style
      hijack.
    ref: "concepts.md#oauth-20-and-21-flows"

  - id: api-security-and-hardening-060
    difficulty: advanced
    tags: [oauth, refresh-token, rotation]
    question: |
      A public client uses refresh-token rotation. An attacker steals a refresh
      token and uses it; later the legitimate client uses its (now-stale) copy.
      What should the authorization server do, and why is rotation valuable here?
    options:
      - "Accept both requests; refresh tokens are explicitly designed to be reused repeatedly until their expiry"
      - "Detect reuse of an already-rotated token as a compromise signal and revoke the whole token chain"
      - "Extend the lifetime of both tokens so neither the attacker's nor the client's copy expires mid-session"
      - "Silently issue a third, longer-lived refresh token to each caller and let both prior tokens remain valid"
    answer: 1
    explanation: |
      With rotation, each refresh issues a new token and invalidates the prior
      one. If a rotated (already-consumed) token is presented again, that reuse
      indicates the chain was stolen; the server revokes the entire chain,
      turning theft into a detectable event.
    ref: "concepts.md#oauth-20-and-21-flows"

  - id: api-security-and-hardening-061
    difficulty: expert
    tags: [scopes, bola, authorization]
    question: |
      An endpoint is gated only by `require_scope("orders:write")`. A token
      legitimately carrying that scope is used to `PUT /orders/42`, an order
      belonging to a different customer, and it succeeds. What went wrong?
    options:
      - "The scope string was too broad and should have been a narrower orders:write:self that self-limits to the caller's own orders"
      - "Scope authorizes what the client app may attempt, not per-object access; a BOLA ownership check on order 42 is still required and was missing"
      - "The endpoint should have required an OIDC ID token rather than an access token, since only ID tokens carry the owning customer id"
      - "PUT operations should never be gated by OAuth scopes at all; scopes are valid only for read-only GET endpoints"
    answer: 1
    explanation: |
      A scope is coarse delegation ("this app may attempt order writes"), not
      per-object authorization. Editing order 42 still needs an object-level check
      that 42 belongs to the subject. Scope checks and BOLA checks are orthogonal
      layers; both are required.
    ref: "concepts.md#scopes-vs-permissions"

  - id: api-security-and-hardening-062
    difficulty: intermediate
    tags: [api-keys, authentication, api2]
    question: |
      Per OWASP, what does an API key primarily establish, and what must it NOT
      be relied on for?
    options:
      - "It cryptographically authenticates a specific end user; it must never be reused as an input to per-client rate limiting"
      - "It identifies the calling application/project and attributes quota; it must not be treated as proof of a user's identity to gate high-value user resources alone"
      - "It encrypts the request body end-to-end; it must never additionally be sent over a TLS-secured connection"
      - "It fully replaces transport TLS for the endpoint; it must never be combined with an OAuth authorization flow"
    answer: 1
    explanation: |
      API keys identify the calling app/project and support quota/rate attribution
      but are shared secrets, not user authentication. High-value or user-specific
      access still needs authenticated user identity plus per-object
      authorization.
    ref: "concepts.md#api-keys-vs-user-authentication"

  - id: api-security-and-hardening-063
    difficulty: expert
    tags: [dpop, proof-of-possession, token-theft]
    question: |
      With DPoP (RFC 9449), an access token carries a `cnf.jkt` claim and each
      request includes a signed `DPoP` proof JWT. An attacker exfiltrates the
      access token (but not the private key). What happens when they replay it,
      and what residual risk remains?
    options:
      - "The stolen token works normally against the resource server; DPoP proofs are validated only at the authorization server during issuance"
      - "The resource server rejects it because the attacker can't produce a DPoP proof signed by the key whose thumbprint matches cnf.jkt; but DPoP does not stop an attacker running code inside the client (e.g., XSS)"
      - "The token works for GET requests but the resource server rejects it on any state-changing POST, PUT, or DELETE method"
      - "The attacker need only also steal the current DPoP-Nonce value, after which the replayed token is accepted indefinitely"
    answer: 1
    explanation: |
      DPoP binds the token to the client's key via cnf.jkt; a stolen token can't
      be used without a matching proof, so exfiltration is defeated. It does not
      protect against code executing in the client, which can mint fresh proofs
      with the in-memory key.
    ref: "concepts.md#sender-constrained-tokens-dpop-and-mtls-bound"

  - id: api-security-and-hardening-064
    difficulty: expert
    tags: [dpop, mtls, binding]
    question: |
      Which pair correctly maps the token-binding mechanism to its confirmation
      claim and layer?
    options:
      - "DPoP → cnf.x5t#S256 at the transport layer; mTLS-bound → cnf.jkt at the application layer"
      - "DPoP → cnf.jkt (JWK thumbprint) at the application layer; mTLS-bound → cnf.x5t#S256 (cert thumbprint) at the transport layer"
      - "Both mechanisms bind via cnf.jkt; they differ only in the token lifetime the server assigns"
      - "Both mechanisms bind via cnf.x5t#S256; DPoP is distinguished solely by also adding a server nonce"
    answer: 1
    explanation: |
      DPoP (RFC 9449) is application-layer and binds via cnf.jkt, a JWK SHA-256
      thumbprint. mTLS-bound tokens (RFC 8705) are transport-layer and bind via
      cnf.x5t#S256, the client certificate thumbprint.
    ref: "concepts.md#sender-constrained-tokens-dpop-and-mtls-bound"

  - id: api-security-and-hardening-065
    difficulty: advanced
    tags: [token-theft, defense-in-depth, revocation]
    question: |
      An interviewer asks how to make a stolen access token as useless as
      possible. Which layered answer is strongest?
    options:
      - "Encrypt the token payload with AES-256 and persist it in browser localStorage so page scripts can reuse it"
      - "Use a single very long-lived access token so clients rarely need to hit the refresh endpoint at all"
      - "Short TTL + refresh-token rotation + sender-constraining (DPoP or mTLS-bound) + a revocation/jti denylist for the residual window"
      - "Put the token in the request query string, relying on TLS on the wire to keep it confidential from eavesdroppers"
    answer: 2
    explanation: |
      No single control suffices. Short lifetimes shrink the window, rotation
      detects refresh theft, sender-constraining makes exfiltration useless, and
      a jti/revocation denylist handles the residual live window. That layered
      story is the senior answer.
    ref: "concepts.md#sender-constrained-tokens-dpop-and-mtls-bound"

  - id: api-security-and-hardening-066
    difficulty: expert
    tags: [jwt, kid-injection, bcp]
    question: |
      A JWT verifier loads the signing key by reading the header's `kid` and
      using it to build a file path: `keys/<kid>.pem`. How is this exploited?
    options:
      - "The attacker sets alg to none and skips the signature, so the verifier never loads any key from the keys directory at all"
      - "The attacker sets kid to a path-traversal or otherwise attacker-influenced value so the verifier loads a key the attacker controls/predicts, then signs the token with it"
      - "The attacker enlarges the token past the server's size limit so the kid path lookup silently falls back to a default key"
      - "The attacker replays a previously-issued refresh token, causing the verifier to reload a stale kid key from disk"
    answer: 1
    explanation: |
      Using kid to build a path or query lets an attacker point at a predictable
      or attacker-controlled key (path traversal, or SQLi returning a chosen key),
      then sign a forged token with it. Treat kid as an opaque lookup against a
      trusted keystore; never interpolate it into paths/queries (RFC 8725).
    ref: "concepts.md#jwt-hardening-and-advanced-attacks"

  - id: api-security-and-hardening-067
    difficulty: expert
    tags: [jwt, jku, header-injection]
    question: |
      A JWT library honors the token's `jku` header to fetch the JWKS used for
      verification. What is the attack and the correct defense?
    options:
      - "The token grows too large for the parser; cap the header size so the oversized jku value is truncated before fetch"
      - "The attacker points jku at a JWKS they host so their key verifies a forged token; defend by allowlisting the JWKS URI to the trusted issuer and ignoring token-supplied jku/x5u"
      - "The attacker sets the jku header value to none; the fix is simply to reject any token whose algorithm is none"
      - "The jku header forces a silent HS256 downgrade of the signature; pin RS256 to keep the asymmetric verification"
    answer: 1
    explanation: |
      jku/x5u headers tell the verifier where to fetch keys. If honored blindly,
      an attacker hosts a JWKS with their own key and forges valid-looking tokens.
      Ignore token-supplied jku/x5u and fetch keys only from an allowlisted,
      trusted issuer endpoint.
    ref: "concepts.md#jwt-hardening-and-advanced-attacks"

  - id: api-security-and-hardening-068
    difficulty: advanced
    tags: [jwt, alg-none, allowlist]
    question: |
      A verifier blocks the algorithm `"none"` with a case-sensitive string
      comparison. Why is this insufficient, and what is the RFC 8725-endorsed
      fix?
    options:
      - "It is fully sufficient; the alg header casing is normalized by the spec, so none can only ever appear as lowercase"
      - "Variants like nOnE/NONE bypass a denylist; use an allowlist of exact expected algorithms instead"
      - "The none algorithm is only exploitable under HS256 verification; the fix is simply to switch the endpoint to RS256"
      - "The header must be base64url-decoded a second time before the comparison, or the none check reads the wrong bytes"
    answer: 1
    explanation: |
      Denylisting a spelling of none misses case variants and is fragile. RFC 8725
      prescribes an algorithm allowlist: accept only the exact algorithm(s) you
      expect and reject everything else, which inherently blocks none in any
      casing.
    ref: "concepts.md#jwt-hardening-and-advanced-attacks"

  - id: api-security-and-hardening-069
    difficulty: expert
    tags: [jwt, type-confusion, audience]
    question: |
      An API accepts any validly-signed JWT from your identity provider as an
      access token, so a client presents its OIDC ID token instead. Which
      defenses prevent this token type confusion?
    options:
      - "Increase the access-token TTL and pack additional identity claims into the payload so the API can tell the types apart"
      - "Verify aud (and iss), require typ: at+jwt on access tokens (RFC 9068), and use separate keys/issuers for token types"
      - "Store every issued token in a Secure, HttpOnly cookie so cross-site scripts cannot read or swap the token type"
      - "Reject any token that carries an email claim, on the grounds that only ID tokens ever include the user's email"
    answer: 1
    explanation: |
      ID tokens and access tokens have different audiences and purposes. Checking
      aud/iss, requiring the at+jwt type for access tokens, and separating signing
      keys/issuers stops an ID token (or a token minted for another audience) from
      being accepted as an access token.
    ref: "concepts.md#jwt-hardening-and-advanced-attacks"

  - id: api-security-and-hardening-070
    difficulty: advanced
    tags: [jwt, hmac, brute-force]
    question: |
      Why is an HS256 JWT with the secret `"password123"` dangerous even if every
      claim is validated correctly?
    options:
      - "HS256 tokens are structurally unable to carry an exp claim, so such a token can never be expired by the verifier"
      - "A weak, low-entropy HMAC secret can be cracked offline from a single captured token, letting the attacker forge arbitrary valid tokens"
      - "HS256 transmits the payload as reversibly encrypted ciphertext that leaks in plaintext once the header is parsed"
      - "HS256 is explicitly disallowed by RFC 7519, so any conforming verifier must reject the token outright regardless"
    answer: 1
    explanation: |
      HS256 security rests entirely on the secret. A guessable/short secret can be
      brute-forced offline against one captured token; once recovered, the attacker
      signs any token they like. Use high-entropy secrets or asymmetric keys.
    ref: "concepts.md#jwt-hardening-and-advanced-attacks"

  - id: api-security-and-hardening-071
    difficulty: expert
    tags: [rate-limiting, algorithms, token-bucket]
    question: |
      A fixed-window rate limiter of 100 req/min is criticized for allowing short
      bursts far above the intended rate. What causes this, and which algorithm
      is the usual API choice that allows controlled bursts without the boundary
      problem?
    options:
      - "TLS session renegotiation resets the counter mid-window; switch to a leaky bucket to force a constant rate with no bursts at all"
      - "Clients can send 100 at the end of one window and 100 at the start of the next (a 2x burst across the boundary); token bucket allows bounded bursts up to the bucket size while capping the sustained rate"
      - "The Retry-After header tells clients exactly when the window resets, inviting the burst; removing the header eliminates the problem"
      - "Shared NAT egress collapses many clients into one counter; switching to strictly per-IP fixed windows removes the boundary burst"
    answer: 1
    explanation: |
      Fixed windows permit a near-2x burst across the window boundary. Token
      bucket refills at the target rate and lets requests spend accumulated tokens
      up to the bucket cap, permitting controlled bursts while bounding the
      sustained rate. Sliding window also smooths the boundary.
    ref: "concepts.md#rate-limiting-algorithms-and-headers"

  - id: api-security-and-hardening-072
    difficulty: intermediate
    tags: [rate-limiting, headers, spec-status]
    question: |
      Which statement about rate-limit response headers is accurate?
    options:
      - "Both the RateLimit-Limit/-Remaining/-Reset trio and the X-RateLimit-* family are finalized, interoperable RFC standards that every conformant server must emit"
      - "The only always-standard throttling signal is 429 with Retry-After; the RateLimit-*/X-RateLimit-* families are conventions/drafts, and the IETF draft has moved to structured fields like RateLimit-Policy and RateLimit"
      - "A 429 response must always be accompanied by a RateLimit-Reset header per RFC 9110, or the client is entitled to ignore the throttle"
      - "The X-RateLimit-* header family is explicitly mandated by RFC 9110 as the canonical way to advertise a client's remaining quota"
    answer: 1
    explanation: |
      429 Too Many Requests (RFC 6585) + Retry-After (RFC 9110) is the
      standardized signal.
      The RateLimit-*/X-RateLimit-* headers are de-facto/draft conventions; the
      IETF work moved to structured fields (RateLimit-Policy / RateLimit). All
      forms appear in the wild.
    ref: "concepts.md#rate-limiting-algorithms-and-headers"

  - id: api-security-and-hardening-073
    difficulty: advanced
    tags: [rate-limiting, dimensions, api6]
    question: |
      Per-IP throttling isn't stopping abuse of a signup flow. What is the most
      likely reason and the better dimension to limit on?
    options:
      - "Client IP addresses are encrypted inside the TLS handshake, so a per-IP counter can never read them; limit on the stable TLS session id instead"
      - "Attackers rotate IPs (and NAT/CDN collapse many users to one IP); limit per user/token/API key/tenant and per sensitive flow, combining dimensions"
      - "Per-IP rate limiting only counts correctly once the endpoint runs over HTTP/3 with QUIC connection ids; upgrade the transport and the abuse stops"
      - "The threshold is simply set too high; lower it to a stricter per-minute ceiling and the signup abuse disappears, since there is no dimension problem"
    answer: 1
    explanation: |
      Per-IP alone is weak: attackers rotate IPs and shared NAT/CDN egress
      collapses many users behind one IP. Limit on identity/tenant dimensions and
      per sensitive flow, which also addresses API6 business-flow abuse.
    ref: "concepts.md#rate-limiting-algorithms-and-headers"

  - id: api-security-and-hardening-074
    difficulty: expert
    tags: [graphql, batching, api4]
    question: |
      Your GraphQL endpoint has a 10-requests-per-minute rate limit, yet an
      attacker performs thousands of `login` attempts per minute through it.
      How, and which defense addresses it most directly?
    options:
      - "They exploit a permissive CORS policy to script the login mutation from another origin; add a strict origin allowlist and the amplification stops"
      - "They use query batching to pack many operations into one HTTP request, so the per-request limit counts it as one; disable batching or rate-limit per operation, not per request"
      - "They gzip-compress the request body so one small payload expands into thousands of login mutations on the server; disable request compression to stop it"
      - "They abuse HTTP/2 stream multiplexing to smuggle thousands of parallel login calls under one connection; downgrade the endpoint to HTTP/1.1 to cap them"
    answer: 1
    explanation: |
      Query batching lets one HTTP request carry many operations, so a
      per-request limiter undercounts and login attempts are amplified. Disable
      batching (or count/limit per operation), and add complexity/depth limits and
      persisted queries.
    ref: "concepts.md#graphql-resource-consumption-amplification"

  - id: api-security-and-hardening-075
    difficulty: advanced
    tags: [graphql, complexity, depth]
    question: |
      A GraphQL schema lets `author` return `posts`, and each `post` return its
      `author` again. A single query nests this dozens of levels deep and stalls
      the server. Which controls best mitigate this class of abuse?
    options:
      - "Enforcing TLS 1.3 with HSTS and certificate pinning on the GraphQL endpoint"
      - "Query depth limits plus complexity/cost analysis (and pagination caps, timeouts, persisted queries)"
      - "Returning 404 instead of 403 for the recursive field so its existence is hidden"
      - "A stricter CORS allowlist that only permits the first-party web origin to query"
    answer: 1
    explanation: |
      Recursive/deeply-nested queries fan out combinatorially. Depth limits cap
      nesting; cost/complexity analysis assigns a budget per query; pagination
      caps, timeouts, and persisted (allowlisted) queries round out the API4
      defense for GraphQL.
    ref: "concepts.md#graphql-resource-consumption-amplification"

  - id: api-security-and-hardening-076
    difficulty: advanced
    tags: [verb-tampering, bfla, methods]
    question: |
      A route enforces an authorization check on `GET /orders/9` but the same
      handler path leaves `PUT` and `DELETE /orders/9` unprotected. What class
      of flaw is this, and what is the correct principle?
    options:
      - "It is a CORS bug; declare Access-Control-Allow-Methods so the browser permits the PUT and DELETE preflight and the gap closes"
      - "It is verb tampering / BFLA; enforce authorization per (method, resource) pair, allowlist supported methods, and return 405 for the rest"
      - "It is a caching bug; the mutating verbs were served from cache, so add Cache-Control: no-store to force a fresh authorization check each time"
      - "It is fine as designed, because GET is the only sensitive method here and PUT or DELETE on an order can never expose data"
    answer: 1
    explanation: |
      Protecting one verb but not others is verb tampering, a BFLA hole.
      Authorization must be enforced per (method, resource); allowlist the methods
      a route supports and return 405 Method Not Allowed (with an Allow header) for
      the others.
    ref: "concepts.md#http-method-restriction-and-content-type-enforcement"

  - id: api-security-and-hardening-077
    difficulty: expert
    tags: [content-type, status-codes, rfc9110]
    question: |
      A client POSTs a body with `Content-Type: text/xml` to a JSON-only
      endpoint, and separately sends `Accept: application/xml` when only JSON can
      be produced. Which status codes are correct for each, per RFC 9110?
    options:
      - "400 Bad Request for both, since an unexpected media type and an unsatisfiable Accept are simply malformed-request errors"
      - "415 Unsupported Media Type for the unexpected request Content-Type; 406 Not Acceptable when no representation matches the client's Accept"
      - "406 Not Acceptable for the unexpected request body, and 415 Unsupported Media Type for the Accept-header mismatch"
      - "422 Unprocessable Content for both, since in each case the content is syntactically fine but semantically invalid to the server"
    answer: 1
    explanation: |
      A request media type the server won't accept is 415 Unsupported Media Type;
      inability to produce any representation the client's Accept allows is 406
      Not Acceptable. Also never reflect the request Accept into the response
      Content-Type.
    ref: "concepts.md#http-method-restriction-and-content-type-enforcement"

  - id: api-security-and-hardening-078
    difficulty: advanced
    tags: [logging, secrets, detection]
    question: |
      Which logging practice is correct for a hardened API?
    options:
      - "Log full bearer tokens, passwords, and API keys in the clear so support engineers can copy them and reproduce the exact failing request"
      - "Log authn/authz failures with a correlation id, subject, resource, and decision — while never logging tokens/passwords/keys and neutralizing untrusted input to prevent log injection"
      - "Disable logging of authorization decisions entirely to save disk space and keep log volume low, since allow/deny outcomes are rarely useful"
      - "Return the raw server log line, including the internal stack frame and query, to the client in the response body for full transparency"
    answer: 1
    explanation: |
      Detection needs rich, correlated authz/authn failure logs, but secrets must
      never be logged (a logged token is a leaked credential), and untrusted input
      must be neutralized to prevent log injection/line-splitting.
    ref: "concepts.md#logging-monitoring-and-detection"

  - id: api-security-and-hardening-079
    difficulty: expert
    tags: [detection, bola, enumeration]
    question: |
      An attacker with one valid token walks sequential object ids
      (`/invoices/1001`, `/1002`, `/1003`, ...). Even with an object-level check
      returning 404s, what monitoring signal should fire, and why does detection
      matter here?
    options:
      - "No monitoring signal is needed once the object-level check reliably returns 404, since a passing authorization check already neutralizes the probing"
      - "A velocity/enumeration alert on a single subject generating many 403/404s across sequential ids — because a passing authorization check still shouldn't hide an active enumeration/attack in progress"
      - "An alert that fires only when a 200 OK is returned, since only a successful data read constitutes a reportable security event worth surfacing"
      - "A TLS handshake failure alert, since the enumeration is only detectable at the transport layer when the attacker renegotiates the connection"
    answer: 1
    explanation: |
      Correct authorization stops data loss but the enumeration attempt itself is
      an attack signal. Alerting on a subject producing many sequential-id 403/404s
      surfaces reconnaissance and probing that a pure allow/deny check would
      silently absorb.
    ref: "concepts.md#logging-monitoring-and-detection"

  - id: api-security-and-hardening-080
    difficulty: expert
    tags: [authorization-architecture, rebac, bola]
    question: |
      A team keeps shipping BOLA bugs across 300 endpoints, each doing its own
      ad-hoc ownership check. Which structural approach best addresses the root
      cause?
    options:
      - "Switch every object id to a random version-4 UUID so the ownership check becomes unnecessary once ids are unguessable across all 300 endpoints"
      - "Centralize authorization in a policy engine / shared authz service (ABAC or ReBAC/Zanzibar-style) that is deny-by-default, so a new endpoint is unprotected only if explicitly opened, backed by automated per-endpoint authz tests"
      - "Put every endpoint behind a WAF with tuned rules that inspect the request path and body to block cross-tenant object access at the edge"
      - "Add aggressive per-client rate limiting to all 300 endpoints so an attacker can't iterate enough object ids to exploit the missing checks"
    answer: 1
    explanation: |
      Scattered per-handler checks are why the same bug recurs. Centralizing on a
      policy engine (ABAC/ReBAC) with deny-by-default and automated authz tests
      (owner/non-owner/unprivileged) makes correct authorization the default rather
      than something each endpoint must re-implement.
    ref: "concepts.md#authorization-architecture-rbac-abac-rebac"

  - id: api-security-and-hardening-081
    difficulty: advanced
    tags: [authorization-architecture, rbac, abac, rebac]
    question: |
      Which statement most accurately contrasts RBAC, ABAC, and ReBAC for solving
      object-level (BOLA) authorization?
    options:
      - "RBAC alone naturally expresses per-object ownership, since assigning each user a role scoped to their own records fully resolves BOLA"
      - "RBAC handles function/role (BFLA) well but roles alone can't express object ownership; ABAC (subject/resource attributes) and ReBAC (relationship graph, e.g., Zanzibar) are better fits for object-level decisions"
      - "ABAC and ReBAC are the same underlying model with different names, both deciding purely from static attribute comparisons at request time"
      - "ReBAC can only express function-level (role) authorization and is structurally unable to represent an ownership relationship between subject and object"
    answer: 1
    explanation: |
      RBAC maps roles to permissions — good for function-level authorization but
      it can't express "this subject owns this object." ABAC decides from
      attributes (e.g., tenant match) and ReBAC from a relationship graph (owner
      of doc), both suited to object-level/BOLA decisions.
    ref: "concepts.md#authorization-architecture-rbac-abac-rebac"

  - id: api-security-and-hardening-082
    difficulty: advanced
    tags: [gateway, waf, bola, bopla]
    question: |
      Why can a well-configured API gateway or WAF enforce authentication and
      rate limiting but NOT stop BOLA and BOPLA?
    options:
      - "Gateways can't parse JSON request bodies, so they never see the object id or fields needed to make an object-level authorization decision"
      - "Object-level and field-level authorization require application-domain knowledge (who owns this object, which fields this subject may see/set) that the edge doesn't have; it sees only a well-formed, authenticated request"
      - "WAFs only inspect outbound responses and never the inbound request path or body, so they physically cannot evaluate an object reference before it is served"
      - "BOLA and BOPLA only occur over HTTP/1.1 keep-alive connections, which a modern HTTP/2 gateway terminates and therefore neutralizes at the edge"
    answer: 1
    explanation: |
      A gateway sees an authenticated, well-formed request to /invoices/1002 and
      has no way to know 1002 isn't the caller's, or which fields the caller may
      set. Ownership/field policy is app-domain knowledge, so BOLA/BOPLA must be
      enforced in the code path that loads the object.
    ref: "concepts.md#api-gateway-and-waf-what-they-can-and-cant-enforce"

  - id: api-security-and-hardening-083
    difficulty: expert
    tags: [ssrf, redirect, imds, api7]
    question: |
      An SSRF-protected endpoint validates the submitted host against an
      allowlist and rejects private IPs, but an attacker still reaches the cloud
      metadata service. Which combination explains the bypass and the AWS-specific
      hardening?
    options:
      - "The host allowlist was configured too strictly and blocked a legitimate CDN hop; loosening it to permit the redirect chain closes the bypass"
      - "An allowlisted host 302-redirects to 169.254.169.254 and the fetcher follows it (and/or DNS rebinds at connection time); block/limit redirects and re-validate the resolved IP at connect time, and require IMDSv2 (session token via PUT + hop limit) instead of IMDSv1"
      - "TLS was disabled on the fetch, letting an on-path attacker rewrite the destination to the metadata service; enabling TLS verification stops it"
      - "The metadata endpoint is reachable only over an IPv6 link-local address that the allowlist's IPv4-only private-range filter never inspected"
    answer: 1
    explanation: |
      Allowed hosts can 302-redirect to link-local metadata, and DNS can rebind
      between check and connect. Defenses: don't blindly follow redirects,
      re-validate the resolved IP at connection time, and use IMDSv2 (PUT session
      token + hop limit) which blocks simple SSRF that IMDSv1 permits.
    ref: "concepts.md#api7-server-side-request-forgery"

  - id: api-security-and-hardening-084
    difficulty: expert
    tags: [csrf, double-submit, samesite]
    question: |
      A team relies on the double-submit-cookie CSRF pattern and assumes
      `SameSite=Lax` (the browser default) covers the rest. Which weakness should
      concern them?
    options:
      - "The double-submit-cookie pattern is cryptographically unbreakable once combined with SameSite=Lax, so there is no residual weakness to worry about"
      - "A subdomain or same-site attacker (e.g., XSS on a sibling subdomain) can inject/overwrite the CSRF cookie so both copies match, and SameSite=Lax still permits top-level GET navigations, so GET state changes and same-site attackers aren't fully covered"
      - "SameSite=Lax blocks all cookies including first-party ones on same-origin navigations, so the pattern actually breaks legitimate logged-in sessions"
      - "The double-submit-cookie pattern only works when TLS is disabled, because the browser refuses to echo the CSRF cookie back over an encrypted channel"
    answer: 1
    explanation: |
      Double-submit trusts that the attacker can't set the cookie, but a
      subdomain/same-site attacker can inject or overwrite it so both values match.
      SameSite=Lax also allows top-level GET navigations, so GET-based state changes
      and same-site attackers remain risks; prefer a signed synchronizer token and
      never mutate state on GET.
    ref: "concepts.md#csrf-for-cookie-authenticated-apis"

  - id: api-security-and-hardening-085
    difficulty: expert
    tags: [cors, reflection, preflight]
    question: |
      Which statement about CORS is correct at a senior level?
    options:
      - "A CORS preflight is an authentication boundary an attacker's client must pass"
      - "Access-Control-Allow-Headers and -Methods can be safely reflected from the request since the browser enforces them"
      - "Reflecting Access-Control-Allow-Headers/-Methods blindly is as dangerous as reflecting Origin, and preflight is not an auth boundary — a non-browser attacker client skips it entirely"
      - "CORS applies equally to browser and non-browser clients, so a curl or server-to-server caller is blocked by the same preflight the browser enforces"
    answer: 2
    explanation: |
      CORS is browser-enforced only; a non-browser client ignores preflight, so it
      is never an authorization/authentication boundary. Reflecting requested
      headers/methods back blindly is as unsafe as reflecting Origin — maintain
      strict allowlists.
    ref: "concepts.md#cors-misconfiguration"

  - id: api-security-and-hardening-086
    difficulty: advanced
    tags: [bola, nested-objects, claims]
    question: |
      A developer fixed BOLA on the path id (`/invoices/{id}`) but the endpoint
      also accepts a `customerId` in the JSON body and a tenant id inside the JWT.
      Why is the job not necessarily done?
    options:
      - "Only path ids can be attacked; ids supplied in the JSON body and claims carried inside a signed JWT are inherently trusted and need no ownership check"
      - "BOLA applies to any object reference the caller can influence — ids in the body, query, or headers, and to nested/related objects — so each must be authorized against the subject, not just the path id"
      - "JWT claims such as the tenant id can never be attacker-influenced once the signature verifies, so any object they reference is safe to load unchecked"
      - "The fix is complete once the path id is checked, because REST semantics guarantee the path is the only resource identifier the handler acts on"
    answer: 1
    explanation: |
      BOLA isn't limited to the path. Object references in the body, query string,
      or even chosen among token claims, and references to nested/related objects,
      all need ownership checks. Authorize every object the request names against
      the authenticated subject.
    ref: "concepts.md#api1-broken-object-level-authorization"

  - id: api-security-and-hardening-087
    difficulty: advanced
    tags: [openapi, inventory, api9]
    question: |
      How does treating an OpenAPI spec as a security control help, and which
      risks does it most directly support?
    options:
      - "It replaces authentication entirely, because a strict request/response schema proves the caller's identity without any token or credential"
      - "It enables schema/contract validation at the edge, negative/contract testing, and detection of shadow/zombie endpoints that don't match the spec — supporting input validation and Improper Inventory Management (API9)"
      - "It encrypts requests in transit, because a published OpenAPI contract negotiates the TLS parameters the client and server use on each call"
      - "It guarantees BOLA cannot occur, since declaring each object id in the schema forces the framework to auto-check ownership on every request"
    answer: 1
    explanation: |
      An authoritative OpenAPI contract lets you validate requests/responses at
      the edge, run negative/contract tests, and flag endpoints not in the spec
      (shadow/zombie APIs), directly supporting input validation and API9 inventory
      management. It does not by itself provide authn or stop BOLA.
    ref: "concepts.md#api9-improper-inventory-management"

  - id: api-security-and-hardening-088
    difficulty: intermediate
    tags: [jwt, bcp, rfc8725]
    question: |
      Which RFC is the authoritative "how to use JWT safely" document that
      prescribes defenses like algorithm allowlisting and full claim validation,
      as opposed to merely defining the JWT format?
    options:
      - "RFC 7519, which defines the JWT format itself — the structure of the header, payload, and signature — but not the operational hardening practices"
      - "RFC 8725, JSON Web Token Best Current Practices"
      - "RFC 6749, OAuth 2.0, which specifies the authorization framework and token-issuance grants rather than how to validate a JWT safely"
      - "RFC 9110, HTTP Semantics, which standardizes methods and status codes and has nothing to say about JWT algorithm or claim validation"
    answer: 1
    explanation: |
      RFC 7519 defines the JWT format; RFC 8725 (JWT BCP) is the authoritative
      guidance on safe use — algorithm allowlists (not denylists), validating
      critical claims, and not trusting the token to select its own verification.
    ref: "concepts.md#jwt-hardening-and-advanced-attacks"
