topic: "REST vs GraphQL vs gRPC"
domain: rest-api-design
topic_slug: rest-vs-graphql-vs-grpc
version: 1
questions:
  - id: rest-vs-graphql-vs-grpc-001
    difficulty: beginner
    tags: [paradigms, overview]
    question: |
      Which statement best describes the fundamental style of each paradigm?
    options:
      - "REST is resource-oriented, GraphQL is a query language, gRPC is an RPC framework"
      - "REST is an RPC framework, GraphQL is resource-oriented, gRPC is a query language"
      - "All three are query languages with different syntaxes"
      - "REST and gRPC are query languages; GraphQL is resource-oriented"
    answer: 0
    explanation: |
      REST models the domain as resources addressed by URLs and acted on with HTTP methods.
      GraphQL is a query language and runtime where the client describes the field tree it
      wants. gRPC is a contract-first RPC framework where you call remote methods.
    ref: "concepts.md#the-three-paradigms-at-a-glance"

  - id: rest-vs-graphql-vs-grpc-002
    difficulty: beginner
    tags: [transport, protobuf]
    question: |
      What transport and payload format does gRPC use by default?
    options:
      - "HTTP/1.1 with JSON payloads"
      - "HTTP/2 with JSON payloads"
      - "WebSocket with XML payloads"
      - "HTTP/2 with Protobuf binary payloads"
    answer: 3
    explanation: |
      gRPC requires HTTP/2 as its transport and uses Protocol Buffers (Protobuf) binary
      framing by default. HTTP/2 multiplexing and binary framing are what enable its low
      latency and native streaming.
    ref: "concepts.md#grpc-http2-protobuf-and-strong-contracts"

  - id: rest-vs-graphql-vs-grpc-003
    difficulty: beginner
    tags: [graphql, endpoint]
    question: |
      How many endpoints does a typical GraphQL API expose?
    options:
      - "One endpoint per resource type, like REST"
      - "One per query and one per mutation"
      - "A single endpoint (usually POST /graphql)"
      - "One endpoint per field in the schema"
    answer: 2
    explanation: |
      GraphQL exposes a single endpoint (conventionally POST /graphql). Rather than a URL
      per resource, the query body itself selects the data the client wants.
    ref: "concepts.md#graphql-single-endpoint-and-schema-typing"

  - id: rest-vs-graphql-vs-grpc-004
    difficulty: beginner
    tags: [rest, caching, strengths]
    question: |
      Which is REST's biggest structural advantage over GraphQL and gRPC?
    options:
      - "Binary payloads that are smaller than JSON"
      - "Mandatory strongly typed contracts"
      - "Native bidirectional streaming"
      - "Excellent HTTP caching (browser, CDN, proxy) for GET requests"
    answer: 3
    explanation: |
      Because GET is safe and cacheable, REST responses cache at the browser, CDN, and
      reverse proxy using Cache-Control, ETag, and conditional requests. GraphQL (POST to
      one URL) and gRPC (binary HTTP/2) cannot use that shared HTTP cache without extra work.
    ref: "concepts.md#rest-strengths-and-constraints"

  - id: rest-vs-graphql-vs-grpc-005
    difficulty: beginner
    tags: [over-fetching, definitions]
    question: |
      What is "over-fetching"?
    options:
      - "An endpoint returns more data than the client actually needs"
      - "The client must make several requests to gather related data"
      - "The server rejects a query because it is too deeply nested"
      - "A cache returns stale data past its expiry"
    answer: 0
    explanation: |
      Over-fetching is when a fixed endpoint returns more fields than the client needs
      (e.g. a 30-field user object for a list view that only needs name and avatar).
      Under-fetching is the opposite: needing multiple calls to gather related data.
    ref: "concepts.md#over-fetching-and-under-fetching"

  - id: rest-vs-graphql-vs-grpc-006
    difficulty: beginner
    tags: [under-fetching, definitions]
    question: |
      A client renders a profile by calling /users/42, then /users/42/orders, then
      /orders/{id}/items. This pattern is an example of what?
    options:
      - "Under-fetching (client-side request waterfall)"
      - "Over-fetching"
      - "Query cost explosion"
      - "Content negotiation"
    answer: 0
    explanation: |
      Under-fetching means one endpoint does not return enough, forcing the client to make
      additional round trips to gather related resources — a request waterfall. GraphQL's
      pitch is to collapse this into a single query.
    ref: "concepts.md#over-fetching-and-under-fetching"

  - id: rest-vs-graphql-vs-grpc-007
    difficulty: intermediate
    tags: [graphql, over-fetching, trade-offs]
    question: |
      GraphQL eliminates over- and under-fetching. What does it give up or complicate in
      exchange?
    options:
      - "It loses the ability to return JSON"
      - "It can no longer define types or a schema"
      - "It makes HTTP caching harder and introduces query-cost and server-side N+1 concerns"
      - "It requires binary Protobuf payloads"
    answer: 2
    explanation: |
      GraphQL's flexibility moves cost around: client-defined queries make HTTP/CDN caching
      hard (reads go over POST to one URL), make query cost unpredictable, and open the
      server-side N+1 problem. It still uses JSON and has a mandatory schema.
    ref: "concepts.md#over-fetching-and-under-fetching"

  - id: rest-vs-graphql-vs-grpc-008
    difficulty: intermediate
    tags: [rest, mitigations, over-fetching]
    question: |
      Which REST technique is a partial mitigation for over-fetching?
    options:
      - "Sparse fieldsets, e.g. GET /users/42?fields=name,avatar"
      - "Returning HTTP 200 for all errors"
      - "Using Protobuf instead of JSON"
      - "Sending the query in a POST body"
    answer: 0
    explanation: |
      REST APIs can offer sparse fieldsets (?fields=), expansion (?expand=/?include=), or
      compound documents (JSON:API) to let clients trim or expand responses. These work but
      are bespoke per API rather than a uniform protocol feature.
    ref: "concepts.md#over-fetching-and-under-fetching"

  - id: rest-vs-graphql-vs-grpc-009
    difficulty: intermediate
    tags: [graphql, schema, sdl]
    question: |
      In GraphQL, what shapes the structure of the response body?
    options:
      - "The server decides based on the URL path"
      - "The client's query — the response mirrors the requested field tree exactly"
      - "The Accept header's media type"
      - "The Protobuf message definition"
    answer: 1
    explanation: |
      In GraphQL the client sends a query describing exactly the fields it wants, and the
      server returns exactly that shape — no more, no less. This is the inverse of REST,
      where the server defines the response shape.
    ref: "concepts.md#graphql-single-endpoint-and-schema-typing"

  - id: rest-vs-graphql-vs-grpc-010
    difficulty: intermediate
    tags: [graphql, errors, status-codes]
    question: |
      A GraphQL query for a user fails because the user does not exist, but the request was
      well-formed. What HTTP status is typically returned?
    options:
      - "404 Not Found"
      - "400 Bad Request"
      - "500 Internal Server Error"
      - "200 OK, with the problem in a top-level errors array"
    answer: 3
    explanation: |
      GraphQL typically returns 200 OK even for field-level errors, placing them in a
      top-level errors array alongside partial data. Transport-level 4xx/5xx is reserved
      for malformed requests or server crashes. This breaks naive HTTP-status alerting.
    ref: "concepts.md#graphql-single-endpoint-and-schema-typing"

  - id: rest-vs-graphql-vs-grpc-011
    difficulty: intermediate
    tags: [graphql, operations]
    question: |
      Which set correctly lists GraphQL's three root operation types?
    options:
      - "GET, POST, DELETE"
      - "Read, Write, Stream"
      - "Query, Mutation, Subscription"
      - "Unary, Server-stream, Bidi"
    answer: 2
    explanation: |
      GraphQL operations are Query (reads), Mutation (writes, executed serially), and
      Subscription (streams over a persistent transport, usually WebSocket). Unary/streaming
      are gRPC call types, not GraphQL operations.
    ref: "concepts.md#graphql-single-endpoint-and-schema-typing"

  - id: rest-vs-graphql-vs-grpc-012
    difficulty: intermediate
    tags: [graphql, n-plus-one]
    question: |
      What is the server-side N+1 problem in GraphQL?
    options:
      - "A query nested N+1 levels deep is automatically rejected"
      - "The server returns N+1 copies of the same object"
      - "Resolving a related field for each item in a list fires one DB query per item"
      - "The client must make N+1 HTTP requests"
    answer: 2
    explanation: |
      A query over a list where each item resolves a related field can trigger one database
      query per item (1 for the list + N for the children). It is the same waterfall REST
      clients hit, but moved into the server's data layer.
    ref: "concepts.md#graphql-n1-problem-and-query-cost"

  - id: rest-vs-graphql-vs-grpc-013
    difficulty: intermediate
    tags: [graphql, n-plus-one, dataloader]
    question: |
      What is the standard fix for the GraphQL server-side N+1 problem?
    options:
      - "Switch the endpoint from POST to GET"
      - "A DataLoader-style batch-and-cache pattern that collects keys and issues one batched query"
      - "Increase the query depth limit"
      - "Return HTTP 200 for all responses"
    answer: 1
    explanation: |
      A DataLoader collects all keys requested within a tick, issues one batched query
      (WHERE id IN (...)), and caches per request. It is not automatic — resolver authors
      must wire it up.
    ref: "concepts.md#graphql-n1-problem-and-query-cost"

  - id: rest-vs-graphql-vs-grpc-014
    difficulty: advanced
    tags: [graphql, query-cost, security]
    question: |
      Why is an unbounded query a denial-of-service concern that is specific to GraphQL and
      largely absent in REST?
    options:
      - "GraphQL responses are binary and cannot be inspected"
      - "REST endpoints have fixed, server-defined shapes, while GraphQL lets clients compose arbitrary deeply nested queries"
      - "REST uses HTTP/2 which has no flow control"
      - "GraphQL cannot use TLS"
    answer: 1
    explanation: |
      Because GraphQL clients compose arbitrary queries, a client can request deeply nested
      or hugely wide data. A REST endpoint returns a fixed shape, so it does not face this
      per-query cost explosion. Mitigations include depth limiting, cost analysis, and
      persisted-query allowlists.
    ref: "concepts.md#graphql-n1-problem-and-query-cost"

  - id: rest-vs-graphql-vs-grpc-015
    difficulty: advanced
    tags: [graphql, query-cost, mitigations]
    question: |
      Which of these is NOT a standard technique for bounding GraphQL query cost?
    options:
      - "Query depth limiting"
      - "Query complexity / cost analysis with a budget"
      - "Persisted queries / allowlisting query hashes"
      - "Returning all responses as HTTP 200"
    answer: 3
    explanation: |
      Returning 200 is unrelated to bounding cost. Depth limiting, complexity/cost analysis,
      persisted-query allowlists, timeouts, and cost-based rate limiting are the real
      controls against expensive or malicious queries.
    ref: "concepts.md#graphql-n1-problem-and-query-cost"

  - id: rest-vs-graphql-vs-grpc-016
    difficulty: intermediate
    tags: [graphql, caching]
    question: |
      Why is shared HTTP/CDN caching largely unavailable for typical GraphQL queries?
    options:
      - "GraphQL responses are always encrypted end-to-end"
      - "GraphQL forbids the use of any cache"
      - "CDNs cannot parse JSON"
      - "Requests are POST to a single URL, and shared caches key on URL + method and won't cache POST bodies"
    answer: 3
    explanation: |
      GraphQL reads go over POST /graphql with the query in the body. Shared HTTP caches key
      on URL + method and will not cache POST bodies, so the CDN-level caching REST enjoys is
      largely unavailable without workarounds.
    ref: "concepts.md#graphql-caching-challenges"

  - id: rest-vs-graphql-vs-grpc-017
    difficulty: advanced
    tags: [graphql, caching, persisted-queries]
    question: |
      Which technique lets a GraphQL request become a cacheable GET so a CDN can cache it?
    options:
      - "Automatic Persisted Queries (send a query hash as a URL param via GET)"
      - "Switching payloads to Protobuf"
      - "Adding an ETag to the POST body"
      - "Using gRPC-Web as a proxy"
    answer: 0
    explanation: |
      With persisted queries, the client sends a registered query hash as a URL parameter on
      a GET request, making it cacheable at the CDN. The main alternative caching model is a
      client-side normalized cache keyed by object ID (Apollo/Relay), which is per-client.
    ref: "concepts.md#graphql-caching-challenges"

  - id: rest-vs-graphql-vs-grpc-018
    difficulty: intermediate
    tags: [graphql, caching, client-cache]
    question: |
      What is the primary caching model that GraphQL clients like Apollo and Relay rely on?
    options:
      - "Edge caching keyed by the full query text"
      - "Reverse-proxy caching of POST bodies"
      - "A client-side normalized cache keyed by global object ID"
      - "gRPC trailer-based caching"
    answer: 2
    explanation: |
      GraphQL clients maintain a normalized store that caches objects by global ID rather
      than caching whole responses. It works well but is per-client, not a shared or edge
      cache.
    ref: "concepts.md#graphql-caching-challenges"

  - id: rest-vs-graphql-vs-grpc-019
    difficulty: intermediate
    tags: [grpc, protobuf, contracts]
    question: |
      In a Protobuf message, what uniquely identifies a field on the wire?
    options:
      - "The field's name"
      - "The field's declared type"
      - "The field's number (tag)"
      - "The order fields appear in the .proto file"
    answer: 2
    explanation: |
      Protobuf uses field numbers (tags), not names, to identify fields on the wire. This is
      what makes the binary encoding compact and is why you must never reuse or change an
      existing field's number.
    ref: "concepts.md#grpc-http2-protobuf-and-strong-contracts"

  - id: rest-vs-graphql-vs-grpc-020
    difficulty: intermediate
    tags: [grpc, codegen, contracts]
    question: |
      What gives gRPC its strong end-to-end type safety?
    options:
      - "JSON Schema validation at runtime"
      - "The Accept header negotiates types"
      - "protoc generates typed client and server stubs from the shared .proto contract"
      - "GraphQL introspection"
    answer: 2
    explanation: |
      protoc generates typed client and server stubs in many languages from the same .proto
      file, so both ends share the contract and mismatches surface at compile/codegen time
      rather than as runtime JSON surprises.
    ref: "concepts.md#grpc-http2-protobuf-and-strong-contracts"

  - id: rest-vs-graphql-vs-grpc-021
    difficulty: intermediate
    tags: [grpc, debuggability, trade-offs]
    question: |
      Which is a genuine downside of gRPC's Protobuf binary payloads?
    options:
      - "They are larger than equivalent JSON"
      - "They cannot be sent over HTTP/2"
      - "They are not human-readable, so you need tools like grpcurl to inspect them"
      - "They cannot represent nested messages"
    answer: 2
    explanation: |
      Protobuf payloads are smaller and faster to (de)serialize than JSON, but they are
      binary and not human-readable, hurting debuggability. You need tooling like grpcurl or
      server reflection to inspect them.
    ref: "concepts.md#grpc-http2-protobuf-and-strong-contracts"

  - id: rest-vs-graphql-vs-grpc-022
    difficulty: advanced
    tags: [grpc, status, deadlines]
    question: |
      How does gRPC convey call outcome and where are timeouts handled?
    options:
      - "It reuses HTTP status codes; timeouts are client-only"
      - "It has its own status codes carried in trailers, and deadlines/timeouts are first-class and propagate across calls"
      - "It returns errors only in a GraphQL-style errors array"
      - "It uses RFC 9457 Problem Details JSON"
    answer: 1
    explanation: |
      gRPC has its own status codes (OK, NOT_FOUND, INVALID_ARGUMENT, UNAVAILABLE,
      DEADLINE_EXCEEDED, ...) carried in trailers rather than HTTP status. Deadlines are
      first-class and propagate across chained calls.
    ref: "concepts.md#grpc-http2-protobuf-and-strong-contracts"

  - id: rest-vs-graphql-vs-grpc-023
    difficulty: beginner
    tags: [grpc, streaming]
    question: |
      Which of the following is one of gRPC's four call types?
    options:
      - "Bidirectional streaming"
      - "Long-polling"
      - "Content negotiation"
      - "Conditional GET"
    answer: 0
    explanation: |
      gRPC supports four call types: unary, server streaming, client streaming, and
      bidirectional streaming — all built on HTTP/2 streams. Long-polling and conditional
      GET are REST/HTTP techniques.
    ref: "concepts.md#grpc-streaming-modes"

  - id: rest-vs-graphql-vs-grpc-024
    difficulty: intermediate
    tags: [grpc, streaming]
    question: |
      A client uploads many chunks and receives a single summary response at the end. Which
      gRPC streaming mode is this?
    options:
      - "Server streaming"
      - "Unary"
      - "Client streaming"
      - "Bidirectional streaming"
    answer: 2
    explanation: |
      Client streaming = a stream of messages from the client, one response from the server
      (e.g. uploading chunks, getting one summary). Server streaming is the inverse; bidi is
      both directions interleaved.
    ref: "concepts.md#grpc-streaming-modes"

  - id: rest-vs-graphql-vs-grpc-025
    difficulty: intermediate
    tags: [grpc, streaming, http2]
    question: |
      What makes gRPC's streaming first-class compared to REST?
    options:
      - "It uses XML instead of JSON"
      - "It is built on HTTP/2 streams that multiplex over a single connection with flow control"
      - "It opens a new TCP connection per message"
      - "It relies on server-sent events"
    answer: 1
    explanation: |
      gRPC streaming is native HTTP/2: streams multiplex over one connection with flow
      control. REST must approximate streaming with SSE, chunked transfer, long-polling, or
      a separate WebSocket protocol.
    ref: "concepts.md#grpc-streaming-modes"

  - id: rest-vs-graphql-vs-grpc-026
    difficulty: intermediate
    tags: [grpc, browser, grpc-web]
    question: |
      Why can't browser JavaScript call a native gRPC service directly?
    options:
      - "Browsers do not support TLS"
      - "The fetch/XHR APIs do not expose the low-level HTTP/2 framing (trailers, request-stream control) gRPC needs"
      - "Protobuf is banned in browsers"
      - "gRPC only works over UDP"
    answer: 1
    explanation: |
      Browser HTTP APIs (fetch/XHR) don't expose the low-level HTTP/2 framing gRPC requires,
      such as trailers and full control of the request stream. You need gRPC-Web plus a proxy
      to bridge browser requests to a gRPC backend.
    ref: "concepts.md#grpc-browser-limits-and-grpc-web"

  - id: rest-vs-graphql-vs-grpc-027
    difficulty: advanced
    tags: [grpc-web, streaming, limits]
    question: |
      Which streaming modes does gRPC-Web generally NOT support?
    options:
      - "Unary calls"
      - "Server streaming"
      - "Client streaming and bidirectional streaming"
      - "All streaming modes are fully supported"
    answer: 2
    explanation: |
      gRPC-Web generally supports unary and server-streaming but not client-streaming or
      bidirectional streaming, due to browser transport constraints. This is one reason gRPC
      is reserved for service-to-service traffic.
    ref: "concepts.md#grpc-browser-limits-and-grpc-web"

  - id: rest-vs-graphql-vs-grpc-028
    difficulty: intermediate
    tags: [grpc, grpc-web, proxy]
    question: |
      What component is required to expose a gRPC backend to browsers via gRPC-Web?
    options:
      - "A proxy (e.g. Envoy) that translates between browser HTTP requests and backend gRPC"
      - "A GraphQL schema"
      - "A CDN edge worker only"
      - "Nothing — browsers speak gRPC-Web to the backend directly with no translation"
    answer: 0
    explanation: |
      gRPC-Web needs a proxy such as Envoy (or an in-process filter) to translate between
      browser-friendly HTTP requests and the backend gRPC protocol, plus generated JS
      clients. This extra hop is part of why gRPC stays internal.
    ref: "concepts.md#grpc-browser-limits-and-grpc-web"

  - id: rest-vs-graphql-vs-grpc-029
    difficulty: intermediate
    tags: [contracts, tooling, comparison]
    question: |
      Which paradigm makes a machine-readable contract OPTIONAL rather than mandatory?
    options:
      - "GraphQL (schema is optional)"
      - "gRPC (.proto is optional)"
      - "REST (OpenAPI/JSON Schema are layered on but not enforced by the protocol)"
      - "All three mandate a contract"
    answer: 2
    explanation: |
      REST's contract is optional and additive — OpenAPI 3.1 / JSON Schema describe it but
      nothing forces the server to obey them. GraphQL (SDL schema) and gRPC (.proto) both
      mandate a contract.
    ref: "concepts.md#schema-typing-and-tooling-compared"

  - id: rest-vs-graphql-vs-grpc-030
    difficulty: intermediate
    tags: [graphql, introspection, tooling]
    question: |
      What feature makes a GraphQL API self-documenting?
    options:
      - "Server reflection over HTTP/2"
      - "The Allow response header"
      - "Protobuf reflection"
      - "Introspection — clients can query the schema itself"
    answer: 3
    explanation: |
      GraphQL introspection lets clients query the schema itself, which powers tooling like
      GraphiQL and auto-generated typed clients. gRPC's analog is server reflection over the
      .proto; REST's is OpenAPI docs.
    ref: "concepts.md#schema-typing-and-tooling-compared"

  - id: rest-vs-graphql-vs-grpc-031
    difficulty: intermediate
    tags: [openapi, rest, tooling]
    question: |
      What is the de facto description format for REST APIs, and what does it align with?
    options:
      - "WSDL, aligned with SOAP"
      - "OpenAPI 3.1, aligned with JSON Schema 2020-12"
      - "Protobuf, aligned with HTTP/2"
      - "SDL, aligned with introspection"
    answer: 1
    explanation: |
      OpenAPI 3.1 is the de facto REST description format and is aligned with JSON Schema
      2020-12. It powers docs, mocks, and client codegen, though the protocol does not force
      the server to conform to it.
    ref: "concepts.md#schema-typing-and-tooling-compared"

  - id: rest-vs-graphql-vs-grpc-032
    difficulty: beginner
    tags: [streaming, rest, comparison]
    question: |
      Which technique does REST use to approximate server-to-client streaming?
    options:
      - "Protobuf trailers"
      - "GraphQL subscriptions"
      - "Server-Sent Events (SSE) or chunked transfer encoding"
      - "Bidirectional HTTP/2 streams natively"
    answer: 2
    explanation: |
      REST has no native streaming; it approximates server push with Server-Sent Events,
      chunked transfer encoding, or long-polling, and uses a separate WebSocket protocol for
      bidirectional communication.
    ref: "concepts.md#streaming-support-compared"

  - id: rest-vs-graphql-vs-grpc-033
    difficulty: intermediate
    tags: [graphql, subscriptions, streaming]
    question: |
      How does GraphQL provide server-to-client push?
    options:
      - "Subscriptions, typically over WebSocket (or SSE)"
      - "Bidirectional Protobuf streams"
      - "Conditional GET with ETags"
      - "Client streaming RPCs"
    answer: 0
    explanation: |
      GraphQL Subscriptions push data server-to-client, usually over WebSocket (or SSE via
      graphql-sse). Newer @defer/@stream directives allow incremental delivery of parts of a
      single response.
    ref: "concepts.md#streaming-support-compared"

  - id: rest-vs-graphql-vs-grpc-034
    difficulty: intermediate
    tags: [streaming, comparison]
    question: |
      For high-throughput BIDIRECTIONAL streaming between two internal services, which
      paradigm is the natural fit?
    options:
      - "REST via long-polling"
      - "GraphQL subscriptions"
      - "gRPC (first-class bidirectional streaming over HTTP/2)"
      - "REST via conditional requests"
    answer: 2
    explanation: |
      gRPC offers first-class server, client, and bidirectional streaming over HTTP/2 — the
      richest of the three. GraphQL subscriptions are server-push only; REST streaming is
      bolted on.
    ref: "concepts.md#streaming-support-compared"

  - id: rest-vs-graphql-vs-grpc-035
    difficulty: intermediate
    tags: [versioning, rest]
    question: |
      Which is a common REST versioning approach?
    options:
      - "Never version; rely on field numbers"
      - "Add fields and mark old ones @deprecated only"
      - "reserve removed field numbers"
      - "URL path versions (/v1, /v2) or media-type versions (Accept: application/vnd.example.v2+json)"
    answer: 3
    explanation: |
      REST commonly uses explicit versions via URL path or media-type/header, while evolving
      additively. @deprecated is GraphQL's approach; reserved field numbers are Protobuf's.
    ref: "concepts.md#versioning-approaches-per-paradigm"

  - id: rest-vs-graphql-vs-grpc-036
    difficulty: intermediate
    tags: [versioning, graphql, deprecated]
    question: |
      What does the GraphQL specification recommend regarding versioning?
    options:
      - "Bump a major version for every schema change"
      - "Avoid versioning; evolve the schema continuously and mark old fields @deprecated"
      - "Use URL path versions like /graphql/v2"
      - "Reuse field numbers when types change"
    answer: 1
    explanation: |
      GraphQL guidance is to avoid versioning: add new fields/types freely and @deprecated
      old ones (with a reason). Because clients request specific fields, additions never
      break anyone, and usage of a deprecated field can be measured before removal.
    ref: "concepts.md#versioning-approaches-per-paradigm"

  - id: rest-vs-graphql-vs-grpc-037
    difficulty: advanced
    tags: [versioning, protobuf, gotcha]
    question: |
      Which Protobuf evolution rule prevents silently corrupting data for peers on the old
      schema?
    options:
      - "Always rename fields when their meaning changes"
      - "Never reuse or change an existing field's number; reserve removed numbers"
      - "Send a Cache-Control header with every message"
      - "Return HTTP 200 for all RPCs"
    answer: 1
    explanation: |
      Field numbers are the wire identity in Protobuf. You must never reuse or renumber an
      existing field, and you should reserve removed field numbers/names to prevent
      accidental reuse. Field names may change; numbers must not.
    ref: "concepts.md#versioning-approaches-per-paradigm"

  - id: rest-vs-graphql-vs-grpc-038
    difficulty: intermediate
    tags: [protobuf, forward-compatibility]
    question: |
      Why can an old gRPC client safely receive a message from a newer server that added a
      field?
    options:
      - "The server strips new fields before sending"
      - "The client automatically regenerates its stubs at runtime"
      - "Old clients ignore unknown fields carrying new numbers"
      - "Protobuf rejects the message and retries"
    answer: 2
    explanation: |
      Protobuf is designed for compatible evolution: new fields get new numbers, and clients
      built on the old schema simply ignore fields with unknown numbers. This keeps old and
      new messages interoperable without a new service version.
    ref: "concepts.md#versioning-approaches-per-paradigm"

  - id: rest-vs-graphql-vs-grpc-039
    difficulty: intermediate
    tags: [decision, choosing, rest]
    question: |
      A read-heavy, public content API needs the widest possible reach and cheap edge
      caching. Which paradigm fits best?
    options:
      - "gRPC, for its binary payloads"
      - "GraphQL, to avoid over-fetching"
      - "REST, for ubiquity plus free CDN/HTTP caching of GET responses"
      - "gRPC-Web through a proxy"
    answer: 2
    explanation: |
      Read-heavy, public, cacheable content is REST's sweet spot: every client speaks it and
      GET responses cache at the browser/CDN/proxy for free. gRPC isn't browser-native and
      GraphQL POST queries don't leverage shared HTTP caches.
    ref: "concepts.md#choosing-between-rest-graphql-and-grpc"

  - id: rest-vs-graphql-vs-grpc-040
    difficulty: intermediate
    tags: [decision, choosing, grpc]
    question: |
      Two internal microservices you fully control need low-latency, high-throughput calls
      with an enforced contract across polyglot languages. Best choice?
    options:
      - "REST/JSON over HTTP/1.1"
      - "GraphQL over WebSocket"
      - "SOAP/XML"
      - "gRPC (Protobuf over HTTP/2, codegenerated typed stubs)"
    answer: 3
    explanation: |
      Internal service-to-service traffic where you control both ends, want strong enforced
      contracts across languages, and need low latency/high throughput is gRPC's core use
      case. Browser reach and HTTP caching (REST/GraphQL strengths) don't matter here.
    ref: "concepts.md#choosing-between-rest-graphql-and-grpc"

  - id: rest-vs-graphql-vs-grpc-041
    difficulty: intermediate
    tags: [decision, choosing, graphql, bff]
    question: |
      A mobile app must render a screen composed from six backend services in as few round
      trips as possible, with the frontend evolving quickly. Which paradigm is most suited?
    options:
      - "REST with one endpoint per service"
      - "gRPC directly from the mobile client"
      - "GraphQL as a BFF/aggregation layer letting the client fetch exactly what it needs in one query"
      - "SOAP with WS-* extensions"
    answer: 2
    explanation: |
      GraphQL as a backend-for-frontend shines here: the client composes one query for
      exactly the fields it needs across many sources, collapsing a request waterfall into a
      single round trip and letting the frontend evolve without server changes.
    ref: "concepts.md#choosing-between-rest-graphql-and-grpc"

  - id: rest-vs-graphql-vs-grpc-042
    difficulty: advanced
    tags: [decision, coexistence]
    question: |
      Which statement reflects the mature, senior-level view of REST vs GraphQL vs gRPC?
    options:
      - "gRPC is objectively the best and should replace the others"
      - "GraphQL always replaces REST because it fixes over-fetching"
      - "They are complementary; systems often use REST at the edge, gRPC internally, and GraphQL as a BFF"
      - "REST is obsolete now that GraphQL exists"
    answer: 2
    explanation: |
      There is no single best. Mature systems combine them: REST/GraphQL at the public edge,
      gRPC between internal services, GraphQL/BFF for mobile aggregation. The right answer
      names the client, traffic shape, and contract needs.
    ref: "concepts.md#choosing-between-rest-graphql-and-grpc"

  - id: rest-vs-graphql-vs-grpc-043
    difficulty: advanced
    tags: [performance, caching, nuance]
    question: |
      An interviewer asks "which is fastest?" What is the most accurate answer?
    options:
      - "gRPC always, without exception"
      - "For raw service-to-service latency gRPC usually wins, but a CDN-cached REST GET can beat everything by never hitting the origin"
      - "REST always, because JSON is fast"
      - "GraphQL, because it fetches everything in one query"
    answer: 1
    explanation: |
      gRPC (binary + HTTP/2 multiplexing) usually wins raw service-to-service latency and
      throughput, but "fastest" depends on caching: a CDN-cached REST GET is served from the
      edge without touching the origin, beating any origin round trip.
    ref: "concepts.md#choosing-between-rest-graphql-and-grpc"

  - id: rest-vs-graphql-vs-grpc-044
    difficulty: beginner
    tags: [grpc, http2, why]
    question: |
      Why does gRPC use HTTP/2?
    options:
      - "Because HTTP/2 is text-based and easy to debug"
      - "Because HTTP/2 is required for JSON"
      - "For multiplexed streams over one connection, header compression, and binary framing enabling low latency and native streaming"
      - "To make responses cacheable at the CDN"
    answer: 2
    explanation: |
      HTTP/2 gives gRPC multiplexed streams over a single connection, header compression
      (HPACK), and binary framing, which together enable low-latency calls and native
      bidirectional streaming.
    ref: "concepts.md#grpc-http2-protobuf-and-strong-contracts"

  - id: rest-vs-graphql-vs-grpc-045
    difficulty: advanced
    tags: [graphql, misconception, n-plus-one]
    question: |
      Which claim about GraphQL is FALSE?
    options:
      - "GraphQL lets clients request exactly the fields they need"
      - "GraphQL eliminates the N+1 problem automatically with no extra work"
      - "GraphQL typically returns HTTP 200 with errors in an errors array"
      - "GraphQL exposes a single endpoint and a mandatory schema"
    answer: 1
    explanation: |
      GraphQL does not eliminate N+1 automatically; it shifts the waterfall to the server's
      data layer, and you must deliberately solve it with batching/DataLoader. The other
      three statements are true.
    ref: "concepts.md#graphql-n1-problem-and-query-cost"

  - id: rest-vs-graphql-vs-grpc-046
    difficulty: intermediate
    tags: [rest, weaknesses]
    question: |
      Which of the following is a genuine weakness of REST relative to GraphQL and gRPC?
    options:
      - "It cannot be used from a browser"
      - "It has no mandatory wire-level contract and can require multiple round trips for related resources"
      - "It cannot use TLS"
      - "It requires codegen for every client"
    answer: 1
    explanation: |
      REST's JSON is untyped on the wire (contracts like OpenAPI are layered on, not
      enforced) and related resources often require multiple round trips. It is fully
      browser-usable, works over TLS, and needs no codegen.
    ref: "concepts.md#rest-strengths-and-constraints"

  - id: rest-vs-graphql-vs-grpc-047
    difficulty: beginner
    tags: [rest, simplicity, tooling]
    question: |
      Which is a reason REST has the lowest barrier to entry of the three?
    options:
      - "It requires a compiled Protobuf schema"
      - "It mandates a WebSocket connection"
      - "It uses a single endpoint for everything"
      - "Every language, browser, proxy, and CLI like curl already speaks HTTP/JSON, with no codegen required"
    answer: 3
    explanation: |
      REST rides on ubiquitous HTTP/JSON: every language, browser, proxy, and tool like curl
      speaks it with no special client or codegen. That ubiquity and simplicity is a core
      strength.
    ref: "concepts.md#rest-strengths-and-constraints"

  - id: rest-vs-graphql-vs-grpc-048
    difficulty: advanced
    tags: [scenario, grpc, public-api]
    question: |
      A team proposes exposing their public, browser-facing API over native gRPC. What is
      the strongest objection?
    options:
      - "gRPC cannot serialize nested data"
      - "Browsers can't speak native gRPC (need gRPC-Web + a proxy, no client/bidi streaming), payloads are hard to debug, and you lose HTTP caching and REST tooling"
      - "gRPC does not support authentication"
      - "gRPC is slower than REST for every workload"
    answer: 1
    explanation: |
      gRPC's value is internal typed low-latency service-to-service calls. For public/browser
      APIs it needs gRPC-Web plus a proxy (with no client/bidi streaming), payloads are binary
      and hard to debug, and you forfeit HTTP caching and the vast REST tooling ecosystem.
    ref: "concepts.md#grpc-browser-limits-and-grpc-web"

  - id: rest-vs-graphql-vs-grpc-049
    difficulty: intermediate
    tags: [comparison, payload]
    question: |
      Regarding payload readability, which ranking is correct?
    options:
      - "REST and GraphQL use human-readable JSON; gRPC uses non-human-readable binary Protobuf"
      - "All three use binary payloads"
      - "gRPC and GraphQL use JSON; REST uses binary"
      - "Only REST is human-readable; GraphQL and gRPC are both binary"
    answer: 0
    explanation: |
      REST and GraphQL both use human-readable JSON payloads. gRPC uses binary Protobuf,
      which is compact and fast but not human-readable, requiring tools to inspect.
    ref: "concepts.md#schema-typing-and-tooling-compared"

  - id: rest-vs-graphql-vs-grpc-050
    difficulty: intermediate
    tags: [scenario, graphql, caching, trade-offs]
    question: |
      A team moves a read-heavy public product catalog from REST to GraphQL and is surprised
      their CDN hit rate collapses. What is the correct explanation?
    options:
      - "GraphQL disables TLS, which CDNs require"
      - "Reads now go over POST to a single /graphql URL, so URL+method-keyed CDN caches no longer cache them"
      - "GraphQL responses are too large to cache"
      - "The CDN cannot parse the errors array"
    answer: 1
    explanation: |
      The catalog reads became POST /graphql to one URL. Shared HTTP/CDN caches key on
      URL + method and won't cache POST bodies, so the edge caching that made the REST GETs
      cheap disappears. Persisted GET queries or client-side normalized caches are needed to
      recover caching.
    ref: "concepts.md#graphql-caching-challenges"
