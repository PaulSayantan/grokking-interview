topic: "REST vs GraphQL vs gRPC"
domain: rest-api-design
topic_slug: rest-vs-graphql-vs-grpc
version: 1
questions:
  - id: rest-vs-graphql-vs-grpc-001
    difficulty: beginner
    tags: [paradigms, overview]
    question: |
      Which statement best describes the fundamental style of each paradigm?
    options:
      - "REST is resource-oriented, GraphQL is a query language, gRPC is an RPC framework"
      - "REST is an RPC framework, GraphQL is resource-oriented, gRPC is a query language"
      - "All three are query languages that merely differ in their concrete syntax"
      - "REST and gRPC are query languages; GraphQL is resource-oriented"
    answer: 0
    explanation: |
      REST models the domain as resources addressed by URLs and acted on with HTTP methods.
      GraphQL is a query language and runtime where the client describes the field tree it
      wants. gRPC is a contract-first RPC framework where you call remote methods.
    ref: "concepts.md#the-three-paradigms-at-a-glance"

  - id: rest-vs-graphql-vs-grpc-002
    difficulty: beginner
    tags: [transport, protobuf]
    question: |
      What transport and payload format does gRPC use by default?
    options:
      - "HTTP/1.1 with JSON payloads"
      - "HTTP/2 with JSON payloads"
      - "WebSocket with XML payloads"
      - "HTTP/2 with Protobuf binary payloads"
    answer: 3
    explanation: |
      gRPC requires HTTP/2 as its transport and uses Protocol Buffers (Protobuf) binary
      framing by default. HTTP/2 multiplexing and binary framing are what enable its low
      latency and native streaming.
    ref: "concepts.md#grpc-http2-protobuf-and-strong-contracts"

  - id: rest-vs-graphql-vs-grpc-003
    difficulty: beginner
    tags: [graphql, endpoint]
    question: |
      How many endpoints does a typical GraphQL API expose?
    options:
      - "One endpoint per resource type, like REST"
      - "One per query and one per mutation"
      - "A single endpoint (usually POST /graphql)"
      - "One endpoint per field in the schema"
    answer: 2
    explanation: |
      GraphQL exposes a single endpoint (conventionally POST /graphql). Rather than a URL
      per resource, the query body itself selects the data the client wants.
    ref: "concepts.md#graphql-single-endpoint-and-schema-typing"

  - id: rest-vs-graphql-vs-grpc-004
    difficulty: beginner
    tags: [rest, caching, strengths]
    question: |
      Which is REST's biggest structural advantage over GraphQL and gRPC?
    options:
      - "Compact binary payloads that are smaller than raw JSON"
      - "Mandatory strongly typed contracts enforced on the wire"
      - "Native bidirectional streaming over one connection"
      - "Excellent HTTP caching (browser, CDN, proxy) for GET requests"
    answer: 3
    explanation: |
      Because GET is safe and cacheable, REST responses cache at the browser, CDN, and
      reverse proxy using Cache-Control, ETag, and conditional requests. GraphQL (POST to
      one URL) and gRPC (binary HTTP/2) cannot use that shared HTTP cache without extra work.
    ref: "concepts.md#rest-strengths-and-constraints"

  - id: rest-vs-graphql-vs-grpc-005
    difficulty: beginner
    tags: [over-fetching, definitions]
    question: |
      What is "over-fetching"?
    options:
      - "An endpoint returns more data than the client actually needs"
      - "The client must make several requests to gather related data"
      - "The server rejects a query because it is too deeply nested"
      - "A cache returns stale data well past its configured expiry"
    answer: 0
    explanation: |
      Over-fetching is when a fixed endpoint returns more fields than the client needs
      (e.g. a 30-field user object for a list view that only needs name and avatar).
      Under-fetching is the opposite: needing multiple calls to gather related data.
    ref: "concepts.md#over-fetching-and-under-fetching"

  - id: rest-vs-graphql-vs-grpc-006
    difficulty: beginner
    tags: [under-fetching, definitions]
    question: |
      A client renders a profile by calling /users/42, then /users/42/orders, then
      /orders/{id}/items. This pattern is an example of what?
    options:
      - "Under-fetching (client-side request waterfall)"
      - "Over-fetching (a single oversized response)"
      - "Query cost explosion from deep nesting"
      - "Content negotiation via Accept headers"
    answer: 0
    explanation: |
      Under-fetching means one endpoint does not return enough, forcing the client to make
      additional round trips to gather related resources — a request waterfall. GraphQL's
      pitch is to collapse this into a single query.
    ref: "concepts.md#over-fetching-and-under-fetching"

  - id: rest-vs-graphql-vs-grpc-007
    difficulty: intermediate
    tags: [graphql, over-fetching, trade-offs]
    question: |
      GraphQL eliminates over- and under-fetching. What does it give up or complicate in
      exchange?
    options:
      - "It loses the ability to return JSON and must emit binary instead"
      - "It can no longer define types or expose a strongly typed schema"
      - "It makes HTTP caching harder and introduces query-cost and server-side N+1 concerns"
      - "It requires binary Protobuf payloads instead of JSON responses"
    answer: 2
    explanation: |
      GraphQL's flexibility moves cost around: client-defined queries make HTTP/CDN caching
      hard (reads go over POST to one URL), make query cost unpredictable, and open the
      server-side N+1 problem. It still uses JSON and has a mandatory schema.
    ref: "concepts.md#over-fetching-and-under-fetching"

  - id: rest-vs-graphql-vs-grpc-008
    difficulty: intermediate
    tags: [rest, mitigations, over-fetching]
    question: |
      Which REST technique is a partial mitigation for over-fetching?
    options:
      - "Sparse fieldsets, e.g. GET /users/42?fields=name,avatar"
      - "Returning HTTP 200 for every error so clients parse a status field"
      - "Switching the response body from JSON to binary Protobuf encoding"
      - "Sending the read query in a POST body to a single collection URL"
    answer: 0
    explanation: |
      REST APIs can offer sparse fieldsets (?fields=), expansion (?expand=/?include=), or
      compound documents (JSON:API) to let clients trim or expand responses. These work but
      are bespoke per API rather than a uniform protocol feature.
    ref: "concepts.md#over-fetching-and-under-fetching"

  - id: rest-vs-graphql-vs-grpc-009
    difficulty: intermediate
    tags: [graphql, schema, sdl]
    question: |
      In GraphQL, what shapes the structure of the response body?
    options:
      - "The server decides the shape based on the requested URL path"
      - "The client's query — the response mirrors the requested field tree exactly"
      - "The Accept header's negotiated media type on the request"
      - "The Protobuf message definition compiled into the server"
    answer: 1
    explanation: |
      In GraphQL the client sends a query describing exactly the fields it wants, and the
      server returns exactly that shape — no more, no less. This is the inverse of REST,
      where the server defines the response shape.
    ref: "concepts.md#graphql-single-endpoint-and-schema-typing"

  - id: rest-vs-graphql-vs-grpc-010
    difficulty: intermediate
    tags: [graphql, errors, status-codes]
    question: |
      A GraphQL query for a user fails because the user does not exist, but the request was
      well-formed. What HTTP status is typically returned?
    options:
      - "404 Not Found, since the requested user resource is missing"
      - "400 Bad Request, treating the missing user as a client error"
      - "500 Internal Server Error, because a resolver returned nothing"
      - "200 OK, with the problem in a top-level errors array"
    answer: 3
    explanation: |
      GraphQL typically returns 200 OK even for field-level errors, placing them in a
      top-level errors array alongside partial data. Transport-level 4xx/5xx is reserved
      for malformed requests or server crashes. This breaks naive HTTP-status alerting.
    ref: "concepts.md#graphql-single-endpoint-and-schema-typing"

  - id: rest-vs-graphql-vs-grpc-011
    difficulty: intermediate
    tags: [graphql, operations]
    question: |
      Which set correctly lists GraphQL's three root operation types?
    options:
      - "GET, POST, DELETE mapped to schema operations"
      - "Read, Write, Stream as the three schema verbs"
      - "Query, Mutation, Subscription"
      - "Unary, Server-stream, Bidi operation kinds"
    answer: 2
    explanation: |
      GraphQL operations are Query (reads), Mutation (writes, executed serially), and
      Subscription (streams over a persistent transport, usually WebSocket). Unary/streaming
      are gRPC call types, not GraphQL operations.
    ref: "concepts.md#graphql-single-endpoint-and-schema-typing"

  - id: rest-vs-graphql-vs-grpc-012
    difficulty: intermediate
    tags: [graphql, n-plus-one]
    question: |
      What is the server-side N+1 problem in GraphQL?
    options:
      - "A query nested N+1 levels deep is automatically rejected by the validator"
      - "The server accidentally returns N+1 duplicate copies of the same object"
      - "Resolving a related field for each item in a list fires one DB query per item"
      - "The client is forced to make N+1 separate HTTP requests to the endpoint"
    answer: 2
    explanation: |
      A query over a list where each item resolves a related field can trigger one database
      query per item (1 for the list + N for the children). It is the same waterfall REST
      clients hit, but moved into the server's data layer.
    ref: "concepts.md#graphql-n1-problem-and-query-cost"

  - id: rest-vs-graphql-vs-grpc-013
    difficulty: intermediate
    tags: [graphql, n-plus-one, dataloader]
    question: |
      What is the standard fix for the GraphQL server-side N+1 problem?
    options:
      - "Switch the single endpoint from POST over to GET requests"
      - "A DataLoader-style batch-and-cache pattern that collects keys and issues one batched query"
      - "Increase the maximum allowed query nesting depth limit"
      - "Return HTTP 200 for all responses to simplify caching"
    answer: 1
    explanation: |
      A DataLoader collects all keys requested within a tick, issues one batched query
      (WHERE id IN (...)), and caches per request. It is not automatic — resolver authors
      must wire it up.
    ref: "concepts.md#graphql-n1-problem-and-query-cost"

  - id: rest-vs-graphql-vs-grpc-014
    difficulty: advanced
    tags: [graphql, query-cost, security]
    question: |
      Why is an unbounded query a denial-of-service concern that is specific to GraphQL and
      largely absent in REST?
    options:
      - "GraphQL responses are binary framed and cannot be inspected by tooling"
      - "REST endpoints have fixed, server-defined shapes, while GraphQL lets clients compose arbitrary deeply nested queries"
      - "REST runs only over HTTP/2, which provides no connection flow control"
      - "GraphQL cannot be served over a TLS-encrypted connection"
    answer: 1
    explanation: |
      Because GraphQL clients compose arbitrary queries, a client can request deeply nested
      or hugely wide data. A REST endpoint returns a fixed shape, so it does not face this
      per-query cost explosion. Mitigations include depth limiting, cost analysis, and
      persisted-query allowlists.
    ref: "concepts.md#graphql-n1-problem-and-query-cost"

  - id: rest-vs-graphql-vs-grpc-015
    difficulty: advanced
    tags: [graphql, query-cost, mitigations]
    question: |
      Which of these is NOT a standard technique for bounding GraphQL query cost?
    options:
      - "Query depth limiting on nested selection sets"
      - "Query complexity / cost analysis with a budget"
      - "Persisted queries / allowlisting registered query hashes"
      - "Returning all responses as HTTP 200 status"
    answer: 3
    explanation: |
      Returning 200 is unrelated to bounding cost. Depth limiting, complexity/cost analysis,
      persisted-query allowlists, timeouts, and cost-based rate limiting are the real
      controls against expensive or malicious queries.
    ref: "concepts.md#graphql-n1-problem-and-query-cost"

  - id: rest-vs-graphql-vs-grpc-016
    difficulty: intermediate
    tags: [graphql, caching]
    question: |
      Why is shared HTTP/CDN caching largely unavailable for typical GraphQL queries?
    options:
      - "GraphQL responses are always encrypted end-to-end so edges can't read them"
      - "The GraphQL spec explicitly forbids the use of any HTTP or edge cache"
      - "CDNs are unable to parse JSON response bodies and skip them"
      - "Requests are POST to a single URL, and shared caches key on URL + method and won't cache POST bodies"
    answer: 3
    explanation: |
      GraphQL reads go over POST /graphql with the query in the body. Shared HTTP caches key
      on URL + method and will not cache POST bodies, so the CDN-level caching REST enjoys is
      largely unavailable without workarounds.
    ref: "concepts.md#graphql-caching-challenges"

  - id: rest-vs-graphql-vs-grpc-017
    difficulty: advanced
    tags: [graphql, caching, persisted-queries]
    question: |
      Which technique lets a GraphQL request become a cacheable GET so a CDN can cache it?
    options:
      - "Automatic Persisted Queries (send a query hash as a URL param via GET)"
      - "Switching the response payloads from JSON to binary Protobuf"
      - "Adding an ETag validator header inside the POST request body"
      - "Placing a gRPC-Web translating proxy in front of the endpoint"
    answer: 0
    explanation: |
      With persisted queries, the client sends a registered query hash as a URL parameter on
      a GET request, making it cacheable at the CDN. The main alternative caching model is a
      client-side normalized cache keyed by object ID (Apollo/Relay), which is per-client.
    ref: "concepts.md#graphql-caching-challenges"

  - id: rest-vs-graphql-vs-grpc-018
    difficulty: intermediate
    tags: [graphql, caching, client-cache]
    question: |
      What is the primary caching model that GraphQL clients like Apollo and Relay rely on?
    options:
      - "Edge caching keyed by the full query text of each request"
      - "Reverse-proxy caching that stores whole POST request bodies"
      - "A client-side normalized cache keyed by global object ID"
      - "gRPC trailer-based caching negotiated over HTTP/2"
    answer: 2
    explanation: |
      GraphQL clients maintain a normalized store that caches objects by global ID rather
      than caching whole responses. It works well but is per-client, not a shared or edge
      cache.
    ref: "concepts.md#graphql-caching-challenges"

  - id: rest-vs-graphql-vs-grpc-019
    difficulty: intermediate
    tags: [grpc, protobuf, contracts]
    question: |
      In a Protobuf message, what uniquely identifies a field on the wire?
    options:
      - "The field's name"
      - "The field's declared type"
      - "The field's number (tag)"
      - "The order fields appear in the .proto file"
    answer: 2
    explanation: |
      Protobuf uses field numbers (tags), not names, to identify fields on the wire. This is
      what makes the binary encoding compact and is why you must never reuse or change an
      existing field's number.
    ref: "concepts.md#grpc-http2-protobuf-and-strong-contracts"

  - id: rest-vs-graphql-vs-grpc-020
    difficulty: intermediate
    tags: [grpc, codegen, contracts]
    question: |
      What gives gRPC its strong end-to-end type safety?
    options:
      - "JSON Schema documents validated against every request and response at runtime"
      - "The Accept header negotiates a strongly typed media type on every call"
      - "protoc generates typed client and server stubs from the shared .proto contract"
      - "GraphQL-style schema introspection queried by the client at startup"
    answer: 2
    explanation: |
      protoc generates typed client and server stubs in many languages from the same .proto
      file, so both ends share the contract and mismatches surface at compile/codegen time
      rather than as runtime JSON surprises.
    ref: "concepts.md#grpc-http2-protobuf-and-strong-contracts"

  - id: rest-vs-graphql-vs-grpc-021
    difficulty: intermediate
    tags: [grpc, debuggability, trade-offs]
    question: |
      Which is a genuine downside of gRPC's Protobuf binary payloads?
    options:
      - "They are substantially larger on the wire than the equivalent JSON encoding"
      - "They cannot be transmitted over HTTP/2 and require a downgrade to HTTP/1.1"
      - "They are not human-readable, so you need tools like grpcurl to inspect them"
      - "They cannot represent nested messages, only flat top-level scalar fields"
    answer: 2
    explanation: |
      Protobuf payloads are smaller and faster to (de)serialize than JSON, but they are
      binary and not human-readable, hurting debuggability. You need tooling like grpcurl or
      server reflection to inspect them.
    ref: "concepts.md#grpc-http2-protobuf-and-strong-contracts"

  - id: rest-vs-graphql-vs-grpc-022
    difficulty: advanced
    tags: [grpc, status, deadlines]
    question: |
      How does gRPC convey call outcome and where are timeouts handled?
    options:
      - "It reuses standard HTTP status codes for outcome, and timeouts are handled purely client-side"
      - "It has its own status codes carried in trailers, and deadlines/timeouts are first-class and propagate across calls"
      - "It returns call outcomes only inside a GraphQL-style top-level errors array in the response body"
      - "It signals outcomes with RFC 9457 Problem Details JSON documents in the response body"
    answer: 1
    explanation: |
      gRPC has its own status codes (OK, NOT_FOUND, INVALID_ARGUMENT, UNAVAILABLE,
      DEADLINE_EXCEEDED, ...) carried in trailers rather than HTTP status. Deadlines are
      first-class and propagate across chained calls.
    ref: "concepts.md#grpc-http2-protobuf-and-strong-contracts"

  - id: rest-vs-graphql-vs-grpc-023
    difficulty: beginner
    tags: [grpc, streaming]
    question: |
      Which of the following is one of gRPC's four call types?
    options:
      - "Bidirectional streaming"
      - "Long-polling"
      - "Content negotiation"
      - "Conditional GET"
    answer: 0
    explanation: |
      gRPC supports four call types: unary, server streaming, client streaming, and
      bidirectional streaming — all built on HTTP/2 streams. Long-polling and conditional
      GET are REST/HTTP techniques.
    ref: "concepts.md#grpc-streaming-modes"

  - id: rest-vs-graphql-vs-grpc-024
    difficulty: intermediate
    tags: [grpc, streaming]
    question: |
      A client uploads many chunks and receives a single summary response at the end. Which
      gRPC streaming mode is this?
    options:
      - "Server streaming"
      - "Unary"
      - "Client streaming"
      - "Bidirectional streaming"
    answer: 2
    explanation: |
      Client streaming = a stream of messages from the client, one response from the server
      (e.g. uploading chunks, getting one summary). Server streaming is the inverse; bidi is
      both directions interleaved.
    ref: "concepts.md#grpc-streaming-modes"

  - id: rest-vs-graphql-vs-grpc-025
    difficulty: intermediate
    tags: [grpc, streaming, http2]
    question: |
      What makes gRPC's streaming first-class compared to REST?
    options:
      - "It uses XML message envelopes on the wire instead of JSON for lower latency"
      - "It is built on HTTP/2 streams that multiplex over a single connection with flow control"
      - "It opens a brand-new TCP connection for every individual message it sends"
      - "It relies on Server-Sent Events layered over HTTP/1.1 for its streaming"
    answer: 1
    explanation: |
      gRPC streaming is native HTTP/2: streams multiplex over one connection with flow
      control. REST must approximate streaming with SSE, chunked transfer, long-polling, or
      a separate WebSocket protocol.
    ref: "concepts.md#grpc-streaming-modes"

  - id: rest-vs-graphql-vs-grpc-026
    difficulty: intermediate
    tags: [grpc, browser, grpc-web]
    question: |
      Why can't browser JavaScript call a native gRPC service directly?
    options:
      - "Browsers cannot establish the TLS 1.3 connections that gRPC mandates for every call"
      - "The fetch/XHR APIs do not expose the low-level HTTP/2 framing (trailers, request-stream control) gRPC needs"
      - "Protobuf serialization is blocked by browser Content Security Policy sandboxing"
      - "gRPC runs only over raw UDP datagrams, which browser JavaScript cannot open"
    answer: 1
    explanation: |
      Browser HTTP APIs (fetch/XHR) don't expose the low-level HTTP/2 framing gRPC requires,
      such as trailers and full control of the request stream. You need gRPC-Web plus a proxy
      to bridge browser requests to a gRPC backend.
    ref: "concepts.md#grpc-browser-limits-and-grpc-web"

  - id: rest-vs-graphql-vs-grpc-027
    difficulty: advanced
    tags: [grpc-web, streaming, limits]
    question: |
      Which streaming modes does gRPC-Web generally NOT support?
    options:
      - "Unary single request/response calls"
      - "Server-to-client streaming responses"
      - "Client streaming and bidirectional streaming"
      - "All streaming modes are fully supported"
    answer: 2
    explanation: |
      gRPC-Web generally supports unary and server-streaming but not client-streaming or
      bidirectional streaming, due to browser transport constraints. This is one reason gRPC
      is reserved for service-to-service traffic.
    ref: "concepts.md#grpc-browser-limits-and-grpc-web"

  - id: rest-vs-graphql-vs-grpc-028
    difficulty: intermediate
    tags: [grpc, grpc-web, proxy]
    question: |
      What component is required to expose a gRPC backend to browsers via gRPC-Web?
    options:
      - "A proxy (e.g. Envoy) that translates between browser HTTP requests and backend gRPC"
      - "A GraphQL schema layer that wraps the gRPC service for browser clients"
      - "A CDN edge worker that rewrites gRPC trailers into browser-readable headers"
      - "Nothing — browsers speak gRPC-Web to the backend directly with no translation"
    answer: 0
    explanation: |
      gRPC-Web needs a proxy such as Envoy (or an in-process filter) to translate between
      browser-friendly HTTP requests and the backend gRPC protocol, plus generated JS
      clients. This extra hop is part of why gRPC stays internal.
    ref: "concepts.md#grpc-browser-limits-and-grpc-web"

  - id: rest-vs-graphql-vs-grpc-029
    difficulty: intermediate
    tags: [contracts, tooling, comparison]
    question: |
      Which paradigm makes a machine-readable contract OPTIONAL rather than mandatory?
    options:
      - "GraphQL (the SDL schema is an optional add-on, not required to run)"
      - "gRPC (the .proto file is an optional convenience, not mandatory)"
      - "REST (OpenAPI/JSON Schema are layered on but not enforced by the protocol)"
      - "All three protocols mandate a strict machine-readable contract"
    answer: 2
    explanation: |
      REST's contract is optional and additive — OpenAPI 3.1 / JSON Schema describe it but
      nothing forces the server to obey them. GraphQL (SDL schema) and gRPC (.proto) both
      mandate a contract.
    ref: "concepts.md#schema-typing-and-tooling-compared"

  - id: rest-vs-graphql-vs-grpc-030
    difficulty: intermediate
    tags: [graphql, introspection, tooling]
    question: |
      What feature makes a GraphQL API self-documenting?
    options:
      - "Server reflection streamed to clients over HTTP/2"
      - "The Allow response header advertising the schema"
      - "Protobuf reflection exposed at the service endpoint"
      - "Introspection — clients can query the schema itself"
    answer: 3
    explanation: |
      GraphQL introspection lets clients query the schema itself, which powers tooling like
      GraphiQL and auto-generated typed clients. gRPC's analog is server reflection over the
      .proto; REST's is OpenAPI docs.
    ref: "concepts.md#schema-typing-and-tooling-compared"

  - id: rest-vs-graphql-vs-grpc-031
    difficulty: intermediate
    tags: [openapi, rest, tooling]
    question: |
      What is the de facto description format for REST APIs, and what does it align with?
    options:
      - "WSDL 2.0, aligned with the SOAP spec"
      - "OpenAPI 3.1, aligned with JSON Schema 2020-12"
      - "Protobuf IDL, aligned with HTTP/2 framing"
      - "SDL schema, aligned with introspection"
    answer: 1
    explanation: |
      OpenAPI 3.1 is the de facto REST description format and is aligned with JSON Schema
      2020-12. It powers docs, mocks, and client codegen, though the protocol does not force
      the server to conform to it.
    ref: "concepts.md#schema-typing-and-tooling-compared"

  - id: rest-vs-graphql-vs-grpc-032
    difficulty: beginner
    tags: [streaming, rest, comparison]
    question: |
      Which technique does REST use to approximate server-to-client streaming?
    options:
      - "Protobuf trailers streamed after the body"
      - "GraphQL subscriptions over the REST endpoint"
      - "Server-Sent Events (SSE) or chunked transfer encoding"
      - "Native bidirectional HTTP/2 stream framing"
    answer: 2
    explanation: |
      REST has no native streaming; it approximates server push with Server-Sent Events,
      chunked transfer encoding, or long-polling, and uses a separate WebSocket protocol for
      bidirectional communication.
    ref: "concepts.md#streaming-support-compared"

  - id: rest-vs-graphql-vs-grpc-033
    difficulty: intermediate
    tags: [graphql, subscriptions, streaming]
    question: |
      How does GraphQL provide server-to-client push?
    options:
      - "Subscriptions, typically over WebSocket (or SSE)"
      - "Bidirectional Protobuf streams over HTTP/2"
      - "Conditional GET requests validated by ETags"
      - "Client-streaming RPC calls over HTTP/2"
    answer: 0
    explanation: |
      GraphQL Subscriptions push data server-to-client, usually over WebSocket (or SSE via
      graphql-sse). Newer @defer/@stream directives allow incremental delivery of parts of a
      single response.
    ref: "concepts.md#streaming-support-compared"

  - id: rest-vs-graphql-vs-grpc-034
    difficulty: intermediate
    tags: [streaming, comparison]
    question: |
      For high-throughput BIDIRECTIONAL streaming between two internal services, which
      paradigm is the natural fit?
    options:
      - "REST simulating streams via repeated long-polling"
      - "GraphQL subscriptions over a WebSocket channel"
      - "gRPC (first-class bidirectional streaming over HTTP/2)"
      - "REST using conditional requests with ETag validators"
    answer: 2
    explanation: |
      gRPC offers first-class server, client, and bidirectional streaming over HTTP/2 — the
      richest of the three. GraphQL subscriptions are server-push only; REST streaming is
      bolted on.
    ref: "concepts.md#streaming-support-compared"

  - id: rest-vs-graphql-vs-grpc-035
    difficulty: intermediate
    tags: [versioning, rest]
    question: |
      Which is a common REST versioning approach?
    options:
      - "Never version the API and instead rely on stable numeric field tags"
      - "Only add new fields and annotate the obsolete ones with @deprecated"
      - "reserve the numbers of removed fields so they are never reused"
      - "URL path versions (/v1, /v2) or media-type versions (Accept: application/vnd.example.v2+json)"
    answer: 3
    explanation: |
      REST commonly uses explicit versions via URL path or media-type/header, while evolving
      additively. @deprecated is GraphQL's approach; reserved field numbers are Protobuf's.
    ref: "concepts.md#versioning-approaches-per-paradigm"

  - id: rest-vs-graphql-vs-grpc-036
    difficulty: intermediate
    tags: [versioning, graphql, deprecated]
    question: |
      What does the GraphQL specification recommend regarding versioning?
    options:
      - "Bump a new major version number for every single schema change you introduce"
      - "Avoid versioning; evolve the schema continuously and mark old fields @deprecated"
      - "Use REST-style URL path versions such as /graphql/v2 for each release"
      - "Reuse existing numeric field tags whenever a field's type changes"
    answer: 1
    explanation: |
      GraphQL guidance is to avoid versioning: add new fields/types freely and @deprecated
      old ones (with a reason). Because clients request specific fields, additions never
      break anyone, and usage of a deprecated field can be measured before removal.
    ref: "concepts.md#versioning-approaches-per-paradigm"

  - id: rest-vs-graphql-vs-grpc-037
    difficulty: advanced
    tags: [versioning, protobuf, gotcha]
    question: |
      Which Protobuf evolution rule prevents silently corrupting data for peers on the old
      schema?
    options:
      - "Always rename a field whenever its meaning changes so peers can detect the shift"
      - "Never reuse or change an existing field's number; reserve removed numbers"
      - "Send a Cache-Control: no-store header on every message to prevent stale reads"
      - "Return HTTP 200 on every RPC so old clients never observe an error status"
    answer: 1
    explanation: |
      Field numbers are the wire identity in Protobuf. You must never reuse or renumber an
      existing field, and you should reserve removed field numbers/names to prevent
      accidental reuse. Field names may change; numbers must not.
    ref: "concepts.md#versioning-approaches-per-paradigm"

  - id: rest-vs-graphql-vs-grpc-038
    difficulty: intermediate
    tags: [protobuf, forward-compatibility]
    question: |
      Why can an old gRPC client safely receive a message from a newer server that added a
      field?
    options:
      - "The server strips any fields the older client wasn't compiled with before sending"
      - "The client silently regenerates its stubs from server reflection at call time"
      - "Old clients ignore unknown fields carrying new numbers"
      - "Protobuf rejects the mismatched message and transparently retries with the old schema"
    answer: 2
    explanation: |
      Protobuf is designed for compatible evolution: new fields get new numbers, and clients
      built on the old schema simply ignore fields with unknown numbers. This keeps old and
      new messages interoperable without a new service version.
    ref: "concepts.md#versioning-approaches-per-paradigm"

  - id: rest-vs-graphql-vs-grpc-039
    difficulty: intermediate
    tags: [decision, choosing, rest]
    question: |
      A read-heavy, public content API needs the widest possible reach and cheap edge
      caching. Which paradigm fits best?
    options:
      - "gRPC, because its compact binary Protobuf payloads cache at the CDN for free"
      - "GraphQL, since avoiding over-fetching automatically makes POST queries edge-cacheable"
      - "REST, for ubiquity plus free CDN/HTTP caching of GET responses"
      - "gRPC-Web through an Envoy proxy that translates and caches responses at the edge"
    answer: 2
    explanation: |
      Read-heavy, public, cacheable content is REST's sweet spot: every client speaks it and
      GET responses cache at the browser/CDN/proxy for free. gRPC isn't browser-native and
      GraphQL POST queries don't leverage shared HTTP caches.
    ref: "concepts.md#choosing-between-rest-graphql-and-grpc"

  - id: rest-vs-graphql-vs-grpc-040
    difficulty: intermediate
    tags: [decision, choosing, grpc]
    question: |
      Two internal microservices you fully control need low-latency, high-throughput calls
      with an enforced contract across polyglot languages. Best choice?
    options:
      - "REST/JSON over HTTP/1.1, relying on OpenAPI docs to enforce the cross-language contract"
      - "GraphQL over WebSocket, using subscriptions to carry the request/response traffic"
      - "SOAP/XML with a shared WSDL to generate the polyglot client bindings"
      - "gRPC (Protobuf over HTTP/2, codegenerated typed stubs)"
    answer: 3
    explanation: |
      Internal service-to-service traffic where you control both ends, want strong enforced
      contracts across languages, and need low latency/high throughput is gRPC's core use
      case. Browser reach and HTTP caching (REST/GraphQL strengths) don't matter here.
    ref: "concepts.md#choosing-between-rest-graphql-and-grpc"

  - id: rest-vs-graphql-vs-grpc-041
    difficulty: intermediate
    tags: [decision, choosing, graphql, bff]
    question: |
      A mobile app must render a screen composed from six backend services in as few round
      trips as possible, with the frontend evolving quickly. Which paradigm is most suited?
    options:
      - "REST with one endpoint per service, letting the app fire the six calls in parallel"
      - "gRPC called directly from the mobile client to each of the six backend services"
      - "GraphQL as a BFF/aggregation layer letting the client fetch exactly what it needs in one query"
      - "SOAP with WS-* extensions orchestrating the six services behind one envelope"
    answer: 2
    explanation: |
      GraphQL as a backend-for-frontend shines here: the client composes one query for
      exactly the fields it needs across many sources, collapsing a request waterfall into a
      single round trip and letting the frontend evolve without server changes.
    ref: "concepts.md#choosing-between-rest-graphql-and-grpc"

  - id: rest-vs-graphql-vs-grpc-042
    difficulty: advanced
    tags: [decision, coexistence]
    question: |
      Which statement reflects the mature, senior-level view of REST vs GraphQL vs gRPC?
    options:
      - "gRPC is objectively the best-performing option and should replace the other two everywhere"
      - "GraphQL always replaces REST outright because it structurally fixes over-fetching"
      - "They are complementary; systems often use REST at the edge, gRPC internally, and GraphQL as a BFF"
      - "REST is an obsolete legacy style now that GraphQL and gRPC both exist"
    answer: 2
    explanation: |
      There is no single best. Mature systems combine them: REST/GraphQL at the public edge,
      gRPC between internal services, GraphQL/BFF for mobile aggregation. The right answer
      names the client, traffic shape, and contract needs.
    ref: "concepts.md#choosing-between-rest-graphql-and-grpc"

  - id: rest-vs-graphql-vs-grpc-043
    difficulty: advanced
    tags: [performance, caching, nuance]
    question: |
      An interviewer asks "which is fastest?" What is the most accurate answer?
    options:
      - "gRPC always, in every workload without exception, because binary beats text"
      - "For raw service-to-service latency gRPC usually wins, but a CDN-cached REST GET can beat everything by never hitting the origin"
      - "REST always, because JSON parsing is faster than binary Protobuf decoding"
      - "GraphQL always, because collapsing everything into one query eliminates all latency"
    answer: 1
    explanation: |
      gRPC (binary + HTTP/2 multiplexing) usually wins raw service-to-service latency and
      throughput, but "fastest" depends on caching: a CDN-cached REST GET is served from the
      edge without touching the origin, beating any origin round trip.
    ref: "concepts.md#choosing-between-rest-graphql-and-grpc"

  - id: rest-vs-graphql-vs-grpc-044
    difficulty: beginner
    tags: [grpc, http2, why]
    question: |
      Why does gRPC use HTTP/2?
    options:
      - "Because HTTP/2 is a text-based, line-oriented protocol that is easy to debug by hand"
      - "Because HTTP/2 is the only HTTP version capable of carrying JSON request bodies"
      - "For multiplexed streams over one connection, header compression, and binary framing enabling low latency and native streaming"
      - "To make every gRPC response automatically cacheable at the CDN edge"
    answer: 2
    explanation: |
      HTTP/2 gives gRPC multiplexed streams over a single connection, header compression
      (HPACK), and binary framing, which together enable low-latency calls and native
      bidirectional streaming.
    ref: "concepts.md#grpc-http2-protobuf-and-strong-contracts"

  - id: rest-vs-graphql-vs-grpc-045
    difficulty: advanced
    tags: [graphql, misconception, n-plus-one]
    question: |
      Which claim about GraphQL is FALSE?
    options:
      - "GraphQL lets clients request exactly the fields they need"
      - "GraphQL eliminates the N+1 problem automatically with no extra work"
      - "GraphQL typically returns HTTP 200 with errors in an errors array"
      - "GraphQL exposes a single endpoint and a mandatory schema"
    answer: 1
    explanation: |
      GraphQL does not eliminate N+1 automatically; it shifts the waterfall to the server's
      data layer, and you must deliberately solve it with batching/DataLoader. The other
      three statements are true.
    ref: "concepts.md#graphql-n1-problem-and-query-cost"

  - id: rest-vs-graphql-vs-grpc-046
    difficulty: intermediate
    tags: [rest, weaknesses]
    question: |
      Which of the following is a genuine weakness of REST relative to GraphQL and gRPC?
    options:
      - "It cannot be used from a browser without a translating proxy in front of it"
      - "It has no mandatory wire-level contract and can require multiple round trips for related resources"
      - "It cannot run over TLS and must expose all traffic as plaintext HTTP"
      - "It requires compiled stub codegen for every client language before any call"
    answer: 1
    explanation: |
      REST's JSON is untyped on the wire (contracts like OpenAPI are layered on, not
      enforced) and related resources often require multiple round trips. It is fully
      browser-usable, works over TLS, and needs no codegen.
    ref: "concepts.md#rest-strengths-and-constraints"

  - id: rest-vs-graphql-vs-grpc-047
    difficulty: beginner
    tags: [rest, simplicity, tooling]
    question: |
      Which is a reason REST has the lowest barrier to entry of the three?
    options:
      - "It requires a compiled Protobuf schema and generated stubs before any request"
      - "It mandates a persistent WebSocket connection for every request/response exchange"
      - "It routes all operations through a single POST endpoint, simplifying client setup"
      - "Every language, browser, proxy, and CLI like curl already speaks HTTP/JSON, with no codegen required"
    answer: 3
    explanation: |
      REST rides on ubiquitous HTTP/JSON: every language, browser, proxy, and tool like curl
      speaks it with no special client or codegen. That ubiquity and simplicity is a core
      strength.
    ref: "concepts.md#rest-strengths-and-constraints"

  - id: rest-vs-graphql-vs-grpc-048
    difficulty: advanced
    tags: [scenario, grpc, public-api]
    question: |
      A team proposes exposing their public, browser-facing API over native gRPC. What is
      the strongest objection?
    options:
      - "gRPC cannot serialize nested or repeated data, only flat scalar top-level fields"
      - "Browsers can't speak native gRPC (need gRPC-Web + a proxy, no client/bidi streaming), payloads are hard to debug, and you lose HTTP caching and REST tooling"
      - "gRPC has no authentication mechanism, so a public API would be entirely unsecured"
      - "gRPC is slower than REST/JSON for every workload because binary decoding is expensive"
    answer: 1
    explanation: |
      gRPC's value is internal typed low-latency service-to-service calls. For public/browser
      APIs it needs gRPC-Web plus a proxy (with no client/bidi streaming), payloads are binary
      and hard to debug, and you forfeit HTTP caching and the vast REST tooling ecosystem.
    ref: "concepts.md#grpc-browser-limits-and-grpc-web"

  - id: rest-vs-graphql-vs-grpc-049
    difficulty: intermediate
    tags: [comparison, payload]
    question: |
      Regarding payload readability, which ranking is correct?
    options:
      - "REST and GraphQL use human-readable JSON; gRPC uses non-human-readable binary Protobuf"
      - "All three transmit non-human-readable binary payloads by default on the wire"
      - "gRPC and GraphQL both use readable JSON, while REST alone uses a binary encoding"
      - "Only REST is human-readable; GraphQL and gRPC both send binary payloads on the wire"
    answer: 0
    explanation: |
      REST and GraphQL both use human-readable JSON payloads. gRPC uses binary Protobuf,
      which is compact and fast but not human-readable, requiring tools to inspect.
    ref: "concepts.md#schema-typing-and-tooling-compared"

  - id: rest-vs-graphql-vs-grpc-050
    difficulty: intermediate
    tags: [scenario, graphql, caching, trade-offs]
    question: |
      A team moves a read-heavy public product catalog from REST to GraphQL and is surprised
      their CDN hit rate collapses. What is the correct explanation?
    options:
      - "GraphQL disables TLS on responses, which every CDN edge node requires to cache them"
      - "Reads now go over POST to a single /graphql URL, so URL+method-keyed CDN caches no longer cache them"
      - "GraphQL response bodies exceed the maximum object size CDNs are willing to store"
      - "The CDN cannot parse the top-level errors array and refuses to cache such payloads"
    answer: 1
    explanation: |
      The catalog reads became POST /graphql to one URL. Shared HTTP/CDN caches key on
      URL + method and won't cache POST bodies, so the edge caching that made the REST GETs
      cheap disappears. Persisted GET queries or client-side normalized caches are needed to
      recover caching.
    ref: "concepts.md#graphql-caching-challenges"

  - id: rest-vs-graphql-vs-grpc-051
    difficulty: expert
    tags: [graphql, graphql-over-http, status-codes]
    question: |
      A client negotiates the newer application/graphql-response+json media type and sends
      a syntactically valid JSON body whose GraphQL document requests a field that does not
      exist on the type (a validation failure — nothing executes). Per the GraphQL-over-HTTP
      spec, what status should the server return?
    options:
      - "200 OK, with the validation error in the errors array"
      - "422 Unprocessable Content, because the document is well-formed JSON but an invalid GraphQL document"
      - "404 Not Found, because the requested field does not exist on the type"
      - "500 Internal Server Error, because an invalid document crashes the executor"
    answer: 1
    explanation: |
      Under application/graphql-response+json, a well-formed JSON body carrying an invalid
      GraphQL document (parse, validation, or variable-coercion failure) returns 422
      Unprocessable Content because execution never began. 400 is for malformed JSON/missing
      params; 200 is reserved for documents that validated and then hit execution errors.
    ref: "concepts.md#graphql-over-http-status-codes"

  - id: rest-vs-graphql-vs-grpc-052
    difficulty: expert
    tags: [graphql, graphql-over-http, status-codes, execution]
    question: |
      Using application/graphql-response+json, a query passes validation, begins executing,
      and one non-null resolver throws (so data is partial and errors is populated). What
      status does the spec prescribe, and why does it differ from a validation failure?
    options:
      - "422 Unprocessable Content, because any populated errors array means the request was unprocessable"
      - "200 OK, because a field-level execution error is not a transport/document error — execution began and produced partial data"
      - "400 Bad Request, because a resolver throwing means the client sent a malformed request"
      - "207 Multi-Status, to signal that some fields succeeded while others failed in one body"
    answer: 1
    explanation: |
      Once a document validates and execution begins, field-level errors return 200 with
      partial data plus errors. The 422 case applies only before execution (invalid
      document). The spec draws the line at "did execution start" — validation failures
      (422) never execute; execution errors (200) do.
    ref: "concepts.md#graphql-over-http-status-codes"

  - id: rest-vs-graphql-vs-grpc-053
    difficulty: advanced
    tags: [graphql, graphql-over-http, methods]
    question: |
      Under the GraphQL-over-HTTP spec, a client attempts to send a mutation via an HTTP GET
      request. What is the correct server response?
    options:
      - "200 OK — GET is permitted for queries and mutations alike under the spec"
      - "405 Method Not Allowed — GET is reserved for safe operations, so mutations may not use it"
      - "301 Moved Permanently, redirecting the client to resend the mutation via POST"
      - "422 Unprocessable Content, treating the mutation-over-GET as an invalid document"
    answer: 1
    explanation: |
      GET must be side-effect-free, so only queries may use it (which also enables caching).
      Attempting a mutation over GET yields 405 Method Not Allowed. This mirrors REST's
      treatment of GET as a safe method under RFC 9110.
    ref: "concepts.md#graphql-over-http-status-codes"

  - id: rest-vs-graphql-vs-grpc-054
    difficulty: advanced
    tags: [graphql, graphql-over-http, legacy]
    question: |
      Why does the claim "GraphQL always returns HTTP 200" remain partly true in practice
      despite the newer status-code rules?
    options:
      - "Because the HTTP standard forbids GraphQL endpoints from ever emitting 4xx status codes"
      - "Because clients using the legacy application/json media type keep the old always-200 behavior; the richer status codes apply to application/graphql-response+json"
      - "Because CDNs at the edge rewrite every GraphQL response's status line back to 200"
      - "Because the GraphQL-over-HTTP spec was never implemented by any real-world server"
    answer: 1
    explanation: |
      The always-200 behavior is the legacy path tied to the application/json response media
      type. The GraphQL-over-HTTP spec introduces proper status semantics (400/422/405/200)
      only under the new application/graphql-response+json media type, so both behaviors
      coexist depending on what the client negotiates.
    ref: "concepts.md#graphql-over-http-status-codes"

  - id: rest-vs-graphql-vs-grpc-055
    difficulty: expert
    tags: [graphql, federation, entities]
    question: |
      In a federated GraphQL supergraph, a Product type is owned by the Catalog subgraph but
      the Reviews subgraph needs to add a reviews field to it. How does the router resolve a
      Product's reviews when a client queries both catalog fields and reviews in one request?
    options:
      - "It rejects the query with a composition error, because a single GraphQL type is not permitted to have its fields owned by two different subgraphs"
      - "It uses Product's @key to fetch the entity from Catalog, then calls Reviews' reference resolver via the _entities field with that key to get reviews"
      - "It continuously replicates the entire Product table into the Reviews service's own database so Reviews can join locally"
      - "It fully merges the two subgraph schemas at build time and inlines the data, so no cross-service runtime calls ever occur"
    answer: 1
    explanation: |
      Federation stitches shared types via entities: Catalog declares Product with a @key,
      Reviews extends the entity contributing reviews. The router builds a query plan, fetches
      Product from Catalog, then resolves the reference in Reviews through the _entities root
      field (a reference resolver that takes the @key and returns the object).
    ref: "concepts.md#graphql-federation-and-supergraphs"

  - id: rest-vs-graphql-vs-grpc-056
    difficulty: advanced
    tags: [graphql, federation, architecture]
    question: |
      What distinguishes modern GraphQL federation from the older schema-stitching approach
      for scaling a graph across many teams?
    options:
      - "Schema stitching transmits subgraph data as binary Protobuf while federation standardizes on JSON responses between services"
      - "In federation each subgraph declares its own boundaries (@key/entities) and a composition step builds the supergraph, so ownership lives with each team; stitching centralizes merge logic in the gateway"
      - "Federation mandates that every participating team share a single centralized database so the supergraph can join across them"
      - "Schema stitching natively supports GraphQL subscriptions across services, whereas federation is limited to queries and mutations only"
    answer: 1
    explanation: |
      Federation pushes boundary declarations (keys, entity extensions) into each subgraph and
      composes them into a supergraph, so teams own their slice independently. Schema stitching
      keeps the merge/type-resolution logic in the gateway, which scales poorly across many
      teams. Apollo Federation v2 and the vendor-neutral Composite Schemas spec formalize this.
    ref: "concepts.md#graphql-federation-and-supergraphs"

  - id: rest-vs-graphql-vs-grpc-057
    difficulty: expert
    tags: [graphql, security, persisted-queries]
    question: |
      A team says "we enabled Automatic Persisted Queries (APQ), so arbitrary/expensive
      queries can no longer be run." Why is this reasoning flawed?
    options:
      - "APQ operates only over binary gRPC transports and therefore never sees the arbitrary queries a normal HTTP client would send"
      - "APQ is a transmission/performance optimization — on a cache miss the server registers whatever query the client sends, so arbitrary queries still execute; it is not an allowlist"
      - "APQ replaces the schema with a static hash table, so no ad-hoc queries can be parsed or run against the graph at all"
      - "APQ depends on HTTP/3 and QUIC transport, which the team has not deployed, so the hashing never actually takes effect"
    answer: 1
    explanation: |
      APQ lets clients send a hash and register the full query on a miss — it shrinks payloads
      and enables GET caching, but the server registers whatever is sent, so arbitrary queries
      still run. Security comes from trusted documents/safelisting: a build-time manifest of
      allowed operations that the server enforces, rejecting anything not on the list.
    ref: "concepts.md#persisted-queries-versus-trusted-documents"

  - id: rest-vs-graphql-vs-grpc-058
    difficulty: expert
    tags: [graphql, security, authorization, owasp]
    question: |
      Why can't GraphQL authorization be enforced purely at the endpoint the way a REST route
      can, and what does OWASP API Security Top 10 (2023) call the risk this creates?
    options:
      - "It can be enforced entirely at the single endpoint via route middleware, exactly like a REST controller, so there is no practical difference from REST"
      - "One endpoint serves every field and a single query can traverse from a permitted object into a related forbidden one, so authz must be per-field/resolver — the risk maps to API1 Broken Object Level Authorization (BOLA)"
      - "GraphQL has no notion of an authenticated principal in its execution context, so per-user authorization decisions are impossible to express"
      - "The risk is classified as API9 Improper Inventory Management because undocumented fields leak through introspection"
    answer: 1
    explanation: |
      Because a single POST /graphql serves all fields, route-level checks can't stop a query
      that walks from an authorized object into a related unauthorized one. Authorization must
      be enforced per field/resolver against the specific object. Getting this wrong is BOLA
      (API1), the top OWASP API risk.
    ref: "concepts.md#graphql-security-beyond-query-cost"

  - id: rest-vs-graphql-vs-grpc-059
    difficulty: expert
    tags: [graphql, security, batching, rate-limiting]
    question: |
      A GraphQL endpoint rate-limits by counting HTTP requests. An attacker sends one request
      containing many aliased fields (a: login(...) b: login(...) c: login(...) ...). What is
      the vulnerability and the correct fix?
    options:
      - "There is no vulnerability; field aliases are purely a cosmetic response-key rename and cannot invoke a resolver more than once"
      - "A batching attack — aliases pack many logical operations into one HTTP request, bypassing per-request limits; rate-limit on operation count/query cost instead"
      - "The duplicated aliases fail schema validation and return a 422, so the attack is inherently self-limiting and needs no fix"
      - "The correct fix is to disable JSON response bodies and switch the endpoint to binary Protobuf so aliases cannot be expressed"
    answer: 1
    explanation: |
      Aliases (and array-batched operations) let one HTTP request perform many operations,
      defeating per-request rate limits and enabling credential stuffing or enumeration. The
      fix is to rate-limit on operation count / query cost rather than HTTP request count.
    ref: "concepts.md#graphql-security-beyond-query-cost"

  - id: rest-vs-graphql-vs-grpc-060
    difficulty: expert
    tags: [grpc, status-codes, retries]
    question: |
      A gRPC call returns UNAVAILABLE (14). A separate call to another method returns
      FAILED_PRECONDITION (9). How should a client's retry logic differ between the two?
    options:
      - "Retry both codes immediately with the identical request parameters, since gRPC guarantees every status code is safely and automatically retryable"
      - "Retry UNAVAILABLE (transient; operation likely didn't run) with backoff, but do NOT retry FAILED_PRECONDITION until the blocking system state is fixed"
      - "Retry FAILED_PRECONDITION immediately because it is transient, but never retry UNAVAILABLE because it signals a permanent unrecoverable failure"
      - "Neither code is ever retryable in gRPC; both must be surfaced to the caller as terminal errors requiring manual intervention"
    answer: 1
    explanation: |
      UNAVAILABLE is transient (server down / dropped connection); the op likely never ran, so
      retry the same call with backoff. FAILED_PRECONDITION means the system state forbids the
      call until something changes, so retrying without fixing that state just fails again.
    ref: "concepts.md#grpc-status-codes-and-retry-semantics"

  - id: rest-vs-graphql-vs-grpc-061
    difficulty: expert
    tags: [grpc, status-codes, semantics]
    question: |
      What is the precise distinction between INVALID_ARGUMENT (3) and FAILED_PRECONDITION (9)
      in gRPC?
    options:
      - "They are exact synonyms that carry identical semantics and differ only in the numeric code assigned to each by the spec"
      - "INVALID_ARGUMENT means the argument is bad regardless of system state (retry never helps); FAILED_PRECONDITION means the argument is fine but the current system state forbids the operation until it changes"
      - "INVALID_ARGUMENT is reserved exclusively for streaming RPCs, while FAILED_PRECONDITION may only ever be returned from unary calls"
      - "FAILED_PRECONDITION is always safely retryable, whereas INVALID_ARGUMENT is never retryable because it is inherently a transient condition"
    answer: 1
    explanation: |
      INVALID_ARGUMENT is a problem with the argument itself, independent of state — a retry
      with the same argument can never succeed. FAILED_PRECONDITION means the argument is fine
      but the system isn't in a state that permits the call (e.g. rmdir on a non-empty dir);
      it can succeed later once state changes. ABORTED is the concurrency-conflict cousin.
    ref: "concepts.md#grpc-status-codes-and-retry-semantics"

  - id: rest-vs-graphql-vs-grpc-062
    difficulty: expert
    tags: [grpc, deadlines, cancellation, idempotency]
    question: |
      A client calls a gRPC write RPC, hits its deadline, and receives DEADLINE_EXCEEDED — but
      the server actually committed the write. What principle explains this, and how do you
      make it safe?
    options:
      - "It is a known defect in the gRPC deadline machinery; upgrading to the latest library release makes the client and server timeouts agree exactly"
      - "Client and server make independent local success determinations, so a client timeout says nothing about server commit; make the RPC idempotent (dedupe/idempotency key) so a retry doesn't double-apply"
      - "gRPC automatically issues a rollback of the committed write whenever the call is cancelled, so in reality nothing was ever persisted on the server"
      - "The server violated the spec by not returning ABORTED on timeout, and there is fundamentally no way to make a write RPC safe under deadlines"
    answer: 1
    explanation: |
      gRPC clients and servers determine success independently and can disagree — a client-side
      DEADLINE_EXCEEDED/UNAVAILABLE does not mean the server did nothing. Cancellation also does
      not roll back side effects. Safety requires designing idempotency (dedupe keys) so retries
      don't double-apply the write.
    ref: "concepts.md#grpc-deadlines-cancellation-and-metadata"

  - id: rest-vs-graphql-vs-grpc-063
    difficulty: advanced
    tags: [grpc, deadlines, propagation]
    question: |
      Service A calls B with a 1s deadline; B spends 200ms then calls C. In a correct gRPC
      deadline-propagation setup, what deadline does C effectively get?
    options:
      - "A fresh, full 1s deadline that resets at each hop and is completely independent of the time already consumed in A's budget"
      - "Roughly the remaining budget (~800ms), because deadlines are absolute and propagate the remaining time down the call chain"
      - "No deadline at all; once B initiates the downstream call, C is free to run unbounded until it finishes on its own"
      - "Exactly 200ms, which is the amount of wall-clock time that B had already spent processing before it called C"
    answer: 1
    explanation: |
      gRPC deadlines are absolute points in time and propagate: each downstream inherits the
      remaining budget. With ~200ms elapsed, C gets ~800ms, so the whole call tree stops wasting
      work once the original deadline passes — far stronger than REST's non-propagating client
      timeouts.
    ref: "concepts.md#grpc-deadlines-cancellation-and-metadata"

  - id: rest-vs-graphql-vs-grpc-064
    difficulty: advanced
    tags: [grpc, metadata]
    question: |
      Which statement about gRPC metadata is correct?
    options:
      - "Metadata keys are restricted to a fixed, closed enumeration of names defined by the gRPC specification and cannot be extended by applications"
      - "Keys ending in -bin carry binary values, the grpc- prefix is reserved for the library, and auth tokens typically ride in metadata"
      - "Metadata may only ever be attached and sent by servers on the response path, and clients have no mechanism to send metadata on a request"
      - "Metadata is encrypted under a separate key from the rest of the HTTP/2 connection, so it stays confidential even without TLS on the channel"
    answer: 1
    explanation: |
      Metadata is key/value pairs (the gRPC analog of HTTP headers). Keys ending in -bin carry
      binary (base64 on the wire), the grpc- prefix is reserved for gRPC itself, and bearer
      tokens/auth credentials are conventionally passed as metadata.
    ref: "concepts.md#grpc-deadlines-cancellation-and-metadata"

  - id: rest-vs-graphql-vs-grpc-065
    difficulty: expert
    tags: [protobuf, wire-format, encoding]
    question: |
      In the Protobuf wire format, how is each field's key encoded, and why does this make
      field numbers (not names) the wire identity?
    options:
      - "As the field's UTF-8 name written out literally, followed by a colon separator, much like a key in a JSON object"
      - "As a varint computed as (field_number << 3) | wire_type — the number and a 3-bit wire type are packed into the tag, so names never appear on the wire"
      - "As a fixed 4-byte big-endian hash computed from the field's name so that renaming a field never changes its wire key"
      - "As the ordinal position index at which the field is declared in the .proto file, so reordering fields would break the wire format"
    answer: 1
    explanation: |
      Each field is prefixed by a key = (field_number << 3) | wire_type. The field number and a
      3-bit wire type are packed into one varint tag; names are compiled away. That is why
      renumbering a field corrupts data and why low field numbers (1–15, one-byte tags) go to
      hot fields.
    ref: "concepts.md#protobuf-wire-format-and-field-presence"

  - id: rest-vs-graphql-vs-grpc-066
    difficulty: expert
    tags: [protobuf, proto3, field-presence]
    question: |
      Explain the proto3 problem that the optional keyword was reintroduced to solve.
    options:
      - "The optional keyword promotes a field to being validated as required at runtime, so decoding fails if the sender omits it"
      - "proto3 originally dropped explicit presence for scalars — a field set to its default (0/empty/false) was indistinguishable from unset and defaults weren't serialized; optional restores per-field presence tracking so you can tell 'explicitly 0' from 'not set'"
      - "The optional keyword switches that individual field from Protobuf binary encoding over to a JSON representation on the wire"
      - "The optional keyword changes the field's wire type to length-delimited so that its presence can be inferred from the byte length"
    answer: 1
    explanation: |
      proto3 scalars couldn't distinguish a default value from an unset field (defaults aren't
      put on the wire), breaking patch semantics and 0-vs-absent checks. The optional keyword
      (via a synthetic oneof) restores presence tracking so the reader can tell an explicitly
      set default from an omitted field.
    ref: "concepts.md#protobuf-wire-format-and-field-presence"

  - id: rest-vs-graphql-vs-grpc-067
    difficulty: expert
    tags: [protobuf, evolution, compatibility]
    question: |
      Which Protobuf field type change is wire-compatible (safe) versus one that silently
      corrupts readers?
    options:
      - "int32 -> string is the wire-compatible change while int32 -> int64 silently corrupts readers, because widening the integer overflows the varint"
      - "int32 -> int64 (and bool) is wire-compatible; int32 -> sint32 or int32 -> string is NOT, because sint32 uses ZigZag and string uses a different wire type"
      - "Every field type change is completely safe as long as the field's declared name is kept identical across the two schema versions"
      - "No Protobuf field type change is ever safe under any circumstances, so a new field number must always be allocated instead"
    answer: 1
    explanation: |
      int32/int64/uint32/bool share the varint wire type and interconvert safely; sint32/sint64
      also pair. But int32 -> sint32 differs because sint uses ZigZag encoding, and int32 ->
      string changes the wire type entirely — both silently misread existing data. Field names
      are irrelevant on the wire; numbers and wire types are what matter.
    ref: "concepts.md#protobuf-wire-format-and-field-presence"

  - id: rest-vs-graphql-vs-grpc-068
    difficulty: expert
    tags: [grpc, http2, framing, trailers]
    question: |
      In gRPC over HTTP/2, where does a successful unary call convey its grpc-status, and why
      does this design block browsers from speaking native gRPC?
    options:
      - "In the initial response HEADERS frame sent before the body, but browsers strip that header for cross-origin security reasons"
      - "In a trailing HEADERS frame (HTTP/2 trailers) after the DATA frames — and fetch/XHR expose no access to trailers, so browser JS can't read grpc-status"
      - "Appended to the request URL as a query-string parameter, which browsers silently strip before the request is sent"
      - "Published in a DNS TXT record that the client must resolve before each call in order to learn the outcome status"
    answer: 1
    explanation: |
      gRPC puts grpc-status/grpc-message in trailing HEADERS (HTTP/2 trailers) after the DATA
      frames. Browser fetch/XHR give no access to trailers or fine-grained frame control, so a
      browser can't read the call outcome or drive request streams — hence gRPC-Web/Connect/
      proxies are needed.
    ref: "concepts.md#grpc-over-http2-framing"

  - id: rest-vs-graphql-vs-grpc-069
    difficulty: advanced
    tags: [grpc, http2, framing, message]
    question: |
      Within a gRPC DATA frame, how is each message length-prefixed on the wire?
    options:
      - "A bare 2-byte little-endian length field only, with no leading compression flag byte"
      - "A 1-byte compressed flag followed by a 4-byte big-endian length, then the payload"
      - "A varint-encoded length prefix followed by a trailing CRC32 checksum over the body"
      - "A short JSON header describing the payload size, prepended before the binary message"
    answer: 1
    explanation: |
      Each gRPC message in a DATA frame is framed as a 1-byte compressed flag + 4-byte
      big-endian length prefix + the serialized payload. Streaming simply sends more such
      length-prefixed messages across DATA frames on the same stream.
    ref: "concepts.md#grpc-over-http2-framing"

  - id: rest-vs-graphql-vs-grpc-070
    difficulty: advanced
    tags: [grpc, browser, connect, transcoding]
    question: |
      Beyond gRPC-Web + Envoy, which approach lets browsers call a gRPC-compatible service
      directly over HTTP/1.1 with no proxy?
    options:
      - "The Connect protocol (Buf), which runs over HTTP/1.1 and HTTP/2 and is browser-callable for unary and server-streaming without a proxy"
      - "Running the gRPC service directly over raw UDP datagrams that the browser opens with a low-level socket API"
      - "Enabling server reflection/introspection on the gRPC server so the browser can auto-generate a compatible client at runtime"
      - "Serving the .proto contract file to the browser at build time so it can encode and decode the binary frames itself"
    answer: 0
    explanation: |
      Connect is a gRPC-compatible protocol callable directly from browsers over HTTP/1.1 or
      HTTP/2 (unary + server-streaming) with no proxy, while the same server can still speak
      gRPC and gRPC-Web. gRPC transcoding via google.api.http is the other bridge (a REST/JSON
      facade over gRPC).
    ref: "concepts.md#exposing-grpc-to-browsers-beyond-grpc-web"

  - id: rest-vs-graphql-vs-grpc-071
    difficulty: advanced
    tags: [grpc, cdn, read-heavy, scenario]
    question: |
      Read-heavy data is served by an internal gRPC service and you want CDN caching for
      public clients. Why can't you put the gRPC service behind a CDN, and what do you do
      instead?
    options:
      - "You can cache gRPC responses at the CDN directly simply by enabling gzip compression on the channel so edges store the compressed frames"
      - "Every gRPC call is an opaque binary POST-like exchange with trailers — nothing safe/cacheable to key on; transcode/expose those reads as REST GET (or GraphQL persisted GET) at the edge so the CDN can cache them"
      - "gRPC's open-source license explicitly prohibits intermediary caching, so you must switch the read path over to a SOAP/XML service instead"
      - "CDN edge nodes are only able to cache responses served over HTTP/1.1, so you must downgrade the gRPC service off HTTP/2 first"
    answer: 1
    explanation: |
      gRPC calls are binary, POST-like, and carry status in trailers — there's no safe,
      URL-keyed GET for a shared cache to store. For cacheable reads, expose a REST GET (via
      gRPC transcoding) or a GraphQL persisted GET at the edge and keep gRPC for internal
      writes/streams.
    ref: "concepts.md#exposing-grpc-to-browsers-beyond-grpc-web"

  - id: rest-vs-graphql-vs-grpc-072
    difficulty: advanced
    tags: [grpc, load-balancing, operational]
    question: |
      Why does gRPC often use client-side load balancing / name resolution rather than relying
      solely on a single L4 proxy the way simple REST setups might?
    options:
      - "Because gRPC traffic is fundamentally incapable of being routed or forwarded by any proxy layer, whether operating at L4 or L7"
      - "Long-lived multiplexed HTTP/2 connections would get pinned to one backend by a naive L4 LB, so gRPC clients resolve many backends and balance requests across them in-process (round-robin, or via an xDS control plane)"
      - "Because the gRPC protocol has no notion of more than one server instance, so a client can only ever address a single fixed backend"
      - "Because reading the grpc-status carried in HTTP/2 trailers is only possible when the client itself performs the load-balancing decision"
    answer: 1
    explanation: |
      A single long-lived HTTP/2 connection carrying many multiplexed calls would stick to one
      backend under an L4 LB, defeating balancing. gRPC clients therefore resolve a name to many
      backends and distribute individual RPCs across them in-process (pick-first/round-robin, or
      lookaside/xDS), unlike a typical REST-through-one-proxy model.
    ref: "concepts.md#grpc-operational-surface"

  - id: rest-vs-graphql-vs-grpc-073
    difficulty: expert
    tags: [error-models, comparison, rfc-9457]
    question: |
      Contrasting the three error models, which mapping is correct?
    options:
      - "REST carries its error category in a grpc-status trailer; GraphQL surfaces it in the HTTP status line; and gRPC returns it inside a top-level JSON errors array in the body"
      - "REST signals via HTTP status + RFC 9457 Problem Details (application/problem+json); GraphQL via a top-level errors array (often extensions.code) usually under HTTP 200; gRPC via a numeric grpc-status (0–16) in trailers with google.rpc.Status details"
      - "All three converge on RFC 9457 Problem Details (application/problem+json) as one shared error envelope, with the category carried identically in a top-level code field on every response"
      - "Only gRPC can express partial success; REST and GraphQL have no way whatsoever to represent structured error detail and can only return an opaque status line"
    answer: 1
    explanation: |
      REST uses the HTTP status code as the primary signal and RFC 9457 (which obsoletes 7807)
      for structured JSON detail. GraphQL usually returns 200 with an errors array (category in
      extensions.code) and supports partial data. gRPC uses a numeric status in trailers with
      typed google.rpc.Status details.
    ref: "concepts.md#comparing-the-three-error-models"

  - id: rest-vs-graphql-vs-grpc-074
    difficulty: advanced
    tags: [http2, http3, rest, round-trips]
    question: |
      What's wrong with the mental model "REST is stuck on HTTP/1.1 round trips while gRPC owns
      HTTP/2"?
    options:
      - "Nothing is wrong with it — REST is architecturally locked to HTTP/1.1 and physically cannot be served over HTTP/2 or HTTP/3, so every REST call pays a fresh connection round trip"
      - "REST runs fine over HTTP/2 and HTTP/3 — multiplexing removes much of the connection-level round-trip penalty — while gRPC is the one actually pinned to HTTP/2; REST is version-agnostic and benefits from newer transports transparently"
      - "gRPC is actually pinned to HTTP/1.1 rather than HTTP/2, so it is REST that gains multiplexing and header compression from the newer HTTP versions"
      - "HTTP/3's QUIC-over-UDP transport adds so much handshake overhead that it makes REST measurably slower than it was on plain HTTP/1.1"
    answer: 1
    explanation: |
      REST is transport-version-agnostic: over HTTP/2 its requests multiplex on one connection
      (erasing much HTTP/1.1 head-of-line blocking), and HTTP/3 (RFC 9114, QUIC over UDP) removes
      TCP head-of-line blocking. gRPC is the one that requires HTTP/2 semantics. The round-trip
      penalty of under-fetching is about server calls, not raw connection overhead.
    ref: "concepts.md#http-versions-and-the-round-trip-story"

  - id: rest-vs-graphql-vs-grpc-075
    difficulty: expert
    tags: [idempotency, retries, comparison, rfc-9110]
    question: |
      A team enables blanket automatic retries on UNAVAILABLE for all their gRPC methods,
      reasoning "REST PUT is idempotent so gRPC calls must be too." Why is this unsafe?
    options:
      - "Every gRPC method is guaranteed idempotent by the framework's exactly-once delivery layer, so blanket automatic retries on UNAVAILABLE are always completely safe"
      - "gRPC has no built-in idempotency — a method's name doesn't imply safety, and independent success determination means a client UNAVAILABLE may hide a committed write; you must design idempotency (dedupe keys) before enabling retries"
      - "Automatic retries are impossible in gRPC because the protocol forbids resending any message once its HTTP/2 stream has been closed by either peer"
      - "The premise holds up fine because PUT is not actually idempotent in REST either, so gRPC is no worse off than the REST verbs the team is copying"
    answer: 1
    explanation: |
      REST bakes idempotency into verbs (GET/PUT/DELETE idempotent per RFC 9110), but gRPC has
      no such guarantee — the method name tells you nothing. With independent success
      determination, a client-side UNAVAILABLE can mask a committed side effect, so retries need
      designed idempotency (dedupe/idempotency keys) to avoid double-applying.
    ref: "concepts.md#idempotency-and-retry-safety-compared"

  - id: rest-vs-graphql-vs-grpc-076
    difficulty: intermediate
    tags: [decision, matrix, iot]
    question: |
      For low-bandwidth IoT devices streaming telemetry to a backend you fully control, which
      paradigm and deciding factor fit best?
    options:
      - "REST over HTTP/1.1, because constrained IoT devices depend on shared CDN edge caching of their telemetry uploads to conserve their limited bandwidth"
      - "gRPC — compact Protobuf frames plus first-class streaming with flow control, and you own both ends"
      - "GraphQL, because low-power sensors need to send client-defined query shapes describing exactly which telemetry fields the backend should store"
      - "SOAP with WS-ReliableMessaging, because its verbose XML envelopes give the smallest possible frames for bandwidth-constrained sensors"
    answer: 1
    explanation: |
      Constrained/low-bandwidth devices benefit from compact Protobuf and gRPC's efficient
      HTTP/2 streaming with backpressure; controlling both ends removes the browser-reach and
      HTTP-caching concerns that would favor REST/GraphQL.
    ref: "concepts.md#use-case-to-paradigm-decision-matrix"

  - id: rest-vs-graphql-vs-grpc-077
    difficulty: intermediate
    tags: [performance, payload, nuance]
    question: |
      Which statement about payload size is most accurate?
    options:
      - "Protobuf is always exactly 10x smaller than the equivalent JSON in every case, regardless of the data shape or whether compression is applied"
      - "Protobuf is roughly 30–50% smaller than equivalent JSON, but gzip/brotli-compressed JSON narrows the gap, so serialization CPU cost often matters more than raw bytes"
      - "Gzip- or brotli-compressed JSON is always strictly smaller on the wire than the equivalent Protobuf, because text compresses better than an already-binary format"
      - "JSON and Protobuf produce byte-for-byte identical payload sizes, since both ultimately serialize the same field values down to the same wire representation"
    answer: 1
    explanation: |
      Protobuf is typically ~30–50% smaller than raw JSON, but once JSON is gzip/brotli
      compressed the size gap shrinks substantially; on compressed links the (de)serialization
      CPU cost frequently dominates the decision more than wire bytes alone.
    ref: "concepts.md#performance-nuance-beyond-raw-speed"

  - id: rest-vs-graphql-vs-grpc-078
    difficulty: expert
    tags: [governance, contracts, ci, breaking-changes]
    question: |
      A gRPC team wants CI to fail any change that renumbers or removes a Protobuf field before
      it ships. What tooling/practice enforces the "mandatory contract" claim in practice?
    options:
      - "Manual code review by a senior engineer is the only option, because no automated tool can diff two .proto files to detect renumbered or removed fields before merge"
      - "A breaking-change checker like buf breaking (backed by a schema registry such as the Buf Schema Registry) that diffs the proposed schema against the last published one and fails on incompatible changes"
      - "Having the server return HTTP 422 Unprocessable Content at runtime whenever an old client sends a request built against the renumbered field, so the incompatibility is caught in production"
      - "Enabling gRPC server reflection in production so that CI can introspect the live schema and automatically reject any client compiled against a removed field"
    answer: 1
    explanation: |
      Contracts are only 'mandatory' if enforced. buf breaking diffs the new .proto against the
      last published schema (in the Buf Schema Registry) and fails CI on incompatible changes
      like renumbered/removed fields or type swaps. GraphQL has analogous schema-diff checks
      against a registry; consumer-driven contracts (Pact) complement static diffs.
    ref: "concepts.md#contract-governance-and-breaking-change-checks"
