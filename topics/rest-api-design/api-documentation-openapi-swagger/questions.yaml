topic: "API Documentation & Design-First with OpenAPI"
domain: rest-api-design
topic_slug: api-documentation-openapi-swagger
version: 1
questions:
  - id: api-documentation-openapi-swagger-001
    difficulty: beginner
    tags: [openapi, swagger, terminology]
    question: |
      Which statement most accurately describes the relationship between
      "OpenAPI" and "Swagger" today?
    options:
      - "OpenAPI is the specification; Swagger is a family of tools (UI, Editor, Codegen) and the legacy name of the spec"
      - "OpenAPI is a toolset; Swagger is the specification standard"
      - "They are two competing, incompatible specifications"
      - "Swagger is the JSON dialect and OpenAPI is the YAML dialect of the same file"
    answer: 0
    explanation: |
      OpenAPI is the vendor-neutral specification (governed by the OpenAPI
      Initiative). Swagger is SmartBear's toolset (Swagger UI, Editor, Codegen)
      and the old name of the spec (Swagger 2.0 = OpenAPI 2.0).
    ref: "concepts.md#openapi-vs-swagger"

  - id: api-documentation-openapi-swagger-002
    difficulty: beginner
    tags: [swagger, history, versions]
    question: |
      "Swagger 2.0" is another name for which specification version?
    options:
      - "OpenAPI 3.0"
      - "OpenAPI 2.0"
      - "OpenAPI 3.1"
      - "JSON Schema Draft 4"
    answer: 1
    explanation: |
      The format was called the Swagger Specification before being donated to the
      OpenAPI Initiative in 2015. Swagger 2.0 is the same document format now known
      as OpenAPI 2.0; version 3.x onward is called the OpenAPI Specification.
    ref: "concepts.md#openapi-vs-swagger"

  - id: api-documentation-openapi-swagger-003
    difficulty: beginner
    tags: [swagger-ui, tooling]
    question: |
      What does Swagger UI do?
    options:
      - "Enforces authentication on your API endpoints at runtime"
      - "Compiles OpenAPI YAML into a running server"
      - "Renders an OpenAPI document as interactive HTML documentation"
      - "Stores API keys in a secure vault"
    answer: 2
    explanation: |
      Swagger UI reads an OpenAPI document and renders it as browsable, interactive
      documentation (including a "Try it out" feature). It does not enforce auth or
      run your API — it only visualizes the spec.
    ref: "concepts.md#openapi-vs-swagger"

  - id: api-documentation-openapi-swagger-004
    difficulty: intermediate
    tags: [design-first, workflow]
    question: |
      In a design-first (contract-first) workflow, what is the source of truth?
    options:
      - "The running server implementation"
      - "The generated client SDK"
      - "The database schema"
      - "The hand-authored OpenAPI document, which the implementation must conform to"
    answer: 3
    explanation: |
      Design-first means the OpenAPI document is written and agreed upon first; the
      server is then implemented to match it. The spec is authoritative and code
      conforms to it.
    ref: "concepts.md#design-first-vs-code-first"

  - id: api-documentation-openapi-swagger-005
    difficulty: intermediate
    tags: [code-first, workflow, drift]
    question: |
      A team writes annotated server code and a library generates the OpenAPI doc
      at build time. This is code-first. What is its primary risk?
    options:
      - "API design becomes an afterthought driven by implementation details, and consumers can't review the contract before it's built"
      - "The spec can never match the code"
      - "It is impossible to generate client SDKs from the resulting spec"
      - "The generated spec is always in a proprietary binary format"
    answer: 0
    explanation: |
      Code-first guarantees the spec matches this code, but the API shape emerges
      from implementation choices rather than deliberate design, and consumers only
      see the contract after it's implemented, losing early feedback and parallel
      development.
    ref: "concepts.md#design-first-vs-code-first"

  - id: api-documentation-openapi-swagger-006
    difficulty: intermediate
    tags: [design-first, parallel-development]
    question: |
      Which benefit is most directly enabled by adopting design-first?
    options:
      - "The server automatically scales horizontally"
      - "Frontend and mobile teams can develop against a mock derived from the agreed spec before the backend exists"
      - "TLS is configured for you"
      - "Database migrations are generated"
    answer: 1
    explanation: |
      Because the contract is agreed up front, consumers can generate clients and
      mock the API immediately, working in parallel with backend implementation
      instead of waiting for it.
    ref: "concepts.md#design-first-vs-code-first"

  - id: api-documentation-openapi-swagger-007
    difficulty: advanced
    tags: [design-first, misconception]
    question: |
      Which statement about design-first is correct?
    options:
      - "Design-first forbids generating any code from the spec"
      - "Design-first only works with OpenAPI 2.0"
      - "Design-first means the human-authored spec is authoritative; you still generate stubs and clients from it"
      - "Design-first eliminates the need for any contract testing"
    answer: 2
    explanation: |
      Design-first does not mean "never generate." It means the authored spec is the
      source of truth; server stubs and client SDKs are then generated from it. You
      still want contract tests to ensure the server actually conforms.
    ref: "concepts.md#design-first-vs-code-first"

  - id: api-documentation-openapi-swagger-008
    difficulty: intermediate
    tags: [mock-server, contract-driven]
    question: |
      How can a mock server produce responses directly from an OpenAPI document?
    options:
      - "It compiles the business logic embedded in the spec"
      - "It proxies to the production API"
      - "It cannot — mocks require a separate hand-written config only"
      - "It serves the declared examples, or generates values that match the response schema"
    answer: 3
    explanation: |
      Mock servers (Prism, Microcks, etc.) read the schema and examples in the spec
      and return either the declared example values or schema-conformant generated
      data — no backend implementation needed.
    ref: "concepts.md#contract-driven-development-and-mock-servers"

  - id: api-documentation-openapi-swagger-009
    difficulty: advanced
    tags: [mock-server, limitations]
    question: |
      A team relies on a schema-driven mock server for integration testing. Which
      limitation should they keep in mind?
    options:
      - "A schema-driven mock validates response shape, not business logic (e.g. it won't verify totals add up or that unknown ids return 404 unless scripted)"
      - "Mocks can only return HTTP 500 responses"
      - "Mocks require the production database to be online"
      - "Mocks always return the exact bytes the real server will return"
    answer: 0
    explanation: |
      Mocks de-risk shape mismatches and integration plumbing, but they do not
      enforce business rules. A mock will happily return schema-valid data that is
      logically impossible unless you explicitly script that behavior.
    ref: "concepts.md#contract-driven-development-and-mock-servers"

  - id: api-documentation-openapi-swagger-010
    difficulty: intermediate
    tags: [contract-testing, ci, drift]
    question: |
      What does a contract test in CI check?
    options:
      - "That the server has 100% code coverage"
      - "That the server's actual responses conform to the OpenAPI specification"
      - "That the database indexes are optimal"
      - "That the client renders the UI correctly"
    answer: 1
    explanation: |
      A contract test validates the running server's real responses against the
      spec. If the server returns an undeclared field or the wrong status code, the
      test fails — catching drift at build time.
    ref: "concepts.md#contract-driven-development-and-mock-servers"

  - id: api-documentation-openapi-swagger-011
    difficulty: beginner
    tags: [document-structure, root-fields]
    question: |
      Which two fields are required at the root of an OpenAPI 3.1 document?
    options:
      - "servers and paths"
      - "components and security"
      - "openapi and info"
      - "tags and externalDocs"
    answer: 2
    explanation: |
      Only `openapi` (the spec version string) and `info` (API metadata) are
      required at the root. In 3.1 the document must also contain at least one of
      `paths`, `components`, or `webhooks`.
    ref: "concepts.md#openapi-document-structure"

  - id: api-documentation-openapi-swagger-012
    difficulty: intermediate
    tags: [document-structure, versioning, gotcha]
    question: |
      In an OpenAPI document, what does the `info.version` field represent?
    options:
      - "The version of the OpenAPI specification format being used"
      - "The Swagger UI version"
      - "The semantic version of the JSON Schema dialect"
      - "The version of your API (e.g. 2.3.0), independent of the spec version"
    answer: 3
    explanation: |
      `info.version` is your API's version. The specification format version is the
      separate top-level `openapi` field (e.g. "3.1.0"). Conflating the two is a
      classic mistake.
    ref: "concepts.md#openapi-document-structure"

  - id: api-documentation-openapi-swagger-013
    difficulty: advanced
    tags: [document-structure, 3.1, webhooks]
    question: |
      In OpenAPI 3.1, which is true about a document that has no `paths` field?
    options:
      - "It is valid as long as it has at least one of `components` or `webhooks`"
      - "It is always invalid"
      - "It is valid only if it uses OpenAPI 2.0 syntax"
      - "It must instead define a top-level `endpoints` field"
    answer: 0
    explanation: |
      3.1 relaxed the 3.0 requirement that `paths` be present. A 3.1 document must
      contain at least one of `paths`, `components`, or `webhooks` — so a webhook-only
      or components-only document is valid.
    ref: "concepts.md#openapi-document-structure"

  - id: api-documentation-openapi-swagger-014
    difficulty: beginner
    tags: [paths, parameters]
    question: |
      A path parameter declared with `in: path` must have which property?
    options:
      - "deprecated: true"
      - "required: true"
      - "nullable: true"
      - "style: form"
    answer: 1
    explanation: |
      Path parameters are always required because they are part of the URL template;
      OpenAPI mandates `required: true` for any `in: path` parameter.
    ref: "concepts.md#paths-operations-and-parameters"

  - id: api-documentation-openapi-swagger-015
    difficulty: intermediate
    tags: [parameters, request-body]
    question: |
      In OpenAPI 3.x, how is a request body described?
    options:
      - "As a parameter with `in: body`"
      - "As a query parameter named `body`"
      - "As a separate `requestBody` object with content keyed by media type"
      - "It cannot be described at all"
    answer: 2
    explanation: |
      OpenAPI 3.x replaced 2.0's `in: body` parameter with a dedicated `requestBody`
      object whose `content` is keyed by media type (e.g. `application/json`). Only
      path, query, header, and cookie remain as parameter locations.
    ref: "concepts.md#paths-operations-and-parameters"

  - id: api-documentation-openapi-swagger-016
    difficulty: intermediate
    tags: [operations, operation-id, codegen]
    question: |
      Why should each operation have a stable, unique `operationId`?
    options:
      - "It controls the HTTP status code returned"
      - "It sets the rate limit for the endpoint"
      - "It determines the response media type"
      - "Code generators use it to name the client method, so it's part of the SDK contract"
    answer: 3
    explanation: |
      `operationId` becomes the generated client method name (e.g. `getOrder`).
      Renaming it is a breaking change for generated SDKs even when the HTTP contract
      is unchanged, so it should be stable and human-friendly.
    ref: "concepts.md#paths-operations-and-parameters"

  - id: api-documentation-openapi-swagger-017
    difficulty: beginner
    tags: [parameters, locations]
    question: |
      Which of these is NOT a valid `in` location for an OpenAPI parameter?
    options:
      - "body"
      - "query"
      - "header"
      - "cookie"
    answer: 0
    explanation: |
      The four parameter locations in OpenAPI 3.x are path, query, header, and
      cookie. `body` is not a parameter location — request payloads use the separate
      `requestBody` object.
    ref: "concepts.md#paths-operations-and-parameters"

  - id: api-documentation-openapi-swagger-018
    difficulty: intermediate
    tags: [responses, status-codes]
    question: |
      In the `responses` object, what does the `default` key represent?
    options:
      - "The response for HTTP 200 only"
      - "A response used for any status code not otherwise declared"
      - "The default request body"
      - "The default server URL"
    answer: 1
    explanation: |
      `default` describes the response for any status code not explicitly listed —
      commonly used to declare a shared error shape (e.g. an
      `application/problem+json` body) for all otherwise-undeclared errors.
    ref: "concepts.md#paths-operations-and-parameters"

  - id: api-documentation-openapi-swagger-019
    difficulty: beginner
    tags: [components, reuse]
    question: |
      What is the purpose of the `components` object?
    options:
      - "To deploy the API to multiple regions"
      - "To store runtime metrics"
      - "To hold reusable definitions (schemas, responses, parameters, etc.) that become active only when referenced via $ref"
      - "To configure the CI pipeline"
    answer: 2
    explanation: |
      `components` is a container of reusable definitions (schemas, responses,
      parameters, requestBodies, headers, securitySchemes, links, callbacks, and in
      3.1 pathItems). They have no effect until referenced with `$ref`.
    ref: "concepts.md#schema-components-and-ref-reuse"

  - id: api-documentation-openapi-swagger-020
    difficulty: beginner
    tags: [ref, reuse]
    question: |
      What does `{ $ref: '#/components/schemas/Order' }` do?
    options:
      - "Deletes the Order schema"
      - "Uploads a file named Order"
      - "Creates a new HTTP endpoint"
      - "References the reusable Order schema defined elsewhere in the document"
    answer: 3
    explanation: |
      `$ref` is a JSON Reference. The pointer `#/components/schemas/Order` links to
      the Order schema defined under components, letting you define it once and reuse
      it everywhere.
    ref: "concepts.md#schema-components-and-ref-reuse"

  - id: api-documentation-openapi-swagger-021
    difficulty: intermediate
    tags: [composition, json-schema]
    question: |
      In a JSON Schema / OpenAPI schema, what does `oneOf` require?
    options:
      - "The value matches exactly one of the listed subschemas"
      - "The value matches all listed subschemas"
      - "The value matches at least one subschema"
      - "The value matches none of the subschemas"
    answer: 0
    explanation: |
      `oneOf` requires the value to validate against exactly one subschema (mutually
      exclusive variants). `allOf` = all, `anyOf` = at least one, `not` = must not
      match.
    ref: "concepts.md#schema-components-and-ref-reuse"

  - id: api-documentation-openapi-swagger-022
    difficulty: advanced
    tags: [discriminator, polymorphism]
    question: |
      What role does a `discriminator` play alongside `oneOf`?
    options:
      - "It encrypts the payload"
      - "It names a property whose value selects which concrete schema applies, aiding dispatch in tools and generated code"
      - "It sets the HTTP method"
      - "It marks the schema as deprecated"
    answer: 1
    explanation: |
      A discriminator specifies a `propertyName` (and optional mapping) whose value
      tells tooling and generated code which concrete subschema an object conforms
      to — enabling clean polymorphic deserialization.
    ref: "concepts.md#schema-components-and-ref-reuse"

  - id: api-documentation-openapi-swagger-023
    difficulty: advanced
    tags: [ref, siblings, 3, 3.1]
    question: |
      Regarding keywords placed as siblings next to a `$ref` inside a Schema Object,
      what changed between OpenAPI 3.0 and 3.1?
    options:
      - "3.0 allowed siblings but 3.1 forbids them entirely"
      - "Both versions have always fully supported sibling keywords identically"
      - "In pure 3.0 sibling keywords next to $ref were ignored; 3.1 (aligned with JSON Schema 2020-12) allows them"
      - "Sibling keywords are only allowed in XML documents"
    answer: 2
    explanation: |
      Under classic JSON Reference used by 3.0, keywords beside a `$ref` (like
      `description`) were ignored. JSON Schema 2020-12, which 3.1 adopts, permits
      sibling keywords alongside `$ref` in Schema Objects — a real behavioral change.
    ref: "concepts.md#schema-components-and-ref-reuse"

  - id: api-documentation-openapi-swagger-024
    difficulty: intermediate
    tags: [3.1, json-schema, headline]
    question: |
      What is the headline change from OpenAPI 3.0 to 3.1?
    options:
      - "3.1 drops support for JSON entirely"
      - "3.1 removes the ability to describe request bodies"
      - "3.1 mandates XML for all payloads"
      - "3.1 aligns the Schema Object with JSON Schema 2020-12 as a full superset (3.0 used a custom subset of Draft 4)"
    answer: 3
    explanation: |
      OpenAPI 3.0 used a custom, not-fully-compatible subset of JSON Schema Draft 4.
      3.1 adopts JSON Schema 2020-12 fully, so a Schema Object is a valid JSON Schema
      — resolving long-standing compatibility friction.
    ref: "concepts.md#openapi-30-vs-31"

  - id: api-documentation-openapi-swagger-025
    difficulty: intermediate
    tags: [3.1, nullable]
    question: |
      In OpenAPI 3.1, how do you express that a string field may be null?
    options:
      - "type: [string, \"null\"]"
      - "nullable: true"
      - "optional: true"
      - "allowNull: yes"
    answer: 0
    explanation: |
      3.1 removed the custom `nullable` keyword. Following JSON Schema 2020-12,
      nullability is expressed with a type array that includes "null", e.g.
      `type: [string, "null"]`.
    ref: "concepts.md#openapi-30-vs-31"

  - id: api-documentation-openapi-swagger-026
    difficulty: advanced
    tags: [3.1, nullable, gotcha]
    question: |
      A developer writes `nullable: true` in an OpenAPI 3.1 document. What is the
      likely outcome?
    options:
      - "It works exactly as it did in 3.0"
      - "It is not a valid 3.1 keyword — it's a no-op that some validators reject; use a \"null\" entry in the type array instead"
      - "It automatically converts the field to a string"
      - "It makes the field required"
    answer: 1
    explanation: |
      `nullable` does not exist in 3.1. Depending on the tool it is ignored or
      flagged as an error. Nullability must be expressed via `type: [..., "null"]`.
    ref: "concepts.md#openapi-30-vs-31"

  - id: api-documentation-openapi-swagger-027
    difficulty: advanced
    tags: [3.1, exclusive-minimum]
    question: |
      How did `exclusiveMinimum`/`exclusiveMaximum` change from OpenAPI 3.0 to 3.1?
    options:
      - "They were removed entirely"
      - "In 3.1 they must be strings"
      - "In 3.0 they were booleans paired with minimum/maximum; in 3.1 they are numbers (the bound itself)"
      - "They were renamed to minExclusive/maxExclusive"
    answer: 2
    explanation: |
      3.0 (Draft 4 style) used `exclusiveMinimum: true` alongside `minimum`. JSON
      Schema 2020-12 (3.1) makes `exclusiveMinimum` a numeric value that directly
      states the exclusive bound.
    ref: "concepts.md#openapi-30-vs-31"

  - id: api-documentation-openapi-swagger-028
    difficulty: intermediate
    tags: [3.1, webhooks]
    question: |
      Which top-level field was added in OpenAPI 3.1 to describe out-of-band
      requests the API sends to consumers?
    options:
      - "callbacks"
      - "events"
      - "subscriptions"
      - "webhooks"
    answer: 3
    explanation: |
      3.1 added the root `webhooks` field: a map of requests initiated by the API
      (not in response to a client call) that a consumer may implement a receiver
      for.
    ref: "concepts.md#openapi-30-vs-31"

  - id: api-documentation-openapi-swagger-029
    difficulty: advanced
    tags: [3.1, patch-versions]
    question: |
      How should tooling treat the difference between OpenAPI 3.1.0 and 3.1.1?
    options:
      - "As semantically equivalent — patch versions should not be treated as spec changes by tooling"
      - "As a major incompatibility requiring a full rewrite"
      - "As two different specifications with different data models"
      - "3.1.1 is actually older than 3.1.0"
    answer: 0
    explanation: |
      Patch versions within 3.1.x (3.1.0, 3.1.1, 3.1.2) are semantically equivalent
      for tooling; a patch bump clarifies wording, not the data model, and should not
      be considered a breaking spec change.
    ref: "concepts.md#openapi-30-vs-31"

  - id: api-documentation-openapi-swagger-030
    difficulty: beginner
    tags: [servers]
    question: |
      What does the root `servers` array describe?
    options:
      - "The physical hardware specs of the API host"
      - "The base URLs where the API is served, optionally with variables"
      - "The list of allowed client IP addresses"
      - "The database connection strings"
    answer: 1
    explanation: |
      `servers` lists the base URLs (e.g. production, staging, regional) the API is
      available at, and can parameterize them with server variables. It tells clients
      where to send requests.
    ref: "concepts.md#servers-and-environments"

  - id: api-documentation-openapi-swagger-031
    difficulty: intermediate
    tags: [servers, 2, 3]
    question: |
      In OpenAPI 3.x, which single field replaced 2.0's separate `host`, `basePath`,
      and `schemes` fields?
    options:
      - "endpoints"
      - "hosts"
      - "servers"
      - "urls"
    answer: 2
    explanation: |
      3.0 unified `host` + `basePath` + `schemes` into a single `servers` array of
      full base URLs, which also supports variables and per-path/per-operation
      overrides.
    ref: "concepts.md#servers-and-environments"

  - id: api-documentation-openapi-swagger-032
    difficulty: advanced
    tags: [servers, gotcha]
    question: |
      Which statement about the `servers` field is correct?
    options:
      - "It routes and proxies traffic automatically"
      - "It enforces which regions users may call from"
      - "It configures TLS certificates"
      - "It is purely descriptive — it tells clients where to send requests but does not deploy or route anything"
    answer: 3
    explanation: |
      `servers` is documentation/metadata consumed by clients and tools (e.g. Swagger
      UI's Try-it-out). It does not deploy, route, or proxy — the actual
      infrastructure does that.
    ref: "concepts.md#servers-and-environments"

  - id: api-documentation-openapi-swagger-033
    difficulty: beginner
    tags: [security-schemes, types]
    question: |
      Which `type` would you use for a security scheme that passes a JWT in the
      Authorization header as a bearer token?
    options:
      - "type: http, scheme: bearer, bearerFormat: JWT"
      - "type: apiKey"
      - "type: oauth2"
      - "type: mutualTLS"
    answer: 0
    explanation: |
      HTTP bearer auth uses `type: http` with `scheme: bearer` and, optionally,
      `bearerFormat: JWT` to document that the token is a JWT.
    ref: "concepts.md#security-schemes"

  - id: api-documentation-openapi-swagger-034
    difficulty: intermediate
    tags: [security-schemes, api-key]
    question: |
      An `apiKey` security scheme requires which properties?
    options:
      - "flows and scopes"
      - "in (header/query/cookie) and name"
      - "openIdConnectUrl"
      - "scheme and bearerFormat"
    answer: 1
    explanation: |
      An `apiKey` scheme specifies `in` (header, query, or cookie) and `name` (the
      parameter/header name carrying the key). `flows`/`scopes` belong to oauth2;
      `openIdConnectUrl` to openIdConnect.
    ref: "concepts.md#security-schemes"

  - id: api-documentation-openapi-swagger-035
    difficulty: advanced
    tags: [security, and-or-semantics]
    question: |
      Given `security: [ {A: [], B: []}, {C: []} ]`, which credential combination
      satisfies the requirement?
    options:
      - "Only C"
      - "All of A, B, and C simultaneously"
      - "Either (A AND B together) OR C alone"
      - "None — the syntax is invalid"
    answer: 2
    explanation: |
      The outer array is OR; the object within an entry is AND. So the requirement is
      satisfied by presenting A and B together, or alternatively just C.
    ref: "concepts.md#security-schemes"

  - id: api-documentation-openapi-swagger-036
    difficulty: advanced
    tags: [security, public-endpoint]
    question: |
      In an otherwise-secured API, how do you mark a single operation (e.g. a health
      check) as requiring no authentication?
    options:
      - "Set `public: true` on the operation"
      - "Delete its `responses` object"
      - "Set `deprecated: true`"
      - "Give the operation an empty security requirement: `security: []`"
    answer: 3
    explanation: |
      An empty `security: []` on an operation overrides the global requirement and
      declares that no authentication is needed — the idiomatic way to expose a
      public endpoint like login or health.
    ref: "concepts.md#security-schemes"

  - id: api-documentation-openapi-swagger-037
    difficulty: intermediate
    tags: [security, enforcement, gotcha]
    question: |
      Does declaring `bearerAuth` in the spec's `security` field secure the endpoint?
    options:
      - "No — the spec only documents the auth contract; the server runtime must actually validate the credential"
      - "Yes — OpenAPI enforces authentication at runtime"
      - "Yes, but only for GET requests"
      - "Only if Swagger UI is deployed alongside the API"
    answer: 0
    explanation: |
      OpenAPI is a description, not an enforcement engine. Declaring a security scheme
      documents how the API expects to be called and drives tooling; the running
      server is still responsible for validating tokens.
    ref: "concepts.md#security-schemes"

  - id: api-documentation-openapi-swagger-038
    difficulty: advanced
    tags: [security-schemes, 3.1, mutual-tls]
    question: |
      Which security scheme type was added in OpenAPI 3.1?
    options:
      - "oauth2"
      - "mutualTLS"
      - "apiKey"
      - "http"
    answer: 1
    explanation: |
      `mutualTLS` (client-certificate authentication) was introduced in OpenAPI 3.1.
      `http`, `apiKey`, `oauth2`, and `openIdConnect` existed in 3.0.
    ref: "concepts.md#security-schemes"

  - id: api-documentation-openapi-swagger-039
    difficulty: intermediate
    tags: [examples, documentation-quality]
    question: |
      Why is the `examples` map generally preferred over the singular `example`?
    options:
      - "It is required by the spec while `example` is forbidden"
      - "It compresses the payload"
      - "It lets you show several named scenarios (success, edge case, error) with summaries, and mock servers can serve them"
      - "It is the only one Swagger UI can render"
    answer: 2
    explanation: |
      `examples` is a map of named Example Objects (with summary/description/value),
      so you can present multiple realistic scenarios and drive mock servers, versus a
      single scalar `example`.
    ref: "concepts.md#examples-and-documentation-quality"

  - id: api-documentation-openapi-swagger-040
    difficulty: intermediate
    tags: [documentation-quality, errors]
    question: |
      Which practice most improves the quality of an API's OpenAPI documentation?
    options:
      - "Documenting only the happy-path 200 response to keep the spec short"
      - "Removing all descriptions to reduce file size"
      - "Using a single generic `object` schema everywhere"
      - "Documenting realistic error responses (4xx/5xx) with their schemas, alongside rich examples"
    answer: 3
    explanation: |
      High-quality docs describe all realistic responses including errors (ideally
      with a problem-details schema) and provide rich examples. Documenting only the
      happy path or using vague schemas produces weak, misleading docs and SDKs.
    ref: "concepts.md#examples-and-documentation-quality"

  - id: api-documentation-openapi-swagger-041
    difficulty: advanced
    tags: [examples, validation, gotcha]
    question: |
      What is a subtle risk with `examples` in an OpenAPI document?
    options:
      - "Nothing forces an example to be valid against its schema, so a stale example can silently mislead consumers and mocks"
      - "Examples are automatically rejected by all validators"
      - "Examples override the schema at runtime"
      - "Examples can only contain strings"
    answer: 0
    explanation: |
      Tools do not necessarily validate examples against their schema, so an example
      can drift out of sync with the schema and mislead readers and mock servers.
      Best practice is to lint/validate examples against their schema in CI.
    ref: "concepts.md#examples-and-documentation-quality"

  - id: api-documentation-openapi-swagger-042
    difficulty: beginner
    tags: [codegen, generation]
    question: |
      Which artifacts can be generated from an OpenAPI document?
    options:
      - "Only PDF documentation"
      - "Client SDKs, server stubs, documentation sites, mock servers, and contract tests"
      - "Only database schemas"
      - "Only Dockerfiles"
    answer: 1
    explanation: |
      Because the spec is machine-readable, tooling can produce typed client SDKs,
      server stubs, doc sites (Swagger UI/Redoc), mock servers, and contract tests
      from the same document.
    ref: "concepts.md#code-and-client-generation"

  - id: api-documentation-openapi-swagger-043
    difficulty: intermediate
    tags: [codegen, tools]
    question: |
      Which of these is a widely used, community-maintained code generator that
      began as a fork of Swagger Codegen?
    options:
      - "webpack"
      - "kubectl"
      - "openapi-generator"
      - "terraform"
    answer: 2
    explanation: |
      openapi-generator is a community fork of Swagger Codegen and is now the more
      actively developed and widely used generator. Both take a spec plus a target
      language template and emit code.
    ref: "concepts.md#code-and-client-generation"

  - id: api-documentation-openapi-swagger-044
    difficulty: advanced
    tags: [codegen, best-practice]
    question: |
      What is a sound practice when consuming a generated client SDK?
    options:
      - "Hand-edit the generated code to fix bugs and commit those edits"
      - "Never regenerate it once created"
      - "Store the spec inside the SDK and edit only the SDK"
      - "Treat the generated SDK as a build artifact regenerated from the committed spec, not code you hand-edit"
    answer: 3
    explanation: |
      Generated SDKs should be treated as build artifacts derived from the spec;
      hand-edits are lost on regeneration. Customize via templates/post-processing and
      regenerate from the committed spec in CI.
    ref: "concepts.md#code-and-client-generation"

  - id: api-documentation-openapi-swagger-045
    difficulty: intermediate
    tags: [sync, drift, source-of-truth]
    question: |
      "Spec as source of truth" is only meaningful when what is in place?
    options:
      - "An enforcement mechanism (e.g. a CI contract test / diff check that fails the build when reality and spec disagree)"
      - "A designer who likes writing YAML"
      - "A large number of tags"
      - "A production incident"
    answer: 0
    explanation: |
      The spec is authoritative only if a machine enforces it. Contract tests
      (server vs spec), a committed-vs-generated spec diff, linting, and a
      breaking-change gate turn the aspiration into an enforced check. Without
      enforcement it is just prettier drift.
    ref: "concepts.md#keeping-docs-in-sync-spec-as-source-of-truth"

  - id: api-documentation-openapi-swagger-046
    difficulty: advanced
    tags: [code-first, sync, ci]
    question: |
      A code-first team keeps shipping docs that don't match the deployed API. Which
      CI control most directly prevents this drift?
    options:
      - "Increase unit-test coverage to 100%"
      - "Commit a reviewed copy of the generated spec and fail the build if a freshly generated spec differs from it"
      - "Delete the OpenAPI document entirely"
      - "Switch the response format from JSON to XML"
    answer: 1
    explanation: |
      Committing the reviewed spec and diffing it against a freshly generated one in
      CI turns "docs match code" into an enforced gate and surfaces API changes as
      reviewable diffs — directly attacking code-first drift.
    ref: "concepts.md#keeping-docs-in-sync-spec-as-source-of-truth"

  - id: api-documentation-openapi-swagger-047
    difficulty: intermediate
    tags: [sync, linting, spectral]
    question: |
      What is the purpose of running a linter like Spectral against an OpenAPI
      document in CI?
    options:
      - "To deploy the API to production"
      - "To generate TLS certificates"
      - "To enforce spec-quality rules (naming, required descriptions, error responses present) so documentation quality doesn't erode"
      - "To compress the YAML file"
    answer: 2
    explanation: |
      Spectral applies configurable rules to the spec — for example requiring
      descriptions, consistent naming, and documented error responses — catching
      quality regressions automatically in CI.
    ref: "concepts.md#keeping-docs-in-sync-spec-as-source-of-truth"

  - id: api-documentation-openapi-swagger-048
    difficulty: advanced
    tags: [sync, breaking-change, oasdiff]
    question: |
      Which tooling approach helps catch backward-incompatible API changes between
      two spec versions in CI?
    options:
      - "A load-testing tool"
      - "A container registry"
      - "A code coverage report"
      - "An OpenAPI diff tool (e.g. oasdiff) that flags breaking changes and can fail the build"
    answer: 3
    explanation: |
      An OpenAPI diff tool compares spec versions and identifies breaking changes
      (removed fields, changed required status, etc.), letting the pipeline block a
      breaking change or force a version bump.
    ref: "concepts.md#keeping-docs-in-sync-spec-as-source-of-truth"

  - id: api-documentation-openapi-swagger-049
    difficulty: beginner
    tags: [document-structure, tags]
    question: |
      What is the primary role of the top-level `tags` field?
    options:
      - "To group and label operations for organization in rendered documentation UIs"
      - "To enforce rate limits per operation"
      - "To define the database schema"
      - "To store secret keys"
    answer: 0
    explanation: |
      `tags` provide grouping/labels for operations; documentation renderers like
      Swagger UI and Redoc use them to organize endpoints into logical sections.
    ref: "concepts.md#openapi-document-structure"

  - id: api-documentation-openapi-swagger-050
    difficulty: intermediate
    tags: [design-first, code-first, decision]
    question: |
      For a public API consumed by several external teams, which workflow is
      generally recommended and why?
    options:
      - "Code-first, because it is always faster to type annotations"
      - "Design-first, because it forces a deliberate, reviewable contract before implementation and lets consumers build in parallel against mocks"
      - "Neither — public APIs should not be documented"
      - "Whichever avoids writing any tests"
    answer: 1
    explanation: |
      Design-first suits public/cross-team APIs: the contract is agreed and reviewed
      before implementation cost is sunk, consumers work in parallel against mocks,
      and internal implementation details don't leak into the public shape.
    ref: "concepts.md#design-first-vs-code-first"

  - id: api-documentation-openapi-swagger-051
    difficulty: advanced
    tags: [parameters, serialization, style, explode]
    question: |
      A query parameter `ids` is an array `[3, 4, 5]` declared with
      `style: form` and no explicit `explode`. How is it serialized into the URL?
    options:
      - "ids=3&ids=4&ids=5"
      - "ids=3,4,5"
      - "ids=3%204%205"
      - "ids[0]=3&ids[1]=4&ids[2]=5"
    answer: 0
    explanation: |
      `explode` defaults to `true` for `style: form`, so each array item gets its own
      `name=value` pair: `ids=3&ids=4&ids=5`. Setting `explode: false` would instead
      pack them with the form delimiter into `ids=3,4,5`.
    ref: "concepts.md#parameter-serialization-style-explode-and-content"

  - id: api-documentation-openapi-swagger-052
    difficulty: advanced
    tags: [parameters, deep-object, query]
    question: |
      You must document a query string of the form
      `?filter[status]=OPEN&filter[region]=us`, where `filter` is an object. Which
      parameter configuration expresses this?
    options:
      - "in: query, style: deepObject, explode: true, schema of type object"
      - "in: query, style: form, explode: false"
      - "in: query, style: pipeDelimited, explode: true"
      - "in: path, style: matrix, explode: true"
    answer: 0
    explanation: |
      `style: deepObject` is the only style that produces bracketed nested-object
      syntax (`filter[status]=...`), and it applies to object-typed query parameters
      with `explode: true`. The other styles serialize arrays/scalars differently and
      cannot express `key[prop]`.
    ref: "concepts.md#parameter-serialization-style-explode-and-content"

  - id: api-documentation-openapi-swagger-053
    difficulty: expert
    tags: [parameters, content, complex-query]
    question: |
      You need a query parameter carrying an arbitrary JSON object too complex for
      style/explode serialization. What is the correct OpenAPI modeling?
    options:
      - "Give the parameter a `content` map with a single media type (e.g. application/json) and a schema, and omit style/explode"
      - "Give the parameter both `schema` with `style: deepObject` and a `content` block for redundancy"
      - "Model it as a `requestBody` with `in: query`"
      - "Use `style: form` with `explode: true` and a `type: object` schema"
    answer: 0
    explanation: |
      For complex values a parameter uses `content` (exactly one media type) instead
      of `schema`+`style`/`explode`; the value is serialized per that media type
      (typically URL-encoded JSON). A parameter must use either `schema` or `content`,
      never both, and `content` holds exactly one entry.
    ref: "concepts.md#parameter-serialization-style-explode-and-content"

  - id: api-documentation-openapi-swagger-054
    difficulty: expert
    tags: [allof, closed-schema, unevaluated-properties]
    question: |
      `Base` sets `additionalProperties: false`. A `Child` schema is
      `allOf: [ {$ref: Base}, { properties: { nickname: {type: string} }, required: [nickname] } ]`.
      A payload includes `nickname`. What happens, and what is the 3.1 fix?
    options:
      - "The payload is INVALID because the Base branch, validated in isolation, sees `nickname` as an additional property; use `unevaluatedProperties: false` on the composed schema instead"
      - "The payload is valid; `allOf` merges the property sets so `additionalProperties` sees `nickname` as known"
      - "The payload is valid because `additionalProperties: false` only applies to top-level documents"
      - "The payload is INVALID and there is no way to model open inheritance in 3.1"
    answer: 0
    explanation: |
      `allOf` is intersection, not merge: each branch validates independently, so
      `Base`'s `additionalProperties: false` rejects `nickname` (introduced by a
      sibling branch it cannot see). JSON Schema 2020-12 (available in 3.1) solves this
      with `unevaluatedProperties: false`, which is aware of properties evaluated by
      `allOf`/`$ref` branches.
    ref: "concepts.md#allof-discriminator-and-modeling-gotchas"

  - id: api-documentation-openapi-swagger-055
    difficulty: expert
    tags: [allof, semantics]
    question: |
      Which statement about `allOf` is correct?
    options:
      - "It is a logical AND (intersection): a value must satisfy every subschema simultaneously, so `allOf: [{type: string}, {type: integer}]` is unsatisfiable"
      - "It deep-merges the subschemas into one object schema before validating"
      - "It behaves like `oneOf` but is faster for tools to evaluate"
      - "It requires the value to match exactly one subschema"
    answer: 0
    explanation: |
      `allOf` is intersection/AND — the value must validate against all subschemas at
      once. It only narrows; it cannot loosen or merge. Requiring both `type: string`
      and `type: integer` can never be satisfied.
    ref: "concepts.md#allof-discriminator-and-modeling-gotchas"

  - id: api-documentation-openapi-swagger-056
    difficulty: expert
    tags: [discriminator, correctness]
    question: |
      Which statement about `discriminator` is accurate?
    options:
      - "`propertyName` must reference a `required` property, and the discriminator is a dispatch hint — JSON Schema still validates the payload via the oneOf/anyOf branches"
      - "The discriminator itself enforces validation, so the oneOf branches become unnecessary"
      - "`mapping` maps schema names to discriminator values (the reverse of the actual direction)"
      - "A discriminator may only be used with `allOf`, never with `oneOf`"
    answer: 0
    explanation: |
      The `propertyName` must be a required property; the discriminator is only a hint
      for unambiguous/faster dispatch, not a validation constraint — the payload is
      still validated through oneOf/anyOf. `mapping` maps discriminator *values* to
      schema refs (implicit mapping uses the schema name), and discriminators work with
      oneOf/anyOf and the allOf-inheritance pattern.
    ref: "concepts.md#allof-discriminator-and-modeling-gotchas"

  - id: api-documentation-openapi-swagger-057
    difficulty: expert
    tags: [links, hateoas, runtime-expression]
    question: |
      What does the OpenAPI `links` object in a response describe?
    options:
      - "A design-time relationship: how a value from this response (via a runtime expression like `$response.body#/id`) can feed a parameter of another named operation"
      - "A runtime hyperlink header sent on the wire, equivalent to the RFC 8288 `Link` header"
      - "A list of external documentation URLs for the operation"
      - "The set of allowed CORS origins for the endpoint"
    answer: 0
    explanation: |
      `links` are design-time HATEOAS: they document how a response value wires into a
      subsequent `operationId`/`operationRef`'s parameters using runtime expressions.
      That is distinct from the RFC 8288 `Link` header, which carries an actual URL on
      the wire at runtime.
    ref: "concepts.md#links-callbacks-webhooks-and-asyncapi"

  - id: api-documentation-openapi-swagger-058
    difficulty: expert
    tags: [webhooks, callbacks, asyncapi, distinction]
    question: |
      A payment API sends event notifications to a URL the merchant configured once in
      a web dashboard (not via any API call). Which OpenAPI/AsyncAPI construct best
      documents this?
    options:
      - "The 3.1 root `webhooks` field — out-of-band requests the API sends that are not tied to any operation call"
      - "A `callbacks` object on the create-payment operation, keyed by a runtime expression against that request"
      - "AsyncAPI `channels`, because any push notification is pub-sub"
      - "A `links` object on the payment response"
    answer: 0
    explanation: |
      Because the receiver URL is registered out of band (dashboard) rather than in an
      operation's request, this is `webhooks` (3.1). `callbacks` would apply only if the
      URL were supplied in a specific operation's request; AsyncAPI is for true
      streaming/message-broker interactions; `links` are design-time call chaining.
    ref: "concepts.md#links-callbacks-webhooks-and-asyncapi"

  - id: api-documentation-openapi-swagger-059
    difficulty: advanced
    tags: [callbacks, out-of-band]
    question: |
      In OpenAPI, a `callbacks` object attached to an operation describes what?
    options:
      - "Out-of-band requests the API will later send to a URL the client supplied in that operation's request (its key is a runtime expression against the request)"
      - "Retries the client should perform on a 5xx response"
      - "Client SDK callback function names generated by codegen"
      - "The list of downstream services the operation calls internally"
    answer: 0
    explanation: |
      A `callback` models requests the API originates back to a client-provided URL
      (e.g. a subscription's `callbackUrl`), tied to that specific operation, with the
      callback key expressed as a runtime expression such as
      `{$request.body#/callbackUrl}`.
    ref: "concepts.md#links-callbacks-webhooks-and-asyncapi"

  - id: api-documentation-openapi-swagger-060
    difficulty: advanced
    tags: [asyncapi, event-driven]
    question: |
      Your team publishes Kafka events and wants a machine-readable contract for them.
      Why is OpenAPI the wrong tool, and what fits?
    options:
      - "OpenAPI models HTTP request/response, not pub-sub; AsyncAPI models channels, messages, operations (send/receive), and protocol bindings for brokers like Kafka"
      - "OpenAPI works fine — just describe each Kafka topic as a GET path"
      - "Nothing standard exists; you must invent a proprietary schema"
      - "Use OpenAPI `callbacks` for every Kafka topic"
    answer: 0
    explanation: |
      OpenAPI is built around synchronous HTTP request/response. AsyncAPI 3.0 is the
      event-driven sibling: `channels` (addresses), `messages` (payload schemas reusing
      JSON Schema), `operations` with `send`/`receive`, servers, and per-protocol
      `bindings`.
    ref: "concepts.md#the-openapi-ecosystem-overlays-arazzo-asyncapi"

  - id: api-documentation-openapi-swagger-061
    difficulty: expert
    tags: [overlays, code-first, governance]
    question: |
      A code-first service emits a spec with poor descriptions and internal
      `/debug` endpoints, and you cannot modify the generator. How do you publish clean
      public docs without re-diverging from the source?
    options:
      - "Apply an Overlay in CI: `remove` the internal paths and `update` descriptions, producing a public OpenAPI variant from the generated base"
      - "Hand-edit the generated spec each release and commit the edits"
      - "Switch the whole service to design-first overnight"
      - "Use Spectral to rewrite the descriptions during linting"
    answer: 0
    explanation: |
      Overlay Specification 1.0 defines ordered `actions` (JSONPath `target` +
      `update`/`remove`) applied to a base spec to produce another spec. It injects
      descriptions and filters endpoints without editing the source, so it never
      re-diverges. Hand-editing re-introduces drift; Spectral only reports, it doesn't
      transform.
    ref: "concepts.md#the-openapi-ecosystem-overlays-arazzo-asyncapi"

  - id: api-documentation-openapi-swagger-062
    difficulty: expert
    tags: [overlays, mechanics]
    question: |
      What are the building blocks of an Overlay document, and what does applying it
      produce?
    options:
      - "An ordered list of `actions`, each with a JSONPath `target` plus `update` or `remove: true`; applying it to a base OpenAPI doc yields another OpenAPI doc (chainable)"
      - "A ruleset of `given`/`then`/`severity` that reports violations without changing the spec"
      - "A binary diff patch applied to the raw YAML bytes"
      - "A set of `$ref` pointers that inline external files into one document"
    answer: 0
    explanation: |
      Overlays are ordered `actions` with a JSONPath `target` and either `update`
      (merge) or `remove`. Applying an overlay transforms one OpenAPI document into
      another, and overlays chain. The `given`/`then`/`severity` shape describes a
      Spectral ruleset; inlining refs is bundling/dereferencing.
    ref: "concepts.md#the-openapi-ecosystem-overlays-arazzo-asyncapi"

  - id: api-documentation-openapi-swagger-063
    difficulty: expert
    tags: [arazzo, workflows]
    question: |
      A checkout involves five chained API calls with auth steps between them. Which
      spec documents this orchestration, and how?
    options:
      - "Arazzo: ordered `workflows` of `steps` (each calling an operationId), with `successCriteria`, `onSuccess`/`onFailure` actions, and runtime expressions threading step outputs into later inputs"
      - "OpenAPI: model the whole checkout as one big operation with five request bodies"
      - "AsyncAPI: each call becomes a channel message"
      - "An Overlay that merges the five operations into one"
    answer: 0
    explanation: |
      A single OpenAPI operation cannot express a multi-call business flow. Arazzo 1.0
      defines workflows of steps referencing operations, with `successCriteria`
      (Criterion Objects), `onSuccess`/`onFailure` (end/goto/retry), and runtime
      expressions (`$response.body`, `$steps.<id>.outputs.<name>`) to chain calls.
    ref: "concepts.md#the-openapi-ecosystem-overlays-arazzo-asyncapi"

  - id: api-documentation-openapi-swagger-064
    difficulty: advanced
    tags: [spectral, ruleset, mechanics]
    question: |
      In a Spectral ruleset, what do the `given` and `then` fields of a rule specify?
    options:
      - "`given` is a JSONPath selecting the nodes to check; `then` names a function (truthy, pattern, casing, length, enumeration, xor, …) applied to those nodes, with a severity"
      - "`given` is the HTTP method and `then` is the response code to assert"
      - "`given` is the input spec file and `then` is the output file"
      - "`given` is a regex over the whole document and `then` is a replacement string"
    answer: 0
    explanation: |
      A Spectral rule targets nodes via a `given` JSONPath and runs a `then` function
      (built-ins include `truthy`, `pattern`, `casing`, `length`, `enumeration`,
      `alphabetical`, `xor`, `defined`, `schema`) at a chosen `severity`. Rulesets can
      `extend` `spectral:oas`/`spectral:asyncapi` and use `overrides`.
    ref: "concepts.md#spec-linting-and-api-governance"

  - id: api-documentation-openapi-swagger-065
    difficulty: advanced
    tags: [governance, style-guide, scale]
    question: |
      You must keep 200 APIs across 40 teams consistent. Which approach is the strong
      senior answer?
    options:
      - "Codify a written style guide (MUST/SHOULD/MAY, e.g. Zalando/Google-AIP-style), machine-enforce it with a Spectral/Zally ruleset in CI, add an API review board, and share a common components library"
      - "Ask each team to read the OpenAPI spec and use their best judgment"
      - "Mandate that every team use the same web framework"
      - "Run a nightly script that rewrites all specs to a single template"
    answer: 0
    explanation: |
      Consistency at scale is a governance problem: a documented style guide plus
      automated linting (Spectral/Zally) in CI plus human review plus shared reusable
      components. Zalando's guidelines (Zally-enforced) and Google AIP are canonical
      published examples. Authoring one spec well is a separate skill from governing
      many.
    ref: "concepts.md#spec-linting-and-api-governance"

  - id: api-documentation-openapi-swagger-066
    difficulty: advanced
    tags: [governance, zalando, aip]
    question: |
      Which pairing of a published API guideline with one of its concrete rules is
      correct?
    options:
      - "Zalando guidelines require RFC 9457 `problem+json` errors and kebab-case paths, enforced by the Zally linter"
      - "Google AIP mandates an `api-version` query parameter and camelCase JSON"
      - "Microsoft REST guidelines mandate snake_case JSON and an `X-Flow-Id` header"
      - "Zalando guidelines mandate resource-oriented `update_mask` field masks and page_token pagination"
    answer: 0
    explanation: |
      Zalando's guidelines specify kebab-case paths, snake_case JSON, a required
      `X-Flow-Id`, and RFC 9457 `Problem` errors, all enforced by Zally. The
      `api-version` query param and camelCase belong to Microsoft; `update_mask` and
      `page_token` pagination belong to Google AIP — the other options mismatch guide
      and rule.
    ref: "concepts.md#spec-linting-and-api-governance"

  - id: api-documentation-openapi-swagger-067
    difficulty: expert
    tags: [breaking-change, request, response, asymmetry]
    question: |
      Which change is BACKWARD-COMPATIBLE (non-breaking) for existing clients?
    options:
      - "Adding a new `required` property to a response body the server always populates"
      - "Adding a new `required` property to a request body"
      - "Removing a value from an enum that clients may receive in a response"
      - "Changing an operation's success status from 200 to 204"
    answer: 0
    explanation: |
      Breaking-ness is directional. Adding a required field to a *response* is safe —
      the server always supplies it and tolerant clients ignore unknown/extra fields.
      Adding a required *request* field breaks callers who don't send it; removing a
      returned enum value can break clients that switch on it; changing the success
      status is breaking.
    ref: "concepts.md#breaking-change-detection-and-contract-versioning"

  - id: api-documentation-openapi-swagger-068
    difficulty: expert
    tags: [breaking-change, enum, direction]
    question: |
      Why is adding a new value to a response enum potentially breaking, while adding
      one to a request (input) enum is generally safe?
    options:
      - "A new returned value can surprise strict clients that exhaustively switch on the enum, whereas widening accepted input only lets clients send more — it never forces old clients to change"
      - "Response enums are cached but request enums are not"
      - "It is the reverse: request enum changes are always breaking and response enum changes never are"
      - "Enums cannot be changed at all without a spec-format major bump"
    answer: 0
    explanation: |
      Direction matters: producers of output (the server) sending a value the client's
      exhaustive handling doesn't expect can break the client. Accepting a wider set of
      inputs is additive from the caller's perspective — existing callers keep sending
      what they always sent.
    ref: "concepts.md#breaking-change-detection-and-contract-versioning"

  - id: api-documentation-openapi-swagger-069
    difficulty: advanced
    tags: [breaking-change, ci, oasdiff, semver]
    question: |
      How do you make CI automatically gate breaking API changes and tie them to
      versioning?
    options:
      - "Run a diff tool (oasdiff/Optic) in breaking-changes mode between the base and PR specs to fail the build on incompatible changes, and treat a breaking change as a major SemVer bump of `info.version`"
      - "Bump the top-level `openapi` field on every PR to signal changes"
      - "Rely on unit-test coverage thresholds to catch contract changes"
      - "Compare only file size between the two spec versions"
    answer: 0
    explanation: |
      `oasdiff` (breaking-changes mode), Optic, or Redocly classify each change between
      two specs; wiring that into CI fails the PR on incompatibilities. Version the
      contract with SemVer via `info.version` (major=breaking) — distinct from the
      `openapi` spec-format version. Coverage and file size don't detect contract
      breaks.
    ref: "concepts.md#breaking-change-detection-and-contract-versioning"

  - id: api-documentation-openapi-swagger-070
    difficulty: expert
    tags: [multi-file, bundling, dereferencing]
    question: |
      Your spec spans 30 files with external `$ref`s, but the target codegen tool
      cannot resolve remote references. What transform should CI apply, and how does it
      differ from full dereferencing?
    options:
      - "Bundle: pull external targets into one file's components and rewrite refs to local pointers (refs preserved); dereferencing instead inlines every ref, producing a larger self-contained doc with no refs that breaks on cycles"
      - "Dereference: it is always preferred because removing all refs is cleaner and smaller"
      - "Minify the YAML to remove whitespace so refs resolve faster"
      - "Nothing — every OpenAPI tool resolves remote refs automatically"
    answer: 0
    explanation: |
      Bundling consolidates external refs into one document's components and rewrites
      them to local `#/components/...` pointers, preserving `$ref` identity and keeping
      size reasonable — ideal for tools that can't fetch remote refs. Dereferencing
      inlines everything (no refs), which is larger, duplicates schemas, and breaks on
      circular refs. Redocly CLI / swagger-cli do this.
    ref: "concepts.md#multi-file-specs-bundling-vs-dereferencing"

  - id: api-documentation-openapi-swagger-071
    difficulty: expert
    tags: [json-schema, dialect, 3.1]
    question: |
      What does full JSON Schema 2020-12 alignment concretely give OpenAPI 3.1 that
      3.0 lacked regarding schema dialects and resolution?
    options:
      - "A default dialect (the OAS 3.1 base dialect) plus a root `jsonSchemaDialect` and per-schema `$schema` to override it, and `$id`-based base URIs so independent schema resources resolve/bundle correctly"
      - "The ability to write schemas in XML DTD form"
      - "Automatic runtime enforcement of the schemas by the server"
      - "Removal of `$ref` entirely in favor of inline schemas"
    answer: 0
    explanation: |
      3.1's default dialect is the OAS 3.1 base dialect; `jsonSchemaDialect` sets the
      document default and per-schema `$schema` overrides it. `$id` establishes a base
      URI enabling correct `$ref` resolution and bundling of independent schema
      resources — mechanisms 3.0's Draft-4 subset couldn't express.
    ref: "concepts.md#json-schema-2020-12-internals-in-31"

  - id: api-documentation-openapi-swagger-072
    difficulty: expert
    tags: [json-schema, 2020-12, keywords]
    question: |
      Which set of keywords becomes available for Schema Objects specifically because
      OpenAPI 3.1 adopts JSON Schema 2020-12?
    options:
      - "prefixItems, unevaluatedProperties, if/then/else, patternProperties, $dynamicRef, contentEncoding/contentMediaType"
      - "nullable, exclusiveMinimum-as-boolean, in: body, host/basePath/schemes"
      - "x-amazon-apigateway-integration, x-enum-varnames, x-tagGroups"
      - "successCriteria, onSuccess, onFailure, workflows"
    answer: 0
    explanation: |
      2020-12 (adopted by 3.1) adds tuple validation (`prefixItems`), the allOf-aware
      `unevaluatedProperties`, conditional `if/then/else`, `patternProperties`,
      late-bound `$dynamicRef`, and `contentEncoding`/`contentMediaType`. The second
      option lists 3.0/2.0 constructs; the third lists vendor extensions; the fourth is
      Arazzo.
    ref: "concepts.md#json-schema-2020-12-internals-in-31"

  - id: api-documentation-openapi-swagger-073
    difficulty: advanced
    tags: [vendor-extensions, x-, gateway]
    question: |
      You need to attach AWS API Gateway routing config to your spec without breaking
      standard validators. How?
    options:
      - "Use a vendor extension field prefixed `x-` (e.g. `x-amazon-apigateway-integration`), which is allowed almost anywhere and ignored by conformant validators"
      - "Add a top-level `gateway` field defined by OpenAPI 3.1"
      - "Embed the config inside `info.description` as a comment"
      - "Put it in a `callbacks` object since gateways call backends"
    answer: 0
    explanation: |
      Any field whose name begins with `x-` is a vendor extension: permitted almost
      anywhere and ignored by validators. AWS API Gateway reads
      `x-amazon-apigateway-integration` to wire operations to backends directly from the
      spec without breaking conformance.
    ref: "concepts.md#vendor-extensions-and-documentation-renderers"

  - id: api-documentation-openapi-swagger-074
    difficulty: advanced
    tags: [renderers, swagger-ui, redoc, cors]
    question: |
      Why do teams often prefer Redoc over Swagger UI for public-facing reference docs?
    options:
      - "Redoc is read-only (no live 'Try it out'), avoiding CORS issues and the risk of users pasting production credentials into a docs page to make real calls"
      - "Redoc can enforce authentication that Swagger UI cannot"
      - "Swagger UI cannot render OpenAPI 3.1 at all"
      - "Redoc compiles the spec into a running backend"
    answer: 0
    explanation: |
      Swagger UI's interactive 'Try it out' issues real browser requests, surfacing CORS
      and credential-exposure concerns. Redoc's polished, read-only three-panel output
      avoids live calls, which is why it's favored for public reference docs. Neither
      enforces auth or runs a backend.
    ref: "concepts.md#vendor-extensions-and-documentation-renderers"

  - id: api-documentation-openapi-swagger-075
    difficulty: intermediate
    tags: [content-negotiation, problem-json, errors]
    question: |
      Which media type should a well-designed API declare for its machine-readable
      error responses under RFC 9457?
    options:
      - "application/problem+json"
      - "text/plain"
      - "application/error"
      - "application/x-www-form-urlencoded"
    answer: 0
    explanation: |
      RFC 9457 (Problem Details, which obsoletes 7807) defines
      `application/problem+json` as the standard structured error media type; declare it
      on 4xx/5xx responses in the `content` map.
    ref: "concepts.md#content-negotiation-and-media-types"

  - id: api-documentation-openapi-swagger-076
    difficulty: expert
    tags: [content-negotiation, accept, media-types]
    question: |
      How does OpenAPI model HTTP content negotiation, given there is no explicit
      `Accept` parameter?
    options:
      - "The response `content` keys are the set of Content-Types the operation can produce, and the requestBody `content` keys are what it consumes; the client's Accept header is implied by which response media types exist"
      - "You must declare `Accept` as a required header parameter on every operation"
      - "OpenAPI cannot describe multiple representations of a resource"
      - "Content negotiation is expressed via server variables in the `servers` array"
    answer: 0
    explanation: |
      OpenAPI models negotiation structurally: multiple media-type keys under a
      response's `content` are the producible Content-Types, and requestBody `content`
      keys are consumable ones. There is no explicit `Accept` parameter — it's implied
      by the declared response media types (RFC 9110 §8 content negotiation).
    ref: "concepts.md#content-negotiation-and-media-types"

  - id: api-documentation-openapi-swagger-077
    difficulty: expert
    tags: [security, authorization, owasp, bola]
    question: |
      A candidate claims "our OpenAPI spec documents our authorization rules, so it's
      secure." What is the precise correction?
    options:
      - "The spec documents authentication scheme shapes and OAuth scopes (documentation only); object/function-level authorization (BOLA/BFLA, OWASP API Top 10 2023 API1/API5) is a runtime concern not expressible in OpenAPI"
      - "Correct — declaring `oauth2` scopes enforces per-object access at runtime"
      - "The spec enforces authorization only if Swagger UI is deployed with it"
      - "Authorization is fully expressible via the `security` array's AND/OR semantics"
    answer: 0
    explanation: |
      OpenAPI describes authentication scheme shapes and lists OAuth scopes as
      documentation; the server enforces scopes. Fine-grained object- and
      function-level authorization (BOLA=API1, BFLA=API5 in OWASP API Security Top 10
      2023) is runtime-only and cannot be expressed or enforced by the spec.
    ref: "concepts.md#security-schemes"

  - id: api-documentation-openapi-swagger-078
    difficulty: advanced
    tags: [security, oauth, scopes, oauth2.1]
    question: |
      Which statement about OAuth2 in OpenAPI security schemes is correct?
    options:
      - "Scopes listed in the scheme are documentation only (the server enforces them), and the `implicit`/`password` flows are deprecated/removed in OAuth 2.1"
      - "Declaring scopes in the spec causes the runtime to reject tokens lacking them"
      - "`openIdConnect` requires you to hand-list every flow, since it cannot use discovery"
      - "The `authorizationCode` flow was removed in OpenAPI 3.1"
    answer: 0
    explanation: |
      OAuth scopes in the spec are descriptive; the runtime authorization server/API
      enforces them. OAuth 2.1 drops the `implicit` and `password` grant types.
      `openIdConnect` pulls flow details from the discovery document, and
      `authorizationCode` remains valid.
    ref: "concepts.md#security-schemes"

  - id: api-documentation-openapi-swagger-079
    difficulty: intermediate
    tags: [examples, external-value, mock]
    question: |
      Which is true about the Example Object's `value` and `externalValue` fields?
    options:
      - "They are mutually exclusive — use `value` for an inline example or `externalValue` for a URI to the example, but not both"
      - "Both must be present for a valid example"
      - "`externalValue` embeds the example inline while `value` links to a file"
      - "`value` is only for strings and `externalValue` only for numbers"
    answer: 0
    explanation: |
      An Example Object carries `summary`, `description`, and either `value` (inline
      literal) or `externalValue` (a URI to the example content) — the two are mutually
      exclusive. Named examples can be selected by mock servers (e.g. Prism's
      `Prefer: example=<name>`).
    ref: "concepts.md#examples-and-documentation-quality"

  - id: api-documentation-openapi-swagger-080
    difficulty: expert
    tags: [testing, schemathesis, contract]
    question: |
      Beyond example-driven mocks and simple contract assertions, which tool derives
      property-based / fuzz tests directly from the OpenAPI schema to find edge-case
      violations?
    options:
      - "Schemathesis — it generates test cases from the schema (property-based/fuzzing) and checks responses conform"
      - "Redoc — it fuzzes the API while rendering docs"
      - "oasdiff — it generates random payloads to test the server"
      - "Swagger Editor — it runs load tests from the browser"
    answer: 0
    explanation: |
      Schemathesis reads the OpenAPI schema and generates a wide space of inputs
      (property-based/fuzz testing), asserting the server's responses conform to the
      spec and surfacing edge cases hand-written examples miss. Redoc renders docs,
      oasdiff diffs specs, and Swagger Editor edits specs.
    ref: "concepts.md#contract-driven-development-and-mock-servers"
