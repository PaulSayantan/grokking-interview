topic: "API Authentication & Authorization Patterns"
domain: rest-api-design
topic_slug: api-authentication-and-authorization
version: 1
questions:
- id: api-authentication-and-authorization-001
  difficulty: beginner
  tags: [authn, authz, definitions]
  question: |
    What is the difference between authentication and authorization?
  options:
  - "Authentication proves who you are; authorization decides what you may do"
  - "They are two names for the same identity check"
  - "Authentication applies to users; authorization only applies to machines"
  - "Authentication decides what you can do; authorization proves who you are"
  answer: 0
  explanation: |
    Authentication (authN) verifies identity ("who are you?"); authorization
    (authZ) verifies permissions ("what are you allowed to do?"). A request can
    be authenticated yet still forbidden.
  ref: "concepts.md#authentication-vs-authorization"

- id: api-authentication-and-authorization-002
  difficulty: beginner
  tags: [status-codes, 401, 403]
  question: |
    A caller sends a valid, non-expired token but tries to delete a resource
    their role is not permitted to touch. Which status code is correct?
  options:
  - "400 Bad Request"
  - "403 Forbidden"
  - "409 Conflict"
  - "401 Unauthorized"
  answer: 1
  explanation: |
    Identity is known and valid, but the action is not permitted — that is an
    authorization failure, which is 403 Forbidden. 401 is for missing/invalid
    credentials, and re-authenticating would not help here.
  ref: "concepts.md#authentication-vs-authorization"

- id: api-authentication-and-authorization-003
  difficulty: beginner
  tags: [status-codes, 401, www-authenticate]
  question: |
    Per RFC 9110, what must a 401 Unauthorized response include?
  options:
  - "An empty body with no headers"
  - "A Retry-After header"
  - "A WWW-Authenticate header describing how to authenticate"
  - "A Location header to the login page"
  answer: 2
  explanation: |
    RFC 9110 requires a 401 response to carry a WWW-Authenticate header telling
    the client which authentication scheme(s) and parameters apply (for OAuth
    bearer, e.g. error="invalid_token").
  ref: "concepts.md#authentication-vs-authorization"

- id: api-authentication-and-authorization-004
  difficulty: intermediate
  tags: [bola, owasp, authz]
  question: |
    An API authenticates users correctly, then serves GET /accounts/{id} using
    the id from the path without checking who owns the account. What is this?
  options:
  - "A rate-limiting failure"
  - "An authentication (401) bug"
  - "A correct, RESTful design"
  - "Broken Object Level Authorization (BOLA/IDOR)"
  answer: 3
  explanation: |
    This is BOLA (OWASP API1:2023), the top API risk. Authentication alone does
    not protect data; the API must authorize every object access against the
    authenticated principal (ownership check).
  ref: "concepts.md#authentication-vs-authorization"

- id: api-authentication-and-authorization-005
  difficulty: advanced
  tags: [status-codes, 404, information-leak]
  question: |
    Why might a security-conscious API return 404 instead of 403 when a
    caller requests an object they are not allowed to access?
  options:
  - "To avoid confirming that the object exists to an unauthorized caller"
  - "Because 403 is not a valid HTTP status code for GET"
  - "Because caches never store 404 responses"
  - "404 is cheaper to compute than 403"
  answer: 0
  explanation: |
    A 403 still reveals that the resource exists. For sensitive resources some
    APIs deliberately return 404 to avoid leaking existence to callers who have
    no right to know. It is a conscious information-hiding trade-off.
  ref: "concepts.md#authentication-vs-authorization"

- id: api-authentication-and-authorization-006
  difficulty: beginner
  tags: [api-keys, placement]
  question: |
    What does an API key most commonly identify?
  options:
  - "An individual end user's session"
  - "The calling application or project"
  - "The physical server hardware"
  - "A single HTTP request only"
  answer: 1
  explanation: |
    An API key is an opaque string identifying (and often authenticating) a
    calling application/project, not usually a specific end user. It is coarse
    and typically long-lived.
  ref: "concepts.md#api-keys"

- id: api-authentication-and-authorization-007
  difficulty: beginner
  tags: [api-keys, query-string, placement]
  question: |
    Why is putting an API key in the URL query string
    (?api_key=sk_live_...) an anti-pattern?
  options:
  - "The key would be automatically encrypted, which is slow"
  - "Query strings cannot hold long strings"
  - "URLs are logged in server/proxy logs, history, and Referer headers, leaking the key"
  - "HTTP forbids query parameters on GET requests"
  answer: 2
  explanation: |
    URLs land in access logs, proxy logs, browser history, bookmarks, and the
    Referer header sent to third parties. A credential in a URL is effectively
    leaked. Keys (and tokens) belong in a header.
  ref: "concepts.md#api-keys"

- id: api-authentication-and-authorization-008
  difficulty: intermediate
  tags: [api-keys, rotation]
  question: |
    What is the safe pattern for rotating an API key with zero downtime?
  options:
  - "Rotate keys only during a scheduled outage window"
  - "Change the key's value in place without notifying clients"
  - "Delete the old key, then tell clients to request a new one"
  - "Issue the new key, accept both old and new during migration, then revoke the old"
  answer: 3
  explanation: |
    Overlapping validity: issue a new key, support both old and new
    simultaneously while clients migrate, then revoke the old one. Supporting
    multiple active keys per account enables zero-downtime rotation.
  ref: "concepts.md#api-keys"

- id: api-authentication-and-authorization-009
  difficulty: intermediate
  tags: [api-keys, oauth, comparison]
  question: |
    Compared to an OAuth 2.0 access token, an API key typically differs how?
  options:
  - "API keys are coarse, long-lived, and identify an app rather than a user with scopes"
  - "API keys require a browser redirect flow to obtain"
  - "API keys are always cryptographically signed JWTs"
  - "API keys are short-lived and carry per-user scopes"
  answer: 0
  explanation: |
    API keys are coarse and usually long-lived until rotated, identifying an
    application. OAuth access tokens are short-lived, carry per-scope/per-user
    granularity, and support delegated user consent.
  ref: "concepts.md#api-keys"

- id: api-authentication-and-authorization-010
  difficulty: intermediate
  tags: [api-keys, mobile, secrets]
  question: |
    Why should you never embed a secret API key inside a mobile app or SPA?
  options:
  - "It would slow down app startup"
  - "Public clients can be decompiled/inspected, so the key can be extracted and abused"
  - "Mobile apps cannot send custom headers"
  - "API keys only work from server IP addresses"
  answer: 1
  explanation: |
    A key is a bearer credential — whoever holds it is the client. Public
    clients (mobile, SPA) can be inspected/decompiled, so an embedded secret key
    can be extracted. Public clients need PKCE-based flows, not embedded secrets.
  ref: "concepts.md#api-keys"

- id: api-authentication-and-authorization-011
  difficulty: beginner
  tags: [oauth, roles]
  question: |
    In OAuth 2.0, which role does your API most commonly play?
  options:
  - "The user-agent"
  - "The authorization server that issues tokens"
  - "The resource server that validates tokens and enforces scopes"
  - "The resource owner"
  answer: 2
  explanation: |
    Your API is usually the resource server: it validates the access token on
    each request and enforces scopes. Login, consent, and token issuance live at
    the authorization server.
  ref: "concepts.md#oauth-20-and-21-at-the-api-level"

- id: api-authentication-and-authorization-012
  difficulty: intermediate
  tags: [oauth, oidc, authn-vs-authz]
  question: |
    OAuth 2.0 is fundamentally a framework for what, and what adds identity on
    top of it?
  options:
  - "Encryption; TLS adds authentication"
  - "Rate limiting; API gateways add identity"
  - "Authentication; OpenID Connect adds authorization"
  - "Delegated authorization; OpenID Connect adds an authentication/identity layer"
  answer: 3
  explanation: |
    OAuth 2.0 is a delegated authorization framework. OpenID Connect (OIDC) is
    the identity layer on top of it, adding an ID token (a JWT) for
    authentication ("who is the user").
  ref: "concepts.md#oauth-20-and-21-at-the-api-level"

- id: api-authentication-and-authorization-013
  difficulty: intermediate
  tags: [oauth-2-1, changes]
  question: |
    Which change is introduced by the OAuth 2.1 consolidation effort?
  options:
  - "The implicit grant and the resource owner password credentials grant are removed"
  - "Bearer tokens must be sent in the query string"
  - "Refresh tokens are eliminated entirely"
  - "PKCE becomes optional for all clients"
  answer: 0
  explanation: |
    OAuth 2.1 removes the insecure implicit grant and the resource owner
    password credentials (ROPC) grant, and makes PKCE required for all
    authorization-code clients.
  ref: "concepts.md#oauth-20-and-21-at-the-api-level"

- id: api-authentication-and-authorization-014
  difficulty: advanced
  tags: [oauth-2-1, pkce]
  question: |
    Under OAuth 2.1, which statement about PKCE is correct?
  options:
  - "PKCE is required only for public clients"
  - "PKCE is required for all clients using the authorization code flow"
  - "PKCE replaces TLS for token confidentiality"
  - "PKCE is only used with the client credentials flow"
  answer: 1
  explanation: |
    OAuth 2.0 required PKCE mainly for public clients; OAuth 2.1 extends the
    requirement to all clients using the authorization code flow, including
    confidential ones.
  ref: "concepts.md#oauth-20-and-21-at-the-api-level"

- id: api-authentication-and-authorization-015
  difficulty: beginner
  tags: [authorization-code, pkce, user]
  question: |
    Which OAuth flow is designed for an application acting on behalf of a
    logged-in user (web, mobile, SPA)?
  options:
  - "HMAC request signing"
  - "Client credentials"
  - "Authorization code (with PKCE)"
  - "Device polling with API keys"
  answer: 2
  explanation: |
    The authorization code flow (with PKCE) is for clients acting on behalf of a
    user. It obtains delegated, scoped access without the client ever handling
    the user's password.
  ref: "concepts.md#authorization-code-flow-with-pkce"

- id: api-authentication-and-authorization-016
  difficulty: intermediate
  tags: [pkce, rfc-7636]
  question: |
    What attack does PKCE (RFC 7636) primarily defend against?
  options:
  - "SQL injection in the token endpoint"
  - "TLS downgrade attacks"
  - "Denial-of-service via large payloads"
  - "Interception/injection of the one-time authorization code"
  answer: 3
  explanation: |
    PKCE binds the authorization code to a secret code_verifier the legitimate
    client generated, so an intercepted authorization code cannot be exchanged
    for tokens by an attacker.
  ref: "concepts.md#authorization-code-flow-with-pkce"

- id: api-authentication-and-authorization-017
  difficulty: advanced
  tags: [pkce, state, csrf]
  question: |
    Why do you still need the `state` parameter even when using PKCE?
  options:
  - "state and PKCE defend different attacks: state guards CSRF on the redirect, PKCE guards code injection"
  - "state is required to compute the code_challenge"
  - "state replaces the need for the redirect_uri"
  - "state encrypts the access token"
  answer: 0
  explanation: |
    They protect different things. `state` is a CSRF guard verifying the
    redirect belongs to the request the client initiated; PKCE protects against
    authorization-code interception/injection. You need both.
  ref: "concepts.md#authorization-code-flow-with-pkce"

- id: api-authentication-and-authorization-018
  difficulty: intermediate
  tags: [pkce, s256, code-challenge]
  question: |
    In PKCE with the recommended S256 method, what is sent to the /authorize
    endpoint?
  options:
  - "The client secret"
  - "A code_challenge that is the SHA-256 hash of the code_verifier"
  - "The access token requested in advance"
  - "The raw code_verifier"
  answer: 1
  explanation: |
    With S256, the client sends the code_challenge (SHA-256 of the
    code_verifier) at /authorize, and later proves possession by sending the raw
    code_verifier at /token. The plain method is discouraged.
  ref: "concepts.md#authorization-code-flow-with-pkce"

- id: api-authentication-and-authorization-019
  difficulty: advanced
  tags: [implicit-grant, tokens-in-url]
  question: |
    Why was the OAuth implicit grant removed in favor of authorization code +
    PKCE, even for SPAs?
  options:
  - "It only worked over HTTP, not HTTPS"
  - "It was too slow for browsers"
  - "It returned tokens in the redirect URL fragment, where they leak via logs/history/Referer"
  - "It required a client secret that SPAs cannot store"
  answer: 2
  explanation: |
    The implicit grant returned access tokens directly in the redirect URL
    fragment, exposing them to logs, browser history, and Referer leakage.
    Auth code + PKCE avoids putting tokens in URLs and is now preferred for SPAs.
  ref: "concepts.md#authorization-code-flow-with-pkce"

- id: api-authentication-and-authorization-020
  difficulty: beginner
  tags: [client-credentials, m2m]
  question: |
    Which OAuth flow suits a backend daemon calling another API as itself,
    with no user involved?
  options:
  - "Resource owner password credentials"
  - "Authorization code + PKCE"
  - "Implicit grant"
  - "Client credentials"
  answer: 3
  explanation: |
    The client credentials flow is for machine-to-machine calls where the client
    acts as itself, with no browser, redirect, or user consent. The token
    represents the application's own identity and scopes.
  ref: "concepts.md#client-credentials-flow"

- id: api-authentication-and-authorization-021
  difficulty: intermediate
  tags: [client-credentials, refresh-token]
  question: |
    Per RFC 6749, what does the client credentials flow NOT issue?
  options:
  - "A refresh token"
  - "A token_type field"
  - "An expires_in field"
  - "An access token"
  answer: 0
  explanation: |
    Client credentials does not issue a refresh token (RFC 6749 4.4.3). The
    client simply requests a new access token with its own credentials when the
    old one expires.
  ref: "concepts.md#client-credentials-flow"

- id: api-authentication-and-authorization-022
  difficulty: intermediate
  tags: [client-credentials, confidential-client]
  question: |
    Why must the client credentials flow be used only by a confidential client?
  options:
  - "Because it uses the query string for tokens"
  - "Because it authenticates with a client_secret that must be stored securely, server-side"
  - "Because public clients cannot make POST requests"
  - "Because it requires a user password"
  answer: 1
  explanation: |
    The flow authenticates with a client_secret. Only confidential (server-side)
    clients can store that secret safely, so it is never used from a browser or
    mobile app.
  ref: "concepts.md#client-credentials-flow"

- id: api-authentication-and-authorization-023
  difficulty: advanced
  tags: [client-credentials, delegation, scenario]
  question: |
    Service A must call service B's API. If the requirement changes to "on
    behalf of the currently logged-in user," what changes?
  options:
  - "You move the token into the query string"
  - "Nothing — client credentials already carries the user identity"
  - "You switch to a user-delegated flow such as authorization code + PKCE (or token exchange)"
  - "You must embed the user's password in the client_secret"
  answer: 2
  explanation: |
    Client credentials represents the application itself with no user. To act on
    behalf of a specific user you need a user-delegated flow (authorization code
    + PKCE) or token exchange / on-behalf-of, which carries the user's identity
    and consent.
  ref: "concepts.md#client-credentials-flow"

- id: api-authentication-and-authorization-024
  difficulty: beginner
  tags: [scopes, least-privilege]
  question: |
    What do OAuth scopes represent in an access token?
  options:
  - "The IP address the token was issued from"
  - "The token's cryptographic algorithm"
  - "The user's password hash"
  - "The bounded set of operations the token is permitted to perform"
  answer: 3
  explanation: |
    Scopes (e.g. read:orders, write:orders) bound what a token may do,
    implementing least privilege at the token level. A read-only widget's token
    should not carry write/delete scopes.
  ref: "concepts.md#scopes-and-least-privilege"

- id: api-authentication-and-authorization-025
  difficulty: advanced
  tags: [scopes, bola, ownership]
  question: |
    A token carries the scope write:orders. Which check does that scope NOT
    perform?
  options:
  - "That the authenticated subject owns/may modify the specific order 12345"
  - "That the operation class is 'write order'"
  - "That the token was granted the write:orders permission"
  - "That the token is permitted to write orders in general"
  answer: 0
  explanation: |
    A scope is coarse: it says the token may write orders as a class of
    operation, not that the caller owns a specific order. The per-object
    ownership check (BOLA) is the API's own responsibility.
  ref: "concepts.md#scopes-and-least-privilege"

- id: api-authentication-and-authorization-026
  difficulty: intermediate
  tags: [scopes, insufficient-scope, 403]
  question: |
    A valid token lacks the scope required for an endpoint. What is the correct
    response?
  options:
  - "401 with WWW-Authenticate: Bearer error=\"invalid_token\""
  - "403 with WWW-Authenticate: Bearer error=\"insufficient_scope\""
  - "200 with an empty body"
  - "400 Bad Request with no header"
  answer: 1
  explanation: |
    The token is valid (authenticated) but lacks the needed scope — an
    authorization failure — so 403 Forbidden with
    WWW-Authenticate: Bearer error="insufficient_scope" is correct.
  ref: "concepts.md#scopes-and-least-privilege"

- id: api-authentication-and-authorization-027
  difficulty: intermediate
  tags: [scopes, audience, aud]
  question: |
    What does the `aud` (audience) constraint on a token help prevent?
  options:
  - "The client from reading its own token"
  - "Tokens being too large"
  - "A token minted for API X being replayed against API Y"
  - "Slow signature verification"
  answer: 2
  explanation: |
    The audience binds a token to a specific API. Verifying `aud` prevents a
    token issued for one service from being replayed against a different one.
  ref: "concepts.md#scopes-and-least-privilege"

- id: api-authentication-and-authorization-028
  difficulty: beginner
  tags: [bearer, rfc-6750]
  question: |
    What does "bearer" mean in "bearer token" (RFC 6750)?
  options:
  - "The token can only be used once"
  - "The token is bound to the client's TLS certificate"
  - "The token is encrypted end to end"
  - "Whoever holds the token can use it, with no additional proof of possession"
  answer: 3
  explanation: |
    A bearer token is like cash: possession is sufficient to use it, with no
    extra proof of possession. That is why bearer tokens must travel over TLS
    and be treated as secrets.
  ref: "concepts.md#bearer-tokens-and-jwt"

- id: api-authentication-and-authorization-029
  difficulty: beginner
  tags: [jwt, rfc-7519, structure]
  question: |
    A JWT (RFC 7519) consists of which three Base64URL parts joined by dots?
  options:
  - "header.payload.signature"
  - "issuer.subject.audience"
  - "scope.expiry.nonce"
  - "key.iv.ciphertext"
  answer: 0
  explanation: |
    A JWT is header.payload.signature. The payload holds claims (iss, sub, aud,
    exp, etc.), and the JWS signature lets a resource server verify integrity
    without calling the authorization server.
  ref: "concepts.md#bearer-tokens-and-jwt"

- id: api-authentication-and-authorization-030
  difficulty: intermediate
  tags: [jwt, encryption, misconception]
  question: |
    Which statement about a standard signed JWT (JWS) is correct?
  options:
  - "It is encrypted, so claims are hidden from the client"
  - "It is only Base64URL-encoded and readable by anyone who holds it"
  - "Its signature encrypts the payload"
  - "It cannot be validated without contacting the authorization server"
  answer: 1
  explanation: |
    A signed JWT is not encrypted — the payload is merely Base64URL-encoded and
    fully readable. For confidentiality you need JWE. Never store secrets in JWT
    claims of a signed-only token.
  ref: "concepts.md#bearer-tokens-and-jwt"

- id: api-authentication-and-authorization-031
  difficulty: intermediate
  tags: [jwt, opaque, introspection, comparison]
  question: |
    What is a key advantage of an opaque access token over a self-contained JWT?
  options:
  - "It never expires"
  - "It can be validated without any network call"
  - "It supports immediate revocation because the authz server is the source of truth"
  - "It is smaller on the wire in every case"
  answer: 2
  explanation: |
    Opaque tokens are validated via introspection against the authorization
    server, which is the source of truth — so they can be revoked immediately.
    Self-contained JWTs validate locally but are hard to revoke before exp.
  ref: "concepts.md#bearer-tokens-and-jwt"

- id: api-authentication-and-authorization-032
  difficulty: advanced
  tags: [jwt, terminology]
  question: |
    Which statement about the relationship between "bearer token" and "JWT" is
    correct?
  options:
  - "A JWT can never be used as a bearer token"
  - "JWT is a transport scheme, bearer is a signing algorithm"
  - "Every bearer token is a JWT"
  - "A bearer token can be an opaque random string or a JWT; the terms are not synonyms"
  answer: 3
  explanation: |
    "Bearer" describes how the token is used (possession is enough); "JWT" is one
    possible format. A bearer token may be an opaque string or a JWT — they are
    not synonyms.
  ref: "concepts.md#bearer-tokens-and-jwt"

- id: api-authentication-and-authorization-033
  difficulty: beginner
  tags: [access-token, refresh-token, lifetime]
  question: |
    Why are access tokens typically kept short-lived while refresh tokens are
    long-lived?
  options:
  - "A leaked bearer access token can't be un-issued, so short TTLs limit the blast radius; refresh tokens keep users logged in"
  - "Because refresh tokens are sent on every API call"
  - "Because access tokens cannot be signed"
  - "To make the API respond faster"
  answer: 0
  explanation: |
    Bearer access tokens can't be revoked once leaked, so short TTLs limit
    exposure. A long-lived refresh token (sent only to the authz server) lets the
    client silently obtain fresh access tokens without re-login.
  ref: "concepts.md#access-tokens-vs-refresh-tokens"

- id: api-authentication-and-authorization-034
  difficulty: intermediate
  tags: [refresh-token, endpoint]
  question: |
    To which endpoint should a refresh token be sent?
  options:
  - "The resource server (your API) on every request"
  - "Only the authorization server's token endpoint"
  - "Any endpoint, as a query parameter"
  - "The redirect_uri after login"
  answer: 1
  explanation: |
    A refresh token is presented only to the authorization server's /token
    endpoint to mint new access tokens. It should never be sent to the resource
    server; only the short-lived access token goes there.
  ref: "concepts.md#access-tokens-vs-refresh-tokens"

- id: api-authentication-and-authorization-035
  difficulty: advanced
  tags: [refresh-token, rotation, replay]
  question: |
    What does refresh token rotation add over static refresh tokens?
  options:
  - "It lets the client skip re-requesting access tokens"
  - "It makes access tokens longer-lived"
  - "Each refresh issues a new refresh token and invalidates the old, so reuse of a stolen token is detected and the family revoked"
  - "It removes the need for TLS"
  answer: 2
  explanation: |
    With rotation, each use of a refresh token issues a new one and invalidates
    the previous. If a stolen token is replayed after the legitimate client
    already rotated, the authz server detects reuse and revokes the whole token
    family.
  ref: "concepts.md#access-tokens-vs-refresh-tokens"

- id: api-authentication-and-authorization-036
  difficulty: intermediate
  tags: [access-token, refresh-token, comparison]
  question: |
    Which statement correctly contrasts access and refresh tokens?
  options:
  - "Refresh tokens are short-lived, access tokens are long-lived"
  - "Refresh tokens are always JWTs, access tokens are always opaque"
  - "Both are sent to the resource server on every request"
  - "The access token is sent to the API on each call; the refresh token is long-lived and only reaches the authz server"
  answer: 3
  explanation: |
    The access token (often short-lived, sometimes a JWT) is sent to the API on
    every call. The refresh token is long-lived, usually opaque, and only sent to
    the authorization server to obtain new access tokens.
  ref: "concepts.md#access-tokens-vs-refresh-tokens"

- id: api-authentication-and-authorization-037
  difficulty: beginner
  tags: [token-placement, header]
  question: |
    What is the recommended place to send a bearer token for an API request?
  options:
  - "In the Authorization request header"
  - "In a cookie set by the client"
  - "In the URL path"
  - "In the URL query string"
  answer: 0
  explanation: |
    The Authorization: Bearer header is the recommended placement (RFC 6750). It
    is not sent automatically by browsers (CSRF-safe), not logged by default, and
    works for browser and non-browser clients alike.
  ref: "concepts.md#token-placement-header-vs-cookie-vs-query-string"

- id: api-authentication-and-authorization-038
  difficulty: intermediate
  tags: [token-placement, cookie, csrf]
  question: |
    Why does storing an auth token in a cookie introduce CSRF risk that a
    header-based token does not?
  options:
  - "Cookies cannot be encrypted"
  - "Browsers attach matching cookies automatically, so a forged cross-site request carries the credential"
  - "Cookies are always readable by JavaScript"
  - "Cookies are sent in the query string"
  answer: 1
  explanation: |
    Browsers send cookies automatically to matching requests, so a cross-site
    forged request rides along with the credential — the basis of CSRF. An
    Authorization header is not auto-attached, so it is inherently CSRF-safe.
  ref: "concepts.md#token-placement-header-vs-cookie-vs-query-string"

- id: api-authentication-and-authorization-039
  difficulty: advanced
  tags: [token-placement, csrf, xss, tradeoff]
  question: |
    Which best captures the security trade-off between an Authorization-header
    token and an HttpOnly cookie token?
  options:
  - "The cookie is safer in every dimension"
  - "The header token is safer in every dimension"
  - "The header token dodges CSRF but is XSS-readable by JS; the HttpOnly cookie resists XSS theft but invites CSRF"
  - "Both are equally vulnerable to CSRF and XSS"
  answer: 2
  explanation: |
    It is a CSRF-vs-XSS trade. Header tokens are JS-readable (XSS-exposed) but not
    auto-sent (CSRF-safe). HttpOnly cookies aren't JS-readable (XSS-theft
    resistant) but auto-sent (CSRF-prone). Query-string placement loses both ways.
  ref: "concepts.md#token-placement-header-vs-cookie-vs-query-string"

- id: api-authentication-and-authorization-040
  difficulty: intermediate
  tags: [token-placement, query-string, rfc-6750]
  question: |
    RFC 6750 and OWASP both warn against which token placement, and why?
  options:
  - "A POST body, because bodies are unencrypted"
  - "A custom header, because proxies strip it"
  - "The Authorization header, because it is case-sensitive"
  - "The query string (URI), because URLs are logged, cached, bookmarked, and leaked via Referer"
  answer: 3
  explanation: |
    RFC 6750 2.3 discourages sending tokens in the URI query string: URLs are
    recorded in logs, history, bookmarks, and Referer headers, so the token
    leaks. Prefer the Authorization header.
  ref: "concepts.md#token-placement-header-vs-cookie-vs-query-string"

- id: api-authentication-and-authorization-041
  difficulty: intermediate
  tags: [hmac, sigv4, signing]
  question: |
    In HMAC request signing (e.g. AWS SigV4), what actually travels on the wire?
  options:
  - "A signature derived from the request using the secret, but not the secret"
  - "The decrypted request body"
  - "The client's private RSA key"
  - "The shared secret key itself"
  answer: 0
  explanation: |
    The client computes an HMAC signature over the request (method, path,
    headers, body hash, timestamp) using the secret, and sends only the
    signature. The secret never travels, so intercepting a request doesn't leak
    the credential.
  ref: "concepts.md#hmac-request-signing-aws-sigv4-style"

- id: api-authentication-and-authorization-042
  difficulty: intermediate
  tags: [hmac, integrity, replay]
  question: |
    Besides keeping the secret off the wire, what two properties does HMAC
    request signing provide?
  options:
  - "Compression and caching"
  - "Request integrity (tamper detection) and replay resistance via a signed timestamp/nonce"
  - "Automatic scope enforcement and token refresh"
  - "Browser CSRF protection and cookie encryption"
  answer: 1
  explanation: |
    The signature covers the body/headers, so a tampered request fails
    verification (integrity). A signed timestamp (and often a nonce) lets the
    server reject stale or replayed requests, e.g. outside a skew window.
  ref: "concepts.md#hmac-request-signing-aws-sigv4-style"

- id: api-authentication-and-authorization-043
  difficulty: advanced
  tags: [hmac, clock-skew, gotcha]
  question: |
    A service using SigV4-style signing suddenly gets auth failures on every
    request after a VM was restored from a snapshot. What is the likely cause?
  options:
  - "The Authorization header was renamed"
  - "The secret key was rotated"
  - "Client clock skew pushed the signed timestamp outside the allowed window"
  - "TLS certificates expired"
  answer: 2
  explanation: |
    HMAC signing includes a signed timestamp checked against a small skew window
    (e.g. ~5 minutes). If the client clock drifts (common after snapshot
    restore), every signature is rejected — a classic hard-to-diagnose incident.
  ref: "concepts.md#hmac-request-signing-aws-sigv4-style"

- id: api-authentication-and-authorization-044
  difficulty: advanced
  tags: [hmac, bearer, comparison]
  question: |
    How does HMAC request signing compare to a plain bearer token for a
    server-to-server API?
  options:
  - "They are functionally identical on the wire"
  - "Bearer tokens provide request integrity; signing does not"
  - "Signing is simpler to implement but weaker against interception"
  - "Signing is stronger against interception and tampering but more complex to implement correctly"
  answer: 3
  explanation: |
    Signing keeps the secret off the wire and adds integrity/replay resistance,
    making it stronger against interception and tampering — but canonicalization
    is complex and error-prone. Bearer tokens are simpler but weaker in these
    respects.
  ref: "concepts.md#hmac-request-signing-aws-sigv4-style"

- id: api-authentication-and-authorization-045
  difficulty: beginner
  tags: [mtls, service-to-service]
  question: |
    What distinguishes mutual TLS (mTLS) from ordinary TLS?
  options:
  - "Both client and server present and verify X.509 certificates, not just the server"
  - "mTLS runs over UDP"
  - "mTLS encrypts only the request body"
  - "mTLS uses no certificates at all"
  answer: 0
  explanation: |
    In mTLS both sides present X.509 certificates: the client verifies the server
    (as in normal TLS) and the server also verifies the client's certificate.
    Identity is proven at the transport layer before any application data.
  ref: "concepts.md#mtls-for-service-to-service"

- id: api-authentication-and-authorization-046
  difficulty: intermediate
  tags: [mtls, proof-of-possession, m2m]
  question: |
    Why is mTLS considered strong for machine-to-machine authentication?
  options:
  - "It sends the private key in a header for verification"
  - "The private key never leaves the client and never appears in a header/body, so there is no bearer secret to steal from logs"
  - "It eliminates the need for any authorization checks"
  - "It works natively in all web browsers"
  answer: 1
  explanation: |
    The credential is a private key that never leaves the client and never rides
    in a request, so there is no bearer secret to lift from a log or intercepted
    request. It underpins zero-trust service meshes.
  ref: "concepts.md#mtls-for-service-to-service"

- id: api-authentication-and-authorization-047
  difficulty: advanced
  tags: [mtls, authz, gotcha]
  question: |
    Which statement about mTLS is correct?
  options:
  - "mTLS removes the need for certificate rotation"
  - "mTLS is easiest to operate for browser-based clients"
  - "mTLS proves identity but you still must map the certificate to permissions for authorization"
  - "mTLS makes scope-based authorization automatic"
  answer: 2
  explanation: |
    mTLS authenticates identity at the transport layer but does not authorize —
    you still map the certificate subject to permissions. Its main cost is PKI
    lifecycle (issuance, short-lived rotation, revocation), usually automated by
    a mesh.
  ref: "concepts.md#mtls-for-service-to-service"

- id: api-authentication-and-authorization-048
  difficulty: advanced
  tags: [mtls, rfc-8705, certificate-bound]
  question: |
    What do certificate-bound access tokens (RFC 8705) achieve when combined
    with mTLS?
  options:
  - "They eliminate token expiry"
  - "They convert opaque tokens into JWTs"
  - "They let tokens be sent in the query string safely"
  - "A stolen bearer token cannot be used without the matching client certificate"
  answer: 3
  explanation: |
    RFC 8705 binds the access token to the client's TLS certificate, so a stolen
    token is useless without the corresponding private key/cert — turning a
    bearer token into a proof-of-possession token.
  ref: "concepts.md#mtls-for-service-to-service"

- id: api-authentication-and-authorization-049
  difficulty: beginner
  tags: [session, token, state]
  question: |
    What is the key difference between session-based and token-based (JWT)
    authentication?
  options:
  - "Sessions keep server-side state (session store); self-contained tokens are validated locally without a lookup"
  - "Tokens can only be used by browsers"
  - "Sessions never use cookies"
  - "Sessions are stateless; tokens require a server-side store"
  answer: 0
  explanation: |
    Session auth stores state server-side and looks up a session ID each request.
    A self-contained token (e.g. signed JWT) is validated locally via signature
    without any server-side lookup, making it stateless.
  ref: "concepts.md#session-vs-token-authentication-for-apis"

- id: api-authentication-and-authorization-050
  difficulty: intermediate
  tags: [session, scaling, revocation]
  question: |
    Which is an advantage of stateless token auth over server-side sessions?
  options:
  - "Instant revocation on logout"
  - "Trivial horizontal scaling — any node can validate without a shared session store"
  - "Smaller attack surface for XSS"
  - "No need for TLS"
  answer: 1
  explanation: |
    Stateless tokens scale horizontally: any node validates the signature with no
    shared/sticky session store. The trade-off is revocation — sessions can be
    deleted instantly, while a signed JWT is valid until exp.
  ref: "concepts.md#session-vs-token-authentication-for-apis"

- id: api-authentication-and-authorization-051
  difficulty: advanced
  tags: [jwt, revocation, logout, gotcha]
  question: |
    An interviewer asks: "JWTs are stateless, so how do you log a user out
    immediately?" What is the honest answer?
  options:
  - "You move the JWT into a cookie"
  - "Signed JWTs support free instant revocation by design"
  - "You largely can't without adding state; you approximate it with short TTLs + refresh rotation or a jti denylist"
  - "You change the signing key on every logout"
  answer: 2
  explanation: |
    A signed JWT is valid until exp with no server check, so there is no clean
    instant logout without reintroducing state. Mitigations: short access-token
    TTLs + refresh rotation, or a jti denylist (which adds state). Claiming free
    instant revocation is a red flag.
  ref: "concepts.md#session-vs-token-authentication-for-apis"

- id: api-authentication-and-authorization-052
  difficulty: intermediate
  tags: [session, when-to-use]
  question: |
    For which scenario is a server-side session cookie often the better choice
    over stateless tokens?
  options:
  - "Cross-service machine-to-machine calls"
  - "A high-throughput distributed API needing local-only validation"
  - "A multi-client API serving mobile apps and third parties"
  - "A single-domain server-rendered web app where instant logout/revocation matters and a fast store exists"
  answer: 3
  explanation: |
    Sessions shine for single-domain server-rendered web apps: cookies fit
    naturally, instant revocation is easy, and a fast store (e.g. Redis) handles
    lookups. Tokens win for multi-client, cross-domain, horizontally-scaled APIs.
  ref: "concepts.md#session-vs-token-authentication-for-apis"

- id: api-authentication-and-authorization-053
  difficulty: intermediate
  tags: [choosing, decision, scenario]
  question: |
    A third-party app wants to read a user's data with the user's consent, on
    the user's behalf. Which auth model fits best?
  options:
  - "OAuth 2 authorization code + PKCE with scopes"
  - "Client credentials with the app's own secret"
  - "mTLS between the third party and your API"
  - "A shared static API key embedded in the third-party app"
  answer: 0
  explanation: |
    Delegated access on behalf of a user, with consent and scopes, is exactly the
    authorization code + PKCE flow. It avoids password sharing and grants only
    the scopes the user consents to.
  ref: "concepts.md#choosing-an-auth-model"

- id: api-authentication-and-authorization-054
  difficulty: advanced
  tags: [choosing, layering, gateway]
  question: |
    Which statement about combining auth mechanisms is correct?
  options:
  - "You must pick exactly one mechanism for the whole system"
  - "Mechanisms layer: e.g. OAuth for user auth plus API keys for app identity/quota, behind a gateway doing mTLS downstream"
  - "OAuth and mTLS are mutually exclusive"
  - "A gateway can never terminate authentication"
  answer: 1
  explanation: |
    Real systems layer defenses. A public API might use OAuth for user auth and
    API keys for app quota, with a gateway terminating auth and doing mTLS to
    downstream services, forwarding a trusted internal identity.
  ref: "concepts.md#choosing-an-auth-model"

- id: api-authentication-and-authorization-055
  difficulty: intermediate
  tags: [choosing, m2m, scenario]
  question: |
    Two internal microservices in the same organization need to authenticate to
    each other with no user involved. Which options fit best?
  options:
  - "Embedding the user's password in each request"
  - "Authorization code + PKCE, or the implicit grant"
  - "mTLS or the client credentials flow"
  - "Session cookies with SameSite=Strict"
  answer: 2
  explanation: |
    For machine-to-machine with no user, mTLS (strong transport identity) or the
    client credentials flow (short-lived scoped tokens) are the standard choices,
    often layered.
  ref: "concepts.md#choosing-an-auth-model"

- id: api-authentication-and-authorization-056
  difficulty: intermediate
  tags: [owasp, bola, api1]
  question: |
    Which item is #1 on the OWASP API Security Top 10 (2023)?
  options:
  - "Server Side Request Forgery"
  - "Unrestricted Resource Consumption"
  - "Security Misconfiguration"
  - "Broken Object Level Authorization"
  answer: 3
  explanation: |
    API1:2023 is Broken Object Level Authorization (BOLA) — an authenticated
    caller accessing objects they don't own because the API trusts an ID from the
    request without an ownership check.
  ref: "concepts.md#common-security-pitfalls-owasp-api-security-top-10-2023"

- id: api-authentication-and-authorization-057
  difficulty: advanced
  tags: [jwt, alg-none, security]
  question: |
    Why is a JWT with header `"alg": "none"` dangerous?
  options:
  - "A naive verifier may accept the token as valid despite having no signature"
  - "It cannot be Base64-decoded"
  - "It forces the client to re-authenticate"
  - "It uses too strong an algorithm"
  answer: 0
  explanation: |
    alg:none declares an unsigned token. A verifier that doesn't pin an expected
    algorithm may accept it as valid, letting an attacker forge claims. Always
    pin the expected algorithm server-side.
  ref: "concepts.md#common-security-pitfalls-owasp-api-security-top-10-2023"

- id: api-authentication-and-authorization-058
  difficulty: advanced
  tags: [jwt, algorithm-confusion, security]
  question: |
    In an RS256-to-HS256 algorithm-confusion attack, how does the attacker forge
    a valid token?
  options:
  - "By brute-forcing the RSA private key"
  - "By switching alg to HS256 and signing with the server's public key, which the server then uses as an HMAC secret"
  - "By removing the signature entirely"
  - "By encrypting the payload with JWE"
  answer: 1
  explanation: |
    If the server naively uses its RSA public key as the verification key for any
    alg, an attacker flips alg to HS256 and HMAC-signs with that public key (which
    is not secret). The server verifies it as valid. Reject unexpected algs.
  ref: "concepts.md#common-security-pitfalls-owasp-api-security-top-10-2023"

- id: api-authentication-and-authorization-059
  difficulty: intermediate
  tags: [jwt, validation, claims]
  question: |
    Beyond checking the signature, which claims must a resource server validate
    on an incoming JWT?
  options:
  - "None — a valid signature is sufficient"
  - "Only the sub claim"
  - "exp (not expired), aud (intended for this API), and iss (trusted issuer)"
  - "Only the jti claim"
  answer: 2
  explanation: |
    A valid signature alone is not enough. The server must check exp (reject
    expired tokens), aud (token minted for this API, preventing cross-service
    replay), and iss (from a trusted issuer).
  ref: "concepts.md#common-security-pitfalls-owasp-api-security-top-10-2023"

- id: api-authentication-and-authorization-060
  difficulty: advanced
  tags: [owasp, function-level, api5, scenario]
  question: |
    A regular authenticated user calls DELETE /admin/users/42 and it succeeds
    because the endpoint never checks the caller's role. Which OWASP category is
    this?
  options:
  - "API4:2023 Unrestricted Resource Consumption"
  - "API7:2023 Server Side Request Forgery"
  - "API9:2023 Improper Inventory Management"
  - "API5:2023 Broken Function Level Authorization"
  answer: 3
  explanation: |
    Reaching an admin-only function without a role/function-level authorization
    check is API5:2023 Broken Function Level Authorization. Authentication was
    fine; the missing function-level authZ check is the flaw.
  ref: "concepts.md#common-security-pitfalls-owasp-api-security-top-10-2023"
