topic: "API Authentication & Authorization Patterns"
domain: rest-api-design
topic_slug: api-authentication-and-authorization
version: 1
questions:
- id: api-authentication-and-authorization-001
  difficulty: beginner
  tags: [authn, authz, definitions]
  question: |
    What is the difference between authentication and authorization?
  options:
  - "Authentication proves who you are; authorization decides what you may do"
  - "They are interchangeable synonyms for the same identity-verification step"
  - "Authentication applies to users; authorization only applies to machines"
  - "Authentication decides what you can do; authorization proves who you are"
  answer: 0
  explanation: |
    Authentication (authN) verifies identity ("who are you?"); authorization
    (authZ) verifies permissions ("what are you allowed to do?"). A request can
    be authenticated yet still forbidden.
  ref: "concepts.md#authentication-vs-authorization"

- id: api-authentication-and-authorization-002
  difficulty: beginner
  tags: [status-codes, 401, 403]
  question: |
    A caller sends a valid, non-expired token but tries to delete a resource
    their role is not permitted to touch. Which status code is correct?
  options:
  - "400 Bad Request"
  - "403 Forbidden"
  - "409 Conflict"
  - "401 Unauthorized"
  answer: 1
  explanation: |
    Identity is known and valid, but the action is not permitted — that is an
    authorization failure, which is 403 Forbidden. 401 is for missing/invalid
    credentials, and re-authenticating would not help here.
  ref: "concepts.md#authentication-vs-authorization"

- id: api-authentication-and-authorization-003
  difficulty: beginner
  tags: [status-codes, 401, www-authenticate]
  question: |
    Per RFC 9110, what must a 401 Unauthorized response include?
  options:
  - "An empty body with no headers, since a 401 must never disclose any details"
  - "A Retry-After header telling the client how many seconds to wait before retrying"
  - "A WWW-Authenticate header describing how to authenticate"
  - "A Location header redirecting the client to the interactive login page"
  answer: 2
  explanation: |
    RFC 9110 requires a 401 response to carry a WWW-Authenticate header telling
    the client which authentication scheme(s) and parameters apply (for OAuth
    bearer, e.g. error="invalid_token").
  ref: "concepts.md#authentication-vs-authorization"

- id: api-authentication-and-authorization-004
  difficulty: intermediate
  tags: [bola, owasp, authz]
  question: |
    An API authenticates users correctly, then serves GET /accounts/{id} using
    the id from the path without checking who owns the account. What is this?
  options:
  - "A rate-limiting failure that a throttling policy on the endpoint would resolve"
  - "An authentication (401) bug caused by the token signature not being verified"
  - "A correct, RESTful design because the path parameter uniquely identifies the resource"
  - "Broken Object Level Authorization (BOLA/IDOR)"
  answer: 3
  explanation: |
    This is BOLA (OWASP API1:2023), the top API risk. Authentication alone does
    not protect data; the API must authorize every object access against the
    authenticated principal (ownership check).
  ref: "concepts.md#authentication-vs-authorization"

- id: api-authentication-and-authorization-005
  difficulty: advanced
  tags: [status-codes, 404, information-leak]
  question: |
    Why might a security-conscious API return 404 instead of 403 when a
    caller requests an object they are not allowed to access?
  options:
  - "To avoid confirming that the object exists to an unauthorized caller"
  - "Because 403 Forbidden is not a valid HTTP status code for GET requests"
  - "Because HTTP caches are forbidden from storing 404 responses, unlike 403"
  - "404 is cheaper to compute than 403 because it skips the authorization lookup"
  answer: 0
  explanation: |
    A 403 still reveals that the resource exists. For sensitive resources some
    APIs deliberately return 404 to avoid leaking existence to callers who have
    no right to know. It is a conscious information-hiding trade-off.
  ref: "concepts.md#authentication-vs-authorization"

- id: api-authentication-and-authorization-006
  difficulty: beginner
  tags: [api-keys, placement]
  question: |
    What does an API key most commonly identify?
  options:
  - "An individual end user's session"
  - "The calling application or project"
  - "The physical server hardware"
  - "A single HTTP request only"
  answer: 1
  explanation: |
    An API key is an opaque string identifying (and often authenticating) a
    calling application/project, not usually a specific end user. It is coarse
    and typically long-lived.
  ref: "concepts.md#api-keys"

- id: api-authentication-and-authorization-007
  difficulty: beginner
  tags: [api-keys, query-string, placement]
  question: |
    Why is putting an API key in the URL query string
    (?api_key=sk_live_...) an anti-pattern?
  options:
  - "The key would be automatically URL-encoded, which corrupts its value in transit"
  - "Query strings are capped at 256 bytes, too short to carry a modern API key"
  - "URLs are logged in server/proxy logs, history, and Referer headers, leaking the key"
  - "HTTP forbids sending query parameters on GET requests that require authentication"
  answer: 2
  explanation: |
    URLs land in access logs, proxy logs, browser history, bookmarks, and the
    Referer header sent to third parties. A credential in a URL is effectively
    leaked. Keys (and tokens) belong in a header.
  ref: "concepts.md#api-keys"

- id: api-authentication-and-authorization-008
  difficulty: intermediate
  tags: [api-keys, rotation]
  question: |
    What is the safe pattern for rotating an API key with zero downtime?
  options:
  - "Rotate keys only during a scheduled maintenance outage window announced in advance"
  - "Change the key's value in place and rely on clients to re-read it automatically"
  - "Delete the old key immediately, then tell clients to request a fresh one on next failure"
  - "Issue the new key, accept both old and new during migration, then revoke the old"
  answer: 3
  explanation: |
    Overlapping validity: issue a new key, support both old and new
    simultaneously while clients migrate, then revoke the old one. Supporting
    multiple active keys per account enables zero-downtime rotation.
  ref: "concepts.md#api-keys"

- id: api-authentication-and-authorization-009
  difficulty: intermediate
  tags: [api-keys, oauth, comparison]
  question: |
    Compared to an OAuth 2.0 access token, an API key typically differs how?
  options:
  - "API keys are coarse, long-lived, and identify an app rather than a user with scopes"
  - "API keys require a browser redirect and user-consent flow to be obtained"
  - "API keys are always cryptographically signed JWTs carrying claims and an expiry"
  - "API keys are short-lived and carry per-user scopes negotiated at issuance"
  answer: 0
  explanation: |
    API keys are coarse and usually long-lived until rotated, identifying an
    application. OAuth access tokens are short-lived, carry per-scope/per-user
    granularity, and support delegated user consent.
  ref: "concepts.md#api-keys"

- id: api-authentication-and-authorization-010
  difficulty: intermediate
  tags: [api-keys, mobile, secrets]
  question: |
    Why should you never embed a secret API key inside a mobile app or SPA?
  options:
  - "It would noticeably slow down app startup by triggering a key-validation round trip"
  - "Public clients can be decompiled/inspected, so the key can be extracted and abused"
  - "Mobile apps and SPAs are technically unable to attach custom request headers"
  - "API keys are only accepted when the request originates from a server IP address"
  answer: 1
  explanation: |
    A key is a bearer credential — whoever holds it is the client. Public
    clients (mobile, SPA) can be inspected/decompiled, so an embedded secret key
    can be extracted. Public clients need PKCE-based flows, not embedded secrets.
  ref: "concepts.md#api-keys"

- id: api-authentication-and-authorization-011
  difficulty: beginner
  tags: [oauth, roles]
  question: |
    In OAuth 2.0, which role does your API most commonly play?
  options:
  - "The user-agent that renders the login screen and follows redirects"
  - "The authorization server that runs login/consent and mints the tokens"
  - "The resource server that validates tokens and enforces scopes"
  - "The resource owner who grants consent for delegated access"
  answer: 2
  explanation: |
    Your API is usually the resource server: it validates the access token on
    each request and enforces scopes. Login, consent, and token issuance live at
    the authorization server.
  ref: "concepts.md#oauth-20-and-21-at-the-api-level"

- id: api-authentication-and-authorization-012
  difficulty: intermediate
  tags: [oauth, oidc, authn-vs-authz]
  question: |
    OAuth 2.0 is fundamentally a framework for what, and what adds identity on
    top of it?
  options:
  - "Encryption; TLS adds authentication"
  - "Rate limiting; API gateways add identity"
  - "Authentication; OpenID Connect adds authorization"
  - "Delegated authorization; OpenID Connect adds an authentication/identity layer"
  answer: 3
  explanation: |
    OAuth 2.0 is a delegated authorization framework. OpenID Connect (OIDC) is
    the identity layer on top of it, adding an ID token (a JWT) for
    authentication ("who is the user").
  ref: "concepts.md#oauth-20-and-21-at-the-api-level"

- id: api-authentication-and-authorization-013
  difficulty: intermediate
  tags: [oauth-2-1, changes]
  question: |
    Which change is introduced by the OAuth 2.1 consolidation effort?
  options:
  - "The implicit grant and the resource owner password credentials grant are removed"
  - "Bearer tokens must now be sent in the query string instead of the Authorization header"
  - "Refresh tokens are eliminated entirely in favor of re-running the login flow each time"
  - "PKCE becomes optional for all clients since exact redirect matching replaces it"
  answer: 0
  explanation: |
    OAuth 2.1 removes the insecure implicit grant and the resource owner
    password credentials (ROPC) grant, and makes PKCE required for all
    authorization-code clients.
  ref: "concepts.md#oauth-20-and-21-at-the-api-level"

- id: api-authentication-and-authorization-014
  difficulty: advanced
  tags: [oauth-2-1, pkce]
  question: |
    Under OAuth 2.1, which statement about PKCE is correct?
  options:
  - "PKCE is required only for public clients, exactly as it was under OAuth 2.0"
  - "PKCE is required for all clients using the authorization code flow"
  - "PKCE replaces TLS as the mechanism providing token confidentiality on the wire"
  - "PKCE is used only with the client credentials flow for machine-to-machine calls"
  answer: 1
  explanation: |
    OAuth 2.0 required PKCE mainly for public clients; OAuth 2.1 extends the
    requirement to all clients using the authorization code flow, including
    confidential ones.
  ref: "concepts.md#oauth-20-and-21-at-the-api-level"

- id: api-authentication-and-authorization-015
  difficulty: beginner
  tags: [authorization-code, pkce, user]
  question: |
    Which OAuth flow is designed for an application acting on behalf of a
    logged-in user (web, mobile, SPA)?
  options:
  - "HMAC request signing"
  - "Client credentials"
  - "Authorization code (with PKCE)"
  - "Device polling with API keys"
  answer: 2
  explanation: |
    The authorization code flow (with PKCE) is for clients acting on behalf of a
    user. It obtains delegated, scoped access without the client ever handling
    the user's password.
  ref: "concepts.md#authorization-code-flow-with-pkce"

- id: api-authentication-and-authorization-016
  difficulty: intermediate
  tags: [pkce, rfc-7636]
  question: |
    What attack does PKCE (RFC 7636) primarily defend against?
  options:
  - "SQL injection against the authorization server's token endpoint database"
  - "TLS downgrade attacks that force the redirect onto plaintext HTTP"
  - "Denial-of-service caused by oversized token-request payloads"
  - "Interception/injection of the one-time authorization code"
  answer: 3
  explanation: |
    PKCE binds the authorization code to a secret code_verifier the legitimate
    client generated, so an intercepted authorization code cannot be exchanged
    for tokens by an attacker.
  ref: "concepts.md#authorization-code-flow-with-pkce"

- id: api-authentication-and-authorization-017
  difficulty: advanced
  tags: [pkce, state, csrf]
  question: |
    Why do you still need the `state` parameter even when using PKCE?
  options:
  - "state and PKCE defend different attacks: state guards CSRF on the redirect, PKCE guards code injection"
  - "state is the input value from which the code_challenge is derived by hashing"
  - "state replaces the need to register and validate a redirect_uri at the client"
  - "state encrypts the access token so it can travel safely in the redirect URL"
  answer: 0
  explanation: |
    They protect different things. `state` is a CSRF guard verifying the
    redirect belongs to the request the client initiated; PKCE protects against
    authorization-code interception/injection. You need both.
  ref: "concepts.md#authorization-code-flow-with-pkce"

- id: api-authentication-and-authorization-018
  difficulty: intermediate
  tags: [pkce, s256, code-challenge]
  question: |
    In PKCE with the recommended S256 method, what is sent to the /authorize
    endpoint?
  options:
  - "The client secret, authenticating the client directly at the authorize endpoint"
  - "A code_challenge that is the SHA-256 hash of the code_verifier"
  - "The access token, requested in advance and echoed back after the redirect"
  - "The raw code_verifier itself, sent in cleartext at the authorize endpoint"
  answer: 1
  explanation: |
    With S256, the client sends the code_challenge (SHA-256 of the
    code_verifier) at /authorize, and later proves possession by sending the raw
    code_verifier at /token. The plain method is discouraged.
  ref: "concepts.md#authorization-code-flow-with-pkce"

- id: api-authentication-and-authorization-019
  difficulty: advanced
  tags: [implicit-grant, tokens-in-url]
  question: |
    Why was the OAuth implicit grant removed in favor of authorization code +
    PKCE, even for SPAs?
  options:
  - "It only worked over plaintext HTTP because browsers refused HTTPS on the fragment"
  - "It was too slow for browsers because each redirect triggered a full database token lookup"
  - "It returned tokens in the redirect URL fragment, where they leak via logs/history/Referer"
  - "It required a long-lived client secret baked into the SPA that browsers could not protect"
  answer: 2
  explanation: |
    The implicit grant returned access tokens directly in the redirect URL
    fragment, exposing them to logs, browser history, and Referer leakage.
    Auth code + PKCE avoids putting tokens in URLs and is now preferred for SPAs.
  ref: "concepts.md#authorization-code-flow-with-pkce"

- id: api-authentication-and-authorization-020
  difficulty: beginner
  tags: [client-credentials, m2m]
  question: |
    Which OAuth flow suits a backend daemon calling another API as itself,
    with no user involved?
  options:
  - "Resource owner password credentials"
  - "Authorization code + PKCE"
  - "Implicit grant"
  - "Client credentials"
  answer: 3
  explanation: |
    The client credentials flow is for machine-to-machine calls where the client
    acts as itself, with no browser, redirect, or user consent. The token
    represents the application's own identity and scopes.
  ref: "concepts.md#client-credentials-flow"

- id: api-authentication-and-authorization-021
  difficulty: intermediate
  tags: [client-credentials, refresh-token]
  question: |
    Per RFC 6749, what does the client credentials flow NOT issue?
  options:
  - "A refresh token"
  - "A token_type field"
  - "An expires_in field"
  - "An access token"
  answer: 0
  explanation: |
    Client credentials does not issue a refresh token (RFC 6749 4.4.3). The
    client simply requests a new access token with its own credentials when the
    old one expires.
  ref: "concepts.md#client-credentials-flow"

- id: api-authentication-and-authorization-022
  difficulty: intermediate
  tags: [client-credentials, confidential-client]
  question: |
    Why must the client credentials flow be used only by a confidential client?
  options:
  - "Because it returns the access token in the URL query string, which browsers cannot read"
  - "Because it authenticates with a client_secret that must be stored securely, server-side"
  - "Because public clients such as browsers are technically unable to issue POST requests"
  - "Because it requires the resource owner's password to be collected on each request"
  answer: 1
  explanation: |
    The flow authenticates with a client_secret. Only confidential (server-side)
    clients can store that secret safely, so it is never used from a browser or
    mobile app.
  ref: "concepts.md#client-credentials-flow"

- id: api-authentication-and-authorization-023
  difficulty: advanced
  tags: [client-credentials, delegation, scenario]
  question: |
    Service A must call service B's API. If the requirement changes to "on
    behalf of the currently logged-in user," what changes?
  options:
  - "You move the token into the query string so service B can read the user id from the URL"
  - "Nothing — the client credentials token already carries the logged-in user's identity claims"
  - "You switch to a user-delegated flow such as authorization code + PKCE (or token exchange)"
  - "You embed the user's password inside the client_secret so B can re-verify it on each call"
  answer: 2
  explanation: |
    Client credentials represents the application itself with no user. To act on
    behalf of a specific user you need a user-delegated flow (authorization code
    + PKCE) or token exchange / on-behalf-of, which carries the user's identity
    and consent.
  ref: "concepts.md#client-credentials-flow"

- id: api-authentication-and-authorization-024
  difficulty: beginner
  tags: [scopes, least-privilege]
  question: |
    What do OAuth scopes represent in an access token?
  options:
  - "The IP address the token was issued from, restricting it to that single network origin"
  - "The token's cryptographic signing algorithm, telling the API how to verify its signature"
  - "The user's password hash, letting the API re-check the credential on every incoming request"
  - "The bounded set of operations the token is permitted to perform"
  answer: 3
  explanation: |
    Scopes (e.g. read:orders, write:orders) bound what a token may do,
    implementing least privilege at the token level. A read-only widget's token
    should not carry write/delete scopes.
  ref: "concepts.md#scopes-and-least-privilege"

- id: api-authentication-and-authorization-025
  difficulty: advanced
  tags: [scopes, bola, ownership]
  question: |
    A token carries the scope write:orders. Which check does that scope NOT
    perform?
  options:
  - "That the authenticated subject owns/may modify the specific order 12345"
  - "That the operation being attempted falls within the 'write order' class of actions"
  - "That the token was actually granted the write:orders permission at issuance time"
  - "That the token is permitted to perform write operations on orders in general"
  answer: 0
  explanation: |
    A scope is coarse: it says the token may write orders as a class of
    operation, not that the caller owns a specific order. The per-object
    ownership check (BOLA) is the API's own responsibility.
  ref: "concepts.md#scopes-and-least-privilege"

- id: api-authentication-and-authorization-026
  difficulty: intermediate
  tags: [scopes, insufficient-scope, 403]
  question: |
    A valid token lacks the scope required for an endpoint. What is the correct
    response?
  options:
  - "401 with WWW-Authenticate: Bearer error=\"invalid_token\""
  - "403 with WWW-Authenticate: Bearer error=\"insufficient_scope\""
  - "200 OK with an empty body, silently ignoring the operation the scope did not permit"
  - "400 Bad Request with no WWW-Authenticate header, treating it as a malformed client request"
  answer: 1
  explanation: |
    The token is valid (authenticated) but lacks the needed scope — an
    authorization failure — so 403 Forbidden with
    WWW-Authenticate: Bearer error="insufficient_scope" is correct.
  ref: "concepts.md#scopes-and-least-privilege"

- id: api-authentication-and-authorization-027
  difficulty: intermediate
  tags: [scopes, audience, aud]
  question: |
    What does the `aud` (audience) constraint on a token help prevent?
  options:
  - "The client application from decoding and reading the claims inside its own token"
  - "Tokens from growing too large by capping how many scopes the payload may list"
  - "A token minted for API X being replayed against API Y"
  - "Slow signature verification by telling the server which fast algorithm to use"
  answer: 2
  explanation: |
    The audience binds a token to a specific API. Verifying `aud` prevents a
    token issued for one service from being replayed against a different one.
  ref: "concepts.md#scopes-and-least-privilege"

- id: api-authentication-and-authorization-028
  difficulty: beginner
  tags: [bearer, rfc-6750]
  question: |
    What does "bearer" mean in "bearer token" (RFC 6750)?
  options:
  - "The token can be redeemed only once and is invalidated by the server after first use"
  - "The token is cryptographically bound to the client's TLS certificate and useless without it"
  - "The token is encrypted end to end, so its claims stay hidden from anyone who intercepts it"
  - "Whoever holds the token can use it, with no additional proof of possession"
  answer: 3
  explanation: |
    A bearer token is like cash: possession is sufficient to use it, with no
    extra proof of possession. That is why bearer tokens must travel over TLS
    and be treated as secrets.
  ref: "concepts.md#bearer-tokens-and-jwt"

- id: api-authentication-and-authorization-029
  difficulty: beginner
  tags: [jwt, rfc-7519, structure]
  question: |
    A JWT (RFC 7519) consists of which three Base64URL parts joined by dots?
  options:
  - "header.payload.signature"
  - "issuer.subject.audience, one segment per registered identity claim of the token"
  - "scope.expiry.nonce, encoding the permission, lifetime, and replay guard in order"
  - "key.iv.ciphertext, mirroring the three inputs of the symmetric encryption used"
  answer: 0
  explanation: |
    A JWT is header.payload.signature. The payload holds claims (iss, sub, aud,
    exp, etc.), and the JWS signature lets a resource server verify integrity
    without calling the authorization server.
  ref: "concepts.md#bearer-tokens-and-jwt"

- id: api-authentication-and-authorization-030
  difficulty: intermediate
  tags: [jwt, encryption, misconception]
  question: |
    Which statement about a standard signed JWT (JWS) is correct?
  options:
  - "It is encrypted by default, so the claims in the payload are hidden from the client that holds it"
  - "It is only Base64URL-encoded and readable by anyone who holds it"
  - "Its signature segment encrypts the payload, so decoding it requires the issuer's signing key"
  - "It cannot be validated locally without an introspection call to the authorization server first"
  answer: 1
  explanation: |
    A signed JWT is not encrypted — the payload is merely Base64URL-encoded and
    fully readable. For confidentiality you need JWE. Never store secrets in JWT
    claims of a signed-only token.
  ref: "concepts.md#bearer-tokens-and-jwt"

- id: api-authentication-and-authorization-031
  difficulty: intermediate
  tags: [jwt, opaque, introspection, comparison]
  question: |
    What is a key advantage of an opaque access token over a self-contained JWT?
  options:
  - "It never expires, so a client can keep reusing the same opaque token indefinitely"
  - "It can be validated entirely offline without any network call to the authorization server"
  - "It supports immediate revocation because the authz server is the source of truth"
  - "It is guaranteed to be smaller on the wire than a JWT in every possible case"
  answer: 2
  explanation: |
    Opaque tokens are validated via introspection against the authorization
    server, which is the source of truth — so they can be revoked immediately.
    Self-contained JWTs validate locally but are hard to revoke before exp.
  ref: "concepts.md#bearer-tokens-and-jwt"

- id: api-authentication-and-authorization-032
  difficulty: advanced
  tags: [jwt, terminology]
  question: |
    Which statement about the relationship between "bearer token" and "JWT" is
    correct?
  options:
  - "A JWT can never be used as a bearer token because its signature forbids header transport"
  - "JWT is the transport scheme for the Authorization header and bearer names a signing algorithm"
  - "Every bearer token is necessarily a JWT, since bearer usage requires the header.payload.signature form"
  - "A bearer token can be an opaque random string or a JWT; the terms are not synonyms"
  answer: 3
  explanation: |
    "Bearer" describes how the token is used (possession is enough); "JWT" is one
    possible format. A bearer token may be an opaque string or a JWT — they are
    not synonyms.
  ref: "concepts.md#bearer-tokens-and-jwt"

- id: api-authentication-and-authorization-033
  difficulty: beginner
  tags: [access-token, refresh-token, lifetime]
  question: |
    Why are access tokens typically kept short-lived while refresh tokens are
    long-lived?
  options:
  - "A leaked bearer access token can't be un-issued, so short TTLs limit the blast radius; refresh tokens keep users logged in"
  - "Because refresh tokens are sent to the resource server on every API call and so must rotate constantly"
  - "Because access tokens cannot be cryptographically signed, forcing a short life to bound the exposure"
  - "To make the API respond faster, since verifying a shorter token takes noticeably less CPU per call"
  answer: 0
  explanation: |
    Bearer access tokens can't be revoked once leaked, so short TTLs limit
    exposure. A long-lived refresh token (sent only to the authz server) lets the
    client silently obtain fresh access tokens without re-login.
  ref: "concepts.md#access-tokens-vs-refresh-tokens"

- id: api-authentication-and-authorization-034
  difficulty: intermediate
  tags: [refresh-token, endpoint]
  question: |
    To which endpoint should a refresh token be sent?
  options:
  - "The resource server (your API) on every request, alongside the access token in the header"
  - "Only the authorization server's token endpoint"
  - "Any endpoint that needs it, passed as a query parameter so intermediaries can cache it"
  - "The registered redirect_uri after login, so the browser can complete the token exchange"
  answer: 1
  explanation: |
    A refresh token is presented only to the authorization server's /token
    endpoint to mint new access tokens. It should never be sent to the resource
    server; only the short-lived access token goes there.
  ref: "concepts.md#access-tokens-vs-refresh-tokens"

- id: api-authentication-and-authorization-035
  difficulty: advanced
  tags: [refresh-token, rotation, replay]
  question: |
    What does refresh token rotation add over static refresh tokens?
  options:
  - "It lets the client skip re-requesting access tokens by reusing one refresh token forever"
  - "It makes the issued access tokens longer-lived so they need refreshing far less often"
  - "Each refresh issues a new refresh token and invalidates the old, so reuse of a stolen token is detected and the family revoked"
  - "It removes the need for TLS because the rotating value protects the token in transit"
  answer: 2
  explanation: |
    With rotation, each use of a refresh token issues a new one and invalidates
    the previous. If a stolen token is replayed after the legitimate client
    already rotated, the authz server detects reuse and revokes the whole token
    family.
  ref: "concepts.md#access-tokens-vs-refresh-tokens"

- id: api-authentication-and-authorization-036
  difficulty: intermediate
  tags: [access-token, refresh-token, comparison]
  question: |
    Which statement correctly contrasts access and refresh tokens?
  options:
  - "Refresh tokens are the short-lived ones sent per request, while access tokens are long-lived"
  - "Refresh tokens are always signed JWTs, whereas access tokens are always opaque random strings"
  - "Both the access and the refresh token are sent to the resource server on every single request"
  - "The access token is sent to the API on each call; the refresh token is long-lived and only reaches the authz server"
  answer: 3
  explanation: |
    The access token (often short-lived, sometimes a JWT) is sent to the API on
    every call. The refresh token is long-lived, usually opaque, and only sent to
    the authorization server to obtain new access tokens.
  ref: "concepts.md#access-tokens-vs-refresh-tokens"

- id: api-authentication-and-authorization-037
  difficulty: beginner
  tags: [token-placement, header]
  question: |
    What is the recommended place to send a bearer token for an API request?
  options:
  - "In the Authorization request header"
  - "In a cookie set by the client"
  - "As a segment of the request URL path"
  - "As a parameter in the URL query string"
  answer: 0
  explanation: |
    The Authorization: Bearer header is the recommended placement (RFC 6750). It
    is not sent automatically by browsers (CSRF-safe), not logged by default, and
    works for browser and non-browser clients alike.
  ref: "concepts.md#token-placement-header-vs-cookie-vs-query-string"

- id: api-authentication-and-authorization-038
  difficulty: intermediate
  tags: [token-placement, cookie, csrf]
  question: |
    Why does storing an auth token in a cookie introduce CSRF risk that a
    header-based token does not?
  options:
  - "Cookies cannot be encrypted at rest, so the auth token inside one is always exposed to any local process"
  - "Browsers attach matching cookies automatically, so a forged cross-site request carries the credential"
  - "Cookies are always readable by client-side JavaScript, letting any injected script forge a valid request"
  - "Cookies are transmitted in the URL query string, where a malicious site can copy them into its own request"
  answer: 1
  explanation: |
    Browsers send cookies automatically to matching requests, so a cross-site
    forged request rides along with the credential — the basis of CSRF. An
    Authorization header is not auto-attached, so it is inherently CSRF-safe.
  ref: "concepts.md#token-placement-header-vs-cookie-vs-query-string"

- id: api-authentication-and-authorization-039
  difficulty: advanced
  tags: [token-placement, csrf, xss, tradeoff]
  question: |
    Which best captures the security trade-off between an Authorization-header
    token and an HttpOnly cookie token?
  options:
  - "The HttpOnly cookie is strictly safer in every dimension, resisting both CSRF and XSS with no offsetting weakness"
  - "The Authorization-header token is strictly safer in every dimension, immune to both CSRF and XSS at once"
  - "The header token dodges CSRF but is XSS-readable by JS; the HttpOnly cookie resists XSS theft but invites CSRF"
  - "Both placements are equally and fully vulnerable to CSRF and XSS, so the choice between them makes no difference"
  answer: 2
  explanation: |
    It is a CSRF-vs-XSS trade. Header tokens are JS-readable (XSS-exposed) but not
    auto-sent (CSRF-safe). HttpOnly cookies aren't JS-readable (XSS-theft
    resistant) but auto-sent (CSRF-prone). Query-string placement loses both ways.
  ref: "concepts.md#token-placement-header-vs-cookie-vs-query-string"

- id: api-authentication-and-authorization-040
  difficulty: intermediate
  tags: [token-placement, query-string, rfc-6750]
  question: |
    RFC 6750 and OWASP both warn against which token placement, and why?
  options:
  - "A POST body, because request bodies travel unencrypted and are mirrored verbatim into server access logs"
  - "A custom X-Auth header, because intermediary proxies silently strip any non-standard header before forwarding"
  - "The Authorization header, because its scheme name is case-sensitive and mismatches break token parsing"
  - "The query string (URI), because URLs are logged, cached, bookmarked, and leaked via Referer"
  answer: 3
  explanation: |
    RFC 6750 2.3 discourages sending tokens in the URI query string: URLs are
    recorded in logs, history, bookmarks, and Referer headers, so the token
    leaks. Prefer the Authorization header.
  ref: "concepts.md#token-placement-header-vs-cookie-vs-query-string"

- id: api-authentication-and-authorization-041
  difficulty: intermediate
  tags: [hmac, sigv4, signing]
  question: |
    In HMAC request signing (e.g. AWS SigV4), what actually travels on the wire?
  options:
  - "A signature derived from the request using the secret, but not the secret"
  - "The full request body, decrypted by the client so the server can re-hash it"
  - "The client's private RSA key, transmitted once so the server can cache it"
  - "The shared secret key itself, sent in a header on the very first request"
  answer: 0
  explanation: |
    The client computes an HMAC signature over the request (method, path,
    headers, body hash, timestamp) using the secret, and sends only the
    signature. The secret never travels, so intercepting a request doesn't leak
    the credential.
  ref: "concepts.md#hmac-request-signing-aws-sigv4-style"

- id: api-authentication-and-authorization-042
  difficulty: intermediate
  tags: [hmac, integrity, replay]
  question: |
    Besides keeping the secret off the wire, what two properties does HMAC
    request signing provide?
  options:
  - "Payload compression and transparent response caching negotiated as part of the signing step"
  - "Request integrity (tamper detection) and replay resistance via a signed timestamp/nonce"
  - "Automatic OAuth scope enforcement and silent access-token refresh handled by the signing library"
  - "Built-in browser CSRF protection plus end-to-end encryption of the request and response cookies"
  answer: 1
  explanation: |
    The signature covers the body/headers, so a tampered request fails
    verification (integrity). A signed timestamp (and often a nonce) lets the
    server reject stale or replayed requests, e.g. outside a skew window.
  ref: "concepts.md#hmac-request-signing-aws-sigv4-style"

- id: api-authentication-and-authorization-043
  difficulty: advanced
  tags: [hmac, clock-skew, gotcha]
  question: |
    A service using SigV4-style signing suddenly gets auth failures on every
    request after a VM was restored from a snapshot. What is the likely cause?
  options:
  - "The restore renamed the Authorization header to a format the server rejects"
  - "The secret signing key was silently rotated by the snapshot restore process"
  - "Client clock skew pushed the signed timestamp outside the allowed window"
  - "The server's TLS certificates expired at the instant the VM was restored"
  answer: 2
  explanation: |
    HMAC signing includes a signed timestamp checked against a small skew window
    (e.g. ~5 minutes). If the client clock drifts (common after snapshot
    restore), every signature is rejected — a classic hard-to-diagnose incident.
  ref: "concepts.md#hmac-request-signing-aws-sigv4-style"

- id: api-authentication-and-authorization-044
  difficulty: advanced
  tags: [hmac, bearer, comparison]
  question: |
    How does HMAC request signing compare to a plain bearer token for a
    server-to-server API?
  options:
  - "They are functionally identical on the wire, differing only in the header name each uses to carry the credential"
  - "Bearer tokens provide request-body integrity and tamper detection, while HMAC signing offers no integrity guarantee"
  - "Signing is simpler to implement than bearer tokens yet strictly weaker against interception of the credential"
  - "Signing is stronger against interception and tampering but more complex to implement correctly"
  answer: 3
  explanation: |
    Signing keeps the secret off the wire and adds integrity/replay resistance,
    making it stronger against interception and tampering — but canonicalization
    is complex and error-prone. Bearer tokens are simpler but weaker in these
    respects.
  ref: "concepts.md#hmac-request-signing-aws-sigv4-style"

- id: api-authentication-and-authorization-045
  difficulty: beginner
  tags: [mtls, service-to-service]
  question: |
    What distinguishes mutual TLS (mTLS) from ordinary TLS?
  options:
  - "Both client and server present and verify X.509 certificates, not just the server"
  - "mTLS runs over UDP instead of TCP, using datagram handshakes to speed up verification"
  - "mTLS encrypts only the request body, leaving the headers and URL in cleartext on the wire"
  - "mTLS uses no certificates at all, relying instead on a pre-shared symmetric key per peer"
  answer: 0
  explanation: |
    In mTLS both sides present X.509 certificates: the client verifies the server
    (as in normal TLS) and the server also verifies the client's certificate.
    Identity is proven at the transport layer before any application data.
  ref: "concepts.md#mtls-for-service-to-service"

- id: api-authentication-and-authorization-046
  difficulty: intermediate
  tags: [mtls, proof-of-possession, m2m]
  question: |
    Why is mTLS considered strong for machine-to-machine authentication?
  options:
  - "It sends the client's private key in a request header so the server can verify it directly against its store"
  - "The private key never leaves the client and never appears in a header/body, so there is no bearer secret to steal from logs"
  - "It eliminates the need for any authorization checks because a valid certificate already implies full access"
  - "It works natively in all web browsers with no configuration, making it the simplest option for public clients"
  answer: 1
  explanation: |
    The credential is a private key that never leaves the client and never rides
    in a request, so there is no bearer secret to lift from a log or intercepted
    request. It underpins zero-trust service meshes.
  ref: "concepts.md#mtls-for-service-to-service"

- id: api-authentication-and-authorization-047
  difficulty: advanced
  tags: [mtls, authz, gotcha]
  question: |
    Which statement about mTLS is correct?
  options:
  - "mTLS removes the need for certificate rotation because transport-layer keys are validated fresh on each handshake"
  - "mTLS is easiest to operate for browser-based clients, which manage client certificates transparently for the user"
  - "mTLS proves identity but you still must map the certificate to permissions for authorization"
  - "mTLS makes scope-based authorization automatic by deriving the allowed operations from the certificate's subject fields"
  answer: 2
  explanation: |
    mTLS authenticates identity at the transport layer but does not authorize —
    you still map the certificate subject to permissions. Its main cost is PKI
    lifecycle (issuance, short-lived rotation, revocation), usually automated by
    a mesh.
  ref: "concepts.md#mtls-for-service-to-service"

- id: api-authentication-and-authorization-048
  difficulty: advanced
  tags: [mtls, rfc-8705, certificate-bound]
  question: |
    What do certificate-bound access tokens (RFC 8705) achieve when combined
    with mTLS?
  options:
  - "They eliminate token expiry, letting a certificate-bound token stay valid for the life of the client certificate"
  - "They convert opaque introspection-only tokens into self-contained JWTs the resource server can validate offline"
  - "They let access tokens be carried safely in the URL query string because the certificate hides them from logs"
  - "A stolen bearer token cannot be used without the matching client certificate"
  answer: 3
  explanation: |
    RFC 8705 binds the access token to the client's TLS certificate, so a stolen
    token is useless without the corresponding private key/cert — turning a
    bearer token into a proof-of-possession token.
  ref: "concepts.md#mtls-for-service-to-service"

- id: api-authentication-and-authorization-049
  difficulty: beginner
  tags: [session, token, state]
  question: |
    What is the key difference between session-based and token-based (JWT)
    authentication?
  options:
  - "Sessions keep server-side state (session store); self-contained tokens are validated locally without a lookup"
  - "Tokens can only be used by browsers, whereas sessions are the only option for mobile and machine-to-machine clients"
  - "Sessions never use cookies and instead pass the session id in the Authorization header on every single request"
  - "Sessions are entirely stateless, while self-contained tokens require a shared server-side store for every lookup"
  answer: 0
  explanation: |
    Session auth stores state server-side and looks up a session ID each request.
    A self-contained token (e.g. signed JWT) is validated locally via signature
    without any server-side lookup, making it stateless.
  ref: "concepts.md#session-vs-token-authentication-for-apis"

- id: api-authentication-and-authorization-050
  difficulty: intermediate
  tags: [session, scaling, revocation]
  question: |
    Which is an advantage of stateless token auth over server-side sessions?
  options:
  - "Instant revocation on logout, since deleting the signed token from the client immediately invalidates it server-side"
  - "Trivial horizontal scaling — any node can validate without a shared session store"
  - "A smaller attack surface for XSS, because a signed token cannot be read or exfiltrated by injected JavaScript"
  - "No need for TLS, because the token's signature already keeps its contents confidential in transit on the wire"
  answer: 1
  explanation: |
    Stateless tokens scale horizontally: any node validates the signature with no
    shared/sticky session store. The trade-off is revocation — sessions can be
    deleted instantly, while a signed JWT is valid until exp.
  ref: "concepts.md#session-vs-token-authentication-for-apis"

- id: api-authentication-and-authorization-051
  difficulty: advanced
  tags: [jwt, revocation, logout, gotcha]
  question: |
    An interviewer asks: "JWTs are stateless, so how do you log a user out
    immediately?" What is the honest answer?
  options:
  - "You move the JWT into an HttpOnly cookie, which the server can delete on logout to invalidate it instantly"
  - "Signed JWTs support free instant revocation by design, because the server re-checks each token against a live registry"
  - "You largely can't without adding state; you approximate it with short TTLs + refresh rotation or a jti denylist"
  - "You change the signing key on every logout, which forces that one user's outstanding token to fail verification"
  answer: 2
  explanation: |
    A signed JWT is valid until exp with no server check, so there is no clean
    instant logout without reintroducing state. Mitigations: short access-token
    TTLs + refresh rotation, or a jti denylist (which adds state). Claiming free
    instant revocation is a red flag.
  ref: "concepts.md#session-vs-token-authentication-for-apis"

- id: api-authentication-and-authorization-052
  difficulty: intermediate
  tags: [session, when-to-use]
  question: |
    For which scenario is a server-side session cookie often the better choice
    over stateless tokens?
  options:
  - "Cross-service machine-to-machine calls where no browser or user is involved in the request path"
  - "A high-throughput distributed API needing local-only validation with no shared session store between nodes"
  - "A multi-client API serving native mobile apps and external third-party integrations across many domains"
  - "A single-domain server-rendered web app where instant logout/revocation matters and a fast store exists"
  answer: 3
  explanation: |
    Sessions shine for single-domain server-rendered web apps: cookies fit
    naturally, instant revocation is easy, and a fast store (e.g. Redis) handles
    lookups. Tokens win for multi-client, cross-domain, horizontally-scaled APIs.
  ref: "concepts.md#session-vs-token-authentication-for-apis"

- id: api-authentication-and-authorization-053
  difficulty: intermediate
  tags: [choosing, decision, scenario]
  question: |
    A third-party app wants to read a user's data with the user's consent, on
    the user's behalf. Which auth model fits best?
  options:
  - "OAuth 2 authorization code + PKCE with scopes"
  - "Client credentials with the app's own secret"
  - "mTLS between the third party and your API"
  - "A shared static API key embedded in the third-party app"
  answer: 0
  explanation: |
    Delegated access on behalf of a user, with consent and scopes, is exactly the
    authorization code + PKCE flow. It avoids password sharing and grants only
    the scopes the user consents to.
  ref: "concepts.md#choosing-an-auth-model"

- id: api-authentication-and-authorization-054
  difficulty: advanced
  tags: [choosing, layering, gateway]
  question: |
    Which statement about combining auth mechanisms is correct?
  options:
  - "You must pick exactly one mechanism for the whole system, because mixing two auth schemes creates conflicting trust decisions"
  - "Mechanisms layer: e.g. OAuth for user auth plus API keys for app identity/quota, behind a gateway doing mTLS downstream"
  - "OAuth and mTLS are mutually exclusive, since a request authenticated by a client certificate can never also carry a token"
  - "A gateway can never terminate authentication and must always forward the raw credential unchanged to the backend service"
  answer: 1
  explanation: |
    Real systems layer defenses. A public API might use OAuth for user auth and
    API keys for app quota, with a gateway terminating auth and doing mTLS to
    downstream services, forwarding a trusted internal identity.
  ref: "concepts.md#choosing-an-auth-model"

- id: api-authentication-and-authorization-055
  difficulty: intermediate
  tags: [choosing, m2m, scenario]
  question: |
    Two internal microservices in the same organization need to authenticate to
    each other with no user involved. Which options fit best?
  options:
  - "Embedding the user's password in each request"
  - "Authorization code + PKCE, or the implicit grant"
  - "mTLS or the client credentials flow"
  - "Session cookies with SameSite=Strict"
  answer: 2
  explanation: |
    For machine-to-machine with no user, mTLS (strong transport identity) or the
    client credentials flow (short-lived scoped tokens) are the standard choices,
    often layered.
  ref: "concepts.md#choosing-an-auth-model"

- id: api-authentication-and-authorization-056
  difficulty: intermediate
  tags: [owasp, bola, api1]
  question: |
    Which item is #1 on the OWASP API Security Top 10 (2023)?
  options:
  - "Server Side Request Forgery"
  - "Unrestricted Resource Consumption"
  - "Security Misconfiguration"
  - "Broken Object Level Authorization"
  answer: 3
  explanation: |
    API1:2023 is Broken Object Level Authorization (BOLA) — an authenticated
    caller accessing objects they don't own because the API trusts an ID from the
    request without an ownership check.
  ref: "concepts.md#common-security-pitfalls-owasp-api-security-top-10-2023"

- id: api-authentication-and-authorization-057
  difficulty: advanced
  tags: [jwt, alg-none, security]
  question: |
    Why is a JWT with header `"alg": "none"` dangerous?
  options:
  - "A naive verifier may accept the token as valid despite having no signature"
  - "The empty signature segment blocks Base64URL-decoding of the payload"
  - "It forces the client to re-authenticate before every single API request"
  - "It selects an algorithm too computationally strong to verify in time"
  answer: 0
  explanation: |
    alg:none declares an unsigned token. A verifier that doesn't pin an expected
    algorithm may accept it as valid, letting an attacker forge claims. Always
    pin the expected algorithm server-side.
  ref: "concepts.md#common-security-pitfalls-owasp-api-security-top-10-2023"

- id: api-authentication-and-authorization-058
  difficulty: advanced
  tags: [jwt, algorithm-confusion, security]
  question: |
    In an RS256-to-HS256 algorithm-confusion attack, how does the attacker forge
    a valid token?
  options:
  - "By brute-forcing the 2048-bit RSA private key offline from the public modulus in a few minutes"
  - "By switching alg to HS256 and signing with the server's public key, which the server then uses as an HMAC secret"
  - "By removing the signature segment entirely and relying on the server skipping verification for empty signatures"
  - "By re-encrypting the payload as a JWE so the server decrypts it with its own private key and trusts the claims"
  answer: 1
  explanation: |
    If the server naively uses its RSA public key as the verification key for any
    alg, an attacker flips alg to HS256 and HMAC-signs with that public key (which
    is not secret). The server verifies it as valid. Reject unexpected algs.
  ref: "concepts.md#common-security-pitfalls-owasp-api-security-top-10-2023"

- id: api-authentication-and-authorization-059
  difficulty: intermediate
  tags: [jwt, validation, claims]
  question: |
    Beyond checking the signature, which claims must a resource server validate
    on an incoming JWT?
  options:
  - "None — once the signature verifies, every claim inside is guaranteed trustworthy"
  - "Only the sub claim, to confirm which user account the token was minted for"
  - "exp (not expired), aud (intended for this API), and iss (trusted issuer)"
  - "Only the jti claim, to confirm the token identifier has not been seen before"
  answer: 2
  explanation: |
    A valid signature alone is not enough. The server must check exp (reject
    expired tokens), aud (token minted for this API, preventing cross-service
    replay), and iss (from a trusted issuer).
  ref: "concepts.md#common-security-pitfalls-owasp-api-security-top-10-2023"

- id: api-authentication-and-authorization-060
  difficulty: advanced
  tags: [owasp, function-level, api5, scenario]
  question: |
    A regular authenticated user calls DELETE /admin/users/42 and it succeeds
    because the endpoint never checks the caller's role. Which OWASP category is
    this?
  options:
  - "API4:2023 Unrestricted Resource Consumption"
  - "API7:2023 Server Side Request Forgery"
  - "API9:2023 Improper Inventory Management"
  - "API5:2023 Broken Function Level Authorization"
  answer: 3
  explanation: |
    Reaching an admin-only function without a role/function-level authorization
    check is API5:2023 Broken Function Level Authorization. Authentication was
    fine; the missing function-level authZ check is the flaw.
  ref: "concepts.md#common-security-pitfalls-owasp-api-security-top-10-2023"

- id: api-authentication-and-authorization-061
  difficulty: advanced
  tags: [oauth-2-1, redirect-uri, exact-match]
  question: |
    Under OAuth 2.1, how must a resource/authorization server compare a client's
    supplied redirect_uri against its registered values?
  options:
  - "By exact string match, with the only relaxation being the loopback port for native apps"
  - "By matching the scheme and host only, treating any path under that origin as equivalent"
  - "By prefix match so any registered path plus additional trailing subpaths is accepted"
  - "By case-insensitive domain-suffix matching so any subdomain of the registered host passes"
  answer: 0
  explanation: |
    OAuth 2.1 mandates exact string matching of redirect URIs (no wildcard,
    prefix, or substring matching). The sole exception is the loopback interface
    port for native apps (http://127.0.0.1:{port}/...). Loose matching is the root
    of open-redirect and code-leak attacks.
  ref: "concepts.md#oauth-21-changes-and-the-security-bcp-rfc-9700"

- id: api-authentication-and-authorization-062
  difficulty: expert
  tags: [rfc-9700, bcp-240, oauth-2-1]
  question: |
    A candidate is asked to cite the standard that motivates OAuth 2.1's security
    hardening. Which is correct?
  options:
  - "RFC 6819 alone, the 2013 threat model that OAuth 2.1 adopts verbatim with no later updates"
  - "RFC 9700 (BCP 240), the OAuth 2.0 Security Best Current Practice published Jan 2025"
  - "RFC 6750, the Bearer Token Usage spec that first mandated PKCE and exact redirect matching"
  - "RFC 7519, the JWT specification that defines the OAuth 2.1 authorization-code hardening rules"
  answer: 1
  explanation: |
    RFC 9700 / BCP 240 (Jan 2025) is the OAuth 2.0 Security Best Current Practice.
    It updates RFC 6749/6750/6819 and is the documented "why" behind nearly every
    OAuth 2.1 change. Senior candidates cite the BCP, not just "best practice."
  ref: "concepts.md#oauth-21-changes-and-the-security-bcp-rfc-9700"

- id: api-authentication-and-authorization-063
  difficulty: expert
  tags: [oauth-2-1, refresh-token, public-client]
  question: |
    Beyond removing implicit/ROPC and requiring PKCE, what does OAuth 2.1 require
    of refresh tokens issued to public clients?
  options:
  - "They must be encrypted as a JWE using the resource server's public key before storage"
  - "They must be sent to the resource server on every request alongside the access token"
  - "They must be sender-constrained OR one-time-use (rotated with reuse detection)"
  - "They must never expire so the user stays logged in without ever re-running the flow"
  answer: 2
  explanation: |
    A static long-lived refresh token in a browser/native app is no longer
    acceptable. OAuth 2.1 requires public-client refresh tokens to be either
    sender-constrained (DPoP/mTLS) or one-time-use via rotation with reuse
    detection.
  ref: "concepts.md#oauth-21-changes-and-the-security-bcp-rfc-9700"

- id: api-authentication-and-authorization-064
  difficulty: expert
  tags: [mix-up, rfc-9207, iss, multi-as]
  question: |
    A client integrates with multiple authorization servers. An attacker tricks
    it into sending a code issued by AS-A to AS-B. Which countermeasure directly
    addresses this mix-up attack?
  options:
  - "Rotating the client_secret on a shorter schedule so a leaked secret expires before misuse"
  - "Verifying the iss authorization-response parameter (RFC 9207) to confirm which AS responded"
  - "Increasing the access-token TTL so tokens survive the extra redirect between the two servers"
  - "Switching the token format from a self-contained JWT to an opaque introspection-only reference"
  answer: 1
  explanation: |
    The mix-up attack targets clients talking to more than one AS. RFC 9207 adds
    an iss parameter to the authorization response so the client verifies which AS
    actually responded (or use distinct per-AS redirect URIs). PKCE and state do
    not defend mix-up.
  ref: "concepts.md#redirect-and-authorization-code-attacks"

- id: api-authentication-and-authorization-065
  difficulty: expert
  tags: [redirect, 307, 303, credentials]
  question: |
    Why does the OAuth security guidance require the authorization response
    redirect to use HTTP 303 See Other rather than 307 Temporary Redirect?
  options:
  - "307 responses are never cacheable, so intermediaries drop them and break the redirect flow"
  - "303 is parsed noticeably faster by browsers because it carries a shorter status reason phrase"
  - "307 re-sends the original POST body (which may hold credentials) to the redirect target, whereas 303 forces a GET"
  - "303 automatically encrypts the Location header so the authorization code cannot be read in transit"
  answer: 2
  explanation: |
    A 307 preserves the request method and body, so the browser would re-POST the
    user's submitted credentials to the redirect target (potentially an attacker).
    303 See Other forces the follow-up request to be a GET with no body.
  ref: "concepts.md#redirect-and-authorization-code-attacks"

- id: api-authentication-and-authorization-066
  difficulty: expert
  tags: [pkce, downgrade, attack]
  question: |
    What must the authorization server do to prevent a PKCE downgrade attack?
  options:
  - "Accept any code_verifier at the token endpoint as long as the connection was made over TLS"
  - "Reject a token request that presents a code_verifier when the original authorization request carried no code_challenge (and vice versa)"
  - "Require the plain PKCE method instead of S256 so the challenge can be compared as cleartext"
  - "Issue the access token directly in the authorization response instead of at the token endpoint"
  answer: 1
  explanation: |
    In a downgrade attack the attacker strips code_challenge from the auth request
    then supplies any code_verifier later. The AS must enforce consistency: a
    code_verifier at /token requires a code_challenge to have been present at
    /authorize, and vice versa.
  ref: "concepts.md#redirect-and-authorization-code-attacks"

- id: api-authentication-and-authorization-067
  difficulty: advanced
  tags: [device-grant, rfc-8628, scenario]
  question: |
    A smart-TV app with no keyboard needs to log a user in. Which OAuth grant is
    designed for this?
  options:
  - "Implicit grant"
  - "Client credentials"
  - "Device Authorization Grant (RFC 8628)"
  - "Resource owner password credentials"
  answer: 2
  explanation: |
    The Device Authorization Grant (RFC 8628) targets input-constrained devices.
    The device shows a user_code and verification_uri; the user completes login on
    a phone/laptop while the device polls the token endpoint.
  ref: "concepts.md#device-authorization-grant"

- id: api-authentication-and-authorization-068
  difficulty: advanced
  tags: [device-grant, polling, slow-down]
  question: |
    While a device polls the token endpoint in the Device Authorization Grant,
    the AS returns "slow_down". What should the device do?
  options:
  - "Abort the flow entirely and restart by requesting a fresh code from the device authorization endpoint"
  - "Increase its polling interval (by 5 seconds) and keep polling"
  - "Immediately retry the token endpoint with no delay, treating slow_down as a transient network error"
  - "Switch to the client credentials grant and obtain a token as the device's own identity instead"
  answer: 1
  explanation: |
    slow_down tells the device it is polling too fast; per RFC 8628 it should
    increase the interval by 5 seconds and continue. authorization_pending means
    keep waiting at the current interval; expired_token/access_denied are terminal.
  ref: "concepts.md#device-authorization-grant"

- id: api-authentication-and-authorization-069
  difficulty: expert
  tags: [token-exchange, rfc-8693, delegation]
  question: |
    In RFC 8693 token exchange, what distinguishes delegation from impersonation?
  options:
  - "Delegation encrypts the exchanged token as a JWE while impersonation leaves it as a plain JWS"
  - "Delegation records both identities via the act (actor) claim; impersonation makes the new token indistinguishable from the subject"
  - "Impersonation preserves the full audit chain of actors while delegation deliberately erases it"
  - "Delegation may only be requested by machine clients while impersonation is restricted to end users"
  answer: 1
  explanation: |
    With impersonation the issued token looks exactly like the subject, so
    downstream can't tell a service is acting. With delegation the token carries an
    act claim (a nested "B acting for A" chain), preserving an auditable trail. The
    may_act claim declares which actor is permitted.
  ref: "concepts.md#token-exchange-and-delegation"

- id: api-authentication-and-authorization-070
  difficulty: expert
  tags: [token-exchange, microservices, downscoping, scenario]
  question: |
    A request traverses five microservices on behalf of one user. Which approach
    best carries identity while limiting blast radius?
  options:
  - "Forward the original broad access token unchanged to every downstream service so each can reuse the same audience"
  - "Have each hop exchange its inbound token (RFC 8693) for a downscoped token with the next service's audience"
  - "Put the user's raw password in a propagated header so each downstream service can re-verify the identity itself"
  - "Issue one long-lived token with scope '*' shared by all five services so no hop ever needs to re-mint a token"
  answer: 1
  explanation: |
    Token exchange lets each hop narrow audience and scope for the next service,
    so a token leaked deep in the chain has minimal reach. Forwarding one broad
    token everywhere maximizes blast radius and breaks audience restriction.
  ref: "concepts.md#token-exchange-and-delegation"

- id: api-authentication-and-authorization-071
  difficulty: expert
  tags: [rfc-9068, at-jwt, id-token]
  question: |
    Your API receives a JWT whose aud is the client application and which contains
    no scope claim. Per RFC 9068 practice, how should the resource server treat it?
  options:
  - "Accept it — any signed JWT from the trusted issuer is a valid access token"
  - "Reject it — this looks like an ID token (aud = client, no scope), not an at+jwt access token"
  - "Accept it but automatically downgrade the granted scopes to read-only since it carries no scope claim"
  - "Exchange it at the token endpoint for a refresh token and then continue with the derived access token"
  answer: 1
  explanation: |
    An ID token is meant for the client to learn who the user is; its aud is the
    client and it lacks scope. RFC 9068 defines typ: at+jwt for access tokens so
    the API can distinguish them. Accepting an ID token as an access token is a
    classic confusion trap — reject it.
  ref: "concepts.md#jwt-access-token-profile-and-validation-checklist"

- id: api-authentication-and-authorization-072
  difficulty: expert
  tags: [jwt, validation, order, alg]
  question: |
    In a rigorous JWT validation routine, why must the server select the
    verification algorithm from a server-side allow-list rather than from the
    token's own alg header?
  options:
  - "Because Base64URL-decoding the header to read its alg field is computationally expensive per request"
  - "Because trusting the token's alg lets an attacker choose 'none' or force RS256->HS256 confusion"
  - "Because the alg header is always omitted in valid tokens and only forged tokens ever include it"
  - "Because pinning the algorithm from an allow-list makes the signature-verification math run faster"
  answer: 1
  explanation: |
    The token's alg is attacker-controlled. Trusting it enables alg:none (unsigned
    acceptance) and the RS256->HS256 confusion attack. The server must pin/allow-list
    the expected algorithm(s) and ignore the token's claimed alg.
  ref: "concepts.md#jwt-access-token-profile-and-validation-checklist"

- id: api-authentication-and-authorization-073
  difficulty: advanced
  tags: [jwt, rfc-8725, signing]
  question: |
    Why is asymmetric signing (e.g. ES256/EdDSA/RS256) generally preferred over
    HS256 for tokens validated by multiple resource servers?
  options:
  - "HS256 is a symmetric MAC, so it is structurally unable to carry an exp claim and every HMAC-signed token is therefore non-expiring"
  - "Asymmetric signing lets resource servers hold only a public key, so they can verify but not mint tokens, and structurally avoids RS256->HS256 confusion"
  - "HS256 was deprecated and dropped from RFC 7519, so a multi-verifier deployment must switch to an asymmetric algorithm to stay compliant"
  - "Asymmetric signatures such as ES256 are always shorter on the wire than an HMAC tag, shrinking token size for every resource server"
  answer: 1
  explanation: |
    With HS256 every verifier shares the secret and could forge tokens. Asymmetric
    signing distributes only a public key, so resource servers verify without being
    able to sign, and the shared-secret-vs-public-key confusion attack is avoided.
    RFC 8725 (JWT BCP) captures these rules.
  ref: "concepts.md#jwt-access-token-profile-and-validation-checklist"

- id: api-authentication-and-authorization-074
  difficulty: expert
  tags: [jwks, key-rotation, zero-downtime]
  question: |
    How do you rotate a JWT signing key with zero downtime and no rejected tokens
    using a JWKS?
  options:
  - "Swap the signing key atomically at midnight and immediately reject every token still signed with the previous key"
  - "Publish the new public key (new kid) to the JWKS before signing with it, and keep the old key until all tokens it signed expire"
  - "Embed both the old and the new private signing keys inside every issued token so each verifier picks whichever matches"
  - "Point each token's jku header at a new key server so verifiers fetch the rotated public key from the URL in the token"
  answer: 1
  explanation: |
    Overlapping keys enable zero-downtime rotation: publish the new public key
    (with a new kid) to the JWKS before you start signing with it, and retain the
    old key until tokens signed by it have expired. Verifiers select by kid, so
    both generations validate.
  ref: "concepts.md#jwks-and-signing-key-rotation"

- id: api-authentication-and-authorization-075
  difficulty: advanced
  tags: [jwks, rfc-8414, metadata]
  question: |
    How does a resource server legitimately discover the authorization server's
    public signing keys?
  options:
  - "From the jku header inside each incoming token, trusting the URL the token itself supplies to fetch the keys"
  - "From the jwks_uri published in the AS metadata (RFC 8414 / OIDC discovery), pinned to the trusted issuer"
  - "By calling the token introspection endpoint on each request and reading the signing key out of its response"
  - "By decoding the kid header value, which for RS256 embeds the Base64URL-encoded public key itself"
  answer: 1
  explanation: |
    The RS fetches keys from the jwks_uri found in the AS metadata document (RFC
    8414 or OIDC discovery), caching per Cache-Control and selecting by kid. It
    must pin iss/jwks_uri to the trusted issuer and never resolve keys from a
    token-controlled jku/kid.
  ref: "concepts.md#jwks-and-signing-key-rotation"

- id: api-authentication-and-authorization-076
  difficulty: expert
  tags: [introspection, phantom-token, gateway]
  question: |
    A design needs external tokens to be immediately revocable AND internal
    service calls to validate statelessly. Which pattern achieves both?
  options:
  - "Phantom Token: gateway introspects the opaque token once, then forwards a short-lived JWT internally"
  - "Send the same self-contained JWT to every service and simply accept that tokens can never be revoked"
  - "Use only opaque tokens end to end, calling the introspection endpoint at every internal service hop"
  - "Put the long-lived refresh token in the Authorization header on internal service-to-service calls"
  answer: 0
  explanation: |
    The Phantom Token pattern gives clients an opaque, revocable token externally;
    the gateway introspects it once and swaps in a short-lived JWT for internal
    hops, which then validate locally. It combines revocability with stateless
    internal validation.
  ref: "concepts.md#token-introspection-phantom-and-split-tokens"

- id: api-authentication-and-authorization-077
  difficulty: advanced
  tags: [introspection, rfc-7662, active]
  question: |
    In an RFC 7662 introspection response, which single field authoritatively
    tells the resource server whether the token is currently usable?
  options:
  - "scope"
  - "active (a boolean)"
  - "client_id"
  - "sub"
  answer: 1
  explanation: |
    RFC 7662's introspection response centers on the boolean active field: true
    means the token is currently valid/usable, false means it is not (expired,
    revoked, or unknown). Other fields (scope, sub, exp, client_id) are only
    meaningful when active is true.
  ref: "concepts.md#token-introspection-phantom-and-split-tokens"

- id: api-authentication-and-authorization-078
  difficulty: expert
  tags: [dpop, rfc-9449, proof-of-possession]
  question: |
    A leaked bearer access token is fully usable by whoever steals it. For a SPA
    where mTLS is impractical, how do you make the token sender-constrained?
  options:
  - "Shorten the access-token TTL to zero so it expires the instant it is issued and cannot be replayed"
  - "DPoP (RFC 9449): bind the token to the client's key via cnf.jkt and require a per-request proof JWT"
  - "Move the token into an HttpOnly, Secure cookie so browser JavaScript cannot read or exfiltrate it"
  - "Encrypt the token with the client's password so only someone who knows that password can present it"
  answer: 1
  explanation: |
    DPoP makes the token sender-constrained at the application layer: the AS binds
    the access token to the client key's thumbprint (cnf.jkt), and the client
    sends a per-request DPoP proof JWT signed by that key. A stolen token is
    useless without the private key — the answer when mTLS isn't practical.
  ref: "concepts.md#dpop-sender-constrained-tokens"

- id: api-authentication-and-authorization-079
  difficulty: expert
  tags: [dpop, proof, ath, htm, htu]
  question: |
    When a DPoP-using client calls a resource server, what does the DPoP proof
    JWT's payload contain to bind the proof to that specific request and token?
  options:
  - "The client_secret and the registered redirect_uri, echoed back to prove the client's registration"
  - "htm (method), htu (URI), iat, jti, and ath (base64url SHA-256 of the access token)"
  - "The full access token repeated verbatim as a payload claim so the server can compare the two copies"
  - "The user's password hash together with the requested scope, binding the proof to the login"
  answer: 1
  explanation: |
    The DPoP proof binds to the request via htm (HTTP method) and htu (request
    URI), carries iat and a unique jti for replay tracking, and — when hitting a
    resource server — ath, the base64url SHA-256 hash of the access token, tying
    the proof to that exact token.
  ref: "concepts.md#dpop-sender-constrained-tokens"

- id: api-authentication-and-authorization-080
  difficulty: expert
  tags: [dpop, bearer, resource-server]
  question: |
    Why must a resource server reject a DPoP-bound access token that arrives as a
    plain "Authorization: Bearer" (no DPoP proof)?
  options:
  - "Because DPoP-bound access tokens are always issued already expired, so the Bearer form is never valid"
  - "Because otherwise an attacker who steals the token bypasses the proof-of-possession binding entirely"
  - "Because the Bearer authentication scheme was formally deprecated and removed by RFC 9449 for all clients"
  - "Because DPoP-bound tokens are larger than the maximum size the Authorization: Bearer header permits"
  answer: 1
  explanation: |
    If the RS accepted a DPoP-bound token as a plain Bearer, a thief could present
    the stolen token without the key-proof and the sender-constraint would be
    meaningless. RFC 9449 requires the RS to reject a DPoP token presented as
    Bearer.
  ref: "concepts.md#dpop-sender-constrained-tokens"

- id: api-authentication-and-authorization-081
  difficulty: advanced
  tags: [dpop, nonce, replay]
  question: |
    What is the purpose of the DPoP-Nonce response header and the use_dpop_nonce
    error?
  options:
  - "To force the client to rotate its DPoP key pair on every request so a stolen key is useless after one use"
  - "To force the client to include a server-chosen nonce in its proof, defeating pre-generated proofs"
  - "To encrypt the access token with a fresh server-supplied key so it cannot be read in transit"
  - "To signal to the client that the access token has been revoked and a new one must be requested"
  answer: 1
  explanation: |
    A server can require a server-chosen nonce (via the DPoP-Nonce header and the
    use_dpop_nonce error — HTTP 400 at the AS, 401 at the RS). The client retries
    embedding the nonce, which prevents an attacker from pre-computing proofs ahead
    of time.
  ref: "concepts.md#dpop-sender-constrained-tokens"

- id: api-authentication-and-authorization-082
  difficulty: expert
  tags: [dpop, mtls, cnf, comparison]
  question: |
    How do DPoP and mTLS-based proof-of-possession differ in their token
    confirmation claim and typical use?
  options:
  - "DPoP uses cnf.jkt (JWK thumbprint) for public clients; mTLS uses cnf.x5t#S256 (cert thumbprint) for PKI/backend clients"
  - "Both bind via the cnf.x5t#S256 certificate thumbprint and are fully interchangeable across client types"
  - "DPoP operates at the TLS transport layer while mTLS is purely an application-layer proof carried in a JWT"
  - "mTLS binds tokens via cnf.jkt while DPoP carries no confirmation claim and relies only on TLS"
  answer: 0
  explanation: |
    Both are proof-of-possession. DPoP binds via cnf.jkt (the JWK SHA-256
    thumbprint) and suits public clients (SPA/native). mTLS cert-bound tokens (RFC
    8705) bind via cnf.x5t#S256 (the client-cert thumbprint) and suit backend
    services inside a PKI/mesh.
  ref: "concepts.md#dpop-sender-constrained-tokens"

- id: api-authentication-and-authorization-083
  difficulty: expert
  tags: [mtls, rfc-8705, client-auth-methods]
  question: |
    RFC 8705 defines two mTLS client-authentication methods. How do
    tls_client_auth and self_signed_tls_client_auth differ?
  options:
  - "tls_client_auth uses a CA-issued cert validated against a trusted PKI; self_signed_tls_client_auth pins a registered self-signed cert with no CA"
  - "tls_client_auth is intended only for browser clients while self_signed_tls_client_auth is reserved for backend server calls"
  - "self_signed_tls_client_auth additionally requires a client_secret alongside the certificate, whereas tls_client_auth relies on the cert alone"
  - "They are two interchangeable aliases for exactly the same client-authentication method defined by RFC 8705"
  answer: 0
  explanation: |
    tls_client_auth relies on a certificate issued by a CA the AS trusts, binding
    to a configured subject/DN or SAN. self_signed_tls_client_auth pins an
    out-of-band-registered self-signed certificate (or JWKS) with no CA — useful
    for closed ecosystems.
  ref: "concepts.md#mtls-specifics-rfc-8705-deep-dive"

- id: api-authentication-and-authorization-084
  difficulty: advanced
  tags: [cookie, host-prefix, hardening]
  question: |
    What conditions must be met for a browser to accept a cookie named
    "__Host-session"?
  options:
  - "It must have a Domain attribute set to the apex domain"
  - "It must be Secure, have Path=/, and have no Domain attribute"
  - "It must be marked HttpOnly and additionally carry SameSite=None to be honored"
  - "It must be at least 4096 bytes in size to qualify for the __Host- prefix"
  answer: 1
  explanation: |
    The __Host- prefix is honored only if the cookie is Secure, has Path=/, and has
    no Domain attribute, pinning it to the exact host and preventing subdomain
    injection/overwrite. It is a strong hardening measure for session cookies.
  ref: "concepts.md#cookie-hardening-and-csrf-defenses"

- id: api-authentication-and-authorization-085
  difficulty: advanced
  tags: [csrf, samesite, defenses]
  question: |
    An interviewer notes "SameSite=Lax isn't a complete CSRF defense." Which
    additional defense is a valid choice?
  options:
  - "Storing the session token in localStorage instead of a cookie so it is never auto-sent cross-site"
  - "A synchronizer token, a double-submit cookie, or an Origin/Sec-Fetch-Site check"
  - "Disabling TLS during development to simplify request inspection and debugging"
  - "Serving the entire API strictly over HTTP/2 so multiplexed streams block forged requests"
  answer: 1
  explanation: |
    SameSite=Lax still sends cookies on top-level GET navigations and defaults vary
    by client. Layer a synchronizer token (stateful, strongest), a double-submit
    cookie (stateless), or origin verification via Origin/Referer/Sec-Fetch-Site
    fetch-metadata headers.
  ref: "concepts.md#cookie-hardening-and-csrf-defenses"

- id: api-authentication-and-authorization-086
  difficulty: expert
  tags: [authz-models, rebac, abac, rbac, scenario]
  question: |
    A token has scope write:orders, but the user is trying to edit an order that
    belongs to a different customer. Where does the check that stops this belong?
  options:
  - "In the OAuth scope layer, by adding a narrower scope such as write:own-orders that encodes ownership at issuance"
  - "In the application authorization layer (RBAC/ABAC/ReBAC) evaluating ownership; the scope alone cannot express per-object rules"
  - "In the TLS handshake, where the client certificate identifies the customer and blocks cross-account edits"
  - "In the JWT signature verification step, since a valid signature confirms the caller may edit any order"
  answer: 1
  explanation: |
    Scopes bound the class of operation (write orders), not per-object ownership.
    The object-level BOLA check lives in the application authorization layer —
    RBAC/ABAC/ReBAC evaluating whether this subject may modify that specific
    order. The token by itself can't decide it.
  ref: "concepts.md#authorization-models-rbac-abac-rebac"

- id: api-authentication-and-authorization-087
  difficulty: advanced
  tags: [authz-models, rebac, zanzibar]
  question: |
    Which authorization model derives permissions from relationships in a graph
    (e.g. "user is an editor of a doc in a folder shared with their team"), as
    popularized by Google Zanzibar?
  options:
  - "RBAC (Role-Based Access Control)"
  - "ReBAC (Relationship-Based Access Control)"
  - "OAuth scopes"
  - "HTTP Basic authentication"
  answer: 1
  explanation: |
    ReBAC derives permission from relationships in a graph and is the model behind
    Google Zanzibar (OpenFGA, SpiceDB). RBAC attaches permissions to roles; ABAC
    evaluates attributes; scopes bound token capability.
  ref: "concepts.md#authorization-models-rbac-abac-rebac"

- id: api-authentication-and-authorization-088
  difficulty: intermediate
  tags: [basic-auth, rfc-7617]
  question: |
    What does an HTTP Basic (RFC 7617) Authorization header actually carry, and
    what protects it?
  options:
  - "An AES-encrypted username:password pair; that encryption is what protects it"
  - "base64(username:password), which is only encoding — so it must run over TLS"
  - "A signed JWT that is cryptographically bound to the client's TLS certificate"
  - "A one-time numeric code that automatically expires 60 seconds after the header is generated"
  answer: 1
  explanation: |
    Basic auth sends "Authorization: Basic " + base64(username:password). Base64 is
    encoding, not encryption, so the credentials are trivially reversible; Basic
    auth is only safe over TLS. It also has no logout and no built-in expiry.
  ref: "concepts.md#http-basic-authentication"

- id: api-authentication-and-authorization-089
  difficulty: advanced
  tags: [native-apps, rfc-8252, webview]
  question: |
    Per RFC 8252 (OAuth for Native Apps), why must a mobile app use the system
    browser rather than an embedded WebView for the authorization request?
  options:
  - "WebViews are technically unable to render HTTPS pages, so the authorization request would fail to load"
  - "An embedded WebView lets the host app read the user's credentials and defeats SSO/consent isolation"
  - "The system browser is required because only it can securely store the native app's client_secret"
  - "Embedded WebViews do not support the redirect_uri parameter, so the code could never return to the app"
  answer: 1
  explanation: |
    RFC 8252 requires the system browser (Custom Tabs / SFAuthenticationSession)
    because an embedded WebView is controlled by the host app, which can observe or
    inject credentials and breaks single-sign-on and consent isolation. PKCE is
    also mandatory since native apps are public clients.
  ref: "concepts.md#oauth-for-native-and-mobile-apps"

- id: api-authentication-and-authorization-090
  difficulty: expert
  tags: [bff, spa, token-storage, scenario]
  question: |
    Where should a browser-based SPA keep its OAuth access token according to
    current (2023+) guidance?
  options:
  - "In localStorage for convenience, so the token survives reloads and is shared across all open tabs"
  - "In a non-HttpOnly cookie so client-side JavaScript can read it and attach it to each API call"
  - "Ideally nowhere in the browser: use a BFF that holds tokens server-side and issues the SPA an HttpOnly __Host- session cookie"
  - "In the URL fragment after each redirect, where the SPA reads it out and keeps it only in memory"
  answer: 2
  explanation: |
    Any token in the browser is XSS-exfiltratable (localStorage especially). The
    Backend-for-Frontend pattern keeps tokens server-side, gives the SPA an
    HttpOnly/Secure/__Host- session cookie, and proxies API calls. If a token must
    live in the browser, keep it in-memory, short-TTL, and DPoP-bound.
  ref: "concepts.md#bff-backend-for-frontend-for-browser-apps"

- id: api-authentication-and-authorization-091
  difficulty: expert
  tags: [sigv4, signing-key, blast-radius]
  question: |
    In AWS SigV4, the signature uses a derived signing key computed as an HMAC
    chain kDate -> kRegion -> kService -> kSigning. Why derive the key this way
    instead of signing with the raw secret?
  options:
  - "To compress the signature down so it fits within the fixed 64-byte size limit of the Authorization header"
  - "To scope the key to a specific date/region/service, limiting the blast radius if a derived key leaks"
  - "Because the HMAC-SHA256 primitive cannot accept a raw secret access key directly as its keying input"
  - "To make the derived signature reversible so operators can decode and inspect its contents while debugging"
  answer: 1
  explanation: |
    Chaining the secret through date, region, and service produces a key valid only
    for that day/region/service. A leaked derived signing key therefore works only
    in that narrow scope, not across the whole account — a deliberate blast-radius
    limit.
  ref: "concepts.md#sigv4-signing-internals-deep-dive"

- id: api-authentication-and-authorization-092
  difficulty: advanced
  tags: [sigv4, canonical-request, signed-headers]
  question: |
    In SigV4, what is the role of the SignedHeaders list in the Authorization
    header?
  options:
  - "It lists which request headers are covered by the signature, so the server knows exactly what to reconstruct and verify"
  - "It encrypts the listed headers in place so their values travel as ciphertext that only the server's secret key can decode"
  - "It instructs the server which response headers to strip out before returning the reply so intermediaries cannot cache them"
  - "It carries the secret access key itself in SHA-256-hashed form so the server can look up the matching credential record"
  answer: 0
  explanation: |
    SignedHeaders names exactly which headers were included when building the
    canonical request. The server uses that list to reconstruct the same canonical
    request and recompute the signature; headers not listed are not protected.
  ref: "concepts.md#sigv4-signing-internals-deep-dive"

- id: api-authentication-and-authorization-093
  difficulty: expert
  tags: [par, rar, step-up, fapi]
  question: |
    A financial-grade API must (a) prevent authorization parameters from being
    tampered with in the browser and (b) authorize a specific transaction like
    "transfer <= EUR 500 from account X". Which extensions fit?
  options:
  - "PAR (RFC 9126) for pushed parameters and RAR (RFC 9396) for structured authorization_details"
  - "The implicit grant paired with a single wildcard scope that grants blanket access to every transaction endpoint"
  - "HTTP Basic authentication carried over TLS using a long, high-entropy password rotated on every transfer request"
  - "The resource owner password credentials grant combined with a long-lived static API key embedded in the client"
  answer: 0
  explanation: |
    PAR (RFC 9126) has the client push authorization parameters over a back channel
    and reference them by request_uri, preventing front-channel tampering. RAR
    (RFC 9396) replaces coarse scopes with a structured authorization_details array
    for fine-grained, per-transaction authorization.
  ref: "concepts.md#advanced-hardening-extensions-fapi-grade"

- id: api-authentication-and-authorization-094
  difficulty: advanced
  tags: [step-up, rfc-9470, acr]
  question: |
    A resource server wants to require stronger authentication before a sensitive
    operation. Per RFC 9470 step-up, how does it signal this?
  options:
  - "Return 500 Internal Server Error with an empty body so the client infers on its own that stronger authentication is needed"
  - "Return an insufficient_user_authentication error specifying required acr/max_age; the token's acr/amr report how the user authenticated"
  - "Silently drop the request without any response so the client times out and falls back to a full re-authentication flow"
  - "Return a 301 Moved Permanently redirect pointing the caller at the interactive login page to force a fresh sign-in"
  answer: 1
  explanation: |
    RFC 9470 lets the RS challenge with an insufficient_user_authentication error
    naming the required acr (auth context class) and/or max_age. The client then
    re-authenticates more strongly; the token's acr/amr claims report the achieved
    authentication context and methods.
  ref: "concepts.md#advanced-hardening-extensions-fapi-grade"

- id: api-authentication-and-authorization-095
  difficulty: expert
  tags: [split-token, gateway, revocation, comparison]
  question: |
    How does the Split Token pattern differ from a straightforward introspection
    call on every request?
  options:
  - "It forwards the client_secret to the resource server on every call so the backend can re-authenticate the client itself"
  - "It splits the token so the client carries an opaque reference while the signature/claims half is reconstructed at the gateway, avoiding a full introspection round-trip per request"
  - "It stores the entire self-contained JWT in browser localStorage so any tab can read it and validate offline without a gateway"
  - "It mandates mutual TLS on every internal service hop so the certificate handshake replaces token validation altogether"
  answer: 1
  explanation: |
    The Split Token pattern divides the token: the client holds an opaque reference
    (revocation control outside) while the gateway reconstructs the signed
    half for stateless internal validation — combining revocability with stateless
    checks without introspecting on every single request.
  ref: "concepts.md#token-introspection-phantom-and-split-tokens"
