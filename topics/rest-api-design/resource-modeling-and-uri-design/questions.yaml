topic: "Resource Modeling & URI Design"
domain: rest-api-design
topic_slug: resource-modeling-and-uri-design
version: 1
questions:
  - id: resource-modeling-and-uri-design-001
    difficulty: beginner
    tags: [uri, anatomy, rfc-3986]
    question: |
      Which RFC defines the generic syntax of a URI (scheme, authority, path,
      query, fragment)?
    options:
      - "RFC 3986"
      - "RFC 9110"
      - "RFC 8288"
      - "RFC 7519"
    answer: 0
    explanation: |
      RFC 3986 defines the generic URI syntax. RFC 9110 is HTTP Semantics,
      RFC 8288 is Web Linking, and RFC 7519 is JWT.
    ref: "concepts.md#anatomy-of-a-uri"

  - id: resource-modeling-and-uri-design-002
    difficulty: intermediate
    tags: [uri, fragment, anatomy]
    question: |
      In the URI `https://api.example.com/reports/9#summary`, what happens to
      the `#summary` fragment when a client makes the request?
    options:
      - "It is processed only by the client and is not sent to the server."
      - "It is sent to the server as part of the request target."
      - "It is converted into a query parameter automatically."
      - "It is sent in the Host header."
    answer: 0
    explanation: |
      The fragment is client-side only; it is stripped before the request is
      sent. Anything the server must act on belongs in the path or query.
    ref: "concepts.md#anatomy-of-a-uri"

  - id: resource-modeling-and-uri-design-003
    difficulty: beginner
    tags: [uri, path, query]
    question: |
      In `/v1/orders/42?status=open`, which part is the query component?
    options:
      - "/v1"
      - "/orders/42"
      - "status=open"
      - "v1/orders"
    answer: 2
    explanation: |
      The query component follows the `?` — here `status=open`. `/v1/orders/42`
      is the path. Path expresses identity/hierarchy; query refines.
    ref: "concepts.md#anatomy-of-a-uri"

  - id: resource-modeling-and-uri-design-004
    difficulty: beginner
    tags: [nouns, verbs, rpc]
    question: |
      Which URI best follows the REST principle of "resources as nouns, actions
      as HTTP methods"?
    options:
      - "POST /createUser"
      - "GET /getUser?id=42"
      - "POST /users"
      - "POST /deleteUser/42"
    answer: 2
    explanation: |
      `POST /users` names a noun (the users collection) and lets the HTTP method
      express the action (create). The others embed verbs in the path, which is
      RPC-over-HTTP, not REST.
    ref: "concepts.md#resources-as-nouns-not-verbs"

  - id: resource-modeling-and-uri-design-005
    difficulty: intermediate
    tags: [nouns, verbs, http-semantics]
    question: |
      Why is `POST /getOrder?id=42` considered a poor design compared to
      `GET /orders/42`?
    options:
      - "POST is slower than GET at the network level."
      - "Query parameters cannot carry an id."
      - "POST /getOrder is neither safe nor cacheable, discarding GET's HTTP semantics."
      - "POST cannot return a response body."
    answer: 2
    explanation: |
      A read modeled as POST loses GET's safe and cacheable semantics that
      intermediaries rely on. Using the method that matches the intent (GET for
      a read) preserves those guarantees.
    ref: "concepts.md#resources-as-nouns-not-verbs"

  - id: resource-modeling-and-uri-design-006
    difficulty: beginner
    tags: [collection, item, create]
    question: |
      A client sends `POST /orders` and the server creates a new order. What is
      the conventional successful response?
    options:
      - "200 OK with no headers"
      - "204 No Content"
      - "201 Created with a Location header pointing to the new order"
      - "302 Found with the order in the body"
    answer: 2
    explanation: |
      Creating a member of a collection returns 201 Created with a
      `Location: /orders/{id}` header identifying the newly created resource.
    ref: "concepts.md#collection-vs-singleton-resources"

  - id: resource-modeling-and-uri-design-007
    difficulty: intermediate
    tags: [collection, singleton]
    question: |
      Which URI is best modeled as a singleton resource (no id segment)?
    options:
      - "A user's single profile: /users/42/profile"
      - "The set of all orders in the system"
      - "One product among many: /products/99"
      - "A list of a user's addresses"
    answer: 0
    explanation: |
      A profile of which there is exactly one per user is a singleton — it has
      no collection to POST into and no id segment. The others are collections
      or members of collections.
    ref: "concepts.md#collection-vs-singleton-resources"

  - id: resource-modeling-and-uri-design-008
    difficulty: intermediate
    tags: [collection, status-codes, empty]
    question: |
      A `GET /orders?status=archived` matches zero orders. What is the correct
      response?
    options:
      - "404 Not Found, since nothing matched"
      - "204 No Content with no body"
      - "200 OK with an empty array []"
      - "400 Bad Request"
    answer: 2
    explanation: |
      The collection resource exists; it simply has no matching members. Return
      200 with an empty array. 404 is for a missing resource (e.g. a member id
      that doesn't exist), not an empty result set.
    ref: "concepts.md#collection-vs-singleton-resources"

  - id: resource-modeling-and-uri-design-009
    difficulty: advanced
    tags: [collection, put, post, idempotency]
    question: |
      Why is `POST /orders` not idempotent while `PUT /orders/42` is?
    options:
      - "POST always fails on retry, so it can't be idempotent."
      - "PUT is never allowed to create resources, so retries do nothing."
      - "POST creates a new member each call (server-assigned id); PUT targets a fixed URI and replaces its state."
      - "POST and PUT are equally idempotent; the premise is false."
    answer: 2
    explanation: |
      POST to a collection creates a new member each time (a new server-assigned
      id per call). PUT addresses a specific URI and replaces its representation,
      so repeating it yields the same end state — idempotent.
    ref: "concepts.md#collection-vs-singleton-resources"

  - id: resource-modeling-and-uri-design-010
    difficulty: beginner
    tags: [sub-resources, nesting]
    question: |
      Which URI best expresses "the orders that belong to user 42"?
    options:
      - "/orders/user/42"
      - "/getOrdersByUser/42"
      - "/user-orders?42"
      - "/users/42/orders"
    answer: 3
    explanation: |
      Nesting the child collection under its parent — `/users/42/orders` —
      communicates the containment relationship directly and reads naturally.
    ref: "concepts.md#sub-resources-and-relationships"

  - id: resource-modeling-and-uri-design-011
    difficulty: intermediate
    tags: [sub-resources, nesting-depth]
    question: |
      A team proposes `/users/42/orders/1001/items/7/refunds/3`. What is the
      most common guidance about this design?
    options:
      - "It is ideal because it fully documents the hierarchy."
      - "Nesting should always be at least four levels deep for clarity."
      - "Deep nesting is brittle; prefer at most one level and expose deep resources top-level (e.g. /refunds/3)."
      - "Query parameters must never be combined with nested paths."
    answer: 2
    explanation: |
      Deeply nested URIs bake the whole hierarchy into the address and break when
      the model changes. Nest at most one level for scope; give deep resources a
      flat canonical URI once they have a stable id.
    ref: "concepts.md#sub-resources-and-relationships"

  - id: resource-modeling-and-uri-design-012
    difficulty: advanced
    tags: [sub-resources, aliasing, canonical]
    question: |
      An order is reachable at both `/orders/1001` and `/users/42/orders/1001`.
      What problem does this aliasing most directly cause?
    options:
      - "It doubles server CPU usage per request."
      - "Caches and clients can disagree about the resource's identity, complicating cache invalidation and self links."
      - "It violates RFC 3986's ban on integer ids."
      - "It makes the resource impossible to delete."
    answer: 1
    explanation: |
      Two URIs for one resource create aliasing: cache keys diverge and clients
      may treat them as different things. Pick one canonical URI for cache keys,
      Location headers, self links, and ETags.
    ref: "concepts.md#sub-resources-and-relationships"

  - id: resource-modeling-and-uri-design-013
    difficulty: intermediate
    tags: [relationships, association, put]
    question: |
      To grant user 42 the "admin" role as an idempotent association, which
      design fits best?
    options:
      - "POST /grantRole?user=42&role=admin"
      - "GET /users/42/addAdmin"
      - "POST /admin/users/42/grant"
      - "PUT /users/42/roles/admin"
    answer: 3
    explanation: |
      Modeling the association as a resource and using PUT makes granting
      idempotent: repeating it leaves the same association. DELETE on the same
      URI revokes it.
    ref: "concepts.md#sub-resources-and-relationships"

  - id: resource-modeling-and-uri-design-014
    difficulty: beginner
    tags: [path-vs-query, identity]
    question: |
      Which is the appropriate use of a PATH parameter (not a query parameter)?
    options:
      - "Identifying a single product: /products/99"
      - "Sorting a list: /orders?sort=createdAt"
      - "Selecting a page: /orders?page=2"
      - "Choosing returned fields: /users/42?fields=id,name"
    answer: 0
    explanation: |
      A path parameter identifies a specific resource — `/products/99`. Sorting,
      paging, and field selection refine an already-identified resource and
      belong in the query string.
    ref: "concepts.md#path-vs-query-parameters"

  - id: resource-modeling-and-uri-design-015
    difficulty: intermediate
    tags: [path-vs-query, filtering]
    question: |
      You need to filter a collection of orders by status and paginate the
      result. Which URI is most idiomatic?
    options:
      - "/orders?status=open&page=2"
      - "/orders/status/open/page/2"
      - "/getOrders?status=open;page=2 via POST"
      - "/orders/open-orders/2"
    answer: 0
    explanation: |
      Filtering and pagination refine a collection and are optional/combinable —
      classic query-parameter use: `/orders?status=open&page=2`. Encoding filters
      as path segments conflates refinement with identity.
    ref: "concepts.md#path-vs-query-parameters"

  - id: resource-modeling-and-uri-design-016
    difficulty: advanced
    tags: [path-vs-query, caching]
    question: |
      Regarding HTTP caching, which statement about query strings is correct?
    options:
      - "Caches always ignore the query string when computing the cache key."
      - "Query parameters are never cacheable under RFC 9110."
      - "Only path parameters affect the cache key; query parameters affect only logging."
      - "The full URI including the query string forms the cache key, so ?sort=asc and ?sort=desc are distinct entries."
    answer: 3
    explanation: |
      The complete URI (including query) is the cache key. Different query values
      are different cache entries. This is one reason to keep query params
      meaningful and normalized.
    ref: "concepts.md#path-vs-query-parameters"

  - id: resource-modeling-and-uri-design-017
    difficulty: intermediate
    tags: [path-vs-query, security]
    question: |
      Why should an access token or secret NOT be placed in a query parameter?
    options:
      - "Query parameters have a strict 16-character limit."
      - "Query strings appear in access logs, browser history, and Referer headers, leaking the secret."
      - "RFC 3986 forbids letters in query values."
      - "Query parameters are always sent unencrypted even over HTTPS."
    answer: 1
    explanation: |
      Even over HTTPS, full URIs (including query) are commonly logged by servers
      and proxies, stored in history, and forwarded in Referer headers. Secrets
      belong in headers (e.g. Authorization), not the query.
    ref: "concepts.md#path-vs-query-parameters"

  - id: resource-modeling-and-uri-design-018
    difficulty: intermediate
    tags: [path-vs-query, multi-value]
    question: |
      A client wants to pass multiple tag filters. Which statement is accurate?
    options:
      - "RFC 3986 mandates the comma form ?tag=a,b for lists."
      - "The multi-value convention (?tag=a&tag=b vs ?tag=a,b) is not standardized, so the API must document its choice."
      - "Repeated query keys are illegal and rejected by all servers."
      - "Lists can only be sent in the request body, never the query."
    answer: 1
    explanation: |
      RFC 3986 does not define list semantics for query parameters. Both repeated
      keys and delimited values are used in practice, so an API must document and
      consistently apply its chosen convention.
    ref: "concepts.md#path-vs-query-parameters"

  - id: resource-modeling-and-uri-design-019
    difficulty: beginner
    tags: [naming, pluralization]
    question: |
      Following the dominant convention, what is the best URI for the collection
      of customers and one specific customer?
    options:
      - "/customer and /customer/42"
      - "/getCustomers and /customer?id=42"
      - "/customers and /customers/42"
      - "/Customers and /Customers/42"
    answer: 2
    explanation: |
      Plural nouns for collections with the id appended for a member —
      `/customers` and `/customers/42` — is the most common and predictable
      convention.
    ref: "concepts.md#pluralization-and-naming-conventions"

  - id: resource-modeling-and-uri-design-020
    difficulty: intermediate
    tags: [naming, kebab-case]
    question: |
      For a multi-word resource segment, which naming style is most widely
      recommended for URI paths?
    options:
      - "camelCase: /purchaseOrders"
      - "snake_case: /purchase_orders"
      - "kebab-case: /purchase-orders"
      - "PascalCase: /PurchaseOrders"
    answer: 2
    explanation: |
      Lowercase kebab-case (hyphens) is the common recommendation for path
      segments — readable and not obscured by link underlines the way underscores
      can be.
    ref: "concepts.md#pluralization-and-naming-conventions"

  - id: resource-modeling-and-uri-design-021
    difficulty: intermediate
    tags: [naming, extensions, content-negotiation]
    question: |
      Why do modern API guidelines advise against `/orders/42.json` in favor of
      `/orders/42`?
    options:
      - "JSON cannot be returned from a path ending in a number."
      - "File extensions in URIs are forbidden by RFC 3986."
      - "Content type should be negotiated via the Accept header, not encoded in the URI path."
      - "The .json extension breaks HTTP caching entirely."
    answer: 2
    explanation: |
      The representation format is a content-negotiation concern handled by the
      Accept/Content-Type headers. Baking `.json` into the path couples the URI
      to a format and multiplies URIs per resource.
    ref: "concepts.md#pluralization-and-naming-conventions"

  - id: resource-modeling-and-uri-design-022
    difficulty: intermediate
    tags: [naming, json-properties]
    question: |
      A candidate says "we use kebab-case in paths, so our JSON fields must also
      be kebab-case." What is the correct assessment?
    options:
      - "Correct — path style must exactly match JSON property style."
      - "Path segment naming and JSON property naming are separate decisions governed by different style guides."
      - "JSON fields must always be kebab-case per RFC 8259."
      - "Kebab-case is illegal in URIs, so the whole premise fails."
    answer: 1
    explanation: |
      URI path conventions (kebab-case) and payload property naming
      (camelCase/snake_case) are independent decisions. Conflating them is a
      common mistake.
    ref: "concepts.md#pluralization-and-naming-conventions"

  - id: resource-modeling-and-uri-design-023
    difficulty: beginner
    tags: [hierarchy, flat, canonical]
    question: |
      What is a key advantage of a FLAT canonical URI like `/orders/1001` over a
      deeply hierarchical one?
    options:
      - "It guarantees a 200 response."
      - "It removes the need for authentication."
      - "It automatically enables HTTP/2 push."
      - "It gives the resource one canonical address and is more resilient to relationship changes."
    answer: 3
    explanation: |
      A flat canonical URI provides a single stable address per resource and does
      not break when the parent/child relationship changes, unlike deeply nested
      URIs that encode the hierarchy.
    ref: "concepts.md#hierarchy-vs-flat-design"

  - id: resource-modeling-and-uri-design-024
    difficulty: intermediate
    tags: [hierarchy, hybrid, design]
    question: |
      A common hybrid pattern uses `POST /users/42/orders` to create in context
      but links to `/orders/1001` for the item. What is the rationale?
    options:
      - "It hides the order from the user who created it."
      - "It is required by RFC 8288 for all nested resources."
      - "It prevents clients from ever listing orders."
      - "It combines scoped creation/listing with a single flat canonical URI per item for caching and self links."
    answer: 3
    explanation: |
      The nested collection gives natural scoping for list/create, while the flat
      item URI is the one canonical address used for cache keys, Location
      headers, and self links.
    ref: "concepts.md#hierarchy-vs-flat-design"

  - id: resource-modeling-and-uri-design-025
    difficulty: advanced
    tags: [hierarchy, coupling]
    question: |
      What is the main downside of encoding a full parent chain in a URI like
      `/regions/1/stores/2/aisles/3/products/4`?
    options:
      - "It is too short to be cached."
      - "It couples each child's URI to the entire hierarchy, so any structural change breaks client URIs."
      - "It cannot be expressed as a URI Template."
      - "Integer ids are prohibited at depth greater than two."
    answer: 1
    explanation: |
      Deep hierarchy bakes many structural assumptions into the address. If the
      model changes (e.g. products move between aisles), every client's URI
      breaks. Flatten and connect with links.
    ref: "concepts.md#hierarchy-vs-flat-design"

  - id: resource-modeling-and-uri-design-026
    difficulty: intermediate
    tags: [actions, verbs, exceptions]
    question: |
      Cancelling an order triggers refunds and notifications and isn't a simple
      field edit. Which is the most pragmatic, widely-accepted design?
    options:
      - "GET /orders/42/cancel"
      - "POST /cancelOrder?id=42"
      - "POST /orders/42/cancel"
      - "DELETE /orders/42"
    answer: 2
    explanation: |
      For a complex non-CRUD state transition, a scoped action sub-resource with
      POST — `POST /orders/42/cancel` — is the accepted pragmatic exception.
      GET must be safe (so it's wrong here), and DELETE would imply removal, not
      cancellation.
    ref: "concepts.md#avoiding-verbs-and-pragmatic-action-exceptions"

  - id: resource-modeling-and-uri-design-027
    difficulty: intermediate
    tags: [actions, search, body]
    question: |
      A search has a large, complex filter that exceeds practical URL length
      limits. Which approach is a recognized pragmatic solution?
    options:
      - "Split the query across multiple GET requests and merge client-side."
      - "Base64-encode the entire filter into a single path segment."
      - "Store the filter server-side under a random path and never document it."
      - "Expose a search resource and POST the filter in the request body (e.g. POST /searches)."
    answer: 3
    explanation: |
      When a filter is too large or complex for a query string, modeling a search
      resource and POSTing the criteria in the body is a common, accepted
      pattern.
    ref: "concepts.md#avoiding-verbs-and-pragmatic-action-exceptions"

  - id: resource-modeling-and-uri-design-028
    difficulty: advanced
    tags: [actions, method-choice, idempotency]
    question: |
      Which HTTP method is most appropriate for a non-idempotent action
      sub-resource such as `/carts/7/checkout`?
    options:
      - "GET"
      - "PUT"
      - "POST"
      - "HEAD"
    answer: 2
    explanation: |
      Actions typically have side effects and are non-idempotent, so POST is the
      right method. GET/HEAD must be safe; PUT implies idempotent replacement.
    ref: "concepts.md#avoiding-verbs-and-pragmatic-action-exceptions"

  - id: resource-modeling-and-uri-design-029
    difficulty: advanced
    tags: [actions, google-aip, custom-methods]
    question: |
      Google's API Improvement Proposals suggest a colon style for custom
      methods. Which URI follows that convention?
    options:
      - "/users/42/reset-password"
      - "/users/42:resetPassword"
      - "/resetPassword/users/42"
      - "/users/42?action=resetPassword"
    answer: 1
    explanation: |
      Google AIP custom methods use the `resource:verb` form —
      `/users/42:resetPassword`. It's an alternative to the nested-segment action
      style; both are recognized action conventions.
    ref: "concepts.md#avoiding-verbs-and-pragmatic-action-exceptions"

  - id: resource-modeling-and-uri-design-030
    difficulty: intermediate
    tags: [actions, restfulness]
    question: |
      An interviewer asks whether `POST /orders/42/cancel` is "un-RESTful." What
      is the strongest answer?
    options:
      - "Yes, and it must be replaced with GET to be valid."
      - "It is fully RESTful and actions should be used for every operation."
      - "Pure REST prefers state changes via representation updates, but scoped action sub-resources are an accepted pragmatic exception when kept rare and used with POST."
      - "REST has no opinion on URIs, so any form is equivalent."
    answer: 2
    explanation: |
      The nuanced answer acknowledges REST's preference for state transitions via
      representation while accepting scoped action sub-resources as a deliberate,
      sparing exception for non-CRUD operations.
    ref: "concepts.md#avoiding-verbs-and-pragmatic-action-exceptions"

  - id: resource-modeling-and-uri-design-031
    difficulty: beginner
    tags: [identifiers, opaque, uuid]
    question: |
      What does it mean to treat a resource id as "opaque"?
    options:
      - "The id must be encrypted in transit."
      - "The id is hidden from the client entirely."
      - "The id must always be a UUID."
      - "Clients treat it as a meaningless token and do not parse or derive meaning from its structure."
    answer: 3
    explanation: |
      An opaque id is one the client uses as-is without parsing internal
      structure. This avoids hidden coupling to the id's format and keeps the
      server free to change it.
    ref: "concepts.md#identifiers-opaque-ids-vs-slugs"

  - id: resource-modeling-and-uri-design-032
    difficulty: intermediate
    tags: [identifiers, enumeration, security]
    question: |
      What is a security concern with sequential integer ids like `/orders/1002`?
    options:
      - "They cannot be indexed by databases."
      - "They are easily enumerable/guessable, enabling scraping and, with weak authz, object-level access abuse."
      - "They violate RFC 3986 which requires string ids."
      - "They break JSON serialization."
    answer: 1
    explanation: |
      Sequential ids are guessable and leak volume information, and combined with
      missing per-object authorization checks they enable enumeration attacks.
      This maps to OWASP API1:2023 (BOLA).
    ref: "concepts.md#identifiers-opaque-ids-vs-slugs"

  - id: resource-modeling-and-uri-design-033
    difficulty: advanced
    tags: [identifiers, bola, owasp, authorization]
    question: |
      A team switches from integer ids to UUIDs and says the API is "now secure
      against unauthorized access." What is the correct critique?
    options:
      - "Correct — unguessable ids are a sufficient authorization control."
      - "UUIDs actually weaken security compared to integers."
      - "UUIDs are obfuscation, not authorization; per OWASP API1:2023 (BOLA) each request still needs an explicit per-object access check."
      - "The API only needs authentication, not authorization, once UUIDs are used."
    answer: 2
    explanation: |
      Unguessable ids reduce casual enumeration but are not an access control.
      BOLA (OWASP API1:2023) requires verifying on every request that the caller
      is allowed to access that specific object.
    ref: "concepts.md#identifiers-opaque-ids-vs-slugs"

  - id: resource-modeling-and-uri-design-034
    difficulty: intermediate
    tags: [identifiers, slugs, mutability]
    question: |
      What is the main problem with using a slug derived from a mutable article
      title as the canonical id (e.g. /articles/my-first-post)?
    options:
      - "Slugs cannot contain hyphens."
      - "Slugs are not allowed by search engines."
      - "Editing the title changes the slug and therefore the URI, breaking existing links."
      - "Slugs make the resource impossible to cache."
    answer: 2
    explanation: |
      A slug tied to a mutable title changes when the title changes, breaking
      bookmarks and inbound links. Common fixes: use an immutable id as the
      canonical key with the slug decorative, or freeze/redirect old slugs.
    ref: "concepts.md#identifiers-opaque-ids-vs-slugs"

  - id: resource-modeling-and-uri-design-035
    difficulty: advanced
    tags: [identifiers, slugs, canonical]
    question: |
      A blog wants SEO-friendly URLs but stable links. Which design best balances
      both?
    options:
      - "Use only the slug: /articles/how-to-design-uris and rename it on every edit."
      - "Use an immutable id with a decorative slug: /articles/12345/how-to-design-uris, keying on the id."
      - "Use a random UUID with no slug and forbid link sharing."
      - "Encode the full title into a query parameter."
    answer: 1
    explanation: |
      Keying on the immutable id (12345) keeps links stable even if the title
      changes, while the slug remains for readability/SEO and can be ignored or
      redirected when it drifts.
    ref: "concepts.md#identifiers-opaque-ids-vs-slugs"

  - id: resource-modeling-and-uri-design-036
    difficulty: intermediate
    tags: [identifiers, client-generated]
    question: |
      Which id type can be safely generated by the client before the resource
      exists (enabling idempotent PUT-based creation)?
    options:
      - "Server auto-increment integer"
      - "UUID"
      - "Database row number"
      - "Sequential order number assigned at insert"
    answer: 1
    explanation: |
      UUIDs can be generated client-side without coordinating with the server,
      which enables client-chosen ids and idempotent create-or-replace via PUT to
      a known URI. Auto-increment/sequence ids require the server.
    ref: "concepts.md#identifiers-opaque-ids-vs-slugs"

  - id: resource-modeling-and-uri-design-037
    difficulty: beginner
    tags: [trailing-slash, rfc-3986]
    question: |
      Per RFC 3986, how do `/orders` and `/orders/` relate?
    options:
      - "They are always the same URI."
      - "The trailing slash is illegal in URIs."
      - "They are technically different URIs."
      - "Only /orders/ is valid for a collection."
    answer: 2
    explanation: |
      RFC 3986 treats them as different URIs. APIs should standardize on one form
      (commonly no trailing slash for resources) and redirect or reject the other.
    ref: "concepts.md#trailing-slashes-and-case-sensitivity"

  - id: resource-modeling-and-uri-design-038
    difficulty: intermediate
    tags: [case-sensitivity, rfc-3986]
    question: |
      According to RFC 3986, which URI component is case-SENSITIVE by default?
    options:
      - "The scheme (https)"
      - "The host (API.Example.com)"
      - "The path (/Orders/42)"
      - "None of the components carry case significance"
    answer: 2
    explanation: |
      Scheme and host are case-insensitive and normalized to lowercase, but the
      path is case-sensitive, so `/Orders/42` and `/orders/42` may differ.
      Convention is all-lowercase paths to avoid ambiguity.
    ref: "concepts.md#trailing-slashes-and-case-sensitivity"

  - id: resource-modeling-and-uri-design-039
    difficulty: advanced
    tags: [trailing-slash, relative-references, hateoas]
    question: |
      Resolving the relative reference `items` against the base `/orders/42`
      (no trailing slash) yields which absolute path per RFC 3986?
    options:
      - "/orders/42/items"
      - "/orders/items"
      - "/items"
      - "/orders/42items"
    answer: 1
    explanation: |
      Without a trailing slash, the last segment (42) is replaced during relative
      resolution, giving `/orders/items`. With `/orders/42/` the result would be
      `/orders/42/items`. This is why trailing-slash discipline matters for
      hypermedia clients.
    ref: "concepts.md#trailing-slashes-and-case-sensitivity"

  - id: resource-modeling-and-uri-design-040
    difficulty: intermediate
    tags: [trailing-slash, canonicalization]
    question: |
      Which is a recommended way to handle the non-canonical trailing-slash form
      of a resource URI?
    options:
      - "Silently serve both as identical without any redirect."
      - "Issue a redirect (e.g. 301) from the non-canonical form to the canonical one, or reject it with 404."
      - "Return 500 to discourage its use."
      - "Randomly pick a form per request."
    answer: 1
    explanation: |
      Pick one canonical form and enforce it — commonly a 301 redirect from the
      other form (client-friendly) or a 404. Serving both as if identical invites
      duplicate cache entries.
    ref: "concepts.md#trailing-slashes-and-case-sensitivity"

  - id: resource-modeling-and-uri-design-041
    difficulty: beginner
    tags: [stability, cool-uris, w3c]
    question: |
      What is the core message of the W3C note "Cool URIs don't change"?
    options:
      - "URIs should be updated frequently to stay modern."
      - "URIs must always include a version number."
      - "URIs should be as short as possible above all else."
      - "A URI is a long-lived contract; the only reason it changes is that you decided to break it, and that's usually avoidable."
    answer: 3
    explanation: |
      Tim Berners-Lee's note argues URIs are durable identifiers that should keep
      working; with good design (no volatile details, redirects when needed) you
      rarely need to change them.
    ref: "concepts.md#uri-stability--cool-uris"

  - id: resource-modeling-and-uri-design-042
    difficulty: intermediate
    tags: [stability, volatile-details]
    question: |
      Which of these embedded in a URI path is most likely to harm long-term URI
      stability?
    options:
      - "An opaque immutable resource id"
      - "A lowercase plural collection name"
      - "The implementation technology, e.g. /app/servlet/getOrder.do"
      - "A single level of resource nesting"
    answer: 2
    explanation: |
      Encoding technology, server names, or org structure into the path ties the
      URI to volatile implementation details; when the tech changes, the URI
      breaks. Opaque ids and clean nouns are stable.
    ref: "concepts.md#uri-stability--cool-uris"

  - id: resource-modeling-and-uri-design-043
    difficulty: advanced
    tags: [stability, redirects, methods, rfc-9110]
    question: |
      You must move a resource that clients access via POST, and you need the
      method and body preserved on redirect. Which status code is appropriate?
    options:
      - "301 Moved Permanently"
      - "302 Found"
      - "308 Permanent Redirect"
      - "303 See Other"
    answer: 2
    explanation: |
      Per RFC 9110, 308 (and 307 for temporary) preserve the original method and
      body. 301/302 historically caused many clients to switch to GET, which
      would lose a POST body.
    ref: "concepts.md#uri-stability--cool-uris"

  - id: resource-modeling-and-uri-design-044
    difficulty: intermediate
    tags: [stability, additive-change, evolution]
    question: |
      Which practice best preserves URI stability while still evolving an API?
    options:
      - "Rename collections whenever the domain vocabulary is refined."
      - "Encode the current sprint number in each path."
      - "Change ids to reflect the latest schema version."
      - "Make additive changes (new fields/resources) without removing or repurposing existing URIs."
    answer: 3
    explanation: |
      Additive change lets tolerant-reader clients keep working: add new
      resources/fields without breaking existing URIs or semantics. Renaming and
      repurposing break clients silently.
    ref: "concepts.md#uri-stability--cool-uris"

  - id: resource-modeling-and-uri-design-045
    difficulty: intermediate
    tags: [collection, delete, safety]
    question: |
      An interviewer notes that `DELETE /orders` (on the collection) is rarely
      exposed. Why?
    options:
      - "DELETE is not a valid HTTP method for collections per RFC 9110."
      - "It would delete every member of the collection, which is dangerous and usually undesirable."
      - "Collections cannot be modified by any method."
      - "DELETE on a collection always returns 201."
    answer: 1
    explanation: |
      DELETE on a collection URI logically removes all members — almost always
      too dangerous to expose. DELETE is normally applied to specific member
      URIs like /orders/42.
    ref: "concepts.md#collection-vs-singleton-resources"

  - id: resource-modeling-and-uri-design-046
    difficulty: advanced
    tags: [uri-templates, rfc-6570]
    question: |
      Notation like `/users/{id}/orders/{orderId}` for describing a class of URIs
      is standardized by which RFC?
    options:
      - "RFC 6570 (URI Template)"
      - "RFC 8288 (Web Linking)"
      - "RFC 9457 (Problem Details)"
      - "RFC 7519 (JWT)"
    answer: 0
    explanation: |
      RFC 6570 defines URI Templates, the `{var}` expansion syntax widely used in
      docs, OpenAPI-style path items, and hypermedia link templates.
    ref: "concepts.md#anatomy-of-a-uri"

  - id: resource-modeling-and-uri-design-047
    difficulty: intermediate
    tags: [scenario, design-review, nouns]
    question: |
      Reviewing an API you see: `POST /api/getUserOrders`, `POST /api/order.json?do=cancel`,
      and `GET /Api/Orders/`. Which single change best improves REST alignment?
    options:
      - "Keep the verbs but switch everything to GET."
      - "Add .json extensions to every endpoint for clarity."
      - "Move all ids into the request body to shorten URIs."
      - "Model nouns with methods and consistent lowercase paths: GET /orders?user=42, POST /orders/42/cancel, GET /orders."
    answer: 3
    explanation: |
      The fixes span multiple subtopics: replace verbs with nouns+methods, drop
      the .json extension in favor of Accept negotiation, use lowercase paths,
      and a scoped POST action for cancel. That's the coherent REST-aligned
      redesign.
    ref: "concepts.md#resources-as-nouns-not-verbs"

  - id: resource-modeling-and-uri-design-048
    difficulty: beginner
    tags: [singleton, method, config]
    question: |
      For a global singleton resource `/config` (exactly one exists), which
      request replaces its representation?
    options:
      - "POST /config"
      - "PUT /config"
      - "POST /configs"
      - "GET /config"
    answer: 1
    explanation: |
      A singleton has no collection to POST into; you read it with GET and
      replace it with PUT (or PATCH for a partial update). POST /config or a
      /configs collection would be the wrong model.
    ref: "concepts.md#collection-vs-singleton-resources"
