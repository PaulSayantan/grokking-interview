topic: "Resource Modeling & URI Design"
domain: rest-api-design
topic_slug: resource-modeling-and-uri-design
version: 1
questions:
  - id: resource-modeling-and-uri-design-001
    difficulty: beginner
    tags: [uri, anatomy, rfc-3986]
    question: |
      Which RFC defines the generic syntax of a URI (scheme, authority, path,
      query, fragment)?
    options:
      - "RFC 3986"
      - "RFC 9110"
      - "RFC 8288"
      - "RFC 7519"
    answer: 0
    explanation: |
      RFC 3986 defines the generic URI syntax. RFC 9110 is HTTP Semantics,
      RFC 8288 is Web Linking, and RFC 7519 is JWT.
    ref: "concepts.md#anatomy-of-a-uri"

  - id: resource-modeling-and-uri-design-002
    difficulty: intermediate
    tags: [uri, fragment, anatomy]
    question: |
      In the URI `https://api.example.com/reports/9#summary`, what happens to
      the `#summary` fragment when a client makes the request?
    options:
      - "It is processed only by the client and is not sent to the server."
      - "It is sent to the server as part of the request target."
      - "It is converted into a query parameter automatically."
      - "It is appended to the Host header so the origin server can locate the section."
    answer: 0
    explanation: |
      The fragment is client-side only; it is stripped before the request is
      sent. Anything the server must act on belongs in the path or query.
    ref: "concepts.md#anatomy-of-a-uri"

  - id: resource-modeling-and-uri-design-003
    difficulty: beginner
    tags: [uri, path, query]
    question: |
      In `/v1/orders/42?status=open`, which part is the query component?
    options:
      - "/v1"
      - "/orders/42"
      - "status=open"
      - "v1/orders"
    answer: 2
    explanation: |
      The query component follows the `?` — here `status=open`. `/v1/orders/42`
      is the path. Path expresses identity/hierarchy; query refines.
    ref: "concepts.md#anatomy-of-a-uri"

  - id: resource-modeling-and-uri-design-004
    difficulty: beginner
    tags: [nouns, verbs, rpc]
    question: |
      Which URI best follows the REST principle of "resources as nouns, actions
      as HTTP methods"?
    options:
      - "POST /createUser"
      - "GET /getUser?id=42"
      - "POST /users"
      - "POST /deleteUser/42"
    answer: 2
    explanation: |
      `POST /users` names a noun (the users collection) and lets the HTTP method
      express the action (create). The others embed verbs in the path, which is
      RPC-over-HTTP, not REST.
    ref: "concepts.md#resources-as-nouns-not-verbs"

  - id: resource-modeling-and-uri-design-005
    difficulty: intermediate
    tags: [nouns, verbs, http-semantics]
    question: |
      Why is `POST /getOrder?id=42` considered a poor design compared to
      `GET /orders/42`?
    options:
      - "POST is measurably slower than GET at the TCP/network level and cannot reuse connections."
      - "Query parameters are technically forbidden from carrying a resource id such as 42."
      - "POST /getOrder is neither safe nor cacheable, discarding GET's HTTP semantics."
      - "POST responses are defined to omit a body, so /getOrder could never return the order."
    answer: 2
    explanation: |
      A read modeled as POST loses GET's safe and cacheable semantics that
      intermediaries rely on. Using the method that matches the intent (GET for
      a read) preserves those guarantees.
    ref: "concepts.md#resources-as-nouns-not-verbs"

  - id: resource-modeling-and-uri-design-006
    difficulty: beginner
    tags: [collection, item, create]
    question: |
      A client sends `POST /orders` and the server creates a new order. What is
      the conventional successful response?
    options:
      - "200 OK with the new order in the body and no Location header set"
      - "204 No Content, since the create succeeded and the body is now empty"
      - "201 Created with a Location header pointing to the new order"
      - "302 Found redirecting the client back to the /orders collection"
    answer: 2
    explanation: |
      Creating a member of a collection returns 201 Created with a
      `Location: /orders/{id}` header identifying the newly created resource.
    ref: "concepts.md#collection-vs-singleton-resources"

  - id: resource-modeling-and-uri-design-007
    difficulty: intermediate
    tags: [collection, singleton]
    question: |
      Which URI is best modeled as a singleton resource (no id segment)?
    options:
      - "A user's single profile: /users/42/profile"
      - "The set of all orders in the system"
      - "One product among many: /products/99"
      - "A list of a user's addresses"
    answer: 0
    explanation: |
      A profile of which there is exactly one per user is a singleton — it has
      no collection to POST into and no id segment. The others are collections
      or members of collections.
    ref: "concepts.md#collection-vs-singleton-resources"

  - id: resource-modeling-and-uri-design-008
    difficulty: intermediate
    tags: [collection, status-codes, empty]
    question: |
      A `GET /orders?status=archived` matches zero orders. What is the correct
      response?
    options:
      - "404 Not Found, since nothing matched"
      - "204 No Content with no body"
      - "200 OK with an empty array []"
      - "400 Bad Request"
    answer: 2
    explanation: |
      The collection resource exists; it simply has no matching members. Return
      200 with an empty array. 404 is for a missing resource (e.g. a member id
      that doesn't exist), not an empty result set.
    ref: "concepts.md#collection-vs-singleton-resources"

  - id: resource-modeling-and-uri-design-009
    difficulty: advanced
    tags: [collection, put, post, idempotency]
    question: |
      Why is `POST /orders` not idempotent while `PUT /orders/42` is?
    options:
      - "POST always fails on retry with a 409, so by definition it can never be considered idempotent."
      - "PUT is specified to reject any request against a URI that does not yet exist, so its retries do nothing."
      - "POST creates a new member each call (server-assigned id); PUT targets a fixed URI and replaces its state."
      - "POST and PUT are both fully idempotent under RFC 9110, so the premise of the question is simply false."
    answer: 2
    explanation: |
      POST to a collection creates a new member each time (a new server-assigned
      id per call). PUT addresses a specific URI and replaces its representation,
      so repeating it yields the same end state — idempotent.
    ref: "concepts.md#collection-vs-singleton-resources"

  - id: resource-modeling-and-uri-design-010
    difficulty: beginner
    tags: [sub-resources, nesting]
    question: |
      Which URI best expresses "the orders that belong to user 42"?
    options:
      - "/orders/user/42"
      - "/getOrdersByUser/42"
      - "/user-orders?42"
      - "/users/42/orders"
    answer: 3
    explanation: |
      Nesting the child collection under its parent — `/users/42/orders` —
      communicates the containment relationship directly and reads naturally.
    ref: "concepts.md#sub-resources-and-relationships"

  - id: resource-modeling-and-uri-design-011
    difficulty: intermediate
    tags: [sub-resources, nesting-depth]
    question: |
      A team proposes `/users/42/orders/1001/items/7/refunds/3`. What is the
      most common guidance about this design?
    options:
      - "It is ideal because it fully documents the hierarchy and makes every parent id explicit to the client."
      - "Nesting should always be at least four levels deep so the full ownership chain is visible for clarity."
      - "Deep nesting is brittle; prefer at most one level and expose deep resources top-level (e.g. /refunds/3)."
      - "Query parameters must never be combined with nested path segments in the same request target."
    answer: 2
    explanation: |
      Deeply nested URIs bake the whole hierarchy into the address and break when
      the model changes. Nest at most one level for scope; give deep resources a
      flat canonical URI once they have a stable id.
    ref: "concepts.md#sub-resources-and-relationships"

  - id: resource-modeling-and-uri-design-012
    difficulty: advanced
    tags: [sub-resources, aliasing, canonical]
    question: |
      An order is reachable at both `/orders/1001` and `/users/42/orders/1001`.
      What problem does this aliasing most directly cause?
    options:
      - "It roughly doubles server CPU usage per request because both routes are matched and executed."
      - "Caches and clients can disagree about the resource's identity, complicating cache invalidation and self links."
      - "It violates RFC 3986's explicit prohibition on using integer ids inside path segments."
      - "It makes the resource impossible to delete, since a DELETE can only target one of the two URIs."
    answer: 1
    explanation: |
      Two URIs for one resource create aliasing: cache keys diverge and clients
      may treat them as different things. Pick one canonical URI for cache keys,
      Location headers, self links, and ETags.
    ref: "concepts.md#sub-resources-and-relationships"

  - id: resource-modeling-and-uri-design-013
    difficulty: intermediate
    tags: [relationships, association, put]
    question: |
      To grant user 42 the "admin" role as an idempotent association, which
      design fits best?
    options:
      - "POST /grantRole?user=42&role=admin"
      - "GET /users/42/addAdmin"
      - "POST /admin/users/42/grant"
      - "PUT /users/42/roles/admin"
    answer: 3
    explanation: |
      Modeling the association as a resource and using PUT makes granting
      idempotent: repeating it leaves the same association. DELETE on the same
      URI revokes it.
    ref: "concepts.md#sub-resources-and-relationships"

  - id: resource-modeling-and-uri-design-014
    difficulty: beginner
    tags: [path-vs-query, identity]
    question: |
      Which is the appropriate use of a PATH parameter (not a query parameter)?
    options:
      - "Identifying a single product: /products/99"
      - "Sorting a list: /orders?sort=createdAt"
      - "Selecting a page: /orders?page=2"
      - "Choosing returned fields: /users/42?fields=id,name"
    answer: 0
    explanation: |
      A path parameter identifies a specific resource — `/products/99`. Sorting,
      paging, and field selection refine an already-identified resource and
      belong in the query string.
    ref: "concepts.md#path-vs-query-parameters"

  - id: resource-modeling-and-uri-design-015
    difficulty: intermediate
    tags: [path-vs-query, filtering]
    question: |
      You need to filter a collection of orders by status and paginate the
      result. Which URI is most idiomatic?
    options:
      - "/orders?status=open&page=2"
      - "/orders/status/open/page/2"
      - "/getOrders?status=open;page=2 via POST"
      - "/orders/open-orders/2"
    answer: 0
    explanation: |
      Filtering and pagination refine a collection and are optional/combinable —
      classic query-parameter use: `/orders?status=open&page=2`. Encoding filters
      as path segments conflates refinement with identity.
    ref: "concepts.md#path-vs-query-parameters"

  - id: resource-modeling-and-uri-design-016
    difficulty: advanced
    tags: [path-vs-query, caching]
    question: |
      Regarding HTTP caching, which statement about query strings is correct?
    options:
      - "Caches always strip the query string before computing the cache key, so all query values collapse to one entry."
      - "Query parameters are declared non-cacheable under RFC 9110, so any URI carrying a `?` bypasses the cache entirely."
      - "Only path parameters affect the cache key; query parameters affect only logging."
      - "The full URI including the query string forms the cache key, so ?sort=asc and ?sort=desc are distinct entries."
    answer: 3
    explanation: |
      The complete URI (including query) is the cache key. Different query values
      are different cache entries. This is one reason to keep query params
      meaningful and normalized.
    ref: "concepts.md#path-vs-query-parameters"

  - id: resource-modeling-and-uri-design-017
    difficulty: intermediate
    tags: [path-vs-query, security]
    question: |
      Why should an access token or secret NOT be placed in a query parameter?
    options:
      - "Query parameters are capped at a strict 16-character limit that most tokens would exceed."
      - "Query strings appear in access logs, browser history, and Referer headers, leaking the secret."
      - "RFC 3986 forbids alphabetic letters in query values, so a token would be rejected outright."
      - "Query parameters are always transmitted unencrypted, bypassing the TLS layer even over HTTPS."
    answer: 1
    explanation: |
      Even over HTTPS, full URIs (including query) are commonly logged by servers
      and proxies, stored in history, and forwarded in Referer headers. Secrets
      belong in headers (e.g. Authorization), not the query.
    ref: "concepts.md#path-vs-query-parameters"

  - id: resource-modeling-and-uri-design-018
    difficulty: intermediate
    tags: [path-vs-query, multi-value]
    question: |
      A client wants to pass multiple tag filters. Which statement is accurate?
    options:
      - "RFC 3986 explicitly mandates the comma form ?tag=a,b as the only valid encoding for list values."
      - "The multi-value convention (?tag=a&tag=b vs ?tag=a,b) is not standardized, so the API must document its choice."
      - "Repeated query keys are illegal per the URI grammar and are rejected outright by all conforming servers."
      - "Lists can only ever be transmitted in the request body, and never as any form of query-string parameter."
    answer: 1
    explanation: |
      RFC 3986 does not define list semantics for query parameters. Both repeated
      keys and delimited values are used in practice, so an API must document and
      consistently apply its chosen convention.
    ref: "concepts.md#path-vs-query-parameters"

  - id: resource-modeling-and-uri-design-019
    difficulty: beginner
    tags: [naming, pluralization]
    question: |
      Following the dominant convention, what is the best URI for the collection
      of customers and one specific customer?
    options:
      - "/customer and /customer/42"
      - "/getCustomers and /customer?id=42"
      - "/customers and /customers/42"
      - "/Customers and /Customers/42"
    answer: 2
    explanation: |
      Plural nouns for collections with the id appended for a member —
      `/customers` and `/customers/42` — is the most common and predictable
      convention.
    ref: "concepts.md#pluralization-and-naming-conventions"

  - id: resource-modeling-and-uri-design-020
    difficulty: intermediate
    tags: [naming, kebab-case]
    question: |
      For a multi-word resource segment, which naming style is most widely
      recommended for URI paths?
    options:
      - "camelCase: /purchaseOrders"
      - "snake_case: /purchase_orders"
      - "kebab-case: /purchase-orders"
      - "PascalCase: /PurchaseOrders"
    answer: 2
    explanation: |
      Lowercase kebab-case (hyphens) is the common recommendation for path
      segments — readable and not obscured by link underlines the way underscores
      can be.
    ref: "concepts.md#pluralization-and-naming-conventions"

  - id: resource-modeling-and-uri-design-021
    difficulty: intermediate
    tags: [naming, extensions, content-negotiation]
    question: |
      Why do modern API guidelines advise against `/orders/42.json` in favor of
      `/orders/42`?
    options:
      - "JSON cannot be returned when the final path segment ends in a digit such as 42."
      - "File extensions such as .json are explicitly forbidden in URI paths by RFC 3986."
      - "Content type should be negotiated via the Accept header, not encoded in the URI path."
      - "Appending a .json extension disables HTTP caching entirely for that resource."
    answer: 2
    explanation: |
      The representation format is a content-negotiation concern handled by the
      Accept/Content-Type headers. Baking `.json` into the path couples the URI
      to a format and multiplies URIs per resource.
    ref: "concepts.md#pluralization-and-naming-conventions"

  - id: resource-modeling-and-uri-design-022
    difficulty: intermediate
    tags: [naming, json-properties]
    question: |
      A candidate says "we use kebab-case in paths, so our JSON fields must also
      be kebab-case." What is the correct assessment?
    options:
      - "Correct — the path casing style must always be mirrored exactly by the JSON property style."
      - "Path segment naming and JSON property naming are separate decisions governed by different style guides."
      - "JSON field names are mandated to be kebab-case for all payloads by RFC 8259 (the JSON spec)."
      - "Kebab-case with hyphens is illegal inside URI path segments, so the entire premise collapses."
    answer: 1
    explanation: |
      URI path conventions (kebab-case) and payload property naming
      (camelCase/snake_case) are independent decisions. Conflating them is a
      common mistake.
    ref: "concepts.md#pluralization-and-naming-conventions"

  - id: resource-modeling-and-uri-design-023
    difficulty: beginner
    tags: [hierarchy, flat, canonical]
    question: |
      What is a key advantage of a FLAT canonical URI like `/orders/1001` over a
      deeply hierarchical one?
    options:
      - "It guarantees every request to that resource resolves with a 200 OK response."
      - "It removes the need for authentication because flat paths are treated as public."
      - "It automatically enables HTTP/2 server push of the resource to the client."
      - "It gives the resource one canonical address and is more resilient to relationship changes."
    answer: 3
    explanation: |
      A flat canonical URI provides a single stable address per resource and does
      not break when the parent/child relationship changes, unlike deeply nested
      URIs that encode the hierarchy.
    ref: "concepts.md#hierarchy-vs-flat-design"

  - id: resource-modeling-and-uri-design-024
    difficulty: intermediate
    tags: [hierarchy, hybrid, design]
    question: |
      A common hybrid pattern uses `POST /users/42/orders` to create in context
      but links to `/orders/1001` for the item. What is the rationale?
    options:
      - "It deliberately hides the newly created order from the very user who created it."
      - "It is strictly mandated by RFC 8288 (Web Linking) for every nested sub-resource."
      - "It permanently prevents clients from ever listing the orders in that collection."
      - "It combines scoped creation/listing with a single flat canonical URI per item for caching and self links."
    answer: 3
    explanation: |
      The nested collection gives natural scoping for list/create, while the flat
      item URI is the one canonical address used for cache keys, Location
      headers, and self links.
    ref: "concepts.md#hierarchy-vs-flat-design"

  - id: resource-modeling-and-uri-design-025
    difficulty: advanced
    tags: [hierarchy, coupling]
    question: |
      What is the main downside of encoding a full parent chain in a URI like
      `/regions/1/stores/2/aisles/3/products/4`?
    options:
      - "The URI is too short for intermediary caches to store a valid cache key for it."
      - "It couples each child's URI to the entire hierarchy, so any structural change breaks client URIs."
      - "A path this deep cannot be expressed as an RFC 6570 URI Template at all."
      - "RFC 3986 prohibits integer ids in path segments deeper than the second level."
    answer: 1
    explanation: |
      Deep hierarchy bakes many structural assumptions into the address. If the
      model changes (e.g. products move between aisles), every client's URI
      breaks. Flatten and connect with links.
    ref: "concepts.md#hierarchy-vs-flat-design"

  - id: resource-modeling-and-uri-design-026
    difficulty: intermediate
    tags: [actions, verbs, exceptions]
    question: |
      Cancelling an order triggers refunds and notifications and isn't a simple
      field edit. Which is the most pragmatic, widely-accepted design?
    options:
      - "GET /orders/42/cancel"
      - "POST /cancelOrder?id=42"
      - "POST /orders/42/cancel"
      - "DELETE /orders/42"
    answer: 2
    explanation: |
      For a complex non-CRUD state transition, a scoped action sub-resource with
      POST — `POST /orders/42/cancel` — is the accepted pragmatic exception.
      GET must be safe (so it's wrong here), and DELETE would imply removal, not
      cancellation.
    ref: "concepts.md#avoiding-verbs-and-pragmatic-action-exceptions"

  - id: resource-modeling-and-uri-design-027
    difficulty: intermediate
    tags: [actions, search, body]
    question: |
      A search has a large, complex filter that exceeds practical URL length
      limits. Which approach is a recognized pragmatic solution?
    options:
      - "Split the query across multiple GET requests and merge client-side."
      - "Base64-encode the entire filter into a single path segment."
      - "Store the filter server-side under a random path and never document it."
      - "Expose a search resource and POST the filter in the request body (e.g. POST /searches)."
    answer: 3
    explanation: |
      When a filter is too large or complex for a query string, modeling a search
      resource and POSTing the criteria in the body is a common, accepted
      pattern.
    ref: "concepts.md#avoiding-verbs-and-pragmatic-action-exceptions"

  - id: resource-modeling-and-uri-design-028
    difficulty: advanced
    tags: [actions, method-choice, idempotency]
    question: |
      Which HTTP method is most appropriate for a non-idempotent action
      sub-resource such as `/carts/7/checkout`?
    options:
      - "GET"
      - "PUT"
      - "POST"
      - "HEAD"
    answer: 2
    explanation: |
      Actions typically have side effects and are non-idempotent, so POST is the
      right method. GET/HEAD must be safe; PUT implies idempotent replacement.
    ref: "concepts.md#avoiding-verbs-and-pragmatic-action-exceptions"

  - id: resource-modeling-and-uri-design-029
    difficulty: advanced
    tags: [actions, google-aip, custom-methods]
    question: |
      Google's API Improvement Proposals suggest a colon style for custom
      methods. Which URI follows that convention?
    options:
      - "/users/42/reset-password"
      - "/users/42:resetPassword"
      - "/resetPassword/users/42"
      - "/users/42?action=resetPassword"
    answer: 1
    explanation: |
      Google AIP custom methods use the `resource:verb` form —
      `/users/42:resetPassword`. It's an alternative to the nested-segment action
      style; both are recognized action conventions.
    ref: "concepts.md#avoiding-verbs-and-pragmatic-action-exceptions"

  - id: resource-modeling-and-uri-design-030
    difficulty: intermediate
    tags: [actions, restfulness]
    question: |
      An interviewer asks whether `POST /orders/42/cancel` is "un-RESTful." What
      is the strongest answer?
    options:
      - "Yes, it is strictly un-RESTful and the only valid fix is to replace the POST with a safe GET to /orders/42/cancel."
      - "It is fully RESTful, and in fact action sub-resources like this should be used for every create, read, update, and delete operation."
      - "Pure REST prefers state changes via representation updates, but scoped action sub-resources are an accepted pragmatic exception when kept rare and used with POST."
      - "REST places no constraints whatsoever on URI shape, so any of these action forms is exactly equivalent to the others."
    answer: 2
    explanation: |
      The nuanced answer acknowledges REST's preference for state transitions via
      representation while accepting scoped action sub-resources as a deliberate,
      sparing exception for non-CRUD operations.
    ref: "concepts.md#avoiding-verbs-and-pragmatic-action-exceptions"

  - id: resource-modeling-and-uri-design-031
    difficulty: beginner
    tags: [identifiers, opaque, uuid]
    question: |
      What does it mean to treat a resource id as "opaque"?
    options:
      - "The id must be encrypted in transit and only ever decrypted by the origin server."
      - "The id is hidden from the client entirely and never appears anywhere in the URI."
      - "The id must always be formatted as a version-4 UUID rather than any other type."
      - "Clients treat it as a meaningless token and do not parse or derive meaning from its structure."
    answer: 3
    explanation: |
      An opaque id is one the client uses as-is without parsing internal
      structure. This avoids hidden coupling to the id's format and keeps the
      server free to change it.
    ref: "concepts.md#identifiers-opaque-ids-vs-slugs"

  - id: resource-modeling-and-uri-design-032
    difficulty: intermediate
    tags: [identifiers, enumeration, security]
    question: |
      What is a security concern with sequential integer ids like `/orders/1002`?
    options:
      - "They cannot be indexed efficiently by relational databases, forcing slow full-table scans."
      - "They are easily enumerable/guessable, enabling scraping and, with weak authz, object-level access abuse."
      - "They violate RFC 3986, which mandates that all resource ids in a path be opaque strings."
      - "They break JSON serialization because large integers overflow the number type."
    answer: 1
    explanation: |
      Sequential ids are guessable and leak volume information, and combined with
      missing per-object authorization checks they enable enumeration attacks.
      This maps to OWASP API1:2023 (BOLA).
    ref: "concepts.md#identifiers-opaque-ids-vs-slugs"

  - id: resource-modeling-and-uri-design-033
    difficulty: advanced
    tags: [identifiers, bola, owasp, authorization]
    question: |
      A team switches from integer ids to UUIDs and says the API is "now secure
      against unauthorized access." What is the correct critique?
    options:
      - "Correct — an unguessable random id is by itself a sufficient object-level authorization control."
      - "UUIDs actually weaken security compared to sequential integers because they leak the host MAC address."
      - "UUIDs are obfuscation, not authorization; per OWASP API1:2023 (BOLA) each request still needs an explicit per-object access check."
      - "Once UUIDs are used the API only needs to authenticate the caller and can safely skip authorization."
    answer: 2
    explanation: |
      Unguessable ids reduce casual enumeration but are not an access control.
      BOLA (OWASP API1:2023) requires verifying on every request that the caller
      is allowed to access that specific object.
    ref: "concepts.md#identifiers-opaque-ids-vs-slugs"

  - id: resource-modeling-and-uri-design-034
    difficulty: intermediate
    tags: [identifiers, slugs, mutability]
    question: |
      What is the main problem with using a slug derived from a mutable article
      title as the canonical id (e.g. /articles/my-first-post)?
    options:
      - "Slugs are forbidden from containing hyphens, so multi-word titles cannot be represented."
      - "Slugs are ignored and penalized by search engines, hurting the article's discoverability."
      - "Editing the title changes the slug and therefore the URI, breaking existing links."
      - "Slugs make the resource impossible to cache because caches reject non-numeric path segments."
    answer: 2
    explanation: |
      A slug tied to a mutable title changes when the title changes, breaking
      bookmarks and inbound links. Common fixes: use an immutable id as the
      canonical key with the slug decorative, or freeze/redirect old slugs.
    ref: "concepts.md#identifiers-opaque-ids-vs-slugs"

  - id: resource-modeling-and-uri-design-035
    difficulty: advanced
    tags: [identifiers, slugs, canonical]
    question: |
      A blog wants SEO-friendly URLs but stable links. Which design best balances
      both?
    options:
      - "Use only the slug: /articles/how-to-design-uris and regenerate it from the new title on every edit."
      - "Use an immutable id with a decorative slug: /articles/12345/how-to-design-uris, keying on the id."
      - "Use a random UUID with no slug at all and forbid users from sharing or bookmarking any link."
      - "Encode the full article title into a query parameter appended to a fixed collection path."
    answer: 1
    explanation: |
      Keying on the immutable id (12345) keeps links stable even if the title
      changes, while the slug remains for readability/SEO and can be ignored or
      redirected when it drifts.
    ref: "concepts.md#identifiers-opaque-ids-vs-slugs"

  - id: resource-modeling-and-uri-design-036
    difficulty: intermediate
    tags: [identifiers, client-generated]
    question: |
      Which id type can be safely generated by the client before the resource
      exists (enabling idempotent PUT-based creation)?
    options:
      - "Server auto-increment integer"
      - "UUID"
      - "Database row number"
      - "Sequential order number assigned at insert"
    answer: 1
    explanation: |
      UUIDs can be generated client-side without coordinating with the server,
      which enables client-chosen ids and idempotent create-or-replace via PUT to
      a known URI. Auto-increment/sequence ids require the server.
    ref: "concepts.md#identifiers-opaque-ids-vs-slugs"

  - id: resource-modeling-and-uri-design-037
    difficulty: beginner
    tags: [trailing-slash, rfc-3986]
    question: |
      Per RFC 3986, how do `/orders` and `/orders/` relate?
    options:
      - "They are always the same URI."
      - "The trailing slash is illegal in URIs."
      - "They are technically different URIs."
      - "Only /orders/ is valid for a collection."
    answer: 2
    explanation: |
      RFC 3986 treats them as different URIs. APIs should standardize on one form
      (commonly no trailing slash for resources) and redirect or reject the other.
    ref: "concepts.md#trailing-slashes-and-case-sensitivity"

  - id: resource-modeling-and-uri-design-038
    difficulty: intermediate
    tags: [case-sensitivity, rfc-3986]
    question: |
      According to RFC 3986, which URI component is case-SENSITIVE by default?
    options:
      - "The scheme (https)"
      - "The host (API.Example.com)"
      - "The path (/Orders/42)"
      - "None of the components carry case significance"
    answer: 2
    explanation: |
      Scheme and host are case-insensitive and normalized to lowercase, but the
      path is case-sensitive, so `/Orders/42` and `/orders/42` may differ.
      Convention is all-lowercase paths to avoid ambiguity.
    ref: "concepts.md#trailing-slashes-and-case-sensitivity"

  - id: resource-modeling-and-uri-design-039
    difficulty: advanced
    tags: [trailing-slash, relative-references, hateoas]
    question: |
      Resolving the relative reference `items` against the base `/orders/42`
      (no trailing slash) yields which absolute path per RFC 3986?
    options:
      - "/orders/42/items"
      - "/orders/items"
      - "/items"
      - "/orders/42items"
    answer: 1
    explanation: |
      Without a trailing slash, the last segment (42) is replaced during relative
      resolution, giving `/orders/items`. With `/orders/42/` the result would be
      `/orders/42/items`. This is why trailing-slash discipline matters for
      hypermedia clients.
    ref: "concepts.md#trailing-slashes-and-case-sensitivity"

  - id: resource-modeling-and-uri-design-040
    difficulty: intermediate
    tags: [trailing-slash, canonicalization]
    question: |
      Which is a recommended way to handle the non-canonical trailing-slash form
      of a resource URI?
    options:
      - "Silently serve both forms as byte-identical 200 responses, without any redirect or canonical hint."
      - "Issue a redirect (e.g. 301) from the non-canonical form to the canonical one, or reject it with 404."
      - "Return 500 Internal Server Error for the trailing-slash variant to discourage its use by clients."
      - "Randomly pick one of the two forms per request so that neither becomes the canonical address."
    answer: 1
    explanation: |
      Pick one canonical form and enforce it — commonly a 301 redirect from the
      other form (client-friendly) or a 404. Serving both as if identical invites
      duplicate cache entries.
    ref: "concepts.md#trailing-slashes-and-case-sensitivity"

  - id: resource-modeling-and-uri-design-041
    difficulty: beginner
    tags: [stability, cool-uris, w3c]
    question: |
      What is the core message of the W3C note "Cool URIs don't change"?
    options:
      - "URIs should be refreshed and updated frequently so they always reflect the latest branding and technology choices."
      - "URIs must always embed an explicit version number in the path so clients can tell which release they are calling."
      - "URIs should be made as short as physically possible above every other concern, even at the cost of readability."
      - "A URI is a long-lived contract; the only reason it changes is that you decided to break it, and that's usually avoidable."
    answer: 3
    explanation: |
      Tim Berners-Lee's note argues URIs are durable identifiers that should keep
      working; with good design (no volatile details, redirects when needed) you
      rarely need to change them.
    ref: "concepts.md#uri-stability--cool-uris"

  - id: resource-modeling-and-uri-design-042
    difficulty: intermediate
    tags: [stability, volatile-details]
    question: |
      Which of these embedded in a URI path is most likely to harm long-term URI
      stability?
    options:
      - "An opaque immutable resource id that never changes for the life of the resource"
      - "A lowercase plural collection name chosen from the stable domain vocabulary"
      - "The implementation technology, e.g. /app/servlet/getOrder.do"
      - "A single level of resource nesting expressing a parent-child scope"
    answer: 2
    explanation: |
      Encoding technology, server names, or org structure into the path ties the
      URI to volatile implementation details; when the tech changes, the URI
      breaks. Opaque ids and clean nouns are stable.
    ref: "concepts.md#uri-stability--cool-uris"

  - id: resource-modeling-and-uri-design-043
    difficulty: advanced
    tags: [stability, redirects, methods, rfc-9110]
    question: |
      You must move a resource that clients access via POST, and you need the
      method and body preserved on redirect. Which status code is appropriate?
    options:
      - "301 Moved Permanently"
      - "302 Found"
      - "308 Permanent Redirect"
      - "303 See Other"
    answer: 2
    explanation: |
      Per RFC 9110, 308 (and 307 for temporary) preserve the original method and
      body. 301/302 historically caused many clients to switch to GET, which
      would lose a POST body.
    ref: "concepts.md#uri-stability--cool-uris"

  - id: resource-modeling-and-uri-design-044
    difficulty: intermediate
    tags: [stability, additive-change, evolution]
    question: |
      Which practice best preserves URI stability while still evolving an API?
    options:
      - "Rename collections whenever the domain vocabulary is refined so paths always match current terminology."
      - "Encode the current sprint or release number into each path so clients can see which iteration they hit."
      - "Change resource ids to reflect the latest schema version whenever the underlying data model is migrated."
      - "Make additive changes (new fields/resources) without removing or repurposing existing URIs."
    answer: 3
    explanation: |
      Additive change lets tolerant-reader clients keep working: add new
      resources/fields without breaking existing URIs or semantics. Renaming and
      repurposing break clients silently.
    ref: "concepts.md#uri-stability--cool-uris"

  - id: resource-modeling-and-uri-design-045
    difficulty: intermediate
    tags: [collection, delete, safety]
    question: |
      An interviewer notes that `DELETE /orders` (on the collection) is rarely
      exposed. Why?
    options:
      - "DELETE is not a valid HTTP method for collection URIs per RFC 9110 and is rejected by conforming servers."
      - "It would delete every member of the collection, which is dangerous and usually undesirable."
      - "Collections are read-only resources by definition and cannot be modified by any HTTP method at all."
      - "DELETE on a collection is defined to always return 201 Created rather than a success or no-content code."
    answer: 1
    explanation: |
      DELETE on a collection URI logically removes all members — almost always
      too dangerous to expose. DELETE is normally applied to specific member
      URIs like /orders/42.
    ref: "concepts.md#collection-vs-singleton-resources"

  - id: resource-modeling-and-uri-design-046
    difficulty: advanced
    tags: [uri-templates, rfc-6570]
    question: |
      Notation like `/users/{id}/orders/{orderId}` for describing a class of URIs
      is standardized by which RFC?
    options:
      - "RFC 6570 (URI Template)"
      - "RFC 8288 (Web Linking)"
      - "RFC 9457 (Problem Details)"
      - "RFC 7519 (JWT)"
    answer: 0
    explanation: |
      RFC 6570 defines URI Templates, the `{var}` expansion syntax widely used in
      docs, OpenAPI-style path items, and hypermedia link templates.
    ref: "concepts.md#anatomy-of-a-uri"

  - id: resource-modeling-and-uri-design-047
    difficulty: intermediate
    tags: [scenario, design-review, nouns]
    question: |
      Reviewing an API you see: `POST /api/getUserOrders`, `POST /api/order.json?do=cancel`,
      and `GET /Api/Orders/`. Which single change best improves REST alignment?
    options:
      - "Keep the verb-in-path style but switch every endpoint to GET so the whole API becomes uniformly safe and cacheable."
      - "Add explicit .json extensions to every endpoint path so the response format is unambiguous to all clients."
      - "Move all resource ids out of the path and into the request body so the URIs themselves stay short and uniform."
      - "Model nouns with methods and consistent lowercase paths: GET /orders?user=42, POST /orders/42/cancel, GET /orders."
    answer: 3
    explanation: |
      The fixes span multiple subtopics: replace verbs with nouns+methods, drop
      the .json extension in favor of Accept negotiation, use lowercase paths,
      and a scoped POST action for cancel. That's the coherent REST-aligned
      redesign.
    ref: "concepts.md#resources-as-nouns-not-verbs"

  - id: resource-modeling-and-uri-design-048
    difficulty: beginner
    tags: [singleton, method, config]
    question: |
      For a global singleton resource `/config` (exactly one exists), which
      request replaces its representation?
    options:
      - "POST /config"
      - "PUT /config"
      - "POST /configs"
      - "GET /config"
    answer: 1
    explanation: |
      A singleton has no collection to POST into; you read it with GET and
      replace it with PUT (or PATCH for a partial update). POST /config or a
      /configs collection would be the wrong model.
    ref: "concepts.md#collection-vs-singleton-resources"

  - id: resource-modeling-and-uri-design-049
    difficulty: advanced
    tags: [percent-encoding, rfc-3986, reserved-chars]
    question: |
      Under RFC 3986, which set contains exactly the characters that are always
      safe literally and should NOT be percent-encoded?
    options:
      - "The gen-delims: : / ? # [ ] @"
      - "The sub-delims: ! $ & ' ( ) * + , ; ="
      - "The unreserved set: A-Z a-z 0-9 - . _ ~"
      - "Any printable ASCII character except space"
    answer: 2
    explanation: |
      The unreserved set (ALPHA, DIGIT, and `-`, `.`, `_`, `~`) is always safe and
      should not be gratuitously encoded. gen-delims and sub-delims are reserved
      characters with structural meaning; they must be encoded when carried as data.
    ref: "concepts.md#percent-encoding--reserved-characters"

  - id: resource-modeling-and-uri-design-050
    difficulty: expert
    tags: [percent-encoding, path, plus, form-encoding]
    question: |
      A client sends `GET /files/report+draft` and the server decodes the last
      path segment as `report draft` (a space). Why is this a bug?
    options:
      - "RFC 3986 requires `+` in any URI to always mean a literal plus, so `+`→space is wrong everywhere."
      - "`+`→space is an application/x-www-form-urlencoded convention for query/form data; in a PATH segment `+` is a literal plus and a space must be %20."
      - "The segment should have been rejected with a 400 Bad Request, because `+` is a character that RFC 3986 forbids inside path segments."
      - "The server was right to expand it, and should also have decoded `+` into its %2B escape automatically before routing the request."
    answer: 1
    explanation: |
      `+` meaning space is a form-urlencoding rule that applies to query strings and
      form bodies, not to path segments per RFC 3986. In a path, `+` is a literal
      plus; a space is %20. Decoding a path `+` as a space silently corrupts the id.
    ref: "concepts.md#percent-encoding--reserved-characters"

  - id: resource-modeling-and-uri-design-051
    difficulty: expert
    tags: [percent-encoding, encoded-slash, gateway, security]
    question: |
      An id legitimately contains a `/` (a Git ref like `feature/login`). The team
      sends `GET /refs/feature%2Flogin`, but an intermediary rejects or mis-routes
      it. Which statement is the most accurate assessment?
    options:
      - "%2F is guaranteed by RFC 3986 to be treated identically to `/`, so the gateway is non-compliant and nothing can be done."
      - "The only correct solution is to double-encode the separator as %252F, which every conforming gateway is guaranteed to pass through untouched to the origin."
      - "Encoded slashes are explicitly prohibited by RFC 3986 §3.3, so an id containing a `/` is invalid and can never be represented in any URI."
      - "%2F is NOT equivalent to `/` per RFC 3986, and many gateways reject or pre-decode encoded slashes; a robust fix is to encode the whole id as one opaque token or restructure into sub-resources."
    answer: 3
    explanation: |
      RFC 3986 §3.3 says %2F is not equivalent to a real slash, yet gateways/proxies
      commonly reject or pre-decode it (and double-decoding %252F is a path-traversal
      vector). The durable fix is to avoid needing an encoded slash: encode the id as
      one opaque token or model the components as separate segments.
    ref: "concepts.md#percent-encoding--reserved-characters"

  - id: resource-modeling-and-uri-design-052
    difficulty: expert
    tags: [normalization, rfc-3986, equivalence, pct-encoding]
    question: |
      Applying only RFC 3986 syntax-based normalization, which pair is guaranteed
      equivalent?
    options:
      - "https://api.ex.com/%7Euser  and  https://api.ex.com/~user"
      - "https://api.ex.com/Orders   and  https://api.ex.com/orders"
      - "https://api.ex.com/a        and  https://api.ex.com/a/"
      - "https://api.ex.com/x?a=1&b=2 and https://api.ex.com/x?b=2&a=1"
    answer: 0
    explanation: |
      Percent-encoding normalization decodes needlessly-encoded unreserved characters,
      so %7E and ~ are equivalent. Path case is significant (Orders≠orders), a trailing
      slash makes a distinct URI, and query-parameter reordering is not a safe syntactic
      equivalence.
    ref: "concepts.md#uri-normalization--equivalence"

  - id: resource-modeling-and-uri-design-053
    difficulty: expert
    tags: [normalization, case, pct-encoded]
    question: |
      During case normalization (RFC 3986 §6.2.2.1), which transformation is
      correct?
    options:
      - "The path segment is lowercased along with the scheme and host so the whole URI becomes case-insensitive."
      - "The hex digits of a percent-encoded triplet are lowercased for consistency, e.g. %2F is rewritten to %2f."
      - "The scheme and host are lowercased, and the hex digits in pct-encoded triplets are uppercased (%2f → %2F)."
      - "Every literal percent sign in the URI is converted into its own uppercase hex escape %25 during normalization."
    answer: 2
    explanation: |
      Case normalization lowercases scheme and host and uppercases the hex digits in
      percent-encoded triplets (%2f → %2F). The path itself is case-sensitive and is
      not lowercased.
    ref: "concepts.md#uri-normalization--equivalence"

  - id: resource-modeling-and-uri-design-054
    difficulty: advanced
    tags: [normalization, identity, canonical, caching]
    question: |
      Two different URIs return byte-for-byte identical responses. What can you
      conclude about resource identity?
    options:
      - "They are definitely the same resource, so one of the two URIs should immediately 301-redirect to the other."
      - "They are equivalent only when their query strings also match byte-for-byte, otherwise they are unrelated."
      - "HTTP caching is guaranteed to treat them as a single shared cache entry regardless of their differing URIs."
      - "Nothing certain — identical bytes can be independent resources; equivalence is about identity, not current content."
    answer: 3
    explanation: |
      Equivalence concerns identity, not the bytes at one moment. Identical current
      representations may belong to distinct resources. If they truly are the same
      resource, advertise a canonical form (301, Content-Location, rel=canonical);
      otherwise keep them separate.
    ref: "concepts.md#uri-normalization--equivalence"

  - id: resource-modeling-and-uri-design-055
    difficulty: advanced
    tags: [i18n, iri, rfc-3987, percent-encoding]
    question: |
      You must expose a resource named `Cádiz` in the path of a plain URI (not an
      IRI). What appears in the URI?
    options:
      - "/cities/Cádiz — non-ASCII is permitted directly in URIs"
      - "/cities/C%E1diz — the Latin-1 byte of á, percent-encoded"
      - "/cities/C%C3%A1diz — the UTF-8 bytes of á, percent-encoded"
      - "/cities/Cadiz — accents must be stripped for URIs"
    answer: 2
    explanation: |
      RFC 3986 URIs are ASCII-only; non-ASCII text is encoded as its UTF-8 bytes
      percent-encoded. `á` is UTF-8 0xC3 0xA1, so `Cádiz` → `C%C3%A1diz`. RFC 3987
      IRIs allow the Unicode form directly and define this exact mapping to a URI.
    ref: "concepts.md#internationalization-iris-and-non-ascii-uris"

  - id: resource-modeling-and-uri-design-056
    difficulty: expert
    tags: [i18n, locale, content-negotiation, caching, vary]
    question: |
      A data API must return product descriptions localized per user. Which design
      is most "RESTful" and cache-correct?
    options:
      - "Put locale in the path (/en-US/products/42); it gives each language its own canonical URI."
      - "Use a query param (/products/42?lang=en) so shared caches key on the language automatically and no Vary header is ever required."
      - "Negotiate with the Accept-Language request header and set Vary: Accept-Language, treating language as a representation variant, not resource identity."
      - "Serve a locale subdomain (en.api.com) so DNS-level routing handles the language split and gives each region its own isolated cache."
    answer: 2
    explanation: |
      Language is a representation variant of the same resource, not a separate
      identity. Accept-Language + Vary: Accept-Language keeps one canonical URI per
      product and lets caches store per-language variants correctly. Path/query/subdomain
      locale forks identity and multiplies URIs (defensible for SEO pages, not a data API).
    ref: "concepts.md#internationalization-iris-and-non-ascii-uris"

  - id: resource-modeling-and-uri-design-057
    difficulty: expert
    tags: [uri-templates, rfc-6570, operators, expansion]
    question: |
      Given RFC 6570 template `/users/{id}/orders{?status,page}` with `id=42`,
      `status=open`, `page=2`, what is the expansion?
    options:
      - "/users/42/orders/open/2"
      - "/users/42/orders?status=open&page=2"
      - "/users/42/orders;status=open;page=2"
      - "/users/42/orders#status=open,page=2"
    answer: 1
    explanation: |
      The `{?var,var}` form operator starts a query string with `?` and joins pairs
      with `&`: `?status=open&page=2`. The `;` operator would produce matrix params and
      `#` a fragment.
    ref: "concepts.md#uri-templates-in-depth-rfc-6570"

  - id: resource-modeling-and-uri-design-058
    difficulty: expert
    tags: [uri-templates, rfc-6570, explode, modifiers]
    question: |
      Using RFC 6570, which template+value expands to `?ids=1&ids=2&ids=3`?
    options:
      - "{?ids} with ids=[1,2,3]"
      - "{?ids*} with ids=[1,2,3]"
      - "{?ids:3} with ids=123"
      - "{&ids} with ids=[1,2,3]"
    answer: 1
    explanation: |
      The explode modifier `*` expands a list into repeated name=value pairs, so
      `{?ids*}` yields `?ids=1&ids=2&ids=3`. Without `*`,
      `{?ids}` joins the list into one comma-separated value; `:3` is a prefix modifier;
      `&` is the query-continuation operator.
    ref: "concepts.md#uri-templates-in-depth-rfc-6570"

  - id: resource-modeling-and-uri-design-059
    difficulty: advanced
    tags: [uri-templates, hypermedia, link-header, rfc-8288]
    question: |
      A hypermedia response hands the client a link marked as `templated`. What is
      the client expected to do with it?
    options:
      - "Dereference the URI exactly as given, sending the raw `{var}` braces to the server unchanged."
      - "Treat it as an RFC 6570 URI Template and expand its variables before dereferencing."
      - "Reject it, because templated links are not allowed by RFC 8288."
      - "URL-encode the braces `{}` to %7B/%7D and send the escaped template string verbatim."
    answer: 1
    explanation: |
      A templated link is an RFC 6570 URI Template; the client fills in the variables
      (e.g. from user input) and expands it to a concrete URI before dereferencing.
      Marking a link templated tells the client not to fetch it as-is.
    ref: "concepts.md#uri-templates-in-depth-rfc-6570"

  - id: resource-modeling-and-uri-design-060
    difficulty: advanced
    tags: [matrix-params, query, scope, rfc-6570]
    question: |
      What is the defining difference between a matrix parameter (`;k=v`) and a
      query parameter (`?k=v`)?
    options:
      - "A matrix parameter binds to a specific path segment, while the query string applies to the whole URI."
      - "Matrix parameters are automatically encrypted by the client before transmission, whereas query parameters are always sent as plaintext."
      - "Matrix parameters are standardized with fully defined semantics by RFC 3986, whereas query parameters are left entirely undefined by the spec."
      - "Query parameters may legally appear only once per URI, while matrix parameters are the only mechanism allowed to repeat a key."
    answer: 0
    explanation: |
      A matrix param attaches to one path segment (so it can differ per segment and
      survive nesting), whereas the query string applies to the entire request. RFC
      3986 treats `;` as a sub-delim with no assigned semantics — matrix-param meaning
      is application-defined.
    ref: "concepts.md#matrix-parameters"

  - id: resource-modeling-and-uri-design-061
    difficulty: advanced
    tags: [matrix-params, adoption, tradeoffs]
    question: |
      Why do most public APIs avoid matrix parameters despite RFC 6570 supporting
      the `{;var}` operator?
    options:
      - "RFC 9110 explicitly forbids sending matrix parameters on any GET request, so they only work with POST bodies."
      - "Caching/proxy support is inconsistent, few clients construct them, and their semantics are not standardized."
      - "They are technically unable to coexist with ordinary path parameters in the same URI without a parsing conflict."
      - "Web browsers silently strip all `;k=v` matrix segments from the address bar before dispatching the request."
    answer: 1
    explanation: |
      Matrix params suffer from patchy proxy/cache handling, little client tooling, and
      no standardized semantics, so most APIs prefer query strings. They are justified
      only for genuinely per-segment parameters (e.g. map-tile coordinates).
    ref: "concepts.md#matrix-parameters"

  - id: resource-modeling-and-uri-design-062
    difficulty: expert
    tags: [compound-keys, opacity, evolvability, scenario]
    question: |
      Your entity's primary key is the tuple (tenantId, region, sku). You model the
      URI as `/tenants/{t}/regions/{r}/skus/{s}`. Next year the team must add a
      fourth key component (channel). What did the segmented design cost you?
    options:
      - "Nothing — adding a segment is backward compatible for all existing clients."
      - "Every client that constructs the URI must change, and existing cached/bookmarked URIs no longer address the resource — a breaking change caused by the id no longer being opaque."
      - "Only the server routing table changes; clients are unaffected because ids are opaque."
      - "The URI simply becomes case-insensitive, which is a minor concern."
    answer: 1
    explanation: |
      Spreading a compound key across segments destroys id opacity: clients assemble
      the URI from parts, so adding a fourth key component is a breaking change that
      invalidates constructed and bookmarked URIs. Encoding the tuple as one opaque
      token would have let the internal key structure evolve without changing URI shape.
    ref: "concepts.md#composite-and-compound-keys"

  - id: resource-modeling-and-uri-design-063
    difficulty: advanced
    tags: [compound-keys, opaque-token, tradeoffs]
    question: |
      To preserve id opacity and evolvability for a multi-part natural key, which
      approach is best, and what is its main downside?
    options:
      - "Spread each key part across multiple path segments; downside: the URIs simply become somewhat more verbose but stay fully evolvable."
      - "Encode the whole tuple into one opaque token; downside: loss of human readability and hierarchy browsing."
      - "Put every key part into separate query parameters; downside: there is essentially no trade-off, so it is the universal best choice."
      - "Use a random UUID completely unrelated to the natural key; downside: the resource can then never be looked up by its business key at all."
    answer: 1
    explanation: |
      Encoding the compound key as a single opaque token keeps the id atomic, so you
      can change its internal structure without changing the URI shape. The trade-off is
      that the URI is no longer human-readable and you lose the ability to browse the
      hierarchy segment by segment.
    ref: "concepts.md#composite-and-compound-keys"

  - id: resource-modeling-and-uri-design-064
    difficulty: expert
    tags: [query-method, search, caching, idempotency, draft]
    question: |
      A 20 KB filter must be sent for a search. Comparing GET, POST /searches, and
      the HTTP QUERY method, which statement is correct?
    options:
      - "GET with the 20 KB filter placed in the request body is the standard fix, and intermediaries treat it as fully safe and cacheable like any other GET."
      - "POST /searches is defined to be both safe and idempotent, so shared caches store and reuse its response exactly the way they do for a GET."
      - "The QUERY method (an IETF draft) is safe and idempotent and carries a request body whose response can be cached keyed on the content; POST /searches is the pragmatic fallback today but forfeits GET-style caching."
      - "QUERY is already a finalized RFC with universal server support and has completely replaced POST /searches for large filters in production today."
    answer: 2
    explanation: |
      QUERY (draft-ietf-httpbis-safe-method-w-body) is designed to be safe+idempotent
      with a body and content-keyed caching. Until it's widely supported, POST /searches
      is the fallback but is neither safe nor cacheable. GET-with-body has no defined
      semantics and is dropped by many intermediaries.
    ref: "concepts.md#url-length-limits-search-resources-and-the-query-method"

  - id: resource-modeling-and-uri-design-065
    difficulty: advanced
    tags: [url-length, status-codes, rfc-9110]
    question: |
      A client encodes an enormous filter into the query string and the server
      cannot process the over-length request line. Which status best fits?
    options:
      - "400 Bad Request"
      - "413 Content Too Large"
      - "414 URI Too Long"
      - "431 Request Header Fields Too Large"
    answer: 2
    explanation: |
      RFC 9110 defines 414 URI Too Long for a request-target that exceeds the server's
      willingness to interpret. 413 concerns the body, 431 concerns header fields, and
      400 is generic.
    ref: "concepts.md#url-length-limits-search-resources-and-the-query-method"

  - id: resource-modeling-and-uri-design-066
    difficulty: expert
    tags: [resource-names, aip-122, full-name, cross-service]
    question: |
      Per Google AIP-122, which is the FULL resource name form used to reference a
      resource unambiguously across services?
    options:
      - "publishers/123/books/456"
      - "//library.googleapis.com/publishers/123/books/456"
      - "https://library.googleapis.com/v1/publishers/123/books/456"
      - "books/456"
    answer: 1
    explanation: |
      A full resource name is schemeless with a leading `//authority` and no version:
      `//library.googleapis.com/publishers/123/books/456`. The relative name omits the
      authority; adding scheme (+version) makes it a dereferenceable resource URI.
    ref: "concepts.md#full-vs-relative-resource-names"

  - id: resource-modeling-and-uri-design-067
    difficulty: expert
    tags: [resource-names, versioning, identity, aip-122]
    question: |
      Why does AIP-122 exclude the API version (e.g. `v1`) from a resource's
      canonical NAME?
    options:
      - "Because version tokens like `v1` are not valid characters in a URI path segment and would be rejected during resolution."
      - "Because names must persist across versions — the resource's identity doesn't change when the API rolls from v1 to v2."
      - "Because AIP-122 mandates that all versioning be carried exclusively in the Accept header and never appear anywhere in a URI."
      - "Because embedding a version number would force the entire resource name to become case-sensitive across every service."
    answer: 1
    explanation: |
      A resource name expresses stable identity; the same book is the same book across
      API versions. Version is a transport/URI concern (e.g. the resource URI), so it is
      kept out of the name that must persist version to version.
    ref: "concepts.md#full-vs-relative-resource-names"

  - id: resource-modeling-and-uri-design-068
    difficulty: expert
    tags: [client-id, put, post, idempotency, idempotency-key]
    question: |
      A client wants safe retries when creating a resource. Comparing a client-chosen
      id via PUT with server-assigned id via POST, which is the accurate analysis?
    options:
      - "PUT to a client-chosen URI is idempotent (retry yields one resource); POST create is not, which is why the Idempotency-Key header exists to dedup POST retries."
      - "Both PUT and POST are fully idempotent for creation under RFC 9110, so any retry of either always converges on exactly one resource."
      - "POST is the idempotent method for creation, while PUT is the one that fabricates a brand-new resource with a fresh id on every single call."
      - "The Idempotency-Key header is only ever meaningful when paired with PUT, and servers must ignore it entirely on a POST request."
    answer: 0
    explanation: |
      PUT to a known client-chosen URI is create-or-replace and idempotent, so retries
      converge on one resource. POST create is not idempotent (each call may duplicate),
      so the Idempotency-Key request header lets the server dedup retried POSTs. Both are
      answers to safe-retry-of-create.
    ref: "concepts.md#server-assigned-vs-client-provided-identifiers"

  - id: resource-modeling-and-uri-design-069
    difficulty: advanced
    tags: [client-id, conflict, status-codes]
    question: |
      An API accepts client-provided ids and treats `POST /books` with an id as a
      strict create (not an upsert). A client POSTs an id that already exists. What is
      the correct response?
    options:
      - "200 OK, silently returning the already-existing resource as though the create had succeeded normally."
      - "201 Created, transparently overwriting the existing resource's state with the newly supplied representation."
      - "409 Conflict, because the id already exists and this is a create, not a replace."
      - "301 Moved Permanently, redirecting the client to the canonical URI of the resource that already exists."
    answer: 2
    explanation: |
      A strict create on an already-existing id is a conflict: return 409. Overwriting
      would be PUT/upsert semantics, not create. Silently returning 200 hides the
      collision.
    ref: "concepts.md#server-assigned-vs-client-provided-identifiers"

  - id: resource-modeling-and-uri-design-070
    difficulty: advanced
    tags: [aliases, self, me, bola, security]
    question: |
      A design exposes `/users/me` (resolving the caller from the auth token) instead
      of `/users/{myId}`. What security benefit does this primarily provide?
    options:
      - "It transparently encrypts the caller's user id in transit so it cannot be read off the wire even over plain HTTP."
      - "It makes the endpoint safely cacheable by shared proxy caches with a single entry served to every authenticated user."
      - "The caller's id never appears in the URL, removing an id-tampering (IDOR/BOLA) surface."
      - "It removes the need for authentication entirely, since the `me` alias by itself proves the caller's identity."
    answer: 2
    explanation: |
      With `me`, identity comes from the token and no id is present to guess or tamper
      with, removing an IDOR surface (aligned with mitigating BOLA / OWASP API1:2023).
      The response should still return the canonical `self` URI for reuse.
    ref: "concepts.md#aliases-and-self-pseudo-identifiers"

  - id: resource-modeling-and-uri-design-071
    difficulty: expert
    tags: [nesting, authorization, idor, bola, scenario]
    question: |
      A handler for `GET /users/{userId}/orders/{orderId}` looks up the order by
      `orderId` alone and returns it. A caller authorized as user 42 requests
      `/users/42/orders/1001`, but order 1001 belongs to user 7. What is the flaw and fix?
    options:
      - "There is no flaw — nesting the URI under /users/42 already guarantees at the routing layer that order 1001 must belong to user 42."
      - "The flaw is a path-confusion IDOR (BOLA): the handler must verify order 1001 is linked to user 42 and that the caller may access it, returning 404/403 otherwise."
      - "The fix is to switch orderId from an integer to a random UUID, whose unguessability alone prevents the cross-user leak."
      - "The fix is to move orderId out of the path and into a query parameter so the parent segment can no longer be spoofed."
    answer: 1
    explanation: |
      The URI path is a hint, not an authorization check. Ignoring the parent segment
      lets a caller read another user's order — a path-confusion IDOR (OWASP API1:2023
      BOLA). The server must validate the parent-child linkage and the caller's access,
      returning 404 (don't confirm existence) or 403. Opaque ids don't fix missing authz.
    ref: "concepts.md#nesting-as-an-authorization-boundary"

  - id: resource-modeling-and-uri-design-072
    difficulty: advanced
    tags: [bopla, owasp, nesting, properties]
    question: |
      OWASP API3:2023 (Broken Object Property Level Authorization) is most directly
      about which failure?
    options:
      - "Guessable sequential object ids that let an attacker walk the id space and enumerate resources one by one."
      - "Exposing or accepting object properties the caller is not authorized to read or modify (e.g. mass assignment / over-exposure)."
      - "Missing rate limits on a collection endpoint that allow an attacker to exhaust server resources with request floods."
      - "Serving one and the same resource at two different canonical URIs, splitting caches and confusing self links."
    answer: 1
    explanation: |
      BOPLA concerns property-level authorization: returning fields a caller shouldn't
      see, or accepting fields a caller shouldn't set (mass assignment). It complements
      BOLA (object-level access) — both must be enforced regardless of URI shape.
    ref: "concepts.md#nesting-as-an-authorization-boundary"

  - id: resource-modeling-and-uri-design-073
    difficulty: advanced
    tags: [relationships, pagination, link-header, rfc-8288]
    question: |
      A sub-collection endpoint `/users/42/orders` currently returns a bare unbounded
      JSON array. What is the correct modeling guidance?
    options:
      - "Nested collections are exempt from pagination because the parent resource already bounds the set, so returning the full array under a parent is always safe."
      - "Only top-level collections need pagination; sub-collections should always return everything for consistency."
      - "Pagination should be deferred until the array grows past a hard 10,000-item threshold, since anything smaller is guaranteed to fit one response."
      - "Relationship endpoints are collections and must be paginated/filterable like top-level lists, using cursor/offset and Link rel=next/prev/first/last."
    answer: 3
    explanation: |
      A relationship endpoint is a collection and needs the same pagination contract
      (cursor/offset, page metadata, RFC 8288 Link relations). Nested collections are
      often more prone to unboundedness, and retrofitting pagination onto a shipped bare
      array is a breaking change.
    ref: "concepts.md#paginating-relationships"

  - id: resource-modeling-and-uri-design-074
    difficulty: expert
    tags: [custom-methods, aip-136, get-vs-post, colon]
    question: |
      Per Google AIP-136, when is `GET` (rather than `POST`) acceptable for a custom
      method like `/books/1:analyze`, and what constraint protects the colon syntax?
    options:
      - "GET is acceptable for any custom method regardless of side effects; the colon separator must always be URL-encoded as %3A so proxies don't read it as a scheme delimiter."
      - "GET is never acceptable for any custom method; every one must use POST, and the `:` character is always permitted inside resource ids without any restriction."
      - "GET is acceptable only if the custom method is side-effect-free (a pure retrieval/computation); the `:` must be disallowed inside resource ids so it can't collide with the method separator."
      - "GET is acceptable only for collection-scoped custom methods; the `:` separator is reserved exclusively for query strings and may never appear in a path."
    answer: 2
    explanation: |
      AIP-136 allows GET for a side-effect-free custom method (safe retrieval), and POST
      otherwise. To keep `resource:verb` unambiguous, `:` must be disallowed within
      resource ids so it can't be confused with the custom-method separator.
    ref: "concepts.md#custom-methods-batch-and-long-running-operations"

  - id: resource-modeling-and-uri-design-075
    difficulty: expert
    tags: [long-running-operations, async, status-codes, operation-resource]
    question: |
      An action (`POST /videos/9:transcode`) can take minutes to complete. What is
      the cleanest REST modeling for the asynchronous result?
    options:
      - "Hold the HTTP connection open for the full duration of the transcode and return a single 200 OK once the job finally finishes."
      - "Return 202 Accepted with a Location/body pointing at an operation resource (e.g. /operations/abc) the client polls or subscribes to."
      - "Return 200 OK immediately with a synthetic success payload and assume the transcode will complete correctly in the background afterward."
      - "Return 204 No Content right away and require the client to keep re-requesting the video URL until its representation eventually changes."
    answer: 1
    explanation: |
      Model the work as a first-class operation resource: return 202 Accepted with a
      pointer to /operations/{id} carrying status, which the client polls (or gets a
      webhook for). This is the standard long-running-operation pattern and avoids
      holding connections or faking completion.
    ref: "concepts.md#custom-methods-batch-and-long-running-operations"

  - id: resource-modeling-and-uri-design-076
    difficulty: expert
    tags: [location, content-location, rfc-9110, create]
    question: |
      A `POST /orders` creates order 42 and returns the created representation in the
      body. Which header usage is correct per RFC 9110?
    options:
      - "Content-Location: /orders/42, since Content-Location is the header defined to point at where a newly created resource lives after a POST."
      - "Location: /orders/42 to indicate where the new resource lives; Content-Location optionally names the URI of the enclosed representation."
      - "Location and Content-Location are treated as interchangeable synonyms, so either header may carry /orders/42 on a 201 create response."
      - "Neither Location nor Content-Location is appropriate on a 201 response; the new resource's URI belongs only in the response body."
    answer: 1
    explanation: |
      Location points at where the new resource lives (the create target). Content-Location
      names the URI of the representation enclosed in this response. On a create returning
      the body, Location: /orders/42 is correct; Content-Location is for advertising the
      specific representation's URI, not the new resource's location.
    ref: "concepts.md#location-vs-content-location"

  - id: resource-modeling-and-uri-design-077
    difficulty: advanced
    tags: [canonical, rel-canonical, content-location, caching, rfc-6596]
    question: |
      A resource is reachable at several URLs (with different tracking query params)
      but they are the SAME resource and you want them to stay live. Which mechanism
      tells caches/crawlers which URL is canonical?
    options:
      - "Issue a 301 redirect from each tracking-param variant to the canonical URL so caches coalesce them."
      - "Send `Link: <canonical-url>; rel=\"canonical\"` (RFC 6596), optionally with Content-Location."
      - "Return 409 Conflict for every non-canonical variant so clients are forced to retry against the canonical URL."
      - "Add a trailing slash only to the canonical form so caches treat it as the single authoritative URL."
    answer: 1
    explanation: |
      When aliases must remain dereferenceable, `rel="canonical"` (RFC 6596) declares the
      canonical URL so caches/crawlers coalesce them. A 301 is for a genuine move (the old
      URL stops serving), which is a different action from aliasing.
    ref: "concepts.md#canonical-uri-enforcement"

  - id: resource-modeling-and-uri-design-078
    difficulty: advanced
    tags: [well-known, rfc-8615, discovery, metadata]
    question: |
      Where should site-wide discovery metadata such as OAuth/OpenID configuration
      live, and why isn't it a normal resource in your hierarchy?
    options:
      - "Under /v1/metadata, because every discovery endpoint must itself be a versioned resource inside the normal API hierarchy."
      - "In the root document body, discoverable only by walking HATEOAS links out from the API entry point on each request."
      - "In a custom response header echoed on every response, so clients scrape the configuration from headers rather than a fixed path."
      - "At a reserved /.well-known/ path (RFC 8615), so clients find it at a predictable address without it being part of your resource model."
    answer: 3
    explanation: |
      RFC 8615 reserves /.well-known/ for site-wide metadata (e.g.
      /.well-known/openid-configuration, /.well-known/api-catalog per RFC 9727).
      Discovery/metadata deliberately lives outside the normal noun space at a fixed,
      guessable address so clients don't have to be told where it is.
    ref: "concepts.md#well-known-uris"

  - id: resource-modeling-and-uri-design-079
    difficulty: intermediate
    tags: [singleton, collection-of-one, evolvability, zalando]
    question: |
      Zalando's guidelines suggest sometimes modeling a would-be singleton as a
      "collection of cardinality one" rather than a bare singular path. What is the
      main rationale?
    options:
      - "It is more evolvable — if the business later needs to allow multiple, the collection model already supports it without a URI redesign."
      - "It is required by RFC 3986, which mandates that every singular resource be modeled as a single-member collection."
      - "Collections are always faster to cache than singletons because a list response can be split across multiple cacheable pages."
      - "Singular paths without an id segment are illegal under RFC 3986, so a bare /config-style route can never be exposed."
    answer: 0
    explanation: |
      Modeling a singleton as a collection with one member keeps the door open: if the
      constraint later relaxes to allow multiples, the URI shape already fits, avoiding a
      breaking redesign. It's an evolvability hedge, not a hard rule.
    ref: "concepts.md#collection-vs-singleton-resources"

  - id: resource-modeling-and-uri-design-080
    difficulty: intermediate
    tags: [batch, custom-methods, aip-231, collection-scoped]
    question: |
      An API needs to fetch many books by id in a single call without hitting URL
      length limits. Which follows the AIP batch-method convention?
    options:
      - "GET /books?id=1&id=2&id=3&... (hundreds of ids)"
      - "GET /books/1,2,3 as a comma path segment"
      - "POST /books:batchGet with the ids in the request body"
      - "POST /getBooks with a verb-first path"
    answer: 2
    explanation: |
      A collection-scoped custom method `POST /books:batchGet` (AIP-231) carries the ids
      in the body, avoiding URL-length limits and following the `collection:verb`
      convention. Verb-first paths (/getBooks) are RPC-style.
    ref: "concepts.md#custom-methods-batch-and-long-running-operations"
