topic: Rate Limiting & Throttling (Client Contract)
domain: rest-api-design
topic_slug: rate-limiting-and-throttling
version: 1
questions:
- id: rate-limiting-and-throttling-001
  difficulty: beginner
  tags:
  - status-codes
  - 429
  - rfc-6585
  question: |
    Which HTTP status code is the canonical signal that a client has sent
    too many requests in a given amount of time?
  options:
  - 429 Too Many Requests
  - 403 Forbidden
  - 409 Conflict
  - 503 Service Unavailable
  answer: 0
  explanation: |
    429 Too Many Requests, defined in RFC 6585, is the standard code for a
    client exceeding a rate limit. It is a client (4xx) error but, unlike
    most 4xx codes, it is retryable after waiting.
  ref: concepts.md#429-too-many-requests
- id: rate-limiting-and-throttling-002
  difficulty: beginner
  tags:
  - retry-after
  - headers
  question: |
    What does the Retry-After header communicate on a 429 response?
  options:
  - How many requests remain in the current window
  - How long the client should wait before making a follow-up request
  - The absolute ceiling of requests allowed per minute
  - The server's current CPU utilization
  answer: 1
  explanation: |
    Retry-After (RFC 9110 §10.2.3) tells the client how long to wait before
    retrying, either as delay-seconds or an HTTP-date. It is valid on 429,
    503, and 3xx responses.
  ref: concepts.md#retry-after-header
- id: rate-limiting-and-throttling-003
  difficulty: beginner
  tags:
  - terminology
  - rate-limit
  - quota
  question: |
    Which statement best distinguishes a rate limit from a quota?
  options:
  - A rate limit caps total volume over a month; a quota caps velocity per second
  - They are two names for exactly the same thing
  - A rate limit caps velocity (e.g. per second/minute); a quota caps total volume over a longer, often
    billing-aligned window
  - A quota applies only to anonymous users; a rate limit only to authenticated users
  answer: 2
  explanation: |
    A rate limit governs how fast (velocity, short windows). A quota governs
    how much in total over a long window, usually tied to plans and billing.
  ref: concepts.md#rate-limits-vs-quotas-vs-throttling-vs-spike-arrest
- id: rate-limiting-and-throttling-004
  difficulty: beginner
  tags:
  - terminology
  - throttling
  question: |
    In the vocabulary used here, "throttling" most precisely refers to:
  options:
  - The monthly billing budget for an account
  - The number of requests remaining in the window
  - A cryptographic signature on the request
  - The enforcement action a server takes when a limit is exceeded (rejecting or delaying requests)
  answer: 3
  explanation: |
    A rate limit is a policy; throttling is the enforcement action —
    rejecting (hard) or delaying/queuing (soft) requests that exceed it.
  ref: concepts.md#rate-limits-vs-quotas-vs-throttling-vs-spike-arrest
- id: rate-limiting-and-throttling-005
  difficulty: intermediate
  tags:
  - spike-arrest
  - burst
  question: |
    How does spike arrest differ from a typical token-bucket rate limit?
  options:
  - Spike arrest smooths traffic to an even instantaneous pace and does not let a client accumulate and
    then burst unused allowance
  - Spike arrest lets a client save up unused allowance and burst; token bucket does not
  - They are identical; 'spike arrest' is just a marketing name
  - Spike arrest applies only to responses, not requests
  answer: 0
  explanation: |
    Spike arrest paces requests evenly (e.g. one per 600 ms) and does not
    allow accumulated bursts, whereas a token bucket lets unused tokens be
    spent in a burst.
  ref: concepts.md#rate-limits-vs-quotas-vs-throttling-vs-spike-arrest
- id: rate-limiting-and-throttling-006
  difficulty: intermediate
  tags:
  - fixed-window
  - burst
  - gotcha
  question: |
    A "100 requests per minute" rate limit implemented as a fixed window has
    what commonly-probed weakness?
  options:
  - It cannot be documented in OpenAPI
  - A client can send 100 in the last second of one window and 100 in the first second of the next — ~200
    in ~2 seconds
  - It requires a Unix timestamp in Retry-After
  - It always rejects the very first request
  answer: 1
  explanation: |
    Fixed windows allow boundary bursts: a client can legally send the full
    allowance at the end of one window and again at the start of the next.
    Spike arrest / sliding windows address this.
  ref: concepts.md#rate-limits-vs-quotas-vs-throttling-vs-spike-arrest
- id: rate-limiting-and-throttling-007
  difficulty: beginner
  tags:
  - 429
  - retryable
  question: |
    Why is 429 treated differently from most other 4xx status codes by a
    well-behaved client?
  options:
  - It must never be retried under any circumstances
  - It indicates the request body was malformed
  - Although it is a client error, the request is retryable after waiting rather than needing to be fixed
  - It requires the client to re-authenticate
  answer: 2
  explanation: |
    Most 4xx codes (e.g. 400) mean the request itself is wrong, so retrying
    unchanged is pointless. 429 means the request was fine but too fast, so
    it should be retried after backing off.
  ref: concepts.md#429-too-many-requests
- id: rate-limiting-and-throttling-008
  difficulty: intermediate
  tags:
  - 429
  - caching
  - rfc-6585
  question: |
    What does RFC 6585 say about caching a 429 response?
  options:
  - It MUST be stored and served to all clients for the retry window
  - It may be cached only by private caches
  - It must be cached for exactly 60 seconds
  - It MUST NOT be stored by a cache by default
  answer: 3
  explanation: |
    RFC 6585 states 429 responses must not be stored by a cache by default,
    so a shared cache does not serve one client's throttle to others.
  ref: concepts.md#429-too-many-requests
- id: rate-limiting-and-throttling-009
  difficulty: intermediate
  tags:
  - 429
  - 503
  - status-codes
  question: |
    An API gateway rejects a request because THIS particular API key has
    exceeded its per-key rate. Separately, the whole backend is overloaded
    and can serve no one. Which pairing of status codes is most appropriate?
  options:
  - Per-key exceeded → 429; global overload → 503
  - Per-key exceeded → 503; global overload → 429
  - Both should be 400 Bad Request
  - Both should be 429 Too Many Requests
  answer: 0
  explanation: |
    429 means 'you are too fast' (per-client). 503 Service Unavailable means
    'the service can't handle this right now' regardless of who is calling.
    Both may carry Retry-After.
  ref: concepts.md#429-too-many-requests
- id: rate-limiting-and-throttling-010
  difficulty: intermediate
  tags:
  - anti-pattern
  - status-codes
  question: |
    Why is returning "200 OK" with {"success": false, "error": "rate
    limited"} in the body a bad way to signal throttling?
  options:
  - It is impossible to include a JSON body with a 200 response
  - Generic HTTP tooling, retry libraries, caches, and monitoring key off the status line, so a 200 makes
    the throttle invisible to them
  - 200 responses cannot include a Retry-After header, which is required
  - It violates the OpenAPI specification's grammar
  answer: 1
  explanation: |
    The status line must reflect the outcome. Burying failure in a 200 body
    breaks caches (they cache the failure as success), monitoring, and
    standard retry logic that trigger on 429.
  ref: concepts.md#429-too-many-requests
- id: rate-limiting-and-throttling-011
  difficulty: beginner
  tags:
  - retry-after
  - formats
  question: |
    Which two value formats are valid for the Retry-After header per RFC 9110?
  options:
  - A percentage, or a fraction
  - A cron expression, or an ISO-8601 duration
  - delay-seconds (a non-negative integer), or an HTTP-date
  - Milliseconds, or nanoseconds
  answer: 2
  explanation: |
    Retry-After is either a number of seconds to wait (delay-seconds) or an
    absolute HTTP-date. Sub-second and duration formats are not used.
  ref: concepts.md#retry-after-header
- id: rate-limiting-and-throttling-012
  difficulty: intermediate
  tags:
  - retry-after
  - clock
  - trade-offs
  question: |
    Why do many rate-limiting APIs prefer delay-seconds over an HTTP-date in
    Retry-After?
  options:
  - HTTP-date is not permitted by RFC 9110
  - HTTP-date can only express times in the past
  - delay-seconds allows sub-millisecond precision
  - delay-seconds needs no client/server clock synchronization and is unambiguous
  answer: 3
  explanation: |
    delay-seconds requires no clock sync between client and server, unlike an
    absolute HTTP-date which depends on the client's clock being correct.
  ref: concepts.md#retry-after-header
- id: rate-limiting-and-throttling-013
  difficulty: advanced
  tags:
  - retry-after
  - semantics
  - gotcha
  question: |
    A conforming client receives "Retry-After: 30" on a 429. Which
    interpretation is correct?
  options:
  - 30 is a lower bound — wait at least 30 seconds, and ideally add jitter on top
  - The client must retry at exactly 30 seconds, no sooner and no later
  - 30 is the number of requests the client may now send immediately
  - The client should retry every 30 milliseconds until it succeeds
  answer: 0
  explanation: |
    Retry-After is a minimum wait, not an exact ETA. Good clients treat it as
    'wait at least this long' and add jitter so many clients don't retry at
    the same instant.
  ref: concepts.md#retry-after-header
- id: rate-limiting-and-throttling-014
  difficulty: intermediate
  tags:
  - retry-after
  - redirects
  question: |
    On which of these responses is Retry-After a valid header?
  options:
  - Only on 429
  - On 429, 503, and 3xx redirect responses
  - Only on 503
  - On any 2xx success response
  answer: 1
  explanation: |
    RFC 9110 allows Retry-After on 503 (service unavailable), 429 (too many
    requests), and 3xx redirects (to indicate when the resource will be
    available at the new location).
  ref: concepts.md#retry-after-header
- id: rate-limiting-and-throttling-015
  difficulty: intermediate
  tags:
  - ratelimit-headers
  - draft
  - structured-fields
  question: |
    The modern IETF draft "RateLimit header fields for HTTP" defines the
    client-facing limits using:
  options:
  - A single JSON body field named rateLimit
  - Three mandatory headers all prefixed with X-
  - 'Two Structured Fields: RateLimit (current standing) and RateLimit-Policy (the advertised quota)'
  - A query parameter appended to every request
  answer: 2
  explanation: |
    The modern draft defines two Structured Fields — RateLimit (current
    standing, e.g. r and t) and RateLimit-Policy (the quota, e.g. q and w) —
    rather than the older three-header approach.
  ref: concepts.md#ratelimit-and-ratelimit-policy-headers
- id: rate-limiting-and-throttling-016
  difficulty: intermediate
  tags:
  - ratelimit-headers
  - standards-status
  question: |
    What is the current standards status of the RateLimit / RateLimit-Policy
    header fields?
  options:
  - A published RFC that obsoletes RFC 6585
  - A W3C Recommendation
  - A proprietary AWS specification
  - A Standards-Track IETF Internet-Draft, not yet a published RFC
  answer: 3
  explanation: |
    The RateLimit header fields are defined in the httpapi working group's
    Standards-Track Internet-Draft (draft-ietf-httpapi-ratelimit-headers).
    It is a draft, not yet an RFC — an important accuracy point.
  ref: concepts.md#ratelimit-and-ratelimit-policy-headers
- id: rate-limiting-and-throttling-017
  difficulty: advanced
  tags:
  - ratelimit-headers
  - parsing
  - structured-fields
  question: |
    Given the response header `RateLimit: "burst";r=42;t=27`, what does it
    tell the client?
  options:
  - Against the 'burst' policy the client has 42 requests remaining, and that window resets in 27 seconds
  - 42 requests have already been used and the limit is 27
  - The client must wait 42 seconds and may then send 27 requests
  - The server has 42 policies and 27 active clients
  answer: 0
  explanation: |
    In the RateLimit field, r is the remaining/available quota and t is the
    seconds until the window resets. Here 42 remain against the 'burst'
    policy, resetting in 27 seconds.
  ref: concepts.md#ratelimit-and-ratelimit-policy-headers
- id: rate-limiting-and-throttling-018
  difficulty: intermediate
  tags:
  - ratelimit-headers
  - reset
  - delta
  question: |
    In the modern RateLimit draft, the window-reset value (t) is expressed as:
  options:
  - A Unix epoch timestamp
  - A number of seconds remaining until the window resets (a delta)
  - An ISO-8601 datetime
  - A percentage of the window elapsed
  answer: 1
  explanation: |
    The draft uses seconds-remaining (delta), aligned with Retry-After, and
    deliberately avoids Unix timestamps because they require clock
    synchronization between client and server.
  ref: concepts.md#ratelimit-and-ratelimit-policy-headers
- id: rate-limiting-and-throttling-019
  difficulty: intermediate
  tags:
  - x-ratelimit
  - legacy
  - gotcha
  question: |
    A client sees `X-RateLimit-Reset: 1719849600` from one API and
    `X-RateLimit-Reset: 30` from another. What is the safe conclusion?
  options:
  - One of the APIs is definitely violating the standard
  - Both values mean the same thing regardless of magnitude
  - The X- prefix headers are not standardized and their semantics vary per API (here one is a Unix timestamp,
    the other seconds-remaining) — you must read each API's docs
  - The larger number always means more requests remaining
  answer: 2
  explanation: |
    X-RateLimit-* headers are an informal convention, not standardized. Reset
    is a Unix timestamp on some APIs and seconds-remaining on others, so
    clients must consult each API's documentation.
  ref: concepts.md#ratelimit-and-ratelimit-policy-headers
- id: rate-limiting-and-throttling-020
  difficulty: intermediate
  tags:
  - ratelimit-headers
  - proactive
  - pacing
  question: |
    What is the main benefit of sending RateLimit headers on every response,
    including 2xx successes, rather than only on 429s?
  options:
  - It reduces the response body size
  - It is required for TLS to work
  - It disables caching automatically
  - It lets a well-behaved client see its remaining budget and pace itself so it never hits the limit
  answer: 3
  explanation: |
    Advertising remaining budget proactively (on 2xx too) lets clients
    self-throttle before being rejected, which is the point of exposing
    remaining quota.
  ref: concepts.md#ratelimit-and-ratelimit-policy-headers
- id: rate-limiting-and-throttling-021
  difficulty: beginner
  tags:
  - x-ratelimit
  - legacy-triplet
  question: |
    In the widely-used informal convention, which trio of headers advertises
    rate-limit standing?
  options:
  - X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset
  - X-Quota, X-Used, X-Left
  - Rate-Max, Rate-Now, Rate-When
  - Limit, Count, Expiry
  answer: 0
  explanation: |
    Before the IETF draft converged, most APIs shipped X-RateLimit-Limit
    (ceiling), X-RateLimit-Remaining (left in window), and X-RateLimit-Reset
    (when it resets).
  ref: concepts.md#ratelimit-and-ratelimit-policy-headers
- id: rate-limiting-and-throttling-022
  difficulty: beginner
  tags:
  - per-key
  - dimensions
  question: |
    For a typical machine-to-machine API, what is the most common dimension
    to count requests against for rate limiting?
  options:
  - The response body size
  - The API key / client ID
  - The TLS cipher suite
  - The HTTP method only
  answer: 1
  explanation: |
    Per API key / client ID is the default for M2M APIs because the key
    identifies the calling application, enabling fair per-consumer limits.
  ref: concepts.md#per-key-per-user-and-per-plan-limiting
- id: rate-limiting-and-throttling-023
  difficulty: intermediate
  tags:
  - per-ip
  - unauthenticated
  - abuse
  question: |
    Why is per-IP rate limiting weak as the SOLE limiting dimension for an
    authenticated API, even though it is cheap?
  options:
  - IP addresses cannot be read by servers
  - It requires the client to send a JWT
  - Many users behind a corporate NAT/proxy share one IP (unfairly throttled together), and attackers
    can rotate IPs to evade it
  - IP-based limits are prohibited by RFC 9110
  answer: 2
  explanation: |
    Shared NAT/proxy IPs cause collateral throttling of unrelated users,
    while attackers rotate IPs to bypass the limit. It is useful mainly for
    unauthenticated endpoints and coarse abuse mitigation.
  ref: concepts.md#per-key-per-user-and-per-plan-limiting
- id: rate-limiting-and-throttling-024
  difficulty: intermediate
  tags:
  - per-plan
  - tiers
  question: |
    In per-plan rate limiting, what varies between a Free and a Pro customer?
  options:
  - The HTTP version used
  - Whether 429 is returned at all
  - The media type of the response
  - The numeric limit value itself (e.g. Free 60/min vs Pro 1000/min), often layered on per-key counting
  answer: 3
  explanation: |
    Per-plan limiting varies the threshold by subscription tier, commonly
    layered on top of per-key counting.
  ref: concepts.md#per-key-per-user-and-per-plan-limiting
- id: rate-limiting-and-throttling-025
  difficulty: advanced
  tags:
  - layered-limits
  - bypass
  - design
  question: |
    A customer keeps creating extra API keys to get around what should be an
    account-wide cap. Which design fixes this?
  options:
  - Layer a per-account limit above the per-key limits, so total across all the account's keys is capped
  - Remove all rate limiting and rely on billing
  - Switch to per-IP limiting only
  - Return 400 instead of 429
  answer: 0
  explanation: |
    Counting only per key lets a customer multiply keys to bypass the cap. A
    per-account limit layered above the per-key limits caps aggregate usage
    regardless of key count.
  ref: concepts.md#per-key-per-user-and-per-plan-limiting
- id: rate-limiting-and-throttling-026
  difficulty: intermediate
  tags:
  - layered-limits
  - semantics
  question: |
    When several rate limits (per-IP, per-key burst, per-account monthly)
    apply to a request simultaneously, which one causes the 429?
  options:
  - Always the per-IP limit, regardless of the others
  - The request must satisfy all applicable limits; the first one it violates is the one that rejects
    it
  - Only the most generous limit is enforced
  - The limits are averaged into a single effective limit
  answer: 1
  explanation: |
    A request must satisfy every applicable limit; whichever it violates
    first produces the 429. RateLimit-Policy can advertise multiple policies
    for this reason.
  ref: concepts.md#per-key-per-user-and-per-plan-limiting
- id: rate-limiting-and-throttling-027
  difficulty: intermediate
  tags:
  - per-user
  - anonymous
  - rfc-6585
  question: |
    What does RFC 6585 specify about HOW the server identifies "the user"
    whose requests are counted?
  options:
  - It mandates counting by API key only
  - It requires an OAuth access token in every request
  - It leaves it unspecified — the server decides (credentials, API key, cookie, IP), which is why you
    must document your choice
  - It mandates counting per IP address
  answer: 2
  explanation: |
    RFC 6585 explicitly does not define how the server identifies the user or
    counts requests, so APIs must document their chosen dimension so clients
    know how to distribute load.
  ref: concepts.md#per-key-per-user-and-per-plan-limiting
- id: rate-limiting-and-throttling-028
  difficulty: beginner
  tags:
  - soft-hard
  - definitions
  question: |
    What is the defining difference between a hard limit and a soft limit?
  options:
  - A hard limit applies to GET; a soft limit applies to POST
  - A soft limit rejects requests; a hard limit only logs them
  - There is no difference; the terms are interchangeable
  - A hard limit rejects requests over the threshold (429); a soft limit allows temporary overage with
    a consequence (warning, throttling, or billing)
  answer: 3
  explanation: |
    Hard limits reject over-threshold requests outright. Soft limits allow a
    temporary overage but attach a consequence such as a warning, slowdown,
    or overage billing.
  ref: concepts.md#soft-vs-hard-limits
- id: rate-limiting-and-throttling-029
  difficulty: intermediate
  tags:
  - soft-limits
  - signaling
  - gotcha
  question: |
    A soft limit lets a client's request succeed (200) even while it is in
    overage. What must the contract still do?
  options:
  - Give the client a clear signal it is in overage (e.g. RateLimit showing r=0, or a documented warning
    header) so it isn't blindsided when enforcement kicks in
  - Nothing; silence is fine for soft limits
  - Return the data twice to signal overage
  - Switch the response to XML
  answer: 0
  explanation: |
    Without a clear signal even on a 200, the client never learns it is over
    budget until it is abruptly cut off. Soft limits need explicit signaling
    (e.g. r=0 or a warning header).
  ref: concepts.md#soft-vs-hard-limits
- id: rate-limiting-and-throttling-030
  difficulty: intermediate
  tags:
  - soft-limits
  - burst
  - token-bucket
  question: |
    How is a soft-limit "burst allowance" commonly expressed in a
    token-bucket configuration?
  options:
  - As the media type
  - As burst capacity above the sustained rate
  - As a negative Retry-After value
  - As an HTTP trailer
  answer: 1
  explanation: |
    Token buckets model a burst allowance as capacity above the sustained
    refill rate, letting a client briefly exceed the steady rate before hard
    rejection.
  ref: concepts.md#soft-vs-hard-limits
- id: rate-limiting-and-throttling-031
  difficulty: advanced
  tags:
  - soft-limits
  - billing
  - trust
  question: |
    Which practice around soft-limit overage billing is correct?
  options:
  - Charge for overage silently; disclosure confuses customers
  - Never allow any overage under any circumstances
  - Disclose overage pricing up front; silently charging for soft-limit overage is a support and trust
    disaster
  - Overage should always be free forever with no ceiling
  answer: 2
  explanation: |
    Overage billing must be disclosed in advance. Also, 'soft' is not
    'unlimited' — there is still an absolute ceiling where limits become hard
    to protect the server.
  ref: concepts.md#soft-vs-hard-limits
- id: rate-limiting-and-throttling-032
  difficulty: beginner
  tags:
  - backoff
  - client-behavior
  question: |
    When a client receives a 429 that includes a Retry-After header, what
    should a well-behaved client do first?
  options:
  - Ignore Retry-After and retry immediately
  - Fail permanently and never retry
  - Switch to a different HTTP method
  - Honor Retry-After, waiting at least that long before retrying
  answer: 3
  explanation: |
    The preferred order is: honor Retry-After if present; otherwise use
    exponential backoff; and add jitter. The server's Retry-After beats the
    client's own guess.
  ref: concepts.md#client-backoff-and-jitter-expectations
- id: rate-limiting-and-throttling-033
  difficulty: intermediate
  tags:
  - backoff
  - exponential
  - jitter
  question: |
    Why should clients add jitter (randomness) to their retry backoff instead
    of using plain exponential backoff?
  options:
  - Without jitter, many clients throttled at the same moment retry in lockstep and keep re-colliding
    (thundering herd); jitter spreads retries out
  - Jitter makes each request smaller on the wire
  - Jitter is required by RFC 6585 for every request
  - Jitter guarantees the retry always succeeds on the first try
  answer: 0
  explanation: |
    Deterministic backoff synchronizes clients that failed together, causing
    repeated collisions. Randomized (jittered) delays spread retries and
    reduce contention.
  ref: concepts.md#client-backoff-and-jitter-expectations
- id: rate-limiting-and-throttling-034
  difficulty: advanced
  tags:
  - full-jitter
  - aws
  - backoff
  question: |
    In AWS's well-known "full jitter" backoff, how is the sleep time computed
    for a given attempt?
  options:
  - Exactly base * 2^attempt with no randomness
  - A random value uniformly in [0, min(cap, base * 2^attempt)]
  - Always the maximum cap value
  - A fixed 1 second regardless of attempt
  answer: 1
  explanation: |
    Full jitter picks a random wait uniformly between 0 and the capped
    exponential value, which AWS's analysis showed reduces contention and
    completes work faster than plain exponential backoff.
  ref: concepts.md#client-backoff-and-jitter-expectations
- id: rate-limiting-and-throttling-035
  difficulty: advanced
  tags:
  - retry
  - idempotency
  - safety
  question: |
    Which requests is it safe for a client to retry automatically after a
    429, without extra safeguards?
  options:
  - Any request, since 429 means the server did nothing
  - Only requests larger than 1 MB
  - Only idempotent/safe requests (or non-idempotent ones protected by an idempotency key), so a retried
    POST doesn't double-charge
  - Only requests using HTTP/2
  answer: 2
  explanation: |
    A 429 may still have side effects in some designs, and auto-retrying a
    non-idempotent POST can duplicate an action. Retry idempotent/safe
    requests, or use an idempotency key for the rest.
  ref: concepts.md#client-backoff-and-jitter-expectations
- id: rate-limiting-and-throttling-036
  difficulty: intermediate
  tags:
  - retry
  - caps
  - resilience
  question: |
    Why should a retrying client cap both the number of attempts and total
    elapsed time?
  options:
  - To comply with the JSON specification
  - Because HTTP forbids more than three requests per connection
  - To reduce the size of the Retry-After header
  - Because unbounded retries can turn a transient blip into an outage and may get the client banned
  answer: 3
  explanation: |
    Infinite retries amplify load during an incident and can trip abuse
    detection. Bounded attempts and a total time budget keep retry behavior
    safe.
  ref: concepts.md#client-backoff-and-jitter-expectations
- id: rate-limiting-and-throttling-037
  difficulty: advanced
  tags:
  - retry-after
  - jitter
  - herd
  question: |
    A server returns a FIXED "Retry-After: 60" to every throttled client and
    the clients do exactly what it says with no jitter. What problem arises?
  options:
  - All clients wake and retry at the same second, recreating the thundering herd — so jitter is still
    a client responsibility even when the server sets the base delay
  - Nothing; this is the ideal behavior
  - The clients will never retry at all
  - The server will be forced to switch to HTTP-date format
  answer: 0
  explanation: |
    A fixed server delay plus no client jitter synchronizes every client to
    retry simultaneously. Jitter must be layered on top even when the server
    dictates the base delay.
  ref: concepts.md#client-backoff-and-jitter-expectations
- id: rate-limiting-and-throttling-038
  difficulty: beginner
  tags:
  - documentation
  - discoverability
  question: |
    When documenting an API's rate limits, which set of facts is most
    important to state explicitly?
  options:
  - The server's programming language and framework version
  - The numeric limits, the window, and the key/dimension they apply to (e.g. 100/min per API key; 1M/month
    per account)
  - The internal database schema
  - The names of the on-call engineers
  answer: 1
  explanation: |
    Clients need the numbers, the window, and the dimension (per key, per
    account, etc.) to build correct pacing. The 429 body shape and header
    semantics should be documented too.
  ref: concepts.md#documenting-limits-and-graceful-degradation
- id: rate-limiting-and-throttling-039
  difficulty: intermediate
  tags:
  - openapi
  - documentation
  - 429
  question: |
    How should rate-limit response headers (Retry-After, RateLimit) be made
    visible to consumers of an OpenAPI 3.1 spec?
  options:
  - They cannot be described in OpenAPI at all
  - By hardcoding them into every operation's summary text
  - By declaring them under the 429 response's `headers` object, so generated docs and SDKs surface them
  - Only in a separate PDF, never in the spec
  answer: 2
  explanation: |
    OpenAPI lets you describe response headers under a response's headers
    object; documenting Retry-After and RateLimit there makes them show up in
    generated docs and client SDKs.
  ref: concepts.md#documenting-limits-and-graceful-degradation
- id: rate-limiting-and-throttling-040
  difficulty: intermediate
  tags:
  - graceful-degradation
  - priority
  question: |
    As part of graceful degradation under load, which traffic should
    typically be shed first?
  options:
  - Interactive user-facing requests, before batch/analytics jobs
  - All traffic equally and simultaneously
  - Only requests that use caching
  - Low-priority traffic (e.g. batch/analytics) before interactive user requests
  answer: 3
  explanation: |
    Priority-based throttling sheds low-priority traffic (batch, analytics)
    first, preserving interactive user-facing requests as long as possible.
  ref: concepts.md#documenting-limits-and-graceful-degradation
- id: rate-limiting-and-throttling-041
  difficulty: intermediate
  tags:
  - graceful-degradation
  - design
  question: |
    Which of the following is an example of graceful degradation rather than
    a plain hard 429?
  options:
  - Serving cached/stale data or partial results and disabling expensive personalization instead of blanket-rejecting
    requests
  - Resetting the TCP connection with no response
  - Returning 500 with an empty body
  - Silently dropping every request
  answer: 0
  explanation: |
    Graceful degradation means degrading features (stale data, partial
    results, disabled personalization) rather than failing everything. It is
    a design choice distinct from hard rejection.
  ref: concepts.md#documenting-limits-and-graceful-degradation
- id: rate-limiting-and-throttling-042
  difficulty: advanced
  tags:
  - graceful-degradation
  - distinction
  question: |
    An API's only behavior at the limit is to hard-429 every excess request.
    What is the accurate characterization?
  options:
  - It has both rate limiting and graceful degradation
  - It has rate limiting but not graceful degradation — degradation is a separate, deliberate design choice
  - It has graceful degradation but no rate limiting
  - Hard-429 is prohibited by RFC 9110
  answer: 1
  explanation: |
    Rate limiting and graceful degradation are separate concerns. Hard-429ing
    everything is rate limiting; degrading gracefully (shedding by priority,
    serving stale data) is an additional design decision.
  ref: concepts.md#documenting-limits-and-graceful-degradation
- id: rate-limiting-and-throttling-043
  difficulty: intermediate
  tags:
  - problem-details
  - 429
  - rfc-9457
  question: |
    What is the recommended response body format for a 429, to keep errors
    consistent and machine-readable?
  options:
  - A bare HTML error page
  - An empty body with only headers
  - An RFC 9457 problem document with media type application/problem+json
  - A plain-text stack trace
  answer: 2
  explanation: |
    Using RFC 9457 (application/problem+json) for the 429 body keeps the
    error contract consistent and machine-readable, the same as other API
    errors.
  ref: concepts.md#documenting-limits-and-graceful-degradation
- id: rate-limiting-and-throttling-044
  difficulty: intermediate
  tags:
  - distinction
  - algorithm
  - altitude
  question: |
    Where does the choice of token bucket vs leaky bucket vs sliding window
    properly belong, relative to the client contract?
  options:
  - It is part of the client-facing contract and must be exposed in headers
  - It must be sent to the client in the Retry-After header
  - It is defined by RFC 6585 as a required header
  - It is the server-internal algorithm (system-design altitude); the client contract only exposes codes,
    headers, and semantics
  answer: 3
  explanation: |
    The algorithm is how the server internally decides allow/deny (system
    design). The contract is what the client observes — status codes,
    Retry-After, RateLimit headers — independent of the algorithm.
  ref: concepts.md#distinction-from-the-rate-limiter-algorithm
- id: rate-limiting-and-throttling-045
  difficulty: advanced
  tags:
  - distinction
  - stability
  - evolution
  question: |
    The server switches its internal limiter from a fixed window to a sliding
    window. What must remain true for clients to be unaffected?
  options:
  - The client contract (status codes, headers, and their semantics) must stay stable
  - Clients must upgrade their SDK for every algorithm change
  - The API must switch from JSON to XML
  - The Retry-After header must be removed
  answer: 0
  explanation: |
    Clients code against the contract, not the algorithm. As long as codes,
    headers, and semantics remain stable, the server can change the internal
    algorithm freely.
  ref: concepts.md#distinction-from-the-rate-limiter-algorithm
- id: rate-limiting-and-throttling-046
  difficulty: advanced
  tags:
  - distinction
  - burst
  - observable
  question: |
    In what way can the internal algorithm legitimately "leak" into the
    client contract?
  options:
  - The client must always know the exact bucket refill rate
  - Observable burst behavior — e.g. whether a client can spend a saved-up burst — should be documented,
    since a token bucket and a leaky bucket differ observably even at the same nominal rate
  - The contract must expose the Redis keys used to store counters
  - It never leaks; the algorithm is fully invisible
  answer: 1
  explanation: |
    Burst behavior is observable: a token bucket allows saved-up bursts, a
    leaky bucket/spike arrest does not. The contract should describe such
    observable behavior even while hiding the implementation.
  ref: concepts.md#distinction-from-the-rate-limiter-algorithm
- id: rate-limiting-and-throttling-047
  difficulty: intermediate
  tags:
  - owasp
  - security
  - quota
  question: |
    Which OWASP API Security Top 10 (2023) category most directly motivates
    rate limiting and quotas as a security control?
  options:
  - Broken Object Level Authorization
  - Security Misconfiguration
  - Unrestricted Resource Consumption (API4:2023)
  - Server Side Request Forgery
  answer: 2
  explanation: |
    API4:2023 Unrestricted Resource Consumption covers the risk of clients
    consuming excessive resources; rate limits and quotas are the primary
    mitigations.
  ref: concepts.md#documenting-limits-and-graceful-degradation
- id: rate-limiting-and-throttling-048
  difficulty: beginner
  tags:
  - ratelimit-policy
  - quota
  - window
  question: |
    In the RateLimit-Policy field `RateLimit-Policy: "daily";q=1000;w=86400`,
    what do q and w represent?
  options:
  - q = requests already used; w = weekday number
  - q = queue depth; w = wait time
  - q = quality score; w = weight
  - q = quota allocated (1000); w = the time window in seconds (86400 = one day)
  answer: 3
  explanation: |
    In RateLimit-Policy, q is the quota allocated for the policy and w is the
    window length in seconds. Here it advertises 1000 requests per 86400 s
    (one day).
  ref: concepts.md#ratelimit-and-ratelimit-policy-headers
- id: rate-limiting-and-throttling-049
  difficulty: intermediate
  tags:
  - ratelimit-headers
  - reliability
  - gotcha
  question: |
    Why should a client treat a RateLimit "remaining" value as a hint rather
    than a hard guarantee?
  options:
  - Because other keys sharing a limit, policy changes, or eventual consistency in a distributed limiter
    can make the remaining value jump unexpectedly
  - Because it is always encrypted and unreadable
  - Because RFC 6585 forbids acting on it
  - Because it is only sent once per day
  answer: 0
  explanation: |
    RateLimit headers are informational hints. Shared limits, policy changes,
    and distributed-limiter consistency mean the remaining count can change
    unpredictably; clients shouldn't treat it as an exact guarantee.
  ref: concepts.md#ratelimit-and-ratelimit-policy-headers
- id: rate-limiting-and-throttling-050
  difficulty: intermediate
  tags:
  - 503
  - retry-after
  - overload
  question: |
    A backend is temporarily overloaded for ALL callers and wants clients to
    retry in about 2 minutes. Which response is most appropriate?
  options:
  - 429 Too Many Requests with no Retry-After
  - '503 Service Unavailable with Retry-After: 120'
  - 200 OK with an error message in the body
  - '403 Forbidden with Retry-After: 120'
  answer: 1
  explanation: |
    Global overload affecting everyone is 503 Service Unavailable, and
    Retry-After: 120 tells clients to wait ~2 minutes. 429 would wrongly
    imply the specific client was too fast.
  ref: concepts.md#429-too-many-requests
