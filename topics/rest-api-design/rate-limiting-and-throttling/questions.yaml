topic: Rate Limiting & Throttling (Client Contract)
domain: rest-api-design
topic_slug: rate-limiting-and-throttling
version: 1
questions:
- id: rate-limiting-and-throttling-001
  difficulty: beginner
  tags:
  - status-codes
  - 429
  - rfc-6585
  question: |
    Which HTTP status code is the canonical signal that a client has sent
    too many requests in a given amount of time?
  options:
  - 429 Too Many Requests
  - 403 Forbidden
  - 409 Conflict
  - 503 Service Unavailable
  answer: 0
  explanation: |
    429 Too Many Requests, defined in RFC 6585, is the standard code for a
    client exceeding a rate limit. It is a client (4xx) error but, unlike
    most 4xx codes, it is retryable after waiting.
  ref: concepts.md#429-too-many-requests
- id: rate-limiting-and-throttling-002
  difficulty: beginner
  tags:
  - retry-after
  - headers
  question: |
    What does the Retry-After header communicate on a 429 response?
  options:
  - How many requests remain in the current window
  - How long the client should wait before making a follow-up request
  - The absolute ceiling of requests allowed per minute
  - The server's current CPU utilization
  answer: 1
  explanation: |
    Retry-After (RFC 9110 §10.2.3) tells the client how long to wait before
    retrying, either as delay-seconds or an HTTP-date. It is valid on 429,
    503, and 3xx responses.
  ref: concepts.md#retry-after-header
- id: rate-limiting-and-throttling-003
  difficulty: beginner
  tags:
  - terminology
  - rate-limit
  - quota
  question: |
    Which statement best distinguishes a rate limit from a quota?
  options:
  - A rate limit caps total volume over a month; a quota caps velocity per second
  - They are two names for exactly the same thing
  - A rate limit caps velocity (e.g. per second/minute); a quota caps total volume over a longer, often
    billing-aligned window
  - A quota applies only to anonymous users; a rate limit only to authenticated users
  answer: 2
  explanation: |
    A rate limit governs how fast (velocity, short windows). A quota governs
    how much in total over a long window, usually tied to plans and billing.
  ref: concepts.md#rate-limits-vs-quotas-vs-throttling-vs-spike-arrest
- id: rate-limiting-and-throttling-004
  difficulty: beginner
  tags:
  - terminology
  - throttling
  question: |
    In the vocabulary used here, "throttling" most precisely refers to:
  options:
  - The monthly billing budget for an account
  - The number of requests remaining in the window
  - A cryptographic signature on the request
  - The enforcement action a server takes when a limit is exceeded (rejecting or delaying requests)
  answer: 3
  explanation: |
    A rate limit is a policy; throttling is the enforcement action —
    rejecting (hard) or delaying/queuing (soft) requests that exceed it.
  ref: concepts.md#rate-limits-vs-quotas-vs-throttling-vs-spike-arrest
- id: rate-limiting-and-throttling-005
  difficulty: intermediate
  tags:
  - spike-arrest
  - burst
  question: |
    How does spike arrest differ from a typical token-bucket rate limit?
  options:
  - Spike arrest smooths traffic to an even instantaneous pace and does not let a client accumulate and
    then burst unused allowance
  - Spike arrest lets a client save up unused allowance and burst; token bucket does not
  - They are identical; 'spike arrest' is just a marketing name
  - Spike arrest applies only to responses, not requests
  answer: 0
  explanation: |
    Spike arrest paces requests evenly (e.g. one per 600 ms) and does not
    allow accumulated bursts, whereas a token bucket lets unused tokens be
    spent in a burst.
  ref: concepts.md#rate-limits-vs-quotas-vs-throttling-vs-spike-arrest
- id: rate-limiting-and-throttling-006
  difficulty: intermediate
  tags:
  - fixed-window
  - burst
  - gotcha
  question: |
    A "100 requests per minute" rate limit implemented as a fixed window has
    what commonly-probed weakness?
  options:
  - It cannot be documented in OpenAPI
  - A client can send 100 in the last second of one window and 100 in the first second of the next — ~200
    in ~2 seconds
  - It requires a Unix timestamp in Retry-After
  - It always rejects the very first request
  answer: 1
  explanation: |
    Fixed windows allow boundary bursts: a client can legally send the full
    allowance at the end of one window and again at the start of the next.
    Spike arrest / sliding windows address this.
  ref: concepts.md#rate-limits-vs-quotas-vs-throttling-vs-spike-arrest
- id: rate-limiting-and-throttling-007
  difficulty: beginner
  tags:
  - 429
  - retryable
  question: |
    Why is 429 treated differently from most other 4xx status codes by a
    well-behaved client?
  options:
  - It must never be retried under any circumstances
  - It indicates the request body was malformed
  - Although it is a client error, the request is retryable after waiting rather than needing to be fixed
  - It requires the client to re-authenticate
  answer: 2
  explanation: |
    Most 4xx codes (e.g. 400) mean the request itself is wrong, so retrying
    unchanged is pointless. 429 means the request was fine but too fast, so
    it should be retried after backing off.
  ref: concepts.md#429-too-many-requests
- id: rate-limiting-and-throttling-008
  difficulty: intermediate
  tags:
  - 429
  - caching
  - rfc-6585
  question: |
    What does RFC 6585 say about caching a 429 response?
  options:
  - It MUST be stored and served to all clients for the retry window
  - It may be cached only by private caches
  - It must be cached for exactly 60 seconds
  - It MUST NOT be stored by a cache by default
  answer: 3
  explanation: |
    RFC 6585 states 429 responses must not be stored by a cache by default,
    so a shared cache does not serve one client's throttle to others.
  ref: concepts.md#429-too-many-requests
- id: rate-limiting-and-throttling-009
  difficulty: intermediate
  tags:
  - 429
  - 503
  - status-codes
  question: |
    An API gateway rejects a request because THIS particular API key has
    exceeded its per-key rate. Separately, the whole backend is overloaded
    and can serve no one. Which pairing of status codes is most appropriate?
  options:
  - Per-key exceeded → 429; global overload → 503
  - Per-key exceeded → 503; global overload → 429
  - Both should be 400 Bad Request
  - Both should be 429 Too Many Requests
  answer: 0
  explanation: |
    429 means 'you are too fast' (per-client). 503 Service Unavailable means
    'the service can't handle this right now' regardless of who is calling.
    Both may carry Retry-After.
  ref: concepts.md#429-too-many-requests
- id: rate-limiting-and-throttling-010
  difficulty: intermediate
  tags:
  - anti-pattern
  - status-codes
  question: |
    Why is returning "200 OK" with {"success": false, "error": "rate
    limited"} in the body a bad way to signal throttling?
  options:
  - It is impossible to include a JSON body with a 200 response
  - Generic HTTP tooling, retry libraries, caches, and monitoring key off the status line, so a 200 makes
    the throttle invisible to them
  - 200 responses cannot include a Retry-After header, which is required
  - It violates the OpenAPI specification's grammar
  answer: 1
  explanation: |
    The status line must reflect the outcome. Burying failure in a 200 body
    breaks caches (they cache the failure as success), monitoring, and
    standard retry logic that trigger on 429.
  ref: concepts.md#429-too-many-requests
- id: rate-limiting-and-throttling-011
  difficulty: beginner
  tags:
  - retry-after
  - formats
  question: |
    Which two value formats are valid for the Retry-After header per RFC 9110?
  options:
  - A percentage, or a fraction
  - A cron expression, or an ISO-8601 duration
  - delay-seconds (a non-negative integer), or an HTTP-date
  - Milliseconds, or nanoseconds
  answer: 2
  explanation: |
    Retry-After is either a number of seconds to wait (delay-seconds) or an
    absolute HTTP-date. Sub-second and duration formats are not used.
  ref: concepts.md#retry-after-header
- id: rate-limiting-and-throttling-012
  difficulty: intermediate
  tags:
  - retry-after
  - clock
  - trade-offs
  question: |
    Why do many rate-limiting APIs prefer delay-seconds over an HTTP-date in
    Retry-After?
  options:
  - HTTP-date is not permitted by RFC 9110
  - HTTP-date can only express times in the past
  - delay-seconds allows sub-millisecond precision
  - delay-seconds needs no client/server clock synchronization and is unambiguous
  answer: 3
  explanation: |
    delay-seconds requires no clock sync between client and server, unlike an
    absolute HTTP-date which depends on the client's clock being correct.
  ref: concepts.md#retry-after-header
- id: rate-limiting-and-throttling-013
  difficulty: advanced
  tags:
  - retry-after
  - semantics
  - gotcha
  question: |
    A conforming client receives "Retry-After: 30" on a 429. Which
    interpretation is correct?
  options:
  - 30 is a lower bound — wait at least 30 seconds, and ideally add jitter on top
  - The client must retry at exactly 30 seconds, no sooner and no later
  - 30 is the number of requests the client may now send immediately
  - The client should retry every 30 milliseconds until it succeeds
  answer: 0
  explanation: |
    Retry-After is a minimum wait, not an exact ETA. Good clients treat it as
    'wait at least this long' and add jitter so many clients don't retry at
    the same instant.
  ref: concepts.md#retry-after-header
- id: rate-limiting-and-throttling-014
  difficulty: intermediate
  tags:
  - retry-after
  - redirects
  question: |
    On which of these responses is Retry-After a valid header?
  options:
  - Only on 429
  - On 429, 503, and 3xx redirect responses
  - Only on 503
  - On any 2xx success response
  answer: 1
  explanation: |
    RFC 9110 allows Retry-After on 503 (service unavailable), 429 (too many
    requests), and 3xx redirects (to indicate when the resource will be
    available at the new location).
  ref: concepts.md#retry-after-header
- id: rate-limiting-and-throttling-015
  difficulty: intermediate
  tags:
  - ratelimit-headers
  - draft
  - structured-fields
  question: |
    The modern IETF draft "RateLimit header fields for HTTP" defines the
    client-facing limits using:
  options:
  - A single JSON body field named rateLimit
  - Three mandatory headers all prefixed with X-
  - 'Two Structured Fields: RateLimit (current standing) and RateLimit-Policy (the advertised quota)'
  - A query parameter appended to every request
  answer: 2
  explanation: |
    The modern draft defines two Structured Fields — RateLimit (current
    standing, e.g. r and t) and RateLimit-Policy (the quota, e.g. q and w) —
    rather than the older three-header approach.
  ref: concepts.md#ratelimit-and-ratelimit-policy-headers
- id: rate-limiting-and-throttling-016
  difficulty: intermediate
  tags:
  - ratelimit-headers
  - standards-status
  question: |
    What is the current standards status of the RateLimit / RateLimit-Policy
    header fields?
  options:
  - A published RFC that obsoletes RFC 6585
  - A W3C Recommendation
  - A proprietary AWS specification
  - A Standards-Track IETF Internet-Draft, not yet a published RFC
  answer: 3
  explanation: |
    The RateLimit header fields are defined in the httpapi working group's
    Standards-Track Internet-Draft (draft-ietf-httpapi-ratelimit-headers).
    It is a draft, not yet an RFC — an important accuracy point.
  ref: concepts.md#ratelimit-and-ratelimit-policy-headers
- id: rate-limiting-and-throttling-017
  difficulty: advanced
  tags:
  - ratelimit-headers
  - parsing
  - structured-fields
  question: |
    Given the response header `RateLimit: "burst";r=42;t=27`, what does it
    tell the client?
  options:
  - Against the 'burst' policy the client has 42 requests remaining, and that window resets in 27 seconds
  - 42 requests have already been used and the limit is 27
  - The client must wait 42 seconds and may then send 27 requests
  - The server has 42 policies and 27 active clients
  answer: 0
  explanation: |
    In the RateLimit field, r is the remaining/available quota and t is the
    seconds until the window resets. Here 42 remain against the 'burst'
    policy, resetting in 27 seconds.
  ref: concepts.md#ratelimit-and-ratelimit-policy-headers
- id: rate-limiting-and-throttling-018
  difficulty: intermediate
  tags:
  - ratelimit-headers
  - reset
  - delta
  question: |
    In the modern RateLimit draft, the window-reset value (t) is expressed as:
  options:
  - A Unix epoch timestamp
  - A number of seconds remaining until the window resets (a delta)
  - An ISO-8601 datetime
  - A percentage of the window elapsed
  answer: 1
  explanation: |
    The draft uses seconds-remaining (delta), aligned with Retry-After, and
    deliberately avoids Unix timestamps because they require clock
    synchronization between client and server.
  ref: concepts.md#ratelimit-and-ratelimit-policy-headers
- id: rate-limiting-and-throttling-019
  difficulty: intermediate
  tags:
  - x-ratelimit
  - legacy
  - gotcha
  question: |
    A client sees `X-RateLimit-Reset: 1719849600` from one API and
    `X-RateLimit-Reset: 30` from another. What is the safe conclusion?
  options:
  - One of the APIs is definitely violating the standard
  - Both values mean the same thing regardless of magnitude
  - The X- prefix headers are not standardized and their semantics vary per API (here one is a Unix timestamp,
    the other seconds-remaining) — you must read each API's docs
  - The larger number always means more requests remaining
  answer: 2
  explanation: |
    X-RateLimit-* headers are an informal convention, not standardized. Reset
    is a Unix timestamp on some APIs and seconds-remaining on others, so
    clients must consult each API's documentation.
  ref: concepts.md#ratelimit-and-ratelimit-policy-headers
- id: rate-limiting-and-throttling-020
  difficulty: intermediate
  tags:
  - ratelimit-headers
  - proactive
  - pacing
  question: |
    What is the main benefit of sending RateLimit headers on every response,
    including 2xx successes, rather than only on 429s?
  options:
  - It reduces the response body size
  - It is required for TLS to work
  - It disables caching automatically
  - It lets a well-behaved client see its remaining budget and pace itself so it never hits the limit
  answer: 3
  explanation: |
    Advertising remaining budget proactively (on 2xx too) lets clients
    self-throttle before being rejected, which is the point of exposing
    remaining quota.
  ref: concepts.md#ratelimit-and-ratelimit-policy-headers
- id: rate-limiting-and-throttling-021
  difficulty: beginner
  tags:
  - x-ratelimit
  - legacy-triplet
  question: |
    In the widely-used informal convention, which trio of headers advertises
    rate-limit standing?
  options:
  - X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset
  - X-Quota, X-Used, X-Left
  - Rate-Max, Rate-Now, Rate-When
  - Limit, Count, Expiry
  answer: 0
  explanation: |
    Before the IETF draft converged, most APIs shipped X-RateLimit-Limit
    (ceiling), X-RateLimit-Remaining (left in window), and X-RateLimit-Reset
    (when it resets).
  ref: concepts.md#ratelimit-and-ratelimit-policy-headers
- id: rate-limiting-and-throttling-022
  difficulty: beginner
  tags:
  - per-key
  - dimensions
  question: |
    For a typical machine-to-machine API, what is the most common dimension
    to count requests against for rate limiting?
  options:
  - The response body size
  - The API key / client ID
  - The TLS cipher suite
  - The HTTP method only
  answer: 1
  explanation: |
    Per API key / client ID is the default for M2M APIs because the key
    identifies the calling application, enabling fair per-consumer limits.
  ref: concepts.md#per-key-per-user-and-per-plan-limiting
- id: rate-limiting-and-throttling-023
  difficulty: intermediate
  tags:
  - per-ip
  - unauthenticated
  - abuse
  question: |
    Why is per-IP rate limiting weak as the SOLE limiting dimension for an
    authenticated API, even though it is cheap?
  options:
  - IP addresses cannot be read by servers
  - It requires the client to send a JWT
  - Many users behind a corporate NAT/proxy share one IP (unfairly throttled together), and attackers
    can rotate IPs to evade it
  - IP-based limits are prohibited by RFC 9110
  answer: 2
  explanation: |
    Shared NAT/proxy IPs cause collateral throttling of unrelated users,
    while attackers rotate IPs to bypass the limit. It is useful mainly for
    unauthenticated endpoints and coarse abuse mitigation.
  ref: concepts.md#per-key-per-user-and-per-plan-limiting
- id: rate-limiting-and-throttling-024
  difficulty: intermediate
  tags:
  - per-plan
  - tiers
  question: |
    In per-plan rate limiting, what varies between a Free and a Pro customer?
  options:
  - The HTTP version used
  - Whether 429 is returned at all
  - The media type of the response
  - The numeric limit value itself (e.g. Free 60/min vs Pro 1000/min), often layered on per-key counting
  answer: 3
  explanation: |
    Per-plan limiting varies the threshold by subscription tier, commonly
    layered on top of per-key counting.
  ref: concepts.md#per-key-per-user-and-per-plan-limiting
- id: rate-limiting-and-throttling-025
  difficulty: advanced
  tags:
  - layered-limits
  - bypass
  - design
  question: |
    A customer keeps creating extra API keys to get around what should be an
    account-wide cap. Which design fixes this?
  options:
  - Layer a per-account limit above the per-key limits, so total across all the account's keys is capped
  - Remove all rate limiting and rely on billing
  - Switch to per-IP limiting only
  - Return 400 instead of 429
  answer: 0
  explanation: |
    Counting only per key lets a customer multiply keys to bypass the cap. A
    per-account limit layered above the per-key limits caps aggregate usage
    regardless of key count.
  ref: concepts.md#per-key-per-user-and-per-plan-limiting
- id: rate-limiting-and-throttling-026
  difficulty: intermediate
  tags:
  - layered-limits
  - semantics
  question: |
    When several rate limits (per-IP, per-key burst, per-account monthly)
    apply to a request simultaneously, which one causes the 429?
  options:
  - Always the per-IP limit, regardless of the others
  - The request must satisfy all applicable limits; the first one it violates is the one that rejects
    it
  - Only the most generous limit is enforced
  - The limits are averaged into a single effective limit
  answer: 1
  explanation: |
    A request must satisfy every applicable limit; whichever it violates
    first produces the 429. RateLimit-Policy can advertise multiple policies
    for this reason.
  ref: concepts.md#per-key-per-user-and-per-plan-limiting
- id: rate-limiting-and-throttling-027
  difficulty: intermediate
  tags:
  - per-user
  - anonymous
  - rfc-6585
  question: |
    What does RFC 6585 specify about HOW the server identifies "the user"
    whose requests are counted?
  options:
  - It mandates counting by API key only
  - It requires an OAuth access token in every request
  - It leaves it unspecified — the server decides (credentials, API key, cookie, IP), which is why you
    must document your choice
  - It mandates counting per IP address
  answer: 2
  explanation: |
    RFC 6585 explicitly does not define how the server identifies the user or
    counts requests, so APIs must document their chosen dimension so clients
    know how to distribute load.
  ref: concepts.md#per-key-per-user-and-per-plan-limiting
- id: rate-limiting-and-throttling-028
  difficulty: beginner
  tags:
  - soft-hard
  - definitions
  question: |
    What is the defining difference between a hard limit and a soft limit?
  options:
  - A hard limit applies to GET; a soft limit applies to POST
  - A soft limit rejects requests; a hard limit only logs them
  - There is no difference; the terms are interchangeable
  - A hard limit rejects requests over the threshold (429); a soft limit allows temporary overage with
    a consequence (warning, throttling, or billing)
  answer: 3
  explanation: |
    Hard limits reject over-threshold requests outright. Soft limits allow a
    temporary overage but attach a consequence such as a warning, slowdown,
    or overage billing.
  ref: concepts.md#soft-vs-hard-limits
- id: rate-limiting-and-throttling-029
  difficulty: intermediate
  tags:
  - soft-limits
  - signaling
  - gotcha
  question: |
    A soft limit lets a client's request succeed (200) even while it is in
    overage. What must the contract still do?
  options:
  - Give the client a clear signal it is in overage (e.g. RateLimit showing r=0, or a documented warning
    header) so it isn't blindsided when enforcement kicks in
  - Nothing; silence is fine for soft limits
  - Return the data twice to signal overage
  - Switch the response to XML
  answer: 0
  explanation: |
    Without a clear signal even on a 200, the client never learns it is over
    budget until it is abruptly cut off. Soft limits need explicit signaling
    (e.g. r=0 or a warning header).
  ref: concepts.md#soft-vs-hard-limits
- id: rate-limiting-and-throttling-030
  difficulty: intermediate
  tags:
  - soft-limits
  - burst
  - token-bucket
  question: |
    How is a soft-limit "burst allowance" commonly expressed in a
    token-bucket configuration?
  options:
  - As the media type
  - As burst capacity above the sustained rate
  - As a negative Retry-After value
  - As an HTTP trailer
  answer: 1
  explanation: |
    Token buckets model a burst allowance as capacity above the sustained
    refill rate, letting a client briefly exceed the steady rate before hard
    rejection.
  ref: concepts.md#soft-vs-hard-limits
- id: rate-limiting-and-throttling-031
  difficulty: advanced
  tags:
  - soft-limits
  - billing
  - trust
  question: |
    Which practice around soft-limit overage billing is correct?
  options:
  - Charge for overage silently; disclosure confuses customers
  - Never allow any overage under any circumstances
  - Disclose overage pricing up front; silently charging for soft-limit overage is a support and trust
    disaster
  - Overage should always be free forever with no ceiling
  answer: 2
  explanation: |
    Overage billing must be disclosed in advance. Also, 'soft' is not
    'unlimited' — there is still an absolute ceiling where limits become hard
    to protect the server.
  ref: concepts.md#soft-vs-hard-limits
- id: rate-limiting-and-throttling-032
  difficulty: beginner
  tags:
  - backoff
  - client-behavior
  question: |
    When a client receives a 429 that includes a Retry-After header, what
    should a well-behaved client do first?
  options:
  - Ignore Retry-After and retry immediately
  - Fail permanently and never retry
  - Switch to a different HTTP method
  - Honor Retry-After, waiting at least that long before retrying
  answer: 3
  explanation: |
    The preferred order is: honor Retry-After if present; otherwise use
    exponential backoff; and add jitter. The server's Retry-After beats the
    client's own guess.
  ref: concepts.md#client-backoff-and-jitter-expectations
- id: rate-limiting-and-throttling-033
  difficulty: intermediate
  tags:
  - backoff
  - exponential
  - jitter
  question: |
    Why should clients add jitter (randomness) to their retry backoff instead
    of using plain exponential backoff?
  options:
  - Without jitter, many clients throttled at the same moment retry in lockstep and keep re-colliding
    (thundering herd); jitter spreads retries out
  - Jitter makes each request smaller on the wire
  - Jitter is required by RFC 6585 for every request
  - Jitter guarantees the retry always succeeds on the first try
  answer: 0
  explanation: |
    Deterministic backoff synchronizes clients that failed together, causing
    repeated collisions. Randomized (jittered) delays spread retries and
    reduce contention.
  ref: concepts.md#client-backoff-and-jitter-expectations
- id: rate-limiting-and-throttling-034
  difficulty: advanced
  tags:
  - full-jitter
  - aws
  - backoff
  question: |
    In AWS's well-known "full jitter" backoff, how is the sleep time computed
    for a given attempt?
  options:
  - Exactly base * 2^attempt with no randomness
  - A random value uniformly in [0, min(cap, base * 2^attempt)]
  - Always the maximum cap value
  - A fixed 1 second regardless of attempt
  answer: 1
  explanation: |
    Full jitter picks a random wait uniformly between 0 and the capped
    exponential value, which AWS's analysis showed reduces contention and
    completes work faster than plain exponential backoff.
  ref: concepts.md#client-backoff-and-jitter-expectations
- id: rate-limiting-and-throttling-035
  difficulty: advanced
  tags:
  - retry
  - idempotency
  - safety
  question: |
    Which requests is it safe for a client to retry automatically after a
    429, without extra safeguards?
  options:
  - Any request, since 429 means the server did nothing
  - Only requests larger than 1 MB
  - Only idempotent/safe requests (or non-idempotent ones protected by an idempotency key), so a retried
    POST doesn't double-charge
  - Only requests using HTTP/2
  answer: 2
  explanation: |
    A 429 may still have side effects in some designs, and auto-retrying a
    non-idempotent POST can duplicate an action. Retry idempotent/safe
    requests, or use an idempotency key for the rest.
  ref: concepts.md#client-backoff-and-jitter-expectations
- id: rate-limiting-and-throttling-036
  difficulty: intermediate
  tags:
  - retry
  - caps
  - resilience
  question: |
    Why should a retrying client cap both the number of attempts and total
    elapsed time?
  options:
  - To comply with the JSON specification
  - Because HTTP forbids more than three requests per connection
  - To reduce the size of the Retry-After header
  - Because unbounded retries can turn a transient blip into an outage and may get the client banned
  answer: 3
  explanation: |
    Infinite retries amplify load during an incident and can trip abuse
    detection. Bounded attempts and a total time budget keep retry behavior
    safe.
  ref: concepts.md#client-backoff-and-jitter-expectations
- id: rate-limiting-and-throttling-037
  difficulty: advanced
  tags:
  - retry-after
  - jitter
  - herd
  question: |
    A server returns a FIXED "Retry-After: 60" to every throttled client and
    the clients do exactly what it says with no jitter. What problem arises?
  options:
  - All clients wake and retry at the same second, recreating the thundering herd — so jitter is still
    a client responsibility even when the server sets the base delay
  - Nothing; this is the ideal behavior
  - The clients will never retry at all
  - The server will be forced to switch to HTTP-date format
  answer: 0
  explanation: |
    A fixed server delay plus no client jitter synchronizes every client to
    retry simultaneously. Jitter must be layered on top even when the server
    dictates the base delay.
  ref: concepts.md#client-backoff-and-jitter-expectations
- id: rate-limiting-and-throttling-038
  difficulty: beginner
  tags:
  - documentation
  - discoverability
  question: |
    When documenting an API's rate limits, which set of facts is most
    important to state explicitly?
  options:
  - The server's programming language and framework version
  - The numeric limits, the window, and the key/dimension they apply to (e.g. 100/min per API key; 1M/month
    per account)
  - The internal database schema
  - The names of the on-call engineers
  answer: 1
  explanation: |
    Clients need the numbers, the window, and the dimension (per key, per
    account, etc.) to build correct pacing. The 429 body shape and header
    semantics should be documented too.
  ref: concepts.md#documenting-limits-and-graceful-degradation
- id: rate-limiting-and-throttling-039
  difficulty: intermediate
  tags:
  - openapi
  - documentation
  - 429
  question: |
    How should rate-limit response headers (Retry-After, RateLimit) be made
    visible to consumers of an OpenAPI 3.1 spec?
  options:
  - They cannot be described in OpenAPI at all
  - By hardcoding them into every operation's summary text
  - By declaring them under the 429 response's `headers` object, so generated docs and SDKs surface them
  - Only in a separate PDF, never in the spec
  answer: 2
  explanation: |
    OpenAPI lets you describe response headers under a response's headers
    object; documenting Retry-After and RateLimit there makes them show up in
    generated docs and client SDKs.
  ref: concepts.md#documenting-limits-and-graceful-degradation
- id: rate-limiting-and-throttling-040
  difficulty: intermediate
  tags:
  - graceful-degradation
  - priority
  question: |
    As part of graceful degradation under load, which traffic should
    typically be shed first?
  options:
  - Interactive user-facing requests, before batch/analytics jobs
  - All traffic equally and simultaneously
  - Only requests that use caching
  - Low-priority traffic (e.g. batch/analytics) before interactive user requests
  answer: 3
  explanation: |
    Priority-based throttling sheds low-priority traffic (batch, analytics)
    first, preserving interactive user-facing requests as long as possible.
  ref: concepts.md#documenting-limits-and-graceful-degradation
- id: rate-limiting-and-throttling-041
  difficulty: intermediate
  tags:
  - graceful-degradation
  - design
  question: |
    Which of the following is an example of graceful degradation rather than
    a plain hard 429?
  options:
  - Serving cached/stale data or partial results and disabling expensive personalization instead of blanket-rejecting
    requests
  - Resetting the TCP connection with no response
  - Returning 500 with an empty body
  - Silently dropping every request
  answer: 0
  explanation: |
    Graceful degradation means degrading features (stale data, partial
    results, disabled personalization) rather than failing everything. It is
    a design choice distinct from hard rejection.
  ref: concepts.md#documenting-limits-and-graceful-degradation
- id: rate-limiting-and-throttling-042
  difficulty: advanced
  tags:
  - graceful-degradation
  - distinction
  question: |
    An API's only behavior at the limit is to hard-429 every excess request.
    What is the accurate characterization?
  options:
  - It has both rate limiting and graceful degradation
  - It has rate limiting but not graceful degradation — degradation is a separate, deliberate design choice
  - It has graceful degradation but no rate limiting
  - Hard-429 is prohibited by RFC 9110
  answer: 1
  explanation: |
    Rate limiting and graceful degradation are separate concerns. Hard-429ing
    everything is rate limiting; degrading gracefully (shedding by priority,
    serving stale data) is an additional design decision.
  ref: concepts.md#documenting-limits-and-graceful-degradation
- id: rate-limiting-and-throttling-043
  difficulty: intermediate
  tags:
  - problem-details
  - 429
  - rfc-9457
  question: |
    What is the recommended response body format for a 429, to keep errors
    consistent and machine-readable?
  options:
  - A bare HTML error page
  - An empty body with only headers
  - An RFC 9457 problem document with media type application/problem+json
  - A plain-text stack trace
  answer: 2
  explanation: |
    Using RFC 9457 (application/problem+json) for the 429 body keeps the
    error contract consistent and machine-readable, the same as other API
    errors.
  ref: concepts.md#documenting-limits-and-graceful-degradation
- id: rate-limiting-and-throttling-044
  difficulty: intermediate
  tags:
  - distinction
  - algorithm
  - altitude
  question: |
    Where does the choice of token bucket vs leaky bucket vs sliding window
    properly belong, relative to the client contract?
  options:
  - It is part of the client-facing contract and must be exposed in headers
  - It must be sent to the client in the Retry-After header
  - It is defined by RFC 6585 as a required header
  - It is the server-internal algorithm (system-design altitude); the client contract only exposes codes,
    headers, and semantics
  answer: 3
  explanation: |
    The algorithm is how the server internally decides allow/deny (system
    design). The contract is what the client observes — status codes,
    Retry-After, RateLimit headers — independent of the algorithm.
  ref: concepts.md#distinction-from-the-rate-limiter-algorithm
- id: rate-limiting-and-throttling-045
  difficulty: advanced
  tags:
  - distinction
  - stability
  - evolution
  question: |
    The server switches its internal limiter from a fixed window to a sliding
    window. What must remain true for clients to be unaffected?
  options:
  - The client contract (status codes, headers, and their semantics) must stay stable
  - Clients must upgrade their SDK for every algorithm change
  - The API must switch from JSON to XML
  - The Retry-After header must be removed
  answer: 0
  explanation: |
    Clients code against the contract, not the algorithm. As long as codes,
    headers, and semantics remain stable, the server can change the internal
    algorithm freely.
  ref: concepts.md#distinction-from-the-rate-limiter-algorithm
- id: rate-limiting-and-throttling-046
  difficulty: advanced
  tags:
  - distinction
  - burst
  - observable
  question: |
    In what way can the internal algorithm legitimately "leak" into the
    client contract?
  options:
  - The client must always know the exact bucket refill rate
  - Observable burst behavior — e.g. whether a client can spend a saved-up burst — should be documented,
    since a token bucket and a leaky bucket differ observably even at the same nominal rate
  - The contract must expose the Redis keys used to store counters
  - It never leaks; the algorithm is fully invisible
  answer: 1
  explanation: |
    Burst behavior is observable: a token bucket allows saved-up bursts, a
    leaky bucket/spike arrest does not. The contract should describe such
    observable behavior even while hiding the implementation.
  ref: concepts.md#distinction-from-the-rate-limiter-algorithm
- id: rate-limiting-and-throttling-047
  difficulty: intermediate
  tags:
  - owasp
  - security
  - quota
  question: |
    Which OWASP API Security Top 10 (2023) category most directly motivates
    rate limiting and quotas as a security control?
  options:
  - Broken Object Level Authorization
  - Security Misconfiguration
  - Unrestricted Resource Consumption (API4:2023)
  - Server Side Request Forgery
  answer: 2
  explanation: |
    API4:2023 Unrestricted Resource Consumption covers the risk of clients
    consuming excessive resources; rate limits and quotas are the primary
    mitigations.
  ref: concepts.md#documenting-limits-and-graceful-degradation
- id: rate-limiting-and-throttling-048
  difficulty: beginner
  tags:
  - ratelimit-policy
  - quota
  - window
  question: |
    In the RateLimit-Policy field `RateLimit-Policy: "daily";q=1000;w=86400`,
    what do q and w represent?
  options:
  - q = requests already used; w = weekday number
  - q = queue depth; w = wait time
  - q = quality score; w = weight
  - q = quota allocated (1000); w = the time window in seconds (86400 = one day)
  answer: 3
  explanation: |
    In RateLimit-Policy, q is the quota allocated for the policy and w is the
    window length in seconds. Here it advertises 1000 requests per 86400 s
    (one day).
  ref: concepts.md#ratelimit-and-ratelimit-policy-headers
- id: rate-limiting-and-throttling-049
  difficulty: intermediate
  tags:
  - ratelimit-headers
  - reliability
  - gotcha
  question: |
    Why should a client treat a RateLimit "remaining" value as a hint rather
    than a hard guarantee?
  options:
  - Because other keys sharing a limit, policy changes, or eventual consistency in a distributed limiter
    can make the remaining value jump unexpectedly
  - Because it is always encrypted and unreadable
  - Because RFC 6585 forbids acting on it
  - Because it is only sent once per day
  answer: 0
  explanation: |
    RateLimit headers are informational hints. Shared limits, policy changes,
    and distributed-limiter consistency mean the remaining count can change
    unpredictably; clients shouldn't treat it as an exact guarantee.
  ref: concepts.md#ratelimit-and-ratelimit-policy-headers
- id: rate-limiting-and-throttling-050
  difficulty: intermediate
  tags:
  - 503
  - retry-after
  - overload
  question: |
    A backend is temporarily overloaded for ALL callers and wants clients to
    retry in about 2 minutes. Which response is most appropriate?
  options:
  - 429 Too Many Requests with no Retry-After
  - '503 Service Unavailable with Retry-After: 120'
  - 200 OK with an error message in the body
  - '403 Forbidden with Retry-After: 120'
  answer: 1
  explanation: |
    Global overload affecting everyone is 503 Service Unavailable, and
    Retry-After: 120 tells clients to wait ~2 minutes. 429 would wrongly
    imply the specific client was too fast.
  ref: concepts.md#429-too-many-requests
- id: rate-limiting-and-throttling-051
  difficulty: advanced
  tags:
  - concurrency
  - dimensions
  - design
  question: |
    A client opens 100 long-lived streaming connections but issues almost no
    new requests per second, yet it is rejected. Which limiter dimension is it
    most likely hitting, and why is a request-rate limit blind to this?
  options:
  - A quota limit, because streaming counts as monthly volume
  - A concurrency limit — it caps requests in flight at any instant, which a
    per-second rate limit does not measure since the client's arrival velocity
    is near zero
  - A spike-arrest limit, because streaming is inherently bursty
  - A per-plan limit, which only applies to streaming endpoints
  answer: 1
  explanation: |
    Concurrency limits cap simultaneously in-flight requests (resource
    occupancy), independent of arrival rate. Long-lived connections hold slots
    without generating request velocity, so a rate limit never fires while the
    concurrency budget is exhausted.
  ref: concepts.md#concurrency-limiting-as-a-fourth-dimension
- id: rate-limiting-and-throttling-052
  difficulty: expert
  tags:
  - concurrency
  - retry-after
  - semantics
  question: |
    Why is a fixed "Retry-After: N seconds" a poor fit for a 429 produced by a
    concurrency limit specifically?
  options:
  - Concurrency 429s are forbidden from carrying Retry-After by RFC 9110
  - A concurrency slot frees the instant an in-flight request completes, not at
    a wall-clock window boundary, so a fixed seconds value can't predict when a
    slot will actually be available
  - Retry-After must always be an HTTP-date for concurrency limits
  - Concurrency limits reset only monthly, so N seconds is always too small
  answer: 1
  explanation: |
    Unlike a time-window rate limit, a concurrency budget replenishes when an
    active request finishes — an event, not a scheduled reset. A fixed delay
    guesses at that; the ideal is to retry when a slot frees (or use short
    jittered backoff), which is why the seconds hint fits poorly.
  ref: concepts.md#concurrency-limiting-as-a-fourth-dimension
- id: rate-limiting-and-throttling-053
  difficulty: advanced
  tags:
  - ratelimit-policy
  - quota-units
  - concurrency
  question: |
    Which RateLimit-Policy correctly advertises a budget of 100 simultaneous
    in-flight requests using the draft's quota-unit registry?
  options:
  - 'RateLimit-Policy: "conc";q=100;w=1'
  - 'RateLimit-Policy: "conc";q=100;qu=concurrent-requests'
  - 'RateLimit-Policy: "conc";r=100;t=0'
  - 'RateLimit-Policy: "conc";q=100;qu=content-bytes'
  answer: 1
  explanation: |
    The registry defines qu=concurrent-requests for concurrency budgets; q is
    the quota in those units. No time window (w) is conceptually required
    because concurrency is instantaneous, and r/t belong to the RateLimit
    (standing) field, not the policy.
  ref: concepts.md#structured-fields-wire-mechanics-and-quota-units
- id: rate-limiting-and-throttling-054
  difficulty: expert
  tags:
  - problem-details
  - rfc-9457
  - problem-types
  question: |
    An SDK receives 429 with body type "https://iana.org/.../abnormal-usage-detected".
    Per the draft's problem-type semantics, what is the most appropriate SDK
    behavior compared to a "quota-exceeded" 429?
  options:
  - Treat it identically to quota-exceeded and auto-retry after Retry-After
  - Surface it to a human/operator rather than blindly auto-retrying, since it
    signals usage flagged as abusive/anomalous rather than a normal quota breach
  - Immediately re-issue the request without any wait
  - Downgrade to HTTP/1.1 and retry
  answer: 1
  explanation: |
    quota-exceeded is a normal rate/quota breach → back off and retry.
    abnormal-usage-detected flags anomalous/abusive usage; blindly retrying is
    wrong and may worsen the situation, so it should be surfaced rather than
    auto-retried.
  ref: concepts.md#machine-readable-throttle-bodies-and-problem-types
- id: rate-limiting-and-throttling-055
  difficulty: advanced
  tags:
  - problem-types
  - violated-policies
  - 503
  question: |
    Which mapping of the draft's throttle problem types to status codes is
    correct?
  options:
  - quota-exceeded → 503; temporary-reduced-capacity → 429
  - quota-exceeded → 429; temporary-reduced-capacity → 503; abnormal-usage-detected → 429
  - All three → 429
  - quota-exceeded → 429; temporary-reduced-capacity → 429; abnormal-usage-detected → 403
  answer: 1
  explanation: |
    quota-exceeded and abnormal-usage-detected are client-facing 429s;
    temporary-reduced-capacity is a server-side capacity reduction and maps to
    503. Each carries a violated-policies member listing the breached policies.
  ref: concepts.md#machine-readable-throttle-bodies-and-problem-types
- id: rate-limiting-and-throttling-056
  difficulty: advanced
  tags:
  - google
  - error-model
  - retry
  question: |
    In Google's API error model, how is retry timing conveyed for a
    RESOURCE_EXHAUSTED condition, and what HTTP status maps to it?
  options:
  - Only via the Retry-After header; the status is 503
  - Via RetryInfo{retry_delay} in the response body (alongside ErrorInfo and
    QuotaFailure), mapping RESOURCE_EXHAUSTED to HTTP 429
  - Via a custom X-Google-Retry header; the status is 403
  - Retry timing is never provided; clients must guess; the status is 400
  answer: 1
  explanation: |
    Google maps RESOURCE_EXHAUSTED to HTTP 429 and places structured detail in
    the body: required ErrorInfo (reason/domain/metadata), QuotaFailure, and
    RetryInfo carrying retry_delay — a body-based complement to the Retry-After
    header.
  ref: concepts.md#machine-readable-throttle-bodies-and-problem-types
- id: rate-limiting-and-throttling-057
  difficulty: expert
  tags:
  - cost-based
  - graphql
  - contract
  question: |
    You expose one GraphQL endpoint and one bulk-export endpoint. Why is a flat
    "100 requests/minute" limit inadequate, and what is the contract-level fix?
  options:
  - It is adequate; GraphQL should simply be capped at 100/min like any endpoint
  - A single endpoint hides queries of wildly different cost, so meter by
    cost/complexity (points) or bytes and advertise remaining budget via the
    RateLimit contract using qu (e.g. requests vs content-bytes) rather than a
    request count
  - Move GraphQL behind a per-IP limit and remove all headers
  - Return 400 for any query estimated to be expensive
  answer: 1
  explanation: |
    Request counts assume uniform cost, which fails for GraphQL and bulk
    endpoints. Cost/points/bytes-based limiting debits a budget by actual cost;
    the RateLimit contract carries it via the qu quota-unit and a q quota in
    those units, and r reports remaining budget, not remaining calls.
  ref: concepts.md#cost-based-and-weighted-limiting
- id: rate-limiting-and-throttling-058
  difficulty: intermediate
  tags:
  - cost-based
  - github
  - points
  question: |
    GitHub's REST API enforces a secondary limit of 900 "points" per minute
    rather than a flat 900 requests per minute. What problem does a points
    model solve?
  options:
  - It lets expensive calls debit more of the budget than cheap ones, so a
    flat request count can't be gamed by hiding costly work behind few calls
  - It makes every request cost exactly one point, identical to a request count
  - It removes the need for any rate limiting
  - It is purely a billing construct with no effect on throttling
  answer: 0
  explanation: |
    A points/weight model assigns cost per operation so expensive requests
    consume more budget. This prevents a small number of very costly calls from
    slipping under a naive per-request cap.
  ref: concepts.md#cost-based-and-weighted-limiting
- id: rate-limiting-and-throttling-059
  difficulty: expert
  tags:
  - 403-vs-429
  - github
  - client-behavior
  question: |
    GitHub may return 403 (not 429) for a rate limit. A robust client receives
    a 403. How should it decide whether to retry?
  options:
  - Always retry a 403, since GitHub uses it for rate limits
  - Never retry a 403 under any circumstances
  - 'Inspect the response: if it carries Retry-After and/or x-ratelimit-* headers
    (e.g. x-ratelimit-remaining is 0), treat it as a retryable rate limit;
    otherwise treat it as a hard authorization failure and do not retry'
  - Retry only if the body is empty
  answer: 2
  explanation: |
    A plain 403 means "not allowed" — retrying won't help. A 403 that is really
    a rate limit is distinguishable by Retry-After / x-ratelimit-* headers. The
    client must branch on those signals rather than assuming from the status
    code alone.
  ref: concepts.md#403-vs-429-and-reason-disambiguation
- id: rate-limiting-and-throttling-060
  difficulty: expert
  tags:
  - stripe
  - lock-timeout
  - retry
  question: |
    Stripe's SDKs auto-retry a lock_timeout 429 but do NOT auto-retry a
    rate-limit 429. What is the reasoning behind treating two 429s so
    differently?
  options:
  - lock_timeout 429s are actually 503s in disguise
  - A lock_timeout is a transient contention blip that a quick retry can clear,
    whereas hammering a rate-limit 429 just deepens the throttle — so only the
    former is safely auto-retryable
  - Rate-limit 429s are never retryable at all, even manually
  - The distinction is arbitrary and has no operational basis
  answer: 1
  explanation: |
    Different 429s demand different behavior. A lock timeout reflects short-lived
    contention on a resource and clears with a brief retry; a rate-limit 429
    means you must slow down, so retrying immediately worsens it. Stripe signals
    the difference (e.g. Stripe-Rate-Limited-Reason, distinct lock_timeout).
  ref: concepts.md#403-vs-429-and-reason-disambiguation
- id: rate-limiting-and-throttling-061
  difficulty: advanced
  tags:
  - stripe
  - concurrency
  - reason-codes
  question: |
    Stripe's Stripe-Rate-Limited-Reason header can report values like
    global-rate, endpoint-rate, global-concurrency, and endpoint-concurrency.
    What is the primary contract value of distinguishing these on a 429?
  options:
  - It lets the client tell whether it hit a velocity limit or a concurrency
    limit (and at what scope), so it can respond correctly — e.g. reduce
    in-flight requests for concurrency vs slow the send rate for rate limits
  - It changes the status code from 429 to 200
  - It is required for TLS session resumption
  - It only affects billing, not client behavior
  answer: 0
  explanation: |
    Rate and concurrency 429s share a status code but need different remedies:
    a concurrency reason means shed in-flight requests; a rate reason means
    reduce send velocity. Exposing the reason lets the client pick the right
    corrective action.
  ref: concepts.md#403-vs-429-and-reason-disambiguation
- id: rate-limiting-and-throttling-062
  difficulty: expert
  tags:
  - retry-amplification
  - retry-storm
  - metastable
  question: |
    A downstream service returns 429s. The SDK retries 3x, the API gateway
    retries 3x, and the service-mesh sidecar retries 3x, all independently.
    What is the worst-case load multiplier at the innermost service, and what
    failure mode does this invite?
  options:
  - 3x load; a simple transient error
  - Up to 27x load (3 x 3 x 3); a retry storm that can drive the system into a
    metastable failure that persists even after the original trigger clears
  - 9x load; a cache stampede only
  - 1x load; retries at different layers cancel out
  answer: 1
  explanation: |
    Independent retries at each layer multiply: 3^3 = up to 27x amplification.
    This retry storm keeps load high and can push a struggling system into a
    metastable failure that sustains itself even after the initial cause is
    gone.
  ref: concepts.md#retry-amplification-and-retry-budgets
- id: rate-limiting-and-throttling-063
  difficulty: expert
  tags:
  - retry-budgets
  - sre
  - mitigation
  question: |
    Which combination best prevents retry amplification in a multi-tier system?
  options:
  - Increase the retry count at every layer so requests eventually succeed
  - Retry at exactly one layer (typically the outermost client), enforce a retry
    budget (e.g. retries ≤ 10% of request volume via a token bucket), and
    propagate Retry-After instead of re-issuing at each hop
  - Disable Retry-After propagation so layers act independently
  - Remove rate limiting so 429s never occur
  answer: 1
  explanation: |
    Single-layer retry stops multiplication; a retry budget (Google SRE:
    cap retries to a small fraction of traffic via a token bucket) bounds total
    retry load; propagating Retry-After makes upper layers wait rather than
    amplify. Together they break the storm.
  ref: concepts.md#retry-amplification-and-retry-budgets
- id: rate-limiting-and-throttling-064
  difficulty: expert
  tags:
  - fail-open
  - fail-closed
  - distributed
  question: |
    Your limiter stores counters in Redis, which becomes unavailable. Contrast
    fail-open vs fail-closed and their client-visible consequences.
  options:
  - Fail-open rejects everything (safe); fail-closed allows everything (risky)
  - Fail-closed rejects requests when the counter can't be read (safe for the
    backend but turns a Redis outage into an API outage — self-DoS); fail-open
    allows them (preserves availability but removes protection when it may be
    needed most)
  - Both behave identically; the distinction is only about logging
  - Fail-open is prohibited by RFC 6585
  answer: 1
  explanation: |
    Fail-closed = reject on missing counter: never over-admits but makes the
    limiter a single point of failure (outage → full API outage). Fail-open =
    allow on missing counter: keeps availability but drops protection. Clients
    may see unexpected 503s (closed) or a temporary absence of throttling
    (open).
  ref: concepts.md#fail-open-vs-fail-closed-limiters
- id: rate-limiting-and-throttling-065
  difficulty: advanced
  tags:
  - fail-open
  - fail-closed
  - design
  question: |
    A mature design often fails-open for best-effort rate limits but
    fails-closed for hard billing/security quotas. What principle drives this
    split?
  options:
  - Billing quotas are cheaper to compute, so they can afford to reject
  - Choose availability-first (fail-open) where over-admitting is tolerable, but
    correctness-first (fail-closed) where over-admitting means lost revenue or a
    security breach — matching the failure mode to what the limit protects
  - RFC 9110 mandates fail-closed for all monetary limits
  - The split is random and has no principle
  answer: 1
  explanation: |
    The right failure behavior depends on what the limit protects. Best-effort
    protection prefers availability (fail-open); a limit whose breach means lost
    money or a security hole prefers correctness (fail-closed). Many designs add
    a local approximate fallback to soften either extreme.
  ref: concepts.md#fail-open-vs-fail-closed-limiters
- id: rate-limiting-and-throttling-066
  difficulty: advanced
  tags:
  - client-side
  - token-bucket
  - stripe
  question: |
    Stripe recommends that clients implement their own token bucket rather than
    firing bursts and absorbing 429s. What is the core benefit of client-side
    rate limiting?
  options:
  - It removes the need for the server to rate limit at all
  - It smooths the client's own outbound rate so it rarely triggers a 429 in the
    first place, making the contract bilateral rather than purely reactive
  - It encrypts the requests
  - It guarantees the server will raise the client's limit
  answer: 1
  explanation: |
    A client-side token bucket paces outbound requests to the advertised policy,
    so the client stays under the limit proactively instead of bursting and
    reacting to rejections. Rate limiting is a two-sided contract.
  ref: concepts.md#client-side-rate-limiting-and-adaptive-throttling
- id: rate-limiting-and-throttling-067
  difficulty: expert
  tags:
  - adaptive-throttling
  - sre
  - circuit-breaker
  question: |
    Google SRE's client-side "adaptive throttling" has a client drop some
    requests locally, before sending, once the server is clearly rejecting.
    How does this differ from a circuit breaker?
  options:
  - They are identical mechanisms with different names
  - Adaptive throttling probabilistically sheds a fraction of requests at the
    source based on the recent accept/reject ratio (still letting some through);
    a circuit breaker trips calls to a dependency fully off for a cool-down
    period
  - Adaptive throttling only runs on the server; circuit breakers only on the
    client
  - A circuit breaker increases request rate under load; adaptive throttling
    decreases it
  answer: 1
  explanation: |
    Adaptive throttling computes a reject probability from the recent
    accept/reject ratio and drops a proportion of requests before they are sent,
    still probing with some traffic. A circuit breaker is binary: once tripped
    it stops all calls to the dependency for a timeout, then half-opens to test.
  ref: concepts.md#client-side-rate-limiting-and-adaptive-throttling
- id: rate-limiting-and-throttling-068
  difficulty: expert
  tags:
  - distributed
  - remaining
  - best-effort
  question: |
    A client on a non-sticky-routed API sees RateLimit remaining go 40 → 41 →
    39 → negative across consecutive responses. Which explanation is most
    consistent with the spec's stance?
  options:
  - The server is buggy and violating the draft
  - Per-node local buckets with sync lag and non-sticky routing make remaining a
    best-effort snapshot that can move non-monotonically or briefly go negative;
    the draft treats RateLimit as advisory, not a guarantee
  - remaining must always decrease monotonically per the spec
  - The values are encrypted and should be ignored entirely
  answer: 1
  explanation: |
    Distributed limiters reconcile per-node counters with lag; different nodes
    have different views under non-sticky routing, so remaining can jump around
    or briefly go negative after reconciliation. The draft explicitly frames
    these fields as advisory telemetry, not a reservation.
  ref: concepts.md#distributed-limits-and-best-effort-semantics
- id: rate-limiting-and-throttling-069
  difficulty: expert
  tags:
  - draft
  - guarantees
  - semantics
  question: |
    Which statement reflects an explicit "MUST NOT assume" rule the draft places
    on clients regarding RateLimit fields?
  options:
  - Clients MUST NOT assume the full service limit will be restored after t, and
    MUST NOT assume future responses will contain the same RateLimit fields
  - Clients MUST assume t ends at a fixed wall-clock instant
  - Clients MUST assume remaining will never change between two responses
  - Clients MUST assume every response includes RateLimit headers
  answer: 0
  explanation: |
    The draft states clients must not assume full restoration after t (sliding
    windows don't reset at a fixed point) and must not assume future responses
    carry the same fields. These make the contract advisory rather than a
    promise.
  ref: concepts.md#distributed-limits-and-best-effort-semantics
- id: rate-limiting-and-throttling-070
  difficulty: expert
  tags:
  - precedence
  - retry-after
  - draft
  question: |
    A 429 arrives with BOTH Retry-After: 10 and a RateLimit field whose window
    (t) resets in 25 seconds. Per the draft's precedence rules, when may the
    client retry the rejected request?
  options:
  - After 25 seconds, because the RateLimit window always wins
  - After 10 seconds — Retry-After MUST take precedence for the rejected
    request's retry timing, and the effective window MAY be ignored for that
    decision
  - Immediately, because the two disagree and cancel out
  - After 35 seconds (the sum of both values)
  answer: 1
  explanation: |
    The draft says when both are present, Retry-After takes precedence for the
    rejected request's retry timing and the effective RateLimit window may be
    ignored. Servers also SHOULD NOT set Retry-After earlier than the window
    end, but if both are present Retry-After governs.
  ref: concepts.md#retry-after-and-ratelimit-precedence-and-edge-cases
- id: rate-limiting-and-throttling-071
  difficulty: advanced
  tags:
  - retry-after
  - edge-cases
  - parsing
  question: |
    A client receives "Retry-After: 12.5" (a non-integer). What is the correct
    handling per the header's definition?
  options:
  - Wait 12.5 seconds precisely
  - Round to 13 seconds and retry
  - Treat the field as malformed/absent (delay-seconds must be a non-negative
    integer) and fall back to exponential backoff with jitter
  - Interpret 12.5 as 12 minutes 30 seconds
  answer: 2
  explanation: |
    delay-seconds is a non-negative integer; a non-integer value is malformed.
    The safe behavior is to ignore the malformed field and use the client's own
    backoff strategy rather than guessing an interpretation.
  ref: concepts.md#retry-after-and-ratelimit-precedence-and-edge-cases
- id: rate-limiting-and-throttling-072
  difficulty: advanced
  tags:
  - retry-after
  - clamping
  - resilience
  question: |
    A misconfigured server sends "Retry-After: 999999999". What should a robust
    client do?
  options:
  - Sleep for ~31 years as instructed
  - Clamp the value to a sane maximum (and/or surface an error) rather than
    blocking the request for an absurd duration
  - Immediately retry, ignoring all backoff
  - Convert it to an HTTP-date and wait until then
  answer: 1
  explanation: |
    Retry-After is a lower bound, but a client should sanity-check and clamp
    absurd values to a reasonable ceiling (or fail fast) instead of hanging
    indefinitely, protecting its own reliability.
  ref: concepts.md#retry-after-and-ratelimit-precedence-and-edge-cases
- id: rate-limiting-and-throttling-073
  difficulty: expert
  tags:
  - info-leak
  - security
  - draft
  question: |
    Under what argument is advertising an exact X-RateLimit-Remaining on every
    200 response sometimes considered a BAD idea, and what does the draft
    recommend?
  options:
  - It slows the response; the draft recommends never sending any RateLimit info
  - It precisely tells a scraper how much headroom it has to enumerate without
    tripping the limit (an abuse aid); the draft says servers MUST NOT convey
    values exposing an unwanted volume of requests and SHOULD cap the
    quota-to-window ratio, especially for large windows
  - It breaks caching; the draft recommends caching every 429
  - It leaks the server's IP; the draft recommends TLS
  answer: 1
  explanation: |
    Exact remaining counts help an attacker pace an enumeration attack right up
    to the limit. The draft's §6 guidance is to avoid exposing an unwanted
    volume of requests and to cap the quota-to-window ratio, trading some
    developer-friendliness for abuse resistance.
  ref: concepts.md#info-leak-and-abuse-hardening
- id: rate-limiting-and-throttling-074
  difficulty: advanced
  tags:
  - owasp
  - resource-consumption
  - security
  question: |
    Beyond request-count limits, which set of controls does OWASP API4:2023
    Unrestricted Resource Consumption expect an API to also enforce?
  options:
  - Only TLS version and cipher suite
  - Max page/response size, request-body and file-upload size caps, execution
    timeouts, per-request memory/CPU limits, and bounding third-party
    operational cost (e.g. per-request SMS/email spend)
  - Only the choice of JSON vs XML
  - Only the number of HTTP headers per request
  answer: 1
  explanation: |
    Resource-consumption defense is broader than request count: unbounded page
    sizes, oversized payloads/uploads, missing timeouts, and per-request
    third-party spend (SMS, email, cloud) are all abusable even within the
    request-count limit. Rate limiting is one control among these.
  ref: concepts.md#info-leak-and-abuse-hardening
- id: rate-limiting-and-throttling-075
  difficulty: expert
  tags:
  - structured-fields
  - pk
  - parsing
  question: |
    In the RateLimit fields, how is the partition key (pk) encoded, per the
    Structured Fields syntax the draft uses?
  options:
  - As a bare unquoted token, e.g. pk=user123
  - As an sf-integer
  - 'As a Byte Sequence — base64 wrapped in colons, e.g. pk=:aGVsbG8=: — and it
    SHOULD avoid sensitive information'
  - As a JSON object embedded in the header
  answer: 2
  explanation: |
    pk is a Structured Fields Byte Sequence: base64 content delimited by colons
    (:...:). The draft also advises pk SHOULD be documented but SHOULD NOT carry
    sensitive information, since it appears on the wire.
  ref: concepts.md#structured-fields-wire-mechanics-and-quota-units
- id: rate-limiting-and-throttling-076
  difficulty: expert
  tags:
  - structured-fields
  - lists
  - trailers
  question: |
    Two response header lines both named RateLimit-Policy arrive. Per Structured
    Fields rules, how must a parser treat them, and where may these fields
    appear?
  options:
  - Keep only the last line; ignore the first
  - Recombine the multiple instances (in order) into a single logical List
    before parsing; and these fields MUST NOT appear in trailers, only in the
    header section
  - Reject the response as malformed
  - Treat them as two unrelated headers and parse independently
  answer: 1
  explanation: |
    A Structured Fields List may be split across multiple header instances of
    the same name and must be recombined in order before parsing. The RateLimit
    fields must appear in the header section, not in trailers.
  ref: concepts.md#structured-fields-wire-mechanics-and-quota-units
- id: rate-limiting-and-throttling-077
  difficulty: advanced
  tags:
  - draft
  - status-codes
  - coupling
  question: |
    The draft states "429 is only an example." What does this mean for where
    RateLimit fields may appear?
  options:
  - RateLimit fields may only ever appear on 429 responses
  - The fields are deliberately not tied to any specific status code; they MAY
    accompany any status (including 2xx and, with caution, 3xx), so the
    "RateLimit implies 429" coupling is an implementation convention, not a spec
    requirement
  - The fields may only appear on 4xx and 5xx responses
  - The fields must appear on every response or none
  answer: 1
  explanation: |
    The draft decouples the RateLimit fields from status codes: 429 is just the
    common example. The fields can accompany any status (advertising standing on
    2xx is encouraged for pacing), so tight 429-to-RateLimit coupling is not
    mandated.
  ref: concepts.md#structured-fields-wire-mechanics-and-quota-units
- id: rate-limiting-and-throttling-078
  difficulty: advanced
  tags:
  - conditional-requests
  - caching
  - quota
  question: |
    How can conditional requests (ETag / If-None-Match) help a client conserve
    its rate/points budget, and what caveat applies?
  options:
  - They never affect the rate limit; the caveat is that ETags are deprecated
  - A 304 Not Modified is cheaper and some APIs charge it lightly or not at all
    against the limit, conserving budget — but whether 304s count is
    API-specific and must be documented, not assumed
  - They double the cost of every request
  - Conditional requests bypass rate limiting entirely on all APIs
  answer: 1
  explanation: |
    A 304 returns no body and costs the server less, so some APIs discount or
    exempt conditional 304s from the limit — a real pacing technique. But this
    is API-specific behavior a client must confirm in the docs, not assume.
  ref: concepts.md#conserving-quota-with-conditional-requests
- id: rate-limiting-and-throttling-079
  difficulty: expert
  tags:
  - precedence
  - caching
  - draft
  question: |
    Per the draft, how should a client treat RateLimit fields carried on a
    response served from cache with a positive current_age?
  options:
  - Trust them as fully current
  - Ignore them for rate-limit purposes — a stale RateLimit snapshot is worse
    than none, and clients MUST ignore malformed fields as well
  - Add the current_age to the t value and use the result
  - Cache the 429 and reuse it for other clients
  answer: 1
  explanation: |
    A cached response with positive current_age carries a stale RateLimit
    snapshot; the draft advises ignoring it for rate-limit purposes. Clients
    must also ignore malformed fields rather than guessing an interpretation.
  ref: concepts.md#retry-after-and-ratelimit-precedence-and-edge-cases
- id: rate-limiting-and-throttling-080
  difficulty: intermediate
  tags:
  - zalando
  - style-guide
  - 429
  question: |
    Zalando's RESTful API Guidelines rule #153 anchors an industry stance on
    rate-limit signaling. What does it require?
  options:
  - Use 200 with an error flag in the body for rate limits
  - MUST use status code 429 together with rate-limit headers (e.g. Retry-After
    and X-RateLimit-Limit/Remaining/Reset) to signal rate limiting
  - Use 403 for all rate limits
  - Never expose rate-limit information to clients
  answer: 1
  explanation: |
    Rule #153 requires 429 plus headers (Retry-After and the X-RateLimit-*
    triplet) so clients get a machine-readable throttle signal — a concrete
    industry style-guide anchor for the 429 + headers contract.
  ref: concepts.md#429-too-many-requests
- id: rate-limiting-and-throttling-081
  difficulty: advanced
  tags:
  - github
  - retry-priority
  - client-behavior
  question: |
    GitHub documents a retry priority for its throttled responses. Which order
    should a client follow?
  options:
  - Retry immediately, then wait 1 minute if that fails
  - Honor retry-after if present; else wait until the x-ratelimit-reset time if
    x-ratelimit-remaining is 0; else wait at least one minute before retrying
  - Always wait exactly one hour regardless of headers
  - Ignore all headers and use a fixed 5-second delay
  answer: 1
  explanation: |
    GitHub's guidance: obey retry-after first; if absent and remaining is 0,
    wait until reset; otherwise wait at least a minute before retrying. This
    layered priority prevents both premature retries and indefinite stalls.
  ref: concepts.md#403-vs-429-and-reason-disambiguation
- id: rate-limiting-and-throttling-082
  difficulty: expert
  tags:
  - concurrency
  - rate
  - design
  question: |
    An interviewer asks you to distinguish a rate-limit 429, a concurrency 429,
    and a lock-timeout 429, and whether they should share a status code. Which
    answer is strongest?
  options:
  - They are the same failure and should always be handled identically
  - All three are legitimately 429 (the request was rejected due to too-many/
    too-much), but they need different client remedies — slow the send rate,
    reduce in-flight requests, or briefly retry — so the server should
    disambiguate via a reason header or typed problem body, and only the
    lock-timeout is safely auto-retryable
  - Only the rate-limit case should be 429; the others should be 400
  - Concurrency and lock-timeout should be 503; rate-limit should be 200
  answer: 1
  explanation: |
    Sharing 429 is defensible since all are "too many/too much" rejections, but
    the correct remedy differs per case. The client can only react correctly if
    the server disambiguates (Stripe-Rate-Limited-Reason, a problem type), and
    auto-retry safety varies — a lock timeout clears with a quick retry, a rate
    limit does not.
  ref: concepts.md#403-vs-429-and-reason-disambiguation
