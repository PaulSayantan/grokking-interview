topic: "API Gateways & Backend-for-Frontend"
domain: rest-api-design
topic_slug: api-gateways-and-bff
version: 1
questions:
  - id: api-gateways-and-bff-001
    difficulty: beginner
    tags: [gateway, definition, edge]
    question: |
      What best describes an API gateway?
    options:
      - "A database proxy that shards write traffic across replicas"
      - "A single entry point at the edge that applies cross-cutting policies and routes requests to backend services"
      - "A client-side SDK that caches API responses on the device"
      - "A message broker that queues asynchronous events between services"
    answer: 1
    explanation: |
      An API gateway sits at the edge as a single entry point. It applies
      cross-cutting concerns (TLS, authN, rate limiting, routing,
      transformation, observability) and forwards requests to backends,
      giving clients one stable contract.
    ref: "concepts.md#what-an-api-gateway-is"

  - id: api-gateways-and-bff-002
    difficulty: beginner
    tags: [gateway, benefits]
    question: |
      Which is a primary benefit of putting an API gateway in front of a set
      of services?
    options:
      - "It removes the need for services to store any data"
      - "It guarantees every service is written in the same language"
      - "It centralizes cross-cutting concerns so each service doesn't reimplement TLS, auth, and rate limiting"
      - "It eliminates the need for a load balancer entirely"
    answer: 2
    explanation: |
      Centralizing cross-cutting concerns is the core value: services stay
      focused on business logic, and clients get one stable hostname/contract
      instead of coupling to the internal topology.
    ref: "concepts.md#what-an-api-gateway-is"

  - id: api-gateways-and-bff-003
    difficulty: intermediate
    tags: [gateway, lifecycle, ordering]
    question: |
      In a typical gateway request pipeline, why is rate limiting usually
      applied before the request is forwarded to the backend?
    options:
      - "Because backends cannot return 429 status codes themselves"
      - "So that excess load is rejected cheaply before it consumes backend resources"
      - "Because rate limiting requires the backend's response body"
      - "So that TLS can be terminated after routing"
    answer: 1
    explanation: |
      The cheapest request to serve is the one you reject early. Throttling at
      the edge protects backends from overload before real work is done.
    ref: "concepts.md#what-an-api-gateway-is"

  - id: api-gateways-and-bff-004
    difficulty: beginner
    tags: [gateway, facade, pattern]
    question: |
      The API gateway is often described as the network-level cousin of which
      design pattern?
    options:
      - "Facade — one simple interface in front of a complex subsystem"
      - "Singleton — a single global instance"
      - "Observer — subscribers notified of events"
      - "Visitor — operations decoupled from object structure"
    answer: 0
    explanation: |
      A gateway presents one stable, simple interface (a "front door") in front
      of a complicated subsystem of services — the Facade pattern applied at the
      network edge.
    ref: "concepts.md#what-an-api-gateway-is"

  - id: api-gateways-and-bff-005
    difficulty: intermediate
    tags: [responsibilities, boundary]
    question: |
      Which "boundary test" helps decide whether a concern belongs in the
      gateway?
    options:
      - "Whether it can be written in YAML"
      - "Whether it runs faster than 10ms"
      - "Whether the frontend team requested it"
      - "Whether it depends only on the shape of the HTTP message and the caller's identity, rather than the meaning of the resource"
    answer: 3
    explanation: |
      Shape/identity concerns (auth, rate limit, routing, header rewrite) fit
      the gateway. Concerns that depend on the meaning of the resource (is this
      order refundable?) are business logic and belong in a service.
    ref: "concepts.md#gateway-responsibilities"

  - id: api-gateways-and-bff-006
    difficulty: beginner
    tags: [responsibilities, list]
    question: |
      Which of the following is NOT a typical API gateway responsibility?
    options:
      - "TLS termination"
      - "Rate limiting / throttling"
      - "Computing a customer's loyalty tier and applying business discounts"
      - "Routing requests to backend services"
    answer: 2
    explanation: |
      Computing loyalty tiers and applying discounts is domain/business logic
      that belongs in a service. TLS termination, rate limiting, and routing are
      classic cross-cutting gateway responsibilities.
    ref: "concepts.md#gateway-responsibilities"

  - id: api-gateways-and-bff-007
    difficulty: intermediate
    tags: [responsibilities, decoupling]
    question: |
      How does routing through a gateway help decouple clients from services?
    options:
      - "Clients depend on the gateway's stable contract, so services can be split, merged, or relocated without breaking clients"
      - "It forces clients to hardcode each service's IP address"
      - "It requires clients to know the internal service topology"
      - "It prevents services from ever changing their internal routes"
    answer: 0
    explanation: |
      The gateway exposes a stable public contract while the internal service
      map shifts freely behind it — clients don't couple to internal topology.
    ref: "concepts.md#gateway-responsibilities"

  - id: api-gateways-and-bff-008
    difficulty: advanced
    tags: [responsibilities, blast-radius, reliability]
    question: |
      Why is a shared API gateway considered a significant operational risk?
    options:
      - "It is a single point of failure and shared blast radius — a bad config or plugin bug affects every API behind it"
      - "It cannot terminate TLS at scale"
      - "It can only route based on the HTTP method"
      - "It forces all backends to use the same programming language"
    answer: 0
    explanation: |
      Because all traffic flows through it, a bad config push, CPU-heavy
      transform, or plugin bug can affect every API. Treat gateway config as
      production code: version, review, roll out gradually.
    ref: "concepts.md#gateway-responsibilities"

  - id: api-gateways-and-bff-009
    difficulty: beginner
    tags: [routing, path-based]
    question: |
      A gateway rule maps `GET /api/orders/*` to `orders-service` and
      `POST /api/payments/*` to `payments-service`. What kind of routing is this?
    options:
      - "Host-based routing"
      - "Path-based routing"
      - "Weighted/canary routing"
      - "Header-based routing"
    answer: 1
    explanation: |
      Matching on the URL path prefix to select an upstream service is
      path-based routing, the most common style for HTTP APIs.
    ref: "concepts.md#routing-and-dispatch"

  - id: api-gateways-and-bff-010
    difficulty: intermediate
    tags: [routing, rewrite]
    question: |
      A client sends `GET /api/v2/orders/42` and the orders service receives
      `GET /orders/42`. What did the gateway do?
    options:
      - "Redirected the client with a 301"
      - "Aggregated multiple services"
      - "Path rewriting — stripped the `/api/v2` prefix before forwarding to the upstream"
      - "Terminated the TLS connection twice"
    answer: 2
    explanation: |
      Path/prefix rewriting lets the public path stay stable while the internal
      route differs. The gateway rewrote `/api/v2/orders/42` to `/orders/42`.
    ref: "concepts.md#routing-and-dispatch"

  - id: api-gateways-and-bff-011
    difficulty: intermediate
    tags: [routing, canary, deployment]
    question: |
      Routing 5% of `/api/orders` traffic to `orders-v2` and 95% to
      `orders-v1` is an example of what?
    options:
      - "TLS passthrough"
      - "Weighted/canary routing for a gradual release"
      - "Rate limiting"
      - "Response transformation"
    answer: 1
    explanation: |
      Weight-based routing enables canary and blue-green releases by sending a
      small percentage of traffic to a new version. It is routing on message
      distribution, not business logic.
    ref: "concepts.md#routing-and-dispatch"

  - id: api-gateways-and-bff-012
    difficulty: advanced
    tags: [routing, config, gotcha]
    question: |
      A team reports that after adding a catch-all `/*` route near the top of
      their gateway config, several specific routes stopped working. What
      happened?
    options:
      - "TLS termination failed for the specific routes"
      - "The gateway ran out of memory"
      - "The specific routes needed OAuth and the catch-all didn't"
      - "The greedy `/*` route matched first and shadowed the more specific routes placed after it"
    answer: 3
    explanation: |
      Routing rules are ordered/specificity-matched. A greedy catch-all placed
      too early shadows everything after it — put specific routes first.
    ref: "concepts.md#routing-and-dispatch"

  - id: api-gateways-and-bff-013
    difficulty: beginner
    tags: [tls, termination]
    question: |
      What does "TLS termination at the gateway" mean?
    options:
      - "The gateway blocks all HTTPS traffic"
      - "The gateway decrypts the inbound HTTPS connection at the edge so it can inspect, route, and transform the request"
      - "The gateway forwards encrypted bytes without decrypting them"
      - "The gateway upgrades HTTP requests to HTTPS via redirect"
    answer: 1
    explanation: |
      TLS termination means the gateway decrypts HTTPS at the edge. This lets it
      read headers/path/body to route, authenticate, and transform, and
      centralizes certificate and cipher management.
    ref: "concepts.md#tls-termination"

  - id: api-gateways-and-bff-014
    difficulty: intermediate
    tags: [tls, passthrough, comparison]
    question: |
      In TLS passthrough mode, what does the backend see?
    options:
      - "Plaintext HTTP over a trusted network"
      - "A brand-new TLS session created by the gateway"
      - "The client's original TLS connection — the gateway forwards encrypted bytes and cannot inspect the request"
      - "Only the HTTP status line"
    answer: 2
    explanation: |
      With passthrough (L4 forwarding), the gateway relays the encrypted bytes
      and cannot inspect them; the backend terminates the client's original TLS.
      This precludes L7 routing/transform at the edge.
    ref: "concepts.md#tls-termination"

  - id: api-gateways-and-bff-015
    difficulty: intermediate
    tags: [tls, forwarded-headers, rfc-7239]
    question: |
      After the gateway terminates TLS, how does a backend learn the client's
      original IP address and scheme?
    options:
      - "Via forwarding headers the gateway injects, e.g. X-Forwarded-For / X-Forwarded-Proto or the RFC 7239 Forwarded header"
      - "The backend re-derives them from the TCP checksum"
      - "They are permanently lost after termination"
      - "The client resends them in the request body"
    answer: 0
    explanation: |
      After termination the backend can't see the original connection, so the
      gateway injects X-Forwarded-For / X-Forwarded-Proto (or the standardized
      Forwarded header, RFC 7239).
    ref: "concepts.md#tls-termination"

  - id: api-gateways-and-bff-016
    difficulty: advanced
    tags: [tls, security, spoofing]
    question: |
      Why must backends trust `X-Forwarded-For` only when it comes from the
      gateway?
    options:
      - "Because the header is deprecated by RFC 9110"
      - "Because the header can only hold one IP address"
      - "Because an arbitrary client could otherwise spoof its source IP or scheme to bypass IP allowlists or downgrade security checks"
      - "Because backends cannot parse comma-separated lists"
    answer: 2
    explanation: |
      If a backend blindly trusts client-supplied X-Forwarded-* it can be
      spoofed to bypass IP allowlists or force scheme downgrades. Terminate at a
      trusted edge and strip client-supplied forwarding headers.
    ref: "concepts.md#tls-termination"

  - id: api-gateways-and-bff-017
    difficulty: beginner
    tags: [tls, re-encryption]
    question: |
      What distinguishes TLS re-encryption (bridging) from plain termination?
    options:
      - "The gateway never decrypts the traffic"
      - "The gateway only supports HTTP/1.0"
      - "The client establishes two TLS sessions itself"
      - "The gateway decrypts, inspects, then re-encrypts to the backend over a new TLS session for defense in depth"
    answer: 3
    explanation: |
      Bridging/re-encryption decrypts at the edge (to inspect/route) then opens a
      fresh TLS session to the backend, keeping internal traffic encrypted as
      defense in depth.
    ref: "concepts.md#tls-termination"

  - id: api-gateways-and-bff-018
    difficulty: beginner
    tags: [auth, authentication, offload]
    question: |
      What does "authentication offload" at the gateway mean?
    options:
      - "The gateway validates the caller's credentials once and forwards a verified identity to backends so each service need not re-implement token handling"
      - "The gateway generates new user accounts automatically"
      - "The gateway disables authentication for internal traffic"
      - "The gateway stores user passwords in plaintext"
    answer: 0
    explanation: |
      Auth offload means the gateway verifies credentials (API key, JWT, OAuth
      token, mTLS) centrally and passes a verified identity downstream, so
      services don't each reimplement token validation.
    ref: "concepts.md#authentication-and-authorization-offload"

  - id: api-gateways-and-bff-019
    difficulty: intermediate
    tags: [auth, jwt, rfc-7519]
    question: |
      When verifying an incoming `Authorization: Bearer <jwt>` (RFC 7519) at the
      gateway, which checks are appropriate?
    options:
      - "Only that the token is non-empty"
      - "Verify the signature (via JWKS) plus claims like exp, iss, and aud, and map scopes to route access"
      - "Decode the payload but skip signature verification for speed"
      - "Reject any token that contains an aud claim"
    answer: 1
    explanation: |
      A JWT must be validated: signature (typically against the issuer's JWKS),
      expiry (exp), issuer (iss), audience (aud), and scope-to-route mapping.
      Skipping signature verification defeats the point.
    ref: "concepts.md#authentication-and-authorization-offload"

  - id: api-gateways-and-bff-020
    difficulty: intermediate
    tags: [auth, api-keys]
    question: |
      What is an API key best suited for, and what is its limitation?
    options:
      - "It is a strong cryptographic proof of user identity with no limits"
      - "It replaces TLS entirely"
      - "It identifies the application/plan (useful for quotas) but is weak as a security control on its own"
      - "It can only be sent in the request body, never a header"
    answer: 2
    explanation: |
      API keys identify the calling application/plan and are handy for quotas,
      but a static shared secret is weak security alone — it should be layered
      with TLS and often stronger auth.
    ref: "concepts.md#authentication-and-authorization-offload"

  - id: api-gateways-and-bff-021
    difficulty: advanced
    tags: [auth, authorization, bola, owasp]
    question: |
      Why should fine-grained, resource-level authorization (e.g. "user may edit
      order 42 only if they own it") generally NOT be enforced at the gateway?
    options:
      - "Because gateways cannot read the Authorization header"
      - "Because authorization is illegal at the edge"
      - "Because it would require the gateway to mint new JWTs"
      - "Because that check requires domain data the owning service holds; OWASP API1 (BOLA) is typically a service-side responsibility"
    answer: 3
    explanation: |
      Object-level authorization needs domain data (who owns order 42) that the
      service holds. OWASP API Security Top 10 (2023) API1 BOLA / API5 BFLA are
      usually service-side; the gateway does coarse scope/route gating.
    ref: "concepts.md#authentication-and-authorization-offload"

  - id: api-gateways-and-bff-022
    difficulty: advanced
    tags: [auth, defense-in-depth, security]
    question: |
      A system authenticates all requests at the gateway, but backend services
      are reachable on the internal network without re-checking identity. What
      is the risk?
    options:
      - "None — edge auth is always sufficient"
      - "An attacker who reaches a service directly (SSRF, misconfig, lateral movement) bypasses all edge auth; services should not blindly trust internal traffic"
      - "The gateway will double-charge the client for each request"
      - "TLS termination will silently fail"
    answer: 1
    explanation: |
      Gateway auth is necessary but not sufficient. If services trust "the
      internal network is already authenticated," an attacker reaching a service
      directly bypasses edge auth. Defense in depth: services re-verify identity.
    ref: "concepts.md#authentication-and-authorization-offload"

  - id: api-gateways-and-bff-023
    difficulty: intermediate
    tags: [auth, authorization, coarse-vs-fine]
    question: |
      Which authorization check is appropriate to enforce at the gateway?
    options:
      - "Whether the caller's token carries the scope required for the route (coarse-grained)"
      - "Whether the specific bank account belongs to the caller"
      - "Whether the order total qualifies for free shipping"
      - "Whether the user's subscription includes a specific catalog SKU"
    answer: 0
    explanation: |
      Coarse authorization — does the token's scope allow this route — is cheap
      and generic, so it fits the gateway. The others need per-resource domain
      data and belong in services.
    ref: "concepts.md#authentication-and-authorization-offload"

  - id: api-gateways-and-bff-024
    difficulty: beginner
    tags: [rate-limiting, status-code, 429]
    question: |
      Which HTTP status code should a gateway return when a client exceeds its
      rate limit?
    options:
      - "403 Forbidden"
      - "429 Too Many Requests"
      - "503 Service Unavailable"
      - "409 Conflict"
    answer: 1
    explanation: |
      429 Too Many Requests (RFC 6585, retained in RFC 9110's landscape) is the
      correct code for a client exceeding its per-client quota/throttle.
    ref: "concepts.md#rate-limiting-and-throttling"

  - id: api-gateways-and-bff-025
    difficulty: intermediate
    tags: [rate-limiting, retry-after, headers]
    question: |
      Which header should accompany a 429 response so a well-behaved client
      knows how long to wait before retrying?
    options:
      - "Content-Length"
      - "ETag"
      - "Cache-Control"
      - "Retry-After"
    answer: 3
    explanation: |
      Retry-After (RFC 9110) tells the client how many seconds (or an HTTP-date)
      to wait. Gateways also often emit RateLimit-Limit/Remaining/Reset headers.
    ref: "concepts.md#rate-limiting-and-throttling"

  - id: api-gateways-and-bff-026
    difficulty: intermediate
    tags: [rate-limiting, 429-vs-503]
    question: |
      When should a gateway return 503 instead of 429?
    options:
      - "When one specific client sends too many requests"
      - "Whenever a JWT is expired"
      - "When the server is experiencing overall overload / load-shedding that affects everyone, not one noisy client"
      - "When the requested resource does not exist"
    answer: 2
    explanation: |
      429 is per-client ("you sent too much"); 503 Service Unavailable signals
      server-side overload/shedding affecting all callers. Don't return 503 for a
      single noisy client.
    ref: "concepts.md#rate-limiting-and-throttling"

  - id: api-gateways-and-bff-027
    difficulty: advanced
    tags: [rate-limiting, algorithms, token-bucket]
    question: |
      Why is the token-bucket algorithm a common default for gateway rate
      limiting?
    options:
      - "It blocks all bursts and enforces a perfectly constant rate"
      - "It requires no state at all"
      - "It only works for a single client"
      - "It permits short bursts up to the bucket size while capping the average rate"
    answer: 3
    explanation: |
      Token bucket allows short bursts (up to bucket capacity) while limiting the
      long-run average rate — a good fit for real traffic. Leaky bucket smooths to
      a constant rate instead.
    ref: "concepts.md#rate-limiting-and-throttling"

  - id: api-gateways-and-bff-028
    difficulty: intermediate
    tags: [rate-limiting, quotas, distinctions]
    question: |
      Which statement best separates "rate limiting" from a "quota/plan"?
    options:
      - "They are the same thing with different names"
      - "Rate limiting protects against abuse/enforces fairness over short windows; a quota/plan is a commercial cap (e.g. 10k calls/day on the free tier)"
      - "Quotas are enforced by the client; rate limits by the server"
      - "Rate limiting only applies to GET requests"
    answer: 1
    explanation: |
      Rate limiting is about abuse protection/fairness on short windows; quotas
      are commercial caps (per plan/day); spike arrest caps concurrency. They
      have different windows and different 429 messaging.
    ref: "concepts.md#rate-limiting-and-throttling"

  - id: api-gateways-and-bff-029
    difficulty: beginner
    tags: [transformation, headers]
    question: |
      Which of the following is a legitimate gateway response transformation?
    options:
      - "Recomputing the order total from line items"
      - "Deciding whether a customer is eligible for a refund"
      - "Stripping internal headers like Server and X-Powered-By before returning the response to the client"
      - "Persisting the response to the primary database"
    answer: 2
    explanation: |
      Removing version-disclosing/internal headers is a structural, security-hygiene
      transform. Recomputing totals or refund eligibility is business logic that
      belongs in a service.
    ref: "concepts.md#request-and-response-transformation"

  - id: api-gateways-and-bff-030
    difficulty: intermediate
    tags: [transformation, error-normalization, rfc-9457]
    question: |
      A backend returns a raw HTML 500 error page. What is an appropriate
      gateway transformation?
    options:
      - "Forward the HTML unchanged to the client"
      - "Convert the 500 into a 200 with an empty body"
      - "Retry the request 100 times immediately"
      - "Normalize it into a consistent application/problem+json body (RFC 9457) so clients get one error shape"
    answer: 3
    explanation: |
      Error normalization to application/problem+json (RFC 9457) gives clients a
      single, machine-readable error contract regardless of which backend failed.
      Leaking raw HTML/stack traces is an anti-pattern.
    ref: "concepts.md#request-and-response-transformation"

  - id: api-gateways-and-bff-031
    difficulty: intermediate
    tags: [transformation, protocol-translation]
    question: |
      A gateway accepts REST/JSON from clients but calls backends over gRPC.
      What is this called?
    options:
      - "TLS passthrough"
      - "Canary routing"
      - "Object-level authorization"
      - "Protocol/format translation"
    answer: 3
    explanation: |
      Speaking one protocol/format at the edge (REST/JSON) and another
      internally (gRPC) is protocol translation — a structural transformation
      that keeps a clean public contract over messier internals.
    ref: "concepts.md#request-and-response-transformation"

  - id: api-gateways-and-bff-032
    difficulty: advanced
    tags: [transformation, structural-vs-semantic]
    question: |
      Which transformation crosses the line from "structural" into business
      logic that shouldn't live in a shared gateway?
    options:
      - "Injecting an X-Request-Id header for tracing"
      - "Renaming a response header"
      - "Parsing the request body to compute a domain field and branching on domain state"
      - "Stripping hop-by-hop headers"
    answer: 2
    explanation: |
      Header injection/renaming and stripping hop-by-hop headers are structural.
      Parsing the body to compute a business field and branch on domain state is
      semantic — business logic in disguise — and belongs in a service/BFF.
    ref: "concepts.md#request-and-response-transformation"

  - id: api-gateways-and-bff-033
    difficulty: beginner
    tags: [aggregation, composition]
    question: |
      What does API aggregation (gateway aggregation) do?
    options:
      - "Splits one service into many microservices"
      - "Encrypts the response body twice"
      - "Receives one client request, fans out to several services in parallel, and merges their responses into a single payload"
      - "Caches every response for 24 hours"
    answer: 2
    explanation: |
      Aggregation collapses N client round trips into one: the gateway/BFF fans
      out to several services (ideally in parallel) and merges the results into a
      single response.
    ref: "concepts.md#api-composition-and-aggregation"

  - id: api-gateways-and-bff-034
    difficulty: intermediate
    tags: [aggregation, mobile, latency]
    question: |
      Why is server-side aggregation especially valuable for mobile clients?
    options:
      - "Mobile devices cannot parse JSON"
      - "It disables TLS to save battery"
      - "It forces the client to make more requests"
      - "It collapses many high-latency client round trips into one, since service-to-service latency in the datacenter is tiny"
    answer: 3
    explanation: |
      On high-latency mobile networks, N sequential requests to build a screen
      is painful. Aggregating server-side (where inter-service latency is small)
      collapses them into a single client round trip.
    ref: "concepts.md#api-composition-and-aggregation"

  - id: api-gateways-and-bff-035
    difficulty: advanced
    tags: [aggregation, partial-failure, resilience]
    question: |
      During aggregation for a home screen, the recommendations service times
      out but profile and orders succeed. What is the best-practice approach?
    options:
      - "Block the entire response indefinitely until recommendations respond"
      - "Return a 500 for the whole request every time any dependency is slow"
      - "Use per-call timeouts and graceful degradation — return the available data and omit/mark the failed part rather than failing the whole screen"
      - "Silently return an empty response with status 204"
    answer: 2
    explanation: |
      Don't let one slow dependency block the whole screen. Per-call timeouts and
      graceful degradation (partial results) keep the experience usable — which is
      exactly why aggregation often lives in a client-owned BFF.
    ref: "concepts.md#api-composition-and-aggregation"

  - id: api-gateways-and-bff-036
    difficulty: advanced
    tags: [aggregation, orchestration, sagas]
    question: |
      Which statement about aggregation vs orchestration is correct?
    options:
      - "Read-side fan-out/merge is a reasonable gateway/BFF job, but multi-step write orchestration with compensation (sagas) is business logic that belongs in a service"
      - "Both aggregation and saga orchestration always belong in the gateway"
      - "Aggregation requires a distributed transaction coordinator"
      - "Orchestration is simpler than aggregation and should live at the edge"
    answer: 0
    explanation: |
      Aggregation (read fan-out/merge) suits the edge; multi-step write
      orchestration with compensation logic (sagas) is stateful business logic
      that belongs in a service, not the gateway.
    ref: "concepts.md#api-composition-and-aggregation"

  - id: api-gateways-and-bff-037
    difficulty: intermediate
    tags: [aggregation, graphql]
    question: |
      How does a GraphQL layer relate to gateway aggregation?
    options:
      - "It is unrelated to aggregation"
      - "It eliminates the need for any backend services"
      - "It only works for write operations"
      - "It is an alternative aggregation approach where the client specifies exactly which fields across services it wants in one query, trading more flexibility for more caching/complexity/security surface"
    answer: 3
    explanation: |
      GraphQL shifts composition to a schema/resolver layer: clients ask for
      exactly the fields they need in one query. It is more flexible than a
      hand-rolled aggregator but adds caching, query-cost, and security concerns.
    ref: "concepts.md#api-composition-and-aggregation"

  - id: api-gateways-and-bff-038
    difficulty: beginner
    tags: [bff, definition]
    question: |
      What is the Backend-for-Frontend (BFF) pattern?
    options:
      - "A single general-purpose API shared by all client types"
      - "A frontend framework for rendering HTML"
      - "Building one backend per client experience (e.g. a web BFF, an iOS BFF), each tailored to and often owned by that frontend's team"
      - "A database replication strategy"
    answer: 2
    explanation: |
      BFF means one backend per client experience rather than one general-purpose
      API. Each BFF shapes payloads and aggregation for its client and lets that
      client's needs evolve independently.
    ref: "concepts.md#the-backend-for-frontend-bff-pattern"

  - id: api-gateways-and-bff-039
    difficulty: intermediate
    tags: [bff, motivation]
    question: |
      Which problem most directly motivates adopting a BFF?
    options:
      - "TLS certificates expiring too often"
      - "Services being written in too few languages"
      - "The gateway being unable to terminate TLS"
      - "A single general-purpose backend gets pulled in conflicting directions by mobile, web, and partner clients — leading to over-fetching and ?include= flag sprawl"
    answer: 3
    explanation: |
      One backend serving mobile, web, and partners simultaneously causes
      over-fetching, include-flag sprawl, and a bottleneck team. A BFF per client
      lets each client's contract evolve independently.
    ref: "concepts.md#the-backend-for-frontend-bff-pattern"

  - id: api-gateways-and-bff-040
    difficulty: intermediate
    tags: [bff, gateway, comparison]
    question: |
      Which statement best captures the difference between an API gateway and a
      BFF?
    options:
      - "They are identical; BFF is just a newer name for gateway"
      - "A BFF handles TLS termination and a gateway handles payload shaping"
      - "A gateway is a shared infrastructure front door for generic cross-cutting concerns; a BFF is an application-tier backend owned by a frontend team that shapes payloads for one client"
      - "A gateway is owned by the frontend team and a BFF by the platform team"
    answer: 2
    explanation: |
      The gateway is infra-tier (generic cross-cutting: authN, rate limit,
      routing), typically platform-owned. A BFF is app-tier, frontend-team-owned,
      and shapes/aggregates for one client. Real systems use both.
    ref: "concepts.md#the-backend-for-frontend-bff-pattern"

  - id: api-gateways-and-bff-041
    difficulty: advanced
    tags: [bff, trade-offs, duplication]
    question: |
      A common criticism of BFFs is code duplication across each client's
      backend. What is the recommended mitigation?
    options:
      - "Collapse all BFFs back into one general-purpose backend"
      - "Stop using BFFs entirely and let clients call services directly"
      - "Duplicate the domain services instead"
      - "Extract shared logic into libraries, rather than merging the BFFs (which would recreate the general-purpose-backend problem)"
    answer: 3
    explanation: |
      Duplication is mitigated with shared libraries, not by collapsing BFFs into
      one — collapsing recreates the very general-purpose-backend problem the BFF
      was solving. Also group by client class to avoid proliferation.
    ref: "concepts.md#the-backend-for-frontend-bff-pattern"

  - id: api-gateways-and-bff-042
    difficulty: intermediate
    tags: [bff, topology]
    question: |
      Which topology is typical when using both a gateway and BFFs?
    options:
      - "Clients → domain services → BFF → gateway"
      - "BFFs at the edge → gateway → clients"
      - "A single gateway that also serves as the system of record"
      - "Gateway at the very edge (TLS, authN, global rate limit) → per-client BFFs → domain services"
    answer: 3
    explanation: |
      A common layout: a gateway at the very edge handles generic concerns, then
      per-client BFFs shape/aggregate, then domain services hold the business
      logic and data.
    ref: "concepts.md#the-backend-for-frontend-bff-pattern"

  - id: api-gateways-and-bff-043
    difficulty: advanced
    tags: [bff, anti-pattern, ownership]
    question: |
      Which practice undermines the BFF pattern?
    options:
      - "Letting each frontend team own its BFF"
      - "Using the BFF to aggregate calls for a specific screen"
      - "Reshaping payloads to what the client renders"
      - "Turning the BFF into the system of record and putting core business rules there instead of in domain services"
    answer: 3
    explanation: |
      A BFF should orchestrate and shape, not become the system of record or hold
      core business rules — those stay in the domain services. Aggregation and
      payload shaping are its proper jobs.
    ref: "concepts.md#the-backend-for-frontend-bff-pattern"

  - id: api-gateways-and-bff-044
    difficulty: intermediate
    tags: [mesh, gateway, north-south, east-west]
    question: |
      What is the key distinction between an API gateway and a service mesh?
    options:
      - "A gateway handles east-west (service-to-service) traffic; a mesh handles north-south"
      - "They are the same technology"
      - "A gateway handles north-south (external client ↔ system) traffic at the edge; a service mesh handles east-west (service ↔ service) traffic internally via sidecars"
      - "A service mesh cannot do mTLS"
    answer: 2
    explanation: |
      Gateway = north-south ingress at the edge. Service mesh = east-west
      internal service-to-service traffic via sidecar proxies (mTLS, retries,
      circuit breaking). They are complementary.
    ref: "concepts.md#gateway-vs-load-balancer-vs-reverse-proxy-vs-service-mesh"

  - id: api-gateways-and-bff-045
    difficulty: intermediate
    tags: [load-balancer, layer, comparison]
    question: |
      How does an L4 load balancer differ from an API gateway?
    options:
      - "An L4 load balancer performs OAuth token introspection"
      - "An API gateway cannot route requests"
      - "An L4 load balancer distributes TCP/UDP traffic across instances without reading HTTP, whereas a gateway is API-aware and adds authN/Z, quotas, and transformation"
      - "They operate at exactly the same layer with identical features"
    answer: 2
    explanation: |
      An L4 LB balances TCP/UDP for scale/HA without inspecting HTTP. A gateway
      operates at L7 and adds the API-management layer (auth, quotas, routing,
      transformation, aggregation).
    ref: "concepts.md#gateway-vs-load-balancer-vs-reverse-proxy-vs-service-mesh"

  - id: api-gateways-and-bff-046
    difficulty: intermediate
    tags: [reverse-proxy, comparison]
    question: |
      How does an API gateway relate to a generic reverse proxy (e.g. NGINX,
      HAProxy)?
    options:
      - "They are unrelated; a gateway is a database"
      - "A reverse proxy cannot terminate TLS but a gateway can"
      - "A gateway is a subset of a reverse proxy with fewer features"
      - "A gateway is a reverse proxy plus API-management features like keys, plans, quotas, developer portals, and aggregation"
    answer: 3
    explanation: |
      A gateway is a specialized reverse proxy: it forwards/caches/terminates TLS
      like any reverse proxy, but adds API-management (keys, plans, quotas,
      aggregation, developer-facing concerns).
    ref: "concepts.md#gateway-vs-load-balancer-vs-reverse-proxy-vs-service-mesh"

  - id: api-gateways-and-bff-047
    difficulty: advanced
    tags: [mesh, gateway, complementary]
    question: |
      "Isn't a service mesh a replacement for an API gateway?" What is the best
      answer?
    options:
      - "Yes — a mesh fully replaces the need for a gateway"
      - "Yes, because both use the same sidecar model"
      - "No, because a mesh only works with monoliths"
      - "No — the mesh governs internal east-west service-to-service traffic while the gateway governs external north-south ingress; many systems run both"
    answer: 3
    explanation: |
      They solve different problems: mesh = internal east-west (mTLS, retries,
      circuit breaking); gateway = external north-south ingress. They complement
      each other rather than one replacing the other.
    ref: "concepts.md#gateway-vs-load-balancer-vs-reverse-proxy-vs-service-mesh"

  - id: api-gateways-and-bff-048
    difficulty: intermediate
    tags: [load-balancer, l7, boundary]
    question: |
      "Isn't an API gateway just an L7 load balancer?" Which response is
      correct?
    options:
      - "Yes, they are functionally identical"
      - "No — an L7 LB routes/balances HTTP, but a gateway adds the API-management layer: authN/Z, quotas/plans, request/response transformation, aggregation, and developer-facing concerns"
      - "No — an L7 load balancer operates at layer 4"
      - "Yes, but only for GET requests"
    answer: 1
    explanation: |
      An L7 LB routes and balances HTTP; a gateway adds authentication,
      authorization, quotas/plans, transformation, aggregation, and developer
      concerns. Overlapping mechanics, different job.
    ref: "concepts.md#gateway-vs-load-balancer-vs-reverse-proxy-vs-service-mesh"

  - id: api-gateways-and-bff-049
    difficulty: beginner
    tags: [anti-patterns, business-logic]
    question: |
      What is the cardinal anti-pattern for API gateways?
    options:
      - "Terminating TLS at the edge"
      - "Emitting distributed-trace headers"
      - "Rate limiting per API key"
      - "Putting domain/business logic (e.g. 'if cart total > $500 apply discount') into the shared gateway"
    answer: 3
    explanation: |
      Business logic in the gateway couples the shared edge to one domain,
      widens blast radius, misplaces ownership, and hurts testability. Keep
      domain rules in services.
    ref: "concepts.md#gateway-anti-patterns"

  - id: api-gateways-and-bff-050
    difficulty: advanced
    tags: [anti-patterns, esb, smart-pipes]
    question: |
      Piling orchestration, heavy mediation, and business rules into the gateway
      recreates which older anti-pattern, and violates which modern principle?
    options:
      - "The CDN anti-pattern; violates 'cache everything'"
      - "The sidecar anti-pattern; violates 'east-west first'"
      - "The Enterprise Service Bus (ESB) anti-pattern; violates 'smart endpoints, dumb pipes'"
      - "The monorepo anti-pattern; violates 'one repo per service'"
    answer: 2
    explanation: |
      An overambitious "god gateway" recreates the ESB — a smart, central,
      fragile bottleneck. Modern guidance is "smart endpoints, dumb pipes": keep
      the gateway thin.
    ref: "concepts.md#gateway-anti-patterns"

  - id: api-gateways-and-bff-051
    difficulty: intermediate
    tags: [anti-patterns, leaking-internals, security]
    question: |
      Which of these is an anti-pattern where the gateway leaks internals to
      clients?
    options:
      - "Injecting an X-Request-Id for correlation"
      - "Returning application/problem+json error bodies"
      - "Passing backend stack traces, internal hostnames, and Server/X-Powered-By headers straight through to clients"
      - "Adding X-Forwarded-For for the backend"
    answer: 2
    explanation: |
      Leaking stack traces, internal hostnames, and version-disclosing headers
      helps attackers and breaks the clean public contract. The gateway should
      strip internals and normalize errors.
    ref: "concepts.md#gateway-anti-patterns"

  - id: api-gateways-and-bff-052
    difficulty: advanced
    tags: [anti-patterns, litmus-test]
    question: |
      According to the litmus test for "does this belong in the gateway?", which
      rule indicates business logic that should live in a service?
    options:
      - "A rule that changes when the security policy changes"
      - "A rule that changes when the traffic/throttling policy changes"
      - "A rule that changes when the business changes"
      - "A rule that changes when a TLS certificate is rotated"
    answer: 2
    explanation: |
      Litmus test: if the rule changes when the business changes, it's business
      logic (service). If it changes with network/security/traffic policy, it's a
      gateway concern.
    ref: "concepts.md#gateway-anti-patterns"

  - id: api-gateways-and-bff-053
    difficulty: intermediate
    tags: [anti-patterns, spof, availability]
    question: |
      How should a team avoid the gateway being a single point of failure?
    options:
      - "Run a single large gateway instance to simplify config"
      - "Move all business logic into the gateway for efficiency"
      - "Disable health checks to reduce overhead"
      - "Run it redundantly behind a load balancer, keep the data plane simple/stateless, externalize state (e.g. rate-limit counters), and roll config out gradually with fast rollback"
    answer: 3
    explanation: |
      The edge must be at least as available as anything behind it: redundant
      instances behind an LB, simple stateless data plane, externalized state,
      and gradual config rollout with fast rollback.
    ref: "concepts.md#gateway-anti-patterns"

  - id: api-gateways-and-bff-054
    difficulty: intermediate
    tags: [anti-patterns, chatty, aggregation]
    question: |
      What is the "chatty gateway" / N+1 aggregation anti-pattern?
    options:
      - "Emitting too many log lines per request"
      - "Terminating too many TLS connections"
      - "Using too many API keys"
      - "Fanning out to many services per request without parallelism, timeouts, or partial-failure handling"
    answer: 3
    explanation: |
      Aggregation done poorly — sequential fan-out to many services with no
      parallelism, timeouts, or graceful degradation — inflates latency and
      couples availability to every dependency.
    ref: "concepts.md#gateway-anti-patterns"

  - id: api-gateways-and-bff-055
    difficulty: beginner
    tags: [observability, responsibilities]
    question: |
      Why is the gateway a natural place for observability (metrics, access logs,
      trace headers)?
    options:
      - "Because it is the only component that can write to disk"
      - "Because services are forbidden from logging"
      - "Because all external traffic flows through it, so it can emit consistent metrics/logs and inject/propagate distributed-trace headers centrally"
      - "Because it replaces the need for any monitoring in services"
    answer: 2
    explanation: |
      Since every external request passes through the gateway, it is a central
      vantage point for consistent metrics, access logs, and trace-header
      injection/propagation across the request lifecycle.
    ref: "concepts.md#gateway-responsibilities"

  - id: api-gateways-and-bff-056
    difficulty: intermediate
    tags: [scenario, gateway-vs-service, design]
    question: |
      A team wants to enforce "only premium-tier customers can access
      /api/reports". They have a JWT with a `tier` claim. Where should this be
      enforced, and how?
    options:
      - "In the gateway, by parsing the reports database to check the tier"
      - "Only inside the client app before sending the request"
      - "At the gateway as a coarse check on the token's tier claim/scope gating the route — it depends only on identity, not resource data"
      - "Nowhere — tier checks are impossible with JWTs"
    answer: 2
    explanation: |
      A route-level gate on a token claim (tier/scope) is coarse authorization
      that depends only on the verified identity, not resource data — a good fit
      for the gateway. It needs no domain lookup.
    ref: "concepts.md#authentication-and-authorization-offload"

  - id: api-gateways-and-bff-057
    difficulty: advanced
    tags: [scenario, bff, design]
    question: |
      A mobile team needs a compact home-screen payload aggregating profile,
      recent orders, and recommendations, with graceful degradation when one
      service is slow. Which approach fits best?
    options:
      - "Add the aggregation and partial-failure logic to the shared platform gateway config"
      - "Have the mobile client make three separate calls and merge on-device with no timeouts"
      - "Put the aggregation logic inside the recommendations service"
      - "Build a mobile BFF owned by the mobile team that aggregates and encodes the product decisions about partial failure and payload shape"
    answer: 3
    explanation: |
      Client-specific aggregation with product-driven partial-failure behavior
      belongs in a client-owned BFF, not the shared gateway (which shouldn't hold
      client-specific logic) and not one domain service.
    ref: "concepts.md#the-backend-for-frontend-bff-pattern"

  - id: api-gateways-and-bff-058
    difficulty: intermediate
    tags: [scenario, transformation, contract]
    question: |
      An internal service exposes a messy field name `usr_ord_cnt`, but the
      public API should show `orderCount`. Where is the cleanest place to make
      the public contract nice without changing the service?
    options:
      - "Force every client to map the field themselves"
      - "Rename the database column in production immediately"
      - "Return both fields and let clients guess"
      - "A response transformation (in the gateway for a simple rename, or a BFF for heavier client-specific reshaping) that presents orderCount publicly"
    answer: 3
    explanation: |
      Response transformation keeps a clean public contract over messy internals.
      A simple rename can sit in the gateway; heavier per-client reshaping is a
      BFF job. Either way the service need not change.
    ref: "concepts.md#request-and-response-transformation"

  - id: api-gateways-and-bff-059
    difficulty: expert
    tags: [rate-limiting, headers, ietf-draft, standards]
    question: |
      A 2025 gateway emits `RateLimit-Policy: "burst";q=100;w=60` and
      `RateLimit: "burst";r=0;t=30`. Which reading is correct?
    options:
      - "The policy 'burst' allows a quota of 100 per 60-second window; 0 requests remain and the window resets in 30 seconds"
      - "100 requests remain, the window is 30 seconds, and the reset happened 60 seconds ago"
      - "The client may burst 60 requests then must wait 100 seconds"
      - "q and w are quota and weight; r and t are retry count and total"
    answer: 0
    explanation: |
      Under draft-ietf-httpapi-ratelimit-headers (RFC 9651 Structured Fields),
      RateLimit-Policy carries q=quota and w=window(seconds); RateLimit carries
      r=remaining and t=reset-window(seconds). So quota 100/60s, 0 remaining,
      resets in 30s. This replaced the legacy RateLimit-Limit/Remaining/Reset triplet.
    ref: "concepts.md#rate-limiting-and-throttling"

  - id: api-gateways-and-bff-060
    difficulty: advanced
    tags: [rate-limiting, headers, legacy, standards]
    question: |
      A candidate insists the "modern standard" rate-limit headers are
      `X-RateLimit-Limit` / `X-RateLimit-Remaining`. What is the accurate correction?
    options:
      - "Those are correct and current; nothing to fix"
      - "X-RateLimit-* is the oldest, never-standardized convention; the RateLimit-Limit/Remaining/Reset triplet is a legacy IETF form; the current draft uses structured RateLimit and RateLimit-Policy headers"
      - "X-RateLimit-* was standardized in RFC 9110 and is authoritative"
      - "The only valid rate-limit header in any era is Content-Range"
    answer: 1
    explanation: |
      There are three generations: the widely-deployed but never-standardized
      X-RateLimit-*; the legacy tripartite RateLimit-Limit/Remaining/Reset; and
      the current IETF draft's Structured-Fields RateLimit + RateLimit-Policy.
      Only Retry-After (RFC 9110) is a stable normative header.
    ref: "concepts.md#rate-limiting-and-throttling"

  - id: api-gateways-and-bff-061
    difficulty: expert
    tags: [resilience, retries, idempotency, failure-mode]
    question: |
      A gateway is configured to retry any 5xx or timeout up to 3 times. A client
      sends `POST /payments`. The first attempt actually succeeds at the backend
      but the response is lost to a network blip. What is the danger?
    options:
      - "None — retries are always safe because the client asked for them"
      - "The retry duplicates the payment because POST is non-idempotent; retries should be limited to idempotent methods or guarded by an Idempotency-Key"
      - "The gateway will downgrade the request to GET on retry"
      - "The 429 header will be omitted"
    answer: 1
    explanation: |
      Retrying a non-idempotent POST after a lost response can perform the write
      twice (double-charge). Retries should be confined to idempotent/safe methods
      (GET/PUT/DELETE per RFC 9110) or made safe with an Idempotency-Key.
    ref: "concepts.md#resilience-patterns-at-the-edge"

  - id: api-gateways-and-bff-062
    difficulty: expert
    tags: [resilience, retry-storm, budget]
    question: |
      During a partial backend outage, every gateway node retries failed requests
      3x with no coordination, and the backend gets worse. What is the root cause
      and the correct fix?
    options:
      - "The TLS handshake is too slow; disable TLS on retries"
      - "Fixed per-request retry counts create a retry storm that multiplies load 3-4x exactly when the backend is weakest; use a retry budget (cap retries as a % of traffic) plus backoff and jitter"
      - "The gateway needs more routes; add a catch-all"
      - "Retries never affect load; the outage is a coincidence"
    answer: 1
    explanation: |
      Naïve fixed retry counts amplify load precisely during a brownout, turning a
      partial failure into a full one. A retry budget caps retries as a fraction of
      total traffic; exponential backoff with jitter spreads them out. A circuit
      breaker sheds the failing dependency entirely.
    ref: "concepts.md#resilience-patterns-at-the-edge"

  - id: api-gateways-and-bff-063
    difficulty: advanced
    tags: [resilience, bulkhead, circuit-breaker]
    question: |
      One slow upstream is consuming all of the gateway's connections, starving
      unrelated routes. Which pattern most directly prevents this?
    options:
      - "Bulkhead isolation — give each upstream its own connection pool/concurrency limit so one dependency can't exhaust shared resources"
      - "TLS re-encryption to the slow upstream"
      - "Returning 301 redirects for the slow route"
      - "Increasing the global timeout to infinity"
    answer: 0
    explanation: |
      The bulkhead pattern (ship-compartment metaphor) isolates each upstream's
      resources so a single slow dependency can't drain the whole pool and take
      down unrelated routes. A circuit breaker complements it by failing fast.
    ref: "concepts.md#resilience-patterns-at-the-edge"

  - id: api-gateways-and-bff-064
    difficulty: expert
    tags: [caching, security, shared-cache, data-leak]
    question: |
      A shared edge cache keys responses on method + URL only and caches a
      `GET /me/balance` response that required `Authorization`. What is the
      consequence?
    options:
      - "Better performance with no downside"
      - "User A's cached balance is served to user B — a cross-tenant data leak; personalized responses need Cache-Control: private (or no-store) or a user-scoped cache key plus correct Vary"
      - "The cache will refuse to store any authenticated response automatically"
      - "The Authorization header is echoed to all clients"
    answer: 1
    explanation: |
      A shared cache that ignores identity in its key serves one user's
      personalized response to another. Personalized/authenticated responses must
      use Cache-Control: private or no-store, or include the user in the cache key,
      with correct Vary. This is the classic edge-cache data-leak failure mode.
    ref: "concepts.md#edge-caching-rfc-9111"

  - id: api-gateways-and-bff-065
    difficulty: advanced
    tags: [caching, s-maxage, rfc-9111]
    question: |
      What does `Cache-Control: max-age=60, s-maxage=600` instruct?
    options:
      - "Browsers cache for 600s and shared caches for 60s"
      - "All caches must revalidate every 60s"
      - "Private (browser) caches use 60s freshness; shared caches (gateway/CDN) use 600s because s-maxage overrides max-age for shared caches only"
      - "The response cannot be cached at all"
    answer: 2
    explanation: |
      s-maxage (RFC 9111) applies only to shared caches and overrides max-age for
      them. Here a browser treats the response as fresh for 60s while a shared
      gateway/CDN cache treats it as fresh for 600s.
    ref: "concepts.md#edge-caching-rfc-9111"

  - id: api-gateways-and-bff-066
    difficulty: expert
    tags: [caching, stale-while-revalidate, rfc-5861]
    question: |
      A response carries `Cache-Control: max-age=30, stale-while-revalidate=120`.
      A request arrives 40 seconds after the response was cached. What does a
      conforming shared cache do?
    options:
      - "Block the client while it fetches a fresh copy from the origin"
      - "Return a 504 because the entry is stale"
      - "Serve the stale cached copy immediately and revalidate asynchronously in the background, since 40s is within max-age(30)+swr(120)"
      - "Delete the entry and return 404"
    answer: 2
    explanation: |
      stale-while-revalidate (RFC 5861) lets the cache serve stale content
      instantly for up to 120s past freshness while it refreshes in the
      background, avoiding a latency spike. stale-if-error similarly serves stale
      content on an origin error.
    ref: "concepts.md#edge-caching-rfc-9111"

  - id: api-gateways-and-bff-067
    difficulty: expert
    tags: [caching, request-collapsing, thundering-herd]
    question: |
      A hot cache key expires and 10,000 concurrent requests hit the edge as a
      cache miss simultaneously. Which technique prevents them all from hammering
      the origin?
    options:
      - "Request collapsing/coalescing — merge the concurrent identical misses into a single upstream fetch that fills the cache and fans back out"
      - "Aggregation — fan the one request out to more services"
      - "Round-robin load balancing across origins"
      - "Returning 429 to 9,999 of them"
    answer: 0
    explanation: |
      Request collapsing (coalescing/dedup) folds concurrent identical misses into
      one origin fetch, preventing a cache stampede/thundering herd. It is the
      mirror image of aggregation (which fans out). Pairing it with
      stale-while-revalidate further shields the origin.
    ref: "concepts.md#request-collapsing--coalescing"

  - id: api-gateways-and-bff-068
    difficulty: advanced
    tags: [caching, vary, cache-key]
    question: |
      An API serves gzip and identity encodings from the same URL but omits
      `Vary: Accept-Encoding`. What breaks at a shared cache?
    options:
      - "Nothing; Vary is optional and inferred"
      - "The cache may serve a gzip-encoded body to a client that didn't request compression (or vice versa), because encoding isn't part of the cache key"
      - "The cache will double-compress every response"
      - "TLS termination fails"
    answer: 1
    explanation: |
      The cache key must incorporate whatever the response varies on. Without
      Vary: Accept-Encoding, the cache can return the wrong variant (e.g. a gzip
      body to a client that can't decode it). Correct Vary construction is
      essential; over-broad Vary instead destroys hit rate.
    ref: "concepts.md#edge-caching-rfc-9111"

  - id: api-gateways-and-bff-069
    difficulty: expert
    tags: [graphql, federation, n-plus-one]
    question: |
      In a federated GraphQL setup, a query returns a list of 100 orders and each
      order resolves its `customer` field with a separate call to the users
      subgraph. What problem is this and how is it addressed?
    options:
      - "Tail-latency amplification; fix with TLS passthrough"
      - "The resolver N+1 problem; batch the lookups (dataloader) so the 100 customer fetches collapse into one or few calls"
      - "A CORS preflight storm; raise Access-Control-Max-Age"
      - "A retry storm; add a circuit breaker"
    answer: 1
    explanation: |
      Firing one downstream call per list item is the classic GraphQL resolver
      N+1. Batching/dataloader coalesces the per-item lookups into a single (or
      few) batched call to the subgraph, a key operational concern of federation.
    ref: "concepts.md#graphql-federation-as-an-aggregationbff-alternative"

  - id: api-gateways-and-bff-070
    difficulty: expert
    tags: [graphql, federation, rest-bff, design]
    question: |
      Choosing GraphQL federation over a set of REST BFFs for a multi-client
      product primarily buys you which trade-off?
    options:
      - "You avoid hand-maintaining N bespoke aggregators and let teams own subgraphs, at the cost of an extra router hop, harder HTTP caching, and needing query-cost/depth limits and persisted queries"
      - "It eliminates all authentication concerns"
      - "It removes the need for any backend services"
      - "It guarantees strong cross-service transactional consistency"
    answer: 0
    explanation: |
      Federation replaces N hand-rolled aggregators with subgraph-owned schemas
      composed by a router, but adds a router hop, complicates HTTP caching
      (queries POSTed to one endpoint; persisted queries restore cacheability),
      and requires query-cost/depth limiting to prevent abuse.
    ref: "concepts.md#graphql-federation-as-an-aggregationbff-alternative"

  - id: api-gateways-and-bff-071
    difficulty: advanced
    tags: [waf, gateway, security, layering, owasp]
    question: |
      A design has a WAF, an API gateway, and a service mesh in the request path.
      What does each do and in what order?
    options:
      - "Mesh → gateway → WAF; the mesh authenticates external users"
      - "WAF → API gateway → service mesh: the WAF blocks attack payloads (SQLi/XSS/OWASP-web, bots/DDoS), the gateway does API management (authN/Z, quotas, routing), the mesh secures east-west service-to-service traffic (mTLS, retries)"
      - "They are interchangeable; any order works identically"
      - "WAF → mesh → gateway; the WAF terminates TLS for internal services"
    answer: 1
    explanation: |
      Order is WAF (is this malicious?) → API gateway (is this caller allowed and
      within limits?) → service mesh (how do internal services talk securely?).
      Conflating WAF and gateway maps to OWASP API8 Security Misconfiguration.
    ref: "concepts.md#waf-vs-api-gateway-security-layering"

  - id: api-gateways-and-bff-072
    difficulty: expert
    tags: [bff, security, oauth, spa, xss]
    question: |
      A SPA stores its OAuth access and refresh tokens in `localStorage`. A
      security review flags it. What is the recommended pattern and why?
    options:
      - "Move the tokens to a JavaScript cookie without flags — same protection, simpler"
      - "Encrypt the tokens in localStorage with a key also in localStorage"
      - "Use a token-handling BFF that holds the tokens server-side and issues the browser only an HttpOnly, Secure, SameSite session cookie, so tokens never reach JS and can't be exfiltrated by XSS"
      - "Store tokens in the URL fragment so they aren't sent to servers"
    answer: 2
    explanation: |
      Tokens readable by JS are exfiltratable by any XSS. A token-handling BFF
      keeps access/refresh tokens server-side and gives the browser an HttpOnly
      (script-unreadable) session cookie, removing the highest-value XSS target.
      The trade-off is defending CSRF via SameSite/CSRF tokens.
    ref: "concepts.md#bff-as-a-security-pattern-token-handling-bff-for-spas"

  - id: api-gateways-and-bff-073
    difficulty: expert
    tags: [token-exchange, phantom-token, security]
    question: |
      A gateway issues clients an opaque reference token but forwards a signed JWT
      to backends after introspection. What pattern is this and what does it buy?
    options:
      - "Split token; it doubles the token size"
      - "Phantom token; the client never sees JWT internals (no claims/signature to attack or leak) and revocation is easy via the opaque reference, while backends still get a verifiable JWT"
      - "mTLS bridging; it removes the need for any token"
      - "Token passthrough; the backend and client share the same token"
    answer: 1
    explanation: |
      The phantom-token pattern hands clients an opaque reference and swaps in a
      JWT at the gateway for backends. JWT internals stay off the public wire,
      revocation is simple (revoke the reference), and backends still verify a
      standard JWT. RFC 8693 token exchange additionally enables downscoping.
    ref: "concepts.md#bff-as-a-security-pattern-token-handling-bff-for-spas"

  - id: api-gateways-and-bff-074
    difficulty: expert
    tags: [jwt, security, alg-none, algorithm-confusion, owasp]
    question: |
      "A gateway validates JWTs — describe two ways an attacker still gets in."
      Which pair of attacks is correct?
    options:
      - "Expired-token replay and CORS preflight bypass"
      - "The alg=none attack (forged token drops the signature and sets alg to none) and RS256→HS256 algorithm confusion (signing with the public key as an HMAC secret) — both defeated by pinning the expected algorithm rather than trusting the token's alg"
      - "Rate-limit exhaustion and TLS downgrade"
      - "SNI spoofing and cache poisoning"
    answer: 1
    explanation: |
      alg=none accepts an unsigned token if the verifier honors the token's own
      alg; algorithm confusion tricks an RS256 verifier into treating the public
      key as an HMAC secret for HS256. Both map to OWASP API2; the defense is to
      pin allowed algorithms and bind each key to one algorithm.
    ref: "concepts.md#jwt-validation-edge-cases-and-attacks"

  - id: api-gateways-and-bff-075
    difficulty: advanced
    tags: [jwt, jwks, kid, key-rotation]
    question: |
      An issuer rotates its signing keys. A gateway that caches the JWKS starts
      seeing tokens with an unknown `kid`. What is the correct behavior?
    options:
      - "Reject all tokens permanently until a human updates the config"
      - "Ignore the kid and try every cached key blindly"
      - "Treat a cache miss on kid as a signal to refetch the JWKS (respecting a refresh cooldown), then validate — cache JWKS for performance but refresh on rotation"
      - "Downgrade to alg=none to avoid the key lookup"
    answer: 2
    explanation: |
      JWKS should be cached to avoid a fetch per request, but an unknown kid means
      the key set likely rotated, so the gateway should refetch (with a cooldown to
      avoid a fetch storm) and then validate. Rejecting outright would cause an
      outage on every legitimate rotation.
    ref: "concepts.md#jwt-validation-edge-cases-and-attacks"

  - id: api-gateways-and-bff-076
    difficulty: expert
    tags: [owasp, api4, resource-consumption, security]
    question: |
      Which OWASP API Security Top 10 (2023) category is most directly the API
      gateway's core mandate, addressed by rate limits, quotas, body-size caps,
      and timeouts?
    options:
      - "API1 Broken Object Level Authorization"
      - "API4 Unrestricted Resource Consumption"
      - "API3 Broken Object Property Level Authorization"
      - "API6 Unrestricted Access to Sensitive Business Flows"
    answer: 1
    explanation: |
      API4 Unrestricted Resource Consumption is squarely a gateway responsibility:
      rate/quota limits, request/body size caps, and timeouts prevent a caller from
      exhausting resources. (API1/BOLA is mostly service-side.)
    ref: "concepts.md#owasp-api-security-top-10-2023--gateway-relevant-items"

  - id: api-gateways-and-bff-077
    difficulty: expert
    tags: [owasp, api9, inventory, ssrf, api7]
    question: |
      A forgotten `v0` API and an undocumented internal endpoint are both
      reachable through the gateway; separately, a backend fetches a URL supplied
      in a request body. Which two OWASP API risks are in play?
    options:
      - "API9 Improper Inventory Management (zombie/shadow APIs) and API7 SSRF (unvalidated user-supplied URI fetched server-side)"
      - "API2 Broken Authentication and API5 BFLA"
      - "API1 BOLA and API10 Unsafe Consumption"
      - "API8 Security Misconfiguration and API3 Property-Level authZ"
    answer: 0
    explanation: |
      Old/undocumented routes are API9 Improper Inventory Management (zombie/shadow
      APIs) — the gateway is the inventory & deprecation enforcement point. Fetching
      an attacker-supplied URL server-side is API7 SSRF; validate/allowlist such URIs.
    ref: "concepts.md#owasp-api-security-top-10-2023--gateway-relevant-items"

  - id: api-gateways-and-bff-078
    difficulty: advanced
    tags: [lifecycle, sunset, rfc-8594, deprecation]
    question: |
      A team is retiring `/v1` in favor of `/v2`. How should the gateway signal
      the impending retirement to clients using standards?
    options:
      - "Return 410 Gone immediately on all v1 requests"
      - "Emit the Sunset header (RFC 8594) with the retirement date, typically alongside a Deprecation header and a Link to migration docs, while still serving v1 during the window"
      - "Silently start returning 500s on v1"
      - "Add a custom X-Please-Upgrade header only"
    answer: 1
    explanation: |
      RFC 8594's Sunset header advertises when a resource will stop working; the
      Deprecation header (IETF draft) marks it deprecated, often with a Link to
      docs. This gives clients a detectable retirement window and addresses API9
      inventory management, versus abruptly breaking v1.
    ref: "concepts.md#api-lifecycle-versioning-deprecation-and-sunset"

  - id: api-gateways-and-bff-079
    difficulty: expert
    tags: [cors, credentials, security]
    question: |
      A browser app sends credentialed requests (cookies) cross-origin. The
      gateway responds with `Access-Control-Allow-Origin: *` and
      `Access-Control-Allow-Credentials: true`. Why does the browser still block it?
    options:
      - "Because CORS requires HTTP/3"
      - "Because the wildcard origin cannot be combined with Allow-Credentials: true — with credentials the server must echo a specific allowed origin (and typically Vary: Origin)"
      - "Because credentials require TLS passthrough"
      - "Because Access-Control-Max-Age must be 0 for credentials"
    answer: 1
    explanation: |
      The Fetch/CORS spec forbids Access-Control-Allow-Credentials: true together
      with Allow-Origin: *. Credentialed cross-origin requests need a specific
      echoed origin plus Vary: Origin. CORS also only constrains browsers — it is
      not server-side authorization.
    ref: "concepts.md#cors-handling-at-the-edge"

  - id: api-gateways-and-bff-080
    difficulty: advanced
    tags: [control-plane, data-plane, architecture]
    question: |
      Why should a gateway's data plane be kept simple and (ideally) stateless
      while richer configuration lives in the control plane?
    options:
      - "Because stateless data planes cannot terminate TLS"
      - "So the request-forwarding path stays fast and its blast radius is contained, while route/policy/key changes are versioned and rolled out via the control plane"
      - "Because the control plane handles all live traffic"
      - "Because stateful data planes are required for rate limiting"
    answer: 1
    explanation: |
      Separating planes keeps the hot request path (data plane) fast and
      low-blast-radius, while management concerns (routes, policies, keys) live in
      a control plane that's versioned and rolled out gradually. State like
      rate-limit counters is externalized rather than baked into the data plane.
    ref: "concepts.md#control-plane-vs-data-plane"

  - id: api-gateways-and-bff-081
    difficulty: expert
    tags: [kubernetes, ingress, gateway-api]
    question: |
      In Kubernetes, where does each stop: Ingress, Gateway API, and a full API
      gateway?
    options:
      - "They are identical resources with different names"
      - "Ingress does basic host/path L7 routing + TLS; Gateway API is the role-oriented successor (GatewayClass/Gateway/HTTPRoute) with richer, portable routing and traffic splitting; a full API gateway adds the API-management layer (authN/Z, quotas, transformation, aggregation, portal)"
      - "Ingress does authN/Z and quotas; Gateway API only does TLS; API gateways only route"
      - "Gateway API replaces both Ingress and API gateways for all use cases"
    answer: 1
    explanation: |
      Ingress = basic L7 routing/TLS (vendors extended it non-portably via
      annotations). Gateway API = role-oriented successor (GatewayClass/Gateway/
      HTTPRoute), richer and portable, but still routing. A full API gateway layers
      API management on top; it can build on Gateway API as its data plane.
    ref: "concepts.md#kubernetes-ingress-vs-gateway-api-vs-api-gateway"

  - id: api-gateways-and-bff-082
    difficulty: advanced
    tags: [service-discovery, health-check, outlier-ejection]
    question: |
      What is the difference between active health checks and passive health
      checks (outlier ejection) at a gateway?
    options:
      - "Active checks read the response body; passive checks read the request body"
      - "Active checks periodically probe an upstream endpoint (e.g. /health); passive checks watch live traffic and eject an instance returning too many errors/timeouts, re-admitting it after a cooldown"
      - "Passive checks require mTLS; active checks require API keys"
      - "They are two names for the same probe"
    answer: 1
    explanation: |
      Active health checks send synthetic probes on an interval. Passive checks
      (outlier ejection) infer health from real traffic — ejecting an instance that
      errors/times out too much and re-admitting after a cooldown — which is cheaper
      and reacts to actual failures.
    ref: "concepts.md#service-discovery-and-health-checking"

  - id: api-gateways-and-bff-083
    difficulty: advanced
    tags: [streaming, websocket, sse, connections]
    question: |
      Why do WebSocket and Server-Sent Events change how you size and tune a
      gateway compared to plain request/response REST?
    options:
      - "They require the gateway to disable TLS"
      - "They are long-lived connections, so the scaling constraint becomes concurrent connection count (and idle-timeout/buffering tuning) rather than requests-per-second"
      - "They cannot pass through any gateway"
      - "They force every response to be cached"
    answer: 1
    explanation: |
      Long-lived connections (WebSocket upgrade, SSE text/event-stream) mean the
      binding constraint shifts from RPS to concurrent open connections, and idle
      timeouts/response-flush buffering must be tuned differently or streams stall
      or get killed prematurely.
    ref: "concepts.md#streaming-and-protocol-support-at-the-edge"

  - id: api-gateways-and-bff-084
    difficulty: expert
    tags: [idempotency, retries, edge]
    question: |
      How does an `Idempotency-Key` request header interact with gateway retries
      of a `POST`?
    options:
      - "It disables retries entirely"
      - "It lets the server return the original result for a duplicate key instead of performing the action twice, which is precisely what makes a gateway retry of a non-idempotent POST safe"
      - "It converts the POST into a GET"
      - "It is only meaningful for cache keys, not writes"
    answer: 1
    explanation: |
      An Idempotency-Key lets the server dedupe: a retried POST bearing the same
      key returns the original outcome rather than re-executing the write. This is
      what makes gateway-level (or client) retries of an otherwise non-idempotent
      request safe.
    ref: "concepts.md#idempotency-support-at-the-edge"

  - id: api-gateways-and-bff-085
    difficulty: advanced
    tags: [validation, openapi, api4, api8]
    question: |
      A gateway validates request bodies against an OpenAPI 3.1 schema and rejects
      oversized bodies. Which concerns does this address, and what's the boundary?
    options:
      - "It enforces business rules; it should also check refund eligibility"
      - "It offloads structural validation and defends resource-consumption (API4) and misconfiguration (API8), but should stay structural (does the message conform to the contract?) — semantic 'is this a valid business operation?' is service logic"
      - "It replaces authentication entirely"
      - "It only helps with CORS preflight"
    answer: 1
    explanation: |
      Schema validation + size limits at the edge reject malformed/oversized
      requests early (defending API4/API8) and offload work from services. The
      boundary is structural vs semantic: contract conformance at the edge, business
      validity in the service.
    ref: "concepts.md#request-and-schema-validation-at-the-edge"

  - id: api-gateways-and-bff-086
    difficulty: expert
    tags: [tail-latency, aggregation, fan-out]
    question: |
      A BFF fans out to 5 services in parallel and waits for all. Every service
      reports a healthy p99 of 100ms, yet the client-observed p99 is far worse.
      Why, and what mitigates it?
    options:
      - "The BFF is misconfigured; each service's p99 should equal the client p99"
      - "Tail-latency amplification: waiting for the slowest-of-N makes it likely at least one call is slow, so the aggregate p99 exceeds any single backend's; mitigate with per-call timeouts in a latency budget, hedged requests, and degrading non-critical fields"
      - "TLS termination adds exactly the difference"
      - "The client network is always the cause; nothing server-side helps"
    answer: 1
    explanation: |
      With parallel fan-out and wait-for-all, client latency is the max of N. The
      chance that at least one of N calls lands in its slow tail grows with N, so
      aggregate p99 is worse than any single backend's. Mitigations: per-call
      timeouts within a budget, hedged requests, and dropping non-critical fields.
    ref: "concepts.md#tail-latency-amplification-and-composition-consistency"

  - id: api-gateways-and-bff-087
    difficulty: expert
    tags: [composition, consistency, eventual-consistency]
    question: |
      An aggregated account screen shows an order-count of 12 but lists only 11
      orders. No single service is buggy. What is the most likely explanation?
    options:
      - "A rate-limit header was dropped"
      - "Composition consistency: the count and the list are independent read-time snapshots taken at different moments across services with no cross-service transaction, so they can disagree (read skew / eventual consistency)"
      - "The JWT audience claim was wrong"
      - "TLS re-encryption corrupted one field"
    answer: 1
    explanation: |
      Aggregation merges data captured at different instants from different
      services with no cross-service transaction, so a count from one call can
      disagree with a list from another (read skew / eventual consistency). If it
      matters, derive dependent values from a single consistent source.
    ref: "concepts.md#tail-latency-amplification-and-composition-consistency"

  - id: api-gateways-and-bff-088
    difficulty: advanced
    tags: [patterns, gateway-offloading, azure]
    question: |
      Microsoft/Azure formalize three gateway patterns. Which statement about
      Gateway Offloading is correct?
    options:
      - "Offload as much as possible, including domain/business logic, to centralize everything"
      - "Move shared cross-cutting functionality (TLS, authN, rate limiting, logging) into the gateway — only offload what the whole app uses, and never offload business logic"
      - "Offloading means fanning one request out to several services"
      - "Offloading means routing requests to multiple services behind one endpoint"
    answer: 1
    explanation: |
      Gateway Offloading moves shared cross-cutting concerns (TLS, authN, rate
      limiting, logging) to the edge; the rule is to offload only what the whole
      app uses and never business logic. Fan-out/merge is Gateway Aggregation;
      multi-service routing behind one endpoint is Gateway Routing.
    ref: "concepts.md#the-three-named-gateway-patterns"

  - id: api-gateways-and-bff-089
    difficulty: advanced
    tags: [mtls, sni, tls, routing]
    question: |
      How can a gateway route traffic based on the target hostname even in TLS
      passthrough mode where it doesn't decrypt the request?
    options:
      - "By reading the HTTP Host header inside the encrypted body"
      - "By using SNI (Server Name Indication) from the TLS ClientHello, which carries the target hostname in cleartext before the handshake completes"
      - "By decrypting the first packet only"
      - "By inspecting the X-Forwarded-Host header"
    answer: 1
    explanation: |
      SNI in the TLS ClientHello exposes the requested hostname in cleartext, so a
      gateway can select the right certificate and even route (SNI-based routing)
      without terminating — the only routing signal available in passthrough mode,
      since the HTTP Host header is inside the encrypted stream.
    ref: "concepts.md#mtls-and-sni-detail"

  - id: api-gateways-and-bff-090
    difficulty: expert
    tags: [aws, managed, token-bucket, usage-plans]
    question: |
      In Amazon API Gateway, a usage plan sets a rate of 100 req/s with a burst of
      200. How does the underlying token-bucket model interpret these two numbers?
    options:
      - "Rate is the maximum ever allowed; burst is ignored"
      - "The steady-state rate (100/s) is the bucket's refill rate and the burst (200) is the bucket capacity — brief spikes up to 200 are allowed as long as the long-run average stays at the refill rate"
      - "Burst is the per-day quota and rate is the per-second quota"
      - "Both numbers must be equal or requests are rejected"
    answer: 1
    explanation: |
      Token bucket maps steady-state rate to the refill rate and burst to bucket
      capacity: the client may momentarily exceed the steady rate up to the burst
      size (draining the bucket), but the sustained average is capped at the refill
      rate. Usage plans + API keys add per-key quotas on top.
    ref: "concepts.md#managed-vs-self-hosted-trade-offs-with-aws-specifics"

  - id: api-gateways-and-bff-091
    difficulty: intermediate
    tags: [ai-gateway, trends, rate-limiting]
    question: |
      How does an AI/LLM gateway's rate limiting typically differ from a classic
      API gateway's?
    options:
      - "It doesn't rate limit at all"
      - "It limits by tokens or dollar cost rather than request count, because a single request's cost varies widely; it may also do semantic caching by embedding similarity and prompt-injection/PII inspection"
      - "It limits only by IP address and nothing else"
      - "It caches by exact URL match just like a CDN"
    answer: 1
    explanation: |
      LLM traffic cost varies per request, so AI gateways meter by tokens/cost
      rather than request count, and add LLM-specific features: semantic caching
      (embedding similarity), prompt-injection guards, and PII redaction. The
      underlying edge discipline is the same, just measured differently.
    ref: "concepts.md#aillm-gateways-forward-looking"

  - id: api-gateways-and-bff-092
    difficulty: expert
    tags: [resilience, load-shedding, 503, retry-after]
    question: |
      Under global overload a gateway proactively rejects the lowest-priority
      requests to protect core traffic. What is this called and what response is
      appropriate?
    options:
      - "Rate limiting; return 429 to the affected clients individually"
      - "Load shedding / backpressure; return 503 Service Unavailable (with Retry-After when known) since the condition is server-wide overload, not a single noisy client"
      - "Circuit breaking; return 401 Unauthorized"
      - "Bulkheading; return 404 Not Found"
    answer: 1
    explanation: |
      Load shedding drops low-priority work under server-wide overload to protect
      the core — the server-wide analogue of per-client rate limiting. It warrants
      503 (+ Retry-After), whereas 429 is reserved for a specific client exceeding
      its quota.
    ref: "concepts.md#resilience-patterns-at-the-edge"
