topic: REST Fundamentals & Architectural Constraints
domain: rest-api-design
topic_slug: rest-fundamentals-and-constraints
version: 1
questions:
- id: rest-fundamentals-and-constraints-001
  difficulty: beginner
  tags:
  - definition
  - architectural-style
  - fielding
  question: |
    What is REST, most precisely?
  options:
  - An architectural style defined by a set of constraints
  - A network protocol that replaces HTTP
  - A data-serialization format like JSON or XML
  - An IETF standard that APIs must be certified against
  answer: 0
  explanation: |
    REST is an architectural style introduced by Roy Fielding, defined by a set of
    constraints applied to components, connectors, and data. It is not a protocol
    (HTTP is), not a data format (JSON/XML are representations), and not a
    certifiable standard.
  ref: concepts.md#what-rest-is-and-what-it-is-not
- id: rest-fundamentals-and-constraints-002
  difficulty: beginner
  tags:
  - fielding
  - history
  question: |
    Who defined REST and in what work?
  options:
  - Tim Berners-Lee, in the original HTTP/1.0 RFC
  - Roy Fielding, in his 2000 doctoral dissertation
  - The W3C, in a formal REST specification
  - Leonard Richardson, in the Richardson Maturity Model
  answer: 1
  explanation: |
    Roy Fielding defined REST in his 2000 PhD dissertation, "Architectural Styles and
    the Design of Network-based Software Architectures." Richardson later created a
    maturity model, but he did not define REST.
  ref: concepts.md#what-rest-is-and-what-it-is-not
- id: rest-fundamentals-and-constraints-003
  difficulty: beginner
  tags:
  - constraints
  - count
  question: |
    How many architectural constraints define REST, and how many are optional?
  options:
  - Five constraints, none optional
  - Six constraints, one of which (code-on-demand) is optional
  - Four sub-constraints of the uniform interface only
  - Six constraints, all mandatory
  answer: 1
  explanation: |
    REST is defined by six constraints: client-server, stateless, cacheable, uniform
    interface, layered system, and code-on-demand. Only code-on-demand is optional;
    the other five are required.
  ref: concepts.md#fieldings-six-architectural-constraints
- id: rest-fundamentals-and-constraints-004
  difficulty: beginner
  tags:
  - constraints
  - optional
  - code-on-demand
  question: |
    Which of Fielding's REST constraints is the only optional one?
  options:
  - Code-on-demand
  - Statelessness
  - Uniform interface
  - Layered system
  answer: 0
  explanation: |
    Code-on-demand is the sole optional constraint. Because sending executable code
    reduces visibility, Fielding left its adoption to the architect's discretion. The
    other five constraints are required for a system to be RESTful.
  ref: concepts.md#code-on-demand-optional
- id: rest-fundamentals-and-constraints-005
  difficulty: intermediate
  tags:
  - constraints
  - reasoning
  - properties
  question: |
    Why does Fielding frame REST as a set of "constraints" rather than "features"?
  options:
  - Because constraints make the system harder to build, proving it is robust
  - Because each constraint removes a degree of freedom in exchange for a desirable system property
  - Because constraints are legal requirements imposed by the HTTP RFCs
  - Because the term is a synonym for 'REST features' with no deeper meaning
  answer: 1
  explanation: |
    Fielding derived REST by starting from the null style and adding constraints one
    at a time, each justified by the property it induces. Statelessness, for example,
    forbids server session memory, and that very restriction is what enables
    horizontal scaling. The discipline is the benefit.
  ref: concepts.md#fieldings-six-architectural-constraints
- id: rest-fundamentals-and-constraints-006
  difficulty: beginner
  tags:
  - myths
  - json
  question: |
    Is REST the same thing as "JSON over HTTP"?
  options:
  - Yes; REST requires JSON as its representation format
  - Yes; REST was defined specifically around the JSON media type
  - No; REST is representation-format agnostic and JSON is just one common representation
  - No; REST requires XML, not JSON
  answer: 2
  explanation: |
    REST says nothing about representation format. A resource can be represented as
    JSON, XML, HTML, CBOR, protobuf, or plain text. JSON is popular but incidental;
    content negotiation exists precisely because one resource can have many
    representations.
  ref: concepts.md#common-rest-myths-busted
- id: rest-fundamentals-and-constraints-007
  difficulty: intermediate
  tags:
  - myths
  - crud
  question: |
    Which statement about "REST is just CRUD over HTTP" is correct?
  options:
  - It is accurate; every REST resource must map to a database table
  - It is a common convenience pattern, but REST is about resources, representations, and hypermedia,
    not database operations
  - It is correct because HTTP only supports create/read/update/delete
  - It is wrong because REST does not use HTTP methods at all
  answer: 1
  explanation: |
    Mapping CRUD to HTTP verbs is a frequent convenience, but resources need not
    correspond to database rows, and many operations (e.g. a POST /orders/1/cancel
    state transition or a search resource) are not CRUD. REST is broader than CRUD.
  ref: concepts.md#common-rest-myths-busted
- id: rest-fundamentals-and-constraints-008
  difficulty: beginner
  tags:
  - client-server
  - separation
  question: |
    What is the primary benefit of the client-server constraint?
  options:
  - It guarantees the server and client run on the same machine
  - It removes the need for any interface between components
  - It forces both sides to share the same programming language
  - It lets the UI/consumer and the data/logic evolve independently across a shared contract
  answer: 3
  explanation: |
    Client-server separates user-interface concerns from data-storage and logic
    concerns. Neither side needs the other's internals, only the contract, so a server
    can re-platform its database while many kinds of clients keep working.
  ref: concepts.md#client-server-separation
- id: rest-fundamentals-and-constraints-009
  difficulty: intermediate
  tags:
  - client-server
  - bff
  question: |
    A backend-for-frontend (BFF) service runs server-side but calls several downstream
    microservices. Regarding the client-server constraint, the BFF is:
  options:
  - Neither a client nor a server, since it runs in the middle
  - A client of the downstream services, because client-server is a communication separation, not a physical
    one
  - Not RESTful, because a server cannot also be a client
  - Exempt from REST constraints because it is an intermediary
  answer: 1
  explanation: |
    Client-server is about the communication relationship, not physical location. The
    BFF is a client with respect to the downstream services it calls, even though it
    is itself a server to the front end.
  ref: concepts.md#client-server-separation
- id: rest-fundamentals-and-constraints-010
  difficulty: intermediate
  tags:
  - statelessness
  - definition
  question: |
    What does the statelessness constraint actually require?
  options:
  - Each request must contain all information needed to process it; the server keeps no client session
    state between requests
  - The server must not store any data at all, including in its database
  - The client must not store any state locally
  - Every request must reuse the same TCP connection
  answer: 0
  explanation: |
    Statelessness requires each request to be self-contained and the server to hold no
    per-client conversational/session state between requests. It does not forbid the
    server from storing resource state in a datastore.
  ref: concepts.md#statelessness-what-it-really-means
- id: rest-fundamentals-and-constraints-011
  difficulty: intermediate
  tags:
  - statelessness
  - resource-state
  - session-state
  question: |
    A candidate says "stateless means the server stores nothing." What is the correct
    clarification?
  options:
  - Correct as stated; a stateless server has no database
  - It forbids storing resource state but allows session state
  - It only applies to GET requests
  - It forbids only per-client session/conversation state between requests; resource state in a datastore
    is perfectly fine
  answer: 3
  explanation: |
    The key distinction: application/session state (the conversation context) must not
    live on the server between requests, but resource state (the user record, the
    cart's contents) legitimately lives in the server's datastore. Confusing the two
    is the most common statelessness mistake.
  ref: concepts.md#statelessness-what-it-really-means
- id: rest-fundamentals-and-constraints-012
  difficulty: intermediate
  tags:
  - statelessness
  - scalability
  - why
  question: |
    Which property does statelessness most directly enable?
  options:
  - Strong consistency across replicas
  - Horizontal scalability and easy load balancing, since any server can handle any request
  - Smaller request payloads
  - Automatic encryption of all traffic
  answer: 1
  explanation: |
    Because each request is self-contained, no sticky sessions are needed and any
    instance can serve any request, enabling trivial horizontal scaling, load
    balancing, and failover. It also improves visibility and reliability. It tends to
    increase, not decrease, request payload size.
  ref: concepts.md#statelessness-what-it-really-means
- id: rest-fundamentals-and-constraints-013
  difficulty: advanced
  tags:
  - statelessness
  - jwt
  - tradeoffs
  question: |
    Using a self-contained JWT for authentication makes auth stateless. What is the
    classic trade-off this reintroduces?
  options:
  - JWTs cannot carry user identity
  - JWTs require sticky sessions to work
  - Token revocation is hard, since a valid-until-expiry token cannot easily be invalidated
  - JWTs force the server to store a session per user
  answer: 2
  explanation: |
    A JWT carries its claims so the server needn't look up a session, which keeps auth
    stateless. But that same self-containment makes revocation hard: a token remains
    valid until it expires unless you add extra machinery (denylists, short lifetimes
    plus refresh), which partially reintroduces state.
  ref: concepts.md#statelessness-what-it-really-means
- id: rest-fundamentals-and-constraints-014
  difficulty: advanced
  tags:
  - statelessness
  - session-store
  - nuance
  question: |
    A team stores session data in a shared Redis instead of in-process memory and
    claims this is "fully stateless." What is the most accurate assessment?
  options:
  - It is fully stateless because no state lives in application memory
  - It violates client-server separation
  - It is a pragmatic middle ground, but strictly the request is no longer self-contained since the server
    still needs external context
  - It is identical to using a JWT in every respect
  answer: 2
  explanation: |
    Externalizing session state to a shared store solves load-balancing sticky-session
    problems and is common in practice, but the request itself is not self-describing:
    the server must fetch external context to process it. Strictly, that is not the
    pure statelessness a self-contained token provides.
  ref: concepts.md#statelessness-what-it-really-means
- id: rest-fundamentals-and-constraints-015
  difficulty: intermediate
  tags:
  - statelessness
  - auth
  - wire
  question: |
    Which request is more aligned with REST statelessness?
  options:
  - 'GET /cart with a Cookie: JSESSIONID that maps to server-side in-memory session'
  - GET /cart that relies on the server remembering the previous request's user
  - 'GET /cart with an Authorization: Bearer token the server validates without a session lookup'
  - GET /cart that requires a preceding /login call to set server memory
  answer: 2
  explanation: |
    A self-describing bearer token lets the server authenticate the request in
    isolation with no per-client session memory, satisfying statelessness. A
    server-side session keyed by a cookie is stateful conversational state.
  ref: concepts.md#statelessness-what-it-really-means
- id: rest-fundamentals-and-constraints-016
  difficulty: beginner
  tags:
  - cacheable
  - constraint
  question: |
    What does the cacheability constraint require of responses?
  options:
  - Every response must be cached forever
  - Only the client may cache, never intermediaries
  - Caching is banned to guarantee freshness
  - Responses must label themselves, implicitly or explicitly, as cacheable or non-cacheable
  answer: 3
  explanation: |
    Cacheability requires responses to indicate whether they can be reused for
    equivalent later requests. In HTTP this is done with cache-control metadata (e.g.
    Cache-Control, ETag). Correct labeling lets clients and intermediaries reuse
    responses safely.
  ref: concepts.md#cacheability
- id: rest-fundamentals-and-constraints-017
  difficulty: intermediate
  tags:
  - cacheable
  - tradeoffs
  question: |
    What is the fundamental trade-off caching introduces?
  options:
  - It trades freshness/consistency for efficiency, since you may serve stale data
  - It trades security for speed
  - It trades statelessness for layering
  - It has no downside if configured correctly
  answer: 0
  explanation: |
    Caching eliminates some client-server interactions to improve efficiency and
    latency, but a cached copy can be stale. The core tension is
    freshness/consistency versus efficiency, which is why validators and expiration
    exist.
  ref: concepts.md#cacheability
- id: rest-fundamentals-and-constraints-018
  difficulty: advanced
  tags:
  - cacheable
  - security
  - headers
  question: |
    An API returns user-specific account data with the header
    "Cache-Control: public, max-age=3600". What is the danger?
  options:
  - The response will never be cached
  - The ETag will be ignored
  - A shared/intermediary cache may store and serve one user's private data to another user
  - There is no danger; public just means anyone can request it
  answer: 2
  explanation: |
    "public" allows shared caches (proxies, CDNs) to store the response and serve it to
    other requesters. User-specific data should use "private" (or no-store), or a
    shared cache could leak one user's data to another. Cacheability intersects
    directly with security.
  ref: concepts.md#cacheability
- id: rest-fundamentals-and-constraints-019
  difficulty: intermediate
  tags:
  - cacheable
  - methods
  question: |
    Responses to which HTTP methods are meaningfully cacheable by default?
  options:
  - Safe methods such as GET and HEAD
  - POST and DELETE
  - PUT and PATCH
  - Only OPTIONS
  answer: 0
  explanation: |
    Safe methods like GET and HEAD produce responses that are cacheable by default.
    POST responses are cacheable only under specific conditions and rarely in
    practice; PUT/PATCH/DELETE change state and are not cached.
  ref: concepts.md#cacheability
- id: rest-fundamentals-and-constraints-020
  difficulty: beginner
  tags:
  - uniform-interface
  - defining
  question: |
    What is the central, defining feature that distinguishes REST from other network
    architectural styles?
  options:
  - The use of JSON
  - The requirement for HTTPS
  - The uniform interface
  - The use of relational databases
  answer: 2
  explanation: |
    Fielding identifies the uniform interface as REST's central defining feature.
    Components interact through a standardized, generic interface rather than
    application-specific APIs, which is what decouples clients from servers.
  ref: concepts.md#uniform-interface-and-its-sub-constraints
- id: rest-fundamentals-and-constraints-021
  difficulty: intermediate
  tags:
  - uniform-interface
  - sub-constraints
  question: |
    Which set correctly lists the four sub-constraints of the uniform interface?
  options:
  - Client-server, stateless, cacheable, layered
  - GET, POST, PUT, DELETE
  - Identification of resources; manipulation through representations; self-descriptive messages; HATEOAS
  - Authentication, authorization, encryption, auditing
  answer: 2
  explanation: |
    The uniform interface breaks into four sub-constraints: resource identification
    (via URIs), manipulation of resources through representations, self-descriptive
    messages, and hypermedia as the engine of application state (HATEOAS).
  ref: concepts.md#uniform-interface-and-its-sub-constraints
- id: rest-fundamentals-and-constraints-022
  difficulty: intermediate
  tags:
  - uniform-interface
  - self-descriptive
  question: |
    A message that carries its own method semantics, Content-Type, cache directives,
    and status codes so an intermediary can process it without out-of-band knowledge
    satisfies which sub-constraint?
  options:
  - Self-descriptive messages
  - Identification of resources
  - Code-on-demand
  - Layered system
  answer: 0
  explanation: |
    Self-descriptive messages carry enough metadata (method semantics, media type,
    cache directives, status) that any component can understand how to process them in
    isolation. This is why standard HTTP verbs, headers, and status codes matter.
  ref: concepts.md#uniform-interface-and-its-sub-constraints
- id: rest-fundamentals-and-constraints-023
  difficulty: advanced
  tags:
  - uniform-interface
  - tradeoffs
  question: |
    What is the acknowledged cost of REST's uniform interface?
  options:
  - It makes caching impossible
  - It forces stateful communication
  - It requires all clients to share source code with the server
  - It is less efficient than an interface tailored to one application's specific needs, because you exchange
    standardized rather than bespoke payloads
  answer: 3
  explanation: |
    A uniform interface degrades efficiency relative to an application-specific
    interface because information is transferred in a standardized form rather than
    one optimized for a particular application's needs. REST accepts that inefficiency
    to buy generality, decoupling, and evolvability.
  ref: concepts.md#uniform-interface-and-its-sub-constraints
- id: rest-fundamentals-and-constraints-024
  difficulty: advanced
  tags:
  - uniform-interface
  - rpc-smell
  question: |
    Why does an endpoint like "GET /getUser?id=42" undermine the uniform interface?
  options:
  - Because GET cannot take query parameters
  - Because putting an RPC-style verb ('getUser') in the path breaks self-descriptiveness and resource
    identification
  - Because id must always be a path segment
  - Because GET responses can never be cached
  answer: 1
  explanation: |
    The HTTP method already expresses the action; encoding a verb like "getUser" in
    the path is RPC-style and breaks the uniform interface's self-descriptive,
    resource-oriented model. The RESTful form is GET /users/42.
  ref: concepts.md#uniform-interface-and-its-sub-constraints
- id: rest-fundamentals-and-constraints-025
  difficulty: beginner
  tags:
  - layered-system
  - definition
  question: |
    What does the layered-system constraint state?
  options:
  - Every request must pass through at least three servers
  - The client and server must be in the same network layer
  - Layers are forbidden to improve performance
  - A component can only see the immediate layer it interacts with and cannot tell if it is talking to
    the origin or an intermediary
  answer: 3
  explanation: |
    In a layered system, each component sees only the adjacent layer. A client cannot
    tell whether it is connected directly to the origin server or through
    intermediaries such as load balancers, caches, or gateways.
  ref: concepts.md#layered-system
- id: rest-fundamentals-and-constraints-026
  difficulty: intermediate
  tags:
  - layered-system
  - gateways
  - cdn
  question: |
    Which REST constraint most directly makes API gateways, CDNs, and load balancers
    possible as transparent intermediaries?
  options:
  - Code-on-demand
  - Client-server
  - Cacheability
  - Layered system
  answer: 3
  explanation: |
    The layered-system constraint permits transparent intermediaries; the client
    cannot distinguish them from the origin. Gateways, CDNs, proxies, and load
    balancers are all instances of this. Statelessness is what keeps that layering
    transparent.
  ref: concepts.md#layered-system
- id: rest-fundamentals-and-constraints-027
  difficulty: intermediate
  tags:
  - layered-system
  - tradeoffs
  question: |
    What is a downside of a layered system, and how is it typically mitigated?
  options:
  - It leaks server internals to clients; mitigated by encryption
  - It forces stateful sessions; mitigated by cookies
  - Each layer adds latency/overhead; mitigated by caching at intermediaries
  - It prevents load balancing; mitigated by DNS
  answer: 2
  explanation: |
    Every intermediary layer adds some latency and processing overhead. Shared caching
    at intermediaries offsets this cost, which is why layering and cacheability
    complement each other.
  ref: concepts.md#layered-system
- id: rest-fundamentals-and-constraints-028
  difficulty: beginner
  tags:
  - code-on-demand
  - definition
  question: |
    What is code-on-demand in REST?
  options:
  - The server compiling client requests on demand
  - On-demand scaling of server instances
  - Lazy loading of database rows
  - The server extending client functionality by transferring executable code (e.g. scripts) that the
    client runs
  answer: 3
  explanation: |
    Code-on-demand lets a server extend a client by sending executable code (such as
    JavaScript to a browser or an applet) that the client then runs. It is the only
    optional REST constraint.
  ref: concepts.md#code-on-demand-optional
- id: rest-fundamentals-and-constraints-029
  difficulty: intermediate
  tags:
  - code-on-demand
  - visibility
  - why-optional
  question: |
    Why did Fielding make code-on-demand optional rather than required?
  options:
  - Because it is too easy to implement
  - Because it only works over HTTPS
  - Because sending executable code reduces visibility and adds client complexity/security surface, so
    its use is left to the architect
  - Because browsers do not support it
  answer: 2
  explanation: |
    Code-on-demand reduces visibility (an intermediary can no longer fully understand
    behavior from the message alone) and increases client complexity and security
    surface. Fielding made it optional so architects can adopt it only where client
    extensibility outweighs those costs.
  ref: concepts.md#code-on-demand-optional
- id: rest-fundamentals-and-constraints-030
  difficulty: intermediate
  tags:
  - code-on-demand
  - example
  question: |
    Which is the clearest real-world example of code-on-demand?
  options:
  - A JSON API returning a list of users
  - A browser loading an HTML page that includes a <script> that executes on the client
  - A server storing a session in Redis
  - A gateway rate-limiting requests
  answer: 1
  explanation: |
    A browser downloading and executing JavaScript embedded in an HTML page is
    code-on-demand: the server ships executable code that extends the client. A pure
    JSON data API typically does not use code-on-demand.
  ref: concepts.md#code-on-demand-optional
- id: rest-fundamentals-and-constraints-031
  difficulty: beginner
  tags:
  - resource
  - representation
  - definition
  question: |
    What is the difference between a resource and a representation?
  options:
  - They are two words for the same thing
  - A resource is the abstract thing identified by a URI; a representation is a concrete serialized snapshot
    of its state in some media type
  - A resource is JSON; a representation is XML
  - A representation is the URI; the resource is the response body
  answer: 1
  explanation: |
    A resource is any concept worth naming, identified by a URI (e.g. /users/42). A
    representation is a concrete serialized view of that resource's state at a moment,
    in a chosen media type. Clients and servers exchange representations, never the
    resource itself.
  ref: concepts.md#resource-vs-representation
- id: rest-fundamentals-and-constraints-032
  difficulty: intermediate
  tags:
  - resource
  - representation
  - content-negotiation
  question: |
    A client sends "GET /users/42" with "Accept: application/xml" and another sends the
    same URI with "Accept: application/json". What is true?
  options:
  - They target the same resource /users/42 but request different representations of it
  - They target two different resources
  - The XML request is not RESTful
  - The URI must change to /users/42.xml to be valid REST
  answer: 0
  explanation: |
    Both requests identify the same resource (/users/42). The Accept header selects
    which representation the server returns. One resource can have many
    representations; the URI identity is stable while representations vary. This is the
    basis of content negotiation.
  ref: concepts.md#resource-vs-representation
- id: rest-fundamentals-and-constraints-033
  difficulty: intermediate
  tags:
  - resource
  - representation
  - put
  question: |
    When a client sends a PUT with a JSON body, what is that body, precisely?
  options:
  - The resource itself, transferred to the server
  - A pointer to the resource's storage location
  - An RPC command name
  - A proposed representation of the resource that the server uses to set its state
  answer: 3
  explanation: |
    The bytes in a PUT body are a representation the server uses to set the resource's
    state; they are not "the resource." Resources are manipulated through
    representations, which is a uniform-interface sub-constraint.
  ref: concepts.md#resource-vs-representation
- id: rest-fundamentals-and-constraints-034
  difficulty: beginner
  tags:
  - rest-vs-rpc
  - nouns-verbs
  question: |
    What is the core modeling difference between REST and RPC?
  options:
  - REST uses TCP; RPC uses UDP
  - REST is synchronous; RPC is always asynchronous
  - REST exposes resources (nouns) manipulated by a uniform set of methods; RPC exposes operations (verbs)
    as named procedures
  - RPC cannot use HTTP
  answer: 2
  explanation: |
    REST is resource/noun oriented with a uniform method set; RPC is operation/verb
    oriented, invoking named procedures with arguments. RPC's interface is
    application-specific, while REST's is uniform.
  ref: concepts.md#rest-vs-rpc
- id: rest-fundamentals-and-constraints-035
  difficulty: intermediate
  tags:
  - rest-vs-rpc
  - wire
  question: |
    Which pair shows the RPC style versus the REST style for "get a user's orders"?
  options:
  - GET /users/42/orders  vs  POST /getUserOrders {userId:42}
  - Both are identical RPC calls
  - Both are identical REST calls
  - POST /getUserOrders {userId:42}  (RPC)  vs  GET /users/42/orders  (REST)
  answer: 3
  explanation: |
    POST /getUserOrders with the id in the body is RPC-style: a verb in the path,
    everything tunneled through POST. GET /users/42/orders is REST-style: a resource
    addressed by URI and retrieved with the uniform GET method.
  ref: concepts.md#rest-vs-rpc
- id: rest-fundamentals-and-constraints-036
  difficulty: advanced
  tags:
  - rest-vs-rpc
  - tradeoffs
  - grpc
  question: |
    When is an RPC style (e.g. gRPC) often a better fit than REST?
  options:
  - For broad, cacheable, long-lived public APIs
  - For tightly-coupled, high-throughput internal service-to-service calls where a tailored, efficient
    action-oriented contract beats a uniform interface
  - Whenever you want HTTP caching for free
  - When you need clients to discover actions via hypermedia
  answer: 1
  explanation: |
    RPC/gRPC shines for internal, high-throughput service-to-service communication
    where an efficient, action-oriented contract is worth the tighter coupling. REST's
    uniform interface is better for broad, cacheable, evolvable public APIs. Neither is
    universally superior.
  ref: concepts.md#rest-vs-rpc
- id: rest-fundamentals-and-constraints-037
  difficulty: advanced
  tags:
  - rest-vs-rpc
  - tunneling
  question: |
    What is the problem with an "RPC over HTTP" design that tunnels everything through
    "POST /doThing"?
  options:
  - It is impossible to implement in HTTP
  - It is more RESTful than using multiple verbs
  - It automatically becomes RMM level 3
  - It discards HTTP method semantics, cacheability, and self-descriptiveness, using HTTP as mere transport
    rather than an application protocol
  answer: 3
  explanation: |
    Tunneling all operations through a single POST throws away the meaning HTTP methods
    convey, along with cacheability and self-descriptive messages. HTTP becomes just a
    transport, not the application protocol REST leverages.
  ref: concepts.md#rest-vs-rpc
- id: rest-fundamentals-and-constraints-038
  difficulty: beginner
  tags:
  - rmm
  - levels
  question: |
    How many levels does the Richardson Maturity Model define?
  options:
  - Three levels (1-3)
  - Six levels matching the six constraints
  - Two levels (basic and advanced)
  - Four levels (0-3)
  answer: 3
  explanation: |
    The Richardson Maturity Model has four levels, 0 through 3: level 0 (single URI,
    single method), level 1 (resources), level 2 (HTTP verbs + status codes), and
    level 3 (hypermedia controls / HATEOAS).
  ref: concepts.md#the-richardson-maturity-model
- id: rest-fundamentals-and-constraints-039
  difficulty: intermediate
  tags:
  - rmm
  - level-0
  question: |
    Which describes RMM Level 0 ("the Swamp of POX")?
  options:
  - A single URI and a single method (usually POST), with HTTP used as a tunnel
  - Many URIs plus proper HTTP verbs and status codes
  - Hypermedia links driving all state transitions
  - One URI per resource but only POST
  answer: 0
  explanation: |
    Level 0 uses HTTP purely as a transport tunnel: one endpoint, typically POST for
    everything (classic SOAP/XML-RPC). It uses none of the web's resource or method
    machinery.
  ref: concepts.md#the-richardson-maturity-model
- id: rest-fundamentals-and-constraints-040
  difficulty: intermediate
  tags:
  - rmm
  - level-2
  - industry
  question: |
    Most APIs that call themselves "RESTful" in industry sit at which RMM level?
  options:
  - Level 0
  - Level 1
  - Level 2 (resources + proper HTTP verbs + status codes)
  - Level 3 (full hypermedia)
  answer: 2
  explanation: |
    The pragmatic industry norm is Level 2: multiple resource URIs, correct HTTP
    methods, and meaningful status codes. Level 3 (hypermedia/HATEOAS) is what Fielding
    considers truly REST but is rare in practice.
  ref: concepts.md#the-richardson-maturity-model
- id: rest-fundamentals-and-constraints-041
  difficulty: advanced
  tags:
  - rmm
  - fielding
  - hypermedia
  question: |
    Which statement about the RMM and Fielding's own view is most accurate?
  options:
  - Fielding defined the RMM as the official REST compliance standard
  - Fielding says Level 2 is fully RESTful
  - The RMM is Richardson's/Fowler's teaching aid; Fielding never endorsed levels as a REST definition
    but does insist hypermedia is required for an API to be REST
  - The RMM levels are enforced by RFC 9110
  answer: 2
  explanation: |
    The RMM is a descriptive teaching aid from Richardson/Fowler, not Fielding's
    definition. Fielding's own position is that hypermedia (the ingredient of level 3)
    is required for an API to be considered REST; he does not bless level 2 as "truly"
    REST.
  ref: concepts.md#the-richardson-maturity-model
- id: rest-fundamentals-and-constraints-042
  difficulty: advanced
  tags:
  - rmm
  - transitions
  - value
  question: |
    Which RMM transition typically delivers the most practical value for a team
    building an HTTP API?
  options:
  - 1 -> 2, because adding proper verbs and status codes unlocks caching, idempotency, and clear semantics
  - 0 -> 1, because resource URIs alone solve caching
  - 2 -> 3, because hypermedia is required before anything else works
  - 3 -> 4, a level that does not exist but is the most valuable
  answer: 0
  explanation: |
    The 1->2 jump (proper HTTP methods and status codes on top of resource URIs)
    delivers most of REST's practical value: cacheability, idempotency guarantees, and
    clear self-descriptive semantics. The 2->3 (hypermedia) jump adds evolvability but
    more cost, hence low adoption.
  ref: concepts.md#the-richardson-maturity-model
- id: rest-fundamentals-and-constraints-043
  difficulty: intermediate
  tags:
  - myths
  - standard
  question: |
    Which statement is TRUE about REST being a "standard"?
  options:
  - REST is an IETF standard that APIs are certified against
  - REST is a W3C recommendation that mandates JSON
  - REST is an architectural style; HTTP is the protocol, and there is no normative REST specification
    to conform to
  - REST is defined by RFC 9110
  answer: 2
  explanation: |
    REST is an architectural style, not a standard or protocol. HTTP (RFC 9110) is the
    protocol REST is canonically instantiated over, but there is no normative "REST
    spec" you conform to. Guidelines and maturity models exist but are not normative
    standards.
  ref: concepts.md#common-rest-myths-busted
- id: rest-fundamentals-and-constraints-044
  difficulty: intermediate
  tags:
  - myths
  - pretty-urls
  question: |
    A team argues their API is "RESTful because it has clean, pretty URLs." What is the
    best response?
  options:
  - URL aesthetics are cosmetic; RESTfulness is about the constraints (uniform interface, statelessness,
    cacheability, etc.), not how the path looks
  - Correct; pretty URLs are the defining feature of REST
  - Pretty URLs automatically make an API RMM level 3
  - Clean URLs violate the uniform interface
  answer: 0
  explanation: |
    RESTfulness derives from satisfying the architectural constraints, not from URL
    prettiness. A clean-looking path over a stateful, non-cacheable, verb-tunneling
    design is not RESTful just because it reads nicely.
  ref: concepts.md#common-rest-myths-busted
- id: rest-fundamentals-and-constraints-045
  difficulty: advanced
  tags:
  - myths
  - hateoas
  - usefulness
  question: |
    Which statement correctly separates "useful" from "fully RESTful"?
  options:
  - Level-2 APIs are enormously useful; HATEOAS is what makes an API fully REST per Fielding, which is
    a different bar from being useful
  - An API must be RMM level 3 to be useful at all
  - Usefulness and RESTfulness are identical properties
  - Only hypermedia-driven APIs return any business value
  answer: 0
  explanation: |
    Usefulness and maximal RESTfulness are different bars. The vast majority of
    valuable production APIs are level 2 and omit hypermedia; HATEOAS is required to be
    fully REST per Fielding, but its absence does not make an API useless.
  ref: concepts.md#common-rest-myths-busted
- id: rest-fundamentals-and-constraints-046
  difficulty: intermediate
  tags:
  - uniform-interface
  - hateoas
  - wire
  question: |
    An order response embeds "_links" with "self", "cancel", and "pay" hrefs. Which
    REST sub-constraint does this demonstrate?
  options:
  - Layered system
  - Hypermedia as the engine of application state (HATEOAS)
  - Code-on-demand
  - Statelessness
  answer: 1
  explanation: |
    Embedding links that tell the client which next actions are available (cancel, pay)
    is HATEOAS: the server drives application state transitions through hypermedia in
    the representation, rather than the client hardcoding URIs.
  ref: concepts.md#uniform-interface-and-its-sub-constraints
- id: rest-fundamentals-and-constraints-047
  difficulty: beginner
  tags:
  - constraints
  - mapping-properties
  question: |
    Which constraint is most directly associated with the property of independent
    evolution of the UI and the server?
  options:
  - Cacheability
  - Client-server separation
  - Code-on-demand
  - Layered system
  answer: 1
  explanation: |
    Client-server separation lets the consumer (UI) and the server (data/logic) evolve
    independently across a shared contract. That separation of concerns is the property
    the constraint buys.
  ref: concepts.md#fieldings-six-architectural-constraints
- id: rest-fundamentals-and-constraints-048
  difficulty: advanced
  tags:
  - statelessness
  - layered-system
  - synergy
  question: |
    Why is statelessness what makes a layered system's intermediaries able to be
    transparent?
  options:
  - Because stateless servers refuse all intermediaries
  - Because self-contained requests let an intermediary route, cache, or inspect a request without needing
    prior conversational context
  - Because layering requires sticky sessions to work
  - Because intermediaries store the session state instead of the origin
  answer: 1
  explanation: |
    Since a stateless request carries all needed context, an intermediary layer can
    route, cache, or load-balance it in isolation without replaying earlier requests.
    That self-containment is precisely what lets layers stay transparent to the client.
  ref: concepts.md#layered-system
- id: rest-fundamentals-and-constraints-049
  difficulty: intermediate
  tags:
  - rest-vs-rpc
  - coupling
  question: |
    In terms of client-server coupling, how do REST and RPC differ?
  options:
  - REST clients must know procedure names and signatures; RPC clients follow links
  - Neither style involves any coupling
  - RPC clients are always more loosely coupled than REST clients
  - REST clients rely on media types and (ideally) follow links; RPC clients must know the procedure names
    and their signatures
  answer: 3
  explanation: |
    RPC couples the client to specific procedure names and argument signatures. REST
    aims for looser coupling: clients depend on standardized media types and, at higher
    maturity, discover actions by following hypermedia links rather than hardcoding
    operations.
  ref: concepts.md#rest-vs-rpc
- id: rest-fundamentals-and-constraints-050
  difficulty: advanced
  tags:
  - cacheable
  - conditional-requests
  - revalidation
  question: |
    How do conditional requests (ETag/If-None-Match) improve on plain caching?
  options:
  - They let a cache cheaply revalidate a stored response, getting a 304 Not Modified instead of re-transferring
    the full body when unchanged
  - They disable caching entirely for correctness
  - They force the server to send the full body every time
  - They only work for POST requests
  answer: 0
  explanation: |
    Conditional requests let a client/cache send a validator (ETag via If-None-Match,
    or Last-Modified via If-Modified-Since). If the resource is unchanged the server
    returns 304 Not Modified with no body, saving bandwidth while confirming freshness
    — the efficiency payoff of cacheability plus validators.
  ref: concepts.md#cacheability
- id: rest-fundamentals-and-constraints-051
  difficulty: beginner
  tags:
  - rmm
  - level-3
  - hateoas
  question: |
    What ingredient distinguishes RMM Level 3 from Level 2?
  options:
  - Hypermedia controls (HATEOAS) that drive state transitions via links in responses
  - The use of JSON instead of XML
  - The use of HTTPS
  - Multiple resource URIs
  answer: 0
  explanation: |
    Level 3 adds hypermedia controls on top of level 2's resources and verbs: responses
    embed links that tell the client the available next state transitions. Fowler calls
    this "the glory of REST."
  ref: concepts.md#the-richardson-maturity-model
- id: rest-fundamentals-and-constraints-052
  difficulty: intermediate
  tags:
  - uniform-interface
  - identification
  - manipulation
  question: |
    "Clients act on a resource by exchanging a document that reflects the resource's
    desired state, never by directly touching the server's internal storage." Which
    sub-constraint is this?
  options:
  - Self-descriptive messages
  - Identification of resources
  - HATEOAS
  - Manipulation of resources through representations
  answer: 3
  explanation: |
    Manipulation of resources through representations means clients create, modify, or
    delete resources by exchanging representations (documents + metadata), not by
    touching the server's internal data structures directly.
  ref: concepts.md#uniform-interface-and-its-sub-constraints
- id: rest-fundamentals-and-constraints-053
  difficulty: advanced
  tags:
  - properties
  - tradeoffs
  - uniform-interface
  question: |
    A senior interviewer asks: "Name a property from Fielding's dissertation that REST
    deliberately SACRIFICES, and for what." Which answer is correct?
  options:
  - REST sacrifices scalability to gain simplicity
  - REST sacrifices per-interaction efficiency (standardized rather than tailored payloads) to gain generality
    and evolvability via the uniform interface
  - REST sacrifices reliability to gain visibility
  - REST sacrifices statelessness to gain cacheability
  answer: 1
  explanation: |
    Fielding is explicit that the uniform interface degrades efficiency relative to an
    application-specific interface because information is transferred in a standardized
    form. REST accepts that per-interaction inefficiency to buy generality, decoupling,
    and evolvability. (Separately, code-on-demand trades away visibility.)
  ref: concepts.md#architectural-properties-rest-optimizes-and-sacrifices
- id: rest-fundamentals-and-constraints-054
  difficulty: advanced
  tags:
  - properties
  - visibility
  - code-on-demand
  question: |
    Which architectural property is specifically traded away by the code-on-demand
    constraint, and why is that the reason it is optional?
  options:
  - Scalability, because executable code cannot be load-balanced
  - Portability, because scripts only run on one platform
  - Visibility, because an intermediary can no longer fully understand behavior from the message alone once
    executable code drives the client
  - Reliability, because code always crashes clients
  answer: 2
  explanation: |
    Code-on-demand reduces visibility: once the server ships executable code, a monitor
    or cache can no longer understand the interaction purely from the message. Because
    that cost isn't always worth the client-extensibility benefit, Fielding left it as
    the sole optional constraint.
  ref: concepts.md#architectural-properties-rest-optimizes-and-sacrifices
- id: rest-fundamentals-and-constraints-055
  difficulty: expert
  tags:
  - connectors
  - vocabulary
  - fielding
  question: |
    In Fielding's REST vocabulary (dissertation §5.2), which of the following is a
    CONNECTOR type rather than a component or a data element?
  options:
  - Origin server
  - Cache
  - User agent
  - Representation metadata
  answer: 1
  explanation: |
    Fielding's connectors are client, server, cache, resolver, and tunnel. Origin server
    and user agent are components; representation metadata is a data element. A cache is a
    connector because it is an abstract interface mediating communication (storing and
    reusing responses).
  ref: concepts.md#data-connector-and-component-elements
- id: rest-fundamentals-and-constraints-056
  difficulty: expert
  tags:
  - control-data
  - self-descriptive
  - vocabulary
  question: |
    A depth probe: "What is 'control data' in REST, and give an example." Which answer is
    correct?
  options:
  - The bytes of the resource's stored state in the database
  - Data that defines the purpose of a message and how to process it — e.g. the request method, status code,
    Cache-Control, or If-None-Match
  - The URI that identifies the resource
  - The credentials used to authenticate the request
  answer: 1
  explanation: |
    Control data defines a message's purpose and processing semantics: the HTTP method,
    the status code, and caching/conditional headers such as Cache-Control and
    If-None-Match. It is distinct from the representation (the body) and from
    representation metadata (Content-Type, ETag). Control data is what makes messages
    self-descriptive to intermediaries.
  ref: concepts.md#data-connector-and-component-elements
- id: rest-fundamentals-and-constraints-057
  difficulty: expert
  tags:
  - connectors
  - tunnel
  - resolver
  question: |
    An SSL CONNECT proxy relays encrypted bytes across a firewall boundary without
    understanding or acting on the payload. In Fielding's connector taxonomy, this is a:
  options:
  - Cache
  - Resolver
  - Gateway
  - Tunnel
  answer: 3
  explanation: |
    A tunnel relays communication opaquely across a boundary without interpreting the
    payload (e.g. an SSL/CONNECT proxy or firewall pass-through). A resolver translates
    identifiers to network addresses (DNS); a cache stores responses. Note "gateway" is a
    component, not a connector.
  ref: concepts.md#data-connector-and-component-elements
- id: rest-fundamentals-and-constraints-058
  difficulty: expert
  tags:
  - hateoas
  - fielding
  - namespace
  question: |
    Per Fielding's "REST APIs must be hypertext-driven," a client library builds request
    URLs by concatenating a base with "/users/" + id + "/orders". Why is this NON-conformant
    even if every request otherwise uses correct verbs and status codes?
  options:
  - Because query strings are forbidden in REST
  - Because the client has baked in the server's URI structure; in a hypertext-driven API the server owns
    its namespace and the client must discover URIs from server-provided links/templates
  - Because id should be sent in a header, not the path
  - Because orders must be a separate top-level resource
  answer: 1
  explanation: |
    Fielding's rule 4: the server owns its URI namespace and clients must not depend on
    URI structure. A hypertext-driven client follows links or expands server-provided URI
    templates (RFC 6570) rather than constructing paths by string concatenation. Baking in
    structure is out-of-band coupling — "the data-oriented equivalent of RPC's functional
    coupling."
  ref: concepts.md#hateoas-in-depth-what-compliance-actually-requires
- id: rest-fundamentals-and-constraints-059
  difficulty: expert
  tags:
  - hateoas
  - versioning
  - evolvability
  question: |
    "If you version your URIs with /v2/..., what has Fielding's hypertext-driven principle
    already implied you got wrong?" What is the best answer?
  options:
  - Nothing; URI versioning is the REST-recommended evolution strategy
  - A hypertext-driven client shouldn't construct or depend on URI structure, so it wouldn't need URI versioning;
    URL versioning is in tension with HATEOAS and self-descriptive evolvability
  - You should have used /version/2/ instead for clarity
  - Versioning belongs in the request body, not the URL
  answer: 1
  explanation: |
    If clients discover URIs from server-supplied hypermedia rather than building them,
    they don't hardcode a URI shape that would need versioning. URL versioning implies
    clients depend on URI structure, which contradicts HATEOAS; media-type/content
    negotiation is the more REST-aligned evolution path. This is a genuine Fielding
    position, though pragmatic teams still version URLs.
  ref: concepts.md#hateoas-in-depth-what-compliance-actually-requires
- id: rest-fundamentals-and-constraints-060
  difficulty: advanced
  tags:
  - hateoas
  - coupling
  - fielding
  question: |
    Fielding calls reliance on out-of-band knowledge to drive client interaction "the
    data-oriented equivalent of RPC's functional coupling." What does he mean?
  options:
  - That REST and RPC are identical in every respect
  - That hardcoding URIs/contracts the client compiles against couples the client to server internals just
    as tightly as calling named RPC procedures does, defeating REST's evolvability
  - That data should never be sent over RPC
  - That functional programming is required for REST
  answer: 1
  explanation: |
    A client that hardcodes URI templates or compiles against a fixed contract is coupled
    to server-side decisions exactly as an RPC client is coupled to procedure signatures.
    Both prevent the server from evolving freely. Hypermedia removes that coupling by
    letting the server present available transitions at runtime.
  ref: concepts.md#hateoas-in-depth-what-compliance-actually-requires
- id: rest-fundamentals-and-constraints-061
  difficulty: expert
  tags:
  - hypermedia-formats
  - hal
  - actions
  question: |
    A team says their API "does HATEOAS with HAL." An interviewer asks how they express a
    WRITE action (method + input fields) for a client to submit. What is the accurate
    situation?
  options:
  - Plain HAL fully models write actions including methods and fields
  - HAL's _links model read links (hrefs + relations) but not templated write actions; you need HAL-FORMS,
    Siren, or Collection+JSON to express method + fields
  - HATEOAS never involves write actions, only navigation
  - HAL requires GraphQL to submit forms
  answer: 1
  explanation: |
    Base HAL (application/hal+json) expresses links via _links but does not describe how
    to perform a write (HTTP method, expected fields). HAL-FORMS, Siren (actions), or
    Collection+JSON (template) add that affordance. This is a common gap: "we do HAL" often
    means read-only hypermedia.
  ref: concepts.md#hypermedia-formats-and-link-standards
- id: rest-fundamentals-and-constraints-062
  difficulty: advanced
  tags:
  - web-linking
  - rfc8288
  - pagination
  question: |
    An API paginates a JSON collection and wants to advertise the next page using a
    standardized mechanism rather than a bespoke field. Which is the RFC-standard approach?
  options:
  - Add a custom "nextPageUrl" string to the JSON body
  - Use the RFC 8288 Link header with a registered relation, e.g. Link, <...?page=3>; rel="next"
  - Return a 3xx redirect to the next page
  - Put the next URL in a Set-Cookie header
  answer: 1
  explanation: |
    RFC 8288 (Web Linking) defines the Link response header and leans on the IANA
    link-relation registry (self, next, prev, first, last). It lets you carry hypermedia
    even when the body isn't a hypermedia format, and standardizes pagination discovery
    instead of a bespoke field name.
  ref: concepts.md#hypermedia-formats-and-link-standards
- id: rest-fundamentals-and-constraints-063
  difficulty: advanced
  tags:
  - uri-templates
  - rfc6570
  - namespace
  question: |
    Which standard lets a server hand a client a parameterized link like
    "/users/{id}{?fields}" for the client to expand, supporting Fielding's "server owns the
    namespace" rule?
  options:
  - RFC 3986 URI generic syntax alone
  - RFC 6570 URI Templates
  - RFC 9110 HTTP semantics
  - RFC 7519 JWT
  answer: 1
  explanation: |
    RFC 6570 defines URI Templates. A server can publish templated links that the client
    expands by filling variables, so the client parameterizes URIs without constructing
    their structure. This directly supports the HATEOAS principle that the server, not the
    client, owns the URI namespace.
  ref: concepts.md#hypermedia-formats-and-link-standards
- id: rest-fundamentals-and-constraints-064
  difficulty: expert
  tags:
  - idempotency
  - put
  - rfc9110
  question: |
    A PUT handler updates the resource and also sets "updatedAt = now()", so two identical
    PUTs return bodies with different timestamps. Is the method still idempotent per RFC 9110?
  options:
  - No, because the two responses differ, so it is not idempotent
  - Yes, because idempotency constrains the intended effect on server state, not byte-identical responses;
    the resource ends in the same logical state
  - No, because any write is by definition non-idempotent
  - Yes, but only if you also strip the timestamp from the response
  answer: 1
  explanation: |
    RFC 9110 §9.2.2 defines idempotency by the intended effect on server state of N>=1
    identical requests, not by identical responses. A PUT that overwrites (including a
    refreshed updatedAt) leaves the resource in the same logical state on repeat, so it
    remains idempotent. A PUT that appended on each call would not be.
  ref: concepts.md#safety-idempotency-and-cacheability-as-method-properties
- id: rest-fundamentals-and-constraints-065
  difficulty: expert
  tags:
  - idempotency
  - delete
  - status-codes
  question: |
    DELETE /orders/42 returns 204 the first time and 404 on a second identical call. A
    reviewer claims this violates idempotency. What is correct?
  options:
  - The reviewer is right; idempotent methods must always return the same status code
  - The method is still idempotent because idempotency is about the effect on server state (resource is gone
    and stays gone), not about returning an identical response
  - DELETE is never idempotent, so the question is moot
  - It becomes idempotent only if the second call also returns 204
  answer: 1
  explanation: |
    Idempotency (RFC 9110 §9.2.2) constrains the server-state effect, not the response
    code. After the first DELETE the resource is gone; repeating leaves it gone. Returning
    204 then 404 is perfectly idempotent — the differing status reflects current state, not
    a different effect.
  ref: concepts.md#safety-idempotency-and-cacheability-as-method-properties
- id: rest-fundamentals-and-constraints-066
  difficulty: expert
  tags:
  - idempotency-key
  - post
  - reliability
  question: |
    A payment client sends "POST /charges" but the connection drops before it sees the
    response. It must retry without risking a double charge. What is the standard,
    semantics-preserving mechanism?
  options:
  - Change the endpoint to PUT so the retry is idempotent
  - Send an Idempotency-Key header; the server records key + result and returns the same result on replay
    instead of re-executing
  - Rely on the shared cache to dedupe the second POST
  - Wrap both requests in a database transaction on the client
  answer: 1
  explanation: |
    POST is neither safe nor idempotent, so retries risk duplicates. An idempotency key
    (e.g. Idempotency-Key: <uuid>) lets the server detect a replay and return the original
    result rather than charging again — restoring safe retry under statelessness without
    changing POST's semantics. Blindly switching to PUT would misuse the method's meaning.
  ref: concepts.md#safety-idempotency-and-cacheability-as-method-properties
- id: rest-fundamentals-and-constraints-067
  difficulty: advanced
  tags:
  - safe-methods
  - prefetch
  - rfc9110
  question: |
    Why does the "safe" property (RFC 9110 §9.2.1) matter architecturally, beyond being a
    label?
  options:
  - Because safe methods are always faster than unsafe ones
  - Because safe methods request no client-visible state change, so intermediaries and prefetchers may issue
    them speculatively without side effects
  - Because safe methods cannot be cached
  - Because safe methods bypass authentication
  answer: 1
  explanation: |
    Safe means read-only from the client's perspective (no client-visible side effects).
    That guarantee is what lets crawlers, link prefetchers, and caches issue GET/HEAD
    speculatively. Server-side logging doesn't count as a client-visible effect. Safety is
    an architectural affordance, not just documentation.
  ref: concepts.md#safety-idempotency-and-cacheability-as-method-properties
- id: rest-fundamentals-and-constraints-068
  difficulty: advanced
  tags:
  - rest-ish
  - application-protocol
  - transport
  question: |
    An API exposes a single "POST /api" endpoint, always returns HTTP 200, and puts an
    "action" field and any error inside the JSON body. In REST terms, this design:
  options:
  - Uses HTTP as an application protocol and is fully RESTful
  - Uses HTTP as a dumb transport (semantics live in the payload, not in methods/status), which is RPC-style,
    not REST
  - Is RMM level 3 because it uses JSON
  - Is REST-ish because the URL is clean
  answer: 1
  explanation: |
    Collapsing everything into one POST that always returns 200 discards HTTP method and
    status-code semantics; the meaning lives entirely in the payload. That is HTTP as
    transport (RPC-style / RMM level 0), not HTTP as an application protocol. It is neither
    REST nor "REST-ish" (which at least uses real verbs/status codes).
  ref: concepts.md#http-as-application-protocol-vs-transport
- id: rest-fundamentals-and-constraints-069
  difficulty: expert
  tags:
  - content-negotiation
  - vary
  - caching
  question: |
    A resource is served as JSON or XML based on the Accept header, fronted by a shared
    CDN cache. The origin omits the Vary header. What is the likely failure?
  options:
  - The CDN will refuse to cache anything
  - The CDN may cache one representation (say JSON) and serve it to a client that asked for XML, because it
    didn't key the cache on Accept
  - Clients will receive 406 Not Acceptable for every request
  - The origin will be forced to disable content negotiation
  answer: 1
  explanation: |
    When a response varies by a request header, the origin must send Vary: Accept so a
    shared cache stores separate entries per Accept value. Omitting Vary lets the cache
    serve a stored JSON copy to an XML requester — a classic cache-correctness (poisoning)
    bug that ties cacheability and content negotiation together.
  ref: concepts.md#content-negotiation-in-depth
- id: rest-fundamentals-and-constraints-070
  difficulty: advanced
  tags:
  - content-negotiation
  - status-codes
  - 406-415
  question: |
    A client sends "Content-Type: application/xml" in a POST body, but the server only
    accepts JSON bodies. Which status code correctly signals this, and how does it differ
    from 406?
  options:
  - 406 Not Acceptable, because the server can't satisfy the request
  - 415 Unsupported Media Type, because the server refuses the request BODY's media type; 406 is instead about
    being unable to produce a representation matching the client's Accept
  - 400 Bad Request, since media types aren't part of HTTP
  - 415 and 406 are interchangeable
  answer: 1
  explanation: |
    415 Unsupported Media Type rejects the request payload's Content-Type (the request-side
    problem). 406 Not Acceptable is the response-side counterpart: the server cannot produce
    any representation matching the client's Accept* constraints. They address opposite
    directions of content negotiation.
  ref: concepts.md#content-negotiation-in-depth
- id: rest-fundamentals-and-constraints-071
  difficulty: expert
  tags:
  - resource-modeling
  - actions
  - transfers
  question: |
    You must design a "transfer money between accounts" operation. Which design is most
    aligned with resource-oriented REST and also best supports auditing and safe retries?
  options:
  - POST /transferMoney with {from, to, amount} as an RPC-style action endpoint
  - POST /transfers creating a first-class transfer resource (/transfers/{id}) you can GET, audit, and retry
    idempotently with an idempotency key
  - GET /transfer?from=1&to=2&amount=100 so it can be cached
  - PUT /accounts/1 with a decremented balance and PUT /accounts/2 with an incremented balance
  answer: 1
  explanation: |
    Reifying the process as a noun — POST /transfers creating a transfer resource — makes it
    addressable, auditable, and safely retryable (with an idempotency key). A verb endpoint
    (transferMoney) is RPC-style; using GET for a state change violates safety; two separate
    PUTs can't be atomic and expose internal balances.
  ref: concepts.md#resource-modeling-nouns-custom-methods-and-anti-patterns
- id: rest-fundamentals-and-constraints-072
  difficulty: advanced
  tags:
  - resource-modeling
  - db-schema
  - anti-pattern
  question: |
    Google's AIP-121 warns against a common resource-modeling anti-pattern. Which is it?
  options:
  - Using plural nouns for collections
  - Mirroring your database schema 1:1 as the API's resources, which tightly couples the API to storage and
    leaks internal structure
  - Returning JSON instead of protobuf
  - Nesting resources more than one level deep
  answer: 1
  explanation: |
    AIP-121 (resource-oriented design) cautions against exposing your database tables/rows
    directly as API resources. That couples the public contract to internal storage and
    leaks implementation detail; model resources around the domain concepts clients need
    instead. (Resource hierarchies should also form a DAG, never a cycle.)
  ref: concepts.md#resource-modeling-nouns-custom-methods-and-anti-patterns
- id: rest-fundamentals-and-constraints-073
  difficulty: advanced
  tags:
  - resource-modeling
  - custom-methods
  - aip136
  question: |
    An "order cancel" is a state transition that doesn't cleanly map to CRUD. What is the
    recommended escalation order for modeling it?
  options:
  - Always use a custom method like POST /orders/1001:cancel first
  - First try to reify the action as a noun/resource (e.g. a cancellation record); fall back to a custom method
    (POST /orders/1001/cancel or :cancel) only when reification adds no value
  - Use DELETE /orders/1001 since cancel removes the order
  - Use GET /orders/1001/cancel so the result is cacheable
  answer: 1
  explanation: |
    The senior approach is to prefer standard methods, try to turn the action into a noun
    when that adds value (auditable, addressable), and use a custom method (AIP-136 colon
    syntax or a /cancel sub-path) only as a last resort. DELETE means "remove the resource,"
    not "cancel," and a state change must not be a GET.
  ref: concepts.md#resource-modeling-nouns-custom-methods-and-anti-patterns
- id: rest-fundamentals-and-constraints-074
  difficulty: expert
  tags:
  - graphql
  - caching
  - tradeoffs
  question: |
    Compared to a REST API, what does a typical GraphQL-over-HTTP API give up, and what
    does it gain?
  options:
  - Gains binary efficiency; gives up JSON support
  - Gains precise client-specified field selection (solving over/under-fetching); gives up first-class HTTP
    caching and status-code semantics, and makes rate-limiting harder
  - Gains HTTP caching; gives up strong typing
  - Gains bidirectional streaming; gives up a schema
  answer: 1
  explanation: |
    GraphQL lets clients request exactly the fields they need (great for varied clients),
    but because everything is a POST to /graphql it loses HTTP/CDN caching and HTTP status
    semantics, complicates rate-limiting (query cost varies), and risks N+1 resolver
    problems. Binary/streaming is gRPC's domain, not GraphQL's.
  ref: concepts.md#rest-vs-graphql-vs-grpc
- id: rest-fundamentals-and-constraints-075
  difficulty: advanced
  tags:
  - grpc
  - streaming
  - internal-services
  question: |
    For which scenario is gRPC most clearly the better choice over a REST/JSON API?
  options:
  - A broad public API that benefits from CDN caching and curl-based debugging
  - High-throughput internal service-to-service calls needing binary protobuf efficiency, HTTP/2 multiplexing,
    generated clients, and bidirectional streaming
  - A browser app that must run without extra tooling
  - An API whose main requirement is human-readable, cacheable responses
  answer: 1
  explanation: |
    gRPC's strengths — protobuf binary encoding, HTTP/2 multiplexing, codegen contracts,
    and native bidirectional streaming — fit internal microservice-to-microservice traffic.
    Its weaknesses (poor browser support, binary/hard-to-debug wire, HTTP-as-transport)
    make it a poor fit for broad, cacheable, human-debuggable public APIs where REST shines.
  ref: concepts.md#rest-vs-graphql-vs-grpc
- id: rest-fundamentals-and-constraints-076
  difficulty: advanced
  tags:
  - when-not-rest
  - websockets
  - sse
  question: |
    You need to push live price updates from server to many browser clients over plain
    HTTP, one-way, with automatic reconnection. Which is the most fitting choice, and why
    is REST request/response a poor fit?
  options:
  - Poll a REST endpoint every 100ms; REST is always sufficient
  - Server-Sent Events (SSE), because REST's request/response model can't push, so a one-way server-to-client
    stream over HTTP fits better
  - gRPC bidirectional streaming, because browsers speak gRPC natively
  - A shared cache with a very low max-age
  answer: 1
  explanation: |
    REST is request/response and can't push; polling wastes resources. SSE provides a
    one-way server-to-client event stream over ordinary HTTP with built-in reconnection —
    ideal for live feeds. WebSockets fit bidirectional needs; gRPC streaming isn't natively
    consumable by browsers without extra layers.
  ref: concepts.md#when-not-to-use-rest
- id: rest-fundamentals-and-constraints-077
  difficulty: expert
  tags:
  - when-not-rest
  - async
  - 202-accepted
  question: |
    A request kicks off a video transcode that takes minutes. Which pattern keeps the API
    RESTful and stateless while handling the long-running work?
  options:
  - Hold the HTTP connection open until the job finishes and return 200
  - Return 202 Accepted with a Location naming an operation/status resource the client polls (or registers
    a webhook), then GET the result when complete
  - Return 200 immediately with a fake result and reconcile later
  - Store the client's progress in server session memory and stream it back
  answer: 1
  explanation: |
    The RESTful async pattern: respond 202 Accepted and expose an operation/status
    resource (via Location) that the client polls with GET until completion, or notify via
    webhook. This avoids blocking, keeps requests self-contained (stateless), and makes the
    operation a first-class, inspectable resource.
  ref: concepts.md#when-not-to-use-rest
- id: rest-fundamentals-and-constraints-078
  difficulty: expert
  tags:
  - statelessness
  - sticky-sessions
  - operations
  question: |
    A shopping cart is stored in per-instance memory and clients are pinned to their
    instance via sticky sessions. Which set of operational problems does this most directly
    cause?
  options:
  - Slower TLS handshakes and larger request headers
  - Broken elastic autoscaling (new nodes get no pinned traffic; scale-in drops sessions), disrupted rolling
    deploys (recycling a node loses carts), and lost state on failover
  - Inability to use HTTPS or HTTP/2
  - Cache poisoning of shared CDNs
  answer: 1
  explanation: |
    Sticky sessions are exactly the anti-pattern statelessness removes. Pinning
    conversational state to one instance breaks autoscaling, rolling deploys, and failover.
    The fix is to carry cart identity in the request (token/cart-id) and store the cart as
    resource state in a shared datastore, so any instance can serve any request.
  ref: concepts.md#statelessness-in-production-sticky-sessions-and-idempotency-keys
- id: rest-fundamentals-and-constraints-079
  difficulty: advanced
  tags:
  - statelessness
  - transport
  - http2
  question: |
    A candidate claims "using a long-lived keep-alive TCP/HTTP/2 connection makes the API
    stateful, so it's not RESTful." What is the correct rebuttal?
  options:
  - They're right; any persistent connection violates statelessness
  - TCP/TLS connection state is transport-layer; REST statelessness is about not retaining per-client conversational
    (application) state between requests, which is fully compatible with a stateful transport
  - Statelessness requires a new TCP connection per request
  - HTTP/2 is banned by the REST constraints
  answer: 1
  explanation: |
    Statelessness is an application-layer property: the server keeps no per-client
    conversational state between requests. That's orthogonal to transport: a kept-alive TCP
    connection or multiplexed HTTP/2 streams don't make the application stateful. Indeed
    HTTP/2 HPACK header compression helps offset the cost of re-sending context each request.
  ref: concepts.md#statelessness-in-production-sticky-sessions-and-idempotency-keys
- id: rest-fundamentals-and-constraints-080
  difficulty: expert
  tags:
  - layered-system
  - statelessness
  - paired-constraints
  question: |
    In "Client -> CDN -> API gateway -> service," which constraint PERMITS the
    intermediaries, and which constraint makes them TRANSPARENT to the client?
  options:
  - Cacheability permits them; code-on-demand makes them transparent
  - Layered system permits the intermediaries; statelessness (self-contained requests) makes them transparent
    by letting each hop route/cache without conversational context
  - Client-server permits them; uniform interface makes them transparent
  - Uniform interface permits them; layered system makes them transparent
  answer: 1
  explanation: |
    The layered-system constraint is what allows transparent intermediaries. Statelessness
    is what keeps them transparent: because each request carries all needed context, a CDN
    or gateway can route, cache, or inspect it in isolation, so the client can't tell it
    isn't talking directly to the origin. The two constraints work as a pair.
  ref: concepts.md#layered-system-intermediary-types-in-practice
- id: rest-fundamentals-and-constraints-081
  difficulty: advanced
  tags:
  - layered-system
  - service-mesh
  - intermediaries
  question: |
    A service-mesh sidecar (e.g. Envoy) deployed next to each microservice handles mTLS,
    retries, and observability transparently. Which REST constraint does this exemplify,
    and what is the modern point?
  options:
  - Cacheability; the sidecar is just a cache
  - Layered system; it applies transparent intermediaries at per-microservice granularity, concentrating cross-cutting
    concerns without the service code knowing
  - Code-on-demand; the sidecar ships code to clients
  - Client-server; the sidecar replaces the server
  answer: 1
  explanation: |
    A sidecar proxy is a transparent intermediary — the layered-system constraint applied at
    microservice granularity. It moves cross-cutting concerns (mTLS, retries, timeouts,
    telemetry) out of application code, and the service is unaware it's there, which is the
    whole point of layering.
  ref: concepts.md#layered-system-intermediary-types-in-practice
- id: rest-fundamentals-and-constraints-082
  difficulty: intermediate
  tags:
  - code-on-demand
  - modern-examples
  question: |
    Which is a modern (non-dated) example of the code-on-demand constraint?
  options:
  - A JSON API returning a list of orders
  - A server shipping a WebAssembly (WASM) module or downloadable client-side validation rules that the client
    executes at runtime
  - A CDN caching static images
  - An API gateway enforcing rate limits
  answer: 1
  explanation: |
    Code-on-demand means the server extends client behavior by sending executable code.
    Beyond the classic browser <script>, modern examples include WASM modules, downloadable
    validation rules, and remote-config-driven behavior. It still trades away visibility,
    which is why it's the optional constraint.
  ref: concepts.md#code-on-demand-modern-examples
- id: rest-fundamentals-and-constraints-083
  difficulty: intermediate
  tags:
  - hypermedia-formats
  - profile
  - rfc6906
  question: |
    What is the purpose of the RFC 6906 "profile" link relation?
  options:
  - To specify the caching lifetime of a representation
  - To point to a description of the semantics/constraints of a representation, letting clients agree on an
    application-level profile without inventing a new media type
  - To authenticate the request
  - To indicate the next page of a collection
  answer: 1
  explanation: |
    RFC 6906 defines the profile link relation, which references additional
    semantics/constraints layered on top of a base media type. It lets a generic media
    type (like application/json or hal+json) carry application-specific meaning without
    minting a brand-new media type for every variation.
  ref: concepts.md#hypermedia-formats-and-link-standards
- id: rest-fundamentals-and-constraints-084
  difficulty: expert
  tags:
  - representation-metadata
  - vocabulary
  - self-descriptive
  question: |
    Which pairing correctly classifies these headers/values in Fielding's data-element
    vocabulary?
  options:
  - Content-Type and ETag are control data; the HTTP method is representation metadata
  - Content-Type and ETag are representation metadata; the HTTP method, status code, and Cache-Control are
    control data
  - All headers are resource metadata; the body is control data
  - The URI is representation metadata; the status code is a data element called a resource
  answer: 1
  explanation: |
    Content-Type and ETag describe the representation being transferred, so they are
    representation metadata. The method, status code, and Cache-Control define the purpose
    and handling of the message, so they are control data. The URI is the resource
    identifier; the body is the representation. Getting this taxonomy right is a senior
    depth signal.
  ref: concepts.md#data-connector-and-component-elements
