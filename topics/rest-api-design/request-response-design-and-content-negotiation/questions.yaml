topic: "Request/Response Design & Content Negotiation"
domain: rest-api-design
topic_slug: request-response-design-and-content-negotiation
version: 1
questions:
  - id: request-response-design-and-content-negotiation-001
    difficulty: beginner
    tags: [dto, payload-shaping, security]
    question: |
      Why is serializing your database entity directly to the JSON response
      generally discouraged in API design?
    options:
      - "It makes responses larger than using a DTO in every case"
      - "It can leak sensitive fields and couples the wire contract to schema changes"
      - "JSON cannot represent database rows accurately"
      - "It prevents the server from returning a 201 status code"
    answer: 1
    explanation: |
      Returning the entity risks exposing fields the client shouldn't see (OWASP
      API3:2023 Broken Object Property Level Authorization) and ties your public
      contract to every schema migration. A deliberately designed DTO decouples the
      wire shape from the persistence model.
    ref: "concepts.md#dto-and-payload-shaping"

  - id: request-response-design-and-content-negotiation-002
    difficulty: intermediate
    tags: [dto, mass-assignment, security]
    question: |
      A client sends this to create a user:
      `POST /users {"name":"Ada","email":"a@x.com","role":"ADMIN","id":999}`.
      The server blind-binds the request body to its domain object. What is the flaw?
    options:
      - "The email field should be validated as a string"
      - "A 200 status should be returned instead of 201"
      - "Mass assignment: the client can set server-controlled fields like role and id"
      - "The name field is too short to be valid"
    answer: 2
    explanation: |
      Blind-binding lets a client set fields they shouldn't control (`role`, `id`).
      Bind writes to an explicit input DTO with an allowlist of settable fields;
      server-controlled fields (id, role, timestamps) must be read-only on input.
      This is the mass-assignment half of OWASP API3:2023.
    ref: "concepts.md#dto-and-payload-shaping"

  - id: request-response-design-and-content-negotiation-003
    difficulty: intermediate
    tags: [dto, enums, formatting]
    question: |
      For a resource's `status` field, why prefer sending `"status": "PENDING"`
      over `"status": 0`?
    options:
      - "Ordinal integers break if the enum order changes; string names are stable and self-describing"
      - "Strings are always smaller on the wire than integers"
      - "JSON does not support integer values"
      - "Integers cannot be indexed by clients"
    answer: 0
    explanation: |
      Sending the enum ordinal couples the contract to the declaration order — reorder
      the enum and every stored/transmitted value silently means something else. String
      names are stable and self-documenting.
    ref: "concepts.md#dto-and-payload-shaping"

  - id: request-response-design-and-content-negotiation-004
    difficulty: intermediate
    tags: [dto, embedding, linking]
    question: |
      When designing `GET /orders/{id}`, what is the main trade-off between embedding
      the full `customer` object versus returning just `customerId` or a link?
    options:
      - "Embedding is always more RESTful and should always be chosen"
      - "Linking is disallowed by RFC 9110"
      - "Embedding reduces round-trips but couples and bloats; linking is leaner but chattier"
      - "There is no difference once the response is compressed"
    answer: 2
    explanation: |
      Embedding saves the client a follow-up request but increases coupling and payload
      size; linking keeps the response lean but forces extra round-trips. Choose per
      access pattern, ideally making expansion opt-in via a parameter.
    ref: "concepts.md#dto-and-payload-shaping"

  - id: request-response-design-and-content-negotiation-005
    difficulty: beginner
    tags: [dto, request-response, asymmetry]
    question: |
      Which statement about request and response DTOs is most accurate?
    options:
      - "They are often asymmetric — the create input differs from the returned representation"
      - "They must always be the same shape for a given resource"
      - "Response DTOs should include the client's raw input verbatim"
      - "Request DTOs should contain server-generated fields like id and createdAt"
    answer: 0
    explanation: |
      The input to create a resource (e.g. items, couponCode) is typically not the
      output (which adds id, status, totals, createdAt, a Location header). Request and
      response DTOs are commonly asymmetric.
    ref: "concepts.md#dto-and-payload-shaping"

  - id: request-response-design-and-content-negotiation-006
    difficulty: beginner
    tags: [naming, camelcase, snakecase]
    question: |
      Which is the single most important rule when choosing a JSON field naming
      convention for an API?
    options:
      - "Always use snake_case because it is more readable"
      - "Always use camelCase because RFC 8259 requires it"
      - "Be consistent across the entire API; mixing conventions signals leaked internal models"
      - "Use PascalCase so acronyms render correctly"
    answer: 2
    explanation: |
      JSON mandates no case convention. Consistency across the whole API matters far more
      than which one you pick; mixing `first_name` and `lastName` in one payload usually
      means multiple internal models are leaking through.
    ref: "concepts.md#json-field-naming-conventions"

  - id: request-response-design-and-content-negotiation-007
    difficulty: beginner
    tags: [naming, camelcase]
    question: |
      Why is `camelCase` a common default for new JSON APIs consumed by web front-ends?
    options:
      - "It compresses better than snake_case"
      - "It is mandated by the JSON specification"
      - "It is the only convention supported by OpenAPI"
      - "It maps cleanly to JavaScript property access like user.firstName"
    answer: 3
    explanation: |
      `camelCase` matches idiomatic JavaScript object property access (`user.firstName`)
      without bracket syntax, which is why it is the common default for JS-facing JSON.
      It is a convention, not a JSON/OpenAPI requirement.
    ref: "concepts.md#json-field-naming-conventions"

  - id: request-response-design-and-content-negotiation-008
    difficulty: intermediate
    tags: [naming, breaking-change, versioning]
    question: |
      Your API currently returns `created_at`. A new lead wants to switch every field to
      `camelCase` (`createdAt`). What is the correct characterization?
    options:
      - "It is a cosmetic change safe to ship anytime"
      - "It only affects the server and not clients"
      - "It is a breaking change to the contract and requires versioning"
      - "It is required for OpenAPI 3.1 compatibility"
    answer: 2
    explanation: |
      The case convention is part of the public contract. Renaming `created_at` to
      `createdAt` breaks every existing client that reads the field, so it is a breaking
      change that must go through versioning, not a silent cosmetic tweak.
    ref: "concepts.md#json-field-naming-conventions"

  - id: request-response-design-and-content-negotiation-009
    difficulty: intermediate
    tags: [naming, acronyms]
    question: |
      Which practice best avoids ambiguity with acronyms in field names?
    options:
      - "Randomly choose userID or userId per field for variety"
      - "Always uppercase acronyms fully regardless of position"
      - "Avoid any field that contains an acronym"
      - "Pick one rule (e.g. treat acronyms as words: userId, htmlUrl) and apply it uniformly"
    answer: 3
    explanation: |
      Acronyms need a documented rule applied consistently — e.g. treating them as words
      so you always write `userId` and `htmlUrl`. Mixing `userID` and `htmlURL`
      inconsistently confuses clients and code generators.
    ref: "concepts.md#json-field-naming-conventions"

  - id: request-response-design-and-content-negotiation-010
    difficulty: beginner
    tags: [naming, ecosystems]
    question: |
      Several large public APIs (e.g. Stripe, GitHub) use which JSON field convention?
    options:
      - "PascalCase"
      - "SCREAMING_SNAKE_CASE"
      - "kebab-case"
      - "snake_case"
    answer: 3
    explanation: |
      snake_case is common in APIs whose implementation or audience is Python/Ruby-centric
      and is used by several large public APIs such as Stripe and GitHub. Both camelCase
      and snake_case are valid; consistency is what matters.
    ref: "concepts.md#json-field-naming-conventions"

  - id: request-response-design-and-content-negotiation-011
    difficulty: intermediate
    tags: [nulls, omission, merge-patch]
    question: |
      Using JSON Merge Patch (RFC 7396), a client sends
      `PATCH /users/42 {"nickname": null}`. What does this mean?
    options:
      - "Leave nickname unchanged"
      - "Reject the request as invalid"
      - "Delete/clear the nickname field"
      - "Set nickname to the literal string 'null'"
    answer: 2
    explanation: |
      In JSON Merge Patch, `null` for a member means remove/clear that field. Omitting the
      key would leave it unchanged. This overloading of `null` as "delete" is why null and
      absence are not interchangeable on the write path.
    ref: "concepts.md#nulls-versus-omission"

  - id: request-response-design-and-content-negotiation-012
    difficulty: intermediate
    tags: [nulls, merge-patch]
    question: |
      With JSON Merge Patch, how does a client indicate "leave this field unchanged"?
    options:
      - "Send the field with value null"
      - "Send the field with an empty string"
      - "Send the field with value false"
      - "Omit the field key entirely from the patch document"
    answer: 3
    explanation: |
      In JSON Merge Patch, omitting a key means "don't touch it," while `null` means
      "delete it." So an empty patch `{}` changes nothing, and clearing a value requires an
      explicit `null`.
    ref: "concepts.md#nulls-versus-omission"

  - id: request-response-design-and-content-negotiation-013
    difficulty: beginner
    tags: [nulls, omission, semantics]
    question: |
      On the read path, what distinction do teams commonly assign to `null` versus omitting
      a field in a JSON response?
    options:
      - "null and omission are always identical and interchangeable"
      - "null = error; omission = success"
      - "null = explicitly empty/unset; omission = no information about the field"
      - "null is only valid inside arrays"
    answer: 2
    explanation: |
      A common documented convention: `null` means the field exists but is explicitly
      empty/unset, while omission means no information is provided about it. The key is to
      pick one and document it so clients know what to expect.
    ref: "concepts.md#nulls-versus-omission"

  - id: request-response-design-and-content-negotiation-014
    difficulty: intermediate
    tags: [nulls, arrays, collections]
    question: |
      For a collection field with no elements, which representation is generally
      recommended for client ergonomics?
    options:
      - "null"
      - "Omit the field entirely"
      - "A consistent empty array []"
      - "The string 'empty'"
    answer: 2
    explanation: |
      Consistently returning `[]` for "no elements" lets clients iterate without null
      checks. Using `null` or omitting the field forces defensive code and inconsistent
      handling across records.
    ref: "concepts.md#nulls-versus-omission"

  - id: request-response-design-and-content-negotiation-015
    difficulty: intermediate
    tags: [nulls, json-schema]
    question: |
      In JSON Schema terms, "required" and "nullable" describe which relationship?
    options:
      - "They are synonyms"
      - "nullable implies required"
      - "They are independent axes: presence of the key vs whether its value may be null"
      - "required implies the value must be null"
    answer: 2
    explanation: |
      `required` controls whether the property must be present; `nullable` controls whether
      its value may be `null`. They are orthogonal — a field can be required yet nullable,
      or optional and non-nullable.
    ref: "concepts.md#nulls-versus-omission"

  - id: request-response-design-and-content-negotiation-016
    difficulty: beginner
    tags: [content-type, accept, headers]
    question: |
      What is the difference between the `Content-Type` and `Accept` request headers?
    options:
      - "Content-Type describes the body being sent; Accept states what the client will receive"
      - "Accept describes the body being sent; Content-Type states what the client will receive"
      - "They are aliases for the same thing"
      - "Content-Type is only used on responses, Accept only on requests to caches"
    answer: 0
    explanation: |
      `Content-Type` describes the media type of the body actually present in the message
      being sent (by client or server). `Accept` is sent by the client to indicate which
      media types it is willing to receive back.
    ref: "concepts.md#media-types-and-the-content-type-and-accept-headers"

  - id: request-response-design-and-content-negotiation-017
    difficulty: intermediate
    tags: [status-codes, 415, content-type]
    question: |
      A client POSTs a body with `Content-Type: application/xml` but the server only accepts
      JSON. Which status code is correct?
    options:
      - "406 Not Acceptable"
      - "400 Bad Request"
      - "415 Unsupported Media Type"
      - "409 Conflict"
    answer: 2
    explanation: |
      When the server cannot process the media type of the request body it returns
      `415 Unsupported Media Type`. `406` is the opposite case — when the server cannot
      produce anything the client's `Accept` header allows.
    ref: "concepts.md#media-types-and-the-content-type-and-accept-headers"

  - id: request-response-design-and-content-negotiation-018
    difficulty: intermediate
    tags: [status-codes, 406, accept]
    question: |
      A request sends `Accept: application/xml` but the server can only produce JSON.
      Strictly per RFC 9110, which status code communicates this?
    options:
      - "406 Not Acceptable"
      - "415 Unsupported Media Type"
      - "204 No Content"
      - "417 Expectation Failed"
    answer: 0
    explanation: |
      `406 Not Acceptable` indicates the server cannot produce a representation matching the
      client's proactive negotiation headers (here `Accept`). (RFC 9110 also permits serving
      a default representation instead, but 406 is the strict answer.)
    ref: "concepts.md#media-types-and-the-content-type-and-accept-headers"

  - id: request-response-design-and-content-negotiation-019
    difficulty: advanced
    tags: [accept, quality, q-values]
    question: |
      Given `Accept: text/html, application/json;q=0.9, */*;q=0.1`, which representation
      does the client most prefer, and what does `*/*;q=0.1` mean?
    options:
      - "JSON most preferred; */* means reject everything else"
      - "*/* most preferred because it matches everything"
      - "All three are equally preferred since q-values are ignored"
      - "HTML most preferred (implicit q=1); */* is a low-priority catch-all for anything else"
    answer: 3
    explanation: |
      `text/html` has an implicit q=1, so it is most preferred, then JSON at q=0.9, and
      `*/*;q=0.1` is a low-priority fallback matching any other type. More specific media
      ranges outrank wildcards.
    ref: "concepts.md#media-types-and-the-content-type-and-accept-headers"

  - id: request-response-design-and-content-negotiation-020
    difficulty: intermediate
    tags: [content-type, get, headers]
    question: |
      Why is a `Content-Type` header on a plain `GET` request essentially meaningless?
    options:
      - "GET requests are always cached and ignore headers"
      - "RFC 9110 forbids any headers on GET"
      - "A GET has no request body, so there is no payload for Content-Type to describe"
      - "Content-Type only applies to error responses"
    answer: 2
    explanation: |
      `Content-Type` describes the body actually present. A typical GET carries no request
      body, so there is nothing for it to describe. Clients should not rely on it for GETs;
      use `Accept` to state what they want back.
    ref: "concepts.md#media-types-and-the-content-type-and-accept-headers"

  - id: request-response-design-and-content-negotiation-021
    difficulty: intermediate
    tags: [negotiation, server-driven, proactive]
    question: |
      What characterizes proactive (server-driven) content negotiation in RFC 9110?
    options:
      - "The server returns 300 Multiple Choices and the client picks a URI"
      - "The format is always encoded in the URL path"
      - "The client and server exchange representations in a TLS handshake"
      - "The client sends Accept-style preference headers and the server selects the representation"
    answer: 3
    explanation: |
      In proactive/server-driven negotiation, the client expresses preferences via headers
      (Accept, Accept-Language, Accept-Encoding) and the server chooses the best
      representation and returns it directly, usually with 200.
    ref: "concepts.md#server-driven-versus-agent-driven-content-negotiation"

  - id: request-response-design-and-content-negotiation-022
    difficulty: advanced
    tags: [negotiation, reactive, agent-driven, 300]
    question: |
      Reactive (agent-driven) negotiation historically uses which status code, and why is it
      rare in practice?
    options:
      - "200 OK; because it is the default"
      - "406 Not Acceptable; because clients cannot parse it"
      - "301 Moved Permanently; because URIs change"
      - "300 Multiple Choices; extra round-trip and no widely adopted standard choice-list format"
    answer: 3
    explanation: |
      Reactive negotiation returns 300 Multiple Choices with a list of available
      representations for the agent to choose from. It is rare because it costs an extra
      round-trip and lacks a widely adopted standard format for the choice list.
    ref: "concepts.md#server-driven-versus-agent-driven-content-negotiation"

  - id: request-response-design-and-content-negotiation-023
    difficulty: intermediate
    tags: [negotiation, vary, caching]
    question: |
      Under server-driven negotiation, why must a response that depends on
      `Accept-Language` include `Vary: Accept-Language`?
    options:
      - "To compress the response"
      - "To authenticate the client"
      - "Because RFC 9110 forbids localized responses without it returning 406"
      - "So a shared cache does not serve a French response to a client that asked for English"
    answer: 3
    explanation: |
      `Vary` tells shared caches which request headers the response was negotiated on. Without
      `Vary: Accept-Language`, a cache could store a French response and hand it to an
      English-requesting client. `Vary` is the linchpin of correct negotiated caching.
    ref: "concepts.md#server-driven-versus-agent-driven-content-negotiation"

  - id: request-response-design-and-content-negotiation-024
    difficulty: intermediate
    tags: [negotiation, uri, format]
    question: |
      Putting the format in the URL (`/articles/42.json` vs `/articles/42.xml`) is a
      practical hybrid form of negotiation. What is its main downside?
    options:
      - "It cannot be cached"
      - "It creates multiple URIs for one resource, muddying the canonical-URI ideal"
      - "It requires the 300 status code"
      - "Browsers cannot request it"
    answer: 1
    explanation: |
      URI-driven negotiation is cache-friendly and easy to debug, but it gives one resource
      multiple URIs (.json vs .xml), which conflicts with the ideal of a single canonical
      URI per resource.
    ref: "concepts.md#server-driven-versus-agent-driven-content-negotiation"

  - id: request-response-design-and-content-negotiation-025
    difficulty: advanced
    tags: [negotiation, user-agent, device]
    question: |
      Why is server-driven negotiation a poor fit for returning device-specific responses?
    options:
      - "Devices cannot send Accept headers"
      - "User-Agent sniffing is brittle; a BFF or explicit params handles device variance better"
      - "RFC 9110 forbids negotiating on device type"
      - "Mobile devices always require XML"
    answer: 1
    explanation: |
      Device-specific responses via `User-Agent` sniffing are brittle and hard to maintain.
      A Backend-for-Frontend or explicit parameters is a better mechanism than trying to
      negotiate device shape through standard preference headers.
    ref: "concepts.md#server-driven-versus-agent-driven-content-negotiation"

  - id: request-response-design-and-content-negotiation-026
    difficulty: beginner
    tags: [accept-encoding, compression]
    question: |
      What does the `Accept-Encoding` request header negotiate?
    options:
      - "The content coding / compression (e.g. gzip, br, zstd)"
      - "The character set of the response"
      - "The natural language of the response"
      - "The JSON field naming convention"
    answer: 0
    explanation: |
      `Accept-Encoding` negotiates the content coding — i.e. compression such as gzip,
      Brotli (br), or zstd. It is a common trap to confuse it with character encoding; it has
      nothing to do with charset.
    ref: "concepts.md#accept-language-accept-charset-and-accept-encoding"

  - id: request-response-design-and-content-negotiation-027
    difficulty: intermediate
    tags: [accept-language, content-language, bcp47]
    question: |
      A client sends `Accept-Language: fr-CA, fr;q=0.9, en;q=0.5`. Which response header
      tells the client which language the server actually returned?
    options:
      - "Content-Encoding"
      - "Language-Selected"
      - "Content-Language"
      - "Vary"
    answer: 2
    explanation: |
      The server echoes the chosen language in `Content-Language` (values are BCP 47 tags)
      and should also send `Vary: Accept-Language` for cacheable responses. `Vary` is about
      caching, not reporting the chosen language.
    ref: "concepts.md#accept-language-accept-charset-and-accept-encoding"

  - id: request-response-design-and-content-negotiation-028
    difficulty: intermediate
    tags: [accept-charset, deprecated, utf-8]
    question: |
      What is the current status of the `Accept-Charset` request header per RFC 9110?
    options:
      - "It is mandatory for all JSON APIs"
      - "It is deprecated; servers should ignore it and UTF-8 is the universal default"
      - "It replaces Accept-Encoding"
      - "It must be set to ISO-8859-1 by default"
    answer: 1
    explanation: |
      RFC 9110 deprecates `Accept-Charset`; servers should ignore it. UTF-8 is the universal
      default, and for JSON, UTF-8 is required by RFC 8259. Seeing `Accept-Charset` in a new
      API design is a red flag.
    ref: "concepts.md#accept-language-accept-charset-and-accept-encoding"

  - id: request-response-design-and-content-negotiation-029
    difficulty: advanced
    tags: [content-encoding, transfer-encoding]
    question: |
      How do `Content-Encoding` and `Transfer-Encoding` differ?
    options:
      - "They are synonyms"
      - "Content-Encoding is an end-to-end transformation of the payload; Transfer-Encoding (e.g. chunked) is hop-by-hop"
      - "Content-Encoding is hop-by-hop; Transfer-Encoding is end-to-end"
      - "Both only apply to request bodies"
    answer: 1
    explanation: |
      `Content-Encoding` (e.g. gzip, br) is an end-to-end transformation of the representation
      that the recipient must reverse. `Transfer-Encoding` (e.g. chunked) is a hop-by-hop
      property of message transfer. They are distinct concepts.
    ref: "concepts.md#accept-language-accept-charset-and-accept-encoding"

  - id: request-response-design-and-content-negotiation-030
    difficulty: beginner
    tags: [accept-language, negotiation]
    question: |
      What does `Accept-Language: fr-CA` from a client actually request?
    options:
      - "Translation of all arbitrary user-generated data into French"
      - "Localization of server-controlled text (labels, messages) into Canadian French where available"
      - "The response encoded in the French character set"
      - "Compression optimized for French text"
    answer: 1
    explanation: |
      `Accept-Language` negotiates the natural language of server-controlled text such as
      labels and error messages. It does not mean the server will translate arbitrary
      user-generated content, and it is unrelated to charset or compression.
    ref: "concepts.md#accept-language-accept-charset-and-accept-encoding"

  - id: request-response-design-and-content-negotiation-031
    difficulty: intermediate
    tags: [vendor-media-types, suffix, json]
    question: |
      In the media type `application/vnd.example.order.v2+json`, what is the purpose of the
      `+json` suffix?
    options:
      - "It marks the type as invalid"
      - "It indicates the response is compressed"
      - "It signals the API version is 2 and nothing else"
      - "It tells generic tooling to parse the payload as JSON despite the custom type"
    answer: 3
    explanation: |
      The structured-syntax suffix `+json` (RFC 6839) tells generic tooling that, whatever
      the custom media type means, its underlying syntax is JSON and can be parsed as such.
    ref: "concepts.md#vendor-media-types"

  - id: request-response-design-and-content-negotiation-032
    difficulty: intermediate
    tags: [vendor-media-types, versioning]
    question: |
      A client sends `Accept: application/vnd.example.order.v2+json`. Which API technique is
      this demonstrating?
    options:
      - "URL path versioning"
      - "Media-type (content-negotiation) versioning"
      - "Query-parameter versioning"
      - "Semantic versioning of the server binary"
    answer: 1
    explanation: |
      Encoding the version in a vendor media type and negotiating it through `Accept` is
      media-type versioning. It keeps the URL stable but is harder to exercise from a browser
      address bar than URL-based versioning.
    ref: "concepts.md#vendor-media-types"

  - id: request-response-design-and-content-negotiation-033
    difficulty: advanced
    tags: [vendor-media-types, registration-trees, rfc6838]
    question: |
      Per RFC 6838, which registration tree is intended for a specific vendor's or product's
      media types?
    options:
      - "The prs. (personal) tree"
      - "The x. (unregistered) tree"
      - "The vnd. (vendor) tree"
      - "The standards tree (no prefix)"
    answer: 2
    explanation: |
      The `vnd.` vendor tree is for media types associated with a specific product or
      organization — the common choice for APIs. `prs.` is personal/vanity, `x.` is
      unregistered/experimental, and unprefixed standards-tree names require IANA registration.
    ref: "concepts.md#vendor-media-types"

  - id: request-response-design-and-content-negotiation-034
    difficulty: intermediate
    tags: [vendor-media-types, trade-offs, versioning]
    question: |
      Which is a real downside of media-type versioning compared to URL-based versioning?
    options:
      - "It changes the resource's URI on every version"
      - "It is harder to test casually in a browser address bar or a quick curl"
      - "It violates RFC 9110"
      - "It cannot express a version number"
    answer: 1
    explanation: |
      Media-type versioning keeps URIs stable and is considered more RESTful, but you cannot
      set `Accept` from a browser address bar and it is less discoverable, so many public APIs
      choose URL versioning for convenience.
    ref: "concepts.md#vendor-media-types"

  - id: request-response-design-and-content-negotiation-035
    difficulty: intermediate
    tags: [vendor-media-types, problem-details, standard-types]
    question: |
      Which media type does RFC 9457 define for machine-readable API error responses?
    options:
      - "application/error+json"
      - "application/hal+json"
      - "application/problem+json"
      - "application/vnd.api+json"
    answer: 2
    explanation: |
      RFC 9457 (Problem Details for HTTP APIs, which obsoletes RFC 7807) defines
      `application/problem+json`. `hal+json` is HAL hypermedia and `vnd.api+json` is JSON:API.
    ref: "concepts.md#vendor-media-types"

  - id: request-response-design-and-content-negotiation-036
    difficulty: beginner
    tags: [sparse-fieldsets, partial-response, over-fetching]
    question: |
      What problem do sparse fieldsets / partial responses (e.g. `?fields=id,name`) primarily
      address?
    options:
      - "Authentication of the client"
      - "Rate limiting"
      - "Over-fetching — returning more fields than the client needs"
      - "Choosing the response language"
    answer: 2
    explanation: |
      Field selection lets a client request only the properties it needs, reducing payload
      size and over-fetching — a common REST answer to the over-fetching problem GraphQL is
      often cited for.
    ref: "concepts.md#partial-responses-and-sparse-fieldsets"

  - id: request-response-design-and-content-negotiation-037
    difficulty: intermediate
    tags: [sparse-fieldsets, filtering, projection]
    question: |
      How does a `fields` parameter differ from a filter like `?status=active`?
    options:
      - "They are identical"
      - "fields filters resources; status selects properties"
      - "Both only affect pagination"
      - "fields selects which properties to include (projection); status filters which resources are returned"
    answer: 3
    explanation: |
      `fields` is projection — which properties of each resource to include. A filter such as
      `?status=active` selects which resources/rows are returned. Conflating projection with
      filtering is a common mistake.
    ref: "concepts.md#partial-responses-and-sparse-fieldsets"

  - id: request-response-design-and-content-negotiation-038
    difficulty: intermediate
    tags: [expansion, embedding, round-trips]
    question: |
      Stripe's `expand[]` and JSON:API's `include` are examples of which lever, and what does
      it do relative to sparse fieldsets?
    options:
      - "Filtering; it removes resources"
      - "Expansion/embedding; it pulls related resources into the response to cut round-trips (the inverse of shrinking)"
      - "Pagination; it splits the response into pages"
      - "Compression; it reduces payload size"
    answer: 1
    explanation: |
      Expansion (expand/include) pulls related resources inline to reduce round-trips — the
      inverse of sparse fieldsets, which shrink the payload. Sparse fieldsets project down;
      expansion grows the response.
    ref: "concepts.md#partial-responses-and-sparse-fieldsets"

  - id: request-response-design-and-content-negotiation-039
    difficulty: advanced
    tags: [sparse-fieldsets, security, authorization]
    question: |
      When implementing a `fields` parameter, which security concern must you still enforce?
    options:
      - "Field-level authorization — a client must not obtain fields it isn't allowed to see just by requesting them"
      - "The client can now bypass rate limits"
      - "The response must always be compressed"
      - "The Accept header can be ignored"
    answer: 0
    explanation: |
      A `fields` parameter must not become a way to request data the caller isn't authorized
      for. The server still enforces per-field authorization; otherwise it's a Broken Object
      Property Level Authorization issue (OWASP API3:2023).
    ref: "concepts.md#partial-responses-and-sparse-fieldsets"

  - id: request-response-design-and-content-negotiation-040
    difficulty: advanced
    tags: [sparse-fieldsets, caching, etag]
    question: |
      Two requests to the same resource differ only by their `fields=` parameter. What is the
      correct way to think about caching and ETags here?
    options:
      - "They are the same representation and must share one cache entry and ETag"
      - "They are different representations of the resource; cache keys should include the query string and an ETag should reflect the partial content"
      - "Partial responses can never be cached"
      - "ETags are irrelevant to GET requests"
    answer: 1
    explanation: |
      Different `fields=` selections yield different representations of the same resource.
      Caches typically key on the full URL (query string included), and a partial
      representation's ETag should reflect its partial content to avoid conditional-request
      confusion.
    ref: "concepts.md#partial-responses-and-sparse-fieldsets"

  - id: request-response-design-and-content-negotiation-041
    difficulty: beginner
    tags: [envelope, bare-body]
    question: |
      What is a "bare body" response?
    options:
      - "A response wrapped in a data/meta/errors envelope"
      - "A response whose JSON body is the resource itself, with no wrapper object"
      - "A response with no Content-Type header"
      - "An empty 204 response"
    answer: 1
    explanation: |
      A bare body returns the resource directly (e.g. `{"id":42,"name":"Ada"}`) rather than
      nesting it under a `data` key with `meta`/`errors`. Metadata is instead carried via HTTP
      status and headers.
    ref: "concepts.md#envelope-versus-bare-body"

  - id: request-response-design-and-content-negotiation-042
    difficulty: intermediate
    tags: [envelope, anti-pattern, status]
    question: |
      Why is returning HTTP `200 OK` with a body like `{"status": 500, "error": "..."}`
      considered an anti-pattern?
    options:
      - "It uses too much bandwidth"
      - "It masks the real outcome from caches, monitoring, and generic clients that rely on the HTTP status code"
      - "JSON cannot contain a status field"
      - "It requires an envelope by RFC 9110"
    answer: 1
    explanation: |
      Putting the real status inside a 200 body shadows the actual HTTP status. Caches,
      monitoring, retries, and generic clients key off the status line, so a 200-with-error
      breaks all of them. Use the real status code.
    ref: "concepts.md#envelope-versus-bare-body"

  - id: request-response-design-and-content-negotiation-043
    difficulty: intermediate
    tags: [envelope, collections, pagination]
    question: |
      In which case does an envelope most clearly earn its keep?
    options:
      - "Single-resource GET responses"
      - "204 No Content responses"
      - "Collection/list responses, where next/prev/total need a home alongside the items"
      - "Responses that only set headers"
    answer: 2
    explanation: |
      Collections almost always need a wrapper so pagination metadata (next, prev, total) has
      a place to live: `{"data":[...],"links":{...},"meta":{...}}`. Single resources are often
      fine bare, using headers for metadata.
    ref: "concepts.md#envelope-versus-bare-body"

  - id: request-response-design-and-content-negotiation-044
    difficulty: intermediate
    tags: [envelope, http-headers, metadata]
    question: |
      A team wants to return metadata (resource location, entity version, request id) with a
      created resource. What is the most HTTP-idiomatic approach before reaching for an envelope?
    options:
      - "Wrap everything in a data/meta envelope and return 200"
      - "Use HTTP mechanisms: Location for URI, ETag for version, X-Request-Id header, and the 201 status"
      - "Encode the metadata as a query string in the response"
      - "Return the metadata in a separate follow-up request only"
    answer: 1
    explanation: |
      HTTP already provides mechanisms: `Location` for the new resource URI, `ETag` for the
      version, `X-Request-Id` for correlation, and the status code for outcome. Reach for
      these before inventing a body envelope that re-implements HTTP.
    ref: "concepts.md#envelope-versus-bare-body"

  - id: request-response-design-and-content-negotiation-045
    difficulty: beginner
    tags: [iso8601, dates, formatting]
    question: |
      Which timestamp format is recommended for JSON API fields to avoid ambiguity?
    options:
      - "07/19/2026 as a locale-dependent string"
      - "A human sentence like 'July 19th, 2026 at 2:32 pm'"
      - "ISO 8601 / RFC 3339 with an explicit offset or Z, e.g. 2026-07-19T14:32:05Z"
      - "The IMF-fixdate format used in HTTP headers"
    answer: 2
    explanation: |
      Use ISO 8601 / RFC 3339 strings with `Z` or an explicit offset. They are unambiguous,
      sort chronologically as text, and pin down the timezone. IMF-fixdate is for HTTP header
      fields (Date, Last-Modified), not JSON body values.
    ref: "concepts.md#date-and-number-formatting-with-iso-8601"

  - id: request-response-design-and-content-negotiation-046
    difficulty: advanced
    tags: [numbers, precision, ids]
    question: |
      Why should a 64-bit integer ID be serialized as a JSON string rather than a JSON number?
    options:
      - "Strings are always shorter than numbers"
      - "JSON does not allow integers"
      - "Most parsers treat JSON numbers as IEEE-754 doubles, losing precision above 2^53-1, corrupting large IDs in JS clients"
      - "Numbers cannot be used as object keys"
    answer: 2
    explanation: |
      JSON numbers are typically parsed as IEEE-754 doubles, so integers above 2^53-1
      (Number.MAX_SAFE_INTEGER) lose precision — a 64-bit ID gets silently corrupted in
      JavaScript. Serialize large integer IDs as strings.
    ref: "concepts.md#date-and-number-formatting-with-iso-8601"

  - id: request-response-design-and-content-negotiation-047
    difficulty: intermediate
    tags: [money, numbers, formatting]
    question: |
      What is the recommended way to represent a monetary amount in a JSON payload?
    options:
      - "As an IEEE-754 float like 19.99"
      - "As a localized string like '$19.99'"
      - "As epoch milliseconds"
      - "As integer minor units (amountCents: 1999) or a decimal string ('19.99') plus a currency code"
    answer: 3
    explanation: |
      Floats introduce rounding errors (0.1 + 0.2 != 0.3). Represent money as integer minor
      units (e.g. cents) or a decimal string, always with an explicit ISO 4217 currency code.
      Never as a JSON float.
    ref: "concepts.md#date-and-number-formatting-with-iso-8601"

  - id: request-response-design-and-content-negotiation-048
    difficulty: advanced
    tags: [http-headers, date-format, iso8601]
    question: |
      The HTTP `Last-Modified` response header uses which date format, and is it the same as
      JSON body timestamps?
    options:
      - "ISO 8601, identical to JSON body fields"
      - "IMF-fixdate (e.g. 'Sun, 19 Jul 2026 14:32:05 GMT'), which differs from the ISO 8601 you use in JSON bodies"
      - "Epoch seconds, same as recommended for JSON"
      - "A locale-dependent format chosen by Accept-Language"
    answer: 1
    explanation: |
      HTTP date header fields (Date, Last-Modified, Expires) use IMF-fixdate per RFC 9110 —
      e.g. `Sun, 19 Jul 2026 14:32:05 GMT`. That is distinct from the ISO 8601/RFC 3339 format
      recommended for JSON body timestamps; don't confuse the two.
    ref: "concepts.md#date-and-number-formatting-with-iso-8601"

  - id: request-response-design-and-content-negotiation-049
    difficulty: intermediate
    tags: [numbers, units, formatting]
    question: |
      A field is defined as `"amount": 1999`. What design guidance does this violate?
    options:
      - "Numbers must always be strings"
      - "Units must be explicit; a bare 'amount' is ambiguous (dollars? cents? something else)"
      - "Integers are not allowed in JSON"
      - "The field name must be camelCase"
    answer: 1
    explanation: |
      Without units the value is ambiguous. Name fields to encode units (amountCents,
      durationMs, distanceMeters) or pair them with a unit/currency field so clients can't
      misinterpret the magnitude.
    ref: "concepts.md#date-and-number-formatting-with-iso-8601"

  - id: request-response-design-and-content-negotiation-050
    difficulty: intermediate
    tags: [json, utf-8, charset, rfc8259]
    question: |
      Regarding `application/json` and character encoding, which statement is correct?
    options:
      - "JSON must be sent as ISO-8859-1 unless overridden"
      - "The application/json media type has no charset parameter and JSON is required to be UTF-8 (RFC 8259), so charset=utf-8 is redundant"
      - "You must always send Accept-Charset with JSON requests"
      - "JSON encoding is negotiated via Content-Encoding"
    answer: 1
    explanation: |
      RFC 8259 requires JSON exchanged between systems to be UTF-8, and the `application/json`
      media type does not define a `charset` parameter, so appending `charset=utf-8` is at best
      redundant. Accept-Charset is deprecated, and encoding negotiation (Content-Encoding) is
      about compression, not charset.
    ref: "concepts.md#media-types-and-the-content-type-and-accept-headers"
