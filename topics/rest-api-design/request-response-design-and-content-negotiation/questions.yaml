topic: "Request/Response Design & Content Negotiation"
domain: rest-api-design
topic_slug: request-response-design-and-content-negotiation
version: 1
questions:
  - id: request-response-design-and-content-negotiation-001
    difficulty: beginner
    tags: [dto, payload-shaping, security]
    question: |
      Why is serializing your database entity directly to the JSON response
      generally discouraged in API design?
    options:
      - "It always makes the response payload larger than a hand-written DTO would"
      - "It can leak sensitive fields and couples the wire contract to schema changes"
      - "JSON is structurally unable to represent relational database rows"
      - "It stops the server from ever returning a 201 Created status code"
    answer: 1
    explanation: |
      Returning the entity risks exposing fields the client shouldn't see (OWASP
      API3:2023 Broken Object Property Level Authorization) and ties your public
      contract to every schema migration. A deliberately designed DTO decouples the
      wire shape from the persistence model.
    ref: "concepts.md#dto-and-payload-shaping"

  - id: request-response-design-and-content-negotiation-002
    difficulty: intermediate
    tags: [dto, mass-assignment, security]
    question: |
      A client sends this to create a user:
      `POST /users {"name":"Ada","email":"a@x.com","role":"ADMIN","id":999}`.
      The server blind-binds the request body to its domain object. What is the flaw?
    options:
      - "The email field should be schema-validated as a properly formatted string"
      - "A 200 OK status should be returned for this creation instead of 201"
      - "Mass assignment: the client can set server-controlled fields like role and id"
      - "The name field is too short to satisfy the minimum-length rule"
    answer: 2
    explanation: |
      Blind-binding lets a client set fields they shouldn't control (`role`, `id`).
      Bind writes to an explicit input DTO with an allowlist of settable fields;
      server-controlled fields (id, role, timestamps) must be read-only on input.
      This is the mass-assignment half of OWASP API3:2023.
    ref: "concepts.md#dto-and-payload-shaping"

  - id: request-response-design-and-content-negotiation-003
    difficulty: intermediate
    tags: [dto, enums, formatting]
    question: |
      For a resource's `status` field, why prefer sending `"status": "PENDING"`
      over `"status": 0`?
    options:
      - "Ordinal integers break if the enum order changes; string names are stable and self-describing"
      - "Enum name strings are always smaller on the wire than their ordinal integers"
      - "JSON has no way to represent bare integer values without quoting them"
      - "Integer status codes cannot be indexed or filtered on by API clients"
    answer: 0
    explanation: |
      Sending the enum ordinal couples the contract to the declaration order — reorder
      the enum and every stored/transmitted value silently means something else. String
      names are stable and self-documenting.
    ref: "concepts.md#dto-and-payload-shaping"

  - id: request-response-design-and-content-negotiation-004
    difficulty: intermediate
    tags: [dto, embedding, linking]
    question: |
      When designing `GET /orders/{id}`, what is the main trade-off between embedding
      the full `customer` object versus returning just `customerId` or a link?
    options:
      - "Embedding the full object is always more RESTful and should always be preferred"
      - "Returning a link instead of the object is explicitly disallowed by RFC 9110"
      - "Embedding reduces round-trips but couples and bloats; linking is leaner but chattier"
      - "There is no meaningful difference once the response body has been gzip-compressed"
    answer: 2
    explanation: |
      Embedding saves the client a follow-up request but increases coupling and payload
      size; linking keeps the response lean but forces extra round-trips. Choose per
      access pattern, ideally making expansion opt-in via a parameter.
    ref: "concepts.md#dto-and-payload-shaping"

  - id: request-response-design-and-content-negotiation-005
    difficulty: beginner
    tags: [dto, request-response, asymmetry]
    question: |
      Which statement about request and response DTOs is most accurate?
    options:
      - "They are often asymmetric — the create input differs from the returned representation"
      - "They must always share the exact same field shape for any given resource"
      - "Response DTOs should echo back the client's raw submitted input verbatim"
      - "Request DTOs should contain server-generated fields like id and createdAt"
    answer: 0
    explanation: |
      The input to create a resource (e.g. items, couponCode) is typically not the
      output (which adds id, status, totals, createdAt, a Location header). Request and
      response DTOs are commonly asymmetric.
    ref: "concepts.md#dto-and-payload-shaping"

  - id: request-response-design-and-content-negotiation-006
    difficulty: beginner
    tags: [naming, camelcase, snakecase]
    question: |
      Which is the single most important rule when choosing a JSON field naming
      convention for an API?
    options:
      - "Always use snake_case, because it is objectively the most readable convention"
      - "Always use camelCase, because the RFC 8259 JSON grammar formally requires it"
      - "Be consistent across the entire API; mixing conventions signals leaked internal models"
      - "Use PascalCase so that embedded acronyms always render in their correct casing"
    answer: 2
    explanation: |
      JSON mandates no case convention. Consistency across the whole API matters far more
      than which one you pick; mixing `first_name` and `lastName` in one payload usually
      means multiple internal models are leaking through.
    ref: "concepts.md#json-field-naming-conventions"

  - id: request-response-design-and-content-negotiation-007
    difficulty: beginner
    tags: [naming, camelcase]
    question: |
      Why is `camelCase` a common default for new JSON APIs consumed by web front-ends?
    options:
      - "It compresses noticeably better on the wire than the snake_case equivalent"
      - "It is the field-casing style formally mandated by the JSON specification"
      - "It is the only naming convention that OpenAPI schema generators can emit"
      - "It maps cleanly to JavaScript property access like user.firstName"
    answer: 3
    explanation: |
      `camelCase` matches idiomatic JavaScript object property access (`user.firstName`)
      without bracket syntax, which is why it is the common default for JS-facing JSON.
      It is a convention, not a JSON/OpenAPI requirement.
    ref: "concepts.md#json-field-naming-conventions"

  - id: request-response-design-and-content-negotiation-008
    difficulty: intermediate
    tags: [naming, breaking-change, versioning]
    question: |
      Your API currently returns `created_at`. A new lead wants to switch every field to
      `camelCase` (`createdAt`). What is the correct characterization?
    options:
      - "It is a purely cosmetic change that is safe to ship at any time without notice"
      - "It affects only the server-side code and is transparent to every client"
      - "It is a breaking change to the contract and requires versioning"
      - "It is a mandatory prerequisite for OpenAPI 3.1 document compatibility"
    answer: 2
    explanation: |
      The case convention is part of the public contract. Renaming `created_at` to
      `createdAt` breaks every existing client that reads the field, so it is a breaking
      change that must go through versioning, not a silent cosmetic tweak.
    ref: "concepts.md#json-field-naming-conventions"

  - id: request-response-design-and-content-negotiation-009
    difficulty: intermediate
    tags: [naming, acronyms]
    question: |
      Which practice best avoids ambiguity with acronyms in field names?
    options:
      - "Alternate between userID and userId across fields to keep the payload visually varied"
      - "Always uppercase every acronym in full regardless of where it sits in the name"
      - "Avoid ever introducing a field name that contains an acronym at all"
      - "Pick one rule (e.g. treat acronyms as words: userId, htmlUrl) and apply it uniformly"
    answer: 3
    explanation: |
      Acronyms need a documented rule applied consistently — e.g. treating them as words
      so you always write `userId` and `htmlUrl`. Mixing `userID` and `htmlURL`
      inconsistently confuses clients and code generators.
    ref: "concepts.md#json-field-naming-conventions"

  - id: request-response-design-and-content-negotiation-010
    difficulty: beginner
    tags: [naming, ecosystems]
    question: |
      Several large public APIs (e.g. Stripe, GitHub) use which JSON field convention?
    options:
      - "PascalCase"
      - "SCREAMING_SNAKE_CASE"
      - "kebab-case"
      - "snake_case"
    answer: 3
    explanation: |
      snake_case is common in APIs whose implementation or audience is Python/Ruby-centric
      and is used by several large public APIs such as Stripe and GitHub. Both camelCase
      and snake_case are valid; consistency is what matters.
    ref: "concepts.md#json-field-naming-conventions"

  - id: request-response-design-and-content-negotiation-011
    difficulty: intermediate
    tags: [nulls, omission, merge-patch]
    question: |
      Using JSON Merge Patch (RFC 7396), a client sends
      `PATCH /users/42 {"nickname": null}`. What does this mean?
    options:
      - "Leave nickname unchanged"
      - "Reject the request as invalid"
      - "Delete/clear the nickname field"
      - "Set nickname to the literal string 'null'"
    answer: 2
    explanation: |
      In JSON Merge Patch, `null` for a member means remove/clear that field. Omitting the
      key would leave it unchanged. This overloading of `null` as "delete" is why null and
      absence are not interchangeable on the write path.
    ref: "concepts.md#nulls-versus-omission"

  - id: request-response-design-and-content-negotiation-012
    difficulty: intermediate
    tags: [nulls, merge-patch]
    question: |
      With JSON Merge Patch, how does a client indicate "leave this field unchanged"?
    options:
      - "Send the field with an explicit value of null in the patch document"
      - "Send the field set to an empty string to signal no change is intended"
      - "Send the field with the boolean value false to preserve the current value"
      - "Omit the field key entirely from the patch document"
    answer: 3
    explanation: |
      In JSON Merge Patch, omitting a key means "don't touch it," while `null` means
      "delete it." So an empty patch `{}` changes nothing, and clearing a value requires an
      explicit `null`.
    ref: "concepts.md#nulls-versus-omission"

  - id: request-response-design-and-content-negotiation-013
    difficulty: beginner
    tags: [nulls, omission, semantics]
    question: |
      On the read path, what distinction do teams commonly assign to `null` versus omitting
      a field in a JSON response?
    options:
      - "null and omission are always completely identical and freely interchangeable"
      - "null signals an error condition while omission signals a successful lookup"
      - "null = explicitly empty/unset; omission = no information about the field"
      - "null is only ever valid when it appears as an element inside an array"
    answer: 2
    explanation: |
      A common documented convention: `null` means the field exists but is explicitly
      empty/unset, while omission means no information is provided about it. The key is to
      pick one and document it so clients know what to expect.
    ref: "concepts.md#nulls-versus-omission"

  - id: request-response-design-and-content-negotiation-014
    difficulty: intermediate
    tags: [nulls, arrays, collections]
    question: |
      For a collection field with no elements, which representation is generally
      recommended for client ergonomics?
    options:
      - "A null value in place of the collection field"
      - "Omit the collection field entirely from the response"
      - "A consistent empty array []"
      - "A literal placeholder string such as 'empty'"
    answer: 2
    explanation: |
      Consistently returning `[]` for "no elements" lets clients iterate without null
      checks. Using `null` or omitting the field forces defensive code and inconsistent
      handling across records.
    ref: "concepts.md#nulls-versus-omission"

  - id: request-response-design-and-content-negotiation-015
    difficulty: intermediate
    tags: [nulls, json-schema]
    question: |
      In JSON Schema terms, "required" and "nullable" describe which relationship?
    options:
      - "They are exact synonyms describing the same property constraint"
      - "Marking a property nullable automatically also makes it required"
      - "They are independent axes: presence of the key vs whether its value may be null"
      - "Marking a property required forces its value to always be null"
    answer: 2
    explanation: |
      `required` controls whether the property must be present; `nullable` controls whether
      its value may be `null`. They are orthogonal — a field can be required yet nullable,
      or optional and non-nullable.
    ref: "concepts.md#nulls-versus-omission"

  - id: request-response-design-and-content-negotiation-016
    difficulty: beginner
    tags: [content-type, accept, headers]
    question: |
      What is the difference between the `Content-Type` and `Accept` request headers?
    options:
      - "Content-Type describes the body being sent; Accept states what the client will receive"
      - "Accept describes the body being sent; Content-Type states what the client will receive"
      - "They are interchangeable aliases that carry exactly the same media-type value"
      - "Content-Type appears only on responses while Accept is sent only to intermediary caches"
    answer: 0
    explanation: |
      `Content-Type` describes the media type of the body actually present in the message
      being sent (by client or server). `Accept` is sent by the client to indicate which
      media types it is willing to receive back.
    ref: "concepts.md#media-types-and-the-content-type-and-accept-headers"

  - id: request-response-design-and-content-negotiation-017
    difficulty: intermediate
    tags: [status-codes, 415, content-type]
    question: |
      A client POSTs a body with `Content-Type: application/xml` but the server only accepts
      JSON. Which status code is correct?
    options:
      - "406 Not Acceptable"
      - "400 Bad Request"
      - "415 Unsupported Media Type"
      - "409 Conflict"
    answer: 2
    explanation: |
      When the server cannot process the media type of the request body it returns
      `415 Unsupported Media Type`. `406` is the opposite case — when the server cannot
      produce anything the client's `Accept` header allows.
    ref: "concepts.md#media-types-and-the-content-type-and-accept-headers"

  - id: request-response-design-and-content-negotiation-018
    difficulty: intermediate
    tags: [status-codes, 406, accept]
    question: |
      A request sends `Accept: application/xml` but the server can only produce JSON.
      Strictly per RFC 9110, which status code communicates this?
    options:
      - "406 Not Acceptable"
      - "415 Unsupported Media Type"
      - "204 No Content"
      - "417 Expectation Failed"
    answer: 0
    explanation: |
      `406 Not Acceptable` indicates the server cannot produce a representation matching the
      client's proactive negotiation headers (here `Accept`). (RFC 9110 also permits serving
      a default representation instead, but 406 is the strict answer.)
    ref: "concepts.md#media-types-and-the-content-type-and-accept-headers"

  - id: request-response-design-and-content-negotiation-019
    difficulty: advanced
    tags: [accept, quality, q-values]
    question: |
      Given `Accept: text/html, application/json;q=0.9, */*;q=0.1`, which representation
      does the client most prefer, and what does `*/*;q=0.1` mean?
    options:
      - "JSON most preferred at q=0.9, and */*;q=0.1 means the client refuses any other media type"
      - "*/* is most preferred because a wildcard range always outranks named types in q ordering"
      - "All three rank equally because Accept q-values only apply to Accept-Encoding, not media types"
      - "HTML most preferred (implicit q=1); */* is a low-priority catch-all for anything else"
    answer: 3
    explanation: |
      `text/html` has an implicit q=1, so it is most preferred, then JSON at q=0.9, and
      `*/*;q=0.1` is a low-priority fallback matching any other type. More specific media
      ranges outrank wildcards.
    ref: "concepts.md#media-types-and-the-content-type-and-accept-headers"

  - id: request-response-design-and-content-negotiation-020
    difficulty: intermediate
    tags: [content-type, get, headers]
    question: |
      Why is a `Content-Type` header on a plain `GET` request essentially meaningless?
    options:
      - "GET requests are always served from cache, so proxies strip every request header first"
      - "RFC 9110 explicitly forbids sending any header field other than Host on a GET request"
      - "A GET has no request body, so there is no payload for Content-Type to describe"
      - "Content-Type is only ever meaningful on 4xx and 5xx error responses, never on requests"
    answer: 2
    explanation: |
      `Content-Type` describes the body actually present. A typical GET carries no request
      body, so there is nothing for it to describe. Clients should not rely on it for GETs;
      use `Accept` to state what they want back.
    ref: "concepts.md#media-types-and-the-content-type-and-accept-headers"

  - id: request-response-design-and-content-negotiation-021
    difficulty: intermediate
    tags: [negotiation, server-driven, proactive]
    question: |
      What characterizes proactive (server-driven) content negotiation in RFC 9110?
    options:
      - "The server returns 300 Multiple Choices with a list of variants and the client picks a URI"
      - "The format is always encoded in the URL path segment, such as /data.json versus /data.xml"
      - "The client and server settle the representation during the TLS handshake before the request"
      - "The client sends Accept-style preference headers and the server selects the representation"
    answer: 3
    explanation: |
      In proactive/server-driven negotiation, the client expresses preferences via headers
      (Accept, Accept-Language, Accept-Encoding) and the server chooses the best
      representation and returns it directly, usually with 200.
    ref: "concepts.md#server-driven-versus-agent-driven-content-negotiation"

  - id: request-response-design-and-content-negotiation-022
    difficulty: advanced
    tags: [negotiation, reactive, agent-driven, 300]
    question: |
      Reactive (agent-driven) negotiation historically uses which status code, and why is it
      rare in practice?
    options:
      - "200 OK; because agent-driven negotiation reuses the default success status for its list"
      - "406 Not Acceptable; because agent-driven clients cannot parse the variant list returned"
      - "301 Moved Permanently; because each negotiated variant lives at a permanently relocated URI"
      - "300 Multiple Choices; extra round-trip and no widely adopted standard choice-list format"
    answer: 3
    explanation: |
      Reactive negotiation returns 300 Multiple Choices with a list of available
      representations for the agent to choose from. It is rare because it costs an extra
      round-trip and lacks a widely adopted standard format for the choice list.
    ref: "concepts.md#server-driven-versus-agent-driven-content-negotiation"

  - id: request-response-design-and-content-negotiation-023
    difficulty: intermediate
    tags: [negotiation, vary, caching]
    question: |
      Under server-driven negotiation, why must a response that depends on
      `Accept-Language` include `Vary: Accept-Language`?
    options:
      - "To signal which compression coding the shared cache should apply to the stored response"
      - "To let the shared cache authenticate the client before it releases the localized response"
      - "Because RFC 9110 forbids returning any localized response unless the server also emits a 406"
      - "So a shared cache does not serve a French response to a client that asked for English"
    answer: 3
    explanation: |
      `Vary` tells shared caches which request headers the response was negotiated on. Without
      `Vary: Accept-Language`, a cache could store a French response and hand it to an
      English-requesting client. `Vary` is the linchpin of correct negotiated caching.
    ref: "concepts.md#server-driven-versus-agent-driven-content-negotiation"

  - id: request-response-design-and-content-negotiation-024
    difficulty: intermediate
    tags: [negotiation, uri, format]
    question: |
      Putting the format in the URL (`/articles/42.json` vs `/articles/42.xml`) is a
      practical hybrid form of negotiation. What is its main downside?
    options:
      - "It defeats HTTP caching because extension-suffixed URLs are never stored by shared caches"
      - "It creates multiple URIs for one resource, muddying the canonical-URI ideal"
      - "It obligates the server to answer every such request with a 300 Multiple Choices status"
      - "Browsers cannot request extension-suffixed URLs directly from the address bar without a plugin"
    answer: 1
    explanation: |
      URI-driven negotiation is cache-friendly and easy to debug, but it gives one resource
      multiple URIs (.json vs .xml), which conflicts with the ideal of a single canonical
      URI per resource.
    ref: "concepts.md#server-driven-versus-agent-driven-content-negotiation"

  - id: request-response-design-and-content-negotiation-025
    difficulty: advanced
    tags: [negotiation, user-agent, device]
    question: |
      Why is server-driven negotiation a poor fit for returning device-specific responses?
    options:
      - "Mobile and desktop devices are physically unable to attach Accept headers to their requests"
      - "User-Agent sniffing is brittle; a BFF or explicit params handles device variance better"
      - "RFC 9110 explicitly forbids negotiating a representation on the basis of the device type"
      - "Mobile devices can only parse XML payloads, so JSON negotiation fails on every phone client"
    answer: 1
    explanation: |
      Device-specific responses via `User-Agent` sniffing are brittle and hard to maintain.
      A Backend-for-Frontend or explicit parameters is a better mechanism than trying to
      negotiate device shape through standard preference headers.
    ref: "concepts.md#server-driven-versus-agent-driven-content-negotiation"

  - id: request-response-design-and-content-negotiation-026
    difficulty: beginner
    tags: [accept-encoding, compression]
    question: |
      What does the `Accept-Encoding` request header negotiate?
    options:
      - "The content coding / compression (e.g. gzip, br, zstd)"
      - "The character set the response body must be encoded in, such as UTF-8 or ISO-8859-1"
      - "The natural language the response text should be localized into, such as en-US or fr-CA"
      - "The JSON field naming convention the server should apply, such as camelCase or snake_case"
    answer: 0
    explanation: |
      `Accept-Encoding` negotiates the content coding — i.e. compression such as gzip,
      Brotli (br), or zstd. It is a common trap to confuse it with character encoding; it has
      nothing to do with charset.
    ref: "concepts.md#accept-language-accept-charset-and-accept-encoding"

  - id: request-response-design-and-content-negotiation-027
    difficulty: intermediate
    tags: [accept-language, content-language, bcp47]
    question: |
      A client sends `Accept-Language: fr-CA, fr;q=0.9, en;q=0.5`. Which response header
      tells the client which language the server actually returned?
    options:
      - "Content-Encoding, which carries the BCP 47 tag of the language actually served"
      - "Language-Selected, the dedicated response header defined by RFC 9110 for this purpose"
      - "Content-Language"
      - "Vary, echoing the exact Accept-Language value the server matched against"
    answer: 2
    explanation: |
      The server echoes the chosen language in `Content-Language` (values are BCP 47 tags)
      and should also send `Vary: Accept-Language` for cacheable responses. `Vary` is about
      caching, not reporting the chosen language.
    ref: "concepts.md#accept-language-accept-charset-and-accept-encoding"

  - id: request-response-design-and-content-negotiation-028
    difficulty: intermediate
    tags: [accept-charset, deprecated, utf-8]
    question: |
      What is the current status of the `Accept-Charset` request header per RFC 9110?
    options:
      - "It is mandatory for every JSON API and requests without it must be rejected with a 400"
      - "It is deprecated; servers should ignore it and UTF-8 is the universal default"
      - "It supersedes Accept-Encoding and now negotiates gzip and Brotli compression as well"
      - "It must default to ISO-8859-1 whenever the client omits it from the request headers"
    answer: 1
    explanation: |
      RFC 9110 deprecates `Accept-Charset`; servers should ignore it. UTF-8 is the universal
      default, and for JSON, UTF-8 is required by RFC 8259. Seeing `Accept-Charset` in a new
      API design is a red flag.
    ref: "concepts.md#accept-language-accept-charset-and-accept-encoding"

  - id: request-response-design-and-content-negotiation-029
    difficulty: advanced
    tags: [content-encoding, transfer-encoding]
    question: |
      How do `Content-Encoding` and `Transfer-Encoding` differ?
    options:
      - "They are exact synonyms, interchangeable header names for the same gzip transformation"
      - "Content-Encoding is an end-to-end transformation of the payload; Transfer-Encoding (e.g. chunked) is hop-by-hop"
      - "Content-Encoding is a hop-by-hop framing property while Transfer-Encoding transforms the payload end-to-end"
      - "Both headers apply exclusively to request bodies and are stripped from every response"
    answer: 1
    explanation: |
      `Content-Encoding` (e.g. gzip, br) is an end-to-end transformation of the representation
      that the recipient must reverse. `Transfer-Encoding` (e.g. chunked) is a hop-by-hop
      property of message transfer. They are distinct concepts.
    ref: "concepts.md#accept-language-accept-charset-and-accept-encoding"

  - id: request-response-design-and-content-negotiation-030
    difficulty: beginner
    tags: [accept-language, negotiation]
    question: |
      What does `Accept-Language: fr-CA` from a client actually request?
    options:
      - "Machine translation of all arbitrary user-generated data in the resource into French"
      - "Localization of server-controlled text (labels, messages) into Canadian French where available"
      - "The response body re-encoded using a French-specific character set rather than UTF-8"
      - "A compression coding tuned for French-language text to shrink the payload further"
    answer: 1
    explanation: |
      `Accept-Language` negotiates the natural language of server-controlled text such as
      labels and error messages. It does not mean the server will translate arbitrary
      user-generated content, and it is unrelated to charset or compression.
    ref: "concepts.md#accept-language-accept-charset-and-accept-encoding"

  - id: request-response-design-and-content-negotiation-031
    difficulty: intermediate
    tags: [vendor-media-types, suffix, json]
    question: |
      In the media type `application/vnd.example.order.v2+json`, what is the purpose of the
      `+json` suffix?
    options:
      - "It marks the media type as invalid so strict parsers reject the payload outright"
      - "It indicates the response body has been gzip-compressed before transmission"
      - "It signals that the API version is 2 and carries no information about the syntax"
      - "It tells generic tooling to parse the payload as JSON despite the custom type"
    answer: 3
    explanation: |
      The structured-syntax suffix `+json` (RFC 6839) tells generic tooling that, whatever
      the custom media type means, its underlying syntax is JSON and can be parsed as such.
    ref: "concepts.md#vendor-media-types"

  - id: request-response-design-and-content-negotiation-032
    difficulty: intermediate
    tags: [vendor-media-types, versioning]
    question: |
      A client sends `Accept: application/vnd.example.order.v2+json`. Which API technique is
      this demonstrating?
    options:
      - "URL path versioning, where the version lives in a segment like /v2/orders"
      - "Media-type (content-negotiation) versioning"
      - "Query-parameter versioning, where the version rides in a string like ?version=2"
      - "Semantic versioning of the deployed server binary rather than of the API contract"
    answer: 1
    explanation: |
      Encoding the version in a vendor media type and negotiating it through `Accept` is
      media-type versioning. It keeps the URL stable but is harder to exercise from a browser
      address bar than URL-based versioning.
    ref: "concepts.md#vendor-media-types"

  - id: request-response-design-and-content-negotiation-033
    difficulty: advanced
    tags: [vendor-media-types, registration-trees, rfc6838]
    question: |
      Per RFC 6838, which registration tree is intended for a specific vendor's or product's
      media types?
    options:
      - "The prs. (personal) tree, intended for a single vendor's commercial product line"
      - "The x. (unregistered) tree, the tree IANA reserves for officially registered vendors"
      - "The vnd. (vendor) tree"
      - "The standards tree (no prefix), the correct home for one company's proprietary types"
    answer: 2
    explanation: |
      The `vnd.` vendor tree is for media types associated with a specific product or
      organization — the common choice for APIs. `prs.` is personal/vanity, `x.` is
      unregistered/experimental, and unprefixed standards-tree names require IANA registration.
    ref: "concepts.md#vendor-media-types"

  - id: request-response-design-and-content-negotiation-034
    difficulty: intermediate
    tags: [vendor-media-types, trade-offs, versioning]
    question: |
      Which is a real downside of media-type versioning compared to URL-based versioning?
    options:
      - "It forces the resource's canonical URI to change with every new version released"
      - "It is harder to test casually in a browser address bar or a quick curl"
      - "It violates RFC 9110's rules on how the Accept header may be used for negotiation"
      - "It has no way to encode a version number, unlike a numbered URL path segment"
    answer: 1
    explanation: |
      Media-type versioning keeps URIs stable and is considered more RESTful, but you cannot
      set `Accept` from a browser address bar and it is less discoverable, so many public APIs
      choose URL versioning for convenience.
    ref: "concepts.md#vendor-media-types"

  - id: request-response-design-and-content-negotiation-035
    difficulty: intermediate
    tags: [vendor-media-types, problem-details, standard-types]
    question: |
      Which media type does RFC 9457 define for machine-readable API error responses?
    options:
      - "application/error+json"
      - "application/hal+json"
      - "application/problem+json"
      - "application/vnd.api+json"
    answer: 2
    explanation: |
      RFC 9457 (Problem Details for HTTP APIs, which obsoletes RFC 7807) defines
      `application/problem+json`. `hal+json` is HAL hypermedia and `vnd.api+json` is JSON:API.
    ref: "concepts.md#vendor-media-types"

  - id: request-response-design-and-content-negotiation-036
    difficulty: beginner
    tags: [sparse-fieldsets, partial-response, over-fetching]
    question: |
      What problem do sparse fieldsets / partial responses (e.g. `?fields=id,name`) primarily
      address?
    options:
      - "Authenticating the client by embedding its identity in the requested field list"
      - "Rate limiting, by capping how many fields a caller may pull per unit of time"
      - "Over-fetching — returning more fields than the client needs"
      - "Choosing the natural language the response text should be localized into"
    answer: 2
    explanation: |
      Field selection lets a client request only the properties it needs, reducing payload
      size and over-fetching — a common REST answer to the over-fetching problem GraphQL is
      often cited for.
    ref: "concepts.md#partial-responses-and-sparse-fieldsets"

  - id: request-response-design-and-content-negotiation-037
    difficulty: intermediate
    tags: [sparse-fieldsets, filtering, projection]
    question: |
      How does a `fields` parameter differ from a filter like `?status=active`?
    options:
      - "They are identical mechanisms — both simply drop unwanted resources from the returned collection"
      - "fields filters which resources are returned, while status selects which properties each one includes"
      - "Both parameters only affect pagination, controlling the page size and offset of the returned list"
      - "fields selects which properties to include (projection); status filters which resources are returned"
    answer: 3
    explanation: |
      `fields` is projection — which properties of each resource to include. A filter such as
      `?status=active` selects which resources/rows are returned. Conflating projection with
      filtering is a common mistake.
    ref: "concepts.md#partial-responses-and-sparse-fieldsets"

  - id: request-response-design-and-content-negotiation-038
    difficulty: intermediate
    tags: [expansion, embedding, round-trips]
    question: |
      Stripe's `expand[]` and JSON:API's `include` are examples of which lever, and what does
      it do relative to sparse fieldsets?
    options:
      - "Filtering; it removes non-matching resources from the collection before the response is serialized"
      - "Expansion/embedding; it pulls related resources into the response to cut round-trips (the inverse of shrinking)"
      - "Pagination; it splits an oversized response into sequential pages linked by next and prev cursors"
      - "Compression; it reduces payload size by gzip-encoding the related resources before transmission"
    answer: 1
    explanation: |
      Expansion (expand/include) pulls related resources inline to reduce round-trips — the
      inverse of sparse fieldsets, which shrink the payload. Sparse fieldsets project down;
      expansion grows the response.
    ref: "concepts.md#partial-responses-and-sparse-fieldsets"

  - id: request-response-design-and-content-negotiation-039
    difficulty: advanced
    tags: [sparse-fieldsets, security, authorization]
    question: |
      When implementing a `fields` parameter, which security concern must you still enforce?
    options:
      - "Field-level authorization — a client must not obtain fields it isn't allowed to see just by requesting them"
      - "The client can now bypass the endpoint's per-minute rate limits by splitting one call into many"
      - "The response must always be gzip-compressed once a fields parameter narrows the projection"
      - "The Accept header can be ignored because field selection already fixes the response media type"
    answer: 0
    explanation: |
      A `fields` parameter must not become a way to request data the caller isn't authorized
      for. The server still enforces per-field authorization; otherwise it's a Broken Object
      Property Level Authorization issue (OWASP API3:2023).
    ref: "concepts.md#partial-responses-and-sparse-fieldsets"

  - id: request-response-design-and-content-negotiation-040
    difficulty: advanced
    tags: [sparse-fieldsets, caching, etag]
    question: |
      Two requests to the same resource differ only by their `fields=` parameter. What is the
      correct way to think about caching and ETags here?
    options:
      - "They are the same representation, so they must share a single cache entry and one identical ETag regardless of the fields selected"
      - "They are different representations of the resource; cache keys should include the query string and an ETag should reflect the partial content"
      - "Partial responses can never be cached because a projected body is not a complete resource representation"
      - "ETags are irrelevant to GET requests, so conditional caching plays no role in field-selected responses"
    answer: 1
    explanation: |
      Different `fields=` selections yield different representations of the same resource.
      Caches typically key on the full URL (query string included), and a partial
      representation's ETag should reflect its partial content to avoid conditional-request
      confusion.
    ref: "concepts.md#partial-responses-and-sparse-fieldsets"

  - id: request-response-design-and-content-negotiation-041
    difficulty: beginner
    tags: [envelope, bare-body]
    question: |
      What is a "bare body" response?
    options:
      - "A response whose resource is nested inside a top-level data/meta/errors envelope object"
      - "A response whose JSON body is the resource itself, with no wrapper object"
      - "A response that deliberately omits the Content-Type header so the client sniffs the media type"
      - "An empty 204 No Content response returned after a successful write with nothing in the body"
    answer: 1
    explanation: |
      A bare body returns the resource directly (e.g. `{"id":42,"name":"Ada"}`) rather than
      nesting it under a `data` key with `meta`/`errors`. Metadata is instead carried via HTTP
      status and headers.
    ref: "concepts.md#envelope-versus-bare-body"

  - id: request-response-design-and-content-negotiation-042
    difficulty: intermediate
    tags: [envelope, anti-pattern, status]
    question: |
      Why is returning HTTP `200 OK` with a body like `{"status": 500, "error": "..."}`
      considered an anti-pattern?
    options:
      - "It wastes bandwidth by duplicating the status line integer inside the response body as well"
      - "It masks the real outcome from caches, monitoring, and generic clients that rely on the HTTP status code"
      - "JSON objects are not permitted to contain a member literally named status per RFC 8259"
      - "RFC 9110 explicitly requires every error response body to be wrapped in a status envelope"
    answer: 1
    explanation: |
      Putting the real status inside a 200 body shadows the actual HTTP status. Caches,
      monitoring, retries, and generic clients key off the status line, so a 200-with-error
      breaks all of them. Use the real status code.
    ref: "concepts.md#envelope-versus-bare-body"

  - id: request-response-design-and-content-negotiation-043
    difficulty: intermediate
    tags: [envelope, collections, pagination]
    question: |
      In which case does an envelope most clearly earn its keep?
    options:
      - "Single-resource GET responses, where the lone object gains a wrapper solely for consistency"
      - "204 No Content responses, where the envelope documents why the body was intentionally empty"
      - "Collection/list responses, where next/prev/total need a home alongside the items"
      - "Responses that only set headers, where the envelope mirrors each header value into the body"
    answer: 2
    explanation: |
      Collections almost always need a wrapper so pagination metadata (next, prev, total) has
      a place to live: `{"data":[...],"links":{...},"meta":{...}}`. Single resources are often
      fine bare, using headers for metadata.
    ref: "concepts.md#envelope-versus-bare-body"

  - id: request-response-design-and-content-negotiation-044
    difficulty: intermediate
    tags: [envelope, http-headers, metadata]
    question: |
      A team wants to return metadata (resource location, entity version, request id) with a
      created resource. What is the most HTTP-idiomatic approach before reaching for an envelope?
    options:
      - "Wrap the location, version, and request id together in a data/meta envelope and return 200 OK"
      - "Use HTTP mechanisms: Location for URI, ETag for version, X-Request-Id header, and the 201 status"
      - "Encode the location, version, and request id as a query string appended to the response body"
      - "Withhold the metadata and make the client issue a separate follow-up request to fetch each field"
    answer: 1
    explanation: |
      HTTP already provides mechanisms: `Location` for the new resource URI, `ETag` for the
      version, `X-Request-Id` for correlation, and the status code for outcome. Reach for
      these before inventing a body envelope that re-implements HTTP.
    ref: "concepts.md#envelope-versus-bare-body"

  - id: request-response-design-and-content-negotiation-045
    difficulty: beginner
    tags: [iso8601, dates, formatting]
    question: |
      Which timestamp format is recommended for JSON API fields to avoid ambiguity?
    options:
      - "A locale-dependent numeric string like 07/19/2026, whose day-month order shifts by region"
      - "A human sentence such as 'July 19th, 2026 at 2:32 pm', formatted for direct display to end users"
      - "ISO 8601 / RFC 3339 with an explicit offset or Z, e.g. 2026-07-19T14:32:05Z"
      - "The IMF-fixdate format used in HTTP header fields, e.g. 'Sun, 19 Jul 2026 14:32:05 GMT'"
    answer: 2
    explanation: |
      Use ISO 8601 / RFC 3339 strings with `Z` or an explicit offset. They are unambiguous,
      sort chronologically as text, and pin down the timezone. IMF-fixdate is for HTTP header
      fields (Date, Last-Modified), not JSON body values.
    ref: "concepts.md#date-and-number-formatting-with-iso-8601"

  - id: request-response-design-and-content-negotiation-046
    difficulty: advanced
    tags: [numbers, precision, ids]
    question: |
      Why should a 64-bit integer ID be serialized as a JSON string rather than a JSON number?
    options:
      - "A quoted string always serializes to fewer bytes on the wire than the equivalent bare integer"
      - "The JSON grammar has no production for integers at all, so every ID must be quoted as text"
      - "Most parsers treat JSON numbers as IEEE-754 doubles, losing precision above 2^53-1, corrupting large IDs in JS clients"
      - "JSON numbers cannot be used as object keys, so a numeric ID could never index a lookup map"
    answer: 2
    explanation: |
      JSON numbers are typically parsed as IEEE-754 doubles, so integers above 2^53-1
      (Number.MAX_SAFE_INTEGER) lose precision — a 64-bit ID gets silently corrupted in
      JavaScript. Serialize large integer IDs as strings.
    ref: "concepts.md#date-and-number-formatting-with-iso-8601"

  - id: request-response-design-and-content-negotiation-047
    difficulty: intermediate
    tags: [money, numbers, formatting]
    question: |
      What is the recommended way to represent a monetary amount in a JSON payload?
    options:
      - "As an IEEE-754 binary float like 19.99, letting the JSON number type carry the exact value"
      - "As a locale-formatted display string like '$19.99' with the currency symbol baked into the text"
      - "As epoch milliseconds since 1970, reusing the same integer encoding recommended for timestamps"
      - "As integer minor units (amountCents: 1999) or a decimal string ('19.99') plus a currency code"
    answer: 3
    explanation: |
      Floats introduce rounding errors (0.1 + 0.2 != 0.3). Represent money as integer minor
      units (e.g. cents) or a decimal string, always with an explicit ISO 4217 currency code.
      Never as a JSON float.
    ref: "concepts.md#date-and-number-formatting-with-iso-8601"

  - id: request-response-design-and-content-negotiation-048
    difficulty: advanced
    tags: [http-headers, date-format, iso8601]
    question: |
      The HTTP `Last-Modified` response header uses which date format, and is it the same as
      JSON body timestamps?
    options:
      - "ISO 8601 / RFC 3339, byte-for-byte identical to the timestamp format used in JSON body fields"
      - "IMF-fixdate (e.g. 'Sun, 19 Jul 2026 14:32:05 GMT'), which differs from the ISO 8601 you use in JSON bodies"
      - "Epoch seconds since 1970, exactly the integer encoding recommended for timestamps in JSON bodies"
      - "A locale-dependent date format selected per request based on the client's Accept-Language header"
    answer: 1
    explanation: |
      HTTP date header fields (Date, Last-Modified, Expires) use IMF-fixdate per RFC 9110 —
      e.g. `Sun, 19 Jul 2026 14:32:05 GMT`. That is distinct from the ISO 8601/RFC 3339 format
      recommended for JSON body timestamps; don't confuse the two.
    ref: "concepts.md#date-and-number-formatting-with-iso-8601"

  - id: request-response-design-and-content-negotiation-049
    difficulty: intermediate
    tags: [numbers, units, formatting]
    question: |
      A field is defined as `"amount": 1999`. What design guidance does this violate?
    options:
      - "Every numeric value must be serialized as a quoted string to survive parsing without loss"
      - "Units must be explicit; a bare 'amount' is ambiguous (dollars? cents? something else)"
      - "Integer literals are disallowed by the JSON grammar, so amount must be a decimal fraction"
      - "The field name violates casing rules because monetary fields are required to use snake_case"
    answer: 1
    explanation: |
      Without units the value is ambiguous. Name fields to encode units (amountCents,
      durationMs, distanceMeters) or pair them with a unit/currency field so clients can't
      misinterpret the magnitude.
    ref: "concepts.md#date-and-number-formatting-with-iso-8601"

  - id: request-response-design-and-content-negotiation-050
    difficulty: intermediate
    tags: [json, utf-8, charset, rfc8259]
    question: |
      Regarding `application/json` and character encoding, which statement is correct?
    options:
      - "JSON must be transmitted as ISO-8859-1 unless the sender overrides it with a charset parameter"
      - "The application/json media type has no charset parameter and JSON is required to be UTF-8 (RFC 8259), so charset=utf-8 is redundant"
      - "Every JSON request must carry an explicit Accept-Charset header naming the encoding the client wants"
      - "The character encoding of a JSON body is negotiated through the Content-Encoding response header"
    answer: 1
    explanation: |
      RFC 8259 requires JSON exchanged between systems to be UTF-8, and the `application/json`
      media type does not define a `charset` parameter, so appending `charset=utf-8` is at best
      redundant. Accept-Charset is deprecated, and encoding negotiation (Content-Encoding) is
      about compression, not charset.
    ref: "concepts.md#media-types-and-the-content-type-and-accept-headers"

  - id: request-response-design-and-content-negotiation-051
    difficulty: advanced
    tags: [prefer, return-minimal, rfc7240]
    question: |
      A high-throughput batch client POSTs thousands of records and does not want each
      created resource echoed back. Which header expresses this, and how should the server
      confirm it complied?
    options:
      - "Expect: 100-continue; the server replies 100 Continue and then suppresses each created body"
      - "Prefer: return=minimal; server replies with no body and Preference-Applied: return=minimal"
      - "Accept: application/none; the server replies 406 Not Acceptable and omits every representation"
      - "Cache-Control: no-store; the server replies 204 while still echoing each created resource body"
    answer: 1
    explanation: |
      `Prefer: return=minimal` (RFC 7240) asks the server not to echo the representation.
      Because the preference is optional and the absent body gives the client no other
      signal, the server MUST send `Preference-Applied: return=minimal` to confirm it was
      honored, typically with a 201/204 and no body.
    ref: "concepts.md#the-prefer-request-header-and-returnminimal"

  - id: request-response-design-and-content-negotiation-052
    difficulty: expert
    tags: [prefer, vary, caching]
    question: |
      An endpoint's response body differs depending on whether the client sends
      `Prefer: return=minimal` or `return=representation`, and the responses are cacheable
      by a shared cache. What must the server also send to stay correct?
    options:
      - "Vary: Prefer, so the cache does not serve a bodyless response to a client that wanted the representation"
      - "Cache-Control: immutable, since a response chosen by Prefer can never change once stored"
      - "Content-Encoding: identity, to switch off compression of the body that varies by preference"
      - "Nothing at all; Prefer is only a request header and can never influence shared-cache behavior"
    answer: 0
    explanation: |
      A shared cache keys on URL plus the headers named in `Vary`. Since the body varies by
      the `Prefer` value, the response needs `Vary: Prefer`; otherwise a cache could hand a
      `return=minimal` (bodyless) response to a client that asked for the full representation.
    ref: "concepts.md#the-prefer-request-header-and-returnminimal"

  - id: request-response-design-and-content-negotiation-053
    difficulty: intermediate
    tags: [prefer, async, 202]
    question: |
      A client sends `Prefer: respond-async` on a long-running operation. Which response is
      the idiomatic match?
    options:
      - "200 OK returned immediately with the fully completed operation result serialized inline"
      - "204 No Content returned at once, signaling the work finished with nothing left to report"
      - "202 Accepted, typically with a location to poll for status"
      - "409 Conflict repeatedly until the long-running operation finishes and frees the resource"
    answer: 2
    explanation: |
      `respond-async` (RFC 7240) asks the server to process the request asynchronously; the
      idiomatic answer is `202 Accepted`, usually pointing the client at a status/monitor
      resource to poll. `wait` can bound how long the server blocks before going async.
    ref: "concepts.md#the-prefer-request-header-and-returnminimal"

  - id: request-response-design-and-content-negotiation-054
    difficulty: expert
    tags: [problem-details, rfc9457, error-design]
    question: |
      You must design a validation error body reporting three bad fields, per RFC 9457.
      Which design is correct?
    options:
      - "Return 200 OK with {\"error\": true} and list each of the three bad fields in a custom X-Errors response header"
      - "Return one application/problem+json object with type/title/status/detail plus an errors[] extension member listing each field failure"
      - "Return three separate 422 Unprocessable Content responses in sequence, one dedicated to each invalid field"
      - "Put the human-readable detail sentence in the type member so clients branch on the localized message text"
    answer: 1
    explanation: |
      RFC 9457 uses a single Problem Details object with the standard members and permits
      extension members; an `errors[]` array (each entry pointing at a field, e.g. via JSON
      Pointer) is the idiomatic way to report multiple field failures. Clients branch on the
      stable `type` URI, not on human-readable `title`/`detail`.
    ref: "concepts.md#problem-details-error-bodies-rfc-9457"

  - id: request-response-design-and-content-negotiation-055
    difficulty: expert
    tags: [problem-details, type-member, rfc9457]
    question: |
      In an RFC 9457 Problem Details body, what is the role of the `type` member and its
      default value?
    options:
      - "It is the HTTP status code duplicated as an integer for out-of-band logging; its default value is 200 when no error occurred"
      - "It is a URI identifying the problem type that clients should key logic on; default is about:blank meaning 'use the status code's meaning'"
      - "It is a human-readable free-text summary that must be localized per Accept-Language, and its default is an empty string clients ignore"
      - "It must be a dereferenceable URL that returns an HTML explanation page, or the Problem Details body is rejected as invalid"
    answer: 1
    explanation: |
      `type` is a URI that identifies the problem type and is the primary discriminator
      clients should branch on. Its default is `about:blank`, meaning there is no specific
      type and the HTTP status code carries the semantics. The URI need not be
      dereferenceable, though pointing at docs is encouraged.
    ref: "concepts.md#problem-details-error-bodies-rfc-9457"

  - id: request-response-design-and-content-negotiation-056
    difficulty: advanced
    tags: [problem-details, status-member, rfc9457]
    question: |
      An RFC 9457 body contains `"status": 404` but the response status line is
      `200 OK`. What is wrong?
    options:
      - "Nothing is wrong; the status member inside the body overrides the response status line for any conformant client"
      - "The status member is advisory and MUST match the actual response status; a 200 line with status:404 is a contract violation"
      - "The status member must be serialized as a JSON string rather than a number, or strict clients reject the body"
      - "Problem Details bodies are permitted only on 5xx responses and are forbidden on every 2xx and 4xx response"
    answer: 1
    explanation: |
      The `status` member duplicates the HTTP status for out-of-band contexts and MUST
      equal the real response status line. It does not replace or override it, so a
      `200 OK` carrying `status: 404` is inconsistent and broken.
    ref: "concepts.md#problem-details-error-bodies-rfc-9457"

  - id: request-response-design-and-content-negotiation-057
    difficulty: expert
    tags: [query-method, get-body, caching, search]
    question: |
      A client must send a 20 KB structured search filter and the results should be
      cacheable per-filter. Which approach is best and why?
    options:
      - "GET with a JSON request body, because GET is safe and cacheable so intermediaries will key the cache on that body"
      - "POST /search, because a shared cache always stores POST responses keyed by their exact request body content"
      - "The HTTP QUERY method, which is safe, idempotent, and cacheable with the request body as part of the cache key"
      - "Encode the entire 20 KB filter in the URL query string, since query strings have no practical length limit in HTTP"
    answer: 2
    explanation: |
      GET-with-body has undefined semantics and won't be part of the cache key; POST is
      neither safe nor idempotent so it is not cacheable; a huge query string hits URI-length
      limits. The QUERY method is safe and idempotent like GET but carries a request body
      that participates in the cache key.
    ref: "concepts.md#get-with-a-body-and-the-http-query-method"

  - id: request-response-design-and-content-negotiation-058
    difficulty: advanced
    tags: [get-body, rfc9110, semantics]
    question: |
      Per RFC 9110 §9.3.1, what is true about sending a body on a GET request?
    options:
      - "It is required by RFC 9110 whenever the GET carries query parameters too long to fit in the URI"
      - "It has no defined semantics; a server may reject it or ignore the body, and caches won't key on it"
      - "It is fully specified by RFC 9110 and the server must merge the body into the query string parameters"
      - "It automatically causes the server to reclassify and process the request as if it were a POST"
    answer: 1
    explanation: |
      RFC 9110 states a GET body has no defined semantics. Servers may reject such requests
      or ignore the body, and intermediaries won't include it in the cache key. This is why
      GET-with-body is never a reliable design and the QUERY method exists.
    ref: "concepts.md#get-with-a-body-and-the-http-query-method"

  - id: request-response-design-and-content-negotiation-059
    difficulty: advanced
    tags: [query-method, accept-query]
    question: |
      With the HTTP QUERY method, which header lets a server advertise the query media types
      it can accept in the request body?
    options:
      - "Accept"
      - "Accept-Query"
      - "Content-Query"
      - "Query-Encoding"
    answer: 1
    explanation: |
      `Accept-Query` advertises the query formats a QUERY-capable resource understands, the
      way `Accept-Post`/`Accept-Patch` advertise acceptable request-body types for POST/PATCH.
      `Accept` on a request still expresses what the client wants back.
    ref: "concepts.md#get-with-a-body-and-the-http-query-method"

  - id: request-response-design-and-content-negotiation-060
    difficulty: expert
    tags: [i-json, duplicate-keys, security]
    question: |
      A request body contains `{"role":"user","role":"admin"}`. Under I-JSON (RFC 7493) and
      from a security standpoint, what is the concern?
    options:
      - "Nothing is wrong; the JSON specification guarantees that the first occurrence of a duplicated key always wins in every parser"
      - "I-JSON forbids duplicate keys, and parser disagreement (first-wins vs last-wins) can drive authorization-bypass / smuggling"
      - "It is perfectly valid and the server merges both entries so the user is granted the user and admin roles at once"
      - "Duplicate keys force every conformant parser to reject the whole message with a hard error, because RFC 8259 makes uniqueness mandatory"
    answer: 1
    explanation: |
      RFC 8259 only says objects SHOULD have unique keys; I-JSON (RFC 7493) makes it a MUST.
      Different parsers resolve duplicates differently (first vs last wins), so a validator and
      an executor can disagree on the value — an authorization-bypass / request-smuggling risk.
    ref: "concepts.md#i-json-binary-data-and-multipart-payloads"

  - id: request-response-design-and-content-negotiation-061
    difficulty: advanced
    tags: [binary, base64, multipart]
    question: |
      A client needs to upload a 50 MB PDF plus JSON metadata in one request. Which approach
      is best and why?
    options:
      - "base64-encode the PDF into a JSON string field alongside the metadata"
      - "multipart/form-data with a JSON metadata part and a raw binary file part, each with its own Content-Type"
      - "Send the PDF as a JSON array of individual byte integers next to the metadata, since arrays transmit binary more compactly than base64"
      - "Put the base64-encoded PDF in the URL query string alongside the metadata parameters, because query strings impose no size limit"
    answer: 1
    explanation: |
      base64 inflates size ~33% and wastes CPU, which is wasteful for large files. multipart/
      form-data carries a JSON metadata part and a raw binary file part in a single request,
      each with its own Content-Type, avoiding base64 bloat. base64-in-JSON is fine only for
      small blobs.
    ref: "concepts.md#i-json-binary-data-and-multipart-payloads"

  - id: request-response-design-and-content-negotiation-062
    difficulty: expert
    tags: [streaming, ndjson, json-seq, backpressure]
    question: |
      An endpoint must return 10 million rows to a client. Why is a single JSON array a poor
      choice, and what is a better shape?
    options:
      - "A 10-million-element JSON array is not valid JSON at that size, so you must return an XML document instead to stream the rows"
      - "A JSON array isn't incrementally parseable until the closing bracket, forcing full buffering; stream NDJSON (application/x-ndjson) or JSON sequences (application/json-seq) over chunked transfer"
      - "A JSON array is capped at 65535 elements by the specification, so you must paginate the result into fixed pages of 65535 rows"
      - "A JSON array cannot be compressed; NDJSON compresses better and that is the only reason"
    answer: 1
    explanation: |
      A `[...]` array isn't valid until the closing `]`, so both ends must buffer everything —
      a memory bomb with no backpressure. NDJSON / JSON Lines and RFC 7464 JSON sequences emit
      one record per line/frame, letting the consumer process and discard incrementally over
      Transfer-Encoding: chunked.
    ref: "concepts.md#streaming-response-shapes-ndjson-json-sequences-and-sse"

  - id: request-response-design-and-content-negotiation-063
    difficulty: advanced
    tags: [streaming, sse, media-types]
    question: |
      Which media type identifies a Server-Sent Events stream, and what is it best suited for?
    options:
      - "application/x-ndjson; streaming a large query result set"
      - "text/event-stream; a server-to-client push channel (notifications, progress) over one HTTP response"
      - "application/json-seq; establishing a full-duplex bidirectional messaging channel between client and server over one connection"
      - "multipart/mixed; uploading several binary files together in a single client-to-server request with per-part boundaries"
    answer: 1
    explanation: |
      SSE uses `text/event-stream` and is a server-to-client push channel with auto-reconnect
      and `id:`/`event:` fields. NDJSON and json-seq are for streaming large result sets; SSE
      is for pushing events. Neither is full-duplex (that's WebSockets).
    ref: "concepts.md#streaming-response-shapes-ndjson-json-sequences-and-sse"

  - id: request-response-design-and-content-negotiation-064
    difficulty: expert
    tags: [integrity, content-digest, repr-digest, rfc9530]
    question: |
      Per RFC 9530, a resource is served gzip-compressed. Which digest stays stable across the
      compression and which reflects the on-the-wire bytes?
    options:
      - "Content-Digest is stable across encoding; Repr-Digest changes with encoding"
      - "Repr-Digest is stable across encoding; Content-Digest reflects the actual (encoded) content on this hop"
      - "Both Content-Digest and Repr-Digest recompute to the same new value whenever any content coding such as gzip is applied"
      - "Both digests are computed only over the response header block and never the body, so the content coding is irrelevant to either"
    answer: 1
    explanation: |
      `Repr-Digest` covers the full representation independent of encoding/range, so it is
      stable across gzip. `Content-Digest` covers the actual message content on this hop,
      after content coding or range selection, so it changes when the body is compressed —
      mirroring the Content-Encoding vs representation split.
    ref: "concepts.md#payload-integrity-content-digest-and-repr-digest"

  - id: request-response-design-and-content-negotiation-065
    difficulty: expert
    tags: [integrity, tls, message-signatures]
    question: |
      A payload traverses two proxies and arrives corrupted; TLS was used on every hop. Why
      doesn't TLS alone localize the corruption, and what helps?
    options:
      - "TLS provides cryptographic end-to-end body integrity across every intermediary, so a corrupted payload arriving intact is impossible"
      - "TLS integrity is per-hop only (terminated at each proxy); Repr-Digest/Content-Digest let any hop or the client verify the body against the origin"
      - "Only the Content-Length header can detect corruption, by revealing that the received byte count differs from what the origin sent"
      - "You must downgrade the connection to HTTP/1.0, whose simpler framing is the only way to obtain true end-to-end body integrity"
    answer: 1
    explanation: |
      TLS is terminated and re-established at each proxy, so its integrity protection is
      per-hop, not end-to-end. RFC 9530 digest fields let recipients verify the body against
      the origin's digest across hops; for header integrity too you add HTTP Message Signatures
      (RFC 9421).
    ref: "concepts.md#payload-integrity-content-digest-and-repr-digest"

  - id: request-response-design-and-content-negotiation-066
    difficulty: expert
    tags: [content-location, location, negotiation]
    question: |
      A negotiated `GET /articles/42` (Accept-Language: fr) returns 200 with
      `Content-Location: /articles/42.fr.json`. What does that header convey?
    options:
      - "The URI the client should immediately follow as a redirect to fetch the negotiated French representation from a new location"
      - "The canonical URI of the specific negotiated variant contained in this response body, which the client can cache or bookmark directly"
      - "The location of a newly created sub-resource that the negotiation produced as a side effect of this GET request"
      - "The URI of a status monitor the client should poll to track an asynchronous operation kicked off by this request"
    answer: 1
    explanation: |
      `Content-Location` names the canonical URI of the representation actually in this body —
      here the concrete French/JSON variant — so a client can address that variant directly.
      `Location`, by contrast, points at a different resource (created, redirect, or async
      monitor).
    ref: "concepts.md#content-location-versus-location"

  - id: request-response-design-and-content-negotiation-067
    difficulty: advanced
    tags: [location, content-location, headers]
    question: |
      Which pairing of header to purpose is correct?
    options:
      - "Location on a 201 = URI of the newly created resource; Content-Location = canonical URI of the representation in this body"
      - "Location = the canonical URI of the representation carried in this body; Content-Location = the target the client should be redirected to"
      - "Both headers are defined to always carry the identical URI value, so a client may read either one interchangeably"
      - "Content-Location is only valid on 3xx redirect responses and must be omitted from any 200 OK carrying a representation"
    answer: 0
    explanation: |
      `Location` on a 201 gives the new resource's URI (and is the redirect target on 3xx or
      the monitor on 202); `Content-Location` gives the canonical URI of the representation
      carried in the current body. They serve different roles and usually differ.
    ref: "concepts.md#content-location-versus-location"

  - id: request-response-design-and-content-negotiation-068
    difficulty: expert
    tags: [framing, content-length, chunked, smuggling]
    question: |
      A request arrives with both `Content-Length: 10` and `Transfer-Encoding: chunked`.
      What does RFC 9112 require, and why does this matter?
    options:
      - "Honor Content-Length and silently discard Transfer-Encoding; RFC 9112 makes this precedence mandatory and it carries no security impact"
      - "Transfer-Encoding takes precedence and Content-Length must be treated as an error; disagreement between proxy and server enables request smuggling (CL.TE/TE.CL)"
      - "Reject the message with 411 Length Required in all cases, since carrying both framing headers is defined as a missing-length error"
      - "Sum the declared Content-Length and the decoded chunked length to determine the total body size to read off the socket"
    answer: 1
    explanation: |
      When both are present, `Transfer-Encoding: chunked` wins and the `Content-Length` must
      be treated as an error. If a front-end proxy and back-end server disagree about which to
      obey, an attacker can smuggle a request past the front-end — the CL.TE/TE.CL attack
      class. Robust servers reject messages carrying both.
    ref: "concepts.md#message-framing-content-length-versus-chunked-transfer"

  - id: request-response-design-and-content-negotiation-069
    difficulty: advanced
    tags: [range, partial-content, 206, 416]
    question: |
      A client sends `Range: bytes=0-1023` on a 2048-byte resource that supports ranges. What
      are the correct success status and header, and what is returned for an unsatisfiable range?
    options:
      - "200 OK with Content-Length: 1024 and the sliced body; 400 Bad Request when the requested range cannot be satisfied"
      - "206 Partial Content with Content-Range: bytes 0-1023/2048; 416 Range Not Satisfiable for an invalid range"
      - "204 No Content with the first 1024 bytes in headers; 404 Not Found returned whenever the requested range is unsatisfiable"
      - "206 Partial Content with Accept-Ranges: none on the response; 500 Internal Server Error returned for an out-of-bounds range"
    answer: 1
    explanation: |
      A satisfied range yields `206 Partial Content` with `Content-Range: bytes 0-1023/2048`.
      An unsatisfiable range (e.g. start beyond the length) yields `416 Range Not Satisfiable`.
      The server advertises support up front with `Accept-Ranges: bytes`.
    ref: "concepts.md#range-requests-and-partial-transfer"

  - id: request-response-design-and-content-negotiation-070
    difficulty: expert
    tags: [range, sparse-fieldsets, projection, transfer]
    question: |
      What is the fundamental difference between a Range request returning 206 and a sparse
      fieldset (`?fields=`) response?
    options:
      - "They are two names for the same feature, one used in the HTTP spec and one used in JSON:API, with no behavioral difference"
      - "Range/206 transfers a subset of the representation's bytes (partial transfer); sparse fieldsets project a subset of the resource's fields (partial projection)"
      - "Range requests apply only to JSON bodies while sparse fieldsets apply only to binary payloads, so the two never overlap"
      - "Sparse fieldsets must be answered with the 206 Partial Content status and a Content-Range header, exactly as Range requests are"
    answer: 1
    explanation: |
      Range requests are about which *bytes* of the representation to transfer (partial
      transfer, answered with 206/Content-Range). Sparse fieldsets are about which *fields*
      to include (partial projection, still a normal 200). They operate on orthogonal axes
      and can coexist.
    ref: "concepts.md#range-requests-and-partial-transfer"

  - id: request-response-design-and-content-negotiation-071
    difficulty: expert
    tags: [vary, caching, cache-key, user-agent]
    question: |
      A team adds `Vary: User-Agent` to personalize a cacheable page per browser. What is the
      likely consequence?
    options:
      - "Cache hit rate improves because each response is stored under a more specific key that matches the exact browser more often"
      - "The cache fragments into thousands of entries (one per UA string), collapsing hit rate; normalize the dimension server-side instead"
      - "The response becomes entirely uncacheable, because naming User-Agent in Vary is treated by caches as exactly equivalent to Vary: *"
      - "Nothing changes, because shared caches are defined to ignore User-Agent as a Vary dimension and collapse all UA values into one entry"
    answer: 1
    explanation: |
      `Vary` creates a separate cache entry per distinct value of the listed header. User-Agent
      strings are extremely high-cardinality, so `Vary: User-Agent` shatters the cache into
      near-unique entries and destroys hit rate. Collapse/normalize such dimensions on the
      server rather than varying on them.
    ref: "concepts.md#vary-and-cache-key-mechanics"

  - id: request-response-design-and-content-negotiation-072
    difficulty: expert
    tags: [vary, cache-control, private, security]
    question: |
      Why is relying on `Vary: Authorization` (or `Vary: Cookie`) to keep per-user responses
      separate in a shared cache dangerous?
    options:
      - "It is perfectly safe and the approach RFC 9111 recommends for isolating per-user responses inside a shared cache"
      - "It either fragments the cache to uselessness or, if omitted anywhere, risks serving one user's private response to another; private responses should use Cache-Control: private"
      - "The Vary header is syntactically forbidden from naming the Authorization or Cookie headers, so the directive is silently dropped"
      - "It forces the cache to compress every stored per-user response, wasting CPU on bodies that will each be served only once"
    answer: 1
    explanation: |
      Varying on Authorization/Cookie makes responses effectively per-user (useless in a
      shared cache) and is fragile: a missing/mis-set Vary can leak one user's private response
      to another. Private, user-specific responses should be marked `Cache-Control: private`
      rather than relying on Vary.
    ref: "concepts.md#vary-and-cache-key-mechanics"

  - id: request-response-design-and-content-negotiation-073
    difficulty: expert
    tags: [json-patch, merge-patch, concurrency, rfc6902]
    question: |
      You need to append to an array, remove one field, and abort the whole change if a
      version field isn't 7. Which PATCH body format fits and why?
    options:
      - "JSON Merge Patch, because its built-in test member can assert the version equals 7 and abort the whole patch on mismatch"
      - "JSON Patch (RFC 6902, application/json-patch+json): ordered ops with add to /arr/-, remove, and a test op for optimistic concurrency"
      - "JSON Merge Patch, because it can target individual array indices like /arr/2 and append new elements with the /arr/- pointer"
      - "Neither format works, since the PATCH method has no way to express a conditional or version-guarded update and you must fall back to PUT"
    answer: 1
    explanation: |
      JSON Patch provides `add`/`remove`/`replace`/`move`/`copy`/`test` addressed by JSON
      Pointer, can append with `/arr/-`, and its `test` op fails the whole patch atomically for
      optimistic concurrency. Merge Patch cannot edit individual array elements or express a
      test.
    ref: "concepts.md#json-patch-versus-json-merge-patch"

  - id: request-response-design-and-content-negotiation-074
    difficulty: advanced
    tags: [merge-patch, limitations, rfc7396]
    question: |
      Which is a genuine limitation of JSON Merge Patch (RFC 7396) that JSON Patch avoids?
    options:
      - "Merge Patch cannot change any existing field value; it is limited to adding brand-new members and can never overwrite one already present"
      - "Merge Patch cannot set a member to null (null means delete) and cannot edit individual array elements (arrays are replaced wholesale)"
      - "Merge Patch requires the server to answer with the 206 Partial Content status code and a Content-Range header on every successful patch"
      - "Merge Patch bodies must be sent as multipart/form-data with a separate part per changed field, whereas JSON Patch uses a single JSON document"
    answer: 1
    explanation: |
      In Merge Patch `null` is overloaded to mean delete, so you cannot set a member's value to
      null, and arrays can only be replaced as a whole rather than edited element-by-element.
      JSON Patch's explicit operations avoid both problems.
    ref: "concepts.md#json-patch-versus-json-merge-patch"

  - id: request-response-design-and-content-negotiation-075
    difficulty: advanced
    tags: [suffixes, rfc6839, media-types]
    question: |
      What does a structured syntax suffix like `+cbor` or `+xml` (RFC 6839) let a generic
      parser do?
    options:
      - "Guarantee the payload is compressed, telling the parser to gzip-inflate the body before it attempts to read the structure"
      - "Dispatch on the underlying syntax (parse as CBOR/XML) even for an unknown vendor subtype"
      - "Encode the negotiated API version number, so the parser can select the matching schema revision from the suffix value"
      - "Signal that the media type requires authentication, instructing the parser to reject any body that arrives without a bearer token"
    answer: 1
    explanation: |
      A suffix names the underlying structured syntax, so generic tooling can decide to parse a
      never-before-seen `application/vnd.foo+cbor` as CBOR (or `+xml` as XML). This is exactly
      why vendor media types append `+json`/`+xml`/`+cbor`.
    ref: "concepts.md#structured-syntax-suffixes-beyond-json"

  - id: request-response-design-and-content-negotiation-076
    difficulty: expert
    tags: [enums, forward-compat, aip126, versioning]
    question: |
      Is adding a new value to an existing string enum a breaking change?
    options:
      - "Always breaking under every client contract, so a published enum must be frozen at v1 and never gain a single new value"
      - "Never breaking under any circumstances, because JSON strings are inherently open-ended and every client tolerates unseen values"
      - "It depends on the client contract: breaking for strict clients that reject unknown values, safe for clients built to a must-ignore rule; reserving an UNSPECIFIED sentinel (AIP-126) mitigates it"
      - "Breaking only when the new value sorts alphabetically before an existing value and thereby shifts the enum's declaration ordinals"
    answer: 2
    explanation: |
      A strict client whose deserializer throws on unknown values breaks when you add an enum
      value; a client following a documented must-ignore-unknown rule does not. Publishing that
      rule and reserving a sentinel like `UNSPECIFIED`/`UNKNOWN` (Google AIP-126, proto3
      `0 = *_UNSPECIFIED`) is the mitigation.
    ref: "concepts.md#enum-evolution-and-forward-compatibility"

  - id: request-response-design-and-content-negotiation-077
    difficulty: expert
    tags: [compression, breach, zip-bomb, security]
    question: |
      A server compresses responses that embed a per-user CSRF token and also reflect a
      query parameter. What is the risk, and what is a separate request-side compression risk?
    options:
      - "No risk exists; TLS encrypts the body end-to-end, so response compression can never leak any embedded secret to an attacker"
      - "BREACH can leak the token via compressed-length side-channel when a secret sits next to reflected input; separately, a decompression bomb in a gzip request body can DoS the server unless the decompressed size is bounded"
      - "The only risk is added latency from the compression step; bound the per-response CPU budget and no confidentiality concern remains"
      - "Compression silently corrupts multi-byte UTF-8 sequences in the token, so gzip must be disabled for every application/json response"
    answer: 1
    explanation: |
      BREACH exploits that compression leaks the length of a secret placed next to
      attacker-reflected input, allowing token extraction; mitigate by not compressing
      secret+reflected responses or masking the token. Independently, a gzip request body can
      be a zip bomb, so servers must cap decompressed size.
    ref: "concepts.md#compression-trade-offs-and-attacks"

  - id: request-response-design-and-content-negotiation-078
    difficulty: advanced
    tags: [415, accept-post, accept-patch]
    question: |
      A server rejects a POST body with 415 Unsupported Media Type. Which response header
      should it use to tell the client what media types it would accept?
    options:
      - "Accept, echoed back on the response to list the body media types this resource will ingest"
      - "Accept-Post (for POST) or Accept-Patch (for PATCH)"
      - "Content-Type, set to the single media type the server would have preferred the client to send"
      - "Allow, which on a 415 is repurposed to enumerate the acceptable request-body media types"
    answer: 1
    explanation: |
      `Accept-Post` and `Accept-Patch` are the request-body analogues of `Accept`, advertising
      which media types the resource will accept for POST/PATCH. `Accept` states what a client
      wants back; `Allow` lists methods, not media types.
    ref: "concepts.md#406-415-and-advertising-acceptable-types"

  - id: request-response-design-and-content-negotiation-079
    difficulty: expert
    tags: [accept, q-values, specificity, rejection]
    question: |
      In an Accept header, what does `application/json;q=0` mean, and how do
      `text/plain`, `text/*`, and `*/*` rank against each other?
    options:
      - "q=0 marks the type as highest priority, and broader wildcard ranges always outrank the more specific named types they cover"
      - "q=0 means 'not acceptable' (explicit rejection of that type); specificity ranks text/plain > text/* > */*"
      - "q=0 is just the default quality value, so all three ranges are treated as equally acceptable with no ordering between them"
      - "q=0 disables caching for that variant, and the three ranges are then evaluated in plain alphabetical order of their type names"
    answer: 1
    explanation: |
      `q=0` explicitly marks a type as not acceptable — a rejection, not just low priority.
      More specific media ranges win: `text/plain;format=flowed` > `text/plain` > `text/*` >
      `*/*`, with servers breaking remaining ties by their own preference.
    ref: "concepts.md#406-415-and-advertising-acceptable-types"

  - id: request-response-design-and-content-negotiation-080
    difficulty: advanced
    tags: [204, 304, bodyless, prefer]
    question: |
      Which statement about bodyless responses is correct?
    options:
      - "304 Not Modified must repeat the full representation body so the client can diff it byte-for-byte against its cached copy"
      - "204 No Content and 304 Not Modified must not include a message body; 304 may still carry validators like ETag, and Prefer: return=minimal is how a client asks a write to answer bodyless"
      - "204 No Content must always carry a JSON envelope with a meta object explaining why the result set came back empty"
      - "A 204 response requires a Content-Length header whose value equals the byte size of the resource that was just modified"
    answer: 1
    explanation: |
      Both `204` and `304` must not carry a message body; a `304` may still send validators
      (ETag, etc.) but no body. `Prefer: return=minimal` is precisely how a client requests a
      write to answer with a bodyless 204/201 instead of echoing the resource.
    ref: "concepts.md#bodyless-responses-204-and-304"
