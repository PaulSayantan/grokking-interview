topic: "Webhooks & Async API Patterns"
domain: rest-api-design
topic_slug: webhooks-and-async-api-patterns
version: 1
questions:
  - id: webhooks-and-async-api-patterns-001
    difficulty: beginner
    tags: [webhooks, definition]
    question: |
      At the HTTP level, what *is* an outbound webhook?
    options:
      - "An HTTP request (usually POST) the producer sends to a URL the consumer registered"
      - "A long-lived TCP connection the client keeps open to receive events"
      - "A dedicated HTTP method named WEBHOOK, reserved by RFC 9110 for event notifications"
      - "A polling loop the producer runs on a fixed timer, repeatedly querying the consumer"
    answer: 0
    explanation: |
      A webhook is simply an HTTP request (conventionally a POST) that the
      producer makes to a callback URL the consumer supplied. The roles are
      reversed: the consumer runs a small server, the producer acts as client.
    ref: "concepts.md#webhooks-versus-polling"

  - id: webhooks-and-async-api-patterns-002
    difficulty: beginner
    tags: [polling, webhooks, comparison]
    question: |
      Which statement best contrasts polling with webhooks?
    options:
      - "Polling is a push model where the server initiates, while webhooks are pull"
      - "Both require the consumer to run a publicly reachable server to receive events"
      - "Webhooks eliminate the need for retries entirely because delivery is guaranteed"
      - "Polling is pull (client repeatedly asks); webhooks are push (server sends on event)"
    answer: 3
    explanation: |
      Polling is a pull model — the client repeatedly GETs to ask "anything
      new?". Webhooks are push — the producer POSTs to the consumer when an
      event occurs.
    ref: "concepts.md#webhooks-versus-polling"

  - id: webhooks-and-async-api-patterns-003
    difficulty: intermediate
    tags: [polling, firewall, trade-offs]
    question: |
      A consumer sits behind a corporate firewall and cannot expose any public
      HTTPS endpoint. Which approach can it still use to learn about events?
    options:
      - "Outbound webhooks, because the producer's inbound connection traverses the firewall unblocked"
      - "Neither approach can work, because a firewalled host can never learn about remote events"
      - "Polling, because the consumer initiates outbound requests to the producer"
      - "Webhooks over plain HTTP, since port 80 is always left open by corporate firewalls"
    answer: 2
    explanation: |
      Webhooks require the consumer to be reachable at a public URL. Behind a
      firewall/NAT that is impossible, so the consumer must poll — it initiates
      the outbound connection, which firewalls allow.
    ref: "concepts.md#webhooks-versus-polling"

  - id: webhooks-and-async-api-patterns-004
    difficulty: beginner
    tags: [polling, efficiency]
    question: |
      What is the main efficiency drawback of polling compared to webhooks?
    options:
      - "It cannot use HTTPS, so every poll request must be sent over unencrypted plain HTTP"
      - "Most poll requests return 'nothing new', wasting requests and adding latency up to the poll interval"
      - "It requires the client and server to first exchange a shared HMAC secret before any poll"
      - "It only works server-to-server and cannot be initiated from a browser or mobile client"
    answer: 1
    explanation: |
      Polling repeatedly asks and usually gets "nothing changed", wasting
      requests; and a client learns of an event only at the next poll, so
      latency is bounded by the poll interval.
    ref: "concepts.md#webhooks-versus-polling"

  - id: webhooks-and-async-api-patterns-005
    difficulty: intermediate
    tags: [envelope, payload-design]
    question: |
      Why do well-designed webhooks wrap the domain data in an envelope with a
      stable `id`, `type`, and `created` timestamp?
    options:
      - "The `id` drives consumer idempotency, `type` enables routing, and `created` supports ordering/staleness checks"
      - "To pad the payload above the 1 KB minimum so it survives gzip compression intact"
      - "Because RFC 9110 mandates this exact three-field envelope for all event notifications"
      - "To avoid needing a signature header, since the envelope authenticates the sender by itself"
    answer: 0
    explanation: |
      The envelope's `id` is the de-dup key for idempotent consumers, `type`
      lets one endpoint route many event kinds, and `created` supports ordering
      and staleness decisions. It is a convention, not an RFC mandate.
    ref: "concepts.md#anatomy-of-an-outbound-webhook-delivery"

  - id: webhooks-and-async-api-patterns-006
    difficulty: intermediate
    tags: [thin-vs-fat, payload-design]
    question: |
      A "thin" (notification-style) webhook payload sends only identifiers and
      expects the consumer to call back the API for details. What is a genuine
      advantage of thin payloads over "fat" ones?
    options:
      - "They guarantee events always arrive in the exact order the producer emitted them"
      - "They remove the need for the consumer to be idempotent, since ids replace de-dup keys"
      - "They eliminate retries, because a callback fetch never has to be re-attempted"
      - "They avoid stale/oversized bodies and leak less data if a signature is bypassed"
    answer: 3
    explanation: |
      Thin payloads carry just ids, so the consumer fetches current state
      (never stale) and less sensitive data travels in the webhook. The cost is
      an extra round trip. They do not affect ordering or idempotency needs.
    ref: "concepts.md#anatomy-of-an-outbound-webhook-delivery"

  - id: webhooks-and-async-api-patterns-007
    difficulty: intermediate
    tags: [payload-design, body-size]
    question: |
      Why should a webhook avoid sending a very large body (e.g. a 50 MB export)
      directly?
    options:
      - "HTTP forbids request bodies larger than 1 MB, returning 413 above that limit"
      - "Large bodies cannot be signed with HMAC because SHA-256 caps input at 64 KB"
      - "Consumers commonly time out and disconnect on large bodies; send a reference/URL instead"
      - "The producer cannot retry large bodies, since retry buffers only hold small payloads"
    answer: 2
    explanation: |
      Webhook consumers should ack quickly; a huge body risks timeouts and
      disconnects. Send a small notification with a reference/URL the consumer
      fetches on its own schedule.
    ref: "concepts.md#anatomy-of-an-outbound-webhook-delivery"

  - id: webhooks-and-async-api-patterns-008
    difficulty: beginner
    tags: [subscriptions, registration]
    question: |
      When a consumer registers a webhook endpoint, what is typically returned
      exactly once and must be stored to verify future deliveries?
    options:
      - "A short-lived JWT access token that the consumer refreshes before each delivery"
      - "The endpoint's per-endpoint signing secret"
      - "A TLS client certificate the producer presents on every outbound connection"
      - "The consumer's public IP allowlist that the producer stores for source filtering"
    answer: 1
    explanation: |
      Registration returns a high-entropy per-endpoint signing secret, shown
      once. The consumer stores it and uses it to verify the HMAC signature on
      every future delivery.
    ref: "concepts.md#subscriptions-and-callback-url-registration"

  - id: webhooks-and-async-api-patterns-009
    difficulty: intermediate
    tags: [subscriptions, ssrf, security]
    question: |
      Accepting an arbitrary user-supplied callback URL introduces which OWASP
      API Security (2023) risk, and how do you mitigate it?
    options:
      - "Server Side Request Forgery (API7:2023); validate the URL is public HTTPS and block internal ranges at delivery time"
      - "Broken Object Level Authorization (API1:2023); mitigate with per-object ownership checks on every request"
      - "Mass Assignment (API6:2023); mitigate by strictly allowlisting the fields a caller may set"
      - "Security Misconfiguration (API8:2023); mitigate by disabling verbose error stack traces in responses"
    answer: 0
    explanation: |
      A registered URL your server calls can be pointed at internal services or
      cloud metadata — SSRF (API7:2023). Validate it is public HTTPS and block
      internal/link-local ranges, re-resolving DNS at delivery time.
    ref: "concepts.md#subscriptions-and-callback-url-registration"

  - id: webhooks-and-async-api-patterns-010
    difficulty: intermediate
    tags: [subscriptions, verification-handshake]
    question: |
      Why do many producers require a confirmation/challenge handshake before
      enabling a newly registered endpoint?
    options:
      - "To compress the payload by pre-negotiating a gzip dictionary with the endpoint"
      - "To negotiate which HMAC algorithm and key length both sides will use for signing"
      - "Because the 202 Accepted status code requires a prior challenge exchange to be valid"
      - "To prove the URL is controlled by whoever registered it, preventing abuse of your sender to flood a victim URL"
    answer: 3
    explanation: |
      A challenge/echo handshake proves the registrant controls the URL,
      stopping an attacker from registering someone else's URL and using your
      infrastructure to flood it with traffic.
    ref: "concepts.md#subscriptions-and-callback-url-registration"

  - id: webhooks-and-async-api-patterns-011
    difficulty: beginner
    tags: [delivery-guarantees, at-least-once]
    question: |
      What delivery guarantee do webhook systems realistically provide over
      HTTP?
    options:
      - "Exactly-once delivery, guaranteed by HTTP's built-in request de-duplication"
      - "At-most-once delivery, where the producer never retries after the first attempt"
      - "At-least-once delivery — the consumer may receive an event more than once"
      - "Ordered exactly-once delivery, with events sequenced strictly by their timestamps"
    answer: 2
    explanation: |
      HTTP offers no exactly-once. Producers retry until they see success, so a
      consumer may get the same event more than once. De-duplication is the
      consumer's responsibility.
    ref: "concepts.md#delivery-guarantees-and-at-least-once-semantics"

  - id: webhooks-and-async-api-patterns-012
    difficulty: intermediate
    tags: [status-codes, delivery]
    question: |
      A webhook consumer returns `400 Bad Request`. How should a well-behaved
      producer treat this?
    options:
      - "As transient — retry immediately with no delay until the consumer returns 2xx"
      - "As a permanent failure — most systems do not retry 4xx (except 429)"
      - "As success — a 4xx means the event was accepted but processing was deferred"
      - "By escalating to a WebSocket connection and re-sending the event over that channel"
    answer: 1
    explanation: |
      4xx generally indicates a client-side problem that retrying will not fix,
      so producers treat them as permanent and stop retrying. The notable
      exception is 429 (Too Many Requests), which means "slow down and retry".
    ref: "concepts.md#delivery-guarantees-and-at-least-once-semantics"

  - id: webhooks-and-async-api-patterns-013
    difficulty: intermediate
    tags: [status-codes, retries]
    question: |
      Which consumer response should a producer treat as *transient* and worth
      retrying with backoff?
    options:
      - "503 Service Unavailable or a connection timeout"
      - "401 Unauthorized, signalling the signing credentials must be regenerated first"
      - "404 Not Found, meaning the callback path was permanently removed by the consumer"
      - "410 Gone, indicating the endpoint was intentionally and permanently retired"
    answer: 0
    explanation: |
      5xx responses, timeouts, and connection errors are transient — the
      consumer may recover — so they warrant retry with backoff. 401/404/410 are
      permanent errors that retrying will not fix.
    ref: "concepts.md#delivery-guarantees-and-at-least-once-semantics"

  - id: webhooks-and-async-api-patterns-014
    difficulty: intermediate
    tags: [ordering, delivery]
    question: |
      Which statement about webhook event ordering is correct?
    options:
      - "Events are always delivered in the exact order they occurred at the producer"
      - "Ordering is guaranteed only for the subset of events that were retried after a 5xx"
      - "HTTP guarantees ordering because the underlying TCP byte stream is delivered in order"
      - "Ordering is not guaranteed; retries and parallel delivery can reorder events"
    answer: 3
    explanation: |
      Retries and concurrent delivery mean events can arrive out of order (e.g.
      order.shipped before order.created). If order matters, include a sequence
      number/timestamp or fetch current state rather than trusting order.
    ref: "concepts.md#delivery-guarantees-and-at-least-once-semantics"

  - id: webhooks-and-async-api-patterns-015
    difficulty: intermediate
    tags: [consumer-design, ack-fast]
    question: |
      A consumer does 20 seconds of heavy processing *before* returning its 2xx.
      What is the likely failure mode?
    options:
      - "The signature expires mid-processing, so the final verification step fails"
      - "The event is silently dropped by the TCP stack once the socket buffer fills"
      - "The producer times out and retries, causing duplicate deliveries and processing"
      - "The consumer's signing secret rotates automatically after the 20-second threshold"
    answer: 2
    explanation: |
      Slow acknowledgment causes the producer to time out and retry, so the same
      event gets delivered and processed again. The fix: durably enqueue the
      event, return 2xx immediately, then process asynchronously.
    ref: "concepts.md#delivery-guarantees-and-at-least-once-semantics"

  - id: webhooks-and-async-api-patterns-016
    difficulty: beginner
    tags: [retries, backoff]
    question: |
      What is "exponential backoff" in webhook retry scheduling?
    options:
      - "Retrying at a fixed 1-second interval forever until the consumer finally returns 2xx"
      - "Increasing the wait between retries exponentially (e.g. base * 2^attempt), capped at a maximum"
      - "Retrying exactly once after a brief pause, then giving up and dropping the event"
      - "Doubling the payload size on each retry so partial deliveries are eventually completed"
    answer: 1
    explanation: |
      Exponential backoff grows the delay between attempts (base * 2^attempt),
      usually capped, so a struggling consumer is not hammered and load spreads
      over time.
    ref: "concepts.md#retries-and-exponential-backoff"

  - id: webhooks-and-async-api-patterns-017
    difficulty: intermediate
    tags: [retries, jitter]
    question: |
      Why add *jitter* (randomness) to exponential-backoff retry delays?
    options:
      - "To spread out retries so many failed deliveries do not all retry at the same instant (thundering herd)"
      - "To make the delays longer on average so struggling consumers get more recovery time"
      - "To make signatures harder to forge by adding entropy to the signed timestamp value"
      - "Because RFC 9110 requires jitter on every retried idempotent HTTP request"
    answer: 0
    explanation: |
      Without jitter, many deliveries that failed together retry in lockstep,
      creating a thundering herd. Adding randomness (e.g. full jitter:
      random(0, backoff)) spreads the load.
    ref: "concepts.md#retries-and-exponential-backoff"

  - id: webhooks-and-async-api-patterns-018
    difficulty: intermediate
    tags: [retry-after, status-codes]
    question: |
      A consumer returns `429 Too Many Requests` with `Retry-After: 120`. What
      should the producer do?
    options:
      - "Ignore the Retry-After header and retry immediately with no delay at all"
      - "Stop retrying permanently and move the event straight to the dead-letter queue"
      - "Switch to polling the consumer's status endpoint instead of pushing the event"
      - "Wait about 120 seconds before the next attempt, honoring the header"
    answer: 3
    explanation: |
      Retry-After (RFC 9110 §10.2.3) tells the client how long to wait. On a 429
      the producer should honor it and delay the next retry accordingly instead
      of using its own schedule.
    ref: "concepts.md#retries-and-exponential-backoff"

  - id: webhooks-and-async-api-patterns-019
    difficulty: advanced
    tags: [retries, idempotency, duplicates]
    question: |
      Which statement about the relationship between retries and duplicates is
      correct?
    options:
      - "Automatic retries can coexist with a strict guarantee of exactly-once single delivery over plain HTTP"
      - "Duplicates only occur when HMAC signing is disabled, since a valid signature makes each delivery unique"
      - "Retries are the mechanism that turns at-least-once into duplicate deliveries, so retries require consumer de-duplication"
      - "Retries actually prevent duplicates by design, because each retry cancels and supersedes the prior attempt"
    answer: 2
    explanation: |
      You cannot have automatic retries and also guarantee single delivery — a
      retry after a lost success response duplicates the event. Retries and
      consumer idempotency are two halves of one design.
    ref: "concepts.md#retries-and-exponential-backoff"

  - id: webhooks-and-async-api-patterns-020
    difficulty: beginner
    tags: [signing, hmac]
    question: |
      What is the primary purpose of an HMAC signature on a webhook payload?
    options:
      - "To compress the body so large event payloads fit within the consumer's request size limit"
      - "To prove the request genuinely came from the producer and was not tampered with"
      - "To guarantee exactly-once delivery by letting the consumer reject any request whose HMAC repeats"
      - "To encrypt the payload end-to-end so intermediaries and proxies cannot read the event contents"
    answer: 1
    explanation: |
      A keyed HMAC (RFC 2104), typically HMAC-SHA256 over the body, authenticates
      the sender and verifies integrity — it proves the producer (holder of the
      secret) sent this exact payload. It is not encryption.
    ref: "concepts.md#signing-and-verifying-payloads-hmac"

  - id: webhooks-and-async-api-patterns-021
    difficulty: advanced
    tags: [signing, raw-body, gotcha]
    question: |
      A consumer intermittently fails signature verification even for legitimate
      events. The most likely cause is that it computes the HMAC over...
    options:
      - "a re-serialized version of the JSON, which changes whitespace/key order and breaks the digest"
      - "the raw request body bytes exactly as received, which is the one method that always verifies correctly"
      - "the signed timestamp header alone, omitting the body, so any payload change goes undetected"
      - "the response body it plans to return instead of the incoming request body the producer signed"
    answer: 0
    explanation: |
      Signatures must be computed over the exact raw bytes. Re-serializing JSON
      reorders keys or changes whitespace, producing a different digest —
      causing intermittent verification failures.
    ref: "concepts.md#signing-and-verifying-payloads-hmac"

  - id: webhooks-and-async-api-patterns-022
    difficulty: advanced
    tags: [signing, timing-attack]
    question: |
      Why should signature comparison use a constant-time comparison rather than
      a normal string equality (`==`)?
    options:
      - "Constant-time comparison runs strictly faster than early-exit equality on long signature strings"
      - "It is required to correctly compare signatures encoded with multi-byte Unicode characters"
      - "It reduces the payload size the producer must transmit for each signed delivery"
      - "Normal equality can leak the correct signature through timing differences"
    answer: 3
    explanation: |
      Early-exit string equality returns faster on the first mismatched byte,
      leaking information about how many leading bytes matched. A constant-time
      compare avoids this timing side channel.
    ref: "concepts.md#signing-and-verifying-payloads-hmac"

  - id: webhooks-and-async-api-patterns-023
    difficulty: intermediate
    tags: [signing, tls, security]
    question: |
      A colleague argues "we use HTTPS, so we don't need to sign webhooks." Why
      are they wrong?
    options:
      - "HTTPS adds too much handshake latency, so signing is used instead to keep webhook delivery fast"
      - "HTTPS cannot carry JSON request bodies, so a signature is needed to encode the event payload safely"
      - "TLS protects the transport but does not authenticate the sender — anyone who knows the URL can open a TLS connection and POST forged events"
      - "They are correct; the mutual TLS handshake already authenticates the producer, so signing is fully redundant"
    answer: 2
    explanation: |
      TLS encrypts and integrity-protects data in transit and authenticates the
      *server* to the client — but it does not tell the consumer that the caller
      is the legitimate producer. Anyone can POST to a public HTTPS URL, so you
      still need a signature.
    ref: "concepts.md#signing-and-verifying-payloads-hmac"

  - id: webhooks-and-async-api-patterns-024
    difficulty: advanced
    tags: [signing, asymmetric, trade-offs]
    question: |
      Compared with shared-secret HMAC, what is the key advantage of asymmetric
      webhook signatures (e.g. Ed25519/RSA or JWS)?
    options:
      - "They are always faster to compute than HMAC, since public-key math is cheaper than a hash"
      - "The producer signs with a private key and consumers verify with a public key, so no shared secret must be distributed to many parties"
      - "They eliminate the need for replay protection, because signed timestamps are unnecessary with asymmetric keys"
      - "They remove the need for HTTPS, since the asymmetric signature already encrypts the payload in transit"
    answer: 1
    explanation: |
      Asymmetric signing means consumers only hold a public key; there is no
      shared secret to leak, and consumers cannot forge events. The cost is more
      computational overhead and complexity.
    ref: "concepts.md#signing-and-verifying-payloads-hmac"

  - id: webhooks-and-async-api-patterns-025
    difficulty: beginner
    tags: [replay, security]
    question: |
      What attack does replay protection specifically defend against?
    options:
      - "An attacker re-sending a previously captured, validly signed request"
      - "An attacker brute-forcing the HMAC signing secret by observing many signed deliveries"
      - "A consumer processing an event too slowly and timing out before returning its 2xx acknowledgment"
      - "A producer sending events out of order after retrying some deliveries in parallel"
    answer: 0
    explanation: |
      A signature verifies authenticity but a captured signed request still
      verifies if re-sent. Replay protection stops an attacker (or a proxy) from
      replaying that valid request later.
    ref: "concepts.md#replay-protection-timestamps-and-nonces"

  - id: webhooks-and-async-api-patterns-026
    difficulty: intermediate
    tags: [replay, timestamp]
    question: |
      Why must the timestamp used for replay protection be *inside* the signed
      material rather than an unsigned header?
    options:
      - "To make the signature header shorter by folding the timestamp into the signed digest"
      - "Because RFC 8288 (Web Linking) mandates the timestamp be part of the signed material"
      - "To allow the consumer to skip the signature check whenever the timestamp is recent enough"
      - "So an attacker cannot rewrite the timestamp to a fresh value without knowing the secret"
    answer: 3
    explanation: |
      If the timestamp were unsigned, a replay attacker could just update it to
      "now" and pass the tolerance check. Signing the timestamp binds it to the
      HMAC so it cannot be forged.
    ref: "concepts.md#replay-protection-timestamps-and-nonces"

  - id: webhooks-and-async-api-patterns-027
    difficulty: intermediate
    tags: [replay, tolerance-window]
    question: |
      A webhook includes a signed timestamp. A common replay defense is to
      reject deliveries whose timestamp is outside a tolerance window (e.g. ±5
      minutes). What is the trade-off in choosing that window?
    options:
      - "Wider windows are always strictly better because they never reject any valid, legitimately delayed event"
      - "The window has no effect on security; it only tunes how verbose the consumer's delivery logs become"
      - "It must be wide enough for legitimate retries and clock skew, but narrow enough to limit replay exposure"
      - "Narrower windows increase replay risk, because a tight tolerance forces the consumer to accept older requests"
    answer: 2
    explanation: |
      Too narrow and legitimate delayed retries or clock-skewed deliveries get
      rejected; too wide and the replay window grows. The tolerance balances
      these, and nonces should be retained at least as long as the window.
    ref: "concepts.md#replay-protection-timestamps-and-nonces"

  - id: webhooks-and-async-api-patterns-028
    difficulty: intermediate
    tags: [replay, nonce, dedup]
    question: |
      Within the tolerance window, what additional mechanism closes the replay
      gap and doubles as idempotency support?
    options:
      - "Rotating the endpoint's TLS certificate on every delivery so captured requests fail verification"
      - "Recording each delivery's unique event id (nonce) and rejecting ids already seen"
      - "Switching the transport to WebSockets, which drops any duplicate frames automatically"
      - "Increasing the retry backoff interval so replayed requests fall outside the tolerance window"
    answer: 1
    explanation: |
      A timestamp window alone still allows replays within the window. Tracking
      the unique event id (nonce) and refusing duplicates closes that gap and is
      exactly the de-dup key used for consumer idempotency.
    ref: "concepts.md#replay-protection-timestamps-and-nonces"

  - id: webhooks-and-async-api-patterns-029
    difficulty: beginner
    tags: [idempotency, consumer]
    question: |
      What does it mean for a webhook consumer to be idempotent?
    options:
      - "Processing the same event twice has the same effect as processing it once"
      - "It never returns any error status codes, always replying 2xx to whatever the producer sends"
      - "It always responds to every delivery within a strict one-second processing deadline"
      - "It rejects all duplicate HTTP connections at the TCP layer before the body is ever read"
    answer: 0
    explanation: |
      Because delivery is at-least-once, the consumer must ensure re-processing
      an event produces no additional side effects — the same end state as
      processing it once.
    ref: "concepts.md#idempotent-webhook-consumers"

  - id: webhooks-and-async-api-patterns-030
    difficulty: intermediate
    tags: [idempotency, dedup-store]
    question: |
      What is the standard way to implement an idempotent webhook consumer?
    options:
      - "Reject any request that lacks a valid JWT access token in its Authorization header"
      - "Process every event immediately and simply hope that duplicate deliveries are rare enough to ignore"
      - "Return 500 on any event that looks like a duplicate so the producer keeps retrying until it succeeds"
      - "Record the stable event id with a uniqueness constraint; if the id is new, process, otherwise return 2xx and do nothing"
    answer: 3
    explanation: |
      De-dup on the event id using a uniqueness constraint. New id → process and
      commit; existing id → acknowledge with 2xx as a no-op. The id-insert should
      guard or share a transaction with the side effect.
    ref: "concepts.md#idempotent-webhook-consumers"

  - id: webhooks-and-async-api-patterns-031
    difficulty: advanced
    tags: [idempotency, status-codes, gotcha]
    question: |
      Why should an idempotent consumer return `2xx` (not an error) when it
      receives a duplicate event it has already processed?
    options:
      - "Because a 2xx status body compresses better on the wire than a 4xx or 5xx error body"
      - "Because duplicate deliveries are always malicious replays and must be flagged to a security team"
      - "Returning 409/500 on a duplicate makes the producer retry forever, amplifying the problem"
      - "Because RFC 9457 Problem Details explicitly forbids returning any 4xx status on a duplicate event"
    answer: 2
    explanation: |
      From the producer's view, an error means "not delivered — retry". If a
      duplicate returns an error, the producer keeps retrying indefinitely.
      Acknowledging with 2xx (a no-op) stops the retries.
    ref: "concepts.md#idempotent-webhook-consumers"

  - id: webhooks-and-async-api-patterns-032
    difficulty: advanced
    tags: [idempotency, out-of-order]
    question: |
      To handle duplicates *and* out-of-order delivery robustly, which style of
      operation is preferable in a consumer?
    options:
      - "Delta operations like 'increment the account balance by 1' applied once per received event"
      - "Order-independent operations like 'set state to the value carried in the event, keyed by resource id and version'"
      - "Operations that assume events always arrive exactly once and in strict emission order"
      - "Operations that ignore the event id entirely and derive their own key from the arrival timestamp"
    answer: 1
    explanation: |
      Deltas (increment) break under duplicates and reordering. Setting absolute
      state from the event, keyed by resource id and a version/timestamp, is
      order-independent and duplicate-safe.
    ref: "concepts.md#idempotent-webhook-consumers"

  - id: webhooks-and-async-api-patterns-033
    difficulty: advanced
    tags: [idempotency, transaction, gotcha]
    question: |
      A consumer records the event id first, then performs the DB side effect in
      a separate step, and crashes in between. What is the failure?
    options:
      - "The id is marked processed but the side effect never happened, so a retry is de-duped away and the event is effectively lost"
      - "Nothing goes wrong — recording the id first is enough to make the whole consumer safe"
      - "The producer will never retry, because recording the id sends an implicit acknowledgment back"
      - "The stored HMAC signature becomes invalid, so the next delivery for that resource fails verification"
    answer: 0
    explanation: |
      If de-dup is not atomic with the effect, you can 'remember' an event that
      was never actually processed; the retry then gets de-duped and the work is
      lost. Wrap the effect and id-insert in one transaction (or use the effect's
      natural idempotency).
    ref: "concepts.md#idempotent-webhook-consumers"

  - id: webhooks-and-async-api-patterns-034
    difficulty: beginner
    tags: [202-accepted, status-codes]
    question: |
      A POST kicks off a long-running job that cannot finish within the request.
      Which status code best signals "accepted for processing, not yet
      complete"?
    options:
      - "200 OK"
      - "201 Created"
      - "204 No Content"
      - "202 Accepted"
    answer: 3
    explanation: |
      202 Accepted (RFC 9110 §15.3.3) means the request was accepted but
      processing is not complete. 200 implies a completed synchronous op and 201
      implies a resource was created synchronously.
    ref: "concepts.md#202-accepted-and-the-polling--status-resource-pattern"

  - id: webhooks-and-async-api-patterns-035
    difficulty: intermediate
    tags: [202-accepted, status-resource, location]
    question: |
      After returning `202 Accepted`, what does a well-designed API typically
      include so the client can track progress?
    options:
      - "A `WebSocket` upgrade header so the client can stream progress over the same connection"
      - "The final completed result embedded inline in the 202 response body, ready to use immediately"
      - "A `Location` header pointing to a pollable status resource, often with `Retry-After`"
      - "An HMAC signature of the job payload so the client can verify the work started authentically"
    answer: 2
    explanation: |
      The 202 hands back a status resource URL (via Location) that the client
      polls; the status resource reports pending/running/succeeded/failed and can
      include Retry-After to pace polling.
    ref: "concepts.md#202-accepted-and-the-polling--status-resource-pattern"

  - id: webhooks-and-async-api-patterns-036
    difficulty: intermediate
    tags: [202-accepted, retry-after, polling]
    question: |
      A status resource returns `200 OK` with `Retry-After: 5` and
      `{"status":"running"}`. What is `Retry-After` communicating here?
    options:
      - "The job has failed and the server will automatically retry the operation in 5 seconds"
      - "A hint that the client should poll again in about 5 seconds"
      - "The signature on the status response expires in 5 seconds and must be re-fetched"
      - "The client has been rate-limited and is blocked from all further requests for 5 seconds"
    answer: 1
    explanation: |
      On a status resource, Retry-After hints how long to wait before polling
      again, pacing clients and avoiding stampedes. It is not an error or
      rate-limit signal here.
    ref: "concepts.md#202-accepted-and-the-polling--status-resource-pattern"

  - id: webhooks-and-async-api-patterns-037
    difficulty: intermediate
    tags: [202-accepted, problem-details, rfc9457]
    question: |
      When an async job fails, how should the status resource describe the
      failure per modern standards?
    options:
      - "An RFC 9457 Problem Details object (type, title, status, detail)"
      - "An opaque `\"failed\"` string in the body with no type, title, or detail fields"
      - "An RFC 7807 object, which is the current standard"
      - "A bare HTTP 500 response carrying no body and no structured error fields"
    answer: 0
    explanation: |
      RFC 9457 (2023) Problem Details is the current standard and obsoletes RFC
      7807. Returning a structured type/title/status/detail is far more useful
      than an opaque status string.
    ref: "concepts.md#202-accepted-and-the-polling--status-resource-pattern"

  - id: webhooks-and-async-api-patterns-038
    difficulty: intermediate
    tags: [async-reply, callback-url]
    question: |
      In the callback-URL variant of async request-reply, how does the client
      receive the result?
    options:
      - "By repeatedly polling a server-assigned status resource until its state flips to completed"
      - "Over a WebSocket the server dials back and opens to the client once the job finishes"
      - "The finished result is embedded inline in the original 202 response body, ready immediately"
      - "The client includes a URL in the request, and the server POSTs the result there when done"
    answer: 3
    explanation: |
      With a callback URL, the client supplies a URL in the request and the
      server pushes the result to it on completion — effectively a one-shot,
      per-request webhook.
    ref: "concepts.md#async-request-reply-and-callback-urls"

  - id: webhooks-and-async-api-patterns-039
    difficulty: intermediate
    tags: [async-reply, comparison]
    question: |
      For an async operation, when is polling a status resource preferable to a
      callback URL?
    options:
      - "When you want the lowest possible latency and the result pushed the instant the job finishes"
      - "When you want to avoid making any HTTP requests at all after the initial submission call"
      - "When the client cannot run a reachable server (e.g. a browser or CLI behind NAT)"
      - "When the operation completes instantly and no asynchronous status tracking is ever required"
    answer: 2
    explanation: |
      Polling needs no server on the client side and works behind firewalls/NAT,
      making it ideal for browsers, CLIs, and constrained clients. Callbacks give
      lower latency but require the client to be reachable.
    ref: "concepts.md#async-request-reply-and-callback-urls"

  - id: webhooks-and-async-api-patterns-040
    difficulty: advanced
    tags: [async-reply, callback-url, security]
    question: |
      Which statement about callback URLs is correct?
    options:
      - "They carry no security burden at all, because the client itself chose and vouches for the URL"
      - "They carry the same security burden as any webhook: validate the URL (SSRF), sign the callback, and treat delivery as at-least-once"
      - "They guarantee exactly-once delivery, since the client-supplied URL is contacted only a single time"
      - "They must always use plain HTTP so the client's local listener can parse them without TLS setup"
    answer: 1
    explanation: |
      A callback URL is a webhook: it is an SSRF vector, needs signing so the
      client can trust it, and is subject to the same at-least-once retry
      semantics as any other outbound delivery.
    ref: "concepts.md#async-request-reply-and-callback-urls"

  - id: webhooks-and-async-api-patterns-041
    difficulty: beginner
    tags: [sse, comparison]
    question: |
      Server-Sent Events (SSE) are best described as...
    options:
      - "A one-way server-to-client stream over a long-lived HTTP response (text/event-stream) with automatic reconnect"
      - "A full-duplex protocol that upgrades the TCP connection so client and server exchange binary frames both ways"
      - "A polling loop that fires on a fixed timer, re-issuing the same GET request at a constant interval"
      - "An outbound POST the server delivers to a callback URL the consumer registered in advance"
    answer: 0
    explanation: |
      SSE keeps one HTTP response open and streams events server→client
      (text/event-stream). It is unidirectional, browser-friendly, and
      auto-reconnects, carrying Last-Event-ID to resume.
    ref: "concepts.md#webhooks-vs-polling-vs-sse-vs-websockets"

  - id: webhooks-and-async-api-patterns-042
    difficulty: intermediate
    tags: [websockets, comparison]
    question: |
      Which scenario most justifies WebSockets over webhooks, SSE, or polling?
    options:
      - "A backend integration that receives occasional order events a handful of times per day"
      - "A CLI that checks on a long-running report every few seconds until the job finishes"
      - "A server firing one-way notifications at another server's publicly reachable HTTPS endpoint"
      - "Low-latency bidirectional communication such as chat or collaborative editing"
    answer: 3
    explanation: |
      WebSockets provide a persistent full-duplex connection, ideal for
      low-latency two-way traffic (chat, collaboration, games). The other cases
      are better served by webhooks, polling, or SSE.
    ref: "concepts.md#webhooks-vs-polling-vs-sse-vs-websockets"

  - id: webhooks-and-async-api-patterns-043
    difficulty: intermediate
    tags: [sse, websockets, direction]
    question: |
      What fundamentally distinguishes webhooks from SSE and WebSockets in terms
      of who initiates the connection?
    options:
      - "All three identically require the client to be the party that opens the underlying connection"
      - "Webhooks and SSE are effectively identical in connection direction; only WebSockets differ from them"
      - "Webhooks push to a consumer-run server; SSE/WebSockets push over a persistent connection the client opened"
      - "SSE, like webhooks, requires the consumer to expose a public URL for the server to POST toward"
    answer: 2
    explanation: |
      Webhooks require the recipient to expose a reachable server. SSE and
      WebSockets flow over a connection the client initiates, so they work even
      when the client cannot host a public URL.
    ref: "concepts.md#webhooks-vs-polling-vs-sse-vs-websockets"

  - id: webhooks-and-async-api-patterns-044
    difficulty: intermediate
    tags: [sse, reconnect, last-event-id]
    question: |
      Which built-in SSE feature helps a client resume a stream after a dropped
      connection?
    options:
      - "The `Idempotency-Key` request header, which the client re-sends to replay missed events"
      - "The `Last-Event-ID` mechanism, which the client sends to resume from where it left off"
      - "A 202 Accepted response that hands back a status URL the client polls to catch up"
      - "An HMAC signature header whose sequence field lets the client request skipped events"
    answer: 1
    explanation: |
      SSE clients automatically reconnect and send Last-Event-ID so the server
      can replay events since the last one received — a built-in resume feature
      of the protocol.
    ref: "concepts.md#webhooks-vs-polling-vs-sse-vs-websockets"

  - id: webhooks-and-async-api-patterns-045
    difficulty: intermediate
    tags: [comparison, decision]
    question: |
      An integrator's server needs to receive event notifications from your SaaS
      as they happen, and it can expose a public HTTPS endpoint. Which mechanism
      is the natural fit?
    options:
      - "Outbound webhooks"
      - "Polling every second"
      - "WebSockets"
      - "SSE from the integrator to your SaaS"
    answer: 0
    explanation: |
      Server-to-server, event-driven, recipient can host a URL → webhooks. They
      give near-real-time push without wasted polling and without a persistent
      connection.
    ref: "concepts.md#webhooks-vs-polling-vs-sse-vs-websockets"

  - id: webhooks-and-async-api-patterns-046
    difficulty: beginner
    tags: [dead-letter, dlq]
    question: |
      What happens to a webhook event that fails delivery past its maximum retry
      attempts in a mature system?
    options:
      - "It is silently discarded and dropped from the system with no record kept anywhere"
      - "It is retried forever at the same interval, with no maximum attempt limit ever applied"
      - "It is automatically converted into an SSE stream the consumer must connect to and drain"
      - "It is moved to a dead-letter queue (DLQ) for inspection, alerting, and possible redelivery"
    answer: 3
    explanation: |
      Once retries are exhausted, the event goes to a DLQ — durable storage of
      undeliverable events with payload, headers, and failure reason — so events
      are not lost and can be inspected or replayed.
    ref: "concepts.md#dead-letter-handling-and-delivery-observability"

  - id: webhooks-and-async-api-patterns-047
    difficulty: advanced
    tags: [dead-letter, silent-loss]
    question: |
      Why is pairing retries with a dead-letter path essential?
    options:
      - "It makes each retry attempt complete faster by shrinking the backoff interval between them"
      - "It removes the need for HMAC signing, since dead-lettered events are trusted by the operator"
      - "Without a DLQ, exhausting retries during a consumer outage means silent, permanent event loss"
      - "It upgrades delivery to an exactly-once guarantee by tracking each event through the queue"
    answer: 2
    explanation: |
      Retries alone give up eventually; without a DLQ those events vanish. The
      DLQ plus redelivery is what makes 'at-least-once' actually mean
      'eventually delivered'.
    ref: "concepts.md#dead-letter-handling-and-delivery-observability"

  - id: webhooks-and-async-api-patterns-048
    difficulty: intermediate
    tags: [observability, redelivery]
    question: |
      When a producer redelivers an event from the DLQ after the consumer fixed
      its endpoint, why does it reuse the original event id?
    options:
      - "To make the redelivered payload smaller by omitting fields the consumer has already stored"
      - "So idempotent consumers can de-dup correctly if the event was partially processed before"
      - "To let the redelivery bypass signature verification on the consumer's fast-path handler"
      - "Because HTTP forbids assigning a fresh identifier to any request that has been retried before"
    answer: 1
    explanation: |
      Reusing the original id lets an idempotent consumer recognize the event and
      avoid double-processing, keeping redelivery safe.
    ref: "concepts.md#dead-letter-handling-and-delivery-observability"

  - id: webhooks-and-async-api-patterns-049
    difficulty: intermediate
    tags: [observability, endpoint-disabling]
    question: |
      A consumer endpoint has returned errors continuously for several days.
      What is a reasonable producer behavior?
    options:
      - "Auto-disable the endpoint and notify its owner rather than retrying a dead URL indefinitely"
      - "Keep retrying that URL forever at the full delivery rate until the endpoint eventually recovers"
      - "Permanently delete every past and pending event queued for that subscriber to reclaim storage"
      - "Silently switch the subscriber over to a WebSocket transport without notifying its owner"
    answer: 0
    explanation: |
      Continuous long-term failure signals a dead endpoint. Mature systems
      auto-disable it and notify the owner, avoiding wasted retries, then let the
      owner re-enable and redeliver.
    ref: "concepts.md#dead-letter-handling-and-delivery-observability"

  - id: webhooks-and-async-api-patterns-050
    difficulty: intermediate
    tags: [observability, metrics]
    question: |
      Which set of signals best indicates a webhook delivery system is degrading?
    options:
      - "Lower CPU usage on the producer fleet, indicating fewer deliveries are being attempted"
      - "A gradual decrease in the total number of endpoints registered by active subscribers"
      - "Smaller average payload sizes across deliveries as producers trim redundant event fields"
      - "Rising DLQ depth, falling delivery success rate, and increasing retry rate"
    answer: 3
    explanation: |
      Delivery success rate, retry rate, DLQ depth, and delivery latency are the
      core health metrics. A growing DLQ and falling success rate are direct
      signs something is broken.
    ref: "concepts.md#dead-letter-handling-and-delivery-observability"

  - id: webhooks-and-async-api-patterns-051
    difficulty: advanced
    tags: [signing, secret-rotation]
    question: |
      How can a producer rotate a webhook signing secret without breaking
      verification for consumers mid-rollover?
    options:
      - "Delete the old secret immediately at cutover and hope every consumer updates before the next delivery"
      - "Disable signature verification entirely for the duration of the rotation, then re-enable it afterward"
      - "Emit (or accept) multiple signatures during an overlap window so a consumer can verify with either the old or new secret"
      - "Switch deliveries to plain HTTP temporarily so signature mismatches cannot block any events"
    answer: 2
    explanation: |
      Dual-secret rotation sends multiple signatures (e.g. v1,<sigA> v1,<sigB>)
      during an overlap window, so consumers accept either secret until the old
      one is retired — no downtime.
    ref: "concepts.md#signing-and-verifying-payloads-hmac"

  - id: webhooks-and-async-api-patterns-052
    difficulty: intermediate
    tags: [subscriptions, https, security]
    question: |
      Why should a webhook management API reject callback URLs that use
      `http://`?
    options:
      - "Plain HTTP is measurably slower per request because it skips connection reuse optimizations"
      - "Unencrypted webhooks leak payloads in transit and are trivially spoofable"
      - "HTTP without TLS cannot carry a JSON request body, only form-encoded key-value pairs"
      - "RFC 8288 explicitly forbids http:// URLs from appearing in any webhook callback registration"
    answer: 1
    explanation: |
      An http:// callback exposes potentially sensitive payloads on the wire and
      offers no transport authentication of the server, so producers require
      HTTPS-only endpoints.
    ref: "concepts.md#subscriptions-and-callback-url-registration"

  - id: webhooks-and-async-api-patterns-053
    difficulty: advanced
    tags: [rfc, standards]
    question: |
      Which RFC defines the `202 Accepted` status and the `Retry-After` header
      semantics used throughout async HTTP patterns?
    options:
      - "RFC 9110 (HTTP Semantics)"
      - "RFC 7807 (Problem Details for HTTP APIs)"
      - "RFC 8288 (Web Linking)"
      - "RFC 2104 (HMAC)"
    answer: 0
    explanation: |
      RFC 9110 (HTTP Semantics, 2022) consolidates HTTP status codes including
      202 Accepted (§15.3.3) and header semantics like Retry-After (§10.2.3). RFC
      9457 handles Problem Details; RFC 8288 handles Link; RFC 2104 defines HMAC.
    ref: "concepts.md#202-accepted-and-the-polling--status-resource-pattern"

  - id: webhooks-and-async-api-patterns-054
    difficulty: intermediate
    tags: [idempotency-key, retries]
    question: |
      Why do many producers send the *same* idempotency key / event id on every
      retry of a given event?
    options:
      - "To force the consumer to reprocess the event from scratch on every single retry attempt"
      - "To rotate the signing secret in step with each retry so a leaked key expires quickly"
      - "To deliberately increase delivery latency so struggling consumers get extra recovery time"
      - "So the consumer can recognize a retry as the same event rather than a new one, enabling de-duplication"
    answer: 3
    explanation: |
      Keeping the id stable across retries lets an idempotent consumer identify
      'this is the same event I already saw' and de-dup, instead of treating each
      retry as a distinct event.
    ref: "concepts.md#retries-and-exponential-backoff"

  - id: webhooks-and-async-api-patterns-055
    difficulty: advanced
    tags: [rfc, web-linking]
    question: |
      A completed async job's status resource points to its result via a `Link`
      header. Which RFC standardizes the `Link` header and its relation types?
    options:
      - "RFC 9457 (Problem Details)"
      - "RFC 7519 (JWT)"
      - "RFC 8288 (Web Linking)"
      - "RFC 6234 (SHA)"
    answer: 2
    explanation: |
      RFC 8288 (Web Linking) defines the Link header and registered relation
      types, letting a status resource reference its result (or use 303 See
      Other). RFC 9457 is Problem Details; 7519 is JWT; 6234 is SHA.
    ref: "concepts.md#202-accepted-and-the-polling--status-resource-pattern"

  - id: webhooks-and-async-api-patterns-056
    difficulty: beginner
    tags: [async-reply, both-patterns]
    question: |
      A robust API for a long-running upload is described as returning `202` with
      a status URL *and* accepting an optional `callbackUrl`. Why support both?
    options:
      - "To confuse attackers by hiding which of the two response paths any given client will actually follow"
      - "So simple clients (browsers/CLIs) can poll while advanced server-to-server clients get pushed results"
      - "Because the HTTP spec requires every long-running POST to expose both a polling and a push response path"
      - "To avoid needing idempotency, because supporting both paths lets the server skip de-duplicating retries"
    answer: 1
    explanation: |
      Offering both lets constrained clients that cannot host a server poll the
      status resource, while integrations that can receive a callback get
      low-latency push — covering the full range of consumers.
    ref: "concepts.md#async-request-reply-and-callback-urls"

  - id: webhooks-and-async-api-patterns-057
    difficulty: advanced
    tags: [cloudevents, envelope, standards]
    question: |
      Which set of attributes are the REQUIRED context attributes on every
      CloudEvents 1.0 event?
    options:
      - "`id`, `source`, `specversion`, `type`"
      - "`id`, `time`, `subject`, `data`"
      - "`type`, `datacontenttype`, `dataschema`, `subject`"
      - "`id`, `source`, `time`, `data`"
    answer: 0
    explanation: |
      CloudEvents 1.0 mandates exactly four context attributes: `id`, `source`,
      `specversion` (`"1.0"`), and `type`. `subject`, `time`, `datacontenttype`,
      `dataschema`, and `data` are all OPTIONAL.
    ref: "concepts.md#the-cloudevents-standard"

  - id: webhooks-and-async-api-patterns-058
    difficulty: expert
    tags: [cloudevents, http-binding, kafka, scenario]
    question: |
      You are building a high-volume webhook gateway backed by Kafka. You want
      edge infrastructure to route and filter events on their `type` and `source`
      without deserializing potentially large/binary payloads. Which CloudEvents
      HTTP content mode fits best, and why?
    options:
      - "Structured mode, because putting everything in one JSON body is the only way the gateway can filter events by their `type` at all"
      - "Binary mode, because context attributes become `ce-*` headers while `data` stays the untouched HTTP body — routable without parsing"
      - "Batch mode, because it is the only CloudEvents mode whose framing is compatible with Kafka topic partitioning and consumer groups"
      - "Structured mode, because the binary content mode drops the `type` attribute entirely and cannot be used for any routing decision"
    answer: 1
    explanation: |
      Binary mode maps each context attribute to a `ce-<attr>` header (`ce-type`,
      `ce-source`, ...) and leaves `data` as the raw body with its own
      Content-Type. Infrastructure can route/filter on headers without touching
      the payload — efficient at high volume. Structured mode wraps everything in
      `application/cloudevents+json`, forcing a body parse to read attributes.
    ref: "concepts.md#the-cloudevents-standard"

  - id: webhooks-and-async-api-patterns-059
    difficulty: advanced
    tags: [cloudevents, structured-mode, content-type]
    question: |
      An event is delivered in CloudEvents structured mode over HTTP. Which
      `Content-Type` and body arrangement is correct?
    options:
      - "`application/json`, with the context attributes split out into individual `ce-*` request headers alongside the body"
      - "`application/cloudevents+json`, with attributes and `data` together in one JSON document"
      - "`application/cloudevents-batch+json`, carrying a single standalone event object rather than an array"
      - "`text/event-stream`, with each context attribute emitted as its own separate named SSE field line"
    answer: 1
    explanation: |
      Structured mode places the whole event — context attributes and `data` — in
      a single JSON document with `Content-Type: application/cloudevents+json`.
      The `ce-*` header split is binary mode; `...-batch+json` is for an array of
      events; `text/event-stream` is SSE, unrelated.
    ref: "concepts.md#the-cloudevents-standard"

  - id: webhooks-and-async-api-patterns-060
    difficulty: expert
    tags: [standard-webhooks, signing, signed-content]
    question: |
      Under the Standard Webhooks spec, what exact content is fed into the
      HMAC-SHA256 to produce the `v1` signature?
    options:
      - "The raw request body only, with the id and timestamp deliberately excluded so the digest stays stable across retries"
      - "`timestamp.payload` — just the timestamp and raw body joined by a dot, with the message id left out of the signed string"
      - "`msg_id.timestamp.payload` — the message id, timestamp, and raw body joined by dots"
      - "A JSON object `{id, timestamp, body}` re-serialized canonically with keys sorted before it is fed to HMAC-SHA256"
    answer: 2
    explanation: |
      Standard Webhooks signs the string `msg_id.timestamp.payload` (dot-
      delimited). Binding the id and timestamp into the signed content gives
      integrity over the id and built-in replay protection via the timestamp.
    ref: "concepts.md#the-standard-webhooks-specification"

  - id: webhooks-and-async-api-patterns-061
    difficulty: expert
    tags: [standard-webhooks, asymmetric, ed25519, scenario]
    question: |
      A platform distributes webhooks to thousands of independent, mutually
      distrusting third-party consumers. A security reviewer objects to a shared
      symmetric HMAC secret. Which Standard Webhooks mechanism addresses the
      objection, and what is the core reason?
    options:
      - "Use the `v1a` Ed25519 asymmetric scheme: consumers get only a public key (`whpk_`) and can verify but never forge events"
      - "Use a longer `whsec_` symmetric secret (64 bytes) so the shared key is far too large for any consumer to brute-force offline"
      - "Rotate the shared symmetric secret daily so that a leak by any one consumer only lets it forge events for a single day"
      - "Switch to structured CloudEvents mode, whose `application/cloudevents+json` envelope authenticates the true sender of each event"
    answer: 0
    explanation: |
      With a shared symmetric secret, every consumer that holds it can forge
      valid signatures. The `v1a` variant uses Ed25519: the producer signs with a
      private key (`whsk_`) and each consumer verifies with the public key
      (`whpk_`), so no consumer can forge. Longer secrets, rotation, and content
      modes do not remove the shared-secret forgery risk.
    ref: "concepts.md#the-standard-webhooks-specification"

  - id: webhooks-and-async-api-patterns-062
    difficulty: advanced
    tags: [standard-webhooks, rotation, multi-signature]
    question: |
      How does the Standard Webhooks signature header format enable zero-downtime
      secret rotation?
    options:
      - "It embeds a per-secret expiry timestamp in the header so the old secret automatically disables itself once the new one is issued"
      - "It allows a space-delimited list of signatures (e.g. `v1,<sigA> v1,<sigB>`) so a consumer accepts either the old or new secret during overlap"
      - "It encrypts the new secret inside the signature header itself so the consumer can decrypt and adopt it on the next delivery"
      - "It forces the consumer to re-register its endpoint after every rotation so the producer can hand back a freshly minted secret"
    answer: 1
    explanation: |
      Standard Webhooks permits multiple space-delimited signatures in one
      header. During rotation the producer signs with both the old and new
      secrets; the consumer verifies against either, so neither side has downtime
      while secrets are swapped.
    ref: "concepts.md#the-standard-webhooks-specification"

  - id: webhooks-and-async-api-patterns-063
    difficulty: advanced
    tags: [standard-webhooks, per-endpoint-keys, security]
    question: |
      The Standard Webhooks spec insists signing keys be unique per endpoint.
      Reusing one secret across many customers is called a vulnerability
      primarily because...
    options:
      - "it makes the combined signature header too long for many HTTP servers to accept and transmit reliably"
      - "HMAC-SHA256 becomes cryptographically weaker whenever a single key is reused to sign more than one distinct payload type"
      - "a leak of the shared secret by any one customer lets them forge events destined for every other customer"
      - "unique per-endpoint keys are a hard prerequisite for the TLS handshake to complete on the callback connection"
    answer: 2
    explanation: |
      A per-endpoint (per-customer) secret contains the blast radius: if one
      customer leaks or is compromised, only their own endpoint is affected. A
      shared secret means one leak lets that party forge valid events for all
      other consumers.
    ref: "concepts.md#the-standard-webhooks-specification"

  - id: webhooks-and-async-api-patterns-064
    difficulty: advanced
    tags: [verification-handshake, challenge-response, scenario]
    question: |
      A provider's docs say: on subscription it will `GET` your callback with
      `?hub.challenge=<token>` and your endpoint must return the exact token as
      the response body before the subscription activates. This pattern exists
      chiefly to...
    options:
      - "negotiate, before any events flow, which compression algorithm the provider will use for all future deliveries"
      - "prove the endpoint is live and controlled by the registrant, preventing subscription of a victim's URL"
      - "hand the HMAC signing secret to the endpoint securely by echoing it back inside the challenge token response"
      - "measure the callback endpoint's round-trip latency so the provider can pick an appropriate per-endpoint rate limit"
    answer: 1
    explanation: |
      The challenge-echo handshake (Meta `hub.challenge`, Slack `url_verification`,
      Twitch `webhook_callback_verification`) confirms the registrant actually
      controls the URL, blocking use of the provider's fleet to flood an
      arbitrary victim endpoint. It does not exchange secrets or negotiate
      encoding.
    ref: "concepts.md#subscription-verification-handshakes"

  - id: webhooks-and-async-api-patterns-065
    difficulty: expert
    tags: [websub, lease-seconds, subscriptions]
    question: |
      In WebSub (W3C, formerly PubSubHubbub), a hub confirms a subscription by
      requesting the callback with `hub.mode`, `hub.topic`, a `hub.challenge` to
      echo, and `hub.lease_seconds`. What does `hub.lease_seconds` imply about the
      subscription?
    options:
      - "The subscription becomes permanent the moment the challenge is echoed and never has to be renewed by the subscriber"
      - "The subscription is leased and expires after that many seconds unless renewed"
      - "It is the maximum size in bytes that any single future event payload delivered on this subscription may reach"
      - "It is the total number of seconds the hub will keep retrying one failed delivery before giving up on it"
    answer: 1
    explanation: |
      WebSub subscriptions are time-bounded leases. `hub.lease_seconds` tells the
      subscriber when the subscription will expire; the subscriber must
      re-subscribe (renew) before then to keep receiving events. It is unrelated
      to payload size or retry duration.
    ref: "concepts.md#subscription-verification-handshakes"

  - id: webhooks-and-async-api-patterns-066
    difficulty: expert
    tags: [fan-out, thundering-herd, scaling, scenario]
    question: |
      One popular event must fan out to ~1,000,000 subscribers, and you must keep
      p99 delivery latency bounded without melting your egress fleet. Which
      combination of techniques directly addresses the fan-out thundering herd?
    options:
      - "Send all one million deliveries synchronously in a single tight loop so the whole fan-out finishes in the shortest wall-clock time"
      - "Jittered dispatch scheduling, per-endpoint token-bucket rate limits, and sharded/partitioned delivery queues with backpressure"
      - "Increase the HMAC signing key length and switch every delivery to structured CloudEvents mode to shrink the egress footprint"
      - "Disable retries entirely so undelivered events are dropped and the fan-out queue drains as fast as physically possible"
    answer: 1
    explanation: |
      Fan-out bursts are tamed by spreading dispatch over time (jitter), capping
      per-destination throughput (token buckets), isolating slow consumers via
      sharded/partitioned queues to avoid head-of-line blocking, and applying
      backpressure. Tight synchronous loops make the herd worse; key length and
      content mode are irrelevant; disabling retries loses events.
    ref: "concepts.md#fan-out-ordering-and-consumer-scaling"

  - id: webhooks-and-async-api-patterns-067
    difficulty: advanced
    tags: [retry-storm, outage-recovery, scaling]
    question: |
      A very widely-used consumer endpoint recovers after a multi-hour outage.
      What secondary failure should the producer's delivery system anticipate,
      and how is it mitigated?
    options:
      - "A signature-verification storm as buffered HMAC checks all run at once; mitigate by disabling signing until the backlog clears"
      - "A retry storm as every producer's accumulated retries fire at once; mitigate with jitter, per-endpoint concurrency caps, and staggered DLQ redelivery"
      - "A DNS-rebinding attack against the recovered host; mitigate by caching the endpoint's resolved DNS answer forever"
      - "A replay attack using requests captured during the outage; mitigate by widening the signed-timestamp tolerance window"
    answer: 1
    explanation: |
      When a popular endpoint comes back, the backlog of retries across all
      producers can stampede the just-recovered service (a reverse thundering
      herd). Jitter, capped per-endpoint concurrency, and staggered redelivery
      spread that load. It is not a signing, DNS, or replay problem.
    ref: "concepts.md#fan-out-ordering-and-consumer-scaling"

  - id: webhooks-and-async-api-patterns-068
    difficulty: expert
    tags: [ordering, sequencing, contract, scenario]
    question: |
      A customer complains that out-of-order webhook events corrupt their ledger.
      You want the cheapest robust contract-level fix that cannot be broken by
      reordering or duplicates. Which do you propose first?
    options:
      - "Guarantee a single global total ordering of all events across every subscriber, sequenced by a producer-assigned counter"
      - "Send thin payloads and have the consumer fetch authoritative current state from the API, treating the event as a hint"
      - "Increase the retry backoff intervals so events spread out over time and their delivery windows rarely overlap"
      - "Switch the delivery transport to WebSockets, whose ordered TCP frames preserve the producer's original event order"
    answer: 1
    explanation: |
      Thin payload + fetch-current-state makes ordering irrelevant: the event
      only signals "something changed," and the consumer reads the authoritative
      state, so reordering/duplication cannot corrupt the ledger. Global total
      ordering is enormously expensive; backoff does not guarantee order; changing
      transport does not fix producer-side reordering/retries.
    ref: "concepts.md#fan-out-ordering-and-consumer-scaling"

  - id: webhooks-and-async-api-patterns-069
    difficulty: advanced
    tags: [ordering, partition-key, kafka]
    question: |
      A customer needs ordered delivery, but global ordering is too expensive.
      What is the standard scoped guarantee to offer instead?
    options:
      - "Order only within a partition key (e.g. per resource/aggregate id), Kafka-style, never globally"
      - "Order guaranteed only for the events that were redelivered after a 5xx, since retries pass through the sequencer"
      - "Order guaranteed only when each event payload stays under the 1 KB threshold that fits in a single frame"
      - "Order guaranteed only for deliveries carried over multiplexed HTTP/2 connections rather than HTTP/1.1"
    answer: 0
    explanation: |
      Per-key (per-aggregate) ordering routes all events for a given resource to
      one partition and delivers them in order, while different keys stay
      independent and parallel — far cheaper than a global total order and usually
      all a consumer actually needs.
    ref: "concepts.md#fan-out-ordering-and-consumer-scaling"

  - id: webhooks-and-async-api-patterns-070
    difficulty: expert
    tags: [outbox, dual-write, producer-reliability, scenario]
    question: |
      Your service updates the orders table and then publishes an `order.created`
      webhook as a second step. Occasionally the process crashes after the DB
      commit but before the publish, and the event is never sent. Which pattern
      fixes this at the root?
    options:
      - "Move the webhook publish to before the DB commit so the event is always emitted no matter what the transaction does next"
      - "Transactional outbox: insert the event into an `outbox` table within the same DB transaction, then have a relay/CDC deliver it asynchronously"
      - "Add exponential backoff to the publish call so a transient publish failure after the commit is eventually retried"
      - "Have the consumer poll a secondary endpoint for missed events every minute to backfill anything the crash skipped"
    answer: 1
    explanation: |
      This is the dual-write problem. The outbox pattern makes the state change
      and the event record commit atomically in one transaction; a separate
      relay (or CDC) then delivers reliably (at-least-once). Publishing before the
      commit risks phantom events on rollback; backoff does not help if the
      process crashed; consumer polling is a workaround, not a fix.
    ref: "concepts.md#producer-side-reliability-the-transactional-outbox"

  - id: webhooks-and-async-api-patterns-071
    difficulty: advanced
    tags: [outbox, atomicity, dual-write]
    question: |
      Why is inserting the outbox row within the *same* database transaction as
      the business state change the crux of the transactional outbox pattern?
    options:
      - "It makes the resulting webhook payload smaller by storing the event body in the database instead of on the wire"
      - "It guarantees the state change and the intent-to-emit persist atomically — either both commit or neither does, eliminating lost or phantom events"
      - "It lets the downstream consumer skip all idempotency handling because the outbox guarantees exactly-once delivery"
      - "It encrypts the event at rest before delivery so the relay can forward it without adding its own signature"
    answer: 1
    explanation: |
      Atomicity is the whole point: because the outbox insert shares the
      transaction, you can never end up with a committed state change and no
      recorded event (loss) or a sent event with a rolled-back change (phantom).
      The relay then delivers at-least-once, so consumers still need idempotency.
    ref: "concepts.md#producer-side-reliability-the-transactional-outbox"

  - id: webhooks-and-async-api-patterns-072
    difficulty: expert
    tags: [lro, aip-151, status-resource, scenario]
    question: |
      Following Google AIP-151, a long-running operation returns an `Operation`
      resource. When the operation finishes, how is the outcome represented?
    options:
      - "Both the `response` and the `error` fields are always populated together so the client can compare them for consistency"
      - "`done` becomes true and exactly one of `response` (success payload) or `error` (`google.rpc.Status`) is set"
      - "`done` stays false forever and the client instead infers success purely from the terminal HTTP 200 status line"
      - "The `metadata` progress field is overwritten in place with the operation's raw result bytes once the work completes"
    answer: 1
    explanation: |
      In AIP-151, the `Operation` has `done` (bool) and a result oneof: on
      completion `done` is true and either `response` (on success) or `error` (a
      `google.rpc.Status`) is set — never both. `metadata` carries progress, not
      the final result.
    ref: "concepts.md#structured-long-running-operations"

  - id: webhooks-and-async-api-patterns-073
    difficulty: expert
    tags: [azure-monitor, lro, comparison]
    question: |
      Contrast the Azure-style async monitor with the Google AIP-151 LRO model.
      Which statement is accurate?
    options:
      - "Both patterns embed the operation's final result inline in the initial 202 Accepted body, so neither client ever needs to poll a separate status resource"
      - "Azure polls a `Location` status-monitor URL that returns 200 while running then 302/303 to the result; Google models a first-class `Operation` resource with `done`/`response`/`error`"
      - "Google uses a `Location` header redirect to a status-monitor URL, while Azure exposes a first-class Operation resource with a `done` boolean and `response`/`error`"
      - "Azure never returns 202 Accepted for async work; instead it holds the original HTTP connection open with chunked encoding until the operation completes"
    answer: 1
    explanation: |
      Azure's pattern is header/redirect-driven: `202` + `Location` → a
      status-monitor URL returning `200` (running) then `302`/`303` to the result.
      Google's AIP-151 is resource-driven: a pollable `Operation` with `done` and
      a `response`|`error` oneof. Neither returns the result inline in the 202.
    ref: "concepts.md#structured-long-running-operations"

  - id: webhooks-and-async-api-patterns-074
    difficulty: expert
    tags: [cancellation, state-machine, scenario]
    question: |
      A client starts a 2-hour transcode via `202 Accepted` and later needs to
      cancel it. Which design is most correct?
    options:
      - "Return 200 OK immediately from the cancel call and assume the transcode has stopped, tearing down its status resource regardless of whether the worker is actually still running"
      - "Model the job as a resource with a state machine and expose `DELETE`/`:cancel` that requests best-effort abort, transitioning to a terminal `cancelled` state (and reporting if it already completed)"
      - "There is no way to cancel an already-accepted async job under HTTP semantics; once a 202 is returned the operation must be allowed to run to completion"
      - "Cancel the job by having the client send a `429 Too Many Requests` back to the producer, which the transcode worker interprets as a stop-processing signal"
    answer: 1
    explanation: |
      Cancellation is best-effort against a running job: expose `DELETE
      /jobs/{id}` or a `:cancel` verb (AIP-151 `CancelOperation`), move the job to
      a terminal `cancelled` state, and honestly report if it had already finished
      (a race). Blindly returning success is wrong, and cancellation is definitely
      possible.
    ref: "concepts.md#structured-long-running-operations"

  - id: webhooks-and-async-api-patterns-075
    difficulty: advanced
    tags: [conflict, aborted, status-codes]
    question: |
      A client submits an operation that conflicts with another operation already
      in progress on the same resource, so the server rejects the new one. Which
      status code best expresses this "aborted due to a concurrent operation"
      condition?
    options:
      - "202 Accepted"
      - "404 Not Found"
      - "409 Conflict"
      - "422 Unprocessable Content"
    answer: 2
    explanation: |
      `409 Conflict` (ABORTED semantics) signals the request could not proceed
      because it conflicts with the current state / an in-flight operation. `202`
      would falsely imply acceptance, `404` is wrong (the resource exists), and
      `422` is about payload semantics, not concurrency conflicts.
    ref: "concepts.md#structured-long-running-operations"

  - id: webhooks-and-async-api-patterns-076
    difficulty: expert
    tags: [openapi, callbacks, runtime-expression, scenario]
    question: |
      You must document, in OpenAPI 3.1, that after a client calls `POST
      /subscribe` (passing a `callbackUrl` in the body), your API will POST events
      to that URL. Which construct is correct?
    options:
      - "A root-level `webhooks` entry keyed by event name, because every request the API originates outbound must be declared under the document-level `webhooks` object"
      - "An Operation-level `callbacks` object on `POST /subscribe`, keyed by the runtime expression `{$request.body#/callbackUrl}`"
      - "A `links` object on the `POST /subscribe` response that references the callback operation and passes `callbackUrl` as a parameter to it"
      - "A `301 Moved Permanently` response on `POST /subscribe` carrying the client's `callbackUrl` in the `Location` header for the server to follow"
    answer: 1
    explanation: |
      Because the outbound request is triggered by (and its URL comes from) a
      specific operation, it is an Operation-level `callbacks` object whose key is
      a runtime expression like `{$request.body#/callbackUrl}`. Root-level
      `webhooks` is for provider-initiated events not tied to a call; `links` and
      redirects are unrelated.
    ref: "concepts.md#documenting-async-in-the-api-contract-openapi-webhooks-vs-callbacks"

  - id: webhooks-and-async-api-patterns-077
    difficulty: advanced
    tags: [openapi, webhooks-object, callbacks, distinction]
    question: |
      In OpenAPI 3.1, what distinguishes the root-level `webhooks` object from an
      Operation's `callbacks` object?
    options:
      - "`webhooks` describes provider-initiated, out-of-band events not tied to any operation; `callbacks` describes requests sent as a consequence of a specific operation"
      - "`webhooks` documents the inbound requests a client sends to the API, while `callbacks` documents the response bodies the API returns for each of those inbound requests"
      - "They are simply two aliases introduced together in OpenAPI 3.1 for the same feature and behave identically wherever either one is used in the document"
      - "`callbacks` may only be declared at the document root level, whereas `webhooks` may only be nested inside an individual operation's definition"
    answer: 0
    explanation: |
      `webhooks` (new at the document root in 3.1) documents standing,
      provider-initiated events independent of any client call. `callbacks` are
      attached to an operation and describe requests the API makes as a result of
      that operation, keyed by runtime expressions. They are not aliases.
    ref: "concepts.md#documenting-async-in-the-api-contract-openapi-webhooks-vs-callbacks"

  - id: webhooks-and-async-api-patterns-078
    difficulty: expert
    tags: [ssrf, dns-rebinding, security, scenario]
    question: |
      Your webhook sender validates each callback URL's IP at registration time
      and blocks internal ranges. An attacker still reaches `169.254.169.254` at
      delivery. What most likely happened, and what defense closes it?
    options:
      - "The per-endpoint HMAC signing secret leaked, letting the attacker craft a signed request that your validator trusted and forwarded to the metadata endpoint; rotate the secret"
      - "DNS rebinding: the domain resolved to a public IP at registration but to a link-local IP at delivery — re-resolve and validate the actual connect-time IP (and pin to it)"
      - "The signed-timestamp tolerance window was configured too wide, so a captured request replayed toward the metadata IP still passed verification; narrow the window"
      - "The consumer returned `429 Too Many Requests`, and your sender followed the `Retry-After` redirect straight to the internal metadata address; honor the header correctly"
    answer: 1
    explanation: |
      Validating only at registration is defeated by DNS rebinding — the attacker
      flips the DNS answer to a link-local/internal IP by delivery time. The fix
      is to re-resolve DNS at connect time, validate that actual IP against the
      denylist, and pin the connection to the validated address. Secrets,
      tolerance, and 429 are unrelated.
    ref: "concepts.md#hardening-ssrf-defense-in-depth"

  - id: webhooks-and-async-api-patterns-079
    difficulty: advanced
    tags: [ssrf, egress-proxy, smokescreen, defense-in-depth]
    question: |
      Beyond validating callback URLs, what infrastructure-level control best
      contains SSRF from the webhook-sender fleet?
    options:
      - "Running the sender workers with broad administrator credentials so they can automatically self-heal and reconfigure their own network routes when a delivery fails"
      - "Routing all outbound delivery through a dedicated egress proxy/filter (e.g. Stripe's Smokescreen) and isolating senders in a private subnet with no internal/IMDS access"
      - "Caching every DNS response indefinitely so the sender fleet never pays the re-resolution cost and always reuses the first resolved address for each host"
      - "Disabling TLS certificate verification on outbound deliveries to reduce handshake failures against consumers with self-signed or expired certificates"
    answer: 1
    explanation: |
      Defense-in-depth puts an egress proxy (Smokescreen) that enforces the
      denylist in front of all outbound traffic and isolates the sender workers in
      a private subnet with no route to internal services or the metadata endpoint
      — so a bypassed URL check still cannot reach anything sensitive. The other
      options increase risk.
    ref: "concepts.md#hardening-ssrf-defense-in-depth"

  - id: webhooks-and-async-api-patterns-080
    difficulty: expert
    tags: [dedupe-ttl, replay-window, idempotency, scenario]
    question: |
      Your consumer keeps seen event ids for 5 minutes (matching the replay
      timestamp tolerance). A legitimate retry of a real event arrives 6 hours
      later after a long backoff. What happens, and what is the correct fix?
    options:
      - "The HMAC signature carries a 5-minute validity built into the digest, so the 6-hour-late retry is cryptographically expired and safely rejected; no fix is needed"
      - "The id is no longer in the dedupe store, so the event is double-processed; size the idempotency store to exceed the entire retry/redelivery horizon (days), separate from the short replay-nonce window"
      - "Producers hard-cap their retry schedule at the 5-minute replay tolerance and abandon the event afterward, so a retry arriving 6 hours later can never actually happen"
      - "The consumer automatically returns `429 Too Many Requests` for any id evicted from its dedupe store, which permanently halts the producer's retry loop"
    answer: 1
    explanation: |
      Conflating the two windows is the bug: the 5-minute replay/nonce window
      guards malicious re-sends, but retry-based duplicates can arrive days later.
      If the dedupe TTL is only 5 minutes, the late retry is not recognized and
      gets processed twice. Retain idempotency keys at least as long as the max
      retry/redelivery horizon.
    ref: "concepts.md#at-least-once-corner-cases-dedupe-ttl-vs-replay-window"

  - id: webhooks-and-async-api-patterns-081
    difficulty: advanced
    tags: [dedupe-ttl, replay-window, distinction]
    question: |
      Why are the replay-protection window and the idempotency dedupe-retention
      window fundamentally two different durations?
    options:
      - "They are actually the same duration, and reusing one configured value for both the replay tolerance and the dedupe TTL is the documented best practice"
      - "The replay window (minutes) bounds malicious re-sends of captured requests; the dedupe window must span the entire legitimate retry/redelivery horizon (potentially days)"
      - "The replay-protection window is always the longer of the two, since captured requests can be replayed far later than any legitimate retry would arrive"
      - "The dedupe-retention window only matters when payload signing is disabled, because a valid signature already makes every delivery unique on its own"
    answer: 1
    explanation: |
      Replay defense rejects stale captured requests within a tight tolerance
      (minutes). Duplicate suppression must survive every legitimate retry and DLQ
      redelivery of the same event, which can span days. Two different clocks for
      two different threats — do not reuse the 5-minute window as the dedupe TTL.
    ref: "concepts.md#at-least-once-corner-cases-dedupe-ttl-vs-replay-window"

  - id: webhooks-and-async-api-patterns-082
    difficulty: advanced
    tags: [status-codes, retry-nuance, 4xx]
    question: |
      Most producers treat 4xx responses as permanent (no retry). Which 4xx
      responses are notable exceptions that a well-behaved producer SHOULD still
      retry?
    options:
      - "400 Bad Request and 401 Unauthorized"
      - "408 Request Timeout and 425 Too Early (in addition to 429 Too Many Requests)"
      - "403 Forbidden and 404 Not Found"
      - "410 Gone and 422 Unprocessable Content"
    answer: 1
    explanation: |
      408 (Request Timeout) and 425 (Too Early) indicate transient conditions
      that can succeed on retry, alongside 429 (slow down and retry with
      Retry-After). By contrast 400/401/403/404/410/422 signal problems retrying
      will not fix.
    ref: "concepts.md#delivery-guarantees-and-at-least-once-semantics"

  - id: webhooks-and-async-api-patterns-083
    difficulty: advanced
    tags: [status-codes, 410-gone, endpoint-disabling]
    question: |
      A consumer endpoint responds `410 Gone`. Beyond "do not retry this
      delivery," what is the appropriate producer behavior toward that endpoint?
    options:
      - "Treat 410 exactly like a 429 response: back off, apply the `Retry-After` delay, and keep the endpoint enabled for future deliveries"
      - "Treat 410 as a signal that the endpoint is permanently gone and auto-disable it, notifying the owner"
      - "Keep retrying that endpoint every hour indefinitely on the assumption that a 410 is temporary and the URL will eventually come back online"
      - "Escalate the delivery to a WebSocket connection and re-push the event to the consumer over that persistent channel instead"
    answer: 1
    explanation: |
      `410 Gone` explicitly means the resource is permanently gone, so continuing
      to deliver there is futile. The right response is to disable the endpoint
      and notify its owner, rather than burning retries on a dead URL.
    ref: "concepts.md#delivery-guarantees-and-at-least-once-semantics"

  - id: webhooks-and-async-api-patterns-084
    difficulty: advanced
    tags: [timeout-budget, connection, producer, scenario]
    question: |
      Why does the "acknowledge fast, process asynchronously" rule matter
      numerically for a producer's delivery client?
    options:
      - "Producers set aggressive connect/read timeouts (a few seconds); if the consumer does heavy work inline it exceeds the timeout, the producer aborts and retries, causing duplicates"
      - "RFC 9110 mandates a hard maximum 2-second response time for any POST request, above which the request is defined as failed and must be discarded"
      - "Consumers are forbidden from returning a 2xx status once they have performed any processing work at all, so acknowledgment must always precede handling"
      - "Performing lengthy work before responding causes the response bytes to desynchronize the HMAC digest, corrupting the signature the consumer computed"
    answer: 0
    explanation: |
      Producers keep connect/read timeouts short (seconds) so a slow or dead
      consumer does not tie up sender capacity. If the consumer processes heavily
      before responding, it blows the timeout budget; the producer aborts and
      retries, duplicating the event. Hence: enqueue durably, return 2xx fast,
      process later.
    ref: "concepts.md#delivery-guarantees-and-at-least-once-semantics"

  - id: webhooks-and-async-api-patterns-085
    difficulty: expert
    tags: [pii, data-minimization, thin-vs-fat, compliance, scenario]
    question: |
      A compliance reviewer flags that fat webhook payloads carrying customer PII
      end up in the consumer's request logs, intermediary proxies, and error
      trackers. Which design change best reduces the compliance/blast-radius
      concern?
    options:
      - "Gzip-compress the fat payload before delivery so the PII occupies fewer bytes in the consumer's logs, proxies, and error-tracking systems"
      - "Send a thin payload (ids only) plus an authenticated callback to fetch details, keeping sensitive data on the access-controlled API path"
      - "Base64-encode the customer PII inside the same fat webhook body so it is obscured from casual reading as it passes through intermediary proxies"
      - "Increase the HMAC signing key from 256 to 512 bits so the stronger signature cryptographically shields the PII carried in the payload"
    answer: 1
    explanation: |
      Fat payloads spray PII across logs, proxies, and error systems, widening the
      leak blast radius and risking GDPR data-minimization/residency rules. A thin
      notification plus an authenticated fetch keeps sensitive data on the
      audited, access-controlled API path. Compression, encoding, and larger keys
      do not stop the data from landing in logs.
    ref: "concepts.md#payload-minimization-and-data-residency"

  - id: webhooks-and-async-api-patterns-086
    difficulty: advanced
    tags: [cloudevents, source-id, dedupe]
    question: |
      CloudEvents requires that the combination of which two attributes be unique,
      and why does that matter to consumers?
    options:
      - "`type` + `time`, so a consumer can sort events into strict chronological order and process them exactly as the producer emitted them"
      - "`source` + `id`, so a consumer can use it as a reliable de-duplication key across at-least-once delivery"
      - "`specversion` + `datacontenttype`, so a consumer's parser can reliably select the correct decoder for every incoming event body"
      - "`subject` + `dataschema`, so that schema validation of the event payload is completely unambiguous for the receiving consumer"
    answer: 1
    explanation: |
      CloudEvents mandates that producers make `source` + `id` unique. That pair
      is the natural, standardized de-dup key: a consumer receiving the same
      `source`/`id` again knows it is a duplicate under at-least-once delivery and
      can no-op safely.
    ref: "concepts.md#the-cloudevents-standard"
