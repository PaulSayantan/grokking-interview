topic: "GraphQL: Schema Design, Execution & Federation"
domain: rest-api-design
topic_slug: graphql-schema-and-federation
version: 1
questions:
  - id: graphql-schema-and-federation-001
    difficulty: beginner
    tags: [basics, endpoint, over-fetching]
    question: |
      What is the defining structural difference between a GraphQL API and a
      typical REST API?
    options:
      - "GraphQL always uses binary Protobuf encoding instead of JSON"
      - "GraphQL requires HTTP/2 while REST requires HTTP/1.1"
      - "GraphQL cannot perform write operations, only reads"
      - "GraphQL exposes a single endpoint and lets the client specify exactly which fields to return"
    answer: 3
    explanation: |
      GraphQL typically exposes one endpoint (e.g. POST /graphql) with a typed schema, and
      the client sends a query naming exactly the field tree it wants. The server returns
      exactly that shape, moving response-shaping from server to client.
    ref: "concepts.md#why-graphql-the-problems-it-solves"

  - id: graphql-schema-and-federation-002
    difficulty: beginner
    tags: [over-fetching, under-fetching]
    question: |
      A mobile screen only needs a user's name and avatar, but the REST endpoint
      GET /users/42 returns the entire user record. What problem is this?
    options:
      - "Over-fetching"
      - "Under-fetching"
      - "The N+1 problem"
      - "Null propagation"
    answer: 0
    explanation: |
      Over-fetching is receiving more data than the client needs from a fixed payload.
      GraphQL avoids it because the client names only the fields it wants.
    ref: "concepts.md#why-graphql-the-problems-it-solves"

  - id: graphql-schema-and-federation-003
    difficulty: beginner
    tags: [under-fetching, round-trips]
    question: |
      Rendering a feed with REST requires GET /posts, then a GET /users/{authorId}
      per post, then comments per post — a waterfall of requests. This is an example of:
    options:
      - "Schema stitching"
      - "Query batching"
      - "Over-fetching"
      - "Under-fetching (multiple round trips to assemble one view)"
    answer: 3
    explanation: |
      Under-fetching means a single endpoint doesn't return enough, forcing the client into
      many dependent round trips. GraphQL lets the client express the whole nested need in
      one request.
    ref: "concepts.md#why-graphql-the-problems-it-solves"

  - id: graphql-schema-and-federation-004
    difficulty: beginner
    tags: [sdl, type-system]
    question: |
      In GraphQL SDL, what does the trailing `!` in `name: String!` mean?
    options:
      - "The field is deprecated"
      - "The field is non-null (guaranteed present, cannot be null)"
      - "The field is private and requires authentication"
      - "The field is a list"
    answer: 1
    explanation: |
      `!` marks a type as non-null. Types are nullable by default in GraphQL; `!` guarantees
      a non-null value. `[Post!]!` is a non-null list of non-null Posts.
    ref: "concepts.md#the-type-system-and-sdl"

  - id: graphql-schema-and-federation-005
    difficulty: beginner
    tags: [root-types, operations]
    question: |
      Which three special root operation types serve as entry points into a GraphQL schema?
    options:
      - "Get, Post, Delete"
      - "Query, Mutation, Subscription"
      - "Read, Write, Stream"
      - "Node, Edge, Connection"
    answer: 1
    explanation: |
      Query (reads), Mutation (writes), and Subscription (event streams) are the three root
      operation types. Every executable operation starts at one of them.
    ref: "concepts.md#the-type-system-and-sdl"

  - id: graphql-schema-and-federation-006
    difficulty: intermediate
    tags: [interface, union, type-system]
    question: |
      When should you model a relationship as a `union` rather than an `interface` in GraphQL?
    options:
      - "When the member types share several common fields clients query together"
      - "When the type is used only as a mutation argument"
      - "When the member types have nothing in common and you just need 'one of these'"
      - "When you want the field to be non-null"
    answer: 2
    explanation: |
      A union expresses 'one of these' among types with no shared fields (e.g. a search
      result). An interface is for types that share fields clients may query polymorphically.
    ref: "concepts.md#the-type-system-and-sdl"

  - id: graphql-schema-and-federation-007
    difficulty: intermediate
    tags: [input-types, type-system]
    question: |
      Which statement about GraphQL `input` types is TRUE?
    options:
      - "Input types can have field resolvers just like object types"
      - "Input types cannot have arguments or resolvers and their fields must be input/scalar/enum types"
      - "Input types can implement interfaces"
      - "Input types and object types are interchangeable in a schema"
    answer: 1
    explanation: |
      Input types are serialized into a request, so they have no resolvers or arguments,
      cannot implement interfaces, and their fields must be other input, scalar, or enum
      types. Object types are resolved out of a request and are distinct.
    ref: "concepts.md#the-type-system-and-sdl"

  - id: graphql-schema-and-federation-008
    difficulty: intermediate
    tags: [polymorphism, fragments, typename]
    question: |
      How does a client select fields specific to one concrete type when querying an
      interface or union field?
    options:
      - "By passing a `type` argument to the field"
      - "By calling a separate REST endpoint for each type"
      - "Using inline fragments like `... on User { ... }` and `__typename`"
      - "It is not possible; only shared fields can be queried"
    answer: 2
    explanation: |
      Clients discriminate members with inline fragments (`... on TypeName`) and read
      `__typename` to know which concrete type was returned.
    ref: "concepts.md#the-type-system-and-sdl"

  - id: graphql-schema-and-federation-009
    difficulty: beginner
    tags: [nullability]
    question: |
      In GraphQL, what is the default nullability of a field type if you write no `!`?
    options:
      - "Nullable"
      - "Non-null"
      - "It depends on whether it is a scalar"
      - "Undefined until the resolver runs"
    answer: 0
    explanation: |
      Every type is nullable by default; you add `!` to make it non-null. This is the
      opposite default of most programming languages and is deliberate.
    ref: "concepts.md#nullability-and-null-propagation"

  - id: graphql-schema-and-federation-010
    difficulty: advanced
    tags: [nullability, null-propagation, errors]
    question: |
      A resolver for a non-null field throws an error. What does GraphQL's null
      propagation do?
    options:
      - "Sets just that field to null and continues"
      - "Propagates the null up to the nearest nullable ancestor, nulling that whole branch"
      - "Aborts the entire request immediately with an HTTP 500"
      - "Retries the resolver up to three times"
    answer: 1
    explanation: |
      A null (or error) in a non-null field bubbles up to the nearest nullable ancestor,
      which is set to null. If it bubbles all the way to a non-null root, `data` becomes null
      entirely.
    ref: "concepts.md#nullability-and-null-propagation"

  - id: graphql-schema-and-federation-011
    difficulty: advanced
    tags: [nullability, schema-design, resilience]
    question: |
      Why do many teams keep fields backed by downstream services nullable rather than
      marking them non-null?
    options:
      - "So a downstream failure nulls just that field instead of destroying a larger slice of the response"
      - "Non-null fields are slower to serialize"
      - "Because non-null fields cannot be cached"
      - "Because the spec forbids non-null on remote fields"
    answer: 0
    explanation: |
      Marking a field non-null means any failure resolving it bubbles up and nulls a larger
      branch. Keeping downstream-dependent fields nullable lets a partial outage degrade
      gracefully rather than blanking the whole response.
    ref: "concepts.md#nullability-and-null-propagation"

  - id: graphql-schema-and-federation-012
    difficulty: intermediate
    tags: [mutations, execution-order]
    question: |
      If a single GraphQL document contains two top-level mutation fields, how are they
      executed?
    options:
      - "In parallel, like query fields"
      - "In random order chosen by the engine"
      - "Serially, in the order they are listed"
      - "Only the first one runs; the rest are ignored"
    answer: 2
    explanation: |
      Top-level mutation fields execute serially in listed order to give predictable write
      semantics. Query fields, by contrast, resolve in parallel.
    ref: "concepts.md#queries-mutations-and-subscriptions"

  - id: graphql-schema-and-federation-013
    difficulty: intermediate
    tags: [subscriptions, transport]
    question: |
      Which statement about GraphQL subscriptions is correct?
    options:
      - "A subscription may have any number of root fields per operation"
      - "A subscription operation must have exactly one root field and is typically delivered over WebSocket or SSE"
      - "Subscriptions are pull-based and polled by the client"
      - "Subscriptions are only available in Apollo Federation"
    answer: 1
    explanation: |
      A subscription is a long-lived server-push stream with exactly one root field per
      operation, usually delivered over a WebSocket protocol (graphql-transport-ws) or,
      increasingly, HTTP SSE.
    ref: "concepts.md#queries-mutations-and-subscriptions"

  - id: graphql-schema-and-federation-014
    difficulty: intermediate
    tags: [queries, execution]
    question: |
      Why must state-changing operations be placed under `Mutation` rather than `Query`?
    options:
      - "Query fields are read-only and may execute in parallel, which can corrupt ordered writes"
      - "Query responses cannot contain objects"
      - "Query operations are not allowed to take arguments"
      - "Query operations are always cached and would return stale writes"
    answer: 0
    explanation: |
      Top-level query fields are assumed side-effect free and resolve in parallel. Placing
      writes there risks unordered/concurrent execution. Mutations run serially in order,
      which is what writes need.
    ref: "concepts.md#queries-mutations-and-subscriptions"

  - id: graphql-schema-and-federation-015
    difficulty: intermediate
    tags: [resolvers, execution-model]
    question: |
      What are the four arguments passed to a GraphQL field resolver, in order?
    options:
      - "(request, response, next, error)"
      - "(schema, query, variables, operation)"
      - "(parent, args, context, info)"
      - "(id, fields, filters, pagination)"
    answer: 2
    explanation: |
      A resolver has the signature (parent, args, context, info): parent is the value from
      the parent field, args the field arguments, context per-request shared state, and info
      AST/schema details.
    ref: "concepts.md#the-execution-model-and-resolvers"

  - id: graphql-schema-and-federation-016
    difficulty: intermediate
    tags: [resolvers, default-resolver]
    question: |
      If you do NOT write a resolver for a field, what does the default resolver do?
    options:
      - "Throws a 'resolver not implemented' error"
      - "Returns parent[fieldName] (or calls it if it is a function)"
      - "Returns null for that field"
      - "Fetches the field from a REST fallback endpoint"
    answer: 1
    explanation: |
      The default resolver reads the property of the same name off the parent object (or
      invokes it if it is a function). So you only write custom resolvers for fields needing
      special fetching or computation.
    ref: "concepts.md#the-execution-model-and-resolvers"

  - id: graphql-schema-and-federation-017
    difficulty: advanced
    tags: [execution-model, concurrency]
    question: |
      During execution of a single query, how do sibling fields at the same level of the
      selection set resolve relative to one another?
    options:
      - "Strictly one at a time, alphabetically"
      - "Only after the whole tree is validated twice"
      - "In reverse of their declaration order"
      - "Concurrently (in parallel)"
    answer: 3
    explanation: |
      GraphQL executes a depth-first walk but sibling fields at the same level resolve
      concurrently. This parallelism is exactly what creates the N+1 problem when each
      resolver fetches independently.
    ref: "concepts.md#the-execution-model-and-resolvers"

  - id: graphql-schema-and-federation-018
    difficulty: intermediate
    tags: [n-plus-one, performance]
    question: |
      Resolving the `author` field for 10 posts fires the author resolver 10 times, each
      hitting the database. Including the initial posts query, how many queries is this and
      what is it called?
    options:
      - "10 queries; the fan-out problem"
      - "11 queries (1 + N); the N+1 problem"
      - "1 query; the batching problem"
      - "20 queries; the cartesian problem"
    answer: 1
    explanation: |
      One query for the posts plus N queries for the authors equals N+1 queries. This is the
      classic N+1 problem that per-field resolvers create.
    ref: "concepts.md#the-n1-problem-and-dataloader"

  - id: graphql-schema-and-federation-019
    difficulty: intermediate
    tags: [dataloader, batching]
    question: |
      What are the TWO things a DataLoader provides to solve the N+1 problem?
    options:
      - "Compression and encryption of resolver output"
      - "Automatic pagination and cursor generation"
      - "Query depth limiting and cost analysis"
      - "Batching of loads within one tick and per-request caching (memoization)"
    answer: 3
    explanation: |
      DataLoader coalesces individual .load(id) calls made within a single event-loop tick
      into one batch query, and memoizes repeated loads of the same key for the duration of
      the request.
    ref: "concepts.md#the-n1-problem-and-dataloader"

  - id: graphql-schema-and-federation-020
    difficulty: advanced
    tags: [dataloader, security, per-request]
    question: |
      Why must a DataLoader instance be created per request and stored on the context,
      rather than shared process-wide?
    options:
      - "Because a global loader is slower to allocate"
      - "Because its per-request cache would otherwise leak data across users and never invalidate"
      - "Because the spec requires one loader per field"
      - "Because global loaders cannot batch queries"
    answer: 1
    explanation: |
      A DataLoader's cache is meant to live for a single request. A process-wide loader
      leaks cached data across different users' requests (stale or authorization-crossing
      reads) and never invalidates.
    ref: "concepts.md#the-n1-problem-and-dataloader"

  - id: graphql-schema-and-federation-021
    difficulty: advanced
    tags: [dataloader, batch-function, gotcha]
    question: |
      A DataLoader batch function is called with keys [3, 1, 2]. What ordering contract
      must the returned array satisfy?
    options:
      - "Results sorted ascending by key"
      - "Results grouped by type, order irrelevant"
      - "Only the found results, in any order"
      - "Results in the same order and count as the input keys, with null for misses"
    answer: 3
    explanation: |
      The batch function must return an array the same length and order as the input keys,
      using null (or an Error) for missing keys. A mismatch silently maps the wrong record to
      the wrong key.
    ref: "concepts.md#the-n1-problem-and-dataloader"

  - id: graphql-schema-and-federation-022
    difficulty: intermediate
    tags: [over-fetching, cost, risk]
    question: |
      GraphQL structurally eliminates over/under-fetching. What new risk does client-driven
      field selection introduce?
    options:
      - "Clients can no longer send arguments"
      - "Responses can no longer be typed"
      - "Query cost becomes client-controlled and effectively unbounded, complicating rate limiting"
      - "Mutations become impossible"
    answer: 2
    explanation: |
      Because the client names the field tree, a single query can request deeply nested
      expensive work. Control (and therefore the risk/cost) moves to the client, so GraphQL
      typically needs cost-based rather than request-count rate limiting.
    ref: "concepts.md#solving-over-fetching-and-under-fetching"

  - id: graphql-schema-and-federation-023
    difficulty: intermediate
    tags: [errors, schema-design]
    question: |
      A GraphQL response has two top-level channels. What are they?
    options:
      - "`result` and `status`"
      - "`data` and `errors`"
      - "`body` and `headers`"
      - "`payload` and `meta`"
    answer: 1
    explanation: |
      A GraphQL response carries `data` (the resolved field tree) and `errors` (an array of
      error objects with message, path, locations, and an extensions bag).
    ref: "concepts.md#schema-design-errors-as-data-vs-top-level-errors"

  - id: graphql-schema-and-federation-024
    difficulty: advanced
    tags: [errors-as-data, schema-design, mutations]
    question: |
      For an expected business outcome like "insufficient funds" on a transfer mutation,
      which approach is generally preferred?
    options:
      - "Throw so it appears in the top-level `errors` array as a string message"
      - "Return HTTP 402 and an empty body"
      - "Model it in the schema as typed data, e.g. a `userErrors` field on the payload"
      - "Log it server-side and return null with no indication"
    answer: 2
    explanation: |
      Expected/recoverable domain errors are best modeled as typed data (a union or a payload
      with a userErrors field) so they are part of the schema contract, introspectable, and
      non-breaking to extend. Top-level errors are weakly typed and reserved for unexpected
      faults.
    ref: "concepts.md#schema-design-errors-as-data-vs-top-level-errors"

  - id: graphql-schema-and-federation-025
    difficulty: intermediate
    tags: [errors, extensions]
    question: |
      By convention, where does a machine-readable error code like `UNAUTHENTICATED` live in
      a top-level GraphQL error object?
    options:
      - "In the HTTP status line"
      - "In the `data` field"
      - "In a custom response header"
      - "In `extensions.code`"
    answer: 3
    explanation: |
      Top-level error objects carry message, path, and locations, plus an `extensions` bag
      where a machine-readable `code` (e.g. UNAUTHENTICATED, NOT_FOUND) is conventionally
      placed.
    ref: "concepts.md#schema-design-errors-as-data-vs-top-level-errors"

  - id: graphql-schema-and-federation-026
    difficulty: intermediate
    tags: [pagination, connections, relay]
    question: |
      In the Relay Cursor Connections spec, what is the purpose of the `edge` wrapping each
      node?
    options:
      - "To hold per-relationship metadata such as the `cursor` (and edge-specific fields)"
      - "To duplicate the node for caching"
      - "To store the HTTP ETag for the node"
      - "To hold the SQL query that produced the node"
    answer: 0
    explanation: |
      The edge carries per-relationship metadata — notably the opaque `cursor`, and things
      like a `role` on a membership edge — while the `node` is the entity itself.
    ref: "concepts.md#pagination-relay-connections-and-cursors"

  - id: graphql-schema-and-federation-027
    difficulty: intermediate
    tags: [pagination, cursor, opaque]
    question: |
      What should a client do with the `cursor` string returned in a Relay connection?
    options:
      - "Parse it to extract the row's primary key"
      - "Decode it as base64 to read the offset and increment it"
      - "Treat it as opaque and pass it back unchanged in `after`/`before`"
      - "Ignore it and use numeric page numbers instead"
    answer: 2
    explanation: |
      The cursor is opaque; clients must not parse it. They pass it back verbatim (in
      after/before) so the server can resume from its encoded position (often a keyset value).
    ref: "concepts.md#pagination-relay-connections-and-cursors"

  - id: graphql-schema-and-federation-028
    difficulty: beginner
    tags: [pagination, page-info]
    question: |
      Which field on a Relay `PageInfo` tells the client whether more results exist when
      paginating forward?
    options:
      - "`hasNextPage`"
      - "`totalCount`"
      - "`endCursor`"
      - "`startCursor`"
    answer: 0
    explanation: |
      `hasNextPage` indicates whether more results exist after the current page (with
      `hasPreviousPage` for backward). `endCursor`/`startCursor` are the boundary cursors.
    ref: "concepts.md#pagination-relay-connections-and-cursors"

  - id: graphql-schema-and-federation-029
    difficulty: intermediate
    tags: [global-id, node-interface, caching]
    question: |
      What is the primary benefit of the Relay global object identification pattern (a `Node`
      interface with a globally-unique `id` and a `node(id)` root field)?
    options:
      - "It makes all fields non-null"
      - "It disables introspection automatically"
      - "It compresses responses using the id as a dictionary key"
      - "It lets client caches normalize any object by one global key and enables refetching any object by id"
    answer: 3
    explanation: |
      A globally unique id lets Apollo/Relay caches normalize and dedupe any object by a
      single key, and lets clients refetch any object by id after a mutation. It is GraphQL's
      analog to a REST resource URL.
    ref: "concepts.md#global-object-identification-and-the-node-interface"

  - id: graphql-schema-and-federation-030
    difficulty: intermediate
    tags: [global-id, encoding]
    question: |
      How are global object ids commonly constructed so they are unique across all types?
    options:
      - "A random UUID with no type information"
      - "Base64 of a string like 'TypeName:localId'"
      - "The database auto-increment integer alone"
      - "The URL path of the equivalent REST resource"
    answer: 1
    explanation: |
      A common scheme is base64 of 'TypeName:localId', which makes ids globally unique across
      types and lets the node(id) resolver decode the type and local id to fetch the object.
    ref: "concepts.md#global-object-identification-and-the-node-interface"

  - id: graphql-schema-and-federation-031
    difficulty: advanced
    tags: [caching, http, post]
    question: |
      Why does the standard HTTP caching stack (CDN, browser cache, ETag/Cache-Control) not
      naturally apply to typical GraphQL traffic?
    options:
      - "Because GraphQL responses are always encrypted"
      - "Because GraphQL forbids the use of HTTP"
      - "Because GraphQL responses have no status codes"
      - "Because queries go to one endpoint via POST with the query in the body, so requests look identical and uncacheable"
    answer: 3
    explanation: |
      All queries hit one endpoint as POST with the operation in the body, so intermediaries
      see the same uncacheable request and cannot key on URL or method as they do with REST.
    ref: "concepts.md#the-caching-challenge"

  - id: graphql-schema-and-federation-032
    difficulty: advanced
    tags: [apq, persisted-queries, caching]
    question: |
      How do persisted queries / Automatic Persisted Queries (APQ) help restore CDN
      cacheability for GraphQL?
    options:
      - "They compress the JSON response with gzip"
      - "They move all queries to WebSockets"
      - "They let the client send a query hash (with variables) as a GET, which is CDN-cacheable, instead of a POST body"
      - "They disable introspection to reduce payload size"
    answer: 2
    explanation: |
      With APQ the client sends a stable hash of the query (plus variables). Because the hash
      is stable and small, the request can be a GET with the hash in the query string, which
      CDNs can cache again. APQ also underpins query allowlists.
    ref: "concepts.md#the-caching-challenge"

  - id: graphql-schema-and-federation-033
    difficulty: advanced
    tags: [caching, authorization, security]
    question: |
      What MUST a GraphQL server-side response cache include in its cache key to avoid
      leaking private data between users?
    options:
      - "Only the query text"
      - "The authorization context/scope, in addition to query hash and variables"
      - "Only the variables"
      - "The client's user-agent string"
    answer: 1
    explanation: |
      Because one endpoint serves all users and field-level authz is common, a cache keyed
      only on (query, variables) can serve one user's authorized data to another. The auth
      scope must be part of the key (or fields marked PRIVATE).
    ref: "concepts.md#the-caching-challenge"

  - id: graphql-schema-and-federation-034
    difficulty: advanced
    tags: [cache-control, directives]
    question: |
      When a query selects several fields each carrying a `@cacheControl maxAge`, what is the
      effective cache max-age of the response?
    options:
      - "The maximum maxAge among the selected fields"
      - "The sum of all field maxAges"
      - "The minimum maxAge among the selected fields"
      - "Always zero"
    answer: 2
    explanation: |
      The response's effective cache policy is the most restrictive — the minimum maxAge
      across all selected fields — since serving any field past its freshness would be wrong.
    ref: "concepts.md#the-caching-challenge"

  - id: graphql-schema-and-federation-035
    difficulty: intermediate
    tags: [security, depth-limiting]
    question: |
      A schema has a cycle: `author { posts { author { posts ... } } }`. Which control most
      directly defends against abusive deeply-nested queries exploiting this?
    options:
      - "Response compression"
      - "Global object identification"
      - "Serial mutation execution"
      - "Query depth limiting"
    answer: 3
    explanation: |
      Query depth limiting rejects queries nested beyond N levels, a cheap defense against
      recursive/cyclic queries enabled by circular schema references.
    ref: "concepts.md#security-depth-complexity-and-cost-limiting"

  - id: graphql-schema-and-federation-036
    difficulty: advanced
    tags: [security, cost-analysis, rate-limiting]
    question: |
      Which technique assigns a cost to fields (often multiplied by pagination args like
      `first`) and rejects queries over a budget before execution?
    options:
      - "Query complexity / cost analysis"
      - "Content negotiation"
      - "Null propagation"
      - "Schema stitching"
    answer: 0
    explanation: |
      Cost/complexity analysis computes a query's cost from per-field costs multiplied by
      pagination multipliers and rejects queries over a budget before running them. It is
      also the basis for cost-based rate limiting.
    ref: "concepts.md#security-depth-complexity-and-cost-limiting"

  - id: graphql-schema-and-federation-037
    difficulty: advanced
    tags: [security, rate-limiting, cost]
    question: |
      For a GraphQL API, why is cost-based rate limiting usually preferred over simple
      request-count rate limiting?
    options:
      - "Because counting requests is computationally impossible"
      - "Because one endpoint request can represent wildly different amounts of work, so request count is a poor proxy for load"
      - "Because GraphQL forbids counting requests"
      - "Because cost-based limiting removes the need for authentication"
    answer: 1
    explanation: |
      Unlike REST where a URL roughly maps to a unit of work, one GraphQL request can be
      trivial or enormous. Deducting a computed query cost from a token bucket reflects actual
      load far better than counting requests.
    ref: "concepts.md#security-depth-complexity-and-cost-limiting"

  - id: graphql-schema-and-federation-038
    difficulty: intermediate
    tags: [security, pagination-limit]
    question: |
      Why cap the `first`/`last` arguments on list/connection fields (e.g. max 100)?
    options:
      - "To force clients to use offset pagination"
      - "Because cursors cannot encode large numbers"
      - "So a single list field cannot request millions of rows in one query"
      - "To disable subscriptions"
    answer: 2
    explanation: |
      Capping first/last prevents a client from requesting an unbounded number of rows in one
      field, a simple and important amount-limiting defense.
    ref: "concepts.md#security-depth-complexity-and-cost-limiting"

  - id: graphql-schema-and-federation-039
    difficulty: intermediate
    tags: [security, introspection, production]
    question: |
      What is common guidance about GraphQL introspection in production, and what is its
      important caveat?
    options:
      - "Always leave it on; it is required for queries to work"
      - "Introspection must be enabled to allow mutations"
      - "Disable it (defense-in-depth) but still secure resolvers, since disabling is not real security"
      - "Introspection encrypts the schema, so it is safe to expose"
    answer: 2
    explanation: |
      Disabling introspection (and the playground UI) in production hides the schema from
      casual attackers, but it is only defense-in-depth — the schema is still discoverable, so
      resolvers must enforce real authorization.
    ref: "concepts.md#introspection-batching-abuse-and-other-hardening"

  - id: graphql-schema-and-federation-040
    difficulty: advanced
    tags: [security, aliasing, batching-abuse]
    question: |
      An attacker sends one operation with hundreds of aliases of the same expensive field:
      `a: login(...) b: login(...) c: login(...) ...`. What is this and a good mitigation?
    options:
      - "Under-fetching; add more endpoints"
      - "Null propagation; mark the field nullable"
      - "A cache miss; increase TTL"
      - "Alias-based batching abuse; limit aliases/duplicate fields and apply cost analysis across the whole request"
    answer: 3
    explanation: |
      Aliasing lets a single operation invoke the same field many times to amplify or
      brute-force. Mitigations include limiting aliases/duplicate fields, limiting JSON-array
      batch size, and applying cost analysis across the entire request.
    ref: "concepts.md#introspection-batching-abuse-and-other-hardening"

  - id: graphql-schema-and-federation-041
    difficulty: intermediate
    tags: [security, authorization, resolvers]
    question: |
      Where should authorization (who may see each object/field) primarily be enforced in a
      GraphQL server?
    options:
      - "In the schema/SDL alone, which fully controls access"
      - "In the resolvers / business logic they call, using identity carried on the context"
      - "In the client, before sending the query"
      - "In the CDN cache layer"
    answer: 1
    explanation: |
      The schema only says what is reachable. Actual authorization must be enforced in
      resolvers (or a layer they call), using the authenticated identity carried on the
      per-request context. See also api-authentication-and-authorization.
    ref: "concepts.md#introspection-batching-abuse-and-other-hardening"

  - id: graphql-schema-and-federation-042
    difficulty: intermediate
    tags: [federation, entity, key]
    question: |
      In Apollo Federation, what does the `@key(fields: "id")` directive on a type declare?
    options:
      - "That the field must be encrypted"
      - "That the type is an entity referenceable/resolvable across subgraphs by those key fields"
      - "That the type is the primary Query root"
      - "That the field is deprecated"
    answer: 1
    explanation: |
      @key marks a type as an entity and names the fields that uniquely identify it, enabling
      different subgraphs to reference and resolve instances of that entity — like a foreign
      key across services.
    ref: "concepts.md#federation-subgraphs-key-and-the-router"

  - id: graphql-schema-and-federation-043
    difficulty: intermediate
    tags: [federation, router, supergraph]
    question: |
      In a federated setup, how does the client experience the multiple subgraphs?
    options:
      - "It must query each subgraph endpoint separately and merge results itself"
      - "It receives one response per subgraph"
      - "It must specify which subgraph owns each field"
      - "As a single graph — the router composes subgraphs into one supergraph the client queries at one endpoint"
    answer: 3
    explanation: |
      The router (formerly gateway) composes subgraphs into a single supergraph. Clients query
      that one graph as if it were monolithic, unaware of the underlying subgraph boundaries.
    ref: "concepts.md#federation-subgraphs-key-and-the-router"

  - id: graphql-schema-and-federation-044
    difficulty: advanced
    tags: [federation, query-planning]
    question: |
      What is the router's "query plan" in Apollo Federation?
    options:
      - "A cached copy of the client's previous response"
      - "A decomposition of the client query into a sequence/tree of subgraph fetches, resolving entities via reference resolvers and stitching results"
      - "The list of allowed persisted queries"
      - "A rate-limit budget assigned per client"
    answer: 1
    explanation: |
      The query planner breaks the client query into the minimal set/order of subgraph fetches,
      resolves entities in each subgraph via its reference resolver (given the @key fields), and
      merges the pieces into the client's requested shape.
    ref: "concepts.md#federation-subgraphs-key-and-the-router"

  - id: graphql-schema-and-federation-045
    difficulty: advanced
    tags: [federation, directives]
    question: |
      In Federation 2, which directive allows the same object field to be resolved by more
      than one subgraph?
    options:
      - "@external"
      - "@inaccessible"
      - "@shareable"
      - "@override"
    answer: 2
    explanation: |
      @shareable marks a field as resolvable by multiple subgraphs. Without it, Federation 2
      expects a field to be owned by a single subgraph. @external, @inaccessible, and @override
      serve different purposes.
    ref: "concepts.md#federation-subgraphs-key-and-the-router"

  - id: graphql-schema-and-federation-046
    difficulty: advanced
    tags: [federation, directives, requires]
    question: |
      A field's resolver in one subgraph needs the values of other entity fields owned by a
      different subgraph, fetched first. Which directive expresses this dependency?
    options:
      - "@requires"
      - "@tag"
      - "@key"
      - "@inaccessible"
    answer: 0
    explanation: |
      @requires signals that a field's resolver depends on other entity fields resolved by
      other subgraphs, prompting the router to fetch those first — even if the client did not
      request them.
    ref: "concepts.md#federation-subgraphs-key-and-the-router"

  - id: graphql-schema-and-federation-047
    difficulty: advanced
    tags: [federation, directives, inaccessible]
    question: |
      What does the `@inaccessible` directive do in a federated supergraph?
    options:
      - "Deletes the field from all subgraphs"
      - "Marks the field as requiring authentication"
      - "Forces the field to be cached publicly"
      - "Keeps the definition in the supergraph (usable by the router, e.g. as a key) but hides it from the public API schema"
    answer: 3
    explanation: |
      @inaccessible omits a definition from the router's public API schema while keeping it in
      the supergraph, so the router can still use it internally (for example as part of an
      entity key) even though clients cannot query it.
    ref: "concepts.md#federation-subgraphs-key-and-the-router"

  - id: graphql-schema-and-federation-048
    difficulty: intermediate
    tags: [federation, stitching, comparison]
    question: |
      What is the key philosophical difference between Apollo Federation and schema stitching?
    options:
      - "Federation only works with REST backends"
      - "Stitching supports subscriptions but federation does not"
      - "Federation is declarative — subgraphs declare relationships via directives and the router plans — while stitching centralizes join logic in gateway config"
      - "Stitching requires HTTP/2 while federation does not"
    answer: 2
    explanation: |
      Federation inverts control: subgraphs declare their own entity relationships via
      directives (@key etc.) and the router computes the plan. Stitching centralizes brittle
      type-merging config in the gateway, which becomes a bottleneck.
    ref: "concepts.md#federation-vs-schema-stitching-vs-monolith-vs-bff"

  - id: graphql-schema-and-federation-049
    difficulty: advanced
    tags: [federation, bff, architecture]
    question: |
      How do a BFF (Backend for Frontend) and Apollo Federation differ conceptually?
    options:
      - "They are the same thing with different names"
      - "A BFF can only serve REST, never GraphQL"
      - "Federation is client-side while a BFF is server-side"
      - "A BFF is about who the consumer is (one tailored graph per client, often over REST/gRPC); federation is about splitting the server graph across teams"
    answer: 3
    explanation: |
      A BFF tailors one graph per client and often aggregates non-GraphQL backends; federation
      splits the server graph across teams via subgraphs. They are complementary — a subgraph
      can itself be a BFF-style aggregator.
    ref: "concepts.md#federation-vs-schema-stitching-vs-monolith-vs-bff"

  - id: graphql-schema-and-federation-050
    difficulty: intermediate
    tags: [when-to-use, architecture, decision]
    question: |
      Which scenario most strongly favors GraphQL over REST?
    options:
      - "A simple public CRUD API where CDN/HTTP caching is a core requirement"
      - "Many heterogeneous clients needing different field slices of a richly connected graph, with rapid client iteration"
      - "Low-latency internal service-to-service calls needing strict binary contracts"
      - "Serving large binary file downloads"
    answer: 1
    explanation: |
      GraphQL shines when diverse clients need different slices of a connected graph and want
      to iterate quickly without new endpoints/versions. Cache-heavy public CRUD favors REST;
      internal low-latency RPC favors gRPC.
    ref: "concepts.md#when-to-choose-graphql-over-rest"

  - id: graphql-schema-and-federation-051
    difficulty: intermediate
    tags: [when-to-use, hybrid, architecture]
    question: |
      A senior engineer says "we use gRPC between services and expose a federated GraphQL
      supergraph to clients." What does this illustrate?
    options:
      - "A misconfiguration; the two cannot coexist"
      - "That GraphQL always replaces gRPC"
      - "That federation only works over gRPC"
      - "That the paradigms are complementary — internal RPC plus a client-facing aggregation graph is a common hybrid"
    answer: 3
    explanation: |
      Mature systems commonly combine styles: gRPC (or REST) at the service layer for typed
      low-latency calls, and a federated GraphQL supergraph or BFF as the client-facing
      aggregation. See also rest-vs-graphql-vs-grpc.
    ref: "concepts.md#when-to-choose-graphql-over-rest"

  - id: graphql-schema-and-federation-052
    difficulty: beginner
    tags: [when-to-use, rest]
    question: |
      Which situation argues for staying with REST instead of adopting GraphQL?
    options:
      - "You need aggressive CDN/HTTP caching on a simple public API"
      - "You have many client types each needing different field subsets"
      - "You are aggregating six backends behind one typed graph"
      - "You want clients to iterate without new backend endpoints"
    answer: 0
    explanation: |
      REST inherits the full HTTP caching stack, so a simple, public, cache-heavy API is a
      natural fit. The other options are classic GraphQL sweet spots.
    ref: "concepts.md#when-to-choose-graphql-over-rest"

  - id: graphql-schema-and-federation-053
    difficulty: advanced
    tags: [federation, override, migration]
    question: |
      A team wants to migrate ownership of a field from the Products subgraph to a new
      Catalog subgraph, ideally with a gradual percentage rollout. Which directive supports
      this?
    options:
      - "@provides"
      - "@external"
      - "@override(from: \"Products\")"
      - "@tag"
    answer: 2
    explanation: |
      @override(from:) declares that a field is now resolved by this subgraph instead of
      another, enabling field-ownership migration between subgraphs with optional progressive
      (percentage) rollout.
    ref: "concepts.md#federation-subgraphs-key-and-the-router"

  - id: graphql-schema-and-federation-054
    difficulty: intermediate
    tags: [schema-evolution, deprecation]
    question: |
      How does GraphQL typically handle API evolution instead of URL-based versioning like
      /v2?
    options:
      - "By requiring a new endpoint per schema change"
      - "By disabling introspection between versions"
      - "By adding fields freely and marking outdated ones with the @deprecated directive"
      - "By returning a version number in every error"
    answer: 2
    explanation: |
      GraphQL favors continuous evolution: additive changes are non-breaking, and outdated
      fields are marked @deprecated (with a reason) rather than spun into a new versioned
      endpoint. See also api-versioning-and-evolution.
    ref: "concepts.md#why-graphql-the-problems-it-solves"

  - id: graphql-schema-and-federation-055
    difficulty: advanced
    tags: [scenario, mutations, payload-design]
    question: |
      Following schema-design best practice, what should a `createPost` mutation return?
    options:
      - "Just a Boolean success flag"
      - "The raw database row with no wrapper"
      - "A dedicated payload type (e.g. CreatePostPayload) containing the created object and a typed userErrors field"
      - "An HTTP 201 status only, with an empty body"
    answer: 2
    explanation: |
      Mutations should return a dedicated payload type wrapping the affected object plus a
      typed userErrors list. This lets clients refetch/normalize the object and handle expected
      errors as data rather than parsing strings.
    ref: "concepts.md#schema-design-errors-as-data-vs-top-level-errors"

  - id: graphql-schema-and-federation-056
    difficulty: intermediate
    tags: [scenario, dataloader, n-plus-one]
    question: |
      Your GraphQL feed query is issuing hundreds of near-identical `SELECT * FROM users
      WHERE id = ?` queries per request. What is the most appropriate fix?
    options:
      - "Disable introspection in production"
      - "Mark the author field non-null"
      - "Add a global response cache keyed on query text only"
      - "Introduce a per-request DataLoader so author loads batch into one WHERE id IN (...) query"
    answer: 3
    explanation: |
      This is the N+1 symptom. A per-request DataLoader batches the individual author loads
      within a tick into a single WHERE id IN (...) query and memoizes duplicates, collapsing
      N+1 into ~2 queries.
    ref: "concepts.md#the-n1-problem-and-dataloader"
