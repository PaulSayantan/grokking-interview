topic: "Hypermedia & HATEOAS"
domain: rest-api-design
topic_slug: hypermedia-and-hateoas
version: 1
questions:
  - id: hypermedia-and-hateoas-001
    difficulty: beginner
    tags: [definition, acronym]
    question: |
      What does the acronym HATEOAS stand for?
    options:
      - "Hypermedia As The Engine Of Application State"
      - "HTTP And Transport Encoding Over Application Sockets"
      - "Hypertext Access To Endpoints Over Authenticated Sessions"
      - "Hyperlink-Aware Transport Enabling Object Access Standard"
    answer: 0
    explanation: |
      HATEOAS = Hypermedia As The Engine Of Application State, from Roy Fielding's REST
      dissertation. It means the client drives its interaction by following links/forms
      the server includes in responses, rather than hard-coding URLs and workflow.
    ref: "concepts.md#hateoas-and-the-richardson-maturity-model"

  - id: hypermedia-and-hateoas-002
    difficulty: beginner
    tags: [richardson, levels]
    question: |
      In the Richardson Maturity Model, which level corresponds to HATEOAS?
    options:
      - "Level 0"
      - "Level 3"
      - "Level 2"
      - "Level 1"
    answer: 1
    explanation: |
      Level 3 (Hypermedia Controls) is HATEOAS: it builds on Level 2's correct use of verbs
      and status codes by adding links/forms in responses that drive the next transition.
    ref: "concepts.md#hateoas-and-the-richardson-maturity-model"

  - id: hypermedia-and-hateoas-003
    difficulty: beginner
    tags: [richardson, level-2]
    question: |
      According to the Richardson Maturity Model, where do most production "REST" APIs
      actually sit?
    options:
      - "Level 0 — a single catch-all URI tunneling every operation over POST as RPC"
      - "Level 3 — full hypermedia-driven interaction with links embedded in every response"
      - "Level 2 — many resources with proper HTTP verbs and status codes, but no hypermedia"
      - "Level 1 — many distinct resource URIs but every call still tunneled over the POST verb"
    answer: 2
    explanation: |
      The industry overwhelmingly builds Level 2 APIs: resource URIs plus correct
      GET/POST/PUT/DELETE and status codes. Level 3 (hypermedia) is the least-adopted
      constraint because generic hypermedia clients are rare and the cost seldom pays off.
    ref: "concepts.md#hateoas-and-the-richardson-maturity-model"

  - id: hypermedia-and-hateoas-004
    difficulty: intermediate
    tags: [richardson, level-0, level-1]
    question: |
      An API exposes exactly one endpoint, /api, and every operation is sent as a POST whose
      body names the method to invoke. Which Richardson maturity level is this?
    options:
      - "Level 3 — hypermedia, because the body describes operations"
      - "Level 1 — resources, because each request carries a JSON body naming an entity"
      - "Level 2 — HTTP verbs, because it maps each POST to the correct resource URI"
      - "Level 0 — the Swamp of POX: one URI, one verb, RPC tunneled over HTTP"
    answer: 3
    explanation: |
      A single URI with a single verb (POST) carrying RPC-style operation names is Level 0,
      the "Swamp of POX" — plain-old-XML/JSON tunneled over HTTP, as in SOAP/XML-RPC.
      Level 1 introduces many resource URIs; Level 2 introduces proper verb usage.
    ref: "concepts.md#hateoas-and-the-richardson-maturity-model"

  - id: hypermedia-and-hateoas-005
    difficulty: intermediate
    tags: [fielding, definition, rest]
    question: |
      Roy Fielding has argued that an API is not truly "REST" unless it satisfies which
      constraint that most so-called REST APIs omit?
    options:
      - "Is hypertext/hypermedia-driven (HATEOAS)"
      - "Serializes every response as JSON rather than XML or any other wire format"
      - "Transports all traffic over HTTPS with TLS 1.3 for confidentiality and integrity"
      - "Returns a 200 status code for every successful call regardless of the operation"
    answer: 0
    explanation: |
      Fielding's "REST APIs must be hypertext-driven" post states that without the hypermedia
      constraint an API is HTTP-based RPC, not REST. Most APIs stop at Level 2, which he would
      not call REST in the strict sense.
    ref: "concepts.md#hateoas-and-the-richardson-maturity-model"

  - id: hypermedia-and-hateoas-006
    difficulty: intermediate
    tags: [level-2-vs-3, state]
    question: |
      A Level-2 order response is {"id":42,"status":"AWAITING_PAYMENT","total":30.00}. What
      is the essential thing a Level-3 (hypermedia) version adds?
    options:
      - "It encrypts the id and total fields with a per-resource key for security at rest"
      - "It includes links describing the transitions currently available (e.g. pay, cancel)"
      - "It gzip-compresses the payload so the response body travels more efficiently"
      - "It renames the fields to camelCase so they match a strict organization-wide schema"
    answer: 1
    explanation: |
      Level 3 carries hypermedia controls — state-dependent links like pay/cancel — so the
      client discovers what it can do next from the response instead of hard-coding the
      workflow from out-of-band docs.
    ref: "concepts.md#hateoas-and-the-richardson-maturity-model"

  - id: hypermedia-and-hateoas-007
    difficulty: advanced
    tags: [state-machine, affordances]
    question: |
      In a well-designed HATEOAS API, why do the links returned for an order change as the
      order moves from AWAITING_PAYMENT to PAID?
    options:
      - "Because the HTTP spec mandates a distinct set of links be emitted for each status code"
      - "Because cache invalidation of the prior representation automatically rewrites the old links"
      - "Because the available links represent the valid state transitions for the resource's current state, so the server advertises only what is legal now"
      - "Because the response media type switches from hal+json to siren+json between states"
    answer: 2
    explanation: |
      \"Hypermedia as the engine of application state\" means the representation carries the
      currently-valid transitions. An AWAITING_PAYMENT order offers pay/cancel; once PAID the
      server drops those and offers refund/track-shipment. The client renders whatever is present.
    ref: "concepts.md#hateoas-and-the-richardson-maturity-model"

  - id: hypermedia-and-hateoas-008
    difficulty: beginner
    tags: [controls, links, actions]
    question: |
      What is a "hypermedia control" in a REST representation?
    options:
      - "A rate-limit counter attached to the response telling the client its remaining quota"
      - "A CORS header controlling which cross-origin scripts may read the response"
      - "A checksum embedded in the body used to validate the payload against corruption in transit"
      - "An element that tells the client about a possible interaction — e.g. a link or a form/action"
    answer: 3
    explanation: |
      A hypermedia control is anything in the representation that describes a possible next
      interaction: a link (URL + relation) or a richer action/affordance (URL + method +
      fields). It is how the server tells the client what it can do.
    ref: "concepts.md#hypermedia-controls-links-and-actions"

  - id: hypermedia-and-hateoas-009
    difficulty: intermediate
    tags: [links, actions, difference]
    question: |
      What is the key difference between a hypermedia "link" and a hypermedia "action"
      (affordance)?
    options:
      - "A link is just a URL + relation (implying a safe GET), while an action also specifies the HTTP method and the input fields for a state-changing request"
      - "A link is always fetched over HTTPS whereas an action is always submitted over plain HTTP"
      - "A link is machine-readable metadata while an action is a human-only label with no target URL"
      - "There is no meaningful difference; the two terms are fully interchangeable in every format"
    answer: 0
    explanation: |
      A link gives a URL and a rel and, by default, implies a GET. An action is the
      equivalent of an HTML form: it describes the method (POST/PUT/DELETE), the target,
      the content type, and the expected fields for a state-changing operation.
    ref: "concepts.md#hypermedia-controls-links-and-actions"

  - id: hypermedia-and-hateoas-010
    difficulty: advanced
    tags: [hal, actions, limitation]
    question: |
      You need the server to tell clients HOW to submit a state change (method + body fields),
      not just where. Which statement is correct?
    options:
      - "HAL and JSON:API natively describe the method plus input fields for every action they carry"
      - "HAL and JSON:API are link-only; to describe method + fields you need Siren, Collection+JSON, or JSON-LD/Hydra"
      - "No JSON-based hypermedia format is capable of describing an action's HTTP method and fields"
      - "Only the RFC 8288 Link HTTP header can convey an action's method and its expected fields"
    answer: 1
    explanation: |
      HAL and JSON:API carry links (href + rel) but not the method or input fields of an
      action. Siren, Collection+JSON, and JSON-LD/Hydra express full actions with method and
      fields, like HTML forms.
    ref: "concepts.md#hypermedia-controls-links-and-actions"

  - id: hypermedia-and-hateoas-011
    difficulty: intermediate
    tags: [actions, html-analogy]
    question: |
      A Siren action { "name":"add-item","method":"POST","href":"/orders/42/items",
      "fields":[{"name":"quantity","type":"number"}] } is most analogous to which HTML
      construct?
    options:
      - "An <a href> anchor link"
      - "An <img> tag"
      - "A <form method=\"POST\"> with input fields"
      - "A <meta> tag"
    answer: 2
    explanation: |
      An action that specifies a method and input fields is the machine-readable equivalent
      of an HTML <form>: it tells the client where to submit, with which verb, and what data
      to include. A bare link is more like an <a href>.
    ref: "concepts.md#hypermedia-controls-links-and-actions"

  - id: hypermedia-and-hateoas-012
    difficulty: beginner
    tags: [rfc-8288, web-linking]
    question: |
      Which RFC defines Web Linking and the HTTP Link header?
    options:
      - "RFC 7231"
      - "RFC 9457"
      - "RFC 6749"
      - "RFC 8288"
    answer: 3
    explanation: |
      RFC 8288 (Web Linking) defines links abstractly, the HTTP Link header serialization,
      and governs the IANA Link Relation Types registry.
    ref: "concepts.md#link-relations-and-rfc-8288-web-linking"

  - id: hypermedia-and-hateoas-013
    difficulty: intermediate
    tags: [rfc-8288, rfc-5988, obsoletes]
    question: |
      RFC 8288 (Web Linking) obsoletes which earlier RFC?
    options:
      - "RFC 5988"
      - "RFC 7807"
      - "RFC 2616"
      - "RFC 8259"
    answer: 0
    explanation: |
      RFC 8288 obsoletes RFC 5988, the original Web Linking specification. (For reference,
      RFC 9457 obsoletes 7807 for Problem Details — a different topic.)
    ref: "concepts.md#link-relations-and-rfc-8288-web-linking"

  - id: hypermedia-and-hateoas-014
    difficulty: intermediate
    tags: [link-header, syntax]
    question: |
      Given the response header:
      Link: <https://api.example.com/orders?page=3>; rel="next",
            <https://api.example.com/orders?page=5>; rel="last"
      What does it convey?
    options:
      - "That the client is currently viewing pages 3 and 5 of the collection simultaneously"
      - "The URL of the next page and the URL of the last page, each tagged with a link relation"
      - "That pages 3 and 5 have been cached by an intermediary and may be served stale"
      - "That the client must issue a POST to each of those URLs to retrieve the pages"
    answer: 1
    explanation: |
      The Link header carries comma-separated links, each as <target-URI>; rel="...". Here it
      advertises the next page and the last page of a paged collection. GitHub uses exactly
      this pattern for pagination.
    ref: "concepts.md#link-relations-and-rfc-8288-web-linking"

  - id: hypermedia-and-hateoas-015
    difficulty: advanced
    tags: [extension-rel, uri]
    question: |
      Your API needs a custom relation for "cancel this order." Per RFC 8288, how should an
      extension (non-registered) relation type be expressed?
    options:
      - "As a bare short token like \"cancel\""
      - "As a numeric code assigned by IANA"
      - "As an absolute URI, e.g. https://api.example.com/rels/cancel-order, so it is globally unambiguous"
      - "As a base64-encoded string"
    answer: 2
    explanation: |
      Registered relations are bare tokens from the IANA registry (self, next, ...).
      Extension relations that are not registered must be absolute URIs so they are globally
      unambiguous. HAL's CURIE mechanism exists to abbreviate these long URIs.
    ref: "concepts.md#link-relations-and-rfc-8288-web-linking"

  - id: hypermedia-and-hateoas-016
    difficulty: intermediate
    tags: [link-header, format-independent]
    question: |
      Why is the Link HTTP header useful even for a plain Level-2 API that returns ordinary
      JSON with no hypermedia envelope?
    options:
      - "It automatically rewrites the plain JSON body into a HAL _links envelope for the client"
      - "It replaces the need for HTTP status codes by signalling success or failure via rels"
      - "It forces existing clients to upgrade to Level 3 before they can read any response"
      - "It is format-independent — you can add pagination or describedby links without changing the response body or its media type"
    answer: 3
    explanation: |
      Because links live in a header, you can add next/prev pagination or a describedby link
      (to an OpenAPI/JSON Schema doc) to any response — even a binary download — without
      touching the body or introducing a new media type.
    ref: "concepts.md#link-relations-and-rfc-8288-web-linking"

  - id: hypermedia-and-hateoas-017
    difficulty: beginner
    tags: [self, rel]
    question: |
      What does the "self" link relation identify?
    options:
      - "The canonical URI of the current resource"
      - "The next page of results"
      - "The user's own profile"
      - "The API's root/home document"
    answer: 0
    explanation: |
      The self rel gives the canonical URI of the resource being represented, so a client can
      re-fetch or bookmark it and know its identity even when it was reached via a search or
      collection.
    ref: "concepts.md#common-link-relations-self-next-prev-related"

  - id: hypermedia-and-hateoas-018
    difficulty: beginner
    tags: [pagination, next, prev]
    question: |
      In a paged collection, which pair of link relations point to the following and
      preceding pages?
    options:
      - "up and down"
      - "next and prev"
      - "forward and backward"
      - "more and less"
    answer: 1
    explanation: |
      next and prev are the registered relations for the following and preceding pages.
      (prev is the registered token; "previous" appears as a synonym but prev is preferred.)
      first and last point to the ends of the collection.
    ref: "concepts.md#common-link-relations-self-next-prev-related"

  - id: hypermedia-and-hateoas-019
    difficulty: intermediate
    tags: [up, related, hierarchy]
    question: |
      From a line-item resource, which link relation conventionally points to its parent
      order in a containment hierarchy?
    options:
      - "self"
      - "next"
      - "up"
      - "describedby"
    answer: 2
    explanation: |
      The up relation points to the parent resource in a containment hierarchy — e.g. from a
      line item up to its order. related is a looser "some related resource" when no more
      specific rel fits.
    ref: "concepts.md#common-link-relations-self-next-prev-related"

  - id: hypermedia-and-hateoas-020
    difficulty: advanced
    tags: [self, decoupling, url]
    question: |
      Why does a robust hypermedia client store and follow the server-supplied "self" link
      rather than reconstructing a resource's URL from its ID?
    options:
      - "Because reconstructing a URL from an ID and a template is far too computationally expensive to do on every single request"
      - "Because the HTTP specification explicitly forbids placing raw resource IDs inside URL path segments"
      - "Because a server-supplied self link is always shorter on the wire than any client-reconstructed URL would be"
      - "So the server can change its URL scheme without breaking the client, which only depends on following links, not building them"
    answer: 3
    explanation: |
      Storing the self link keeps the client decoupled from URL construction. If the server
      relocates or reshapes URLs, a link-following client keeps working because it never
      builds the URL itself — it depends only on the stable link relation.
    ref: "concepts.md#common-link-relations-self-next-prev-related"

  - id: hypermedia-and-hateoas-021
    difficulty: intermediate
    tags: [describedby, rel]
    question: |
      A response includes Link: <https://api.example.com/schema/order.json>; rel="describedby".
      What is this telling the client?
    options:
      - "Where to find a description/schema of this resource (e.g. its JSON Schema or profile)"
      - "The URL of the next page of results in this paginated collection of orders"
      - "That this specific resource has been deprecated and will be removed in a later API release"
      - "The user account that originally created this resource and currently owns it"
    answer: 0
    explanation: |
      The describedby relation points to a description of the current resource — commonly a
      JSON Schema, OpenAPI, or profile document. It lets clients discover the resource's
      contract at runtime.
    ref: "concepts.md#common-link-relations-self-next-prev-related"

  - id: hypermedia-and-hateoas-022
    difficulty: beginner
    tags: [hal, media-type]
    question: |
      What is the media type for a HAL JSON document?
    options:
      - "application/json"
      - "application/hal+json"
      - "application/vnd.api+json"
      - "application/ld+json"
    answer: 1
    explanation: |
      HAL JSON uses application/hal+json (and application/hal+xml for the XML variant).
      application/vnd.api+json is JSON:API and application/ld+json is JSON-LD.
    ref: "concepts.md#hal-hypertext-application-language"

  - id: hypermedia-and-hateoas-023
    difficulty: beginner
    tags: [hal, reserved-properties]
    question: |
      Which two reserved properties does HAL add to a JSON object?
    options:
      - "_meta and _errors"
      - "data and included"
      - "_links and _embedded"
      - "actions and entities"
    answer: 2
    explanation: |
      HAL reserves _links (a map of rel to link object(s)) and _embedded (related resources
      inlined to save round trips, each itself a HAL document). data/included are JSON:API;
      actions/entities are Siren.
    ref: "concepts.md#hal-hypertext-application-language"

  - id: hypermedia-and-hateoas-024
    difficulty: intermediate
    tags: [hal, embedded, chattiness]
    question: |
      What is the purpose of HAL's _embedded property?
    options:
      - "To store the OAuth bearer and refresh tokens the client should reuse on subsequent requests"
      - "To hold a gzip-compressed copy of the _links section so link-heavy responses stay small"
      - "To describe the HTTP method and expected request body fields the client must use for an action"
      - "To inline related resources in the response, reducing the number of round trips a client must make"
    answer: 3
    explanation: |
      _embedded inlines related resources (each a HAL document) so the client does not have to
      make separate requests to follow every link. It is HAL's answer to chattiness — at the
      cost of a larger payload and some coupling.
    ref: "concepts.md#hal-hypertext-application-language"

  - id: hypermedia-and-hateoas-025
    difficulty: advanced
    tags: [hal, templated, uri-template]
    question: |
      A HAL link is { "href": "/orders{?page,size}", "templated": true }. What does
      templated:true indicate?
    options:
      - "The href is a URI Template (RFC 6570) with variables the client must expand"
      - "The link is deprecated and the server will stop honoring this href in a future release"
      - "The href points to a server-side HTML template that renders the resource for browsers"
      - "The href must be dereferenced with a POST request rather than the usual GET"
    answer: 0
    explanation: |
      templated:true marks the href as an RFC 6570 URI Template. The client substitutes
      variables (here page and size) before dereferencing — e.g. /orders?page=2&size=20.
    ref: "concepts.md#hal-hypertext-application-language"

  - id: hypermedia-and-hateoas-026
    difficulty: advanced
    tags: [hal, curie, extension-rel]
    question: |
      What problem do CURIEs (compact URIs) solve in HAL?
    options:
      - "They encrypt link target URIs so intermediaries cannot see where a relation points"
      - "They abbreviate long absolute extension-relation URIs into short prefixed names (e.g. ea:items) while keeping them self-documenting"
      - "They compress the _embedded section so large inlined resource trees travel more efficiently"
      - "They automatically convert a HAL document into the equivalent JSON:API resource format"
    answer: 1
    explanation: |
      Extension relations must be absolute URIs, which are verbose. A CURIE defines a prefix
      (via a curies link) so a rel like ea:items expands to a full documentation URI, keeping
      custom relations short yet self-documenting.
    ref: "concepts.md#hal-hypertext-application-language"

  - id: hypermedia-and-hateoas-027
    difficulty: intermediate
    tags: [hal, limitation, actions]
    question: |
      What is HAL's deliberate limitation compared with Siren?
    options:
      - "HAL cannot represent nested or related resources inside a single response document"
      - "HAL provides no way to express next/prev pagination links across a collection"
      - "HAL models links only (href + rel) and cannot describe an action's HTTP method or input fields"
      - "HAL can only be serialized as XML and has no JSON representation at all"
    answer: 2
    explanation: |
      HAL intentionally carries links only. A client following next knows to GET it, but for
      a state change it must know out-of-band which method and body to use. This minimalism is
      exactly why HAL is the most widely adopted format.
    ref: "concepts.md#hal-hypertext-application-language"

  - id: hypermedia-and-hateoas-028
    difficulty: beginner
    tags: [jsonapi, media-type]
    question: |
      What is the media type mandated by the JSON:API specification?
    options:
      - "application/json"
      - "application/vnd.siren+json"
      - "application/hal+json"
      - "application/vnd.api+json"
    answer: 3
    explanation: |
      JSON:API requires application/vnd.api+json. Using it exactly is a JSON:API-specific
      rule; conforming servers and clients must send this media type.
    ref: "concepts.md#jsonapi"

  - id: hypermedia-and-hateoas-029
    difficulty: intermediate
    tags: [jsonapi, resource-object]
    question: |
      In JSON:API, a resource object is structured primarily around which fields?
    options:
      - "type, id, attributes, relationships (plus links)"
      - "class, properties, actions"
      - "_links and _embedded"
      - "@context, @id, @type"
    answer: 0
    explanation: |
      Every JSON:API resource is {type, id, attributes, relationships, links}. class/
      properties/actions are Siren; _links/_embedded are HAL; @context/@id/@type are JSON-LD.
    ref: "concepts.md#jsonapi"

  - id: hypermedia-and-hateoas-030
    difficulty: intermediate
    tags: [jsonapi, compound-documents, included]
    question: |
      What does the top-level "included" array carry in a JSON:API compound document?
    options:
      - "A list of error objects describing every validation failure encountered in the request"
      - "Sideloaded related resources, to reduce round trips (analogous to HAL's _embedded)"
      - "The list of HTTP methods the client is allowed to invoke on the primary resource"
      - "The opaque pagination cursors marking the first and last pages of the collection"
    answer: 1
    explanation: |
      included holds sideloaded (compound) related resources so a single response can satisfy
      several needs — the JSON:API analogue of HAL's _embedded and Siren's sub-entities.
    ref: "concepts.md#jsonapi"

  - id: hypermedia-and-hateoas-031
    difficulty: advanced
    tags: [jsonapi, links-vs-actions]
    question: |
      Which statement most accurately characterizes JSON:API's hypermedia model?
    options:
      - "It carries no links whatsoever, relying entirely on out-of-band documentation for navigation"
      - "It fully specifies actions with their HTTP method and input fields exactly the way Siren does"
      - "It is primarily link-based (self/related/pagination) and does not define generic form/action affordances the way Siren does"
      - "It is identical to HAL, reusing the same _embedded property and CURIE prefixing mechanism"
    answer: 2
    explanation: |
      JSON:API standardizes the whole payload (identity, relationships, sparse fieldsets,
      pagination, errors) and provides links at document/resource/relationship levels, but it
      is link-based — it does not define generic action/form affordances the way Siren does.
    ref: "concepts.md#jsonapi"

  - id: hypermedia-and-hateoas-032
    difficulty: beginner
    tags: [siren, media-type]
    question: |
      Which format is specifically designed around entities and "actions," using the media
      type application/vnd.siren+json?
    options:
      - "HAL"
      - "JSON:API"
      - "JSON-LD"
      - "Siren"
    answer: 3
    explanation: |
      Siren (application/vnd.siren+json) centers on entities with class, properties, entities,
      links, and — distinctively — actions that describe state-changing operations.
    ref: "concepts.md#siren"

  - id: hypermedia-and-hateoas-033
    difficulty: intermediate
    tags: [siren, actions, fields]
    question: |
      What makes Siren well suited to APIs that must drive workflow/state transitions?
    options:
      - "Its actions carry name, method, href, type, and fields — a machine-readable form the client can render without hard-coding how to build the request"
      - "It uses a binary encoding that compresses workflow-heavy payloads far more tightly than HAL"
      - "It needs no registered media type, so any generic JSON client can consume it directly"
      - "It supports only GET requests, keeping every state transition safe and idempotent"
    answer: 0
    explanation: |
      A Siren action describes the full request: method, target href, content type, and input
      fields. A generic client can render a real form/button for each valid action, which is
      why Siren fits state-machine-style APIs.
    ref: "concepts.md#siren"

  - id: hypermedia-and-hateoas-034
    difficulty: intermediate
    tags: [siren, class, properties]
    question: |
      In a Siren entity, what does the "class" attribute convey?
    options:
      - "The CSS class name a browser should apply when rendering the entity on screen"
      - "The nature/type of the entity (e.g. [\"order\"]), usable by clients for logic or styling"
      - "The HTTP status class (2xx, 4xx) that produced this entity in the response"
      - "The OAuth authorization scope a caller must hold to read the entity"
    answer: 1
    explanation: |
      Siren's class describes the kind of entity (e.g. ["order"]) so a client can apply
      type-specific logic or presentation. properties holds the data fields; actions and links
      carry the hypermedia controls.
    ref: "concepts.md#siren"

  - id: hypermedia-and-hateoas-035
    difficulty: beginner
    tags: [json-ld, media-type, w3c]
    question: |
      What is JSON-LD?
    options:
      - "A compact binary encoding of JSON designed to shrink payloads on the wire"
      - "A proprietary Amazon format for structuring and shipping application log records"
      - "A W3C Recommendation for representing Linked Data in JSON, using @context/@id/@type"
      - "An HTTP header standard defining how servers advertise pagination links to clients"
    answer: 2
    explanation: |
      JSON-LD (application/ld+json) is a W3C Recommendation for Linked Data in JSON. @context
      maps terms to global IRIs, @id gives a global identifier, and @type gives the type. It
      is heavily used for SEO/schema.org as well as APIs.
    ref: "concepts.md#json-ld-and-hydra"

  - id: hypermedia-and-hateoas-036
    difficulty: intermediate
    tags: [json-ld, context]
    question: |
      What is the primary role of the "@context" in a JSON-LD document?
    options:
      - "It stores the bearer authentication token the client presents on follow-up requests"
      - "It defines the opaque pagination cursor pointing at the next page of the collection"
      - "It lists the HTTP methods a client is permitted to invoke against the document"
      - "It maps the document's plain terms to global IRIs so the data is unambiguous across organizations"
    answer: 3
    explanation: |
      @context binds each term in the document to a globally-scoped IRI, so consumers from
      different organizations interpret the same terms consistently — the essence of Linked
      Data / semantic interoperability.
    ref: "concepts.md#json-ld-and-hydra"

  - id: hypermedia-and-hateoas-037
    difficulty: advanced
    tags: [hydra, json-ld, actions]
    question: |
      Plain JSON-LD is a data format, not a hypermedia-controls format. What does Hydra add on
      top of it?
    options:
      - "Hypermedia controls such as hydra:Operation (method + expected/returned types) and hydra:Collection, plus an ApiDocumentation for discovering operations"
      - "End-to-end encryption of the JSON-LD payload plus signed request bodies, layered on top of the base @context"
      - "A compact binary transport protocol that replaces HTTP's text framing to move JSON-LD documents more efficiently"
      - "A mandatory OAuth 2.0 scope vocabulary every JSON-LD document must declare in its @context before a client reads it"
    answer: 0
    explanation: |
      Hydra is a vocabulary layered on JSON-LD that adds hypermedia controls — hydra:Operation
      (method and expected/returned types), hydra:Collection with paging, hydra:Link, and
      ApiDocumentation — so JSON-LD + Hydra can express full actions like Siren, while staying
      semantic.
    ref: "concepts.md#json-ld-and-hydra"

  - id: hypermedia-and-hateoas-038
    difficulty: intermediate
    tags: [json-ld, seo, tradeoff]
    question: |
      Which statement about JSON-LD is accurate?
    options:
      - "It is used only inside REST API response bodies and, unlike plain JSON, cannot appear in HTML pages or be consumed by any non-API tooling"
      - "It is widely used for SEO (schema.org markup consumed by search engines) as well as APIs, and offers high interoperability at the cost of linked-data/RDF conceptual overhead"
      - "It cannot represent relationships between resources, so every linked entity must be duplicated inline rather than referenced by a global identifier"
      - "It is simpler and lighter-weight than HAL, carrying no context or type metadata and therefore adding no conceptual overhead at all"
    answer: 1
    explanation: |
      JSON-LD is a general Linked-Data format: heavily used for SEO via schema.org, and
      capable of full hypermedia APIs when combined with Hydra. Its trade-off is high
      interoperability but the greatest conceptual overhead (RDF/contexts).
    ref: "concepts.md#json-ld-and-hydra"

  - id: hypermedia-and-hateoas-039
    difficulty: intermediate
    tags: [choosing, comparison, hal-vs-siren]
    question: |
      Your client must render valid "next-action" buttons entirely from the server response,
      including the HTTP method and request fields. Which choice is most appropriate?
    options:
      - "HAL, because it is the most popular format and its _links already encode the method and fields for each action"
      - "The RFC 8288 Link header alone, since a rel plus href fully conveys the HTTP method and request body a client must send"
      - "Siren (or JSON-LD/Hydra), because it can describe actions with method and fields; HAL cannot"
      - "Plain application/json with no envelope, relying on the client to infer each action's verb and payload from field names"
    answer: 2
    explanation: |
      Rendering valid actions from the server requires method + fields, which HAL and JSON:API
      do not express. Siren (or JSON-LD/Hydra) is the right fit for action/workflow-driven
      clients.
    ref: "concepts.md#choosing-a-hypermedia-format"

  - id: hypermedia-and-hateoas-040
    difficulty: intermediate
    tags: [choosing, link-header, pagination]
    question: |
      You want to add pagination discoverability to an existing Level-2 JSON API with the
      least disruption to current clients. What is the lowest-friction option?
    options:
      - "Rewrite every response as JSON:API, adopting its resource-object envelope and vnd.api+json media type across all endpoints"
      - "Convert the whole API to Siren so pagination rides in its entities/actions structure that existing clients already parse"
      - "Switch the media type to application/hal+json for all responses and move the page links into a _links envelope"
      - "Add next/prev/first/last links via the RFC 8288 Link HTTP header, leaving the body and media type unchanged"
    answer: 3
    explanation: |
      The Link header adds pagination links without changing the response body or media type,
      so existing clients that ignore the header are unaffected while new clients can follow
      the links. It is the cheapest way to bolt hypermedia onto a Level-2 API.
    ref: "concepts.md#choosing-a-hypermedia-format"

  - id: hypermedia-and-hateoas-041
    difficulty: advanced
    tags: [choosing, jsonapi, tooling]
    question: |
      A team wants a whole-payload standard (identity, relationships, sparse fieldsets,
      pagination, errors) with off-the-shelf client libraries so generic clients can consume
      any of their services. Which format best matches this goal?
    options:
      - "JSON:API"
      - "The bare RFC 8288 Link header, which by itself standardizes identity, relationships, sparse fieldsets, and error shape"
      - "Plain application/json with an ad-hoc house style each service defines for relationships, fieldsets, and pagination"
      - "XML-RPC, which offers mature generic client libraries for consuming relationships and sparse fieldsets over HTTP"
    answer: 0
    explanation: |
      JSON:API standardizes the entire payload shape and has mature client tooling (e.g.
      Ember Data and other libraries), letting generic clients consume any conforming service.
      The trade-off is a heavier, stricter format.
    ref: "concepts.md#choosing-a-hypermedia-format"

  - id: hypermedia-and-hateoas-042
    difficulty: beginner
    tags: [benefits, discoverability]
    question: |
      Which is a genuine benefit of HATEOAS?
    options:
      - "Guaranteed lower latency than any non-hypermedia API, because embedded links let the client skip the initial DNS and TLS handshake"
      - "Discoverability — a client can start at a root document and explore the API by following link relations, like a site map"
      - "Automatic elimination of authentication, since following server-supplied links proves the caller is already authorized for each"
      - "Smaller payloads than a Level-2 API, because the hypermedia envelope replaces the resource fields rather than adding to them"
    answer: 1
    explanation: |
      A key HATEOAS benefit is discoverability/self-documentation: from a single entry point a
      client (or human/tool) can navigate the API by following rels, rather than consulting a
      URL cookbook. It does not reduce payload size — it adds an envelope.
    ref: "concepts.md#benefits-discoverability-loose-coupling-evolvability"

  - id: hypermedia-and-hateoas-043
    difficulty: intermediate
    tags: [benefits, loose-coupling, url]
    question: |
      How does HATEOAS enable a server to relocate resources or reshape its URL paths without
      breaking well-written clients?
    options:
      - "By embedding a new /v2/ path segment on every change so old clients transparently fall through to the relocated resource"
      - "By sending a 301 permanent redirect for every request so clients rewrite their hard-coded URL templates automatically"
      - "Because clients depend on stable link relations and follow the hrefs the server returns, rather than hard-coding URL templates"
      - "Because resource URLs are content-addressed hashes of the payload and are therefore guaranteed never to change"
    answer: 2
    explanation: |
      Clients that follow server-supplied links depend only on the stable rels, not on the URL
      structure. The server can move or reshard resources and correctly-written clients keep
      working — the loose-coupling benefit.
    ref: "concepts.md#benefits-discoverability-loose-coupling-evolvability"

  - id: hypermedia-and-hateoas-044
    difficulty: advanced
    tags: [benefits, evolvability, workflow]
    question: |
      A business rule changes so that orders over $500 now require approval before payment.
      In a HATEOAS design, how can this be reflected with minimal client change?
    options:
      - "Every client must be redeployed with the new $500 threshold hard-coded into its order-workflow logic before payment works again"
      - "The rule cannot be expressed until the server switches from hal+json to siren+json so the new approval step has a place to live"
      - "The API must bump to a new major version and expose a parallel /v2/orders tree carrying the approval step"
      - "The server advertises the valid transitions per state — offering an \"approve\" link instead of \"pay\" for those orders — so clients adapt by rendering whatever links are present"
    answer: 3
    explanation: |
      Because the server advertises available transitions per state, changing which links
      appear expresses the new workflow. Clients that render present links adapt automatically
      instead of re-implementing the state machine — the evolvability benefit.
    ref: "concepts.md#benefits-discoverability-loose-coupling-evolvability"

  - id: hypermedia-and-hateoas-045
    difficulty: intermediate
    tags: [benefits, state-driven-ui, authorization]
    question: |
      How can HATEOAS help keep authorization/business logic on the server rather than
      duplicated in every client?
    options:
      - "By having the client render actions (e.g. a Cancel button) only when the corresponding link/affordance is present in the response"
      - "By shipping the authorization rules as obfuscated, encrypted client code that only the server holds the key to decrypt"
      - "By requiring every client to call a dedicated /authorize endpoint before each request and cache the boolean verdict it returns"
      - "By embedding the server's own authorization source code in each response so the client can evaluate the same rules locally"
    answer: 0
    explanation: |
      If the server includes a cancel affordance only when cancelling is currently allowed for
      this user/state, the client simply shows the button when the link exists. The rule lives
      on the server; clients don't reimplement it.
    ref: "concepts.md#benefits-discoverability-loose-coupling-evolvability"

  - id: hypermedia-and-hateoas-046
    difficulty: intermediate
    tags: [costs, complexity, client]
    question: |
      Which is a legitimate criticism of HATEOAS that a strong candidate would volunteer?
    options:
      - "It forces the server to retain per-client session state between requests, violating REST's stateless-server constraint"
      - "Truly generic clients that discover everything at runtime are hard to write and rare, so in practice clients still hard-code some rels and shapes, only partly realizing the decoupling"
      - "It is fundamentally incompatible with HTTP's request/response model and requires a bespoke transport to carry links"
      - "It forbids the use of JSON entirely, mandating XML or another markup format so links can be expressed as elements"
    answer: 1
    explanation: |
      A fair criticism: the fully-generic client that would justify Level 3 is rare and hard
      to build. Most clients still hard-code relations and shapes, so hypermedia reduces but
      does not eliminate out-of-band knowledge.
    ref: "concepts.md#costs-and-criticisms-complexity-adoption-chattiness"

  - id: hypermedia-and-hateoas-047
    difficulty: intermediate
    tags: [costs, chattiness, embedding]
    question: |
      "Chattiness" is a common criticism of hypermedia APIs. How do the formats typically
      mitigate it?
    options:
      - "By forbidding any link relation beyond self, so the client never has additional resources it might fetch"
      - "By having intermediaries cache every response for a fixed 24 hours so repeated link-following is served locally"
      - "By embedding related resources inline (HAL _embedded, JSON:API included, Siren sub-entities) so one response satisfies several needs"
      - "By requiring HTTP/2 server push to proactively stream every linked resource before the client asks for it"
    answer: 2
    explanation: |
      Following links from the root every time causes many round trips. Embedding related
      resources inline (_embedded / included / sub-entities) collapses several fetches into
      one — at the cost of larger payloads and some reintroduced coupling.
    ref: "concepts.md#costs-and-criticisms-complexity-adoption-chattiness"

  - id: hypermedia-and-hateoas-048
    difficulty: advanced
    tags: [costs, tooling, openapi]
    question: |
      Why does HATEOAS often clash with mainstream API tooling and SDKs?
    options:
      - "Because mainstream API tooling cannot parse the JSON envelopes that hypermedia formats like HAL and Siren wrap resources in"
      - "Because HTTP client libraries are unable to send the custom Accept or profile headers hypermedia content negotiation depends on"
      - "Because hypermedia responses carry links that logging and tracing pipelines are unable to record or index for later inspection"
      - "Because OpenAPI-centric tooling, code generators, and most SDKs assume fixed URLs and don't consume runtime links well, making caching and testing harder"
    answer: 3
    explanation: |
      Most SDKs and generators are built around fixed, documented URLs and don't follow
      server-provided links at runtime. That ecosystem gap — plus harder caching and testing —
      is a practical reason teams skip Level 3.
    ref: "concepts.md#costs-and-criticisms-complexity-adoption-chattiness"

  - id: hypermedia-and-hateoas-049
    difficulty: advanced
    tags: [costs, hal-actions, coupling]
    question: |
      Why can link-only formats like HAL partially undercut the loose-coupling promise of
      HATEOAS?
    options:
      - "Because they don't describe how to perform a state change (method + body), so clients still hard-code methods and request shapes"
      - "Because they expose so many overlapping link relations that clients couple tightly to the specific rels they happen to recognize"
      - "Because they can only be serialized as XML, forcing clients to couple to a rigid schema-defined document structure"
      - "Because they cannot express the self relation, so clients must reconstruct each resource's own URL and couple to its scheme"
    answer: 0
    explanation: |
      HAL/JSON:API tell you a URL and rel but not the method or fields for a state change, so
      clients must hard-code those — reintroducing coupling and weakening the decoupling
      hypermedia was supposed to provide.
    ref: "concepts.md#costs-and-criticisms-complexity-adoption-chattiness"

  - id: hypermedia-and-hateoas-050
    difficulty: intermediate
    tags: [when-worth-it, public-api]
    question: |
      In which scenario is HATEOAS most likely to be worth its cost?
    options:
      - "A first-party API where one team ships the client and server together on the same release"
      - "A public API with many long-lived clients you cannot upgrade in lockstep, where URLs/workflows change over time"
      - "A high-volume machine-to-machine call path that is latency-sensitive"
      - "A trivial CRUD endpoint with a single internal consumer"
    answer: 1
    explanation: |
      HATEOAS pays off when you have many independently-evolving clients you don't control and
      URLs/workflows change — runtime discovery lets those changes be non-breaking. First-party
      coupled deploys and latency-critical paths usually don't justify it.
    ref: "concepts.md#when-hateoas-is-worth-it-and-why-most-apis-are-level-2"

  - id: hypermedia-and-hateoas-051
    difficulty: intermediate
    tags: [when-worth-it, internal-api, openapi]
    question: |
      For an internal first-party API where the same team owns and deploys both client and
      server together, what is usually the more cost-effective choice than full HATEOAS?
    options:
      - "Always adopt Siren with full action affordances regardless, so the co-deployed client renders every state transition from the response"
      - "Return Level 0 POX over a single endpoint, tunneling each operation as a POST body naming the method to invoke"
      - "A shared, well-documented contract (e.g. OpenAPI) at Level 2, since runtime discovery adds cost without a decoupling payoff here"
      - "Drop HTTP verbs entirely and route everything through one action field in the JSON body to keep both ends simpler"
    answer: 2
    explanation: |
      When both ends ship together, a shared OpenAPI contract captures most of REST's benefits
      more cheaply than runtime hypermedia discovery. The decoupling HATEOAS buys isn't needed
      when you can update both sides at once.
    ref: "concepts.md#when-hateoas-is-worth-it-and-why-most-apis-are-level-2"

  - id: hypermedia-and-hateoas-052
    difficulty: advanced
    tags: [when-worth-it, industry-reality]
    question: |
      Which statement best reflects the industry reality about REST maturity levels?
    options:
      - "Nearly all production APIs are Level 3 hypermedia-driven, emitting state-dependent link and action affordances in every response"
      - "Level 0 POX over a single RPC endpoint is the most common design shipped by modern SaaS providers today"
      - "Level 3 hypermedia is required before an API is permitted to use HTTP verbs and status codes at all"
      - "Most APIs are Level 2, because Level 2 + good docs + Link-header pagination captures most of REST's practical benefits at a fraction of the cost, and the fully-dynamic client that would justify Level 3 rarely materializes"
    answer: 3
    explanation: |
      The industry converged on Level 2 + OpenAPI + Link-header pagination as capturing most
      of REST's value cheaply. Stripe, Twilio, and most SaaS are Level 2; the hypothetical
      generic client that would repay Level 3 rarely appears.
    ref: "concepts.md#when-hateoas-is-worth-it-and-why-most-apis-are-level-2"

  - id: hypermedia-and-hateoas-053
    difficulty: intermediate
    tags: [interview, nuance, level-2]
    question: |
      In an interview, why is it risky to claim "my API is REST" simply because it uses nouns
      and HTTP verbs?
    options:
      - "Because by Fielding's definition that is Level 2 / HTTP RPC; true REST requires the hypermedia constraint — a candidate should either implement it or honestly justify a pragmatic Level-2 design"
      - "Because REST forbids the use of HTTP verbs, so relying on GET and POST alone actually disqualifies the API from the label"
      - "Because REST bans nouns in URL paths and mandates verb-based endpoints like /getOrder, which noun-based routes violate"
      - "Because REST is formally defined on top of SOAP, so an API without a SOAP envelope cannot claim the term at all"
    answer: 0
    explanation: |
      Fielding reserves "REST" for hypermedia-driven APIs. A nuanced answer names the API as a
      pragmatic Level-2 HTTP API and explains why Level 3 wasn't worth it — interviewers reward
      that far more than the buzzword.
    ref: "concepts.md#when-hateoas-is-worth-it-and-why-most-apis-are-level-2"

  - id: hypermedia-and-hateoas-054
    difficulty: advanced
    tags: [scenario, format-selection]
    question: |
      A payments provider exposes an API to thousands of external merchants. Order objects go
      through a complex state machine (authorize, capture, refund, dispute), and the provider
      wants merchant integrations to keep working as it evolves URLs and adds states. Merchant
      apps are diverse and updated on their own schedules. Which approach is best justified?
    options:
      - "Level 0 POX over a single /api endpoint, for simplicity, tunneling authorize/capture/refund as POST bodies naming the method"
      - "A hypermedia design (e.g. Siren or JSON-LD/Hydra) that advertises the valid next actions per state, so merchants follow server-driven transitions instead of hard-coding the state machine"
      - "A Level-2 API with resource URLs hard-coded into every merchant SDK and no links, so each state change is a fixed documented path"
      - "GraphQL with no published schema, letting each merchant query whatever order fields and transitions it guesses might exist"
    answer: 1
    explanation: |
      Many uncontrolled clients + an evolving state machine + changing URLs is the textbook
      case where hypermedia earns its keep. An action-capable format (Siren/Hydra) lets the
      server advertise valid transitions so merchants adapt without redeploying hard-coded logic.
    ref: "concepts.md#when-hateoas-is-worth-it-and-why-most-apis-are-level-2"

  - id: hypermedia-and-hateoas-055
    difficulty: advanced
    tags: [scenario, hal-limitation]
    question: |
      A team ships a HAL API. A client developer complains they can't tell from the response
      whether "cancel" should be a DELETE or a POST, or what body to send. What is the correct
      diagnosis?
    options:
      - "The server has a serialization bug and must resend the response with the method and body fields injected into each HAL _links entry"
      - "HAL links always imply POST for any state change, so cancel should be sent as a POST with an empty body per the hal+json specification"
      - "This is expected: HAL carries links only (href + rel), not the method or fields; the client needs out-of-band docs, or the API should use an action-capable format like Siren"
      - "The client should infer the verb from the rel name, since HAL mandates that a rel of \"cancel\" maps deterministically to DELETE"
    answer: 2
    explanation: |
      HAL deliberately models links without method or fields. The developer's confusion is
      inherent to HAL — they need out-of-band documentation for the method/body, or the API
      should adopt Siren/Collection+JSON/Hydra to express full actions.
    ref: "concepts.md#hal-hypertext-application-language"

  - id: hypermedia-and-hateoas-056
    difficulty: intermediate
    tags: [scenario, link-header, github]
    question: |
      GitHub's list endpoints return pagination via a header like
      Link: <...?page=2>; rel="next", <...?page=34>; rel="last". A client wants robust
      pagination. What is the recommended approach?
    options:
      - "Hard-code sequential page numbers starting at 1 and keep incrementing until the endpoint returns a 404 signalling the end of the collection"
      - "Send a DELETE request to the URL tagged rel=\"last\" to jump straight to the final page of the paginated result set"
      - "Ignore the Link header entirely and estimate the total page count by dividing an X-Total-Count value from the first page by the page size"
      - "Follow the URL given by the rel=\"next\" link until no next link is present, rather than constructing page URLs itself"
    answer: 3
    explanation: |
      The resilient pattern is to follow the server-provided next link until it disappears.
      This is link-driven pagination: the client never builds page URLs, so the server can
      change its paging scheme (e.g. switch to cursors) without breaking clients.
    ref: "concepts.md#common-link-relations-self-next-prev-related"

  - id: hypermedia-and-hateoas-057
    difficulty: beginner
    tags: [rfc-6570, uri-template]
    question: |
      HAL's templated:true links reference which specification for the variable-expansion
      syntax?
    options:
      - "RFC 6570 (URI Template)"
      - "RFC 8288 (Web Linking)"
      - "RFC 7519 (JWT)"
      - "RFC 9457 (Problem Details)"
    answer: 0
    explanation: |
      URI Templates are defined by RFC 6570. A templated HAL href like /orders{?page,size} is
      expanded by substituting the named variables before the client dereferences it.
    ref: "concepts.md#hal-hypertext-application-language"

  - id: hypermedia-and-hateoas-058
    difficulty: intermediate
    tags: [registered-rel, iana]
    question: |
      Which of the following is a registered IANA link relation you can use as a bare token
      (no absolute URI required)?
    options:
      - "cancel-order"
      - "related"
      - "com.example.doThing"
      - "my-custom-rel"
    answer: 1
    explanation: |
      related is in the IANA Link Relation Types registry and may be used as a bare token.
      Domain-specific relations like cancel-order are not registered and must be expressed as
      absolute URIs (optionally abbreviated with CURIEs).
    ref: "concepts.md#link-relations-and-rfc-8288-web-linking"

  - id: hypermedia-and-hateoas-059
    difficulty: advanced
    tags: [comparison, formats, actions]
    question: |
      Which set of formats can natively express a full action (target URL + HTTP method +
      input fields), as opposed to links only?
    options:
      - "HAL and JSON:API, since both carry a method and fields[] block on every link object"
      - "Only the RFC 8288 Link HTTP header, whose rel and href together fully imply the method"
      - "Siren, Collection+JSON, and JSON-LD/Hydra"
      - "Only plain application/json with a conventional _action key naming the verb and body"
    answer: 2
    explanation: |
      Siren, Collection+JSON, and JSON-LD/Hydra describe actions with method and fields (like
      HTML forms). HAL and JSON:API are link-based and cannot express the method/fields of a
      state-changing operation.
    ref: "concepts.md#choosing-a-hypermedia-format"

  - id: hypermedia-and-hateoas-060
    difficulty: beginner
    tags: [entry-point, discoverability]
    question: |
      In a hypermedia API, what is the typical starting point from which a client discovers the
      rest of the API?
    options:
      - "A hard-coded list of every endpoint compiled into the client and refreshed only when the client is redeployed"
      - "A DNS TXT record on the API's domain enumerating the base paths of each available resource collection"
      - "The API's database schema, exported at build time so the client can derive every resource URL from the table names"
      - "A single entry-point/root (\"home\") document whose links lead to the available resources and collections"
    answer: 3
    explanation: |
      Hypermedia clients bootstrap from one well-known entry point (a root/home document) and
      follow its links to discover collections and resources — the site-map-style
      discoverability that HATEOAS enables.
    ref: "concepts.md#benefits-discoverability-loose-coupling-evolvability"

  - id: hypermedia-and-hateoas-061
    difficulty: advanced
    tags: [hal-forms, media-type]
    question: |
      HAL-FORMS uses the media type application/prs.hal-forms+json. What does the "prs." tree
      in that media type signify, and how must a client treat such a document?
    options:
      - "prs. means it is an IANA-registered standards-tree media type ratified alongside hal+json, so the two are fully interchangeable and a client may parse either as the other"
      - "prs. marks a personal/vendor-adjacent (draft) media type that is NOT part of the HAL spec, so it MUST NOT be treated as plain application/hal+json even though it is designed to be backward-compatible"
      - "prs. means the document is a protected resource requiring an OAuth bearer token before the media type may be parsed at all"
      - "prs. indicates a pre-release schema in the IANA provisional registry that conformant clients are required to reject outright"
    answer: 1
    explanation: |
      The prs. tree denotes a personal media type (from a Mike Amundsen working draft), not part
      of the HAL specification. A HAL-FORMS document must not be treated as plain
      application/hal+json, though it is designed to remain backward-compatible with HAL.
    ref: "concepts.md#hal-forms-describing-writes-in-hal"

  - id: hypermedia-and-hateoas-062
    difficulty: advanced
    tags: [hal-forms, templates, writes]
    question: |
      In HAL-FORMS, which top-level construct describes how to perform a write, and what does
      each entry specify?
    options:
      - "_links, where each link's rel deterministically implies the HTTP method and the request body fields the client should send"
      - "An actions[] array borrowed from Siren, each entry carrying only a class and an href with no method or field descriptors"
      - "_templates (conventionally keyed \"default\"), each specifying method, contentType, target, and a properties[] array of form fields"
      - "_embedded, which inlines a ready-to-send request body template the client copies verbatim into its write call"
    answer: 2
    explanation: |
      HAL-FORMS adds a top-level _templates object alongside HAL's _links/_embedded. The
      conventional key is "default"; each template carries method, contentType (defaulting to
      application/json), target (defaulting to self), title, and properties[] describing the
      fields — HAL's route to Siren-grade affordances.
    ref: "concepts.md#hal-forms-describing-writes-in-hal"

  - id: hypermedia-and-hateoas-063
    difficulty: expert
    tags: [hal-forms, options, enumerations]
    question: |
      A HAL-FORMS "currency" property must offer a fixed enumeration, while a "assignee"
      property must offer a list fetched dynamically from another endpoint. How does HAL-FORMS
      express these two cases?
    options:
      - "Both must be hard-coded as an inline array on the property; HAL-FORMS has no mechanism to reference a list fetched from a remote endpoint"
      - "Two distinct _templates keyed by property name, one per field, because an individual property object cannot itself carry any options descriptor"
      - "A separate _embedded HAL document per selectable option value, one sub-resource for each choice the client may pick"
      - "options with an \"inline\" array for the fixed set, and options with a \"link\" (href + templated) to fetch values by reference, with promptField/valueField/minItems/maxItems controlling selection"
    answer: 3
    explanation: |
      A HAL-FORMS property's options can list values inline (options.inline) or fetch them by
      reference via options.link (href + templated), with minItems/maxItems/promptField/valueField
      governing how selections are made. This handles both fixed enumerations and dynamically
      sourced lists.
    ref: "concepts.md#hal-forms-describing-writes-in-hal"

  - id: hypermedia-and-hateoas-064
    difficulty: expert
    tags: [iana, registration, rfc-8288]
    question: |
      Per RFC 8288, what is the registration policy for adding a new bare-token relation to the
      IANA Link Relation Types registry?
    options:
      - "First Come First Served — any submitted token is added automatically to the registry with no review of its semantics or documentation"
      - "Standards Action — only a token defined in an IETF Standards-Track RFC approved by the IESG may ever be added to the registry"
      - "Specification Required — you supply a stable public specification of the relation's semantics, reviewed by a Designated Expert"
      - "Private Use — bare tokens are never centrally registered and are instead minted independently within each organization's own namespace"
    answer: 2
    explanation: |
      RFC 8288 sets the policy for registered relations at "Specification Required" (RFC 8126):
      you must provide a stable, public specification of the relation's semantics, and a
      Designated Expert reviews it before the bare token is added.
    ref: "concepts.md#registering-link-relations-the-iana-process"

  - id: hypermedia-and-hateoas-065
    difficulty: advanced
    tags: [iana, extension-rel, best-practice]
    question: |
      Your service needs a domain-specific "cancel-order" transition. Which approach is the
      standards-correct default, and why?
    options:
      - "Mint an extension URI under a domain you control (e.g. https://api.example.com/rels/cancel-order), because it is globally unambiguous by construction and needs no registration"
      - "Invent the bare token \"cancel-order\" and use it directly, since RFC 8288 permits any unregistered short token so long as it is hyphen-delimited"
      - "File for IANA registration and wait for Designated-Expert approval before any use, since RFC 8288 requires every custom rel to be registered first"
      - "Reuse the registered \"edit\" rel for every custom transition, treating it as the generic catch-all relation for all writable affordances"
    answer: 0
    explanation: |
      For an internal/domain-specific relation the pragmatic, correct default is to mint an
      extension URI under a domain you own — globally unambiguous, no registration needed.
      Squatting on a bare token risks colliding with a future registered token of different
      semantics; IANA registration is reserved for genuinely web-reusable rels.
    ref: "concepts.md#registering-link-relations-the-iana-process"

  - id: hypermedia-and-hateoas-066
    difficulty: advanced
    tags: [rels, create-form, edit-form, edit]
    question: |
      In link-only formats, how do the registered relations "edit-form" and "edit" differ?
    options:
      - "They are exact synonyms registered as aliases; both point at the same resource you PUT to in order to modify it"
      - "edit-form links to a resource that DESCRIBES how to edit (a form/HAL-FORMS doc), whereas edit points at the resource you may PUT/PATCH/DELETE to modify directly"
      - "edit is the registered relation for creating a new resource while edit-form is the relation reserved for deleting an existing one"
      - "edit-form is only valid inside a Siren entities block, whereas edit may appear only within a HAL _links object"
    answer: 1
    explanation: |
      edit-form (RFC 6861) points at a resource describing how to edit the current one — e.g. a
      HAL-FORMS document — bridging the links-only gap. edit points at the resource you PUT/PATCH/
      DELETE to modify it directly. A HAL response can carry create-form/edit-form links to reach
      writable affordances.
    ref: "concepts.md#form-and-affordance-link-relations"

  - id: hypermedia-and-hateoas-067
    difficulty: intermediate
    tags: [rels, service-desc, service-doc]
    question: |
      A root document wants to advertise both its machine-readable OpenAPI description and its
      human-readable developer docs. Which registered relations fit best?
    options:
      - "self pointing at the OpenAPI document and up pointing at the human developer docs one level above the root"
      - "describedby for both the OpenAPI spec and the dev docs, since each in its own way describes the service"
      - "service-desc for the machine-readable description (e.g. OpenAPI) and service-doc for the human documentation"
      - "next pointing at the OpenAPI description and prev pointing back to the human documentation, as a paginated pair"
    answer: 2
    explanation: |
      service-desc points at a machine-readable service description (such as an OpenAPI document)
      while service-doc points at human documentation. This is exactly how a root/home document
      can link to its own OpenAPI spec and its dev-portal docs.
    ref: "concepts.md#form-and-affordance-link-relations"

  - id: hypermedia-and-hateoas-068
    difficulty: expert
    tags: [profile, rfc-6906, semantics]
    question: |
      Two APIs both return application/hal+json, but the field meanings differ. Per RFC 6906,
      what is the standards-based way to convey the application-level semantics without minting
      a brand-new media type?
    options:
      - "Add a custom X-Semantics response header naming the schema URL, which clients read to disambiguate the differing field meanings"
      - "Change the media type on each API to a bespoke application/order+json so the two responses can never be confused by a client"
      - "Encode the semantic profile into a dedicated URL path segment (e.g. /schema/order/) that the client parses out of the request URI"
      - "Use the \"profile\" link relation and/or the \"profile\" media-type parameter (e.g. Content-Type: application/hal+json;profile=\"https://schemas.example.com/order\"), which a client can also request via Accept"
    answer: 3
    explanation: |
      RFC 6906 defines the profile link relation and matching profile media-type parameter to
      layer application semantics onto a generic media type. It can be sent as a Link header /
      per-link profile property, or negotiated via the profile parameter on Content-Type/Accept —
      without inventing a new media type.
    ref: "concepts.md#the-profile-link-relation-and-media-type-parameter"

  - id: hypermedia-and-hateoas-069
    difficulty: advanced
    tags: [profile, rfc-6906, parsing]
    question: |
      What constraint does RFC 6906 place on a profile relative to the base media type?
    options:
      - "A profile MUST NOT change how the base media type is parsed; it only adds meaning/constraints on top"
      - "A profile MAY redefine how the base media type is parsed, effectively introducing a new grammar that overrides the base type's own processing rules"
      - "A profile replaces the base media type entirely during content negotiation, so the client matches on the profile URI instead of the media type"
      - "A profile is only valid once it has been formally registered with IANA in the same registry as the base media type it augments"
    answer: 0
    explanation: |
      A profile is additive: it MUST NOT alter how the base media type is parsed or processed —
      it only layers application semantics (field meanings, expected rels). A client that ignores
      the profile still parses the document correctly as its base media type.
    ref: "concepts.md#the-profile-link-relation-and-media-type-parameter"

  - id: hypermedia-and-hateoas-070
    difficulty: expert
    tags: [security, authorization, bola, bfla]
    question: |
      A team omits the "cancel" affordance for users who lack permission, then relies on that
      omission as the ONLY access control. Which best describes the flaw?
    options:
      - "It is fine — a client physically cannot invoke a link that was never serialized into the response it received, so omission is sufficient protection"
      - "It is a security anti-pattern: a client can forge the URL+method seen elsewhere, so authorization MUST still be enforced server-side per request; hiding it invites BOLA (API1) and BFLA (API5)"
      - "It only fails if the API uses HAL rather than Siren, because Siren actions bind an authorization scope to each affordance"
      - "It is safe as long as the affordance links are transmitted over HTTPS, since TLS prevents a client from replaying an omitted URL"
    answer: 1
    explanation: |
      Affordance presence is a UX/discoverability signal, not an authorization mechanism. A caller
      can forge any observed URL+method, so the server MUST enforce authorization on every request.
      Relying on hidden affordances invites Broken Object Level Authorization (API1) and Broken
      Function Level Authorization (API5) in the OWASP API Top 10.
    ref: "concepts.md#hypermedia-and-security-affordances-are-not-authorization"

  - id: hypermedia-and-hateoas-071
    difficulty: expert
    tags: [security, information-leak, affordances]
    question: |
      Beyond forged requests, what subtler risk arises from emitting a state-dependent affordance
      like "escalate-to-fraud-team" only for flagged accounts?
    options:
      - "It increases the response payload size beyond the HTTP body limit, causing the affordance to be silently truncated for flagged accounts"
      - "It forces the client to switch to a different media type whenever the escalate affordance appears, breaking content negotiation"
      - "The mere presence of the affordance leaks business/internal state — the caller learns they are flagged — so affordance visibility itself can be an information-disclosure vector"
      - "It disables HTTP caching for the response, because a state-dependent affordance makes the representation permanently uncacheable by intermediaries"
    answer: 2
    explanation: |
      Leaking affordances can leak business state: exposing an escalate-to-fraud-team link tells
      the caller they have been flagged. Affordance presence must be reasoned about as potential
      information disclosure, not just as a UX convenience.
    ref: "concepts.md#hypermedia-and-security-affordances-are-not-authorization"

  - id: hypermedia-and-hateoas-072
    difficulty: expert
    tags: [caching, embedding, linking, rfc-9111]
    question: |
      A frequently-changing order embeds a rarely-changing customer via HAL _embedded. From a
      caching standpoint (RFC 9111), what is the main downside versus linking to the customer?
    options:
      - "Embedding always violates the HTTP caching rules of RFC 9111 and produces a response no shared cache is permitted to store"
      - "Embedding forces the client to send a separate If-None-Match conditional header for every individual field of the inlined customer"
      - "Linking to the customer prevents that sub-resource from ever being cached independently, unlike an embedded copy"
      - "The embedded customer loses its independent freshness/validator — it shares the order's short lifetime and is re-sent constantly, and mutating the customer doesn't invalidate the composite order URL that holds a stale copy"
    answer: 3
    explanation: |
      Embedding folds the sub-resource into the parent's body, so it shares the parent's
      Cache-Control/ETag/Last-Modified. A rarely-changing customer embedded in a fast-changing
      order is re-sent needlessly, and updating the customer doesn't invalidate the composite
      order URL. Embedding trades round trips for coarser, harder-to-invalidate caching.
    ref: "concepts.md#hypermedia-and-caching-embedding-vs-linking"

  - id: hypermedia-and-hateoas-073
    difficulty: advanced
    tags: [versioning, media-type, rels]
    question: |
      A candidate claims "HATEOAS eliminates API versioning." What is the accurate correction?
    options:
      - "It does not eliminate versioning; it relocates it. URL churn becomes non-breaking, but the media type, link-relation semantics, and field/profile contract still evolve and are versioned (often via media-type parameters or new profiles)"
      - "Correct — once clients follow server-supplied links exclusively, the media type, rel semantics, and field contracts can all change freely with zero client impact, so versioning becomes entirely unnecessary"
      - "It makes versioning technically impossible, because link-driven clients cannot tolerate any schema change at all, so once published a hypermedia API must be frozen forever and can never add a field or relation"
      - "It removes versioning pressure only for safe GET requests, since links point at readable resources; state-changing verbs like POST, PUT, and DELETE still require an explicit /v2/ path bump on every change"
    answer: 0
    explanation: |
      Hypermedia kills URL-versioning pressure (the server can relocate endpoints) but moves the
      problem: clients still couple to media types, rel semantics, and field/profile contracts,
      which you version — typically via media-type parameters or new profiles negotiated with
      Accept, not via a /v2/ path.
    ref: "concepts.md#versioning-and-hypermedia"

  - id: hypermedia-and-hateoas-074
    difficulty: expert
    tags: [versioning, deprecation, sunset, rfc-8594]
    question: |
      You want to phase out an old link relation gracefully rather than hard-break clients. Which
      combination of in-band signals is standards-aligned?
    options:
      - "Return a 500 Internal Server Error whenever a client dereferences the old rel, so the resulting failures pressure client teams into migrating off the deprecated relation on their own schedule"
      - "HAL's link-object \"deprecation\" property (a URL flagging the link as deprecated) plus RFC 8594's Sunset response header and \"sunset\" link relation announcing when/why the resource goes away, while advertising the replacement link"
      - "Silently remove the rel from responses without any signal; correctly-written hypermedia clients will automatically re-discover the replacement relation by re-crawling from the root entry point"
      - "Only bump the resource URL to a /v2/ path, since HTTP and the hypermedia formats define no in-band mechanism for flagging a link relation or resource as deprecated ahead of removal"
    answer: 1
    explanation: |
      HAL link objects carry a deprecation URL marking a link as deprecated; RFC 8594 adds the
      Sunset response header (a date after which the resource is expected to be unresponsive) and
      the companion sunset link relation. Together with advertising the replacement link, these
      let you retire a rel/resource without a hard version break.
    ref: "concepts.md#versioning-and-hypermedia"

  - id: hypermedia-and-hateoas-075
    difficulty: expert
    tags: [openapi, links, design-time-vs-runtime]
    question: |
      A developer points to OpenAPI 3.x "Link Objects" and says "so OpenAPI gives us HATEOAS."
      What is the precise distinction?
    options:
      - "There is no distinction; an OpenAPI Link Object is serialized verbatim into every matching response body at runtime, so a spec that declares Links automatically ships concrete next-links exactly as HATEOAS requires"
      - "OpenAPI Links fully replace runtime hypermedia and are strictly superior, because tooling resolves each declared operationId into a live href inside the response, evaluating the caller's current state and permissions on every call"
      - "OpenAPI Links are design-time descriptions in the spec file that say operation X could be followed by operation Y (via operationId/operationRef); true HATEOAS puts concrete next links in the response body at runtime, based on actual state and permissions"
      - "It is the reverse: OpenAPI Link Objects are resolved at runtime from live state, whereas hypermedia links are fixed at design time in the spec and merely copied unchanged into each response body"
    answer: 2
    explanation: |
      An OpenAPI Link Object lives in the API description, not in responses. It statically says
      "after X you could call Y," identifying Y by operationId/operationRef and wiring inputs with
      runtime expressions. HATEOAS instead emits the currently-valid concrete links in the response
      body at runtime — dynamic, state- and permission-dependent.
    ref: "concepts.md#openapi-links-are-not-runtime-hateoas"

  - id: hypermedia-and-hateoas-076
    difficulty: advanced
    tags: [openapi, links, runtime-expressions]
    question: |
      In an OpenAPI Link Object, how is the target operation identified and how are its inputs
      wired from a prior response?
    options:
      - "By an absolute target URL only, copied verbatim into the spec, with the follow-on request's inputs hard-coded as static literal values alongside it"
      - "By a CURIE prefix defined in the components section, whose expansion names the follow-on operation and whose suffix carries the parameter values to send"
      - "By the HTTP status code returned by the previous call, which the tooling maps to a specific operation and whose response headers become the new request's parameters"
      - "By operationId or operationRef, with inputs supplied via runtime expressions such as $response.body#/id or $response.header.Location"
    answer: 3
    explanation: |
      An OpenAPI Link names the follow-on operation by operationId or operationRef and populates
      its parameters using runtime expressions like $response.body#/id or
      $response.header.Location. This is still a design-time, documentation/tooling construct — not
      a runtime link in the payload.
    ref: "concepts.md#openapi-links-are-not-runtime-hateoas"

  - id: hypermedia-and-hateoas-077
    difficulty: advanced
    tags: [errors, rfc-9457, problem-details]
    question: |
      Why is RFC 9457 (Problem Details) described as "quietly hypermedia-flavored"?
    options:
      - "Because its \"type\" member is a URI identifying the problem kind (SHOULD dereference to docs) and \"instance\" is a URI identifying the specific occurrence — both effectively links — and extension members can carry recovery affordances"
      - "Because the specification mandates a HAL _links block, complete with self and about relations, inside every application/problem+json error body it defines"
      - "Because it requires the application/vnd.siren+json media type for all error responses so that each failure carries fully-described recovery actions with method and fields"
      - "Because it strictly forbids any URIs anywhere in error bodies, forcing all problem identifiers to be opaque numeric codes rather than dereferenceable links"
    answer: 0
    explanation: |
      In RFC 9457 the type member is a URI identifying the problem type (ideally dereferenceable
      to documentation) and instance is a URI for the specific occurrence — both are effectively
      links. Extension members let an error carry real affordances (e.g. retry/authenticate/help
      links), so even failures can drive the next transition.
    ref: "concepts.md#errors-as-hypermedia-rfc-9457-problem-details"

  - id: hypermedia-and-hateoas-078
    difficulty: expert
    tags: [errors, recovery, affordances]
    question: |
      Using RFC 9457 extension members, how can a 429 Too Many Requests or a 403 error do more
      than report failure — how can it drive recovery?
    options:
      - "By overriding the status code to 200 OK while placing the real error in the body, which signals the client to transparently retry the original request after a short backoff"
      - "By carrying affordances such as a link to rate-limit documentation, or an authenticate/help link telling the client how to recover, turning the error into a next transition rather than a dead end"
      - "By embedding the full server-side stack trace and internal exception chain in an extension member, which the client parses to determine the precise line of code to retry against"
      - "By requiring the client to abandon REST and re-issue the failed operation as a GraphQL mutation, since Problem Details recovery affordances are only interpretable over a GraphQL transport"
    answer: 1
    explanation: |
      Because Problem Details permits extension members (including an _links block or
      retry/authenticate/help links), a 429 can point at rate-limit docs and a 402/403 can point
      at how to authenticate or upgrade. The error advertises the recovery path instead of being a
      dead end.
    ref: "concepts.md#errors-as-hypermedia-rfc-9457-problem-details"

  - id: hypermedia-and-hateoas-079
    difficulty: advanced
    tags: [html, htmx, hda]
    question: |
      What is the core claim of the htmx / "Hypermedia Systems" (2023) argument about HTML and
      Hypermedia-Driven Applications (HDA)?
    options:
      - "HTML is an obsolete presentation format and JSON hypermedia types like HAL and Siren are strictly superior carriers of affordances, so HDA advocates replacing server-rendered markup with JSON envelopes everywhere"
      - "HDA abandons HTTP in favor of a purpose-built binary framing protocol, arguing that only a custom transport can carry HTML fragments and their embedded affordances efficiently enough for interactive use"
      - "HTML natively ships affordances (<a href> for links, <form> for actions) understood by a universal client (the browser); the pivot to JSON \"REST\" was really a pivot to RPC-style JSON that discarded hypermedia, and HDA returns HTML fragments carrying the next affordances for the client to swap into the DOM"
      - "htmx collapses all of HTTP's verbs into a single catch-all POST endpoint, tunneling every interaction as an operation name in the request body the way a Level-0 RPC API would"
    answer: 2
    explanation: |
      The argument: HTML is the one mainstream format with built-in affordances (anchors and
      forms) understood by the browser, so JSON "REST" APIs largely discarded hypermedia in favor
      of RPC-style JSON. htmx operationalizes HDA — the server returns HTML fragments with the next
      affordances and the client swaps them into the DOM. The interview value is knowing the debate
      is current.
    ref: "concepts.md#html-as-hypermedia-and-the-hda-revival"

  - id: hypermedia-and-hateoas-080
    difficulty: expert
    tags: [microservices, bff, edge]
    question: |
      At system altitude, where does hypermedia most credibly earn its place, and where is it
      usually overhead?
    options:
      - "It belongs on internal service-to-service RPC paths, where runtime link discovery decouples tightly-coupled microservices, and it is pure overhead at the public edge where clients are diverse"
      - "It is only useful for advertising static file downloads, where a self link and a describedby link to a checksum give clients everything they could need"
      - "It should be applied uniformly on every hop — edge and internal alike — for architectural consistency, since mixing hypermedia and typed RPC across tiers is what creates coupling problems"
      - "It earns its place at the edge (public APIs and BFFs driving a UI with state-dependent action links), while internal service-to-service calls are usually Level 2 or typed gRPC where both ends deploy together and latency matters"
    answer: 3
    explanation: |
      The staff-level answer: use hypermedia at the edge — public APIs and BFFs that return
      state-dependent affordances so the UI renders valid next-steps without re-encoding the
      workflow. Internal service-to-service calls favor Level 2 or typed gRPC, where coupled
      deploys and latency make runtime discovery pure overhead.
    ref: "concepts.md#where-hypermedia-fits-in-a-microservices-topology"

  - id: hypermedia-and-hateoas-081
    difficulty: expert
    tags: [rfc-6570, uri-template, query]
    question: |
      A base URL already contains a query string (…/orders?status=open) and you want a templated
      link that APPENDS a filter parameter. Which RFC 6570 operator is correct, and why?
    options:
      - "{&filter} — query continuation, which emits &filter=… to append to an existing query, whereas {?filter} would wrongly emit a second ? that starts the query"
      - "{?filter} — it detects the existing query string and correctly appends with & instead of emitting a duplicate leading ? when one is already present"
      - "{+filter} — reserved expansion, which is the operator required for appending any query parameter because it leaves reserved characters like & and = unescaped"
      - "{/filter} — path-segment expansion, the standard RFC 6570 way to append filter parameters onto a URL that already carries a query string"
    answer: 0
    explanation: |
      {?var} starts a query string with ?; {&var} is query continuation and emits &var=… to append
      to an existing query. When the base URL already has query params you use {&filter}, or you
      would emit a malformed second ?.
    ref: "concepts.md#uri-templates-in-depth-rfc-6570"

  - id: hypermedia-and-hateoas-082
    difficulty: expert
    tags: [rfc-6570, explode, level-4]
    question: |
      With RFC 6570, given a variable tags = ["red","blue"], how does the Level-4 explode
      modifier {tags*} in a query context (e.g. {?tags*}) expand it?
    options:
      - "tags=red,blue (the explode star comma-joins the list into one parameter, and the bare {?tags} form instead repeats it)"
      - "tags=red&tags=blue (each list element becomes its own repeated parameter)"
      - "tags=%5Bred%2Cblue%5D (the explode modifier percent-encodes the list as a single URL-escaped JSON array value)"
      - "tags=red (the explode modifier emits only the first element of the list, discarding every value after it)"
    answer: 1
    explanation: |
      The explode modifier (*) is a Level-4 feature: {?tags*} expands a list to repeated
      parameters — tags=red&tags=blue — and an object to k1=v1&k2=v2. Without the star,
      {?tags} would comma-join into a single tags=red,blue.
    ref: "concepts.md#uri-templates-in-depth-rfc-6570"

  - id: hypermedia-and-hateoas-083
    difficulty: expert
    tags: [jsonapi, hal, includes, client-vs-server]
    question: |
      A key contrast between JSON:API's "include" and HAL's "_embedded" is WHO controls what
      gets inlined. Which statement is accurate?
    options:
      - "Both are strictly server-driven; the server alone decides what gets inlined in each, and neither include nor _embedded exposes any query parameter a client could use to influence the compounded set"
      - "It is reversed: HAL is client-driven via _embedded query parameters that select which sub-resources to inline, whereas JSON:API's include is fixed server-side and cannot be shaped by the caller"
      - "JSON:API is client-driven — include=author,comments and sparse fieldsets (fields[articles]=title,body) let the CLIENT request what is compounded/trimmed — whereas HAL's _embedded is server-driven (the server decides what to inline)"
      - "Both are client-driven through the identical mechanism: each exposes an include query parameter and sparse-fieldset syntax, so the two are interchangeable in how the caller shapes inlined resources"
    answer: 2
    explanation: |
      JSON:API lets the client shape the response: include=author,comments chooses which related
      resources are compounded into included, and fields[type]=… (sparse fieldsets) trims
      attributes. HAL's _embedded is server-driven — the server decides what to inline. That
      client-vs-server control is a strong discriminator.
    ref: "concepts.md#jsonapi-v11-curies-and-client-driven-includes"

  - id: hypermedia-and-hateoas-084
    difficulty: advanced
    tags: [jsonapi, v1.1, media-type-parameters]
    question: |
      JSON:API v1.1 relaxed the once-strict "no media-type parameters" rule. Which parameters did
      it introduce, negotiated on the application/vnd.api+json media type?
    options:
      - "charset and boundary, e.g. application/vnd.api+json; charset=\"utf-8\"; boundary=\"…\""
      - "cursor and page, e.g. application/vnd.api+json; cursor=\"…\"; page=\"…\" for negotiating pagination"
      - "version and compression, e.g. application/vnd.api+json; version=\"1.1\"; compression=\"gzip\""
      - "ext (extensions) and profile (profiles), e.g. application/vnd.api+json; ext=\"…\"; profile=\"…\""
    answer: 3
    explanation: |
      v1.1 added an extensions mechanism and a profiles mechanism, both negotiated via media-type
      parameters — application/vnd.api+json; ext="…"; profile="…" — relaxing the earlier rule that
      the media type must carry no parameters. It also upgraded bare-string links to link objects
      with href + meta and added a document-level describedby link.
    ref: "concepts.md#jsonapi-v11-curies-and-client-driven-includes"

  - id: hypermedia-and-hateoas-085
    difficulty: advanced
    tags: [collection-json, template, queries]
    question: |
      Collection+JSON is action-capable despite being collection-centric. Which two constructs
      give it write and search affordances?
    options:
      - "A \"template\" object (the write model / fields to fill when creating or updating an item) and a \"queries\" array (templated search affordances whose data describes query params)"
      - "A _links map and an _embedded block, the two reserved members that carry its write template and its templated search affordances respectively"
      - "An actions array and an entities array, borrowed from Siren, which together describe both the write model and the collection's search queries"
      - "An @context object and an @type keyword, borrowed from JSON-LD, which define the write fields and the semantic type of each search affordance"
    answer: 0
    explanation: |
      Collection+JSON carries a template object describing the fields to fill for a POST/PUT
      (the write model) and a queries array of templated search affordances (each with data
      describing the query parameters). That makes it action-capable, unlike link-only HAL.
    ref: "concepts.md#collectionjson-and-other-formats-to-know"

  - id: hypermedia-and-hateoas-086
    difficulty: expert
    tags: [zalando, google-aip, pagination, tradeoff]
    question: |
      Two influential guideline sets take a nuanced stance on link-based pagination. Which pair
      is stated correctly?
    options:
      - "Zalando #166 MANDATES Link headers for all JSON entity bodies as the canonical pagination channel; Google AIP-158 requires structured, client-parseable page tokens the caller may decode and reconstruct"
      - "Zalando #166 MUST NOT use Link headers with JSON entities (put links in the body instead); Google AIP-158 mandates opaque, non-parseable page_tokens the client must not decode or construct"
      - "Both guideline sets forbid paginating collections at all, mandating instead that every list endpoint return its complete result set in a single unbounded response"
      - "Zalando's guidelines require full Level 3 HATEOAS with action affordances on every API, while Google's AIP series bans hypermedia links from responses outright as an anti-pattern"
    answer: 1
    explanation: |
      Zalando #166 bans Link headers alongside JSON entities (links belong in the body for
      consistency/CORS reasons) — a counterpoint to GitHub's loved Link-header pagination. Google
      AIP-158 mandates opaque page_tokens the client echoes but never decodes/constructs — a
      deliberately anti-hypermedia stance achieving decoupling by hiding structure rather than
      advertising a next link.
    ref: "concepts.md#industry-guidelines-zalando-and-google-aip"

  - id: hypermedia-and-hateoas-087
    difficulty: advanced
    tags: [follow-your-nose, anti-pattern, coupling]
    question: |
      Which client behavior most directly defeats the purpose of HATEOAS ("follow your nose")?
    options:
      - "Bookmarking a single well-known entry point and storing the server-supplied self rel to re-identify a resource later"
      - "Rendering an action button in the UI only when its corresponding affordance is actually present in the current response"
      - "Reconstructing URLs from IDs and templates in client code (e.g. \"/orders/\" + id + \"/items\") instead of following the hrefs the server returns"
      - "Following the server-provided next link from page to page until no next relation remains in the response"
    answer: 2
    explanation: |
      Rebuilding URLs from IDs/templates hard-codes the very URL structure HATEOAS exists to
      decouple from — it breaks the moment the server reshapes its paths. The follow-your-nose
      principle is to bookmark one entry point and follow returned links. Templated links are a
      bounded exception, not license to reconstruct arbitrary URLs.
    ref: "concepts.md#follow-your-nose-and-cool-uris"

  - id: hypermedia-and-hateoas-088
    difficulty: advanced
    tags: [testing, state-machine, affordances]
    question: |
      How should tests for a hypermedia API differ from tests for a fixed-URL Level-2 API, and
      what is the trade-off?
    options:
      - "They should assert on the exact literal response URLs at every step, which is simpler to write and, because URLs are stable, never breaks when the server reshapes its paths"
      - "They should hard-code the full absolute URL of every affordance and request it directly, skipping traversal from the root, to keep each test case thorough and self-contained"
      - "They should skip driving state transitions altogether and only validate each response against its JSON schema, since affordance presence is a UI concern outside the API contract"
      - "They should start at the root, follow rels to reach a resource, and assert on the presence/absence of affordances per state (asserting on relations, not URLs) — harder to write due to multi-hop traversal and larger state space, but resilient to the URL changes hypermedia enables"
    answer: 3
    explanation: |
      Hypermedia testing drives the API as a state machine: start at the root, follow rels, and
      assert on affordance presence/absence per state (e.g. AWAITING_PAYMENT exposes pay, not
      refund). Asserting on relations rather than URLs makes tests survive URL changes, at the cost
      of harder multi-hop setup and a larger reachable-state space.
    ref: "concepts.md#testing-a-hypermedia-api"

  - id: hypermedia-and-hateoas-089
    difficulty: expert
    tags: [graphql, comparison, coupling]
    question: |
      How does GraphQL relate to HATEOAS as approaches to client/server coupling?
    options:
      - "They attack coupling from opposite directions: HATEOAS is server-driven (the server advertises reachable resources/transitions), while GraphQL is client-driven (the client declares the exact fields/graph); GraphQL solves over/under-fetching but does NOT advertise state-dependent next actions, so they optimize different things"
      - "GraphQL is a strict superset of HATEOAS: its schema and resolvers advertise the state-dependent next actions valid for each object, so a GraphQL client discovers legal transitions exactly the way a Siren client does"
      - "They are fully interchangeable; either can replace the other with no trade-offs, since both expose per-resource URLs and both let the server drive which transitions are reachable at runtime"
      - "GraphQL enforces per-resource URLs and standard HTTP caching far more strictly than REST, because every field resolves to its own cacheable endpoint keyed by URL"
    answer: 0
    explanation: |
      HATEOAS lowers coupling server-side (the server drives which resources/transitions are
      reachable); GraphQL lowers it client-side (the client asks for exactly the fields/graph it
      wants at one endpoint, discarding per-resource URLs and HTTP caching). GraphQL solves
      over/under-fetching and chattiness but does not express "what can I do to this order now?"
      the way Siren actions or state-dependent _links do — they optimize different concerns.
    ref: "concepts.md#where-hypermedia-fits-in-a-microservices-topology"
