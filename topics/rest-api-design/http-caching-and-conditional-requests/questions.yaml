topic: "HTTP Caching & Conditional Requests"
domain: rest-api-design
topic_slug: http-caching-and-conditional-requests
version: 1
questions:
  - id: http-caching-and-conditional-requests-001
    difficulty: beginner
    tags: [freshness, validation, model]
    question: |
      HTTP caching provides two distinct mechanisms. Which pair correctly
      describes them?
    options:
      - "Compression (shrinking the payload) and content negotiation (choosing a representation)"
      - "Encryption of the response body and authentication of the requesting client"
      - "Freshness (serve without contacting the origin) and validation (cheaply re-check with the origin)"
      - "Load balancing across origin servers and rate limiting of client requests"
    answer: 2
    explanation: |
      Freshness (Cache-Control max-age, Expires) lets a cache serve a stored
      response with zero round-trips until it expires. Validation (ETag /
      Last-Modified + conditional requests) lets a cache re-check a stale
      response and get a cheap 304 instead of the full body.
    ref: "concepts.md#why-http-caching-matters-and-the-freshness-vs-validation-model"

  - id: http-caching-and-conditional-requests-002
    difficulty: beginner
    tags: [rfc, standards]
    question: |
      Which RFCs are the current normative references for HTTP caching and
      HTTP semantics (validators/conditional requests) respectively?
    options:
      - "RFC 7234 (caching) and RFC 7231 (semantics)"
      - "RFC 2616 (HTTP/1.1) and RFC 2617 (authentication)"
      - "RFC 9111 (caching) and RFC 9110 (semantics)"
      - "RFC 9457 (problem details) and RFC 8288 (web linking)"
    answer: 2
    explanation: |
      RFC 9111 (HTTP Caching) obsoletes RFC 7234, and RFC 9110 (HTTP Semantics)
      obsoletes RFC 7231/7232, defining validators and conditional requests.
    ref: "concepts.md#why-http-caching-matters-and-the-freshness-vs-validation-model"

  - id: http-caching-and-conditional-requests-003
    difficulty: intermediate
    tags: [304, cache-miss, stale]
    question: |
      What is the practical difference between a stale (expired) cache entry
      and a cache miss?
    options:
      - "A stale entry still has a stored body and validator, so it can often be refreshed with a cheap 304; a miss has nothing stored and needs a full fetch"
      - "There is no practical difference; both a stale entry and a miss always trigger a full fetch from the origin"
      - "A miss returns a cheap 304 with no body while a stale entry always forces a full 200 response"
      - "A stale entry can never be revalidated and must be discarded, whereas a miss is refreshed with a 304"
    answer: 0
    explanation: |
      A miss has nothing stored, so it is a full fetch. A stale entry still has
      the body and a validator, so a conditional request can refresh it with a
      cheap 304. This is why sending an ETag even with max-age=0 is valuable.
    ref: "concepts.md#why-http-caching-matters-and-the-freshness-vs-validation-model"

  - id: http-caching-and-conditional-requests-004
    difficulty: beginner
    tags: [cache-control, max-age]
    question: |
      What does `Cache-Control: max-age=300` tell a cache?
    options:
      - "The response may be served as fresh for 300 seconds relative to its age"
      - "Discard the stored response after it has been served to 300 separate requests"
      - "Revalidate the response with the origin once every 300 milliseconds"
      - "Store the response only if its body is at most 300 bytes in size"
    answer: 0
    explanation: |
      max-age=N sets the freshness lifetime to N seconds (relative to the
      response's age). While the current age is below max-age the response is
      fresh and can be served with no origin contact.
    ref: "concepts.md#cache-control-response-directives"

  - id: http-caching-and-conditional-requests-005
    difficulty: intermediate
    tags: [cache-control, precedence, expires]
    question: |
      A response contains both `Cache-Control: max-age=600` and an `Expires`
      header set 60 seconds in the future. What does a cache that understands
      both use for freshness?
    options:
      - "Expires (60 seconds), because an absolute date always beats a relative offset"
      - "The smaller of the two values, taking 60 seconds as the safer freshness lifetime"
      - "max-age (600 seconds), because Cache-Control overrides Expires"
      - "Neither value applies, because the conflict between them makes the response uncacheable"
    answer: 2
    explanation: |
      When both are present, Cache-Control: max-age takes precedence over
      Expires for caches that understand it. Expires is a legacy HTTP/1.0
      fallback.
    ref: "concepts.md#cache-control-response-directives"

  - id: http-caching-and-conditional-requests-006
    difficulty: intermediate
    tags: [no-cache, no-store, must-revalidate]
    question: |
      Which statement about `no-cache`, `no-store`, and `must-revalidate` is
      correct?
    options:
      - "no-cache forbids storing the response entirely, exactly like no-store does"
      - "no-store permits storage of the response but requires revalidation with the origin before every reuse"
      - "no-store forbids storing at all; no-cache allows storage but requires revalidation before every reuse; must-revalidate requires revalidation only once stale"
      - "must-revalidate and no-store are identical in effect, both forbidding any reuse of a stored copy"
    answer: 2
    explanation: |
      no-store forbids any storage. no-cache permits storage but the response
      MUST be revalidated with the origin before every reuse. must-revalidate
      allows free reuse while fresh but requires revalidation once the response
      becomes stale.
    ref: "concepts.md#no-cache-vs-no-store-vs-must-revalidate"

  - id: http-caching-and-conditional-requests-007
    difficulty: beginner
    tags: [no-cache, misconception]
    question: |
      A developer sends `Cache-Control: no-cache` expecting the response to
      never be stored by any proxy. Why is this a mistake?
    options:
      - "no-cache means the response may be stored but must be revalidated before use; to forbid storage entirely you need no-store"
      - "no-cache is not a real Cache-Control directive and is silently ignored by every proxy"
      - "no-cache applies only to browser private caches and never to shared proxy caches"
      - "no-cache disables ETag validators so revalidation can no longer happen"
    answer: 0
    explanation: |
      no-cache does NOT mean 'do not cache'. It means cache but revalidate
      before use. To prevent any storage you must send no-store.
    ref: "concepts.md#no-cache-vs-no-store-vs-must-revalidate"

  - id: http-caching-and-conditional-requests-008
    difficulty: intermediate
    tags: [no-store, sensitive-data]
    question: |
      Which directive is the strongest and appropriate for a response
      containing a one-time token that must never be written to any cache or
      proxy?
    options:
      - "private"
      - "no-cache"
      - "must-revalidate"
      - "no-store"
    answer: 3
    explanation: |
      no-store is the strongest: it forbids writing any part of the request or
      response to any cache. It is the correct choice for genuinely sensitive
      data.
    ref: "concepts.md#no-cache-vs-no-store-vs-must-revalidate"

  - id: http-caching-and-conditional-requests-009
    difficulty: intermediate
    tags: [s-maxage, shared-cache, private-cache]
    question: |
      What does `s-maxage` do that `max-age` does not?
    options:
      - "It sets the freshness lifetime only for shared caches (CDN/proxy), overriding max-age and Expires for them"
      - "It sets a reduced freshness lifetime that applies only over slow or metered network connections"
      - "It disables caching in browsers while still permitting shared proxy caches to store the response"
      - "It applies exclusively to private browser caches and is ignored by every shared cache"
    answer: 0
    explanation: |
      s-maxage applies only to shared caches and overrides both max-age and
      Expires for them, letting you set a different (often longer) edge TTL
      than the browser TTL.
    ref: "concepts.md#max-age-s-maxage-and-shared-vs-private-caches"

  - id: http-caching-and-conditional-requests-010
    difficulty: beginner
    tags: [private, shared-cache, security]
    question: |
      Which `Cache-Control` directive tells a CDN/reverse proxy it MUST NOT
      store the response, while still allowing a user's own browser to cache it?
    options:
      - "no-store"
      - "public"
      - "private"
      - "s-maxage=0"
    answer: 2
    explanation: |
      private restricts storage to a single-user (browser) cache. Shared caches
      MUST NOT store a private response, which is the correct marking for
      per-user data that a browser may still cache.
    ref: "concepts.md#max-age-s-maxage-and-shared-vs-private-caches"

  - id: http-caching-and-conditional-requests-011
    difficulty: advanced
    tags: [s-maxage, ttl-split, cdn]
    question: |
      An endpoint returns `Cache-Control: max-age=60, s-maxage=3600`. What
      behavior does this produce?
    options:
      - "Browsers and the CDN both cache it for 60 seconds, ignoring the s-maxage value entirely"
      - "Browsers treat it as fresh for 60 seconds; the CDN keeps it fresh for one hour and absorbs traffic"
      - "The CDN caches it for only 60 seconds while browsers hold it fresh for the full one hour"
      - "The response is treated as uncacheable because the 60-second and one-hour values conflict"
    answer: 1
    explanation: |
      max-age governs all caches (browser: 60s) while s-maxage overrides it for
      shared caches (CDN: 3600s). This TTL split lets the CDN shield the origin
      while browsers hold a shorter copy.
    ref: "concepts.md#max-age-s-maxage-and-shared-vs-private-caches"

  - id: http-caching-and-conditional-requests-012
    difficulty: intermediate
    tags: [shared-cache, security, authorization]
    question: |
      Why is caching an authenticated, per-user response in a shared cache
      dangerous without careful configuration?
    options:
      - "It measurably increases origin CPU usage by forcing extra revalidation work"
      - "It silently disables response compression at the shared cache tier"
      - "It can serve one user's data to another user from the shared cache"
      - "It always causes a 412 Precondition Failed response to be returned to clients"
    answer: 2
    explanation: |
      A shared cache serves many users. Caching per-user or Authorization-based
      responses without private/no-store or a correct Vary key can leak user
      A's data to user B — a real and common security incident.
    ref: "concepts.md#max-age-s-maxage-and-shared-vs-private-caches"

  - id: http-caching-and-conditional-requests-013
    difficulty: beginner
    tags: [etag, validator]
    question: |
      What is an `ETag`?
    options:
      - "The MIME type of the response body, echoing the Content-Type so caches can vary on format"
      - "The expiry timestamp after which a cached response is considered stale and must be revalidated"
      - "An encryption tag authenticating the payload's integrity, similar to an HMAC over the body"
      - "An opaque token identifying a specific representation of a resource; it changes when the representation changes"
    answer: 3
    explanation: |
      An ETag (entity tag) is an opaque validator the origin assigns to a
      specific representation. When the representation changes, the ETag
      changes, enabling exact conditional requests.
    ref: "concepts.md#etag-strong-and-weak-validators"

  - id: http-caching-and-conditional-requests-014
    difficulty: intermediate
    tags: [etag, weak, strong]
    question: |
      What does the `W/` prefix on `ETag: W/"xyzzy"` indicate?
    options:
      - "The ETag is write-protected and cannot be overwritten by a later response"
      - "It marks a versioned validator generated by a write operation rather than a read"
      - "The ETag applies only to WebSocket upgrade handshakes and not to normal GETs"
      - "It is a weak validator: representations may be semantically equivalent without being byte-for-byte identical"
    answer: 3
    explanation: |
      W/ marks a weak validator. Two representations can share a weak ETag when
      they are semantically equivalent (e.g. trivial whitespace or timestamp
      differences) even if their bytes differ.
    ref: "concepts.md#etag-strong-and-weak-validators"

  - id: http-caching-and-conditional-requests-015
    difficulty: advanced
    tags: [etag, strong, range, comparison]
    question: |
      For which operation is a strong validator (strong comparison) required,
      meaning a weak ETag MUST NOT be used?
    options:
      - "If-None-Match on a conditional GET"
      - "Range requests and If-Match"
      - "Setting Cache-Control: max-age"
      - "The Vary header"
    answer: 1
    explanation: |
      Range requests and If-Match require strong comparison (byte-for-byte
      identity). If-None-Match uses weak comparison, so weak ETags are
      acceptable there.
    ref: "concepts.md#etag-strong-and-weak-validators"

  - id: http-caching-and-conditional-requests-016
    difficulty: intermediate
    tags: [etag, generation, api]
    question: |
      Which are reasonable, cheap ways for an API to generate an `ETag` for a
      resource?
    options:
      - "A random UUID generated fresh for the resource on every single request"
      - "A hash of the serialized response body, or a resource version/revision counter"
      - "The client's IP address combined with its User-Agent string"
      - "The current server wall-clock timestamp recomputed on every response"
    answer: 1
    explanation: |
      A hash of the body or a monotonically-changing version counter both
      change exactly when the representation changes. A fresh random value or
      timestamp per request would never match and defeat conditional requests.
    ref: "concepts.md#etag-strong-and-weak-validators"

  - id: http-caching-and-conditional-requests-017
    difficulty: intermediate
    tags: [last-modified, resolution, gotcha]
    question: |
      What is the key limitation of `Last-Modified` compared to `ETag` as a
      validator?
    options:
      - "It has one-second resolution, so two changes within the same second are indistinguishable and a client may serve stale content"
      - "Last-Modified may only appear on a request and can never be sent in a response header"
      - "It only functions over HTTP/2 connections and is ignored on HTTP/1.1"
      - "It is always a weak validator and therefore cannot detect any change to the resource"
    answer: 0
    explanation: |
      Last-Modified has one-second resolution and depends on clock/mtime
      trust. Two changes in the same second look identical, so an ETag (exact,
      opaque) is the preferred validator.
    ref: "concepts.md#last-modified-and-date-based-validation"

  - id: http-caching-and-conditional-requests-018
    difficulty: advanced
    tags: [etag, last-modified, precedence]
    question: |
      A conditional GET request includes both `If-None-Match` (an ETag) and
      `If-Modified-Since` (a date). How does a compliant server evaluate them?
    options:
      - "It requires both to match before returning 304"
      - "It evaluates If-Modified-Since and ignores If-None-Match"
      - "It evaluates If-None-Match and ignores If-Modified-Since"
      - "It returns 400 because the two are mutually exclusive"
    answer: 2
    explanation: |
      Per RFC 9110, when both are present the server evaluates If-None-Match
      and ignores If-Modified-Since. The ETag validator takes precedence.
    ref: "concepts.md#conditional-get-if-none-match--if-modified-since-and-304"

  - id: http-caching-and-conditional-requests-019
    difficulty: beginner
    tags: [conditional-get, 304]
    question: |
      A client sends `If-None-Match: "v23"` and the resource's current ETag is
      still `"v23"`. What does the server return?
    options:
      - "412 Precondition Failed"
      - "200 OK with the full body"
      - "304 Not Modified with no body"
      - "204 No Content, empty body"
    answer: 2
    explanation: |
      If-None-Match matches the current representation, so the client's copy is
      up to date. The server returns 304 Not Modified with no message body.
    ref: "concepts.md#conditional-get-if-none-match--if-modified-since-and-304"

  - id: http-caching-and-conditional-requests-020
    difficulty: intermediate
    tags: [304, bandwidth, round-trip]
    question: |
      What does a conditional GET that results in a 304 primarily save, and
      what does it NOT save?
    options:
      - "It saves the origin round-trip but not any response-body bandwidth"
      - "It saves bandwidth (empty 304 body) but still incurs the origin round-trip"
      - "It saves both response bandwidth and the origin round-trip on every hit"
      - "It saves neither bandwidth nor round-trip; it is purely for correctness"
    answer: 1
    explanation: |
      A 304 carries no body, saving bandwidth even for large representations,
      but the request still travels to the origin. Freshness (max-age) is what
      eliminates the round-trip.
    ref: "concepts.md#conditional-get-if-none-match--if-modified-since-and-304"

  - id: http-caching-and-conditional-requests-021
    difficulty: advanced
    tags: [304, headers]
    question: |
      Which is true about a `304 Not Modified` response?
    options:
      - "It MUST include the full representation body exactly as a 200 OK response would re-send it"
      - "It MUST NOT include a body and SHOULD update the stored response's freshness headers such as ETag and Cache-Control"
      - "It resets the resource to its previous version and discards changes made since the client's copy"
      - "It must always be accompanied by a 412 Precondition Failed status in the same response"
    answer: 1
    explanation: |
      A 304 carries no body. It should echo the current validators and
      freshness headers so the cache/client can refresh the stored response's
      freshness without re-downloading it.
    ref: "concepts.md#conditional-get-if-none-match--if-modified-since-and-304"

  - id: http-caching-and-conditional-requests-022
    difficulty: intermediate
    tags: [optimistic-concurrency, if-match, 412]
    question: |
      How do you prevent the lost-update problem when two clients edit the same
      resource over REST?
    options:
      - "Use server-side pessimistic locks held on the origin between each client's GET and its PUT"
      - "Expose an ETag on GET, require If-Match on PUT/PATCH/DELETE, and return 412 Precondition Failed on mismatch"
      - "Reject all concurrent write requests with 429 until the first one finishes committing"
      - "Cache the resource with a long max-age so every client always reads the same stored copy"
    answer: 1
    explanation: |
      This is stateless optimistic concurrency: the client sends the ETag it
      read via If-Match; if the resource changed the server returns 412 and the
      client refetches, merges, and retries. No server-side locks needed.
    ref: "concepts.md#optimistic-concurrency-if-match--if-unmodified-since-and-412"

  - id: http-caching-and-conditional-requests-023
    difficulty: beginner
    tags: [412, precondition-failed]
    question: |
      A client sends `PUT /articles/42` with `If-Match: "v23"` but the current
      ETag is `"v25"`. What should the server return?
    options:
      - "200 OK and apply the write"
      - "304 Not Modified"
      - "412 Precondition Failed"
      - "409 Conflict, then apply the write anyway"
    answer: 2
    explanation: |
      The If-Match precondition failed because the resource changed since the
      client read it. The server returns 412 Precondition Failed and does not
      apply the write, preventing a lost update.
    ref: "concepts.md#optimistic-concurrency-if-match--if-unmodified-since-and-412"

  - id: http-caching-and-conditional-requests-024
    difficulty: advanced
    tags: [if-none-match, create, put]
    question: |
      How do you make a `PUT` behave as a safe create that fails if the
      resource already exists?
    options:
      - "Send If-Match: * so it only succeeds when the resource exists"
      - "Send If-None-Match: * so it returns 412 if the resource already exists"
      - "Send If-Modified-Since set to the current date and time"
      - "Send Cache-Control: no-store to block duplicate creates"
    answer: 1
    explanation: |
      If-None-Match: * means 'only if no current representation exists'. On a
      write it makes PUT a create-only operation, returning 412 if the resource
      already exists, which also handles create races. If-Match: * conversely
      requires existence (update-only).
    ref: "concepts.md#optimistic-concurrency-if-match--if-unmodified-since-and-412"

  - id: http-caching-and-conditional-requests-025
    difficulty: advanced
    tags: [428, precondition-required]
    question: |
      A server wants to FORCE clients to include a precondition (like If-Match)
      on unsafe requests to avoid blind overwrites. Which status code supports
      this?
    options:
      - "412 Precondition Failed"
      - "409 Conflict"
      - "428 Precondition Required"
      - "417 Expectation Failed"
    answer: 2
    explanation: |
      428 Precondition Required (RFC 6585) lets a server reject an unconditional
      unsafe request and demand that the client resend it with a precondition,
      preventing lost updates from clients that forgot to send If-Match.
    ref: "concepts.md#optimistic-concurrency-if-match--if-unmodified-since-and-412"

  - id: http-caching-and-conditional-requests-026
    difficulty: intermediate
    tags: [if-unmodified-since, write]
    question: |
      What is the effect of `If-Unmodified-Since` on a write request?
    options:
      - "Return 304 Not Modified if the resource has not changed since the given date"
      - "Apply the write only if the resource has NOT changed since the given date; otherwise return 412"
      - "Apply the write only if the resource HAS changed since the given date, else return 412"
      - "It has no effect on write requests and applies only to conditional GET requests"
    answer: 1
    explanation: |
      If-Unmodified-Since is the date-based precondition for writes: the server
      applies the change only if the resource is unchanged since that date,
      else returns 412 Precondition Failed.
    ref: "concepts.md#optimistic-concurrency-if-match--if-unmodified-since-and-412"

  - id: http-caching-and-conditional-requests-027
    difficulty: beginner
    tags: [vary, cache-key]
    question: |
      What is the purpose of the `Vary` response header?
    options:
      - "To vary the response body randomly across clients for load-testing purposes"
      - "To set a variable per-client expiry time that changes on each request"
      - "To list which request headers must also match for a cached response to be reused"
      - "To disable caching of the response entirely across all shared caches"
    answer: 2
    explanation: |
      Vary adds request headers to the cache key. A stored response is reused
      only for later requests whose listed headers (e.g. Accept,
      Accept-Encoding) match, preventing serving the wrong negotiated variant.
    ref: "concepts.md#the-vary-header-and-the-cache-key"

  - id: http-caching-and-conditional-requests-028
    difficulty: intermediate
    tags: [vary, accept-encoding, gzip]
    question: |
      You gzip responses but forget to send `Vary: Accept-Encoding`. What is the
      likely bug?
    options:
      - "Responses will never be cached by any shared proxy under any circumstances"
      - "A proxy may serve a gzipped body to a client that requested identity encoding, or vice versa"
      - "All clients will receive 412 Precondition Failed responses instead of content"
      - "The origin server will progressively run out of memory buffering encodings"
    answer: 1
    explanation: |
      Without Vary: Accept-Encoding the cache keys only on method+URI, so it can
      hand a gzipped body to a client that did not accept gzip (or an identity
      body to one expecting gzip), corrupting the response.
    ref: "concepts.md#the-vary-header-and-the-cache-key"

  - id: http-caching-and-conditional-requests-029
    difficulty: advanced
    tags: [vary, cookie, hit-rate]
    question: |
      Why is `Vary: Cookie` on a shared cache usually a bad idea?
    options:
      - "The Cookie header cannot legally appear in a Vary field, so shared caches reject the entire response"
      - "Cookie is a high-cardinality header, so it explodes the number of cache variants, destroys hit rates, and can leak per-user data"
      - "It forces every stored response to be compressed with gzip before it is served to any client"
      - "It disables ETag validators, so conditional requests can no longer produce a 304 response"
    answer: 1
    explanation: |
      Cookies vary per user/session, so varying on them creates a nearly-unique
      cache entry per request, gutting hit rates and risking per-user data leaks.
      For per-user data prefer Cache-Control: private instead.
    ref: "concepts.md#the-vary-header-and-the-cache-key"

  - id: http-caching-and-conditional-requests-030
    difficulty: intermediate
    tags: [vary, wildcard]
    question: |
      What does `Vary: *` mean for a shared cache?
    options:
      - "Cache the response and serve it to all clients regardless of their request headers"
      - "The response is effectively uncacheable because every request is treated as unique"
      - "Vary the cache key on every response header the origin sends back"
      - "Vary the cache key only on the Host header of the incoming request"
    answer: 1
    explanation: |
      Vary: * indicates the response depends on factors beyond request headers,
      making it effectively uncacheable by shared caches — each request is
      treated as unique.
    ref: "concepts.md#the-vary-header-and-the-cache-key"

  - id: http-caching-and-conditional-requests-031
    difficulty: beginner
    tags: [expires, legacy]
    question: |
      What does the legacy `Expires` header contain?
    options:
      - "A relative number of seconds counted from the response's age"
      - "An absolute HTTP-date after which the response is considered stale"
      - "An opaque ETag validator token for the representation"
      - "A comma-separated list of HTTP methods that may be cached"
    answer: 1
    explanation: |
      Expires is an absolute HTTP-date marking when the response becomes stale.
      It predates Cache-Control and relies on client/server clock sync, which is
      why relative max-age is preferred.
    ref: "concepts.md#legacy-expires-and-pragma"

  - id: http-caching-and-conditional-requests-032
    difficulty: intermediate
    tags: [expires, clock-skew, max-age]
    question: |
      Why is `Cache-Control: max-age` generally preferred over `Expires`?
    options:
      - "max-age values can be encrypted end-to-end whereas the Expires date is always sent in cleartext"
      - "max-age is a relative offset and avoids client/server clock-skew problems, whereas Expires depends on synchronized clocks"
      - "The Expires header is not supported by any modern browser and is silently discarded on receipt"
      - "max-age uniquely permits shared caching of POST responses, which the Expires header can never authorize"
    answer: 1
    explanation: |
      Expires depends on absolute dates and thus on clocks being in sync;
      max-age is a relative offset computed from the response age, sidestepping
      clock skew.
    ref: "concepts.md#legacy-expires-and-pragma"

  - id: http-caching-and-conditional-requests-033
    difficulty: intermediate
    tags: [pragma, request-directive]
    question: |
      What is `Pragma: no-cache` in modern HTTP?
    options:
      - "A modern response directive exactly equivalent to Cache-Control: no-store"
      - "A legacy HTTP/1.0 request header treated only as a hint; Cache-Control is preferred"
      - "A response header that forces the origin to return 304 Not Modified"
      - "A response directive that adds request headers to the cache key"
    answer: 1
    explanation: |
      Pragma: no-cache is an HTTP/1.0 request header with no defined response
      semantics in modern specs; it is treated as a backwards-compat hint.
      Cache-Control should be used instead.
    ref: "concepts.md#legacy-expires-and-pragma"

  - id: http-caching-and-conditional-requests-034
    difficulty: intermediate
    tags: [freshness, age, calculation]
    question: |
      A response has `Cache-Control: max-age=600`, `Date: 09:00:00`, and
      `Age: 120` when it arrives at a downstream cache. How much freshness
      remains?
    options:
      - "480 seconds"
      - "600 seconds"
      - "720 seconds"
      - "120 seconds"
    answer: 0
    explanation: |
      Freshness lifetime is 600s and the response is already 120s old
      (Age: 120), so 600 - 120 = 480 seconds of freshness remain.
    ref: "concepts.md#freshness-lifetime-age-and-expiration-calculation"

  - id: http-caching-and-conditional-requests-035
    difficulty: advanced
    tags: [freshness, precedence, heuristic]
    question: |
      In what order does a shared cache determine a response's freshness
      lifetime?
    options:
      - "Expires, then max-age, then s-maxage, then heuristic"
      - "s-maxage, then max-age, then (Expires - Date), then a heuristic"
      - "Always a heuristic derived from the Last-Modified date"
      - "The Age header, then Date, then the ETag validator"
    answer: 1
    explanation: |
      For shared caches the precedence is s-maxage, then max-age, then
      Expires minus Date, then (only if no explicit expiration exists) a
      heuristic such as ~10% of the time since Last-Modified.
    ref: "concepts.md#freshness-lifetime-age-and-expiration-calculation"

  - id: http-caching-and-conditional-requests-036
    difficulty: advanced
    tags: [heuristic, gotcha, no-headers]
    question: |
      An API returns `200 OK` with a JSON body and NO caching headers at all.
      What can a shared cache legitimately do?
    options:
      - "Nothing at all; a response with no Cache-Control header can never be cached"
      - "Return 412 Precondition Failed to the next client that requests the resource"
      - "Apply heuristic freshness and serve the potentially stale body for a guessed period"
      - "Automatically convert the response to Cache-Control: no-store and refuse to store it"
    answer: 2
    explanation: |
      With no explicit expiration and a heuristically-cacheable status, a cache
      may compute a heuristic freshness lifetime (e.g. ~10% of the time since
      Last-Modified) and serve stale data. Always send explicit directives.
    ref: "concepts.md#freshness-lifetime-age-and-expiration-calculation"

  - id: http-caching-and-conditional-requests-037
    difficulty: intermediate
    tags: [age, header]
    question: |
      What does the `Age` response header represent?
    options:
      - "The maximum number of seconds the response may remain stored before a cache must evict it"
      - "The number of seconds the response has been sitting in caches since it was generated at the origin"
      - "The elapsed uptime in seconds of the origin server process that produced the response"
      - "The number of seconds remaining until the cache must next revalidate the stored response"
    answer: 1
    explanation: |
      Age is the estimated time in seconds since the response was generated at
      the origin, accumulated as it passes through caches. current_age = Age +
      time since received.
    ref: "concepts.md#freshness-lifetime-age-and-expiration-calculation"

  - id: http-caching-and-conditional-requests-038
    difficulty: advanced
    tags: [cdn, cache-busting, immutable]
    question: |
      For an immutable, versioned static asset like `/app.9f8c.js`, which
      caching strategy avoids ever needing to invalidate the CDN?
    options:
      - "Serve Cache-Control: no-cache with a short weak ETag so the CDN revalidates the asset with the origin on every single request"
      - "Serve Cache-Control: private, max-age=0 so only the user's browser holds the asset and the CDN never stores a shared copy"
      - "Send Vary: * on every asset so the CDN keys each version separately and rotates them out automatically as new builds ship"
      - "Embed a content hash in the URL and serve Cache-Control: max-age=31536000, immutable so new content always gets a new URL"
    answer: 3
    explanation: |
      With a content hash in the filename, any change produces a new URL, so the
      old URL's cached copy is never wrong. A one-year immutable max-age means
      caches never revalidate, and no purge is ever needed.
    ref: "concepts.md#cdn--shared-caches-and-cache-invalidation"

  - id: http-caching-and-conditional-requests-039
    difficulty: advanced
    tags: [cdn, invalidation, trade-off]
    question: |
      What is the trade-off between TTL-based caching and active
      invalidation (purge-on-write) at a CDN?
    options:
      - "TTL-based caching always serves fresher content than active invalidation but adds latency on every read because it revalidates first"
      - "TTL-based accepts staleness up to the TTL but is simple and decoupled; active invalidation is fresh immediately but couples the write path to the CDN and can herd load onto the origin"
      - "Active invalidation cannot be combined with stale-while-revalidate because a purge cancels any in-flight background refresh"
      - "There is no meaningful difference in freshness between the two; both surface origin changes to clients after exactly the same delay"
    answer: 1
    explanation: |
      TTL-based caching is simple and decoupled but tolerates staleness up to
      the TTL. Active invalidation gives immediate freshness but couples writes
      to the CDN purge API and can cause thundering-herd origin load on popular
      keys.
    ref: "concepts.md#cdn--shared-caches-and-cache-invalidation"

  - id: http-caching-and-conditional-requests-040
    difficulty: intermediate
    tags: [stale-while-revalidate, rfc-5861]
    question: |
      What does `Cache-Control: max-age=600, stale-while-revalidate=30` allow a
      cache to do?
    options:
      - "Treat the response as fresh for a combined 630 seconds and never contact the origin to revalidate it"
      - "Proactively revalidate the response with the origin every 30 seconds for the entire time it is still fresh"
      - "After the response goes stale, serve the stale copy for up to 30 more seconds while revalidating in the background"
      - "Refuse to serve the response the moment it goes stale and block the client until a fresh copy is fetched"
    answer: 2
    explanation: |
      stale-while-revalidate (RFC 5861) lets a cache return the stale response
      instantly for up to N seconds after expiry while it refreshes
      asynchronously, hiding origin latency from the user.
    ref: "concepts.md#stale-content-extensions-stale-while-revalidate-and-stale-if-error"

  - id: http-caching-and-conditional-requests-041
    difficulty: advanced
    tags: [stale-if-error, resilience]
    question: |
      What does `stale-if-error=86400` provide?
    options:
      - "It instructs the cache to return an error response to clients once the entry is older than 86400 seconds"
      - "It tells the cache to store only 4xx and 5xx error responses and to discard every successful 200 response"
      - "It sets the freshness lifetime of the response to one day, behaving as a synonym for max-age=86400"
      - "If revalidation fails (origin down or 5xx), the cache may serve the stale copy for up to 86400 seconds instead of returning an error"
    answer: 3
    explanation: |
      stale-if-error (RFC 5861) is a resilience directive: when the origin
      cannot be reached or returns an error, the cache may serve the stale
      response for the specified window rather than surfacing the failure.
    ref: "concepts.md#stale-content-extensions-stale-while-revalidate-and-stale-if-error"

  - id: http-caching-and-conditional-requests-042
    difficulty: advanced
    tags: [must-revalidate, stale, conflict]
    question: |
      Why does `must-revalidate` conflict with the intent of serving stale
      content?
    options:
      - "must-revalidate forbids serving a stale response, so once stale the cache must revalidate before reuse and must not serve stale on error"
      - "must-revalidate strips the stored ETag validator, so no conditional revalidation can ever produce a stale-but-usable copy"
      - "must-revalidate applies only to responses for POST requests and is silently ignored on cacheable GET responses"
      - "must-revalidate suppresses the Age header, so the cache can no longer tell when a stored response has become stale"
    answer: 0
    explanation: |
      must-revalidate mandates revalidation once stale and forbids serving stale
      responses (including on error), which is the opposite of what
      stale-while-revalidate/stale-if-error enable.
    ref: "concepts.md#stale-content-extensions-stale-while-revalidate-and-stale-if-error"

  - id: http-caching-and-conditional-requests-043
    difficulty: beginner
    tags: [cacheable-methods, best-practice]
    question: |
      Which HTTP methods are cacheable by default?
    options:
      - "POST and PUT"
      - "GET and HEAD (safe methods)"
      - "DELETE and PATCH"
      - "All methods equally"
    answer: 1
    explanation: |
      Only safe methods (GET, HEAD) are cacheable by default. A POST response is
      cacheable only with explicit freshness info and is handled conservatively;
      writes like PUT/DELETE/PATCH are not cached.
    ref: "concepts.md#api-design-best-practices-and-gotchas"

  - id: http-caching-and-conditional-requests-044
    difficulty: intermediate
    tags: [invalidation, unsafe-methods]
    question: |
      According to RFC 9111, what should a cache do to the request URI after a
      non-error response to an unsafe method (e.g. a successful PUT)?
    options:
      - "Extend the freshness lifetime of the cached entry, since a successful write proves the stored copy is current"
      - "Leave the cached entry untouched, because unsafe methods have no defined effect on previously stored responses"
      - "Invalidate the cached entry for that URI (and Location/Content-Location)"
      - "Overwrite the cached entry with the write result and serve that body to every other client on the next request"
    answer: 2
    explanation: |
      A successful unsafe request invalidates the cache entry for the target URI
      (and any Location/Content-Location URIs). Note this only helps caches on
      the write path; other edge nodes still need TTL or explicit purge.
    ref: "concepts.md#api-design-best-practices-and-gotchas"

  - id: http-caching-and-conditional-requests-045
    difficulty: intermediate
    tags: [best-practice, well-designed-endpoint]
    question: |
      Which response best represents a well-designed cacheable API GET endpoint
      that supports fresh serving, cheap revalidation, safe negotiation, and
      optimistic concurrency?
    options:
      - "Cache-Control: no-store with no ETag, forbidding storage and giving up both fresh serving and cheap revalidation entirely"
      - "Cache-Control: public, max-age=60, stale-while-revalidate=30 plus an ETag and Vary: Accept, Accept-Encoding"
      - "Expires: 0 together with Pragma: no-cache only, relying on legacy HTTP/1.0 headers to drive all cache behavior"
      - "Vary: * with no Cache-Control, making the response effectively uncacheable and forcing a full origin fetch every time"
    answer: 1
    explanation: |
      Public short max-age gives fresh serving, stale-while-revalidate hides
      revalidation latency, the ETag enables cheap 304s and If-Match
      concurrency, and Vary handles content negotiation safely — all statelessly.
    ref: "concepts.md#api-design-best-practices-and-gotchas"

  - id: http-caching-and-conditional-requests-046
    difficulty: intermediate
    tags: [error-caching, best-practice]
    question: |
      What is a sound practice regarding caching of error responses?
    options:
      - "Cache all 5xx responses for several hours so repeated failures are absorbed at the edge and never reach the origin"
      - "Some 4xx (e.g. 404, 410) are heuristically cacheable, so set short or zero TTLs deliberately rather than leaving it to defaults"
      - "Error responses can never be stored by any cache under any circumstances, regardless of their status code"
      - "Always attach Vary: * to error responses so each failing request is isolated into its own per-client cache entry"
    answer: 1
    explanation: |
      Certain error statuses (404, 410, etc.) are heuristically cacheable, so a
      cache might store them longer than you want. Set explicit short/zero TTLs
      on errors instead of relying on heuristics.
    ref: "concepts.md#api-design-best-practices-and-gotchas"

  - id: http-caching-and-conditional-requests-047
    difficulty: beginner
    tags: [private-vs-shared, definition]
    question: |
      Which best describes a 'shared cache'?
    options:
      - "A cache dedicated to a single user, such as a browser's private per-profile HTTP cache on the device"
      - "The origin server's own in-memory application store used to speed up its internal database queries"
      - "A cache that serves many users, such as a CDN or reverse proxy"
      - "A cache that stores only image responses and ignores JSON, HTML, and other content types entirely"
    answer: 2
    explanation: |
      A shared cache (CDN, reverse proxy, gateway cache) serves many users. A
      private cache is dedicated to one user (browser, mobile app) and may store
      responses marked private.
    ref: "concepts.md#max-age-s-maxage-and-shared-vs-private-caches"

  - id: http-caching-and-conditional-requests-048
    difficulty: advanced
    tags: [authorization, shared-cache, rfc-9111]
    question: |
      By default, how does a shared cache treat a response to a request that
      carried an `Authorization` header?
    options:
      - "It stores and reuses the response freely for all users, exactly as it would an ordinary unauthenticated GET"
      - "It does not store it unless a directive such as public or s-maxage explicitly permits caching"
      - "It always returns 412 Precondition Failed to any request that carries an Authorization header"
      - "It stores the response in the shared cache but strips the entire body before serving it to later users"
    answer: 1
    explanation: |
      RFC 9111 says shared caches must not store responses to Authorization
      requests unless explicitly allowed by directives like public or s-maxage,
      protecting per-user authenticated data from being served to others.
    ref: "concepts.md#the-vary-header-and-the-cache-key"

  - id: http-caching-and-conditional-requests-049
    difficulty: intermediate
    tags: [no-transform, intermediary]
    question: |
      What does `Cache-Control: no-transform` instruct intermediaries to do?
    options:
      - "Aggressively recompress the payload with the smallest available codec before forwarding it downstream"
      - "Not modify the payload (e.g. must not recompress or transcode images)"
      - "Transform the response body into JSON regardless of the original Content-Type it was served with"
      - "Strip all caching-related headers from the response before passing it on to the next hop"
    answer: 1
    explanation: |
      no-transform forbids intermediaries from altering the payload, such as
      recompressing images or transcoding content, which some proxies do to save
      bandwidth.
    ref: "concepts.md#cache-control-response-directives"

  - id: http-caching-and-conditional-requests-050
    difficulty: advanced
    tags: [scenario, no-cache, etag]
    question: |
      An API team wants correctness-critical data that changes unpredictably,
      but also wants to benefit from cheap revalidation. Which response header
      set fits best?
    options:
      - "Cache-Control: public, max-age=3600 with no ETag, letting caches serve an hour-old copy with no way to cheaply revalidate"
      - "Cache-Control: no-store, forbidding any storage so every request is a full origin fetch with no 304 revalidation possible"
      - "Cache-Control: no-cache (or max-age=0, must-revalidate) together with an ETag"
      - "Expires set one year in the future, pinning the response as fresh far longer than the unpredictable data actually stays valid"
    answer: 2
    explanation: |
      no-cache (or max-age=0, must-revalidate) keeps the stored body plus
      validator but forces an origin check every use. Combined with an ETag,
      most checks return a cheap 304, giving strong freshness guarantees at 304
      cost. no-store would forbid storage entirely and lose the 304 benefit.
    ref: "concepts.md#no-cache-vs-no-store-vs-must-revalidate"

  - id: http-caching-and-conditional-requests-051
    difficulty: advanced
    tags: [request-directives, no-cache, force-fresh]
    question: |
      A mobile client must guarantee it gets the absolute latest representation
      but still wants to benefit from a cheap 304 if nothing changed. Which
      request directive should it send?
    options:
      - "Cache-Control: no-store, forcing the client and every proxy to discard all copies"
      - "Cache-Control: no-cache, which forbids reusing a stored response without a successful revalidation with the origin"
      - "Cache-Control: max-stale, accepting a stale copy to reduce latency"
      - "Cache-Control: only-if-cached, returning whatever is stored"
    answer: 1
    explanation: |
      A request-side no-cache forces revalidation of any stored response: the
      cache must confirm freshness with the origin (a conditional request),
      yielding a 304 when unchanged. no-store just throws away caching benefit,
      max-stale loosens freshness, and only-if-cached never contacts the origin.
    ref: "concepts.md#cache-control-request-directives"

  - id: http-caching-and-conditional-requests-052
    difficulty: expert
    tags: [request-directives, only-if-cached, offline]
    question: |
      A client sends `Cache-Control: only-if-cached` and no fresh stored
      response exists for the target. What is the compliant behavior?
    options:
      - "The cache forwards the request upstream to the origin as usual and relays whatever fresh response it receives"
      - "The cache returns 504 Gateway Timeout without contacting the origin"
      - "The cache synthesizes a 404 Not Found because no matching representation is present in its store"
      - "The cache returns the most recent stale copy it holds, ignoring the age limit the directive would otherwise impose"
    answer: 1
    explanation: |
      only-if-cached asks the cache to answer purely from its store and never
      contact the origin. If it has no usable stored response it responds with
      504 Gateway Timeout, which is how offline/cache-only modes are built.
    ref: "concepts.md#cache-control-request-directives"

  - id: http-caching-and-conditional-requests-053
    difficulty: expert
    tags: [request-directives, min-fresh, max-stale]
    question: |
      A cached response was generated with `max-age=100` and currently has an
      age of 80 seconds. A client requests it with `Cache-Control: min-fresh=30`.
      What must the cache do?
    options:
      - "Serve the stored response directly, because 20 remaining seconds already exceed the client's min-fresh demand"
      - "Revalidate or fetch, because only 20s of freshness remain but the client demands at least 30s"
      - "Return 412 Precondition Failed, since min-fresh is a precondition the current age of the entry fails to satisfy"
      - "Serve the stored response and reset its recorded age to zero so it appears to have a full 100s of freshness"
    answer: 1
    explanation: |
      min-fresh=30 means the client will only accept a response that stays fresh
      for at least 30 more seconds. With age 80 and max-age 100, only 20s remain,
      so the stored copy is unacceptable and the cache must revalidate or refetch.
    ref: "concepts.md#cache-control-request-directives"

  - id: http-caching-and-conditional-requests-054
    difficulty: expert
    tags: [qualified-no-cache, private, rfc-9111]
    question: |
      A response carries `Cache-Control: private="Set-Cookie", max-age=120`.
      How may a shared (CDN) cache treat it?
    options:
      - "It must refuse to store the response in the shared cache at all, treating the qualified form exactly like bare private"
      - "It may store and reuse the response for 120s but must strip the Set-Cookie field before serving it to another user"
      - "It may store the response but must revalidate it with the origin before every single reuse by any user"
      - "It must reinterpret the directive as no-store and discard the response immediately after forwarding it once"
    answer: 1
    explanation: |
      The qualified form private="Set-Cookie" is narrower than bare private: the
      shared cache MAY store and share the response, but MUST remove the named
      field (Set-Cookie) before serving it to a different user. This shares a
      mostly-public response while protecting one per-user header.
    ref: "concepts.md#qualified-no-cache-and-private"

  - id: http-caching-and-conditional-requests-055
    difficulty: expert
    tags: [immutable, rfc-8246, revalidation]
    question: |
      What does `Cache-Control: max-age=31536000, immutable` change compared to
      `max-age=31536000` alone, and when does it apply?
    options:
      - "immutable makes the response cacheable by shared caches like CDNs; without it only a user's private browser cache may store the response"
      - "immutable tells the client not to send a conditional revalidation even on an explicit reload, but only while the response is still fresh"
      - "immutable forces the cache to revalidate with the origin on every request, ignoring any remaining freshness lifetime the response still has"
      - "immutable extends the freshness lifetime indefinitely, overriding the max-age value so the response is treated as fresh forever"
    answer: 1
    explanation: |
      immutable (RFC 8246) suppresses the conditional revalidation a browser
      would otherwise issue on a user reload (which adds max-age=0). It only
      matters while the response is fresh; once stale it revalidates normally. It
      is advisory and best paired with content-hashed URLs.
    ref: "concepts.md#immutable-and-must-understand"

  - id: http-caching-and-conditional-requests-056
    difficulty: expert
    tags: [must-understand, no-store, status-codes]
    question: |
      Why is `Cache-Control: must-understand` typically sent together with
      `no-store`?
    options:
      - "must-understand encrypts the stored response body while no-store attaches a cryptographic signature the cache verifies before reuse"
      - "So a cache stores the response only if it understands the status code's caching rules, and otherwise falls back to not storing it"
      - "Because must-understand on its own forbids all caching, so no-store is added merely to make that prohibition explicit to older proxies"
      - "To force the cache to revalidate the response's status line with the origin on every single request before it may be served"
    answer: 1
    explanation: |
      must-understand tells a cache to store the response only if it understands
      the caching requirements of the response's status code. Pairing it with
      no-store means caches that do not understand a new status code safely fall
      back to not storing, future-proofing caching of newer codes.
    ref: "concepts.md#immutable-and-must-understand"

  - id: http-caching-and-conditional-requests-057
    difficulty: advanced
    tags: [range, if-range, 206]
    question: |
      A download client resumes with `Range: bytes=500000-` and
      `If-Range: "abc-strong"`, but the file changed and now has ETag
      `"def-strong"`. What does a compliant server return?
    options:
      - "206 Partial Content with the requested byte range from the new file"
      - "416 Range Not Satisfiable, because the changed validator makes the requested byte offset invalid"
      - "200 OK with the full, updated representation, ignoring the Range"
      - "412 Precondition Failed, since the If-Range validator no longer matches the current representation"
    answer: 2
    explanation: |
      If-Range guards against stitching bytes across versions. When the validator
      no longer matches, the server ignores Range and returns the full 200 with
      the new body, so the client restarts the download rather than merging
      inconsistent bytes.
    ref: "concepts.md#range-requests-and-if-range"

  - id: http-caching-and-conditional-requests-058
    difficulty: advanced
    tags: [range, weak-etag, strong-validator]
    question: |
      Why must a weak ETag NOT be used with `Range`/`If-Range` requests?
    options:
      - "Weak ETags carry a W/ prefix that inflates their length past the header size limit servers enforce on ranged requests"
      - "Range reassembly requires byte-exact identity, but a weak validator only guarantees semantic equivalence, so bytes may differ between the range and the whole"
      - "Weak ETags are prohibited in a 206 Partial Content response, so a server must strip them before returning any range"
      - "Range requests are only defined over HTTP/2 connections, and the HTTP/2 specification forbids weak ETags on any partial transfer"
    answer: 1
    explanation: |
      A weak validator permits byte-level differences between equivalent
      representations. Range requests reconstruct a resource from byte offsets, so
      a byte-exact (strong) validator is required; otherwise merged ranges could
      combine bytes from differing representations.
    ref: "concepts.md#range-requests-and-if-range"

  - id: http-caching-and-conditional-requests-059
    difficulty: intermediate
    tags: [range, 416, accept-ranges]
    question: |
      A server that supports byte ranges receives `Range: bytes=999999999-` for a
      1 MB file. What status is appropriate, and what advertises range support in
      the first place?
    options:
      - "200 OK; support is advertised via the Allow header"
      - "416 Range Not Satisfiable; support is advertised via Accept-Ranges: bytes"
      - "204 No Content; support is advertised via Vary: Range"
      - "400 Bad Request; support is advertised via the ETag header"
    answer: 1
    explanation: |
      A range beyond the current length is unsatisfiable, yielding 416 Range Not
      Satisfiable. A server advertises range support with Accept-Ranges: bytes,
      and satisfiable ranges return 206 Partial Content with Content-Range.
    ref: "concepts.md#range-requests-and-if-range"

  - id: http-caching-and-conditional-requests-060
    difficulty: expert
    tags: [request-collapsing, thundering-herd, stale-while-revalidate]
    question: |
      Your origin melts every time a hot key expires at the CDN because thousands
      of clients miss simultaneously. Which combination fixes this WITHOUT
      lengthening how stale content can get?
    options:
      - "Increase max-age and s-maxage substantially so the hot key expires far less often and fewer simultaneous misses ever reach the origin"
      - "Enable request collapsing so one request revalidates, plus stale-while-revalidate to serve waiters instantly, plus stale-if-error for revalidation failures"
      - "Switch to Cache-Control: private so each user's browser caches the hot key independently and the shared CDN never has to fetch it"
      - "Add Vary: * to force per-request handling so the CDN spreads the expiring key across many distinct variants and dilutes the miss spike"
    answer: 1
    explanation: |
      Request collapsing folds concurrent identical misses into a single origin
      request; stale-while-revalidate lets waiters get the stale copy instantly
      while that one revalidation runs; stale-if-error prevents a failure from
      cascading. None of these lengthen the freshness lifetime.
    ref: "concepts.md#request-collapsing-coalescing"

  - id: http-caching-and-conditional-requests-061
    difficulty: expert
    tags: [request-collapsing, no-cache, coalescing]
    question: |
      Which statement about request collapsing (coalescing) is correct?
    options:
      - "It only helps while a stored response is still fresh; for no-cache or max-age=0 responses it is disabled because each request must revalidate anyway"
      - "It deduplicates concurrent in-flight identical requests into one origin request, so it helps even with no-cache/max-age=0, and is opted out of with private"
      - "It permanently stores the first response it coalesces and then ignores that response's Cache-Control directives on all subsequent reuse"
      - "It requires the response to carry Vary: * so the cache can reliably recognize which concurrent in-flight requests are identical"
    answer: 1
    explanation: |
      Collapsing works on in-flight requests, deduplicating concurrent identical
      misses/revalidations into one origin fetch. It therefore helps even when
      every request must revalidate (no-cache / max-age=0). It only applies where
      responses are interchangeable, so private opts out.
    ref: "concepts.md#request-collapsing-coalescing"

  - id: http-caching-and-conditional-requests-062
    difficulty: expert
    tags: [web-cache-poisoning, unkeyed-input, security]
    question: |
      An application reflects the `X-Forwarded-Host` header into an absolute URL
      in its HTML, and the CDN keys cache entries only on method + path. How does
      this enable web cache poisoning?
    options:
      - "It cannot happen, because X-Forwarded-Host is always included in the cache key by default and so every distinct value stores a separate entry"
      - "An attacker sends a malicious X-Forwarded-Host; the origin reflects it, and because that header is unkeyed the poisoned response is stored under the clean key and served to all users"
      - "It only slows the CDN slightly by adding one extra reflected header to every response, with no effect on what content other users receive"
      - "It forces the CDN to mark every affected response as private, so the entries are stored per user and cannot be shared or poisoned"
    answer: 1
    explanation: |
      The header is an unkeyed input: it influences the response but is not in the
      cache key. An attacker crafts a request whose reflected X-Forwarded-Host
      injects a malicious value; the cache stores that response under the normal
      key and serves it to every subsequent user.
    ref: "concepts.md#web-cache-poisoning"

  - id: http-caching-and-conditional-requests-063
    difficulty: expert
    tags: [web-cache-poisoning, defense, cache-key]
    question: |
      A header genuinely affects a cacheable response but is currently unkeyed and
      attacker-influenceable. What is the most robust defense against cache
      poisoning?
    options:
      - "Simply strip the header from the outgoing response while the origin continues to read and reflect it, so the poisoned value never reaches the cache"
      - "Stop reflecting attacker-controllable inputs into cached responses, and where a header truly affects the response, normalize/rewrite it into the cache key rather than leaving it unkeyed"
      - "Increase the cache TTL substantially so that any poisoned entries are flushed and replaced with clean ones far more quickly than before"
      - "Add Vary: Cookie so the cache isolates every user into a separate variant and an attacker's poisoned entry can never be served to a victim"
    answer: 1
    explanation: |
      The root cause is a mismatch between the cache key and the response
      footprint. Excluding the header from the key while the origin still uses it
      leaves the hole open. The fix is to not reflect untrusted inputs and to
      key on (normalized) headers that actually affect the response.
    ref: "concepts.md#web-cache-poisoning"

  - id: http-caching-and-conditional-requests-064
    difficulty: expert
    tags: [web-cache-deception, security, scenario]
    question: |
      An attacker tricks a victim into loading `https://app.example.com/api/me/photo.jpg`.
      The origin ignores the `.jpg` suffix and returns the victim's private JSON
      profile, and the CDN caches responses whose URL ends in an image extension.
      What is this attack and its consequence?
    options:
      - "Web cache poisoning; the attacker injects a malicious script payload into the shared entry so it executes in other users' rendered pages"
      - "Web cache deception; the victim's private response is stored under a cacheable-looking URL and the attacker then reads it"
      - "A CORS misconfiguration; a permissive Access-Control-Allow-Origin lets the attacker's site read the JSON directly, and no caching is involved at all"
      - "A range-request attack; the attacker issues overlapping Range requests to reconstruct the victim's private profile byte by byte from 206 responses"
    answer: 1
    explanation: |
      This is web cache deception: path confusion plus extension-based caching
      cause the cache to store the victim's authenticated response publicly. The
      attacker requests the same URL and reads the exposed private data. It is
      exposure, not payload injection (that would be poisoning).
    ref: "concepts.md#web-cache-deception"

  - id: http-caching-and-conditional-requests-065
    difficulty: advanced
    tags: [web-cache-deception, defense, content-type]
    question: |
      Which set of measures most directly prevents web cache deception?
    options:
      - "Cache based on the actual response Content-Type rather than URL extension, never cache responses marked private/no-store, and disable path confusion"
      - "Add Vary: User-Agent so each browser gets its own variant, and lengthen the TTL so private responses are flushed from the cache sooner"
      - "Reflect the requested path back into the response body so clients can detect a mismatched extension and refuse to cache the response"
      - "Serve all authenticated pages with Cache-Control: public so the cache handles them uniformly and no ambiguous path can slip through"
    answer: 0
    explanation: |
      WCD stems from caching by URL shape while the origin serves dynamic private
      content. Keying cache decisions on real Content-Type, honoring
      private/no-store, and eliminating path confusion (so /x/y.css cannot map to
      a dynamic handler) close the gap.
    ref: "concepts.md#web-cache-deception"

  - id: http-caching-and-conditional-requests-066
    difficulty: expert
    tags: [cdn-cache-control, rfc-9213, precedence]
    question: |
      A response is sent with `Cache-Control: max-age=60`, `s-maxage=300`, and
      `CDN-Cache-Control: max-age=86400`. How long does an RFC 9213-aware CDN
      treat the response as fresh, and how long does a browser?
    options:
      - "CDN 60s, browser 60s, because generic max-age always wins and CDN-Cache-Control is only an advisory hint"
      - "CDN 300s, browser 60s, because CDN-Cache-Control is ignored and s-maxage governs the CDN instead"
      - "CDN 86400s (CDN-Cache-Control wins over s-maxage and max-age), browser 60s (it ignores the targeted field)"
      - "CDN 86400s, browser 86400s, because browsers also honor CDN-Cache-Control once it is present on the response"
    answer: 2
    explanation: |
      RFC 9213 targeted fields take precedence at the cache they target:
      CDN-Cache-Control > s-maxage > max-age/Expires at the CDN, so the CDN uses
      86400s. Targeted fields are not honored by browsers, which fall back to the
      generic Cache-Control max-age of 60s.
    ref: "concepts.md#cdn-cache-control-and-targeted-cache-directives-rfc-9213"

  - id: http-caching-and-conditional-requests-067
    difficulty: advanced
    tags: [cdn-cache-control, rfc-9213, surrogate-control]
    question: |
      What is the significance of RFC 9213 relative to the older
      `Surrogate-Control` convention?
    options:
      - "It deprecates all existing caching headers in favor of driving cache freshness entirely through signed cookies exchanged with each cache tier"
      - "It standardizes targeted cache-control fields (e.g. CDN-Cache-Control) with defined precedence, replacing the non-standard Surrogate-Control convention"
      - "It removes s-maxage from the caching specification entirely, so shared caches must now rely only on the generic max-age directive"
      - "It applies only to browser private caches and defines no behavior at all for CDNs, reverse proxies, or other shared cache tiers"
    answer: 1
    explanation: |
      RFC 9213 (Targeted HTTP Cache Control) provides a standardized mechanism for
      directives addressed to a specific class of caches, notably CDN-Cache-Control,
      with a defined precedence. It is the standards-track successor to ad-hoc
      Surrogate-Control usage.
    ref: "concepts.md#cdn-cache-control-and-targeted-cache-directives-rfc-9213"

  - id: http-caching-and-conditional-requests-068
    difficulty: expert
    tags: [cache-status, rfc-9211, observability]
    question: |
      You need to prove in production that a specific CDN served a response from
      cache and see its remaining TTL. Which standardized mechanism gives this
      directly?
    options:
      - "The non-standard X-Cache header, whose hit/miss tokens and TTL fields you interpret by guessing each CDN vendor's private convention"
      - "The Cache-Status response header (RFC 9211), a structured field where each cache reports hit/fwd/stored and parameters like ttl"
      - "The Age header alone, which always equals the remaining TTL and so directly reveals both cache status and time left"
      - "The Vary header, which each cache populates with its hit/miss decision and remaining TTL for that specific stored variant"
    answer: 1
    explanation: |
      RFC 9211 defines the structured Cache-Status header. Each cache on the path
      appends an entry naming itself plus parameters such as hit, fwd=miss,
      stored, and ttl. It is the modern, standardized replacement for ad-hoc
      X-Cache headers.
    ref: "concepts.md#cache-status-observability-rfc-9211"

  - id: http-caching-and-conditional-requests-069
    difficulty: expert
    tags: [cache-status, low-hit-rate, diagnosis]
    question: |
      Cache-Status shows almost every request as `fwd=miss; stored` and hit rate
      is near zero, yet content rarely changes. Which explanation is LEAST likely
      and which is most likely?
    options:
      - "Most likely: an over-broad Vary or unnormalized keys (query order/header casing) fragmenting variants; least likely: the origin is too fast"
      - "Most likely: the origin responds too fast for the cache to ever store an entry; least likely: an over-broad Vary fragmenting the variants"
      - "Most likely: repeated TLS handshakes are resetting the stored entries; least likely: missing cache-key normalization of query order and casing"
      - "Most likely: a missing Age header prevents the cache from computing freshness; least likely: the response's Vary settings are too broad"
    answer: 0
    explanation: |
      A flood of misses despite stable content points to variant fragmentation:
      an over-broad Vary (e.g. User-Agent/Cookie) or unnormalized cache keys
      (varying query-param order, header casing) create near-unique keys. Origin
      speed does not affect hit rate.
    ref: "concepts.md#cache-status-observability-rfc-9211"

  - id: http-caching-and-conditional-requests-070
    difficulty: expert
    tags: [etag, compression, vary, pitfall]
    question: |
      Why can enabling gzip at a load balancer break `If-None-Match` when the
      origin emits a strong ETag computed over the compressed bytes?
    options:
      - "gzip strips the ETag header entirely as it rewrites the body, so the client has no validator left to send in If-None-Match"
      - "The same logical resource yields different byte streams per encoding, so a byte-based strong ETag differs by encoding; without Vary: Accept-Encoding the validators collide and conditional requests misbehave"
      - "Strong ETags are forbidden on any compressed response by RFC 9110, so the load balancer must downgrade them and conditional requests then fail"
      - "gzip automatically converts the strong ETag to a weak validator, and weak validators are rejected outright by If-None-Match comparison"
    answer: 1
    explanation: |
      A strong ETag is byte-exact. If it is computed after compression, gzip vs
      br vs identity produce different ETags for the same resource; without
      Vary: Accept-Encoding a cache can hand the wrong variant/validator. The fix
      is a weak ETag for encoding-only differences, or ETag-before-compression
      plus Vary: Accept-Encoding.
    ref: "concepts.md#etag-generation-strategies-and-pitfalls"

  - id: http-caching-and-conditional-requests-071
    difficulty: expert
    tags: [etag, replicas, load-balancer, stability]
    question: |
      Behind a load balancer, a client frequently gets full 200 responses where a
      304 was expected. ETags are generated from each node's process-local counter
      and a per-request serialization of a JSON object with unordered keys. What is
      the root cause?
    options:
      - "The load balancer strips the If-None-Match header before forwarding, so the origin never sees the validator and always returns a full 200"
      - "ETag generation is non-deterministic across replicas (per-node counters, unordered serialization), so equivalent resources get different ETags and conditional requests never match"
      - "304 responses are automatically disabled by HTTP whenever more than one replica sits behind the load balancer, forcing full 200 responses"
      - "The client is sending weak ETags in If-None-Match where the server demands strong ones, so the comparison is rejected and yields a full 200"
    answer: 1
    explanation: |
      Per-node counters and non-canonical serialization make two replicas emit
      different ETags for the same logical resource. If-None-Match then never
      matches across nodes, forcing spurious 200s. Fix: deterministic, shared
      ETags (canonical serialization, stored version, or content hash of
      canonical bytes).
    ref: "concepts.md#etag-generation-strategies-and-pitfalls"

  - id: http-caching-and-conditional-requests-072
    difficulty: advanced
    tags: [heuristic, status-codes, rfc-9110]
    question: |
      Which of these status codes is explicitly on the list of heuristically
      cacheable responses (so a cache may cache it even without explicit
      freshness directives)?
    options:
      - "302 Found"
      - "401 Unauthorized"
      - "404 Not Found"
      - "500 Internal Server Error"
    answer: 2
    explanation: |
      The heuristically cacheable list includes 200, 203, 204, 206, 300, 301,
      308, 404, 405, 410, 414, and 501. 404 is on it, which surprises many, so a
      missing resource can be cached heuristically. 302, 401, and 500 are not on
      the list.
    ref: "concepts.md#heuristic-freshness-specifics"

  - id: http-caching-and-conditional-requests-073
    difficulty: advanced
    tags: [heuristic, lm-factor, disable]
    question: |
      A response has `Last-Modified` 100 days ago, `Date` now, and no explicit
      expiration. Using the common LM-factor heuristic, roughly how long might a
      cache treat it as fresh, and what would disable this behavior?
    options:
      - "About 10 days fresh (~10% of the 100-day age); any explicit Cache-Control/Expires directive disables the heuristic"
      - "Exactly 100 days fresh, because the heuristic uses the full time since Last-Modified; nothing can disable it once set"
      - "Zero seconds, because heuristic freshness never applies to a response that carries only a Last-Modified date"
      - "About 50 days fresh (roughly half the age since Last-Modified); only an explicit no-store directive can disable it"
    answer: 0
    explanation: |
      The LM-factor heuristic assigns roughly 10% of (Date - Last-Modified), so
      ~10 days here. Presence of any explicit expiration (max-age, s-maxage, or
      Expires) turns heuristic freshness off entirely.
    ref: "concepts.md#heuristic-freshness-specifics"

  - id: http-caching-and-conditional-requests-074
    difficulty: expert
    tags: [vary, secondary-cache-key, rfc-9111]
    question: |
      A cache stores several representations of `/report` that differ by
      `Accept-Encoding`. Which concept describes how it picks the right stored
      variant for a new request?
    options:
      - "It uses only the primary key (method + URI) and returns whichever stored variant it happens to find first for that URI"
      - "It uses a secondary cache key: the tuple of request-header values named in the stored response's Vary must match"
      - "It compares the ETags of all stored variants for that URI and returns the one whose validator sorts as strongest"
      - "It returns whichever stored variant currently has the largest remaining freshness lifetime (TTL) regardless of headers"
    answer: 1
    explanation: |
      Under one URI a cache keeps multiple variants keyed by a secondary cache key
      (RFC 9111 4.1): the values of the request headers listed in the stored
      Vary. The cache selects the variant whose secondary key matches the new
      request's corresponding header values.
    ref: "concepts.md#vary-internals-secondary-cache-keys-and-normalization"

  - id: http-caching-and-conditional-requests-075
    difficulty: expert
    tags: [vary, normalization, hit-rate]
    question: |
      Why do CDNs often normalize headers like `Accept-Encoding` (collapsing to a
      small set such as gzip/br/identity) before applying `Vary`?
    options:
      - "Because RFC 9111 explicitly forbids a shared cache from storing any response until its varied request headers have first been normalized"
      - "Because Vary matches on raw header values, so tiny differences in casing, ordering, or q-values create distinct variants; normalizing collapses them and raises hit rate without harming correctness"
      - "Because the origin's strong ETag is computed over the normalized Accept-Encoding value, so the validator cannot be verified without collapsing it first"
      - "Because normalizing the header is what downgrades the entry from a shared to a private cache copy, keeping negotiated variants off the CDN"
    answer: 1
    explanation: |
      Variant selection matches on raw header values, so cosmetically different
      but semantically identical values fragment the cache into many variants.
      Normalizing the headers before keying collapses these into few variants,
      dramatically improving hit rate while preserving correctness.
    ref: "concepts.md#vary-internals-secondary-cache-keys-and-normalization"

  - id: http-caching-and-conditional-requests-076
    difficulty: advanced
    tags: [negative-caching, 404, 5xx]
    question: |
      A public API is hammered with requests for nonexistent IDs, spiking origin
      load. What caching approach is appropriate, and what should you avoid?
    options:
      - "Cache 404/410 with a short TTL to shield the origin; avoid caching 5xx by default (use stale-if-error for outages instead)"
      - "Cache every 5xx response aggressively for several hours to absorb the flood, and never cache a 404 because misses must always reach the origin"
      - "Mark all 404 responses with Cache-Control: no-store so the cache forwards each nonexistent-ID lookup straight to the origin, reducing load"
      - "Use Vary: * on 404 responses so each nonexistent ID is isolated into its own per-user cache entry and cannot be shared across clients"
    answer: 0
    explanation: |
      Negative caching stores 404/410 briefly to absorb floods for missing keys.
      Caching 5xx by default is dangerous: a transient error would be pinned and
      amplified. To keep serving good content during an origin outage, use
      stale-if-error on the good responses instead.
    ref: "concepts.md#negative-caching-and-invalidation-precision"

  - id: http-caching-and-conditional-requests-077
    difficulty: expert
    tags: [invalidation, eviction, purge, rfc-9111]
    question: |
      Which statement correctly distinguishes invalidation, eviction, and explicit
      purge?
    options:
      - "All three are exact synonyms that permanently delete the cached entry from every tier immediately and identically"
      - "Invalidation (RFC 9111 4.4) marks entries stale on the write path after an unsafe method's non-error response; eviction is space reclamation under pressure; explicit purge is an out-of-band API call, often by surrogate/tag"
      - "Eviction can happen only at the origin server, purge only inside browsers, and invalidation only within CDN edge nodes"
      - "Purge and invalidation are identical operations, and eviction is triggered whenever a client receives a 412 Precondition Failed response"
    answer: 1
    explanation: |
      Invalidation marks entries stale (not deleted) and only at caches on the
      unsafe request's path, covering the target URI plus Location/Content-Location.
      Eviction is capacity-driven removal. Explicit purge is an out-of-band
      operation, frequently fanning out by surrogate key/tag.
    ref: "concepts.md#negative-caching-and-invalidation-precision"

  - id: http-caching-and-conditional-requests-078
    difficulty: advanced
    tags: [invalidation, purge, thundering-herd]
    question: |
      Purging a very popular key from all edge nodes at once can cause which
      problem, and how do you mitigate it?
    options:
      - "It causes a 412 Precondition Failed storm as every edge revalidates at once; mitigate by removing ETags so no preconditions can fail"
      - "It causes a thundering herd as all edges miss simultaneously; mitigate by combining purge with request collapsing and stale-while-revalidate"
      - "It causes clock skew across the edge fleet; mitigate by switching freshness from relative max-age to absolute Expires dates"
      - "It corrupts the secondary cache key for the purged URI; mitigate by adding Vary: * so each request is treated as unique"
    answer: 1
    explanation: |
      A purge drops the entry everywhere at once, so the next requests all miss
      together and stampede the origin. Pairing purge with request collapsing
      (one origin fetch) and stale-while-revalidate (serve stale while
      refreshing) absorbs the surge.
    ref: "concepts.md#negative-caching-and-invalidation-precision"

  - id: http-caching-and-conditional-requests-079
    difficulty: expert
    tags: [bfcache, no-cache, no-store, navigation]
    question: |
      A user edits a form, submits, then clicks the browser Back button and sees
      the OLD page despite `Cache-Control: no-cache` on that page. Why, and what
      would actually prevent it?
    options:
      - "The browser is ignoring no-cache because of a rendering-engine bug; clearing the site's cookies and cached credentials fixes the stale Back-button view"
      - "The back/forward cache restores an in-memory snapshot rather than revalidating; no-cache does not disqualify a page from bfcache, but Cache-Control: no-store does"
      - "The page's ETag was emitted as a weak validator, so the Back navigation skips revalidation; switching to a strong ETag forces a fresh fetch"
      - "The stored response's Age header had already exceeded its max-age before submission; lowering the max-age value makes the Back button refetch it"
    answer: 1
    explanation: |
      bfcache stores a full page snapshot (DOM + JS state) for instant history
      navigation and is not the HTTP cache. no-cache does not force revalidation
      on a back/forward navigation. To keep a page out of bfcache you use
      Cache-Control: no-store.
    ref: "concepts.md#bfcache-and-history-navigation"

  - id: http-caching-and-conditional-requests-080
    difficulty: expert
    tags: [scenario, design, headers, mixed]
    question: |
      Match the best cache-header strategy to each endpoint: (a) a content-hashed
      JS bundle, (b) an authenticated account page. Which pairing is correct?
    options:
      - "(a) Cache-Control: no-store, must-revalidate; (b) Cache-Control: public, max-age=31536000, immutable"
      - "(a) Cache-Control: public, max-age=31536000, immutable; (b) Cache-Control: private, no-cache"
      - "(a) Cache-Control: private, no-cache; (b) Cache-Control: public, s-maxage=3600, stale-while-revalidate=60"
      - "(a) Vary: *, Cache-Control: no-transform; (b) Cache-Control: public, immutable, max-age=31536000"
    answer: 1
    explanation: |
      A hashed bundle never changes at its URL, so public + one-year max-age +
      immutable (no needless revalidation) is ideal. An authenticated account
      page must not be shared, so private prevents shared-cache storage while
      no-cache forces revalidation of the browser's own copy before reuse.
    ref: "concepts.md#immutable-and-must-understand"

  - id: http-caching-and-conditional-requests-081
    difficulty: expert
    tags: [scenario, data-leak, security, multi-cause]
    question: |
      Users intermittently see another user's account data from the CDN. Which of
      the following is NOT a plausible root cause of this specific leak?
    options:
      - "The authenticated response was sent with s-maxage, permitting shared-cache storage of per-user data"
      - "The response lacked Cache-Control: private and the cache key ignored the Authorization/identity"
      - "A weak ETag was used on the GET instead of a strong one"
      - "Path confusion allowed web cache deception, storing a private response under a static-looking URL"
    answer: 2
    explanation: |
      Cross-user leakage comes from shared-cache storage of per-user data:
      s-maxage on an auth response, missing private, a key that ignores identity,
      or WCD path confusion. Weak vs strong ETag affects conditional-request
      semantics (ranges/If-Match), not whether one user's body is served to
      another.
    ref: "concepts.md#web-cache-deception"

  - id: http-caching-and-conditional-requests-082
    difficulty: advanced
    tags: [concurrency, if-match, 412, last-modified]
    question: |
      Two clients read `/doc` at ETag `"v7"` and both PATCH concurrently with
      `If-Match: "v7"`. The first write succeeds (new ETag `"v8"`). What exactly
      happens to the second, and how does this differ from using
      If-Unmodified-Since with 1-second resolution?
    options:
      - "The second write also succeeds, because both clients sent the identical If-Match: v7 value and the server compares them to each other rather than to the current ETag"
      - "The second gets 412 Precondition Failed because the current ETag is now v8, not v7; with If-Unmodified-Since, two writes in the same second could both pass due to 1s resolution, allowing a lost update"
      - "The second gets 304 Not Modified, because If-Match on a matching prior read is treated by the server exactly like a conditional GET that finds nothing changed"
      - "The second silently overwrites the first with no error, and a date-based If-Unmodified-Since precondition would likewise just return 200 and apply the write"
    answer: 1
    explanation: |
      The loser's If-Match: v7 no longer matches the current v8, so it gets 412 and
      must refetch/merge/retry — a clean mid-air-collision guard. Date-based
      If-Unmodified-Since has only 1-second granularity, so two updates within the
      same second can both appear unmodified and cause a lost update.
    ref: "concepts.md#optimistic-concurrency-if-match--if-unmodified-since-and-412"

  - id: http-caching-and-conditional-requests-083
    difficulty: intermediate
    tags: [range, accept-ranges, streaming]
    question: |
      Which header does a server send to tell clients it supports partial
      (range) requests, enabling resumable downloads and video seeking?
    options:
      - "Content-Range on every 200 response"
      - "Accept-Ranges: bytes"
      - "Vary: Range"
      - "Allow: RANGE"
    answer: 1
    explanation: |
      Accept-Ranges: bytes advertises that the server supports byte-range
      requests. Clients can then send Range headers to fetch parts of the
      representation, receiving 206 Partial Content with a Content-Range header.
    ref: "concepts.md#range-requests-and-if-range"
