topic: "Request Validation & Data Integrity"
domain: rest-api-design
topic_slug: request-validation-and-data-integrity
version: 1
questions:
  - id: request-validation-and-data-integrity-001
    difficulty: beginner
    tags: [why-validate, fundamentals]
    question: |
      Why is validating incoming requests at an API considered a data-integrity
      concern (not just a convenience)?
    options:
      - "Validation makes JSON parsing faster on the server because pre-checked payloads let the deserializer skip its type-inference pass"
      - "The API is often the only gatekeeper before untrusted data is persisted, and bad data once stored is expensive to unwind"
      - "Validation is required by the HTTP specification, which mandates a schema check on every request before a 2xx response"
      - "It reduces the number of TCP connections a client must open by letting the server reuse one validated socket per session"
    answer: 1
    explanation: |
      An API frequently sits between the outside world and the database. If bad
      data (a negative price, malformed email) is persisted, it can corrupt
      reports and break downstream consumers, and repairing it later costs far
      more than rejecting at ingress.
    ref: "concepts.md#why-validate-requests"

  - id: request-validation-and-data-integrity-002
    difficulty: beginner
    tags: [why-validate, security, owasp]
    question: |
      Unvalidated request input is most directly the raw material for which class
      of problems?
    options:
      - "Expired TLS certificates and handshake renegotiation failures"
      - "Injection and resource-exhaustion attacks"
      - "DNS resolution timeouts and stale resolver cache entries"
      - "HTTP/2 HPACK header-compression state bugs"
    answer: 1
    explanation: |
      Unvalidated input feeds injection (SQL/command/XSS) and
      resource-exhaustion attacks, which is why several OWASP API Security Top 10
      (2023) categories map directly to missing validation.
    ref: "concepts.md#why-validate-requests"

  - id: request-validation-and-data-integrity-003
    difficulty: intermediate
    tags: [why-validate, defense-in-depth]
    question: |
      An interviewer asks how you think about request validation architecturally.
      Which framing signals the strongest understanding?
    options:
      - "Validate once at the API gateway, so internal services downstream can fully trust that input without re-checking"
      - "Validation should be skipped for authenticated users since they are already trusted by definition"
      - "Only validate the specific fields that clients complain about in their support tickets"
      - "Validation is defense in depth: validate at the edge AND never assume an upstream layer already did it"
    answer: 3
    explanation: |
      The strong answer treats validation as defense in depth, not a single gate.
      Internal callers, retries, and other entry points can bypass the edge, so
      each layer must protect its own assumptions.
    ref: "concepts.md#why-validate-requests"

  - id: request-validation-and-data-integrity-004
    difficulty: beginner
    tags: [syntactic-semantic, definitions]
    question: |
      Which check is an example of SYNTACTIC validation?
    options:
      - "Confirming the referenced userId exists in the database"
      - "Checking that a submitted coupon code has not expired or been used"
      - "Verifying that the 'age' field is an integer and not a string"
      - "Ensuring the requested quantity is not more than current inventory"
    answer: 2
    explanation: |
      Syntactic validation checks form and is stateless: correct type, format,
      and length. The other options need external state (DB, business rules) and
      are therefore semantic validation.
    ref: "concepts.md#syntactic-vs-semantic-validation"

  - id: request-validation-and-data-integrity-005
    difficulty: intermediate
    tags: [syntactic-semantic, state]
    question: |
      What most reliably distinguishes semantic validation from syntactic
      validation?
    options:
      - "Semantic validation always runs on the client while syntactic validation is the part that runs on the server after arrival"
      - "Semantic validation usually requires external state (DB lookups, business rules), while syntactic validation needs only the request and a schema"
      - "Semantic validation is always cheaper because it skips the schema-parsing step that syntactic checks require up front"
      - "Syntactic validation can only be done in the database layer, since type and format enforcement lives in column constraints"
    answer: 1
    explanation: |
      Syntactic checks are stateless (shape/type/format from the request plus a
      schema). Semantic checks are stateful, needing DB lookups or cross-field
      business rules like existence or expiry.
    ref: "concepts.md#syntactic-vs-semantic-validation"

  - id: request-validation-and-data-integrity-006
    difficulty: intermediate
    tags: [syntactic-semantic, status-codes]
    question: |
      A request body parses fine and matches the schema, but the coupon it
      references expired yesterday. This is a failure of which kind of validation,
      and what status is most appropriate?
    options:
      - "Syntactic validation; 400 Bad Request"
      - "Syntactic validation; 415 Unsupported Media Type"
      - "Semantic validation; 422 (or 409 for a conflict)"
      - "Neither; return 200 OK with an error object"
    answer: 2
    explanation: |
      An expired coupon is a stateful business rule, i.e. semantic validation.
      Since the body parsed and matched the schema but the instructions cannot be
      processed, 422 (or 409 for a conflict) fits.
    ref: "concepts.md#syntactic-vs-semantic-validation"

  - id: request-validation-and-data-integrity-007
    difficulty: advanced
    tags: [syntactic-semantic, cross-field, json-schema]
    question: |
      "shippingAddress is required only when deliveryMethod == 'ship'." Where does
      this constraint sit?
    options:
      - "It is purely semantic and can never be expressed in a schema, because conditional requiredness depends on runtime values a validator cannot see"
      - "It is a cross-field constraint many schemas CAN express (if/then/else, dependentRequired), so it is largely syntactic — but 'the address is deliverable' is semantic"
      - "It is syntactic only if the client validates it first; once it reaches the server the conditional rule becomes a purely semantic concern"
      - "It is neither syntactic nor semantic; conditional-required fields are actually an authorization concern decided by the caller's role"
    answer: 1
    explanation: |
      Conditional-required constraints can be expressed with JSON Schema
      if/then/else or dependentRequired, so they're on the syntactic side.
      Whether the address is real and deliverable is firmly semantic.
    ref: "concepts.md#syntactic-vs-semantic-validation"

  - id: request-validation-and-data-integrity-008
    difficulty: beginner
    tags: [sanitization, validation, definitions]
    question: |
      What is the core difference between validation and sanitization?
    options:
      - "Validation transforms the input into a canonical form, while sanitization is the step that rejects input breaking the rules"
      - "Validation rejects input that fails the rules; sanitization modifies input to make it safe or canonical"
      - "They are simply two interchangeable words for the same accept-or-reject operation on request input"
      - "Validation applies only to request headers, whereas sanitization applies only to request bodies and never headers"
    answer: 1
    explanation: |
      Validation accepts or rejects the input as-is; sanitization mutates the
      input (trimming, stripping, lowercasing). They are not interchangeable.
    ref: "concepts.md#sanitization-vs-validation"

  - id: request-validation-and-data-integrity-009
    difficulty: intermediate
    tags: [sanitization, injection, security]
    question: |
      What is the recommended primary defense against SQL injection?
    options:
      - "Stripping the word 'DROP' and quotes from all input"
      - "A denylist of known-bad SQL keywords in a WAF"
      - "Base64-encoding every request body"
      - "Parameterized queries / prepared statements"
    answer: 3
    explanation: |
      Parameterized queries separate code from data and are the correct primary
      defense. Input sanitization via blocklists is bypass-prone and should only
      be a supporting control, not the primary defense.
    ref: "concepts.md#sanitization-vs-validation"

  - id: request-validation-and-data-integrity-010
    difficulty: intermediate
    tags: [sanitization, xss, output-encoding]
    question: |
      For preventing XSS, which statement is correct?
    options:
      - "Input sanitization that strips <script> tags on the way in is the single most reliable XSS defense"
      - "XSS is impossible whenever the API returns JSON, so no output-encoding defense is ever needed"
      - "Context-aware output encoding at the point of use is the correct defense; input stripping is fragile and bypassable"
      - "Validating the Content-Length header on every request fully prevents XSS from reaching the browser"
    answer: 2
    explanation: |
      XSS defense is context-specific output encoding (HTML, JS, URL contexts
      differ) at the point where data is rendered. Stripping tags on input is
      famously bypassable. Store faithfully, encode on output.
    ref: "concepts.md#sanitization-vs-validation"

  - id: request-validation-and-data-integrity-011
    difficulty: advanced
    tags: [sanitization, canonicalization, ordering]
    question: |
      If your API both canonicalizes (e.g., Unicode NFC normalize, trim) and
      validates a username, what is the correct order?
    options:
      - "Validate the raw value first, and only afterward canonicalize it"
      - "Canonicalize/normalize first, then validate the normalized value"
      - "Order does not matter since both steps are idempotent and commute"
      - "Never do both — pick either canonicalization or validation, not both"
    answer: 1
    explanation: |
      Canonicalize before validating. Validating first can let 'admin ' (trailing
      space) or a Unicode look-alike pass a check that the normalized value would
      have failed.
    ref: "concepts.md#sanitization-vs-validation"

  - id: request-validation-and-data-integrity-012
    difficulty: beginner
    tags: [json-schema, openapi]
    question: |
      Which schema language does OpenAPI 3.1 adopt for describing and validating
      JSON payloads?
    options:
      - "XML Schema (XSD)"
      - "JSON Schema (Draft 2020-12)"
      - "Protocol Buffers"
      - "A proprietary OpenAPI-only grammar unrelated to JSON Schema"
    answer: 1
    explanation: |
      OpenAPI 3.1 aligns fully with JSON Schema Draft 2020-12, so the schema you
      document is the schema you can validate against.
    ref: "concepts.md#schema-and-constraint-validation-json-schema"

  - id: request-validation-and-data-integrity-013
    difficulty: intermediate
    tags: [json-schema, format, gotcha]
    question: |
      A schema declares "email": { "type": "string", "format": "email" }. By
      default in JSON Schema, what does the "format" keyword do?
    options:
      - "It always rejects any string that is not a syntactically valid email address"
      - "It is annotation-only (advisory) unless format assertion is explicitly enabled in the validator"
      - "It automatically converts the string into a canonical, lower-cased email before storage"
      - "It is ignored entirely by every validator and carries no meaning whatsoever"
    answer: 1
    explanation: |
      In JSON Schema, 'format' is an annotation by default; it only asserts
      (rejects) when format assertion is enabled. Otherwise pair it with a
      'pattern' or explicit check to actually reject bad emails.
    ref: "concepts.md#schema-and-constraint-validation-json-schema"

  - id: request-validation-and-data-integrity-014
    difficulty: intermediate
    tags: [json-schema, additional-properties]
    question: |
      Which JSON Schema keyword prevents unknown/extra fields from being silently
      accepted in an object?
    options:
      - "requireAll: true"
      - "closed: true"
      - "strict: true"
      - "additionalProperties: false"
    answer: 3
    explanation: |
      additionalProperties: false rejects properties not listed in the schema.
      It is the schema-level guard against over-posting. (strict/closed/requireAll
      are not JSON Schema keywords.)
    ref: "concepts.md#schema-and-constraint-validation-json-schema"

  - id: request-validation-and-data-integrity-015
    difficulty: advanced
    tags: [json-schema, openapi, nullable]
    question: |
      How do OpenAPI 3.0 and 3.1 differ in expressing that a field may be null?
    options:
      - "They are identical, since both versions express nullability with 'nullable: true'"
      - "3.0 used 'nullable: true'; 3.1 uses JSON Schema 2020-12, so you use type: [\"string\", \"null\"]"
      - "3.1 dropped the concept of nullability entirely from the schema language"
      - "3.0 used JSON Schema type arrays, while 3.1 introduced the new 'nullable: true' keyword"
    answer: 1
    explanation: |
      OpenAPI 3.0 used a modified JSON Schema subset with 'nullable: true'.
      OpenAPI 3.1 aligns with JSON Schema 2020-12, where nullability is expressed
      with a type array like ["string", "null"].
    ref: "concepts.md#schema-and-constraint-validation-json-schema"

  - id: request-validation-and-data-integrity-016
    difficulty: intermediate
    tags: [json-schema, design-first, single-source]
    question: |
      What is the main advantage of design-first schema validation over
      hand-written 'if' checks scattered in code?
    options:
      - "Hand-written if-checks are always faster at runtime because they compile to direct branch instructions"
      - "Schemas cannot express numeric ranges or string lengths, so relying on them forces developers to write simpler code"
      - "A single schema is one source of truth driving docs, SDK generation, server validation, and contract tests, keeping them from drifting"
      - "It removes the need for any server-side validation, since a published schema is enforced automatically by clients"
    answer: 2
    explanation: |
      A shared OpenAPI/JSON Schema doc is a single source of truth: it drives
      documentation, client SDKs, request validation, and contract tests, so they
      stay consistent instead of drifting apart.
    ref: "concepts.md#schema-and-constraint-validation-json-schema"

  - id: request-validation-and-data-integrity-017
    difficulty: beginner
    tags: [required-optional, json-schema]
    question: |
      In JSON Schema, how do you make a field required?
    options:
      - "By listing it under 'properties'"
      - "By adding it to the 'required' array"
      - "By setting 'optional: false' on the property"
      - "By giving it a default value"
    answer: 1
    explanation: |
      Presence is controlled by the 'required' array, not by listing a property.
      Listing a property under 'properties' only constrains it when present; it
      does not make it required.
    ref: "concepts.md#required-vs-optional-fields"

  - id: request-validation-and-data-integrity-018
    difficulty: intermediate
    tags: [required-optional, null, empty]
    question: |
      "Required", "non-null", and "non-empty" are:
    options:
      - "Just three different names for one and the same presence check"
      - "All three are automatically implied the moment you declare 'type: string'"
      - "Concepts that are only meaningful when applied to array fields"
      - "Three separate checks — present, not JSON null, and length > 0 respectively"
    answer: 3
    explanation: |
      They are distinct: 'required' means the key is present; non-null means the
      value isn't null; non-empty means a string/array has content. A field can be
      required but nullable, or optional but non-null when present.
    ref: "concepts.md#required-vs-optional-fields"

  - id: request-validation-and-data-integrity-019
    difficulty: advanced
    tags: [required-optional, patch, merge-patch]
    question: |
      Under JSON Merge Patch (RFC 7396), what is the difference between sending
      a field as null versus omitting it?
    options:
      - "Both a null value and an omitted field mean 'leave the field unchanged'"
      - "null means 'delete this field'; omitting it means 'leave it unchanged'"
      - "Both a null value and an omitted field mean 'delete this field'"
      - "null means 'leave unchanged'; omitting it means 'delete'"
    answer: 1
    explanation: |
      In JSON Merge Patch, an explicit null instructs the server to remove/clear
      the member, while omitting it leaves the existing value untouched. Conflating
      the two corrupts partial updates.
    ref: "concepts.md#required-vs-optional-fields"

  - id: request-validation-and-data-integrity-020
    difficulty: intermediate
    tags: [required-optional, create-update]
    question: |
      Why is it risky to reuse the exact same validation schema for POST (create)
      and PATCH (partial update)?
    options:
      - "PATCH is forbidden by RFC 5789 from carrying a request body, so no validation schema can apply to it"
      - "POST and PATCH must use different content types (JSON vs merge-patch+json), so a single schema can never be shared between them"
      - "On create, fields like 'email' may be required, but on partial update the client sends only what changes, so requiring them would reject valid updates"
      - "Validation schemas can only be attached to GET requests, since write methods are checked by the database layer instead"
    answer: 2
    explanation: |
      Create typically requires core fields; a partial update sends only changed
      fields, so blanket 'required' rules would wrongly reject valid PATCH
      requests. Required-ness differs by method.
    ref: "concepts.md#required-vs-optional-fields"

  - id: request-validation-and-data-integrity-021
    difficulty: advanced
    tags: [required-optional, patch, min-properties]
    question: |
      Adding "minProperties": 1 to a PATCH request body schema primarily
      accomplishes what?
    options:
      - "Forces the client to send every one of the resource's fields on each update"
      - "Limits the request body to exactly one property per update"
      - "Makes every property defined in the schema mandatory on each request"
      - "Rejects an empty {} update that would be an unintended no-op"
    answer: 3
    explanation: |
      minProperties: 1 rejects an empty object, catching a client that submits a
      no-op update it didn't intend. It does not require any specific field or all
      fields.
    ref: "concepts.md#required-vs-optional-fields"

  - id: request-validation-and-data-integrity-022
    difficulty: beginner
    tags: [mass-assignment, definitions, owasp]
    question: |
      What is "mass assignment" (over-posting)?
    options:
      - "Sending a large burst of requests at once to overload the server and exhaust its connection pool"
      - "Blindly binding every field in the request body to an internal object, letting a client set fields it shouldn't"
      - "Assigning the same value to many database rows at once in a single bulk update statement"
      - "Batching multiple resources together into one response payload to reduce round trips"
    answer: 1
    explanation: |
      Mass assignment / over-posting occurs when the server auto-binds all body
      fields to an internal entity, so a client can set unintended fields (like
      'role' or 'balance'). It maps to OWASP API3:2023.
    ref: "concepts.md#mass-assignment-and-over-posting-control"

  - id: request-validation-and-data-integrity-023
    difficulty: intermediate
    tags: [mass-assignment, allow-list, defense]
    question: |
      An endpoint lets a user edit their profile via PATCH /users/me. A user sends
      {"displayName":"Alice","role":"admin","accountBalance":1000000}. Which
      defense best prevents privilege escalation here?
    options:
      - "Denylist: strip 'role' and 'accountBalance' before saving"
      - "Return 200 OK but log the suspicious fields for later review"
      - "Trust the client since the request is authenticated and its OAuth scope was already verified at the gateway"
      - "Allow-list the client-writable fields (e.g. only displayName) and bind to an input model that has no server-owned fields"
    answer: 3
    explanation: |
      Allow-listing writable fields (and using an input model lacking server-owned
      fields) is robust. Denylists fail as soon as you forget a sensitive field or
      a refactor adds one.
    ref: "concepts.md#mass-assignment-and-over-posting-control"

  - id: request-validation-and-data-integrity-024
    difficulty: intermediate
    tags: [mass-assignment, denylist, allow-list]
    question: |
      Why is an allow-list preferred over a denylist for controlling which fields
      a client may write?
    options:
      - "Denylists are slower to evaluate because each field must be compared against the full blocked-field set"
      - "A denylist eventually forgets a sensitive field or a refactor adds a new one, silently reopening the hole; an allow-list fails closed"
      - "Allow-lists are mandated by RFC 9110 §8.3 for any request that binds a body to an object"
      - "Denylists cannot be expressed in JSON Schema, so only allow-lists can be enforced by a validator"
    answer: 1
    explanation: |
      Denylists fail open: you must remember every dangerous field forever.
      Allow-lists fail closed — anything not explicitly permitted is rejected — so
      new fields are safe by default.
    ref: "concepts.md#mass-assignment-and-over-posting-control"

  - id: request-validation-and-data-integrity-025
    difficulty: advanced
    tags: [mass-assignment, dto, input-model]
    question: |
      What design most structurally prevents server-owned fields (id, createdAt,
      ownerId, role) from being set by a client?
    options:
      - "Binding the request directly to the full database entity and hoping clients behave"
      - "Encrypting the server-owned fields so the client cannot read or tamper with their values in transit"
      - "Binding the request to a dedicated input model/DTO that only contains client-settable fields"
      - "Marking those fields as 'optional' in the schema so the validator quietly ignores them when a client sends them"
    answer: 2
    explanation: |
      If the input model/DTO simply doesn't contain server-owned fields, there is
      nothing for a malicious body to bind to — the fields can't be set regardless
      of what the client sends.
    ref: "concepts.md#mass-assignment-and-over-posting-control"

  - id: request-validation-and-data-integrity-026
    difficulty: advanced
    tags: [mass-assignment, field-authorization, owasp]
    question: |
      Why did OWASP rename the 2019 "Mass Assignment" category to API3:2023
      "Broken Object Property Level Authorization"?
    options:
      - "Because mass assignment is no longer a real risk now that modern frameworks disable auto-binding by default"
      - "Because the risk includes not only setting extra fields but also which properties a given caller is authorized to read/write, i.e. per-property authorization"
      - "Because it merged with the rate-limiting category to form a single unified resource-abuse entry"
      - "Because the category now only covers response fields, having dropped request-body binding entirely from its scope"
    answer: 1
    explanation: |
      API3:2023 merges excessive data exposure and mass assignment and highlights
      that even among writable fields, which properties a caller may set/read can
      depend on their role — that's per-property authorization.
    ref: "concepts.md#mass-assignment-and-over-posting-control"

  - id: request-validation-and-data-integrity-027
    difficulty: intermediate
    tags: [where-to-validate, edge-domain]
    question: |
      What type of validation is best performed at the edge/gateway?
    options:
      - "Stateful business rules like inventory availability, checked against the live warehouse database on each request"
      - "Deciding a coupon's expiry by querying the database and cross-referencing the customer's redemption history"
      - "Cross-service transaction coordination, including two-phase commit and saga compensation across downstream services"
      - "Cheap syntactic checks: request size limits, content-type, JSON well-formedness, schema conformance"
    answer: 3
    explanation: |
      The edge is ideal for cheap, universal, stateless checks — size/type limits,
      well-formedness, schema conformance — that shed bad load early. Stateful
      semantic rules belong in the domain layer.
    ref: "concepts.md#where-to-validate-edge-vs-domain"

  - id: request-validation-and-data-integrity-028
    difficulty: intermediate
    tags: [where-to-validate, defense-in-depth]
    question: |
      "We validate everything at the API gateway, so internal services can trust
      their inputs." What is wrong with this?
    options:
      - "Nothing — gateway validation is sufficient because every request path is guaranteed to traverse the gateway first"
      - "Internal callers, retries, and other entry points can bypass the gateway, so each service must still protect its own invariants (zero-trust)"
      - "Gateways cannot validate JSON at all; they can only inspect headers and route traffic by path prefix"
      - "It is fine as long as the network is encrypted with mTLS between the gateway and each internal service"
    answer: 1
    explanation: |
      A 'trusted network' isn't a validation strategy. Requests can reach a service
      through internal calls, retries, or other entry points, so the domain must
      enforce its own invariants regardless of edge validation.
    ref: "concepts.md#where-to-validate-edge-vs-domain"

  - id: request-validation-and-data-integrity-029
    difficulty: advanced
    tags: [where-to-validate, trade-offs, duplication]
    question: |
      What is the best way to think about the apparent "duplication" of validating
      at both edge and domain?
    options:
      - "It is wasteful duplication; remove one of the two layers to keep the validation logic in a single place"
      - "The domain layer should only run its validation when the edge layer is unavailable or has been bypassed"
      - "Edge validation is an optimization/UX feature (fast, clear rejection); domain validation is the correctness guarantee (invariants) — they serve different masters"
      - "Both layers must enforce the exact same rules or the system is considered broken and inconsistent"
    answer: 2
    explanation: |
      They aren't redundant: the edge gives fast, clear rejection (UX and load
      shedding), while the domain guarantees correctness by enforcing invariants no
      matter how the request arrived.
    ref: "concepts.md#where-to-validate-edge-vs-domain"

  - id: request-validation-and-data-integrity-030
    difficulty: intermediate
    tags: [where-to-validate, gateway-offload, trade-offs]
    question: |
      What is a genuine downside of offloading schema validation entirely to the
      API gateway?
    options:
      - "Gateways cannot reject oversized requests, so a body-size limit has to live in the backend regardless"
      - "It violates RFC 9457, which requires all validation to be performed by the origin server itself"
      - "It makes the backend respond faster than is safe, hiding latency that clients rely on for backpressure"
      - "It couples deployments (schema changes must sync with the gateway) and the gateway usually lacks the state for semantic checks"
    answer: 3
    explanation: |
      Gateway offloading centralizes and protects backends, but it couples deploys
      (schema must stay in sync) and the gateway generally can't do stateful
      semantic validation.
    ref: "concepts.md#where-to-validate-edge-vs-domain"

  - id: request-validation-and-data-integrity-031
    difficulty: beginner
    tags: [status-codes, 400, malformed]
    question: |
      A client sends a body that is not valid JSON (a syntax/framing error). Which
      status code is unambiguously appropriate?
    options:
      - "200 OK"
      - "400 Bad Request"
      - "422 Unprocessable Content"
      - "500 Internal Server Error"
    answer: 1
    explanation: |
      RFC 9110 defines 400 for a client error such as malformed request syntax.
      An unparseable body is the unambiguous 400 case. 500 would wrongly blame the
      server for a client mistake.
    ref: "concepts.md#400-vs-422-for-validation-errors"

  - id: request-validation-and-data-integrity-032
    difficulty: intermediate
    tags: [status-codes, 422, rfc9110]
    question: |
      What does 422 Unprocessable Content (RFC 9110) specifically indicate?
    options:
      - "The content type and syntax are correct, but the server was unable to process the contained instructions (semantic problem)"
      - "The server is temporarily overloaded and cannot process any request until load subsides"
      - "The request body was too large and exceeded the server's configured maximum payload size"
      - "The client is not authenticated and must present valid credentials before retrying"
    answer: 0
    explanation: |
      422 means the body parsed correctly (right content type, valid syntax) but
      its instructions can't be processed — a semantic problem. It was moved into
      core HTTP semantics by RFC 9110 (originally from WebDAV / RFC 4918).
    ref: "concepts.md#400-vs-422-for-validation-errors"

  - id: request-validation-and-data-integrity-033
    difficulty: advanced
    tags: [status-codes, 400-vs-422, interview]
    question: |
      In an interview, which is the most defensible answer to "400 or 422 for a
      schema validation failure?"
    options:
      - "422 is the only spec-correct code; using 400 is a bug"
      - "400 is the only spec-correct code; 422 is deprecated"
      - "No spec mandates one for schema-level failures; use 400 for un-parseable requests, pick 400 OR 422 for 'parsed-but-invalid' and apply it consistently, and put the real value in the error body"
      - "Return whichever the framework defaults to and never document it"
    answer: 2
    explanation: |
      Both 400 and 422 are defensible for 'parsed but invalid content.' The strong
      answer: 400 for unparseable requests, choose one code for invalid content and
      apply it API-wide, and invest in a detailed field-level error body.
    ref: "concepts.md#400-vs-422-for-validation-errors"

  - id: request-validation-and-data-integrity-034
    difficulty: intermediate
    tags: [status-codes, anti-pattern, 200]
    question: |
      Why is returning "200 OK" with an error object in the body for a failed
      validation an anti-pattern?
    options:
      - "It breaks HTTP semantics and misleads caching layers, generic clients, and monitoring tools that key off the status code"
      - "It is slower to serialize because a 200 response forces the framework to build a full success envelope"
      - "200 is reserved exclusively for GET responses and must never be returned by a POST or PATCH endpoint"
      - "It violates the JSON specification, which forbids error objects from appearing in a successful response body"
    answer: 0
    explanation: |
      Status codes are the machine-readable contract. Returning 200 for a failure
      breaks caches, generic client libraries, and monitoring that classify
      outcomes by status code.
    ref: "concepts.md#400-vs-422-for-validation-errors"

  - id: request-validation-and-data-integrity-035
    difficulty: advanced
    tags: [status-codes, 500, slo]
    question: |
      Why should a client input error never be returned as 500 Internal Server
      Error?
    options:
      - "500 responses cannot include a response body, so the client can never learn what went wrong"
      - "500 is not a valid HTTP status code and is rejected outright by conforming client libraries"
      - "It misattributes fault to the server and pollutes error-rate SLOs and alerting with what are actually client mistakes"
      - "Clients automatically retry every 500 forever with no backoff, eventually crashing the calling process"
    answer: 2
    explanation: |
      A client-supplied bad input is a 4xx condition. Emitting 5xx blames the
      server, inflates server-error metrics/SLOs, and triggers false alerts for
      what is a client-side problem.
    ref: "concepts.md#400-vs-422-for-validation-errors"

  - id: request-validation-and-data-integrity-036
    difficulty: intermediate
    tags: [status-codes, content-type, 415]
    question: |
      A client POSTs a body but sends the wrong or missing Content-Type for what
      the endpoint accepts. The most appropriate status is:
    options:
      - "415 Unsupported Media Type"
      - "406 Not Acceptable"
      - "422 Unprocessable Content"
      - "400 Bad Request only"
    answer: 0
    explanation: |
      415 Unsupported Media Type is the code for a request payload in a format the
      endpoint does not support. (406 is about the response representation the
      client will Accept, which is different.)
    ref: "concepts.md#400-vs-422-for-validation-errors"

  - id: request-validation-and-data-integrity-037
    difficulty: beginner
    tags: [field-errors, problem-details, rfc9457]
    question: |
      Which standard defines a machine-readable JSON error format for HTTP APIs,
      and what media type does it use?
    options:
      - "RFC 9457 (obsoletes 7807), application/problem+json"
      - "RFC 7807 (not yet superseded), application/json"
      - "RFC 9110 core HTTP semantics, text/plain"
      - "OpenAPI 3.1 error object, application/error+json"
    answer: 0
    explanation: |
      RFC 9457 Problem Details for HTTP APIs (which obsoletes RFC 7807) defines the
      format with media type application/problem+json.
    ref: "concepts.md#returning-field-level-errors"

  - id: request-validation-and-data-integrity-038
    difficulty: intermediate
    tags: [field-errors, problem-details, members]
    question: |
      Which set are the standard top-level members of an RFC 9457 problem detail
      object?
    options:
      - "code, message, data, timestamp"
      - "name, reason, httpCode, trace"
      - "error, error_description, uri"
      - "type, title, status, detail, instance"
    answer: 3
    explanation: |
      RFC 9457 defines type, title, status, detail, and instance. There is no
      built-in field-error member; multiple errors are conveyed via an extension
      (e.g. an 'errors' array).
    ref: "concepts.md#returning-field-level-errors"

  - id: request-validation-and-data-integrity-039
    difficulty: intermediate
    tags: [field-errors, multiple-errors, ux]
    question: |
      For a form submission that has three invalid fields, what is the best
      validation-response behavior?
    options:
      - "Return all field errors at once, each located with a JSON Pointer or path, so the client can fix everything in one pass"
      - "Return only the first error and stop, keeping the response small so the client fixes and resubmits one field at a time"
      - "Return a single generic 'Bad Request' with no field detail, letting the client guess which of the three fields was rejected"
      - "Return the three field errors spread across three separate sequential 400 responses, one per invalid field"
    answer: 0
    explanation: |
      Reporting all errors together (each with a locator like a JSON Pointer) lets
      the client fix everything in one round trip, avoiding a frustrating
      fix-resubmit loop.
    ref: "concepts.md#returning-field-level-errors"

  - id: request-validation-and-data-integrity-040
    difficulty: advanced
    tags: [field-errors, json-pointer, machine-codes]
    question: |
      To make field-level errors robust for clients, you should locate each error
      and give it a stable identifier. Which combination is best?
    options:
      - "A JSON Pointer (RFC 6901) to the field plus a stable machine-readable code, alongside the human-readable detail"
      - "Only a free-form English sentence describing the error, which the client is expected to parse and match against"
      - "The underlying database column name plus the raw SQL error text, so clients can map the failure back to storage"
      - "A random UUID generated per error and nothing else, leaving the client to correlate it against server logs"
    answer: 0
    explanation: |
      A JSON Pointer (e.g. #/items/0/quantity) locates the field, and a stable code
      (e.g. 'too_short') lets clients branch on it programmatically, while the
      human detail explains it. Clients should never branch on localized English.
    ref: "concepts.md#returning-field-level-errors"

  - id: request-validation-and-data-integrity-041
    difficulty: advanced
    tags: [field-errors, security, information-leak]
    question: |
      Which detail is UNSAFE to include in a validation/error response body?
    options:
      - "Which field failed and why (e.g., 'email must be a valid address')"
      - "A stable machine-readable error code that clients can branch on programmatically across releases"
      - "A stack trace, SQL fragment, or exactly which of username/password was wrong on login"
      - "A JSON Pointer (RFC 6901) locating the offending field within the request body"
    answer: 2
    explanation: |
      Error bodies are attacker-readable. Stack traces, SQL, internal field names,
      or 'wrong password vs unknown user' leak internals and aid attacks (OWASP
      API8). Be specific about client mistakes, opaque about server internals.
    ref: "concepts.md#returning-field-level-errors"

  - id: request-validation-and-data-integrity-042
    difficulty: beginner
    tags: [defensive-parsing, content-type]
    question: |
      A defensive parser should do what before attempting to parse a body as JSON?
    options:
      - "Validate the Content-Type and reject unexpected types (e.g. with 415) before parsing arbitrary bytes"
      - "Assume the body is JSON and parse optimistically, letting the deserializer surface any framing error afterward"
      - "Convert the body to uppercase first so that key and value comparisons become case-insensitive during parsing"
      - "Trust the client's declared schema version header and select the matching parser without inspecting the bytes"
    answer: 0
    explanation: |
      Defensive parsing makes no optimistic assumptions. Checking Content-Type
      first (and rejecting unexpected types) avoids parsing arbitrary bytes as JSON.
    ref: "concepts.md#defensive-parsing"

  - id: request-validation-and-data-integrity-043
    difficulty: intermediate
    tags: [defensive-parsing, duplicate-keys]
    question: |
      Why do strict/defensive JSON parsers reject a body like {"a":1,"a":2}?
    options:
      - "It exceeds the maximum body size once the repeated key is counted twice toward the byte limit"
      - "The keys within a JSON object must be sorted alphabetically, and 'a' appearing twice breaks that ordering rule"
      - "JSON forbids bare numbers as object values entirely, so the integers 1 and 2 make the body invalid"
      - "Duplicate keys are ambiguous and a known confusion/smuggling vector when components disagree on which value wins"
    answer: 3
    explanation: |
      Duplicate keys, though technically parseable, are ambiguous. If two
      components pick different winners, that mismatch becomes a smuggling/confusion
      vector, so strict parsers reject them.
    ref: "concepts.md#defensive-parsing"

  - id: request-validation-and-data-integrity-044
    difficulty: intermediate
    tags: [defensive-parsing, type-coercion]
    question: |
      From a defensive-parsing standpoint, how should the value "true" (a JSON
      string) be treated where a boolean is expected?
    options:
      - "Coerce it to boolean true automatically, since the string \"true\" clearly conveys the client's intended boolean"
      - "Store it as-is as a string and let the database column's type affinity decide how to interpret it later"
      - "Reject it — a string is not a boolean; strict type checks beat lenient coercion"
      - "Treat it as JSON null because a mistyped boolean carries no usable value the server can act on"
    answer: 2
    explanation: |
      "true" (string) is not true (boolean), and "1" is not 1. Lenient coercion is
      a source of subtle bugs and security holes, so prefer strict schema type
      checks.
    ref: "concepts.md#defensive-parsing"

  - id: request-validation-and-data-integrity-045
    difficulty: advanced
    tags: [defensive-parsing, money, floats]
    question: |
      Why should a monetary amount not be parsed from the wire as an IEEE-754
      float?
    options:
      - "Floating-point representation causes rounding errors; money should be an integer of minor units or a decimal string"
      - "Floats are significantly slower to parse than integers, adding latency on high-volume payment endpoints"
      - "JSON does not allow decimal points in number literals, so a fractional currency amount cannot be encoded at all"
      - "Floats cannot represent negative values, so refunds and chargebacks could not be stored as amounts"
    answer: 0
    explanation: |
      IEEE-754 floats can't represent many decimal values exactly, causing rounding
      errors in money math. Represent money as integer minor units (e.g. cents) or
      a decimal string, not a parseFloat result.
    ref: "concepts.md#defensive-parsing"

  - id: request-validation-and-data-integrity-046
    difficulty: advanced
    tags: [defensive-parsing, xxe, xml]
    question: |
      When accepting XML, which parser configuration is critical to prevent XXE
      and entity-expansion (billion laughs) attacks?
    options:
      - "Enable pretty-printing of the parser output so nested entities become visible and easy to audit"
      - "Convert the XML to JSON before parsing it, on the assumption that JSON parsers are immune to entity attacks"
      - "Disable external entity resolution and bound entity expansion / nesting depth"
      - "Accept only XML documents larger than 10 MB, since tiny payloads are the ones that hide malicious entities"
    answer: 2
    explanation: |
      XXE and entity-expansion attacks abuse external entities and recursive
      expansion. Disabling external entity resolution and capping expansion/nesting
      depth is the defense.
    ref: "concepts.md#defensive-parsing"

  - id: request-validation-and-data-integrity-047
    difficulty: beginner
    tags: [limits, body-size, 413]
    question: |
      A request body exceeds your API's maximum allowed size. Which status code
      should you return?
    options:
      - "413 Content Too Large"
      - "429 Too Many Requests, since a large body counts as exceeding the client's allotted request budget"
      - "400 Bad Request, treating an oversized but well-formed body as a generic client syntax error"
      - "507 Insufficient Storage, because the server lacks room to persist a payload of that size"
    answer: 0
    explanation: |
      413 Content Too Large (RFC 9110, formerly 'Payload Too Large') is the code
      for a request body exceeding the server's size limit.
    ref: "concepts.md#content-length-and-content-type-limits"

  - id: request-validation-and-data-integrity-048
    difficulty: intermediate
    tags: [limits, content-length, security]
    question: |
      Why is it insufficient to rely solely on the Content-Length header to enforce
      a body-size limit?
    options:
      - "Content-Length is encrypted inside the TLS record and therefore unreadable by the application layer"
      - "The Content-Length header was deprecated in HTTP/2 and is stripped by every conforming client"
      - "Content-Length only applies to GET requests and is never populated on POST or PUT bodies"
      - "Content-Length can be absent (chunked transfer) or lie, so you must also enforce a hard read cap and stop reading once exceeded"
    answer: 3
    explanation: |
      Content-Length is a claim, not a guarantee — it can be omitted (chunked
      encoding) or falsified. Enforce a hard byte cap while reading and stop once
      it's exceeded.
    ref: "concepts.md#content-length-and-content-type-limits"

  - id: request-validation-and-data-integrity-049
    difficulty: intermediate
    tags: [limits, owasp, resource-consumption]
    question: |
      Enforcing body-size, array, string-length, and nesting-depth limits mainly
      defends against which OWASP API Security Top 10 (2023) risk?
    options:
      - "API1: Broken Object Level Authorization"
      - "API7: Server Side Request Forgery"
      - "API4: Unrestricted Resource Consumption"
      - "API9: Improper Inventory Management"
    answer: 2
    explanation: |
      Without limits, a single request can exhaust memory/CPU/disk — that is
      API4:2023 Unrestricted Resource Consumption. Size and structural caps are the
      gate.
    ref: "concepts.md#content-length-and-content-type-limits"

  - id: request-validation-and-data-integrity-050
    difficulty: advanced
    tags: [limits, nested-limits, attack]
    question: |
      Your API caps the total body at 1 MB. Why might that alone be insufficient?
    options:
      - "1 MB is always too small for a realistic JSON payload, so the cap rejects legitimate requests routinely"
      - "The cap should instead be measured purely in the number of fields, since byte size has no bearing on processing cost"
      - "Body-size limits are silently ignored by HTTP/2, which frames and multiplexes the payload beyond the server's control"
      - "A 1 MB body can still contain a huge array or deeply nested structure that is expensive to process, so you also need maxItems, maxLength, and depth caps"
    answer: 3
    explanation: |
      Total size is necessary but not sufficient: a 1 MB body with a
      10-million-element array or extreme nesting is still an attack. Bound per
      element (maxItems, maxLength) and nesting depth too.
    ref: "concepts.md#content-length-and-content-type-limits"

  - id: request-validation-and-data-integrity-051
    difficulty: advanced
    tags: [limits, uri-length, 414]
    question: |
      An attacker sends requests with extremely long URIs full of query parameters.
      Which status code specifically addresses an over-long request target, and why
      cap it?
    options:
      - "414 URI Too Long; to prevent parameter pollution and header-based DoS"
      - "413 Content Too Large; because the body is large"
      - "431 Request Header Fields Too Large; because URIs are headers"
      - "400 Bad Request; there is no dedicated code"
    answer: 0
    explanation: |
      414 URI Too Long (RFC 9110 §15.5.15) is the dedicated code for an oversized
      request target. Capping URI length and parameter count mitigates parameter
      pollution and header/URI-based resource exhaustion.
    ref: "concepts.md#content-length-and-content-type-limits"

  - id: request-validation-and-data-integrity-052
    difficulty: advanced
    tags: [limits, uploads, magic-bytes]
    question: |
      For a file-upload endpoint, which validation is strongest against a
      mislabeled or malicious file?
    options:
      - "Stream to bounded storage with a size cap and validate the actual content (e.g. magic bytes), not just the claimed type or extension"
      - "Trust the client-provided Content-Type and file extension as the authoritative declaration of the file's format"
      - "Accept any file immediately and defer an asynchronous malware scan until a batch job runs a week later"
      - "Reject all files larger than 1 KB regardless of type, on the assumption that small files cannot be malicious"
    answer: 0
    explanation: |
      Declared Content-Type and extension are attacker-controlled. Stream with a
      size cap to bounded storage and verify the real content (magic bytes/format
      sniffing) to catch mislabeled or malicious uploads.
    ref: "concepts.md#content-length-and-content-type-limits"

  - id: request-validation-and-data-integrity-053
    difficulty: intermediate
    tags: [status-codes, 411, length-required]
    question: |
      What does 411 Length Required allow a server to do?
    options:
      - "Reject a request whose body exceeds the server's configured maximum size limit before reading it"
      - "Signal that the length of the supplied authentication credential is invalid and must be resubmitted"
      - "Refuse a request that omits Content-Length when the server needs the size in advance"
      - "Require that a request carry at least a minimum number of query parameters before it is processed"
    answer: 2
    explanation: |
      411 Length Required (RFC 9110 §15.5.12) lets a server refuse a request that
      lacks a Content-Length when it needs to know the size up front, though many
      servers instead accept chunked encoding and enforce a streaming byte cap.
    ref: "concepts.md#content-length-and-content-type-limits"

  - id: request-validation-and-data-integrity-054
    difficulty: beginner
    tags: [field-errors, content-type, problem-json]
    question: |
      When returning an RFC 9457 problem document, which Content-Type should the
      response carry so generic clients recognize it?
    options:
      - "application/problem+json"
      - "text/plain"
      - "application/json only"
      - "application/error"
    answer: 0
    explanation: |
      RFC 9457 problem documents use application/problem+json so generic clients
      and tooling recognize the payload as a structured problem detail.
    ref: "concepts.md#returning-field-level-errors"

  - id: request-validation-and-data-integrity-055
    difficulty: intermediate
    tags: [why-validate, contract, openapi]
    question: |
      From the API-contract perspective, publishing your validation rules via
      OpenAPI/JSON Schema primarily lets clients do what?
    options:
      - "Bypass server-side validation entirely because the published schema is treated as the authoritative gate"
      - "Change the server's required fields at will by editing their local copy of the published schema"
      - "Validate locally against the documented preconditions and rely on a consistent error shape"
      - "Skip authentication whenever the request already conforms to the documented schema"
    answer: 2
    explanation: |
      Validation defines the preconditions of each operation. Publishing them lets
      clients validate locally and depend on a consistent error contract, while the
      server still enforces them.
    ref: "concepts.md#why-validate-requests"

  - id: request-validation-and-data-integrity-056
    difficulty: expert
    tags: [json-schema, composition, additional-properties, unevaluated-properties]
    question: |
      Your "update profile" schema used `additionalProperties: false` and worked.
      After you refactored it to `allOf: [ {$ref: Base}, {properties:{displayName},
      additionalProperties:false} ]`, valid requests containing Base's fields (id,
      createdAt) started getting rejected. Why, and what fixes it?
    options:
      - "`allOf` is not supported in JSON Schema Draft 2020-12, so the composed schema silently fails validation; switch the entire definition over to `anyOf`"
      - "`additionalProperties` only sees properties in its own subschema, so it can't see Base's fields; replace it with `unevaluatedProperties: false` on the outer schema"
      - "`$ref` disables all property-level validation in the referring schema, so inline the Base schema's properties directly instead of referencing it"
      - "The Base schema must also set `additionalProperties: true` so that it explicitly overrides the stricter inner subschema during composition"
    answer: 1
    explanation: |
      `additionalProperties` only considers `properties`/`patternProperties` in the
      same schema object; under `allOf`/`$ref` it can't see sibling-contributed
      fields, so it rejects them. `unevaluatedProperties: false` on the outermost
      schema is evaluated after all subschemas and treats any property matched by
      any branch as evaluated — the correct closed-composition guard.
    ref: "concepts.md#closed-schemas-under-composition"

  - id: request-validation-and-data-integrity-057
    difficulty: advanced
    tags: [json-schema, unevaluated-properties, mass-assignment]
    question: |
      A developer puts `additionalProperties: false` on the *outer* schema of an
      `allOf` composition (where no `properties` are declared directly). What is the
      most likely effect?
    options:
      - "It correctly closes the composed object so only the allOf-defined fields are permitted through"
      - "It rejects every request because the outer schema declares no properties, so all fields are 'additional'"
      - "It is silently ignored because an outer schema may not carry validation keywords alongside an allOf"
      - "It only validates the very first subschema listed in the allOf array and skips the rest entirely"
    answer: 1
    explanation: |
      At the outer level there are no local `properties`, so `additionalProperties`
      sees every field as unknown and rejects all of them. `additionalProperties`
      does not look into `allOf` branches. `unevaluatedProperties: false` is the
      keyword that does, which is why it is the right tool for composed schemas.
    ref: "concepts.md#closed-schemas-under-composition"

  - id: request-validation-and-data-integrity-058
    difficulty: expert
    tags: [json-schema, arrays, prefix-items, versioning]
    question: |
      You port a Draft-07 tuple schema `{ "items": [ {"type":"string"},
      {"type":"number"} ], "additionalItems": false }` verbatim into an OpenAPI 3.1
      (JSON Schema 2020-12) document. What happens?
    options:
      - "It works identically, since `items`, `additionalItems`, and tuple semantics are unchanged between Draft-07 and 2020-12"
      - "It mis-validates: in 2020-12 tuples use `prefixItems`, `items` is now a single schema constraining the rest, and `additionalItems` was removed"
      - "It rejects all arrays outright, because JSON Schema 2020-12 dropped support for positional tuple validation entirely"
      - "It silently allows any array of any length containing any element types, ignoring the positional constraints completely"
    answer: 1
    explanation: |
      2020-12 renamed positional/tuple validation to `prefixItems`; `items` given a
      single schema now constrains elements beyond the prefix, and `additionalItems`
      is gone. An `items`-as-array from Draft-07 no longer means "tuple," so the
      ported schema mis-validates. Use `prefixItems` + `items:false` (or
      `unevaluatedItems:false`) to close a tuple.
    ref: "concepts.md#array-and-tuple-validation"

  - id: request-validation-and-data-integrity-059
    difficulty: advanced
    tags: [json-schema, arrays, tuple-close]
    question: |
      In JSON Schema 2020-12, how do you say "this array must be EXACTLY a
      [string, number] tuple — no extra trailing elements"?
    options:
      - "`prefixItems: [string, number], items: false`"
      - "`items: [string, number], additionalItems: false`"
      - "`prefixItems: [string, number], additionalItems: false`"
      - "`type: tuple, minItems: 2, maxItems: 2`"
    answer: 0
    explanation: |
      `prefixItems` fixes the positional schemas; `items: false` forbids any element
      beyond the prefix, closing the tuple to exactly two entries. `additionalItems`
      was removed in 2020-12, and `type: tuple` is not a JSON Schema type.
    ref: "concepts.md#array-and-tuple-validation"

  - id: request-validation-and-data-integrity-060
    difficulty: expert
    tags: [content-digest, rfc9530, integrity]
    question: |
      A client sends `Content-Digest: sha-256=:...:` with a POST body. What should
      the server do, and does honoring it make the request tamper-proof?
    options:
      - "Recompute the digest over the received body and reject a mismatch (e.g. 400); no — an attacker who rewrites the body can rewrite the header too, so a digest is not a signature"
      - "Trust the digest as cryptographic proof of authenticity and skip re-validating the body, since a matching hash guarantees the sender's identity"
      - "Ignore the header entirely, because Content-Digest is only ever meaningful on responses and carries no defined meaning on a request"
      - "Store the received digest verbatim as the resource's ETag so that later conditional requests can reuse it as a validator"
    answer: 0
    explanation: |
      Per RFC 9530 the server recomputes and rejects on mismatch, detecting
      accidental corruption or intermediary alteration. But a digest is not a
      signature: an active attacker rewrites body and digest together. For
      authenticity, pair it with HTTP Message Signatures (RFC 9421) or TLS+auth.
    ref: "concepts.md#content-integrity-in-transit"

  - id: request-validation-and-data-integrity-061
    difficulty: advanced
    tags: [content-digest, rfc9530, structured-fields]
    question: |
      Which statement about RFC 9530 digest fields is correct?
    options:
      - "RFC 9530 mandates MD5 as the only interoperable algorithm and forbids negotiating any stronger hash between client and server"
      - "`Content-Digest` and `Repr-Digest` obsolete RFC 3230's `Digest`/`Want-Digest`; values are RFC 8941 structured fields, and sha-256/sha-512 are active while md5/sha-1 are deprecated for adversarial use"
      - "The digest value is transmitted as a plain lowercase hex string with no base64 wrapping or algorithm-name prefix at all"
      - "`Repr-Digest` covers the raw transferred bytes on the wire while `Content-Digest` covers the abstract selected representation"
    answer: 1
    explanation: |
      RFC 9530 obsoletes RFC 3230, uses RFC 8941 structured-field syntax
      (`alg=:base64:`), marks sha-256/sha-512 active and md5/sha-1 deprecated. It is
      `Content-Digest` that covers the encoded/transferred body and `Repr-Digest`
      the selected representation — the reverse of option D.
    ref: "concepts.md#content-integrity-in-transit"

  - id: request-validation-and-data-integrity-062
    difficulty: expert
    tags: [idempotency, retries, fingerprint]
    question: |
      A client retries `POST /payments` after a timeout using the same
      `Idempotency-Key` but a slightly different body. What is the correct behavior?
    options:
      - "Process it as a brand-new payment since the body differs, assigning it a fresh transaction id despite the reused key"
      - "Return the stored original response and ignore the new body, treating any reuse of the key as an ordinary retry"
      - "Reject it (e.g. 422/409) as 'idempotency key reused with a different payload' — a request fingerprint mismatch"
      - "Return 200 OK after merging the two request bodies field-by-field into a single reconciled payment record"
    answer: 2
    explanation: |
      The key must be stored with a fingerprint of the original request. A replay
      with the same key but a different fingerprint is a client bug or attack, so
      reject with 422/409. Returning the stored response is correct only when the
      fingerprint matches; processing it as new would defeat idempotency.
    ref: "concepts.md#idempotency-keys-and-safe-retries"

  - id: request-validation-and-data-integrity-063
    difficulty: advanced
    tags: [idempotency, concurrency, status-codes]
    question: |
      A second request arrives with the same `Idempotency-Key` while the first is
      still being processed (in flight). What is the most appropriate response?
    options:
      - "412 Precondition Failed, since the in-flight first request acts as an unmet precondition on the second"
      - "409 Conflict (indicating the original request is still in progress)"
      - "204 No Content, acknowledging the duplicate key while returning an empty success body to the caller"
      - "301 Moved Permanently, redirecting the second caller to poll the location of the in-flight resource"
    answer: 1
    explanation: |
      With the first request unfinished, executing the second concurrently risks a
      double effect. Returning 409 Conflict (some APIs use 425 Too Early) tells the
      client the original is in flight and to retry later. 412 is for conditional
      (If-Match) preconditions, not idempotency-key contention.
    ref: "concepts.md#idempotency-keys-and-safe-retries"

  - id: request-validation-and-data-integrity-064
    difficulty: intermediate
    tags: [idempotency, retries, why]
    question: |
      Why does the idempotency-key pattern also require storing a fingerprint (hash)
      of the request, not just the key itself?
    options:
      - "To compress the request body so that storing the idempotency record consumes less space on disk"
      - "So a replay of the same key with a DIFFERENT body can be detected and rejected instead of silently mishandled"
      - "Because client-supplied idempotency keys are not statistically unique enough to avoid collisions on their own"
      - "To encrypt the request body at rest, since the fingerprint hash doubles as the encryption key for storage"
    answer: 1
    explanation: |
      The fingerprint lets the server distinguish a genuine retry (same key, same
      body → return stored response) from key misuse (same key, different body →
      reject). Without it, the guarantee that a retry is truly the same operation
      cannot be enforced.
    ref: "concepts.md#idempotency-keys-and-safe-retries"

  - id: request-validation-and-data-integrity-065
    difficulty: expert
    tags: [optimistic-concurrency, etag, lost-update]
    question: |
      Two clients GET the same resource, edit it, and PUT it back. The second write
      silently overwrites the first (lost update). Which contract-level mechanism
      prevents this, and what status signals the stale write?
    options:
      - "Rate limiting the write endpoint; the losing client is turned away with 429 Too Many Requests"
      - "An ETag validator with `If-Match` on writes; a stale write returns 412 Precondition Failed"
      - "A longer per-request timeout so the first write commits first; the stale one gets 408 Request Timeout"
      - "Strict Content-Length enforcement on the body; the conflicting write is refused with 413 Content Too Large"
    answer: 1
    explanation: |
      Optimistic concurrency: the server issues an ETag, the client sends
      `If-Match: "<etag>"` on the write, and if the resource changed meanwhile the
      server returns 412 Precondition Failed. The client re-fetches and retries. This
      is the standard lost-update guard (RFC 9110 §13).
    ref: "concepts.md#optimistic-concurrency-and-conditional-requests"

  - id: request-validation-and-data-integrity-066
    difficulty: expert
    tags: [optimistic-concurrency, 428, precondition-required]
    question: |
      You want to guarantee no client can perform a blind unconditional overwrite —
      every mutating request MUST carry a precondition. Which status code lets the
      server enforce this?
    options:
      - "417 Expectation Failed"
      - "428 Precondition Required"
      - "412 Precondition Failed"
      - "409 Conflict"
    answer: 1
    explanation: |
      428 Precondition Required (RFC 6585) lets the server reject any request that
      lacks a precondition (e.g. If-Match), forcing clients to send one and closing
      the lost-update race. 412 is returned when a supplied precondition fails, not
      when it is absent.
    ref: "concepts.md#optimistic-concurrency-and-conditional-requests"

  - id: request-validation-and-data-integrity-067
    difficulty: expert
    tags: [optimistic-concurrency, etag, weak-strong]
    question: |
      For an `If-Match` lost-update check, why must the ETag be a STRONG validator
      rather than a weak one (`W/"..."`)?
    options:
      - "Weak validators carry a longer `W/` prefix and therefore waste header bandwidth on every conditional write"
      - "Weak ETags denote only semantic (not byte-for-byte) equivalence and MUST NOT be used with If-Match; only strong validators reliably detect a concurrent change"
      - "Weak validators are a response-only construct and cannot be placed inside a request header field at all"
      - "Strong validators are required solely for GET response caching and have no defined role on mutating write requests"
    answer: 1
    explanation: |
      A weak ETag signals that two representations are semantically equivalent but
      may differ byte-for-byte, so it can't reliably distinguish a real concurrent
      modification. RFC 9110 restricts If-Match (and Range) to strong validators for
      exactly this reason.
    ref: "concepts.md#optimistic-concurrency-and-conditional-requests"

  - id: request-validation-and-data-integrity-068
    difficulty: expert
    tags: [patch, json-patch, merge-patch, media-type]
    question: |
      A client needs to remove exactly one element from a resource's array field.
      Which PATCH format can express this, and which cannot?
    options:
      - "JSON Merge Patch can remove one element by setting that index to null; JSON Patch has no operation for array element removal"
      - "JSON Patch (RFC 6902) can via `{op:remove, path:/tags/2}`; JSON Merge Patch (RFC 7396) cannot — it replaces arrays wholesale"
      - "Both formats express single-element removal identically, using an indexed path pointer into the target array"
      - "Neither format can do it; array contents cannot be patched element-by-element by any standardized PATCH media type"
    answer: 1
    explanation: |
      JSON Merge Patch treats arrays as opaque values and replaces them entirely, so
      it can't touch a single element. JSON Patch is an ordered op list where
      `{op:remove, path:/tags/2}` removes one element. This is a core reason to
      choose 6902 over 7396 for list edits.
    ref: "concepts.md#patch-body-validation"

  - id: request-validation-and-data-integrity-069
    difficulty: expert
    tags: [patch, json-patch, test-op, concurrency]
    question: |
      In a JSON Patch (RFC 6902) document, what does an operation
      `{"op":"test","path":"/version","value":42}` accomplish?
    options:
      - "It writes the value 42 into /version, replacing whatever integer that pointer currently holds"
      - "It documents the expected version for human readers but is skipped at runtime and has no effect on application"
      - "It is a precondition: if /version is not currently 42 the whole patch fails atomically and nothing is applied"
      - "It creates the /version member and initializes it to 42 whenever that pointer does not already exist"
    answer: 2
    explanation: |
      `test` asserts the current value at a pointer. If it doesn't match, the entire
      patch fails and, because RFC 6902 patches apply atomically, no operations take
      effect. It is effectively an in-body optimistic-concurrency / integrity guard.
    ref: "concepts.md#patch-body-validation"

  - id: request-validation-and-data-integrity-070
    difficulty: advanced
    tags: [patch, read-only-fields, allow-list]
    question: |
      How do you validate a JSON Patch request so it can never modify read-only
      fields like /id or /role?
    options:
      - "Trust that well-behaved clients simply won't target those paths, since the SDK hides read-only fields from the UI"
      - "Reject any operation whose `path` (or `from`) targets a protected pointer — an allow-list/denylist discipline applied to JSON Pointers"
      - "Permit only the `test` operation and forbid every mutating op, so the patch can assert values but never change anything"
      - "Convert the incoming patch to JSON Merge Patch first, relying on merge semantics to drop any protected fields automatically"
    answer: 1
    explanation: |
      Because JSON Patch addresses locations by JSON Pointer, protecting read-only
      fields means inspecting each op's target pointer and rejecting ops that touch
      protected paths — the same allow-list discipline used against mass assignment,
      applied to pointers rather than object keys.
    ref: "concepts.md#patch-body-validation"

  - id: request-validation-and-data-integrity-071
    difficulty: advanced
    tags: [patch, media-type, 415]
    question: |
      A server supports both `application/json-patch+json` and
      `application/merge-patch+json`. A client PATCHes with `Content-Type:
      application/json`. What is the correct response?
    options:
      - "Inspect the body's shape and guess which of the two patch formats the client most likely intended to send"
      - "415 Unsupported Media Type — the generic type doesn't tell the server which patch semantics to apply"
      - "200 OK, quietly defaulting to Merge Patch semantics because it is the more forgiving of the two formats"
      - "422 Unprocessable Content, since the body may still be a structurally valid patch under one of the formats"
    answer: 1
    explanation: |
      JSON Patch and JSON Merge Patch have incompatible semantics, and the media type
      is what selects them. `application/json` is ambiguous, so a strict server
      returns 415 rather than guessing and silently applying the wrong semantics.
    ref: "concepts.md#patch-body-validation"

  - id: request-validation-and-data-integrity-072
    difficulty: expert
    tags: [canonicalization, unicode, security]
    question: |
      Why is validating a username BEFORE Unicode NFKC normalization dangerous?
    options:
      - "NFKC always expands strings to a greater byte length, so a name that passed a maxLength check will exceed it afterward"
      - "NFKC is lossy/collapsing (e.g. ﬃ→ffi, full-width→ASCII), so a value that passes the pre-normalization check can become a different, possibly colliding or reserved value afterward"
      - "NFKC normalization is only defined for East Asian scripts, so it is meaningless for Latin-alphabet usernames"
      - "Normalization must always be performed on the client, so the server should never re-normalize a username it receives"
    answer: 1
    explanation: |
      NFKC folds ligatures, full-width forms, superscripts, etc. Validating first and
      normalizing later means the stored/compared value differs from what you
      checked, enabling spoofing or collisions (e.g. impersonating a reserved name).
      Canonicalize once, then validate the stored form.
    ref: "concepts.md#canonicalization-as-a-security-control"

  - id: request-validation-and-data-integrity-073
    difficulty: expert
    tags: [canonicalization, double-decode, path-traversal]
    question: |
      An input arrives as `%252e%252e%2f`. A component percent-decodes it, passes it
      on, and a downstream component percent-decodes again. What is the risk, and the
      rule?
    options:
      - "No risk; percent-decoding is idempotent, so a second pass over `%252e%252e%2f` leaves it unchanged and the validator that saw the first form still applies"
      - "It becomes `../` after two decodes, enabling path traversal — the rule is decode exactly once and validate that form, never re-decode already-decoded input"
      - "The second decode throws a malformed-escape error because `%25` is no longer a valid percent-sequence, so the request is rejected before any traversal is possible"
      - "It only affects XML entity resolvers; percent-encoding is a URL-layer concern that JSON and path handlers decode exactly once, so no traversal sequence can form"
    answer: 1
    explanation: |
      `%252e` → `%2e` → `.`; two decodes yield `../`, a traversal sequence a
      single-decode validator would have caught. Inconsistent decoding across layers
      is a parser differential. Decode once, validate, and never re-decode.
    ref: "concepts.md#canonicalization-as-a-security-control"

  - id: request-validation-and-data-integrity-074
    difficulty: expert
    tags: [parser-differential, duplicate-keys, authz-bypass]
    question: |
      A gateway validates JSON against a schema and sees `role` = "user"; the backend
      later reads `role` = "admin" from the SAME body and grants admin. How is this
      possible?
    options:
      - "The gateway rewrote the `role` field in transit while re-serializing the body to canonical JSON, and that mutation elevated the value before the backend read it"
      - "The body had a duplicate key `role` and the two parsers disagreed (first-wins vs last-wins) — a parser differential; the fix is to reject duplicate keys"
      - "The backend served a stale cached copy of an earlier admin request instead of parsing the incoming body, returning the wrong role from its response cache"
      - "JSON Schema cannot assert on string-typed fields at all, so the gateway's schema silently skipped `role` and left the value unvalidated for the backend"
    answer: 1
    explanation: |
      Duplicate keys are permitted by the JSON grammar but resolved inconsistently:
      the gateway parser took first-wins ("user") while the backend took last-wins
      ("admin"), bypassing authorization. Defensive parsers reject duplicate keys to
      eliminate this differential.
    ref: "concepts.md#parser-differentials-and-json-pitfalls"

  - id: request-validation-and-data-integrity-075
    difficulty: expert
    tags: [numbers, ieee-754, precision, integrity]
    question: |
      A 64-bit account ID `9007199254740993` is sent as a JSON number and, after
      round-tripping through a JavaScript-based service, comes back as
      `9007199254740992`. What happened and what is the fix?
    options:
      - "A transmission error corrupted a single bit on the wire; adding a Content-Digest checksum over the body would have caught and rejected the altered value"
      - "The value exceeds IEEE-754's safe integer range (2^53−1) so it lost precision when parsed as a double; transmit large integers/IDs as strings and validate the string"
      - "JSON silently rounds every number to the nearest even integer for storage, so writing the digits in uppercase hexadecimal preserves the exact 64-bit value"
      - "The leading `9` caused the parser to interpret the literal as an octal escape and truncate it; prefixing IDs with `0x` forces correct decimal parsing"
    answer: 1
    explanation: |
      JSON numbers are typically parsed as IEEE-754 doubles, which represent integers
      exactly only up to ±(2^53−1). 9007199254740993 rounds to ...992. The convention
      is to carry large integers and money as strings and validate them as strings to
      preserve precision.
    ref: "concepts.md#parser-differentials-and-json-pitfalls"

  - id: request-validation-and-data-integrity-076
    difficulty: advanced
    tags: [numbers, nan-infinity, json]
    question: |
      Regarding `NaN`, `Infinity`, and `1e400` in a JSON request body, which is true?
    options:
      - "All three are valid JSON number literals per RFC 8259 §6 and a conforming server must accept and store them as ordinary numeric values"
      - "`NaN`/`Infinity` are not valid JSON (though some parsers accept them) and `1e400` overflows to Infinity; all should be explicitly rejected"
      - "They are permitted by the grammar only when they appear as elements inside an array, and are invalid as standalone object property values"
      - "Conforming parsers silently coerce every non-finite literal to the integer 0, so they are harmless and need no explicit validation rule"
    answer: 1
    explanation: |
      RFC 8259 does not permit NaN or Infinity literals, yet many lenient parsers
      accept them, and `1e400` overflows a double to Infinity. Defensive validation
      rejects these rather than letting non-finite values into computations.
    ref: "concepts.md#parser-differentials-and-json-pitfalls"

  - id: request-validation-and-data-integrity-077
    difficulty: expert
    tags: [polymorphic, oneof, discriminator, openapi]
    question: |
      You model a payment that is EITHER a card OR a bank transfer using a schema
      with an OpenAPI `discriminator` on a `type` field. A colleague says the
      `discriminator` alone validates the body. Why is that wrong?
    options:
      - "The `discriminator` object was removed from OpenAPI 3.1 when it adopted JSON Schema 2020-12, so it silently does nothing and the body is fully validated by `type` alone"
      - "The `discriminator` is a documentation/short-circuit hint that selects a branch; it is not itself a validation constraint — you still need `oneOf` (or `anyOf`) to actually validate the chosen variant"
      - "`discriminator` mandates that the discriminating property be named exactly `kind`, and it independently enforces every field of the selected variant once that name is present"
      - "Discriminators are only permitted alongside `allOf`, which merges all branches together, so they fully validate the combined card-and-transfer shape without needing `oneOf`"
    answer: 1
    explanation: |
      The `discriminator` object merely tells tooling which subschema to try based on
      a property value; it does not assert validity on its own. Without a `oneOf`
      (exactly-one) the body isn't actually validated against a variant, and ambiguous
      bodies could slip through.
    ref: "concepts.md#polymorphic-and-discriminated-union-bodies"

  - id: request-validation-and-data-integrity-078
    difficulty: advanced
    tags: [polymorphic, oneof, anyof]
    question: |
      For validating a discriminated union where a body must match EXACTLY one
      variant, why prefer `oneOf` over `anyOf`?
    options:
      - "`anyOf` was deprecated in JSON Schema 2020-12 and validators now emit an error when it is used, so `oneOf` is the only keyword that still compiles"
      - "`oneOf` requires exactly one subschema to match, so it catches ambiguous bodies that satisfy two variants; `anyOf` (at-least-one) would let such a body pass"
      - "`oneOf` short-circuits on the first matching branch and is therefore strictly faster to evaluate than `anyOf`, which must always test every subschema"
      - "`anyOf` is structurally incompatible with an OpenAPI `discriminator` and validators reject the pairing, whereas `oneOf` is the only keyword a discriminator may accompany"
    answer: 1
    explanation: |
      `oneOf` = exactly one match; `anyOf` = at least one. For a true union you want
      exactly-one semantics so a body that ambiguously matches both the card and bank
      variants is rejected. `anyOf` would accept it, hiding the ambiguity.
    ref: "concepts.md#polymorphic-and-discriminated-union-bodies"

  - id: request-validation-and-data-integrity-079
    difficulty: advanced
    tags: [parameters, pagination, resource-consumption]
    question: |
      A list endpoint accepts `?limit=`. A client sends `limit=1000000`. What is the
      correct validation posture?
    options:
      - "Honor the requested one million rows verbatim; the client best knows the page size it needs, and clamping it would violate the endpoint's documented contract"
      - "Enforce a documented maximum (clamp or reject) because an unbounded limit is a resource-exhaustion vector (OWASP API4)"
      - "Return 404 Not Found, because a page containing a million items does not exist in the collection and no such resource can be located"
      - "Silently return zero results whenever `limit` exceeds the row count, treating an over-large page request as an empty final page of the collection"
    answer: 1
    explanation: |
      Unbounded pagination lets one request pull enormous result sets, exhausting
      memory/DB — OWASP API4 Unrestricted Resource Consumption. Enforce a documented
      max (clamp to it or reject with a validation error) and a sensible default.
    ref: "concepts.md#validating-parameters-not-just-bodies"

  - id: request-validation-and-data-integrity-080
    difficulty: expert
    tags: [parameters, http-parameter-pollution]
    question: |
      A request has `?role=user&role=admin`. Different frameworks resolve repeated
      query params as first-value, last-value, or an array. What class of problem is
      this and how should an API respond?
    options:
      - "It is HTTP Parameter Pollution — a parser differential; define explicit semantics for repeated params and reject or normalize unexpected repetition"
      - "It is a cache-key collision; adding `Vary: Cookie` to the response makes each `role` value cache separately and resolves the ambiguity"
      - "It is harmless because the query-string grammar always parses repeated keys into an ordered array, so every framework sees `[user, admin]` identically"
      - "It is a TLS session-renegotiation artifact in which the second `role` is replayed from a prior handshake and should be dropped at the transport layer"
    answer: 0
    explanation: |
      HTTP Parameter Pollution mirrors the duplicate-key problem: components disagree
      on which repeated value wins, enabling bypasses. The API must define explicit
      semantics for singleton params and reject or normalize unexpected repeats.
    ref: "concepts.md#validating-parameters-not-just-bodies"

  - id: request-validation-and-data-integrity-081
    difficulty: expert
    tags: [complexity-limits, hashdos, resource-consumption]
    question: |
      Your API caps request bodies at 64 KB and rejects deep nesting, yet a 40 KB
      JSON object with tens of thousands of carefully chosen keys pegs a CPU core.
      What attack is this and what is the specific defense?
    options:
      - "A billion-laughs entity-expansion attack; disable DTD processing and external-entity resolution so the nested references cannot recursively expand"
      - "Hash-collision DoS (algorithmic complexity attack) — keys crafted to collide turn hashmap inserts into O(n²); defend with randomized hash seeds plus a key-count cap"
      - "A Slowloris connection-starvation attack; lower the socket read timeout so the trickle-fed request is dropped before it can occupy a worker"
      - "A ReDoS catastrophic-backtracking attack; rewrite the offending regular expression into a linear-time form to eliminate the pathological matching cost"
    answer: 1
    explanation: |
      When many keys hash to the same bucket, inserting them degrades to O(n²) — the
      classic hashDoS. Neither size nor depth caps stop it. The defenses are
      per-process randomized hash seeds (so an attacker can't precompute collisions)
      and a cap on the number of keys/nodes.
    ref: "concepts.md#structural-complexity-limits"

  - id: request-validation-and-data-integrity-082
    difficulty: advanced
    tags: [complexity-limits, nesting-depth, dos]
    question: |
      Why is a maximum-nesting-depth limit necessary even after you already cap total
      body size and array/string lengths?
    options:
      - "Deeply nested JSON violates RFC 8259, which caps object and array nesting at 32 levels, so any deeper structure is already rejected as malformed"
      - "A small but deeply nested structure like [[[[…]]]] can overflow a recursive parser's stack, a failure mode size/length caps don't cover"
      - "Nesting depth changes the gzip compression ratio enough to defeat body-size accounting, letting a large payload slip under the byte cap"
      - "Depth limits are only meaningful for XML documents, since JSON parsers flatten nested structures iteratively and never recurse on depth"
    answer: 1
    explanation: |
      A few kilobytes of deeply nested arrays/objects can exhaust the call stack of a
      recursive-descent parser, crashing the process — orthogonal to byte size or
      element counts. An explicit depth cap is the specific control.
    ref: "concepts.md#structural-complexity-limits"

  - id: request-validation-and-data-integrity-083
    difficulty: advanced
    tags: [error-contract, ecosystem, google-aip]
    question: |
      An interviewer notes that Google's API guidelines and much of RFC-9457
      practice differ on status for generic validation failures. Which is accurate?
    options:
      - "Google AIP-193 maps INVALID_ARGUMENT to HTTP 400 with field violations, while RFC 9110 itself does not endorse 422 (it came from WebDAV); both 400 and 422 practices coexist"
      - "Google's AIP guidelines strictly mandate 422 for every INVALID_ARGUMENT, while RFC 9110 conversely mandates 400 and forbids 422, so the two standards are in direct opposition"
      - "RFC 9457 explicitly forbids using 400 for any validation failure and requires 422, deprecating 400 for parsed-but-invalid request bodies across all HTTP APIs"
      - "There is a single blessed error shape and status code that every major public API, including Google and Stripe, is contractually required to follow for validation failures"
    answer: 0
    explanation: |
      Google AIP-193 uses INVALID_ARGUMENT→400 with BadRequest.field_violations; RFC
      9110 does not endorse 422 for generic validation (it originated in WebDAV).
      Hence the ecosystem splits between 400 and 422 — the senior point is
      consistency and a rich error body, not one universal code.
    ref: "concepts.md#the-validation-error-contract-ecosystem"

  - id: request-validation-and-data-integrity-084
    difficulty: advanced
    tags: [error-contract, jsonapi, pointer-parameter]
    question: |
      In a JSON:API error object, how is the location of a validation error in the
      request BODY versus a QUERY PARAMETER conveyed?
    options:
      - "`source.pointer` (a JSON Pointer) for a body field; `source.parameter` for a query parameter"
      - "Both body fields and query parameters are located with `source.pointer`, using a JSON Pointer whose leading segment names either the body or the query string"
      - "A body field is located with a `target` member and a query parameter with a `field` member, each holding the offending name as a plain string"
      - "JSON:API error objects have no way to locate a specific validation error, so clients must parse the human-readable `detail` text to find the field"
    answer: 0
    explanation: |
      JSON:API error objects use `source.pointer` (RFC 6901 JSON Pointer) for body
      locations and `source.parameter` (the parameter name) for query parameters —
      mirroring the RFC 9457 guidance to use a pointer for bodies and a parameter name
      for non-body inputs.
    ref: "concepts.md#the-validation-error-contract-ecosystem"

  - id: request-validation-and-data-integrity-085
    difficulty: expert
    tags: [nosql-injection, type-validation, security]
    question: |
      An endpoint expects `"username": "<string>"` but receives
      `"username": {"$gt": ""}`. Passed to a document database this becomes a
      query-operator injection. What is the primary validation failure and fix?
    options:
      - "An encoding problem; base64-encoding the `username` field before it reaches the database neutralizes the embedded `$gt` operator so it is stored as inert text"
      - "A type-validation failure: the value is an object where a string was required — strict type validation (reject non-strings) closes the NoSQL/operator-injection vector"
      - "A length problem; adding a `maxLength` constraint on `username` truncates the `{\"$gt\":\"\"}` object below the operator threshold and prevents the injection"
      - "An authentication problem; requiring a bearer token on the endpoint ensures only trusted callers can submit the operator object, closing the injection path"
    answer: 1
    explanation: |
      The core defect is accepting an object where a string is required. `{"$gt":""}`
      becomes a query operator downstream. Strict type validation — rejecting any
      non-string for that field — prevents the operator-injection entirely; it is a
      type check, not sanitization.
    ref: "concepts.md#format-assertion-and-injection-relevant-validation"

  - id: request-validation-and-data-integrity-086
    difficulty: expert
    tags: [ssrf, url-validation, owasp-api7]
    question: |
      A webhook endpoint stores a client-supplied callback URL that the server will
      later POST to. Which validation approach best mitigates SSRF (OWASP API7:2023)?
    options:
      - "Regex-check that the URL starts with `https://` and store it, relying on the encrypted scheme to guarantee the destination is an external, safe host"
      - "Allow-list permitted hosts/schemes, block internal/link-local ranges and the metadata endpoint 169.254.169.254, and re-validate after each redirect/DNS resolution"
      - "Reject only URLs whose host literally contains the word `localhost`, since that string is the sole way to reference the server's own internal network"
      - "Fetch the URL immediately to confirm it responds, then trust it permanently on the basis that a reachable host was proven benign at registration time"
    answer: 1
    explanation: |
      SSRF defenses must allow-list destinations, block internal/link-local and cloud
      metadata addresses, and re-validate on each hop because DNS rebinding and
      redirects defeat a one-time check. A scheme regex or a localhost denylist is
      trivially bypassed.
    ref: "concepts.md#format-assertion-and-injection-relevant-validation"

  - id: request-validation-and-data-integrity-087
    difficulty: advanced
    tags: [format, email, accept-then-verify]
    question: |
      Regarding validating an `email` field, which statement reflects senior
      judgment?
    options:
      - "A sufficiently strict regular expression can fully guarantee the address is real and deliverable, so a mailbox-verification step is redundant once the pattern passes"
      - "Even with JSON Schema's format-assertion vocabulary enabled, validators may under-validate email/uri, and a regex ≠ RFC 5321 deliverability — so accept-then-verify (confirmation link) beats an ever-stricter regex"
      - "The `format: email` keyword rejects every syntactically invalid address in all conforming validators by default, so no additional pattern or check is ever required"
      - "Email validation should reject any address containing a plus sign, because `+` sub-addressing is non-standard and cannot be delivered by real mail servers"
    answer: 1
    explanation: |
      2020-12 splits format into annotation (default, advisory) and assertion
      vocabularies, and even asserting validators may under-validate email/uri.
      Syntactic checks can't prove deliverability, so the robust design confirms via a
      verification link rather than tightening a regex (which also breaks valid
      addresses like plus-tags).
    ref: "concepts.md#format-assertion-and-injection-relevant-validation"

  - id: request-validation-and-data-integrity-088
    difficulty: intermediate
    tags: [trust-boundary, client-validation, security]
    question: |
      A team argues server-side validation is redundant because the web client
      validates the form and the published OpenAPI schema documents all constraints.
      What is the correct rebuttal?
    options:
      - "They are right; a published OpenAPI schema is self-enforcing because clients and gateways refuse to send any request that does not conform to the documented constraints"
      - "Client-side and edge validation and a published schema are conveniences an attacker bypasses by calling the API directly; the server is the trust boundary and must re-validate everything"
      - "OpenAPI schema constraints are cryptographically signed and enforced by the browser's fetch layer, so a request violating them cannot physically leave the client"
      - "Server-side validation is only needed for GET requests, since write methods like POST and PATCH are already validated by the database's column constraints"
    answer: 1
    explanation: |
      Browser JS is bypassed by hitting the API directly, and a published schema is
      merely a hint an attacker reads to craft valid-looking payloads. The server is
      the trust boundary; 'the client already validated it' is never a security
      guarantee.
    ref: "concepts.md#server-side-validation-is-authoritative"

  - id: request-validation-and-data-integrity-089
    difficulty: advanced
    tags: [enum, const, forward-compat]
    question: |
      Your schema uses `enum: ["active","suspended"]` for a `status` field. What is
      the correct handling and the versioning tension involved?
    options:
      - "Coerce any unknown status value to a default like 'active' so the request always succeeds, keeping the endpoint maximally forgiving of unexpected input"
      - "Reject unknown enum values (allow-list discipline), but be aware strict rejection can break forward-compatibility when the server later adds a new value clients don't yet know"
      - "Accept any string in the field; JSON Schema `enum` is purely advisory metadata for documentation and never actually rejects a value at validation time"
      - "Store unknown status values silently but strip them from every response body, so downstream consumers only ever observe the two documented states"
    answer: 1
    explanation: |
      Enums are an allow-list: reject unknown values rather than silently defaulting
      (which corrupts intent). The trade-off is forward-compatibility — adding a new
      enum value can break strict older clients/servers, which is why enum evolution
      needs a versioning strategy.
    ref: "concepts.md#format-assertion-and-injection-relevant-validation"

  - id: request-validation-and-data-integrity-090
    difficulty: expert
    tags: [error-contract, design, public-api]
    question: |
      You must design the validation-error contract for a public API consumed by web
      and mobile SDKs in many locales. Which set of properties is most important?
    options:
      - "Return only the first error encountered, phrased in English, including the raw SQL statement that failed, and send it all under a 200 OK success status"
      - "Stable machine-readable codes, all errors reported at once, a field locator (JSON Pointer / parameter), localizable human messages, and no internal leakage — under one API-wide shape"
      - "A distinct, uniquely structured error shape for every endpoint, so each owning team can define its own field names and format independent of the others"
      - "A single opaque 400 Bad Request carrying an empty body on every failure, on the theory that revealing nothing at all keeps attackers from learning anything"
    answer: 1
    explanation: |
      A durable public contract needs stable codes (clients branch on codes, not
      localized text), all errors at once (one fix cycle), a locator per error, and no
      leaked internals — all under one consistent shape. Per-endpoint shapes and
      English-only single errors make SDKs brittle; a bodyless 400 wrecks DX.
    ref: "concepts.md#the-validation-error-contract-ecosystem"
