topic: "Pagination, Filtering & Sorting"
domain: rest-api-design
topic_slug: pagination-filtering-and-sorting
version: 1
questions:
  - id: pagination-filtering-and-sorting-001
    difficulty: beginner
    tags: [why-paginate, collections]
    question: |
      Why should a collection endpoint like `GET /orders` paginate its results
      instead of always returning every matching row?
    options:
      - "Because the HTTP specification forbids any response body from exceeding a hard 1 MB payload limit"
      - "To bound response size, memory, and database load as the dataset grows, avoiding a correctness and denial-of-service problem"
      - "Because the REST architectural style requires every GET to a collection to return exactly ten items"
      - "Because the JSON format cannot represent an array containing more than one hundred distinct elements"
    answer: 1
    explanation: |
      Returning an unbounded list is both a correctness bug and a DoS risk: response size, memory, and DB cost grow without limit as the table grows. Pagination bounds each response. There is no HTTP body-size cap or REST rule forcing a fixed count, and JSON arrays have no such element limit.
    ref: "concepts.md#why-paginate-filter-and-sort"

  - id: pagination-filtering-and-sorting-002
    difficulty: beginner
    tags: [definitions, filtering, sorting]
    question: |
      In REST collection design, what is the difference between filtering and sorting?
    options:
      - "Filtering rearranges the order in which results appear, while sorting is what strips out the rows that fail the predicate"
      - "Filtering selects which resources are returned (a predicate); sorting defines the order in which they are returned"
      - "They are simply two interchangeable names for one and the same collection operation performed by the server"
      - "Filtering can only be applied to numeric columns, whereas sorting can only be applied to string-typed text columns"
    answer: 1
    explanation: |
      Filtering applies a predicate to narrow the result set to matching resources. Sorting defines the order of whatever set remains. They are distinct and often combined; neither is restricted to a data type.
    ref: "concepts.md#why-paginate-filter-and-sort"

  - id: pagination-filtering-and-sorting-003
    difficulty: beginner
    tags: [offset, page-size]
    question: |
      A client sends `GET /orders?page=3&size=20`. Assuming 1-based pages, which
      SQL clause does this most directly correspond to?
    options:
      - "LIMIT 20 OFFSET 40"
      - "LIMIT 20 OFFSET 60"
      - "LIMIT 3 OFFSET 20"
      - "LIMIT 60 OFFSET 20"
    answer: 0
    explanation: |
      With 1-based pages, offset = (page - 1) * size = (3 - 1) * 20 = 40, returning 20 rows. page/size and offset/limit are two spellings of the same mechanism.
    ref: "concepts.md#offset--limit-pagesize-pagination"

  - id: pagination-filtering-and-sorting-004
    difficulty: beginner
    tags: [offset, jump-to-page]
    question: |
      What is the main capability that offset/limit pagination gives clients that
      cursor pagination does not?
    options:
      - "Constant per-page cost no matter how deep into the result set you page"
      - "Guaranteed stability of the result set under concurrent inserts and deletes"
      - "The ability to jump directly to an arbitrary page N and render a numbered pager"
      - "Automatic, built-in protection against SQL injection through the paging parameters"
    answer: 2
    explanation: |
      Because offset = (page-1)*size is computable, offset pagination supports jumping to any page and rendering a numbered pager (1, 2, 3 ... 65). Cursor pagination is position-relative and only moves next/prev. Constant depth cost and write-stability are cursor's advantages, not offset's.
    ref: "concepts.md#offset--limit-pagesize-pagination"

  - id: pagination-filtering-and-sorting-005
    difficulty: intermediate
    tags: [offset, off-by-one, conventions]
    question: |
      Why is it important to document whether `page` is 0-based or 1-based in an
      offset-style API?
    options:
      - "Because the HTTP specification explicitly mandates that all offset-style paging must begin at page zero"
      - "Because any page number starting at one produces a document that fails strict JSON schema validation"
      - "Because both conventions exist in the wild and the ambiguity is a common off-by-one source that shifts every result by one page"
      - "Because search-engine crawlers require the first page to be numbered one before they will index a collection"
    answer: 2
    explanation: |
      Both 0-based and 1-based page numbering are used by real APIs. If the convention isn't documented, clients compute the wrong offset and every page is shifted — a classic off-by-one bug. No RFC mandates a base.
    ref: "concepts.md#offset--limit-pagesize-pagination"

  - id: pagination-filtering-and-sorting-006
    difficulty: intermediate
    tags: [deep-paging, offset, performance]
    question: |
      With `... ORDER BY created_at LIMIT 20 OFFSET 100000`, why is this query
      much slower than the same query with `OFFSET 0`?
    options:
      - "The database must generate, sort, and discard the first 100,000 matching rows before returning the 20 you want"
      - "A large OFFSET forces an exclusive table-level lock for the scan that the OFFSET 0 fast path is able to avoid"
      - "Any OFFSET value above a few thousand automatically disables the query plan cache for the whole statement"
      - "The database must re-parse and re-plan the SQL statement once for every single row that gets skipped over"
    answer: 0
    explanation: |
      OFFSET does not let the engine seek ahead. It must produce the first N matching rows in sorted order and then throw them away, so cost grows linearly with the offset (O(N)). That's the fundamental deep-paging problem of offset pagination.
    ref: "concepts.md#deep-paging-cost-of-offset"

  - id: pagination-filtering-and-sorting-007
    difficulty: intermediate
    tags: [deep-paging, public-apis]
    question: |
      Many large search APIs cap how deep you can offset (e.g. refusing offsets
      beyond ~10,000 results). What is the primary reason?
    options:
      - "Because deep OFFSET is an O(N) scan that becomes a performance and DoS liability; they push clients to narrow the query or use a cursor"
      - "To force clients past the free tier and compel them to pay for a premium subscription to page deeper"
      - "Because a JSON response body is physically unable to encode any array index above the value 10,000"
      - "Because RFC 9110 explicitly forbids any pagination offset from exceeding a value of 10,000 results"
    answer: 0
    explanation: |
      Deep offset cost grows linearly with depth, so allowing arbitrarily deep offsets is a latency and DoS risk. Capping it (and steering clients to cursor pagination or narrower filters) bounds server work. It is a performance decision, not an RFC rule or an encoding limit.
    ref: "concepts.md#deep-paging-cost-of-offset"

  - id: pagination-filtering-and-sorting-008
    difficulty: intermediate
    tags: [cursor, keyset, seek]
    question: |
      What is the core mechanism of keyset (cursor) pagination?
    options:
      - "It seeks via an indexed WHERE predicate on the sort key of the last row seen, instead of counting and discarding preceding rows"
      - "It caches every previously served page inside Redis and replays the stored slices back to the client on request"
      - "It loads the entire matching table into server memory and then slices out the requested window from that copy"
      - "It re-runs a full COUNT(*) over the filtered set before each page in order to compute the correct offset value"
    answer: 0
    explanation: |
      Keyset pagination replaces OFFSET with `WHERE (sort_key) > last_seen_key ORDER BY sort_key LIMIT n`. Because the sort key is indexed, the engine seeks directly to the position and reads only the page, giving O(page-size) cost regardless of depth.
    ref: "concepts.md#cursor--keyset-pagination"

  - id: pagination-filtering-and-sorting-009
    difficulty: advanced
    tags: [cursor, tiebreaker, correctness]
    question: |
      A team implements keyset pagination as `WHERE created_at > :last_created
      ORDER BY created_at LIMIT 20`, sorting only on a non-unique `created_at`.
      What bug can appear at page boundaries?
    options:
      - "Nothing at all — a single non-unique sort column is always fully sufficient for correct keyset paging"
      - "The seek predicate will always match no rows, so every page after the first comes back completely empty"
      - "The created_at timestamp is silently coerced to a string, which reverses the intended chronological ordering"
      - "Rows that share the same created_at value as the boundary can be skipped or duplicated because the key is not unique"
    answer: 3
    explanation: |
      Keyset requires a total (unique) order. When several rows share `created_at`, a strict `>` on that non-unique key can skip the tied rows not yet seen or re-include ones already returned. The fix is a unique tiebreaker, e.g. `WHERE (created_at, id) > (:last_created, :last_id)`.
    ref: "concepts.md#cursor--keyset-pagination"

  - id: pagination-filtering-and-sorting-010
    difficulty: intermediate
    tags: [cursor, opaque-token]
    question: |
      Why do many APIs make the pagination cursor an opaque, base64-encoded
      (often signed) token rather than exposing the raw last-seen key?
    options:
      - "Because RFC 8288 explicitly requires all pagination cursors to be encoded using the base64 alphabet"
      - "Because a base64-encoded opaque token is always guaranteed to be smaller on the wire than the raw sort key"
      - "So the client cannot forge or tamper with it, and so the server can change the internal paging scheme without breaking clients"
      - "Because the JSON wire format is unable to transmit large integer sort-key values without precision loss"
    answer: 2
    explanation: |
      An opaque, signed token keeps the internal sort key/scheme hidden and prevents clients from hand-crafting or tampering with cursors. It also lets the server evolve the encoding freely. There is no RFC mandating base64, and opacity is not about size or JSON limits.
    ref: "concepts.md#cursor--keyset-pagination"

  - id: pagination-filtering-and-sorting-011
    difficulty: intermediate
    tags: [cursor, stripe, real-world]
    question: |
      Stripe's API pages with `?limit=20&starting_after=or_1401` and
      `ending_before=...`. What style of pagination is this?
    options:
      - "Classic offset/limit pagination that addresses each page by a numeric page index"
      - "Cursor pagination anchored on a resource ID"
      - "Pure HATEOAS pagination that relies only on server links and takes no query parameters"
      - "Random-sampling pagination that returns a different shuffled subset on each request"
    answer: 1
    explanation: |
      `starting_after`/`ending_before` anchor the next/prev page on a specific resource ID rather than a numeric offset — a cursor (keyset) variant using the object id as the cursor. Stripe, Slack, Twitter/X, and GitHub GraphQL all use cursor pagination.
    ref: "concepts.md#cursor--keyset-pagination"

  - id: pagination-filtering-and-sorting-012
    difficulty: intermediate
    tags: [offset-vs-cursor, trade-offs]
    question: |
      For an infinite-scroll activity feed backed by a large, high-write table
      where users only ever scroll forward, which pagination style is generally
      the better fit and why?
    options:
      - "Offset/limit, because it supports jumping directly to any arbitrary numbered page in the feed"
      - "Offset/limit, because it can return an exact total element count on every page very cheaply"
      - "Cursor/keyset, because it has constant per-page cost and is stable under concurrent inserts/deletes"
      - "Neither style fits — an activity feed should just return the whole underlying table in a single response"
    answer: 2
    explanation: |
      A large, high-write, forward-only feed is exactly where cursor/keyset wins: constant depth cost and stability under concurrent writes. Jump-to-page-N and cheap totals (offset's strengths) don't matter for infinite scroll.
    ref: "concepts.md#offset-vs-cursor--trade-offs"

  - id: pagination-filtering-and-sorting-013
    difficulty: intermediate
    tags: [offset-vs-cursor, trade-offs]
    question: |
      Which statement correctly pairs each pagination style with a weakness it
      has?
    options:
      - "Offset degrades at deep pages and is unstable under writes; cursor cannot jump to an arbitrary page N or cheaply produce a numbered pager"
      - "Cursor is the one that degrades at deep pages, while offset is the style that cannot jump directly to page N"
      - "Both styles have effectively identical performance profiles and identical stability characteristics under writes"
      - "Offset pagination is stable under concurrent writes, whereas cursor pagination is the one that becomes unstable"
    answer: 0
    explanation: |
      Offset's weaknesses are deep-paging cost (O(offset)) and instability under concurrent writes. Cursor's weaknesses are the loss of jump-to-arbitrary-page and cheap numbered pagers. This trade-off is the crux of the topic.
    ref: "concepts.md#offset-vs-cursor--trade-offs"

  - id: pagination-filtering-and-sorting-014
    difficulty: beginner
    tags: [offset-vs-cursor, when-to-use]
    question: |
      Which scenario most favors plain offset/limit pagination?
    options:
      - "Paging forward only through billions of append-only, continuously-growing log events"
      - "A high-write social timeline that receives many new posts every single second"
      - "A small, relatively static admin list where users expect to click to page 50 directly"
      - "A batch ETL job that must read every row of a large table exactly once per run"
    answer: 2
    explanation: |
      Offset shines for small, bounded, relatively static datasets and admin UIs where jumping to an arbitrary numbered page matters. Large/high-write/exactly-once workloads favor cursor/keyset.
    ref: "concepts.md#offset-vs-cursor--trade-offs"

  - id: pagination-filtering-and-sorting-015
    difficulty: intermediate
    tags: [total-count, performance]
    question: |
      Why is returning an exact `total_elements` count often expensive on a large
      filtered collection?
    options:
      - "It requires a separate COUNT(*) over the same filter that may scan the entire matching set, sometimes costing as much as the page fetch itself"
      - "The COUNT(*) aggregate function is explicitly prohibited on paginated endpoints by the RFC 9457 problem-details spec"
      - "Counting the matches requires the server to download every matching row to the client and tally them there"
      - "Relational databases are fundamentally incapable of counting a result set that contains more than 10,000 rows"
    answer: 0
    explanation: |
      An exact total generally needs a separate `SELECT COUNT(*) ... WHERE <same filters>`, which can scan the whole matching set — as costly as, or costlier than, fetching one page. That's why many APIs make totals opt-in or approximate.
    ref: "concepts.md#page-metadata-and-total-counts"

  - id: pagination-filtering-and-sorting-016
    difficulty: intermediate
    tags: [has-more, limit-plus-one]
    question: |
      How can a server cheaply tell the client whether more results exist, without
      running a COUNT(*)?
    options:
      - "By always computing and returning an accurate total_pages field on every single response"
      - "By hashing the full result set and comparing that digest against the previously returned page"
      - "By issuing an HTTP 206 Partial Content status whenever additional results remain to be fetched"
      - "By requesting limit + 1 rows and checking whether the extra row came back (has_more)"
    answer: 3
    explanation: |
      Fetching `limit + 1` rows and checking whether the extra one exists yields a cheap `has_more`/`has_next` boolean with no separate count query. This is why many cursor APIs return `has_more` but omit exact totals.
    ref: "concepts.md#page-metadata-and-total-counts"

  - id: pagination-filtering-and-sorting-017
    difficulty: advanced
    tags: [total-count, consistency]
    question: |
      A UI shows "65 pages" from a `total_pages` field. Under concurrent writes,
      what is the correct way to think about that number?
    options:
      - "It is a snapshot that is stale the moment it is computed; rows can appear or disappear between the count and subsequent fetches"
      - "It is a hard invariant that the client can safely rely on remaining constant for the whole session"
      - "It is guaranteed to stay accurate because the COUNT(*) takes an exclusive lock on the table while counting"
      - "It is intentionally always an overestimate by design, so clients should subtract a fixed safety margin"
    answer: 0
    explanation: |
      total_elements/total_pages reflect the set at count time only. With ongoing inserts/deletes the number is immediately stale, so clients must not treat "65 pages" as a durable invariant.
    ref: "concepts.md#page-metadata-and-total-counts"

  - id: pagination-filtering-and-sorting-018
    difficulty: beginner
    tags: [total-count, approximate]
    question: |
      For a search UI over a huge corpus, why do many APIs return "about 4,300
      results" rather than an exact count?
    options:
      - "Because the OpenAPI specification requires search endpoints to report an approximate result count rather than an exact one"
      - "Because returning the exact number of matching documents would leak information that violates individual user privacy"
      - "Because computing the exact count is expensive and rarely worth it; an estimate (e.g. from table statistics) is good enough for the UI"
      - "Because the client-side JSON parser is unable to represent the exact integer counts produced by a huge corpus"
    answer: 2
    explanation: |
      Exact counts over a large corpus are costly and users rarely need precision, so search UIs commonly show an approximate/estimated count. It is a cost-vs-value trade-off, not a spec or privacy requirement.
    ref: "concepts.md#page-metadata-and-total-counts"

  - id: pagination-filtering-and-sorting-019
    difficulty: intermediate
    tags: [link-header, rfc8288]
    question: |
      Which RFC standardizes the `Link` header and the relation types `next`,
      `prev`, `first`, and `last` commonly used for pagination?
    options:
      - "RFC 7807 (error format)"
      - "RFC 7519 (web tokens)"
      - "RFC 8288 (Web Linking)"
      - "RFC 6585 (status codes)"
    answer: 2
    explanation: |
      RFC 8288 (Web Linking) defines the `Link` header and IANA-registered relation types including next/prev/first/last. RFC 7807/9457 is Problem Details, 7519 is JWT, and 6585 defines additional status codes like 429.
    ref: "concepts.md#link-header-for-pagination-rfc-8288"

  - id: pagination-filtering-and-sorting-020
    difficulty: intermediate
    tags: [link-header, github, hateoas]
    question: |
      GitHub's REST API returns pagination in a `Link` header rather than making
      clients build page URLs. What is the main advantage of this approach?
    options:
      - "It makes pagination discoverable/HATEOAS-friendly — the client follows a server-provided URL instead of hard-coding the paging scheme"
      - "It removes the need for any query parameters entirely, since the Link header alone fully encodes every filter and sort"
      - "It lets the client mutate resources directly through the Link header, turning an otherwise read-only GET into a write operation"
      - "It guarantees the paginated response becomes permanently cacheable, so a CDN can serve every page without revalidating"
    answer: 0
    explanation: |
      Returning next/prev/first/last as `Link` relations lets clients follow server-provided URLs rather than knowing and constructing the pagination scheme themselves — the hypermedia/HATEOAS approach. It doesn't eliminate query params (the links contain them), enable mutation, or dictate caching.
    ref: "concepts.md#link-header-for-pagination-rfc-8288"

  - id: pagination-filtering-and-sorting-021
    difficulty: intermediate
    tags: [link-header, github, last-page]
    question: |
      Why does GitHub sometimes omit the `rel="last"` link (and why do cursor APIs
      generally omit it)?
    options:
      - "Because the rel=last relation was formally deprecated in RFC 8288 and modern clients are told to ignore it entirely"
      - "Because computing the last page would require a full count of the result set, which is expensive or impossible for cursor-based results"
      - "Because the specification prohibits clients from jumping straight to the last page and requires strictly sequential access"
      - "Because the final page of any paginated collection is guaranteed to be empty and therefore not worth linking to"
    answer: 1
    explanation: |
      Knowing the last page requires knowing the total, i.e. a full count — costly for large sets and undefined for pure cursor pagination. So `rel="last"` is dropped in those cases while next/prev remain.
    ref: "concepts.md#link-header-for-pagination-rfc-8288"

  - id: pagination-filtering-and-sorting-022
    difficulty: intermediate
    tags: [link-header, custom-headers]
    question: |
      An API returns `X-Total-Count: 1284`. What is the correct characterization
      of this header?
    options:
      - "It is defined by RFC 8288 as a companion to the Link header for totals"
      - "It is a de-facto convention using a custom X- header, not defined by any RFC"
      - "It is a standard HTTP response header registered by RFC 9110 semantics"
      - "It is mandatory on every paginated response per the HTTP core specification"
    answer: 1
    explanation: |
      X-Total-Count / X-Total-Pages are common custom (X-) conventions, not standardized by any RFC. They work fine but shouldn't be described as standard. RFC 8288 standardizes the Link header, not total-count headers.
    ref: "concepts.md#link-header-for-pagination-rfc-8288"

  - id: pagination-filtering-and-sorting-023
    difficulty: beginner
    tags: [filtering, query-params]
    question: |
      A client sends `GET /orders?status=shipped&customer_id=42`. What is the
      conventional interpretation of multiple filter query parameters?
    options:
      - "They are ORed together (status=shipped OR customer_id=42)"
      - "Only the last-listed parameter is applied and the earlier ones are silently dropped"
      - "They are ANDed together (status=shipped AND customer_id=42)"
      - "They are ignored unless a filter= param is also present"
    answer: 2
    explanation: |
      By convention, distinct field-equality filter params are combined with AND: return orders that are shipped AND belong to customer 42. OR is usually expressed with repeated values or a comma list on a single field.
    ref: "concepts.md#filtering-conventions"

  - id: pagination-filtering-and-sorting-024
    difficulty: intermediate
    tags: [filtering, in-operator]
    question: |
      Which of these is a common convention for expressing "status IN (shipped,
      delivered)" in a query string?
    options:
      - "GET /orders?status!=pending  (an inequality that returns everything except pending)"
      - "GET /orders?status=shipped+delivered  (a required literal 'only' keyword after the values)"
      - "GET /orders?status=(shipped delivered)  (parenthesised space-separated set literal)"
      - "GET /orders?status=shipped,delivered  (or the repeated-key form status=shipped&status=delivered)"
    answer: 3
    explanation: |
      A comma-separated value (`status=shipped,delivered`) or a repeated key (`status=shipped&status=delivered`) are the two common conventions for an IN-style multi-value filter. Both should be documented so clients know which is supported.
    ref: "concepts.md#filtering-conventions"

  - id: pagination-filtering-and-sorting-025
    difficulty: intermediate
    tags: [filtering, operators, ranges]
    question: |
      A team needs range filters like "created on or after Jan 1 and before Jul 1."
      Which is a recognized convention for expressing comparison operators in query
      params?
    options:
      - "created_at[gte]=2026-01-01&created_at[lt]=2026-07-01 (bracketed operators)"
      - "created_at==between==2026 (RSQL is the only DSL capable of expressing ranges)"
      - "You cannot express any range in a query string; ranges always require a POST body"
      - "created_at=2026-01-01:2026-07-01 is the single universally-mandated range form"
    answer: 0
    explanation: |
      Bracketed operators (`field[gte]=`, `field[lt]=`) are one widely-used convention for range/comparison filters; prefix forms (`field=gt:100`) and range sugar also exist. The key is to pick and document one. Ranges are certainly expressible in query strings.
    ref: "concepts.md#filtering-conventions"

  - id: pagination-filtering-and-sorting-026
    difficulty: advanced
    tags: [filtering, rsql, fiql]
    question: |
      What does the RSQL/FIQL filter `?filter=status==shipped;amount=gt=100`
      express?
    options:
      - "status equals shipped AND amount greater than 100 (';' is AND in RSQL)"
      - "status equals shipped OR amount greater than 100 (';' is the inclusive-OR operator)"
      - "A syntax error, because RSQL defines no comparison operators such as =gt="
      - "status not equal to shipped, since '==' is read as a negated-equality operator"
    answer: 0
    explanation: |
      In RSQL/FIQL, `;` is logical AND and `,` is logical OR, `==` is equals and `=gt=` is greater-than. So this means status == shipped AND amount > 100. RSQL packs complex boolean filters into a single URL-friendly param.
    ref: "concepts.md#filtering-conventions"

  - id: pagination-filtering-and-sorting-027
    difficulty: advanced
    tags: [filtering, security, owasp]
    question: |
      Why must a server allowlist which fields are filterable rather than mapping
      arbitrary client-supplied field names straight to database columns?
    options:
      - "To reduce the JSON payload size returned to the client on each page"
      - "Because query strings are technically incapable of carrying database field names"
      - "Because RFC 8288 explicitly forbids any form of dynamic client-supplied filtering"
      - "Because unrestricted field-to-column mapping is an injection and information-disclosure vector, related to OWASP API3:2023 Broken Object Property Level Authorization"
    answer: 3
    explanation: |
      Translating arbitrary client field names to columns can expose or filter on properties the client shouldn't access (OWASP API3:2023) and opens injection risk. Allowlisting filterable/sortable fields is the defense. It's a security control, not a payload or spec matter.
    ref: "concepts.md#filtering-conventions"

  - id: pagination-filtering-and-sorting-028
    difficulty: intermediate
    tags: [filtering, reserved-names]
    question: |
      Why should an API reserve names like `page`, `size`, `sort`, `cursor`, and
      `q` and not treat them as filterable fields?
    options:
      - "Because they are formally reserved keywords in the HTTP query-string grammar"
      - "Because these control parameters must always be sent in the request body, never the URL"
      - "So pagination/sort/search control params don't collide with resource field names used for filtering"
      - "Because RFC 9110 defines each of them as a dedicated HTTP header rather than a query param"
    answer: 2
    explanation: |
      These are control parameters for pagination, sorting, and search. If a resource also had a field literally named `sort` or `page`, treating every param as a filter would create ambiguity. Reserving the control names avoids the collision.
    ref: "concepts.md#filtering-conventions"

  - id: pagination-filtering-and-sorting-029
    difficulty: beginner
    tags: [sorting, sort-syntax]
    question: |
      An API documents `sort=-created_at,id`. What ordering does this request?
    options:
      - "created_at descending, then id ascending (as a tiebreaker)"
      - "created_at ascending, then id descending, since the leading sign flips both fields"
      - "id descending only, with the created_at term treated as an ignored comment"
      - "A pseudo-random order seeded by the created_at value of the first row"
    answer: 0
    explanation: |
      A leading `-` means descending; no prefix (or `+`) means ascending. So `-created_at,id` sorts by created_at DESC and breaks ties with id ASC. This comma/minus form (used by JSON:API) scales to multi-field sorts.
    ref: "concepts.md#sorting"

  - id: pagination-filtering-and-sorting-030
    difficulty: intermediate
    tags: [sorting, determinism, tiebreaker]
    question: |
      Why is `ORDER BY created_at` alone (no tiebreaker) dangerous for paginated
      results when timestamps can tie?
    options:
      - "It always returns the rows in strict reverse chronological order regardless of direction"
      - "It disables the database index on created_at entirely, forcing a sequential table scan"
      - "Ties can be returned in a different order on different requests, so rows can be duplicated or skipped at page boundaries"
      - "It forces the endpoint to raise a 500 error the moment two timestamps are equal"
    answer: 2
    explanation: |
      Sorting on a non-unique column is not a total order; tied rows may come back in different relative orders across requests. Across page boundaries that non-determinism causes duplicates or skips. Appending a unique tiebreaker (e.g. `, id`) makes the order total and stable.
    ref: "concepts.md#sorting"

  - id: pagination-filtering-and-sorting-031
    difficulty: intermediate
    tags: [sorting, security, allowlist]
    question: |
      Besides authorization concerns, what performance risk comes from letting
      clients sort on arbitrary columns?
    options:
      - "Sorting on a non-indexed column forces a full sort of the result set, which combined with deep offset is a latency cliff"
      - "Sorting always doubles the size of the serialized response body sent to the client"
      - "Arbitrary sorting silently bypasses the response's HTTP caching and ETag headers"
      - "It causes the JSON array to be emitted in an arbitrary, unordered sequence"
    answer: 0
    explanation: |
      A sort on an unindexed column requires the database to sort the entire matching set in memory/disk, and paired with deep offset this is a well-known latency cliff. Allowlisting sortable (ideally indexed) fields mitigates both the perf and authorization risks.
    ref: "concepts.md#sorting"

  - id: pagination-filtering-and-sorting-032
    difficulty: advanced
    tags: [sorting, cursor, coupling]
    question: |
      In a cursor/keyset API, what must happen if the client changes the `sort`
      parameter partway through paging?
    options:
      - "The previously issued cursor becomes meaningless because it encodes a position in the old sort order; the server should encode the sort into the cursor and reject a mismatch"
      - "Nothing happens, because a keyset cursor is completely independent of the active sort order"
      - "The server must silently re-sort and re-issue all previously returned pages to the client"
      - "The client is automatically downgraded to offset pagination for the remainder of the walk"
    answer: 0
    explanation: |
      A cursor encodes a position within a specific sort order. Changing sort mid-walk invalidates it. Robust designs embed the sort spec in the cursor and reject cursors whose sort doesn't match the request, avoiding silent skips/duplicates.
    ref: "concepts.md#sorting"

  - id: pagination-filtering-and-sorting-033
    difficulty: intermediate
    tags: [sorting, default-order]
    question: |
      Why should a collection endpoint define a default sort order (typically on a
      unique key) even when the client doesn't send `sort`?
    options:
      - "Because RFC 9110 explicitly requires every collection endpoint to declare a default sort"
      - "Because JSON clients are unable to parse an array whose elements arrive unsorted"
      - "To make the response body significantly more compressible over the wire"
      - "So results are deterministic across requests; without a defined order, pagination over the collection is undefined"
    answer: 3
    explanation: |
      Without an explicit ORDER BY, databases may return rows in an arbitrary, unstable order, making pagination meaningless. A stable default sort (usually on a unique key) guarantees deterministic paging even when the client omits `sort`.
    ref: "concepts.md#sorting"

  - id: pagination-filtering-and-sorting-034
    difficulty: beginner
    tags: [search, q-param]
    question: |
      How does free-text search typically differ from structured filtering in a
      REST API?
    options:
      - "Search always returns strictly fewer response fields per resource than filtering does"
      - "Search endpoints are only ever exposed over HTTPS, whereas filtering works over plain HTTP"
      - "Search finds resources relevant to terms (often with relevance ranking), while filtering applies exact field predicates; search commonly uses a `q` param"
      - "Filtering must be issued as a POST request while free-text search must be issued as a GET"
    answer: 2
    explanation: |
      Filtering matches exact field predicates (field == value); search finds resources relevant to query terms, usually ranked by relevance, and conventionally uses `?q=...`. They are complementary and frequently combined.
    ref: "concepts.md#search"

  - id: pagination-filtering-and-sorting-035
    difficulty: advanced
    tags: [search, relevance, pagination-interaction]
    question: |
      Why do relevance-ranked search results interact badly with offset
      pagination and long-lived cursors?
    options:
      - "Because relevance scores are persisted as text strings that sort lexicographically instead of numerically"
      - "Because a relevance-ranked search always returns exactly ten results per query by design"
      - "Because offset pagination is explicitly forbidden on any relevance-ranked search endpoint"
      - "Because relevance is generally not a stable total order over time — scores shift as the index changes, so a fixed offset or old cursor no longer points at a consistent position"
    answer: 3
    explanation: |
      Relevance ordering isn't a stable total order: as documents are added/updated, scores and ranks shift. A previously computed offset or cursor position becomes inconsistent, causing skips/duplicates. That's why relevance search often pairs with has_more and short-lived state.
    ref: "concepts.md#search"

  - id: pagination-filtering-and-sorting-036
    difficulty: intermediate
    tags: [search, combining-filters]
    question: |
      Is it acceptable to combine free-text search with structured filters, e.g.
      `GET /products?q=shoes&brand=acme&price[lt]=100`?
    options:
      - "No, because free-text search and structured filters are mutually exclusive on one endpoint"
      - "Yes — search narrows by relevance while filters narrow by facets; combining them is common and expected"
      - "Only if the client splits them across two separate sequential requests"
      - "Only when the combined query is issued as a POST rather than a GET request"
    answer: 1
    explanation: |
      Combining a `q` search with facet filters (brand, price range) is a standard, expected pattern: search provides relevance, filters constrain by structured attributes. There's no rule against combining them in a single GET.
    ref: "concepts.md#search"

  - id: pagination-filtering-and-sorting-037
    difficulty: advanced
    tags: [consistency, offset, duplicates]
    question: |
      Newest-first offset pagination: a client reads page 1 (rows 1–20), then a
      new row is inserted at the top before it requests page 2 (`offset=20`). What
      happens?
    options:
      - "The new row is skipped entirely and page 2 comes back correct because the offset counts from the original snapshot"
      - "The database automatically detects the shifted window and dedupes any repeated rows across pages"
      - "Every row shifts down by one, so offset=20 now points at a row already shown on page 1 — the client sees a duplicate"
      - "Page 2 returns an HTTP 409 Conflict to signal the collection changed mid-scan"
    answer: 2
    explanation: |
      Inserting a row ahead of the read position shifts all rows down by one. `OFFSET 20` then lands on the previous row 20, which the client already saw on page 1 — a duplicate. Offset pagination is not stable under concurrent inserts.
    ref: "concepts.md#consistency-under-concurrent-insertsdeletes"

  - id: pagination-filtering-and-sorting-038
    difficulty: advanced
    tags: [consistency, offset, skips]
    question: |
      With offset pagination, how can a concurrent DELETE ahead of the client's
      current position cause a row to be missed?
    options:
      - "It cannot happen; a delete never affects pagination because the engine recomputes each row's absolute position on every request"
      - "The delete forces every previously fetched page to be reloaded from scratch before offset=20 can be served"
      - "The server returns the already-deleted row anyway from a stale buffer, so no live row is ever skipped"
      - "Deleting a row before the offset shifts later rows up by one, so the row that was at position 21 moves to 20 and is skipped when the client requests offset=20"
    answer: 3
    explanation: |
      A delete ahead of the read position shifts subsequent rows up. The row previously at position 21 becomes position 20, so requesting `offset=20` skips over it entirely. Thus offset pagination can both duplicate (on inserts) and drop (on deletes) rows.
    ref: "concepts.md#consistency-under-concurrent-insertsdeletes"

  - id: pagination-filtering-and-sorting-039
    difficulty: advanced
    tags: [consistency, keyset, exactly-once]
    question: |
      An interviewer asks how to page through a continuously-written table seeing
      each row exactly once across many independent HTTP requests. What is the
      best answer?
    options:
      - "Keyset pagination anchored on an immutable, unique key (e.g. WHERE id > :last_id ORDER BY id)"
      - "Offset pagination with a very large page size so each request captures many rows at once"
      - "Return the whole table in one response and have the client deduplicate the rows it has seen"
      - "Add a total_count field to each page and re-read any page whose count changed between requests"
    answer: 0
    explanation: |
      Keyset pagination on an immutable unique key is anchored to a position, so inserts/deletes behind the cursor don't shift what "after last_id" means — giving exactly-once forward traversal. Offset cannot guarantee it; a bounded snapshot transaction is the alternative but doesn't span independent requests.
    ref: "concepts.md#consistency-under-concurrent-insertsdeletes"

  - id: pagination-filtering-and-sorting-040
    difficulty: advanced
    tags: [consistency, keyset, mutable-keys]
    question: |
      Why is choosing a mutable column (like `updated_at` or a changeable status)
      as the keyset sort/cursor key risky for exactly-once paging?
    options:
      - "Mutable columns cannot be covered by a database index, so the seek predicate silently degrades to a full scan"
      - "Mutable columns are always coerced to sort as NULL, pushing every changed row to the end of the result"
      - "A row whose key changes can move from behind the cursor to ahead of it (or vice versa) and be seen twice or skipped"
      - "The cursor token encoding the mutable value would grow past the browser URL length limit and be truncated"
    answer: 2
    explanation: |
      Keyset assumes the anchor key is stable. If a row's sort key mutates, the row can jump relative to the cursor — reappearing (duplicate) or moving past it unseen (skip). For exactly-once semantics, cursor on immutable keys such as creation time + id.
    ref: "concepts.md#consistency-under-concurrent-insertsdeletes"

  - id: pagination-filtering-and-sorting-041
    difficulty: intermediate
    tags: [consistency, keyset, stability]
    question: |
      Which statement about cursor/keyset pagination stability is correct?
    options:
      - "It is unstable under any concurrent write at all, making it strictly worse than offset pagination on live tables"
      - "It requires taking an exclusive lock on the whole table for the duration of the walk to stay stable"
      - "It only works correctly on tables that are never written to after the first page is served"
      - "Because the next page is 'WHERE key > last_seen', inserts or deletes behind the cursor don't change what comes after it, so forward traversal over older records is stable"
    answer: 3
    explanation: |
      The keyset predicate anchors on the last-seen key, so writes behind the cursor don't shift the meaning of "after last_seen." Forward traversal through already-passed key ranges is stable — no duplicates/skips relative to the anchor — unlike offset.
    ref: "concepts.md#consistency-under-concurrent-insertsdeletes"

  - id: pagination-filtering-and-sorting-042
    difficulty: beginner
    tags: [limits, defaults]
    question: |
      What should a collection endpoint do when the client omits `limit`
      entirely?
    options:
      - "Return every row in the table, since an omitted limit is an explicit request for the full unbounded set"
      - "Return an empty array, treating the missing limit as a request for zero rows until one is supplied"
      - "Respond with 400 Bad Request because limit is a required parameter that clients must always send"
      - "Apply a sane default page size (e.g. 20) rather than returning everything"
    answer: 3
    explanation: |
      Omitting `limit` should fall back to a documented default page size (e.g. 20), never to "return everything." Defaulting to the whole table reintroduces the unbounded-response problem pagination exists to prevent.
    ref: "concepts.md#limits-defaults--guardrails"

  - id: pagination-filtering-and-sorting-043
    difficulty: intermediate
    tags: [limits, max-page-size]
    question: |
      A client requests `GET /orders?limit=100000` on an API whose max page size
      is 100. Which are the two acceptable, documented behaviors?
    options:
      - "Silently return all 100000 rows to honor the request, or let the query run until the process runs out of memory"
      - "Always return an empty page whenever the requested limit exceeds the configured maximum page size"
      - "Clamp the limit to the max (ideally signaling it), or reject with 400 Bad Request — and document whichever is chosen"
      - "Redirect the client to page 1 with a 301 Moved Permanently and discard the oversized limit"
    answer: 2
    explanation: |
      The two sane options are clamping `limit` down to the hard cap (commonly with a signal to the client) or rejecting with 400. Either is fine as long as it's documented. Returning the whole 100000 defeats the guardrail.
    ref: "concepts.md#limits-defaults--guardrails"

  - id: pagination-filtering-and-sorting-044
    difficulty: intermediate
    tags: [limits, validation, problem-details]
    question: |
      A client sends `limit=-5` and `sort=totally_unknown_field`. What is the most
      appropriate response?
    options:
      - "400 Bad Request with a machine-readable error body (RFC 9457 Problem Details) explaining the invalid params"
      - "Silently ignore both invalid params and return the collection using the default limit and sort order"
      - "200 OK with an empty array, treating the invalid parameters as a query that legitimately matched nothing"
      - "500 Internal Server Error, since a negative limit and unknown sort field are unrecoverable server faults"
    answer: 0
    explanation: |
      Invalid pagination/sort params (negative limit, unknown sort field) should be rejected with 400 and an RFC 9457 `application/problem+json` body describing the problem — clearer than silently ignoring them (which hides client bugs) and correct versus a 500.
    ref: "concepts.md#limits-defaults--guardrails"

  - id: pagination-filtering-and-sorting-045
    difficulty: advanced
    tags: [limits, owasp, dos]
    question: |
      Which OWASP API Security Top 10 (2023) risk is most directly addressed by
      enforcing maximum page sizes and capping offset depth?
    options:
      - "API1:2023 Broken Object Level Authorization"
      - "API4:2023 Unrestricted Resource Consumption"
      - "API7:2023 Server Side Request Forgery"
      - "API9:2023 Improper Inventory Management"
    answer: 1
    explanation: |
      Unbounded page sizes and deep offsets let a client force the server to fetch/scan enormous result sets — a resource-consumption DoS vector, i.e. OWASP API4:2023 Unrestricted Resource Consumption. Enforcing caps and default limits is the mitigation.
    ref: "concepts.md#limits-defaults--guardrails"

  - id: pagination-filtering-and-sorting-046
    difficulty: intermediate
    tags: [standards, rfcs, misconception]
    question: |
      Which statement about standards and pagination is correct?
    options:
      - "RFC 9110 mandates cursor pagination for all collection endpoints"
      - "RFC 7807 was the final Problem Details spec and is still current"
      - "OpenAPI 3.1 defines a mandatory pagination envelope schema"
      - "No RFC mandates a pagination *style*; RFC 8288 standardizes the Link header + next/prev/first/last relations, and RFC 9457 standardizes the error body — the page/cursor mechanics themselves are convention"
    answer: 3
    explanation: |
      There is no RFC dictating offset vs cursor. RFC 8288 standardizes the Link header and its relation types; RFC 9457 (which obsoletes RFC 7807) standardizes the Problem Details error body. OpenAPI 3.1 lets you describe pagination params but mandates no envelope. The paging mechanics are convention.
    ref: "concepts.md#link-header-for-pagination-rfc-8288"

  - id: pagination-filtering-and-sorting-047
    difficulty: expert
    tags: [keyset, mixed-directions, seek-predicate]
    question: |
      A keyset query must page `ORDER BY price DESC, id ASC` after the last-seen row
      (`:last_price`, `:last_id`). Which WHERE clause is correct?
    options:
      - "WHERE (price, id) < (:last_price, :last_id)"
      - "WHERE price < :last_price OR (price = :last_price AND id > :last_id)"
      - "WHERE (price, id) > (:last_price, :last_id)"
      - "WHERE price < :last_price AND id > :last_id"
    answer: 1
    explanation: |
      A row-value tuple comparison `(price, id) < (?, ?)` only works when all keys share one direction; here price is DESC but id is ASC, so it is wrong. You must decompose per-column, flipping the operator on the descending key: `price < :last_price OR (price = :last_price AND id > :last_id)`. The plain AND form drops valid rows where price is strictly less but id is smaller.
    ref: "concepts.md#keyset-internals-mixed-sort-directions--row-value-comparison"

  - id: pagination-filtering-and-sorting-048
    difficulty: expert
    tags: [keyset, row-value, index-direction]
    question: |
      You rely on `WHERE (created_at, id) > (?, ?) ORDER BY created_at, id LIMIT 20`
      being an O(limit) index seek with no sort step. Which condition is REQUIRED for
      that to hold?
    options:
      - "A composite index whose column order AND per-column direction match the ORDER BY"
      - "A separate single-column index on created_at plus another independent single-column index on id"
      - "The entire table must fit inside the database buffer pool so the seek stays in memory"
      - "A COUNT(*) over the filtered set must be run first to prime the planner's row estimate"
    answer: 0
    explanation: |
      Row-value comparison is standard SQL:1999 and Postgres turns it into a true range scan, but only if a composite index matches both the column ORDER and each column's DIRECTION of the ORDER BY. Two independent single-column indexes cannot serve the composite seek without a sort; a mismatched-direction index forces an added sort step, breaking the O(limit) guarantee.
    ref: "concepts.md#keyset-internals-mixed-sort-directions--row-value-comparison"

  - id: pagination-filtering-and-sorting-049
    difficulty: advanced
    tags: [keyset, row-value, portability]
    question: |
      Why do many portable keyset implementations write the OR-decomposed predicate
      `a > ?a OR (a = ?a AND b > ?b)` even when both keys are ascending, instead of
      the tuple form `(a, b) > (?a, ?b)`?
    options:
      - "The tuple form is invalid SQL that no relational engine will parse or execute"
      - "The OR-decomposed form is always strictly faster than any equivalent index range scan"
      - "Older MySQL versions did not optimize row-value comparisons into an index range scan (improved in MySQL 8.0), so the OR form is more reliably indexable across engines"
      - "The tuple form silently ORs the two columns together instead of comparing the row values lexicographically"
    answer: 2
    explanation: |
      `(a, b) > (?, ?)` is standard and Postgres optimizes it well, but older MySQL materialized rather than index-optimized row-value comparisons, so the hand-written OR-decomposition is a portability hedge that engines reliably turn into an index range scan. The tuple form is valid SQL and does compare lexicographically, not column-wise OR.
    ref: "concepts.md#keyset-internals-mixed-sort-directions--row-value-comparison"

  - id: pagination-filtering-and-sorting-050
    difficulty: expert
    tags: [cursor, bidirectional, prev-page]
    question: |
      A newest-first feed uses `ORDER BY created_at DESC, id DESC` with
      `WHERE (created_at,id) < (:c,:id)` for the next page. To build the PREVIOUS
      page, what does the server do?
    options:
      - "Reuse the exact same next-page query but pass a negative limit to walk backward"
      - "Reverse the comparison to `>` and the ORDER BY to ASC, fetch limit rows, then reverse the returned rows before returning them so they still read newest-first"
      - "Recompute an absolute offset for the anchor row and switch that request to offset pagination"
      - "Return the unchanged next-page query result but serialize the JSON array in reverse byte order"
    answer: 1
    explanation: |
      Backward paging reverses BOTH the seek operator (`<` becomes `>`) and the ORDER BY direction, fetches `limit` rows just before the anchor, then re-reverses the result set in application code so the display order stays newest-first. Relay formalizes this as `last`/`before`. Offsets and negative limits are not involved.
    ref: "concepts.md#bidirectional-cursors-prevnext-and-load-newer"

  - id: pagination-filtering-and-sorting-051
    difficulty: advanced
    tags: [cursor, load-newer, feeds]
    question: |
      A social app supports pull-to-refresh ("load newer") on a newest-first feed
      that normally pages older via a forward cursor. How is "load newer" best
      implemented with keyset pagination?
    options:
      - "By running a COUNT(*) on each refresh to detect how many new rows have arrived"
      - "By clearing the client cache and refetching page 1 with offset=0 on every pull-to-refresh"
      - "By paging backward (prev direction) from the newest cursor the client already holds"
      - "By switching the whole feed from keyset to offset pagination whenever newer rows are requested"
    answer: 2
    explanation: |
      "Load newer" is just backward/prev paging anchored on the newest item the client already has: reverse the seek operator and ORDER BY to fetch rows with keys greater than that anchor, then re-reverse for display. No COUNT or offset reset is needed, which is the whole point of keyset feeds.
    ref: "concepts.md#bidirectional-cursors-prevnext-and-load-newer"

  - id: pagination-filtering-and-sorting-052
    difficulty: expert
    tags: [cursor, contents, reproducibility]
    question: |
      To guarantee that page N+1 of a cursor walk reproduces exactly the same query
      as page N, which set of information most completely belongs inside the opaque
      cursor token?
    options:
      - "Only the last-seen primary key, from which the full sort and filter can always be reconstructed"
      - "The caller's access token and role claims, so the next page can be authorized without a re-check"
      - "The last-seen sort-key tuple, the sort spec, the filter predicate, the direction, and a schema/version tag"
      - "The total row count and the current page number, from which the server derives the seek anchor"
    answer: 2
    explanation: |
      The cursor must carry the seek anchor (last-seen sort-key tuple), the sort spec and filter predicate (so the walk stays on the same ordered result set), the direction, and a version tag (so stale formats are rejected). A lone primary key can't reproduce a multi-key sort or the filter, and authorization must never live in a cursor.
    ref: "concepts.md#what-goes-inside-a-cursor-and-cursor-security"

  - id: pagination-filtering-and-sorting-053
    difficulty: expert
    tags: [cursor, security, aip-158]
    question: |
      Per Google AIP-158, which statement about opaque page tokens is correct?
    options:
      - "Base64 encoding is sufficient obfuscation to hide the token contents from a determined client"
      - "A page token may safely embed authorization claims so that a leaked token still grants only intended access"
      - "Base64 alone is not obfuscation; sign or encrypt if the contents must be protected, and tokens must never carry authorization — auth is re-checked every request"
      - "Tokens must be exactly 32 bytes long and be rotated on a strict hourly schedule"
    answer: 2
    explanation: |
      AIP-158 explicitly warns that base64 is encoding, not obfuscation — anyone can decode it — so use HMAC (integrity) or encryption (confidentiality) if contents must be protected. It also mandates that a token is not a capability: authorization is re-evaluated from the caller's identity on every request, so a leaked token must not grant extra access.
    ref: "concepts.md#what-goes-inside-a-cursor-and-cursor-security"

  - id: pagination-filtering-and-sorting-054
    difficulty: expert
    tags: [cursor, validation, status-codes]
    question: |
      A client hand-edits an opaque cursor and the HMAC signature no longer verifies.
      What is the correct response?
    options:
      - "404 Not Found, since the page addressed by that cursor no longer exists on the server"
      - "500 Internal Server Error, since the failed signature verification is an internal decoding fault"
      - "200 OK that silently restarts the walk from page 1 without signaling the tampered cursor"
      - "400 Bad Request with an RFC 9457 problem+json body and a distinct type URI for the invalid cursor"
    answer: 3
    explanation: |
      A tampered/undecodable/bad-signature cursor is a client input error: return 400 with an `application/problem+json` body (RFC 9457) and a distinct `type` so clients can distinguish it. It is not 404 (the collection exists), not 500 (not a server fault), and silently restarting at page 1 hides the bug and can duplicate data.
    ref: "concepts.md#cursor-validation--error-semantics"

  - id: pagination-filtering-and-sorting-055
    difficulty: expert
    tags: [cursor, sort-change, aip-158]
    question: |
      Midway through a cursor walk the client changes the `sort` param but reuses the
      old cursor (which encodes the previous sort). Per AIP-158's general rule, what
      should happen?
    options:
      - "Reject with 400 / INVALID_ARGUMENT — changing any request arg other than page_size across pages is invalid; the encoded sort mismatch is detectable"
      - "Silently re-sort all previously returned pages in place and re-issue them so the client's earlier results now reflect the newly requested order"
      - "Honor the new sort parameter and continue reading from the old cursor position, trusting the engine to reconcile the two orderings automatically"
      - "Return 304 Not Modified, since the underlying result set has not changed and only the client's requested ordering of it has been altered"
    answer: 0
    explanation: |
      AIP-158 says changing any argument other than page_size while paging is an INVALID_ARGUMENT error. Because the cursor encodes the original sort spec, the server detects the mismatch with the new `sort` param and returns 400. Continuing with the old anchor under a new order would skip and duplicate rows.
    ref: "concepts.md#cursor-validation--error-semantics"

  - id: pagination-filtering-and-sorting-056
    difficulty: advanced
    tags: [cursor, expiry, aip-158]
    question: |
      A DB-backed cursor (tied to a server-side snapshot) is presented three days
      later and has expired. How should this be treated?
    options:
      - "As an unrecoverable server fault — return 500 because a stale snapshot handle means internal paging state was lost and cannot be rebuilt"
      - "As a legitimate, expected condition — return 400 with a distinct 'cursor expired' problem type so the client restarts from the first page"
      - "As success — transparently rebuild the server-side snapshot from scratch and continue paging as though the original cursor were still valid"
      - "As 401 Unauthorized, since an expired paging cursor is treated exactly like an expired credential and forces the caller to re-authenticate"
    answer: 1
    explanation: |
      AIP-158 notes DB-backed tokens legitimately expire (it suggests roughly a 3-day lifetime). Expiry is not a fault: return 400 with a distinct problem `type` signaling expiry, so the client knows to restart from page 1 rather than blindly retry. It is not a 500 or a 401, and silently rebuilding state can produce inconsistent results.
    ref: "concepts.md#cursor-validation--error-semantics"

  - id: pagination-filtering-and-sorting-057
    difficulty: intermediate
    tags: [cursor, end-of-results, aip-158]
    question: |
      In an AIP-158-style API, how does the server signal that the client has reached
      the last page?
    options:
      - "By returning HTTP 204 No Content on the final page, dropping its remaining items since no further pages will follow"
      - "By returning an empty or absent next_page_token in the final response"
      - "By setting the total_size field to zero on the last page to indicate no additional results remain to be fetched"
      - "By returning a 404 Not Found the next time the client presents the most recently issued continuation token"
    answer: 1
    explanation: |
      The canonical end-of-collection signal is an empty (or absent) `next_page_token` in the response — the last page still returns its items with no continuation token. A 204 would drop the final items, and total_size/404 are not the termination contract.
    ref: "concepts.md#cursor-validation--error-semantics"

  - id: pagination-filtering-and-sorting-058
    difficulty: advanced
    tags: [total-count, estimation, postgres]
    question: |
      You want a fast approximate row count for a Postgres table without a full
      COUNT(*). Which technique fits?
    options:
      - "SELECT reltuples::bigint FROM pg_class WHERE relname = 'orders' (last-ANALYZE planner estimate, O(1))"
      - "SELECT COUNT(*) FROM orders WITH (NOLOCK) to skip lock acquisition and read the exact row total dirtily"
      - "Fetch every row of the table across the wire and tally the count in application code on the client side"
      - "Add an AFTER INSERT trigger that locks the table and increments a running total-rows counter on each write"
    answer: 0
    explanation: |
      `reltuples` in `pg_class` holds the planner's row estimate from the last ANALYZE/VACUUM and is read in O(1). For filtered sets, the estimated row count from `EXPLAIN` (without ANALYZE) gives the planner's estimate for the WHERE clause without executing. NOLOCK is a SQL Server hint, not Postgres, and still scans.
    ref: "concepts.md#estimating-total-counts"

  - id: pagination-filtering-and-sorting-059
    difficulty: expert
    tags: [total-count, elasticsearch, track-total-hits]
    question: |
      An Elasticsearch response shows `"total": {"value": 10000, "relation": "gte"}`
      for a query matching far more documents. Why?
    options:
      - "The index enforces a hard 10,000-document ceiling, so no query can ever match or store more documents than that in a single shard"
      - "track_total_hits defaults to 10000, so counting stops there and reports 'at least 10,000' rather than an exact total unless you set track_total_hits: true"
      - "The relation field is a known serialization bug and the value returned is in fact always the exact document total"
      - "The query hit its default timeout at exactly 10,000 milliseconds and reported however many matches it had counted so far"
    answer: 1
    explanation: |
      By default `track_total_hits` is 10000: ES stops the exact count once it reaches that many matches and reports `relation: gte` (at least 10,000). Setting `track_total_hits: true` forces the full, more expensive count. This count cap is distinct from the `max_result_window` offset cap.
    ref: "concepts.md#estimating-total-counts"

  - id: pagination-filtering-and-sorting-060
    difficulty: expert
    tags: [expansion, n-plus-one, performance]
    question: |
      After adding `?include=customer` to a 100-item list endpoint, latency jumped
      roughly 10×. What is the most likely cause and the right fix?
    options:
      - "The JSON serializer became the bottleneck once nested objects appeared; switch to a faster serialization library to restore latency"
      - "N+1 queries — one extra per-row lookup for the related resource; fix with batch/join loading (a single IN/JOIN or a per-request batcher) and cap expansion depth"
      - "The pagination Link header grew too large once expansion was enabled and now dominates response time; strip the header to recover"
      - "HTTP response compression was silently disabled by the include parameter; re-enable gzip on the endpoint to fix the regression"
    answer: 1
    explanation: |
      Expanding a relation per row fires 1 + N queries — the classic N+1 problem — so a 100-row page runs ~101 queries. The contract-level fix is batch/join loading (single IN(...) or JOIN, or DataLoader-style batching) plus caps on expansion depth/breadth and sparse fieldsets to limit cost. Serialization, headers, and gzip don't explain per-row query fan-out.
    ref: "concepts.md#field-expansion-sparse-fieldsets--the-n1-problem"

  - id: pagination-filtering-and-sorting-061
    difficulty: advanced
    tags: [sparse-fieldsets, cost-control]
    question: |
      What is the primary purpose of sparse fieldsets (`?fields=`, JSON:API
      `fields[type]`, OData `$select`) on a collection endpoint?
    options:
      - "To reorder the JSON keys into a deterministic alphabetical sequence so that response bodies hash identically across requests"
      - "To let the client request only the fields it needs, shrinking payload and potentially avoiding expensive columns/joins"
      - "To enforce a separate authentication and authorization check on each individual field named in the fields parameter"
      - "To guarantee the response becomes permanently cacheable so a CDN can serve the trimmed representation without ever revalidating"
    answer: 1
    explanation: |
      Sparse fieldsets let clients trim the returned attributes, reducing payload size and letting the server skip touching expensive columns or joins entirely — the main cost-control lever alongside bounded expansion. They are not about key ordering, auth, or caching lifetime.
    ref: "concepts.md#field-expansion-sparse-fieldsets--the-n1-problem"

  - id: pagination-filtering-and-sorting-062
    difficulty: expert
    tags: [graphql, relay, connections]
    question: |
      In the Relay Cursor Connections spec, where does the cursor live and what does
      PageInfo provide?
    options:
      - "A single shared cursor on the Connection root object; PageInfo exposes the total count of matching nodes across all pages"
      - "A cursor per Edge (edge.cursor); PageInfo holds hasNextPage, hasPreviousPage, startCursor, and endCursor"
      - "No cursors anywhere in the connection; PageInfo carries only the current numeric page index the client is viewing"
      - "A cursor attached to each node itself; PageInfo returns the raw SQL query string the server executed to build the page"
    answer: 1
    explanation: |
      Relay puts a cursor on every Edge (`edge.cursor`), so any node is a valid anchor, and exposes navigation state via PageInfo: hasNextPage, hasPreviousPage, startCursor, endCursor. There is no mandated total count, and the cursor is not on the node or the Connection root.
    ref: "concepts.md#graphql-relay-cursor-connections"

  - id: pagination-filtering-and-sorting-063
    difficulty: expert
    tags: [graphql, relay, slicing-algorithm]
    question: |
      In the Relay connection slicing algorithm, in what order are the arguments
      applied to the ordered set?
    options:
      - "first is applied to trim the leading edge, then last trims the trailing edge, then before/after bounds the range"
      - "before/after first, then first (drop from the end), then last (drop from the start)"
      - "last is applied first to keep the trailing rows, then after bounds the range, then first trims the leading edge"
      - "All four arguments are applied simultaneously and the resulting set is the intersection of every individual constraint"
    answer: 1
    explanation: |
      Relay applies `before`/`after` to the ordered set first to bound the range, then `first` keeps the leading N (dropping from the end), then `last` keeps the trailing N (dropping from the start). Using `first` and `last` together is discouraged precisely because of this two-sided trimming.
    ref: "concepts.md#graphql-relay-cursor-connections"

  - id: pagination-filtering-and-sorting-064
    difficulty: expert
    tags: [graphql, relay, backward-ordering]
    question: |
      A REST prev-page implementation reverses the ORDER BY and then re-reverses the
      returned rows. How does Relay differ in how it treats ordering for backward
      (last/before) queries?
    options:
      - "Relay flips the ORDER BY and then re-reverses the emitted edges, exactly mirroring the hand-rolled REST prev-page trick"
      - "Relay requires ordering to be IDENTICAL for forward and backward; it reverses only which end of the ordered set it slices from, not the displayed order"
      - "Relay forbids backward pagination entirely and supports only forward first/after traversal through a connection"
      - "Relay applies a random shuffle seed to backward (last/before) queries so their edge order differs from the forward walk"
    answer: 1
    explanation: |
      The Relay spec mandates that the connection's ordering be the same for forward and backward queries — you do not flip the result order the way a hand-rolled REST prev-page does. `last`/`before` change which end the slice is taken from, but the edges are still emitted in the connection's canonical order.
    ref: "concepts.md#graphql-relay-cursor-connections"

  - id: pagination-filtering-and-sorting-065
    difficulty: advanced
    tags: [caching, rfc9111, cache-key]
    question: |
      Why do opaque cursors and a large filter space tend to lower CDN/HTTP cache hit
      rates for collection endpoints?
    options:
      - "RFC 9111 forbids caching any response with a query string"
      - "Each distinct URL (including its query string) is a separate cache key, so every unique cursor/filter/sort combination becomes its own entry, fragmenting the cache"
      - "Cursors set Cache-Control: no-store automatically"
      - "CDNs cannot store responses larger than one page"
    answer: 1
    explanation: |
      Under RFC 9111 the cache key is the method plus full URI including query string, so every distinct cursor/filter/sort combination is a separate cache entry. Unique opaque cursors and a wide filter space therefore fragment the cache and lower hit rates. Caching query-string URLs is allowed, and cursors don't auto-set no-store.
    ref: "concepts.md#http-caching-of-paginated-responses-rfc-9111"

  - id: pagination-filtering-and-sorting-066
    difficulty: advanced
    tags: [caching, query-param-order, vary]
    question: |
      Which two practices most directly improve cache behavior for paginated
      collection responses?
    options:
      - "Canonicalize query-param order and set appropriate Cache-Control/ETag plus Vary on headers that change the body"
      - "Randomize the param order and disable ETag"
      - "Always use POST so responses are uncacheable"
      - "Return total_count in every response and omit Vary"
    answer: 0
    explanation: |
      Naive caches treat `?a=1&b=2` and `?b=2&a=1` as different keys, so canonicalizing param order raises hit rate; and correct `Cache-Control`/`ETag` validators plus `Vary` on body-affecting headers (Accept, Authorization) keep responses both cacheable and correct. Randomizing order or dropping validators hurts caching.
    ref: "concepts.md#http-caching-of-paginated-responses-rfc-9111"

  - id: pagination-filtering-and-sorting-067
    difficulty: expert
    tags: [post-search, url-length, 414]
    question: |
      A client needs to send a 12 KB JSON filter to a list endpoint and gets
      `414 URI Too Long` when putting it in the query string. What is the standard
      remedy, and what is the main cost?
    options:
      - "Split it into many GETs; there is no downside"
      - "Move the query into a request body via POST /resource/search (or _search); the main cost is losing default HTTP cacheability and bookmarkability"
      - "Base64 the filter into a single header; caching is unaffected"
      - "Return the whole collection and filter client-side"
    answer: 1
    explanation: |
      RFC 9110 defines no hard URL length limit but servers cap it and return 414; oversized filter DSLs move into a request body via POST /search or _search. The trade-off is that POST responses are not cacheable by default and the URL is no longer bookmarkable, plus it blurs the "POST = create" expectation.
    ref: "concepts.md#post-based-search-for-oversized-queries"

  - id: pagination-filtering-and-sorting-068
    difficulty: advanced
    tags: [post-search, get-vs-post, trade-offs]
    question: |
      Some APIs expose BOTH `GET /orders?...` and `POST /orders/search`. What is the
      principled reason to offer both?
    options:
      - "POST is always faster than GET"
      - "GET is cacheable/bookmarkable/idempotent for simple filters, while POST /search carries arbitrarily large structured queries that would exceed URL limits — at the cost of cacheability"
      - "GET cannot express filters at all"
      - "REST forbids querying with GET"
    answer: 1
    explanation: |
      GET keeps the safe, idempotent, cacheable, bookmarkable path for simple filters; POST /search handles complex/oversized query bodies that won't fit or aren't expressible in a URL, accepting the loss of default caching. Offering both matches each request shape to the right method rather than forcing one compromise.
    ref: "concepts.md#post-based-search-for-oversized-queries"

  - id: pagination-filtering-and-sorting-069
    difficulty: expert
    tags: [odata, filter, operators]
    question: |
      Which query correctly expresses "status equals 'open' AND amount greater than
      100" in OData 4.01 syntax?
    options:
      - "?$filter=status eq 'open' and amount gt 100"
      - "?$filter=status==open;amount=gt=100"
      - "?filter=status:open AND amount>100"
      - "?status[eq]=open&amount[gt]=100"
    answer: 0
    explanation: |
      OData 4.01 uses named operators: `eq ne gt ge lt le` with `and`/`or`/`not`, so `$filter=status eq 'open' and amount gt 100`. The second option is RSQL/FIQL syntax, and the others are ad-hoc/bracketed conventions from other schemes — not OData.
    ref: "concepts.md#standardized-query-vocabularies-odata-jsonapi-zalando"

  - id: pagination-filtering-and-sorting-070
    difficulty: advanced
    tags: [rsql, fiql, operators]
    question: |
      In RSQL/FIQL, which operators express "in a set" and "greater than or equal",
      and which characters mean AND / OR?
    options:
      - "=in= and =ge=, with ';' meaning AND and ',' meaning OR"
      - "IN() and >=, with '&&' meaning AND and '||' meaning OR"
      - "=has= and =gte=, with ',' meaning AND and ';' meaning OR"
      - "$in and $gte, with 'and'/'or' keywords"
    answer: 0
    explanation: |
      RSQL/FIQL's operator set includes `=in=`/`=out=` for set membership and `=gt=`/`=ge=`/`=lt=`/`=le=` for comparisons, with `;` = logical AND and `,` = logical OR. The Mongo-style `$in`/`$gte` and SQL-ish `IN()`/`>=` belong to other DSLs.
    ref: "concepts.md#standardized-query-vocabularies-odata-jsonapi-zalando"

  - id: pagination-filtering-and-sorting-071
    difficulty: advanced
    tags: [zalando, reserved-params, json-api]
    question: |
      Which set matches the Zalando guidelines' reserved query parameter vocabulary
      (#137)?
    options:
      - "q, fields, embed, offset, cursor, limit"
      - "search, columns, join, start, token, count"
      - "query, select, expand, from, page, max"
      - "$filter, $orderby, $top, $skip, $count"
    answer: 0
    explanation: |
      Zalando #137 reserves `q, fields, embed, offset, cursor, limit` as standard control params. The last option is OData's `$`-prefixed set; the others are plausible-sounding but not the recognized Zalando vocabulary interviewers expect.
    ref: "concepts.md#standardized-query-vocabularies-odata-jsonapi-zalando"

  - id: pagination-filtering-and-sorting-072
    difficulty: advanced
    tags: [server-driven, next-link, azure]
    question: |
      In server-driven pagination (Google next_page_token, Azure nextLink, OData
      $skiptoken), which behavior must clients be prepared for?
    options:
      - "The server always returns exactly the requested page_size on every response until it reaches the very last page of the collection"
      - "The server may return fewer items than requested — even mid-collection — and the client must keep following the continuation until it is absent/empty"
      - "The client must build each subsequent URL itself by incrementing a numeric offset it derives from the continuation token"
      - "The continuation token is guaranteed to be a monotonically increasing integer the client can compare or increment between pages"
    answer: 1
    explanation: |
      With server-driven paging the server decides boundaries and may hand back fewer items than requested at any point (AIP-158), so the client must treat the continuation (next_page_token/nextLink/$skiptoken) as opaque and keep following it until it's absent/empty — never build it or assume a full page each time.
    ref: "concepts.md#server-driven-vs-client-driven-pagination"

  - id: pagination-filtering-and-sorting-073
    difficulty: expert
    tags: [azure, next-link, api-version]
    question: |
      Per Microsoft's Azure REST guidelines, which pair of rules governs the
      `nextLink` used for server-driven paging?
    options:
      - "nextLink is the JSON literal null on every page except the last one, and omits the api-version parameter"
      - "nextLink is never null (it is simply absent on the last page) and it must carry the api-version query parameter"
      - "nextLink must be a server-relative path stripped of any query string, which the client resolves against the service base URL"
      - "nextLink must embed the caller's bearer token as a query parameter so the follow-up request needs no Authorization header"
    answer: 1
    explanation: |
      Azure requires that when present, `nextLink` is never the JSON literal null — it is simply absent on the final page — and that it carries `api-version` so following it doesn't drop the API version. Embedding auth tokens in the link would be a security anti-pattern (cursors/links carry position, not authz).
    ref: "concepts.md#server-driven-vs-client-driven-pagination"

  - id: pagination-filtering-and-sorting-074
    difficulty: expert
    tags: [null-ordering, keyset, correctness]
    question: |
      A keyset seek uses a sortable column that is nullable, and some rows have NULL
      in it. Why can this silently drop rows, and what fixes it?
    options:
      - "NULLs are internally stored as empty strings that always sort to the very end of the index, so the seek predicate matches them fine and no fix is needed"
      - "Comparisons against NULL yield UNKNOWN (not true), so those rows fail the >/< seek predicate; forbid NULLs in cursor columns or add explicit IS NULL handling"
      - "NULLs always sort before every non-null value, so each such row is emitted twice on consecutive keyset pages"
      - "The database transparently coerces NULL to a zero value before comparison, so the seek ordering stays correct"
    answer: 1
    explanation: |
      In SQL, `col > :x` where col is NULL evaluates to UNKNOWN, not true, so rows with NULL sort keys are excluded by the seek predicate and get skipped. The fix is to forbid NULLs in cursor/sort columns or to add explicit `col IS NULL` branches to the seek. NULLs are not silently coerced to 0 or empty string.
    ref: "concepts.md#null-ordering-semantics"

  - id: pagination-filtering-and-sorting-075
    difficulty: advanced
    tags: [null-ordering, engine-differences]
    question: |
      A query `ORDER BY score ASC` returns rows with NULL score in different
      positions on PostgreSQL versus MySQL. Why?
    options:
      - "PostgreSQL has a long-standing bug in its NULL comparison logic, whereas MySQL implements the SQL standard's mandated NULL sort position correctly"
      - "Default NULL ordering differs by engine — Postgres sorts NULLs as the largest value (last on ASC) while MySQL sorts them as smallest (first on ASC); make it explicit with NULLS FIRST/LAST or an equivalent expression"
      - "MySQL silently drops every row with a NULL sort key from the ORDER BY output, so the two engines return different row counts entirely"
      - "The SQL standard rigidly fixes NULL ordering to sort last, so any observed difference must be a JDBC/ODBC driver-level defect"
    answer: 1
    explanation: |
      The SQL standard leaves default NULL ordering to the implementation: Postgres/Oracle treat NULL as largest (NULLS LAST on ASC) while MySQL/SQLite treat it as smallest (NULLS FIRST on ASC). To get a consistent contract, specify `NULLS FIRST/LAST` (Postgres) or emulate with `ORDER BY col IS NULL, col` (MySQL). Neither engine is buggy.
    ref: "concepts.md#null-ordering-semantics"

  - id: pagination-filtering-and-sorting-076
    difficulty: expert
    tags: [sharded, distributed, scatter-gather]
    question: |
      You must paginate a result set spread across many shards. Why is offset
      catastrophic here, and what does a correct design use?
    options:
      - "Offset works fine across shards as long as the coordinator divides the requested offset evenly by the shard count before dispatching"
      - "Each shard must skip the FULL offset locally before the coordinator merges, so cost multiplies with depth AND fanout; use a merge-sorted keyset (e.g. search_after over a point-in-time) with the cursor encoding per-shard positions"
      - "Sharded stores fundamentally cannot be paginated, so callers must fetch each shard fully and merge everything on the client"
      - "Run one global COUNT(*) across all shards first, then derive a per-shard local offset from that total for each request"
    answer: 1
    explanation: |
      To honor a global OFFSET N, every shard must locally produce and discard up to N rows before the coordinator scatter-gather merges them, so deep-offset cost scales with both depth and shard count and coordinator memory. The scalable approach is a merge-sorted keyset seek (Elasticsearch search_after over a Point-in-Time) with a cursor that records each shard's last-seen position.
    ref: "concepts.md#keyset-internals-mixed-sort-directions--row-value-comparison"

  - id: pagination-filtering-and-sorting-077
    difficulty: expert
    tags: [consistency, snapshot, exactly-once]
    question: |
      A bounded ETL job must read a large, actively-written table exactly once within
      a single run, without a stable immutable key to keyset on. What is the most
      appropriate mechanism?
    options:
      - "Offset pagination configured with a very large page size so each batch sweeps up thousands of rows at once"
      - "A point-in-time / snapshot read (e.g. Elasticsearch search_after + PIT, or a Postgres REPEATABLE READ transaction) so the whole job sees one consistent snapshot"
      - "Repeatedly recompute COUNT(*) between batches and diff consecutive pages to detect and reconcile the rows that shifted"
      - "Raise the HTTP client timeout to several minutes and stream the entire table back in one unpaginated request"
    answer: 1
    explanation: |
      A snapshot/point-in-time read pins a consistent view for the duration of the job: Elasticsearch's search_after over a PIT, or a Postgres REPEATABLE READ transaction, so concurrent writes don't cause skips/duplicates. This works for a single bounded job but, unlike immutable-key keyset, doesn't span many independent HTTP requests.
    ref: "concepts.md#consistency-under-concurrent-insertsdeletes"

  - id: pagination-filtering-and-sorting-078
    difficulty: expert
    tags: [deep-paging, elasticsearch, max-result-window]
    question: |
      Elasticsearch rejects a request for `from=10000&size=20` with a
      `max_result_window` error. Why is this cap enforced and what replaces it?
    options:
      - "Because the JSON response layer cannot encode a numeric offset above 10,000 without precision loss; base64-encode the offset to work around it"
      - "Because from+size deep paging forces every shard to build and rank a from+size result list that the coordinator merges — memory/coordination cost grows with depth; use search_after (keyset) instead"
      - "Because the deep-paging window is a paid-tier feature gated by the license; upgrading the subscription lifts the 10,000 ceiling"
      - "Because the underlying Lucene segments have become corrupt at that depth; a full reindex restores deep pagination"
    answer: 1
    explanation: |
      With from+size, each shard must produce from+size top hits that the coordinating node merges and re-ranks, so memory and coordination cost climb with depth — hence the default `index.max_result_window` of 10,000. The scalable replacement is `search_after` (keyset), ideally over a Point-in-Time for consistency. It is not an encoding, license, or corruption issue.
    ref: "concepts.md#deep-paging-cost-of-offset"

  - id: pagination-filtering-and-sorting-079
    difficulty: expert
    tags: [consistency, limit-plus-one, duplicates]
    question: |
      Two consecutive `limit+1` cursor pages of a feed sorted on a mutable column
      still show the same row twice. What is the root cause?
    options:
      - "The limit+1 probe technique is inherently defective and must be rewritten as limit-1 to stop emitting the boundary row twice"
      - "The extra +1 row fetched by the has_more probe is unconditionally returned on both pages by design, so the overlap is expected"
      - "The row's mutable sort key changed between the two page fetches, moving it from behind the cursor to ahead of it so it reappears — the immutable-key requirement was violated"
      - "The cursor was transmitted as raw JSON instead of being base64-encoded, which corrupts the boundary comparison"
    answer: 2
    explanation: |
      `limit+1` is only a has_more probe and doesn't cause duplicates. The duplicate arises because the sort/cursor key is mutable: a row whose key changed between fetches can move across the cursor boundary and be seen twice (or skipped). Keyset requires an immutable, unique anchor key for exactly-once traversal.
    ref: "concepts.md#consistency-under-concurrent-insertsdeletes"

  - id: pagination-filtering-and-sorting-080
    difficulty: advanced
    tags: [jump-to-page, keyset, hybrid]
    question: |
      A product manager wants users to jump to an arbitrary page number AND wants
      O(1)-ish per-page cost on a huge table. What is the honest engineering answer?
    options:
      - "Pure keyset pagination delivers both arbitrary jump-to-page and O(1) per-page cost for free with no compromise"
      - "Pure offset pagination delivers both arbitrary jump-to-page and O(1) per-page cost for free with no compromise"
      - "You cannot have both cleanly; use a hybrid — keyset for next/prev plus approximate page estimation, or precompute/cache anchor keys at page boundaries — and accept the trade-off"
      - "Migrating to a different database engine removes the offset-versus-keyset constraint entirely and gives you both"
    answer: 2
    explanation: |
      Arbitrary jump-to-page needs offset-style addressing (O(depth) cost), while O(1) per-page needs keyset (which is next/prev only) — the two goals conflict. The pragmatic middle ground is a hybrid: keyset for sequential navigation plus approximate page estimation, or precomputing/caching the anchor key at each page boundary. No single scheme delivers both cleanly.
    ref: "concepts.md#offset-vs-cursor--trade-offs"

  - id: pagination-filtering-and-sorting-081
    difficulty: expert
    tags: [filtering, security, nosql-injection]
    question: |
      An API accepts a JSON filter like `{"role": {"$ne": null}}` and passes operator
      keys straight into a MongoDB-style query. What is the primary risk?
    options:
      - "Marginally slower JSON parsing, because the nested operator objects force the deserializer to walk a deeper document tree"
      - "NoSQL/operator injection — a client can inject operators like $ne, $gt, or $where to bypass intended predicates or run expensive/arbitrary evaluation; allowlist operators and fields and reject $where"
      - "The response loses HTTP cacheability, since operator-object filters force the server to emit Cache-Control: no-store on every reply"
      - "The pagination Link header comes back malformed, because the $-prefixed operator keys break the RFC 8288 relation serializer"
    answer: 1
    explanation: |
      Blindly trusting client-supplied operator keys enables NoSQL/operator injection: attackers inject `$ne`, `$gt`, or `$where` (arbitrary JS evaluation) to subvert the intended query or exhaust resources. The defense is an allowlist of permitted operators and fields, rejecting dangerous ones like `$where` — the query-DSL analog of SQL injection (related to OWASP API4/API8).
    ref: "concepts.md#filtering-conventions"

  - id: pagination-filtering-and-sorting-082
    difficulty: advanced
    tags: [filtering, redos, resource-exhaustion]
    question: |
      A `contains`/regex filter lets clients pass an arbitrary pattern that the
      server compiles into a regular expression. Which OWASP-relevant risk does this
      most directly introduce?
    options:
      - "Broken object level authorization (API1) — the regex lets a caller read another tenant's records by matching object identifiers they should not access"
      - "Unrestricted resource consumption (API4) via ReDoS — a crafted pattern causes catastrophic backtracking that pins CPU"
      - "Improper inventory management (API9) — the untracked regex filter endpoint becomes a shadow surface missing from the API catalog and documentation"
      - "Server-side request forgery (API7) — the compiled pattern is fetched from a client-controlled URL that the server then requests on its behalf"
    answer: 1
    explanation: |
      Accepting arbitrary regex/`contains` patterns exposes ReDoS: a maliciously crafted pattern triggers catastrophic backtracking that consumes CPU and stalls the service — a form of unrestricted resource consumption (OWASP API4:2023). Mitigate by disallowing raw regex, bounding pattern complexity, or using linear-time matchers/timeouts.
    ref: "concepts.md#filtering-conventions"

  - id: pagination-filtering-and-sorting-083
    difficulty: expert
    tags: [filtering, sorting, owasp-api3, hidden-columns]
    question: |
      Allowing clients to sort or filter on fields that exist in the table but are
      not returned in the response (e.g. an internal `risk_score` column) is unsafe
      primarily because:
    options:
      - "It slows down the ORDER BY clause, because sorting on an unreturned column forces the engine to materialize an extra sort buffer for data the client never sees"
      - "It can leak the values of hidden properties through ordering/matching behavior — an OWASP API3:2023 Broken Object Property Level Authorization exposure — even though the field is never shown"
      - "It violates RFC 8288, whose Web Linking rules forbid sorting a collection on any attribute absent from the serialized representation"
      - "It makes the opaque cursor token measurably longer, since the hidden column's value must be embedded in the encoded seek anchor"
    answer: 1
    explanation: |
      Even if a hidden column is never serialized, letting clients sort or filter on it leaks information: by observing result order or which rows match, an attacker can infer the hidden values (a binary-search-style oracle). That's OWASP API3:2023 Broken Object Property Level Authorization — sortable/filterable fields must be an allowlist restricted to properties the caller may access.
    ref: "concepts.md#filtering-conventions"

  - id: pagination-filtering-and-sorting-084
    difficulty: advanced
    tags: [link-header, iana, relations]
    question: |
      Which statement about the pagination link relation types is correct?
    options:
      - "next/prev/first/last are arbitrary free-form strings that each API author invents independently, so no two vendors can interoperate on them"
      - "next/prev/first/last are IANA-registered link relation types (per RFC 8288's registry), and cursor APIs commonly omit first/last while keeping next/prev"
      - "Only next is a standardized relation type; prev, first, and last remain proprietary extensions defined per vendor outside any registry"
      - "Link relation types may appear only inside the JSON response body as embedded links and are never permitted in the HTTP Link header itself"
    answer: 1
    explanation: |
      `next`, `prev`, `first`, and `last` are registered in the IANA Link Relations registry that RFC 8288 governs, so they're interoperable rather than ad-hoc. Cursor APIs frequently drop `first`/`last` (which need a total) while still returning `next`/`prev`. Link relations can appear in the Link header or in-body links.
    ref: "concepts.md#link-header-for-pagination-rfc-8288"
