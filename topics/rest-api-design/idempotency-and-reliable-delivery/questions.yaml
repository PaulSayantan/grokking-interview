topic: "Idempotency & Reliable Request Delivery"
domain: rest-api-design
topic_slug: idempotency-and-reliable-delivery
version: 1
questions:
  - id: idempotency-and-reliable-delivery-001
    difficulty: beginner
    tags: [definition, idempotency]
    question: |
      What does it mean for an HTTP operation to be idempotent?
    options:
      - "Making the request N times has the same effect on server state as making it once"
      - "The response body is returned byte-for-byte identical on every single call"
      - "The request is guaranteed never to change any server state whatsoever"
      - "The exact same HTTP status code is always returned on every call"
    answer: 0
    explanation: |
      Idempotency (RFC 9110 §9.2.2) is about the *effect* on server state:
      applying the request one or many times leaves the server in the same
      state. It does not require identical responses or status codes, and it
      does not forbid state changes.
    ref: "concepts.md#what-idempotency-means"

  - id: idempotency-and-reliable-delivery-002
    difficulty: beginner
    tags: [definition, delete]
    question: |
      A client sends `DELETE /orders/42` twice. The first returns `204 No
      Content`; the second returns `404 Not Found`. Is DELETE still idempotent?
    options:
      - "No — returning two different status codes across calls means it is not idempotent"
      - "Yes — the end state (order 42 does not exist) is the same regardless of repetition"
      - "No — the second call's 404 signals an error, which by definition breaks idempotency"
      - "Only if the server is configured to return 204 on both the first and second call"
    answer: 1
    explanation: |
      Idempotency is about effect on state, not the response. After one or two
      DELETEs, order 42 is gone — the same end state — so DELETE is idempotent.
      Different status codes (204 then 404) do not violate the property.
    ref: "concepts.md#what-idempotency-means"

  - id: idempotency-and-reliable-delivery-003
    difficulty: beginner
    tags: [why, retries]
    question: |
      Why does idempotency matter for API reliability?
    options:
      - "It lets a client safely retry a request whose response was lost, without causing a duplicate side effect"
      - "It makes every request measurably faster by caching the computed response server-side"
      - "It guarantees the underlying network will never drop a packet in transit"
      - "It removes the need to re-send authentication credentials on any retried request"
    answer: 0
    explanation: |
      The core value is fault tolerance: when a response is lost to a timeout or
      dropped connection, an idempotent request can be re-sent safely because
      repeating it does not multiply the side effect.
    ref: "concepts.md#what-idempotency-means"

  - id: idempotency-and-reliable-delivery-004
    difficulty: intermediate
    tags: [non-idempotent, example]
    question: |
      Which operation is NOT idempotent?
    options:
      - "PUT /users/5 that replaces the user record with the exact representation sent"
      - "POST /accounts/1/deposits that adds $100 to the balance each time it is processed"
      - "DELETE /orders/42 that removes the order and leaves it absent thereafter"
      - "GET /users/5 that reads and returns the current user representation"
    answer: 1
    explanation: |
      The deposit POST adds $100 on every processing, so two deliveries add
      $200 — the effect scales with the number of requests, which is the
      definition of non-idempotent. PUT, DELETE, and GET are all idempotent.
    ref: "concepts.md#what-idempotency-means"

  - id: idempotency-and-reliable-delivery-005
    difficulty: beginner
    tags: [safe-methods, definition]
    question: |
      According to RFC 9110, what does it mean for an HTTP method to be "safe"?
    options:
      - "It is essentially read-only and not expected to cause state changes"
      - "It transmits its payload exclusively over TLS-encrypted connections"
      - "It requires the client to present valid authentication credentials"
      - "It can be retried any number of times without duplicate effects"
    answer: 0
    explanation: |
      A safe method (RFC 9110 §9.2.1) is read-only in intent — the client does
      not request, and should not cause, a state change. Safety is unrelated to
      encryption or auth; retry-safety is idempotency, a distinct property.
    ref: "concepts.md#safe-methods-versus-idempotent-methods"

  - id: idempotency-and-reliable-delivery-006
    difficulty: intermediate
    tags: [safe-methods, idempotent, relationship]
    question: |
      Which statement correctly describes the relationship between "safe" and
      "idempotent" methods?
    options:
      - "Every idempotent method is also safe, so the two categories are identical in extent"
      - "The two terms are exact synonyms and are used interchangeably by RFC 9110"
      - "Every safe method is idempotent, but not every idempotent method is safe"
      - "A method can be classified as safe or as idempotent, but never as both at once"
    answer: 2
    explanation: |
      Safe methods are read-only, so they are trivially idempotent. But
      idempotent methods like PUT and DELETE change state, so they are not safe.
      Safe ⊂ idempotent, not the reverse.
    ref: "concepts.md#safe-methods-versus-idempotent-methods"

  - id: idempotency-and-reliable-delivery-007
    difficulty: beginner
    tags: [safe-methods, delete]
    question: |
      Is `DELETE` a safe method?
    options:
      - "Yes — it is counted among the four methods RFC 9110 designates as safe"
      - "Yes — any method that is idempotent is automatically also safe"
      - "Only when the target resource does not exist and nothing is actually removed"
      - "No — it is idempotent but not safe, because it changes state"
    answer: 3
    explanation: |
      DELETE destroys data, so it is definitely not safe (not read-only). It is,
      however, idempotent: deleting a resource once or several times leaves it
      gone. This is the classic "idempotent but not safe" case.
    ref: "concepts.md#safe-methods-versus-idempotent-methods"

  - id: idempotency-and-reliable-delivery-008
    difficulty: intermediate
    tags: [safe-methods, list]
    question: |
      Which set lists exactly the methods RFC 9110 designates as safe?
    options:
      - "GET, POST, PUT, DELETE"
      - "GET, HEAD, PUT, DELETE"
      - "GET, HEAD, POST, PATCH"
      - "GET, HEAD, OPTIONS, TRACE"
    answer: 3
    explanation: |
      RFC 9110 §9.2.1 lists GET, HEAD, OPTIONS, and TRACE as safe. PUT, DELETE,
      POST, and PATCH all have side effects and are not safe.
    ref: "concepts.md#safe-methods-versus-idempotent-methods"

  - id: idempotency-and-reliable-delivery-009
    difficulty: intermediate
    tags: [safe-methods, side-effects, anti-pattern]
    question: |
      Why is exposing a state change behind `GET /users/5/delete` dangerous?
    options:
      - "GET requests are processed more slowly than the equivalent DELETE requests"
      - "GET is advertised as safe, so crawlers, prefetchers, and caches may invoke it and trigger the deletion"
      - "GET requests are forbidden from carrying any request body under RFC 9110"
      - "The resulting URL exceeds the maximum length that most servers will accept"
    answer: 1
    explanation: |
      Because GET is safe, intermediaries treat it as side-effect-free and may
      prefetch or crawl the link — effectively "clicking" your delete. State
      changes must never hide behind a safe method.
    ref: "concepts.md#safe-methods-versus-idempotent-methods"

  - id: idempotency-and-reliable-delivery-010
    difficulty: beginner
    tags: [idempotent-methods, list]
    question: |
      Which method is NOT guaranteed idempotent by RFC 9110?
    options:
      - "PUT"
      - "POST"
      - "DELETE"
      - "GET"
    answer: 1
    explanation: |
      RFC 9110 §9.2.2 lists GET, HEAD, OPTIONS, TRACE, PUT, and DELETE as
      idempotent. POST is not — it typically creates a new subordinate resource
      on each processing.
    ref: "concepts.md#which-http-methods-are-idempotent-and-why"

  - id: idempotency-and-reliable-delivery-011
    difficulty: intermediate
    tags: [put, idempotent, why]
    question: |
      Why is `PUT` idempotent?
    options:
      - "Because a PUT request is not permitted to carry any request body at all"
      - "Because servers automatically fingerprint and deduplicate every PUT request they receive"
      - "Because PUT is a read-only method that never mutates the target resource"
      - "Because it means 'make the target resource equal to this representation', so repeating sets the same state"
    answer: 3
    explanation: |
      PUT semantics are full replacement: the target resource is set to the
      enclosed representation. Sending the same PUT again sets the same value —
      no cumulative effect — which is why it is idempotent.
    ref: "concepts.md#which-http-methods-are-idempotent-and-why"

  - id: idempotency-and-reliable-delivery-012
    difficulty: intermediate
    tags: [post, non-idempotent, why]
    question: |
      Why is `POST` generally NOT idempotent?
    options:
      - "POST means 'process this data per the resource's semantics', typically creating a new resource each time"
      - "POST responses can never be stored or served from any HTTP cache layer"
      - "POST is structurally unable to carry a request body of any kind"
      - "POST is classified as a safe, read-only method by RFC 9110"
    answer: 0
    explanation: |
      POST processes the enclosed data according to the target's own semantics —
      usually minting a new subordinate resource. Two deliveries of POST /orders
      create two orders, so the effect scales and it is not idempotent.
    ref: "concepts.md#which-http-methods-are-idempotent-and-why"

  - id: idempotency-and-reliable-delivery-013
    difficulty: advanced
    tags: [patch, idempotent, gotcha]
    question: |
      An interviewer asks whether `PATCH` is idempotent. What is the most
      accurate answer?
    options:
      - "Yes, always — RFC 9110 explicitly lists PATCH among its idempotent methods"
      - "No, never — the semantics of PATCH make it impossible to ever be idempotent"
      - "Not guaranteed — it depends on the patch document (absolute 'replace' is idempotent; relative append/increment is not)"
      - "Only when the request also carries an Idempotency-Key header alongside the patch"
    answer: 2
    explanation: |
      RFC 9110 does not list PATCH (RFC 5789) as idempotent. A patch can be
      idempotent (absolute replace) or not (array-append, numeric increment), so
      the correct answer is "not guaranteed — it depends on the operations."
    ref: "concepts.md#which-http-methods-are-idempotent-and-why"

  - id: idempotency-and-reliable-delivery-014
    difficulty: advanced
    tags: [idempotent-methods, server-behavior]
    question: |
      A developer writes a `PUT /users/5` handler that also appends a row to an
      audit log table on every call, and claims "PUT is idempotent so this is
      fine." What is the correct assessment?
    options:
      - "Correct — PUT is guaranteed idempotent by the spec no matter what side effects the handler adds"
      - "Wrong — PUT is never actually idempotent because it mutates the target resource"
      - "Correct — rows appended to an audit log table are never counted as server state"
      - "Idempotency is a promise about the method's defined semantics; a handler that accumulates state on each call violates it, breaking clients that rely on retry-safety"
    answer: 3
    explanation: |
      The spec defines PUT as idempotent, but that is a contract the server must
      preserve. A handler that appends to a log on each identical PUT makes the
      observable effect scale with calls, breaking the promise clients and
      proxies trust.
    ref: "concepts.md#which-http-methods-are-idempotent-and-why"

  - id: idempotency-and-reliable-delivery-015
    difficulty: beginner
    tags: [idempotency-key, header]
    question: |
      Which HTTP header is the de-facto standard (Stripe-style) for carrying a
      client-generated idempotency key?
    options:
      - "Idempotency-Key"
      - "X-Request-Id, the tracing correlation identifier"
      - "If-Match, carrying the resource's current ETag value"
      - "Cache-Control, with a no-duplicate directive"
    answer: 0
    explanation: |
      The Idempotency-Key request header is the widely deployed convention
      popularized by Stripe and specified in the IETF
      draft-ietf-httpapi-idempotency-key-header. If-Match is for conditional
      requests (concurrency), not idempotency dedup.
    ref: "concepts.md#making-post-idempotent-with-an-idempotency-key-header"

  - id: idempotency-and-reliable-delivery-016
    difficulty: beginner
    tags: [idempotency-key, client]
    question: |
      Who should generate the idempotency key, and what makes a good value?
    options:
      - "The server, assigning a sequential counter value per resource collection"
      - "The client, as a high-entropy random value such as a UUIDv4, reused across retries of the same operation"
      - "The load balancer, deriving one value per established TCP connection"
      - "The client, but generating a fresh unique value on every single attempt"
    answer: 1
    explanation: |
      The client generates the key (a UUIDv4 or similar random string) before
      the first attempt and reuses it for every retry of that same logical
      operation. A fresh key per attempt would defeat dedup entirely.
    ref: "concepts.md#making-post-idempotent-with-an-idempotency-key-header"

  - id: idempotency-and-reliable-delivery-017
    difficulty: intermediate
    tags: [idempotency-key, methods]
    question: |
      For which methods does an Idempotency-Key header make the most sense?
    options:
      - "GET and HEAD, the read-only retrieval methods"
      - "PUT and DELETE, since replacing or removing benefits most from a key"
      - "POST (and sometimes PATCH), because they are not already idempotent"
      - "OPTIONS and TRACE, the diagnostic and negotiation methods"
    answer: 2
    explanation: |
      Idempotency keys add value for non-idempotent, unsafe methods like POST
      and sometimes PATCH. GET/PUT/DELETE are already idempotent, so a key is
      redundant — Stripe explicitly ignores it on GET and DELETE.
    ref: "concepts.md#making-post-idempotent-with-an-idempotency-key-header"

  - id: idempotency-and-reliable-delivery-018
    difficulty: intermediate
    tags: [idempotency-key, placement]
    question: |
      Where should the idempotency key be placed in the request, and why?
    options:
      - "In a header, because it is delivery metadata orthogonal to the resource representation and lets middleware dedup without parsing the body"
      - "In the JSON body, so it is schema-validated alongside the rest of the payload"
      - "In the URL path segment, so it permanently becomes part of the resource's identity"
      - "In a cookie, so the browser transparently manages resending it on retries"
    answer: 0
    explanation: |
      The key is metadata about delivery, not part of the resource state, so it
      belongs in a header. That keeps it orthogonal to the body and lets a
      gateway or middleware layer handle dedup without parsing the payload.
    ref: "concepts.md#making-post-idempotent-with-an-idempotency-key-header"

  - id: idempotency-and-reliable-delivery-019
    difficulty: advanced
    tags: [idempotency-key, scoping]
    question: |
      Two different tenants happen to generate the same random Idempotency-Key
      string. How should a well-designed server prevent them from colliding?
    options:
      - "Reject any key that has ever been used before by any tenant across the entire system"
      - "Require every key to be globally coordinated through a central registry before use"
      - "Silently ignore the key for the second tenant and process the request without dedup"
      - "Scope stored keys per (endpoint + account/API-key), so identical strings from different tenants never collide"
    answer: 3
    explanation: |
      Keys should be scoped, typically by endpoint plus the authenticated
      account/API-key. That namespacing means two tenants reusing the same
      random string operate in separate keyspaces and cannot collide.
    ref: "concepts.md#making-post-idempotent-with-an-idempotency-key-header"

  - id: idempotency-and-reliable-delivery-020
    difficulty: intermediate
    tags: [server-dedup, stored-response]
    question: |
      In the server-side idempotency pattern, what does the server do when it
      receives a key it has already processed to completion?
    options:
      - "Re-executes the operation from scratch to be safe, then overwrites the stored response"
      - "Replays the stored response (status code, headers, body) without re-executing"
      - "Returns 400 Bad Request because the key has already been consumed and cannot be reused"
      - "Deletes the stored record and starts the whole operation over as if the key were brand new"
    answer: 1
    explanation: |
      For a completed key, the server skips execution and replays the stored
      outcome — status code, headers, and body — often tagged with a header like
      Idempotent-Replayed: true. This is what makes the retry safe.
    ref: "concepts.md#server-side-deduplication-and-stored-responses"

  - id: idempotency-and-reliable-delivery-021
    difficulty: intermediate
    tags: [server-dedup, failures]
    question: |
      Following the Stripe model, what should happen when the first request for
      an idempotency key results in a legitimate `500` after the operation began
      executing?
    options:
      - "The failed outcome is stored, so a retry with the same key replays the same 500 rather than re-executing"
      - "The 500 is discarded and the next retry with the same key executes the operation fresh"
      - "The server rewrites the stored outcome and returns a 200 OK on the very next replay"
      - "The key is permanently banned and any future request carrying it is rejected outright"
    answer: 0
    explanation: |
      Stripe stores the outcome whether it succeeded or failed, so retries
      replay the same result. This prevents a retry from re-charging a card.
      (The exception is failures that never began execution — validation and
      concurrency conflicts — which are not stored.)
    ref: "concepts.md#server-side-deduplication-and-stored-responses"

  - id: idempotency-and-reliable-delivery-022
    difficulty: advanced
    tags: [server-dedup, fingerprint, mismatch]
    question: |
      A client reuses the same Idempotency-Key but sends a DIFFERENT request
      body than the original. What is the recommended server behavior?
    options:
      - "Silently replay the original stored response, ignoring the fact the body differs"
      - "Compare a stored request fingerprint and reject the mismatch with a 4xx client error (e.g. 400 or 422)"
      - "Execute the new body under the same key and overwrite the previously stored result"
      - "Return 204 No Content and quietly discard the newly supplied request body"
    answer: 1
    explanation: |
      A robust server stores a hash of the request and detects when the same key
      arrives with different parameters — a client bug. Rejecting with a 4xx
      client error (Stripe returns 400 with an idempotency_error; 422 is another
      reasonable choice) prevents silently returning the wrong result or
      corrupting the intended dedup.
    ref: "concepts.md#server-side-deduplication-and-stored-responses"

  - id: idempotency-and-reliable-delivery-023
    difficulty: advanced
    tags: [server-dedup, storage, distributed]
    question: |
      Why is an in-memory map on a single application node a poor place to store
      idempotency keys in a horizontally scaled service?
    options:
      - "In-memory maps are too slow to look up a key within the request's latency budget"
      - "Idempotency keys must be encrypted at rest, and process memory cannot satisfy that requirement"
      - "It violates RFC 9110, which mandates that dedup state be held in a durable database"
      - "A retry may be routed to a different instance that has never seen the key, so it re-executes"
    answer: 3
    explanation: |
      Behind a load balancer, a retry can land on a different node. A per-node
      in-memory map means that node has no record of the key and executes again,
      causing a duplicate. A shared durable store (Redis/Postgres/DynamoDB) is
      required.
    ref: "concepts.md#server-side-deduplication-and-stored-responses"

  - id: idempotency-and-reliable-delivery-024
    difficulty: intermediate
    tags: [server-dedup, algorithm, in-progress]
    question: |
      In the standard dedup algorithm, what should the server return when a key
      is seen but the original request is still marked "in-progress"?
    options:
      - "200 OK with an empty body, letting the client assume the in-progress request already finished"
      - "201 Created immediately, reporting success even though the original request is still running"
      - "It should execute a second copy of the operation in parallel and race it to completion"
      - "A conflict response such as 409 (optionally with Retry-After) so the client backs off and retries"
    answer: 3
    explanation: |
      An in-progress key means a concurrent duplicate is executing. Returning
      409 Conflict (often with Retry-After) tells the client to back off; by the
      time it retries, the winner has stored a result to replay.
    ref: "concepts.md#server-side-deduplication-and-stored-responses"

  - id: idempotency-and-reliable-delivery-025
    difficulty: beginner
    tags: [ttl, window]
    question: |
      Why do idempotency implementations define a TTL (idempotency window) for
      stored keys?
    options:
      - "Because the dedup store would grow without bound if keys were kept forever"
      - "To comply with the mandatory 60-second key-retention limit that RFC 9110 imposes"
      - "To force clients to re-authenticate once the idempotency window has elapsed"
      - "Because keys are single-use tokens that the client discards after one successful call"
    answer: 0
    explanation: |
      Keys can't live forever or the dedup table grows unbounded. A TTL/window
      bounds storage. There is no RFC-mandated limit; the window is an
      implementation choice.
    ref: "concepts.md#idempotency-window-and-ttl"

  - id: idempotency-and-reliable-delivery-026
    difficulty: intermediate
    tags: [ttl, stripe]
    question: |
      Roughly how long does Stripe retain idempotency keys, and what happens to
      a key reused after that window?
    options:
      - "Forever; a reused key always replays the original stored response no matter how old it is"
      - "About 24 hours; after pruning, a reused key is treated as a brand-new request and executes again"
      - "Exactly 5 minutes; any reuse after that fixed window returns a 410 Gone error to the client"
      - "Until the account is closed; every reuse of the key is rejected as a duplicate submission"
    answer: 1
    explanation: |
      Stripe retains keys for at least ~24 hours, then may prune them. A key
      reused after pruning is treated as new and executes fresh — the
      idempotency guarantee is bounded by the window.
    ref: "concepts.md#idempotency-window-and-ttl"

  - id: idempotency-and-reliable-delivery-027
    difficulty: advanced
    tags: [ttl, gotcha, late-retry]
    question: |
      A message queue outage delays a retry for 48 hours before it reaches a
      server whose idempotency window is 24 hours. What is the risk?
    options:
      - "None — idempotency windows never expire, so the key is guaranteed to still be on file"
      - "The retry is automatically rejected with 429 because it arrived long after the first attempt"
      - "The server detects the late arrival and automatically extends the window to cover the retry"
      - "The key was purged, so the retry is treated as new and may double-execute the side effect"
    answer: 3
    explanation: |
      The window is a bounded guarantee. A retry arriving after the key was
      purged looks brand-new and can double-execute. The TTL must comfortably
      exceed the maximum realistic retry window to avoid this.
    ref: "concepts.md#idempotency-window-and-ttl"

  - id: idempotency-and-reliable-delivery-028
    difficulty: intermediate
    tags: [ttl, tradeoff]
    question: |
      Choosing the length of the idempotency window is primarily a trade-off
      between which two concerns?
    options:
      - "Storage cost versus how long client outages/retries can be tolerated safely"
      - "Request latency versus the maximum sustained throughput the endpoint can handle"
      - "The encryption strength of stored keys versus the CPU cost of computing them"
      - "Read consistency of the dedup store versus write consistency of the side effect"
    answer: 0
    explanation: |
      A longer window uses more storage but tolerates longer client outages and
      late retries; a shorter window is cheaper but narrows the protection
      window. It is a storage-cost vs. safety trade-off.
    ref: "concepts.md#idempotency-window-and-ttl"

  - id: idempotency-and-reliable-delivery-029
    difficulty: advanced
    tags: [race-condition, concurrency, toctou]
    question: |
      A naive server does `if not exists(key): execute(); store(key)`. Two
      requests with the same key arrive simultaneously. What goes wrong?
    options:
      - "Nothing — the second request always blocks and waits for the first one to finish storing"
      - "The server crashes because two writes to the same key violate a uniqueness invariant"
      - "Both may see the key as absent in the check and both execute, causing a duplicate side effect (a TOCTOU race)"
      - "The key is stored twice in the table but only one of the two requests actually executes"
    answer: 2
    explanation: |
      Check-then-act has a time-of-check-to-time-of-use race: both requests can
      pass the existence check before either stores the key, so both execute —
      exactly the duplicate you tried to prevent.
    ref: "concepts.md#race-conditions-on-concurrent-same-key-requests"

  - id: idempotency-and-reliable-delivery-030
    difficulty: advanced
    tags: [race-condition, atomic, locking]
    question: |
      What is the recommended way to serialize two concurrent requests carrying
      the same idempotency key?
    options:
      - "A read-then-write in application code guarded by an in-memory boolean flag per key"
      - "An atomic insert-if-absent using a database uniqueness guarantee (e.g. INSERT ... ON CONFLICT DO NOTHING, unique constraint, or Redis SET NX)"
      - "Sleeping for a random interval before executing so the two requests stagger themselves"
      - "Rejecting every request that carries a key so no two can ever run at the same time"
    answer: 1
    explanation: |
      The datastore's atomic insert-if-absent (unique constraint, ON CONFLICT,
      SET NX) reserves the key before any work. The DB's uniqueness guarantee —
      not application code — serializes the racers: winner executes, loser's
      insert fails.
    ref: "concepts.md#race-conditions-on-concurrent-same-key-requests"

  - id: idempotency-and-reliable-delivery-031
    difficulty: intermediate
    tags: [race-condition, status-code]
    question: |
      When an atomic key reservation fails because another request with the same
      key is already executing, what should the "loser" typically return?
    options:
      - "200 OK carrying the eventual result, after blocking until the winner finishes executing"
      - "500 Internal Server Error, since a losing reservation is treated as a server-side fault"
      - "409 Conflict (a concurrency conflict) so the client backs off and retries"
      - "301 Moved Permanently, redirecting the loser to a status endpoint for the in-flight request"
    answer: 2
    explanation: |
      The loser returns 409 Conflict (Stripe's behavior for concurrent same-key
      requests). Such conflicts are not stored and are safely retryable; by the
      retry, the winner has produced a result to replay.
    ref: "concepts.md#race-conditions-on-concurrent-same-key-requests"

  - id: idempotency-and-reliable-delivery-032
    difficulty: advanced
    tags: [race-condition, crash, in-progress-ttl]
    question: |
      A server crashes after reserving an idempotency key as "in-progress" but
      before storing a result. How do you avoid that key being stuck forever?
    options:
      - "Never reserve keys before executing, and only write them once the work has fully committed"
      - "Require a manual admin to periodically scan for and clear any keys stuck in-progress"
      - "Give in-progress records their own short TTL so a crashed request can be retried after it expires"
      - "Store the key only after success and simply accept the duplicate-execution race as unavoidable"
    answer: 2
    explanation: |
      In-progress reservations should carry a short expiry so a crash mid-flight
      doesn't leave the key locked forever. After the in-progress TTL lapses, a
      retry can re-acquire and execute.
    ref: "concepts.md#race-conditions-on-concurrent-same-key-requests"

  - id: idempotency-and-reliable-delivery-033
    difficulty: beginner
    tags: [retries, safe]
    question: |
      Which methods can generally be retried freely without an idempotency key?
    options:
      - "GET, PUT, and DELETE, because they are already idempotent"
      - "POST and PATCH, because they carry a body that the server can safely reprocess"
      - "Only POST, since it is the sole method a client is ever expected to retry"
      - "None — every retry of any method strictly requires an accompanying idempotency key"
    answer: 0
    explanation: |
      GET, PUT, and DELETE are idempotent, so retrying them does not multiply
      side effects. POST and PATCH should be retried only with an idempotency
      key, since they are not inherently idempotent.
    ref: "concepts.md#safe-client-retries-with-backoff"

  - id: idempotency-and-reliable-delivery-034
    difficulty: intermediate
    tags: [retries, backoff, jitter]
    question: |
      Why is random "jitter" added to exponential backoff in a retry strategy?
    options:
      - "To make logs harder to read by scattering retry timestamps into unpredictable intervals"
      - "To slow down every request by a fixed padding amount that improves cache hit rates"
      - "To spread retries out so many clients don't synchronize into a thundering herd that all retry at the same instant"
      - "Because RFC 9110 mandates a random jitter term on all conformant retry implementations"
    answer: 2
    explanation: |
      Without jitter, many clients that failed together will back off by the
      same schedule and retry simultaneously, re-overloading the server. Random
      jitter de-synchronizes them, smoothing the retry load.
    ref: "concepts.md#safe-client-retries-with-backoff"

  - id: idempotency-and-reliable-delivery-035
    difficulty: intermediate
    tags: [retries, status-codes]
    question: |
      Which response is a good candidate for an automatic client retry?
    options:
      - "400 Bad Request"
      - "422 Unprocessable Content"
      - "503 Service Unavailable"
      - "401 Unauthorized"
    answer: 2
    explanation: |
      503 (and 429, timeouts, connection errors) are transient and worth
      retrying with backoff. 4xx client errors like 400/422/401 will fail
      identically on retry, so retrying them is pointless.
    ref: "concepts.md#safe-client-retries-with-backoff"

  - id: idempotency-and-reliable-delivery-036
    difficulty: intermediate
    tags: [retries, retry-after]
    question: |
      A server responds `429 Too Many Requests` with a `Retry-After: 5` header.
      What should a well-behaved client do?
    options:
      - "Retry immediately in a tight loop, ignoring the header and racing to get in first"
      - "Give up permanently and surface the 429 to the user as an unrecoverable failure"
      - "Switch to a GET request, since safe methods are exempt from rate limiting"
      - "Wait at least 5 seconds (as the server indicated) before retrying"
    answer: 3
    explanation: |
      Retry-After tells the client exactly how long to wait. Honoring it (here,
      5 seconds) is the cooperative behavior; ignoring it and hammering the
      server worsens the overload that triggered the 429.
    ref: "concepts.md#safe-client-retries-with-backoff"

  - id: idempotency-and-reliable-delivery-037
    difficulty: advanced
    tags: [retries, idempotency-key, gotcha]
    question: |
      A client wraps a POST in a retry loop but generates a NEW Idempotency-Key
      on each attempt. What is the consequence?
    options:
      - "Dedup works perfectly, because the server matches the request body fingerprint and ignores the changing keys"
      - "The server rejects every attempt with a 409 Conflict, since it notices the idempotency key keeps changing"
      - "The server sees each attempt as a new operation and executes them all, defeating idempotency and causing duplicates"
      - "Only the final attempt actually runs, because the server discards the earlier keys and keeps just the newest"
    answer: 2
    explanation: |
      The key must be stable across retries of one logical operation. A fresh
      key per attempt makes every retry look new, so the server executes each
      one — the exact duplicate side effect the mechanism was meant to prevent.
    ref: "concepts.md#safe-client-retries-with-backoff"

  - id: idempotency-and-reliable-delivery-038
    difficulty: beginner
    tags: [at-least-once, delivery]
    question: |
      What does "at-least-once" delivery guarantee?
    options:
      - "A message arrives exactly one time, with the broker suppressing every retransmission so no duplicate ever reaches the receiver"
      - "A message may be silently lost under load but the protocol guarantees it is never delivered more than a single time"
      - "A message is delivered only while the receiver is online, and is permanently dropped if the receiver is unavailable"
      - "A message is guaranteed to arrive but possibly more than once (duplicates are possible)"
    answer: 3
    explanation: |
      At-least-once guarantees no message is lost, but the retry-until-acked
      mechanism can produce duplicates when an acknowledgement is lost. Handling
      those duplicates is the receiver's job.
    ref: "concepts.md#at-least-once-delivery-and-duplicate-handling"

  - id: idempotency-and-reliable-delivery-039
    difficulty: intermediate
    tags: [at-least-once, duplicates, why]
    question: |
      Why do duplicates arise even when the underlying work succeeded in an
      at-least-once system?
    options:
      - "The acknowledgement of success can be lost, so the sender re-sends even though the work already completed"
      - "The database engine always commits every write twice as part of its internal replication protocol"
      - "Clocks drift between servers, so the receiver processes the same timestamped message a second time"
      - "JSON payloads are not idempotent, so re-parsing the same body produces a second distinct record"
    answer: 0
    explanation: |
      The classic cause: the work succeeds but the ack is lost in transit. The
      sender, unable to confirm success, re-sends — producing a duplicate of an
      operation that already happened.
    ref: "concepts.md#at-least-once-delivery-and-duplicate-handling"

  - id: idempotency-and-reliable-delivery-040
    difficulty: intermediate
    tags: [at-least-once, idempotent-consumer, recipe]
    question: |
      What is the standard industry recipe for reliability given that duplicates
      are unavoidable?
    options:
      - "Use at-most-once delivery and accept the occasional silently dropped message as the cost of avoiding duplicates"
      - "Disable retries entirely so a message is delivered at most one time and duplicates can never be generated"
      - "Build for at-least-once delivery and make the consumer idempotent so duplicates have no effect"
      - "Require the network transport layer itself to negotiate a true exactly-once delivery guarantee end to end"
    answer: 2
    explanation: |
      Because any retrying system produces duplicates, the pragmatic approach is
      at-least-once delivery plus idempotent processing. You don't prevent
      duplicates from arriving; you prevent them from having an effect.
    ref: "concepts.md#at-least-once-delivery-and-duplicate-handling"

  - id: idempotency-and-reliable-delivery-041
    difficulty: advanced
    tags: [at-least-once, business-key, dedup]
    question: |
      Besides an Idempotency-Key header, what is another effective tool for
      turning at-least-once delivery into an at-most-once effect?
    options:
      - "Increasing the TCP window size so acknowledgements return faster and the sender stops retransmitting duplicates"
      - "Compressing the payload so identical messages collapse to the same bytes and the broker discards the repeats"
      - "Switching the wire format from JSON to XML, whose stricter schema validation rejects any duplicate document"
      - "A natural business key with a unique constraint (e.g. a unique order number) so duplicate inserts are rejected"
    answer: 3
    explanation: |
      A natural/business unique key (order number, transfer id) backed by a DB
      uniqueness constraint deduplicates at the data layer — a second insert of
      the same logical entity fails, giving an at-most-once effect.
    ref: "concepts.md#at-least-once-delivery-and-duplicate-handling"

  - id: idempotency-and-reliable-delivery-042
    difficulty: intermediate
    tags: [exactly-once, illusion]
    question: |
      An interviewer asks if you can guarantee exactly-once *delivery* over an
      unreliable network. What is the correct answer?
    options:
      - "Yes — TCP's ordered, acknowledged byte stream already guarantees each message is delivered exactly one time"
      - "No — exactly-once delivery is impossible; you achieve exactly-once *effect* via at-least-once delivery plus idempotent processing"
      - "Yes, as long as you disable retries so a message is transmitted only a single time and never re-sent"
      - "Only if both endpoints share a synchronized clock, which lets them agree on which message was already delivered"
    answer: 1
    explanation: |
      Exactly-once delivery is impossible because the sender can never be
      certain a message arrived (the ack can be lost). What systems provide is
      exactly-once *effect* (effectively-once) built on at-least-once transport
      plus idempotency and dedup.
    ref: "concepts.md#exactly-once-as-an-illusion"

  - id: idempotency-and-reliable-delivery-043
    difficulty: advanced
    tags: [exactly-once, two-generals]
    question: |
      Which classic problem explains why exactly-once delivery is impossible
      over an unreliable channel?
    options:
      - "The Dining Philosophers problem, which shows shared-resource contention makes reliable delivery impossible"
      - "The Byzantine Generals problem, which proves delivery is impossible unless at least 3f+1 honest nodes participate"
      - "The Two Generals problem — the sender can never be certain the message (or its ack) arrived"
      - "The CAP theorem, which states a lossy network can never provide both delivery and consistency at once"
    answer: 2
    explanation: |
      The Two Generals problem shows no finite protocol can guarantee both
      parties know a message was received over a lossy channel. The sender must
      choose between not re-sending (at-most-once) or re-sending
      (at-least-once).
    ref: "concepts.md#exactly-once-as-an-illusion"

  - id: idempotency-and-reliable-delivery-044
    difficulty: advanced
    tags: [exactly-once, effectively-once, mechanisms]
    question: |
      A messaging platform advertises "exactly-once processing." Which
      combination actually delivers that guarantee?
    options:
      - "A specialized transport layer that is engineered to never drop a single packet on the wire"
      - "At-most-once transport with retries disabled, so each message is transmitted only a single time"
      - "Disabling acknowledgements entirely, so the sender never learns of a loss and therefore never re-sends"
      - "At-least-once transport plus idempotent consumers/dedup, with the side effect committed atomically together with the consumer's offset/ack"
    answer: 3
    explanation: |
      Effectively-once is built by combining at-least-once delivery with
      idempotent processing/dedup and atomically committing the effect together
      with the offset/ack, so a message can't be marked done without its effect
      being durable (and vice versa).
    ref: "concepts.md#exactly-once-as-an-illusion"

  - id: idempotency-and-reliable-delivery-045
    difficulty: intermediate
    tags: [scenario, replay, status-code]
    question: |
      A payment created with `Idempotency-Key: abc` first returns `201 Created`.
      The client's connection dropped, so it retries with the same key and the
      server replays the stored result. Which statement is correct?
    options:
      - "The replay must return a different status code (such as 208 Already Reported) to signal to the client that it was a replay"
      - "Idempotency requires that no charge occur on a retry, so the replay must return a 402 Payment Required to the client"
      - "Exactly one charge exists; the replay returns the stored response (often flagged Idempotent-Replayed: true), and the status code need not differ from the original"
      - "A second charge is created, because reusing an already-consumed key forces the server to execute the payment again"
    answer: 2
    explanation: |
      The whole point is that only one charge exists. The server replays the
      stored response (commonly tagged Idempotent-Replayed: true). Idempotency
      is about the effect, so the status code can be the same 201 as the
      original.
    ref: "concepts.md#server-side-deduplication-and-stored-responses"

  - id: idempotency-and-reliable-delivery-046
    difficulty: advanced
    tags: [scenario, validation, not-stored]
    question: |
      A first request with a new idempotency key fails validation *before* the
      endpoint begins executing. Per the Stripe model, what is true of that key?
    options:
      - "The validation error is cached against that key, so every future request carrying it replays the same stored error"
      - "The key is permanently blocked and any later request that presents it is rejected as a reused-key violation"
      - "The result is not stored, so the key remains usable and the request can be retried after fixing the input"
      - "The server auto-corrects the invalid input to a valid form and then executes the operation under that key"
    answer: 2
    explanation: |
      Results are stored only after endpoint execution begins. Validation
      failures (and concurrency conflicts) never began execution, so they are
      not cached — the key stays usable and the corrected request can be
      retried.
    ref: "concepts.md#server-side-deduplication-and-stored-responses"

  - id: idempotency-and-reliable-delivery-047
    difficulty: beginner
    tags: [idempotency-key, standard-status]
    question: |
      What is the current standardization status of the `Idempotency-Key` HTTP
      header field?
    options:
      - "A fully ratified standards-track RFC that formally obsoletes and replaces the header rules in RFC 9110"
      - "A header field mandated by the OpenAPI 3.1 specification for every operation that mutates server state"
      - "An IETF Internet-Draft (draft-ietf-httpapi-idempotency-key-header) — a widely used convention, but not yet a published RFC"
      - "A standardized field defined by RFC 9457 (Problem Details) as part of its error-reporting header set"
    answer: 2
    explanation: |
      Idempotency-Key is an IETF Internet-Draft
      (draft-ietf-httpapi-idempotency-key-header) and a de-facto industry
      convention (Stripe et al.), but it is not yet a published RFC. RFC 9110 is
      HTTP Semantics; RFC 9457 is Problem Details.
    ref: "concepts.md#making-post-idempotent-with-an-idempotency-key-header"

  - id: idempotency-and-reliable-delivery-048
    difficulty: intermediate
    tags: [scenario, method-choice]
    question: |
      You are designing an endpoint to create a bank transfer. You want retries
      to be safe. Which design is best?
    options:
      - "GET /transfers?amount=100 so the response can be cached by intermediaries and freely retried at any time"
      - "POST /transfers with no idempotency key, relying on the client being coded to never retry a failed transfer"
      - "POST /transfers with a client-generated Idempotency-Key header, server-side dedup, and a bounded TTL"
      - "PATCH /transfers with a relative numeric-increment operation applied to the balance on each individual call"
    answer: 2
    explanation: |
      Creating a transfer is a non-idempotent POST; making it retry-safe means
      adding a client-generated Idempotency-Key with server-side dedup and a TTL.
      Hiding it behind GET (a safe method) or a relative PATCH increment are both
      wrong, and a keyless POST risks duplicate transfers.
    ref: "concepts.md#making-post-idempotent-with-an-idempotency-key-header"

  - id: idempotency-and-reliable-delivery-049
    difficulty: intermediate
    tags: [error-body, problem-details]
    question: |
      When rejecting a concurrent same-key request with `409 Conflict`, which
      media type is the standards-based choice for the error body?
    options:
      - "text/plain, carrying a short human-readable sentence describing the conflict"
      - "application/x-www-form-urlencoded, encoding the error fields as key=value pairs"
      - "application/octet-stream, returning the error as an opaque binary blob for the client to decode"
      - "application/problem+json (RFC 9457)"
    answer: 3
    explanation: |
      RFC 9457 (Problem Details) defines application/problem+json for
      machine-readable error bodies, which pairs well with a 409 (or 422)
      idempotency response so clients can programmatically interpret the
      conflict.
    ref: "concepts.md#race-conditions-on-concurrent-same-key-requests"

  - id: idempotency-and-reliable-delivery-050
    difficulty: advanced
    tags: [scenario, at-least-once, ordering]
    question: |
      A team says "our queue is at-least-once, but our consumer just overwrites
      state with PUT-style absolute writes, so duplicates are harmless." Is this
      reasoning sound?
    options:
      - "No — at-least-once delivery inevitably corrupts data no matter how the consumer is written, so it must be avoided"
      - "No — only an explicit Idempotency-Key header on each message can ever make a consumer's processing idempotent"
      - "Yes — an idempotent (absolute-write) consumer makes duplicate deliveries a no-op, which is exactly the at-least-once + idempotent-processing recipe"
      - "Yes, but only if the queue also guarantees strict global ordering so absolute writes are applied in sequence"
    answer: 2
    explanation: |
      Absolute/replace writes are idempotent: reapplying the same message sets
      the same state, so duplicates have no cumulative effect. Combining
      at-least-once delivery with an idempotent consumer is precisely the
      standard reliability recipe — an Idempotency-Key header is one way, not the
      only way.
    ref: "concepts.md#at-least-once-delivery-and-duplicate-handling"

  - id: idempotency-and-reliable-delivery-051
    difficulty: expert
    tags: [structured-fields, rfc8941, wire-syntax]
    question: |
      Per `draft-ietf-httpapi-idempotency-key-header-07`, what is the precise
      Structured Fields type of the `Idempotency-Key` value, and how does that
      affect the wire syntax?
    options:
      - "An RFC 8941 Item of type String, which must be double-quoted on the wire (e.g. Idempotency-Key: \"8e0397...\")"
      - "An RFC 8941 Token, which must be sent unquoted and folded to lowercase before it is compared"
      - "An RFC 8941 List of Integers separated by commas, one integer per retry attempt in the sequence"
      - "A raw opaque octet sequence with no type constraints, transmitted as Base64 with no quoting rules"
    answer: 0
    explanation: |
      The draft defines the field as an RFC 8941 Structured Field Item of type
      String. A String Item is serialized double-quoted, so the spec-correct
      form is a quoted value. RFC 8941 also restricts Strings to printable ASCII
      (no control or non-ASCII characters). Many servers still accept the bare
      Stripe-style token for compatibility, but that is not the spec-strict form.
    ref: "concepts.md#idempotency-key-wire-syntax-and-structured-fields"

  - id: idempotency-and-reliable-delivery-052
    difficulty: advanced
    tags: [structured-fields, compatibility]
    question: |
      A team migrates to a strict RFC 8941 parser for the `Idempotency-Key`
      header. Existing clients send `Idempotency-Key: 5f8d0e3a-2b1c-...`
      (unquoted). What is the most likely outcome?
    options:
      - "Nothing changes, because RFC 8941 treats an unquoted value and a double-quoted value as fully interchangeable"
      - "The strict parser rejects the unquoted value because a String Item must be double-quoted, breaking those clients unless a compatibility shim is kept"
      - "The parser silently coerces the unquoted value into a Token type, so deduplication continues to work unchanged"
      - "The values are still accepted but each one is stored twice under both forms, quietly doubling the dedup storage"
    answer: 1
    explanation: |
      An RFC 8941 String Item must be double-quoted. A strict parser sees a bare
      UUID as an invalid String (it would parse as a Token, a different type), so
      it rejects it. Migrations therefore need a compatibility layer that accepts
      the legacy unquoted form, or a coordinated client update.
    ref: "concepts.md#idempotency-key-wire-syntax-and-structured-fields"

  - id: idempotency-and-reliable-delivery-053
    difficulty: expert
    tags: [error-taxonomy, status-codes, draft]
    question: |
      Under the IETF draft's error taxonomy, a request arrives reusing a key that
      was already completed, but with a DIFFERENT request payload/fingerprint.
      Which status code does the draft specify?
    options:
      - "409 Conflict"
      - "400 Bad Request"
      - "422 Unprocessable Content"
      - "412 Precondition Failed"
    answer: 2
    explanation: |
      The draft standardizes on 422 Unprocessable Content (RFC 9110 §15.5.21) for
      a same-key/different-fingerprint request — the syntax is valid but it is
      semantically inconsistent with the recorded request. (Stripe historically
      returns 400 here; both are defensible, but the draft chooses 422.) 409 is
      reserved for the still-in-flight case.
    ref: "concepts.md#error-taxonomy-in-the-ietf-draft"

  - id: idempotency-and-reliable-delivery-054
    difficulty: advanced
    tags: [error-taxonomy, in-flight, status-codes]
    question: |
      Per the draft, which status code (and suggested title) applies when a
      required `Idempotency-Key` is present but a request with that key is still
      being processed?
    options:
      - "425 Too Early — \"An earlier request with this Idempotency-Key is still replaying\""
      - "409 Conflict — \"A request is outstanding for this Idempotency-Key\""
      - "429 Too Many Requests — \"An in-flight request already holds this Idempotency-Key\""
      - "202 Accepted — \"Still processing the original request for this Idempotency-Key\""
    answer: 1
    explanation: |
      The draft designates 409 Conflict with the title "A request is outstanding
      for this Idempotency-Key" for a concurrent in-flight duplicate. It does not
      use 425 (which is TLS early-data specific). 429 is about rate limiting, and
      202 would wrongly imply a fresh acceptance.
    ref: "concepts.md#error-taxonomy-in-the-ietf-draft"

  - id: idempotency-and-reliable-delivery-055
    difficulty: expert
    tags: [error-taxonomy, expiry, semantics]
    question: |
      Why does the IETF draft deliberately define NO dedicated error code for a
      key that is reused after its retention window has expired?
    options:
      - "Because the draft forbids reuse after expiry and requires rejecting the stale key with a 403 Forbidden carrying an idempotency_expired error"
      - "Because a purged key is indistinguishable from a never-seen key, so the safe behavior is to treat it as a brand-new request and re-execute"
      - "Because the draft mandates that idempotency keys be retained permanently, so a retention window can never expire on a conformant server"
      - "Because the draft requires clients to always generate a fresh key before retrying, so a server never actually receives a reused stale key"
    answer: 1
    explanation: |
      Once a key is purged, the server has no record to distinguish it from a
      first-time key, so the draft leaves it undefined and the sane behavior is to
      process it as new. This is precisely the "double-execute after TTL" danger
      window: a late retry arriving post-purge can produce a second side effect.
    ref: "concepts.md#error-taxonomy-in-the-ietf-draft"

  - id: idempotency-and-reliable-delivery-056
    difficulty: expert
    tags: [425, rfc8470, trap]
    question: |
      Is `425 Too Early` an appropriate status code for "a duplicate request with
      this idempotency key is still in flight"?
    options:
      - "Yes — RFC 8470 defines 425 as the canonical 'operation still processing, try again later' code for any in-flight duplicate request"
      - "No — RFC 8470 defines 425 specifically for refusing TLS 1.3 early-data (0-RTT) requests; the correct code here is 409 Conflict"
      - "Yes, but only over HTTP/2 connections, where 425 is repurposed to signal that a stream carrying a duplicate key is still open"
      - "No — the correct code is 412 Precondition Failed, because the still-in-flight duplicate fails the implicit precondition that the key be unused"
    answer: 1
    explanation: |
      425 Too Early (RFC 8470) means the server is unwilling to risk processing a
      request that arrived in replayable TLS 1.3 early data (0-RTT). It has
      nothing to do with an in-flight duplicate. The draft uses 409 Conflict for
      that; 429/503 + Retry-After are the back-off signals.
    ref: "concepts.md#the-425-too-early-trap"

  - id: idempotency-and-reliable-delivery-057
    difficulty: expert
    tags: [425, 0-rtt, idempotency-adjacent]
    question: |
      Why does TLS 1.3 0-RTT early data relate to idempotency at all, motivating
      the existence of `425 Too Early`?
    options:
      - "Early data is encrypted twice under the 0-RTT handshake, so the server must deduplicate the redundant second copy with an idempotency key"
      - "0-RTT data can be replayed by an attacker, so servers should only process it for safe/idempotent operations and can reject the rest with 425"
      - "425 forces the client to re-send the request over a full TLS handshake without any 0-RTT early data, which is why it ties into idempotency"
      - "Early data bypasses idempotency-key checks entirely, so any operation sent in 0-RTT is automatically treated as safe by the server"
    answer: 1
    explanation: |
      TLS 1.3 0-RTT trades a round trip for replayability: an attacker can capture
      and resend early data. A server should therefore restrict early-data
      processing to safe/idempotent handling and can return 425 to defer anything
      that would cause a non-idempotent side effect — the same replay concern that
      motivates idempotency keys.
    ref: "concepts.md#the-425-too-early-trap"

  - id: idempotency-and-reliable-delivery-058
    difficulty: expert
    tags: [fingerprint, strategies, tradeoff]
    question: |
      A payment API fingerprints requests by hashing the ENTIRE raw request body
      (SHA-256). Legitimate retries from an updated client SDK suddenly start
      getting 422 "Idempotency-Key is already used." What is the most likely
      cause?
    options:
      - "The updated SDK generates a brand-new random idempotency key on every retry attempt instead of reusing the original one"
      - "The SDK re-serializes the JSON differently (key ordering, whitespace, float formatting), changing the whole-body hash even though the intent is identical"
      - "SHA-256 hash collisions are occurring frequently enough that distinct payloads are mapping onto the same stored fingerprint"
      - "The server's clock has drifted forward past the retention TTL, so every stored key is expiring the instant after it is written"
    answer: 1
    explanation: |
      A whole-body checksum is the strictest fingerprint but the most fragile:
      any cosmetic re-serialization flips the hash, so the server sees a
      "different payload" and returns 422. Hashing canonicalized or selected
      semantic fields (or field-value matching) avoids these false mismatches.
    ref: "concepts.md#request-fingerprint-strategies"

  - id: idempotency-and-reliable-delivery-059
    difficulty: advanced
    tags: [fingerprint, strategies]
    question: |
      Which fingerprint strategy best tolerates cosmetic JSON re-serialization
      while still catching a genuinely different request?
    options:
      - "A SHA-256 checksum computed over the exact raw request bytes, including whitespace and key ordering"
      - "No fingerprint at all — simply trust the idempotency key and never compare the request payload against the stored one"
      - "Field-value matching (or a checksum of selected/canonicalized semantic fields) rather than a raw byte hash"
      - "Hashing only the HTTP request line (method plus target URI), ignoring the body that actually carries the request parameters"
    answer: 2
    explanation: |
      Comparing parsed field values (or hashing canonicalized/selected fields)
      makes {\"a\":1,\"b\":2} and {\"b\":2,\"a\":1} match while still detecting a
      real change (e.g. a different amount). A raw-byte checksum is brittle;
      hashing only the request line ignores the body entirely.
    ref: "concepts.md#request-fingerprint-strategies"

  - id: idempotency-and-reliable-delivery-060
    difficulty: expert
    tags: [security, bola, scoping]
    question: |
      An API stores idempotency responses keyed ONLY on the client-supplied
      string, in a global namespace. An attacker submits guessed low-entropy keys
      and receives other tenants' stored responses. Which vulnerability is this,
      and what is the fix?
    options:
      - "A rate-limiting flaw; fix by adding 429 throttling on the endpoint so the attacker cannot enumerate guessed keys quickly enough to succeed"
      - "Broken Object Level Authorization (OWASP API1:2023); fix with a composite lookup key of client key + authenticated principal so replay is scoped to the caller"
      - "A response-caching bug; fix by disabling all HTTP caching so stored idempotency responses are never served to a second caller"
      - "A TLS misconfiguration; fix by enabling HSTS so the stored responses can no longer be intercepted over a downgraded connection"
    answer: 1
    explanation: |
      Keying on the raw client string alone lets a guessed key fetch another
      tenant's stored response — a BOLA/IDOR data leak (OWASP API1:2023). The fix
      is a composite lookup key combining the client-supplied key with
      server-known authenticated attributes (account/tenant + endpoint), which
      both prevents cross-tenant collisions and scopes replay to the caller.
    ref: "concepts.md#security-considerations-for-idempotency-keys"

  - id: idempotency-and-reliable-delivery-061
    difficulty: advanced
    tags: [security, injection, validation]
    question: |
      The draft's Security Considerations warn against using an unvalidated
      idempotency key directly as a store/cache lookup key. What class of attack
      does this open, and what is the primary mitigation?
    options:
      - "SQL injection; mitigate by switching the dedup store from a relational database to a NoSQL engine that is immune to SQL syntax"
      - "Injection / store (cache) poisoning; mitigate by fixing and publishing a key format and always validating the key before using it as a lookup key"
      - "Cross-site scripting; mitigate with a Content-Security-Policy header that blocks the reflected key from executing in the browser"
      - "Clickjacking; mitigate with an X-Frame-Options: DENY header so the key-carrying request cannot be framed by an attacker"
    answer: 1
    explanation: |
      A crafted, unvalidated key used directly as a lookup can collide with or
      overwrite entries (store/cache poisoning — an injection attack). The
      mitigation is to define and publish a strict key format and validate the
      key before it is ever used as a lookup key.
    ref: "concepts.md#security-considerations-for-idempotency-keys"

  - id: idempotency-and-reliable-delivery-062
    difficulty: advanced
    tags: [security, scoping, granularity]
    question: |
      What is the correct default scope granularity for an idempotency key, and
      what breaks at each extreme?
    options:
      - "Global across all clients; scoping too narrowly is the only real risk and over-broad scoping causes no problem in practice"
      - "(Authenticated principal + endpoint); scoping too broadly (global) enables cross-tenant replay/leak, while over-scoping (e.g. including a timestamp) breaks legitimate retries that reuse the key"
      - "Per TCP connection; scoping by anything coarser than the connection breaks request multiplexing under HTTP/2 and HTTP/3"
      - "Per calendar day; bucketing keys by date is what guarantees an exactly-once effect indefinitely into the future"
    answer: 1
    explanation: |
      The right default is (auth principal + endpoint). Too broad (a global
      namespace) lets one tenant's key hit another's record — a leak. Too narrow
      (folding in a timestamp or attempt counter) means each retry looks unique,
      so dedup never fires and the mechanism is defeated.
    ref: "concepts.md#security-considerations-for-idempotency-keys"

  - id: idempotency-and-reliable-delivery-063
    difficulty: expert
    tags: [standards, azure, oasis, repeatability]
    question: |
      In the OASIS Repeatable Requests v1.0 model (used by Azure), which headers
      express a repeatable request and what does the spec require?
    options:
      - "The single Idempotency-Key request header on its own, which the OASIS spec mandates be retained for a fixed 24-hour window"
      - "Repeatability-Request-ID plus Repeatability-First-Sent on the request, Repeatability-Result on the response; window MUST be at least 5 minutes; unsupported endpoints return 501"
      - "The conditional-request pair If-Match plus If-Unmodified-Since, relying on ETag validation to detect and reject a repeated request"
      - "An X-Request-Id header paired with an X-Retry-Count header, which the OASIS model treats as repeatable with no minimum retention window"
    answer: 1
    explanation: |
      OASIS Repeatable Requests uses Repeatability-Request-ID (a unique id) and
      Repeatability-First-Sent (an HTTP-date of the first attempt) on the request,
      and Repeatability-Result: accepted|rejected on the response. The window must
      be at least 5 minutes, and an endpoint that does not support repeatability
      returns 501 Not Implemented.
    ref: "concepts.md#competing-and-adjacent-idempotency-standards"

  - id: idempotency-and-reliable-delivery-064
    difficulty: expert
    tags: [standards, google, aip-155, stale-replay]
    question: |
      Google's AIP-155 defines a `request_id` for idempotent requests. Which
      nuance distinguishes it from a strict byte-frozen replay?
    options:
      - "It requires the identifier to travel in an HTTP header named Idempotency-Key rather than as a field on the request message"
      - "It is placed on the request message (not a header), is a UUID4, and permits returning the CURRENT resource state if the original response can no longer be reproduced"
      - "It forbids any replay of a stored response and always re-executes the operation from scratch on every retry"
      - "It mandates true exactly-once delivery at the network layer, guaranteeing the request message reaches the server exactly one time"
    answer: 1
    explanation: |
      AIP-155 puts request_id (a UUID4) on the request message, requires it to
      guarantee idempotency, and — importantly — allows a replay to return the
      current resource state when the historical response is no longer
      reproducible. So a replay may reflect newer state rather than a frozen
      snapshot.
    ref: "concepts.md#competing-and-adjacent-idempotency-standards"

  - id: idempotency-and-reliable-delivery-065
    difficulty: advanced
    tags: [standards, zalando, business-key]
    question: |
      The Zalando REST guidelines address idempotent creation. What do they
      prefer over a generic `Idempotency-Key` header?
    options:
      - "A server-generated monotonic sequence number assigned per collection and returned to the client to replay on retries"
      - "A secondary / natural business key (a domain-unique value such as an order number) enforced by a unique constraint"
      - "The originating client's IP address, used as the deduplication key so repeated calls from one host collapse together"
      - "Disabling retries entirely at the client so a creation request is only ever transmitted a single time"
    answer: 1
    explanation: |
      Zalando's guidelines say an endpoint MAY support Idempotency-Key but SHOULD
      prefer deduplicating on a natural/business key — a domain-unique value like
      an order number backed by a unique constraint — which needs no separate key
      header and doubles as data-layer protection.
    ref: "concepts.md#competing-and-adjacent-idempotency-standards"

  - id: idempotency-and-reliable-delivery-066
    difficulty: expert
    tags: [put, client-id, no-store]
    question: |
      Which design makes resource CREATION idempotent WITHOUT any server-side
      dedup store, and what is its main trade-off?
    options:
      - "POST /resources with a server-generated id and no dedup store, which achieves idempotent creation with no trade-off whatsoever"
      - "PUT /resources/{client-generated-id} (client supplies a UUID); trade-off is the client owns id generation and the server loses control of its id space"
      - "GET /resources?create=true, relying on the safe method to make repeats harmless; the only trade-off is intermediary response caching"
      - "PATCH /resources with a relative increment operation; the sole trade-off is the extra latency of applying the delta on each call"
    answer: 1
    explanation: |
      Because PUT is idempotent, PUT /resources/{client-chosen-id} makes a retry a
      no-op create-or-replace with no dedup store needed. The cost is that the
      client generates the id, so the server cedes control of its id space and
      must guard against collisions or id-squatting across tenants.
    ref: "concepts.md#idempotent-creation-without-a-dedup-store"

  - id: idempotency-and-reliable-delivery-067
    difficulty: advanced
    tags: [reconciliation, read-back, timeout]
    question: |
      A client's keyless `POST /orders` times out with no response. Instead of
      blindly retrying, what reconciliation pattern lets it safely determine
      whether the order was created?
    options:
      - "Resend the same POST immediately with a much higher timeout, assuming the original simply did not have enough time to complete"
      - "GET the resource by a natural key (or a Location/status endpoint) to discover whether the first attempt succeeded before deciding to retry"
      - "Switch the method to DELETE first to clear any partial order, then re-issue the original POST to create it cleanly"
      - "Assume the request definitely failed and always recreate the order, accepting occasional duplicates as unavoidable"
    answer: 1
    explanation: |
      A read-back (GET by natural key or via a Location/status resource) lets the
      client discover the actual outcome of an ambiguous POST rather than risking
      a duplicate. This distinguishes "may have succeeded" (retry unsafe without a
      key) from a known failure.
    ref: "concepts.md#idempotent-creation-without-a-dedup-store"

  - id: idempotency-and-reliable-delivery-068
    difficulty: advanced
    tags: [retry-safety, ambiguity, error-types]
    question: |
      Why is a keyless `POST` that fails with "connection refused / DNS
      resolution failure" safe to retry, while a keyless `POST` that fails with a
      gateway TIMEOUT is not?
    options:
      - "A gateway timeout always signals that the request failed before any processing, so a timeout is exactly as safe to retry as a connection refusal"
      - "Connection-refused/DNS failures mean the request never reached the server (nothing happened), whereas a timeout is ambiguous — the request may have been processed, risking a duplicate"
      - "A DNS resolution failure silently corrupts the outgoing request payload, so simply retrying the POST repairs the mangled body"
      - "There is no meaningful difference between the two failures; a keyless POST should never be retried after either of them"
    answer: 1
    explanation: |
      With connection-refused or DNS failure you know the request never got to
      the server, so a retry cannot duplicate anything. A timeout is genuinely
      ambiguous — the server may have processed it and only the response was lost —
      which is exactly the case an idempotency key exists to make safe.
    ref: "concepts.md#idempotent-creation-without-a-dedup-store"

  - id: idempotency-and-reliable-delivery-069
    difficulty: expert
    tags: [async, 202, long-running]
    question: |
      For an asynchronous, long-running operation, how do an idempotency key and
      the operation (status-monitor) resource divide responsibility?
    options:
      - "The idempotency key protects the submission (a retried submit returns the same operation handle); the operation resource protects execution (the worker keys its side effect on the operation id so redelivery is a no-op)"
      - "The idempotency key protects the worker's execution side effect while the operation resource is what dedups the client's submission — the reverse of the actual division"
      - "Both mechanisms protect the same submission step, so one of the two is entirely redundant and can be dropped without losing any guarantee"
      - "Neither mechanism is needed, because returning 202 Accepted on submission by itself guarantees the job runs exactly once end to end"
    answer: 0
    explanation: |
      Submission returns 202 + a status monitor; the idempotency key dedups the
      submission so the work is enqueued once, while the operation resource lets
      the worker dedup its side effect on the operation id to survive
      at-least-once queue redelivery. Two layers, two jobs.
    ref: "concepts.md#idempotency-for-async-and-long-running-operations"

  - id: idempotency-and-reliable-delivery-070
    difficulty: advanced
    tags: [async, replay, state]
    question: |
      A client submits an async job with an idempotency key, gets `202 Accepted`
      + an `Operation-Location`, then retries the submission with the same key a
      minute later. Which response is most consistent with the async idempotency
      model?
    options:
      - "A fresh 202 Accepted with a new Operation-Location, enqueuing a second copy of the job to run alongside the first"
      - "The same operation handle, whose status may now legitimately reflect a newer state (e.g. pending → succeeded) rather than a byte-frozen 202"
      - "A 409 Conflict, because once an async job has been accepted its submission can never be retried under the same key"
      - "A 200 OK with an empty body, signalling that the duplicate submission was received but intentionally discarded"
    answer: 1
    explanation: |
      The key dedups the submission, so the retry returns the same operation
      handle — but a replay of an async operation may show the operation in a
      newer state (pending → succeeded), not a frozen snapshot. It must not enqueue
      a second job.
    ref: "concepts.md#idempotency-for-async-and-long-running-operations"

  - id: idempotency-and-reliable-delivery-071
    difficulty: expert
    tags: [gateway, service, dedup-placement]
    question: |
      For a payment endpoint that writes to a relational database, where should
      the AUTHORITATIVE idempotency dedup live, and why?
    options:
      - "At the API gateway/CDN edge, because it is centralized and language-agnostic and can therefore commit the key atomically with the charge"
      - "In the service, inside the same DB transaction as the side effect — because only there can the key record and the charge commit atomically; a gateway cannot join that transaction"
      - "In the client, because it is the party that generates the idempotency key and can suppress its own duplicate submissions before they leave"
      - "In the DNS layer, because it is globally distributed and every request already resolves through it before reaching the service"
    answer: 1
    explanation: |
      A gateway can shed obvious duplicate load but cannot join the service's DB
      transaction, so a crash between "edge recorded the key" and "service
      committed the charge" can still duplicate or lose work. The correctness
      boundary is in-service dedup bound into the same transaction as the side
      effect.
    ref: "concepts.md#where-to-put-deduplication-gateway-versus-service"

  - id: idempotency-and-reliable-delivery-072
    difficulty: advanced
    tags: [gateway, tradeoff]
    question: |
      What is the primary LIMITATION of doing idempotency dedup purely at an API
      gateway (e.g. a native gateway idempotency feature) for a transactional
      write?
    options:
      - "It is inherently slower than in-service dedup because every request must make an extra network hop to the gateway's dedup store"
      - "It cannot see business-transaction boundaries or join the service's database transaction, so it only dedups at the HTTP layer and cannot guarantee atomicity with the side effect"
      - "It requires the client to move the idempotency key out of the header and into the request body so the gateway can parse it"
      - "It only functions over HTTP/1.1 connections and silently stops deduplicating once the client negotiates HTTP/2"
    answer: 1
    explanation: |
      Gateway dedup is centralized and language-agnostic and usefully sheds
      duplicate load, but it operates at the HTTP layer with no visibility into
      the DB transaction. It cannot atomically bind the key to the side effect, so
      it is an optimization, not the correctness boundary.
    ref: "concepts.md#where-to-put-deduplication-gateway-versus-service"

  - id: idempotency-and-reliable-delivery-073
    difficulty: expert
    tags: [cross-store, atomicity, failure-modes]
    question: |
      A design stores the idempotency key in Redis (24h TTL) and performs the
      charge in Postgres. Walk through the interleavings: which failure modes are
      possible?
    options:
      - "None — a Redis SET and a Postgres COMMIT are enrolled in a single two-phase commit, so the key write and the charge always succeed or fail together"
      - "Both a double-charge (charge commits, Redis key write fails/crashes → retry re-charges) AND a lost charge (Redis key committed, Postgres charge rolled back → retry replays a 'success' for work that never happened)"
      - "Only a double-charge is possible: if the charge commits but the Redis write fails a retry re-charges — a lost charge cannot happen because Postgres always commits before Redis is touched"
      - "Only a lost charge is possible: if Redis records the key but the Postgres charge rolls back a retry replays a bogus success — a double-charge cannot happen because the key is always written first"
    answer: 1
    explanation: |
      Two independent stores cannot commit atomically, so some interleaving always
      breaks: if the charge commits but the key write fails, a retry double-charges;
      if the key commits but the charge rolls back, a retry replays a bogus success
      (lost work). The fix is co-locating key + effect in one transaction, or a
      transactional outbox.
    ref: "concepts.md#binding-dedup-to-the-business-transaction"

  - id: idempotency-and-reliable-delivery-074
    difficulty: expert
    tags: [transactional-outbox, atomicity, messaging]
    question: |
      When the side effect of an idempotent operation is publishing a MESSAGE to
      another system, which pattern preserves atomicity between the state change
      and the message?
    options:
      - "Publish the message to the broker first and, only once it is acknowledged, update the database — so the message is never emitted for a state change that failed to persist"
      - "Transactional outbox: write the state change AND an outbox row in one local DB transaction, then a relay publishes the message at-least-once to an idempotent consumer"
      - "Enroll the database and the message broker in an XA two-phase commit on every request, so the state write and the publish share one distributed transaction coordinator"
      - "Buffer the message in a Redis list after committing the state change and let a background worker drain the list on a timer to deliver it downstream"
    answer: 1
    explanation: |
      The outbox pattern writes the business state and an outbox record in a single
      local transaction, so they commit together; a relay then publishes the
      outbox rows at-least-once. Because the downstream consumer is idempotent, the
      end-to-end effect is exactly-once without a distributed transaction.
    ref: "concepts.md#binding-dedup-to-the-business-transaction"

  - id: idempotency-and-reliable-delivery-075
    difficulty: expert
    tags: [store, redis, durability]
    question: |
      A team uses Redis `SET key val NX PX 86400000` as the atomic reserve for
      money-movement idempotency keys. Which caveat most threatens correctness?
    options:
      - "SET NX is implemented as a separate GET followed by a SET, so two racing clients can both observe the key absent and reserve it — it cannot atomically claim keys"
      - "Default Redis persistence can lose recent writes on failover, and eviction under memory pressure can drop keys early — so a reserved key may vanish and allow a re-execution"
      - "Redis discards the PX expiry supplied to SET, so idempotency keys never expire and the keyspace grows without bound until it exhausts memory"
      - "Redis normalizes keys to lowercase before hashing them, so two idempotency keys differing only in case collide and one caller replays the other's stored response"
    answer: 1
    explanation: |
      SET NX is a fine atomic reserve, but Redis's default persistence can lose the
      most recent writes on failover and memory-pressure eviction can drop keys
      before their TTL. For money, that means a reserved/completed key could
      disappear and permit a duplicate — hence durable persistence, or a
      transactional relational store co-located with the side effect.
    ref: "concepts.md#distributed-dedup-store-trade-offs"

  - id: idempotency-and-reliable-delivery-076
    difficulty: advanced
    tags: [store, dynamodb, conditional-write]
    question: |
      Which DynamoDB feature provides the atomic "reserve the key only if unseen"
      primitive for idempotency dedup?
    options:
      - "A Scan of a global secondary index to check the key is absent, then a follow-up PutItem to reserve it if the scan returned no matching item"
      - "A conditional write with attribute_not_exists(pk) (plus a TTL attribute for expiry and optional strongly-consistent reads)"
      - "A plain unconditional PutItem followed by an eventually-consistent GetItem to confirm the key landed before the operation proceeds to execute"
      - "DynamoDB Streams triggering a Lambda that inspects each new item and deletes any duplicate key it observes shortly after the write occurs"
    answer: 1
    explanation: |
      DynamoDB's conditional write PutItem with a condition of
      attribute_not_exists(pk) fails if the key already exists, giving an atomic
      insert-if-absent. A TTL attribute auto-expires keys, and strongly-consistent
      reads are available when needed. Scans and eventually-consistent reads cannot
      serialize the race.
    ref: "concepts.md#distributed-dedup-store-trade-offs"

  - id: idempotency-and-reliable-delivery-077
    difficulty: expert
    tags: [store, relational, transaction]
    question: |
      Why do financial systems often favor a RELATIONAL store (unique constraint +
      INSERT ... ON CONFLICT) for idempotency keys over Redis or DynamoDB?
    options:
      - "Relational databases serve every idempotency-key lookup from an in-memory B-tree, making them consistently lower-latency than a Redis round trip for money movement"
      - "Because the idempotency-key row and the side-effect row can commit in ONE transaction, giving the strongest atomicity between the dedup record and the effect"
      - "Because relational stores expire idempotency rows automatically via MVCC vacuuming, so unlike Redis or DynamoDB they never require a TTL to bound key growth"
      - "Because a synchronous-replication SQL cluster is immune to network partitions, so a reserved key is guaranteed visible on every node the instant it commits"
    answer: 1
    explanation: |
      The decisive advantage is transactional co-location: the key insert and the
      side-effect insert can be in the same transaction, so they commit or roll
      back together. That eliminates the cross-store atomicity failure modes that
      plague a separate Redis/DynamoDB dedup store beside a relational side effect.
    ref: "concepts.md#distributed-dedup-store-trade-offs"

  - id: idempotency-and-reliable-delivery-078
    difficulty: expert
    tags: [retry-amplification, resilience]
    question: |
      A request traverses 3 nested service layers, each configured to retry up to
      3 times on failure. During an outage of the deepest tier, roughly how much
      load can retries impose on it, and what is the fix?
    options:
      - "3× total, because the layers share one retry attempt; fix by increasing each layer's per-request timeout so slow calls succeed rather than being retried"
      - "Up to 3^3 = 27× the base load (retry amplification); fix by retrying at only one layer (e.g. the edge) and letting inner layers fail fast"
      - "9× total, since 3 layers plus 3 retries add up; fix by adding more replicas to the deepest tier so it can absorb the extra retry traffic"
      - "No amplification occurs because each layer's retries are independent and cancel the request at the layer above, so the deepest tier still sees only the base load"
    answer: 1
    explanation: |
      Nested retries multiply: N layers each retrying 3× impose up to 3^N (here 27×)
      requests on the deepest tier — retry amplification that can turn a brownout
      into a full outage. The mitigation is to retry at a single layer and have
      inner layers fail fast rather than each retrying.
    ref: "concepts.md#retry-amplification-budgets-and-jitter-algorithms"

  - id: idempotency-and-reliable-delivery-079
    difficulty: expert
    tags: [jitter, algorithms, backoff]
    question: |
      In the AWS Builders' Library jitter taxonomy, which formula describes
      "full jitter"?
    options:
      - "sleep = base · 2^n (no randomness)"
      - "sleep = random(0, base · 2^n)"
      - "sleep = base · 2^n / 2 + random(0, base · 2^n / 2)"
      - "sleep = min(cap, random(base, prev · 3))"
    answer: 1
    explanation: |
      Full jitter picks a delay uniformly in [0, base·2^n], giving the best
      de-synchronization and is the recommended default. The third option is equal
      jitter (keeps a floor), and the fourth is decorrelated jitter (grows from the
      previous delay). The first is plain exponential backoff with no jitter.
    ref: "concepts.md#retry-amplification-budgets-and-jitter-algorithms"

  - id: idempotency-and-reliable-delivery-080
    difficulty: advanced
    tags: [retry-budget, circuit-breaker, resilience]
    question: |
      Beyond exponential backoff with jitter, which pair of techniques best
      prevents client retries from turning a partial outage into a full one?
    options:
      - "Raising every per-request timeout and increasing the retry count at each hop, so a struggling dependency is given more time and more attempts to eventually succeed"
      - "A retry budget (token bucket capping retries as a fraction of live traffic) plus a client-side circuit breaker that stops sending when failure rates spike"
      - "Rewriting all requests as GET so intermediaries can cache the responses and absorb the retry storm before it ever reaches the failing origin service"
      - "Disabling jitter so retry timing is perfectly predictable, letting operators forecast the exact load spike and pre-scale the dependency ahead of it"
    answer: 1
    explanation: |
      A retry budget caps retries as a proportion of real traffic so a broad
      failure cannot let retries dominate load, and a circuit breaker halts calls
      to a failing dependency until it recovers. Together they prevent retry-driven
      congestive collapse — the opposite of adding more retries or longer timeouts.
    ref: "concepts.md#retry-amplification-budgets-and-jitter-algorithms"
