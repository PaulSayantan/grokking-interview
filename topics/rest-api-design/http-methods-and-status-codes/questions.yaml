topic: "HTTP for APIs: Methods & Status Codes"
domain: rest-api-design
topic_slug: http-methods-and-status-codes
version: 1
questions:
  - id: http-methods-and-status-codes-001
    difficulty: beginner
    tags: [methods, semantics, rfc9110]
    question: |
      In HTTP, what determines the *semantics* of an operation (what to do),
      versus what the target of the operation is?
    options:
      - "The HTTP method determines the operation; the URI identifies the target resource"
      - "The request body determines the operation; the method identifies the target"
      - "The Content-Type header determines the operation; the method identifies the target"
      - "The status code determines the operation; the URI identifies the target"
    answer: 0
    explanation: |
      RFC 9110 defines the method as the primary source of an operation's
      semantics (retrieve, replace, delete, etc.), while the request URI names
      the resource being acted upon.
    ref: "concepts.md#http-method-semantics-per-rfc-9110"

  - id: http-methods-and-status-codes-002
    difficulty: beginner
    tags: [methods, get, body]
    question: |
      According to RFC 9110, what is the status of sending a request body with a GET?
    options:
      - "It is required for GET requests that filter data"
      - "It has no defined semantics; clients SHOULD NOT send one and servers may reject it"
      - "It is the standard way to pass search criteria"
      - "It is mandatory whenever the Accept header is present"
    answer: 1
    explanation: |
      A GET request body has no defined semantics in RFC 9110. Filtering should
      use query parameters, or a POST search endpoint if the criteria are large
      or sensitive.
    ref: "concepts.md#http-method-semantics-per-rfc-9110"

  - id: http-methods-and-status-codes-003
    difficulty: beginner
    tags: [methods, case-sensitivity]
    question: |
      Which statement about HTTP method names is correct?
    options:
      - "They are case-insensitive, so 'get' and 'GET' are equivalent"
      - "Only POST and PUT are case-sensitive"
      - "They are case-sensitive and conventionally uppercase (e.g. GET, POST)"
      - "They must always be lowercase per RFC 9110"
    answer: 2
    explanation: |
      HTTP method names are case-sensitive and, by convention and registry,
      uppercase. `get` is not the same token as `GET`.
    ref: "concepts.md#http-method-semantics-per-rfc-9110"

  - id: http-methods-and-status-codes-004
    difficulty: beginner
    tags: [safe, methods]
    question: |
      Which set of methods is considered "safe" (essentially read-only) in RFC 9110?
    options:
      - "GET, POST, PUT, DELETE"
      - "GET, HEAD, POST"
      - "GET, PUT, DELETE"
      - "GET, HEAD, OPTIONS, TRACE"
    answer: 3
    explanation: |
      Safe methods request no state change: GET, HEAD, OPTIONS, and TRACE.
      POST, PUT, PATCH, and DELETE all change server state and are not safe.
    ref: "concepts.md#safe-idempotent-and-cacheable-methods"

  - id: http-methods-and-status-codes-005
    difficulty: intermediate
    tags: [idempotent, methods]
    question: |
      Which group lists exactly the idempotent HTTP methods?
    options:
      - "PUT, PATCH, DELETE"
      - "GET, POST, PUT, PATCH"
      - "GET, HEAD, OPTIONS, TRACE, PUT, DELETE"
      - "GET, HEAD, POST, PUT"
    answer: 2
    explanation: |
      Idempotent methods: GET, HEAD, OPTIONS, TRACE, PUT, DELETE. POST and PATCH
      are not guaranteed idempotent.
    ref: "concepts.md#safe-idempotent-and-cacheable-methods"

  - id: http-methods-and-status-codes-006
    difficulty: intermediate
    tags: [idempotent, definition]
    question: |
      What does it mean for an HTTP method to be idempotent?
    options:
      - "It always returns the exact same response body every time"
      - "It can be cached by intermediaries"
      - "It never changes server state"
      - "The effect on server state of N identical requests is the same as making one"
    answer: 3
    explanation: |
      Idempotency is about the effect on server state: doing it once or many
      times leaves the same state. It is not about identical responses, and it
      does not imply the method is safe or cacheable.
    ref: "concepts.md#safe-idempotent-and-cacheable-methods"

  - id: http-methods-and-status-codes-007
    difficulty: intermediate
    tags: [safe, idempotent, relationship]
    question: |
      Which statement about the relationship between "safe" and "idempotent" is correct?
    options:
      - "All safe methods are idempotent, but not all idempotent methods are safe"
      - "All idempotent methods are safe"
      - "Safe and idempotent mean the same thing"
      - "A method can be safe without being idempotent"
    answer: 0
    explanation: |
      Every safe method is idempotent (no state change at all). But PUT and
      DELETE are idempotent yet not safe, since they change state.
    ref: "concepts.md#safe-idempotent-and-cacheable-methods"

  - id: http-methods-and-status-codes-008
    difficulty: intermediate
    tags: [cacheable, methods]
    question: |
      Responses to which methods are cacheable by default?
    options:
      - "GET, POST, and PUT"
      - "GET and HEAD"
      - "All methods"
      - "Only GET"
    answer: 1
    explanation: |
      GET and HEAD responses are cacheable by default. POST responses are
      cacheable only if explicitly marked with freshness info; PUT/PATCH/DELETE
      are not cacheable.
    ref: "concepts.md#safe-idempotent-and-cacheable-methods"

  - id: http-methods-and-status-codes-009
    difficulty: advanced
    tags: [patch, idempotent, gotcha]
    question: |
      Why is PATCH generally treated as NOT idempotent by HTTP infrastructure?
    options:
      - "Because PATCH is a safe method and safe methods are never idempotent"
      - "Because PATCH always creates a new resource"
      - "Because PATCH responses cannot be cached"
      - "Because a partial-change payload (e.g. a JSON Patch 'add' to an array or an increment) can alter state on each application"
    answer: 3
    explanation: |
      PATCH applies a set of changes; some operations (array add, increment)
      change state each time, so the method carries no idempotency guarantee.
      A full-document PATCH could be idempotent, but the method itself isn't.
    ref: "concepts.md#safe-idempotent-and-cacheable-methods"

  - id: http-methods-and-status-codes-010
    difficulty: intermediate
    tags: [delete, idempotent, gotcha]
    question: |
      A client sends DELETE /orders/9 twice: the first returns 204, the second
      returns 404. Is DELETE still idempotent?
    options:
      - "Yes, because the resulting server state (the order is gone) is the same either way"
      - "No, because the two responses differ"
      - "No, because 404 is an error"
      - "Only if the server returns 204 both times"
    answer: 0
    explanation: |
      Idempotency is about resulting server state, not the response code. After
      either call the resource is gone, so DELETE is idempotent despite the
      differing status codes.
    ref: "concepts.md#delete-semantics"

  - id: http-methods-and-status-codes-011
    difficulty: beginner
    tags: [head, methods]
    question: |
      How does a HEAD response differ from the corresponding GET response?
    options:
      - "HEAD returns a different set of headers than GET"
      - "HEAD returns the same headers but no message body"
      - "HEAD returns only the body, no headers"
      - "HEAD always returns 204 No Content"
    answer: 1
    explanation: |
      HEAD is identical to GET except the server must not return a message body.
      It returns the headers it would have sent for GET (e.g. ETag,
      Content-Length), which is useful for cheap existence/freshness checks.
    ref: "concepts.md#get-and-head"

  - id: http-methods-and-status-codes-012
    difficulty: intermediate
    tags: [head, use-case]
    question: |
      Which use case is HEAD best suited for?
    options:
      - "Creating a resource without a body"
      - "Submitting a large search query"
      - "Checking a resource's size or ETag without downloading its payload"
      - "Partially updating a resource"
    answer: 2
    explanation: |
      HEAD lets a client retrieve metadata (Content-Length, ETag,
      Last-Modified) to check existence or freshness cheaply, without
      transferring the body.
    ref: "concepts.md#get-and-head"

  - id: http-methods-and-status-codes-013
    difficulty: beginner
    tags: [post, creation]
    question: |
      When creating a new order where the server assigns the ID, why is POST to
      the collection preferred over PUT?
    options:
      - "Because the client doesn't yet know the resource URI, so PUT (which targets a known URI) doesn't fit"
      - "Because PUT cannot carry a request body"
      - "Because POST is idempotent and PUT is not"
      - "Because PUT is only for reads"
    answer: 0
    explanation: |
      PUT targets a specific known URI to replace/create at that location. When
      the server assigns the identifier, the client can't name the URI, so it
      POSTs to the collection and lets the server return the new location.
    ref: "concepts.md#post-for-creation-and-non-crud-actions"

  - id: http-methods-and-status-codes-014
    difficulty: intermediate
    tags: [post, actions]
    question: |
      An API needs to trigger a refund on order 123, which isn't a clean CRUD
      mutation. Which is the most idiomatic design?
    options:
      - "GET /orders/123/refund"
      - "POST /orders/123/refund (modeling the action as a resource you POST to)"
      - "PUT /orders/123?action=refund"
      - "DELETE /orders/123/charge"
    answer: 1
    explanation: |
      Non-CRUD actions are modeled as controller/action resources you POST to.
      GET would violate the safe-method contract; encoding actions in query
      strings on PUT/DELETE is less clear.
    ref: "concepts.md#post-for-creation-and-non-crud-actions"

  - id: http-methods-and-status-codes-015
    difficulty: intermediate
    tags: [post, idempotency]
    question: |
      Why do payment/order creation endpoints often require an Idempotency-Key header?
    options:
      - "Because RFC 9110 mandates it for all POST requests"
      - "Because POST responses cannot be cached without it"
      - "Because POST is not idempotent, so a client retry after a timeout could create duplicate resources"
      - "Because it makes POST a safe method"
    answer: 2
    explanation: |
      POST is neither safe nor idempotent, so an automatic retry could create
      two orders/charges. An Idempotency-Key lets the server dedupe retries and
      make the create effectively idempotent.
    ref: "concepts.md#post-for-creation-and-non-crud-actions"

  - id: http-methods-and-status-codes-016
    difficulty: intermediate
    tags: [put, patch, semantics]
    question: |
      What is the core semantic difference between PUT and PATCH?
    options:
      - "PUT is for reads; PATCH is for writes"
      - "PUT can only create; PATCH can only update"
      - "PUT is asynchronous; PATCH is synchronous"
      - "PUT replaces the entire resource with the enclosed representation; PATCH applies a partial modification"
    answer: 3
    explanation: |
      PUT sends the complete target representation and replaces the resource;
      PATCH sends a set of changes to apply partially.
    ref: "concepts.md#put-vs-patch-vs-post-for-updates-and-creates"

  - id: http-methods-and-status-codes-017
    difficulty: advanced
    tags: [put, semantics, gotcha]
    question: |
      Under strict PUT semantics, what should happen to a field that the client
      omits from the PUT body?
    options:
      - "It should be left unchanged (partial update)"
      - "The server must return 400"
      - "It should be removed/reset, because PUT replaces the entire resource"
      - "The server must merge it with the previous value"
    answer: 2
    explanation: |
      PUT is a full replacement: an omitted field means it's absent in the new
      representation and should be cleared. If you want to keep other fields,
      use PATCH.
    ref: "concepts.md#put-vs-patch-vs-post-for-updates-and-creates"

  - id: http-methods-and-status-codes-018
    difficulty: intermediate
    tags: [put, upsert, creation]
    question: |
      A client controls the identifier and sends PUT /users/alice for a user
      that does not yet exist. What is the correct behavior?
    options:
      - "Return 404, because PUT cannot create resources"
      - "Return 409 Conflict"
      - "Return 405, because only POST can create"
      - "The server MAY create the resource and return 201 Created"
    answer: 3
    explanation: |
      When the client controls the URI, PUT can create ("upsert"): the server
      may create the resource and return 201, or replace an existing one and
      return 200/204. This is why PUT-create is idempotent.
    ref: "concepts.md#put-vs-patch-vs-post-for-updates-and-creates"

  - id: http-methods-and-status-codes-019
    difficulty: advanced
    tags: [patch, media-type, rfc7386]
    question: |
      Which media type indicates a JSON Merge Patch body where a member set to
      `null` means "delete this field"?
    options:
      - "application/merge-patch+json"
      - "application/json-patch+json"
      - "application/patch+json"
      - "application/x-www-form-urlencoded"
    answer: 0
    explanation: |
      JSON Merge Patch (RFC 7386) uses application/merge-patch+json; setting a
      member to null deletes it. JSON Patch (RFC 6902) uses
      application/json-patch+json and an ordered array of operations.
    ref: "concepts.md#put-vs-patch-vs-post-for-updates-and-creates"

  - id: http-methods-and-status-codes-020
    difficulty: intermediate
    tags: [put, patch, decision]
    question: |
      You need an idempotent, retry-safe update that sends the full resource
      representation. Which method fits best?
    options:
      - "PATCH"
      - "PUT"
      - "POST"
      - "GET"
    answer: 1
    explanation: |
      A full-document replacement that is retry-safe is exactly PUT, which is
      idempotent. PATCH is not guaranteed idempotent; POST-create isn't either.
    ref: "concepts.md#put-vs-patch-vs-post-for-updates-and-creates"

  - id: http-methods-and-status-codes-021
    difficulty: beginner
    tags: [delete, status]
    question: |
      A synchronous DELETE succeeds and there is nothing to return in the body.
      Which status code is most appropriate?
    options:
      - "200 OK"
      - "404 Not Found"
      - "202 Accepted"
      - "204 No Content"
    answer: 3
    explanation: |
      204 No Content signals success with no body, the common choice for a
      completed DELETE. 200 with a body is fine if you return an outcome; 202 is
      for async deletion.
    ref: "concepts.md#delete-semantics"

  - id: http-methods-and-status-codes-022
    difficulty: intermediate
    tags: [delete, async, status]
    question: |
      A DELETE triggers a long-running background purge job rather than deleting
      immediately. Which status best communicates this?
    options:
      - "202 Accepted"
      - "200 OK"
      - "204 No Content"
      - "409 Conflict"
    answer: 0
    explanation: |
      202 Accepted means the request was accepted for asynchronous processing
      that isn't complete yet, which matches a queued/background deletion.
    ref: "concepts.md#delete-semantics"

  - id: http-methods-and-status-codes-023
    difficulty: intermediate
    tags: [options, allow]
    question: |
      What does a server typically return in response to an OPTIONS request to
      indicate which methods a resource supports?
    options:
      - "A Location header"
      - "An Allow header listing the supported methods"
      - "A WWW-Authenticate header"
      - "A Retry-After header"
    answer: 1
    explanation: |
      OPTIONS describes communication options; the server responds with an
      Allow header enumerating supported methods (e.g. GET, HEAD, PUT, OPTIONS).
    ref: "concepts.md#options-405-method-not-allowed-and-the-allow-header"

  - id: http-methods-and-status-codes-024
    difficulty: intermediate
    tags: [options, cors, preflight]
    question: |
      In a browser CORS "preflight," which HTTP method does the browser send
      before certain cross-origin requests?
    options:
      - "HEAD"
      - "TRACE"
      - "OPTIONS"
      - "CONNECT"
    answer: 2
    explanation: |
      The CORS preflight is an OPTIONS request carrying
      Access-Control-Request-Method; the server answers with
      Access-Control-Allow-* headers.
    ref: "concepts.md#options-405-method-not-allowed-and-the-allow-header"

  - id: http-methods-and-status-codes-025
    difficulty: intermediate
    tags: [405, allow, rfc9110]
    question: |
      When a server returns 405 Method Not Allowed, what does RFC 9110 require
      it to include?
    options:
      - "An Allow header listing the methods that ARE supported on the resource"
      - "A Retry-After header"
      - "A Location header"
      - "A WWW-Authenticate header"
    answer: 0
    explanation: |
      A 405 response must include an Allow header enumerating the methods that
      are permitted on that resource. Omitting it is a common spec violation.
    ref: "concepts.md#options-405-method-not-allowed-and-the-allow-header"

  - id: http-methods-and-status-codes-026
    difficulty: advanced
    tags: [405, 404, 501, distinction]
    question: |
      Which distinction among 404, 405, and 501 is correct?
    options:
      - "404 = method not allowed; 405 = server error; 501 = not found"
      - "404 = resource doesn't exist; 405 = resource exists but method not allowed on it; 501 = server doesn't support the method at all"
      - "They are interchangeable for unsupported methods"
      - "405 = resource doesn't exist; 404 = wrong method; 501 = rate limited"
    answer: 1
    explanation: |
      404 means no such resource; 405 means the resource exists but that method
      isn't supported on it (include Allow); 501 Not Implemented means the
      server doesn't support the method for any resource.
    ref: "concepts.md#options-405-method-not-allowed-and-the-allow-header"

  - id: http-methods-and-status-codes-027
    difficulty: beginner
    tags: [status-classes, families]
    question: |
      What does the first digit of an HTTP status code indicate?
    options:
      - "The HTTP version in use"
      - "The size of the response body"
      - "The general class of the response (informational, success, redirection, client error, server error)"
      - "Whether the response is cacheable"
    answer: 2
    explanation: |
      The leading digit groups codes into classes (1xx-5xx). Clients should be
      able to act on the class even if they don't recognize the specific code.
    ref: "concepts.md#status-code-families-2xx-to-5xx"

  - id: http-methods-and-status-codes-028
    difficulty: intermediate
    tags: [status-classes, 4xx, 5xx]
    question: |
      What is the fundamental difference between a 4xx and a 5xx status code?
    options:
      - "4xx means the server failed; 5xx means the client failed"
      - "There is no meaningful difference; both mean error"
      - "4xx codes are cacheable; 5xx codes are not"
      - "4xx means the client's request is wrong (retrying unchanged won't help); 5xx means the server failed on a valid request (retry may help)"
    answer: 3
    explanation: |
      4xx = client error (fix the request); 5xx = server error (the same request
      might succeed later). This split drives retry logic and alerting.
    ref: "concepts.md#status-code-families-2xx-to-5xx"

  - id: http-methods-and-status-codes-029
    difficulty: intermediate
    tags: [anti-pattern, status]
    question: |
      Why is returning 200 OK with an {"error": ...} body for failures
      considered an anti-pattern?
    options:
      - "It is faster than returning a real error code"
      - "RFC 9110 forbids any error body on a 200"
      - "It breaks caches, monitoring, and generic clients that trust the status line"
      - "It always causes the client to retry"
    answer: 2
    explanation: |
      "200-always" APIs defeat HTTP infrastructure: caches, error-rate
      monitoring, and generic client retry logic all rely on the status code
      class being accurate.
    ref: "concepts.md#status-code-families-2xx-to-5xx"

  - id: http-methods-and-status-codes-030
    difficulty: beginner
    tags: [201, location, creation]
    question: |
      A POST to /orders successfully creates an order synchronously. Which
      status code and header combination is correct?
    options:
      - "200 OK with a Retry-After header"
      - "204 No Content with a body describing the order"
      - "202 Accepted with an Allow header"
      - "201 Created with a Location header pointing to the new resource"
    answer: 3
    explanation: |
      201 Created signals a new resource was created, and RFC 9110 says to
      include a Location header with the new resource's URI (usually with the
      representation in the body).
    ref: "concepts.md#choosing-2xx-200-201-202-204-and-location"

  - id: http-methods-and-status-codes-031
    difficulty: intermediate
    tags: [201, 202, distinction]
    question: |
      What distinguishes 201 Created from 202 Accepted?
    options:
      - "201 = created and done now (resource exists at Location); 202 = accepted for async processing, may still fail"
      - "201 is for POST; 202 is for PUT"
      - "202 always includes a Location header; 201 never does"
      - "They are synonyms for successful creation"
    answer: 0
    explanation: |
      201 means the resource was created and exists now. 202 means the request
      was accepted for later processing that may still fail; often it returns a
      status resource to poll.
    ref: "concepts.md#choosing-2xx-200-201-202-204-and-location"

  - id: http-methods-and-status-codes-032
    difficulty: intermediate
    tags: [204, 200, distinction]
    question: |
      Which statement about 204 No Content is correct?
    options:
      - "It must include a JSON body describing the outcome"
      - "It signals success with no response body, so the client shouldn't try to parse one"
      - "It is a redirection code"
      - "It requires a Location header"
    answer: 1
    explanation: |
      204 means success with no body. A client should not attempt to read/parse
      a body. It's common for DELETE and for PUT/PATCH when no entity is echoed.
    ref: "concepts.md#choosing-2xx-200-201-202-204-and-location"

  - id: http-methods-and-status-codes-033
    difficulty: intermediate
    tags: [202, async, scenario]
    question: |
      A POST /video-transcode kicks off a background workflow that can still
      fail. The response returns a link to /operations/9f3. Which status is
      most appropriate?
    options:
      - "201 Created"
      - "200 OK"
      - "303 See Other"
      - "202 Accepted"
    answer: 3
    explanation: |
      Work accepted for asynchronous processing that isn't complete (and may
      fail) is 202 Accepted, typically with a link to a status/operation
      resource to poll.
    ref: "concepts.md#choosing-2xx-200-201-202-204-and-location"

  - id: http-methods-and-status-codes-034
    difficulty: advanced
    tags: [3xx, 307, 308, method-preservation]
    question: |
      Why were 307 Temporary Redirect and 308 Permanent Redirect introduced
      alongside 302 and 301?
    options:
      - "They guarantee the original method and body are preserved on the redirect, whereas clients historically changed POST to GET on 301/302"
      - "They allow caching of redirects, which 301/302 don't"
      - "They are only for HTTPS endpoints"
      - "They remove the need for a Location header"
    answer: 0
    explanation: |
      Historically clients would turn a redirected POST into a GET on 301/302.
      307/308 explicitly preserve the method and body, which matters for
      programmatic APIs redirecting non-GET requests.
    ref: "concepts.md#3xx-redirection"

  - id: http-methods-and-status-codes-035
    difficulty: intermediate
    tags: [3xx, 304, caching]
    question: |
      What does 304 Not Modified indicate in a conditional request?
    options:
      - "The resource was permanently moved"
      - "The client's cached copy is still fresh, so no body is returned and the client reuses its cache"
      - "The request was malformed"
      - "The server is temporarily unavailable"
    answer: 1
    explanation: |
      304 is the cache-validation success code: with If-None-Match/If-Modified-
      Since, it tells the client its cached representation is still valid, so no
      body is sent.
    ref: "concepts.md#3xx-redirection"

  - id: http-methods-and-status-codes-036
    difficulty: intermediate
    tags: [400, 422, validation]
    question: |
      Which scenario is the textbook case for 422 Unprocessable Content rather
      than 400 Bad Request?
    options:
      - "The request body is not valid JSON"
      - "A required query parameter is entirely missing"
      - "The JSON is well-formed but a field fails business validation, e.g. age = -5 or endDate before startDate"
      - "The Content-Type header is unsupported"
    answer: 2
    explanation: |
      422 is for syntactically valid requests that fail semantic validation.
      Malformed JSON, missing parameters, or unparseable input are 400.
    ref: "concepts.md#client-errors-part-1-400-vs-422"

  - id: http-methods-and-status-codes-037
    difficulty: intermediate
    tags: [400, parsing, gotcha]
    question: |
      A request arrives with a body that cannot be parsed as JSON at all. Which
      status is correct?
    options:
      - "400 Bad Request"
      - "422 Unprocessable Content"
      - "409 Conflict"
      - "500 Internal Server Error"
    answer: 0
    explanation: |
      If the body can't be parsed, it's a 400. 422 presumes the server
      understood the structure and only the values are invalid.
    ref: "concepts.md#client-errors-part-1-400-vs-422"

  - id: http-methods-and-status-codes-038
    difficulty: beginner
    tags: [401, 403, auth]
    question: |
      Which mnemonic correctly captures 401 vs 403?
    options:
      - "401 = 'I know who you are, and no'; 403 = 'who are you?'"
      - "401 = 'who are you?' (not authenticated); 403 = 'I know who you are, and no' (not authorized)"
      - "401 and 403 both mean the resource doesn't exist"
      - "401 = server error; 403 = client error"
    answer: 1
    explanation: |
      401 Unauthorized actually means unauthenticated (missing/invalid
      credentials). 403 Forbidden means authenticated but lacking permission.
    ref: "concepts.md#client-errors-part-2-401-vs-403"

  - id: http-methods-and-status-codes-039
    difficulty: intermediate
    tags: [401, www-authenticate, rfc9110]
    question: |
      Which header does RFC 9110 require on a 401 Unauthorized response?
    options:
      - "Allow"
      - "Retry-After"
      - "WWW-Authenticate"
      - "Location"
    answer: 2
    explanation: |
      A 401 must include a WWW-Authenticate header describing how the client can
      authenticate (e.g. the scheme and realm).
    ref: "concepts.md#client-errors-part-2-401-vs-403"

  - id: http-methods-and-status-codes-040
    difficulty: intermediate
    tags: [401, 403, scenario]
    question: |
      A user presents a valid token but for an account that is not an admin, and
      requests an admin-only endpoint. Which status is correct?
    options:
      - "401 Unauthorized"
      - "409 Conflict"
      - "400 Bad Request"
      - "403 Forbidden"
    answer: 3
    explanation: |
      The client is authenticated (valid token) but lacks permission, so 403
      Forbidden. Re-authenticating wouldn't help. 401 would imply missing/invalid
      credentials.
    ref: "concepts.md#client-errors-part-2-401-vs-403"

  - id: http-methods-and-status-codes-041
    difficulty: advanced
    tags: [403, 404, owasp, security]
    question: |
      Why might a security-conscious API deliberately return 404 instead of 403
      for objects a caller isn't allowed to access?
    options:
      - "Because 404 is faster to compute"
      - "Because RFC 9110 forbids 403 for existing resources"
      - "To avoid leaking which resources exist to unauthorized users (preventing enumeration / BOLA)"
      - "Because 404 automatically logs the attempt"
    answer: 2
    explanation: |
      Returning 403 confirms a resource exists. To prevent attackers
      distinguishing "exists but forbidden" from "doesn't exist" (a BOLA/
      enumeration concern), some APIs return 404 — an intentional trade-off.
    ref: "concepts.md#client-errors-part-2-401-vs-403"

  - id: http-methods-and-status-codes-042
    difficulty: intermediate
    tags: [409, conflict, concurrency]
    question: |
      Two clients edit the same record concurrently and the second write is
      based on a stale ETag. Which status best communicates the clash?
    options:
      - "400 Bad Request"
      - "422 Unprocessable Content"
      - "404 Not Found"
      - "409 Conflict (or 412 Precondition Failed with If-Match)"
    answer: 3
    explanation: |
      A conflict with the resource's current state is 409 Conflict; with
      optimistic concurrency via If-Match/ETag it's often expressed as 412
      Precondition Failed.
    ref: "concepts.md#client-errors-part-3-404-vs-409-and-429"

  - id: http-methods-and-status-codes-043
    difficulty: intermediate
    tags: [409, 404, distinction]
    question: |
      Which pairing of scenario to status code is correct?
    options:
      - "Creating a resource whose unique key already exists -> 409 Conflict; requesting a URI with no resource -> 404 Not Found"
      - "Creating a resource whose unique key already exists -> 404 Not Found"
      - "Requesting a URI with no resource -> 409 Conflict"
      - "Cancelling an already-shipped order -> 404 Not Found"
    answer: 0
    explanation: |
      A duplicate unique key or illegal state transition conflicts with current
      state (409). A missing resource is 404.
    ref: "concepts.md#client-errors-part-3-404-vs-409-and-429"

  - id: http-methods-and-status-codes-044
    difficulty: intermediate
    tags: [429, rate-limiting, retry-after]
    question: |
      A client exceeds its rate limit. Which status code and header should the
      API return to guide the client?
    options:
      - "503 Service Unavailable with Allow"
      - "429 Too Many Requests with Retry-After"
      - "403 Forbidden with WWW-Authenticate"
      - "409 Conflict with Location"
    answer: 1
    explanation: |
      429 Too Many Requests (RFC 6585) signals throttling; the response should
      include Retry-After telling the client when to try again.
    ref: "concepts.md#client-errors-part-3-404-vs-409-and-429"

  - id: http-methods-and-status-codes-045
    difficulty: advanced
    tags: [429, 503, distinction]
    question: |
      Both 429 and 503 can carry a Retry-After header. What distinguishes them?
    options:
      - "429 is a server error; 503 is a client error"
      - "They are interchangeable"
      - "429 is permanent; 503 is temporary"
      - "429 is a per-client quota (client error, 4xx); 503 is a server-side condition like overload/maintenance (server error, 5xx)"
    answer: 3
    explanation: |
      429 is a 4xx: this specific client sent too many requests. 503 is a 5xx:
      the server itself is temporarily unavailable (overloaded/maintenance),
      independent of any one client.
    ref: "concepts.md#client-errors-part-3-404-vs-409-and-429"

  - id: http-methods-and-status-codes-046
    difficulty: intermediate
    tags: [500, 503, distinction]
    question: |
      What is the difference between 500 Internal Server Error and 503 Service
      Unavailable?
    options:
      - "500 is a generic unexpected failure (e.g. unhandled exception); 503 is temporary unavailability (overload/maintenance) and is retry-worthy with Retry-After"
      - "500 is a transient overload; 503 is a permanent bug"
      - "500 means the upstream timed out; 503 means the upstream returned garbage"
      - "500 is a client error; 503 is a server error"
    answer: 0
    explanation: |
      500 is a generic, unexpected server bug. 503 means the server is
      temporarily unable to serve (overload/maintenance) and is transient —
      include Retry-After; it's the most retry-worthy along with 504.
    ref: "concepts.md#server-errors-500-vs-502-503-504"

  - id: http-methods-and-status-codes-047
    difficulty: advanced
    tags: [502, 504, gateway]
    question: |
      An API gateway forwards a request to an upstream service, but the upstream
      never responds within the timeout. Which status should the gateway return?
    options:
      - "502 Bad Gateway"
      - "504 Gateway Timeout"
      - "500 Internal Server Error"
      - "503 Service Unavailable"
    answer: 1
    explanation: |
      504 Gateway Timeout means the gateway/proxy did not get a timely response
      from the upstream. 502 is for an invalid upstream response, not a timeout.
    ref: "concepts.md#server-errors-500-vs-502-503-504"

  - id: http-methods-and-status-codes-048
    difficulty: advanced
    tags: [502, gateway, scenario]
    question: |
      A reverse proxy reaches the backend, but the backend crashes mid-response
      and returns malformed data. Which status best fits?
    options:
      - "504 Gateway Timeout"
      - "500 Internal Server Error"
      - "502 Bad Gateway"
      - "400 Bad Request"
    answer: 2
    explanation: |
      502 Bad Gateway means the server, acting as a gateway/proxy, received an
      invalid response from the upstream. A timeout would be 504.
    ref: "concepts.md#server-errors-500-vs-502-503-504"

  - id: http-methods-and-status-codes-049
    difficulty: intermediate
    tags: [500, 4xx, classification, gotcha]
    question: |
      A client sends invalid input that fails validation. Why is it wrong to
      return 500 for this?
    options:
      - "Bad client input is a 4xx concern; returning 5xx misclassifies it, poisons error-rate SLOs, and can page the on-call unnecessarily"
      - "500 is slower than 4xx codes"
      - "500 cannot carry a response body"
      - "It is actually correct to return 500 for validation errors"
    answer: 0
    explanation: |
      Client input errors are 4xx (400/422). Returning 500 falsely signals the
      server broke, corrupting error budgets/alerts and paging on-call for a
      client mistake.
    ref: "concepts.md#server-errors-500-vs-502-503-504"

  - id: http-methods-and-status-codes-050
    difficulty: beginner
    tags: [uri, methods, anti-pattern]
    question: |
      Which of the following is an anti-pattern for deleting a resource?
    options:
      - "DELETE /orders/123"
      - "POST /orders/123/delete or GET /orders/123/delete (encoding the verb in the URI)"
      - "Returning 204 after a successful delete"
      - "Returning 404 on a second delete of the same resource"
    answer: 1
    explanation: |
      The verb belongs in the method, not the URI. Using GET to delete is
      especially dangerous because crawlers/prefetch can trigger it; the correct
      call is DELETE /orders/123.
    ref: "concepts.md#http-method-semantics-per-rfc-9110"

  - id: http-methods-and-status-codes-051
    difficulty: intermediate
    tags: [idempotent, retries, infrastructure]
    question: |
      Why can a load balancer or client library safely auto-retry a GET or PUT
      after a network timeout, but not a POST?
    options:
      - "Because GET and PUT are cacheable and POST is not"
      - "Because POST responses are always larger"
      - "Because GET and PUT are idempotent (a duplicate has the same effect), while POST is not, so a retry could duplicate the operation"
      - "Because RFC 9110 forbids retrying POST"
    answer: 2
    explanation: |
      Idempotent methods (GET, PUT, DELETE, HEAD, OPTIONS) can be retried
      because a duplicate is harmless. POST isn't idempotent, so an automatic
      retry might create a second resource.
    ref: "concepts.md#safe-idempotent-and-cacheable-methods"

  - id: http-methods-and-status-codes-052
    difficulty: intermediate
    tags: [post, search, reads]
    question: |
      An API must support a complex search with large or sensitive filter
      criteria that don't fit cleanly in a URL. Which is the accepted pragmatic
      design?
    options:
      - "Put everything in the GET request body"
      - "Use DELETE with a query string"
      - "Encode the entire filter as a single path segment"
      - "POST /search with the criteria in a JSON body (a deliberate exception to 'reads use GET')"
    answer: 3
    explanation: |
      Because GET bodies have no defined semantics and URLs have length/logging/
      sensitivity limits, a POST search endpoint is the common pragmatic choice
      for heavy queries.
    ref: "concepts.md#post-for-creation-and-non-crud-actions"

  - id: http-methods-and-status-codes-053
    difficulty: intermediate
    tags: [status, specificity]
    question: |
      What is the guiding principle for choosing a status code when several
      might apply?
    options:
      - "Always return 200 and describe the outcome in the body"
      - "Prefer 5xx so clients always retry"
      - "Return the most specific code that is accurate, but never one whose class (4xx vs 5xx, etc.) is wrong"
      - "Use only 200, 400, and 500 to keep it simple"
    answer: 2
    explanation: |
      Be as specific as is accurate, but the class must be correct — a wrong
      class (e.g. 5xx for client input) misleads infrastructure and clients.
    ref: "concepts.md#status-code-families-2xx-to-5xx"

  - id: http-methods-and-status-codes-054
    difficulty: advanced
    tags: [problem-details, rfc9457, errors]
    question: |
      Which media type and RFC define a standard machine-readable error body
      for HTTP APIs (the current standard, obsoleting RFC 7807)?
    options:
      - "text/plain, RFC 9110"
      - "application/json-patch+json, RFC 5789"
      - "application/error+json, RFC 6902"
      - "application/problem+json, RFC 9457"
    answer: 3
    explanation: |
      RFC 9457 (Problem Details for HTTP APIs, obsoletes 7807) defines
      application/problem+json with fields like type, title, status, and detail.
    ref: "concepts.md#client-errors-part-1-400-vs-422"

  - id: http-methods-and-status-codes-055
    difficulty: beginner
    tags: [rfc9110, spec]
    question: |
      Which RFC is the current, consolidated specification of HTTP semantics
      (methods and status codes), obsoleting the older RFC 7230/7231 series?
    options:
      - "RFC 9110"
      - "RFC 2616"
      - "RFC 7807"
      - "RFC 6585"
    answer: 0
    explanation: |
      RFC 9110 (HTTP Semantics, June 2022) is the current consolidated spec,
      obsoleting RFC 7230/7231 (and the far older RFC 2616).
    ref: "concepts.md#http-method-semantics-per-rfc-9110"

  - id: http-methods-and-status-codes-056
    difficulty: intermediate
    tags: [get, conditional, 304]
    question: |
      A client sends GET with If-None-Match: "a1b2" and the resource is
      unchanged. What should the server return?
    options:
      - "200 OK with the full body"
      - "304 Not Modified with no body, so the client reuses its cache"
      - "204 No Content"
      - "409 Conflict"
    answer: 1
    explanation: |
      When the ETag still matches, the server returns 304 Not Modified with no
      body, letting the client reuse its cached representation.
    ref: "concepts.md#get-and-head"

  - id: http-methods-and-status-codes-057
    difficulty: advanced
    tags: [405, 404, collection, scenario]
    question: |
      An API models a read-only collection at /reports. A client sends
      DELETE /reports. The collection exists but deletion isn't supported.
      Which response is correct?
    options:
      - "404 Not Found with no extra headers"
      - "409 Conflict with Retry-After"
      - "403 Forbidden with WWW-Authenticate"
      - "405 Method Not Allowed with an Allow header listing GET, HEAD, OPTIONS"
    answer: 3
    explanation: |
      The resource exists but the method isn't supported on it -> 405, and the
      response must include an Allow header enumerating the permitted methods.
    ref: "concepts.md#options-405-method-not-allowed-and-the-allow-header"

  - id: http-methods-and-status-codes-058
    difficulty: intermediate
    tags: [3xx, 303, post]
    question: |
      After a POST creates a result, the server wants the client to fetch the
      outcome via a GET on a different URI. Which redirect code expresses "go
      GET this other resource"?
    options:
      - "303 See Other"
      - "301 Moved Permanently"
      - "307 Temporary Redirect"
      - "304 Not Modified"
    answer: 0
    explanation: |
      303 See Other tells the client to perform a GET on the indicated URI,
      commonly used after a POST to point at a result resource.
    ref: "concepts.md#3xx-redirection"

  - id: http-methods-and-status-codes-059
    difficulty: beginner
    tags: [status, 3xx, meaning]
    question: |
      What does the 3xx class of status codes generally indicate?
    options:
      - "The request succeeded with a body"
      - "Further action (following a redirect or revalidating a cache) is needed to complete the request"
      - "The client made an error"
      - "The server failed"
    answer: 1
    explanation: |
      3xx is redirection: the resource lives elsewhere or the cached copy is
      still valid, so the client must take further action (re-request or reuse
      cache).
    ref: "concepts.md#status-code-families-2xx-to-5xx"

  - id: http-methods-and-status-codes-060
    difficulty: intermediate
    tags: [200, 201, put, scenario]
    question: |
      A PUT /users/alice replaces an existing user and the API echoes the
      updated representation in the body. Which success code is appropriate?
    options:
      - "201 Created (a resource always means 201)"
      - "202 Accepted"
      - "200 OK, since an existing resource was replaced and a body is returned"
      - "204 No Content, since PUT never returns a body"
    answer: 2
    explanation: |
      Replacing an existing resource and returning the representation is 200 OK.
      201 would apply only if PUT created a new resource; 204 applies when no
      body is returned.
    ref: "concepts.md#choosing-2xx-200-201-202-204-and-location"
