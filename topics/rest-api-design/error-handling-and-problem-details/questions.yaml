topic: "Error Handling & Problem Details"
domain: rest-api-design
topic_slug: error-handling-and-problem-details
version: 1
questions:
  - id: error-handling-and-problem-details-001
    difficulty: beginner
    tags: [problem-details, rfc-9457, media-type]
    question: |
      Which media type does RFC 9457 define for carrying a JSON error
      (problem) document in an HTTP response body?
    options:
      - "application/problem+json"
      - "application/json"
      - "application/error+json"
      - "text/problem"
    answer: 0
    explanation: |
      RFC 9457 defines application/problem+json (and application/problem+xml).
      The dedicated media type lets clients and generic tooling recognize a
      problem document without inferring it from the body shape.
    ref: "concepts.md#rfc-9457-problem-details"

  - id: error-handling-and-problem-details-002
    difficulty: beginner
    tags: [rfc-9457, rfc-7807, standards]
    question: |
      What is the relationship between RFC 9457 and RFC 7807?
    options:
      - "RFC 9457 is a draft that RFC 7807 later replaced"
      - "They define two competing, incompatible error formats"
      - "RFC 9457 obsoletes RFC 7807 while keeping the same object model"
      - "RFC 9457 only covers XML; RFC 7807 only covers JSON"
    answer: 2
    explanation: |
      RFC 9457 (July 2023) obsoletes RFC 7807. The object model
      (type/title/status/detail/instance plus extensions) is unchanged; 9457
      mainly clarifies guidance and registration, so 7807-shaped bodies remain
      valid.
    ref: "concepts.md#rfc-9457-problem-details"

  - id: error-handling-and-problem-details-003
    difficulty: beginner
    tags: [problem-details, members]
    question: |
      In an RFC 9457 problem object, which member is intended as the primary
      identifier of the *kind* of problem?
    options:
      - "type"
      - "detail"
      - "instance"
      - "title"
    answer: 0
    explanation: |
      `type` is a URI identifying the problem type; two problems with the same
      `type` are the same kind of problem. `title` is a human summary, `detail`
      is occurrence-specific text, and `instance` identifies the specific
      occurrence.
    ref: "concepts.md#rfc-9457-problem-details"

  - id: error-handling-and-problem-details-004
    difficulty: beginner
    tags: [problem-details, members]
    question: |
      What is the default value of the `type` member when a problem document
      carries no semantics beyond the HTTP status code?
    options:
      - "\"null\""
      - "\"about:blank\""
      - "\"unknown\""
      - "The status code as a string"
    answer: 1
    explanation: |
      When `type` is absent it defaults to "about:blank", meaning the problem
      has no semantics beyond the HTTP status code. In that case `title` should
      be the status phrase (e.g., "Not Found").
    ref: "concepts.md#rfc-9457-problem-details"

  - id: error-handling-and-problem-details-005
    difficulty: intermediate
    tags: [problem-details, status, semantics]
    question: |
      A problem body has "status": 400 but the HTTP response line says
      "500 Internal Server Error". Which value is authoritative?
    options:
      - "The body's `status` member (400)"
      - "Whichever the client's config prefers"
      - "Neither; the response is invalid and must be discarded"
      - "The HTTP response status line (500)"
    answer: 3
    explanation: |
      The body `status` is advisory/for-debugging convenience. The HTTP response
      status line is authoritative. RFC 9457 duplicates the code in the body
      only for convenience; when they disagree, the response line wins.
    ref: "concepts.md#rfc-9457-problem-details"

  - id: error-handling-and-problem-details-006
    difficulty: intermediate
    tags: [problem-details, extensions]
    question: |
      How must a client treat extension members (fields beyond
      type/title/status/detail/instance) it does not recognize?
    options:
      - "Reject the whole response as malformed"
      - "Ignore them"
      - "Log them as errors and retry"
      - "Treat their presence as a 500"
    answer: 1
    explanation: |
      Extension members carry structured, problem-type-specific data. RFC 9457
      requires consumers to ignore extensions they don't recognize, which is
      what makes the format forward-compatible.
    ref: "concepts.md#rfc-9457-problem-details"

  - id: error-handling-and-problem-details-007
    difficulty: beginner
    tags: [consistent-contract, anti-pattern]
    question: |
      Why is returning HTTP 200 OK with {"success": false, "error": "..."} in
      the body considered an anti-pattern?
    options:
      - "Generic tooling (caches, monitoring, HTTP clients) treats the failure as success because the status line says OK"
      - "JSON cannot represent booleans reliably"
      - "200 responses cannot contain a body"
      - "It forces the use of application/problem+json"
    answer: 0
    explanation: |
      The status line is the machine-readable outcome. A 200 makes caches cache
      the failure, monitoring count it as success, and clients treat it as fine.
      The status code must honestly reflect the outcome.
    ref: "concepts.md#the-consistent-error-contract"

  - id: error-handling-and-problem-details-008
    difficulty: beginner
    tags: [consistent-contract, three-part-model]
    question: |
      In the three-part error model, which part is meant for the client's *code*
      to branch on (not for humans to read)?
    options:
      - "The human-readable message (detail)"
      - "The instance URI"
      - "The Content-Type header"
      - "The stable, machine-readable error code"
    answer: 3
    explanation: |
      The HTTP status is for intermediaries, the human message is for developers/
      users, and the stable machine-readable code is what client logic branches
      on. Keeping all three separate is the core of a good error contract.
    ref: "concepts.md#the-consistent-error-contract"

  - id: error-handling-and-problem-details-009
    difficulty: intermediate
    tags: [consistent-contract, design]
    question: |
      An API returns {"error": "..."} from one endpoint, {"message": "..."} from
      another, and bare HTML from the gateway on a 502. What is the main problem?
    options:
      - "Clients must special-case every endpoint and failure origin because there is no single, consistent error shape"
      - "The gateway should return 200 instead of 502"
      - "HTML is never allowed in HTTP responses"
      - "Error bodies must always be empty"
    answer: 0
    explanation: |
      A consistent error contract means every error uses the same shape and
      media type regardless of which layer produced it. Inconsistency forces
      clients to write bespoke handling per endpoint and is the most common
      real-world API-error complaint.
    ref: "concepts.md#the-consistent-error-contract"

  - id: error-handling-and-problem-details-010
    difficulty: intermediate
    tags: [error-codes, human-messages, stability]
    question: |
      Which statement best captures the stability contract between an error
      `code` and a human `detail` message?
    options:
      - "Both are stable and neither may change"
      - "The message is stable; the code changes per request"
      - "The code is stable; the message may be reworded or translated freely"
      - "Both may change per request"
    answer: 2
    explanation: |
      Clients branch on the stable code (or `type`), while the human message is
      display/log text you can reword, translate, or A/B test. Changing a code is
      a breaking change; changing a message is not.
    ref: "concepts.md#machine-readable-error-codes-vs-human-messages"

  - id: error-handling-and-problem-details-011
    difficulty: intermediate
    tags: [error-codes, design, anti-pattern]
    question: |
      A client displays an inline retry button whenever the response `detail`
      string contains the word "expired". Why is this fragile?
    options:
      - "detail is always empty in problem documents"
      - "detail cannot contain the letter 'e'"
      - "The client should parse `title` instead of `detail`"
      - "Parsing the human message means a copy edit or translation silently breaks the client"
    answer: 3
    explanation: |
      Human messages are not a contract. Clients must branch on the stable
      machine code/type, never grep the human string, or a reword/localization
      will break them.
    ref: "concepts.md#machine-readable-error-codes-vs-human-messages"

  - id: error-handling-and-problem-details-012
    difficulty: intermediate
    tags: [error-codes, status-granularity]
    question: |
      "Card declined", "card expired", and "insufficient funds" can all map to
      the same HTTP status. How should an API let clients distinguish them?
    options:
      - "By inventing three new HTTP status codes"
      - "By returning them at three different endpoints"
      - "With a fine-grained, stable machine-readable code (or distinct `type` URI) alongside the status"
      - "By varying the Content-Type header per case"
    answer: 2
    explanation: |
      HTTP status codes are intentionally coarse. Finer distinctions belong in a
      stable application error code (e.g., "card_expired") or distinct `type`
      URIs, which clients can enumerate and branch on.
    ref: "concepts.md#machine-readable-error-codes-vs-human-messages"

  - id: error-handling-and-problem-details-013
    difficulty: beginner
    tags: [validation, field-errors]
    question: |
      For a form submission with three invalid fields, what is the recommended
      error-response behavior?
    options:
      - "Return only the first invalid field, then fail-fast on each retry"
      - "Return all field errors at once in a structured array"
      - "Return a 500 with a stack trace"
      - "Return 200 and let the client re-validate"
    answer: 1
    explanation: |
      Returning all field errors at once (as a structured `errors` array) lets
      the client fix everything in one pass. Fail-fast one-field-at-a-time forces
      many round-trips.
    ref: "concepts.md#field-level-validation-errors"

  - id: error-handling-and-problem-details-014
    difficulty: intermediate
    tags: [validation, json-pointer, rfc-6901]
    question: |
      RFC 9457's appendix suggests pointing at an offending body field in a
      per-field error using which mechanism?
    options:
      - "An XPath expression"
      - "The field's byte offset in the request"
      - "A regular expression matching the field name"
      - "A JSON Pointer (RFC 6901) in a `pointer` member"
    answer: 3
    explanation: |
      The appendix suggests an `errors` array whose entries use a JSON Pointer
      (RFC 6901), e.g. "pointer": "#/email" for body fields, and a `parameter`
      name for query/header params — mirroring the JSON:API convention.
    ref: "concepts.md#field-level-validation-errors"

  - id: error-handling-and-problem-details-015
    difficulty: intermediate
    tags: [validation, status-codes, 400-vs-422]
    question: |
      A request has well-formed JSON but sets "age": -5, which violates a
      business rule. Which status is the more precise choice?
    options:
      - "400 Bad Request"
      - "422 Unprocessable Content"
      - "406 Not Acceptable"
      - "409 Conflict"
    answer: 1
    explanation: |
      422 Unprocessable Content is for syntactically valid but semantically
      invalid requests. 400 is for requests the server can't even parse (bad
      JSON, wrong content type). Both are defensible; 422 is more precise for a
      business-rule violation.
    ref: "concepts.md#field-level-validation-errors"

  - id: error-handling-and-problem-details-016
    difficulty: intermediate
    tags: [validation, contract]
    question: |
      When returning multiple field-level validation errors in one response,
      what should the top-level HTTP status reflect?
    options:
      - "A single meaningful error status (e.g., 400 or 422) for the whole request"
      - "200, since the body carries the details"
      - "A different status per field, concatenated"
      - "204 No Content"
    answer: 0
    explanation: |
      The response is still one HTTP error, so the status line carries one
      meaningful error status (400 or 422). The per-field breakdown lives in the
      body's `errors` array, not in the status line.
    ref: "concepts.md#field-level-validation-errors"

  - id: error-handling-and-problem-details-017
    difficulty: beginner
    tags: [security, leak, owasp]
    question: |
      Which of these should NOT appear in an error response returned to clients?
    options:
      - "A stable machine-readable error code"
      - "A correlation/trace id"
      - "A raw stack trace with exception class names and file paths"
      - "A human-readable title"
    answer: 2
    explanation: |
      Stack traces, class names, SQL fragments, and file paths leak internal
      structure and versions (OWASP API8:2023 Security Misconfiguration). Return
      a generic message plus a correlation id and keep the detail in server logs.
    ref: "concepts.md#do-not-leak-internals"

  - id: error-handling-and-problem-details-018
    difficulty: intermediate
    tags: [security, enumeration, auth]
    question: |
      A login endpoint returns "user not found" for unknown emails and "wrong
      password" for known ones. What vulnerability does this create?
    options:
      - "Cross-site scripting"
      - "SQL injection"
      - "CSRF"
      - "User enumeration — attackers can discover which accounts exist"
    answer: 3
    explanation: |
      Distinguishing the two responses lets an attacker enumerate valid accounts.
      Auth errors should be deliberately uniform/vague (e.g., a generic
      "invalid credentials") to avoid confirming which accounts exist.
    ref: "concepts.md#do-not-leak-internals"

  - id: error-handling-and-problem-details-019
    difficulty: intermediate
    tags: [security, 500, debugging]
    question: |
      For an unexpected server crash, how do you keep the response safe yet still
      debuggable?
    options:
      - "Return the full exception in `detail` so support can read it"
      - "Return a 200 with the error hidden in the body"
      - "Return a 400 so on-call is not paged"
      - "Return a generic 500 problem plus a correlation/trace id, and log the full detail server-side keyed by that id"
    answer: 3
    explanation: |
      Map unexpected errors to a generic 500 body and attach an opaque
      correlation/trace id. The id leaks nothing but lets engineers pull the full
      un-redacted server log for that exact request.
    ref: "concepts.md#do-not-leak-internals"

  - id: error-handling-and-problem-details-020
    difficulty: advanced
    tags: [security, environments, contract]
    question: |
      A team shows verbose stack-trace errors in dev and generic errors in prod.
      What subtle contract risk does this introduce?
    options:
      - "None; this is always safe"
      - "Dev must also return 200 for all errors"
      - "If the fields clients rely on differ between environments, client behavior can diverge between environments"
      - "Prod must expose stack traces to match dev"
    answer: 2
    explanation: |
      Verbose-in-dev/generic-in-prod is fine for the human detail, but the
      *contract* fields clients depend on (status, code, structure) must be
      identical across environments, or clients behave differently in dev vs prod.
    ref: "concepts.md#do-not-leak-internals"

  - id: error-handling-and-problem-details-021
    difficulty: beginner
    tags: [status-codes, 4xx-5xx]
    question: |
      What is the fundamental distinction between the 4xx and 5xx status classes?
    options:
      - "4xx are warnings; 5xx are informational"
      - "4xx are for GET; 5xx are for POST"
      - "4xx means the client did something wrong (retry unchanged won't help); 5xx means the server failed (retry may succeed)"
      - "4xx are cacheable; 5xx are never cacheable"
    answer: 2
    explanation: |
      4xx = client-side fault; the same request will keep failing, so the fix is
      on the client. 5xx = server-side failure; the request may be valid and a
      retry with backoff might succeed. Miscategorizing wrecks alerting and retry
      behavior.
    ref: "concepts.md#mapping-domain-errors-to-status-codes"

  - id: error-handling-and-problem-details-022
    difficulty: intermediate
    tags: [status-codes, 401-403, headers]
    question: |
      A request arrives with no credentials at all. Which status is correct, and
      what header is required?
    options:
      - "403 Forbidden, with an Allow header"
      - "400 Bad Request, with a Retry-After header"
      - "404 Not Found, with a Location header"
      - "401 Unauthorized, with a WWW-Authenticate header"
    answer: 3
    explanation: |
      401 means "I don't know who you are / credentials are missing or invalid"
      and RFC 9110 requires a WWW-Authenticate header. 403 is for an
      authenticated caller who lacks permission.
    ref: "concepts.md#mapping-domain-errors-to-status-codes"

  - id: error-handling-and-problem-details-023
    difficulty: intermediate
    tags: [status-codes, 401-403]
    question: |
      A valid, authenticated user tries to delete another user's resource they
      have no permission for. Which status fits best?
    options:
      - "401 Unauthorized"
      - "403 Forbidden"
      - "409 Conflict"
      - "422 Unprocessable Content"
    answer: 1
    explanation: |
      The caller's identity is known (authenticated) but they lack permission —
      that is 403 Forbidden. 401 would be wrong because it signals missing/invalid
      credentials.
    ref: "concepts.md#mapping-domain-errors-to-status-codes"

  - id: error-handling-and-problem-details-024
    difficulty: intermediate
    tags: [status-codes, 409, conflict]
    question: |
      An order can only ship once. A client calls "ship" on an order that is
      already shipped. Which status best represents this domain error?
    options:
      - "400 Bad Request"
      - "404 Not Found"
      - "409 Conflict"
      - "500 Internal Server Error"
    answer: 2
    explanation: |
      A request that conflicts with the current state of the resource (already
      shipped, duplicate, optimistic-lock failure) maps to 409 Conflict. It's a
      client-side, state-dependent error, not a server fault.
    ref: "concepts.md#mapping-domain-errors-to-status-codes"

  - id: error-handling-and-problem-details-025
    difficulty: advanced
    tags: [status-codes, 409-412, concurrency]
    question: |
      A client sends If-Match with an ETag that no longer matches the current
      resource (optimistic concurrency). Which status is the standard signal?
    options:
      - "409 Conflict"
      - "428 Precondition Required"
      - "417 Expectation Failed"
      - "412 Precondition Failed"
    answer: 3
    explanation: |
      A failed conditional header such as If-Match/If-Unmodified-Since returns
      412 Precondition Failed — the standard optimistic-concurrency signal. 409 is
      a more general state conflict.
    ref: "concepts.md#mapping-domain-errors-to-status-codes"

  - id: error-handling-and-problem-details-026
    difficulty: intermediate
    tags: [status-codes, upstream, gateway]
    question: |
      Your API calls an upstream service that returns an unparseable/garbage
      response. Which status best reflects this to your client?
    options:
      - "502 Bad Gateway"
      - "422 Unprocessable Content"
      - "400 Bad Request"
      - "451 Unavailable For Legal Reasons"
    answer: 0
    explanation: |
      When acting as a gateway/proxy and receiving an invalid response from an
      upstream, 502 Bad Gateway is the right signal. It is a 5xx because the fault
      is server/infrastructure-side, not the client's request.
    ref: "concepts.md#mapping-domain-errors-to-status-codes"

  - id: error-handling-and-problem-details-027
    difficulty: advanced
    tags: [status-codes, telemetry, anti-pattern]
    question: |
      Why is it harmful to return 4xx for genuine server bugs just to keep the
      error-budget/SLO dashboards green?
    options:
      - "4xx responses are larger than 5xx responses"
      - "4xx codes are not allowed in JSON APIs"
      - "It forces clients to switch to gRPC"
      - "It produces dishonest telemetry — real incidents are hidden and clients are told not to retry when they should"
    answer: 3
    explanation: |
      Mislabeling server faults as 4xx hides real incidents from alerting and
      tells clients the request was their fault (don't retry) when a retry might
      actually succeed. Status classes must be honest.
    ref: "concepts.md#mapping-domain-errors-to-status-codes"

  - id: error-handling-and-problem-details-028
    difficulty: intermediate
    tags: [status-codes, 405, headers]
    question: |
      A client sends DELETE to a resource that only supports GET and PUT. Which
      response is correct?
    options:
      - "405 Method Not Allowed with an Allow header listing GET, PUT"
      - "404 Not Found with no extra headers"
      - "400 Bad Request with a WWW-Authenticate header"
      - "403 Forbidden with a Retry-After header"
    answer: 0
    explanation: |
      405 Method Not Allowed signals the method isn't supported on that resource,
      and RFC 9110 requires an Allow header enumerating the methods that are
      supported.
    ref: "concepts.md#mapping-domain-errors-to-status-codes"

  - id: error-handling-and-problem-details-029
    difficulty: beginner
    tags: [idempotency, retry, 5xx]
    question: |
      A client's POST times out with no response received. What is the correct
      characterization of the request's outcome?
    options:
      - "It definitely failed; safe to resend blindly"
      - "The outcome is unknown; a safe retry should use an idempotency key to avoid duplicates"
      - "It definitely succeeded; no action needed"
      - "It must be reported as a 404"
    answer: 1
    explanation: |
      On a timeout the outcome is unknown — the request may or may not have been
      applied. A safe client retries, but uses an idempotency key so a duplicated
      create doesn't produce two resources.
    ref: "concepts.md#idempotent-error-semantics"

  - id: error-handling-and-problem-details-030
    difficulty: intermediate
    tags: [idempotency, retry, status-classes]
    question: |
      Which response should a well-behaved client generally NOT retry unchanged?
    options:
      - "400 Bad Request"
      - "429 Too Many Requests"
      - "503 Service Unavailable"
      - "504 Gateway Timeout"
    answer: 0
    explanation: |
      A 400 means the request itself is broken; retrying it unchanged is
      pointless. 429/503/504 are retryable (429/503 after honoring Retry-After
      or with backoff).
    ref: "concepts.md#idempotent-error-semantics"

  - id: error-handling-and-problem-details-031
    difficulty: intermediate
    tags: [idempotency, keys, replay]
    question: |
      With an Idempotency-Key header, what should the server do when it receives
      a replay of a request whose original attempt succeeded?
    options:
      - "Re-run the side effect and return a new result"
      - "Return 409 Conflict every time"
      - "Ignore the key and process as a new request"
      - "Return the same stored success response without re-running the side effect"
    answer: 3
    explanation: |
      The point of an idempotency key is that a replay returns the stored result
      of the first attempt without repeating the side effect (e.g., no double
      charge).
    ref: "concepts.md#idempotent-error-semantics"

  - id: error-handling-and-problem-details-032
    difficulty: advanced
    tags: [idempotency, keys, conflict]
    question: |
      A client reuses the same Idempotency-Key but with a *different* request
      body. What is the appropriate server response?
    options:
      - "Silently apply the new body"
      - "Return 200 with the old result for the new body"
      - "Return an error such as 422 or 409 because the key was reused for a different operation"
      - "Delete the stored record and start over"
    answer: 2
    explanation: |
      A key is bound to a specific request. Reusing it with a different body is a
      misuse and should return an error (typically 422 or 409), not silently
      apply either body.
    ref: "concepts.md#idempotent-error-semantics"

  - id: error-handling-and-problem-details-033
    difficulty: advanced
    tags: [idempotency, delete, semantics]
    question: |
      A client retries a DELETE that already succeeded and now gets 404/410. How
      should the client interpret this?
    options:
      - "As a hard failure requiring escalation"
      - "As success — the resource is already gone, which is the desired end state"
      - "As a reason to re-create the resource"
      - "As a sign the API is not idempotent"
    answer: 1
    explanation: |
      DELETE is idempotent in *semantics*: the end state (resource gone) is the
      same. A retried DELETE returning 404/410 means "already gone," which the
      client should treat as success.
    ref: "concepts.md#idempotent-error-semantics"

  - id: error-handling-and-problem-details-034
    difficulty: intermediate
    tags: [idempotency, retry-after, 429]
    question: |
      A 429 Too Many Requests response includes "Retry-After: 120". What should a
      well-behaved client do?
    options:
      - "Immediately retry as fast as possible"
      - "Treat it as a permanent failure and give up"
      - "Wait at least 120 seconds before retrying"
      - "Switch the request to a GET"
    answer: 2
    explanation: |
      Retry-After tells the client how long to wait (delay-seconds or an
      HTTP-date). On 429/503 the client must honor it (or use backoff with
      jitter) rather than hammering the server.
    ref: "concepts.md#idempotent-error-semantics"

  - id: error-handling-and-problem-details-035
    difficulty: beginner
    tags: [localization, accept-language]
    question: |
      Which header does a client send to request error messages in a particular
      language?
    options:
      - "Accept-Language"
      - "Content-Language"
      - "Accept-Charset"
      - "Language"
    answer: 0
    explanation: |
      The client sends Accept-Language (e.g., "fr-CA, fr;q=0.9, en;q=0.5"). The
      server returns the best-matching translation and echoes the actual language
      in Content-Language.
    ref: "concepts.md#localization-of-error-messages"

  - id: error-handling-and-problem-details-036
    difficulty: intermediate
    tags: [localization, codes, rule]
    question: |
      When localizing errors, what must remain constant across all languages?
    options:
      - "The `detail` text"
      - "The `title` text"
      - "The Content-Language header"
      - "The stable machine-readable code (and `type`)"
    answer: 3
    explanation: |
      Localize only the human strings (title/detail). The machine-readable
      code/type must stay stable across locales so client logic keeps working
      regardless of language.
    ref: "concepts.md#localization-of-error-messages"

  - id: error-handling-and-problem-details-037
    difficulty: advanced
    tags: [localization, client-side, params]
    question: |
      For a rich client that wants full control of wording and offline support,
      which server design best enables client-side localization?
    options:
      - "Send only a server-localized `detail` string"
      - "Send a stable `code` plus structured parameters (e.g., {\"code\": \"min_length\", \"params\": {\"min\": 8}}) so the client renders its own localized message"
      - "Send the message in every language in one response"
      - "Omit the code and rely on the HTTP status alone"
    answer: 1
    explanation: |
      Client-side localization needs a stable code plus structured params so the
      client can render from its own catalog and reformat numbers/dates per
      locale. Baking values into a single string prevents re-localization.
    ref: "concepts.md#localization-of-error-messages"

  - id: error-handling-and-problem-details-038
    difficulty: intermediate
    tags: [localization, content-language, caching]
    question: |
      Why should a localized error response set Content-Language and be served
      with Vary: Accept-Language?
    options:
      - "So caches don't serve a response in the wrong language to a different client"
      - "To force clients to resend the request"
      - "Because Content-Language is required on every response"
      - "To disable compression"
    answer: 0
    explanation: |
      Content-Language states the language actually returned, and Vary:
      Accept-Language tells caches the response varies by requested language, so a
      cached French body isn't served to an English client.
    ref: "concepts.md#localization-of-error-messages"

  - id: error-handling-and-problem-details-039
    difficulty: intermediate
    tags: [localization, fallback]
    question: |
      A request's Accept-Language asks for a locale the API has no translation
      for. What is the recommended behavior?
    options:
      - "Return 406 Not Acceptable"
      - "Return 500 Internal Server Error"
      - "Fall back gracefully to a default locale"
      - "Return the message in every supported language"
    answer: 2
    explanation: |
      Missing a translation should trigger a graceful fallback to a default
      locale, not a 406. The error still needs to be communicated.
    ref: "concepts.md#localization-of-error-messages"

  - id: error-handling-and-problem-details-040
    difficulty: beginner
    tags: [correlation-id, trace-id, debugging]
    question: |
      What is the main benefit of including a correlation/trace id in every error
      response?
    options:
      - "It makes responses smaller"
      - "It replaces the need for a status code"
      - "It turns 'it's broken' into a fast log lookup for the exact request without leaking internals"
      - "It encrypts the error body"
    answer: 2
    explanation: |
      A correlation/trace id is an opaque token that leaks nothing yet lets
      support/engineering pull the full server-side log for that exact request.
      It's the bridge between "don't leak internals" and "I still need to debug."
    ref: "concepts.md#correlation-and-trace-ids-in-errors"

  - id: error-handling-and-problem-details-041
    difficulty: intermediate
    tags: [correlation-id, trace-context, w3c]
    question: |
      Which standard header carries a distributed trace identifier in the format
      version-traceid-spanid-flags?
    options:
      - "X-Trace"
      - "Correlation-UUID"
      - "X-B3-Everything"
      - "traceparent (W3C Trace Context)"
    answer: 3
    explanation: |
      W3C Trace Context defines `traceparent` (e.g.,
      00-<trace-id>-<span-id>-<flags>) plus `tracestate` for vendor data. Many
      APIs also use a simpler X-Request-Id header.
    ref: "concepts.md#correlation-and-trace-ids-in-errors"

  - id: error-handling-and-problem-details-042
    difficulty: intermediate
    tags: [correlation-id, body-vs-header]
    question: |
      Beyond a response header, why is it recommended to also put the trace id in
      the problem body (e.g., a "traceId" extension)?
    options:
      - "Headers cannot hold identifiers"
      - "The body is encrypted and headers are not"
      - "Because RFC 9457 forbids trace ids in headers"
      - "Users copy the JSON body into bug reports, where headers get lost"
    answer: 3
    explanation: |
      Headers are frequently stripped or lost when people copy-paste a JSON error
      into a ticket. Echoing the id as an extension member in the body ensures it
      survives into the bug report.
    ref: "concepts.md#correlation-and-trace-ids-in-errors"

  - id: error-handling-and-problem-details-043
    difficulty: advanced
    tags: [correlation-id, propagation]
    question: |
      A request enters through a gateway that already generated a request id.
      What should the backend service do with it?
    options:
      - "Accept and propagate the inbound id so the whole chain shares one id"
      - "Discard it and mint a brand-new id"
      - "Return 400 because ids may not be client-supplied"
      - "Store it but never log it"
    answer: 0
    explanation: |
      To correlate logs across the whole chain, a service should accept an
      inbound correlation/trace id (from a gateway or client) and propagate it
      downstream, rather than always creating a fresh one.
    ref: "concepts.md#correlation-and-trace-ids-in-errors"

  - id: error-handling-and-problem-details-044
    difficulty: advanced
    tags: [correlation-id, security]
    question: |
      Why should a correlation id be an opaque random token rather than a
      sequential counter?
    options:
      - "Random tokens compress better"
      - "Sequential ids are forbidden by HTTP"
      - "A sequential id can leak request volume and let clients guess other requests' ids"
      - "Random tokens are required by RFC 9110"
    answer: 2
    explanation: |
      Predictable/sequential ids leak information (request volume) and let
      attackers guess other requests' identifiers. An opaque random token avoids
      both while still being useful for lookup.
    ref: "concepts.md#correlation-and-trace-ids-in-errors"

  - id: error-handling-and-problem-details-045
    difficulty: advanced
    tags: [scenario, problem-details, validation]
    question: |
      Given this response, which statement is correct?

      HTTP/1.1 422 Unprocessable Content
      Content-Type: application/problem+json

      {
        "type": "https://api.example.com/problems/validation-error",
        "title": "Your request parameters didn't validate.",
        "status": 422,
        "errors": [
          { "detail": "must be a valid email", "pointer": "#/email" }
        ]
      }
    options:
      - "The `errors` array is invalid because it is not a standard RFC 9457 member"
      - "`errors` is a valid extension member; clients that don't know it must ignore it, and the JSON Pointer identifies the offending field"
      - "The response must use Content-Type application/json, not problem+json"
      - "422 is wrong here; validation must always be 400"
    answer: 1
    explanation: |
      `errors` is an extension member (RFC 9457 even suggests exactly this
      pattern in its appendix). Unknown extensions must be ignored, and the JSON
      Pointer "#/email" (RFC 6901) identifies the bad field. 422 is appropriate
      for semantic validation failures.
    ref: "concepts.md#field-level-validation-errors"

  - id: error-handling-and-problem-details-046
    difficulty: advanced
    tags: [scenario, status-codes, idempotency]
    question: |
      A payments client sends POST /payments, the connection drops before any
      response arrives, and the client is unsure if the charge went through.
      Which course of action is correct?
    options:
      - "Assume it failed and POST again with no special handling"
      - "Assume it succeeded and do nothing"
      - "Retry with the same Idempotency-Key the API advertised, so the server deduplicates and avoids a double charge"
      - "Retry as a GET request instead"
    answer: 2
    explanation: |
      The outcome is unknown, so the client must retry — but safely. POST is not
      idempotent by default, so the API should advertise an idempotency-key
      mechanism; retrying with the same key lets the server return the original
      result and avoid double-charging.
    ref: "concepts.md#idempotent-error-semantics"

  - id: error-handling-and-problem-details-047
    difficulty: intermediate
    tags: [scenario, do-not-leak, contract]
    question: |
      An API returns this on failure:

      HTTP/1.1 500 Internal Server Error
      Content-Type: application/problem+json
      { "type":"about:blank", "title":"Internal Server Error",
        "status":500, "detail":"java.sql.SQLException: table USERS ...", ... }

      What is the primary problem with this response?
    options:
      - "500 is never a valid status"
      - "`detail` leaks internal database/exception information that should be logged server-side, not returned to clients"
      - "about:blank is not a legal `type` value"
      - "problem+json cannot be used with 500"
    answer: 1
    explanation: |
      Putting the raw SQLException and table name in `detail` leaks schema and
      framework internals (OWASP API8:2023). The fix: return a generic message
      plus a trace id and keep the SQL detail in server logs keyed by that id.
    ref: "concepts.md#do-not-leak-internals"

  - id: error-handling-and-problem-details-048
    difficulty: beginner
    tags: [status-codes, 429, rate-limit]
    question: |
      Which status code signals that a client has exceeded a rate limit, and
      which header should typically accompany it?
    options:
      - "403 Forbidden with Allow"
      - "409 Conflict with ETag"
      - "429 Too Many Requests with Retry-After"
      - "503 Service Unavailable with WWW-Authenticate"
    answer: 2
    explanation: |
      429 Too Many Requests indicates the client has sent too many requests in a
      window; it should carry Retry-After (delay-seconds or an HTTP-date) so the
      client knows when it may try again.
    ref: "concepts.md#mapping-domain-errors-to-status-codes"

  - id: error-handling-and-problem-details-049
    difficulty: intermediate
    tags: [consistent-contract, openapi, documentation]
    question: |
      Where should an API's error contract (status codes, problem shape, error
      codes) ideally be documented so clients can rely on it?
    options:
      - "Nowhere; errors are implementation details"
      - "Only in server-side logs"
      - "In a private wiki not shared with clients"
      - "In the API's versioned, published contract (e.g., OpenAPI), treated like the rest of the public interface"
    answer: 3
    explanation: |
      The error contract is part of the public interface. Documenting the problem
      shape, status codes, and enumerable error codes in the versioned contract
      (OpenAPI) is what lets clients write reliable, once-and-done handling.
    ref: "concepts.md#the-consistent-error-contract"

  - id: error-handling-and-problem-details-050
    difficulty: intermediate
    tags: [error-codes, namespacing, large-apis]
    question: |
      For a large API built by many teams, how can error codes avoid collisions
      across domains?
    options:
      - "Use only numeric HTTP status codes and nothing else"
      - "Namespace codes (e.g., billing.card_expired) or use full `type` URIs"
      - "Let each team pick any short word freely"
      - "Randomize codes per request"
    answer: 1
    explanation: |
      Namespacing (billing.card_expired) or full `type` URIs keeps codes unique
      across teams and enumerable/documented, avoiding collisions as the API
      grows.
    ref: "concepts.md#machine-readable-error-codes-vs-human-messages"

  - id: error-handling-and-problem-details-051
    difficulty: expert
    tags: [iana-registry, rfc-9457, type]
    question: |
      A candidate claims "you should register your API's custom problem type
      https://api.acme.com/problems/insufficient-funds in the IANA HTTP Problem
      Types registry." What is the correct assessment?
    options:
      - "Correct — every problem `type` URI must be IANA-registered to be valid"
      - "Wrong — the registry is for widely reusable, specification-backed types; vendor-specific types live in your own docs, and about:blank is effectively the only registered entry"
      - "Wrong — problem types cannot use HTTPS URIs; they must be URNs"
      - "Correct — registration is required before clients may dereference the URI"
    answer: 1
    explanation: |
      The IANA "HTTP Problem Types" registry (RFC 9457 §4.2) uses a "Specification
      Required" policy (RFC 8126 §4.6) for cross-organization reusable types;
      about:blank is effectively its only entry (§4.2.1). Vendor-specific namespaced
      URIs are valid and encouraged but belong in your own documentation, not IANA.
    ref: "concepts.md#the-iana-problem-types-registry"

  - id: error-handling-and-problem-details-052
    difficulty: advanced
    tags: [iana-registry, about-blank, type]
    question: |
      Which statement about the `about:blank` problem type is accurate per RFC 9457?
    options:
      - "It is a placeholder that servers must never send in production"
      - "It means 'no problem-type semantics beyond the HTTP status code,' and `title` should be the status phrase"
      - "It signals that the response body is empty"
      - "It indicates the client must retry with authentication"
    answer: 1
    explanation: |
      about:blank (RFC 9457 §4.2.1) is the default `type` and means the problem
      carries no semantics beyond the status code; when used, `title` should be the
      HTTP status phrase (e.g., "Not Found"). It is the one entry in the IANA
      registry you can assume is universally understood.
    ref: "concepts.md#the-iana-problem-types-registry"

  - id: error-handling-and-problem-details-053
    difficulty: expert
    tags: [type, instance, uri-resolution, rfc-9457]
    question: |
      A problem body served from https://api.example.com/v2/orders carries
      "type": "/problems/oversold". Per RFC 9457 §3.1.1, how is this relative URI
      handled, and what does the spec recommend?
    options:
      - "It is invalid; `type` must always be an absolute URI or the body is rejected"
      - "It is resolved against the document's base URI, but the spec recommends using absolute URIs to avoid ambiguity"
      - "It is treated as a literal string and never resolved"
      - "It must be resolved against about:blank"
    answer: 1
    explanation: |
      RFC 9457 §3.1.1 says a relative `type` (or `instance`) URI is resolved against
      the document base URI per RFC 3986, but recommends absolute URIs so the
      identifier stays unambiguous when the body is copied, logged, or served from a
      different base.
    ref: "concepts.md#the-type-and-instance-members-in-depth"

  - id: error-handling-and-problem-details-054
    difficulty: expert
    tags: [instance, occurrence, debugging]
    question: |
      How does the `instance` member differ from `type`, and what is a strong use
      for it?
    options:
      - "`instance` identifies the kind of problem; `type` identifies the occurrence"
      - "`instance` identifies the specific occurrence and can be a dereferenceable URI hosting that request's logged error/trace, complementing the correlation-id pattern"
      - "`instance` is the numeric HTTP status; `type` is the human title"
      - "`instance` must always equal the request URL"
    answer: 1
    explanation: |
      `type` identifies the problem kind (equality = same kind); `instance`
      identifies the specific occurrence. Making `instance` a dereferenceable
      occurrence URI that hosts the logged error/trace lets support click through,
      and it encodes/complements the correlation-id pattern. It carries the same
      leak-avoidance discipline as `detail`.
    ref: "concepts.md#the-type-and-instance-members-in-depth"

  - id: error-handling-and-problem-details-055
    difficulty: expert
    tags: [extensions, naming, rfc-9457]
    question: |
      Per RFC 9457 §3.2, which extension member name is the one that does NOT
      follow the spec's naming *recommendations*?
    options:
      - "retryAfterSeconds"
      - "balance"
      - "id"
      - "quota_remaining"
    answer: 2
    explanation: |
      RFC 9457 §3.2 says extension names SHOULD start with a letter, SHOULD use
      only ALPHA/DIGIT/_, and SHOULD be three characters or longer. These are
      recommendations (SHOULD), not hard requirements, so a two-character "id" is
      discouraged (and would fail the three-character guideline) but not strictly
      illegal; the others all satisfy the guidance.
    ref: "concepts.md#the-type-and-instance-members-in-depth"

  - id: error-handling-and-problem-details-056
    difficulty: advanced
    tags: [most-relevant, multiple-errors, rfc-9457]
    question: |
      A single request against one resource trips three independent internal
      checks. What does RFC 9457 §3 guidance suggest for the response?
    options:
      - "Always aggregate every problem found into a synthetic batch problem"
      - "Surface the single most relevant/urgent problem rather than an artificial aggregate; reserve multi-error bodies for genuine batch/bulk operations"
      - "Return one HTTP response per problem"
      - "Return a 207 for any request with more than one problem"
    answer: 1
    explanation: |
      RFC 9457 §3 guidance is to surface the most relevant/urgent problem for a
      single logical operation rather than inventing an aggregate. Multi-error
      bodies are appropriate for true batch/bulk semantics, not for "three things
      wrong with one resource."
    ref: "concepts.md#the-type-and-instance-members-in-depth"

  - id: error-handling-and-problem-details-057
    difficulty: expert
    tags: [status-codes, 422, rfc-9110, rfc-4918, gotcha]
    question: |
      An interviewer says "422 Unprocessable Content is only a WebDAV extension
      and is not part of the core HTTP semantics specification." What is the most
      precise correction?
    options:
      - "Correct — 422 lives only in RFC 4918 and never made it into base HTTP"
      - "422 originated in WebDAV (RFC 4918 §11.2) but RFC 9110 §15.5.21 now defines it as part of core HTTP semantics, added for its general applicability"
      - "422 is not a real status code"
      - "422 is defined in RFC 6901 (JSON Pointer)"
    answer: 1
    explanation: |
      422 was first defined in WebDAV (RFC 4918 §11.2), but RFC 9110 §15.5.21 now
      defines it as a first-class core HTTP status code — Appendix B.3 states it
      "has been added because of its general applicability." Saying it is
      WebDAV-only is outdated. (If you still want a status even minimal
      intermediaries surely understand, 400 is the safer floor.)
    ref: "concepts.md#status-code-nuances-for-errors"

  - id: error-handling-and-problem-details-058
    difficulty: expert
    tags: [status-codes, discrimination, scenario]
    question: |
      Match the correct status for each: (1) request body is not valid JSON,
      (2) valid JSON but age is -5, (3) email already registered, (4) If-Match ETag
      no longer matches.
    options:
      - "400, 422, 409, 412"
      - "422, 400, 412, 409"
      - "400, 409, 422, 412"
      - "400, 422, 412, 409"
    answer: 0
    explanation: |
      Unparseable body = 400; syntactically valid but semantically invalid = 422;
      unique-constraint/state conflict = 409; failed conditional header = 412
      Precondition Failed. This four-way discrimination is a classic senior probe.
    ref: "concepts.md#status-code-nuances-for-errors"

  - id: error-handling-and-problem-details-059
    difficulty: expert
    tags: [status-codes, 409-412, retry, concurrency]
    question: |
      Regarding retry-ability, how do a 409 optimistic-concurrency conflict and a
      412 Precondition Failed differ?
    options:
      - "Both are immediately retryable with the identical request"
      - "Neither is ever retryable"
      - "A 409/ABORTED conflict is retryable after re-fetching and rebasing on fresh state; a 412 is not retryable until the client obtains a new validator (ETag)"
      - "A 412 is retryable immediately; a 409 never is"
    answer: 2
    explanation: |
      Both signal a stale view of the world, but recovery differs: a 409/ABORTED
      conflict can be retried once the client re-fetches and rebuilds its update; a
      412 stays failing until the underlying state changes and the client holds a
      fresh validator to send in If-Match.
    ref: "concepts.md#status-code-nuances-for-errors"

  - id: error-handling-and-problem-details-060
    difficulty: expert
    tags: [batch, 207, multi-status, rfc-4918]
    question: |
      A bulk endpoint returns 207 Multi-Status. What is the most important thing a
      client must understand about that top-level code?
    options:
      - "207 means all items succeeded"
      - "207 means the whole batch was rejected"
      - "207 carries no aggregate success/failure signal; the real per-item outcomes live in each entry's own status, which the client must read"
      - "207 is only valid for GET requests"
    answer: 2
    explanation: |
      Per RFC 4918 §11.1/§13, 207 Multi-Status means "I processed the request; the
      real outcomes are inside." The top-level code intentionally carries no
      success/failure signal — the footgun is treating 207 as success and ignoring
      the per-item statuses in the body.
    ref: "concepts.md#batch-and-bulk-error-semantics"

  - id: error-handling-and-problem-details-061
    difficulty: expert
    tags: [batch, partial-success, idempotency, scenario]
    question: |
      A bulk create of 1,000 records applies best-effort semantics; 997 succeed and
      3 fail validation. The client then retries the entire batch. Which design
      consideration is most critical?
    options:
      - "The retry must return 500 because the first attempt was not fully successful"
      - "Per-item (or batch) idempotency keys must ensure the 997 already-created records are not duplicated on the retry"
      - "The server must delete the 997 successes so the batch can be reprocessed cleanly"
      - "The client must switch to one request per record on the retry"
    answer: 1
    explanation: |
      With partial-success semantics, a whole-batch retry will re-send the 997 that
      already succeeded. Without per-item or batch idempotency keys, those get
      duplicated. Idempotency is exactly what makes best-effort batch retries safe.
    ref: "concepts.md#batch-and-bulk-error-semantics"

  - id: error-handling-and-problem-details-062
    difficulty: advanced
    tags: [batch, aip-193, google, trade-off]
    question: |
      Google's AIP-193 takes a notable stance on partial errors in batch
      operations. What is it?
    options:
      - "APIs must always return 207 for batches"
      - "APIs generally should NOT support partial errors; prefer transactional semantics or a long-running operation that reports per-item failures in its metadata"
      - "APIs must return 200 with a per-item array in all cases"
      - "Partial errors should be encoded in HTTP headers, not the body"
    answer: 1
    explanation: |
      AIP-193 argues partial success makes client error handling ambiguous and
      hides failures, so APIs generally should avoid it — preferring all-or-nothing
      transactions or a long-running operation whose metadata carries per-item
      failures. Being able to argue both this and the 207 position is the senior
      signal.
    ref: "concepts.md#batch-and-bulk-error-semantics"

  - id: error-handling-and-problem-details-063
    difficulty: advanced
    tags: [grpc, status-mapping, canonical-codes]
    question: |
      In the gRPC canonical error model, which mapping to HTTP status is correct?
    options:
      - "PERMISSION_DENIED -> 401, UNAUTHENTICATED -> 403"
      - "RESOURCE_EXHAUSTED -> 429, UNAVAILABLE -> 503, DEADLINE_EXCEEDED -> 504"
      - "NOT_FOUND -> 400, ALREADY_EXISTS -> 422"
      - "INTERNAL -> 503, UNIMPLEMENTED -> 500"
    answer: 1
    explanation: |
      RESOURCE_EXHAUSTED->429, UNAVAILABLE->503, DEADLINE_EXCEEDED->504 are correct.
      The distractors swap common pairs: UNAUTHENTICATED->401 and PERMISSION_DENIED
      ->403; NOT_FOUND->404 and ALREADY_EXISTS->409; INTERNAL->500 and
      UNIMPLEMENTED->501.
    ref: "concepts.md#grpc-canonical-error-model"

  - id: error-handling-and-problem-details-064
    difficulty: expert
    tags: [grpc, invalid-argument, failed-precondition]
    question: |
      What distinguishes gRPC's INVALID_ARGUMENT from FAILED_PRECONDITION (both
      commonly mapping to HTTP 400)?
    options:
      - "INVALID_ARGUMENT is for authentication; FAILED_PRECONDITION is for authorization"
      - "INVALID_ARGUMENT means the argument is wrong regardless of system state; FAILED_PRECONDITION means the argument is fine but the system is not in a state to run the operation"
      - "They are synonyms with no practical difference"
      - "INVALID_ARGUMENT maps to 500; FAILED_PRECONDITION maps to 404"
    answer: 1
    explanation: |
      INVALID_ARGUMENT is problematic irrespective of state (the client should not
      retry without fixing the argument); FAILED_PRECONDITION means the request is
      well-formed but the system state forbids it (retry after the state changes).
      This mirrors the REST 400-vs-409/412 distinction.
    ref: "concepts.md#grpc-canonical-error-model"

  - id: error-handling-and-problem-details-065
    difficulty: expert
    tags: [grpc, 499, gateway]
    question: |
      A gateway logs an HTTP 499 for a gRPC CANCELLED code. Why does 499 appear
      here rather than a standard RFC 9110 status?
    options:
      - "499 is defined by RFC 9110 for cancelled requests"
      - "499 ('client closed request') is a non-standard nginx/gRPC convention meaning the caller went away before the server answered; RFC 9110 has no equivalent"
      - "499 means the server cancelled the request due to rate limiting"
      - "499 is a typo for 419 and should be treated as 4xx validation"
    answer: 1
    explanation: |
      CANCELLED maps to 499, "client closed request" — an nginx/gRPC convention for
      the client disconnecting before a response. There is no RFC 9110 status for
      this, which is exactly why it surfaces at gateways/proxies.
    ref: "concepts.md#grpc-canonical-error-model"

  - id: error-handling-and-problem-details-066
    difficulty: expert
    tags: [graphql, http-200, error-model, contrast]
    question: |
      Under the classic GraphQL-over-HTTP convention, a query with a failed
      field resolver typically returns which HTTP status, and where are the errors?
    options:
      - "500, with errors in a Problem Details body"
      - "200, with errors in a top-level `errors[]` array (often alongside partial `data`)"
      - "422, with errors in the response headers"
      - "400, with errors in the status line reason phrase"
    answer: 1
    explanation: |
      Classic GraphQL returns HTTP 200 even on field-level execution errors and
      places them in a top-level `errors[]` array, frequently alongside partial
      `data`. This inverts the REST rule that the status line must reflect the
      outcome, so generic HTTP tooling can't see the failure.
    ref: "concepts.md#graphql-error-model"

  - id: error-handling-and-problem-details-067
    difficulty: expert
    tags: [graphql, null-propagation, non-null]
    question: |
      In GraphQL, a resolver for a field declared as non-null throws an error. What
      happens?
    options:
      - "Only that field becomes null and execution continues normally"
      - "The entire response is discarded and replaced by an HTTP 500"
      - "The error propagates up to the nearest nullable parent, potentially nulling a whole subtree, with the error recorded in `errors[]`"
      - "The field is silently omitted with no entry in `errors[]`"
    answer: 2
    explanation: |
      A non-null field can't be null, so the error propagates upward to the nearest
      nullable parent, potentially nulling an entire subtree, while the error is
      recorded in `errors[]`. This null-propagation behavior is unique to GraphQL's
      type system and has no REST analog.
    ref: "concepts.md#graphql-error-model"

  - id: error-handling-and-problem-details-068
    difficulty: expert
    tags: [graphql, graphql-over-http, media-type]
    question: |
      What does the GraphQL-over-HTTP `application/graphql-response+json` media type
      change about status codes?
    options:
      - "Nothing; all GraphQL responses are always 200"
      - "Under it, a server MAY return non-2xx status codes for request-level failures (e.g., malformed query or validation), narrowing the 'always 200' gap"
      - "It forces every field error to become a 400"
      - "It makes GraphQL responses use application/problem+json"
    answer: 1
    explanation: |
      Under application/graphql-response+json (GraphQL-over-HTTP spec), the server
      can return non-2xx for request-level failures like parse/validation errors,
      while field-level execution errors under the legacy media type still return
      200. The precise 2025 answer distinguishes request-level from field-level.
    ref: "concepts.md#graphql-error-model"

  - id: error-handling-and-problem-details-069
    difficulty: expert
    tags: [error-codes, errorinfo, google, scale]
    question: |
      Google's ErrorInfo carries a (reason, domain, metadata) triple. Which design
      rule most directly mirrors the "never make clients parse the message" thesis?
    options:
      - "reason must be a full sentence in the user's language"
      - "Any request-specific value that appears in the human `message` MUST also appear in `metadata`, so clients extract it structurally"
      - "domain must be omitted for internal services"
      - "metadata must contain the stack trace for debugging"
    answer: 1
    explanation: |
      ErrorInfo requires that any dynamic value referenced in the human message also
      appear in structured `metadata`, so clients read it from key/value pairs
      rather than parsing the message. `(domain, reason)` are globally unique,
      preventing cross-team collisions.
    ref: "concepts.md#stable-error-codes-at-scale"

  - id: error-handling-and-problem-details-070
    difficulty: expert
    tags: [error-codes, governance, registry, deprecation]
    question: |
      You must design stable machine-readable error codes for 50 teams so they never
      collide and clients can branch safely. Which approach is strongest?
    options:
      - "Let each team pick short English words; duplicates are unlikely at 50 teams"
      - "Treat the code set as a versioned enum in the public contract with per-code ownership, doc URLs, and a deprecation policy, using namespacing or (domain, reason) to guarantee uniqueness"
      - "Generate a random code per response so nothing ever collides"
      - "Reuse HTTP status codes as the only error identifiers"
    answer: 1
    explanation: |
      At scale the answer is governance: a central registry/enum in the public
      contract, namespacing or (domain, reason) uniqueness, per-code ownership and
      documentation, and treating removal/repurposing as a breaking change. Random
      codes aren't branchable; free-form words collide; HTTP status is too coarse.
    ref: "concepts.md#stable-error-codes-at-scale"

  - id: error-handling-and-problem-details-071
    difficulty: advanced
    tags: [custom-envelope, azure, innererror]
    question: |
      The Microsoft/Azure error envelope nests an `innererror` inside `error`. What
      is the purpose of that nesting?
    options:
      - "To duplicate the top-level message for redundancy"
      - "To provide progressively more specific, machine-readable codes as you drill down, beyond the top-level code"
      - "To carry the client's request body back for echoing"
      - "To store the correlation id only"
    answer: 1
    explanation: |
      Azure's shape ({error:{code,message,target,details,innererror:{code,innererror}}})
      uses a recursively nested `innererror` to expose progressively more specific
      codes as the client drills down, plus `target` for the offending field/param.
    ref: "concepts.md#custom-error-envelopes-vs-standard-problem-json"

  - id: error-handling-and-problem-details-072
    difficulty: advanced
    tags: [custom-envelope, problem-json, migration]
    question: |
      A mature API with an established SDK ecosystem wants to adopt RFC 9457 without
      breaking existing clients. What is a reasonable coexistence strategy?
    options:
      - "Silently change all responses to problem+json overnight"
      - "Use content negotiation: return application/problem+json when the client asks for it and the legacy envelope otherwise, during migration — while avoiding two live contracts long-term"
      - "Return both envelopes concatenated in every response"
      - "Never adopt problem+json; standards are irrelevant once you have an SDK"
    answer: 1
    explanation: |
      Content negotiation lets the server serve problem+json to clients that request
      it and the legacy envelope to everyone else during a migration window. The
      goal is convergence; running two live contracts indefinitely is the thing to
      avoid.
    ref: "concepts.md#custom-error-envelopes-vs-standard-problem-json"

  - id: error-handling-and-problem-details-073
    difficulty: expert
    tags: [rate-limit, retry-after, precedence, headers]
    question: |
      A 429 response includes both a Retry-After header and IETF RateLimit
      structured-field headers whose reset window differs from Retry-After. Which
      instruction takes precedence for when the client may retry?
    options:
      - "The RateLimit reset window always wins"
      - "Retry-After takes precedence as the authoritative 'do not retry before' instruction; RateLimit fields are informational about the window"
      - "The client should average the two values"
      - "Whichever value is smaller wins"
    answer: 1
    explanation: |
      Per the ratelimit-headers draft, Retry-After is the authoritative back-off
      instruction and takes precedence over the RateLimit effective window on a 429;
      the RateLimit/RateLimit-Policy fields inform the client about quota state.
    ref: "concepts.md#modern-rate-limit-signalling"

  - id: error-handling-and-problem-details-074
    difficulty: advanced
    tags: [rate-limit, structured-fields, standards]
    question: |
      What do the IETF `RateLimit` and `RateLimit-Policy` structured-field headers
      improve over the ad-hoc `X-RateLimit-*` triplet?
    options:
      - "They encrypt the quota values"
      - "They standardize quota advertising/state using HTTP structured fields (policy window/quota via RateLimit-Policy, remaining/reset via RateLimit), replacing reverse-engineered X- headers"
      - "They eliminate the need for a 429 status entirely"
      - "They move rate-limit data into the response body"
    answer: 1
    explanation: |
      The draft standardizes rate-limit signalling with HTTP structured fields:
      RateLimit-Policy advertises the policy (window w, quota q, unit qu, partition
      key pk) and RateLimit reports current state (remaining r, reset t), superseding
      the non-standard X-RateLimit-* headers.
    ref: "concepts.md#modern-rate-limit-signalling"

  - id: error-handling-and-problem-details-075
    difficulty: expert
    tags: [retry, 503-vs-429, semantics]
    question: |
      Why should a client not treat 503 Service Unavailable and 429 Too Many
      Requests identically?
    options:
      - "503 is a 4xx and 429 is a 5xx, so retry rules are reversed"
      - "503 means the server as a whole is down/overloaded (retry the same request later); 429 means this client specifically is over quota (slow down) — conflating them may hammer a recovering service or ignore a per-client limit"
      - "429 is never retryable while 503 always is"
      - "Only 429 may carry Retry-After"
    answer: 1
    explanation: |
      503 signals server-wide unavailability (retry the whole request later); 429
      signals a per-client quota breach (back off). Both can carry Retry-After, but
      treating them the same risks hammering a recovering server or disregarding a
      client-specific limit.
    ref: "concepts.md#retry-semantics-in-depth"

  - id: error-handling-and-problem-details-076
    difficulty: advanced
    tags: [retry, 408, 504, timeouts]
    question: |
      Distinguish the retry implications of 408 Request Timeout, 504 Gateway
      Timeout, and a client-side socket timeout with no response.
    options:
      - "All three mean the request definitely failed and must not be retried"
      - "408 (server gave up waiting for the request) and 504 (an upstream timed out) are retryable; a client-side socket timeout leaves the outcome unknown, so a safe retry needs an idempotency key"
      - "Only 504 is retryable; 408 and socket timeouts are permanent failures"
      - "All three are safe to retry blindly without idempotency keys"
    answer: 1
    explanation: |
      408 means the server timed out waiting for the request (resend it); 504 means
      an upstream timed out (also retryable). A client-side socket timeout gives no
      response, so the side effect may or may not have happened — that indeterminate
      case is where idempotency keys are required.
    ref: "concepts.md#retry-semantics-in-depth"

  - id: error-handling-and-problem-details-077
    difficulty: expert
    tags: [security, bola, 403-vs-404, owasp]
    question: |
      An API returns 403 for objects that exist but the caller can't access, and 404
      for objects that don't exist. Why is this a security problem, and what's the
      fix?
    options:
      - "It isn't a problem; 403-vs-404 is always the correct precise behavior"
      - "It leaks object existence via a 403-vs-404 oracle (a BOLA enumeration channel); the fix is to check permission before existence and return the same response (typically 404) whether the object is missing or forbidden"
      - "The fix is to return 401 for both cases"
      - "The fix is to return 500 for forbidden objects so the reason is hidden"
    answer: 1
    explanation: |
      Distinguishable 403-vs-404 lets an attacker probe which object IDs exist (a
      BOLA channel, OWASP API1:2023). The mitigation, mirroring Google's rule, is to
      check permission before existence and return an indistinguishable response
      (usually 404) for both missing and forbidden objects.
    ref: "concepts.md#security-beyond-leakage"

  - id: error-handling-and-problem-details-078
    difficulty: expert
    tags: [security, 404-vs-403, correctness]
    question: |
      When is returning 404 instead of 403 correct, and when is it a bug?
    options:
      - "Always correct; 404 should replace 403 in every API"
      - "Correct when hiding existence from callers with no right to know it; a bug when it misleads a legitimately authorized user into chasing a resource that actually exists"
      - "Always a bug; 403 should always be used for permission problems"
      - "Correct only for GET requests and a bug for all other methods"
    answer: 1
    explanation: |
      The discriminator is who is asking. Returning 404 to hide existence from
      unauthorized callers is a legitimate security choice; returning it to a
      properly authorized user experiencing a transient issue is a bug that sends
      them chasing a nonexistent resource.
    ref: "concepts.md#security-beyond-leakage"

  - id: error-handling-and-problem-details-079
    difficulty: advanced
    tags: [security, reflection, xss, detail]
    question: |
      A validation error echoes the user's raw input back into the `detail` string,
      which a browser client renders as HTML. What risk does this introduce?
    options:
      - "None; detail is always plain text"
      - "Error-message reflection can enable XSS when unsanitized user input is rendered by the client; sanitize or avoid echoing raw input into human strings"
      - "It causes the response to exceed the maximum body size"
      - "It forces the response to use application/problem+xml"
    answer: 1
    explanation: |
      Echoing unsanitized user input into `detail` that a client renders as HTML is
      a reflection/XSS vector. RFC 9457's security guidance and OWASP both push
      toward sanitizing or not reflecting raw input into human-readable error text.
    ref: "concepts.md#security-beyond-leakage"

  - id: error-handling-and-problem-details-080
    difficulty: advanced
    tags: [content-negotiation, accept, problem-json]
    question: |
      A client sends `Accept: application/json` (not problem+json) and the request
      fails. Per RFC 9457 §3, what may the server do?
    options:
      - "It must return 406 Not Acceptable because problem+json wasn't listed"
      - "It MAY return application/problem+json anyway, since an error is an exceptional condition and forcing a 406 would be unhelpful"
      - "It must strip the media type and return plain text"
      - "It must return the error as application/json with no problem semantics"
    answer: 1
    explanation: |
      RFC 9457 §3 notes a server may return application/problem+json even when it
      isn't in the client's Accept. Errors are exceptional; returning a 406 instead
      of a useful problem document would be counterproductive.
    ref: "concepts.md#content-negotiation-for-error-responses"

  - id: error-handling-and-problem-details-081
    difficulty: expert
    tags: [scenario, intermediaries, gateway, contract]
    question: |
      A gateway rewrites your 500 to a 502 and strips your problem+json body before
      it reaches the client. Which part of a well-designed error contract is most
      likely to survive such intermediary interference?
    options:
      - "The body `status` member, because it duplicates the code"
      - "Nothing survives; the contract is entirely lost"
      - "A correlation/trace id echoed in a widely-propagated response header, since intermediaries generally preserve standard headers even when they alter status and body"
      - "The `type` URI, because gateways always preserve JSON bodies"
    answer: 2
    explanation: |
      When an intermediary changes the status and drops the body, body fields (type,
      status, detail) are lost. A correlation/trace id carried in a standard,
      commonly-forwarded header is the most likely artifact to survive, keeping
      debuggability intact — reinforcing why the id belongs in both header and body.
    ref: "concepts.md#correlation-and-trace-ids-in-errors"

  - id: error-handling-and-problem-details-082
    difficulty: expert
    tags: [scenario, unify, rest-graphql-grpc]
    question: |
      An organization exposes the same domain over REST, GraphQL, and gRPC and wants
      one coherent error model. Which approach is soundest?
    options:
      - "Force GraphQL and gRPC to adopt HTTP status codes verbatim, including on the GraphQL response line"
      - "Define one internal error taxonomy (stable reason codes + structured metadata) and render it per-protocol: problem+json for REST, `errors[]`/extensions.code for GraphQL, google.rpc.Status for gRPC — accepting that GraphQL execution errors ride in a 200 body"
      - "Pick REST as canonical and drop error detail from the other two"
      - "Use a different, unrelated code set per protocol so each feels native"
    answer: 1
    explanation: |
      The durable design is one internal taxonomy of stable reason codes plus
      structured data, mapped onto each protocol's native error envelope. The
      unavoidable mismatch is GraphQL's HTTP-200 field-level errors, which you
      surface via extensions.code rather than the status line.
    ref: "concepts.md#stable-error-codes-at-scale"

  - id: error-handling-and-problem-details-083
    difficulty: advanced
    tags: [scenario, message-parsing, params, google]
    question: |
      A client greps `detail` for the substring "expired" to decide whether to
      prompt re-authentication. The API then localizes `detail` to Spanish and the
      client silently breaks. What is the correct fix on the server side?
    options:
      - "Keep detail in English forever so grep keeps working"
      - "Emit a stable machine code (e.g., reason CREDENTIAL_EXPIRED) plus any dynamic values in structured metadata, so clients branch structurally and never parse the human message"
      - "Return the message in both English and Spanish so grep still matches"
      - "Move the message into an HTTP header instead of the body"
    answer: 1
    explanation: |
      The human message is not a contract. The fix is a stable code/reason plus
      structured metadata for any dynamic values; clients branch on the code and
      never parse localized human text. This is exactly the ErrorInfo metadata rule.
    ref: "concepts.md#stable-error-codes-at-scale"
