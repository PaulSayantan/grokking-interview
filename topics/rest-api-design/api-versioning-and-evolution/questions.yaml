topic: "API Versioning & Evolution"
domain: rest-api-design
topic_slug: api-versioning-and-evolution
version: 1
questions:
  - id: api-versioning-and-evolution-001
    difficulty: beginner
    tags: [why-version, contract, maintenance]
    question: |
      Why can't a public API simply change its response contract in place instead
      of introducing versions?
    options:
      - "Clients you do not control (mobile apps, partner jobs) cannot all upgrade instantly, so old and new contracts must coexist during a transition"
      - "HTTP forbids changing a response body once a URL is published"
      - "Load balancers cache the first response shape permanently"
      - "JSON schemas are immutable once serialized"
    answer: 0
    explanation: |
      Versioning exists because consumers upgrade on their own schedule. A native app
      in the field or a partner's nightly job may run unchanged for months, so the server
      must serve old and new contracts simultaneously during a migration window.
    ref: "concepts.md#why-version-an-api-and-what-it-costs"

  - id: api-versioning-and-evolution-002
    difficulty: beginner
    tags: [why-version, cost]
    question: |
      Which statement best captures the mature industry stance on API versioning?
    options:
      - "Version aggressively — bump the major version on every change to stay safe"
      - "Version rarely, evolve constantly — make additive changes and reserve version bumps for true breaking changes"
      - "Never version; always mutate the contract in place"
      - "Only date-based versioning is acceptable for any API"
    answer: 1
    explanation: |
      Each live version multiplies maintenance, docs, tests, and support cost. Mature
      APIs (Stripe, GitHub, Google, AWS) evolve additively and reserve explicit version
      bumps for genuinely breaking changes.
    ref: "concepts.md#why-version-an-api-and-what-it-costs"

  - id: api-versioning-and-evolution-003
    difficulty: beginner
    tags: [breaking-changes, additive]
    question: |
      Which of the following is a NON-breaking (backward-compatible) change to a REST API?
    options:
      - "Renaming the response field `name` to `fullName`"
      - "Changing a field's type from string to number"
      - "Adding a new optional field to a response body"
      - "Making a previously optional request parameter required"
    answer: 2
    explanation: |
      Adding an optional field to a response is additive; tolerant clients ignore what
      they do not read. Renaming, changing types, and adding required inputs all break
      existing clients.
    ref: "concepts.md#breaking-vs-non-breaking-changes"

  - id: api-versioning-and-evolution-004
    difficulty: beginner
    tags: [breaking-changes]
    question: |
      Which change is definitely BREAKING?
    options:
      - "Adding a brand-new endpoint"
      - "Adding a new optional query parameter with a default"
      - "Adding a new optional response header"
      - "Removing a field from a response body"
    answer: 3
    explanation: |
      Removing a field breaks any client that reads it. Adding endpoints, optional
      parameters, and optional response headers are all additive/non-breaking.
    ref: "concepts.md#breaking-vs-non-breaking-changes"

  - id: api-versioning-and-evolution-005
    difficulty: intermediate
    tags: [breaking-changes, validation]
    question: |
      A team relaxes validation so an endpoint now accepts a wider range of input than
      before (e.g., a formerly-required field becomes optional). Is this breaking?
    options:
      - "No — loosening validation (accepting more input) is backward-compatible; tightening it would be breaking"
      - "Yes — any validation change is breaking"
      - "Yes — because it changes the request schema"
      - "It is only breaking if the endpoint is a POST"
    answer: 0
    explanation: |
      Accepting more than before does not invalidate any existing valid request, so it
      is non-breaking. Tightening validation (rejecting input that used to be accepted)
      is the breaking direction.
    ref: "concepts.md#breaking-vs-non-breaking-changes"

  - id: api-versioning-and-evolution-006
    difficulty: advanced
    tags: [breaking-changes, enums, tolerant-reader]
    question: |
      Under what condition is adding a new value to a RESPONSE enum a non-breaking change?
    options:
      - "It is always non-breaking because you are only adding"
      - "Only if clients were told up front to tolerate unknown enum values; otherwise strict clients that exhaustively switch on the known set will break"
      - "Never — adding enum values is always breaking"
      - "Only if the new value is added at the end of the list"
    answer: 1
    explanation: |
      A strict client that does a switch/case over the known enum values and throws on
      "unknown" will break when a new value appears. It is only safe if tolerant-reader
      behavior (handle unknowns gracefully) was mandated in the contract beforehand.
    ref: "concepts.md#breaking-vs-non-breaking-changes"

  - id: api-versioning-and-evolution-007
    difficulty: intermediate
    tags: [request, breaking-changes]
    question: |
      Adding a new field to a REQUEST body is safe (non-breaking) only when:
    options:
      - "the field is required so clients are forced to send it"
      - "the endpoint uses PUT rather than POST"
      - "the field is optional with a sensible default"
      - "the field name starts with an underscore"
    answer: 2
    explanation: |
      Adding a required request field breaks every existing client that does not send it.
      Only an optional field with a default keeps old requests valid.
    ref: "concepts.md#breaking-vs-non-breaking-changes"

  - id: api-versioning-and-evolution-008
    difficulty: intermediate
    tags: [backward-compatibility, forward-compatibility]
    question: |
      What does BACKWARD compatibility mean for an API?
    options:
      - "An old client can process data produced by a newer server"
      - "The API supports both JSON and XML"
      - "Old versions are permanently frozen and never touched"
      - "A new server version can still correctly serve requests written for the old contract (old clients keep working)"
    answer: 3
    explanation: |
      Backward compatibility looks back at older clients: a new server still honors the
      old contract. That is the server's responsibility, protected by additive changes.
    ref: "concepts.md#backward-vs-forward-compatibility"

  - id: api-versioning-and-evolution-009
    difficulty: intermediate
    tags: [forward-compatibility, tolerant-reader]
    question: |
      FORWARD compatibility is best described as:
    options:
      - "An old client gracefully handling data produced by a newer server (e.g., ignoring unknown fields)"
      - "A new server serving old clients"
      - "Automatically upgrading all clients to the latest version"
      - "Serializing responses in a future-proof binary format"
    answer: 0
    explanation: |
      Forward compatibility looks forward at newer data: an old client survives fields
      it does not recognize. It is achieved by how the client is written (tolerant reader),
      which the server enables by making only additive changes.
    ref: "concepts.md#backward-vs-forward-compatibility"

  - id: api-versioning-and-evolution-010
    difficulty: intermediate
    tags: [backward-compatibility, responsibility]
    question: |
      Which party is primarily responsible for each compatibility property?
    options:
      - "Backward compatibility is the client's job; forward compatibility is the server's job"
      - "Backward compatibility is the server's job (don't break old requests); forward compatibility is achieved when clients are built as tolerant readers"
      - "Both are solely the gateway's responsibility"
      - "Both are guaranteed automatically by using HTTPS"
    answer: 1
    explanation: |
      The server protects backward compatibility by not breaking old requests; forward
      compatibility depends on clients tolerating additive change (ignoring unknowns).
    ref: "concepts.md#backward-vs-forward-compatibility"

  - id: api-versioning-and-evolution-011
    difficulty: beginner
    tags: [postels-law, tolerant-reader]
    question: |
      Postel's Law (the Robustness Principle) states:
    options:
      - "Be liberal in what you send, conservative in what you accept"
      - "Reject any input that does not match the schema exactly"
      - "Be conservative in what you send, be liberal in what you accept"
      - "Always send every field even if empty"
    answer: 2
    explanation: |
      "Be conservative in what you send, be liberal in what you accept." Applied to APIs
      it motivates the Tolerant Reader pattern.
    ref: "concepts.md#tolerant-reader-and-postels-law"

  - id: api-versioning-and-evolution-012
    difficulty: intermediate
    tags: [tolerant-reader]
    question: |
      Which behavior characterizes a Tolerant Reader client?
    options:
      - "It validates the entire payload against a strict schema and fails on any unexpected field"
      - "It requires fields to arrive in a fixed order"
      - "It rejects the response if any optional field is missing"
      - "It extracts only the data it needs and ignores everything else, including unknown fields"
    answer: 3
    explanation: |
      A tolerant reader reads only what it needs and ignores the rest, so additive
      server changes do not break it. This is Martin Fowler's Tolerant Reader pattern.
    ref: "concepts.md#tolerant-reader-and-postels-law"

  - id: api-versioning-and-evolution-013
    difficulty: advanced
    tags: [postels-law, robustness, rfc9413]
    question: |
      What is the well-known downside of applying Postel's Law too aggressively, per
      modern guidance (RFC 9413)?
    options:
      - "Being too liberal in what you accept hides bugs, lets malformed data propagate, and can create security ambiguity between parsers"
      - "It makes responses larger"
      - "It forces every client to use the same programming language"
      - "It prevents caching entirely"
    answer: 0
    explanation: |
      Excess tolerance masks bugs and can create parsing inconsistencies (e.g., gateway
      vs backend) with security implications. RFC 9413 recommends tolerating additive
      evolution while staying strict about clearly invalid input.
    ref: "concepts.md#tolerant-reader-and-postels-law"

  - id: api-versioning-and-evolution-014
    difficulty: intermediate
    tags: [tolerant-reader, incident]
    question: |
      A server adds a new field `loyaltyTier` to its user response. One client crashes
      in production; another is unaffected. What most likely distinguishes them?
    options:
      - "The crashing client used HTTP/2 and the other used HTTP/1.1"
      - "The crashing client's deserializer is configured to fail on unknown properties; the other ignores unknown fields (tolerant reader)"
      - "The crashing client requested XML"
      - "The unaffected client disabled TLS certificate checks"
    answer: 1
    explanation: |
      This is the classic "just adding a field broke prod" scenario: strict deserializers
      that reject unknown properties fail, while tolerant readers that ignore unknowns keep
      working.
    ref: "concepts.md#tolerant-reader-and-postels-law"

  - id: api-versioning-and-evolution-015
    difficulty: beginner
    tags: [uri-path-versioning]
    question: |
      Which is an example of URI path versioning?
    options:
      - "Accept: application/vnd.example+json; version=2"
      - "X-API-Version: 2"
      - "GET /v2/users/42"
      - "GET /users/42?api-version=2"
    answer: 2
    explanation: |
      URI path versioning embeds the version in the path, e.g. /v2/users/42.
    ref: "concepts.md#uri-path-versioning"

  - id: api-versioning-and-evolution-016
    difficulty: intermediate
    tags: [uri-path-versioning, tradeoffs]
    question: |
      What is the main theoretical (REST-purist) objection to URI path versioning?
    options:
      - "It cannot be cached"
      - "It requires custom headers that browsers cannot send"
      - "It only works over HTTP/2"
      - "A URI should identify a resource, not a representation version, so /v1/users/42 and /v2/users/42 describe the same resource with a version leaked into the identifier"
    answer: 3
    explanation: |
      Purists (Fielding, the HATEOAS camp) object that the version is a representation
      concern that does not belong in the resource identifier. Despite this, path
      versioning is the most common pragmatic choice.
    ref: "concepts.md#uri-path-versioning"

  - id: api-versioning-and-evolution-017
    difficulty: intermediate
    tags: [uri-path-versioning, caching]
    question: |
      Which is a genuine PRACTICAL advantage of URI path versioning?
    options:
      - "Distinct versions are distinct URLs, giving unambiguous cache keys and simple gateway routing"
      - "It hides the version from logs for security"
      - "It automatically makes all changes backward compatible"
      - "It removes the need for documentation"
    answer: 0
    explanation: |
      Because each version is a different URL, caches key on it naturally and gateways can
      route by path prefix. It is also the most visible/testable approach.
    ref: "concepts.md#uri-path-versioning"

  - id: api-versioning-and-evolution-018
    difficulty: intermediate
    tags: [query-param-versioning, caching]
    question: |
      A common drawback of query-parameter versioning (e.g. `?api-version=2`) is:
    options:
      - "It changes the base resource path on every call"
      - "Caching is muddier — caches must include the query string in the key and some intermediaries handle query-only differences inconsistently"
      - "It cannot be used by any major cloud provider"
      - "It requires a vendor media type"
    answer: 1
    explanation: |
      Query-param versioning keeps a stable path but complicates caching (query must be in
      the cache key) and is easy to drop accidentally. Azure and AWS query-protocol APIs
      use it.
    ref: "concepts.md#query-parameter-versioning"

  - id: api-versioning-and-evolution-019
    difficulty: beginner
    tags: [query-param-versioning]
    question: |
      Which major cloud platform requires an `api-version` query parameter on most of its
      REST calls?
    options:
      - "GitHub"
      - "Stripe"
      - "Microsoft Azure"
      - "Twilio"
    answer: 2
    explanation: |
      Azure REST APIs require an `api-version` query parameter (typically date-based) on
      most requests.
    ref: "concepts.md#query-parameter-versioning"

  - id: api-versioning-and-evolution-020
    difficulty: intermediate
    tags: [custom-header-versioning, rfc6648]
    question: |
      Which statement about custom-header versioning (e.g. `X-API-Version: 2`) is correct?
    options:
      - "The `X-` prefix convention is now recommended by the IETF"
      - "It makes the endpoint automatically RESTful and cacheable with no extra work"
      - "Browsers set version headers automatically"
      - "It keeps the URL clean but is invisible in the URL, and caches need a correct `Vary` header to avoid serving the wrong version"
    answer: 3
    explanation: |
      Header versioning keeps the resource URL clean but the version is hidden (bad for
      testing/logging) and requires `Vary` for cache correctness. RFC 6648 actually
      deprecates the `X-` prefix convention.
    ref: "concepts.md#custom-header-versioning"

  - id: api-versioning-and-evolution-021
    difficulty: intermediate
    tags: [custom-header-versioning, stripe]
    question: |
      Stripe's versioning approach is a well-known example of:
    options:
      - "A pinned default version per account, overridable per request via a `Stripe-Version` header (date-based)"
      - "URI path versioning with /v1, /v2 in the path only"
      - "Media-type versioning only"
      - "No versioning at all"
    answer: 0
    explanation: |
      Stripe pins an account default version and lets an individual request override it
      with a `Stripe-Version: <date>` header — a header + date-based scheme.
    ref: "concepts.md#custom-header-versioning"

  - id: api-versioning-and-evolution-022
    difficulty: intermediate
    tags: [media-type-versioning, content-negotiation]
    question: |
      Media-type (content negotiation) versioning expresses the version through:
    options:
      - "the path segment /v2"
      - "a vendor media type in the `Accept` header, e.g. `Accept: application/vnd.example.user+json; version=2`"
      - "a cookie"
      - "the HTTP method"
    answer: 1
    explanation: |
      It uses HTTP content negotiation with a vendor (`vnd.`) media type in `Accept`, the
      most REST-purist approach.
    ref: "concepts.md#media-type-content-negotiation-versioning"

  - id: api-versioning-and-evolution-023
    difficulty: advanced
    tags: [media-type-versioning, status-codes]
    question: |
      Using media-type versioning, a client sends `Accept: application/vnd.example.user+json; version=99`
      but the server supports only versions 1–3. What is the most appropriate response?
    options:
      - "200 OK with version 3 silently substituted"
      - "301 Moved Permanently"
      - "406 Not Acceptable, because no representation matches the requested media type"
      - "204 No Content"
    answer: 2
    explanation: |
      With content negotiation, when the server cannot satisfy the `Accept` header the
      correct response is 406 Not Acceptable. Silently substituting a different version is
      an anti-pattern.
    ref: "concepts.md#media-type-content-negotiation-versioning"

  - id: api-versioning-and-evolution-024
    difficulty: intermediate
    tags: [media-type-versioning, rest]
    question: |
      Why is media-type versioning considered the most RESTful strategy?
    options:
      - "Because it puts the version in the URL where it is most visible"
      - "Because it is the easiest to test from a browser address bar"
      - "Because it requires no `Vary` header"
      - "Because it separates the resource (URI) from its representation/version (media type), using HTTP content negotiation as designed"
    answer: 3
    explanation: |
      It keeps the URI identifying the resource and negotiates the representation via the
      `Accept` header, matching REST's model. The trade-off is low discoverability and high
      ceremony.
    ref: "concepts.md#media-type-content-negotiation-versioning"

  - id: api-versioning-and-evolution-025
    difficulty: intermediate
    tags: [comparing-strategies, tradeoffs]
    question: |
      Considering the trade-off matrix, which versioning strategy is BEST for both
      discoverability and simple caching, at the cost of being the least RESTful?
    options:
      - "URI path versioning"
      - "Media-type versioning"
      - "Custom header versioning"
      - "Query parameter versioning"
    answer: 0
    explanation: |
      URI path versioning is highly discoverable and caches simply (distinct URLs), but
      leaks a representation concern into the identifier, making it the least RESTful.
    ref: "concepts.md#comparing-versioning-strategies"

  - id: api-versioning-and-evolution-026
    difficulty: advanced
    tags: [comparing-strategies, caching, vary]
    question: |
      For BOTH custom-header and media-type versioning, what must the server do so shared
      caches do not serve the wrong version?
    options:
      - "Disable caching entirely with `Cache-Control: no-store`"
      - "Set an appropriate `Vary` header (e.g. `Vary: Accept` or `Vary: X-API-Version`) so caches key on the version"
      - "Add the version to the response body"
      - "Return 304 Not Modified for every request"
    answer: 1
    explanation: |
      When the version is not in the URL, the cache key must include the varying header.
      `Vary` tells shared caches which request headers affect the response.
    ref: "concepts.md#comparing-versioning-strategies"

  - id: api-versioning-and-evolution-027
    difficulty: beginner
    tags: [semver]
    question: |
      In Semantic Versioning (MAJOR.MINOR.PATCH), which number is incremented for a
      backward-incompatible (breaking) change?
    options:
      - "PATCH"
      - "MINOR"
      - "MAJOR"
      - "A separate BUILD number"
    answer: 2
    explanation: |
      MAJOR is bumped for incompatible changes, MINOR for backward-compatible features,
      PATCH for backward-compatible bug fixes.
    ref: "concepts.md#semantic-versioning-for-apis"

  - id: api-versioning-and-evolution-028
    difficulty: intermediate
    tags: [semver, api-contract]
    question: |
      For a public web API, why is usually only the MAJOR number exposed in the contract
      (e.g. `/v2`) rather than the full `MAJOR.MINOR.PATCH`?
    options:
      - "Because minor and patch numbers are secret"
      - "Because URLs cannot contain dots"
      - "Because caching requires a single-digit version"
      - "Because MAJOR is the only number a client must react to; minor/patch are additive and should be invisible to well-behaved clients"
    answer: 3
    explanation: |
      Clients only need to change their integration on a breaking (MAJOR) bump. Exposing
      minor/patch in the URL (e.g. /v2.3.1) defeats the purpose since those are absorbable
      without action.
    ref: "concepts.md#semantic-versioning-for-apis"

  - id: api-versioning-and-evolution-029
    difficulty: intermediate
    tags: [semver, date-versioning]
    question: |
      Date-based versioning (e.g. Stripe's `2023-10-16`, Azure's `2023-10-01`) is best
      understood as:
    options:
      - "Essentially an ever-incrementing major version keyed by release date, pinning a client to the API as it behaved on that day"
      - "A way to avoid ever making breaking changes"
      - "The same as PATCH-level SemVer"
      - "A caching directive"
    answer: 0
    explanation: |
      A date is monotonic and human-meaningful; it pins a client to the API's behavior on
      that date and functions like a date-keyed major version, pairing naturally with header
      versioning.
    ref: "concepts.md#semantic-versioning-for-apis"

  - id: api-versioning-and-evolution-030
    difficulty: intermediate
    tags: [semver, gotcha]
    question: |
      Should you expose an API URL like `/v1.2/users`?
    options:
      - "Yes — clients need to know the exact minor version"
      - "No — exposing minor/patch in the contract defeats the purpose; clients should only need to change on a MAJOR bump"
      - "Yes — but only for internal APIs"
      - "Only if the API uses XML"
    answer: 1
    explanation: |
      Minor and patch changes are, by definition, absorbable without client action. Putting
      them in the URL forces needless churn. Only MAJOR belongs in the exposed contract.
    ref: "concepts.md#semantic-versioning-for-apis"

  - id: api-versioning-and-evolution-031
    difficulty: intermediate
    tags: [version-negotiation, defaults]
    question: |
      When a client omits the version, which default behavior is SAFEST?
    options:
      - "Always serve the latest major version so clients get new features automatically"
      - "Return 500 until a version is supplied"
      - "Pin to a specific default (e.g. the newest at account/key creation) or require the version explicitly, so a new major cannot silently break clients"
      - "Randomly pick a supported version per request"
    answer: 2
    explanation: |
      Defaulting to "latest" means a new breaking major can silently break clients who never
      opted in. Pinning a stable default (Stripe's approach) or requiring the version is safer.
    ref: "concepts.md#version-negotiation-and-defaults"

  - id: api-versioning-and-evolution-032
    difficulty: intermediate
    tags: [version-negotiation, status-codes]
    question: |
      A client sends `?api-version=abc` (a malformed/unknown version parameter). Which
      status code is most appropriate?
    options:
      - "406 Not Acceptable"
      - "301 Moved Permanently"
      - "200 OK with the latest version"
      - "400 Bad Request"
    answer: 3
    explanation: |
      A bad or unknown version *parameter* is a malformed request → 400. (406 is reserved for
      media-type content negotiation that cannot be satisfied.) Never silently fall back.
    ref: "concepts.md#version-negotiation-and-defaults"

  - id: api-versioning-and-evolution-033
    difficulty: advanced
    tags: [version-negotiation, anti-pattern]
    question: |
      When a server cannot honor a requested version, why is silently falling back to a
      different version an anti-pattern?
    options:
      - "The client believes it is talking to one contract while actually receiving another, causing subtle data-corruption bugs that are hard to diagnose"
      - "It uses more bandwidth"
      - "It is prohibited by TLS"
      - "It always causes an infinite redirect loop"
    answer: 0
    explanation: |
      Silent fallback hides the mismatch: the client parses data under the wrong contract's
      assumptions, producing subtle, hard-to-trace failures. Respond with a clear error (400/406)
      instead.
    ref: "concepts.md#version-negotiation-and-defaults"

  - id: api-versioning-and-evolution-034
    difficulty: intermediate
    tags: [deprecation-header, rfc9745]
    question: |
      Which RFC standardizes the `Deprecation` HTTP response header field, and what is its
      value type?
    options:
      - "RFC 8594; the value is an HTTP-date"
      - "RFC 9745 (Standards Track, 2025); the value is a Structured-Fields Date, e.g. `Deprecation: @1688169599`"
      - "RFC 7807; the value is a boolean `true`"
      - "RFC 8288; the value is a URI"
    answer: 1
    explanation: |
      RFC 9745 (March 2025, Standards Track) defines `Deprecation` as an Item Structured
      Field whose value is a Date, written as `@<unix-seconds>`. Earlier drafts used a
      boolean; that form is obsolete.
    ref: "concepts.md#deprecation-policy-deprecation-and-sunset-headers"

  - id: api-versioning-and-evolution-035
    difficulty: intermediate
    tags: [sunset-header, rfc8594]
    question: |
      Which RFC defines the `Sunset` header, and what does it signal?
    options:
      - "RFC 9745; it signals the current server time"
      - "RFC 9110; it signals a cache expiry only"
      - "RFC 8594 (Informational, 2019); it gives an HTTP-date after which the resource is expected to become unresponsive"
      - "RFC 6648; it deprecates the resource path prefix"
    answer: 2
    explanation: |
      RFC 8594 defines `Sunset` as an HTTP-date marking when the resource is expected to stop
      working. It is Informational, published May 2019.
    ref: "concepts.md#deprecation-policy-deprecation-and-sunset-headers"

  - id: api-versioning-and-evolution-036
    difficulty: advanced
    tags: [deprecation-header, sunset-header, formats]
    question: |
      A key gotcha is that the `Deprecation` and `Sunset` headers use DIFFERENT date formats.
      Which pairing is correct?
    options:
      - "Both use HTTP-date, e.g. `Deprecation: Wed, 30 Jun 2027 ... GMT`"
      - "Both use Unix timestamps prefixed with `@`"
      - "`Deprecation` uses an HTTP-date; `Sunset` uses a boolean"
      - "`Deprecation` uses a Structured-Fields Date (`@<unix-seconds>`); `Sunset` uses an HTTP-date (`Wed, 30 Jun 2027 23:59:59 GMT`)"
    answer: 3
    explanation: |
      RFC 9745's `Deprecation` is a structured-fields Date (`@1688169599`), while RFC 8594's
      `Sunset` predates structured fields and uses the classic HTTP-date format. Confusing them
      is a common mistake.
    ref: "concepts.md#deprecation-policy-deprecation-and-sunset-headers"

  - id: api-versioning-and-evolution-037
    difficulty: intermediate
    tags: [deprecation-header, sunset-header, ordering]
    question: |
      What ordering constraint holds between the `Deprecation` and `Sunset` dates?
    options:
      - "Sunset MUST NOT be earlier than the Deprecation date — you cannot remove something before you deprecate it"
      - "Sunset must be earlier than Deprecation"
      - "They must be exactly equal"
      - "There is no relationship between them"
    answer: 0
    explanation: |
      A resource is deprecated first, then removed. The Sunset time must not precede the
      Deprecation time.
    ref: "concepts.md#deprecation-policy-deprecation-and-sunset-headers"

  - id: api-versioning-and-evolution-038
    difficulty: advanced
    tags: [deprecation, status-codes]
    question: |
      A deprecated endpoint is still fully operational today. What status code should it
      return, and what after its sunset date passes?
    options:
      - "It should return 299 while deprecated, then 500 after sunset"
      - "It still returns its normal 200 (with advisory Deprecation/Sunset headers); after the sunset date, 410 Gone (permanent) or 404 is appropriate"
      - "It should return 400 immediately once deprecated"
      - "It should return 301 permanently the moment it is deprecated"
    answer: 1
    explanation: |
      Deprecation does not change the status code — the endpoint keeps returning 200 and just
      carries advisory headers. Once removed at/after sunset, 410 Gone (or 404) is correct.
    ref: "concepts.md#deprecation-policy-deprecation-and-sunset-headers"

  - id: api-versioning-and-evolution-039
    difficulty: intermediate
    tags: [link-header, rfc8288]
    question: |
      Per RFC 8288 (Web Linking), how should an API point a client to human documentation
      about a deprecation and to the replacement resource?
    options:
      - "Put a URL in the response body's `_docs` field only"
      - "Use a custom `X-Docs` header"
      - "Use `Link` headers, e.g. `rel=\"deprecation\"` for the docs and `rel=\"successor-version\"` for the replacement"
      - "Redirect with 302 to the docs page"
    answer: 2
    explanation: |
      RFC 8288 `Link` headers carry these relations: `rel="deprecation"` points to the docs;
      `rel="successor-version"`/`rel="latest-version"` (RFC 5829) point to the replacement.
    ref: "concepts.md#deprecation-policy-deprecation-and-sunset-headers"

  - id: api-versioning-and-evolution-040
    difficulty: intermediate
    tags: [deprecation-policy, communication]
    question: |
      Why is it insufficient to signal deprecation only via HTTP response headers?
    options:
      - "Headers are stripped by all proxies"
      - "Headers cannot express dates"
      - "It violates RFC 9110 to use headers for this"
      - "Many clients never log or inspect response headers, so you must also use human channels: changelog, email, dashboard warnings, SDK notices"
    answer: 3
    explanation: |
      Machine-readable headers are easily ignored by clients that do not inspect responses.
      A real deprecation policy pairs headers with human-facing notices.
    ref: "concepts.md#deprecation-policy-deprecation-and-sunset-headers"

  - id: api-versioning-and-evolution-041
    difficulty: intermediate
    tags: [evolving-without-versioning, expand-contract]
    question: |
      You must rename the response field `name` to `fullName` without breaking clients.
      Which technique achieves this?
    options:
      - "Expand/contract (parallel change): add `fullName` while still returning `name`, migrate clients, then remove `name` only after telemetry shows no usage"
      - "Immediately delete `name` and add `fullName` in a hotfix"
      - "Bump to /v2 and force everyone to migrate on the same day"
      - "Return both fields forever with no plan to remove either"
    answer: 0
    explanation: |
      Expand/contract adds the new field alongside the old, lets clients migrate, and removes
      the old field only after confirming no one uses it — avoiding a breaking change and a
      version bump.
    ref: "concepts.md#evolving-an-api-without-versioning"

  - id: api-versioning-and-evolution-042
    difficulty: intermediate
    tags: [evolving-without-versioning, additive]
    question: |
      Which combination lets a mature API avoid most version bumps entirely?
    options:
      - "Frequent major bumps plus strict schema validation on clients"
      - "Additive-only changes plus tolerant readers plus expand/contract for the rare rename"
      - "Removing unused fields aggressively to keep payloads small"
      - "Requiring all clients to send every field on every request"
    answer: 1
    explanation: |
      Additive changes + tolerant readers + expand/contract cover the vast majority of
      evolution needs without a new version. Reserve explicit versions for truly unavoidable
      breaking changes.
    ref: "concepts.md#evolving-an-api-without-versioning"

  - id: api-versioning-and-evolution-043
    difficulty: advanced
    tags: [evolving-without-versioning, hateoas]
    question: |
      How does HATEOAS (hypermedia) theoretically help evolve an API without versioning?
    options:
      - "It compresses responses so changes are invisible"
      - "It forces clients to cache every response"
      - "If clients follow server-provided links instead of hardcoding URLs, endpoints can be moved or restructured without breaking clients"
      - "It automatically converts breaking changes into non-breaking ones"
    answer: 2
    explanation: |
      When clients discover URLs by following links, the server can relocate/restructure
      resources without breaking them. It is the theoretical ideal, though rarely fully
      realized in practice.
    ref: "concepts.md#evolving-an-api-without-versioning"

  - id: api-versioning-and-evolution-044
    difficulty: intermediate
    tags: [evolving-without-versioning, graphql]
    question: |
      How do schema-based APIs like GraphQL typically evolve without a global version bump?
    options:
      - "By putting /v2 in the query string"
      - "By rejecting all queries that use old fields"
      - "By returning 410 Gone for deprecated fields immediately"
      - "By marking a field `@deprecated` and adding a replacement, letting clients migrate to the new field at their own pace"
    answer: 3
    explanation: |
      GraphQL uses field-level `@deprecated` markers plus additive new fields; clients that
      request the new field migrate independently — no global version.
    ref: "concepts.md#evolving-an-api-without-versioning"

  - id: api-versioning-and-evolution-045
    difficulty: advanced
    tags: [evolving-without-versioning, feature-flags]
    question: |
      A team wants clients to opt into new behavior when ready rather than having it forced on
      them. Which technique fits, and how does it differ from a version bump?
    options:
      - "Feature flags / capability negotiation: new behavior is gated behind an opt-in flag or header, so clients pull it when ready instead of a global push"
      - "A mandatory major version — it is identical to feature flags"
      - "Deleting the old behavior so clients are forced to adapt"
      - "Randomly enabling new behavior for a percentage of requests without telling clients"
    answer: 0
    explanation: |
      Feature flags let clients opt in to new behavior on their timeline, unlike a global
      version bump that changes the contract for everyone at once.
    ref: "concepts.md#evolving-an-api-without-versioning"

  - id: api-versioning-and-evolution-046
    difficulty: intermediate
    tags: [why-version, internal-vs-public]
    question: |
      Compared with public APIs, why can internal microservice APIs often evolve faster?
    options:
      - "Internal APIs never break"
      - "You control both ends and can coordinate deploys, so old/new do not need to coexist as long — though additive/tolerant patterns still help"
      - "Internal APIs are exempt from HTTP semantics"
      - "Internal APIs cannot be versioned at all"
    answer: 1
    explanation: |
      Owning both client and server lets you coordinate migrations and shorten transition
      windows. Public APIs need longer deprecation runways and stronger guarantees. Additive
      and tolerant patterns still apply internally.
    ref: "concepts.md#why-version-an-api-and-what-it-costs"

  - id: api-versioning-and-evolution-047
    difficulty: advanced
    tags: [breaking-changes, scenario]
    question: |
      A proposed change alters an existing response field `amount` from cents (integer) to a
      decimal dollars string, keeping the same field name. Which statement is correct?
    options:
      - "Non-breaking, because the field name did not change"
      - "Non-breaking, because numbers and strings are interchangeable in JSON"
      - "Breaking — changing a field's type and units silently misinterprets existing clients' parsing; use a new parallel field (expand/contract) or a major version"
      - "Non-breaking as long as it is documented in the changelog"
    answer: 2
    explanation: |
      Same name but different type AND units is a classic silent breaking change: clients keep
      parsing `amount` under old assumptions and corrupt data. Introduce a new field alongside
      or bump the major version.
    ref: "concepts.md#breaking-vs-non-breaking-changes"

  - id: api-versioning-and-evolution-048
    difficulty: advanced
    tags: [comparing-strategies, scenario, tradeoffs]
    question: |
      A payments company must let integrators pin to a fixed API snapshot for years, keep
      resource URLs clean, and allow different clients to run different versions concurrently.
      Which approach best fits?
    options:
      - "URI path versioning with a big-bang /v2 for every change"
      - "No versioning; mutate the contract in place and rely on clients to keep up"
      - "Query-parameter versioning only, with 'latest' as the default when omitted"
      - "A header/date-based scheme (pinned default per account, per-request override header), which keeps URLs clean and pins clients to a dated snapshot"
    answer: 3
    explanation: |
      This is essentially Stripe's model: a header/date scheme keeps URLs clean, pins each
      integrator to a dated snapshot, and lets different clients run different versions
      concurrently. Defaulting to 'latest' when the version is omitted is unsafe here.
    ref: "concepts.md#comparing-versioning-strategies"

  - id: api-versioning-and-evolution-049
    difficulty: beginner
    tags: [deprecation-header, link-header]
    question: |
      Given this response, what is being communicated?

      ```
      HTTP/1.1 200 OK
      Deprecation: @1688169599
      Sunset: Wed, 30 Jun 2027 23:59:59 GMT
      Link: <https://developer.example.com/deprecation>; rel="deprecation"
      ```
    options:
      - "The endpoint is deprecated (as of the Deprecation date), still works now, is expected to stop working by the Sunset date, and links to migration docs"
      - "The endpoint is already removed and returns cached data"
      - "The request was malformed"
      - "The server is asking the client to authenticate"
    answer: 0
    explanation: |
      A 200 with Deprecation + Sunset + a `rel="deprecation"` Link means: still operational,
      but deprecated, with a planned removal date and docs pointing to the migration path.
    ref: "concepts.md#deprecation-policy-deprecation-and-sunset-headers"

  - id: api-versioning-and-evolution-050
    difficulty: intermediate
    tags: [tolerant-reader, guidance]
    question: |
      Which piece of guidance should an API publish UP FRONT so that future additive changes
      remain safe for clients?
    options:
      - "Clients must reject any response containing an unrecognized field"
      - "Clients should ignore unknown fields, not depend on field order, and handle unknown enum values gracefully"
      - "Clients must send every possible field on every request"
      - "Clients should hardcode all resource URLs for performance"
    answer: 1
    explanation: |
      Publishing tolerant-reader expectations (ignore unknown fields, no order dependence,
      handle unknown enums) makes later additive changes safe by contract.
    ref: "concepts.md#tolerant-reader-and-postels-law"

  - id: api-versioning-and-evolution-051
    difficulty: expert
    tags: [compatibility-axes, aip-180, semantic]
    question: |
      A team changes a Protobuf-backed API so a field that returned an `int32` now returns an
      `int64` with a new tag number, while keeping the field name and JSON output shape
      identical for values that still fit in 32 bits. Applying the source/wire/semantic framing,
      which characterization is most accurate?
    options:
      - "It is fully compatible on all three axes because small values serialize identically"
      - "It can be wire-compatible for in-range values yet source-incompatible for generated SDKs (the field's type widened) and semantically breaking for clients whose storage is sized to int32"
      - "It is only a semantic change; source and wire compatibility are irrelevant to typed clients"
      - "It is breaking only on the wire axis, since JSON output is unchanged"
    answer: 1
    explanation: |
      The three axes are independent. Generated SDK code compiled against an int32 field breaks
      when the type widens (source), and clients that provisioned int32 storage overflow once a
      real value exceeds the old bound (semantic) — even if small values happen to look identical
      on the wire. This is why widening needs a parallel field, not an in-place change.
    ref: "concepts.md#three-axes-of-compatibility-source-wire-semantic"

  - id: api-versioning-and-evolution-052
    difficulty: expert
    tags: [compatibility-axes, semantic, enforcement]
    question: |
      Which class of breaking change is a schema/OpenAPI diff linter fundamentally unable to
      catch on its own?
    options:
      - "Removing a required response field"
      - "Narrowing a field's type from string to enum"
      - "A semantic change such as flipping a default value or changing units while the shape stays byte-identical"
      - "Adding a new required request parameter"
    answer: 2
    explanation: |
      Diff linters compare structure/types, so they catch source- and wire-axis breakages
      (removals, narrowings, new required params). A default flip or a units change leaves the
      schema identical, so only domain review and per-field telemetry catch the semantic axis.
    ref: "concepts.md#three-axes-of-compatibility-source-wire-semantic"

  - id: api-versioning-and-evolution-053
    difficulty: advanced
    tags: [semantic, pagination, scenario]
    question: |
      An endpoint historically returned the full collection in one response. A release adds a
      `page_size` parameter defaulting to 50 and returns only the first page when it is omitted.
      Why is this a breaking change despite being purely additive to the request schema?
    options:
      - "Because adding any query parameter is always breaking"
      - "Because existing clients that never paginated now silently receive a truncated result set — a semantic behavior change with an identical response shape"
      - "Because the `page_size` parameter must be required to be valid"
      - "It is not breaking; adding an optional parameter with a default is always safe"
    answer: 1
    explanation: |
      The request field is optional, but its default (50) is smaller than the old "return
      everything" behavior, so clients that iterated the full set now silently miss data. That
      is a semantic breaking change; the fix is to default to the old behavior or expose it
      under a new version.
    ref: "concepts.md#semantic-behavioral-breaking-changes"

  - id: api-versioning-and-evolution-054
    difficulty: expert
    tags: [semantic, defaults, aip-180]
    question: |
      Per AIP-180, changing the default value of an existing response field (e.g. a `genre`
      that defaulted to FICTION now defaults to NONFICTION) is classified as breaking primarily
      because:
    options:
      - "The JSON serialization of the field changes length"
      - "Clients that relied on the previous default now silently receive different meaning for the same request, corrupting downstream logic"
      - "Default values are prohibited in REST responses"
      - "It forces a new required field on the request side"
    answer: 1
    explanation: |
      A default flip is the archetypal semantic breaking change: the shape is unchanged but the
      value's meaning shifts for clients that depended on the old default, producing silent
      downstream corruption that no schema diff flags.
    ref: "concepts.md#semantic-behavioral-breaking-changes"

  - id: api-versioning-and-evolution-055
    difficulty: expert
    tags: [bounds, int32, expand-contract, scenario]
    question: |
      Your public API returns numeric `id` values documented to fit in a signed 32-bit integer,
      and you are about to exhaust that range. Which migration avoids breaking existing clients?
    options:
      - "Silently start returning values above 2^31-1 in the same `id` field, since JSON numbers are unbounded"
      - "Add a new parallel int64 field (e.g. `id_long`) alongside `id`, migrate clients to it, then contract the old field only after usage telemetry hits zero"
      - "Change the `id` field's documented type to int64 in the changelog and ship immediately"
      - "Return `id` as a string only for values that overflow int32"
    answer: 1
    explanation: |
      Widening a documented numeric bound in place is breaking — clients sized int32 storage to
      the old limit and will overflow. Expand/contract with a new parallel int64 field lets
      clients migrate before the old field is retired.
    ref: "concepts.md#string-and-numeric-bound-changes"

  - id: api-versioning-and-evolution-056
    difficulty: advanced
    tags: [bounds, aip-180, breaking-changes]
    question: |
      Why does AIP-180 treat *increasing* a string field's documented maximum length as a
      breaking change?
    options:
      - "Longer strings cannot be serialized as JSON"
      - "Clients provisioned fixed-length storage (e.g. VARCHAR(64)) to the old documented bound and will truncate or reject values that now exceed it"
      - "It always changes the field's character encoding"
      - "String length limits are immutable per RFC 9110"
    answer: 1
    explanation: |
      Consumers size database columns and buffers to the documented maximum. Raising the limit
      means previously-impossible longer values can now appear, overflowing storage that was
      correct under the old contract — a semantic/bound breaking change.
    ref: "concepts.md#string-and-numeric-bound-changes"

  - id: api-versioning-and-evolution-057
    difficulty: expert
    tags: [media-type, header-grammar, quality-values]
    question: |
      A client sends:
      `Accept: application/vnd.example.user+json; version=2; q=1.0, application/vnd.example.user+json; version=1; q=0.5`
      What is it expressing, and what should a server that supports only version 1 do?
    options:
      - "It demands version 2 only; the server must return 406 Not Acceptable"
      - "It prefers version 2 but will accept version 1 as a fallback; the server should return the version-1 representation with `Vary: Accept`"
      - "The `q` values are invalid in `Accept`, so the request is a 400 Bad Request"
      - "It requests both versions simultaneously in one response"
    answer: 1
    explanation: |
      RFC 9110 `q` quality values express a preference order. Here v2 is preferred (q=1.0) but v1
      is acceptable (q=0.5), so a server that supports only v1 returns v1 and emits `Vary: Accept`
      because the chosen representation depends on the `Accept` header.
    ref: "concepts.md#media-type-versioning-the-header-grammar"

  - id: api-versioning-and-evolution-058
    difficulty: advanced
    tags: [media-type, rfc6839, suffix]
    question: |
      In the media type `application/vnd.example.user.v2+json`, what is the role of the `+json`
      suffix per RFC 6839?
    options:
      - "It signals the API version is 2 in JSON form"
      - "It is a structured syntax suffix declaring the type is serialized as JSON, so generic JSON tooling still applies"
      - "It requests gzip compression of the JSON body"
      - "It is a mandatory part of every vendor-tree media type name"
    answer: 1
    explanation: |
      The `+json` structured syntax suffix (RFC 6839) says the media type is *serialized as*
      JSON, letting generic JSON parsers and tooling process it even though the base type is a
      vendor-specific one. It is independent of the version marker.
    ref: "concepts.md#media-type-versioning-the-header-grammar"

  - id: api-versioning-and-evolution-059
    difficulty: expert
    tags: [enum, protobuf, unspecified, forward-compatibility]
    question: |
      Protobuf requires the first value of every enum to be `0` and conventionally names it
      `*_UNSPECIFIED`. How does this convention aid forward compatibility?
    options:
      - "It makes the enum serialize in fewer bytes"
      - "It provides a well-defined default for unset fields and a safe landing bucket for values a client's generated code does not yet recognize, avoiding crashes"
      - "It prevents anyone from ever adding new enum values"
      - "It forces all clients to upgrade whenever a value is added"
    answer: 1
    explanation: |
      The zero/`UNSPECIFIED` sentinel is the default for unset fields and gives open-enum
      handling a place to map unknown values, so a client encountering a value added after it was
      generated degrades gracefully instead of throwing.
    ref: "concepts.md#enum-evolution-and-the-unspecified-sentinel"

  - id: api-versioning-and-evolution-060
    difficulty: advanced
    tags: [enum, asymmetry, breaking-changes]
    question: |
      Why is adding an enum value non-breaking on the request side but potentially breaking on
      the response side?
    options:
      - "Requests are cached but responses are not"
      - "On the request side the server merely accepts more input; on the response side a client with closed-enum handling throws on the unrecognized value it now receives"
      - "Enums are only allowed in requests, never in responses"
      - "The response side is safe and the request side is breaking — the premise is reversed"
    answer: 1
    explanation: |
      Accepting an additional input value never invalidates existing valid requests (non-breaking
      request-side). But a client that exhaustively switches over a closed set of response enum
      values breaks when a new value appears — the same change is safe one direction and dangerous
      the other.
    ref: "concepts.md#enum-evolution-and-the-unspecified-sentinel"

  - id: api-versioning-and-evolution-061
    difficulty: advanced
    tags: [hateoas, why-failed, rest]
    question: |
      Which best explains why HATEOAS did not eliminate API versioning in practice?
    options:
      - "Hypermedia links cannot be expressed in JSON"
      - "Clients hardcode URLs, codegen/tooling assumes fixed paths, and — critically — link-following does nothing for semantic changes to a field's meaning"
      - "HATEOAS makes all changes breaking by design"
      - "Browsers refuse to follow `Link` relations"
    answer: 1
    explanation: |
      HATEOAS can relocate endpoints if clients follow links, but in reality clients hardcode
      URLs and typed tooling bakes in paths; more importantly, moving an endpoint does not help a
      client interpret a field whose semantics changed. It survives for navigation/discovery, not
      as a versioning replacement.
    ref: "concepts.md#hateoas-as-versioning-avoidance-and-why-it-mostly-failed"

  - id: api-versioning-and-evolution-062
    difficulty: expert
    tags: [multi-version, transformation-pipeline, stripe, architecture]
    question: |
      Stripe serves roughly a hundred API versions from one codebase using a transformation
      pipeline. What is the core mechanism?
    options:
      - "Each version is a separate deployed service behind a router, duplicated per endpoint"
      - "Business logic always computes the latest representation; each breaking change is an ordered, reversible transform module, and the server 'walks back' through the transforms newer than the client's pinned version to downgrade the response"
      - "The gateway stores a full snapshot of every version's response and replays it"
      - "Old versions are emulated by rewriting the database schema per request"
    answer: 1
    explanation: |
      In the transformation-pipeline model the core is single-versioned (latest); every breaking
      change is encapsulated as a reversible version-change module. To serve a pinned client the
      server composes the transforms between the latest and the client's version. Complexity
      scales with number of changes, not versions × endpoints.
    ref: "concepts.md#serving-multiple-versions-from-one-codebase"

  - id: api-versioning-and-evolution-063
    difficulty: advanced
    tags: [multi-version, transformation-pipeline, benefits]
    question: |
      Beyond avoiding duplicated per-version code, what additional benefit does encapsulating
      each breaking change as a declarative transform module provide?
    options:
      - "It removes the need for HTTPS"
      - "The declarative change modules can auto-generate the changelog and per-version documentation"
      - "It makes every change automatically non-breaking"
      - "It eliminates the need to test old versions"
    answer: 1
    explanation: |
      Because each change is expressed declaratively, the same modules that transform responses
      can generate the human-facing changelog and version docs — a documented side benefit of the
      Stripe-style pipeline.
    ref: "concepts.md#serving-multiple-versions-from-one-codebase"

  - id: api-versioning-and-evolution-064
    difficulty: advanced
    tags: [pinning, defaults, stripe]
    question: |
      Stripe pins each account to the newest version at the time of its *first request* rather
      than defaulting every un-versioned call to "latest." What problem does pin-on-first-use
      solve?
    options:
      - "It reduces the number of TLS handshakes"
      - "It ensures no client is ever silently upgraded into a breaking change when a new major version ships"
      - "It lets the server drop support for old versions immediately"
      - "It forces all accounts onto the same version for consistency"
    answer: 1
    explanation: |
      Defaulting to "latest" means shipping a new major silently changes behavior for every
      un-versioned client. Pinning on first use freezes each account to a known version so a new
      release never breaks existing callers; a per-request header still overrides the pin.
    ref: "concepts.md#version-pinning-and-per-field-usage-telemetry"

  - id: api-versioning-and-evolution-065
    difficulty: expert
    tags: [telemetry, field-usage, contraction, graphql]
    question: |
      "Remove the field only after usage telemetry hits zero" is sound policy, but how do you
      actually obtain reliable per-field usage data — and why is it easier in GraphQL than REST?
    options:
      - "You cannot measure field usage; you must guess based on ticket volume"
      - "GraphQL exposes exactly which fields each operation selects, making field-usage tracking first-class; REST must approximate via serializer instrumentation, request-shape logging, or sparse-fieldset parameters"
      - "REST provides per-field usage automatically via status codes; GraphQL does not"
      - "Both require clients to self-report which fields they read"
    answer: 1
    explanation: |
      GraphQL servers see the exact field selection of every operation, so field-usage tracking
      tells you precisely when a `@deprecated` field is unused. REST returns whole
      representations, so you approximate usage with serializer instrumentation, request-shape
      logs, or `fields=` sparse-fieldset parameters.
    ref: "concepts.md#version-pinning-and-per-field-usage-telemetry"

  - id: api-versioning-and-evolution-066
    difficulty: expert
    tags: [enforcement, contract-diff, ci, oasdiff]
    question: |
      Your team's rule is "additive changes only." What is the most robust way to *enforce* that
      a junior cannot merge a breaking change, without relying on human review?
    options:
      - "Add a comment in the OpenAPI file asking reviewers to check for breakages"
      - "Run an automated contract-diff linter (e.g. oasdiff/openapi-diff/Optic) in CI that diffs the new spec against the published one and fails the build on a breaking delta"
      - "Increment `info.version` on every commit"
      - "Require every PR to bump the URL path to a new /vN"
    answer: 1
    explanation: |
      Mechanical enforcement is a breaking-change linter in CI: it diffs the new OpenAPI spec
      against the published contract and fails on removed fields, narrowed types, or new required
      params. The diff — not the version number — is the gate.
    ref: "concepts.md#enforcing-compatibility-contract-diffing-cdc-tests-schema-registries"

  - id: api-versioning-and-evolution-067
    difficulty: expert
    tags: [enforcement, cdc, pact, microservices]
    question: |
      How do consumer-driven contract (CDC) tests with a tool like Pact detect breaking changes
      differently from an OpenAPI schema diff?
    options:
      - "They diff two schema documents just like oasdiff, but faster"
      - "Each consumer publishes the exact request/response shape it actually depends on to a broker, and the provider's CI verifies it still satisfies every registered real consumer before deploying"
      - "They test only the provider in isolation against a hypothetical schema"
      - "They require every consumer to run in production during the provider's build"
    answer: 1
    explanation: |
      A schema diff checks change against a hypothetical full contract; CDC verifies the provider
      against the *actual* expectations of each real consumer. That catches breakage that matters
      to live consumers and is especially valuable for internal microservices.
    ref: "concepts.md#enforcing-compatibility-contract-diffing-cdc-tests-schema-registries"

  - id: api-versioning-and-evolution-068
    difficulty: expert
    tags: [events, schema-registry, compatibility-modes, kafka]
    question: |
      A Kafka topic's schema is registered with `BACKWARD` compatibility. Which deployment
      ordering does this mode enable, and what does it guarantee?
    options:
      - "Producers must be upgraded first; it guarantees old consumers read new data"
      - "Consumers can be upgraded first; a consumer on the new schema can read data written with the previous schema"
      - "It guarantees nothing about read order; it only versions the topic name"
      - "Both producers and consumers must upgrade simultaneously"
    answer: 1
    explanation: |
      BACKWARD means a reader using the new schema can read data written with the previous
      schema, so you upgrade consumers first. FORWARD is the mirror (upgrade producers first);
      FULL is both directions between adjacent versions.
    ref: "concepts.md#event-and-async-api-versioning-schema-registry-compatibility-modes"

  - id: api-versioning-and-evolution-069
    difficulty: expert
    tags: [events, transitive, replay, schema-registry]
    question: |
      Consumers of an event stream can replay the topic from the very beginning, so they may
      encounter every schema that ever existed. Which schema-registry compatibility setting is
      most appropriate, and why?
    options:
      - "BACKWARD, because it only needs to check the immediately preceding schema"
      - "A TRANSITIVE mode (e.g. BACKWARD_TRANSITIVE), because it checks compatibility against ALL prior versions, not just the previous one"
      - "NONE, because replay disables compatibility checking"
      - "FORWARD, because producers are always newest"
    answer: 1
    explanation: |
      Non-transitive modes only compare against the immediately preceding schema, which is
      insufficient when a consumer replays the full history. TRANSITIVE variants check every
      prior version, guaranteeing the replaying consumer can read every event ever written.
    ref: "concepts.md#event-and-async-api-versioning-schema-registry-compatibility-modes"

  - id: api-versioning-and-evolution-070
    difficulty: advanced
    tags: [events, vs-rest, negotiation]
    question: |
      Why is versioning an event/message contract generally harder than versioning a REST
      endpoint?
    options:
      - "Events use more bandwidth than HTTP"
      - "You cannot negotiate a version per request, and old events live forever in the log, so a replaying consumer must handle every schema that ever existed"
      - "Events cannot be serialized with Avro or Protobuf"
      - "REST has no compatibility concerns at all"
    answer: 1
    explanation: |
      REST can negotiate a version per request via header/path/media type. Events are written
      once and persist in the log indefinitely, with no per-request negotiation, so compatibility
      must be enforced at publish time across the topic's whole history.
    ref: "concepts.md#event-and-async-api-versioning-schema-registry-compatibility-modes"

  - id: api-versioning-and-evolution-071
    difficulty: expert
    tags: [protobuf, field-numbers, reserved, security]
    question: |
      In Protobuf, why must you never reuse the tag number (or name) of a deleted field, and
      what is the recommended safeguard?
    options:
      - "Reuse is fine as long as the field name differs; no safeguard is needed"
      - "Reusing a tag causes old clients to decode new bytes into the old field — risking data corruption and even PII leakage — so you use `reserved` to fence off the retired numbers and names"
      - "Reuse only affects JSON output, so mark the field `deprecated` and move on"
      - "Reused tags increase message size, so you compress with gzip"
    answer: 1
    explanation: |
      Tag numbers are the wire identity of a field. Reusing a deleted number makes old binaries
      decode new data into the old field, causing corruption and potential PII leakage. The
      `reserved 2, 9 to 11; reserved "foo";` keyword fences off both numbers and names so they
      cannot be accidentally reused.
    ref: "concepts.md#versioning-contrast-rest-vs-grpcprotobuf-vs-graphql"

  - id: api-versioning-and-evolution-072
    difficulty: expert
    tags: [protobuf, unknown-fields, both-directions]
    question: |
      Protobuf achieves both backward and forward compatibility without any version number.
      Which mechanism is most responsible for this?
    options:
      - "Every message carries an explicit version header"
      - "Old binaries ignore unknown fields AND preserve them on re-serialization, so adding fields never breaks either direction"
      - "The compiler rejects any schema that adds fields"
      - "All fields are required, guaranteeing a fixed shape"
    answer: 1
    explanation: |
      Because a binary that does not know a field skips it *and* re-emits those unknown bytes
      when it re-serializes, a new field neither breaks old readers (backward) nor is lost when
      old code round-trips new data (forward) — compatibility is a per-field property, not a
      version stamp.
    ref: "concepts.md#versioning-contrast-rest-vs-grpcprotobuf-vs-graphql"

  - id: api-versioning-and-evolution-073
    difficulty: advanced
    tags: [graphql, nullability, breaking-changes]
    question: |
      In a "versionless" GraphQL schema, which of these changes is BREAKING?
    options:
      - "Adding a new nullable field to an object type"
      - "Adding a new optional (nullable) argument to a field"
      - "Making an existing nullable field non-null, or adding a non-null argument"
      - "Adding a new object type used only by new fields"
    answer: 2
    explanation: |
      Additive nullable changes are safe because clients opt into fields. But making a nullable
      field non-null (clients that sent/handled null now break) or adding a required non-null
      argument breaks existing operations. Nullability is a first-class compatibility tool in
      GraphQL.
    ref: "concepts.md#versioning-contrast-rest-vs-grpcprotobuf-vs-graphql"

  - id: api-versioning-and-evolution-074
    difficulty: advanced
    tags: [contrast, philosophy, rest-grpc-graphql]
    question: |
      Which statement best contrasts the versioning philosophies of REST vs Protobuf/gRPC vs
      GraphQL?
    options:
      - "All three version the whole contract with an explicit version selector"
      - "REST versions the whole contract explicitly, while Protobuf and GraphQL are engineered to avoid versioning by making compatibility a property of individual fields"
      - "Only GraphQL uses version numbers; REST and gRPC never do"
      - "gRPC uses URI path versions; REST uses field numbers"
    answer: 1
    explanation: |
      REST attaches a version to the whole contract (path/header/media type). Protobuf (immutable
      tag numbers + unknown-field preservation) and GraphQL (client-selected fields +
      `@deprecated`) deliberately avoid a version stamp by making compatibility a per-field
      property — the opposite pole from REST.
    ref: "concepts.md#versioning-contrast-rest-vs-grpcprotobuf-vs-graphql"

  - id: api-versioning-and-evolution-075
    difficulty: expert
    tags: [security, owasp, zombie-apis]
    question: |
      OWASP API Security Top 10 2023 API9 (Improper Inventory Management) flags a specific
      versioning failure mode as a leading risk. Which scenario does it describe?
    options:
      - "Using date-based versions instead of SemVer"
      - "Leaving a deprecated `/v1` running unpatched after `/v2` ships, so it becomes a 'zombie' endpoint attackers probe while the newest version is hardened"
      - "Returning 410 Gone after the sunset date"
      - "Exposing the version in the URL path"
    answer: 1
    explanation: |
      API9:2023 targets shadow/zombie APIs: old versions left live but unmaintained still expose
      full data with rotting dependencies and no security patches. Attackers probe `/v1` precisely
      because the current version is hardened and the old one is not.
    ref: "concepts.md#deprecated-and-zombie-versions-as-a-security-risk-owasp-api92023"

  - id: api-versioning-and-evolution-076
    difficulty: advanced
    tags: [security, owasp, mitigation, deprecation]
    question: |
      Which mitigation most directly addresses the OWASP API9 "zombie version" risk?
    options:
      - "Encrypt the old version's traffic with a stronger cipher"
      - "Maintain an authoritative inventory of every deployed version, apply the same patch/authz baseline to all live versions, and actually retire versions after sunset (410 Gone)"
      - "Hide the old version behind a custom header"
      - "Return 200 with a deprecation header indefinitely instead of removing the version"
    answer: 1
    explanation: |
      The risk is un-inventoried, unpatched live versions. The mitigation is inventory + uniform
      patching/authz across all live versions + genuine retirement after sunset — not leaving
      "deprecated but still serving unpatched traffic" running forever.
    ref: "concepts.md#deprecated-and-zombie-versions-as-a-security-risk-owasp-api92023"

  - id: api-versioning-and-evolution-077
    difficulty: expert
    tags: [status-codes, sunset, 410, redirect]
    question: |
      An old version has passed its sunset date and the successor's contract is *not* a 1:1
      compatible relocation. Which post-sunset response is most appropriate, and why not a
      redirect?
    options:
      - "308 Permanent Redirect to the successor, because it preserves method and body"
      - "410 Gone, because the removal is permanent and it tells clients (and caches) to stop retrying; a redirect would silently send clients into a different, incompatible representation"
      - "302 Found to the new version so clients auto-follow"
      - "200 OK with an empty body to avoid errors"
    answer: 1
    explanation: |
      410 Gone signals intentional permanent removal and is cacheable, telling callers to stop
      retrying and migrate. A redirect is only appropriate when the successor is a true
      compatible relocation of the same resource; redirecting into a different contract is the
      silent-version-substitution anti-pattern.
    ref: "concepts.md#post-sunset-status-codes-410-vs-404-vs-redirect"

  - id: api-versioning-and-evolution-078
    difficulty: advanced
    tags: [status-codes, 410-vs-404]
    question: |
      Why is `410 Gone` generally preferable to `404 Not Found` for an endpoint that was
      intentionally retired after its sunset date?
    options:
      - "410 is faster to serve than 404"
      - "410 states the removal is permanent and intentional (and is cacheable), whereas 404 is ambiguous between 'removed on purpose' and 'wrong URL/temporary glitch,' so clients may keep retrying"
      - "404 is not a valid response for retired endpoints"
      - "410 automatically redirects clients to the new version"
    answer: 1
    explanation: |
      404 cannot distinguish deliberate removal from a typo or transient error, so clients often
      retry. 410 explicitly communicates permanent, intentional removal (and is cacheable by
      default), prompting clients to stop and migrate.
    ref: "concepts.md#post-sunset-status-codes-410-vs-404-vs-redirect"

  - id: api-versioning-and-evolution-079
    difficulty: intermediate
    tags: [stability-channels, alpha-beta-ga, aip-181]
    question: |
      What is the defining property of a pre-GA stability channel such as Google's `v1beta1`
      or Azure's `-preview` versions?
    options:
      - "They are faster than GA versions"
      - "They carry weaker compatibility guarantees by contract and may break without the normal deprecation runway, in exchange for early access"
      - "They are identical to GA but cost more"
      - "They can never be promoted to GA"
    answer: 1
    explanation: |
      Alpha/beta/preview channels explicitly decouple "released" from "stable": consumers accept
      that these versions may change or break without the standard deprecation window in exchange
      for early access. Promotion to GA is a stability promotion, not necessarily a breaking API
      change.
    ref: "concepts.md#stability-channels-alpha-beta-ga"

  - id: api-versioning-and-evolution-080
    difficulty: advanced
    tags: [stability-channels, vs-major-version, aip]
    question: |
      How does promoting an API from `v1beta1` to `v1` differ from bumping `/v1` to `/v2`?
    options:
      - "They are identical operations with different names"
      - "The beta-to-GA promotion is a stability-level promotion (the guarantees strengthen) and need not be a breaking API change, whereas a major-version bump signals an incompatible contract change"
      - "A major-version bump never changes the contract; a stability promotion always does"
      - "Only GA versions can have breaking changes"
    answer: 1
    explanation: |
      Beta-to-GA changes the *promise* about stability, not necessarily the contract shape — the
      resource can stay the same while its guarantees strengthen. A v1-to-v2 major bump
      specifically communicates a breaking, incompatible contract change. They are orthogonal
      dimensions.
    ref: "concepts.md#stability-channels-alpha-beta-ga"
