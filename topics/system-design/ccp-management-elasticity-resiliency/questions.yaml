topic: 'Cloud Application Management: Elasticity & Resiliency Processes'
domain: system-design
topic_slug: ccp-management-elasticity-resiliency
version: 1
questions:
- id: ccp-management-elasticity-resiliency-001
  difficulty: beginner
  tags:
  - provider-adapter
  - portability
  - lock-in
  question: |
    A team wants to keep business components free of provider-specific
    authentication and data-format code so they can switch clouds later.
    Which Cloud Computing Pattern addresses this?
  options:
  - Managed Configuration
  - Provider Adapter
  - Elasticity Manager
  - Watchdog
  answer: 1
  explanation: |
    Provider Adapter wraps provider-specific interface details (auth, formats,
    protocols) behind a unified abstract interface, separating components that
    use provider functionality from those delivering application functionality.
  ref: concepts.md#provider-adapter
- id: ccp-management-elasticity-resiliency-002
  difficulty: beginner
  tags:
  - elastic-queue
  - async
  - queue-depth
  question: |
    Async worker components read requests from a message queue and must scale
    automatically. Which signal does the Elastic Queue pattern use to decide
    the instance count?
  options:
  - The average CPU utilization measured across the worker instances
  - Synchronous request rate at a load balancer
  - The number of enqueued (backlogged) messages
  - The disk I/O throughput of the queue broker host machine
  answer: 2
  explanation: |
    Elastic Queue monitors queue depth — the number of enqueued messages — and
    adjusts the number of worker instances accordingly. This is the abstract
    form of queue-based load leveling.
  ref: concepts.md#elastic-queue
- id: ccp-management-elasticity-resiliency-003
  difficulty: beginner
  tags:
  - elasticity-manager
  - utilization
  - autoscaling
  question: |
    The Elasticity Manager determines how many instances are needed based
    primarily on what?
  options:
  - Utilization of the hosting IT resources (e.g. CPU load)
  - The count of messages currently waiting in the request queue
  - The number of consecutive failed health checks reported per instance
  - The application version currently deployed
  answer: 0
  explanation: |
    Elasticity Manager monitors resource utilization of the hosting resources
    (CPU, memory, I/O) and computes the required instance count from it — the
    classic utilization-driven autoscaler.
  ref: concepts.md#elasticity-manager
- id: ccp-management-elasticity-resiliency-004
  difficulty: beginner
  tags:
  - watchdog
  - failure-detection
  - self-healing
  question: |
    Which pattern describes a separate component that monitors redundant,
    stateless instances and replaces them when they fail?
  options:
  - Elastic Load Balancer
  - Standby Pooling Process
  - Watchdog
  - Provider Adapter
  answer: 2
  explanation: |
    The Watchdog is a dedicated component that monitors instances and triggers
    replacement on failure, enabling automatic failure detection and recovery
    when provider-guaranteed availability is insufficient.
  ref: concepts.md#watchdog
- id: ccp-management-elasticity-resiliency-005
  difficulty: beginner
  tags:
  - managed-configuration
  - externalized-config
  question: |
    Managed Configuration recommends storing configuration where?
  options:
  - Baked directly into each component's machine image at build time
  - Only in per-host environment variables injected once at boot time
  - In a shared central store that instances poll or are notified about
  - Encoded as static entries inside the load balancer's routing table
  answer: 2
  explanation: |
    Managed Configuration externalizes settings into shared central storage
    (relational DB, key-value store, blob storage); instances retrieve config
    by polling or via push notifications, so one edit adjusts all instances.
  ref: concepts.md#managed-configuration
- id: ccp-management-elasticity-resiliency-006
  difficulty: intermediate
  tags:
  - elastic-load-balancer
  - sync
  - request-rate
  question: |
    A latency-sensitive synchronous REST service must scale on the most direct
    workload signal available. Which pattern both distributes requests AND uses
    request volume to size the fleet?
  options:
  - Elastic Queue
  - Elasticity Manager
  - Elastic Load Balancer
  - Resiliency Management Process
  answer: 2
  explanation: |
    Elastic Load Balancer distributes synchronous requests across instances and
    measures request volume; that measurement drives the instance count. It is
    preferred over CPU-based Elasticity Manager for request-driven work because
    request rate leads while CPU lags.
  ref: concepts.md#elastic-load-balancer
- id: ccp-management-elasticity-resiliency-007
  difficulty: intermediate
  tags:
  - resiliency-management-process
  - elasticity-management-process
  - distinction
  question: |
    What best distinguishes the Resiliency Management Process from the
    Elasticity Management Process?
  options:
  - Resiliency replaces failed instances to hold availability; elasticity changes the count to match workload
  - Resiliency only runs on-premises hardware; elasticity is exclusive to public-cloud fleets
  - Resiliency only ever scales the fleet down; elasticity is the process that only scales up
  - They are simply two interchangeable names for the very same underlying control loop
  answer: 0
  explanation: |
    Both provision instances, but for different reasons: Resiliency Management
    replaces failed instances (availability), triggered by health failures;
    Elasticity Management adjusts the count to match workload (capacity).
  ref: concepts.md#resiliency-management-process
- id: ccp-management-elasticity-resiliency-008
  difficulty: intermediate
  tags:
  - feature-flag-management-process
  - graceful-degradation
  question: |
    Workload spikes faster than new resources can be provisioned. Which pattern
    lets the application degrade gracefully by turning off or lightening
    non-critical features until capacity catches up?
  options:
  - Standby Pooling Process
  - Feature Flag Management Process
  - Update Transition Process
  - Elastic Queue
  answer: 1
  explanation: |
    Feature Flag Management Process disables non-critical functionality or swaps
    it for a lighter implementation during a resource shortage, preserving
    essential features, then re-enables when capacity returns. It needs no new
    resources.
  ref: concepts.md#feature-flag-management-process
- id: ccp-management-elasticity-resiliency-009
  difficulty: intermediate
  tags:
  - standby-pooling-process
  - provisioning-latency
  - cost
  question: |
    An app faces sudden sharp spikes and the autoscaler cannot provision fast
    enough. The provider also bills in fixed time-slots. Which pattern keeps
    warm instances ready and only decommissions once a paid slot is used up?
  options:
  - Feature Flag Management Process
  - Watchdog
  - Standby Pooling Process
  - Managed Configuration
  answer: 2
  explanation: |
    Standby Pooling Process moves idle instances to a standby (warm) list rather
    than terminating them immediately, guaranteeing fast provisioning for spikes
    and only decommissioning after the paid time-slot is exhausted.
  ref: concepts.md#standby-pooling-process
- id: ccp-management-elasticity-resiliency-010
  difficulty: intermediate
  tags:
  - update-transition-process
  - zero-downtime
  - deployment
  question: |
    Which pattern describes provisioning new-version instances alongside the old
    ones and switching load balancing over before retiring the old instances?
  options:
  - Elasticity Management Process
  - Standby Pooling Process
  - Update Transition Process
  - Resiliency Management Process
  answer: 2
  explanation: |
    Update Transition Process runs the new version as additional instances
    beside the old, switches synchronous traffic (queue workers just start
    pulling), then decommissions the old instances — the abstract form of
    rolling/blue-green deployment.
  ref: concepts.md#update-transition-process
- id: ccp-management-elasticity-resiliency-011
  difficulty: intermediate
  tags:
  - component-vs-process
  - taxonomy
  question: |
    In this pattern group, which item is a management PROCESS (a control loop)
    rather than a runtime COMPONENT?
  options:
  - Elastic Load Balancer
  - Watchdog
  - Elasticity Manager
  - Resiliency Management Process
  answer: 3
  explanation: |
    Provider Adapter, Managed Configuration, Elasticity Manager, Elastic Load
    Balancer, Elastic Queue and Watchdog are runtime components. The
    *-Management/Transition/Pooling Processes are the control loops that drive
    them — Resiliency Management Process is a process.
  ref: concepts.md#the-elasticity--resiliency-control-loop
- id: ccp-management-elasticity-resiliency-012
  difficulty: advanced
  tags:
  - elastic-queue
  - elastic-load-balancer
  - elasticity-manager
  - selection
  question: |
    A pipeline has (a) a public sync API, (b) background jobs pulled from a
    queue, and (c) a CPU-heavy encoder. Which sensor pattern fits each,
    respectively?
  options:
  - Elastic Queue / Elasticity Manager / Elastic Load Balancer
  - Elastic Load Balancer / Elastic Queue / Elasticity Manager
  - Elasticity Manager / Elastic Load Balancer / Elastic Queue
  - Elastic Load Balancer / Elasticity Manager / Elastic Queue
  answer: 1
  explanation: |
    Sync API → Elastic Load Balancer (request rate); queue jobs → Elastic Queue
    (queue depth); CPU-bound encoder → Elasticity Manager (utilization). Each
    pattern is named for its scaling signal.
  ref: concepts.md#elasticity-manager
- id: ccp-management-elasticity-resiliency-013
  difficulty: advanced
  tags:
  - watchdog
  - resiliency-management-process
  - component-vs-process
  question: |
    How do the Watchdog and the Resiliency Management Process relate?
  options:
  - The Watchdog is the sensor/trigger; the Resiliency Management Process is the coordinated detect-and-recover
    loop around it
  - They are competing alternatives; you deploy exactly one of the two and never both
  - The Resiliency Management Process fully replaces and deprecates the Watchdog in modern clouds
  - The Watchdog decides fleet capacity while the Resiliency Management Process distributes incoming load
  answer: 0
  explanation: |
    The Watchdog provides the ability to monitor and react to failures; the
    Resiliency Management Process is the surrounding loop that verifies health,
    runs periodic checks, and coordinates automatic replacement of failed
    instances.
  ref: concepts.md#resiliency-management-process
- id: ccp-management-elasticity-resiliency-014
  difficulty: advanced
  tags:
  - standby-pooling-process
  - feature-flag-management-process
  - spike
  question: |
    To survive a spike that outruns provisioning, which TWO patterns are the
    canonical pairing — one that pre-warms capacity and one that sheds load?
  options:
  - Elastic Load Balancer and Elastic Queue
  - Update Transition Process and Watchdog
  - Provider Adapter and Managed Configuration
  - Standby Pooling Process and Feature Flag Management Process
  answer: 3
  explanation: |
    Standby Pooling keeps warm instances to absorb spikes immediately; Feature
    Flag Management degrades gracefully by shedding non-critical features when
    even warm capacity is exhausted. Together they cover provisioning lag.
  ref: concepts.md#standby-pooling-process
- id: ccp-management-elasticity-resiliency-015
  difficulty: intermediate
  tags:
  - managed-configuration
  - feature-flag-management-process
  - relationship
  question: |
    Feature Flag Management Process is best described as which pattern applied
    to toggling features?
  options:
  - Provider Adapter
  - Watchdog
  - Managed Configuration
  - Elastic Queue
  answer: 2
  explanation: |
    Feature flags are stored and distributed via Managed Configuration (central
    store + polling/push). Feature Flag Management is Managed Configuration used
    to enable/disable or lighten features at runtime.
  ref: concepts.md#feature-flag-management-process
- id: ccp-management-elasticity-resiliency-016
  difficulty: intermediate
  tags:
  - stateless-component
  - prerequisite
  question: |
    Why is a Stateless Component a prerequisite for Elastic Load Balancer,
    Elastic Queue, Watchdog, and Update Transition?
  options:
  - Stateless code compiles faster and so its images boot into service more quickly
  - Only stateless instances can be freely added, removed, or replaced because state lives externally
  - Stateless components never fail, so the patterns never actually need to replace one
  - It lets each instance safely retain its own private in-memory session data across requests
  answer: 1
  explanation: |
    These patterns add/remove/replace instances freely. That is only safe if any
    instance can serve any work — i.e. state is held externally and instances
    are interchangeable (Stateless Component).
  ref: concepts.md#elastic-load-balancer
- id: ccp-management-elasticity-resiliency-017
  difficulty: advanced
  tags:
  - elasticity-manager
  - elastic-load-balancer
  - lag
  question: |
    For an I/O-bound synchronous service, why might an Elastic Load Balancer be
    preferred over an Elasticity Manager as the scaling sensor?
  options:
  - Load balancers are billed at a lower hourly rate than the CPU-monitoring agents they replace
  - Elasticity Managers are an on-premises-only construct and cannot be deployed in a public cloud
  - Request rate leads the workload, while CPU utilization lags and may rise only after latency already
    degraded
  - CPU utilization metrics are simply not collected or exposed for I/O-bound workloads by the provider
  answer: 2
  explanation: |
    Utilization is a lagging proxy for I/O-bound or bursty traffic — CPU climbs
    after users already feel latency. Synchronous request rate at the load
    balancer is a more direct, leading signal.
  ref: concepts.md#elasticity-manager
- id: ccp-management-elasticity-resiliency-018
  difficulty: intermediate
  tags:
  - provider-adapter
  - modern-equivalent
  question: |
    Which of these is the best MODERN illustration of the Provider Adapter
    pattern's intent (abstracting provider APIs for portability)?
  options:
  - A Kubernetes liveness probe restarting a hung container after it stops responding
  - Crossplane / Terraform provider plugins or libraries like Apache Libcloud
  - An SQS dead-letter queue that captures messages failing after repeated redelivery
  - A CloudWatch CPU alarm that fires when average utilization crosses a set threshold
  answer: 1
  explanation: |
    Provider Adapter is realized by cross-cloud abstraction layers such as
    Crossplane, Terraform/Pulumi provider plugins, and libraries like Libcloud
    or jclouds that wrap provider-specific APIs behind a unified interface.
  ref: concepts.md#provider-adapter
- id: ccp-management-elasticity-resiliency-019
  difficulty: intermediate
  tags:
  - elastic-queue
  - modern-equivalent
  - keda
  question: |
    Scaling worker pods on the number of messages in an SQS/Kafka/Service
    Bus/Pub-Sub queue (e.g. via KEDA) is a modern realization of which pattern?
  options:
  - Elastic Load Balancer
  - Elasticity Manager
  - Elastic Queue
  - Watchdog
  answer: 2
  explanation: |
    KEDA scaling on queue length, Lambda event-source scaling on SQS/Kafka, and
    ASG scaling on visible-message count all realize Elastic Queue: instance
    count tracks backlog depth.
  ref: concepts.md#elastic-queue
- id: ccp-management-elasticity-resiliency-020
  difficulty: advanced
  tags:
  - update-transition-process
  - compatibility
  - tradeoff
  question: |
    A key constraint of the Update Transition Process (running v1 and v2
    simultaneously) is that the two versions must be what?
  options:
  - Written in the exact same programming language and framework version
  - Identical in CPU, memory, and storage footprint down to the instance type
  - Deployed onto the very same physical host so they can share local memory
  - Backward/forward compatible (schemas, message formats, APIs)
  answer: 3
  explanation: |
    Because both versions serve traffic at once, they must be
    backward/forward compatible in schemas, message formats and APIs. Stateless
    components make this easy; stateful ones need careful data migration.
  ref: concepts.md#update-transition-process
- id: ccp-management-elasticity-resiliency-021
  difficulty: intermediate
  tags:
  - elasticity-management-process
  - predictive
  - thrashing
  question: |
    The Elasticity Management Process aims to match current AND expected
    workload. Which practice best addresses provisioning lag and avoids
    oscillation (thrashing)?
  options:
  - Scale only reactively on instantaneous load with no cooldown window at all
  - Never scale down, holding peak capacity permanently to eliminate any lag
  - Combine reactive scaling with scheduled/predictive scaling and tune cooldowns
  - Replace the whole process with a Watchdog that monitors per-instance health
  answer: 2
  explanation: |
    Reactive-only scaling trails spikes and can oscillate. Pairing it with
    scheduled/predictive scaling (the 'expected workload' half) and tuning
    intervals/cooldowns reduces lag and thrashing.
  ref: concepts.md#elasticity-management-process
- id: ccp-management-elasticity-resiliency-022
  difficulty: advanced
  tags:
  - resiliency-management-process
  - replacement-storm
  question: |
    What failure mode must the Resiliency Management Process guard against when
    a systemic fault makes many instances fail health checks at once?
  options:
  - A replacement storm — endless replace loops as new instances also fail
  - Excessive queue depth causing enqueued messages to pile up unboundedly
  - Load balancer session affinity pinning every user to one failing instance
  - Configuration drift between regions causing inconsistent instance behavior
  answer: 0
  explanation: |
    If the root cause is systemic (bad config, dependency outage), blindly
    replacing failed instances just spawns more failures. Combine replacement
    with backoff and circuit-breaking to avoid a replacement storm.
  ref: concepts.md#resiliency-management-process
- id: ccp-management-elasticity-resiliency-023
  difficulty: beginner
  tags:
  - elasticity-management-process
  - intent
  question: |
    Which management process orchestrates the Elasticity Manager, Elastic Load
    Balancer and Elastic Queue sensors into provisioning decisions?
  options:
  - Resiliency Management Process
  - Elasticity Management Process
  - Update Transition Process
  - Feature Flag Management Process
  answer: 1
  explanation: |
    The Elasticity Management Process analyzes instance utilization at intervals,
    derives workload, and adjusts resources — the decision loop over the
    elasticity sensor components.
  ref: concepts.md#elasticity-management-process
- id: ccp-management-elasticity-resiliency-024
  difficulty: intermediate
  tags:
  - watchdog
  - modern-equivalent
  question: |
    Kubernetes liveness probes combined with a ReplicaSet automatically
    recreating dead pods is a modern realization of which pattern?
  options:
  - Watchdog
  - Elastic Queue
  - Provider Adapter
  - Standby Pooling Process
  answer: 0
  explanation: |
    Liveness probes plus ReplicaSet self-healing (and ASG/ELB health-check
    replacement) implement the Watchdog: a separate monitor that detects
    failures and triggers replacement of stateless instances.
  ref: concepts.md#watchdog
- id: ccp-management-elasticity-resiliency-025
  difficulty: advanced
  tags:
  - managed-configuration
  - blast-radius
  question: |
    What is a notable RISK introduced by Managed Configuration's central store?
  options:
  - Instances can no longer be stateless because config now lives on each host
  - One bad config value can instantly break the entire fleet (blast radius)
  - Configuration can never be changed at runtime once instances have booted
  - It forces every component into synchronous-only request/response interfaces
  answer: 1
  explanation: |
    Centralizing config means one push reaches all instances — powerful, but a
    single bad value has fleet-wide blast radius. Mitigate with versioning,
    validation, and gradual rollout.
  ref: concepts.md#managed-configuration
- id: ccp-management-elasticity-resiliency-026
  difficulty: intermediate
  tags:
  - standby-pooling-process
  - modern-equivalent
  question: |
    AWS EC2 Auto Scaling warm pools and Lambda provisioned concurrency are
    modern realizations of which pattern?
  options:
  - Elasticity Manager
  - Update Transition Process
  - Feature Flag Management Process
  - Standby Pooling Process
  answer: 3
  explanation: |
    Warm pools and provisioned concurrency keep pre-initialized capacity ready
    to activate instantly — the Standby Pooling Process, which trades some idle
    spend for guaranteed fast provisioning.
  ref: concepts.md#standby-pooling-process
- id: ccp-management-elasticity-resiliency-027
  difficulty: advanced
  tags:
  - feature-flag-management-process
  - standby-pooling-process
  - distinction
  question: |
    How does Feature Flag Management Process differ from Standby Pooling Process
    in handling a resource shortage?
  options:
  - Feature flags prevent the shortage by pre-warming capacity; standby pooling copes after
  - They are identical mechanisms with two different names for the same behavior
  - Feature flags cope AFTER the shortage by shedding features; standby pooling PREVENTS it by keeping
    warm capacity
  - Both require provisioning brand-new resources before they can take any effect
  answer: 2
  explanation: |
    Standby Pooling prevents/absorbs the shortage with warm capacity (needs
    idle resources). Feature Flag Management copes after the shortage arrives by
    degrading gracefully — and needs no new resources.
  ref: concepts.md#feature-flag-management-process
- id: ccp-management-elasticity-resiliency-028
  difficulty: beginner
  tags:
  - update-transition-process
  - queue-workers
  question: |
    Under the Update Transition Process, why do queue-based (pull) worker
    components NOT need load-balancer rerouting during an update?
  options:
  - Because queues cannot be updated while messages are still in flight
  - Because workers pull work independently, so new-version workers just start consuming
  - Because queue workers are always stateful and cannot be freely replaced
  - Because the queue automatically deletes and recreates old worker instances
  answer: 1
  explanation: |
    Pull-based workers draw work from the queue independently; simply starting
    new-version workers and stopping old ones transitions the version without any
    traffic rerouting.
  ref: concepts.md#update-transition-process
- id: ccp-management-elasticity-resiliency-029
  difficulty: intermediate
  tags:
  - provider-adapter
  - tradeoff
  question: |
    What is the main TRADE-OFF of adopting the Provider Adapter pattern?
  options:
  - It removes the ability to unit-test components in isolation from the cloud
  - It prevents stateless design by pinning session data into the adapter layer
  - It forces you into a single cloud by hard-coding one provider's native SDK
  - The abstraction can hide provider-specific differentiated features and adds a maintenance surface
  answer: 3
  explanation: |
    Provider Adapter buys portability and testability but the unifying
    abstraction can mask a provider's differentiated capabilities and is itself
    code to maintain. Skip it when you have deliberately bet on one provider.
  ref: concepts.md#provider-adapter
- id: ccp-management-elasticity-resiliency-030
  difficulty: advanced
  tags:
  - elastic-queue
  - idempotent
  - delivery
  question: |
    Elastic Queue workers typically consume from at-least-once queues. Which
    processing property best protects correctness under that delivery guarantee?
  options:
  - Stateful session affinity that pins each message to one specific worker
  - Synchronous request routing through a load balancer for every message
  - Idempotent processing (safe to process a message more than once)
  - CPU-based scaling that adds more workers as processor load climbs
  answer: 2
  explanation: |
    At-least-once delivery means duplicates happen. Idempotent processing keeps
    the result correct when the same message is handled more than once, which is
    why Idempotent/Timeout-based Processors are companion patterns.
  ref: concepts.md#elastic-queue
- id: ccp-management-elasticity-resiliency-031
  difficulty: intermediate
  tags:
  - elastic-load-balancer
  - modern-equivalent
  question: |
    Target-tracking EC2 Auto Scaling on ALB RequestCountPerTarget (or
    request-based HPA via KEDA) is a modern realization of which pattern?
  options:
  - Elastic Queue
  - Elasticity Manager
  - Elastic Load Balancer
  - Watchdog
  answer: 2
  explanation: |
    Scaling on synchronous request count per target — combining distribution and
    request-rate sensing — is exactly the Elastic Load Balancer pattern.
  ref: concepts.md#elastic-load-balancer
- id: ccp-management-elasticity-resiliency-032
  difficulty: advanced
  tags:
  - watchdog
  - health-check
  - tradeoff
  question: |
    Why can a shallow "the process is running" health check undermine the
    Watchdog pattern's effectiveness?
  options:
  - It restarts healthy instances too rarely for the Watchdog to matter at all
  - It can miss a hung/deadlocked app that is 'up' but not serving, so failures go undetected
  - It always triggers cascading replacement storms across the entire fleet
  - It only works for stateful components that keep local in-memory session data
  answer: 1
  explanation: |
    A Watchdog is only as good as its health check. A shallow liveness check
    passes for a hung app that answers nothing useful; a check must be
    meaningful (but not so aggressive it false-positives under load).
  ref: concepts.md#watchdog
- id: ccp-management-elasticity-resiliency-049
  difficulty: intermediate
  tags:
  - managed-configuration
  - poll-vs-push
  question: |
    Managed Configuration lets instances learn of config changes in two ways.
    Which pairing is correct?
  options:
  - Polling the central store on an interval, or receiving push notifications when values change
  - Recompiling the application binary, or rebooting every host to reload config
  - Reading a value from a load balancer response header, or from a DNS TXT record
  - Querying the Watchdog component, or polling the Elasticity Manager directly
  answer: 0
  explanation: |
    Instances either poll the central config store periodically or subscribe to
    push notifications (a message) when values change. Push cuts latency; polling
    adds resilience if notifications are missed.
  ref: concepts.md#managed-configuration
- id: ccp-management-elasticity-resiliency-033
  difficulty: advanced
  tags:
  - update-transition-process
  - modern-equivalent
  - deployment-strategies
  question: |
    Kubernetes rolling updates, AWS CodeDeploy blue-green, and Argo Rollouts are
    modern realizations of which pattern — and where should the DETAILED
    blue-green/canary mechanics be studied?
  options:
  - Update Transition Process; deep dive in the DevOps deployment-strategies topic
  - Standby Pooling Process; deep dive in the reliability-ops operations topic
  - Watchdog; deep dive in the failure-theory-advanced resilience topic
  - Elastic Load Balancer; deep dive in aws-load-balancing-elb-autoscaling
  answer: 0
  explanation: |
    These tools realize the Update Transition Process. This topic stays at
    pattern altitude; the detailed rolling/blue-green/canary mechanics are the
    DevOps deployment-strategies topic's deep dive.
  ref: concepts.md#update-transition-process
- id: ccp-management-elasticity-resiliency-034
  difficulty: intermediate
  tags:
  - standby-pooling-process
  - tradeoff
  - cost
  question: |
    What is the core trade-off of the Standby Pooling Process?
  options:
  - It eliminates all provisioning latency entirely at absolutely zero extra cost
  - It cuts scale-up latency at the cost of paying for some idle warm capacity
  - It removes the need for stateless components by caching all state in the pool
  - It only works for synchronous request/response workloads and never async ones
  answer: 1
  explanation: |
    Standby Pooling reduces spike-response latency and better uses paid
    time-slots, but you pay for idle warm instances. Size the pool to expected
    spike magnitude and provisioning lag.
  ref: concepts.md#standby-pooling-process
- id: ccp-management-elasticity-resiliency-035
  difficulty: advanced
  tags:
  - feature-flag-management-process
  - tradeoff
  - tech-debt
  question: |
    Besides needing degradable features by design, what ongoing discipline does
    Feature Flag Management Process demand?
  options:
  - Recompiling and redeploying all instances on every single flag toggle
  - Keeping every feature permanently switched on regardless of current load
  - Flag lifecycle management — stale flags become tech debt and risk
  - Running the application in only a single cloud provider region
  answer: 2
  explanation: |
    Flags accumulate; without lifecycle management (retiring dead flags) they
    become confusing tech debt and a source of bugs. The app must also be
    designed with optional/degradable features.
  ref: concepts.md#feature-flag-management-process
- id: ccp-management-elasticity-resiliency-036
  difficulty: intermediate
  tags:
  - elasticity-manager
  - modern-equivalent
  - hpa
  question: |
    The Kubernetes Horizontal Pod Autoscaler scaling on CPU/memory, and EC2
    target-tracking on CPU, realize which pattern?
  options:
  - Elastic Queue
  - Elasticity Manager
  - Elastic Load Balancer
  - Provider Adapter
  answer: 1
  explanation: |
    Scaling on hosting-resource utilization (CPU/memory) is the Elasticity
    Manager pattern. HPA on CPU and EC2 CPU target-tracking are its modern
    realizations.
  ref: concepts.md#elasticity-manager
- id: ccp-management-elasticity-resiliency-037
  difficulty: advanced
  tags:
  - control-loop
  - sense-decide-act
  question: |
    Mapping the group to a sense-decide-act loop, which grouping is correct?
  options:
  - 'Sense: Elasticity Manager/ELB/Elastic Queue/Watchdog; Decide: Elasticity & Resiliency Management
    Processes; Act: provisioning, Standby Pooling, Feature Flags'
  - 'Sense: the Elasticity & Resiliency Management Processes; Decide: the Elastic Load
    Balancer; Act: the Watchdog replacing and re-provisioning failed instances'
  - 'Sense: Provider Adapter reading provider metrics; Decide: Managed Configuration
    central store; Act: Elastic Queue draining the pending backlog'
  - There is no control loop at all; each pattern operates in complete isolation with no
    feedback flowing between sensing, deciding, and acting
  answer: 0
  explanation: |
    The elasticity/resiliency components sense (LB rate, queue depth, CPU,
    health); the management processes decide; provisioning, Standby Pooling and
    Feature Flags act. The actions change what the sensors see next.
  ref: concepts.md#the-elasticity--resiliency-control-loop
- id: ccp-management-elasticity-resiliency-038
  difficulty: intermediate
  tags:
  - resiliency-management-process
  - periodic-check
  question: |
    Beyond reacting to Watchdog/monitoring signals, what does the Resiliency
    Management Process also do on its own?
  options:
  - Runs periodic health checks proactively and replaces faulty instances
  - Adjusts the fleet's instance count purely by reading CPU utilization thresholds
  - Deploys new application versions by staging them beside the running ones
  - Balances synchronous incoming requests evenly across availability zones
  answer: 0
  explanation: |
    The Resiliency Management Process is triggered by failures AND runs its own
    periodic health checks, retiring faulty instances and provisioning
    replacements automatically.
  ref: concepts.md#resiliency-management-process
- id: ccp-management-elasticity-resiliency-039
  difficulty: advanced
  tags:
  - standby-pooling-process
  - resiliency-management-process
  - integration
  question: |
    How do Standby Pooling and Resiliency Management naturally combine?
  options:
  - Standby Pooling supplies warm instances so Resiliency Management can replace failed ones faster
  - Resiliency Management permanently disables the standby pool to save on idle-capacity cost
  - They are mutually exclusive and can never be deployed within the same architecture
  - Standby Pooling entirely replaces the health-check logic inside Resiliency Management
  answer: 0
  explanation: |
    When the Resiliency Management Process retires a failed instance, pulling the
    replacement from a Standby Pool cuts recovery time — warm capacity speeds both
    elasticity and resiliency actions.
  ref: concepts.md#standby-pooling-process
- id: ccp-management-elasticity-resiliency-040
  difficulty: beginner
  tags:
  - provider-adapter
  - separation-of-concerns
  question: |
    Provider Adapter enforces separation of concerns between which two kinds of
    components?
  options:
  - Frontend presentation components and backend data-processing components
  - Synchronous request-serving components and asynchronous batch-processing components
  - Stateless interchangeable components and stateful session-holding components
  - Components accessing provider functionality and components providing application functionality
  answer: 3
  explanation: |
    The adapter isolates provider-access concerns (auth, formats, protocols) from
    business-logic components, so application functionality stays independent of
    any specific provider interface.
  ref: concepts.md#provider-adapter
