- id: ccp-management-elasticity-resiliency-042
  difficulty: intermediate
  tags:
  - feature-flag-management-process
  - progressive-rollout
  question: |
    Besides graceful degradation under load, the same feature-flag mechanism is
    commonly used for what?
  options:
  - Progressive rollout — enabling a feature for a fraction of traffic first
  - Compiling and linking the application binary before each release ships
  - Balancing synchronous requests evenly across the pool of instances
  - Detecting hardware failures and triggering automatic instance replacement
  answer: 0
  explanation: |
    The toggle mechanism that sheds load also drives progressive
    rollout/canary-by-feature — turning a feature on for a subset of users before
    full release. Same substrate (Managed Configuration), different use.
  ref: concepts.md#feature-flag-management-process
- id: ccp-management-elasticity-resiliency-043
  difficulty: advanced
  tags:
  - managed-configuration
  - update-transition-process
  - distinction
  question: |
    A team must change a runtime parameter across all 500 instances without a
    redeploy or new code. Which pattern applies — and which does NOT?
  options:
  - Managed Configuration applies; Update Transition Process does not (no new version is being shipped)
  - Update Transition Process applies; Managed Configuration does not (a redeploy is required to change values)
  - Watchdog applies; Managed Configuration does not (config edits are delivered through health checks)
  - Elastic Queue applies; Update Transition Process does not (parameters propagate via queue messages)
  answer: 0
  explanation: |
    Changing a parameter (not code) fleet-wide is Managed Configuration
    (central store + poll/push). Update Transition Process is for shipping a new
    version of components, which is not happening here.
  ref: concepts.md#managed-configuration
