- id: ccp-management-elasticity-resiliency-045
  difficulty: advanced
  tags:
  - resiliency-management-process
  - elasticity-management-process
  - watchdog
  - trigger
  question: |
    An instance is unhealthy but load is normal. Which process is triggered, and
    by which sensor?
  options:
  - Elasticity Management Process, triggered by the Elastic Load Balancer
  - Feature Flag Management Process, triggered by queue depth
  - Update Transition Process, triggered by Managed Configuration
  - Resiliency Management Process, triggered by the Watchdog/health check
  answer: 3
  explanation: |
    A health failure (not a load change) triggers the Resiliency Management
    Process via the Watchdog/health check to replace the failed instance.
    Elasticity Management responds to workload, not failures.
