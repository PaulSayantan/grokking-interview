topic: "AWS Fundamentals and the Well-Architected Framework"
domain: system-design
topic_slug: aws-fundamentals-well-architected
version: 1
questions:
  - id: aws-fundamentals-well-architected-001
    difficulty: beginner
    tags: [global-infrastructure, availability-zones]
    question: |
      What is an AWS Availability Zone (AZ)?
    options:
      - "A single physical server rack within a data center"
      - "One or more discrete data centers with independent power, cooling, and networking, isolated from other AZs but close enough for low-latency synchronous replication"
      - "A geographic region such as N. Virginia or Ireland containing many data centers worldwide"
      - "A global network of CloudFront edge locations that cache content near users"
    answer: 1
    explanation: |
      An AZ is one or more discrete data centers with independent power/cooling/networking,
      physically separated for fault isolation yet close enough (typically < 1-2 ms RTT) for
      synchronous replication. (A) is too small. (C) describes a Region, which contains
      multiple AZs. (D) describes the edge/PoP network, a separate layer for content delivery.
    ref: "concepts.md#global-infrastructure-regions-availability-zones-and-edge"

  - id: aws-fundamentals-well-architected-002
    difficulty: beginner
    tags: [global-infrastructure, regions]
    question: |
      Why does spreading a workload across multiple Availability Zones (rather than a single AZ)
      improve availability at relatively low cost?
    options:
      - "AZs share the same power and cooling, so failures are automatically mirrored"
      - "AZs are in different countries, providing data-residency compliance for free"
      - "AZs have independent failure domains yet are close enough for low-latency synchronous replication, so one facility failure does not take the workload down"
      - "AZs use faster hardware than single-AZ deployments"
    answer: 2
    explanation: |
      Multi-AZ works because AZs fail independently (separate power/cooling/network) but sit
      close enough for cheap synchronous replication and fast failover. (A) is false — the point
      is that they do NOT share power/cooling. (B) is a Region property, not AZ. (D) hardware is
      not the differentiator.
    ref: "concepts.md#global-infrastructure-regions-availability-zones-and-edge"

  - id: aws-fundamentals-well-architected-003
    difficulty: intermediate
    tags: [global-infrastructure, az-id]
    question: |
      Two teams in different AWS accounts both deploy to "us-east-1a". Why might these NOT be the
      same physical Availability Zone?
    options:
      - "AZ names like us-east-1a are randomly mapped per account; the physical AZ is identified by a stable AZ ID such as use1-az4"
      - "us-east-1a always refers to the same data center in every account without exception"
      - "AZ letters rotate hourly for load balancing"
      - "Each account gets its own private set of physically distinct AZs not shared with anyone"
    answer: 0
    explanation: |
      AWS randomizes the letter-suffix AZ names per account to balance usage, so my us-east-1a
      may be your us-east-1b physically. The stable cross-account identifier is the AZ ID (e.g.,
      use1-az4). (B) contradicts this. (C) and (D) are fabricated.
    ref: "concepts.md#global-infrastructure-regions-availability-zones-and-edge"

  - id: aws-fundamentals-well-architected-004
    difficulty: intermediate
    tags: [global-infrastructure, local-zones, latency]
    question: |
      A media company needs single-digit-millisecond latency to users in a specific metro area
      for a real-time rendering workload, but the nearest Region is ~40 ms away. Which AWS
      construct is designed for this?
    options:
      - "Deploy in a second full Region and use Route 53 latency routing"
      - "Move the workload entirely onto CloudFront edge locations"
      - "Enable S3 Transfer Acceleration"
      - "Use an AWS Local Zone, which extends a Region into the metro for single-digit-ms latency to that metro"
    answer: 3
    explanation: |
      Local Zones place a subset of compute/storage services in a metro to give single-digit-ms
      latency there. A full second Region (A) doesn't fix the local latency problem and is far
      heavier. S3 Transfer Acceleration (C) is for uploads to S3, not compute latency. CloudFront
      (B) caches content but cannot run an arbitrary rendering workload as a full compute plane.
    ref: "concepts.md#global-infrastructure-regions-availability-zones-and-edge"

  - id: aws-fundamentals-well-architected-005
    difficulty: advanced
    tags: [global-infrastructure, outposts, wavelength, hybrid]
    question: |
      A bank must keep certain data physically inside its own on-premises data center for
      regulatory reasons but wants a consistent AWS API/operational model. Which option fits best,
      and what is the primary trade-off?
    options:
      - "AWS Wavelength; trade-off is dependence on a 5G carrier network"
      - "A Local Zone; trade-off is a reduced service catalog"
      - "AWS Outposts (AWS-managed racks in the customer's data center); trade-off is higher cost and you manage the physical facility/space/power while AWS manages the hardware"
      - "CloudFront with Lambda@Edge; trade-off is cold starts"
    answer: 2
    explanation: |
      Outposts brings AWS-managed hardware into your own facility for data-residency/low-latency-
      to-on-prem, keeping the AWS API model, at higher cost and with you providing space/power.
      Wavelength (A) targets 5G mobile edge, not on-prem residency. Local Zones (B) are in AWS
      metro facilities, not your building. CloudFront/Lambda@Edge (D) is content delivery, not
      data residency.
    ref: "concepts.md#global-infrastructure-regions-availability-zones-and-edge"

  - id: aws-fundamentals-well-architected-006
    difficulty: beginner
    tags: [shared-responsibility]
    question: |
      Under the AWS Shared Responsibility Model, which is AWS responsible for?
    options:
      - "Configuring IAM policies for your users"
      - "Classifying and encrypting your application data"
      - "Security OF the cloud: the physical hardware, global infrastructure, and hypervisor"
      - "Patching the guest OS on your EC2 instances"
    answer: 2
    explanation: |
      AWS owns security OF the cloud (hardware, facilities, hypervisor, managed-service software).
      IAM config (A), data classification/encryption choices (B), and EC2 guest-OS patching (D)
      are all customer responsibilities ("in the cloud").
    ref: "concepts.md#the-shared-responsibility-model"

  - id: aws-fundamentals-well-architected-007
    difficulty: intermediate
    tags: [shared-responsibility, patching]
    question: |
      Which statement about OS patching responsibility across service models is correct?
    options:
      - "AWS patches the guest OS for EC2 but you patch it for RDS"
      - "You patch the guest OS for EC2; AWS patches the underlying OS/engine for RDS and Lambda"
      - "You patch the OS for all services including Lambda and S3"
      - "AWS patches everything including your application code in every model"
    answer: 1
    explanation: |
      For IaaS (EC2) the customer patches the guest OS (or uses SSM Patch Manager). For managed
      services (RDS, Lambda) AWS patches the OS/engine. (A) reverses it. (C) is wrong — you never
      patch Lambda/S3 OS. (D) is wrong — application code/config is always the customer's.
    ref: "concepts.md#the-shared-responsibility-model"

  - id: aws-fundamentals-well-architected-008
    difficulty: intermediate
    tags: [shared-responsibility, security]
    question: |
      As a workload moves from EC2 toward fully serverless (Lambda/DynamoDB/S3), what happens to
      the customer's security responsibility, and what is the associated trade-off?
    options:
      - "The customer's security surface grows because more services are involved"
      - "AWS takes over IAM and data classification once you go serverless"
      - "Responsibility stays exactly the same regardless of service model"
      - "The customer's security surface shrinks (less OS/patching/infra to secure) but control decreases and lock-in/unit-cost can rise"
    answer: 3
    explanation: |
      Moving up the stack shrinks the customer's operational/security surface (no OS to patch,
      no servers) but reduces control and can raise per-unit cost and lock-in. IAM and data
      classification remain the customer's in every model, so (B) is false. (A) and (C) are wrong.
    ref: "concepts.md#the-shared-responsibility-model"

  - id: aws-fundamentals-well-architected-009
    difficulty: beginner
    tags: [well-architected, pillars]
    question: |
      Which is NOT one of the six AWS Well-Architected Framework pillars?
    options:
      - "Operational Excellence"
      - "Scalability"
      - "Sustainability"
      - "Cost Optimization"
    answer: 1
    explanation: |
      The six pillars are Operational Excellence, Security, Reliability, Performance Efficiency,
      Cost Optimization, and Sustainability. "Scalability" is not a pillar (it is addressed within
      Performance Efficiency and Reliability).
    ref: "concepts.md#operational-excellence-pillar"

  - id: aws-fundamentals-well-architected-010
    difficulty: beginner
    tags: [well-architected, operational-excellence, iac]
    question: |
      "Perform operations as code" is a design principle of which pillar, and what does it mean in
      AWS practice?
    options:
      - "Cost Optimization; it means using Spot instances for all workloads"
      - "Reliability; it means never changing production"
      - "Security; it means writing all IAM policies by hand"
      - "Operational Excellence; it means defining infrastructure and operations procedures as code (CloudFormation/CDK, Automation runbooks) for repeatability and review"
    answer: 3
    explanation: |
      Operational Excellence promotes operations-as-code via IaC (CloudFormation/CDK) and
      automated runbooks, enabling repeatable, reviewable, reversible changes. The others
      misattribute the principle.
    ref: "concepts.md#operational-excellence-pillar"

  - id: aws-fundamentals-well-architected-011
    difficulty: advanced
    tags: [operational-excellence, deployments, trade-offs]
    question: |
      A team wants to minimize the blast radius of a bad deployment but is cost-sensitive. What is
      the trade-off between blue/green and canary/rolling deployments?
    options:
      - "Blue/green cuts deploy risk by standing up a full parallel environment (temporarily ~doubling infra cost); canary/rolling is cheaper but exposes a fraction of live users to a bad change"
      - "Blue/green has zero cost impact; canary always doubles cost"
      - "They are identical in cost and risk profile"
      - "Canary eliminates all user-facing risk while blue/green exposes all users at once"
    answer: 0
    explanation: |
      Blue/green provisions a full parallel environment (higher temporary cost, instant rollback,
      no user sees the bad version if health checks catch it before cutover). Canary/rolling is
      cheaper (no duplicate fleet) but a slice of real users hits the new version during the roll.
      (B), (C), (D) mischaracterize the trade-off.
    ref: "concepts.md#operational-excellence-pillar"

  - id: aws-fundamentals-well-architected-012
    difficulty: intermediate
    tags: [security-pillar, secrets]
    question: |
      When should you choose AWS Secrets Manager over SSM Parameter Store SecureString for storing
      a database credential?
    options:
      - "Always, because Parameter Store cannot store secrets at all"
      - "When you need automatic, scheduled secret rotation and cross-account sharing, accepting the per-secret monthly and per-API-call cost"
      - "When you want the cheapest possible option with no other requirements"
      - "Never; Secrets Manager cannot integrate with RDS"
    answer: 1
    explanation: |
      Secrets Manager adds built-in rotation, tighter access control, and cross-account sharing at
      a per-secret + per-call cost. Parameter Store SecureString is effectively free but lacks
      built-in rotation. (A) is false (Parameter Store SecureString stores secrets). (C) favors
      Parameter Store, not Secrets Manager. (D) is false (Secrets Manager has RDS rotation).
    ref: "concepts.md#security-pillar"

  - id: aws-fundamentals-well-architected-013
    difficulty: advanced
    tags: [security-pillar, kms, encryption]
    question: |
      Why is envelope encryption (KMS wrapping a data key) the standard pattern instead of
      encrypting large data directly through KMS?
    options:
      - "KMS cannot encrypt anything smaller than 1 GB"
      - "Direct KMS encryption is more secure but banned by AWS policy"
      - "Envelope encryption avoids using KMS entirely"
      - "KMS API is designed to encrypt small data keys, not bulk data; you generate a data key, encrypt bulk data locally with it, and only the small data key round-trips to KMS — this scales and limits KMS call volume/cost"
    answer: 3
    explanation: |
      KMS encrypts small payloads (limited size) and charges per call; envelope encryption uses
      GenerateDataKey to encrypt bulk data locally with a plaintext data key, storing only the
      KMS-wrapped data key. This scales to large objects and controls KMS request volume/cost.
      (A) is not the reasoning. (C) is false (envelope encryption uses KMS). (B) is fabricated.
    ref: "concepts.md#security-pillar"

  - id: aws-fundamentals-well-architected-014
    difficulty: intermediate
    tags: [security-pillar, network]
    question: |
      What is the key difference between a VPC Security Group and a Network ACL (NACL)?
    options:
      - "Security groups are stateful (return traffic auto-allowed) and operate at the instance/ENI level; NACLs are stateless and operate at the subnet level"
      - "Security groups are stateless; NACLs are stateful"
      - "They are identical and interchangeable"
      - "NACLs can only allow, never deny"
    answer: 0
    explanation: |
      Security groups are stateful (allow rules only, return traffic automatically permitted),
      attached to ENIs/instances. NACLs are stateless (you must allow both directions explicitly),
      support allow and deny rules, and operate at the subnet boundary. (B) reverses statefulness.
      (C) and (D) are false.
    ref: "concepts.md#security-pillar"

  - id: aws-fundamentals-well-architected-015
    difficulty: intermediate
    tags: [reliability-pillar, nines, availability]
    question: |
      Approximately how much downtime per year does a 99.99% ("four nines") availability target
      allow?
    options:
      - "~8.77 hours per year"
      - "~52.6 minutes per year"
      - "~5.26 minutes per year"
      - "~9 hours per year"
    answer: 1
    explanation: |
      99.99% allows ~52.6 minutes/year of downtime. 99.9% (three nines) ~8.77 hours (A/D).
      99.999% (five nines) ~5.26 minutes (C). Knowing these mappings is a common interview check.
    ref: "concepts.md#reliability-pillar"

  - id: aws-fundamentals-well-architected-016
    difficulty: intermediate
    tags: [reliability-pillar, rto-rpo]
    question: |
      A stakeholder says "we can lose at most 1 second of data but can tolerate up to 5 minutes to
      come back online." Which pair of metrics are they specifying?
    options:
      - "RPO = 5 minutes, RTO = 1 second"
      - "Both are RPO"
      - "Both are RTO"
      - "RPO = 1 second, RTO = 5 minutes"
    answer: 3
    explanation: |
      RPO (recovery point objective) = tolerable data loss = 1 second here. RTO (recovery time
      objective) = tolerable time to restore service = 5 minutes. (A) swaps them; (C)/(B) conflate
      the two distinct metrics.
    ref: "concepts.md#reliability-pillar"

  - id: aws-fundamentals-well-architected-017
    difficulty: advanced
    tags: [reliability-pillar, static-stability, control-plane]
    question: |
      Why is "call CreateInstance / CreateResource APIs during a failover to bring up replacement
      capacity" considered a static-stability anti-pattern?
    options:
      - "It makes recovery depend on the control plane, which is less reliable than the data plane and may itself be degraded during the very event you're recovering from"
      - "Those APIs are cheaper during incidents"
      - "The data plane is always slower than the control plane"
      - "AWS forbids calling any API during an outage"
    answer: 0
    explanation: |
      Static stability means the system keeps working using already-provisioned resources without
      needing the control plane mid-incident. Provisioning APIs (control plane) are less reliable
      than the data plane and may be impaired during a large event, so depending on them for
      recovery is fragile. Pre-provision capacity and use data-plane mechanisms (health checks,
      standby capacity) instead. Other options are false.
    ref: "concepts.md#reliability-pillar"

  - id: aws-fundamentals-well-architected-018
    difficulty: advanced
    tags: [reliability-pillar, retries, backoff]
    question: |
      A service retries failed downstream calls immediately and aggressively. During a brief
      downstream slowdown the whole system collapses. What reliability techniques address this?
    options:
      - "Remove all retries so no extra load is ever generated"
      - "Add exponential backoff with jitter, a circuit breaker, and idempotency to avoid retry storms and metastable failure"
      - "Increase the retry rate so requests eventually succeed faster"
      - "Switch every call to synchronous blocking calls"
    answer: 1
    explanation: |
      Aggressive synchronized retries create retry storms and metastable failures. The fix is
      exponential backoff + jitter (de-synchronize retries), circuit breakers (stop hammering a
      failing dependency), and idempotency (safe to retry). Removing retries entirely (A) loses
      transient-fault tolerance; increasing retries (C) worsens the storm; (D) is unrelated.
    ref: "concepts.md#reliability-pillar"

  - id: aws-fundamentals-well-architected-019
    difficulty: intermediate
    tags: [performance-efficiency, graviton]
    question: |
      What is the primary trade-off of moving compute to AWS Graviton (ARM) instances?
    options:
      - "No trade-off — Graviton is strictly worse in every dimension"
      - "Graviton removes the need for auto scaling"
      - "Graviton only runs Windows workloads"
      - "~20-40% better price-performance, but you must build/run ARM-compatible artifacts (recompile, verify dependencies)"
    answer: 3
    explanation: |
      Graviton typically delivers ~20-40% better price-performance; the cost is ARM compatibility
      (recompile binaries, verify libraries/container images support arm64). (A), (C), (B) are
      false.
    ref: "concepts.md#performance-efficiency-pillar"

  - id: aws-fundamentals-well-architected-020
    difficulty: advanced
    tags: [performance-efficiency, serverless, cost]
    question: |
      For a workload with sustained, predictable high throughput running 24/7, why might Lambda be
      a poor performance-efficiency AND cost choice compared to always-on containers/EC2?
    options:
      - "At sustained high volume, Lambda's per-request pricing typically exceeds the cost of right-sized always-on compute (with Savings Plans), and cold starts hurt tail latency"
      - "Lambda cannot process more than 100 requests total"
      - "Lambda always has lower latency than any container"
      - "Containers cannot scale, so Lambda is always required"
    answer: 0
    explanation: |
      Serverless shines for spiky/low-utilization workloads (zero idle cost, instant scale). At
      steady high load, per-invocation pricing overtakes right-sized reserved compute, and cold
      starts add tail latency. (B), (C), (D) are false.
    ref: "concepts.md#performance-efficiency-pillar"

  - id: aws-fundamentals-well-architected-021
    difficulty: beginner
    tags: [cost-optimization, purchasing]
    question: |
      Which purchasing model offers the deepest discount (up to ~90%) but can be interrupted with
      about a 2-minute warning?
    options:
      - "On-Demand"
      - "Reserved Instances"
      - "Spot Instances"
      - "Dedicated Hosts"
    answer: 2
    explanation: |
      Spot offers up to ~90% off unused capacity but can be reclaimed with a ~2-minute warning,
      making it ideal for fault-tolerant/stateless batch. On-Demand (A) is flexible/full price.
      RIs (B) are ~up to 72% off via commitment, not interruptible. Dedicated Hosts (D) are for
      licensing/isolation, not deep discount.
    ref: "concepts.md#cost-optimization-pillar"

  - id: aws-fundamentals-well-architected-022
    difficulty: intermediate
    tags: [cost-optimization, savings-plans, trade-offs]
    question: |
      What is the central trade-off of committing to a 3-year Compute Savings Plan versus staying
      On-Demand?
    options:
      - "Savings Plans are more expensive per hour than On-Demand"
      - "You trade flexibility for a large discount: over-commit and you pay for unused capacity; under-commit and you leave savings unclaimed"
      - "Savings Plans only apply to S3 storage"
      - "There is no commitment involved in a Savings Plan"
    answer: 1
    explanation: |
      Savings Plans (and RIs) exchange a usage/spend commitment for a big discount (up to ~72%).
      The risk is sizing the commitment: too high wastes money on idle commitment, too low misses
      savings. Compute Savings Plans are flexible across family/Region/OS and cover Fargate/Lambda.
      (A), (C), (D) are false.
    ref: "concepts.md#cost-optimization-pillar"

  - id: aws-fundamentals-well-architected-023
    difficulty: advanced
    tags: [cost-optimization, data-transfer]
    question: |
      A design chats heavily between microservices deployed across different AZs and replicates
      data to another Region. Which often-overlooked cost driver should you scrutinize first?
    options:
      - "Ingress data transfer from the internet, which is the most expensive dimension"
      - "The cost of IAM policy evaluations per request"
      - "CloudWatch log retention, which always dominates any AWS bill"
      - "Data transfer charges: cross-AZ, cross-Region, and internet egress all cost money (ingress is usually free)"
    answer: 3
    explanation: |
      Cross-AZ, cross-Region, and internet egress data transfer are frequently underestimated;
      inbound (ingress) is usually free. Chatty cross-AZ traffic plus cross-Region replication can
      dominate a bill. (A) is wrong — internet ingress is typically free, egress costs. (C) and
      (B) are not typically dominant, and IAM evaluations aren't billed per request.
    ref: "concepts.md#cost-optimization-pillar"

  - id: aws-fundamentals-well-architected-024
    difficulty: beginner
    tags: [sustainability]
    question: |
      Which action most directly supports the Sustainability pillar?
    options:
      - "Maximizing utilization by right-sizing and consolidating workloads, and adopting more efficient hardware like Graviton"
      - "Provisioning large idle standby fleets just in case"
      - "Keeping every workload multi-Region active-active regardless of need"
      - "Storing all data in the most expensive storage tier"
    answer: 0
    explanation: |
      Sustainability rewards high utilization (right-sizing, consolidation) and efficient hardware
      (Graviton), reducing energy per unit of work. Idle standby fleets (B) and unnecessary
      active-active (C) increase carbon. (D) is a cost/storage-tiering issue, not sustainability.
    ref: "concepts.md#sustainability-pillar"

  - id: aws-fundamentals-well-architected-025
    difficulty: advanced
    tags: [sustainability, trade-offs]
    question: |
      When can the Sustainability and Reliability pillars conflict?
    options:
      - "They never conflict; both always recommend the same action"
      - "Maximum redundancy (idle standby capacity, multi-Region active-active) improves reliability but lowers utilization and raises carbon footprint, so extreme reliability can work against sustainability"
      - "Sustainability requires single points of failure"
      - "Reliability requires the least efficient hardware available"
    answer: 1
    explanation: |
      Sustainability favors high utilization; heavy redundancy for reliability (idle standbys,
      always-on multi-Region) lowers utilization and increases energy use, creating a real
      tension. Cost optimization usually aligns with sustainability, but reliability can pull the
      other way. (A), (C), (D) are false.
    ref: "concepts.md#sustainability-pillar"

  - id: aws-fundamentals-well-architected-026
    difficulty: intermediate
    tags: [service-selection, serverless-first]
    question: |
      Following "serverless-first" thinking, what is the recommended default stack for a new
      event-driven web backend before you have a reason to deviate?
    options:
      - "EC2 fleet + self-managed PostgreSQL + self-hosted Kafka"
      - "EKS with a self-managed control plane on EC2"
      - "A single large EC2 instance running everything"
      - "Lambda + API Gateway + DynamoDB + S3 + EventBridge, deviating only for sustained high load, long-running/stateful, special runtimes, or ultra-low-latency needs"
    answer: 3
    explanation: |
      Serverless-first defaults to managed/serverless building blocks (Lambda, API Gateway,
      DynamoDB, S3, EventBridge) to minimize ops and idle cost, deviating only for concrete
      constraints. The other options carry heavy undifferentiated ops burden without justification.
    ref: "concepts.md#choosing-a-service-managed-versus-self-managed-and-serverless-first"

  - id: aws-fundamentals-well-architected-027
    difficulty: advanced
    tags: [service-selection, managed-vs-self-managed, trade-offs]
    question: |
      What is the PRIMARY trade-off of choosing a fully managed service (e.g., DynamoDB, Aurora)
      over self-managing the equivalent on EC2?
    options:
      - "You gain development velocity, built-in HA/backup/patching, and lower ops burden, but give up control and portability and risk higher unit cost at extreme scale plus lock-in"
      - "Managed services are always cheaper at every scale with no downsides"
      - "Self-managed services require no operational effort"
      - "Managed services cannot be made highly available"
    answer: 0
    explanation: |
      Managed services trade control/portability and potential cost-at-scale/lock-in for velocity,
      reduced ops, and built-in resilience. (B) ignores cost-at-scale and lock-in. (C) is false —
      self-managed carries heavy ops. (D) is false — managed services are often HA by default.
    ref: "concepts.md#choosing-a-service-managed-versus-self-managed-and-serverless-first"

  - id: aws-fundamentals-well-architected-028
    difficulty: intermediate
    tags: [service-selection, access-pattern]
    question: |
      A workload needs ACID transactions, complex multi-table joins, and ad-hoc SQL queries at
      moderate scale. Which service fits best?
    options:
      - "DynamoDB, because it scales infinitely"
      - "Amazon Aurora / RDS, because relational engines provide transactions, joins, and ad-hoc SQL"
      - "S3, because it is durable and cheap"
      - "Kinesis Data Streams, because it is ordered"
    answer: 1
    explanation: |
      Rich transactional/relational access patterns (joins, ad-hoc SQL) map to Aurora/RDS.
      DynamoDB (A) requires known access patterns and lacks joins/ad-hoc queries. S3 (C) is object
      storage, not a query engine. Kinesis (D) is a stream, not a database.
    ref: "concepts.md#choosing-a-service-managed-versus-self-managed-and-serverless-first"

  - id: aws-fundamentals-well-architected-029
    difficulty: beginner
    tags: [iam, evaluation]
    question: |
      In IAM policy evaluation, what wins when an explicit Deny and an explicit Allow both apply to
      the same action?
    options:
      - "The explicit Allow, because Allow is more specific"
      - "Whichever policy was created most recently"
      - "The explicit Deny always overrides any Allow"
      - "Access is granted only during business hours"
    answer: 2
    explanation: |
      IAM evaluation is: explicit Deny > Allow > implicit (default) Deny. An explicit Deny anywhere
      (identity policy, resource policy, SCP, boundary) overrides any Allow. (A), (B), (D) are
      false.
    ref: "concepts.md#iam-and-account-structure"

  - id: aws-fundamentals-well-architected-030
    difficulty: intermediate
    tags: [iam, roles, best-practice]
    question: |
      Why are IAM roles (with temporary STS credentials) preferred over long-lived IAM user access
      keys for workloads?
    options:
      - "Roles are free while access keys cost money per use"
      - "Roles bypass IAM policy evaluation entirely"
      - "Access keys cannot call any AWS API"
      - "Roles vend short-lived, auto-expiring credentials, so there are no long-lived secrets to leak or rotate — reducing credential-theft blast radius"
    answer: 3
    explanation: |
      Roles provide temporary, auto-expiring STS credentials (via instance profiles, IRSA, Lambda
      execution roles), eliminating static secrets that can leak. (A) is false (pricing isn't the
      reason). (C) is false. (B) is dangerously false — roles are still subject to policy
      evaluation.
    ref: "concepts.md#iam-and-account-structure"

  - id: aws-fundamentals-well-architected-031
    difficulty: advanced
    tags: [iam, scp, evaluation]
    question: |
      An IAM role has an identity-based policy that allows s3:GetObject, but an SCP on the account's
      OU denies s3:*. Can the role read the S3 object?
    options:
      - "No — an SCP is a permission ceiling; it can only limit, and its explicit Deny removes the permission regardless of the identity Allow"
      - "Yes, identity-based Allow overrides an SCP"
      - "Yes, but only for objects created after the SCP was applied"
      - "It depends on which policy is larger in bytes"
    answer: 0
    explanation: |
      SCPs never grant; they cap what identities in the account can do. An SCP deny removes the
      action even if an identity policy allows it — explicit Deny wins. So the role cannot read
      the object. (B), (C), (D) are false.
    ref: "concepts.md#iam-and-account-structure"

  - id: aws-fundamentals-well-architected-032
    difficulty: advanced
    tags: [iam, resource-based-policy, cross-account]
    question: |
      What capability do resource-based policies (e.g., on an S3 bucket or SQS queue) provide that
      identity-based policies alone do not, and what is the downside?
    options:
      - "They allow cross-account access directly without the caller assuming a role, but they are harder to audit centrally"
      - "They automatically encrypt all data with KMS"
      - "They override explicit Deny statements"
      - "They eliminate the need for any IAM evaluation"
    answer: 0
    explanation: |
      Resource-based policies can grant a principal in another account access directly (no role
      hop), which is powerful but scatters access grants across resources, making central audit
      harder. They do not override explicit Deny (C), do not auto-encrypt (B), and are still part
      of IAM evaluation (D).
    ref: "concepts.md#iam-and-account-structure"

  - id: aws-fundamentals-well-architected-033
    difficulty: beginner
    tags: [multi-account, organizations]
    question: |
      What is the primary reason to use separate AWS accounts for prod, dev, and test rather than
      one shared account?
    options:
      - "Separate accounts get faster network speeds"
      - "The account is the strongest natural blast-radius, security, and billing boundary, isolating environments and limiting the impact of a breach or mistake"
      - "AWS requires a minimum of three accounts per customer"
      - "You cannot run more than one application in a single account"
    answer: 1
    explanation: |
      The AWS account is the strongest isolation boundary for blast radius, security, cost
      attribution, and quotas. Separating environments limits breach/mistake impact and gives clean
      billing. (A), (C), (D) are false.
    ref: "concepts.md#multi-account-strategy-with-organizations-control-tower-and-landing-zones"

  - id: aws-fundamentals-well-architected-034
    difficulty: intermediate
    tags: [multi-account, control-tower, landing-zone]
    question: |
      What does AWS Control Tower provide?
    options:
      - "A managed Kubernetes control plane"
      - "A CDN for global content delivery"
      - "An opinionated, automated multi-account landing zone with a management account, log-archive and audit accounts, preventive/detective guardrails, and Account Factory for vending accounts"
      - "A relational database with automatic sharding"
    answer: 2
    explanation: |
      Control Tower sets up and governs a multi-account landing zone: management account,
      log-archive + audit accounts, guardrails (SCPs + Config rules), and Account Factory. (A) is
      EKS, (B) is CloudFront, (D) is a database — all wrong.
    ref: "concepts.md#multi-account-strategy-with-organizations-control-tower-and-landing-zones"

  - id: aws-fundamentals-well-architected-035
    difficulty: advanced
    tags: [multi-account, management-account, blast-radius]
    question: |
      Why is it a best practice NOT to run workloads in the AWS Organizations management (payer)
      account?
    options:
      - "The management account cannot launch EC2 instances"
      - "AWS charges double for compute in the management account"
      - "Workloads run 10x slower in the management account"
      - "The management account holds org-wide administrative power (it can manage all accounts and SCPs), so running workloads there creates an unacceptably large blast radius if compromised"
    answer: 3
    explanation: |
      The management account controls the entire Organization (accounts, SCPs, billing). A
      compromise or mistake there has org-wide blast radius, so keep it workload-free and use
      dedicated workload accounts. (A), (C), (B) are false.
    ref: "concepts.md#multi-account-strategy-with-organizations-control-tower-and-landing-zones"

  - id: aws-fundamentals-well-architected-036
    difficulty: advanced
    tags: [multi-account, trade-offs, networking]
    question: |
      What is the main trade-off of a fine-grained multi-account strategy (many accounts per
      team/app)?
    options:
      - "Better isolation and cost attribution, but more operational overhead — networking must be stitched together (Transit Gateway/peering/RAM), identity centralized (Identity Center), and cross-account access managed via roles"
      - "Weaker isolation than a single account"
      - "It removes the need for IAM entirely"
      - "It makes consolidated billing impossible"
    answer: 0
    explanation: |
      More accounts improve isolation and cost clarity but add overhead: connecting networks
      (Transit Gateway/VPC peering/RAM), centralizing identity, and managing cross-account roles.
      (B) is backwards. (C) is false. (D) is false — Organizations gives consolidated billing.
    ref: "concepts.md#multi-account-strategy-with-organizations-control-tower-and-landing-zones"

  - id: aws-fundamentals-well-architected-037
    difficulty: beginner
    tags: [resilience, multi-az, rds]
    question: |
      What does enabling RDS Multi-AZ give you?
    options:
      - "A read replica in another Region for global reads"
      - "A synchronous standby in another AZ with automatic failover, surviving a single-AZ failure with ~zero data loss"
      - "Automatic sharding of the database across AZs"
      - "A serverless database that scales to zero"
    answer: 1
    explanation: |
      RDS Multi-AZ maintains a synchronous standby in a different AZ and fails over automatically
      (~60-120s, or faster with Multi-AZ cluster), giving HA within a Region with near-zero data
      loss. It is not cross-Region (A), not sharding (C), and not serverless scale-to-zero (D).
    ref: "concepts.md#resilience-building-blocks-multi-az-and-multi-region"

  - id: aws-fundamentals-well-architected-038
    difficulty: intermediate
    tags: [resilience, dr-patterns, rto-rpo]
    question: |
      Rank the four AWS DR patterns from lowest to highest RTO (fastest recovery to slowest).
    options:
      - "Backup & Restore < Pilot Light < Warm Standby < Multi-site Active-Active"
      - "Pilot Light < Backup & Restore < Multi-site Active-Active < Warm Standby"
      - "Multi-site Active-Active < Warm Standby < Pilot Light < Backup & Restore"
      - "They all have identical RTO"
    answer: 2
    explanation: |
      Active-active has near-zero RTO (already serving), then Warm Standby (minutes), Pilot Light
      (tens of minutes), Backup & Restore (hours). Cost/complexity move in the same order. (A)
      reverses it, (B) is scrambled, (D) is false.
    ref: "concepts.md#resilience-building-blocks-multi-az-and-multi-region"

  - id: aws-fundamentals-well-architected-039
    difficulty: advanced
    tags: [resilience, dr-patterns, scenario]
    question: |
      A business requires RTO of a few minutes and RPO of seconds, but wants to avoid the cost and
      conflict-resolution complexity of full active-active. Which DR pattern fits best?
    options:
      - "Backup & Restore, because it is cheapest"
      - "Pilot Light, because it keeps everything off until needed"
      - "Warm Standby: a scaled-down but fully functional copy always running, scaled up on failover — minutes RTO, seconds RPO, without multi-master conflict handling"
      - "Multi-site Active-Active, because only it can meet any RTO"
    answer: 2
    explanation: |
      Warm Standby keeps a smaller live copy running (RTO minutes, RPO seconds) and scales up on
      failover, avoiding active-active's cost and cross-Region conflict resolution. Backup &
      Restore (A) gives hours RTO. Pilot Light (B) typically gives tens of minutes. Active-active
      (D) is overkill and reintroduces the complexity they want to avoid.
    ref: "concepts.md#resilience-building-blocks-multi-az-and-multi-region"

  - id: aws-fundamentals-well-architected-040
    difficulty: expert
    tags: [resilience, active-active, consistency]
    question: |
      A team proposes multi-Region active-active using DynamoDB global tables to serve writes from
      two Regions simultaneously. What is the fundamental correctness challenge they must design
      for?
    options:
      - "Global tables cannot replicate across Regions"
      - "Global tables require the application to run in only one Region"
      - "Global tables force strong consistency across Regions, causing high write latency"
      - "Cross-Region writes are eventually consistent and conflicts are resolved last-writer-wins, so concurrent writes to the same item in different Regions can silently lose an update unless the data model avoids or handles conflicts"
    answer: 3
    explanation: |
      DynamoDB global tables are multi-active and eventually consistent with last-writer-wins
      conflict resolution. Concurrent writes to the same item from different Regions can overwrite
      each other, so the data model must avoid contended cross-Region writes or use conflict-
      tolerant designs (e.g., per-Region key partitioning, CRDT-like patterns). (A), (C), (B) are
      false.
    ref: "concepts.md#resilience-building-blocks-multi-az-and-multi-region"

  - id: aws-fundamentals-well-architected-041
    difficulty: expert
    tags: [resilience, cell-based, blast-radius]
    question: |
      What problem does a cell-based architecture (with shuffle sharding) primarily solve?
    options:
      - "It limits blast radius: users are partitioned into independent cells (each a full stack), so a bad deploy or poison-pill request degrades only one cell rather than the whole fleet"
      - "It reduces storage cost by deduplicating data"
      - "It guarantees strong consistency across Regions"
      - "It eliminates the need for load balancers"
    answer: 0
    explanation: |
      Cell-based architecture partitions the system into independent, full-stack cells so failures
      (bad deploys, poison pills, noisy neighbors) are contained to one cell; shuffle sharding
      further reduces the chance any two customers share the same failing set of resources. It is
      about blast-radius containment, not cost dedup (B), cross-Region consistency (C), or
      removing LBs (D).
    ref: "concepts.md#resilience-building-blocks-multi-az-and-multi-region"

  - id: aws-fundamentals-well-architected-042
    difficulty: beginner
    tags: [mapping, s3, durability]
    question: |
      What durability does Amazon S3 Standard advertise for objects?
    options:
      - "99.9% (three nines)"
      - "99.99% (four nines)"
      - "99.999999999% (eleven nines)"
      - "100% guaranteed, no data loss ever possible"
    answer: 2
    explanation: |
      S3 is designed for 11 nines (99.999999999%) of durability by redundantly storing objects
      across multiple devices and AZs. Availability is ~4 nines for Standard. (A)/(B) understate
      durability; (D) is not a claim any service makes.
    ref: "concepts.md#mapping-aws-to-generic-system-design-primitives"

  - id: aws-fundamentals-well-architected-043
    difficulty: intermediate
    tags: [mapping, s3, consistency]
    question: |
      Since December 2020, what consistency model does Amazon S3 provide for object operations?
    options:
      - "Eventual consistency for all operations"
      - "Strong read-after-write consistency for PUTs of new objects and overwrite PUTs and DELETEs of existing objects"
      - "Strong consistency only for new objects, eventual for overwrites forever"
      - "No consistency guarantees at all"
    answer: 1
    explanation: |
      Since Dec 2020, S3 provides strong read-after-write consistency for all GET/PUT/LIST
      operations, including overwrites and deletes, at no extra cost. The old caveat about eventual
      consistency for overwrites (C) and general eventual consistency (A) are outdated. (D) is
      false.
    ref: "concepts.md#mapping-aws-to-generic-system-design-primitives"

  - id: aws-fundamentals-well-architected-044
    difficulty: intermediate
    tags: [mapping, dynamodb, limits]
    question: |
      What is the maximum size of a single DynamoDB item?
    options:
      - "64 KB"
      - "256 KB"
      - "400 KB"
      - "1 MB"
    answer: 2
    explanation: |
      A DynamoDB item (all attribute names + values) is capped at 400 KB. Larger blobs should be
      stored in S3 with a pointer in DynamoDB. 256 KB (B) is the SQS message limit; 1 MB (D) is
      the Kinesis shard ingest/record-ish figure — common distractors.
    ref: "concepts.md#mapping-aws-to-generic-system-design-primitives"

  - id: aws-fundamentals-well-architected-045
    difficulty: advanced
    tags: [mapping, dynamodb, hot-partition]
    question: |
      A DynamoDB table uses a low-cardinality partition key (e.g., a single "status=active" value
      for most rows). What failure mode will this design hit first at scale?
    options:
      - "The 400 KB item-size limit"
      - "Cross-Region replication lag"
      - "A hot partition: per-partition throughput is capped (~3,000 RCU / 1,000 WCU), so concentrating traffic on one partition key causes throttling even if table-level capacity is high"
      - "Running out of AZs"
    answer: 2
    explanation: |
      DynamoDB caps throughput per physical partition (~3,000 RCU / 1,000 WCU). A low-cardinality
      partition key funnels traffic to one partition, causing throttling (hot partition) regardless
      of provisioned table capacity. Fix with high-cardinality keys / write sharding. (A), (B), (D)
      are not the first limit hit here.
    ref: "concepts.md#mapping-aws-to-generic-system-design-primitives"

  - id: aws-fundamentals-well-architected-046
    difficulty: intermediate
    tags: [mapping, lambda, limits]
    question: |
      Which set of Lambda limits is correct?
    options:
      - "Max timeout 5 minutes, max memory 3 GB, ephemeral /tmp 512 MB fixed"
      - "Max timeout unlimited, max memory 128 GB, ephemeral /tmp 100 GB"
      - "Max timeout 60 minutes, max memory 64 GB, ephemeral /tmp 1 GB"
      - "Max timeout 15 minutes, max memory 10 GB, ephemeral /tmp up to 10 GB"
    answer: 3
    explanation: |
      Lambda: 15-minute max timeout, up to 10 GB memory (CPU scales with memory), and up to 10 GB
      configurable ephemeral /tmp (default 512 MB). (A) uses the old 5-min/512 MB figures. (B) and
      (C) are fabricated.
    ref: "concepts.md#mapping-aws-to-generic-system-design-primitives"

  - id: aws-fundamentals-well-architected-047
    difficulty: advanced
    tags: [mapping, api-gateway, timeout]
    question: |
      A synchronous request goes API Gateway -> Lambda, and the backend sometimes takes 45 seconds.
      Which limit is most likely to break this design, and what is the fix?
    options:
      - "API Gateway's default 29-second integration timeout will abort the request; make the operation asynchronous (e.g., return 202 and process via a queue/Step Functions, poll or callback for the result)"
      - "Lambda's 15-minute timeout; there is no fix"
      - "S3's 5 TB object limit; store the response in S3"
      - "DynamoDB's 400 KB item limit; split the item"
    answer: 0
    explanation: |
      API Gateway's default integration timeout is 29 seconds, so a 45-second synchronous backend
      will time out at the gateway even though Lambda itself allows up to 15 minutes. The pattern
      is to make the call asynchronous (accept the request, process in the background, and
      poll/notify). (B) misidentifies the limit; (C) and (D) are irrelevant.
    ref: "concepts.md#mapping-aws-to-generic-system-design-primitives"

  - id: aws-fundamentals-well-architected-048
    difficulty: intermediate
    tags: [mapping, alb-nlb]
    question: |
      When should you choose a Network Load Balancer (NLB) over an Application Load Balancer (ALB)?
    options:
      - "When you need HTTP path-based and host-based routing"
      - "When you need L4 (TCP/UDP) handling, ultra-low latency, extreme connection scale, a static IP, or source-IP preservation"
      - "When you need to run WebSocket and gRPC with content-based rules"
      - "When you want built-in Web Application Firewall integration at layer 7"
    answer: 1
    explanation: |
      NLB operates at L4 (TCP/UDP), offering ultra-low latency, massive scale, static IPs, and
      source-IP preservation. ALB is the L7 choice for HTTP routing, WebSockets, gRPC, and WAF
      integration — described in (A), (C), (D).
    ref: "concepts.md#mapping-aws-to-generic-system-design-primitives"

  - id: aws-fundamentals-well-architected-049
    difficulty: intermediate
    tags: [mapping, sqs, fifo, limits]
    question: |
      What throughput limit applies to a standard SQS FIFO queue (without high-throughput mode)?
    options:
      - "Unlimited throughput, like standard queues"
      - "Exactly 1 MB/second per queue"
      - "About 300 messages/second per API action, or up to 3,000 messages/second with batching (10 messages per batch)"
      - "1,000 records/second per shard"
    answer: 2
    explanation: |
      FIFO queues are capped at ~300 API calls/s per action (send/receive/delete), reaching ~3,000
      msg/s with batching of 10. Standard queues (A) are effectively unlimited. 1 MC/s (B) and
      1,000 rec/s/shard (D) describe Kinesis, not SQS FIFO.
    ref: "concepts.md#mapping-aws-to-generic-system-design-primitives"

  - id: aws-fundamentals-well-architected-050
    difficulty: advanced
    tags: [mapping, sqs, kinesis, messaging, scenario]
    question: |
      You need an event pipeline where multiple independent consumer applications each read the
      full ordered event history, and you can replay events from hours ago. Which service fits, and
      why not the alternative?
    options:
      - "SQS standard, because it has unlimited throughput"
      - "DynamoDB, because it stores events durably"
      - "SNS, because it fans out to many subscribers"
      - "Kinesis Data Streams (or MSK): it keeps an ordered, replayable log that multiple independent consumers can each read, whereas SQS deletes messages after consumption and is point-to-point (no replay, no independent multi-reader)"
    answer: 3
    explanation: |
      Kinesis/MSK provide an ordered, retained, replayable stream that multiple consumer groups can
      each read independently. SQS (A) is point-to-point and deletes on consume (no replay, no
      shared re-reading). SNS (C) fans out but does not retain/replay history. DynamoDB (B) is a
      store, not a streaming log (though Streams exist, it's not the primary fit here).
    ref: "concepts.md#mapping-aws-to-generic-system-design-primitives"

  - id: aws-fundamentals-well-architected-051
    difficulty: intermediate
    tags: [mapping, kinesis, limits]
    question: |
      What is the per-shard ingest limit of a Kinesis Data Stream?
    options:
      - "1 MB/s or 1,000 records/s in, and 2 MB/s out per shard"
      - "10 MB/s or 10,000 records/s in per shard"
      - "256 KB/s per shard with no record-count limit"
      - "Unlimited, shards exist only for ordering"
    answer: 0
    explanation: |
      Each Kinesis shard ingests up to 1 MB/s or 1,000 records/s and egresses up to 2 MB/s (shared
      across consumers, or 2 MB/s per consumer with enhanced fan-out). You scale by adding shards
      (or use on-demand mode). (B), (C), (D) are wrong.
    ref: "concepts.md#mapping-aws-to-generic-system-design-primitives"

  - id: aws-fundamentals-well-architected-052
    difficulty: advanced
    tags: [messaging, sns, sqs, fan-out]
    question: |
      A common decoupling pattern is "SNS -> multiple SQS queues." What does this buy you over
      SNS alone delivering directly to each consumer?
    options:
      - "Each consumer gets its own durable buffer (SQS), so a slow or temporarily down consumer does not lose messages and can process at its own pace, while SNS handles fan-out"
      - "It reduces cost to zero"
      - "It converts the messages to a strongly consistent database"
      - "It guarantees strict global ordering across all consumers"
    answer: 0
    explanation: |
      SNS fans out one message to many SQS queues; each queue is a durable per-consumer buffer, so
      a slow/down consumer retains its messages and processes at its own rate (with DLQs for poison
      messages). It doesn't make cost zero (B), isn't a database (C), and standard SNS/SQS don't
      guarantee strict global ordering (D).
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-fundamentals-well-architected-053
    difficulty: advanced
    tags: [messaging, eventbridge, sns, trade-offs]
    question: |
      When would you choose Amazon EventBridge over SNS for an event-driven architecture?
    options:
      - "When you only need simple, highest-throughput fan-out to a few SQS/HTTP endpoints with lowest latency and cost"
      - "When you need content-based routing rules, a schema registry, and integrations with third-party SaaS/AWS-service events on an event bus"
      - "When you need a durable point-to-point work queue with visibility timeouts"
      - "When you need an ordered replayable log for multiple consumers"
    answer: 1
    explanation: |
      EventBridge is an event bus with rich content-based routing, a schema registry, and
      SaaS/AWS-service event integrations. SNS (A) is leaner/cheaper for high-throughput pub/sub
      fan-out with lower latency. SQS (C) is the work queue; Kinesis (D) is the replayable log.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-fundamentals-well-architected-054
    difficulty: intermediate
    tags: [consistency, dynamodb]
    question: |
      By default, what consistency does a DynamoDB GetItem read provide, and how do you get stronger
      consistency?
    options:
      - "Strongly consistent by default; you cannot make it eventual"
      - "Always strongly consistent, even across Regions and GSIs"
      - "Eventually consistent by default (0.5 RCU); request a strongly consistent read (1 RCU, same-Region, not available on GSIs) when you need read-your-writes"
      - "There is no consistency control in DynamoDB"
    answer: 2
    explanation: |
      DynamoDB reads are eventually consistent by default (cheaper, 0.5 RCU). You can request a
      strongly consistent read (1 RCU) for the primary table in the same Region, but not on Global
      Secondary Indexes, and global tables remain eventually consistent. (A), (B), (D) are false.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-fundamentals-well-architected-055
    difficulty: advanced
    tags: [performance-efficiency, dax, caching, scenario]
    question: |
      A DynamoDB-backed read-heavy service needs microsecond read latency for hot items and wants a
      cache that speaks the DynamoDB API. Which option fits and what is the trade-off?
    options:
      - "Add ElastiCache Memcached in front; trade-off is you must write custom caching code and manage invalidation"
      - "Move the data to S3 for faster reads"
      - "Switch the table to strongly consistent reads; this reduces latency to microseconds"
      - "Use DynamoDB Accelerator (DAX), a DynamoDB-native in-memory cache giving microsecond reads; trade-off is added cost, eventual-consistency for cached reads, and it only accelerates reads (writes still go to DynamoDB)"
    answer: 3
    explanation: |
      DAX is a DynamoDB-API-compatible in-memory cache delivering microsecond reads with minimal
      app changes; trade-offs are cost, cache staleness (eventual consistency), and it accelerates
      reads only. ElastiCache (A) works but needs custom integration/invalidation. Strong reads (C)
      increase cost/latency, not decrease to microseconds. S3 (B) is not a low-latency KV cache.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-fundamentals-well-architected-056
    difficulty: expert
    tags: [scenario, service-selection, trade-offs, cost]
    question: |
      A startup expects highly spiky, unpredictable traffic (idle most of the day, occasional
      bursts), has a tiny ops team, and wants to minimize idle cost. Which architecture best fits
      the constraints?
    options:
      - "Serverless: API Gateway + Lambda + DynamoDB on-demand, so you pay per request with zero idle cost and no servers to operate, accepting cold-start tail latency and higher per-request unit price at peak"
      - "A fixed fleet of large EC2 On-Demand instances behind an ALB, sized for peak"
      - "A self-managed Kubernetes cluster on EC2 with cluster-autoscaler and self-hosted Postgres"
      - "A single large RDS instance and no compute autoscaling"
    answer: 0
    explanation: |
      Spiky/idle traffic + tiny ops team + minimize idle cost is the textbook serverless case:
      pay-per-use, zero idle, no server ops, auto-scale. The cost is cold starts and higher unit
      price at sustained peak — acceptable given the constraints. Peak-sized EC2 (B) wastes money
      when idle. Self-managed k8s (C) is heavy ops for a tiny team. (D) ignores compute entirely.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-fundamentals-well-architected-057
    difficulty: expert
    tags: [scenario, resilience, failure-mode]
    question: |
      A single-Region, multi-AZ web app stores state in RDS Multi-AZ and serves from an ASG across
      3 AZs behind an ALB. Which failure does this architecture NOT tolerate?
    options:
      - "Loss of a single Availability Zone"
      - "Failure of one EC2 instance in the fleet"
      - "A full Region-wide outage (e.g., the entire Region becomes unavailable)"
      - "The RDS primary node failing over to its standby"
    answer: 2
    explanation: |
      Multi-AZ design survives single-AZ loss (A), single-instance failure (B), and RDS failover
      to the standby (D). It does NOT survive a full Region outage, because everything lives in one
      Region — that requires multi-Region DR. This is the classic "what does multi-AZ not cover"
      question.
    ref: "concepts.md#resilience-building-blocks-multi-az-and-multi-region"

  - id: aws-fundamentals-well-architected-058
    difficulty: expert
    tags: [scenario, dynamodb, aurora, trade-offs]
    question: |
      A social app needs to store user timelines: billions of small records, single-digit-ms reads
      by user ID, massive write scale, and no ad-hoc analytical queries. The team debates Aurora vs
      DynamoDB. What is the strongest reason to pick DynamoDB, and its main constraint?
    options:
      - "DynamoDB supports complex joins and ad-hoc SQL, which Aurora lacks"
      - "DynamoDB scales horizontally to massive write/read volume with single-digit-ms latency and no capacity guessing; the constraint is you must design access patterns/keys up front and cannot do ad-hoc joins or hot-key-heavy patterns"
      - "Aurora cannot store more than a few million rows"
      - "DynamoDB guarantees strong consistency across all Regions with no latency cost"
    answer: 1
    explanation: |
      DynamoDB fits massive-scale, known-access-pattern KV workloads with predictable single-digit-
      ms latency and serverless scaling — ideal for timelines keyed by user ID. The constraint is
      up-front access-pattern/key design and no ad-hoc joins (that's Aurora's strength). (A)
      reverses capabilities; (C) is false; (D) is false (global tables are eventually consistent).
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-fundamentals-well-architected-059
    difficulty: advanced
    tags: [cost, estimation, s3]
    question: |
      You must store 500 TB of infrequently accessed compliance archives that are almost never read
      but must be retained for years. Which S3 approach optimizes cost while meeting the pattern?
    options:
      - "S3 Standard, because it has the lowest per-GB price"
      - "EBS volumes attached to a stopped EC2 instance"
      - "S3 Glacier / Glacier Deep Archive (or Intelligent-Tiering archive tiers), trading retrieval latency (minutes to hours) for the lowest storage cost for rarely accessed long-term data"
      - "DynamoDB, because it is durable"
    answer: 2
    explanation: |
      Rarely accessed long-term archives map to Glacier / Glacier Deep Archive (or Intelligent-
      Tiering's archive tiers), which minimize storage cost in exchange for retrieval latency and
      retrieval fees. S3 Standard (A) is priced for frequent access. EBS (B) and DynamoDB (D) are
      the wrong tools and far more expensive per GB for cold archives.
    ref: "concepts.md#cost-optimization-pillar"

  - id: aws-fundamentals-well-architected-060
    difficulty: advanced
    tags: [scenario, spot, batch, trade-offs]
    question: |
      A large, restartable batch image-processing job runs nightly and can checkpoint/resume. Which
      compute purchasing choice minimizes cost with acceptable risk, and why?
    options:
      - "On-Demand only, to guarantee no interruption"
      - "Dedicated Hosts, for licensing isolation"
      - "3-year Reserved Instances, because the job runs every night"
      - "Spot instances (with capacity diversification and checkpointing), because the job is fault-tolerant and restartable, capturing up to ~90% savings while tolerating the 2-minute interruption notice"
    answer: 3
    explanation: |
      Fault-tolerant, restartable batch is the ideal Spot workload: up to ~90% off, and
      interruptions are absorbed via checkpointing and instance-type/AZ diversification. On-Demand
      (A) overpays for a job that tolerates interruption. RIs (C) suit steady always-on baseline,
      not bursty nightly jobs. Dedicated Hosts (B) address licensing, not cost minimization here.
    ref: "concepts.md#cost-optimization-pillar"

  - id: aws-fundamentals-well-architected-061
    difficulty: intermediate
    tags: [mapping, athena, redshift, analytics]
    question: |
      You have terabytes of logs already in S3 and want occasional ad-hoc SQL analysis without
      standing up and paying for a running cluster. Which service fits best?
    options:
      - "Amazon Athena, serverless SQL query-on-S3 (pay per data scanned), ideal for occasional ad-hoc queries with no cluster to manage"
      - "Amazon Redshift provisioned cluster running 24/7"
      - "RDS PostgreSQL with the logs imported"
      - "ElastiCache Redis"
    answer: 0
    explanation: |
      Athena is serverless Presto-based SQL directly over S3, billed per TB scanned — perfect for
      occasional ad-hoc analysis with no cluster. A 24/7 Redshift cluster (B) is better for
      frequent heavy BI but costs even when idle. RDS (C) requires ingesting the data into an OLTP
      engine. Redis (D) is a cache, not an analytics engine.
    ref: "concepts.md#mapping-aws-to-generic-system-design-primitives"

  - id: aws-fundamentals-well-architected-062
    difficulty: expert
    tags: [scenario, ordering, exactly-once, throughput, trade-offs]
    question: |
      A payments pipeline must process events in strict per-account order with exactly-once
      processing, and peak load per account is low but there are many accounts. Which design best
      balances the ordering requirement against SQS FIFO's throughput cap?
    options:
      - "One global SQS FIFO queue for all accounts, accepting the ~3,000 msg/s ceiling as a hard system limit"
      - "SQS FIFO using the account ID as the MessageGroupId, so ordering/exactly-once is enforced per account while many message groups process in parallel, sidestepping the single-group bottleneck"
      - "SQS standard queue, ignoring ordering because payments don't need it"
      - "Kinesis with a single shard to guarantee global ordering"
    answer: 1
    explanation: |
      FIFO enforces ordering and exactly-once within a MessageGroupId; using account ID as the
      group gives per-account ordering while distinct groups are processed concurrently, so
      aggregate throughput scales well beyond a single group. A single global group (A) or single
      Kinesis shard (D) serializes everything and bottlenecks. Standard SQS (C) breaks the ordering
      requirement.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-fundamentals-well-architected-063
    difficulty: advanced
    tags: [reliability, poison-message, dlq]
    question: |
      A consumer keeps failing on one malformed message, which is redelivered forever and blocks
      progress. What is the correct AWS mechanism to handle this?
    options:
      - "Increase the visibility timeout to infinity"
      - "Delete the entire queue and recreate it"
      - "Configure a Dead-Letter Queue (DLQ) with a maxReceiveCount so poison messages are moved aside after N failed attempts, unblocking the main queue for later inspection"
      - "Switch to strongly consistent reads"
    answer: 2
    explanation: |
      A DLQ with a redrive policy (maxReceiveCount) moves repeatedly failing (poison) messages out
      of the main queue after N attempts, so the consumer stops blocking and you can inspect them
      separately. Infinite visibility timeout (A) just hides the message temporarily. (B) loses
      data. (D) is unrelated to messaging.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-fundamentals-well-architected-064
    difficulty: intermediate
    tags: [mapping, step-functions, orchestration]
    question: |
      You need to coordinate a multi-step workflow with retries, error handling, and compensating
      actions (a saga) across several Lambdas and services. Which AWS service is purpose-built for
      this?
    options:
      - "Amazon SQS"
      - "Amazon Route 53"
      - "Amazon CloudFront"
      - "AWS Step Functions, a managed state-machine/orchestration service with built-in retries, error handling, and branching"
    answer: 3
    explanation: |
      Step Functions orchestrates multi-step workflows (state machines) with native retries,
      catch/error handling, parallel/branching, and is a common way to implement sagas. SQS (A) is
      a queue, not an orchestrator. CloudFront (C) is a CDN; Route 53 (B) is DNS.
    ref: "concepts.md#mapping-aws-to-generic-system-design-primitives"

  - id: aws-fundamentals-well-architected-065
    difficulty: expert
    tags: [scenario, global, latency, trade-offs]
    question: |
      A globally used read-heavy API must serve users on multiple continents with low latency, and
      the underlying data changes infrequently. What is the most cost-effective, lowest-latency
      approach, and its trade-off?
    options:
      - "Serve reads from CloudFront (edge caching) backed by an origin in one or a few Regions, with appropriate TTLs/invalidation; trade-off is cache staleness must be managed, but you get global low latency at low cost since data changes rarely"
      - "Deploy full active-active stacks in 6 Regions with DynamoDB global tables for all traffic"
      - "Put a single-Region origin behind Route 53 with no caching and rely on the internet"
      - "Store everything in S3 Glacier for cheap global access"
    answer: 0
    explanation: |
      Infrequently changing, read-heavy global content is ideal for CloudFront edge caching in
      front of a small origin footprint: global low latency and low cost, with staleness managed
      via TTL/invalidation. Six active-active Regions (B) is massive over-engineering and cost for
      read-mostly static-ish data. No caching (C) leaves users paying full RTT. Glacier (D) has
      retrieval latency and is for archives.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-fundamentals-well-architected-066
    difficulty: intermediate
    tags: [global-infrastructure, edge, cloudfront]
    question: |
      What primarily makes CloudFront reduce latency in a way a single-Region origin cannot?
    options:
      - "It uses faster CPUs than origin servers"
      - "It places content at 600+ Points of Presence physically close to users, defeating speed-of-light round-trip time and offloading the origin"
      - "It compresses data more than any origin can"
      - "It replaces the need for TLS"
    answer: 1
    explanation: |
      CloudFront's edge PoPs cache content near users, cutting the physical round-trip bounded by
      the speed of light and offloading origin load; it can also terminate TLS and run edge compute
      near users. It's about proximity, not CPU speed (A), compression (C), or removing TLS (D).
    ref: "concepts.md#global-infrastructure-regions-availability-zones-and-edge"

  - id: aws-fundamentals-well-architected-067
    difficulty: beginner
    tags: [security, root-account]
    question: |
      Which is an AWS security best practice for the account root user?
    options:
      - "Use the root user for daily administrative tasks"
      - "Share root credentials across the team for convenience"
      - "Enable MFA on root, lock the credentials away, and use IAM roles/Identity Center for day-to-day work instead"
      - "Create access keys for root and embed them in CI pipelines"
    answer: 2
    explanation: |
      The root user should have MFA enabled, be locked away, and not be used for daily work — use
      IAM roles / Identity Center instead. Using root daily (A), sharing it (B), or creating root
      access keys for CI (D) are all serious anti-patterns.
    ref: "concepts.md#iam-and-account-structure"

  - id: aws-fundamentals-well-architected-068
    difficulty: advanced
    tags: [reliability, aurora-global-database, dr]
    question: |
      For a relational workload needing low-RPO cross-Region disaster recovery with fast failover,
      which AWS feature is designed for this and what are its typical characteristics?
    options:
      - "RDS Multi-AZ, which already provides cross-Region failover"
      - "A nightly mysqldump copied to another Region"
      - "S3 Cross-Region Replication of the database files"
      - "Aurora Global Database: asynchronous cross-Region replication with typically sub-second lag (~1 min RPO), and managed failover promoting a secondary Region (RTO usually about a minute)"
    answer: 3
    explanation: |
      Aurora Global Database replicates across Regions with typically sub-second lag (about 1-min
      RPO) and supports managed failover (RTO ~1 min), purpose-built for low-RPO cross-Region DR.
      RDS Multi-AZ (A) is single-Region only. S3 CRR (C) of raw files isn't a valid DB replication
      method. Nightly dumps (B) give hours of RPO.
    ref: "concepts.md#resilience-building-blocks-multi-az-and-multi-region"

  - id: aws-fundamentals-well-architected-069
    difficulty: expert
    tags: [scenario, control-plane, static-stability, dns]
    question: |
      During a large AZ impairment, your failover script tries to modify Route 53 records and
      launch new EC2 instances but these control-plane calls are slow/failing. What design change
      embodies static stability?
    options:
      - "Pre-provision standby capacity across AZs in advance and rely on health checks/existing routing to shift traffic using the data plane, so recovery does not depend on control-plane mutations during the event"
      - "Retry the control-plane calls faster with no backoff"
      - "Move all resources into the management account for more power"
      - "Switch the database to eventually consistent reads"
    answer: 0
    explanation: |
      Static stability means the system recovers using already-provisioned resources and data-plane
      mechanisms (health checks, pre-existing routing, standby capacity), not control-plane
      mutations (launching instances, editing records) that may be impaired during the event.
      Faster retries (B) worsen load; (C) increases blast radius; (D) is irrelevant.
    ref: "concepts.md#reliability-pillar"

  - id: aws-fundamentals-well-architected-070
    difficulty: intermediate
    tags: [reliability, global-accelerator, routing]
    question: |
      What does AWS Global Accelerator provide that plain Route 53 DNS-based routing does not?
    options:
      - "It stores objects with 11 nines durability"
      - "Static anycast IP addresses and traffic entry at the AWS edge with fast, sub-DNS-TTL failover (no dependence on client DNS caching) routing over the AWS backbone"
      - "It is a relational database with cross-Region replication"
      - "It replaces IAM for authentication"
    answer: 1
    explanation: |
      Global Accelerator gives two static anycast IPs, ingests traffic at the edge onto the AWS
      backbone, and fails over quickly without waiting for client DNS TTLs to expire (a limitation
      of DNS-based failover). It is not storage (A), a database (C), or auth (D).
    ref: "concepts.md#mapping-aws-to-generic-system-design-primitives"

  - id: aws-fundamentals-well-architected-071
    difficulty: beginner
    tags: [performance-efficiency, managed-services]
    question: |
      The Performance Efficiency principle "democratize advanced technologies" suggests you should:
    options:
      - "Build your own database and search engine from scratch to fully understand them"
      - "Avoid managed services because they add latency"
      - "Consume advanced capabilities as managed services (e.g., managed search, ML, databases) rather than building and operating them yourself"
      - "Only use EC2 for everything"
    answer: 2
    explanation: |
      "Democratize advanced technologies" means letting your team consume complex capabilities as
      managed services instead of acquiring the expertise to build/run them — freeing focus for
      differentiated work. (A) and (D) are the opposite; (B) is a false generalization.
    ref: "concepts.md#performance-efficiency-pillar"

  - id: aws-fundamentals-well-architected-072
    difficulty: intermediate
    tags: [reliability, availability, calculation]
    question: |
      Two independent components in series each have 99.9% availability. Roughly what is the
      combined availability of the request path (both must be up)?
    options:
      - "99.9% (unchanged)"
      - "50%"
      - "99.99% (it improves)"
      - "About 99.8% (0.999 x 0.999 ≈ 0.998), because availabilities of serial dependencies multiply"
    answer: 3
    explanation: |
      For components in series (both required), availabilities multiply: 0.999 x 0.999 ≈ 0.998, so
      the path is less available than either part (~99.8%). This is why deep dependency chains
      erode availability and why you add redundancy/decoupling. (A), (C), (B) are wrong.
    ref: "concepts.md#reliability-pillar"

  - id: aws-fundamentals-well-architected-073
    difficulty: advanced
    tags: [scenario, containers, fargate-vs-ec2, trade-offs]
    question: |
      A team runs containers with steady, high, predictable 24/7 utilization and wants the lowest
      cost while avoiding server management where possible. Which is the best-justified choice?
    options:
      - "ECS/EKS on EC2 with a Compute Savings Plan (and possibly Spot for stateless capacity), because at steady high utilization EC2 unit cost is lower than Fargate, accepting some node-management overhead"
      - "Fargate for everything, since it removes server management, regardless of cost"
      - "Lambda, because containers are never cost-effective"
      - "A single giant EC2 instance with no orchestration"
    answer: 0
    explanation: |
      At steady high utilization, EC2-backed containers with Savings Plans (and Spot for stateless)
      are typically cheaper per unit than Fargate, at the cost of managing nodes. Fargate (B) trades
      cost for zero node ops — better for variable/low utilization. Lambda (C) suits event-driven
      spiky loads. A single instance (D) sacrifices HB/scaling.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-fundamentals-well-architected-074
    difficulty: expert
    tags: [scenario, multi-region, when-not-to, trade-offs]
    question: |
      A team proposes going multi-Region active-active for a workload whose SLO is 99.95% and which
      currently runs multi-AZ in one Region. What is the strongest architectural critique?
    options:
      - "Multi-Region active-active is required for any SLO above 99.9%"
      - "Multi-Region active-active may be premature: it roughly doubles cost, forces solving cross-Region data consistency/conflict resolution, and adds failure modes; a well-run multi-AZ (optionally warm-standby) design can often meet 99.95%, so confirm multi-AZ is insufficient first"
      - "Multi-Region has no downsides, so it is always the right call"
      - "Multi-AZ cannot achieve 99.95% under any circumstances"
    answer: 1
    explanation: |
      Multi-Region active-active is expensive and complex (doubled cost, cross-Region consistency,
      new failure modes) and should not be adopted before confirming a multi-AZ (or warm-standby)
      design can't meet the SLO — 99.95% is often achievable without active-active. (A), (C), (D)
      overstate the necessity/benefit of multi-Region.
    ref: "concepts.md#resilience-building-blocks-multi-az-and-multi-region"

  - id: aws-fundamentals-well-architected-075
    difficulty: intermediate
    tags: [operational-excellence, observability, cost]
    question: |
      Heavy custom-metric and log ingestion into CloudWatch improves observability but has a
      downside. What is it?
    options:
      - "It reduces application availability"
      - "It disables auto scaling"
      - "It adds real cost (per custom metric, per GB of logs ingested/stored), so observability must be balanced against its bill"
      - "It violates the shared responsibility model"
    answer: 2
    explanation: |
      Observability improves MTTR but CloudWatch charges for custom metrics and log ingestion/
      storage, so you balance coverage against cost (e.g., sampling, retention policies, metric
      filters). It doesn't reduce availability (A), disable autoscaling (B), or violate shared
      responsibility (D).
    ref: "concepts.md#operational-excellence-pillar"

  - id: aws-fundamentals-well-architected-076
    difficulty: advanced
    tags: [security, defense-in-depth, layers]
    question: |
      "Apply security at all layers" (defense in depth) for a web app on AWS would include which
      combination?
    options:
      - "Only a strong password on the root account"
      - "Encrypting data at rest only, with no network or identity controls"
      - "A single security group allowing all traffic, relying on the app to filter"
      - "Edge (Shield/WAF/CloudFront) + network (VPC, security groups, NACLs, private subnets) + identity (least-privilege IAM roles) + data (KMS encryption at rest, TLS in transit) + detection (GuardDuty, CloudTrail)"
    answer: 3
    explanation: |
      Defense in depth layers controls: edge (WAF/Shield), network (VPC/SG/NACL/private subnets),
      identity (least-privilege IAM), data (encryption in transit and at rest), and detection
      (GuardDuty/CloudTrail). Relying on one control (A, C, B) is the anti-pattern the principle
      warns against.
    ref: "concepts.md#security-pillar"

  - id: aws-fundamentals-well-architected-077
    difficulty: expert
    tags: [scenario, hot-partition, mitigation, dynamodb]
    question: |
      A DynamoDB table experiences write throttling on a few extremely popular items (celebrity
      accounts) despite adequate total provisioned capacity. Which mitigation directly addresses the
      root cause?
    options:
      - "Write-shard the hot keys (append a suffix like userId#0..N to spread writes across partitions) and/or absorb reads with DAX, since the issue is per-partition throughput concentration"
      - "Increase the item size limit above 400 KB"
      - "Switch reads to eventually consistent to fix write throttling"
      - "Move the table to a Region with more AZs"
    answer: 0
    explanation: |
      The root cause is per-partition throughput limits concentrated on a few hot keys. Write
      sharding (suffixing keys to distribute writes across partitions) and read caching via DAX
      address it. You can't raise the 400 KB limit (B); consistency mode (C) doesn't fix write
      throttling; Region AZ count (D) is irrelevant to partition throughput.
    ref: "concepts.md#mapping-aws-to-generic-system-design-primitives"

  - id: aws-fundamentals-well-architected-078
    difficulty: intermediate
    tags: [cost, storage, intelligent-tiering]
    question: |
      For a dataset with unknown or changing access patterns where you don't want to manage
      lifecycle rules manually, which S3 option minimizes cost with least operational effort?
    options:
      - "S3 Standard forever"
      - "S3 Intelligent-Tiering, which automatically moves objects between access tiers based on usage, avoiding manual lifecycle tuning (small per-object monitoring fee)"
      - "S3 Glacier Deep Archive for all objects immediately"
      - "Store the data in DynamoDB instead"
    answer: 1
    explanation: |
      Intelligent-Tiering auto-moves objects between frequent/infrequent (and optional archive)
      tiers based on observed access, ideal when patterns are unknown/changing, for a small
      monitoring fee. S3 Standard (A) overpays for cold data; Deep Archive (C) hurts if some objects
      are actually accessed; DynamoDB (D) is the wrong store for objects.
    ref: "concepts.md#cost-optimization-pillar"

  - id: aws-fundamentals-well-architected-079
    difficulty: advanced
    tags: [service-selection, lock-in, trade-offs]
    question: |
      A company weighs adopting DynamoDB (proprietary) vs self-managing Cassandra on EC2 for
      portability. What is the balanced way to frame this decision?
    options:
      - "Always avoid DynamoDB because any lock-in is unacceptable"
      - "Always pick self-managed Cassandra because it is open source and therefore cheaper"
      - "Weigh DynamoDB's velocity, zero-ops scaling, and built-in HA against lock-in and cost-at-scale; choose self-managed Cassandra only if concrete requirements (multi-cloud portability, extreme-scale cost control, specific control) justify taking on the operational burden"
      - "The choice is purely about which has a nicer API"
    answer: 2
    explanation: |
      The mature framing weighs managed velocity/ops/HA against lock-in and cost-at-scale, choosing
      self-managed only when a concrete constraint (portability, cost at extreme scale, control)
      justifies the ops cost. Absolutist rules (A, B) and reducing it to API taste (D) miss the
      real trade-off.
    ref: "concepts.md#choosing-a-service-managed-versus-self-managed-and-serverless-first"

  - id: aws-fundamentals-well-architected-080
    difficulty: expert
    tags: [scenario, failure-mode, degradation, resilience]
    question: |
      Design review: an API synchronously calls a non-critical recommendations service on every
      request; when recommendations is slow, the whole API's latency and error rate spike. Which
      change best improves reliability while preserving core functionality?
    options:
      - "Increase the recommendations service's timeout so requests always wait for it"
      - "Move recommendations into the same process to remove the network call"
      - "Retry the recommendations call synchronously up to 10 times before responding"
      - "Make the recommendations call non-blocking with a short timeout and a circuit breaker, and gracefully degrade (return the core response without recommendations) when it is slow or down"
    answer: 3
    explanation: |
      Non-critical dependencies should fail open: a short timeout + circuit breaker + graceful
      degradation lets the core response return without recommendations, isolating the API from a
      slow dependency (bulkhead pattern). Longer timeouts (A) and aggressive synchronous retries
      (C) worsen latency/retry storms; co-locating (B) just moves the failure and couples the
      services.
    ref: "concepts.md#trade-offs-and-when-to-use-what"
