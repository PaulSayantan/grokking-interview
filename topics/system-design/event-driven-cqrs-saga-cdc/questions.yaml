topic: 'Event-Driven Architecture: CQRS, Event Sourcing, Saga and CDC'
domain: system-design
topic_slug: event-driven-cqrs-saga-cdc
version: 1
questions:
- id: event-driven-cqrs-saga-cdc-001
  difficulty: beginner
  tags:
  - event-driven
  - decoupling
  - fundamentals
  question: |
    What is the defining characteristic of an event-driven architecture compared
    to a request/response architecture?
  options:
  - Producers emit facts about what happened without knowing or waiting for consumers, which react on
    their own schedule
  - Every service call must block and wait for a synchronous reply before the caller may continue
  - All services must share one central relational database and coordinate every write through it
  - Consumers must repeatedly poll each producer directly over HTTP to pull the latest state
  answer: 0
  explanation: |
    EDA decouples producers from consumers: a producer emits an event to a broker
    and does not know or wait for who consumes it. The other options describe
    synchronous coupling or shared-DB designs, which are the opposite of
    event-driven.
  ref: concepts.md#event-driven-versus-request-response-trade-offs
- id: event-driven-cqrs-saga-cdc-002
  difficulty: beginner
  tags:
  - sync-vs-async
  - consistency
  question: |
    A user clicks "check my account balance" and must see the correct number
    before doing anything else. Which style is most appropriate?
  options:
  - Publish a query event and let a consumer email the balance later
  - Fire-and-forget an event and show the last cached value regardless of age
  - A synchronous request/response read against a strongly consistent store
  - Write to Kafka and rebuild the balance from a replayed event log on the client
  answer: 2
  explanation: |
    When the user needs an accurate answer immediately to proceed, synchronous
    strongly consistent reads are correct. The async options defer or stale
    the answer, which is unacceptable for a balance the user is about to act on.
  ref: concepts.md#event-driven-versus-request-response-trade-offs
- id: event-driven-cqrs-saga-cdc-003
  difficulty: beginner
  tags:
  - decoupling
  - extensibility
  question: |
    In an event-driven system, what is the main advantage when you need to add a
    brand-new consumer (e.g., a fraud-analytics service) later?
  options:
  - You must modify and redeploy the producer to add an explicit call to the new consumer
  - You must run a coordinated two-phase commit across the producer and all existing consumers
  - You have to migrate every existing consumer onto one shared database before you can add it
  - The new consumer just subscribes to the existing event stream; the producer is unchanged
  answer: 3
  explanation: |
    Loose coupling means new consumers subscribe without touching the producer —
    architecture-level open/closed. The other options describe the tight coupling
    that EDA specifically avoids.
  ref: concepts.md#event-driven-versus-request-response-trade-offs
- id: event-driven-cqrs-saga-cdc-004
  difficulty: beginner
  tags:
  - latency
  - misconception
  question: |
    Which statement about event-driven architecture latency is correct?
  options:
  - Each asynchronous event hop is inherently faster than a direct in-process function call
  - A broker hop adds latency; async moves work off the critical path rather than making each hop faster
  - Adding a broker makes each individual operation cheaper in both CPU cost and wall-clock time
  - Events are always processed with effectively zero delay precisely because they are asynchronous
  answer: 1
  explanation: |
    Async does not make each hop faster — a broker hop adds latency (produce ack
    plus poll cycle). Its value is removing work from the user's critical path,
    not accelerating individual operations.
  ref: concepts.md#event-driven-versus-request-response-trade-offs
- id: event-driven-cqrs-saga-cdc-005
  difficulty: beginner
  tags:
  - cqrs
  - fundamentals
  question: |
    What does CQRS (Command Query Responsibility Segregation) fundamentally
    propose?
  options:
  - That every state change must be persisted as an immutable append-only event log
  - That the model used to change state and the model used to read state can be separated
  - That all writes must first be funneled through a single durable message queue
  - That reads and writes must always use the exact same schema and the same store
  answer: 1
  explanation: |
    CQRS separates the command (write) model from the query (read) model. It does
    not require an event log (that is event sourcing) nor a queue for all writes.
    The last option is the opposite of CQRS.
  ref: concepts.md#cqrs-separating-read-and-write-models
- id: event-driven-cqrs-saga-cdc-006
  difficulty: beginner
  tags:
  - event-sourcing
  - fundamentals
  question: |
    In event sourcing, how is the current state of an entity obtained?
  options:
  - By folding/replaying the ordered sequence of immutable events for that entity
  - By reading a single mutable row that is overwritten in place on every update
  - By querying a distributed cache that is treated as the source of truth
  - By calling a downstream state-owning service synchronously on every read
  answer: 0
  explanation: |
    Event sourcing stores the full ordered sequence of events; current state is a
    derived fold over them (like a bank ledger). It never overwrites a mutable
    current-state row — that is the state-oriented approach it replaces.
  ref: concepts.md#event-sourcing-the-event-log-as-source-of-truth
- id: event-driven-cqrs-saga-cdc-007
  difficulty: beginner
  tags:
  - saga
  - distributed-transactions
  question: |
    What problem does the saga pattern primarily solve?
  options:
  - How to cache read-heavy data at the edge to reduce read latency for globally distributed users
  - How to compress large event payloads efficiently before transferring them across the network
  - How to shard a single large relational database horizontally across many nodes for scale
  - How to maintain data consistency across multiple services without a distributed ACID transaction
  answer: 3
  explanation: |
    A saga replaces one distributed ACID transaction with a sequence of local
    transactions plus compensations, coordinating consistency across services
    without 2PC. The other options are unrelated concerns.
  ref: concepts.md#saga-pattern-choreography-versus-orchestration
- id: event-driven-cqrs-saga-cdc-008
  difficulty: beginner
  tags:
  - outbox
  - dual-write
  question: |
    The "dual-write problem" occurs when a service tries to do what?
  options:
  - Write the same record to two separate database replicas at exactly the same moment
  - Read the same key from two independent caches simultaneously and then merge the results
  - Commit a database change and publish an event as two separate operations that can partially fail
  - Deploy two different versions of the same service at the same time during a rolling release
  answer: 2
  explanation: |
    The dual-write problem is committing a DB change and publishing an event as
    two non-atomic steps; a crash in between loses the event or emits a phantom
    one. The other options are unrelated.
  ref: concepts.md#the-dual-write-problem-and-the-outbox-pattern
- id: event-driven-cqrs-saga-cdc-009
  difficulty: beginner
  tags:
  - cdc
  - debezium
  question: |
    What does log-based Change Data Capture (e.g., Debezium) do?
  options:
  - Periodically runs SELECT queries with a WHERE updated_at filter
  - Tails the database transaction log (WAL/binlog/oplog) and streams row changes as events
  - Encrypts the database files at rest and rotates the keys on a fixed schedule
  - Compacts a Kafka topic in the background to keep only the latest value per key
  answer: 1
  explanation: |
    Log-based CDC reads the DB's transaction log (Postgres WAL, MySQL binlog,
    Mongo oplog) to capture every change including deletes. Option 0 is
    query-based CDC; the others are unrelated features.
  ref: concepts.md#change-data-capture-cdc-with-debezium
- id: event-driven-cqrs-saga-cdc-010
  difficulty: beginner
  tags:
  - idempotency
  - delivery-semantics
  question: |
    Why must consumers in most event-driven systems be idempotent?
  options:
  - Because brokers guarantee exactly-once delivery end to end
  - Because delivery is typically at-least-once, so the same message can arrive more than once
  - Because events are never duplicated under any circumstances
  - Because idempotency makes messages smaller on the wire
  answer: 1
  explanation: |
    Practical delivery is at-least-once (retries, rebalances, relay crashes), so
    duplicates happen; idempotency ensures reprocessing has the same effect once.
    Exactly-once end-to-end across systems is not achievable, contradicting
    option 0.
  ref: concepts.md#idempotent-consumers-and-delivery-semantics
- id: event-driven-cqrs-saga-cdc-011
  difficulty: beginner
  tags:
  - eventual-consistency
  question: |
    What does "eventual consistency" mean in an event-driven / CQRS system?
  options:
  - Reads and writes are always perfectly synchronized across every replica with zero delay
  - Different views may temporarily disagree but converge to the same state over time
  - Data is never actually consistent and is therefore permanently corrupt and untrustworthy
  - Consistency is guaranteed by running a two-phase commit across all replicas on every read
  answer: 1
  explanation: |
    Eventual consistency means views converge after some delay; in between they
    may disagree (e.g., a lagging read model). It is neither perfect immediacy nor
    permanent corruption, and it explicitly avoids 2PC.
  ref: concepts.md#eventual-consistency-and-its-implications
- id: event-driven-cqrs-saga-cdc-012
  difficulty: beginner
  tags:
  - dlq
  - retries
  question: |
    What is a dead-letter queue (DLQ) used for?
  options:
  - Storing the most frequently accessed messages in memory so hot reads stay fast
  - Guaranteeing exactly-once delivery of every message to each consumer in the group
  - Compressing and archiving old events to cheaper cold storage to save space over time
  - Holding messages that repeatedly fail processing so they can be inspected and reprocessed out-of-band
  answer: 3
  explanation: |
    A DLQ parks poison/failed messages after bounded retries so the main flow
    keeps moving and the bad messages can be inspected or reprocessed. The other
    options misdescribe its purpose.
  ref: concepts.md#dead-letter-queues-retries-and-poison-messages
- id: event-driven-cqrs-saga-cdc-013
  difficulty: beginner
  tags:
  - snapshots
  - event-sourcing
  question: |
    In event sourcing, what is the purpose of a snapshot?
  options:
  - To store the folded state periodically so rehydration replays only events since the snapshot
  - To permanently delete old events from the log so the store consumes less space
  - To encrypt individual events at rest to satisfy regulatory compliance requirements
  - To guarantee exactly-once event publishing from the aggregate to the message broker
  answer: 0
  explanation: |
    A snapshot caches the folded state every N events so you replay only the tail,
    bounding rehydration cost. It does not delete events (they remain the source
    of truth) and is unrelated to encryption or delivery guarantees.
  ref: concepts.md#snapshots-replay-and-event-versioning
- id: event-driven-cqrs-saga-cdc-014
  difficulty: beginner
  tags:
  - saga
  - choreography
  - orchestration
  question: |
    What is the difference between choreography and orchestration in sagas?
  options:
  - Choreography relies on a central coordinator issuing commands, while orchestration has none at all
  - Choreography has services react to each other's events with no central coordinator; orchestration
    uses a central coordinator issuing commands
  - They are simply two interchangeable names for the exact same coordination pattern
  - Orchestration only works for transactions that span exactly two participating services
  answer: 1
  explanation: |
    Choreography is decentralized (services react to events); orchestration uses a
    central state machine that commands each step and drives compensation. Option
    0 reverses the definitions.
  ref: concepts.md#saga-pattern-choreography-versus-orchestration
- id: event-driven-cqrs-saga-cdc-015
  difficulty: intermediate
  tags:
  - outbox
  - atomicity
  - dual-write
  question: |
    How does the transactional outbox pattern make a DB write and an event
    publish atomic without distributed transactions?
  options:
  - It publishes to Kafka first, then writes to the DB in a separate call
  - It writes the business row and an outbox event row in the same local DB transaction; a relay later
    publishes the outbox rows
  - It uses a two-phase commit spanning the DB and the broker
  - It caches the event in memory and hopes the process does not crash
  answer: 1
  explanation: |
    The outbox writes business data and the event row in one local ACID
    transaction (both or neither), then a relay publishes the outbox rows. This
    avoids 2PC (option 2) and avoids the lossy dual-write orderings in options 0
    and 3.
  ref: concepts.md#the-dual-write-problem-and-the-outbox-pattern
- id: event-driven-cqrs-saga-cdc-016
  difficulty: intermediate
  tags:
  - outbox
  - delivery-semantics
  question: |
    What delivery guarantee does the transactional outbox pattern provide, and
    what does that imply for consumers?
  options:
  - Exactly-once delivery, so consumers need no dedup logic
  - At-most-once delivery, so some events may be silently dropped
  - At-least-once delivery, so consumers must be idempotent
  - Ordered exactly-once delivery across all partitions globally
  answer: 2
  explanation: |
    The relay retries after commit, so events are never lost but can be published
    more than once (crash after publish, before marking sent) — at-least-once,
    requiring idempotent consumers. Exactly-once end-to-end is not achievable here.
  ref: concepts.md#the-dual-write-problem-and-the-outbox-pattern
- id: event-driven-cqrs-saga-cdc-017
  difficulty: intermediate
  tags:
  - cqrs
  - read-your-writes
  question: |
    Under CQRS with an async-updated read model, a user edits their profile and
    immediately reloads but sees the OLD name. What is the best explanation and
    fix?
  options:
  - The write failed; retry the write until it succeeds
  - The read model lags behind the write; for this read serve from the write model or echo the new value
    in the command response
  - CQRS is broken; abandon it and use a single model
  - The broker lost the event; switch to at-most-once delivery
  answer: 1
  explanation: |
    This is normal read-your-writes lag: the projection has not yet applied the
    change. Fixes include reading from the write model for that query, returning
    the new value in the response, or optimistic client updates. The write did
    succeed, and abandoning CQRS or weakening delivery is unwarranted.
  ref: concepts.md#cqrs-separating-read-and-write-models
- id: event-driven-cqrs-saga-cdc-018
  difficulty: intermediate
  tags:
  - cqrs
  - over-engineering
  - trade-offs
  question: |
    For a simple internal CRUD tool with low, symmetric read/write volume and
    simple queries, what is the best design choice?
  options:
  - A single model / single database, because CQRS here is over-engineering
  - Full CQRS with separate write and read databases plus async projections
  - Event sourcing with periodic snapshots maintained for every single entity in the tool
  - A saga orchestrator to coordinate and compensate each individual CRUD field update
  answer: 0
  explanation: |
    CQRS and event sourcing add real complexity justified only by read/write
    asymmetry, specialized query needs, or audit requirements. For simple
    symmetric CRUD, a single model is correct; the other options are classic
    over-engineering traps.
  ref: concepts.md#cqrs-separating-read-and-write-models
- id: event-driven-cqrs-saga-cdc-019
  difficulty: intermediate
  tags:
  - event-sourcing
  - trade-offs
  question: |
    Which is the single biggest LONG-TERM pain of event sourcing that
    interviewers probe for?
  options:
  - Events are individually too small to store efficiently, so per-event framing wastes disk space
  - You cannot append new events once the store is created, forcing a full rebuild for each change
  - 'Event schema/versioning: events are immutable and live forever, so you must handle old versions indefinitely'
  - Event stores cannot be replicated across nodes, so they stay single-machine and non-HA
  answer: 2
  explanation: |
    Because events are immutable and permanent, evolving their schema forces
    forever-support for old versions via upcasting, tolerant readers, or versioned
    types — the #1 long-term cost. The other statements are false.
  ref: concepts.md#event-sourcing-the-event-log-as-source-of-truth
- id: event-driven-cqrs-saga-cdc-020
  difficulty: intermediate
  tags:
  - event-sourcing
  - gdpr
  question: |
    Why does GDPR "right to be forgotten" conflict with event sourcing, and what
    is a common mitigation?
  options:
  - It does not conflict; you simply UPDATE the offending events in place to erase the personal fields
  - You must delete the entire event store for one user request and rebuild every projection afterward
  - Event sourcing is exempt from GDPR because ledger-style audit logs count as a legal-basis exception
  - An immutable append-only log resists hard deletes; crypto-shredding (deleting the key that decrypts
    a person's events) is a common mitigation
  answer: 3
  explanation: |
    Immutable logs fight hard-delete requirements. Crypto-shredding stores
    personal data encrypted per-subject and deletes the key to render events
    unreadable, satisfying erasure without mutating the log. Mutating events
    breaks replay, and event stores are not exempt.
  ref: concepts.md#event-sourcing-the-event-log-as-source-of-truth
- id: event-driven-cqrs-saga-cdc-021
  difficulty: intermediate
  tags:
  - saga
  - choreography
  - trade-offs
  question: |
    A workflow spans 8 services with conditional branches, timeouts, and
    compensations, and the business team keeps changing it. Which saga style is
    most appropriate and why?
  options:
  - Choreography, because having no central coordinator means there is no single point of failure
  - Orchestration, because the workflow is explicit, centrally visible, testable, and easy to evolve
  - Choreography, because implicit event chains are easier to debug at this scale
  - No saga; use a distributed 2PC transaction across all 8 services
  answer: 1
  explanation: |
    Complex, long, evolving workflows favor orchestration: the flow is explicit
    and controllable, with a clear place for timeouts and compensation.
    Choreography's implicit event chains become very hard to trace at 8 services,
    and 2PC does not scale across many microservices.
  ref: concepts.md#saga-pattern-choreography-versus-orchestration
- id: event-driven-cqrs-saga-cdc-022
  difficulty: intermediate
  tags:
  - saga
  - compensation
  question: |
    A saga has already sent a shipment when a later step fails. How should the
    saga "undo" the shipment?
  options:
  - Run a semantic compensating action (e.g., initiate a return / issue a refund), since physical rollback
    is impossible
  - Physically roll back the shipment as if it never happened by recalling the package mid-transit from the carrier
  - Ignore the failure and leave the system inconsistent, trusting a later nightly batch job to sort it out
  - Use a single distributed database transaction to reverse the shipment atomically across all participating services
  answer: 0
  explanation: |
    Sagas use semantic compensation, not physical undo — you cannot un-ship a
    package, so you issue a return or refund (a new fact). There is no cross-service
    DB transaction to reverse it, and ignoring the failure violates consistency.
  ref: concepts.md#saga-pattern-choreography-versus-orchestration
- id: event-driven-cqrs-saga-cdc-023
  difficulty: intermediate
  tags:
  - saga
  - isolation
  question: |
    Which ACID property do sagas notably LACK, and what is a consequence?
  options:
  - Durability; committed local steps can silently vanish after a broker or coordinator crash
  - Atomicity of each local step, so a single service's write can partially apply and leave a torn row
  - Consistency of individual local transactions, letting each step violate its own database constraints
  - Isolation; other transactions can observe intermediate saga states such as an order that will later
    be cancelled
  answer: 3
  explanation: |
    Each local step is still ACID (atomic, durable, consistent locally), but the
    saga as a whole lacks isolation: intermediate states are visible. Countermeasures
    include semantic locks (pending status), commutative updates, and versioning.
  ref: concepts.md#saga-pattern-choreography-versus-orchestration
- id: event-driven-cqrs-saga-cdc-024
  difficulty: intermediate
  tags:
  - cdc
  - outbox
  - schema
  question: |
    Why is raw table-level CDC (streaming row diffs directly from business tables)
    often discouraged as the event contract?
  options:
  - It cannot capture deletes, because transaction-log records only ever describe inserts
  - It is slower than query-based polling, since decoding the binlog costs more per row
  - 'It leaks internal schema: consumers depend on your columns, so any schema change breaks them'
  - It requires two-phase commit between the database and the broker to publish each row change
  answer: 2
  explanation: |
    Raw table CDC exposes internal columns as the public event contract, so
    internal schema changes break consumers. The outbox+CDC combo publishes
    intentional domain events instead. Log-based CDC does capture deletes and is
    not slower than polling.
  ref: concepts.md#change-data-capture-cdc-with-debezium
- id: event-driven-cqrs-saga-cdc-025
  difficulty: intermediate
  tags:
  - cdc
  - query-vs-log
  question: |
    What is a key limitation of query-based CDC (polling WHERE updated_at > last)
    that log-based CDC avoids?
  options:
  - It requires privileged access to the raw transaction log and a dedicated slot
  - It misses deletes and intermediate states, and adds query load with poll latency
  - It cannot run against relational databases and only works with key-value stores
  - It always duplicates every row on each poll because it re-reads the whole table
  answer: 1
  explanation: |
    Polling on updated_at cannot see deleted rows or intermediate states between
    polls, and it adds load plus latency. Log-based CDC reads the WAL/binlog to
    capture every change including deletes. It is query-based CDC that does NOT
    need log access.
  ref: concepts.md#change-data-capture-cdc-with-debezium
- id: event-driven-cqrs-saga-cdc-026
  difficulty: intermediate
  tags:
  - idempotency
  - design
  question: |
    Which approach makes a consumer naturally idempotent WITHOUT an explicit dedup
    table?
  options:
  - Incrementing a running counter by one on every message the consumer receives from the topic
  - Appending the message body to an audit log file on every delivery the consumer observes
  - Sending a confirmation email to the customer on every delivery so they always get a receipt
  - Using an absolute set operation like SET status = SHIPPED or an upsert keyed by business id
  answer: 3
  explanation: |
    Absolute/idempotent operations (SET to a value, upsert by business key,
    compare-and-set) produce the same result no matter how many times applied.
    Increments, appends, and emails are non-idempotent and would double-apply on
    redelivery.
  ref: concepts.md#idempotent-consumers-and-delivery-semantics
- id: event-driven-cqrs-saga-cdc-027
  difficulty: intermediate
  tags:
  - event-styles
  - coupling
  question: |
    What is "event-carried state transfer" and its main trade-off versus a thin
    event notification?
  options:
  - The event carries only an id, so consumers must call back to the producer for details, increasing coupling
  - The event carries all data the consumer needs, maximizing decoupling but duplicating data and risking
    staleness
  - The event carries encrypted state that only the producer can read, so consumers relay it back to decrypt
  - It is another name for two-phase commit applied to event publishing across producer and consumer
  answer: 1
  explanation: |
    ECST embeds the full data so consumers stay decoupled and can keep local
    copies, at the cost of larger events, duplication, and staleness. Option 0
    describes thin notification, which reintroduces callback coupling.
  ref: concepts.md#event-notification-versus-event-carried-state-transfer
- id: event-driven-cqrs-saga-cdc-028
  difficulty: intermediate
  tags:
  - dlq
  - poison-message
  - ordering
  question: |
    What is the trade-off between blocking retries and routing to a DLQ/retry
    topic for a poison message on a Kafka partition?
  options:
  - Blocking retries preserve ordering but stall the whole partition (head-of-line blocking); DLQ keeps
    the flow moving but can reorder
  - Blocking retries lose per-partition ordering, while routing to a DLQ preserves it perfectly for every message
  - There is no practical difference between the two; both handle poison messages identically at any scale
  - Routing to a DLQ guarantees the parked message will eventually succeed automatically once resources free up
  answer: 0
  explanation: |
    Retrying in place preserves per-partition order but blocks all messages behind
    the poison one; parking it to a DLQ/retry topic unblocks the flow at the cost
    of possible reordering and a reprocessing story. A DLQ does not auto-fix
    messages.
  ref: concepts.md#dead-letter-queues-retries-and-poison-messages
- id: event-driven-cqrs-saga-cdc-029
  difficulty: intermediate
  tags:
  - eventual-consistency
  - ordering
  question: |
    To ensure events for a single order are processed in order in Kafka, what is
    the standard technique?
  options:
  - Use a single partition for the entire topic across all orders to force a global sequence
  - Disable consumer groups so a lone consumer reads the topic and preserves arrival order
  - Use the order id as the partition key so all events for one order land on the same partition
  - Enable at-most-once delivery so each event is seen once and never reordered by a retry
  answer: 2
  explanation: |
    Kafka guarantees order within a partition, so keying by entity id (order id)
    routes all of an order's events to one partition, preserving per-order order
    while allowing parallelism across orders. A single global partition kills
    throughput; the others are irrelevant.
  ref: concepts.md#eventual-consistency-and-its-implications
- id: event-driven-cqrs-saga-cdc-030
  difficulty: intermediate
  tags:
  - cqrs
  - scaling
  question: |
    Which scenario best justifies moving from a single model to CQRS with separate
    read stores?
  options:
  - A system with a balanced 1:1 read/write ratio and one simple query shape served fine by a single table
  - A product catalog with 1000:1 read/write ratio needing full-text search, faceted filtering, and low-latency
    reads
  - A nightly batch job that runs once a day with no online reads and no latency or concurrency pressure
  - A tiny internal app with about 10 users and no measurable performance or query-diversity concerns
  answer: 1
  explanation: |
    Heavy read/write asymmetry plus multiple specialized query shapes
    (search, facets) is exactly where CQRS with a dedicated read store (e.g.,
    Elasticsearch) shines. The other cases lack the asymmetry or query diversity
    to justify the complexity.
  ref: concepts.md#cqrs-separating-read-and-write-models
- id: event-driven-cqrs-saga-cdc-031
  difficulty: intermediate
  tags:
  - replay
  - projections
  question: |
    A projection (read model) had a bug and produced wrong data for weeks. In an
    event-sourced/CDC system, how do you fix it cleanly?
  options:
  - Fix the projector and replay the event log to rebuild the read model from truth
  - Manually patch each wrong row in the read model with one-off SQL scripts
  - Delete the event log and start over from an empty store, keeping new traffic
  - Switch the read model to strong consistency so reads block on the projection
  answer: 0
  explanation: |
    Because the events are the source of truth, you fix the projection code and
    replay to rebuild the read model — often running the new projection alongside
    the old, then cutting over. Manual patching is error-prone; deleting the log
    destroys truth.
  ref: concepts.md#snapshots-replay-and-event-versioning
- id: event-driven-cqrs-saga-cdc-032
  difficulty: intermediate
  tags:
  - saga-vs-2pc
  - trade-offs
  question: |
    Why is two-phase commit (2PC/XA) rarely used across microservice databases at
    scale?
  options:
  - It provides no atomicity, so participants commit independently and leave the transaction half-applied
  - It is blocking, coordinator-dependent, and tolerates partitions poorly, hurting availability and scale
  - It cannot be implemented in any modern database because the XA protocol was deprecated years ago
  - It is only usable for read-only workloads and cannot coordinate writes across two separate databases
  answer: 1
  explanation: |
    2PC gives ACID atomicity and isolation but holds locks (blocking), depends on
    a coordinator, and degrades badly under partitions and scale — so sagas are
    preferred for distributed workflows. 2PC does provide atomicity, contradicting
    option 0.
  ref: concepts.md#saga-pattern-choreography-versus-orchestration
- id: event-driven-cqrs-saga-cdc-033
  difficulty: intermediate
  tags:
  - outbox
  - relay
  - latency
  question: |
    You implement the outbox pattern with a polling relay. What is the main
    downside versus a CDC-based relay?
  options:
  - Polling loses events permanently whenever two rows are inserted between consecutive poll cycles
  - Polling requires two-phase commit between the relay query and the broker to publish each unsent row
  - Polling adds DB query load and its latency is bounded by the poll interval, while CDC tails the log
    with lower latency and no polling
  - CDC cannot read an outbox table because transaction logs omit rows written inside application code
  answer: 2
  explanation: |
    A polling relay periodically SELECTs unsent rows, adding DB load and latency
    equal to the poll interval. CDC (Debezium) tails the transaction log for
    lower-latency publishing without polling. Polling does not lose events, and
    CDC works well on outbox tables.
  ref: concepts.md#the-dual-write-problem-and-the-outbox-pattern
- id: event-driven-cqrs-saga-cdc-034
  difficulty: intermediate
  tags:
  - event-sourcing
  - cqrs
  - relationship
  question: |
    What is the correct relationship between event sourcing and CQRS?
  options:
  - They are the same underlying pattern with two different names used by different communities
  - Event sourcing strictly requires CQRS, and CQRS in turn strictly requires an event-sourced write store
  - CQRS forbids the use of an event log and mandates a mutable current-state table for all writes
  - They are independent patterns that pair naturally; event sourcing almost always uses CQRS read models
    for queries, but CQRS does not require event sourcing
  answer: 3
  explanation: |
    They are distinct. Event sourcing makes ad-hoc queries hard, so it almost
    always builds CQRS read models; but you can do CQRS with ordinary state stores
    and no event log. They are neither identical nor mutually required.
  ref: concepts.md#cqrs-separating-read-and-write-models
- id: event-driven-cqrs-saga-cdc-035
  difficulty: intermediate
  tags:
  - debezium
  - operations
  question: |
    Which operational hazard is specific to running Debezium against PostgreSQL?
  options:
  - It cannot capture inserts, so newly created rows never reach the change stream
  - A stuck/abandoned replication slot prevents WAL cleanup and can fill the database disk
  - It requires disabling the WAL entirely, which removes crash recovery from the primary
  - It only works when pointed at a read replica and cannot decode the primary's log
  answer: 1
  explanation: |
    Debezium uses a Postgres replication slot; if the consumer stalls, the slot
    holds WAL that cannot be reclaimed, risking disk exhaustion — a well-known
    operational pitfall. It captures inserts, needs the WAL enabled, and reads the
    primary's log.
  ref: concepts.md#change-data-capture-cdc-with-debezium
- id: event-driven-cqrs-saga-cdc-036
  difficulty: advanced
  tags:
  - exactly-once
  - delivery-semantics
  - trade-offs
  question: |
    A candidate proposes "exactly-once delivery end-to-end across our DB, Kafka,
    payment API, and email service." What is the best critique?
  options:
  - True exactly-once across heterogeneous systems is not achievable; aim for effectively-once = at-least-once
    delivery plus idempotent processing
  - It is trivially achievable simply by enabling Kafka transactions across the DB, payment API, and email
  - Exactly-once end-to-end is achievable only if you switch every hop to at-most-once delivery semantics
  - It requires no consumer-side logic at all once the broker's exactly-once configuration flag is turned on
  answer: 0
  explanation: |
    Exactly-once is only achievable inside a closed system (e.g., Kafka-to-Kafka
    transactions), not across a DB, external payment API, and email. The pragmatic
    target is effectively-once: at-least-once delivery plus idempotent consumers
    and idempotent downstream APIs.
  ref: concepts.md#idempotent-consumers-and-delivery-semantics
- id: event-driven-cqrs-saga-cdc-037
  difficulty: advanced
  tags:
  - idempotency
  - atomicity
  - dual-write
  question: |
    A consumer dedups by recording processed message ids in a table, then performs
    the side effect. Under what condition does this design still fail, and how do
    you fix it?
  options:
  - It never fails; recording the processed id before performing the side effect is always safe because the dedup table alone fully prevents any reprocessing
  - It fails only when messages arrive out of order, since dedup by id handles duplicates fine as long as per-partition ordering is preserved
  - It fails only under at-most-once delivery, where a dropped message means the id is recorded but the side effect legitimately never runs
  - If the id-record and the side effect are not committed atomically, a crash between them reintroduces
    a dual-write; commit both in one transaction
  answer: 3
  explanation: |
    If you record the id and apply the side effect separately, a crash in between
    can skip a real effect (id marked, effect lost) or double-apply — the same
    dual-write hazard. Record the processed id and the side effect in one atomic
    transaction. Ordering and at-most-once are not the cause.
  ref: concepts.md#idempotent-consumers-and-delivery-semantics
- id: event-driven-cqrs-saga-cdc-038
  difficulty: advanced
  tags:
  - saga
  - pivot
  - compensation
  question: |
    In saga design, what is a "pivot" (or non-compensatable) transaction and why
    does it matter?
  options:
  - A step that can always be compensated for free at any later point, so it can be placed anywhere in the saga without ordering concerns
  - The central orchestrator process that issues commands to every participant and drives all compensation logic
  - A step after which the saga can no longer be compensated and must go forward (retry), so ordering
    steps around it is critical
  - A duplicate event that must be discarded by the idempotency layer before the saga advances to its next step
  answer: 2
  explanation: |
    A pivot transaction is the point of no return: once passed, compensation is
    impossible, so remaining steps must be retryable-forward. Designers order
    compensatable steps before the pivot and retryable steps after. It is not the
    orchestrator or a duplicate.
  ref: concepts.md#saga-pattern-choreography-versus-orchestration
- id: event-driven-cqrs-saga-cdc-039
  difficulty: advanced
  tags:
  - ordering
  - idempotency
  - versioning
  question: |
    To handle BOTH duplicate delivery AND out-of-order events for a single entity
    in one mechanism, what is the most robust technique?
  options:
  - Retry every event exactly three times with a fixed delay, which collapses duplicates and reorders stale events back into sequence
  - Attach a monotonically increasing version per entity and ignore events whose version is less than
    or equal to the last applied
  - Use at-most-once delivery to avoid duplicates, since dropping any redelivered copy also eliminates every out-of-order arrival
  - Store events in a random order and sort them by wall-clock timestamp at read time to reconstruct the correct per-entity sequence
  answer: 1
  explanation: |
    A per-entity monotonic version lets the consumer ignore anything at or below
    the last-applied version, discarding both duplicates and stale/out-of-order
    updates in one check. Retries and at-most-once do not solve ordering; random
    storage is nonsensical.
  ref: concepts.md#idempotent-consumers-and-delivery-semantics
- id: event-driven-cqrs-saga-cdc-040
  difficulty: advanced
  tags:
  - event-sourcing
  - snapshots
  - capacity
  question: |
    An event-sourced aggregate receives ~200 events/day and lives for years, so
    rehydration replays hundreds of thousands of events and blows the 50 ms
    latency budget. What is the correct fix and its caveat?
  options:
  - Delete old events once they are more than a year old to shorten the replay window and keep rehydration under the latency budget
  - Switch to at-most-once delivery so each event is folded a single time, which bounds the number of events the aggregate must replay
  - Store the aggregate state in a single mutable row and stop event sourcing
  - Introduce snapshots (fold state every N events) and replay only the tail, but remember snapshots are
    a cache with their own versioning concern
  answer: 3
  explanation: |
    Snapshots bound rehydration by starting from the latest folded state and
    replaying only newer events. The caveat: snapshots are a derived cache, not
    truth, and changing fold logic or event shapes may require rebuilding them.
    Deleting events destroys the source of truth.
  ref: concepts.md#snapshots-replay-and-event-versioning
- id: event-driven-cqrs-saga-cdc-041
  difficulty: advanced
  tags:
  - event-versioning
  - schema-registry
  question: |
    Your event schema must add a new required field. Which evolution strategy best
    keeps existing consumers and event replay working?
  options:
  - Use tolerant readers with schema-registry compatibility (defaults for missing fields), or upcast old
    events to the new shape on read
  - Mutate all historical events in place to backfill the new field with a migration script, so every stored event already conforms to the new shape
  - Delete old events that lack the field and rebuild each projection from only the remaining events that carry it
  - Force all consumers to redeploy simultaneously in a hard cutover so no consumer ever observes an event missing the new field
  answer: 0
  explanation: |
    Tolerant readers (defaults via Avro/Protobuf and registry compatibility rules)
    or upcasting old events preserve replay and backward compatibility without
    touching immutable history. Mutating or deleting events breaks replay; a
    simultaneous hard cutover is fragile and impractical.
  ref: concepts.md#snapshots-replay-and-event-versioning
- id: event-driven-cqrs-saga-cdc-042
  difficulty: advanced
  tags:
  - outbox
  - cdc
  - domain-events
  question: |
    Why is combining the outbox pattern WITH CDC (Debezium tailing the outbox
    table) considered the modern best practice, rather than CDC on business tables
    alone?
  options:
  - It eliminates the need for idempotent consumers because the CDC connector deduplicates every outbox row before it reaches the broker
  - It guarantees exactly-once end to end by committing the outbox insert and the Kafka publish inside one distributed transaction
  - You get atomic publish (via the local transaction) and a stable, intentional domain-event contract,
    with low-latency log-based relaying and no raw-schema leakage
  - It removes the need for a message broker by letting consumers read domain events straight from the outbox table over the CDC stream
  answer: 2
  explanation: |
    Outbox gives atomicity and lets you shape deliberate domain events; CDC on the
    outbox relays them with low latency and no polling, avoiding the schema
    leakage of raw table CDC. It is still at-least-once (consumers idempotent) and
    still uses a broker.
  ref: concepts.md#the-dual-write-problem-and-the-outbox-pattern
- id: event-driven-cqrs-saga-cdc-043
  difficulty: advanced
  tags:
  - saga
  - choreography
  - anti-pattern
  question: |
    A team implemented a 10-step order flow with pure choreography and now cannot
    tell whether a given saga is stuck, complete, or looping. What is the root
    cause and the better approach?
  options:
  - The broker is too slow to keep up; add more partitions and consumer instances so events drain faster and stuck sagas resolve themselves
  - Choreography makes the workflow implicit with no single place showing state; switch complex flows
    to orchestration for explicit, observable state
  - They should remove idempotency to simplify the consumers, which will make each saga's progress easier to trace end to end
  - They should switch to at-most-once delivery so every step runs a single time and the saga's position becomes deterministic
  answer: 1
  explanation: |
    Pure choreography scatters the workflow across event reactions with no central
    status, causing exactly this observability and cyclic-dependency pain at scale.
    Orchestration centralizes and makes saga state explicit and monitorable.
    Partitions, dropping idempotency, or at-most-once do not address it.
  ref: concepts.md#saga-pattern-choreography-versus-orchestration
- id: event-driven-cqrs-saga-cdc-044
  difficulty: advanced
  tags:
  - eventual-consistency
  - reconciliation
  question: |
    In a large event-driven system, why are periodic reconciliation jobs and
    divergence alerts considered essential rather than optional?
  options:
  - Because bugs, dropped events, and ordering issues cause read models to drift from the source of truth,
    and reconciliation detects and corrects the divergence
  - Because eventual consistency guarantees the read models will always converge to exactly the source of truth, so the jobs exist only to emit audit logs
  - Because reconciliation jobs replace the need for idempotent consumers by retroactively deleting any duplicate effects they detect
  - Because running them on a fixed schedule converts the system to strong consistency by blocking reads until every projection is caught up
  answer: 0
  explanation: |
    Real systems drift due to projector bugs, missed/duplicated events, and
    reordering; reconciliation compares source-of-truth to derived views and
    alerts/corrects. Eventual consistency does not guarantee zero drift, and
    reconciliation neither replaces idempotency nor makes the system linearizable.
  ref: concepts.md#eventual-consistency-and-its-implications
- id: event-driven-cqrs-saga-cdc-045
  difficulty: advanced
  tags:
  - cdc
  - strangler-fig
  - migration
  question: |
    You must extract functionality from a legacy monolith you cannot rewrite, into
    new event-driven services, without downtime. Which approach fits best?
  options:
  - Rewrite the monolith from scratch into new services first, then cut all traffic over in a single big-bang release once the rewrite passes tests
  - Point all new services directly at the monolith's internal tables via synchronous joins so they share one schema and stay perfectly consistent
  - Use log-based CDC to stream the monolith DB changes into the event stream (strangler-fig), letting
    new services consume events and gradually take over
  - Turn off the monolith during a maintenance window and let queued traffic drain into the new services once they come online
  answer: 2
  explanation: |
    Log-based CDC bridges the existing DB into the event stream without modifying
    the legacy app, enabling a strangler-fig migration where new services
    incrementally consume events and assume responsibilities. A big-bang rewrite,
    direct table coupling, or shutting it off are all riskier or infeasible.
  ref: concepts.md#change-data-capture-cdc-with-debezium
- id: event-driven-cqrs-saga-cdc-046
  difficulty: advanced
  tags:
  - distributed-monolith
  - anti-pattern
  question: |
    Which situation best describes the "distributed monolith" anti-pattern in an
    event-driven migration?
  options:
  - Services communicate only through well-defined async events and can each be deployed independently without coordinating releases across teams
  - Services are so chatty and tightly coupled through synchronous calls and shared assumptions that they
    must be deployed together
  - A single service owns a single database and exposes it only through its own versioned public API to every other service
  - A monolith is deployed to a single large server and scaled vertically by adding more CPU and memory to that host
  answer: 1
  explanation: |
    A distributed monolith has all the operational cost of microservices but the
    coupling of a monolith — services cannot deploy independently. Option 0 is
    healthy decoupling; the others describe ordinary single-service or single-host
    setups.
  ref: concepts.md#trade-offs-and-when-to-use-what-decision-guide
- id: event-driven-cqrs-saga-cdc-047
  difficulty: advanced
  tags:
  - cqrs
  - consistency-window
  - monitoring
  question: |
    In CQRS, why is monitoring consumer/projection lag treated as a first-class
    SLO?
  options:
  - Because lag is unrelated to correctness and only reflects broker throughput, so it is tracked purely for capacity dashboards
  - Because lag determines the encryption strength applied to events, so higher lag weakens the cipher protecting them in transit
  - Because keeping lag low is what guarantees exactly-once delivery end to end across the projection consumers
  - Because the projection lag IS the consistency window users experience; high lag means stale reads
    and worse read-your-writes behavior
  answer: 3
  explanation: |
    Projection lag directly determines how stale read models are — it is the
    user-visible consistency window. Spikes mean users see older data and
    read-your-writes anomalies worsen, so it is an SLO. It has nothing to do with
    encryption or delivery guarantees.
  ref: concepts.md#eventual-consistency-and-its-implications
- id: event-driven-cqrs-saga-cdc-048
  difficulty: advanced
  tags:
  - saga
  - orchestration
  - coupling
  question: |
    What is the primary risk of orchestration-based sagas, and how is it
    mitigated?
  options:
  - The orchestrator makes the workflow invisible with no single place showing its state; mitigate by removing the coordinator and letting services react to events
  - The orchestrator can become a god-object accumulating business logic and coupling; mitigate by keeping
    it thin and using durable-workflow tooling (Temporal, Step Functions)
  - Orchestration cannot express timeouts or delays between steps; mitigate by switching those flows to pure choreography instead
  - Orchestration forbids compensating transactions once a step commits; mitigate by wrapping the whole saga in a two-phase commit
  answer: 1
  explanation: |
    Orchestration's risk is centralizing too much logic into a coupling hotspot;
    keep it thin (coordination only, not domain logic) and lean on durable
    execution engines. Orchestration actually improves visibility and handles
    timeouts and compensation well.
  ref: concepts.md#saga-pattern-choreography-versus-orchestration
- id: event-driven-cqrs-saga-cdc-049
  difficulty: advanced
  tags:
  - event-sourcing
  - listen-to-yourself
  - dual-write
  question: |
    Why does a fully event-sourced service avoid the dual-write problem entirely?
  options:
  - Because appending the event IS the commit; there is no separate state write to keep in sync
  - Because it wraps the event-store append and the broker publish in a single two-phase commit spanning both systems
  - Because it never publishes events to a broker at all, so there is no second write that could diverge from the state
  - Because it disables durability on the write path, collapsing the two writes into one best-effort in-memory operation
  answer: 0
  explanation: |
    In event sourcing the event store is the database, so persisting the event is
    the single write — there is no second, separate state mutation to make atomic.
    No 2PC is needed, events are still published, and durability is retained.
  ref: concepts.md#the-dual-write-problem-and-the-outbox-pattern
- id: event-driven-cqrs-saga-cdc-050
  difficulty: advanced
  tags:
  - estimation
  - event-store
  - capacity
  question: |
    An event store holds 50 million aggregates, each averaging 40 events of ~600
    bytes. Roughly how much raw event storage is that (ignoring indexes/overhead)?
  options:
  - About 1.2 GB
  - About 120 TB
  - About 12 GB
  - About 1.2 TB
  answer: 3
  explanation: |
    50e6 aggregates x 40 events x 600 bytes = 50e6 x 24,000 bytes = 1.2e12 bytes
    approximately 1.2 TB. This kind of back-of-envelope check informs tiering to
    cheap storage and snapshot strategy. The other magnitudes are off by 1000x.
  ref: concepts.md#event-sourcing-the-event-log-as-source-of-truth
- id: event-driven-cqrs-saga-cdc-051
  difficulty: advanced
  tags:
  - cdc
  - ordering
  - partitioning
  question: |
    Debezium streams changes from a table into Kafka. What ordering guarantee can
    consumers rely on, and what must they NOT assume?
  options:
  - Global total ordering across all tables and rows, because Debezium serializes the entire transaction log into a single strictly ordered stream
  - No ordering guarantees whatsoever, since the connector emits row changes in whatever arbitrary order the broker happens to receive them
  - Per-row ordering (via primary key as partition key), but NOT global ordering across different rows
    or tables
  - Strict per-row ordering only when consumers enable at-most-once delivery, which drops any redelivered change that would otherwise reorder the stream
  answer: 2
  explanation: |
    Debezium partitions by primary key, preserving order of changes to the same
    row, but changes to different rows/tables can interleave — there is no global
    order. Consumers must design for that. Ordering does not depend on at-most-once
    delivery.
  ref: concepts.md#change-data-capture-cdc-with-debezium
- id: event-driven-cqrs-saga-cdc-052
  difficulty: advanced
  tags:
  - saga
  - isolation
  - countermeasures
  question: |
    To reduce anomalies from a saga's lack of isolation (e.g., another process
    acting on data mid-saga), which countermeasure is standard?
  options:
  - Hold a single distributed lock across all participating services for the entire duration of the saga so no other process can touch the data
  - Use semantic locks such as a PENDING status plus commutative updates, reread-value checks, or version
    numbers
  - Switch to at-most-once delivery so each step runs a single time and no other process observes an intermediate saga state
  - Disable compensating transactions to keep the flow simple, since fewer moving steps means fewer windows for another process to interfere
  answer: 1
  explanation: |
    Semantic locks (an explicit PENDING/in-progress state), commutative updates,
    reread values, and versioning are the recognized saga countermeasures for
    missing isolation. Holding a global distributed lock for the whole saga
    defeats the point of sagas; the others are irrelevant or harmful.
  ref: concepts.md#saga-pattern-choreography-versus-orchestration
- id: event-driven-cqrs-saga-cdc-053
  difficulty: advanced
  tags:
  - trade-offs
  - when-not-to
  - judgment
  question: |
    A startup with a small team, one product, modest traffic, and evolving domain
    wants to adopt event sourcing + CQRS + choreographed sagas everywhere from day
    one. What is the best senior guidance?
  options:
  - Do it from day one; these patterns are strictly superior and future-proof, so adopting them everywhere now avoids any costly migration later
  - Adopt event sourcing everywhere for the audit trail but skip CQRS, serving all queries by folding the event log on every read
  - Use two-phase commit across all services instead, giving the small team true cross-service atomicity without learning eventual consistency
  - Avoid system-wide adoption; start simple (modular monolith, single DB, strong consistency) and apply
    these patterns surgically only where a concrete need (audit, read/write asymmetry, cross-service workflow)
    emerges
  answer: 3
  explanation: |
    These patterns add heavy complexity (eventual consistency, versioning,
    distributed debugging) justified only by concrete needs. The senior move is to
    start simple and introduce each pattern surgically where it pays off — not
    blanket adoption on day one. 2PC-everywhere is worse.
  ref: concepts.md#trade-offs-and-when-to-use-what-decision-guide
- id: event-driven-cqrs-saga-cdc-054
  difficulty: advanced
  tags:
  - retries
  - backoff
  - transient-vs-permanent
  question: |
    How should a robust consumer distinguish handling of a downstream 503
    (temporary) versus a schema-validation error (permanent)?
  options:
  - Retry the 503 with exponential backoff and jitter, but send the validation error to the DLQ immediately
    since retrying will never succeed
  - Retry both the 503 and the validation error forever with no backoff, since persistent retries will eventually clear either failure once conditions change
  - Send both the 503 and the validation error straight to the DLQ immediately, treating every non-success response as permanently unprocessable
  - Drop both the 503 and the validation error silently and commit the offset, so the poison message never blocks the partition again
  answer: 0
  explanation: |
    Transient failures (503, timeouts) warrant bounded retry with exponential
    backoff and jitter; permanent failures (bad data) will never succeed, so send
    them straight to the DLQ. Retrying forever wastes resources and blocks;
    DLQ-ing transient errors gives up too early; dropping loses data.
  ref: concepts.md#dead-letter-queues-retries-and-poison-messages
- id: event-driven-cqrs-saga-cdc-055
  difficulty: advanced
  tags:
  - cqrs
  - read-your-writes
  - design
  question: |
    A banking app uses CQRS, but after a transfer the user MUST immediately see the
    updated balance. Which design best satisfies this without abandoning CQRS?
  options:
  - Accept the stale read and show a banner asking the user to wait and refresh in a minute until the
    projection eventually catches up
  - Make the entire read model strongly consistent and synchronous for every query, so all reads block
    until the projection has fully applied the write
  - For this specific read, query the strongly consistent write model (or return the new balance in the
    command response), while other reads use the async read model
  - Abandon CQRS entirely and collapse all reads and writes back into one giant shared table so every
    query hits the same store
  answer: 2
  explanation: |
    You can route the latency-critical, correctness-critical read to the write
    model (or echo the result in the command response) while keeping CQRS for the
    bulk of reads — a targeted strong-consistency path. Forcing all reads
    synchronous or abandoning CQRS throws away its benefits; stale balances are
    unacceptable.
  ref: concepts.md#cqrs-separating-read-and-write-models
- id: event-driven-cqrs-saga-cdc-056
  difficulty: advanced
  tags:
  - event-styles
  - notification
  - read-storm
  question: |
    Choosing thin event notifications (id-only) over event-carried state transfer
    can cause which failure mode at scale?
  options:
  - Events become too large to transmit because the id-only payload forces the broker to inline the full
    entity body on every message
  - 'A callback/read storm: many consumers call back to the producer to fetch details, reintroducing coupling
    and load on the producer'
  - Consumers can no longer be idempotent, because an id-only event omits the version number needed to
    deduplicate repeated deliveries
  - The broker loses its per-partition ordering guarantees whenever events carry only an id instead of
    the full state payload
  answer: 1
  explanation: |
    Thin notifications force consumers to call back for details; at high fan-out
    this creates a read storm on the producer and reintroduces runtime coupling —
    the reason ECST is often preferred. Notifications make events smaller, not
    larger, and do not affect idempotency or ordering.
  ref: concepts.md#event-notification-versus-event-carried-state-transfer
- id: event-driven-cqrs-saga-cdc-057
  difficulty: expert
  tags:
  - saga
  - orchestration
  - temporal
  - durability
  question: |
    Why do teams increasingly implement complex orchestrated sagas on durable
    execution engines (Temporal, Step Functions) rather than hand-rolling an
    orchestrator with a database state machine?
  options:
  - Because they provide durable, crash-resilient workflow state, automatic retries, timeouts, and history/replay,
    removing large amounts of error-prone bespoke coordination and recovery code
  - Because these engines upgrade the whole system to strong consistency by serializing every workflow
    step through a single linearizable log
  - Because they eliminate the need for compensating transactions by physically rolling back each completed
    step through the workflow history
  - Because they remove eventual consistency across services by holding a distributed lock for the full
    duration of every workflow instance
  answer: 0
  explanation: |
    Durable execution engines persist workflow progress and transparently resume
    after crashes, with built-in retries, timers, and history — offloading the
    hardest parts of orchestration. They do not eliminate compensation or eventual
    consistency, nor make the whole system linearizable.
  ref: concepts.md#saga-pattern-choreography-versus-orchestration
- id: event-driven-cqrs-saga-cdc-058
  difficulty: expert
  tags:
  - event-sourcing
  - snapshot-versioning
  - subtlety
  question: |
    You change an event-sourced aggregate's fold logic to compute a field
    differently. Existing snapshots were built with the OLD logic. What is the
    correct handling?
  options:
  - Treat the snapshots as the source of truth and keep serving them, ignoring the new fold logic since
    rebuilding would waste replay effort
  - Delete the underlying events that back each stale snapshot so the cached state and the log can no longer
    disagree with the new logic
  - Invalidate/rebuild affected snapshots (and version them), because snapshots are a derived cache of
    the fold and would otherwise serve stale/incorrect state
  - Do nothing, because snapshots detect the changed fold logic and transparently recompute themselves
    on the next aggregate load
  answer: 2
  explanation: |
    Snapshots are a cache of the fold; changing fold logic makes old snapshots
    stale, so they must be versioned and rebuilt. Events remain the source of
    truth (never delete them), and snapshots do not recompute on their own.
  ref: concepts.md#snapshots-replay-and-event-versioning
- id: event-driven-cqrs-saga-cdc-059
  difficulty: expert
  tags:
  - outbox
  - ordering
  - cdc
  - subtlety
  question: |
    With an outbox table relayed by CDC, events for the same aggregate must stay
    ordered downstream. Which detail is MOST important to get right?
  options:
  - Use a freshly generated random UUID as the Kafka partition key for every event so writes spread evenly
    across all partitions
  - Publish all events to one single global partition and rely on a lone consumer thread to read them
    back in strict arrival order
  - Disable the schema registry so events serialize faster and the relay can flush the outbox rows without
    a compatibility check
  - Set the Kafka partition key to the aggregate id so all of that aggregate's outbox events map to one
    partition and preserve order
  answer: 3
  explanation: |
    Ordering is per-partition, so keying by aggregate id keeps each aggregate's
    events in one partition and in order while allowing parallelism across
    aggregates. Random keys scatter and reorder them; a single global partition
    kills throughput; the schema registry is unrelated to ordering.
  ref: concepts.md#the-dual-write-problem-and-the-outbox-pattern
- id: event-driven-cqrs-saga-cdc-060
  difficulty: expert
  tags:
  - saga
  - choreography
  - cyclic-dependency
  question: |
    Which subtle failure is characteristic of large choreography-based sagas and
    hard to detect until production?
  options:
  - Too much centralized logging from the coordinator, which floods the log pipeline and hides the real
    per-service failures
  - Cyclic event dependencies and emergent loops where services react to each other's events in ways no
    single team fully modeled
  - Excessive strong consistency across steps, since each service blocks on a synchronous confirmation
    before emitting its next event
  - The single orchestrator process becoming a throughput bottleneck once every saga step must funnel
    through it
  answer: 1
  explanation: |
    Because choreography has no central model, event reactions can form cycles or
    unintended loops that emerge only at runtime — a known hazard. There is no
    orchestrator in choreography, and these systems are eventually (not strongly)
    consistent.
  ref: concepts.md#saga-pattern-choreography-versus-orchestration
- id: event-driven-cqrs-saga-cdc-061
  difficulty: expert
  tags:
  - cap
  - pacelc
  - trade-offs
  question: |
    Framed in CAP/PACELC terms, what fundamental choice does adopting
    event-driven + eventual consistency represent?
  options:
  - Favoring availability and low latency (A/L) at the cost of immediate consistency (C), accepting user-visible
    staleness in exchange for scale and partition tolerance
  - Choosing strict consistency (C) and giving up availability on every request, blocking each read until
    all replicas confirm the latest write
  - Eliminating the CAP trade-off entirely, so the system can be fully consistent, available, and partition-tolerant
    at the same time
  - Guaranteeing linearizable reads across all replicas with no added latency cost, even during a network
    partition
  answer: 0
  explanation: |
    Eventual consistency is a deliberate PACELC choice: even without partitions
    you accept latency/consistency trade-offs, favoring availability and low
    latency over immediate consistency. CAP trade-offs cannot be eliminated, and
    linearizability is not free.
  ref: concepts.md#eventual-consistency-and-its-implications
- id: event-driven-cqrs-saga-cdc-062
  difficulty: expert
  tags:
  - idempotency
  - exactly-once
  - kafka-transactions
  question: |
    Kafka's transactional/exactly-once semantics can guarantee effectively-once
    processing in which specific scenario?
  options:
  - Reading from Kafka and then calling an external non-transactional payment API, whose side effect Kafka's
    transaction can roll back on abort
  - Writing to an arbitrary external SQL database and an email service, both of which enlist in Kafka's
    producer transaction and commit atomically with it
  - Any system at all, as long as it enables the exactly-once config flag on both the producer and the
    consumer side
  - A closed Kafka-to-Kafka read-process-write pipeline where the consumed offset and produced messages
    commit atomically within Kafka
  answer: 3
  explanation: |
    Kafka EOS works within the Kafka boundary: consume-transform-produce with
    atomic offset+output commit. The moment an external, non-transactional system
    (payment API, email, arbitrary DB) is involved, you fall back to at-least-once
    plus idempotency. A config flag alone does not extend guarantees across
    systems.
  ref: concepts.md#idempotent-consumers-and-delivery-semantics
- id: event-driven-cqrs-saga-cdc-063
  difficulty: expert
  tags:
  - event-sourcing
  - projection-rebuild
  - zero-downtime
  question: |
    You must rebuild a large read model from a multi-hour event replay without
    downtime. What is the safest rollout?
  options:
  - Stop the live read model, run the multi-hour replay while it is offline, then bring it back online
    once the rebuild finally completes
  - Mutate the existing read model in place while it continues serving production traffic, overwriting
    each row as the replay reaches it
  - Build the new projection in parallel (idempotent, into a new store), let it catch up to near-real-time,
    then atomically switch reads over and retire the old one
  - Replay directly onto the production read model with no versioning, letting live queries read partially
    rebuilt rows as the replay proceeds
  answer: 2
  explanation: |
    Blue/green projection rebuild — build the new version alongside the old,
    catch up to live, then cut over — avoids downtime and lets you validate before
    switching. Idempotent projectors make replay safe. Stopping the live model or
    mutating it in place during replay causes downtime or inconsistency.
  ref: concepts.md#snapshots-replay-and-event-versioning
- id: event-driven-cqrs-saga-cdc-064
  difficulty: expert
  tags:
  - saga
  - distributed-transactions
  - judgment
  question: |
    An interviewer asks: "You have exactly two internal resources (an account
    ledger and a limits table) in the same database that must update atomically."
    Should you use a saga?
  options:
  - Yes, always reach for a saga whenever an operation touches two or more tables, even inside the same
    database, to keep the coordination pattern uniform
  - No; if both are in one database, a single local ACID transaction is simpler and gives true atomicity
    and isolation — reserve sagas for cross-database/service work
  - Yes, because a saga commits the two local steps in parallel and is therefore faster than a single
    serial local transaction
  - No; instead run a two-phase commit across the two tables even though they live in one database, to
    get a formal prepare/commit handshake
  answer: 1
  explanation: |
    Sagas exist to coordinate across separate services/databases without 2PC. When
    both resources share one database, a plain local transaction is simpler and
    gives real atomicity and isolation — introducing a saga would add complexity
    and lose isolation for no reason. Intra-DB 2PC is also pointless.
  ref: concepts.md#saga-pattern-choreography-versus-orchestration
- id: event-driven-cqrs-saga-cdc-065
  difficulty: expert
  tags:
  - estimation
  - consumer-lag
  - throughput
  question: |
    A Kafka topic ingests 20,000 events/sec. A consumer group processes 15,000
    events/sec sustained. If a 10-minute incident stops consumption entirely,
    roughly how long to fully drain the backlog once processing resumes (assuming
    input continues at 20k/s)?
  options:
  - It drains almost immediately, since the consumer group briefly bursts well above 20k/s to clear the
    accumulated 10-minute backlog
  - About 10 minutes, because draining the backlog takes exactly as long as the incident that created it
  - About 30 seconds, since the 5k/s of spare processing headroom clears the accumulated backlog almost
    at once
  - It never drains, because processing rate (15k/s) is below the input rate (20k/s)
  answer: 3
  explanation: |
    If sustained input (20k/s) exceeds max processing rate (15k/s), the backlog
    grows forever and never drains — you must scale consumers/partitions beyond
    20k/s or shed load. This throughput-vs-arrival reasoning is core capacity
    analysis; the finite-time answers assume processing can outpace input, which
    it cannot here.
  ref: concepts.md#eventual-consistency-and-its-implications
- id: event-driven-cqrs-saga-cdc-066
  difficulty: expert
  tags:
  - outbox
  - cdc
  - failure-mode
  question: |
    With outbox + Debezium, the relay crashes AFTER publishing an event to Kafka
    but BEFORE marking the outbox row as sent. What happens and why is it
    acceptable?
  options:
  - On restart the relay republishes the row, producing a duplicate; this is acceptable because consumers
    are idempotent (at-least-once by design)
  - The event is lost forever because the unmarked outbox row is skipped on restart, making this a critical
    correctness bug in the pattern
  - The database automatically rolls back the already-committed business transaction once it detects the
    outbox row was never marked as sent
  - Kafka silently discards the duplicate on republish by matching the producer session id, so no duplicate
    ever reaches consumers
  answer: 0
  explanation: |
    This is the canonical at-least-once window: the row looks unsent so it is
    republished, creating a duplicate that idempotent consumers absorb. No event is
    lost, the committed business transaction is unaffected, and Kafka does not
    auto-dedup across producer sessions.
  ref: concepts.md#the-dual-write-problem-and-the-outbox-pattern
- id: event-driven-cqrs-saga-cdc-067
  difficulty: expert
  tags:
  - cqrs
  - event-sourcing
  - when-not-to
  - judgment
  question: |
    Which statement best captures Greg Young's caution about CQRS and event
    sourcing that senior engineers cite?
  options:
  - CQRS should be the default top-level architecture for every system, since separating reads and writes
    is universally beneficial regardless of the domain
  - Event sourcing removes all need for read models, because folding the log on every query is efficient
    enough to serve arbitrary read shapes directly
  - CQRS is a pattern for specific bounded contexts, not a top-level architecture; applying it everywhere
    multiplies complexity for no benefit
  - CQRS guarantees strong consistency automatically by keeping the write and read models synchronized
    within a single atomic commit
  answer: 2
  explanation: |
    Young (who coined CQRS) stresses it is a targeted pattern for particular
    bounded contexts, not a system-wide default; blanket use adds cost without
    value. Event sourcing actually increases the need for read models, and CQRS
    does not provide strong consistency.
  ref: concepts.md#cqrs-separating-read-and-write-models
- id: event-driven-cqrs-saga-cdc-068
  difficulty: expert
  tags:
  - cdc
  - snapshot
  - duplicates
  - idempotency
  question: |
    When a Debezium connector performs its INITIAL SNAPSHOT of an existing table
    and then streams changes, what must downstream consumers be prepared for?
  options:
  - A firm guarantee that no row ever appears more than once, because the connector tracks a committed
    offset for every snapshot row it emits
  - Possible duplicates and re-emission of snapshot rows on connector restart, so consumers must be idempotent
  - That deletes are captured during the snapshot phase but inserts are silently skipped until streaming
    fully takes over
  - That once the initial snapshot completes it replaces the transaction log, so ongoing changes no longer
    need to be tailed from the WAL
  answer: 1
  explanation: |
    The initial snapshot plus streaming, combined with at-least-once semantics and
    connector restarts, can re-emit rows — so idempotency is required. Debezium
    captures inserts too, and the snapshot complements (does not replace) log
    streaming.
  ref: concepts.md#change-data-capture-cdc-with-debezium
- id: event-driven-cqrs-saga-cdc-069
  difficulty: intermediate
  tags:
  - event-driven
  - hybrid
  - design
  question: |
    What does a typical well-designed real-world system look like regarding sync
    vs async?
  options:
  - 'Hybrid: synchronous on the user''s critical path, asynchronous events for downstream work like indexing,
    notifications, and analytics'
  - Everything is synchronous RPC end to end, with even indexing, notifications, and analytics blocking
    the caller until each downstream step confirms
  - Everything, including the reads a user is actively waiting on, is routed through the event bus and
    answered only after a consumer republishes the result
  - It alternates between synchronous and asynchronous handling at random per request, deciding the style
    fresh on each call regardless of the operation
  answer: 0
  explanation: |
    Most mature systems are hybrid: keep the user's critical path synchronous for
    immediate answers, and fan out asynchronous events for everything downstream of
    the committed fact. All-sync or all-async are both suboptimal extremes.
  ref: concepts.md#event-driven-versus-request-response-trade-offs
- id: event-driven-cqrs-saga-cdc-070
  difficulty: intermediate
  tags:
  - debezium
  - use-cases
  question: |
    Which of these is the CLEANEST, most-recommended use of CDC?
  options:
  - Exposing raw internal tables directly as the permanent public API that every other team codes against
    and depends on
  - Replacing all synchronous read paths with CDC streams so clients reconstruct current state from the
    change feed instead of querying
  - Tailing a dedicated outbox table so the service emits deliberate domain events
  - Using the CDC change stream as a substitute for database backups by replaying it to restore the table
    after data loss
  answer: 2
  explanation: |
    The cleanest CDC use is tailing an outbox table to publish intentional domain
    events with a stable contract. Exposing raw tables leaks internal schema; CDC
    is not a read-path replacement nor a backup mechanism.
  ref: concepts.md#change-data-capture-cdc-with-debezium
- id: event-driven-cqrs-saga-cdc-071
  difficulty: intermediate
  tags:
  - stripe
  - idempotency-key
  - downstream
  question: |
    When calling an external payment provider from an event consumer, how do you
    prevent a duplicate event from causing a double charge?
  options:
  - Assume the broker guarantees exactly-once delivery end to end and call the charge endpoint normally
    without any deduplication safeguard
  - Retry the charge a few extra times up front to be safe, so a slow or dropped response never leaves
    the payment unattempted
  - Disable retries entirely on the consumer so the charge is attempted exactly one time and can never
    be issued twice
  - Pass a stable idempotency key (e.g., derived from the event/order id) so the provider deduplicates
    the charge on its side
  answer: 3
  explanation: |
    Providers like Stripe accept an Idempotency-Key so repeated requests with the
    same key are charged once — the correct end-to-end idempotency mechanism.
    Trusting exactly-once is wrong, extra retries worsen the risk, and disabling
    retries sacrifices reliability.
  ref: concepts.md#idempotent-consumers-and-delivery-semantics
- id: event-driven-cqrs-saga-cdc-072
  difficulty: intermediate
  tags:
  - event-sourcing
  - audit
  - use-case
  question: |
    For which system is event sourcing MOST clearly the right call?
  options:
  - A stateless image-resizing microservice that transforms an input file and keeps no long-lived entity
    history worth replaying
  - A financial ledger / trading system where a complete, immutable audit trail and temporal queries are
    hard requirements
  - A simple CRUD contact list for a small team, where records are just created, edited, and deleted with
    no audit or replay need
  - A read-only marketing landing page that renders static content and never mutates any domain state
    at all
  answer: 1
  explanation: |
    Event sourcing shines where audit history, replay, and temporal queries are
    first-class requirements — ledgers and trading systems are the canonical fit.
    Stateless processing, simple CRUD, and static pages gain nothing and pay all
    the complexity costs.
  ref: concepts.md#event-sourcing-the-event-log-as-source-of-truth
