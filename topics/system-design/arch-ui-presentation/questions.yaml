topic: "UI / Presentation Architectures (MVC, MVP, MVVM)"
domain: system-design
topic_slug: arch-ui-presentation
version: 1
questions:
  - id: arch-ui-presentation-001
    difficulty: beginner
    tags: [mvc, separation-of-concerns, altitude]
    question: |
      Presentation architectures like MVC/MVP/MVVM sit at a different "altitude"
      than system-level styles (microservices, event-driven) and object-level GoF
      patterns. What do they primarily decide?
    options:
      - "Where UI/presentation logic lives and how it is separated from the domain"
      - "How independent services are deployed and horizontally scaled across hosts"
      - "Which database engine, replication mode, and sharding scheme to adopt"
      - "How an individual class implements exactly one cohesive responsibility"
    answer: 0
    explanation: |
      These are presentation-tier structuring patterns: they decide where rendering,
      formatting, input-handling, and screen state live, and how that is decoupled from
      the domain so it can evolve and be tested independently. Deployment/scaling is the
      concern of system-level arch styles; single-class responsibility is GoF-pattern
      altitude.
    ref: "concepts.md#mvc-model-view-controller"
  - id: arch-ui-presentation-002
    difficulty: beginner
    tags: [mvc, roles]
    question: |
      In classic Model-View-Controller, what is the Controller's primary job?
    options:
      - "Render the model's fields directly onto the screen for the user"
      - "Translate raw user input into operations on the Model"
      - "Store the domain data and enforce the core business rules"
      - "Synchronize two-way widget bindings automatically on every change"
    answer: 1
    explanation: |
      The Controller receives raw user input (clicks, keystrokes) and translates it into
      Model operations (and sometimes selects the next View). Rendering is the View's job,
      data/rules are the Model's, and automatic two-way binding belongs to MVVM.
    ref: "concepts.md#mvc-model-view-controller"
  - id: arch-ui-presentation-003
    difficulty: intermediate
    tags: [mvc, web-mvc, smalltalk]
    question: |
      How does classic Smalltalk-80 MVC differ from server-side "web MVC" (Model 2)?
    options:
      - "Web MVC uses a live View↔Model Observer link; Smalltalk MVC does not"
      - "They are functionally identical; 'web MVC' is merely a later marketing rebrand"
      - "Classic MVC has the View observe the Model; web MVC is per-request Front/Page Controller with a stateless template"
      - "Smalltalk MVC has no Controller at all, coordinating only the Model and the View"
    answer: 2
    explanation: |
      In classic MVC the View observes the Model and re-renders on change. Server-side web
      MVC (Rails/Spring MVC/ASP.NET MVC) is really Model 2: a Front Controller handles the
      request, updates the Model, and picks a stateless template to render — there is no
      persistent observer link.
    ref: "concepts.md#mvc-model-view-controller"
  - id: arch-ui-presentation-004
    difficulty: intermediate
    tags: [mvc, testability, ilities]
    question: |
      Which weakness of classic MVC most directly motivated MVP?
    options:
      - "It is architecturally incapable of rendering more than one View over a single Model"
      - "It mandates a heavyweight two-way data-binding framework to function at all"
      - "It forces every piece of presentation logic to live inside the domain Model"
      - "The View↔Model coupling makes presentation logic hard to unit-test without a running View"
    answer: 3
    explanation: |
      Because the classic View reads/observes the Model directly, you generally cannot test
      the screen's presentation logic without instantiating real UI. MVP fixes this by making
      the View a passive, mockable interface and moving all logic to a Presenter.
    ref: "concepts.md#mvp-model-view-presenter"
  - id: arch-ui-presentation-005
    difficulty: intermediate
    tags: [mvp, presenter, testability]
    question: |
      In MVP, why is the View typically defined as an interface (e.g. IView)?
    options:
      - "So the Presenter can depend on the interface and be tested against a mock View"
      - "So the domain Model can render itself directly onto the screen widgets"
      - "To enable a framework's automatic two-way binding engine between fields"
      - "So the View can hold and enforce all of the application's business rules"
    answer: 0
    explanation: |
      The Presenter references the View interface, not a concrete widget. Tests substitute
      a fake/mock View, so presentation logic is unit-testable without any real UI. This is
      the Humble Object idea applied to the View.
    ref: "concepts.md#mvp-model-view-presenter"
  - id: arch-ui-presentation-006
    difficulty: advanced
    tags: [mvp, mvc, differences]
    question: |
      What is the sharpest structural difference between MVP and classic MVC?
    options:
      - "MVP dispenses with the Model entirely, keeping only a View and a Presenter"
      - "In MVP the Presenter mediates ALL View↔Model traffic; in MVC the View may read the Model directly"
      - "MVC mandates fully immutable state whereas MVP freely mutates shared state"
      - "MVP requires a single global store shared across every screen in the app"
    answer: 1
    explanation: |
      In classic MVC the View can read/observe the Model. In MVP the Presenter sits between
      them and handles all communication, so the View never touches the Model directly.
    ref: "concepts.md#mvp-model-view-presenter"
  - id: arch-ui-presentation-007
    difficulty: intermediate
    tags: [mvp, boilerplate, tradeoffs]
    question: |
      What is the main cost of MVP compared with MVVM?
    options:
      - "Its presentation logic is fundamentally impossible to cover with unit tests"
      - "It tightly couples the domain Model directly to concrete View widgets"
      - "Verbose boilerplate — a 1:1 View interface plus a Presenter and manual wiring per screen"
      - "It forces the use of immutable state and pure reducer functions per screen"
    answer: 2
    explanation: |
      MVP's testability comes at the price of boilerplate: each screen needs a View interface,
      a Presenter, and hand-written wiring to push state into the View. MVVM removes most of
      that glue with a data-binding engine.
    ref: "concepts.md#mvp-model-view-presenter"
  - id: arch-ui-presentation-008
    difficulty: advanced
    tags: [supervising-controller, mvp-variants, testability]
    question: |
      Compared with Passive View, what does the Supervising Controller variant trade away?
    options:
      - "It abandons separation of concerns entirely, merging every layer together"
      - "It requires a single global immutable store coordinated by a dispatcher"
      - "It couples the domain Model directly to the concrete screen widgets"
      - "Logic living in the View's declarative bindings is no longer unit-testable"
    answer: 3
    explanation: |
      Supervising Controller lets the View handle simple declarative binding itself and
      reserves the Presenter for complex logic. That reduces boilerplate but the bound
      view-side logic can't be covered by plain unit tests — a testability-for-brevity trade.
    ref: "concepts.md#mvp-variant-supervising-controller"
  - id: arch-ui-presentation-009
    difficulty: advanced
    tags: [passive-view, mvp-variants, humble-object]
    question: |
      Passive View pushes the "humble View" idea to its extreme. What characterizes it?
    options:
      - "The View holds zero logic/state decisions; the Presenter explicitly sets every property"
      - "The View reads the Model directly for simple fields to cut down on wiring"
      - "A declarative binding engine keeps the View and an observable ViewModel in sync"
      - "The View dispatches user actions straight to a pure reducer for state updates"
    answer: 0
    explanation: |
      In Passive View the View is a pure surface of setters/events. The Presenter reads the
      Model and sets each widget property by hand, maximizing testability at the cost of
      maximum boilerplate. It is the Humble Object pattern applied to the View.
    ref: "concepts.md#mvp-variant-passive-view"
  - id: arch-ui-presentation-010
    difficulty: intermediate
    tags: [mvvm, data-binding, viewmodel]
    question: |
      What core mechanism distinguishes MVVM from MVP?
    options:
      - "A single global immutable store mutated only through pure reducer functions"
      - "A declarative data-binding engine that syncs the View to an observable ViewModel automatically"
      - "A dedicated Router component that owns all navigation and screen flow"
      - "Multiple independent stores coordinated by a central dispatcher hub"
    answer: 1
    explanation: |
      MVVM introduces a binding engine: the View binds widgets to observable ViewModel
      properties/commands, and the framework keeps them in sync (often two-way). MVP instead
      pushes state into the View manually through an interface.
    ref: "concepts.md#mvvm-model-view-viewmodel"
  - id: arch-ui-presentation-011
    difficulty: intermediate
    tags: [mvvm, viewmodel, coupling]
    question: |
      In MVVM, what does the ViewModel know about the View?
    options:
      - "It holds a direct reference to the concrete View instance it drives"
      - "It subclasses the concrete View and overrides its rendering methods"
      - "Nothing — the ViewModel has no reference to the View; binding connects them"
      - "It renders the View directly by writing values into each widget"
    answer: 2
    explanation: |
      A defining trait of MVVM is that the ViewModel exposes bindable state/commands but has
      no reference to the View. The binding engine connects them, which is why the ViewModel
      is easy to test in isolation. (Contrast MVP, where the Presenter holds the View interface.)
    ref: "concepts.md#mvvm-model-view-viewmodel"
  - id: arch-ui-presentation-012
    difficulty: advanced
    tags: [mvvm, tradeoffs, debuggability]
    question: |
      Which is a well-known downside of MVVM's two-way data binding?
    options:
      - "It is structurally unable to separate the View from the domain Model"
      - "It requires hand-writing pure reducer functions for every state change"
      - "It actively prevents any clean designer-and-developer division of labor"
      - "Binding is 'magic' — hard to debug when it silently fails, and can be memory-leak-prone"
    answer: 3
    explanation: |
      MVVM trades glue code for binding 'magic': failures are hard to debug, dangling
      change-subscriptions can leak memory, and heavy bindings can hurt performance. It does
      enable a designer/developer split and testable ViewModels — those are pros, not cons.
    ref: "concepts.md#mvvm-model-view-viewmodel"
  - id: arch-ui-presentation-013
    difficulty: intermediate
    tags: [mvvm, frameworks, scenario]
    question: |
      A team is building a WPF desktop app with rich declarative XAML binding and wants
      testable presentation logic plus a designer/developer split. Which style fits best?
    options:
      - "MVVM"
      - "Classic Smalltalk MVC"
      - "PAC"
      - "Transaction Script"
    answer: 0
    explanation: |
      MVVM was created for exactly this (WPF/XAML): declarative two-way binding removes glue,
      the ViewModel is unit-testable, and designers can own the XAML while developers own the
      ViewModel. Transaction Script is a domain-logic pattern, not a presentation one.
    ref: "concepts.md#mvvm-model-view-viewmodel"
  - id: arch-ui-presentation-014
    difficulty: advanced
    tags: [mvu, elm, unidirectional]
    question: |
      In MVU (The Elm Architecture), the View is best described as what?
    options:
      - "A mutable object that observes the Model"
      - "A pure function of state that emits messages"
      - "A Presenter that pushes values into widgets"
      - "A store that holds all application state"
    answer: 1
    explanation: |
      MVU makes the View a pure function view(model) -> UI that emits messages on user
      action. An update(msg, model) -> newModel function produces the next immutable state,
      and the loop repeats — a strictly one-way, immutable flow.
    ref: "concepts.md#mvu-and-the-elm-architecture"
  - id: arch-ui-presentation-015
    difficulty: advanced
    tags: [mvu, testability, ilities]
    question: |
      Why does MVU generally offer the strongest unit-testability of UI logic?
    options:
      - "Because it relies on a two-way binding engine that mocks the widgets for you"
      - "Because it forbids having any Model at all, leaving nothing stateful to test"
      - "Because state transitions are pure functions (update/reducer) that are trivial to test"
      - "Because the View itself holds all the logic and can be exercised in isolation"
    answer: 2
    explanation: |
      In MVU the logic lives in pure update functions: given (msg, model) they return a new
      model with no side effects, so they are trivially testable and support deterministic
      replay / time-travel debugging. Pure functions beat mockable Views/ViewModels for testability.
    ref: "concepts.md#mvu-and-the-elm-architecture"
  - id: arch-ui-presentation-016
    difficulty: advanced
    tags: [mvu, mvvm, differences]
    question: |
      How does MVU differ most fundamentally from MVVM?
    options:
      - "MVU discards the Model entirely, keeping only a View and a message loop"
      - "MVU mandates a dedicated Router component to own all navigation flow"
      - "MVVM is built on pure reducer functions, while MVU relies on Model observers"
      - "MVU uses one-way immutable state flow; MVVM uses two-way mutable binding"
    answer: 3
    explanation: |
      The core contrast is directionality and mutability: MVU is unidirectional over
      immutable state (Model→View→Msg→update→Model), while MVVM typically syncs mutable state
      two-way through a binding engine.
    ref: "concepts.md#mvu-and-the-elm-architecture"
  - id: arch-ui-presentation-017
    difficulty: intermediate
    tags: [flux, dispatcher, unidirectional]
    question: |
      What problem did Facebook's Flux architecture set out to solve?
    options:
      - "Cascading, unpredictable updates in large SPAs caused by two-way binding and cross-updating views"
      - "Slow server-side template rendering under heavy request concurrency"
      - "The absence of a clean designer-and-developer division of labor"
      - "Database sharding and read-replica routing for horizontal read scaling"
    answer: 0
    explanation: |
      Flux was Facebook's answer to cascading multi-store update bugs: it forces a single
      unidirectional dispatch (Action → Dispatcher → Store → View) so data flows one way and
      state changes are traceable.
    ref: "concepts.md#flux"
  - id: arch-ui-presentation-018
    difficulty: advanced
    tags: [flux, components, dispatcher]
    question: |
      In Flux, what is the role of the Dispatcher?
    options:
      - "It renders the View and pushes each value into the on-screen widgets"
      - "A single hub that broadcasts every Action to all Stores (supporting ordering via waitFor)"
      - "It holds the single immutable application state tree as the source of truth"
      - "It performs automatic two-way binding between the Stores and the widgets"
    answer: 1
    explanation: |
      The Dispatcher is a central hub: every Action is dispatched through it to all registered
      Stores, and waitFor lets stores order their updates. (A single immutable state tree is
      Redux's store; two-way binding is MVVM.)
    ref: "concepts.md#flux"
  - id: arch-ui-presentation-019
    difficulty: advanced
    tags: [redux, flux, differences]
    question: |
      How does Redux simplify Flux?
    options:
      - "It adds a second async-only dispatcher alongside the original so promises and thunks route through their own hub"
      - "It reintroduces MVVM-style two-way binding so the View can mutate store state directly without dispatching actions"
      - "It collapses to a single immutable store transformed only by pure reducer functions, dropping the dispatcher object"
      - "It removes the concept of actions entirely, letting components call reducer methods on the store by name instead"
    answer: 2
    explanation: |
      Redux keeps unidirectional flow but uses ONE store as the single source of truth, and
      state changes only through pure reducers (state, action) -> newState. There is no separate
      dispatcher object and no multiple stores to coordinate.
    ref: "concepts.md#redux"
  - id: arch-ui-presentation-020
    difficulty: advanced
    tags: [redux, debuggability, time-travel]
    question: |
      Which capability is a direct consequence of Redux's single serializable store and
      pure reducers?
    options:
      - "Automatic two-way widget-to-store data binding"
      - "Elimination of nearly all setup boilerplate"
      - "Built-in navigation and screen routing"
      - "Time-travel debugging, logging, and state hydration"
    answer: 3
    explanation: |
      Because the whole state is one serializable tree and transitions are pure, you can
      record/replay actions, log every transition, and hydrate state — hence time-travel
      debugging. The cost is boilerplate and awkward async/local state.
    ref: "concepts.md#redux"
  - id: arch-ui-presentation-021
    difficulty: advanced
    tags: [mvi, reactive, intent]
    question: |
      What defines Model-View-Intent (MVI)?
    options:
      - "A reactive stream cycle: intents map to a stream of immutable view-states the View renders"
      - "A dedicated Router-owned module that centralizes all navigation and screen-flow decisions"
      - "A single global mutable store shared across every screen and read directly by each View"
      - "A two-way declarative binding link kept in sync between the View and the domain Model"
    answer: 0
    explanation: |
      MVI (Cycle.js / reactive Android) models the UI as observable streams:
      intent → model (state reducer) → view (render) → intent. Each render gets one immutable
      view-state, making the UI deterministic and composable via stream operators.
    ref: "concepts.md#mvi-model-view-intent"
  - id: arch-ui-presentation-022
    difficulty: advanced
    tags: [mvi, tradeoffs, reactive]
    question: |
      What is the main cost of adopting MVI?
    options:
      - "It is structurally unable to produce or maintain immutable state"
      - "A steep reactive-programming learning curve and verbose state classes"
      - "It tightly couples the View directly to the domain Model layer"
      - "It makes presentation logic essentially impossible to unit-test"
    answer: 1
    explanation: |
      MVI's determinism and composability come with a steep RxJS/RxJava learning curve,
      verbose state classes, and subtle stream lifecycle/back-pressure issues.
    ref: "concepts.md#mvi-model-view-intent"
  - id: arch-ui-presentation-023
    difficulty: expert
    tags: [pac, posa, hierarchy]
    question: |
      PAC (Presentation-Abstraction-Control) structures a UI as what?
    options:
      - "A single flat triad in which the View directly observes and re-renders from the Model"
      - "A single immutable state store transformed only by pure reducer functions"
      - "A hierarchy of cooperating agents, each with its own Presentation, Abstraction, and Control"
      - "A View bound two-way to an observable ViewModel via a binding engine"
    answer: 2
    explanation: |
      PAC (POSA vol 1) composes the UI from a tree of agents. Each agent has Presentation
      (its UI), Abstraction (its data), and Control (mediation + inter-agent communication).
      This isolates large, semi-independent subsystems.
    ref: "concepts.md#pac-presentation-abstraction-control"
  - id: arch-ui-presentation-024
    difficulty: expert
    tags: [pac, mvc, differences]
    question: |
      A key structural difference between PAC and classic MVC is that in PAC:
      the agent's Presentation and Abstraction ...
    options:
      - "are actually collapsed into one and the same object"
      - "are bound together two-way through a framework-provided binder"
      - "are both merged directly into a single shared Controller"
      - "never communicate directly — all communication goes through Control"
    answer: 3
    explanation: |
      In PAC, Presentation and Abstraction are decoupled: they never talk directly; the
      Control component mediates between them and handles communication up/down the agent
      hierarchy. Classic MVC, by contrast, permits a direct View↔Model link.
    ref: "concepts.md#pac-presentation-abstraction-control"
  - id: arch-ui-presentation-025
    difficulty: advanced
    tags: [presentation-model, mvvm, differences]
    question: |
      How does Fowler's Presentation Model relate to MVVM?
    options:
      - "MVVM is essentially Presentation Model plus automatic platform data-binding; Presentation Model syncs manually"
      - "They are entirely unrelated patterns that share no common lineage or design goal"
      - "Presentation Model mandates a dedicated Router for navigation whereas MVVM has no such component"
      - "Presentation Model drives updates with pure reducers while MVVM relies purely on Model observers"
    answer: 0
    explanation: |
      A Presentation Model is a framework-agnostic object holding the View's logical state and
      behavior, mirrored by a thin View — but you write the sync code by hand. MVVM is that
      idea wired to a platform binding engine that automates the synchronization.
    ref: "concepts.md#presentation-model"
  - id: arch-ui-presentation-026
    difficulty: advanced
    tags: [presentation-model, tradeoffs]
    question: |
      What is the main cost of the plain Presentation Model (vs MVVM)?
    options:
      - "It is framework-bound and therefore cannot be unit-tested in isolation"
      - "It requires manual synchronization code between the View and the model"
      - "It couples the domain Model directly to specific concrete UI widgets"
      - "It depends on a single global state store shared across every screen"
    answer: 1
    explanation: |
      The Presentation Model is framework-independent and testable, but because it assumes no
      binding engine, you must hand-write the sync code that keeps the View mirroring the
      model — exactly the glue MVVM automates.
    ref: "concepts.md#presentation-model"
  - id: arch-ui-presentation-027
    difficulty: advanced
    tags: [mva, mvc, decoupling]
    question: |
      What most distinguishes Model-View-Adapter (MVA) from classic MVC?
    options:
      - "MVA drops the Controller-equivalent entirely, letting the View drive the Model on its own"
      - "MVA is built on immutable state transformed exclusively by pure reducer functions"
      - "In MVA the View and Model never reference each other — ALL communication is routed through the Adapter"
      - "MVA mandates a two-way declarative binding engine to keep the View and Model in sync"
    answer: 2
    explanation: |
      MVA is a mediating-controller form of MVC: it forbids the View↔Model edge that classic
      MVC allows and forces everything through the Adapter, giving a linear
      View ↔ Adapter ↔ Model topology and full View/Model decoupling.
    ref: "concepts.md#model-view-adapter-mva"
  - id: arch-ui-presentation-028
    difficulty: advanced
    tags: [mva, tradeoffs, god-object]
    question: |
      What risk does the strict mediation in MVA introduce?
    options:
      - "The domain Model becomes directly coupled to concrete UI widgets"
      - "The View accumulates too much of the application's business logic"
      - "Application state becomes globally mutable and shared across all screens"
      - "The Adapter becomes a bottleneck / god-object carrying all the mapping logic"
    answer: 3
    explanation: |
      Because the Adapter is the sole conduit between a decoupled View and Model, it tends to
      accumulate all mapping/transformation logic and can grow into a god-object bottleneck.
    ref: "concepts.md#model-view-adapter-mva"
  - id: arch-ui-presentation-029
    difficulty: advanced
    tags: [viper, mobile, massive-view-controller]
    question: |
      VIPER was popularized to solve which specific pain in native mobile (iOS) apps?
    options:
      - "The 'Massive View Controller' — one class doing views, navigation, networking, and business logic"
      - "Slow cross-region database replication under heavy mobile write traffic"
      - "The absence of an automatic two-way binding engine in the UI toolkit"
      - "Server-side template rendering bloat degrading page-load latency"
    answer: 0
    explanation: |
      VIPER splits a screen into View, Interactor (use cases), Presenter, Entity, and Router
      (navigation), enforcing single responsibility to break up the 'Massive View Controller'
      that MVC tends toward in large mobile apps.
    ref: "concepts.md#viper-view-interactor-presenter-entity-router"
  - id: arch-ui-presentation-030
    difficulty: expert
    tags: [viper, components, router]
    question: |
      In VIPER, which component owns navigation and screen-flow / module assembly?
    options:
      - "The Interactor, which houses the use-case business logic"
      - "The Router (wireframe)"
      - "The Entity, which represents plain domain data objects"
      - "The View, which passively displays what it is told"
    answer: 1
    explanation: |
      The Router (a.k.a. wireframe) owns navigation and module assembly. The Interactor holds
      use-case business logic, the Presenter prepares display data, Entities are plain domain
      objects, and the View is passive.
    ref: "concepts.md#viper-view-interactor-presenter-entity-router"
  - id: arch-ui-presentation-031
    difficulty: expert
    tags: [viper, clean-architecture, differences]
    question: |
      How is VIPER best characterized relative to Clean/Hexagonal architecture?
    options:
      - "It is an unrelated pattern that shares no principles with Clean Architecture"
      - "It supersedes and replaces Clean Architecture at the whole-system level"
      - "It applies Clean/Hexagonal layering (use-case Interactor, boundaries) at the per-screen module level"
      - "It is fundamentally a database-tier persistence and data-access pattern"
    answer: 2
    explanation: |
      VIPER derives from Clean/Hexagonal ideas — the Interactor is a use-case boundary — but
      applies that layering at the granularity of a single screen module rather than the whole
      application.
    ref: "concepts.md#viper-view-interactor-presenter-entity-router"
  - id: arch-ui-presentation-032
    difficulty: advanced
    tags: [viper, tradeoffs, boilerplate]
    question: |
      When is VIPER the WRONG choice?
    options:
      - "For large, long-lived apps with many screens and multiple contributing teams"
      - "When you specifically need high unit-testability of presentation logic"
      - "When you want navigation and screen-flow decoupled into its own component"
      - "For small apps or prototypes, where its five-component boilerplate is overkill"
    answer: 3
    explanation: |
      VIPER's testability and modularity come with very high boilerplate and file-count. For
      small apps or prototypes that overhead isn't justified — MVC/MVVM is far cheaper. It
      shines in large, multi-team codebases.
    ref: "concepts.md#viper-view-interactor-presenter-entity-router"
  - id: arch-ui-presentation-033
    difficulty: advanced
    tags: [coordinator, mvvm-c, navigation]
    question: |
      What problem does adding a Coordinator (MVVM-C / MVP-C) solve?
    options:
      - "It extracts navigation/flow ownership out of ViewModels/Presenters so they stay navigation-agnostic"
      - "It bolts a two-way declarative binding engine onto the otherwise one-way MVU loop"
      - "It merges the Model and View into a single combined presentation object"
      - "It swaps out pure reducer functions in favor of Model-observing subscriptions"
    answer: 0
    explanation: |
      Without a Coordinator, the ViewModel/Presenter often ends up deciding 'which screen
      comes next,' coupling screens together. The Coordinator owns navigation, so screens
      report intent and the Coordinator decides transitions — enabling reusable flows.
    ref: "concepts.md#mvvm-c-and-the-coordinator-pattern"
  - id: arch-ui-presentation-034
    difficulty: advanced
    tags: [coordinator, viper, router, differences]
    question: |
      How does a Coordinator relate to VIPER's Router?
    options:
      - "They are entirely unrelated concepts serving different architectural layers"
      - "The Coordinator plays essentially the same navigation-owning role as VIPER's Router, but bolted onto MVVM/MVP"
      - "The Coordinator holds all the app's business logic while the Router holds none of it"
      - "The Router is an immutable state store and the Coordinator is its pure reducer"
    answer: 1
    explanation: |
      Coordinator ≈ Router: both extract navigation into a dedicated object. VIPER bakes the
      Router into a five-part module, whereas MVVM-C/MVP-C add the Coordinator onto an existing
      MVVM/MVP structure.
    ref: "concepts.md#mvvm-c-and-the-coordinator-pattern"
  - id: arch-ui-presentation-035
    difficulty: advanced
    tags: [hmvc, composition, reuse]
    question: |
      What does Hierarchical MVC (HMVC) let you do?
    options:
      - "Store all application state in one central immutable state tree"
      - "Bind on-screen widgets two-way to an observable ViewModel object"
      - "Compose a page from independent, self-contained MVC triads (widgets), each reusable and independently testable"
      - "Route all View↔Model traffic through a single mediating adapter"
    answer: 2
    explanation: |
      HMVC composes a page from many self-contained MVC triads. A parent view dispatches
      sub-requests to child triads that render their own fragments, enabling reusable widgets
      and parallel team work — at the cost of nested-request overhead.
    ref: "concepts.md#hierarchical-mvc-hmvc"
  - id: arch-ui-presentation-036
    difficulty: expert
    tags: [hmvc, pac, differences]
    question: |
      How does HMVC differ from PAC, given both are hierarchical?
    options:
      - "HMVC is actually a flat, non-hierarchical single-triad structure"
      - "PAC is built on immutable state while HMVC transforms state with pure reducers"
      - "HMVC mandates a two-way binding engine whereas PAC explicitly forbids any binding"
      - "HMVC triads still allow View↔Model reads and communicate via controllers/sub-requests; PAC fully decouples Presentation and Abstraction through dedicated Control agents"
    answer: 3
    explanation: |
      Both are hierarchical, but HMVC nests ordinary MVC triads (which permit View↔Model reads
      and coordinate through controllers/sub-requests), while PAC decouples each agent's
      Presentation and Abstraction entirely and routes coordination through Control agents.
    ref: "concepts.md#hierarchical-mvc-hmvc"
  - id: arch-ui-presentation-037
    difficulty: intermediate
    tags: [mvw, pragmatism, angular]
    question: |
      "Model-View-Whatever" (MVW) is best understood as what?
    options:
      - "A pragmatic framing acknowledging that modern frameworks blur MVC/MVP/MVVM — favor separation of concerns over dogmatic labels"
      - "A strict, prescriptive architecture with a fixed topology and a mandated three-component layout you must follow exactly"
      - "A navigation-only pattern that owns routing and all screen-flow transition decisions for the whole application"
      - "A single-store state-management library built around one immutable tree mutated only by pure reducer functions"
    answer: 0
    explanation: |
      MVW (coined by the AngularJS team) is a discussion framing, not a spec: it says the exact
      three-letter label matters less than achieving separation of concerns, since real
      frameworks land at various points on the MVC–MVVM–MVU spectrum.
    ref: "concepts.md#model-view-whatever-mvw"
  - id: arch-ui-presentation-038
    difficulty: intermediate
    tags: [mvw, tradeoffs]
    question: |
      What is the main drawback of MVW as a concept?
    options:
      - "It forces excessive per-screen boilerplate — a mandatory interface plus manual wiring for every view"
      - "It is vague — it offers no concrete structure or guarantees you can implement"
      - "It couples the domain Model directly to concrete View widgets, defeating separation of concerns"
      - "It requires a reactive-streams library (RxJS/RxJava) and observable back-pressure handling to work"
    answer: 1
    explanation: |
      MVW is pragmatic but vague: it is a mindset, not an architecture, so it gives no
      prescribed structure. When you need a concrete, testable, prescribed layout, pick a real
      style (MVVM, MVU, etc.).
    ref: "concepts.md#model-view-whatever-mvw"
  - id: arch-ui-presentation-039
    difficulty: advanced
    tags: [humble-object, testability, passive-view]
    question: |
      What is the Humble Object pattern, and how does it relate to Passive View?
    options:
      - "A single-store state pattern; Passive View is just a specialized immutable store read directly by the framework"
      - "A navigation pattern that owns routing and screen-flow; Passive View is the component that decides transitions"
      - "It pushes logic out of a hard-to-test framework edge into a testable companion object; Passive View is Humble Object applied to the View"
      - "A two-way declarative binding engine; Passive View is the observable object that the widgets bind against"
    answer: 2
    explanation: |
      Humble Object leaves only a thin, logic-free shell touching the framework and moves all
      behavior into a testable companion. Passive View is precisely this idea applied to the
      View — MVP/MVVM/MVU all rely on the same testability principle.
    ref: "concepts.md#humble-object"
  - id: arch-ui-presentation-040
    difficulty: intermediate
    tags: [humble-object, ilities, testing]
    question: |
      Which -ility does the Humble Object pattern primarily optimize?
    options:
      - "Deployability — packaging and shipping the UI subsystem to target hosts and containers"
      - "Network throughput — reducing round-trips and payload size between the client and server"
      - "Horizontal scalability — spreading presentation work across many stateless UI instances"
      - "Testability (unit-testing edge/UI logic without the real framework)"
    answer: 3
    explanation: |
      Humble Object exists to make hard-to-test boundaries (UI views, message handlers,
      hardware adapters) testable by extracting their logic into a plain object that depends
      only on abstractions. The cost is a little indirection per edge.
    ref: "concepts.md#humble-object"
  - id: arch-ui-presentation-041
    difficulty: intermediate
    tags: [comparison, data-binding-direction]
    question: |
      Along the "data-binding direction" axis, which mapping is correct?
    options:
      - "MVVM = two-way (or one-way); MVU/Redux = one-way (unidirectional)"
      - "MVVM = strictly one-way declarative binding only; MVU = two-way mutable binding through the widgets"
      - "MVC = automatic two-way binding engine; MVP = pure reducer functions over immutable state"
      - "MVP = framework-automatic two-way binding; MVVM = manual push of each property into the View"
    answer: 0
    explanation: |
      MVVM typically uses two-way (sometimes one-way) declarative binding; MVU/Flux/Redux are
      strictly unidirectional. MVC/MVP use manual/observer-based updates (the Presenter pushes
      in MVP; the View observes in classic MVC).
    ref: "concepts.md#mvc-vs-mvp-vs-mvvm-vs-mvu"
  - id: arch-ui-presentation-042
    difficulty: intermediate
    tags: [comparison, where-logic-lives]
    question: |
      Where does presentation logic live in MVC vs MVP vs MVVM vs MVU respectively?
    options:
      - "View / Model / Router / Store (each layer owns the presentation logic in turn)"
      - "Controller / Presenter / ViewModel / Update (reducer) functions"
      - "Model / View / Controller / Adapter (the domain layer holds the display logic)"
      - "Dispatcher / Store / Entity / Interactor (the central hub owns rendering decisions)"
    answer: 1
    explanation: |
      MVC → Controller; MVP → Presenter (all of it); MVVM → ViewModel; MVU/Redux → update/
      reducer functions. This is the core "where does UI logic live" axis of the comparison.
    ref: "concepts.md#mvc-vs-mvp-vs-mvvm-vs-mvu"
  - id: arch-ui-presentation-043
    difficulty: advanced
    tags: [comparison, testability-ranking]
    question: |
      Ranking unit-testability of UI logic from strongest to weakest, which order is right?
    options:
      - "Classic MVC > MVVM > MVP > MVU"
      - "MVP > classic MVC > MVU > MVVM"
      - "MVU/Redux (pure functions) > MVP/MVVM (mockable View / testable ViewModel) > classic MVC (View-coupled)"
      - "They are all exactly equally testable because every style ultimately isolates presentation logic behind an interface"
    answer: 2
    explanation: |
      Pure functions (MVU/Redux) are the easiest to test; MVP (mock the View) and MVVM (test
      the ViewModel) are strong; classic MVC is weakest because the View is coupled to the Model.
    ref: "concepts.md#mvc-vs-mvp-vs-mvvm-vs-mvu"
  - id: arch-ui-presentation-044
    difficulty: intermediate
    tags: [comparison, where-it-dominates, scenario]
    question: |
      Which style historically dominates server-rendered web frameworks like Rails,
      Spring MVC, and ASP.NET MVC?
    options:
      - "MVVM, driven by the framework's declarative two-way binding of templates to view models"
      - "VIPER, splitting each request into View, Interactor, Presenter, Entity, and Router modules"
      - "MVI, with request intents flowing through reactive streams into immutable view-states"
      - "MVC (Model 2 / Front + Page Controller)"
    answer: 3
    explanation: |
      Server web frameworks use the MVC/Model-2 lineage: a Front Controller routes requests,
      updates the Model, and renders a template View. MVVM dominates binding-rich client
      frameworks; VIPER/MVI are mobile/reactive-client styles.
    ref: "concepts.md#mvc-vs-mvp-vs-mvvm-vs-mvu"
  - id: arch-ui-presentation-045
    difficulty: expert
    tags: [unidirectional, evolution, debuggability]
    question: |
      The lineage MVU → Flux → Redux → MVI is best understood as a reaction against what?
    options:
      - "The debuggability problems of MVVM-style two-way binding (hard to answer 'what changed the state?')"
      - "Server-side template rendering being too slow to keep up with heavy request concurrency"
      - "The lack of a dedicated Router in classic MVC, forcing navigation logic into the Controller"
      - "Excessive testability boilerplate in MVP, where every screen needs a mockable View interface"
    answer: 0
    explanation: |
      With two-way binding a change can originate in the View or Model and ripple either way,
      making 'what changed this?' hard to answer. Unidirectional flow (action → reducer → new
      immutable state → re-render) restores traceability, enabling time-travel debugging.
    ref: "concepts.md#unidirectional-data-flow-the-modern-web-evolution"
  - id: arch-ui-presentation-046
    difficulty: advanced
    tags: [unidirectional, tradeoffs, performance]
    question: |
      What is the main cost of unidirectional immutable-state architectures, and how do
      frameworks mitigate it?
    options:
      - "They cannot be unit-tested at all; frameworks work around this by auto-generating widget mocks"
      - "Ceremony/boilerplate and full-state re-render overhead; mitigated by diffing / virtual-DOM and structural sharing"
      - "They tightly couple the View to the domain Model; mitigated by inserting mediating adapter objects"
      - "They require a backing database for every state change; mitigated by an in-memory caching layer"
    answer: 1
    explanation: |
      Unidirectional/immutable models add ceremony and can incur re-render/immutability
      overhead. Frameworks mitigate this with diffing (virtual DOM) and structural sharing of
      immutable data so only changed parts re-render.
    ref: "concepts.md#unidirectional-data-flow-the-modern-web-evolution"
  - id: arch-ui-presentation-047
    difficulty: expert
    tags: [scenario, redux, mvvm, tradeoffs]
    question: |
      A large SPA has substantial shared state, and the team keeps hitting bugs where they
      can't tell what mutated the UI into a bad state; they want reproducible, serializable
      state and time-travel debugging. Which fits best, and why not the alternative?
    options:
      - "MVVM, because its two-way declarative binding automatically records every property change into a replayable log"
      - "Classic MVC, because the View observes the Model and thereby captures each mutation as a serializable event"
      - "Redux, because a single immutable store + pure reducers gives reproducible, serializable, time-travel-debuggable state — whereas MVVM's two-way binding is what made 'what changed?' hard"
      - "PAC, because isolating subsystems into agent hierarchies makes each agent's state trivially serializable and replayable"
    answer: 2
    explanation: |
      The requirements (reproducible/serializable state, time-travel debugging, answering
      'what changed?') are exactly Redux's strengths via one store + pure reducers. MVVM's
      two-way binding is the debuggability problem they are trying to escape.
    ref: "concepts.md#redux"
  - id: arch-ui-presentation-048
    difficulty: expert
    tags: [scenario, mvp, viper, mvvm]
    question: |
      A legacy WinForms app has weak data-binding support but the team needs to unit-test
      presentation logic and possibly swap the UI toolkit later. Which style fits best?
    options:
      - "MVVM, because WinForms ships a strong two-way binding engine that keeps view models in sync automatically"
      - "Redux, because a single immutable store with pure reducers is the natural fit for a data-bound desktop form"
      - "MVI, because its reactive intent streams map cleanly onto WinForms event handlers with no extra glue"
      - "MVP, because a mockable View interface gives testability and view-independence without needing binding"
    answer: 3
    explanation: |
      MVP shines exactly here: on widget stacks with weak binding (classic WinForms/GWT/early
      Android), the View interface makes presentation logic testable and the UI swappable.
      MVVM would need the binding engine the platform lacks.
    ref: "concepts.md#mvp-model-view-presenter"
  - id: arch-ui-presentation-049
    difficulty: intermediate
    tags: [altitude, gof, cross-reference]
    question: |
      Why are these presentation styles considered a different altitude from GoF patterns
      like Observer, Mediator, and Command?
    options:
      - "Presentation styles are compositional patterns for an entire presentation subsystem and internally USE GoF patterns (e.g. Observer, Mediator, Command)"
      - "GoF patterns are exclusively about database access, persistence mapping, and query construction"
      - "GoF patterns cannot be unit-tested because they operate below the level of any injectable interface"
      - "Presentation styles are really deployment topologies describing how UI hosts are provisioned and scaled"
    answer: 0
    explanation: |
      Presentation architectures structure a whole subsystem and lean on GoF patterns inside
      (classic MVC uses Observer; MVA uses Mediator; commands power MVVM/Flux). GoF patterns
      are single-responsibility, class-level building blocks — a lower altitude.
    ref: "concepts.md#mvc-model-view-controller"
  - id: arch-ui-presentation-050
    difficulty: advanced
    tags: [cross-reference, dedup, dp-enterprise-application]
    question: |
      According to this topic's de-dup rule, where does the pattern-catalog DEEP DIVE for
      MVC/MVP/MVVM/MVU, Presentation Model, and Humble Object live?
    options:
      - "event-driven-cqrs-saga-cdc"
      - "dp-enterprise-application"
      - "message-queues-and-async"
      - "databases-sql-nosql-sharding-replication"
    answer: 1
    explanation: |
      Those presentation patterns are cataloged as PoEAA/GUI-Architectures entries in
      dp-enterprise-application. This arch-ui-presentation topic keeps only the architectural
      comparison (coupling, binding direction, testability, where each dominates).
    ref: "concepts.md#mvc-vs-mvp-vs-mvvm-vs-mvu"
