topic: "Structural Design Patterns"
domain: system-design
topic_slug: dp-structural
version: 1
questions:
  - id: dp-structural-001
    difficulty: beginner
    tags:
      - fundamentals
      - structural
      - definition
    question: |
      What do structural design patterns primarily concern themselves with?
    options:
      - How classes and objects are composed to form larger structures
      - How objects are instantiated and by which factory or builder
      - How responsibilities are assigned and objects communicate at runtime
      - How to guarantee exactly one instance of a class
    answer: 0
    explanation: |
      Structural patterns deal with how classes and objects are composed into
      larger, flexible structures. Instantiation is the concern of creational
      patterns; communication/responsibility is behavioral; single-instance is
      the Singleton (creational) pattern.
    ref: concepts.md#structural-design-patterns
  - id: dp-structural-002
    difficulty: beginner
    tags:
      - class-based
      - object-based
      - composition
    question: |
      What distinguishes an object-based structural pattern from a class-based one?
    options:
      - Object-based patterns use inheritance resolved at compile time
      - Object-based patterns use composition/delegation resolved at runtime
      - Object-based patterns can only compose exactly one class
      - Object-based patterns cannot be reconfigured after construction
    answer: 1
    explanation: |
      Object-based structural patterns compose via delegation (one object holds a
      reference to another) and are resolved at runtime, making them flexible and
      reconfigurable. Class-based patterns use inheritance, are fixed at compile
      time, and (in single-inheritance languages) can compose only one class.
    ref: concepts.md#structural-design-patterns
  - id: dp-structural-003
    difficulty: intermediate
    tags:
      - adapter
      - object-adapter
      - class-adapter
    question: |
      Which is TRUE of an Object Adapter compared to a Class Adapter?
    options:
      - It uses inheritance and can override adaptee behavior
      - It requires multiple inheritance in every language
      - It uses composition and can adapt the adaptee and its subclasses
      - It can adapt only a single concrete class and never its subclasses
    answer: 2
    explanation: |
      An Object Adapter holds a reference to the adaptee (composition) and
      delegates, so it can adapt the adaptee and any of its subclasses and swap
      instances at runtime. The Class Adapter uses inheritance, can override
      adaptee behavior, but is limited to one concrete class.
    ref: concepts.md#adapter
  - id: dp-structural-004
    difficulty: beginner
    tags:
      - adapter
      - intent
    question: |
      You must integrate a third-party class whose method names and signatures
      don't match what your client code expects, and you cannot modify that class.
      Which pattern fits?
    options:
      - Facade
      - Decorator
      - Flyweight
      - Adapter
    answer: 3
    explanation: |
      Adapter converts the interface of an existing class into the interface a
      client expects, letting incompatible interfaces collaborate without changing
      either side. Facade simplifies a subsystem, Decorator adds behavior, and
      Flyweight shares state.
    ref: concepts.md#adapter
  - id: dp-structural-005
    difficulty: intermediate
    tags:
      - adapter
      - vs-facade
    question: |
      What is the key difference between Adapter and Facade?
    options:
      - Adapter converts one interface into a specific required one; Facade defines a new simpler interface
        over many classes
      - Adapter adds new behavior to a class; Facade strips behavior away from the subsystem
      - Adapter can only be wired up at runtime; Facade can only be assembled statically at compile time
      - Adapter is a behavioral pattern about messaging; Facade is a creational instantiation pattern
    answer: 0
    explanation: |
      An Adapter makes one existing interface match a specific interface the client
      requires. A Facade invents a new, simpler interface over many subsystem
      classes; the interface is not dictated by any particular client. Both are
      structural.
    ref: concepts.md#adapter
  - id: dp-structural-006
    difficulty: intermediate
    tags:
      - adapter
      - real-world
    question: |
      Which standard-library element is a classic example of the Adapter pattern?
    options:
      - BufferedInputStream wrapping FileInputStream to add read buffering
      - InputStreamReader converting a byte stream into a character stream
      - Integer.valueOf caching and sharing small boxed integer instances
      - java.lang.reflect.Proxy generating dynamic access-controlling proxies
    answer: 1
    explanation: |
      InputStreamReader adapts a byte-oriented InputStream to the character-oriented
      Reader interface. BufferedInputStream is a Decorator, Integer.valueOf is a
      Flyweight, and reflect.Proxy is a Proxy.
    ref: concepts.md#adapter
  - id: dp-structural-007
    difficulty: beginner
    tags:
      - bridge
      - intent
    question: |
      What problem does the Bridge pattern primarily solve?
    options:
      - Guaranteeing thread-safe lazy initialization of a single shared instance
      - Reducing memory footprint when instantiating large numbers of near-identical objects
      - A combinatorial class explosion caused by two independent dimensions of variation
      - Controlling and gating access to an expensive or remote object behind a surrogate
    answer: 2
    explanation: |
      Bridge decouples an abstraction from its implementation so the two dimensions
      can vary independently, turning an M x N inheritance explosion into M + N
      classes. Memory sharing is Flyweight; access control is Proxy.
    ref: concepts.md#bridge
  - id: dp-structural-008
    difficulty: intermediate
    tags:
      - bridge
      - class-count
    question: |
      With 4 abstractions and 3 implementations, roughly how many classes does
      Bridge require versus modeling every combination by inheritance?
    options:
      - 12 with Bridge (4 x 3) versus 7 with inheritance (4 + 3)
      - 1 unified Bridge class versus 12 with inheritance (4 x 3)
      - 12 in both cases, since Bridge still needs every combination
      - 7 with Bridge (4 + 3) versus 12 with inheritance (4 x 3)
    answer: 3
    explanation: |
      Bridge splits into two hierarchies joined by composition, so you need 4 + 3 = 7
      classes. Modeling each combination via subclassing needs 4 x 3 = 12 classes,
      the Cartesian-product explosion Bridge avoids.
    ref: concepts.md#bridge
  - id: dp-structural-009
    difficulty: advanced
    tags:
      - bridge
      - vs-adapter
    question: |
      Which statement best captures Bridge versus Adapter?
    options:
      - Bridge is designed up front to let two hierarchies vary; Adapter is retrofitted to reconcile existing
        incompatible interfaces
      - Both are retrofitted after the fact to reconcile pre-existing, incompatible code paths
      - Bridge converts one interface into another; Adapter is what splits two varying dimensions apart
      - Bridge is a behavioral pattern about algorithms; Adapter is the only structural one of the two
    answer: 0
    explanation: |
      Bridge is a planned, up-front architecture that lets abstraction and
      implementation evolve independently. Adapter is applied after the fact to make
      already-existing, incompatible interfaces work together. Both are structural.
    ref: concepts.md#bridge
  - id: dp-structural-010
    difficulty: advanced
    tags:
      - bridge
      - vs-strategy
    question: |
      Bridge and Strategy can share nearly identical UML. What separates them?
    options:
      - Bridge relies on inheritance for reuse while Strategy relies purely on composition
      - Bridge is structural and spans two dimensions; Strategy is behavioral and swaps one interchangeable
        algorithm
      - Strategy guarantees exactly one instance exists; Bridge places no such constraint at all
      - Bridge converts an interface to a new one; Strategy hides a whole subsystem behind a facade
    answer: 1
    explanation: |
      The structures look the same, but intent differs: Bridge (structural) is about
      the overall shape and letting two dimensions vary independently, while Strategy
      (behavioral) swaps a single interchangeable algorithm.
    ref: concepts.md#bridge
  - id: dp-structural-011
    difficulty: intermediate
    tags:
      - bridge
      - real-world
    question: |
      Which is a real-world example of Bridge?
    options:
      - java.io buffered streams stacking layered behavior over a base stream
      - The String intern pool sharing one canonical instance per literal value
      - 'JDBC: the java.sql API is the abstraction and each vendor Driver is the implementor'
      - HttpServletRequestWrapper transparently adding extra request-processing behavior
    answer: 2
    explanation: |
      JDBC separates the abstraction (java.sql API used by clients) from the
      implementation (vendor Driver behind DriverManager), letting each vary
      independently — a Bridge. The others are Decorator and Flyweight examples.
    ref: concepts.md#bridge
  - id: dp-structural-012
    difficulty: beginner
    tags:
      - composite
      - intent
    question: |
      Which situation is the natural fit for the Composite pattern?
    options:
      - Adding optional, stackable behaviors to a single object dynamically at runtime
      - Providing a local placeholder stand-in that marshals calls to a remote object
      - Sharing immutable intrinsic state among millions of fine-grained objects to save memory
      - Representing a part-whole tree and treating individual objects and groups uniformly
    answer: 3
    explanation: |
      Composite composes objects into tree structures and lets clients treat leaves
      and containers uniformly through one interface. Runtime behavior addition is
      Decorator; remote stand-in is Proxy; state sharing is Flyweight.
    ref: concepts.md#composite
  - id: dp-structural-013
    difficulty: advanced
    tags:
      - composite
      - transparency-safety
    question: |
      In Composite, what is the "transparency vs. safety" tension?
    options:
      - Putting add/remove on the shared Component interface (uniform but leaves get meaningless methods)
        versus only on Composite (type-safe but loses uniformity)
      - Whether to cache each node's child references or recompute them on every traversal
      - Whether children are stored in an ordered list or a hash-keyed map for lookup
      - Whether the composite tree is fully immutable or allows mutation after construction
    answer: 0
    explanation: |
      Declaring child-management on the shared Component interface gives transparent,
      uniform treatment but forces leaves to implement meaningless add/remove.
      Restricting those methods to Composite is safer/type-checked but the client
      loses uniform treatment and must downcast.
    ref: concepts.md#composite
  - id: dp-structural-014
    difficulty: intermediate
    tags:
      - composite
      - vs-decorator
    question: |
      Both Composite and Decorator use recursive composition. What's the key
      difference?
    options:
      - Composite converts the component interface to a new one; Decorator leaves it unchanged
      - Composite aggregates many children and combines their results; Decorator wraps exactly one component
        to add behavior
      - Composite is a behavioral tree-traversal pattern; Decorator is the only structural one
      - Composite gates and controls access to nodes; Decorator simplifies a complex subsystem
    answer: 1
    explanation: |
      A Composite holds many children and aggregates/sums their results across a tree.
      A Decorator wraps exactly one component to add behavior. Both share an interface
      with their children, which is why they look similar.
    ref: concepts.md#composite
  - id: dp-structural-015
    difficulty: intermediate
    tags:
      - composite
      - real-world
    question: |
      Which is a real-world example of Composite?
    options:
      - Spring JdbcTemplate wrapping the raw JDBC subsystem behind simple methods
      - An RMI stub acting as a local stand-in for a remote object
      - The browser DOM tree of nodes and child nodes
      - Integer.valueOf caching shared boxed values for small integers
    answer: 2
    explanation: |
      The DOM is a part-whole tree where elements contain child nodes and are treated
      uniformly — a Composite. JdbcTemplate is a Facade, RMI stubs are Proxies, and
      Integer caching is Flyweight.
    ref: concepts.md#composite
  - id: dp-structural-016
    difficulty: beginner
    tags:
      - decorator
      - intent
    question: |
      You need to add responsibilities to individual objects dynamically at runtime,
      in arbitrary combinations, without a subclass explosion. Which pattern fits?
    options:
      - Bridge
      - Facade
      - Composite
      - Decorator
    answer: 3
    explanation: |
      Decorator attaches responsibilities by wrapping an object in decorators that
      share its interface and can be stacked in any order at runtime — a flexible
      alternative to subclassing for extending behavior.
    ref: concepts.md#decorator
  - id: dp-structural-017
    difficulty: intermediate
    tags:
      - decorator
      - canonical-example
    question: |
      What is the canonical Decorator example in the Java standard library?
    options:
      - java.io streams, e.g. new BufferedInputStream(new GZIPInputStream(new FileInputStream(f)))
      - Arrays.asList adapting a raw array to the fixed-size List interface it lacks
      - DriverManager resolving and handing back the correct vendor JDBC driver by URL
      - FacesContext exposing one simplified entry point over the JSF request subsystem
    answer: 0
    explanation: |
      java.io stacks decorators over a base stream (buffering, decompression, etc.),
      each sharing the stream interface. Arrays.asList is Adapter, JDBC is Bridge, and
      FacesContext is a Facade.
    ref: concepts.md#decorator
  - id: dp-structural-018
    difficulty: advanced
    tags:
      - decorator
      - gotchas
      - identity
    question: |
      Which is a genuine drawback of the Decorator pattern?
    options:
      - It rigidly guarantees that only one wrapped instance can ever exist at a time
      - It produces many small look-alike objects, behavior can be order-sensitive, and object identity
        (==/equals) breaks
      - It structurally prevents you from combining wrapped behaviors together at runtime
      - It changes the wrapped object's interface into a new one, breaking existing clients
    answer: 1
    explanation: |
      Deep decorator stacks are hard to debug, ordering can matter (compress-then-
      encrypt != encrypt-then-compress), and the wrapper is not identity-equal to the
      wrapped object, breaking identity checks. Decorator keeps the interface and does
      allow runtime combination.
    ref: concepts.md#decorator
  - id: dp-structural-019
    difficulty: advanced
    tags:
      - decorator
      - vs-proxy
    question: |
      Decorator and Proxy have essentially the same structure. What is the intent
      difference?
    options:
      - Decorator restricts and gates access to the wrapped subject, while Proxy exists only to add new
        stackable behavior chosen by the client
      - Decorator converts the wrapped object into a brand-new interface, while Proxy collapses many
        subsystem classes behind one simpler entry point
      - Decorator adds behavior and the client composes it; Proxy controls access and typically manages
        its own subject's lifecycle
      - Decorator is a creational pattern concerned with object instantiation, while Proxy is a behavioral
        pattern coordinating runtime messaging
    answer: 2
    explanation: |
      Both keep the subject's interface. A Decorator adds/extends behavior and is
      assembled by the client. A Proxy controls access (lazy, remote, protection,
      caching) and usually creates and manages its own subject while keeping behavior
      unchanged.
    ref: concepts.md#decorator
  - id: dp-structural-020
    difficulty: intermediate
    tags:
      - decorator
      - vs-adapter
    question: |
      How does Decorator differ from Adapter?
    options:
      - Decorator converts the wrapped object to a new required interface, whereas Adapter preserves the
        original interface untouched and merely forwards
      - Both convert the interface into a different one, but Decorator additionally aggregates many child
        components into a combined tree result
      - Decorator is a creational pattern about object instantiation, whereas Adapter is a structural
        pattern about composing existing types
      - Decorator keeps (or extends) the same interface and adds behavior; Adapter changes the interface
        to a required one and adds no behavior
    answer: 3
    explanation: |
      Decorator preserves (or extends) the component interface and adds behavior.
      Adapter changes an existing interface into a specific required one and does not
      add behavior — it only translates.
    ref: concepts.md#decorator
  - id: dp-structural-021
    difficulty: beginner
    tags:
      - facade
      - intent
    question: |
      What does the Facade pattern provide?
    options:
      - A single simplified higher-level interface to a complex subsystem
      - A surrogate that controls access to another object
      - A shared pool of immutable fine-grained objects
      - A tree structure of uniformly treated parts
    answer: 0
    explanation: |
      Facade offers one simplified interface over a complex subsystem, reducing the
      coupling and knowledge a client needs. Access control is Proxy, shared state is
      Flyweight, and trees are Composite.
    ref: concepts.md#facade
  - id: dp-structural-022
    difficulty: intermediate
    tags:
      - facade
      - gotchas
    question: |
      Which is a recognized downside of the Facade pattern?
    options:
      - It forcibly seals off the subsystem so clients can never call the underlying classes directly
      - It can become a bloated god object coupled to everything in the subsystem
      - It rewrites the subsystem's public interface, breaking every existing client that called it directly
      - It requires every class inside the wrapped subsystem to be made fully immutable first
    answer: 1
    explanation: |
      A facade can grow into a god object tightly coupled to the whole subsystem and
      become a bottleneck for change. It does NOT (and should not) forcibly block
      direct subsystem access; advanced clients can still bypass it.
    ref: concepts.md#facade
  - id: dp-structural-023
    difficulty: advanced
    tags:
      - facade
      - vs-mediator
    question: |
      How does a Facade differ from a Mediator?
    options:
      - A Facade centralizes bidirectional coordination among peers that call it, while a Mediator merely
        forwards one-way to a subsystem unaware of it
      - A Facade rewrites the subsystem's interface into a new one, while a Mediator preserves each
        colleague's existing interface unchanged
      - A Facade only forwards to a subsystem that doesn't know about it; a Mediator centralizes and coordinates
        peers that talk to it
      - They are identical in intent and interchangeable, differing only in which layer of the system
        they happen to appear in
    answer: 2
    explanation: |
      A Facade is one-directional: it forwards to subsystem classes that are unaware
      of it. A Mediator centralizes bidirectional coordination among peers (colleagues)
      that explicitly communicate through it.
    ref: concepts.md#facade
  - id: dp-structural-024
    difficulty: intermediate
    tags:
      - facade
      - real-world
    question: |
      Which is a real-world example of the Facade pattern?
    options:
      - Hibernate lazy-loading entity proxies that defer database hits until a field is first touched
      - The Integer boxed-value cache that shares one instance per small value in the -128..127 range
      - java.io BufferedInputStream layering read-ahead buffering on top of a wrapped byte stream
      - Spring JdbcTemplate over the raw JDBC subsystem
    answer: 3
    explanation: |
      JdbcTemplate wraps the verbose JDBC subsystem (connections, statements, result
      sets, exception handling) behind a few simple methods — a Facade. Hibernate
      lazy loading is Proxy, Integer cache is Flyweight, BufferedInputStream is
      Decorator.
    ref: concepts.md#facade
  - id: dp-structural-025
    difficulty: beginner
    tags:
      - flyweight
      - intent
    question: |
      What is the primary goal of the Flyweight pattern?
    options:
      - Minimize memory by sharing common state among many fine-grained objects
      - Simplify a complex subsystem by hiding its many classes behind one unified higher-level interface
      - Let an abstraction and its implementation hierarchy vary independently along two separate axes
      - Attach optional new responsibilities to individual objects dynamically at runtime by wrapping them
    answer: 0
    explanation: |
      Flyweight minimizes memory usage by sharing as much state as possible among a
      large number of similar objects, splitting state into intrinsic (shared) and
      extrinsic (passed in) parts.
    ref: concepts.md#flyweight
  - id: dp-structural-026
    difficulty: intermediate
    tags:
      - flyweight
      - intrinsic-extrinsic
    question: |
      In Flyweight, what is intrinsic state?
    options:
      - Context-dependent state that the client supplies as arguments on each and every operation call
      - Context-independent, shareable, immutable state stored inside the flyweight
      - Transient state that must be recomputed from scratch on every access and is never stored anywhere
      - The client's mutable per-instance state that changes freely and differs for every single object
    answer: 1
    explanation: |
      Intrinsic state is context-independent, shareable, and stored inside the
      flyweight (treated as immutable). Extrinsic state is context-dependent and
      passed in by the client on each operation.
    ref: concepts.md#flyweight
  - id: dp-structural-027
    difficulty: advanced
    tags:
      - flyweight
      - immutability
    question: |
      Why must flyweight objects be immutable?
    options:
      - Because immutable objects are cheaper for the garbage collector to reclaim, which is the pattern's
        main performance goal
      - Because the flyweight factory is technically incapable of constructing objects that hold mutable
        fields
      - Because the shared intrinsic state is used by many clients concurrently, so a mutation would corrupt
        every user of that flyweight
      - Because extrinsic state passed in by the client can only be accepted by objects that are immutable
    answer: 2
    explanation: |
      A single flyweight instance is shared across many contexts. If its intrinsic
      state could change, that change would leak to every client using it, so
      flyweights must be immutable.
    ref: concepts.md#flyweight
  - id: dp-structural-028
    difficulty: advanced
    tags:
      - flyweight
      - vs-object-pool
    question: |
      How does Flyweight differ from the Object Pool pattern?
    options:
      - Flyweight leases mutable objects to one client at a time and reclaims them, while Object Pool
        shares immutable intrinsic state across many concurrent users
      - They are simply the same pattern published under two different names by different authors
      - Flyweight is a creational instantiation pattern, while Object Pool is a behavioral coordination
        pattern about message flow
      - Flyweight shares immutable state used concurrently by many clients; Object Pool reuses mutable
        objects one client at a time
    answer: 3
    explanation: |
      Flyweight shares immutable intrinsic state among many concurrent users. An
      Object Pool (a creational concern) hands out mutable objects to one client at a
      time and reclaims them for reuse.
    ref: concepts.md#flyweight
  - id: dp-structural-029
    difficulty: intermediate
    tags:
      - flyweight
      - real-world
    question: |
      Which is a real-world example of Flyweight?
    options:
      - Integer.valueOf caching boxed values in the -128..127 range
      - Spring AOP @Transactional proxies that wrap a bean to open and commit a transaction around calls
      - The AWT Container/Component hierarchy nesting child widgets uniformly inside parent containers
      - InputStreamReader adapting a raw byte stream into the character-oriented Reader interface
    answer: 0
    explanation: |
      Integer.valueOf returns shared cached instances for small values, a Flyweight.
      @Transactional is a Proxy, AWT Container is Composite, and InputStreamReader is
      an Adapter.
    ref: concepts.md#flyweight
  - id: dp-structural-030
    difficulty: intermediate
    tags:
      - flyweight
      - vs-singleton
    question: |
      How does Flyweight differ from Singleton?
    options:
      - Singleton yields many shared instances each keyed by intrinsic state, whereas Flyweight enforces
        exactly one global instance of the class
      - Flyweight yields many shared instances keyed by intrinsic state; Singleton yields exactly one
        instance
      - Both patterns strictly guarantee that exactly one instance of the type can ever exist in the JVM
      - Flyweight is a creational instantiation pattern, whereas Singleton is a structural composition
        pattern
    answer: 1
    explanation: |
      A Singleton enforces exactly one instance. Flyweight produces many shared
      instances, each keyed by its intrinsic state (e.g., one shared TreeType per
      species).
    ref: concepts.md#flyweight
  - id: dp-structural-031
    difficulty: beginner
    tags:
      - proxy
      - intent
    question: |
      What is the intent of the Proxy pattern?
    options:
      - Convert an existing class's interface into a different one that a client already expects
      - Compose objects into recursive part-whole trees treated uniformly as leaves or containers
      - Provide a surrogate or placeholder that controls access to another object, using the same interface
      - Provide one simplified higher-level interface that hides a complex subsystem of many classes
    answer: 2
    explanation: |
      A Proxy is a surrogate that implements the same interface as the real subject
      and controls access to it (lazy creation, remoting, protection, caching), so
      clients use it transparently.
    ref: concepts.md#proxy
  - id: dp-structural-032
    difficulty: intermediate
    tags:
      - proxy
      - variants
      - virtual
    question: |
      A proxy that delays the creation of an expensive real object until it is first
      needed is which variant?
    options:
      - Remote proxy
      - Protection proxy
      - Caching proxy
      - Virtual proxy
    answer: 3
    explanation: |
      A Virtual proxy performs lazy initialization, creating the expensive real
      subject only on first use. Remote handles cross-address-space access,
      Protection enforces authorization, and Caching memoizes results.
    ref: concepts.md#proxy
  - id: dp-structural-033
    difficulty: intermediate
    tags:
      - proxy
      - variants
      - remote
    question: |
      An RMI or gRPC stub that acts as a local stand-in for an object living in
      another address space is which Proxy variant?
    options:
      - Remote proxy
      - Virtual proxy
      - Smart reference
      - Protection proxy
    answer: 0
    explanation: |
      A Remote proxy is a local representative for an object in another address space
      or on the network, marshaling calls across the boundary. This is exactly what
      RMI/gRPC stubs do.
    ref: concepts.md#proxy
  - id: dp-structural-034
    difficulty: intermediate
    tags:
      - proxy
      - variants
      - protection
    question: |
      Which Proxy variant enforces access control or authorization before forwarding
      a request?
    options:
      - Caching proxy
      - Protection proxy
      - Virtual proxy
      - Logging proxy
    answer: 1
    explanation: |
      A Protection proxy checks permissions/authorization and only forwards the call
      to the real subject if access is allowed.
    ref: concepts.md#proxy
  - id: dp-structural-035
    difficulty: advanced
    tags:
      - proxy
      - remote
      - gotchas
    question: |
      What is a notable risk specific to a Remote proxy?
    options:
      - It forces the calling client to adopt a brand-new interface different from the real subject's own
      - It guarantees that exactly one shared instance of the subject exists across the entire network
      - It can hide real latency and failure modes — a call that looks local is actually a network round-trip
      - It aggregates the results of many child objects into a single combined tree-wide result
    answer: 2
    explanation: |
      Because a remote proxy shares the subject's interface, a call appears local but
      is actually a network round-trip, hiding latency and failure modes and making
      response times less predictable if not handled with timeouts and retries.
    ref: concepts.md#proxy
  - id: dp-structural-036
    difficulty: intermediate
    tags:
      - proxy
      - real-world
    question: |
      Which is a real-world example of the Proxy pattern?
    options:
      - java.io DataInputStream wrapping a stream to add primitive-type reading behavior over the bytes
      - The AWT Container holding child components in a uniform part-whole widget hierarchy tree
      - Arrays.asList wrapping a raw array to expose the fixed-size List interface it does not natively have
      - Spring AOP proxies behind @Transactional and @Cacheable
    answer: 3
    explanation: |
      Spring creates proxies around beans to add transaction and caching behavior
      around method calls — Proxy (specifically it controls access/adds cross-cutting
      concerns). The others are Decorator, Composite, and Adapter examples.
    ref: concepts.md#proxy
  - id: dp-structural-037
    difficulty: advanced
    tags:
      - proxy
      - vs-decorator
      - disambiguation
    question: |
      Given identical UML for a wrapper that creates and manages its own subject and
      keeps behavior unchanged while gating access, which pattern is it?
    options:
      - Proxy
      - Decorator
      - Adapter
      - Composite
    answer: 0
    explanation: |
      Controlling access while keeping behavior identical, and typically owning the
      subject's lifecycle, is Proxy. A Decorator would ADD behavior and be composed by
      the client rather than creating its own subject.
    ref: concepts.md#proxy
  - id: dp-structural-038
    difficulty: intermediate
    tags:
      - disambiguation
      - adapter
      - facade
      - proxy
    question: |
      Which mnemonic correctly maps the wrapper-family intents?
    options:
      - Adapter = a simpler unified interface; Facade = a different converted interface; Proxy = adds extra behavior
      - Adapter = different interface; Facade = simpler interface over many; Proxy = same interface, controlled
        access
      - Adapter = keeps the same interface; Facade = a tree of part-whole nodes; Proxy = two independent dimensions
      - Adapter = wraps to add behavior; Facade = gates and controls access; Proxy = simplifies a subsystem
    answer: 1
    explanation: |
      Adapter changes the interface (different), Facade defines a new simpler
      interface over many classes, and Proxy keeps the same interface and same
      behavior while controlling access.
    ref: concepts.md#wrapper-family-disambiguation
  - id: dp-structural-039
    difficulty: advanced
    tags:
      - disambiguation
      - class-based
      - object-based
    question: |
      Which GoF structural pattern uniquely has both a class-based (inheritance) form
      and an object-based (composition) form?
    options:
      - Decorator
      - Proxy
      - Adapter
      - Composite
    answer: 2
    explanation: |
      Adapter is the only GoF structural pattern with both a class form (inheriting
      from the adaptee) and an object form (composing/delegating to the adaptee). The
      others are fundamentally object-based.
    ref: concepts.md#wrapper-family-disambiguation
  - id: dp-structural-040
    difficulty: advanced
    tags:
      - disambiguation
      - decorator
      - composite
    question: |
      In the wrapper family, which pair is distinguished mainly by "wraps exactly one"
      versus "aggregates many children"?
    options:
      - Adapter vs. Facade
      - Proxy vs. Bridge
      - Facade vs. Flyweight
      - Decorator vs. Composite
    answer: 3
    explanation: |
      A Decorator wraps exactly one component to add behavior, while a Composite
      aggregates many children and combines their results — the key structural
      difference between the two.
    ref: concepts.md#wrapper-family-disambiguation
  - id: dp-structural-041
    difficulty: intermediate
    tags:
      - scenario
      - facade
    question: |
      A team exposes a video-conversion library with dozens of interdependent codec,
      bitrate, and mixer classes. Clients only ever want "convert file X to format Y."
      Which pattern best serves them?
    options:
      - Facade
      - Flyweight
      - Bridge
      - Proxy
    answer: 0
    explanation: |
      A Facade provides one simple convert() method that orchestrates the complex
      subsystem, sparing clients from knowing the internal classes and their ordering.
    ref: concepts.md#facade
  - id: dp-structural-042
    difficulty: intermediate
    tags:
      - scenario
      - flyweight
    question: |
      A map renderer must draw millions of trees, each sharing one of a handful of
      species textures but having a unique position. Memory is the bottleneck. Which
      pattern fits?
    options:
      - Composite (nest each tree as a child node so the whole forest is one uniform part-whole tree)
      - Flyweight (share species/texture as intrinsic state; pass position as extrinsic)
      - Decorator (wrap each tree in per-instance layers that stack on rendering behavior at draw time)
      - Adapter (translate each tree's texture API into the renderer's expected drawing interface)
    answer: 1
    explanation: |
      Flyweight shares the immutable species/texture (intrinsic) across all trees and
      passes the unique position (extrinsic) per draw call, collapsing millions of
      objects to a few shared ones plus small per-instance data.
    ref: concepts.md#flyweight
  - id: dp-structural-043
    difficulty: advanced
    tags:
      - scenario
      - bridge
    question: |
      You have notification types (alert, reminder, promo) that must each be
      deliverable over multiple channels (email, SMS, push), and both lists will keep
      growing. Which pattern avoids the class explosion?
    options:
      - Decorator (wrap each notification in stackable channel layers added at send time)
      - Composite (arrange notifications and channels into one uniform part-whole delivery tree)
      - Bridge (notification abstraction holds a delivery-channel implementor)
      - Facade (expose one simplified send() method that hides the whole notification subsystem)
    answer: 2
    explanation: |
      Bridge separates the notification abstraction from the delivery implementation
      so each grows independently (M + N classes), avoiding a NotificationXChannel
      subclass for every combination.
    ref: concepts.md#bridge
  - id: dp-structural-044
    difficulty: advanced
    tags:
      - scenario
      - decorator
      - code-reading
    question: |
      Code does: new EncryptionWriter(new CompressionWriter(new FileWriter(path))),
      where each wrapper implements the same Writer interface and calls through to the
      next. Which pattern is this?
    options:
      - Proxy
      - Adapter
      - Composite
      - Decorator
    answer: 3
    explanation: |
      Each wrapper shares the Writer interface, holds the next writer, and adds
      behavior before delegating — stackable Decorators. Order matters (encrypt-then-
      compress differs from compress-then-encrypt), a hallmark of Decorator.
    ref: concepts.md#decorator
  - id: dp-structural-045
    difficulty: intermediate
    tags:
      - scenario
      - proxy
      - code-reading
    question: |
      A class implements the same interface as a heavy service, and on the first
      method call it constructs the real service, then forwards to it on every call.
      Which pattern is this?
    options:
      - Virtual Proxy
      - Adapter
      - Facade
      - Flyweight
    answer: 0
    explanation: |
      Sharing the subject's interface and lazily creating the real object on first use
      is a Virtual proxy — it controls access via lazy initialization while keeping
      behavior identical.
    ref: concepts.md#proxy
  - id: dp-structural-046
    difficulty: advanced
    tags:
      - beyond-seven
      - marker-interface
    question: |
      Which describes the Marker Interface pattern, and what commonly replaces it?
    options:
      - A rich contract declaring many required methods; replaced by an abstract base class supplying defaults
      - An empty interface used purely as a type tag/metadata (e.g. Serializable); often replaced by annotations
      - A pool of reusable mutable objects handed out one at a time; replaced by a factory that builds them
      - A recursive tree of parent and child nodes traversed uniformly; replaced by the Composite pattern
    answer: 1
    explanation: |
      A marker interface is empty and exists only as a checkable type tag (Serializable,
      Cloneable). Annotations often replace it for tagging, trading compile-time
      instanceof checks for richer, parameterized metadata.
    ref: concepts.md#beyond-the-classic-seven
  - id: dp-structural-047
    difficulty: advanced
    tags:
      - beyond-seven
      - poeaa
      - gateway
    question: |
      In Fowler's PoEAA, a "Gateway" object is best described as:
    options:
      - A single well-known global object that other objects query to find common shared services
      - An empty method-less interface attached to a class purely as a checkable compile-time type tag
      - An object that wraps access to an external system or resource (a specialized Adapter+Facade at
        a boundary)
      - A managed pool of reusable open connections leased out and recycled to avoid per-call setup cost
    answer: 2
    explanation: |
      A Gateway wraps access to an external system/resource (queue, service, DB API),
      acting like a specialized Adapter+Facade at the boundary. A well-known lookup
      object is a Registry.
    ref: concepts.md#beyond-the-classic-seven
  - id: dp-structural-048
    difficulty: advanced
    tags:
      - boundary
      - cloud
      - cross-reference
    question: |
      How do the cloud Ambassador and Anti-Corruption Layer patterns relate to the
      classic structural patterns?
    options:
      - They are creational patterns governing object instantiation, unrelated to composing structures
      - They supersede Composite as the preferred way to assemble part-whole tree hierarchies at scale
      - They are behavioral patterns coordinating the flow of runtime messages between distributed peers
      - They are Proxy/Adapter/Facade applied at service boundaries (covered in dp-distributed-cloud,
        not here)
    answer: 3
    explanation: |
      Ambassador (a client-side proxy for remote services) and Anti-Corruption Layer
      (an adapter/facade translating between bounded contexts) are the classic
      Proxy/Adapter/Facade intents applied at microservice boundaries; they are
      catalogued in dp-distributed-cloud and the microservices topics.
    ref: concepts.md#beyond-the-classic-seven
