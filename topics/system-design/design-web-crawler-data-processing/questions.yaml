topic: "Design a Web Crawler and Large-Scale Data Processing"
domain: system-design
topic_slug: design-web-crawler-data-processing
version: 1
questions:
  - id: design-web-crawler-data-processing-001
    difficulty: beginner
    tags: [crawler, basics, loop]
    question: |
      At its core, what is the fundamental loop of a web crawler?
    options:
      - "Take a URL from the frontier, fetch it, extract links, dedup and enqueue new links, store content"
      - "Ask users to submit which specific pages to index, then download only those"
      - "Download the entire web into a single machine's RAM, then build the index in one pass"
      - "Poll a single database table for pre-listed URLs and render each in a browser"
    answer: 0
    explanation: |
      A crawler repeatedly pulls a URL from the frontier, fetches it, parses out links,
      deduplicates and enqueues the new ones, and stores the content for downstream
      processing. The others misdescribe it: crawling is automated discovery (not
      user-listed), the web does not fit in RAM, and it is not a one-shot load.
    ref: "concepts.md#high-level-crawler-architecture"
  - id: design-web-crawler-data-processing-002
    difficulty: beginner
    tags: [frontier, definition]
    question: |
      What is the "URL frontier" in a crawler?
    options:
      - "The set of IP addresses and hostnames the crawler has been banned from"
      - "The queue of discovered-but-not-yet-crawled URLs, managing priority and politeness"
      - "The final inverted index of ranked results served to end search users"
      - "The cached list of robots.txt allow and disallow rules for every crawled host"
    answer: 1
    explanation: |
      The frontier is the data structure holding URLs discovered but not yet fetched,
      and it manages both crawl priority and politeness. It is not a ban list, not the
      served index, and not the robots ruleset (which is a per-host cached artifact).
    ref: "concepts.md#url-frontier-design-politeness-and-priority"
  - id: design-web-crawler-data-processing-003
    difficulty: beginner
    tags: [politeness, robots]
    question: |
      Why must a crawler respect robots.txt and rate-limit per host?
    options:
      - "To make fetched pages parse and render faster inside the crawler's pipeline"
      - "Because robots.txt increases the crawler's download bandwidth"
      - "To avoid overloading/being banned by servers and to honor site owners' rules"
      - "Because HTTP requires a robots.txt fetch before every page"
    answer: 2
    explanation: |
      Politeness and robots.txt exist to avoid overloading servers, honor owner rules,
      and avoid bans/legal issues. robots.txt does not speed rendering or increase
      bandwidth, and HTTP does not mandate a robots fetch per page (you cache it).
    ref: "concepts.md#robotstxt-and-politeness-enforcement"
  - id: design-web-crawler-data-processing-004
    difficulty: beginner
    tags: [dedup, bloom-filter]
    question: |
      Why is a Bloom filter commonly used for the "have I seen this URL?" check at web scale?
    options:
      - "It stores every full URL string so you can enumerate and list them all back later"
      - "It guarantees exactly zero false positives and zero false negatives on every lookup"
      - "It keeps URLs sorted in order so that prefix and range queries run in logarithmic time"
      - "It is a compact probabilistic set with no false negatives, using far less memory than a full hash set"
    answer: 3
    explanation: |
      A Bloom filter is a compact probabilistic set: it never returns a false negative
      (never says "unseen" for something seen) and uses ~10 bits/element instead of
      storing full URLs, saving ~100x memory. It cannot list members, does have false
      positives, and does not sort.
    ref: "concepts.md#deduplication-with-bloom-filters-and-content-fingerprinting"
  - id: design-web-crawler-data-processing-005
    difficulty: beginner
    tags: [storage, blob]
    question: |
      Where are raw fetched HTML pages best stored at petabyte scale?
    options:
      - "In a cheap, durable object/blob store (e.g., S3/HDFS), often compressed"
      - "In a single relational table with one row per page"
      - "In the application servers' in-process RAM caches for the fastest possible access"
      - "In the frontier queue itself, stored inline alongside each pending URL entry"
    answer: 0
    explanation: |
      Raw pages are large and write-heavy, so they belong in a cheap durable object
      store (S3/GCS/HDFS), usually compressed and often packed into WARC files. A single
      relational table, RAM, or the frontier are all wrong scale/purpose.
    ref: "concepts.md#content-storage-and-the-processing-handoff"
  - id: design-web-crawler-data-processing-006
    difficulty: beginner
    tags: [mapreduce, batch]
    question: |
      What are the three logical phases of a MapReduce job?
    options:
      - "Extract, Transform, Load"
      - "Map, Shuffle (group by key), Reduce"
      - "Fetch, Parse, Store"
      - "Batch, Speed, Serving"
    answer: 1
    explanation: |
      MapReduce is map (per-record transform), shuffle (group by key), reduce
      (aggregate per key). ETL is a data-pipeline pattern, fetch/parse/store is the
      crawler loop, and batch/speed/serving are Lambda-architecture layers.
    ref: "concepts.md#batch-processing-with-mapreduce-and-spark"
  - id: design-web-crawler-data-processing-007
    difficulty: beginner
    tags: [lambda, kappa, definition]
    question: |
      What most distinguishes Kappa architecture from Lambda architecture?
    options:
      - "Kappa stores data only in a warehouse; Lambda only in a lake"
      - "Kappa strictly forbids any reprocessing of historical data once it has been ingested"
      - "Kappa uses a single streaming pipeline (reprocessing by replay) instead of separate batch and speed layers"
      - "Kappa is batch-only while Lambda is stream-only"
    answer: 2
    explanation: |
      Kappa uses one streaming pipeline and reprocesses history by replaying the log,
      avoiding Lambda's two separate codebases. It is not about lake vs warehouse, it
      does allow reprocessing (via replay), and it is stream-centric, not batch-only.
    ref: "concepts.md#lambda-architecture-versus-kappa-architecture"
  - id: design-web-crawler-data-processing-008
    difficulty: beginner
    tags: [etl, elt]
    question: |
      What is the key difference between ETL and ELT?
    options:
      - "ETL is exclusively for streaming workloads while ELT is exclusively for batch jobs"
      - "ELT always discards the raw source data after loading, while ETL always retains it"
      - "They are identical; the letters are just reordered for marketing"
      - "In ETL you transform before loading; in ELT you load raw first, then transform in the target"
    answer: 3
    explanation: |
      ETL transforms before loading (only clean data lands); ELT loads raw into a
      powerful target (warehouse/lake) and transforms there, keeping raw for
      re-transformation. Both can be batch or streaming, and ELT is precisely the one
      that keeps raw.
    ref: "concepts.md#etl-versus-elt"
  - id: design-web-crawler-data-processing-009
    difficulty: beginner
    tags: [data-lake, warehouse]
    question: |
      A data lake primarily stores data with which schema approach?
    options:
      - "Schema-on-read: raw data is stored cheaply and schema is applied at query time"
      - "Schema-on-write: data must be modeled and cleaned before it can be stored"
      - "No schema of any kind can ever be applied to data held in a lake"
      - "A fixed relational schema that is strictly enforced by the storage layer on write"
    answer: 0
    explanation: |
      A data lake is schema-on-read: store raw/semi-structured data cheaply and impose
      schema when you query. Schema-on-write describes a warehouse; lakes can absolutely
      have schema applied later, and they do not enforce a fixed relational schema.
    ref: "concepts.md#data-lake-data-warehouse-and-lakehouse"
  - id: design-web-crawler-data-processing-010
    difficulty: beginner
    tags: [idempotency, delivery]
    question: |
      Most queues and retry logic provide at-least-once delivery. What property must
      your processing then have to stay correct?
    options:
      - "Statelessness, so that no worker ever retains local state between messages"
      - "Idempotency: reprocessing the same input yields the same result, no double effects"
      - "Strong linearizable consistency enforced on every single read from the store"
      - "A single global lock serialized around all processing to prevent any concurrency"
    answer: 1
    explanation: |
      At-least-once means duplicates happen, so processing must be idempotent to avoid
      double-counting. Statelessness alone does not prevent double effects, global
      strong consistency is unrelated, and a global lock kills throughput without
      solving duplication.
    ref: "concepts.md#deduplication-and-idempotency-at-scale"
  - id: design-web-crawler-data-processing-011
    difficulty: beginner
    tags: [back-pressure, definition]
    question: |
      What is "back-pressure" in a data pipeline?
    options:
      - "The extra request latency added by encrypting messages in transit between stages"
      - "The act of replaying a Kafka log from offset zero to rebuild all downstream state"
      - "The signal that propagates upstream telling producers to slow down when consumers can't keep up"
      - "The total disk space consumed by periodic checkpoint snapshots on each worker"
    answer: 2
    explanation: |
      Back-pressure is the upstream "slow down" signal when a consumer falls behind, so
      buffers do not overflow. It is not encryption latency, not log replay, and not
      checkpoint disk usage.
    ref: "concepts.md#back-pressure-and-checkpointing"
  - id: design-web-crawler-data-processing-012
    difficulty: beginner
    tags: [batch-vs-stream, latency]
    question: |
      You need to rebuild a full search index once per night from all crawled pages.
      Batch or stream, and why?
    options:
      - "Stream, because streaming pipelines are always faster than batch for any workload"
      - "Stream, because batch frameworks cannot process datasets this large in one job"
      - "Neither; a full search index cannot be built by any data-processing pipeline at all"
      - "Batch, because the input is bounded, latency of hours is fine, and it is simpler and cheaper"
    answer: 3
    explanation: |
      A nightly full rebuild has a bounded input and a relaxed latency budget, so batch
      is simpler and cheaper. Streaming is not "always faster" for bulk recompute, batch
      handles huge data fine, and pipelines routinely build indexes.
    ref: "concepts.md#batch-versus-stream-for-the-same-problem"
  - id: design-web-crawler-data-processing-013
    difficulty: beginner
    tags: [freshness, recrawl]
    question: |
      What does "freshness" mean in the context of recrawl policies?
    options:
      - "Whether the crawler's stored copy of a page currently matches the live page"
      - "How many outbound links a page contains at the time it was last fetched"
      - "The compression ratio achieved when storing the page's HTML in the object store"
      - "The number of concurrent crawler workers assigned to fetch from a given host"
    answer: 0
    explanation: |
      Freshness (Cho & Garcia-Molina) is a binary measure of whether your local copy is
      current. Link count, compression ratio, and worker count are unrelated to the
      freshness definition.
    ref: "concepts.md#freshness-and-recrawl-policies"
  - id: design-web-crawler-data-processing-014
    difficulty: beginner
    tags: [crawler-traps, definition]
    question: |
      What is a "crawler trap"?
    options:
      - "A CAPTCHA challenge page designed to block all automated bots from proceeding"
      - "A construct that generates effectively infinite URLs or content, drowning the frontier"
      - "A firewall rule that blocks a crawler's originating IP address after too many hits"
      - "A robots.txt file whose rules disallow crawling of every path on the entire host"
    answer: 1
    explanation: |
      A crawler trap generates near-infinite URLs/content (calendars, faceted filters,
      session-id links), overwhelming the frontier. A CAPTCHA, a firewall block, and a
      restrictive robots.txt are obstacles but not the infinite-generation trap.
    ref: "concepts.md#crawler-traps-and-robustness"
  - id: design-web-crawler-data-processing-015
    difficulty: beginner
    tags: [partitioning, workers]
    question: |
      To keep politeness state local, how are URLs commonly partitioned across crawler workers?
    options:
      - "By the character length of the URL string, so similar-length URLs share a worker"
      - "Randomly reassigned on every single request to spread load as evenly as possible"
      - "By host (e.g., consistent hashing on hostname), so all of a host's URLs go to one worker"
      - "By the wall-clock time of day at which the URL was first discovered and enqueued"
    answer: 2
    explanation: |
      Partitioning by host keeps each host's robots cache and crawl-delay timer on one
      worker, so politeness needs no cross-node coordination. URL length, randomness, and
      discovery time would scatter a host across workers and break local politeness.
    ref: "concepts.md#distributed-crawler-workers-and-coordination"
  - id: design-web-crawler-data-processing-016
    difficulty: intermediate
    tags: [capacity, estimation]
    question: |
      You must crawl 1 billion pages per month. What is the approximate average write
      throughput the system must sustain?
    options:
      - "About 40 pages/sec"
      - "About 12,000 pages/sec"
      - "About 3 pages/sec"
      - "About 385 pages/sec"
    answer: 3
    explanation: |
      1e9 pages / ~2.6e6 seconds per month ≈ 385 pages/sec average (roughly 770 at 2x
      peak). 40 and 3 are off by 10-100x; 12,000/sec would be ~31B/month, far above the
      target.
    ref: "concepts.md#requirements-and-capacity-estimation"
  - id: design-web-crawler-data-processing-017
    difficulty: intermediate
    tags: [capacity, storage]
    question: |
      With ~1B pages/month at ~500 KB average uncompressed, roughly how much raw storage
      does one month of crawl consume before compression?
    options:
      - "About 500 TB"
      - "About 5 TB"
      - "About 50 TB"
      - "About 5 PB"
    answer: 0
    explanation: |
      1e9 pages * 500 KB = 5e14 bytes ≈ 500 TB/month uncompressed (~100 TB at ~5x
      compression). 5 TB and 50 TB are 10-100x low; 5 PB is 10x high.
    ref: "concepts.md#requirements-and-capacity-estimation"
  - id: design-web-crawler-data-processing-018
    difficulty: intermediate
    tags: [frontier, mercator, politeness, priority]
    question: |
      In the Mercator two-stage frontier, what do the front queues and back queues
      respectively encode?
    options:
      - "Front queues enforce politeness timing while back queues bias dequeue by priority"
      - "Front queues encode priority; back queues encode politeness (one host per back queue)"
      - "Both stages encode priority; politeness is delegated entirely to robots.txt parsing"
      - "Front queues store successfully crawled pages while back queues store failed fetches"
    answer: 1
    explanation: |
      Mercator front queues bias dequeue by priority; back queues hold one host each and
      enforce politeness via a next-fetch-time heap. The reversed and "both priority"
      options miss the split's purpose, and neither queue stores pages or failures.
    ref: "concepts.md#url-frontier-design-politeness-and-priority"
  - id: design-web-crawler-data-processing-019
    difficulty: intermediate
    tags: [politeness, ip, host]
    question: |
      Why is keying politeness only on hostname sometimes insufficient?
    options:
      - "Hostnames map one-to-one to physical servers, so a per-host limit already guarantees you never exceed one machine"
      - "Hostnames cannot be hashed consistently, so the frontier is forced to fall back on raw IP addresses for every decision"
      - "Many hosts can share one IP (shared hosting/CDN), so per-host limits can still overload a single server"
      - "The robots.txt standard explicitly forbids rate limiting by hostname and mandates that limits apply only per IP"
    answer: 2
    explanation: |
      Multiple hostnames often resolve to one IP/server (shared hosting, CDNs), so
      per-host rate limits can still overload that server; keying on IP (or both) is
      safer. Hostnames are not one-to-one with servers, are hashable, and robots.txt
      does not forbid rate limiting.
    ref: "concepts.md#robotstxt-and-politeness-enforcement"
  - id: design-web-crawler-data-processing-020
    difficulty: intermediate
    tags: [dedup, bloom-filter, false-positive]
    question: |
      With a Bloom filter for URL-seen checks at ~1% false-positive rate, what is the
      concrete consequence of a false positive?
    options:
      - "The crawler re-downloads a page it already has, wasting bandwidth on redundant fetches it could have skipped"
      - "The crawler crashes with an unrecoverable error because a Bloom filter offers no way to roll back a bad lookup"
      - "Two separate workers are handed the identical URL and end up crawling it at the same instant, duplicating effort"
      - "The crawler treats a never-crawled URL as already seen and silently skips it"
    answer: 3
    explanation: |
      A Bloom false positive says "seen" for a URL that was not, so the crawler skips a
      page it never fetched (a silent miss). Bloom filters have no false negatives (so
      no re-download from that), do not crash, and the duplicate-worker issue is a
      partitioning concern, not a Bloom FP.
    ref: "concepts.md#deduplication-with-bloom-filters-and-content-fingerprinting"
  - id: design-web-crawler-data-processing-021
    difficulty: intermediate
    tags: [content-dedup, simhash]
    question: |
      You keep crawling near-identical mirror pages that differ only in a session id and
      some boilerplate. Which technique best detects these near-duplicates?
    options:
      - "SimHash or MinHash+LSH fingerprints compared within a small distance threshold"
      - "An exact SHA-256 hash of the raw page bytes, treating any pages with matching digests as the only true duplicates"
      - "A larger Bloom filter on the raw URL strings, sized to push the false-positive rate low enough to catch the mirrors"
      - "Increasing the per-host crawl delay so the near-identical mirror pages are simply fetched far less frequently"
    answer: 0
    explanation: |
      Near-duplicates with small textual differences need locality-sensitive
      fingerprints like SimHash/MinHash-LSH, where similar docs have small Hamming
      distance. Exact hashes only catch byte-identical content, a URL Bloom filter
      addresses URL dedup not content, and crawl delay changes timing, not detection.
    ref: "concepts.md#deduplication-with-bloom-filters-and-content-fingerprinting"
  - id: design-web-crawler-data-processing-022
    difficulty: intermediate
    tags: [freshness, cho-garcia-molina]
    question: |
      Cho & Garcia-Molina surprisingly found that a proportional recrawl policy (visit
      fast-changing pages more) can be WORSE than uniform. Why?
    options:
      - "Proportional policies are mathematically impossible to implement without perfect knowledge of every page's exact change times"
      - "Fast-changing pages consume budget but their freshness expires almost immediately, wasting effort"
      - "Uniform policies inherently visit far fewer total pages, so they win purely by making fewer requests overall"
      - "Proportional recrawl policies violate robots.txt by definition because refetching too often breaches the Crawl-delay directive"
    answer: 1
    explanation: |
      Over-investing in hyperactive pages wastes budget because their freshness decays
      almost instantly, lowering average freshness. Proportional is implementable, does
      not inherently visit fewer pages, and has nothing to do with robots.txt.
    ref: "concepts.md#freshness-and-recrawl-policies"
  - id: design-web-crawler-data-processing-023
    difficulty: intermediate
    tags: [freshness, conditional-get, etag]
    question: |
      How can a crawler cheaply detect that a page has NOT changed without downloading
      the full body?
    options:
      - "By re-running the URL through the Bloom filter, which reports whether the page's content has been modified since last fetch"
      - "By increasing the number of crawler workers assigned to the host so the page is refetched and compared far more often"
      - "By issuing a conditional GET with If-Modified-Since/ETag and receiving a 304 Not Modified"
      - "By deleting the page from the frontier, which signals downstream that its stored copy is already known to be current"
    answer: 2
    explanation: |
      A conditional GET (If-Modified-Since or If-None-Match with ETag) lets the server
      answer 304 Not Modified with no body, saving bandwidth. Bloom filters, more
      workers, and frontier deletion do not detect change cheaply.
    ref: "concepts.md#freshness-and-recrawl-policies"
  - id: design-web-crawler-data-processing-024
    difficulty: intermediate
    tags: [crawler-traps, robustness]
    question: |
      Which combination best defends against infinite calendar/faceted-filter URL traps?
    options:
      - "Allowing unlimited crawl depth combined with faster fetching so the crawler simply out-races the trap's URL generation"
      - "Disabling robots.txt parsing entirely so the crawler is free to skip past the trap's dynamically generated sections"
      - "Storing every discovered URL in RAM so the seen-set can instantly reject the trap's endlessly repeating link patterns"
      - "Max URL depth, per-host URL caps, parameter-explosion detection, and content dedup"
    answer: 3
    explanation: |
      Bounding depth, capping URLs/host, detecting parameter explosions, and content
      dedup together contain infinite URL spaces. Unlimited depth makes it worse,
      disabling robots is unrelated and harmful, and RAM storage does not stop the
      infinite generation.
    ref: "concepts.md#crawler-traps-and-robustness"
  - id: design-web-crawler-data-processing-025
    difficulty: intermediate
    tags: [dns, workers]
    question: |
      Why is DNS resolution a notable bottleneck in a high-throughput crawler, and what
      is the standard fix?
    options:
      - "DNS lookups are slow (tens of ms); run a caching resolver and cache results with TTL, prefetch for queued hosts"
      - "DNS resolution is effectively instant at sub-microsecond latency, so it never bottlenecks and needs no special handling"
      - "DNS must be disabled completely and the crawler must operate purely on hardcoded IP addresses to reach any throughput"
      - "Every single page fetch mandates a brand-new DNS lookup that the protocol makes impossible to cache or otherwise avoid"
    answer: 0
    explanation: |
      DNS lookups take tens of milliseconds and, done per fetch, become a bottleneck; a
      caching resolver with TTL and prefetch fixes it. DNS is not instant, disabling it
      is impractical, and caching precisely avoids per-page lookups.
    ref: "concepts.md#distributed-crawler-workers-and-coordination"
  - id: design-web-crawler-data-processing-026
    difficulty: intermediate
    tags: [storage, warc]
    question: |
      Why do large crawls (e.g., Common Crawl) pack many pages into WARC files rather
      than storing one object per page?
    options:
      - "The WARC format automatically encrypts every archived page at rest, which is impossible when storing one raw object per page"
      - "Object stores handle billions of tiny objects poorly; packing amortizes per-object overhead and suits batch reprocessing"
      - "WARC files let you mutate an individual archived page in place without rewriting the surrounding container file"
      - "WARC bundles compress so efficiently that they remove the need for any separate compression step entirely"
    answer: 1
    explanation: |
      Packing many pages per WARC file amortizes small-object overhead (object stores
      struggle with billions of tiny objects) and is batch-friendly. WARC is not an
      encryption format, does not enable in-place mutation, and does not replace
      compression (it is often combined with it).
    ref: "concepts.md#content-storage-and-the-processing-handoff"
  - id: design-web-crawler-data-processing-027
    difficulty: intermediate
    tags: [spark, mapreduce, iterative]
    question: |
      Why is Spark typically 10-100x faster than classic MapReduce for iterative jobs
      like PageRank?
    options:
      - "Spark skips fault tolerance entirely, dropping MapReduce's replication and recovery so it spends no time on durability"
      - "Spark runs the whole job on a single powerful machine, so there is no network shuffle to slow down the iterations"
      - "Spark keeps intermediate data in memory across stages instead of writing to disk between every stage"
      - "MapReduce cannot express iteration at all, so PageRank must be rewritten from scratch in a different paradigm to run"
    answer: 2
    explanation: |
      Spark holds RDDs/DataFrames in memory across stages, avoiding MapReduce's
      per-stage disk writes, which dominates iterative workloads. Spark still provides
      fault tolerance (via lineage), is distributed, and MapReduce can iterate (just
      slowly, writing to disk each pass).
    ref: "concepts.md#batch-processing-with-mapreduce-and-spark"
  - id: design-web-crawler-data-processing-028
    difficulty: intermediate
    tags: [lambda, criticism]
    question: |
      What is the classic, most-cited criticism of the Lambda architecture?
    options:
      - "It structurally cannot achieve low latency because every query must wait for the slow nightly batch layer to finish"
      - "It stores no historical data at all, since the speed layer overwrites the master dataset on each incoming event"
      - "It requires abandoning immutable data and mutating records in place, which breaks its own reprocessing guarantees"
      - "Two separate codebases (batch and speed) compute the same logic and must be kept in sync"
    answer: 3
    explanation: |
      Lambda's core pain is maintaining two codebases (batch + speed) that must produce
      matching results, a bug-prone sync burden. It does achieve low latency (speed
      layer), keeps historical data (batch/master dataset), and is built on immutable
      data.
    ref: "concepts.md#lambda-architecture-versus-kappa-architecture"
  - id: design-web-crawler-data-processing-029
    difficulty: intermediate
    tags: [lakehouse, iceberg, delta]
    question: |
      What does a "lakehouse" (via Iceberg/Delta/Hudi table formats) add on top of a
      plain data lake?
    options:
      - "ACID transactions, schema enforcement, and time travel over cheap object storage"
      - "It removes the ability to store raw, semi-structured data, accepting only fully modeled tables just like a warehouse"
      - "It forces strict schema-on-write validation and replaces cheap object storage with a proprietary block store"
      - "It deliberately makes every query slower in exchange for stronger durability guarantees on the underlying files"
    answer: 0
    explanation: |
      Lakehouse table formats add ACID transactions, schema enforcement, and time travel
      while keeping data in cheap object storage. It still stores raw data, does not
      eliminate object storage, and improves (not degrades) query performance via
      Parquet + statistics.
    ref: "concepts.md#data-lake-data-warehouse-and-lakehouse"
  - id: design-web-crawler-data-processing-030
    difficulty: intermediate
    tags: [idempotency, upsert]
    question: |
      Your link-count pipeline double-counts on retries. Which is the simplest robust
      fix that achieves exactly-once effect?
    options:
      - "Switch the queue to fire-and-forget with no retries, so a message is delivered at most once and can never be double-counted"
      - "Attach a stable dedup key and use idempotent upserts keyed by that id so replays overwrite instead of append"
      - "Add a single global lock around the whole pipeline so only one message is ever processed at a time, preventing overlap"
      - "Increase the configured retry count so the extra duplicate deliveries statistically cancel each other out over time"
    answer: 1
    explanation: |
      A stable dedup key plus idempotent upserts makes reprocessing overwrite rather than
      double-count, giving exactly-once effect on top of at-least-once. Removing retries
      loses data, a global lock kills throughput, and more retries increases duplicates.
    ref: "concepts.md#deduplication-and-idempotency-at-scale"
  - id: design-web-crawler-data-processing-031
    difficulty: intermediate
    tags: [back-pressure, pull, kafka]
    question: |
      Why is a pull-based (consumer-paced) log like Kafka naturally back-pressured for a
      crawler pipeline?
    options:
      - "Because producers synchronously block on each write until every consumer group has acknowledged that exact message"
      - "Because Kafka silently drops the oldest messages the moment a consumer starts falling behind the write rate"
      - "Because consumers request work at their own rate; the log simply grows and the producer isn't forced to block"
      - "Because Kafka guarantees exactly-once delivery over the network, so slow consumers never accumulate any backlog"
    answer: 2
    explanation: |
      In pull-based consumption the consumer sets its own pace and the log buffers the
      backlog, so producers are not blocked (you must still alarm on lag). Producers do
      not block per-ack, Kafka does not silently drop within retention, and exactly-once
      delivery over a network is not guaranteed (only exactly-once effect via dedup/txn).
    ref: "concepts.md#back-pressure-and-checkpointing"
  - id: design-web-crawler-data-processing-032
    difficulty: intermediate
    tags: [batch-vs-stream, decision]
    question: |
      A fraud-detection feature must flag suspicious crawl sources within seconds. Batch
      or stream?
    options:
      - "Batch, run every 24 hours, since aggregating a full day of crawl sources at once yields far more accurate fraud signals"
      - "Batch, because streaming frameworks fundamentally cannot express the joins and lookups that fraud detection requires"
      - "Neither; produce a nightly report emailed to analysts who then manually flag the suspicious crawl sources by hand"
      - "Stream, because the seconds-level latency SLA demands per-event processing"
    answer: 3
    explanation: |
      A seconds-level latency SLA requires per-event stream processing. A 24-hour batch
      or nightly report cannot meet seconds; streaming is perfectly capable of fraud
      detection.
    ref: "concepts.md#batch-versus-stream-for-the-same-problem"
  - id: design-web-crawler-data-processing-033
    difficulty: intermediate
    tags: [robots, caching]
    question: |
      Why should robots.txt be fetched once per host and cached (TTL hours to a day)
      rather than fetched before each URL?
    options:
      - "Because per-URL robots fetches would dominate traffic and hammer the server; caching trades a small staleness window for huge fetch savings"
      - "Because a host regenerates its robots.txt with different rules on every single request, so a cached copy is always stale"
      - "Because the HTTP specification explicitly forbids caching robots.txt and requires a fresh conditional fetch each time"
      - "Because a cached robots.txt copy is parsed into rendering hints that make the crawler's page rendering measurably faster"
    answer: 0
    explanation: |
      Fetching robots.txt per URL would multiply requests and violate the very
      politeness it enforces; caching with a TTL trades a small staleness window for a
      big reduction in fetches. robots.txt does not change per request, caching it is
      allowed, and it has nothing to do with rendering.
    ref: "concepts.md#robotstxt-and-politeness-enforcement"
  - id: design-web-crawler-data-processing-034
    difficulty: intermediate
    tags: [consistent-hashing, rebalance]
    question: |
      Why prefer consistent hashing (by host) over plain hash-mod-N for assigning hosts
      to crawler workers?
    options:
      - "It perfectly balances load with zero hotspots, guaranteeing every worker receives an exactly equal share of hosts"
      - "When the worker count changes, only ~1/N of host assignments remap instead of nearly all of them"
      - "It removes the need for a separate seen-set because the ring itself records which URLs have already been fetched"
      - "It lets two workers safely crawl the same host in parallel while still respecting that host's per-host crawl-delay"
    answer: 1
    explanation: |
      Consistent hashing minimizes reshuffling: changing the fleet size remaps only a
      small fraction of hosts, versus mod-N which remaps almost everything. It does not
      eliminate hotspots (mega-hosts still land on one node), does not replace the
      seen-set, and still keeps a host on one worker for politeness.
    ref: "concepts.md#distributed-crawler-workers-and-coordination"
  - id: design-web-crawler-data-processing-035
    difficulty: intermediate
    tags: [architecture, queues]
    question: |
      Why separate fetching, parsing, and storage into distinct stages connected by
      queues in a large crawler?
    options:
      - "To reduce the total number of URLs discovered by discarding links that cross a queue boundary between stages"
      - "To guarantee strong linearizable consistency across the whole crawl so every worker sees an identical global view"
      - "Because fetching is I/O-bound, parsing CPU-bound, and storage throughput-bound; decoupling lets each scale independently and absorbs bursts"
      - "Because a single operating-system process is technically incapable of opening the sockets needed to make HTTP requests"
    answer: 2
    explanation: |
      The stages have different resource profiles (I/O vs CPU vs throughput), so queues
      let each scale independently and buffer bursts. It does not reduce URLs discovered,
      does not provide strong consistency, and a single process can make HTTP requests
      (it just couples the scaling).
    ref: "concepts.md#high-level-crawler-architecture"
  - id: design-web-crawler-data-processing-036
    difficulty: intermediate
    tags: [url-normalization, dedup]
    question: |
      Why normalize URLs before checking the seen-set?
    options:
      - "Purely to shrink each URL string so the frontier and seen-set consume less storage, with no effect on dedup"
      - "Because unnormalized URLs are rejected by the HTTP client and cannot be fetched until their form is canonicalized"
      - "To bypass a host's robots.txt disallow rules by rewriting paths into an equivalent form the matcher fails to catch"
      - "So equivalent forms (case, default port, fragment, tracking params, ./..) collapse to one key and aren't crawled multiple times"
    answer: 3
    explanation: |
      Normalization collapses equivalent URL variants to a single canonical key so the
      same resource is not enqueued/crawled repeatedly. It is not merely for size, unnormalized
      URLs are fetchable, and it has nothing to do with bypassing robots.txt.
    ref: "concepts.md#deduplication-with-bloom-filters-and-content-fingerprinting"
  - id: design-web-crawler-data-processing-037
    difficulty: intermediate
    tags: [event-driven, fan-out, handoff]
    question: |
      After a page is fetched, how does a modern crawler hand off to many downstream
      consumers (indexer, embeddings, analytics) without coupling them?
    options:
      - "The crawler emits a 'page fetched' event to a log (Kafka/Kinesis/PubSub); consumers read it independently (fan-out)"
      - "Each consumer repeatedly polls the crawler process's internal in-memory buffers directly over RPC to pull fetched pages"
      - "The crawler invokes each downstream consumer synchronously in a fixed order and blocks until every one has acknowledged"
      - "All consumers contend for a single shared database row, taking turns acquiring a lock on it to read each fetched page"
    answer: 0
    explanation: |
      Emitting events to a log lets independent consumers fan out and read at their own
      pace, decoupling the crawler from them. Polling internal RAM is not shareable,
      synchronous chaining couples latency/availability, and a single locked row
      serializes everything.
    ref: "concepts.md#content-storage-and-the-processing-handoff"
  - id: design-web-crawler-data-processing-038
    difficulty: intermediate
    tags: [genai, rag, vector-db]
    question: |
      To power a RAG system from crawled pages, what pipeline is typical?
    options:
      - "Store only raw HTML in S3 and have the LLM fetch and parse that HTML directly at query time for every user request"
      - "A batch/stream job parses text, generates embeddings, and writes them to a vector DB; re-embed on change and dedup near-duplicate pages"
      - "Skip the crawl pipeline entirely and let the LLM browse each source website live over the network on every single query"
      - "Concatenate every crawled page into the LLM's context window at once so that no separate retrieval step is ever needed"
    answer: 1
    explanation: |
      RAG pipelines parse crawled text, embed it, and index vectors in a vector DB, with
      re-embedding on change and dedup so near-duplicates do not pollute retrieval.
      LLMs do not read raw HTML from S3 at query time, live browsing per query does not
      scale, and full corpora do not fit in a context window.
    ref: "concepts.md#content-storage-and-the-processing-handoff"
  - id: design-web-crawler-data-processing-039
    difficulty: intermediate
    tags: [checkpointing, tradeoff]
    question: |
      What is the trade-off of checkpointing more frequently in a streaming job?
    options:
      - "Slower recovery after a crash but a large sustained gain in steady-state processing throughput"
      - "No trade-off exists at all; adding more frequent checkpoints is strictly better along every dimension"
      - "Faster recovery and less reprocessing on failure, but higher steady-state overhead and lower throughput"
      - "It fully removes the need for idempotent side effects because each checkpoint commits every write exactly once"
    answer: 2
    explanation: |
      Frequent checkpoints shrink the work redone after a crash (fast recovery) but add
      I/O/pause overhead, reducing throughput. It is a genuine trade-off (not strictly
      better), and it does not remove the need for idempotent side effects.
    ref: "concepts.md#back-pressure-and-checkpointing"
  - id: design-web-crawler-data-processing-040
    difficulty: intermediate
    tags: [priority, freshness, frontier]
    question: |
      Choosing a strongly priority-driven frontier (crawl high-value pages first) has
      what main downside?
    options:
      - "It inherently violates robots.txt because prioritizing pages reorders fetches past the host's Crawl-delay directive"
      - "It makes URL deduplication impossible because priority ordering prevents the seen-set from being consulted in time"
      - "It forces you to keep the entire discovered web resident in RAM so priorities can be recomputed on every dequeue"
      - "Low-priority hosts/pages can be starved, hurting freshness on the long tail"
    answer: 3
    explanation: |
      Aggressive prioritization can starve low-priority URLs, so long-tail pages go stale.
      It does not violate robots.txt, does not break dedup, and does not require storing
      the web in RAM.
    ref: "concepts.md#url-frontier-design-politeness-and-priority"
  - id: design-web-crawler-data-processing-041
    difficulty: advanced
    tags: [hotspot, partitioning, mega-host]
    question: |
      You partition by host via consistent hashing. A single mega-host (millions of
      URLs) lands on one worker and it falls behind. What is the best mitigation?
    options:
      - "Use virtual nodes and cap URLs-per-host, or sub-partition that host with a shared per-host rate limiter"
      - "Scatter the mega-host's URLs to a randomly chosen worker on every single request, abandoning per-host politeness state entirely"
      - "Switch the entire fleet to hashing by full URL so that every host is split across all workers uniformly"
      - "Drop the mega-host from the frontier completely and never crawl any of its millions of catalog pages"
    answer: 0
    explanation: |
      Virtual nodes smooth placement and per-host caps bound the work; if you must split a
      mega-host, use a shared per-host rate limiter to preserve politeness. Random
      per-request movement breaks politeness state, hashing all hosts by URL forces a
      distributed rate limiter everywhere (over-engineering for one hotspot), and deleting
      the host loses coverage.
    ref: "concepts.md#distributed-crawler-workers-and-coordination"
  - id: design-web-crawler-data-processing-042
    difficulty: advanced
    tags: [bloom-filter, deletion, recrawl]
    question: |
      A standard Bloom filter cannot delete elements. Why does this matter for a crawler
      that recrawls, and what is a fix?
    options:
      - "It does not matter at all, because a crawler never needs to remove any URL once it has been added to the seen-set"
      - "Recrawl churn and URL churn accumulate set membership forever; use a counting/scalable Bloom filter or periodically rebuild it"
      - "Deletion is actually a trivial constant-time operation in a standard Bloom filter, so no additional fix is ever needed"
      - "You must abandon the Bloom filter and switch to storing every full URL string in RAM to allow removals"
    answer: 1
    explanation: |
      As the URL set churns you cannot remove stale entries from a plain Bloom filter, so
      you use counting/scalable variants or periodic rebuilds. Deletion is not supported in
      a standard Bloom filter, and reverting to full-URL RAM storage defeats the memory
      savings that motivated the Bloom filter.
    ref: "concepts.md#deduplication-with-bloom-filters-and-content-fingerprinting"
  - id: design-web-crawler-data-processing-043
    difficulty: advanced
    tags: [lambda, kappa, decision, scenario]
    question: |
      Your realtime index-update logic and your nightly full-recompute logic are
      identical, and you retain 30 days of the event log. You want to minimize
      maintenance burden. Which architecture fits best?
    options:
      - "Lambda, because you should always maintain separate batch and speed codebases even when their logic is identical"
      - "A pure data-warehouse ETL with no streaming layer at all, recomputing everything on a fixed nightly schedule"
      - "Kappa (or a unified engine), because one codebase reprocesses via log replay and there is no dual-logic sync burden"
      - "Two independent teams each owning and separately maintaining a different codebase for the same computation"
    answer: 2
    explanation: |
      When batch and realtime logic are identical and log retention supports replay,
      Kappa/unified engine avoids Lambda's dual-codebase sync burden. Lambda's two
      codebases are exactly the maintenance cost you want to avoid, a warehouse-only ETL
      drops the realtime path, and splitting teams multiplies the sync problem.
    ref: "concepts.md#lambda-architecture-versus-kappa-architecture"
  - id: design-web-crawler-data-processing-044
    difficulty: advanced
    tags: [lambda, kappa, decision, scenario]
    question: |
      A regulated financial report must be provably exact via full recomputation, but a
      dashboard also needs sub-second approximate updates, and the two computations use
      genuinely different logic. Which architecture fits best?
    options:
      - "Kappa, because a single streaming pipeline is always simpler even when the two computations use genuinely different logic"
      - "A pure data lake with no serving layer, relying on ad-hoc queries over raw files to answer both the report and the dashboard"
      - "Batch-only processing on a fixed schedule, dropping the sub-second dashboard requirement as unnecessary complexity"
      - "Lambda, because a batch layer gives auditable ground-truth recompute while a speed layer serves low-latency approximate views"
    answer: 3
    explanation: |
      When batch (ground-truth, auditable) and realtime (approximate, low-latency) logic
      genuinely differ and accuracy is regulated, Lambda's separate layers are justified.
      Kappa's single pipeline is not simpler when the logics differ, a lake without a
      serving layer cannot answer queries, and batch-only violates the sub-second SLA.
    ref: "concepts.md#lambda-architecture-versus-kappa-architecture"
  - id: design-web-crawler-data-processing-045
    difficulty: advanced
    tags: [data-skew, spark, mapreduce]
    question: |
      Building an inlink count, one reducer receives youtube.com's billion links and
      becomes a straggler. What is the standard mitigation?
    options:
      - "Salt the hot key / use combiners / apply skew-join handling to spread the hot key's work"
      - "Add many more total reducers to the job and let the framework rebalance, since data skew resolves itself automatically"
      - "Switch the job from Spark to classic MapReduce, whose shuffle model is immune to per-key data skew by design"
      - "Remove youtube.com from the input dataset entirely so the offending hot key never reaches any reducer"
    answer: 0
    explanation: |
      Data skew is fixed by salting the hot key, pre-aggregating with combiners, or
      skew-aware joins so one reducer is not overwhelmed. Merely adding reducers does not
      help if one key dominates, MapReduce suffers skew equally, and dropping the hot key
      loses data.
    ref: "concepts.md#batch-processing-with-mapreduce-and-spark"
  - id: design-web-crawler-data-processing-046
    difficulty: advanced
    tags: [exactly-once, flink, kafka, tradeoff]
    question: |
      What do Flink checkpoints + Kafka transactions actually provide, and at what cost?
    options:
      - "True exactly-once message delivery across the network, achieved for free with no added coordination or latency cost"
      - "Exactly-once effect (via dedup + atomic commit), at the cost of transaction coordination and checkpoint overhead reducing throughput/adding latency"
      - "At-most-once processing that maintains no operator state and simply drops any record that fails on its first attempt"
      - "Guaranteed total ordering of records across all partitions simultaneously, with no throughput or latency overhead at all"
    answer: 1
    explanation: |
      These mechanisms give exactly-once *effect* through idempotent/atomic commits and
      checkpointed state, not free network delivery, and they cost coordination and
      checkpoint overhead. Exactly-once delivery over a network is not achievable, this is
      not at-most-once, and global ordering is a separate concern with its own cost.
    ref: "concepts.md#deduplication-and-idempotency-at-scale"
  - id: design-web-crawler-data-processing-047
    difficulty: advanced
    tags: [windowed-dedup, streaming, state]
    question: |
      Why can streaming deduplication only be done within a bounded window, and what is
      the consequence?
    options:
      - "Because stream processors are fundamentally incapable of storing any operator state between consecutive records"
      - "Because bounding dedup to a window makes the deduplication mathematically exact and correct for all time afterward"
      - "Because unbounded dedup state would grow forever; a duplicate arriving after the window slips through"
      - "Because applying a window to a stream automatically disables idempotency on every downstream sink it feeds"
    answer: 2
    explanation: |
      Keeping every id forever is infeasible, so dedup state is bounded to a window/TTL,
      meaning a late duplicate outside that window can escape. Streams do keep state,
      windowing does not make dedup exact forever, and it does not disable idempotency.
    ref: "concepts.md#deduplication-and-idempotency-at-scale"
  - id: design-web-crawler-data-processing-048
    difficulty: advanced
    tags: [etl, elt, compliance, scenario]
    question: |
      Raw crawled data contains PII you are legally required NOT to store in your
      analytics warehouse. Given only that constraint, which pattern is safer?
    options:
      - "ELT, because loading the raw source data first is always cheaper and the PII constraint can be handled downstream"
      - "ELT, because retaining raw PII in the warehouse is acceptable so long as a scheduled job deletes it some time later"
      - "Neither pattern matters here, because the order of transform and load has no bearing on where PII ends up stored"
      - "ETL, because you transform/scrub PII before it ever lands in the warehouse"
    answer: 3
    explanation: |
      ETL scrubs/filters PII before loading, so it never lands in the warehouse, which is
      the safer choice under that constraint. ELT loads raw PII first (the compliance
      risk), "delete later" still means it was stored, and pipeline order absolutely
      affects where PII lands.
    ref: "concepts.md#etl-versus-elt"
  - id: design-web-crawler-data-processing-049
    difficulty: advanced
    tags: [back-pressure, load-shedding, crawler]
    question: |
      Unlike an internal pipeline, a crawler cannot apply back-pressure to the external
      web. What is the correct way to handle overload against uncontrollable sources?
    options:
      - "Buffer in a durable log and, when you still can't keep up, rate-limit or load-shed low-priority URLs"
      - "Send back-pressure signals to the external web servers to force them to stop responding until your consumers catch up"
      - "Ignore the overload entirely and keep enqueuing, since the internal queues are effectively infinite and never fill up"
      - "Deliberately crash the overloaded workers so the operating system reclaims their memory and the backlog clears itself"
    answer: 0
    explanation: |
      You cannot slow the web, so you buffer in a durable log and, if that is not enough,
      rate-limit or shed low-priority work. You cannot block external servers, queues are
      not infinite (disks fill), and crashing loses progress.
    ref: "concepts.md#back-pressure-and-checkpointing"
  - id: design-web-crawler-data-processing-050
    difficulty: advanced
    tags: [partitioning, url-vs-host, tradeoff]
    question: |
      What is the primary trade-off of partitioning by full URL hash instead of by host?
    options:
      - "It improves politeness locality by keeping all of a host's URLs together on one worker with its crawl-delay timer"
      - "It balances load evenly but splits a host across workers, forcing a distributed per-host rate limiter (more coordination/latency)"
      - "It simultaneously eliminates every load hotspot and removes all cross-worker coordination from the politeness path"
      - "It makes URL deduplication impossible because the seen-set can no longer be sharded consistently across the fleet"
    answer: 1
    explanation: |
      Hashing by URL spreads load evenly but scatters a host across workers, so politeness
      now needs a shared/distributed rate limiter with extra coordination and latency. It
      worsens (not improves) politeness locality, does not magically remove coordination,
      and does not break dedup.
    ref: "concepts.md#distributed-crawler-workers-and-coordination"
  - id: design-web-crawler-data-processing-051
    difficulty: advanced
    tags: [freshness, adaptive, state-cost, tradeoff]
    question: |
      Adaptive (Poisson/EWMA) recrawl gives the best freshness-per-fetch. What is its
      main cost compared to a uniform policy?
    options:
      - "It requires ignoring robots.txt, because estimating change rates forces refetches that breach the Crawl-delay directive"
      - "It always ends up crawling strictly fewer total pages than a uniform policy would over the same crawl budget"
      - "It must store and continuously update per-URL change statistics for billions of URLs"
      - "It cannot use conditional GET, because per-URL change estimates are incompatible with If-Modified-Since headers"
    answer: 2
    explanation: |
      Adaptive recrawl needs per-URL change-rate estimates maintained for billions of
      URLs, a significant state cost, in exchange for better freshness efficiency. It does
      not require ignoring robots.txt, does not inherently crawl fewer pages, and can
      combine with conditional GET.
    ref: "concepts.md#freshness-and-recrawl-policies"
  - id: design-web-crawler-data-processing-052
    difficulty: advanced
    tags: [worker-failure, at-least-once, idempotency]
    question: |
      A crawler worker crashes mid-fetch. To recover correctly with host-partitioned
      workers, which set of choices is right?
    options:
      - "Permanently drop the crashed worker's assigned hosts from the frontier so their in-flight URLs can never be duplicated"
      - "Configure the queue for guaranteed exactly-once delivery so that no re-queue of in-flight URLs and no idempotency is needed"
      - "Pause the entire distributed crawl and hold all other workers idle until the failed worker is manually restarted by an operator"
      - "Reassign the host partition (consistent hashing minimizes churn), re-queue in-flight URLs, and rely on idempotent workers because delivery is at-least-once"
    answer: 3
    explanation: |
      On crash you reassign the partition (consistent hashing limits remap), re-queue
      in-flight URLs, and make workers idempotent since re-queue implies at-least-once.
      Dropping hosts loses coverage, exactly-once delivery is not achievable, and pausing
      the whole crawl is needless and unavailable.
    ref: "concepts.md#distributed-crawler-workers-and-coordination"
  - id: design-web-crawler-data-processing-053
    difficulty: advanced
    tags: [lake-vs-warehouse, tradeoff, scenario]
    question: |
      A team dumps all crawl output into a lake with no catalog, schema, or governance.
      Six months later nobody can find or trust anything. What failure is this and what
      addresses it?
    options:
      - "A 'data swamp'; add cataloging, schema enforcement, and governance (e.g., a lakehouse table format)"
      - "A warehouse vendor lock-in problem; migrate the entire corpus off the cloud onto an on-prem Hadoop cluster to regain control"
      - "A back-pressure failure in the ingest path; add many more downstream consumers so the lake drains fast enough to stay usable"
      - "A Bloom filter false-positive problem in the seen-set; lower the configured false-positive rate to make the data findable again"
    answer: 0
    explanation: |
      An ungoverned lake degrades into a data swamp; cataloging, schema enforcement, and
      governance (lakehouse formats like Iceberg/Delta) fix it. It is not warehouse
      lock-in, not back-pressure, and not a Bloom-filter issue.
    ref: "concepts.md#data-lake-data-warehouse-and-lakehouse"
  - id: design-web-crawler-data-processing-054
    difficulty: advanced
    tags: [batch-vs-stream, cost, tradeoff]
    question: |
      A metric only needs daily accuracy over huge historical data, yet a team runs it as
      an always-on streaming job. What is the primary downside?
    options:
      - "Streaming engines are fundamentally incapable of computing metrics over large historical datasets under any configuration"
      - "You pay for an always-on cluster plus streaming complexity (state, watermarks, exactly-once) for latency you don't need"
      - "Streaming produces strictly less accurate aggregate results than batch by definition, regardless of how it is configured"
      - "It violates robots.txt, because always-on streaming jobs refetch source pages faster than the Crawl-delay directive permits"
    answer: 1
    explanation: |
      Using streaming for a latency-insensitive daily metric wastes an always-on cluster
      and adds needless complexity (state, watermarks, exactly-once effort). Streaming can
      compute such metrics and is not inherently less accurate; robots.txt is unrelated.
    ref: "concepts.md#batch-versus-stream-for-the-same-problem"
  - id: design-web-crawler-data-processing-055
    difficulty: advanced
    tags: [content-dedup, simhash, threshold, tradeoff]
    question: |
      When using SimHash with a Hamming-distance threshold for near-duplicate detection,
      what is the fundamental tuning trade-off?
    options:
      - "There is no trade-off; any Hamming-distance threshold you pick catches every real near-duplicate while never merging two genuinely distinct pages"
      - "The threshold only affects how much storage the fingerprint index consumes, and has no bearing on detection accuracy or the false-positive rate"
      - "A larger threshold catches more near-dups but raises false positives (distinct pages merged); a smaller one misses real near-dups"
      - "SimHash thresholds only tune the per-host politeness delay between fetches, not which pages are ever flagged as near-duplicates"
    answer: 2
    explanation: |
      The Hamming threshold trades recall against precision: too large merges distinct
      pages (false positives), too small misses genuine near-duplicates (false negatives).
      There is a real trade-off, it affects accuracy not just storage, and it has nothing
      to do with politeness.
    ref: "concepts.md#deduplication-with-bloom-filters-and-content-fingerprinting"
  - id: design-web-crawler-data-processing-056
    difficulty: advanced
    tags: [checkpointing, chandy-lamport, flink]
    question: |
      How does Flink achieve consistent exactly-once state snapshots without stopping the
      stream?
    options:
      - "It pauses all processing across every operator and copies the entire cluster's memory to durable storage before resuming the stream"
      - "It writes every single record synchronously to disk as it arrives, so the on-disk log itself doubles as the recovery snapshot"
      - "It relies on the downstream database's foreign-key constraints to reject any inconsistent state that a partial failure might produce"
      - "It injects barriers into the stream (distributed snapshots / Chandy-Lamport); on failure it restores state and rewinds source offsets"
    answer: 3
    explanation: |
      Flink uses barrier-based distributed snapshots (Chandy-Lamport style): barriers flow
      with the data, state is snapshotted consistently, and on failure state is restored
      with source offsets rewound. It does not stop the world, does not sync every record
      to disk, and does not depend on DB foreign keys.
    ref: "concepts.md#back-pressure-and-checkpointing"
  - id: design-web-crawler-data-processing-057
    difficulty: advanced
    tags: [robots, failure-modes]
    question: |
      When a host's robots.txt returns a 5xx error or is temporarily unreachable, what is
      the most defensible crawler behavior?
    options:
      - "Treat it conservatively (temporarily disallow) or reuse the last cached copy, rather than assuming full access"
      - "Assume that a missing ruleset means everything is allowed and immediately crawl the host as aggressively as bandwidth permits"
      - "Permanently add the host to a global blocklist so it is never fetched again, even long after its robots.txt recovers"
      - "Ignore robots.txt entirely for that host from then on, treating the transient fetch error as a permanent opt-out of all crawl rules"
    answer: 0
    explanation: |
      On robots 5xx/unreachable, the safe behavior is conservative: temporarily back off or
      reuse the last known-good cached copy. Assuming full access risks violating owner
      intent, permanent blocklisting is overkill, and ignoring robots entirely is unsafe
      and unethical.
    ref: "concepts.md#robotstxt-and-politeness-enforcement"
  - id: design-web-crawler-data-processing-058
    difficulty: advanced
    tags: [frontier, storage, scale]
    question: |
      The frontier holds tens of billions of URLs. How is it stored and made fast enough?
    options:
      - "Entirely in the RAM of one large machine, since tens of billions of compact URL keys comfortably fit within a few hundred gigabytes of memory"
      - "On disk / in a distributed store (RocksDB, sharded KV, or partitioned log), with only the heads of active back queues hot in RAM"
      - "In the very same object store that holds the raw HTML, written as one small individual object per pending URL for durability"
      - "It isn't persisted at all; the full frontier is recomputed from the seed list and stored link graph at the start of every crawl cycle"
    answer: 1
    explanation: |
      The frontier is too large for RAM, so it lives on disk/distributed storage with only
      the active back-queue heads kept hot. It won't fit in one machine's RAM, one object
      per URL in blob storage is a small-object nightmare, and URLs cannot be recomputed
      from nothing.
    ref: "concepts.md#url-frontier-design-politeness-and-priority"
  - id: design-web-crawler-data-processing-059
    difficulty: advanced
    tags: [object-store, tradeoff, warc]
    question: |
      WARC-packing many pages into large files is great for batch reprocessing but has
      what downside for serving a single random page?
    options:
      - "It corrupts individual pages, because packing many documents into one container leaves no reliable way to delimit where each page ends"
      - "It prevents compression, since the WARC container format is only able to store its bundled pages as uncompressed raw bytes on disk"
      - "Read amplification: you must read a large file to extract one page, making random single-page reads costly"
      - "It makes writes impossible, because a WARC file is sealed as strictly read-only the moment its very first page has been appended to it"
    answer: 2
    explanation: |
      Packing causes read amplification: fetching one page means reading into a big file,
      which is inefficient for random single-page access even though it is great for bulk
      scans. It does not corrupt pages, prevent compression, or block writes.
    ref: "concepts.md#content-storage-and-the-processing-handoff"
  - id: design-web-crawler-data-processing-060
    difficulty: advanced
    tags: [spark, memory, tradeoff, skew]
    question: |
      What is the main risk of Spark's in-memory model on a skewed dataset, and how do
      you view the trade-off vs MapReduce?
    options:
      - "There is no risk at all; Spark's in-memory execution model is strictly superior to MapReduce in every dimension, even on badly skewed partitions"
      - "Spark loses all intermediate data on any node failure because, unlike MapReduce, it keeps everything in memory and provides no fault-tolerance mechanism"
      - "Classic MapReduce is actually faster than Spark for iterative machine-learning jobs, because writing each stage to disk avoids costly memory management"
      - "OOM/spill risk on skewed partitions; Spark trades memory (cost and OOM risk) for speed, while MapReduce trades speed for cheaper, disk-based robustness"
    answer: 3
    explanation: |
      In-memory Spark can OOM or spill on skewed partitions; it trades memory cost/risk for
      speed, whereas MapReduce trades speed for cheap disk-based robustness. Spark is not
      universally superior, it has lineage-based fault tolerance, and it is faster (not
      slower) than MapReduce for iterative ML.
    ref: "concepts.md#batch-processing-with-mapreduce-and-spark"
  - id: design-web-crawler-data-processing-061
    difficulty: expert
    tags: [frontier, priority, freshness, judgment, scenario]
    question: |
      You run a news-focused crawler: a few thousand high-value publisher hosts must stay
      seconds-to-minutes fresh, while a long tail of blogs can be days stale, and you must
      remain polite. Which frontier + ingestion design is most appropriate?
    options:
      - "Mercator front queues weighting publisher priority high, host-keyed back queues for politeness, plus event-driven signals (sitemaps lastmod / WebSub) to trigger near-real-time recrawl of publishers"
      - "A single global FIFO frontier crawled strictly round-robin, so every host from top news publishers to tiny blogs receives identical treatment and recrawl cadence"
      - "Pure proportional recrawl applied uniformly to every host, refetching each one purely on its raw observed change frequency with no publisher priority or push signals"
      - "Store every fetched page in a data warehouse first and run an hourly scheduled query to detect which publisher pages have changed since the last batch"
    answer: 0
    explanation: |
      The right design combines priority (front queues favor publishers), politeness
      (host-keyed back queues), and push/event signals (sitemap lastmod, WebSub) for
      near-real-time recrawl of high-value hosts. A flat FIFO ignores priority, pure
      proportional wastes budget on churny pages and lacks a push path, and warehouse-first
      hourly polling misses the seconds-to-minutes SLA.
    ref: "concepts.md#freshness-and-recrawl-policies"
  - id: design-web-crawler-data-processing-062
    difficulty: expert
    tags: [dedup, bloom, kv, judgment, scenario]
    question: |
      You are crawling a legal-archive corpus where silently skipping any real page is
      unacceptable, but RAM is limited. Which URL-seen design best fits?
    options:
      - "A plain in-RAM hash set holding every full URL string, simply accepting the many terabytes of memory that billions of stored keys demand"
      - "A Bloom filter as a fast pre-check backed by an exact sharded KV store, consulted only on Bloom 'maybe present' hits"
      - "A Bloom filter used entirely on its own, tuned down to a 1% false-positive rate and accepting that a few real pages get silently skipped"
      - "No URL-level dedup at all, relying solely on downstream content fingerprinting to catch and discard any repeated pages after they are fetched"
    answer: 1
    explanation: |
      When missing a page is unacceptable but RAM is limited, use the Bloom filter as a
      cheap pre-filter and confirm 'maybe present' hits against an exact sharded KV store,
      eliminating false-positive skips at modest disk cost. A full RAM hash set blows the
      memory budget, Bloom-alone accepts silent skips (disallowed here), and no URL dedup
      wastes enormous crawl budget.
    ref: "concepts.md#deduplication-with-bloom-filters-and-content-fingerprinting"
  - id: design-web-crawler-data-processing-063
    difficulty: expert
    tags: [lambda, kappa, unified, judgment]
    question: |
      Your org is tired of keeping Lambda's batch and speed codebases in sync, but a rare
      backfill must reprocess 2 years of data that exceeds your 30-day log retention. What
      is the most pragmatic modern approach?
    options:
      - "Keep classic Lambda forever and simply accept that manually keeping the separate batch and speed codebases in sync is an unavoidable cost at this scale"
      - "Switch to strict Kappa and extend Kafka log retention to a full 2 years across every topic, regardless of the substantial storage cost, so replay always covers backfills"
      - "Adopt a unified engine (e.g., Beam/Flink/Spark Structured Streaming) with one codebase for stream, and use a batch 'escape hatch' reading archived data for the occasional 2-year backfill"
      - "Abandon the streaming layer entirely and run every computation as a single nightly batch job, accepting that no result is ever fresher than last night's run"
    answer: 2
    explanation: |
      A unified engine gives one codebase for streaming while a batch escape hatch reads
      archived storage for rare long backfills that exceed log retention, the current
      pragmatic norm. Classic Lambda keeps the sync pain, retaining 2 years in Kafka just
      for a rare backfill is wasteful, and going all-batch loses the low-latency path.
    ref: "concepts.md#lambda-architecture-versus-kappa-architecture"
  - id: design-web-crawler-data-processing-064
    difficulty: expert
    tags: [politeness, throughput, judgment, capacity]
    question: |
      Politeness caps you to ~1 request/sec per host. You must sustain ~770 pages/sec at
      peak. What is the correct way to reason about achieving throughput?
    options:
      - "Crawl a single popular host far faster than 1 request/sec by ignoring its politeness limit, since one high-bandwidth host can supply the entire 770 pages/sec alone"
      - "Add many more concurrent workers all pointed at the same busy host to multiply its effective fetch rate well beyond the one-request-per-second politeness ceiling"
      - "Increase the average page size the crawler downloads so that far fewer individual HTTP requests are needed to reach the required aggregate throughput"
      - "Scale by breadth: keep ~800+ distinct hosts in flight concurrently, since per-host rate is capped; throughput comes from parallel hosts, not faster per-host fetching"
    answer: 3
    explanation: |
      Because per-host rate is bounded by politeness, aggregate throughput must come from
      crawling many hosts in parallel (~800+ concurrently for 770/sec at ~1/host/sec).
      Ignoring politeness on one host gets you banned, piling workers on one host still
      violates its limit, and larger pages do not increase page count.
    ref: "concepts.md#requirements-and-capacity-estimation"
  - id: design-web-crawler-data-processing-065
    difficulty: expert
    tags: [idempotency, exactly-once, tradeoff, judgment]
    question: |
      A high-throughput analytics pipeline over crawl events can tolerate approximate
      counts but must not fall over on cost. Which correctness strategy is most
      appropriate?
    options:
      - "At-least-once delivery with idempotent/upsert sinks (or windowed dedup), accepting minimal duplicate risk to preserve throughput and cost"
      - "Full exactly-once semantics enforced through a two-phase transaction on every individual write, accepting whatever throughput and latency cost that coordination imposes"
      - "At-most-once delivery that proactively drops incoming events whenever load spikes, guaranteeing no duplicate is ever counted even though some events are lost outright"
      - "A single global lock that serializes every write across the whole pipeline, one at a time, to guarantee perfectly consistent counts under all load conditions"
    answer: 0
    explanation: |
      When approximate counts are acceptable and cost matters, at-least-once plus idempotent
      upserts (or windowed dedup) is the pragmatic choice, giving near-exact results without
      transaction overhead. Full exactly-once sacrifices throughput/cost needlessly,
      at-most-once loses data, and a global lock destroys throughput.
    ref: "concepts.md#deduplication-and-idempotency-at-scale"
  - id: design-web-crawler-data-processing-066
    difficulty: expert
    tags: [failure-mode, does-not-tolerate, judgment]
    question: |
      A crawler partitions strictly by host and keeps each host's robots cache and
      crawl-delay timer ONLY in that worker's local memory (no persistence). Which failure
      does this design NOT tolerate well?
    options:
      - "A single slow-responding external web server, which is already handled gracefully by per-request connection and read timeouts that abort the stalled fetch and move on"
      - "A worker crash: the in-memory robots cache and per-host politeness timers are lost, risking re-fetching robots and violating crawl-delay on restart until state is rebuilt"
      - "A Bloom-filter false positive on the seen-set, which at worst causes the crawler to silently skip a single page it had in fact never actually fetched before"
      - "A malformed or truncated HTML page, which the parser can simply catch, log, and skip without disrupting the rest of that worker's ongoing fetch pipeline"
    answer: 1
    explanation: |
      Keeping robots cache and crawl-delay timers only in volatile local memory means a
      worker crash loses that state, so on restart/reassignment it may re-fetch robots and
      briefly violate crawl-delay. Slow servers (timeouts), Bloom false positives (skip),
      and malformed HTML (parser skip) are all otherwise handled; volatile politeness state
      is the real gap.
    ref: "concepts.md#distributed-crawler-workers-and-coordination"
  - id: design-web-crawler-data-processing-067
    difficulty: expert
    tags: [back-pressure, checkpoint, side-effects, tradeoff]
    question: |
      A stream job with external side effects (writing to a downstream API) uses very
      infrequent checkpoints for throughput. After a crash, what is the compounded
      consequence?
    options:
      - "Nothing meaningful; infrequent checkpoints carry no downside at all, because on recovery the job simply resumes precisely from the last record it processed"
      - "The job silently discards all of its accumulated operator state and restarts completely empty, yet it produces no duplicate downstream writes whatsoever"
      - "A large replay window on recovery, and because of at-least-once side effects, many more duplicate external writes to dedup/reconcile"
      - "Checkpoint frequency only influences the job's end-to-end latency and never has any effect on how many duplicate external writes appear after a recovery"
    answer: 2
    explanation: |
      Infrequent checkpoints mean a big replay window on recovery; combined with
      at-least-once external side effects, that replay produces many duplicate downstream
      writes you must dedup/reconcile. It is not free, it does not silently discard state,
      and checkpoint frequency directly affects how much gets reprocessed (hence
      duplicates).
    ref: "concepts.md#back-pressure-and-checkpointing"
  - id: design-web-crawler-data-processing-068
    difficulty: expert
    tags: [storage, tiering, judgment, scenario]
    question: |
      You need cheap durable storage for 1 PB/year of raw HTML (mostly read in big batch
      scans) AND fast point lookups for recrawl scheduling by URL. Which layout is best?
    options:
      - "Put absolutely everything, both the petabytes of raw HTML and all the recrawl metadata, into a single large relational database with one indexed row per page"
      - "Store both the raw HTML and the recrawl metadata as billions of tiny individual objects in S3, one small object per page, and index them purely by URL key"
      - "Keep everything, the raw HTML plus all recrawl scheduling metadata, resident in worker RAM at all times so that every scan and point lookup is served at memory speed"
      - "Raw HTML in object storage packed as WARC (batch-friendly), and metadata/link graph in a columnar/KV store (Bigtable/HBase/Cassandra) for fast point lookups"
    answer: 3
    explanation: |
      Split by access pattern: bulk-scanned raw HTML goes to object storage as WARC, while
      point-lookup metadata/link graph goes to a columnar/KV store. One relational DB won't
      hold a PB economically, billions of tiny objects hurt object stores, and a PB cannot
      live in RAM.
    ref: "concepts.md#content-storage-and-the-processing-handoff"
  - id: design-web-crawler-data-processing-069
    difficulty: expert
    tags: [batch-vs-stream, judgment, both]
    question: |
      A search company needs (a) an authoritative daily inverted-index rebuild and (b)
      near-real-time index updates for breaking news, sharing most transformation logic.
      What is the strongest design answer?
    options:
      - "A unified engine expressing the shared transform once, run in batch mode for the daily rebuild and streaming mode for real-time updates (or Kappa with replay for the rebuild)"
      - "Two totally separate teams each owning a separate codebase, one for the batch rebuild and one for the stream, with no shared transformation logic between them at all"
      - "Stream absolutely everything through a single real-time pipeline and delete the authoritative daily inverted-index rebuild entirely as redundant duplicated work"
      - "Batch every computation on a fixed hourly schedule and simply accept that breaking-news index updates can lag the live web by up to a full hour behind reality"
    answer: 0
    explanation: |
      Sharing most logic argues for a unified engine (one transform, run as batch or stream)
      or Kappa with replay, avoiding duplicated code while meeting both SLAs. Two separate
      codebases recreate Lambda's sync burden, stream-only drops a cheap authoritative
      rebuild, and hourly batch misses the breaking-news latency need.
    ref: "concepts.md#batch-versus-stream-for-the-same-problem"
  - id: design-web-crawler-data-processing-070
    difficulty: expert
    tags: [traps, robustness, judgment, scenario]
    question: |
      A high-value e-commerce host legitimately has 50M deep catalog URLs, but you also
      must protect against traps. A blanket max-URLs-per-host cap of 100k would miss real
      products. What is the best approach?
    options:
      - "Apply the blanket 100k-URL-per-host cap uniformly to every host including this one, treating the millions of unreached real products as acceptable collateral damage"
      - "Layer trap heuristics (parameter-explosion detection, content dedup, depth limits) and raise/curated per-host caps for trusted high-value hosts, rather than a single blanket cap"
      - "Remove all per-host URL caps globally so that no legitimate product page is ever missed, accepting whatever trap exposure that blanket decision reopens across the fleet"
      - "Disable content deduplication entirely so that every one of the host's catalog pages is fetched and kept, guaranteeing full product coverage at any storage cost"
    answer: 1
    explanation: |
      The right answer is nuanced: keep trap heuristics (param-explosion detection, content
      dedup, depth limits) but allow higher/curated caps for trusted high-value hosts. A
      uniform low cap misses real products, removing all caps reopens trap risk, and
      disabling dedup floods storage with duplicates.
    ref: "concepts.md#crawler-traps-and-robustness"
  - id: design-web-crawler-data-processing-071
    difficulty: expert
    tags: [etl, elt, lakehouse, judgment]
    question: |
      A cloud-native team wants to keep raw crawl data for future re-transformation,
      evolve schemas frequently, and run SQL transforms with elastic compute, with no
      strict PII constraint. Which pattern fits best and why?
    options:
      - "ETL into a rigid, strictly-modeled warehouse, discarding the raw crawl data immediately after loading in order to save on long-term storage costs"
      - "A stream-only pipeline that stores no raw crawl data at all and offers no ability whatsoever to reprocess or re-transform history once events have passed through"
      - "ELT into a lakehouse: load raw first, transform with SQL (e.g., dbt) inside elastic compute, retaining raw for re-transformation as schemas evolve"
      - "An on-prem Hadoop cluster running ETL with a fixed set of nightly batch transforms only, offering no elastic compute and no schema-evolution flexibility at all"
    answer: 2
    explanation: |
      ELT into a lakehouse keeps raw for re-transformation, embraces schema evolution, and
      uses elastic in-warehouse/lake SQL compute (dbt), matching every stated need. Rigid
      ETL discards raw and resists schema change, stream-only forgoes reprocessing, and
      on-prem fixed-transform Hadoop contradicts the cloud-native, evolving-schema goals.
    ref: "concepts.md#etl-versus-elt"
  - id: design-web-crawler-data-processing-072
    difficulty: expert
    tags: [capacity, bandwidth, estimation]
    question: |
      At ~385 pages/sec average and ~500 KB/page, roughly what sustained ingest bandwidth
      must the fetch fleet and storage handle on average?
    options:
      - "About 1.5 Mbps (~190 KB/sec)"
      - "About 5 GB/sec (~40 Gbps)"
      - "About 20 KB/sec (~160 Kbps)"
      - "About 190 MB/sec (~1.5 Gbps)"
    answer: 3
    explanation: |
      385 pages/sec * 500 KB ≈ 192 MB/sec, i.e., roughly 1.5 Gbps sustained average (higher
      at 2x peak). 1.5 Mbps and 20 KB/sec are orders of magnitude too low; 5 GB/sec is
      ~25x too high for the average.
    ref: "concepts.md#requirements-and-capacity-estimation"
  - id: design-web-crawler-data-processing-073
    difficulty: intermediate
    tags: [seeds, sitemaps, freshness]
    question: |
      Beyond seed URLs, what is a polite, high-value source of URLs and freshness hints
      that site owners publish deliberately?
    options:
      - "Sitemaps (with lastmod timestamps) and the Sitemap: directive in robots.txt"
      - "Brute-forcing guessed URLs by trying common path patterns for a 200"
      - "Scraping the internal Bloom filters of rival search engines"
      - "Draining the crawler's own dead-letter queue of failed fetches"
    answer: 0
    explanation: |
      Sitemaps list URLs and often include lastmod timestamps, and robots.txt can point to
      them via the Sitemap: directive, giving a polite seed and freshness source. Brute-force
      guessing is impolite and wasteful, competitors' internal state is inaccessible, and
      the dead-letter queue holds failures, not new discoveries.
    ref: "concepts.md#freshness-and-recrawl-policies"
  - id: design-web-crawler-data-processing-074
    difficulty: intermediate
    tags: [serving-layer, lambda]
    question: |
      In Lambda architecture, what is the role of the serving layer?
    options:
      - "It fetches pages directly from the web and feeds them into the batch layer's master dataset"
      - "It stores outputs from both batch and speed layers and answers queries by merging precomputed views"
      - "It replaces the batch layer entirely so only the streaming speed layer ever recomputes results"
      - "It enforces per-host politeness and crawl-delay timing on the crawler fetch fleet"
    answer: 1
    explanation: |
      The serving layer holds batch and speed-layer outputs and answers queries by merging
      the accurate-but-late batch views with the fast-but-approximate realtime views. It
      does not crawl, does not replace the batch layer, and has nothing to do with crawler
      politeness.
    ref: "concepts.md#lambda-architecture-versus-kappa-architecture"
  - id: design-web-crawler-data-processing-075
    difficulty: advanced
    tags: [mercator, adaptive-politeness]
    question: |
      Mercator's adaptive politeness rule waits how long before the next request to a host,
      and why?
    options:
      - "A fixed 60 seconds between every request, exactly as Koster's original 1993 guideline mandated"
      - "Zero added delay, deferring entirely to whatever Crawl-delay the host's robots.txt declares"
      - "Roughly 10x the time the last download took, so slow servers automatically get more breathing room"
      - "A uniformly random delay drawn from a fixed range, independent of how fast the server responded"
    answer: 2
    explanation: |
      Mercator waits about 10x the previous download time, so a slow-responding server
      automatically receives proportionally longer gaps, adapting politeness to server
      load. Fixed 60s is Koster's older static suggestion, zero delay ignores politeness,
      and a purely random delay does not adapt to observed server latency.
    ref: "concepts.md#url-frontier-design-politeness-and-priority"
  - id: design-web-crawler-data-processing-076
    difficulty: advanced
    tags: [selection-policy, pagerank, prioritization]
    question: |
      Since no crawler indexes the entire web, the selection policy prioritizes which pages
      to fetch. Which prioritization signals are commonly used?
    options:
      - "Strict alphabetical ordering of the URL strings, fetching a.example.com before z.example.com"
      - "The dominant background color and visual theme of each website's rendered landing page"
      - "The chronological order in which an engineer manually typed the URLs into the seed list"
      - "Importance signals like PageRank/backlink count, freshness, and business value, biasing high-value pages earlier"
    answer: 3
    explanation: |
      Selection/prioritization uses importance signals (PageRank, backlink count,
      freshness, business value) to fetch high-value pages first under a limited budget.
      Alphabetical order, visual appearance, and manual typing order are not meaningful
      importance signals.
    ref: "concepts.md#url-frontier-design-politeness-and-priority"
