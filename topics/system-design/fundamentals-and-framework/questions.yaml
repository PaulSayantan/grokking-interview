topic: "System Design Fundamentals and Interview Framework"
domain: system-design
topic_slug: fundamentals-and-framework
version: 1
questions:
- id: fundamentals-and-framework-001
  difficulty: beginner
  tags: [requirements, functional, non-functional]
  question: |
    In a system design interview, which of the following is a NON-functional
    requirement rather than a functional one?
  options:
  - "The home timeline must load with a p99 latency under 200 ms"
  - "Users can post a tweet and follow other users"
  - "Users can upload a profile photo"
  - "Users can search for other accounts by handle"
  answer: 0
  explanation: |
    Latency targets, availability, scale, and consistency are non-functional requirements
    (quality attributes) that drive architecture. Posting, following, uploading, and search
    are functional requirements (features). NFRs, not FRs, dictate the interesting design
    decisions like caching and replication.
  ref: "concepts.md#functional-and-non-functional-requirements"

- id: fundamentals-and-framework-002
  difficulty: beginner
  tags: [requirements, scoping]
  question: |
    Why do experienced candidates spend the first several minutes explicitly listing and
    confirming requirements before drawing any architecture?
  options:
  - "It is a formality that interviewers ignore"
  - "It demonstrates knowledge of specific database products"
  - "Non-functional requirements such as scale, latency, and consistency determine which architecture is even correct"
  - "It lets them avoid doing capacity estimation later"
  answer: 2
  explanation: |
    Requirements (especially NFRs) decide the architecture: a system with 'stale reads OK'
    can use caching and replication (AP), while 'balance must be exact' forces CP with
    different trade-offs. It is not a formality, it does not replace estimation, and it is
    not about naming products.
  ref: "concepts.md#functional-and-non-functional-requirements"

- id: fundamentals-and-framework-003
  difficulty: intermediate
  tags: [requirements, consistency, cap]
  question: |
    The interviewer says: "It is fine if a follower sees a new post a few seconds late." What
    does this requirement most directly permit you to do in your design?
  options:
  - "Enforce synchronous cross-region replication for every write"
  - "Require a distributed transaction across all follower shards"
  - "Use a single-node database to guarantee strong consistency"
  - "Adopt eventual consistency with caching and asynchronous fan-out to favor availability and latency"
  answer: 3
  explanation: |
    Permission for stale reads means eventual consistency is acceptable, unlocking caching,
    read replicas, and async fan-out (an AP-leaning design) for better availability and
    latency. Synchronous cross-region replication and distributed transactions add latency
    you were just told you do not need; a single node harms scale and availability.
  ref: "concepts.md#functional-and-non-functional-requirements"

- id: fundamentals-and-framework-004
  difficulty: beginner
  tags: [estimation, qps]
  question: |
    A service receives 8.64 million requests per day, evenly distributed. Approximately what
    is the average QPS?
  options:
  - "10 QPS"
  - "100 QPS"
  - "1,000 QPS"
  - "100,000 QPS"
  answer: 1
  explanation: |
    There are ~86,400 seconds in a day (approximated as ~100K for quick math). 8.64M / 86,400
    = 100 QPS. Using the round ~100K: 8.64M / 100K ≈ 86, still ~100 QPS order of magnitude.
  ref: "concepts.md#back-of-the-envelope-estimation"

- id: fundamentals-and-framework-005
  difficulty: beginner
  tags: [estimation, powers-of-two]
  question: |
    In back-of-the-envelope estimation, 2^30 is approximately equal to which value?
  options:
  - "One thousand (KB)"
  - "One million (MB)"
  - "One billion (GB)"
  - "One trillion (TB)"
  answer: 2
  explanation: |
    2^10 ~ thousand (KB), 2^20 ~ million (MB), 2^30 ~ billion (GB), 2^40 ~ trillion (TB).
    Memorizing these powers lets you convert scale to storage sizing instantly.
  ref: "concepts.md#back-of-the-envelope-estimation"

- id: fundamentals-and-framework-006
  difficulty: intermediate
  tags: [estimation, peak-qps]
  question: |
    You compute an average of 4,000 write QPS. With no other information, what is the most
    reasonable peak QPS to design for?
  options:
  - "Roughly 8,000 QPS, using a typical ~2x peak-to-average factor"
  - "Exactly 4,000 QPS, since averages already include peaks"
  - "400 QPS, because peaks are lower than averages"
  - "4 million QPS, to be maximally safe"
  answer: 0
  explanation: |
    Peak traffic is typically 2-10x average; a ~2x factor is a sensible default absent other
    data, giving ~8,000 peak QPS. The average is not the peak, peaks are not lower than
    averages, and 1000x over-provisioning wastes cost and signals poor estimation.
  ref: "concepts.md#back-of-the-envelope-estimation"

- id: fundamentals-and-framework-007
  difficulty: intermediate
  tags: [estimation, storage]
  question: |
    A system ingests 400M records/day at ~1 KB each and keeps 3 replicas. Approximately how
    much raw storage does one year require?
  options:
  - "~440 GB"
  - "~44 TB"
  - "~44 PB"
  - "~440 TB"
  answer: 3
  explanation: |
    400M x 1 KB = 400 GB/day. x365 ~ 146 TB/year for one copy. x3 replicas ~ 440 TB/year.
    440 GB and 44 TB are off by 1000x and ~10x; 44 PB is 100x too large.
  ref: "concepts.md#back-of-the-envelope-estimation"

- id: fundamentals-and-framework-008
  difficulty: advanced
  tags: [estimation, cache, memory]
  question: |
    Daily reads touch ~100 GB of distinct data. Applying the 80/20 rule for a hot-set cache,
    what cache capacity is a reasonable starting estimate, and why?
  options:
  - "100 GB, because you must cache everything to get a good hit rate"
  - "~20 GB, because roughly 20% of the data serves ~80% of reads (the hot set)"
  - "1 GB, because caches are always tiny"
  - "300 GB, to include 3x replication of the full dataset"
  answer: 1
  explanation: |
    The 80/20 heuristic says ~20% of data is hot and serves most reads, so ~20 GB captures the
    bulk of the benefit cheaply. Caching everything defeats the purpose (cost), 1 GB is
    arbitrary, and replicating the full dataset in cache is neither necessary nor the point.
  ref: "concepts.md#back-of-the-envelope-estimation"

- id: fundamentals-and-framework-009
  difficulty: intermediate
  tags: [estimation, bandwidth]
  question: |
    A read-heavy API serves 80,000 read QPS, each response ~1 KB. What is the approximate
    outbound bandwidth, and what design conclusion follows?
  options:
  - "~80 MB/s; large responses or media would push you toward a CDN and horizontal fan-out"
  - "~80 KB/s; a single server easily handles it"
  - "~80 GB/s; you must go multi-region immediately"
  - "~8 MB/s; bandwidth is never a concern at this scale"
  answer: 0
  explanation: |
    80,000 x 1 KB = 80 MB/s of egress for text. That is manageable but rises sharply with
    media, motivating CDNs and horizontal scaling. It is not KB/s (1000x low) nor GB/s (1000x
    high), and bandwidth absolutely can be a bottleneck for media-heavy reads.
  ref: "concepts.md#back-of-the-envelope-estimation"

- id: fundamentals-and-framework-010
  difficulty: beginner
  tags: [latency-numbers, memory-vs-disk]
  question: |
    Ordering by typical latency from fastest to slowest, which sequence is correct?
  options:
  - "Disk seek < main memory reference < L1 cache < cross-continent round trip"
  - "Cross-continent round trip < SSD random read < main memory reference < L1 cache"
  - "L1 cache reference < main memory reference < SSD random read < cross-continent round trip"
  - "Main memory reference < L1 cache reference < disk seek < SSD random read"
  answer: 2
  explanation: |
    L1 (~0.5 ns) < RAM (~100 ns) < SSD random 4K (~150 us) < cross-continent RTT (~150 ms).
    The other orderings scramble the fundamental hierarchy: cache < memory < SSD < disk <
    network < cross-region.
  ref: "concepts.md#latency-numbers-every-engineer-should-know"

- id: fundamentals-and-framework-011
  difficulty: intermediate
  tags: [latency-numbers, ratios]
  question: |
    Roughly how much faster is a main-memory reference (~100 ns) than a random read from SSD
    (~150 us)?
  options:
  - "About 15x faster"
  - "About 150x faster"
  - "About the same speed"
  - "About 1,500x faster"
  answer: 3
  explanation: |
    150 us = 150,000 ns; 150,000 / 100 = 1,500. RAM is roughly 1,000-1,500x faster than SSD
    random access, which is the core justification for in-memory caching.
  ref: "concepts.md#latency-numbers-every-engineer-should-know"

- id: fundamentals-and-framework-012
  difficulty: intermediate
  tags: [latency-numbers, cross-region]
  question: |
    Your latency budget is a p99 of 200 ms. Why is a synchronous cross-continent round trip
    (~150 ms) dangerous within a single request?
  options:
  - "It uses too much CPU on the client"
  - "A single such round trip consumes most of the budget, so any additional work risks a breach"
  - "Cross-continent round trips are actually faster than intra-datacenter ones"
  - "It only matters for write requests, never reads"
  answer: 1
  explanation: |
    One ~150 ms cross-continent RTT leaves only ~50 ms for everything else, so it easily blows
    a 200 ms p99. This motivates keeping chatty request/response in-region and using edge/CDN.
    It is not a CPU issue, cross-continent is far slower than intra-DC (~0.5 ms), and it
    affects reads and writes alike.
  ref: "concepts.md#latency-numbers-every-engineer-should-know"

- id: fundamentals-and-framework-013
  difficulty: advanced
  tags: [latency-numbers, sequential-vs-random]
  question: |
    Why do write-optimized storage engines (LSM-trees, Kafka logs) turn random writes into
    sequential appends?
  options:
  - "Sequential writes eliminate the need for any replication"
  - "Random I/O is faster but harder to program"
  - "Sequential I/O is dramatically faster than random I/O on both HDD and SSD, raising throughput"
  - "It is purely to save disk space, not for performance"
  answer: 2
  explanation: |
    Sequential access massively outperforms random access (a disk seek alone is ~10 ms), so
    append-only/log-structured designs achieve high write throughput. Random is not faster,
    it does not remove the need for replication, and the primary motive is throughput, not
    space.
  ref: "concepts.md#latency-numbers-every-engineer-should-know"

- id: fundamentals-and-framework-014
  difficulty: beginner
  tags: [framework, reshaded]
  question: |
    In the RESHADED framework, what does the first 'R' stand for?
  options:
  - "Requirements"
  - "Replication"
  - "Redundancy"
  - "Routing"
  answer: 0
  explanation: |
    RESHADED begins with Requirements (functional and non-functional), then Estimation,
    Storage schema, High-level design, API design, Detailed design, Evaluation, and
    Distinctive/deep-dive. The others are design techniques, not the framework's first step.
  ref: "concepts.md#the-reshaded-and-structured-interview-approach"

- id: fundamentals-and-framework-015
  difficulty: intermediate
  tags: [framework, time-management]
  question: |
    In a ~45-minute interview, a candidate spends 25 minutes perfecting the API contract and
    has no time for scaling deep-dives. What is the main problem?
  options:
  - "APIs are unimportant and should be skipped entirely"
  - "The framework requires exactly equal time on every step"
  - "They should have spent even longer on the API"
  - "Poor time discipline: seniority is judged largely in the back-half deep-dives and trade-off discussion"
  answer: 3
  explanation: |
    The framework enforces time discipline so you reach the deep-dives where senior signal
    lives. APIs matter but a rough contract suffices; you do not spend more time; and the
    framework is adaptive, not equal-time-per-step.
  ref: "concepts.md#the-reshaded-and-structured-interview-approach"

- id: fundamentals-and-framework-016
  difficulty: advanced
  tags: [framework, seniority]
  question: |
    Two candidates both produce a correct high-level design. What most reliably distinguishes
    the staff-level answer from the mid-level one?
  options:
  - "The staff candidate names more brand-name databases"
  - "The staff candidate spends the back half quantifying and defending trade-offs, addressing bottlenecks, SPOFs, and failure modes"
  - "The staff candidate draws a larger diagram"
  - "The staff candidate finishes the interview fastest"
  answer: 1
  explanation: |
    Depth in trade-off reasoning, quantified with estimation numbers, and rigorous
    failure/bottleneck analysis is the senior differentiator. Name-dropping, diagram size, and
    speed are not signals of depth.
  ref: "concepts.md#the-reshaded-and-structured-interview-approach"

- id: fundamentals-and-framework-017
  difficulty: intermediate
  tags: [framework, adaptation]
  question: |
    For a data-pipeline problem (e.g., a clickstream analytics system), how should you adapt
    the standard request/response-oriented framework?
  options:
  - "Replace the API step with a data-flow step describing how data moves and is transformed through stages"
  - "Skip requirements because pipelines have none"
  - "Never estimate throughput for pipelines"
  - "Design the UI first since pipelines are user-facing"
  answer: 0
  explanation: |
    The framework is adaptive: for pipelines the 'API' step becomes a data-flow/data-model
    step. Requirements and throughput estimation are still essential, and pipelines are
    typically not UI-first.
  ref: "concepts.md#the-reshaded-and-structured-interview-approach"

- id: fundamentals-and-framework-018
  difficulty: beginner
  tags: [slo, sli, sla, definitions]
  question: |
    Which statement correctly distinguishes an SLI from an SLO?
  options:
  - "An SLI is the contractual promise; an SLO is the measured metric"
  - "SLIs and SLOs are identical terms"
  - "An SLI is the measured metric (e.g., % of requests under 200 ms); an SLO is the target for that metric"
  - "An SLO is always looser than the SLA"
  answer: 2
  explanation: |
    SLI = the measured indicator; SLO = the internal target for that indicator; SLA = the
    external contractual promise (usually looser than the SLO). The first option swaps SLI and
    SLA, they are not identical, and SLO is set tighter than the SLA, not looser.
  ref: "concepts.md#sla-slo-sli-and-error-budgets"

- id: fundamentals-and-framework-019
  difficulty: intermediate
  tags: [error-budget]
  question: |
    A service has a 99.9% availability SLO measured monthly. Approximately what is its monthly
    error budget?
  options:
  - "~4.4 minutes"
  - "~26 seconds"
  - "~7.2 hours"
  - "~43.8 minutes"
  answer: 3
  explanation: |
    Error budget = 1 - SLO = 0.1% of the month. 0.001 x ~43,800 min/month ~ 43.8 minutes.
    ~4.4 min corresponds to 99.99%, ~7.2 hours to 99% (monthly), and ~26 s to 99.999%.
  ref: "concepts.md#sla-slo-sli-and-error-budgets"

- id: fundamentals-and-framework-020
  difficulty: advanced
  tags: [error-budget, velocity]
  question: |
    How does an error budget align feature-velocity teams with reliability teams?
  options:
  - "It forbids any deployments until 100% uptime is achieved"
  - "While budget remains, teams ship features fast; when it is exhausted, risky launches freeze and effort shifts to reliability"
  - "It guarantees the SLA can never be breached"
  - "It replaces the need for monitoring entirely"
  answer: 1
  explanation: |
    The error budget is a shared lever: spend it on velocity while it lasts, then freeze and
    invest in reliability once exhausted. It does not demand 100% uptime, does not guarantee
    the SLA, and does not replace monitoring (you need SLIs to measure the budget).
  ref: "concepts.md#sla-slo-sli-and-error-budgets"

- id: fundamentals-and-framework-021
  difficulty: advanced
  tags: [slo, cost, trade-offs]
  question: |
    A product team proposes committing to a 99.999% SLO for a non-critical social feature.
    What is the strongest objection?
  options:
  - "Five nines is trivial to achieve, so it is fine"
  - "SLOs should never exceed 99%"
  - "Each additional nine costs roughly an order of magnitude more (redundancy, multi-region, mature on-call) and likely is not justified for a non-critical feature"
  - "A higher SLO always improves engineering velocity"
  answer: 2
  explanation: |
    Higher nines are exponentially more expensive; five nines (~26 s/month) is rarely worth it
    for non-critical features. Five nines is very hard, not trivial; there is no rule capping
    SLOs at 99%; and a tighter SLO tends to reduce velocity by consuming the error budget.
  ref: "concepts.md#sla-slo-sli-and-error-budgets"

- id: fundamentals-and-framework-022
  difficulty: intermediate
  tags: [sla, slo, relationship]
  question: |
    Why do mature teams deliberately set their internal SLO stricter than the customer-facing
    SLA?
  options:
  - "So internal alerts fire and give the team a safety margin before they risk breaching the contractual SLA and owing credits"
  - "To make the SLA impossible to meet"
  - "Because SLAs and SLOs must always be equal"
  - "To avoid measuring any SLIs"
  answer: 0
  explanation: |
    A stricter SLO acts as an early-warning buffer: you get paged before the looser SLA is
    breached, protecting you from penalties. Setting SLO = SLA (or SLA impossible) removes the
    safety margin; and SLIs are still required to measure both.
  ref: "concepts.md#sla-slo-sli-and-error-budgets"

- id: fundamentals-and-framework-023
  difficulty: beginner
  tags: [availability, nines, downtime]
  question: |
    Approximately how much downtime per year does a 99.99% (four nines) availability target
    allow?
  options:
  - "~8.8 hours"
  - "~3.65 days"
  - "~5 minutes"
  - "~52 minutes"
  answer: 3
  explanation: |
    99.99% allows ~52.6 minutes/year of downtime. ~8.8 hours is three nines (99.9%), ~5 min is
    five nines (99.999%), and ~3.65 days is two nines (99%).
  ref: "concepts.md#availability-nines-and-downtime-math"

- id: fundamentals-and-framework-024
  difficulty: intermediate
  tags: [availability, series-composition]
  question: |
    Service A (99.9%) synchronously calls Service B (99.9%), which synchronously calls Service
    C (99.9%). What is the approximate combined availability?
  options:
  - "~99.99%"
  - "~99.7%"
  - "~99.9%"
  - "~99.999%"
  answer: 1
  explanation: |
    Synchronous dependencies multiply: 0.999^3 ~ 0.997 = 99.7%. Every hard dependency lowers
    your availability ceiling, which is why teams reduce synchronous dependencies and add
    fallbacks. Combined availability cannot exceed the weakest link, so it is below 99.9%.
  ref: "concepts.md#availability-nines-and-downtime-math"

- id: fundamentals-and-framework-025
  difficulty: advanced
  tags: [availability, parallel-redundancy]
  question: |
    You place two independent replicas of a component, each 99% available, behind a load
    balancer so either can serve requests. What is the approximate combined availability?
  options:
  - "~99.99%"
  - "~99%"
  - "~98%"
  - "~50%"
  answer: 0
  explanation: |
    Parallel redundancy: A = 1 - (1 - 0.99)^2 = 1 - 0.0001 = 99.99%. Redundancy multiplies
    reliability. It is not lower than a single replica (98%/99%), and certainly not 50%.
  ref: "concepts.md#availability-nines-and-downtime-math"

- id: fundamentals-and-framework-026
  difficulty: advanced
  tags: [availability, dependency-ceiling]
  question: |
    Your service must promise 99.99% availability but it synchronously depends on a
    third-party API that offers only 99.9%. What is the most correct assessment?
  options:
  - "No problem; your availability is independent of the third party"
  - "Just retry infinitely and availability becomes 100%"
  - "You cannot promise 99.99% on that path without a fallback, cache, or circuit breaker, because a hard dependency caps your availability at its own"
  - "Switch to an asynchronous call and the third party's uptime no longer matters at all"
  answer: 2
  explanation: |
    A synchronous hard dependency caps your availability at (at most) its own, so 99.99% is
    impossible on that path without a fallback/cache/circuit-breaker. Your availability is not
    independent, infinite retries do not create uptime (the dependency is down), and async
    helps only if the operation truly tolerates delay.
  ref: "concepts.md#availability-nines-and-downtime-math"

- id: fundamentals-and-framework-027
  difficulty: beginner
  tags: [latency-throughput, definitions]
  question: |
    Which pair correctly defines latency and throughput?
  options:
  - "Latency = operations per second; throughput = time per operation"
  - "Latency = disk capacity; throughput = network capacity"
  - "They are two names for the same measurement"
  - "Latency = time for a single operation; throughput = operations completed per unit time"
  answer: 3
  explanation: |
    Latency is per-operation time (measured via percentiles); throughput is the rate of
    operations (QPS, MB/s). The first option swaps them, they are distinct axes, and neither
    is about storage capacity.
  ref: "concepts.md#latency-versus-throughput"

- id: fundamentals-and-framework-028
  difficulty: intermediate
  tags: [latency-throughput, batching]
  question: |
    Adding batching to a write pipeline increases throughput. What is the primary trade-off?
  options:
  - "It reduces throughput as a side effect"
  - "It increases per-request latency because requests wait to fill a batch"
  - "It makes the system strongly consistent automatically"
  - "It has no downside at all"
  answer: 1
  explanation: |
    Batching amortizes overhead to raise throughput but adds latency while items wait for a
    batch to fill. It does not reduce throughput, has nothing to do with consistency
    guarantees, and always trades latency for throughput.
  ref: "concepts.md#latency-versus-throughput"

- id: fundamentals-and-framework-029
  difficulty: advanced
  tags: [latency-throughput, tail-latency, fan-out]
  question: |
    A request fans out to 100 backend services in parallel and waits for all. Each service has
    a p99 of 10 ms. Why is the overall request latency typically much worse than 10 ms at p99?
  options:
  - "Because parallel calls always run serially in practice"
  - "Because fan-out reduces network bandwidth"
  - "Because with 100 independent calls you almost always hit at least one slow (tail) node, so the slowest dominates the response time"
  - "Because p99 of one service equals the p99 of the whole request"
  answer: 2
  explanation: |
    With many parallel dependencies you nearly always encounter at least one tail-latency
    outlier, and the request waits for the slowest, so tail latency compounds (Dean's 'Tail at
    Scale'). Parallel calls do run concurrently, this is not about bandwidth, and the whole
    request's p99 is far worse than a single service's p99.
  ref: "concepts.md#latency-versus-throughput"

- id: fundamentals-and-framework-030
  difficulty: advanced
  tags: [latency-throughput, queuing, utilization]
  question: |
    As a server's utilization approaches 100%, what happens to request latency, and what is
    the practical implication?
  options:
  - "Latency grows non-linearly toward infinity, so keep utilization around 60-70% for headroom"
  - "Latency stays flat, so run servers at 100% for efficiency"
  - "Latency decreases because the CPU is fully warmed up"
  - "Latency is unaffected by utilization"
  answer: 0
  explanation: |
    Queuing theory: near saturation, queue lengths and latency blow up non-linearly, so you
    maintain headroom (~60-70% utilization) to protect tail latency. Running at 100% is a
    latency disaster, not efficiency; latency does not decrease or stay unaffected.
  ref: "concepts.md#latency-versus-throughput"

- id: fundamentals-and-framework-031
  difficulty: expert
  tags: [latency-throughput, littles-law]
  question: |
    A service handles 2,000 requests/second with an average latency of 50 ms per request. By
    Little's Law, approximately how many requests are being processed concurrently on average?
  options:
  - "40"
  - "40,000"
  - "1,000"
  - "100"
  answer: 3
  explanation: |
    Little's Law: concurrency = throughput x latency = 2,000/s x 0.050 s = 100 in-flight
    requests. This sizes thread pools and connection pools. 40 and 1,000 and 40,000 come from
    unit errors (e.g., forgetting to convert ms to seconds).
  ref: "concepts.md#latency-versus-throughput"

- id: fundamentals-and-framework-032
  difficulty: beginner
  tags: [scaling, vertical, horizontal]
  question: |
    What best describes horizontal scaling?
  options:
  - "Upgrading a server to more CPU and RAM"
  - "Adding more machines and distributing load across them"
  - "Compressing data to save disk"
  - "Rewriting the app in a faster language"
  answer: 1
  explanation: |
    Horizontal scaling (scale out) adds machines behind a load balancer. Upgrading one machine
    is vertical scaling (scale up); compression and language choice are unrelated optimizations.
  ref: "concepts.md#vertical-versus-horizontal-scaling"

- id: fundamentals-and-framework-033
  difficulty: intermediate
  tags: [scaling, trade-offs]
  question: |
    A startup's single Postgres box is comfortably below its capacity ceiling and the team is
    small. What is the most reasonable scaling stance?
  options:
  - "Stay vertical (and add read replicas) for simplicity until you actually approach the single-box ceiling, then consider horizontal"
  - "Immediately shard the database across 20 nodes for future-proofing"
  - "Rewrite everything as microservices before adding any users"
  - "Move to multi-region active-active on day one"
  answer: 0
  explanation: |
    Below the single-box ceiling, vertical scaling avoids distributed-systems complexity;
    defer sharding/microservices/multi-region until the numbers justify them. Premature
    sharding, microservices, and multi-region add cost and complexity with no current benefit.
  ref: "concepts.md#vertical-versus-horizontal-scaling"

- id: fundamentals-and-framework-034
  difficulty: intermediate
  tags: [scaling, fault-tolerance]
  question: |
    Beyond raw capacity, what is a key reliability advantage of horizontal scaling over
    vertical scaling?
  options:
  - "A single bigger machine can never fail"
  - "Vertical scaling automatically replicates data"
  - "Multiple nodes provide redundancy, so losing one node does not take down the service"
  - "Horizontal scaling removes the need for load balancers"
  answer: 2
  explanation: |
    Horizontal scaling is inherently redundant: with many nodes, one failing does not down the
    system, whereas one big box is a SPOF. A single machine can and does fail, vertical scaling
    does not add replication, and horizontal scaling requires (not removes) load balancing.
  ref: "concepts.md#vertical-versus-horizontal-scaling"

- id: fundamentals-and-framework-035
  difficulty: advanced
  tags: [scaling, cost, ceiling]
  question: |
    Which statement about the cost and ceiling trade-offs of vertical vs horizontal scaling is
    most accurate?
  options:
  - "Both approaches have identical operational complexity"
  - "Horizontal scaling always costs more per unit of capacity than vertical scaling"
  - "Vertical scaling scales nearly infinitely with no ceiling"
  - "Vertical scaling has a hard hardware ceiling and super-linear cost at the top end; horizontal scaling uses commodity nodes with a much higher ceiling"
  answer: 3
  explanation: |
    Big machines hit a hardware limit and cost a premium (super-linear), while scaling out on
    commodity hardware is roughly linear and reaches far higher ceilings. Horizontal is
    typically cheaper per unit at scale, vertical does have a ceiling, and horizontal is
    operationally more complex (LB, sharding, distributed state).
  ref: "concepts.md#vertical-versus-horizontal-scaling"

- id: fundamentals-and-framework-036
  difficulty: beginner
  tags: [stateless, stateful]
  question: |
    Which characteristic defines a stateless service?
  options:
  - "It stores each user's session in local memory on a specific node"
  - "It keeps no client-specific data between requests; any node can serve any request"
  - "It cannot use a database at all"
  - "It requires sticky sessions to function"
  answer: 1
  explanation: |
    A stateless service holds no per-client state between requests, so any node can serve any
    request, enabling easy horizontal scaling. Storing sessions locally and needing sticky
    sessions describe stateful services; stateless services commonly use a shared database.
  ref: "concepts.md#stateless-versus-stateful-services"

- id: fundamentals-and-framework-037
  difficulty: intermediate
  tags: [stateless, scaling]
  question: |
    To make an app tier stateless so it can autoscale freely, where should per-user session
    state be moved?
  options:
  - "Into a local file on each app server"
  - "It cannot be moved; the app must remain stateful"
  - "Into a shared external store such as Redis, a database, or a signed token (JWT) carried by the client"
  - "Into the load balancer's memory"
  answer: 2
  explanation: |
    Externalizing state to a shared store (Redis/DB) or into a client-carried token makes app
    nodes disposable and easy to scale. Local files re-introduce node affinity, state can be
    externalized, and storing per-user state in the LB is not a scalable design.
  ref: "concepts.md#stateless-versus-stateful-services"

- id: fundamentals-and-framework-038
  difficulty: advanced
  tags: [stateless, trade-offs]
  question: |
    What is the primary trade-off you accept when you make the application tier stateless by
    moving session data to a shared Redis store?
  options:
  - "You trade a fast local-memory access for a network hop to the shared store, and that store becomes a component you must scale and make reliable"
  - "You lose the ability to scale horizontally"
  - "You permanently sacrifice all consistency guarantees"
  - "You can no longer use load balancers"
  answer: 0
  explanation: |
    Statelessness costs an extra network round trip to the state store and makes that store
    something you must scale/replicate, in exchange for trivial app-tier scaling and failover.
    It enables (not loses) horizontal scaling, does not inherently sacrifice consistency, and
    works naturally with load balancers.
  ref: "concepts.md#stateless-versus-stateful-services"

- id: fundamentals-and-framework-039
  difficulty: advanced
  tags: [stateful, websocket, consistent-hashing]
  question: |
    A real-time chat system maintains millions of long-lived WebSocket connections (inherently
    stateful). How do such systems typically scale this connection layer?
  options:
  - "By making WebSockets stateless so any node handles any connection with no coordination"
  - "By refusing new connections once one server is full"
  - "By storing every open socket in a single SQL row"
  - "By using consistent hashing to map connections to nodes and supporting session migration on node changes"
  answer: 3
  explanation: |
    Stateful connection layers scale with consistent hashing (to route a connection to a node)
    plus session migration/rebalancing. Long-lived connections are inherently stateful (cannot
    be made stateless), a single SQL row cannot hold sockets, and refusing connections is not
    scaling.
  ref: "concepts.md#stateless-versus-stateful-services"

- id: fundamentals-and-framework-040
  difficulty: beginner
  tags: [spof]
  question: |
    What is a single point of failure (SPOF)?
  options:
  - "A component that is faster than all others"
  - "A component whose failure brings down the entire system"
  - "A backup server that is never used"
  - "A monitoring dashboard"
  answer: 1
  explanation: |
    A SPOF is any component whose failure takes down the whole system; eliminating SPOFs
    (redundancy, replication, failover) is core to reliable design. Speed, unused backups, and
    dashboards are not the definition.
  ref: "concepts.md#single-points-of-failure"

- id: fundamentals-and-framework-041
  difficulty: intermediate
  tags: [spof, database, failover]
  question: |
    Your design has a single database primary handling all writes. Which change most directly
    removes it as a SPOF?
  options:
  - "Add replicas with automated failover (leader election) across availability zones"
  - "Add more application servers"
  - "Increase the primary's CPU and RAM"
  - "Cache more read queries"
  answer: 0
  explanation: |
    Replication plus automated failover across AZs removes the primary as a SPOF. More app
    servers, a bigger primary, or more caching do not address the fact that a single primary
    failing halts all writes.
  ref: "concepts.md#single-points-of-failure"

- id: fundamentals-and-framework-042
  difficulty: advanced
  tags: [spof, correlated-failure]
  question: |
    You run three database replicas, but all three are in the same availability zone. Why does
    this still leave a SPOF?
  options:
  - "Replicas are always useless"
  - "Three replicas is too many and causes conflicts"
  - "Correlated failure: if the entire AZ fails, all three replicas go down together, so the AZ is the SPOF"
  - "Replication automatically fails at exactly three nodes"
  answer: 2
  explanation: |
    Naive redundancy inside one failure domain does not help against correlated failure: an AZ
    outage takes all three down, making the AZ the SPOF, which is why you spread across AZs and
    regions. Replicas are useful, three is not inherently too many, and there is no magic
    three-node limit.
  ref: "concepts.md#single-points-of-failure"

- id: fundamentals-and-framework-043
  difficulty: advanced
  tags: [spof, failover, split-brain]
  question: |
    What is a real risk of adding automated failover to eliminate a SPOF, and how is it
    mitigated?
  options:
  - "Automated failover cannot fail, so there is no risk"
  - "It removes the need to monitor the system"
  - "It always doubles storage cost with no benefit"
  - "It can cause split-brain or flapping (two nodes both think they are primary); mitigated with quorum/consensus and fencing"
  answer: 3
  explanation: |
    Automated failover itself can misfire (false positives, flapping, split-brain where two
    nodes act as primary); quorum-based leader election and fencing prevent this. It is not
    risk-free, its cost is not the main point, and monitoring is still required.
  ref: "concepts.md#single-points-of-failure"

- id: fundamentals-and-framework-044
  difficulty: expert
  tags: [spof, hidden-dependency]
  question: |
    Your services are redundant across regions, yet a single expired TLS certificate (shared
    by all of them) once took the whole fleet down. What concept does this illustrate?
  options:
  - "That redundancy is pointless"
  - "A hidden/shared dependency is a SPOF even when the compute is redundant, defeating naive redundancy"
  - "That TLS should never be used"
  - "That multi-region always prevents all outages"
  answer: 1
  explanation: |
    A shared dependency (a common cert, config service, or DNS) is a hidden SPOF that
    redundant compute does not protect against; blast-radius bounding (e.g., cell-based
    architecture, staggered cert rotation) addresses it. Redundancy is not pointless, TLS is
    needed, and multi-region does not eliminate shared-dependency failures.
  ref: "concepts.md#single-points-of-failure"

- id: fundamentals-and-framework-045
  difficulty: beginner
  tags: [read-heavy, caching]
  question: |
    For a strongly read-heavy system such as a product-browsing page, which technique gives the
    biggest latency and load improvement?
  options:
  - "Sharding writes across many primaries"
  - "Switching to an LSM-tree write-optimized store"
  - "Caching the hot data (Redis/CDN) and using read replicas"
  - "Adding a distributed transaction coordinator"
  answer: 2
  explanation: |
    Read-heavy systems benefit most from caching and read replicas to absorb the hot set and
    fan out reads. Write sharding and LSM engines target write-heavy loads, and a transaction
    coordinator adds latency without helping read scale.
  ref: "concepts.md#read-heavy-versus-write-heavy-systems"

- id: fundamentals-and-framework-046
  difficulty: intermediate
  tags: [write-heavy, lsm]
  question: |
    A metrics-ingestion system is extremely write-heavy. Which storage approach best fits?
  options:
  - "An LSM-tree store (e.g., Cassandra/ScyllaDB) that turns random writes into sequential appends, often fed via an async log/queue"
  - "A single B-tree RDBMS primary with synchronous replication"
  - "A read-through cache in front of one node"
  - "A graph database optimized for traversals"
  answer: 0
  explanation: |
    LSM-tree stores excel at high write throughput by sequentializing writes, and buffering via
    a log/queue smooths bursts. A single B-tree primary bottlenecks on writes, a read cache
    does not help writes, and a graph DB targets relationship traversal, not write throughput.
  ref: "concepts.md#read-heavy-versus-write-heavy-systems"

- id: fundamentals-and-framework-047
  difficulty: advanced
  tags: [read-heavy, fan-out, celebrity]
  question: |
    A social feed uses fan-out-on-write (push a post into every follower's timeline at write
    time). This is great for normal users but breaks for a celebrity with 50M followers. What
    is the standard fix?
  options:
  - "Delete the celebrity's account"
  - "Store the celebrity's posts only in the cache and never persist them"
  - "Switch entirely to fan-out-on-read for everyone, accepting slow reads for all users"
  - "Use a hybrid: push for normal accounts, but pull (fan-out-on-read) for celebrities, merging at read time"
  answer: 3
  explanation: |
    The hybrid push/pull model handles the celebrity problem: push for most users (fast reads)
    and pull for high-fan-out accounts (avoids write amplification). Deleting accounts is a
    joke answer, all-pull degrades reads for everyone, and cache-only storage loses durability.
  ref: "concepts.md#read-heavy-versus-write-heavy-systems"

- id: fundamentals-and-framework-048
  difficulty: advanced
  tags: [write-heavy, lsm, trade-offs]
  question: |
    LSM-tree stores give excellent write throughput. What is the primary trade-off you accept?
  options:
  - "Writes become slower than a B-tree"
  - "Read amplification and background compaction overhead (CPU/IO), with occasional latency spikes"
  - "They cannot store more than a few gigabytes"
  - "They guarantee strong consistency for free"
  answer: 1
  explanation: |
    LSM trades read amplification (a read may check multiple SSTables) and compaction cost for
    fast sequential writes. Writes are faster (not slower), capacity is large, and consistency
    is unrelated to the storage engine choice.
  ref: "concepts.md#read-heavy-versus-write-heavy-systems"

- id: fundamentals-and-framework-049
  difficulty: intermediate
  tags: [read-heavy, caching, trade-offs]
  question: |
    Caching is the top lever for read-heavy systems, but what is the classic downside you must
    design for?
  options:
  - "Cache staleness and invalidation complexity ('one of the two hard things')"
  - "Caches make reads slower than hitting the database"
  - "Caches require a distributed transaction on every read"
  - "Caches can only store integers"
  answer: 0
  explanation: |
    Caching's cost is staleness and the notoriously hard problem of cache invalidation. Caches
    make reads faster (RAM vs disk), do not require transactions per read, and store arbitrary
    data.
  ref: "concepts.md#read-heavy-versus-write-heavy-systems"

- id: fundamentals-and-framework-050
  difficulty: beginner
  tags: [cap, definitions]
  question: |
    According to the CAP theorem, during a network partition a distributed system must choose
    between which two properties?
  options:
  - "Caching and Persistence"
  - "Cost and Performance"
  - "Consistency and Availability"
  - "Concurrency and Atomicity"
  answer: 2
  explanation: |
    CAP: during a partition (P), you must trade Consistency (every read sees the latest write)
    against Availability (every request gets a non-error response). The other pairs are not the
    CAP theorem.
  ref: "concepts.md#cap-pacelc-and-consistency-trade-offs"

- id: fundamentals-and-framework-051
  difficulty: intermediate
  tags: [cap, cp-ap]
  question: |
    A distributed configuration/coordination store (like ZooKeeper or etcd) chooses to reject
    requests it cannot serve consistently during a partition. This is an example of what?
  options:
  - "An AP system prioritizing availability"
  - "A system with no consistency model"
  - "A system that violates the CAP theorem"
  - "A CP system prioritizing consistency"
  answer: 3
  explanation: |
    Refusing requests to preserve correctness during a partition is the CP choice (consistency
    over availability), typical of coordination stores. It is not AP (which stays available),
    does not violate CAP, and clearly has a consistency model.
  ref: "concepts.md#cap-pacelc-and-consistency-trade-offs"

- id: fundamentals-and-framework-052
  difficulty: advanced
  tags: [pacelc]
  question: |
    What does PACELC add beyond the classic CAP theorem?
  options:
  - "It replaces consistency with cost"
  - "It states that even with no partition (Else), you still trade Latency versus Consistency during normal operation"
  - "It proves you can always have consistency and availability together"
  - "It only applies to single-node databases"
  answer: 1
  explanation: |
    PACELC: if Partition then A vs C, Else Latency vs Consistency. It captures the everyday
    trade-off (strong consistency costs latency even when healthy), which CAP ignores. It does
    not replace C with cost, does not claim you get everything, and targets distributed systems.
  ref: "concepts.md#cap-pacelc-and-consistency-trade-offs"

- id: fundamentals-and-framework-053
  difficulty: advanced
  tags: [cap, when-to-choose]
  question: |
    You are designing the balance-tracking core of a payments ledger. On the CAP axis, which
    choice is most appropriate and why?
  options:
  - "AP/eventual consistency, because availability matters more than correctness for money"
  - "Neither; CAP does not apply to money"
  - "CP/strong consistency, accepting reduced availability during partitions, because a wrong balance is unacceptable"
  - "AP with a cache in front to guarantee correctness"
  answer: 2
  explanation: |
    Money requires correctness, so choose CP/strong consistency and accept lower availability
    and higher latency during partitions. AP risks incorrect balances, CAP absolutely applies,
    and a cache does not make an AP store strongly consistent.
  ref: "concepts.md#cap-pacelc-and-consistency-trade-offs"

- id: fundamentals-and-framework-054
  difficulty: expert
  tags: [cap, quorum, tunable]
  question: |
    In a Dynamo-style store with N=3 replicas, you configure read quorum R=2 and write quorum
    W=2. Why does this give strong-ish consistency, and what is the trade-off versus R=1, W=1?
  options:
  - "Because R+W > N guarantees read and write quorums overlap; the trade-off is higher latency and lower availability than R=1,W=1"
  - "Because R+W < N always overlaps; R=1,W=1 is strictly better in every way"
  - "Because quorums have nothing to do with consistency"
  - "Because R=2,W=2 makes the system fully CP with no downsides"
  answer: 0
  explanation: |
    With R+W > N (2+2 > 3) the read and write sets must overlap, so a read sees the latest
    write; the cost is more nodes per operation (higher latency, less availability if a node is
    down) than R=1,W=1, which is fast/available but may read stale data. R+W<N does not
    guarantee overlap, quorums directly tune consistency, and there is always a trade-off.
  ref: "concepts.md#cap-pacelc-and-consistency-trade-offs"

- id: fundamentals-and-framework-055
  difficulty: intermediate
  tags: [modern, event-driven]
  question: |
    What is the primary benefit of an event-driven architecture where services communicate via
    an asynchronous broker (Kafka/Kinesis) instead of synchronous RPC?
  options:
  - "It guarantees strong consistency across all services"
  - "It makes debugging simpler with a single call stack"
  - "It removes the need for idempotency"
  - "It decouples producers from consumers and buffers bursts, so a slow or down consumer does not fail the producer"
  answer: 3
  explanation: |
    Event-driven designs decouple services and provide buffering/backpressure and resilience.
    They introduce eventual consistency (not strong), require idempotency/dedup because of
    at-least-once delivery, and are harder to debug (no single call stack).
  ref: "concepts.md#modern-patterns-event-driven-cqrs-cdc-and-cell-based"

- id: fundamentals-and-framework-056
  difficulty: advanced
  tags: [modern, event-driven, trade-offs]
  question: |
    A team wants to replace a synchronous 'check inventory and confirm order instantly' call
    with an event-driven async flow. What is the strongest reason this may be a poor fit?
  options:
  - "Event-driven systems cannot scale"
  - "The user needs an immediate synchronous answer, which async event flows do not naturally provide, and it adds eventual-consistency complexity"
  - "Kafka cannot store order events"
  - "Async always corrupts data"
  answer: 1
  explanation: |
    When a caller requires an immediate synchronous answer, event-driven async is a poor fit
    and brings eventual-consistency complexity. Event-driven systems scale well, Kafka can
    store such events, and async does not inherently corrupt data (though it needs idempotency).
  ref: "concepts.md#modern-patterns-event-driven-cqrs-cdc-and-cell-based"

- id: fundamentals-and-framework-057
  difficulty: advanced
  tags: [modern, cqrs]
  question: |
    What problem is CQRS (Command Query Responsibility Segregation) best suited to solve?
  options:
  - "A read-heavy domain with complex query shapes, where separating a denormalized read model from the write model lets each scale and be modeled independently"
  - "A simple CRUD app with balanced read/write and trivial queries"
  - "Eliminating the need for any database"
  - "Guaranteeing zero latency on writes"
  answer: 0
  explanation: |
    CQRS shines when read and write workloads/shapes differ greatly (e.g., extreme read skew,
    rich queries), letting each side scale and be modeled separately. It is overkill for simple
    CRUD, does not remove the database, and does not guarantee zero write latency.
  ref: "concepts.md#modern-patterns-event-driven-cqrs-cdc-and-cell-based"

- id: fundamentals-and-framework-058
  difficulty: expert
  tags: [modern, cdc, outbox, dual-write]
  question: |
    A service currently writes to its database and then separately publishes to Kafka; these
    occasionally diverge when one succeeds and the other fails (the dual-write problem). Which
    pattern most reliably fixes this?
  options:
  - "Add more retries to the Kafka publish and hope for the best"
  - "Publish to Kafka first, then write to the database"
  - "Transactional outbox plus Change Data Capture (CDC): write the event to an outbox table in the same DB transaction, then stream it from the DB log to Kafka"
  - "Use a distributed two-phase commit between the app and Kafka on every request"
  answer: 2
  explanation: |
    The transactional outbox + CDC pattern writes the event atomically with the data change
    and lets CDC (e.g., Debezium) reliably propagate it, eliminating divergence. Retries and
    reordering the two writes do not make them atomic, and 2PC across a DB and Kafka is fragile
    and high-latency.
  ref: "concepts.md#modern-patterns-event-driven-cqrs-cdc-and-cell-based"

- id: fundamentals-and-framework-059
  difficulty: advanced
  tags: [modern, cell-based, blast-radius]
  question: |
    What is the core value proposition of a cell-based architecture?
  options:
  - "It makes every request strongly consistent"
  - "It reduces total hardware cost to near zero"
  - "It eliminates the need for load balancers"
  - "It partitions the whole stack into independent cells so a failure or bad deploy is contained to one cell, bounding the blast radius"
  answer: 3
  explanation: |
    Cell-based architecture isolates failures and bad deploys to a single cell serving a subset
    of users, bounding blast radius and enabling safe canaries. It is not about strong
    consistency, still needs routing/LB, and actually adds capacity overhead (headroom per cell).
  ref: "concepts.md#modern-patterns-event-driven-cqrs-cdc-and-cell-based"

- id: fundamentals-and-framework-060
  difficulty: expert
  tags: [modern, cell-based, trade-offs]
  question: |
    What is a real cost of adopting cell-based architecture that you should acknowledge in an
    interview?
  options:
  - "It guarantees you never need multi-region"
  - "Routing complexity, capacity overhead from sizing each cell with headroom, and awkward cross-cell operations"
  - "It removes all failure modes permanently"
  - "It forces you into synchronous RPC everywhere"
  answer: 1
  explanation: |
    Cells add a routing layer, require spare capacity per cell, and make cross-cell operations
    harder, traded for fault isolation. It does not replace multi-region, does not eliminate
    all failures, and does not dictate synchronous RPC.
  ref: "concepts.md#modern-patterns-event-driven-cqrs-cdc-and-cell-based"

- id: fundamentals-and-framework-061
  difficulty: intermediate
  tags: [trade-offs, sql-nosql]
  question: |
    You need multi-row ACID transactions, joins, and strong consistency for an order/payments
    schema at moderate scale. Which choice is most appropriate?
  options:
  - "A pure in-memory cache as the system of record"
  - "An eventually-consistent wide-column NoSQL store, because it scales writes"
  - "A relational (SQL) database, accepting harder horizontal scaling later"
  - "A blob store like S3 for the transactional data"
  answer: 2
  explanation: |
    ACID transactions, joins, and strong consistency point to a relational database; the
    trade-off is that horizontal scaling (sharding) is harder later. NoSQL relaxes consistency
    and joins, a cache is not a durable system of record, and blob stores are for large
    objects, not transactional rows.
  ref: "concepts.md#trade-offs-and-when-to-use-what"

- id: fundamentals-and-framework-062
  difficulty: advanced
  tags: [trade-offs, scenario, consistency]
  question: |
    Constraints: 100M DAU, p99 < 150 ms, 'a few seconds of staleness is fine', budget-
    conscious. Which design is the best fit for the read path of a social timeline?
  options:
  - "Cache the hot timeline data plus read replicas (AP/eventual), using read-your-writes for the author's own view"
  - "Synchronous strongly-consistent reads from a single global primary to guarantee freshness"
  - "Two-phase commit across all regions on every read"
  - "Serve every read from cold object storage to save money"
  answer: 0
  explanation: |
    Given eventual-consistency tolerance, tight latency, and cost limits, cache + read replicas
    (AP) with read-your-writes for the author is ideal. A single global primary and 2PC-per-
    read blow the latency budget, and cold object storage is far too slow for a p99 of 150 ms.
  ref: "concepts.md#trade-offs-and-when-to-use-what"

- id: fundamentals-and-framework-063
  difficulty: advanced
  tags: [trade-offs, batching, scenario]
  question: |
    An interactive user-facing autocomplete API has a strict p99 latency budget, while a
    nightly billing-aggregation job processes billions of rows. How should batching be applied?
  options:
  - "Batch aggressively in both to maximize throughput"
  - "Batch the autocomplete API but stream the billing job one row at a time"
  - "Avoid batching everywhere because it always hurts"
  - "Avoid heavy batching in the latency-bound autocomplete API; use batching in the throughput-bound billing job"
  answer: 3
  explanation: |
    Latency-bound interactive paths should avoid batch-induced waiting, while throughput-bound
    batch jobs benefit from batching. Batching the latency-sensitive API adds tail latency, and
    processing billions of rows one-at-a-time wastes throughput.
  ref: "concepts.md#trade-offs-and-when-to-use-what"

- id: fundamentals-and-framework-064
  difficulty: intermediate
  tags: [trade-offs, framework, defense]
  question: |
    An interviewer challenges: "Why eventual consistency here?" What is the strongest senior-
    level response structure?
  options:
  - "Insist eventual consistency is always best"
  - "Restate the NFR that permits staleness, name what you gain (availability, latency, scale), what you give up (bounded staleness), and give the condition under which you'd switch to strong consistency"
  - "Change the design immediately to strong consistency"
  - "Say it does not matter because both are equivalent"
  answer: 1
  explanation: |
    The senior move is to tie the choice to the NFR, state gain vs give-up, and provide a flip-
    condition. Dogmatic insistence, instantly caving, or claiming equivalence all fail to
    demonstrate trade-off reasoning.
  ref: "concepts.md#trade-offs-and-when-to-use-what"

- id: fundamentals-and-framework-065
  difficulty: expert
  tags: [trade-offs, scenario, multi-region]
  question: |
    Requirement: survive a full AWS region outage with near-zero downtime for a globally
    distributed, latency-sensitive social app that tolerates seconds of staleness. Which
    approach best fits, and what is the key trade-off?
  options:
  - "Multi-region active-active with asynchronous replication and conflict resolution; trade-off is you must handle eventual consistency and conflicts"
  - "Single-region active-passive with manual failover; trade-off is simplicity but minutes-to-hours of downtime on region loss"
  - "Multi-region active-active with synchronous cross-region writes; trade-off is none"
  - "Single region with bigger instances; trade-off is cost only"
  answer: 0
  explanation: |
    Surviving a region loss with near-zero downtime for a staleness-tolerant app points to
    multi-region active-active with async replication; the price is eventual consistency and
    conflict resolution. Active-passive risks long downtime, synchronous cross-region writes
    have a huge latency cost (not 'none'), and one bigger region still dies with the region.
  ref: "concepts.md#trade-offs-and-when-to-use-what"

- id: fundamentals-and-framework-066
  difficulty: intermediate
  tags: [latency, percentiles]
  question: |
    Why do experienced engineers report p99/p999 latency rather than the average when
    evaluating an SLO?
  options:
  - "Averages are harder to compute"
  - "Percentiles are always lower than averages"
  - "Averages hide tail latency; a good average can still mean many users experience slow, painful requests"
  - "The SLA legally requires only averages"
  answer: 2
  explanation: |
    Averages mask the tail: p99/p999 reveal the slow experiences that hurt real users and often
    dominate at scale. Averages are not harder to compute, percentiles are higher (not lower)
    than the median/average for latency, and SLAs commonly specify percentiles.
  ref: "concepts.md#latency-versus-throughput"

- id: fundamentals-and-framework-067
  difficulty: beginner
  tags: [read-heavy, ratio]
  question: |
    Estimation shows 40,000 read QPS and 4,000 write QPS. What does this ratio tell you about
    the system, and what is the first-line optimization?
  options:
  - "It is write-heavy; shard the write primary first"
  - "The ratio is irrelevant to architecture"
  - "It is perfectly balanced; do nothing special"
  - "It is read-heavy (10:1); prioritize caching and read replicas"
  answer: 3
  explanation: |
    A 10:1 read:write ratio is read-heavy, so caching and read replicas are the first levers.
    It is not write-heavy, not balanced, and the read:write ratio is one of the most
    architecture-defining numbers.
  ref: "concepts.md#read-heavy-versus-write-heavy-systems"

- id: fundamentals-and-framework-068
  difficulty: expert
  tags: [availability, series, design]
  question: |
    A request path traverses 5 independent synchronous services, each 99.95% available. What is
    the approximate end-to-end availability, and what design lesson follows?
  options:
  - "~99.95%; adding services does not change availability"
  - "~99.75%; each synchronous hop lowers the ceiling, so reduce hard dependencies or add fallbacks/async"
  - "~99.99%; more services increase availability"
  - "~50%; the system is essentially always down"
  answer: 1
  explanation: |
    0.9995^5 ~ 0.9975 = 99.75%. Every synchronous dependency multiplies down the availability,
    motivating fewer hard dependencies, graceful degradation, and async decoupling. Availability
    does not stay flat or increase with more hops, and it is nowhere near 50%.
  ref: "concepts.md#availability-nines-and-downtime-math"

- id: fundamentals-and-framework-069
  difficulty: intermediate
  tags: [estimation, tweet-storage]
  question: |
    200M DAU each post 2 tweets/day. Approximately what is the average write QPS (use ~100K
    seconds/day)?
  options:
  - "~40 QPS"
  - "~400 QPS"
  - "~4,000 QPS"
  - "~40,000 QPS"
  answer: 2
  explanation: |
    200M x 2 = 400M writes/day. 400M / 100K s = 4,000 write QPS average. The other options are
    off by factors of 10-100 from arithmetic slips.
  ref: "concepts.md#back-of-the-envelope-estimation"

- id: fundamentals-and-framework-070
  difficulty: advanced
  tags: [stateless, jwt, trade-offs]
  question: |
    A team makes auth stateless by putting all session data into a signed JWT the client sends
    on each request. What is a key trade-off compared to a server-side session store?
  options:
  - "Revoking a JWT before its expiry is hard (no central session to delete), whereas server-side sessions can be invalidated instantly"
  - "JWTs cannot be verified without a database call"
  - "JWTs make horizontal scaling impossible"
  - "Server-side sessions are always stateless"
  answer: 0
  explanation: |
    Self-contained JWTs remove the state-store lookup (great for scaling) but make early
    revocation hard because there is no server record to delete; server-side sessions can be
    revoked instantly at the cost of a lookup. JWTs are verified via signature without a DB
    call, they aid horizontal scaling, and server-side sessions are inherently stateful.
  ref: "concepts.md#stateless-versus-stateful-services"

- id: fundamentals-and-framework-071
  difficulty: beginner
  tags: [framework, requirements-first]
  question: |
    Which is the recommended FIRST action when given an open-ended prompt like "Design a ride-
    sharing service"?
  options:
  - "Immediately start drawing microservices and databases"
  - "Estimate the number of Kafka partitions"
  - "Pick a NoSQL database and defend it"
  - "Clarify and scope functional and non-functional requirements with the interviewer"
  answer: 3
  explanation: |
    Always begin by clarifying scope and requirements (functional + non-functional). Jumping to
    diagrams, database choices, or partition counts before understanding requirements risks
    designing the wrong system.
  ref: "concepts.md#the-reshaded-and-structured-interview-approach"

- id: fundamentals-and-framework-072
  difficulty: intermediate
  tags: [spof, degradation]
  question: |
    When a non-critical recommendation service becomes unavailable, your product page still
    loads without recommendations instead of returning an error. This design technique is called
    what?
  options:
  - "Strong consistency"
  - "Graceful degradation"
  - "Vertical scaling"
  - "Two-phase commit"
  answer: 1
  explanation: |
    Serving a reduced-but-functional experience when a dependency fails is graceful
    degradation, a key way to prevent a dependency from being a hard SPOF. It is unrelated to
    consistency models, scaling direction, or distributed commit protocols.
  ref: "concepts.md#single-points-of-failure"

- id: fundamentals-and-framework-073
  difficulty: advanced
  tags: [modern, event-driven, idempotency]
  question: |
    Your event consumers use at-least-once delivery. Why is idempotency essential, and how is it
    commonly achieved?
  options:
  - "Because a message may be delivered more than once, consumers must produce the same result on reprocessing, often via dedup keys or upserts"
  - "It is not needed; at-least-once means exactly-once"
  - "Because messages are never redelivered, idempotency prevents ordering issues"
  - "Idempotency is only about compressing messages"
  answer: 0
  explanation: |
    At-least-once delivery means duplicates happen, so consumers must be idempotent (dedup
    keys, idempotency tokens, upserts) to avoid double-processing. At-least-once is not
    exactly-once, messages can be redelivered, and idempotency is unrelated to compression.
  ref: "concepts.md#modern-patterns-event-driven-cqrs-cdc-and-cell-based"

- id: fundamentals-and-framework-074
  difficulty: expert
  tags: [trade-offs, cqrs, consistency]
  question: |
    After adopting CQRS with an event-synced read model, product complains that a user
    sometimes does not immediately see their own just-submitted change reflected in a list view.
    What is the root cause and a reasonable mitigation?
  options:
  - "A bug that CQRS should never cause; remove CQRS entirely"
  - "The write model is corrupt; restore from backup"
  - "The read model is eventually consistent with the write model; mitigate with read-your-writes (e.g., read from the write model or client-side merge for the user's own recent action)"
  - "The network is down; there is no design fix"
  answer: 2
  explanation: |
    CQRS separates write and read models kept in sync asynchronously, so the read side lags
    briefly; read-your-writes (serve the user's own recent change from the write model or merge
    client-side) mitigates it. It is an expected consequence, not corruption or a pure network
    failure, and removing CQRS discards its scaling benefits.
  ref: "concepts.md#modern-patterns-event-driven-cqrs-cdc-and-cell-based"

- id: fundamentals-and-framework-075
  difficulty: intermediate
  tags: [latency-numbers, caching-justification]
  question: |
    Which latency comparison most directly justifies adding an in-memory cache in front of a
    disk-backed database?
  options:
  - "L1 cache is faster than L2 cache"
  - "Compressing 1 KB is faster than sending it over the network"
  - "Branch mispredicts are slower than mutex locks"
  - "A main-memory reference (~100 ns) is orders of magnitude faster than a disk seek (~10 ms) or SSD random read (~150 us)"
  answer: 3
  explanation: |
    Caching pays off because RAM (~100 ns) is ~1,000x faster than SSD random reads (~150 us) and
    ~100,000x faster than a disk seek (~10 ms), dramatically cutting read latency. The other comparisons are true
    but irrelevant to the cache-vs-disk decision.
  ref: "concepts.md#latency-numbers-every-engineer-should-know"

- id: fundamentals-and-framework-076
  difficulty: advanced
  tags: [trade-offs, scenario, write-heavy]
  question: |
    An IoT platform ingests 500K sensor writes/second in bursts, tolerates eventual
    consistency, and mostly does time-range reads later. Which architecture is most appropriate?
  options:
  - "A single strongly-consistent relational primary with synchronous replication for every write"
  - "Buffer writes through a partitioned log (Kafka), persist to a sharded LSM/time-series store, and serve range reads from that store"
  - "Write directly to a read-through cache and never persist to disk"
  - "Use two-phase commit across shards on every sensor write"
  answer: 1
  explanation: |
    Extreme bursty write volume with eventual-consistency tolerance calls for a partitioned log
    to absorb bursts plus a sharded write-optimized/time-series store. A single relational
    primary bottlenecks, cache-only loses durability, and per-write 2PC is far too slow at 500K/s.
  ref: "concepts.md#read-heavy-versus-write-heavy-systems"

- id: fundamentals-and-framework-077
  difficulty: expert
  tags: [availability, error-budget, decision]
  question: |
    Your service is at a 99.9% monthly SLO and has already burned 40 of its ~44 minutes of
    error budget this month due to incidents. A team wants to ship a risky refactor now. What is
    the SRE-aligned decision?
  options:
  - "Ship it; error budgets are advisory and never block launches"
  - "Immediately raise the SLO to 99.99% to create more budget"
  - "Hold or gate the risky launch since the budget is nearly exhausted, and shift focus to reliability until the budget resets"
  - "Delete the SLO so nothing is blocking"
  answer: 2
  explanation: |
    With the error budget nearly gone, the error-budget policy is to freeze/gate risky changes
    and prioritize reliability. Ignoring the budget defeats its purpose, raising the SLO makes
    the budget smaller (not larger), and deleting the SLO removes the guardrail entirely.
  ref: "concepts.md#sla-slo-sli-and-error-budgets"

- id: fundamentals-and-framework-078
  difficulty: intermediate
  tags: [scaling, stateless, combination]
  question: |
    Which combination most cleanly enables an application tier to autoscale horizontally under
    variable load?
  options:
  - "Keep the app tier stateless and put shared state in an external store, behind a load balancer"
  - "Store user sessions on local disk of each app node and use sticky sessions"
  - "Run one very large vertically-scaled node with all state in memory"
  - "Require every request to acquire a global lock"
  answer: 0
  explanation: |
    Statelessness plus externalized shared state behind a load balancer lets any node serve any
    request, enabling clean autoscaling. Local sessions + sticky routing hinder rebalancing, a
    single big node is a SPOF with a ceiling, and a global lock serializes everything.
  ref: "concepts.md#stateless-versus-stateful-services"

- id: fundamentals-and-framework-079
  difficulty: beginner
  tags: [modern, cdc, definition]
  question: |
    What does Change Data Capture (CDC) do?
  options:
  - "Encrypts data at rest in the database"
  - "Runs analytics queries directly on the primary"
  - "Compresses old table partitions"
  - "Streams a database's changes (from its transaction log) as events to sync caches, search indexes, and other services"
  answer: 3
  explanation: |
    CDC reads the database's change log (WAL) and emits changes as a stream to keep derived
    stores (search, cache, warehouse) in sync without dual writes. It is not encryption,
    compression, or query execution.
  ref: "concepts.md#modern-patterns-event-driven-cqrs-cdc-and-cell-based"

- id: fundamentals-and-framework-080
  difficulty: expert
  tags: [trade-offs, scenario, judgment]
  question: |
    A design synchronously replicates every write to three regions before acking the client to
    maximize durability and global consistency. The product is a latency-sensitive consumer chat
    app. What is the PRIMARY problem?
  options:
  - "Durability is too low with three regions"
  - "Synchronous cross-region replication adds a cross-continent round trip (~100-150 ms) to every write, blowing the interactive latency budget"
  - "Three regions is a single point of failure"
  - "It is impossible to replicate chat messages"
  answer: 1
  explanation: |
    Synchronous cross-region writes force a slow cross-continent RTT into the critical path,
    wrecking latency for an interactive chat app; async replication (accepting eventual
    consistency) fits better here. Durability is high (not low), three regions is not a SPOF,
    and chat replication is entirely feasible.
  ref: "concepts.md#trade-offs-and-when-to-use-what"

- id: fundamentals-and-framework-081
  difficulty: advanced
  tags: [tail-latency, fan-out, percentiles]
  question: |
    A request fans out to 100 independent leaf services and must wait for all of them. Each
    leaf has a p99 of 10 ms (1-in-100 requests is slow). Approximately what fraction of the
    top-level requests will experience at least one slow leaf?
  options:
  - "About 1%, the same as a single leaf"
  - "About 10%, one tenth of the leaves"
  - "About 63%, because 1 - (1 - 0.01)^100 dominated by the slowest of 100"
  - "About 100%, every request is always slow"
  answer: 2
  explanation: |
    P(>=1 slow) = 1 - (1 - p)^n = 1 - 0.99^100 ~ 0.63. A per-leaf p99 becomes roughly the
    top-level p63, which is exactly why wide fan-out forces obsessive tail control. It is far
    worse than the single-leaf 1%, not merely 10%, and not literally 100%.
  ref: "concepts.md#tail-latency-percentiles-and-coordinated-omission"

- id: fundamentals-and-framework-082
  difficulty: expert
  tags: [tail-latency, coordinated-omission, measurement]
  question: |
    A closed-loop load test (one outstanding request per worker, send the next only after the
    previous returns) reports a healthy p99, yet production users complain of frequent multi-
    second stalls. What measurement flaw most likely explains the gap?
  options:
  - "Coordinated omission: during a server stall the generator stops sending, so it never records the many requests that would have piled up, undercounting the tail"
  - "The load test used too many concurrent connections, inflating latency"
  - "Percentiles cannot be measured on the client side at all"
  - "The p99 is correct; users are simply wrong about the stalls"
  answer: 0
  explanation: |
    Closed-loop generators pause during stalls, so a 2 s pause is counted once instead of the
    hundreds of requests real traffic would have queued, badly understating p99/p999. Fixes:
    open-model load, HdrHistogram correction, edge-side measurement. It is not caused by too
    many connections, client-side percentiles are standard, and dismissing users is wrong.
  ref: "concepts.md#tail-latency-percentiles-and-coordinated-omission"

- id: fundamentals-and-framework-083
  difficulty: advanced
  tags: [tail-latency, hedged-requests]
  question: |
    To cut p99 on reads that hit one of several replicas, a team sends a duplicate ("backup")
    request to a second replica if the first has not responded within the p95 latency, taking
    whichever returns first. What is the primary cost of this hedged-request technique?
  options:
  - "A small amount of extra load (roughly the hedge rate, ~5%) from the duplicated requests"
  - "It makes the system strongly consistent, which is undesirable here"
  - "It doubles total traffic because every request is always sent twice"
  - "It increases p50 latency substantially"
  answer: 0
  explanation: |
    Hedging only fires for the slow tail (requests past p95), so it adds ~5% extra load while
    sharply cutting p99. It does not send every request twice (that would be ~100% extra),
    does not change the consistency model, and leaves p50 essentially unchanged.
  ref: "concepts.md#tail-latency-percentiles-and-coordinated-omission"

- id: fundamentals-and-framework-084
  difficulty: advanced
  tags: [percentiles, composition]
  question: |
    A colleague computes an overall service p99 by adding the p99 of each of its three
    sequential internal steps. Why is this method flawed?
  options:
  - "Percentiles are additive, so the sum is exactly correct"
  - "You should multiply the percentiles instead of adding them"
  - "Percentiles of different steps do not add; a request rarely hits the 99th percentile of all three steps at once, so summing overestimates, while ignoring correlation can also mislead"
  - "p99 is always equal to the mean, so use the mean sum"
  answer: 2
  explanation: |
    Percentiles are not additive across stages: the same request is unlikely to be simultaneously
    at the p99 of every step, so summing p99s overestimates the true composite p99 (the correct
    approach convolves the distributions or measures end-to-end). Multiplying is meaningless for
    latencies, and p99 is not the mean.
  ref: "concepts.md#tail-latency-percentiles-and-coordinated-omission"

- id: fundamentals-and-framework-085
  difficulty: expert
  tags: [tail-latency, fan-out, design]
  question: |
    A search service fans out to 200 shards per query and its p99 is unacceptable even though
    each shard is fast on average. Which combination most directly attacks the tail without
    simply buying more hardware?
  options:
  - "Increase the per-shard timeout so slow shards always complete"
  - "Switch every shard to synchronous strong consistency"
  - "Serialize the shard calls so only one runs at a time"
  - "Hedged/tied requests to shard replicas, plus returning results from the shards that answered within a deadline (partial results) rather than waiting for the slowest"
  answer: 3
  explanation: |
    At fan-out 200 the slowest shard dominates, so you hedge to replicas and/or return
    good-enough partial results at a deadline instead of waiting for stragglers. Raising
    timeouts makes the tail worse, forcing strong consistency adds latency, and serializing
    200 calls is catastrophically slow.
  ref: "concepts.md#tail-latency-percentiles-and-coordinated-omission"

- id: fundamentals-and-framework-086
  difficulty: advanced
  tags: [availability, mtbf, mttr]
  question: |
    Two designs have the same failure rate (MTBF ~ 720 hours). Design A recovers in ~1 hour
    (manual paging); Design B self-heals via automated failover in ~1 minute. What is the
    approximate availability difference?
  options:
  - "Both are identical because they fail equally often"
  - "Availability does not depend on recovery time"
  - "A ~ 99.998%, B ~ 99.86%; slower recovery is more available"
  - "A ~ 99.86%, B ~ 99.998%; shrinking MTTR buys nines cheaply even when failures are unchanged"
  answer: 3
  explanation: |
    A = MTBF/(MTBF+MTTR). A: 720/721 ~ 99.86%; B: 720/(720+1/60) ~ 99.998%. Cutting MTTR from
    1 h to 1 min gains ~2 nines with the same failure rate, which is why fast detection and
    automated failover are so valuable. Recovery time absolutely matters.
  ref: "concepts.md#availability-math-mtbf-mttr-and-the-cost-of-nines"

- id: fundamentals-and-framework-087
  difficulty: expert
  tags: [availability, correlated-failure, redundancy]
  question: |
    You add a fourth replica to a service, expecting the parallel formula 1 - (1 - A)^n to push
    availability toward another nine, but real availability barely improves. What is the most
    likely reason?
  options:
  - "The formula requires an even number of replicas"
  - "Four replicas is beyond the maximum that any load balancer supports"
  - "Failures are correlated (shared AZ, config, deploy, or a poison request), so replicas fail together and the independence assumption behind 1 - (1 - A)^n does not hold"
  - "Adding replicas always reduces availability"
  answer: 2
  explanation: |
    The parallel-redundancy formula assumes independent failures; when replicas share a failure
    domain (AZ, config service, cert, deploy pipeline, or receive the same poison input) they go
    down together, so extra replicas add little. The fix is fault isolation (multi-AZ/region,
    cells), not more replicas in the same domain.
  ref: "concepts.md#availability-math-mtbf-mttr-and-the-cost-of-nines"

- id: fundamentals-and-framework-088
  difficulty: advanced
  tags: [availability, cost-of-nines]
  question: |
    Management asks to move a feature from 99.99% to 99.999% availability. Which statement best
    captures the real engineering implication of that single extra nine?
  options:
  - "It is a minor config change with negligible added cost"
  - "The downtime budget drops from ~52 min/yr to ~5.3 min/yr, which is too little for any human-in-the-loop recovery, forcing fully automated failover and redundancy of every dependency at roughly an order-of-magnitude more cost"
  - "It reduces cost because fewer incidents are allowed"
  - "It only requires adding one more replica in the same AZ"
  answer: 1
  explanation: |
    Five nines leaves ~5.3 min/year, too little for anyone to be paged and respond, so recovery
    must be zero-touch and every dependency redundant, roughly 10x the cost/effort of four
    nines. It is not a config tweak, does not reduce cost, and a same-AZ replica does not address
    correlated failure or manual-recovery latency.
  ref: "concepts.md#availability-math-mtbf-mttr-and-the-cost-of-nines"

- id: fundamentals-and-framework-089
  difficulty: expert
  tags: [availability, mttr, detection]
  question: |
    A team has driven MTBF very high but a rare failure still takes ~3 hours to detect and
    recover because it depends on a customer complaint plus manual investigation. Given a fixed
    failure rate, what is the highest-leverage availability investment?
  options:
  - "Add more redundant replicas to further raise MTBF"
  - "Reduce MTTR: automated detection (health checks/alerts), automated failover, and tested runbooks, since availability = MTBF/(MTBF+MTTR) and MTTR now dominates"
  - "Raise the SLO so the failures no longer count"
  - "Nothing can be done once MTBF is high"
  answer: 1
  explanation: |
    When MTBF is already high, MTTR dominates the availability ratio, so cutting detection and
    recovery time (auto-detect, auto-failover, rehearsed runbooks) yields the most nines per
    dollar. More replicas chase MTBF you have already maxed, raising the SLO changes nothing
    real, and improvement is clearly possible.
  ref: "concepts.md#availability-math-mtbf-mttr-and-the-cost-of-nines"

- id: fundamentals-and-framework-090
  difficulty: advanced
  tags: [durability, availability, distinction]
  question: |
    An interviewer asks you to distinguish durability from availability with a concrete example.
    Which pairing is correct?
  options:
  - "They are the same property measured in different units"
  - "Durability is about read latency; availability is about write latency"
  - "A more available system is automatically more durable"
  - "A store undergoing a failover is briefly unavailable (cannot serve requests now) yet fully durable (no committed data lost); conversely a fast store that acks before persisting can be highly available yet lose recent writes on crash"
  answer: 3
  explanation: |
    Availability is reachability now; durability is survival of stored data over time. A store
    can be temporarily unreachable but lose nothing (durable, briefly unavailable), or serve
    fast while risking loss of un-persisted writes (available, less durable). They are distinct
    and not implied by each other.
  ref: "concepts.md#durability-rpo-rto-and-data-loss-math"

- id: fundamentals-and-framework-091
  difficulty: expert
  tags: [durability, rpo, replication]
  question: |
    A payments system must guarantee that an acknowledged transfer is never lost even if the
    primary node is destroyed the instant after the ack. Which replication choice meets this,
    and what is the cost?
  options:
  - "Asynchronous replication; cost is nothing because it is faster"
  - "Synchronous (or quorum) replication so the write is durable on another node before ack, giving RPO ~ 0; cost is added write latency (the replica round trip) and reduced availability if the replica is unreachable"
  - "No replication; keep a single very reliable node"
  - "Cache the write in memory on the primary and ack immediately"
  answer: 1
  explanation: |
    RPO ~ 0 for an acked write requires the write to be durable on another node before ack:
    synchronous or quorum replication. The price is latency (replica RTT in the write path) and
    lower availability during partitions. Async loses the un-shipped tail on failover, a single
    node has no protection, and in-memory-only ack loses data on crash.
  ref: "concepts.md#durability-rpo-rto-and-data-loss-math"

- id: fundamentals-and-framework-092
  difficulty: advanced
  tags: [durability, rpo, rto]
  question: |
    A stakeholder says "make the database more durable." What is the most useful senior response
    that turns this into an actionable design constraint?
  options:
  - "Ask what RPO (how much recent data loss is tolerable, in time) and RTO (how long to recover) the business actually requires, because those numbers determine the replication and backup design"
  - "Silently add three more replicas and move on"
  - "Explain that durability is impossible to guarantee"
  - "Switch to eventual consistency to improve durability"
  answer: 0
  explanation: |
    "More durable" is unquantified; pinning RPO (tolerable data-loss window) and RTO (tolerable
    downtime) turns it into concrete replication/backup requirements. Blindly adding replicas
    may not meet the real target, durability is achievable to very high nines, and consistency
    model is a separate axis from durability.
  ref: "concepts.md#durability-rpo-rto-and-data-loss-math"

- id: fundamentals-and-framework-093
  difficulty: expert
  tags: [durability, quorum, node-loss]
  question: |
    A quorum-replicated store acks a write only after it is committed on W=3 replicas out of
    N=5. How many simultaneous replica losses can this write survive without being lost, and
    what does raising W trade against?
  options:
  - "It survives up to W - 1 = 2 simultaneous losses; raising W improves durability but increases write latency and lowers write availability (more replicas must be up to ack)"
  - "It survives 5 losses because there are 5 replicas"
  - "It survives 0 losses because quorum does not affect durability"
  - "It survives W = 3 losses; raising W has no downside"
  answer: 0
  explanation: |
    A write durable on W copies survives up to W - 1 simultaneous losses (at least one copy
    remains). Larger W means more copies (better durability) but more nodes must be reachable to
    ack, raising latency and lowering write availability. It is neither all 5 nor zero, and there
    is always a trade-off.
  ref: "concepts.md#durability-rpo-rto-and-data-loss-math"

- id: fundamentals-and-framework-094
  difficulty: advanced
  tags: [durability, s3, nines]
  question: |
    S3 advertises "eleven nines" (99.999999999%) of durability but only ~99.9% availability in
    its SLA. What does this pairing tell you?
  options:
  - "The numbers are contradictory and one must be a typo"
  - "Durability (data will not be lost, via erasure coding/replication across devices and AZs) is engineered far higher than availability (ability to reach it at any given moment), because losing data is far worse than a brief inability to read it"
  - "Availability is always higher than durability"
  - "Eleven nines of durability guarantees eleven nines of availability"
  ref: "concepts.md#durability-rpo-rto-and-data-loss-math"
  answer: 1
  explanation: |
    Durability and availability are independent guarantees: S3 makes data loss astronomically
    unlikely while accepting occasional brief unreachability, because permanent loss is far
    worse than a retryable outage. The two are not contradictory, availability is not always
    higher, and one does not imply the other.

- id: fundamentals-and-framework-095
  difficulty: advanced
  tags: [nfr-budget, latency-budget]
  question: |
    You have a p99 < 200 ms budget. TLS+client RTT to the edge is ~40 ms, in-region service
    RTT+LB ~5 ms, and compute ~20 ms. A proposed feature adds a synchronous call to a service in
    another continent (~140 ms RTT). What is the correct budgeting conclusion?
  options:
  - "It fits easily; 200 ms is plenty"
  - "The cross-continent call alone (~140 ms) plus the existing ~65 ms exceeds 200 ms with no headroom, so that call must be made in-region, async, or cached rather than synchronous cross-continent"
  - "Only the mean matters, so ignore the p99 budget"
  - "Add the latencies of parallel calls together to check the budget"
  answer: 1
  explanation: |
    40+5+20 = 65 ms already, and a ~140 ms cross-continent RTT pushes the total past 200 ms with
    no room for GC/retries, so the design must avoid a synchronous cross-continent hop (go
    in-region, async, or cache). The budget is p99 not mean, and parallel calls overlap rather
    than sum.
  ref: "concepts.md#numbers-and-nfr-budgets-that-drive-the-design"

- id: fundamentals-and-framework-096
  difficulty: expert
  tags: [nfr-budget, cache, db-load]
  question: |
    A read path serves 100K read QPS through a cache in front of the database. If the cache hit
    rate is 95%, approximately what read QPS reaches the database, and why does the hit rate
    matter so much?
  options:
  - "~95K QPS; the hit rate barely changes DB load"
  - "~5K QPS; DB load = read QPS x (1 - hit rate), so 95% hit rate cuts DB read load ~20x, which is the entire point of the cache"
  - "~100K QPS; the cache does not reduce DB load"
  - "~50K QPS; the cache always halves load"
  answer: 1
  explanation: |
    DB read QPS = 100K x (1 - 0.95) = 5K. Because DB load scales with the miss rate, pushing the
    hit rate from 90% to 95% halves DB load (10K to 5K) and 95% vs no cache is a 20x reduction,
    so small hit-rate gains have outsized effects. It is not ~95K, not unchanged, and not a fixed
    halving.
  ref: "concepts.md#numbers-and-nfr-budgets-that-drive-the-design"

- id: fundamentals-and-framework-097
  difficulty: expert
  tags: [nfr-budget, littles-law, pool-sizing]
  question: |
    A service must sustain 50,000 QPS at an average latency of 20 ms. Using Little's Law, roughly
    how many requests are in flight concurrently, and what does that number size?
  options:
  - "~1,000 concurrent; it sizes thread pools, connection pools, and DB connections so you do not self-inflict queueing"
  - "~2,500,000 concurrent; it sizes total disk capacity"
  - "~10 concurrent; it sizes the number of servers"
  - "Concurrency cannot be derived from QPS and latency"
  answer: 0
  explanation: |
    Little's Law: in-flight = throughput x latency = 50,000/s x 0.020 s = 1,000. That figure
    sizes worker threads, connection pools, and downstream DB connections; undersize them and you
    queue and blow tail latency near saturation. It is not millions, not ~10, and is directly
    derivable.
  ref: "concepts.md#numbers-and-nfr-budgets-that-drive-the-design"

- id: fundamentals-and-framework-098
  difficulty: advanced
  tags: [nfr-budget, consistency, design-impact]
  question: |
    Midway through a design the interviewer adds: "reads must be linearizable (always see the
    latest committed write)." Which set of earlier decisions does this most directly invalidate?
  options:
  - "Nothing changes; linearizability is free"
  - "Serving reads from lagging replicas and from a cache for freshness-sensitive data must be reconsidered, since those can return stale values; you now route such reads to the primary or a quorum, paying latency (PACELC 'C')"
  - "You must immediately shard the database"
  - "You should switch the whole system to a message queue"
  answer: 1
  explanation: |
    Linearizable reads cannot come from asynchronously-lagging replicas or a possibly-stale
    cache, so those reads move to the primary or a read quorum at the cost of latency and
    replica-scale freedom (PACELC's normal-operation C-vs-L trade-off). It is not free, and
    sharding or queues do not address staleness.
  ref: "concepts.md#numbers-and-nfr-budgets-that-drive-the-design"

- id: fundamentals-and-framework-099
  difficulty: advanced
  tags: [nfr-budget, fleet-sizing]
  question: |
    A single server sustains ~2,000 QPS at safe utilization. Peak traffic is ~50,000 QPS and you
    want N+1 redundancy plus headroom to run at ~65% utilization. Roughly how many servers should
    you provision?
  options:
  - "About 25 servers, since 50,000 / 2,000 = 25 and redundancy/headroom are unnecessary"
  - "About 2 servers, because averages are lower than peaks"
  - "Around 40 servers: ~50,000 / 2,000 = 25 at full load, divide by ~0.65 utilization (~38), then add ~1 for N+1"
  - "Exactly 50,000 servers, one per QPS"
  answer: 2
  explanation: |
    Base need is 50,000/2,000 = 25 servers at 100% util; to stay near 65% you need ~25/0.65 ~ 38,
    then +1 for N+1 redundancy, so ~40. Ignoring headroom (25) risks a latency blowup near
    saturation, provisioning for average under-sizes for peak, and one-per-QPS is nonsensical.
  ref: "concepts.md#numbers-and-nfr-budgets-that-drive-the-design"

- id: fundamentals-and-framework-100
  difficulty: expert
  tags: [nfr-budget, cross-linking, judgment]
  question: |
    Which statement best expresses how the non-functional requirements interlock when you "drive
    the design from the numbers"?
  options:
  - "Each NFR is independent and can be maximized separately"
  - "Estimation numbers feed the latency budget; the availability target sets redundancy, which drives cost and (via synchronous replication) both latency and durability/RPO; and the consistency NFR decides whether you may cache or replica-scale at all"
  - "Cost is the only NFR that matters; the rest follow automatically"
  - "Consistency and durability are the same requirement"
  answer: 1
  explanation: |
    The NFRs are coupled: sizing drives the latency budget; more nines means more redundancy
    (cost), and synchronous replication for durability/RPO also adds write latency; and the
    consistency requirement gates caching/replica reads. Naming these linkages is the senior
    skill. NFRs are not independent, cost is not the sole driver, and consistency differs from
    durability.
  ref: "concepts.md#numbers-and-nfr-budgets-that-drive-the-design"

- id: fundamentals-and-framework-101
  difficulty: advanced
  tags: [interview-method, defending-tradeoffs]
  question: |
    The interviewer challenges your eventual-consistency choice with "are you sure?" What is the
    strongest senior response pattern?
  options:
  - "Immediately switch to strong consistency to satisfy them"
  - "Insist eventual consistency is always correct and refuse to discuss it"
  - "Restate the NFR that permits staleness, confirm whether their question introduces a new constraint, and only then adapt; if nothing changed, defend the choice with its gain (availability/latency/scale) and give-up (bounded staleness)"
  - "Say both choices are equivalent so it does not matter"
  answer: 2
  explanation: |
    A senior candidate neither flips reflexively nor digs in dogmatically: re-anchor on the NFR,
    check whether the challenge adds a constraint, and adapt only if it genuinely does, defending
    with gain/give-up otherwise. Instant caving signals shallow understanding, refusal signals
    rigidity, and claiming equivalence is false.
  ref: "concepts.md#driving-the-interview-and-defending-trade-offs-at-senior-level"

- id: fundamentals-and-framework-102
  difficulty: advanced
  tags: [interview-method, restraint]
  question: |
    During a design at modest scale (well below a single primary's capacity), a candidate
    proactively shards the database across 16 nodes "to be safe." How should this read to a
    senior interviewer?
  options:
  - "As a strong signal, because more sharding is always better"
  - "As over-engineering: premature sharding adds cost and distributed-systems complexity with no current benefit; the senior move is to stay simple and state the flip-condition (shard when write QPS or dataset exceeds one primary)"
  - "As irrelevant, since interviewers do not evaluate scaling decisions"
  - "As a requirement of every modern design"
  answer: 1
  explanation: |
    Knowing when NOT to add complexity is a seniority signal; sharding below the single-box
    ceiling buys nothing and costs a lot, so the strong answer stays simple and names the
    condition that would flip the decision. More sharding is not always better, scaling judgment
    is very much evaluated, and sharding is not universally required.
  ref: "concepts.md#driving-the-interview-and-defending-trade-offs-at-senior-level"

- id: fundamentals-and-framework-103
  difficulty: expert
  tags: [interview-method, quantify, defense]
  question: |
    An interviewer says "your design calls three services synchronously in series, each 99.9%
    available; is that acceptable for a 99.9% SLO?" What is the strongest response?
  options:
  - "Yes, because each service already meets 99.9%"
  - "No: 0.999^3 ~ 99.7%, which is below the 99.9% SLO because synchronous dependencies multiply; I would cut a hard dependency, add a fallback/cache, or make one call async to raise the ceiling"
  - "Yes, because the slowest service sets the availability"
  - "It cannot be computed without load-testing"
  answer: 1
  explanation: |
    Series dependencies multiply: 0.999^3 ~ 0.997 = 99.7% < 99.9%, so the composed path fails the
    SLO and you must reduce hard dependencies or add fallbacks/async. Per-service compliance does
    not guarantee composed compliance, availability composes by multiplication not by the slowest
    link, and the math is straightforward.
  ref: "concepts.md#driving-the-interview-and-defending-trade-offs-at-senior-level"

- id: fundamentals-and-framework-104
  difficulty: advanced
  tags: [interview-method, failure-modes]
  question: |
    Which behavior most reliably signals senior/staff level in the deep-dive portion of a system
    design interview?
  options:
  - "Waiting to be asked before discussing any failure mode"
  - "Proactively volunteering failure modes and their blast radius (primary dies -> RTO/RPO; cache node dies -> thundering herd and request coalescing; AZ dies -> correlated failure and cells) before the interviewer probes"
  - "Naming as many database products as possible"
  - "Producing the largest possible architecture diagram"
  answer: 1
  explanation: |
    Senior candidates surface failure modes and blast radius unprompted and tie each to a
    mitigation, showing operational maturity. Waiting to be asked, name-dropping products, and
    drawing bigger diagrams are not depth signals.
  ref: "concepts.md#driving-the-interview-and-defending-trade-offs-at-senior-level"

- id: fundamentals-and-framework-105
  difficulty: expert
  tags: [interview-method, steelman]
  question: |
    You chose async event-driven fan-out over synchronous RPC. The interviewer asks you to
    justify it against the alternative. Which answer demonstrates the strongest trade-off
    reasoning?
  options:
  - "Async is modern and RPC is outdated, so async wins"
  - "The synchronous option would be simpler to reason about and give an immediate answer, but at this fan-out and burst profile it couples availability multiplicatively and cannot absorb spikes; I accept eventual consistency and idempotency complexity to gain decoupling and burst tolerance, and I would revert to sync if the flow required an immediate consistent response"
  - "RPC cannot scale, so there is no alternative to consider"
  - "It does not matter which one is chosen"
  answer: 1
  explanation: |
    The strongest form steelmans the alternative (sync is simpler, immediate), rejects it for a
    specific reason (availability coupling, burst absorption), names the cost accepted (eventual
    consistency, idempotency), and gives a flip-condition. Dismissing RPC as outdated or
    unscalable, or shrugging, all fail to show reasoning.
  ref: "concepts.md#driving-the-interview-and-defending-trade-offs-at-senior-level"

- id: fundamentals-and-framework-106
  difficulty: advanced
  tags: [tail-latency, cache, thundering-herd]
  question: |
    A popular cache key expires and thousands of concurrent requests miss simultaneously, all
    stampeding the database and spiking p99. Which technique most directly prevents this
    thundering herd?
  options:
  - "Set the TTL to zero so the key never caches"
  - "Request coalescing / single-flight (let one request recompute while others wait) plus staggered TTLs or early async refresh, so only one miss hits the DB per key"
  - "Increase the database timeout so all requests eventually succeed"
  - "Remove the cache entirely to avoid expiry"
  answer: 1
  explanation: |
    Coalescing collapses concurrent misses for the same key into a single backend fetch while
    the rest wait, and jittered TTLs / early refresh avoid synchronized expiry, protecting the DB
    and the tail. Zero TTL and removing the cache destroy the cache's benefit, and a longer
    timeout just prolongs the overload.
  ref: "concepts.md#tail-latency-percentiles-and-coordinated-omission"

- id: fundamentals-and-framework-107
  difficulty: expert
  tags: [availability, planned-maintenance, sla]
  question: |
    A vendor advertises "99.99% availability" but their contract excludes planned maintenance
    windows from the calculation. Why does this materially matter to you as an integrator?
  options:
  - "It does not matter; excluded time is still counted as uptime"
  - "Planned maintenance always happens at night, so it never affects users"
  - "Excluding maintenance makes the SLA stricter, which benefits you"
  - "Your experienced availability can be well below 99.99% because maintenance downtime does not count against their SLA, so you must design for those windows (redundancy, retries, or a second provider) rather than trusting the headline number"
  answer: 3
  explanation: |
    If planned maintenance is excluded, the vendor can be down during those windows without
    breaching the SLA, so your real experienced availability is lower than 99.99% and you must
    engineer around it. Excluded time reduces (not preserves) effective uptime, maintenance is
    not guaranteed to be off-peak for your users, and the exclusion loosens, not tightens, the
    guarantee.
  ref: "concepts.md#availability-math-mtbf-mttr-and-the-cost-of-nines"

- id: fundamentals-and-framework-108
  difficulty: advanced
  tags: [durability, rpo, async-replication]
  question: |
    A database uses asynchronous replication to a standby with typical replication lag of ~2
    seconds. The primary fails and you promote the standby. What is the realistic RPO, and how
    would you reduce it?
  options:
  - "RPO is zero because the standby is a full copy"
  - "RPO equals the RTO by definition"
  - "RPO is infinite because async replication loses everything"
  - "RPO is roughly the replication lag (~2 s of the most recent writes may be lost); reduce it with synchronous or semi-synchronous replication, accepting added write latency"
  answer: 3
  explanation: |
    With async replication, writes not yet shipped when the primary dies are lost, so RPO ~ the
    lag (~2 s here); moving to synchronous/semi-sync replication shrinks RPO toward zero at the
    cost of write latency. RPO is not zero for async, is a data-loss window not the recovery
    time, and only the un-replicated tail is lost, not everything.
  ref: "concepts.md#durability-rpo-rto-and-data-loss-math"

- id: fundamentals-and-framework-109
  difficulty: expert
  tags: [nfr-budget, latency, cross-region]
  question: |
    A global app has a 100 ms p99 read budget and users on three continents. Reads tolerate a few
    seconds of staleness. Which architecture best satisfies both the latency budget and the
    consistency NFR?
  options:
  - "A single primary region with strongly consistent reads for everyone, accepting cross-continent RTTs"
  - "Regional read replicas (or edge caches) near users serving eventually-consistent reads locally, with asynchronous replication from the write region, so reads stay in-region and fit the budget"
  - "Synchronous multi-region reads via quorum across all three continents on every read"
  - "Serve all reads from a single global cache in one region"
  answer: 1
  explanation: |
    Because staleness is tolerable, place read replicas/edge caches near users and serve reads
    in-region (avoiding the ~100+ ms cross-continent RTT), replicating asynchronously; this fits
    both the latency budget and the relaxed consistency NFR. A single primary or single-region
    cache forces cross-continent RTTs for distant users, and synchronous cross-continent quorum
    reads blow the budget.
  ref: "concepts.md#numbers-and-nfr-budgets-that-drive-the-design"

- id: fundamentals-and-framework-110
  difficulty: advanced
  tags: [tail-latency, percentiles, slo]
  question: |
    A service reports mean latency 25 ms and p999 of 3 s. Users on a page that issues ~50
    sub-requests per load complain constantly. Which analysis is correct?
  options:
  - "The mean is 25 ms so the service is healthy; the complaints are unrelated"
  - "With ~50 sub-requests per page, the chance a page hits the 1-in-1000 tail is roughly 1 - 0.999^50 ~ 5%, so about 1 in 20 page loads suffers a 3 s stall; the p999 tail, not the mean, drives the user-perceived experience"
  - "p999 is irrelevant because it only affects 0.1% of requests"
  - "Reducing the mean to 20 ms will fix the complaints"
  answer: 1
  explanation: |
    Fan-out multiplies tail exposure: 1 - 0.999^50 ~ 5%, so ~1 in 20 page loads hits the 3 s
    p999 stall despite a great mean, which is exactly what users feel. The mean hides this, p999
    is very relevant under fan-out, and shaving the mean does nothing for the tail.
  ref: "concepts.md#tail-latency-percentiles-and-coordinated-omission"

- id: fundamentals-and-framework-111
  difficulty: expert
  tags: [availability, dependency, isolation, judgment]
  question: |
    Your service (target 99.99%) synchronously calls a recommendations service (99.5%) to enrich
    responses. Recommendations are nice-to-have, not essential. What is the best design?
  options:
  - "Keep the synchronous hard dependency; the recommendation service will probably be fine"
  - "Raise the recommendation service's SLO to 99.99% and keep it synchronous and required"
  - "Replicate the recommendation service across more nodes in the same AZ"
  - "Make the recommendation call best-effort with a tight timeout, circuit breaker, and graceful degradation (serve the response without recommendations on failure), so its 99.5% does not cap your 99.99%"
  answer: 3
  explanation: |
    A synchronous hard dependency caps your availability at its own (99.5%), so for a nice-to-have
    you make it best-effort with timeout, circuit breaker, and degradation, decoupling your
    availability from it. Keeping it required inherits its lower ceiling, unilaterally raising
    another team's SLO is not something you control, and same-AZ replicas do not address the
    dependency-ceiling problem.
  ref: "concepts.md#availability-math-mtbf-mttr-and-the-cost-of-nines"

- id: fundamentals-and-framework-112
  difficulty: advanced
  tags: [interview-method, structure, driving]
  question: |
    At the very start of a design interview, which opening most strongly signals a candidate who
    can drive the session?
  options:
  - "Immediately drawing a load balancer, three services, and a database"
  - "Proposing a plan and confirming it: 'I'll scope functional and non-functional requirements, do a quick capacity estimate, sketch the high-level design, then deep-dive the fan-out and datastore. Does that ordering work, and are there areas you want me to emphasize?'"
  - "Asking the interviewer to tell you exactly what to design step by step"
  - "Picking a trendy database and defending it before any requirements"
  answer: 1
  explanation: |
    Proposing and confirming a structured plan (and inviting the interviewer to steer emphasis)
    shows ownership and time discipline. Jumping to a diagram or a database before requirements
    designs the wrong thing, and asking to be told each step is the opposite of driving.
  ref: "concepts.md#driving-the-interview-and-defending-trade-offs-at-senior-level"

- id: fundamentals-and-framework-113
  difficulty: expert
  tags: [durability, availability, tradeoff, scenario]
  question: |
    A write path acknowledges the client as soon as the data is in the primary's memory (before
    it is fsync'd to disk or replicated) to hit an aggressive write-latency SLO. For a financial
    ledger, what is the fundamental flaw?
  options:
  - "It makes writes too slow"
  - "Acking before the write is durable (persisted and/or replicated) means a crash between ack and persistence loses an acknowledged financial transaction (RPO > 0), which is unacceptable for a ledger; durability must not be sacrificed for latency here"
  - "It improves durability at the cost of consistency"
  - "There is no flaw; in-memory acks are always durable"
  answer: 1
  explanation: |
    Acking before durability (fsync/replication) creates a window where an acknowledged write can
    vanish on crash, giving RPO > 0, which a financial ledger cannot tolerate; the latency SLO
    must yield to durability (or use fast synchronous replication). It does not make writes slow,
    does not improve durability, and in-memory acks are explicitly not durable.
  ref: "concepts.md#durability-rpo-rto-and-data-loss-math"

- id: fundamentals-and-framework-114
  difficulty: advanced
  tags: [nfr-budget, cache-sizing, working-set]
  question: |
    Daily reads touch ~500 GB of distinct objects; ~20% of objects serve ~80% of reads, and each
    cache node holds ~64 GB of usable RAM. Roughly how many cache nodes should you plan for the
    hot set, and what assumption dominates the estimate?
  options:
  - "About 2-3 nodes; the hot set is ~100 GB (20% of 500 GB), and hot bytes / per-node RAM = 100/64 ~ 2 with headroom -> a small cluster, dominated by the hot-fraction assumption"
  - "About 8 nodes because you must cache all 500 GB"
  - "Exactly 1 node, since caches are always small"
  - "About 500 nodes, one per GB of distinct data"
  answer: 0
  explanation: |
    Hot bytes ~ 0.20 x 500 GB = 100 GB; 100/64 ~ 1.6, so ~2 nodes plus headroom/replication ->
    a handful of nodes, and the estimate hinges on the hot-fraction (80/20) assumption. Caching
    all 500 GB defeats the point, one node under-sizes the hot set, and one-node-per-GB ignores
    node capacity.
  ref: "concepts.md#numbers-and-nfr-budgets-that-drive-the-design"

- id: fundamentals-and-framework-115
  difficulty: expert
  tags: [interview-method, cross-linking, judgment]
  question: |
    Late in an interview you must justify committing to a 99.9% SLO (not 99.99%) for a social
    feature while promising low tail latency and eventual consistency. Which response best weaves
    the numbers and trade-offs together?
  options:
  - "Pick 99.99% because more nines are always better for users"
  - "99.9% (~43 min/month budget) matches a non-critical social feature; the extra nine would demand multi-region and zero-touch failover at ~10x cost we cannot justify. Eventual consistency lets me cache and use in-region read replicas to hold the tail latency down, and the error budget lets us keep shipping features until it is spent"
  - "Consistency, latency, and availability are independent, so I can maximize all three"
  - "Availability does not affect cost, so commit to the highest number possible"
  answer: 1
  explanation: |
    The strong answer ties the SLO to the budget and business criticality, prices the extra nine
    (~10x, multi-region), and shows how the eventual-consistency choice enables the caching/replica
    strategy that meets the tail-latency goal, plus the error-budget velocity link. Maximizing all
    NFRs at once ignores their coupling, and more nines are neither always better nor free.
  ref: "concepts.md#driving-the-interview-and-defending-trade-offs-at-senior-level"
