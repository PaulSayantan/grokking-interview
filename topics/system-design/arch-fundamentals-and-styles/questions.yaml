topic: "Architectural Patterns: Fundamentals & Style Selection"
domain: system-design
topic_slug: arch-fundamentals-and-styles
version: 1
questions:
  - id: arch-fundamentals-and-styles-001
    difficulty: beginner
    tags: [altitude, style-vs-pattern, fundamentals]
    question: |
      What best distinguishes an architectural style from a GoF design pattern?
    options:
      - "A style shapes the whole system's structure/deployment; a design pattern arranges a few collaborating classes"
      - "A style is object-level; a design pattern is system-level"
      - "They are the same thing at different names"
      - "A style is always object-oriented; a pattern is always functional"
    answer: 0
    explanation: |
      They live at different altitudes. An architectural style is coarse-grained and governs how
      the entire application is partitioned and deployed; a GoF design pattern is fine-grained and
      arranges a small cluster of classes/objects locally.
    ref: "concepts.md#style-vs-design-pattern-vs-characteristic"

  - id: arch-fundamentals-and-styles-002
    difficulty: intermediate
    tags: [ilities, characteristics, requirements]
    question: |
      In the altitude model, what is an architectural characteristic (an "-ility") such as
      scalability?
    options:
      - "A structural style like Layered or Microservices"
      - "A quality requirement the chosen style is meant to optimize"
      - "An object-level collaboration pattern"
      - "A deployment tool"
    answer: 1
    explanation: |
      A characteristic is not a structure at all — it is a quality/requirement (scalability,
      availability, deployability). A style is chosen as the means to optimize the ranked
      characteristics, which are the goal.
    ref: "concepts.md#architectural-characteristics-the--ilities"

  - id: arch-fundamentals-and-styles-003
    difficulty: beginner
    tags: [laws, trade-offs, richards-ford]
    question: |
      What is the First Law of Software Architecture (Richards & Ford)?
    options:
      - "Always prefer microservices over monoliths"
      - "The database is always the bottleneck"
      - "Everything in software architecture is a trade-off"
      - "Simplicity beats scalability in every case"
    answer: 2
    explanation: |
      The First Law states that everything in software architecture is a trade-off; if something
      seems not to be, you simply haven't found the trade-off yet. There is no universally best
      style, only the best fit for the ranked characteristics and context.
    ref: "concepts.md#first-law-of-software-architecture"

  - id: arch-fundamentals-and-styles-004
    difficulty: advanced
    tags: [quantum, spectrum, deployability]
    question: |
      What does an "architecture quantum" measure, and why does it matter on the
      monolith-to-distributed spectrum?
    options:
      - "The number of CPU cores; more cores mean more distributed"
      - "The count of design patterns used in the codebase"
      - "The latency budget of a request in milliseconds"
      - "An independently deployable unit with high cohesion and its own data; monolithic styles have one, distributed styles have many"
    answer: 3
    explanation: |
      A quantum is an independently deployable unit with high functional cohesion and its own
      data. Monolithic styles are a single quantum; distributed styles are many. It is the axis
      that positions styles along the spectrum.
    ref: "concepts.md#the-monolith-to-distributed-spectrum"

  - id: arch-fundamentals-and-styles-005
    difficulty: intermediate
    tags: [adr, rationale, second-law]
    question: |
      What is the primary purpose of an Architecture Decision Record (ADR)?
    options:
      - "To capture the context, decision, and consequences (the WHY) of an architectural choice so it isn't relitigated"
      - "To store runtime metrics for dashboards"
      - "To generate UML diagrams automatically"
      - "To replace the need for any design documentation"
    answer: 0
    explanation: |
      An ADR (Nygard) records Title/Status/Context/Decision/Consequences. It preserves the
      rationale — the Second Law's "why is more important than how" — and is immutable: you
      supersede rather than edit, keeping the reasoning history.
    ref: "concepts.md#architecture-decision-records"

  - id: arch-fundamentals-and-styles-006
    difficulty: advanced
    tags: [fitness-functions, evolutionary, ci]
    question: |
      An architectural fitness function is best described as:
    options:
      - "A one-time manual architecture review at project kickoff"
      - "An automated check that continuously verifies an architectural characteristic or constraint"
      - "A performance profiler that runs only in production"
      - "A dependency-injection framework"
    answer: 1
    explanation: |
      From Building Evolutionary Architectures, a fitness function is any automated, repeatable
      check (e.g. dependency-direction rules, coupling thresholds, a p99-latency CI gate) that
      verifies an -ility or constraint, so architecture doesn't erode as the system evolves.
    ref: "concepts.md#architectural-fitness-functions"

  - id: arch-fundamentals-and-styles-007
    difficulty: intermediate
    tags: [conway, org, boundaries]
    question: |
      Your microservice boundaries keep degrading into a tangle despite a clean design. Which
      principle most directly explains this, and what is the fix?
    options:
      - "CAP theorem; add more replicas"
      - "First Law; add more caching"
      - "Conway's Law; use the Inverse Conway Maneuver to align teams to the target boundaries"
      - "Big Ball of Mud; rewrite from scratch"
    answer: 2
    explanation: |
      Conway's Law says the system's structure mirrors the organization's communication structure.
      The Inverse Conway Maneuver deliberately shapes teams (e.g. one team per service) so the
      desired architectural boundaries hold.
    ref: "concepts.md#conways-law-and-the-inverse-conway-maneuver"

  - id: arch-fundamentals-and-styles-008
    difficulty: beginner
    tags: [anti-pattern, big-ball-of-mud]
    question: |
      A "Big Ball of Mud" refers to:
    options:
      - "A microservices system with too many services"
      - "A well-layered monolith"
      - "A serverless function with a cold start"
      - "A system with no discernible architecture — haphazard, tangled, and globally coupled"
    answer: 3
    explanation: |
      Foote & Yoder's Big Ball of Mud is the default "no-architecture" anti-pattern: a sprawling,
      spaghetti-coded system with absent boundaries where any part can reach any other, usually
      from unplanned, expedient growth.
    ref: "concepts.md#big-ball-of-mud"

  - id: arch-fundamentals-and-styles-009
    difficulty: beginner
    tags: [layered, n-tier, testability]
    question: |
      How does the Layered (N-tier) architecture primarily partition an application?
    options:
      - "By technical concern (presentation, business, persistence, database)"
      - "By business capability / bounded context"
      - "By geographic region"
      - "By event type"
    answer: 0
    explanation: |
      Layered architecture organizes code by technical concern into horizontal layers
      (presentation, business, persistence, database), each with a single responsibility and
      calling only the layer below (layers of isolation).
    ref: "concepts.md#layered-architecture"

  - id: arch-fundamentals-and-styles-010
    difficulty: intermediate
    tags: [layered, sinkhole, anti-pattern]
    question: |
      What is the "architecture sinkhole" anti-pattern in a layered architecture?
    options:
      - "A layer that caches too aggressively"
      - "Requests that pass straight through layers doing no real work, adding cost without value"
      - "A database that runs out of disk space"
      - "A circular dependency between two services"
    answer: 1
    explanation: |
      The sinkhole occurs when many requests merely pass through layers as simple pass-throughs
      without any layer adding processing value — pure overhead. A few are fine; if most requests
      do this, layering isn't buying you anything.
    ref: "concepts.md#layered-architecture"

  - id: arch-fundamentals-and-styles-011
    difficulty: intermediate
    tags: [modular-monolith, boundaries, simplicity]
    question: |
      Why might a team choose a Modular Monolith over microservices for a new product?
    options:
      - "It scales each module to zero automatically"
      - "It requires a service mesh and API gateway"
      - "It gives clear module boundaries in a single deployment unit without the distributed-systems tax"
      - "It mandates a separate database per module across processes"
    answer: 2
    explanation: |
      A Modular Monolith keeps strong internal boundaries (modules aligned to bounded contexts,
      own schemas, explicit in-process interfaces) inside one deployable, avoiding network latency,
      eventual consistency, and heavy ops — and it's a low-risk stepping stone to microservices.
    ref: "concepts.md#modular-monolith"

  - id: arch-fundamentals-and-styles-012
    difficulty: advanced
    tags: [pipeline, pipe-and-filter, modifiability]
    question: |
      In a Pipeline (pipe-and-filter) architecture, what property makes filters easy to reorder
      and reuse?
    options:
      - "Filters share global mutable state"
      - "All filters run inside one synchronized transaction"
      - "Filters communicate via a central mediator that orchestrates them"
      - "Each filter is self-contained and single-purpose, knowing nothing about the others"
    answer: 3
    explanation: |
      Filters are independent, single-purpose transformation components connected by unidirectional
      pipes; because they don't know about each other, you can freely reorder, insert, and reuse
      them — the source of the style's strong modifiability.
    ref: "concepts.md#pipeline-architecture"

  - id: arch-fundamentals-and-styles-013
    difficulty: intermediate
    tags: [microkernel, plug-in, extensibility]
    question: |
      An IDE with a stable core and independently added features exemplifies which architectural
      style?
    options:
      - "Microkernel (plug-in)"
      - "Space-Based"
      - "Primary-Replica"
      - "Publish-Subscribe"
    answer: 0
    explanation: |
      Microkernel architecture keeps a minimal, stable core plus a plug-in contract/registry;
      optional plug-ins add isolated capabilities and depend on the core (not each other). IDEs,
      browsers, and rules engines are classic examples.
    ref: "concepts.md#microkernel-architecture"

  - id: arch-fundamentals-and-styles-014
    difficulty: advanced
    tags: [layers-vs-tiers, client-server, physical-logical]
    question: |
      What is the crux distinction between "layers" and "tiers"?
    options:
      - "Layers are physical machines; tiers are logical code groupings"
      - "Layers are logical groupings (can share one process); tiers are physical deployment boundaries"
      - "They are identical; the terms are interchangeable"
      - "Tiers only exist in serverless systems"
    answer: 1
    explanation: |
      Layers are logical separations of concern that may all run in a single process; tiers are
      physical deployment boundaries across separate processes/hosts. A 3-layer app can deploy as
      one tier.
    ref: "concepts.md#client-server-and-tiered-architecture"

  - id: arch-fundamentals-and-styles-015
    difficulty: expert
    tags: [blackboard, ai, non-deterministic]
    question: |
      For which kind of problem is the Blackboard architecture most appropriate?
    options:
      - "High-volume CRUD with strong consistency"
      - "Simple request/response web APIs"
      - "Problems with no deterministic algorithm, solved incrementally by cooperating specialist knowledge sources (e.g. speech recognition)"
      - "Batch ETL with a fixed transformation order"
    answer: 2
    explanation: |
      Blackboard (POSA) fits ill-defined problems with no fixed solution path: independent
      knowledge sources opportunistically contribute to a shared blackboard, and a control
      component picks the next one. It's non-deterministic and hard to test — unsuited to plain
      CRUD.
    ref: "concepts.md#blackboard-architecture"

  - id: arch-fundamentals-and-styles-016
    difficulty: intermediate
    tags: [hexagonal, ports-adapters, testability]
    question: |
      In Hexagonal (Ports & Adapters) architecture, what does the application core depend on?
    options:
      - "Concrete database and framework classes"
      - "The UI layer directly"
      - "A central message broker"
      - "Only ports (technology-agnostic interfaces); concrete adapters implement them"
    answer: 3
    explanation: |
      The core exposes ports (interfaces) and depends only on them. Driving adapters call inbound
      ports; driven adapters (DB, broker, external APIs) implement outbound ports. This isolates
      business logic from I/O and makes the core testable with in-memory adapters.
    ref: "concepts.md#hexagonal-architecture"

  - id: arch-fundamentals-and-styles-017
    difficulty: advanced
    tags: [onion, dependency-inversion, domain]
    question: |
      What rule does the Onion architecture enforce about dependency direction?
    options:
      - "Dependencies point inward toward the domain model; inner rings never reference outer rings"
      - "Dependencies point outward toward infrastructure"
      - "Every layer may depend on every other layer"
      - "The domain depends directly on the database driver"
    answer: 0
    explanation: |
      Onion (Palermo) uses concentric rings where all dependencies point inward toward the domain
      model; infrastructure/UI sit on the outside and implement interfaces defined by the core,
      via dependency inversion.
    ref: "concepts.md#onion-architecture"

  - id: arch-fundamentals-and-styles-018
    difficulty: advanced
    tags: [clean, dependency-rule, domain-centric]
    question: |
      Robert C. Martin's Clean architecture is best summarized as:
    options:
      - "A brand-new idea unrelated to Hexagonal or Onion"
      - "The same 'dependencies point inward, infra swappable, core testable' idea as Hexagonal/Onion, generalized with Entities/Use Cases and the Dependency Rule"
      - "A rule that the UI must depend on the database"
      - "A style that eliminates all interfaces"
    answer: 1
    explanation: |
      Clean unifies Hexagonal and Onion: concentric circles (Entities -> Use Cases -> Interface
      Adapters -> Frameworks) governed by the Dependency Rule (source dependencies point only
      inward). It's the same family idea with different vocabulary.
    ref: "concepts.md#clean-architecture"

  - id: arch-fundamentals-and-styles-019
    difficulty: expert
    tags: [domain-centric, hexagonal, onion, clean]
    question: |
      An interviewer asks you to contrast Hexagonal, Onion, and Clean. What is the sharpest true
      answer?
    options:
      - "They optimize completely different -ilities and are unrelated"
      - "Hexagonal is for UIs, Onion for databases, Clean for networking"
      - "They express the same core principle (dependencies inward, infra as swappable detail, testable core) with different vocabulary; Clean generalizes the other two"
      - "Only Clean allows unit testing"
    answer: 2
    explanation: |
      All three isolate business logic from I/O and point dependencies toward the domain. They
      differ mainly in vocabulary/imagery (ports & adapters vs concentric rings vs Entities/Use
      Cases + Dependency Rule). Saying they're a family, not three unrelated things, shows depth.
    ref: "concepts.md#clean-architecture"

  - id: arch-fundamentals-and-styles-020
    difficulty: intermediate
    tags: [service-based, shared-database, middle-ground]
    question: |
      What most distinguishes Service-Based architecture from full microservices?
    options:
      - "Service-Based uses a service mesh; microservices don't"
      - "Service-Based cannot be deployed independently at all"
      - "Microservices always share one database"
      - "Service-Based has a few coarse-grained services that typically share a single database; microservices have many fine-grained services each owning their own database"
    answer: 3
    explanation: |
      Service-Based is the pragmatic middle ground: a handful of coarse, independently deployable
      domain services usually sharing one database, avoiding the hardest microservices problems
      (per-service data, sagas) while still splitting deployable units.
    ref: "concepts.md#service-based-architecture"

  - id: arch-fundamentals-and-styles-021
    difficulty: advanced
    tags: [soa, esb, microservices-contrast]
    question: |
      Which characteristic of classic SOA most directly motivated the microservices movement?
    options:
      - "Its reliance on a central Enterprise Service Bus (ESB) as a bottleneck/SPOF with heavy orchestration ('smart pipes')"
      - "Its use of REST over HTTP"
      - "Its database-per-service model"
      - "Its scale-to-zero functions"
    answer: 0
    explanation: |
      SOA centralizes routing, transformation, and orchestration in an ESB ("smart pipes, dumb
      endpoints"), creating a bottleneck and slowing change. Microservices reacted with "smart
      endpoints, dumb pipes," DB-per-service, and finer grain.
    ref: "concepts.md#service-oriented-architecture-soa"

  - id: arch-fundamentals-and-styles-022
    difficulty: intermediate
    tags: [microservices, database-per-service, deployability]
    question: |
      Why do microservices avoid sharing a database across services?
    options:
      - "Databases are too expensive to run"
      - "A shared schema re-couples services so changes ripple and independent deployability is lost — moving toward a Distributed Monolith"
      - "SQL is incompatible with microservices"
      - "It is required only for serverless"
    answer: 1
    explanation: |
      Independent deployability and data ownership are the point of microservices. A shared
      database couples services through the schema, so releases must be coordinated and one team's
      change breaks another's — the essence of a Distributed Monolith.
    ref: "concepts.md#microservices-architecture"

  - id: arch-fundamentals-and-styles-023
    difficulty: intermediate
    tags: [microservices, when-to-avoid, modular-monolith]
    question: |
      A three-person startup with an unproven, still-shifting domain asks which style to start
      with. Best advice?
    options:
      - "Full microservices with a service mesh from day one"
      - "A distributed monolith"
      - "A modular monolith, deferring distribution until boundaries and scale needs are proven"
      - "Space-Based architecture"
    answer: 2
    explanation: |
      Premature microservices with unclear boundaries and thin ops maturity usually produce a
      Distributed Monolith. A modular monolith gives clean boundaries cheaply and is a low-risk
      stepping stone to extract services later.
    ref: "concepts.md#microservices-architecture"

  - id: arch-fundamentals-and-styles-024
    difficulty: intermediate
    tags: [serverless, faas, cost, cold-start]
    question: |
      Which is a genuine trade-off of a serverless/FaaS architecture?
    options:
      - "It requires you to manage and patch servers"
      - "It cannot scale automatically"
      - "It guarantees the lowest cost at sustained high throughput"
      - "It offers scale-to-zero and pay-per-use, but suffers cold starts, execution limits, and vendor lock-in"
    answer: 3
    explanation: |
      FaaS removes server ops and scales to zero with pay-per-use, ideal for spiky/unpredictable
      load. But it introduces cold-start latency, time/memory limits, harder local testing, and
      lock-in; at steady high load an always-on service can be cheaper.
    ref: "concepts.md#serverless-architecture"

  - id: arch-fundamentals-and-styles-025
    difficulty: advanced
    tags: [space-based, in-memory-grid, scalability]
    question: |
      Space-Based architecture achieves extreme, elastic scalability primarily by:
    options:
      - "Serving requests from replicated in-memory processing units and persisting to the database asynchronously via data pumps"
      - "Adding more read replicas to the central database"
      - "Sharding the API gateway"
      - "Running each request in a separate serverless function"
    answer: 0
    explanation: |
      Space-Based removes the database from the request path: replicated processing units hold an
      in-memory data grid and serve requests at memory speed, scaling near-linearly, while data
      pumps asynchronously persist to a backing DB. The cost is eventual consistency and memory.
    ref: "concepts.md#space-based-architecture"

  - id: arch-fundamentals-and-styles-026
    difficulty: expert
    tags: [space-based, when-to-use, concurrency]
    question: |
      For which workload is Space-Based architecture the strongest fit?
    options:
      - "A low, steady-traffic internal admin tool needing strong immediate durability"
      - "A concert-ticketing/flash-sale system with extreme, highly variable concurrent load where the database is the bottleneck"
      - "A nightly batch report job"
      - "A simple static marketing site"
    answer: 1
    explanation: |
      Space-Based targets unpredictable, spiky, very high concurrency where the central DB can't
      keep up. Its eventual-consistency and memory costs aren't justified for low/steady load or
      strong-durability needs.
    ref: "concepts.md#space-based-architecture"

  - id: arch-fundamentals-and-styles-027
    difficulty: advanced
    tags: [cell-based, blast-radius, availability]
    question: |
      What is the primary goal of a Cell-Based architecture?
    options:
      - "To maximize single-request latency"
      - "To eliminate the need for any routing layer"
      - "To bound the blast radius by replicating the full stack into isolated cells, each serving a partition of users"
      - "To scale reads via database replicas"
    answer: 2
    explanation: |
      Cell-Based applies the bulkhead idea at system scale: independent cells each run the whole
      stack and serve a slice of users, so a failure/bad deploy/overload is contained to one cell.
      A thin, highly available router maps requests to cells.
    ref: "concepts.md#cell-based-architecture"

  - id: arch-fundamentals-and-styles-028
    difficulty: expert
    tags: [cell-based, sharding-contrast, isolation]
    question: |
      How does Cell-Based architecture differ from database sharding?
    options:
      - "They are identical concepts"
      - "Cells only work in a single process"
      - "Sharding is for isolation; cells are for scale"
      - "Sharding partitions data for scale; cells partition the whole stack (compute + data) for fault isolation / blast-radius control"
    answer: 3
    explanation: |
      Sharding splits data across nodes to scale throughput/storage. Cells replicate the entire
      stack into isolated units primarily to contain failures and enable cell-by-cell deploys —
      an availability/isolation goal, not just a scale goal.
    ref: "concepts.md#cell-based-architecture"

  - id: arch-fundamentals-and-styles-029
    difficulty: intermediate
    tags: [broker, location-transparency, posa]
    question: |
      In the Broker architecture (POSA), what does the broker provide to clients and servers?
    options:
      - "Location transparency: servers register, and the broker routes client requests to the right server without the client knowing its location"
      - "Guaranteed exactly-once processing with zero latency"
      - "A shared in-memory data grid"
      - "Automatic UI rendering"
    answer: 0
    explanation: |
      A broker mediates communication: servers register capabilities/locations, and the broker
      routes requests via proxies/stubs, hiding transport and location. This gives decoupling and
      location transparency, at the cost of added latency and a potential SPOF.
    ref: "concepts.md#broker-architecture"

  - id: arch-fundamentals-and-styles-030
    difficulty: advanced
    tags: [broker, api-gateway, esb, differences]
    question: |
      How does a Broker differ from an API gateway and an ESB?
    options:
      - "A broker does heavy orchestration/transformation like an ESB and is the single client edge like a gateway"
      - "A broker provides registry+routing/mediation between services; a gateway is a single client-facing edge; an ESB adds heavy orchestration/transformation"
      - "They are three names for the same component"
      - "A gateway is 1:N fan-out; a broker is client-only"
    answer: 1
    explanation: |
      A broker is a general mediator (registry + routing) between components. An API gateway is a
      single edge entry point for external clients. An ESB is heavier, adding orchestration and
      message transformation ("smart pipes").
    ref: "concepts.md#broker-architecture"

  - id: arch-fundamentals-and-styles-031
    difficulty: intermediate
    tags: [eda, topologies, decoupling]
    question: |
      In Event-Driven Architecture, what distinguishes the broker topology from the mediator
      topology?
    options:
      - "Broker topology requires a database; mediator topology does not"
      - "Mediator topology is synchronous only"
      - "Broker topology chains events with no central coordinator (max decoupling); mediator topology uses a central event mediator to orchestrate multi-step workflows (better error handling)"
      - "They are the same; the names are interchangeable"
    answer: 2
    explanation: |
      Broker topology flows events through lightweight brokers/topics with no coordinator, giving
      maximal decoupling. Mediator topology introduces a central mediator to orchestrate ordered,
      multi-step workflows and handle errors — at the cost of some coupling to the mediator.
    ref: "concepts.md#event-driven-architecture-eda"

  - id: arch-fundamentals-and-styles-032
    difficulty: intermediate
    tags: [eda, eventual-consistency, cons]
    question: |
      Which is a real downside of Event-Driven Architecture?
    options:
      - "It tightly couples producers to consumers"
      - "It cannot add new consumers"
      - "It forces synchronous blocking calls"
      - "Eventual consistency and difficulty debugging/tracing asynchronous flows"
    answer: 3
    explanation: |
      EDA maximizes decoupling and scalability, but asynchronous reaction means eventual
      consistency, no simple global transaction, and harder end-to-end tracing/debugging of event
      flows, plus ordering and duplicate handling.
    ref: "concepts.md#event-driven-architecture-eda"

  - id: arch-fundamentals-and-styles-033
    difficulty: expert
    tags: [saga, distributed-transactions, compensation]
    question: |
      A business transaction spans three services with no distributed 2PC. Which pattern
      coordinates it, and how does it handle failure?
    options:
      - "Saga; a sequence of local transactions with compensating actions that undo prior steps on failure"
      - "CQRS; by splitting read and write models"
      - "Event Sourcing; by locking all three databases"
      - "CDC; by rolling back the transaction log"
    answer: 0
    explanation: |
      A Saga models a distributed transaction as local transactions per service, coordinated by
      choreography or orchestration; on failure it runs compensating actions to semantically undo
      completed steps, avoiding global locks.
    ref: "concepts.md#cqrs-event-sourcing-saga-and-cdc"

  - id: arch-fundamentals-and-styles-034
    difficulty: advanced
    tags: [cqrs, event-sourcing, read-write]
    question: |
      What problem does CQRS specifically address?
    options:
      - "Servers needing to be patched"
      - "Read and write workloads having conflicting models/optimization needs, by separating command (write) and query (read) models"
      - "The need for a central ESB"
      - "Cold starts in serverless"
    answer: 1
    explanation: |
      CQRS (Command Query Responsibility Segregation) splits the write model from one or more read
      models so each can be optimized and scaled independently. It often pairs with Event Sourcing,
      which stores state as an append-only event log.
    ref: "concepts.md#cqrs-event-sourcing-saga-and-cdc"

  - id: arch-fundamentals-and-styles-035
    difficulty: beginner
    tags: [pub-sub, queue, fan-out]
    question: |
      What is the key difference between a publish-subscribe topic and a message queue?
    options:
      - "A topic delivers each message to exactly one consumer; a queue broadcasts to all"
      - "They are identical"
      - "A topic broadcasts each message to all current subscribers (1:N); a queue delivers each message to exactly one consumer (1:1)"
      - "Queues cannot persist messages"
    answer: 2
    explanation: |
      Pub-sub topics fan a message out to every subscriber (1-to-many). Queues use competing
      consumers so each message is processed by exactly one consumer (1-to-one) — good for work
      distribution.
    ref: "concepts.md#publish-subscribe-architecture"

  - id: arch-fundamentals-and-styles-036
    difficulty: intermediate
    tags: [primary-replica, replication, read-scaling]
    question: |
      In a Primary-Replica topology, how is read scalability achieved and what is the cost?
    options:
      - "All nodes accept writes; cost is no redundancy"
      - "Reads go to the primary only; cost is higher availability"
      - "Replicas take writes; cost is lower latency"
      - "The primary takes writes and replicates to read replicas; cost is replication lag / eventual consistency on replicas"
    answer: 3
    explanation: |
      The primary handles writes and replicates to replicas that serve reads, scaling read
      capacity and adding redundancy. Asynchronous replication introduces lag, so replicas may
      return slightly stale (eventually consistent) data.
    ref: "concepts.md#primary-replica-and-data-partitioning-topologies"

  - id: arch-fundamentals-and-styles-037
    difficulty: advanced
    tags: [peer-to-peer, decentralization, no-spof]
    question: |
      Which is an inherent challenge of a Peer-to-Peer architecture?
    options:
      - "Peer discovery, consistency, security/trust, and node churn are hard to manage"
      - "A single point of failure at the central server"
      - "Inability to scale horizontally"
      - "Requirement of a primary node for all writes"
    answer: 0
    explanation: |
      P2P removes the central server (no SPOF, massive scale), but every node being an equal
      client+server makes discovery, consistency, security, and churn (nodes joining/leaving)
      genuinely hard — managed via DHTs, gossip, or consensus/blockchain protocols.
    ref: "concepts.md#peer-to-peer-architecture"

  - id: arch-fundamentals-and-styles-038
    difficulty: intermediate
    tags: [mvc, presentation, altitude]
    question: |
      An interviewer says "we use MVC as our architecture." What is the most accurate correction?
    options:
      - "MVC is a database replication topology"
      - "MVC/MVP/MVVM are presentation-tier (component-level) patterns, not whole-system architectural styles; they live inside the presentation layer"
      - "MVC is the same as microservices"
      - "MVC is a deployment model like serverless"
    answer: 1
    explanation: |
      MVC/MVP/MVVM separate view from model/state within the presentation layer — they are
      component-level patterns, not system-altitude styles. Treating MVC as the system architecture
      is an altitude error; it lives inside a layered system's presentation layer.
    ref: "concepts.md#mvc-mvp-and-mvvm"

  - id: arch-fundamentals-and-styles-039
    difficulty: advanced
    tags: [micro-frontends, deployability, teams]
    question: |
      What problem do micro-frontends solve?
    options:
      - "Scaling the database write path"
      - "Cold starts in serverless functions"
      - "A monolithic SPA forcing all UI teams to coordinate, by letting each team independently build/deploy its own UI fragment"
      - "Distributed transaction coordination"
    answer: 2
    explanation: |
      Micro-frontends extend microservice-style independent deployment to the UI: a shell composes
      independently built and deployed fragments (one per capability/team). The cost is bundle
      duplication and consistency/perf overhead.
    ref: "concepts.md#micro-frontends"

  - id: arch-fundamentals-and-styles-040
    difficulty: advanced
    tags: [reactive, manifesto, message-driven]
    question: |
      According to the Reactive Manifesto, which property is the foundation that enables
      responsiveness, resilience, and elasticity?
    options:
      - "Strong consistency"
      - "Synchronous blocking I/O"
      - "A shared global lock"
      - "Message-driven (asynchronous, non-blocking message passing)"
    answer: 3
    explanation: |
      The manifesto's four properties are Responsive, Resilient, Elastic, and Message-Driven —
      and message-driven asynchronous, non-blocking communication (with back-pressure) is the
      foundation that makes the other three achievable.
    ref: "concepts.md#reactive-architecture"

  - id: arch-fundamentals-and-styles-041
    difficulty: expert
    tags: [streaming, lambda-kappa, data-mesh]
    question: |
      How does Kappa differ from Lambda architecture in streaming data systems?
    options:
      - "Lambda maintains separate batch and speed layers merged at query; Kappa uses a single stream-processing path and reprocesses by replaying the log"
      - "Kappa runs only batch; Lambda runs only streaming"
      - "They are identical"
      - "Kappa requires a central data warehouse; Lambda forbids one"
    answer: 0
    explanation: |
      Lambda runs a batch layer (accurate, slow) plus a speed layer (fast, approximate) merged at
      query time. Kappa simplifies to a single stream-processing pipeline, handling corrections by
      replaying the durable log — no separate batch layer.
    ref: "concepts.md#streaming-data-and-data-mesh"

  - id: arch-fundamentals-and-styles-042
    difficulty: advanced
    tags: [data-mesh, decentralization, governance]
    question: |
      What is the core idea of Data Mesh?
    options:
      - "Centralize all analytics data in one team-owned warehouse"
      - "Decentralize analytics so domain teams own their data as products, under federated computational governance and a self-serve platform"
      - "Replace all databases with in-memory grids"
      - "Eliminate data governance entirely"
    answer: 1
    explanation: |
      Data Mesh (Dehghani) treats data as a product owned by domain teams (discoverable,
      self-serve, with contracts), under federated computational governance and a self-serve data
      platform — removing the central data team as a bottleneck.
    ref: "concepts.md#streaming-data-and-data-mesh"

  - id: arch-fundamentals-and-styles-043
    difficulty: advanced
    tags: [distributed-monolith, anti-pattern, coupling]
    question: |
      Which symptoms indicate a Distributed Monolith anti-pattern?
    options:
      - "Independent deploys, DB-per-service, async messaging"
      - "A single process with clean modules"
      - "Separate services that share a database, call each other synchronously in chatty chains, and must be deployed in lockstep"
      - "Scale-to-zero functions triggered by events"
    answer: 2
    explanation: |
      A Distributed Monolith has microservices' topology but not their independence: shared
      database, synchronous chatty coupling, and lockstep deploys — so you pay the distributed tax
      and still can't release services independently. The worst of both worlds.
    ref: "concepts.md#distributed-monolith"

  - id: arch-fundamentals-and-styles-044
    difficulty: expert
    tags: [distributed-monolith, remedy, ddd]
    question: |
      A team's "microservices" can't be released independently because they share tables and call
      each other synchronously. What is the best remedy?
    options:
      - "Add more instances of each service"
      - "Introduce a central ESB to orchestrate them"
      - "Move everything to serverless functions unchanged"
      - "Fix boundaries with DDD, give each service its own data, prefer async communication — or step back to a modular monolith"
    answer: 3
    explanation: |
      The root cause is wrong boundaries and shared data. Re-derive boundaries from bounded
      contexts, give each service its own datastore, and prefer asynchronous coupling. If the
      domain isn't ready, consolidating into a modular monolith is legitimate.
    ref: "concepts.md#distributed-monolith"

  - id: arch-fundamentals-and-styles-045
    difficulty: intermediate
    tags: [choosing, decision, characteristics]
    question: |
      What is the correct first step when choosing an architectural style from requirements?
    options:
      - "Extract the domain and rank the top architecture characteristics (-ilities) that must dominate"
      - "Pick the most modern style and justify it later"
      - "Choose a database vendor"
      - "Draw the deployment diagram"
    answer: 0
    explanation: |
      Style selection starts by ranking the dominant characteristics, then choosing communication
      style and data topology, mapping to candidate styles, evaluating against constraints
      (Conway, budget, time), and recording the decision in an ADR with fitness functions to
      enforce it.
    ref: "concepts.md#choosing-an-architectural-style"

  - id: arch-fundamentals-and-styles-046
    difficulty: advanced
    tags: [scenario, layered, when-to-use]
    question: |
      A small team is building a straightforward CRUD internal tool on a tight budget. Which style
      is the most pragmatic choice?
    options:
      - "Microservices with a service mesh"
      - "Layered or Modular Monolith"
      - "Space-Based architecture"
      - "Cell-Based architecture"
    answer: 1
    explanation: |
      For small, budget-constrained CRUD apps, a layered/modular monolith maximizes simplicity and
      testability at low cost. Microservices, Space-Based, and Cell-Based add distributed
      complexity unjustified by the requirements.
    ref: "concepts.md#layered-architecture"

  - id: arch-fundamentals-and-styles-047
    difficulty: expert
    tags: [scenario, ility-mapping, deployability]
    question: |
      A large org wants each of 20 teams to release its slice of a system independently, on
      different schedules and stacks. Which -ility dominates, and which style best serves it?
    options:
      - "Simplicity; a single-process monolith"
      - "Strong consistency; a shared-database service-based system"
      - "Deployability + team autonomy; microservices (with per-service data)"
      - "Performance; a pipe-and-filter pipeline"
    answer: 2
    explanation: |
      Independent, differently-scheduled releases across many teams is fundamentally a
      deployability + autonomy requirement, which microservices (independent quanta, DB-per-service)
      optimize — assuming the org and ops maturity (Conway) support it.
    ref: "concepts.md#microservices-architecture"

  - id: arch-fundamentals-and-styles-048
    difficulty: intermediate
    tags: [scenario, pipeline, etl]
    question: |
      You need to ingest raw event files, parse, validate, enrich, and load them into a warehouse,
      reusing steps across several feeds. Which style fits best?
    options:
      - "Space-Based architecture"
      - "Microkernel"
      - "Primary-Replica"
      - "Pipeline (pipe-and-filter)"
    answer: 3
    explanation: |
      Sequential, composable, reusable transformation stages over a data stream are exactly what
      pipe-and-filter is for. Each filter (parse/validate/enrich/load) is independent and reusable
      across feeds.
    ref: "concepts.md#pipeline-architecture"

  - id: arch-fundamentals-and-styles-049
    difficulty: advanced
    tags: [scenario, hexagonal, testability]
    question: |
      A team wants to unit-test rich domain logic without a database or web server, and be able to
      swap the persistence technology later. Which style most directly delivers this?
    options:
      - "Hexagonal (Ports & Adapters) — or equivalently Onion/Clean"
      - "Client-Server / Tiered"
      - "Publish-Subscribe"
      - "Space-Based"
    answer: 0
    explanation: |
      Hexagonal/Onion/Clean isolate the domain behind ports/interfaces so the core is tested with
      in-memory adapters and infrastructure (DB, web) is a swappable detail. This optimizes
      testability and modifiability.
    ref: "concepts.md#hexagonal-architecture"

  - id: arch-fundamentals-and-styles-050
    difficulty: expert
    tags: [scenario, cell-based, availability]
    question: |
      A multi-tenant SaaS repeatedly suffers total outages when one bad deploy or a poison request
      affects all tenants at once. Which style most directly addresses this?
    options:
      - "Layered architecture"
      - "Cell-Based architecture (blast-radius isolation)"
      - "Serverless FaaS"
      - "Pipeline architecture"
    answer: 1
    explanation: |
      The problem is correlated, all-tenant failure. Cell-Based replicates the full stack into
      isolated cells serving user partitions, so a bad deploy/overload/poison request is contained
      to one cell — optimizing availability and fault isolation with cell-by-cell deploys.
    ref: "concepts.md#cell-based-architecture"

  - id: arch-fundamentals-and-styles-051
    difficulty: intermediate
    tags: [ility, deployability, definition]
    question: |
      Which -ility does the microservices style most improve relative to a monolith, at the cost
      of distributed complexity?
    options:
      - "Simplicity"
      - "Strong immediate consistency"
      - "Independent deployability (and per-service scalability)"
      - "Lowest possible operational cost"
    answer: 2
    explanation: |
      Microservices primarily optimize independent deployability, team autonomy, and per-service
      scalability. The trade-off is reduced simplicity/consistency and higher operational and
      network complexity.
    ref: "concepts.md#microservices-architecture"

  - id: arch-fundamentals-and-styles-052
    difficulty: beginner
    tags: [serverless, event-driven, differences]
    question: |
      How does serverless/FaaS relate to Event-Driven Architecture?
    options:
      - "They are the same thing"
      - "EDA requires servers; serverless forbids events"
      - "Serverless cannot be triggered by events"
      - "Serverless is a compute/deployment model often used within an event-driven system; EDA is about components reacting to events"
    answer: 3
    explanation: |
      Serverless is a compute/deployment model (stateless, event-triggered functions, scale to
      zero). EDA is a system-interaction style where components react to events. Serverless is
      frequently used to implement handlers within an event-driven system.
    ref: "concepts.md#serverless-architecture"

  - id: arch-fundamentals-and-styles-053
    difficulty: advanced
    tags: [cdc, integration, data-propagation]
    question: |
      What does Change Data Capture (CDC) accomplish architecturally?
    options:
      - "It captures committed database changes (e.g. from the transaction log) and streams them to other systems reliably"
      - "It splits read and write models"
      - "It compensates failed distributed transactions"
      - "It replicates the UI across cells"
    answer: 0
    explanation: |
      CDC reads committed changes from a database (often its transaction log) and emits them as a
      stream, letting other systems react to data changes without dual-writes — a reliable way to
      propagate state across services.
    ref: "concepts.md#cqrs-event-sourcing-saga-and-cdc"

  - id: arch-fundamentals-and-styles-054
    difficulty: intermediate
    tags: [fitness-functions, erosion, layered]
    question: |
      Over two years, developers keep importing the persistence layer directly into the UI layer
      of a layered app. What mechanism best prevents this erosion automatically?
    options:
      - "A quarterly manual architecture review"
      - "An architectural fitness function in CI that fails the build on illegal layer dependencies"
      - "Adding more documentation to the wiki"
      - "Switching to serverless"
    answer: 1
    explanation: |
      Fitness functions (e.g. ArchUnit dependency-direction tests) run in the pipeline and block
      merges that violate layering rules, keeping the architecture intact as it evolves — far more
      reliable than memory or periodic reviews.
    ref: "concepts.md#architectural-fitness-functions"

  - id: arch-fundamentals-and-styles-055
    difficulty: expert
    tags: [scenario, event-driven, decoupling]
    question: |
      An order service must trigger inventory, notifications, and analytics without knowing who
      consumes the event, and consumers may be added later. Which style fits best?
    options:
      - "Synchronous Layered calls"
      - "Primary-Replica"
      - "Event-Driven Architecture (publish an OrderPlaced event to a broker/topic)"
      - "Microkernel"
    answer: 2
    explanation: |
      Publishing an immutable OrderPlaced event to a broker/topic lets any number of current or
      future consumers react independently, with no coupling from the producer — the core value of
      EDA (decoupling, extensibility, scalability), at the cost of eventual consistency.
    ref: "concepts.md#event-driven-architecture-eda"
