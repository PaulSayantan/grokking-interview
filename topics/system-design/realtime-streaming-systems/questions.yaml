topic: 'Real-Time and Streaming Systems: Analytics, Leaderboards and Live Data'
domain: system-design
topic_slug: realtime-streaming-systems
version: 1
questions:
- id: realtime-streaming-systems-001
  difficulty: beginner
  tags:
  - fundamentals
  - batch-vs-stream
  question: |
    What is the defining difference between batch processing and stream processing?
  options:
  - Stream processing runs a standing query over an unbounded, never-ending sequence of events, while
    batch runs a function over a bounded dataset and terminates
  - Batch processing is always faster than stream processing
  - Stream processing cannot maintain any state, while batch can
  - Batch processing works only on numeric data, while streaming works on text
  answer: 0
  explanation: |
    Streaming applies a continuous query to an unbounded input and emits
    continuously updated results; batch operates on a finite input and finishes.
    Batch is not inherently faster (it usually has higher end-to-end latency),
    streaming engines maintain rich state, and both handle any data type.
  ref: concepts.md#stream-processing-fundamentals-and-the-streaming-dataflow-model
- id: realtime-streaming-systems-002
  difficulty: beginner
  tags:
  - governing-tradeoff
  - mental-model
  question: |
    What is the single governing trade-off that shapes almost every real-time
    streaming design decision?
  options:
  - SQL versus NoSQL
  - Latency versus completeness (correctness) versus cost
  - Monolith versus microservices
  - TCP versus UDP
  answer: 1
  explanation: |
    Streaming systems must emit answers before all data has arrived, so every
    choice trades freshness (latency) against how much late/out-of-order data you
    capture (completeness) against compute/memory/ops (cost). The other pairs are
    general architecture concerns, not the streaming triangle.
  ref: concepts.md#latency-versus-completeness-versus-cost-the-governing-trade-off
- id: realtime-streaming-systems-003
  difficulty: beginner
  tags:
  - event-time
  - processing-time
  question: |
    An event is timestamped 10:00:00 on a phone, uploads at 10:03:00, and is
    handled by a stream operator at 10:03:01. Which is the "event time"?
  options:
  - 10:03:01, when the operator processed it
  - 10:03:00, when it arrived at the system
  - 10:00:00, when it actually happened on the device
  - The average of all three timestamps
  answer: 2
  explanation: |
    Event time is the timestamp of when the event actually occurred, embedded in
    the event. 10:03:00 is ingestion time and 10:03:01 is processing time. Using
    event time gives correct, deterministic windowing regardless of arrival delay.
  ref: concepts.md#event-time-versus-processing-time-and-the-three-clocks
- id: realtime-streaming-systems-004
  difficulty: beginner
  tags:
  - windowing
  - tumbling
  question: |
    Which window type is fixed-size, non-overlapping, and assigns each event to
    exactly one window?
  options:
  - Sliding window
  - Session window
  - Global window
  - Tumbling window
  answer: 3
  explanation: |
    Tumbling windows are contiguous, fixed-size, non-overlapping buckets, so every
    event lands in exactly one. Sliding windows overlap (an event is in several),
    session windows have data-driven boundaries, and a global window covers all time.
  ref: concepts.md#windowing-tumbling-sliding-session-and-global-windows
- id: realtime-streaming-systems-005
  difficulty: beginner
  tags:
  - leaderboards
  - redis
  question: |
    Which Redis data structure is the standard primitive for a live leaderboard
    with fast top-N and rank queries?
  options:
  - A sorted set (ZSET)
  - A plain string with the score
  - A list (LPUSH/RPUSH)
  - A hash (HSET)
  answer: 0
  explanation: |
    A sorted set keeps members ordered by score via a skip list plus hash map,
    giving O(log N) inserts, rank, and top-N range queries. Strings, lists, and
    hashes have no ordering by score, so ranking would be O(N) or impossible.
  ref: concepts.md#leaderboards-with-redis-sorted-sets
- id: realtime-streaming-systems-006
  difficulty: beginner
  tags:
  - delivery-semantics
  question: |
    In streaming, what does "exactly-once" most accurately mean?
  options:
  - Each event physically crosses the network exactly one time
  - The pipeline never fails
  - Exactly-once effect on state/output, even across failures and retries — achieved via idempotency and
    atomic commits
  - Every event is delivered within exactly one millisecond
  answer: 2
  explanation: |
    Exactly-once refers to the effect on state/output being as if each event were
    processed once, achieved through checkpointing, transactions, and/or idempotent
    writes — not literal single network transmission, guaranteed uptime, or a
    latency bound.
  ref: concepts.md#exactly-once-at-least-once-and-at-most-once-semantics-in-streaming
- id: realtime-streaming-systems-007
  difficulty: beginner
  tags:
  - olap
  - real-time-analytics
  question: |
    What gap do real-time OLAP stores like Apache Pinot and Druid fill?
  options:
  - They replace transactional row-store databases for point writes
  - They act as message brokers replacing Kafka
  - They store binary blobs like images and video
  - Sub-second aggregation queries over seconds-old data at high concurrency, between OLTP DBs and batch
    warehouses
  answer: 3
  explanation: |
    Real-time OLAP stores serve low-latency aggregations over freshly ingested data
    at high QPS — the gap between OLTP (point ops) and batch warehouses (slow,
    batch-ingested). They are not row stores, blob stores, or brokers.
  ref: concepts.md#real-time-olap-druid-pinot-and-clickhouse-versus-batch-warehouses
- id: realtime-streaming-systems-008
  difficulty: beginner
  tags:
  - lambda
  - kappa
  question: |
    What fundamentally distinguishes Kappa architecture from Lambda architecture?
  options:
  - Kappa uses two separate pipelines (batch and speed); Lambda uses one
  - Kappa runs a single streaming pipeline and reprocesses by replaying the log; Lambda maintains separate
    batch and speed layers
  - Lambda cannot handle real-time data at all
  - Kappa only works with SQL databases
  answer: 1
  explanation: |
    Kappa uses one streaming codebase and recomputes history by replaying the
    immutable log; Lambda runs a batch layer and a speed layer merged at serving
    time. The first option reverses the definitions.
  ref: concepts.md#lambda-architecture-versus-kappa-architecture
- id: realtime-streaming-systems-009
  difficulty: beginner
  tags:
  - watermarks
  question: |
    What does a watermark assert in an event-time stream processor?
  options:
  - That the network is congested
  - That the system has now seen all events with event time less than or equal to some time T
  - The exact number of events remaining in the stream
  - That processing time equals event time
  answer: 1
  explanation: |
    A watermark is the framework's claim that all events up to event time T have
    likely been seen, letting windows up to T fire. It is a heuristic about
    out-of-orderness, not a congestion signal, a remaining-count, or a clock equality.
  ref: concepts.md#watermarks-and-handling-late-out-of-order-data
- id: realtime-streaming-systems-010
  difficulty: beginner
  tags:
  - hot-path
  - cold-path
  question: |
    In a hot-path/cold-path design, what does the hot path optimize for?
  options:
  - Low latency and approximate answers for the last seconds/minutes
  - Exact historical truth over many months
  - Cheapest possible long-term storage
  - Complex ad-hoc joins across many tables
  answer: 0
  explanation: |
    The hot path serves live, low-latency, approximate views of very recent data;
    the cold path handles exact historical truth, cheap retention, and heavy
    queries. The other options describe the cold path or a warehouse.
  ref: concepts.md#hot-path-and-cold-path-the-speed-and-accuracy-split
- id: realtime-streaming-systems-011
  difficulty: beginner
  tags:
  - live-comments
  - fan-out
  question: |
    For a livestream with millions of viewers reacting, why do systems broadcast
    aggregated reaction counts rather than every individual reaction?
  options:
  - Because reactions are not important data
  - Because Redis cannot store reactions
  - Because delivering every reaction to every viewer is O(N^2) fan-out and infeasible at scale; aggregation
    reduces it to O(N)
  - Because aggregation makes the data more accurate
  answer: 2
  explanation: |
    Delivering each of N viewers' reactions to all N viewers is O(N^2), impossible
    past ~100k concurrent. Counting per short window and broadcasting an aggregate
    is O(N). It is about fan-out scale, not importance, storage, or accuracy.
  ref: concepts.md#live-comments-reactions-and-high-fan-out-broadcast-systems
- id: realtime-streaming-systems-012
  difficulty: beginner
  tags:
  - dashboards
  - delivery
  question: |
    Which protocol is a natural fit for pushing one-way, server-to-client dashboard
    updates with built-in reconnect?
  options:
  - FTP
  - Short polling only
  - SMTP
  - Server-Sent Events (SSE)
  answer: 3
  explanation: |
    SSE is a one-way server→client push stream over HTTP with automatic reconnect,
    ideal for dashboard updates and cheaper than WebSockets. FTP/SMTP are unrelated
    protocols, and polling is the higher-overhead alternative SSE improves on.
  ref: concepts.md#real-time-dashboards-and-live-analytics-serving
- id: realtime-streaming-systems-013
  difficulty: beginner
  tags:
  - redis
  - complexity
  question: |
    What is the time complexity of ZADD (insert/update a member's score) and
    ZREVRANK (get a member's rank) in a Redis sorted set?
  options:
  - O(N) for both
  - O(1) for both
  - O(N log N) for both
  - O(log N) for both
  answer: 3
  explanation: |
    Both are O(log N) because the skip list maintains ordering and span counts,
    making inserts and rank lookups logarithmic. This logarithmic cost is exactly
    why Redis sorted sets are the leaderboard primitive.
  ref: concepts.md#leaderboards-with-redis-sorted-sets
- id: realtime-streaming-systems-014
  difficulty: beginner
  tags:
  - kafka-streams
  - flink
  question: |
    What is a key operational difference between Kafka Streams and Apache Flink?
  options:
  - Kafka Streams is a library embedded in your application; Flink is a distributed cluster you operate
  - Flink cannot do stateful processing
  - Kafka Streams requires a separate cluster while Flink is a library
  - They are the same product with different names
  answer: 0
  explanation: |
    Kafka Streams is a JAR embedded in and scaled with your service; Flink is a
    standalone distributed system with its own cluster. Flink is highly stateful,
    and the third option reverses the two.
  ref: concepts.md#stream-processing-fundamentals-and-the-streaming-dataflow-model
- id: realtime-streaming-systems-015
  difficulty: intermediate
  tags:
  - processing-time
  - correctness
  question: |
    A team buckets analytics by processing time. Under a consumer backlog
    (lag), what happens to the correctness of their per-minute counts?
  options:
  - Events get silently attributed to the wrong minute because the machine clock advanced past their true
    event time, corrupting buckets
  - Nothing — processing-time windows are always correct
  - The pipeline throws an error and stops
  - Late events are automatically re-bucketed to their event time
  answer: 0
  explanation: |
    Processing-time windows use wall-clock arrival, so when the consumer lags,
    events land in whatever minute they happen to be processed, not when they
    occurred — silently corrupting counts. It does not error out or self-correct;
    only event-time windows re-bucket by true time.
  ref: concepts.md#event-time-versus-processing-time-and-the-three-clocks
- id: realtime-streaming-systems-016
  difficulty: intermediate
  tags:
  - windowing
  - sliding
  - capacity
  question: |
    A 10-minute sliding window with a 10-second slide is applied over 1M keys. Why
    is this a memory/compute concern compared to a 10-minute tumbling window?
  options:
  - Sliding windows store nothing, so there is no concern
  - Sliding windows require a separate database
  - Each event belongs to ~60 overlapping windows, so up to ~60M active aggregate slots must be maintained
    versus 1M for tumbling
  - Tumbling windows are the ones that overlap and multiply state
  answer: 2
  explanation: |
    With size/slide = 600/10 = 60, each event participates in ~60 overlapping
    windows, multiplying state and compute (~60M slots for 1M keys). Tumbling
    windows do not overlap, so state stays ~1M. The overlap is the cost driver.
  ref: concepts.md#windowing-tumbling-sliding-session-and-global-windows
- id: realtime-streaming-systems-017
  difficulty: intermediate
  tags:
  - session-windows
  question: |
    You want to group each user's activity into "sessions" that end after 30
    minutes of inactivity. Which window type fits, and what makes it costly?
  options:
  - Tumbling window; costly because it drops late data
  - Global window; costly because it never emits
  - Sliding window; costly because of fixed overlap
  - Session window; costly because boundaries are data-driven and late events can force window merges
    and variable state
  answer: 3
  explanation: |
    Session windows are defined by a gap of inactivity, so their boundaries depend
    on the data and a late event bridging two sessions requires merging windows —
    the source of variable state and complexity. Tumbling/sliding have fixed
    boundaries and don't model inactivity gaps.
  ref: concepts.md#windowing-tumbling-sliding-session-and-global-windows
- id: realtime-streaming-systems-018
  difficulty: intermediate
  tags:
  - watermarks
  - late-data
  question: |
    Which set of options does Flink/Beam give you for handling an event that
    arrives after its window's watermark has passed (late data)?
  options:
  - Drop it, keep the window open with allowed lateness and re-emit an updated result, or side-output
    it to a repair stream
  - Only crash the job
  - Automatically rewind the entire pipeline to reprocess
  - Convert it to processing time silently
  answer: 0
  explanation: |
    The standard choices are drop (approximate), allowed-lateness with retraction/
    update re-emission (more complete), or side-output to a dead-letter/reconcile
    stream. Crashing, full rewinds, and silent time conversion are not the mechanisms.
  ref: concepts.md#watermarks-and-handling-late-out-of-order-data
- id: realtime-streaming-systems-019
  difficulty: intermediate
  tags:
  - watermarks
  - tradeoff
  question: |
    What is the direct consequence of configuring a very LARGE watermark delay
    (bounded out-of-orderness) in an event-time job?
  options:
  - Lower latency and less memory usage
  - Fewer duplicates delivered downstream
  - Higher completeness (catches more stragglers) but higher latency and more state held in memory
  - The window never fires at all
  answer: 2
  explanation: |
    A large watermark delay waits longer, so it captures more late events
    (completeness) but emits windows later and holds their state longer (latency +
    memory). It doesn't reduce latency/memory, isn't about duplicates, and the
    window still fires — just later.
  ref: concepts.md#watermarks-and-handling-late-out-of-order-data
- id: realtime-streaming-systems-020
  difficulty: intermediate
  tags:
  - exactly-once
  - flink
  - checkpointing
  question: |
    Flink achieves exactly-once state within a pipeline primarily through which
    mechanism?
  options:
  - By processing every event twice and comparing results
  - By storing every event forever in RAM
  - By disabling all retries
  - 'Distributed snapshots (Chandy-Lamport): checkpoint barriers flow through the DAG so all operators
    snapshot state at the same logical point, and on failure the job rewinds to the last complete snapshot'
  answer: 3
  explanation: |
    Flink injects checkpoint barriers that trigger a consistent distributed
    snapshot; on failure the whole job restores that snapshot and rewinds Kafka
    offsets, so state is exactly-once. Double processing, disabling retries, or
    infinite RAM are not the mechanism.
  ref: concepts.md#exactly-once-at-least-once-and-at-most-once-semantics-in-streaming
- id: realtime-streaming-systems-021
  difficulty: intermediate
  tags:
  - exactly-once
  - idempotency
  question: |
    Your stream delivers at-least-once and your sink is Apache Pinot with upsert
    keyed by a per-record UUID. What is the net effect on correctness?
  options:
  - 'Exactly-once effect on state: duplicate deliveries upsert to the same key and are absorbed, so the
    result is as if processed once'
  - Duplicates corrupt the counts because at-least-once always double-counts
  - The sink must switch to at-most-once to be correct
  - You must add two-phase commit or correctness is impossible
  answer: 0
  explanation: |
    An idempotent/upsert sink keyed by a unique id absorbs duplicate deliveries,
    converting at-least-once delivery into exactly-once effect without 2PC. This is
    exactly the pattern Uber uses with Pinot upsert; 2PC is only needed when the
    sink cannot be made idempotent.
  ref: concepts.md#exactly-once-at-least-once-and-at-most-once-semantics-in-streaming
- id: realtime-streaming-systems-022
  difficulty: intermediate
  tags:
  - olap
  - pinot
  - clickhouse
  question: |
    For a public per-account analytics page that must serve tens of thousands of
    concurrent user queries at sub-second latency with real-time upserts, which
    store is the best default?
  options:
  - A general SQL warehouse like Snowflake
  - A single PostgreSQL instance with ORDER BY
  - Apache Pinot
  - A Redis list
  answer: 2
  explanation: |
    Pinot is purpose-built for high-concurrency, low-latency, user-facing analytics
    with native upsert support. Warehouses are batch and low-concurrency, a single
    Postgres collapses under high-QPS aggregations, and a Redis list has no
    analytical query engine.
  ref: concepts.md#real-time-olap-druid-pinot-and-clickhouse-versus-batch-warehouses
- id: realtime-streaming-systems-023
  difficulty: intermediate
  tags:
  - olap
  - warehouse
  - tradeoff
  question: |
    What do you primarily give up by serving a dashboard from a pre-aggregated
    real-time OLAP store instead of an ad-hoc data warehouse?
  options:
  - Query freshness
  - Flexibility for complex ad-hoc joins and arbitrary drill-downs, plus easy correction of already-ingested
    (often immutable) segments
  - High query concurrency
  - Sub-second latency
  answer: 1
  explanation: |
    Real-time OLAP wins on freshness, concurrency, and latency but sacrifices the
    flexibility (complex joins, arbitrary dimensions) and easy mutation/correction
    that a warehouse offers. The other three are strengths of OLAP, not what you lose.
  ref: concepts.md#real-time-olap-druid-pinot-and-clickhouse-versus-batch-warehouses
- id: realtime-streaming-systems-024
  difficulty: intermediate
  tags:
  - lambda
  - kappa
  - tradeoff
  question: |
    What is the most-cited drawback of the Lambda architecture that Kappa was
    designed to eliminate?
  options:
  - Lambda cannot store historical data
  - Lambda requires no storage at all
  - Lambda has no real-time layer
  - Maintaining two codebases (batch and speed) that implement the same logic in different engines, causing
    drift and bugs
  answer: 3
  explanation: |
    Lambda's batch and speed layers reimplement the same logic in two engines,
    which drift apart and are a notorious bug source; Kappa collapses to one
    streaming codebase. Lambda does store history and does have a speed layer, so
    those options are false.
  ref: concepts.md#lambda-architecture-versus-kappa-architecture
- id: realtime-streaming-systems-025
  difficulty: intermediate
  tags:
  - kappa
  - replay
  - retention
  question: |
    What is the key infrastructure prerequisite that makes a Kappa architecture
    viable for recomputing historical results?
  options:
  - A second batch cluster
  - A replayable immutable log (e.g., Kafka with long/tiered retention) plus a stream engine strong enough
    to be the source of truth
  - A relational database with foreign keys
  - Turning off exactly-once semantics
  answer: 1
  explanation: |
    Kappa recomputes by replaying the log, so it needs durable, replayable
    retention (long/tiered Kafka) and an exactly-once, event-time-capable engine.
    A batch cluster is what Kappa avoids; relational constraints and disabling
    exactly-once are irrelevant or harmful.
  ref: concepts.md#lambda-architecture-versus-kappa-architecture
- id: realtime-streaming-systems-026
  difficulty: intermediate
  tags:
  - leaderboards
  - sharding
  question: |
    You shard a leaderboard by hashing players across N Redis sorted sets. What
    operation breaks, and why?
  options:
  - Global ZREVRANK (a player's overall rank), because rank now requires querying and merging across all
    shards instead of a single O(log N) lookup
  - ZADD, because writes cannot be sharded
  - Per-shard top-N, because ranges cannot be computed within a shard
  - Nothing breaks; sharding a ZSET is fully transparent
  answer: 0
  explanation: |
    Sharding partitions the ordering, so a global rank needs a scatter-gather and
    merge across shards rather than one logarithmic lookup. Writes still shard fine,
    per-shard top-N still works locally, so it is not transparent for global rank.
  ref: concepts.md#leaderboards-with-redis-sorted-sets
- id: realtime-streaming-systems-027
  difficulty: intermediate
  tags:
  - leaderboards
  - time-windows
  question: |
    To implement daily and weekly leaderboards while bounding memory and spreading
    write load, what is the standard approach?
  options:
  - Keep every score forever in one giant sorted set
  - Store scores in a relational table and sort at query time
  - Use a separate sorted set keyed per time window (e.g., board:2026-07-16) with a TTL
  - Randomly drop scores when memory is full
  answer: 2
  explanation: |
    Time-windowed keys with TTL naturally partition load by period and auto-expire
    old data, bounding memory. One giant set grows unbounded, SQL sort-at-query is
    O(N) under load, and random dropping loses valid scores.
  ref: concepts.md#leaderboards-with-redis-sorted-sets
- id: realtime-streaming-systems-028
  difficulty: intermediate
  tags:
  - dashboards
  - pre-aggregation
  question: |
    What is the primary trade-off of pre-aggregating metrics on the write path
    versus doing query-time aggregation for a dashboard?
  options:
  - Pre-aggregation is slower to serve but more flexible
  - Pre-aggregation is fast and cheap to serve but rigid — you can only show metrics you decided to compute,
    and adding a dimension means reprocessing
  - Query-time aggregation uses no compute at read time
  - There is no difference in flexibility
  answer: 1
  explanation: |
    Pre-aggregation makes serving a cheap lookup but locks you into the metrics/
    dimensions you precomputed; query-time aggregation is flexible but costs more
    compute per view. The first and third options invert these facts.
  ref: concepts.md#real-time-dashboards-and-live-analytics-serving
- id: realtime-streaming-systems-029
  difficulty: intermediate
  tags:
  - live-comments
  - protocols
  question: |
    In a live chat where clients both send messages and receive a high-rate feed,
    which transport is the best fit for the client→server input direction?
  options:
  - Server-Sent Events (SSE), which is server-to-client only
  - SMTP email
  - A nightly batch upload
  - WebSocket, which is bidirectional and low-latency
  answer: 3
  explanation: |
    Chat input requires client→server messages, and WebSocket is the bidirectional,
    low-latency choice. SSE is one-way server→client (fine for count broadcast but
    not input), and batch/SMTP are far too slow.
  ref: concepts.md#live-comments-reactions-and-high-fan-out-broadcast-systems
- id: realtime-streaming-systems-030
  difficulty: intermediate
  tags:
  - governing-tradeoff
  - scenario
  question: |
    For an internal live operations graph showing "events per second right now,"
    which posture is most appropriate?
  options:
  - 'Optimize completeness: event-time windows, large allowed lateness, exactly-once, nightly reconcile'
  - Use two-phase commit to every sink for the graph
  - 'Optimize cost only: batch the data to a warehouse and refresh hourly'
  - 'Optimize latency: processing-time-ish windows, drop late data, serve from Redis/Druid — cheap and
    instant'
  answer: 3
  explanation: |
    A live ops graph values instant, approximate freshness over exact late-data
    accuracy, so drop-late processing-time windows served from a fast store fit.
    Heavy completeness machinery adds latency/cost for no product benefit, and
    hourly batch defeats "right now."
  ref: concepts.md#latency-versus-completeness-versus-cost-the-governing-trade-off
- id: realtime-streaming-systems-031
  difficulty: intermediate
  tags:
  - micro-batch
  - spark
  question: |
    Why can Spark Structured Streaming (classic micro-batch mode) never beat a
    pure record-at-a-time engine on latency floor?
  options:
  - Because it cuts the stream into small batches processed on an interval, so end-to-end latency is bounded
    below by that batch interval
  - Because it is written in Python
  - Because it cannot use Kafka as a source
  - Because it does not support windowing
  answer: 0
  explanation: |
    Micro-batching processes the stream in discrete intervals, so latency can't drop
    below the batch interval (hundreds of ms), unlike per-record engines. It is not
    about language, and Spark supports Kafka sources and windowing.
  ref: concepts.md#stream-processing-fundamentals-and-the-streaming-dataflow-model
- id: realtime-streaming-systems-032
  difficulty: intermediate
  tags:
  - hot-path
  - cold-path
  - divergence
  question: |
    What is the main design risk when running a hot path and a cold path that both
    compute "the same" business metric?
  options:
  - The hot path will always be exactly correct
  - The cold path will be faster than the hot path
  - Divergence — the two systems compute the number differently; mitigate by deriving both from the same
    immutable log and reconciling on a schedule
  - Kafka cannot feed two consumers
  answer: 2
  explanation: |
    The classic failure is the two paths drifting so users see conflicting numbers;
    the mitigation is a shared immutable source log plus scheduled reconciliation.
    The hot path is approximate (not exact), the cold path is slower, and Kafka
    readily fans out to multiple consumers.
  ref: concepts.md#hot-path-and-cold-path-the-speed-and-accuracy-split
- id: realtime-streaming-systems-033
  difficulty: intermediate
  tags:
  - redis
  - durability
  question: |
    How should you treat a Redis sorted set that backs a leaderboard, given Redis
    is in-memory?
  options:
  - As the sole source of truth for scores; no backup needed
  - As a cold-storage archive
  - As a message queue for score events
  - As a rebuildable serving/index layer, with the authoritative score kept in a durable database and
    AOF/RDB persistence enabled
  answer: 3
  explanation: |
    The ZSET is a fast, rebuildable index; the durable ledger of scores belongs in
    a database so you can reconstruct the set after failover. Redis isn't the ledger,
    isn't a queue, and isn't cold storage.
  ref: concepts.md#leaderboards-with-redis-sorted-sets
- id: realtime-streaming-systems-034
  difficulty: intermediate
  tags:
  - olap
  - rollup
  - tradeoff
  question: |
    Rolling up (pre-aggregating) event data on ingest into an OLAP store reduces
    storage and speeds queries. What is the cost?
  options:
  - It destroys raw granularity, so you cannot later drill into dimensions you rolled away
  - It increases query latency
  - It makes ingestion impossible
  - It requires disabling compression
  answer: 0
  explanation: |
    Rollup collapses rows by dropping detail, so future drill-downs into rolled-away
    dimensions become impossible — you trade retention/flexibility for cost/speed.
    Rollup lowers (not raises) query latency and doesn't block ingestion or compression.
  ref: concepts.md#real-time-olap-druid-pinot-and-clickhouse-versus-batch-warehouses
- id: realtime-streaming-systems-035
  difficulty: intermediate
  tags:
  - live-comments
  - redis-pubsub
  - kafka
  question: |
    In a high-fan-out live comment system, why use Redis Pub/Sub for the last-hop
    broadcast but Kafka for the ingest/aggregation backbone?
  options:
  - Redis Pub/Sub is durable and Kafka is ephemeral
  - Redis Pub/Sub is ultra-low-latency but fire-and-forget (non-durable), ideal for ephemeral last-hop
    fan-out; Kafka is durable and replayable, ideal for the ingest/aggregation backbone
  - Kafka cannot handle comments at all
  - Redis Pub/Sub guarantees exactly-once delivery
  answer: 1
  explanation: |
    Redis Pub/Sub trades durability for minimal latency (great for the ephemeral
    final broadcast hop), while Kafka's durability and replay suit the reliable
    backbone. The first option reverses their properties, and Redis Pub/Sub does not
    guarantee delivery.
  ref: concepts.md#live-comments-reactions-and-high-fan-out-broadcast-systems
- id: realtime-streaming-systems-036
  difficulty: advanced
  tags:
  - exactly-once
  - two-phase-commit
  - latency
  question: |
    Uber's ad platform commits Flink output to Kafka via two-phase commit tied to a
    2-minute checkpoint interval. What is the direct latency consequence for
    downstream consumers?
  options:
  - Output is visible instantly regardless of checkpoints
  - Consumers must poll every 2 seconds
  - Committed output becomes visible only when the checkpoint completes, so downstream visibility can
    lag by up to the checkpoint interval (~2 min)
  - The checkpoint interval has no effect on visibility
  answer: 2
  explanation: |
    With transactional 2PC sinks, output stays uncommitted until the checkpoint
    completes, so read_committed consumers only see results after each checkpoint —
    coupling visibility latency to the checkpoint interval. That is the price of
    end-to-end exactly-once.
  ref: concepts.md#exactly-once-at-least-once-and-at-most-once-semantics-in-streaming
- id: realtime-streaming-systems-037
  difficulty: advanced
  tags:
  - watermarks
  - keying
  - uber
  question: |
    Uber's ad-event aggregation keys events by ad id plus a truncated 1-minute time
    bucket and uses a tumbling window, deliberately avoiding watermarks. What
    correctness property does this buy?
  options:
  - It guarantees the lowest possible latency
  - It makes windows overlap for smoother results
  - It eliminates the need for any deduplication
  - Late-arriving events still land in their correct minute bucket regardless of arrival delay, so no
    watermark tuning trade-off is needed for bucketing
  answer: 3
  explanation: |
    Truncating event time to a minute and keying by it means an event's bucket is
    determined by its own timestamp, so arbitrarily late arrivals still aggregate
    correctly without watermark heuristics. It doesn't minimize latency, remove the
    need for dedup (they still use UUIDs), or create overlap.
  ref: concepts.md#watermarks-and-handling-late-out-of-order-data
- id: realtime-streaming-systems-038
  difficulty: advanced
  tags:
  - backpressure
  - flink
  - watermarks
  question: |
    A Flink job's Kafka consumer lag is steadily growing and its event-time windows
    have stopped firing. What is the most likely root cause and correct diagnosis?
  options:
  - Backpressure — a downstream operator or sink can't keep up, stalling watermark advancement so windows
    never reach firing time; find and scale the slow operator or fix key skew
  - Kafka has run out of partitions
  - The watermark delay is set too small
  - Exactly-once is disabled
  answer: 0
  explanation: |
    When a downstream operator/sink is the bottleneck, backpressure slows source
    consumption, watermarks stall, and windows (which fire on watermark advance)
    stop emitting. The fix is to locate and scale the slow stage or fix skew, not to
    add partitions or blame watermark size.
  ref: concepts.md#stream-processing-fundamentals-and-the-streaming-dataflow-model
- id: realtime-streaming-systems-039
  difficulty: advanced
  tags:
  - exactly-once
  - external-side-effects
  question: |
    Your Flink pipeline is exactly-once, but its sink calls a payment API that
    charges a card. On replay/recovery, how do you avoid double charges?
  options:
  - Rely on Flink checkpoints alone — they make external side effects exactly-once
  - Disable checkpointing so no replay ever happens
  - Make the external call idempotent using an idempotency key derived from event+window so the payment
    API deduplicates retries
  - Switch the sink to at-most-once and accept dropped charges
  answer: 2
  explanation: |
    Pipeline exactly-once cannot make an external, non-transactional side effect
    exactly-once; you make the call idempotent with a stable key so the API dedupes
    replays. Checkpoints alone don't cover external effects, disabling them harms
    recovery, and at-most-once drops legitimate charges.
  ref: concepts.md#exactly-once-at-least-once-and-at-most-once-semantics-in-streaming
- id: realtime-streaming-systems-040
  difficulty: advanced
  tags:
  - leaderboards
  - approximation
  - scale
  question: |
    A game has 500M players and needs each player's live global rank. Exact rank per
    query is too expensive. Which approach is the standard product compromise?
  options:
  - Recompute all 500M ranks synchronously on every score change
  - Only allow 1000 players on the leaderboard
  - Store all players in one SQL table and ORDER BY on each request
  - Serve exact top-N from a sorted set, and approximate each player's personal rank via score-bucket
    histograms or a t-digest percentile sketch
  answer: 3
  explanation: |
    Users need exact ranks only near the top; personal rank deep in the pack can be
    approximated cheaply with bucket counts or percentile sketches ("top 3%"). Full
    recomputation and per-request SQL sorts are O(N) and infeasible; capping players
    isn't a ranking solution.
  ref: concepts.md#leaderboards-with-redis-sorted-sets
- id: realtime-streaming-systems-041
  difficulty: advanced
  tags:
  - pinot
  - clickhouse
  - druid
  - tradeoff
  question: |
    You must choose between Apache Pinot and ClickHouse. The workload is a small
    number of heavy, ad-hoc SQL queries over huge log volumes for an internal
    observability explorer. Which is the better fit and why?
  options:
  - Pinot, because it maximizes concurrent user queries and upserts
  - ClickHouse, because it offers SQL expressiveness and raw scan speed for fewer, heavier queries, which
    suits logs/observability
  - Neither; use a Redis sorted set
  - Pinot, because ClickHouse cannot run SQL
  answer: 1
  explanation: |
    ClickHouse shines on flexible SQL and raw scan throughput for fewer, heavier
    queries (classic observability). Pinot's edge is high concurrency and upserts —
    not what this workload needs. A ZSET has no analytical engine, and ClickHouse is
    SQL-native.
  ref: concepts.md#real-time-olap-druid-pinot-and-clickhouse-versus-batch-warehouses
- id: realtime-streaming-systems-042
  difficulty: advanced
  tags:
  - kappa
  - reprocessing
  question: |
    You find a logic bug in a Kappa pipeline that has been producing wrong
    aggregates. What is the correct reprocessing procedure?
  options:
  - Deploy the fixed job, replay from the earliest offset into a NEW output table/topic, validate it,
    then atomically swap the serving pointer
  - Manually edit the wrong rows in the serving store
  - Delete the Kafka topic and start over with no history
  - Turn off the pipeline until users stop complaining
  answer: 0
  explanation: |
    Kappa's superpower is replaying the immutable log through the corrected job into
    a fresh output, validating, then swapping the serving pointer atomically. Manual
    edits don't scale or stay consistent, deleting the topic destroys the replay
    source, and pausing fixes nothing.
  ref: concepts.md#lambda-architecture-versus-kappa-architecture
- id: realtime-streaming-systems-043
  difficulty: advanced
  tags:
  - live-comments
  - capacity
  question: |
    A livestream expects 1M concurrent viewers. If each gateway server holds ~50k
    WebSocket connections, roughly how many gateway servers do you need just for
    connections, and what dominates their memory?
  options:
  - About 2 servers; CPU dominates
  - About 1000 servers; disk I/O dominates
  - About 20 servers; the per-connection state (tens of KB each) dominates memory
  - Exactly 1 server; connections are free
  answer: 2
  explanation: |
    1M / 50k = 20 gateways, and idle-but-open connections each cost tens of KB of
    buffers/state, so connection memory dominates. The other estimates miscompute
    the divide or misattribute the bottleneck; connections are definitely not free.
  ref: concepts.md#live-comments-reactions-and-high-fan-out-broadcast-systems
- id: realtime-streaming-systems-044
  difficulty: advanced
  tags:
  - fraud
  - windowing
  - tradeoff
  question: |
    For a fraud rule that must catch a burst of transactions even if the burst
    straddles a clock boundary, why might a sliding window be preferred over a
    tumbling window despite higher cost?
  options:
  - Sliding windows are always cheaper than tumbling
  - Sliding windows drop late data automatically
  - Tumbling windows cannot count transactions
  - A tumbling window can split a straddling burst across two buckets and miss the threshold, whereas
    overlapping sliding windows give better recall of boundary-straddling patterns
  answer: 3
  explanation: |
    A burst spanning a tumbling boundary is divided so neither bucket trips the
    threshold; overlapping sliding windows always contain the full burst in some
    window, improving recall — worth the extra state for fraud. Sliding is more (not
    less) costly, tumbling can count, and late-data handling is orthogonal.
  ref: concepts.md#windowing-tumbling-sliding-session-and-global-windows
- id: realtime-streaming-systems-045
  difficulty: advanced
  tags:
  - governing-tradeoff
  - billing
  - scenario
  question: |
    You are designing metered billing for API usage. Which streaming posture best
    fits the requirement, and what do you accept?
  options:
  - Processing-time tumbling windows that drop late events, for lowest latency, accepting undercounting
  - At-most-once delivery to minimize infrastructure
  - A single Redis sorted set with no durability
  - Event-time windows with allowed lateness, exactly-once (or idempotent) sinks, plus a cold-path reconcile
    — accepting higher latency and cost for correctness
  answer: 3
  explanation: |
    Billing must be complete and correct even for late/out-of-order usage, so
    event-time windows, allowed lateness, exactly-once effect, and a reconcile path
    are appropriate — trading latency and cost for accuracy. Dropping late events,
    undurable Redis, or at-most-once all risk revenue-affecting undercounts.
  ref: concepts.md#latency-versus-completeness-versus-cost-the-governing-trade-off
- id: realtime-streaming-systems-046
  difficulty: advanced
  tags:
  - exactly-once
  - barrier-alignment
  - latency
  question: |
    Why can enabling exactly-once (barrier-aligned checkpointing) in Flink hurt
    latency compared to at-least-once?
  options:
  - Barrier alignment stalls faster operators to wait for the slowest input's barrier before snapshotting,
    adding latency under skew or backpressure
  - It disables parallelism entirely
  - It forces single-threaded execution
  - It doubles the number of Kafka partitions
  answer: 0
  explanation: |
    Exactly-once uses aligned barriers: an operator with multiple inputs waits for
    the barrier on all of them, so a slow/skewed input stalls the fast ones,
    increasing latency (unaligned checkpoints exist to mitigate this). It doesn't
    disable parallelism or change partition counts.
  ref: concepts.md#exactly-once-at-least-once-and-at-most-once-semantics-in-streaming
- id: realtime-streaming-systems-047
  difficulty: advanced
  tags:
  - leaderboards
  - capacity
  question: |
    Estimate the RAM to hold 100M leaderboard entries in one Redis sorted set if
    each entry (member string, score, skiplist overhead) is ~60-100 bytes.
  options:
  - About 6-10 MB
  - About 600 GB - 1 TB
  - About 6-10 GB
  - About 60-100 KB
  answer: 2
  explanation: |
    100M x ~60-100 bytes = ~6-10 GB, feasible on one large node but a single hotspot
    and memory ceiling. The other figures are off by three or more orders of
    magnitude.
  ref: concepts.md#leaderboards-with-redis-sorted-sets
- id: realtime-streaming-systems-048
  difficulty: advanced
  tags:
  - olap
  - architecture
  - scatter-gather
  question: |
    In Druid/Pinot, how does a query return sub-second results that include both
    seconds-old and historical data?
  options:
  - It queries only historical segments and ignores recent data
  - It runs a full table scan of a relational database
  - It copies all data into Redis first
  - A broker scatter-gathers across real-time nodes (recent, in-memory) and historical nodes (immutable
    columnar segments in deep storage) and merges the partial results
  answer: 3
  explanation: |
    The broker fans a query out to both real-time and historical nodes and merges
    partial aggregates, covering fresh and old data with sub-second latency. It does
    not ignore recent data, stage through Redis, or scan an RDBMS.
  ref: concepts.md#real-time-olap-druid-pinot-and-clickhouse-versus-batch-warehouses
- id: realtime-streaming-systems-049
  difficulty: advanced
  tags:
  - live-comments
  - consistency
  question: |
    For live comment ordering across millions of viewers, what consistency model is
    typically chosen and why?
  options:
  - Best-effort / eventually consistent ordering, accepting slight reordering and occasional drops to
    keep latency sub-second
  - Strict global total ordering, because users demand identical comment order
  - Linearizable ordering enforced by a single global lock
  - No ordering at all, delivering comments in random shuffled order intentionally
  answer: 0
  explanation: |
    Perfect global ordering across millions of clients would cost too much latency,
    so live chat uses best-effort ordering and tolerates minor reordering/drops for
    speed. Strict/linearizable ordering doesn't scale here, and intentional random
    shuffling is not a goal.
  ref: concepts.md#live-comments-reactions-and-high-fan-out-broadcast-systems
- id: realtime-streaming-systems-050
  difficulty: advanced
  tags:
  - watermarks
  - quantify
  - tradeoff
  question: |
    A team sets a 5-second bounded-out-of-orderness watermark and side-outputs later
    events to a nightly reconcile. How should they describe this trade-off precisely?
  options:
  - It guarantees 100% completeness in real time with zero latency
  - It makes the watermark irrelevant to latency
  - Windows emit within ~5s and drop the ~0.1% of events later than 5s from the live result, while a nightly
    cold-path reconcile restores billing-grade accuracy
  - It eliminates the need for any batch processing
  answer: 2
  explanation: |
    The 5s watermark trades a small tail of very-late events out of the live result
    (fast, ~complete) and recovers exact totals later via reconcile — a precise
    latency/completeness statement. It is not zero-latency-100%-complete, the
    watermark directly sets latency, and it explicitly relies on a batch reconcile.
  ref: concepts.md#watermarks-and-handling-late-out-of-order-data
- id: realtime-streaming-systems-051
  difficulty: advanced
  tags:
  - dashboards
  - push-vs-poll
  - scale
  question: |
    For thousands of viewers watching the SAME live dashboard, why does fan-out from
    a pub/sub plus SSE typically beat per-client short polling?
  options:
  - Polling produces fewer requests and less latency
  - Pub/sub requires each client to compute the metric itself
  - SSE cannot handle more than 10 clients
  - Per-client polling wastes many redundant requests and adds refresh-interval latency, while one pub/sub
    fan-out pushes each update once per connection with lower overhead at steady state
  answer: 3
  explanation: |
    Polling multiplies redundant queries and adds interval latency; a single
    computation fanned out over pub/sub + SSE pushes updates efficiently to many
    connections. Polling is the higher-overhead option, SSE scales well, and clients
    don't recompute anything.
  ref: concepts.md#real-time-dashboards-and-live-analytics-serving
- id: realtime-streaming-systems-052
  difficulty: advanced
  tags:
  - event-time
  - reproducibility
  question: |
    Why are event-time results reproducible on replay while processing-time results
    are not?
  options:
  - Event-time windowing depends only on timestamps embedded in the data, so replaying the same events
    yields the same windows; processing-time depends on machine wall-clock at run, which varies with lag
    and scheduling
  - Event time uses a faster clock
  - Processing time stores results in a database and event time does not
  - They are equally reproducible
  answer: 0
  explanation: |
    Because event time is a function of the immutable data timestamps, a replay
    reconstructs identical windows; processing-time windows depend on non-deterministic
    arrival/scheduling, so replays differ. It is not about clock speed or storage.
  ref: concepts.md#event-time-versus-processing-time-and-the-three-clocks
- id: realtime-streaming-systems-053
  difficulty: advanced
  tags:
  - kappa
  - lambda
  - hybrid
  question: |
    Why do modern shops like Uber and Netflix lean Kappa-ish yet still keep a batch
    reconcile path for some data?
  options:
  - Because batch is always faster than streaming
  - Because Kafka cannot retain data
  - One streaming codebase is simpler, but a batch reconcile provides a financial-grade correctness backstop
    for critical data (e.g., billing) where late data or bugs must be fully corrected
  - Because streaming engines cannot do event-time processing
  answer: 2
  explanation: |
    The pragmatic hybrid keeps Kappa's single codebase for most pipelines while a
    batch reconcile guarantees exact truth for money-critical data. Batch isn't
    faster, Kafka retains data (enabling Kappa), and modern engines do event time well.
  ref: concepts.md#lambda-architecture-versus-kappa-architecture
- id: realtime-streaming-systems-054
  difficulty: advanced
  tags:
  - leaderboards
  - hotspot
  - tradeoff
  question: |
    A single global ZSET for a leaderboard is correct and simple but has what two
    scaling weaknesses, and what does sharding cost in return?
  options:
  - It is slow for top-N reads; sharding fixes reads but breaks writes
  - It has no weaknesses; sharding is always better
  - It cannot store scores; sharding adds score storage
  - It is a write hotspot with a memory ceiling; sharding scales writes/memory but destroys cheap single-shard
    global rank
  answer: 3
  explanation: |
    One ZSET funnels all writes to one node (hotspot) and is bounded by one node's
    memory; sharding relieves both but makes global rank a scatter-gather. Top-N reads
    are cheap on one ZSET, and it stores scores fine — so the other options are wrong.
  ref: concepts.md#leaderboards-with-redis-sorted-sets
- id: realtime-streaming-systems-055
  difficulty: advanced
  tags:
  - live-comments
  - sampling
  - scale
  question: |
    At extreme livestream scale, platforms like YouTube/Twitch do NOT display every
    comment. What technique makes the comment feed viable, and what is the trade-off?
  options:
  - Store comments in a warehouse; trade freshness
  - Sample, rate-limit per user, and prioritize (creator, moderators, paid messages) — trading complete
    fidelity of every comment for a viable, readable, scalable feed
  - Show every comment but in random order; trade ordering
  - Broadcast comments only once per hour; trade nothing
  answer: 1
  explanation: |
    Sampling, per-user rate limits, and priority for important senders keep the feed
    readable and scalable at the cost of not showing every message. Warehousing is
    too slow, showing every comment defeats the purpose, and hourly broadcast isn't
    live.
  ref: concepts.md#live-comments-reactions-and-high-fan-out-broadcast-systems
- id: realtime-streaming-systems-056
  difficulty: expert
  tags:
  - exactly-once
  - end-to-end
  - limits
  question: |
    What are the two edge conditions that break true end-to-end exactly-once even in
    a well-configured Flink pipeline?
  options:
  - A non-replayable source (can't rewind, e.g., a UDP firehose) and a non-idempotent, non-transactional
    sink/side effect (e.g., sending an email) — you must dedupe at those edges
  - Too many partitions and too few operators
  - Using event time instead of processing time
  - Enabling checkpointing and using Kafka
  answer: 0
  explanation: |
    End-to-end exactly-once needs a replayable source and a transactional/idempotent
    sink; a source you can't rewind or a side effect you can't dedupe (email, card
    charge) breaks the guarantee, forcing edge-level dedup. Partition counts, event
    time, and checkpointing+Kafka do not break it — the last actually enables it.
  ref: concepts.md#exactly-once-at-least-once-and-at-most-once-semantics-in-streaming
- id: realtime-streaming-systems-057
  difficulty: expert
  tags:
  - checkpointing
  - tradeoff
  - tuning
  question: |
    Uber lowered its Flink checkpoint interval from the 10-minute default to 2
    minutes. Reasoning about the trade-off, what does a SHORTER checkpoint interval
    buy and cost?
  options:
  - It only reduces cost with no downside
  - Shorter interval increases output latency and reduces overhead
  - Shorter interval reduces output visibility lag and recovery reprocessing (less to redo on failure)
    but increases steady-state checkpointing overhead/IO
  - The interval has no effect on recovery time
  answer: 2
  explanation: |
    A shorter interval commits transactional output more often (lower visibility lag)
    and means less work to replay after a failure, but pays more frequent snapshot
    overhead and IO. It is a genuine trade, not free; and it lowers, not raises,
    visibility latency.
  ref: concepts.md#exactly-once-at-least-once-and-at-most-once-semantics-in-streaming
- id: realtime-streaming-systems-058
  difficulty: expert
  tags:
  - watermarks
  - skew
  - idle-partitions
  question: |
    In a keyed Flink job reading from many Kafka partitions, one partition is idle
    (no events). Why can this stall all event-time windows, and what is the fix?
  options:
  - Idle partitions speed up watermarks; no fix needed
  - You must switch to processing time permanently
  - The job automatically drops the idle partition after one second
  - The global watermark is the minimum across inputs, so an idle partition's stale watermark holds the
    whole job back; mark the partition idle or emit periodic watermarks so it stops gating progress
  answer: 3
  explanation: |
    Watermarks propagate as the minimum over inputs, so an idle source that never
    advances its watermark pins the global watermark and blocks window firing. Flink's
    idleness detection / periodic watermarks let it stop gating. Idle partitions slow,
    not speed, watermarks; switching to processing time is a drastic non-fix.
  ref: concepts.md#watermarks-and-handling-late-out-of-order-data
- id: realtime-streaming-systems-059
  difficulty: expert
  tags:
  - state
  - rocksdb
  - scaling
  question: |
    A stateful Flink job with a very large keyed state (hundreds of GB) suffers slow
    checkpoints and recovery. Which combination of measures best addresses this?
  options:
  - Move all state to on-heap memory and disable checkpoints
  - Convert the job to at-most-once to avoid state
  - Increase the watermark delay to shrink state
  - Use the RocksDB state backend with incremental checkpoints to durable storage, tune parallelism/key
    partitioning to reduce per-task state, and consider local recovery to cut restore time
  answer: 3
  explanation: |
    Large state is handled by RocksDB (spills to disk) with incremental checkpoints
    (snapshot only deltas), better key partitioning to shrink per-task state, and
    local recovery to speed restores. On-heap can't hold hundreds of GB, watermark
    delay doesn't shrink keyed aggregate state, and at-most-once sacrifices correctness.
  ref: concepts.md#exactly-once-at-least-once-and-at-most-once-semantics-in-streaming
- id: realtime-streaming-systems-060
  difficulty: expert
  tags:
  - leaderboards
  - approximation
  - bucketing
  question: |
    To compute approximate global rank across sharded leaderboards without a
    per-query scatter-gather over all members, which structure gives O(number of
    buckets) rank estimation?
  options:
  - 'A score-bucket histogram (count of players per score bucket): rank is approximately the sum of counts
    in buckets above the player''s bucket'
  - A per-shard full sort recomputed each query
  - A linked list of all players ordered by score
  - A single hash map from player to score
  answer: 0
  explanation: |
    Maintaining counts per score bucket lets you estimate rank as the sum of higher
    buckets in O(#buckets), independent of player count — a cheap approximation.
    Full re-sorts and linked-list traversal are O(N); a plain hash map has no
    ordering to derive rank.
  ref: concepts.md#leaderboards-with-redis-sorted-sets
- id: realtime-streaming-systems-061
  difficulty: expert
  tags:
  - olap
  - upsert
  - correctness
  question: |
    Why is Apache Pinot's upsert capability especially important when a stream can
    deliver duplicate or corrected records for the same entity?
  options:
  - Upsert makes queries slower but simpler
  - Upsert disables real-time ingestion
  - Upsert lets records with the same key overwrite/merge rather than append, so at-least-once duplicates
    and late corrections converge to one correct row — giving exactly-once effect at the sink
  - Upsert is only for deleting data
  answer: 2
  explanation: |
    Upsert keys records so duplicates and corrections replace prior versions instead
    of double-counting, turning at-least-once delivery into a correct final state
    without 2PC. It doesn't slow queries as a feature, disable ingestion, or exist
    only for deletes.
  ref: concepts.md#real-time-olap-druid-pinot-and-clickhouse-versus-batch-warehouses
- id: realtime-streaming-systems-062
  difficulty: expert
  tags:
  - governing-tradeoff
  - fraud
  - scenario
  question: |
    A real-time fraud system must be BOTH low-latency (block in <1s) and correct
    (event-time accurate). Given the latency/completeness/cost triangle, what is the
    honest consequence of demanding two corners at once?
  options:
  - You can get both at zero extra cost
  - You should batch the data and decide the next day
  - It is impossible to have both, so drop correctness entirely
  - 'You must pay on the cost axis: run tight-watermark event-time processing (Flink CEP) with at-least-once
    plus downstream dedupe, accepting higher infrastructure/operational cost to buy both latency and correctness'
  answer: 3
  explanation: |
    The triangle says you can favor two corners by spending on the third: buying both
    latency and correctness means paying in cost/complexity (rich stream engine,
    event-time + tight watermark, dedupe). It is not free, not impossible, and batch
    defeats the sub-second requirement.
  ref: concepts.md#latency-versus-completeness-versus-cost-the-governing-trade-off
- id: realtime-streaming-systems-063
  difficulty: expert
  tags:
  - live-comments
  - reactions
  - aggregation-window
  question: |
    For a reaction bar on a 10M-viewer stream, engineers count reactions per 1-2s
    window and broadcast the aggregate. Why is the window size itself a tuning
    trade-off?
  options:
  - A smaller window feels more live (lower latency) but broadcasts more frequently (more fan-out/CPU);
    a larger window batches more counts (cheaper, smoother) but feels laggier
  - A larger window guarantees exactly-once reactions
  - Window size has no effect on cost or latency
  - A smaller window reduces total messages sent
  answer: 0
  explanation: |
    The aggregation window trades perceived liveness (small = fresh but more frequent
    broadcasts and cost) against efficiency (large = cheaper, smoother, laggier). It
    is not about exactly-once, it clearly affects cost/latency, and smaller windows
    send more, not fewer, broadcasts.
  ref: concepts.md#live-comments-reactions-and-high-fan-out-broadcast-systems
- id: realtime-streaming-systems-064
  difficulty: expert
  tags:
  - dashboards
  - olap
  - concurrency
  - scenario
  question: |
    A product exposes a per-tenant real-time dashboard to 100k tenants, each issuing
    frequent aggregation queries over their own seconds-fresh data. Which serving
    design is most appropriate?
  options:
  - Query the primary transactional database directly per refresh
  - Run a nightly Spark batch job and cache yesterday's numbers
  - Ingest to a high-concurrency real-time OLAP store (Pinot/Druid) partitioned by tenant, pre-aggregate
    hot metrics on the write path, and serve queries with tenant-scoped predicates
  - Keep all tenant metrics in one Redis sorted set
  answer: 2
  explanation: |
    High tenant concurrency + freshness + aggregation is exactly the real-time OLAP
    sweet spot, with tenant partitioning and write-path pre-aggregation for hot
    metrics. Hitting the OLTP DB won't survive the QPS, nightly batch isn't real-time,
    and a ZSET is a ranking primitive, not an analytics engine.
  ref: concepts.md#real-time-dashboards-and-live-analytics-serving
- id: realtime-streaming-systems-065
  difficulty: expert
  tags:
  - exactly-once
  - delivery-semantics
  - tradeoff
  question: |
    When is choosing at-least-once delivery plus an idempotent sink STRICTLY
    preferable to full transactional exactly-once (2PC), and when must you still use
    2PC?
  options:
  - At-least-once + idempotent is always worse than 2PC
  - Idempotent sinks cannot achieve exactly-once effect under any condition
  - 2PC should be used for every sink unconditionally
  - Prefer at-least-once + idempotent when the sink can be made idempotent/upsert (cheaper, lower latency);
    you still need 2PC when the sink cannot be idempotent (e.g., appending to a non-keyed ledger) and
    duplicates are unacceptable
  answer: 3
  explanation: |
    If the sink supports upsert/idempotency you get exactly-once effect cheaper and
    faster than 2PC; 2PC is reserved for sinks that cannot dedupe (non-keyed appends)
    where duplicates would corrupt results. Blanket 2PC adds needless latency, and
    idempotent sinks do achieve exactly-once effect.
  ref: concepts.md#exactly-once-at-least-once-and-at-most-once-semantics-in-streaming
- id: realtime-streaming-systems-066
  difficulty: expert
  tags:
  - kappa
  - reprocessing
  - cost
  question: |
    A Kappa purist wants to reprocess a full year of history through a stream job for
    a correction. What is the realistic downside versus a Lambda batch layer?
  options:
  - Replaying a year through a stream engine can be slow and expensive (and needs full retention), whereas
    a purpose-built batch job may recompute large historical spans more efficiently
  - There is no downside; streaming reprocessing is always cheap
  - Streaming reprocessing cannot produce correct results
  - Lambda cannot reprocess history at all
  answer: 0
  explanation: |
    Kappa's replay-everything approach can be slow/costly for very large historical
    spans and demands long retention; Lambda's batch layer is often more efficient
    for big historical recomputation — a real reason the hybrid persists. Streaming
    reprocessing is correct but not free, and Lambda's batch layer is precisely for
    reprocessing.
  ref: concepts.md#lambda-architecture-versus-kappa-architecture
- id: realtime-streaming-systems-067
  difficulty: expert
  tags:
  - windowing
  - triggers
  - dataflow
  question: |
    In the Dataflow/Beam model, watermarks answer "when in event time," but what
    additional mechanism controls "when in processing time to actually emit
    (possibly multiple, refining) results" for a window?
  options:
  - The state backend
  - The Kafka partition count
  - Triggers (with accumulation mode), which can fire early (speculative), on-time (at the watermark),
    and late (on late data), emitting refined results
  - The checkpoint interval
  answer: 2
  explanation: |
    Triggers decide the processing-time firing policy — early/on-time/late — and,
    with accumulation mode, let a window emit successive refined results as data
    arrives. The state backend, partition count, and checkpoint interval govern
    storage/parallelism/recovery, not emission timing.
  ref: concepts.md#windowing-tumbling-sliding-session-and-global-windows
- id: realtime-streaming-systems-068
  difficulty: intermediate
  tags:
  - olap
  - batch
  - freshness
  question: |
    Which statement best contrasts a batch data warehouse with a real-time OLAP store
    on ingestion and freshness?
  options:
  - Warehouses ingest continuously and serve millisecond-fresh data; OLAP stores ingest in nightly batches
  - Warehouses typically batch-ingest and serve second-to-minute latency; real-time OLAP stores ingest
    continuously (e.g., from Kafka) and serve seconds-fresh data at low latency
  - Both are identical in freshness
  - Real-time OLAP stores cannot ingest from streams
  answer: 1
  explanation: |
    Warehouses are batch-oriented with higher query latency; real-time OLAP stores
    stream-ingest and serve fresh data with sub-second queries. The first option
    reverses the two, they are not identical, and OLAP stores are built for stream
    ingestion.
  ref: concepts.md#real-time-olap-druid-pinot-and-clickhouse-versus-batch-warehouses
- id: realtime-streaming-systems-069
  difficulty: intermediate
  tags:
  - delivery-semantics
  - at-most-once
  question: |
    Which delivery semantic offers the lowest latency and cost but loses data on
    failure, making it acceptable only for approximate/best-effort telemetry?
  options:
  - Exactly-once
  - At-least-once
  - Transactional two-phase commit
  - At-most-once
  answer: 3
  explanation: |
    At-most-once is fire-and-forget: no retries, so it is cheapest and lowest latency
    but drops data on failure — fine for approximate telemetry. At-least-once retries
    (duplicates), and exactly-once/2PC add machinery and latency for correctness.
  ref: concepts.md#exactly-once-at-least-once-and-at-most-once-semantics-in-streaming
- id: realtime-streaming-systems-070
  difficulty: beginner
  tags:
  - dashboards
  - tradeoff
  question: |
    What is a primary downside of push delivery (WebSocket/SSE) versus stateless
    polling for dashboard updates?
  options:
  - Push always has higher latency than polling
  - Push requires stateful long-lived connections, which are harder to load-balance and scale than stateless,
    easily cached polling requests
  - Push cannot deliver real-time updates
  - Polling never wastes any requests
  answer: 1
  explanation: |
    Push connections are stateful and long-lived, complicating load balancing and
    scaling, whereas polling is stateless and cache-friendly (its downside is wasted
    requests and latency). Push has lower latency, does deliver real-time updates, and
    polling clearly wastes requests.
  ref: concepts.md#real-time-dashboards-and-live-analytics-serving
- id: realtime-streaming-systems-071
  difficulty: intermediate
  tags:
  - fundamentals
  - dag
  - parallelism
  question: |
    How does a stream processing framework achieve parallelism for a stateful keyed
    aggregation?
  options:
  - It partitions the stream by key (keyBy/shuffle) and runs operator instances in parallel, each owning
    a disjoint subset of keys and their state
  - It runs the entire job single-threaded to preserve state
  - It replicates all state to every operator instance
  - It stores all state in the Kafka broker
  answer: 0
  explanation: |
    Keyed streams are partitioned so each parallel operator instance handles a subset
    of keys and holds only that subset's state, enabling scale-out. Single-threaded
    defeats parallelism, replicating all state everywhere is wasteful/incorrect, and
    operator state lives in the state backend, not the broker.
  ref: concepts.md#stream-processing-fundamentals-and-the-streaming-dataflow-model
- id: realtime-streaming-systems-072
  difficulty: advanced
  tags:
  - governing-tradeoff
  - table
  - scenario
  question: |
    Match the requirement to the right optimization: "historical BI reporting over
    years of data, cost-sensitive, freshness not required." Which posture fits?
  options:
  - Optimize latency with a Flink hot path into Redis
  - Optimize latency with processing-time windows that drop late data
  - Optimize cost and completeness with batch pipelines into a data warehouse, sacrificing freshness
  - Serve it from a Redis sorted set
  answer: 2
  explanation: |
    Historical BI values cheap storage and correctness over freshness, so batch into
    a warehouse is right — you accept staleness. A Flink hot path or drop-late
    processing-time windows optimize the wrong corner (latency) at needless cost, and
    a ZSET is a ranking primitive, not a BI store.
  ref: concepts.md#latency-versus-completeness-versus-cost-the-governing-trade-off
- id: realtime-streaming-systems-073
  difficulty: intermediate
  tags:
  - leaderboards
  - sql-vs-redis
  question: |
    Why does a relational "SELECT ... ORDER BY score LIMIT 10" plus a
    "COUNT(*) WHERE score > mine" for rank fail to scale for a hot leaderboard?
  options:
  - SQL cannot sort numbers
  - ORDER BY is not supported in SQL
  - Relational databases cannot store scores
  - The rank count is O(N) per query and heavy concurrent ranking queries overwhelm the database, whereas
    a Redis sorted set answers rank in O(log N)
  answer: 3
  explanation: |
    Computing a rank via COUNT over all higher scores is O(N) and, under high QPS,
    crushes the DB; Redis ZSET rank is O(log N). SQL can sort and store scores and
    supports ORDER BY — the problem is per-query cost at scale, not capability.
  ref: concepts.md#leaderboards-with-redis-sorted-sets
- id: realtime-streaming-systems-074
  difficulty: expert
  tags:
  - live-comments
  - fan-out
  - routing
  question: |
    In a WebSocket gateway fleet fanning out a channel's messages, how are new
    messages routed only to the gateways holding connections for that channel?
  options:
  - Every message is broadcast to every gateway regardless of subscriptions
  - Messages are emailed between gateways
  - Clients poll a central database for messages
  - Gateways subscribe to the relevant channel (via Redis Pub/Sub or a Kafka topic) and a channel-to-server
    registry or consistent hashing routes messages only to gateways with matching subscribers
  answer: 3
  explanation: |
    Gateways subscribe per channel and a registry/consistent-hashing routes each
    message only to gateways with relevant connections, avoiding wasteful global
    broadcast. Broadcasting to all gateways wastes bandwidth, polling adds latency,
    and email is absurd for this hop.
  ref: concepts.md#live-comments-reactions-and-high-fan-out-broadcast-systems
- id: realtime-streaming-systems-075
  difficulty: advanced
  tags:
  - event-time
  - ingestion-time
  - tradeoff
  question: |
    When is ingestion time a reasonable compromise between event time and processing
    time?
  options:
  - When you want more stability than processing time (timestamp fixed at the source, unaffected by downstream
    lag) but can tolerate incorrectness for events delayed before they reach the source
  - When you need perfect correctness for events delayed on the client before ingestion
  - When you never care about time at all
  - When the stream has no timestamps and never will
  answer: 0
  explanation: |
    Ingestion time stamps events at the source operator, so it's immune to downstream
    backpressure (more stable than processing time) but still wrong for events delayed
    before ingestion — a middle ground. It is not perfectly correct for pre-ingestion
    delays, and it is a time semantic, so time still matters.
  ref: concepts.md#event-time-versus-processing-time-and-the-three-clocks
