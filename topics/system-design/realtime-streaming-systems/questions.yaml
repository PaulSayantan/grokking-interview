    trade-off?
  options:
  - A smaller window feels more live (lower latency) but broadcasts more frequently (more fan-out/CPU);
    a larger window batches more counts (cheaper, smoother) but feels laggier
  - A larger aggregation window guarantees exactly-once reaction counting, because batching more events
    per window lets the engine deduplicate every repeated reaction before the aggregate is broadcast
  - Window size has no effect on cost or latency, since the fan-out fabric broadcasts the same total
    number of aggregate messages to viewers regardless of how the counts are bucketed
  - A smaller window reduces the total number of messages sent to viewers, because each shorter interval
    collapses more individual reactions into a single tighter aggregate before broadcasting
  answer: 0
  explanation: |
    The aggregation window trades perceived liveness (small = fresh but more frequent
    broadcasts and cost) against efficiency (large = cheaper, smoother, laggier). It
    is not about exactly-once, it clearly affects cost/latency, and smaller windows
    send more, not fewer, broadcasts.
  ref: concepts.md#live-comments-reactions-and-high-fan-out-broadcast-systems
- id: realtime-streaming-systems-064
  difficulty: expert
  tags:
  - dashboards
  - olap
  - concurrency
  - scenario
  question: |
    A product exposes a per-tenant real-time dashboard to 100k tenants, each issuing
    frequent aggregation queries over their own seconds-fresh data. Which serving
    design is most appropriate?
  options:
  - Query the primary transactional database directly on every dashboard refresh, adding read replicas and
    a covering index per tenant so the OLTP engine absorbs the aggregation QPS from 100k tenants
  - Run a nightly Spark batch job over all tenants and cache yesterday's precomputed numbers, refreshing
    the per-tenant dashboards once the batch completes each morning
  - Ingest to a high-concurrency real-time OLAP store (Pinot/Druid) partitioned by tenant, pre-aggregate
    hot metrics on the write path, and serve queries with tenant-scoped predicates
  - Keep all tenant metrics in one shared Redis sorted set keyed by metric value, ranking each tenant's
    data points by score and range-scanning per tenant on every dashboard query
  answer: 2
  explanation: |
    High tenant concurrency + freshness + aggregation is exactly the real-time OLAP
    sweet spot, with tenant partitioning and write-path pre-aggregation for hot
    metrics. Hitting the OLTP DB won't survive the QPS, nightly batch isn't real-time,
    and a ZSET is a ranking primitive, not an analytics engine.
  ref: concepts.md#real-time-dashboards-and-live-analytics-serving
- id: realtime-streaming-systems-065
  difficulty: expert
  tags:
  - exactly-once
  - delivery-semantics
  - tradeoff
  question: |
    When is choosing at-least-once delivery plus an idempotent sink STRICTLY
    preferable to full transactional exactly-once (2PC), and when must you still use
    2PC?
  options:
  - At-least-once plus an idempotent sink is always strictly worse than 2PC, because upsert deduplication
    still lets a rare redelivery slip through that only a two-phase commit can fully prevent
  - Idempotent sinks cannot achieve exactly-once effect under any condition, since replaying a record
    always re-triggers the write and only transactional commits can suppress the duplicate
  - Full transactional 2PC should be used for every sink unconditionally, because coupling commits to the
    checkpoint barrier is the only configuration that survives an operator failure mid-write
  - Prefer at-least-once + idempotent when the sink can be made idempotent/upsert (cheaper, lower latency);
    you still need 2PC when the sink cannot be idempotent (e.g., appending to a non-keyed ledger) and
    duplicates are unacceptable
  answer: 3
  explanation: |
    If the sink supports upsert/idempotency you get exactly-once effect cheaper and
    faster than 2PC; 2PC is reserved for sinks that cannot dedupe (non-keyed appends)
    where duplicates would corrupt results. Blanket 2PC adds needless latency, and
    idempotent sinks do achieve exactly-once effect.
  ref: concepts.md#exactly-once-at-least-once-and-at-most-once-semantics-in-streaming
- id: realtime-streaming-systems-066
  difficulty: expert
  tags:
  - kappa
  - reprocessing
  - cost
  question: |
    A Kappa purist wants to reprocess a full year of history through a stream job for
    a correction. What is the realistic downside versus a Lambda batch layer?
  options:
  - Replaying a year through a stream engine can be slow and expensive (and needs full retention), whereas
    a purpose-built batch job may recompute large historical spans more efficiently
  - There is no real downside; streaming reprocessing of a full year is always cheap because the engine
    replays the log at line rate without the shuffle and disk costs a batch job would incur
  - Streaming reprocessing cannot produce correct results over a year of history, since a stream job loses
    event-time context beyond its retention window and can only approximate the older aggregates
  - Lambda cannot reprocess history at all, so its batch layer offers no advantage here and the year-long
    correction must be run through the streaming path regardless of cost
  answer: 0
  explanation: |
    Kappa's replay-everything approach can be slow/costly for very large historical
    spans and demands long retention; Lambda's batch layer is often more efficient
    for big historical recomputation — a real reason the hybrid persists. Streaming
    reprocessing is correct but not free, and Lambda's batch layer is precisely for
    reprocessing.
  ref: concepts.md#lambda-architecture-versus-kappa-architecture
- id: realtime-streaming-systems-067
  difficulty: expert
  tags:
  - windowing
  - triggers
  - dataflow
  question: |
    In the Dataflow/Beam model, watermarks answer "when in event time," but what
    additional mechanism controls "when in processing time to actually emit
    (possibly multiple, refining) results" for a window?
  options:
  - The state backend, which decides when a window emits by flushing its buffered aggregate to the sink
    the moment the RocksDB memtable fills and spills to disk
  - The Kafka partition count, since each additional partition triggers one more processing-time emission
    of the window as its records are fanned across the extra splits
  - Triggers (with accumulation mode), which can fire early (speculative), on-time (at the watermark),
    and late (on late data), emitting refined results
  - The checkpoint interval, because every completed distributed snapshot forces the open window to emit
    its current partial result into the output at that processing-time instant
  answer: 2
  explanation: |
    Triggers decide the processing-time firing policy — early/on-time/late — and,
    with accumulation mode, let a window emit successive refined results as data
    arrives. The state backend, partition count, and checkpoint interval govern
    storage/parallelism/recovery, not emission timing.
  ref: concepts.md#windowing-tumbling-sliding-session-and-global-windows
- id: realtime-streaming-systems-068
  difficulty: intermediate
  tags:
  - olap
  - batch
  - freshness
  question: |
    Which statement best contrasts a batch data warehouse with a real-time OLAP store
    on ingestion and freshness?
  options:
  - Warehouses ingest continuously from Kafka and serve millisecond-fresh data, while real-time OLAP stores
    load only in scheduled nightly batches and therefore always lag a full day behind ingestion
  - Warehouses typically batch-ingest and serve second-to-minute latency; real-time OLAP stores ingest
    continuously (e.g., from Kafka) and serve seconds-fresh data at low latency
  - Both are identical in freshness, because a warehouse and a real-time OLAP store share the same
    columnar segment format and commit newly ingested rows on exactly the same cadence
  - Real-time OLAP stores cannot ingest from streams at all and must be loaded through periodic bulk file
    imports, leaving continuous stream ingestion solely to the batch warehouse
  answer: 1
  explanation: |
    Warehouses are batch-oriented with higher query latency; real-time OLAP stores
    stream-ingest and serve fresh data with sub-second queries. The first option
    reverses the two, they are not identical, and OLAP stores are built for stream
    ingestion.
  ref: concepts.md#real-time-olap-druid-pinot-and-clickhouse-versus-batch-warehouses
- id: realtime-streaming-systems-069
  difficulty: intermediate
  tags:
  - delivery-semantics
  - at-most-once
  question: |
    Which delivery semantic offers the lowest latency and cost but loses data on
    failure, making it acceptable only for approximate/best-effort telemetry?
  options:
  - Exactly-once
  - At-least-once
  - Transactional two-phase commit
  - At-most-once
  answer: 3
  explanation: |
    At-most-once is fire-and-forget: no retries, so it is cheapest and lowest latency
    but drops data on failure — fine for approximate telemetry. At-least-once retries
    (duplicates), and exactly-once/2PC add machinery and latency for correctness.
  ref: concepts.md#exactly-once-at-least-once-and-at-most-once-semantics-in-streaming
- id: realtime-streaming-systems-070
  difficulty: beginner
  tags:
  - dashboards
  - tradeoff
  question: |
    What is a primary downside of push delivery (WebSocket/SSE) versus stateless
    polling for dashboard updates?
  options:
  - Push always has higher end-to-end latency than polling, because holding a connection open forces each
    update to wait for the next server heartbeat before it can be flushed to the client
  - Push requires stateful long-lived connections, which are harder to load-balance and scale than stateless,
    easily cached polling requests
  - Push cannot deliver genuine real-time updates and only refreshes when the client re-establishes the
    connection, so it behaves like slow polling with extra connection overhead
  - Polling never wastes any requests because a stateless timer fetches only when data has actually changed,
    making it strictly more efficient than a persistent push channel
  answer: 1
  explanation: |
    Push connections are stateful and long-lived, complicating load balancing and
    scaling, whereas polling is stateless and cache-friendly (its downside is wasted
    requests and latency). Push has lower latency, does deliver real-time updates, and
    polling clearly wastes requests.
  ref: concepts.md#real-time-dashboards-and-live-analytics-serving
- id: realtime-streaming-systems-071
  difficulty: intermediate
  tags:
  - fundamentals
  - dag
  - parallelism
  question: |
    How does a stream processing framework achieve parallelism for a stateful keyed
    aggregation?
  options:
  - It partitions the stream by key (keyBy/shuffle) and runs operator instances in parallel, each owning
    a disjoint subset of keys and their state
  - It runs the entire keyed aggregation single-threaded on one operator instance to preserve state
    consistency, relying on faster hardware rather than parallelism to keep up with the stream
  - It replicates the full aggregate state to every operator instance and has them process events
    redundantly, then reconciles the copies so any instance can answer any key
  - It stores all keyed aggregate state inside the Kafka broker itself, letting the broker perform the
    aggregation as records are appended so the operators stay stateless
  answer: 0
  explanation: |
    Keyed streams are partitioned so each parallel operator instance handles a subset
    of keys and holds only that subset's state, enabling scale-out. Single-threaded
    defeats parallelism, replicating all state everywhere is wasteful/incorrect, and
    operator state lives in the state backend, not the broker.
  ref: concepts.md#stream-processing-fundamentals-and-the-streaming-dataflow-model
- id: realtime-streaming-systems-072
  difficulty: advanced
  tags:
  - governing-tradeoff
  - table
  - scenario
  question: |
    Match the requirement to the right optimization: "historical BI reporting over
    years of data, cost-sensitive, freshness not required." Which posture fits?
  options:
  - Optimize latency with a Flink hot path streaming the multi-year aggregates continuously into Redis
    for seconds-fresh reads
  - Optimize latency with processing-time windows that drop late data, accepting undercounting for
    instant multi-year rollups
  - Optimize cost and completeness with batch pipelines into a data warehouse, sacrificing freshness
  - Serve the multi-year report straight from a Redis sorted set, range-scanning rows ranked by a score
    field per query
  answer: 2
  explanation: |
    Historical BI values cheap storage and correctness over freshness, so batch into
    a warehouse is right — you accept staleness. A Flink hot path or drop-late
    processing-time windows optimize the wrong corner (latency) at needless cost, and
    a ZSET is a ranking primitive, not a BI store.
  ref: concepts.md#latency-versus-completeness-versus-cost-the-governing-trade-off
- id: realtime-streaming-systems-073
  difficulty: intermediate
  tags:
  - leaderboards
  - sql-vs-redis
  question: |
    Why does a relational "SELECT ... ORDER BY score LIMIT 10" plus a
    "COUNT(*) WHERE score > mine" for rank fail to scale for a hot leaderboard?
  options:
  - SQL sorts a numeric score column lexically as strings, so ORDER BY score returns players in the wrong
    rank order for a leaderboard
  - The SQL standard has no ORDER BY clause, so a relational engine can never return rows in score order
    without an external application-side sort step
  - Relational tables can only hold text columns, so a numeric score must be stored as a string and cannot
    be compared numerically for ranking
  - The rank count is O(N) per query and heavy concurrent ranking queries overwhelm the database, whereas
    a Redis sorted set answers rank in O(log N)
  answer: 3
  explanation: |
    Computing a rank via COUNT over all higher scores is O(N) and, under high QPS,
    crushes the DB; Redis ZSET rank is O(log N). SQL can sort and store scores and
    supports ORDER BY — the problem is per-query cost at scale, not capability.
  ref: concepts.md#leaderboards-with-redis-sorted-sets
- id: realtime-streaming-systems-074
  difficulty: expert
  tags:
  - live-comments
  - fan-out
  - routing
  question: |
    In a WebSocket gateway fleet fanning out a channel's messages, how are new
    messages routed only to the gateways holding connections for that channel?
  options:
  - Every message is flooded to all gateways in the fleet, and each gateway locally discards the ones for
    channels it holds no connections on after inspecting the payload
  - Gateways relay each message to one another as SMTP mail, using the recipient channel id as the email
    subject so peers can filter their inbox for relevant traffic
  - Clients short-poll a central relational database every few seconds for new messages, so the gateway
    fleet never needs to route anything between its own nodes
  - Gateways subscribe to the relevant channel (via Redis Pub/Sub or a Kafka topic) and a channel-to-server
    registry or consistent hashing routes messages only to gateways with matching subscribers
  answer: 3
  explanation: |
    Gateways subscribe per channel and a registry/consistent-hashing routes each
    message only to gateways with relevant connections, avoiding wasteful global
    broadcast. Broadcasting to all gateways wastes bandwidth, polling adds latency,
    and email is absurd for this hop.
  ref: concepts.md#live-comments-reactions-and-high-fan-out-broadcast-systems
- id: realtime-streaming-systems-075
  difficulty: advanced
  tags:
  - event-time
  - ingestion-time
  - tradeoff
  question: |
    When is ingestion time a reasonable compromise between event time and processing
    time?
  options:
  - When you want more stability than processing time (timestamp fixed at the source, unaffected by downstream
