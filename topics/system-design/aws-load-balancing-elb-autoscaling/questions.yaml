topic: "Load Balancing and Auto Scaling: ALB, NLB, GWLB and ASG"
domain: system-design
topic_slug: aws-load-balancing-elb-autoscaling
version: 1
questions:
  - id: aws-load-balancing-elb-autoscaling-001
    difficulty: beginner
    tags: [alb, nlb, osi-layer, fundamentals]
    question: |
      At which OSI layers do an Application Load Balancer (ALB) and a Network Load
      Balancer (NLB) operate, respectively?
    options:
      - "ALB at Layer 4 (transport); NLB at Layer 7 (application)"
      - "ALB at Layer 7 (application); NLB at Layer 4 (transport)"
      - "Both operate at Layer 3 (network), routing purely on IP headers without ports"
      - "ALB at Layer 7; NLB at Layer 7 with lower latency"
    answer: 1
    explanation: |
      ALB is an L7 (application/HTTP) load balancer; NLB is an L4 (TCP/UDP) load
      balancer. Option 0 reverses them. Both are not L3 (that is closer to GWLB's
      gateway role). NLB is L4, not L7 — that L4 nature is exactly why it is faster
      and can preserve source IP.
    ref: "concepts.md#elb-family-overview-and-choosing-the-right-load-balancer"

  - id: aws-load-balancing-elb-autoscaling-002
    difficulty: beginner
    tags: [alb, content-routing, l7]
    question: |
      Which capability is unique to an Application Load Balancer (and NOT possible on
      a Network Load Balancer)?
    options:
      - "Routing requests based on URL path and host header"
      - "Distributing TCP connections across targets"
      - "Health checking registered targets to route around ones that have failed"
      - "Spreading traffic across multiple Availability Zones"
    answer: 0
    explanation: |
      Content-based routing (path/host/header/method/query) requires parsing HTTP,
      which only the L7 ALB does. Distributing TCP connections, health checks, and
      multi-AZ distribution are all common to NLB as well, so they are not unique.
    ref: "concepts.md#application-load-balancer-l7-deep-dive"

  - id: aws-load-balancing-elb-autoscaling-003
    difficulty: beginner
    tags: [nlb, static-ip, source-ip]
    question: |
      A partner will only connect to services on a fixed, allowlistable IP address,
      and needs your backend to see the client's real source IP. Which load balancer
      natively supports both a static/Elastic IP and source IP preservation?
    options:
      - "Application Load Balancer"
      - "Classic Load Balancer in HTTP mode"
      - "Network Load Balancer"
      - "Gateway Load Balancer"
    answer: 2
    explanation: |
      NLB provides a static IP per AZ (and optionally an Elastic IP) and preserves the
      client source IP to targets. ALB has only a DNS name (no static IP) and hides
      source IP behind X-Forwarded-For. CLB is legacy and lacks static IPs. GWLB is for
      transparent appliance insertion, not general client-facing service exposure.
    ref: "concepts.md#network-load-balancer-l4-deep-dive"

  - id: aws-load-balancing-elb-autoscaling-004
    difficulty: beginner
    tags: [gwlb, appliances, geneve]
    question: |
      What is the primary purpose of a Gateway Load Balancer (GWLB)?
    options:
      - "Terminate TLS and route HTTP microservice requests by path, header, and method at L7"
      - "Cache static content at edge locations worldwide to cut latency and offload the origin"
      - "Provide URL path-based and host-based routing to steer container traffic to target groups"
      - "Transparently insert and scale a fleet of third-party virtual security appliances in the traffic path"
    answer: 3
    explanation: |
      GWLB transparently inserts virtual appliances (firewalls, IDS/IPS, DPI) inline,
      scaling and health-checking them, using GENEVE encapsulation. TLS termination and
      path routing are ALB features; edge caching is CloudFront. GWLB is a specialized
      L3 gateway, not a general app LB.
    ref: "concepts.md#gateway-load-balancer-l3-and-appliance-insertion"

  - id: aws-load-balancing-elb-autoscaling-005
    difficulty: beginner
    tags: [classic-lb, legacy, migration]
    question: |
      For a brand-new HTTP microservices application, why should you NOT choose a
      Classic Load Balancer (CLB)?
    options:
      - "CLB cannot perform any health checks against its registered backend instances"
      - "CLB is legacy and lacks content-based routing, target groups, and modern integrations available on ALB"
      - "CLB is more expensive than ALB in every scenario because it bills a flat per-request premium"
      - "CLB does not support HTTPS or TLS termination for encrypted client connections"
    answer: 1
    explanation: |
      CLB is the legacy ELB v1: no path/host rules, no target groups, no Lambda/IP
      targets, limited integrations. New HTTP work belongs on ALB. CLB does do health
      checks and supports HTTPS, so those statements are false, and cost is not the
      defining reason.
    ref: "concepts.md#classic-load-balancer-legacy-and-migration"

  - id: aws-load-balancing-elb-autoscaling-006
    difficulty: beginner
    tags: [asg, self-healing, desired-capacity]
    question: |
      An Auto Scaling group is configured with min=2, desired=4, max=10. One instance
      fails its health check. What does the ASG do?
    options:
      - "Nothing, because the group is still above the configured minimum of two instances"
      - "Permanently reduce desired capacity to 3 so it matches the current healthy count"
      - "Scale out all the way to max=10 as a precaution against further failures"
      - "Terminate the unhealthy instance and launch a replacement to return to desired=4"
    answer: 3
    explanation: |
      An ASG maintains the desired count; it terminates the unhealthy instance and
      launches a replacement (self-healing). It does not lower desired to match, nor
      does a single failure trigger scaling to max; being above min does not stop
      replacement of an unhealthy instance.
    ref: "concepts.md#auto-scaling-groups-fundamentals"

  - id: aws-load-balancing-elb-autoscaling-007
    difficulty: beginner
    tags: [health-check, routing]
    question: |
      What does an Elastic Load Balancer do with a target that is failing its health
      checks?
    options:
      - "Stops routing new requests to it and routes only to healthy targets"
      - "Sends it a reduced share of traffic as a warning until the check recovers"
      - "Immediately terminates the underlying EC2 instance and launches a replacement"
      - "Continues routing to it but logs an error entry to the access log for later review"
    answer: 0
    explanation: |
      The LB routes only to healthy targets, so it stops sending new requests to a
      target that fails health checks. It does not terminate instances (that is the
      ASG's job, using ELB health checks), nor does it send a "reduced share" as a
      warning.
    ref: "concepts.md#health-checks-connection-draining-and-deregistration-delay"

  - id: aws-load-balancing-elb-autoscaling-008
    difficulty: beginner
    tags: [target-group, listener, alb-model]
    question: |
      In the ALB object model, what is the correct top-down relationship?
    options:
      - "Target group → Listener → Rule → Target"
      - "Rule → Listener → Target → Target group"
      - "Listener → Rule → Target group → Target"
      - "Target → Target group → Rule → Listener"
    answer: 2
    explanation: |
      A listener (protocol+port) contains rules (conditions+actions) that forward to a
      target group, which contains targets. The other orderings scramble this hierarchy.
    ref: "concepts.md#application-load-balancer-l7-deep-dive"

  - id: aws-load-balancing-elb-autoscaling-009
    difficulty: beginner
    tags: [multi-az, availability]
    question: |
      Why do you enable multiple Availability Zones on a load balancer and keep
      healthy targets in each?
    options:
      - "To reduce the per-hour price of the load balancer through a multi-AZ volume discount"
      - "So that if one AZ's targets fail, the LB continues serving from other AZs"
      - "Because a load balancer cannot be provisioned or function within a single Availability Zone"
      - "To enable content-based routing on URL path and host header at Layer 7"
    answer: 1
    explanation: |
      Multi-AZ gives fault tolerance: if an AZ's targets go unhealthy, ELB removes that
      AZ's node from DNS and serves from remaining AZs. It does not lower price, single-
      AZ LBs can run (just less resilient), and it is unrelated to content routing.
    ref: "concepts.md#cross-zone-load-balancing-and-multi-az-distribution"

  - id: aws-load-balancing-elb-autoscaling-010
    difficulty: beginner
    tags: [target-types, lambda]
    question: |
      Which target type is supported by an Application Load Balancer but NOT by a
      Network Load Balancer?
    options:
      - "lambda"
      - "instance"
      - "ip"
      - "There is no difference in supported target types"
    answer: 0
    explanation: |
      Only ALB supports `lambda` targets (invoke a function per request). Both support
      `instance` and `ip`; NLB additionally supports an `alb` target type. So there is a
      difference, ruling out the last option.
    ref: "concepts.md#target-groups-target-types-and-registration"

  - id: aws-load-balancing-elb-autoscaling-011
    difficulty: beginner
    tags: [scaling-policy, target-tracking]
    question: |
      Which Auto Scaling policy type works like a thermostat — you set a target value
      for a metric and AWS adds/removes capacity to keep it there?
    options:
      - "Simple scaling"
      - "Step scaling"
      - "Scheduled scaling"
      - "Target tracking scaling"
    answer: 3
    explanation: |
      Target tracking keeps a metric (e.g. average CPU or RequestCountPerTarget) at a
      target value, managing the alarms for you. Simple and step scaling react to alarm
      breaches you define; scheduled scaling changes capacity at set times, not by
      tracking a metric.
    ref: "concepts.md#scaling-policies-target-tracking-step-simple-scheduled-predictive"

  - id: aws-load-balancing-elb-autoscaling-012
    difficulty: beginner
    tags: [cloudfront, cdn]
    question: |
      What is the main reason to place CloudFront in front of an ALB for a globally
      accessed web application?
    options:
      - "To give the ALB a static, allowlistable IP address that partners can pin to"
      - "To convert inbound HTTP traffic into raw TCP streams before it reaches the ALB"
      - "To cache content at edge locations and reduce latency and origin load for global users"
      - "To replace the need for an Auto Scaling group by absorbing traffic spikes at the edge"
    answer: 2
    explanation: |
      CloudFront caches at the edge, cutting global latency and offloading the origin
      (plus edge TLS/WAF/Shield). It does not give the ALB a static IP (that is NLB or
      Global Accelerator), does not "convert HTTP to TCP," and does not replace an ASG.
    ref: "concepts.md#cloudfront-with-alb-and-layering-cdn-plus-load-balancing"

  - id: aws-load-balancing-elb-autoscaling-013
    difficulty: beginner
    tags: [sticky-sessions, affinity]
    question: |
      What do sticky sessions (session affinity) on an ALB accomplish?
    options:
      - "They encrypt the session cookie end to end using the target group's TLS key"
      - "They pin a client to the same target so server-side session state is found on subsequent requests"
      - "They compress HTTP responses to reduce bandwidth and speed up client page loads"
      - "They guarantee perfectly even load distribution by rebalancing sessions each request"
    answer: 1
    explanation: |
      Stickiness routes a given client back to the same target so in-memory session
      state is available. It does not encrypt cookies, does not compress responses, and
      actually harms even distribution (hot clients stick to one target).
    ref: "concepts.md#sticky-sessions-and-session-affinity"

  - id: aws-load-balancing-elb-autoscaling-014
    difficulty: beginner
    tags: [nlb, protocols, l4]
    question: |
      Which set of protocols can a Network Load Balancer listener use?
    options:
      - "TCP, UDP, TCP_UDP, and TLS"
      - "HTTP and HTTPS only, since it terminates and parses every application request"
      - "gRPC and WebSocket only, using HTTP/2 upgrade negotiation at the listener"
      - "GENEVE over UDP 6081, the same encapsulation used to reach inline appliances"
    answer: 0
    explanation: |
      NLB is L4 and supports TCP, UDP, TCP_UDP, and TLS (plus newer QUIC variants).
      HTTP/HTTPS/gRPC/WebSocket are ALB (L7) concerns. GENEVE over UDP 6081 is the GWLB
      encapsulation protocol.
    ref: "concepts.md#network-load-balancer-l4-deep-dive"

  - id: aws-load-balancing-elb-autoscaling-015
    difficulty: intermediate
    tags: [deregistration-delay, draining, defaults]
    question: |
      What is the default deregistration delay (connection draining) for an ALB/NLB
      target group, and what does it do?
    options:
      - "0 seconds; the target is removed instantly, cutting in-flight requests"
      - "60 seconds; it waits before starting health checks"
      - "300 seconds; the LB stops new requests but lets in-flight requests finish before fully deregistering"
      - "3600 seconds; it is the maximum time an instance can stay in service"
    answer: 2
    explanation: |
      The default is 300 s (range 0–3600). During draining the LB sends no new requests
      but lets in-flight requests complete. 0 would cut connections immediately (not the
      default); 60 s is the ALB idle-timeout default, not deregistration; 3600 is the
      max of the range, not the default.
    ref: "concepts.md#health-checks-connection-draining-and-deregistration-delay"

  - id: aws-load-balancing-elb-autoscaling-016
    difficulty: intermediate
    tags: [cross-zone, alb, nlb, defaults, cost]
    question: |
      Which statement about cross-zone load balancing defaults is correct?
    options:
      - "It is off by default on ALB and on by default on NLB, the reverse of the CLB behavior"
      - "It is on and free on ALB, but off by default on NLB where enabling it incurs inter-AZ data transfer charges"
      - "It is always free and always on for both ALB and NLB, with no inter-AZ charges ever applied"
      - "It must be manually enabled on ALB and is never available on NLB under any configuration"
    answer: 1
    explanation: |
      ALB has cross-zone always on and free; NLB (and CLB) default to off, and enabling
      it adds inter-AZ data transfer cost. Option 0 reverses the defaults; option 2
      ignores NLB's paid/off behavior; option 3 is simply wrong (NLB does support it).
    ref: "concepts.md#cross-zone-load-balancing-and-multi-az-distribution"

  - id: aws-load-balancing-elb-autoscaling-017
    difficulty: intermediate
    tags: [warm-pools, scale-out, boot-time]
    question: |
      An application takes 4 minutes to boot and warm its cache, but traffic can double
      in 90 seconds. Users see errors during spikes even though the ASG scales out.
      Which mechanism most directly reduces the time-to-serve for new capacity?
    options:
      - "Increase the deregistration delay to 3600 s so draining instances stay available longer"
      - "Switch the load balancer from ALB to NLB to cut per-request connection setup overhead"
      - "Enable sticky sessions so returning users reuse already-warmed instances on repeat visits"
      - "Use a warm pool of pre-initialized (stopped/hibernated) instances the ASG pulls from on scale-out"
    answer: 3
    explanation: |
      Warm pools keep pre-booted, app-warmed instances ready so scale-out is seconds
      instead of minutes. Deregistration delay affects scale-in draining, not scale-out
      speed. Changing LB type or enabling stickiness does nothing for boot lag.
    ref: "concepts.md#cooldowns-warm-pools-and-lifecycle-hooks"

  - id: aws-load-balancing-elb-autoscaling-018
    difficulty: intermediate
    tags: [scaling-metric, queue, sqs]
    question: |
      You run a fleet of workers consuming an SQS queue. Latency (time-in-queue)
      matters, but CPU stays low because work is I/O-bound. What is the best metric to
      drive Auto Scaling?
    options:
      - "Average CPU utilization across the worker fleet, tracked at a 50% setpoint"
      - "Backlog per instance (queue depth divided by number of running consumers)"
      - "Network packets in per second aggregated over all the consumer instances"
      - "The load balancer's RequestCountPerTarget metric from the fronting ALB target group"
    answer: 1
    explanation: |
      For queue consumers, scale on backlog per instance so you add workers when the
      queue grows relative to capacity. CPU is a poor proxy for I/O-bound work; network
      packets do not reflect queue latency; RequestCountPerTarget applies to LB-fronted
      request tiers, not SQS consumers (there is no ELB in front of a queue).
    ref: "concepts.md#choosing-scaling-metrics-and-capacity-planning"

  - id: aws-load-balancing-elb-autoscaling-019
    difficulty: intermediate
    tags: [nlb-to-alb, static-ip, l7]
    question: |
      You need L7 path-based routing (an ALB feature) but a partner requires a fixed,
      allowlistable IP address. Which architecture satisfies both with the least custom
      code?
    options:
      - "Put a Classic Load Balancer in front of the ALB to lend it a fixed IP"
      - "Directly attach an Elastic IP to the ALB in its listener configuration"
      - "Enable sticky sessions so every client is pinned to one fixed backend IP"
      - "Chain an NLB in front of the ALB, registering the ALB as the NLB's target"
    answer: 3
    explanation: |
      NLB supports an `alb` target type, so NLB (static/Elastic IP) → ALB (L7 routing)
      gives you both. You cannot assign an Elastic IP to an ALB. A CLB in front adds no
      static IP and is legacy. Sticky sessions have nothing to do with fixed IPs.
    ref: "concepts.md#network-load-balancer-l4-deep-dive"

  - id: aws-load-balancing-elb-autoscaling-020
    difficulty: intermediate
    tags: [lifecycle-hooks, terminate, draining]
    question: |
      You need to flush logs and gracefully deregister an instance from an external
      service registry before the ASG terminates it. Which feature lets you run that
      action while the instance is paused in a terminating state?
    options:
      - "Lifecycle hook (Terminating:Wait)"
      - "Scale-in cooldown period timer"
      - "Health check grace period"
      - "Slow start traffic ramp-up"
    answer: 0
    explanation: |
      A lifecycle hook pauses the instance in Terminating:Wait (or Pending:Wait on
      launch) until you complete the action or the heartbeat times out. Cooldown pauses
      scaling, not the instance; grace period delays health checks after launch; slow
      start ramps traffic to newly healthy targets.
    ref: "concepts.md#cooldowns-warm-pools-and-lifecycle-hooks"

  - id: aws-load-balancing-elb-autoscaling-021
    difficulty: intermediate
    tags: [alb-idle-timeout, websocket, streaming]
    question: |
      An ALB is fronting a long-poll endpoint and clients occasionally get their
      connections dropped after about a minute of silence. What is the most likely cause
      and fix?
    options:
      - "The target deregistration delay is set too short; raise it to hold the idle connection open"
      - "Cross-zone load balancing is turned off; enable it so idle connections are kept alive across zones"
      - "The ALB idle timeout (default 60 s) is closing idle connections; raise it or send keepalive data"
      - "The health check interval is set too long; shorten it so stale connections are pruned sooner"
    answer: 2
    explanation: |
      ALB's default idle timeout is 60 s; if no data flows within that window the
      connection is closed. Raise the idle timeout or have the app send periodic data.
      Deregistration delay affects draining, cross-zone affects distribution, and health
      check interval affects failure detection — none closes idle client connections.
    ref: "concepts.md#application-load-balancer-l7-deep-dive"

  - id: aws-load-balancing-elb-autoscaling-022
    difficulty: intermediate
    tags: [nlb, flow-hash, tcp, connection]
    question: |
      For TCP traffic, how does an NLB decide which target handles a given connection?
    options:
      - "It parses the HTTP host header and matches a listener routing rule to select the destination target group"
      - "It uses a flow hash over the connection tuple (protocol, source/dest IP and port, TCP sequence) and pins the connection to one target for its life"
      - "It round-robins each individual TCP packet across all healthy targets, reassembling the stream on the winning node"
      - "It always sends the connection to whichever target currently reports the fewest active in-flight HTTP requests"
    answer: 1
    explanation: |
      NLB uses a flow hash so each TCP connection sticks to one target for its lifetime.
      It does not parse HTTP (that is L7/ALB), does not round-robin per packet (that
      would break connections), and least-outstanding-requests is an ALB algorithm.
    ref: "concepts.md#network-load-balancer-l4-deep-dive"

  - id: aws-load-balancing-elb-autoscaling-023
    difficulty: intermediate
    tags: [predictive-scaling, cyclical]
    question: |
      Your traffic follows a strong daily cycle (predictable morning ramp), and instance
      boot time is significant. Which scaling approach best eliminates the boot-lag for
      that recurring pattern?
    options:
      - "Predictive scaling that forecasts load from history and provisions capacity ahead of the expected spike"
      - "Simple scaling with a long cooldown that reacts once the morning CPU alarm finally breaches"
      - "Target tracking on CPU alone, letting the metric climb before any new capacity is added"
      - "Manually setting the desired capacity once and leaving it fixed through the daily cycle"
    answer: 0
    explanation: |
      Predictive scaling uses historical data (needs ~24 h+, forecasts up to 48 h) to
      pre-provision before recurring spikes, removing reactive boot-lag. Simple scaling
      and pure target tracking are reactive (scale after the metric moves); a static
      desired capacity cannot follow a cycle.
    ref: "concepts.md#scaling-policies-target-tracking-step-simple-scheduled-predictive"

  - id: aws-load-balancing-elb-autoscaling-024
    difficulty: intermediate
    tags: [ecs, awsvpc, ip-targets]
    question: |
      An ECS service using awsvpc networking registers its tasks with an ALB. As which
      target type do the tasks register?
    options:
      - "instance targets, registered by the EC2 instance ID of the host running the task"
      - "lambda targets, since ECS invokes each task through a per-request function shim"
      - "alb targets, chaining the ECS service behind a nested application load balancer"
      - "ip targets, because each task gets its own ENI/IP"
    answer: 3
    explanation: |
      With awsvpc networking each task has its own ENI and IP, so it registers as an
      `ip` target. Instance-ID registration is for bridge/host networking on EC2
      launch type without per-task ENIs; lambda/alb target types do not apply to ECS
      tasks.
    ref: "concepts.md#integration-with-ecs-and-eks"

  - id: aws-load-balancing-elb-autoscaling-025
    difficulty: intermediate
    tags: [health-check-depth, fail-closed, blast-radius]
    question: |
      A database dependency briefly goes down. Suddenly ALL of your app targets report
      unhealthy and the site is fully offline even though the app processes could still
      serve cached content. What likely went wrong?
    options:
      - "The deregistration delay was set too high, so failed targets lingered and dragged the whole fleet down"
      - "Cross-zone load balancing was disabled, forcing every request onto the one zone that lost its database"
      - "The health check was 'deep' — it pinged the database, so a dependency outage marked every target unhealthy simultaneously"
      - "Sticky sessions pinned every active user onto the single target that happened to fail first"
    answer: 2
    explanation: |
      A deep health check that validates downstream dependencies turns a dependency blip
      into a total outage because every target fails at once. A shallow /healthz avoids
      this. Deregistration delay, cross-zone, and stickiness do not cause fleet-wide
      simultaneous unhealthiness from a dependency failure.
    ref: "concepts.md#failure-modes-and-how-the-design-degrades"

  - id: aws-load-balancing-elb-autoscaling-026
    difficulty: intermediate
    tags: [slow-start, cold-cache, alb]
    question: |
      ALB slow start is configured at 120 seconds on a target group. What does it do?
    options:
      - "Suppresses all target health checks for the first 120 s after an instance finishes launching"
      - "Linearly ramps traffic to a newly healthy target over 120 s instead of sending it full share immediately"
      - "Waits a full 120 s before it begins deregistering and draining a target being removed"
      - "Pauses the entire Auto Scaling group for 120 s between two consecutive scaling actions"
    answer: 1
    explanation: |
      Slow start (30–900 s, default 0/off) gradually increases the share sent to a newly
      healthy target, protecting cold caches/JIT-warming apps. It is not a health-check
      delay (that is the grace period), not draining (deregistration delay), and not a
      scaling pause (cooldown).
    ref: "concepts.md#health-checks-connection-draining-and-deregistration-delay"

  - id: aws-load-balancing-elb-autoscaling-027
    difficulty: intermediate
    tags: [stateless, session-store, alternative]
    question: |
      What is the preferred alternative to sticky sessions that keeps the load balancer
      free to distribute evenly and preserves sessions across target failures?
    options:
      - "Store session state in a shared store (e.g. Redis/ElastiCache or DynamoDB) or use stateless JWTs"
      - "Increase the stickiness cookie duration to 7 days so a client rarely has to switch targets"
      - "Enable cross-zone load balancing so sessions are mirrored evenly across every Availability Zone"
      - "Use least-outstanding-requests routing to send each client to its least-busy prior target"
    answer: 0
    explanation: |
      Externalizing session state (shared cache/DB) or using stateless tokens lets any
      target serve any request, so the LB balances freely and a target loss does not lose
      sessions. Longer cookie duration worsens the sticky-session drawbacks; cross-zone
      and LOR routing address distribution, not session state.
    ref: "concepts.md#sticky-sessions-and-session-affinity"

  - id: aws-load-balancing-elb-autoscaling-028
    difficulty: intermediate
    tags: [gwlb, geneve, endpoint]
    question: |
      How is traffic steered into a Gateway Load Balancer, and how are the original
      packets sent to the appliances?
    options:
      - "Via a Route 53 alias record pointing at the appliance fleet; the original packets are forwarded to it as plain unencrypted HTTP"
      - "Via an ALB listener rule that matches the flow; the packets are TLS-terminated and re-encrypted before reaching each appliance"
      - "Via a Gateway Load Balancer Endpoint referenced in route tables; packets are encapsulated with GENEVE (UDP 6081) and sent unmodified to the appliances"
      - "Via a NAT gateway placed in the inspection path; every packet is source-NATed to the appliance's private address before delivery"
    answer: 2
    explanation: |
      A Gateway Load Balancer Endpoint (a PrivateLink-type endpoint) in route tables
      steers traffic to GWLB, which encapsulates original packets with GENEVE on UDP
      6081 so appliances see them intact. It is not Route 53/HTTP, not an ALB listener,
      and not a NAT gateway mechanism.
    ref: "concepts.md#gateway-load-balancer-l3-and-appliance-insertion"

  - id: aws-load-balancing-elb-autoscaling-029
    difficulty: intermediate
    tags: [asg, health-check-type, elb-vs-ec2]
    question: |
      An app process hangs (accepts TCP but returns HTTP 500s) while the EC2 instance
      itself stays "running." With the default EC2-only health check type, what happens,
      and what should you change?
    options:
      - "The ASG detects the HTTP 500s and replaces the instance automatically; no configuration change is needed"
      - "The ALB observes the failing responses and terminates the underlying EC2 instance directly on its own"
      - "Nothing in AWS can detect this class of app-level failure, so it must be caught by external monitoring"
      - "The ASG does NOT replace it because EC2 status checks pass; switch the ASG health check type to ELB so app-level failures trigger replacement"
    answer: 3
    explanation: |
      EC2 status checks only verify the instance/hypervisor, so a hung app passes them.
      Setting the ASG health check type to ELB makes the ELB's HTTP health check drive
      replacement. The ALB itself never terminates instances (it just stops routing), and
      the failure is absolutely detectable via ELB health checks.
    ref: "concepts.md#auto-scaling-groups-fundamentals"

  - id: aws-load-balancing-elb-autoscaling-030
    difficulty: intermediate
    tags: [routing-algorithm, least-outstanding, alb]
    question: |
      Your ALB targets handle requests of highly variable cost (some take 10 ms, some
      take 5 s), causing uneven load with round robin. Which target-group routing
      algorithm best smooths this?
    options:
      - "round_robin"
      - "least_outstanding_requests"
      - "source-IP flow hash"
      - "weighted_random with no anomaly mitigation"
    answer: 1
    explanation: |
      least_outstanding_requests sends new requests to the target with the fewest
      in-flight requests, naturally shedding load away from targets stuck on slow
      requests. Round robin ignores per-target load; flow hash is an NLB concept;
      weighted_random distributes by weight, not by current outstanding load.
    ref: "concepts.md#application-load-balancer-l7-deep-dive"

  - id: aws-load-balancing-elb-autoscaling-031
    difficulty: intermediate
    tags: [nlb, source-ip, security-group]
    question: |
      After switching from an ALB to an NLB with instance targets, traffic to your app
      is suddenly blocked at the instances. What NLB behavior most likely caused this?
    options:
      - "NLB does not support target health checks at all, so unhealthy instances silently keep dropping the traffic"
      - "NLB mandates HTTP-only health checks, and because the app implements none, every target is marked failed and removed"
      - "NLB automatically disables cross-zone load balancing, so all client connections pile onto a single empty zone"
      - "NLB preserves the client's source IP, so target security groups that only allow the load balancer's IPs now block the real client CIDRs"
    answer: 3
    explanation: |
      NLB preserves source IP to targets, so the instances see real client IPs — if the
      security groups only permitted the LB's addresses, legitimate client traffic is now
      denied. NLB does support health checks; HTTP health checks are optional; cross-zone
      default does not block traffic.
    ref: "concepts.md#network-load-balancer-l4-deep-dive"

  - id: aws-load-balancing-elb-autoscaling-032
    difficulty: intermediate
    tags: [scheduled-scaling, known-pattern]
    question: |
      An internal reporting system is heavily used only during business hours (9am–6pm)
      and idle otherwise. Which scaling approach is the simplest, most cost-effective fit?
    options:
      - "Scheduled scaling to raise capacity before 9am and lower it after 6pm"
      - "Predictive scaling trained on months of historical traffic to forecast the daily window"
      - "Step scaling on CPU with many finely graduated steps to track the workday ramp"
      - "A large static desired capacity left running around the clock, every day of the week"
    answer: 0
    explanation: |
      A deterministic, calendar-driven load is the textbook case for scheduled scaling:
      set capacity by time. Predictive scaling is overkill for a fixed known schedule; a
      24/7 static fleet wastes money at night; step scaling reacts to load but does not
      pre-empt the known start time as cleanly.
    ref: "concepts.md#scaling-policies-target-tracking-step-simple-scheduled-predictive"

  - id: aws-load-balancing-elb-autoscaling-033
    difficulty: intermediate
    tags: [request-count-per-target, metric]
    question: |
      For a stateless HTTP API tier behind an ALB, which CloudWatch metric is generally
      the best target-tracking signal for scaling?
    options:
      - "ASGAverageCPUUtilization only, always"
      - "NetworkOut bytes"
      - "ALBRequestCountPerTarget"
      - "Number of unhealthy hosts"
    answer: 2
    explanation: |
      RequestCountPerTarget directly tracks load per instance for a request-driven tier,
      responding to demand regardless of whether the bottleneck is CPU, memory, or I/O.
      CPU is only a good proxy for CPU-bound work; NetworkOut is indirect; unhealthy host
      count is a health signal, not a scaling target.
    ref: "concepts.md#choosing-scaling-metrics-and-capacity-planning"

  - id: aws-load-balancing-elb-autoscaling-034
    difficulty: intermediate
    tags: [eks, load-balancer-controller, ip-mode]
    question: |
      In EKS with the AWS Load Balancer Controller, what advantage does 'ip' target mode
      have over 'instance' (NodePort) mode?
    options:
      - "It eliminates the need for any load balancer at all, letting pods receive traffic straight from clients"
      - "It routes the LB directly to pod IPs, avoiding an extra node/kube-proxy hop for lower latency and accurate per-pod health"
      - "It consumes far fewer VPC IP addresses because many pods share a single node-level target address"
      - "It is the only target mode supported when the cluster fronts its services with Classic Load Balancers"
    answer: 1
    explanation: |
      ip mode targets pod IPs directly, cutting the NodePort/kube-proxy hop for lower
      latency and precise per-pod health checks. It does not remove the LB, it uses MORE
      VPC IPs (one per pod), and it works with ALB/NLB (not CLB).
    ref: "concepts.md#integration-with-ecs-and-eks"

  - id: aws-load-balancing-elb-autoscaling-035
    difficulty: intermediate
    tags: [cooldown, defaults, thrashing]
    question: |
      What is the default cooldown period for simple scaling, and what problem does it
      address?
    options:
      - "300 s; it prevents scaling thrash by pausing further simple-scaling actions while new instances warm up"
      - "60 s; it delays the very first target health check until a newly launched instance has booted"
      - "3600 s; it is the maximum lifecycle-hook heartbeat timeout an instance may wait before proceeding"
      - "0 s; cooldowns are turned off by default and must be explicitly enabled on the scaling policy"
    answer: 0
    explanation: |
      Simple scaling's default cooldown is 300 s, preventing rapid repeated actions
      before new capacity takes effect. 60 s is unrelated, 3600 s is the lifecycle hook
      heartbeat default, and cooldowns are not 0/disabled by default. (Target/step
      scaling use instance warm-up instead to avoid under-provisioning.)
    ref: "concepts.md#cooldowns-warm-pools-and-lifecycle-hooks"

  - id: aws-load-balancing-elb-autoscaling-036
    difficulty: intermediate
    tags: [global-accelerator, cloudfront, choice]
    question: |
      You need static anycast IP addresses and network-path acceleration for a
      latency-sensitive, non-cacheable TCP/UDP workload fronted by an NLB. Which AWS
      front door fits better than CloudFront?
    options:
      - "Amazon CloudFront with a caching policy of TTL=0"
      - "Route 53 weighted routing"
      - "An additional ALB"
      - "AWS Global Accelerator"
    answer: 3
    explanation: |
      Global Accelerator provides static anycast IPs and TCP/UDP acceleration over the
      AWS backbone — ideal for non-cacheable, latency-sensitive traffic to an NLB.
      CloudFront is for cacheable HTTP content (TTL=0 defeats its purpose). Route 53 does
      DNS routing, not network-path acceleration; another ALB adds no anycast IP.
    ref: "concepts.md#cloudfront-with-alb-and-layering-cdn-plus-load-balancing"

  - id: aws-load-balancing-elb-autoscaling-037
    difficulty: intermediate
    tags: [target-group-attributes, stickiness-duration]
    question: |
      What is the maximum stickiness cookie duration configurable on an ALB target group?
    options:
      - "1 hour (3600 seconds), the hard ceiling"
      - "1 day (86400 seconds), the fixed maximum"
      - "7 days (604800 seconds)"
      - "30 days (2592000 seconds), the upper bound"
    answer: 2
    explanation: |
      Both lb_cookie and app_cookie stickiness durations range from 1 s to 7 days
      (604800 s), defaulting to 1 day (86400 s). 1 hour and 1 day are within range but
      not the max; 30 days exceeds the limit.
    ref: "concepts.md#sticky-sessions-and-session-affinity"

  - id: aws-load-balancing-elb-autoscaling-038
    difficulty: intermediate
    tags: [asg, grace-period, defaults]
    question: |
      A slow-booting application is being killed by the ASG shortly after launch before
      it finishes starting. Which setting most directly addresses this?
    options:
      - "Reduce the deregistration delay so the slow instance drains and is replaced before booting completes"
      - "Increase the health check grace period so health checks are ignored until the app is up"
      - "Disable cross-zone load balancing so the booting instance is shielded from other zones' health probes"
      - "Increase the max size of the ASG so a spare replacement absorbs traffic while the app finishes starting"
    answer: 1
    explanation: |
      The health check grace period (default 300 s) delays counting health checks after
      launch, giving slow apps time to boot before the ASG considers them unhealthy.
      Deregistration delay is about draining, cross-zone about distribution, and max size
      does not stop premature termination.
    ref: "concepts.md#auto-scaling-groups-fundamentals"

  - id: aws-load-balancing-elb-autoscaling-039
    difficulty: intermediate
    tags: [alb, waf, security]
    question: |
      You must apply L7 web application firewall rules (SQLi/XSS protection, rate rules)
      directly to your load balancer. Which load balancer supports native AWS WAF
      integration?
    options:
      - "Application Load Balancer"
      - "Network Load Balancer"
      - "Gateway Load Balancer"
      - "Any of them equally"
    answer: 0
    explanation: |
      AWS WAF inspects L7/HTTP and integrates with ALB (and CloudFront/API Gateway). NLB
      is L4 and has no native WAF; GWLB is for appliance insertion, not WAF rules. So it
      is not "any of them equally."
    ref: "concepts.md#application-load-balancer-l7-deep-dive"

  - id: aws-load-balancing-elb-autoscaling-040
    difficulty: intermediate
    tags: [capacity-planning, n-plus-one, multi-az]
    question: |
      You run behind 3 AZs and must survive the loss of any one AZ with no capacity
      shortfall. Roughly how should you size each AZ relative to its steady-state share?
    options:
      - "Exactly its 1/3 share, relying on AWS to auto-heal the lost AZ within seconds"
      - "0.5x its share to save cost, letting cross-zone balancing backfill any gap for free"
      - "About 1.5x its share, so the remaining two AZs can absorb the failed AZ's load"
      - "10x its share for safety, guaranteeing headroom for a simultaneous two-AZ outage"
    answer: 2
    explanation: |
      With 3 AZs, losing one removes ~33% of capacity; the surviving two must carry 100%,
      so each needs ~1.5x its normal share (2 x 1.5 = 3 units of capacity for 3 units of
      load, but designed as 3 x 1.5 provisioned = 4.5 to cover a lost 1.5). Sizing exactly
      1/3 leaves a shortfall on AZ loss; 0.5x guarantees an outage; 10x is wasteful.
    ref: "concepts.md#choosing-scaling-metrics-and-capacity-planning"

  - id: aws-load-balancing-elb-autoscaling-041
    difficulty: advanced
    tags: [cross-zone-off, distribution, skew]
    question: |
      An NLB spans AZ-A (2 targets) and AZ-B (8 targets) with cross-zone load balancing
      OFF. DNS distributes client connections roughly evenly across the two AZ nodes.
      Approximately what share of total traffic does each individual target in AZ-A
      receive versus each in AZ-B?
    options:
      - "Every target gets 10% each, because the LB normalizes per-target share across both zones"
      - "AZ-A targets get ~6.25% each; AZ-B targets get ~25% each, since load follows target count directly"
      - "AZ-B targets get all traffic because DNS steers connections to the zone with more capacity"
      - "AZ-A targets get ~25% each; AZ-B targets get ~6.25% each — a 4x imbalance"
    answer: 3
    explanation: |
      With cross-zone off, each AZ node gets ~50% of traffic and splits it among its own
      targets: AZ-A's 2 targets get 50%/2 = 25% each, AZ-B's 8 get 50%/8 = 6.25% each — a
      4x overload on AZ-A. The fix is symmetric AZ counts or enabling cross-zone (paying
      inter-AZ transfer). Perfect evenness only happens with balanced AZs or cross-zone on.
    ref: "concepts.md#cross-zone-load-balancing-and-multi-az-distribution"

  - id: aws-load-balancing-elb-autoscaling-042
    difficulty: advanced
    tags: [alb-vs-nlb, mtls, static-ip, scenario]
    question: |
      A high-throughput mTLS gRPC service must expose a fixed IP for a partner allowlist,
      sustain millions of concurrent connections, and add minimal latency, but also needs
      the client's real source IP for per-tenant rate limiting done in the app. Which
      design is most appropriate?
    options:
      - "An ALB terminating gRPC over HTTPS, relying on X-Forwarded-For for source IP and an attached Elastic IP for the partner allowlist"
      - "An NLB with a TLS or TCP listener and an Elastic IP, preserving source IP to the targets which perform mTLS and rate limiting"
      - "A Classic Load Balancer in TCP mode with sticky sessions and a static VIP that exposes each client's real source IP"
      - "A Gateway Load Balancer fronting the gRPC fleet, using GENEVE encapsulation to hand the real client IP to each target"
    answer: 1
    explanation: |
      NLB gives the static/Elastic IP, millions of connections, minimal latency, and true
      source-IP preservation the app needs — and passing TCP/TLS through lets targets do
      mTLS themselves. ALB hides source IP behind XFF (an HTTP header, awkward for strict
      per-tenant IP logic) and adds more latency. CLB is legacy; GWLB is for appliance
      insertion, not exposing a gRPC service.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-load-balancing-elb-autoscaling-043
    difficulty: advanced
    tags: [cross-zone-cost, data-transfer, tradeoff]
    question: |
      A very high-bandwidth NLB workload wants to avoid inter-AZ data transfer charges
      while still tolerating an AZ failure. What is the best strategy?
    options:
      - "Enable cross-zone load balancing so every node reaches every target and traffic is spread perfectly evenly for free"
      - "Use a single AZ to eliminate cross-AZ traffic entirely, relying on in-AZ instance replacement for resilience"
      - "Switch to an ALB, which never charges for cross-zone and matches NLB's L4 throughput and static-IP behavior"
      - "Keep cross-zone OFF, provision equal (and slightly over-sized) capacity in each AZ, and rely on DNS to drop a failed AZ's node"
    answer: 3
    explanation: |
      Leaving cross-zone off keeps traffic in-AZ (no inter-AZ transfer cost); balancing
      and over-provisioning each AZ lets survivors absorb a failed AZ whose node DNS drops.
      Enabling cross-zone incurs the very charges you want to avoid. A single AZ has no
      failure tolerance. Switching to ALB may not fit an L4/high-throughput NLB workload
      and changes the whole design.
    ref: "concepts.md#cross-zone-load-balancing-and-multi-az-distribution"

  - id: aws-load-balancing-elb-autoscaling-044
    difficulty: advanced
    tags: [predictive-plus-target-tracking, layering]
    question: |
      Your workload has a strong daily cycle plus occasional unpredictable viral spikes.
      Boot time is long. What scaling configuration best covers both?
    options:
      - "Predictive scaling for the recurring cycle, combined with target tracking as a reactive safety net for the unexpected spikes"
      - "Target tracking alone on CPU, since its setpoint absorbs both the daily curve and any viral surge without boot-lag"
      - "Scheduled scaling only, pre-setting capacity for every hour so both the cycle and random spikes are covered"
      - "Simple scaling with a large step, which reacts fast enough that long boot time never causes user-visible errors"
    answer: 0
    explanation: |
      Predictive scaling pre-provisions for the known daily curve (removing boot-lag),
      while target tracking reacts to the unpredictable viral surges. Target tracking
      alone leaves boot-lag on the daily ramp; scheduled alone cannot handle surprises;
      simple scaling is the least responsive option.
    ref: "concepts.md#scaling-policies-target-tracking-step-simple-scheduled-predictive"

  - id: aws-load-balancing-elb-autoscaling-045
    difficulty: advanced
    tags: [lifecycle-hook-timeout, stall, heartbeat]
    question: |
      A launch lifecycle hook's custom bootstrap script hangs and never calls
      CompleteLifecycleAction. With defaults, what happens and what is the risk?
    options:
      - "The instance is terminated within 60 s automatically once the hook fails to send its first heartbeat"
      - "The ASG ignores the hook and puts the instance in service immediately, logging the stalled script as a warning"
      - "The instance stays in Pending:Wait until the heartbeat timeout (default 3600 s) elapses, stalling that instance from entering service and slowing scale-out"
      - "The load balancer routes traffic to it anyway during the wait, treating a Pending:Wait target as healthy"
    answer: 2
    explanation: |
      The instance waits in Pending:Wait until the heartbeat times out (default 3600 s /
      1 h, extendable) or you complete/abandon the action — delaying it entering service
      and hurting scale-out responsiveness, which is why hook actions must be fast and
      idempotent. It is not terminated in 60 s, not put into service early, and the LB
      does not route to an instance not yet in service.
    ref: "concepts.md#cooldowns-warm-pools-and-lifecycle-hooks"

  - id: aws-load-balancing-elb-autoscaling-046
    difficulty: advanced
    tags: [instance-refresh, deploy, min-healthy]
    question: |
      You update the launch template with a new AMI and trigger an ASG instance refresh
      with min-healthy-percentage=90%. What primarily does this setting control?
    options:
      - "The percentage of CPU each instance may use before the refresh throttles it back to the new AMI"
      - "How much of the fleet must remain healthy/in-service during the rolling replacement, bounding the impact and enabling safe rollback"
      - "The minimum size of the warm pool that must stay pre-baked with the new AMI during the refresh"
      - "The stickiness cookie duration applied to sessions on the instances still running the old AMI"
    answer: 1
    explanation: |
      Min-healthy-percentage governs how many instances stay in service while the refresh
      rolls the fleet, limiting capacity dips and supporting safe/rollback-able deploys.
      It is unrelated to per-instance CPU, warm pool size, or stickiness.
    ref: "concepts.md#auto-scaling-groups-fundamentals"

  - id: aws-load-balancing-elb-autoscaling-047
    difficulty: advanced
    tags: [privatelink, nlb, endpoint-service]
    question: |
      You want to expose a service to other AWS accounts privately via AWS PrivateLink
      (VPC endpoint service). Which load balancer must front the service as the endpoint
      service's load balancer?
    options:
      - "Network Load Balancer (or GWLB for appliances); ALB can be behind an NLB for L7"
      - "Application Load Balancer only, since PrivateLink endpoint services require L7 host-based routing"
      - "Classic Load Balancer, the only ELB type that PrivateLink endpoint services can register directly"
      - "Any load balancer works identically, because PrivateLink attaches to the ELB DNS name regardless of type"
    answer: 0
    explanation: |
      PrivateLink endpoint services are fronted by an NLB (or GWLB for appliance
      services). If you need L7 routing you chain NLB → ALB. A standalone ALB or CLB
      cannot directly back a classic PrivateLink endpoint service, so "any works" is
      wrong.
    ref: "concepts.md#network-load-balancer-l4-deep-dive"

  - id: aws-load-balancing-elb-autoscaling-048
    difficulty: advanced
    tags: [dns-failover, ttl, target-group-health]
    question: |
      With ALB target group health thresholds, when the healthy targets in a zone fall
      below the DNS-failover threshold, the zone's IPs are removed from DNS. Why might
      some clients still hit the failed zone briefly?
    options:
      - "ELB never actually removes IPs from DNS; it only stops routing internally while leaving the record intact"
      - "Cross-zone load balancing forces traffic back to the failed zone by mirroring its share onto surviving nodes"
      - "The ASG re-adds the IPs automatically as soon as it relaunches targets in the still-degraded zone"
      - "Client-side DNS caches may retain the old IPs until the record TTL (60 s) expires"
    answer: 3
    explanation: |
      DNS is only as fast as caches expire; the load balancer record TTL is 60 s, so
      clients honoring the cache may keep the removed IPs briefly. ELB does remove the IPs;
      cross-zone does not force traffic to a de-registered zone node; the ASG does not
      manage LB DNS records.
    ref: "concepts.md#cross-zone-load-balancing-and-multi-az-distribution"

  - id: aws-load-balancing-elb-autoscaling-049
    difficulty: advanced
    tags: [lambda-targets, alb, limits, tradeoff]
    question: |
      Fronting an ALB with Lambda targets for a spiky, lightweight endpoint is attractive
      for zero server management. What is the PRIMARY trade-off versus EC2/container
      targets for a sustained high-QPS hot path?
    options:
      - "Lambda targets cannot be health checked, so the ALB blindly routes to cold or broken functions"
      - "ALB cannot route paths to Lambda, forcing every function behind an API Gateway proxy instead"
      - "Per-invoke latency/cost and Lambda's request/response and timeout constraints make it less suitable than always-on targets for sustained high QPS"
      - "Lambda targets require sticky sessions, which serialize the hot path onto a single warmed function"
    answer: 2
    explanation: |
      Lambda targets shine for spiky/light traffic but carry per-invoke cost, cold-start
      latency, and payload/timeout limits, so a sustained high-QPS hot path is usually
      cheaper and lower-latency on always-warm EC2/containers. ALB does route to Lambda by
      rule; Lambda targets are not tied to stickiness; the concern is economics/latency at
      scale, not inability.
    ref: "concepts.md#target-groups-target-types-and-registration"

  - id: aws-load-balancing-elb-autoscaling-050
    difficulty: advanced
    tags: [origin-cloaking, cloudfront, security]
    question: |
      You put CloudFront in front of an ALB and want to guarantee that clients cannot
      bypass CloudFront (and its WAF) by hitting the ALB directly. What is the standard
      approach?
    options:
      - "Make the ALB internal-only and unreachable from the internet under all designs, letting CloudFront reach it over a VPC origin tunnel"
      - "Restrict the ALB security group to CloudFront's managed prefix list and/or require a secret custom header injected by CloudFront (origin cloaking)"
      - "Disable the ALB's public DNS name so its endpoint is undiscoverable and cannot be hit directly"
      - "Enable sticky sessions on the ALB so only CloudFront's pinned edge connections are accepted as origins"
    answer: 1
    explanation: |
      Origin cloaking locks the ALB to CloudFront: restrict the ALB SG to CloudFront's
      managed prefix list and/or verify a secret header CloudFront adds. A public-facing
      design needs this; simply hoping the DNS name is unknown is not security; internal-
      only ALB is a different architecture (no direct public origin); stickiness is
      irrelevant.
    ref: "concepts.md#cloudfront-with-alb-and-layering-cdn-plus-load-balancing"

  - id: aws-load-balancing-elb-autoscaling-051
    difficulty: advanced
    tags: [scale-in-protection, sticky, draining, tradeoff]
    question: |
      A stateful legacy app uses sticky sessions. During scale-in, users on the
      terminated target get logged out. Which combination BEST reduces user impact while
      you plan a migration to stateless design?
    options:
      - "Increase deregistration delay to cover session length and/or use instance scale-in protection so busy targets are not chosen first"
      - "Set deregistration delay to 0 to remove targets faster so sticky sessions migrate instantly to a fresh instance"
      - "Disable health checks during scale-in so sticky sessions are never interrupted by a target being marked unhealthy"
      - "Enable cross-zone load balancing so sticky sessions are replicated across zones and survive a target's termination"
    answer: 0
    explanation: |
      A longer deregistration delay lets sticky sessions drain, and scale-in protection /
      termination policy tuning keeps busy sticky targets from being killed first. Setting
      delay to 0 makes it worse (instant cutoff); disabling health checks risks routing to
      broken targets; cross-zone does not address session loss on termination.
    ref: "concepts.md#sticky-sessions-and-session-affinity"

  - id: aws-load-balancing-elb-autoscaling-052
    difficulty: advanced
    tags: [gwlb-vs-network-firewall, tradeoff]
    question: |
      You need centralized inline traffic inspection across many VPCs. What is the key
      trade-off between GWLB (with a third-party appliance fleet) and AWS Network
      Firewall?
    options:
      - "Network Firewall is always slower and less secure because it inspects packets in software rather than in the appliance data plane"
      - "GWLB cannot scale beyond a single appliance, whereas Network Firewall scales horizontally across accounts automatically"
      - "GWLB lets you run your chosen vendor appliances (max flexibility) but you operate/scale that fleet; Network Firewall is AWS-managed (less ops) but less customizable"
      - "They are interchangeable with identical trade-offs, differing only in the console page used to configure them"
    answer: 2
    explanation: |
      GWLB gives flexibility to run specific vendor appliances at the cost of operating
      the fleet; Network Firewall is a managed service (lower ops) but constrained to its
      capabilities. Network Firewall is not inherently slower/less secure, GWLB does scale
      the fleet, and they are not interchangeable — the flexibility-vs-ops trade-off is
      the point.
    ref: "concepts.md#gateway-load-balancer-l3-and-appliance-insertion"

  - id: aws-load-balancing-elb-autoscaling-053
    difficulty: advanced
    tags: [health-check-tuning, flapping, gc]
    question: |
      An app has occasional 2-second GC pauses. With an aggressive health check
      (interval 5 s, unhealthy threshold 2), what problem arises, and what is the fix?
    options:
      - "Nothing; aggressive checks are always better because they detect real failures sooner without side effects"
      - "The ASG will scale to max size, misreading the brief GC pauses as a sustained load spike needing capacity"
      - "Cross-zone load balancing will fail, because the frequent probes saturate the inter-AZ health-check path"
      - "Targets flap in and out during GC pauses, causing churn; relax the interval/threshold so transient pauses don't eject healthy targets"
    answer: 3
    explanation: |
      Too-aggressive health checks eject targets during transient GC pauses (false
      negatives), causing flapping and connection churn. Relaxing interval and unhealthy
      threshold tolerates brief pauses. Aggressive checks are not always better; a single
      flapping target does not push the ASG to max; cross-zone is unaffected.
    ref: "concepts.md#health-checks-connection-draining-and-deregistration-delay"

  - id: aws-load-balancing-elb-autoscaling-054
    difficulty: advanced
    tags: [ecs-capacity-provider, service-autoscaling, layers]
    question: |
      In an ECS-on-EC2 service behind an ALB, which two mechanisms together give full
      elasticity — one for tasks and one for the underlying EC2 capacity?
    options:
      - "Sticky sessions to add task replicas and cross-zone load balancing to grow the underlying EC2 fleet"
      - "ECS Service Auto Scaling for task count and ECS Capacity Providers (or the EC2 ASG) for cluster capacity"
      - "ALB target-group health to spin up tasks and predictive scaling on the ALB to add EC2 instances"
      - "Lambda targets to run extra tasks and warm pools to keep spare container hosts pre-provisioned"
    answer: 1
    explanation: |
      Service Auto Scaling adjusts the number of tasks; Capacity Providers (backed by an
      ASG) add/remove EC2 capacity to place those tasks. Stickiness/cross-zone are not
      scaling mechanisms; you do not "predictive-scale the ALB"; Lambda targets are not
      how ECS tasks run.
    ref: "concepts.md#integration-with-ecs-and-eks"

  - id: aws-load-balancing-elb-autoscaling-055
    difficulty: advanced
    tags: [nlb-idle-timeout, tcp-keepalive, long-lived]
    question: |
      A service holds long-lived but often-idle TCP connections behind an NLB, and
      connections silently die after several minutes. What is a robust mitigation?
    options:
      - "Enable sticky sessions on the NLB so a client's connection is pinned and thus never reaped by the idle timeout"
      - "Switch to an ALB, which holds idle connections open indefinitely and therefore never closes a quiet TCP flow"
      - "Set the deregistration delay to 3600 s so the NLB keeps the idle flow registered and refuses to reap it"
      - "Enable TCP keepalive on the client/server so packets flow within the flow idle timeout, keeping the flow alive"
    answer: 3
    explanation: |
      NLB closes idle TCP flows after the idle timeout; TCP keepalive keeps data flowing
      so the flow is not reaped. Stickiness is unrelated; ALB also has an idle timeout
      (default 60 s), so it is not timeout-free; deregistration delay is about draining,
      not idle flows.
    ref: "concepts.md#network-load-balancer-l4-deep-dive"

  - id: aws-load-balancing-elb-autoscaling-056
    difficulty: advanced
    tags: [target-group-health, minimum-healthy, availability]
    question: |
      ALB target group health lets you set both a DNS-failover threshold and a routing-
      failover threshold. What constraint does AWS require between them?
    options:
      - "The DNS-failover threshold must be greater than or equal to the routing-failover threshold, so DNS failover occurs with or before routing failover"
      - "They must be set to exactly equal percentages, because AWS applies a single shared threshold to both DNS and routing failover"
      - "The routing-failover threshold must always be pinned at 100%, so routing failover fires only when every target in the zone is unhealthy"
      - "Only one of the two thresholds may be configured at a time, since enabling DNS failover automatically disables the routing-failover control"
    answer: 0
    explanation: |
      AWS requires DNS-failover threshold >= routing-failover threshold so DNS failover
      happens with or before routing failover (which sends to all targets, healthy or
      not). They need not be equal, routing threshold need not be 100%, and both may be
      configured together.
    ref: "concepts.md#health-checks-connection-draining-and-deregistration-delay"

  - id: aws-load-balancing-elb-autoscaling-057
    difficulty: advanced
    tags: [warm-pool-states, cost, tradeoff]
    question: |
      Which warm pool state minimizes standby cost while still avoiding a full cold boot
      on scale-out?
    options:
      - "Running — instances stay fully powered on, so you pay full compute yet gain the fastest possible scale-out response"
      - "Terminated — instances are deleted between uses, and the pre-baked AMI is re-created on demand to keep standby cost at zero"
      - "Stopped — you pay only for EBS storage, and the pre-baked instance starts quickly on scale-out"
      - "Hibernated is always the cheapest option because saving RAM to disk lets you skip paying for any EBS storage while stopped"
    answer: 2
    explanation: |
      The Stopped warm-pool state charges only for EBS while keeping a pre-initialized
      instance ready to start fast — the cheapest warm option that still beats a cold
      launch. Running costs full compute; Terminated is not a warm-pool state (nothing
      is kept); Hibernated preserves RAM to disk (fastest resume) but is not the
      cheapest and adds storage for the RAM image.
    ref: "concepts.md#cooldowns-warm-pools-and-lifecycle-hooks"

  - id: aws-load-balancing-elb-autoscaling-058
    difficulty: advanced
    tags: [weighted-random, anomaly-mitigation, alb]
    question: |
      An ALB target group uses the weighted_random algorithm with anomaly mitigation
      enabled. What does anomaly mitigation add?
    options:
      - "It encrypts traffic to the targets by negotiating a per-target TLS session on top of the weighted_random distribution"
      - "It detects targets returning anomalous errors/latency and shifts traffic away from them"
      - "It forces strict round-robin ordering, overriding the configured weights so every target receives an identical share"
      - "It enables sticky sessions automatically, pinning each client to the first weighted target it happened to land on"
    answer: 1
    explanation: |
      Anomaly mitigation (only available with weighted_random) monitors targets and
      steers traffic away from ones exhibiting anomalous error rates or latency. It is not
      encryption, it does not force round robin, and it is unrelated to stickiness.
    ref: "concepts.md#application-load-balancer-l7-deep-dive"

  - id: aws-load-balancing-elb-autoscaling-059
    difficulty: advanced
    tags: [scale-out-lag, estimation, headroom]
    question: |
      Peak demand is 250,000 RPS. Each instance can safely serve 1,000 RPS, and you run
      target tracking at 50% CPU (so instances run at half their max). Ignoring AZ
      redundancy, roughly how many instances does steady peak require?
    options:
      - "About 500 instances"
      - "About 250 instances"
      - "About 125 instances"
      - "About 1,000 instances"
    answer: 0
    explanation: |
      At full capacity you'd need 250,000 / 1,000 = 250 instances, but targeting 50%
      utilization means each instance carries only ~500 RPS of useful load, so you need
      ~500 instances. 250 assumes 100% utilization (no headroom); 125 and 1,000 do not
      follow from the numbers. (AZ redundancy would add more on top.)
    ref: "concepts.md#choosing-scaling-metrics-and-capacity-planning"

  - id: aws-load-balancing-elb-autoscaling-060
    difficulty: advanced
    tags: [region-failure, multi-region, route53]
    question: |
      A single-region ALB + ASG architecture cannot survive a full Region outage. What is
      the correct higher-level pattern to add regional resilience?
    options:
      - "Add more Availability Zones in the same Region so the extra zones keep serving traffic even after the Region itself goes offline"
      - "Increase the ASG max size so the group can launch enough spare instances to ride out the loss of the entire Region"
      - "Enable cross-zone load balancing so requests are rerouted to a healthy Region once the primary one fails"
      - "Deploy the stack in a second Region and use Route 53 (latency/failover routing) or Global Accelerator to shift traffic, with cross-region data replication"
    answer: 3
    explanation: |
      Surviving a Region loss requires a second Region plus a global traffic layer (Route
      53 failover/latency routing or Global Accelerator) and data replication. Adding AZs,
      raising max size, or cross-zone all operate within one Region and cannot survive its
      loss.
    ref: "concepts.md#failure-modes-and-how-the-design-degrades"

  - id: aws-load-balancing-elb-autoscaling-061
    difficulty: expert
    tags: [lcu, billing, cost-model]
    question: |
      ALB is billed per hour plus Load Balancer Capacity Units (LCUs). Which set of
      dimensions do LCUs measure?
    options:
      - "Only the number of listeners configured on the load balancer, billed as a flat per-listener LCU rate each hour"
      - "The number of Availability Zones enabled, with one LCU charged per active AZ node the load balancer runs"
      - "New connections/sec, active connections, processed bytes, and rule evaluations — billed on the highest dimension"
      - "The CPU and memory consumed by the underlying load balancer nodes, metered per second like an EC2 instance"
    answer: 2
    explanation: |
      An LCU measures the highest of: new connections per second, active connections,
      processed bytes, and rule evaluations per second. Listener count, AZ count, and node
      CPU/memory are not the billing dimensions (ELB nodes are managed and not exposed as
      CPU/memory line items).
    ref: "concepts.md#application-load-balancer-l7-deep-dive"

  - id: aws-load-balancing-elb-autoscaling-062
    difficulty: expert
    tags: [instance-warmup-vs-cooldown, under-provisioning]
    question: |
      Why do target-tracking and step scaling use "instance warm-up" rather than the
      simple-scaling cooldown to avoid a specific failure mode?
    options:
      - "Cooldown makes instances boot slower by throttling their CPU during the warm-up window until the timer expires"
      - "A cooldown that blocks further scale-OUT while capacity is still warming can under-provision during a rapid ramp; instance warm-up instead just excludes warming instances from metrics so scale-out can continue"
      - "Instance warm-up disables the ELB health checks on new targets, so warming instances cannot be marked unhealthy and replaced"
      - "Cooldown only applies to scale-in actions and has no effect at all on how quickly the group can scale out"
    answer: 1
    explanation: |
      With cooldown, a scale-out could be blocked while earlier instances warm, starving
      a fast ramp. Instance warm-up excludes not-yet-warm instances from the aggregated
      metric (so their low load does not distort it) while still allowing additional
      scale-out — preventing under-provisioning. Cooldown does not change boot speed,
      warm-up does not disable health checks, and cooldown affects both directions.
    ref: "concepts.md#cooldowns-warm-pools-and-lifecycle-hooks"

  - id: aws-load-balancing-elb-autoscaling-063
    difficulty: expert
    tags: [nlb-hyperplane, source-ip, alb-target, xff]
    question: |
      When an NLB uses an ALB as its target (NLB → ALB chaining), what happens to the
      client's source IP as seen by the final application?
    options:
      - "The ALB terminates the connection, so the app sees the ALB's IP and must read X-Forwarded-For for the client IP"
      - "The app sees the client IP directly because NLB preserves it end to end, and the ALB forwards the raw L4 packet without re-originating the connection"
      - "The app sees the NLB's own node IP as the source, and because no X-Forwarded-For header is added there is no way to recover the client IP"
      - "The client source IP is only available for UDP flows through this chain; for TCP the ALB strips it entirely before the app"
    answer: 0
    explanation: |
      NLB may preserve source IP to the ALB, but the ALB is an L7 proxy that terminates
      and re-originates the HTTP connection, so the backend sees the ALB and must use
      X-Forwarded-For to recover the client IP. It is not preserved raw to the app; the
      client IP is recoverable (via XFF), and this is not UDP-specific.
    ref: "concepts.md#network-load-balancer-l4-deep-dive"

  - id: aws-load-balancing-elb-autoscaling-064
    difficulty: expert
    tags: [deregistration-delay-zero, websocket, tradeoff]
    question: |
      What is the risk of setting the deregistration delay to 0 for a service that
      handles WebSocket or long-running requests?
    options:
      - "Instances will never be deregistered, because a zero delay tells the target group to hold every target registered permanently"
      - "The ASG loses the ability to scale in at all, since a zero draining window prevents it from safely removing any target"
      - "In-flight connections are cut immediately on deregistration/scale-in, dropping active WebSocket sessions and unfinished requests"
      - "Cross-zone load balancing is silently disabled, so a zero delay collapses all traffic onto a single Availability Zone"
    answer: 2
    explanation: |
      With delay 0 there is no draining window, so active connections are severed the
      moment a target is deregistered — bad for WebSockets/long requests. Instances are
      still deregistered (immediately), scale-in still works, and cross-zone is unaffected.
    ref: "concepts.md#health-checks-connection-draining-and-deregistration-delay"

  - id: aws-load-balancing-elb-autoscaling-065
    difficulty: expert
    tags: [grpc, http2, alb, listener-requirement]
    question: |
      To use the gRPC protocol version on an ALB target group, which listener
      requirement applies?
    options:
      - "The listener must be plain HTTP, since gRPC rides HTTP/2 cleartext and the ALB refuses to parse it over a TLS listener"
      - "gRPC requires a raw TCP listener just like on NLB, because the ALB cannot inspect HTTP/2 framing to route by service or method"
      - "gRPC only works with the round_robin algorithm, as least_outstanding_requests cannot track the multiplexed streams on a gRPC connection"
      - "The listener protocol must be HTTPS, and only the forward action and instance/ip target types are supported (no Lambda)"
    answer: 3
    explanation: |
      gRPC on ALB requires an HTTPS listener, supports only forward actions and
      instance/ip targets (not Lambda), and the ALB parses gRPC to route by
      package/service/method. Plain HTTP is not allowed; gRPC on ALB is L7 (not a TCP
      listener); it is not tied to a specific LB algorithm.
    ref: "concepts.md#application-load-balancer-l7-deep-dive"

  - id: aws-load-balancing-elb-autoscaling-066
    difficulty: expert
    tags: [route53-evaluate-target-health, fail-open]
    question: |
      With a Route 53 alias record to an ALB and "evaluate target health" enabled, what
      happens if ALL target groups on the ALB are empty (no registered targets)?
    options:
      - "Route 53 marks the alias record healthy and keeps routing to it, since an ALB with zero targets still answers on its DNS name"
      - "Route 53 considers the record unhealthy (fail-open), so a failover routing policy sends traffic to the secondary resource"
      - "Route 53 automatically deletes the alias record until targets are registered again, breaking name resolution for the domain"
      - "The ALB automatically registers new targets from the launch template so the target groups are never actually left empty"
    answer: 1
    explanation: |
      An ALB with all target groups empty is treated as unhealthy by Route 53
      (fail-open), so failover routing diverts to the secondary. Route 53 does not keep
      routing to an empty ALB, does not delete records, and does not register targets
      (that is the ASG's job).
    ref: "concepts.md#failure-modes-and-how-the-design-degrades"

  - id: aws-load-balancing-elb-autoscaling-067
    difficulty: expert
    tags: [ip-target-cidr, on-prem, hybrid]
    question: |
      Which statement about ALB/NLB `ip` target registration is correct?
    options:
      - "You can register any publicly routable IP address, so an internet host reachable over the public internet can serve as a target"
      - "You can only register IPs that fall inside the load balancer's own subnet, so cross-subnet and cross-VPC targets are rejected"
      - "ip targets are limited to Lambda function ENIs, since the ip target type is just an alias for the lambda target type"
      - "You can register RFC1918/RFC6598 private IPs including targets in peered VPCs or on-premises via Direct Connect/VPN, but NOT public IPs"
    answer: 3
    explanation: |
      IP targets accept private ranges (VPC subnets, RFC1918, RFC6598) and reach peered
      VPCs and on-prem over DX/VPN, enabling hybrid architectures — but publicly routable
      IPs are not allowed. They are not confined to the LB's subnet, and ip targets are
      distinct from lambda targets.
    ref: "concepts.md#target-groups-target-types-and-registration"

  - id: aws-load-balancing-elb-autoscaling-068
    difficulty: expert
    tags: [termination-policy, scale-in, cost]
    question: |
      By default, which instance does an ASG choose to terminate on scale-in when
      instances are spread across AZs?
    options:
      - "It first rebalances across AZs (terminating from the AZ with the most instances), then by default picks the instance using the oldest launch template/configuration, tie-broken by closest to the next billing hour"
      - "The newest instance, always, so the most recently launched capacity is retired first regardless of AZ balance or launch template age"
      - "A purely random instance in the largest AZ, ignoring launch template age and never rebalancing the group across zones"
      - "The instance currently reporting the highest CPU utilization, so scale-in always sheds the busiest host in the group"
    answer: 0
    explanation: |
      The default termination policy first keeps AZs balanced, then targets the oldest
      launch template/configuration (to retire outdated config), tie-breaking on closest
      to the next billing hour. It is not "always newest," not purely random, and not
      based on CPU.
    ref: "concepts.md#auto-scaling-groups-fundamentals"

  - id: aws-load-balancing-elb-autoscaling-069
    difficulty: expert
    tags: [alb-cross-zone-target-override, edge-case]
    question: |
      ALB has cross-zone load balancing on by default at the LB level. What flexibility
      does the target-group attribute `load_balancing.cross_zone.enabled` provide?
    options:
      - "Nothing; ALB cross-zone is hard-wired on at the LB level and this attribute is read-only and cannot be changed on any target group"
      - "It converts the ALB into an NLB, switching the target group to L4 flow-hash routing once cross-zone is set to false"
      - "It can override cross-zone behavior per target group (true/false), or defer to the load balancer's setting with use_load_balancer_configuration"
      - "It disables health checks for a specific zone, so targets in that AZ stop being probed while cross-zone routing continues"
    answer: 2
    explanation: |
      The target-group attribute allows per-target-group cross-zone control (true/false)
      or `use_load_balancer_configuration` to inherit the LB setting. It does not turn an
      ALB into an NLB and does not disable health checks; "never changeable" is wrong given
      this attribute exists.
    ref: "concepts.md#cross-zone-load-balancing-and-multi-az-distribution"

  - id: aws-load-balancing-elb-autoscaling-070
    difficulty: expert
    tags: [karpenter, cluster-autoscaler, eks, node-scaling]
    question: |
      In EKS, pods are scaled by HPA/KEDA but pending pods can't schedule because there
      are no nodes. Which layer adds node capacity, and what is a modern option?
    options:
      - "The ALB adds worker nodes automatically whenever it detects that pods are stuck in a Pending state behind its target group"
      - "A node-provisioning layer — Cluster Autoscaler (ASG-based) or Karpenter (provisions right-sized nodes directly) — adds EC2 capacity for pending pods"
      - "Predictive scaling configured on the ALB target group forecasts pod demand and pre-launches the EC2 nodes needed to schedule them"
      - "Sticky sessions on the ingress cause new nodes to launch, because pinned clients force the cluster to expand its node pool"
    answer: 1
    explanation: |
      HPA/KEDA scale pods; node capacity for unschedulable pods comes from Cluster
      Autoscaler (ASG-backed) or Karpenter, which provisions right-sized nodes on demand.
      The ALB does not manage nodes, ALB target groups have no predictive scaling, and
      stickiness has nothing to do with node provisioning.
    ref: "concepts.md#integration-with-ecs-and-eks"

  - id: aws-load-balancing-elb-autoscaling-071
    difficulty: expert
    tags: [nlb-preserve-source-ip-target-type, ip-target, edge]
    question: |
      A team reports that with NLB `ip` targets behind a proxy, source IP preservation
      behaves differently than with `instance` targets. What is the accurate nuance?
    options:
      - "Client IP preservation is on by default for instance/IP-in-VPC targets, but is a configurable attribute (and off by default for some ip-target scenarios), so it must be verified rather than assumed"
      - "Source IP is never preserved on NLB regardless of target type, so every backend always observes the load balancer's address instead"
      - "Source IP preservation only works for UDP flows on NLB, and TCP connections always arrive with the client address stripped away"
      - "NLB always rewrites the source IP to its own node IP for every target type, so preservation is not actually configurable at all"
    answer: 0
    explanation: |
      NLB client IP preservation is controllable via a target-group attribute; it is on
      by default for instance targets but its default varies for certain ip-target
      configurations, so you should confirm the setting. It is not "never" preserved, not
      UDP-only, and NLB does not always SNAT to its node IP (that is exactly what
      preservation avoids in the default instance case).
    ref: "concepts.md#network-load-balancer-l4-deep-dive"

  - id: aws-load-balancing-elb-autoscaling-072
    difficulty: expert
    tags: [combined-design, cloudfront-nlb-alb, judgment]
    question: |
      A global product serves mostly-dynamic HTTPS APIs needing L7 path routing and WAF,
      wants edge TLS and DDoS protection, and one enterprise customer demands a static
      allowlistable ingress IP for a separate mTLS TCP integration. Which layered design
      best satisfies all requirements?
    options:
      - "A single ALB for everything, exposed directly to the internet, relying on its DNS name as the static allowlistable ingress for the mTLS integration"
      - "One NLB fronting all traffic, doing L7 path routing and WAF inspection at Layer 4 while also serving the mTLS TCP integration from the same listener"
      - "A Gateway Load Balancer in front of the ALB, using GENEVE encapsulation to add edge TLS, WAF, and a static allowlistable IP for the customer"
      - "CloudFront (edge TLS, WAF, Shield) in front of an ALB for the HTTPS APIs, plus a separate NLB with an Elastic IP for the enterprise mTLS TCP integration"
    answer: 3
    explanation: |
      The API path needs CloudFront (edge TLS/WAF/Shield) → ALB (L7 routing/WAF); the mTLS
      TCP integration needs a static IP and passthrough, which only an NLB (Elastic IP) can
      give — so two ingress paths. A lone public ALB lacks edge protection and a static IP;
      NLB cannot do L4 path routing; GWLB is for appliance insertion, not this need.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-load-balancing-elb-autoscaling-073
    difficulty: advanced
    tags: [asg-az-rebalance, availability]
    question: |
      After an AZ recovers from an outage, you notice the ASG launching instances in the
      recovered AZ and terminating some elsewhere. Why?
    options:
      - "A known bug in the Auto Scaling control plane that miscounts running instances and churns capacity until it is reset"
      - "Predictive scaling forecast a demand spike in the recovered AZ and pre-launched capacity there ahead of the traffic"
      - "AZ rebalancing — the ASG strives to keep instances evenly distributed across AZs, so it redistributes after recovery"
      - "The load balancer detected low target counts in that AZ and instructed the ASG to launch replacement instances there"
    answer: 2
    explanation: |
      ASGs perform AZ rebalancing to maintain even spread across AZs; after an AZ returns,
      it launches there and may terminate elsewhere to rebalance. It is expected behavior,
      not a bug, not predictive scaling, and not an LB request.
    ref: "concepts.md#auto-scaling-groups-fundamentals"

  - id: aws-load-balancing-elb-autoscaling-074
    difficulty: advanced
    tags: [mixed-instances, spot, cost, tradeoff]
    question: |
      To cut cost on a fault-tolerant, stateless web tier, you use an ASG mixed-instances
      policy with a mix of On-Demand and Spot. What is the primary trade-off to design
      around?
    options:
      - "Spot instances cannot be registered as load balancer targets, so any ASG that includes Spot must sit outside the target group"
      - "Spot capacity can be reclaimed with a 2-minute warning, so the design must tolerate interruptions (drain via lifecycle hook, keep an On-Demand baseline)"
      - "Mixed-instances policies disable both ELB and EC2 health checks, so interrupted Spot targets are never detected or replaced"
      - "Spot instances always cost more per hour than equivalent On-Demand capacity, so the mix only pays off for short bursts"
    answer: 1
    explanation: |
      Spot offers deep discounts but can be reclaimed with ~2 minutes notice, so you keep
      an On-Demand baseline and drain gracefully on interruption. Spot works behind LBs,
      mixed policies do not disable health checks, and Spot is cheaper (not more expensive)
      than On-Demand.
    ref: "concepts.md#choosing-scaling-metrics-and-capacity-planning"

  - id: aws-load-balancing-elb-autoscaling-075
    difficulty: beginner
    tags: [nlb, scale, requests-per-second]
    question: |
      Which statement best describes a Network Load Balancer's scaling capability?
    options:
      - "It can handle millions of requests per second and scales automatically for most workloads"
      - "It handles a few hundred requests per second before you must add more LBs"
      - "It requires manual capacity pre-provisioning in each Availability Zone"
      - "It only scales beyond its baseline once cross-zone load balancing is enabled"
    answer: 0
    explanation: |
      NLB is built to handle millions of requests/connections per second and scales
      automatically. It is not limited to hundreds of RPS, does not require manual per-AZ
      capacity provisioning, and its scaling is independent of the cross-zone setting.
    ref: "concepts.md#network-load-balancer-l4-deep-dive"

  - id: aws-load-balancing-elb-autoscaling-076
    difficulty: beginner
    tags: [asg, launch-template, min-max-desired]
    question: |
      What do the min, max, and desired capacity settings of an Auto Scaling group define?
    options:
      - "The CPU, memory, and disk capacity allocated to each instance in the group"
      - "The number of Availability Zones, subnets, and target groups the group spans"
      - "The lower bound, upper bound, and current target number of instances the group maintains"
      - "The health check interval, timeout, and unhealthy threshold used for its targets"
    answer: 2
    explanation: |
      min/max bound the group size and desired is the count it currently tries to
      maintain (scaling adjusts desired within min/max). They are not per-instance specs,
      not AZ/subnet counts, and not health check timings.
    ref: "concepts.md#auto-scaling-groups-fundamentals"

  - id: aws-load-balancing-elb-autoscaling-077
    difficulty: intermediate
    tags: [alb-vs-nlb, udp, protocol-fit]
    question: |
      You are load balancing a UDP-based service (e.g. DNS or a game server protocol).
      Which load balancer can handle it?
    options:
      - "Application Load Balancer, using its native UDP listener support"
      - "Classic Load Balancer running in HTTP passthrough mode"
      - "Gateway Load Balancer acting as a general-purpose UDP proxy"
      - "Network Load Balancer, which supports UDP and TCP_UDP listeners"
    answer: 3
    explanation: |
      Only NLB supports UDP (and TCP_UDP) listeners for L4 UDP services. ALB is HTTP-only
      (no UDP); CLB HTTP mode is L7 TCP; GWLB uses GENEVE for appliance insertion, not as
      a general UDP service proxy.
    ref: "concepts.md#network-load-balancer-l4-deep-dive"

  - id: aws-load-balancing-elb-autoscaling-078
    difficulty: intermediate
    tags: [alb, host-based-routing, microservices]
    question: |
      One ALB fronts three microservices at api.example.com, admin.example.com, and
      shop.example.com. What ALB feature routes each hostname to its own target group?
    options:
      - "Cross-zone load balancing across the AZs"
      - "Host-based routing rules on the listener"
      - "Sticky session affinity cookies"
      - "Client source IP address preservation"
    answer: 1
    explanation: |
      Host-based (host header) listener rules send each hostname to a different target
      group — a core L7 ALB capability. Cross-zone affects distribution, stickiness pins
      clients, and source IP preservation is an NLB trait, none of which route by hostname.
    ref: "concepts.md#application-load-balancer-l7-deep-dive"

  - id: aws-load-balancing-elb-autoscaling-079
    difficulty: expert
    tags: [step-scaling, breach-magnitude, tradeoff]
    question: |
      Compared with target tracking, when is step scaling the more appropriate choice?
    options:
      - "When you want AWS to fully manage the underlying alarms for you and you only need to set a single metric target"
      - "When the workload exposes no usable CloudWatch metrics at all, making any metric-driven scaling policy impossible"
      - "When you want a policy that only ever adds capacity and is structurally incapable of scaling the group back in"
      - "When you need graduated responses proportional to the severity of the breach (e.g. +1 at 60%, +4 at 90%) that a single target value cannot express"
    answer: 3
    explanation: |
      Step scaling lets you add larger increments for larger breaches, giving control
      target tracking (a single setpoint) cannot express. Target tracking is the choice
      when you just want a managed setpoint; step scaling still needs metrics and still
      scales in — those options misdescribe it.
    ref: "concepts.md#scaling-policies-target-tracking-step-simple-scheduled-predictive"

  - id: aws-load-balancing-elb-autoscaling-080
    difficulty: advanced
    tags: [thundering-herd, cold-start, mitigation]
    question: |
      A flash sale causes a 10x traffic spike faster than instances can boot, and users
      get errors during the ramp. Which combination of mitigations is most effective?
    options:
      - "Pre-scale with scheduled/predictive scaling, keep a warm pool for fast scale-out, and use slow start so newly healthy targets ramp rather than get slammed"
      - "Only increase the ASG maximum size so it can launch far more replacement instances once the flash-sale traffic arrives"
      - "Enable sticky sessions and cross-zone load balancing so the incoming spike is spread evenly and pinned across all targets"
      - "Lower the health check interval to 1 second so unhealthy targets are detected and replaced almost instantly in the spike"
    answer: 0
    explanation: |
      The bottleneck is boot lag plus cold targets, so pre-scaling (scheduled/predictive),
      warm pools (fast capacity), and slow start (protect fresh targets) together address
      it. Raising max size alone does nothing about boot time; stickiness/cross-zone do not
      add capacity; a 1 s health check risks flapping and does not add capacity.
    ref: "concepts.md#failure-modes-and-how-the-design-degrades"
