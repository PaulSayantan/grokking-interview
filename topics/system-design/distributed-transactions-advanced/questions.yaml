topic: "Distributed Transactions Beyond Saga: 2PC, 3PC and Deterministic Approaches"
domain: system-design
topic_slug: distributed-transactions-advanced
version: 1

questions:
  # ---------------- Why distributed transactions are hard ----------------
  - id: distributed-transactions-advanced-001
    difficulty: beginner
    tags: [partial-failure, atomicity, fundamentals]
    question: |
      What makes atomicity fundamentally harder across N nodes than on a single node?
    options:
      - "There is no shared log or clock, and any node can fail independently (partial failure) while others survive"
      - "Distributed CPUs run at lower clock speeds than single-node CPUs, so every transaction inherently takes longer to complete"
      - "Networks between nodes are always perfectly synchronous, so message delays are constant and timeouts become impossible to set"
      - "Disks in distributed systems cannot be fsynced individually, so no single node is ever able to make its write-ahead log durable"
    answer: 0
    explanation: |
      A single-node txn gets atomicity from one fsync-able WAL. Across nodes there is no
      shared log/clock, and partial failure (one node commits, another crashes after
      promising) leaves torn state with no oracle for the intended outcome. Speed, sync
      networks (false — they're async), and fsync (works fine per-node) are not the crux.
    ref: "concepts.md#why-distributed-transactions-are-hard"

  - id: distributed-transactions-advanced-002
    difficulty: advanced
    tags: [flp, consensus, atomic-commit]
    question: |
      In what precise sense is atomic commit a variant of consensus (per Gray and Lamport)?
    options:
      - "It is entirely unrelated to consensus; commit relies purely on timeouts while consensus relies on quorums, so they share no theoretical foundation"
      - "Both simply choose an arbitrary proposed value, so atomic commit is just plain consensus with a randomly selected default outcome bolted on"
      - "All nodes must agree on a single outcome, but with the constraint that any single 'no' vote must force a global abort"
      - "Consensus is strictly a special case of atomic commit, so every consensus algorithm is really a restricted commit protocol rather than the reverse"
    answer: 2
    explanation: |
      Atomic commit is consensus with an extra rule: unanimity to commit — one "no" forces
      abort — whereas generic consensus only needs *some* value chosen. Gray/Lamport's Paxos
      Commit reframes 2PC this way, noting its coordinator is an un-replicated acceptor.
    ref: "concepts.md#why-distributed-transactions-are-hard"

  - id: distributed-transactions-advanced-003
    difficulty: advanced
    tags: [flp, safety-liveness, partial-synchrony]
    question: |
      The FLP result says asynchronous consensus with one crash-faulty node cannot guarantee
      both safety and liveness. How do real atomic-commit/consensus systems cope?
    options:
      - "They abandon safety and accept occasional wrong decisions, tolerating a small rate of inconsistent commits in exchange for always staying live"
      - "They keep safety always and recover liveness by assuming partial synchrony (timeouts, failure detectors, a stable leader)"
      - "They formally prove that the FLP impossibility result does not apply to atomic-commit protocols because commit is not true consensus"
      - "They install synchronized hardware clocks on every node to make the whole model fully synchronous and thereby sidestep FLP"
    answer: 1
    explanation: |
      Practical systems (Paxos, Raft, 2PC-over-Paxos) never sacrifice safety; they regain
      liveness only under partial synchrony — timeouts and leader election let progress
      happen when the network behaves, while never producing an inconsistent decision.
    ref: "concepts.md#why-distributed-transactions-are-hard"

  - id: distributed-transactions-advanced-004
    difficulty: intermediate
    tags: [two-generals, messaging]
    question: |
      What does the two-generals problem tell us about coordinating a decision over a lossy
      network?
    options:
      - "With a sufficient number of retries both parties eventually attain common knowledge of the decision and can act with full certainty"
      - "Only cryptographically encrypted channels can achieve agreement, because message loss is fundamentally a confidentiality problem rather than a delivery one"
      - "Agreement becomes trivial as soon as messages are delivered in a guaranteed total order, since ordering alone removes all uncertainty"
      - "No fixed sequence of messages over a lossy channel gives both parties certainty the other received the final message"
    answer: 3
    explanation: |
      The last acknowledgement always needs its own acknowledgement, ad infinitum, so
      neither side attains certainty. Real protocols sidestep this with durable state plus
      eventual (retried) delivery, which is why commit needs a recoverable decision record.
    ref: "concepts.md#why-distributed-transactions-are-hard"

  - id: distributed-transactions-advanced-005
    difficulty: expert
    tags: [contention, throughput, scale, littles-law]
    question: |
      A hot row participates in a 2PC that holds its exclusive lock for ~10 ms (two RTTs plus
      fsyncs). Ignoring everything else, what is the approximate ceiling on that row's
      transaction rate, and why does adding machines not help?
    options:
      - "~10,000/s; sharding the coordinator across more machines raises the per-row ceiling linearly with the number of shards you add"
      - "Effectively unbounded; MVCC lets readers and writers proceed without the exclusive lock, so contention on the row disappears entirely"
      - "~100/s; the lock is a serialization point on a single logical row, so throughput is bounded by 1/hold-time regardless of cluster size"
      - "~1,000/s; the ceiling is set by coordinator CPU, so moving to faster CPUs removes the limit and scales the row's rate up"
    answer: 2
    explanation: |
      Serialized access to one row gives max rate ≈ 1/hold_time = 1/0.010s = 100/s (a Little's
      Law / serialization argument). The bottleneck is contention on the logical resource, not
      CPU or machine count — more hardware cannot parallelize a single lock.
    ref: "concepts.md#why-distributed-transactions-are-hard"

  # ---------------- 2PC protocol and coordinator ----------------
  - id: distributed-transactions-advanced-006
    difficulty: intermediate
    tags: [2pc, protocol, prepare]
    question: |
      After a participant votes YES (vote-commit) in 2PC's prepare phase, which statement is
      true?
    options:
      - "It has made an irrevocable promise: it must be able to commit even across a crash, and cannot decide on its own"
      - "It may still unilaterally abort the transaction on its own if it times out while waiting for the coordinator's decision to arrive"
      - "It releases all of its held locks immediately and moves on to begin processing the next incoming transaction right away"
      - "It has effectively already committed the transaction locally; phase two is merely a courtesy notification of the outcome"
    answer: 0
    explanation: |
      A YES vote is a durable promise (PREPARE record fsynced). The participant is now
      "prepared," must retain locks and the ability to commit, and cannot unilaterally abort
      or commit — it must await the coordinator's decision. That is exactly what makes 2PC
      blocking.
    ref: "concepts.md#two-phase-commit-2pc-protocol-and-coordinator"

  - id: distributed-transactions-advanced-007
    difficulty: advanced
    tags: [2pc, commit-point, coordinator]
    question: |
      Where is the single atomic "commit point" of a 2PC transaction?
    options:
      - "At the instant the last participant fsyncs its PREPARE record, since that is when all votes are guaranteed durable"
      - "At the moment the first participant acknowledges receipt of the coordinator's commit message in phase two"
      - "When the client finally receives the success response and considers its request completed end-to-end"
      - "When the coordinator durably writes its COMMIT decision to its own log in phase 2"
    answer: 3
    explanation: |
      The coordinator's durable decision write serializes the global outcome — before it, the
      txn can still abort; after it, commit is final and recovery will roll everyone forward.
      Participant prepares are promises, not the decision; acks/responses come after.
    ref: "concepts.md#two-phase-commit-2pc-protocol-and-coordinator"

  - id: distributed-transactions-advanced-008
    difficulty: advanced
    tags: [2pc, xa, when-to-use]
    question: |
      Where is 2PC most defensible, and where is it a poor fit?
    options:
      - "Defensible across independent microservices where it decouples their release cycles; poor inside a single database where local transactions already suffice"
      - "Defensible inside one storage system with an HA coordinator (e.g. a distributed DB's internal multi-shard writes); poor across independent microservice databases where it couples availability and holds cross-service locks"
      - "Defensible only for read-only workloads that take shared locks; poor for any workload that performs writes because prepare records become mandatory"
      - "Equally good everywhere as long as the network between participants is fast and low-latency, since latency is 2PC's only real weakness"
    answer: 1
    explanation: |
      Inside one storage system you can make the coordinator consensus-backed and control lock
      lifetimes (Spanner/CockroachDB). Across microservices, XA 2PC couples every service's
      availability to the coordinator and to each other and holds locks across the network —
      the classic anti-pattern.
    ref: "concepts.md#two-phase-commit-2pc-protocol-and-coordinator"

  - id: distributed-transactions-advanced-009
    difficulty: intermediate
    tags: [2pc, latency, tail]
    question: |
      Why does one slow participant disproportionately hurt a 2PC transaction's latency?
    options:
      - "Phase 1 cannot complete until every participant has voted, so overall latency tracks the slowest (tail) participant"
      - "The coordinator re-sends the prepare request to all participants whenever any one of them is slow, multiplying the round trips"
      - "A slow participant is automatically treated as a failure and aborts the entire transaction after the coordinator's timeout"
      - "2PC contacts participants strictly one after another, so total latency is the sum of every participant's individual response time"
    answer: 0
    explanation: |
      Prepare is a barrier: the coordinator waits for all votes, so the straggler sets the
      pace (a "tail at scale" effect). Participants are contacted in parallel, so it's the max
      not the sum; there is no auto-abort or full retry for mere slowness.
    ref: "concepts.md#two-phase-commit-2pc-protocol-and-coordinator"

  - id: distributed-transactions-advanced-010
    difficulty: expert
    tags: [2pc, fsync, cost-accounting]
    question: |
      In a standard 2PC across a coordinator and participants, roughly how many durable log
      writes (fsyncs) does each participant perform, and why does that matter for throughput?
    options:
      - "Zero; only the coordinator ever writes to durable storage, so participants stay purely in memory and remain cheap"
      - "Exactly one (the commit record only); the prepare vote is held in memory and never needs to survive a crash"
      - "Two (a PREPARE record and a COMMIT record); each fsync adds storage latency to the lock-hold window, throttling contended rows"
      - "Four durable writes, one for each of the four network messages exchanged during the two phases of the protocol"
    answer: 2
    explanation: |
      A participant fsyncs on prepare (to make its YES durable) and on commit. Those two
      stable-storage writes extend how long locks are held (network RTT + fsync latency),
      which is the real throughput cost on contended data. The coordinator also logs its
      decision.
    ref: "concepts.md#two-phase-commit-2pc-protocol-and-coordinator"

  # ---------------- Blocking problem and coordinator failure ----------------
  - id: distributed-transactions-advanced-011
    difficulty: intermediate
    tags: [2pc, blocking, in-doubt]
    question: |
      The coordinator crashes after all participants voted YES but before sending the decision.
      Why can a prepared participant neither commit nor abort on its own?
    options:
      - "It can safely abort once its timeout expires, because prolonged silence from the coordinator reliably implies the transaction failed"
      - "The coordinator may have already decided (commit or abort) and told others; unilaterally choosing risks a global atomicity violation, so it must stay in-doubt and wait"
      - "It can safely commit on its own, since every participant voted YES and unanimous prepare votes make commit the only possible outcome"
      - "It can simply flip a coin to pick commit or abort, because either choice preserves global atomicity as long as it is durable"
    answer: 1
    explanation: |
      An in-doubt participant doesn't know the coordinator's recorded decision. Committing
      risks disagreeing with an abort; aborting risks disagreeing with a commit already sent
      to a peer. To preserve atomicity it must block (hold locks) until the coordinator
      recovers or a cooperative peer knows the outcome.
    ref: "concepts.md#the-blocking-problem-and-coordinator-failure"

  - id: distributed-transactions-advanced-012
    difficulty: advanced
    tags: [2pc, availability, blast-radius]
    question: |
      Why is coordinator failure in classic 2PC an availability problem far beyond the single
      stuck transaction?
    options:
      - "The coordinator's crash permanently corrupts its own transaction log on disk, so its recorded decisions can never be recovered afterward"
      - "Every participant deliberately crashes itself the moment it detects the coordinator is gone, in order to protect its data from corruption"
      - "The end client is silently billed twice for the same operation whenever the coordinator fails mid-transaction"
      - "In-doubt participants keep locks held, so unrelated transactions that touch those rows also stall, cascading into a wider latency/availability event"
    answer: 3
    explanation: |
      Held locks block any other transaction needing those rows, so one coordinator outage
      can fan out into broad stalls. This couples every participant's availability to the
      coordinator's — the core reason 2PC is avoided at scale.
    ref: "concepts.md#the-blocking-problem-and-coordinator-failure"

  - id: distributed-transactions-advanced-013
    difficulty: expert
    tags: [xa, heuristic, in-doubt, operations]
    question: |
      In XA, an operator manually "heuristically" commits an in-doubt branch to release locks
      while the coordinator is down. What is the real danger?
    options:
      - "It is always safe to do because the on-call operator has full visibility into the coordinator's recorded decision at all times"
      - "It merely delays when the transaction finishes and can never harm correctness, since the protocol reconciles the branch later"
      - "The guess may contradict the coordinator's actual decision, violating atomicity (some branches commit, others abort) — a silent, hard-to-detect inconsistency"
      - "It forces the entire cluster to perform a full restart before any new transactions can be accepted again"
    answer: 2
    explanation: |
      A heuristic decision bypasses the protocol; if the operator guesses the opposite of the
      coordinator's recorded outcome, that branch diverges from the others — a genuine
      atomicity violation that may surface only later during reconciliation.
    ref: "concepts.md#the-blocking-problem-and-coordinator-failure"

  - id: distributed-transactions-advanced-014
    difficulty: advanced
    tags: [2pc, paxos, coordinator-ha]
    question: |
      What is the most effective way to remove the coordinator as a single point of failure in
      2PC, and what does it NOT fully eliminate?
    options:
      - "Replicate the coordinator as a Paxos/Raft group so its decision log survives any single failure; this removes the SPOF but not the participant-side in-doubt window entirely"
      - "Add a single hot-standby coordinator kept up to date by asynchronous replication; this failover path removes blocking under every failure scenario"
      - "Switch to the three-phase commit protocol instead, which cleanly removes both the coordinator SPOF and blocking under all network conditions"
      - "Have the participants elect a fresh coordinator among themselves by taking a majority vote weighted by the locks each one holds"
    answer: 0
    explanation: |
      A consensus-backed coordinator (Spanner/CockroachDB "Paxos Commit") survives failures
      and a new leader recovers decisions. But participants can still briefly be in-doubt while
      a new leader is elected/recovers, so the participant-side window isn't zero. Async
      standbys can lose the decision; 3PC is not partition-safe.
    ref: "concepts.md#the-blocking-problem-and-coordinator-failure"

  - id: distributed-transactions-advanced-015
    difficulty: expert
    tags: [2pc, cooperative-termination]
    question: |
      When does the cooperative termination protocol (in-doubt participants querying each
      other) fail to unblock 2PC?
    options:
      - "When the coordinator is still alive but merely responding slowly to the participants' status queries"
      - "It never actually fails, because peers can always reconstruct the global decision purely from the votes they cast in phase one"
      - "Only in transactions that involve more than three participants, where the query fan-out grows too large to resolve"
      - "When every reachable peer is also in-doubt (none received the decision) — then no one can supply the outcome and all still block"
    answer: 3
    explanation: |
      Cooperative termination helps only if *someone* learned the decision. If a
      coordinator-side failure/partition left all reachable participants in-doubt, there is no
      authoritative answer to share, so blocking persists. This gap is what 3PC tried (and
      failed) to close.
    ref: "concepts.md#the-blocking-problem-and-coordinator-failure"

  # ---------------- 3PC ----------------
  - id: distributed-transactions-advanced-016
    difficulty: advanced
    tags: [3pc, precommit, non-blocking]
    question: |
      What does the extra "pre-commit" phase in 3PC accomplish under a synchronous, fail-stop
      model?
    options:
      - "It commits the transaction's data to storage one phase earlier than 2PC does, purely to shave a round trip off overall latency"
      - "It ensures that once any participant is told to pre-commit, every participant KNOWS the vote was unanimous, so survivors can safely time out and commit after coordinator failure"
      - "It replaces the single coordinator with a rotating quorum of participants that jointly drive the commit decision each round"
      - "It removes the need for participants to perform any durable logging, since knowledge of the vote is propagated in memory instead"
    answer: 1
    explanation: |
      Pre-commit propagates the knowledge "all voted yes" before actually committing. A
      participant holding pre-commit can safely commit on timeout; one still in phase 1 can
      safely abort — non-blocking, but only if failures are clean and there are no partitions.
    ref: "concepts.md#three-phase-commit-3pc-and-its-partition-failure"

  - id: distributed-transactions-advanced-017
    difficulty: expert
    tags: [3pc, partition, split-brain, atomicity]
    question: |
      Give the scenario where 3PC violates atomicity.
    options:
      - "A network partition splits nodes so some received pre-commit and some did not; on timeout the pre-commit side commits and the other side aborts, producing a split-brain where the txn is both committed and aborted"
      - "A participant's disk fills to capacity during the pre-commit phase, so it can no longer append the pre-commit record to its local log"
      - "The coordinator accidentally sends the pre-commit message twice to the same participant, causing it to apply the change two times"
      - "A single participant first votes YES in phase one and then changes its answer to NO before the pre-commit round begins"
    answer: 0
    explanation: |
      3PC's timeout-based termination assumes you can tell crashes from partitions. Under a
      partition, the two sides make opposite safe-looking choices and diverge — an atomicity
      violation. This is why 3PC is not used and why consensus (which never split-brains) is
      the modern answer.
    ref: "concepts.md#three-phase-commit-3pc-and-its-partition-failure"

  - id: distributed-transactions-advanced-018
    difficulty: advanced
    tags: [3pc, consensus, spanner]
    question: |
      If you want a non-blocking, partition-safe commit decision today, what should you use
      instead of 3PC?
    options:
      - "A faster, higher-bandwidth network engineered so that network partitions simply never occur between the participating nodes"
      - "A four-phase commit protocol that appends yet another safety round after pre-commit to eliminate the partition window"
      - "Consensus (Paxos/Raft) to replicate the commit decision — it preserves safety always and gets liveness with a quorum, never split-brains"
      - "A single super-reliable coordinator running on premium, redundant hardware so that it is statistically guaranteed never to fail"
    answer: 2
    explanation: |
      Replicating the decision via consensus keeps safety under partitions (a minority side
      simply can't make progress rather than diverging) and provides liveness with a quorum.
      Spanner/CockroachDB use 2PC where each role is a Paxos group, not 3PC.
    ref: "concepts.md#three-phase-commit-3pc-and-its-partition-failure"

  - id: distributed-transactions-advanced-019
    difficulty: intermediate
    tags: [3pc, latency, cost]
    question: |
      Compared to 2PC, what is 3PC's cost even before considering its partition flaw?
    options:
      - "It is strictly cheaper than 2PC, using fewer messages and fsyncs because the pre-commit phase lets participants skip their prepare-record write"
      - "It adds an extra round trip and more stable-storage writes, making it slower, for a non-blocking benefit that evaporates under real network conditions"
      - "It uses the same two phases as 2PC under different names, adding no extra round trips or stable-storage writes beyond what 2PC already performs"
      - "It removes durable logging entirely, keeping vote and decision state in memory, trading crash durability for a large latency reduction over 2PC"
    answer: 1
    explanation: |
      Three phases mean an extra RTT and more logging than 2PC's two phases. Since the
      non-blocking guarantee holds only in an unrealistic synchronous, partition-free model,
      you pay real overhead for a benefit you can't rely on.
    ref: "concepts.md#three-phase-commit-3pc-and-its-partition-failure"

  # ---------------- Saga pattern ----------------
  - id: distributed-transactions-advanced-020
    difficulty: beginner
    tags: [saga, compensation, basics]
    question: |
      What does a saga guarantee, and how?
    options:
      - "Full ACID atomicity by holding cross-service locks until every step commits, so no other transaction can observe partial saga state at any point"
      - "Exactly-once delivery of every inter-service message, so each step is guaranteed to be received and processed by the next service precisely one time"
      - "Linearizable reads across all participating services, so any read after a step commits reflects that step's effect everywhere in real time"
      - "Either all local transactions complete, or the completed ones are semantically undone by compensating transactions — eventual, application-level atomicity"
    answer: 3
    explanation: |
      A saga is a sequence of local txns each with a compensator; on failure it runs
      compensators in reverse to semantically undo prior steps. It trades true ACID atomicity
      for eventual application-level atomicity — no cross-service locks, no distributed commit.
    ref: "concepts.md#the-saga-pattern-orchestration-choreography-compensation"

  - id: distributed-transactions-advanced-021
    difficulty: intermediate
    tags: [saga, orchestration, choreography]
    question: |
      Which best captures the orchestration-vs-choreography trade-off for sagas?
    options:
      - "Choreography uses a central orchestrator that issues commands, while orchestration is fully event-driven with each service reacting independently to published events"
      - "Orchestration is always faster because of fewer hops, while choreography is always more reliable because it has no single component that can fail"
      - "Orchestration centralizes flow in one component (easy to observe/control, risks a bloated coordinator); choreography spreads logic via events (loose coupling, but emergent flow that's hard to debug)"
      - "They are identical except for naming; both use a central coordinator to drive steps and differ only in the terminology their respective communities prefer"
    answer: 2
    explanation: |
      Orchestration = a central brain drives steps (great visibility/control, risk of a god
      service). Choreography = services react to events (loose coupling, but flow is emergent
      and needs tracing to follow, with cyclic-dependency risk).
    ref: "concepts.md#the-saga-pattern-orchestration-choreography-compensation"

  - id: distributed-transactions-advanced-022
    difficulty: advanced
    tags: [saga, pivot, ordering, non-compensatable]
    question: |
      Your checkout saga has a non-compensatable step (send confirmation email) and several
      reversible ones (reserve inventory, authorize payment). How should you order them?
    options:
      - "Order compensatable steps first, then the pivot, then retriable-only steps — placing the non-compensatable email last, after the point where the saga is certain to succeed"
      - "Put the confirmation email first so the customer is notified early, then reserve inventory and authorize payment, undoing the email if a later step fails"
      - "Order is irrelevant here, since compensating transactions can cleanly reverse any step in any arrangement, including the confirmation email once it is sent"
      - "Randomize the step order across requests to spread load evenly, since deterministic ordering would concentrate contention on the inventory and payment services"
    answer: 0
    explanation: |
      Standard saga design is compensatable → pivot → retriable. Everything before the pivot
      can be undone; everything at/after it must succeed (retried until it does). Irreversible
      actions like emails go last so you never have to un-send them.
    ref: "concepts.md#the-saga-pattern-orchestration-choreography-compensation"

  - id: distributed-transactions-advanced-023
    difficulty: advanced
    tags: [saga, compensation, idempotency]
    question: |
      Why must saga compensating transactions be idempotent and retried until success?
    options:
      - "Because they run inside the same distributed transaction as the forward steps, so the transaction manager automatically rolls them back together on any failure"
      - "Because compensations are strictly read-only reconciliation checks that never mutate state, so repeating them can never affect correctness in any way"
      - "Because the orchestrator enforces a hard rule of at most one compensation per step, guaranteeing that a compensation is dispatched and executed exactly one time"
      - "Because failures/retries mean a compensation may run more than once or arrive out of order, and a compensation can itself fail — so it must be safely repeatable and eventually applied"
    answer: 3
    explanation: |
      Compensations are new local txns in an unreliable system: retries can duplicate them,
      ordering can vary, and they can fail transiently. Idempotency makes duplicates harmless
      and retry-until-success ensures the undo eventually completes (with alerting if stuck).
    ref: "concepts.md#the-saga-pattern-orchestration-choreography-compensation"

  - id: distributed-transactions-advanced-024
    difficulty: expert
    tags: [saga, orchestrator, durability]
    question: |
      An orchestration-based saga uses a stateless service that calls each step in sequence and
      keeps progress in memory. What is the core flaw?
    options:
      - "It is too slow because each sequential step adds a network hop, and the accumulated round-trip latency makes the overall saga unacceptably long to complete"
      - "If the orchestrator process crashes mid-saga, in-memory progress is lost and the saga can neither complete nor compensate — the orchestrator's state must be durable/recoverable (persistent state machine)"
      - "A stateless orchestrator is architecturally limited to calling at most two downstream services per saga, so longer multi-step flows simply cannot be modeled this way"
      - "It violates linearizability of reads, because a stateless orchestrator cannot pin a consistent snapshot timestamp across the services it invokes during the flow"
    answer: 1
    explanation: |
      A saga can be long-running; its coordinating state must survive crashes so it resumes
      rather than stranding half-done work. Production systems back the orchestrator with a
      durable state machine (Temporal/Cadence, Step Functions, a saga table), not memory.
    ref: "concepts.md#the-saga-pattern-orchestration-choreography-compensation"

  - id: distributed-transactions-advanced-025
    difficulty: advanced
    tags: [saga, 2pc, tradeoff]
    question: |
      What is the fundamental trade-off of choosing a saga over 2PC for a cross-service flow?
    options:
      - "Saga gives availability and no cross-service locks (each step commits immediately) but gives up isolation and pushes compensation logic into the application"
      - "Saga gives stronger isolation than 2PC but worse availability, because holding compensation intent across steps blocks other transactions more aggressively than 2PC's locks"
      - "Saga gives true ACID atomicity with a single global commit point, while 2PC provides only eventual, application-level atomicity through compensating transactions"
      - "There is no real trade-off; the saga pattern strictly dominates 2PC on availability, isolation, atomicity, and latency, so 2PC is never the better choice"
    answer: 0
    explanation: |
      Saga releases locks at each local commit (high availability, no cross-service blocking)
      but provides ACD-not-ACID: no isolation by default, and you must write compensators.
      2PC gives isolation and true atomicity but blocks and holds locks across the network.
    ref: "concepts.md#the-saga-pattern-orchestration-choreography-compensation"

  # ---------------- Saga isolation anomalies ----------------
  - id: distributed-transactions-advanced-026
    difficulty: advanced
    tags: [saga, isolation, acid]
    question: |
      Sagas are often summarized as providing "ACD, not ACID." Which property is missing and
      what is the consequence?
    options:
      - "Durability is missing; because steps commit optimistically, a crash after a local commit can silently lose an already-completed step's effect"
      - "Consistency is missing; each local step commits without validating constraints, so an individual service's database can be left in an invalid state"
      - "Isolation is missing; between a step committing and a later compensation, other transactions can observe intermediate (possibly to-be-undone) state"
      - "Atomicity is missing; once a non-compensatable step runs there is no way to undo the saga, so it can be left permanently half-completed"
    answer: 2
    explanation: |
      Each local step commits and is durable/consistent within its service, and the saga is
      eventually atomic via compensation — but there is no isolation across the saga, so
      concurrent transactions can see intermediate states (dirty reads, lost updates, fuzzy
      reads).
    ref: "concepts.md#saga-isolation-anomalies-and-countermeasures"

  - id: distributed-transactions-advanced-027
    difficulty: expert
    tags: [saga, dirty-read, semantic-lock]
    question: |
      A saga creates an order (committed) that a later step may cancel/compensate. Meanwhile a
      credit-check service reads the order as active and extends credit on it. Which anomaly is
      this, and which countermeasure directly addresses it?
    options:
      - "Lost update; fix by modeling the order as commutative credit/debit deltas so the concurrent credit extension and cancellation combine without clobbering each other"
      - "Dirty read; fix with a semantic lock — mark the order state as PENDING/APPROVAL_PENDING so readers don't treat it as final until the saga completes"
      - "Phantom read; fix by raising the credit-check service's local database isolation level to serializable so the newly created order row is not visible mid-saga"
      - "Write skew; fix with SELECT FOR UPDATE on the order row so the credit-check transaction blocks until the saga's cancellation step has finished"
    answer: 1
    explanation: |
      Reading an order that may still be compensated away is a dirty read of uncommitted-saga
      state. The semantic lock (a PENDING flag that readers respect, released by the completing
      or compensating step) is the standard countermeasure.
    ref: "concepts.md#saga-isolation-anomalies-and-countermeasures"

  - id: distributed-transactions-advanced-028
    difficulty: expert
    tags: [saga, semantic-lock, tradeoff]
    question: |
      What is the honest cost of using semantic locks as a saga countermeasure?
    options:
      - "They are free at the application layer; the underlying database recognizes the PENDING flag and enforces the lock semantics automatically for every reader"
      - "They restore full ACID guarantees to the saga with no downside, effectively giving cross-service serializable isolation at no additional development cost"
      - "They only work with choreography-based sagas and cannot be used with an orchestrator, since a central coordinator has no way to release the semantic lock"
      - "You are rebuilding a slice of a lock manager in application code — readers must be lock-aware, and you can create cross-saga deadlocks — i.e. you design isolation back in where the business needs it"
    answer: 3
    explanation: |
      A semantic lock is an app-level lock protocol: every reader/writer must honor the PENDING
      state, and two sagas locking in different orders can deadlock. It restores targeted
      isolation at the price of application complexity — saga is ACD, and you add back the I
      you truly need.
    ref: "concepts.md#saga-isolation-anomalies-and-countermeasures"

  - id: distributed-transactions-advanced-029
    difficulty: advanced
    tags: [saga, commutative, lost-update]
    question: |
      Why does modeling a balance change as `credit(x)`/`debit(x)` rather than `setBalance(v)`
      help with saga isolation?
    options:
      - "It makes the balance operations linearizable, so every reader across services immediately observes each credit or debit in strict real-time order"
      - "It converts the saga into a 2PC transaction by having each delta acquire a prepare lock, giving the balance field true cross-service atomic commit"
      - "Commutative deltas make the result order-independent, so concurrent sagas don't clobber each other's updates — eliminating the lost-update anomaly for that field"
      - "It removes the need for compensation entirely, because a delta can always be reversed by the database's own rollback without an explicit compensating step"
    answer: 2
    explanation: |
      `setBalance` is a blind write that can lose a concurrent update; additive deltas commute,
      so interleaved credits/debits sum correctly regardless of order. It's a countermeasure
      for lost updates — not a cure for all anomalies (write skew can remain).
    ref: "concepts.md#saga-isolation-anomalies-and-countermeasures"

  - id: distributed-transactions-advanced-030
    difficulty: intermediate
    tags: [saga, fuzzy-read, anomalies]
    question: |
      Within one saga, step 1 reads balance = 100 and step 3 re-reads it and sees 60 because
      another saga debited it in between. What is this anomaly called?
    options:
      - "Fuzzy / non-repeatable read"
      - "Phantom insert, since a concurrent saga inserting new rows into the queried range makes the re-read return a different set of matching rows"
      - "Dirty write, since the concurrent saga overwrote a value that this saga had already written but not yet committed across its steps"
      - "Torn page, since the balance row spans multiple storage pages and step 3 read it while a concurrent write had only flushed part of it"
    answer: 0
    explanation: |
      Reading the same datum twice in one logical unit and getting different values because a
      concurrent transaction mutated it is a fuzzy/non-repeatable read — a direct consequence
      of the saga lacking isolation across its steps.
    ref: "concepts.md#saga-isolation-anomalies-and-countermeasures"

  # ---------------- Percolator ----------------
  - id: distributed-transactions-advanced-031
    difficulty: advanced
    tags: [percolator, snapshot-isolation, tso]
    question: |
      What does Percolator add on top of BigTable, and using what timestamp mechanism?
    options:
      - "Full serializability across rows using a separate distributed lock service (Chubby-style) for ordering, avoiding timestamps entirely to sidestep clock skew"
      - "Linearizable single-row writes only, extending BigTable's per-row atomicity with a real-time ordering guarantee but no cross-row transaction support at all"
      - "Eventual consistency across rows using per-node vector clocks to merge concurrent writes, favoring availability over any snapshot or isolation guarantee"
      - "Cross-row/cross-table ACID transactions with snapshot isolation, using a Timestamp Oracle that hands out a start_ts (read snapshot) and a commit_ts"
    answer: 3
    explanation: |
      BigTable only guarantees single-row atomicity; Percolator layers multi-row SI on top via
      MVCC plus a Timestamp Oracle providing monotonic start/commit timestamps. It's the basis
      of TiDB's transaction model.
    ref: "concepts.md#percolator-snapshot-isolation-on-bigtable"

  - id: distributed-transactions-advanced-032
    difficulty: expert
    tags: [percolator, primary-lock, commit-point]
    question: |
      In Percolator, what is the "primary lock" and why is committing it significant?
    options:
      - "It is a lock held by a dedicated coordinator node; committing it closes the current transaction epoch and lets the next batch of transactions begin acquiring timestamps"
      - "One chosen written cell serves as the primary; atomically replacing its lock with a write record (a single-row BigTable txn) is the atomic commit point for the whole multi-row transaction — recovery/readers consult it to decide the txn's fate"
      - "It is a single global mutex covering the entire cluster that serializes all transactions system-wide, so only one Percolator transaction can be in flight at any instant"
      - "It locks the Timestamp Oracle for the transaction's duration so that no other transaction can obtain a start or commit timestamp until this transaction finishes"
    answer: 1
    explanation: |
      Percolator designates one cell as primary; secondaries point to it. The single-row commit
      of the primary is atomic (BigTable guarantees single-row) and becomes the decision. A
      reader hitting a stale secondary lock inspects the primary to roll forward or back — no
      central coordinator must survive.
    ref: "concepts.md#percolator-snapshot-isolation-on-bigtable"

  - id: distributed-transactions-advanced-033
    difficulty: expert
    tags: [percolator, write-skew, isolation]
    question: |
      Because Percolator provides snapshot isolation rather than serializability, which anomaly
      remains possible?
    options:
      - "Write skew — two transactions read an overlapping set, check an invariant, and write different rows, jointly violating it with no write-write conflict to trigger abort"
      - "Dirty reads, where a transaction reads another transaction's prewritten but not-yet-committed value because SI exposes uncommitted lock cells to concurrent readers"
      - "Lost updates on the same row, where two transactions read a row, both compute a new value, and the second overwrites the first with no conflict detected by SI"
      - "Non-repeatable reads within a transaction, where re-reading the same row inside one transaction returns a newer value committed by another transaction meanwhile"
    answer: 0
    explanation: |
      SI (via first-committer-wins on write-write conflicts and MVCC snapshots) prevents dirty
      reads, non-repeatable reads, and same-row lost updates, but not write skew, where the two
      txns touch different rows. TiDB adds pessimistic locking / SSI-like checks to close this.
    ref: "concepts.md#percolator-snapshot-isolation-on-bigtable"

  - id: distributed-transactions-advanced-034
    difficulty: advanced
    tags: [percolator, throughput, latency, tso]
    question: |
      What workload was Percolator designed for, and what are its main scaling caveats?
    options:
      - "Low-latency interactive OLTP with strict per-transaction deadlines; its only real scaling caveat is running out of disk space as the MVCC version history grows"
      - "Real-time analytics with sub-millisecond commit latency, designed to serve online dashboards where each transaction must return well under a millisecond"
      - "High-throughput incremental/batch processing (Google's web index), tolerating higher per-txn latency; caveats include the Timestamp Oracle as a logical bottleneck/SPOF and lazy lock cleanup leaving stale locks until a conflicting reader resolves them"
      - "Single-key key-value caching workloads, where each operation touches exactly one key and no cross-row transaction or snapshot coordination is ever required"
    answer: 2
    explanation: |
      Percolator traded latency for massive parallel throughput in index maintenance. The TSO
      is a logical central point (mitigated by batching/HA), and lazy, lock-based recovery
      means abandoned locks linger (bounded by TTL) until a conflicting reader cleans them.
    ref: "concepts.md#percolator-snapshot-isolation-on-bigtable"

  - id: distributed-transactions-advanced-035
    difficulty: advanced
    tags: [percolator, 2pc, decentralized]
    question: |
      How is Percolator's commit protocol related to 2PC?
    options:
      - "It abandons 2PC entirely in favor of running a per-key Paxos consensus round for every cell written, replacing prepare/commit phases with replicated agreement"
      - "It is essentially a decentralized 2PC (prewrite = prepare, commit primary then secondaries = commit) that uses the data store itself and lock/write columns for coordination instead of a dedicated always-on transaction manager"
      - "It uses three-phase commit, adding a pre-commit round on top of 2PC so that in-doubt participants can safely time out and commit without blocking"
      - "It is a single-phase commit because BigTable is already strongly consistent, so all cells can be written and made durable in one atomic pass with no prepare step"
    answer: 1
    explanation: |
      Prewrite (lock + tentative value) mirrors prepare; committing the primary then rolling
      secondaries forward mirrors the decision phase. Coordination lives in the store's lock
      and write columns and the primary row, avoiding a separate long-lived coordinator.
    ref: "concepts.md#percolator-snapshot-isolation-on-bigtable"

  # ---------------- Calvin ----------------
  - id: distributed-transactions-advanced-036
    difficulty: advanced
    tags: [calvin, determinism, order-then-execute]
    question: |
      What is Calvin's core insight that lets it eliminate 2PC?
    options:
      - "It makes the underlying network fully synchronous with bounded message delays, so the commit phase can never stall waiting on a slow or silent participant"
      - "It commits every transaction optimistically without locks and rolls back the losers whenever a write-write conflict is detected at validation time"
      - "It funnels every transaction through a single global lock so that only one runs at a time, making a distributed commit vote unnecessary because there is never contention"
      - "If replicas agree on a global order first and execute deterministically, every replica independently reaches the same result — so there is no non-deterministic abort to agree on at the end, hence no distributed commit vote"
    answer: 3
    explanation: |
      2PC exists to handle non-deterministic mid-txn failures. Calvin's order-then-execute
      moves the only cross-node agreement to sequencing; deterministic execution guarantees
      identical outcomes across replicas, so there's nothing to negotiate at commit time.
    ref: "concepts.md#calvin-and-deterministic-transactions"

  - id: distributed-transactions-advanced-037
    difficulty: expert
    tags: [calvin, read-write-set, ollp]
    question: |
      Calvin needs a transaction's read/write set known before ordering. How does it handle a
      transaction whose access set is data-dependent?
    options:
      - "It refuses such transactions entirely, rejecting any statement whose read/write set is not fully enumerated up front and forcing the client to rewrite it as fixed-key operations first"
      - "It falls back to classic 2PC for that single transaction, running a prepare/commit vote across the affected partitions at execution time while keeping all other transactions on the deterministic path"
      - "It runs a reconnaissance query to discover the likely sets, submits with those, and if the actual set changed during execution it retries (optimistic lock-location prediction, OLLP)"
      - "It defensively acquires locks on every partition in the database before ordering, holding a cluster-wide exclusive latch until the transaction's true access set is revealed and then releasing the unused ones"
    answer: 2
    explanation: |
      OLLP: a recon read discovers the probable read/write set; the txn is ordered against
      that prediction, and if execution reveals the set changed, it re-executes. This is why
      interactive/open-ended transactions are awkward in Calvin.
    ref: "concepts.md#calvin-and-deterministic-transactions"

  - id: distributed-transactions-advanced-038
    difficulty: advanced
    tags: [calvin, tradeoff, latency]
    question: |
      What does Calvin gain and give up compared to a traditional interactive transaction
      system?
    options:
      - "Gains removal of 2PC/blocking, trivial replication (replay the ordered log), and great high-contention throughput; gives up flexibility for interactive/ad-hoc transactions and adds an epoch-batching latency floor per transaction"
      - "Gains rich interactive/ad-hoc transaction flexibility with mid-transaction branching and side effects; gives up throughput because every transaction must still run a full 2PC vote across partitions"
      - "Gains lower single-transaction latency by skipping the ordering step; gives up serializability, settling for snapshot isolation so that write skew between concurrent transactions becomes possible"
      - "Gains nothing measurable in practice; it remains a purely theoretical model that was never productionized in any real database and only exists as an academic simulation"
    answer: 0
    explanation: |
      Determinism deletes 2PC and makes replication a log replay, and short predictable
      contention footprints boost throughput. The costs are limited interactivity (need
      pre-declared sets, deterministic logic, no mid-txn side effects) and waiting for the
      ordering epoch. FaunaDB productionized this; VoltDB is related.
    ref: "concepts.md#calvin-and-deterministic-transactions"

  - id: distributed-transactions-advanced-039
    difficulty: expert
    tags: [calvin, determinism, constraints]
    question: |
      Which transaction property would BREAK Calvin's determinism guarantee?
    options:
      - "Reading multiple rows spread across many partitions, because fan-out reads force each replica to observe a slightly different set of row versions"
      - "Writing to more than one partition in a single transaction, since cross-partition writes require replicas to coordinate commit order non-deterministically"
      - "Being part of a large epoch batch, because bigger batches change the interleaving of transactions differently on each replica"
      - "Branching on the current wall-clock time or a random value, so different replicas could take different paths"
    answer: 3
    explanation: |
      Deterministic execution requires that identical inputs and order yield identical results
      on every replica. Non-deterministic inputs (wall clock, RNG, non-deterministic iteration)
      let replicas diverge. Cross-partition reads/writes and batching are fine.
    ref: "concepts.md#calvin-and-deterministic-transactions"

  - id: distributed-transactions-advanced-040
    difficulty: advanced
    tags: [calvin, spanner, contrast]
    question: |
      How does Calvin contrast with Spanner at the architectural level?
    options:
      - "Both avoid 2PC using deterministic execution, ordering transactions up front so that neither system ever needs a cross-shard prepare/commit vote at runtime"
      - "Spanner keeps interactive transactions and pays for 2PC-over-Paxos plus TrueTime commit-wait; Calvin refuses interactive generality to delete 2PC — execute-then-agree vs order-then-execute"
      - "Calvin relies on GPS/atomic-clock TrueTime to timestamp transactions, while Spanner instead uses a deterministic global sequencer to order them without any physical clocks"
      - "They are essentially the same system under different names, sharing one codebase and differing only in the marketing terms their respective research groups adopted"
    answer: 1
    explanation: |
      Spanner supports general interactive txns and therefore needs 2PC across Paxos groups
      plus TrueTime for ordering; Calvin constrains transactions (pre-declared sets,
      determinism) to remove 2PC altogether. The fork is order-first vs execute-then-commit.
    ref: "concepts.md#calvin-and-deterministic-transactions"

  # ---------------- Spanner ----------------
  - id: distributed-transactions-advanced-041
    difficulty: advanced
    tags: [spanner, paxos-commit, coordinator]
    question: |
      How does Spanner make 2PC survivable for read-write transactions spanning shards?
    options:
      - "By running 2PC where each participant AND the coordinator is itself a Paxos group, so any single failure is survived and a new leader recovers the decision from the replicated log"
      - "By using a single ultra-reliable coordinator machine on premium redundant hardware, so its transaction log is statistically guaranteed to survive any regional failure"
      - "By switching to three-phase commit across regions, adding a pre-commit round so survivors can time out and commit safely without ever blocking on the coordinator"
      - "By avoiding cross-shard transactions entirely and forcing every write to touch exactly one Paxos group, so no multi-shard commit protocol is ever required"
    answer: 0
    explanation: |
      Spanner shards data into Paxos groups; a multi-shard write is 2PC where every role is
      consensus-replicated (Gray-Lamport Paxos Commit in production). This removes the
      coordinator SPOF and lets a new leader resolve in-doubt state after failure.
    ref: "concepts.md#spanner-2pc-over-paxos-with-truetime"

  - id: distributed-transactions-advanced-042
    difficulty: expert
    tags: [spanner, truetime, commit-wait]
    question: |
      What is TrueTime's commit-wait and why does it exist?
    options:
      - "The coordinator waits for all Paxos replicas to fsync their commit records before replying, so commit-wait is simply the durability barrier that makes the write survive a crash"
      - "Clients wait a fixed 100 ms after each commit to smooth out load spikes, giving the leader a rate-limiting window that prevents timestamp assignment from overwhelming the group"
      - "After choosing commit timestamp s, Spanner blocks until TT.now().earliest > s (waiting out clock uncertainty ε) so that when the txn becomes visible, s is guaranteed to be in the past for every observer — giving external consistency"
      - "It waits for the next GPS satellite pulse to arrive and advance the local clock, so the commit timestamp is always pinned to a freshly received hardware time signal"
    answer: 2
    explanation: |
      TrueTime exposes time as an interval [earliest, latest] with uncertainty ε. Commit-wait
      sleeps out ε so no observer can see the commit before its assigned timestamp is truly
      past — ensuring real-time (external) ordering of transactions.
    ref: "concepts.md#spanner-2pc-over-paxos-with-truetime"

  - id: distributed-transactions-advanced-043
    difficulty: expert
    tags: [spanner, clock-uncertainty, latency, math]
    question: |
      If Spanner's TrueTime uncertainty ε shrinks from ~7 ms to ~1 ms, what is the direct effect
      on read-write transactions, and why?
    options:
      - "No effect at all; commit-wait duration is fixed by the Paxos round-trip time and is completely independent of the TrueTime uncertainty interval ε"
      - "Write latency drops, because commit-wait duration is proportional to ε (roughly 2ε across the protocol) — tighter clocks mean less time spent sleeping out uncertainty"
      - "Reads become slower to compensate, because tighter clock bounds force read-only snapshots to wait out a larger uncertainty window before they can return a consistent result"
      - "Throughput drops because tighter clocks require far more frequent GPS and atomic-clock synchronization traffic between nodes, saturating the network with time-sync messages"
    answer: 1
    explanation: |
      Commit-wait blocks for the uncertainty interval, so its cost scales with ε. Smaller ε
      (better GPS/atomic-clock infra) directly reduces the mandatory wait, lowering write
      latency — the whole reason Google invests in tight clocks.
    ref: "concepts.md#spanner-2pc-over-paxos-with-truetime"

  - id: distributed-transactions-advanced-044
    difficulty: advanced
    tags: [spanner, read-only, mvcc]
    question: |
      Why can Spanner read-only transactions be lock-free and scalable while read-write
      transactions are expensive?
    options:
      - "Read-only transactions skip Paxos entirely and always read stale data from a follower replica, trading correctness for speed by never seeing the latest committed writes"
      - "Reads are cached in the client after the first fetch, so subsequent read-only transactions never contact the database and therefore incur no coordination cost"
      - "Read-only transactions use eventual consistency, returning whatever version happens to be local and reconciling divergent replicas lazily in the background"
      - "A read-only txn picks a read timestamp and reads a consistent MVCC snapshot from any up-to-date replica, so it takes no locks and doesn't participate in 2PC — only read-write txns pay for 2PC and commit-wait"
    answer: 3
    explanation: |
      With MVCC, a read-only txn reads a snapshot at a chosen timestamp from any sufficiently
      up-to-date replica — no locks, no 2PC. Writes must coordinate across Paxos groups and pay
      commit-wait. This is why "reads scale, writes pay the price."
    ref: "concepts.md#spanner-2pc-over-paxos-with-truetime"

  - id: distributed-transactions-advanced-045
    difficulty: expert
    tags: [spanner, cap, cockroachdb]
    question: |
      Regarding CAP and clocks, which statement is most accurate about Spanner and its
      commodity-hardware descendants?
    options:
      - "Spanner is a true CA system that violates the CAP theorem outright, because TrueTime's atomic clocks let it deliver both full availability and consistency during a network partition"
      - "Spanner, CockroachDB, and YugabyteDB are all AP systems that favor availability over consistency, letting a partitioned minority keep serving writes and merging them later"
      - "Spanner is effectively CP (sacrifices availability of a partitioned minority since Paxos needs a quorum); CockroachDB/YugabyteDB replicate the architecture without atomic clocks, using HLC plus bounded skew (CockroachDB uses uncertainty restarts instead of commit-wait)"
      - "Spanner sidesteps the CAP theorem by making network partitions physically impossible on Google's backbone, and its commodity-hardware descendants inherit the same CA property"
    answer: 2
    explanation: |
      Spanner chooses consistency; a partitioned minority loses availability (quorum needed) —
      it's CP, "effectively CA" only because Google's network makes partitions rare. CockroachDB
      and YugabyteDB use hybrid logical clocks with bounded skew; CockroachDB restarts reads on
      uncertainty rather than commit-waiting.
    ref: "concepts.md#spanner-2pc-over-paxos-with-truetime"

  # ---------------- Isolation levels ----------------
  - id: distributed-transactions-advanced-046
    difficulty: expert
    tags: [serializable, linearizable, strict-serializable]
    question: |
      What distinguishes serializability from linearizability, and what is strict
      serializability?
    options:
      - "Serializability is a multi-object property (result equals SOME serial order, not necessarily real-time); linearizability is a single-object real-time property (a completed write is seen by later reads); strict serializability = serializable + linearizable (real-time order across multi-object transactions)"
      - "They are exact synonyms for the same guarantee, and strict serializability is simply that guarantee with transport-level encryption of the transaction log added on top"
      - "Linearizability is strictly weaker than serializability in every case, since it only orders single operations while serializability additionally enforces real-time ordering across them"
      - "Serializability guarantees real-time (wall-clock) ordering of transactions, whereas linearizability places no ordering constraint whatsoever and only requires that each object stay internally consistent"
    answer: 0
    explanation: |
      Serializability constrains multi-object transaction outcomes to some serial schedule but
      not necessarily matching wall-clock order; linearizability is a real-time, single-object
      guarantee. Combined, they give strict serializability — Spanner's "external consistency."
    ref: "concepts.md#isolation-levels-in-distributed-databases"

  - id: distributed-transactions-advanced-047
    difficulty: expert
    tags: [write-skew, snapshot-isolation]
    question: |
      Two on-call doctors each run a transaction that checks "at least one OTHER doctor is on
      duty" (currently true) and, seeing it's safe, takes themselves off duty. Under snapshot
      isolation both commit and now zero doctors are on duty. Why doesn't SI prevent this?
    options:
      - "SI has a well-known implementation bug in most databases that lets its version-visibility check leak concurrent writes, which is what allowed both to commit here"
      - "SI allows dirty reads, so each transaction read the other's uncommitted off-duty write and mistakenly concluded a colleague was still on duty"
      - "The transactions ran at the wrong isolation level by mistake; proper snapshot isolation would have detected the conflict and blocked one of them from committing"
      - "Each transaction writes a DIFFERENT row (its own on-duty flag), so there is no write-write conflict for first-committer-wins to catch — the reads that justified the writes are not re-validated; this is write skew"
    answer: 3
    explanation: |
      Write skew arises when transactions read an overlapping set, act on an invariant, and
      write disjoint rows. SI only aborts on write-write conflicts, which never occur here, so
      both proceed on stale reads. Serializable/SSI, materializing the conflict, or SELECT FOR
      UPDATE fix it.
    ref: "concepts.md#isolation-levels-in-distributed-databases"

  - id: distributed-transactions-advanced-048
    difficulty: advanced
    tags: [ssi, serializable, tradeoff]
    question: |
      Serializable Snapshot Isolation (SSI, as in PostgreSQL SERIALIZABLE) achieves
      serializability while keeping non-blocking reads. What is its characteristic cost?
    options:
      - "It holds long-lived shared read locks for the whole transaction duration, reducing concurrency by forcing writers to wait behind every active reader"
      - "It tracks read-write (anti-)dependencies and aborts a transaction in a dangerous cycle, so under contention you pay in false-positive aborts / retry rate rather than in lock waits"
      - "It only supports read-only transactions, rejecting any statement that performs a write because its dependency tracking cannot reason about mutations"
      - "It requires GPS and atomic clocks like Spanner's TrueTime to order the read-write dependencies it tracks, making it deployable only on specialized hardware"
    answer: 1
    explanation: |
      SSI keeps SI's optimistic, lock-free reads but monitors rw-antidependencies and proactively
      aborts to prevent non-serializable schedules. The trade-off is spurious aborts and retries
      under high write contention — you thrash rather than block.
    ref: "concepts.md#isolation-levels-in-distributed-databases"

  - id: distributed-transactions-advanced-049
    difficulty: intermediate
    tags: [snapshot-isolation, read-committed, anomalies]
    question: |
      Moving from Read Committed to Snapshot Isolation additionally prevents which anomalies?
    options:
      - "Non-repeatable reads and same-row lost updates (via first-committer-wins), while still allowing write skew"
      - "Write skew and all phantom reads, because the consistent snapshot re-validates the full read set at commit and aborts any transaction whose predicate matches new rows"
      - "Dirty writes only, since snapshot isolation adds nothing beyond preventing two transactions from overwriting each other's uncommitted values on the same row"
      - "Nothing additional; Read Committed and Snapshot Isolation are equivalent in practice and prevent exactly the same set of concurrency anomalies"
    answer: 0
    explanation: |
      SI reads from a consistent snapshot (no non-repeatable reads) and aborts write-write
      conflicts (no same-row lost updates), but it still permits write skew and some phantoms.
      Read Committed already prevents dirty reads/writes but allows non-repeatable reads.
    ref: "concepts.md#isolation-levels-in-distributed-databases"

  - id: distributed-transactions-advanced-050
    difficulty: advanced
    tags: [ssi, 2pl, contention, choice]
    question: |
      When would you prefer lock-based (2PL) serializability over SSI?
    options:
      - "Always, because 2PL is strictly better than SSI in every dimension — lower latency, higher concurrency, and fewer aborts under all workloads"
      - "When the workload is entirely read-only, since 2PL's shared locks then allow unlimited reader concurrency that SSI's snapshot mechanism cannot match"
      - "When write contention is high and you'd rather have transactions block-and-wait than repeatedly abort/retry (SSI's false positives thrash under heavy write contention); SSI shines on mostly-read workloads"
      - "Never; SSI strictly dominates 2PL because optimistic validation is always cheaper than acquiring and releasing locks, regardless of the contention level"
    answer: 2
    explanation: |
      SSI preserves high read concurrency but its optimistic aborts multiply under write
      contention, wasting work. 2PL blocks instead of aborting, which is preferable when
      contention is high and retries are expensive; SSI wins for read-heavy workloads.
    ref: "concepts.md#isolation-levels-in-distributed-databases"

  # ---------------- Idempotency ----------------
  - id: distributed-transactions-advanced-051
    difficulty: intermediate
    tags: [idempotency, exactly-once, delivery]
    question: |
      Why is "exactly-once delivery" impossible, and what is achievable instead?
    options:
      - "It is fully achievable with TCP alone; the protocol's acknowledgements and retransmissions guarantee every message is delivered precisely once, so no application-level work is needed"
      - "Because networks can drop/duplicate/reorder and a sender can't know if its message arrived, you can't guarantee exactly-once delivery — but you can get exactly-once EFFECT (processing) via idempotency plus deduplication"
      - "It is impossible and nothing can even approximate it, so distributed systems must simply tolerate that some operations run twice and others never run at all"
      - "It is only possible with fully synchronous replication, where every replica acknowledges each message before the sender proceeds, eliminating any chance of a duplicate or lost delivery"
    answer: 1
    explanation: |
      Retries after ambiguous failures inevitably create duplicates; the ambiguity is
      irreducible. The practical goal is exactly-once effect: an idempotency key + dedup store
      so a retried operation is applied at most once and returns the same result.
    ref: "concepts.md#idempotency-and-exactly-once-effects"

  - id: distributed-transactions-advanced-052
    difficulty: expert
    tags: [idempotency-key, atomicity, stripe]
    question: |
      In an idempotency-key design (e.g. Stripe's Idempotency-Key), what single invariant is
      correctness most dependent on?
    options:
      - "The key must be a randomly generated UUID version 4, since any other format risks collisions that would cause two distinct requests to be deduplicated as one"
      - "The dedup store must never expire keys under any circumstances, because a single expired key permanently breaks the exactly-once guarantee for the whole system"
      - "The client must send the idempotency key only on the very first attempt and omit it from all retries, so the server can distinguish originals from replays"
      - "Recording the key and applying the effect must happen ATOMICALLY (in the same local transaction); if they can diverge you get double effects or lost stored results"
    answer: 3
    explanation: |
      If the effect commits but the key isn't recorded, a retry re-executes (double charge); if
      the key is recorded but the effect doesn't apply, you return success for nothing. Binding
      both in one local txn is the crux. TTL and key format are secondary; retries must carry
      the key.
    ref: "concepts.md#idempotency-and-exactly-once-effects"

  - id: distributed-transactions-advanced-053
    difficulty: advanced
    tags: [idempotency, dedup-window, tradeoff]
    question: |
      How should you size the dedup/idempotency retention window?
    options:
      - "As short as physically possible to minimize storage cost, purging each key within a few seconds regardless of how long clients actually keep retrying"
      - "Exactly one second for all systems, a universal constant that safely covers every client's retry behavior regardless of network conditions or backoff policy"
      - "Long enough to cover the client's maximum retry horizon; too short re-admits duplicates after it expires, while infinite retention is safest but unbounded in storage"
      - "It doesn't matter at all; keys can be discarded immediately after the first successful use, because a genuine retry would always reuse a brand-new key anyway"
    answer: 2
    explanation: |
      Duplicates arrive within the client's retry horizon, so the window must at least cover it.
      Expiring earlier re-admits stale retries as new operations; never expiring is correct but
      grows storage without bound — hence a defensible TTL.
    ref: "concepts.md#idempotency-and-exactly-once-effects"

  - id: distributed-transactions-advanced-054
    difficulty: expert
    tags: [kafka, exactly-once, external-effects]
    question: |
      Kafka's exactly-once semantics (idempotent producer + transactions) guarantees what,
      precisely?
    options:
      - "Exactly-once PROCESSING within Kafka — atomic writes across partitions plus offset commit, and producer dedup by producer-id + sequence — but it does NOT extend exactly-once to arbitrary external side effects like a third-party charge"
      - "Exactly-once delivery to any external system Kafka talks to, so a downstream payment gateway or REST API is guaranteed to receive each record precisely one time"
      - "That consumers never need to be idempotent, because Kafka's transactional guarantees remove all duplicate processing end to end for any application reading the topic"
      - "A global two-phase commit spanning Kafka and all downstream databases, atomically binding the log write to every external system's commit in one distributed transaction"
    answer: 0
    explanation: |
      Kafka EOS scopes to Kafka: idempotent producer dedups within the log, and transactions
      atomically bind produced records with consumer offsets. External side effects still need
      end-to-end idempotency keys; EOS is not a distributed transaction across foreign systems.
    ref: "concepts.md#idempotency-and-exactly-once-effects"

  - id: distributed-transactions-advanced-055
    difficulty: intermediate
    tags: [idempotency, natural-idempotence]
    question: |
      Which operation is naturally idempotent without needing an idempotency key?
    options:
      - "increment the stored account balance by 10 on each processed request"
      - "append a new event record to an append-only audit log stream"
      - "send a confirmation email to the customer on every invocation"
      - "upsert user row keyed by user_id with a fixed set of field values (or SET x = 5)"
    answer: 3
    explanation: |
      Setting a value or upserting by a natural key yields the same state no matter how many
      times it runs — naturally idempotent. Increment, append, and send-email accumulate effects
      on each retry, so they need a dedup key to be exactly-once.
    ref: "concepts.md#idempotency-and-exactly-once-effects"

  # ---------------- Outbox vs dual write ----------------
  - id: distributed-transactions-advanced-056
    difficulty: advanced
    tags: [dual-write, outbox, atomicity]
    question: |
      Why is there no safe ordering for the "dual write" of updating a DB and publishing an
      event to a broker?
    options:
      - "Publishing the event to the broker first and committing the DB afterward is always safe, because the broker durably buffers the event until the commit confirms it"
      - "Publish-then-commit can emit an event for a txn that later rolls back; commit-then-publish can lose the event if the process crashes after commit — neither order is atomic across the two systems"
      - "Committing the DB write first and publishing the event afterward is always safe, since a committed row can never be lost and the publish will simply retry until it succeeds"
      - "The two writes are already enlisted in one shared transaction by the driver, so the broker publish and the DB commit atomically succeed or fail together"
    answer: 1
    explanation: |
      Two independent systems with no shared transaction have a failure window in either order:
      you either emit phantom events for rolled-back work or lose events for committed work. It's
      a distributed-atomicity problem, which the outbox pattern solves.
    ref: "concepts.md#the-outbox-pattern-versus-dual-writes"

  - id: distributed-transactions-advanced-057
    difficulty: advanced
    tags: [outbox, atomicity, relay]
    question: |
      How does the transactional outbox pattern make the DB-update-and-publish operation
      atomic?
    options:
      - "It writes the event into an outbox table in the SAME local DB transaction as the business change; a separate relay later reads the outbox and publishes, so the single DB commit is the atomic point and the event is guaranteed to eventually publish"
      - "It enlists the DB and the broker in an XA 2PC transaction so both the business row and the published event commit together atomically under one coordinator"
      - "It publishes the event to the broker first and only commits the DB write once the broker has acknowledged receipt, so the acknowledgement guarantees consistency"
      - "It buffers the pending events in the service's memory and flushes them to the broker only after the broker confirms the DB commit succeeded"
    answer: 0
    explanation: |
      Because the event and the business row commit together in one local txn, there is one
      atomic point. The relay guarantees eventual publication from the durable outbox — no
      cross-system 2PC needed. Delivery is at-least-once, so consumers must be idempotent.
    ref: "concepts.md#the-outbox-pattern-versus-dual-writes"

  - id: distributed-transactions-advanced-058
    difficulty: expert
    tags: [outbox, at-least-once, idempotency]
    question: |
      What delivery semantics does the outbox pattern provide, and what does that require of
      consumers?
    options:
      - "Exactly-once delivery guaranteed by the relay marking each outbox row sent inside the same commit as the publish, so consumers can safely assume no duplicates ever arrive"
      - "At-most-once delivery, because the relay deletes each outbox row before attempting to publish it, so any crash mid-publish silently drops the event and consumers may miss it"
      - "At-least-once (the relay may crash after publishing but before marking the row sent, causing re-publication), so consumers must be idempotent — outbox and idempotency are complementary"
      - "Strictly ordered exactly-once delivery with total per-key ordering enforced by the relay, imposing no idempotency or deduplication requirement on downstream consumers"
    answer: 2
    explanation: |
      The publish-then-mark-sent gap means an event can be re-published after a relay crash, so
      the guarantee is at-least-once. Idempotent (dedup-capable) consumers turn that into
      effectively-once processing — the two patterns work together.
    ref: "concepts.md#the-outbox-pattern-versus-dual-writes"

  - id: distributed-transactions-advanced-059
    difficulty: advanced
    tags: [outbox, cdc, polling, debezium]
    question: |
      What is the trade-off between a polling relay and a CDC/log-tailing relay (e.g. Debezium)
      for the outbox?
    options:
      - "Polling delivers strictly lower latency and imposes no query load on the database, so a CDC/log-tailing relay is worse on every axis and only adds needless infrastructure"
      - "Polling is simple but adds query load and latency and needs indexing/cleanup; CDC tails the DB's WAL/binlog for lower latency and no polling load, at the cost of CDC infrastructure and a dependency on the DB's replication log"
      - "CDC relies on an XA transaction that enlists the WAL and the broker together, whereas polling avoids distributed transactions by simply reading the outbox table directly"
      - "They are functionally identical in latency, load, and operational cost, so the choice between polling and CDC is purely a matter of team familiarity"
    answer: 1
    explanation: |
      Polling is easy to build but periodically scans the table (load + latency, plus cleanup).
      Log-tailing reads committed changes from the WAL/binlog with lower latency and no polling
      load, but you must run and operate CDC (e.g. Debezium) and depend on the DB's log format.
    ref: "concepts.md#the-outbox-pattern-versus-dual-writes"

  - id: distributed-transactions-advanced-060
    difficulty: expert
    tags: [outbox, xa, broker, tradeoff]
    question: |
      Why is the outbox preferred over an XA transaction spanning the DB and the message broker?
    options:
      - "XA is faster and operationally simpler in every case, since a single prepare/commit round is cheaper than running a relay that continuously scans and publishes from an outbox table"
      - "The outbox provides strictly stronger exactly-once delivery guarantees than XA, so consumers reading from an outbox-fed broker never need to deduplicate incoming events"
      - "XA transactions are physically incapable of enlisting a message broker as a resource manager, so they can update the database but can never publish an event at all"
      - "XA between DB and broker is poorly supported by many brokers and reintroduces 2PC blocking/coupled availability; the outbox avoids cross-system 2PC by using one local DB txn, accepting eventual, at-least-once, idempotent-consumer semantics instead"
    answer: 3
    explanation: |
      Distributed XA reintroduces exactly the blocking and availability coupling 2PC brings, and
      broker XA support is weak/operationally painful. The outbox keeps atomicity where it's
      cheap (local DB) and does the rest asynchronously — the recommended microservices pattern.
    ref: "concepts.md#the-outbox-pattern-versus-dual-writes"

  # ---------------- Choosing / avoiding ----------------
  - id: distributed-transactions-advanced-061
    difficulty: advanced
    tags: [ddd, aggregate, avoid, boundaries]
    question: |
      A team needs an operation across two services to be atomic and keeps reaching for 2PC.
      What is the senior first move (per DDD)?
    options:
      - "Immediately implement XA 2PC across both services, enlisting each service's database as a resource manager under a shared coordinator to get true atomic commit"
      - "Switch to a saga with compensating transactions right away, without first analyzing whether the two services even belong on opposite sides of a consistency boundary"
      - "Question the service boundaries: if an invariant must always hold across both, they likely belong in one aggregate/consistency boundary — redesign so the atomic operation is a single local ACID transaction, avoiding distribution entirely"
      - "Add a global distributed lock service (e.g. ZooKeeper/etcd) so each service grabs a shared lock before writing, serializing the two updates into one atomic-looking operation"
    answer: 2
    explanation: |
      The best distributed transaction is the one you design away. DDD says an aggregate is a
      consistency boundary; an invariant spanning two services usually signals a wrong seam.
      Merging them yields real ACID locally with no coordination. Saga/2PC come only if it must
      truly span boundaries.
    ref: "concepts.md#choosing-saga-versus-2pc-versus-avoiding-the-distributed-transaction"

  - id: distributed-transactions-advanced-062
    difficulty: expert
    tags: [decision, saga, 2pc, deterministic]
    question: |
      Match the situation to the best approach: (a) a long-running cross-service order flow
      needing high availability and no cross-service locks, (b) multi-shard writes inside one
      distributed SQL database needing strict isolation, (c) high-contention workload where
      read/write sets can be pre-declared.
    options:
      - "(a) saga, (b) 2PC over a consensus-backed coordinator, (c) deterministic (Calvin-style) execution"
      - "(a) 2PC with a blocking coordinator, (b) saga with compensating transactions, (c) 3PC's extra pre-commit round"
      - "(a) deterministic (Calvin-style) execution, (b) saga with compensating transactions, (c) 2PC over a consensus-backed coordinator"
      - "(a) 3PC's non-blocking pre-commit round, (b) deterministic (Calvin-style) execution, (c) saga with compensating transactions"
    answer: 0
    explanation: |
      Cross-service business flows fit sagas (availability, no cross-service locks); strict
      isolation inside one storage system fits 2PC with a consensus-backed coordinator
      (Spanner-style); pre-declarable high-contention workloads fit deterministic execution
      (Calvin), which removes 2PC and its blocking.
    ref: "concepts.md#choosing-saga-versus-2pc-versus-avoiding-the-distributed-transaction"

  - id: distributed-transactions-advanced-063
    difficulty: advanced
    tags: [aggregate, reference-by-id, eventual]
    question: |
      Vaughn Vernon's aggregate-design rule for transactions is best stated as:
    options:
      - "Modify as many aggregates as a single use case requires within one transaction, since keeping them all strongly consistent together is what a transaction is for"
      - "Never wrap changes in database transactions at all; rely entirely on eventual consistency and background reconciliation for every aggregate update in the system"
      - "Always wrap any change that spans two or more aggregates in an XA 2PC transaction so their invariants commit atomically across the aggregate boundaries"
      - "Modify one aggregate per transaction; reference other aggregates by id and reconcile them eventually (e.g. via events/sagas)"
    answer: 3
    explanation: |
      The rule keeps each transaction within a single aggregate (one consistency boundary),
      referencing others by identity and updating them asynchronously. This is what keeps most
      operations local-ACID and pushes cross-aggregate coordination to eventual mechanisms.
    ref: "concepts.md#choosing-saga-versus-2pc-versus-avoiding-the-distributed-transaction"

  - id: distributed-transactions-advanced-064
    difficulty: expert
    tags: [decision, xa, anti-pattern, availability]
    question: |
      Why is XA 2PC across heterogeneous microservice databases specifically discouraged even
      though 2PC works inside a single distributed database?
    options:
      - "Microservice databases are always slower than the shards inside one distributed database, so the extra XA round trips push commit latency past acceptable limits"
      - "Across independent services you inherit blocking, coupled availability (every service's uptime tied to the coordinator and each other), and painful operations like heuristic decisions — whereas inside one storage system you can make the coordinator consensus-backed and control lock lifetimes"
      - "XA is not implemented by any mainstream microservice framework or language runtime, so there is simply no library available to enlist the services in a shared transaction"
      - "Sagas with compensating transactions are mandated by the microservices architecture specification, which formally prohibits any use of two-phase commit between services"
    answer: 1
    explanation: |
      A single DB can replicate its coordinator and manage locks; independent services can't, so
      XA there means cross-service blocking, availability coupling, and operator heuristics. The
      distinction is control over the coordinator and lock lifetimes, not raw speed.
    ref: "concepts.md#choosing-saga-versus-2pc-versus-avoiding-the-distributed-transaction"

  - id: distributed-transactions-advanced-065
    difficulty: intermediate
    tags: [summary, comparison, availability]
    question: |
      Which one-line summary correctly captures the failure characteristics of these
      approaches?
    options:
      - "2PC blocks on coordinator failure, 3PC can violate atomicity under partitions, and sagas drop isolation by default"
      - "2PC is non-blocking on coordinator failure, 3PC stays safe under network partitions, and sagas provide full ACID isolation across services"
      - "All three approaches provide complete ACID guarantees with no availability or isolation trade-offs, so the choice among them is purely one of implementation convenience"
      - "Sagas block on coordinator failure, 2PC silently drops isolation between transactions, and 3PC is the recommended modern standard for cross-service atomicity"
    answer: 0
    explanation: |
      The accurate summary: 2PC's weakness is blocking on coordinator/participant failure; 3PC's
      non-blocking claim fails (atomicity violation) under network partition; sagas trade away
      isolation for availability. The other options invert these facts.
    ref: "concepts.md#choosing-saga-versus-2pc-versus-avoiding-the-distributed-transaction"
