topic: "API Layer on AWS: API Gateway, AppSync and GraphQL"
domain: system-design
topic_slug: aws-api-layer-apigateway-appsync
version: 1
questions:
  - id: aws-api-layer-apigateway-appsync-001
    difficulty: beginner
    tags: [api-gateway, rest-vs-http, cost]
    question: |
      Compared to API Gateway REST APIs, HTTP APIs are primarily chosen because they:
    options:
      - "Cost roughly 70% less per request and add lower latency overhead, at the price of fewer features"
      - "Are the only API type that can integrate with Lambda"
      - "Provide built-in monthly usage quotas and per-key metering"
      - "Support request/response VTL mapping templates that REST APIs lack"
    answer: 0
    explanation: |
      HTTP APIs are the leaner v2 rewrite: ~70% cheaper per request and lower latency, but they drop
      features like VTL mapping, API keys/usage plans, per-method caching, and request validation.
      VTL mapping and usage plans are REST-only, so those options are backwards. Both types integrate
      with Lambda, so that option is false.
    ref: "concepts.md#api-gateway-rest-vs-http-vs-websocket-api"

  - id: aws-api-layer-apigateway-appsync-002
    difficulty: beginner
    tags: [api-gateway, timeout]
    question: |
      What was the long-standing hard maximum integration timeout for an API Gateway REST/HTTP API
      request before the 2024 change for Regional REST APIs?
    options:
      - "5 seconds"
      - "29 seconds"
      - "15 minutes"
      - "60 seconds"
    answer: 1
    explanation: |
      The classic hard ceiling is 29 seconds (50 ms minimum). 15 minutes is Lambda's max duration, not
      the gateway's. In June 2024 AWS made it adjustable above 29 s for Regional/private REST APIs only,
      at the cost of a lower account throttle quota; HTTP APIs remain capped near 30 s.
    ref: "concepts.md#the-29-second-integration-timeout"

  - id: aws-api-layer-apigateway-appsync-003
    difficulty: beginner
    tags: [websocket, real-time]
    question: |
      Which API Gateway type maintains a stateful, bidirectional connection so the server can push
      messages to a connected client?
    options:
      - "REST API"
      - "HTTP API"
      - "WebSocket API"
      - "Private API"
    answer: 2
    explanation: |
      WebSocket APIs keep a persistent connection and push via the @connections callback API using the
      stored connection ID. REST and HTTP APIs are request/response only; a Private API is an endpoint
      type of REST, not a push mechanism.
    ref: "concepts.md#api-gateway-rest-vs-http-vs-websocket-api"

  - id: aws-api-layer-apigateway-appsync-004
    difficulty: beginner
    tags: [appsync, graphql]
    question: |
      What is the core value proposition of GraphQL (AppSync) over a traditional REST API for a
      data-rich mobile screen?
    options:
      - "It eliminates the need for any authorization"
      - "It always caches responses at the CDN edge more easily than REST"
      - "It guarantees stronger write consistency than DynamoDB"
      - "The client requests exactly the fields it needs in one call that can fan out to multiple sources, avoiding over-fetching and under-fetching"
    answer: 3
    explanation: |
      GraphQL lets the client specify exact fields and fetch from many data sources in one request,
      avoiding over-fetching and multiple round trips. It does not change database consistency, still
      needs authorization, and is actually harder to CDN-cache than REST (everything is POST /graphql).
    ref: "concepts.md#appsync-and-managed-graphql"

  - id: aws-api-layer-apigateway-appsync-005
    difficulty: beginner
    tags: [api-keys, security]
    question: |
      In API Gateway, an API key is best described as:
    options:
      - "An identifier used to meter and associate callers with a usage plan, not an authentication mechanism"
      - "A TLS client certificate for mutual TLS"
      - "An IAM role assumed by the caller"
      - "A strong authentication mechanism that replaces the need for an authorizer"
    answer: 0
    explanation: |
      API keys identify and meter callers (via usage plans); they are explicitly NOT authentication and
      should be paired with an authorizer for sensitive APIs. They are not TLS certs or IAM roles.
    ref: "concepts.md#throttling-usage-plans-and-api-keys"

  - id: aws-api-layer-apigateway-appsync-006
    difficulty: beginner
    tags: [stages, versioning]
    question: |
      What is an API Gateway "stage"?
    options:
      - "A physical availability zone the API runs in"
      - "A named, immutable deployment snapshot (e.g. dev or prod) with its own variables, throttling, cache, and logging"
      - "A billing tier for API keys"
      - "A GraphQL resolver pipeline step"
    answer: 1
    explanation: |
      A stage is a named deployment (dev/test/prod) with its own stage variables, throttle settings,
      cache, and logging config. It is not an AZ, a billing tier, or a resolver step.
    ref: "concepts.md#versioning-and-stages"

  - id: aws-api-layer-apigateway-appsync-007
    difficulty: beginner
    tags: [alb, fargate, containers]
    question: |
      Which statement about putting an Application Load Balancer (ALB) in front of Fargate for an API
      is correct?
    options:
      - "ALB can only route TCP at layer 4, never HTTP"
      - "ALB provides built-in API keys, usage plans, and request validation"
      - "ALB is a load balancer, not an API-management product; it lacks API keys, usage plans, per-method caching, and SDK generation"
      - "ALB enforces the same hard 29-second request timeout as API Gateway"
    answer: 2
    explanation: |
      ALB is an L7 load balancer with path/host routing but none of API Gateway's management features
      (keys, usage plans, validation, caching, SDKs). Its idle timeout is configurable (no fixed 29 s
      cap). NLB is the L4 option; ALB does route HTTP.
    ref: "concepts.md#api-gateway-plus-lambda-vs-alb-plus-fargate-for-apis"

  - id: aws-api-layer-apigateway-appsync-008
    difficulty: beginner
    tags: [waf, security]
    question: |
      What does AWS WAF add on top of API Gateway's built-in throttling?
    options:
      - "It increases the Lambda concurrency limit"
      - "It provides GraphQL schema validation"
      - "It replaces TLS termination"
      - "Rate-based rules, SQLi and XSS managed rules, geo-blocking, and IP allow/deny lists to block malicious traffic before it consumes throttle budget"
    answer: 3
    explanation: |
      WAF is a security layer: rate-based rules, managed SQLi/XSS groups, geo/IP rules. Throttling is a
      capacity/fairness control, not a security control, so WAF complements it. WAF does not do TLS,
      raise Lambda concurrency, or validate GraphQL schemas.
    ref: "concepts.md#rate-limiting-and-waf-integration"

  - id: aws-api-layer-apigateway-appsync-009
    difficulty: beginner
    tags: [caching, rest-api]
    question: |
      API Gateway's built-in response caching is available on which API type?
    options:
      - "REST API only"
      - "All three equally"
      - "HTTP API only"
      - "WebSocket API only"
    answer: 0
    explanation: |
      Stage-level caching is a REST API feature. HTTP APIs and WebSocket APIs do not offer built-in
      caching; for HTTP APIs you'd front with CloudFront instead.
    ref: "concepts.md#caching-request-and-response-mapping"

  - id: aws-api-layer-apigateway-appsync-010
    difficulty: beginner
    tags: [authorizers, iam]
    question: |
      Which authorizer type is most natural for service-to-service calls between AWS components with no
      separate token server?
    options:
      - "Cognito User Pools authorizer"
      - "IAM authorization (SigV4 signed requests)"
      - "A custom Lambda authorizer parsing opaque tokens"
      - "API key only"
    answer: 1
    explanation: |
      IAM (AWS_IAM) auth uses SigV4 signing and existing IAM policies, ideal for AWS-internal service
      calls with no token infrastructure. Cognito/Lambda authorizers suit user-facing or bespoke auth;
      an API key alone is not authentication.
    ref: "concepts.md#authorizers-iam-cognito-and-lambda"

  - id: aws-api-layer-apigateway-appsync-011
    difficulty: intermediate
    tags: [rest-vs-http, feature-selection]
    question: |
      A team wants the cheapest, lowest-latency API in front of a Lambda proxy, needs JWT validation
      against Cognito, and does NOT need API keys, VTL, or per-method caching. Which do you recommend?
    options:
      - "ALB + Fargate to avoid per-request pricing"
      - "REST API, because only REST can integrate with Cognito"
      - "HTTP API with a native JWT authorizer"
      - "WebSocket API, since it is the newest type"
    answer: 2
    explanation: |
      HTTP API is the cheapest/lowest-latency option and supports native JWT authorizers (works with
      Cognito/any OIDC). REST is more expensive and only needed for its extra features. WebSocket is for
      push. ALB+Fargate adds ops burden for no benefit at low volume.
    ref: "concepts.md#api-gateway-rest-vs-http-vs-websocket-api"

  - id: aws-api-layer-apigateway-appsync-012
    difficulty: intermediate
    tags: [usage-plans, saas, multi-tenant]
    question: |
      You must offer tiered SaaS plans: free = 10 RPS / 10k requests per day, pro = 100 RPS / 1M per
      day, enforced per customer. Which design fits with the least custom code?
    options:
      - "WebSocket API with per-connection throttling"
      - "ALB with target-group weighting"
      - "HTTP API with a Lambda authorizer that counts requests in DynamoDB"
      - "REST API with usage plans + API keys, one plan per tier attaching rate, burst, and quota"
    answer: 3
    explanation: |
      REST API usage plans natively bind rate, burst, and a request quota to API keys per tier — exactly
      this requirement, no custom code. HTTP API lacks usage plans, so you'd have to build metering.
      WebSocket throttling and ALB weighting don't provide per-tenant quotas.
    ref: "concepts.md#throttling-usage-plans-and-api-keys"

  - id: aws-api-layer-apigateway-appsync-013
    difficulty: intermediate
    tags: [timeout, async, long-running]
    question: |
      A synchronous REST endpoint occasionally needs ~90 seconds of backend processing. What is the
      correct redesign?
    options:
      - "Return 202 Accepted with a job ID immediately, run the work asynchronously (Step Functions or SQS), and let the client poll or receive a push via WebSocket or AppSync"
      - "Switch to an HTTP API, which has no timeout"
      - "Enable API Gateway caching so the response returns instantly"
      - "Increase the Lambda timeout to 90 s and rely on API Gateway to wait"
    answer: 0
    explanation: |
      The gateway's ~29 s ceiling is shorter than the work, so it will 504 even if Lambda runs longer.
      The pattern is async: 202 + job id, do work out-of-band, then poll or push. Raising Lambda timeout
      doesn't help the gateway. HTTP APIs still cap near 30 s. Caching doesn't create the first result.
    ref: "concepts.md#the-29-second-integration-timeout"

  - id: aws-api-layer-apigateway-appsync-014
    difficulty: intermediate
    tags: [caching, cost, trade-off]
    question: |
      What is the PRIMARY trade-off of enabling API Gateway's stage-level cache for a read-heavy GET?
    options:
      - "It reduces durability of stored objects"
      - "It is a fixed hourly cost regardless of hit rate and can serve stale data up to the TTL, in exchange for lower latency and fewer backend invocations"
      - "It forces you to switch to an HTTP API"
      - "It disables all authorizers on the stage"
    answer: 1
    explanation: |
      The cache is billed per hour by size no matter the hit rate, and returns data that can be stale
      within the TTL window; the payoff is lower latency and fewer Lambda/DynamoDB calls. It doesn't
      affect durability, force an API type, or disable authorizers.
    ref: "concepts.md#caching-request-and-response-mapping"

  - id: aws-api-layer-apigateway-appsync-015
    difficulty: intermediate
    tags: [lambda-less, vtl, direct-integration]
    question: |
      A REST API integrates directly with DynamoDB using VTL mapping templates (no Lambda). What do you
      gain and give up versus a thin Lambda?
    options:
      - "Gain: automatic multi-Region. Give up: caching"
      - "Gain: WebSocket support. Give up: IAM auth"
      - "Gain: removes Lambda cost, cold starts, and a failure hop. Give up: VTL is hard to test, debug, and version"
      - "Gain: stronger consistency. Give up: nothing meaningful"
    answer: 2
    explanation: |
      Direct AWS-service integration removes Lambda's cost, cold starts, and an extra failure point, but
      VTL logic is notoriously hard to test/debug/version. It changes neither DynamoDB consistency nor
      Region topology, and is unrelated to WebSockets/IAM.
    ref: "concepts.md#caching-request-and-response-mapping"

  - id: aws-api-layer-apigateway-appsync-016
    difficulty: intermediate
    tags: [authorizers, lambda-authorizer, latency]
    question: |
      Why should you enable result caching on a Lambda authorizer, and what does it trade off?
    options:
      - "To increase the token size limit"
      - "To bypass IAM policy evaluation entirely"
      - "To make the token more secure; it trades off nothing"
      - "To avoid invoking the authorizer Lambda on every request (saving latency and cost), at the cost of using a cached authorization decision for up to the TTL"
    answer: 3
    explanation: |
      Without caching, every request pays the authorizer Lambda's latency and invocation cost. Caching
      (default TTL 300 s) reuses the decision but means a revoked token could remain valid until the
      cache expires. It doesn't affect token size or bypass IAM.
    ref: "concepts.md#authorizers-iam-cognito-and-lambda"

  - id: aws-api-layer-apigateway-appsync-017
    difficulty: intermediate
    tags: [endpoint-types, edge, latency]
    question: |
      When is an edge-optimized REST API endpoint the right default?
    options:
      - "When clients are geographically dispersed and you want TLS to terminate at the nearest CloudFront edge, and you do not run your own CloudFront distribution"
      - "When the API must be reachable only from within a VPC"
      - "When you need multi-Region active-active resilience automatically"
      - "When clients are all in the same Region as the API and you want to attach your own CloudFront"
    answer: 0
    explanation: |
      Edge-optimized routes global clients through CloudFront edges to the single home Region, lowering
      network latency. In-Region clients favor Regional (and let you add your own CloudFront). VPC-only
      is Private. Edge-optimized does NOT give multi-Region resilience — the backend is one Region.
    ref: "concepts.md#edge-optimized-regional-and-private-endpoints"

  - id: aws-api-layer-apigateway-appsync-018
    difficulty: intermediate
    tags: [private-endpoint, vpc, security]
    question: |
      A regulated internal microservice API must never be reachable from the public internet. Which
      endpoint type fits?
    options:
      - "Regional REST API with WAF"
      - "Private REST API accessed via an interface VPC endpoint (PrivateLink)"
      - "HTTP API with a JWT authorizer"
      - "Edge-optimized REST API"
    answer: 1
    explanation: |
      A Private endpoint is reachable only from within a VPC via an interface VPC endpoint (PrivateLink)
      — no public exposure. Edge-optimized and Regional are internet-facing (WAF filters but still
      public). A JWT authorizer authenticates but the endpoint is still public.
    ref: "concepts.md#edge-optimized-regional-and-private-endpoints"

  - id: aws-api-layer-apigateway-appsync-019
    difficulty: intermediate
    tags: [appsync, resolvers, pipeline]
    question: |
      A GraphQL field must read from DynamoDB, then enrich the result from an HTTP data source in one
      field resolution. Which AppSync feature handles this?
    options:
      - "A usage plan"
      - "A single unit (direct) resolver"
      - "A pipeline resolver chaining functions (up to 10) across data sources"
      - "A subscription"
    answer: 2
    explanation: |
      Pipeline resolvers chain up to 10 functions to orchestrate multiple data sources in one field
      resolution. A unit resolver hits a single source. Subscriptions are for real-time push; usage
      plans are an API Gateway REST concept.
    ref: "concepts.md#appsync-and-managed-graphql"

  - id: aws-api-layer-apigateway-appsync-020
    difficulty: intermediate
    tags: [appsync, subscriptions, real-time]
    question: |
      What makes AppSync subscriptions attractive versus building push on API Gateway WebSocket for a
      "notify clients when server data changes" use case?
    options:
      - "AppSync supports larger per-message payloads than any other service"
      - "AppSync guarantees exactly-once delivery"
      - "AppSync is cheaper for arbitrary binary streaming"
      - "AppSync manages the WebSocket connections and fan-out tied to GraphQL mutations, so you don't store connection IDs or build fan-out logic yourself"
    answer: 3
    explanation: |
      AppSync auto-pushes mutation results to subscribed clients and manages connections/fan-out — no
      DynamoDB connection table or @connections plumbing. API Gateway WebSocket makes you build that.
      AppSync isn't a binary-streaming service and doesn't guarantee exactly-once.
    ref: "concepts.md#appsync-subscriptions-and-real-time"

  - id: aws-api-layer-apigateway-appsync-021
    difficulty: intermediate
    tags: [serverless-vs-containers, cost]
    question: |
      For a brand-new API with spiky, unpredictable traffic, a small team, and a desire to minimize ops,
      which front-door design is usually best?
    options:
      - "API Gateway + Lambda (serverless), scaling to zero and paying per request"
      - "Self-hosted Kong on EC2"
      - "NLB + EC2 Auto Scaling group"
      - "ALB + Fargate with min tasks always running"
    answer: 0
    explanation: |
      Spiky/unpredictable + small team + low ops = serverless: API Gateway + Lambda scales to zero, no
      capacity planning, pay-per-request. Always-on Fargate/EC2 or self-hosted Kong add fixed cost and
      ops burden that only pay off at high sustained throughput or for special control needs.
    ref: "concepts.md#api-gateway-plus-lambda-vs-alb-plus-fargate-for-apis"

  - id: aws-api-layer-apigateway-appsync-022
    difficulty: intermediate
    tags: [waf, http-api, security]
    question: |
      A public-facing API must have AWS WAF attached and needs API keys for partner metering. Which
      approach is cleanest?
    options:
      - "Use an HTTP API and attach WAF directly to it"
      - "Use a REST API (which supports WAF on the stage and API keys/usage plans), or front an HTTP API with CloudFront + WAF"
      - "Use a WebSocket API for the partner endpoints"
      - "Use ALB, which natively provides API keys"
    answer: 1
    explanation: |
      HTTP APIs historically cannot attach WAF directly and lack API keys. REST API supports both WAF on
      the stage and usage plans/API keys; alternatively front an HTTP API with CloudFront + WAF (but
      CloudFront still won't give you API keys). ALB has no API keys.
    ref: "concepts.md#rate-limiting-and-waf-integration"

  - id: aws-api-layer-apigateway-appsync-023
    difficulty: intermediate
    tags: [versioning, stages]
    question: |
      Which API versioning strategy is simplest for clients and CDNs but tends to proliferate routes?
    options:
      - "Randomized stage variables per request"
      - "Header/media-type versioning (Accept: application/vnd.api.v2+json)"
      - "URL path versioning (/v1/..., /v2/...)"
      - "Schema evolution with @deprecated (no URL versioning)"
    answer: 2
    explanation: |
      URL path versioning is explicit, cache-friendly, and easiest for clients, but it multiplies routes
      over time. Header versioning is cleaner URLs but opaque/harder to cache. @deprecated schema
      evolution is the GraphQL approach. Stage variables aren't a versioning-per-request mechanism.
    ref: "concepts.md#versioning-and-stages"

  - id: aws-api-layer-apigateway-appsync-024
    difficulty: intermediate
    tags: [canary, deployment, rest-api]
    question: |
      How do canary release deployments on an API Gateway REST stage work?
    options:
      - "They cache responses during rollout"
      - "They require switching to an HTTP API"
      - "They deploy to a separate Region for failover"
      - "They route a configurable percentage of traffic on the same stage to a new deployment for safe rollout, with promotion or rollback"
    answer: 3
    explanation: |
      Canary deployments split a percentage of stage traffic to the new deployment so you can validate
      before full promotion (or roll back). They aren't a Region failover, a cache, or tied to HTTP APIs.
    ref: "concepts.md#versioning-and-stages"

  - id: aws-api-layer-apigateway-appsync-025
    difficulty: intermediate
    tags: [throttling, token-bucket]
    question: |
      In API Gateway throttling, what do the "rate" and "burst" settings represent in the token-bucket
      model?
    options:
      - "Rate = steady-state refill rate (RPS); burst = bucket capacity (max concurrent spike)"
      - "Both are hard monthly quotas"
      - "Rate is for reads, burst is for writes"
      - "Rate = bucket capacity; burst = refill rate"
    answer: 0
    explanation: |
      Rate is the steady-state refill (RPS); burst is the bucket capacity absorbing a momentary spike.
      When the bucket empties, callers get 429. They aren't monthly quotas (that's a usage-plan quota)
      and don't map to read/write.
    ref: "concepts.md#throttling-usage-plans-and-api-keys"

  - id: aws-api-layer-apigateway-appsync-026
    difficulty: intermediate
    tags: [appsync, graphql, when-not]
    question: |
      Which situation argues AGAINST choosing AppSync/GraphQL and FOR a REST/HTTP API?
    options:
      - "A collaborative editor needing real-time data sync"
      - "Simple CRUD where per-URL CDN caching and file up/downloads matter, and third parties expect REST"
      - "A typed schema you want to evolve without URL versioning"
      - "A mobile app needing exact field selection across several sources"
    answer: 1
    explanation: |
      GraphQL shines for flexible field selection, multi-source fan-out, real-time sync, and schema
      evolution. But simple CRUD with URL caching, binary/file transfer, and REST-expecting integrations
      favor REST/HTTP APIs (GraphQL is all POST /graphql, harder to CDN-cache).
    ref: "concepts.md#appsync-and-managed-graphql"

  - id: aws-api-layer-apigateway-appsync-027
    difficulty: intermediate
    tags: [failure, multi-az, region]
    question: |
      Which failure does a single-Region API Gateway + Lambda + DynamoDB design NOT automatically
      tolerate?
    options:
      - "A brief DynamoDB throttling spike on a well-distributed table"
      - "Loss of a single Availability Zone"
      - "A full AWS Region outage"
      - "One Lambda invocation erroring"
    answer: 2
    explanation: |
      API Gateway, Lambda, and DynamoDB are multi-AZ within a Region, so an AZ loss is transparent, and
      transient Lambda errors / DynamoDB throttles are handled by retries. A full Region outage is NOT
      covered without Regional endpoints + Route 53 failover + global tables.
    ref: "concepts.md#failure-modes-and-how-the-design-degrades"

  - id: aws-api-layer-apigateway-appsync-028
    difficulty: intermediate
    tags: [account-throttle, limit]
    question: |
      A naive design puts all traffic behind one API Gateway in a Region and expects 12,000 RPS steady.
      Which limit does it hit first (in a standard Region)?
    options:
      - "The AppSync 5 MB response limit"
      - "The Lambda 15-minute duration limit"
      - "The DynamoDB 400 KB item size limit"
      - "The default account-level throttle of 10,000 RPS (soft, increasable) across all API types in the Region"
    answer: 3
    explanation: |
      The default API Gateway account throttle is 10,000 RPS with a 5,000 burst per Region across all
      API types (soft/increasable). 12,000 RPS exceeds it until raised. Item size, AppSync response, and
      Lambda duration limits are unrelated to steady RPS.
    ref: "concepts.md#the-29-second-integration-timeout"

  - id: aws-api-layer-apigateway-appsync-029
    difficulty: advanced
    tags: [timeout, trade-off, throughput]
    question: |
      Your team raised a Regional REST API's integration timeout above 29 seconds (via the 2024 service
      quota) to support long LLM calls. What is the direct trade-off AWS imposes?
    options:
      - "Raising the integration timeout requires a reduction in your account-level throttle (RPS) quota — you trade throughput for longer per-request tolerance"
      - "You lose all caching on the stage"
      - "The change forces the API into a private endpoint"
      - "You must switch the endpoint to edge-optimized"
    answer: 0
    explanation: |
      AWS documented that increasing the integration timeout beyond 29 s for Regional/private REST APIs
      may require reducing the account-level throttle quota — longer requests hold capacity longer, so
      you accept lower RPS. It doesn't force endpoint type or remove caching.
    ref: "concepts.md#the-29-second-integration-timeout"

  - id: aws-api-layer-apigateway-appsync-030
    difficulty: advanced
    tags: [llm, streaming, architecture]
    question: |
      You must stream LLM tokens to a web client for up to two minutes. Which approach avoids hanging on
      a synchronous integration and its 29 s ceiling?
    options:
      - "A plain REST API to Lambda synchronous integration returning the full text"
      - "Lambda response streaming via a Function URL, an API Gateway WebSocket API, or AppSync subscriptions"
      - "Enable API Gateway caching with a 120 s TTL"
      - "Raise the Lambda memory to 10 GB so it finishes under 29 s"
    answer: 1
    explanation: |
      Streaming for minutes must not hang on a synchronous REST/HTTP integration (29–30 s cap). Use
      Lambda response streaming (Function URL), WebSocket API, or AppSync subscriptions for incremental
      push. Caching can't produce a not-yet-generated stream; more memory doesn't remove the cap.
    ref: "concepts.md#the-29-second-integration-timeout"

  - id: aws-api-layer-apigateway-appsync-031
    difficulty: advanced
    tags: [appsync-vs-websocket, real-time, trade-off]
    question: |
      You are designing a multiplayer game requiring a custom bidirectional protocol with routes driven
      by a message "action" field, not tied to any GraphQL data mutation. Which is the better fit and
      why?
    options:
      - "HTTP API with server-sent events"
      - "AppSync subscriptions, because they manage connections for you"
      - "API Gateway WebSocket API, because it supports arbitrary bidirectional messages routed by a route selection expression, independent of GraphQL mutations"
      - "REST API with long polling"
    answer: 2
    explanation: |
      API Gateway WebSocket routes arbitrary messages by a route selection expression (e.g.
      $request.body.action) and supports any custom bidirectional protocol. AppSync subscriptions are
      tied to GraphQL mutations/data changes. REST long polling and HTTP SSE don't give true
      bidirectional custom routing.
    ref: "concepts.md#appsync-subscriptions-and-real-time"

  - id: aws-api-layer-apigateway-appsync-032
    difficulty: advanced
    tags: [cost, serverless-vs-containers, high-throughput]
    question: |
      At 50,000 sustained RPS around the clock, an interviewer asks whether API Gateway + Lambda remains
      the cheapest. The best answer is:
    options:
      - "It doesn't matter because both cost the same"
      - "Yes, because Lambda scales to zero"
      - "Yes, serverless is always cheapest at any scale"
      - "Often no — at high steady throughput, per-request pricing plus Lambda GB-seconds can exceed always-on ALB + Fargate; you should model both and consider containers"
    answer: 3
    explanation: |
      Serverless wins for spiky/low-steady load, but at high sustained volume the per-request + GB-second
      cost can surpass always-on Fargate behind an ALB, which offers predictable flat cost. Scale-to-zero
      is irrelevant when traffic is always high. The right move is to model both.
    ref: "concepts.md#api-gateway-plus-lambda-vs-alb-plus-fargate-for-apis"

  - id: aws-api-layer-apigateway-appsync-033
    difficulty: advanced
    tags: [multi-region, active-active, resilience]
    question: |
      To make a public API active-active across two Regions, which combination is required?
    options:
      - "Regional endpoints in each Region + Route 53 latency/failover records (or Global Accelerator) + a replicated data layer such as DynamoDB global tables, with idempotency to handle retries"
      - "A single Private endpoint shared via PrivateLink"
      - "Increasing the account throttle quota"
      - "An edge-optimized endpoint, which automatically fails over between Regions"
    answer: 0
    explanation: |
      Multi-Region active-active needs Regional endpoints per Region, DNS-level routing/failover (Route
      53 or Global Accelerator), replicated data (global tables), plus idempotency for safe retries.
      Edge-optimized only speeds the network path to a single-Region backend; Private/quota changes don't
      add Region resilience.
    ref: "concepts.md#edge-optimized-regional-and-private-endpoints"

  - id: aws-api-layer-apigateway-appsync-034
    difficulty: advanced
    tags: [appsync, appsync-js, resolver-runtime]
    question: |
      Which constraint is TRUE of the APPSYNC_JS resolver runtime?
    options:
      - "It is full Node.js with async/await and network access"
      - "It is a restricted synchronous runtime: no async/await, no network calls or timers, with a code size limit of 32 KB"
      - "It only supports Python"
      - "It has no size limit and can open TCP sockets"
    answer: 1
    explanation: |
      APPSYNC_JS is a restricted JavaScript runtime for resolvers/functions: synchronous only, no
      async/await, no network/timers, and 32 KB code size per resolver/function. It is not full Node.js,
      not Python, and cannot open sockets.
    ref: "concepts.md#appsync-and-managed-graphql"

  - id: aws-api-layer-apigateway-appsync-035
    difficulty: advanced
    tags: [appsync, limits, subscriptions]
    question: |
      An AppSync app plans 500 distinct subscriptions on a single client WebSocket connection. What
      happens against the default quota?
    options:
      - "It is capped by the 240 KB subscription payload limit per connection"
      - "It works; there is no per-connection subscription limit"
      - "It hits the default limit of 200 subscriptions per client connection (adjustable), so 500 exceeds it"
      - "It fails because the response size limit is 5 MB"
    answer: 2
    explanation: |
      AppSync allows 200 subscriptions per client connection by default (adjustable via Service Quotas),
      so 500 on one connection exceeds it. The 5 MB response and 240 KB payload limits are separate
      per-response/per-message caps, not the per-connection subscription count.
    ref: "concepts.md#appsync-subscriptions-and-real-time"

  - id: aws-api-layer-apigateway-appsync-036
    difficulty: advanced
    tags: [graphql, security, dos]
    question: |
      What GraphQL-specific denial-of-service risk must an AppSync design guard against that REST APIs
      don't share?
    options:
      - "SQL injection, which only affects GraphQL"
      - "Slowloris attacks unique to GraphQL"
      - "TLS renegotiation attacks"
      - "Deeply nested/expensive queries that fan out costly resolutions; mitigate with depth/complexity and query-length limits (AppSync caps query length at 15,000 tokens)"
    answer: 3
    explanation: |
      Because a single GraphQL query can request deeply nested, expensive data, a malicious query can
      cause runaway fan-out. Guard with depth/complexity limits; AppSync also enforces a 15,000-token max
      query length. SQLi and Slowloris are not GraphQL-specific, and TLS renegotiation is unrelated.
    ref: "concepts.md#failure-modes-and-how-the-design-degrades"

  - id: aws-api-layer-apigateway-appsync-037
    difficulty: advanced
    tags: [hot-partition, throttling, backend]
    question: |
      An API Gateway front door with a generous throttle forwards a viral spike into a DynamoDB table
      whose access concentrates on one partition key. What is the likely failure and mitigation?
    options:
      - "The hot partition exceeds ~3,000 RCU / 1,000 WCU, causing throttling; mitigate by better key design, tighter API throttles, and caching"
      - "The Lambda runs out of memory; mitigate by lowering timeout"
      - "The WAF blocks all traffic; mitigate by removing WAF"
      - "The API returns 504 due to the 29 s timeout; mitigate by caching"
    answer: 0
    explanation: |
      A single DynamoDB partition tops out near 3,000 RCU / 1,000 WCU; concentrated keys create a hot
      partition that throttles under a spike. Fix with key/sharding design, upstream throttling to shed
      load, and caching. It's not a timeout, memory, or WAF issue here.
    ref: "concepts.md#failure-modes-and-how-the-design-degrades"

  - id: aws-api-layer-apigateway-appsync-038
    difficulty: advanced
    tags: [cold-start, provisioned-concurrency, trade-off]
    question: |
      What is the trade-off of using Lambda provisioned concurrency to fix cold-start tail latency behind
      an API Gateway?
    options:
      - "It eliminates the 29 s timeout"
      - "It removes tail-latency spikes but adds an always-on charge, eroding the scale-to-zero cost advantage of serverless"
      - "It increases the DynamoDB partition throughput"
      - "It disables the account throttle"
    answer: 1
    explanation: |
      Provisioned concurrency keeps warm instances so requests avoid cold starts, but you pay for that
      always-on capacity — which cuts against serverless's scale-to-zero savings. It doesn't change the
      gateway timeout, DynamoDB throughput, or throttling.
    ref: "concepts.md#failure-modes-and-how-the-design-degrades"

  - id: aws-api-layer-apigateway-appsync-039
    difficulty: advanced
    tags: [idempotency, timeout, correctness]
    question: |
      A gateway 504 (integration timed out at 29 s) occurs but the backend Lambda actually completes its
      work afterward. What design element prevents duplicate side effects when the client retries?
    options:
      - "Increasing the burst limit"
      - "Enabling API Gateway caching"
      - "Idempotency keys so a retried request is de-duplicated against the already-processed work"
      - "Switching to an edge-optimized endpoint"
    answer: 2
    explanation: |
      When the gateway times out but the backend keeps running, a client retry can cause double effects.
      Idempotency keys let the backend recognize and de-duplicate the retry. Caching, endpoint type, and
      burst limits do not address orphaned-work duplication.
    ref: "concepts.md#failure-modes-and-how-the-design-degrades"

  - id: aws-api-layer-apigateway-appsync-040
    difficulty: advanced
    tags: [vpc-link, private-integration, architecture]
    question: |
      You want API Gateway's auth, throttling, and WAF in front of an existing containerized service on
      Fargate behind an internal ALB. How do you connect them privately?
    options:
      - "Expose the ALB publicly and call it over the internet"
      - "Replace the ALB with an API key"
      - "You cannot; API Gateway only integrates with Lambda"
      - "Use a private integration via a VPC Link from API Gateway to the internal ALB/NLB fronting Fargate"
    answer: 3
    explanation: |
      A VPC Link private integration lets API Gateway reach an internal ALB/NLB (and thus Fargate)
      privately, so you keep API management up front and containers in the back. API Gateway integrates
      with more than Lambda; exposing the ALB publicly defeats the purpose; an API key is not a connector.
    ref: "concepts.md#api-gateway-plus-lambda-vs-alb-plus-fargate-for-apis"

  - id: aws-api-layer-apigateway-appsync-041
    difficulty: advanced
    tags: [alb-vs-nlb, layer]
    question: |
      For an API that needs ultra-low latency, static IP addresses, TLS passthrough, and extreme
      connection counts, which load balancer layer is appropriate?
    options:
      - "NLB (Layer 4), for low latency, static IPs, TLS passthrough, and very high connection counts"
      - "API Gateway REST API"
      - "CloudFront only"
      - "ALB (Layer 7), for its HTTP path/host routing"
    answer: 0
    explanation: |
      NLB operates at L4 with ultra-low latency, static/Elastic IPs, TLS passthrough, and massive
      connection scale. ALB is L7 for HTTP routing features. API Gateway and CloudFront are not L4 load
      balancers for these requirements.
    ref: "concepts.md#api-gateway-plus-lambda-vs-alb-plus-fargate-for-apis"

  - id: aws-api-layer-apigateway-appsync-042
    difficulty: advanced
    tags: [layered-defense, ddos, waf]
    question: |
      Which layered protection order best defends a public consumer API from DDoS and abusive clients?
    options:
      - "API Gateway throttle to CloudFront to WAF to backend"
      - "CloudFront (+ WAF rate rules, + Shield) to API Gateway (throttle + authorizer) to backend"
      - "WAF to Lambda to DynamoDB to CloudFront"
      - "Backend to API Gateway to client, with no WAF"
    answer: 1
    explanation: |
      Defense-in-depth places CloudFront with WAF rate rules and Shield at the edge to absorb/block abuse
      before it reaches API Gateway's throttle and authorizer, then the backend. WAF blocking abusive IPs
      early also protects your throttle budget. The other orderings are nonsensical.
    ref: "concepts.md#rate-limiting-and-waf-integration"

  - id: aws-api-layer-apigateway-appsync-043
    difficulty: advanced
    tags: [appsync, response-size, limit]
    question: |
      An AppSync query legitimately assembles ~8 MB of data from multiple sources. What happens?
    options:
      - "It is capped by the 32 KB code size limit"
      - "It succeeds; AppSync has no response cap"
      - "It exceeds the 5 MB maximum resolver/response size limit and fails; you must paginate or restructure"
      - "It is truncated silently to 240 KB"
    answer: 2
    explanation: |
      AppSync caps the evaluated resolver/response size at 5 MB, so 8 MB fails — you must paginate or
      reduce the payload. 240 KB is the subscription message cap; 32 KB is the resolver code size, not the
      data response.
    ref: "concepts.md#appsync-and-managed-graphql"

  - id: aws-api-layer-apigateway-appsync-044
    difficulty: advanced
    tags: [schema-evolution, versioning, graphql]
    question: |
      Why is AppSync/GraphQL often preferred for a long-lived API serving many client versions
      simultaneously?
    options:
      - "It disables backward compatibility to force upgrades"
      - "It requires a new stage per client version"
      - "It forces every client onto the newest URL version"
      - "You evolve the schema additively (add fields, deprecate with @deprecated), so one endpoint serves old and new clients without URL versioning"
    answer: 3
    explanation: |
      GraphQL evolution is additive: add fields and mark old ones @deprecated, so a single endpoint serves
      all client versions without proliferating /v1, /v2 URLs. It doesn't force upgrades or require
      per-client stages.
    ref: "concepts.md#versioning-and-stages"

  - id: aws-api-layer-apigateway-appsync-045
    difficulty: advanced
    tags: [self-hosted, kong, trade-off]
    question: |
      A team argues for self-hosting Kong/NGINX instead of API Gateway. What is the honest primary
      trade-off?
    options:
      - "You gain full protocol/plugin control and cloud portability with no per-request premium, but you own HA, autoscaling, patching, capacity, and on-call — the real cost is engineering time"
      - "Self-hosting removes the need for authentication"
      - "Self-hosting automatically provides multi-Region failover"
      - "Self-hosting is always cheaper and lower-ops"
    answer: 0
    explanation: |
      Self-hosted gateways give total control and avoid per-request pricing/lock-in, but you assume all
      operational burden (HA, scaling, patching, on-call). It's not automatically cheaper/lower-ops,
      doesn't remove auth, and doesn't grant multi-Region failover for free.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-api-layer-apigateway-appsync-046
    difficulty: expert
    tags: [decision, real-time, trade-off]
    question: |
      A fintech needs: (a) a public REST API with per-partner monthly quotas and WAF, and (b) a live
      price-tick feed that pushes to browser clients when server data changes. Which pairing is best?
    options:
      - "HTTP API for both, using JWT authorizers"
      - "REST API with usage plans + WAF for the partner API, and AppSync subscriptions for the data-change push feed"
      - "WebSocket API for the partner API and REST for the ticks"
      - "AppSync for both, using API keys for partner quotas"
    answer: 1
    explanation: |
      Partner quotas + WAF require REST API usage plans and stage WAF. A data-change-driven push feed maps
      cleanly to AppSync subscriptions (managed fan-out). HTTP API lacks usage plans/WAF; WebSocket for a
      request/response partner API is wrong; AppSync API keys aren't monthly per-partner quotas.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-api-layer-apigateway-appsync-047
    difficulty: expert
    tags: [decision, latency-budget, cost]
    question: |
      Constraints: 30,000 RPS sustained 24/7, p99 latency budget of 15 ms of gateway overhead, requests
      up to 3 minutes long (streaming), existing ECS/Fargate stack. Which front door fits best?
    options:
      - "AppSync with pipeline resolvers"
      - "API Gateway HTTP API + Lambda, for lowest cost"
      - "ALB (or NLB) in front of Fargate, because it has no 29 s cap, supports long/streaming requests, gives predictable flat cost at high steady RPS, and adds the least overhead"
      - "REST API with caching to meet the latency budget"
    answer: 2
    explanation: |
      3-minute streaming requests break API Gateway's ~29–30 s cap; high steady RPS favors flat-cost
      always-on containers; ALB/NLB add minimal overhead and support long-lived/streaming connections and
      the existing Fargate stack. HTTP API + Lambda hits the timeout and can cost more at this volume;
      REST caching doesn't help streaming; AppSync is a GraphQL model, not this workload.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-api-layer-apigateway-appsync-048
    difficulty: expert
    tags: [decision, mobile, graphql, over-fetching]
    question: |
      A mobile app on cellular renders a dashboard needing user profile + last 5 orders + 3 recommended
      products, currently 3 chatty REST calls causing latency and wasted bytes. Best redesign?
    options:
      - "Merge the three Lambdas into one behind a single REST endpoint returning everything"
      - "Switch to a WebSocket API"
      - "Add API Gateway caching to the three REST endpoints"
      - "Use AppSync GraphQL: one query selecting exactly the needed fields, fanning out server-side to the profile, orders, and recommendation data sources"
    answer: 3
    explanation: |
      GraphQL solves over-fetching and multiple round trips: one query selects exact fields and fans out
      to multiple sources server-side, ideal for constrained mobile networks. Caching doesn't fix
      over-fetch/round-trips; a mega-REST endpoint over-fetches; WebSocket is for push, not this
      request/response aggregation.
    ref: "concepts.md#appsync-and-managed-graphql"

  - id: aws-api-layer-apigateway-appsync-049
    difficulty: expert
    tags: [decision, internal, private, service-to-service]
    question: |
      An internal-only microservice API is called by other AWS services in the same account, must never
      be public, needs no user login, and the team wants minimal moving parts. Best design?
    options:
      - "Private REST API (VPC endpoint) with IAM authorization (SigV4)"
      - "Public HTTP API with a Lambda authorizer checking source IPs"
      - "AppSync with API keys"
      - "Edge-optimized REST API with a Cognito authorizer"
    answer: 0
    explanation: |
      Internal + never-public + service-to-service + minimal parts = Private endpoint (VPC-only) with IAM
      SigV4 auth, reusing existing IAM roles and no token server. Edge-optimized is public; a public HTTP
      API with IP checks is fragile and still public; AppSync API keys add unneeded pieces and aren't
      service-identity auth.
    ref: "concepts.md#authorizers-iam-cognito-and-lambda"

  - id: aws-api-layer-apigateway-appsync-050
    difficulty: expert
    tags: [limit, first-to-break, scenario]
    question: |
      A REST API to Lambda to third-party HTTP call design has the third party occasionally responding in
      35 seconds. With default settings, which limit breaks first and what is the symptom?
    options:
      - "Lambda's 15-minute limit; the function is killed"
      - "The API Gateway ~29 s integration timeout; the client gets a 504 while the Lambda may still be running"
      - "The DynamoDB 400 KB item limit; writes fail"
      - "The account 10k RPS throttle; clients get 429"
    answer: 1
    explanation: |
      A 35 s downstream exceeds the gateway's ~29 s integration timeout, so API Gateway returns 504 to the
      client even though the Lambda (15 min limit, not reached) keeps running. It's not the item size or
      RPS throttle in this single-slow-call scenario.
    ref: "concepts.md#the-29-second-integration-timeout"

  - id: aws-api-layer-apigateway-appsync-051
    difficulty: expert
    tags: [appsync, direct-resolver, cost, trade-off]
    question: |
      For a simple GraphQL "getItem by id" field, what is the advantage of an AppSync direct DynamoDB
      resolver over routing through a Lambda data source?
    options:
      - "It provides API keys automatically"
      - "It allows arbitrary async network calls"
      - "It removes the Lambda invocation (cost, cold start, and a failure hop) by resolving DynamoDB directly, at the price of expressing logic in the resolver runtime/VTL rather than general-purpose code"
      - "It raises the 5 MB response limit"
    answer: 2
    explanation: |
      A direct DynamoDB resolver skips Lambda entirely — no invocation cost, cold start, or extra failure
      point — but you must express mapping in VTL/APPSYNC_JS rather than general code. It doesn't enable
      async network calls, change the response limit, or add API keys.
    ref: "concepts.md#appsync-and-managed-graphql"

  - id: aws-api-layer-apigateway-appsync-052
    difficulty: expert
    tags: [websocket, connection-management, dynamodb]
    question: |
      In an API Gateway WebSocket chat backend, where are connection IDs typically stored and how does
      the server push a message to a specific client?
    options:
      - "In the API Gateway cache; push via a usage plan"
      - "Connection IDs are managed entirely by AppSync"
      - "In the JWT; push by re-issuing the token"
      - "In DynamoDB (mapping user to connectionId); push by calling the @connections management API with that connection ID"
    answer: 3
    explanation: |
      With API Gateway WebSocket you store connection IDs (commonly in DynamoDB) and push using the
      @connections callback API with the target connection ID. Tokens/caches/usage plans don't manage
      connections; AppSync manages connections only for its own subscriptions, not for a raw WebSocket API.
    ref: "concepts.md#appsync-subscriptions-and-real-time"

  - id: aws-api-layer-apigateway-appsync-053
    difficulty: expert
    tags: [decision, waf, http-api, trade-off]
    question: |
      A team loves HTTP API's cost but security requires WAF and geo-blocking on a public API. What is
      the most appropriate resolution?
    options:
      - "Keep the HTTP API but front it with CloudFront + WAF (geo/rate rules), or move to REST API which supports WAF on the stage — weighing the cost/feature trade-off"
      - "Drop WAF; throttling is equivalent security"
      - "Switch to a WebSocket API to get WAF"
      - "Attach WAF directly to the HTTP API"
    answer: 0
    explanation: |
      HTTP APIs historically can't attach WAF directly, so either front the HTTP API with CloudFront +
      WAF or use REST API (WAF on stage), accepting REST's higher cost. Throttling is not a security
      control, and WebSocket doesn't grant WAF.
    ref: "concepts.md#rate-limiting-and-waf-integration"

  - id: aws-api-layer-apigateway-appsync-054
    difficulty: expert
    tags: [stage-variables, deployment, environments]
    question: |
      How are stage variables best used to route the same API deployment to different backends per
      environment?
    options:
      - "As a secrets store replacing AWS Secrets Manager"
      - "As key-value settings on each stage (e.g. pointing to a specific Lambda alias/ARN), so dev/prod stages invoke different backend versions from one deployment"
      - "As the mechanism that enforces per-tenant quotas"
      - "As the GraphQL schema definition"
    answer: 1
    explanation: |
      Stage variables are per-stage key-values (like a Lambda alias/ARN) so the same deployment hits
      different backends per environment. They're not a secrets manager, not the quota mechanism (usage
      plans do that), and not a schema.
    ref: "concepts.md#versioning-and-stages"

  - id: aws-api-layer-apigateway-appsync-055
    difficulty: expert
    tags: [decision, consistency, caching, staleness]
    question: |
      A pricing GET is called 5,000 times/sec, prices change at most every 5 minutes, and a 60-second
      staleness window is acceptable. Cheapest way to cut backend load and latency?
    options:
      - "Move to AppSync subscriptions"
      - "Provisioned concurrency on the Lambda for every request"
      - "Enable stage caching (REST) or front with CloudFront with a ~60 s TTL, serving most reads from cache within the accepted staleness window"
      - "Raise the account throttle to 5,000 RPS"
    answer: 2
    explanation: |
      A read-heavy, cacheable GET with an accepted 60 s staleness window is a textbook cache case: API
      Gateway stage cache or CloudFront with ~60 s TTL slashes backend invokes and latency cheaply.
      Provisioned concurrency still invokes per request; raising throttle doesn't cut load; subscriptions
      are for push, not this GET.
    ref: "concepts.md#caching-request-and-response-mapping"

  - id: aws-api-layer-apigateway-appsync-056
    difficulty: expert
    tags: [decision, cell-based, blast-radius]
    question: |
      To limit blast radius of a bad deploy or a poison-pill tenant on a large multi-tenant API, which
      modern pattern applies?
    options:
      - "Rely solely on the 29 s timeout to contain failures"
      - "Increase the cache size"
      - "Put all tenants behind one API, one Lambda, one table for simplicity"
      - "Cell-based architecture: partition tenants across independent cells (own API/compute/data), so a failure or bad deploy affects only one cell"
    answer: 3
    explanation: |
      Cell-based architecture isolates tenants into independent cells so faults, bad deploys, or hot
      tenants are contained to one cell instead of the whole fleet. A single shared stack maximizes blast
      radius; timeouts and cache size don't provide isolation.
    ref: "concepts.md#failure-modes-and-how-the-design-degrades"

  - id: aws-api-layer-apigateway-appsync-057
    difficulty: intermediate
    tags: [backoff, throttling, client]
    question: |
      Clients intermittently receive 429s during legitimate bursts on a well-sized API. What client-side
      practice most improves overall success without overloading the backend?
    options:
      - "Exponential backoff with jitter on retries"
      - "Disable retries entirely"
      - "Open more concurrent connections to spread load"
      - "Retry immediately in a tight loop"
    answer: 0
    explanation: |
      Exponential backoff with jitter spreads retries out and avoids synchronized retry storms, improving
      success under throttling. Tight-loop retries and more connections amplify the overload; disabling
      retries drops recoverable requests.
    ref: "concepts.md#failure-modes-and-how-the-design-degrades"

  - id: aws-api-layer-apigateway-appsync-058
    difficulty: intermediate
    tags: [appsync, data-sources]
    question: |
      Which of the following is a valid set of AppSync data sources?
    options:
      - "Only DynamoDB"
      - "DynamoDB, Aurora/RDS (via Data API), Lambda, OpenSearch, HTTP endpoints, and EventBridge"
      - "Only Lambda"
      - "Only S3"
    answer: 1
    explanation: |
      AppSync resolvers can target DynamoDB, Aurora/RDS via the Data API, Lambda, OpenSearch, generic HTTP
      endpoints, and EventBridge, among others. It is not restricted to a single source.
    ref: "concepts.md#appsync-and-managed-graphql"

  - id: aws-api-layer-apigateway-appsync-059
    difficulty: beginner
    tags: [http-api, jwt]
    question: |
      Which authorizer does an HTTP API support natively for validating OIDC/JWT tokens without custom
      code?
    options:
      - "SAML authorizer"
      - "Cognito User Pools authorizer (REST-style)"
      - "JWT authorizer"
      - "Only a Lambda authorizer"
    answer: 2
    explanation: |
      HTTP APIs have a native JWT authorizer that validates OIDC-compliant JWTs (Cognito, Auth0, Okta,
      etc.) with no code. The Cognito User Pools authorizer is the REST-style construct; Lambda authorizers
      also work but require code; there is no built-in SAML authorizer.
    ref: "concepts.md#authorizers-iam-cognito-and-lambda"

  - id: aws-api-layer-apigateway-appsync-060
    difficulty: intermediate
    tags: [appsync, event-apis, real-time]
    question: |
      A team needs simple pub/sub over channels for real-time messaging but does NOT want to define a
      GraphQL schema. Which AppSync capability fits?
    options:
      - "API Gateway REST API caching"
      - "A pipeline resolver"
      - "AppSync GraphQL subscriptions with a full schema"
      - "AppSync Event APIs (channel-based pub/sub) without a GraphQL schema"
    answer: 3
    explanation: |
      AppSync Event APIs provide channel-based pub/sub real-time messaging without requiring a GraphQL
      schema. GraphQL subscriptions require a schema; REST caching and pipeline resolvers are unrelated to
      schemaless pub/sub.
    ref: "concepts.md#appsync-subscriptions-and-real-time"

  - id: aws-api-layer-apigateway-appsync-061
    difficulty: advanced
    tags: [cloudfront-vs-apigw-cache, cost, global]
    question: |
      For globally distributed read caching of API responses, why is CloudFront often preferred over API
      Gateway's built-in stage cache?
    options:
      - "CloudFront caches at edge locations worldwide with flexible cache behaviors, while the API Gateway stage cache is a per-stage fixed hourly cost tied to one Region"
      - "CloudFront guarantees strong consistency"
      - "API Gateway cache cannot store JSON"
      - "API Gateway cache is illegal to use globally"
    answer: 0
    explanation: |
      CloudFront caches at global edges with flexible behaviors and is frequently cheaper/more flexible
      for global reads; the API Gateway stage cache is a single-Region, fixed-hourly-cost instance.
      Neither guarantees strong consistency, and the API Gateway cache can store JSON.
    ref: "concepts.md#caching-request-and-response-mapping"

  - id: aws-api-layer-apigateway-appsync-062
    difficulty: advanced
    tags: [lambda-concurrency, limit, backend]
    question: |
      A spike drives far more concurrent Lambda executions than expected behind an API Gateway. Which
      default limit is likely throttling the backend, and how is it mitigated?
    options:
      - "The 400 KB DynamoDB item limit; use smaller items"
      - "The default per-Region Lambda concurrency of 1,000 (soft); mitigate with reserved/provisioned concurrency for critical functions and a quota increase"
      - "The 5 MB AppSync response limit; paginate"
      - "The 29 s timeout; enable caching"
    answer: 1
    explanation: |
      The default Lambda concurrency is 1,000 per Region (soft/increasable); a big spike can exhaust it,
      throttling invocations. Mitigate with reserved concurrency to protect critical functions, provisioned
      concurrency, and a limit increase. The other limits are unrelated to concurrent execution count.
    ref: "concepts.md#failure-modes-and-how-the-design-degrades"

  - id: aws-api-layer-apigateway-appsync-063
    difficulty: advanced
    tags: [appsync, filtering, subscriptions]
    question: |
      How do you ensure an AppSync subscription only pushes events relevant to a specific client (e.g.
      only messages in their chat room)?
    options:
      - "Increase the subscription payload limit"
      - "You can't; every subscriber gets every mutation"
      - "Use enhanced subscription filters so AppSync only delivers mutations matching the client's criteria"
      - "Store connection IDs in DynamoDB and filter in a Lambda"
    answer: 2
    explanation: |
      Enhanced subscription filtering lets AppSync deliver only mutations matching the client's arguments/
      criteria, avoiding a broadcast to all subscribers. You don't manage connection IDs with AppSync
      (that's the raw WebSocket approach), and payload limits are irrelevant to filtering.
    ref: "concepts.md#appsync-subscriptions-and-real-time"

  - id: aws-api-layer-apigateway-appsync-064
    difficulty: expert
    tags: [decision, over-engineering, judgment]
    question: |
      A startup has one internal admin tool with ~5 RPS, simple CRUD, one developer, and wants to ship
      this week. An architect proposes AppSync with pipeline resolvers, DynamoDB global tables, and a
      multi-Region active-active front door. What is the best critique?
    options:
      - "It should use WebSocket APIs instead"
      - "It needs edge-optimized endpoints for the 5 RPS load"
      - "The proposal is correct; always design for global scale first"
      - "It over-engineers a tiny internal tool — a single-Region HTTP API + Lambda (or even a small container) is far simpler and cheaper; add complexity only when requirements demand it"
    answer: 3
    explanation: |
      Matching solution to constraints matters: 5 RPS internal CRUD with one dev and a tight deadline
      doesn't justify GraphQL pipelines, global tables, or active-active. A simple single-Region HTTP API +
      Lambda is cheaper and faster to ship; complexity should follow real requirements.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-api-layer-apigateway-appsync-065
    difficulty: expert
    tags: [decision, timeout-vs-throughput, tuning]
    question: |
      A Regional REST API serves both quick reads (5 ms) and rare LLM calls needing 60 s. The team raised
      the integration timeout past 29 s account-wide and now sees reduced max RPS during peak reads. What
      is the cleaner design?
    options:
      - "Separate concerns: keep the high-RPS reads on a normal API with the standard timeout, and route the rare long LLM calls to a dedicated path (async job with WebSocket/AppSync push, or a separate API/service with the raised timeout)"
      - "Move everything to WebSocket APIs"
      - "Enable caching on the LLM endpoint"
      - "Accept the reduced throughput; there is no alternative"
    answer: 0
    explanation: |
      Raising the timeout account-wide trades throughput for everyone. Better to isolate the rare
      long-running LLM path (async job + push, or a separate endpoint/service with the higher timeout) so
      the high-RPS reads keep full throughput. Blanket WebSocket migration or caching a unique LLM
      generation doesn't fit.
    ref: "concepts.md#the-29-second-integration-timeout"

  - id: aws-api-layer-apigateway-appsync-066
    difficulty: intermediate
    tags: [websocket, routes]
    question: |
      In an API Gateway WebSocket API, how are incoming messages routed to backend handlers?
    options:
      - "By HTTP path like REST APIs"
      - "By a route selection expression evaluated on the message body (e.g. $request.body.action), plus built-in $connect, $disconnect, and $default routes"
      - "By GraphQL query name"
      - "By the API key value"
    answer: 1
    explanation: |
      WebSocket APIs route by a route selection expression on the message body (e.g.
      $request.body.action) and provide $connect/$disconnect/$default routes. They don't use HTTP paths,
      GraphQL query names, or API keys for routing.
    ref: "concepts.md#api-gateway-rest-vs-http-vs-websocket-api"

  - id: aws-api-layer-apigateway-appsync-067
    difficulty: advanced
    tags: [appsync, caching, server-side]
    question: |
      AppSync offers a server-side cache. What is its main benefit and a key trade-off?
    options:
      - "It converts subscriptions into REST calls"
      - "It makes GraphQL responses strongly consistent"
      - "It caches resolver results to cut data-source load and latency, but like any TTL cache it can return stale data and adds cost"
      - "It removes the 5 MB response limit"
    answer: 2
    explanation: |
      AppSync's server-side cache stores resolver results to reduce data-source calls and latency, trading
      potential staleness within the TTL and added cost. It doesn't change consistency guarantees, lift
      the response limit, or alter subscriptions.
    ref: "concepts.md#appsync-and-managed-graphql"

  - id: aws-api-layer-apigateway-appsync-068
    difficulty: expert
    tags: [decision, streaming-vs-polling, real-time, trade-off]
    question: |
      A dashboard needs updates within ~1 second for 100k concurrent browser users when server data
      changes. Comparing AppSync subscriptions vs frequent client polling of a REST API, which is
      generally better and why?
    options:
      - "WebSocket API with manual fan-out, because it is cheaper than AppSync at any scale"
      - "REST with a 1 s cache TTL, since it eliminates the need for real-time"
      - "Polling every second, because it is stateless and simpler"
      - "AppSync subscriptions, because push avoids 100k clients each polling every second (which multiplies backend load and cost) and delivers changes with lower latency and managed fan-out"
    answer: 3
    explanation: |
      With 100k users, 1 s polling means ~100k RPS of mostly-empty polls — huge load/cost. AppSync
      subscriptions push only on change with managed fan-out and lower latency. Raw WebSocket could work but
      you build fan-out yourself; a 1 s cache still requires clients to poll and doesn't push.
    ref: "concepts.md#appsync-subscriptions-and-real-time"

  - id: aws-api-layer-apigateway-appsync-069
    difficulty: advanced
    tags: [appsync, pipeline-limit]
    question: |
      A GraphQL field requires orchestrating 14 sequential data-source steps in one field resolution.
      What AppSync limit does this hit and how do you handle it?
    options:
      - "The limit of 10 functions per pipeline resolver; refactor (combine steps, or move orchestration into a Lambda data source)"
      - "The 240 KB subscription limit; split the message"
      - "The 15,000-token query limit; shorten the query"
      - "The 5 MB response limit; paginate"
    answer: 0
    explanation: |
      A pipeline resolver allows at most 10 functions; 14 sequential steps exceed it, so combine steps or
      delegate orchestration to a Lambda data source. The other limits (response size, subscription
      payload, query length) don't govern the number of pipeline functions.
    ref: "concepts.md#appsync-and-managed-graphql"

  - id: aws-api-layer-apigateway-appsync-070
    difficulty: expert
    tags: [decision, managed-vs-self-hosted, portability]
    question: |
      An enterprise mandates multi-cloud portability, a rich plugin ecosystem, and custom protocol
      handling for its API gateway, and has a mature platform team with on-call. Which choice aligns best
      despite higher ops cost?
    options:
      - "API Gateway REST API, for its managed features"
      - "A self-hosted gateway (e.g. Kong/Envoy) on containers, accepting ownership of HA, scaling, and patching in exchange for control, portability, and no per-request premium"
      - "AppSync, because GraphQL is portable"
      - "HTTP API, for lowest cost"
    answer: 1
    explanation: |
      Multi-cloud portability + plugin ecosystem + custom protocols + a mature ops team is exactly when a
      self-hosted gateway's control and portability outweigh its operational burden. API Gateway/AppSync/
      HTTP API are AWS-managed (lock-in, less protocol flexibility), so they don't meet the portability and
      custom-protocol mandate as well.
    ref: "concepts.md#trade-offs-and-when-to-use-what"
