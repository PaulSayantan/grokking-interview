topic: 'Relational Databases on AWS: RDS and Aurora'
domain: system-design
topic_slug: aws-databases-rds-aurora
version: 1
questions:
- id: aws-databases-rds-aurora-001
  difficulty: beginner
  tags:
  - rds
  - managed
  - fundamentals
  question: |
    What is the primary value Amazon RDS provides over running the same database
    engine yourself on an EC2 instance?
  options:
  - It automates operational heavy lifting — provisioning, patching, backups, Multi-AZ failover, and replica
    setup — while running standard engines
  - It replaces standard SQL with a proprietary AWS query dialect that automatically scales writes across
    many nodes
  - It grants full root and operating-system access to the host while automatically sharding writes across
    instances
  - It automatically converts your relational tables into a distributed key-value store for higher throughput
  answer: 0
  explanation: |
    RDS runs the same engines (PostgreSQL, MySQL, MariaDB, Oracle, SQL Server) but
    manages provisioning, patching, backups, and HA. It does NOT give root/OS access
    (that's a reason to self-manage on EC2), does not shard writes horizontally, and
    keeps the normal SQL interface.
  ref: 'concepts.md#managed-relational-databases-and-the-rds-value-proposition'
- id: aws-databases-rds-aurora-002
  difficulty: beginner
  tags:
  - rds
  - engines
  question: |
    Which of the following is NOT a database engine offered by Amazon RDS?
  options:
  - PostgreSQL
  - MySQL
  - MongoDB
  - SQL Server
  answer: 2
  explanation: |
    RDS offers PostgreSQL, MySQL, MariaDB, Oracle, SQL Server, and Aurora
    (MySQL/PostgreSQL-compatible). MongoDB is a document database; AWS offers a
    separate managed service (DocumentDB) for MongoDB compatibility, not RDS.
  ref: 'concepts.md#managed-relational-databases-and-the-rds-value-proposition'
- id: aws-databases-rds-aurora-003
  difficulty: beginner
  tags:
  - rds
  - config
  - parameter-groups
  question: |
    In RDS, how do you change an engine setting such as max_connections when you
    cannot SSH into the host?
  options:
  - Edit the postgresql.conf file directly over an SSH session
  - You cannot change engine settings on RDS at all
  - Change it only through an option group
  - Modify a parameter group attached to the instance
  answer: 3
  explanation: |
    RDS blocks OS/host access, so engine config is managed through parameter groups
    (settings) and option groups (add-on features). You can't edit config files over
    SSH; and engine parameters live in parameter groups, not option groups.
  ref: 'concepts.md#parameter-groups-option-groups-and-engine-configuration'
- id: aws-databases-rds-aurora-004
  difficulty: beginner
  tags:
  - multi-az
  - high-availability
  question: |
    What is the main purpose of an RDS Multi-AZ (instance) deployment?
  options:
  - To scale overall read throughput by load-balancing queries across the standby replica
  - To provide high availability via an automatically-failing-over standby in another AZ
  - To replicate data to another AWS Region for low-latency global reads
  - To reduce storage costs by keeping a compressed copy of the data on the standby node
  answer: 1
  explanation: |
    Multi-AZ (instance mode) maintains a synchronous, passive standby in a second AZ
    for HA and automatic failover. It does NOT serve reads (a common trap), is not
    cross-Region, and does not reduce cost.
  ref: 'concepts.md#multi-az-deployments-synchronous-standby-for-high-availability'
- id: aws-databases-rds-aurora-005
  difficulty: beginner
  tags:
  - read-replicas
  - read-scaling
  question: |
    What is the primary purpose of RDS read replicas?
  options:
  - Scaling read throughput by serving read-only queries
  - Automatic failover for the primary writer
  - Guaranteeing zero replication lag for read-your-writes
  - Providing synchronous write durability across two AZs
  answer: 0
  explanation: |
    Read replicas scale reads via asynchronous replication. They are NOT automatic
    failover targets (except in Aurora), they can lag (so no read-your-writes
    guarantee), and their replication is asynchronous, not synchronous.
  ref: 'concepts.md#read-replicas-asynchronous-replication-for-read-scaling'
- id: aws-databases-rds-aurora-006
  difficulty: beginner
  tags:
  - aurora
  - storage
  question: |
    How many copies of your data does Aurora keep, and across how many Availability
    Zones?
  options:
  - 3 copies across 3 AZs
  - 2 copies across 2 AZs
  - 6 copies across 6 AZs
  - 6 copies across 3 AZs (2 per AZ)
  answer: 3
  explanation: |
    Aurora replicates the cluster volume as 6 copies across 3 AZs (2 per AZ), enabling
    quorum reads/writes and AZ+1 fault tolerance. The other counts are incorrect.
  ref: 'concepts.md#aurora-architecture-shared-distributed-storage-and-the-log-is-the-database-model'
- id: aws-databases-rds-aurora-007
  difficulty: beginner
  tags:
  - aurora
  - endpoints
  question: |
    In an Aurora cluster, which endpoint should an application use for write operations?
  options:
  - The reader endpoint
  - A custom endpoint (always)
  - The cluster (writer) endpoint
  - Any instance endpoint at random
  answer: 2
  explanation: |
    The cluster/writer endpoint always points to the current primary and accepts
    writes. The reader endpoint load-balances read-only queries across replicas.
  ref: 'concepts.md#aurora-endpoints-replicas-and-read-scaling'
- id: aws-databases-rds-aurora-008
  difficulty: beginner
  tags:
  - aurora
  - replicas
  question: |
    What is the maximum number of Aurora Replicas you can have in a single Aurora DB
    cluster (in addition to the writer)?
  options:
  - '5'
  - '15'
  - '16'
  - '128'
  answer: 1
  explanation: |
    An Aurora cluster supports up to 15 Aurora Replicas plus the primary writer.
    (A read-only secondary cluster in a Global Database can have up to 16.)
  ref: 'concepts.md#aurora-endpoints-replicas-and-read-scaling'
- id: aws-databases-rds-aurora-009
  difficulty: beginner
  tags:
  - serverless
  - acu
  question: |
    In Aurora Serverless v2, what does one ACU (Aurora Capacity Unit) approximately
    correspond to?
  options:
  - Exactly 1 vCPU of dedicated compute with no associated memory allocation
  - 1 TB of provisioned cluster storage capacity that scales with the ACU count
  - A fixed pool of 1000 concurrent database connections regardless of instance size
  - About 2 GiB of memory plus associated CPU and networking
  answer: 3
  explanation: |
    1 ACU is approximately 2 GiB of RAM with corresponding CPU and networking. ACUs
    measure compute/memory capacity, not storage or connections.
  ref: 'concepts.md#aurora-serverless-v2-on-demand-acu-autoscaling'
- id: aws-databases-rds-aurora-010
  difficulty: beginner
  tags:
  - rds-proxy
  - lambda
  question: |
    What problem does Amazon RDS Proxy primarily solve?
  options:
  - It pools and multiplexes database connections to prevent connection exhaustion, especially for Lambda
  - It automatically shards write traffic across multiple Regions for horizontal write scaling
  - It transparently converts your SQL statements into optimized NoSQL key-value operations
  - It provides cross-Region disaster recovery by continuously replicating the database to a standby Region
  answer: 0
  explanation: |
    RDS Proxy is a managed connection pool that multiplexes many client connections
    onto fewer backend connections — the standard fix for Lambda blowing through
    max_connections. It does not shard, translate queries, or do cross-Region DR.
  ref: 'concepts.md#rds-proxy-connection-pooling-and-failover-for-serverless-and-spiky-clients'
- id: aws-databases-rds-aurora-011
  difficulty: beginner
  tags:
  - backups
  - pitr
  question: |
    What is the valid retention range for RDS automated backups that enable
    point-in-time recovery?
  options:
  - 0 to 7 days only
  - 1 to 90 days
  - 1 to 35 days (0 disables automated backups)
  - Always exactly 30 days
  answer: 2
  explanation: |
    Automated backups can be retained 1–35 days (default is commonly 7); setting 0
    disables them. PITR is only possible within that retention window.
  ref: 'concepts.md#backups-point-in-time-recovery-and-snapshots'
- id: aws-databases-rds-aurora-012
  difficulty: beginner
  tags:
  - snapshots
  - backups
  question: |
    How do manual DB snapshots differ from automated backups in RDS?
  options:
  - Manual snapshots are purged automatically once they reach the 35-day retention ceiling
  - Manual snapshots are user-initiated and retained until you delete them, and can be copied cross-Region
    and shared across accounts
  - Manual snapshots enable second-level point-in-time recovery to any timestamp within the window
  - Manual snapshots are metadata-only markers and cannot themselves be used to restore a database
  answer: 1
  explanation: |
    Manual snapshots persist until explicitly deleted and are portable (cross-Region
    copy, cross-account share). Automated backups (not manual snapshots) provide
    second-level PITR within the retention window.
  ref: 'concepts.md#backups-point-in-time-recovery-and-snapshots'
- id: aws-databases-rds-aurora-013
  difficulty: beginner
  tags:
  - dynamodb
  - selection
  question: |
    Which characteristic most strongly favors DynamoDB over RDS/Aurora?
  options:
  - You have well-known access patterns and need seamless horizontal scale with predictable single-digit-ms
    latency
  - You need complex multi-table joins across many highly normalized tables in a single query
  - You need to run ad-hoc analytical SQL queries with arbitrary filters, aggregations, and groupings
  - You need strong foreign-key referential integrity enforced by the engine across related tables
  answer: 0
  explanation: |
    DynamoDB shines when access patterns are known and you need horizontal scale with
    predictable latency. Joins, ad-hoc SQL, and cross-table referential integrity are
    relational strengths, favoring RDS/Aurora.
  ref: 'concepts.md#choosing-the-engine-and-data-store-rds-vs-aurora-vs-dynamodb-vs-self-managed'
- id: aws-databases-rds-aurora-014
  difficulty: beginner
  tags:
  - aurora
  - serverless
  - cost
  question: |
    Which workload profile is the best fit for Aurora Serverless v2?
  options:
  - A steady, predictable 24/7 workload at constant high utilization
  - A workload requiring multi-master writes across three regions
  - A spiky or unpredictable workload, or a dev/test environment that is often idle
  - A pure analytical data warehouse workload
  answer: 2
  explanation: |
    Serverless v2 excels at variable/spiky and idle workloads by scaling ACUs to match
    demand. Steady 24/7 load is usually cheaper on provisioned + Reserved Instances;
    multi-master/warehouse are different products.
  ref: 'concepts.md#aurora-serverless-v2-on-demand-acu-autoscaling'
- id: aws-databases-rds-aurora-015
  difficulty: intermediate
  tags:
  - multi-az
  - replication
  - consistency
  question: |
    Why does an RDS Multi-AZ (instance) deployment provide an effective RPO of ~0 for
    an AZ failure?
  options:
  - Because it captures an automated storage snapshot every single second to a durable backup store
  - Because the standby continuously serves reads back to the primary to verify the data matches
  - Because it uses asynchronous binlog replication with a small in-memory buffer to minimize data loss
  - Because writes are synchronously replicated to the standby before the client is acknowledged
  answer: 3
  explanation: |
    Synchronous replication means a commit is durable on both the primary and the
    standby (in another AZ) before the client sees success, so no committed data is
    lost on AZ failure. Asynchronous binlog replication would have nonzero RPO.
  ref: 'concepts.md#multi-az-deployments-synchronous-standby-for-high-availability'
- id: aws-databases-rds-aurora-016
  difficulty: intermediate
  tags:
  - multi-az
  - read-replicas
  - design
  question: |
    A team says "we enabled Multi-AZ (instance mode), so our read traffic is now
    spread across two AZs." Why is this statement wrong?
  options:
  - Multi-AZ instance mode actually replicates the data synchronously across three AZs rather than two
  - The Multi-AZ standby is passive and serves no reads; you need read replicas to offload reads
  - Multi-AZ deployments only work for Aurora clusters and are not supported on standard RDS instances
  - The passive standby in Multi-AZ mode serves write traffic to the application, not read traffic
  answer: 1
  explanation: |
    In Multi-AZ instance mode the standby is a passive failover target that serves
    neither reads nor writes. To scale reads you add read replicas (or use Multi-AZ
    cluster mode / Aurora, which do have readable standbys/replicas).
  ref: 'concepts.md#multi-az-deployments-synchronous-standby-for-high-availability'
- id: aws-databases-rds-aurora-017
  difficulty: intermediate
  tags:
  - read-replicas
  - consistency
  - read-your-writes
  question: |
    An application writes a row and immediately reads it back from an RDS read
    replica, sometimes getting "not found." What is the cause and best fix?
  options:
  - Replica lag from asynchronous replication; route read-after-write queries to the primary
  - The read replica's storage is corrupt; delete and rebuild it from a fresh snapshot to fix the misses
  - The primary silently lost the committed write; enable Multi-AZ so writes are durable before acknowledgment
  - The reader endpoint is misconfigured; switch the replicas to synchronous replication to remove the gap
  answer: 0
  explanation: |
    Read replicas are asynchronous, so a just-written row may not have propagated —
    breaking read-your-writes. Route read-after-write to the writer (or pin the
    session). RDS read replicas cannot be made synchronous.
  ref: 'concepts.md#read-replicas-asynchronous-replication-for-read-scaling'
- id: aws-databases-rds-aurora-018
  difficulty: intermediate
  tags:
  - aurora
  - storage
  - network
  question: |
    What key aspect of Aurora's design reduces write network I/O compared to a
    traditional MySQL/Postgres replication setup?
  options:
  - It compresses each full data page with a fast algorithm before sending it to the replicas
  - It writes exclusively to fast local NVMe SSD and never sends any write traffic over the network
  - It disables the write-ahead log entirely and relies on periodic checkpoints for durability
  - The writer ships only redo log records to the storage layer, which materializes pages, instead of
    writing full data pages
  answer: 3
  explanation: |
    Aurora sends only redo log records to the distributed storage fleet ("the log is
    the database"), which applies them to produce pages — avoiding shipping full 8/16
    KB pages and cutting write amplification. It still uses a log; it does write over
    the network.
  ref: 'concepts.md#aurora-architecture-shared-distributed-storage-and-the-log-is-the-database-model'
- id: aws-databases-rds-aurora-019
  difficulty: intermediate
  tags:
  - aurora
  - failover
  - rto
  question: |
    Why is Aurora failover typically faster (often under 30 seconds) than RDS Multi-AZ
    failover (60–120 seconds)?
  options:
  - Aurora keeps a fully-sized hot standby compute node continuously running in a second AZ, so failover is
    just a DNS swap to the already-warm instance
  - Aurora skips all DNS updates during failover because clients reconnect through a fixed virtual IP that
    never changes
  - Aurora Replicas already share the same storage volume, so promoting one requires no volume reattach
    or full crash recovery
  - Aurora uses synchronous storage replication while RDS Multi-AZ relies on slower asynchronous binlog shipping
  answer: 2
  explanation: |
    Because Aurora Replicas read from the same shared cluster volume as the writer,
    promotion is fast — no EBS reattach or heavyweight crash recovery. Both do DNS
    updates; RDS Multi-AZ is also synchronous, so that's not the differentiator.
  ref: 'concepts.md#aurora-architecture-shared-distributed-storage-and-the-log-is-the-database-model'
- id: aws-databases-rds-aurora-020
  difficulty: intermediate
  tags:
  - aurora
  - quorum
  question: |
    Aurora uses a 4-of-6 write quorum and 3-of-6 read quorum across its 6 copies.
    What does this design let Aurora tolerate?
  options:
  - Loss of all copies in a single AZ with zero impact, but only for read operations since writes still
    require every one of the 6 copies to acknowledge
  - Losing an entire AZ (2 copies) and still writing, and losing an AZ plus one more copy without losing
    data
  - Losing 5 of the 6 copies and still accepting writes, because the write quorum only requires 1 surviving
    copy to persist the redo log
  - Nothing — quorum sizing only affects read/write latency and throughput, not availability or fault tolerance
  answer: 1
  explanation: |
    With 6 copies over 3 AZs, a 4/6 write quorum survives losing a full AZ (2 copies)
    for writes, and the design tolerates AZ+1 (an AZ plus one additional copy) without
    data loss for reads. Losing 5 of 6 breaks the write quorum.
  ref: 'concepts.md#aurora-architecture-shared-distributed-storage-and-the-log-is-the-database-model'
- id: aws-databases-rds-aurora-021
  difficulty: intermediate
  tags:
  - serverless
  - scaling
  question: |
    What distinguishes Aurora Serverless v2 scaling from Serverless v1?
  options:
  - v2 doubles/halves capacity abruptly and pauses connections; v1 scales smoothly
  - v2 can only scale capacity upward on demand and never scales back down, so you must delete and recreate
    the cluster to shrink it
  - v2 requires a manual reboot of every instance in the cluster before any capacity change can take effect
  - v2 scales in-place in fine (0.5 ACU) increments without dropping connections, while queries and transactions
    run
  answer: 3
  explanation: |
    Serverless v2 scales seamlessly in ~0.5-ACU steps in-place, with no connection
    drops, even mid-transaction. v1 scaled by doubling/halving and needed quiet points
    that disrupted connections. v2 scales both directions and needs no reboot.
  ref: 'concepts.md#aurora-serverless-v2-on-demand-acu-autoscaling'
- id: aws-databases-rds-aurora-022
  difficulty: intermediate
  tags:
  - global-database
  - replication
  - lag
  question: |
    What is the typical cross-Region replication lag for Aurora Global Database, and
    how is it achieved?
  options:
  - Typically under 1 second, via dedicated storage-layer replication infrastructure
  - Several minutes, via engine-level binlog replication replayed row-by-row on the secondary cluster
  - Exactly zero, via synchronous cross-Region commits that block each write until the remote Region acknowledges
  - About 30 seconds, via periodic incremental snapshot copies shipped between the Regional storage layers
  answer: 0
  explanation: |
    Aurora Global Database replicates at the storage layer using dedicated infra with
    latency typically under a second and little primary overhead. It is asynchronous
    (not zero/synchronous) and not snapshot-based or engine binlog-based.
  ref: 'concepts.md#aurora-global-database-cross-region-replication-and-disaster-recovery'
- id: aws-databases-rds-aurora-023
  difficulty: intermediate
  tags:
  - rds-proxy
  - pinning
  question: |
    Which situation reduces the connection-multiplexing benefit of RDS Proxy by
    forcing it to "pin" a client to a backend connection?
  options:
  - Using simple stateless autocommit SELECT statements that touch no session-scoped objects between calls
  - Routing read-only queries to a read replica through the proxy's reader endpoint under heavy load
  - Session-level state such as temporary tables or session variables
  - Enabling IAM database authentication so clients present short-lived tokens instead of static passwords
  answer: 2
  explanation: |
    Session state (temp tables, session variables, certain prepared statements) forces
    the proxy to pin a client to one backend connection, since that state can't be
    shared — reducing multiplexing. Stateless SQL maximizes sharing.
  ref: 'concepts.md#rds-proxy-connection-pooling-and-failover-for-serverless-and-spiky-clients'
- id: aws-databases-rds-aurora-024
  difficulty: intermediate
  tags:
  - scaling
  - writes
  - limits
  question: |
    Your RDS PostgreSQL write throughput has saturated the largest available instance
    class. Which option can actually increase WRITE throughput on the relational tier?
  options:
  - Add more read replicas so the writer can distribute incoming write transactions across the replica fleet
  - None of these scale writes; you must shard at the application layer, adopt CQRS, or re-platform to
    a horizontally-scalable store
  - Add an ElastiCache read cache in front of the database to absorb and coalesce the incoming write traffic
  - Enable Multi-AZ so the synchronous standby in the second AZ shares half of the write load with the primary
  answer: 1
  explanation: |
    A single relational writer does not scale writes horizontally. Read replicas and
    caches only help reads; the Multi-AZ standby is passive. To scale writes you shard
    the app, use CQRS, or move to a store like DynamoDB.
  ref: 'concepts.md#rds-instance-classes-storage-and-vertical-scaling-limits'
- id: aws-databases-rds-aurora-025
  difficulty: intermediate
  tags:
  - storage
  - gp3
  - io2
  question: |
    For an RDS workload that needs to independently tune IOPS and throughput without
    overpaying for the highest tier, which storage type is the best default?
  options:
  - gp3 general-purpose SSD
  - Magnetic (standard)
  - io2 Block Express only
  - Instance store (ephemeral) volumes
  answer: 0
  explanation: |
    gp3 lets you provision IOPS and throughput independently of volume size at a good
    price, making it the sensible default. io2 Block Express is for the highest,
    most consistent IOPS; magnetic is legacy; instance store isn't used for RDS.
  ref: 'concepts.md#rds-instance-classes-storage-and-vertical-scaling-limits'
- id: aws-databases-rds-aurora-026
  difficulty: intermediate
  tags:
  - aurora
  - storage
  - limits
  question: |
    Up to what size does the Aurora cluster volume automatically grow?
  options:
  - 16 TiB
  - 64 TiB
  - 128 TiB
  - 1 PiB
  answer: 2
  explanation: |
    Aurora storage auto-scales in 10 GB increments up to 128 TiB with no manual
    provisioning. The other values are not the current Aurora maximum.
  ref: 'concepts.md#aurora-architecture-shared-distributed-storage-and-the-log-is-the-database-model'
- id: aws-databases-rds-aurora-027
  difficulty: intermediate
  tags:
  - backups
  - backtrack
  - aurora
  question: |
    Which Aurora-specific feature lets you rewind a cluster in-place to a prior point
    in time without restoring to a new cluster (Aurora MySQL only)?
  options:
  - Point-in-time recovery
  - Cross-Region snapshot copy
  - Global Database failover
  - Backtrack
  answer: 3
  explanation: |
    Backtrack (Aurora MySQL) rewinds the existing cluster to a prior second without
    creating a new cluster — great for undoing a bad change quickly. PITR always
    creates a new cluster; the others are different features.
  ref: 'concepts.md#backups-point-in-time-recovery-and-snapshots'
- id: aws-databases-rds-aurora-028
  difficulty: intermediate
  tags:
  - selection
  - aurora
  - rds
  question: |
    A team needs a specific PostgreSQL extension and an exact community engine version
    that Aurora does not yet support. What is the most appropriate choice?
  options:
  - Aurora PostgreSQL — it supports every community PostgreSQL extension and version the moment they are released upstream
  - RDS for PostgreSQL, which runs the community engine with broad version/extension parity
  - DynamoDB fronted by a relational wrapper layer that transparently emulates the PostgreSQL extension you need
  - Aurora Serverless v2, which enables all community extensions automatically as soon as a session requests them
  answer: 1
  explanation: |
    Aurora is a reimplementation and can lag on niche versions/extensions. RDS for
    PostgreSQL runs the actual community engine, offering the broadest parity. If even
    RDS can't, self-manage on EC2. DynamoDB is non-relational.
  ref: 'concepts.md#choosing-the-engine-and-data-store-rds-vs-aurora-vs-dynamodb-vs-self-managed'
- id: aws-databases-rds-aurora-029
  difficulty: intermediate
  tags:
  - lambda
  - connections
  - design
  question: |
    A bursty Lambda function connects directly to Aurora and intermittently throws
    "too many connections" errors under load. What is the most appropriate fix?
  options:
  - Put RDS Proxy between Lambda and Aurora to pool and multiplex connections
  - Increase the Lambda function timeout to the 15-minute maximum so each invocation holds its connection longer
  - Switch the Aurora cluster to Multi-AZ so the standby absorbs the overflow of client connections
  - Add more Aurora read replicas so incoming connections are spread across additional reader instances
  answer: 0
  explanation: |
    Bursty Lambda concurrency opens a connection per container and exhausts
    max_connections. RDS Proxy multiplexes thousands of client connections onto a
    small backend pool. Timeouts, Multi-AZ, and read replicas don't address connection
    exhaustion.
  ref: 'concepts.md#rds-proxy-connection-pooling-and-failover-for-serverless-and-spiky-clients'
- id: aws-databases-rds-aurora-030
  difficulty: intermediate
  tags:
  - read-replicas
  - cross-region
  - global-database
  question: |
    For serious multi-Region read locality and DR on Aurora, why is Aurora Global
    Database usually preferred over an RDS-style cross-Region read replica?
  options:
  - It uses synchronous cross-Region commits that acknowledge only after the remote Region persists, giving zero RPO
  - It is cheaper because it provisions no secondary clusters and bills only for the cross-Region network transfer
  - It supports true multi-master writes accepted independently in every Region without any coordination
  - It replicates at the storage layer with typically sub-second lag and negligible primary overhead,
    plus fast managed failover
  answer: 3
  explanation: |
    Global Database uses storage-level replication: sub-second lag, little primary
    load, and managed switchover/failover. It is asynchronous (not zero-RPO/
    synchronous), does use paid secondary clusters, and is single-writer (not
    multi-master).
  ref: 'concepts.md#aurora-global-database-cross-region-replication-and-disaster-recovery'
- id: aws-databases-rds-aurora-031
  difficulty: intermediate
  tags:
  - aurora
  - failover-priority
  question: |
    How can you influence which Aurora Replica is promoted first during a failover?
  options:
  - You cannot influence it at all; Aurora always selects a replica uniformly at random during every failover
  - By deleting all but one replica ahead of time so only the intended survivor remains eligible for promotion
  - By assigning failover priority tiers (0–15) to the replicas
  - By pinning the reader endpoint to one specific instance so Aurora promotes whichever instance it targets
  answer: 2
  explanation: |
    Failover priority tiers (0 highest priority) let you control promotion order;
    Aurora prefers the lowest-numbered tier and, on ties, the largest instance. It is
    not random, and you don't need to delete replicas or repoint the reader endpoint.
  ref: 'concepts.md#aurora-endpoints-replicas-and-read-scaling'
- id: aws-databases-rds-aurora-032
  difficulty: intermediate
  tags:
  - parameter-groups
  - aurora
  question: |
    In Aurora, which type of parameter group holds settings that apply cluster-wide to
    all instances (e.g., binlog configuration)?
  options:
  - DB instance parameter group, which applies its settings individually to each instance in the cluster
  - DB cluster parameter group
  - Option group, which layers cluster-wide engine add-on features on top of every instance at once
  - Security group, which centrally governs the network settings shared by all instances in the cluster
  answer: 1
  explanation: |
    Aurora uses DB cluster parameter groups for cluster-wide settings and DB instance
    parameter groups for per-instance settings. Option groups are for engine add-on
    features; security groups control network access.
  ref: 'concepts.md#parameter-groups-option-groups-and-engine-configuration'
- id: aws-databases-rds-aurora-033
  difficulty: intermediate
  tags:
  - pitr
  - restore
  - ops
  question: |
    A developer wants to "restore RDS to how it was 3 hours ago" using point-in-time
    recovery. What actually happens?
  options:
  - The existing instance is rewound in place to that timestamp and resumes serving on the same endpoint
  - PITR only works when Multi-AZ is enabled, because the standby retains the transaction history to replay
  - PITR permanently discards every write newer than the most recent automated snapshot before reopening
  - RDS creates a NEW instance/cluster restored to that timestamp; you then repoint the app
  answer: 3
  explanation: |
    RDS PITR always provisions a new instance/cluster restored to the chosen second
    within the retention window; you cannot roll back in place (Aurora backtrack is the
    in-place exception, MySQL only). Multi-AZ isn't required for PITR.
  ref: 'concepts.md#backups-point-in-time-recovery-and-snapshots'
- id: aws-databases-rds-aurora-034
  difficulty: intermediate
  tags:
  - dynamodb
  - aurora
  - selection
  question: |
    An app needs unbounded horizontal write scale, predictable single-digit-ms latency
    at any volume, and multi-Region active-active writes. Data access is by known keys.
    Which store fits best and what do you give up?
  options:
  - DynamoDB (with Global Tables); you give up rich joins, ad-hoc SQL, and cross-row relational transactions
    in exchange for scale and multi-master writes
  - Aurora Global Database; you give up nothing since it accepts active-active writes in every Region natively
  - RDS Multi-AZ; you give up only a little latency while still getting unbounded horizontal write scaling
  - Self-managed PostgreSQL on EC2; you give up nothing because you can shard writes across Regions manually
  answer: 0
  explanation: |
    Multi-Region active-active writes and unbounded horizontal scale point to DynamoDB
    Global Tables. The trade-off is losing relational features (joins, ad-hoc SQL,
    multi-row transactions across the model). Aurora is single-writer per Region.
  ref: 'concepts.md#choosing-the-engine-and-data-store-rds-vs-aurora-vs-dynamodb-vs-self-managed'
- id: aws-databases-rds-aurora-035
  difficulty: advanced
  tags:
  - multi-az-cluster
  - design
  - consistency
  question: |
    A team needs both HA and some read scaling but wants faster failover than the
    classic 60–120 s. They consider RDS Multi-AZ CLUSTER mode. What is the key
    trade-off they must accept versus Multi-AZ instance mode?
  options:
  - Cluster mode removes automatic failover entirely, so an operator must manually promote a standby after every writer outage
  - Cluster mode provisions no standby at all and keeps only a single writer, so the effective RPO is nonzero
  - The two standbys are readable but use semi-synchronous replication, so reads there can be slightly
    stale
  - Cluster mode operates only across separate AWS Regions and cannot be deployed across Availability Zones within one Region
  answer: 2
  explanation: |
    Multi-AZ cluster mode (writer + two readable standbys across 3 AZs) gives faster
    failover (often <35 s) and readable standbys, but replication is semi-synchronous
    so those reads can lag slightly. It still fails over automatically and is within a
    Region.
  ref: 'concepts.md#multi-az-deployments-synchronous-standby-for-high-availability'
- id: aws-databases-rds-aurora-036
  difficulty: advanced
  tags:
  - global-database
  - rpo
  - rto
  - dr
  question: |
    For an Aurora Global Database, what are the realistic RPO and RTO characteristics
    of an UNPLANNED cross-Region failover after a primary Region outage?
  options:
  - RPO = 0 and RTO = 0, fully transparent because secondaries commit synchronously with the primary Region
  - RPO typically ≤ 1 second (the replication lag) and RTO roughly one minute to a few minutes
  - RPO of several hours and RTO of several hours, since recovery restores the last cross-Region snapshot copy
  - RPO = 35 days (the backup window) and RTO nearly instantaneous, driven by the automated backup retention
  answer: 1
  explanation: |
    Unplanned cross-Region failover has RPO bounded by the sub-second async
    replication lag (typically ≤ 1 s) and RTO of about a minute to a few minutes to
    promote a secondary. A planned switchover, by contrast, is zero-RPO.
  ref: 'concepts.md#aurora-global-database-cross-region-replication-and-disaster-recovery'
- id: aws-databases-rds-aurora-037
  difficulty: advanced
  tags:
  - global-database
  - switchover
  - rpo
  question: |
    Why can an Aurora Global Database "switchover" (planned managed operation) achieve
    zero RPO while an unplanned failover cannot?
  options:
  - In a planned switchover the primary is healthy, so Aurora can ensure the secondary is fully caught
    up before transferring the writer role; an unplanned outage gives no chance to drain in-flight replication
  - Switchover copies a fresh full snapshot synchronously to the secondary Region and blocks every write
    until that copy is durably persisted, which is what removes any possibility of data loss on transfer
  - Switchover permanently disables cross-Region replication lag at all times by switching the link into a
    synchronous commit mode, so the secondary stays byte-for-byte identical to the primary during normal runs
  - There is genuinely no difference between the two; both a planned switchover and an unplanned failover
    always reach exactly zero RPO because Aurora buffers every in-flight write on the secondary before ack
  answer: 0
  explanation: |
    A planned switchover coordinates with a healthy primary to fully synchronize the
    target before promotion, so no committed data is lost. An unplanned Region outage
    cannot drain the in-flight (sub-second) replication backlog, hence RPO ≤ ~1 s.
  ref: 'concepts.md#aurora-global-database-cross-region-replication-and-disaster-recovery'
- id: aws-databases-rds-aurora-038
  difficulty: advanced
  tags:
  - serverless
  - cost
  - design
  question: |
    A SaaS runs 5,000 small tenant databases, most idle most of the day with
    occasional bursts. Which approach minimizes cost while preserving per-tenant
    isolation and burst capacity?
  options:
  - One large provisioned Aurora cluster shared by every tenant and permanently sized for aggregate peak capacity
  - One RDS Multi-AZ instance provisioned per tenant, each sized for peak load with a passive standby held in a second AZ
  - One Aurora Serverless v2 cluster per tenant with a wide min–max ACU range (min possibly 0 for scale-to-zero)
  - A single shared DynamoDB table holding all 5,000 tenants keyed by tenant id and served from on-demand capacity
  answer: 2
  explanation: |
    Serverless v2 per tenant lets each idle cluster shrink (even to 0 ACU with
    scale-to-zero) and burst independently, matching spend to usage with isolation.
    Peak-sized provisioned instances waste money; a shared cluster loses isolation;
    DynamoDB changes the data model entirely.
  ref: 'concepts.md#aurora-serverless-v2-on-demand-acu-autoscaling'
- id: aws-databases-rds-aurora-039
  difficulty: advanced
  tags:
  - serverless
  - scale-to-zero
  - latency
  question: |
    What is the main downside of enabling Aurora Serverless v2 scale-to-zero
    (min 0 ACU) for a production customer-facing API?
  options:
  - It doubles the per-GB cluster storage cost because Aurora keeps a second full paused-state copy of the volume on standby
  - It permanently deletes all cluster data the moment capacity reaches zero, so you must restore from a snapshot to resume
  - It disables all read replicas on the cluster while paused, forcing every reader connection onto the writer once it resumes
  - The first request after the cluster pauses incurs a resume (cold-start) latency of seconds, which
    is bad for latency-critical always-on paths
  answer: 3
  explanation: |
    Scale-to-zero saves compute cost when idle but adds a resume latency (seconds) on
    the first connection after a pause — unacceptable for latency-sensitive always-on
    APIs, fine for dev/test/intermittent. Data is preserved; storage isn't doubled.
  ref: 'concepts.md#aurora-serverless-v2-on-demand-acu-autoscaling'
- id: aws-databases-rds-aurora-040
  difficulty: advanced
  tags:
  - aurora
  - replica-lag
  - endpoints
  question: |
    An Aurora reader endpoint balances traffic per-connection. A service uses a
    long-lived connection pool and observes uneven load across replicas. What is the
    best explanation?
  options:
  - The reader endpoint rebalances on every individual query using live per-replica CPU telemetry, so uneven load can only be an AWS-side routing bug
  - Reader endpoint load balancing is per-connection, so long-lived pooled connections can stick to a
    subset of replicas and skew load
  - Aurora Replicas cannot share read load among themselves at all, so all pooled reads inevitably pile onto one arbitrarily chosen replica
  - The writer endpoint is silently serving the pooled read connections, which is why the reader replicas appear unevenly loaded
  answer: 1
  explanation: |
    The reader endpoint distributes new connections, not individual queries. Long-lived
    pooled connections established once can concentrate on a few replicas. Mitigations
    include recycling connections or using custom endpoints/driver-level balancing.
  ref: 'concepts.md#aurora-endpoints-replicas-and-read-scaling'
- id: aws-databases-rds-aurora-041
  difficulty: advanced
  tags:
  - failure-modes
  - region
  - design
  question: |
    A single-Region Aurora cluster with 3 Aurora Replicas across 3 AZs and daily
    snapshots suffers a full REGION outage. Which statement is correct?
  options:
  - It is fully down for that Region; recovery requires restoring a cross-Region-copied snapshot or having
    an Aurora Global Database secondary — neither of which a single-Region cluster provides
  - The cluster fails over automatically to a paired standby Region within 30 seconds because Aurora silently keeps a hidden cross-Region copy of every volume
  - The three in-Region Aurora Replicas keep the cluster fully available throughout, since the data already lives redundantly across all three Availability Zones
  - The read replicas in the same Region continue serving read-only traffic unaffected, because reads are decoupled from the failed Region's control plane
  answer: 0
  explanation: |
    Multi-AZ (3 AZs) survives an AZ outage, not a whole-Region outage. Without a
    cross-Region snapshot copy or Aurora Global Database secondary, the workload is
    down until you restore elsewhere. Aurora does not auto-fail-over across Regions
    without Global Database.
  ref: 'concepts.md#trade-offs-and-when-to-use-what-failure-modes-rpo-rto'
- id: aws-databases-rds-aurora-042
  difficulty: advanced
  tags:
  - rds-proxy
  - failover
  - tradeoff
  question: |
    Besides pooling connections, what additional benefit does RDS Proxy provide, and
    what cost does it add?
  options:
  - It automatically shards incoming writes across multiple backend instances for horizontal write scale; it adds no measurable latency to the request path
  - It provides synchronous cross-Region replication of every committed write to a standby Region; it roughly doubles your total storage cost as a result
  - It transparently caches query result sets in the proxy tier and serves repeat reads from that cache; it adds no additional cost beyond the database itself
  - It reduces failover-induced application errors by holding client connections while re-pointing to
    the new writer; it adds a small latency hop and hourly cost
  answer: 3
  explanation: |
    RDS Proxy shortens perceived failover by preserving client connections and
    redirecting to the promoted writer, cutting errors. The trade-off is a small
    (~single-digit ms) latency hop and an hourly per-vCPU charge. It doesn't shard,
    replicate cross-Region, or cache results.
  ref: 'concepts.md#rds-proxy-connection-pooling-and-failover-for-serverless-and-spiky-clients'
- id: aws-databases-rds-aurora-043
  difficulty: advanced
  tags:
  - global-database
  - write-forwarding
  - consistency
  question: |
    A global app uses Aurora Global Database and enables write forwarding from a
    secondary Region. What is the fundamental characteristic of writes in this setup?
  options:
  - Each Region gets its own fully independent writer that accepts and commits local writes concurrently (true active-active multi-master)
  - Writes issued from the secondary are silently dropped whenever the primary Region is geographically far away and round-trip latency crosses a threshold
  - All writes are still applied by the single primary-Region writer; the secondary forwards them, incurring
    cross-Region write latency
  - Write forwarding upgrades the cross-Region replication link to synchronous commit, making every forwarded write zero-RPO and instantly durable in both Regions
  answer: 2
  explanation: |
    Write forwarding routes secondary-Region writes to the single primary writer — it
    is still single-writer, just more convenient — so writes pay cross-Region latency.
    It is not multi-master and does not make replication synchronous.
  ref: 'concepts.md#aurora-global-database-cross-region-replication-and-disaster-recovery'
- id: aws-databases-rds-aurora-044
  difficulty: advanced
  tags:
  - cost
  - aurora
  - io-optimized
  question: |
    An Aurora workload is extremely I/O-heavy and the per-request I/O charges dominate
    the bill. Which lever most directly addresses this?
  options:
  - Enable Multi-AZ so the synchronous standby absorbs and splits the per-request I/O charges across two Availability Zones
  - Switch the cluster storage configuration to Aurora I/O-Optimized, which charges a fixed rate with
    no per-I/O billing
  - Add more Aurora read replicas so the I/O volume is distributed across the reader fleet and billed at a lower per-replica rate
  - Reduce the backup retention period so fewer retained backups are charged for the I/O they consume during snapshotting
  answer: 1
  explanation: |
    Aurora I/O-Optimized removes per-I/O charges in favor of a higher fixed compute/
    storage rate — cost-effective when I/O dominates. Multi-AZ and replicas add cost;
    backup retention affects backup storage, not I/O charges.
  ref: 'concepts.md#trade-offs-and-when-to-use-what-failure-modes-rpo-rto'
- id: aws-databases-rds-aurora-045
  difficulty: advanced
  tags:
  - selection
  - scaling
  - design
  question: |
    A read-heavy analytics-adjacent workload on Aurora needs many low-lag read
    replicas across AZs plus occasional independent read scaling. Which Aurora feature
    set best supports this while keeping replicas as failover targets?
  options:
  - RDS Multi-AZ instance standbys, which act as readable low-lag replicas across AZs and can be added on demand for extra read capacity
  - A single cross-Region read replica fed by engine-level asynchronous replication, serving all the low-lag in-Region read scaling you need
  - DynamoDB DAX, an in-memory acceleration layer that fronts the Aurora replicas to absorb the read-heavy query load across AZs
  - Up to 15 Aurora Replicas on shared storage with the reader endpoint and Aurora Auto Scaling, all doubling
    as failover targets
  answer: 3
  explanation: |
    Aurora's shared-storage replicas (up to 15) have low lag, are load-balanced by the
    reader endpoint, can be auto-scaled, and each is also a failover target — unifying
    read scaling and HA. Multi-AZ standbys aren't readable; DAX is DynamoDB.
  ref: 'concepts.md#aurora-endpoints-replicas-and-read-scaling'
- id: aws-databases-rds-aurora-046
  difficulty: advanced
  tags:
  - multi-az
  - cost
  - tradeoff
  question: |
    What is the primary cost trade-off of RDS Multi-AZ instance mode that Aurora's
    replica model avoids?
  options:
  - In Multi-AZ instance mode you pay for a fully-sized standby that serves no traffic (pure insurance),
    whereas Aurora Replicas do useful read work AND serve as failover targets
  - Multi-AZ mandates expensive provisioned-IOPS (io2) storage on both nodes, whereas Aurora's replica model runs on cheaper general-purpose gp3 volumes
  - Multi-AZ bills a per-I/O request charge on every synchronous replicated write to the standby, a charge that Aurora's storage model eliminates entirely
  - Multi-AZ requires paying a separate per-standby engine license fee for the passive node that Aurora's shared-storage replicas do not incur
  answer: 0
  explanation: |
    The Multi-AZ instance standby is passive — you roughly double compute cost for
    idle insurance. Aurora Replicas serve reads and are failover targets, so the money
    does double duty. The other statements are not the core trade-off.
  ref: 'concepts.md#multi-az-deployments-synchronous-standby-for-high-availability'
- id: aws-databases-rds-aurora-047
  difficulty: advanced
  tags:
  - storage
  - segments
  - self-healing
  question: |
    Aurora slices its cluster volume into 10 GB segments across many storage nodes.
    What operational advantage does this granularity provide during a storage-node
    failure?
  options:
  - It lets Aurora lock the entire cluster volume and rebuild all six copies together in one coordinated pass, guaranteeing every segment stays perfectly in sync
  - It deliberately doubles read latency during the failure by routing every read through two segments at once to double-check consistency before returning
  - Only the affected 10 GB segments need to be re-replicated/repaired from peers, enabling fast parallel
    self-healing with minimal impact
  - It forces a full cluster failover to a new writer instance so recovery can proceed on completely fresh storage nodes while the old ones rebuild
  answer: 2
  explanation: |
    Small (10 GB) protection-group segments mean recovery re-replicates only the lost
    segments in parallel from peer copies — fast, low-impact self-healing. It doesn't
    lock the whole volume or force a failover.
  ref: 'concepts.md#aurora-architecture-shared-distributed-storage-and-the-log-is-the-database-model'
- id: aws-databases-rds-aurora-048
  difficulty: advanced
  tags:
  - cross-region
  - replica
  - primary-load
  question: |
    Compared to Aurora Global Database, why does an RDS-style engine-level cross-Region
    read replica impose more load on the primary and higher, more variable lag?
  options:
  - It replicates at the distributed storage layer using the same dedicated infrastructure as Aurora Global Database, so it imposes no extra load on the primary at all
  - It uses the database engine's native replication (e.g., binlog/streaming) so the primary must generate
    and ship logical/physical replication, and cross-Region network variance widens lag
  - It uses synchronous cross-Region replication that blocks each commit on the primary until the remote replica acknowledges, which is what drives the higher latency
  - It copies a full engine snapshot to the remote Region every minute and replays it there, so the primary is doing constant heavy snapshot work
  answer: 1
  explanation: |
    Engine-level replication (binlog/streaming) makes the primary responsible for
    producing and shipping replication data, and cross-Region latency variance widens
    lag. Aurora Global Database offloads this to dedicated storage-layer infra.
  ref: 'concepts.md#read-replicas-asynchronous-replication-for-read-scaling'
- id: aws-databases-rds-aurora-049
  difficulty: advanced
  tags:
  - parameter-groups
  - static
  - reboot
  question: |
    You change a static parameter (e.g., a memory sizing parameter) in an RDS
    parameter group. When does it take effect?
  options:
  - Only after the DB instance is rebooted
  - Immediately, live, with no interruption
  - After 35 days
  - Never — static parameters cannot be changed on RDS
  answer: 0
  explanation: |
    Static parameters require a reboot to apply; dynamic parameters apply live. Static
    params are changeable — they just need a reboot, causing a brief interruption (or
    failover in Multi-AZ).
  ref: 'concepts.md#parameter-groups-option-groups-and-engine-configuration'
- id: aws-databases-rds-aurora-050
  difficulty: advanced
  tags:
  - design
  - consistency
  - read-your-writes
  question: |
    A checkout service reads a user's just-updated cart. It scales reads across Aurora
    Replicas but must always show the latest cart to that user. What is the cleanest
    way to guarantee read-your-writes here?
  options:
  - Read from the reader endpoint as usual and simply retry the query a few times whenever the just-written cart row comes back missing
  - Enable Multi-AZ on the cluster so the Aurora Replicas switch to synchronous replication and always reflect the latest committed cart
  - Route this user's post-write read to the writer (cluster endpoint) or the same instance that performed
    the write
  - Increase the number of Aurora Replicas so the extra reader capacity drives replication lag down to effectively zero for that user
  answer: 2
  explanation: |
    Aurora Replicas have small but nonzero lag, so read-your-writes needs the write
    and immediate read to hit the writer (or a session pinned to it). Multi-AZ doesn't
    make replicas synchronous, and more replicas don't remove lag.
  ref: 'concepts.md#aurora-endpoints-replicas-and-read-scaling'
- id: aws-databases-rds-aurora-051
  difficulty: expert
  tags:
  - quorum
  - math
  - availability
  question: |
    Aurora chose a 4/6 write quorum and 3/6 read quorum rather than, say, 3/6 write and
    4/6 read. What property does the 4-write / 3-read choice guarantee, and why does it
    matter for AZ+1 durability?
  options:
  - It minimizes write latency by acknowledging after just the single fastest copy responds, deliberately trading read consistency away to hit lower commit times
  - It allows a write to be acknowledged as durable with only 1 of the 6 copies persisting the redo log, maximizing write availability during heavy copy loss
  - It makes every read synchronous across all 6 copies by requiring a unanimous acknowledgment before returning, guaranteeing consistency at the cost of read speed
  - Write set (4) and read set (3) always overlap by at least one copy (4+3>6), so any read sees the latest
    write; with 6 copies over 3 AZs this lets writes proceed after losing a full AZ (2 copies) and still
    read after AZ+1
  answer: 3
  explanation: |
    With 4+3>6 the write and read quorums always intersect, so reads observe the latest
    acknowledged write. 6 copies across 3 AZs means losing an AZ removes 2 copies,
    still leaving 4 for writes; AZ+1 (3 lost) still leaves 3 for reads — the durability
    story. It doesn't allow single-copy writes or full-synchronous reads.
  ref: 'concepts.md#aurora-architecture-shared-distributed-storage-and-the-log-is-the-database-model'
- id: aws-databases-rds-aurora-052
  difficulty: expert
  tags:
  - global-database
  - limits
  - secondary
  question: |
    Which of these is a TRUE current limit/behavior of Aurora Global Database that an
    architect should design around?
  options:
  - You can independently stop and start each individual Regional cluster in the global database on its own schedule to save cost while idle
  - A secondary cluster can have more read instances than a normal cluster (up to 16 vs 15) because it
    is read-only
  - Backtrack (in-place rewind to a prior second) is fully supported on every cluster in a global database, both primary and secondary
  - Secondary Regions each accept local writes independently by default, applying them locally and reconciling with the primary asynchronously
  answer: 1
  explanation: |
    A read-only secondary cluster supports up to 16 read replicas (vs the usual 15)
    since it has no writer to host. You cannot stop/start Regional clusters
    individually, backtrack is not supported on global DBs, and secondaries are
    read-only (writes go to the primary, optionally via write forwarding).
  ref: 'concepts.md#aurora-global-database-cross-region-replication-and-disaster-recovery'
- id: aws-databases-rds-aurora-053
  difficulty: expert
  tags:
  - serverless
  - limits
  - capacity
  question: |
    A steady, latency-critical OLTP workload consistently needs ~180 GiB of RAM and
    runs 24/7. An engineer proposes Aurora Serverless v2 with max 256 ACU. What is the
    most accurate critique?
  options:
  - It works, but at constant high utilization a provisioned instance with Reserved Instances is typically
    cheaper per unit of capacity, and serverless's elasticity value is wasted on a flat 24/7 load
  - Serverless v2 cannot physically reach that much memory; a 256-ACU ceiling caps out at only about 64 GiB of RAM, far short of the 180 GiB needed
  - Serverless v2 cannot run steady OLTP workloads at all because its autoscaling engine is built only for intermittent analytical and batch query patterns
  - You are forced to enable scale-to-zero on Serverless v2, and the repeated cold-start resume latency will badly hurt this latency-critical 24/7 workload
  answer: 0
  explanation: |
    256 ACU is ~512 GiB, so capacity isn't the issue. The critique is economic:
    steady 24/7 load doesn't benefit from serverless elasticity and is usually cheaper
    on provisioned + RIs. Serverless v2 handles OLTP fine; scale-to-zero is optional.
  ref: 'concepts.md#aurora-serverless-v2-on-demand-acu-autoscaling'
- id: aws-databases-rds-aurora-054
  difficulty: expert
  tags:
  - failover
  - aurora
  - no-replica
  question: |
    An Aurora cluster has ONLY a writer and zero Aurora Replicas. The writer instance
    fails. What happens, and what is the availability implication?
  options:
  - Failover is instant and transparent because the shared storage volume simply reattaches to a hot spare writer that Aurora keeps warm for exactly this case
  - The cluster and all its data are permanently lost because there is no standby instance holding a copy to promote after the writer dies
  - Reads continue uninterrupted from the reader endpoint because it is backed by the six-copy storage volume rather than by the failed writer instance
  - Aurora must launch/recover a new writer instance against the surviving shared storage before service
    resumes, so recovery is slower than promoting an existing replica — the cluster is unavailable for
    writes until then
  answer: 3
  explanation: |
    Data survives (6-copy storage is independent of compute), but with no replica to
    promote, Aurora must create/recover a new writer instance — slower than promoting
    an existing replica. So keep at least one replica for fast failover. Data isn't
    lost; there's no replica to serve reads.
  ref: 'concepts.md#aurora-architecture-shared-distributed-storage-and-the-log-is-the-database-model'
- id: aws-databases-rds-aurora-055
  difficulty: expert
  tags:
  - rds-proxy
  - iam
  - secrets
  - design
  question: |
    A security-conscious team wants Lambda to reach Aurora without embedding DB
    passwords and without connection exhaustion. Which design cleanly satisfies both?
  options:
  - Hard-code the database credentials in Lambda environment variables and open a direct connection on every single invocation
  - Store the password directly in the deployment package and maintain a client-side connection pool inside each Lambda container
  - Use RDS Proxy with IAM authentication and Secrets Manager integration, so Lambda gets short-lived
    IAM-based auth through a pooled proxy
  - Abandon Aurora and re-platform onto DynamoDB with IAM-signed requests so there are no database passwords to manage at all
  answer: 2
  explanation: |
    RDS Proxy integrates with Secrets Manager and IAM auth, letting Lambda authenticate
    via IAM (no embedded passwords) while the proxy pools connections. Hard-coding
    creds is insecure; per-Lambda client pools don't help ephemeral containers;
    switching to DynamoDB changes the data model.
  ref: 'concepts.md#rds-proxy-connection-pooling-and-failover-for-serverless-and-spiky-clients'
- id: aws-databases-rds-aurora-056
  difficulty: expert
  tags:
  - backups
  - cross-account
  - dr
  question: |
    A compliance requirement mandates that database backups survive even if the
    primary AWS account is compromised and its resources deleted. Which approach best
    satisfies this?
  options:
  - Rely on the standard automated backups within the same account, configured with the maximum 35-day retention window
  - Copy manual snapshots to a separate, hardened backup account (and/or another Region) so they are outside
    the blast radius of the primary account
  - Enable Multi-AZ so the synchronous standby in a second Availability Zone preserves a durable copy of the data
  - Increase point-in-time-recovery retention to the maximum 35 days so more transaction history is kept for restores
  answer: 1
  explanation: |
    Automated backups and PITR live in the same account and are deleted with the
    instance — inside the blast radius. Copying/sharing manual snapshots to a separate
    hardened account (and Region) isolates them from a compromised primary account.
    Multi-AZ is HA, not backup isolation.
  ref: 'concepts.md#backups-point-in-time-recovery-and-snapshots'
- id: aws-databases-rds-aurora-057
  difficulty: expert
  tags:
  - selection
  - tradeoff
  - scenario
  question: |
    A fintech ledger needs strict ACID multi-row transactions, near-zero RPO for AZ
    failure, sub-30s failover, low-lag read replicas, and possible future multi-Region
    DR with ≤1s RPO. Which single choice best covers ALL requirements?
  options:
  - DynamoDB with Global Tables, relying on its transactions API to cover the ledger's strict multi-row ACID guarantees
  - RDS for PostgreSQL Single-AZ with a cross-Region read replica standing in as the automatic AZ-failure failover target
  - Self-managed PostgreSQL on EC2 with hand-configured streaming replication and a custom failover script for AZ outages
  - Aurora (Multi-AZ replicas) now, extended to Aurora Global Database for multi-Region DR
  answer: 3
  explanation: |
    Aurora gives ACID relational transactions, quorum-based ~0 RPO for AZ failure,
    sub-30s failover via replicas, low-lag reads, and a clean path to Global Database
    for ≤1s multi-Region RPO. DynamoDB weakens relational/transaction semantics;
    Single-AZ RDS misses HA; self-managed adds heavy ops burden.
  ref: 'concepts.md#trade-offs-and-when-to-use-what-failure-modes-rpo-rto'
- id: aws-databases-rds-aurora-058
  difficulty: expert
  tags:
  - storage
  - write-amplification
  - aurora-vs-mysql
  question: |
    Traditional MySQL Multi-AZ replication can suffer heavy write amplification (redo
    log, binlog, double-write buffer, data pages, all shipped). How does Aurora's
    storage design specifically reduce this?
  options:
  - By sending only redo log records to storage nodes, which independently materialize pages and replicate
    — eliminating shipping of full pages, binlog, and double-write buffer over the write path
  - By disabling durability guarantees on commit and relying purely on an in-memory buffer that is flushed lazily to reduce write traffic
  - By writing everything to a single fast local NVMe disk on the writer and skipping any replication over the network entirely
  - By batching all writes into hourly full snapshots that are shipped to storage instead of streaming individual changes
  answer: 0
  explanation: |
    Aurora's log-is-the-database model ships only redo records; storage nodes build
    pages and handle replication, removing the classic multi-copy page/binlog/
    double-write shipping. Durability is preserved via the 6-copy quorum; it's not
    single-disk or snapshot-batched.
  ref: 'concepts.md#aurora-architecture-shared-distributed-storage-and-the-log-is-the-database-model'
- id: aws-databases-rds-aurora-059
  difficulty: expert
  tags:
  - global-database
  - restart
  - secondary
  question: |
    In an Aurora Global Database, the primary Region's writer undergoes a failover.
    What is a correct statement about the secondary Region's reader instances?
  options:
  - Secondary readers are completely unaffected by the primary-Region failover and keep serving fully current data without any interruption
  - Secondary readers automatically detect the outage and promote themselves to become the new global primary writer within seconds
  - Secondary reader instances can restart and the secondary cluster becomes briefly unavailable until
    they resync with the new primary writer
  - The secondary Region's replicated data is discarded and rebuilt from scratch by copying the full volume from the new primary
  answer: 2
  explanation: |
    When the primary writer restarts/fails over, secondary-Region readers can restart
    and the secondary cluster is briefly unavailable until they resync — a documented
    behavior to design around. Secondaries don't auto-promote to primary, nor is data
    discarded.
  ref: 'concepts.md#aurora-global-database-cross-region-replication-and-disaster-recovery'
- id: aws-databases-rds-aurora-060
  difficulty: expert
  tags:
  - cost
  - estimation
  - replicas
  question: |
    A team runs Aurora with 1 writer + 4 read replicas of the same instance class for
    read scaling, plus Aurora Global Database with a warm secondary Region (1 writer-
    sized reader). Roughly how does compute cost scale, and what is the cost lever if
    reads are bursty and mostly idle?
  options:
  - Cost is fixed at a flat cluster fee regardless of how many instances you run, so adding replicas is free and no cost lever exists
  - You pay for all 5 primary-Region instances plus the secondary instance continuously; if reads are
    bursty/idle, converting readers to Aurora Serverless v2 lets them scale down (even to 0) to cut cost
  - Read replicas are billed at no compute charge; only the primary writer instance accrues an hourly cost in the cluster
  - The warm secondary Region's reader incurs no charge at all until an actual cross-Region failover promotes it
  answer: 1
  explanation: |
    Each provisioned instance (writer + 4 replicas + secondary reader) bills
    continuously by instance-hour. For bursty/idle reads, Serverless v2 readers scale
    capacity down (even to zero with pause) to match demand. Replicas and secondary
    clusters are not free.
  ref: 'concepts.md#trade-offs-and-when-to-use-what-failure-modes-rpo-rto'
- id: aws-databases-rds-aurora-061
  difficulty: intermediate
  tags:
  - rds
  - storage
  - autoscaling
  question: |
    What is true about RDS storage auto-scaling?
  options:
  - It can automatically grow storage when nearing capacity, but never shrinks it automatically
  - It can automatically grow AND shrink the volume up and down based on how much free space the workload currently uses
  - It scales the instance's compute (vCPU and RAM) up as load rises, rather than expanding the underlying storage volume
  - It requires a brief downtime window for every single storage growth event while the larger volume is attached
  answer: 0
  explanation: |
    RDS storage auto-scaling grows the volume when free space runs low, up to a
    configured max — it does not shrink automatically (you'd rebuild to reduce). It
    scales storage, not compute, and growth is online.
  ref: 'concepts.md#rds-instance-classes-storage-and-vertical-scaling-limits'
- id: aws-databases-rds-aurora-062
  difficulty: intermediate
  tags:
  - aurora
  - vs-rds
  - replicas
  question: |
    Why is adding a read replica to Aurora typically faster and cheaper (in setup)
    than adding a read replica in standard RDS?
  options:
  - Aurora replicas still require copying the full dataset first, just onto faster provisioned-IOPS hardware that finishes the copy sooner
  - Aurora replicas do not store any data of their own and forward every read straight through to the writer instance
  - Aurora replicas attach to the existing shared cluster volume, so no data copy is needed; standard
    RDS builds a replica from a snapshot
  - RDS replicas are always provisioned cross-Region while Aurora's replicas are restricted to the local Region
  answer: 2
  explanation: |
    Aurora Replicas share the same distributed storage volume, so no dataset copy is
    required to spin one up. Standard RDS replicas are built from a snapshot and then
    catch up via async replication — slower and more I/O.
  ref: 'concepts.md#aurora-architecture-shared-distributed-storage-and-the-log-is-the-database-model'
- id: aws-databases-rds-aurora-063
  difficulty: advanced
  tags:
  - design
  - caching
  - read-scaling
  question: |
    A read-heavy product-catalog service on Aurora has already added the maximum
    useful read replicas but still sees high read latency and replica CPU saturation
    on repeated identical queries. What is the next most effective lever?
  options:
  - Enable Multi-AZ cluster mode so the readable standbys absorb the repeated identical queries and relieve the saturated replicas
  - Convert the cluster to Aurora Serverless v2 with scale-to-zero so idle capacity is reclaimed between the repeated read bursts
  - Increase the automated backup retention window so more cached history is available to satisfy the repeated reads
  - Add an ElastiCache (Redis/Memcached) cache layer to serve hot repeated reads and offload the database
  answer: 3
  explanation: |
    When repeated identical reads saturate replicas, a cache (ElastiCache) absorbs hot
    reads at sub-ms latency and offloads the DB — the classic next step after replicas.
    Multi-AZ is HA, scale-to-zero hurts always-on latency, and backups are irrelevant.
  ref: 'concepts.md#rds-instance-classes-storage-and-vertical-scaling-limits'
- id: aws-databases-rds-aurora-064
  difficulty: advanced
  tags:
  - option-groups
  - features
  question: |
    A team needs Oracle Transparent Data Encryption (TDE) on RDS for Oracle. Which
    RDS construct enables this engine add-on feature?
  options:
  - A parameter group
  - An option group
  - A security group
  - A subnet group
  answer: 1
  explanation: |
    Engine add-on features like Oracle TDE, SQL Server Audit, and MySQL MEMCACHED are
    enabled via option groups. Parameter groups tune engine settings; security groups
    and subnet groups are networking constructs.
  ref: 'concepts.md#parameter-groups-option-groups-and-engine-configuration'
- id: aws-databases-rds-aurora-065
  difficulty: intermediate
  tags:
  - global-database
  - limits
  question: |
    How many secondary (read-only) Regions can an Aurora Global Database have on
    current engine versions?
  options:
  - Up to 5 (documented up to 10 on current versions)
  - Exactly 1 secondary Region, because a global database is strictly a single primary paired with one read-only replica Region
  - Exactly 15 secondary Regions, mirroring the maximum number of Aurora Replicas allowed within a single cluster
  - Unlimited secondary Regions, since storage-layer replication fans out to as many Regions as you choose to attach
  answer: 0
  explanation: |
    Aurora Global Database supports multiple read-only secondary Regions — historically
    up to 5, and current docs cite up to 10 secondaries. It is not unlimited, and 15 is
    the per-cluster replica count, not Regions.
  ref: 'concepts.md#aurora-global-database-cross-region-replication-and-disaster-recovery'
- id: aws-databases-rds-aurora-066
  difficulty: expert
  tags:
  - design
  - cell-based
  - blast-radius
  question: |
    A large multi-tenant platform wants to limit the blast radius of a database failure
    so one bad tenant or a single cluster failure cannot take down all customers. Which
    approach aligns with modern cell-based architecture on RDS/Aurora?
  options:
  - One giant shared Aurora cluster holding every tenant, sized for aggregate peak, since one big cluster is simplest to operate
  - A single shared DynamoDB table for all tenants to sidestep relational limits, relying on partition keys to keep tenants isolated
  - Multi-AZ instance mode on one shared cluster, whose standby in a second AZ fully isolates each tenant from the others
  - Partition tenants across multiple independent Aurora clusters (cells), so a failure or hot tenant
    is contained to one cell, trading some operational complexity for blast-radius reduction
  answer: 3
  explanation: |
    Cell-based design shards tenants across many independent clusters so a failure is
    contained to one cell — reducing blast radius at the cost of more clusters to
    operate. A single shared cluster couples all tenants; Multi-AZ is HA within one
    cluster, not isolation between tenants.
  ref: 'concepts.md#trade-offs-and-when-to-use-what-failure-modes-rpo-rto'
- id: aws-databases-rds-aurora-067
  difficulty: advanced
  tags:
  - self-managed
  - ec2
  - tradeoff
  question: |
    When is running PostgreSQL yourself on EC2 the justified choice over RDS/Aurora,
    and what do you explicitly take on?
  options:
  - Whenever you simply want to lower the bill, because a self-managed EC2 database is always cheaper than the equivalent RDS instance
  - When you need automatic Multi-AZ failover fully managed for you without writing any of your own failover tooling
  - When you need superuser/OS-level control, an unsupported extension/version, or a filesystem/agent
    RDS forbids — accepting ownership of patching, HA, and backups
  - When you want AWS to handle provisioning, patching, backups, and monitoring for you with the least operational effort
  answer: 2
  explanation: |
    Self-managing on EC2 is justified only when you need control RDS can't give
    (superuser, exotic extension/version, OS agent) — and you then own patching, HA,
    backups, and monitoring. If you want managed failover and less effort, use RDS/
    Aurora. Cost alone rarely justifies it.
  ref: 'concepts.md#managed-relational-databases-and-the-rds-value-proposition'
- id: aws-databases-rds-aurora-068
  difficulty: expert
  tags:
  - serverless
  - min-acu
  - warming
  question: |
    For an Aurora Serverless v2 cluster that must respond to a sudden traffic spike
    without a cold-start stall but should still save cost when quiet, what is a
    pragmatic configuration trade-off?
  options:
  - Set the minimum to 0 ACU (scale-to-zero) to save the most money, accepting the resume delay as negligible for spiky traffic
  - Set a small non-zero min ACU (keeping the cluster warm) with a high max ACU, trading a modest always-on
    baseline cost for no resume latency and fast burst headroom
  - Set min ACU equal to max ACU to pin capacity, disabling autoscaling so the cluster never has to react to a spike
  - Use Aurora Serverless v1 instead, since its doubling-based scaling model warms up faster than v2 during a sudden spike
  answer: 1
  explanation: |
    A small non-zero minimum keeps the cluster warm (no resume latency) while a high
    maximum gives burst headroom — you pay a modest baseline. Scale-to-zero reintroduces
    cold-start latency; min=max defeats elasticity; v1 scales worse than v2.
  ref: 'concepts.md#aurora-serverless-v2-on-demand-acu-autoscaling'
- id: aws-databases-rds-aurora-069
  difficulty: intermediate
  tags:
  - failover
  - rto
  - comparison
  question: |
    Rank typical failover RTO from fastest to slowest: (A) Aurora replica promotion,
    (B) RDS Multi-AZ instance failover, (C) restore from a snapshot after a Single-AZ
    failure.
  options:
  - C < A < B
  - B < A < C
  - A < C < B
  - A < B < C
  answer: 3
  explanation: |
    Aurora replica promotion (<~30 s) is fastest, RDS Multi-AZ instance failover is
    next (60–120 s), and restoring from a snapshot after a Single-AZ failure is slowest
    (minutes to hours, plus data loss back to the backup).
  ref: 'concepts.md#trade-offs-and-when-to-use-what-failure-modes-rpo-rto'
- id: aws-databases-rds-aurora-070
  difficulty: advanced
  tags:
  - connections
  - limits
  - first-bottleneck
  question: |
    A serverless-first design fronts Aurora directly with thousands of concurrent
    Lambda invocations and modest per-query work. Which limit will this design most
    likely hit FIRST?
  options:
  - The database max_connections limit (connection exhaustion), before CPU or storage
  - The 128 TiB Aurora cluster-volume storage cap, filled by all the concurrent Lambda invocations writing data
  - The 15-replica-per-cluster limit, exhausted as each Lambda invocation attaches to its own reader instance
  - The 256-ACU Serverless v2 compute ceiling, reached as thousands of Lambdas drive the autoscaler to its maximum
  answer: 0
  explanation: |
    Thousands of Lambdas each opening a connection exhausts max_connections long before
    storage, replica count, or ACU ceilings matter — the classic serverless+RDS
    failure. The fix is RDS Proxy. Storage/replica/ACU limits are not the first
    bottleneck here.
  ref: 'concepts.md#rds-proxy-connection-pooling-and-failover-for-serverless-and-spiky-clients'
- id: aws-databases-rds-aurora-071
  difficulty: beginner
  tags:
  - aurora
  - reader-endpoint
  question: |
    What does the Aurora reader endpoint do?
  options:
  - Points only to the current writer instance and forwards every connection, read or write, to the primary
  - Provides cross-Region replication by streaming changes to reader instances in other AWS Regions
  - Load-balances read-only connections across the available Aurora Replicas
  - Stores the cluster's automated backups and snapshots for point-in-time recovery
  answer: 2
  explanation: |
    The reader endpoint distributes read-only connections across Aurora Replicas for
    read scaling. The writer/cluster endpoint targets the primary; it is not for
    cross-Region replication or backups.
  ref: 'concepts.md#aurora-endpoints-replicas-and-read-scaling'
- id: aws-databases-rds-aurora-072
  difficulty: expert
  tags:
  - design
  - tradeoff
  - dynamodb-vs-aurora
  question: |
    A team defaults to DynamoDB "because it scales" for an internal admin tool with
    rich, evolving, ad-hoc reporting queries, low traffic, and a small team. What is
    the strongest architectural critique?
  options:
  - DynamoDB is technically incapable of storing this admin tool's data at all, so it must be rejected on storage grounds alone
  - For low-traffic, query-flexible, evolving access patterns, a relational store (RDS/Aurora) is a better
    fit; DynamoDB forces you to model around known access patterns and makes ad-hoc/reporting queries
    awkward and costly — scaling isn't the constraint here
  - DynamoDB is always strictly more expensive than an equivalent Aurora cluster, so cost alone rules it out for this tool
  - DynamoDB is unsuitable for internal tools by design and is only ever intended for high-traffic customer-facing services
  answer: 1
  explanation: |
    DynamoDB's strength (horizontal scale) is irrelevant at low traffic, and its
    requirement to model around known access patterns fights ad-hoc/evolving reporting.
    Relational RDS/Aurora fits flexible queries better here. It's about access-pattern
    fit, not raw capability or a blanket cost claim.
  ref: 'concepts.md#choosing-the-engine-and-data-store-rds-vs-aurora-vs-dynamodb-vs-self-managed'
- id: aws-databases-rds-aurora-073
  difficulty: advanced
  tags:
  - multi-az
  - latency
  - tradeoff
  question: |
    Enabling RDS Multi-AZ (instance) adds a measurable amount of write latency compared
    to Single-AZ. Why, and is it usually worth it?
  options:
  - Synchronous cross-AZ replication adds ~1–2 ms per commit; for production systems the near-zero RPO
    and automatic failover are almost always worth that small cost
  - It adds latency because RDS compresses every write with zlib before shipping it to the standby, and that
    per-commit CPU overhead makes Multi-AZ rarely worth enabling
  - It adds latency because read queries are silently rerouted to the standby node, stealing write throughput,
    so most teams leave Multi-AZ disabled in production
  - It adds no measurable latency and has no downside whatsoever, so Multi-AZ should simply be left on for
    every instance including dev/test
  answer: 0
  explanation: |
    Committing to a standby in another AZ synchronously adds a small cross-AZ round
    trip (~1–2 ms). For production, the near-zero RPO and automatic failover justify it.
    The standby serves no reads, and there is a real (if small) latency cost.
  ref: 'concepts.md#multi-az-deployments-synchronous-standby-for-high-availability'
- id: aws-databases-rds-aurora-074
  difficulty: intermediate
  tags:
  - aurora
  - replica-lag
  - numbers
  question: |
    Roughly what replication lag do Aurora Replicas typically exhibit, and why is it so
    low compared to engine-level async replication?
  options:
  - Several seconds, because each replica replays the full binlog transaction-by-transaction before the rows
    become visible to reads
  - Exactly zero at all times, because Aurora replicates to its replicas synchronously and blocks each commit
    until every replica acknowledges
  - Typically ~10–20 ms, because replicas read from the shared storage volume rather than replaying a
    logical/physical replication stream
  - Several minutes, matching the lag of engine-level cross-Region replicas that ship changes over the
    wide-area network to another Region
  answer: 2
  explanation: |
    Aurora Replicas read the same shared storage as the writer, so lag is typically in
    the low tens of milliseconds — far lower than engine-level async replication. It's
    not zero (not synchronous) and not seconds/minutes.
  ref: 'concepts.md#aurora-endpoints-replicas-and-read-scaling'
- id: aws-databases-rds-aurora-075
  difficulty: expert
  tags:
  - dr
  - strategy
  - rto-rpo
  - cost
  question: |
    A business wants the cheapest multi-Region DR for an Aurora workload where an RTO
    of a few hours and RPO of tens of minutes are acceptable. Which strategy fits the
    requirement WITHOUT over-engineering?
  options:
  - Aurora Global Database with a warm secondary (lowest RTO/RPO but highest cost)
  - Active-active multi-master Aurora accepting independent writes in both Regions, which is the cheapest
    option because it avoids ever provisioning a dedicated standby cluster
  - Synchronous cross-Region replication that blocks each commit until the far Region persists it, delivering
    zero RPO at the lowest possible cost for this relaxed requirement
  - Periodic cross-Region snapshot copies (or backup/restore), giving hours-scale RTO and RPO bounded
    by copy frequency — cheapest for relaxed objectives
  answer: 3
  explanation: |
    When RTO (hours) and RPO (tens of minutes) are relaxed, cross-Region snapshot copy /
    backup-and-restore is the cheapest fit — you pay only for stored snapshots, not a
    running secondary. Global Database is warranted only for tight RTO/RPO;
    active-active/synchronous cross-Region are costly overkill and infeasible here.
  ref: 'concepts.md#trade-offs-and-when-to-use-what-failure-modes-rpo-rto'
- id: aws-databases-rds-aurora-076
  difficulty: advanced
  tags:
  - aurora
  - serverless
  - mixed-cluster
  question: |
    Can an Aurora cluster mix a provisioned writer with Aurora Serverless v2 reader
    instances, and why might you want to?
  options:
  - No, every instance in a cluster must share one capacity type, so a cluster is either entirely provisioned
    or entirely Serverless v2 and mixing the two is rejected at creation
  - Yes — you can run a provisioned writer for steady write load while serverless v2 readers scale independently
    to absorb bursty read traffic cost-effectively
  - Yes, but only if the writer is itself Serverless v2, because a provisioned writer cannot coexist in a
    cluster that contains any serverless instance
  - No, Aurora Serverless v2 instances can only ever be promoted to writers and are technically incapable of
    serving in the reader role at all
  answer: 1
  explanation: |
    Aurora supports mixed clusters: a provisioned writer plus Serverless v2 readers
    that scale independently for spiky reads, optimizing cost. Serverless v2 can be a
    reader (or writer); mixing is explicitly supported.
  ref: 'concepts.md#aurora-serverless-v2-on-demand-acu-autoscaling'
