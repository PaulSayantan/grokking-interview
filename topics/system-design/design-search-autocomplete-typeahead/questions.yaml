topic: "Design Search, Autocomplete and Typeahead Systems"
domain: system-design
topic_slug: design-search-autocomplete-typeahead
version: 1
questions:
  - id: design-search-autocomplete-typeahead-001
    difficulty: beginner
    tags: [fundamentals, framing]
    question: |
      What is the defining characteristic of an autocomplete/typeahead system
      compared to a full-text search system?
    options:
      - "It returns top-k completions for a partial prefix, on every keystroke, under a very tight latency budget"
      - "It returns fully ranked documents from a large corpus only after a complete query is submitted"
      - "It guarantees strongly consistent, linearizable results across every replica before answering"
      - "It requires a relational database with ACID transactions to serialize each individual lookup"
    answer: 0
    explanation: |
      Typeahead fires per keystroke on a prefix and must return top-k completions
      within tens of milliseconds. Full-text search returns ranked documents for a
      complete query. Search systems are overwhelmingly eventually consistent (AP),
      not strongly consistent, and are not built on ACID RDBMS transactions.
    ref: "concepts.md#problem-framing-and-requirements"
  - id: design-search-autocomplete-typeahead-002
    difficulty: beginner
    tags: [inverted-index, basics]
    question: |
      What does an inverted index map?
    options:
      - "Document IDs to the complete stored text of each document in the corpus"
      - "Terms to the list of documents (postings) that contain them"
      - "User IDs to the chronological history of queries each account has issued"
      - "Prefix strings to their child character nodes in a traversable tree"
    answer: 1
    explanation: |
      An inverted index maps each term to a postings list of documents containing
      it, enabling fast lookup and intersection without scanning every document. A
      map from doc ID to text is a forward index; prefix-to-children is a trie.
    ref: "concepts.md#inverted-index-fundamentals"
  - id: design-search-autocomplete-typeahead-003
    difficulty: beginner
    tags: [trie, data-structures]
    question: |
      Why is a trie (prefix tree) a natural fit for autocomplete?
    options:
      - "It stores whole documents pre-sorted by descending relevance score for instant ranking"
      - "It guarantees constant O(1) memory usage regardless of how large the dataset grows"
      - "Walking the prefix path lands you at the subtree of all strings sharing that prefix"
      - "It automatically corrects the user's spelling mistakes before matching completions"
    answer: 2
    explanation: |
      A trie shares common prefixes along paths, so following the typed prefix
      reaches the node whose subtree contains exactly the strings with that prefix.
      It does not sort by relevance by itself, is memory-hungry not O(1), and does
      not correct spelling on its own.
    ref: "concepts.md#autocomplete-with-tries-and-prefix-structures"
  - id: design-search-autocomplete-typeahead-004
    difficulty: beginner
    tags: [caching, client]
    question: |
      What is the purpose of "debouncing" typeahead requests on the client?
    options:
      - "To encrypt each individual keystroke with TLS before it is sent to the server"
      - "To guarantee that returned suggestions are always fresh to the millisecond on every key"
      - "To sort the returned suggestions into strict alphabetical order on the client device"
      - "To wait for a short typing pause before firing a request, reducing request volume"
    answer: 3
    explanation: |
      Debouncing waits ~50-150 ms of inactivity before sending, so a fast typist
      generates far fewer requests and avoids racing responses. It is a request-volume
      and UX optimization, not encryption, freshness, or sorting.
    ref: "concepts.md#typeahead-serving-at-scale-caching-and-sharding"
  - id: design-search-autocomplete-typeahead-005
    difficulty: beginner
    tags: [ranking, bm25]
    question: |
      BM25 is primarily used for what?
    options:
      - "Scoring the textual relevance of a document to a query"
      - "Compressing postings lists on disk with delta and bit-packing schemes"
      - "Distributing (sharding) an index evenly across a cluster of serving nodes"
      - "Detecting near-duplicate documents so redundant copies are collapsed"
    answer: 0
    explanation: |
      BM25 is a lexical relevance-scoring function (the Lucene default) combining
      term frequency (saturating), inverse document frequency, and length
      normalization. It is not a compression, sharding, or dedup mechanism.
    ref: "concepts.md#ranking-and-relevance"
  - id: design-search-autocomplete-typeahead-006
    difficulty: beginner
    tags: [spell-correction, edit-distance]
    question: |
      Spell correction typically finds candidate words by measuring what between
      the typed word and dictionary words?
    options:
      - "Cosine similarity between the words' dense semantic embedding vectors only"
      - "Edit (Levenshtein) distance"
      - "The TCP round-trip time between the client and the nearest search node"
      - "The number of index shards each candidate dictionary word is replicated across"
    answer: 1
    explanation: |
      Classic spell correction retrieves dictionary terms within a small edit
      (Levenshtein) distance of the typed term. Embedding similarity is a semantic
      technique; RTT and shard counts are unrelated to correction.
    ref: "concepts.md#spell-correction-and-fuzzy-matching"
  - id: design-search-autocomplete-typeahead-007
    difficulty: beginner
    tags: [consistency, cap]
    question: |
      For a typical search/autocomplete system, which consistency posture is
      normally chosen?
    options:
      - "Strong consistency (CP): block or error rather than serve stale results"
      - "No consistency model applies to search since it never mutates any stored state"
      - "Eventual consistency (AP): serve fast, available, possibly slightly stale results"
      - "Serializable transactions spanning every shard on each individual query request"
    answer: 2
    explanation: |
      Search is almost always AP: a fast, available, slightly stale answer beats a
      slow or unavailable perfectly-fresh one. Strong consistency and cross-shard
      serializable transactions are the wrong trade-off for read-heavy search.
    ref: "concepts.md#problem-framing-and-requirements"
  - id: design-search-autocomplete-typeahead-008
    difficulty: beginner
    tags: [vector-search, embeddings]
    question: |
      In semantic/vector search, what is an embedding?
    options:
      - "A losslessly compressed copy of the original document's raw text bytes"
      - "The postings list enumerating every document that contains a given term"
      - "A shard identifier used to route each incoming query to the right node"
      - "A dense numeric vector representing the meaning of an item, so similar items are near each other"
    answer: 3
    explanation: |
      An embedding is a dense vector capturing semantic meaning; nearby vectors
      mean semantically similar items, enabling nearest-neighbor retrieval. It is
      not compressed text, a postings list, or a shard id.
    ref: "concepts.md#vector-and-semantic-search-as-a-modern-alternative"
  - id: design-search-autocomplete-typeahead-009
    difficulty: beginner
    tags: [elasticsearch, basics]
    question: |
      In Elasticsearch/OpenSearch, what is a shard?
    options:
      - "An independent Lucene index that holds a subset of an index's data"
      - "A cached copy of a recently returned query result kept in the coordinator's heap"
      - "A per-user session token that authenticates and authorizes each search request"
      - "A background thread that periodically merges small on-disk segments together"
    answer: 0
    explanation: |
      A shard is an independent Lucene index holding part of the data; an index is
      split into shards (with replicas) for scale and HA. It is not a query cache,
      session token, or merge thread.
    ref: "concepts.md#elasticsearch-and-opensearch-in-practice"
  - id: design-search-autocomplete-typeahead-010
    difficulty: beginner
    tags: [top-k, weighting]
    question: |
      In autocomplete, what does "top-k" refer to?
    options:
      - "The k oldest queries ever recorded in the system's historical log"
      - "The k highest-weighted completions for a given prefix"
      - "The k shards across which a given prefix's data is distributed"
      - "The k characters the user has typed into the search box so far"
    answer: 1
    explanation: |
      Top-k means the k highest-weighted (e.g. most popular) completions for the
      typed prefix. It is not about age of queries, shard count, or characters typed.
    ref: "concepts.md#top-k-selection-and-weighting"
  - id: design-search-autocomplete-typeahead-011
    difficulty: beginner
    tags: [pipeline, freshness]
    question: |
      Why do search systems separate the indexing (write) path from the serving
      (read) path?
    options:
      - "Because the SQL standard mandates isolating write statements from read statements"
      - "To guarantee strong, synchronous consistency between the two paths on every request"
      - "Because the two have opposite optimization goals: write builds the index, read serves it fast"
      - "Because reads and writes are physically unable to run on the same server hardware"
    answer: 2
    explanation: |
      Ingestion optimizes for throughput and correctness of building the index;
      serving optimizes for low-latency reads. Separating them lets each be tuned
      independently. It is not an SQL requirement, does not give strong consistency,
      and is not a hardware limitation.
    ref: "concepts.md#indexing-pipeline-and-near-real-time-updates"
  - id: design-search-autocomplete-typeahead-012
    difficulty: beginner
    tags: [inverted-index, analyzer]
    question: |
      Why must the same analyzer (tokenizer, lowercasing, stemming) be applied at
      both index time and query time?
    options:
      - "To save disk space by storing each analyzed token only a single time"
      - "To guarantee that query results are strongly and linearizably consistent"
      - "Because Lucene refuses to start up unless both analyzers are byte-identical"
      - "So that query terms are transformed identically to indexed terms and can match"
    answer: 3
    explanation: |
      If the query is analyzed differently from the documents, the transformed
      query terms won't match the indexed terms and results silently disappear.
      It is not about disk, consistency, or a startup requirement.
    ref: "concepts.md#inverted-index-fundamentals"
  - id: design-search-autocomplete-typeahead-013
    difficulty: beginner
    tags: [degradation, availability]
    question: |
      For autocomplete, what is an acceptable degraded state under heavy overload?
    options:
      - "Returning no suggestions or global (non-personalized) suggestions so the user can still type and submit"
      - "Returning an HTTP 500 error to every user"
      - "Blocking the request until full personalization completes"
      - "Shutting down the search box entirely"
    answer: 0
    explanation: |
      No suggestions (or global cached ones) is acceptable — the user can still type
      and press enter. Erroring, blocking, or disabling the box are worse than a
      graceful reduction in suggestion quality.
    ref: "concepts.md#failure-modes-and-graceful-degradation"
  - id: design-search-autocomplete-typeahead-014
    difficulty: intermediate
    tags: [top-k, precompute, trade-offs]
    question: |
      Storing the precomputed top-k completions at every trie node makes queries
      O(prefix length). What is the PRIMARY cost of this optimization?
    options:
      - "Queries become markedly slower than an on-the-fly depth-first traversal of the subtree"
      - "Increased memory and expensive updates, since a frequency change can require updating top-k lists up the prefix path"
      - "It caps each trie node at 26 children, so it cannot index digits or Unicode symbols"
      - "It prevents any downstream caching of the completion results at the edge or in Redis"
    answer: 1
    explanation: |
      Caching top-k at each node inflates memory and makes writes costly: one
      frequency change can propagate top-k updates along the whole prefix path. It
      speeds reads (not slows them), does not constrain children count, and does not
      block caching.
    ref: "concepts.md#top-k-selection-and-weighting"
  - id: design-search-autocomplete-typeahead-015
    difficulty: intermediate
    tags: [sharding, hot-shard, trade-offs]
    question: |
      You shard the typeahead trie by first letter (a-f → shard 1, etc.). What is
      the main risk, and the standard fix?
    options:
      - "Risk: load is already perfectly even across all shards; fix: nothing needs to change"
      - "Risk: queries silently become strongly consistent; fix: disable replication on every shard"
      - "Risk: hot shards because letters like 's', 'a', 't' are far more common; fix: hash a longer prefix, split hot ranges, replicate hot shards"
      - "Risk: the trie can no longer store completion weights; fix: switch the whole index to a hash map"
    answer: 2
    explanation: |
      Letter frequency is highly skewed, so first-letter sharding creates hot shards.
      The fix is finer/hashed prefix sharding plus splitting and replicating hot
      ranges. It does not even out load by itself, has nothing to do with consistency,
      and does not affect storing weights.
    ref: "concepts.md#typeahead-serving-at-scale-caching-and-sharding"
  - id: design-search-autocomplete-typeahead-016
    difficulty: intermediate
    tags: [estimation, qps]
    question: |
      A search box gets 5B searches/day. If we serve autocomplete on ~4 keystrokes
      per search, roughly what is the average autocomplete QPS?
    options:
      - "~2,300 QPS"
      - "~23,000 QPS"
      - "~23,000,000 QPS"
      - "~230,000 QPS"
    answer: 3
    explanation: |
      5B × 4 = 20B requests/day; 20B / 86,400 s ≈ 231K QPS average. Peaks are
      roughly 2x that. The other magnitudes are off by 10x-1000x.
    ref: "concepts.md#back-of-envelope-capacity-estimation"
  - id: design-search-autocomplete-typeahead-017
    difficulty: intermediate
    tags: [ranking, bm25, tf-idf]
    question: |
      What does BM25 add over classic TF-IDF?
    options:
      - "Term-frequency saturation (k1) and document-length normalization (b)"
      - "It removes the inverse-document-frequency component from the scoring formula entirely"
      - "It replaces numeric relevance scoring with a simple alphabetical ordering of matches"
      - "It requires no per-term corpus statistics to be collected or maintained at all"
    answer: 0
    explanation: |
      BM25 adds saturating term frequency (via k1, so repeats add diminishing value)
      and length normalization (via b). It keeps IDF, still ranks by relevance not
      alphabetically, and still uses term statistics.
    ref: "concepts.md#ranking-and-relevance"
  - id: design-search-autocomplete-typeahead-018
    difficulty: intermediate
    tags: [caching, zipf, hit-ratio]
    question: |
      Why is a prefix→top-k cache in Redis so effective for typeahead, often
      reaching 90-99% hit ratios?
    options:
      - "Because every possible prefix is equally likely, so literally any caching scheme works well"
      - "Because prefix popularity is Zipfian: a tiny set of popular prefixes covers most traffic"
      - "Because Redis persists all cached entries to disk, giving durability that boosts hit ratios"
      - "Because enabling per-user personalization sharply increases how often cache entries are reused"
    answer: 1
    explanation: |
      Prefix traffic follows a power law — short/common prefixes dominate — so a
      small cache captures most requests. Prefixes are not uniformly likely, Redis
      being in-memory is not the reason, and personalization actually reduces reuse.
    ref: "concepts.md#typeahead-serving-at-scale-caching-and-sharding"
  - id: design-search-autocomplete-typeahead-019
    difficulty: intermediate
    tags: [pipeline, cdc, trade-offs]
    question: |
      Instead of dual-writing to your database and search index, you stream the
      DB's change log (binlog/WAL) via Debezium into Kafka, then index from there.
      What is the main benefit?
    options:
      - "It makes every write land in both the database and the search index inside one synchronous two-phase commit, keeping them strongly consistent"
      - "It lets the application query Kafka topics directly for full-text results, so a separate search index no longer needs to be built or maintained"
      - "It avoids DB/index divergence on partial failures and gives durability, replay, and decoupling; the index becomes an eventually-consistent materialized view"
      - "It collapses the database, message broker, and index into a single co-located service, cutting the deployment down to one moving part to operate"
    answer: 2
    explanation: |
      CDC decouples the two systems: the index becomes a replayable, durable,
      eventually-consistent materialized view of the source of truth, avoiding the
      drift a dual-write suffers on crashes. It is not synchronous/strong, does not
      remove the index, and adds (not removes) moving parts.
    ref: "concepts.md#indexing-pipeline-and-near-real-time-updates"
  - id: design-search-autocomplete-typeahead-020
    difficulty: intermediate
    tags: [nrt, elasticsearch, refresh]
    question: |
      In Elasticsearch, newly indexed documents become searchable after a "refresh"
      (default ~1 s). What is the trade-off of shortening the refresh interval?
    options:
      - "Query latency rises and heap usage falls, because shorter refreshes flush the filesystem cache and force reads from disk on every request"
      - "It changes nothing about segment count or indexing throughput, since refresh only controls how often replicas sync from the primary shard"
      - "It upgrades the index to strong consistency, so a document is guaranteed searchable on every replica the instant the indexing call returns"
      - "Fresher results but more tiny segments and higher merge pressure, reducing indexing throughput"
    answer: 3
    explanation: |
      A shorter refresh creates more small in-memory segments more often, increasing
      merge overhead and cutting indexing throughput, in exchange for fresher
      visibility. It does not slow queries or give strong consistency, and it does
      affect segments/throughput.
    ref: "concepts.md#indexing-pipeline-and-near-real-time-updates"
  - id: design-search-autocomplete-typeahead-021
    difficulty: intermediate
    tags: [spell-correction, symspell, trade-offs]
    question: |
      SymSpell is popular for high-throughput spell correction. What is its core
      trade-off versus a BK-tree?
    options:
      - "Much faster lookups at the cost of large precomputed storage (deletes of dictionary terms)"
      - "A far smaller memory footprint than a BK-tree, paid for with much slower per-lookup traversal of the deletion dictionary"
      - "It handles only exact-match lookups and cannot recover from typos at all, so a separate corrector is still required for misspellings"
      - "It depends on a GPU to compute edit distances in parallel, making it unusable on CPU-only serving hosts"
    answer: 0
    explanation: |
      SymSpell precomputes deletions of dictionary terms into a hash map, giving
      order-of-magnitude faster lookups but consuming much more memory than a
      BK-tree. It does handle typos, needs no GPU, and is not slower.
    ref: "concepts.md#spell-correction-and-fuzzy-matching"
  - id: design-search-autocomplete-typeahead-022
    difficulty: intermediate
    tags: [vector-search, ann, hnsw]
    question: |
      Why do vector search systems use Approximate Nearest Neighbor (ANN) like HNSW
      instead of exact nearest neighbor?
    options:
      - "Exact nearest neighbor returns lower recall than ANN because it scans vectors in an arbitrary order and stops early"
      - "Exact NN over billions of vectors is too slow; ANN trades a few points of recall for orders-of-magnitude speedup"
      - "ANN such as HNSW guarantees perfect 100% recall at no latency cost, making exact search strictly redundant"
      - "HNSW consumes essentially no memory because it stores only pointers, not the underlying vectors themselves"
    answer: 1
    explanation: |
      Exact search over huge vector sets is prohibitively slow; ANN accepts a small
      recall loss for massive speedup. Exact NN has perfect (not worse) recall, ANN
      is not free of recall loss, and HNSW is notably memory-heavy.
    ref: "concepts.md#vector-and-semantic-search-as-a-modern-alternative"
  - id: design-search-autocomplete-typeahead-023
    difficulty: intermediate
    tags: [hybrid-search, bm25, vector]
    question: |
      Why is hybrid search (BM25 + vector, fused with RRF) considered a 2024-2025
      best practice over either alone?
    options:
      - "Because dense vectors dominate lexical matching on every query type, so BM25 contributes no measurable relevance once vectors are present"
      - "Because storing one fused index instead of two separate ones cuts total on-disk footprint by roughly half"
      - "Because BM25 catches exact/rare tokens and IDs while vectors catch meaning/synonyms; each covers the other's blind spots"
      - "Because fusing the two scores yields a single canonical ordering, eliminating any need for a downstream ranking stage"
    answer: 2
    explanation: |
      Lexical BM25 nails exact matches, IDs, and rare tokens; dense vectors capture
      synonyms and intent. Fusing them (e.g. RRF) covers each method's weaknesses.
      Vectors are not universally better, hybrid does not shrink storage, and ranking
      is still needed.
    ref: "concepts.md#vector-and-semantic-search-as-a-modern-alternative"
  - id: design-search-autocomplete-typeahead-024
    difficulty: intermediate
    tags: [elasticsearch, deep-pagination]
    question: |
      In Elasticsearch, why is deep pagination with large `from` + `size`
      expensive, and what is the recommended alternative?
    options:
      - "It is effectively free because Elasticsearch seeks directly to the requested offset on each shard, so no alternative is needed"
      - "It gradually corrupts segment checksums on deep offsets; run a periodic force-merge to repair the index instead"
      - "It skips the shard request cache and hits disk directly; simply provisioning a larger node-level cache resolves it"
      - "Every shard must return from+size docs to the coordinator; use search_after instead"
    answer: 3
    explanation: |
      In scatter-gather, each shard must produce from+size results so the coordinator
      can merge them, so deep offsets are costly; `search_after` (a cursor) avoids
      this. It is not cheap, does not corrupt the index, and the issue is not cache.
    ref: "concepts.md#elasticsearch-and-opensearch-in-practice"
  - id: design-search-autocomplete-typeahead-025
    difficulty: intermediate
    tags: [weighting, time-decay]
    question: |
      To make autocomplete surface trending queries (e.g. "oscars 2026") that spike
      then fade, which weighting is most appropriate?
    options:
      - "Time-decayed popularity (recent events weighted higher, older exponentially discounted)"
      - "All-time cumulative query counts summed since launch, so a term that was hugely popular years ago always outranks today's spikes"
      - "Strict alphabetical ordering of completions, ignoring how often each query has been issued recently"
      - "Random weighting reshuffled per request to guarantee diverse suggestions regardless of what is actually trending"
    answer: 0
    explanation: |
      Time-decay weighting lets fresh signal dominate and old signal fade, capturing
      trends without a hard cutoff. All-time counts are too stable to reflect spikes;
      alphabetical/random ordering ignore popularity entirely.
    ref: "concepts.md#top-k-selection-and-weighting"
  - id: design-search-autocomplete-typeahead-026
    difficulty: intermediate
    tags: [ranking, funnel, ltr]
    question: |
      In a multi-stage retrieval-and-ranking funnel, where is an expensive
      learning-to-rank (L2) model typically applied?
    options:
      - "On the entire corpus up front, scoring every document with the L2 model before any retrieval narrows the set"
      - "Only on the small set of top candidates after cheap retrieval and first-pass ranking"
      - "As a full replacement for retrieval, so the L2 model both selects and orders results in a single pass"
      - "On the raw postings lists at index build time, precomputing an L2 score for every term-document pair on disk"
    answer: 1
    explanation: |
      Expensive L2 re-ranking runs only on the top candidates surviving cheap
      retrieval and L1 ranking, because per-document cost is high. It cannot score
      the whole corpus, does not replace retrieval, and is a query-time not
      index-time step.
    ref: "concepts.md#ranking-and-relevance"
  - id: design-search-autocomplete-typeahead-027
    difficulty: intermediate
    tags: [infix, edge-ngram, trade-offs]
    question: |
      A plain trie only matches left-anchored prefixes. To also match "york" inside
      "new york" (search-as-you-type), what technique is used and what is the cost?
    options:
      - "Nothing extra is needed, because a standard trie already reaches interior words by scanning every node in its subtree"
      - "Switching the whole path to BM25 scoring, which matches substrings anywhere and removes the need for a trie"
      - "Edge n-grams or indexing every suffix, which multiplies index size"
      - "Adding more read replicas of the trie, which lets a lookup match words in the middle of a phrase"
    answer: 2
    explanation: |
      Infix matching requires edge n-grams or suffix indexing, which substantially
      inflates index size. Plain tries are left-anchored only, BM25 is a different
      concern, and replicas do not change matching semantics.
    ref: "concepts.md#autocomplete-with-tries-and-prefix-structures"
  - id: design-search-autocomplete-typeahead-028
    difficulty: intermediate
    tags: [inverted-index, segments, lucene]
    question: |
      Lucene writes immutable segments. What do you GAIN and GIVE UP from this
      immutability?
    options:
      - "Gain: cheap in-place edits to existing segments; give up: the ability to recover the index after a crash"
      - "Gain: strong cross-replica consistency on every write; give up: nothing measurable in return"
      - "Gain: a strictly smaller on-disk index in every case; give up: raw query throughput and search speed"
      - "Gain: lock-free concurrent reads and simple recovery; give up: in-place updates (deletes are tombstones, space reclaimed only on merge)"
    answer: 3
    explanation: |
      Immutable segments enable lock-free reads, cache-friendliness, and easy
      recovery, but preclude in-place edits: deletes are tombstones and space is
      reclaimed only during merges. It does not give in-place updates or strong
      consistency, and it improves read concurrency.
    ref: "concepts.md#inverted-index-fundamentals"
  - id: design-search-autocomplete-typeahead-029
    difficulty: intermediate
    tags: [client, caching, out-of-order]
    question: |
      A user types "car" quickly. The response for prefix "ca" arrives AFTER the
      response for "car" and overwrites it. What client technique prevents this?
    options:
      - "Request cancellation / out-of-order handling so stale in-flight responses are discarded"
      - "Increasing the server-side cache TTL so the 'car' entry stays warm and is always served before the 'ca' one"
      - "Sharding the trie by prefix on the server so 'ca' and 'car' resolve on the same node in submission order"
      - "Adding more backend replicas so responses return fast enough to arrive strictly in the order requested"
    answer: 0
    explanation: |
      Cancelling superseded requests or matching responses to the latest prefix
      prevents an older "ca" response from clobbering the newer "car" one. Server
      cache TTL, sharding, and replicas do not address client-side response ordering.
    ref: "concepts.md#typeahead-serving-at-scale-caching-and-sharding"
  - id: design-search-autocomplete-typeahead-030
    difficulty: intermediate
    tags: [estimation, storage]
    question: |
      You keep the top 100M distinct prefixes, each with ~5 cached suggestions,
      averaging ~150 bytes per entry. Roughly how much RAM does the suggestion
      store need?
    options:
      - "~1.5 GB"
      - "~15 GB"
      - "~150 GB"
      - "~1.5 TB"
    answer: 1
    explanation: |
      100M × 150 B = 15 × 10^9 bytes ≈ 15 GB, which fits comfortably in RAM on a
      modest fleet (shard for headroom/replication). The other options are off by
      10x-100x.
    ref: "concepts.md#back-of-envelope-capacity-estimation"
  - id: design-search-autocomplete-typeahead-031
    difficulty: intermediate
    tags: [elasticsearch, sharding, trade-offs]
    question: |
      What is the trade-off between many small shards and few large shards in
      Elasticsearch?
    options:
      - "Many small shards: lower fixed overhead but slower recovery; few large shards: more query parallelism and faster rebalancing"
      - "Shard size and count have no measurable effect on parallelism, recovery, or memory overhead in a cluster"
      - "Many small shards: more parallelism and faster recovery but more coordination/memory overhead; few large: less overhead but coarser parallelism and slower rebalance"
      - "Few large shards strictly outperform many small shards on parallelism, recovery, and overhead in every dimension"
    answer: 2
    explanation: |
      More, smaller shards parallelize and recover faster but add per-shard fixed
      cost and coordination overhead (over-sharding is a classic mistake); fewer
      larger shards reduce overhead but give coarser parallelism and slower
      rebalancing. Neither dominates in all dimensions.
    ref: "concepts.md#elasticsearch-and-opensearch-in-practice"
  - id: design-search-autocomplete-typeahead-032
    difficulty: intermediate
    tags: [personalization, caching, trade-offs]
    question: |
      Fully precomputing per-user suggestion lists for every prefix does not scale.
      What is the standard compromise for personalized typeahead?
    options:
      - "Disable personalization entirely and permanently, serving only one global suggestion list to every single user"
      - "Precompute the full N_users × N_prefixes matrix of lists and push it all to disk to dodge the RAM cost"
      - "Route every individual user to their own dedicated shard that holds only that user's personalized suggestion data"
      - "Serve a global cached list, then apply a light per-user re-rank in a thin layer or on the client"
    answer: 3
    explanation: |
      Keep the expensive global computation cacheable, then personalize with a
      cheap per-user re-rank. Precomputing per-user × per-prefix (even on disk)
      explodes combinatorially, and per-user dedicated shards do not scale either.
    ref: "concepts.md#typeahead-serving-at-scale-caching-and-sharding"
  - id: design-search-autocomplete-typeahead-033
    difficulty: intermediate
    tags: [spell-correction, auto-correct, trade-offs]
    question: |
      When is silently auto-correcting a query worse than showing "did you mean X?"
    options:
      - "When the user typed a real but rare intended term (a product SKU, a name, a code) that the corrector 'fixes' into the wrong thing"
      - "Never, because silent auto-correction always produces a better outcome than asking the user to confirm"
      - "When the corpus is small, since a smaller dictionary makes silent correction inherently more dangerous to intent"
      - "When end-to-end latency is very low, because fast responses leave no safe window to display a suggestion"
    answer: 0
    explanation: |
      Auto-correcting can destroy intent for rare-but-real terms like SKUs, names,
      or codes. "Did you mean" is safer there. It is not always better, and corpus
      size/latency are not the deciding factor for this specific risk.
    ref: "concepts.md#spell-correction-and-fuzzy-matching"
  - id: design-search-autocomplete-typeahead-034
    difficulty: intermediate
    tags: [pipeline, batch-vs-nrt, trade-offs]
    question: |
      A product catalog changes slowly (nightly imports), while a news site's
      trending queries change by the minute. Which ingestion approach fits each?
    options:
      - "Both should use near-real-time streaming, since streaming ingestion is universally superior regardless of how fast the data changes"
      - "Catalog: batch rebuild (simple/consistent); news: near-real-time streaming (freshness critical)"
      - "Both should use nightly batch rebuilds, accepting up to a day of staleness even for minute-by-minute trending queries"
      - "Catalog: near-real-time streaming for the nightly imports; news: nightly batch rebuilds for the minute-by-minute trends"
    answer: 1
    explanation: |
      Slowly-changing data suits simple, consistent batch rebuilds; fast-moving
      content needs NRT streaming for freshness. Forcing both to the same paradigm
      wastes complexity (catalog) or serves stale trends (news).
    ref: "concepts.md#indexing-pipeline-and-near-real-time-updates"
  - id: design-search-autocomplete-typeahead-035
    difficulty: intermediate
    tags: [failure, stampede]
    question: |
      A very popular prefix's cache entry expires and thousands of requests hit the
      backend simultaneously. What is this called and how do you mitigate it?
    options:
      - "Split brain; mitigate with quorum reads that require a majority of replicas to agree before the prefix is served"
      - "Hot mapping; mitigate by reindexing the affected prefix into a freshly created index with more shards"
      - "Cache stampede; mitigate with request coalescing (single-flight), stale-while-revalidate, and jittered TTLs"
      - "Deep pagination; mitigate with a search_after cursor instead of large from+size offsets on the prefix lookup"
    answer: 2
    explanation: |
      A synchronized rush to recompute an expired hot key is a cache stampede;
      single-flight coalescing, serving stale while revalidating, and TTL jitter
      prevent the thundering herd. The other terms/fixes address unrelated problems.
    ref: "concepts.md#failure-modes-and-graceful-degradation"
  - id: design-search-autocomplete-typeahead-036
    difficulty: intermediate
    tags: [inverted-index, positions, trade-offs]
    question: |
      Storing term positions and offsets in postings lists enables phrase and
      proximity queries plus highlighting. What is the cost?
    options:
      - "It has no cost, because positions and offsets are derived on the fly at query time rather than stored in the postings"
      - "It makes ordinary single-term lookups impossible, since the postings can then only be read for phrase queries"
      - "It forces the whole index into strong consistency, blocking reads until every position is fsynced to disk"
      - "It inflates index size roughly 2-4x, so store it only when phrase queries are needed"
    answer: 3
    explanation: |
      Positions/offsets substantially grow the index (about 2-4x), so they are worth
      storing only when phrase/proximity/highlighting are required. They do not
      break lookups or impose consistency semantics.
    ref: "concepts.md#inverted-index-fundamentals"
  - id: design-search-autocomplete-typeahead-037
    difficulty: intermediate
    tags: [elasticsearch, suggester, completion]
    question: |
      Elasticsearch's `completion` suggester is fast because it is FST-based and
      heap-resident. Which statement reflects its main operational constraint?
    options:
      - "It is entirely heap-resident and prefers indexing into a single shard, since multi-shard suggests require a two-phase fetch"
      - "It works best spread across many shards at once, since the FST is partitioned so each shard scans its own prefix slice in parallel"
      - "It keeps suggestions only on disk in a memory-mapped file to save heap, paging FST blocks in lazily on each lookup"
      - "It cannot rank completions by weight, so ties are always broken by insertion order rather than a stored score"
    answer: 0
    explanation: |
      The completion suggester keeps its FST in heap and performs best on a single
      shard; spreading it across shards forces a costlier two-phase lookup. It is
      not disk-based, does support weights, and is not optimized for many shards.
    ref: "concepts.md#elasticsearch-and-opensearch-in-practice"
  - id: design-search-autocomplete-typeahead-038
    difficulty: intermediate
    tags: [vector-search, hnsw, ivf, trade-offs]
    question: |
      You must index ~2 billion vectors on a tight memory budget and can tolerate
      slightly lower recall. Which ANN approach fits best?
    options:
      - "Pure HNSW, since its layered proximity graph is the most memory-compact option at billion scale"
      - "IVF-PQ (inverted file + product quantization), which drastically reduces memory at some recall cost"
      - "Exact brute-force search over all vectors, since a linear scan is fast enough even at two billion"
      - "A trie built over the raw vector components, walking each dimension to find the nearest neighbors"
    answer: 1
    explanation: |
      IVF-PQ compresses vectors and searches only nearby clusters, ideal for
      billion-scale on a budget. HNSW is memory-heavy (not minimal), brute force is
      too slow at that scale, and a trie does not do nearest-neighbor over dense
      vectors.
    ref: "concepts.md#vector-and-semantic-search-as-a-modern-alternative"
  - id: design-search-autocomplete-typeahead-039
    difficulty: intermediate
    tags: [ranking, personalization, trade-offs]
    question: |
      Adding heavy personalization to search ranking improves engagement but has a
      systemic cost. What is it?
    options:
      - "It reduces the on-disk index size, since per-user signals let the engine prune postings no single user requests"
      - "It guarantees strong consistency, since each user's ranking is recomputed synchronously from the latest state per query"
      - "It breaks result cacheability (every user sees different results) and complicates debugging/reproducibility"
      - "It removes the need for BM25 scoring, since the personalization model fully subsumes lexical relevance for every query"
    answer: 2
    explanation: |
      Per-user ranking means results can't be shared across users, gutting cache
      hit ratios, and makes issues hard to reproduce. It does not shrink the index,
      provide consistency, or replace lexical scoring.
    ref: "concepts.md#ranking-and-relevance"
  - id: design-search-autocomplete-typeahead-040
    difficulty: intermediate
    tags: [top-k, approximate, count-min]
    question: |
      At massive scale, using a Count-Min Sketch to estimate query frequencies for
      autocomplete weighting is a common choice. What is the trade-off?
    options:
      - "Perfectly exact per-query counts with a bounded, tiny memory footprint that never grows with the key space"
      - "It cannot produce any usable frequency estimate, serving only as a membership filter that answers seen-or-not"
      - "It makes frequency reads slower than exact counting, since each lookup must hash across all its rows in sequence"
      - "Much lower memory/CPU for frequency estimation, at the cost of occasional overestimation that can misorder near-ties"
    answer: 3
    explanation: |
      Count-Min Sketch approximates frequencies in sublinear memory; it can
      overcount and thus occasionally misorder near-ties, which rarely matters for
      autocomplete. It is not exact, does count, and does not slow reads.
    ref: "concepts.md#top-k-selection-and-weighting"
  - id: design-search-autocomplete-typeahead-041
    difficulty: advanced
    tags: [sharding, scatter-gather, trade-offs]
    question: |
      Given a tight typeahead latency budget, why is sharding the trie BY PREFIX
      usually preferred over sharding by a hash of the full query string?
    options:
      - "With prefix sharding a given prefix's completions live on one shard (locality, cache affinity), whereas full-query hashing scatters a prefix's completions across many shards, forcing slower scatter-gather"
      - "Prefix sharding spreads load perfectly evenly across all shards with no hot spots, because prefixes are uniformly distributed over the key space"
      - "Full-query hashing is effectively impossible to implement, because a hash of the query string cannot be computed until the user has finished typing"
      - "Prefix sharding removes the need for any caching layer, since each single-shard lookup is already fast enough to serve directly from disk"
    answer: 0
    explanation: |
      Prefix sharding keeps all completions of a prefix co-located, giving locality
      and cache affinity for the single-shard lookup; full-query hashing spreads
      those completions everywhere, requiring a scatter-gather that hurts latency.
      Prefix sharding does NOT spread load evenly (it creates hot shards) and does
      not remove caching.
    ref: "concepts.md#typeahead-serving-at-scale-caching-and-sharding"
  - id: design-search-autocomplete-typeahead-042
    difficulty: advanced
    tags: [pipeline, blue-green, trade-offs]
    question: |
      You rebuild the trie in batch and publish it to serving nodes. Why is an
      atomic blue-green swap preferred over updating the live index in place, and
      what is its cost?
    options:
      - "In-place updates are always safer than a swap, since mutating the live index avoids the risk of ever publishing a half-built snapshot"
      - "Swap gives a consistent snapshot and easy rollback, but roughly doubles memory during the swap; in-place risks serving inconsistent intermediate state"
      - "A blue-green swap makes the serving index strongly consistent with the source database, eliminating any replication lag between them"
      - "In-place updates are impossible with a trie, because its immutable node structure forbids modifying any weight after the initial build"
    answer: 1
    explanation: |
      A blue-green swap presents a fully-built, consistent index and allows instant
      rollback, at the cost of holding two copies (memory spike) during the swap.
      In-place mutation can expose half-updated state. Swap does not give DB-level
      consistency, and in-place trie updates are possible (just riskier).
    ref: "concepts.md#indexing-pipeline-and-near-real-time-updates"
  - id: design-search-autocomplete-typeahead-043
    difficulty: advanced
    tags: [fst, trie, trade-offs]
    question: |
      Lucene's completion suggester uses an FST rather than a mutable pointer-based
      trie. What is the key trade-off of choosing an FST?
    options:
      - "FST supports fast in-place incremental updates but consumes far more memory than a pointer-based trie of the same terms"
      - "FST is noticeably slower to read than a pointer-based trie yet far easier to mutate node-by-node at query time"
      - "FST is extremely compact (shares suffixes too) and fast to read but is effectively immutable, so changes require a rebuild"
      - "FST cannot store per-completion weights for ranking, so it can only return matches in raw lexicographic order"
    answer: 2
    explanation: |
      An FST minimizes a DAG sharing both prefixes and suffixes, making it very
      compact and fast for reads, but it is essentially immutable — updates mean
      rebuilding. It is not easily mutable, not slow to read, and can carry weights.
    ref: "concepts.md#autocomplete-with-tries-and-prefix-structures"
  - id: design-search-autocomplete-typeahead-044
    difficulty: advanced
    tags: [ranking, wand, top-k]
    question: |
      Block-Max WAND (used in Lucene) speeds up ranked full-text queries by doing
      what?
    options:
      - "Precomputing and caching the full ranked result of every possible query ahead of time on disk"
      - "Sharding the postings lists across many more nodes so each scans a smaller slice in parallel"
      - "Replacing BM25 relevance scoring with a cheaper strict alphabetical ordering of the matches"
      - "Skipping postings that cannot possibly enter the current top-k, avoiding full postings scans"
    answer: 3
    explanation: |
      WAND / Block-Max WAND uses per-block max score bounds to skip documents that
      can't make the top-k, dramatically reducing postings scanned. It does not
      precompute all results, shard, or change the scoring function.
    ref: "concepts.md#top-k-selection-and-weighting"
  - id: design-search-autocomplete-typeahead-045
    difficulty: advanced
    tags: [nrt, incremental, trade-offs]
    question: |
      Near-real-time incremental updates to a typeahead trie deliver seconds-fresh
      suggestions. What makes this HARDER than batch rebuild?
    options:
      - "Concurrent updates to shared precomputed top-k lists, ordering, and correctness are hard to get right under live traffic"
      - "Nothing makes it harder; incremental updating is strictly simpler than batch because it touches only the affected nodes"
      - "Incremental updates always require holding two full copies of the trie in memory at once, just as a batch swap does"
      - "Incremental updates cannot serve any reads while in progress, forcing the trie fully offline during every mutation"
    answer: 0
    explanation: |
      Streaming updates mutate shared node top-k lists concurrently with reads,
      raising ordering and correctness challenges that a clean batch swap avoids.
      Incremental is not simpler, does not inherently double memory, and does serve
      reads.
    ref: "concepts.md#indexing-pipeline-and-near-real-time-updates"
  - id: design-search-autocomplete-typeahead-046
    difficulty: advanced
    tags: [scenario, freshness, latency]
    question: |
      A social app must show typeahead for @usernames that includes accounts
      created seconds ago, at 300K QPS, within 80 ms. Which architecture best fits?
    options:
      - "Nightly batch rebuild of a static FST with no streaming path, publishing one fresh snapshot to serving nodes each morning"
      - "In-memory prefix-sharded trie served from RAM with a streaming NRT overlay for brand-new names, plus edge/Redis caching for hot prefixes"
      - "Query a relational database with a LIKE 'prefix%' scan on every keystroke, relying on a B-tree index to stay fast"
      - "A single-node Elasticsearch cluster with default settings, leaning on its completion suggester to absorb the full load"
    answer: 1
    explanation: |
      The constraints (very fresh + very high QPS + tight latency) demand in-memory
      serving, prefix sharding, aggressive caching, and a streaming overlay for
      just-created names. Nightly batch is too stale, per-keystroke DB LIKE cannot
      hit the latency/QPS, and a single node cannot handle the scale or HA.
    ref: "concepts.md#typeahead-serving-at-scale-caching-and-sharding"
  - id: design-search-autocomplete-typeahead-047
    difficulty: advanced
    tags: [vector-search, embeddings, migration]
    question: |
      Your team wants to upgrade the embedding model powering semantic search. What
      is the major operational consequence?
    options:
      - "Nothing changes operationally; embeddings from different models share the same vector space and are fully interchangeable"
      - "Only newly ingested documents need fresh embeddings, since vectors from the old model stay compatible in the same index"
      - "The entire corpus must be re-embedded (expensive migration); you should version embeddings and cannot mix vectors from different models in one index"
      - "The ANN index automatically re-projects old vectors into the new model's space during its next background merge"
    answer: 2
    explanation: |
      Different models produce incompatible vector spaces, so switching models means
      re-embedding the whole corpus — a real migration — and versioning embeddings.
      You cannot mix models' vectors, old vectors are not auto-converted, and leaving
      old docs unchanged breaks similarity comparisons.
    ref: "concepts.md#vector-and-semantic-search-as-a-modern-alternative"
  - id: design-search-autocomplete-typeahead-048
    difficulty: advanced
    tags: [degradation, timeouts, trade-offs]
    question: |
      Under overload, your L2 re-ranker becomes slow. What is the best degradation
      strategy for a search system?
    options:
      - "Block all queries until the re-ranker recovers, queuing every request so no user ever sees un-re-ranked results"
      - "Return an HTTP 503 error to every user to shed load until the re-ranker's latency falls back to normal"
      - "Disable the retrieval stage entirely so nothing is computed downstream, sparing the saturated re-ranker any work"
      - "Enforce a per-stage timeout and return the L1 candidate results without L2 re-ranking (degrade relevance, preserve availability)"
    answer: 3
    explanation: |
      The right degradation trades relevance for availability: time out the re-ranker
      and serve the already-retrieved candidates. Blocking or erroring hurts users
      more, and disabling retrieval returns nothing at all.
    ref: "concepts.md#failure-modes-and-graceful-degradation"
  - id: design-search-autocomplete-typeahead-049
    difficulty: advanced
    tags: [scenario, ranking, hybrid]
    question: |
      An e-commerce search must match exact SKUs like "AB-1200X" AND understand
      "cheap wireless earbuds." Which retrieval design is most appropriate?
    options:
      - "Hybrid retrieval: BM25 for exact SKU/keyword matches plus vector search for semantic intent, fused (e.g. RRF)"
      - "Vector-only search, since dense embeddings already capture exact SKUs and semantic intent equally well"
      - "BM25-only lexical retrieval, since matching keyword tokens is all that a product search ever needs"
      - "A trie of product names only, resolving each query by prefix completion against the catalog"
    answer: 0
    explanation: |
      Vectors alone often miss exact tokens like SKUs; BM25 alone misses semantic
      intent ("cheap wireless earbuds"). Hybrid retrieval fused with RRF handles
      both. A trie handles prefix completion, not full ranked retrieval.
    ref: "concepts.md#vector-and-semantic-search-as-a-modern-alternative"
  - id: design-search-autocomplete-typeahead-050
    difficulty: advanced
    tags: [pipeline, backpressure, decoupling]
    question: |
      Your Kafka-based indexing consumer falls behind (rising consumer lag). Because
      the read and write paths are decoupled, what is the immediate user-visible
      effect?
    options:
      - "Search queries start failing immediately, because the serving tier reads directly from the lagging Kafka consumer"
      - "Serving is unaffected but freshness drops — new content takes longer to appear; you monitor and scale the consumer"
      - "The entire index becomes unavailable until the consumer fully catches up and releases its lock on the shards"
      - "Queries return strongly consistent but empty results, since the index blocks reads until ingestion is fully caught up"
    answer: 1
    explanation: |
      Decoupling means ingestion lag degrades freshness only; the serving tier keeps
      answering from the current index. Reads do not fail, the index stays available,
      and results are not strongly consistent.
    ref: "concepts.md#indexing-pipeline-and-near-real-time-updates"
  - id: design-search-autocomplete-typeahead-051
    difficulty: advanced
    tags: [spell-correction, phrase, language-model]
    question: |
      Why can Elasticsearch's phrase suggester produce better "did you mean"
      corrections than the term suggester?
    options:
      - "It spreads the correction work across more shards, so more candidate spellings are evaluated per request"
      - "It ignores edit distance entirely, generating candidate corrections purely from a phonetic soundalike algorithm instead"
      - "It applies an n-gram language model over the whole phrase, using co-occurrence and frequencies rather than correcting each token in isolation"
      - "It stores a precomputed table of phrase corrections on disk, looking each misspelling up directly at query time"
    answer: 2
    explanation: |
      The phrase suggester layers a language model on top of per-token candidates,
      choosing corrections that fit the whole phrase's context — better than the
      context-blind term suggester. It is not about shard count, still uses edit
      distance for candidates, and storage location is irrelevant.
    ref: "concepts.md#spell-correction-and-fuzzy-matching"
  - id: design-search-autocomplete-typeahead-052
    difficulty: advanced
    tags: [edit-distance, trade-offs]
    question: |
      Allowing edit distance 2 instead of 1 in fuzzy matching improves typo recall
      but has what primary downside?
    options:
      - "It makes exact matches impossible, because the fuzzy expansion always overrides any zero-distance direct hit"
      - "It reduces the on-disk index size, since a wider edit-distance ball lets the engine store fewer explicit term variants"
      - "It requires switching the index to strong consistency, because fuzzy expansion must read every replica to agree"
      - "The candidate set and false-positive rate explode, hurting precision and cost; hence distance 2 is often restricted to longer terms"
    answer: 3
    explanation: |
      A larger edit-distance ball matches far more (often wrong) terms, blowing up
      candidates, false positives, and cost — so systems commonly permit distance 2
      only for longer words. It does not block exact matches, shrink the index, or
      involve consistency.
    ref: "concepts.md#spell-correction-and-fuzzy-matching"
  - id: design-search-autocomplete-typeahead-053
    difficulty: advanced
    tags: [scenario, sharding, hot-key]
    question: |
      A celebrity's name suddenly becomes a viral prefix, overwhelming its single
      shard. Which combination of mitigations is most appropriate WITHOUT a full
      reshard?
    options:
      - "Replicate the hot shard, add per-key edge/Redis caching for that prefix, and split the hot key range; consistent hashing avoids a full reshard"
      - "Reshard the entire cluster to rebalance keys, rehashing every prefix so the viral one lands on a fresh empty shard"
      - "Disable caching for that prefix so every request reaches the shard directly and always returns the freshest suggestions"
      - "Route all traffic for that prefix to a single dedicated new node provisioned just for the viral celebrity name"
    answer: 0
    explanation: |
      Replication of the hot shard, edge/key caching, and range splitting absorb the
      spike; consistent hashing lets you add capacity without rehashing everything.
      A full reshard is disruptive, disabling caching worsens it, and one new node
      is a new single point of overload.
    ref: "concepts.md#failure-modes-and-graceful-degradation"
  - id: design-search-autocomplete-typeahead-054
    difficulty: advanced
    tags: [ranking, bm25, parameters]
    question: |
      In BM25, what does raising the b parameter toward 1.0 do?
    options:
      - "Disables the inverse-document-frequency component of the score entirely"
      - "Increases document-length normalization, penalizing long documents more strongly"
      - "Removes term-frequency saturation, letting repeats add unbounded score"
      - "Reorders matches alphabetically instead of by numeric relevance score"
    answer: 1
    explanation: |
      b controls length normalization; b=1 fully normalizes by document length (long
      docs penalized), b=0 disables it. It does not touch IDF, k1's saturation, or
      make scoring alphabetical.
    ref: "concepts.md#ranking-and-relevance"
  - id: design-search-autocomplete-typeahead-055
    difficulty: advanced
    tags: [scenario, cost, precompute-vs-onfly]
    question: |
      A small internal wiki (50K pages, low QPS) needs search. What is the most
      appropriate design given the scale and a small team?
    options:
      - "A custom in-memory prefix-sharded trie fleet with NRT streaming updates and edge caching for hot prefixes, hand-built for peak throughput"
      - "A billion-vector HNSW cluster with product quantization for dense semantic retrieval across the entire internal wiki corpus"
      - "A managed Elasticsearch/OpenSearch index with default BM25 and the completion suggester — ship fast, low operational burden"
      - "A globally distributed, cell-based architecture with CDC pipelines streaming every page edit into per-region search indexes"
    answer: 2
    explanation: |
      At this modest scale, off-the-shelf managed ES with BM25 and a completion
      suggester is the pragmatic, low-effort choice. The custom trie fleet, giant
      vector cluster, and cell-based CDC architecture are massive over-engineering
      for 50K pages and low QPS.
    ref: "concepts.md#trade-offs-and-when-to-use-what"
  - id: design-search-autocomplete-typeahead-056
    difficulty: advanced
    tags: [radix, tst, memory, trade-offs]
    question: |
      For a large sparse set of long strings with many shared prefixes, why might a
      radix (Patricia) tree beat a standard trie?
    options:
      - "It keeps every stored result pre-sorted by descending BM25 relevance score, so ranking is essentially free at query time"
      - "It supports semantic matching by embedding each node into a shared vector space and doing nearest-neighbor lookups on the prefix"
      - "It removes the need for any top-k precomputation because each individual node already caches its own fully ranked completion list"
      - "It compresses single-child chains into one edge, saving significant memory on long shared prefixes"
    answer: 3
    explanation: |
      A radix tree collapses chains of single-child nodes into one edge, cutting node
      overhead dramatically for long shared prefixes. It does not do BM25 ranking,
      semantic matching, or eliminate the need for top-k precomputation.
    ref: "concepts.md#autocomplete-with-tries-and-prefix-structures"
  - id: design-search-autocomplete-typeahead-057
    difficulty: advanced
    tags: [scenario, personalization, cache]
    question: |
      You want personalized typeahead but your cache hit ratio just collapsed from
      95% to 20% after enabling per-user results. What is the best fix?
    options:
      - "Cache the global top-k per prefix (shared across users) and apply a thin per-user re-rank on that small list, restoring cacheability while keeping personalization"
      - "Accept the collapsed 20% hit ratio as unavoidable and simply scale the backend fleet 5x to brute-force the added per-user load"
      - "Turn off caching entirely and recompute every prefix from the trie on each keystroke so results are always freshly personalized"
      - "Precompute a full per-user suggestion list for every prefix in a nightly batch job and push all of them into the cache in advance"
    answer: 0
    explanation: |
      Caching the global list and re-ranking a small candidate set per user restores
      the high hit ratio while still personalizing. Scaling 5x is wasteful, disabling
      caching is worse, and per-user × per-prefix precomputation does not scale.
    ref: "concepts.md#typeahead-serving-at-scale-caching-and-sharding"
  - id: design-search-autocomplete-typeahead-058
    difficulty: advanced
    tags: [inverted-index, compression]
    question: |
      Why are postings lists delta-encoded (storing gaps between doc IDs) rather
      than raw doc IDs?
    options:
      - "To make the raw postings list directly human-readable when engineers inspect the on-disk index files during debugging sessions"
      - "Because sorted doc IDs have small gaps that compress far better than large absolute IDs, shrinking the index and improving cache/scan efficiency"
      - "To enable strong, linearizable consistency across replicas by encoding each doc ID relative to a committed baseline offset"
      - "Because Lucene cannot store 64-bit integers directly and must encode every doc ID as a gap from the previous entry instead"
    answer: 1
    explanation: |
      Sorted doc IDs have small deltas that pack into few bits (with schemes like
      PForDelta/Frame-of-Reference), massively shrinking postings and speeding scans.
      It is not for readability, consistency, or an integer limitation.
    ref: "concepts.md#inverted-index-fundamentals"
  - id: design-search-autocomplete-typeahead-059
    difficulty: advanced
    tags: [scenario, ap-cp, compliance]
    question: |
      Search is normally AP. In which situation does a near-CP behavior become a
      hard requirement?
    options:
      - "When results must be personalized per user, since each viewer's ranking has to be recomputed synchronously and agreed across replicas"
      - "When the corpus grows very large, since more documents force stricter cross-shard coordination to keep every replica in agreement"
      - "When legally removed/takedown content must NOT appear in results — correctness of exclusion outweighs freshness/availability of that item"
      - "When latency must be under 100 ms, since a tight budget requires blocking reads until every replica confirms the same result set"
    answer: 2
    explanation: |
      Compliance/legal takedowns are a case where wrongly showing an item is
      unacceptable, so you enforce strict exclusion even at some availability/latency
      cost. Personalization, corpus size, and latency budgets do not by themselves
      demand CP-like guarantees.
    ref: "concepts.md#problem-framing-and-requirements"
  - id: design-search-autocomplete-typeahead-060
    difficulty: advanced
    tags: [vector-search, hnsw, tuning]
    question: |
      In an HNSW index, increasing the search parameter efSearch primarily changes
      what?
    options:
      - "It permanently shrinks the on-disk index by pruning the graph layers the search no longer needs to visit"
      - "It removes the need to store embeddings at all, letting the graph answer queries from bare node IDs alone"
      - "It gradually converts the HNSW proximity graph into an IVF inverted-file structure as more queries run"
      - "It raises recall (explores more of the graph) at the cost of higher query latency"
    answer: 3
    explanation: |
      efSearch controls how much of the proximity graph is explored per query:
      higher = better recall but slower. It does not change index size, remove
      embeddings, or switch algorithms.
    ref: "concepts.md#vector-and-semantic-search-as-a-modern-alternative"
  - id: design-search-autocomplete-typeahead-061
    difficulty: expert
    tags: [scenario, architecture, judgment]
    question: |
      You are designing global typeahead for a service with users on every
      continent, a 70 ms p99 budget, and mostly non-personalized suggestions. Which
      design gives the best latency-vs-cost balance?
    options:
      - "Edge/CDN caching of popular non-personalized prefixes near users, backed by regional in-memory trie replicas, with a central pipeline publishing snapshots to all regions"
      - "A single central in-memory trie cluster in us-east-1 that every region queries directly across the ocean on each keystroke"
      - "Per-request cross-region calls to a strongly consistent global database that must reach quorum before returning any suggestion"
      - "Fully per-user precomputed suggestion lists for every prefix, replicated in their entirety to every edge PoP worldwide"
    answer: 0
    explanation: |
      Because suggestions are mostly global, you can cache popular prefixes at the
      edge (defeating speed-of-light) and keep regional trie replicas for misses,
      fed by a central publish pipeline. A single central cluster adds cross-continent
      RTT (>70 ms), a strongly consistent global DB per request is even slower, and
      per-user edge precomputation does not scale.
    ref: "concepts.md#typeahead-serving-at-scale-caching-and-sharding"
  - id: design-search-autocomplete-typeahead-062
    difficulty: expert
    tags: [scenario, ingestion, correctness]
    question: |
      Your search index must stay in sync with a primary MySQL database that
      receives high write volume, and drift has caused customer-visible bugs. The
      team also wants to be able to rebuild the index from scratch after a bad
      deploy. What is the strongest design?
    options:
      - "Dual-write to MySQL and the search index in the same application transaction, rolling both back together on any partial failure"
      - "CDC: stream the MySQL binlog via Debezium into Kafka, consume into the index as an eventually-consistent materialized view; replay the Kafka log to rebuild after a bad deploy"
      - "Nightly full re-export of the entire MySQL dataset into a freshly rebuilt index, with no incremental updates between the runs"
      - "Have the application write only to the search index and derive the MySQL tables from it via a reverse-sync batch job each hour"
    answer: 1
    explanation: |
      CDC into Kafka makes the index a replayable materialized view of the DB:
      it eliminates dual-write drift and lets you rebuild by replaying the log.
      Dual-write drifts on partial failure, nightly export is too stale for high
      write volume, and inverting the source of truth is not viable for an OLTP DB.
    ref: "concepts.md#indexing-pipeline-and-near-real-time-updates"
  - id: design-search-autocomplete-typeahead-063
    difficulty: expert
    tags: [scenario, precompute-vs-onfly, judgment]
    question: |
      Suggestions must reflect query popularity from the last 5 minutes (fast
      trends), but you also need stable sub-60 ms reads at 400K QPS. Which hybrid
      approach is best?
    options:
      - "Compute top-k on the fly for every request by running a depth-first traversal over the whole matching trie subtree per keystroke"
      - "Rebuild the entire trie from scratch every 5 minutes and hot-swap it into every serving node to guarantee fresh trend weights"
      - "A batch-built baseline trie (top-k precomputed) SERVED FROM RAM, plus a lightweight streaming NRT overlay that adjusts weights/injects trending terms for recent activity"
      - "Query the raw clickstream log store directly on each keystroke and aggregate the last 5 minutes of events inline before responding"
    answer: 2
    explanation: |
      A precomputed baseline gives the fast reads, while a small NRT overlay layers
      in the last-5-minutes trends — capturing freshness without paying per-request
      DFS. On-the-fly DFS blows the latency budget, full rebuilds every 5 minutes are
      wasteful/heavy, and querying raw logs per keystroke is far too slow.
    ref: "concepts.md#top-k-selection-and-weighting"
  - id: design-search-autocomplete-typeahead-064
    difficulty: expert
    tags: [scenario, vector, cost, judgment]
    question: |
      A RAG system needs semantic retrieval over 500M document chunks with p99 < 50
      ms and strict exact-keyword matching for legal citations. Budget is moderate.
      Which retrieval architecture is most defensible?
    options:
      - "Pure HNSW vector search only, trusting the dense embeddings to reproduce exact legal citation strings as accurately as lexical matching"
      - "Pure BM25 lexical retrieval only, since exact citation matching is required and keyword scoring is assumed to also cover semantic recall"
      - "Exact brute-force nearest neighbor scanning all 500M vectors on every query, accepting the linear cost to guarantee perfect recall"
      - "Hybrid: HNSW (or IVF-PQ if memory-bound) for semantic recall PLUS a BM25/lexical index for exact citation matching, fused with RRF"
    answer: 3
    explanation: |
      Legal citations demand exact lexical matching (vectors miss exact tokens),
      while semantic recall needs ANN — so hybrid fused with RRF is correct, choosing
      IVF-PQ if memory is tight. Pure vector misses exact citations, pure BM25 misses
      semantic recall, and brute-force cannot meet 50 ms at 500M.
    ref: "concepts.md#vector-and-semantic-search-as-a-modern-alternative"
  - id: design-search-autocomplete-typeahead-065
    difficulty: expert
    tags: [scenario, degradation, judgment]
    question: |
      During a traffic spike, several trie shards are near saturation, the personal
      re-rank service is timing out, and the ingestion consumer is lagging. What is
      the best PRIORITIZED degradation policy?
    options:
      - "Serve cached/global (non-personalized) suggestions, drop the personal re-rank on timeout, and accept increased staleness from ingestion lag — preserving fast, available answers"
      - "Fail requests fast to protect the saturated shards, returning a 503 error to every user until the traffic spike subsides"
      - "Block every request until the lagging ingestion consumer fully catches up, so freshness is guaranteed before any answer is served"
      - "Disable the prefix cache to reduce memory pressure on the shards, sending all keystroke traffic straight through to them instead"
    answer: 0
    explanation: |
      The right policy trades quality for availability across all three axes: serve
      global cached results, skip the failing personalizer, and tolerate staleness.
      Returning 503s, blocking for freshness, or disabling the cache (which increases
      shard load) all make the user experience worse.
    ref: "concepts.md#failure-modes-and-graceful-degradation"
  - id: design-search-autocomplete-typeahead-066
    difficulty: expert
    tags: [ranking, ltr, trade-offs, judgment]
    question: |
      Your team proposes inserting a deep-neural re-ranker into the L2 stage for all
      queries. What is the MOST important trade-off to weigh before doing so?
    options:
      - "Whether the deep-neural re-ranker forces a change to the on-disk inverted-index storage format and segment layout"
      - "The relevance gain (NDCG/engagement) versus the added per-query latency and serving cost, applied only to top candidates — and whether that gain justifies the p99 hit"
      - "Whether adding the re-ranker makes the whole serving path strongly consistent across every replica on each query"
      - "Whether the neural re-ranker removes the need for a separate retrieval stage by selecting candidates itself in one pass"
    answer: 1
    explanation: |
      Expensive re-rankers must justify their latency and cost with measurable
      relevance lift, and are applied only to top candidates. Storage format,
      consistency, and retrieval are not the central concern — the cost/benefit on
      relevance vs p99 latency is.
    ref: "concepts.md#ranking-and-relevance"
  - id: design-search-autocomplete-typeahead-067
    difficulty: expert
    tags: [scenario, estimation, capacity]
    question: |
      For a corpus of 1B documents averaging ~1 KB of text, roughly how large is
      the inverted index and how should you plan cluster storage?
    options:
      - "About a 10 TB index (roughly 10x the raw text after positional data); plan for 100 TB across the cluster once replicated"
      - "About a 5 GB index that fits comfortably on a single node, since inverted indexes shrink text by two orders of magnitude"
      - "About 200-500 GB index (20-50% of the 1 TB raw text after compression); plan ~1-2 TB across the cluster with replication and overhead"
      - "About the same 1 TB as the raw text, since postings lists store one full entry per token and compression is not possible"
    answer: 2
    explanation: |
      1B × 1 KB = 1 TB raw; a compressed inverted index is typically 20-50% of that,
      so ~200-500 GB, and with replication factor ~2 plus overhead you plan ~1-2 TB.
      10 TB overestimates, 5 GB grossly underestimates, and postings do compress well
      below raw text.
    ref: "concepts.md#back-of-envelope-capacity-estimation"
  - id: design-search-autocomplete-typeahead-068
    difficulty: expert
    tags: [scenario, build-vs-buy, judgment]
    question: |
      A hyperscale company serves 500K+ typeahead QPS with a sub-60 ms server budget
      and wants full control over latency and cost. Why might they build a custom
      in-memory trie service instead of using managed Elasticsearch?
    options:
      - "Because Elasticsearch fundamentally cannot store or index free-form text fields at the volume a typeahead corpus requires"
      - "Because a managed search service is always strictly cheaper than a self-run fleet at every scale, including hyperscale QPS"
      - "Because in-memory tries provide strong cross-node consistency guarantees that Elasticsearch is architecturally unable to match"
      - "A purpose-built in-memory trie with prefix sharding and top-k precomputation can beat a general-purpose engine on tail latency and per-query cost at extreme scale, at the price of building and operating it themselves"
    answer: 3
    explanation: |
      At extreme scale, a specialized trie service can shave tail latency and cost
      versus a general engine, justifying the build/operate burden. ES obviously
      stores text, managed is not always cheapest at hyperscale, and the choice is
      about latency/cost, not consistency guarantees.
    ref: "concepts.md#elasticsearch-and-opensearch-in-practice"
  - id: design-search-autocomplete-typeahead-069
    difficulty: expert
    tags: [scenario, sharding, tradeoff, judgment]
    question: |
      You must choose between (A) prefix sharding with hot-shard replication and (B)
      full-query-hash sharding with scatter-gather, for a 400K-QPS typeahead with a
      55 ms budget. Which is better and why?
    options:
      - "A, because a single-shard lookup with cache affinity meets the tight budget, and hot-shard replication handles the skew — whereas B's scatter-gather to many shards per keystroke adds fan-out latency that risks the 55 ms budget"
      - "B, because scatter-gather across many shards always lowers per-keystroke latency by parallelizing the lookup over more nodes"
      - "B, because perfectly even load distribution matters more than tail latency here, and full-query hashing spreads keys uniformly"
      - "A, because prefix sharding automatically eliminates all hot spots, so no hot-shard replication or range splitting is ever needed"
    answer: 0
    explanation: |
      Prefix sharding keeps each keystroke a single-shard, cache-friendly lookup that
      fits the tight budget; replication mitigates the skew. Full-query hashing forces
      a multi-shard scatter-gather per keystroke, adding fan-out latency. Scatter-gather
      does not lower latency, and prefix sharding does NOT eliminate hot spots (hence
      the replication caveat).
    ref: "concepts.md#typeahead-serving-at-scale-caching-and-sharding"
  - id: design-search-autocomplete-typeahead-070
    difficulty: expert
    tags: [scenario, semantic-autocomplete, judgment]
    question: |
      Product wants "intent-based" autocomplete: typing "warm beach trips in
      december" should suggest destinations, beyond literal prefix completion. What
      is the most appropriate augmentation, and what trade-off must you accept?
    options:
      - "Replace the trie entirely with dense vector search, accepting no downside since embeddings subsume fast literal prefix completion"
      - "Keep the fast trie/FST for literal prefix completion and ADD an embedding-based semantic suggestion path (and/or LLM query rewriting), accepting higher compute/latency and lower interpretability for the semantic path"
      - "Add more read replicas of the trie, which lets the extra serving capacity infer user intent from the typed prefix on its own"
      - "Switch the completion path to BM25 lexical scoring, which captures the user's underlying intent by ranking matching keyword tokens"
    answer: 1
    explanation: |
      Literal prefix completion is still fastest/cheapest on a trie/FST, so you add a
      parallel semantic path (embeddings/LLM rewriting) for intent, accepting its
      extra compute, latency, and reduced interpretability. Fully replacing the trie
      loses cheap literal completion, replicas don't add semantics, and BM25 is
      lexical not intent-based.
    ref: "concepts.md#vector-and-semantic-search-as-a-modern-alternative"
  - id: design-search-autocomplete-typeahead-071
    difficulty: intermediate
    tags: [inverted-index, merge, trade-offs]
    question: |
      A workload does heavy updates/deletes on a Lucene-based index. Why can this be
      problematic, and what is the mechanism?
    options:
      - "Updates are essentially free with no consequence, because Lucene edits the existing segment in place and reuses its allocated space"
      - "The index quietly switches to strong, linearizable consistency during heavy updates, which is what slows the write path down"
      - "Deletes are tombstones and updates create new segments; space is reclaimed only on merges, so heavy mutation causes segment churn and merge I/O storms"
      - "Background segment merges are automatically disabled while updates are in flight, so no reclamation work competes with the writes"
    answer: 2
    explanation: |
      Because segments are immutable, updates/deletes accumulate new segments and
      tombstones, and reclaiming space requires expensive background merges — heavy
      mutation triggers merge I/O storms. Updates are not free, do not confer strong
      consistency, and merges are not disabled.
    ref: "concepts.md#inverted-index-fundamentals"
  - id: design-search-autocomplete-typeahead-072
    difficulty: intermediate
    tags: [nrt, translog, durability]
    question: |
      In Elasticsearch, what is the role of the translog?
    options:
      - "It stores the final compressed inverted index segments that queries are actually served from on each shard"
      - "It caches recently returned query results in memory so repeated searches skip re-scanning the shard's segments"
      - "It holds per-user session and authentication state for the duration of each active search connection to the cluster"
      - "It is a write-ahead log providing durability for recently indexed documents before they are flushed (fsynced) into segments"
    answer: 3
    explanation: |
      The translog is a write-ahead log ensuring durability of in-flight documents
      until a flush fsyncs segments and truncates it. It is not the final index, a
      query cache, or session storage.
    ref: "concepts.md#indexing-pipeline-and-near-real-time-updates"
  - id: design-search-autocomplete-typeahead-073
    difficulty: beginner
    tags: [ranking, retrieval-vs-ranking]
    question: |
      What is the difference between retrieval and ranking in a search funnel?
    options:
      - "Retrieval finds candidate matches (high recall, cheap); ranking decides their order (relevance, more expensive per item)"
      - "They are the same operation under two names, since finding candidates and ordering them by relevance happen in one step"
      - "Ranking finds the candidate matches cheaply with high recall, and retrieval then sorts those candidates by relevance score"
      - "Retrieval only applies to autocomplete prefixes, while full-text search skips retrieval and ranks the entire corpus directly"
    answer: 0
    explanation: |
      Retrieval generates candidates cheaply with high recall; ranking orders those
      candidates by relevance at higher per-item cost. The roles are distinct (not
      swapped), and retrieval applies to full-text search generally, not just
      autocomplete.
    ref: "concepts.md#ranking-and-relevance"
  - id: design-search-autocomplete-typeahead-074
    difficulty: advanced
    tags: [scenario, weighting, trade-offs]
    question: |
      You precompute top-5 suggestions per prefix, but product now wants to show
      top-10. What is the cleanest lesson/fix, and why?
    options:
      - "Nothing changes, because the precomputed top-5 lists already hold 10 completions each and the UI just needs to display more of them"
      - "You must rebuild because fixed-k was baked in; the lesson is to precompute a slightly larger k than the UI needs for headroom"
      - "Switch to on-the-fly DFS over the trie subtree permanently, which is faster than reading a precomputed list and needs no rebuild"
      - "Add more serving replicas of the trie, which automatically raises the stored k from 5 to 10 as capacity is added to the fleet"
    answer: 1
    explanation: |
      Baking k into the precomputed lists means a UI change to top-10 forces a
      rebuild; storing extra headroom (e.g. top-20) avoids this. Top-5 lists don't
      contain 10 items, DFS per request is slower, and replicas don't change k.
    ref: "concepts.md#top-k-selection-and-weighting"
  - id: design-search-autocomplete-typeahead-075
    difficulty: advanced
    tags: [failure, query-of-death, circuit-breaker]
    question: |
      A pathological query (e.g. huge fuzzy distance, thousands of clauses) threatens
      to overload nodes. What is the appropriate protection?
    options:
      - "Serve the pathological query at any cost to guarantee completeness, since dropping any clause could return an incomplete result set"
      - "Reshard the entire cluster the moment such a query arrives, redistributing every prefix so the heavy query lands on a fresh empty node"
      - "Circuit-break and cap query complexity (max clauses, bounded fuzzy distance) and shed load, protecting the fleet from a query-of-death"
      - "Globally disable BM25 relevance scoring for all queries, since the pathological cost comes from computing term-frequency weights"
    answer: 2
    explanation: |
      Bounding query complexity and circuit-breaking prevents a single pathological
      query from taking down nodes. Serving it unbounded risks an outage, resharding
      per query is absurd, and disabling BM25 globally does not target the problem.
    ref: "concepts.md#failure-modes-and-graceful-degradation"
  - id: design-search-autocomplete-typeahead-076
    difficulty: expert
    tags: [scenario, consistency, materialized-view, judgment]
    question: |
      Reasoning about your search index as an "eventually-consistent materialized
      view of the source of truth" leads to which correct operational expectations?
    options:
      - "Reads always reflect the latest write instantly and atomically, because the index applies each source change synchronously before the originating transaction is acknowledged"
      - "The index and the database are updated together in a single distributed two-phase-commit transaction per write, so the two can never drift out of sync at all"
      - "The view can never be rebuilt once created, because the change log is consumed and discarded on ingestion, leaving no way to replay history into a fresh index"
      - "There is a bounded replication lag between source updates and index visibility; you monitor that lag, can rebuild the view by replaying the change log, and design UX to tolerate brief staleness"
    answer: 3
    explanation: |
      A materialized-view mental model implies bounded lag, monitorable freshness,
      rebuildability by replaying the log, and staleness-tolerant UX. It explicitly
      does NOT promise instant/atomic reflection or a per-write distributed
      transaction, and the view is rebuildable by design.
    ref: "concepts.md#indexing-pipeline-and-near-real-time-updates"
