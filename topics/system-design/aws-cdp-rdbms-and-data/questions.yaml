topic: "AWS Cloud Design Patterns: Relational Databases and Data Stores"
domain: system-design
topic_slug: aws-cdp-rdbms-and-data
version: 1
questions:
  - id: aws-cdp-rdbms-and-data-001
    difficulty: beginner
    tags: [db-replication, intent]
    question: |
      Which CDP data-tier pattern addresses the intent "keep the database's system of
      record available even if a whole Availability Zone fails"?
    options: ["Read Replica", "DB Replication", "Sharding Write", "Inmemory DB Cache"]
    answer: 1
    explanation: |
      DB Replication maintains a standby copy of the database in another AZ for
      durability and high availability. Read Replica is about read scaling, Sharding
      Write about write scaling, and Inmemory DB Cache about offloading hot reads.
    ref: "concepts.md#db-replication"

  - id: aws-cdp-rdbms-and-data-002
    difficulty: beginner
    tags: [db-replication, modern-mapping, rds]
    question: |
      The classic DB Replication pattern (hand-configured primary + standby on EC2 across
      two AZs) is realized today on AWS primarily by which managed feature?
    options:
      - "Amazon ElastiCache for Redis"
      - "S3 Cross-Region Replication"
      - "Amazon RDS Multi-AZ deployments"
      - "Amazon DynamoDB global tables"
    answer: 2
    explanation: |
      RDS Multi-AZ keeps a synchronous standby in another AZ and fails over automatically —
      exactly the classic DB Replication intent, now managed. ElastiCache is a cache,
      S3 CRR replicates object storage, and DynamoDB global tables are a NoSQL feature.
    ref: "concepts.md#db-replication"

  - id: aws-cdp-rdbms-and-data-003
    difficulty: intermediate
    tags: [db-replication, read-replica, distinction]
    question: |
      What is the key difference between the DB Replication pattern and the Read Replica
      pattern as they map onto RDS?
    options:
      - "DB Replication scales reads; Read Replica improves availability"
      - "They are two names for the same RDS feature"
      - "DB Replication (Multi-AZ) provides a non-readable standby for availability, while Read Replica provides readable async copies for read scaling"
      - "DB Replication is synchronous only in DynamoDB; Read Replica is Aurora-only"
    answer: 2
    explanation: |
      Multi-AZ's standby exists for failover and is not readable in the classic
      single-standby setup; read replicas are readable, asynchronous, and used to scale
      reads. Conflating them is the classic interview trap.
    ref: "concepts.md#db-replication"

  - id: aws-cdp-rdbms-and-data-004
    difficulty: intermediate
    tags: [db-replication, consistency, rpo]
    question: |
      RDS Multi-AZ uses synchronous replication to its standby. What is the main
      consequence of this design choice?
    options:
      - "Reads are served from the standby to double read throughput"
      - "The standby can be promoted only after a full snapshot restore"
      - "Writes are eventually consistent across AZs"
      - "Each commit waits for the standby, adding write latency but giving near-zero RPO within the Region"
    answer: 3
    explanation: |
      Synchronous replication means every commit is acknowledged by the standby before
      returning, which adds a little write latency but yields RPO near zero within the
      Region. The standby is not used to serve reads.
    ref: "concepts.md#db-replication"

  - id: aws-cdp-rdbms-and-data-005
    difficulty: advanced
    tags: [db-replication, cross-region, dr]
    question: |
      A team needs cross-Region disaster recovery for an Aurora MySQL cluster with
      sub-second replication lag and fast Regional failover. Which is the best fit?
    options:
      - "A single Multi-AZ instance in one Region"
      - "Aurora Global Database"
      - "An in-memory cache replicated across Regions"
      - "Application-level sharding across Regions"
    answer: 1
    explanation: |
      Aurora Global Database replicates to secondary Regions with typically <1s lag and
      supports cross-Region failover (RTO often under a minute). Multi-AZ is single-Region;
      caching and sharding do not provide cross-Region DR for the write tier.
    ref: "concepts.md#db-replication"

  - id: aws-cdp-rdbms-and-data-006
    difficulty: advanced
    type: multi
    tags: [db-replication, multi-az, aurora]
    question: |
      Which statements about the modern AWS realization of the DB Replication pattern are
      TRUE? Select all that apply.
    options:
      - "RDS Multi-AZ (single standby) keeps a synchronous standby that is not used to serve reads"
      - "Aurora replicates each write 6 ways across 3 Availability Zones at the storage layer"
      - "Multi-AZ increases read throughput proportional to the number of standbys"
      - "Cross-Region read replicas are asynchronous, so they carry a small RPO"
    answers: [0, 1, 3]
    explanation: |
      Correct: the classic single-standby Multi-AZ is synchronous and non-readable; Aurora
      uses a 6-way, 3-AZ storage quorum; cross-Region replicas are async and thus have a
      non-zero RPO. False: Multi-AZ does not add read capacity — that is the Read Replica
      pattern.
    ref: "concepts.md#db-replication"

  - id: aws-cdp-rdbms-and-data-007
    difficulty: intermediate
    tags: [db-replication, still-relevant]
    question: |
      When is the hand-rolled EC2 version of DB Replication (installing the engine and
      wiring native replication yourself) still justified over RDS/Aurora?
    options:
      - "When you run an engine, version, or replication topology that RDS does not support"
      - "Whenever you want automatic failover"
      - "When you need the lowest possible write latency"
      - "It is always preferred for cost reasons"
    answer: 0
    explanation: |
      The intent is timeless but the manual mechanism is superseded by RDS/Aurora. You
      self-manage on EC2 only when the managed service cannot run your engine/topology —
      then you also own failover.
    ref: "concepts.md#db-replication"

  - id: aws-cdp-rdbms-and-data-008
    difficulty: beginner
    tags: [read-replica, intent]
    question: |
      Analytics dashboards and report queries are slowing down the transactional workload
      on a single primary DB. Which CDP pattern directly addresses this?
    options: ["Sharding Write", "Read Replica", "DB Replication", "Inmemory DB Cache"]
    answer: 1
    explanation: |
      Read Replica offloads read traffic to asynchronous read-only copies, freeing the
      primary for writes. Sharding Write scales writes; DB Replication is DR/HA; caching
      helps only for repeated identical reads.
    ref: "concepts.md#read-replica"

  - id: aws-cdp-rdbms-and-data-009
    difficulty: beginner
    tags: [read-replica, modern-mapping]
    question: |
      The classic Read Replica pattern maps onto which modern AWS capability?
    options:
      - "AWS WAF in front of the database"
      - "An SQS queue between app and database"
      - "EBS snapshots on a schedule"
      - "RDS/Aurora read replicas fronted by a reader endpoint"
    answer: 3
    explanation: |
      RDS and Aurora provide managed read replicas; Aurora additionally exposes a reader
      endpoint that load-balances across them. WAF, SQS, and snapshots are unrelated to
      read scaling.
    ref: "concepts.md#read-replica"

  - id: aws-cdp-rdbms-and-data-010
    difficulty: intermediate
    tags: [read-replica, replica-lag, consistency]
    question: |
      A user updates their profile and, a moment later, sees the OLD value. Reads are
      routed to an asynchronous read replica. What is happening?
    options:
      - "The write was rolled back"
      - "The reader endpoint cached the response in memory"
      - "The primary failed over to the standby"
      - "Replica lag caused a read-your-writes violation — the replica had not yet applied the change"
    answer: 3
    explanation: |
      Async replicas are eventually consistent; an immediate read from a lagging replica
      can miss a just-committed write. Route read-after-write reads to the writer or use a
      consistency mechanism to avoid this.
    ref: "concepts.md#read-replica"

  - id: aws-cdp-rdbms-and-data-011
    difficulty: intermediate
    tags: [read-replica, read-your-writes, mitigation]
    question: |
      Which is a valid mitigation for a read-your-writes problem caused by replica lag?
    options:
      - "Delete all read replicas"
      - "Switch the database to Multi-AZ"
      - "Route read-after-write reads to the primary/writer endpoint"
      - "Increase the cache TTL"
    answer: 2
    explanation: |
      Routing the immediately-following read to the writer guarantees the user sees their
      own write. Deleting replicas removes read scaling; Multi-AZ is DR, not consistency;
      raising cache TTL makes staleness worse.
    ref: "concepts.md#read-replica"

  - id: aws-cdp-rdbms-and-data-012
    difficulty: advanced
    tags: [read-replica, aurora, lag]
    question: |
      Why does an Aurora replica typically have much lower replication lag than an
      engine-level (binlog) read replica?
    options:
      - "Aurora replicas run in the same process as the writer"
      - "Aurora disables durability to go faster"
      - "Aurora replicas share the same distributed storage volume as the writer instead of replaying a logical log"
      - "Aurora replicas are synchronous and block every commit"
    answer: 2
    explanation: |
      Aurora separates compute from a shared distributed storage layer, so replicas read
      the same volume rather than replaying binlog statements — lag is typically
      single-digit to tens of milliseconds. It is not synchronous and does not sacrifice
      durability.
    ref: "concepts.md#read-replica"

  - id: aws-cdp-rdbms-and-data-013
    difficulty: intermediate
    tags: [read-replica, scaling-limits]
    question: |
      A team keeps adding read replicas but write latency and write throughput are still
      the bottleneck. What is the correct conclusion?
    options:
      - "They need more read replicas"
      - "They should enable Multi-AZ to add write capacity"
      - "They should increase the cache TTL"
      - "Read replicas scale reads only; a write bottleneck needs the Sharding Write pattern (or a partitioned store)"
    answer: 3
    explanation: |
      Read replicas do nothing for write throughput. Scaling writes requires partitioning
      writes across databases (Sharding Write) or moving to a natively-partitioned store
      like DynamoDB.
    ref: "concepts.md#read-replica"

  - id: aws-cdp-rdbms-and-data-014
    difficulty: advanced
    type: multi
    tags: [read-replica, trade-offs]
    question: |
      Which statements about read replicas on RDS/Aurora are TRUE? Select all that apply.
    options:
      - "Replicas are eventually consistent and can serve stale data"
      - "An RDS read replica can be promoted to a standalone primary"
      - "Read replicas increase the primary's write throughput"
      - "Aurora exposes a reader endpoint that load-balances across replicas"
    answers: [0, 1, 3]
    explanation: |
      Correct: async replicas can be stale; RDS replicas are promotable; Aurora's reader
      endpoint balances connections across replicas. False: replicas relieve read load,
      not write throughput.
    ref: "concepts.md#read-replica"

  - id: aws-cdp-rdbms-and-data-015
    difficulty: intermediate
    tags: [read-replica, reader-endpoint, gotcha]
    question: |
      A single expensive query is hot-spotting one Aurora replica even though a reader
      endpoint is in use. Why can this happen?
    options:
      - "Aurora only ever uses one replica"
      - "The reader endpoint balances connections, not per-query load"
      - "Reader endpoints route all reads to the writer"
      - "The query must be running on the standby"
    answer: 1
    explanation: |
      The reader endpoint distributes new connections across replicas; it does not
      rebalance individual query load, so a heavy query on one connection can still
      hot-spot the replica it landed on.
    ref: "concepts.md#read-replica"

  - id: aws-cdp-rdbms-and-data-016
    difficulty: beginner
    tags: [inmemory-db-cache, intent]
    question: |
      Which CDP pattern targets "serve repeated identical hot read queries from memory so
      the database only sees the misses"?
    options: ["Inmemory DB Cache", "Read Replica", "DB Replication", "Sharding Write"]
    answer: 0
    explanation: |
      Inmemory DB Cache places an in-memory key-value cache in front of the DB to answer
      repeated hot reads without hitting the database. The other patterns address read
      scaling via replicas, availability, and write scaling respectively.
    ref: "concepts.md#inmemory-db-cache"

  - id: aws-cdp-rdbms-and-data-017
    difficulty: beginner
    tags: [inmemory-db-cache, modern-mapping]
    question: |
      The classic Inmemory DB Cache pattern (memcached on an EC2 instance in front of the
      DB) is realized today by which managed service?
    options:
      - "Amazon RDS Proxy"
      - "AWS Backup"
      - "Amazon ElastiCache"
      - "Amazon Route 53"
    answer: 2
    explanation: |
      ElastiCache (Redis/Valkey or Memcached) is the managed in-memory cache fronting
      RDS/Aurora. RDS Proxy pools connections, AWS Backup handles backups, and Route 53 is
      DNS — none is an in-memory query cache.
    ref: "concepts.md#inmemory-db-cache"

  - id: aws-cdp-rdbms-and-data-018
    difficulty: intermediate
    tags: [inmemory-db-cache, dax, dynamodb]
    question: |
      You want a managed, API-compatible in-memory cache specifically for DynamoDB with
      microsecond reads and no app-side cache logic. What do you use?
    options:
      - "ElastiCache for Memcached"
      - "DynamoDB Accelerator (DAX)"
      - "An RDS read replica"
      - "S3 with CloudFront"
    answer: 1
    explanation: |
      DAX is a fully managed, DynamoDB-API-compatible in-memory cache — the app talks to
      DAX with the same calls, getting microsecond reads. ElastiCache would require app-side
      cache-aside logic; the others are unrelated.
    ref: "concepts.md#inmemory-db-cache"

  - id: aws-cdp-rdbms-and-data-019
    difficulty: intermediate
    tags: [inmemory-db-cache, cache-aside]
    question: |
      In the cache-aside (lazy loading) strategy that the classic pattern describes, what
      happens on a cache miss?
    options:
      - "The application loads from the database, then populates the cache"
      - "The write is rejected until the cache warms up"
      - "The cache blocks all reads until the TTL expires"
      - "The database writes directly into the cache on every commit"
    answer: 0
    explanation: |
      Cache-aside: on a miss the app reads the DB and then stores the result in the cache
      (with a TTL). Only requested data is cached. Writing to cache and DB together on every
      write is write-through, a different strategy.
    ref: "concepts.md#inmemory-db-cache"

  - id: aws-cdp-rdbms-and-data-020
    difficulty: advanced
    tags: [inmemory-db-cache, write-through, cache-aside]
    question: |
      Which statement correctly contrasts cache-aside with write-through caching?
    options:
      - "Cache-aside always keeps the cache perfectly fresh; write-through cannot"
      - "Cache-aside caches only requested data but has cold-miss latency; write-through keeps data fresh but may cache never-read data and adds write latency"
      - "Write-through only works with DynamoDB; cache-aside only with RDS"
      - "They are identical apart from the service used"
    answer: 1
    explanation: |
      Cache-aside is memory-efficient (only hot data) but pays a cold-miss round trip;
      write-through keeps entries fresh at the cost of write latency and caching data that
      may never be read. Neither is engine-specific.
    ref: "concepts.md#inmemory-db-cache"

  - id: aws-cdp-rdbms-and-data-021
    difficulty: advanced
    tags: [inmemory-db-cache, stampede, gotcha]
    question: |
      A very popular cache key expires and hundreds of concurrent requests suddenly all
      miss and hit the database at once. What is this problem called?
    options:
      - "Read-your-writes violation"
      - "Thundering herd / cache stampede"
      - "Split brain"
      - "Hot shard"
    answer: 1
    explanation: |
      A thundering herd (cache stampede) is a burst of simultaneous misses on a hot key
      after expiry, hammering the backing store. Mitigations include request coalescing,
      staggered TTLs, or background refresh.
    ref: "concepts.md#inmemory-db-cache"

  - id: aws-cdp-rdbms-and-data-022
    difficulty: intermediate
    type: multi
    tags: [inmemory-db-cache, trade-offs]
    question: |
      Which are genuine challenges or trade-offs of the Inmemory DB Cache pattern? Select
      all that apply.
    options:
      - "Cache invalidation — stale entries after the underlying data changes"
      - "Thundering herd when a hot key expires"
      - "It automatically scales the database's write throughput"
      - "Write-through can waste memory caching data that is never read"
    answers: [0, 1, 3]
    explanation: |
      Correct: invalidation/staleness, cache stampedes, and write-through wasting memory are
      all real trade-offs. False: caching offloads reads and does nothing for write
      throughput.
    ref: "concepts.md#inmemory-db-cache"

  - id: aws-cdp-rdbms-and-data-023
    difficulty: beginner
    tags: [sharding-write, intent]
    question: |
      Which CDP pattern addresses "scale WRITE throughput past what a single primary
      database can handle"?
    options: ["Read Replica", "Inmemory DB Cache", "Sharding Write", "DB Replication"]
    answer: 2
    explanation: |
      Sharding Write partitions data across multiple independent databases, each accepting
      writes for its slice, so aggregate write throughput scales. Replicas and caches scale
      reads; DB Replication is availability.
    ref: "concepts.md#sharding-write"

  - id: aws-cdp-rdbms-and-data-024
    difficulty: intermediate
    tags: [sharding-write, mechanism, shard-key]
    question: |
      In the Sharding Write pattern, how is a given row assigned to a particular database?
    options:
      - "By the reader endpoint's load balancer"
      - "Randomly on each write with no fixed mapping"
      - "By the cache TTL"
      - "By a shard key (e.g. hash or range of a key) that maps the row to one shard"
    answer: 3
    explanation: |
      Each row is placed on a shard chosen from a shard key — a hash or range of some
      attribute (e.g. user_id). The router uses the same function to find the row again.
    ref: "concepts.md#sharding-write"

  - id: aws-cdp-rdbms-and-data-025
    difficulty: advanced
    tags: [sharding-write, modern-mapping, dynamodb]
    question: |
      What is the modern AWS "default" answer when a workload needs to scale writes far
      beyond a single writer and does not strictly require rich relational features?
    options:
      - "Add more RDS read replicas"
      - "Use a natively-partitioned store like DynamoDB rather than hand-shard a relational DB"
      - "Enable Multi-AZ"
      - "Put ElastiCache in front of the writer"
    answer: 1
    explanation: |
      DynamoDB partitions writes automatically by partition key across many nodes —
      effectively managed sharding — so the modern move is often to pick a partitioned store
      instead of hand-rolling relational sharding. Replicas, Multi-AZ, and caching do not add
      write capacity.
    ref: "concepts.md#sharding-write"

  - id: aws-cdp-rdbms-and-data-026
    difficulty: advanced
    tags: [sharding-write, aurora, single-writer]
    question: |
      Why does simply moving to Amazon Aurora NOT by itself remove the need to shard a
      write-bound relational workload?
    options:
      - "Aurora caps storage at 1 GB"
      - "Aurora still has a single logical writer per cluster, so the write path is one instance"
      - "Aurora cannot have read replicas"
      - "Aurora is read-only"
    answer: 1
    explanation: |
      Aurora scales storage and reads well, but each cluster still has a single writer
      (write-forwarding and Serverless v2 help but the write path is one logical writer).
      A truly write-bound workload eventually needs partitioning across clusters or a
      partitioned store.
    ref: "concepts.md#sharding-write"

  - id: aws-cdp-rdbms-and-data-027
    difficulty: advanced
    type: multi
    tags: [sharding-write, trade-offs]
    question: |
      Which are real drawbacks of application-level relational Sharding Write? Select all
      that apply.
    options:
      - "Cross-shard JOINs and transactions become application problems"
      - "A poor shard key can create hot shards"
      - "It eliminates the need to back up or patch databases"
      - "Resharding/rebalancing is painful once the system is live"
    answers: [0, 1, 3]
    explanation: |
      Correct: cross-shard queries/transactions, hot shards from bad keys, and painful live
      resharding are all real costs. False: sharding multiplies operational surface (N
      clusters to patch, back up, and monitor), it does not remove it.
    ref: "concepts.md#sharding-write"

  - id: aws-cdp-rdbms-and-data-028
    difficulty: intermediate
    tags: [sharding-write, hot-shard]
    question: |
      A team sharded by "signup_month" and now the current month's shard is overloaded
      while older shards sit idle. What went wrong?
    options:
      - "The reader endpoint is misconfigured"
      - "The shard key produces uneven load — a hot shard"
      - "They need a bigger cache TTL"
      - "Multi-AZ failed over incorrectly"
    answer: 1
    explanation: |
      A shard key that concentrates active data (like current month) creates a hot shard.
      A good shard key spreads writes evenly across shards, e.g. a hash of a
      high-cardinality attribute.
    ref: "concepts.md#sharding-write"

  - id: aws-cdp-rdbms-and-data-029
    difficulty: intermediate
    tags: [sharding-write, scale-up-first]
    question: |
      Before hand-sharding a relational database on AWS, what is usually the first,
      lower-effort step to try?
    options:
      - "Immediately split into 16 shards"
      - "Scale up to a larger instance class (and lean on Aurora's storage/IOPS scaling)"
      - "Delete the read replicas"
      - "Move all reads to a cache and hope writes drop"
    answer: 1
    explanation: |
      Vertical scale-up plus Aurora's auto-scaling storage and high write IOPS often defers
      sharding for a long time. Sharding is operationally heavy and should be a later resort.
    ref: "concepts.md#sharding-write"

  - id: aws-cdp-rdbms-and-data-030
    difficulty: intermediate
    tags: [pattern-selection, reads-vs-writes]
    question: |
      Which single pattern among the four in this topic scales WRITE throughput?
    options:
      - "DB Replication"
      - "Read Replica"
      - "Inmemory DB Cache"
      - "Sharding Write"
    answer: 3
    explanation: |
      Only Sharding Write scales writes. DB Replication scales availability; Read Replica
      and Inmemory DB Cache scale reads.
    ref: "concepts.md#sharding-write"

  - id: aws-cdp-rdbms-and-data-031
    difficulty: advanced
    type: multi
    tags: [pattern-selection, mapping]
    question: |
      Match the intent to the pattern: which of these classic-intent → pattern pairings are
      correct? Select all that apply.
    options:
      - "Survive an AZ failure with a hot standby → DB Replication"
      - "Offload analytics/report reads → Read Replica"
      - "Serve repeated hot queries from memory → Inmemory DB Cache"
      - "Scale reads by partitioning rows across databases → Sharding Write"
    answers: [0, 1, 2]
    explanation: |
      Correct: DB Replication for AZ survival, Read Replica for offloading reads, Inmemory DB
      Cache for hot repeated reads. False: Sharding Write partitions rows to scale WRITES, not
      reads.
    ref: "concepts.md#sharding-write"

  - id: aws-cdp-rdbms-and-data-032
    difficulty: intermediate
    tags: [pattern-selection, scenario, caching]
    question: |
      A product-detail page issues the same read query millions of times a day and the DB
      CPU is dominated by these identical reads. Which pattern gives the biggest, cheapest
      win first?
    options:
      - "Sharding Write"
      - "Inmemory DB Cache"
      - "DB Replication"
      - "Cross-Region read replica"
    answer: 1
    explanation: |
      Repeated identical reads are the ideal cache target — an in-memory cache (ElastiCache)
      absorbs them with sub-millisecond latency and slashes DB load. Sharding and cross-Region
      replicas add cost/complexity without targeting the repeated-read pattern.
    ref: "concepts.md#inmemory-db-cache"

  - id: aws-cdp-rdbms-and-data-033
    difficulty: advanced
    tags: [pattern-selection, scenario, combined]
    question: |
      A read-heavy app also cannot tolerate stale data on the account-balance screen but
      is fine with stale product listings. Which combination is most appropriate?
    options:
      - "Route balance reads to the writer; serve product listings from read replicas and/or a cache"
      - "Send all reads to read replicas regardless of freshness"
      - "Cache the account balance with a long TTL"
      - "Shard the database by balance value"
    answer: 0
    explanation: |
      Strong-consistency reads (balance) go to the writer; tolerant reads (listings) go to
      replicas or a cache. Serving balances from lagging replicas or a long-TTL cache risks
      stale money values; sharding by balance is nonsensical.
    ref: "concepts.md#read-replica"

  - id: aws-cdp-rdbms-and-data-034
    difficulty: intermediate
    tags: [pattern-selection, scenario, dr]
    question: |
      Requirement: the system of record must survive an entire Region outage with RPO of a
      few seconds. Which pattern/mapping fits best?
    options:
      - "Read Replica within one AZ"
      - "DB Replication realized as Aurora Global Database (cross-Region)"
      - "Inmemory DB Cache with write-through"
      - "Sharding Write across two AZs"
    answer: 1
    explanation: |
      Cross-Region durability with a few-seconds RPO is the DB Replication intent at Regional
      scale — Aurora Global Database. Single-AZ replicas, caches, and sharding do not provide
      Regional DR.
    ref: "concepts.md#db-replication"

  - id: aws-cdp-rdbms-and-data-035
    difficulty: advanced
    tags: [sharding-write, when-relational]
    question: |
      When is hand-rolled relational Sharding Write (rather than moving to DynamoDB) still
      the right call?
    options:
      - "When the workload must stay relational (rich JOINs, strong multi-row ACID) and has outgrown a single writer"
      - "Whenever write volume is even slightly high"
      - "When you want to avoid managing any infrastructure"
      - "When reads are the only bottleneck"
    answer: 0
    explanation: |
      Sharding a relational DB is justified when relational features are mandatory and a
      single writer is genuinely exhausted. If relational semantics are not essential, a
      natively-partitioned store like DynamoDB is the lower-effort modern choice.
    ref: "concepts.md#sharding-write"

  - id: aws-cdp-rdbms-and-data-036
    difficulty: beginner
    tags: [read-replica, promotion]
    question: |
      A standalone copy of the production database is needed in a new Region as its own
      writable primary. Which RDS capability supports this?
    options:
      - "Enabling Multi-AZ"
      - "Attaching an ElastiCache cluster"
      - "Promoting a read replica to a standalone primary"
      - "Creating an EBS snapshot"
    answer: 2
    explanation: |
      An RDS read replica (including a cross-Region one) can be promoted to become an
      independent writable primary. Multi-AZ, caching, and snapshots do not create a new
      writable primary endpoint.
    ref: "concepts.md#read-replica"

  - id: aws-cdp-rdbms-and-data-037
    difficulty: intermediate
    tags: [inmemory-db-cache, invalidation]
    question: |
      Which technique bounds how stale a cache-aside entry can become?
    options:
      - "Setting a TTL on cached entries (and/or invalidating on write)"
      - "Increasing the number of read replicas"
      - "Enabling Multi-AZ failover"
      - "Sharding the cache by balance"
    answer: 0
    explanation: |
      A TTL caps how long a stale entry can live; explicit invalidation on write removes it
      sooner. Replicas, Multi-AZ, and sharding do not address cache staleness.
    ref: "concepts.md#inmemory-db-cache"

  - id: aws-cdp-rdbms-and-data-038
    difficulty: advanced
    type: multi
    tags: [modern-mapping, classic-vs-modern]
    question: |
      Which classic-CDP → modern-AWS mappings for the data tier are correct? Select all that
      apply.
    options:
      - "Hand-configured primary/standby on EC2 → RDS Multi-AZ / Aurora"
      - "memcached on EC2 in front of the DB → ElastiCache (or DAX for DynamoDB)"
      - "Manual binlog read replicas on EC2 → RDS/Aurora managed read replicas"
      - "Application-level relational sharding → a single managed 'sharded RDS' button"
    answers: [0, 1, 2]
    explanation: |
      Correct: Multi-AZ/Aurora, ElastiCache/DAX, and managed read replicas are the modern
      realizations. False: there is no single managed sharded-RDS button — relational
      sharding remains an app-level design (or you adopt DynamoDB).
    ref: "concepts.md#sharding-write"

  - id: aws-cdp-rdbms-and-data-039
    difficulty: intermediate
    tags: [db-replication, multi-az-cluster]
    question: |
      Compared with the classic single-standby Multi-AZ, what does an RDS Multi-AZ DB
      cluster (two readable standbys) additionally offer?
    options:
      - "Faster failover (~35s) and standbys that can also serve reads"
      - "Cross-Region replication only"
      - "Automatic sharding of writes"
      - "In-memory caching of query results"
    answer: 0
    explanation: |
      The Multi-AZ DB cluster adds two readable standbys and faster failover (~35s vs the
      60–120s of a single-standby instance). It does not shard writes or cache queries.
    ref: "concepts.md#db-replication"

  - id: aws-cdp-rdbms-and-data-040
    difficulty: intermediate
    tags: [inmemory-db-cache, engine-choice]
    question: |
      For an in-memory cache that also needs replication, persistence, and richer data
      structures (sorted sets, lists), which ElastiCache engine fits better than Memcached?
    options:
      - "ElastiCache for Redis/Valkey"
      - "ElastiCache for Memcached"
      - "There is no difference between them"
      - "Neither supports replication"
    answer: 0
    explanation: |
      Redis/Valkey add replication, persistence, and rich data structures; Memcached is a
      simpler multi-threaded key-value cache without those features. The intent (in-memory
      DB cache) is the same; the engine choice depends on feature needs.
    ref: "concepts.md#inmemory-db-cache"

  - id: aws-cdp-rdbms-and-data-041
    difficulty: advanced
    tags: [sharding-write, cross-shard-txn]
    question: |
      After sharding, an operation must atomically update rows that live on two different
      shards. What does this typically require?
    options:
      - "Nothing — cross-shard writes are automatically atomic"
      - "Enabling Multi-AZ"
      - "A larger cache"
      - "A distributed-transaction or saga pattern implemented by the application"
    answer: 3
    explanation: |
      A single ACID transaction cannot span independent shards, so atomicity across shards
      must be coordinated by the application via distributed transactions or a saga/compensation
      pattern. This is a core cost of sharding.
    ref: "concepts.md#sharding-write"

  - id: aws-cdp-rdbms-and-data-042
    difficulty: intermediate
    tags: [pattern-selection, distinction]
    question: |
      Which statement about read replicas vs Multi-AZ is correct?
    options:
      - "Both increase write throughput"
      - "Read replicas scale reads (async, readable); Multi-AZ provides availability (sync standby, classically non-readable)"
      - "Multi-AZ is for read scaling and read replicas for DR"
      - "They are the same feature with different names"
    answer: 1
    explanation: |
      Read replicas are asynchronous, readable, and used for read scaling; the classic
      Multi-AZ standby is synchronous and exists for failover. Neither increases write
      throughput.
    ref: "concepts.md#read-replica"

  - id: aws-cdp-rdbms-and-data-043
    difficulty: beginner
    tags: [read-replica, aurora-limit]
    question: |
      Up to how many Aurora replicas can share a cluster's storage volume and be balanced
      behind the reader endpoint?
    options: ["Up to 15", "Exactly 1", "Up to 100", "Unlimited"]
    answer: 0
    explanation: |
      Aurora supports up to 15 replicas per cluster, all reading the same distributed
      storage volume and reachable through the reader endpoint. This is a common
      capacity-planning detail in interviews.
    ref: "concepts.md#read-replica"

  - id: aws-cdp-rdbms-and-data-044
    difficulty: advanced
    tags: [inmemory-db-cache, dax-vs-elasticache]
    question: |
      Why is DAX often preferred over ElastiCache specifically for caching DynamoDB reads?
    options:
      - "DAX is DynamoDB-API-compatible, so no app-side cache-aside logic is needed"
      - "ElastiCache cannot store any DynamoDB data"
      - "DAX also scales DynamoDB write throughput"
      - "ElastiCache only works with RDS and cannot be used at all"
    answer: 0
    explanation: |
      DAX speaks the DynamoDB API, so the application uses the same calls and gets
      transparent microsecond-latency caching without writing cache-aside logic. It is a
      read/query cache and does not add write throughput.
    ref: "concepts.md#inmemory-db-cache"

  - id: aws-cdp-rdbms-and-data-045
    difficulty: advanced
    type: multi
    tags: [pattern-selection, combined-architecture]
    question: |
      A read-heavy relational app on AWS wants both high availability and read scaling with
      minimal stale-read surprises. Which choices are sound? Select all that apply.
    options:
      - "Use Multi-AZ for automatic failover / availability"
      - "Use read replicas (reader endpoint) to offload read traffic"
      - "Route read-after-write reads to the writer to avoid stale reads"
      - "Rely on read replicas alone to survive an AZ failure of the writer"
    answers: [0, 1, 2]
    explanation: |
      Correct: Multi-AZ for HA, read replicas for read scaling, and writer-routing for
      read-after-write consistency compose well. False: read replicas are for scaling, not a
      substitute for Multi-AZ failover of the writer — availability is DB Replication's job.
    ref: "concepts.md#read-replica"

  - id: aws-cdp-rdbms-and-data-046
    difficulty: advanced
    type: multi
    tags: [sharding-write, dynamodb, modern-mapping]
    question: |
      Which statements about scaling writes on AWS today are TRUE? Select all that apply.
    options:
      - "DynamoDB automatically partitions writes across nodes by partition key"
      - "There is no single managed 'sharded RDS' button — relational sharding is an app-level design"
      - "Adding read replicas increases the primary's write capacity"
      - "Scaling up the instance class first often defers the need to shard"
    answers: [0, 1, 3]
    explanation: |
      Correct: DynamoDB shards writes by partition key as a managed feature; relational
      sharding remains an application design; and vertical scale-up commonly defers sharding.
      False: read replicas relieve read load only, never write throughput.
    ref: "concepts.md#sharding-write"

  - id: aws-cdp-rdbms-and-data-047
    difficulty: intermediate
    type: multi
    tags: [inmemory-db-cache, modern-mapping, dax]
    question: |
      Which are accurate modern realizations of the Inmemory DB Cache pattern on AWS?
      Select all that apply.
    options:
      - "ElastiCache for Redis/Valkey fronting RDS/Aurora"
      - "DAX as an API-compatible cache for DynamoDB"
      - "ElastiCache for Memcached as a simple key-value cache"
      - "AWS Backup as an in-memory query cache"
    answers: [0, 1, 2]
    explanation: |
      Correct: ElastiCache (Redis/Valkey or Memcached) and DAX are the managed in-memory
      caching options. False: AWS Backup is a backup/restore service, not a cache.
    ref: "concepts.md#inmemory-db-cache"

  - id: aws-cdp-rdbms-and-data-048
    difficulty: advanced
    type: multi
    tags: [pattern-selection, distinction]
    question: |
      Which of the following correctly describe what a pattern does NOT do? Select all that
      apply.
    options:
      - "Read Replica does not increase write throughput"
      - "Inmemory DB Cache does not scale write throughput"
      - "DB Replication (single-standby Multi-AZ) does not add read capacity"
      - "Sharding Write does not help with write scaling"
    answers: [0, 1, 2]
    explanation: |
      Correct: read replicas and caches scale reads (not writes), and single-standby Multi-AZ
      does not add read capacity. False: Sharding Write's entire purpose is to scale write
      throughput by partitioning writes across databases.
    ref: "concepts.md#sharding-write"
