topic: "System Design Interview Method and Scenario Playbooks"
domain: system-design
topic_slug: interview-method-scenario-playbooks
version: 1
questions:
  - id: interview-method-scenario-playbooks-001
    difficulty: beginner
    tags: [method, requirements, functional-nonfunctional]
    question: |
      In a system design interview, which of the following is a NON-functional
      requirement rather than a functional one?
    options:
      - "The system serves timeline reads within 200 ms at p99 for 300M DAU"
      - "Users can post a message and read the timelines of accounts they follow"
      - "Users can follow, unfollow, and block other users across the platform"
      - "Users can upload a profile photo and edit their display name and bio"
    answer: 0
    explanation: |
      Non-functional requirements describe *properties* (scale, latency, availability,
      consistency, durability, cost) rather than *behaviors*. "200 ms p99 for 300M DAU"
      is a latency/scale property. The others are functional verbs (what the system
      does). NFRs typically drive the architecture more than FRs do.
    ref: "concepts.md#scoping-requirements-functional-versus-non-functional"

  - id: interview-method-scenario-playbooks-002
    difficulty: beginner
    tags: [method, anti-patterns]
    question: |
      Which behavior most lowers a candidate's signal in a system design interview?
    options:
      - "Stating assumptions explicitly and asking clarifying questions about scope early"
      - "Immediately naming a specific tech stack (Kafka + Cassandra + Redis) before scoping the problem"
      - "Doing back-of-the-envelope QPS and storage estimates before choosing a datastore"
      - "Following the interviewer's steer to focus deeply on one critical component"
    answer: 1
    explanation: |
      Jumping to a solution (naming a stack before understanding requirements) is a
      classic anti-pattern: it optimizes for a tool rather than the requirement. The
      other three are exactly the behaviors interviewers reward.
    ref: "concepts.md#common-anti-patterns"

  - id: interview-method-scenario-playbooks-003
    difficulty: beginner
    tags: [estimation, qps]
    question: |
      As a quick mental estimate, roughly how many average QPS is 1 million requests
      per day?
    options:
      - "~120 QPS"
      - "~1,200 QPS"
      - "~12 QPS"
      - "~0.5 QPS"
    answer: 2
    explanation: |
      A day is ~86,400 s ≈ 10^5 s. 1,000,000 / 100,000 ≈ 10-12 QPS. This is a memorized
      anchor: 1M/day ≈ ~12 QPS average. Peak is then a multiple (2-10x) of that.
    ref: "concepts.md#back-of-the-envelope-estimation"

  - id: interview-method-scenario-playbooks-004
    difficulty: intermediate
    tags: [method, loop, ordering]
    question: |
      Why does the recommended loop define the API contract and data model BEFORE
      drawing the high-level box-and-arrow diagram?
    options:
      - "Because interviewers always grade the API surface more heavily than the architecture, so pinning endpoints first maximizes your score on the rubric"
      - "Because API signatures are faster to sketch than box-and-arrow diagrams, letting you cover more of the design within the limited interview time"
      - "Because the data model becomes irrelevant once the high-level diagram exists, so it is only worth writing down as an afterthought at the very end"
      - "Because the API forces concrete scope and the data model's access patterns determine the storage choice, so drawing boxes first tends to pick a database by reflex"
    answer: 3
    explanation: |
      Writing the endpoint forces you to pin scope, and the *access patterns* in the data
      model (point lookup vs range scan vs join, read:write ratio, consistency need)
      determine the storage engine. Boxes-first leads to reflexive choices ("I'll use
      Postgres") instead of requirement-driven ones.
    ref: "concepts.md#api-and-data-model-first"

  - id: interview-method-scenario-playbooks-005
    difficulty: intermediate
    tags: [estimation, twitter, read-write-ratio]
    question: |
      A Twitter-like service has ~300M DAU each reading their timeline ~10x/day and
      posting ~0.1x/day. What does the resulting read:write ratio most directly imply
      about the design?
    options:
      - "Reads dominate (~100:1), so precompute timelines (fanout-on-write) and cache heavily"
      - "Writes dominate, so optimize for write throughput with an LSM store"
      - "The ratio is roughly balanced, so a single relational primary with no caching layer easily suffices"
      - "The ratio is irrelevant to the design because both per-user counts are small numbers on their own"
    answer: 0
    explanation: |
      3B reads vs 30M writes/day is ~100:1 read-heavy. That pushes you to optimize the
      read path: precompute per-user timelines on write (fanout-on-write) and cache,
      rather than assembling timelines at read time for the common case.
    ref: "concepts.md#back-of-the-envelope-estimation"

  - id: interview-method-scenario-playbooks-006
    difficulty: intermediate
    tags: [tail-latency, fanout]
    question: |
      A request fans out to 100 independent backend calls, each with a p99 latency of
      100 ms (1% chance of being slow). Approximately what fraction of requests will
      experience at least one slow call?
    options:
      - "~1%"
      - "~63%"
      - "~10%"
      - "~99%"
    answer: 1
    explanation: |
      P(all fast) = 0.99^100 ≈ 0.366, so P(at least one slow) ≈ 1 - 0.366 ≈ 63%. This is
      the core "Tail at Scale" insight: with high fan-out, the component p99 becomes the
      aggregate median. Mitigate with hedged/tied requests and reduced fan-out.
    ref: "concepts.md#latency-numbers-every-engineer-should-know"

  - id: interview-method-scenario-playbooks-007
    difficulty: intermediate
    tags: [latency-numbers, cross-region]
    question: |
      Given typical latency numbers, which statement is a correct design implication?
    options:
      - "A cross-continent round trip (~150 ms) is cheap enough to do N times synchronously per request"
      - "Main memory access and a spinning HDD disk seek are within roughly the same order of magnitude, so caching in RAM buys little"
      - "A cross-region round trip (~150 ms) can dominate a request, so you cannot make many synchronous cross-region calls per request"
      - "An intra-datacenter round trip (~0.5 ms) is slower than sequentially reading 1 MB from a local disk, so network calls should be avoided"
    answer: 2
    explanation: |
      Memory (~100 ns) is ~100,000x faster than an HDD seek (~10 ms); intra-DC RTT
      (~0.5 ms) is far faster than an HDD read. A ~150 ms cross-region RTT dominates, so
      you must avoid multiple synchronous cross-region hops per request.
    ref: "concepts.md#latency-numbers-every-engineer-should-know"

  - id: interview-method-scenario-playbooks-008
    difficulty: advanced
    tags: [littles-law, capacity]
    question: |
      A service receives 10,000 req/s and each request holds a worker thread for 20 ms.
      By Little's Law, roughly how many concurrent requests are in flight, and what does
      it tell you?
    options:
      - "2,000 concurrent — the system needs at least 2,000 worker threads provisioned"
      - "50 concurrent — request latency is irrelevant to the concurrency in flight"
      - "10,000 concurrent — exactly one thread is held per request arriving each second"
      - "200 concurrent — size thread/connection pools to ~200 plus headroom"
    answer: 3
    explanation: |
      L = λ × W = 10,000 /s × 0.020 s = 200 in flight. Size pools/provisioned concurrency
      to ~200 plus headroom. It also shows that reducing latency (W) reduces required
      concurrency and cost, and that a latency spike silently inflates concurrency until
      pools exhaust — a common cascading-failure trigger.
    ref: "concepts.md#identifying-bottlenecks-and-scaling-iteratively"

  - id: interview-method-scenario-playbooks-009
    difficulty: advanced
    tags: [feed, fanout, tradeoff]
    question: |
      For a read-heavy social feed, what is the primary trade-off between fanout-on-write
      (push) and fanout-on-read (pull), and why do large systems use a hybrid?
    options:
      - "Push makes reads O(1) but writes O(followers); pull makes writes O(1) but reads expensive — hybrid pushes for normal users and pulls for celebrities to avoid write storms"
      - "Push and pull have identical read and write cost at any scale; the hybrid is adopted only to simplify the codebase and reduce the total number of independently deployed services in the fleet"
      - "Pull makes reads O(1) while push makes reads expensive per follower — the hybrid exists purely to reduce the total storage footprint of precomputed timelines"
      - "Push is always strictly superior for both reads and writes at every scale, and hybrid designs survive today only for legacy compatibility with older feed pipelines built years ago"
    answer: 0
    explanation: |
      Fanout-on-write precomputes each follower's timeline: cheap reads, but a post by a
      celebrity with millions of followers causes a write storm. Fanout-on-read merges at
      query time: cheap writes, expensive reads. Hybrids push for normal users and pull
      for celebrities, merging at read time.
    ref: "concepts.md#playbook-news-feed-and-twitter-timeline"

  - id: interview-method-scenario-playbooks-010
    difficulty: advanced
    tags: [retries, cascading-failure, amplification]
    question: |
      A healthy backend suddenly slows down. Each client retries up to 3 times on
      timeout. What is the danger, and the standard mitigation?
    options:
      - "Retries actually reduce the offered load by naturally spreading requests over time, so no special mitigation is needed during the slowdown and the backend will recover unaided"
      - "Retries can multiply load ~3-4x exactly when the system is weakest (retry amplification); mitigate with exponential backoff + jitter, retry budgets, and circuit breakers"
      - "Retries only affect perceived latency and never the offered load, so the correct response is simply to increase client timeouts instead"
      - "The only viable fix is to add more backend servers immediately during the incident to absorb the extra retry traffic as it arrives"
    answer: 1
    explanation: |
      Naive retries create a storm that adds ~3-4x load at the worst moment, driving
      cascading failure. Standard defenses: exponential backoff with jitter, retry
      budgets/token buckets capping retries to a small fraction of traffic, circuit
      breakers, and load shedding. Adding capacity mid-incident often fails because the
      control plane is itself overloaded.
    ref: "concepts.md#failure-modes-and-trade-offs"

  - id: interview-method-scenario-playbooks-011
    difficulty: expert
    tags: [metastable-failure, overload]
    question: |
      A cluster was overloaded by a brief traffic spike. The spike ended minutes ago, yet
      the cluster stays saturated and unavailable even though offered load is now normal.
      What is happening and what is the correct response?
    options:
      - "This is a normal warm-up period after the spike; simply wait and the cluster will steadily drain its queues and fully recover on its own within a few minutes without any operator intervention at all"
      - "The database has been corrupted by the traffic spike; the correct response is to fail over to a standby and restore the entire dataset from the most recent backup before resuming traffic"
      - "A metastable failure: a self-sustaining feedback loop (e.g., retries caused by overload causing more overload) keeps the system in a bad stable state; break the loop by shedding load / disabling retries / draining queues rather than adding capacity"
      - "Add more nodes immediately — insufficient provisioned capacity is the only possible cause of persistent saturation that continues long after a triggering spike has already passed"
    answer: 2
    explanation: |
      This is a metastable failure (Bronson et al.): the trigger is gone but a feedback
      loop (retries, cache misses, queue backlog) sustains overload. Adding capacity often
      just feeds the loop. The fix is to break the loop — shed load, disable/curb retries,
      drain queues — then recover.
    ref: "concepts.md#failure-modes-and-trade-offs"

  - id: interview-method-scenario-playbooks-012
    difficulty: advanced
    tags: [payments, idempotency, exactly-once]
    question: |
      A payments API must never double-charge even when clients retry after a timeout.
      What is the standard mechanism?
    options:
      - "Rely on TCP's reliable-delivery guarantee to ensure the charge request arrives at the server exactly once even across retries"
      - "Make the charge endpoint fast enough that client timeouts never fire, so retries are never triggered and duplicates cannot occur"
      - "Use a two-phase commit protocol spanning the client, the payment service, and the bank so the charge either fully commits or fully aborts"
      - "Use a client-supplied idempotency key persisted with the first result, so retries return the original outcome instead of charging again"
    answer: 3
    explanation: |
      Exactly-once *delivery* is impossible over an unreliable network, so you achieve
      exactly-once *effect*: persist the outcome keyed by a client idempotency key; a
      retry with the same key returns the stored result. TCP does not survive
      client/server restarts, and speed doesn't eliminate retries.
    ref: "concepts.md#playbook-payment-and-idempotent-charge"

  - id: interview-method-scenario-playbooks-013
    difficulty: expert
    tags: [2pc, saga, availability]
    question: |
      Why do high-scale payment/order systems typically prefer sagas with compensating
      actions over a distributed two-phase commit (2PC) across services?
    options:
      - "2PC's coordinator is a single point of failure and participants block holding locks if it crashes mid-commit, hurting availability; sagas trade atomicity for availability using compensating transactions"
      - "2PC has strictly lower commit latency at scale, but sagas are chosen simply because they are easier for engineers to code and require fewer moving parts to operate in production"
      - "Sagas provide strictly stronger transaction isolation than 2PC, preventing any intermediate state from ever being observed by concurrent readers even in the middle of a multi-step flow"
      - "2PC is architecturally limited to coordinating exactly two participating services at once, whereas sagas can chain together an arbitrary number of downstream services in a single workflow"
    answer: 0
    explanation: |
      In 2PC, after voting to commit, participants hold locks and block until the
      coordinator decides; if the coordinator crashes, they can block indefinitely — a
      SPOF and availability killer at scale. Sagas break the flow into local transactions
      with compensating actions, trading global atomicity/isolation for availability.
    ref: "concepts.md#playbook-payment-and-idempotent-charge"

  - id: interview-method-scenario-playbooks-014
    difficulty: advanced
    tags: [outbox, cdc, dual-write]
    question: |
      A service must update its database AND publish an event for each order. Writing to
      the DB and then to Kafka separately risks inconsistency. What pattern fixes this?
    options:
      - "Wrap both the database write and the Kafka publish in a single distributed XA transaction so they commit or roll back atomically together"
      - "Write the event to an outbox table in the same DB transaction as the state change, then publish it via change-data-capture (CDC) or a poller"
      - "Publish the event to Kafka first and only update the database afterward, so a crash can never leave the event unpublished"
      - "Retry the Kafka publish with backoff until it eventually succeeds, which fully closes the window between the two separate writes"
    answer: 1
    explanation: |
      The dual-write problem: a crash between the two writes leaves them inconsistent. The
      outbox pattern writes the event into an outbox table within the same local
      transaction as the state change (atomic), then a CDC pipeline or poller reliably
      publishes it. Distributed transactions over Kafka are impractical, and ordering the
      writes doesn't remove the failure window.
    ref: "concepts.md#playbook-payment-and-idempotent-charge"

  - id: interview-method-scenario-playbooks-015
    difficulty: advanced
    tags: [rate-limiter, algorithms]
    question: |
      Which rate-limiting algorithm allows controlled bursts up to a capacity while
      enforcing an average rate, and is the common default for API limiting?
    options:
      - "Fixed window counter"
      - "Sliding window log"
      - "Token bucket"
      - "Simple per-second counter reset"
    answer: 2
    explanation: |
      Token bucket refills tokens at the average rate and allows bursts up to the bucket
      capacity — the standard choice for API rate limiting. Fixed window suffers 2x bursts
      at window edges; sliding window log is exact but stores every timestamp (memory
      heavy).
    ref: "concepts.md#playbook-rate-limiter"

  - id: interview-method-scenario-playbooks-016
    difficulty: expert
    tags: [rate-limiter, distributed, tradeoff]
    question: |
      You must enforce a global rate limit across 50 stateless API nodes. What is the key
      trade-off between a central Redis counter (atomic INCR/Lua) and purely local
      per-node limits?
    options:
      - "Local per-node limits are always strictly more accurate than a central store because each node counts its own traffic without any network delay, giving a precise global total for free"
      - "Both approaches give identical global accuracy and performance under load, so the choice between a central counter and local limits is purely a matter of team preference and coding style"
      - "A central Redis counter cannot be made atomic across many concurrent nodes even with Lua scripts, so it is never used for enforcing a genuinely global rate limit across a fleet in practice"
      - "A central store is accurate but adds a network hop and can become a coordination bottleneck/SPOF; local limits are fast but let up to N×limit through since each node counts independently"
    answer: 3
    explanation: |
      Central Redis with atomic INCR+TTL (or Lua) gives an accurate global count but adds
      latency and a coordination bottleneck/SPOF. Local per-node buckets are fast and
      resilient but allow up to N×limit aggregate because nodes don't share state. You
      often must also decide fail-open vs fail-closed if the store is down.
    ref: "concepts.md#playbook-rate-limiter"

  - id: interview-method-scenario-playbooks-017
    difficulty: advanced
    tags: [url-shortener, key-generation]
    question: |
      For a URL shortener, what is the trade-off between generating codes by base62-encoding
      an auto-increment counter versus using a random/hash value with a collision check?
    options:
      - "The counter yields short dense codes but needs a distributed counter and can leak volume; random/hash needs no ordering coordination but requires collision detection (read-before-write) or longer codes"
      - "The counter approach needs no cross-node coordination whatsoever and never leaks creation volume or ordering, so it is strictly better than random generation on every axis that matters"
      - "Random or hash-based values always produce meaningfully shorter codes than counter-based base62 encoding for the same total number of stored URLs, so they save space by default"
      - "Both approaches require acquiring a synchronous global lock on every single write, so neither offers any coordination or throughput advantage over the other in a distributed deployment"
    answer: 0
    explanation: |
      Counter/base62 gives compact, dense codes but requires a distributed counter (often
      solved with per-host ID ranges from ZooKeeper/DB or Snowflake-style IDs) and leaks
      creation volume/order. Random/hash avoids ordering coordination but needs a
      collision check or longer codes to keep collision probability low.
    ref: "concepts.md#playbook-url-shortener"

  - id: interview-method-scenario-playbooks-018
    difficulty: advanced
    tags: [url-shortener, read-path, caching]
    question: |
      For a URL shortener where redirects outnumber creations ~100:1, where should the
      design effort concentrate, and why?
    options:
      - "On the write path, since generating unique short codes is the hardest part and dominates the system's overall load and latency"
      - "On the read/redirect path — cache redirects aggressively (CDN + Redis) and keep analytics off the hot path — because reads vastly dominate"
      - "On the relational schema design, since complex multi-table joins dominate the cost of resolving each redirect request"
      - "On strong linearizable consistency of the code counter across all regions, since redirects must always see the newest mapping"
    answer: 1
    explanation: |
      With ~100:1 reads, the redirect path dominates latency and load. Cache the mapping
      (CDN edge + Redis), use a read-optimized KV store, and push analytics to an async
      queue so counting never blocks the redirect. Key generation matters but is not the
      hot path.
    ref: "concepts.md#playbook-url-shortener"

  - id: interview-method-scenario-playbooks-019
    difficulty: expert
    tags: [chat, delivery-semantics, ordering]
    question: |
      In a chat system, what delivery and ordering approach is both achievable and
      practical over an unreliable network?
    options:
      - "Exactly-once delivery guaranteed by the transport layer, plus a strict global total order across all conversations so every client sees one identical sequence"
      - "At-most-once delivery that drops any message on the first failed send, guaranteeing no duplicate ever reaches a recipient's device"
      - "At-least-once delivery with idempotent client-side dedup (via a client message-id) for exactly-once effect, and per-conversation sequence numbers for ordering"
      - "Best-effort fire-and-forget delivery with no acknowledgements and no ordering guarantees, relying on users to notice and resend anything that goes missing"
    answer: 2
    explanation: |
      Exactly-once delivery is impossible over an unreliable network; you get exactly-once
      *effect* via at-least-once delivery plus client dedup on a message-id. Ordering is
      practically enforced per-conversation with sequence numbers rather than a costly
      global total order.
    ref: "concepts.md#playbook-chat-and-whatsapp"

  - id: interview-method-scenario-playbooks-020
    difficulty: advanced
    tags: [chat, connections, presence]
    question: |
      What is the pivotal scaling challenge in a WhatsApp-style chat system with 100M
      concurrent users?
    options:
      - "Storing the raw message text, which dominates total cost since plaintext chat payloads consume the overwhelming majority of the system's disk footprint"
      - "Rendering emojis and rich media efficiently on the client, since GPU-accelerated glyph shaping is the primary throughput limit at this connection count"
      - "Choosing between SQL and NoSQL for the message table, since that single schema decision determines whether the whole system can reach 100M concurrent users"
      - "Managing persistent connections (WebSockets) and routing — knowing which gateway holds a user's socket via a presence/routing registry — plus presence fanout"
    answer: 3
    explanation: |
      Message text storage is comparatively small; the hard part is holding tens/hundreds
      of millions of persistent connections, tracking which gateway owns each user's
      socket (routing registry), delivering to the right socket, and doing presence fanout
      at scale.
    ref: "concepts.md#playbook-chat-and-whatsapp"

  - id: interview-method-scenario-playbooks-021
    difficulty: advanced
    tags: [uber, geospatial, indexing]
    question: |
      For "find nearby drivers" in a ride-hailing system, why are grid-based spatial
      indexes (geohash / S2 cells / H3) commonly chosen, and what is their downside?
    options:
      - "They give O(1) neighbor lookup and shard cleanly, but suffer boundary effects (nearby points in adjacent cells) and uneven density (hot cells in dense areas)"
      - "They guarantee perfectly even load across cells regardless of population density and eliminate boundary effects entirely by overlapping adjacent cell keys"
      - "They require a full sequential table scan of every stored location on each proximity query, which is why they are only viable for very small fleets"
      - "They only work for static, non-moving objects because each cell key is computed once at insert time and can never be updated as a point moves"
    answer: 0
    explanation: |
      Grid/cell schemes map a location to a cell key, enabling O(1) neighbor lookups and
      easy sharding by cell. Downsides: matches near cell boundaries need neighboring-cell
      searches, and dense areas produce hot cells. Quadtrees adapt to density but cost more
      to rebalance.
    ref: "concepts.md#playbook-uber-and-geo-matching"

  - id: interview-method-scenario-playbooks-022
    difficulty: expert
    tags: [uber, estimation, write-heavy]
    question: |
      3 million active drivers each send a location update every 4 seconds. What is the
      approximate write rate, and what storage implication does it carry?
    options:
      - "~12K writes/s — a single relational primary with row-level updates handles this comfortably with no sharding"
      - "~750K writes/s — use an in-memory sharded geo-index, not a disk-backed DB per update"
      - "~3M writes/s — persist every individual location ping durably to disk with full replication for auditability"
      - "~50K writes/s — batch the updates and stream them into a columnar data warehouse for later querying"
    answer: 1
    explanation: |
      3,000,000 / 4 s = 750,000 writes/s. That volume of ephemeral, high-churn location
      data belongs in an in-memory, sharded geospatial index (updated in place), not a
      durable per-write disk store. Durability of each individual ping isn't required.
    ref: "concepts.md#playbook-uber-and-geo-matching"

  - id: interview-method-scenario-playbooks-023
    difficulty: advanced
    tags: [video, pipeline, cdn]
    question: |
      In a YouTube-like system, which components are the pivotal "hard part," and what is
      the main trade-off of pre-transcoding and CDN delivery?
    options:
      - "The metadata database holding titles and descriptions; the central trade-off is picking SQL versus NoSQL, which dominates the whole system's design difficulty"
      - "The comment system under each video; the central trade-off is how aggressively to cache comment threads, which is the pipeline's hardest scaling problem"
      - "The ingest→transcode→store→deliver pipeline and CDN delivery; pre-transcoding to multiple bitrates costs storage but enables fast adaptive-bitrate streaming, and CDN offloads origin and cuts latency but costs egress and reduces freshness/control"
      - "The recommendation ranking model; the trade-off is the GPU cost of serving inference, which is the single hardest and most expensive part of a video platform"
    answer: 2
    explanation: |
      Video's hard part is the async transcode pipeline (fan out per resolution) plus
      CDN-based delivery. Pre-transcoding many renditions increases storage but enables
      smooth HLS/DASH adaptive streaming; CDNs offload the origin and reduce latency but
      add egress cost and weaker freshness/control.
    ref: "concepts.md#playbook-youtube-and-video"

  - id: interview-method-scenario-playbooks-024
    difficulty: expert
    tags: [job-scheduler, exactly-once, fencing]
    question: |
      A distributed job scheduler leases a job to a worker with a heartbeat/visibility
      timeout. A worker suffers a long GC pause, is presumed dead, and the job is
      reassigned — but the original worker wakes up and resumes. What prevents duplicate
      side effects?
    options:
      - "Longer visibility timeouts, which eliminate the possibility entirely by guaranteeing a worker is truly dead before any job is ever reassigned"
      - "A faster low-latency network so that GC pauses can never be mistaken for worker death and no reassignment is triggered in the first place"
      - "Running every job on two workers simultaneously by design, so redundant execution masks any single worker's pause without needing tokens"
      - "Fencing tokens: each lease carries a monotonically increasing token; downstream systems reject writes bearing a stale token, so the resurrected worker's writes fail"
    answer: 3
    explanation: |
      Timeouts can't distinguish a slow worker from a dead one (a GC pause looks like
      death). Fencing tokens attach a monotonic number to each lease; the protected
      resource remembers the highest token seen and rejects lower ones, so the stale
      worker's writes are fenced off. This is the classic lease + fencing safety pattern.
    ref: "concepts.md#playbook-distributed-job-scheduler"

  - id: interview-method-scenario-playbooks-025
    difficulty: advanced
    tags: [job-scheduler, coordination, tradeoff]
    question: |
      For assigning jobs across many workers in a scheduler, what trade-off distinguishes
      a single elected leader (Raft/ZooKeeper) from partitioned ownership via consistent
      hashing?
    options:
      - "A leader avoids duplicate assignment but is a scaling bottleneck; partitioned ownership scales horizontally but makes rebalancing on membership changes tricky"
      - "A single elected leader scales its assignment throughput essentially infinitely, whereas consistent-hashing partitioning hits a hard ceiling as workers are added"
      - "Partitioning by consistent hashing guarantees exactly-once execution on its own, so it needs no leases, fencing tokens, or other coordination mechanism"
      - "There is no meaningful difference between the two; both ultimately acquire a single global lock per job before assigning it to any worker"
    answer: 0
    explanation: |
      A single leader gives simple, conflict-free assignment but becomes a throughput
      bottleneck and adds failover complexity. Partitioned ownership (each worker owns a
      hash range of jobs) scales out but complicates rebalancing when workers join/leave,
      and still needs leases/fencing for correctness.
    ref: "concepts.md#playbook-distributed-job-scheduler"

  - id: interview-method-scenario-playbooks-026
    difficulty: advanced
    tags: [scaling-ladder, incremental]
    question: |
      When asked to "scale this from 1K to 100M users," what approach best signals
      seniority?
    options:
      - "Immediately propose the full end-state: a multi-region active-active architecture with sharding, CDNs, and a global consensus layer, before analyzing any bottleneck"
      - "Start simple (single box), then iteratively identify the current bottleneck with a number, remove it, and name the new problems each fix introduces (replication lag, hot shards, cache invalidation, cross-region consistency)"
      - "Refuse to design anything until the interviewer provides exact CPU, RAM, and disk specs for every node in the target fleet"
      - "Design the final end-state architecture first in full detail and never mention any of the intermediate scaling stages along the way"
    answer: 1
    explanation: |
      The prompt tests incremental reasoning: remove the current bottleneck, then name the
      next. Jumping straight to a mega-architecture is over-engineering and skips the
      reasoning being graded. Awareness of the *new* problems each scaling step introduces
      is the seniority signal.
    ref: "concepts.md#scaling-from-1k-to-100m-users"

  - id: interview-method-scenario-playbooks-027
    difficulty: advanced
    tags: [static-stability, fallback]
    question: |
      Following the AWS Builders' Library, what does "static stability" mean and why is it
      preferred over reactive scaling and fallback code paths during a dependency failure?
    options:
      - "The system freezes and rejects all incoming writes until the failed dependency fully recovers, keeping data consistent by refusing to make any progress"
      - "The system statically compiles all of its dependencies into a single binary ahead of time so that no runtime dependency call can ever fail"
      - "The system keeps working during a dependency failure using resources already provisioned (e.g., pre-scaled for failover), because the control plane needed to scale/fallback reactively is often exactly what's overloaded and rarely-exercised fallback paths are untested"
      - "The system relies on a well-tested secondary code path that activates only during failures and is pre-provisioned to fully absorb the primary path's entire load"
    answer: 2
    explanation: |
      Static stability means the system tolerates a dependency failure using
      already-provisioned capacity, without needing to make control-plane changes (which
      may be unavailable during the event). Reactive scaling depends on the very control
      plane that's stressed; fallback paths are rarely exercised and thus fail when needed.
    ref: "concepts.md#failure-modes-and-trade-offs"

  - id: interview-method-scenario-playbooks-028
    difficulty: expert
    tags: [shuffle-sharding, blast-radius]
    question: |
      How does shuffle sharding reduce blast radius compared with a single shared fleet
      or simple sharding?
    options:
      - "It replicates every incoming request to all nodes in the fleet simultaneously so that no request is ever lost even if many nodes fail at once"
      - "It removes the need for a load balancer entirely because clients compute their own shard placement and connect directly to the correct node"
      - "It guarantees each customer their own physically dedicated hardware, so one tenant's failing workload can never touch another tenant's nodes"
      - "It assigns each customer a random subset (shard) of nodes so that a poison-pill workload or failing node affects only the customers overlapping that subset, and the probability two customers share their entire subset is tiny"
    answer: 3
    explanation: |
      Shuffle sharding gives each customer a random combination of workers. A bad tenant or
      failing node only degrades customers whose shard overlaps, and the combinatorics make
      full overlap between any two customers extremely unlikely — so blast radius is a small
      fraction of customers instead of everyone.
    ref: "concepts.md#failure-modes-and-trade-offs"

  - id: interview-method-scenario-playbooks-029
    difficulty: expert
    tags: [backoff, jitter, retries]
    question: |
      Why is "exponential backoff WITH jitter" preferred over plain exponential backoff for
      retries?
    options:
      - "Plain exponential backoff still synchronizes many clients to retry at the same instants, recreating load spikes; adding randomization (e.g., full jitter: sleep = random(0, min(cap, base·2^n))) spreads retries over time and smooths the load"
      - "Jitter makes retries complete faster on average by shortening each computed backoff interval before the next attempt is sent"
      - "Jitter mathematically guarantees the request will eventually succeed no matter how long the downstream dependency stays unavailable"
      - "Jitter removes the need for any retry cap or budget because randomized waits alone prevent the total retry count from ever growing unbounded"
    answer: 0
    explanation: |
      Even with exponential backoff, clients that failed together retry together, producing
      synchronized spikes (thundering herd). Jitter randomizes the wait so retries are
      spread out, smoothing offered load. It still needs a cap and a retry budget.
    ref: "concepts.md#failure-modes-and-trade-offs"

  - id: interview-method-scenario-playbooks-030
    difficulty: advanced
    tags: [consistency, guarantees, precision]
    question: |
      A candidate says "reads must be consistent." What is the most useful clarifying
      follow-up to pin the requirement?
    options:
      - "Ask whether they simply want the fastest possible reads, since read latency is what the word 'consistent' is really shorthand for in practice"
      - "Ask which exact guarantee is needed: linearizable, causal, read-your-writes, or eventual — since each implies very different mechanisms and costs"
      - "Ask whether they would prefer a SQL or a NoSQL engine, because the consistency behavior follows automatically once that product choice is fixed"
      - "Ask how many read replicas they want provisioned, since the replica count by itself fully determines which consistency guarantee the system provides"
    answer: 1
    explanation: |
      "Consistent" is ambiguous. Linearizability (single up-to-date copy with real-time
      ordering) is far costlier than read-your-writes or eventual consistency. Naming the
      exact guarantee determines whether you need quorum/consensus, single-leader routing,
      or can accept eventual replication.
    ref: "concepts.md#scoping-requirements-functional-versus-non-functional"

  - id: interview-method-scenario-playbooks-031
    difficulty: expert
    tags: [linearizability, definition]
    question: |
      What does linearizability actually guarantee?
    options:
      - "That multi-object transactions execute in some equivalent serial order, though that order need not correspond to the real-time sequence in which they actually ran"
      - "That the system behaves as if there is a single copy of the data and every operation appears to take effect atomically at some point between its invocation and completion, respecting real-time ordering"
      - "That all replicas will eventually converge to the same value once writes stop propagating, without any guarantee about when a read observes the latest one"
      - "That reads never block and always return immediately, even in the middle of a network partition that separates the replicas from one another"
    answer: 1
    explanation: |
      Linearizability is a *recency* + real-time ordering guarantee on single objects: it
      looks as though there's one copy and each op takes effect atomically at some instant
      between call and return, consistent with real time. Serializability (option 0) is
      about transaction isolation and needn't respect real time; eventual consistency is
      option 2; and linearizable reads can block during partitions (CAP).
    ref: "concepts.md#failure-modes-and-trade-offs"

  - id: interview-method-scenario-playbooks-032
    difficulty: expert
    tags: [redlock, distributed-locks, critique]
    question: |
      Why is the Redlock algorithm criticized for use as a lock that guarantees
      correctness (mutual exclusion for critical work)?
    options:
      - "It is far too slow for any practical use because acquiring a lock requires a synchronous round trip to a majority of Redis nodes on every single critical-section entry"
      - "It requires a single standalone Redis node to hold the lock, which is an obvious single point of failure that takes down all locking when it crashes"
      - "It cannot be implemented at all without embedding a full consensus protocol like Raft underneath it to agree on the current lock holder"
      - "It relies on bounded timing assumptions (clocks, GC pauses, network delays); a process can hold what it thinks is a valid lock while its lease has expired, and Redlock alone provides no fencing token to stop stale holders from acting"
    answer: 3
    explanation: |
      Kleppmann's critique: Redlock assumes bounded clocks/pauses. A GC pause or clock jump
      can let a client believe it still holds the lock after expiry, and without fencing
      tokens the protected resource can't reject the stale holder. For correctness you need
      fencing; Redlock alone doesn't provide it. It can be fine for efficiency (avoiding
      duplicate work), not for correctness.
    ref: "concepts.md#failure-modes-and-trade-offs"

  - id: interview-method-scenario-playbooks-033
    difficulty: advanced
    tags: [quorum, math, consistency]
    question: |
      In a quorum-replicated store with N=5 replicas, you want read and write quorums to
      overlap so a read sees the latest write. Which R,W pair satisfies R+W>N with the
      lowest read latency (smallest R)?
    options:
      - "R=1, W=5"
      - "R=3, W=3"
      - "R=2, W=4"
      - "R=5, W=1"
    answer: 0
    explanation: |
      R+W>N (i.e. >5) guarantees the read and write quorums intersect on at least one
      up-to-date replica. R=1,W=5 gives R+W=6>5 with the smallest possible R (fastest
      reads) at the cost of the slowest, least-available writes. R=3,W=3 (=6) and R=2,W=4
      (=6) also satisfy it but with larger R; R=5,W=1 (=6) minimizes write cost, not reads.
    ref: "concepts.md#failure-modes-and-trade-offs"

  - id: interview-method-scenario-playbooks-034
    difficulty: expert
    tags: [spanner, truetime, cap-pacelc]
    question: |
      Google Spanner provides externally-consistent (linearizable) transactions globally.
      What is the trade-off it makes, and how does TrueTime relate?
    options:
      - "It sacrifices consistency in favor of availability during partitions, using TrueTime to hide the resulting staleness from clients so reads still look fresh"
      - "It chooses consistency (C) and pays a latency cost: TrueTime exposes a bounded clock uncertainty ε, and Spanner waits out that uncertainty (commit-wait) so timestamps respect real-time order — trading write latency for strong global ordering"
      - "TrueTime eliminates all commit latency entirely by reading GPS and atomic clocks that return a single exact instant with zero uncertainty"
      - "Spanner sidesteps the CAP trade-off completely by guaranteeing its network never partitions, so it never has to choose between consistency and availability"
    answer: 1
    explanation: |
      Spanner is a CP/PC-C system: it favors consistency and pays with latency. TrueTime
      returns an interval [earliest, latest] with bounded uncertainty ε (via GPS + atomic
      clocks); Spanner does a commit-wait of ~ε so no transaction's timestamp overlaps a
      later one's real time, yielding external consistency. TrueTime bounds, not
      eliminates, uncertainty.
    ref: "concepts.md#failure-modes-and-trade-offs"

  - id: interview-method-scenario-playbooks-035
    difficulty: advanced
    tags: [cap, pacelc]
    question: |
      What does PACELC add beyond CAP?
    options:
      - "Nothing of substance; it is simply a renaming of the existing CAP theorem that adds no new distinction beyond what CAP already captures"
      - "It formally proves that a distributed system can in fact provide all three of consistency, availability, and partition tolerance simultaneously"
      - "It states that during a Partition you choose Availability or Consistency, but Else (no partition) you still trade Latency versus Consistency — so consistency has a cost even in normal operation"
      - "It applies only to single-node databases, describing the latency-versus-consistency choice a system faces before it is ever distributed across machines"
    answer: 2
    explanation: |
      PACELC (Abadi) extends CAP: during a partition (P) choose A or C; else (E) choose L
      or C. It captures that strong consistency imposes latency even without partitions
      (e.g., cross-region quorum round trips), which CAP ignores.
    ref: "concepts.md#failure-modes-and-trade-offs"

  - id: interview-method-scenario-playbooks-036
    difficulty: advanced
    tags: [pagination, api]
    question: |
      Why is cursor/keyset pagination preferred over OFFSET/LIMIT for large, changing
      feeds?
    options:
      - "OFFSET is faster because the database maintains a positional index that lets it jump directly to the Nth row without reading any of the rows before it"
      - "Cursor pagination returns the entire result set in a single response, so the client paginates purely in memory without further round trips to the server"
      - "There is no practical difference between the two at any scale, so the choice is purely stylistic and has no measurable effect on latency or correctness"
      - "OFFSET/LIMIT cost grows with the offset (the DB must scan and skip rows) and results drift/duplicate as data changes, while keyset pagination seeks by an indexed cursor in roughly constant time and is stable under inserts"
    answer: 3
    explanation: |
      OFFSET N forces the DB to read and discard N rows (O(offset)) and, because rows
      shift when data is inserted/deleted, pages can skip or repeat items. Keyset/cursor
      pagination uses an indexed "where key > last_seen" seek — near-constant cost and
      stable under concurrent modification.
    ref: "concepts.md#api-and-data-model-first"

  - id: interview-method-scenario-playbooks-037
    difficulty: advanced
    tags: [tail-latency, hedged-requests]
    question: |
      "The Tail at Scale" recommends hedged requests. What is a hedged request and its
      cost?
    options:
      - "Sending a request, and if no response arrives by a threshold (e.g., the p95 latency), sending a second copy to another replica and taking the first to respond — cutting tail latency at the cost of modest extra load"
      - "Always sending every request to two separate replicas in parallel and waiting for both to return so you can compare and merge the two responses before replying to the caller"
      - "Retrying a request only after it fully breaches a fixed hard timeout, then discarding the first attempt entirely, which by definition adds latency on top of the timeout"
      - "Caching each computed response in a local in-memory store so any second or repeated request for the same data is served instantly for free, never recomputing a slow result twice"
    answer: 0
    explanation: |
      A hedged request issues a backup to another replica only after the first is slow
      (past a high percentile like p95), then uses whichever returns first. This trims the
      tail (p99/p999) with only a small increase in total requests. "Tied" requests reduce
      that overhead further by cancelling the twin once one starts.
    ref: "concepts.md#the-seniority-signal-tail-latency-and-blast-radius-and-cost"

  - id: interview-method-scenario-playbooks-038
    difficulty: expert
    tags: [usl, scalability, coordination]
    question: |
      The Universal Scalability Law adds a coherency term (κ) to Amdahl's serial term (σ).
      What real-world phenomenon does κ capture, and what is its consequence?
    options:
      - "It captures the average disk seek time of each node, which means aggregate throughput is fundamentally I/O-bound and adding CPUs or nodes cannot help past the storage layer's limit"
      - "It captures the O(N²) cost of nodes coordinating/crosstalking, meaning that beyond some point adding nodes actually DECREASES throughput — favoring shared-nothing partitioning over shared-state coordination"
      - "It captures the available network bandwidth between nodes, which means that as long as the links are not saturated, throughput continues to scale up perfectly linearly with each added node forever"
      - "It captures the per-core CPU cache-miss penalty, a fixed micro-architectural constant that is entirely negligible at scale and never bends the throughput curve for any realistic cluster size"
    answer: 1
    explanation: |
      Amdahl's σ (serial fraction) causes throughput to plateau; USL's κ (coherency delay)
      models the pairwise coordination cost that grows ~N², causing throughput to peak and
      then decline as nodes are added. This is why shared-nothing partitioning beats
      shared, coordinated state at scale.
    ref: "concepts.md#identifying-bottlenecks-and-scaling-iteratively"

  - id: interview-method-scenario-playbooks-039
    difficulty: intermediate
    tags: [use-method, bottlenecks]
    question: |
      Brendan Gregg's USE method says to check which three things for every resource, and
      which is the earliest warning sign of trouble?
    options:
      - "Uptime, Speed, Errors — with speed (the raw per-request response time) being the earliest warning sign that a resource is beginning to run into trouble under load"
      - "Usage, Storage, Endurance — with storage headroom being the earliest warning sign, since a resource always exhausts its capacity on disk before any other symptom of overload appears"
      - "Utilization, Saturation, Errors — with saturation (growing queue depth) being the early warning before latency explodes"
      - "Utilization, Security, Efficiency — with efficiency (the ratio of useful work to resources consumed) being the earliest warning sign that a resource is heading toward overload"
    answer: 2
    explanation: |
      USE = Utilization, Saturation, Errors. Saturation (requests queuing because the
      resource is beyond capacity) rises before latency blows up, making it a leading
      indicator of impending overload.
    ref: "concepts.md#identifying-bottlenecks-and-scaling-iteratively"

  - id: interview-method-scenario-playbooks-040
    difficulty: advanced
    tags: [timeouts, tail]
    question: |
      How should a timeout for a downstream call be chosen, and what goes wrong at each
      extreme?
    options:
      - "Pick a single round number like 30s and apply it everywhere; timeout values rarely matter to correctness because the downstream almost always responds well within any generous bound you set"
      - "Set every timeout as short as physically possible so the caller always fails fast, since a quick failure is strictly preferable to any wait in every situation regardless of the call's normal latency"
      - "Set the timeout to effectively infinity so that in-flight requests are never cut off prematurely and every call is guaranteed to eventually run to completion no matter how slow the dependency is"
      - "Derive it from the observed latency distribution (e.g., a high percentile like p99.9): too short causes false failures and retry storms; too long lets threads pile up (Little's Law) so the caller is dragged down too"
    answer: 3
    explanation: |
      Timeouts should be based on the actual latency distribution plus margin. Too short
      turns healthy-but-slow calls into failures and triggers retry storms; too long lets
      in-flight requests accumulate (concurrency = λ×W grows), exhausting pools and
      propagating failure upstream.
    ref: "concepts.md#failure-modes-and-trade-offs"

  - id: interview-method-scenario-playbooks-041
    difficulty: advanced
    tags: [notification-fanout, dedup, reliability]
    question: |
      In a notification system delivering across push/email/SMS with at-least-once queue
      semantics, why are idempotent consumers and deduplication essential?
    options:
      - "Because at-least-once delivery and provider retries can deliver the same event more than once, so consumers must dedup (e.g., by event id) to avoid sending duplicate notifications to users"
      - "Because deduplicating events on the consumer side is the only known way to make the underlying message queue push events through at higher throughput and lower latency"
      - "Because email providers negotiate an exactly-once TCP delivery guarantee at the transport layer, which the consumer must mirror with matching idempotency logic to stay compatible"
      - "Because SMS delivery is inherently strictly ordered while push notifications are not, so dedup exists purely to reconcile the ordering mismatch between those two channels"
    answer: 0
    explanation: |
      At-least-once queues and retries to flaky providers can reprocess the same event.
      Without idempotent consumers/dedup keyed on the event id, users get duplicate
      notifications. Dedup converts at-least-once delivery into exactly-once effect.
    ref: "concepts.md#playbook-notification-fanout"

  - id: interview-method-scenario-playbooks-042
    difficulty: intermediate
    tags: [method, articulation, trade-offs]
    question: |
      Which sentence best demonstrates the "gain / give-up / when-the-alternative-wins"
      articulation interviewers reward?
    options:
      - "I'll put a CDN in front of the images, point the clients at the edge endpoint, and move on to the next component of the design from there."
      - "I'll use a CDN: I gain low read latency and origin offload, I give up strong freshness (edge caches can be stale), which is fine for immutable thumbnails — but if content changed per-request I'd serve from origin or use short TTLs instead."
      - "CDNs are the industry-standard way everyone serves static images at scale, so I'll just use one here as well and consider that part settled without further analysis."
      - "I'll leave the caching and CDN decision open for now and come back to figure out the right approach later once the rest of the design is sketched out."
    answer: 1
    explanation: |
      The strong answer names the gain, the cost, why the cost is acceptable here, and when
      the alternative would win. The others assert a choice without reasoning, which reads
      as mid-level or evasive.
    ref: "concepts.md#articulating-trade-offs-out-loud"

  - id: interview-method-scenario-playbooks-043
    difficulty: advanced
    tags: [disagreement, defense]
    question: |
      The interviewer pushes back on your choice of eventual consistency. What response
      best signals seniority?
    options:
      - "Firmly insist your original eventual-consistency choice is correct as stated, decline to engage with the objection, and move directly on to the next part of the design"
      - "Immediately abandon your choice and switch the whole design to strong consistency purely to please the interviewer, without weighing the latency or availability cost that change imposes"
      - "Acknowledge the point, restate the constraint (100:1 reads, 200ms p99), quantify the trade-off (strong consistency needs a ~150ms cross-region quorum, blowing the budget), then offer read-your-writes via sticky routing — or concede if correctness truly outranks latency"
      - "Assert that consistency is simply not an important property in distributed systems and that worrying about it at all is a distraction from the real design work"
    answer: 2
    explanation: |
      The senior move is a collaborative, evidence-based response: acknowledge, restate the
      driving constraint, quantify the cost of their suggestion, then offer a targeted fix
      or concede for a stated reason. Dogmatism and reflexive capitulation both lower
      signal.
    ref: "concepts.md#disagreeing-and-defending-a-choice-gracefully"

  - id: interview-method-scenario-playbooks-044
    difficulty: expert
    tags: [feed, hot-key, thundering-herd]
    question: |
      A single tweet goes viral and its detail page is requested millions of times per
      second, all missing the cache simultaneously. What is this failure and how do you
      mitigate it?
    options:
      - "A gradual memory leak in the cache process that fragments the heap over time; the standard fix is to restart the cache nodes on a rolling schedule to reclaim the leaked memory"
      - "A network partition splitting the cache tier from the origin; the correct response is to switch the datastore to eventual consistency so reads can proceed on either side of the split"
      - "A retry storm originating from the database layer, where slow queries force the DB's internal clients to resend and amplify their own read requests back onto the cache"
      - "A cache stampede / thundering herd (and a hot key): mitigate with request coalescing (single-flight), serving stale-while-revalidate, per-key locks on cache fill, and replicating the hot key across cache nodes"
    answer: 3
    explanation: |
      When a hot key expires or misses, many concurrent requests hit the origin at once
      (stampede). Mitigations: coalesce duplicate fills (single-flight), serve stale while
      asynchronously revalidating, use a per-key lock so only one fill runs, and replicate
      the hot key across nodes to spread read load.
    ref: "concepts.md#playbook-news-feed-and-twitter-timeline"

  - id: interview-method-scenario-playbooks-045
    difficulty: advanced
    tags: [sharding, hot-shard]
    question: |
      You shard a table by user_id, but a few "power users" generate most of the traffic,
      overloading their shards. What is the problem and a reasonable fix?
    options:
      - "Hot shards from a skewed key: mitigate by choosing a higher-cardinality or composite/salted key, splitting hot partitions, or handling heavy hitters separately (e.g., dedicated capacity)"
      - "Nothing is actually wrong here, because consistent hashing guarantees that sharding always distributes both keys and their traffic perfectly evenly across all partitions automatically"
      - "Add more read replicas of the entire cluster so the extra copies collectively absorb the power users' traffic, spreading their load evenly across the newly provisioned replica set"
      - "Switch the store from NoSQL to a relational SQL engine, since SQL databases partition by primary key in a way that structurally eliminates any possibility of a hot-shard imbalance"
    answer: 0
    explanation: |
      A skewed partition key concentrates load on a few shards. Fixes include a
      higher-cardinality or salted/composite key to spread the hot entity, splitting the
      hot partition, or treating heavy hitters specially. Replicating the whole cluster or
      switching engines doesn't address the skew.
    ref: "concepts.md#scaling-from-1k-to-100m-users"

  - id: interview-method-scenario-playbooks-046
    difficulty: intermediate
    tags: [method, steer, prioritization]
    question: |
      Ten minutes in, the interviewer says "let's focus on how the news feed is
      generated." You were about to detail the API auth flow. What should you do?
    options:
      - "Finish detailing the entire API auth flow first simply because you already started it, then circle back to feed generation once you have completely closed out the auth topic"
      - "Follow the steer and dive into feed generation — the steer is the highest-value signal about what they want to evaluate"
      - "Ask the interviewer whether you can switch to a completely different design problem instead, since the feed generation deep dive was not the direction you had planned to take"
      - "Explain to the interviewer why the authentication flow is architecturally more important than the news feed and ask to keep working through it before moving on"
    answer: 1
    explanation: |
      The interviewer's steer effectively tells you the rubric. Ignoring it to finish a
      lower-value tangent is a common anti-pattern. Follow it into the deep dive they care
      about.
    ref: "concepts.md#deep-dive-on-the-hard-part"

  - id: interview-method-scenario-playbooks-047
    difficulty: advanced
    tags: [load-shedding, goodput]
    question: |
      During overload, why can proactively rejecting (shedding) some requests early
      improve overall goodput compared with trying to serve everything?
    options:
      - "It doesn't help at all; admitting and attempting to serve every incoming request always maximizes total goodput because no potentially successful request is ever turned away at the door"
      - "Shedding excess requests early drives the system's overall error rate all the way down to zero, since rejected requests are never counted as errors and the rest all succeed cleanly"
      - "Accepting more than capacity makes every request slow and many time out after consuming resources (wasted work), collapsing goodput; shedding excess early preserves resources so accepted requests complete successfully"
      - "Load shedding only ever improves goodput when it is paired with more aggressive client retries, which resubmit the shed requests until the backend eventually finds capacity to serve them"
    answer: 2
    explanation: |
      Beyond capacity, admitting all requests makes them all slow; many then time out
      *after* consuming CPU/memory/locks — wasted work that further reduces successful
      throughput (goodput). Shedding the excess early keeps latency bounded for admitted
      requests and protects goodput. It works best when clients don't just retry the
      rejects (need backoff/budgets).
    ref: "concepts.md#failure-modes-and-trade-offs"

  - id: interview-method-scenario-playbooks-048
    difficulty: advanced
    tags: [storage-estimation, url-shortener]
    question: |
      A URL shortener stores ~100M new URLs/day at ~500 bytes each. Roughly how much raw
      storage per year, and what does it imply?
    options:
      - "~1.8 TB/year — a volume so large it demands a massive purpose-built storage cluster provisioned up front before the service can launch at all"
      - "~180 TB/year — storage capacity is by far the dominant bottleneck of the whole system and should absorb nearly all of the design effort"
      - "~180 GB/year — trivial enough that a single small commodity instance can hold everything, so no sharding or capacity planning is ever needed"
      - "~18 TB/year — comfortably fits a modest sharded KV cluster; the hard problem is the read/redirect throughput, not storage"
    answer: 3
    explanation: |
      100M × 500 B ≈ 50 GB/day × 365 ≈ 18 TB/year — modest for a sharded KV store. The real
      challenge is serving billions of redirects with low latency, so effort goes to
      caching the read path, not to storage capacity.
    ref: "concepts.md#back-of-the-envelope-estimation"

  - id: interview-method-scenario-playbooks-049
    difficulty: expert
    tags: [read-your-writes, replication-lag]
    question: |
      Reads are served from async replicas that lag the primary by ~1s. A user posts a
      comment and immediately reloads, but doesn't see it. What guarantee is violated and
      what is a targeted fix that preserves replica scaling?
    options:
      - "Read-your-writes consistency is violated; fix it by routing a user's reads to the primary (or a caught-up replica) for a short window after their own write, sticky by user, rather than making all reads strongly consistent"
      - "Linearizability is violated, and the only possible fix is to make every replica synchronous so that all reads everywhere always observe the single most recent committed write"
      - "Durability is violated because the comment was lost on write; increase the replication factor so future writes are persisted to enough replicas to survive"
      - "Nothing is actually violated here; under eventual consistency a user briefly not seeing their own just-submitted write is entirely correct and expected behavior"
    answer: 0
    explanation: |
      The user fails to see their own recent write — a read-your-writes violation. A
      targeted fix routes that user's reads to the primary (or a replica known to be
      caught up) for a short window after they write, or tracks a write timestamp/version,
      keeping the bulk of reads on scalable replicas. Making all reads strong is overkill
      and costly.
    ref: "concepts.md#scaling-from-1k-to-100m-users"

  - id: interview-method-scenario-playbooks-050
    difficulty: intermediate
    tags: [estimation, discipline]
    question: |
      What is the correct purpose of back-of-the-envelope estimation in an interview?
    options:
      - "To demonstrate precise mental arithmetic and arrive at exact figures, since the interviewer is primarily grading the accuracy of the numbers you compute down to the last digit"
      - "To produce order-of-magnitude numbers that DRIVE design decisions (do we need sharding? a CDN? does the working set fit in RAM?), and to interpret what each number means"
      - "To fill the available time with visible activity while you privately think through the architecture, giving you a moment to organize your thoughts before committing to a design"
      - "To compute the exact monthly cloud bill for the proposed architecture so you can present the interviewer with a precise dollar cost figure for the system"
    answer: 1
    explanation: |
      Estimation exists to change decisions. Compute only the numbers that matter (peak
      QPS, storage/year, bandwidth, working-set size) and — crucially — state the
      implication ("150K QPS at ~1KB is ~150 MB/s of reads → a caching/fanout problem").
      Exactness is not the goal.
    ref: "concepts.md#back-of-the-envelope-estimation"

  - id: interview-method-scenario-playbooks-051
    difficulty: advanced
    tags: [over-engineering, matching-scale]
    question: |
      For an internal tool with ~1,000 users and modest load, a candidate proposes
      multi-region active-active with sharding, Kafka, and a service mesh. What is the
      issue?
    options:
      - "Nothing is wrong with it — building in maximum resilience up front is always the better choice, so more regions, sharding, and messaging infrastructure can only help the tool"
      - "The design is actually under-engineered for the requirement and needs even more regions and redundancy to safely handle its roughly one thousand internal users"
      - "Over-engineering: complexity should match the stated scale; a single-region app + one relational DB is correct here, and you add complexity only when the numbers demand it"
      - "The candidate should additionally add a blockchain ledger to the design to give the internal tool tamper-proof auditability of every user action across the system"
    answer: 2
    explanation: |
      Matching complexity to scale is a seniority signal. At 1K users, a simple design is
      correct and cheaper to operate; multi-region active-active adds cost, latency, and
      operational burden with no benefit. Say "at this scale X is fine; I'd add complexity
      when the numbers demand it."
    ref: "concepts.md#common-anti-patterns"

  - id: interview-method-scenario-playbooks-052
    difficulty: expert
    tags: [chat, e2e-encryption, tradeoff]
    question: |
      Adding end-to-end encryption to a chat product changes which server-side capabilities,
      and why?
    options:
      - "It has no meaningful effect on any server-side feature, since encryption is purely a transport concern that the application and storage layers never have to account for"
      - "It makes the server measurably faster overall because with end-to-end encryption enabled the server no longer needs to persist any messages to its own datastore"
      - "It requires abandoning WebSockets and switching the transport to plain HTTP long-polling, because encrypted payloads cannot be delivered over a persistent socket connection"
      - "The server can no longer read message contents, so server-side full-text search and content-based features must move to the client (or be abandoned), and fanout/routing must work on ciphertext with keys managed per-device"
    answer: 3
    explanation: |
      With E2E encryption the server sees only ciphertext, so any feature needing plaintext
      (server-side search, content moderation, previews) must move client-side or be
      dropped, and key management becomes per-device. Routing/fanout still work but operate
      on opaque payloads.
    ref: "concepts.md#playbook-chat-and-whatsapp"

  - id: interview-method-scenario-playbooks-053
    difficulty: advanced
    tags: [view-count, async, hot-path]
    question: |
      A video platform must show view counts. Why should the counter NOT be a synchronous
      increment on the playback hot path?
    options:
      - "A synchronous strongly-consistent increment per view creates a write-contention hot spot and adds latency to every playback; instead aggregate views asynchronously (buffer/batch, approximate, or sharded counters) off the hot path"
      - "Because view counts are a purely cosmetic vanity metric that carry no product value, so there is no reason to spend any engineering effort keeping them on the hot path at all"
      - "Because reads of the view count must always be strictly linearizable, and a synchronous increment is the one write pattern that can never satisfy that real-time ordering guarantee"
      - "Because atomic increment operations are fundamentally impossible to implement in any NoSQL datastore, forcing the count to be computed some other way entirely"
    answer: 0
    explanation: |
      Billions of views hitting a single counter row is a write hot spot and adds latency to
      the critical playback path. Approximate/eventually-consistent counting via buffering,
      sharded counters, or async aggregation removes contention; exact real-time counts
      aren't worth the cost here.
    ref: "concepts.md#playbook-youtube-and-video"

  - id: interview-method-scenario-playbooks-054
    difficulty: advanced
    tags: [rate-limiter, fail-open, availability]
    question: |
      Your distributed rate limiter's central Redis store becomes unreachable. Should
      requests fail-open or fail-closed, and why is this a deliberate trade-off?
    options:
      - "Always fail-closed to strictly enforce the configured limits at all times, even when doing so blocks every caller and takes the entire API offline for the duration of the Redis outage"
      - "Usually fail-open (allow requests) so a limiter outage doesn't take down the API — accepting temporary over-admission — but fail-closed may be right when the limit protects a fragile downstream or enforces a hard quota (e.g., billing/security)"
      - "It genuinely doesn't matter which mode you pick, because with the central store unreachable the two behaviors produce an identical outcome for every incoming request anyway"
      - "Always fail-open and admit all traffic no matter what the limit is protecting, since availability of the API must unconditionally outrank every downstream or quota concern"
    answer: 1
    explanation: |
      The rate limiter shouldn't be a SPOF for the whole API, so fail-open is the common
      default (availability over strict enforcement), tolerating brief over-admission.
      But if the limit guards a fragile downstream or a hard security/billing quota,
      fail-closed is justified. It's a conscious availability-vs-enforcement trade-off.
    ref: "concepts.md#playbook-rate-limiter"

  - id: interview-method-scenario-playbooks-055
    difficulty: advanced
    tags: [seniority-signal, cost]
    question: |
      Which consideration most distinguishes a staff-level answer from a competent
      mid-level one on the SAME design?
    options:
      - "Maximizing average throughput and optimizing the happy path, since a design that handles the common case at high volume is what ultimately decides whether the system succeeds"
      - "Adopting the newest database technology available and standardizing the whole design on it, on the reasoning that a more modern engine automatically raises the quality of any architecture"
      - "Reasoning about the latency distribution (p99/p999), blast radius/isolation, operational cost (dollars, replication factor, who gets paged), backpressure, and observability — not just throughput"
      - "Drawing more boxes in the architecture diagram and labelling every microservice explicitly, since a more detailed and visually complete picture is what conveys senior-level depth"
    answer: 2
    explanation: |
      Mid-level optimizes throughput and the happy path; staff-level reasons about the tail,
      failure and blast radius, dollar/operational cost, graceful degradation, and
      observability. Same design, deeper reasoning about the distribution and the failure
      and the bill.
    ref: "concepts.md#the-seniority-signal-tail-latency-and-blast-radius-and-cost"

  - id: interview-method-scenario-playbooks-056
    difficulty: expert
    tags: [scaling-ladder, new-problems]
    question: |
      As you scale by adding read replicas and a cache in front of the DB, which NEW
      problems does this specifically introduce that you should proactively name?
    options:
      - "None whatsoever; adding read replicas and a front cache is a pure win that only increases capacity and lowers latency without creating any new failure mode to worry about"
      - "Reduced write durability and a loss of ACID guarantees on the primary, because every added replica forces the primary to relax its commit protocol to keep the copies in sync"
      - "The need to switch programming languages, since read replicas and cache clients are only well supported in a different runtime than the one the primary application was built in"
      - "Replication lag (breaking read-your-writes), cache invalidation/staleness, and cache stampedes on hot keys or cold starts"
    answer: 3
    explanation: |
      Read replicas introduce replication lag (read-your-writes issues); caches introduce
      invalidation/staleness and stampede risk. Naming the new problems each fix creates is
      the seniority signal. It doesn't reduce primary durability or force a language change.
    ref: "concepts.md#scaling-from-1k-to-100m-users"

  - id: interview-method-scenario-playbooks-057
    difficulty: intermediate
    tags: [method, vertical-slice]
    question: |
      What is a "vertical slice" in the high-level design step, and why do it?
    options:
      - "Designing one complete request path end-to-end (e.g., post a tweet → API GW → write service → DB → enqueue fanout) before widening, because it reveals the real constraints faster than sketching every box shallowly"
      - "Splitting the architecture diagram down the middle into two vertical columns purely for visual neatness, so the box-and-arrow layout looks balanced and is easier for the interviewer to read"
      - "Enumerating every microservice that will exist in the finished system up front in a single flat list, so the interviewer can see the full breadth of components before any one path is traced"
      - "Designing the complete database schema — every table, column, and index — in full detail first, on the reasoning that the storage layer is the foundation everything else must be built on top of"
    answer: 0
    explanation: |
      A vertical slice traces a single request through all layers end-to-end. Completing one
      path surfaces the true constraints (latency budget, storage, ordering) quickly,
      whereas breadth-first shallow boxes hide them. Depth-then-breadth beats
      breadth-then-depth here.
    ref: "concepts.md#the-structured-design-loop"

  - id: interview-method-scenario-playbooks-058
    difficulty: advanced
    tags: [idempotency, api-design]
    question: |
      Which operations most need an idempotency key in the API design, and why?
    options:
      - "Read-only GET endpoints, because they are called far more often than any other verb and the highest-traffic paths are the ones most in need of an idempotency key to stay safe"
      - "Non-idempotent side-effecting writes (create payment, place order, post) — so that a client retry after an ambiguous timeout doesn't cause a duplicate effect"
      - "All endpoints equally, since idempotency keys are essentially free to attach and applying them uniformly everywhere removes any need to reason about which operations are actually unsafe"
      - "Only internal admin endpoints, because those are operated by trusted staff whose tools retry aggressively, whereas ordinary user-facing traffic rarely needs the extra protection a key provides"
    answer: 1
    explanation: |
      GETs are already idempotent. The danger is side-effecting writes: after a timeout the
      client can't tell if the server acted, so it retries — an idempotency key lets the
      server recognize the duplicate and return the original result instead of repeating the
      effect.
    ref: "concepts.md#api-and-data-model-first"

  - id: interview-method-scenario-playbooks-059
    difficulty: advanced
    tags: [access-pattern, storage-choice]
    question: |
      The access pattern is: point lookups by a single key, extremely high write volume,
      no joins, and a need for predictable low read latency. Which storage fit is most
      appropriate, and what do you give up?
    options:
      - "A single relational primary, giving up nothing at all, because one vertically scaled SQL node absorbs unbounded write volume while still serving predictable low-latency point lookups by key"
      - "A full-text search index (e.g., Elasticsearch) as the primary store, giving up little, since an inverted index resolves single-key point lookups faster than any dedicated key-value engine could"
      - "A wide-column / KV store (e.g., DynamoDB, Cassandra) — you gain linear write scaling and predictable point-read latency, but give up ad-hoc queries, joins, and (often) strong multi-key transactions"
      - "A graph database, giving up raw scalability, because traversing edge relationships is the most efficient way to serve extremely high-volume point lookups by a single key"
    answer: 2
    explanation: |
      Point lookups + huge writes + no joins is the wide-column/KV sweet spot: linear write
      scaling and predictable read latency. The cost is losing joins, flexible ad-hoc
      queries, and easy cross-key transactions — which this pattern doesn't need. Say the
      trade-off explicitly.
    ref: "concepts.md#api-and-data-model-first"

  - id: interview-method-scenario-playbooks-060
    difficulty: expert
    tags: [uber, matching, lease]
    question: |
      In ride matching, the same available driver could be offered to two riders nearly
      simultaneously. How do you prevent a double-assignment, and what's the trade-off?
    options:
      - "Ignore it entirely, since briefly double-assigning one driver to two riders is a harmless edge case that the dispatch UI can quietly resolve on its own without any coordination"
      - "Broadcast the same available driver to every nearby rider at once and let them race to accept freely, trusting that the network round-trip times will naturally pick a single unambiguous winner"
      - "Use eventual consistency and simply reconcile the conflict afterward by refunding whichever rider lost the driver, treating a post-hoc apology and credit as an acceptable resolution for the clash"
      - "Acquire a short-lived lock/lease on the driver during the offer (compare-and-set on driver state) so only one match wins; the trade-off is added coordination latency and handling lease expiry/timeouts if a rider doesn't respond"
    answer: 3
    explanation: |
      A lease/lock (or atomic compare-and-set on the driver's availability) ensures a single
      winning match. The cost is coordination latency and the need to expire the lease if
      the offered rider doesn't accept in time, returning the driver to the pool. Post-hoc
      reconciliation is a poor UX for real-time matching.
    ref: "concepts.md#playbook-uber-and-geo-matching"

  - id: interview-method-scenario-playbooks-061
    difficulty: advanced
    tags: [301-302, url-shortener, caching]
    question: |
      For URL-shortener redirects, what is the practical difference between returning HTTP
      301 vs 302?
    options:
      - "301 (permanent) is cached by browsers/CDNs so future clicks may skip your server — great for latency but it undermines per-click analytics; 302 (temporary/found) keeps clients coming back to your server, preserving analytics/control at the cost of more traffic"
      - "301 and 302 are identical in every respect that matters for a redirect, so browsers and CDNs treat the two status codes interchangeably and the choice between them has no observable effect"
      - "302 is cached permanently by clients and CDNs while 301 is treated as strictly non-cacheable, so a 302 target can never be changed once it has been served to any visitor"
      - "301 responses are only permitted over HTTPS connections whereas 302 responses may only be returned over plain HTTP, so the redirect code you pick is dictated by the transport in use"
    answer: 0
    explanation: |
      A 301 permanent redirect is aggressively cached, so subsequent clicks may not hit your
      service — lowest latency but you lose click tracking and the ability to change the
      target. A 302 keeps routing clicks through your server, preserving analytics and
      control at the cost of extra load. It's a real product/infra trade-off.
    ref: "concepts.md#playbook-url-shortener"

  - id: interview-method-scenario-playbooks-062
    difficulty: expert
    tags: [key-space, url-shortener, math]
    question: |
      Using base62 (a-z, A-Z, 0-9) codes, roughly how many distinct keys does a 7-character
      code provide, and why does that matter?
    options:
      - "~62 × 7 ≈ 434 keys — far too few, because a fixed-length code multiplies the alphabet size by the number of positions rather than raising it to that power"
      - "~62^7 ≈ 3.5 trillion keys — ample headroom so collisions stay rare and codes stay short"
      - "~7^62 keys — effectively infinite but the codes come out far too long, since the exponent and base are swapped so length drives the alphabet rather than the reverse"
      - "~2^7 = 128 keys — enough for a small service, on the reasoning that each of the 7 characters is effectively a single binary on/off choice rather than a base-62 digit"
    answer: 1
    explanation: |
      Combinations of a fixed-length code = base^length = 62^7 ≈ 3.5×10^12. That's trillions
      of keys, so 7 chars keeps codes short while collision probability stays tiny at
      realistic volumes. This math justifies the chosen code length.
    ref: "concepts.md#playbook-url-shortener"

  - id: interview-method-scenario-playbooks-063
    difficulty: advanced
    tags: [notification-fanout, broadcast, thundering-herd]
    question: |
      A product manager wants to send a single broadcast to all 50M users at once. What
      operational risk does this create and how do you handle it?
    options:
      - "No risk at all; firing all 50M notifications out in the same instant is the best user experience, and modern push and email providers absorb any simultaneous volume you hand them"
      - "The only real risk is exhausting the pool of unique message identifiers, which you avoid simply by widening the id field so every one of the 50M sends still gets a distinct key"
      - "A self-inflicted thundering herd — 50M sends plus the resulting app-open traffic can overwhelm providers and your backend; smooth it with rate-limited/scheduled fanout, per-provider throttling, and staggered delivery windows"
      - "Broadcasts are always cheap and safe because they reuse a single shared payload, so the cost of reaching 50M recipients is effectively no greater than the cost of notifying one user"
    answer: 2
    explanation: |
      A simultaneous broadcast spikes both outbound sends (hitting provider limits) and the
      inbound wave of users opening the app. Smooth delivery over a window with rate limiting
      and per-provider throttling to protect your backend and stay within provider quotas.
    ref: "concepts.md#playbook-notification-fanout"

  - id: interview-method-scenario-playbooks-064
    difficulty: expert
    tags: [job-scheduler, clock-skew, correctness]
    question: |
      A distributed scheduler decides "which jobs are due now" using each worker's local
      clock. Workers' clocks drift by several seconds. What can go wrong and what's a sound
      mitigation?
    options:
      - "Nothing goes wrong; the local clocks on separate workers are always perfectly synchronized by the hardware, so every worker independently agrees to the millisecond on when a job is due"
      - "The jobs will simply never run at all, because a scheduler that reads worker-local clocks is unable to ever conclude that any scheduled time has actually arrived on any machine"
      - "The database will reject all incoming writes, since a datastore refuses to persist any record whose timestamp originates from a client clock that is not centrally synchronized first"
      - "Clock skew makes different workers disagree on whether a job is due, causing early/late or duplicate runs; mitigate with a single time authority for due-decisions (or NTP + bounded skew), leases/fencing for exactly-once effect, and idempotent jobs"
    answer: 3
    explanation: |
      Skewed clocks make "due now" ambiguous across workers, risking premature, delayed, or
      duplicate executions. Rely on a consistent time source (or bounded, NTP-synced skew)
      for due decisions, and pair leases + fencing tokens with idempotent jobs so even a
      mistimed run doesn't cause duplicate effects.
    ref: "concepts.md#playbook-distributed-job-scheduler"

  - id: interview-method-scenario-playbooks-065
    difficulty: advanced
    tags: [bandwidth-estimation, cdn]
    question: |
      A read path serves 150K QPS of ~1 KB responses. What is the approximate egress
      bandwidth, and what design conclusion follows?
    options:
      - "~150 MB/s (~1.2 Gbps) — significant sustained egress that argues for edge caching/CDN and read caching rather than serving all reads from origin"
      - "~15 MB/s — trivial enough that a single origin server's uplink covers it with room to spare, so no CDN or read caching layer is warranted at this request rate"
      - "~1.5 GB/s — a sustained volume no realistic fleet can serve, which means the read path is fundamentally infeasible and the whole design must be reworked from scratch"
      - "~15 GB/s — a figure so large it proves on its own that serving 1 KB responses at this QPS is physically impossible over any commodity network hardware available today"
    answer: 0
    explanation: |
      150,000 × 1 KB ≈ 150 MB/s ≈ 1.2 Gbps sustained. That's substantial and continuous, so
      offloading reads to a CDN/edge and caching reduces origin bandwidth and latency. The
      interpretation ("this is a caching problem") is the point of the estimate.
    ref: "concepts.md#back-of-the-envelope-estimation"

  - id: interview-method-scenario-playbooks-066
    difficulty: expert
    tags: [feed, celebrity, hybrid-threshold]
    question: |
      In a hybrid feed design, on what basis do you decide whether to push (fanout-on-write)
      or pull (fanout-on-read) for a given author, and what's the failure you're avoiding?
    options:
      - "Randomly assign each author to push or pull, treating it as a coin flip whose only purpose is to spread the fanout work evenly across the write and read paths regardless of who the author is"
      - "By follower count: push for normal users (cheap reads), but pull for high-follower accounts above a threshold (e.g., ~1M) to avoid a write storm/hot-shard when they post — merging their recent posts into followers' timelines at read time"
      - "By the author's posting frequency alone, sending frequent posters to pull and quiet accounts to push, while completely ignoring how many followers each author actually has"
      - "Always push for every author and never pull, on the reasoning that precomputing timelines on write is uniformly cheaper than merging at read time no matter how large a following gets"
    answer: 1
    explanation: |
      The write cost of pushing scales with follower count, so accounts with huge followings
      would trigger a write storm and hot shards on every post. Above a follower threshold
      you switch those authors to pull (merge at read), keeping the common case (normal
      users) on cheap push reads.
    ref: "concepts.md#playbook-news-feed-and-twitter-timeline"

  - id: interview-method-scenario-playbooks-067
    difficulty: intermediate
    tags: [method, clarifying-questions]
    question: |
      Which clarifying question at the start is MOST likely to change your architecture?
    options:
      - "What color and shape should the primary UI buttons be, and should they follow the company's existing brand style guide across every screen in the product?"
      - "Which programming language and web framework should the services be written in, and does the team already have a preferred runtime we should standardize the whole implementation on?"
      - "What are the scale and latency targets — DAU, peak QPS, p99 latency, and the read:write ratio?"
      - "What is the company's official registered name, and how should that name be displayed in the page title bar and the footer of the finished application?"
    answer: 2
    explanation: |
      Scale, latency, and read:write ratio are the NFRs that decide sharding, caching,
      precomputation, and storage choice — they drive the architecture. UI, language, and
      naming don't. Pin the numbers that drive design first.
    ref: "concepts.md#scoping-requirements-functional-versus-non-functional"

  - id: interview-method-scenario-playbooks-068
    difficulty: expert
    tags: [avoid-fallback, resilience]
    question: |
      The AWS Builders' Library advises "avoiding fallback in distributed systems." What is
      the core reasoning?
    options:
      - "Fallback paths are always slower than the primary path by design, so routing to one during a failure guarantees the request breaches its latency budget and the caller times out anyway"
      - "Fallbacks inherently violate the CAP theorem, because switching to a secondary path forces the system to abandon partition tolerance and therefore cannot remain a valid distributed system"
      - "Fallbacks require a two-phase commit across the primary and secondary paths to stay consistent, and that coordinator round trip is what makes the fallback mechanism unsafe to rely on"
      - "Fallback code runs rarely, so it is poorly tested and under-provisioned; it tends to fail exactly during the overload/failure that triggers it, and can add load or mask problems — prefer designs that degrade gracefully or are statically stable instead"
    answer: 3
    explanation: |
      A secondary fallback path is exercised only during failures, so it's rarely tested and
      rarely capacity-planned; it commonly fails or adds load right when invoked. The
      guidance is to design for graceful degradation and static stability rather than to
      rely on an untested emergency path.
    ref: "concepts.md#failure-modes-and-trade-offs"

  - id: interview-method-scenario-playbooks-069
    difficulty: advanced
    tags: [observability, debugging]
    question: |
      Asked "what would you alarm on, and how would you debug a p999 regression," which
      answer best signals operational maturity?
    options:
      - "Alarm on SLO-based signals (latency percentiles, error rate, saturation/queue depth); debug a p999 regression by checking fan-out, GC pauses, cold caches, a slow dependency or hot shard, and using traces to find where the tail time is spent"
      - "Alarm exclusively on host CPU utilization, and debug any latency regression by rolling a restart across the fleet, since a fresh process reliably clears whatever caused the slow requests"
      - "Alarm only on the average request latency and skip percentiles entirely, because the p999 tail reflects a negligible slice of traffic that is not worth the cost of measuring or tracking"
      - "Don't set up alarms in advance at all; simply wait for users to file complaints about slowness, then begin investigating the regression once enough reports have accumulated to confirm it"
    answer: 0
    explanation: |
      Mature ops means SLO-driven alarms on percentiles, error rate, and saturation (a
      leading indicator), plus a systematic tail-debugging approach: distributed tracing to
      localize the time, and suspects like fan-out, GC pauses, cold caches, a slow
      downstream, or a hot shard. Averages hide the tail; complaints are too late.
    ref: "concepts.md#the-seniority-signal-tail-latency-and-blast-radius-and-cost"

  - id: interview-method-scenario-playbooks-070
    difficulty: advanced
    tags: [cells, bulkheads, isolation]
    question: |
      What is the difference between cell-based architecture and bulkheads as
      blast-radius-reduction techniques?
    options:
      - "They are simply two different names for the exact same technique, so the choice between calling an isolation boundary a cell or a bulkhead is purely a matter of vocabulary preference"
      - "Cells partition the whole system (routing, compute, and data) into independent copies so a failure is contained to one cell's fraction of users; bulkheads isolate resource pools (e.g., separate thread/connection pools per dependency) so one saturated dependency can't exhaust resources shared with others"
      - "Bulkheads partition the user base into independent end-to-end stacks, while cells are the finer-grained mechanism that isolates individual thread and connection pools per dependency — the reverse of how the two terms are actually used"
      - "Both techniques require a multi-region deployment to provide any isolation at all, since blast-radius containment is impossible unless the independent copies live in physically separate regions"
    answer: 1
    explanation: |
      Cells are end-to-end independent stacks; a fault stays within one cell, limiting
      impact to that cell's users. Bulkheads (from the ship metaphor) isolate resource pools
      so a slow/failing dependency can't consume the shared threads/connections that other
      work needs. Both bound blast radius but at different granularities.
    ref: "concepts.md#failure-modes-and-trade-offs"

  - id: interview-method-scenario-playbooks-071
    difficulty: expert
    tags: [consensus, raft, when-to-use]
    question: |
      When is reaching for a consensus protocol (Raft/Paxos) the RIGHT tool, and when is it
      over-engineering in a design?
    options:
      - "Always route every service and every write through a consensus protocol to be safe, since a majority-agreed decision is the most reliable option and there is no real downside to applying it universally"
      - "Never reach for consensus in any modern design, because Raft and Paxos are obsolete primitives that faster eventually-consistent stores have entirely superseded for every use case"
      - "Use it where you genuinely need a single agreed value/order despite failures — leader election, replicated config/metadata, a replicated log — but avoid putting it on the high-throughput data path, where partitioning + eventual consistency or single-leader replication is cheaper and faster"
      - "Use consensus only to coordinate read-heavy cache tiers, since agreeing on a majority value is precisely the primitive needed to keep many cache replicas serving identical reads"
    answer: 2
    explanation: |
      Consensus is the right primitive for agreeing on one value/order under failures:
      leader election, cluster membership, replicated metadata, and replicated logs. But it
      requires a majority round trip per decision, so it's a poor fit for the
      high-throughput data path — there, partitioning and eventual or single-leader
      replication scale better. Matching the tool to the need is the signal.
    ref: "concepts.md#deep-dive-on-the-hard-part"

  - id: interview-method-scenario-playbooks-072
    difficulty: advanced
    tags: [method, silent-design]
    question: |
      Why is "silent design" (drawing quietly for several minutes) considered an
      anti-pattern even if the resulting design is good?
    options:
      - "Because interviewers dislike diagrams"
      - "Because silence means the design is wrong"
      - "Because you must finish faster than the allotted time"
      - "Because the interviewer can only evaluate the reasoning you verbalize; thinking out loud lets them follow your trade-offs, steer you, and give you credit for judgment they can't see otherwise"
    answer: 3
    explanation: |
      The interview grades reasoning, not just the final artifact. Silence hides your
      trade-off analysis and prevents the interviewer from steering or giving credit.
      Narrating your thinking is how the signal gets transmitted.
    ref: "concepts.md#common-anti-patterns"

  - id: interview-method-scenario-playbooks-073
    difficulty: expert
    tags: [dynamo, availability, conflict-resolution]
    question: |
      A Dynamo-style (leaderless, eventually consistent) store chooses availability during
      partitions. What extra burden does this place on the design that a single-leader
      strongly-consistent store avoids?
    options:
      - "It can accept conflicting concurrent writes on both sides of a partition, so the design must handle conflict resolution (e.g., last-write-wins with risks, vector clocks / version vectors, or CRDTs / app-level merge) — complexity a single-leader store avoids by rejecting or serializing conflicting writes"
      - "None at all; a leaderless eventually-consistent store behaves identically to a single-leader strongly-consistent one, so it adds no reconciliation or conflict-handling burden to the design"
      - "It forces the design to run a distributed two-phase commit across all replicas on every single write, so coordinator overhead is the only genuinely new burden the leaderless model introduces"
      - "It structurally cannot support more than one replica, so the design must give up redundancy entirely and keep the whole dataset on a single node to stay available during a partition"
    answer: 0
    explanation: |
      By staying available under partition, a leaderless store may accept divergent writes
      that must later be reconciled — via last-write-wins (which can silently drop data),
      version vectors, or CRDTs/app-level merge. A single-leader/strongly-consistent store
      sidesteps this by serializing or refusing conflicting writes (at an availability
      cost).
    ref: "concepts.md#failure-modes-and-trade-offs"

  - id: interview-method-scenario-playbooks-074
    difficulty: advanced
    tags: [method, defer-scope]
    question: |
      Early in scoping, a candidate lists 10 possible features. What is the most effective
      next move?
    options:
      - "Design all 10 features in equal depth to look thorough, on the reasoning that covering the widest possible breadth of functionality is what most impresses the interviewer within the time available"
      - "Pick 3-5 core functional requirements to focus on and explicitly DEFER the rest (e.g., 'I'll treat search and ads as out of scope unless you want them'), keeping the design tractable and confirming priorities with the interviewer"
      - "Ask the interviewer to choose all ten features for you, since letting them set the entire scope removes any risk of prioritizing the wrong subset of functionality on your own"
      - "Start writing the implementation code for the first feature immediately, because getting a concrete component working early is the fastest way to demonstrate real progress on the design"
    answer: 1
    explanation: |
      Explicitly narrowing to a few core FRs and deferring the rest (with the interviewer's
      buy-in) keeps the session focused and demonstrates prioritization. Trying to cover all
      ten leads to shallow breadth and no deep dive.
    ref: "concepts.md#scoping-requirements-functional-versus-non-functional"
