topic: "Microservices, Monolith and API Design"
domain: system-design
topic_slug: microservices-monolith-api-design
version: 1
questions:
  - id: microservices-monolith-api-design-001
    difficulty: beginner
    tags: [monolith, microservices, trade-offs]
    question: |
      What is the single defining property that distinguishes a microservices
      architecture from a monolith?
    options:
      - "Each service can be deployed independently of the others"
      - "Microservices are always written in different programming languages"
      - "Microservices never use relational databases"
      - "Microservices communicate only over HTTP/JSON"
    answer: 0
    explanation: |
      Independent deployability is the defining trait; database-per-service is
      what enables it. Language heterogeneity is possible but not required.
      Services can use SQL or NoSQL, and they may talk over gRPC, messaging, etc.
      — HTTP/JSON is only one option.
    ref: "concepts.md#monolith-vs-microservices-vs-modular-monolith"

  - id: microservices-monolith-api-design-002
    difficulty: beginner
    tags: [modular-monolith, definition]
    question: |
      What is a "modular monolith"?
    options:
      - "A monolith split into several separately deployed processes"
      - "A set of independently deployed microservices that all share one central database"
      - "A single deployable unit with strictly enforced internal module boundaries"
      - "A monolith that can only ever scale vertically by adding CPU and memory to one machine"
    answer: 2
    explanation: |
      A modular monolith is one deployable unit whose internal modules have clear,
      enforced interfaces (no reaching into another module's tables), giving
      boundary discipline without the network tax. Multiple deployed processes is
      microservices; microservices sharing one DB is a distributed monolith.
    ref: "concepts.md#monolith-vs-microservices-vs-modular-monolith"

  - id: microservices-monolith-api-design-003
    difficulty: beginner
    tags: [conways-law]
    question: |
      Conway's Law states that:
    options:
      - "System latency grows in direct proportion to the number of deployed services"
      - "Every distributed system eventually collapses back into a single large monolith"
      - "The number of production bugs grows quadratically with the number of engineers"
      - "Organizations design systems that mirror their own communication structure"
    answer: 3
    explanation: |
      Conway's Law says system architecture tends to mirror the org's communication
      structure — which is why service boundaries that fight the org chart cause
      constant cross-team coordination. The other statements are unrelated adages.
    ref: "concepts.md#monolith-vs-microservices-vs-modular-monolith"

  - id: microservices-monolith-api-design-004
    difficulty: beginner
    tags: [distributed-monolith, anti-pattern]
    question: |
      A team split their app into 8 services, but every feature requires deploying
      several of them together, and all 8 read and write the same shared database.
      What is this?
    options:
      - "A well-designed microservices architecture"
      - "A distributed monolith"
      - "A backend-for-frontend"
      - "A service mesh"
    answer: 1
    explanation: |
      Services that must deploy together and share a database are a distributed
      monolith: the operational cost of microservices with none of the independent
      deployability. Database-per-service and independent release cadence are the
      defining traits of real microservices.
    ref: "concepts.md#monolith-vs-microservices-vs-modular-monolith"

  - id: microservices-monolith-api-design-005
    difficulty: beginner
    tags: [ddd, bounded-context]
    question: |
      In Domain-Driven Design, which concept most naturally maps to a single
      microservice boundary?
    options:
      - "A bounded context / business capability"
      - "A single normalized database table with its foreign keys"
      - "One individual REST endpoint exposing a single resource"
      - "A single class in the object-oriented domain model"
    answer: 0
    explanation: |
      A bounded context (a business capability with a consistent domain model)
      is the natural candidate for a service. Mapping a service to one table or
      class produces chatty, low-cohesion nanoservices; an endpoint is far too fine.
    ref: "concepts.md#service-boundaries-and-domain-driven-design"

  - id: microservices-monolith-api-design-006
    difficulty: beginner
    tags: [rest, http, caching]
    question: |
      Which API style is the most cache-friendly at CDNs and HTTP proxies out of
      the box?
    options:
      - "gRPC over HTTP/2"
      - "GraphQL over a single POST endpoint"
      - "REST using HTTP GET"
      - "A custom binary TCP protocol"
    answer: 2
    explanation: |
      REST GETs are natively cacheable by HTTP infrastructure (URLs + cache
      headers). GraphQL typically POSTs to one endpoint, making HTTP caching hard;
      gRPC binary over HTTP/2 lacks mature edge caching; a custom TCP protocol has none.
    ref: "concepts.md#api-styles-rest-graphql-and-grpc"

  - id: microservices-monolith-api-design-007
    difficulty: beginner
    tags: [grpc, protobuf]
    question: |
      gRPC uses which serialization format and transport by default?
    options:
      - "Human-readable JSON text over plain HTTP/1.1 connections"
      - "XML documents wrapped in SOAP envelopes over HTTP"
      - "MessagePack binary frames over long-lived WebSocket connections"
      - "Protocol Buffers (binary) over HTTP/2"
    answer: 3
    explanation: |
      gRPC is contract-first using Protocol Buffers (binary) over HTTP/2, which
      gives compact payloads, multiplexing, and first-class streaming. The other
      combinations describe REST, SOAP, or ad-hoc stacks.
    ref: "concepts.md#api-styles-rest-graphql-and-grpc"

  - id: microservices-monolith-api-design-008
    difficulty: beginner
    tags: [graphql, over-fetching]
    question: |
      What primary client-side problem was GraphQL designed to solve?
    options:
      - "Over-fetching and under-fetching of data across multiple resources"
      - "Slow database write throughput under high concurrent load"
      - "The absence of transport-layer encryption on API traffic"
      - "The inability of REST endpoints to use HTTP response caching"
    answer: 0
    explanation: |
      GraphQL lets a client request exactly the fields it needs across resources
      in one call, solving over-fetching (too much data) and under-fetching (N+1
      round trips). It actually makes HTTP caching harder, not easier.
    ref: "concepts.md#api-styles-rest-graphql-and-grpc"

  - id: microservices-monolith-api-design-009
    difficulty: beginner
    tags: [api-gateway]
    question: |
      Which of the following is a typical responsibility of an API gateway?
    options:
      - "Hosting and storing the private database for every backend service"
      - "Running the core business logic of every downstream service in-process"
      - "Centralized authentication, rate limiting, TLS termination, and routing"
      - "Compiling and packaging client applications before they are deployed"
    answer: 2
    explanation: |
      An API gateway is a single entry point that centralizes cross-cutting
      concerns (auth, rate limiting, TLS termination, routing, aggregation). It
      should stay thin — putting business logic in it turns it into a new monolith/ESB.
    ref: "concepts.md#api-gateway-and-backend-for-frontend"

  - id: microservices-monolith-api-design-010
    difficulty: beginner
    tags: [idempotency]
    question: |
      An operation is "idempotent" if:
    options:
      - "It always executes faster the second time because results are cached"
      - "It is guaranteed never to fail once it has been accepted by the server"
      - "It is technically restricted so it can only ever be invoked a single time"
      - "Performing it multiple times has the same effect as performing it once"
    answer: 3
    explanation: |
      Idempotency means repeated execution yields the same result as a single
      execution — which is why it makes retries safe. It says nothing about speed,
      never failing, or call limits.
    ref: "concepts.md#pagination-filtering-and-idempotency-keys"

  - id: microservices-monolith-api-design-011
    difficulty: beginner
    tags: [sync-async]
    question: |
      Which communication style decouples services in time, so the producer does
      not need the consumer to be available at the moment it sends?
    options:
      - "Synchronous REST request/response"
      - "Asynchronous messaging through a broker"
      - "Synchronous gRPC unary call"
      - "A direct TCP socket connection"
    answer: 1
    explanation: |
      Asynchronous messaging via a broker buffers the message so producer and
      consumer need not be up simultaneously (temporal decoupling). All the
      synchronous/direct options require the callee to be available right now.
    ref: "concepts.md#synchronous-vs-asynchronous-inter-service-communication"

  - id: microservices-monolith-api-design-012
    difficulty: beginner
    tags: [sidecar, service-mesh]
    question: |
      In the sidecar pattern used by service meshes, the sidecar proxy:
    options:
      - "Replaces the application container entirely and runs the business logic itself"
      - "Stores the service's persistent data in a co-located embedded datastore"
      - "Compiles and hot-reloads the service's source code at runtime on each request"
      - "Runs alongside the service and handles networking concerns like mTLS, retries, and telemetry"
    answer: 3
    explanation: |
      A sidecar (e.g. Envoy) is deployed next to each service instance and handles
      cross-cutting networking — mTLS, retries, timeouts, load balancing, and
      telemetry — without changing app code. It doesn't replace the app or store data.
    ref: "concepts.md#service-mesh-and-the-sidecar-pattern"

  - id: microservices-monolith-api-design-013
    difficulty: beginner
    tags: [versioning, rest]
    question: |
      Which is an example of URI-based API versioning?
    options:
      - "GET /v2/orders"
      - "Accept: application/vnd.api.v2+json"
      - "X-API-Version: 2 header"
      - "?apiVersion=2 query parameter"
    answer: 0
    explanation: |
      `/v2/orders` puts the version in the URI path — the most visible and
      easiest-to-route approach. The others are header/media-type and query-param
      versioning strategies.
    ref: "concepts.md#api-versioning-and-evolution"

  - id: microservices-monolith-api-design-014
    difficulty: beginner
    tags: [fallacies]
    question: |
      "The network is reliable" is famously one of the:
    options:
      - "Twelve-factor app principles"
      - "SOLID principles"
      - "Fallacies of distributed computing"
      - "CAP theorem guarantees"
    answer: 2
    explanation: |
      It is the first of the eight Fallacies of Distributed Computing — false
      assumptions engineers make when moving from in-process to networked calls.
      It is unrelated to twelve-factor, SOLID, or CAP.
    ref: "concepts.md#the-fallacies-of-distributed-computing"

  - id: microservices-monolith-api-design-015
    difficulty: beginner
    tags: [when-not-to, monolith-first]
    question: |
      For a brand-new product built by a 3-person startup team with an
      un-validated domain, the generally recommended starting architecture is:
    options:
      - "One microservice per developer"
      - "A service mesh with 20 services"
      - "A fully event-sourced CQRS system"
      - "A (modular) monolith"
    answer: 3
    explanation: |
      "Monolith first": a small team with an unclear domain should start with a
      (modular) monolith because boundaries aren't known yet and ops overhead of
      microservices would crush them. The other options prematurely pay the
      distributed-systems tax.
    ref: "concepts.md#when-not-to-use-microservices"

  - id: microservices-monolith-api-design-016
    difficulty: intermediate
    tags: [pagination, performance]
    question: |
      A feed API must page through hundreds of millions of rows that are
      constantly being inserted. Users scroll infinitely (no need to jump to page
      N). Which pagination approach is best and why?
    options:
      - "Offset/limit, because it lets users jump to any page and is simplest"
      - "Cursor/keyset pagination on a stable sort key, because it is fast at any depth and stable under concurrent inserts"
      - "Load the entire result set into application memory once and slice out each page from there"
      - "Offset/limit with a very large page size to reduce the number of requests"
    answer: 1
    explanation: |
      Cursor/keyset pagination keys off the last-seen sorted key, giving
      constant-time deep paging and stability when rows are inserted/deleted.
      Offset/limit degrades at deep offsets (scan+skip) and drifts under concurrent
      writes (duplicates/skips); loading everything into memory doesn't scale.
    ref: "concepts.md#pagination-filtering-and-idempotency-keys"

  - id: microservices-monolith-api-design-017
    difficulty: intermediate
    tags: [idempotency, payments]
    question: |
      A payment API exposes `POST /charges`. A client times out and retries, but
      the first request had actually succeeded. What is the correct mechanism to
      prevent a double charge?
    options:
      - "Require an Idempotency-Key header; store the key with its result and return the stored result on repeats"
      - "Make the client wait a longer fixed interval before it is allowed to retry the charge"
      - "Switch the endpoint from POST to GET so the operation automatically becomes idempotent"
      - "Add a database unique constraint on the charge amount column to block duplicates"
    answer: 0
    explanation: |
      An idempotency key lets the server recognize a retried request and return the
      original result instead of re-executing. Waiting longer doesn't prevent
      duplicates; a charge cannot become a GET; and a unique constraint on amount
      would wrongly reject legitimate identical charges.
    ref: "concepts.md#pagination-filtering-and-idempotency-keys"

  - id: microservices-monolith-api-design-018
    difficulty: intermediate
    tags: [api-styles, decision]
    question: |
      Two internal services exchange millions of low-latency calls per minute in a
      polyglot backend, and some calls need bidirectional streaming. Which API
      style fits best?
    options:
      - "REST/JSON, for human readability and easy debugging of every internal call"
      - "GraphQL, so each internal caller can hand-pick exactly the fields it needs"
      - "gRPC with Protocol Buffers over HTTP/2"
      - "SOAP with XML envelopes and a formal WSDL contract per service"
    answer: 2
    explanation: |
      gRPC's binary protobuf over HTTP/2 gives the lowest latency, compact payloads,
      strong contracts across languages, and first-class bidirectional streaming —
      ideal for internal east-west traffic. REST/GraphQL add text overhead and
      lack native streaming; SOAP is heavyweight.
    ref: "concepts.md#api-styles-rest-graphql-and-grpc"

  - id: microservices-monolith-api-design-019
    difficulty: intermediate
    tags: [bff, mobile]
    question: |
      A company has a web app, an iOS app, and an Android app, each needing very
      different data shapes and payload sizes from the same backend services. A
      single generic API keeps becoming a coordination bottleneck. What pattern
      addresses this?
    options:
      - "Backend-for-Frontend: a tailored gateway per client type"
      - "A single shared API gateway with one response format for all clients"
      - "Direct client-to-service calls with no gateway"
      - "A service mesh installed between the mobile client apps"
    answer: 0
    explanation: |
      BFF gives each client type its own gateway that tailors aggregation and
      payloads, decoupling client teams and cutting mobile over-fetching. A single
      generic API is exactly the bottleneck described; direct calls leak topology;
      a mesh handles east-west traffic, not client-specific shaping.
    ref: "concepts.md#api-gateway-and-backend-for-frontend"

  - id: microservices-monolith-api-design-020
    difficulty: intermediate
    tags: [boundaries, anti-pattern]
    question: |
      A team creates a `Customer` service and a separate `Address` service, but
      almost every operation requires both to call each other synchronously. What
      is the most likely problem?
    options:
      - "The services are too coarse-grained and should be merged into fewer"
      - "They need a service mesh with an Envoy sidecar to speed up the inter-service calls"
      - "The boundary is wrong — high coupling / low cohesion suggests they should be one service"
      - "They should share one database so both can join each other's tables locally and skip calls"
    answer: 2
    explanation: |
      Constant synchronous chatter between two services signals a bad boundary:
      low cohesion and high coupling mean they likely belong to the same bounded
      context and should be one service. A mesh only masks the latency; a shared
      DB would create a distributed monolith.
    ref: "concepts.md#service-boundaries-and-domain-driven-design"

  - id: microservices-monolith-api-design-021
    difficulty: intermediate
    tags: [sync-async, resilience]
    question: |
      Service A calls B, which calls C, which calls D — all synchronous. C becomes
      slow. What is the classic failure mode and its first-line mitigation?
    options:
      - "Permanent data loss in D's datastore; mitigate by provisioning more read replicas of D"
      - "A split-brain partition across the chain; mitigate with a majority quorum vote on every call"
      - "A cache stampede on cold keys; mitigate by fronting the whole chain with a CDN edge cache"
      - "Cascading failure as threads pile up waiting; mitigate with timeouts, circuit breakers, and bulkheads"
    answer: 3
    explanation: |
      Deep synchronous chains compound latency and failure: when C slows, callers'
      threads block and exhaust pools, cascading upstream. Timeouts, circuit
      breakers, and bulkheads contain the blast radius. Split brain and cache
      stampede are different problems.
    ref: "concepts.md#synchronous-vs-asynchronous-inter-service-communication"

  - id: microservices-monolith-api-design-022
    difficulty: intermediate
    tags: [versioning, compatibility]
    question: |
      Which change to a JSON REST API is backward-compatible and does NOT require
      a new version?
    options:
      - "Renaming an existing field"
      - "Adding a new optional field to the response"
      - "Changing a field's type from string to integer"
      - "Making a previously optional request field required"
    answer: 1
    explanation: |
      Adding an optional field is additive and safe for existing clients that
      ignore unknown fields. Renaming, changing types, and tightening a field to
      required all break existing clients and demand a version bump.
    ref: "concepts.md#api-versioning-and-evolution"

  - id: microservices-monolith-api-design-023
    difficulty: intermediate
    tags: [service-mesh, trade-offs]
    question: |
      What is the PRIMARY cost of adopting a sidecar-based service mesh like Istio?
    options:
      - "Added per-hop latency and resource overhead, plus significant operational complexity"
      - "It forces every service in the fleet to be rewritten in a single supported language"
      - "It eliminates the ability to use mTLS, so all inter-service traffic must travel in plaintext"
      - "It requires relocating each service's persistent data into a datastore embedded in the mesh"
    answer: 0
    explanation: |
      A sidecar mesh adds proxy hops (latency), a proxy per pod (CPU/memory), and
      is itself a complex distributed system to operate. It is language-agnostic
      (a benefit), it enables mTLS rather than removing it, and it stores no data.
    ref: "concepts.md#service-mesh-and-the-sidecar-pattern"

  - id: microservices-monolith-api-design-024
    difficulty: intermediate
    tags: [graphql, n-plus-one]
    question: |
      A GraphQL server resolving a list of authors each with their books issues one
      DB query per author for books. Which problem is this and what is the standard fix?
    options:
      - "Over-fetching of columns; fix by adding more fields to each author resolver"
      - "A cache stampede on the books table; fix by fronting it with a CDN edge cache"
      - "The server-side N+1 problem; fix with batching (e.g. DataLoader)"
      - "Under-fetching of nested data; fix by splitting the query into many smaller ones"
    answer: 2
    explanation: |
      GraphQL can push the N+1 problem to the server (one query per parent). The
      standard fix is batching/caching per request with a DataLoader-style layer.
      It's not over/under-fetching (GraphQL solves those on the client) or a cache
      stampede.
    ref: "concepts.md#api-styles-rest-graphql-and-grpc"

  - id: microservices-monolith-api-design-025
    difficulty: intermediate
    tags: [database-per-service]
    question: |
      Why is "database-per-service" considered essential to true microservices?
    options:
      - "Because relational engines are technically incapable of accepting connections from two services"
      - "Because giving each service its own database always lowers total storage and licensing costs"
      - "Because a database per service guarantees ACID transactions spanning multiple services"
      - "Because private data ownership is what lets a service change its schema and deploy independently"
    answer: 3
    explanation: |
      Private data ownership decouples schemas and deploys, enabling true
      independence; a shared DB creates a distributed monolith. Databases can
      technically be shared (that's the problem), it often increases total cost,
      and it removes cross-service ACID (you need sagas instead).
    ref: "concepts.md#monolith-vs-microservices-vs-modular-monolith"

  - id: microservices-monolith-api-design-026
    difficulty: intermediate
    tags: [gateway, aggregation, mobile]
    question: |
      A mobile order screen needs data from an order service, a shipment service,
      and a profile service. Over a high-latency cellular network, what does the
      gateway aggregation pattern do and what must you guard against?
    options:
      - "It fans out to the services and combines results into one response; guard against one slow backend stalling the whole response with timeouts and partial responses"
      - "It caches the compiled mobile app bundle at the edge; guard against shipping stale client binaries"
      - "It shards the on-device mobile database by user; guard against hot partitions on popular keys"
      - "It replaces the three backend services with a single monolith; guard against increased downtime"
    answer: 0
    explanation: |
      Gateway aggregation reduces client round trips by fanning out and combining
      responses. The risk is that one slow/failed backend delays or breaks the
      aggregate, so you use per-call timeouts, circuit breakers, and partial
      responses. The other options describe unrelated mechanisms.
    ref: "concepts.md#api-gateway-and-backend-for-frontend"

  - id: microservices-monolith-api-design-027
    difficulty: intermediate
    tags: [filtering, indexing]
    question: |
      Why should a public list API expose only a whitelisted set of filter and
      sort fields rather than arbitrary field filtering?
    options:
      - "To keep request URLs shorter so they fit within the browser address-bar length limit"
      - "Because the HTTP specification forbids passing more than five query parameters per request"
      - "To avoid unindexed full-table scans and injection risks that arbitrary filters invite at scale"
      - "To force clients to send list requests as POST bodies instead of cacheable GET requests"
    answer: 2
    explanation: |
      Arbitrary filters can hit unindexed columns (full-table scans) and open
      injection vectors. Whitelisting keeps filter+sort combos backed by indexes.
      HTTP has no five-parameter limit, and this has nothing to do with URL length
      or forcing POST.
    ref: "concepts.md#pagination-filtering-and-idempotency-keys"

  - id: microservices-monolith-api-design-028
    difficulty: intermediate
    tags: [strangler-fig, migration]
    question: |
      A mature monolith needs one component extracted into a service. Which
      migration approach lets you do this incrementally and safely?
    options:
      - "Big-bang rewrite of the entire system into microservices and cut over in a single release"
      - "Freeze all feature development across the whole team until the extraction is fully complete"
      - "Duplicate the monolith into two copies and delete half of the code from each of the copies"
      - "Strangler fig: route new/relevant traffic to the new service and migrate incrementally"
    answer: 3
    explanation: |
      The strangler fig pattern incrementally routes traffic to the new service
      while the monolith keeps serving the rest, minimizing risk. A big-bang
      rewrite is high-risk; freezing development stalls the business; duplicating
      the monolith just creates two monoliths.
    ref: "concepts.md#when-not-to-use-microservices"

  - id: microservices-monolith-api-design-029
    difficulty: intermediate
    tags: [rest, http-methods, idempotency]
    question: |
      Among standard HTTP methods, which is NOT inherently idempotent and therefore
      most often needs an idempotency key for safe retries?
    options:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
    answer: 1
    explanation: |
      GET, PUT, and DELETE are defined to be idempotent (repeating them yields the
      same state). POST creates a new resource each time by default, so it is where
      idempotency keys matter most (e.g. avoiding duplicate charges/orders).
    ref: "concepts.md#pagination-filtering-and-idempotency-keys"

  - id: microservices-monolith-api-design-030
    difficulty: intermediate
    tags: [async, load-leveling]
    question: |
      Which benefit is UNIQUE to asynchronous, broker-based communication compared
      to synchronous request/response?
    options:
      - "Immediate return of the final computed result to the caller within the same request"
      - "Simpler linear stack traces that follow the whole flow across services during debugging"
      - "Guaranteed exactly-once delivery end to end with no idempotency effort on the consumer"
      - "Load leveling: the broker absorbs traffic spikes so consumers process at their own pace"
    answer: 3
    explanation: |
      A broker buffers messages, smoothing spikes (load leveling) and decoupling
      producer/consumer availability. Async does NOT return the final result
      immediately (that's sync), it makes debugging harder (no linear trace), and
      exactly-once still requires idempotent consumers.
    ref: "concepts.md#synchronous-vs-asynchronous-inter-service-communication"

  - id: microservices-monolith-api-design-031
    difficulty: intermediate
    tags: [team-scale, conways-law]
    question: |
      Which situation is the STRONGEST justification for moving from a monolith to
      microservices?
    options:
      - "Many teams are constantly blocked waiting on each other's deploys, and components have very different scaling needs"
      - "The team wants to try a trendy architecture that looks good on their resumes"
      - "The codebase compiles slowly on a single developer laptop during local builds"
      - "The single shared database occasionally runs one slow, unoptimized reporting query"
    answer: 0
    explanation: |
      Microservices primarily solve organizational scaling: many teams contending
      for one deploy pipeline plus divergent scaling profiles is the textbook
      trigger. Trend-chasing, slow compiles, and one slow query are addressed far
      more cheaply than by paying the distributed-systems tax.
    ref: "concepts.md#monolith-vs-microservices-vs-modular-monolith"

  - id: microservices-monolith-api-design-032
    difficulty: intermediate
    tags: [gateway, single-point-of-failure]
    question: |
      What is the main architectural risk of an API gateway and how is it usually
      mitigated?
    options:
      - "It encrypts too much traffic and wastes CPU; mitigate by disabling TLS on the gateway hop"
      - "It becomes the durable store for all service data; mitigate with frequent gateway backups"
      - "It is a potential single point of failure and bottleneck; mitigate by running it highly available and horizontally scaled, keeping it thin"
      - "It forces every downstream call to be synchronous; mitigate by removing the gateway entirely"
    answer: 2
    explanation: |
      Because all traffic flows through it, the gateway can be a SPoF and
      bottleneck; the fix is HA + horizontal scaling and keeping it thin (no
      business logic). It doesn't store service data, and disabling TLS is a
      security regression, not a mitigation.
    ref: "concepts.md#api-gateway-and-backend-for-frontend"

  - id: microservices-monolith-api-design-033
    difficulty: intermediate
    tags: [ddd, aggregate, consistency]
    question: |
      In DDD, an "aggregate" is best described as:
    options:
      - "A loose collection of unrelated microservices grouped only by team ownership"
      - "The in-memory response cache maintained by the API gateway across requests"
      - "A denormalized read model built specifically for fast dashboard queries"
      - "A cluster of objects treated as one unit for data changes, with a single root, often the unit of transactional consistency"
    answer: 3
    explanation: |
      An aggregate is a consistency boundary: a cluster of objects with one root,
      changed atomically. It often defines what a service owns transactionally.
      It is not a group of services, a gateway cache, or specifically a read model
      (that's closer to a CQRS materialized view).
    ref: "concepts.md#service-boundaries-and-domain-driven-design"

  - id: microservices-monolith-api-design-034
    difficulty: intermediate
    tags: [fallacies, latency]
    question: |
      "Latency is zero" is a distributed-computing fallacy. In practice, roughly
      how does a remote network call compare to an in-process function call?
    options:
      - "About the same, since modern datacenter networks are effectively instantaneous"
      - "Around a million times slower (nanoseconds vs milliseconds)"
      - "Around 10x slower, roughly the gap between L1 cache and main-memory access"
      - "Actually faster than an in-process call, thanks to HTTP/2 stream multiplexing"
    answer: 1
    explanation: |
      An in-process call is ~nanoseconds; a network round trip is ~milliseconds —
      roughly six orders of magnitude slower. This is why chatty cross-service
      designs (N+1 remote calls) devastate performance. HTTP/2 helps but doesn't
      erase network latency.
    ref: "concepts.md#the-fallacies-of-distributed-computing"

  - id: microservices-monolith-api-design-035
    difficulty: intermediate
    tags: [versioning, protobuf, grpc]
    question: |
      When evolving a Protocol Buffers message used by gRPC services, which rule
      preserves wire compatibility?
    options:
      - "Never change or reuse existing field numbers; add new fields with new numbers"
      - "Reuse the field numbers of deleted fields for new fields to keep the numbering compact"
      - "Change existing field types freely, as long as each field keeps its original name"
      - "Delete obsolete fields and renumber all remaining fields sequentially from one"
    answer: 0
    explanation: |
      Protobuf compatibility hinges on field numbers, not names. You must never
      reuse or change existing numbers; add new fields with fresh numbers and treat
      removed numbers as reserved. Reusing numbers or changing types corrupts
      decoding for peers on older schemas.
    ref: "concepts.md#api-versioning-and-evolution"

  - id: microservices-monolith-api-design-036
    difficulty: intermediate
    tags: [modular-monolith, decision]
    question: |
      Why is a modular monolith often the recommended default over microservices
      for a growing but still-small engineering org?
    options:
      - "It guarantees strictly higher runtime latency than an equivalent microservices deployment"
      - "It removes the need for any automated testing of the internal module boundaries"
      - "It provides boundary discipline and a clean seam to extract services later, without paying the network and ops tax now"
      - "It makes eventual consistency mandatory across every internal module interaction"
    answer: 2
    explanation: |
      A modular monolith gets most of the boundary discipline of microservices
      (enforced module interfaces) while keeping in-process calls and one deploy,
      and it leaves a clean seam for later extraction. It actually has better
      latency than microservices and doesn't force eventual consistency.
    ref: "concepts.md#monolith-vs-microservices-vs-modular-monolith"

  - id: microservices-monolith-api-design-037
    difficulty: intermediate
    tags: [sync-async, decision]
    question: |
      During checkout, the user must see an immediate "payment accepted" before
      proceeding, but receipts, analytics, and fulfillment can happen later. What
      communication design is most appropriate?
    options:
      - "Synchronous call for the payment authorization, then asynchronous events for receipts, analytics, and fulfillment"
      - "Do everything synchronously so the user waits for receipts, analytics, and fulfillment before the page proceeds"
      - "Use asynchronous messaging for the payment authorization too, returning to the user before the charge is confirmed"
      - "Poll the payment service every second from the client until fulfillment completes"
    answer: 0
    explanation: |
      The user is blocked only on payment authorization, so that stays synchronous;
      everything that can happen "eventually" fans out asynchronously for
      decoupling and resilience. Making the whole flow sync harms latency/resilience;
      making auth async breaks the immediate-result requirement; polling wastes resources.
    ref: "concepts.md#synchronous-vs-asynchronous-inter-service-communication"

  - id: microservices-monolith-api-design-038
    difficulty: intermediate
    tags: [when-not-to, ops-maturity]
    question: |
      A 6-person team without CI/CD, container orchestration, centralized logging,
      or distributed tracing wants to launch 20 microservices. What is the best advice?
    options:
      - "Proceed; microservices will force them to build those capabilities"
      - "Add a service mesh like Istio first, so its sidecars supply the missing CI/CD, logging, and tracing automatically"
      - "They lack the operational maturity; start with a modular monolith until the platform and domain are ready"
      - "Adopt GraphQL as the transport, since its typed schema removes any need for distributed tracing across the 20 services"
    answer: 2
    explanation: |
      Microservices require CI/CD, orchestration, centralized logs, and tracing;
      without them you get outages you can't debug. A small team should start with
      a modular monolith. A mesh adds more to operate, not less, and GraphQL does
      not remove the need for distributed tracing.
    ref: "concepts.md#when-not-to-use-microservices"

  - id: microservices-monolith-api-design-039
    difficulty: intermediate
    tags: [grpc, browser]
    question: |
      What is a key limitation of using plain gRPC directly from a web browser?
    options:
      - "Browsers cannot make HTTPS requests, so gRPC's mandatory TLS encryption is unsupported in the browser sandbox"
      - "gRPC has no authentication mechanism, so browser calls would travel completely unauthenticated over the public internet"
      - "gRPC connections cannot be placed behind load balancers, so a single backend instance must serve every browser client"
      - "Browsers cannot natively speak the gRPC wire protocol, so you need gRPC-Web plus a proxy"
    answer: 3
    explanation: |
      Browsers can't fully control HTTP/2 frames as gRPC requires, so browser
      clients use gRPC-Web through a translating proxy (e.g. Envoy). Browsers
      obviously do HTTPS, and gRPC supports auth and load balancing.
    ref: "concepts.md#api-styles-rest-graphql-and-grpc"

  - id: microservices-monolith-api-design-040
    difficulty: intermediate
    tags: [decomposition, anti-pattern]
    question: |
      Decomposing a system into a "UI service," a "business-logic service," and a
      "data-access service" is an anti-pattern because:
    options:
      - "Technical-layer services always scale more efficiently than business-capability services because each layer uses uniform hardware"
      - "Almost every feature spans all three layers, forcing lockstep deploys and re-creating the monolith across the network"
      - "It creates far too few services, and microservices are only beneficial once you exceed roughly a dozen separate deployables"
      - "HTTP cannot carry calls between architectural layers, so the three services would be unable to communicate at all"
    answer: 1
    explanation: |
      Layered/technical decomposition means every feature cuts across all layers,
      so services must be deployed together — a distributed monolith. Services
      should be split by business capability so a feature lives mostly in one service.
    ref: "concepts.md#service-boundaries-and-domain-driven-design"

  - id: microservices-monolith-api-design-041
    difficulty: advanced
    tags: [saga, consistency, distributed-transaction]
    question: |
      An order workflow spans Order, Payment, and Inventory services, each with its
      own database, and you need overall consistency without a global lock. What is
      the standard pattern, and what does it give up compared to a single ACID
      transaction?
    options:
      - "A saga of local transactions with compensating actions; gives up atomic isolation, accepting eventual consistency and visible intermediate states"
      - "Two-phase commit coordinated across all three service databases; gives up nothing since the prepare/commit phases stay fully atomic"
      - "A single shared database with one enclosing transaction across the three services; gives up only service independence and nothing else"
      - "Client-side optimistic locking with a version check on each entity; gives up nothing because conflicting writes simply retry transparently"
    answer: 0
    explanation: |
      With database-per-service you can't use one ACID transaction, so you use a
      saga: a sequence of local transactions with compensating actions to undo on
      failure. The trade-off is loss of isolation/atomicity — intermediate states
      are visible and consistency is eventual. 2PC is avoided for availability/
      coupling reasons; a shared DB destroys independence.
    ref: "concepts.md#synchronous-vs-asynchronous-inter-service-communication"

  - id: microservices-monolith-api-design-042
    difficulty: advanced
    tags: [idempotency, concurrency]
    question: |
      Two requests carrying the SAME idempotency key arrive concurrently at a
      payment service. What is the correct way to ensure only one charge happens?
    options:
      - "Process both charges immediately and run a nightly reconciliation job to detect and refund the duplicate afterward"
      - "Reject both requests with a 409 Conflict whenever a duplicate key is seen, forcing the client to generate a fresh key"
      - "Use a unique constraint or lock on the key so exactly one request commits and the other returns the stored/first result"
      - "Increase the request timeout window so the two duplicate calls are unlikely to arrive close enough to overlap"
    answer: 2
    explanation: |
      Concurrent duplicate keys must be serialized via a DB unique constraint or
      lock so only the first commits (with its result stored) and the second reads
      that result. Processing both risks a double charge; rejecting both breaks the
      legitimate request; timeouts don't solve concurrency.
    ref: "concepts.md#pagination-filtering-and-idempotency-keys"

  - id: microservices-monolith-api-design-043
    difficulty: advanced
    tags: [idempotency, atomicity, crash]
    question: |
      To implement idempotency keys safely against crashes, the first request's
      side effect and the recording of its idempotency key should be:
    options:
      - "Written in two separate transactions, committing the side effect first and then recording the key in a follow-up transaction"
      - "Never persisted to durable storage; kept only in an in-memory cache for speed and discarded when the process restarts"
      - "Recorded only after the client sends an explicit acknowledgement confirming it received the successful response"
      - "Committed atomically in the same transaction so a crash can't leave the effect without the key or vice-versa"
    answer: 3
    explanation: |
      If the effect and the key are committed separately, a crash between them
      leaves an inconsistent state (effect without a recorded key -> a retry
      re-executes; or key without effect -> retry returns a non-existent result).
      Committing both atomically prevents this. In-memory-only loses the guarantee
      on restart.
    ref: "concepts.md#pagination-filtering-and-idempotency-keys"

  - id: microservices-monolith-api-design-044
    difficulty: advanced
    tags: [graphql, security, cost]
    question: |
      Exposing a public GraphQL endpoint introduces which risk not present in a
      typical REST API, and what mitigations apply?
    options:
      - "Arbitrarily deep/expensive queries can overwhelm the backend; mitigate with query depth limits, cost analysis, and persisted queries"
      - "Chronic over-fetching of fields on every call; mitigate by adding cursor-based pagination to each list resolver"
      - "The complete absence of a machine-readable schema; mitigate by hand-writing an OpenAPI specification alongside it"
      - "An inability to authenticate any caller at all; mitigate by issuing static API keys to each registered client"
    answer: 0
    explanation: |
      Because clients compose queries, a malicious or naive deeply-nested query can
      be very expensive. Defenses include depth limiting, query cost analysis, and
      persisted/allow-listed queries. GraphQL reduces over-fetching, is strongly
      typed (has a schema), and supports auth.
    ref: "concepts.md#api-styles-rest-graphql-and-grpc"

  - id: microservices-monolith-api-design-045
    difficulty: advanced
    tags: [versioning, stripe, evolution]
    question: |
      Stripe pins each account to the API version in effect when it integrated and
      transforms newer internal responses back to that shape. What is the primary
      benefit and the primary cost of this date/account-based versioning?
    options:
      - "Benefit: zero server-side versioning code to maintain; cost: every integrated client must upgrade its pinned version weekly"
      - "Benefit: it removes any need for backward compatibility work; cost: it adds measurable latency to every single API request"
      - "Benefit: clients never break as Stripe evolves continuously; cost: Stripe must maintain response transformers/compatibility shims for every historical version"
      - "Benefit: it eliminates all breaking changes across the API forever; cost: no genuinely new fields or features can ever be added"
    answer: 2
    explanation: |
      Pinning + transformation lets Stripe ship changes continuously while existing
      integrations keep seeing their original shapes — clients don't break. The
      cost is maintaining transformation layers across many historical versions
      indefinitely. It doesn't remove the need for compat work; that's exactly what
      it institutionalizes.
    ref: "concepts.md#api-versioning-and-evolution"

  - id: microservices-monolith-api-design-046
    difficulty: advanced
    tags: [service-mesh, decision]
    question: |
      A company runs 8 services, all written in one language, on Kubernetes, with
      modest security needs. Leadership wants to adopt Istio because "everyone
      uses a mesh." What is the best-reasoned recommendation?
    options:
      - "Adopt Istio immediately, because any fleet of more than a handful of services always requires a full service mesh"
      - "Rewrite the services across several different languages first, so the mesh's polyglot support becomes worth its overhead"
      - "Drop Kubernetes entirely and redeploy the eight services onto bare-metal hosts to avoid the mesh question altogether"
      - "A shared client library (retries, timeouts, mTLS) is likely cheaper here; a full mesh's latency and operational overhead may not be justified at this scale"
    answer: 3
    explanation: |
      With few services in a single language, a shared resilience/networking
      library delivers most benefits without the mesh's per-hop latency and heavy
      ops burden. A mesh shines with many polyglot services and strong security/
      observability needs. Adopting it "because everyone does" is resume-driven.
    ref: "concepts.md#service-mesh-and-the-sidecar-pattern"

  - id: microservices-monolith-api-design-047
    difficulty: advanced
    tags: [boundaries, uber, doma]
    question: |
      Uber moved from a very large number of tiny services toward Domain-Oriented
      Microservice Architecture (DOMA). What problem was this primarily addressing?
    options:
      - "Too few services to absorb their traffic, so they added many more fine-grained services to spread the load further"
      - "Over-decomposition — too many fine-grained services created excessive coordination and coupling, so services were grouped into coarser domains with layered gateways"
      - "A decision to abandon services entirely and consolidate the whole platform back into a single large monolith"
      - "A desire to remove all API gateways from the platform and have clients call each backend service directly instead"
    answer: 1
    explanation: |
      DOMA groups services into coarser domains with clear layered gateways to tame
      the coordination and coupling cost of having too many fine-grained services.
      It's neither a return to a monolith nor a removal of gateways, and the issue
      was too many services, not too few.
    ref: "concepts.md#service-boundaries-and-domain-driven-design"

  - id: microservices-monolith-api-design-048
    difficulty: advanced
    tags: [pagination, estimation, offset]
    question: |
      A table has 50 million rows and a query uses `OFFSET 49,000,000 LIMIT 20`
      with an index on the sort column. Why is this slow, and what is the fix?
    options:
      - "The existing index is being ignored by the planner; add a second composite index on the sort column to force its use"
      - "A LIMIT of 20 rows is too small to amortize the query cost; raise it to a few thousand rows per page instead"
      - "The table is over-normalized for this access pattern; denormalize the joined columns into it so no traversal is needed"
      - "The database must still traverse/skip ~49M index entries before returning 20 rows; switch to keyset pagination using the last seen key"
    answer: 3
    explanation: |
      Even with an index, OFFSET forces the engine to walk and discard all rows
      before the offset, so deep offsets scale with the offset size. Keyset/cursor
      pagination (`WHERE (sort_key) > last_seen`) jumps straight to the position in
      near-constant time. More indexes or larger limits don't fix the skip cost.
    ref: "concepts.md#pagination-filtering-and-idempotency-keys"

  - id: microservices-monolith-api-design-049
    difficulty: advanced
    tags: [async, exactly-once, delivery]
    question: |
      A colleague insists their message broker gives "exactly-once delivery." What
      is the accurate framing for building correct systems?
    options:
      - "Exactly-once delivery over a network is effectively impossible; you get at-least-once delivery plus idempotent processing, yielding effectively-once semantics"
      - "Exactly-once delivery is trivially achievable at the broker, so the consumer needs to do no deduplication work at all"
      - "At-most-once delivery is the only safe choice for every system, even critical paths, because duplicates are always worse than loss"
      - "Strong ordering guarantees from the broker make consumer-side idempotency completely unnecessary against retries"
    answer: 0
    explanation: |
      True exactly-once network delivery is unattainable; practical systems combine
      at-least-once delivery with idempotent consumers to achieve effectively-once
      processing. At-most-once risks data loss for critical paths, and ordering
      guarantees don't remove the need for idempotency against duplicates/retries.
    ref: "concepts.md#synchronous-vs-asynchronous-inter-service-communication"

  - id: microservices-monolith-api-design-050
    difficulty: advanced
    tags: [when-not-to, segment, consolidation]
    question: |
      Segment famously consolidated ~140 microservices back into a monolith. What
      was the core lesson for choosing an architecture?
    options:
      - "Microservices are always the wrong choice and should be avoided by every engineering team regardless of scale or context"
      - "Monoliths are fundamentally incapable of scaling to any real production traffic and must be decomposed before launch"
      - "For a small team, the operational overhead of many services (dependency management, per-service tooling, testing) can outweigh the benefits, making a monolith the better fit"
      - "A service should never privately own its own data; all services ought to read and write from one shared central database"
    answer: 2
    explanation: |
      Segment found that maintaining ~140 services with a small team created
      crushing operational overhead relative to the benefits, so consolidating made
      sense. The lesson is fit-for-context, not that microservices are universally
      wrong or that monoliths can't scale.
    ref: "concepts.md#when-not-to-use-microservices"

  - id: microservices-monolith-api-design-051
    difficulty: advanced
    tags: [gateway, aggregation, design]
    question: |
      When gateway-side aggregation starts requiring real domain logic and
      long-running orchestration, the recommended design is to:
    options:
      - "Embed the domain logic and long-running orchestration directly in the API gateway so it lives in one central place"
      - "Push the orchestration out to each client so every caller sequences the underlying service calls on its own"
      - "Merge all of the backend services into a single service so that no cross-service aggregation is ever required"
      - "Move aggregation into a dedicated aggregation service behind the gateway, keeping the gateway thin (routing/auth/lightweight shaping)"
    answer: 3
    explanation: |
      Heavy domain logic in the gateway turns it into a monolith/ESB with different
      scaling needs and a growing SPoF. Put orchestration in a dedicated service
      behind a thin gateway. Pushing orchestration to clients re-creates chatty
      round trips; merging services throws away independence.
    ref: "concepts.md#api-gateway-and-backend-for-frontend"

  - id: microservices-monolith-api-design-052
    difficulty: advanced
    tags: [fallacies, topology, discovery]
    question: |
      Which design decision directly addresses the fallacy "topology doesn't
      change" in an autoscaling microservices environment?
    options:
      - "Hardcoding each downstream service's IP address in static config and redeploying callers whenever an instance changes"
      - "Using service discovery / DNS-based resolution so callers find live instances as they come and go"
      - "Disabling health checks so the registry stops churning as instances scale up and down under autoscaling"
      - "Pinning all inter-service traffic to one long-lived instance so its address never has to be re-resolved"
    answer: 1
    explanation: |
      Instances constantly appear/disappear with autoscaling and failures, so
      callers must resolve endpoints dynamically via service discovery rather than
      hardcoding hosts. Hardcoding IPs, disabling health checks, or pinning to one
      instance all fight the changing topology and reduce resilience.
    ref: "concepts.md#the-fallacies-of-distributed-computing"

  - id: microservices-monolith-api-design-053
    difficulty: advanced
    tags: [consistency, boundaries, decision]
    question: |
      A core banking ledger requires strict, immediate consistency across account
      balances and transaction records. How should this influence service
      decomposition?
    options:
      - "Keep tightly-coupled, strongly-consistent entities within one service/aggregate/DB so ACID transactions apply, rather than forcing eventual consistency across services"
      - "Split balances and transactions into separate services and stitch them together with an orchestrated saga and compensating refunds"
      - "Adopt eventual consistency everywhere across the ledger, since banking systems reconcile balances well enough after the fact"
      - "Place the core ledger and balance-update logic inside the API gateway so every request passes through one consistent point"
    answer: 0
    explanation: |
      When strong cross-entity consistency is essential, keeping those entities in
      one service/aggregate lets you use ACID transactions — a genuine feature of
      the monolithic approach. Splitting them forces sagas/eventual consistency,
      which ledgers tolerate poorly. Business logic never belongs in the gateway.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: microservices-monolith-api-design-054
    difficulty: advanced
    tags: [rest, graphql, caching, decision]
    question: |
      A public content API serves mostly read-heavy, cacheable requests to
      millions of anonymous users, and CDN offload is critical to cost. REST or
      GraphQL, and why?
    options:
      - "GraphQL, because clients can hand-pick fields and CDN caching stops mattering once traffic is large enough to dominate"
      - "GraphQL, because its single typed query always uses strictly less bandwidth per request than an equivalent REST call"
      - "REST with cacheable GETs, because HTTP/CDN caching offloads the read-heavy traffic; GraphQL's single POST endpoint makes edge caching much harder"
      - "REST, but only because GraphQL is technically unable to express read queries against a content backend at all"
    answer: 2
    explanation: |
      For read-heavy anonymous traffic where CDN offload drives cost down, REST's
      cacheable GETs are a big win, while GraphQL's POST-to-one-endpoint model makes
      HTTP caching hard (needing persisted queries/special tooling). GraphQL's
      field selection doesn't help if you can't cache; it can express queries fine.
    ref: "concepts.md#api-styles-rest-graphql-and-grpc"

  - id: microservices-monolith-api-design-055
    difficulty: advanced
    tags: [boundaries, refactoring, cost]
    question: |
      Why is getting a service boundary wrong far more expensive to fix in
      microservices than getting a module boundary wrong in a monolith?
    options:
      - "Fixing a service boundary means a data migration, an API contract change, and often a dual-write period, whereas a monolith module move is a compiler-assisted refactor"
      - "Because microservices are architecturally frozen after their first deploy and contain no code that can ever be safely refactored"
      - "Because a monolith has no internal module boundaries at all, so there is never any boundary a team could get wrong to begin with"
      - "Because the compiler flatly refuses to build any project structured as microservices until they are merged back into one unit"
    answer: 0
    explanation: |
      Moving responsibility between services requires migrating data across
      databases, changing network contracts, and coordinating a transition — vastly
      costlier than a compiler-checked in-repo refactor. This is a core reason to
      defer decomposition until the domain is well understood.
    ref: "concepts.md#service-boundaries-and-domain-driven-design"

  - id: microservices-monolith-api-design-056
    difficulty: advanced
    tags: [sync-async, backpressure, resilience]
    question: |
      A downstream service can process 1,000 req/s but upstream bursts to 10,000
      req/s. Comparing synchronous calls with backpressure vs an async queue, which
      statement is most accurate?
    options:
      - "Synchronous calls automatically buffer the excess 9,000 req/s in the caller's TCP socket queue and replay them later with no data loss whatsoever"
      - "Async queues always guarantee strictly lower end-to-end latency than synchronous calls, because the broker delivers each message the instant it is enqueued"
      - "An async queue absorbs the burst and lets the consumer drain at 1,000/s, at the cost of added latency and eventual consistency; synchronous calls would shed load or time out unless throttled"
      - "Both behave identically under load, since the total number of requests processed per second is fixed by the consumer either way"
    answer: 2
    explanation: |
      A queue provides load leveling — it holds the burst so the consumer drains at
      its rate, trading immediacy for resilience and eventual consistency. Sync
      calls have no inherent buffer; without throttling/backpressure they overload,
      shed, or time out. Async doesn't guarantee lower latency (often higher).
    ref: "concepts.md#synchronous-vs-asynchronous-inter-service-communication"

  - id: microservices-monolith-api-design-057
    difficulty: advanced
    tags: [service-mesh, modern, ebpf]
    question: |
      What is the goal of newer "sidecar-less" service mesh approaches such as
      Istio Ambient mode or Cilium (eBPF-based)?
    options:
      - "To remove mTLS from the data path entirely so that inter-service traffic runs unencrypted and skips the certificate-handshake cost on every hop"
      - "To force all services in the fleet onto a single supported language so the mesh can compile one shared networking runtime into each of them"
      - "To replace Kubernetes as the orchestrator, taking over pod scheduling and node management directly from the kernel via eBPF programs"
      - "To reduce the per-pod sidecar resource and latency overhead by moving networking functions into shared node-level components or the kernel (eBPF)"
    answer: 3
    explanation: |
      Sidecar-less/ambient meshes aim to cut the per-pod sidecar tax (CPU/memory
      and extra hops) by handling functions at the node level or in the kernel via
      eBPF, while keeping mesh features like mTLS and observability. They neither
      remove security nor mandate a language nor replace Kubernetes.
    ref: "concepts.md#service-mesh-and-the-sidecar-pattern"

  - id: microservices-monolith-api-design-058
    difficulty: advanced
    tags: [versioning, consumer-driven-contracts]
    question: |
      In an internal microservices ecosystem where you control both providers and
      consumers, which technique best prevents a provider from unknowingly breaking
      its consumers?
    options:
      - "Only ever bump the URI version (e.g. /v3/) on the provider and trust that every consumer notices and migrates itself before the old path is retired"
      - "Consumer-driven contract testing (e.g. Pact): providers verify against the expectations captured by each known consumer"
      - "Never change any service after its first launch, freezing every provider's schema permanently so no consumer can ever be broken"
      - "Rely on a manual QA team to click through every consumer's flows and sign off before each provider deploy ships to production"
    answer: 1
    explanation: |
      Consumer-driven contracts capture each consumer's expectations and let the
      provider's CI verify it hasn't broken them — ideal when you control both
      sides. URI bumping doesn't detect breakage, freezing services is impractical,
      and manual QA doesn't scale or catch contract drift reliably.
    ref: "concepts.md#api-versioning-and-evolution"

  - id: microservices-monolith-api-design-059
    difficulty: advanced
    tags: [estimation, microservices, ops-cost]
    question: |
      Moving from a 1-service monolith to 50 microservices, which operational cost
      grows roughly linearly with the number of services and is often
      underestimated?
    options:
      - "The number of independent CI/CD pipelines, dashboards, on-call runbooks, and dependency sets to patch"
      - "The number of physical CPU cores installed in a single application server, which must be doubled for each service you add"
      - "The maximum permitted size of a single HTTP request header, which shrinks proportionally as more services are introduced"
      - "The client device's screen resolution, since each additional microservice renders its own fragment of the mobile UI"
    answer: 0
    explanation: |
      Each service adds its own pipeline, dashboards, runbooks, alerts, and
      dependencies to patch — operational surface scales with service count and is
      the classic underestimated cost, often requiring a dedicated platform team.
      The other options are unrelated to service count.
    ref: "concepts.md#monolith-vs-microservices-vs-modular-monolith"

  - id: microservices-monolith-api-design-060
    difficulty: advanced
    tags: [fallacies, security, zero-trust]
    question: |
      Which fallacy motivates adopting mutual TLS and per-request authorization
      between internal services (zero-trust networking)?
    options:
      - "Bandwidth is infinite"
      - "There is one administrator"
      - "The network is secure"
      - "The network is homogeneous"
    answer: 2
    explanation: |
      Assuming "the network is secure" leads to unencrypted, unauthenticated
      east-west traffic; zero-trust (mTLS + authz on every call) counters it. The
      other fallacies motivate paging/compression, expecting version skew, and
      defensive interoperability respectively.
    ref: "concepts.md#the-fallacies-of-distributed-computing"

  - id: microservices-monolith-api-design-061
    difficulty: advanced
    tags: [bff, trade-offs]
    question: |
      What is the PRIMARY downside of adopting a Backend-for-Frontend per client
      type, and when is it therefore NOT worth it?
    options:
      - "It collapses every client's logic into one shared central gateway that all clients must route through; not worth it once you have many different client types"
      - "It structurally prevents any per-client payload tailoring, forcing one uniform response shape; therefore it is never worth adopting for bandwidth-sensitive mobile clients"
      - "It forces every downstream call to be synchronous request/response and blocks all event streaming; not worth it for real-time or streaming-heavy workloads"
      - "It duplicates cross-cutting logic (auth, common aggregation) across N gateways; not worth it when clients' needs are very similar"
    answer: 3
    explanation: |
      BFF's cost is maintaining N gateways with duplicated concerns; it pays off
      only when client needs genuinely diverge. If web/iOS/Android need nearly the
      same data, a single tailored API avoids the duplication. BFF enables (not
      prevents) tailoring and doesn't dictate the transport.
    ref: "concepts.md#api-gateway-and-backend-for-frontend"

  - id: microservices-monolith-api-design-062
    difficulty: advanced
    tags: [decision, scenario, comprehensive]
    question: |
      A startup's single monolith is healthy, but ML-based recommendations need
      GPUs and scale on a completely different curve than the web app, and a
      separate ML team owns them. What is the most surgical, well-justified move?
    options:
      - "Extract just the recommendations component into its own service (independent scaling on GPUs, independent team ownership) via strangler fig, leaving the rest a monolith"
      - "Rewrite the entire healthy monolith into a full suite of microservices so the whole platform is architecturally consistent end to end"
      - "Keep everything inside the single monolith and attach expensive GPUs to every web server in the fleet so recommendations can run anywhere"
      - "Split the monolith into one microservice per database table so each table can be scaled and deployed on its own independently"
    answer: 0
    explanation: |
      Extract only the component with a distinct scaling profile and separate team
      ownership; this is precisely when a targeted split pays off, done
      incrementally via strangler fig. A full rewrite is unjustified, GPU-per-web-
      server wastes money, and per-table splitting creates a distributed monolith.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: microservices-monolith-api-design-063
    difficulty: expert
    tags: [saga, orchestration-vs-choreography]
    question: |
      For a complex, multi-step order saga where you need clear visibility into the
      workflow state and centralized error handling, which saga coordination style
      is generally preferable, and what do you trade off?
    options:
      - "Choreography (each service reacts autonomously to events); you trade away all workflow visibility yet somehow still gain a central coordinator that dictates every step"
      - "Two-phase commit across the participating databases; you trade away nothing at all, since the blocking prepare/commit phases give both atomicity and full availability"
      - "Orchestration (a central coordinator directs each step); you trade some coupling to the orchestrator for clearer control flow, easier monitoring, and centralized compensation logic"
      - "No coordination of any kind is needed for sagas, because each local transaction commits independently and the workflow simply converges on its own"
    answer: 2
    explanation: |
      Orchestration uses a central coordinator, making complex flows observable and
      error handling/compensation centralized, at the cost of coupling to the
      orchestrator and it being a potential bottleneck. Choreography is more
      decoupled but harder to reason about for complex flows; 2PC is a different
      (blocking) mechanism, and sagas do require coordination.
    ref: "concepts.md#synchronous-vs-asynchronous-inter-service-communication"

  - id: microservices-monolith-api-design-064
    difficulty: expert
    tags: [cdc, data-sharing, dual-write]
    question: |
      Two services must not share a database, yet the search service needs
      near-real-time copies of order data owned by the order service. The naive
      approach — the order service writing to its DB and also publishing an event
      in application code — suffers the "dual-write problem." What is the robust fix?
    options:
      - "Just retry the event publish in application code until it eventually succeeds, so a failed broker write is always recovered on a later attempt"
      - "Let the search service connect to and read the order service's database directly, keeping its index fresh without any events at all"
      - "Use a two-phase commit that spans the order database and the message broker so both the DB write and the publish either commit together or roll back together"
      - "Use the transactional outbox pattern (or log-based CDC): write the event to an outbox table in the same DB transaction, then relay it to the broker, so the DB write and event can't diverge"
    answer: 3
    explanation: |
      Dual writes (DB + broker) can partially fail, leaving them inconsistent. The
      outbox pattern writes the event atomically with the state change in one DB
      transaction, and a relay/CDC process (e.g. Debezium reading the log) publishes
      it — guaranteeing they agree. Retries alone don't fix atomicity, direct DB
      reads create a distributed monolith, and DB+broker 2PC is fragile/unsupported.
    ref: "concepts.md#synchronous-vs-asynchronous-inter-service-communication"

  - id: microservices-monolith-api-design-065
    difficulty: expert
    tags: [api-composition, cqrs, query]
    question: |
      A query must join data owned by five different services. The API-composition
      pattern (gateway/service calls each and joins in memory) works but is slow and
      fragile for this hot path. What is the more scalable alternative and its cost?
    options:
      - "Give the query service direct read access to all five underlying databases so it can run a single SQL join across them and skip the in-memory composition entirely"
      - "Maintain a CQRS read model / materialized view fed by the services' events, queryable in one place; cost is eventual consistency and the complexity of maintaining the projection"
      - "Cache the composed API-composition result in the client indefinitely, so after the first call the expensive multi-service join never has to run again"
      - "Merge all five services back into one large service so the join becomes a local in-process query and no cross-service calls are ever needed"
    answer: 1
    explanation: |
      CQRS builds a denormalized read model updated from the source services'
      events, so the multi-service query becomes a single fast lookup. The trade-off
      is eventual consistency of the projection plus the work to build/maintain it.
      Direct cross-service DB reads break encapsulation; forever-caching is stale-
      prone; merging services discards independence.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: microservices-monolith-api-design-066
    difficulty: expert
    tags: [cell-based, blast-radius, modern]
    question: |
      To limit blast radius at very large scale, some organizations (e.g. AWS,
      Slack) use "cell-based architecture." What is the defining idea and its main
      trade-off?
    options:
      - "Run one giant shared cell that serves every customer from a single stack; the trade-off is maximal operational simplicity in exchange for essentially no fault isolation between tenants"
      - "Run every microservice in its own dedicated Kubernetes namespace for logical separation; the trade-off is frequent naming collisions and RBAC rules that are hard to manage"
      - "Use a single shared database sharded by user id to spread load across partitions; the trade-off is hot shards forming around a few unusually heavy power users"
      - "Partition the whole stack into independent, self-contained cells each serving a subset of customers, so a failure or bad deploy is contained to one cell; trade-off is added routing complexity and cross-cell data/operations overhead"
    answer: 3
    explanation: |
      Cell-based architecture replicates the full stack into isolated cells, each
      handling a slice of traffic, so faults, poison requests, and bad deploys stay
      contained to one cell. The cost is a cell-routing layer plus complexity for
      cross-cell concerns. The distractors describe unrelated or opposite ideas.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: microservices-monolith-api-design-067
    difficulty: expert
    tags: [grpc, rest, latency, estimation]
    question: |
      A service does 5 sequential internal calls per user request, each with ~1 ms
      network + serialization. Switching from JSON/REST to gRPC/protobuf mainly
      helps by reducing serialization and payload size, but the biggest latency
      lever for this pattern is usually:
    options:
      - "Reducing round trips — parallelizing independent calls or collapsing the chain — because sequential network hops dominate over serialization cost"
      - "Swapping in a faster hand-tuned JSON serialization library, since parsing overhead is what actually dominates the five sequential hops"
      - "Adding more CPU cores to the calling client, because the request latency here is bounded mainly by client-side compute rather than the network"
      - "Increasing only the TCP window size on the connection, which shrinks the per-hop round-trip time enough to collapse the sequential delay"
    answer: 0
    explanation: |
      Five sequential hops mean latency is dominated by round-trip count, not the
      serialization format. The biggest win is cutting/parallelizing round trips
      (fan-out, batching, or redesigning the chain). gRPC helps at the margin, but a
      faster JSON lib, more client CPU, or TCP tuning won't beat removing serial hops.
    ref: "concepts.md#the-fallacies-of-distributed-computing"

  - id: microservices-monolith-api-design-068
    difficulty: expert
    tags: [distributed-monolith, diagnosis]
    question: |
      Which set of symptoms MOST clearly indicates a distributed monolith rather
      than a healthy microservices system?
    options:
      - "Each service owns its data, deploys on its own cadence, and calls peers rarely"
      - "Services communicate asynchronously via events and tolerate peer downtime"
      - "Services must be released together, share a database, have deep synchronous call chains, and a change in one constantly forces changes in others"
      - "Services expose versioned APIs and use consumer-driven contracts"
    answer: 2
    explanation: |
      Lockstep releases, a shared database, deep synchronous chains, and ripple-
      effect changes are the hallmark of a distributed monolith — you've paid the
      microservices tax without the independence. The other options describe the
      properties of a healthy microservices system.
    ref: "concepts.md#when-not-to-use-microservices"

  - id: microservices-monolith-api-design-069
    difficulty: expert
    tags: [gateway, offloading, security, decision]
    question: |
      A design puts JWT validation, rate limiting, and TLS termination in the API
      gateway, but also starts adding order-pricing business rules there "because
      it's central." Critique this from a trade-off standpoint.
    options:
      - "Correct approach; centralizing everything in the gateway maximizes reuse"
      - "Nothing should be in the gateway; move auth and TLS into each service instead"
      - "TLS termination should never happen at the gateway for security reasons"
      - "Cross-cutting concerns (auth, rate limiting, TLS) belong in the gateway, but business rules do not — they couple the gateway to a domain, bloat a shared SPoF, and re-create a monolith with different scaling needs"
    answer: 3
    explanation: |
      Offloading generic cross-cutting concerns to the gateway is good practice, but
      embedding domain/business logic couples a shared, high-availability SPoF to
      one domain and grows a new monolith. Keep the gateway thin and put pricing in
      the owning service. Auth/TLS at the gateway are standard and beneficial.
    ref: "concepts.md#api-gateway-and-backend-for-frontend"

  - id: microservices-monolith-api-design-070
    difficulty: expert
    tags: [consistency, decision, comprehensive]
    question: |
      An e-commerce checkout must (a) reserve inventory, (b) charge payment, and
      (c) create the order across three services with private databases, and must
      never charge without reserving stock. Which design correctly balances
      correctness and availability?
    options:
      - "Distributed two-phase commit across the three databases for strict atomicity"
      - "An orchestrated saga with compensating transactions (release reservation / refund) plus idempotency keys on each step, accepting brief eventual-consistency windows"
      - "A single shared database and one ACID transaction spanning all three services"
      - "Fire-and-forget async messages to all three with no coordination"
    answer: 1
    explanation: |
      With database-per-service, an orchestrated saga with compensations and
      idempotent, retry-safe steps preserves the business invariant while staying
      available, at the cost of short eventual-consistency windows. 2PC is blocking
      and hurts availability at scale; a shared DB destroys service independence;
      uncoordinated fire-and-forget can charge without reserving stock.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: microservices-monolith-api-design-071
    difficulty: expert
    tags: [circuit-breaker, resilience, states]
    question: |
      A circuit breaker protecting a flaky dependency transitions among Closed,
      Open, and Half-Open states. What is the purpose of the Half-Open state?
    options:
      - "To allow a limited number of trial requests through after a cooldown, closing the breaker if they succeed or re-opening it if they fail, so the system can recover without a thundering herd"
      - "To permanently block every subsequent call the moment any failure is detected, keeping the dependency isolated forever until an operator manually resets it"
      - "To duplicate each incoming request across two copies of the dependency for redundancy, so a slow replica never delays the caller's response"
      - "To bypass the breaker's protection entirely during periods of high load, letting all traffic flow straight through to the struggling dependency"
    answer: 0
    explanation: |
      Half-Open sends a few probe requests after the open cooldown: success closes
      the breaker (recovered), failure re-opens it — avoiding both permanent
      blocking and a sudden flood of retries hammering a recovering service. It
      neither blocks forever, duplicates requests, nor bypasses protection.
    ref: "concepts.md#synchronous-vs-asynchronous-inter-service-communication"

  - id: microservices-monolith-api-design-072
    difficulty: expert
    tags: [failure-mode, aggregation, degradation]
    question: |
      A gateway aggregates a product page from a required "price" service and an
      optional "reviews" service. To degrade gracefully, the design should:
    options:
      - "Fail the entire product page whenever either the price or reviews service is slow, so every client always sees a fully consistent all-or-nothing response"
      - "Retry the optional reviews service indefinitely with no timeout before sending any response, guaranteeing the reviews section is never missing from the page"
      - "Apply per-call timeouts and return the page with prices even if reviews time out (partial response), while failing only if the required price call fails"
      - "Cache the fully rendered product page forever after the first request so that neither the price nor the reviews backend is ever called again"
    answer: 2
    explanation: |
      Graceful degradation distinguishes required vs optional dependencies: time out
      the optional reviews call and return a partial (price-only) page, failing only
      when the required data is unavailable. Failing the whole page on any slowness
      hurts availability; indefinite retries block the response; caching forever
      serves stale prices.
    ref: "concepts.md#api-gateway-and-backend-for-frontend"

  - id: microservices-monolith-api-design-073
    difficulty: intermediate
    tags: [rest, status-codes, design]
    question: |
      A client sends a well-formed request to create a resource but is not
      authenticated. Which HTTP status is most appropriate?
    options:
      - "401 Unauthorized"
      - "200 OK"
      - "404 Not Found"
      - "500 Internal Server Error"
    answer: 0
    explanation: |
      Missing/invalid authentication is 401 Unauthorized (authentication needed);
      403 would be authenticated-but-forbidden. 200 wrongly signals success, 404
      hides the real cause, and 500 blames the server for a client auth issue.
    ref: "concepts.md#api-styles-rest-graphql-and-grpc"

  - id: microservices-monolith-api-design-074
    difficulty: beginner
    tags: [async, dead-letter-queue]
    question: |
      In asynchronous messaging, what is a dead-letter queue (DLQ) used for?
    options:
      - "Archiving every successfully processed message in a parallel queue so an analytics pipeline can replay them for reporting"
      - "Encrypting message payloads in transit and holding the ciphertext until each consumer presents a valid decryption key"
      - "Holding messages that repeatedly fail processing so they don't block the main queue and can be inspected later"
      - "Distributing messages evenly across a pool of competing consumers so no single consumer instance becomes a hot spot"
    answer: 2
    explanation: |
      A DLQ captures poison/failed messages after retry limits so they don't block
      the main queue and can be examined or replayed. It's not for successful
      messages, encryption, or load balancing.
    ref: "concepts.md#synchronous-vs-asynchronous-inter-service-communication"

  - id: microservices-monolith-api-design-075
    difficulty: advanced
    tags: [retry, jitter, thundering-herd]
    question: |
      Why is "retry with exponential backoff AND jitter" preferred over fixed-
      interval retries when many clients hit a failing service?
    options:
      - "Adding jitter shortens each individual retry's round-trip time, so the overall request completes measurably faster than with fixed intervals"
      - "Fixed-interval retry schedules violate the HTTP specification, so any conformant client is required to randomize its retry timing"
      - "Randomized backoff mathematically guarantees that the request will eventually succeed no matter how long the dependency stays down"
      - "Randomized (jittered) backoff spreads retries over time, preventing synchronized retry storms (thundering herd) that would keep overwhelming a recovering service"
    answer: 3
    explanation: |
      Without jitter, many clients retry in lockstep and re-overwhelm a recovering
      service. Adding randomness spreads the load. It doesn't make individual
      retries faster or guarantee success, and fixed intervals aren't "illegal" —
      just harmful under correlated failures.
    ref: "concepts.md#the-fallacies-of-distributed-computing"

  - id: microservices-monolith-api-design-076
    difficulty: advanced
    tags: [ddd, aggregate, boundaries]
    question: |
      Applying DDD aggregate design to sizing a service, which invariant placement
      forces a boundary decision?
    options:
      - "Any invariant that must hold synchronously must live within a single aggregate; if a proposed service split would place such a must-be-atomic invariant across two services, the split is wrong"
      - "Every individual entity should be promoted to its own separate aggregate root, which keeps each service as small and single-purpose as possible"
      - "Cross-service invariants can always be enforced synchronously with a distributed lock, and that lock adds no meaningful latency or availability cost"
      - "Each aggregate should embed full copies of every aggregate it references so that all reads and joins can be resolved locally without remote calls"
    answer: 0
    explanation: |
      A synchronously-enforced invariant defines a transactional consistency
      boundary, which must sit inside one aggregate (and thus one service).
      Splitting it across services forces eventual consistency and breaks the
      invariant. Per-entity aggregates create chatty coupling, distributed locks
      are not free, and embedding referenced aggregates bloats them — the rule is
      to reference other aggregates by id.
    ref: "concepts.md#service-boundaries-and-domain-driven-design"

  - id: microservices-monolith-api-design-077
    difficulty: advanced
    tags: [ddd, anti-corruption-layer, context-map]
    question: |
      A clean new "Billing" context must integrate with a messy legacy ERP whose
      data model you cannot change. Which context-mapping pattern best protects
      Billing's model?
    options:
      - "Shared Kernel: publish a common model module that both Billing and the legacy ERP depend on and evolve together in lockstep"
      - "Conformist: adopt the ERP's data model wholesale inside Billing and shape every Billing entity to match the legacy schema exactly"
      - "Anti-Corruption Layer: translate the ERP model into Billing's own model at the boundary so the legacy model can't leak in"
      - "Big Ball of Mud: let both contexts read and write each other's tables freely so integration needs no explicit mapping code"
    answer: 2
    explanation: |
      An Anti-Corruption Layer translates the upstream (legacy) model into the
      downstream's clean model at the seam, insulating the new context. A Shared
      Kernel couples deploys and spreads the mess; Conformist surrenders your model
      to the legacy one; shared table access is a distributed monolith.
    ref: "concepts.md#service-boundaries-and-domain-driven-design"

  - id: microservices-monolith-api-design-078
    difficulty: advanced
    tags: [distributed-monolith, availability, estimation]
    question: |
      A user request traverses a synchronous chain of 5 services, each independently
      99.9% available. Ignoring retries, what is the approximate end-to-end
      availability of that serial path, and what does it imply?
    options:
      - "About 99.5% (0.999^5), because serial availability is the product of the links, so each added sync hop on the critical path lowers availability"
      - "About 99.9%, because a serial chain inherits the availability of its single most-available link and the slower hops don't compound"
      - "Very close to 100%, because five independent services are statistically unlikely to ever be down at the same instant"
      - "Exactly 99.99%, because chaining several 99.9% services together automatically yields an extra nine of redundancy"
    answer: 0
    explanation: |
      Serial dependencies multiply: 0.999^5 ≈ 0.995, i.e. ~99.5%, worse than any
      single link. Adding services to a synchronous critical path is a reliability
      tax — a monolith at 99.9% would beat this. Availability is the product, not
      the max; independence does not prevent compounding.
    ref: "concepts.md#when-not-to-use-microservices"

  - id: microservices-monolith-api-design-079
    difficulty: advanced
    tags: [distributed-monolith, detection, change-coupling]
    question: |
      Which empirical signal, mined from version-control history, most strongly
      indicates that two services were cut at the wrong boundary?
    options:
      - "The two services are implemented in the same programming language and share a common set of base libraries"
      - "The two services each have their own independent CI pipeline and release cadence in the build system"
      - "The two services have roughly similar lines-of-code counts and comparable numbers of source files"
      - "The two services' files repeatedly change together in the same commits/PRs (high logical/temporal coupling)"
    answer: 3
    explanation: |
      Frequent co-change (logical coupling) across two services means a single
      logical change keeps rippling across the boundary — the hallmark of a bad
      cut / distributed monolith. Shared language, independent pipelines, and
      similar size say nothing about coupling.
    ref: "concepts.md#when-not-to-use-microservices"

  - id: microservices-monolith-api-design-080
    difficulty: advanced
    tags: [api-composition, cqrs, decision]
    question: |
      A dashboard query must join data owned by six services and is called at high
      QPS with cross-service filtering and sorting. API composition (fan-out +
      in-memory join) is timing out. What is the better pattern and its main cost?
    options:
      - "A CQRS read model: a denormalized projection fed by the services' events, queried in one place; cost is eventual consistency and maintaining/rebuilding the projection"
      - "Give the dashboard service direct read access to all six underlying databases and run one SQL join across them; the only real cost is a few extra connection pools"
      - "Cache the fully composed dashboard result in each browser indefinitely so the expensive fan-out join runs just once per client; cost is a little client memory"
      - "Merge all six services back into one large service so the join becomes local and in-process; the only cost is a somewhat longer build and deploy time"
    answer: 0
    explanation: |
      When a cross-service query is hot and needs filtering/sorting/aggregation,
      a CQRS materialized view turns it into a single fast lookup. The trade-off is
      eventual consistency and the operational cost of building/rebuilding the
      projection. Direct DB reads create a distributed monolith; forever-caching
      serves stale data; merging services throws away independence.
    ref: "concepts.md#api-composition-versus-cqrs-read-models"

  - id: microservices-monolith-api-design-081
    difficulty: advanced
    tags: [api-composition, freshness, decision]
    question: |
      For a low-QPS admin screen that joins a small amount of data from three
      services and must always show the very latest values, which approach is the
      most appropriate default?
    options:
      - "Build a full CQRS read model backed by an event pipeline immediately, so even this rarely-used admin screen reads from a pre-built projection"
      - "API composition: fan out to the three services and join in memory at read time, since the fan-out is small and freshness matters"
      - "Introduce a shared database across the three services so the admin screen can issue one cross-entity SQL join without any fan-out"
      - "Replicate all three services' tables into the admin service on a nightly batch job and query the local copies for the screen"
    answer: 1
    explanation: |
      For small, low-traffic, freshness-sensitive joins, API composition is the
      cheap correct default — no extra storage, always fresh. Standing up CQRS adds
      eventual-consistency and projection-maintenance cost that isn't justified
      here; a shared DB is a distributed monolith; nightly replication is stale.
    ref: "concepts.md#api-composition-versus-cqrs-read-models"

  - id: microservices-monolith-api-design-082
    difficulty: advanced
    tags: [cqrs, eventual-consistency, read-your-writes]
    question: |
      After adopting a CQRS read model fed asynchronously by events, users
      occasionally submit a change and then don't see it reflected when the UI
      immediately re-queries the read side. What is happening and a reasonable fix?
    options:
      - "The read-model database has become corrupted by the concurrent write, so the only remedy is to restore the projection store from the latest backup"
      - "The event broker guarantees exactly-once delivery in commit order, so a freshly written value can never be missing from the projection at read time"
      - "Replication lag between the write and the projection update creates a read-your-writes gap; mitigate by reading the just-written value from the write side, optimistic UI update, or waiting for the projection to catch up"
      - "The read model must be converted to strong consistency by acquiring a distributed lock on every single read so no query ever observes a stale projection"
    answer: 2
    explanation: |
      CQRS projections are eventually consistent, so a read immediately after a
      write may miss it (read-your-writes gap). Fixes include serving the writer
      their own fresh value, optimistic client updates, or version/wait-for-catch-up
      tokens — not corruption recovery, and not pretending brokers are exactly-once.
    ref: "concepts.md#api-composition-versus-cqrs-read-models"

  - id: microservices-monolith-api-design-083
    difficulty: advanced
    tags: [operational-tax, tracing, context-propagation]
    question: |
      In a 40-service system, one team forgets to propagate the incoming
      trace/correlation context on its outbound calls. What is the consequence?
    options:
      - "That service becomes a blind spot: every distributed trace passing through it is broken downstream, making end-to-end debugging of those requests very hard"
      - "Nothing meaningful; the tracing backend automatically stitches the broken trace back together by correlating the source and destination IP addresses"
      - "Only that one service's own local logs lose their trace ids; the end-to-end cross-service traces for those requests remain fully intact"
      - "The service will refuse to start up and be held out of rotation until the missing context-propagation code is added and redeployed"
    answer: 0
    explanation: |
      Distributed tracing depends on every hop propagating the trace context
      (e.g. W3C traceparent). A single service that drops it severs the trace for
      all requests flowing through it, creating a blind spot across the whole path.
      Traces can't be rebuilt from IPs, and the effect is not limited to that one
      service's logs.
    ref: "concepts.md#the-operational-tax-of-microservices"

  - id: microservices-monolith-api-design-084
    difficulty: advanced
    tags: [operational-tax, deployment, expand-contract]
    question: |
      Because you cannot deploy a provider service and its consumers atomically,
      how must a breaking API change be rolled out across microservices?
    options:
      - "Schedule a coordinated maintenance window and deploy the provider and all of its consumers together in one synchronized release"
      - "Deploy the breaking provider change first and let the affected consumers fail until each team notices and rushes out its own update"
      - "Treat provider APIs as immutable after launch and never introduce a breaking change to a published contract under any circumstances"
      - "Using expand-contract (parallel change): add the new field/endpoint while keeping the old, migrate consumers, then remove the old — each step is backward/forward compatible"
    answer: 3
    explanation: |
      Independent deploys mean old and new versions run side by side during a
      rollout, so changes must be done as expand-contract/parallel change: introduce
      the new alongside the old, migrate all consumers, then retire the old. Big-bang
      windows defeat independent deploy; breaking consumers causes outages; freezing
      APIs is impractical.
    ref: "concepts.md#the-operational-tax-of-microservices"

  - id: microservices-monolith-api-design-085
    difficulty: advanced
    tags: [operational-tax, cost, judgment]
    question: |
      A staff engineer argues the true cost of adding a new service boundary is not
      the network RPC. What is the strongest version of that argument?
    options:
      - "Inter-service RPCs become effectively free once you switch to gRPC over HTTP/2, so a new boundary carries no real ongoing cost at all"
      - "The standing operational tax — a new pipeline, dashboards, trace instrumentation, runbook, alerts, and pager rotation that exist forever — is the real, underestimated cost of a boundary"
      - "A new boundary only costs a little extra process memory for the added service instances, which is cheap and easily provisioned"
      - "The dominant cost of a boundary is purely the additional CPU spent serializing and deserializing payloads on each call across it"
    answer: 1
    explanation: |
      The RPC is cheap to write; the enduring cost is operating the boundary:
      pipeline, observability, on-call, runbooks, patching — a standing tax that
      persists for the life of the service. This is why deferring decomposition
      (monolith/modular-monolith first) is sound. Serialization CPU and memory are
      minor by comparison, and RPCs are not free.
    ref: "concepts.md#the-operational-tax-of-microservices"

  - id: microservices-monolith-api-design-086
    difficulty: advanced
    tags: [versioning, deprecation, sunset]
    question: |
      What is the safest gate for actually removing a deprecated public API
      endpoint?
    options:
      - "Remove it only after per-consumer usage metrics show usage has fallen to ~zero (and the sunset date has passed), because you cannot safely remove what clients still call"
      - "Remove it strictly on the announced sunset date regardless of remaining traffic, so that lagging clients are forced to complete their migration"
      - "Remove the old endpoint as soon as a newer version ships, treating the release of the replacement as sufficient notice to consumers"
      - "Never remove the endpoint at all; keep every historical version running indefinitely so that no integration can possibly break"
    answer: 0
    explanation: |
      Removal must be driven by measured, per-consumer usage falling to near zero,
      not by a calendar alone — otherwise you break live integrations you didn't
      know about. Announcing a date is necessary but insufficient; removing on ship
      of a new version breaks laggards; keeping everything forever is unsustainable.
    ref: "concepts.md#api-versioning-and-evolution"

  - id: microservices-monolith-api-design-087
    difficulty: advanced
    tags: [versioning, http-headers, deprecation]
    question: |
      Which mechanism lets API clients detect deprecation and the removal timeline
      programmatically rather than only via documentation?
    options:
      - "Returning an HTTP 410 Gone status on every request so clients infer from the error that the endpoint is being retired"
      - "Silently renaming the endpoint's path in a new release and letting clients discover the change when their old calls start 404-ing"
      - "The standardized Deprecation and Sunset response headers (with a Link to the migration guide)"
      - "Gradually lowering the endpoint's rate limit toward zero so clients notice the throttling and infer the deprecation timeline"
    answer: 2
    explanation: |
      The `Deprecation` and `Sunset` (RFC 8594) response headers, plus a `Link`
      header to migration docs, let clients programmatically detect deprecation and
      the cutoff date. Returning 410 breaks the still-working endpoint; renaming
      silently and zeroing rate limits are hostile, not detection mechanisms.
    ref: "concepts.md#api-versioning-and-evolution"

  - id: microservices-monolith-api-design-088
    difficulty: advanced
    tags: [consumer-driven-contracts, deprecation, field-removal]
    question: |
      Your internal service wants to drop a response field. A pure schema-diff check
      flags it as breaking, but consumer-driven contract (Pact) verification passes.
      What does this tell you?
    options:
      - "Nothing useful comes from the passing contract; the schema diff is authoritative and you should always defer to it over Pact"
      - "A green Pact run despite a breaking schema diff means the Pact broker is misconfigured, so its verdict should be disregarded here"
      - "No currently-known consumer actually reads that field, so removing it is safe for existing consumers — CDC is more precise than schema diffing because it reflects real usage"
      - "Regardless of what the contracts say, dropping any response field obligates you to publish the change under a brand-new URI version"
    answer: 2
    explanation: |
      CDC verifies each consumer's actual expectations; if every consumer's contract
      passes without the field, no one relies on it and removal is safe for known
      consumers. That precision (ignoring unused fields, catching real semantic
      expectations) is exactly why CDC beats blunt schema diffing in an ecosystem
      you fully control.
    ref: "concepts.md#api-versioning-and-evolution"

  - id: microservices-monolith-api-design-089
    difficulty: advanced
    tags: [idempotency, ttl, gotcha]
    question: |
      An idempotency-key implementation stores keys with a 1-hour TTL, but a mobile
      client's offline retry queue can replay a request up to 12 hours later. What
      bug results and what is the fix?
    options:
      - "There is no bug here; once an idempotency key has expired from the store, any later replay of that request is inherently safe to process again"
      - "The mobile client itself crashes when it replays a request whose idempotency key has already aged out of the server's store"
      - "The server is forced to reject every retry that arrives after the TTL elapses, silently dropping legitimate offline work that was queued in good faith"
      - "A late retry after key expiry re-executes the operation (e.g. a double charge); the fix is to set the key TTL longer than the maximum realistic retry horizon"
    answer: 3
    explanation: |
      If the key's TTL is shorter than the client's retry window, the record is gone
      when a late retry arrives, so the server treats it as new and re-executes —
      duplicating the effect. The TTL must exceed the longest realistic retry
      horizon. Rejecting all late retries silently drops legitimate operations.
    ref: "concepts.md#pagination-filtering-and-idempotency-keys"

  - id: microservices-monolith-api-design-090
    difficulty: advanced
    tags: [idempotency, request-fingerprint, validation]
    question: |
      A well-designed idempotency layer stores a hash of the request body with each
      key. Why?
    options:
      - "To detect when the SAME key is reused with a DIFFERENT body (a client bug) and reject it, rather than silently returning the old result or executing a different operation under the reused key"
      - "To compress the stored request payload with a body hash so the idempotency table consumes far less disk space per retained key"
      - "To encrypt the sensitive payment amount inside the request so it is never persisted in plaintext alongside the idempotency key"
      - "To speed up lookups by using the body hash as the primary index key, so retries resolve faster than indexing on the raw idempotency key"
    answer: 0
    explanation: |
      Fingerprinting the body lets the server catch a client that reuses an
      idempotency key for a different request — a bug that should return 409/422
      instead of silently serving the wrong stored response or, worse, performing a
      new operation under a "seen" key. It is not for compression, encryption, or
      indexing.
    ref: "concepts.md#pagination-filtering-and-idempotency-keys"

  - id: microservices-monolith-api-design-091
    difficulty: advanced
    tags: [api-gateway, cross-cutting, judgment]
    question: |
      Which responsibility is appropriate to centralize in a thin API gateway
      WITHOUT turning it into a monolith?
    options:
      - "Computing order pricing, discounts, and tax rules for every checkout request"
      - "Deciding inventory reservation and stock-allocation logic for each incoming order"
      - "Authentication/JWT validation, TLS termination, rate limiting, and routing"
      - "Owning the customer database schema and running its migrations centrally"
    answer: 2
    explanation: |
      Generic cross-cutting concerns — authn, TLS termination, rate limiting,
      routing — are exactly what a thin gateway should centralize. Pricing, tax, and
      inventory logic are domain/business rules that belong in the owning services;
      putting them in the gateway couples a shared SPoF to a domain and re-creates a
      monolith. Gateways don't own databases.
    ref: "concepts.md#api-gateway-and-backend-for-frontend"

  - id: microservices-monolith-api-design-092
    difficulty: advanced
    tags: [modular-monolith, decision, judgment]
    question: |
      A 15-engineer company on one codebase has clean module boundaries but is
      considering microservices "to scale the team." Only the payments module has a
      distinct compliance/deploy-isolation need. What is the best-reasoned move?
    options:
      - "Split the entire codebase into ~15 microservices immediately, one per engineer, to unlock team scaling"
      - "Adopt a service mesh with sidecars across the codebase first, then decide about splitting later"
      - "Stay a modular monolith and extract only the payments module as a service where the isolation need is real, deferring further splits until a concrete pain appears"
      - "Merge all modules into a single un-modularized codebase to simplify the build and drop the internal boundaries"
    answer: 2
    explanation: |
      Extract a service only where a concrete driver exists (payments' compliance/
      isolation), keeping the well-factored modular monolith for everything else and
      deferring the operational tax. A blanket split pays the tax with no
      justification; a mesh adds ops burden without addressing the question; de-
      modularizing destroys the clean seams.
    ref: "concepts.md#monolith-vs-microservices-vs-modular-monolith"

  - id: microservices-monolith-api-design-093
    difficulty: advanced
    tags: [rest, grpc, latency, estimation]
    question: |
      A request makes 6 sequential internal RPCs, each ~2 ms serialization + 3 ms
      network. Half the calls are independent of each other. What gives the largest
      latency reduction?
    options:
      - "Switching serialization from JSON to protobuf on every call, since that removes essentially all of the end-to-end latency here"
      - "Parallelizing the independent calls and/or collapsing round trips, because with ~5 ms per sequential hop the round-trip count dominates over serialization cost"
      - "Adding more CPU cores to each service, since per-hop latency is bounded mainly by service compute rather than the network"
      - "Increasing log verbosity to find the slow call, since better tracing detail will itself shrink the overall request time"
    answer: 1
    explanation: |
      At ~5 ms per hop, 6 sequential calls are ~30 ms dominated by round-trip count;
      parallelizing the independent ones and reducing hops attacks the dominant term.
      Protobuf trims only the ~2 ms serialization slice per call (helpful but
      secondary), extra CPU doesn't cut network RTT, and logging doesn't reduce
      latency.
    ref: "concepts.md#the-fallacies-of-distributed-computing"

  - id: microservices-monolith-api-design-094
    difficulty: expert
    tags: [async, outbox, dual-write]
    question: |
      A service writes an order to its DB and then publishes an "OrderCreated" event
      from application code. Occasionally the DB commit succeeds but the publish
      fails (or vice versa). What is the robust fix?
    options:
      - "Wrap the DB write and the broker publish together in an XA two-phase commit so both systems atomically commit as one distributed transaction"
      - "Retry the publish a few times in application code after the commit and accept the occasional lost event when all retries fail"
      - "Transactional outbox: write the event to an outbox table in the same DB transaction as the order, then relay it to the broker (via a poller or log-based CDC)"
      - "Publish the event to the broker first, and only then write the order to the DB so the event is never missed"
    answer: 2
    explanation: |
      The dual-write problem (two systems, no shared transaction) is solved by the
      transactional outbox: the event is committed atomically with the state change
      in one DB transaction, and a separate relay/CDC process publishes it — so they
      can never diverge. XA/2PC over a broker is fragile/poorly supported; retries
      and reordering don't guarantee atomicity.
    ref: "concepts.md#synchronous-vs-asynchronous-inter-service-communication"

  - id: microservices-monolith-api-design-095
    difficulty: expert
    tags: [cqrs, projection-rebuild, ordering]
    question: |
      A CQRS read-model projection was found to have a bug and produced a corrupted
      view. Which combination of properties makes recovery and correctness robust?
    options:
      - "Deleting the corrupted read model and asking users to manually re-enter the affected data through the UI"
      - "Projectors that are idempotent and order-tolerant, plus the ability to replay the event log from the beginning to rebuild the view after fixing the bug"
      - "Making the projector non-idempotent so that each event happens to apply exactly once and duplicates are avoided by luck"
      - "Reading directly from the source services' underlying tables at query time to bypass the broken projection entirely"
    answer: 1
    explanation: |
      Robust projections are idempotent and tolerant of out-of-order/duplicate
      events, and the event log can be replayed to rebuild a view after a fix — a
      key operational advantage of event-driven CQRS. Manual re-entry is absurd,
      non-idempotent projectors corrupt under retries, and reading source tables
      breaks encapsulation.
    ref: "concepts.md#api-composition-versus-cqrs-read-models"

  - id: microservices-monolith-api-design-096
    difficulty: expert
    tags: [cqrs, over-application, judgment]
    question: |
      A team applies full CQRS (separate write and read models with an event
      pipeline) to every entity in a modest CRUD app "because microservices need
      CQRS." What is the most accurate critique?
    options:
      - "CQRS is being over-applied: it is a targeted answer to specific cross-service or read-scaling problems and it adds eventual-consistency, projection, and rebuild complexity that a simple CRUD app doesn't need"
      - "Correct; CQRS should always be applied everywhere reads and writes coexist, since separating the two models is a universal best practice"
      - "CQRS is only valid once you also adopt a service mesh to route the read and write traffic to separate model backends"
      - "The real problem is that they didn't also add two-phase commit to keep the write and read models perfectly in sync"
    answer: 0
    explanation: |
      CQRS is not "always split reads and writes." It solves specific problems
      (cross-service queries, heavy read scaling) and introduces eventual
      consistency plus projection/rebuild operations. Applying it blanket to simple
      CRUD adds complexity for no benefit. It has nothing to do with meshes or 2PC.
    ref: "concepts.md#api-composition-versus-cqrs-read-models"

  - id: microservices-monolith-api-design-097
    difficulty: expert
    tags: [saga, isolation, countermeasures]
    question: |
      Sagas lack the isolation of ACID transactions, so another transaction can read
      an intermediate saga state (e.g. an order that may still be rolled back). Which
      is a recognized saga countermeasure for this lack of isolation?
    options:
      - "Two-phase commit layered on top of the saga to restore full ACID isolation across all participating services"
      - "Disabling all concurrent access to every service so that only one saga can ever be in flight at a time"
      - "Ignoring it entirely, since sagas already provide the same isolation guarantees as a single ACID transaction"
      - "Semantic locks / a pending status flag on affected records so other operations know the value is provisional until the saga completes or compensates"
    answer: 3
    explanation: |
      Because sagas expose intermediate states (no isolation), countermeasures like
      semantic locks (marking a record PENDING/provisional), commutative updates, and
      re-reads are used so readers treat in-flight data appropriately. 2PC defeats the
      purpose; globally serializing access kills throughput; and sagas are explicitly
      NOT isolated.
    ref: "concepts.md#synchronous-vs-asynchronous-inter-service-communication"

  - id: microservices-monolith-api-design-098
    difficulty: expert
    tags: [saga, compensation, non-compensatable]
    question: |
      In a saga, the step "send confirmation email to customer" cannot be undone once
      executed. How should saga design handle such non-compensatable actions?
    options:
      - "Place them in a compensatable step and undo them anyway by sending a follow-up 'please disregard' email as the compensation"
      - "Order the saga so all compensatable and retriable steps come first, and put non-compensatable ('pivot'/post-pivot) steps last — after the point where success is assured — so nothing that can't be undone runs before commitment"
      - "Refuse to include any such non-compensatable step in a saga at all, and require those actions to run in a separate manual process"
      - "Wrap the confirmation email send in a two-phase commit spanning the service and the email provider so it can be rolled back"
    answer: 1
    explanation: |
      Saga design distinguishes compensatable, pivot, and retriable steps: you
      sequence so that non-compensatable actions only occur after the pivot (once the
      outcome is committed and won't be rolled back). Trying to "undo" an email is
      impossible, banning such steps is impractical, and 2PC can't span an email
      provider.
    ref: "concepts.md#synchronous-vs-asynchronous-inter-service-communication"

  - id: microservices-monolith-api-design-099
    difficulty: expert
    tags: [operational-tax, testing, contract]
    question: |
      As a system grows to dozens of services, broad end-to-end integration tests
      become slow and flaky. What testing strategy shift best preserves confidence
      while restoring speed?
    options:
      - "Delete the integration tests and rely on a manual QA team to click through every cross-service flow before each release"
      - "Spin up the entire fleet of services in a shared environment for every single unit test to guarantee full realism"
      - "Only test in production with no pre-release checks, using feature flags and monitoring to catch regressions after rollout"
      - "Shift toward consumer-driven contract tests plus per-service tests, reserving a thin layer of end-to-end tests for critical paths, so most compatibility is verified without spinning up the whole fleet"
    answer: 3
    explanation: |
      The scalable pattern is a test pyramid weighted toward fast per-service tests
      and consumer-driven contract tests (which verify integration compatibility
      without a full environment), keeping only a thin critical-path E2E layer.
      Deleting tests or relying solely on manual QA / prod testing sacrifices
      confidence; running the fleet per unit test is infeasible.
    ref: "concepts.md#the-operational-tax-of-microservices"

  - id: microservices-monolith-api-design-100
    difficulty: expert
    tags: [operational-tax, observability, metrics]
    question: |
      During an incident, on-call asks "which of 40 services is causing the
      user-facing p99 latency spike?" Which observability capability answers this
      most directly?
    options:
      - "Distributed traces (correlated by trace id) that break down end-to-end latency per span/service, backed by per-service RED metrics"
      - "Per-host CPU and memory utilization graphs for one representative application server in the fleet"
      - "Application logs from a single suspected service grepped by hand for slow request entries"
      - "The number of open TCP connections currently held on the front-door load balancer"
    answer: 0
    explanation: |
      Distributed tracing attributes end-to-end latency to specific spans/services,
      pinpointing the culprit hop; per-service RED (Rate/Errors/Duration) metrics
      corroborate it. Single-host CPU, one service's logs, or LB connection counts
      can't localize a latency spike across a 40-service call graph.
    ref: "concepts.md#the-operational-tax-of-microservices"

  - id: microservices-monolith-api-design-101
    difficulty: expert
    tags: [grpc, load-balancing, http2, gotcha]
    question: |
      A team puts gRPC services behind a standard L4 (connection-level) load balancer
      and finds traffic piles onto a few backend pods. Why, and what is the fix?
    options:
      - "gRPC servers are single-threaded per process, so add more worker threads to each pod to spread the load evenly"
      - "gRPC multiplexes many requests over long-lived HTTP/2 connections, so connection-level (L4) balancing pins all of a client's requests to one backend; use L7/request-level balancing (e.g. via a proxy/mesh) or client-side load balancing"
      - "Protobuf payloads are too large for the balancer to distribute; switch the services to JSON so requests spread out"
      - "HTTP/2 is silently disabled behind the balancer; force the connections back to HTTP/1.1 to restore even distribution"
    answer: 1
    explanation: |
      gRPC keeps persistent HTTP/2 connections and multiplexes streams over them, so
      an L4 balancer that distributes connections (not requests) sends all of a
      client's calls to whichever pod it connected to — causing imbalance. The fix is
      L7/request-aware balancing (proxy or service mesh) or client-side LB. It's not
      about threads, payload size, or disabling HTTP/2 (which gRPC requires).
    ref: "concepts.md#api-styles-rest-graphql-and-grpc"

  - id: microservices-monolith-api-design-102
    difficulty: expert
    tags: [bff, coupling, judgment]
    question: |
      A company runs a Web BFF, an iOS BFF, and an Android BFF. Over time each BFF
      re-implements the same auth, common aggregation, and error handling, and fixes
      must be applied three times. What is the best-reasoned remediation?
    options:
      - "Delete two of the BFFs and force all clients through one generic shared API, re-creating the coordination bottleneck the BFFs were built to solve"
      - "Keep per-client BFFs for client-specific shaping but extract the shared cross-cutting concerns (auth, common aggregation) into a shared library or a layer behind the BFFs, so duplication is removed without losing client tailoring"
      - "Move all downstream business logic into the BFFs so that each one is fully self-contained and needs no other services"
      - "Merge the three mobile and web teams into a single team so one group maintains all three BFF codebases together"
    answer: 1
    explanation: |
      The BFF pattern's known cost is duplicated cross-cutting logic across N
      gateways. The remedy is to factor the shared concerns into a common library or
      a layer behind the BFFs while keeping each BFF's client-specific shaping.
      Collapsing to one generic API brings back the bottleneck BFF solved; piling
      business logic into BFFs worsens duplication; reorging teams doesn't fix the code.
    ref: "concepts.md#api-gateway-and-backend-for-frontend"

  - id: microservices-monolith-api-design-103
    difficulty: expert
    tags: [pagination, cursor, consistency, gotcha]
    question: |
      A keyset-paginated feed sorts by "score DESC" where score can change between
      page requests. Users report seeing the same item twice or missing items across
      pages. What is the root cause and the fix?
    options:
      - "Offset/limit pagination would have no such problem under concurrent writes, so switch the feed back to offset-based paging"
      - "The page size is simply too large for a mutable sort key; reduce it to a single item per page so no two rows can shift together"
      - "The sort key is mutable and non-unique, so the cursor position becomes ambiguous when scores change; use a stable, unique, immutable tiebreaker (e.g. (score, id) with a snapshot or immutable sort key) so the cursor is well-defined"
      - "Cursors are fundamentally incompatible with DESC ordering; re-sort the feed ascending so keyset paging works correctly"
    answer: 2
    explanation: |
      Keyset pagination requires a stable, unique ordering; a mutable/non-unique sort
      key (score) lets rows move across the cursor boundary between requests, causing
      duplicates/skips. The fix is a unique immutable tiebreaker and/or snapshotting
      the sort value. Offset pagination is actually worse under writes; page size and
      DESC are not the cause.
    ref: "concepts.md#pagination-filtering-and-idempotency-keys"

  - id: microservices-monolith-api-design-104
    difficulty: expert
    tags: [idempotency, distributed, downstream-propagation]
    question: |
      A payment orchestrator receives a retried request (same idempotency key) and
      correctly returns the stored result — but during the FIRST attempt it had
      called a downstream "ledger" service that is now called again by an internal
      retry. How do you prevent the ledger from double-posting?
    options:
      - "Rely on the orchestrator's outer idempotency key alone, since downstream services inherit its protection and never need their own dedup"
      - "Make the ledger call fire-and-forget so a duplicate post is harmless and gets netted out during end-of-day reconciliation"
      - "Add a global distributed lock around the entire request for its whole lifetime so no retry can ever run concurrently"
      - "Propagate a derived/deterministic idempotency key (or use a natural key) to the ledger call so the ledger also recognizes and dedupes the retried operation"
    answer: 3
    explanation: |
      Idempotency must propagate: the orchestrator should pass a deterministic
      idempotency (or natural) key to the ledger so the ledger dedupes retried inner
      calls too. The outer key alone doesn't protect inner effects on retry.
      Fire-and-forget loses correctness for money; a global lock for the whole request
      lifetime is a scalability and availability hazard.
    ref: "concepts.md#pagination-filtering-and-idempotency-keys"

  - id: microservices-monolith-api-design-105
    difficulty: expert
    tags: [service-mesh, retries, amplification, gotcha]
    question: |
      A service mesh is configured with automatic retries (3 attempts) at every hop
      of a 4-deep call chain. Under partial overload, the system collapses far faster
      than expected. Why?
    options:
      - "Retries at each layer are essentially free and cannot cause harm, so stacking them at every hop only improves reliability"
      - "The mesh silently disabled mTLS on the inner hops, and the resulting plaintext renegotiation is what causes the collapse"
      - "Retries multiply across layers (retry amplification / storm): 3 attempts per hop over 4 hops can fan out to ~3^4 requests, hammering an already-struggling dependency; use retry budgets, retry only at one layer, and add jitter/circuit breaking"
      - "The collapse is caused by protobuf serialization overhead compounding at each hop as the payloads are re-encoded on every retry"
    answer: 2
    explanation: |
      Naive retries at every layer compound multiplicatively down the chain (retry
      amplification), turning a small failure into a self-inflicted DDoS on the
      recovering service. Mitigations: retry budgets, retrying at a single layer,
      backoff+jitter, and circuit breakers. Retries are not free; TLS and protobuf
      are irrelevant to this failure.
    ref: "concepts.md#service-mesh-and-the-sidecar-pattern"

  - id: microservices-monolith-api-design-106
    difficulty: expert
    tags: [comprehensive, decision, extraction]
    question: |
      A healthy modular monolith has one module ("search indexing") that needs 10x
      the CPU/memory of the rest, scales on a different curve, and is owned by a
      separate team. Cross-module calls to it are already asynchronous via an
      internal queue. What is the most surgical extraction, and why is it low-risk here?
    options:
      - "Do not extract anything; vertically scaling the whole monolith with a bigger instance is always sufficient for a hungry module"
      - "Split the entire monolith into one service per database table so the architecture stays uniform and consistent throughout"
      - "Move the search-indexing logic into the API gateway so the CPU-heavy work runs at the shared central entry point"
      - "Extract the search-indexing module into its own service; risk is low because the boundary is already clean and the interaction is already asynchronous (event/queue), so it's mostly a deployment/data-ownership change, not a coupling redesign"
    answer: 3
    explanation: |
      The ideal extraction target has a distinct scaling profile, separate ownership,
      and an already-clean, already-async boundary — so promoting it to a service is
      largely an operational/data-ownership move rather than untangling coupling,
      making it low-risk. Scaling the whole monolith wastes resources; per-table
      splitting is a distributed monolith; the gateway is no place for domain logic.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: microservices-monolith-api-design-107
    difficulty: expert
    tags: [comprehensive, distributed-monolith, diagnosis]
    question: |
      An "microservices" platform shows: services can only be released together in a
      weekly train, they all import a shared "core-entities" DB library that maps the
      same tables, and adding a field means changing five services. Which single
      remediation attacks the ROOT cause rather than a symptom?
    options:
      - "Add a service mesh with sidecar proxies to speed up the inter-service calls between the coupled services"
      - "Break the shared-database dependency: give each service its own store and integrate via events/APIs, which is what actually enables independent deploys"
      - "Add more replicas of each service so the weekly release train has more capacity to deploy in parallel"
      - "Introduce distributed tracing across the five services so the shared-database coupling becomes easier to observe"
    answer: 1
    explanation: |
      The shared database (via a common entity library) is the root of the lockstep
      coupling — it's a distributed monolith. Only decoupling the data (private
      stores + event/API integration) enables independent deploys. A mesh, more
      replicas, and tracing may help operability but leave the fundamental coupling
      intact.
    ref: "concepts.md#when-not-to-use-microservices"

  - id: microservices-monolith-api-design-108
    difficulty: expert
    tags: [versioning, schema-registry, events]
    question: |
      For an event stream on Kafka consumed by many independent services, which
      compatibility mechanism most directly prevents a producer from emitting an
      event shape that breaks existing consumers?
    options:
      - "URI path versioning (e.g. /v2/) on the producer's REST API endpoints that surround the event stream"
      - "Consumer-driven Pact contracts covering the producer's synchronous request/response endpoints"
      - "A schema registry enforcing compatibility rules (e.g. BACKWARD) on the event schema, rejecting producer schema changes that would break current consumers"
      - "Increasing the Kafka topic's partition count so each consumer reads from its own dedicated partition"
    answer: 2
    explanation: |
      Event streams are governed by a schema registry (Avro/Protobuf/JSON-Schema)
      that enforces compatibility (BACKWARD/FORWARD/FULL) and rejects incompatible
      producer schemas, protecting consumers. URI versioning and Pact target
      request/response APIs, not the message schema on the stream; partition count is
      unrelated to compatibility.
    ref: "concepts.md#api-versioning-and-evolution"

  - id: microservices-monolith-api-design-109
    difficulty: expert
    tags: [comprehensive, sync-async, degradation, decision]
    question: |
      A checkout call synchronously invokes a "loyalty points" service to add points.
      Loyalty has an outage, and checkouts start failing even though points are
      non-essential to completing a purchase. What is the best redesign?
    options:
      - "Keep the loyalty call synchronous but wrap it in an unbounded retry loop with a fixed 500 ms interval, so checkout blocks until loyalty recovers and the points finally post"
      - "Move the loyalty points-award logic into the checkout service's own database transaction so the purchase and the points update always commit together atomically"
      - "Fail the entire checkout with an error to the shopper whenever the loyalty service is down, so points stay perfectly consistent with every completed purchase"
      - "Make loyalty a non-blocking, asynchronous side effect (fire an event / enqueue) or wrap the sync call in a circuit breaker with a graceful fallback, so a loyalty outage never blocks checkout"
    answer: 3
    explanation: |
      A non-essential dependency should not be on the critical synchronous path:
      publish an event / enqueue the points award asynchronously, or protect the sync
      call with a circuit breaker and a fallback so its outage degrades gracefully.
      Infinite retries block checkout; folding loyalty into checkout's transaction
      couples them harder; failing checkout for optional points harms the core flow.
    ref: "concepts.md#synchronous-vs-asynchronous-inter-service-communication"
