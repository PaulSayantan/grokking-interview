topic: "Cloud Offerings: Compute, Elasticity & Processing"
domain: system-design
topic_slug: ccp-offerings-compute-elasticity
version: 1
questions:
  - id: ccp-offerings-compute-elasticity-001
    difficulty: beginner
    tags: [elastic-infrastructure, iaas, intent]
    question: |
      Which Cloud Computing Pattern describes an offering of preconfigured virtual servers,
      storage and network that customers provision themselves via a self-service API, while
      the customer still owns the OS, middleware and application?
    options:
      - "Elastic Platform"
      - "Elastic Infrastructure"
      - "Execution Environment"
      - "Environment-based Availability"
    answer: 1
    explanation: |
      Elastic Infrastructure is the IaaS-altitude pattern: the provider exposes virtual
      servers, storage and network through a self-service interface, and the customer remains
      responsible for the OS, middleware and application. Elastic Platform manages the
      runtime too; Execution Environment is the runtime a platform hosts code in.
    ref: "concepts.md#elastic-infrastructure"

  - id: ccp-offerings-compute-elasticity-002
    difficulty: beginner
    tags: [elastic-platform, paas, intent]
    question: |
      A provider hosts and maintains shared middleware onto which many customers deploy only
      their own application components, with the provider handling OS patching, runtime
      scaling and updates. Which pattern is this?
    options:
      - "Map Reduce"
      - "Elastic Infrastructure"
      - "Hypervisor"
      - "Elastic Platform"
    answer: 3
    explanation: |
      Elastic Platform is the PaaS-altitude pattern: the provider manages the OS AND
      middleware/runtime; customers deploy only components. Elastic Infrastructure stops at
      virtual servers (customer owns the OS). Hypervisor virtualizes hardware; Map Reduce is
      a processing pattern.
    ref: "concepts.md#elastic-platform"

  - id: ccp-offerings-compute-elasticity-003
    difficulty: beginner
    tags: [hypervisor, virtualization, intent]
    question: |
      Which pattern abstracts a physical server's CPU, memory, disk and network into multiple
      isolated virtual servers, each able to run its own OS?
    options:
      - "Node-based Availability"
      - "Execution Environment"
      - "Elastic Platform"
      - "Hypervisor"
    answer: 3
    explanation: |
      The Hypervisor virtualizes physical hardware into virtual servers that are isolated in
      their use of CPU, memory, disk and network, each running its own OS. Execution
      Environment shares a runtime above the OS, not hardware below it.
    ref: "concepts.md#hypervisor"

  - id: ccp-offerings-compute-elasticity-004
    difficulty: beginner
    tags: [map-reduce, processing, intent]
    question: |
      Which pattern increases the performance of processing large data sets by splitting the
      data into chunks, processing them in parallel across many components, then consolidating
      the partial results?
    options:
      - "Execution Environment"
      - "Environment-based Availability"
      - "Map Reduce"
      - "Elastic Platform"
    answer: 2
    explanation: |
      Map Reduce scales OUT data processing: split into chunks, map each to a Processing
      Component that runs in parallel, then reduce (consolidate/aggregate) into one result
      set. The others are compute-offering or availability patterns, not processing patterns.
    ref: "concepts.md#map-reduce"

  - id: ccp-offerings-compute-elasticity-005
    difficulty: intermediate
    tags: [node-based-availability, sla, intent]
    question: |
      A provider states: "each virtual server is guaranteed available 99.95% of the hosting
      period, where available means reachable and returning correct results." Which
      availability pattern is this?
    options:
      - "Node-based Availability"
      - "Elastic Infrastructure"
      - "Public Cloud"
      - "Environment-based Availability"
    answer: 0
    explanation: |
      Node-based Availability attaches the SLA to each individual node/component, defining
      "available" as reachable and functioning as advertised, expressed as a percentage over
      the hosting period. Environment-based Availability guarantees the environment as a
      whole with no per-node notion of availability.
    ref: "concepts.md#node-based-availability"

  - id: ccp-offerings-compute-elasticity-006
    difficulty: intermediate
    tags: [environment-based-availability, sla, intent]
    question: |
      A serverless platform guarantees that the hosting environment stays available and that
      failed instances are automatically replaced, but explicitly states there is no
      availability guarantee for any individual instance. Which pattern is this?
    options:
      - "Hypervisor"
      - "Execution Environment"
      - "Node-based Availability"
      - "Environment-based Availability"
    answer: 3
    explanation: |
      Environment-based Availability guarantees the environment as a whole (at least one
      instance provisioned, automatic replacement of failures) with no notion of availability
      for individual nodes. Node-based Availability would instead attach the SLA to each
      individual instance.
    ref: "concepts.md#environment-based-availability"

  - id: ccp-offerings-compute-elasticity-007
    difficulty: intermediate
    tags: [elastic-infrastructure, elastic-platform, selection]
    question: |
      A team needs to run a custom Linux kernel module and a legacy database that must be
      installed at the OS level, and they want to lift-and-shift existing VM images. Which
      offering pattern fits best?
    options:
      - "Elastic Infrastructure"
      - "Map Reduce"
      - "Elastic Platform"
      - "Execution Environment"
    answer: 0
    explanation: |
      OS-level control, custom kernel modules and lift-and-shift of VM images all require the
      IaaS altitude — Elastic Infrastructure — where the customer owns the OS. Elastic
      Platform / Execution Environment restrict you to the provider's supported runtimes.
    ref: "concepts.md#elastic-infrastructure"

  - id: ccp-offerings-compute-elasticity-008
    difficulty: intermediate
    tags: [elastic-platform, selection, lock-in]
    question: |
      A greenfield web API written in a mainstream language should be deployed with the least
      operational burden — no server patching, automatic runtime scaling — and the team
      accepts being tied to the platform's programming model. Which pattern fits?
    options:
      - "Hypervisor"
      - "Node-based Availability"
      - "Elastic Infrastructure"
      - "Elastic Platform"
    answer: 3
    explanation: |
      Elastic Platform minimizes operational burden (provider manages OS + runtime + scaling)
      at the cost of conforming to the platform's model — the classic PaaS trade-off. Elastic
      Infrastructure would still leave OS patching and scaling automation to the team.
    ref: "concepts.md#elastic-platform"

  - id: ccp-offerings-compute-elasticity-009
    difficulty: intermediate
    tags: [hypervisor, execution-environment, distinction]
    question: |
      What is the key difference between the Hypervisor pattern and the Execution Environment
      pattern?
    options:
      - "Hypervisor only applies to storage; Execution Environment only applies to networking"
      - "Hypervisor shares a runtime above the OS; Execution Environment virtualizes hardware below the OS"
      - "Hypervisor virtualizes hardware below the OS; Execution Environment shares a runtime above the OS"
      - "They are two names for the same virtualization mechanism, differing only in vendor terminology"
    answer: 2
    explanation: |
      The Hypervisor virtualizes physical hardware into isolated VMs (below the OS). The
      Execution Environment shares a managed runtime and platform libraries above the OS,
      hosting application components. They operate at different altitudes of the stack.
    ref: "concepts.md#execution-environment"

  - id: ccp-offerings-compute-elasticity-010
    difficulty: intermediate
    tags: [node-based-availability, environment-based-availability, distinction]
    question: |
      With Node-based Availability versus Environment-based Availability, who is primarily
      responsible for composing redundancy to reach a high application-level availability?
    options:
      - "The customer in both cases, since every cloud SLA leaves redundancy composition to the tenant"
      - "The platform in both cases, because both models bundle automatic failover and instance replacement"
      - "The customer, under Node-based Availability; the platform, under Environment-based Availability"
      - "The platform, under Node-based Availability; the customer, under Environment-based Availability"
    answer: 2
    explanation: |
      Node-based Availability attaches the SLA to each node, so the customer must run multiple
      nodes and build failover to raise application availability. Environment-based
      Availability makes the platform responsible for keeping the environment up and replacing
      failed instances.
    ref: "concepts.md#node-based-availability"

  - id: ccp-offerings-compute-elasticity-011
    difficulty: intermediate
    tags: [elastic-infrastructure, monitoring, elasticity]
    question: |
      Why does the Elastic Infrastructure pattern make exposing monitoring/usage data an
      integral part of the offering, not an optional add-on?
    options:
      - "Because usage metering enables billing AND provides the sensor input that autoscaling control loops need"
      - "Because the monitoring agent terminates TLS and is the only supported way to encrypt inter-VM network traffic"
      - "Because a live usage feed lets the infrastructure run without any underlying hypervisor virtualization layer"
      - "Only to satisfy external compliance auditors who mandate a per-second usage log for every provisioned resource"
    answer: 0
    explanation: |
      The monitoring feed serves two purposes central to elasticity: traceable/metered billing
      and the sensor half of any autoscaling loop. Without usage metrics there is no automated
      scaling and no accurate pay-per-use billing.
    ref: "concepts.md#elastic-infrastructure"

  - id: ccp-offerings-compute-elasticity-012
    difficulty: intermediate
    tags: [execution-environment, intent, reuse]
    question: |
      The Execution Environment pattern primarily addresses which problem?
    options:
      - "How multiple application components can share a hosting environment efficiently instead of each reimplementing common capabilities"
      - "How to abstract one physical server's CPU, memory and disk into many isolated virtual servers"
      - "How to express a formal per-node availability SLA for each individual virtual server offered"
      - "How to split a large data set into chunks and consolidate the parallel partial results"
    answer: 0
    explanation: |
      Execution Environment bundles common capabilities (storage access, communication,
      networking) into platform libraries so components share them rather than each building
      their own. Per-server SLA is Node-based Availability; consolidation is Map Reduce;
      hardware abstraction is the Hypervisor.
    ref: "concepts.md#execution-environment"

  - id: ccp-offerings-compute-elasticity-013
    difficulty: advanced
    tags: [map-reduce, data-locality, tradeoffs]
    question: |
      A defining efficiency principle of the Map Reduce pattern is that, where possible,
      processing should happen where?
    options:
      - "Synchronously inside the client request path so results return within the same HTTP call"
      - "On a single powerful node scaled up vertically to keep all chunks in one machine's memory"
      - "Where the data already resides (data locality), moving computation to data"
      - "Only after all data is copied to one central reducer first"
    answer: 2
    explanation: |
      Map Reduce runs each Processing Component ideally where its chunk of data lives — moving
      computation to the data rather than shipping large data to a central node. Scaling up a
      single node contradicts the scale-out intent, and a single central reducer would negate
      the parallelism.
    ref: "concepts.md#map-reduce"

  - id: ccp-offerings-compute-elasticity-014
    difficulty: advanced
    tags: [map-reduce, selection, batch-vs-stream]
    question: |
      For which workload is Map Reduce a POOR fit?
    options:
      - "Low-latency, per-event processing where each event must be handled within milliseconds"
      - "Computing counts and averages over a huge partitioned dataset"
      - "An embarrassingly parallel scan of terabytes of files spread across many storage nodes"
      - "Batch aggregation over a very large immutable log stored across many nodes"
    answer: 0
    explanation: |
      Map Reduce is a batch, scale-out pattern with a shuffle/reduce phase — great for large
      parallel aggregation, poor for low-latency per-event work, which calls for stream
      processing instead. Deep dive: realtime-streaming-systems.
    ref: "concepts.md#map-reduce"

  - id: ccp-offerings-compute-elasticity-015
    difficulty: intermediate
    tags: [elastic-infrastructure, modern-equivalent]
    question: |
      Which set of modern services most directly instantiates the Elastic Infrastructure
      pattern across clouds?
    options:
      - "AWS Lambda, Azure Functions, GCP Cloud Functions"
      - "AWS EC2 + EBS + VPC, Azure VMs + Managed Disks + VNet, GCP Compute Engine + Persistent Disk + VPC"
      - "AWS EMR, GCP Dataproc, Azure HDInsight"
      - "AWS App Runner, Azure App Service, GCP App Engine"
    answer: 1
    explanation: |
      Elastic Infrastructure = self-service virtual servers + storage + network at IaaS
      altitude: EC2/EBS/VPC, Azure VMs/Disks/VNet, Compute Engine/PD/VPC. Functions and
      App Service are Elastic Platform; EMR/Dataproc/HDInsight are managed Map Reduce.
    ref: "concepts.md#elastic-infrastructure"

  - id: ccp-offerings-compute-elasticity-016
    difficulty: intermediate
    tags: [elastic-platform, modern-equivalent]
    question: |
      Which services are the clearest modern instances of the Elastic Platform pattern?
    options:
      - "Xen, Hyper-V, KVM, VMware ESXi"
      - "AWS Elastic Beanstalk / App Runner / Lambda, Azure App Service / Functions, GCP App Engine / Cloud Run"
      - "AWS EBS, Azure Managed Disks, GCP Persistent Disk"
      - "AWS EC2, Azure Virtual Machines, GCP Compute Engine"
    answer: 1
    explanation: |
      Elastic Platform is PaaS/serverless: Beanstalk, App Runner, Lambda, App Service,
      Functions, App Engine, Cloud Run. EC2/VMs/Compute Engine are Elastic Infrastructure;
      Xen/Hyper-V/KVM/ESXi are Hypervisors; EBS/Disks/PD are storage offerings.
    ref: "concepts.md#elastic-platform"

  - id: ccp-offerings-compute-elasticity-017
    difficulty: intermediate
    tags: [hypervisor, modern-equivalent]
    question: |
      Which of the following are examples of the Hypervisor pattern?
    options:
      - "Xen / AWS Nitro, Microsoft Hyper-V, KVM, VMware ESXi"
      - "Apache Hadoop, Apache Spark, Apache Beam, Google Dataflow"
      - "AWS Elastic Beanstalk, Azure App Service, GCP App Engine, Cloud Run"
      - "Amazon SQS, Apache Kafka, Azure Service Bus, GCP Pub/Sub"
    answer: 0
    explanation: |
      Hypervisors virtualize physical hardware into VMs: Xen/Nitro (EC2), Hyper-V (Azure),
      KVM (GCP/OpenStack), VMware ESXi. The messaging, big-data and PaaS options belong to
      other patterns.
    ref: "concepts.md#hypervisor"

  - id: ccp-offerings-compute-elasticity-018
    difficulty: advanced
    tags: [hypervisor, containers, microvm]
    question: |
      Containers (Docker/runc) and microVMs (AWS Firecracker) relate to the Hypervisor pattern
      how?
    options:
      - "They make hardware virtualization obsolete and are entirely unrelated to the Hypervisor pattern"
      - "They are alternative virtualization/runtime mechanisms that pursue the same goals of isolation and fast provisioning, trading some isolation for faster startup and higher density"
      - "They are block-storage provisioning patterns, not compute virtualization mechanisms at all"
      - "They are exactly the same thing as a Type-1 bare-metal hypervisor, just rebranded"
    answer: 1
    explanation: |
      Containers use OS-level virtualization (shared kernel) and microVMs are lightweight VMs;
      both realize the Hypervisor pattern's goals — isolation plus fast provision/decommission —
      trading isolation strength for speed and density. Hypervisors still underpin most of them.
    ref: "concepts.md#hypervisor"

  - id: ccp-offerings-compute-elasticity-019
    difficulty: advanced
    tags: [environment-based-availability, stateless, selection]
    question: |
      Environment-based Availability composes most naturally with which kind of application
      component?
    options:
      - "A batch reducer that must accumulate every partition on a single node first"
      - "A stateful singleton pinned to one specific node holding in-memory state"
      - "A stateless, horizontally scalable component that any replaceable instance can run"
      - "A component needing a fixed IP permanently bound to one physical server"
    answer: 2
    explanation: |
      Because the platform freely replaces instances and guarantees only the environment,
      components should be stateless and horizontally scalable so any instance is
      interchangeable. Pinning to a specific node conflicts with there being no per-node
      availability guarantee.
    ref: "concepts.md#environment-based-availability"

  - id: ccp-offerings-compute-elasticity-020
    difficulty: intermediate
    tags: [elastic-infrastructure, cross-ref, autoscaling]
    question: |
      An interviewer asks you to design autoscaling on top of an Elastic Infrastructure.
      At the pattern-language altitude, what does Elastic Infrastructure itself provide toward
      that goal?
    options:
      - "Self-service provisioning/decommissioning plus monitoring data — the actuator and sensor an autoscaling loop is built from"
      - "A fully managed Map Reduce cluster that shards and consolidates the workload for you"
      - "Only a per-node availability SLA, with no provisioning or monitoring primitives at all"
      - "A fully built autoscaling controller and load balancer wired up and ready out of the box"
    answer: 0
    explanation: |
      Elastic Infrastructure supplies the primitives — programmatic provision/decommission
      (actuator) and usage monitoring (sensor). The control loop that ties them together
      (Elasticity Manager / autoscaler) is built on top. Deep dive:
      scalability-and-load-balancing.
    ref: "concepts.md#elastic-infrastructure"

  - id: ccp-offerings-compute-elasticity-021
    difficulty: beginner
    tags: [elastic-platform, execution-environment, relationship]
    question: |
      What does an Elastic Platform host customer components inside of?
    options:
      - "A Hypervisor exposed directly to the customer for raw hardware virtualization control"
      - "An Execution Environment (a shared, managed runtime with platform libraries)"
      - "A Map Reduce reducer that consolidates each component's partial output into one result"
      - "A Node-based Availability SLA attached individually to each deployed customer component"
    answer: 1
    explanation: |
      An Elastic Platform offers an Execution Environment — the shared managed runtime and
      platform libraries — into which customers deploy their components. The hypervisor is
      hidden below the OS from the customer's view.
    ref: "concepts.md#elastic-platform"

  - id: ccp-offerings-compute-elasticity-022
    difficulty: advanced
    tags: [node-based-availability, availability-math]
    question: |
      Under Node-based Availability with a 99% per-node SLA, why might a customer still run
      multiple nodes behind a load balancer?
    options:
      - "Because Node-based Availability contractually forbids provisioning more than one node per tenant"
      - "Because usage monitoring and metering are only ever enabled once multiple nodes are running"
      - "Because the SLA already guarantees the whole application, making any extra nodes purely redundant"
      - "Because the guarantee is per node, so composing independent nodes is how the customer raises effective application availability"
    answer: 3
    explanation: |
      A per-node SLA does not guarantee the application; the customer improves effective
      availability by running redundant independent nodes so the probability that all fail
      simultaneously is far lower. This composition burden is exactly what Environment-based
      Availability shifts to the platform.
    ref: "concepts.md#node-based-availability"

  - id: ccp-offerings-compute-elasticity-023
    difficulty: intermediate
    tags: [map-reduce, modern-equivalent]
    question: |
      Which managed services most directly offer the Map Reduce pattern as a service across
      clouds?
    options:
      - "AWS SQS, Azure Service Bus, GCP Pub/Sub"
      - "AWS EBS, Azure Managed Disks, GCP Persistent Disk"
      - "AWS EMR, GCP Dataproc, Azure HDInsight"
      - "AWS EC2, Azure VMs, GCP Compute Engine"
    answer: 2
    explanation: |
      EMR, Dataproc and HDInsight are managed Hadoop/Spark clusters that provide the Map
      Reduce (and successor) processing model. VMs are Elastic Infrastructure; the messaging
      and storage options are different patterns.
    ref: "concepts.md#map-reduce"

  - id: ccp-offerings-compute-elasticity-024
    difficulty: advanced
    tags: [map-reduce, reduce, bottleneck]
    question: |
      In a Map Reduce job, which phase is most commonly the performance bottleneck and a
      straggler/skew risk?
    options:
      - "The reduce/shuffle phase, which consolidates partial results and can be skewed"
      - "Reading the small job configuration file before the mappers are dispatched"
      - "The initial split of the data set into independent chunks for the mappers"
      - "The parallel map phase, which is embarrassingly parallel and scales linearly"
    answer: 0
    explanation: |
      The map phase parallelizes cleanly; the reduce/shuffle phase must move and consolidate
      partial results and is prone to data skew and straggler reducers, making it the usual
      bottleneck.
    ref: "concepts.md#map-reduce"

  - id: ccp-offerings-compute-elasticity-025
    difficulty: intermediate
    tags: [hypervisor, isolation, problem]
    question: |
      What core problem does the Hypervisor pattern solve when several applications must share
      one physical server?
    options:
      - "It contractually guarantees a 99.99% per-application availability SLA on shared hardware"
      - "It isolates applications from one another in their use of CPU, memory, disk and network, simplifying hardware sharing"
      - "It automatically shards relational databases across the co-located applications by key range"
      - "It consolidates the parallel partial results produced by each co-located application"
    answer: 1
    explanation: |
      Without virtualization, co-located apps contend over ports, directories and hardware.
      The Hypervisor gives each its own isolated virtual hardware and OS, simplifying sharing
      and reducing dependence on a specific physical server.
    ref: "concepts.md#hypervisor"

  - id: ccp-offerings-compute-elasticity-026
    difficulty: advanced
    tags: [elastic-platform, multi-tenancy, cross-ref]
    question: |
      The Elastic Platform pattern's economic advantage comes chiefly from what, and which
      library topic owns the deep isolation treatment?
    options:
      - "Guaranteeing every node individually with a strict per-instance SLA; deep dive in failure-theory-advanced"
      - "Charging per Map Reduce job it runs on the tenant's behalf; deep dive in realtime-streaming-systems"
      - "Encrypting all inter-tenant traffic at line rate on the platform; deep dive in caching-and-cdn"
      - "Extending resource pooling across customers up to the OS/middleware level; deep dive in multi-tenancy-and-saas-isolation"
    answer: 3
    explanation: |
      Elastic Platform raises utilization by sharing resources between customers all the way
      up to OS and middleware. The mechanics of isolating those co-located tenants are covered
      in multi-tenancy-and-saas-isolation.
    ref: "concepts.md#elastic-platform"

  - id: ccp-offerings-compute-elasticity-027
    difficulty: intermediate
    tags: [environment-based-availability, modern-equivalent]
    question: |
      A Kubernetes Deployment declares "replicas: 3" and the controller keeps three healthy
      pods running, replacing any that die, while the Service stays reachable. Which
      availability pattern does this embody?
    options:
      - "Hypervisor"
      - "Map Reduce"
      - "Node-based Availability"
      - "Environment-based Availability"
    answer: 3
    explanation: |
      The guarantee is on the environment/service as a whole with automatic replacement of
      failed pods and no promise about any individual pod — Environment-based Availability.
      Pods are cattle, not pets.
    ref: "concepts.md#environment-based-availability"

  - id: ccp-offerings-compute-elasticity-028
    difficulty: advanced
    tags: [execution-environment, lock-in, tradeoffs]
    question: |
      What is the principal trade-off of deploying into an Execution Environment?
    options:
      - "Components gain reusable platform services but must conform to the environment's supported languages, APIs and lifecycle, creating lock-in"
      - "It requires the customer to rack, cable and manage the underlying physical hardware themselves"
      - "It only works for batch data-processing jobs and cannot host long-running online services"
      - "It offers no code reuse at all, so every component duplicates common plumbing from scratch"
    answer: 0
    explanation: |
      The Execution Environment's reuse benefit comes with a constraint: components must fit
      the platform's model (languages, APIs, lifecycle), which is the source of PaaS-style
      lock-in. That is the cost of not managing the runtime yourself.
    ref: "concepts.md#execution-environment"

  - id: ccp-offerings-compute-elasticity-029
    difficulty: beginner
    tags: [node-based-availability, definition]
    question: |
      Under Node-based Availability, when does a node count as "available"?
    options:
      - "When at least one node anywhere in the surrounding environment is provisioned and running"
      - "Whenever the physical data center hosting it still has grid power and cooling available"
      - "When it is reachable AND performs its function as advertised (returns correct results)"
      - "Only when every other node in the same environment is simultaneously up and healthy too"
    answer: 2
    explanation: |
      Node-based Availability defines an available node as one that is both reachable and
      functioning correctly as advertised. "At least one instance exists" is the
      Environment-based definition.
    ref: "concepts.md#node-based-availability"

  - id: ccp-offerings-compute-elasticity-030
    difficulty: advanced
    tags: [selection, offerings, altitude]
    question: |
      A startup wants zero server management, automatic scaling, and per-request billing, and
      is happy writing functions in a supported language. Which combination of patterns best
      describes what they are buying?
    options:
      - "Node-based Availability on customer-managed bare-metal servers billed per hour"
      - "Map Reduce processing paired with a per-node Node-based Availability guarantee"
      - "Elastic Infrastructure hosting a self-managed Hypervisor the customer patches"
      - "Elastic Platform providing an Execution Environment with Environment-based Availability"
    answer: 3
    explanation: |
      Serverless functions = Elastic Platform (managed runtime + scaling) offering an
      Execution Environment, with the SLA on the environment as a whole (Environment-based
      Availability). The others describe IaaS/self-managed or processing patterns.
    ref: "concepts.md#elastic-platform"

  - id: ccp-offerings-compute-elasticity-031
    difficulty: intermediate
    tags: [elastic-infrastructure, elastic-platform, responsibility]
    question: |
      Moving from Elastic Infrastructure to Elastic Platform, which responsibility shifts FROM
      the customer TO the provider?
    options:
      - "Writing and maintaining the application's core business logic and feature code"
      - "Patching and maintaining the OS and middleware runtime, and scaling the runtime"
      - "Choosing the application's data model and designing its persistence schema"
      - "Deciding the application's public API contract and its request/response formats"
    answer: 1
    explanation: |
      Elastic Platform means the provider now owns OS/middleware patching and runtime scaling,
      which under Elastic Infrastructure were the customer's job. Business logic, data model
      and API contract always remain the customer's.
    ref: "concepts.md#elastic-platform"

  - id: ccp-offerings-compute-elasticity-032
    difficulty: advanced
    tags: [map-reduce, watchdog, resilience]
    question: |
      In Map Reduce, if a Processing Component handling one chunk fails partway through, the
      typical resilient response is to:
    options:
      - "Re-issue that chunk to another Processing Component (a Watchdog-style recovery), leaving other chunks unaffected"
      - "Merge the incomplete partial result into the final output anyway and continue"
      - "Migrate the whole job onto a single large node and reprocess every chunk there"
      - "Abort the entire job immediately and return an error to the submitting client"
    answer: 0
    explanation: |
      Because chunks are independent, a controller/Watchdog simply re-issues the failed chunk
      to another component; other chunks proceed. This fault tolerance is a core reason Map
      Reduce scales on commodity hardware.
    ref: "concepts.md#map-reduce"

  - id: ccp-offerings-compute-elasticity-033
    difficulty: intermediate
    tags: [hypervisor, elasticity, provisioning]
    question: |
      Why is the Hypervisor pattern foundational to enabling Elastic Infrastructure?
    options:
      - "Because it shares application-level runtime libraries across all co-located tenants"
      - "Because it consolidates the parallel partial query results into one final answer"
      - "Because a virtual server is an image plus config, so it can be provisioned and decommissioned quickly on demand"
      - "Because it guarantees a per-environment availability SLA covering the whole fleet"
    answer: 2
    explanation: |
      Virtualization turns servers into fast-to-create images, so provisioning/decommissioning
      is quick — the essential capability elasticity depends on. Result consolidation is Map
      Reduce; SLA expression is the availability patterns.
    ref: "concepts.md#hypervisor"

  - id: ccp-offerings-compute-elasticity-034
    difficulty: expert
    tags: [availability, selection, distinction]
    question: |
      An architect wants an SLA they can pin to a specific dedicated instance for a licensing
      audit that requires proving a particular server's uptime. Which availability model do
      they need, and what is the consequence?
    options:
      - "Either availability model works identically for this per-server audit purpose"
      - "Map Reduce availability; the reduce phase tracks and certifies each server's uptime"
      - "Environment-based Availability; the platform proves each individual node's uptime automatically"
      - "Node-based Availability; the SLA attaches to the individual node, but the customer must then compose redundancy for application-level availability"
    answer: 3
    explanation: |
      Only Node-based Availability guarantees a specific individual node, which is what a
      per-server audit needs. The trade-off is that the customer, not the platform, must
      compose multiple nodes to reach high application availability. Environment-based offers
      no per-node guarantee.
    ref: "concepts.md#node-based-availability"

  - id: ccp-offerings-compute-elasticity-035
    difficulty: intermediate
    tags: [execution-environment, platform-libraries]
    question: |
      In the Execution Environment pattern, what is the modern equivalent of the book's
      "platform libraries" that provide reusable capabilities to hosted components?
    options:
      - "The provider's billing dashboard and its per-resource cost-reporting console"
      - "The hypervisor microcode and low-level firmware running beneath the guest OS"
      - "Provider SDKs / cloud client libraries and managed runtime APIs (e.g. the Lambda/App Engine runtime, cloud SDKs, sidecar services)"
      - "The physical network switches and top-of-rack cabling in the data center"
    answer: 2
    explanation: |
      Platform libraries today are the managed runtime APIs and cloud SDKs (plus sidecar
      services on Kubernetes) that supply storage, messaging and networking capabilities to
      the components hosted in the environment.
    ref: "concepts.md#execution-environment"

  - id: ccp-offerings-compute-elasticity-036
    difficulty: advanced
    tags: [elastic-platform, kubernetes, interpretation]
    question: |
      Why can a self-hosted Kubernetes cluster be viewed as an Elastic Platform even though
      the team runs it themselves?
    options:
      - "Because it is only a Map Reduce engine that splits and consolidates batch data jobs"
      - "Because it is a bare-metal hypervisor virtualizing the host's hardware into guest VMs"
      - "Because it presents a shared, elastic runtime into which components are deployed and scaled automatically, hosting them in an Execution Environment abstraction"
      - "Because it guarantees a strict per-pod Node-based Availability SLA for every scheduled pod"
    answer: 2
    explanation: |
      Kubernetes provides a shared, elastic runtime (scheduling, autoscaling, self-healing)
      that hosts components — the Elastic Platform role — with pods running in an
      Execution-Environment-like managed runtime, regardless of who operates the control plane.
    ref: "concepts.md#elastic-platform"

  - id: ccp-offerings-compute-elasticity-037
    difficulty: beginner
    tags: [elastic-infrastructure, self-service]
    question: |
      Which capability is central to the Elastic Infrastructure pattern's definition?
    options:
      - "Automatic reduction and consolidation of parallel query results into a single output set"
      - "Sharing a single managed middleware runtime across many co-located tenants at once"
      - "A per-environment-only availability SLA covering the whole provisioned fleet together"
      - "Provisioning and decommissioning virtual servers, storage and network via a self-service interface"
    answer: 3
    explanation: |
      Self-service, on-demand provisioning/decommissioning of virtual servers, storage and
      network is the heart of Elastic Infrastructure. Runtime sharing is Elastic Platform;
      result reduction is Map Reduce.
    ref: "concepts.md#elastic-infrastructure"

  - id: ccp-offerings-compute-elasticity-038
    difficulty: advanced
    tags: [environment-based-availability, cold-start, tradeoffs]
    question: |
      A downside a team inherits specifically by relying on Environment-based Availability
      (rather than Node-based) is:
    options:
      - "They must build all failover and health-checking machinery themselves from scratch"
      - "They cannot pin availability to a specific node and inherit the platform's instance replacement/cold-start behavior"
      - "They must manage the underlying hypervisor and guest-OS patching directly themselves"
      - "They lose the ability to run more than one instance of the component at a time"
    answer: 1
    explanation: |
      With Environment-based Availability the platform handles redundancy and self-healing, so
      you build less failover — but you give up any per-node guarantee and are subject to the
      platform's replacement and cold-start characteristics.
    ref: "concepts.md#environment-based-availability"

  - id: ccp-offerings-compute-elasticity-039
    difficulty: intermediate
    tags: [map-reduce, successors, modern-equivalent]
    question: |
      Which technologies generalize the map/shuffle/reduce idea beyond classic Hadoop
      MapReduce?
    options:
      - "Block-storage volumes such as AWS EBS, Azure Managed Disks and GCP Persistent Disk"
      - "Managed messaging queues and event buses such as AWS SQS, SNS and EventBridge"
      - "Apache Spark, Google Dataflow / Apache Beam, and query engines like Presto/Trino, Athena and BigQuery"
      - "Bare-metal hypervisors such as Xen, Microsoft Hyper-V and the KVM kernel module"
    answer: 2
    explanation: |
      Spark, Beam/Dataflow and distributed SQL engines (Presto/Trino, Athena, BigQuery)
      extend the same partition-process-consolidate model. The other options are hypervisors,
      storage, and messaging offerings.
    ref: "concepts.md#map-reduce"

  - id: ccp-offerings-compute-elasticity-040
    difficulty: expert
    tags: [selection, mixed, altitude]
    question: |
      A regulated bank must run a specific patched OS and prove a named server's uptime for
      audits, but wants elastic capacity for a nightly batch analytics job over petabytes.
      Which pattern mix fits best?
    options:
      - "Elastic Platform with Environment-based Availability for everything"
      - "Elastic Infrastructure with Node-based Availability for the audited servers, plus Map Reduce for the nightly analytics"
      - "Execution Environment with Node-based Availability, no batch processing pattern"
      - "Hypervisor only, with Environment-based Availability"
    answer: 1
    explanation: |
      The OS-control + named-server audit requirement points to Elastic Infrastructure with
      Node-based Availability; the petabyte nightly batch is a textbook Map Reduce workload.
      A single environment-wide model cannot satisfy the per-server audit.
    ref: "concepts.md#node-based-availability"

  - id: ccp-offerings-compute-elasticity-041
    difficulty: intermediate
    tags: [elastic-platform, elastic-infrastructure, utilization]
    question: |
      Compared with Elastic Infrastructure, Elastic Platform generally achieves higher resource
      utilization because it:
    options:
      - "Extends resource pooling between customers up through the OS and middleware, not just the hardware"
      - "Disables usage monitoring and metering entirely to save per-request scheduling overhead"
      - "Runs every tenant's workload on a single oversized node scaled up vertically"
      - "Gives each customer a dedicated physical server isolated from all other tenants"
    answer: 0
    explanation: |
      Elastic Platform pools shared OS/middleware across many customers, raising utilization
      above IaaS where each customer still runs their own OS on their own VMs. That density is
      the platform's economic edge.
    ref: "concepts.md#elastic-platform"

  - id: ccp-offerings-compute-elasticity-042
    difficulty: beginner
    tags: [group, cloud-offerings, taxonomy]
    question: |
      In the Cloud Computing Patterns language, Elastic Infrastructure, Elastic Platform,
      Hypervisor and Execution Environment all belong to which family?
    options:
      - "Composite application patterns"
      - "Messaging patterns"
      - "Cloud application management patterns"
      - "Cloud offering (compute) patterns"
    answer: 3
    explanation: |
      These describe what providers OFFER for compute — the Cloud Offerings compute patterns.
      They are distinct from application-architecture, management, or messaging pattern
      families in the same language.
    ref: "concepts.md#elastic-infrastructure"

  - id: ccp-offerings-compute-elasticity-043
    difficulty: advanced
    tags: [hypervisor, execution-environment, selection]
    question: |
      A platform team wants to host many small customer functions densely with sub-second
      startup and shared runtime services, accepting weaker isolation than full VMs. This is
      more an instance of which pattern's modern realization?
    options:
      - "A classic Type-1 bare-metal Hypervisor giving each individual function its own full guest OS"
      - "An Execution Environment (shared managed runtime) — often on containers/microVMs — rather than a full hardware Hypervisor per function"
      - "Node-based Availability attaching a strict per-instance uptime SLA to every hosted function"
      - "Map Reduce splitting each function invocation into chunks and consolidating the results"
    answer: 1
    explanation: |
      Dense, fast-start, shared-runtime hosting of many components is the Execution Environment
      realized on containers/microVMs — sharing a runtime above the OS rather than giving each
      function a full virtualized OS via a heavyweight hypervisor.
    ref: "concepts.md#execution-environment"

  - id: ccp-offerings-compute-elasticity-044
    difficulty: intermediate
    tags: [elastic-infrastructure, tradeoffs, control]
    question: |
      The main trade-off of choosing Elastic Infrastructure over Elastic Platform is:
    options:
      - "It only supports batch data-processing workloads and cannot host online services"
      - "It removes the need for any usage monitoring or metering of provisioned resources"
      - "Less control over the OS but zero operational responsibility for the customer at all"
      - "Maximum control and portability, but the customer must handle OS patching, configuration and building scaling automation"
    answer: 3
    explanation: |
      Elastic Infrastructure maximizes control/portability (run any stack) but pushes OS
      patching, configuration and the scaling automation onto the customer — the inverse of
      Elastic Platform's managed-but-constrained model.
    ref: "concepts.md#elastic-infrastructure"

  - id: ccp-offerings-compute-elasticity-045
    difficulty: advanced
    tags: [map-reduce, reduce, aggregation]
    question: |
      During the reduce step of Map Reduce, in addition to consolidating partial results, what
      else commonly happens?
    options:
      - "The hypervisor live-migrates the guest VMs between physical hosts mid-job"
      - "Additional physical servers are provisioned on demand via the self-service interface"
      - "Aggregate operations such as sums, counts or averages are applied to produce the final result"
      - "Each participating node's individual availability SLA is recalculated and re-certified"
    answer: 2
    explanation: |
      Reduce not only merges partial outputs but often applies aggregations (sum, count,
      average) to yield the final result set. Provisioning, SLA and VM migration belong to
      other patterns.
    ref: "concepts.md#map-reduce"

  - id: ccp-offerings-compute-elasticity-046
    difficulty: intermediate
    tags: [environment-based-availability, guarantee, definition]
    question: |
      Which statement best captures what an Environment-based Availability SLA actually
      guarantees?
    options:
      - "A specific named server stays reachable for the full SLA percentage of the period"
      - "Every individual node stays up for at least the guaranteed SLA percentage of time"
      - "At least one instance is provisioned and failed instances are replaced, keeping the environment as a whole available"
      - "The reduce phase of a submitted data-processing job completes within its deadline"
    answer: 2
    explanation: |
      Environment-based Availability guarantees the environment collectively — at least one
      instance running plus automatic replacement of failures — without guaranteeing any
      individual node. Per-node guarantees are the Node-based model.
    ref: "concepts.md#environment-based-availability"

  - id: ccp-offerings-compute-elasticity-047
    difficulty: expert
    tags: [mixed, distinction, altitude]
    question: |
      Order these four patterns from lowest to highest altitude in the stack: Execution
      Environment, Hypervisor, Elastic Infrastructure, Elastic Platform.
    options:
      - "Hypervisor, Elastic Infrastructure, Execution Environment, Elastic Platform"
      - "Execution Environment, Hypervisor, Elastic Platform, Elastic Infrastructure"
      - "Elastic Infrastructure, Hypervisor, Elastic Platform, Execution Environment"
      - "Elastic Platform, Execution Environment, Elastic Infrastructure, Hypervisor"
    answer: 0
    explanation: |
      The Hypervisor virtualizes hardware (lowest); Elastic Infrastructure offers those VMs as
      IaaS; the Execution Environment is the shared runtime above the OS; and the Elastic
      Platform is the PaaS offering that packages that runtime with managed scaling (highest).
    ref: "concepts.md#hypervisor"

  - id: ccp-offerings-compute-elasticity-048
    difficulty: advanced
    tags: [cross-ref, boundaries, scope]
    question: |
      At the Cloud Computing Patterns altitude, what is the correct scope for discussing
      autoscaling and load balancing when teaching Elastic Infrastructure?
    options:
      - "Ignore autoscaling entirely, since it is unrelated to the infrastructure offering altitude"
      - "Only discuss Map Reduce scaling, since that is the sole scaling concern at this altitude"
      - "Re-derive the full autoscaling control-loop and load-balancer algorithms here"
      - "Give the pattern-level role (provisioning + monitoring primitives) and cross-reference scalability-and-load-balancing for the deep dive"
    answer: 3
    explanation: |
      This group keeps the vendor-neutral pattern altitude: describe how Elastic Infrastructure
      supplies the provisioning + monitoring primitives, then cross-reference
      scalability-and-load-balancing (and aws-load-balancing-elb-autoscaling) for the mechanism
      deep dive rather than duplicating it.
    ref: "concepts.md#elastic-infrastructure"

  - id: ccp-offerings-compute-elasticity-049
    difficulty: intermediate
    tags: [hypervisor, tradeoffs, overhead]
    question: |
      A trade-off of the Hypervisor pattern relative to container-based Execution Environments
      is:
    options:
      - "Weaker isolation between workloads but consistently faster instance startup times"
      - "Stronger isolation and any-guest-OS flexibility, but higher per-VM OS overhead and slower startup"
      - "No isolation at all between the co-located guest workloads on the host"
      - "A hard architectural limit of running only one VM per physical host machine"
    answer: 1
    explanation: |
      Full hypervisor VMs give strong isolation and the freedom to run any guest OS, at the
      cost of a full OS per VM (memory/startup overhead). Containers trade some isolation for
      speed and density.
    ref: "concepts.md#hypervisor"

  - id: ccp-offerings-compute-elasticity-050
    difficulty: intermediate
    tags: [map-reduce, scale-out, principle]
    question: |
      Map Reduce embodies which scaling principle of distributed cloud applications?
    options:
      - "Scale up: use a single larger machine to hold and process the whole dataset in memory"
      - "Scale out: spread the work across many component instances and consolidate their results"
      - "Scale to zero only, never distributing the processing work across multiple nodes"
      - "Vertical partitioning of a relational schema by splitting columns across tables"
    answer: 1
    explanation: |
      Map Reduce is the scale-out expression for data processing: distribute chunks across
      many Processing Components in parallel and consolidate — consistent with how distributed
      cloud applications add capacity by adding instances.
    ref: "concepts.md#map-reduce"

  - id: ccp-offerings-compute-elasticity-051
    difficulty: beginner
    tags: [execution-environment, hosting, definition]
    question: |
      In the Execution Environment pattern, common functionality that many applications would
      otherwise each rebuild is provided how?
    options:
      - "Summarized into the environment and exposed through platform libraries to hosted components"
      - "By virtualizing the physical CPU into many isolated virtual CPUs for each guest"
      - "By splitting the input data into independent chunks for parallel processing across nodes"
      - "As a per-node availability SLA attached individually to each hosted component"
    answer: 0
    explanation: |
      The Execution Environment concentrates shared capabilities and exposes them via platform
      libraries so hosted components reuse them instead of reimplementing networking, storage
      access and communication.
    ref: "concepts.md#execution-environment"

  - id: ccp-offerings-compute-elasticity-052
    difficulty: advanced
    tags: [selection, availability, serverless]
    question: |
      A team runs a stateless API on a serverless platform and wants to reason about its SLA.
      Which availability pattern applies, and what must they NOT assume?
    options:
      - "Node-based Availability; they may safely assume a specific instance stays alive and warm between requests"
      - "Environment-based Availability; they must NOT assume any specific instance persists, since instances are replaced and may cold-start"
      - "Node-based Availability; they must operate and patch the underlying hypervisor themselves"
      - "Map Reduce availability; they must split and consolidate each request's partial results"
    answer: 1
    explanation: |
      Serverless platforms provide Environment-based Availability: the environment stays up and
      instances are replaced, but no individual instance is guaranteed to persist — so state
      must not live in an instance, and cold starts are expected.
    ref: "concepts.md#environment-based-availability"
