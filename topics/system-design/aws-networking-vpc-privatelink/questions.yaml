topic: "AWS Networking: VPC, Subnets, PrivateLink and Transit Gateway"
domain: system-design
topic_slug: aws-networking-vpc-privatelink
version: 1
questions:
- id: aws-networking-vpc-privatelink-001
  difficulty: beginner
  tags: [vpc, subnets, fundamentals]
  question: |
    What is the relationship between a VPC, an Availability Zone, and a subnet in AWS?
  options:
  - "A VPC spans all AZs in a Region; a subnet lives in exactly one AZ"
  - "A VPC lives in one AZ; a subnet spans all AZs in the Region"
  - "Both VPCs and subnets are global and span all Regions"
  - "A subnet spans multiple Regions; a VPC is scoped to one AZ"
  answer: 0
  explanation: |
    A VPC is regional and spans every AZ in its Region. A subnet is a slice of the
    VPC CIDR that lives in exactly one AZ, so subnets are the unit of AZ placement.
    There is no multi-AZ subnet; HA means one subnet per AZ for the same tier. The
    other options invert or globalize these boundaries incorrectly.
  ref: "concepts.md#vpc-and-subnets-public-versus-private"

- id: aws-networking-vpc-privatelink-002
  difficulty: beginner
  tags: [subnets, public-private, igw]
  question: |
    What technically makes a subnet a "public" subnet in AWS?
  options:
  - "It has a NAT gateway attached so its instances can reach the internet"
  - "Its instances are assigned private RFC 1918 addresses exclusively"
  - "Its route table has a 0.0.0.0/0 route pointing to an Internet Gateway"
  - "It carries a resource tag whose Name value is set to 'public'"
  answer: 2
  explanation: |
    A subnet is "public" when its associated route table contains a default route
    (0.0.0.0/0) to an Internet Gateway. Instances still need a public/Elastic IP to
    be reachable. A NAT gateway (A) enables outbound from private subnets, not public
    reachability; private IPs (B) and tags (D) don't define public status.
  ref: "concepts.md#vpc-and-subnets-public-versus-private"

- id: aws-networking-vpc-privatelink-003
  difficulty: beginner
  tags: [subnets, reserved-ips, capacity]
  question: |
    How many usable host IP addresses does a /24 subnet provide in AWS?
  options:
  - "256"
  - "254"
  - "251"
  - "250"
  answer: 2
  explanation: |
    AWS reserves the first four addresses and the last address in every subnet
    (network, VPC router, DNS at base+2, future use, and broadcast). A /24 has 256
    total addresses minus 5 reserved = 251 usable. Standard networking gives 254, but
    AWS reserves 5, not 2 — a common capacity-planning gotcha.
  ref: "concepts.md#vpc-and-subnets-public-versus-private"

- id: aws-networking-vpc-privatelink-004
  difficulty: beginner
  tags: [igw, nat-gateway, egress]
  question: |
    A database in a private isolated subnet must never be reachable from the internet
    but the app tier in a private subnet must download OS patches. Which components
    satisfy this?
  options:
  - "Put both tiers in public subnets and give each instance an Elastic IP for patching"
  - "Give the app subnet a route to a NAT gateway; give the DB subnet no internet route at all"
  - "Attach a 0.0.0.0/0 route to an Internet Gateway in both subnets' route tables"
  - "Give the DB subnet a NAT gateway and the app subnet an Internet Gateway"
  answer: 1
  explanation: |
    The app tier needs outbound-only internet, which a NAT gateway (in a public
    subnet) provides while blocking inbound. The DB subnet should have no default
    internet route at all (isolated). Public subnets/IGW routes (A, C) expose them;
    giving the DB a NAT (D) needlessly allows the DB outbound internet access.
  ref: "concepts.md#route-tables-internet-gateway-and-nat-gateway"

- id: aws-networking-vpc-privatelink-005
  difficulty: beginner
  tags: [security-groups, stateful]
  question: |
    A security group allows inbound TCP 443. Do you also need an outbound rule for the
    response traffic to leave?
  options:
  - "Yes, you must add an outbound rule permitting the ephemeral 1024-65535 return ports"
  - "Yes, but only for UDP flows; TCP return traffic is handled automatically by the SG"
  - "No, but only when a subnet NACL also explicitly allows the return direction"
  - "No, security groups are stateful and automatically allow return traffic"
  answer: 3
  explanation: |
    Security groups are stateful: if inbound is allowed, the corresponding return
    traffic is automatically permitted regardless of outbound rules. You do NOT manage
    ephemeral ports for SG return traffic — that is what distinguishes them from
    stateless NACLs, where you must explicitly allow the ephemeral range in the
    opposite direction.
  ref: "concepts.md#security-groups-versus-network-acls"

- id: aws-networking-vpc-privatelink-006
  difficulty: beginner
  tags: [nacl, security-groups, stateless]
  question: |
    Which statement about network ACLs (NACLs) is correct?
  options:
  - "NACLs are stateless, attach to subnets, and support both allow and deny rules"
  - "NACLs are stateful and attach to individual instance ENIs, tracking each connection"
  - "NACLs can reference other security groups as a source in their rule definitions"
  - "NACLs allow all traffic by default and their rules are locked and cannot be modified"
  answer: 0
  explanation: |
    NACLs are stateless (return traffic must be explicitly allowed), attach at the
    subnet level, and support both allow AND deny rules evaluated by rule number,
    lowest-first, first-match-wins. Only security groups are stateful, per-ENI, and can
    reference other SGs. Custom NACLs deny by default and are fully editable.
  ref: "concepts.md#security-groups-versus-network-acls"

- id: aws-networking-vpc-privatelink-007
  difficulty: beginner
  tags: [vpc-endpoints, s3, gateway-endpoint]
  question: |
    Which two AWS services are supported by (free) gateway VPC endpoints?
  options:
  - "SQS and SNS"
  - "KMS and Secrets Manager"
  - "S3 and DynamoDB"
  - "Lambda and API Gateway"
  answer: 2
  explanation: |
    Gateway endpoints exist only for S3 and DynamoDB. They are route-table entries
    (no ENI, no IP, no charge). All other listed services use interface endpoints
    (PrivateLink), which are ENIs with private IPs and carry per-hour and per-GB costs.
  ref: "concepts.md#vpc-endpoints-gateway-versus-interface"

- id: aws-networking-vpc-privatelink-008
  difficulty: beginner
  tags: [vpc-peering, transitive]
  question: |
    VPCs A, B, and C are set up so A is peered with B and B is peered with C. Can A
    reach C?
  options:
  - "Yes, VPC peering is transitive so A reaches C through the B hop automatically"
  - "Yes, but only if all three VPCs are placed in the same Availability Zone"
  - "Yes, provided B enables a transitive-routing flag in its peering route table"
  - "No, VPC peering is non-transitive; A cannot reach C through B"
  answer: 3
  explanation: |
    VPC peering is explicitly non-transitive. A can reach B and B can reach C, but A
    cannot reach C through B. Achieving that requires a direct A-C peering or a Transit
    Gateway (which does provide transitive routing). There is no "transitive routing"
    toggle on a peering.
  ref: "concepts.md#vpc-peering-versus-transit-gateway"

- id: aws-networking-vpc-privatelink-009
  difficulty: beginner
  tags: [vpn, direct-connect, hybrid]
  question: |
    What is the fundamental difference between AWS Site-to-Site VPN and AWS Direct
    Connect?
  options:
  - "VPN delivers higher throughput and lower cost than Direct Connect in every scenario"
  - "VPN is an IPsec tunnel over the public internet; Direct Connect is a dedicated private circuit"
  - "Direct Connect encrypts all traffic with MACsec by default, while VPN sends it in cleartext"
  - "VPN can only interconnect VPCs to one another and cannot reach an on-premises network"
  answer: 1
  explanation: |
    Site-to-Site VPN runs IPsec over the public internet (variable latency, quick to
    set up). Direct Connect is a dedicated physical circuit (consistent latency, higher
    throughput, weeks to provision). Notably Direct Connect is NOT encrypted by default
    (C is backwards — VPN has built-in IPsec). VPN connects on-prem to AWS, not just
    VPC-to-VPC (D).
  ref: "concepts.md#direct-connect-versus-site-to-site-vpn"

- id: aws-networking-vpc-privatelink-010
  difficulty: beginner
  tags: [dns, route53-resolver]
  question: |
    At what address does the built-in VPC DNS resolver live?
  options:
  - "Always the public 8.8.8.8 resolver that AWS proxies internally"
  - "The VPC CIDR base address plus 2 (e.g. 10.0.0.2)"
  - "The last usable IP address in each individual subnet's range"
  - "A random public IP address assigned to the VPC at creation time"
  answer: 1
  explanation: |
    The Route 53 Resolver (AmazonProvidedDNS) is reachable at the VPC's base+2 address
    (e.g. 10.0.0.2) and at link-local 169.254.169.253. 8.8.8.8 is Google's public
    resolver, not the VPC resolver. The last IP is reserved for broadcast, and the
    resolver is not a random public IP.
  ref: "concepts.md#dns-with-route-53-resolver-in-the-vpc"

- id: aws-networking-vpc-privatelink-011
  difficulty: beginner
  tags: [cidr, ip-planning]
  question: |
    What is the range of IPv4 CIDR block sizes allowed for a VPC?
  options:
  - "/16 to /28"
  - "/8 to /24"
  - "/20 to /32"
  - "/24 to /30"
  answer: 0
  explanation: |
    An IPv4 VPC/subnet CIDR can range from /16 (65,536 addresses) down to /28 (16
    addresses). You cannot make a VPC larger than /16 or smaller than /28. You also
    cannot change the primary CIDR after creation — only add up to 5 (raisable to 50)
    secondary CIDR blocks.
  ref: "concepts.md#ip-addressing-and-cidr-planning"

- id: aws-networking-vpc-privatelink-012
  difficulty: beginner
  tags: [egress, data-transfer, cost]
  question: |
    Which type of AWS data transfer is free of charge?
  options:
  - "Outbound data transfer to the internet"
  - "Cross-AZ traffic within a single Region"
  - "Inbound data transfer from the internet"
  - "NAT gateway per-gigabyte data processing"
  answer: 2
  explanation: |
    Inbound (ingress) data transfer from the internet is free. Outbound to the
    internet (~$0.09/GB) and cross-AZ (~$0.01/GB each way) and NAT processing
    (~$0.045/GB) all cost money. This asymmetry is why egress-heavy designs get
    expensive and why CDNs/endpoints are used to cut egress.
  ref: "concepts.md#egress-cost-and-data-transfer-trade-offs"

- id: aws-networking-vpc-privatelink-013
  difficulty: beginner
  tags: [privatelink, fundamentals]
  question: |
    AWS PrivateLink lets a consumer VPC reach a provider's service. How does the
    service appear in the consumer's VPC?
  options:
  - "As a peering connection that routes the provider's entire VPC CIDR into the consumer"
  - "As a public IP address the consumer reaches over the internet through its own IGW"
  - "As a new route table shared cross-account from the provider via Resource Access Manager"
  - "As an interface endpoint — an ENI with a private IP in the consumer's subnet"
  answer: 3
  explanation: |
    PrivateLink surfaces the provider's service as an interface endpoint: an elastic
    network interface with a private IP inside the consumer's own subnet. No CIDRs are
    routed between the VPCs (so it's overlap-safe and one-way), no internet path is
    used, and only that specific service is exposed — not the whole network.
  ref: "concepts.md#privatelink-for-exposing-services-privately"

- id: aws-networking-vpc-privatelink-014
  difficulty: beginner
  tags: [transit-gateway, topology]
  question: |
    What network topology does AWS Transit Gateway implement?
  options:
  - "A regional hub-and-spoke router with transitive routing between attachments"
  - "A full mesh of point-to-point IPsec tunnels built automatically between every VPC pair"
  - "A global anycast DNS resolution layer spanning all Regions for service discovery"
  - "A per-subnet stateless packet-filtering firewall applied at the subnet boundary"
  answer: 0
  explanation: |
    Transit Gateway is a regional hub-and-spoke router: each VPC/VPN/DX attaches once,
    and TGW provides transitive routing between attachments via TGW route tables. This
    turns an O(n^2) peering mesh into O(n) attachments. It is not a mesh (that's
    peering), not DNS, and not a firewall.
  ref: "concepts.md#vpc-peering-versus-transit-gateway"

- id: aws-networking-vpc-privatelink-015
  difficulty: intermediate
  tags: [nat-gateway, high-availability, cost]
  question: |
    For a multi-AZ workload, why is deploying one NAT gateway per AZ (with each AZ's
    private subnets routing to the NAT in the same AZ) preferred over a single shared
    NAT gateway?
  options:
  - "A single NAT gateway is hard-capped at 1 Gbps and cannot scale beyond it"
  - "It isolates AZ faults and avoids cross-AZ data-transfer charges on NAT traffic"
  - "AWS permits only one NAT gateway per Region, forcing one per AZ deployment"
  - "Per-AZ NAT gateways always incur strictly lower hourly charges than a shared one"
  answer: 1
  explanation: |
    One NAT gateway per AZ means an AZ failure only affects that AZ's egress (fault
    isolation), and traffic never crosses AZ boundaries to reach a NAT (avoiding
    cross-AZ ~$0.01/GB each way). A single shared NAT creates an AZ-level SPOF and adds
    cross-AZ fees. NAT GWs scale to 100 Gbps (A wrong) and per-AZ NATs cost MORE in
    hourly charges (D wrong) — the win is resilience and transfer cost.
  ref: "concepts.md#route-tables-internet-gateway-and-nat-gateway"

- id: aws-networking-vpc-privatelink-016
  difficulty: intermediate
  tags: [gateway-endpoint, cost, s3]
  question: |
    An application in a private subnet reads terabytes from S3 daily through a NAT
    gateway. What is the most cost-effective change with no loss of privacy?
  options:
  - "Move the application to a public subnet with an Elastic IP for direct S3 access"
  - "Request a higher NAT gateway bandwidth quota so per-GB processing costs drop"
  - "Add an S3 gateway VPC endpoint so S3 traffic bypasses the NAT gateway"
  - "Replicate the S3 bucket to a second Region and read from the nearer copy"
  answer: 2
  explanation: |
    An S3 gateway endpoint is free and routes S3 traffic over the AWS private network,
    bypassing the NAT gateway entirely — eliminating both the NAT per-GB processing
    (~$0.045/GB) and the internet egress. Moving to a public subnet reduces security
    and still costs egress; raising NAT quota doesn't cut cost; replication adds cost.
  ref: "concepts.md#vpc-endpoints-gateway-versus-interface"

- id: aws-networking-vpc-privatelink-017
  difficulty: intermediate
  tags: [interface-endpoint, on-premises, privatelink]
  question: |
    On-premises servers connected via Direct Connect need private access to Amazon S3
    without going over the internet. Why won't an S3 gateway endpoint work, and what
    does?
  options:
  - "Gateway endpoints only work for DynamoDB, so use a DynamoDB gateway endpoint instead"
  - "Gateway endpoints require public IPs on-prem; assign Elastic IPs to the on-prem servers"
  - "It works fine as-is; on-prem servers can use the gateway endpoint over the Direct Connect"
  - "Gateway endpoints are route-based and unreachable from on-prem; use an S3 interface endpoint"
  answer: 3
  explanation: |
    A gateway endpoint is just a route-table entry usable only from within the VPC — it
    cannot be reached from on-prem over DX/VPN or from peered VPCs. An S3 interface
    endpoint (PrivateLink) is an ENI with a private IP that IS reachable over DX/VPN,
    so it solves the on-prem private-S3 requirement (at per-hour + per-GB cost).
  ref: "concepts.md#vpc-endpoints-gateway-versus-interface"

- id: aws-networking-vpc-privatelink-018
  difficulty: intermediate
  tags: [privatelink, peering, overlap]
  question: |
    Two companies merge; both VPCs use the CIDR 10.0.0.0/16. Team A must call a single
    REST service in Team B. What is the cleanest solution?
  options:
  - "Expose Team B's service via PrivateLink; Team A consumes it through an interface endpoint"
  - "Create a VPC peering connection between the two identical 10.0.0.0/16 VPCs"
  - "Attach both VPCs to a shared Transit Gateway and route between their CIDRs"
  - "Re-IP both VPCs to non-overlapping CIDR ranges before establishing connectivity"
  answer: 0
  explanation: |
    Peering and Transit Gateway both require non-overlapping CIDRs, so they're out with
    two identical 10.0.0.0/16 ranges. PrivateLink is overlap-safe: the consumer only
    talks to the endpoint's private IP, nothing is routed between the CIDRs, and only
    the one service is exposed. Re-IP'ing an entire VPC is possible but far more
    disruptive than exposing one service.
  ref: "concepts.md#privatelink-for-exposing-services-privately"

- id: aws-networking-vpc-privatelink-019
  difficulty: intermediate
  tags: [transit-gateway, peering, scale]
  question: |
    You are connecting 30 VPCs across many accounts that all need to reach shared
    services and each other. Why is Transit Gateway preferred over full-mesh VPC
    peering here?
  options:
  - "Peering always delivers lower latency than a Transit Gateway hub, so a full mesh remains preferable at any scale"
  - "Full mesh needs n(n-1)/2 = 435 peerings with route sprawl; TGW needs one attachment per VPC with transitive routing"
  - "VPC peering cannot span multiple AWS accounts, so 30 cross-account VPCs can only be joined through a Transit Gateway"
  - "Transit Gateway attachments are entirely free of charge, whereas VPC peering bills an hourly fee per connection"
  answer: 1
  explanation: |
    Full mesh of 30 VPCs needs 435 peering connections and every VPC's route tables
    must carry routes to all peers — operationally unmanageable and non-transitive.
    TGW gives O(n) attachments with transitive hub routing. Peering does support
    cross-account (C wrong), and it's TGW that has the per-attachment + per-GB charge,
    not the reverse (D wrong).
  ref: "concepts.md#vpc-peering-versus-transit-gateway"

- id: aws-networking-vpc-privatelink-020
  difficulty: intermediate
  tags: [vpn, ecmp, bandwidth]
  question: |
    A single Site-to-Site VPN connection is bottlenecking at about 1.25 Gbps but you
    need ~5 Gbps to AWS over the internet. What is the correct approach?
  options:
  - "Raise the tunnel MTU to 9001-byte jumbo frames, which quadruples a single VPN tunnel's throughput ceiling"
  - "Switch the VPN from BGP to static routing, which removes protocol overhead and lifts the per-tunnel bandwidth cap"
  - "Attach multiple VPN connections to a Transit Gateway and use ECMP with dynamic BGP routing"
  - "Resize the virtual private gateway to a larger 'vgw.5xlarge' instance type that supports 5 Gbps tunnels"
  answer: 2
  explanation: |
    Each VPN tunnel caps at ~1.25 Gbps. To exceed it you terminate multiple VPN
    connections on a Transit Gateway and use ECMP to load-share across them — which
    requires DYNAMIC BGP routing (ECMP is not supported with static routing, so C is
    wrong). MTU changes and "VGW instance types" don't raise the per-tunnel ceiling.
  ref: "concepts.md#direct-connect-versus-site-to-site-vpn"

- id: aws-networking-vpc-privatelink-021
  difficulty: intermediate
  tags: [direct-connect, high-availability]
  question: |
    What is the standard cost-effective way to make hybrid connectivity resilient when
    you have a single Direct Connect circuit?
  options:
  - "Provision a second Direct Connect circuit in the same DX location"
  - "Rely on the two tunnels inside the single DX for HA"
  - "Enable MACsec encryption on the Direct Connect port, which automatically activates a redundant standby circuit"
  - "Use a Site-to-Site VPN as an automatic failover path for the Direct Connect"
  answer: 3
  explanation: |
    A single DX is a SPOF. The classic HA design is DX primary + Site-to-Site VPN
    failover over the internet — you get DX performance normally and internet-based
    resilience if the circuit drops, without paying for a second DX. A second DX in the
    SAME location doesn't survive a location failure (need different locations). DX has
    no "two tunnels" (that's VPN), and MACsec is encryption, not redundancy.
  ref: "concepts.md#direct-connect-versus-site-to-site-vpn"

- id: aws-networking-vpc-privatelink-022
  difficulty: intermediate
  tags: [security-groups, nacl, when-to-use]
  question: |
    You must block a specific malicious /24 CIDR from reaching any host across an
    entire subnet. Which control is the right tool and why?
  options:
  - "A security group inbound rule, because SGs can deny specific CIDRs"
  - "A NACL deny rule on the subnet, because SGs cannot express a deny and NACLs apply subnet-wide"
  - "A route-table blackhole entry for the malicious /24, which drops inbound packets sourced from that range subnet-wide"
  - "A PrivateLink endpoint policy that denies the /24 as a source principal across the whole subnet"
  answer: 1
  explanation: |
    Security groups are allow-only — they cannot deny a specific CIDR (you can only
    omit it from allows, which fails when other broad allows exist). A NACL supports
    explicit deny rules and applies to the whole subnet, making it the right backstop
    for blocklisting a bad CIDR. A blackhole route affects routing to a destination not
    a source, and endpoint policies govern service access, not arbitrary CIDR blocks.
  ref: "concepts.md#security-groups-versus-network-acls"

- id: aws-networking-vpc-privatelink-023
  difficulty: intermediate
  tags: [security-groups, micro-segmentation]
  question: |
    What is the idiomatic AWS way to express "only the app tier may connect to the DB
    tier on port 5432," and why is it preferred over CIDR-based rules?
  options:
  - "Reference the app-tier security group as the source in the DB-tier security group"
  - "Hard-code each app instance's private IP in the DB security group"
  - "Place both tiers in the same subnet and let the subnet NACL restrict 5432 to just the app instances"
  - "Open port 5432 to the entire VPC CIDR block, since only the app tier will ever originate that traffic"
  answer: 0
  explanation: |
    Security groups can reference other SGs as the source. Making the DB SG allow 5432
    from the app-tier SG is self-adjusting as instances scale in/out (no IP list to
    maintain) and is least-privilege. Hard-coding IPs is brittle, sharing a subnet
    doesn't restrict by identity, and opening to the whole VPC CIDR over-exposes the DB.
  ref: "concepts.md#security-groups-versus-network-acls"

- id: aws-networking-vpc-privatelink-024
  difficulty: intermediate
  tags: [privatelink, nlb, layer4]
  question: |
    A provider wants to expose an HTTP service to many customers via PrivateLink. Which
    load balancer must front the endpoint service, and what is the resulting
    limitation?
  options:
  - "An Application Load Balancer, giving full L7 path-based routing"
  - "A Classic Load Balancer, which supports both L4 and L7 natively"
  - "A Network Load Balancer (or GWLB), so routing is L4 only with no HTTP path awareness"
  - "No load balancer is needed; PrivateLink routes directly to instances"
  answer: 2
  explanation: |
    A PrivateLink endpoint service is fronted by a Network Load Balancer (or Gateway
    Load Balancer). Because the NLB is Layer 4, the endpoint sees TCP/UDP flows with no
    HTTP path/host routing — L7 logic must live behind the NLB (e.g. an internal ALB or
    the app). The other options misstate the required LB type.
  ref: "concepts.md#privatelink-for-exposing-services-privately"

- id: aws-networking-vpc-privatelink-025
  difficulty: intermediate
  tags: [route-tables, longest-prefix]
  question: |
    A subnet route table has 0.0.0.0/0 → NAT gateway and 10.0.0.0/16 → local. Traffic
    is destined for 10.0.5.10 (inside the VPC). Where does it go?
  options:
  - "To the NAT gateway, because 0.0.0.0/0 matches everything"
  - "It is dropped because two overlapping routes match and the route table cannot resolve the ambiguity"
  - "To the Internet Gateway, since default-route destinations always take precedence over the local route"
  - "To the local route, because longest-prefix match selects 10.0.0.0/16"
  answer: 3
  explanation: |
    Route selection uses longest-prefix match. 10.0.5.10 matches both 0.0.0.0/0 and
    the more specific 10.0.0.0/16 local route; the /16 wins, so intra-VPC traffic stays
    local. The implicit local route cannot be overridden. Overlapping matches are
    resolved by specificity, not dropped.
  ref: "concepts.md#route-tables-internet-gateway-and-nat-gateway"

- id: aws-networking-vpc-privatelink-026
  difficulty: intermediate
  tags: [cidr, secondary-cidr, exhaustion]
  question: |
    An EKS cluster using the VPC CNI is exhausting IP addresses in its subnets and the
    VPC's /16 primary CIDR can't be enlarged. What are the valid remedies?
  options:
  - "Add secondary CIDR blocks to the VPC, or move the workload to IPv6"
  - "Resize the primary CIDR from /16 to /12 in place"
  - "Delete and recreate the VPC with a bigger block, losing no resources"
  - "Enable transitive peering to borrow IPs from another VPC"
  answer: 0
  explanation: |
    You cannot change a VPC's primary CIDR after creation, but you can add up to 5
    (raisable to 50) secondary CIDR blocks, or adopt IPv6 (Amazon-provided /56 per VPC)
    to escape IPv4 scarcity for ENI-dense workloads. You can't resize the primary in
    place, recreating loses resources, and peering can't share address space.
  ref: "concepts.md#ip-addressing-and-cidr-planning"

- id: aws-networking-vpc-privatelink-027
  difficulty: intermediate
  tags: [route53-resolver, hybrid, dns]
  question: |
    On-premises servers must resolve records in a private hosted zone associated with a
    VPC. Which Route 53 Resolver feature enables this?
  options:
  - "A Route 53 Resolver outbound endpoint"
  - "A public hosted zone with a CNAME"
  - "A Route 53 Resolver inbound endpoint"
  - "Enabling enableDnsHostnames on the VPC only"
  answer: 2
  explanation: |
    An inbound Resolver endpoint lets on-prem DNS forward queries INTO the VPC to
    resolve private hosted zone / internal names. An outbound endpoint does the reverse
    (VPC forwarding queries out to on-prem). A public hosted zone would expose the
    records publicly; the DNS attributes alone don't create an on-prem resolution path.
  ref: "concepts.md#dns-with-route-53-resolver-in-the-vpc"

- id: aws-networking-vpc-privatelink-028
  difficulty: intermediate
  tags: [central-egress, multi-account, tradeoff]
  question: |
    A platform team centralizes internet egress in a shared "egress VPC" reached over
    Transit Gateway. What is the primary trade-off versus a NAT gateway in every VPC?
  options:
  - "It eliminates all data-transfer charges by keeping every byte on the AWS private backbone rather than the internet"
  - "It improves per-VPC latency and resilience because each VPC's traffic takes a shorter, more direct egress path"
  - "It removes the need for per-VPC security groups since the central egress VPC enforces all filtering in one place"
  - "It saves on duplicate NAT/endpoints and centralizes inspection, but adds TGW per-GB charges, a latency hop, and a central chokepoint"
  answer: 3
  explanation: |
    Centralizing egress means paying for NAT and interface endpoints once and getting a
    single inspection/control point, but every byte now crosses the TGW (per-GB
    processing), adds a latency hop, and creates a central blast radius / bandwidth
    chokepoint. It does not eliminate transfer charges (it adds TGW fees), and it
    generally hurts (not helps) per-VPC latency/resilience.
  ref: "concepts.md#multi-vpc-and-multi-account-network-design"

- id: aws-networking-vpc-privatelink-029
  difficulty: intermediate
  tags: [vpc-sharing, ram, multi-account]
  question: |
    What does VPC sharing (via AWS Resource Access Manager) let you do, and what is the
    trade-off?
  options:
  - "It lets multiple accounts launch resources into shared subnets of one VPC — fewer VPCs and no inter-VPC charges, but weaker isolation"
  - "It makes VPC peering transitive across accounts so any participant can reach any peered VPC through the owner"
  - "It automatically replicates the owner's VPC and all its subnets into every participant account for redundancy"
  - "It converts each account's security groups into subnet-wide NACLs so rules apply uniformly across accounts"
  answer: 0
  explanation: |
    VPC sharing shares subnets from an owner account into participant accounts so they
    launch resources into the SAME VPC. Benefits: fewer VPCs, shared address space, no
    inter-VPC data-transfer cost. Trade-off: weaker isolation than separate VPCs since
    workloads share one network. It is not about peering transitivity, replication, or
    converting security controls.
  ref: "concepts.md#multi-vpc-and-multi-account-network-design"

- id: aws-networking-vpc-privatelink-030
  difficulty: intermediate
  tags: [dns, throttling, limits]
  question: |
    A high-fan-out service on a single instance suddenly sees intermittent DNS
    resolution timeouts under load. Which VPC limit is the likely cause?
  options:
  - "The 60-rule-per-security-group limit, which starts dropping DNS queries once the rule count is exceeded"
  - "The 200-subnets-per-VPC limit, which throttles resolver responses as the subnet count approaches the ceiling"
  - "The 1024 packets-per-second-per-ENI limit to the Route 53 Resolver"
  - "The 5-VPCs-per-Region default limit, which caps how many concurrent DNS lookups a Region can service"
  answer: 2
  explanation: |
    Each ENI is limited to 1024 packets/sec to the VPC Resolver (the .2 address), a
    hard non-adjustable throttle. Heavy DNS fan-out from one instance exceeds it and
    surfaces as DNS timeouts. Mitigate with client caching, longer TTLs, or a caching
    forwarder. The other limits are unrelated to DNS query throughput.
  ref: "concepts.md#dns-with-route-53-resolver-in-the-vpc"

- id: aws-networking-vpc-privatelink-031
  difficulty: intermediate
  tags: [interface-endpoint, private-dns, gotcha]
  question: |
    After creating an interface endpoint for SQS, application calls still resolve to
    the public SQS endpoint and traverse the NAT gateway. What is the most likely
    cause?
  options:
  - "The interface endpoint needs an Elastic IP attached before its private hostname will resolve correctly"
  - "SQS does not support interface endpoints, so its traffic must always egress through the NAT gateway"
  - "The endpoint's security group is stateful, so it forwards return traffic back out to the public endpoint"
  - "Private DNS is not enabled on the endpoint (or the VPC's DNS attributes are off)"
  answer: 3
  explanation: |
    Interface endpoints rely on private DNS so the standard service hostname resolves to
    the endpoint's private IP. If private DNS on the endpoint (or enableDnsSupport/
    enableDnsHostnames on the VPC) is off, the public name still resolves publicly and
    traffic goes out via NAT. SQS does support interface endpoints; endpoints don't take
    Elastic IPs; SG statefulness is irrelevant here.
  ref: "concepts.md#vpc-endpoints-gateway-versus-interface"

- id: aws-networking-vpc-privatelink-032
  difficulty: intermediate
  tags: [egress-only-igw, ipv6]
  question: |
    What is the IPv6 equivalent of a NAT gateway that allows outbound internet access
    while blocking inbound connections?
  options:
  - "A second Internet Gateway dedicated to IPv6, which permits outbound flows while dropping unsolicited inbound ones"
  - "An egress-only Internet Gateway"
  - "A NAT gateway with the IPv6 translation option enabled to mask inbound connections"
  - "A carrier gateway, the IPv6 component that allows outbound access while blocking inbound connections"
  answer: 1
  explanation: |
    IPv6 has no NAT (addresses aren't scarce), so outbound-only IPv6 uses an egress-only
    Internet Gateway, which permits outbound and blocks unsolicited inbound. NAT
    gateways are IPv4-only for this purpose; a carrier gateway is for Wavelength/5G edge,
    not general IPv6 egress.
  ref: "concepts.md#route-tables-internet-gateway-and-nat-gateway"

- id: aws-networking-vpc-privatelink-033
  difficulty: intermediate
  tags: [zero-trust, isolation]
  question: |
    In a zero-trust design, why is relying only on security groups and subnets
    insufficient, and what is added?
  options:
  - "IP-based network rules don't express service identity; add IAM auth, mTLS, and endpoint policies so nothing is trusted by IP alone"
  - "Nothing is added; tight security groups plus per-tier subnet boundaries already satisfy a zero-trust posture on their own"
  - "You must delete all security groups and rely solely on subnet NACLs, since stateless deny rules are the basis of zero-trust"
  - "You move every workload into public subnets and put a WAF in front, letting the WAF become the sole identity check"
  answer: 0
  explanation: |
    Zero-trust means identity, not the network, is the trust boundary. SGs/subnets are
    coarse and IP-based; they can't say "this service identity may call that API." You
    layer on IAM authentication, mTLS, SG-referencing-SG, and VPC endpoint policies so
    that even inside one VPC nothing is trusted purely by IP. You keep SGs (not delete
    them) and you don't expose things publicly.
  ref: "concepts.md#network-isolation-and-zero-trust"

- id: aws-networking-vpc-privatelink-034
  difficulty: intermediate
  tags: [transit-gateway, per-flow, limits]
  question: |
    A nightly bulk migration pushes a single large TCP flow through a Transit Gateway
    and tops out around 5 Gbps even though the VPC attachment supports up to 100 Gbps
    aggregate. Why?
  options:
  - "The TGW route table has hit its route limit, so it degrades large flows down to roughly 5 Gbps"
  - "The NAT gateway sitting in the traffic path is throttling this individual flow to its 5 Gbps processing cap"
  - "A single flow (5-tuple) through TGW is capped around 5 Gbps; aggregate is higher but per-flow is limited"
  - "The attachment's security group rules impose a per-flow bandwidth cap of about 5 Gbps on large connections"
  answer: 2
  explanation: |
    TGW imposes a per-flow (single TCP/UDP 5-tuple) limit of about 5 Gbps even
    though aggregate per-attachment reaches up to ~100 Gbps per AZ. Elephant flows should
    parallelize into multiple connections or use direct VPC peering (which has no per-flow
    cap). Route-table fullness, NAT, and SGs don't impose a per-flow bandwidth ceiling.
  ref: "concepts.md#vpc-peering-versus-transit-gateway"

- id: aws-networking-vpc-privatelink-035
  difficulty: intermediate
  tags: [nacl, ephemeral-ports, stateless]
  question: |
    A custom NACL allows inbound HTTPS (443) but users report broken connections. What
    is the most likely NACL misconfiguration?
  options:
  - "The instance security group is silently overriding the NACL and blocking inbound 443 despite the allow rule"
  - "The outbound rules don't allow the ephemeral return port range (e.g. 1024-65535)"
  - "NACLs cannot express an allow rule for port 443, so HTTPS must instead be permitted at the security-group layer"
  - "The NACL is operating in stateful mode and must be switched to stateless before return traffic can flow"
  answer: 1
  explanation: |
    NACLs are stateless, so return traffic isn't automatically allowed. Even with
    inbound 443 permitted, if the outbound rules don't allow the ephemeral port range
    the server's responses are dropped. This is the classic NACL pitfall. NACLs can
    allow 443, and they are already stateless (D is nonsensical).
  ref: "concepts.md#security-groups-versus-network-acls"

- id: aws-networking-vpc-privatelink-036
  difficulty: intermediate
  tags: [cost, cross-az, placement]
  question: |
    A chatty microservice makes millions of calls to a dependency and both are deployed
    across three AZs with round-robin routing. The cross-AZ data-transfer bill is high.
    What reduces it while keeping availability reasonable?
  options:
  - "Permanently collapse both services into a single AZ, which AWS bills at a discounted intra-AZ transfer rate with no availability loss"
  - "Prefer same-AZ routing (topology-aware / zonal routing) so most calls stay within an AZ, keeping multi-AZ deployment for failover"
  - "Route all inter-service traffic through a shared NAT gateway, which consolidates the flows onto a cheaper egress path"
  - "Switch both services to public subnets so the calls traverse the internet gateway instead of the cross-AZ backbone"
  answer: 1
  explanation: |
    Cross-AZ transfer is ~$0.01/GB each way. Using topology-aware / same-AZ preferential
    routing keeps most traffic within an AZ (free, same-VPC private) while still
    deploying in multiple AZs for failover. Collapsing to one AZ (A) sacrifices
    availability; NAT (C) and public subnets (D) add cost/exposure without helping.
  ref: "concepts.md#egress-cost-and-data-transfer-trade-offs"

- id: aws-networking-vpc-privatelink-037
  difficulty: intermediate
  tags: [inspection-vpc, appliance-mode]
  question: |
    When routing east-west traffic through a firewall in an inspection VPC via Transit
    Gateway, why enable "appliance mode" on the TGW attachment?
  options:
  - "It doubles the attachment bandwidth by aggregating both AZ paths into one link"
  - "It makes the attachment free of charge by waiving TGW per-GB data-processing fees"
  - "It converts the firewall into a stateless NACL that AWS manages on the attachment"
  - "It maintains flow symmetry so both directions of a flow hit the same firewall appliance"
  answer: 3
  explanation: |
    Appliance mode makes TGW keep both directions of a given flow pinned to the same AZ/
    appliance, preserving flow symmetry that stateful firewalls require. Without it,
    asymmetric routing can send the return path to a different appliance that has no
    state, breaking connections. It doesn't change bandwidth, cost, or the firewall's
    nature.
  ref: "concepts.md#multi-vpc-and-multi-account-network-design"

- id: aws-networking-vpc-privatelink-038
  difficulty: intermediate
  tags: [ipam, cidr, multi-account]
  question: |
    What is the modern AWS-native way to prevent overlapping CIDRs and track IP
    utilization across many accounts and Regions?
  options:
  - "Use AWS IP Address Manager (IPAM) to allocate, track, and prevent overlaps"
  - "Manually maintain a spreadsheet of CIDRs reviewed by a central network team each quarter"
  - "Enable transitive routing on all VPCs so a shared route table auto-reconciles ranges"
  - "Assign every VPC the same /16 and rely on NAT to translate the duplicated addresses"
  answer: 0
  explanation: |
    IPAM automates hierarchical CIDR allocation, tracks utilization, and prevents
    overlap across accounts/Regions — the scalable answer to CIDR governance. A
    spreadsheet doesn't scale or enforce anything, transitive routing doesn't manage
    addressing, and identical /16s guarantees overlap (breaking future peering/TGW).
  ref: "concepts.md#ip-addressing-and-cidr-planning"

- id: aws-networking-vpc-privatelink-039
  difficulty: intermediate
  tags: [nat-gateway, connection-limit]
  question: |
    A service behind a NAT gateway makes a huge number of simultaneous connections to a
    single third-party API IP and starts seeing SNAT port allocation errors. What is
    the cause and a fix?
  options:
  - "The security group ran out of rules and began silently rejecting new connections; add more rules"
  - "The VPC ran out of subnets and could not source addresses for new flows; add more subnets"
  - "The NAT gateway hit its ~55,000 simultaneous connections per unique destination limit; spread across more destinations or NAT gateways"
  - "The route table exceeded its 500-route ceiling and started dropping flows; summarize the routes"
  answer: 2
  explanation: |
    A NAT gateway supports ~55,000 simultaneous connections to each unique destination
    (IP+port). High fan-out to a single destination exhausts source ports, causing SNAT
    errors. Fixes include spreading load across multiple destination IPs/ports, using
    more NAT gateways, or a PrivateLink/interface endpoint. The other limits are
    unrelated to SNAT exhaustion.
  ref: "concepts.md#failure-modes-and-how-the-design-degrades"

- id: aws-networking-vpc-privatelink-040
  difficulty: intermediate
  tags: [direct-connect, encryption, macsec]
  question: |
    A compliance requirement mandates encryption in transit over a Direct Connect link.
    Which options are valid?
  options:
  - "Direct Connect encrypts all traffic with AES-256 by default, so no extra step is needed"
  - "Enable MACsec on supported DX ports, or run an IPsec VPN over the Direct Connect"
  - "Encryption is impossible over Direct Connect because it is a dedicated Layer 2 circuit"
  - "Enable a NACL rule with the encrypt action to wrap the traffic in transit"
  answer: 1
  explanation: |
    A plain Direct Connect is private but NOT encrypted. To meet an encryption
    requirement you enable MACsec (on supported 10/100 Gbps ports) or run a Site-to-Site
    IPsec VPN over the DX. It is not encrypted by default (A wrong), encryption is
    certainly possible (C wrong), and NACLs are packet filters, not encryption (D wrong).
  ref: "concepts.md#direct-connect-versus-site-to-site-vpn"

- id: aws-networking-vpc-privatelink-041
  difficulty: advanced
  tags: [privatelink, peering, judgment]
  question: |
    A SaaS provider must expose one API to 5,000 customer VPCs across many accounts,
    with overlapping CIDRs likely and strict one-way access (customers must never reach
    into the provider network). Which design is most appropriate?
  options:
  - "Full-mesh VPC peering to every customer VPC with tightly scoped routes to the one API"
  - "A shared Transit Gateway that all 5,000 customer VPCs attach to and route through to the API"
  - "Publish the API on a public ALB and restrict by security group referencing customer accounts"
  - "A PrivateLink endpoint service fronted by an NLB; each customer creates an interface endpoint"
  answer: 3
  explanation: |
    PrivateLink is purpose-built for this: overlap-safe (nothing routed between CIDRs),
    strictly one-way (consumer initiates only), exposes just the one service, and scales
    to thousands of consumers without N-way route management. Peering/TGW require
    non-overlapping CIDRs and connect whole networks bidirectionally (breaking one-way
    and overlap constraints). A public ALB uses the internet and SGs can't reference
    cross-account principals as sources.
  ref: "concepts.md#privatelink-for-exposing-services-privately"

- id: aws-networking-vpc-privatelink-042
  difficulty: advanced
  tags: [transit-gateway, routing, segmentation]
  question: |
    You need production and non-production VPC attachments on the same Transit Gateway
    to be fully isolated from each other while both can reach a shared-services VPC. How
    do you implement this?
  options:
  - "Use separate TGW route tables (segments): prod and non-prod associate to different route tables that only propagate the shared-services route"
  - "Use one shared TGW route table for everything and rely on security groups to block prod-to-non-prod flows"
  - "Put prod and non-prod in the same VPC with different subnets and separate them using per-subnet NACLs"
  - "Disable route propagation entirely and add every prod and non-prod route as static entries by hand"
  answer: 0
  explanation: |
    TGW supports multiple route tables to build network segments. By associating prod
    and non-prod attachments with separate TGW route tables that each only contain a
    route to the shared-services VPC (and not to each other), you get isolation with
    shared access. A single shared route table would make everything mutually routable;
    SGs alone don't stop routing, and merging into one VPC removes the isolation.
  ref: "concepts.md#vpc-peering-versus-transit-gateway"

- id: aws-networking-vpc-privatelink-043
  difficulty: advanced
  tags: [cost, tgw, peering, judgment]
  question: |
    Two data-intensive VPCs exchange 500 TB/month directly and are cost-sensitive; you
    also have 20 other VPCs needing transitive shared-services access. What hybrid
    topology minimizes cost while meeting both needs?
  options:
  - "Route all 22 VPCs including the two heavy ones through Transit Gateway for one uniform hub"
  - "Full-mesh peer all 22 VPCs so every pair including the heavy flow gets a direct connection"
  - "Keep a direct VPC peering between the two heavy VPCs (no per-GB TGW fee, no per-flow cap) and attach the other 20 to a Transit Gateway"
  - "Use PrivateLink endpoint services between all 22 VPCs to keep every path fully private"
  answer: 2
  explanation: |
    TGW charges per-GB processed, so pushing 500 TB/month through it is expensive and
    also subject to the per-flow cap; a direct peering between the two heavy VPCs avoids
    both (peering has no hourly/per-GB TGW fee and no per-flow limit). The 20 lighter
    VPCs benefit from TGW's transitive hub. Full mesh of 22 is unmanageable; PrivateLink
    exposes single services, not general east-west networking.
  ref: "concepts.md#vpc-peering-versus-transit-gateway"

- id: aws-networking-vpc-privatelink-044
  difficulty: advanced
  tags: [failure-modes, availability, endpoints]
  question: |
    An interface endpoint for a critical service was created with an ENI in only one AZ,
    but the application runs in three AZs. Which failure does this design NOT tolerate,
    and what's the fix?
  options:
  - "It tolerates AZ loss fine because the endpoint ENI silently migrates to a surviving AZ; no change needed"
  - "It cannot tolerate a Region loss; add a second Region with a replicated interface endpoint for failover"
  - "It cannot tolerate a security group change; pin the SG to the endpoint so rules never drift under it"
  - "Loss of the endpoint's AZ makes the service unreachable from all AZs (or forces cross-AZ calls); deploy an endpoint ENI in every AZ used"
  answer: 3
  explanation: |
    An interface endpoint places an ENI per enabled AZ. With only one AZ enabled, losing
    that AZ removes the endpoint entirely (and normally every call from other AZs
    crosses AZ, adding cost/latency). The fix is enabling the endpoint in each AZ the app
    uses. Region loss is a separate concern; SG changes aren't the failure here.
  ref: "concepts.md#failure-modes-and-how-the-design-degrades"

- id: aws-networking-vpc-privatelink-045
  difficulty: advanced
  tags: [egress, cost-estimation, endpoints]
  question: |
    A fleet reads 1 PB/month from S3 and calls SQS heavily, all from private subnets
    currently via NAT gateways. Which change yields the largest cost reduction?
  options:
  - "Increase NAT gateway bandwidth quotas so the per-GB processing rate drops at high volume"
  - "Add an S3 gateway endpoint (free) to remove NAT + egress on the 1 PB, and an SQS interface endpoint to cut NAT on SQS traffic"
  - "Move the fleet to a single AZ to collapse cross-AZ transfer on the S3 and SQS reads"
  - "Enable S3 Transfer Acceleration so the reads take a cheaper edge-optimized path"
  answer: 1
  explanation: |
    1 PB through NAT costs ~$0.045/GB processing (~$45k/month) plus egress. An S3 gateway
    endpoint is FREE and removes both for the dominant S3 traffic — by far the biggest
    win; an SQS interface endpoint further trims NAT on SQS. Raising NAT quotas doesn't
    cut cost, single-AZ hurts availability, and Transfer Acceleration adds cost and is
    for internet uploads, not private reads.
  ref: "concepts.md#egress-cost-and-data-transfer-trade-offs"

- id: aws-networking-vpc-privatelink-046
  difficulty: advanced
  tags: [direct-connect, vpn, judgment, latency]
  question: |
    On-prem needs 8 Gbps sustained, sub-5 ms, encrypted connectivity to an AWS database
    for a latency-sensitive hybrid app, with resilience. Which design best fits?
  options:
  - "A 10 Gbps Direct Connect with MACsec (or IPsec over DX) for encryption, plus a VPN failover, terminated on a Transit Gateway"
  - "A single Site-to-Site VPN over the internet, which comfortably sustains 8 Gbps once jumbo frames are enabled"
  - "Multiple Site-to-Site VPNs with ECMP over a TGW, which delivers the same jitter guarantee as a dedicated circuit"
  - "PrivateLink from on-prem to the database, giving a private encrypted path with sub-5 ms latency at 8 Gbps"
  answer: 0
  explanation: |
    8 Gbps sustained + sub-5 ms + consistent latency rules out internet VPN (variable,
    ~1.25 Gbps/tunnel). A 10 Gbps Direct Connect meets bandwidth/latency; MACsec or
    IPsec-over-DX satisfies encryption; a VPN failover adds resilience; TGW aggregates
    for all VPCs. Multiple VPNs+ECMP can scale bandwidth but not the latency/jitter
    guarantee. PrivateLink exposes a service endpoint, not raw on-prem-to-DB hybrid
    networking at this scale.
  ref: "concepts.md#direct-connect-versus-site-to-site-vpn"

- id: aws-networking-vpc-privatelink-047
  difficulty: advanced
  tags: [tgw, limits, routes]
  question: |
    A large enterprise builds a global hybrid network and finds route propagation
    failing on its Transit Gateway. Which TGW quota is the most likely first ceiling
    hit?
  options:
  - "The 5-VPCs-per-Region default, which caps how many attachments a TGW can advertise"
  - "The 60-security-group-rules limit, which truncates the prefixes a TGW will propagate"
  - "The ~10,000 total routes across all TGW route tables"
  - "The 1024-DNS-packets-per-second limit, which throttles TGW route advertisement"
  answer: 2
  explanation: |
    A TGW supports up to ~10,000 total routes across all its route tables (and 5,000
    attachments). A sprawling hybrid mesh with many advertised prefixes hits the route
    ceiling first; mitigate by summarizing prefixes or advertising default routes. The
    other quotas are unrelated to TGW route propagation.
  ref: "concepts.md#failure-modes-and-how-the-design-degrades"

- id: aws-networking-vpc-privatelink-048
  difficulty: advanced
  tags: [multi-account, landing-zone, blast-radius]
  question: |
    Why does modern AWS multi-account guidance favor a VPC-per-workload-per-account model
    stitched with Transit Gateway over one large shared VPC?
  options:
  - "It is always cheaper in data-transfer costs because per-account VPCs avoid all inter-VPC charges"
  - "It removes the need for CIDR planning since each account gets an isolated address space by default"
  - "It eliminates the need for security groups because account boundaries already enforce all filtering"
  - "It provides strong account-level isolation and independent lifecycles/blast-radius, accepting added routing complexity and TGW cost"
  answer: 3
  explanation: |
    Account-per-workload with per-account VPCs gives hard isolation boundaries (IAM,
    quotas, blast radius) and independent lifecycles; TGW connects them. The trade-off is
    more routing/endpoint complexity and TGW per-attachment/per-GB cost — it is NOT
    cheaper on transfer (a shared VPC avoids inter-VPC charges). It still requires
    careful CIDR planning and security groups.
  ref: "concepts.md#multi-vpc-and-multi-account-network-design"

- id: aws-networking-vpc-privatelink-049
  difficulty: advanced
  tags: [nacl, security-groups, defense-in-depth]
  question: |
    A regulator requires a stateless, subnet-wide deny layer independent of instance-
    level controls in front of a sensitive database subnet. What is the correct control,
    and what is its main downside?
  options:
  - "A NACL as a defense-in-depth deny backstop; downside is stateless ephemeral-port management and whole-subnet blast radius with only ~20 (max 40) rules"
  - "Security groups with explicit deny rules; downside is they are stateful and evaluated per-ENI, not subnet-wide"
  - "A route-table blackhole entry per bad source; downside is it drops traffic across all subnets sharing the table"
  - "PrivateLink with a restrictive endpoint policy; downside is the per-GB data-processing cost it adds"
  answer: 0
  explanation: |
    A NACL provides the stateless, subnet-wide, explicit-deny layer independent of SGs
    that regulators often want as defense-in-depth. Its downsides: statelessness forces
    manual ephemeral-port rules, the blast radius is the whole subnet, and the default
    limit is ~20 rules (max 40 each way). SGs can't deny and are stateful; blackhole
    routes and PrivateLink solve different problems.
  ref: "concepts.md#security-groups-versus-network-acls"

- id: aws-networking-vpc-privatelink-050
  difficulty: advanced
  tags: [endpoint-policy, zero-trust, data-exfiltration]
  question: |
    You want to guarantee that instances in a VPC can only write to your own S3 buckets
    through the gateway endpoint, preventing exfiltration to arbitrary buckets. What
    enforces this?
  options:
  - "A security group allowing only S3 traffic, which distinguishes your own buckets from third-party ones"
  - "A NACL blocking the S3 prefix-list CIDRs for every bucket except the ones you own"
  - "A VPC endpoint policy on the S3 gateway endpoint restricting access to your account's buckets"
  - "Disabling the NAT gateway so no path to any external bucket remains for exfiltration"
  answer: 2
  explanation: |
    A VPC endpoint policy attached to the S3 gateway endpoint can restrict which buckets/
    principals traffic through the endpoint may reach — the anti-exfiltration control.
    Security groups and NACLs filter by IP/port (S3 uses a broad managed prefix list, so
    they can't distinguish your buckets from others). Disabling NAT doesn't stop
    endpoint traffic.
  ref: "concepts.md#network-isolation-and-zero-trust"

- id: aws-networking-vpc-privatelink-051
  difficulty: advanced
  tags: [cloud-wan, multi-region, judgment]
  question: |
    An enterprise runs Transit Gateways in eight Regions, manually peered, and struggles
    with consistent global segmentation policy. What is the AWS-native evolution?
  options:
  - "Collapse everything into a single global VPC that stretches its subnets across all eight Regions"
  - "Full-mesh VPC peering across all Regions so every VPC pair carries the segmentation policy directly"
  - "Replace TGW with NAT gateways in each Region to consolidate the cross-Region routing and policy"
  - "AWS Cloud WAN — a managed global network with policy-as-code segmentation across Regions"
  answer: 3
  explanation: |
    AWS Cloud WAN provides a managed global WAN with a central policy document,
    segmentation, and a Region-spanning core network — the successor to hand-built
    multi-Region TGW peering when you need one global control plane. A single global VPC
    is impossible (VPCs are regional), global full-mesh peering is unmanageable, and NAT
    gateways don't provide interconnect.
  ref: "concepts.md#multi-vpc-and-multi-account-network-design"

- id: aws-networking-vpc-privatelink-052
  difficulty: advanced
  tags: [privatelink, tradeoff, many-services]
  question: |
    A platform team must expose 40 internal microservices for mutual east-west traffic
    among a dozen VPCs. Why is standing up 40 PrivateLink endpoint services usually the
    wrong choice versus Transit Gateway?
  options:
  - "PrivateLink exposes one service one-way each; 40 endpoint services + per-hour/per-GB endpoint costs and NLB fronting is far more overhead than a TGW that routes whole networks"
  - "PrivateLink is not available across accounts, so a dozen separate accounts could never share the 40 endpoint services"
  - "Transit Gateway cannot connect a dozen VPCs at once because it caps attachments well below that number"
  - "PrivateLink requires non-overlapping CIDRs while TGW happily routes fully overlapping address ranges"
  answer: 0
  explanation: |
    PrivateLink is ideal for a one-way provider/consumer relationship for a FEW services,
    but each service needs its own NLB-fronted endpoint service and each consumer an
    endpoint (per-hour + per-GB). For 40 mutually-reachable services across a dozen VPCs,
    a TGW that routes whole networks bidirectionally is far simpler. TGW easily handles a
    dozen VPCs, and it is TGW/peering (not PrivateLink) that needs non-overlapping CIDRs.
  ref: "concepts.md#privatelink-for-exposing-services-privately"

- id: aws-networking-vpc-privatelink-053
  difficulty: advanced
  tags: [cidr, planning, mergers]
  question: |
    Why is careful, organization-wide CIDR planning considered the most consequential
    early VPC decision?
  options:
  - "Because CIDR size determines the number of security groups and NACL rules a VPC is allowed to use"
  - "Because larger CIDRs are always cheaper, billing a lower per-hour rate for the reserved address space"
  - "Because a VPC's primary CIDR cannot be changed and peering/TGW/VPN require non-overlapping ranges, so overlaps permanently block future connectivity"
  - "Because CIDR size sets the DNS resolver throughput, so a bigger block raises the per-ENI query limit"
  answer: 2
  explanation: |
    The primary CIDR is immutable after creation, and peering, TGW, and VPN all require
    non-overlapping address space. If two networks you later need to connect overlap, you
    cannot peer/TGW them (the classic reason a merger can't integrate) — only PrivateLink/
    private-NAT can bridge overlap. CIDR size doesn't affect SG counts, cost, or DNS
    throughput.
  ref: "concepts.md#ip-addressing-and-cidr-planning"

- id: aws-networking-vpc-privatelink-054
  difficulty: advanced
  tags: [gwlb, inspection, third-party]
  question: |
    You must transparently route all VPC traffic through a fleet of third-party firewall
    appliances that scale horizontally, with flow stickiness. Which AWS component is
    designed for this?
  options:
  - "Application Load Balancer with sticky sessions transparently forwarding every packet to the appliances"
  - "A NAT gateway per appliance that transparently steers all VPC traffic through the firewall fleet"
  - "Route 53 weighted records to each appliance so DNS spreads traffic across the firewall fleet with stickiness"
  - "Gateway Load Balancer (GWLB) using the GENEVE protocol, with a GWLB endpoint"
  answer: 3
  explanation: |
    Gateway Load Balancer is purpose-built to insert transparent, horizontally-scaled
    L3 appliances (firewalls/IDS): it uses GENEVE encapsulation, maintains flow
    stickiness to a given appliance, and is consumed via a GWLB endpoint (a PrivateLink-
    style entry). An ALB is L7 app traffic, NAT gateways aren't inspection devices, and
    DNS weighting doesn't provide transparent inline inspection with flow stickiness.
  ref: "concepts.md#multi-vpc-and-multi-account-network-design"

- id: aws-networking-vpc-privatelink-055
  difficulty: advanced
  tags: [vpn, cloudhub, branch]
  question: |
    A company wants to connect many branch offices to AWS and to each other for backup
    connectivity using existing VPN gear. Which pattern fits with the least new
    infrastructure?
  options:
  - "Provision a dedicated Direct Connect circuit from every branch office straight to AWS"
  - "Site-to-Site VPN CloudHub, a hub-and-spoke of VPN connections using BGP"
  - "A PrivateLink interface endpoint created at each branch office to link the sites together"
  - "A separate VPC per branch office, all joined together with full-mesh VPC peering"
  answer: 1
  explanation: |
    VPN CloudHub connects multiple branch VPN connections in a hub-and-spoke using BGP,
    letting branches reach AWS and each other over existing internet/VPN gear — minimal
    new infrastructure. Direct Connect from every branch is costly/slow to provision;
    PrivateLink exposes services, not site connectivity; per-branch VPCs are wasteful and
    irrelevant to on-prem branch links.
  ref: "concepts.md#direct-connect-versus-site-to-site-vpn"

- id: aws-networking-vpc-privatelink-056
  difficulty: advanced
  tags: [tgw, appliance-mode, asymmetric]
  question: |
    After inserting a stateful firewall in an inspection VPC behind a TGW, some
    connections randomly drop even though the firewall rules are correct. Appliance mode
    is NOT enabled. What is happening?
  options:
  - "TGW is load-balancing the two directions of a flow to different AZs/appliances; the return path hits an appliance with no state, so it drops the packets"
  - "The third-party firewall's license quietly expired overnight, so it began dropping a random subset of otherwise-valid connections"
  - "The path MTU is set too large for the inspection VPC, so oversized packets are being silently discarded on a fraction of the flows"
  - "The inspection appliances' security groups are missing an outbound rule, so they block the return direction of certain connections"
  answer: 0
  explanation: |
    Without appliance mode, TGW may send the forward and return directions of a flow
    through different AZs/appliances. A stateful firewall on the return path has no
    connection state and drops the traffic — asymmetric routing. Enabling appliance mode
    pins both directions to the same appliance. This is a routing-symmetry issue, not
    licensing, MTU, or SGs.
  ref: "concepts.md#multi-vpc-and-multi-account-network-design"

- id: aws-networking-vpc-privatelink-057
  difficulty: advanced
  tags: [ipv6, eks, exhaustion]
  question: |
    A massive EKS platform assigns a VPC IP per pod and keeps exhausting IPv4 space even
    with secondary CIDRs. What is the most scalable long-term fix?
  options:
  - "Shrink each subnet down to a /28 block to force denser reuse of the existing IPv4 addresses"
  - "Route all pod traffic through a shared NAT gateway so the pods can share a single source address"
  - "Adopt IPv6 for the cluster (Amazon-provided /56 per VPC, /64 per subnet), removing IPv4 scarcity"
  - "Collapse the cluster down to a single Availability Zone to consolidate the free IP pool"
  answer: 2
  explanation: |
    IPv6 gives an effectively unlimited address space (Amazon-provided /56 per VPC, /64
    per subnet), directly solving IPv4 exhaustion for ENI/pod-dense workloads like EKS
    with the VPC CNI. Shrinking subnets makes exhaustion worse, NAT doesn't create
    addresses, and collapsing AZs harms availability without solving addressing.
  ref: "concepts.md#ip-addressing-and-cidr-planning"

- id: aws-networking-vpc-privatelink-058
  difficulty: advanced
  tags: [cost, cross-region, dr]
  question: |
    A design replicates 200 TB/month between VPCs in two Regions. Which cost factor
    dominates and how is it best minimized?
  options:
  - "Security group rule count dominates the bill; consolidate overlapping rules so far fewer are evaluated per packet"
  - "NAT gateway hourly charges dominate the cost; delete the NAT gateways in both Regions to remove the fixed fee"
  - "The number of route tables dominates spend; merge them into one shared table per Region to cut the overhead"
  - "Cross-Region data transfer dominates; minimize by compressing/deduping data and replicating only deltas rather than full copies"
  answer: 3
  explanation: |
    Cross-Region transfer (~$0.02/GB+) dominates at 200 TB/month; the lever is moving
    less data — compression, deduplication, and delta/incremental replication rather
    than full copies — plus choosing efficient replication mechanisms. SG rules, NAT
    hourly, and route-table counts are negligible next to inter-Region transfer volume.
  ref: "concepts.md#egress-cost-and-data-transfer-trade-offs"

- id: aws-networking-vpc-privatelink-059
  difficulty: advanced
  tags: [privatelink, dns, hybrid]
  question: |
    On-prem clients (over DX) must reach an interface endpoint by its standard AWS
    service name, but private DNS for the endpoint only resolves inside the VPC. What
    completes the solution?
  options:
  - "Use a Route 53 inbound Resolver endpoint (and/or a private hosted zone with forwarding) so on-prem resolves the endpoint's private IP"
  - "Assign a public Elastic IP to the interface endpoint's ENI so on-prem clients can resolve and reach it directly"
  - "Disable the private DNS option on the endpoint so the standard service name resolves for on-prem clients too"
  - "Add a subnet NACL rule that explicitly allows inbound DNS on port 53 from the on-prem resolver address ranges"
  answer: 0
  explanation: |
    Endpoint private DNS resolves only within the VPC. To let on-prem resolve the
    endpoint's private IP over DX, you forward DNS via a Route 53 inbound Resolver
    endpoint (and/or private hosted zone with conditional forwarding from on-prem).
    Endpoints don't take public IPs, disabling private DNS defeats the purpose, and a
    NACL doesn't perform name resolution.
  ref: "concepts.md#dns-with-route-53-resolver-in-the-vpc"

- id: aws-networking-vpc-privatelink-060
  difficulty: advanced
  tags: [blast-radius, shared-vpc, judgment]
  question: |
    A team proposes putting all 15 workloads into one large shared VPC to avoid inter-VPC
    data-transfer charges. From a reliability/security standpoint, what is the key
    counterargument?
  options:
  - "Shared VPCs are not a supported AWS construct at all, so the 15 workloads simply could not be launched into one VPC"
  - "You cannot attach security groups to instances in a shared VPC, leaving all 15 workloads without any packet filtering"
  - "A single VPC concentrates blast radius — one misconfiguration, route change, or address exhaustion event can affect all 15 workloads at once"
  - "Data-transfer charges are actually higher inside a shared VPC, since same-VPC traffic is billed at a premium rate"
  answer: 2
  explanation: |
    Cost efficiency (no inter-VPC charges) is real, but the counterargument is blast
    radius: a shared VPC means one route/NACL misconfiguration, address exhaustion, or
    security-group mistake can impact every workload, and there's a single change-control
    surface. Shared VPCs ARE supported (via RAM) and do use security groups; same-VPC
    traffic is cheaper, not more expensive.
  ref: "concepts.md#network-isolation-and-zero-trust"

- id: aws-networking-vpc-privatelink-061
  difficulty: expert
  tags: [tgw, per-flow, bandwidth, estimation]
  question: |
    A data platform must sustain 40 Gbps for a single large replication stream between
    two VPCs. Given TGW's characteristics, which statement is correct?
  options:
  - "TGW will carry the single 40 Gbps flow fine, since each attachment supports up to 100 Gbps of aggregate throughput per AZ"
  - "You must terminate several Site-to-Site VPNs on the TGW and use ECMP to load-share the one stream up to 40 Gbps"
  - "Only a Direct Connect circuit can carry 40 Gbps between the two VPCs, since VPC-to-VPC paths cannot reach that rate"
  - "A single flow through TGW is capped (~5 Gbps), so either parallelize into multiple flows or use direct VPC peering (no per-flow cap) for this stream"
  answer: 3
  explanation: |
    Although a TGW VPC attachment supports up to ~100 Gbps aggregate per AZ, a single
    flow (5-tuple) is limited to ~5 Gbps. A 40 Gbps single stream won't fit through one
    flow; you either split it into multiple parallel flows/connections to exploit the
    aggregate, or use a direct VPC peering, which has no per-flow cap and uses the
    backbone. VPN is far slower, and DX is for on-prem, not VPC-to-VPC.
  ref: "concepts.md#failure-modes-and-how-the-design-degrades"

- id: aws-networking-vpc-privatelink-062
  difficulty: expert
  tags: [sg-limits, scale, quotas]
  question: |
    An architect wants 100 inbound rules on a single security group attached to an ENI
    that also has 5 security groups. Why might this fail, and what is the governing rule?
  options:
  - "A single security group can never hold more than 10 rules in total across both directions, so 100 inbound rules is rejected outright regardless of how many SGs the ENI carries"
  - "The product of (rules per SG) and (SGs per ENI) cannot exceed 1000; 100 rules x 5 SGs = 500 is fine, but raising rules to 60-default requires quota awareness — the real constraint is that product limit"
  - "An elastic network interface can only ever have a single security group attached to it, so the architect cannot spread the 100 rules across the five groups as originally planned"
  - "Inbound and outbound rules are drawn from one shared pool of 60 rules per security group, so 100 inbound rules alone would already exceed the combined per-group ceiling"
  answer: 1
  explanation: |
    The default is 60 rules per SG per direction and 5 SGs per ENI, but the hard
    constraint is that (rules-per-SG) x (SGs-per-ENI) cannot exceed 1000. So you can
    raise one only by trading against the other. Inbound and outbound are counted
    separately (D wrong), ENIs support up to 5 (→16) SGs (C wrong), and the 10-rule
    claim (A) is invented.
  ref: "concepts.md#security-groups-versus-network-acls"

- id: aws-networking-vpc-privatelink-063
  difficulty: expert
  tags: [privatelink, cross-region, judgment]
  question: |
    A provider's PrivateLink endpoint service lives in us-east-1; a consumer VPC is in
    eu-west-1. Since PrivateLink added cross-Region connectivity (Nov 2024), what is the
    most accurate statement about consuming it?
  options:
  - "If the provider enables cross-Region access on the endpoint service, the consumer can create an interface endpoint in eu-west-1 that connects to the us-east-1 service over the AWS backbone; otherwise it stays regional and must be reached via inter-Region TGW/peering or a local service"
  - "Cross-Region PrivateLink means any existing interface endpoint automatically reaches the service in any Region over the AWS backbone, with no configuration or opt-in required from the provider at all"
  - "The consumer must fall back to inter-Region VPC peering instead, because PrivateLink endpoint services remain strictly single-Region and can never be reached from a consumer in another Region"
  - "PrivateLink automatically replicates the provider's endpoint service into every Region, so a local copy is always available for consumers to connect to without any cross-Region traffic"
  answer: 0
  explanation: |
    Since November 2024, PrivateLink supports cross-Region connectivity: a provider can
    enable cross-Region access on its endpoint service and a consumer in another Region
    creates an interface endpoint that reaches it privately over the AWS backbone. It is
    opt-in per service (not automatic for every endpoint), the service is not replicated
    to all Regions, and peering is not required. Before this feature the service was
    strictly regional and needed inter-Region TGW/peering to bridge.
  ref: "concepts.md#privatelink-for-exposing-services-privately"

- id: aws-networking-vpc-privatelink-064
  difficulty: expert
  tags: [mtu, jumbo, tgw, vpn]
  question: |
    A workload relies on jumbo frames (8500-byte MTU) between VPCs over Transit Gateway,
    but the same traffic pattern over a Site-to-Site VPN attachment drops or fragments.
    Why?
  options:
  - "VPN attachments support only a 1500-byte MTU, while TGW supports 8500 bytes between VPC/DX/peering attachments"
  - "Transit Gateway disables jumbo frames entirely and forces every attachment down to a 1500-byte MTU"
  - "The security groups on the path strip the jumbo-frame MTU option, forcing the oversized packets to fragment"
  - "Jumbo frames are unsupported anywhere within AWS networking, so any 8500-byte packet is always fragmented"
  answer: 0
  explanation: |
    TGW supports an 8500-byte MTU for VPC, Direct Connect, Connect, and peering
    attachments, but traffic over Site-to-Site VPN is limited to 1500 bytes. So jumbo
    frames that traverse the VPN attachment must fragment or drop. TGW does support jumbo
    on non-VPN paths, SGs don't touch MTU, and jumbo frames are supported within VPCs.
  ref: "concepts.md#direct-connect-versus-site-to-site-vpn"

- id: aws-networking-vpc-privatelink-065
  difficulty: expert
  tags: [private-nat, overlap, routing]
  question: |
    Two VPCs with overlapping 10.0.0.0/16 CIDRs must exchange bidirectional TCP traffic
    for several services (not just one), ruling out re-IP'ing in the short term. Which
    technique enables routed connectivity despite the overlap?
  options:
  - "Standard VPC peering between the two VPCs; overlapping CIDRs are allowed as long as you add specific longest-prefix routes"
  - "Assign public Elastic IPs to all instances in both VPCs so they communicate over the internet and sidestep the private overlap"
  - "A private NAT gateway to translate one VPC's addresses into a distinct non-overlapping range so TGW/peering can route between the translated ranges"
  - "Increase the per-route-table entry limit on both VPCs so the overlapping 10.0.0.0/16 routes can coexist in one table"
  answer: 2
  explanation: |
    Overlapping CIDRs cannot be peered or TGW-routed directly. A private NAT gateway can
    translate one side's addresses into a separate non-overlapping range, and that
    translated range is then routed over TGW/peering — enabling multi-service
    bidirectional traffic despite the overlap (more general than PrivateLink's single
    one-way service). Peering never allows overlap, public IPs defeat the private
    requirement, and route limits are irrelevant.
  ref: "concepts.md#ip-addressing-and-cidr-planning"

- id: aws-networking-vpc-privatelink-066
  difficulty: expert
  tags: [endpoint-cost, estimation, tradeoff]
  question: |
    An architecture needs interface endpoints for 8 services, each deployed across 3 AZs
    for HA, in 20 VPCs. What cost dynamic should the design account for?
  options:
  - "Interface endpoints are free of hourly charges just like gateway endpoints, so deploying all 480 of them adds no ongoing baseline cost at all"
  - "Interface endpoints are billed only during idle periods when no traffic flows, so a busy fleet of 480 endpoints is effectively free of hourly cost"
  - "The number of AZs an endpoint spans has no bearing on its cost, so spreading all 8 services across 3 AZs adds nothing to the monthly bill"
  - "8 services x 3 AZs x 20 VPCs = 480 endpoint-ENIs each billed ~$0.01/AZ/hr plus per-GB — a large hourly baseline that argues for centralizing endpoints in a shared VPC accessed over TGW"
  answer: 3
  explanation: |
    Interface endpoints cost ~$0.01 per AZ per hour plus ~$0.01/GB. With 8 services x 3
    AZs x 20 VPCs you'd run 480 endpoint-ENIs, a significant always-on hourly baseline —
    which is exactly why teams centralize interface endpoints in a shared-services VPC
    reached over TGW and share them, trading TGW per-GB for far fewer endpoints. Interface
    endpoints are NOT free (gateway ones are), AZ count directly scales cost, and billing
    is not "only when idle."
  ref: "concepts.md#egress-cost-and-data-transfer-trade-offs"

- id: aws-networking-vpc-privatelink-067
  difficulty: expert
  tags: [dx, resilience, sla]
  question: |
    To meet the highest Direct Connect resilience posture ("maximum resilience"), how
    should circuits be arranged?
  options:
  - "Two separate connections terminating on the same device within a single DX location, giving link-level redundancy"
  - "Separate connections terminating at separate devices in more than one DX location (independent paths), so no single device or location is a SPOF"
  - "A single high-capacity 100 Gbps Direct Connect circuit, since its bandwidth headroom absorbs any single failure"
  - "One Direct Connect circuit hardened with MACsec encryption, which provides the required maximum-resilience posture"
  answer: 1
  explanation: |
    Maximum resilience requires independent connections at separate devices across
    multiple DX locations, eliminating single device and single location failure points
    (AWS's resilience models are built around this). Two connections to one device/
    location share fate; a single circuit is a SPOF regardless of speed; MACsec is
    encryption, not redundancy.
  ref: "concepts.md#direct-connect-versus-site-to-site-vpn"

- id: aws-networking-vpc-privatelink-068
  difficulty: expert
  tags: [tgw, ecmp, connect, bandwidth]
  question: |
    Using Transit Gateway Connect (GRE) to integrate SD-WAN virtual appliances, what
    bandwidth characteristics should you design around?
  options:
  - "Each Connect peer (GRE tunnel) is capped at ~5 Gbps; you can create up to 4 per Connect attachment (~20 Gbps) and use ECMP across peers/attachments to scale"
  - "Connect peers have effectively unlimited bandwidth per GRE tunnel, so a single peer can carry as much as the underlying transport allows"
  - "Connect attachments require static routing only and do not support BGP, so each GRE peer's routes must be entered by hand"
  - "Connect attachments are hard-limited to 1 Gbps of aggregate throughput regardless of how many GRE peers you configure on them"
  answer: 0
  explanation: |
    Each TGW Connect peer (GRE tunnel) supports up to ~5 Gbps, up to 4 peers per Connect
    attachment (~20 Gbps aggregate), and you scale horizontally with ECMP across peers/
    attachments — provided the underlying transport (VPC/DX) supports the bandwidth.
    Bandwidth is not unlimited, Connect uses dynamic BGP (not static-only), and it's not
    capped at 1 Gbps.
  ref: "concepts.md#vpc-peering-versus-transit-gateway"

- id: aws-networking-vpc-privatelink-069
  difficulty: expert
  tags: [zero-trust, sg-referencing, identity]
  question: |
    Within a single VPC, how do you implement "nothing is trusted by IP alone" for
    service-to-service calls in a zero-trust posture?
  options:
  - "Open all internal ports between services and treat the VPC boundary itself as the trust perimeter, since nothing outside can reach in"
  - "Move every microservice into its own dedicated subnet and let the subnet boundaries alone establish which services may talk to which others"
  - "Combine SG-referencing-SG (identity-like grouping), IAM-authenticated/mTLS service calls, and endpoint policies so every hop is authorized by identity, not just network location"
  - "Use a single wide-open NACL across the whole VPC and let stateful security groups be the only layer authorizing internal service calls"
  answer: 2
  explanation: |
    Zero-trust inside a VPC layers SG-referencing-SG (so rules follow group membership,
    not fixed IPs) with IAM/mTLS authentication on the calls and endpoint policies for
    service access — every hop is authorized by identity, not merely by being on the
    network. Trusting the VPC boundary, per-service subnets alone, or an open NACL all
    re-introduce implicit network trust.
  ref: "concepts.md#network-isolation-and-zero-trust"

- id: aws-networking-vpc-privatelink-070
  difficulty: expert
  tags: [failure-modes, region, dr, dns]
  question: |
    A single-Region VPC-based architecture must add Regional resilience. Which
    combination correctly addresses that a VPC cannot span Regions?
  options:
  - "Extend the existing VPC's subnets into the second Region so the same VPC spans both Regions and shares one address space"
  - "Add several more Availability Zones to the existing single-Region VPC so the extra zones provide the required cross-Region resilience"
  - "Rely on the Internet Gateway's built-in regional redundancy, since the IGW already spans Regions and fails traffic over automatically"
  - "Deploy a separate VPC in the second Region, connect them via inter-Region TGW peering (or Cloud WAN), and use Route 53 health checks/failover for DNS-level regional failover"
  answer: 3
  explanation: |
    VPCs are regional and cannot be stretched across Regions, so regional resilience
    needs a separate VPC in the second Region, inter-Region connectivity (TGW peering or
    Cloud WAN) for data/control paths, and Route 53 health-check-based failover to shift
    traffic. Extending subnets across Regions is impossible; adding AZs or relying on IGW
    redundancy only covers intra-Region faults, not a Region loss.
  ref: "concepts.md#failure-modes-and-how-the-design-degrades"
