topic: "DDD Strategic Design & Context Mapping"
domain: system-design
topic_slug: ddd-strategic-context-mapping
version: 1
questions:
  - id: ddd-strategic-context-mapping-001
    difficulty: beginner
    tags: [strategic-design, tactical-design]
    question: |
      In Domain-Driven Design, which activity is part of STRATEGIC design
      rather than tactical design?
    options:
      - "Deciding where bounded-context boundaries go and how they integrate"
      - "Defining an aggregate root to protect an entity's invariants"
      - "Choosing between a value object and an entity for a Money type"
      - "Writing a repository to persist a domain object"
    answer: 0
    explanation: |
      Strategic design operates at system/organization scale: bounded contexts,
      subdomains, and the context map. Aggregates, value objects, and
      repositories are tactical patterns used inside a single context.
    ref: "concepts.md#strategic-vs-tactical-design"

  - id: ddd-strategic-context-mapping-002
    difficulty: beginner
    tags: [bounded-context, definition]
    question: |
      What best defines a bounded context?
    options:
      - "A physical deployment unit such as a container or VM"
      - "A database schema shared by every service in the system"
      - "A boundary within which one domain model and its ubiquitous language are internally consistent"
      - "The set of all entities that share a primary key"
    answer: 2
    explanation: |
      A bounded context is a linguistic and model boundary: inside it, every
      term of the ubiquitous language has exactly one meaning and the model is
      internally consistent. It is a semantic boundary, not a deployment or
      storage construct.
    ref: "concepts.md#bounded-context-and-ubiquitous-language"

  - id: ddd-strategic-context-mapping-003
    difficulty: beginner
    tags: [ubiquitous-language]
    question: |
      Ubiquitous language in DDD is best described as language that is...
    options:
      - "Universal across the entire enterprise and all its systems"
      - "Defined once by architects and frozen for the life of the system"
      - "Shared by domain experts and code, but only guaranteed within one bounded context"
      - "Used only in documentation, never in code or database columns"
    answer: 2
    explanation: |
      Ubiquitous language is context-local: the same shared vocabulary is used
      by experts, code, columns, and APIs, but only inside its bounded context.
      Cross a boundary and a term may mean something else or not exist.
    ref: "concepts.md#bounded-context-and-ubiquitous-language"

  - id: ddd-strategic-context-mapping-004
    difficulty: intermediate
    tags: [same-term, god-object]
    question: |
      Sales, Billing, and Support each need a "Customer" with different
      attributes and invariants. Why does DDD advise against one shared
      canonical Customer model?
    options:
      - "Relational databases cannot store the same entity in multiple schemas"
      - "Object-oriented languages cap classes at a fixed number of fields"
      - "A shared model would violate the single-responsibility principle at compile time"
      - "The contexts have contradictory meanings and invariants, so one model becomes a bloated god-object serving none well"
    answer: 3
    explanation: |
      Each context carries different attributes and conflicting invariants.
      Forcing one model yields a god-object full of context-irrelevant nulls
      that satisfies no context's invariants cleanly. The problem is semantic,
      not a technical limit of databases or languages.
    ref: "concepts.md#why-the-same-term-means-different-things-across-contexts"

  - id: ddd-strategic-context-mapping-005
    difficulty: intermediate
    tags: [same-term, product-example]
    question: |
      "Product" means SKU + warehouse bin + reorder threshold in one context and
      description + images + SEO keywords in another. What does this illustrate?
    options:
      - "That the same term legitimately maps to different models in different contexts"
      - "That the two teams failed to communicate and should merge their models"
      - "That one of the two definitions must be wrong and discarded"
      - "That an Enterprise Data Model is needed to reconcile them"
    answer: 0
    explanation: |
      This is the core motivation for bounded contexts: the same word maps to
      genuinely different models with different attributes. There is no single
      "true" Product; each context owns its own and translates at the seams.
    ref: "concepts.md#why-the-same-term-means-different-things-across-contexts"

  - id: ddd-strategic-context-mapping-006
    difficulty: beginner
    tags: [subdomains, core]
    question: |
      Which subdomain type represents a business's key differentiator and
      deserves the most engineering investment?
    options:
      - "Generic subdomain"
      - "Supporting subdomain"
      - "Core domain"
      - "Shared subdomain"
    answer: 2
    explanation: |
      The core domain is the competitive differentiator and the reason the
      software exists; you invest your best engineers there. Supporting is
      necessary but not a differentiator; generic is a solved commodity.
    ref: "concepts.md#subdomains-core-supporting-and-generic"

  - id: ddd-strategic-context-mapping-007
    difficulty: intermediate
    tags: [subdomains, generic]
    question: |
      For a furniture retailer, sending transactional email and calculating
      sales tax are best treated as which kind of subdomain?
    options:
      - "Core domain — build a bespoke solution with the best engineers"
      - "Supporting subdomain that must be a shared kernel"
      - "Generic subdomain — buy/adopt an off-the-shelf solution"
      - "Partnership subdomain co-owned with a vendor"
    answer: 2
    explanation: |
      Email delivery and tax calculation are solved commodity problems (generic
      subdomains) for a furniture retailer. The strategy is to buy/adopt
      (e.g. SES, a tax API) rather than build, freeing talent for the core.
    ref: "concepts.md#subdomains-core-supporting-and-generic"

  - id: ddd-strategic-context-mapping-008
    difficulty: intermediate
    tags: [subdomains, relativity]
    question: |
      A payment gateway is the core domain for Stripe but a generic subdomain
      for a furniture retailer. What principle does this show?
    options:
      - "Core is determined by technical complexity, not the business"
      - "Payments are always a generic subdomain everywhere"
      - "Any subdomain can be reclassified freely with no consequences"
      - "Whether something is core is relative to the specific business, not to how hard it is"
    answer: 3
    explanation: |
      "Core" is relative to the business's competitive advantage, not to
      technical difficulty. The hardest thing to build is not automatically your
      core domain — misjudging this is a costly strategic error.
    ref: "concepts.md#subdomains-core-supporting-and-generic"

  - id: ddd-strategic-context-mapping-009
    difficulty: intermediate
    tags: [distillation, core-domain]
    question: |
      What is the primary economic argument for strategic distillation
      (separating the core domain from the rest)?
    options:
      - "Engineering capacity is finite, so you should invest disproportionately in the core and minimize spend elsewhere"
      - "It reduces the number of database tables the system needs"
      - "It guarantees the system will need fewer microservices"
      - "It makes every subdomain equally important to simplify planning"
    answer: 0
    explanation: |
      Distillation exists so scarce engineering talent concentrates on the
      differentiator. You can only invest wisely once the core is distinguished
      from supporting and generic noise.
    ref: "concepts.md#strategic-distillation-and-the-core-domain"

  - id: ddd-strategic-context-mapping-010
    difficulty: advanced
    tags: [distillation, tools]
    question: |
      Which of these is a distillation tool Eric Evans describes for keeping the
      team focused on the core domain?
    options:
      - "Two-phase commit across contexts"
      - "A Domain Vision Statement plus a Highlighted Core"
      - "A single Enterprise Data Model"
      - "Mandatory Shared Kernels between all contexts"
    answer: 1
    explanation: |
      Evans's distillation tools include the Domain Vision Statement, Highlighted
      Core, Generic Subdomains, Cohesive Mechanisms, and Segregated Core — all
      aimed at making the core visible and protected. The others are not
      distillation techniques.
    ref: "concepts.md#strategic-distillation-and-the-core-domain"

  - id: ddd-strategic-context-mapping-011
    difficulty: beginner
    tags: [context-map, definition]
    question: |
      What is a context map?
    options:
      - "A network topology diagram of servers and load balancers"
      - "A UML class diagram of a single aggregate"
      - "An explicit model of the relationships and integrations between bounded contexts"
      - "A list of database foreign keys across schemas"
    answer: 2
    explanation: |
      A context map describes how bounded contexts relate and integrate — both
      the technical integration patterns and the organizational/political
      reality — from a global, honest viewpoint.
    ref: "concepts.md#the-context-map"

  - id: ddd-strategic-context-mapping-012
    difficulty: intermediate
    tags: [context-map, honesty]
    question: |
      A good context map is drawn from a "global, honest viewpoint." What does
      that mean in practice?
    options:
      - "It shows only the idealized future-state architecture"
      - "It hides organizational politics to keep the diagram clean"
      - "It includes only the contexts owned by your own team"
      - "It depicts the messy reality including legacy Big Balls of Mud and uncooperative teams"
    answer: 3
    explanation: |
      The map's value is honesty: it shows the actual relationships, including
      legacy tangles and teams you cannot influence, because those realities
      dictate which integration patterns are even possible.
    ref: "concepts.md#the-context-map"

  - id: ddd-strategic-context-mapping-013
    difficulty: beginner
    tags: [upstream-downstream]
    question: |
      In an upstream/downstream context relationship, what characterizes the
      upstream context?
    options:
      - "Its decisions and changes flow downhill and affect the downstream, not vice versa"
      - "It depends on the downstream's model and release schedule"
      - "It is always the newer of the two systems"
      - "It always builds an Anti-Corruption Layer to protect itself"
    answer: 0
    explanation: |
      Upstream is about influence, like a river: upstream changes (schema,
      cadence, availability) affect downstream consumers, but the downstream's
      changes do not affect the upstream.
    ref: "concepts.md#upstream-and-downstream-relationships"

  - id: ddd-strategic-context-mapping-014
    difficulty: intermediate
    tags: [upstream-downstream, options]
    question: |
      You are downstream of a team that refuses to accommodate your needs. Which
      set of options realistically remains open to you?
    options:
      - "Partnership, Shared Kernel, or Open Host Service"
      - "Customer/Supplier or Partnership only"
      - "Published Language or Shared Kernel only"
      - "Conformist, Anti-Corruption Layer, or Separate Ways"
    answer: 3
    explanation: |
      Without influence over the upstream, your choices collapse to conforming
      to their model, building an ACL to translate it, or not integrating at all
      (Separate Ways). Partnership and Customer/Supplier require upstream
      cooperation.
    ref: "concepts.md#upstream-and-downstream-relationships"

  - id: ddd-strategic-context-mapping-015
    difficulty: beginner
    tags: [partnership]
    question: |
      The Partnership pattern between two contexts is characterized by...
    options:
      - "A strict upstream/downstream power imbalance"
      - "One team silently conforming to the other's model"
      - "Mutual success or failure, so the two teams coordinate closely and plan together"
      - "Complete lack of communication between teams"
    answer: 2
    explanation: |
      Partnership means the two teams' fates are linked — they succeed or fail
      together — so they jointly plan interfaces and synchronize releases. There
      is no upstream/downstream imbalance.
    ref: "concepts.md#partnership"

  - id: ddd-strategic-context-mapping-016
    difficulty: intermediate
    tags: [partnership, cost]
    question: |
      What is the main drawback of a Partnership relationship?
    options:
      - "It requires heavy, continuous coordination and does not scale to many partners"
      - "It forbids any shared code between the teams"
      - "It eliminates the need for any interface contract"
      - "It always leads to a Big Ball of Mud"
    answer: 0
    explanation: |
      Partnership demands synchronized planning and jointly-negotiated interface
      changes — expensive coordination that doesn't scale across many partners
      and often decays over time into looser relationships.
    ref: "concepts.md#partnership"

  - id: ddd-strategic-context-mapping-017
    difficulty: beginner
    tags: [shared-kernel]
    question: |
      A Shared Kernel is...
    options:
      - "An explicitly-agreed subset of the model (often shared code) co-owned by two contexts"
      - "A copy of the upstream model translated at the boundary"
      - "A public API offered to many downstream consumers"
      - "A decision not to integrate two contexts"
    answer: 0
    explanation: |
      A Shared Kernel is a small, explicitly-agreed shared portion of the model
      and often shared code, co-owned by both teams, where changes require mutual
      agreement.
    ref: "concepts.md#shared-kernel"

  - id: ddd-strategic-context-mapping-018
    difficulty: intermediate
    tags: [shared-kernel, coupling]
    question: |
      What is the principal danger of a Shared Kernel?
    options:
      - "It duplicates every model in both contexts"
      - "It prevents the two teams from ever communicating"
      - "It makes both contexts stateless"
      - "It creates tight coupling: changes need cross-team consensus and can break the other team"
    answer: 3
    explanation: |
      Sharing model/code couples the two contexts at that boundary. Every change
      requires consensus and continuous cross-team testing, and a careless edit
      breaks the other side — undermining the autonomy contexts should provide.
    ref: "concepts.md#shared-kernel"

  - id: ddd-strategic-context-mapping-019
    difficulty: advanced
    tags: [shared-kernel, anti-pattern]
    question: |
      A team creates a large "common" library every service depends on and calls
      it a Shared Kernel. Why is this a smell?
    options:
      - "Shared Kernels are forbidden in DDD entirely"
      - "Libraries cannot be versioned, so sharing them is impossible"
      - "A growing shared kernel reintroduces the coupling microservices were meant to remove; the kernel should stay minimal"
      - "It forces every context into a Conformist relationship"
    answer: 2
    explanation: |
      Shared Kernels must be kept deliberately small. A sprawling shared library
      recreates system-wide coupling; when in doubt, prefer duplication plus
      translation (ACL) over an ever-growing kernel.
    ref: "concepts.md#shared-kernel"

  - id: ddd-strategic-context-mapping-020
    difficulty: intermediate
    tags: [customer-supplier]
    question: |
      What distinguishes a Customer/Supplier relationship from a pure Conformist
      one?
    options:
      - "In Customer/Supplier there is no upstream or downstream"
      - "In Customer/Supplier the downstream (customer) has a voice and its needs enter the upstream's planning"
      - "Customer/Supplier requires a Shared Kernel"
      - "Customer/Supplier means the two contexts never integrate"
    answer: 1
    explanation: |
      Both are upstream/downstream, but Customer/Supplier gives the downstream
      real influence: the supplier commits to considering customer needs, often
      with negotiated priorities and shared acceptance tests. Conformist gives
      the downstream no such voice.
    ref: "concepts.md#customersupplier"

  - id: ddd-strategic-context-mapping-021
    difficulty: advanced
    tags: [customer-supplier, contracts]
    question: |
      Which practice most helps a Customer/Supplier relationship stay healthy?
    options:
      - "Jointly-owned automated acceptance/contract tests so the supplier doesn't unknowingly break the customer"
      - "The supplier hiding its roadmap from the customer"
      - "The customer copying the supplier's model with no translation"
      - "Removing all interface contracts to move faster"
    answer: 0
    explanation: |
      Shared acceptance/contract tests catch breaking changes before release, and
      putting downstream needs on the upstream backlog keeps the supplier
      accountable — the enablers of a healthy Customer/Supplier relationship.
    ref: "concepts.md#customersupplier"

  - id: ddd-strategic-context-mapping-022
    difficulty: beginner
    tags: [conformist]
    question: |
      A Conformist downstream context...
    options:
      - "Builds a translation layer to protect its own model"
      - "Negotiates its requirements into the upstream's backlog"
      - "Publishes a shared language for all consumers"
      - "Adopts the upstream's model wholesale with no translation layer"
    answer: 3
    explanation: |
      A Conformist simply conforms to the upstream model as-is, with no mapping.
      It is the cheapest integration but the downstream inherits the upstream's
      language and every change.
    ref: "concepts.md#conformist"

  - id: ddd-strategic-context-mapping-023
    difficulty: intermediate
    tags: [conformist, tradeoff]
    question: |
      What is the main cost a downstream team accepts by choosing Conformist?
    options:
      - "It must maintain extensive mapping/translation code"
      - "It can no longer call the upstream at all"
      - "It inherits the upstream's model and vocabulary and absorbs all upstream churn, losing modelling autonomy"
      - "It must co-own the upstream's codebase"
    answer: 2
    explanation: |
      Conformist trades model autonomy for zero mapping cost: your ubiquitous
      language gets polluted by the upstream's and any upstream change ripples
      straight into you.
    ref: "concepts.md#conformist"

  - id: ddd-strategic-context-mapping-024
    difficulty: intermediate
    tags: [conformist, when-acceptable]
    question: |
      When is a Conformist relationship most defensible?
    options:
      - "When the upstream model is messy legacy that would corrupt yours"
      - "When the upstream model is good enough / a stable industry standard and translation isn't worth the cost"
      - "Whenever you are the upstream context"
      - "Only when you have unlimited engineering budget"
    answer: 1
    explanation: |
      Conformist is reasonable when the upstream model is acceptable for your
      needs or is a stable standard, so paying for a translation layer would add
      cost without enough benefit.
    ref: "concepts.md#conformist"

  - id: ddd-strategic-context-mapping-025
    difficulty: beginner
    tags: [acl, definition]
    question: |
      An Anti-Corruption Layer (ACL) is built primarily to...
    options:
      - "Translate an upstream/external model at the boundary so it doesn't corrupt your own model"
      - "Expose a single stable API to many downstream consumers"
      - "Share a common model subset between two teams"
      - "Avoid integrating two contexts entirely"
    answer: 0
    explanation: |
      An ACL is a translation layer a downstream builds to protect its model:
      all communication with the foreign/legacy upstream passes through it and is
      mapped into the downstream's own language.
    ref: "concepts.md#anti-corruption-layer-acl"

  - id: ddd-strategic-context-mapping-026
    difficulty: intermediate
    tags: [acl, structure]
    question: |
      Which building blocks typically implement an Anti-Corruption Layer?
    options:
      - "Load balancers, caches, and CDNs"
      - "Aggregates, entities, and value objects"
      - "Pipelines, queues, and topics"
      - "Façades, adapters, and translators"
    answer: 3
    explanation: |
      An ACL is commonly built from a façade (simplify the upstream API), an
      adapter (conform it to the interface your side expects), and translators
      (convert between the two models' data).
    ref: "concepts.md#anti-corruption-layer-acl"

  - id: ddd-strategic-context-mapping-027
    difficulty: intermediate
    tags: [acl, conformist, contrast]
    question: |
      How does an Anti-Corruption Layer fundamentally differ from a Conformist
      relationship?
    options:
      - "An ACL accepts the upstream model as-is; Conformist rejects it"
      - "Both are identical; the terms are interchangeable"
      - "An ACL rejects/translates the upstream model at the boundary; Conformist accepts it wholesale"
      - "An ACL only applies between teams in a Partnership"
    answer: 2
    explanation: |
      Conformist accepts the upstream model and its coupling; an ACL pays to
      translate the upstream model at the boundary so it never leaks into your
      clean model. The choice is a cost/benefit call on model purity.
    ref: "concepts.md#anti-corruption-layer-acl"

  - id: ddd-strategic-context-mapping-028
    difficulty: advanced
    tags: [acl, legacy, strangler-fig]
    question: |
      During a Strangler Fig migration, why is an ACL especially valuable?
    options:
      - "It lets the new context speak its own language while shielding it from the old system's model"
      - "It removes the need to run the legacy system at all"
      - "It forces the legacy system to adopt the new model immediately"
      - "It guarantees zero-downtime cutover without any routing changes"
    answer: 0
    explanation: |
      The Strangler Fig incrementally replaces a legacy system. The new context
      keeps a clean model while the ACL translates the old system's model at the
      boundary, so legacy concepts don't corrupt the new work during migration.
    ref: "concepts.md#anti-corruption-layer-acl"

  - id: ddd-strategic-context-mapping-029
    difficulty: beginner
    tags: [ohs, definition]
    question: |
      An Open Host Service (OHS) is a pattern applied to which side of an
      integration?
    options:
      - "The upstream, to serve many downstream consumers via a stable published protocol"
      - "The downstream, to protect its model"
      - "A pair of equal partners with linked fates"
      - "Two teams co-owning a shared model subset"
    answer: 0
    explanation: |
      OHS is the upstream's concern: instead of a bespoke integration per
      consumer, the upstream publishes one well-defined, stable protocol/API open
      to all downstreams. It is the inverse of an ACL (which protects downstream).
    ref: "concepts.md#open-host-service-ohs"

  - id: ddd-strategic-context-mapping-030
    difficulty: intermediate
    tags: [ohs, when]
    question: |
      Evans's rule of thumb: when should an upstream formalize its integration
      into an Open Host Service?
    options:
      - "Immediately, even with a single consumer"
      - "Never — bespoke integrations always scale better"
      - "Only when the downstreams agree to a Shared Kernel"
      - "When the number of downstream consumers grows, so maintaining one protocol beats N ad-hoc translations"
    answer: 3
    explanation: |
      With few consumers, per-consumer translation is fine; as consumers grow,
      formalize an OHS so you maintain one documented, versioned protocol instead
      of many one-off integrations.
    ref: "concepts.md#open-host-service-ohs"

  - id: ddd-strategic-context-mapping-031
    difficulty: beginner
    tags: [published-language]
    question: |
      A Published Language is best described as...
    options:
      - "A programming language mandated for all services"
      - "The internal domain model of the upstream exposed directly"
      - "A well-documented, shared schema/vocabulary used to translate between contexts"
      - "A private mapping used only inside one context"
    answer: 2
    explanation: |
      A Published Language is a documented, agreed interchange format/vocabulary
      (often an industry standard or versioned schema) that both sides map
      to/from, decoupling internal models from the shared contract.
    ref: "concepts.md#published-language"

  - id: ddd-strategic-context-mapping-032
    difficulty: intermediate
    tags: [published-language, examples]
    question: |
      Which is a real-world example of a Published Language?
    options:
      - "A private in-memory cache key format used by one service"
      - "HL7/FHIR in healthcare or ISO 20022 in payments"
      - "A team's internal Git branch naming convention"
      - "A load balancer health-check endpoint"
    answer: 1
    explanation: |
      Industry standards like HL7/FHIR and ISO 20022 (and internal versioned
      Protobuf/Avro/OpenAPI schemas) are Published Languages: documented shared
      formats all parties translate to/from.
    ref: "concepts.md#published-language"

  - id: ddd-strategic-context-mapping-033
    difficulty: advanced
    tags: [ohs, published-language, contrast]
    question: |
      What is the relationship between an Open Host Service and a Published
      Language?
    options:
      - "OHS is the access mechanism (protocol/endpoint); Published Language is the shared vocabulary/schema it speaks"
      - "They are the same thing under two names"
      - "Published Language is the endpoint; OHS is the schema"
      - "OHS forbids using a Published Language"
    answer: 0
    explanation: |
      The OHS is how consumers access the service (the protocol/API); the
      Published Language is the documented schema/vocabulary expressed through it.
      An OHS should expose a Published Language rather than leak its internal
      model.
    ref: "concepts.md#published-language"

  - id: ddd-strategic-context-mapping-034
    difficulty: intermediate
    tags: [published-language, versioning]
    question: |
      Why should an upstream publish a deliberately-designed language rather than
      expose its internal domain model directly as the integration contract?
    options:
      - "Internal models are always slower to serialize"
      - "Consumers legally cannot read internal models"
      - "It is impossible to serialize a domain model"
      - "Exposing the internal model turns every internal refactor into a breaking change for consumers"
    answer: 3
    explanation: |
      If the internal model IS the contract, every internal refactor breaks
      consumers. A separately-published, versioned language decouples internal
      evolution from the external contract.
    ref: "concepts.md#published-language"

  - id: ddd-strategic-context-mapping-035
    difficulty: beginner
    tags: [separate-ways]
    question: |
      The Separate Ways pattern means...
    options:
      - "Two contexts integrate through a Published Language"
      - "Two teams co-own a Shared Kernel"
      - "Two contexts deliberately do not integrate at all because the cost isn't worth it"
      - "The downstream conforms to the upstream model"
    answer: 2
    explanation: |
      Separate Ways is the conscious decision that connecting two contexts costs
      more than it's worth given small overlap, so they don't integrate — each
      satisfies its needs independently, accepting some duplication.
    ref: "concepts.md#separate-ways"

  - id: ddd-strategic-context-mapping-036
    difficulty: intermediate
    tags: [separate-ways, scenario]
    question: |
      Two contexts overlap only slightly, and building an integration would be
      expensive and brittle. Each can meet its needs alone with a little
      duplicated data. Which pattern is most appropriate?
    options:
      - "Shared Kernel"
      - "Partnership"
      - "Separate Ways"
      - "Open Host Service"
    answer: 2
    explanation: |
      When overlap is tiny and integration is costly/fragile, Separate Ways
      (no integration, accept minor duplication) maximizes autonomy and
      simplicity. The cheapest integration is sometimes no integration.
    ref: "concepts.md#separate-ways"

  - id: ddd-strategic-context-mapping-037
    difficulty: beginner
    tags: [big-ball-of-mud]
    question: |
      On a context map, a Big Ball of Mud denotes...
    options:
      - "A region with no clear boundaries, mixed models, and tangled dependencies"
      - "A well-factored core domain"
      - "A published industry-standard schema"
      - "A pair of equal partner contexts"
    answer: 0
    explanation: |
      A Big Ball of Mud is the absence of strategic design: mixed models and
      tangled dependencies with no clear boundaries. On the map it means
      "contain it, don't try to refine it."
    ref: "concepts.md#big-ball-of-mud"

  - id: ddd-strategic-context-mapping-038
    difficulty: intermediate
    tags: [big-ball-of-mud, strategy]
    question: |
      What is the recommended strategy when a Big Ball of Mud sits next to your
      clean contexts?
    options:
      - "Apply sophisticated aggregate modelling inside the mud immediately"
      - "Merge your clean context into the mud to simplify the map"
      - "Ignore it on the map so the diagram stays clean"
      - "Draw a boundary around it and protect neighbours with Anti-Corruption Layers, strangling capabilities out over time"
    answer: 3
    explanation: |
      Contain the mud with a boundary, shield neighbours with ACLs so its model
      doesn't leak, and carve capabilities out incrementally (Strangler Fig)
      rather than attempting heroic in-place refactoring.
    ref: "concepts.md#big-ball-of-mud"

  - id: ddd-strategic-context-mapping-039
    difficulty: advanced
    tags: [big-ball-of-mud, philosophy]
    question: |
      Why is "Big Ball of Mud" different in nature from the other context-map
      relationships?
    options:
      - "It is the strongest form of Partnership"
      - "It is not a pattern you choose — it's the state you get without strategic design"
      - "It only occurs in greenfield systems"
      - "It requires a Published Language to exist"
    answer: 1
    explanation: |
      Unlike Partnership, Conformist, ACL, etc. (deliberate relationships), a Big
      Ball of Mud is the default result of no strategic design. The mature
      response is containment plus incremental strangling, not in-place heroics.
    ref: "concepts.md#big-ball-of-mud"

  - id: ddd-strategic-context-mapping-040
    difficulty: intermediate
    tags: [choosing-pattern, scenario]
    question: |
      Your new Orders context must read data from a legacy ERP whose model is
      messy and which your team cannot change. You want to keep your model clean.
      Which pattern fits best?
    options:
      - "Conformist"
      - "Shared Kernel"
      - "Anti-Corruption Layer"
      - "Partnership"
    answer: 2
    explanation: |
      Integrating with an unchangeable, messy legacy upstream while protecting
      your model is the textbook case for an Anti-Corruption Layer that
      translates the ERP model into your own language at the boundary.
    ref: "concepts.md#choosing-an-integration-pattern"

  - id: ddd-strategic-context-mapping-041
    difficulty: intermediate
    tags: [choosing-pattern, scenario, ohs]
    question: |
      A central Payments platform is integrated by dozens of internal teams. What
      combination should the Payments team most likely offer?
    options:
      - "A Shared Kernel with each consuming team"
      - "A separate Conformist agreement per team"
      - "Separate Ways with every consumer"
      - "An Open Host Service exposing a Published Language"
    answer: 3
    explanation: |
      Many downstream consumers is the classic driver for an Open Host Service
      (one stable protocol) exposing a Published Language (the shared schema),
      so Payments maintains one contract instead of dozens of bespoke ones.
    ref: "concepts.md#choosing-an-integration-pattern"

  - id: ddd-strategic-context-mapping-042
    difficulty: advanced
    tags: [choosing-pattern, social]
    question: |
      In interviews, what should most drive your choice of context-mapping
      pattern?
    options:
      - "The programming language of each service"
      - "The team relationship and power dynamics between the contexts"
      - "The number of database tables involved"
      - "Which cloud provider hosts each context"
    answer: 1
    explanation: |
      The social structure (who has influence over whom, whether teams
      cooperate) forces the pattern; the API/technology follows. Justify a
      pattern by naming the relationship first.
    ref: "concepts.md#choosing-an-integration-pattern"

  - id: ddd-strategic-context-mapping-043
    difficulty: intermediate
    tags: [context-microservice]
    question: |
      Which statement about bounded contexts and microservices is the most
      defensible senior position?
    options:
      - "A microservice and a bounded context are always exactly 1:1 by definition"
      - "A service should be at most one bounded context; a context may occasionally span several services, but a service should never span multiple contexts"
      - "One microservice should always contain several bounded contexts for efficiency"
      - "Bounded contexts are irrelevant once you adopt microservices"
    answer: 1
    explanation: |
      A context is a logical boundary; a service is a deployment boundary. The
      safe heuristic: at most one context per service, never a service spanning
      two contexts; splitting one context across services needs strong
      justification.
    ref: "concepts.md#bounded-contexts-and-microservices"

  - id: ddd-strategic-context-mapping-044
    difficulty: advanced
    tags: [context-microservice, modulith]
    question: |
      A common expert recommendation for a new system is to...
    options:
      - "Start with dozens of tiny microservices immediately"
      - "Start with a modular monolith organized by bounded context, extracting services along context seams when evidence justifies it"
      - "Put every bounded context in a single shared database with no boundaries"
      - "Avoid bounded contexts until the system is large"
    answer: 1
    explanation: |
      Begin coarse: a modular monolith ("modulith") organized by context keeps
      clean seams while avoiding the network/ops tax, then extract services along
      those seams once independent scaling/deploy pressure appears.
    ref: "concepts.md#bounded-contexts-and-microservices"

  - id: ddd-strategic-context-mapping-045
    difficulty: intermediate
    tags: [context-microservice, anti-pattern]
    question: |
      Why is a single microservice that spans two bounded contexts considered an
      anti-pattern?
    options:
      - "It uses too much memory at runtime"
      - "Cloud providers forbid deploying two contexts together"
      - "It makes the service impossible to containerize"
      - "It couples unrelated models and languages into one deployable, a route to a distributed monolith"
    answer: 3
    explanation: |
      Forcing two distinct models and languages into one deployable reintroduces
      coupling and undermines independent deployability — a common path to the
      distributed monolith.
    ref: "concepts.md#bounded-contexts-and-microservices"

  - id: ddd-strategic-context-mapping-046
    difficulty: beginner
    tags: [discovery, event-storming]
    question: |
      Event Storming is a workshop technique that primarily maps the business as
      a timeline of...
    options:
      - "Database tables and their foreign keys"
      - "Domain events (e.g. Order Placed, Payment Received), then commands, actors, and policies"
      - "Server deployments and network hops"
      - "User-interface screens and buttons"
    answer: 1
    explanation: |
      Event Storming starts with domain events on sticky notes along a timeline,
      then layers on commands, actors, policies, and aggregates. Clusters and
      pivotal events reveal candidate bounded-context boundaries.
    ref: "concepts.md#discovering-contexts-event-storming-and-domain-storytelling"

  - id: ddd-strategic-context-mapping-047
    difficulty: intermediate
    tags: [discovery, domain-storytelling]
    question: |
      Domain Storytelling discovers context boundaries chiefly by...
    options:
      - "Analyzing production CPU and latency metrics"
      - "Having domain experts narrate how work actually gets done, recorded as actors, work objects, and activities"
      - "Reverse-engineering the existing database schema"
      - "Counting the number of REST endpoints"
    answer: 1
    explanation: |
      Domain Storytelling captures experts' narratives of real work as
      pictographic actor → work-object → activity diagrams; divergent vocabulary
      and hand-offs between actors surface context boundaries.
    ref: "concepts.md#discovering-contexts-event-storming-and-domain-storytelling"

  - id: ddd-strategic-context-mapping-048
    difficulty: intermediate
    tags: [discovery, signals]
    question: |
      During discovery, which signal most strongly suggests you've crossed into a
      different bounded context?
    options:
      - "A new microservice was recently deployed"
      - "The same term suddenly means something different, or work is handed off to a different set of experts"
      - "The database grew past a certain size"
      - "A different programming language is used"
    answer: 1
    explanation: |
      Linguistic seams are the key signal: a term changing meaning, a hand-off
      between different experts, data needing translation, or invariants that
      hold on one side but not the other — all mark candidate context boundaries.
    ref: "concepts.md#discovering-contexts-event-storming-and-domain-storytelling"

  - id: ddd-strategic-context-mapping-049
    difficulty: advanced
    tags: [subdomain-vs-context]
    question: |
      What is the key distinction between a subdomain and a bounded context?
    options:
      - "They are synonyms in DDD"
      - "A subdomain is a deployment unit; a bounded context is a database"
      - "A bounded context is part of the problem space; a subdomain is code you write"
      - "A subdomain is a problem-space partition of the business; a bounded context is a solution-space model boundary you build"
    answer: 3
    explanation: |
      Subdomains (core/supporting/generic) partition the problem space and exist
      regardless of your software; bounded contexts are solution-space model
      boundaries you design. Ideally one subdomain maps to one context, but legacy
      reality often violates that.
    ref: "concepts.md#subdomains-core-supporting-and-generic"

  - id: ddd-strategic-context-mapping-050
    difficulty: advanced
    tags: [conformist, acl, decision]
    question: |
      You are downstream of a stable, well-designed industry-standard API. Its
      model maps cleanly to your needs and rarely changes. Which choice is most
      cost-justified?
    options:
      - "Build a full Anti-Corruption Layer regardless"
      - "Conformist — adopt the model directly, since translation would add cost without enough benefit"
      - "Declare Separate Ways and duplicate the data"
      - "Force a Shared Kernel with the standards body"
    answer: 1
    explanation: |
      When the upstream model is clean, stable, and fits your needs, an ACL adds
      mapping cost with little payoff. Conformist (accept the model) is the
      cost-justified choice; ACL is reserved for models that would corrupt yours.
    ref: "concepts.md#conformist"

  - id: ddd-strategic-context-mapping-051
    difficulty: intermediate
    tags: [strategic-design, altitude]
    question: |
      A team jumps straight into defining aggregates and repositories without
      agreeing on bounded contexts or a context map. What is the risk?
    options:
      - "They are doing tactical design in a strategic vacuum, a frequent cause of services that can't deploy independently"
      - "They will produce too few database tables"
      - "They will be unable to use any programming language"
      - "Their aggregates will automatically become a Published Language"
    answer: 0
    explanation: |
      Tactical patterns only make sense once boundaries are known. Skipping
      strategic design means modelling internals of contexts you haven't defined,
      often producing tangled, non-independently-deployable services.
    ref: "concepts.md#strategic-vs-tactical-design"

  - id: ddd-strategic-context-mapping-052
    difficulty: advanced
    tags: [partnership, evolution]
    question: |
      Over time, many Partnership relationships tend to...
    options:
      - "Become Shared Kernels automatically"
      - "Decay into looser relationships like Customer/Supplier or Separate Ways as teams seek independence"
      - "Turn into a Big Ball of Mud by design"
      - "Require a mandatory Anti-Corruption Layer"
    answer: 1
    explanation: |
      Partnership's heavy continuous coordination is hard to sustain; as teams
      want autonomy, partnerships commonly loosen into Customer/Supplier or
      Separate Ways. Don't mandate partnership where independence is the goal.
    ref: "concepts.md#partnership"
