topic: CAP Theorem and Consistency Models
domain: system-design
topic_slug: cap-theorem-and-consistency
version: 1
questions:
- id: cap-theorem-and-consistency-001
  difficulty: beginner
  tags:
  - cap
  - fundamentals
  - definitions
  question: |
    In the CAP theorem, what does the "C" (Consistency) specifically guarantee?
  options:
  - Every read receives the most recent successful write or an error, as if there is a single copy of
    the data
  - Every transaction moves the database from one valid state to another (the ACID 'C')
  - Data is durably persisted to disk and flushed via fsync on a majority of nodes before the write is
    acknowledged to the client
  - All replicas store exactly the same number of records at all times, verified by a periodic row-count
    reconciliation job
  answer: 0
  explanation: |
    CAP's C is linearizability: reads reflect the latest write or fail. It is NOT
    the ACID consistency (valid-state transitions), which is a common trap. Durability
    is unrelated, and equal record counts is meaningless here.
  ref: concepts.md#cap-theorem-fundamentals
- id: cap-theorem-and-consistency-002
  difficulty: beginner
  tags:
  - cap
  - partition-tolerance
  question: |
    Why do most practitioners say partition tolerance (P) is not really optional in a
    distributed system?
  options:
  - Because data-protection regulations such as GDPR and SOC 2 explicitly mandate partition tolerance
    for any certified production database
  - Because network failures, dropped packets, and latency spikes are inevitable, so a multi-node system
    must keep functioning through them
  - Because partition tolerance adds a fast-path network route that lets the system skip acknowledgements
    and respond to clients faster
  - Because without partition tolerance a distributed store is mathematically limited to a single replica
    and cannot fan out additional copies
  answer: 1
  explanation: |
    Networks are unreliable; partitions will happen. So the real CAP choice is between
    C and A during a partition. It is not a legal or performance matter, and replication
    is possible without formal partition tolerance.
  ref: concepts.md#cap-theorem-fundamentals
- id: cap-theorem-and-consistency-003
  difficulty: beginner
  tags:
  - cap
  - cp-ap
  - examples
  question: |
    Which set correctly pairs systems with their typical CAP behavior?
  options:
  - Cassandra = CP; ZooKeeper = AP; Redis Cluster = CP; Consul = AP
  - etcd = AP; DynamoDB = CP; ZooKeeper = AP; Cassandra (default) = CP
  - ZooKeeper/etcd = CP; Cassandra/DynamoDB (default) = AP
  - PostgreSQL sync replication = AP; Riak = CP; etcd = AP; DynamoDB (default) = CP
  answer: 2
  explanation: |
    Consensus-based coordination stores (ZooKeeper, etcd) are CP; Dynamo-style stores
    (Cassandra, DynamoDB default) are AP. The other options invert these well-known
    classifications.
  ref: concepts.md#cap-theorem-fundamentals
- id: cap-theorem-and-consistency-004
  difficulty: intermediate
  tags:
  - cap
  - ca
  - misconception
  question: |
    A candidate says "I'll build a CA system for our multi-datacenter store." Why is
    this the wrong thing to say in a distributed-systems interview?
  options:
  - CA is only ever strictly slower than CP because it must synchronously flush to every replica, so it
    is never the optimal choice for a latency-sensitive store
  - CA systems are architecturally forbidden from using replication at all and are limited to a single
    authoritative copy of every record
  - CA is a proprietary trademark owned by a specific database vendor and cannot be used to describe
    open-source systems
  - CA is meaningful only for a single node or a system that assumes partitions never happen; a real multi-node
    store must tolerate partitions and therefore trade C against A
  answer: 3
  explanation: |
    Since partitions are unavoidable across datacenters, you cannot 'choose' to drop P.
    CA describes a single node / no-partition assumption. Claiming CA for a distributed
    store signals a misunderstanding of the theorem.
  ref: concepts.md#cap-theorem-fundamentals
- id: cap-theorem-and-consistency-005
  difficulty: intermediate
  tags:
  - cap
  - cp
  - partition-behavior
  question: |
    A CP key-value store's leader becomes isolated from the majority of its cluster
    during a network partition. What is the correct behavior for clients still able to
    reach that isolated leader?
  options:
  - The leader steps down / rejects writes (errors or blocks) because it can no longer confirm it holds
    the latest committed state, preventing split-brain
  - The leader keeps accepting writes to stay available and reconciles the divergent history with the
    majority side once the partition heals
  - The leader silently promotes one of its minority-side followers to co-leader so the smaller partition
    can continue committing writes independently
  - The leader serves reads from its in-memory cache but blocks all reads that would fall through to disk
    until the partition is resolved
  answer: 0
  explanation: |
    CP sacrifices availability during a partition: a leader that lost majority contact
    must stop accepting writes to avoid split-brain and stale/divergent data. Continuing
    to accept writes and reconcile later is AP behavior and would violate consistency;
    silently promoting a minority follower is exactly the split-brain to avoid.
  ref: concepts.md#cap-theorem-fundamentals
- id: cap-theorem-and-consistency-006
  difficulty: advanced
  tags:
  - cap
  - nuance
  - scenario
  question: |
    Your team runs a single-region, 3-node quorum database. In steady state (no
    partition), which statement about CAP is MOST accurate?
  options:
  - CAP forces you to permanently give up either consistency or availability at all times, even in steady
    state with every node healthy and no partition present
  - With no partition you can have both consistency and availability; CAP's trade-off only bites during
    a partition
  - CAP guarantees the system is fully linearizable as long as all three nodes are up and reachable, regardless
    of the configured quorum settings
  - CAP is entirely irrelevant to single-region deployments because nodes within one region are physically
    incapable of partitioning from each other
  answer: 1
  explanation: |
    CAP's C-vs-A choice only applies during a partition; in steady state you can offer
    both. Option 2 overclaims (quorum liveness does not imply linearizability by itself),
    and single-region systems can still partition (rack/switch failures, GC pauses).
  ref: concepts.md#cap-theorem-fundamentals
- id: cap-theorem-and-consistency-007
  difficulty: beginner
  tags:
  - pacelc
  - definitions
  question: |
    PACELC extends CAP by additionally describing system behavior when...
  options:
  - there is a hardware failure on a single disk, forcing a choice between rebuild speed and read integrity
  - the database exhausts its provisioned storage and must choose between rejecting writes or evicting data
  - there is no partition (normal operation), where the trade-off is between Latency and Consistency
  - a new node joins the cluster and the system must balance rebalancing speed against serving live traffic
  answer: 2
  explanation: |
    PACELC: if Partition then A vs C, Else (normal operation) Latency vs Consistency.
    It captures the everyday cost of consistency that CAP ignores. The other events are
    not what PACELC addresses.
  ref: concepts.md#pacelc-theorem
- id: cap-theorem-and-consistency-008
  difficulty: intermediate
  tags:
  - pacelc
  - classification
  question: |
    Under PACELC, DynamoDB and Cassandra in their default configuration are classified
    as PA/EL. What does that mean?
  options:
  - During a partition they favor Consistency by blocking writes, and in normal operation they favor Latency
    by serving from the nearest replica
  - They always favor Consistency in both cases, running synchronous quorum reads whether or not a partition
    is currently active
  - They favor Availability during a partition and switch to strict Consistency the moment normal operation
    resumes
  - During a partition they favor Availability; in normal operation they favor Latency (over consistency)
  answer: 3
  explanation: |
    PA = pick Availability under partition; EL = pick Latency in normal operation.
    That is the default eventual-consistency posture of Dynamo-style stores. The other
    options describe PC/EC or PA/EC systems.
  ref: concepts.md#pacelc-theorem
- id: cap-theorem-and-consistency-009
  difficulty: advanced
  tags:
  - pacelc
  - spanner
  - trade-offs
  question: |
    Why is describing Google Spanner as "PC/EC" more insightful in an interview than
    just calling it "CP"?
  options:
  - 'Because it names the everyday cost: even with no partition, Spanner chooses consistency over latency,
    paying TrueTime commit-wait on every write for global external consistency'
  - Because the PC/EC label indicates Spanner replaced Paxos consensus with a coordination-free gossip
    protocol and therefore never needs to run an agreement round
  - Because PC/EC is the formal notation for an AP system, meaning Spanner actually favors availability
    over consistency during a partition
  - Because CP and PC/EC are mutually contradictory classifications, so labeling Spanner PC/EC corrects
    a factual error in calling it CP
  answer: 0
  explanation: |
    PC/EC surfaces the steady-state price: commit-wait latency for external consistency.
    That depth is exactly what CAP alone hides. Spanner absolutely uses consensus (Paxos),
    is not AP, and CP/PC-EC are consistent (CP is the partition half).
  ref: concepts.md#pacelc-theorem
- id: cap-theorem-and-consistency-010
  difficulty: expert
  tags:
  - pacelc
  - design-judgment
  question: |
    A globally distributed session store needs single-digit-millisecond reads in every
    region and can tolerate a user occasionally seeing slightly stale session metadata.
    Under PACELC, which posture and configuration best fits, and what is the primary
    cost you accept?
  options:
  - PC/EC with synchronous cross-region quorum writes; accept ~hundreds of ms write latency for global
    linearizability
  - PA/EL with regional replicas serving local reads (e.g., LOCAL_ONE / eventual reads); accept temporary
    staleness in exchange for low latency and high availability
  - PC/EL with a single global leader owning all writes; accept that every region's reads must cross the
    network to that one datacenter, adding tens of milliseconds
  - CA with no replication and a single primary node; accept a single point of failure and total data
    loss if that node's disk fails
  answer: 1
  explanation: |
    Latency budget and tolerance for staleness point to PA/EL: serve local eventual reads.
    Cross-region synchronous quorums (option 0) blow the latency budget; a single global
    leader (option 2) defeats local low-latency reads; CA/no replication (option 3) is not
    viable for a global store.
  ref: concepts.md#pacelc-theorem
- id: cap-theorem-and-consistency-011
  difficulty: beginner
  tags:
  - eventual-consistency
  - definitions
  question: |
    What does "eventual consistency" guarantee?
  options:
  - Every read always returns the latest committed write in real time, regardless of which replica serves
    the request
  - Writes are never lost under any circumstance, because each write is journaled to durable storage on
    every replica before acknowledgement
  - If no new writes are made, all replicas will eventually converge to the same value
  - All replicas are updated synchronously in lockstep before a write is acknowledged back to the client
  answer: 2
  explanation: |
    Eventual consistency only promises convergence in the absence of new writes; it makes
    no recency or ordering guarantee in the interim. Option 0 is strong consistency, and
    option 3 is synchronous replication.
  ref: concepts.md#strong-versus-eventual-consistency-spectrum
- id: cap-theorem-and-consistency-012
  difficulty: beginner
  tags:
  - consistency-spectrum
  - examples
  question: |
    Which real-world example is the classic illustration of an eventually consistent
    system?
  options:
  - A distributed lock service that serializes access to a shared resource across nodes
  - A bank's core ledger that must reflect every debit and credit immediately and exactly
  - A Raft-based configuration store that commits changes through a majority quorum
  - DNS, where record changes propagate over time bounded by TTLs
  answer: 3
  explanation: |
    DNS is the textbook eventually consistent system (TTL-based propagation). Locks,
    ledgers, and Raft config stores all require strong consistency.
  ref: concepts.md#strong-versus-eventual-consistency-spectrum
- id: cap-theorem-and-consistency-013
  difficulty: intermediate
  tags:
  - consistency-spectrum
  - s3
  - real-world
  question: |
    Amazon S3 historically offered eventual consistency and then moved to strong
    read-after-write consistency for all operations (2020). What is the main lesson for
    a system designer?
  options:
  - Consistency level is a deliberate design choice that can be tightened when the business need justifies
    the added coordination cost
  - Eventual consistency is always a latent bug that must be fixed, so any system exposing it should be
    migrated to strong consistency
  - Strong consistency becomes essentially free once you scale past a few hundred nodes, because the coordination
    cost amortizes away
  - Object stores are architecturally incapable of being eventually consistent and can only ever offer
    strong read-after-write semantics
  answer: 0
  explanation: |
    S3's evolution shows consistency is a choice, not a fixed limitation; it was tightened
    when worth the cost. Eventual consistency is often the right choice (not a bug), strong
    consistency is never free, and object stores can be either.
  ref: concepts.md#strong-versus-eventual-consistency-spectrum
- id: cap-theorem-and-consistency-014
  difficulty: intermediate
  tags:
  - consistency-spectrum
  - trade-offs
  question: |
    What is the fundamental resource you "spend" to move from eventual toward strong
    consistency?
  options:
  - Disk space, since each stronger level keeps additional historical versions of every record on every
    replica
  - Coordination — more round trips and more nodes that must agree, which costs latency and availability
  - CPU cycles only, spent hashing and comparing replica states on every read and write path
  - Developer headcount, because stronger models require dedicated engineers to hand-tune replication lag
  answer: 1
  explanation: |
    Stronger consistency requires more coordination (leader/quorum/sync replication),
    which costs latency and reduces availability under partition. It is not primarily a
    disk, CPU, or staffing matter.
  ref: concepts.md#strong-versus-eventual-consistency-spectrum
- id: cap-theorem-and-consistency-015
  difficulty: advanced
  tags:
  - consistency-spectrum
  - design-judgment
  question: |
    A payments company wants one storage strategy for both the money ledger and the
    "recent transactions" activity feed shown in the app. What is the best approach?
  options:
  - Make the entire system strongly consistent so nothing is ever stale, routing both the ledger and the
    activity feed through the same synchronous quorum path
  - Make the entire system eventually consistent for maximum availability, including the money ledger,
    and reconcile any divergence with a nightly batch job
  - 'Decompose by data class: keep the ledger strongly consistent and make the recent-transactions feed
    eventually consistent'
  - Use a single in-memory cache in front of everything and disable the backing database entirely so all
    reads and writes hit one fast tier
  answer: 2
  explanation: |
    The senior move is to apply different consistency to different data classes: strong for
    the ledger, eventual for the feed. Forcing one level everywhere either over-pays latency
    (option 0) or risks correctness of money (option 1); option 3 abandons the source of truth.
  ref: concepts.md#strong-versus-eventual-consistency-spectrum
- id: cap-theorem-and-consistency-016
  difficulty: beginner
  tags:
  - session-guarantees
  - read-your-writes
  question: |
    A user updates their profile photo, reloads the page, and still sees the old photo.
    Which consistency guarantee is being violated?
  options:
  - Monotonic writes, which requires each client's successive writes to apply in the order they were issued
  - Linearizability across all clients, which makes every read observe the single most recent global write
  - Serializability, which requires concurrent transactions to be equivalent to some serial execution order
  - Read-your-writes (read-after-write) consistency
  answer: 3
  explanation: |
    Not seeing your own just-made write is a read-your-writes violation, typically caused by
    reads hitting a lagging async replica. It is a per-client (session) guarantee, distinct
    from global linearizability or transaction serializability.
  ref: concepts.md#session-and-client-centric-consistency-guarantees
- id: cap-theorem-and-consistency-017
  difficulty: intermediate
  tags:
  - session-guarantees
  - monotonic-reads
  question: |
    A user refreshes a page and sees a comment, then refreshes again and the comment is
    gone (it reappears later). Which guarantee would prevent this "time going backwards"
    anomaly, and how is it commonly implemented?
  options:
  - Monotonic reads, implemented by pinning the session to one replica (sticky routing) or carrying a
    minimum-version token
  - Read-your-writes, implemented by always routing a client's reads through a write-through cache that
    it populated on its last write
  - Serializability, implemented by two-phase locking that holds read and write locks until each transaction
    commits
  - Causal consistency, implemented by a global consensus round that totally orders every read before it
    is served
  answer: 0
  explanation: |
    Seeing newer then older data is a monotonic-reads violation, caused by hitting different
    lagging replicas. Sticky routing or version tokens fix it. The other options address
    different anomalies/mechanisms.
  ref: concepts.md#session-and-client-centric-consistency-guarantees
- id: cap-theorem-and-consistency-018
  difficulty: advanced
  tags:
  - session-guarantees
  - trade-offs
  - sticky-routing
  question: |
    Your app uses an eventually consistent store but wants read-your-writes via sticky
    routing (pin each session to one replica). What is the main downside you must plan for?
  options:
  - Sticky routing silently upgrades every write to be strongly consistent across all replicas globally,
    which is far too slow for an eventually consistent store
  - It reduces load-balancing freedom and, if the pinned replica fails, you must fail over and may briefly
    break the guarantee
  - It requires running a full consensus protocol round on every single read before the pinned replica
    can return a value
  - It eliminates the need for any conflict resolution, because pinning a session guarantees no two replicas
    ever hold divergent versions
  answer: 1
  explanation: |
    Sticky routing trades load-balancing flexibility and adds a failure edge case: when the
    pinned replica dies you re-route and can momentarily violate the guarantee. It does not
    make writes globally strong, need consensus per read, or remove conflict handling.
  ref: concepts.md#session-and-client-centric-consistency-guarantees
- id: cap-theorem-and-consistency-019
  difficulty: intermediate
  tags:
  - session-guarantees
  - design-judgment
  question: |
    Why are session guarantees (read-your-writes, monotonic reads) often called the
    "sweet spot" for user-facing apps built on eventually consistent stores?
  options:
  - They provide full global linearizability across all replicas at no added latency or coordination
    cost
  - They upgrade the database to full serializable transaction isolation for every concurrent operation
  - They eliminate the most jarring user-visible anomalies without paying for global strong consistency
  - They remove the need for replication by keeping all session state on a single authoritative node
  answer: 2
  explanation: |
    Session guarantees remove the anomalies a single user notices (own edits vanishing,
    time going backwards) cheaply, while keeping the scalability of eventual consistency.
    They are not global linearizability/serializability and do not remove replication.
  ref: concepts.md#session-and-client-centric-consistency-guarantees
- id: cap-theorem-and-consistency-020
  difficulty: beginner
  tags:
  - causal-consistency
  - definitions
  question: |
    Causal consistency guarantees that...
  options:
  - all operations, whether causally related or not, are seen in exactly the same single total order
    by every replica across the cluster
  - every read returns the latest committed write in real time, exactly as a single-copy linearizable
    register would
  - writes are never lost, because each update is synchronously journaled to a majority of replicas
    before it is acknowledged
  - operations that are causally related (one could have influenced the other) are seen in that order
    by everyone, while concurrent operations may be seen in different orders
  answer: 3
  explanation: |
    Causal consistency preserves happens-before ordering but allows concurrent (unrelated)
    operations to be observed in different orders. It is weaker than a single total order
    seen by all replicas and weaker than linearizability (real-time latest-write reads),
    and it does not by itself guarantee writes are never lost.
  ref: concepts.md#causal-consistency
- id: cap-theorem-and-consistency-021
  difficulty: intermediate
  tags:
  - causal-consistency
  - mechanism
  question: |
    How is causal consistency typically implemented, and why can it remain available
    during a partition?
  options:
  - By tracking causal dependencies with logical/vector clocks and delaying visibility of a write until
    its dependencies are applied — no consensus or blocking quorum needed
  - By electing a single global leader that totally orders all writes and streams that ordered log to
    every follower
  - By using two-phase commit across all replicas so that every write is atomically applied everywhere
    before it returns
  - By synchronously replicating every write to all nodes and blocking the client until the slowest replica
    confirms
  answer: 0
  explanation: |
    Causal consistency uses logical/vector clocks to enforce dependency ordering locally,
    without a leader, consensus, or blocking quorum — which is why it can stay available
    under partition. The other options describe stronger, coordination-heavy schemes.
  ref: concepts.md#causal-consistency
- id: cap-theorem-and-consistency-022
  difficulty: advanced
  tags:
  - causal-consistency
  - theory
  - trade-offs
  question: |
    A well-known result states that causal consistency (specifically "causal+") is
    significant because it is...
  options:
  - the weakest consistency model that any database can offer, sitting just above returning arbitrary
    garbage values
  - the strongest consistency model achievable by a system that remains fully available under network
    partitions
  - provably equivalent to full linearizability while costing far fewer coordination round trips per
    operation
  - only achievable on a single-node database, since any replication at all makes causal ordering impossible
    to maintain
  answer: 1
  explanation: |
    Causal+ is the ceiling for always-available (AP) systems: you cannot get stronger while
    staying available under partition. It is not the weakest model, not equivalent to
    linearizability (no real-time recency), and not single-node-only.
  ref: concepts.md#causal-consistency
- id: cap-theorem-and-consistency-023
  difficulty: advanced
  tags:
  - causal-consistency
  - limitations
  question: |
    What does causal consistency NOT give you that you must still handle separately?
  options:
  - Ordering of operations that are causally related, so cause always precedes effect for every observer
    in the system
  - Read-your-writes within a single client session, so a client is guaranteed to observe its own prior
    updates
  - Ordering/resolution of concurrent writes to the same key, and real-time recency across clients (linearizability)
  - The ability to run without a global leader or any central coordination point during normal steady-state
    operation
  answer: 2
  explanation: |
    Causal consistency orders causally related ops but leaves concurrent writes unordered
    (still needs conflict resolution) and gives no cross-client real-time recency. Causal
    consistency does provide causally-related ordering and read-your-writes, and it works
    without a global leader — so those are things it gives you, not what it lacks.
  ref: concepts.md#causal-consistency
- id: cap-theorem-and-consistency-024
  difficulty: intermediate
  tags:
  - linearizability
  - serializability
  - definitions
  question: |
    Which statement correctly distinguishes linearizability from serializability?
  options:
  - Linearizability is about multi-object transactions; serializability is about single-object reads
    and writes
  - They are two interchangeable names for the exact same underlying guarantee, differing only by academic
    tradition
  - Serializability guarantees real-time wall-clock order across clients; linearizability makes no ordering
    promise at all
  - Linearizability is a real-time recency/ordering guarantee on single objects; serializability is an
    isolation guarantee that concurrent transactions produce a result equal to some serial order
  answer: 3
  explanation: |
    Linearizability = single-object, real-time order. Serializability = multi-object
    transaction isolation with no real-time requirement. The distractors either swap the
    two scopes, claim they are identical, or invert which one carries the real-time property.
  ref: concepts.md#linearizability-versus-serializability
- id: cap-theorem-and-consistency-025
  difficulty: advanced
  tags:
  - strict-serializability
  - spanner
  question: |
    Strict serializability (as provided by Spanner's "external consistency") is best
    described as...
  options:
  - 'serializability PLUS linearizability: transactions appear to run one at a time AND that order respects
    real (wall-clock) time'
  - plain serializability with no real-time ordering constraint, so a stale-but-serial commit order is
    permitted
  - linearizability applied to single keys only, with no multi-object transaction isolation whatsoever
  - snapshot isolation augmented with shared read locks held until each transaction commits
  answer: 0
  explanation: |
    Strict serializability combines transaction serializability with a real-time order
    constraint — the gold standard Spanner/FaunaDB offer. The distractors describe plain
    serializability (no real-time order), plain single-key linearizability, or a weaker
    snapshot-isolation level.
  ref: concepts.md#linearizability-versus-serializability
- id: cap-theorem-and-consistency-026
  difficulty: expert
  tags:
  - snapshot-isolation
  - write-skew
  - trap
  question: |
    A team claims their PostgreSQL app is "serializable" because it uses REPEATABLE READ.
    What is the subtle problem?
  options:
  - REPEATABLE READ is strictly stronger than the SERIALIZABLE level, so the team is over-provisioning
    isolation and wasting throughput
  - REPEATABLE READ in Postgres is actually snapshot isolation, which allows write skew — it is not truly
    serializable; SERIALIZABLE (SSI) is needed to prevent it
  - REPEATABLE READ disables MVCC and falls back to table-level locking, causing severe lock contention
    under load
  - There is no problem at all; in PostgreSQL the REPEATABLE READ and SERIALIZABLE levels are implemented
    identically
  answer: 1
  explanation: |
    Postgres REPEATABLE READ = snapshot isolation, which permits write skew (a multi-object
    invariant violation). True serializability requires the SERIALIZABLE level (SSI). It is
    weaker, not stronger, and not identical.
  ref: concepts.md#linearizability-versus-serializability
- id: cap-theorem-and-consistency-027
  difficulty: advanced
  tags:
  - linearizability
  - serializability
  - design-judgment
  question: |
    Which pairing of workload to guarantee is MOST appropriate?
  options:
  - Distributed lock / leader election -> transaction serializability but explicitly not single-object
    linearizability
  - Bank transfer between two accounts -> linearizability of a single account key only, ignoring the second
    account
  - Bank transfer between two accounts -> strict serializability; distributed lock / leader election ->
    linearizability
  - Analytics dashboard query over historical data -> strict serializability enforced on every aggregate
    read
  answer: 2
  explanation: |
    A transfer touches multiple rows with real-time expectations -> strict serializability;
    a lock/leader on a single register -> linearizability. Locks need linearizability (not
    just serializability), single-key linearizability is insufficient for a multi-row transfer,
    and analytics only needs a consistent snapshot.
  ref: concepts.md#linearizability-versus-serializability
- id: cap-theorem-and-consistency-028
  difficulty: intermediate
  tags:
  - serializability
  - isolation
  - throughput
  question: |
    What is the primary throughput cost of enforcing serializable isolation via two-phase
    locking (2PL) under contention?
  options:
  - It requires substantially more disk space per row to store the extra lock-bookkeeping metadata inline
  - It silently disables replication, forcing the isolated primary to serve every read and write alone
  - It quietly downgrades the store to eventual consistency once the lock table exceeds its budget
  - Lock contention and deadlocks that serialize or stall conflicting transactions
  answer: 3
  explanation: |
    2PL serializes conflicting transactions via locks, causing contention and deadlocks that
    cap throughput. SSI instead aborts/retries under contention. It is not primarily a disk
    cost and does not disable replication or force eventual consistency.
  ref: concepts.md#linearizability-versus-serializability
- id: cap-theorem-and-consistency-029
  difficulty: beginner
  tags:
  - quorum
  - nrw
  - definitions
  question: |
    In an N/R/W quorum system, what does the inequality R + W > N ensure?
  options:
  - That the set of replicas read overlaps the set written by at least one node, so a read can observe
    the most recent write
  - That reads are always faster than writes because the read set is guaranteed to be the smaller of
    the two quorums
  - That all N replicas are contacted on every single operation, guaranteeing every node stays fully
    up to date
  - That writes are applied asynchronously in the background after the client has already been acknowledged
  answer: 0
  explanation: |
    R + W > N forces overlap between read and write sets, so at least one read replica has
    the latest write (a strict quorum). It does not dictate relative speed, contact all N,
    or imply async writes.
  ref: concepts.md#quorums-n-r-w-and-r-plus-w-greater-than-n
- id: cap-theorem-and-consistency-030
  difficulty: intermediate
  tags:
  - quorum
  - tuning
  - latency
  question: |
    With N=3, which setting favors fast, highly-available writes at the expense of durability
    and read cost?
  options:
  - W=3, R=1
  - W=1, R=3
  - W=2, R=2
  - W=3, R=3
  answer: 1
  explanation: |
    W=1 makes writes fast and available (only one ack needed) but durable on just one node
    (loss risk) and forces R=3 to guarantee overlap, making reads slow. W=3,R=1 is the
    opposite; W=2,R=2 is balanced; W=3,R=3 maximizes both costs.
  ref: concepts.md#quorums-n-r-w-and-r-plus-w-greater-than-n
- id: cap-theorem-and-consistency-031
  difficulty: advanced
  tags:
  - quorum
  - sloppy-quorum
  - gotcha
  question: |
    A team sets write=QUORUM and read=QUORUM in Cassandra (so R+W>N) but still occasionally
    reads stale data during a partition. What is the most likely explanation?
  options:
  - The R+W>N quorum arithmetic is implemented incorrectly in Cassandra's coordinator and silently under-counts
    acknowledgements
  - They forgot to enable TLS between nodes, so replication traffic is being dropped by the network layer
  - Sloppy quorums with hinted handoff route writes to reachable (non-home) nodes during a partition,
    breaking the R+W>N overlap guarantee to preserve availability
  - Read repair permanently corrupts data whenever it runs concurrently with a quorum read during the
    partition
  answer: 2
  explanation: |
    To stay available (AP), Dynamo/Cassandra use sloppy quorums + hinted handoff during
    partitions: writes land on the first N reachable nodes, so the read/write overlap no
    longer holds and stale reads can occur. The quorum math itself is fine.
  ref: concepts.md#quorums-n-r-w-and-r-plus-w-greater-than-n
- id: cap-theorem-and-consistency-032
  difficulty: advanced
  tags:
  - quorum
  - linearizability
  - nuance
  question: |
    Is a strict quorum (R + W > N) equivalent to linearizability?
  options:
  - Yes, R+W>N is mathematically identical to linearizability for every possible interleaving of operations
  - No, because a strict quorum can never actually guarantee any overlap between the read and write sets
  - Yes, provided N is an odd number so that a clean majority always exists for both reads and writes
  - No — concurrent writes, sloppy quorums, and read-repair races can still expose anomalies, so strict
    quorum is 'strong-ish' but not full linearizability
  answer: 3
  explanation: |
    Strict quorum guarantees overlap for a single completed write but does not order
    concurrent writes or eliminate read-repair/sloppy-quorum races, so it is not full
    linearizability. Odd N does not change this.
  ref: concepts.md#quorums-n-r-w-and-r-plus-w-greater-than-n
- id: cap-theorem-and-consistency-033
  difficulty: intermediate
  tags:
  - quorum
  - multi-region
  - local-quorum
  question: |
    Why do multi-datacenter Cassandra deployments often use LOCAL_QUORUM instead of QUORUM?
  options:
  - LOCAL_QUORUM keeps the quorum within a single datacenter to avoid cross-region round-trip latency,
    trading some cross-region freshness for lower latency
  - LOCAL_QUORUM is strictly more consistent globally because it always waits for a majority in every
    datacenter simultaneously
  - The plain QUORUM consistency level has been deprecated and removed in modern Cassandra releases
  - LOCAL_QUORUM disables asynchronous replication to the other datacenters, keeping data confined to
    the local one
  answer: 0
  explanation: |
    LOCAL_QUORUM confines the quorum to one DC for low latency, accepting that a full-region
    outage could lose recent writes. It is not more globally consistent, QUORUM is not
    deprecated, and cross-DC replication still occurs.
  ref: concepts.md#quorums-n-r-w-and-r-plus-w-greater-than-n
- id: cap-theorem-and-consistency-034
  difficulty: beginner
  tags:
  - conflict-resolution
  - lww
  question: |
    In Last-Write-Wins (LWW) conflict resolution, how is a conflict between two concurrent
    writes resolved?
  options:
  - Both conflicting values are retained as siblings and handed to the application layer to merge deterministically
  - The write with the highest timestamp is kept and the others are discarded
  - The write originating from the node with the numerically lowest node ID always wins the tiebreak
  - The system blocks the key and stalls all further writes until a human operator manually resolves
    the conflict
  answer: 1
  explanation: |
    LWW keeps the highest-timestamp write and discards the rest. Keeping siblings is the
    vector-clock approach; node-ID tiebreaks and manual resolution are not the LWW rule.
  ref: concepts.md#conflict-resolution-lww-vector-clocks-crdts
- id: cap-theorem-and-consistency-035
  difficulty: intermediate
  tags:
  - conflict-resolution
  - lww
  - trade-offs
  question: |
    What is the key danger of using LWW for a shopping cart (a set of items)?
  options:
  - It uses too much per-item metadata, bloating each cart entry with version vectors that grow unbounded
  - It requires a full consensus protocol round across replicas before any item can be added to the cart
  - It can silently lose concurrent writes (dropped items) and depends on clock synchronization to pick
    the 'winner'
  - It makes cart reads dramatically slower than writes because every read must reconcile all historical
    versions
  answer: 2
  explanation: |
    LWW silently discards the losing write, so concurrent 'add item' operations can vanish;
    it also relies on synchronized clocks. That is why carts use merge/CRDT/vector-clock
    approaches. LWW is cheap on metadata and needs no consensus.
  ref: concepts.md#conflict-resolution-lww-vector-clocks-crdts
- id: cap-theorem-and-consistency-036
  difficulty: intermediate
  tags:
  - conflict-resolution
  - vector-clocks
  question: |
    What do vector clocks let a system determine that simple timestamps cannot?
  options:
  - The exact wall-clock time at which every individual write was issued across the cluster
  - Which replica node currently holds the most stored data and should therefore win conflicts
  - The precise network latency between replicas so writes can be routed to the closest node
  - Whether one write causally happened-before another or whether the two are concurrent (a genuine conflict)
  answer: 3
  explanation: |
    Vector clocks capture the happens-before relation, distinguishing causally ordered
    writes from concurrent ones (true conflicts). They do not measure wall-clock time,
    storage, or latency.
  ref: concepts.md#conflict-resolution-lww-vector-clocks-crdts
- id: cap-theorem-and-consistency-037
  difficulty: advanced
  tags:
  - conflict-resolution
  - vector-clocks
  - trade-offs
  question: |
    What is the main practical drawback of vector clocks compared to LWW?
  options:
  - They detect conflicts but do not resolve them (pushing merge logic to the app), and the clock size
    grows with the number of writers
  - They silently drop the losing side of every concurrent write, exactly like Last-Write-Wins, so conflicting
    updates vanish without a trace
  - They depend on tightly NTP-synchronized wall clocks and produce incorrect orderings the moment clock
    skew exceeds a few milliseconds
  - They are unable to distinguish concurrent writes from causally ordered ones, so genuine conflicts pass
    through completely undetected
  answer: 0
  explanation: |
    Vector clocks correctly detect conflicts (no silent loss) but leave resolution to the
    application and grow with the number of writers (mitigated by pruning/dotted version
    vectors). They do not need synchronized clocks and DO detect concurrency.
  ref: concepts.md#conflict-resolution-lww-vector-clocks-crdts
- id: cap-theorem-and-consistency-038
  difficulty: intermediate
  tags:
  - crdt
  - definitions
  question: |
    What property makes CRDTs (Conflict-free Replicated Data Types) converge automatically
    without coordination?
  options:
  - They elect a single coordinating leader that arbitrates and resolves every conflicting update before
    it becomes visible to the other replicas
  - Their merge operation is commutative, associative, and idempotent, so replicas reach the same state
    regardless of message order or duplication
  - They run a synchronous two-phase commit across every replica on each update so that divergence can
    never arise in the first place
  - They keep only the write bearing the newest timestamp and discard all older concurrent updates, letting
    the latest one overwrite the rest
  answer: 1
  explanation: |
    CRDT merges are commutative, associative, and idempotent, guaranteeing convergence
    (strong eventual consistency) with no coordination. They need no leader, no 2PC, and
    do not simply discard writes (that would be LWW).
  ref: concepts.md#conflict-resolution-lww-vector-clocks-crdts
- id: cap-theorem-and-consistency-039
  difficulty: advanced
  tags:
  - crdt
  - trade-offs
  - design-judgment
  question: |
    You are designing a globally distributed "like" counter that must never lose a like and
    needs no central coordination. Which approach fits best and what is the trade-off?
  options:
  - An LWW register holding the running count; trade-off is that concurrent likes from different regions
    overwrite each other, so a fraction are silently lost
  - A single Raft-replicated counter; trade-off is that all increments funnel through one leader, limiting
    throughput and global availability
  - A PN-Counter / G-Counter CRDT aggregated per region; trade-off is metadata overhead and that the model
    must fit CRDT semantics
  - A cache-only counter with a short TTL that recomputes on miss; trade-off is that the count resets to
    zero whenever the entry expires or is evicted
  answer: 2
  explanation: |
    A counter CRDT converges without coordination and loses no increments — ideal for a
    global like button — at the cost of metadata and CRDT-modeling constraints. LWW loses
    concurrent likes; a single Raft counter bottlenecks throughput; a TTL cache loses counts.
  ref: concepts.md#conflict-resolution-lww-vector-clocks-crdts
- id: cap-theorem-and-consistency-040
  difficulty: expert
  tags:
  - crdt
  - semantics
  - gotcha
  question: |
    Even though CRDTs guarantee replicas converge to the SAME value, why can the merged
    result still be semantically surprising (e.g., a deleted item reappearing)?
  options:
  - Because CRDT merge functions are secretly non-deterministic, so two replicas applying the same set
    of updates can settle on genuinely different final values
  - Because CRDTs depend on tightly synchronized physical clocks whose inevitable drift reorders operations
    and corrupts the merged result over time
  - Because CRDTs silently discard the losing side of a concurrent update exactly the way Last-Write-Wins
    does, quietly dropping one user's change
  - Because convergence guarantees agreement on a value, but the merge policy (e.g., an OR-Set's add-wins
    bias) may not match user intent, resurrecting a concurrently-deleted element
  answer: 3
  explanation: |
    CRDTs converge to a consistent value, but the chosen semantics (add-wins vs remove-wins)
    determine whether a concurrent add/delete resurrects an item. The merged value is
    consistent, just possibly not what the user meant. CRDTs are deterministic and do not
    rely on wall clocks or silently drop writes.
  ref: concepts.md#conflict-resolution-lww-vector-clocks-crdts
- id: cap-theorem-and-consistency-041
  difficulty: intermediate
  tags:
  - conflict-resolution
  - comparison
  question: |
    Which conflict-resolution strategy is the correct fit for "a user's single preference
    setting where the latest intent should simply win, and clocks are trusted"?
  options:
  - Last-Write-Wins (LWW)
  - Vector clocks with application merge
  - An OR-Set CRDT
  - Serializable transactions with 2PL
  answer: 0
  explanation: |
    For last-intent-wins single values with trusted clocks, LWW is the simplest correct
    choice. Vector clocks/CRDTs add unnecessary machinery for a value where losing the older
    write is acceptable, and full serializable transactions are overkill.
  ref: concepts.md#conflict-resolution-lww-vector-clocks-crdts
- id: cap-theorem-and-consistency-042
  difficulty: beginner
  tags:
  - consensus
  - definitions
  question: |
    What is the core purpose of a consensus algorithm like Paxos or Raft?
  options:
  - To compress the replicated log with a dictionary coder before it is flushed to durable storage on each
    node
  - To make a set of nodes agree on a single value or an ordered log of operations despite failures
  - To distribute incoming client requests evenly across all healthy replicas using a round-robin balancing
    policy
  - To encrypt inter-node traffic with a rotating session key so replication data cannot be read on the
    wire
  answer: 1
  explanation: |
    Consensus produces agreement on a value / ordered log among nodes despite failures — the
    basis for replicated state machines and CP systems. It is not about compression, load
    balancing, or encryption.
  ref: concepts.md#consensus-paxos-and-raft-intuition
- id: cap-theorem-and-consistency-043
  difficulty: intermediate
  tags:
  - consensus
  - raft
  - fault-tolerance
  question: |
    A Raft cluster has 5 nodes. How many node failures can it tolerate while still making
    progress?
  options:
  - '4'
  - '3'
  - '2'
  - '1'
  answer: 2
  explanation: |
    Raft needs a majority (⌊5/2⌋+1 = 3) to commit, so it tolerates ⌊(5-1)/2⌋ = 2 failures.
    3 or 4 failures would leave no majority; 1 understates its tolerance.
  ref: concepts.md#consensus-paxos-and-raft-intuition
- id: cap-theorem-and-consistency-044
  difficulty: intermediate
  tags:
  - consensus
  - raft
  - cluster-size
  question: |
    Why do consensus clusters typically use an odd number of nodes (3 or 5)?
  options:
  - Odd cluster sizes hash more evenly across the consistent-hashing ring, so partitions of keys stay
    balanced across the nodes
  - Raft's election protocol is mathematically undefined for an even number of nodes and simply refuses
    to start the cluster
  - Odd numbers of nodes let the storage engine pack replicas more tightly, measurably reducing total disk
    usage per cluster
  - An even count does not improve fault tolerance over the next-lower odd count (e.g., 6 tolerates the
    same 2 failures as 5) while costing more latency and resources
  answer: 3
  explanation: |
    6 nodes need a majority of 4, still tolerating only 2 failures — same as 5 nodes — but
    cost more and add latency. So odd sizes are preferred. Raft can technically run on even
    counts; it is just wasteful. Hashing/disk are irrelevant.
  ref: concepts.md#consensus-paxos-and-raft-intuition
- id: cap-theorem-and-consistency-045
  difficulty: advanced
  tags:
  - consensus
  - raft
  - paxos
  - trade-offs
  question: |
    In interviews, what is the most defensible reason modern systems (etcd, CockroachDB,
    Consul) chose Raft over Multi-Paxos despite similar performance?
  options:
  - Raft was designed for understandability and operability (clear leader election, log replication, safety),
    reducing implementation bugs
  - Raft is Byzantine fault tolerant and keeps agreeing correctly even when some nodes lie or send conflicting
    messages, whereas Multi-Paxos cannot
  - Raft commits writes without ever needing a majority quorum, so it stays available even when most of
    the cluster is unreachable
  - Raft delivers effectively unbounded write throughput because followers can commit entries in parallel
    without waiting on the leader
  answer: 0
  explanation: |
    Raft's explicit design goal was understandability/operability, which lowers
    implementation risk — the usual cited reason. Neither Raft nor basic Paxos is Byzantine
    tolerant, both need majority quorums, and both bottleneck writes through the leader.
  ref: concepts.md#consensus-paxos-and-raft-intuition
- id: cap-theorem-and-consistency-046
  difficulty: advanced
  tags:
  - consensus
  - throughput
  - scaling
  question: |
    A team wants to store a high-throughput data plane (millions of writes/sec) in a single
    Raft group for "strong consistency." What is the flaw and the better pattern?
  options:
  - There is no flaw; a single Raft leader scales writes linearly because followers replicate the log in
    parallel with no shared bottleneck
  - All writes funnel through one leader, which bottlenecks throughput; shard the data into many per-partition
    Raft groups (as CockroachDB/TiKV do)
  - Raft cannot actually provide strong consistency under load, so replace it with Last-Write-Wins timestamp
    resolution on the data plane
  - Raft begins silently dropping committed entries once throughput is high, so the fix is to disable replication
    and run a single unreplicated node
  answer: 1
  explanation: |
    Consensus writes bottleneck at the single leader; the fix is to shard into many Raft
    groups so writes parallelize across leaders. A single leader does not scale linearly,
    Raft does provide strong consistency, and disabling replication defeats the purpose.
  ref: concepts.md#consensus-paxos-and-raft-intuition
- id: cap-theorem-and-consistency-047
  difficulty: expert
  tags:
  - consensus
  - byzantine
  - limitations
  question: |
    A colleague proposes using Raft to reach agreement across mutually-distrusting
    organizations where some nodes might send conflicting/false messages. Why is Raft the
    wrong tool?
  options:
  - Raft is structurally unable to elect a leader when the voting nodes span more than one organization
    or administrative domain
  - Raft only works with exactly 3 nodes and cannot be configured for the larger clusters that multiple
    organizations would require
  - Raft assumes crash-stop (non-Byzantine) failures; it does not tolerate nodes that lie or send conflicting
    messages — that requires BFT protocols like PBFT or blockchain-style consensus
  - Raft mandates that every participating node trust one central certificate authority, which mutually
    distrusting organizations would never agree to share
  answer: 2
  explanation: |
    Raft (and Paxos) tolerate crash failures, not Byzantine (malicious/lying) nodes. Mutual
    distrust needs Byzantine fault tolerant consensus. Raft can span orgs and any odd size;
    the CA claim is fabricated.
  ref: concepts.md#consensus-paxos-and-raft-intuition
- id: cap-theorem-and-consistency-048
  difficulty: beginner
  tags:
  - tunable-consistency
  - cassandra
  question: |
    What does "tunable consistency" in Cassandra/DynamoDB refer to?
  options:
  - The coordinator automatically routing each request to whichever replica currently reports the lowest
    latency, with no application involvement
  - A scheduled background process that walks the keyspace nightly and repairs divergent replicas to a
    single agreed value
  - Encrypting data at rest using an operator-selectable key size (128, 192, or 256 bits) per column family
  - Letting the application choose a consistency level per operation, trading freshness against latency
    and availability
  answer: 3
  explanation: |
    Tunable consistency exposes the consistency level as a per-operation knob (e.g.,
    Cassandra CLs, DynamoDB eventual vs strong reads). It is not auto-replica selection,
    a repair job, or encryption.
  ref: concepts.md#tunable-consistency-dynamo-and-cassandra-style
- id: cap-theorem-and-consistency-049
  difficulty: intermediate
  tags:
  - tunable-consistency
  - dynamodb
  question: |
    In DynamoDB, what do you typically trade when you request strongly consistent reads
    instead of the default eventually consistent reads?
  options:
  - Higher latency and cost, they cannot be served from all availability zones, and they are not available
    for cross-region strong reads in global tables
  - Nothing at all; strongly consistent reads are strictly better and carry no additional cost or latency
    over eventual reads
  - You lose durability, because strongly consistent reads bypass the commit log and read directly from
    an unflushed memory buffer
  - You must disable DynamoDB transactions, since TransactWriteItems is incompatible with strongly consistent
    read requests
  answer: 0
  explanation: |
    Strongly consistent reads cost more, have higher latency, can't be served from every AZ,
    and global tables don't offer strong cross-region reads. Durability is unaffected and
    transactions remain available.
  ref: concepts.md#tunable-consistency-dynamo-and-cassandra-style
- id: cap-theorem-and-consistency-050
  difficulty: advanced
  tags:
  - tunable-consistency
  - trade-offs
  - correctness
  question: |
    What is the primary downside of tunable consistency from an engineering-organization
    perspective?
  options:
  - It makes the database measurably slower for every query, because the engine must evaluate the requested
    consistency level on each operation before serving it
  - It shifts correctness decisions onto developers — every query's consistency level is a potential subtle
    bug, and reasoning becomes non-local
  - It prevents horizontal scaling, because per-operation consistency levels pin the entire keyspace to
    a single coordinating node
  - It forces linearizability on every read and write, removing the ability to opt into cheaper eventual
    reads anywhere in the system
  answer: 1
  explanation: |
    Flexibility moves the burden to developers: choosing the wrong CL (e.g., read ONE after
    write ONE) is a subtle correctness bug, and the reasoning is spread across the codebase.
    It does not slow every query, block scaling, or force linearizability.
  ref: concepts.md#tunable-consistency-dynamo-and-cassandra-style
- id: cap-theorem-and-consistency-051
  difficulty: expert
  tags:
  - tunable-consistency
  - lwt
  - paxos
  question: |
    A Cassandra table needs a genuinely linearizable compare-and-set (e.g., "claim this
    unique username only if unclaimed"). Why is QUORUM/QUORUM insufficient, and what is
    the correct mechanism plus its cost?
  options:
  - QUORUM/QUORUM is fully sufficient for linearizable compare-and-set; no change is needed because the
    read/write overlap already serializes concurrent claims
  - Switch the username column to LWW timestamp resolution, letting the write with the highest timestamp
    win the claim deterministically
  - QUORUM is not linearizable for concurrent CAS; use Lightweight Transactions (LWT) which run Paxos,
    at the cost of roughly 4 round trips and much higher latency
  - Increase the replication factor to 9 so the larger quorum overlap forces linearizable compare-and-set
    on concurrent username claims
  answer: 2
  explanation: |
    Quorum reads/writes don't linearize concurrent compare-and-set; Cassandra's LWT uses
    Paxos to provide true linearizable CAS, costing ~4 round trips (high latency). LWW would
    lose a competing claim; raising RF doesn't add linearizability.
  ref: concepts.md#tunable-consistency-dynamo-and-cassandra-style
- id: cap-theorem-and-consistency-052
  difficulty: advanced
  tags:
  - tunable-consistency
  - multi-region
  - each-quorum
  question: |
    A workload requires that every write be durably acknowledged by a quorum in BOTH
    datacenters before returning. Which Cassandra consistency level matches, and what is
    the cost?
  options:
  - LOCAL_ONE; cost is possible data loss because the write is acknowledged after a single local replica
    stores it and never reaches the other datacenter synchronously
  - ONE; cost is effectively nothing, since a single acknowledgement anywhere in the cluster already satisfies
    the both-datacenters durability requirement
  - LOCAL_QUORUM; cost is effectively nothing, because a quorum in the local datacenter is automatically
    mirrored as a quorum in the remote one
  - EACH_QUORUM; cost is cross-region round-trip latency and reduced availability (a single DC losing
    quorum blocks writes)
  answer: 3
  explanation: |
    EACH_QUORUM requires a quorum in every DC, giving strong cross-region durability at the
    cost of cross-region latency and lower availability. LOCAL_ONE/ONE/LOCAL_QUORUM do not
    require a quorum in every DC.
  ref: concepts.md#tunable-consistency-dynamo-and-cassandra-style
- id: cap-theorem-and-consistency-053
  difficulty: beginner
  tags:
  - choosing-consistency
  - banking
  question: |
    For a bank's core money-transfer ledger, which consistency posture is most appropriate?
  options:
  - Strong consistency (strict serializability / CP), accepting higher latency and write failures during
    partitions to prevent lost or double-spent money
  - Eventual consistency for maximum availability, letting balances converge in the background and accepting
    brief windows where a debit may not yet be visible everywhere
  - Causal consistency only, ordering each account's operations by happens-before while leaving concurrent
    transfers to different accounts unordered
  - No consistency guarantees during writes at all, relying on a nightly batch reconciliation job to detect
    and correct any lost or double-spent money
  answer: 0
  explanation: |
    Money movement cannot tolerate lost/double writes, so strong/strict-serializable CP is
    correct despite the latency and partition-time availability cost. Eventual/causal/no
    guarantees risk incorrect balances.
  ref: concepts.md#choosing-consistency-banking-feed-cache-and-more
- id: cap-theorem-and-consistency-054
  difficulty: beginner
  tags:
  - choosing-consistency
  - feed
  question: |
    For a social media "like count" and timeline feed at massive scale, which posture is
    usually best?
  options:
  - Strict serializability for every like, running each increment as a real-time-ordered transaction so
    the count is exact at every instant
  - Eventual consistency (AP), since a like count briefly off by a few is harmless and availability/latency
    dominate
  - Linearizable reads from a single global leader, funneling every like and every timeline fetch through
    one authoritative region
  - Two-phase commit across all regions on each like, so every replica agrees on the new count before the
    write returns
  answer: 1
  explanation: |
    Feeds/like counts are human-tolerant, so eventual/AP maximizes availability and latency
    at scale. Strong consistency, a single global leader, or 2PC would add cost and hurt
    availability for no real benefit here.
  ref: concepts.md#choosing-consistency-banking-feed-cache-and-more
- id: cap-theorem-and-consistency-055
  difficulty: intermediate
  tags:
  - choosing-consistency
  - cache
  question: |
    Which statement about consistency and caches is correct?
  options:
  - A cache should always be treated as the strongly consistent source of truth, with the backing database
    kept only as a cold backup that is read exclusively on a cache miss
  - Caches guarantee linearizability by default, because every read and write is funneled through a single
    in-memory node that serializes all operations strictly in their arrival order
  - Caches are intentionally eventually consistent; the design work is the invalidation/expiry strategy
    and tolerating the staleness window — never treat a cache as the source of truth for strong data
  - Caches make eventual consistency impossible, since a cached entry must be invalidated synchronously
    across every replica before any subsequent write is permitted to return to the client
  answer: 2
  explanation: |
    Caches are stale by design; you manage TTL/invalidation and accept a staleness window,
    and you never use them as the authoritative store for strongly-consistent data. They
    don't provide linearizability or prevent eventual consistency.
  ref: concepts.md#choosing-consistency-banking-feed-cache-and-more
- id: cap-theorem-and-consistency-056
  difficulty: advanced
  tags:
  - choosing-consistency
  - inventory
  - scenario
  question: |
    A ticketing site sells limited-seat events and must avoid overselling. Which design for
    the seat-decrement operation is most appropriate?
  options:
  - Eventual consistency with last-write-wins on the seat count for maximum availability, letting concurrent
    regional decrements converge in the background and reconciling any oversell after the sale closes
  - Cache the seat count with a 60s TTL and decrement in the cache, flushing the running total back to the
    durable store asynchronously once the TTL window expires or the entry is evicted
  - Use causal consistency on the seat count so each buyer's decrement is ordered after the reads they
    observed, while concurrent decrements from different buyers are allowed to apply in any order
  - A strongly consistent conditional decrement (e.g., DynamoDB conditional UpdateItem or a consensus-backed
    CAS) on the critical count, with eventual consistency acceptable for the browse/catalog view
  answer: 3
  explanation: |
    Overselling is a real cost, so the decrement needs a strongly consistent conditional
    write/CAS; the non-critical catalog view can be eventual. LWW/cache-TTL/causal on the
    count all permit concurrent oversell.
  ref: concepts.md#choosing-consistency-banking-feed-cache-and-more
- id: cap-theorem-and-consistency-057
  difficulty: intermediate
  tags:
  - choosing-consistency
  - messaging
  question: |
    For a chat application, what consistency requirement best matches the domain?
  options:
  - Causal ordering within each conversation (messages appear in cause-effect order) plus read-your-writes
    so the sender sees their own message; different conversations are independent
  - Global linearizability across all conversations, so every participant everywhere observes one single
    real-time-ordered stream that interleaves the messages of every unrelated chat room together
  - Eventual consistency with no ordering at all, letting each device display messages in whatever arrival
    order it happens to receive them and relying on the user to mentally re-sort the conversation
  - Strict serializability across the entire message store, running every send as a globally serialized
    transaction so that no two messages anywhere can ever commit in overlapping real time
  answer: 0
  explanation: |
    Chat needs per-conversation causal order and read-your-writes for the sender, while
    separate conversations are independent — no need for global linearizability or
    store-wide strict serializability, and pure unordered eventual would jumble messages.
  ref: concepts.md#choosing-consistency-banking-feed-cache-and-more
- id: cap-theorem-and-consistency-058
  difficulty: intermediate
  tags:
  - choosing-consistency
  - config
  - consensus
  question: |
    Why are service discovery, distributed locks, and leader election classic use cases for
    linearizable, CP stores like etcd/ZooKeeper?
  options:
  - Because they involve huge multi-terabyte data volumes that must be horizontally sharded across hundreds
    of nodes, which only a linearizable CP store like etcd or ZooKeeper is able to coordinate
  - Because they are small, low-write-rate, critical state where a stale read or two simultaneous leaders
    (split-brain) is catastrophic
  - Because they require sub-millisecond globally-replicated writes that only a synchronous consensus quorum
    spanning every region can deliver reliably at that latency
  - Because eventual consistency is explicitly forbidden by configuration-management standards, which mandate
    a linearizable CP store for any shared cluster coordination data
  answer: 1
  explanation: |
    These are small, critical control-plane states where correctness (no split-brain, no
    stale config) outweighs the coordination cost — the textbook consensus use case. They
    are not high-volume, don't need sub-ms global writes, and eventual consistency is a
    choice not a legal matter.
  ref: concepts.md#choosing-consistency-banking-feed-cache-and-more
- id: cap-theorem-and-consistency-059
  difficulty: advanced
  tags:
  - choosing-consistency
  - cqrs
  - modern
  question: |
    In a CQRS architecture, what consistency trade-off are you explicitly accepting?
  options:
  - That writes become eventually consistent while reads are strongly consistent, because each command is
    queued and applied asynchronously behind synchronously-served linearizable query projections
  - That you can no longer use a relational database at all, since CQRS mandates an append-only event log
    as the only permitted primary store for both the command and query sides
  - That the read model (materialized projections) is eventually consistent relative to the write model,
    in exchange for independently scalable, optimized reads
  - That all queries must go through the write model, funneling every read back through the same command
    handlers and transaction boundary that process the writes
  answer: 2
  explanation: |
    CQRS separates write and read models; the read-side projections lag (eventual
    consistency) but can be scaled and shaped independently. The write model can stay
    strongly consistent — the reverse of option 0 — and reads bypass it by design.
  ref: concepts.md#choosing-consistency-banking-feed-cache-and-more
- id: cap-theorem-and-consistency-060
  difficulty: advanced
  tags:
  - choosing-consistency
  - outbox
  - cdc
  - modern
  question: |
    A service must update its database AND publish an event to Kafka. To avoid the
    dual-write inconsistency (DB commits but event publish fails, or vice versa), which
    pattern is correct?
  options:
  - Publish to Kafka first, then write to the DB, and roll back the already-delivered event by emitting a
    compensating tombstone message if the subsequent database commit happens to fail
  - Use last-write-wins timestamps to reconcile the DB and Kafka later, letting a background job compare the
    two systems and replay whichever side holds the newer version of each record
  - Wrap the DB write and Kafka publish in a distributed two-phase commit across both systems for every
    request
  - 'The transactional outbox pattern: write the event to an outbox table in the SAME DB transaction as
    the state change, then a relay/CDC process publishes it asynchronously'
  answer: 3
  explanation: |
    The outbox pattern makes the event and the state change atomic within one DB transaction,
    then a relay (often via CDC) publishes reliably — trading a little latency for
    consistency. Ordering the two writes and hoping (option 0) is the exact bug; LWW can't
    fix a missing event; cross-system 2PC is heavy and brittle.
  ref: concepts.md#choosing-consistency-banking-feed-cache-and-more
- id: cap-theorem-and-consistency-061
  difficulty: expert
  tags:
  - choosing-consistency
  - event-sourcing
  - banking
  - modern
  question: |
    A modern payments platform wants an auditable ledger, safe retries, and scalable
    reporting. Which combination best balances correctness and scale?
  options:
  - Event-sourced append-only ledger behind a strongly-consistent core (e.g., Spanner/CockroachDB) with
    idempotency keys for safe retries, and eventually-consistent derived read/reporting views updated
    via CDC
  - Store the entire ledger and every reporting query in one eventually consistent Cassandra table using
    last-write-wins, relying on a nightly repair job to reconcile any balances that diverged
  - A single Raft group holding all ledger and reporting data with strict serializability for every read
    and every analytical scan, funneling all reporting traffic through the one consensus leader
  - Cache the ledger in Redis and treat the cache as the source of truth, persisting to a durable store
    only as an occasional asynchronous snapshot taken when the cache node is idle
  answer: 0
  explanation: |
    The strong pattern: immutable event-sourced ledger on a strongly-consistent core,
    idempotency keys for retry safety, and eventual derived views via CDC for reporting
    scale. LWW risks lost money; one Raft group for everything bottlenecks and over-costs
    reporting; a cache is not a ledger source of truth.
  ref: concepts.md#choosing-consistency-banking-feed-cache-and-more
- id: cap-theorem-and-consistency-062
  difficulty: advanced
  tags:
  - choosing-consistency
  - cell-based
  - modern
  question: |
    In a cell-based architecture, how is consistency typically handled to bound blast radius?
  options:
  - Global strong consistency across all cells for every operation, running one cluster-wide synchronous
    quorum that every cell must join before any write in any cell can be acknowledged
  - Strong consistency within a cell and eventual consistency across cells, limiting the scope where expensive
    coordination is needed and containing failures
  - No consistency guarantees anywhere, letting every cell accept conflicting writes freely and leaving all
    reconciliation entirely to the client applications reading from them
  - Every cell shares one global leader that serializes all writes for the whole fleet, so a failure of
    that leader stalls coordination across every cell simultaneously
  answer: 1
  explanation: |
    Cells isolate failure domains: keep coordination (strong consistency) within a cell and
    go eventual across cells, bounding both blast radius and coordination cost. Global strong
    consistency or one shared leader defeats the isolation goal.
  ref: concepts.md#choosing-consistency-banking-feed-cache-and-more
- id: cap-theorem-and-consistency-063
  difficulty: expert
  tags:
  - choosing-consistency
  - rag
  - vector-db
  - modern
  question: |
    A RAG system serves globally-replicated vector-DB reads for LLM context. What is the
    inherent consistency trade-off you are managing?
  options:
  - Linearizability of embeddings across regions on every write, so each newly indexed vector is visible to
    every region's similarity search the instant the write returns to the ingesting client
  - Strict serializability of all similarity queries, running each nearest-neighbor lookup as a globally
    real-time-ordered transaction against a single serialized view of the entire index
  - Embeddings/index replicas are eventually consistent; you accept index/embedding lag (stale retrieval
    context) in exchange for low-latency global reads
  - That vector databases cannot be replicated at all and must run as a single authoritative node, forcing
    every region's retrieval request to cross the network to that one instance
  answer: 2
  explanation: |
    Globally replicated embedding indexes are eventually consistent; the managed trade-off is
    retrieval staleness/lag versus low-latency global reads. Similarity search does not
    require linearizability or strict serializability, and vector DBs can be replicated.
  ref: concepts.md#choosing-consistency-banking-feed-cache-and-more
- id: cap-theorem-and-consistency-064
  difficulty: intermediate
  tags:
  - trade-offs
  - decision-guide
  question: |
    According to the trade-off heuristic, which single question most directly decides
    whether a data class should be strong/CP versus eventual/AP?
  options:
  - How many engineers are on the team, since a larger headcount is what unlocks the operational capacity
    to run a strongly consistent CP store rather than a simpler eventual one?
  - Which cloud provider is used, given that each provider's managed databases fix the consistency posture
    and effectively make the strong-versus-eventual decision for you?
  - What programming language the service is written in, because a language's concurrency and memory model
    dictates whether it can safely consume strong versus eventual reads?
  - What is the cost of a stale or lost read/write — high cost pushes toward strong/CP, low cost toward
    eventual/AP?
  answer: 3
  explanation: |
    The core question is the business cost of staleness/loss: high -> strong/CP, low ->
    eventual/AP. Team size, cloud provider, and language do not determine the consistency
    requirement.
  ref: concepts.md#trade-offs-and-when-to-use-what
- id: cap-theorem-and-consistency-065
  difficulty: advanced
  tags:
  - trade-offs
  - axes
  question: |
    "During a partition you cannot have both, and even without a partition stronger
    reads/writes cost round trips." This sentence combines which two trade-off axes?
  options:
  - Consistency-vs-Availability (CAP partition branch) and Consistency-vs-Latency (PACELC else branch)
  - Durability-vs-Cost (the partition branch) and Simplicity-vs-Flexibility (the normal-operation branch)
  - Throughput-vs-Storage (during a partition) and Security-vs-Latency (during normal operation)
  - Consistency-vs-Storage (the partition branch) and Availability-vs-CPU (the normal-operation branch)
  answer: 0
  explanation: |
    The first clause is CAP's C-vs-A during partition; the second is PACELC's C-vs-L in
    normal operation. The other pairings mix unrelated or non-standard axes.
  ref: concepts.md#trade-offs-and-when-to-use-what
- id: cap-theorem-and-consistency-066
  difficulty: expert
  tags:
  - trade-offs
  - synthesis
  - judgment
  question: |
    An interviewer asks for your overall philosophy on consistency for a large product.
    Which answer demonstrates the strongest senior judgment?
  options:
  - Make the whole system uniformly CP so it is always correct, routing every read and write — even likes,
    view counts, and feed items — through a single synchronous consensus quorum for guaranteed correctness
  - 'Decompose by data class: keep the small critical core strongly consistent (CP/consensus), make the
    large tolerant surface eventually consistent (AP) with session guarantees for UX, use CRDTs where
    conflicts auto-merge and transactions where they can''t, and name the latency/availability price of
    each'
  - Make the whole system uniformly AP so it is always fast and available, serving even money movement and
    unique-constraint claims from eventually consistent replicas and reconciling any conflicts afterward
  - Pick whichever database is currently most popular and apply its out-of-the-box default consistency level
    uniformly everywhere, letting the vendor's defaults stand in for any per-data-class design decision
  answer: 1
  explanation: |
    The senior answer decomposes by data class and matches each to the right point on the
    spectrum, explicitly stating trade-offs. Blanket CP or AP ignores that different data
    have different needs, and following defaults abdicates the design decision.
  ref: concepts.md#trade-offs-and-when-to-use-what
- id: cap-theorem-and-consistency-067
  difficulty: intermediate
  tags:
  - trade-offs
  - coordination-throughput
  question: |
    Why does the "Coordination-vs-Throughput" axis favor leaderless/eventual designs for
    extreme write scale?
  options:
  - Because leaderless systems never lose data, since every write is synchronously mirrored to all replicas
    before acknowledgement, which is precisely what lets them absorb extreme write volume
  - Because eventual consistency uses less disk per record, and that smaller storage footprint is what
    directly raises the sustainable write throughput of a leaderless cluster
  - Because leaders and quorums funnel writes through a coordination point that bottlenecks throughput,
    whereas leaderless/eventual designs let any node accept writes and scale flatter
  - Because running a formal consensus protocol is disallowed above a certain cluster size, forcing any
    high-scale write path onto a leaderless eventual design by rule
  answer: 2
  explanation: |
    Coordination points (leaders, quorums) cap throughput; leaderless writes parallelize
    across nodes, scaling more flatly. This is about the coordination bottleneck, not data
    loss, disk usage, or legality.
  ref: concepts.md#trade-offs-and-when-to-use-what
- id: cap-theorem-and-consistency-068
  difficulty: beginner
  tags:
  - linearizability
  - definitions
  question: |
    Linearizability is best summarized as which of the following?
  options:
  - Multi-object transactions produce a result equal to some serial order of those transactions, though
    that order need not line up with the real wall-clock time at which they actually executed
  - Replicas eventually converge to the same value once writes stop, with no promise about recency or
    ordering during the window while updates are still propagating between nodes
  - Causally related operations are ordered consistently for every observer, while operations with no
    causal link may be seen in different orders by different replicas
  - Each operation appears to take effect atomically at a single instant between its start and completion,
    consistent with real (wall-clock) time
  answer: 3
  explanation: |
    Linearizability is the single-object real-time atomicity guarantee. The distractors
    describe serializability, eventual consistency, and causal consistency respectively.
  ref: concepts.md#linearizability-versus-serializability
- id: cap-theorem-and-consistency-069
  difficulty: intermediate
  tags:
  - quorum
  - estimation
  - quant
  question: |
    You need to tolerate the failure of any single replica for BOTH reads and writes while
    keeping R + W > N with N = 3. Which R and W values are the minimal balanced choice?
  options:
  - R = 2, W = 2
  - R = 1, W = 1
  - R = 3, W = 3
  - R = 1, W = 3
  answer: 0
  explanation: |
    With N=3, R=W=2 gives R+W=4>3 (overlap) and tolerates any one replica being down for both
    reads and writes. R=W=1 fails the overlap; R=W=3 or W=3 cannot tolerate a single failure
    for the operation requiring all 3.
  ref: concepts.md#quorums-n-r-w-and-r-plus-w-greater-than-n
- id: cap-theorem-and-consistency-070
  difficulty: advanced
  tags:
  - cap
  - scenario
  - degradation
  question: |
    A CP inventory service and an AP recommendations service both run in a datacenter that
    gets network-isolated from the rest of the fleet. What happens to each, and why is this
    an acceptable design?
  options:
  - Both services keep serving reads and writes exactly as normal, because a network isolation inside one
    datacenter never affects consistency and the partition therefore has no observable effect on either
  - The CP inventory rejects writes (unavailable) to avoid overselling, while the AP recommendations keep
    serving possibly-stale suggestions — acceptable because correctness matters for inventory but staleness
    is harmless for recommendations
  - Both services immediately stop serving all reads and writes to be safe, because any partition forces a
    fail-closed posture on every service in the affected datacenter regardless of its CAP classification
  - The AP recommendations service rejects writes to stay correct while the CP inventory service keeps
    serving possibly-stale reads and writes to remain available through the partition
  answer: 1
  explanation: |
    Correct CAP-aware degradation: CP inventory sacrifices availability to protect
    correctness; AP recommendations sacrifice freshness to stay available. This matches each
    service's tolerance. Option 3 inverts CP/AP behavior.
  ref: concepts.md#cap-theorem-fundamentals
- id: cap-theorem-and-consistency-071
  difficulty: expert
  tags:
  - session-guarantees
  - feed
  - design-judgment
  question: |
    On an eventually consistent social feed, the author must instantly see their own new
    post but other users can tolerate a short delay. Which implementation best achieves this
    with minimal added coordination?
  options:
  - Make all feed reads linearizable by routing every fetch through a single global leader, so the author
    and every other reader worldwide observe each new post at the same real-time instant it commits
  - Use strict serializability for the entire feed table, running every post insertion and every timeline
    read as a globally real-time-ordered transaction across all regions
  - Provide read-your-writes only for the author (e.g., sticky-route the author to a replica that has
    their write, or serve the author's own post from their local cache), while everyone else reads eventually
  - Disable caching everywhere so that all feed reads, from the author and every other user alike, bypass
    the replicas and hit the primary directly for guaranteed freshness
  answer: 2
  explanation: |
    Scoping read-your-writes to the author (sticky routing or local write-through) gives the
    needed UX at minimal cost while others stay eventual. Global linearizability, strict
    serializability, or forcing all reads to the primary over-coordinate and hurt scale.
  ref: concepts.md#session-and-client-centric-consistency-guarantees
- id: cap-theorem-and-consistency-072
  difficulty: intermediate
  tags:
  - conflict-resolution
  - comparison
  - design-judgment
  question: |
    Two replicas concurrently modify a collaborative document and a shopping cart. For BOTH,
    you must never lose a user's concurrent change and want automatic convergence without
    app-side merge code. Which approach fits best?
  options:
  - Last-write-wins timestamps on both, keeping only the edit with the highest clock value on each key so
    the two replicas deterministically converge to a single surviving version
  - A single global leader with two-phase commit on every keystroke and every cart mutation, so all replicas
    agree on each change synchronously before it becomes visible to any user
  - Vector clocks that detect concurrency and surface the conflicting siblings for the application's own
    merge code to reconcile whenever two replicas diverge on the same key
  - CRDTs (e.g., a sequence CRDT for the document and an OR-Set for the cart), which auto-merge without
    coordination and without losing concurrent changes
  answer: 3
  explanation: |
    CRDTs auto-converge without lost updates or manual merge code — ideal for collaborative
    docs and carts. LWW loses concurrent edits; a global leader with per-keystroke 2PC is
    unusably slow; vector clocks still require app-side merge (the thing we wanted to avoid).
  ref: concepts.md#conflict-resolution-lww-vector-clocks-crdts
- id: cap-theorem-and-consistency-073
  difficulty: beginner
  tags:
  - consensus
  - raft
  - leader
  question: |
    In Raft, how does a write get committed on the happy path?
  options:
  - The leader appends the entry to its log, replicates it to followers via AppendEntries, and commits
    once a majority (including itself) has stored it
  - Any follower that receives an AppendEntries can commit the write independently once its own log fsync
    completes, without waiting on the leader or a majority
  - The client broadcasts the write directly to all replicas simultaneously and treats it as committed as
    soon as the single fastest replica acknowledges receipt
  - A random node is chosen as the accept-coordinator for each individual write, so leadership rotates on
    every entry to spread the write load evenly
  answer: 0
  explanation: |
    Raft routes writes through the leader, which replicates to followers and commits after a
    majority stores the entry. Followers don't commit independently, clients don't write to
    all replicas directly, and there's no per-write random node.
  ref: concepts.md#consensus-paxos-and-raft-intuition
- id: cap-theorem-and-consistency-074
  difficulty: advanced
  tags:
  - pacelc
  - cassandra
  - trade-offs
  - scenario
  question: |
    Your Cassandra-backed service reads at LOCAL_ONE and writes at LOCAL_ONE for speed, but
    users intermittently fail to see data they just wrote. Under PACELC framing, what is
    happening and what is the minimal fix?
  options:
  - The cluster is silently partitioned between the two racks, and because Cassandra fails closed under
    partition there is nothing an operator can change until the network heals on its own
  - You chose EL (latency over consistency) so a read at ONE can miss a write acknowledged at ONE; the
    minimal fix is to make R+W>N for that path (e.g., write and read at LOCAL_QUORUM) or route the user's
    read to reflect their write
  - You must migrate the whole database to Google Spanner, since only a TrueTime-backed store can ever
    return a write immediately after it is acknowledged
  - Increase the replication factor from 3 to 5 without touching the LOCAL_ONE consistency levels, so the
    extra replicas make the just-written value available on the read path
  answer: 1
  explanation: |
    LOCAL_ONE/LOCAL_ONE is the EL (latency) choice and doesn't satisfy R+W>N, so reads can
    miss recent writes even without a partition. Raising both to LOCAL_QUORUM (or providing
    read-your-writes routing) fixes the specific path. Migrating to Spanner is overkill, and
    raising RF alone without changing CLs doesn't guarantee overlap.
  ref: concepts.md#pacelc-theorem
- id: cap-theorem-and-consistency-075
  difficulty: expert
  tags:
  - linearizability
  - serializability
  - design-judgment
  - banking
  question: |
    A global bank wants transfers to be correct even across regions and wants an external
    observer to never see a later transfer commit before an earlier one that finished first.
    Which guarantee is required, and which real system exemplifies providing it?
  options:
  - Snapshot isolation, which already forbids any transaction from observing a commit ordering that
    contradicts wall-clock time; exemplified by default PostgreSQL REPEATABLE READ
  - Causal consistency, which orders each transfer after the reads that influenced it across regions;
    exemplified by a Cassandra QUORUM read/write path
  - Strict serializability (serializability + real-time order); exemplified by Google Spanner's external
    consistency using TrueTime
  - Eventual consistency, which converges every region to the same balances once transfers stop;
    exemplified by DynamoDB global tables
  answer: 2
  explanation: |
    Needing multi-object transaction isolation AND real-time ordering across regions is
    exactly strict serializability, which Spanner provides via TrueTime. Snapshot isolation
    allows write skew and no real-time order; causal/eventual are far too weak for money
    movement.
  ref: concepts.md#linearizability-versus-serializability
- id: cap-theorem-and-consistency-076
  difficulty: advanced
  tags:
  - sequential-consistency
  - hierarchy
  - definitions
  question: |
    What precisely distinguishes sequential consistency from linearizability?
  options:
  - Sequential consistency requires a single total order that respects each client's program order but
    NOT real (wall-clock) time across clients; linearizability additionally requires that order to respect
    real time
  - Sequential consistency is weaker than eventual consistency because it discards per-client program
    order entirely, allowing a client's own writes to be reordered before they converge
  - Sequential consistency allows different replicas to observe concurrent operations in different orders,
    whereas linearizability forces one order
  - They are identical guarantees; "sequential consistency" is simply the older Lamport-era name that the
    literature later rebranded as linearizability
  answer: 0
  explanation: |
    Both give a single agreed total order respecting per-client program order; only linearizability adds
    the real-time constraint (an op that finished before another began must precede it). Allowing different
    replicas to disagree on concurrent-op order is causal, not sequential; and sequential is stronger than
    eventual, not weaker.
  ref: concepts.md#sequential-consistency-and-the-model-hierarchy
- id: cap-theorem-and-consistency-077
  difficulty: advanced
  tags:
  - sequential-consistency
  - causal
  - hierarchy
  question: |
    Ordering the four single-object models from strongest to weakest, which sequence is correct?
  options:
  - Linearizable, Sequential, Causal, Eventual
  - Causal, Linearizable, Sequential, Eventual
  - Sequential, Linearizable, Eventual, Causal
  - Linearizable, Causal, Sequential, Eventual
  answer: 0
  explanation: |
    The ladder is Linearizable (single order + real time) > Sequential (single order, no real time) >
    Causal (only causal order, concurrent ops may differ per replica) > Eventual (convergence only). Causal
    sits below sequential because it abandons the single global total order.
  ref: concepts.md#sequential-consistency-and-the-model-hierarchy
- id: cap-theorem-and-consistency-078
  difficulty: expert
  tags:
  - sequential-consistency
  - design-judgment
  - trade-offs
  question: |
    Why do real distributed databases rarely target sequential consistency as their headline guarantee?
  options:
  - Because sequential consistency is provably impossible to implement on any asynchronous network, being
    ruled out by the same FLP result that forbids deterministic consensus
  - Because it is strictly weaker than eventual consistency and therefore useless — it converges more
    slowly while offering none of eventual consistency's availability under partition
  - Because it still needs a single global total order (so it is a CP-class model, unavailable under partition)
    yet lacks the real-time recency that makes linearizability useful for locks and leader election —
    most of the cost with less of the benefit
  - Because sequential consistency can only be achieved with TrueTime-style atomic clocks and GPS
    receivers in every datacenter, which most operators are unwilling to deploy
  answer: 2
  explanation: |
    Sequential consistency pays the coordination cost of a global total order (CP-class, blocks under partition)
    without delivering real-time recency, so systems pick linearizable for the critical core or causal/eventual
    for the available surface and skip the middle. It is stronger than eventual and needs no atomic clocks.
  ref: concepts.md#sequential-consistency-and-the-model-hierarchy
- id: cap-theorem-and-consistency-079
  difficulty: expert
  tags:
  - testing
  - linearizability
  - jepsen
  question: |
    A Jepsen-style checker records each operation's invocation and response wall-clock times and searches
    for a valid ordering. What history most clearly proves a linearizability violation?
  options:
  - A read returns a value written by a concurrent (still in-flight) write whose response had not yet been
    delivered when the read was invoked, so their operation intervals overlap in the recorded history
  - Replicas still disagree immediately after a write completes, before the asynchronous propagation of
    that value to every follower has finished converging across the cluster
  - Two clients each observe two concurrent (interval-overlapping) writes in the opposite relative order
    from one another, with no completed-before edge linking the two writes
  - A read returns a value that was already overwritten by a write which COMPLETED before the read began
    (a stale read that no valid real-time-respecting order can explain)
  answer: 3
  explanation: |
    Linearizability is violated when a read returns a value older than a write that fully completed before
    the read started — no point-in-interval ordering can explain it. Reading an in-flight concurrent write
    is allowed; disagreeing on concurrent-write order is a sequential/causal concern; transient replica
    disagreement is normal and only bears on eventual consistency after quiescence.
  ref: concepts.md#testing-and-violating-consistency-models
- id: cap-theorem-and-consistency-080
  difficulty: advanced
  tags:
  - testing
  - eventual-consistency
  - safety-liveness
  question: |
    Why is eventual consistency described as impossible to "violate" within a bounded, finite execution?
  options:
  - Because eventual consistency is actually a strong safety property that a checker evaluates on every
    single read, flagging any stale value the instant it is returned to a client
  - Because it is a liveness property (convergence only guaranteed after writes stop); in any finite prefix
    replicas are allowed to disagree, so non-convergence can only be observed after quiescence
  - Because eventually consistent systems never actually diverge in practice, since each write is applied
    to every replica synchronously the moment the coordinator receives it
  - Because bounded finite histories are always too short for any linearizability or convergence checker
    to explore the full space of valid orderings before it times out
  answer: 1
  explanation: |
    Eventual consistency is a liveness guarantee: it only promises convergence given quiescence, so temporary
    disagreement in any finite prefix is permitted, not a violation. You can only observe a problem by stopping
    writes, waiting, and seeing persistent divergence. Divergence itself is normal; the length of the history
    is not the reason.
  ref: concepts.md#testing-and-violating-consistency-models
- id: cap-theorem-and-consistency-081
  difficulty: advanced
  tags:
  - testing
  - anomalies
  - linearizability
  - serializability
  question: |
    An interviewer asks how you would tell whether a bug is a linearizability failure or a serializability
    failure. What is the sharpest distinguishing signal?
  options:
  - A linearizability failure shows up as a stale or reordered read of a SINGLE object; a serializability
    failure shows up as a cross-object anomaly like write skew, lost update, or a phantom
  - Both always manifest as the exact same stale-read signature in a recorded history, so no checker can
    ever distinguish a linearizability failure from a serializability failure after the fact
  - A linearizability failure only appears under partition; a serializability failure only appears in
    steady state
  - Serializability failures affect single-key reads and writes, while linearizability failures affect
    only multi-object transactions that span more than one key
  answer: 0
  explanation: |
    Linearizability is single-object real-time recency, so its failures are stale/reordered single-key reads;
    serializability is multi-object isolation, so its failures are cross-object anomalies (write skew, lost
    update, phantom). The last option inverts the scopes; the failures are distinguishable and not tied to
    partition-vs-steady-state.
  ref: concepts.md#testing-and-violating-consistency-models
- id: cap-theorem-and-consistency-082
  difficulty: advanced
  tags:
  - anti-entropy
  - read-repair
  - limitations
  question: |
    A team relies solely on read repair to keep an eventually consistent store converged. What data will
    silently stay divergent, and what mechanism is needed to fix it?
  options:
  - Cold keys that are rarely or never read never get repaired by read repair; background anti-entropy
    repair (e.g., Merkle-tree comparison / nodetool repair) is needed to converge them
  - Hot, frequently-read keys are the ones that silently stay divergent; adding a larger read cache in
    front of the store closes the gap by absorbing the repeated reads
  - Every key diverges at the same steady rate regardless of read frequency, so only raising the read and
    write consistency levels to QUORUM can bring them back into agreement
  - Only keys that were written during an active partition can diverge, and hinted handoff always replays
    those missed writes in full once the downed replica rejoins the ring
  answer: 0
  explanation: |
    Read repair only fixes keys that are actually read, so cold data can stay stale indefinitely; scheduled
    anti-entropy repair using Merkle trees is the backstop that guarantees convergence. Hinted handoff helps
    only during short outages (and hints expire), so it is not a complete substitute.
  ref: concepts.md#anti-entropy-read-repair-hinted-handoff-merkle-trees
- id: cap-theorem-and-consistency-083
  difficulty: expert
  tags:
  - anti-entropy
  - hinted-handoff
  - gotcha
  question: |
    In Cassandra, a replica node is down for 8 hours (well past the default hint window). When it returns,
    why might it still hold stale data, and what closes the gap?
  options:
  - Hinted handoff durably queues and replays every missed write regardless of how long the node was down,
    so a returning replica is always fully caught up and no gap can exist
  - Read repair instantly reconciles the entire keyspace on the returning node the moment it rejoins the
    ring, comparing all of its stored data against the other replicas in one sweep
  - Hints have a bounded TTL (e.g., max_hint_window_ms, ~3h by default); hints generated after that window
    are dropped, so the node stays divergent until an anti-entropy repair (Merkle-tree comparison) reconciles
    it
  - The node must be decommissioned and streamed a full copy of every partition it owns from scratch,
    because Cassandra provides no incremental mechanism to reconcile a long-absent replica
  answer: 2
  explanation: |
    Hints are only retained for a bounded window; a node down longer than that loses coverage and must be
    reconciled by scheduled anti-entropy repair. Read repair only touches keys that get read, and a full
    rebuild is not required because Merkle-tree repair transfers only divergent ranges.
  ref: concepts.md#anti-entropy-read-repair-hinted-handoff-merkle-trees
- id: cap-theorem-and-consistency-084
  difficulty: advanced
  tags:
  - anti-entropy
  - merkle-trees
  - efficiency
  question: |
    Why do Dynamo-style systems compare Merkle (hash) trees to synchronize two replicas instead of scanning
    and shipping the full dataset?
  options:
  - Because the Merkle tree encrypts each range with its hash during transfer, so replicas can exchange
    data over untrusted links without a separate TLS layer protecting the replication stream
  - Because computing a hash over the whole dataset is inherently faster than reading those same bytes off
    disk, so the tree lets a replica skip the expensive full scan entirely
  - Because building the Merkle tree over a range promotes every key in that range to strong consistency,
    so a matching root hash certifies the two replicas are linearizable
  - Because matching root hashes prove entire ranges are identical with no transfer, and mismatches let
    the replicas recurse only into differing subtrees — locating differences in about O(log N) hash exchanges
    and shipping only the divergent leaves
  answer: 3
  explanation: |
    The point of a Merkle tree is efficient difference-location: equal root hashes short-circuit with zero
    data shipped, and recursion descends only into mismatched subtrees, so you compare O(log N) hashes and
    transfer only what diverged. It is not about encryption, does not confer strong consistency, and building
    the tree actually requires reading the data (I/O heavy).
  ref: concepts.md#anti-entropy-read-repair-hinted-handoff-merkle-trees
- id: cap-theorem-and-consistency-085
  difficulty: expert
  tags:
  - anti-entropy
  - merkle-trees
  - trade-offs
  question: |
    When tuning Merkle-tree granularity (leaf size) for anti-entropy repair, what is the core trade-off?
  options:
  - Finer leaves always strictly dominate coarser leaves with no downside, since a deeper tree locates
    every difference precisely while somehow shrinking the memory needed to hold all those extra nodes
  - Coarser leaves cover more keys per hash so they use less memory but force transferring larger ranges
    when any single key differs; finer leaves pinpoint differences but cost more memory to hold the tree
  - Leaf size only changes the strength of the hash used to encrypt each range during transfer and has no
    bearing on how many bytes of divergent data actually get shipped between the replicas
  - Leaf size directly determines the cluster's replication factor, so choosing finer leaves forces the
    system to keep more copies of every key across the ring
  answer: 1
  explanation: |
    Granularity trades precision against memory: coarse leaves are cheap in RAM but over-transfer (one changed
    key drags its whole coarse range), while fine leaves localize the diff precisely but require more memory
    for the larger tree. It does not relate to encryption or replication factor, and neither extreme dominates.
  ref: concepts.md#anti-entropy-read-repair-hinted-handoff-merkle-trees
- id: cap-theorem-and-consistency-086
  difficulty: advanced
  tags:
  - crdt
  - g-counter
  - pn-counter
  question: |
    How does a PN-Counter CRDT support both increments and decrements while guaranteeing no lost updates?
  options:
  - It keeps two G-Counters, P (increments) and N (decrements), each merged element-wise by max, and reports
    value = sum(P) - sum(N)
  - It stores a single signed integer per replica and applies last-write-wins by timestamp whenever two
    concurrent increments or decrements collide on the same counter
  - It routes every increment and decrement through a per-counter Raft group so the consensus leader can
    serialize the operations into one agreed order before applying them
  - It keeps only the single most recent delta received from each replica and sums those latest deltas,
    discarding any earlier increments or decrements that replica had reported
  answer: 0
  explanation: |
    A PN-Counter composes two grow-only counters (one for increments, one for decrements), each converging
    via element-wise max, and takes their difference — so no tick is ever lost regardless of order or
    duplication. LWW would lose concurrent updates, and a Raft group defeats the coordination-free goal.
  ref: concepts.md#crdt-types-in-depth-counters-sets-registers
- id: cap-theorem-and-consistency-087
  difficulty: expert
  tags:
  - crdt
  - pn-counter
  - inventory
  - gotcha
  question: |
    A team wants to track remaining inventory (must never go below zero) using a PN-Counter CRDT for
    coordination-free decrements across regions. Why is this unsafe, and what is the correct approach?
  options:
  - It is perfectly safe; a PN-Counter automatically clamps its merged value at zero and rejects any
    decrement that would otherwise drive the total negative on any replica
  - The fix is to switch to a G-Counter, which only ever grows and therefore structurally prevents the
    remaining-inventory value from ever dropping below zero
  - A PN-Counter cannot enforce the global invariant "value >= 0" because concurrent decrements on different
    replicas can each look valid locally yet drive the merged total negative; enforcing the bound needs
    an escrow/bounded counter or coordination (single-writer/consensus)
  - The fix is to model the stock as an OR-Set of remaining item tokens, since its add-wins merge will
    keep the set from ever emptying below the reserved floor
  answer: 2
  explanation: |
    CRDTs give strong eventual consistency but cannot enforce a global invariant that requires seeing all
    replicas at once; concurrent decrements can oversell. Non-negativity needs escrow/reservation schemes
    or coordination. A G-Counter only increments, and an OR-Set does not track a numeric bound.
  ref: concepts.md#crdt-types-in-depth-counters-sets-registers
- id: cap-theorem-and-consistency-088
  difficulty: advanced
  tags:
  - crdt
  - or-set
  - 2p-set
  question: |
    Compared with a 2P-Set, what does an OR-Set (Observed-Remove Set) provide that makes it the practical
    choice for collaborative sets?
  options:
  - It guarantees every removal is permanent by tombstoning the element forever, so a removed member can
    never be re-added even if another replica tries to insert it again
  - It requires a central coordinator to arbitrate every removal, funneling delete operations through a
    single node so that no two replicas can disagree about a member's presence
  - It eliminates all per-element metadata overhead, storing each member as a bare value with no tags or
    tombstones, which is what makes it lighter than a 2P-Set
  - It attaches a unique tag per add and removes only observed tags, so an element CAN be re-added after
    removal and concurrent add/remove resolves add-wins - unlike a 2P-Set where a removed element is tombstoned
    forever
  answer: 3
  explanation: |
    The OR-Set tags each add uniquely and removes only observed tags, so re-adding a removed element works and
    concurrent add/remove is add-wins. A 2P-Set's tombstone makes removal permanent (the wrong semantics for
    most apps). OR-Sets do carry tag/tombstone metadata and need no coordinator.
  ref: concepts.md#crdt-types-in-depth-counters-sets-registers
- id: cap-theorem-and-consistency-089
  difficulty: expert
  tags:
  - crdt
  - or-set
  - resurrection
  - gotcha
  question: |
    Two replicas concurrently operate on an OR-Set: replica A removes item X (having observed its add),
    replica B adds X again. After merge, X is present. Is this a bug?
  options:
  - 'Yes, it is a genuine convergence bug: because A and B applied the add and remove in different orders,
    the two replicas will settle on permanently different contents and never agree on whether X is present'
  - 'No, it is the defined add-wins semantics: B''s add carries a tag A''s remove never observed, so it
    survives, and both replicas converge to X-present, though this "resurrection" may surprise users'
  - Yes, OR-Sets are inherently non-deterministic, so the merged result is undefined and depends on the
    arbitrary order in which A's remove and B's add happen to reach each replica
  - No, because OR-Sets resolve every concurrent add/remove as remove-wins, so A's remove suppresses B's
    concurrent re-add and the merged set correctly ends up without X
  answer: 1
  explanation: |
    OR-Sets resolve concurrent add/remove as add-wins: an add tagged with an id the remove never saw survives,
    and both replicas deterministically converge to X-present. It is correct convergence, but the semantics
    can surprise users (the classic resurrected-deleted-item gotcha). OR-Sets are deterministic and do not
    prefer removes.
  ref: concepts.md#crdt-types-in-depth-counters-sets-registers
- id: cap-theorem-and-consistency-090
  difficulty: advanced
  tags:
  - crdt
  - state-based
  - op-based
  question: |
    What is the key operational difference between state-based (CvRDT) and operation-based (CmRDT) CRDTs?
  options:
  - State-based CRDTs require an exactly-once causal-delivery layer to merge safely, while op-based CRDTs
    simply ship their whole state and re-merge, tolerating duplicated and reordered messages
  - State-based CRDTs ship full state and merge via an idempotent/commutative/associative join, tolerating
    duplicate/reordered/lost messages; op-based CRDTs ship operations that must be commutative and delivered
    exactly-once in causal order
  - Op-based CRDTs cannot converge without electing a single leader to totally order every operation before
    broadcasting it, whereas state-based CRDTs merge peer-to-peer with no leader at all
  - There is no operational difference between them; state-based and op-based are interchangeable names for
    the same construction and compile to identical merge logic
  answer: 1
  explanation: |
    State-based CRDTs merge whole states with a semilattice join (idempotent, so robust to re-delivery) at
    higher bandwidth; op-based CRDTs send compact operations but require a reliable exactly-once causal-broadcast
    layer. The first option swaps their properties, and op-based CRDTs need no leader (just causal delivery).
  ref: concepts.md#crdt-types-in-depth-counters-sets-registers
- id: cap-theorem-and-consistency-091
  difficulty: expert
  tags:
  - crdt
  - limitations
  - invariants
  question: |
    Which requirement can CRDTs fundamentally NOT satisfy on their own, forcing you to use consensus or
    single-writer ownership instead?
  options:
  - Enforcing a global invariant that requires observing all replicas at once, such as "usernames are
    globally unique" or "total inventory never negative"
  - Converging a distributed counter without coordination, since a PN-Counter merges each replica's
    counts by element-wise max
  - Merging concurrent set additions without losing any, which an OR-Set handles by tagging every add
    with a unique id
  - Providing strong eventual consistency for collaborative text, which sequence CRDTs such as RGA or
    LSEQ deliver
  answer: 0
  explanation: |
    CRDTs give coordination-free strong eventual consistency but cannot enforce invariants that require a
    global view at decision time (uniqueness, non-negative totals) - those need consensus or a single writer.
    Counters, sets, and sequence editing are exactly what CRDTs do well.
  ref: concepts.md#crdt-types-in-depth-counters-sets-registers
- id: cap-theorem-and-consistency-092
  difficulty: advanced
  tags:
  - crdt
  - lww-register
  - mv-register
  question: |
    For a single-valued field, when would you choose an MV-Register (multi-value) over an LWW-Register?
  options:
  - When you want the smallest possible metadata footprint and trust every replica's wall clock completely,
    so the highest-timestamp write can always be treated as the definitive winner
  - When you need the field to be strongly consistent and linearizable across all replicas, so every read
    reflects the single most recent write in real time
  - When losing a concurrent write is unacceptable and you are willing to surface concurrent siblings
    for the application to merge, rather than silently keeping only the highest-timestamp value
  - When the field must never have more than one writer, so a single-owner replica can serialize every
    update and eliminate the possibility of any concurrent conflict
  answer: 2
  explanation: |
    An MV-Register keeps all concurrent values as siblings (no silent loss) but requires app-side merge; an
    LWW-Register is smaller and simpler but discards the losing concurrent write and is clock-skew sensitive.
    Neither provides strong consistency, and single-writer fields do not create conflicts to begin with.
  ref: concepts.md#crdt-types-in-depth-counters-sets-registers
- id: cap-theorem-and-consistency-093
  difficulty: expert
  tags:
  - cp-ap
  - oversimplification
  - kleppmann
  question: |
    Why does Kleppmann argue that labeling a database simply "CP" or "AP" is misleading?
  options:
  - Because all databases are actually CA in practice, since dropping partition tolerance is what lets
    them deliver both consistency and availability simultaneously in the real world
  - Because modern datacenter networks never partition thanks to redundant links, dual top-of-rack
    switches, and sub-second failover, so the C-vs-A labels describe an obsolete failure mode that
    simply no longer occurs in production
  - Because CAP was mathematically disproven by later academic work and no genuine consistency-versus-availability
    trade-off actually exists once the original proof's synchronous-network assumptions are relaxed
  - Because the C-vs-A choice only applies during an active partition, a system's behavior depends on
    configuration and even on the specific operation, and CAP's binary C (linearizability) and A (total
    availability) cannot even name useful models like causal or serializable
  answer: 3
  explanation: |
    The labels compress away that the trade-off is only live during a partition, that the same system can be
    tuned CP or AP per operation, and that CAP's strict binary vocabulary omits the many useful in-between
    guarantees. CAP was not disproven, CA is not universal, and partitions certainly still happen.
  ref: concepts.md#why-cp-versus-ap-is-an-oversimplification
- id: cap-theorem-and-consistency-094
  difficulty: advanced
  tags:
  - cp-ap
  - latency
  - oversimplification
  question: |
    In everyday operation (no clean partition), which "omitted variable" actually dominates the CP/AP
    discussion, and why?
  options:
  - Disk capacity, because a node whose volume fills up begins rejecting writes and that storage exhaustion
    is what forces the everyday consistency-versus-availability decision
  - 'Latency: real failures usually appear as slowness, and within a timeout a merely-slow node is indistinguishable
    from a partitioned one - so the practical trade-off is consistency vs latency (PACELC''s else-branch),
    not a clean C-vs-A partition choice'
  - CPU utilization, because a saturated node cannot complete its consensus rounds in time, and that
    processing bottleneck is the real omitted variable driving the everyday CP-versus-AP outcome once
    the network itself is healthy
  - Number of replicas, because adding more copies of the data automatically strengthens consistency,
    and that replica count is therefore the dominant hidden factor in the day-to-day trade-off rather
    than any timing concern
  answer: 1
  explanation: |
    Clean partitions are rare; slowness is common, and a slow node looks partitioned within a timeout, so the
    real everyday trade is consistency vs latency (PACELC else). Disk/CPU/replica-count are not the variable
    CAP omits, and more replicas do not by themselves strengthen consistency.
  ref: concepts.md#why-cp-versus-ap-is-an-oversimplification
- id: cap-theorem-and-consistency-095
  difficulty: expert
  tags:
  - cp-ap
  - configuration
  - mongodb
  question: |
    A candidate insists "MongoDB is a CP database, full stop." What is the most accurate correction?
  options:
  - 'MongoDB''s posture depends on configuration: with w:majority and readConcern majority/linearizable
    it is CP-leaning, but with w:1 and reads from secondaries it behaves AP-ish - so the label describes
    a chosen configuration, not an invariant of the system'
  - MongoDB is actually always AP, because a replica set keeps serving reads from any reachable secondary
    even after the primary has been partitioned away from the majority, so it never sacrifices availability
  - MongoDB is CA because it uses a single elected primary per replica set, so it sidesteps partition
    tolerance entirely and never has to trade consistency against availability during a network split
  - The label is correct because all document databases store each record as one self-contained document
    and are therefore fundamentally CP regardless of how their read and write concerns are configured
  answer: 0
  explanation: |
    MongoDB exposes write/read concerns that move it along the spectrum; it is CP-leaning with majority
    concerns and more available/relaxed with w:1 + secondary reads. Neither "always AP", "CA", nor "all
    document DBs are CP" is accurate.
  ref: concepts.md#why-cp-versus-ap-is-an-oversimplification
- id: cap-theorem-and-consistency-096
  difficulty: advanced
  tags:
  - cp-ap
  - gc-pause
  - failure-modes
  question: |
    Why is a long garbage-collection pause or a stalled disk relevant to the CAP/CP-vs-AP discussion?
  options:
  - It has no relevance whatsoever; only a physical severing of network links between datacenters counts
    as a partition, so a purely local stall can never trigger partition-time behavior
  - Because a garbage-collection pause temporarily freezes all mutation on a node, which forces every
    replica into a strongly consistent quiescent state until the pause ends
  - Because a process frozen by a GC pause or blocked on slow I/O stops responding and is indistinguishable
    from a partitioned node to its peers, so "partition-time" behavior can be triggered by purely local
    stalls, not just network faults
  - Because a stalled disk only delays the fsync that guarantees durability and has no effect at all on
    whether the node can keep answering its peers and remain available
  answer: 2
  explanation: |
    From peers' perspective a GC-frozen or I/O-blocked node is silent - functionally the same as being
    partitioned - so failover/fencing and CP-style refusals can trigger from local stalls. Partitions are not
    limited to physical cable cuts; GC pauses do not confer consistency; and a stall absolutely affects
    availability.
  ref: concepts.md#why-cp-versus-ap-is-an-oversimplification
- id: cap-theorem-and-consistency-097
  difficulty: advanced
  tags:
  - real-systems
  - dynamodb
  - misconception
  question: |
    Which statement about DynamoDB (the AWS service, not the 2007 Dynamo paper) is correct?
  options:
  - It is a leaderless, sloppy-quorum, vector-clock store that surfaces conflicting siblings to clients
    and expects the application to reconcile them on read, exactly as the 2007 Dynamo paper described
  - It resolves all write conflicts using vector clocks and read-repair just like the original paper,
    returning multiple divergent versions whenever concurrent updates touch the same item
  - It provides strongly consistent, linearizable reads across every region in Global Tables, so a write
    in one region is immediately visible to a strong read in any other region
  - It uses a single leader per partition replicated across 3 AZs, offers eventually consistent reads
    by default and strongly consistent reads on request (same-region), and supports ACID transactions
    and conditional writes
  answer: 3
  explanation: |
    The service differs from the paper: leader-per-partition across 3 AZs, eventually consistent reads by
    default with optional strong same-region reads, plus ACID transactions and conditional writes. Global
    Tables are active-active LWW and only eventually consistent across regions, and the service does not
    expose vector-clock siblings.
  ref: concepts.md#consistency-of-real-systems
- id: cap-theorem-and-consistency-098
  difficulty: expert
  tags:
  - real-systems
  - dynamodb
  - global-tables
  question: |
    A service uses DynamoDB Global Tables across three regions. Two regions concurrently update the same
    item. What consistency behavior must the application design for?
  options:
  - Strongly consistent, linearizable cross-region writes with automatic conflict prevention, so two
    regions updating the same item are serialized into one agreed order before either write returns
  - Active-active replication that is eventually consistent across regions and resolves concurrent writes
    with last-writer-wins, so a concurrent update in another region can silently overwrite the other
  - Automatic vector-clock sibling creation on every conflict, handing the application both divergent
    versions of the item so it can merge them explicitly before the next write
  - Cross-region two-phase commit on every write, blocking the client until all three regions have
    durably prepared and committed the update in lockstep
  answer: 1
  explanation: |
    Global Tables are multi-region active-active, eventually consistent across regions, using last-writer-wins;
    concurrent cross-region writes can clobber each other, so the app must design for that (e.g., idempotency,
    per-region ownership, or conflict-tolerant data). There is no strong cross-region read, sibling merge,
    or cross-region 2PC.
  ref: concepts.md#consistency-of-real-systems
- id: cap-theorem-and-consistency-099
  difficulty: expert
  tags:
  - real-systems
  - spanner
  - truetime
  question: |
    How does Google Spanner use TrueTime to guarantee external consistency (strict serializability), and
    what is the cost?
  options:
  - TrueTime returns a bounded time interval with uncertainty epsilon; on commit Spanner performs commit-wait,
    deliberately waiting out epsilon so no later transaction can receive an earlier timestamp - which
    adds a few milliseconds of write latency
  - TrueTime returns an exact global timestamp with zero measurement error using GPS and atomic clocks,
    so commits can be assigned an instant with no waiting and no latency penalty at all
  - TrueTime replaces the Paxos protocol entirely, so Spanner reaches its ordering purely from
    synchronized clocks and never has to run a consensus round across its replicas
  - TrueTime makes Spanner an AP system that serves eventually consistent cross-region reads, trading
    strict ordering for availability whenever the network between datacenters degrades
  answer: 0
  explanation: |
    TrueTime exposes clock uncertainty as an interval; Spanner waits out that uncertainty (commit-wait) so
    timestamp order matches real-time order, costing a few ms per write. TrueTime does not eliminate clock
    error (it bounds it), Spanner still uses Paxos per shard, and it is a PC/EC system, not AP.
  ref: concepts.md#consistency-of-real-systems
- id: cap-theorem-and-consistency-100
  difficulty: expert
  tags:
  - real-systems
  - cockroachdb
  - clock-skew
  question: |
    CockroachDB targets serializable isolation without atomic clocks. What safety mechanism does it rely on,
    and what happens when a node's clock drifts too far?
  options:
  - It ignores clock skew entirely and relies solely on Raft to order writes, trusting the replication
    log alone to keep transactions serializable no matter how far the node clocks drift apart
  - It deploys the same GPS and atomic-clock TrueTime hardware as Spanner in every node, obtaining
    tightly bounded timestamps directly from the physical clocks rather than estimating uncertainty
  - It configures a maximum clock offset and uses uncertainty intervals with read restarts to preserve
    serializability; if a node detects its clock has drifted beyond the max offset it crashes itself to
    avoid violating safety
  - It falls back to eventual consistency whenever clocks drift beyond the configured bound, relaxing its
    isolation level automatically until the offending node's clock resynchronizes with its peers
  answer: 2
  explanation: |
    Lacking atomic clocks, CockroachDB assumes a bounded max clock offset and handles the resulting uncertainty
    with read restarts; a node that finds its clock outside the allowed offset self-terminates rather than risk
    correctness. It does not use TrueTime hardware, does not ignore skew, and does not silently degrade to
    eventual consistency.
  ref: concepts.md#consistency-of-real-systems
- id: cap-theorem-and-consistency-101
  difficulty: advanced
  tags:
  - real-systems
  - zookeeper
  - linearizability
  - gotcha
  question: |
    A developer assumes every read from ZooKeeper is linearizable. Where is this assumption wrong, and how
    do you get a linearizable read?
  options:
  - It is never wrong; every ZooKeeper read is linearizable by default because all reads are routed
    through the elected leader and reflect the very latest committed write in real time
  - You must switch the affected znodes to a last-write-wins conflict policy, after which follower reads
    become linearizable because the highest-timestamp value is always the one returned
  - ZooKeeper reads are linearizable but its writes are only eventually consistent, so a just-written
    value may take time to propagate to the leader before it can be read back
  - ZooKeeper writes are linearizable but reads can be served by a follower and may be slightly stale;
    to get a linearizable read you must issue a sync() before the read (etcd offers a linearizable-read
    option routed through the leader / ReadIndex)
  answer: 3
  explanation: |
    ZooKeeper guarantees linearizable writes but allows followers to serve stale reads for performance; a
    sync() before the read forces linearizability. etcd similarly requires a linearizable-read option
    (leader/ReadIndex). The other options invert the guarantee or invoke irrelevant mechanisms.
  ref: concepts.md#consistency-of-real-systems
- id: cap-theorem-and-consistency-102
  difficulty: advanced
  tags:
  - real-systems
  - cassandra
  - lww
  - clock-skew
  question: |
    Cassandra resolves conflicting cell writes by last-write-wins using cell timestamps. What real risk does
    this create in a multi-writer deployment, and why?
  options:
  - No risk at all, because Cassandra tracks causality with per-cell vector clocks internally and detects
    every concurrent write, so no update can ever be dropped by a timestamp comparison
  - Clock skew between coordinators can cause a genuinely later write to carry a lower timestamp and be
    silently discarded (or an earlier write to win), so writes can be lost without any error
  - It forces every write for a given key through a single elected leader replica, which serializes the
    updates but bottlenecks throughput and cannot absorb multi-region write volume
  - It makes all reads linearizable, because resolving each cell by its highest timestamp guarantees the
    read returns the single most recent write in real-time order across every replica
  answer: 1
  explanation: |
    LWW by cell timestamp depends on synchronized clocks; skew can make a later write lose to an earlier one
    (or drop a concurrent write) silently. Cassandra is leaderless (no single-leader bottleneck), does not use
    vector clocks for this, and LWW does not confer linearizability.
  ref: concepts.md#consistency-of-real-systems
- id: cap-theorem-and-consistency-103
  difficulty: expert
  tags:
  - real-systems
  - comparison
  - design-judgment
  question: |
    You need globally-distributed transactions with strict serializability and the lowest possible clock-driven
    write penalty using purpose-built hardware. Which system's design most directly matches, and what is the
    inherent cost you accept?
  options:
  - Google Spanner with TrueTime; cost is commit-wait latency (a few ms per write) tied to clock uncertainty
  - Cassandra with EACH_QUORUM; cost is cross-region round-trip read and write latency
  - DynamoDB Global Tables; cost is occasional last-writer-wins conflicts across regions
  - Riak with native CRDT data types; cost is app-side merge and modeling complexity
  answer: 0
  explanation: |
    Strict serializability globally with hardware clocks is Spanner's design; the accepted cost is commit-wait
    latency proportional to TrueTime's uncertainty. Cassandra EACH_QUORUM is not strictly serializable,
    DynamoDB Global Tables are eventually consistent LWW, and Riak is AP/eventual with CRDTs.
  ref: concepts.md#consistency-of-real-systems
- id: cap-theorem-and-consistency-104
  difficulty: advanced
  tags:
  - real-systems
  - riak
  - conflict-resolution
  question: |
    Riak is the closest production descendant of the Dynamo paper. Which pair of features reflects that
    lineage?
  options:
  - Single-leader replication with synchronous cross-region commit, acknowledged only once a remote
    replica has durably confirmed the write across the datacenter link
  - A Paxos-per-shard architecture backed by TrueTime atomic clocks, using commit-wait to totally order
    every transaction across regions
  - Leaderless N/R/W replication with dotted-version-vector siblings and native CRDT data types (counters,
    sets, maps, registers) for automatic convergence
  - Strict serializability enforced with two-phase locking, holding read and write locks on every key
    until each transaction commits
  answer: 2
  explanation: |
    Riak is leaderless with tunable N/R/W, surfaces siblings via dotted version vectors, and ships native CRDTs
    for auto-convergence - directly in the Dynamo tradition. The other options describe Spanner-style or classic
    RDBMS designs, not Riak.
  ref: concepts.md#consistency-of-real-systems
- id: cap-theorem-and-consistency-105
  difficulty: expert
  tags:
  - pacelc
  - pc-el
  - classification
  question: |
    Which real system is the canonical example of the unusual PC/EL corner of PACELC, and what does that
    posture mean?
  options:
  - Google Spanner; it favors latency in both the partition and the normal-operation case, serving fast
    local reads rather than paying for cross-region coordination
  - DynamoDB; it always favors consistency under a partition by blocking writes until a quorum is
    reachable, and it does the same during ordinary operation
  - Cassandra; it favors consistency in both cases, running synchronous quorum reads and writes whether
    or not a partition is currently active
  - Yahoo PNUTS/Sherpa; it stays consistent under a partition (per-record timeline) yet favors latency
    over consistency in normal operation by allowing slightly stale but consistent per-record reads
  answer: 3
  explanation: |
    PNUTS is the textbook PC/EL system: it will not violate its per-record timeline during a partition
    (PC), but in normal operation it serves possibly-stale-yet-consistent versions to save latency (EL).
    Spanner is PC/EC, and Cassandra/DynamoDB default to PA/EL.
  ref: concepts.md#pacelc-theorem
- id: cap-theorem-and-consistency-106
  difficulty: advanced
  tags:
  - pacelc
  - tunable
  - nuance
  question: |
    Why is it more precise to say "Cassandra is PA/EL by default" rather than "Cassandra is PA/EL"?
  options:
  - Because Cassandra is actually PC/EC, favoring consistency both under partition and in normal
    operation once its default quorum settings are taken into account, so the PA/EL label is simply wrong
  - 'Because PACELC''s C is not strictly binary in a tunable store: individual operations can be effectively
    EC (e.g., a QUORUM/QUORUM path satisfying R+W>N) even though the system''s default posture is EL,
    so the classification describes a default, not an absolute'
  - Because Cassandra automatically changes its PACELC class based on the time of day, favoring latency
    during peak traffic hours and switching to consistency during off-peak maintenance windows each night
  - Because the PA/EL classification only ever applies to read operations, while writes in Cassandra are
    governed by an entirely separate and considerably stricter consistency posture negotiated per request
  answer: 1
  explanation: |
    Tunable consistency means the classification is a default; specific operations can be tuned toward EC
    (QUORUM/QUORUM) even in a PA/EL system. It is not PC/EC by default, does not depend on time of day, and
    applies to both reads and writes.
  ref: concepts.md#pacelc-theorem
- id: cap-theorem-and-consistency-107
  difficulty: expert
  tags:
  - crdt
  - sequence
  - collaborative-editing
  question: |
    In a collaborative text editor, two users concurrently insert characters at the same position. Which
    CRDT approach makes their edits converge deterministically without a central server, and how?
  options:
  - A sequence CRDT (e.g., RGA, Logoot, LSEQ) that assigns dense, totally-ordered position identifiers
    between existing elements so concurrent inserts interleave in the same deterministic order on every
    replica
  - An LWW-Register holding the whole document, keeping whichever concurrent edit carries the later
    wall-clock timestamp and discarding the other user's insertion entirely
  - A PN-Counter tracking the running length of the document in characters, incrementing on every insert
    and decrementing on every delete so replicas agree on the size
  - A G-Set that accumulates every inserted character as an unordered grow-only collection, merging by
    union so no character is ever lost between replicas
  answer: 0
  explanation: |
    Sequence CRDTs assign dense ordered position ids so concurrent inserts deterministically interleave the
    same way everywhere, powering Automerge/Yjs-style collaboration. A document-level LWW-Register would drop
    one user's edit, a counter tracks only length, and an unordered G-Set loses text order.
  ref: concepts.md#crdt-types-in-depth-counters-sets-registers
- id: cap-theorem-and-consistency-108
  difficulty: advanced
  tags:
  - real-systems
  - mongodb
  - read-concern
  question: |
    A MongoDB deployment uses w:majority for writes but reads from secondaries with readConcern:local for
    speed. A user occasionally fails to see their own just-committed write. What is the cause and a targeted
    fix?
  options:
  - The write never became durable in the first place; raise the replication factor so more secondaries
    retain the committed value and the read can find it
  - MongoDB is structurally unable to provide read-your-writes under any read or write concern, so the
    only remedy is to move that data to a different database entirely
  - Secondary reads with readConcern:local can lag the primary, breaking read-your-writes; use a causal-consistency
    session (cluster time) or read with an appropriate read concern / from the primary for that path
  - Switch all writes to w:1 so they acknowledge faster, which lets the secondary catch up sooner and
    closes the window in which the user misses their own write
  answer: 2
  explanation: |
    Reading local from a lagging secondary can miss a write already committed on the primary - a read-your-writes
    violation - fixable with a causal-consistency session or by reading with a stronger concern / from the
    primary for that path. The write was durable (w:majority), MongoDB can provide RYW, and lowering to w:1
    weakens durability rather than helping.
  ref: concepts.md#consistency-of-real-systems
- id: cap-theorem-and-consistency-109
  difficulty: expert
  tags:
  - testing
  - causal
  - anomaly
  question: |
    A distributed message system claims causal consistency. In a recorded history, one client observes a
    reply message before the original message it quotes. Under a causal-consistency checker, what does this
    represent?
  options:
  - A benign reordering that causal consistency permits, since the model constrains only writes to the same
    key and leaves the delivery order of separate messages completely free
  - Expected behavior, because a reply and the message it quotes are treated as concurrent, independent
    operations that any replica is allowed to reorder freely
  - A linearizability violation only and not a causal one, since causal consistency governs cross-client
    real-time recency rather than the relative ordering of dependent messages
  - 'A causality violation: the reply causally depends on (happened-after) the original, so no valid causal
    order allows observing the effect before its cause'
  answer: 3
  explanation: |
    The reply has a happens-before dependency on the original, so seeing the reply first is exactly a causality
    violation under a causal-consistency check. It is not a permitted reordering (that only applies to genuinely
    concurrent, independent messages), and while it may also fail linearizability, it is squarely a causal
    violation.
  ref: concepts.md#testing-and-violating-consistency-models
- id: cap-theorem-and-consistency-110
  difficulty: advanced
  tags:
  - sequential-consistency
  - example
  - nuance
  question: |
    Two users each post to their own timeline; a reader sees both posts under sequential consistency. Which
    outcome is allowed under sequential consistency but forbidden under linearizability?
  options:
  - Different readers see the two posts in different relative orders, because sequential consistency lets
    each replica pick its own independent interleaving of the concurrent writes
  - All readers see the same single order, but that order places a post that actually happened later in
    wall-clock time before one that happened earlier (while still respecting each poster's own order)
  - A reader sees a reply appear before the original message it quotes inside a single timeline, inverting
    the happens-before order of two causally dependent writes
  - A reader never sees one of the two posts at all, because sequential consistency allows an acknowledged
    write to be silently dropped from the agreed global order
  answer: 1
  explanation: |
    Sequential consistency requires one agreed order respecting each client's program order but not real time,
    so cross-client wall-clock order can be inverted - which linearizability forbids. Readers disagreeing on
    order violates sequential too; violating within-timeline order violates program order; and never seeing a
    post is a different (liveness) issue.
  ref: concepts.md#sequential-consistency-and-the-model-hierarchy
- id: cap-theorem-and-consistency-111
  difficulty: expert
  tags:
  - real-systems
  - design-judgment
  - multi-region
  question: |
    You are choosing a datastore for globally-distributed user sessions: sub-10ms reads in every region,
    tolerate brief staleness, but must never permanently lose a session write. Weighing the real systems,
    which choice and rationale is strongest?
  options:
  - A leaderless AP store (DynamoDB Global Tables or Cassandra with LOCAL_QUORUM/LOCAL_ONE) serving local
    reads for the latency budget, accepting eventual cross-region convergence; guard against LWW loss
    by using conflict-tolerant session data or per-region ownership
  - Spanner with globally-replicated strict serializability, because paying TrueTime commit-wait on every
    write is always the safest default no matter how tight the per-region read latency budget is
  - A single-region etcd cluster serving linearizable reads through the leader, because guaranteed
    correctness matters more than serving sub-10ms reads from within each user's own region
  - MongoDB with readConcern:linearizable pinned to a single primary region, because routing every global
    session read back to one primary is the simplest topology to operate
  answer: 0
  explanation: |
    The latency budget and staleness tolerance point to a local-read AP store; the durability requirement is
    met by replication, and LWW loss is mitigated with conflict-tolerant data or per-region ownership. Spanner's
    commit-wait and cross-region reads blow the latency budget, single-region etcd/MongoDB cannot serve sub-10ms
    reads globally, and linearizable reads through one region defeat local low-latency reads.
  ref: concepts.md#consistency-of-real-systems
