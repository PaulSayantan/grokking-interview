topic: "IoT and Edge Computing on AWS: IoT Core, Greengrass and Edge"
domain: system-design
topic_slug: aws-iot-edge-computing
version: 1

questions:
  # ---------------- Why edge computing ----------------
  - id: aws-iot-edge-computing-001
    difficulty: beginner
    tags: [edge, rationale, latency]
    question: |
      What is the primary reason to run compute at the edge (near the device)
      instead of in an AWS region?
    options:
      - "Edge compute is always cheaper per CPU-hour than a region since it skips all data-egress charges"
      - "To satisfy concrete needs like low latency, reduced bandwidth, offline operation, or data residency"
      - "Because AWS regions cannot run machine-learning inference without a dedicated GPU Outposts rack"
      - "Edge hardware never needs patching or monitoring once its firmware is signed and sealed at the factory"
    answer: 1
    explanation: |
      Edge is justified by specific forces: real-time latency, bandwidth/cost reduction,
      operating during connectivity loss, and data sovereignty. It is not inherently
      cheaper (option 0) — it adds fleet ops burden. Regions do run ML (option 2), and
      edge hardware absolutely needs patching (option 3).
    ref: "concepts.md#why-edge-computing-latency-bandwidth-offline-and-data-sovereignty"

  - id: aws-iot-edge-computing-002
    difficulty: beginner
    tags: [edge, tradeoff]
    question: |
      Which of the following is a genuine COST of pushing computation to the edge
      that you must weigh against its benefits?
    options:
      - "Increased fleet operational burden: you now patch, monitor, and secure many runtimes"
      - "You lose the ability to use MQTT and must fall back to HTTPS polling for every device"
      - "Devices can no longer use X.509 certificates and must switch to a shared fleet API key"
      - "IoT Core stops working entirely once any compute is moved off the cloud and onto devices"
    answer: 0
    explanation: |
      Edge multiplies operational surface — thousands of runtimes to patch/monitor/secure,
      weaker central consistency, harder debugging. It does not remove MQTT, certs, or
      IoT Core. Default to cloud and push to edge only for a named requirement.
    ref: "concepts.md#why-edge-computing-latency-bandwidth-offline-and-data-sovereignty"

  - id: aws-iot-edge-computing-003
    difficulty: intermediate
    tags: [edge, bandwidth, estimation]
    question: |
      A fleet of 10,000 vibration sensors each samples at high frequency and would
      produce ~2 MB/s of raw data if backhauled over expensive cellular links. Which
      approach best reduces cost while preserving the ability to detect anomalies?
    options:
      - "Send all raw samples to IoT Core over cellular and filter them in the rules engine afterward"
      - "Aggregate/infer at the edge with Greengrass and transmit only summaries and detected anomalies"
      - "Increase the MQTT payload limit above 128 KiB to batch many more raw readings per message"
      - "Store all raw data in each device's Device Shadow and sync the full history periodically"
    answer: 1
    explanation: |
      Bandwidth-driven use cases are the textbook edge case: aggregate/infer locally and
      ship only summaries/anomalies, cutting cellular cost dramatically. Filtering in the
      cloud (option 0) still pays to transmit raw data. The MQTT limit is fixed at 128 KiB
      (option 2). Shadows are 8 KB and not for telemetry (option 3).
    ref: "concepts.md#why-edge-computing-latency-bandwidth-offline-and-data-sovereignty"

  - id: aws-iot-edge-computing-004
    difficulty: intermediate
    tags: [edge, data-residency]
    question: |
      A hospital contract forbids raw patient video from leaving the building, but you
      still want AWS-native services on site. Which edge force is driving the design and
      what is the best fit?
    options:
      - "Latency; use Wavelength inside the 5G carrier network to keep video processing near the users"
      - "Data sovereignty/residency; process on site (Outposts or on-prem Greengrass) and emit only compliant derived data"
      - "Bandwidth; use Kinesis Data Firehose with a large buffer to compress the video before egress"
      - "Offline operation; increase the QoS-1 queued-message TTL so video survives long disconnects"
    answer: 1
    explanation: |
      Residency/sovereignty forbids raw data egress, so process on site (Outposts for AWS
      infra in your DC, or Greengrass on-prem) and export only anonymized/derived data.
      Wavelength is for mobile latency, Firehose still ships raw off-site, and TTL tuning
      is about brief disconnects, not residency.
    ref: "concepts.md#why-edge-computing-latency-bandwidth-offline-and-data-sovereignty"

  # ---------------- IoT Core device gateway / MQTT broker ----------------
  - id: aws-iot-edge-computing-005
    difficulty: beginner
    tags: [iot-core, mqtt, fundamentals]
    question: |
      At its core, what is the AWS IoT Core device gateway?
    options:
      - "A managed relational database that stores device metadata and indexes it for SQL joins"
      - "A CDN that caches and delivers signed firmware images to devices at the nearest edge location"
      - "A fully-managed, auto-scaling MQTT (and HTTPS/WebSocket) broker that maintains millions of device connections"
      - "A managed Kafka cluster you size in partitions and consume with the standard Kafka client"
    answer: 2
    explanation: |
      IoT Core's gateway is a managed, elastic MQTT broker (also HTTPS and
      MQTT-over-WebSocket) handling millions of concurrent device connections with no
      broker provisioning. It is not a relational DB, a CDN, or a Kafka cluster.
    ref: "concepts.md#iot-core-device-gateway-and-the-mqtt-broker"

  - id: aws-iot-edge-computing-006
    difficulty: intermediate
    tags: [iot-core, mqtt, qos]
    question: |
      A design requires exactly-once delivery of device messages. What is the correct
      statement about achieving this with IoT Core?
    options:
      - "Use MQTT QoS 2, which IoT Core supports end-to-end for exactly-once delivery"
      - "Enable retained messages, whose broker-side deduplication guarantees exactly-once"
      - "Use HTTPS instead of MQTT, since its request/response model gives exactly-once semantics"
      - "IoT Core supports only QoS 0 and QoS 1; achieve effectively-once by making downstream processing idempotent (dedupe on a message id)"
    answer: 3
    explanation: |
      IoT Core supports QoS 0 (at most once) and QoS 1 (at least once) only — there is no
      QoS 2. Exactly-once must be built downstream via idempotency/dedupe. Retained
      messages and HTTPS do not provide exactly-once.
    ref: "concepts.md#iot-core-device-gateway-and-the-mqtt-broker"

  - id: aws-iot-edge-computing-007
    difficulty: intermediate
    tags: [iot-core, basic-ingest, cost]
    question: |
      Devices send telemetry straight to storage and no other device needs to subscribe
      to their topics. Which IoT Core feature reduces cost by skipping the message-broker
      charge while still running a rule?
    options:
      - "Basic Ingest (publishing to $aws/rules/<ruleName>)"
      - "Persistent sessions that keep the device subscribed while it sleeps between reports"
      - "Retained messages that cache each device's last reading for late-joining subscribers"
      - "Last Will and Testament announcing to storage when a device disconnects uncleanly"
    answer: 0
    explanation: |
      Basic Ingest sends data directly into a rule via the reserved $aws/rules/ topic,
      bypassing the pub/sub message broker charge — ideal for device→cloud storage with no
      other subscribers. The other features are about session/state, not cost bypass.
    ref: "concepts.md#iot-core-device-gateway-and-the-mqtt-broker"

  - id: aws-iot-edge-computing-008
    difficulty: intermediate
    tags: [iot-core, mqtt, presence]
    question: |
      You want the broker to notify subscribers when a device disconnects UNcleanly
      (e.g. loses power). Which MQTT feature provides this?
    options:
      - "Retained messages that replay a device's last-known status to any new subscriber"
      - "Last Will and Testament (LWT)"
      - "Basic Ingest routing a disconnect event straight into a rule for storage"
      - "Device Shadow delta comparing the device's last reported connectivity state"
    answer: 1
    explanation: |
      LWT lets a device register a message the broker publishes if the connection drops
      uncleanly — the standard presence/"device offline" signal. Retained messages store
      the last message for new subscribers; Basic Ingest is a cost path; the shadow delta
      is state reconciliation.
    ref: "concepts.md#iot-core-device-gateway-and-the-mqtt-broker"

  - id: aws-iot-edge-computing-009
    difficulty: advanced
    tags: [iot-core, limits]
    question: |
      What is the approximate maximum MQTT message payload size accepted by AWS IoT Core?
    options:
      - "256 KB"
      - "1 MB"
      - "128 KiB"
      - "8 KB"
    answer: 2
    explanation: |
      IoT Core caps message payloads at ~128 KiB (billed per 5 KB block). 8 KB is the
      Device Shadow document limit — a common distractor. 256 bytes is the topic-name
      limit, and 1 MB is the Kinesis per-shard rate, not an IoT payload size.
    ref: "concepts.md#iot-core-device-gateway-and-the-mqtt-broker"

  - id: aws-iot-edge-computing-010
    difficulty: advanced
    tags: [iot-core, self-managed, tradeoff]
    question: |
      A team debates IoT Core vs running their own Mosquitto/EMQX broker on EC2 for a
      2-million-device fleet. Which is the strongest argument FOR IoT Core?
    options:
      - "IoT Core supports MQTT QoS 2 for exactly-once delivery while self-managed brokers cannot"
      - "IoT Core retains and replays the full message stream like a Kafka log for reprocessing"
      - "IoT Core lets you install arbitrary broker plugins and custom authentication modules at runtime"
      - "Managed per-device X.509 identity at scale, native shadows/rules, and zero broker capacity planning or cluster ops"
    answer: 3
    explanation: |
      IoT Core's edge is device identity at scale, native shadows/rules, and no broker
      ops/capacity planning. It does NOT offer QoS 2, is a router not a replayable log
      (you tee to Kinesis for replay), and does not support arbitrary plugins — those are
      reasons you might instead self-manage.
    ref: "concepts.md#iot-core-device-gateway-and-the-mqtt-broker"

  - id: aws-iot-edge-computing-011
    difficulty: advanced
    tags: [iot-core, persistent-sessions]
    question: |
      A device briefly loses connectivity for a few minutes. Which mechanism lets it
      resume its subscriptions and receive QoS-1 messages that were queued while it was
      away?
    options:
      - "MQTT persistent sessions (with queued-message TTL, default ~1 hour)"
      - "Device Shadow named documents that queue and replay missed messages on reconnect"
      - "Kinesis Enhanced Fan-Out pushing the backlog to the device over a dedicated pipe"
      - "Firehose buffering that holds the device's messages until it comes back online"
    answer: 0
    explanation: |
      Persistent sessions preserve subscriptions and queue QoS-1 messages during brief
      drops, delivering them on reconnect (queued messages have a default ~1 h TTL and a
      queue limit). Shadows track state, not queued messages; the Kinesis/Firehose options
      are downstream ingestion features.
    ref: "concepts.md#iot-core-device-gateway-and-the-mqtt-broker"

  # ---------------- Protocols ----------------
  - id: aws-iot-edge-computing-012
    difficulty: beginner
    tags: [protocols, mqtt]
    question: |
      Why is MQTT generally preferred over HTTPS for battery-powered, chatty IoT devices?
    options:
      - "HTTPS cannot be encrypted, so MQTT is the only transport-secure option for devices"
      - "MQTT uses a long-lived connection with a tiny 2-byte header and supports server push, avoiding repeated handshakes and polling"
      - "MQTT payloads can be arbitrarily large while HTTPS caps every request body at 1 KB"
      - "HTTPS does not work with X.509 certificates, so device mutual TLS is impossible over it"
    answer: 1
    explanation: |
      MQTT's persistent connection, minimal header overhead, and native server push save
      battery/cellular data and avoid polling — ideal for chatty, command-driven devices.
      HTTPS is encrypted too, both have payload limits, and HTTPS can use X.509.
    ref: "concepts.md#message-protocols-mqtt-versus-http-versus-websocket"

  - id: aws-iot-edge-computing-013
    difficulty: intermediate
    tags: [protocols, websocket, browser]
    question: |
      A browser-based dashboard must receive live device data from IoT Core, but browsers
      cannot open raw MQTT sockets. Which protocol/auth combination fits best?
    options:
      - "Raw MQTT over TCP 8883 with X.509 mutual TLS opened straight from the browser tab"
      - "HTTPS polling every few seconds with no push, refetching the latest values each time"
      - "MQTT over WebSocket with SigV4 (IAM/Cognito) authentication"
      - "Kinesis Data Streams consumed directly by the browser using the AWS SDK for JavaScript"
    answer: 2
    explanation: |
      Browsers use MQTT over WebSocket (tunneled over 443) with SigV4/Cognito auth, giving
      server push in the browser. Raw MQTT isn't available in browsers, HTTPS polling loses
      push and wastes calls, and browsers don't consume Kinesis directly.
    ref: "concepts.md#message-protocols-mqtt-versus-http-versus-websocket"

  - id: aws-iot-edge-computing-014
    difficulty: intermediate
    tags: [protocols, https]
    question: |
      For which scenario is plain HTTPS (REST) the acceptable choice to talk to IoT Core?
    options:
      - "A device that must receive frequent pushed commands from the cloud"
      - "A high-frequency telemetry stream needing lowest per-message overhead"
      - "A battery-powered device where minimizing radio-on time is critical"
      - "A legacy HTTP-only sensor that posts an occasional one-way reading and never needs a pushed command"
    answer: 3
    explanation: |
      HTTPS suits rare, one-way telemetry from HTTP-only clients that never need push. It
      is a poor fit when server push is required, when per-message overhead must be minimal,
      or for battery-sensitive devices — all of which favor MQTT.
    ref: "concepts.md#message-protocols-mqtt-versus-http-versus-websocket"

  - id: aws-iot-edge-computing-015
    difficulty: advanced
    tags: [protocols, tradeoff]
    question: |
      Which capability does MQTT provide that plain HTTPS request/response does NOT,
      making MQTT essential for command-and-control fleets?
    options:
      - "Server-initiated push to the device (the cloud can command a device without the device polling)"
      - "TLS 1.2 encryption of the transport that plain HTTPS request/response cannot negotiate"
      - "Support for JSON payloads, which HTTPS request bodies are unable to carry natively"
      - "Authentication with X.509 client certificates, unavailable when talking over HTTPS"
    answer: 0
    explanation: |
      MQTT's subscribe model lets the cloud push commands to a device at any time (the
      basis of shadows and jobs). HTTPS is request/response — the device must poll. Both
      support TLS, JSON, and X.509, so those aren't differentiators.
    ref: "concepts.md#message-protocols-mqtt-versus-http-versus-websocket"

  # ---------------- Registry / provisioning ----------------
  - id: aws-iot-edge-computing-016
    difficulty: beginner
    tags: [registry, things]
    question: |
      In the AWS IoT registry, what is a "Thing"?
    options:
      - "A physical MQTT broker instance dedicated to one device's connections and subscriptions"
      - "A logical representation of a device (name + attributes) used for shadows, jobs, and indexing"
      - "A rules-engine SQL statement that filters and routes that device's incoming messages"
      - "A Kinesis shard assigned to a device to guarantee ordered delivery of its telemetry"
    answer: 1
    explanation: |
      A Thing is the logical device record (name + attributes) that ties to shadows, jobs,
      and fleet indexing. It is not a broker, a rule, or a shard.
    ref: "concepts.md#device-registry-identity-and-fleet-organization"

  - id: aws-iot-edge-computing-017
    difficulty: intermediate
    tags: [registry, dynamic-groups, fleet-indexing]
    question: |
      You want to roll out firmware only to "all devices currently running firmware < 2.0".
      Which combination makes this targeting possible?
    options:
      - "A static Thing Group populated manually with each device below firmware 2.0"
      - "A Billing Group filtered by per-device cost to select the older firmware units"
      - "Fleet Indexing plus a dynamic Thing Group whose membership is defined by a query"
      - "A Device Shadow delta broadcast to all things to pull only the outdated ones"
    answer: 2
    explanation: |
      Fleet Indexing makes registry/shadow/connectivity data searchable, and dynamic Thing
      Groups auto-populate from such a query (firmware < 2.0), which jobs then target.
      Static groups need manual membership, billing groups are for cost, and a shadow delta
      is per-device state, not fleet targeting.
    ref: "concepts.md#device-registry-identity-and-fleet-organization"

  - id: aws-iot-edge-computing-018
    difficulty: advanced
    tags: [provisioning, fleet-provisioning, security]
    question: |
      A manufacturer cannot burn a unique certificate into each device on the assembly
      line. Which AWS IoT approach lets devices obtain a unique per-device certificate at
      first boot?
    options:
      - "Just-in-time provisioning using each device's pre-installed unique cert"
      - "SigV4 authentication with a shared IAM user embedded in the firmware image"
      - "Custom authorizer Lambda issuing self-signed certs to each device at first boot"
      - "Fleet provisioning: ship a shared claim certificate, then exchange it at first boot for a unique per-device certificate"
    answer: 3
    explanation: |
      Fleet provisioning embeds a shared claim cert that the device exchanges for a unique
      cert at bootstrap — avoiding unique certs at manufacture. JITP assumes a unique cert
      already exists; shared IAM users and self-signed authorizers don't give per-device
      hardware identity.
    ref: "concepts.md#device-registry-identity-and-fleet-organization"

  - id: aws-iot-edge-computing-019
    difficulty: expert
    tags: [provisioning, tradeoff, security]
    question: |
      What is the PRIMARY security trade-off of using a single shared claim certificate
      for fleet provisioning versus per-device certs installed at manufacture?
    options:
      - "The claim cert has a larger blast radius if extracted; mitigate by scoping its policy to allow only the provisioning API"
      - "The claim cert cannot be revoked once burned in, so a leak forces you to reflash every device's firmware in the field to recover"
      - "Per-device certs cannot be used with mutual TLS, so fleet provisioning forces every device onto SigV4 request signing instead"
      - "Shared claim certs disable Device Defender entirely, leaving the fleet with no audit or behavioral anomaly detection until reprovisioned"
    answer: 0
    explanation: |
      A shared claim cert, if extracted, could provision many devices — a bigger blast
      radius — so its policy must be tightly scoped to only the provisioning exchange.
      Certs can be revoked, per-device certs do use mTLS, and claim certs don't disable
      Device Defender.
    ref: "concepts.md#device-registry-identity-and-fleet-organization"

  # ---------------- Device Shadows ----------------
  - id: aws-iot-edge-computing-020
    difficulty: beginner
    tags: [shadow, state]
    question: |
      What core problem does a Device Shadow solve?
    options:
      - "Storing years of high-frequency telemetry cheaply as an append-only history the fleet queries for analytics"
      - "Letting applications read and set a device's state even when the device is offline, reconciling when it reconnects"
      - "Load-balancing MQTT connections across a pool of brokers so no single broker exceeds its concurrent-connection quota"
      - "Encrypting the MQTT transport end-to-end so telemetry stays confidential between the device and the cloud broker"
    answer: 1
    explanation: |
      A shadow is a cloud-persisted JSON state document (desired/reported/delta) that
      decouples apps from device connectivity — you can command an offline device and it
      converges on reconnect. It is not telemetry storage, load balancing, or transport
      encryption.
    ref: "concepts.md#device-shadows-desired-versus-reported-state"

  - id: aws-iot-edge-computing-021
    difficulty: intermediate
    tags: [shadow, desired-reported-delta]
    question: |
      In a Device Shadow document, what does the "delta" represent?
    options:
      - "The raw telemetry accumulated since the device's last reported reading, batched for the next sync"
      - "The list of applications and services currently subscribed to the device's shadow update topic"
      - "The difference between desired and reported state that the device still needs to apply"
      - "The device's certificate rotation schedule, tracking when its X.509 credential is next due to be renewed"
    answer: 2
    explanation: |
      The delta is the computed difference between desired (what an app wants) and reported
      (what the device last said), telling the device what to converge on. It is not
      telemetry, subscriber lists, or cert schedules.
    ref: "concepts.md#device-shadows-desired-versus-reported-state"

  - id: aws-iot-edge-computing-022
    difficulty: advanced
    tags: [shadow, limits, anti-pattern]
    question: |
      Which use of a Device Shadow is an ANTI-pattern you should reject in a design review?
    options:
      - "Storing a device's desired configuration so it applies changes on reconnect"
      - "Using a named shadow to separate config from network state"
      - "Using the version field for optimistic concurrency on updates"
      - "Streaming 100 Hz sensor telemetry through the shadow document"
    answer: 3
    explanation: |
      Shadows are for state, capped at 8 KB, with rate limits — streaming high-frequency
      telemetry through them is an anti-pattern; use MQTT topics → Kinesis instead. The
      others are correct shadow uses (desired config, named shadows, version-based
      concurrency).
    ref: "concepts.md#device-shadows-desired-versus-reported-state"

  - id: aws-iot-edge-computing-023
    difficulty: advanced
    tags: [shadow, limits]
    question: |
      What is the maximum size of a single AWS IoT Device Shadow document?
    options:
      - "8 KB"
      - "128 KiB"
      - "400 KB"
      - "256 bytes"
    answer: 0
    explanation: |
      A shadow document is capped at 8 KB. 128 KiB is the MQTT message limit, 400 KB is the
      DynamoDB item limit, and 256 bytes is the IoT topic-name limit — all common
      distractors.
    ref: "concepts.md#device-shadows-desired-versus-reported-state"

  - id: aws-iot-edge-computing-024
    difficulty: expert
    tags: [shadow, tradeoff, command]
    question: |
      A design must send a device a real-time, transient command with the lowest latency,
      where losing the command if the device is offline is acceptable. Shadow or direct
      MQTT topic, and why?
    options:
      - "Device Shadow, because its cached desired-state document is always delivered with lower latency than a raw direct topic publish"
      - "Direct MQTT command topic, because it is lower latency and unbounded in shape; the shadow adds an 8 KB ceiling and eventual convergence overhead"
      - "Device Shadow, because direct MQTT topics can only carry telemetry and are protocol-forbidden from delivering command payloads"
      - "Neither; all device commands must be routed through the rules engine SQL, which is the only sanctioned command-delivery path"
    answer: 1
    explanation: |
      For transient, real-time, fire-and-forget commands, a direct MQTT topic is
      lower-latency and unconstrained; the shadow's value (durable desired-state, offline
      reconciliation) isn't needed and it adds an 8 KB limit and convergence latency. Direct
      topics do carry commands; the rules engine isn't required.
    ref: "concepts.md#device-shadows-desired-versus-reported-state"

  # ---------------- Rules engine ----------------
  - id: aws-iot-edge-computing-025
    difficulty: beginner
    tags: [rules-engine, routing]
    question: |
      What does the AWS IoT rules engine do?
    options:
      - "It provisions and rotates each device's X.509 certificate automatically as messages arrive on its topics"
      - "It stores incoming time-series telemetry in a built-in indexed table so applications can query device history directly"
      - "It runs a SQL statement over matching messages and routes them to one or more AWS service actions"
      - "It manages the local MQTT broker running on Greengrass edge devices and synchronizes it with the cloud"
    answer: 2
    explanation: |
      The rules engine is a serverless, SQL-driven router: match a topic filter, transform
      with SELECT, and fan out to actions (Kinesis, Firehose, Lambda, DynamoDB, Timestream,
      etc.). It doesn't provision certs, store telemetry, or run the Greengrass broker.
    ref: "concepts.md#the-rules-engine-routing-messages-to-aws-services"

  - id: aws-iot-edge-computing-026
    difficulty: intermediate
    tags: [rules-engine, error-action, reliability]
    question: |
      A rule's primary action to DynamoDB occasionally fails due to throttling. How do you
      avoid silently dropping those messages?
    options:
      - "Nothing can be done; failed rule actions are silently discarded and the messages are unrecoverable by design"
      - "Switch the device to QoS 0, since at-most-once delivery makes the rules engine retry the DynamoDB write until it succeeds"
      - "Increase the MQTT payload size limit so throttled writes are batched into fewer, larger DynamoDB requests"
      - "Configure the rule's error action to a fallback destination such as an SQS DLQ or S3"
    answer: 3
    explanation: |
      Each rule supports a single error action for messages whose primary action fails —
      route them to an SQS DLQ or S3 for later reprocessing. Failed actions are not
      inevitably lost, and QoS/payload changes don't address downstream action failure.
    ref: "concepts.md#the-rules-engine-routing-messages-to-aws-services"

  - id: aws-iot-edge-computing-027
    difficulty: intermediate
    tags: [rules-engine, fan-out]
    question: |
      You need the same temperature reading to (a) land in S3, (b) power a Timestream
      dashboard, and (c) update a "latest value" record in DynamoDB. What is the cleanest
      IoT design?
    options:
      - "A single rule with multiple actions teeing the message to Firehose→S3, Timestream, and DynamoDB"
      - "Three separate MQTT topics, one per destination, with the device publishing each reading three times over"
      - "A Lambda that the device calls directly over HTTPS, fanning the reading out to each destination in application code"
      - "A Device Shadow that S3, Timestream, and DynamoDB all subscribe to for their copy of each reading"
    answer: 0
    explanation: |
      One rule can fan a single message to multiple actions simultaneously — the IoT
      materialization pattern. Making the device publish three times wastes bandwidth,
      direct Lambda-per-destination adds cost/latency, and shadows aren't a telemetry
      fan-out mechanism.
    ref: "concepts.md#the-rules-engine-routing-messages-to-aws-services"

  - id: aws-iot-edge-computing-028
    difficulty: advanced
    tags: [rules-engine, lambda, tradeoff, scale]
    question: |
      At millions of messages per second, what is the trade-off of routing EVERY message
      through a Lambda action versus filtering/routing in the rule SQL?
    options:
      - "Lambda is always cheaper per invocation than rule SQL and scales with no account concurrency ceiling at any volume"
      - "Per-message Lambda can hit concurrency limits and cost far more; filtering/routing in rule SQL is cheaper and lower-latency, so reserve Lambda for genuine custom logic"
      - "Rule SQL has no WHERE clause and cannot filter messages, so a Lambda action is the only way to drop unwanted data"
      - "Lambda actions guarantee exactly-once delivery to the function, so routing every message through Lambda is always safest"
    answer: 1
    explanation: |
      Invoking Lambda on every message at massive scale risks concurrency throttling and
      high cost; do filtering/enrichment/routing in rule SQL and use Lambda only for custom
      logic. Rule SQL can filter (WHERE), and Lambda does not give exactly-once.
    ref: "concepts.md#the-rules-engine-routing-messages-to-aws-services"

  - id: aws-iot-edge-computing-029
    difficulty: advanced
    tags: [rules-engine, ordering, replay]
    question: |
      Which statement about the IoT rules engine's delivery semantics is correct?
    options:
      - "It guarantees strict per-topic ordering and lets you replay past messages from a configurable retention window"
      - "It provides exactly-once delivery to all configured actions by deduplicating on the MQTT message id internally"
      - "It evaluates each message independently with no built-in ordering or replay, and action retries can cause duplicates"
      - "It buffers matched messages for 24 hours like a Kinesis stream, letting late consumers catch up on the backlog"
    answer: 2
    explanation: |
      The rules engine is stateless per message — no ordering, no replay — and retries on
      action failure can duplicate. If you need ordering/replay, route to Kinesis. It does
      not offer exactly-once or a 24 h retention buffer (that's Kinesis default retention).
    ref: "concepts.md#the-rules-engine-routing-messages-to-aws-services"

  # ---------------- Ingestion: Kinesis vs Firehose ----------------
  - id: aws-iot-edge-computing-030
    difficulty: beginner
    tags: [ingestion, firehose]
    question: |
      Telemetry from IoT Core simply needs to land durably in S3 as Parquet for later
      Athena queries, with no custom stream-processing code. Which is the simplest fit?
    options:
      - "IoT rule → Kinesis Data Streams with a custom consumer application you write and operate to batch and write Parquet"
      - "IoT rule → Lambda that issues an individual S3 PutObject call for every single message as it arrives"
      - "IoT rule → DynamoDB as a landing table, then a nightly scheduled export job that copies the day's items into S3"
      - "IoT rule → Kinesis Data Firehose → S3 (with Parquet conversion)"
    answer: 3
    explanation: |
      Firehose is the zero-admin "land it in the lake" path: buffers, converts to Parquet,
      partitions, and delivers to S3 — no consumers to run. Data Streams adds consumer code
      you don't need; per-message PutObject is inefficient; DynamoDB-then-export is a
      roundabout, costly detour.
    ref: "concepts.md#high-volume-telemetry-ingestion-iot-core-to-kinesis-firehose-s3-and-analytics"

  - id: aws-iot-edge-computing-031
    difficulty: intermediate
    tags: [ingestion, kinesis, firehose, tradeoff]
    question: |
      What is the PRIMARY reason to choose Kinesis Data Streams over Data Firehose for an
      IoT telemetry pipeline?
    options:
      - "You need real-time processing, ordering per key, replay, or multiple independent consumers of the same data"
      - "Firehose cannot deliver to S3 and is limited to writing only into Redshift and OpenSearch destinations"
      - "Firehose has a much lower per-record payload size limit, forcing you to split large telemetry into fragments"
      - "Data Streams requires no shard management at any scale because it always auto-scales capacity transparently"
    answer: 0
    explanation: |
      Data Streams is a retained, ordered, replayable log with multiple independent
      consumers — pick it for real-time/replay/multi-consumer needs. Firehose does deliver
      to S3 (its main job), and Data Streams requires shard sizing unless you use On-Demand.
    ref: "concepts.md#high-volume-telemetry-ingestion-iot-core-to-kinesis-firehose-s3-and-analytics"

  - id: aws-iot-edge-computing-032
    difficulty: intermediate
    tags: [ingestion, firehose, latency]
    question: |
      A stakeholder expects sub-second dashboards but the pipeline is IoT rule → Firehose →
      S3 → Athena. What is the flaw?
    options:
      - "Firehose silently drops any record older than 24 hours before it reaches S3, so the dashboard misses data"
      - "Firehose buffers (up to ~900 s or ~128 MB for S3), adding seconds-to-minutes of latency — it is not real-time"
      - "Athena cannot read the Parquet format, so the dashboard queries fail to return any rows from S3"
      - "S3 is not durable enough for telemetry and loses objects under sustained high write throughput"
    answer: 1
    explanation: |
      Firehose is a buffered delivery service (up to 900 s / 128 MB for S3), so it adds
      seconds-to-minutes latency — unsuitable for sub-second dashboards. Use Kinesis Data
      Streams + a real-time consumer (or Timestream) instead. Firehose doesn't drop by age,
      Athena reads Parquet, and S3 is highly durable.
    ref: "concepts.md#high-volume-telemetry-ingestion-iot-core-to-kinesis-firehose-s3-and-analytics"

  - id: aws-iot-edge-computing-033
    difficulty: advanced
    tags: [ingestion, kinesis, limits, estimation]
    question: |
      1,000,000 devices each publish a 500-byte message every second (~500 MB/s aggregate).
      Sizing a provisioned Kinesis Data Stream, roughly how many shards are needed for
      ingest, and which per-shard limit governs it?
    options:
      - "~50 shards, governed by the 2 MB/s per-shard egress limit that also caps how fast producers can write"
      - "~5 shards, governed by a 100 MB/s per-shard ingest limit that Kinesis applies to provisioned streams"
      - "~500 shards, governed by the 1 MB/s (or 1000 records/s) per-shard ingest limit"
      - "Exactly 1 shard, because a provisioned Kinesis stream auto-scales its shard count infinitely on demand"
    answer: 2
    explanation: |
      Each shard ingests 1 MB/s (or 1000 records/s), so ~500 MB/s needs ~500 shards (also
      check the records/s bound). Egress is 2 MB/s per shard but ingest governs here. There
      is no 100 MB/s per-shard limit, and provisioned streams don't auto-scale (On-Demand
      does, to ~200 MB/s write).
    ref: "concepts.md#high-volume-telemetry-ingestion-iot-core-to-kinesis-firehose-s3-and-analytics"

  - id: aws-iot-edge-computing-034
    difficulty: advanced
    tags: [ingestion, iot-analytics, deprecation]
    question: |
      A colleague proposes AWS IoT Analytics for a brand-new 2026 telemetry-analytics
      pipeline. What is the correct response?
    options:
      - "Approve it; IoT Analytics is AWS's actively-recommended default landing service for all new IoT analytics pipelines"
      - "Approve it only if the fleet exceeds 1 million devices, below which its per-message pricing is not cost-effective"
      - "Reject it because IoT Analytics can only ingest data over HTTPS batch upload and cannot consume MQTT telemetry"
      - "Reject it; AWS IoT Analytics reached end of support (Dec 2025) — use Firehose→S3+Athena/Glue, Timestream, or Managed Service for Apache Flink instead"
    answer: 3
    explanation: |
      AWS IoT Analytics reached end of support (Dec 2025) and should not be used for new
      designs; modern equivalents are Firehose→S3+Athena/Glue, Timestream, or Managed
      Service for Apache Flink. Fleet size is irrelevant, and its retirement — not an
      ingestion limitation — is the reason.
    ref: "concepts.md#high-volume-telemetry-ingestion-iot-core-to-kinesis-firehose-s3-and-analytics"

  - id: aws-iot-edge-computing-035
    difficulty: expert
    tags: [ingestion, kinesis, efo]
    question: |
      Four independent consumer applications must each read a Kinesis Data Stream at full
      throughput with low fan-out latency, without competing for the shared 2 MB/s egress.
      Which feature addresses this and what does it cost?
    options:
      - "Enhanced Fan-Out (EFO): each consumer gets a dedicated 2 MB/s per shard via HTTP/2 push, at additional per-consumer cost"
      - "Standard (shared) consumers, which never share bandwidth because each poll gets its own isolated egress budget"
      - "Firehose, which transparently gives every downstream consumer its own dedicated delivery stream at no extra charge"
      - "Increasing the record payload size to 128 KiB so each poll returns enough data to satisfy all four consumers"
    answer: 0
    explanation: |
      Enhanced Fan-Out gives each registered consumer a dedicated 2 MB/s-per-shard pipe
      with push delivery, avoiding contention — at extra cost per consumer. Standard
      consumers share the 2 MB/s egress; Firehose isn't a multi-consumer log; payload size
      doesn't solve fan-out contention.
    ref: "concepts.md#high-volume-telemetry-ingestion-iot-core-to-kinesis-firehose-s3-and-analytics"

  # ---------------- Greengrass ----------------
  - id: aws-iot-edge-computing-036
    difficulty: beginner
    tags: [greengrass, edge-runtime]
    question: |
      What is AWS IoT Greengrass?
    options:
      - "A managed MQTT broker that runs only inside AWS regions and accepts device connections purely over the internet"
      - "An edge runtime installed on a gateway/device that runs local compute, ML, a local MQTT broker, and buffers/syncs data with IoT Core"
      - "A time-series database for telemetry that stores device readings with automatic hot-to-cold tiering by retention policy"
      - "A CDN for firmware distribution that caches signed images at edge locations near each device for fast OTA downloads"
    answer: 1
    explanation: |
      Greengrass is the edge runtime bringing local compute, ML inference, a local MQTT
      broker, StreamManager buffering, and shadow sync to devices, syncing with IoT Core
      when connected. It is not a cloud-only broker, a database, or a CDN.
    ref: "concepts.md#aws-iot-greengrass-the-edge-runtime-local-compute-ml-and-sync"

  - id: aws-iot-edge-computing-037
    difficulty: intermediate
    tags: [greengrass, offline, streammanager]
    question: |
      Devices on ships lose satellite connectivity for hours daily. Which Greengrass
      capability prevents telemetry loss during outages by buffering locally and exporting
      when the link returns?
    options:
      - "The local MQTT broker (Moquette), which relays LAN messages between components but drops them when the uplink is down"
      - "Local shadows, which cache each device's desired/reported state on the gateway but hold no telemetry backlog"
      - "StreamManager (durable local stream buffering with prioritized export to Kinesis/S3/SiteWise)"
      - "IPC between components, the on-device channel components use to exchange messages but never to persist telemetry"
    answer: 2
    explanation: |
      StreamManager durably buffers streams on the device (surviving reboots) and
      automatically exports to Kinesis/S3/SiteWise when connectivity allows — the anti-loss
      mechanism for flaky links. The local broker handles LAN MQTT, local shadows handle
      state, IPC is inter-component comms.
    ref: "concepts.md#aws-iot-greengrass-the-edge-runtime-local-compute-ml-and-sync"

  - id: aws-iot-edge-computing-038
    difficulty: intermediate
    tags: [greengrass, v2, components]
    question: |
      What is the main architectural change in Greengrass v2 compared with v1?
    options:
      - "v2 removes all local compute capability, forcing every function to run in the cloud region rather than on the gateway"
      - "v2 can only run inside AWS regions and dropped the ability to be installed on an edge gateway or device"
      - "v2 drops support for the local MQTT broker, so LAN devices must now connect directly to the cloud endpoint"
      - "v2 is component-based: each capability is a versioned component deployed from the cloud, replacing v1's monolithic groups"
    answer: 3
    explanation: |
      Greengrass v2 introduced a modular, versioned component model deployed via the cloud,
      replacing v1's monolithic group deployments. It retains local compute, edge
      operation, and the local MQTT broker.
    ref: "concepts.md#aws-iot-greengrass-the-edge-runtime-local-compute-ml-and-sync"

  - id: aws-iot-edge-computing-039
    difficulty: advanced
    tags: [greengrass, tradeoff, ops]
    question: |
      A team wants offline autonomy and considers rolling their own Docker/K3s edge stack
      instead of Greengrass. What does Greengrass provide out of the box that they'd
      otherwise have to build?
    options:
      - "Managed OTA component deployment, cloud-integrated device identity, StreamManager buffering, and shadow sync"
      - "Nothing meaningful; a hand-rolled Docker/K3s stack already ships identical OTA and device-identity features out of the box"
      - "A fully managed Kubernetes control plane that Greengrass runs on every gateway to orchestrate edge containers"
      - "Unlimited compute at the edge at no charge, since Greengrass bills only for cloud-side control-plane API calls"
    answer: 0
    explanation: |
      Greengrass gives managed OTA deployment, cloud identity integration, StreamManager,
      and shadow sync without custom engineering. It is not a managed K8s control plane and
      compute isn't free — you'd choose a custom stack only for needs Greengrass can't meet
      (e.g. full Kubernetes).
    ref: "concepts.md#aws-iot-greengrass-the-edge-runtime-local-compute-ml-and-sync"

  - id: aws-iot-edge-computing-040
    difficulty: advanced
    tags: [greengrass, ml, hybrid]
    question: |
      You need image-based anomaly detection running with low latency at a remote site
      that often loses connectivity. What is the standard AWS pattern?
    options:
      - "Send every camera image to a regional SageMaker real-time endpoint for inference and cache the verdict back on the device"
      - "Train the model in the cloud (e.g. SageMaker), then deploy it as a Greengrass ML component to run inference locally at the edge"
      - "Store each captured image in the device's shadow document and run the anomaly model only once the site reconnects"
      - "Run the anomaly-detection model directly inside the IoT rules engine SQL as messages arrive at the cloud broker"
    answer: 1
    explanation: |
      "Train in the cloud, infer at the edge": SageMaker-trained models are deployed as
      Greengrass ML components for local, low-latency, offline-capable inference. Cloud
      endpoints add latency and fail offline; shadows aren't for images; the rules engine
      doesn't run ML models.
    ref: "concepts.md#aws-iot-greengrass-the-edge-runtime-local-compute-ml-and-sync"

  - id: aws-iot-edge-computing-041
    difficulty: expert
    tags: [greengrass, resilience, regional-failure]
    question: |
      During an IoT Core regional impairment, what happens to a well-designed Greengrass
      edge deployment, and why is this a resilience argument for edge?
    options:
      - "All local devices immediately stop functioning and cannot make any decisions until the impaired region fully recovers"
      - "Greengrass automatically fails over to a healthy secondary AWS region with zero configuration, replicating the registry for you"
      - "Greengrass keeps operating locally (local broker, local shadows, local compute) and StreamManager buffers data until the region recovers"
      - "The local shadows are wiped from the gateway and every device must be fully re-provisioned once the region comes back"
    answer: 2
    explanation: |
      Because compute, the MQTT broker, and shadows run locally, Greengrass continues
      operating and buffers data during a cloud outage — a core edge resilience benefit.
      There is no automatic cross-region IoT failover (registry/shadows don't auto-
      replicate), and local shadows aren't wiped.
    ref: "concepts.md#aws-iot-greengrass-the-edge-runtime-local-compute-ml-and-sync"

  # ---------------- Edge infra: Local Zones / Outposts / Wavelength ----------------
  - id: aws-iot-edge-computing-042
    difficulty: beginner
    tags: [edge-infra, wavelength]
    question: |
      Which AWS edge offering embeds compute inside telecom 5G networks for ultra-low
      latency to mobile users?
    options:
      - "AWS Outposts"
      - "AWS Local Zones"
      - "AWS IoT Greengrass"
      - "AWS Wavelength"
    answer: 3
    explanation: |
      Wavelength places compute inside 5G carrier networks so mobile traffic reaches it
      without going to the region — ideal for AR/VR, connected cars, mobile gaming.
      Outposts is on-prem, Local Zones is metro-edge, Greengrass is a device runtime.
    ref: "concepts.md#edge-infrastructure-local-zones-outposts-and-wavelength"

  - id: aws-iot-edge-computing-043
    difficulty: intermediate
    tags: [edge-infra, outposts, residency]
    question: |
      A regulated workload must keep data inside your own data center but you want to use
      AWS EC2/EBS APIs on site. Which offering fits?
    options:
      - "AWS Outposts (a rack of AWS hardware in your own data center)"
      - "AWS Local Zones (AWS-owned metro sites, not your building)"
      - "AWS Wavelength (compute inside a 5G carrier network)"
      - "CloudFront edge locations (a CDN cache, not EC2/EBS)"
    answer: 0
    explanation: |
      Outposts puts AWS hardware/APIs physically in your data center for residency and
      on-prem low-latency integration. Local Zones are AWS-owned metro facilities (not your
      building), Wavelength is carrier-network mobile edge, and CloudFront is a CDN.
    ref: "concepts.md#edge-infrastructure-local-zones-outposts-and-wavelength"

  - id: aws-iot-edge-computing-044
    difficulty: intermediate
    tags: [edge-infra, local-zones]
    question: |
      A latency-sensitive media application needs single-digit-millisecond latency to users
      in a specific metro area, but the company owns no data center there. Which is the
      best fit?
    options:
      - "AWS Outposts shipped to a rented closet in that metro"
      - "AWS Local Zones in that metro"
      - "AWS Wavelength, regardless of whether users are on 5G"
      - "Greengrass installed on each user's laptop"
    answer: 1
    explanation: |
      Local Zones place AWS infrastructure in a specific metro for low latency without you
      owning a DC. Outposts requires you to host hardware; Wavelength targets 5G mobile
      users specifically; Greengrass on user laptops is not a media-serving pattern.
    ref: "concepts.md#edge-infrastructure-local-zones-outposts-and-wavelength"

  - id: aws-iot-edge-computing-045
    difficulty: advanced
    tags: [edge-infra, greengrass, selection]
    question: |
      Compute must run ON a machine on a factory floor that must keep making decisions when
      the internet is down. Local Zones, Outposts, Wavelength, or Greengrass?
    options:
      - "Local Zones, because a nearby metro facility keeps control-loop latency low enough"
      - "Wavelength, because factory-floor equipment connects through a private 5G network"
      - "Greengrass, because the compute must run on/near the device itself and operate offline"
      - "Outposts, because a rack on-site is the only way to keep computing offline"
    answer: 2
    explanation: |
      Greengrass runs compute on the device/gateway itself with full offline autonomy —
      the right tool for on-machine, disconnected operation. Local Zones/Wavelength are
      AWS-managed infra elsewhere; Outposts is a rack (still needs power/space and a region
      link) and is overkill for on-device control.
    ref: "concepts.md#edge-infrastructure-local-zones-outposts-and-wavelength"

  - id: aws-iot-edge-computing-046
    difficulty: advanced
    tags: [edge-infra, tradeoff, cost]
    question: |
      What is the general trade-off of choosing Local Zones/Outposts/Wavelength over a
      standard AWS region?
    options:
      - "They offer a broader catalog of services at a lower per-unit price than a standard parent region provides"
      - "They are entirely free to run and need no network link back to the parent region for any control-plane operation"
      - "They eliminate the need for any security controls because AWS fully isolates and manages the edge hardware for you"
      - "They cost more per unit, offer a subset of services, and add operational surface — justified only by a concrete latency/residency requirement"
    answer: 3
    explanation: |
      Edge infrastructure is pricier per unit, offers fewer services, and adds ops overhead,
      so use it only for a specific latency/residency need — otherwise the region +
      CloudFront is cheaper/simpler. They aren't free, still connect to the region, and
      don't remove security needs.
    ref: "concepts.md#edge-infrastructure-local-zones-outposts-and-wavelength"

  # ---------------- Security ----------------
  - id: aws-iot-edge-computing-047
    difficulty: beginner
    tags: [security, x509, auth]
    question: |
      What is the default, best-practice authentication mechanism for devices connecting to
      AWS IoT Core over MQTT?
    options:
      - "Unique X.509 client certificates with mutual TLS"
      - "A shared username and password for the whole fleet"
      - "Source-IP allowlisting on the broker endpoint only"
      - "No authentication; rely on topic obscurity"
    answer: 0
    explanation: |
      Per-device X.509 certs with mutual TLS are the default best practice, ideally with
      the private key in a secure element/TPM. Shared credentials, IP allowlists, or no
      auth are insecure and don't scale to per-device revocation.
    ref: "concepts.md#device-security-x509-certificates-policies-and-iot-device-defender"

  - id: aws-iot-edge-computing-048
    difficulty: intermediate
    tags: [security, iot-policy, least-privilege]
    question: |
      How do you ensure a compromised device can only publish/subscribe to ITS OWN topics
      and not the entire fleet's data?
    options:
      - "Give every device the iot:* action on topic/* so one shared policy covers the whole fleet for simplicity"
      - "Use IoT policies with policy variables (e.g. ${iot:Connection.Thing.ThingName}) so a device is scoped to its own topics"
      - "Rely on TLS transport encryption alone, trusting the encrypted channel to prevent cross-device topic access"
      - "Put all devices in one Thing Group and attach a single group policy that grants access to every device's topics"
    answer: 1
    explanation: |
      Policy variables like ${iot:Connection.Thing.ThingName} template the allowed topics to
      the connecting thing, enforcing least privilege per device. Granting iot:* is the
      opposite; TLS encrypts but doesn't authorize topics; group membership isn't
      authorization scoping.
    ref: "concepts.md#device-security-x509-certificates-policies-and-iot-device-defender"

  - id: aws-iot-edge-computing-049
    difficulty: intermediate
    tags: [security, device-defender]
    question: |
      What does AWS IoT Device Defender's "Detect" feature provide?
    options:
      - "Automatic issuance and rotation of each device's X.509 certificate during factory manufacturing"
      - "A fully managed MQTT broker that edge devices connect to for local pub/sub messaging on the LAN"
      - "Continuous behavioral anomaly detection (rule-based thresholds and ML models) that alarms on abnormal device behavior"
      - "Long-term time-series storage of device telemetry with automatic hot-to-cold retention tiering"
    answer: 2
    explanation: |
      Detect continuously monitors device behavior against rule-based thresholds and
      ML-learned baselines (messages/min, auth failures, bytes out, ports), alarming to SNS
      for quarantine. Audit (a sibling feature) checks config; it's not provisioning, a
      broker, or storage.
    ref: "concepts.md#device-security-x509-certificates-policies-and-iot-device-defender"

  - id: aws-iot-edge-computing-050
    difficulty: advanced
    tags: [security, custom-authorizer]
    question: |
      You must onboard legacy devices that authenticate with bearer tokens rather than
      X.509 certificates. Which IoT Core mechanism supports this?
    options:
      - "Fleet provisioning that swaps a shared claim cert at boot"
      - "Device Shadow named documents holding per-device state"
      - "Kinesis Enhanced Fan-Out for dedicated consumer throughput"
      - "A custom authorizer (Lambda) that validates the token"
    answer: 3
    explanation: |
      Custom authorizers run a Lambda to validate non-cert schemes like bearer tokens,
      bridging legacy devices. Fleet provisioning is for cert issuance, shadows are state,
      and EFO is a Kinesis consumer feature.
    ref: "concepts.md#device-security-x509-certificates-policies-and-iot-device-defender"

  - id: aws-iot-edge-computing-051
    difficulty: advanced
    tags: [security, device-defender, audit]
    question: |
      Which of these would AWS IoT Device Defender AUDIT flag as a fleet configuration
      problem?
    options:
      - "Overly permissive IoT policies, shared/duplicate certificates across devices, or certs about to expire"
      - "A device publishing valid telemetry at a steady, expected rate to its own authorized topic"
      - "A rule correctly teeing one message to both a Kinesis stream and a Timestream table"
      - "A device using a persistent MQTT session to resume its subscriptions after a brief drop"
    answer: 0
    explanation: |
      Audit checks configuration against best practices — overly permissive policies,
      shared/duplicate certs, expiring certs, disabled logging. Normal telemetry, valid
      fan-out rules, and persistent sessions are not misconfigurations.
    ref: "concepts.md#device-security-x509-certificates-policies-and-iot-device-defender"

  - id: aws-iot-edge-computing-052
    difficulty: expert
    tags: [security, tradeoff, secure-element]
    question: |
      What is the PRIMARY trade-off of storing each device's private key in a hardware
      secure element/TPM versus storing keys in device flash/software?
    options:
      - "Secure elements physically block the device from using MQTT, so any device with a TPM must fall back to HTTPS request/response and cannot hold a persistent broker connection"
      - "Hardware-protected keys give the smallest blast radius and clean per-device revocation but add manufacturing cost/complexity; software keys are cheap but a single extraction can compromise many devices"
      - "Software keys stored in flash are more secure than a TPM because they rotate over the air instantly, while a hardware secure element permanently locks one key for the device's life"
      - "There is no meaningful difference in blast radius, since an attacker who reaches the device can extract the key just as easily from a secure element as from plain flash storage"
    answer: 1
    explanation: |
      Hardware-rooted keys can't be easily extracted, minimizing blast radius and enabling
      per-device revocation — at higher manufacturing cost. Software-stored keys are cheaper
      but extraction risks many devices. Secure elements don't block MQTT, and software keys
      aren't more secure.
    ref: "concepts.md#device-security-x509-certificates-policies-and-iot-device-defender"

  # ---------------- Timestream / time-series storage ----------------
  - id: aws-iot-edge-computing-053
    difficulty: beginner
    tags: [timestream, time-series]
    question: |
      Which AWS service is purpose-built for storing and querying IoT time-series telemetry
      with SQL and automatic hot/cold tiering?
    options:
      - "Amazon RDS for PostgreSQL"
      - "Amazon S3 Glacier"
      - "Amazon Timestream"
      - "Amazon Neptune"
    answer: 2
    explanation: |
      Timestream is the serverless, purpose-built time-series DB with memory→magnetic
      tiering and time-series SQL functions. RDS is general OLTP, Glacier is cold archive,
      Neptune is a graph database.
    ref: "concepts.md#time-series-storage-amazon-timestream-and-alternatives"

  - id: aws-iot-edge-computing-054
    difficulty: intermediate
    tags: [timestream, tiering]
    question: |
      How does Amazon Timestream keep recent-data queries fast while retaining historical
      data cheaply?
    options:
      - "It keeps every record in a single high-speed in-memory tier forever, so old data is just as fast but never cheaper"
      - "It offloads all incoming data to S3 Glacier immediately on write, so even the newest readings are served from cold archive"
      - "It requires you to manually run a scheduled job that copies aging data from a hot table into a cheaper cold table"
      - "It uses a fast in-memory memory store for recent data and a cheaper magnetic store for history, with automatic tiering by retention policy"
    answer: 3
    explanation: |
      Timestream automatically tiers data from a hot memory store to a cheaper magnetic
      store per your retention policy, balancing query speed and storage cost. It does not
      keep everything in memory, dump straight to Glacier, or require manual movement.
    ref: "concepts.md#time-series-storage-amazon-timestream-and-alternatives"

  - id: aws-iot-edge-computing-055
    difficulty: intermediate
    tags: [storage, dynamodb, latest-value]
    question: |
      An application needs only the single latest reading per device, fetched with
      low-latency key lookups. Which store is the most appropriate?
    options:
      - "Amazon DynamoDB, keyed by device id storing the latest value"
      - "Amazon Timestream, scanning the full history each time"
      - "Amazon S3 + Athena, running a query per lookup"
      - "Amazon OpenSearch, full-text searching each request"
    answer: 0
    explanation: |
      "Latest value per device" is a key-value lookup — DynamoDB (keyed on device id) gives
      single-digit-ms reads. Timestream is for range/aggregation analytics, S3+Athena has
      high per-query latency, and OpenSearch is overkill for a keyed lookup.
    ref: "concepts.md#time-series-storage-amazon-timestream-and-alternatives"

  - id: aws-iot-edge-computing-056
    difficulty: advanced
    tags: [storage, s3, athena, cost]
    question: |
      You must retain years of raw telemetry as cheaply as possible for occasional ad-hoc
      SQL and ML training, accepting higher query latency. Which store fits best?
    options:
      - "Timestream's in-memory hot store, keeping all raw history in the fast tier"
      - "S3 (Parquet, partitioned) queried with Athena"
      - "DynamoDB with a TTL expiring old telemetry items after retention"
      - "ElastiCache in-memory cache holding the recent telemetry readings"
    answer: 1
    explanation: |
      S3 + Athena is the cheapest long-term retention for ad-hoc SQL and ML training data,
      trading query latency for cost. Timestream's memory tier is expensive for cold data,
      DynamoDB isn't built for analytics scans, and ElastiCache is volatile in-memory.
    ref: "concepts.md#time-series-storage-amazon-timestream-and-alternatives"

  - id: aws-iot-edge-computing-057
    difficulty: advanced
    tags: [timestream, cost, query]
    question: |
      Which statement about Amazon Timestream's cost model should shape your query design?
    options:
      - "Queries are always free regardless of data scanned, so only ingestion and stored bytes ever appear on the bill"
      - "Storage is entirely free but ingestion is billed at an unbounded, uncapped rate that dominates every invoice"
      - "Query cost scales with the amount of data scanned, so time-range and predicate scoping matter"
      - "It bills per active MQTT connection held open, so query shape and scanned bytes have no effect on cost"
    answer: 2
    explanation: |
      Timestream bills ingestion, tiered storage, and query compute based on data scanned —
      so scoping queries by time range/predicates controls cost. Queries aren't free,
      storage isn't free, and it has nothing to do with MQTT connections.
    ref: "concepts.md#time-series-storage-amazon-timestream-and-alternatives"

  # ---------------- Edge vs cloud processing ----------------
  - id: aws-iot-edge-computing-058
    difficulty: intermediate
    tags: [edge-vs-cloud, decision]
    question: |
      Which computation is best performed in the CLOUD rather than at the edge?
    options:
      - "A safety interlock that must react in single-digit milliseconds even during an internet outage"
      - "Filtering redundant raw data before it leaves a bandwidth-constrained site"
      - "A real-time control loop that must keep actuating the machine when the site is fully offline"
      - "Cross-device correlation and fleet-wide ML model training over long-term data"
    answer: 3
    explanation: |
      The global view — cross-device correlation and fleet-wide training — needs all data
      centrally and elastic scale, so it belongs in the cloud. Safety interlocks, control
      loops, and bandwidth-driven filtering are edge cases (latency/offline/bandwidth).
    ref: "concepts.md#edge-versus-cloud-processing-where-should-each-computation-run"

  - id: aws-iot-edge-computing-059
    difficulty: intermediate
    tags: [edge-vs-cloud, hybrid]
    question: |
      What is the typical "hybrid" IoT pattern that balances edge and cloud?
    options:
      - "Infer/aggregate at the edge and send summaries+anomalies to the cloud; train models centrally and deploy them to the edge"
      - "Do all inference, storage, and training at the edge and never send any data to the cloud at all"
      - "Do all processing in the cloud and never run any edge compute, backhauling every raw sample over the link"
      - "Randomly split each computation between edge and cloud on a per-message coin flip to balance the two"
    answer: 0
    explanation: |
      The common real-world answer: edge inference/aggregation with summaries+anomalies to
      the cloud, and central training of models pushed back to the edge ("train in the
      cloud, infer at the edge"). Pure-edge and pure-cloud extremes miss the balance.
    ref: "concepts.md#edge-versus-cloud-processing-where-should-each-computation-run"

  - id: aws-iot-edge-computing-060
    difficulty: advanced
    tags: [edge-vs-cloud, tradeoff]
    question: |
      Framed as a trade-off, what does moving a computation to the edge fundamentally
      exchange?
    options:
      - "It trades lower latency away in exchange for a large increase in backhaul bandwidth cost"
      - "It trades central consistency and low ops cost for latency, autonomy, and bandwidth savings"
      - "It trades away device security purely for developer convenience, with no other operational effect"
      - "It trades storage durability for raw throughput, keeping less data safe to move messages faster"
    answer: 1
    explanation: |
      Edge computation gains latency, offline autonomy, and bandwidth savings while giving
      up central consistency and adding operational cost (code to deploy/monitor/secure on
      hardware you don't fully control). The other framings misstate the exchange.
    ref: "concepts.md#edge-versus-cloud-processing-where-should-each-computation-run"

  # ---------------- Scaling & failure modes ----------------
  - id: aws-iot-edge-computing-061
    difficulty: advanced
    tags: [scaling, thundering-herd]
    question: |
      After a regional blip, millions of devices try to reconnect to IoT Core
      simultaneously. What best mitigates the resulting connection storm?
    options:
      - "Disable TLS mutual authentication so each reconnect skips the handshake and completes far faster"
      - "Increase the Device Shadow document size limit so more reconnect state fits per device"
      - "Jittered exponential backoff in device firmware plus proactively raised connection/sec quotas and staggered provisioning"
      - "Switch all devices from MQTT to HTTPS request/response so the broker holds no persistent connections"
    answer: 2
    explanation: |
      A thundering-herd reconnect is mitigated by jittered exponential backoff in firmware,
      raising connections/sec quotas ahead of time, and staggering fleets. Disabling TLS is
      insecure, shadow size is irrelevant, and HTTPS doesn't solve the storm.
    ref: "concepts.md#scaling-to-millions-of-devices-and-failure-modes"

  - id: aws-iot-edge-computing-062
    difficulty: advanced
    tags: [scaling, hot-shard, dynamodb]
    question: |
      A telemetry pipeline routes to DynamoDB keyed by "region", and one region dominates
      traffic. Which limit will this design hit first, and what's the fix?
    options:
      - "The 128 KiB MQTT payload limit; enable Basic Ingest so the region's messages batch into fewer writes"
      - "The 8 KB Device Shadow document limit; split the region's state across multiple named shadows"
      - "The Kinesis 2 MB/s per-shard egress limit; register Enhanced Fan-Out for the region's consumer"
      - "A hot partition capped at ~3000 RCU / 1000 WCU; spread the key (e.g. hash device id) to distribute writes"
    answer: 3
    explanation: |
      A low-cardinality partition key funnels a hot region into one DynamoDB partition,
      capped at ~3000 RCU / 1000 WCU, throttling well below fleet aggregate; fix by
      spreading the key (hash device id). The other limits aren't what a skewed DynamoDB key
      hits.
    ref: "concepts.md#scaling-to-millions-of-devices-and-failure-modes"

  - id: aws-iot-edge-computing-063
    difficulty: expert
    tags: [scaling, multiregion, dr]
    question: |
      A stakeholder assumes IoT Core will "just fail over to another region" automatically.
      What is the accurate design caveat?
    options:
      - "IoT Core is regional; the registry and shadows do not auto-replicate, so multi-region IoT requires deliberate design (replicate config, point devices at a secondary endpoint)"
      - "IoT Core is a single global endpoint, so failover is unnecessary and devices reach any region transparently"
      - "IoT Core continuously replicates every device's registry entry and shadow to all regions automatically"
      - "Only Greengrass-managed devices can ever participate in a multi-region IoT deployment at all"
    answer: 0
    explanation: |
      IoT Core is regional and its registry/shadows don't auto-replicate, so cross-region
      resilience must be explicitly engineered (config replication, secondary endpoint
      failover in firmware). It's not global, doesn't auto-replicate, and multi-region
      isn't exclusive to Greengrass.
    ref: "concepts.md#scaling-to-millions-of-devices-and-failure-modes"

  - id: aws-iot-edge-computing-064
    difficulty: expert
    tags: [scaling, connectivity, buffering]
    question: |
      A pure-cloud design (devices → IoT Core, no edge) is proposed for equipment that
      loses connectivity for hours. Which failure does this architecture NOT tolerate, and
      what fixes it?
    options:
      - "Broker connection overload during the outage; fix by adding more Kinesis shards to the ingest path"
      - "Long connectivity outages lose telemetry (QoS-1 persistent sessions only cover brief drops with a ~1 h queued TTL); fix by buffering at the edge with Greengrass StreamManager"
      - "Device certificate expiry while disconnected; fix by switching the fleet from MQTT to HTTPS request/response"
      - "Hot DynamoDB partitions from the reconnect burst; fix by moving the telemetry store to Timestream"
    answer: 1
    explanation: |
      Without edge buffering, hours-long outages lose data — QoS-1/persistent sessions only
      cover short drops (queued-message TTL ~1 h). Greengrass StreamManager buffers durably
      and exports on reconnect. The other options address unrelated problems.
    ref: "concepts.md#scaling-to-millions-of-devices-and-failure-modes"

  - id: aws-iot-edge-computing-065
    difficulty: advanced
    tags: [scaling, throttling, backpressure]
    question: |
      A rule action delivers to a downstream that is throttling (e.g. a Kinesis shard at
      capacity). Without mitigation, what happens, and what is the safe design?
    options:
      - "Messages queue in the device's shadow document indefinitely until the shard drains, so no action is needed"
      - "IoT Core automatically provisions and pays for additional Kinesis shards on your behalf when it detects throttling"
      - "Throttled deliveries risk dropped data; route overflow to the rule's error action (SQS/S3 DLQ) and scale the downstream (more shards/On-Demand)"
      - "The devices are simply billed an overage fee but the throttled data is retained and delivered automatically"
    answer: 2
    explanation: |
      Downstream throttling can drop data; capture overflow in the rule error action (DLQ)
      and scale the sink (add shards or use On-Demand). Shadows don't queue telemetry, IoT
      Core doesn't auto-provision downstream capacity, and data isn't preserved by default.
    ref: "concepts.md#scaling-to-millions-of-devices-and-failure-modes"

  # ---------------- Trade-offs cheat-sheet / scenario ----------------
  - id: aws-iot-edge-computing-066
    difficulty: intermediate
    tags: [tradeoff, ingestion, selection]
    question: |
      Which pairing of requirement → AWS ingestion target is CORRECT?
    options:
      - "Real-time analytics with ordered replay for multiple consumers → Kinesis Data Firehose"
      - "Single latest value per device for a low-latency app lookup → Amazon Timestream"
      - "Time-range aggregation dashboards over recent history → DynamoDB item scans"
      - "Land telemetry durably in S3 with no consumer code → Kinesis Data Firehose"
    answer: 3
    explanation: |
      Firehose is the zero-code "land in S3" path. Real-time/replay → Kinesis Data Streams
      (not Firehose); latest-value → DynamoDB (not Timestream); time-range dashboards →
      Timestream (not DynamoDB). The other three invert the correct mapping.
    ref: "concepts.md#trade-offs-and-when-to-use-what-a-decision-cheat-sheet"

  - id: aws-iot-edge-computing-067
    difficulty: expert
    tags: [scenario, end-to-end, estimation]
    question: |
      5 million devices each send a 300-byte reading every 10 seconds (~150,000 msg/s,
      ~45 MB/s). Requirements: durable long-term storage for ML, near-real-time anomaly
      dashboards, and minimal broker cost. Which end-to-end design is best?
    options:
      - "Devices → MQTT Basic Ingest → IoT rule teeing to Firehose→S3(Parquet) for storage AND Kinesis Data Streams→stream processor→Timestream for near-real-time dashboards"
      - "Devices → HTTPS POST per reading → Lambda invoked per message → DynamoDB as both the ML store and the dashboard source"
      - "Devices → MQTT → Device Shadow desired/reported updates → Fleet Indexing queries powering the anomaly dashboards and ML export"
      - "Devices → MQTT → a single Lambda action per message → one S3 PutObject per reading feeding both storage and dashboards"
    answer: 0
    explanation: |
      Basic Ingest cuts broker cost; a rule tees to Firehose→S3(Parquet) for cheap ML
      storage and to Kinesis→processor→Timestream for near-real-time dashboards — matching
      all three requirements. HTTPS-per-reading and Lambda/PutObject-per-message are costly
      and don't scale; shadows aren't telemetry storage.
    ref: "concepts.md#high-volume-telemetry-ingestion-iot-core-to-kinesis-firehose-s3-and-analytics"

  - id: aws-iot-edge-computing-068
    difficulty: expert
    tags: [scenario, edge, selection]
    question: |
      An autonomous mining vehicle must make split-second obstacle decisions, runs a camera
      producing GBs/hour, and operates in tunnels with no connectivity for hours. Which
      design is most appropriate?
    options:
      - "Stream all raw camera frames over the uplink to a regional SageMaker real-time endpoint and act on the returned verdict"
      - "Run Greengrass on the vehicle: local ML inference for decisions, StreamManager buffering of summaries/anomalies, sync to IoT Core when back in coverage"
      - "Use AWS Wavelength in the 5G carrier network since the mining vehicles move around the site"
      - "Store each captured camera frame in the vehicle's Device Shadow and process the backlog once it reconnects"
    answer: 1
    explanation: |
      Split-second decisions + huge bandwidth + long offline periods is the textbook
      Greengrass edge case: local inference, StreamManager buffering, sync on reconnect.
      Regional inference fails offline and on bandwidth; Wavelength needs 5G coverage
      (absent in tunnels); shadows can't hold camera frames.
    ref: "concepts.md#edge-versus-cloud-processing-where-should-each-computation-run"

  - id: aws-iot-edge-computing-069
    difficulty: expert
    tags: [scenario, security, compromise]
    question: |
      A single field camera is enrolled into a botnet and starts scanning and exfiltrating
      data. Which combination of AWS IoT capabilities best contains this?
    options:
      - "Rely solely on the TLS-encrypted transport to block the camera's scanning and exfiltration traffic"
      - "Increase the Kinesis Data Streams shard count so the pipeline can absorb the camera's extra outbound traffic"
      - "Policy variables scoping each device to its own topics (limiting reach) + Device Defender Detect flagging the anomalous behavior + mitigation moving it to quarantine and revoking its certificate"
      - "Switch the whole fleet from MQTT to HTTPS request/response to stop the camera participating in the botnet"
    answer: 2
    explanation: |
      Least-privilege policy variables cap what one device can reach; Device Defender Detect
      spots the anomaly; mitigation quarantines the device and revokes its cert. TLS alone
      doesn't stop an authorized-but-compromised device, and shard count/HTTPS don't address
      compromise.
    ref: "concepts.md#device-security-x509-certificates-policies-and-iot-device-defender"

  - id: aws-iot-edge-computing-070
    difficulty: intermediate
    tags: [scenario, shadow, offline-config]
    question: |
      You must change a sleeping/offline device's configuration so it applies the change
      the moment it reconnects. What is the correct mechanism?
    options:
      - "Publish a direct MQTT command to the device's topic now and hope it happens to be online to receive it"
      - "Rewrite and reissue the device's X.509 certificate so the new configuration is embedded in its identity"
      - "Send the new configuration through Kinesis Data Firehose so it is buffered and delivered on reconnect"
      - "Update the device's shadow desired state; the device receives the delta and converges on reconnect"
    answer: 3
    explanation: |
      Setting shadow desired state persists the intent; the offline device gets the delta on
      reconnect and converges — exactly the shadow's purpose. A direct command is lost while
      offline, certs aren't config, and Firehose is an egress path, not device command.
    ref: "concepts.md#device-shadows-desired-versus-reported-state"

  - id: aws-iot-edge-computing-071
    difficulty: beginner
    tags: [tradeoff, protocol, selection]
    question: |
      For a battery-powered sensor that must also receive occasional pushed commands, which
      protocol is the reflexive choice?
    options:
      - "MQTT"
      - "HTTPS with periodic polling"
      - "Plain TCP with no TLS"
      - "SMTP"
    answer: 0
    explanation: |
      MQTT's low overhead and native server push fit battery devices needing commands —
      avoiding wasteful polling. HTTPS polling drains battery and adds latency; unencrypted
      TCP is insecure; SMTP is email, not IoT.
    ref: "concepts.md#message-protocols-mqtt-versus-http-versus-websocket"

  - id: aws-iot-edge-computing-072
    difficulty: advanced
    tags: [scenario, edge-infra, selection]
    question: |
      A cloud gaming service must stream to mobile players over 5G with the lowest possible
      round-trip latency. Which AWS edge option is purpose-built for this?
    options:
      - "AWS Outposts racked in a central data center serving the mobile players over the public internet"
      - "AWS Wavelength (compute embedded in the 5G carrier network)"
      - "AWS IoT Greengrass installed on each player's phone to render and stream the game frames locally"
      - "A larger, higher-clock EC2 instance in the parent region to shorten the round-trip to players"
    answer: 1
    explanation: |
      Wavelength embeds compute in the carrier's 5G network so traffic reaches it without
      hitting the region — minimizing mobile latency for game streaming. Outposts is on-prem,
      Greengrass is a device runtime (not a game server), and a bigger region instance
      doesn't cut network distance.
    ref: "concepts.md#edge-infrastructure-local-zones-outposts-and-wavelength"

  - id: aws-iot-edge-computing-073
    difficulty: intermediate
    tags: [greengrass, local-broker]
    question: |
      Several sensors on a factory LAN must exchange MQTT messages with each other and a
      local app even when the internet is down. What provides this?
    options:
      - "IoT Core's cloud broker only, relaying LAN messages via the region"
      - "A local Kinesis Data Streams shard used as the LAN message bus"
      - "The Greengrass local MQTT broker (Moquette) acting as the LAN gateway"
      - "A shared Device Shadow document used as the LAN pub/sub bus"
    answer: 2
    explanation: |
      Greengrass runs a local MQTT broker so nearby devices communicate on the LAN with no
      internet, syncing to IoT Core when connected. The cloud broker requires connectivity;
      Kinesis isn't a LAN broker; shadows aren't a local pub/sub bus.
    ref: "concepts.md#aws-iot-greengrass-the-edge-runtime-local-compute-ml-and-sync"

  - id: aws-iot-edge-computing-074
    difficulty: expert
    tags: [scenario, cost, basic-ingest]
    question: |
      A pipeline sends device data only to storage (no device-to-device pub/sub) but the
      IoT Core bill is dominated by messaging charges. Which change reduces cost with the
      least architectural disruption?
    options:
      - "Switch every device to HTTPS request/response, which AWS bills at a flat rate that excludes any messaging charge"
      - "Move all telemetry into each device's Device Shadow, since shadow updates are exempt from IoT Core messaging fees"
      - "Reduce every MQTT payload below the 5 KB billing block so the broker charges nothing for undersized messages"
      - "Use Basic Ingest ($aws/rules/<rule>) so messages go straight into the rule, incurring only the rules-engine cost and skipping the pub/sub broker charge"
    answer: 3
    explanation: |
      Basic Ingest bypasses the pub/sub message-broker charge for device→storage flows with
      no other subscribers, keeping only rules-engine cost — minimal disruption. HTTPS
      doesn't inherently cut costs, shadows aren't storage, and payload-size tweaks don't
      remove the broker charge model the way Basic Ingest does.
    ref: "concepts.md#iot-core-device-gateway-and-the-mqtt-broker"

  - id: aws-iot-edge-computing-075
    difficulty: beginner
    tags: [registry, thing-group]
    question: |
      What is a Thing Group primarily used for in AWS IoT?
    options:
      - "Organizing devices for bulk policy attachment, job targeting, and OTA rollouts"
      - "Storing each member device's high-frequency telemetry as an indexed history"
      - "Encrypting MQTT traffic between the group's member devices and the cloud broker"
      - "Sizing the Kinesis shards that the group's members publish their telemetry to"
    answer: 0
    explanation: |
      Thing Groups (static or dynamic) organize devices so you can attach policies in bulk,
      target jobs, and roll out OTA updates. They aren't telemetry storage, encryption, or
      shard sizing.
    ref: "concepts.md#device-registry-identity-and-fleet-organization"

  - id: aws-iot-edge-computing-076
    difficulty: advanced
    tags: [ingestion, kinesis, retention, replay]
    question: |
      A new analytics team needs to REPROCESS the last 7 days of telemetry with new code,
      and other consumers must keep reading live. Which choice supports this?
    options:
      - "Firehose, by rewinding its S3 buffer to re-emit the last 7 days to a fresh delivery stream"
      - "Kinesis Data Streams with retention set to 7 days, letting a new consumer replay from the start while existing consumers read independently"
      - "A Device Shadow history that retains the last 7 days of each device's reported state for replay"
      - "DynamoDB Streams configured with a 7-day TTL so the new consumer can re-read expired items"
    answer: 1
    explanation: |
      Kinesis Data Streams retains records (configurable up to 365 days; here 7) so a new
      consumer can replay while others read independently by their own position. Firehose has
      no replay, shadows keep no history, and DynamoDB Streams retains change records only
      ~24 h.
    ref: "concepts.md#high-volume-telemetry-ingestion-iot-core-to-kinesis-firehose-s3-and-analytics"

  - id: aws-iot-edge-computing-077
    difficulty: intermediate
    tags: [rules-engine, enrichment]
    question: |
      Inside a rule's SQL, how can you enrich an incoming message with a device's current
      shadow state before routing it?
    options:
      - "It is impossible; the rules engine is stateless and can never read a device's shadow"
      - "Only by first invoking a separate Step Functions workflow that fetches and injects the state"
      - "Call get_thing_shadow(...) (or another supported function) within the rule SQL SELECT"
      - "By raising the shadow size limit to 128 KiB so the full state auto-attaches to each message"
    answer: 2
    explanation: |
      Rule SQL supports external functions like get_thing_shadow(), aws_lambda(), and
      DynamoDB lookups to enrich messages inline before routing. Enrichment is possible
      without Step Functions, and shadow size limits are unrelated.
    ref: "concepts.md#the-rules-engine-routing-messages-to-aws-services"

  - id: aws-iot-edge-computing-078
    difficulty: expert
    tags: [scenario, residency, outposts, tradeoff]
    question: |
      A bank must run IoT device management and analytics but regulation forbids ANY device
      data leaving the country, and no AWS region exists in that country. Which approach
      best satisfies residency while keeping AWS tooling?
    options:
      - "Use the nearest foreign AWS region and rely on at-rest encryption to satisfy the residency rule"
      - "Deploy Wavelength in a neighboring country's 5G network, treating the carrier edge as in-country"
      - "Store all device data in a globally-replicated Device Shadow that AWS pins to the required country"
      - "Deploy AWS Outposts (or in-country on-prem Greengrass) so AWS services/data stay in-country, exporting only permitted derived data"
    answer: 3
    explanation: |
      Residency that forbids data leaving the country requires in-country infrastructure —
      Outposts (AWS hardware on-site) or on-prem Greengrass — with only compliant derived
      data exported. Encryption doesn't change data location, a foreign region/Wavelength
      still leaves the country, and shadows aren't a residency mechanism.
    ref: "concepts.md#edge-infrastructure-local-zones-outposts-and-wavelength"

  - id: aws-iot-edge-computing-079
    difficulty: beginner
    tags: [iot-core, mental-model]
    question: |
      Which statement best captures the role of AWS IoT Core in a telemetry architecture?
    options:
      - "It is the front door (managed MQTT broker + rules engine + device shadows) that routes data to other services rather than storing it long-term"
      - "It is the durable long-term data warehouse that indexes and retains all fleet telemetry for analytics"
      - "It is a single service that fully replaces Kinesis, S3, and Timestream in the telemetry stack"
      - "It is the runtime that executes the fleet's machine-learning inference models directly at the edge"
    answer: 0
    explanation: |
      IoT Core is the front door: broker + rules engine + shadows, deliberately routing
      telemetry out (to Kinesis/Firehose/Timestream/S3) rather than storing it. It is not a
      warehouse, a replacement for storage/streaming services, or an edge ML runtime
      (that's Greengrass).
    ref: "concepts.md#iot-core-device-gateway-and-the-mqtt-broker"

  - id: aws-iot-edge-computing-080
    difficulty: advanced
    tags: [scenario, protocol, iot-core, tradeoff]
    question: |
      A mobile app (not a browser) must both send user actions to and receive live pushes
      from IoT Core, authenticated via Amazon Cognito. Which approach fits best?
    options:
      - "Raw MQTT over TCP 8883 with a per-user X.509 certificate provisioned through the app store"
      - "MQTT over WebSocket authenticated with SigV4 credentials from Cognito, giving bi-directional push over 443"
      - "HTTPS polling every few seconds with a single shared API key baked into the mobile app"
      - "A direct Kinesis Data Streams consumer embedded in the mobile app reading the raw telemetry shards"
    answer: 1
    explanation: |
      Cognito-authenticated apps use SigV4 over MQTT-over-WebSocket for bi-directional push
      over 443 without managing per-user device certs. Per-user X.509 in an app is
      impractical, HTTPS polling loses push, and embedding a Kinesis consumer in the app is
      an anti-pattern.
    ref: "concepts.md#message-protocols-mqtt-versus-http-versus-websocket"
