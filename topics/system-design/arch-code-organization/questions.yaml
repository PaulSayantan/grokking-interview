topic: "Code-Organization Architectures (Layered, Hexagonal, Clean, Microkernel)"
domain: system-design
topic_slug: arch-code-organization
version: 1
questions:
  - id: arch-code-organization-001
    difficulty: beginner
    tags: [altitude, design-patterns, fundamentals]
    question: |
      What best distinguishes an architectural STYLE (like Clean Architecture)
      from a design pattern (like Repository)?
    options:
      - "A style applies only to distributed microservices, while a design pattern can only ever be used inside a single monolith"
      - "A style is tied to one programming language, whereas a design pattern is a language-agnostic idea that ports across every stack"
      - "There is no meaningful difference at all; the two terms are fully interchangeable and describe the exact same concept"
      - "A style structures the whole application and its dependency direction; a design pattern wires a few objects inside a module"
    answer: 3
    explanation: |
      Architectural styles operate at the application altitude (module shape,
      dependency direction, deployment unit). Design patterns (dp-*) solve
      object-level wiring inside a module. Repository/Adapter are tactics that
      implement a style's rule such as "invert the persistence dependency."
    ref: "concepts.md#architectural-styles-versus-design-patterns"
  - id: arch-code-organization-002
    difficulty: intermediate
    tags: [altitude, dependency-inversion, repository]
    question: |
      Clean Architecture states "the business core must not depend on the
      database." Which design pattern is the typical TACTIC used to obey that
      rule?
    options:
      - "Singleton (guaranteeing exactly one shared instance app-wide)"
      - "Flyweight (sharing immutable state to reduce memory use)"
      - "Interpreter (evaluating expressions in a small grammar)"
      - "Repository (with an interface defined in the domain)"
    answer: 3
    explanation: |
      The domain defines a Repository interface and the infrastructure ring
      implements it, so the source dependency points inward. Repository (and
      Adapter) are the object-level tactics that satisfy the architectural rule.
      See dp-enterprise-application for the pattern deep dive.
    ref: "concepts.md#architectural-styles-versus-design-patterns"
  - id: arch-code-organization-003
    difficulty: beginner
    tags: [layered, fundamentals]
    question: |
      In a classic Layered (N-Tier) architecture, what is the typical order of
      layers from the client inward?
    options:
      - "Persistence -> Presentation -> Business -> Database"
      - "Business -> Presentation -> Database -> Persistence"
      - "Presentation -> Business -> Persistence -> Database"
      - "Database -> Business -> Presentation -> Persistence"
    answer: 2
    explanation: |
      The canonical stack is Presentation -> Business -> Persistence -> Database,
      each layer calling only the one directly below it.
    ref: "concepts.md#layered-and-n-tier-architecture"
  - id: arch-code-organization-004
    difficulty: intermediate
    tags: [layered, layers-of-isolation, closed-layers]
    question: |
      What does it mean for a layer in a Layered architecture to be "closed"?
    options:
      - "Its compiled code is frozen and cannot be modified in any way once it is deployed"
      - "All of the data flowing through it is automatically encrypted at rest"
      - "A request must pass through it and cannot skip it to reach a lower layer"
      - "It always runs isolated in its own separate operating-system process"
    answer: 2
    explanation: |
      Closed layers enforce layers of isolation: a request passes through each
      layer in turn. Opening a layer allows skipping it but weakens the isolation
      contract.
    ref: "concepts.md#layered-and-n-tier-architecture"
  - id: arch-code-organization-005
    difficulty: advanced
    tags: [layered, sinkhole, anti-pattern]
    question: |
      A team notices that ~80% of requests fall straight through the presentation,
      business, and persistence layers doing no real logic. What is this called and
      what does it imply?
    options:
      - "Healthy pass-through behavior, which is the ideal steady operating state for a layered system"
      - "The mediator topology, a clear sign of a well-factored event-driven design"
      - "The architecture sinkhole anti-pattern, implying layered may be the wrong style here"
      - "A cache stampede problem, which is best resolved by adding a request rate limiter"
    answer: 2
    explanation: |
      When most requests are pure pass-through with no business value added, it is
      the architecture sinkhole anti-pattern. A small percentage is fine; a large
      percentage signals layered adds cost without value for that workload.
    ref: "concepts.md#layered-and-n-tier-architecture"
  - id: arch-code-organization-006
    difficulty: intermediate
    tags: [layered, dependency-direction, testability]
    question: |
      Why is business logic in a traditional Layered architecture often hard to
      unit-test in isolation?
    options:
      - "Because dependencies point downward toward the database, so the domain depends on persistence"
      - "Because the business layer is always written in a different programming language than the UI layer"
      - "Because the layered style strictly forbids the domain from ever using interfaces or abstractions"
      - "Because each layer is required to run on its own separate physical server in production"
    answer: 0
    explanation: |
      In layered systems dependencies point down toward the DB; the business layer
      depends on persistence, so testing it usually requires the database. The
      inward-pointing styles were invented to fix exactly this.
    ref: "concepts.md#layered-and-n-tier-architecture"
  - id: arch-code-organization-007
    difficulty: beginner
    tags: [layered, when-to-use]
    question: |
      For which situation is a Layered architecture the most sensible default?
    options:
      - "A platform that must accept third-party plug-ins at runtime"
      - "A small app or MVP built by a team organized around technical roles"
      - "A workload needing near-linear elastic scaling under spiky load"
      - "A system requiring independent deployment of every feature"
    answer: 1
    explanation: |
      Layered shines for small apps, MVPs, tight budgets, and teams split by
      technical skill. The other scenarios point to microkernel, space-based, and
      microservices respectively.
    ref: "concepts.md#layered-and-n-tier-architecture"
  - id: arch-code-organization-008
    difficulty: intermediate
    tags: [layered, n-tier, deployment]
    question: |
      What is the distinction between "layers" and "tiers"?
    options:
      - "Layers are the physical machines in a rack; tiers are the logical groupings of code that run on them"
      - "They are completely identical concepts that merely happen to be spelled with two different words"
      - "Layers apply exclusively to frontend UI code, whereas tiers apply only to backend database engines"
      - "Layers are logical partitions of code; tiers are physical deployment boundaries"
    answer: 3
    explanation: |
      Layers are the logical separation of concerns; tiers are physical
      deployment units (separate machines/processes). They often coincide but are
      not the same thing.
    ref: "concepts.md#layered-and-n-tier-architecture"
  - id: arch-code-organization-009
    difficulty: beginner
    tags: [hexagonal, ports-adapters, fundamentals]
    question: |
      In Hexagonal Architecture, what is a "port"?
    options:
      - "A numbered TCP/IP network port, such as 8080, that the application binds to and listens on"
      - "A technology-agnostic interface through which the core talks to the outside world"
      - "A physical pool of pre-opened database connections that the core borrows from at runtime"
      - "A reusable UI widget component that renders domain data onto the user's screen"
    answer: 1
    explanation: |
      Ports are technology-agnostic interfaces. Adapters translate between a
      concrete technology and a port. The word has nothing to do with network
      ports.
    ref: "concepts.md#hexagonal-architecture-ports-and-adapters"
  - id: arch-code-organization-010
    difficulty: intermediate
    tags: [hexagonal, driving-driven, adapters]
    question: |
      In Ports & Adapters, which of these is a DRIVING (primary) adapter?
    options:
      - "A database adapter the core calls to persist data"
      - "A message-bus adapter the core publishes to"
      - "An SMTP client the core uses to send email"
      - "A REST controller or test harness that invokes the core"
    answer: 3
    explanation: |
      Driving/primary adapters are actors that drive the app (UI, REST, CLI,
      tests). Driven/secondary adapters are things the app drives (DB, message
      bus, email).
    ref: "concepts.md#hexagonal-architecture-ports-and-adapters"
  - id: arch-code-organization-011
    difficulty: advanced
    tags: [hexagonal, dependency-inversion, driven-ports]
    question: |
      Who defines a DRIVEN (secondary) port's interface in Hexagonal
      Architecture, and why does that matter?
    options:
      - "The core defines it and adapters implement it, so infrastructure depends on the core (dependency inversion)"
      - "The database vendor ships it as part of its driver, so the core must match the DB's native API"
      - "The adapter defines it and the core implements it, so the core adapts to each technology"
      - "A neutral shared library that lives outside both rings, so that neither the core nor the adapter depends on the other"
    answer: 0
    explanation: |
      The core defines driven ports; adapters implement them. That inverts the
      dependency so infrastructure depends on the core, never the reverse, which
      is what enables swapping the DB or framework without touching business code.
    ref: "concepts.md#hexagonal-architecture-ports-and-adapters"
  - id: arch-code-organization-012
    difficulty: intermediate
    tags: [hexagonal, hexagon, misconception]
    question: |
      What does the "hexagon" shape in Hexagonal Architecture signify?
    options:
      - "That the application must be built from exactly six horizontal layers, no more and no fewer"
      - "That an application is strictly limited to connecting with exactly six external systems"
      - "That it maps to the six mandatory phases of the request-processing lifecycle"
      - "It is symbolic — many sides means room for many adapters, not six of anything"
    answer: 3
    explanation: |
      Cockburn chose the hexagon only to convey "many sides / many adapters" and
      to leave room for drawing ports. The number six is not meaningful.
    ref: "concepts.md#hexagonal-architecture-ports-and-adapters"
  - id: arch-code-organization-013
    difficulty: intermediate
    tags: [hexagonal, testability, ilities]
    question: |
      Which quality attribute does Hexagonal Architecture most directly optimize?
    options:
      - "Raw request throughput and end-to-end performance under heavy load"
      - "Elastic horizontal scalability across many stateless nodes"
      - "Minimal total lines of code and the smallest possible binary size"
      - "Testability of the domain in isolation via fake adapters"
    answer: 3
    explanation: |
      By isolating the core behind ports, you can substitute fake/in-memory
      adapters and unit-test business rules without infrastructure. It is neutral
      on raw performance and usually still deploys as one unit.
    ref: "concepts.md#hexagonal-architecture-ports-and-adapters"
  - id: arch-code-organization-014
    difficulty: advanced
    tags: [hexagonal, when-to-avoid, over-engineering]
    question: |
      When is Hexagonal Architecture most likely to be over-engineering?
    options:
      - "A long-lived app with rich domain rules and a TDD/DDD team"
      - "A system that must swap databases during its lifetime"
      - "A thin CRUD app with almost no domain logic"
      - "A system needing to isolate business rules from a volatile framework"
    answer: 2
    explanation: |
      For thin CRUD with no meaningful domain logic, the ports, adapters, and
      mapping become ceremony with little payoff. The other cases are exactly
      where hexagonal pays off.
    ref: "concepts.md#hexagonal-architecture-ports-and-adapters"
  - id: arch-code-organization-015
    difficulty: beginner
    tags: [clean, rings, fundamentals]
    question: |
      From innermost to outermost, what is the order of Clean Architecture's four
      concentric circles?
    options:
      - "Entities -> Use Cases -> Interface Adapters -> Frameworks & Drivers"
      - "Frameworks & Drivers -> Interface Adapters -> Use Cases -> Entities"
      - "Use Cases -> Entities -> Frameworks & Drivers -> Interface Adapters"
      - "Interface Adapters -> Entities -> Use Cases -> Frameworks & Drivers"
    answer: 0
    explanation: |
      Inside out: Entities (enterprise rules) -> Use Cases (application rules) ->
      Interface Adapters -> Frameworks & Drivers (the volatile details).
    ref: "concepts.md#clean-architecture"
  - id: arch-code-organization-016
    difficulty: intermediate
    tags: [clean, dependency-rule]
    question: |
      What does Clean Architecture's "Dependency Rule" state?
    options:
      - "Every module, including the innermost entities, must hold a direct source-code dependency on the database"
      - "Dependencies may point in any direction at all, as long as every one of them is supplied via injection"
      - "Source-code dependencies point only inward; inner circles know nothing about outer ones"
      - "Outer circles must always be compiled first, before any of the inner circles can be compiled"
    answer: 2
    explanation: |
      The Dependency Rule is the core of Clean Architecture: source dependencies
      point inward only, so entities and use cases have no knowledge of frameworks
      or the DB.
    ref: "concepts.md#clean-architecture"
  - id: arch-code-organization-017
    difficulty: advanced
    tags: [clean, entities-use-cases, distinction]
    question: |
      In Clean Architecture, how do Entities differ from Use Cases?
    options:
      - "Entities hold transient UI screen state, while Use Cases hold and manage the open database connections"
      - "Entities are plain data-transfer objects, while Use Cases are the framework's request-handling controllers"
      - "Entities are enterprise-wide business rules; Use Cases are application-specific rules that orchestrate entities"
      - "They are simply two different names for one and the same concentric ring in the diagram"
    answer: 2
    explanation: |
      Entities are the most general, longest-lived enterprise rules; Use Cases are
      application-specific rules that orchestrate entities for a particular
      application. This entities-vs-use-cases split is a distinguishing feature of
      Clean.
    ref: "concepts.md#clean-architecture"
  - id: arch-code-organization-018
    difficulty: advanced
    tags: [clean, boundary-crossing, dependency-inversion]
    question: |
      A Clean Architecture use case needs data from the database. Control flow
      must cross outward. How is the source dependency kept pointing inward?
    options:
      - "The inner ring defines an interface and the outer ring implements it (dependency inversion)"
      - "The use case simply imports and calls the concrete database driver package directly at the point of need"
      - "The outer ring defines the interface and forces the inner use case to implement that outer contract"
      - "You quietly waive the Dependency Rule for persistence, treating the database as a special exception"
    answer: 0
    explanation: |
      When control must flow outward, you invert the dependency: the inner circle
      defines an interface, the outer implements it, so the source-code dependency
      still points inward.
    ref: "concepts.md#clean-architecture"
  - id: arch-code-organization-019
    difficulty: intermediate
    tags: [clean, trade-offs, ceremony]
    question: |
      What is the most commonly cited downside of Clean Architecture?
    options:
      - "It couples the domain tightly to the database layer"
      - "Heaviest ceremony: many boundary DTOs, mappers, and interfaces"
      - "It makes the core domain logic impossible to unit-test"
      - "It forces every feature into a separate microservice"
    answer: 1
    explanation: |
      Clean's explicit boundaries bring the most ceremony — DTOs, mappers, and
      interfaces at each boundary — which is overkill for small apps and steep for
      juniors.
    ref: "concepts.md#clean-architecture"
  - id: arch-code-organization-020
    difficulty: beginner
    tags: [onion, domain-model, fundamentals]
    question: |
      What sits at the center of Onion Architecture?
    options:
      - "The database"
      - "The user interface"
      - "The domain model"
      - "The message broker"
    answer: 2
    explanation: |
      Palermo's Onion inverts the traditional layered layout: the domain model is
      the center, and infrastructure is a swappable outer ring.
    ref: "concepts.md#onion-architecture"
  - id: arch-code-organization-021
    difficulty: intermediate
    tags: [onion, dependency-direction]
    question: |
      In Onion Architecture, which way do all dependencies point?
    options:
      - "Toward the outer infrastructure ring"
      - "Bidirectionally between adjacent rings"
      - "Toward the center (the domain model)"
      - "Downward toward the database, as in layered"
    answer: 2
    explanation: |
      All dependencies point toward the center; nothing in an inner ring
      references anything in an outer ring. The domain defines interfaces (e.g.
      repositories) that outer rings implement.
    ref: "concepts.md#onion-architecture"
  - id: arch-code-organization-022
    difficulty: advanced
    tags: [onion, ddd, origin]
    question: |
      Which statement best captures Onion Architecture's distinguishing claim
      relative to Clean and Hexagonal?
    options:
      - "It explicitly names the domain model (not 'entities') as the innermost ring and grew directly out of DDD"
      - "It mandates exactly six adapters, one for each of the six sides drawn on the hexagon"
      - "It forbids the use of interfaces, wiring the rings together with concrete classes only"
      - "It is the only one of the three that points its source dependencies outward to infrastructure"
    answer: 0
    explanation: |
      Onion explicitly centers the domain model and popularized "dependency
      inversion at the architecture level," emerging from DDD practice — while
      sharing the same inward-dependency idea as Clean and Hexagonal.
    ref: "concepts.md#onion-architecture"
  - id: arch-code-organization-023
    difficulty: intermediate
    tags: [hexagonal, clean, onion, comparison]
    question: |
      What is the single unifying idea shared by Hexagonal, Clean, and Onion
      architectures?
    options:
      - "They all mandate a microservices deployment with one service per bounded context"
      - "They all require a central event broker to mediate every call between the rings"
      - "Dependency inversion so dependencies point inward toward a technology-agnostic domain core"
      - "They all deploy each concentric layer onto its own separate physical tier"
    answer: 2
    explanation: |
      All three enforce inward-pointing dependencies toward a domain core, which
      buys testability (fake the infra) and swappable infrastructure. They differ
      mainly in vocabulary.
    ref: "concepts.md#hexagonal-versus-clean-versus-onion"
  - id: arch-code-organization-024
    difficulty: advanced
    tags: [hexagonal, clean, onion, comparison]
    question: |
      Which description most accurately maps each style's signature framing?
    options:
      - "Hexagonal = four named rings; Onion = ports and adapters; Clean = domain-model-centric rings"
      - "Hexagonal = ports/adapters with driving-vs-driven symmetry; Onion = domain-model-centric rings; Clean = 4 named rings with the Dependency Rule"
      - "All three mandate exactly the same ring count, terminology, and dependency direction"
      - "Hexagonal and Onion both point their dependencies outward, while only Clean points them inward"
    answer: 1
    explanation: |
      Hexagonal frames it as ports/adapters with driving/driven symmetry; Onion
      centers the domain model in rings; Clean names four rings and states the
      Dependency Rule with an entities-vs-use-cases split.
    ref: "concepts.md#hexagonal-versus-clean-versus-onion"
  - id: arch-code-organization-025
    difficulty: intermediate
    tags: [hexagonal, clean, onion, payoff]
    question: |
      Regardless of vocabulary, what two payoffs do Hexagonal/Clean/Onion all
      deliver by inverting dependencies toward the core?
    options:
      - "Lower request latency and noticeably smaller deployment binaries"
      - "Automatic horizontal scaling plus zero-downtime rolling deploys"
      - "Guaranteed strong consistency across all distributed services"
      - "Unit-testable business rules (fakes) and swappable infrastructure"
    answer: 3
    explanation: |
      With the domain depending on no infrastructure, you can test it with fakes
      and swap the DB/framework without editing the core. Those two are the shared
      payoff.
    ref: "concepts.md#hexagonal-versus-clean-versus-onion"
  - id: arch-code-organization-026
    difficulty: beginner
    tags: [microkernel, plug-in, fundamentals]
    question: |
      What are the two essential parts of a Microkernel (Plug-in) architecture?
    options:
      - "A load balancer paired with a durable message broker for routing all requests"
      - "A primary write database plus one or more asynchronous read replicas"
      - "A minimal core system plus independent plug-in components registered against a contract"
      - "A presentation frontend tier and a backend business-logic tier"
    answer: 2
    explanation: |
      A microkernel is a minimal core (with a plug-in registry and contract) plus
      independent plug-in components that add feature capability.
    ref: "concepts.md#microkernel-and-plug-in-architecture"
  - id: arch-code-organization-027
    difficulty: intermediate
    tags: [microkernel, examples]
    question: |
      Which of the following is a canonical example of a Microkernel/Plug-in
      architecture?
    options:
      - "A standard three-tier CRUD web application"
      - "A pair of microservices behind an API gateway"
      - "A replicated in-memory data grid across nodes"
      - "An IDE such as Eclipse or VS Code with its extensions"
    answer: 3
    explanation: |
      IDEs (Eclipse, VS Code), browsers, OS kernels with drivers, and Jenkins are
      classic microkernel systems: a stable core plus pluggable extensions.
    ref: "concepts.md#microkernel-and-plug-in-architecture"
  - id: arch-code-organization-028
    difficulty: advanced
    tags: [microkernel, plug-in-coupling, anti-pattern]
    question: |
      In a well-designed microkernel system, how should plug-ins ideally
      communicate with each other?
    options:
      - "Only through the core; direct plug-in-to-plug-in dependencies erode the model"
      - "Directly, each plug-in calling another's internal methods for raw speed"
      - "Through a single shared global mutable variable they all read and write"
      - "By each plug-in embedding its own private copy of every other plug-in"
    answer: 0
    explanation: |
      Plug-ins should be decoupled from each other and interact through the core.
      Direct plug-in-to-plug-in coupling breaks independence and undermines the
      microkernel benefits.
    ref: "concepts.md#microkernel-and-plug-in-architecture"
  - id: arch-code-organization-029
    difficulty: intermediate
    tags: [microkernel, ilities, extensibility]
    question: |
      Which quality attribute does Microkernel architecture optimize, and where is
      it weak?
    options:
      - "Optimizes elastic horizontal scalability; weak on runtime extensibility"
      - "Optimizes strong data consistency; weak on domain testability in isolation"
      - "Optimizes extensibility/customizability; weak on elastic scalability (the core can bottleneck)"
      - "Optimizes request latency; weak on modularity and feature isolation"
    answer: 2
    explanation: |
      Microkernel maximizes extensibility, customizability, and feature isolation
      but is not inherently scalable — the shared core can become a bottleneck.
    ref: "concepts.md#microkernel-and-plug-in-architecture"
  - id: arch-code-organization-030
    difficulty: advanced
    tags: [microkernel, microservices, comparison]
    question: |
      How does a Microkernel plug-in differ from a microservice?
    options:
      - "There is no meaningful difference between them at all; the two terms are fully interchangeable"
      - "Plug-ins are always loaded remotely over the network; microservices always run in-process"
      - "Plug-ins each require their own dedicated database; microservices all share one common database"
      - "Plug-ins extend a shared core (often in-process); microservices are independently deployed distributed services"
    answer: 3
    explanation: |
      Plug-ins extend a shared core and are frequently loaded in-process against a
      contract, whereas microservices are separately deployed distributed
      services.
    ref: "concepts.md#microkernel-and-plug-in-architecture"
  - id: arch-code-organization-031
    difficulty: beginner
    tags: [modular-monolith, fundamentals]
    question: |
      What is a Modular Monolith?
    options:
      - "A set of independently deployed microservices all placed onto a single shared cluster"
      - "A single deployable unit internally partitioned into well-bounded modules that talk only through explicit APIs"
      - "A layered application that places the relational database at the very center of the design"
      - "A plug-in system built around a deliberately minimal and stable core component"
    answer: 1
    explanation: |
      A modular monolith is one deployable partitioned into bounded modules
      (ideally DDD bounded contexts) that own their data and interact only through
      explicit in-process APIs.
    ref: "concepts.md#modular-monolith"
  - id: arch-code-organization-032
    difficulty: intermediate
    tags: [modular-monolith, microservices, migration]
    question: |
      Why is a Modular Monolith often recommended as a starting point over
      microservices for a new product?
    options:
      - "It automatically scales each individual module independently right out of the box with no extra work"
      - "It completely eliminates the need to define or maintain any module boundaries at all"
      - "It requires provisioning a separate dedicated database for every module by default"
      - "It gives bounded-context modularity with simple ops (one deploy, in-process calls) and is a clean stepping stone to microservices"
    answer: 3
    explanation: |
      You get microservice-like boundaries without distribution cost, and can
      later extract modules that genuinely need independent scale/deploy. Going
      distributed first pays the complexity tax prematurely.
    ref: "concepts.md#modular-monolith"
  - id: arch-code-organization-033
    difficulty: advanced
    tags: [modular-monolith, enforcement, boundaries]
    question: |
      What is the main risk of a Modular Monolith and how is it mitigated?
    options:
      - "Cross-module network latency; mitigated by adding a central message broker between modules"
      - "Boundary erosion into a big ball of mud; mitigated by build tooling/package structure/architecture tests"
      - "Too many separate deployable units; mitigated by merging the smaller services together"
      - "Loss of transactional atomicity; mitigated by coordinating writes with two-phase commit"
    answer: 1
    explanation: |
      Nothing at runtime physically stops a shortcut into another module's
      internals, so boundaries must be enforced with package structure and
      architecture tests (e.g. ArchUnit), or the design rots.
    ref: "concepts.md#modular-monolith"
  - id: arch-code-organization-034
    difficulty: intermediate
    tags: [modular-monolith, layered, comparison]
    question: |
      How does a Modular Monolith partition code compared with a Layered
      architecture?
    options:
      - "Modular monolith partitions vertically by domain module; layered partitions horizontally by technical concern"
      - "Both partition their code horizontally by technical layer such as presentation and persistence"
      - "Modular monolith partitions by physical deployment tier; layered partitions by user-facing feature"
      - "There is no meaningful structural difference between the two approaches at all"
    answer: 0
    explanation: |
      A modular monolith cuts vertically by bounded domain module; layered stacks
      horizontal technical layers (presentation/business/persistence).
    ref: "concepts.md#modular-monolith"
  - id: arch-code-organization-035
    difficulty: beginner
    tags: [vertical-slice, fundamentals]
    question: |
      How does Vertical Slice Architecture organize code?
    options:
      - "By technical layer (all controllers together, all repositories together)"
      - "By deployment tier, grouping code by the physical server it runs on"
      - "By feature/use-case slice, each containing its full path from request to data access"
      - "By database table, with one dedicated code module per persisted table"
    answer: 2
    explanation: |
      Vertical slice groups code by feature: each slice holds everything it needs
      end-to-end (endpoint -> handler -> data access), rather than by horizontal
      layer.
    ref: "concepts.md#vertical-slice-architecture"
  - id: arch-code-organization-036
    difficulty: intermediate
    tags: [vertical-slice, problem, coupling]
    question: |
      What specific pain does Vertical Slice Architecture address?
    options:
      - "One feature requiring edits across every horizontal layer, scattering related code and coupling features"
      - "The relational database becoming a severe performance bottleneck under heavy load"
      - "Inability to load or run third-party plug-in components dynamically at runtime"
      - "A lack of location transparency between the many distributed components of the system"
    answer: 0
    explanation: |
      In layered/onion apps a single feature touches controller + service + repo +
      DTO. Vertical slice makes each feature self-contained so a change stays in
      one place.
    ref: "concepts.md#vertical-slice-architecture"
  - id: arch-code-organization-037
    difficulty: advanced
    tags: [vertical-slice, cqrs, trade-offs]
    question: |
      What is a notable trade-off of Vertical Slice Architecture?
    options:
      - "It gives high feature cohesion but can weaken enforcement of shared domain invariants and duplicate code across slices"
      - "It guarantees zero code duplication because every slice is generated from one shared, central base template"
      - "It forces every feature slice to be deployed as its own independent microservice with a dedicated database"
      - "It makes adding or removing a feature impossible once the initial slice boundaries have been compiled and released"
    answer: 0
    explanation: |
      Slices are cohesive and easy to add/remove, but a rich shared domain model
      is harder to enforce centrally and some duplication appears across slices. It
      pairs well with CQRS (see event-driven-cqrs-saga-cdc).
    ref: "concepts.md#vertical-slice-architecture"
  - id: arch-code-organization-038
    difficulty: intermediate
    tags: [vertical-slice, layered, clean, comparison]
    question: |
      Vertical Slice cuts code one way; Layered/Clean/Onion cut it another. Which
      pairing is correct?
    options:
      - "Vertical slice cuts horizontally by ring while Layered, Clean, and Onion each cut vertically per user-facing feature"
      - "Both approaches cut the code in exactly the same way; only the naming and diagram conventions actually differ"
      - "Vertical slice cuts by physical deployment tier, whereas Layered, Clean, and Onion cut by underlying database table"
      - "Vertical slice cuts vertically per feature; Layered/Clean/Onion cut horizontally by concern/ring"
    answer: 3
    explanation: |
      Vertical slice is a vertical (per-feature) cut; layered, clean, and onion
      are horizontal cuts by technical concern or ring.
    ref: "concepts.md#vertical-slice-architecture"
  - id: arch-code-organization-039
    difficulty: intermediate
    tags: [microservices, trade-offs, deep-dive]
    question: |
      What is the central trade-off of a Microservices architecture?
    options:
      - "Development simplicity versus permanent lock-in to a single cloud vendor's proprietary runtime and tooling"
      - "Independent deployability/scalability per service vs distributed-systems complexity"
      - "Guaranteed strong global consistency versus consistently low end-to-end request latency for every caller"
      - "Runtime extensibility through plug-ins versus the ability to unit-test the domain logic in isolation"
    answer: 1
    explanation: |
      Microservices let teams deploy and scale independently but introduce network
      failure, cross-service data consistency, and heavier operations. Deep dive:
      microservices-monolith-api-design and microservices-ddd-and-boundaries.
    ref: "concepts.md#microservices"
  - id: arch-code-organization-040
    difficulty: intermediate
    tags: [service-based, soa, comparison]
    question: |
      How does a Service-Based architecture typically differ from full
      microservices?
    options:
      - "It uses many more, much finer-grained services, each strictly owning its own private isolated database"
      - "It uses fewer, coarser domain services, often over a shared database — simpler but with less isolation"
      - "It strictly forbids any service from ever being deployed independently of the rest of the system"
      - "It mandates a replicated in-memory data grid in front of every service instead of a normal database"
    answer: 1
    explanation: |
      Service-based uses coarser domain services and often a shared DB — simpler
      than microservices but less isolated. Classic SOA adds an ESB and heavy
      orchestration. Deep dive: microservices-monolith-api-design.
    ref: "concepts.md#service-based-architecture-and-soa"
  - id: arch-code-organization-041
    difficulty: intermediate
    tags: [event-driven, trade-offs, deep-dive]
    question: |
      What is the primary trade-off of an Event-Driven Architecture?
    options:
      - "High scalability/decoupling/resilience vs harder reasoning, eventual consistency, and debugging difficulty"
      - "Guaranteed strong immediate consistency across all consumers versus the system's runtime plug-in extensibility"
      - "Trivial end-to-end simplicity versus an inability to unit-test any of the individual event handlers"
      - "Full location transparency for producers versus a mandatory single central point of failure in the bus"
    answer: 0
    explanation: |
      EDA decouples producers from consumers for scale and resilience but brings
      eventual consistency and harder debugging of async flows. Deep dive:
      event-driven-cqrs-saga-cdc; transport in message-queues-and-async.
    ref: "concepts.md#event-driven-architecture"
  - id: arch-code-organization-042
    difficulty: advanced
    tags: [event-driven, broker, mediator, topology]
    question: |
      Event-Driven Architecture has two common topologies. Which pair is correct?
    options:
      - "Broker (chained, no central coordinator) and mediator (central orchestrator)"
      - "Closed layered topology and physically tiered topology deployed across separate machines"
      - "Primary write-node topology and asynchronous read-replica fan-out topology for events"
      - "Driving (primary) adapter topology and driven (secondary) adapter topology from hexagonal"
    answer: 0
    explanation: |
      The broker topology chains components with no central coordinator; the
      mediator topology uses a central orchestrator. Deep dive:
      event-driven-cqrs-saga-cdc.
    ref: "concepts.md#event-driven-architecture"
  - id: arch-code-organization-043
    difficulty: advanced
    tags: [space-based, scalability, deep-dive]
    question: |
      What problem does Space-Based Architecture specifically target?
    options:
      - "A lack of runtime extensibility for adding customer-specific plug-in features without redeploying"
      - "Business logic being tightly coupled to a volatile presentation UI framework that changes often"
      - "The database becoming the bottleneck under extreme, spiky concurrent load"
      - "Related feature code sprawling and scattering across many horizontal technical layers"
    answer: 2
    explanation: |
      Space-based removes the DB from the request path using a replicated
      in-memory data grid and async writes, achieving near-linear elastic scale
      under spiky load. Deep dive: caching-and-cdn, aws-caching-elasticache-dax.
    ref: "concepts.md#space-based-architecture"
  - id: arch-code-organization-044
    difficulty: advanced
    tags: [space-based, trade-offs]
    question: |
      What is the key downside of Space-Based Architecture?
    options:
      - "It cannot scale horizontally at all and is strictly limited to vertically scaling one large node"
      - "It tightly couples the domain business rules directly to the underlying relational database schema"
      - "Significant complexity and eventual-persistence / data-loss risk"
      - "It forbids any use of caching, forcing every single read to hit the backing store directly"
    answer: 2
    explanation: |
      Relying on an in-memory grid with asynchronous DB writes brings complexity
      and risk of data loss before persistence — the cost of its extreme
      scalability.
    ref: "concepts.md#space-based-architecture"
  - id: arch-code-organization-045
    difficulty: intermediate
    tags: [pipeline, pipe-and-filter, deep-dive]
    question: |
      For which workload is a Pipeline (Pipe-and-Filter) architecture the best
      fit?
    options:
      - "Low-latency interactive request/response traffic that also demands rich cross-stage error handling and rollback"
      - "A stream of data flowing through a sequence of independent, reusable, recombinable transformation steps"
      - "A customer-facing plug-in ecosystem of swappable extensions built around a stable minimal core"
      - "Independent per-feature deployment where each capability ships and scales on its own schedule"
    answer: 1
    explanation: |
      Pipe-and-filter excels at composable, reusable transformation stages over a
      data stream, but fits poorly for interactive/low-latency or error-heavy
      flows. Deep dive (as cloud pattern): dp-distributed-cloud.
    ref: "concepts.md#pipeline-and-pipe-and-filter"
  - id: arch-code-organization-046
    difficulty: intermediate
    tags: [broker, posa, trade-offs]
    question: |
      What is the central trade-off of the Broker style?
    options:
      - "Location transparency and decoupling vs the broker becoming a bottleneck / single point of failure"
      - "Strong per-feature code isolation versus dramatically slower full-project compilation and build times"
      - "Guaranteed strong immediate consistency versus the eventual consistency of asynchronous message delivery"
      - "Easy domain testability with fakes versus a measurable hit to raw runtime request performance"
    answer: 0
    explanation: |
      The broker lets distributed components interact without knowing each other's
      location, but it can become a bottleneck or SPOF. Deep dive:
      message-queues-and-async.
    ref: "concepts.md#broker"
  - id: arch-code-organization-047
    difficulty: advanced
    tags: [scenario, microkernel, selection]
    question: |
      You are building a claims-processing product where each insurance client
      needs custom rules that can be added or replaced without redeploying the
      engine. Which style fits best?
    options:
      - "Layered / N-Tier, with all rule logic living in a shared business layer"
      - "Space-Based, using a replicated in-memory grid to hold each client's rules"
      - "Pipe-and-Filter, chaining every client's rules as fixed sequential stages"
      - "Microkernel / Plug-in"
    answer: 3
    explanation: |
      Volatile, customer-specific, swappable rules around a stable engine is the
      textbook microkernel/plug-in case — plug-ins register against a contract and
      evolve independently of the core.
    ref: "concepts.md#microkernel-and-plug-in-architecture"
  - id: arch-code-organization-048
    difficulty: advanced
    tags: [scenario, hexagonal, selection, testability]
    question: |
      A team practices TDD on a rich domain and must be able to swap from a SQL
      store to a document store later without touching business rules. Which style
      most directly supports this?
    options:
      - "Layered with the DB at the bottom"
      - "Hexagonal / Ports & Adapters (or Clean/Onion)"
      - "Broker, routing all persistence calls through a central message intermediary"
      - "Service-Based with a shared DB"
    answer: 1
    explanation: |
      Isolating the core behind ports lets you test with fakes and replace the
      persistence adapter without editing business rules — exactly the
      inward-dependency payoff of hexagonal/clean/onion.
    ref: "concepts.md#hexagonal-architecture-ports-and-adapters"
  - id: arch-code-organization-049
    difficulty: intermediate
    tags: [scenario, layered, selection]
    question: |
      A two-person startup must ship a simple internal CRUD tool by next week with
      minimal ceremony. Which style is the pragmatic default?
    options:
      - "Layered / N-Tier"
      - "Clean Architecture with full DTO/mapper boundaries"
      - "Microservices with a database per service"
      - "Space-Based with an in-memory grid"
    answer: 0
    explanation: |
      For a small, short-timeline CRUD tool, layered is the cheapest, most
      familiar default. Clean/microservices/space-based would be over-engineering
      here.
    ref: "concepts.md#layered-and-n-tier-architecture"
  - id: arch-code-organization-050
    difficulty: advanced
    tags: [scenario, modular-monolith, selection]
    question: |
      A team wants strong bounded-context boundaries and the option to extract
      services later, but cannot yet justify the operational cost of a distributed
      system. Which style fits?
    options:
      - "Modular Monolith"
      - "Full Microservices from day one"
      - "Space-Based, with a replicated in-memory data grid front-ending every context"
      - "Pipe-and-Filter, chaining each bounded context as a fixed transformation stage"
    answer: 0
    explanation: |
      A modular monolith gives DDD boundaries with one-deploy simplicity and is a
      clean on-ramp to microservices later. Deep dive:
      microservices-monolith-api-design.
    ref: "concepts.md#modular-monolith"
  - id: arch-code-organization-051
    difficulty: advanced
    tags: [ilities, comparison, deployability]
    question: |
      Which statement about deployability is accurate?
    options:
      - "Layered and a single hexagonal app both typically deploy as one unit; microservices deploy each service independently"
      - "A layered architecture gives per-feature independent deployment by default, shipping each layer on its own schedule"
      - "Hexagonal architecture forces every driving and driven adapter into its own separately released deployable artifact"
      - "A modular monolith deploys each of its bounded modules independently as a distinct process on its own host"
    answer: 0
    explanation: |
      Layered and a hexagonal/clean/onion app usually remain a single deployable
      (the inward-dependency styles improve testability, not deployability). Only
      microservices give independent per-service deployment; a modular monolith is
      still one deployable.
    ref: "concepts.md#hexagonal-versus-clean-versus-onion"
  - id: arch-code-organization-052
    difficulty: intermediate
    tags: [altitude, patterns, mvc, pointers]
    question: |
      Where do MVC/MVP/MVVM and Repository/DTO/Gateway belong in the
      style-vs-pattern altitude distinction?
    options:
      - "They are presentation- and enterprise-level design patterns (dp-enterprise-application), not whole-app styles"
      - "They are application-wide architectural styles like Clean or Layered that structure the entire codebase"
      - "They are physical deployment topologies like microservices that partition the system across the network"
      - "They are distributed-system infrastructure patterns like Sidecar and Ambassador that wrap a service"
    answer: 0
    explanation: |
      MVC/MVP/MVVM and Repository/DTO/Gateway are object-level patterns, not
      application-wide styles. Deep dive: dp-enterprise-application. (Sidecar/
      Ambassador -> dp-distributed-cloud.)
    ref: "concepts.md#broker"
  - id: arch-code-organization-053
    difficulty: advanced
    tags: [clean, onion, comparison, nuance]
    question: |
      A candidate says "Onion and Clean are basically the same." What is the most
      precise refinement of that statement?
    options:
      - "They are completely identical in every respect, including their terminology, ring counts, and diagrams"
      - "Onion points its source dependencies outward toward infrastructure, while Clean points them inward to the core"
      - "Clean Architecture applies only to distributed microservices, whereas Onion applies only to single monoliths"
      - "Both enforce inward dependencies, but Onion centers the 'domain model' while Clean names four rings and splits 'entities' from 'use cases'"
    answer: 3
    explanation: |
      They share the inward-dependency idea, but differ in vocabulary and
      emphasis: Onion is domain-model-centric; Clean names four rings and
      separates entities from use cases with an explicit Dependency Rule.
    ref: "concepts.md#hexagonal-versus-clean-versus-onion"
  - id: arch-code-organization-054
    difficulty: intermediate
    tags: [primary-replica, pointers, inclusive-language]
    question: |
      Primary-Replica replication and sharding (historically called
      master-slave) are covered where, relative to this styles overview?
    options:
      - "They are counted among the seven core code-organization styles covered by this styles overview"
      - "They are a data-layer topic; deep dive: databases-sql-nosql-sharding-replication"
      - "They are a specialized microkernel plug-in variant that registers replicas against the core contract"
      - "They are simply another name for the Broker style with a central coordinator between nodes"
    answer: 1
    explanation: |
      Primary-Replica replication/sharding is a data-management concern with its
      own deep-dive topic (databases-sql-nosql-sharding-replication), not a
      code-organization style.
    ref: "concepts.md#broker"
  - id: arch-code-organization-055
    difficulty: advanced
    tags: [layered, hexagonal, comparison, dependency-direction]
    question: |
      What is the fundamental structural difference between Layered and Hexagonal
      architectures?
    options:
      - "Layered points dependencies downward to the DB; hexagonal inverts them so infrastructure depends on the core"
      - "Layered offers no separation of concerns at all, while hexagonal is the only style that truly separates them"
      - "Hexagonal must be deployed as distributed services and can never be a monolith, whereas layered always must"
      - "Layered relies on interfaces everywhere, while hexagonal deliberately forbids them in favor of concrete classes"
    answer: 0
    explanation: |
      Both separate concerns, but layered dependencies point down to the database
      whereas hexagonal inverts them inward toward the core — the source of its
      testability and infrastructure-swap benefits.
    ref: "concepts.md#hexagonal-architecture-ports-and-adapters"
  - id: arch-code-organization-056
    difficulty: expert
    tags: [scenario, event-driven, space-based, selection]
    question: |
      A ticketing system faces enormous, bursty concurrent load at on-sale time and
      the relational DB cannot keep up during the spike. Which style most directly
      targets that bottleneck?
    options:
      - "Layered (top-down technical layers stacked over the DB)"
      - "Space-Based (in-memory data grid with async persistence)"
      - "Microkernel (a stable core with pluggable feature modules)"
      - "Vertical Slice (self-contained per-feature code slices)"
    answer: 1
    explanation: |
      Space-based removes the DB from the hot path via a replicated in-memory grid
      and async writes, giving near-linear elastic scale under spikes — at the cost
      of complexity and eventual-persistence risk. Deep dive: caching-and-cdn.
    ref: "concepts.md#space-based-architecture"
  - id: arch-code-organization-057
    difficulty: expert
    tags: [dependency-inversion, dip, principle]
    question: |
      "Dependency inversion at the architecture level" (the thread across
      Hexagonal/Clean/Onion) most precisely means:
    options:
      - "Low-level infrastructure modules define the interfaces that high-level business policy is then forced to implement"
      - "Every module, including the innermost domain policy, depends directly on concrete database and framework classes"
      - "High-level policy defines interfaces (ports) and low-level infrastructure implements them, so infra depends on the domain"
      - "Dependencies are merely injected at runtime through a container, yet their source direction still points toward the DB"
    answer: 2
    explanation: |
      The domain (high-level policy) owns the interfaces; infrastructure (low-level
      detail) implements them, inverting the naive dependency so infra depends on
      the domain rather than the reverse.
    ref: "concepts.md#hexagonal-versus-clean-versus-onion"
  - id: arch-code-organization-058
    difficulty: expert
    tags: [scenario, vertical-slice, cqrs, selection]
    question: |
      A feature-team-owned app has many independent commands and queries and wants
      each feature to be a self-contained change, often with one handler per
      request. Which style (commonly paired with CQRS) fits best?
    options:
      - "Layered"
      - "Vertical Slice"
      - "Broker"
      - "Onion with a single shared service layer"
    answer: 1
    explanation: |
      Per-feature slices with one handler per command/query, frequently combined
      with CQRS, is exactly vertical slice architecture. Deep dive (CQRS):
      event-driven-cqrs-saga-cdc.
    ref: "concepts.md#vertical-slice-architecture"
  - id: arch-code-organization-059
    difficulty: intermediate
    tags: [pointers, serverless, sidecar, altitude]
    question: |
      In the altitude framing of this topic, "Serverless" is best characterized
      as:
    options:
      - "A code-organization style equivalent to Clean Architecture"
      - "A design pattern for object creation, like Factory or Builder"
      - "A deployment style; deep dive: aws-serverless-lambda-stepfunctions"
      - "A direct synonym for the microkernel plug-in architecture style"
    answer: 2
    explanation: |
      Serverless is a deployment style rather than a code-organization style; its
      deep dive is aws-serverless-lambda-stepfunctions. Sidecar/Ambassador are
      distributed patterns in dp-distributed-cloud.
    ref: "concepts.md#broker"
  - id: arch-code-organization-060
    difficulty: expert
    tags: [scenario, microservices, modular-monolith, tradeoff]
    question: |
      A modular monolith's Billing module now needs to scale and deploy
      independently of the rest, with its own tech stack. What is the natural next
      step, and why was the monolith not enough?
    options:
      - "Convert the whole application to a layered style, since a monolith fundamentally cannot host internally bounded modules"
      - "Add a microkernel plug-in for Billing, because modules inside a monolith are structurally forbidden from owning their own data"
      - "Switch the system to pipe-and-filter, given that monolith modules are unable to expose any in-process APIs to callers"
      - "Extract Billing into a microservice; a modular monolith is still one deployable and cannot scale/deploy a module independently"
    answer: 3
    explanation: |
      The modular monolith gives boundaries but is a single deployable — no
      independent scaling/deploy/stack per module. When a module genuinely needs
      that, extract it into a microservice. Deep dive:
      microservices-ddd-and-boundaries.
    ref: "concepts.md#modular-monolith"
  - id: arch-code-organization-061
    difficulty: beginner
    tags: [blackboard, fundamentals]
    question: |
      What are the three essential components of a Blackboard architecture?
    options:
      - "A front-end load balancer, a distributed cache tier, and a backing relational database"
      - "A presentation layer, a business-logic layer, and a persistence layer stacked over the DB"
      - "A minimal core system, a plug-in registry, and independently registered plug-in modules"
      - "A shared blackboard data store, independent knowledge sources, and a control component"
    answer: 3
    explanation: |
      Blackboard has a shared global data store (the blackboard) holding the evolving solution state, independent specialized knowledge sources, and a control component that decides which knowledge source runs next.
    ref: "concepts.md#blackboard-architecture"
  - id: arch-code-organization-062
    difficulty: intermediate
    tags: [blackboard, problem, ai]
    question: |
      For which kind of problem is a Blackboard architecture the intended fit?
    options:
      - "Simple create-read-update-delete operations over a single relational database schema"
      - "Ill-defined problems with no deterministic known algorithm, such as speech or image recognition"
      - "A data stream processed by a fixed, predetermined sequence of independent transformation steps"
      - "A product needing runtime-pluggable third-party features added without redeploying the core"
    answer: 1
    explanation: |
      Blackboard targets problems with no deterministic algorithm known in advance (speech/image recognition, sensor fusion, heuristic AI search), where specialists opportunistically contribute partial results.
    ref: "concepts.md#blackboard-architecture"
  - id: arch-code-organization-063
    difficulty: advanced
    tags: [blackboard, control-loop, coordination]
    question: |
      How does the control component in a Blackboard architecture decide what runs next?
    options:
      - "It runs every knowledge source strictly once, in a fixed and predetermined order defined at startup, then stops"
      - "Each knowledge source directly invokes the next one in a hard-wired chain, bypassing any central controller entirely"
      - "A simple round-robin scheduler cycles through the knowledge sources evenly, ignoring the current blackboard state"
      - "It opportunistically selects the next knowledge source based on the current state of the blackboard, looping until a solution is reached"
    answer: 3
    explanation: |
      Control is data-driven and opportunistic: the controller monitors the shared blackboard and picks whichever knowledge source can best advance the current state, iterating until an acceptable solution emerges or no source can progress. There is no fixed call order.
    ref: "concepts.md#blackboard-architecture"
  - id: arch-code-organization-064
    difficulty: advanced
    tags: [blackboard, pipe-and-filter, comparison]
    question: |
      How does Blackboard differ from a Pipe-and-Filter (pipeline) architecture?
    options:
      - "Blackboard runs its filters in a rigid fixed forward order, while a pipeline is what freely picks its steps opportunistically from shared state"
      - "Pipeline runs steps in a fixed forward order; Blackboard has no fixed order and its control loop picks the next knowledge source opportunistically from shared state"
      - "They are fundamentally identical architectures; only the diagram conventions and the names given to them actually differ"
      - "Blackboard strictly forbids any shared data store between components, whereas a pipeline is the style that mandates one"
    answer: 1
    explanation: |
      Pipe-and-filter flows data forward through a fixed sequence of stages. Blackboard has no predetermined order: knowledge sources coordinate only through the shared blackboard, and a control loop opportunistically schedules them based on current state.
    ref: "concepts.md#blackboard-architecture"
  - id: arch-code-organization-065
    difficulty: intermediate
    tags: [scenario, blackboard, selection]
    question: |
      You must build a speech-recognition engine where phoneme, word, and grammar specialists each contribute partial hypotheses until a best interpretation emerges, with no fixed processing order. Which style fits best?
    options:
      - "Layered / N-Tier"
      - "Blackboard"
      - "Microkernel / Plug-in"
      - "Space-Based"
    answer: 1
    explanation: |
      Multiple decoupled specialists incrementally refining a shared solution under an opportunistic controller, with no deterministic algorithm, is the textbook Blackboard case.
    ref: "concepts.md#blackboard-architecture"
