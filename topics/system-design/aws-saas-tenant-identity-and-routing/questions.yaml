topic: "AWS SaaS Tenant Identity, Context and Routing"
domain: system-design
topic_slug: aws-saas-tenant-identity-and-routing
version: 1
questions:
  - id: aws-saas-tenant-identity-and-routing-001
    difficulty: beginner
    tags: [tenant-context, fundamentals]
    question: |
      In an AWS SaaS system, what does "tenant context" add on top of ordinary authentication?
    options:
      - "It binds the request to a tenant, tier, and role so it can be scoped and routed correctly"
      - "It encrypts the payload of every request"
      - "It caches the user's password for faster re-login"
      - "It replaces authentication entirely so no login is required"
    answer: 0
    explanation: |
      Authentication proves *who* the user is; tenant context adds *which tenant* they act for, at what
      *tier* and *role*, so the request can be scoped to that tenant's data and routed to the right stack.
      It does not replace login, encrypt payloads, or cache passwords.
    ref: "concepts.md#saas-identity-and-mapping-users-to-tenants"
  - id: aws-saas-tenant-identity-and-routing-002
    difficulty: beginner
    tags: [cognito, jwt]
    question: |
      Which AWS service is the default building block for issuing signed JWTs that carry SaaS tenant
      identity?
    options:
      - "Amazon Route 53"
      - "AWS Certificate Manager"
      - "Amazon Cognito user pools"
      - "AWS Secrets Manager"
    answer: 2
    explanation: |
      Amazon Cognito user pools are an OIDC-compliant IdP that authenticates users and issues signed
      ID/access tokens (JWTs). Secrets Manager stores secrets, Route 53 is DNS, and ACM issues TLS
      certificates — none mint tenant identity tokens.
    ref: "concepts.md#saas-identity-and-mapping-users-to-tenants"
  - id: aws-saas-tenant-identity-and-routing-003
    difficulty: beginner
    tags: [tenant-context, security]
    question: |
      A client sends a request with a header `X-Tenant-Id: acme`. Should the backend trust it to
      determine data access?
    options:
      - "Yes, as long as the request uses HTTPS"
      - "No, only a tenant claim inside a signature-verified JWT (or something derived from it) is trustworthy"
      - "Yes, because API Gateway strips malicious headers automatically"
      - "Yes, headers set by the client are trustworthy"
    answer: 1
    explanation: |
      Client-supplied headers/body are attacker-controlled. The trustworthy tenant identifier is a claim
      in a validated, signature-verified JWT. HTTPS only protects transport; it does not authenticate the
      claimed tenant, and API Gateway does not vet header semantics.
    ref: "concepts.md#injecting-tenant-context-into-the-jwt"
  - id: aws-saas-tenant-identity-and-routing-004
    difficulty: beginner
    tags: [identity-models]
    question: |
      What is "pooled identity" in AWS SaaS?
    options:
      - "A separate Cognito user pool per tenant"
      - "Storing all passwords in a shared DynamoDB table"
      - "Federating every tenant to a single corporate IdP"
      - "One shared Cognito user pool for all tenants, with the tenant carried as a claim/attribute"
    answer: 3
    explanation: |
      Pooled identity uses a single shared user pool where the tenant is a claim (custom attribute or
      group). A pool per tenant is the silo model; the other options are not identity topologies.
    ref: "concepts.md#pooled-siloed-and-federated-identity-models"
  - id: aws-saas-tenant-identity-and-routing-005
    difficulty: beginner
    tags: [onboarding, control-plane]
    question: |
      Tenant onboarding/provisioning is primarily a responsibility of which plane?
    options:
      - "The DNS resolver"
      - "The application plane that serves tenant workloads"
      - "The shared control plane"
      - "The client-side single-page app"
    answer: 2
    explanation: |
      Onboarding, identity provisioning, and the tenant registry live in the shared control plane. The
      application plane runs the per-tenant/pooled workload; onboarding is not a client or DNS concern.
    ref: "concepts.md#tenant-onboarding-and-provisioning-automation"
  - id: aws-saas-tenant-identity-and-routing-006
    difficulty: beginner
    tags: [tenant-registry, dynamodb]
    question: |
      What is the tenant registry typically implemented as, and what does it hold?
    options:
      - "A DynamoDB table keyed by tenantId holding tier, status, routing, and identity config"
      - "An S3 bucket of tenant profile images"
      - "An SQS queue of onboarding events"
      - "A CloudWatch log group holding request logs"
    answer: 0
    explanation: |
      The tenant registry is the control plane's source of truth, commonly a DynamoDB table keyed by
      tenantId with tier, status, routing/stack mapping, and identity config. Logs, images, and queues
      are not the authoritative tenant metadata store.
    ref: "concepts.md#the-tenant-registry-and-metadata-store"
  - id: aws-saas-tenant-identity-and-routing-007
    difficulty: beginner
    tags: [routing]
    question: |
      Which of these is a valid tenant routing mechanism on AWS?
    options:
      - "Choosing a random backend per request"
      - "Routing based on the client's screen resolution"
      - "Routing based on the time of day only"
      - "Host-based routing on subdomains like acme.app.com via ALB or CloudFront"
    answer: 3
    explanation: |
      Host/subdomain-based routing (ALB/CloudFront) is a standard tenant routing approach, along with
      path-based, custom domains, and header/context routing. Random, screen-resolution, or time-of-day
      routing are not tenant routing strategies.
    ref: "concepts.md#tenant-routing"
  - id: aws-saas-tenant-identity-and-routing-008
    difficulty: beginner
    tags: [jwt, tokens]
    question: |
      When a user authenticates to a Cognito user pool, which tokens are returned?
    options:
      - "Only a single opaque session cookie"
      - "An ID token, an access token, and a refresh token"
      - "A TLS client certificate"
      - "An IAM access key and secret key pair"
    answer: 1
    explanation: |
      Cognito user pools return an ID token and access token (both JWTs) plus a refresh token. They do
      not issue TLS client certs; long-lived IAM access keys are not how user sessions work (temporary
      STS credentials come later, via identity pools or AssumeRole).
    ref: "concepts.md#saas-identity-and-mapping-users-to-tenants"
  - id: aws-saas-tenant-identity-and-routing-009
    difficulty: beginner
    tags: [pre-token, cognito]
    question: |
      Which Cognito feature lets you add tenant claims (tenantId, tier, role) to the token during login?
    options:
      - "The pre-token-generation Lambda trigger"
      - "A CloudFront function"
      - "An S3 event notification"
      - "A DynamoDB stream"
    answer: 0
    explanation: |
      The pre-token-generation Lambda trigger runs during authentication and can add/override claims,
      stamping tenantId/tier/role into the token. CloudFront functions, S3 events, and DynamoDB streams
      are unrelated to token minting.
    ref: "concepts.md#injecting-tenant-context-into-the-jwt"
  - id: aws-saas-tenant-identity-and-routing-010
    difficulty: beginner
    tags: [offboarding]
    question: |
      What is the recommended first step when offboarding a tenant?
    options:
      - "Rotate the AWS root account password"
      - "Immediately hard-delete all data with no retention window"
      - "Disable/suspend the tenant (block auth and routing) before any hard delete"
      - "Delete the shared production table"
    answer: 2
    explanation: |
      Offboarding should first disable/suspend (reversible) then hard-delete after a retention window,
      often with a data export. Immediate irreversible deletion, dropping shared tables, or root-password
      rotation are wrong or dangerous.
    ref: "concepts.md#tenant-offboarding-and-data-lifecycle"
  - id: aws-saas-tenant-identity-and-routing-011
    difficulty: beginner
    tags: [iam, sts]
    question: |
      In the "scoped IAM credentials" pattern, what AWS API call produces the temporary, tenant-scoped
      credentials?
    options:
      - "s3:PutObject"
      - "sts:AssumeRole"
      - "dynamodb:PutItem"
      - "cognito-idp:SignUp"
    answer: 1
    explanation: |
      sts:AssumeRole (optionally with a session policy and session tags) returns temporary credentials
      scoped to a tenant. The other calls store data or create users; they do not mint scoped sessions.
    ref: "concepts.md#enforcing-isolation-with-scoped-iam-credentials"
  - id: aws-saas-tenant-identity-and-routing-012
    difficulty: beginner
    tags: [federation]
    question: |
      What is "federated identity" in a B2B SaaS context?
    options:
      - "Storing tenants in separate AWS accounts"
      - "Using API keys instead of tokens"
      - "Sharing one password across all tenants"
      - "A tenant's users authenticate through their own corporate SAML/OIDC IdP"
    answer: 3
    explanation: |
      Federated identity means the tenant brings its own IdP (e.g., Okta/Entra via SAML or OIDC) that is
      federated into a Cognito pool — "log in with your company account." It is not password sharing,
      account separation, or API keys.
    ref: "concepts.md#pooled-siloed-and-federated-identity-models"
  - id: aws-saas-tenant-identity-and-routing-013
    difficulty: beginner
    tags: [routing, authorization]
    question: |
      True or false: the URL path `/t/{tenantId}/...` by itself authorizes access to that tenant's data.
    options:
      - "False — paths cannot contain tenant identifiers"
      - "True — the path is sufficient authorization"
      - "False — the path is only a routing hint; authorization must come from the verified JWT"
      - "True — as long as the path is HTTPS"
    answer: 2
    explanation: |
      Routing (path or host) tells the system where to send a request but never grants access. The
      tenantId in the path must be validated against the tenantId in the verified token. Paths can
      certainly contain tenant identifiers; the issue is trusting them for authorization.
    ref: "concepts.md#tenant-routing"
  - id: aws-saas-tenant-identity-and-routing-014
    difficulty: intermediate
    tags: [cognito, quotas]
    question: |
      A team wants to store 60 distinct per-tenant configuration values as Cognito custom attributes on
      each user. What is the problem?
    options:
      - "Cognito allows only 50 custom attributes per user pool, and they cannot be deleted/renamed once created"
      - "Custom attributes cost $1 each per month"
      - "Custom attributes are encrypted and cannot be read at runtime"
      - "There is no problem; Cognito supports unlimited custom attributes"
    answer: 0
    explanation: |
      Cognito caps custom attributes at 50 per user pool (name ≤ 20 chars, value ≤ 2,048 bytes) and they
      cannot be removed or renamed later. Rich per-tenant config belongs in a DynamoDB registry. There is
      no per-attribute fee, and attributes are readable at runtime.
    ref: "concepts.md#saas-identity-and-mapping-users-to-tenants"
  - id: aws-saas-tenant-identity-and-routing-015
    difficulty: intermediate
    tags: [identity-models, quotas]
    question: |
      A startup plans a Cognito user pool per tenant and expects tens of thousands of tenants. Which
      quota should raise a red flag first?
    options:
      - "Refresh token maximum validity (3,650 days)"
      - "Callback URLs per app client (100)"
      - "Users per user pool (40,000,000)"
      - "User pools per Region (default 1,000, max 10,000)"
    answer: 3
    explanation: |
      User pools per Region default to 1,000 and can be raised only to 10,000 — so pool-per-tenant does
      not scale to tens of thousands of tenants. Users-per-pool (40M) and token validity are irrelevant
      to the count of pools; callback URLs are per-client.
    ref: "concepts.md#pooled-siloed-and-federated-identity-models"
  - id: aws-saas-tenant-identity-and-routing-016
    difficulty: intermediate
    tags: [jwt, design]
    question: |
      Why is it a bad idea to put a tenant's full feature-flag/entitlement set inside the JWT?
    options:
      - "JWTs cannot contain any custom claims"
      - "Entitlements change faster than the token TTL and bloat every request; look them up by tenantId instead"
      - "Custom claims are not signed"
      - "It would make the token unreadable by API Gateway"
    answer: 1
    explanation: |
      Keep tokens small and stable (tenantId, tier, role). Entitlements change more often than the token
      lifetime and inflate every request, so fetch them from the tenant registry/cache keyed by the
      tenantId claim. Custom claims are allowed and are signed with the rest of the token.
    ref: "concepts.md#injecting-tenant-context-into-the-jwt"
  - id: aws-saas-tenant-identity-and-routing-017
    difficulty: intermediate
    tags: [propagation, async]
    question: |
      A background worker processes jobs from an SQS queue for all tenants. Where is a cross-tenant leak
      most likely to be introduced?
    options:
      - "By failing to carry tenantId on the queue message, so the worker loses tenant context"
      - "In the TLS handshake with SQS"
      - "In the Cognito refresh-token rotation"
      - "In the JWT signature verification at the edge"
    answer: 0
    explanation: |
      Async hops are where tenant context is commonly lost: if the SQS message omits tenantId (e.g., as a
      message attribute), the worker cannot scope its work and may process/leak across tenants. The edge
      verification, TLS, and refresh rotation are not the leak point here.
    ref: "concepts.md#validating-and-propagating-tenant-context-end-to-end"
  - id: aws-saas-tenant-identity-and-routing-018
    difficulty: intermediate
    tags: [api-gateway, authorizer]
    question: |
      In an API Gateway + Lambda design, what is the cleanest place to verify the JWT and extract
      tenant context once per request?
    options:
      - "In a CloudWatch alarm"
      - "Inside every business Lambda separately"
      - "In a Lambda (or Cognito/JWT) authorizer that returns tenant context in the authorizer context"
      - "In the client before sending the request"
    answer: 2
    explanation: |
      A Lambda/Cognito/JWT authorizer verifies the token once and passes tenantId/tier/role via the
      authorizer context to the integration. Re-verifying in every Lambda is wasteful; the client cannot
      be trusted to self-verify; CloudWatch alarms are for monitoring.
    ref: "concepts.md#validating-and-propagating-tenant-context-end-to-end"
  - id: aws-saas-tenant-identity-and-routing-019
    difficulty: intermediate
    tags: [iam, session-policy]
    question: |
      When you pass a session policy to sts:AssumeRole, how do the effective permissions combine with
      the role's identity policy?
    options:
      - "They are the union (session policy can add permissions)"
      - "They are the intersection (the session policy can only narrow, never widen)"
      - "The session policy completely replaces the role policy"
      - "The session policy is ignored for cross-account roles"
    answer: 1
    explanation: |
      A session policy can only restrict: effective permissions are the intersection of the role's
      identity policy and the session policy. It never grants beyond the role and does not replace it,
      and it is honored for cross-account assumption too.
    ref: "concepts.md#enforcing-isolation-with-scoped-iam-credentials"
  - id: aws-saas-tenant-identity-and-routing-020
    difficulty: intermediate
    tags: [iam, session-tags, dynamodb]
    question: |
      How do STS session tags enable one shared role to isolate DynamoDB access per tenant?
    options:
      - "By creating a new DynamoDB table per tag"
      - "By increasing the table's provisioned throughput"
      - "By encrypting the table with a per-tenant KMS key automatically"
      - "By setting a TenantID session tag referenced via ${aws:PrincipalTag/TenantID} in a policy condition (e.g., dynamodb:LeadingKeys)"
    answer: 3
    explanation: |
      Session tags (sts:TagSession) like TenantID are referenced in IAM/resource policy conditions via
      ${aws:PrincipalTag/TenantID}, e.g., a dynamodb:LeadingKeys condition that limits access to that
      tenant's item collection. Tags do not create tables, manage KMS keys, or change throughput.
    ref: "concepts.md#enforcing-isolation-with-scoped-iam-credentials"
  - id: aws-saas-tenant-identity-and-routing-021
    difficulty: intermediate
    tags: [routing, custom-domains, quotas]
    question: |
      Why is "one API Gateway custom domain name per tenant" a poor fit for a SaaS with thousands of
      tenants?
    options:
      - "Custom domains disable Lambda authorizers"
      - "Custom domains cannot be used with TLS"
      - "Custom domain names are quota-limited per account, so domain-per-tenant does not scale to thousands"
      - "API Gateway does not support custom domains at all"
    answer: 2
    explanation: |
      Custom domain names are a limited per-account resource, so mapping one per tenant does not scale to
      thousands — reserve it for premium/silo tenants and use header/context routing otherwise. Custom
      domains do support TLS and coexist with authorizers.
    ref: "concepts.md#tenant-routing"
  - id: aws-saas-tenant-identity-and-routing-022
    difficulty: intermediate
    tags: [onboarding, step-functions]
    question: |
      In a Step Functions onboarding workflow, which step differs most between a pooled and a siloed
      tenant?
    options:
      - "Provisioning dedicated infrastructure (a CloudFormation/CDK stack) — done for silo, skipped for pooled"
      - "Setting the final ACTIVE status"
      - "Creating the onboarding API request"
      - "Writing the initial tenant registry record"
    answer: 0
    explanation: |
      Siloed tenants require deploying a dedicated stack (CloudFormation/CDK/Service Catalog or a new
      account), while pooled tenants just seed config — which is why pooled onboarding is near-instant.
      Registry writes and status updates happen for both.
    ref: "concepts.md#tenant-onboarding-and-provisioning-automation"
  - id: aws-saas-tenant-identity-and-routing-023
    difficulty: intermediate
    tags: [tenant-registry, availability]
    question: |
      Why should the tenant registry be treated as a highly available, cached, critical dependency?
    options:
      - "Because it must be publicly accessible on the internet"
      - "Because DynamoDB requires it for billing"
      - "Because it stores tenant passwords"
      - "Because it is read on nearly every control-plane operation and often on the routing path"
    answer: 3
    explanation: |
      The registry maps tenantId to tier/status/stack and is read constantly (control plane and often
      routing), so it should be cached (e.g., DAX) and treated as HA. It should not store passwords, be
      public, and DynamoDB does not require it for billing.
    ref: "concepts.md#the-tenant-registry-and-metadata-store"
  - id: aws-saas-tenant-identity-and-routing-024
    difficulty: intermediate
    tags: [offboarding, pooled]
    question: |
      In a pooled (shared-schema) model, what makes tenant deletion during offboarding risky?
    options:
      - "You can simply drop the table safely"
      - "Deletion is a filtered delete by tenant_id; a wrong filter deletes the wrong tenant's data"
      - "Pooled models cannot delete data at all"
      - "Deletion always requires a full table scan of every AWS account"
    answer: 1
    explanation: |
      In pooled data, deletion is a filtered operation keyed by tenant_id, so a mistaken filter can
      delete the wrong tenant — the same discipline that prevents leaks prevents catastrophic deletes.
      You cannot just drop a shared table, and deletion is certainly possible.
    ref: "concepts.md#tenant-offboarding-and-data-lifecycle"
  - id: aws-saas-tenant-identity-and-routing-025
    difficulty: intermediate
    tags: [identity-models, tradeoffs]
    question: |
      A B2B SaaS has 3 large regulated enterprise tenants and 40,000 small self-serve tenants. Which
      identity topology is most appropriate?
    options:
      - "Pooled identity for the 40,000 small tenants; silo pools for the 3 regulated enterprises (a bridge)"
      - "Pooled identity for everyone with no exceptions"
      - "Federated identity for the small tenants and pooled for the enterprises"
      - "Silo (pool per tenant) for all 40,003 tenants"
    answer: 0
    explanation: |
      A bridge fits best: pool the mass of small tenants (cost/scale) and silo the few regulated
      enterprises (per-tenant IdP, directory residency, stronger isolation). Pool-per-tenant for 40k+
      hits the user-pools-per-Region ceiling; small self-serve tenants rarely bring their own IdP.
    ref: "concepts.md#pooled-siloed-and-federated-identity-models"
  - id: aws-saas-tenant-identity-and-routing-026
    difficulty: intermediate
    tags: [jwt, access-token]
    question: |
      Your APIs authorize on the access token, but you need custom tenant claims there. What enables
      customizing the access token in Cognito?
    options:
      - "Access tokens cannot carry any tenant information"
      - "Only the ID token can ever be customized"
      - "The newer pre-token-generation trigger (V2/V3) can add/suppress claims and scopes on the access token"
      - "You must switch to IAM users"
    answer: 2
    explanation: |
      The advanced (V2/V3) pre-token-generation trigger can customize the access token — adding or
      suppressing claims/scopes and modifying group membership — which matters because APIs typically
      authorize on the access token. Switching to IAM users is unnecessary.
    ref: "concepts.md#injecting-tenant-context-into-the-jwt"
  - id: aws-saas-tenant-identity-and-routing-027
    difficulty: intermediate
    tags: [routing, bridge]
    question: |
      Which routing approach is most flexible when some tenants are pooled and some are siloed (a bridge
      deployment)?
    options:
      - "A hardcoded if/else in the client app"
      - "A routing service that reads tenantId from the token and looks up the tenant's stack in a DynamoDB mapping"
      - "Round-robin DNS across all stacks"
      - "A single static Route 53 alias to the pooled stack"
    answer: 1
    explanation: |
      A context/header-based routing service that resolves the tenant's target stack from the registry
      handles mixed pooled/siloed deployments cleanly. Client if/else is untrusted and unmaintainable,
      round-robin/static aliases cannot send specific tenants to specific stacks.
    ref: "concepts.md#tenant-routing"
  - id: aws-saas-tenant-identity-and-routing-028
    difficulty: intermediate
    tags: [iam, sts, quotas]
    question: |
      What is the default STS request-rate quota that AssumeRole shares, per account per Region?
    options:
      - "10 requests per second"
      - "1,000,000 requests per second"
      - "There is no limit on STS requests"
      - "600 requests per second"
    answer: 3
    explanation: |
      STS enforces a default 600 requests/second per account per Region, shared across AssumeRole,
      GetCallerIdentity, GetSessionToken, etc. It is raisable via support but is a real ceiling for
      per-request AssumeRole at scale.
    ref: "concepts.md#enforcing-isolation-with-scoped-iam-credentials"
  - id: aws-saas-tenant-identity-and-routing-029
    difficulty: intermediate
    tags: [tokens, validity]
    question: |
      What is the default validity of Cognito ID/access tokens if you do not change the setting, and the
      configurable range?
    options:
      - "Fixed at 15 minutes, not configurable"
      - "Fixed at 24 hours, not configurable"
      - "Configurable from 5 minutes to 1 day (default 1 hour)"
      - "Configurable from 1 second to 1 year"
    answer: 2
    explanation: |
      Cognito ID and access tokens are configurable from 5 minutes to 1 day, defaulting to 1 hour.
      Refresh tokens range from 1 hour to 3,650 days. The fixed-value options are wrong.
    ref: "concepts.md#saas-identity-and-mapping-users-to-tenants"
  - id: aws-saas-tenant-identity-and-routing-030
    difficulty: intermediate
    tags: [tenant-registry, separation]
    question: |
      Why keep the tenant registry (control plane) separate from tenant application data (application
      plane)?
    options:
      - "They have different access patterns, owners, and blast radius; mixing them couples lifecycle to workload"
      - "DynamoDB cannot store both kinds of data"
      - "Application data is always relational and registries are always graph databases"
      - "They must be in different AWS partitions by law"
    answer: 0
    explanation: |
      Registry (lifecycle metadata) and application data differ in access pattern, ownership, and blast
      radius, so they are separated. There is no legal partition rule, DynamoDB can store both, and
      neither is tied to a fixed database paradigm.
    ref: "concepts.md#the-tenant-registry-and-metadata-store"
  - id: aws-saas-tenant-identity-and-routing-031
    difficulty: intermediate
    tags: [onboarding, idempotency]
    question: |
      Why must the onboarding workflow be idempotent?
    options:
      - "Because Step Functions cannot be retried otherwise"
      - "To allow tenants to onboard themselves without any control plane"
      - "To reduce the AWS bill by half"
      - "So retries after partial failures don't create duplicate/half-provisioned tenants"
    answer: 3
    explanation: |
      Idempotency lets the workflow safely retry after partial failures without duplicating resources or
      leaving tenants half-provisioned — the #1 onboarding failure mode. It is not a billing trick, and
      Step Functions can retry regardless.
    ref: "concepts.md#tenant-onboarding-and-provisioning-automation"
  - id: aws-saas-tenant-identity-and-routing-032
    difficulty: intermediate
    tags: [propagation, defense-in-depth]
    question: |
      Which statement best captures the "defense in depth" approach to preventing cross-tenant data
      access in a pooled table?
    options:
      - "Rely solely on the application always adding WHERE tenant_id"
      - "Combine a verified JWT tenant claim, app-level scoping, and IAM-scoped credentials so a code bug still cannot cross tenants"
      - "Encrypt the whole table and share one key across tenants"
      - "Put every tenant in its own AWS account"
    answer: 1
    explanation: |
      Defense in depth layers a verified tenant claim, application scoping, AND credential-level scoping
      (session policy/PrincipalTag) so even a forgotten filter cannot leak data. Relying on app code
      alone is fragile; a shared key does not scope access; account-per-tenant is a different (silo) model.
    ref: "concepts.md#enforcing-isolation-with-scoped-iam-credentials"
  - id: aws-saas-tenant-identity-and-routing-033
    difficulty: intermediate
    tags: [identity, b2b, modeling]
    question: |
      A single human (alice@corp.com) must be an admin in Tenant A and a read-only user in Tenant B.
      What is the cleanest way to model this?
    options:
      - "Keep the authoritative user-to-tenant-and-role mapping in a DynamoDB registry and resolve the right context per login/session"
      - "Two separate AWS accounts for the one person"
      - "Store both roles in the refresh token"
      - "A single Cognito user with one custom:tenantId attribute"
    answer: 0
    explanation: |
      One-user-in-many-tenants breaks a single custom:tenantId attribute. An external registry mapping
      user -> {tenant, role} lets you resolve the correct tenant/role context per session. Separate
      accounts per person and refresh-token role storage do not solve the mapping.
    ref: "concepts.md#saas-identity-and-mapping-users-to-tenants"
  - id: aws-saas-tenant-identity-and-routing-034
    difficulty: intermediate
    tags: [routing, security]
    question: |
      A user edits the URL to hit `/t/other-tenant/orders`. What must the backend do?
    options:
      - "Trust the path since it came over HTTPS"
      - "Serve the data because the path names a valid tenant"
      - "Reject unless the path tenantId matches (or is subordinate to) the tenantId in the verified JWT"
      - "Redirect to the tenant's login page and grant access after login"
    answer: 2
    explanation: |
      The routing hint must be reconciled with the verified token's tenantId; a mismatch is rejected,
      preventing tenant hopping via URL editing. Serving based on the path, or trusting HTTPS transport,
      would be an authorization bypass.
    ref: "concepts.md#tenant-routing"
  - id: aws-saas-tenant-identity-and-routing-035
    difficulty: intermediate
    tags: [offboarding, kms, compliance]
    question: |
      How does a per-tenant KMS key strengthen the offboarding/compliance story?
    options:
      - "It makes queries faster"
      - "Scheduling the tenant's key for deletion cryptographically shreds that tenant's data"
      - "It automatically deletes the tenant's rows"
      - "It removes the need for a retention window"
    answer: 1
    explanation: |
      Deleting a per-tenant KMS key renders that tenant's encrypted data unrecoverable (crypto-shredding),
      a strong deletion guarantee. It does not speed queries, delete rows itself, or eliminate the need
      for a suspension/retention window.
    ref: "concepts.md#tenant-offboarding-and-data-lifecycle"
  - id: aws-saas-tenant-identity-and-routing-036
    difficulty: intermediate
    tags: [iam, session-policy, limits]
    question: |
      What are the size constraints on an inline session policy passed to AssumeRole and the alternative
      for larger policies?
    options:
      - "Unlimited size inline"
      - "Up to 64 KB inline; managed ARNs not allowed"
      - "Exactly 100 characters, no alternative"
      - "Up to 2,048 characters of plaintext inline; use up to 10 managed policy ARNs for more"
    answer: 3
    explanation: |
      An inline session policy is limited to 2,048 characters of plaintext; you can additionally pass up
      to 10 managed policy ARNs via PolicyArns. Inline is not unlimited/64 KB, and managed ARNs are the
      documented alternative.
    ref: "concepts.md#enforcing-isolation-with-scoped-iam-credentials"
  - id: aws-saas-tenant-identity-and-routing-037
    difficulty: advanced
    tags: [iam, sts, scaling, tradeoffs]
    question: |
      A high-RPS pooled service does an sts:AssumeRole per request and is now being throttled by STS.
      Which mitigation is best and what is its main risk?
    options:
      - "Call AssumeRole twice per request to spread load"
      - "Remove IAM scoping entirely to avoid STS calls"
      - "Cache the scoped credentials per tenant for their TTL; risk is stale credentials/permissions until the cache expires"
      - "Switch every tenant to its own AWS account"
    answer: 2
    explanation: |
      Caching scoped credentials per tenant for their lifetime removes per-request STS calls; the trade-
      off is that permission/tag changes are not reflected until the cached session expires. Removing
      scoping abandons isolation, account-per-tenant is a massive re-architecture, and doubling calls
      makes throttling worse.
    ref: "concepts.md#enforcing-isolation-with-scoped-iam-credentials"
  - id: aws-saas-tenant-identity-and-routing-038
    difficulty: advanced
    tags: [iam, roles, tradeoffs]
    question: |
      Compared with a role-per-tenant design, what is the primary advantage of one shared role plus
      TenantID session tags?
    options:
      - "It isolates per request without multiplying IAM roles toward the ~1,000 roles-per-account quota"
      - "It removes the need for any policy conditions"
      - "It makes AssumeRole unnecessary"
      - "It gives each tenant a completely separate IAM audit trail with no extra work"
    answer: 0
    explanation: |
      Session tags let a single role serve all tenants while still scoping each session, avoiding a role
      explosion against the 1,000 roles-per-account soft quota (10,000 max). You still need policy
      conditions on ${aws:PrincipalTag/TenantID} and still call AssumeRole; per-tenant audit granularity
      is not automatic with a shared role.
    ref: "concepts.md#enforcing-isolation-with-scoped-iam-credentials"
  - id: aws-saas-tenant-identity-and-routing-039
    difficulty: advanced
    tags: [identity, security, blast-radius]
    question: |
      In pooled identity, what is the most serious systemic risk relative to silo identity, and how do
      you mitigate it while staying pooled?
    options:
      - "Slower DNS resolution; mitigate with Route 53 health checks"
      - "Inability to issue JWTs; mitigate with API keys"
      - "Higher storage cost; mitigate by compressing tokens"
      - "A single directory/token bug can affect all tenants; mitigate with layered isolation (verified claims + IAM-scoped data access) and rigorous claim validation"
    answer: 3
    explanation: |
      Pooling all users in one directory means a token/claim bug has a wide blast radius. Staying pooled,
      you mitigate with defense in depth: verified tenant claims plus credential-level (IAM) scoping of
      data access, and strict validation. Token size, DNS, and JWT issuance are not the core risk.
    ref: "concepts.md#pooled-siloed-and-federated-identity-models"
  - id: aws-saas-tenant-identity-and-routing-040
    difficulty: advanced
    tags: [routing, custom-domains, cognito, quotas]
    question: |
      A design uses a Cognito hosted-UI custom domain per tenant for branded login. Which specific limit
      breaks this at scale?
    options:
      - "Cognito allows only 4 groups per pool"
      - "Cognito allows only 4 custom domains per Region"
      - "Cognito allows only 4 user pools per Region"
      - "Cognito allows only 4 app clients per pool"
    answer: 1
    explanation: |
      Cognito custom domains (for the hosted UI) are limited to 4 per Region, so a branded custom-domain-
      per-tenant login does not scale. App clients (1,000) and groups (10,000) per pool and user pools
      per Region (1,000) are far higher; the 4-per-Region domain limit is the blocker.
    ref: "concepts.md#tenant-routing"
  - id: aws-saas-tenant-identity-and-routing-041
    difficulty: advanced
    tags: [propagation, caching, leak]
    question: |
      Which of these is a classic cross-tenant leak caused by context loss rather than a missing SQL
      filter?
    options:
      - "A cache entry keyed only by resource id (omitting tenantId), so one tenant reads another's cached value"
      - "A JWT with an expired timestamp"
      - "A 500 error from the database"
      - "A slow cold start on Lambda"
    answer: 0
    explanation: |
      A cache key that omits tenantId can serve one tenant's cached data to another — a context-loss
      leak. An expired JWT is rejected (not a leak), a 500 is an error not a leak, and cold starts are a
      latency issue.
    ref: "concepts.md#validating-and-propagating-tenant-context-end-to-end"
  - id: aws-saas-tenant-identity-and-routing-042
    difficulty: advanced
    tags: [onboarding, tradeoffs]
    question: |
      What is the fundamental trade-off between siloed and pooled onboarding?
    options:
      - "There is no meaningful difference"
      - "Siloed onboarding is always cheaper and faster"
      - "Siloed gives stronger isolation and per-tenant blast radius but couples sign-up to a slow stack deploy and consumes quotas; pooled is instant/cheap but shares blast radius"
      - "Pooled onboarding requires a CloudFormation deploy per tenant"
    answer: 2
    explanation: |
      Siloed onboarding deploys per-tenant infrastructure (strong isolation, small blast radius, but slow
      and quota-consuming), while pooled onboarding just seeds config (instant, cheap, shared blast
      radius). Pooled does NOT deploy a stack per tenant; the difference is very real.
    ref: "concepts.md#tenant-onboarding-and-provisioning-automation"
  - id: aws-saas-tenant-identity-and-routing-043
    difficulty: advanced
    tags: [iam, sts, cross-account]
    question: |
      For a cross-account sts:AssumeRole, whose STS request-rate quota is consumed?
    options:
      - "Both accounts equally"
      - "Only the account making the AssumeRole request (the caller); the target account's quota is untouched"
      - "Only the target account"
      - "Neither account; cross-account calls are free of quota"
    answer: 1
    explanation: |
      For cross-account AssumeRole, only the calling account's STS quota is consumed; the target account's
      quota is not impacted. This matters when a central account assumes into many tenant accounts.
    ref: "concepts.md#enforcing-isolation-with-scoped-iam-credentials"
  - id: aws-saas-tenant-identity-and-routing-044
    difficulty: advanced
    tags: [jwt, session-duration, tradeoffs]
    question: |
      You cache tenant-scoped STS credentials to reduce AssumeRole calls. Which trade-off must you weigh
      when choosing the session DurationSeconds?
    options:
      - "Longer sessions are always safer"
      - "Shorter sessions are impossible below 12 hours"
      - "Duration has no effect on caching"
      - "Longer sessions reduce STS calls but widen the window in which revoked/changed permissions still work"
    answer: 3
    explanation: |
      A longer session (up to the role's max, up to 12 hours; 1 hour if unspecified) means fewer STS
      calls but a larger window where stale/over-broad permissions remain valid before re-assumption.
      Sessions can be as short as 15 minutes, and duration directly bounds cache freshness.
    ref: "concepts.md#enforcing-isolation-with-scoped-iam-credentials"
  - id: aws-saas-tenant-identity-and-routing-045
    difficulty: advanced
    tags: [routing, authorization, security]
    question: |
      A silo tenant is served by a dedicated stack reachable at tenant-a.api.com. What prevents a Tenant
      B user from reaching Tenant A's stack simply by using that hostname?
    options:
      - "TLS certificates prevent it automatically"
      - "The hostname is secret so no one can find it"
      - "Each stack (or the shared authorizer) validates that the request's verified tenantId matches the tenant the stack serves"
      - "Nothing; hostnames are inherently isolated"
    answer: 2
    explanation: |
      Reaching a hostname is not authorization: the stack/authorizer must confirm the verified token's
      tenantId matches the tenant it serves, or reject the request. Hostnames are discoverable, not
      secret, and TLS secures transport, not tenant authorization.
    ref: "concepts.md#tenant-routing"
  - id: aws-saas-tenant-identity-and-routing-046
    difficulty: advanced
    tags: [identity, federation, tradeoffs]
    question: |
      An enterprise tenant demands SSO through their own Okta and that their directory data never live in
      your shared pool. Which approach best satisfies this?
    options:
      - "A dedicated (silo) user pool for that tenant federated to their Okta via SAML/OIDC"
      - "Store their users in your shared pool but tag them"
      - "Issue static API keys instead of SSO"
      - "Pooled identity with the tenant as a custom attribute"
    answer: 0
    explanation: |
      A dedicated pool federated to their Okta keeps auth in the customer's directory and isolates the
      tenant's identity data — matching the SSO and residency demands. Pooled/tagged approaches still
      place their users in the shared directory; API keys are not SSO.
    ref: "concepts.md#pooled-siloed-and-federated-identity-models"
  - id: aws-saas-tenant-identity-and-routing-047
    difficulty: advanced
    tags: [tenant-registry, consistency]
    question: |
      Which access rule keeps the tenant registry consistent and safe?
    options:
      - "The client app writes tenant status directly"
      - "The registry is write-only and never read at runtime"
      - "Any service may freely mutate tenant lifecycle state"
      - "Only the control-plane workflow mutates lifecycle state; application code reads it (cached, keyed by the JWT tenantId) but does not change lifecycle"
    answer: 3
    explanation: |
      Lifecycle mutations (onboard/offboard/status) should flow only through the control plane; the
      application plane reads the registry (cached) via the token's tenantId but must not mutate
      lifecycle. Free/client writes cause inconsistency, and the registry is read heavily at runtime.
    ref: "concepts.md#the-tenant-registry-and-metadata-store"
  - id: aws-saas-tenant-identity-and-routing-048
    difficulty: advanced
    tags: [propagation, architecture]
    question: |
      Why is threading tenant context as an explicit object preferable to storing it in a thread-local or
      global in a multi-tenant service?
    options:
      - "Globals are faster and always correct"
      - "Explicit context avoids leaking one request's tenant into another (e.g., across async tasks, thread reuse, or reactive pipelines)"
      - "Thread-locals are not supported on AWS"
      - "It reduces the JWT size"
    answer: 1
    explanation: |
      Explicit tenant-context passing prevents accidental bleed-over from thread reuse, async
      continuations, or reactive pipelines where a global/thread-local can carry the wrong tenant.
      Thread-locals are supported but fragile here; JWT size is unrelated.
    ref: "concepts.md#validating-and-propagating-tenant-context-end-to-end"
  - id: aws-saas-tenant-identity-and-routing-049
    difficulty: advanced
    tags: [onboarding, control-tower, silo]
    question: |
      For an account-per-tenant silo model, which AWS capability best automates creating the tenant's
      account during onboarding?
    options:
      - "AWS Control Tower Account Factory (or an account-vending pipeline)"
      - "Amazon Cognito groups"
      - "Amazon SQS FIFO queues"
      - "Amazon CloudFront distributions"
    answer: 0
    explanation: |
      Control Tower Account Factory (or a custom account-vending pipeline) automates provisioning a new
      AWS account per tenant. Cognito groups model identity, SQS is messaging, and CloudFront is a CDN —
      none vend accounts.
    ref: "concepts.md#tenant-onboarding-and-provisioning-automation"
  - id: aws-saas-tenant-identity-and-routing-050
    difficulty: advanced
    tags: [iam, session-tags, limits]
    question: |
      What are the limits on STS session tags used to carry tenant context?
    options:
      - "Unlimited tags of any length"
      - "Up to 10 tags, key ≤ 20 characters"
      - "Up to 50 session tags, key ≤ 128 and value ≤ 256 characters"
      - "Exactly 1 session tag only"
    answer: 2
    explanation: |
      STS supports up to 50 session tags with key ≤ 128 and value ≤ 256 characters — plenty for
      TenantID and related context. The other bounds are incorrect.
    ref: "concepts.md#enforcing-isolation-with-scoped-iam-credentials"
  - id: aws-saas-tenant-identity-and-routing-051
    difficulty: advanced
    tags: [tradeoffs, bridge, design]
    question: |
      Which end-to-end design best reflects a mature "bridge" for tenant identity, routing, and data?
    options:
      - "Account per tenant for all tenants, no shared control plane"
      - "Pooled identity + shared stack + IAM-scoped data for most tenants, with silo identity + dedicated stack + per-tenant KMS for premium/regulated tenants, all under one control plane"
      - "Pooled everything with no isolation at the data tier"
      - "A separate Cognito pool per user"
    answer: 1
    explanation: |
      A bridge mixes pooled defaults with siloed premium/regulated tenants, coordinated by one control
      plane and registry — the mature answer. Account-per-tenant-for-all is costly and loses shared
      leverage; fully pooled with no data isolation is unsafe; pool-per-user is nonsensical.
    ref: "concepts.md#trade-offs-and-when-to-use-what"
  - id: aws-saas-tenant-identity-and-routing-052
    difficulty: advanced
    tags: [jwt, validation, security]
    question: |
      Which set of checks must a JWT authorizer perform before trusting tenant claims?
    options:
      - "Only decode the payload without verifying the signature"
      - "Check the token length is under 8 KB"
      - "Only check that the token is not empty"
      - "Verify signature, issuer, audience, and expiry, then extract tenantId/tier/role"
    answer: 3
    explanation: |
      Trusting claims requires verifying the cryptographic signature plus issuer, audience, and expiry
      before reading tenantId/tier/role. Merely decoding (base64) without signature verification, or
      checking emptiness/length, does not establish trust.
    ref: "concepts.md#validating-and-propagating-tenant-context-end-to-end"
  - id: aws-saas-tenant-identity-and-routing-053
    difficulty: advanced
    tags: [routing, dns, tradeoffs]
    question: |
      What is the main trade-off of path-based tenant routing (`/t/{tenantId}`) versus host-based routing
      (`tenant.app.com`)?
    options:
      - "There is no difference between them"
      - "Path-based routing cannot use a load balancer"
      - "Path-based is simple but exposes tenantId in URLs/logs; host-based gives cleaner per-tenant branding/isolation but needs DNS/cert management"
      - "Host-based routing is impossible with HTTPS"
    answer: 2
    explanation: |
      Path-based routing is simple but puts tenantId in URLs and logs; host/subdomain routing offers
      branding and cleaner separation at the cost of DNS and certificate management. Both work with load
      balancers and HTTPS.
    ref: "concepts.md#tenant-routing"
  - id: aws-saas-tenant-identity-and-routing-054
    difficulty: advanced
    tags: [onboarding, failure-modes]
    question: |
      A tenant is stuck with status PROVISIONING after a failed onboarding. Which design choice most
      directly prevents this class of problem?
    options:
      - "An idempotent, fully automated onboarding state machine with retries and a clear terminal state"
      - "Letting the client retry the whole flow from the browser"
      - "Skipping the tenant registry write until the very end"
      - "Manual runbooks executed by an on-call engineer for each tenant"
    answer: 0
    explanation: |
      An idempotent, automated state machine with retries and defined terminal states recovers from
      partial failures without half-provisioned tenants. Manual runbooks do not scale, client-driven
      retries are unsafe, and deferring the registry write loses tracking of in-flight onboarding.
    ref: "concepts.md#tenant-onboarding-and-provisioning-automation"
  - id: aws-saas-tenant-identity-and-routing-055
    difficulty: advanced
    tags: [identity, tradeoffs, quotas]
    question: |
      Which is a genuine downside of silo (pool-per-tenant) identity that a pooled model avoids?
    options:
      - "You can no longer use MFA"
      - "You cannot federate to a corporate IdP"
      - "You lose the ability to sign tokens"
      - "You lose a single global user search/admin view and must provision a pool at onboarding, pressing the user-pools-per-Region quota"
    answer: 3
    explanation: |
      Silo identity fragments users across pools (no single global search/admin), requires provisioning a
      pool per tenant, and pushes toward the user-pools-per-Region ceiling. Token signing, MFA, and
      federation all still work in silo pools.
    ref: "concepts.md#pooled-siloed-and-federated-identity-models"
  - id: aws-saas-tenant-identity-and-routing-056
    difficulty: expert
    tags: [iam, dynamodb, leading-keys]
    question: |
      You want IAM itself to prevent a pooled DynamoDB query from returning another tenant's items using
      a tenant-id partition-key prefix. Which mechanism achieves this?
    options:
      - "Enabling DynamoDB Streams"
      - "A dynamodb:LeadingKeys condition tied to ${aws:PrincipalTag/TenantID} on the scoped session"
      - "A DynamoDB TTL attribute"
      - "A global secondary index without a tenant attribute"
    answer: 1
    explanation: |
      The dynamodb:LeadingKeys condition, referencing the session's TenantID principal tag, restricts
      access to items whose partition key begins with that tenant's value — IAM-enforced isolation. TTL
      expires items, a GSI without a tenant attribute can actually bypass scoping, and Streams capture
      changes; none isolate reads.
    ref: "concepts.md#enforcing-isolation-with-scoped-iam-credentials"
  - id: aws-saas-tenant-identity-and-routing-057
    difficulty: expert
    tags: [iam, gsi, leak]
    question: |
      A pooled DynamoDB table is scoped per tenant via LeadingKeys on the base table, but the app also
      queries a GSI. What subtle isolation gap can arise?
    options:
      - "If the GSI's partition key is not tenant-scoped and the policy/query does not enforce tenantId on the index, queries can span tenants"
      - "GSIs cannot be queried with scoped credentials at all"
      - "GSIs always require a separate AWS account"
      - "GSIs are automatically scoped by the base table's LeadingKeys condition"
    answer: 0
    explanation: |
      LeadingKeys applies to the key it names; a GSI with a non-tenant partition key can return
      cross-tenant items unless the design and policy enforce tenant scoping on the index too. GSIs are
      not auto-scoped by the base table condition, and they don't require separate accounts.
    ref: "concepts.md#enforcing-isolation-with-scoped-iam-credentials"
  - id: aws-saas-tenant-identity-and-routing-058
    difficulty: expert
    tags: [jwt, pre-token, limits]
    question: |
      What practical constraint most often bounds how much tenant/claim data you can add in a Cognito
      pre-token-generation trigger?
    options:
      - "You cannot add more than one claim ever"
      - "A hard 10-claim maximum"
      - "The overall token size (headers/JWT length) in practice, well before the 5,000 combined added-claims/scopes quota"
      - "Claims must each be under 4 bytes"
    answer: 2
    explanation: |
      The combined added claims + scopes quota is high (5,000, adjustable); in practice JWT/header size
      limits bite first, so keep tokens lean. There is no 10-claim cap, no 4-byte-per-claim rule, and you
      can add many claims.
    ref: "concepts.md#injecting-tenant-context-into-the-jwt"
  - id: aws-saas-tenant-identity-and-routing-059
    difficulty: expert
    tags: [iam, tradeoffs, scale]
    question: |
      At very high request volume with per-tenant credential caching, a single hot tenant's cache
      entries dominate memory and its permission change is slow to take effect. Which refinement best
      balances the tensions?
    options:
      - "Disable caching and accept STS throttling"
      - "Use short-TTL cached sessions plus an explicit invalidation signal on permission/tier change, sized per tenant activity"
      - "Give every tenant a 12-hour session unconditionally"
      - "Move all tenants to account-per-tenant"
    answer: 1
    explanation: |
      Short-TTL sessions bound staleness while cutting STS load, and an invalidation signal on
      tier/permission change propagates updates promptly; sizing by activity controls memory. Disabling
      caching reintroduces throttling, blanket 12-hour sessions maximize staleness, and re-architecting to
      account-per-tenant is disproportionate.
    ref: "concepts.md#enforcing-isolation-with-scoped-iam-credentials"
  - id: aws-saas-tenant-identity-and-routing-060
    difficulty: expert
    tags: [routing, migration, tradeoffs]
    question: |
      A tenant must be promoted from the pooled stack to a dedicated silo stack (tier upgrade) with
      minimal downtime. Which approach best leverages the routing/registry design?
    options:
      - "Delete the tenant and have them sign up again"
      - "Change DNS TTL to zero for all tenants permanently"
      - "Hardcode the new endpoint in the client and redeploy the mobile app"
      - "Provision the silo stack, migrate the tenant's data, then atomically flip the tenant's stack mapping in the registry so routing sends new requests to the silo"
    answer: 3
    explanation: |
      Because routing resolves the tenant's stack from the registry, you can provision the silo, migrate
      data, then flip the mapping atomically for a near-seamless cutover. Client hardcoding is brittle,
      re-signup loses data/history, and zeroing DNS TTL globally is unrelated and harmful.
    ref: "concepts.md#tenant-routing"
  - id: aws-saas-tenant-identity-and-routing-061
    difficulty: expert
    tags: [identity, security, token-revocation]
    question: |
      A pooled-identity SaaS discovers a compromised admin token for one tenant. Access tokens are valid
      up to their TTL. Which combination best limits damage?
    options:
      - "Rotate the AWS account root credentials"
      - "Wait for the token to expire and do nothing else"
      - "Revoke/rotate refresh tokens, shorten access-token TTL, and rely on IAM-scoped data access so the token cannot reach other tenants even if replayed"
      - "Delete the entire user pool immediately"
    answer: 2
    explanation: |
      Revoking refresh tokens and shortening access-token TTL limits the compromised token's usable
      window, while credential-level (IAM) scoping ensures the token — even if replayed — can only touch
      its own tenant's data. Doing nothing extends exposure; deleting the pool harms all tenants; root
      rotation is irrelevant to a user token.
    ref: "concepts.md#enforcing-isolation-with-scoped-iam-credentials"
  - id: aws-saas-tenant-identity-and-routing-062
    difficulty: expert
    tags: [tenant-registry, hot-partition, scale]
    question: |
      The tenant registry is read on the routing path for every request and one tenant is extremely busy.
      What is the best way to keep registry reads from becoming a bottleneck or hot partition?
    options:
      - "Cache registry lookups (e.g., DAX or in-memory) keyed by tenantId with a sensible TTL, so per-request reads rarely hit DynamoDB"
      - "Store the registry in a single S3 object read per request"
      - "Move the registry to the client browser"
      - "Scan the whole table on every request"
    answer: 0
    explanation: |
      Caching registry entries keyed by tenantId (DAX/in-memory) absorbs the read-heavy, hot-tenant
      pattern so DynamoDB is rarely hit per request. Full scans, a single S3 object, or client-side
      storage would be slow, hot, or untrusted.
    ref: "concepts.md#the-tenant-registry-and-metadata-store"
  - id: aws-saas-tenant-identity-and-routing-063
    difficulty: expert
    tags: [propagation, observability, tradeoffs]
    question: |
      To debug and meter per tenant, you want the tenantId available in logs and traces across services.
      What is the key risk to manage while doing this?
    options:
      - "Logging tenantId doubles the JWT size"
      - "Traces cannot carry any custom attributes"
      - "tenantId is impossible to log"
      - "Propagating tenantId as a trusted, server-derived value (not from client headers) while avoiding logging sensitive tenant PII"
    answer: 3
    explanation: |
      Emitting the server-derived tenantId (from the verified token, not client headers) into logs/traces
      enables per-tenant observability and metering; the risk is trusting client-supplied values and
      logging sensitive PII. Logging tenantId is feasible, doesn't affect JWT size, and traces do support
      custom attributes.
    ref: "concepts.md#validating-and-propagating-tenant-context-end-to-end"
  - id: aws-saas-tenant-identity-and-routing-064
    difficulty: expert
    tags: [tradeoffs, decision, judgment]
    question: |
      An interviewer asks you to justify per-tenant KMS keys versus one shared key for a pooled data
      store. Which answer shows the best judgment?
    options:
      - "Always use one shared key; per-tenant keys have no benefit"
      - "Per-tenant keys enable crypto-shredding and stronger isolation but add key-management overhead and cost, and can hit KMS request/limit considerations; choose per-tenant for regulated/premium tenants and shared for the pooled majority"
      - "Always use a key per tenant regardless of tenant count"
      - "KMS keys are unrelated to tenant isolation"
    answer: 1
    explanation: |
      The judgment answer weighs crypto-shredding/isolation benefits against key-management overhead,
      cost, and KMS limits, then applies per-tenant keys selectively (regulated/premium) and shared keys
      for the pooled majority — a bridge. Blanket always/never answers ignore trade-offs, and KMS is
      directly relevant to data isolation.
    ref: "concepts.md#trade-offs-and-when-to-use-what"
  - id: aws-saas-tenant-identity-and-routing-065
    difficulty: expert
    tags: [iam, sts, design, judgment]
    question: |
      A service must serve requests for multiple tenants within a single process/invocation (batch
      endpoint). How should it apply the scoped-credential pattern correctly?
    options:
      - "Obtain a distinct tenant-scoped session per tenant it acts for (assuming/caching a scoped session per tenantId) so each data operation uses that tenant's credentials"
      - "Put all tenants' data in one query with no scoping"
      - "Reject batch endpoints entirely"
      - "Assume one broad role that can access all tenants and skip per-tenant scoping for the batch"
    answer: 0
    explanation: |
      Even in a multi-tenant batch, each tenant's data operations must run under that tenant's scoped
      session (assume/cache per tenantId), preserving IAM-enforced isolation. Using one broad role or an
      unscoped query reintroduces cross-tenant risk; batch endpoints are fine when correctly scoped.
    ref: "concepts.md#enforcing-isolation-with-scoped-iam-credentials"
  - id: aws-saas-tenant-identity-and-routing-066
    difficulty: expert
    tags: [onboarding, offboarding, lifecycle, judgment]
    question: |
      Which offboarding design best balances reversibility, compliance, and safety in a pooled model?
    options:
      - "Drop the shared table and rebuild it without the tenant"
      - "Immediately and permanently delete all tenant rows on cancellation"
      - "Suspend (block auth/routing) first, offer/perform a per-tenant data export, then filtered-delete after a retention window, with per-tenant KMS key deletion where applicable"
      - "Only disable login but keep all data forever with no deletion path"
    answer: 2
    explanation: |
      Suspend-then-export-then-filtered-delete after a retention window (plus KMS key deletion where
      used) balances reversibility, compliance (export/right-to-deletion), and safety. Immediate deletion
      is irreversible, keeping data forever ignores deletion obligations, and dropping the shared table
      destroys all tenants' data.
    ref: "concepts.md#tenant-offboarding-and-data-lifecycle"
