topic: 'Caching on AWS: ElastiCache, DAX and CloudFront Patterns'
domain: system-design
topic_slug: aws-caching-elasticache-dax
version: 1
questions:
- id: aws-caching-elasticache-dax-001
  difficulty: beginner
  tags:
  - fundamentals
  - read-write-ratio
  question: |
    A caching layer delivers the most value for a workload that is characterized by
    which property?
  options:
  - Reads far outnumber writes and some staleness is tolerable
  - Writes far outnumber reads and every read must be strongly consistent
  - Every request reads a unique key that is never requested again
  - The dataset is tiny and already served in microseconds from the source
  answer: 0
  explanation: |
    Caching pays off when data is read far more than written and can tolerate some
    staleness, because misses (and writes) are the only traffic that reaches the
    source. Write-heavy or strongly-consistent-only data, unique-per-request keys
    (near-zero hit rate), and already-fast tiny datasets get little to no benefit.
  ref: concepts.md#why-cache-and-what-to-cache-on-aws
- id: aws-caching-elasticache-dax-002
  difficulty: beginner
  tags:
  - latency
  - layers
  question: |
    Order these AWS read paths from LOWEST to HIGHEST typical latency for a cache hit
    or fast read.
  options:
  - DynamoDB SSD read < DAX item-cache hit < ElastiCache in-VPC
  - DAX item-cache hit < ElastiCache in-VPC < DynamoDB SSD read
  - ElastiCache in-VPC < DynamoDB SSD read < DAX item-cache hit
  - DynamoDB SSD read < ElastiCache in-VPC < DAX item-cache hit
  answer: 1
  explanation: |
    DAX item-cache hits are microseconds, ElastiCache in-VPC reads are sub-ms to low
    single-digit ms, and a DynamoDB SSD read is ~5-10 ms. The other orderings invert
    these well-known ballparks.
  ref: concepts.md#why-cache-and-what-to-cache-on-aws
- id: aws-caching-elasticache-dax-003
  difficulty: intermediate
  tags:
  - hit-rate
  - estimation
  question: |
    A read path has a 1 ms cache and a 10 ms origin. Raising the cache hit rate from
    90% to 99% has what qualitative effect on effective latency and origin load?
  options:
  - Negligible effect because 90% was already high enough that the remaining misses barely reach the origin
  - It increases effective latency because more keys must be cached
  - 'Large effect: misses (which dominate the added latency and all origin load) drop by ~10x'
  - It only helps origin cost by cutting RCUs, while effective read latency stays flat regardless of hit rate
  answer: 2
  explanation: |
    Misses drive both the added latency and 100% of origin load. Going from 10% to 1%
    misses is a ~10x reduction in origin traffic and in the miss-driven latency
    contribution — the last few percent of hit rate matter most. It does not increase
    latency, and it improves both latency and origin cost.
  ref: concepts.md#why-cache-and-what-to-cache-on-aws
- id: aws-caching-elasticache-dax-004
  difficulty: beginner
  tags:
  - when-not-to-cache
  question: |
    Which scenario is the WEAKEST candidate for adding a cache?
  options:
  - A product catalog read millions of times per day, updated hourly
  - User profile data read on every page load, updated rarely
  - Rendered homepage fragments shared by all anonymous users
  - A per-request analytics query whose parameters are unique each time (near-zero reuse)
  answer: 3
  explanation: |
    Unique-per-request keys yield a near-zero hit rate, so a cache adds a hop and cost
    for almost no benefit. The others have high read reuse and staleness tolerance,
    making them strong cache candidates.
  ref: concepts.md#why-cache-and-what-to-cache-on-aws
- id: aws-caching-elasticache-dax-005
  difficulty: beginner
  tags:
  - redis
  - memcached
  - engines
  question: |
    Which capability is available with ElastiCache for Redis/Valkey but NOT with
    ElastiCache for Memcached?
  options:
  - Replication, automatic failover, persistence, and data structures like sorted sets
  - Storing simple string key/value pairs up to the configured maximum object size limit
  - Scaling out horizontally across multiple nodes to grow total addressable cache capacity
  - Setting a per-entry TTL so cached values expire automatically after a fixed interval
  answer: 0
  explanation: |
    Memcached is a simple multi-threaded blob cache: no replication, no failover, no
    persistence, and no data structures. Redis/Valkey add all of those. Both can store
    strings, scale across nodes, and set TTLs.
  ref: concepts.md#elasticache-redis-versus-memcached
- id: aws-caching-elasticache-dax-006
  difficulty: intermediate
  tags:
  - memcached
  - multi-threading
  - trade-offs
  question: |
    In what narrow case is ElastiCache for Memcached a defensible choice over
    Redis/Valkey?
  options:
  - You need a real-time leaderboard with ranked top-N queries and per-member rank lookups on every request
  - You need a simple, disposable blob cache and want to scale vertically on a multi-threaded node with
    no HA requirement
  - You need cross-AZ automatic failover so cached data survives a node loss with a promoted replica standing in
  - You need pub/sub fan-out delivering each published message to many long-lived subscriber connections
  answer: 1
  explanation: |
    Memcached fits a pure, ephemeral, simple blob cache where multi-threaded vertical
    scaling on one node helps and HA is not required. Leaderboards (sorted sets),
    failover/replication, and pub/sub all require Redis/Valkey.
  ref: concepts.md#elasticache-redis-versus-memcached
- id: aws-caching-elasticache-dax-007
  difficulty: advanced
  tags:
  - redis
  - threading
  - throughput
  question: |
    "Memcached is faster than Redis" — under what qualification is this claim
    actually true, and why is it misleading in general?
  options:
  - Always true, because Memcached has lower per-command overhead in every topology
  - True only with cluster mode enabled on both engines, because sharding is what unlocks Memcached's raw speed advantage
  - True only for a single-node, no-HA, no-structure comparison because Memcached is multi-threaded; misleading
    because Redis scales via sharding across nodes and adds HA
  - Never true; Redis is always faster because it is single-threaded
  answer: 2
  explanation: |
    A single large Memcached node can serve more raw ops/sec than one single-threaded
    Redis node. But Redis scales horizontally by sharding across many primaries and
    provides replication/failover, so the blanket claim ignores how Redis actually
    scales and the HA it provides.
  ref: concepts.md#elasticache-redis-versus-memcached
- id: aws-caching-elasticache-dax-008
  difficulty: intermediate
  tags:
  - valkey
  - engines
  question: |
    What is Valkey in the ElastiCache context?
  options:
  - A proprietary AWS in-memory engine unrelated to Redis, built from scratch with its own incompatible client protocol
  - A managed Memcached variant that adds snapshot persistence and replication on top of the Memcached protocol
  - The purpose-built DynamoDB caching engine that runs inside DAX nodes to serve microsecond item reads
  - A Redis-compatible open-source fork (Linux Foundation) that AWS offers as an ElastiCache engine, typically
    at lower cost
  answer: 3
  explanation: |
    Valkey is the Redis-API-compatible open-source fork that AWS steers customers
    toward on ElastiCache, generally at lower node/serverless cost. It is not
    unrelated to Redis, not a Memcached variant, and not the DAX engine.
  ref: concepts.md#elasticache-redis-versus-memcached
- id: aws-caching-elasticache-dax-009
  difficulty: beginner
  tags:
  - cache-aside
  - patterns
  question: |
    In the cache-aside (lazy-loading) pattern, what happens on a cache miss?
  options:
  - The application reads from the database, then populates the cache with a TTL, then returns
  - The write is buffered in the cache node and asynchronously flushed to the database on a later batch interval
  - The request fails with a cache-miss error and the client is expected to retry until the entry is warmed
  - The cache synchronously writes the value through to the database before returning the response to the caller
  answer: 0
  explanation: |
    Cache-aside loads lazily: on a miss the app fetches from the DB, stores the value
    in the cache (usually with a TTL), and returns it. Buffered async writes describe
    write-behind; synchronous DB+cache writes describe write-through.
  ref: concepts.md#cache-patterns-cache-aside-write-through-write-behind
- id: aws-caching-elasticache-dax-010
  difficulty: intermediate
  tags:
  - write-behind
  - durability
  - trade-offs
  question: |
    What is the PRIMARY risk of the write-behind (write-back) caching pattern?
  options:
  - Reads are always stale because the cache only ever holds values that were flushed to the database earlier
  - A cache node failure before the async flush loses writes that never reached the durable store
  - It cannot batch writes to the database and must issue one synchronous round trip per individual write
  - It increases write latency compared to write-through because each write blocks on both the cache and the DB
  answer: 1
  explanation: |
    Write-behind acks the write from the cache and flushes to the DB asynchronously,
    so a node failure before the flush loses those writes — a durability window. It
    actually lowers write latency and can batch DB writes; reads are fresh for
    written keys.
  ref: concepts.md#cache-patterns-cache-aside-write-through-write-behind
- id: aws-caching-elasticache-dax-011
  difficulty: intermediate
  tags:
  - write-through
  - patterns
  - trade-offs
  question: |
    Compared to cache-aside, what does write-through primarily trade away, and what
    does it gain?
  options:
  - Gains lower read latency on every key; trades away durability because writes skip the database entirely
  - Gains a smaller memory footprint by caching only hot keys; trades away read-after-write consistency
  - Gains fresh reads-after-write and consistent cached data; trades away write latency and wastes memory
    caching data that may never be read
  - Gains automatic cross-region replication of the cache; trades away the simplicity of a single-region setup
  answer: 2
  explanation: |
    Write-through updates the cache on every write, so written keys are always fresh
    and read-after-write is fast/consistent. The cost is added write latency (DB +
    cache) and memory spent on data that may never be read. It does not reduce memory
    or add cross-region replication.
  ref: concepts.md#cache-patterns-cache-aside-write-through-write-behind
- id: aws-caching-elasticache-dax-012
  difficulty: advanced
  tags:
  - cache-aside
  - ttl
  - invalidation
  - best-practice
  question: |
    For a read-heavy service backed by RDS where occasional brief staleness is
    acceptable, which combination is the most robust default?
  options:
  - Write-behind with no TTL for the lowest possible write latency, accepting a small durability window on failure
  - Write-through with no TTL and no invalidation, relying on every write to keep the cache permanently correct
  - No cache at all; rely solely on RDS read replicas to absorb the read load and scale out horizontally
  - Cache-aside with a short-ish TTL as a backstop plus explicit invalidation on the common write paths
  answer: 3
  explanation: |
    Cache-aside + short TTL (self-healing backstop) + invalidate-on-write gives the
    best correctness/robustness balance: TTL bounds staleness even if an invalidation
    is missed. Write-behind risks losing writes; write-through without TTL leaves no
    backstop; read replicas alone don't cut origin latency to sub-ms.
  ref: concepts.md#cache-patterns-cache-aside-write-through-write-behind
- id: aws-caching-elasticache-dax-013
  difficulty: intermediate
  tags:
  - ttl
  - safety-net
  - patterns
  question: |
    Why is setting a TTL considered mandatory even when you also invalidate keys
    explicitly on write?
  options:
  - 'It is a safety net: if an invalidation is ever missed, stale entries still self-heal when the TTL
    expires'
  - TTL makes cache hits return faster than explicit invalidation because expiry is evaluated on the read path
  - TTL is required by ElastiCache before it will accept and store any key in memory on the node
  - TTL guarantees strong consistency by forcing every read to revalidate against the source before expiry
  answer: 0
  explanation: |
    Explicit invalidation is fragile — miss one write path and you leak stale data
    forever. A TTL guarantees eventual self-healing. TTL is not mandatory for storage,
    does not make reads faster, and does not provide strong consistency.
  ref: concepts.md#cache-patterns-cache-aside-write-through-write-behind
- id: aws-caching-elasticache-dax-014
  difficulty: beginner
  tags:
  - cluster-mode
  - replicas
  question: |
    In ElastiCache for Redis with cluster mode DISABLED, how do you scale read
    throughput versus dataset capacity?
  options:
  - Add shards to spread both read traffic and dataset capacity across multiple primaries in the single group
  - Add read replicas (up to 5) to scale reads; resize the node vertically to grow capacity
  - You cannot scale reads at all with cluster mode disabled; the primary must serve every read itself
  - Add more hash slots to the primary node so it can hold additional keys and answer more reads in parallel
  answer: 1
  explanation: |
    Cluster-mode-disabled is a single shard: read replicas (up to 5) scale reads, and
    capacity grows only by vertically resizing the node (max ≈ one node's memory).
    Sharding/hash slots belong to cluster mode enabled.
  ref: concepts.md#cluster-mode-enabled-versus-disabled-sharding-and-replication
- id: aws-caching-elasticache-dax-015
  difficulty: intermediate
  tags:
  - cluster-mode
  - hash-slots
  - sharding
  question: |
    How does cluster-mode-enabled Redis decide which shard a key belongs to?
  options:
  - By assigning keys to shards in round-robin insertion order as each new key is written to the cluster
  - By the key's configured TTL value, grouping shorter-lived entries onto separate shards from long-lived ones
  - CRC16(key) mod 16384 maps the key to one of 16384 hash slots, which are distributed across shards
  - By the size of the stored value in bytes, routing larger payloads to shards with more free memory available
  answer: 2
  explanation: |
    Redis cluster mode partitions the 16384 hash slots across shards; a key hashes via
    CRC16(key) mod 16384 to a slot, and the slot's owning shard stores it. TTL, value
    size, and insertion order do not determine placement.
  ref: concepts.md#cluster-mode-enabled-versus-disabled-sharding-and-replication
- id: aws-caching-elasticache-dax-016
  difficulty: advanced
  tags:
  - cluster-mode
  - hash-tags
  - multi-key
  question: |
    In cluster-mode-enabled Redis, a transaction touching two keys fails with a
    cross-slot error. What is the correct fix?
  options:
  - Disable cluster mode at runtime for just that transaction, then re-enable sharding once it commits
  - Increase the number of shards until the two keys statistically land together on the same node again
  - Switch the two keys to a Memcached namespace so the multi-key transaction runs there instead
  - Use hash tags like {user123}:profile and {user123}:orders so both keys hash to the same slot/shard
  answer: 3
  explanation: |
    Multi-key operations and transactions must be on the same shard. Hash tags force
    the substring inside braces to determine the slot, co-locating related keys. You
    cannot toggle cluster mode per-command, adding shards spreads keys further apart,
    and Memcached has no transactions.
  ref: concepts.md#cluster-mode-enabled-versus-disabled-sharding-and-replication
- id: aws-caching-elasticache-dax-017
  difficulty: advanced
  tags:
  - cluster-mode
  - write-scaling
  - capacity
  question: |
    A single-node Redis cache is CPU-bound on writes and the working set no longer
    fits in one node's RAM. What is the appropriate change?
  options:
  - Enable cluster mode and add shards so writes and memory spread across multiple primaries
  - Add more read replicas to the existing single shard so the extra nodes absorb the write and memory pressure
  - Switch to a strongly consistent read setting so the primary offloads write work onto the replica set
  - Lower the TTL on all keys so entries expire sooner and free enough memory to fit the working set on one node
  answer: 0
  explanation: |
    Read replicas scale reads, not writes or capacity, and a single-threaded primary
    is the write bottleneck. Cluster mode enabled shards data across multiple
    primaries, scaling both write throughput and memory. Consistency settings and TTL
    don't address the capacity/write ceiling.
  ref: concepts.md#cluster-mode-enabled-versus-disabled-sharding-and-replication
- id: aws-caching-elasticache-dax-018
  difficulty: intermediate
  tags:
  - replication
  - consistency
  question: |
    Replication between an ElastiCache Redis primary and its replicas is asynchronous.
    What is the direct consequence for reads and failover?
  options:
  - Replica reads are always strongly consistent and a failover never loses data because the log is synchronous
  - A replica read can be stale, and a failover may lose the last few unreplicated writes
  - Reads on the replica are blocked until replication of all pending writes from the primary completes
  - Writes to the primary are rejected whenever replication lag to any replica exceeds a fixed threshold
  answer: 1
  explanation: |
    Async replication means replicas can lag (stale reads) and a promoted replica may
    not yet have the primary's most recent writes (small data loss on failover). Redis
    is AP-leaning, not a strongly-consistent store; reads and writes are not blocked
    by replication.
  ref: concepts.md#cluster-mode-enabled-versus-disabled-sharding-and-replication
- id: aws-caching-elasticache-dax-019
  difficulty: expert
  tags:
  - serverless
  - cost
  - capacity
  question: |
    For a brand-new service with unpredictable, spiky traffic and a team that does not
    want to do capacity planning, which ElastiCache choice fits best — and what is the
    cost trade-off versus reserved nodes?
  options:
  - A large single Memcached node, because a multi-threaded box absorbs any spike and stays the cheapest option in every traffic pattern with zero planning
  - A fixed 10-shard cluster sized for peak load up front, because over-provisioning shards guarantees the lowest possible cost with no future planning
  - 'ElastiCache Serverless: auto-scales capacity/storage billed by GB-hr + ECPUs; less cost-optimal than
    reserved nodes for steady heavy load'
  - MemoryDB, because its durable Multi-AZ log makes it the cheapest option for a pure cache and auto-scales to spiky traffic with no sizing
  answer: 2
  explanation: |
    Serverless removes node/shard sizing and auto-scales, ideal for spiky/unknown
    load, billed by GB-hr stored + ECPUs. Steady, well-understood heavy workloads are
    usually cheaper on reserved nodes. A fixed cluster requires the very planning the
    team wants to avoid, and MemoryDB (durable primary DB) is overkill/expensive for a
    pure cache.
  ref: concepts.md#cluster-mode-enabled-versus-disabled-sharding-and-replication
- id: aws-caching-elasticache-dax-020
  difficulty: intermediate
  tags:
  - multi-az
  - failover
  - ha
  question: |
    What does enabling Multi-AZ with automatic failover on an ElastiCache Redis
    cluster provide?
  options:
  - Strong, synchronous consistency across every AZ, so a replica read always reflects the primary's most recent committed write
  - Higher single-key write throughput, because the standby AZ replicas accept and merge writes in parallel with the primary
  - Complete elimination of all cross-AZ data transfer charges, since replication traffic between zones is billed as free intra-region traffic
  - Automatic promotion of a replica in a healthy AZ if the primary fails, with endpoint DNS updated so
    clients reconnect
  answer: 3
  explanation: |
    Multi-AZ places replicas in other AZs and, on primary failure, promotes a replica
    and updates the endpoint so clients reconnect (seconds to ~1 minute). It does not
    give strong consistency (async replication), does not raise single-key write
    throughput, and cross-AZ transfer still costs money.
  ref: concepts.md#multi-az-failover-and-how-the-design-degrades
- id: aws-caching-elasticache-dax-021
  difficulty: advanced
  tags:
  - failure-mode
  - cold-start
  - thundering-herd
  question: |
    A single-node cache (no replicas) dies at peak traffic. What is the most likely
    immediate consequence?
  options:
  - 'A cold-start on the whole keyspace: a flood of misses hits the origin DB at once, spiking latency
    and DB load'
  - Nothing changes; ElastiCache silently recreates all cached data from an internal snapshot within milliseconds, so callers never see a miss
  - The application transparently returns cached data from a hidden standby backup node that AWS keeps warm for exactly this failure
  - Writes continue landing in an on-node write buffer that survives the crash, so the origin sees no additional read or write load
  answer: 0
  explanation: |
    With no replica, the cache is gone and every read misses until the cache warms —
    effectively a whole-keyspace thundering herd against the DB. ElastiCache does not
    recreate in-memory data on the fly, there is no hidden backup served automatically,
    and there is no buffer to write to.
  ref: concepts.md#multi-az-failover-and-how-the-design-degrades
- id: aws-caching-elasticache-dax-022
  difficulty: advanced
  tags:
  - global-datastore
  - multi-region
  - dr
  question: |
    A design needs low-latency cache reads in two regions plus cross-region DR for
    Redis. Which feature applies, and what is its consistency caveat?
  options:
  - ElastiCache clusters are global by default and replicate synchronously, so reads are strongly consistent across every region with no extra feature to enable
  - Global Datastore replicates asynchronously to a secondary region; RPO/RTO are non-zero due to async
    replication
  - CloudFront replicates Redis clusters across regions synchronously, mirroring every key to edge locations so both regions see identical, real-time cache state
  - DAX provides cross-region Redis replication, streaming the primary cluster's keyspace to a hot standby cluster in the secondary region
  answer: 1
  explanation: |
    ElastiCache is regional; Global Datastore adds an async-replicated secondary
    cluster in another region for DR and local reads, so there is a non-zero RPO/RTO.
    ElastiCache is not global by default, CloudFront does not replicate Redis, and DAX
    is DynamoDB-only.
  ref: concepts.md#multi-az-failover-and-how-the-design-degrades
- id: aws-caching-elasticache-dax-023
  difficulty: expert
  tags:
  - availability
  - resilience
  - design
  question: |
    Why is a cache that the system "cannot live without" considered an availability
    liability, and what mitigations address it?
  options:
  - It is not a liability at all; a cache the system depends on improves availability by definition because every dependency you add makes the system more robust
  - The only viable mitigation is to disable the cache entirely in production and serve all reads straight from the origin so nothing depends on it
  - If the cache fails and the origin can't absorb the load, the whole system fails; mitigate with connection-pool
    limits, request coalescing, and circuit breakers so the origin survives a cold/dead cache
  - Managed caches like ElastiCache never actually fail thanks to AWS SLAs, so this concern is purely theoretical and needs no mitigation
  answer: 2
  explanation: |
    A hard dependency on the cache means a cache outage becomes a full outage when the
    origin is overwhelmed. You design the origin to survive a cold/dead cache via
    coalescing, pool limits, and circuit breakers. Caches do fail, and disabling the
    cache is not a mitigation.
  ref: concepts.md#multi-az-failover-and-how-the-design-degrades
- id: aws-caching-elasticache-dax-024
  difficulty: intermediate
  tags:
  - eviction
  - maxmemory
  - policy
  question: |
    When an ElastiCache Redis node reaches its maxmemory limit, what governs which
    data is removed?
  options:
  - The oldest keys strictly by insertion time (FIFO), always, regardless of how recently they were accessed or their TTL
  - A random 50% of the keyspace is flushed at once to immediately reclaim a large block of memory below the limit
  - The cluster automatically provisions and adds a new shard to absorb the overflow and evicts nothing from the existing node
  - The configured eviction policy (e.g., allkeys-lru, volatile-ttl); if eviction can't keep up, writes
    may be rejected
  answer: 3
  explanation: |
    Eviction follows the configured maxmemory-policy (allkeys-lru, volatile-lru,
    volatile-ttl, noeviction, etc.); with noeviction or when eviction lags, writes can
    be rejected. It is not strictly insertion order, not a random half-flush, and it
    does not auto-add shards.
  ref: concepts.md#multi-az-failover-and-how-the-design-degrades
- id: aws-caching-elasticache-dax-025
  difficulty: beginner
  tags:
  - dax
  - fundamentals
  question: |
    What is DAX (DynamoDB Accelerator)?
  options:
  - A write-through, in-memory cache purpose-built for DynamoDB, API-compatible with the DynamoDB SDK,
    delivering microsecond reads
  - A general-purpose Redis-compatible cache that sits in front of any data source (RDS, S3, DynamoDB) and serves cache-aside reads
  - A CloudFront edge caching feature that caches API responses at points of presence close to end users worldwide
  - A durable, Redis-compatible primary database that persists writes to a Multi-AZ transaction log before acknowledging them
  answer: 0
  explanation: |
    DAX is a DynamoDB-only, write-through in-memory cache that is DynamoDB-API
    compatible (near drop-in) and serves cache hits in microseconds. It is not a
    general Redis cache, not an edge/CDN feature, and not a durable primary DB (that's
    MemoryDB).
  ref: concepts.md#dax-dynamodb-accelerator
- id: aws-caching-elasticache-dax-026
  difficulty: intermediate
  tags:
  - dax
  - caches
  - item-query
  question: |
    DAX maintains two caches. What are they and how are they keyed?
  options:
  - A read cache and a separate write cache, both keyed by the request's TTL value so entries with the same expiry are grouped together
  - An item cache (GetItem/BatchGetItem, keyed by primary key) and a query cache (Query/Scan, keyed by
    request parameters), each with its own TTL
  - A hot cache and a cold cache, split by access frequency, where frequently read items are promoted into the faster hot tier
  - A primary cache and a replica cache, split by node role, where the primary serves writes and the replica serves cached reads
  answer: 1
  explanation: |
    DAX has an item cache (keyed by primary key for GetItem/BatchGetItem) and a query
    cache (keyed by the Query/Scan parameters), each with a configurable TTL
    (default 5 minutes). The other splits are not how DAX organizes its caches.
  ref: concepts.md#dax-dynamodb-accelerator
- id: aws-caching-elasticache-dax-027
  difficulty: advanced
  tags:
  - dax
  - strong-consistency
  - gotcha
  question: |
    A team adds DAX but notices some reads did not get faster. The reads request
    strongly consistent results. Why is DAX not helping them?
  options:
  - DAX only caches writes, not reads, so read latency is never improved by the item cache no matter how it is configured
  - DAX requires cluster mode to be explicitly enabled before it will cache any read, and that toggle was left off on this cluster
  - Strongly consistent reads are passed through directly to DynamoDB and are not served from the DAX
    cache
  - Strongly consistent reads are cached, but DAX stores them with a forced 0-second TTL so each entry expires before the next read can hit it
  answer: 2
  explanation: |
    DAX serves eventually consistent data from cache; a strongly consistent read
    request bypasses the cache and goes straight to the table, so it gets no caching
    benefit. DAX caches reads (not only writes), needs no cluster mode toggle, and does
    not cache strong reads at all.
  ref: concepts.md#dax-dynamodb-accelerator
- id: aws-caching-elasticache-dax-028
  difficulty: advanced
  tags:
  - dax
  - write-through
  - stale
  - bypass
  question: |
    In a DAX deployment, some application code writes directly to the DynamoDB table
    (bypassing DAX). What consistency problem does this create?
  options:
  - None; DAX subscribes to the table's change stream and detects all direct writes automatically, keeping its cache perfectly in sync
  - The write is rejected by DynamoDB, because the table refuses any write that does not pass through the DAX cluster endpoint
  - DAX immediately flushes its entire item and query cache on any direct table write to guarantee it never serves stale data
  - The DAX item cache is not invalidated by the bypassing write and serves stale data until the entry's
    TTL expires
  answer: 3
  explanation: |
    DAX only updates its cache for writes that go THROUGH DAX. A direct-to-table write
    leaves the DAX item cache stale until TTL expiry. DAX does not observe out-of-band
    table writes, the write is not rejected, and it does not flush everything.
  ref: concepts.md#dax-dynamodb-accelerator
- id: aws-caching-elasticache-dax-029
  difficulty: intermediate
  tags:
  - dax
  - ttl
  - defaults
  question: |
    What is the default TTL for DAX item and query caches?
  options:
  - 5 minutes (configurable)
  - 60 seconds
  - 1 hour
  - 24 hours
  answer: 0
  explanation: |
    DAX item and query caches default to a 5-minute TTL, which is configurable per
    cache. The other values are not the DAX defaults.
  ref: concepts.md#dax-dynamodb-accelerator
- id: aws-caching-elasticache-dax-030
  difficulty: advanced
  tags:
  - dax
  - query-cache
  - invalidation
  - gotcha
  question: |
    With DAX, a write-through PutItem refreshes the affected item in the item cache.
    Why might a related Query result still return stale data afterward?
  options:
  - PutItem never updates any DAX cache; it writes only to the underlying table, so both item and query caches stay stale until TTL
  - The query cache is invalidated by TTL, not by writes to underlying items, so a cached query result
    can persist until its own TTL expires
  - Query results served from DAX are always strongly consistent and therefore cannot ever be stale after a write-through PutItem
  - The item cache and query cache share a single backing entry per key, so a PutItem that refreshes the item automatically refreshes the query result too
  answer: 1
  explanation: |
    A write-through PutItem updates the item cache entry for that key, but query-cache
    entries expire only by TTL — they are not invalidated by underlying item writes,
    so a stale query result can persist. The caches are separate, and query results
    from cache are eventually consistent.
  ref: concepts.md#dax-dynamodb-accelerator
- id: aws-caching-elasticache-dax-031
  difficulty: intermediate
  tags:
  - dax
  - limits
  - nodes
  question: |
    Which statement about DAX cluster topology and scope is correct?
  options:
  - A DAX cluster can transparently cache data from RDS, DynamoDB, and S3 behind one endpoint, acting as a unified multi-source item cache
  - DAX is strictly a single-node service with no replica support, so it cannot survive the loss of its node without a full cold rebuild
  - A DAX cluster runs in your VPC with a primary plus up to 10 replica nodes (up to 11 nodes) across
    AZs, and caches DynamoDB data only
  - DAX only works with DynamoDB global tables and cannot be attached to a standard single-region table without global replication enabled
  answer: 2
  explanation: |
    DAX is DynamoDB-only, runs in your VPC, and supports a primary plus up to 10
    replicas (11 nodes) spread across AZs for HA. It cannot cache RDS/S3, is not
    single-node, and does not require global tables.
  ref: concepts.md#dax-dynamodb-accelerator
- id: aws-caching-elasticache-dax-032
  difficulty: intermediate
  tags:
  - dax
  - elasticache
  - selection
  question: |
    You need to cache raw DynamoDB items for a read-heavy service with minimal code
    changes and eventual consistency is acceptable. Which is the better fit and why?
  options:
  - ElastiCache Redis, because it natively intercepts DynamoDB calls and caches raw items with no cache-aside logic required
  - CloudFront, because its edge cache stores raw DynamoDB items near users and is DynamoDB-API-compatible for reads
  - MemoryDB, because its durable Multi-AZ log makes it the lowest-code way to cache DynamoDB items with strong consistency
  - DAX, because it is DynamoDB-API-compatible (near drop-in) and write-throughs items for you
  answer: 3
  explanation: |
    For drop-in item caching of DynamoDB with eventual consistency, DAX is purpose-
    built and requires little code. ElastiCache would force you to hand-write cache-
    aside and invalidation; CloudFront is an edge/API cache; MemoryDB is a durable
    primary DB, overkill here.
  ref: concepts.md#dax-versus-elasticache-in-front-of-dynamodb
- id: aws-caching-elasticache-dax-033
  difficulty: advanced
  tags:
  - elasticache
  - dax
  - structures
  - selection
  question: |
    A DynamoDB-backed app must also cache computed cross-item aggregates, maintain a
    real-time leaderboard, and enforce a global rate limit. Which caching choice is
    appropriate?
  options:
  - ElastiCache Redis, because it offers data structures (sorted sets, counters), can cache computed/aggregated
    data, and is not limited to DynamoDB item shapes
  - DAX, because it caches everything DynamoDB touches and can maintain sorted-set leaderboards and global counters directly in its item cache
  - CloudFront, because it maintains atomic counters and ranked leaderboards at the edge and shares those structures globally across PoPs
  - API Gateway caching, because it natively stores Redis sorted sets and increments global rate-limit counters per stage
  answer: 0
  explanation: |
    DAX only caches DynamoDB items/queries — it cannot hold arbitrary aggregates,
    sorted-set leaderboards, or global counters. ElastiCache Redis provides exactly
    those structures. CloudFront and API Gateway caching are response caches, not
    data-structure stores.
  ref: concepts.md#dax-versus-elasticache-in-front-of-dynamodb
- id: aws-caching-elasticache-dax-034
  difficulty: advanced
  tags:
  - anti-pattern
  - dax
  - elasticache
  question: |
    Why is putting ElastiCache in front of DynamoDB purely to cache raw items usually
    the wrong choice?
  options:
  - ElastiCache cannot store DynamoDB items at all, because Redis serialization is incompatible with the DynamoDB item format
  - DAX does exactly that with less code and native write-through; ElastiCache adds hand-rolled cache-aside/invalidation
    for no added capability in this case
  - ElastiCache in-memory reads are actually slower than a direct DynamoDB SSD read, so it degrades rather than improves latency
  - DynamoDB forbids attaching any external cache in front of a table for raw item reads unless you use DAX
  answer: 1
  explanation: |
    For plain item caching, DAX is the low-effort, DynamoDB-native answer with write-
    through. ElastiCache would replicate that at the cost of extra code and ops without
    adding value unless you need its extra capabilities. ElastiCache can store items
    and is fast; DynamoDB doesn't forbid caches.
  ref: concepts.md#dax-versus-elasticache-in-front-of-dynamodb
- id: aws-caching-elasticache-dax-035
  difficulty: expert
  tags:
  - hybrid
  - dax
  - elasticache
  - architecture
  question: |
    A senior candidate proposes using BOTH DAX and ElastiCache for a DynamoDB-backed
    platform. What is the strongest justification?
  options:
  - 'Redundancy: layering two independent caches guarantees a request can never miss both, so the origin is never touched'
  - Using two caches halves the per-request cost of each because the traffic is split evenly across the DAX and ElastiCache tiers
  - DAX handles the DynamoDB item hot path with microsecond reads while ElastiCache holds computed/aggregated/cross-source
    data and structures the DynamoDB item cache cannot represent
  - It is required whenever DynamoDB global tables are enabled, since global tables cannot replicate correctly without both caches fronting them
  answer: 2
  explanation: |
    Each cache does what it is best at: DAX for native item caching, ElastiCache for
    aggregates, structures, pub/sub, and multi-source caching. Two caches do not
    eliminate misses, do not halve cost, and are not tied to global tables.
  ref: concepts.md#dax-versus-elasticache-in-front-of-dynamodb
- id: aws-caching-elasticache-dax-036
  difficulty: intermediate
  tags:
  - dax
  - cost
  - rcu
  question: |
    How can DAX reduce cost for a read-heavy DynamoDB workload?
  options:
  - By eliminating the need for the underlying DynamoDB table entirely, since DAX becomes the durable system of record for all items
  - By automatically converting the table from provisioned to on-demand capacity mode so you only pay for the reads DAX cannot serve
  - By transparently compressing every cached item down to 1 KB, cutting both stored bytes and the RCUs each read consumes
  - By absorbing repeated reads of hot items, reducing consumed table RCUs and avoiding throttling on
    hot partitions
  answer: 3
  explanation: |
    DAX serves repeat reads from cache, cutting the RCUs the table must provision and
    relieving hot-partition throttling — often cheaper than scaling table read
    capacity. It does not replace the table (the durable source), change capacity mode,
    or compress items.
  ref: concepts.md#dax-versus-elasticache-in-front-of-dynamodb
- id: aws-caching-elasticache-dax-037
  difficulty: beginner
  tags:
  - cloudfront
  - cdn
  - fundamentals
  question: |
    What are the two primary benefits of putting CloudFront in front of an origin?
  options:
  - Lower client-perceived latency (content cached near users) and reduced origin load/egress
  - Stronger backend database consistency guarantees and a lower per-GB origin storage bill
  - Automatic database schema migration and SQL query-plan optimization performed at the edge
  - Guaranteed exactly-once delivery of asynchronous messages between the backend microservices
  answer: 0
  explanation: |
    CloudFront caches content at edge locations near users (cutting RTTs and TLS
    overhead) and offloads the origin (less compute and egress). It has nothing to do
    with DB consistency, schema migration, or messaging semantics.
  ref: concepts.md#caching-at-the-edge-with-cloudfront
- id: aws-caching-elasticache-dax-038
  difficulty: advanced
  tags:
  - cloudfront
  - cache-key
  - hit-rate
  question: |
    A CloudFront distribution has a poor cache hit rate. The most common root cause is
    which of the following?
  options:
  - The origin happens to be an S3 bucket rather than a custom HTTP server, which forces every object to
    be re-fetched on each viewer request
  - The cache policy includes highly variable fields (all query strings, a unique per-user cookie), which
    shatters the cache key into near-unique entries
  - The TTLs are configured far too long, so the edge serves so many stale copies that clients bypass the
    cache and hit the origin directly
  - Origin Shield is enabled, adding a centralized tier that intercepts and discards edge cache entries
    before they can ever be reused
  answer: 1
  explanation: |
    Including variable fields (all query strings, unique cookies, volatile headers) in
    the cache key produces near-unique keys and destroys reuse. Long TTLs raise hit
    rate; S3 origins and Origin Shield don't reduce it. Fix the cache policy to key
    only on what truly varies the response.
  ref: concepts.md#caching-at-the-edge-with-cloudfront
- id: aws-caching-elasticache-dax-039
  difficulty: advanced
  tags:
  - cloudfront
  - invalidation
  - versioned-urls
  question: |
    Why are versioned/content-hashed object URLs preferred over CloudFront
    invalidations for deploying updated static assets?
  options:
  - Invalidations are completely free and take effect instantly at every edge, so versioning wins only
    because it is marginally simpler to script in a deploy pipeline
  - Versioned URLs force CloudFront to perform a full re-crawl of the origin, warming every object at
    once so the first viewer never sees a miss
  - Invalidations cost money beyond a free tier and are slow to propagate; versioned URLs change the cache
    key so new content is fetched immediately while old entries age out via TTL/LRU
  - Invalidations permanently disable edge caching for the affected path prefix, forcing every future
    request on that path to go all the way to the origin
  answer: 2
  explanation: |
    Versioned URLs (app.v2.js / content-hash names) create a new cache key so clients
    fetch the new asset at once, with old entries expiring naturally — avoiding the
    cost and latency of invalidations. Invalidations are not free/instant, versioned
    URLs don't force re-crawls, and invalidations don't permanently disable caching.
  ref: concepts.md#caching-at-the-edge-with-cloudfront
- id: aws-caching-elasticache-dax-040
  difficulty: advanced
  tags:
  - cloudfront
  - edge-compute
  - functions-lambda-edge
  question: |
    For a sub-millisecond viewer-request task like rewriting a header or checking a
    simple auth token at massive scale, which CloudFront edge-compute option fits, and
    what is the trade-off versus the alternative?
  options:
  - Lambda@Edge, because its Node/Python runtime executes viewer-request logic faster and at a lower
    per-invocation price than the lightweight CloudFront Functions engine
  - Neither option applies, because CloudFront edge compute is read-only and is not permitted to inspect
    or rewrite request or response headers at all
  - API Gateway Lambda authorizers deployed to run directly at CloudFront points of presence for sub-ms
    token validation on every viewer request
  - 'CloudFront Functions: sub-ms, cheap, viewer request/response, but far more limited than Lambda@Edge
    which can run heavier logic for hundreds of ms'
  answer: 3
  explanation: |
    CloudFront Functions are ultra-cheap, sub-ms, and ideal for lightweight
    header/redirect/token tasks on viewer events, but limited. Lambda@Edge handles
    heavier transformations at higher latency/cost. API Gateway authorizers are not
    CloudFront edge compute.
  ref: concepts.md#caching-at-the-edge-with-cloudfront
- id: aws-caching-elasticache-dax-041
  difficulty: intermediate
  tags:
  - cloudfront
  - origin-shield
  - thundering-herd
  question: |
    What does CloudFront Origin Shield primarily accomplish?
  options:
  - It adds a centralized caching layer in front of the origin that collapses requests, raising offload
    and reducing origin thundering herd
  - It transparently encrypts every cached object at the edge with a per-distribution KMS key before it
    is stored in the point-of-presence cache
  - It replaces the need to configure a cache policy by auto-deriving the cache key from the origin's
    response headers on the first fetch
  - It provides synchronous cross-region replication of the origin database so both regions serve
    identical data with no lag
  answer: 0
  explanation: |
    Origin Shield is an extra centralized cache tier that funnels edge misses through
    one point, collapsing duplicate origin fetches (e.g., one fetch per object) and
    protecting the origin. It is not about encryption, cache policies, or DB
    replication.
  ref: concepts.md#caching-at-the-edge-with-cloudfront
- id: aws-caching-elasticache-dax-042
  difficulty: intermediate
  tags:
  - cloudfront
  - private-data
  - security
  question: |
    What is the risk of edge-caching per-user private API responses at CloudFront
    without care?
  options:
  - There is no risk; CloudFront inspects each response body and automatically isolates it to the
    authenticated user who first requested it
  - If the cache key does not include user identity, one user's private response can be served to another
    user (cache-key mis-scoping / data leak)
  - It always doubles origin cost, because every authenticated response must be fetched from the origin
    twice to validate the viewer before caching
  - CloudFront silently refuses to cache any response carrying an Authorization header or a session
    cookie, so no offload is ever achieved
  answer: 1
  explanation: |
    Caching private responses without including the user identity in the cache key can
    leak one user's data to another. CloudFront does not auto-isolate users by content;
    it caches whatever the key permits. It doesn't double cost or universally refuse
    authenticated responses.
  ref: concepts.md#caching-at-the-edge-with-cloudfront
- id: aws-caching-elasticache-dax-043
  difficulty: beginner
  tags:
  - ttl
  - staleness
  question: |
    What is the fundamental trade-off in choosing a TTL for cached data?
  options:
  - A shorter TTL always increases the hit rate, because entries are re-validated and re-warmed more
    frequently so more requests find fresh data waiting
  - The TTL length has no measurable effect on the hit rate, which is governed solely by the size of the
    cache and its eviction policy
  - Shorter TTL means fresher data but lower hit rate and more origin load; longer TTL means higher hit
    rate but staler data
  - A longer TTL always improves consistency with the source, because entries persist long enough for the
    cache and origin to converge on the same value
  answer: 2
  explanation: |
    TTL trades freshness against hit rate/origin load: short TTLs refresh often (fresh
    but more misses), long TTLs reuse more (higher hit rate but staler). Shorter TTL
    lowers hit rate, and longer TTL worsens, not improves, freshness/consistency.
  ref: concepts.md#ttl-and-cache-invalidation
- id: aws-caching-elasticache-dax-044
  difficulty: advanced
  tags:
  - event-driven
  - invalidation
  - streams
  question: |
    Which modern pattern keeps caches fresh across services WITHOUT coupling every
    writer to cache-management code?
  options:
  - Requiring every writer across all services to synchronously call one shared cache-delete client
    library on the write path before the write can return
  - Setting an effectively infinite TTL on every entry and never invalidating, trusting eviction to
    eventually reclaim anything that drifts stale
  - Disabling the cache entirely for a service the moment any write to its data occurs, then re-enabling
    it once writes go quiet
  - 'Event-driven invalidation: DynamoDB Streams / CDC / EventBridge trigger a Lambda that refreshes or
    invalidates cache entries'
  answer: 3
  explanation: |
    Event-driven invalidation decouples writers from cache logic: the data-change
    event (Streams/CDC/EventBridge) drives a Lambda that updates the cache. A shared
    synchronous delete library still couples writers; infinite TTL never refreshes;
    disabling caching on writes defeats the purpose.
  ref: concepts.md#ttl-and-cache-invalidation
- id: aws-caching-elasticache-dax-045
  difficulty: intermediate
  tags:
  - eviction
  - invalidation
  - concepts
  question: |
    Eviction and invalidation are often confused. Which statement correctly
    distinguishes them?
  options:
  - Eviction is about capacity (dropping data when memory is full via LRU/LFU/TTL); invalidation is about
    correctness (removing/updating stale entries when the source changes)
  - They are the same underlying operation described with two different names, chosen only by whether the
    engine or the application issued the removal
  - Invalidation happens only when memory pressure builds, running the same LRU scan that eviction uses to
    reclaim space on a full node
  - Eviction guarantees that no cached entry is ever stale, because the LRU sweep always removes an
    outdated copy before a reader can observe it
  answer: 0
  explanation: |
    Eviction manages capacity — LRU/LFU/TTL drop data under memory pressure.
    Invalidation manages correctness — removing entries that no longer match the
    source. They are distinct; invalidation is not triggered by memory pressure, and
    eviction does nothing to guarantee freshness.
  ref: concepts.md#ttl-and-cache-invalidation
- id: aws-caching-elasticache-dax-046
  difficulty: advanced
  tags:
  - eviction-policy
  - selection
  question: |
    You run a Redis instance mixing pure cache entries (safe to drop) and a few keys
    that must never be evicted. Which eviction approach fits best?
  options:
  - allkeys-lru, relying on recency alone to keep the protected keys resident since they are read often
    enough that LRU should never target them
  - Set TTLs only on the evictable keys and use a volatile-* policy (e.g., volatile-lru/volatile-ttl)
    so only keys with a TTL are candidates for eviction
  - noeviction on the whole instance, so the protected keys are safe and the disposable entries simply
    stop being admitted once memory fills
  - allkeys-random, so eviction pressure is spread uniformly and the protected keys each face only a small
    probability of removal per sweep
  answer: 1
  explanation: |
    volatile-* policies only evict keys that have a TTL set, letting you protect the
    TTL-less critical keys while still evicting the disposable cache entries.
    allkeys-lru could evict the protected keys; noeviction would reject writes; random
    eviction offers no protection.
  ref: concepts.md#ttl-and-cache-invalidation
- id: aws-caching-elasticache-dax-047
  difficulty: intermediate
  tags:
  - versioned-keys
  - invalidation
  question: |
    How does using versioned cache keys (e.g., v2:user:123) avoid the invalidation
    problem?
  options:
  - It forces every read of that key to become strongly consistent, revalidating against the source
    before the cached value is returned
  - It disables TTL entirely for versioned keys, since the version bump alone is treated as the sole
    freshness signal by the cache engine
  - Changing the key when content changes means readers fetch the new key while old entries simply age
    out via TTL/LRU — no explicit deletion needed
  - It replicates the key to every shard in the cluster, so any node can answer the read without a
    cross-slot redirect after a version change
  answer: 2
  explanation: |
    Versioned keys sidestep invalidation: a new version is a new key, so consumers get
    fresh data immediately and stale old-version entries expire naturally. It doesn't
    change consistency guarantees, disable TTL, or replicate across shards.
  ref: concepts.md#ttl-and-cache-invalidation
- id: aws-caching-elasticache-dax-048
  difficulty: intermediate
  tags:
  - thundering-herd
  - stampede
  question: |
    What is the "thundering herd" (cache stampede) problem?
  options:
  - Too many distinct keys packed onto one shard, overflowing its memory and triggering constant eviction
    of otherwise-hot entries
  - A read replica falling far enough behind its primary that clients reading it observe old values until
    replication catches back up
  - A CloudFront invalidation request taking too long to propagate across every edge location before the
    updated content becomes visible
  - A popular key expires (or the cache cold-starts) and many concurrent requests all miss at once, hammering
    the origin simultaneously
  answer: 3
  explanation: |
    Thundering herd is the simultaneous flood of misses when a hot key expires or the
    cache is cold, all hitting the origin at once and risking a cascading failure. It
    is not about shard key counts, replica lag, or invalidation latency.
  ref: concepts.md#hot-keys-and-the-thundering-herd-problem
- id: aws-caching-elasticache-dax-049
  difficulty: advanced
  tags:
  - thundering-herd
  - coalescing
  - single-flight
  question: |
    Which technique directly prevents thousands of concurrent misses from all
    recomputing the same expired hot key?
  options:
  - 'Request coalescing / single-flight: only one request recomputes (e.g., via a per-key SETNX lock)
    while others wait for its result'
  - Increasing the number of shards in the cluster so the expired hot key's recompute traffic is spread
    evenly across every primary node
  - Switching that key's reads to strongly consistent mode, so the concurrent misses serialize behind one
    authoritative recompute against the source
  - Lowering the key's TTL so it expires more frequently, keeping each individual stampede small enough
    for the origin to absorb
  answer: 0
  explanation: |
    Coalescing/single-flight ensures one recompute per key while others await the
    result, protecting the origin. Adding shards doesn't help a single key, strong
    reads don't reduce recomputes, and lowering TTL increases expiry frequency (worse).
  ref: concepts.md#hot-keys-and-the-thundering-herd-problem
- id: aws-caching-elasticache-dax-050
  difficulty: advanced
  tags:
  - hot-key
  - cluster-mode
  - gotcha
  question: |
    Why does enabling cluster mode (sharding) NOT solve a single hot-key problem?
  options:
  - Because enabling cluster mode reduces the total number of nodes available, concentrating all traffic
    onto fewer primaries than before
  - Because a single key still hashes to exactly one slot/shard, so all its traffic lands on one node
    regardless of how many shards exist
  - Because cluster mode disables read replicas, removing the extra nodes that would otherwise share the
    hot key's read load
  - Because hot keys are automatically split byte-by-byte across all shards, and the reassembly overhead
    cancels out any distribution benefit
  answer: 1
  explanation: |
    Sharding distributes DIFFERENT keys across shards, but one key maps to one slot on
    one shard — so a single hot key still concentrates on one node. Mitigate with local
    caching, key replication/fan-out, or read replicas. Cluster mode doesn't reduce
    nodes, disable replicas, or auto-split a single key.
  ref: concepts.md#hot-keys-and-the-thundering-herd-problem
- id: aws-caching-elasticache-dax-051
  difficulty: expert
  tags:
  - hot-key
  - fan-out
  - mitigation
  question: |
    A global config key receives extreme read traffic that saturates one Redis shard.
    Which mitigation spreads that single key's load across nodes?
  options:
  - Enable strong consistency on the key so that reads serialize through the primary and the saturated
    shard sheds load by rejecting the excess concurrent requests
  - Lower the key's TTL to 1 second so it is refreshed constantly, keeping the copy on the saturated shard
    small enough that reads stop overwhelming the node
  - Replicate the value under multiple keys (hot:1..N) and have each reader read a random replica, spreading
    load across shards; and/or use in-process local caching
  - Move the key to a Memcached cluster, letting its multi-threaded node serve the extreme read volume
    that the single-threaded Redis shard cannot keep up with
  answer: 2
  explanation: |
    Key fan-out (write copies hot:1..N and read a random one) distributes a single hot
    key's reads across slots/shards; local in-process caching absorbs the hottest
    reads before they hit Redis. Strong consistency, a tiny TTL, or moving to Memcached
    don't spread single-key load.
  ref: concepts.md#hot-keys-and-the-thundering-herd-problem
- id: aws-caching-elasticache-dax-052
  difficulty: advanced
  tags:
  - ttl-jitter
  - stale-while-revalidate
  - mitigation
  question: |
    Which pair of techniques reduces synchronized cache expiry stampedes cheaply?
  options:
  - Setting identical TTLs on every key and disabling any background refresh so all entries expire and
    reload together in one predictable cycle
  - Using a noeviction policy combined with an effectively infinite TTL so entries never expire and the
    origin is therefore never re-queried
  - Forcing all reads to be strongly consistent so each request revalidates against the source and the
    concurrent misses queue behind one recompute
  - Jittered/staggered TTLs (so keys don't expire simultaneously) plus serving stale while revalidating
    in the background
  answer: 3
  explanation: |
    Jitter avoids many keys expiring at the same instant (essentially free), and
    serve-stale-while-revalidate returns the old value while refreshing async so no
    request blocks on a cold recompute. Identical TTLs synchronize stampedes; infinite
    TTL/noeviction and strong reads don't address stampedes.
  ref: concepts.md#hot-keys-and-the-thundering-herd-problem
- id: aws-caching-elasticache-dax-053
  difficulty: advanced
  tags:
  - negative-caching
  - penetration
  question: |
    Repeated requests for keys that do not exist keep hitting the database. Which
    technique mitigates this "cache penetration"?
  options:
  - 'Negative caching: briefly cache a ''not found'' result so repeated misses for nonexistent keys stop
    hammering the DB'
  - Increasing the item-cache TTL for the keys that do exist, so hot entries stay resident longer and
    leave more headroom to absorb the lookups for missing keys
  - Disabling TTL for all keys so nothing expires, keeping every previously fetched item permanently warm
    in the cache regardless of whether it exists
  - Switching the read path to write-through caching, so each read populates the cache on the way through
    and later lookups for the same key are served locally
  answer: 0
  explanation: |
    Negative caching stores a short-lived "not found" marker so lookups for
    nonexistent keys are absorbed by the cache instead of repeatedly hitting the DB
    (also mitigates a penetration attack). Longer positive TTLs, disabling TTL, or
    write-through don't address missing-key lookups.
  ref: concepts.md#hot-keys-and-the-thundering-herd-problem
- id: aws-caching-elasticache-dax-054
  difficulty: intermediate
  tags:
  - session-store
  - stateless
  - scaling
  question: |
    Why do stateless app servers commonly store session state in ElastiCache Redis
    rather than in local memory?
  options:
  - Local process memory is inherently slower to read than a network round trip to a Redis node, so
    centralizing sessions actually improves per-request lookup latency
  - A shared cache lets any server handle any request, enabling horizontal scaling and easy deploys; with
    Multi-AZ/replication sessions survive a node failure
  - Redis guarantees strong, linearizable consistency for session records across all replicas, which
    local per-server memory can never provide
  - Local process memory cannot serialize and store rich session objects at all, forcing an external
    store like Redis for anything beyond a flat token string
  answer: 1
  explanation: |
    Externalizing sessions to a shared, replicated store means any stateless server
    can serve any user, which enables scaling and rolling deploys, and Multi-AZ Redis
    keeps sessions alive through node failures. Local memory is actually faster but not
    shared; strong consistency isn't the reason.
  ref: concepts.md#session-store-rate-limiting-and-leaderboard-use-cases
- id: aws-caching-elasticache-dax-055
  difficulty: advanced
  tags:
  - session-store
  - redis
  - memcached
  - trade-offs
  question: |
    For a session store where logging users out on infrastructure failure is
    unacceptable, which engine and why?
  options:
  - Memcached, because its multi-threaded design serves session reads faster and that throughput headroom
    keeps sessions available when a node is lost
  - Either engine works equally well, because both Memcached and Redis replicate session data to standby
    nodes and recover it after a node is lost
  - Redis/Valkey with Multi-AZ replication, because a promoted replica preserves sessions on node failure,
    whereas Memcached has no replication and loses a node's sessions
  - DAX, because its write-through item cache persists sessions to a replicated store and rehydrates them
    after any node failure
  answer: 2
  explanation: |
    Redis/Valkey with replication/failover preserves sessions across a node loss;
    Memcached has no replication, so losing a node drops those sessions and logs users
    out. The engines are not equivalent here, and DAX is DynamoDB-only.
  ref: concepts.md#session-store-rate-limiting-and-leaderboard-use-cases
- id: aws-caching-elasticache-dax-056
  difficulty: intermediate
  tags:
  - rate-limiting
  - counters
  - redis
  question: |
    Why is centralizing rate-limit counters in ElastiCache Redis (INCR + TTL)
    preferable to per-server in-memory counters?
  options:
  - Per-server in-memory counters cannot be implemented atomically, so only an external store like Redis
    can safely increment a request count under concurrency
  - Redis counters never expire on their own, so INCR is the only way to enforce a fixed rolling window
    while local counters silently leak old counts forever
  - In-memory per-server counters are strongly consistent across the fleet while Redis INCR is only
    eventually consistent, so the shared store is actually the looser guarantee
  - A central atomic counter enforces a GLOBAL limit across all app servers, which independent per-server
    counters cannot
  answer: 3
  explanation: |
    Redis INCR is atomic and shared, so the limit applies globally across every server;
    per-server counters each enforce only a local slice, allowing far more total
    traffic than intended. In-memory counters are possible but not shared; Redis
    counters can have TTLs.
  ref: concepts.md#session-store-rate-limiting-and-leaderboard-use-cases
- id: aws-caching-elasticache-dax-057
  difficulty: intermediate
  tags:
  - leaderboard
  - sorted-sets
  - redis
  question: |
    Which Redis data structure is the canonical choice for a real-time leaderboard,
    and why?
  options:
  - Sorted sets (ZADD/ZRANGE/ZREVRANK), because they give O(log n) ranked inserts and efficient top-N
    and per-member rank queries
  - Lists (LPUSH/LRANGE), because they preserve insertion order and can be re-sorted on every read to
    return the current top-N ranking cheaply
  - Hashes (HSET/HGET), because they store one field per player and let you fetch any member's score in
    O(1) and derive its rank directly from that lookup
  - Strings with INCR, because raw string counters are the fastest structure and ranking is just a sort
    of those integer values on read
  answer: 0
  explanation: |
    Sorted sets maintain members ordered by score, giving O(log n) inserts and cheap
    ranked range/rank queries — exactly what leaderboards need. Lists, hashes, and
    strings can't efficiently answer top-N or rank queries. Memcached/DAX/CloudFront
    can't do this at all.
  ref: concepts.md#session-store-rate-limiting-and-leaderboard-use-cases
- id: aws-caching-elasticache-dax-058
  difficulty: expert
  tags:
  - leaderboard
  - hot-key
  - sharding
  question: |
    A single global leaderboard sorted set becomes a hot key at extreme scale. What is
    a reasonable scaling approach?
  options:
  - Convert the sorted set into a single Memcached blob, so its multi-threaded node absorbs the read
    volume that one Redis shard cannot handle
  - Shard leaderboards (per-region or per-time-bucket) and merge results, and/or serve reads from replicas,
    to spread the load off one shard
  - Enable strong consistency on the sorted set, so ranked reads serialize through the primary and the
    hot shard sheds the excess concurrent traffic
  - Move the leaderboard into a DAX cluster, so its microsecond item cache serves the ranked queries and
    relieves the saturated Redis shard
  answer: 1
  explanation: |
    A single sorted set lives on one shard, so at extreme scale you shard by
    region/time bucket and merge, and use read replicas for read scaling. Memcached
    has no sorted set, strong consistency doesn't spread load, and DAX can't store
    sorted sets.
  ref: concepts.md#session-store-rate-limiting-and-leaderboard-use-cases
- id: aws-caching-elasticache-dax-059
  difficulty: advanced
  tags:
  - pubsub
  - streams
  - messaging
  question: |
    What is the key difference between Redis Pub/Sub and Redis Streams for fan-out,
    and when would you instead choose SNS/SQS/Kinesis?
  options:
  - Pub/Sub persists every message to disk for later replay, while Streams are fire-and-forget and drop
    any message a subscriber is not connected to receive
  - They are functionally identical delivery mechanisms, so the choice between Pub/Sub and Streams is
    arbitrary and driven only by which command syntax you prefer
  - Pub/Sub is fire-and-forget (offline subscribers miss messages); Streams add persistence and consumer
    groups; for durable, at-least-once, large-scale messaging use SNS/SQS/Kinesis
  - Streams exist only to back leaderboard rankings and cannot be used for general message fan-out between
    producers and consumer groups
  answer: 2
  explanation: |
    Pub/Sub delivers to currently-connected subscribers only (no persistence); Streams
    persist messages and support consumer groups. Redis fan-out is best-effort and
    low-latency; for durable, scalable, at-least-once delivery use SNS/SQS/Kinesis. The
    first option reverses the semantics.
  ref: concepts.md#session-store-rate-limiting-and-leaderboard-use-cases
- id: aws-caching-elasticache-dax-060
  difficulty: advanced
  tags:
  - memorydb
  - durability
  - primary-db
  question: |
    When is Amazon MemoryDB the right choice over ElastiCache Redis?
  options:
  - When you need a cheap, disposable cache and want the lowest node-hour price for data that can be lost
    and rebuilt from the source at any time
  - When you only need edge caching of static assets close to global users and want to offload origin
    egress at points of presence worldwide
  - When you need to cache DynamoDB items with minimal code changes and want a near drop-in, write-through
    accelerator in front of the table
  - When you want Redis-compatible microsecond reads AND durable, single-digit-ms writes as the PRIMARY
    database, because MemoryDB commits to a Multi-AZ transactional log before ack
  answer: 3
  explanation: |
    MemoryDB is a durable, Redis-compatible primary database: writes commit to a
    Multi-AZ transactional log before acknowledgment, giving durability with in-memory
    speed. It costs more and is overkill for a pure cache; edge caching is CloudFront;
    minimal-code DynamoDB item caching is DAX.
  ref: concepts.md#modern-and-serverless-first-caching-patterns
- id: aws-caching-elasticache-dax-061
  difficulty: intermediate
  tags:
  - api-gateway
  - caching
  - serverless
  question: |
    What does API Gateway's built-in response caching provide?
  options:
  - A per-stage response cache keyed by request parameters that offloads the backend for cacheable REST
    responses without adding a separate caching service
  - A fully managed shared Redis cluster that your application code connects to directly for arbitrary
    key/value storage and data structures
  - Edge caching that is identical to CloudFront, replicating responses to global points of presence close
    to every viewer for the lowest latency
  - A durable, Multi-AZ database for API state that persists request and response records long after their
    cache entries would have expired
  answer: 0
  explanation: |
    API Gateway caching is a per-stage response cache (configurable size and TTL) keyed
    by request parameters, reducing backend calls for cacheable responses. It is not a
    general Redis cluster, not the global edge network, and not a durable database.
  ref: concepts.md#modern-and-serverless-first-caching-patterns
- id: aws-caching-elasticache-dax-062
  difficulty: expert
  tags:
  - multi-tier
  - architecture
  - ttl
  question: |
    In a multi-tier cache (browser -> CloudFront edge -> API Gateway cache ->
    ElastiCache -> DB), how should TTLs generally be arranged?
  options:
  - Upper tiers such as the CloudFront edge should be fresher (shorter TTL) than lower tiers, so viewers
    always see the most current copy before it reaches the origin
  - Lower tiers fresher (shorter TTL) and upper tiers coarser (longer TTL), so each tier absorbs a slice
    while staleness is bounded closer to the source
  - All tiers must be configured with identical TTLs, so an entry expires at exactly the same moment across
    every layer and staleness stays uniform end to end
  - TTLs are irrelevant in multi-tier designs, since each layer independently revalidates against the one
    below it on every single request anyway
  answer: 1
  explanation: |
    Each tier absorbs some traffic; keeping lower tiers fresher and upper (edge) tiers
    coarser balances offload with bounded staleness. Making the edge fresher than the
    source is illogical, identical TTLs waste the layering, and TTLs are central to the
    design.
  ref: concepts.md#modern-and-serverless-first-caching-patterns
- id: aws-caching-elasticache-dax-063
  difficulty: intermediate
  tags:
  - serverless
  - ecpu
  - cost
  question: |
    ElastiCache Serverless is billed primarily along which dimensions?
  options:
  - The number of provisioned shards and replica nodes you reserve per hour, exactly as node-based
    ElastiCache clusters are billed by instance size and count
  - The number of CloudFront cache invalidations issued plus the edge data-transfer bytes served from
    points of presence each month
  - Data stored (GB-hr) plus ElastiCache Processing Units (ECPUs) consumed
  - The consumed DynamoDB read and write capacity units (RCUs and WCUs) that the cache offloads from the
    underlying table each month
  answer: 2
  explanation: |
    Serverless removes node/shard sizing and bills by GB-hr of data stored plus ECPUs
    consumed. Provisioned shard-hours describe node-based ElastiCache; invalidations
    are CloudFront; RCUs/WCUs are DynamoDB.
  ref: concepts.md#modern-and-serverless-first-caching-patterns
- id: aws-caching-elasticache-dax-064
  difficulty: advanced
  tags:
  - cost
  - replicas
  - cross-az
  question: |
    Which factors multiply the cost of a node-based ElastiCache Redis deployment?
  options:
  - Only the raw number of keys stored in the cluster, billed as a fixed per-key charge regardless of node
    size or how many replicas you run
  - Only the CloudFront egress bytes served from edge locations, since ElastiCache reuses that same
    data-transfer meter for all of its traffic
  - The TTL length configured on each key, because shorter expiries force more frequent metered refreshes
    that AWS charges for individually
  - Number of shards multiplied by (1 primary + N replicas) node-hours, plus cross-AZ data transfer for
    Multi-AZ replication
  answer: 3
  explanation: |
    Node-based cost scales with shards x (primary + replicas) node-hours, and Multi-AZ
    adds cross-AZ transfer charges. Key count/TTL affect memory sizing indirectly but
    aren't billing dimensions, and CloudFront egress is a different service.
  ref: concepts.md#cost-latency-and-capacity-estimation
- id: aws-caching-elasticache-dax-065
  difficulty: advanced
  tags:
  - cost
  - dax
  - rcu
  - estimation
  question: |
    For a hot read-heavy DynamoDB table, how do you reason about whether DAX is
    cost-effective?
  options:
  - Weigh DAX node-hour cost against the DynamoDB RCUs saved (and throttling avoided) by serving repeat
    reads from cache — for high read reuse on hot data, DAX is often cheaper than scaling table read capacity
  - DAX is always cheaper than the table regardless of workload, so no comparison is needed once any
    read traffic exists on the table
  - DAX cost is equal to the write capacity units the table consumes, so you size it directly from the
    table's provisioned WCU figure
  - DAX carries no separate charge because it is bundled into the DynamoDB table price and covered by the
    same provisioned read capacity
  answer: 0
  explanation: |
    DAX cost (node-hours) is traded against saved RCUs and avoided hot-partition
    throttling; for high read reuse it often wins over provisioning more read capacity.
    DAX is not free, not always cheaper, and its cost is not tied to WCUs.
  ref: concepts.md#cost-latency-and-capacity-estimation
- id: aws-caching-elasticache-dax-066
  difficulty: intermediate
  tags:
  - cost
  - cloudfront
  question: |
    Which CloudFront cost is typically REDUCED the most by a high cache hit rate?
  options:
  - The CloudFront per-request charge, which disappears entirely once the hit rate is high because edge
    hits are billed as free traffic
  - Origin egress and origin compute, because cached responses are served from the edge without hitting
    the origin
  - The hourly cost of the ElastiCache cluster behind the distribution, since edge hits let you shrink the
    number of cache nodes you run
  - The DynamoDB table storage cost, because content cached at the edge no longer has to be retained in
    the underlying table
  answer: 1
  explanation: |
    A high hit rate means fewer origin fetches, cutting origin egress and compute (the
    biggest savings). Edge requests still incur per-request charges; CloudFront doesn't
    reduce ElastiCache cluster or DynamoDB storage costs.
  ref: concepts.md#cost-latency-and-capacity-estimation
- id: aws-caching-elasticache-dax-067
  difficulty: advanced
  tags:
  - sizing
  - working-set
  - capacity
  question: |
    When sizing an ElastiCache cluster, when do you move from a single node to cluster
    mode enabled?
  options:
  - As soon as the keyspace grows past roughly 100 keys, since a single node is only meant to hold a
    handful of entries before it must be sharded
  - Only once you begin setting TTLs on keys, because per-key expiry can run on cluster mode enabled and
    a single node cannot evict expired entries
  - When the working-set size (hot keys x avg value size + overhead + eviction headroom) exceeds one node's
    RAM, or write throughput exceeds one primary
  - Never, because a single ElastiCache node scales vertically without limit and can always be resized to
    hold any working set and write rate
  answer: 2
  explanation: |
    Sharding is needed when the working set won't fit in one node's memory or the write
    rate exceeds a single primary's capacity. Key count alone, TTLs, and "infinite
    single node" are not the deciding criteria.
  ref: concepts.md#cost-latency-and-capacity-estimation
- id: aws-caching-elasticache-dax-068
  difficulty: expert
  tags:
  - selection
  - consistency
  - financial
  question: |
    A financial service must decrement inventory / read an account balance with strict
    correctness — no staleness tolerated on that read. How should caching be applied?
  options:
  - Cache the balance in Redis with a 1-second TTL and serve every read from that cached copy, since a
    one-second window is short enough to count as strongly consistent
  - Use a write-behind cache so balance updates are acknowledged fastest, letting the async flush reconcile
    the durable store a moment later
  - Put the balance behind CloudFront with a short TTL, so the edge serves the value close to users while
    keeping it fresh enough for correctness
  - Bypass the cache for that read (or use the source's strong-read path, e.g., a DynamoDB strongly consistent
    read that bypasses DAX); cache only the staleness-tolerant reads
  answer: 3
  explanation: |
    Caches here are eventually consistent; a correctness-critical read must go to the
    source's strong path (or bypass the cache). Strong DynamoDB reads bypass DAX by
    design. A short-TTL Redis/CloudFront copy still risks staleness, and write-behind
    adds a durability window — both unacceptable for balances.
  ref: concepts.md#trade-offs-and-when-to-use-what
- id: aws-caching-elasticache-dax-069
  difficulty: expert
  tags:
  - selection
  - scenario
  - edge
  question: |
    A global media site serves large static video/image assets to users worldwide and
    wants to minimize latency and origin egress. Which layer is the primary answer?
  options:
  - CloudFront (edge/CDN), caching assets near users with versioned URLs and long max-age; optionally
    Origin Shield to protect the origin
  - ElastiCache Redis in a single region, storing the video and image blobs in memory so global users read
    them from the cache instead of the origin
  - DAX in front of the media metadata table, so its microsecond item cache serves the large asset payloads
    close to users and cuts origin egress
  - MemoryDB as the durable asset store, letting its Multi-AZ log hold the media blobs and stream them to
    users worldwide with low latency
  answer: 0
  explanation: |
    Global, cacheable static media is the textbook CloudFront use case — edge caching
    cuts latency and origin egress; versioned URLs + long TTL + Origin Shield are the
    standard pattern. A single-region Redis doesn't help global latency, DAX caches
    DynamoDB items (not media blobs), and MemoryDB is a durable DB, not an asset CDN.
  ref: concepts.md#trade-offs-and-when-to-use-what
- id: aws-caching-elasticache-dax-070
  difficulty: expert
  tags:
  - selection
  - scenario
  - structures
  question: |
    Design constraint: real-time gaming leaderboard for 50M players, sub-ms ranked
    queries, global rate limiting, and presence pub/sub. Which caching stack fits?
  options:
  - A DAX cluster, because its microsecond item reads can maintain the ranked leaderboard, the global
    rate-limit counters, and the presence pub/sub directly in its cache
  - ElastiCache Redis/Valkey (sorted sets for ranking, INCR counters for limits, pub/sub for presence),
    sharded/replicated for scale and HA
  - CloudFront with Lambda@Edge computing player ranks at the edge, holding the leaderboard, counters, and
    presence state across points of presence worldwide
  - API Gateway response caching with a long TTL, serving the ranked leaderboard, limit counters, and
    presence updates from its per-stage cache
  answer: 1
  explanation: |
    The workload needs data structures (sorted sets, counters) and pub/sub — only
    Redis/Valkey provides them, scaled via sharding + replicas. DAX has no sorted sets
    or pub/sub, CloudFront/Lambda@Edge can't maintain a global ranked structure, and
    API Gateway caching is a response cache.
  ref: concepts.md#trade-offs-and-when-to-use-what
- id: aws-caching-elasticache-dax-071
  difficulty: advanced
  tags:
  - selection
  - dax
  - consistency
  - scenario
  question: |
    A read-heavy DynamoDB product-detail API needs microsecond reads, minimal code
    change, and can tolerate up to a few minutes of staleness. Which is the best fit
    and what is the main trade-off you accept?
  options:
  - ElastiCache Redis; trade-off is writing hand-rolled cache-aside and manual invalidation logic, in
    exchange for microsecond reads and minimal application code changes
  - CloudFront; trade-off is paying for global edge replication of product detail, in exchange for
    microsecond reads and near-zero code change on the DynamoDB path
  - DAX; trade-off is eventual consistency (strong reads bypass the cache) and stale entries until TTL,
    in exchange for near-zero code change and microsecond reads
  - MemoryDB; trade-off is the cost of durable Multi-AZ log commits you do not need, in exchange for
    microsecond reads and minimal application code changes
  answer: 2
  explanation: |
    DAX matches the constraints: drop-in DynamoDB caching with microsecond reads,
    accepting eventual consistency and TTL-bounded staleness. Redis adds code/ops for
    no extra benefit here, CloudFront is an edge API cache (and product detail may be
    per-request), and MemoryDB's durability is unneeded for a cache.
  ref: concepts.md#trade-offs-and-when-to-use-what
- id: aws-caching-elasticache-dax-072
  difficulty: intermediate
  tags:
  - selection
  - cheat-sheet
  question: |
    Which layer is the correct default for caching cacheable public GET API responses
    close to global users?
  options:
  - ElastiCache Memcached, storing the GET responses in a single-region multi-threaded node so global
    users read them from that shared in-memory cache
  - DAX, using its DynamoDB-API item cache to serve the cacheable HTTP GET responses close to users with
    microsecond reads
  - MemoryDB, holding the public GET responses in its durable Multi-AZ store and serving them to worldwide
    users with in-memory latency
  - CloudFront (optionally combined with API Gateway response caching)
  answer: 3
  explanation: |
    Cacheable public GET responses for global users are best served at the edge via
    CloudFront (and API Gateway caching can add per-stage response caching). Memcached
    and MemoryDB are in-region stores; DAX is DynamoDB item caching, not HTTP response
    caching.
  ref: concepts.md#trade-offs-and-when-to-use-what
- id: aws-caching-elasticache-dax-073
  difficulty: expert
  tags:
  - trade-offs
  - universal
  - interview
  question: |
    What is the single most important thing an interviewer wants you to articulate
    when you add ANY cache to a design?
  options:
  - The staleness window you accept, the invalidation strategy, the failure behavior when the cache is
    gone, and why the read/write ratio justifies the cache
  - The exact instance type and hourly dollar price of the cache node, since the hardware bill is what
    an interviewer most wants quantified
  - That caching universally improves both read latency and data consistency at once, so it is a strict
    win worth adding to any design
  - That the cache tier should serve as the durable system of record, with the backing database demoted
    to an occasional cold backup
  answer: 0
  explanation: |
    Every cache trades freshness/complexity for latency/cost; the senior answer names
    the accepted staleness window, invalidation approach, cold/dead-cache degradation,
    and the read/write justification. Caching does not improve consistency, and a
    volatile cache should not be the system of record (that's MemoryDB territory).
  ref: concepts.md#trade-offs-and-when-to-use-what
- id: aws-caching-elasticache-dax-074
  difficulty: beginner
  tags:
  - consistency
  - ap
  - fundamentals
  question: |
    Redis replicas, DAX caches, and CloudFront edges share which consistency
    characteristic by default?
  options:
  - They are all strongly consistent by default, so any read returns the source's most recently committed
    write with no staleness window
  - They are eventually consistent / AP-leaning — reads may be stale, so correctness-critical reads should
    bypass them
  - They guarantee linearizable reads across every replica and edge, so all clients observe writes in a
    single global order
  - They block each read until the tier has fully synchronized with the origin, trading latency to
    eliminate any chance of stale data
  answer: 1
  explanation: |
    All three are eventually consistent by default (async replication / TTL-based
    staleness), so a read may be stale; strongly consistent needs bypass the cache.
    None provide linearizability or block reads for synchronization by default.
  ref: concepts.md#trade-offs-and-when-to-use-what
- id: aws-caching-elasticache-dax-075
  difficulty: intermediate
  tags:
  - selection
  - memcached
  - cheat-sheet
  question: |
    Given a requirement for a pure, simple, disposable blob cache on a single large
    multi-threaded node with no HA or data-structure needs, which choice is most
    cost/complexity appropriate?
  options:
  - ElastiCache Redis cluster mode enabled with 10 shards
  - DAX
  - ElastiCache Memcached
  - MemoryDB
  answer: 2
  explanation: |
    Memcached fits a simple, multi-threaded, disposable blob cache with no HA/structure
    needs — the one scenario it is defensible. A 10-shard Redis cluster is overkill,
    DAX is DynamoDB-specific, and MemoryDB is a durable primary DB.
  ref: concepts.md#trade-offs-and-when-to-use-what
