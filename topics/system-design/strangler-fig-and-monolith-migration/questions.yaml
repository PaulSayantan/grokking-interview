topic: "Strangler Fig & Monolith-to-Microservices Migration"
domain: system-design
topic_slug: strangler-fig-and-monolith-migration
version: 1
questions:
  - id: strangler-fig-and-monolith-migration-001
    difficulty: beginner
    tags: [strangler-fig, fundamentals, incremental]
    question: |
      What is the core idea of the Strangler Fig pattern for migrating a monolith?
    options:
      - "Freeze all feature work and rewrite the whole system on a clean architecture, then cut over in one release"
      - "Grow a new system around the monolith and route slices of functionality to it until the monolith can be removed"
      - "Add more servers behind a load balancer to scale the existing monolith horizontally"
      - "Rewrite the database schema first, then leave the application code unchanged"
    answer: 1
    explanation: |
      The Strangler Fig pattern (Fowler) incrementally replaces the monolith by
      routing individual slices of functionality to new code behind an interception
      point, until the monolith is fully "strangled" and can be deleted. There is no
      big-bang cutover. The other options describe a rewrite, scaling, or a partial
      change that misses the incremental-replacement essence.
    ref: "concepts.md#the-strangler-fig-pattern"

  - id: strangler-fig-and-monolith-migration-002
    difficulty: beginner
    tags: [naming, metaphor]
    question: |
      Where does the "Strangler Fig" name come from?
    options:
      - "A database index structure that overtakes primary storage"
      - "A refactoring tool that strangles dead code paths"
      - "A network topology that isolates legacy nodes"
      - "A vine that grows around a host tree until it stands on its own and the host dies"
    answer: 3
    explanation: |
      Fowler named it after Australian strangler fig vines that germinate in a host
      tree's canopy, grow roots down and around it, and eventually form a
      self-supporting structure after the host tree is gone — mirroring how the new
      system grows around and eventually replaces the monolith.
    ref: "concepts.md#the-strangler-fig-pattern"

  - id: strangler-fig-and-monolith-migration-003
    difficulty: beginner
    tags: [big-bang, rewrite, risk]
    question: |
      Why is a "big-bang rewrite from scratch" of a large business-critical monolith
      usually discouraged?
    options:
      - "It freezes value delivery, chases undocumented behavior, and forces one high-risk all-or-nothing cutover"
      - "It cannot use a modern programming language"
      - "It always costs less than an incremental migration"
      - "Cloud providers do not support deploying rewritten systems"
    answer: 0
    explanation: |
      A big-bang rewrite typically halts feature delivery for months, must re-derive
      behavior that lives only in the old code's edge cases, chases a moving target,
      and ends in a single risky cutover with no partial rollback. That is why such
      rewrites "go down in flames most of the time."
    ref: "concepts.md#the-big-bang-rewrite-trap"

  - id: strangler-fig-and-monolith-migration-004
    difficulty: intermediate
    tags: [big-bang, second-system, requirements]
    question: |
      A team argues the monolith's real specification is "encoded in its behavior."
      What migration risk does this most directly warn against?
    options:
      - "Running two systems in parallel wastes money"
      - "The database will run out of connections"
      - "A rewrite will silently drop undocumented edge cases and reintroduce old bugs"
      - "Feature flags cannot be tested in production"
    answer: 2
    explanation: |
      Years of tax rules, edge cases, and incident-driven fixes are undocumented and
      live only in the code. A rewrite that works from a fresh spec silently loses
      them and reintroduces bugs the original had already fixed — a key reason to
      preserve behavior via incremental replacement rather than rewrite.
    ref: "concepts.md#the-big-bang-rewrite-trap"

  - id: strangler-fig-and-monolith-migration-005
    difficulty: beginner
    tags: [strangler-fig, benefits]
    question: |
      Which is a primary benefit Fowler attributes to the Strangler Fig approach over
      a rewrite?
    options:
      - "It eliminates the need for any tests"
      - "It removes the need for a database entirely"
      - "It guarantees the migration finishes faster than a rewrite"
      - "Risk is reduced and value arrives earlier because each replaced piece is small"
    answer: 3
    explanation: |
      Because each replaced slice is small and independently shippable, risk drops and
      new value lands continuously rather than only at the end. Incremental migration
      is usually more total engineering effort, not less — its win is risk reduction,
      not speed.
    ref: "concepts.md#the-strangler-fig-pattern"

  - id: strangler-fig-and-monolith-migration-006
    difficulty: intermediate
    tags: [transitional-architecture, cost]
    question: |
      What is "transitional architecture" in a Strangler Fig migration, and how should
      you view its cost?
    options:
      - "Routing layers and glue that exist only during migration and are thrown away later, an accepted price for safety"
      - "Permanent infrastructure that must never be removed"
      - "The final microservices topology after migration completes"
      - "A separate cloud account used to store backups forever"
    answer: 0
    explanation: |
      Transitional architecture is the proxies, adapters, and sync glue that exist
      only to let old and new coexist during migration; they are deleted afterward.
      This apparent waste is the deliberate cost of doing the migration safely and
      incrementally.
    ref: "concepts.md#the-strangler-fig-pattern"

  - id: strangler-fig-and-monolith-migration-007
    difficulty: intermediate
    tags: [event-interception, proxy]
    question: |
      In Strangler Fig terms, what does "event interception" provide?
    options:
      - "A way to encrypt all database columns during migration"
      - "A guarantee of exactly-once message delivery"
      - "A mechanism that captures a request before it reaches the monolith so it can be redirected old-or-new"
      - "A tool that automatically rewrites the monolith's source code"
    answer: 2
    explanation: |
      Event interception inserts a point (proxy/facade) that captures each inbound
      request before it hits the monolith, so you can route it to legacy or new code
      at fine granularity and roll back by flipping the route. It says nothing about
      encryption, delivery guarantees, or code rewriting.
    ref: "concepts.md#event-interception-and-asset-capture"

  - id: strangler-fig-and-monolith-migration-008
    difficulty: intermediate
    tags: [asset-capture, capability]
    question: |
      "Asset capture" during legacy displacement primarily means:
    options:
      - "Buying new hardware for the migration"
      - "Reclaiming a capability (and the data it owns) from the legacy system into the new one"
      - "Taking a database snapshot for disaster recovery"
      - "Capturing performance metrics from the monolith"
    answer: 1
    explanation: |
      Asset capture is about reclaiming a capability — an "asset" — from the legacy
      system into the new one, which usually includes moving the data that capability
      owns (typically the hardest part of the migration).
    ref: "concepts.md#event-interception-and-asset-capture"

  - id: strangler-fig-and-monolith-migration-009
    difficulty: intermediate
    tags: [branch-by-abstraction, steps]
    question: |
      What is the FIRST step of branch by abstraction?
    options:
      - "Delete the old implementation"
      - "Merge a long-lived feature branch into main"
      - "Switch all traffic to the new service at once"
      - "Create an abstraction layer capturing how clients interact with the component you want to replace"
    answer: 3
    explanation: |
      Branch by abstraction starts by introducing an abstraction (interface) over the
      current implementation. Then clients are migrated to it, a new implementation is
      built behind the same abstraction, clients are switched, and finally the old
      implementation is removed.
    ref: "concepts.md#branch-by-abstraction"

  - id: strangler-fig-and-monolith-migration-010
    difficulty: intermediate
    tags: [branch-by-abstraction, trunk-based]
    question: |
      How does branch by abstraction differ from doing a large change on a long-lived
      version-control feature branch?
    options:
      - "It keeps everything on the mainline so the trunk stays releasable throughout the change"
      - "It requires the team to stop deploying until the change is done"
      - "It can only be used for UI code"
      - "It forbids using feature flags"
    answer: 0
    explanation: |
      Branch by abstraction keeps both implementations on the mainline behind an
      abstraction, so the trunk is always buildable and releasable and you avoid a
      painful weeks-long merge. It pairs well with feature flags to switch
      implementations at runtime.
    ref: "concepts.md#branch-by-abstraction"

  - id: strangler-fig-and-monolith-migration-011
    difficulty: advanced
    tags: [branch-by-abstraction, parallel-run]
    question: |
      Why does branch by abstraction pair naturally with a parallel run?
    options:
      - "The abstraction forces the new implementation to be faster"
      - "It removes the need for the old implementation immediately"
      - "A router behind the abstraction can call both implementations and compare their results"
      - "It automatically shards the database"
    answer: 2
    explanation: |
      Because both implementations sit behind one abstraction, the routing object can
      invoke both the legacy and new implementations for the same input and compare
      outputs — exactly what a parallel run needs — while still serving the trusted
      (legacy) result.
    ref: "concepts.md#branch-by-abstraction"

  - id: strangler-fig-and-monolith-migration-012
    difficulty: intermediate
    tags: [seams, feathers]
    question: |
      In migration terminology, what is a "seam" (Michael Feathers)?
    options:
      - "A performance bottleneck in the database"
      - "A merge conflict between branches"
      - "The boundary of a Kubernetes namespace"
      - "A place where you can alter behavior without editing in that place"
    answer: 3
    explanation: |
      A seam is a point where you can change behavior without editing at that location
      — a natural cut line. Good service seams follow business capabilities / bounded
      contexts, which is where you split the monolith.
    ref: "concepts.md#identifying-seams-and-extraction-order"

  - id: strangler-fig-and-monolith-migration-013
    difficulty: intermediate
    tags: [extraction-order, prioritization]
    question: |
      When choosing which capability to extract from the monolith FIRST, what should
      you generally prefer?
    options:
      - "The most deeply entangled, most-joined core transactional table"
      - "A low-risk, high-value, loosely coupled capability with a clear owner"
      - "Whichever module has the most lines of code"
      - "The module written in the oldest language"
    answer: 1
    explanation: |
      Start with low-risk, high-value edges: loosely coupled, high-churn or
      high-value capabilities with clear ownership. The deeply entangled transactional
      core is extracted last, once you've built tooling and confidence.
    ref: "concepts.md#identifying-seams-and-extraction-order"

  - id: strangler-fig-and-monolith-migration-014
    difficulty: advanced
    tags: [extraction-order, anti-pattern, distributed-monolith]
    question: |
      A team's first move is to extract "the data-access layer" of the monolith into
      its own service. Why is this a poor extraction choice?
    options:
      - "It cuts along a technical layer, producing a chatty distributed monolith with no capability owner"
      - "Data-access layers cannot be deployed to the cloud"
      - "It is impossible to add an API to a data-access layer"
      - "Data-access code is always the highest-value capability"
    answer: 0
    explanation: |
      Cutting along a technical layer rather than a business capability yields a
      distributed monolith: services are chatty and synchronous, and no team owns a
      whole capability. Extraction should follow bounded contexts / capabilities, not
      layers.
    ref: "concepts.md#identifying-seams-and-extraction-order"

  - id: strangler-fig-and-monolith-migration-015
    difficulty: intermediate
    tags: [seams, dependency-graph, tactics]
    question: |
      Which tactic helps you find good extraction candidates in a large monolith?
    options:
      - "Pick modules alphabetically"
      - "Extract whichever module has the newest commit"
      - "Extract the module with the most database indexes"
      - "Build a dependency/call graph and look for weakly-connected components and rarely-joined tables"
    answer: 3
    explanation: |
      Static analysis and call graphs reveal loosely-coupled modules (weakly-connected
      components) and tables that are not widely joined — natural, low-coupling seams
      that are safer and cheaper to extract first.
    ref: "concepts.md#identifying-seams-and-extraction-order"

  - id: strangler-fig-and-monolith-migration-016
    difficulty: beginner
    tags: [facade, routing, proxy]
    question: |
      What role does the facade / routing layer play during a Strangler Fig migration?
    options:
      - "It stores all application state permanently"
      - "It replaces the need for any monitoring"
      - "It is the interception point that routes each request to either the monolith or a new service"
      - "It compiles the monolith into microservices automatically"
    answer: 2
    explanation: |
      The facade/proxy/API gateway sits in front and decides, per request, whether to
      serve from the legacy monolith or an already-migrated new service. It is the
      backbone that makes incremental routing and rollback possible.
    ref: "concepts.md#the-facade--routing-layer"

  - id: strangler-fig-and-monolith-migration-017
    difficulty: intermediate
    tags: [facade, rollback, config]
    question: |
      A key design requirement for the routing layer is that rolling a slice back to
      the monolith should be:
    options:
      - "A fast, config-driven change (flip the route), not a redeploy"
      - "A full application redeploy of every service"
      - "A manual database restore from backup"
      - "Impossible once traffic has been shifted"
    answer: 0
    explanation: |
      Safe incremental migration depends on cheap reversibility: flipping a route or
      feature flag back to the monolith must be a config change taking effect
      immediately, not a redeploy or data-restore operation.
    ref: "concepts.md#the-facade--routing-layer"

  - id: strangler-fig-and-monolith-migration-018
    difficulty: advanced
    tags: [facade, spof, availability]
    question: |
      Once introduced, the routing/facade layer sits on every request path. What is
      the main operational concern this creates?
    options:
      - "It makes URLs shorter"
      - "It forces the monolith to use a NoSQL database"
      - "It prevents the use of TLS"
      - "It can become a bottleneck or single point of failure, so it must be scalable and observable"
    answer: 3
    explanation: |
      Because the router is now on the critical path for all traffic, it must be
      horizontally scalable, highly available, and well-instrumented, or it becomes a
      new bottleneck / single point of failure for the whole system.
    ref: "concepts.md#the-facade--routing-layer"

  - id: strangler-fig-and-monolith-migration-019
    difficulty: intermediate
    tags: [facade, url-stability, clients]
    question: |
      Why should public URLs stay stable while the router shuffles traffic between the
      monolith and new services?
    options:
      - "To make the database faster"
      - "So the internal reshuffling is invisible to external clients and doesn't break them"
      - "Because URLs cannot be changed in HTTP"
      - "To reduce the number of microservices"
    answer: 1
    explanation: |
      Keeping public URLs stable means callers never see the internal migration; the
      router maps stable external paths to whichever backend currently owns them, so
      migration is transparent to clients.
    ref: "concepts.md#the-facade--routing-layer"

  - id: strangler-fig-and-monolith-migration-020
    difficulty: intermediate
    tags: [parallel-run, verification]
    question: |
      In a parallel run, which result is returned to the user?
    options:
      - "The new implementation's result, always"
      - "Whichever result arrives first"
      - "The legacy (authoritative) result, while the new result is computed and compared but not served"
      - "A random choice between the two"
    answer: 2
    explanation: |
      In a parallel run the legacy implementation stays authoritative and its output
      is served to users; the new implementation runs in parallel and its output is
      compared and logged but not served, so new-code bugs cannot affect users until
      trust is established.
    ref: "concepts.md#parallel-run"

  - id: strangler-fig-and-monolith-migration-021
    difficulty: advanced
    tags: [parallel-run, side-effects, hazard]
    question: |
      What is the biggest operational hazard of running a new implementation in
      parallel with the legacy one on live traffic?
    options:
      - "If both paths perform side effects (writes, emails, charges) they get duplicated"
      - "The new code will run too slowly to compare"
      - "Parallel run requires shutting down the monolith"
      - "Comparisons cannot be logged"
    answer: 0
    explanation: |
      If the new path also writes to the DB, sends emails, or charges cards, those
      side effects happen twice. The new path must run in a no-side-effect/shadow mode
      or write to a scratch store; only its computed result should be compared.
    ref: "concepts.md#parallel-run"

  - id: strangler-fig-and-monolith-migration-022
    difficulty: advanced
    tags: [parallel-run, divergence, acceptable-diff]
    question: |
      During a parallel run you observe the new implementation producing a DIFFERENT
      result than the legacy one. What is the correct interpretation?
    options:
      - "Always a bug in the new code that must be fixed to match the old exactly"
      - "Always safe to ignore since the old result is served anyway"
      - "Proof that parallel run cannot work"
      - "Investigate: it may be a new-code bug, or the old behavior was itself a bug you are now fixing (an acceptable diff)"
    answer: 3
    explanation: |
      A divergence is a signal to investigate, not an automatic verdict. Sometimes the
      new code is wrong; sometimes it correctly fixes a long-standing bug in the legacy
      behavior — an "acceptable diff" you deliberately accept. You decide case by case.
    ref: "concepts.md#parallel-run"

  - id: strangler-fig-and-monolith-migration-023
    difficulty: intermediate
    tags: [parallel-run, scientist, tooling]
    question: |
      GitHub's "Scientist" library is a canonical tool for which technique?
    options:
      - "Sharding a relational database"
      - "Running a control and a candidate implementation, comparing results, and reporting mismatches"
      - "Compiling multiple languages into one binary"
      - "Automatic schema migration"
    answer: 1
    explanation: |
      Scientist runs the "control" (legacy) and "candidate" (new) implementations,
      compares their results, swallows candidate exceptions so users aren't affected,
      and reports mismatches — the essence of a parallel run for refactoring under
      measurement.
    ref: "concepts.md#parallel-run"

  - id: strangler-fig-and-monolith-migration-024
    difficulty: intermediate
    tags: [dark-launch, shadow-traffic]
    question: |
      What is "dark launching" a new service?
    options:
      - "Deploying it only at night to reduce load"
      - "Launching it with all logging disabled"
      - "Deploying and exercising it in production without exposing it to users"
      - "Deploying it to a separate cloud region for disaster recovery"
    answer: 2
    explanation: |
      Dark launching means the new functionality is deployed and driven with real
      production input/load but not exposed to users — for example via shadow
      (mirrored) traffic whose responses are discarded — so you validate it invisibly.
    ref: "concepts.md#dark-launching-and-shadow-traffic"

  - id: strangler-fig-and-monolith-migration-025
    difficulty: advanced
    tags: [shadow-traffic, mirror, envoy]
    question: |
      With shadow (mirror) traffic, the proxy duplicates live requests to the new
      service. What must you guard against?
    options:
      - "Duplicate side effects if the shadowed path also writes data or triggers actions"
      - "The mirrored response being shown to the user"
      - "The proxy refusing to duplicate requests"
      - "The legacy service seeing the mirrored copy"
    answer: 0
    explanation: |
      Mirrored responses are discarded, so users aren't affected by them. The danger is
      the same as parallel run: if the shadowed path performs writes or external actions
      you get duplicate side effects, so the shadow path must be side-effect-free.
    ref: "concepts.md#dark-launching-and-shadow-traffic"

  - id: strangler-fig-and-monolith-migration-026
    difficulty: advanced
    tags: [parallel-run, dark-launch, canary, terminology]
    question: |
      Which statement correctly distinguishes parallel run, dark launch, and canary?
    options:
      - "They are three names for the same thing"
      - "Canary serves the old result, parallel run serves the new result, dark launch serves both"
      - "Only canary can be used before a cutover"
      - "Parallel run compares outputs and serves the old one, dark launch exercises the new path in prod invisibly, canary shifts a small % of real traffic and watches metrics"
    answer: 3
    explanation: |
      Parallel run computes and compares both outputs but serves the legacy result;
      dark launch/shadow exercises the new path in production invisibly; canary shifts
      a small slice of real user traffic to the new path while watching error/latency
      metrics. They compose: shadow, then canary, then full cutover.
    ref: "concepts.md#dark-launching-and-shadow-traffic"

  - id: strangler-fig-and-monolith-migration-027
    difficulty: beginner
    tags: [data-migration, database-per-service, target]
    question: |
      What is the target data architecture when decomposing a monolith into services?
    options:
      - "One shared database that all services read and write"
      - "Database-per-service, where each service privately owns its schema and others reach it via API/events"
      - "No database at all; everything in memory"
      - "A single global table locked with 2PC on every write"
    answer: 1
    explanation: |
      The microservices target is database-per-service: each service owns its data
      privately and other services access it only through its API or via events. This
      is what gives independent deployability and fault isolation.
    ref: "concepts.md#migrating-the-data-shared-db-to-database-per-service"

  - id: strangler-fig-and-monolith-migration-028
    difficulty: intermediate
    tags: [data-migration, joins, foreign-keys]
    question: |
      After splitting into database-per-service, which capability of the old shared DB
      is LOST and must be handled differently?
    options:
      - "The ability to store rows"
      - "The ability to create indexes"
      - "Cross-service JOINs, foreign-key constraints, and multi-table ACID transactions"
      - "The ability to run SELECT statements"
    answer: 2
    explanation: |
      Once each service owns a separate database, you can no longer JOIN across
      services, enforce cross-service foreign keys, or wrap multiple services' writes
      in one ACID transaction. These are replaced by API composition/read models,
      app-level checks, and sagas.
    ref: "concepts.md#migrating-the-data-shared-db-to-database-per-service"

  - id: strangler-fig-and-monolith-migration-029
    difficulty: intermediate
    tags: [data-migration, sequence, schema-split]
    question: |
      Which ordering best describes a safe data-decomposition journey?
    options:
      - "Physically separate databases first, then figure out which service uses which tables"
      - "Delete the shared DB immediately, then rebuild data in each service"
      - "Keep one shared DB permanently and just add services"
      - "Shared DB with split services, then split the schema/views, then physically separate DBs syncing with CDC/outbox, then retire the shared DB"
    answer: 3
    explanation: |
      A safe path passes through transitional stages: split services still on a shared
      DB, then partition the schema so each service uses only its tables, then split
      the databases physically while syncing via CDC/outbox, then finally retire the
      shared DB.
    ref: "concepts.md#migrating-the-data-shared-db-to-database-per-service"

  - id: strangler-fig-and-monolith-migration-030
    difficulty: intermediate
    tags: [shared-db, anti-pattern, transitional]
    question: |
      Two extracted services sharing one database is best described as:
    options:
      - "Acceptable as a temporary transitional state but an anti-pattern to leave in place"
      - "The ideal permanent microservices design"
      - "Impossible to implement"
      - "Always faster than database-per-service, so preferred long-term"
    answer: 0
    explanation: |
      A shared DB during migration is a fine temporary bridge, but leaving it
      permanently couples deployments, hides ownership, and creates a shared failure
      domain — producing a distributed monolith. It must be split before the migration
      is considered done.
    ref: "concepts.md#the-transitional-shared-database-anti-pattern"

  - id: strangler-fig-and-monolith-migration-031
    difficulty: advanced
    tags: [shared-db, coupling, deployability]
    question: |
      Why does a permanently shared database defeat a key goal of microservices?
    options:
      - "It uses too much disk space"
      - "It cannot store JSON"
      - "A schema change for one service can break another, so services can no longer deploy independently"
      - "It forces the use of a NoSQL engine"
    answer: 2
    explanation: |
      Independent deployability is a core microservices goal. When services share a
      schema, one service's schema change can break the others, coupling their release
      cycles — you get the ops cost of microservices with none of the autonomy.
    ref: "concepts.md#the-transitional-shared-database-anti-pattern"

  - id: strangler-fig-and-monolith-migration-032
    difficulty: intermediate
    tags: [distributed-monolith, sequencing]
    question: |
      A team splits the code into services, ships a demo, and plans to "split the
      databases later" — but never does. What is the likely outcome?
    options:
      - "A clean microservices architecture"
      - "A distributed monolith: the operational cost of microservices with none of the independence"
      - "A modular monolith"
      - "A serverless architecture"
    answer: 1
    explanation: |
      "Split the databases later" is where migrations die. Leaving a shared DB behind
      split code yields a distributed monolith — you pay the network/ops tax of
      microservices while still being coupled through the database. Split the schema
      with or before the service.
    ref: "concepts.md#the-transitional-shared-database-anti-pattern"

  - id: strangler-fig-and-monolith-migration-033
    difficulty: intermediate
    tags: [dual-write, consistency, anti-pattern]
    question: |
      Why is having the application "write to both the old DB and the new service/broker"
      (a dual write) an anti-pattern for keeping data in sync?
    options:
      - "It is too slow to be usable"
      - "It requires a NoSQL database"
      - "Brokers cannot accept writes from applications"
      - "There is no atomicity across the two systems, so a failure between the writes causes permanent divergence"
    answer: 3
    explanation: |
      Two separate writes to two systems have no shared transaction. If the process
      crashes or the second write fails after the first succeeds, the two systems
      permanently disagree and nothing reconciles them. Retries and reordering don't
      fix the fundamental lack of cross-system atomicity.
    ref: "concepts.md#the-dual-write-trap"

  - id: strangler-fig-and-monolith-migration-034
    difficulty: advanced
    tags: [dual-write, retries, ordering]
    question: |
      A developer proposes "just add retries and reorder the two writes" to fix the
      dual-write problem. Why is this insufficient?
    options:
      - "Any interleaving can still fail between the two writes, so divergence remains possible"
      - "Retries are not supported by most databases"
      - "Reordering writes is illegal in SQL"
      - "It only works if both systems use the same vendor"
    answer: 0
    explanation: |
      No matter the order or retry policy, there is a window where one write has
      committed and the other has not, and a crash there leaves the systems
      inconsistent. Only a single atomic local write plus a derived update (outbox/CDC)
      — or an expensive distributed transaction — removes the gap.
    ref: "concepts.md#the-dual-write-trap"

  - id: strangler-fig-and-monolith-migration-035
    difficulty: advanced
    tags: [outbox, transactional, atomicity]
    question: |
      How does the transactional outbox pattern avoid the dual-write problem during
      migration?
    options:
      - "By using two-phase commit across the DB and the broker"
      - "By disabling all retries"
      - "By writing the business change and an outbox row in the SAME local transaction, then relaying the outbox row to the new system"
      - "By writing to the broker first and the database second"
    answer: 2
    explanation: |
      The outbox inserts an event row in the same local ACID transaction as the
      business update, so both commit or neither does. A separate relay then publishes
      the outbox rows to the new service/broker — one atomic write, no dual-write gap.
    ref: "concepts.md#cdc-and-the-outbox-pattern-for-sync-during-migration"

  - id: strangler-fig-and-monolith-migration-036
    difficulty: advanced
    tags: [cdc, debezium, legacy]
    question: |
      Why is Change Data Capture (e.g. Debezium tailing the DB transaction log)
      especially attractive for syncing data out of a LEGACY monolith?
    options:
      - "It requires rewriting the monolith in a new language"
      - "It deletes the monolith's data automatically"
      - "It only works if the monolith already publishes events"
      - "It needs no application change to the monolith, since it reads the DB's transaction log directly"
    answer: 3
    explanation: |
      CDC reads committed changes from the database's transaction log (binlog/WAL),
      so it can stream every change to the new store without touching the legacy
      application code — ideal when the monolith is hard or risky to modify.
    ref: "concepts.md#cdc-and-the-outbox-pattern-for-sync-during-migration"

  - id: strangler-fig-and-monolith-migration-037
    difficulty: advanced
    tags: [cdc, backfill, migration]
    question: |
      You must move a table's data to a new service's database while the monolith keeps
      writing. Which approach keeps the new store current with minimal disruption?
    options:
      - "Snapshot/backfill the existing data, then CDC-stream ongoing changes so the new store stays current"
      - "Lock the table for the entire migration and copy it once"
      - "Dual-write from the application to both databases"
      - "Ask users to stop using the system until migration completes"
    answer: 0
    explanation: |
      The standard pattern is backfill-plus-tail: take a snapshot of existing rows,
      then use CDC to stream subsequent committed changes into the new store, so it
      stays consistent without locking the table or resorting to fragile dual writes.
    ref: "concepts.md#cdc-and-the-outbox-pattern-for-sync-during-migration"

  - id: strangler-fig-and-monolith-migration-038
    difficulty: advanced
    tags: [outbox, cdc, idempotency]
    question: |
      Both outbox relays and CDC pipelines deliver changes at-least-once. What does
      this require of the consumer in the new service?
    options:
      - "It must reject all duplicate-looking messages by crashing"
      - "It must use exactly-once delivery from the broker"
      - "It must be idempotent so processing the same change more than once is safe"
      - "It must store no state"
    answer: 2
    explanation: |
      At-least-once delivery means a change can be delivered more than once (e.g. after
      a relay restart). Consumers must be idempotent — deduplicating or making repeated
      application of the same change a no-op — to stay correct.
    ref: "concepts.md#cdc-and-the-outbox-pattern-for-sync-during-migration"

  - id: strangler-fig-and-monolith-migration-039
    difficulty: advanced
    tags: [sync-direction, authoritative-writer, loops]
    question: |
      Why is two-way (bidirectional) data sync between the monolith DB and a new
      service's DB risky during migration?
    options:
      - "It is impossible with CDC"
      - "It can create update loops and conflicts unless there is a single authoritative writer per datum"
      - "It always doubles storage cost"
      - "Databases cannot replicate in two directions"
    answer: 1
    explanation: |
      Bidirectional sync can echo a change back and forth (loops) and creates
      write-write conflicts. The safe rule is one authoritative writer per piece of
      data at any time, syncing outward from it, rather than both sides writing and
      syncing to each other.
    ref: "concepts.md#cdc-and-the-outbox-pattern-for-sync-during-migration"

  - id: strangler-fig-and-monolith-migration-040
    difficulty: intermediate
    tags: [rollback, reversibility]
    question: |
      What makes incremental Strangler Fig migration fundamentally SAFE compared to a
      big-bang cutover?
    options:
      - "It never touches the database"
      - "It requires no testing"
      - "It finishes faster"
      - "Every step is small and reversible, so a failed cutover affects one capability and can be rolled back quickly"
    answer: 3
    explanation: |
      Safety comes from reversibility and small blast radius: each slice is
      independently switchable and roll-back-able (usually a route/flag flip), so a bad
      cutover impacts one capability rather than the whole system.
    ref: "concepts.md#rollback-safety-and-reversibility"

  - id: strangler-fig-and-monolith-migration-041
    difficulty: advanced
    tags: [rollback, expand-contract, schema]
    question: |
      What is the "expand/contract" (parallel change) technique for schema changes
      during migration?
    options:
      - "Add the new schema and write both (expand), backfill and switch reads (migrate), then drop the old (contract) so you can roll back at each stage"
      - "Drop the old column and add the new column in a single migration"
      - "Expand the database disk, then contract it after migration"
      - "Run two databases forever"
    answer: 0
    explanation: |
      Expand/contract makes schema changes in backward-compatible steps: expand (add
      new structure, dual-write), migrate (backfill and switch reads), then contract
      (remove old). You never take a breaking change at once, so rollback is possible
      at any stage.
    ref: "concepts.md#rollback-safety-and-reversibility"

  - id: strangler-fig-and-monolith-migration-042
    difficulty: advanced
    tags: [rollback, data, hard-part]
    question: |
      In a Strangler Fig cutover, what is typically the HARDEST thing to roll back?
    options:
      - "The routing configuration"
      - "The feature flag state"
      - "Data that the new service already wrote and that does not exist in the old store"
      - "The proxy's TLS certificate"
    answer: 2
    explanation: |
      Routing and flags roll back cheaply. The hard part is data: rows the new service
      wrote may not exist in the monolith's store, so you must keep sync running (or
      make new writes replayable back into the monolith) to preserve the ability to
      revert.
    ref: "concepts.md#rollback-safety-and-reversibility"

  - id: strangler-fig-and-monolith-migration-043
    difficulty: intermediate
    tags: [rollback, keep-legacy-warm]
    question: |
      After cutting a slice over to the new service, what does "reversible until proven"
      imply you should do with the legacy code path?
    options:
      - "Delete it immediately to reduce clutter"
      - "Keep it alive and warm until the new service has proven itself in production for a meaningful period"
      - "Move it to a different cloud provider"
      - "Encrypt it and archive it offline"
    answer: 1
    explanation: |
      Treat each cutover as provisional: keep the legacy path available so you can flip
      back quickly if the new service misbehaves, and only delete the old code once the
      new one has demonstrably worked in production for a while.
    ref: "concepts.md#rollback-safety-and-reversibility"

  - id: strangler-fig-and-monolith-migration-044
    difficulty: intermediate
    tags: [when-not-to-migrate, modular-monolith]
    question: |
      A small team runs a monolith that deploys fine and ships features at an
      acceptable pace. The business asks to "go microservices." What is the strongest
      senior recommendation?
    options:
      - "Immediately split into as many services as possible"
      - "Rewrite the whole thing from scratch"
      - "Add a shared database for all future services"
      - "Consider not migrating, or move to a modular monolith, since a healthy monolith and a small team make microservices mostly cost with little benefit"
    answer: 3
    explanation: |
      If the monolith is healthy and the team is small, microservices add
      distributed-systems and ops tax with little payoff. A modular monolith gives most
      boundary benefits without distribution cost; "don't migrate" is a legitimate,
      senior-level answer.
    ref: "concepts.md#when-not-to-migrate"

  - id: strangler-fig-and-monolith-migration-045
    difficulty: advanced
    tags: [when-not-to-migrate, boundaries]
    question: |
      Why is "unclear service boundaries" a reason to delay a microservices migration?
    options:
      - "Splitting now bakes in wrong boundaries that are expensive to move once services and data are separated"
      - "Unclear boundaries make the database faster"
      - "You cannot deploy services without clear boundaries"
      - "Boundaries are irrelevant to migration"
    answer: 0
    explanation: |
      Service and data boundaries are costly to change after extraction. If bounded
      contexts aren't yet stable, extracting now locks in likely-wrong boundaries;
      better to modularize in-process first and extract once boundaries settle.
    ref: "concepts.md#when-not-to-migrate"

  - id: strangler-fig-and-monolith-migration-046
    difficulty: intermediate
    tags: [when-not-to-migrate, root-cause]
    question: |
      The real pain is a slow build, flaky tests, and no CI/CD. How do microservices
      relate to this problem?
    options:
      - "Microservices automatically fix build and test problems"
      - "Microservices are required before you can add CI/CD"
      - "Microservices won't fix those problems and often make them worse, so address the real root cause first"
      - "Only microservices can have automated tests"
    answer: 2
    explanation: |
      Poor tests, slow builds, and missing CI/CD are process/engineering problems that
      microservices don't solve and often amplify (now across many services). Fix the
      root cause; don't use a migration as a proxy for it.
    ref: "concepts.md#when-not-to-migrate"

  - id: strangler-fig-and-monolith-migration-047
    difficulty: intermediate
    tags: [drivers, when-to-migrate, conways-law]
    question: |
      Which is a legitimate driver TO migrate a monolith toward microservices?
    options:
      - "The team wants to use a trendy architecture"
      - "To eliminate the need for monitoring"
      - "To avoid writing any integration tests"
      - "Independent scaling of hot components, independent deployability for many teams, and fault isolation"
    answer: 3
    explanation: |
      Sound drivers include independently scaling hot paths, letting many teams deploy
      autonomously (Conway's Law alignment), fault isolation, and polyglot needs.
      "It's trendy" is not a reason; microservices are a means to team autonomy at
      scale, not a goal.
    ref: "concepts.md#when-not-to-migrate"

  - id: strangler-fig-and-monolith-migration-048
    difficulty: intermediate
    tags: [incremental-vs-big-bang, trade-off]
    question: |
      Comparing incremental (Strangler Fig) migration with a big-bang rewrite, which
      statement is accurate?
    options:
      - "Big-bang is lower risk because everything changes at once"
      - "Incremental is lower risk and delivers value earlier, but typically costs more total engineering effort"
      - "Incremental delivers no value until the end"
      - "Big-bang always finishes faster and more reliably"
    answer: 1
    explanation: |
      Incremental migration reduces risk (small, reversible steps) and delivers value
      continuously, at the cost of more total engineering effort (transitional glue,
      running two systems, data sync). Big-bang is higher risk with value only at the
      end — which is why the industry consensus is "strangle, don't rewrite" for
      systems that matter.
    ref: "concepts.md#incremental-versus-big-bang-the-trade-off"

  - id: strangler-fig-and-monolith-migration-049
    difficulty: beginner
    tags: [incremental-vs-big-bang, feedback]
    question: |
      A major advantage of incremental migration over big-bang, in terms of feedback,
      is that:
    options:
      - "You get continuous feedback as each slice ships to production"
      - "You get no feedback until the final cutover"
      - "Feedback is only available in a staging environment"
      - "Feedback requires shutting down the monolith"
    answer: 0
    explanation: |
      Because each slice reaches production on its own, incremental migration gives
      continuous, real feedback that informs later slices — versus big-bang, which
      yields no production feedback until one final, risky launch.
    ref: "concepts.md#incremental-versus-big-bang-the-trade-off"

  - id: strangler-fig-and-monolith-migration-050
    difficulty: advanced
    tags: [scenario, end-to-end, sequencing]
    question: |
      You lead migration of a 10-year-old monolith. Which end-to-end sequence best
      reflects a safe Strangler Fig approach?
    options:
      - "Rewrite everything, then cut over in one release on a weekend"
      - "Split all databases first, then decide which services to build"
      - "Find seams, put a facade in front, extract a low-risk slice behind an abstraction, sync its data with CDC/outbox, parallel-run to verify, canary the cutover with fast rollback, then delete old code"
      - "Dual-write to old and new stores for every entity, then hope they stay consistent"
    answer: 2
    explanation: |
      The safe sequence is: identify seams / a low-risk high-value slice, add an
      interception facade, extract that slice (branch by abstraction), sync its data
      with CDC/outbox (never dual-write), parallel-run/shadow to verify, canary the
      cutover with instant rollback, and only then remove the legacy code — repeating
      per slice.
    ref: "concepts.md#the-strangler-fig-pattern"
