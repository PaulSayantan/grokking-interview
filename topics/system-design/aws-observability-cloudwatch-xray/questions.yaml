topic: 'Observability on AWS: CloudWatch, X-Ray and CloudTrail'
domain: system-design
topic_slug: aws-observability-cloudwatch-xray
version: 1
questions:
- id: aws-observability-cloudwatch-xray-001
  difficulty: beginner
  tags: [three-pillars, fundamentals]
  question: |
    Which set correctly maps the three pillars of observability to AWS services?
  options:
  - Metrics → CloudWatch Metrics; Logs → CloudWatch Logs; Traces → AWS X-Ray
  - Metrics → CloudTrail; Logs → X-Ray; Traces → Config
  - Metrics → Config; Logs → CloudTrail; Traces → CloudWatch Logs
  - Metrics → X-Ray; Logs → Config; Traces → CloudTrail
  answer: 0
  explanation: |
    The three pillars are metrics, logs and traces, backed by CloudWatch Metrics,
    CloudWatch Logs and X-Ray respectively. CloudTrail is API audit and Config is
    resource-state/compliance — neither is one of the three telemetry pillars.
  ref: concepts.md#three-pillars-of-observability-on-aws
- id: aws-observability-cloudwatch-xray-002
  difficulty: beginner
  tags: [three-pillars, when-to-use]
  question: |
    You need to answer "where in a multi-service request did the latency go?"
    Which pillar/service is purpose-built for this?
  options:
  - CloudWatch Metrics — look at p99 latency per service
  - CloudWatch Logs — grep the logs for slow requests
  - AWS X-Ray traces — the service map attributes latency per segment
  - CloudTrail — inspect the API call timing
  answer: 2
  explanation: |
    Latency attribution across a call graph is exactly what distributed tracing
    (X-Ray) does: segments/subsegments time each hop. Metrics give per-service p99
    but not the causal path of one request; logs lack timing across services;
    CloudTrail audits API calls, not request latency.
  ref: concepts.md#three-pillars-of-observability-on-aws
- id: aws-observability-cloudwatch-xray-003
  difficulty: intermediate
  tags: [three-pillars, correlation, emf]
  question: |
    What is the primary purpose of CloudWatch Embedded Metric Format (EMF)?
  options:
  - To compress and gzip log files automatically before they are batched and written to an S3 archive bucket
    to lower ingestion cost
  - To transparently encrypt metric data at rest in CloudWatch using a customer-managed KMS key scoped per
    metric namespace
  - To replace X-Ray as the distributed-tracing backend by embedding span timing directly inside each emitted
    structured log line
  - To emit a structured log line that also carries extractable metrics, so you get high-cardinality metrics
    without a separate PutMetricData call
  answer: 3
  explanation: |
    EMF lets an application write a single structured log that CloudWatch parses to
    also generate metrics — giving both the underlying log and the metric in one
    write, and supporting higher-cardinality dimensions without paying up front per
    custom metric via PutMetricData. It is not compression, encryption, or tracing.
  ref: concepts.md#three-pillars-of-observability-on-aws
- id: aws-observability-cloudwatch-xray-004
  difficulty: intermediate
  tags: [three-pillars, anti-pattern]
  question: |
    Why is it an anti-pattern to compute "count of HTTP 500s over the last week" by
    repeatedly running a Logs Insights query as a live dashboard widget?
  options:
  - Logs Insights lacks a filter command for HTTP status fields, so it physically cannot isolate the 500-level
    responses out of the stream
  - Logs Insights bills per GB of data scanned per query, so a repeated wide-range scan is expensive versus
    a metric filter that counts on ingestion
  - CloudWatch Logs are hard-deleted after 24 hours by default, so a week-wide query would find no events
    left to count anyway
  - CloudWatch metrics can only store gauge values and are unable to represent a cumulative count such as
    a running total of HTTP 500s
  answer: 1
  explanation: |
    Logs Insights charges per GB scanned each run; repeatedly scanning a week of logs
    is costly. A metric filter increments a metric on ingestion (no scan), which you
    then alarm/graph cheaply. Insights can filter by status; retention is configurable;
    metrics represent counts fine.
  ref: concepts.md#three-pillars-of-observability-on-aws
- id: aws-observability-cloudwatch-xray-005
  difficulty: beginner
  tags: [metrics, resolution]
  question: |
    What is a CloudWatch high-resolution custom metric?
  options:
  - A metric stored at up to 1-second granularity, with alarms able to evaluate as fast as 10-second periods
  - A custom metric configured with more than 30 dimensions so it can capture very high-cardinality label
    combinations
  - A metric that is retained for the full 15 months at 1-second granularity instead of being rolled up
    into coarser aggregates
  - A metric that is automatically replicated to every AWS region so dashboards render identically worldwide
  answer: 0
  explanation: |
    High-resolution metrics use StorageResolution=1 (1-second), and high-res alarms
    can evaluate at 10-second periods. Retention rolls up over time (1-second data is
    only kept 3 hours); dimensions are unrelated; metrics are regional, not
    auto-replicated.
  ref: concepts.md#cloudwatch-metrics-resolution-and-namespaces
- id: aws-observability-cloudwatch-xray-006
  difficulty: intermediate
  tags: [metrics, retention]
  question: |
    A teammate wants to view 1-second-resolution CPU spikes from a month ago in
    CloudWatch. Why can't they?
  options:
  - High-resolution metrics older than a week are only visible to the account root user, not to IAM roles
    with CloudWatch read access
  - You must first enable a paid CloudWatch add-on before the console will render any metric data older than
    the current day
  - 'CloudWatch rolls up data over time: 1-second data is retained ~3 hours, 1-minute ~15 days, and only
    1-hour aggregates survive out to 15 months'
  - CloudWatch discards every metric datapoint older than 24 hours entirely, regardless of its storage resolution
  answer: 2
  explanation: |
    CloudWatch ages data into coarser resolutions: 1-second lasts ~3 hours, 1-minute
    ~15 days, 5-minute ~63 days, and 1-hour up to 15 months. So month-old data exists
    only as 1-hour aggregates — the sub-minute detail is gone. Metrics are not deleted
    at 24 hours and history is not a paywalled feature.
  ref: concepts.md#cloudwatch-metrics-resolution-and-namespaces
- id: aws-observability-cloudwatch-xray-007
  difficulty: intermediate
  tags: [metrics, cost, judgment]
  question: |
    For a latency-sensitive autoscaling target you consider 1-second high-resolution
    metrics with 10-second alarms versus standard 1-minute metrics. What is the main
    trade-off?
  options:
  - High-res metrics cannot trigger Auto Scaling policies because scaling only reads 1-minute periods; standard
    metrics are required for scaling
  - Standard 1-minute metrics carry stronger durability guarantees and a higher retention SLA than high-resolution
    metrics do
  - There is no cost difference between the two resolutions, so you should always default to high-resolution
    for every metric
  - High-res detects spikes much faster but costs more (more PutMetricData volume, higher-priced high-res
    alarms) and keeps sub-minute detail only ~3 hours
  answer: 3
  explanation: |
    High-resolution buys sub-minute detection (valuable for fast scaling) at higher
    cost and short fine-grained retention. Both resolutions can drive Auto Scaling;
    durability isn't the distinction; and there is a real cost difference — so
    "always high-res" is wrong.
  ref: concepts.md#cloudwatch-metrics-resolution-and-namespaces
- id: aws-observability-cloudwatch-xray-008
  difficulty: advanced
  tags: [metrics, api, cost]
  question: |
    Your service emits millions of individual measurements per minute and you want a
    p50/p90/max in CloudWatch while minimizing PutMetricData cost and calls. Best
    approach?
  options:
  - Call PutMetricData once per measurement so every raw value is stored individually and percentiles stay
    perfectly exact
  - Publish pre-aggregated statistic sets (min/max/sum/count) in batched PutMetricData calls (up to 1,000
    metrics/call)
  - Write each measurement to CloudWatch Logs and scan the whole group with Insights on every dashboard refresh
    to compute the percentiles
  - Store the values in a DynamoDB table and compute the p50/p90/max client-side before rendering the dashboard
  answer: 1
  explanation: |
    Statistic sets let you send min/max/sum/count aggregates instead of every raw
    point, and batching up to 1,000 metrics per call slashes API volume and cost.
    Per-measurement calls are prohibitively expensive; scanning logs each refresh is
    costly; DynamoDB doesn't give you CloudWatch alarms/graphs.
  ref: concepts.md#cloudwatch-metrics-resolution-and-namespaces
- id: aws-observability-cloudwatch-xray-009
  difficulty: intermediate
  tags: [cardinality, cost]
  question: |
    Why does adding a `userId` dimension to a custom metric across millions of users
    blow up your CloudWatch bill?
  options:
  - Each unique combination of dimension values is a separate billable metric, so millions of userIds
    create millions of custom metrics
  - Dimensions are billed per character in the dimension name, so a long key like `userId` is what inflates
    the bill
  - CloudWatch charges a fixed surcharge for any custom metric that carries more than one dimension attached
    to it
  - Adding a userId dimension forces every metric in the namespace into high-resolution 1-second mode, which
    is billed at a premium
  answer: 0
  explanation: |
    A metric is uniquely defined by its full dimension set; every distinct value
    combination is a separate metric billed per month. A userId dimension explodes
    cardinality into millions of metrics. Billing is per-metric, not per-character or
    per-dimension-count, and it doesn't change resolution.
  ref: concepts.md#metric-dimensions-and-cardinality-cost
- id: aws-observability-cloudwatch-xray-010
  difficulty: advanced
  tags: [cardinality, contributor-insights, judgment]
  question: |
    You need occasional "top-N noisiest tenants" analysis over high-cardinality
    tenant IDs without paying for a per-tenant metric 24/7. Best AWS choice?
  options:
  - Add tenantId as a metric dimension and query it with metric math whenever you need the top-N ranking
  - Create one CloudWatch alarm per tenant and sort them by their most recent breach count to find the noisiest
  - Use CloudWatch Contributor Insights rules over the logs to surface top-N contributors
  - Increase metric retention to 15 months so the top-N tenants can be ranked from long-term historical data
  answer: 2
  explanation: |
    Contributor Insights analyzes logs to rank top-N contributors without minting a
    metric per tenant. Making tenantId a dimension recreates the cardinality cost
    problem; one alarm per tenant is worse; retention doesn't address cardinality.
  ref: concepts.md#metric-dimensions-and-cardinality-cost
- id: aws-observability-cloudwatch-xray-011
  difficulty: advanced
  tags: [cardinality, rollup, gotcha]
  question: |
    You publish a metric with dimensions {service, region, userId}. A dashboard needs
    total requests per service (all users). Why might the naive query return nothing
    useful, and what's the fix?
  options:
  - CloudWatch auto-aggregates across any dimension you omit from the query, so summing per service just works
    transparently
  - You must first delete the userId dimension from all previously-published datapoints before any per-service
    total can be computed
  - CloudWatch dashboard widgets are unable to display a summed or aggregated metric across multiple dimension
    values
  - A metric with {service,region,userId} is distinct from one without userId; you must also emit the
    metric without userId, or use metric math/SEARCH to aggregate
  answer: 3
  explanation: |
    CloudWatch does not automatically roll up across an arbitrary dimension; the
    fully-dimensioned metric is separate from a less-dimensioned one. To get the
    per-service total you emit the metric without userId or aggregate with metric
    math/SEARCH. You can't retro-delete a dimension, and dashboards can sum metrics.
  ref: concepts.md#metric-dimensions-and-cardinality-cost
- id: aws-observability-cloudwatch-xray-012
  difficulty: beginner
  tags: [alarms, actions]
  question: |
    Which of these is a valid CloudWatch alarm action?
  options:
  - Directly restart a specific Kubernetes pod by calling the EKS control plane from the alarm action
  - Publish to an SNS topic (which can fan out to paging/email/Lambda)
  - Modify a DynamoDB item in place to record the alarm's most recent state transition
  - Rewrite and redeploy the offending application code automatically once the threshold is breached
  answer: 1
  explanation: |
    Alarm actions include publishing to SNS, Auto Scaling actions, EC2 actions
    (reboot/stop/recover) and Systems Manager. Restarting a pod, editing DynamoDB
    items, or changing code are not native alarm actions (you'd route via SNS→Lambda).
  ref: concepts.md#cloudwatch-alarms-and-composite-alarms
- id: aws-observability-cloudwatch-xray-013
  difficulty: intermediate
  tags: [alarms, treat-missing-data, gotcha]
  question: |
    A liveness alarm should page when a service stops emitting its heartbeat metric.
    Which `treatMissingData` setting is correct, and why is the wrong choice dangerous?
  options:
  - breaching — a dropped heartbeat should be treated as a breach and page; notBreaching/missing could
    leave the alarm silent (INSUFFICIENT_DATA) during a real outage
  - notBreaching — because a missing heartbeat datapoint reliably means the service is healthy and idle
  - ignore — so the alarm holds its last state and never transitions when heartbeats stop arriving
  - It does not matter which setting you pick; a gap in the metric always drives the alarm into ALARM and pages
  answer: 0
  explanation: |
    For liveness, absence of data IS the failure, so treatMissingData=breaching pages.
    notBreaching/missing/ignore can leave the alarm silent while the source is dead —
    a classic silent-outage trap. Missing data does not always page; behavior depends
    on this setting.
  ref: concepts.md#cloudwatch-alarms-and-composite-alarms
- id: aws-observability-cloudwatch-xray-014
  difficulty: advanced
  tags: [composite-alarms, noise-reduction, judgment]
  question: |
    During incidents, one root cause triggers 40 cause-level alarm pages. What is the
    most appropriate CloudWatch mechanism to fix the noise?
  options:
  - Delete the 40 cause-level alarms entirely so only the top-level symptom alarm remains to ever page on-call
  - Increase every one of the cause alarms' evaluation periods to 1 hour so they settle before they can fire
    during an incident
  - Use a composite alarm on the user-visible symptom and configure ActionsSuppressor so child cause-alarms
    are suppressed while the parent is firing
  - Switch all 40 cause alarms to high-resolution 10-second evaluation so they resolve faster and stop paging
  answer: 2
  explanation: |
    Composite alarms with action suppression let you page once on the symptom while
    muting dependent cause-alarms during the event — killing the storm while keeping
    the diagnostic alarms. Deleting cause alarms loses diagnosis; huge evaluation
    windows delay detection; high-res doesn't reduce noise.
  ref: concepts.md#cloudwatch-alarms-and-composite-alarms
- id: aws-observability-cloudwatch-xray-015
  difficulty: intermediate
  tags: [alarms, m-of-n, flapping]
  question: |
    What does an "M of N" (datapoints-to-alarm) configuration accomplish?
  options:
  - It requires M different metrics to breach simultaneously across a set of N linked alarms before paging
  - It rate-limits the alarm so it can fire at most M notification actions within any rolling N-minute window
  - It configures the underlying metric's storage resolution to N seconds and its evaluation count to M
  - It reduces flapping by only alarming when M of the last N evaluation datapoints breach the threshold
  answer: 3
  explanation: |
    M-of-N means alarm only if M of the last N datapoints breach (e.g. 3 of 5),
    smoothing transient spikes and reducing flapping. It is about one metric's
    datapoints, not multiple metrics, action rate limits, or resolution.
  ref: concepts.md#cloudwatch-alarms-and-composite-alarms
- id: aws-observability-cloudwatch-xray-016
  difficulty: advanced
  tags: [alarms, anomaly-detection, judgment]
  question: |
    A business metric has strong daily and weekly seasonality; a static threshold
    either false-pages at nightly lows or misses daytime regressions. Best option?
  options:
  - Set the static threshold to the metric's all-time maximum so nightly lows can never trip a false page
  - Use a CloudWatch anomaly-detection band alarm that learns the expected range
  - Disable the alarm during nights and re-enable it each morning to skip the seasonal lows
  - Switch the metric to high-resolution 1-second storage so the daily and weekly seasonality averages out
  answer: 1
  explanation: |
    Anomaly detection bands learn seasonal patterns and alarm on deviation from the
    expected range, fixing seasonality problems a static threshold can't. An all-time-
    max threshold never fires; disabling nights creates blind spots; resolution
    doesn't address seasonality.
  ref: concepts.md#cloudwatch-alarms-and-composite-alarms
- id: aws-observability-cloudwatch-xray-017
  difficulty: beginner
  tags: [logs, retention, default]
  question: |
    What is the default retention for a newly created CloudWatch Logs log group?
  options:
  - Never expire (logs are kept indefinitely until you set a policy)
  - 30 days, after which events are automatically purged unless you extend the policy
  - 90 days, matching the free CloudTrail Event history window applied to log groups
  - 1 day, so unconfigured groups drop their events after 24 hours
  answer: 0
  explanation: |
    The default is "Never expire," which is a common hidden cost driver — chatty
    groups accumulate storage forever. Retention is set per log group from 1 day to
    10 years; always set it explicitly.
  ref: concepts.md#cloudwatch-logs-log-groups-and-retention
- id: aws-observability-cloudwatch-xray-018
  difficulty: intermediate
  tags: [logs, batch-limits, facts]
  question: |
    What is the maximum size of a single PutLogEvents batch in CloudWatch Logs?
  options:
  - 256 KB, matching the maximum size of a single individual log event
  - 5 MB, with a separate cap of 5,000 events per PutLogEvents batch
  - 1 MB (up to 10,000 events per batch)
  - 10 MB, aligned with the Kinesis Data Streams per-record delivery limit
  answer: 2
  explanation: |
    A PutLogEvents batch is capped at 1 MB and 10,000 events. The max individual
    log-event size is a separate quota (1,024 KB); 256 KB, 5 MB and 10 MB are not the
    batch limit.
  ref: concepts.md#cloudwatch-logs-log-groups-and-retention
- id: aws-observability-cloudwatch-xray-019
  difficulty: advanced
  tags: [logs, cost, s3, judgment]
  question: |
    You must retain application logs for 7 years for compliance but only actively
    query the last 14 days. Most cost-effective design?
  options:
  - Set 7-year retention directly on the CloudWatch log group and rely on Logs Insights to run the occasional compliance query against all of it
  - Copy every log event into a DynamoDB table with a 7-year item TTL and scan it with PartiQL whenever the compliance team needs the history
  - Store everything in the CloudWatch Logs Infrequent Access class for the full 7 years, assuming its lower per-GB rate makes cold retention cheap
  - Keep ~14–30 day retention in CloudWatch for live ops and export/subscribe logs to S3 for cheap long-term
    retention (query with Athena when needed)
  answer: 3
  explanation: |
    CloudWatch Logs storage is pricier per GB than S3; short CloudWatch retention plus
    S3 archive (Athena for occasional queries) is the standard cost-optimized pattern.
    7-year CloudWatch retention is expensive; DynamoDB is the wrong store for logs; IA
    still costs more than S3 for long cold retention and loses features.
  ref: concepts.md#cloudwatch-logs-log-groups-and-retention
- id: aws-observability-cloudwatch-xray-020
  difficulty: advanced
  tags: [logs, log-class, ia, judgment]
  question: |
    Which workload is the WRONG fit for the CloudWatch Logs Infrequent Access (IA)
    class?
  options:
  - Rarely-queried compliance/debug logs kept for audit
  - Logs you alarm on in real time via metric filters
  - Verbose logs you only scan occasionally with Logs Insights
  - Bulk logs where ~50% lower ingestion cost matters more than real-time features
  answer: 1
  explanation: |
    IA halves ingestion cost but drops metric filters, subscription filters and Live
    Tail — so logs you alarm on in real time must stay in the Standard class. The
    other three (rarely queried, Insights-only, cost-sensitive bulk) are exactly what
    IA is for.
  ref: concepts.md#cloudwatch-logs-log-groups-and-retention
- id: aws-observability-cloudwatch-xray-021
  difficulty: beginner
  tags: [logs-insights, purpose]
  question: |
    What is CloudWatch Logs Insights primarily for?
  options:
  - Ad-hoc, interactive querying of log groups with a query language (fields/filter/stats)
  - Continuously evaluating a predefined pattern at ingestion time and incrementing an alarmable metric on every match
  - Streaming raw log events in real time to an Amazon OpenSearch Service domain for full-text indexing and Kibana dashboards
  - Encrypting log data at rest with an AWS KMS customer-managed key and rotating it automatically every 90 days
  answer: 0
  explanation: |
    Logs Insights is an interactive query tool for ad-hoc investigation, billed per GB
    scanned. Continuous pattern alarming at ingestion is a metric filter's job;
    real-time streaming to OpenSearch is a subscription filter; encryption is
    unrelated.
  ref: concepts.md#logs-insights-metric-filters-and-subscription-filters
- id: aws-observability-cloudwatch-xray-022
  difficulty: intermediate
  tags: [subscription-filters, limits, facts]
  question: |
    How many subscription filters can a single CloudWatch Logs log group have?
  options: ['1', '5', '2', Unlimited]
  answer: 2
  explanation: |
    A log group supports a maximum of 2 subscription filters — a real design
    constraint when you must fan logs to multiple destinations. (Metric filters allow
    up to 100 per group; the 2-filter cap is specific to subscriptions.)
  ref: concepts.md#logs-insights-metric-filters-and-subscription-filters
- id: aws-observability-cloudwatch-xray-023
  difficulty: advanced
  tags: [subscription-filters, fan-out, judgment]
  question: |
    You need to deliver a log group's events to BOTH an OpenSearch cluster and a
    security data lake, but you've hit the 2-subscription-filter-per-log-group limit
    elsewhere and want a scalable pattern. Best design?
  options:
  - Give up on one of the two destinations and forward only to the higher-priority consumer, backfilling the other later from an S3 export
  - Raise the subscription-filter-per-log-group limit through a Service Quotas increase request, since AWS treats it as a soft adjustable quota
  - Poll GetLogEvents on a fixed schedule with a Lambda and push each fetched page to both destinations in a fan-out loop
  - Use a subscription filter to Firehose/Kinesis (or an account-level subscription filter) and fan out
    to both destinations from there
  answer: 3
  explanation: |
    The clean pattern is to subscribe once to Firehose/Kinesis (or use an account-level
    subscription filter) and fan out to multiple destinations downstream. The 2-filter
    limit is not adjustable; polling GetLogEvents is laggy, throttled and not
    real-time; dropping a destination fails the requirement.
  ref: concepts.md#logs-insights-metric-filters-and-subscription-filters
- id: aws-observability-cloudwatch-xray-024
  difficulty: intermediate
  tags: [metric-filter, logs-insights, cost, judgment]
  question: |
    You will alarm on error-log spikes continuously and cheaply. Metric filter vs
    Logs Insights — which and why?
  options:
  - Logs Insights, because a saved query can be attached directly to an alarm that re-evaluates without ever scanning the underlying data
  - Metric filter, because it increments a metric on ingestion (no repeated scan) and you alarm on that
    metric cheaply
  - Neither can drive an alarm on log content; you must route the errors through CloudTrail and alarm on its trail metrics instead
  - Both cost exactly the same per GB of log data, so the choice between them makes no practical difference
  answer: 1
  explanation: |
    A metric filter counts matches on ingestion and produces an alarmable metric with
    no per-query scan cost — ideal for continuous alerting. Logs Insights bills per GB
    scanned and isn't an alarm source; CloudTrail is audit, not app-error alerting; the
    costs differ materially.
  ref: concepts.md#logs-insights-metric-filters-and-subscription-filters
- id: aws-observability-cloudwatch-xray-025
  difficulty: advanced
  tags: [subscription-filters, kinesis, firehose, judgment]
  question: |
    A subscription filter can target Kinesis Data Streams or Firehose. You need
    multiple independent consumers and sub-second latency for the log stream. Which,
    and what's the trade-off?
  options:
  - Kinesis Data Streams — low-latency, replayable, multi-consumer; but you manage shards (~1 MB/s or
    1,000 rec/s ingest per shard) versus Firehose's zero-management batched delivery
  - Firehose — its buffered delivery gives the lowest per-record latency and lets any number of independent consumers read the same stream in parallel
  - Firehose — because Kinesis Data Streams is not a permitted subscription-filter destination and can only be fed indirectly through a Lambda relay
  - Neither — CloudWatch Logs subscription filters can only deliver to a Lambda function, so streaming to Kinesis or Firehose is impossible
  answer: 0
  explanation: |
    Kinesis Data Streams offers low-latency, replayable, multi-consumer streaming at
    the cost of shard management (1 MB/s or 1,000 rec/s ingest per shard). Firehose is
    zero-management but buffers/batches (≥60s / MBs), so it's higher latency and
    single-path. Subscription filters support Kinesis, Firehose, and Lambda.
  ref: concepts.md#logs-insights-metric-filters-and-subscription-filters
- id: aws-observability-cloudwatch-xray-026
  difficulty: intermediate
  tags: [metric-filter, limits]
  question: |
    What is the limit on the number of metric filters per CloudWatch Logs log group?
  options: ['2', '10', '100', Unlimited]
  answer: 2
  explanation: |
    Up to 100 metric filters per log group. Don't confuse this with the 2
    subscription filters per log group. Both are hard, non-adjustable caps.
  ref: concepts.md#logs-insights-metric-filters-and-subscription-filters
- id: aws-observability-cloudwatch-xray-027
  difficulty: beginner
  tags: [xray, segments]
  question: |
    In AWS X-Ray, what is a "segment"?
  options:
  - A fixed one-second slice of a high-resolution CloudWatch metric that X-Ray samples to build its service map
  - A single shard of a Kinesis Data Stream that buffers trace fragments before they are flushed to the X-Ray daemon
  - A CloudTrail management event recording the control-plane API call that started the traced request
  - The work done by a single service/resource for a request, containing timing, annotations and subsegments
    for downstream calls
  answer: 3
  explanation: |
    A segment records what one service did for a request (timing, annotations,
    metadata), and subsegments capture downstream calls. It is not a metric slice,
    Kinesis shard, or CloudTrail event.
  ref: concepts.md#aws-x-ray-tracing-segments-and-sampling
- id: aws-observability-cloudwatch-xray-028
  difficulty: intermediate
  tags: [xray, sampling, facts]
  question: |
    What is X-Ray's default sampling rule?
  options:
  - 100% of all incoming requests are traced until you explicitly define a rule to reduce the rate
  - 1 request per second (reservoir) plus 5% of any additional requests
  - A flat 10% of requests chosen uniformly at random with no per-second reservoir floor
  - Only requests that return a 4xx or 5xx error, so successful requests are never sampled
  answer: 1
  explanation: |
    The default reservoir samples the first 1 request/second, then 5% of additional
    requests, bounding cost and overhead. It is neither 100%, a flat 10%, nor
    error-only (though you can add rules to force-sample errors).
  ref: concepts.md#aws-x-ray-tracing-segments-and-sampling
- id: aws-observability-cloudwatch-xray-029
  difficulty: intermediate
  tags: [xray, retention, facts]
  question: |
    How long does X-Ray retain trace data?
  options: [30 days, 24 hours, 15 months, Indefinitely]
  answer: 0
  explanation: |
    X-Ray retains traces for 30 days (not configurable) — it is for recent operational
    analysis, not long-term audit. For long retention you'd export traces elsewhere.
  ref: concepts.md#aws-x-ray-tracing-segments-and-sampling
- id: aws-observability-cloudwatch-xray-030
  difficulty: advanced
  tags: [xray, sampling, judgment]
  question: |
    With default 5% sampling on a high-volume API, on-call complains that failing
    requests are often not traced. Best fix that controls cost?
  options:
  - Set the sampling rate to 100% for all requests so nothing is ever missed, absorbing the extra tracing cost
  - Disable X-Ray sampling entirely and reconstruct the failing requests after the fact from CloudWatch Logs instead
  - Add an X-Ray sampling rule to sample errors/faults at 100% (and boost sampling on critical low-traffic
    paths) while keeping happy-path high-volume traffic sampled
  - Increase the X-Ray trace retention window so more of the already-sampled failing requests are kept around
  answer: 2
  explanation: |
    Targeted rules that force-sample errors/faults at 100% guarantee failing requests
    are captured without the cost of tracing every happy-path request. 100% everywhere
    is expensive; disabling sampling equals 100%; retention doesn't change what gets
    sampled.
  ref: concepts.md#aws-x-ray-tracing-segments-and-sampling
- id: aws-observability-cloudwatch-xray-031
  difficulty: advanced
  tags: [xray, annotations, metadata]
  question: |
    You want to filter traces in the X-Ray console by a business key (e.g.
    customerTier). Where should you put it?
  options:
  - In metadata, because X-Ray automatically indexes every metadata field and exposes it to filter expressions
  - In the segment name, since the console lets you build filter expressions directly against the segment name string
  - In a CloudWatch metric dimension that X-Ray cross-references back to the matching trace when you filter
  - In annotations, because annotations are indexed and filterable (metadata is stored but NOT indexed)
  answer: 3
  explanation: |
    Annotations are indexed and support filter expressions; metadata is stored but not
    indexed/searchable. Segment name isn't a filter field, and a metric dimension is a
    different system entirely.
  ref: concepts.md#aws-x-ray-tracing-segments-and-sampling
- id: aws-observability-cloudwatch-xray-032
  difficulty: advanced
  tags: [xray, active-passive, judgment]
  question: |
    What is the difference between X-Ray "active" and "passive" tracing on API Gateway
    / Lambda?
  options:
  - Active tracing captures only synchronous request/response calls, while passive tracing captures asynchronous, event-driven invocations
  - Active starts a new trace even without an inbound trace header; passive only continues an existing
    upstream trace
  - Active tracing is included at no charge, whereas passive tracing is billed per recorded segment and subsegment
  - Active tracing is implemented through the OpenTelemetry collector, while passive tracing uses the legacy X-Ray SDK
  answer: 1
  explanation: |
    Active tracing initiates a trace when no upstream header exists (use at entry
    points); passive only continues an already-started trace (use downstream) to avoid
    creating duplicate roots. It's not about sync/async, billing, or SDK choice.
  ref: concepts.md#aws-x-ray-tracing-segments-and-sampling
- id: aws-observability-cloudwatch-xray-033
  difficulty: expert
  tags: [xray, apm, judgment]
  question: |
    A team wants deep code-level profiling (method hotspots), 13-month trace retention,
    and unified logs+metrics+traces across AWS and on-prem. X-Ray vs third-party APM?
  options:
  - A third-party APM (e.g. Datadog/Dynatrace) — X-Ray has coarser code profiling, 30-day retention, and
    is AWS-centric; APM gives deeper profiling, longer retention and cross-cloud, at higher cost and an
    agent to run
  - X-Ray — it provides method-level code profiling and configurable 13-month trace retention out of the box with no extra tooling
  - Neither option can unify telemetry across AWS and on-prem; only CloudTrail can correlate cross-cloud activity into one view
  - X-Ray, because third-party APM products are unable to ingest AWS-native telemetry such as CloudWatch metrics or X-Ray traces
  answer: 0
  explanation: |
    X-Ray is integrated, cheap and zero-infra but has 30-day retention and coarser
    profiling and is AWS-centric. The stated needs (deep profiling, 13-month retention,
    cross-cloud unification) point to a third-party APM, accepting higher cost and
    agents. CloudTrail is audit; APMs can ingest AWS telemetry.
  ref: concepts.md#aws-x-ray-tracing-segments-and-sampling
- id: aws-observability-cloudwatch-xray-034
  difficulty: intermediate
  tags: [otel, adot, lock-in]
  question: |
    What is the primary advantage of instrumenting with OpenTelemetry/ADOT instead of
    the X-Ray SDK?
  options:
  - It is the only supported path for delivering trace segments into the X-Ray backend now that the SDK is deprecated
  - It eliminates the need to run any collector or agent because the SDK ships telemetry straight to the backend
  - Vendor-neutral instrumentation — instrument once and export metrics/logs/traces to X-Ray, CloudWatch,
    Prometheus, or third parties, avoiding backend lock-in
  - It guarantees 100% sampling of every request by disabling the default reservoir-and-percentage rule
  answer: 2
  explanation: |
    OTel/ADOT is a vendor-neutral standard: one instrumentation, many possible
    backends, avoiding lock-in to X-Ray's SDK. The X-Ray SDK is not the only path to
    X-Ray; OTel still uses a collector; and it doesn't dictate sampling.
  ref: concepts.md#opentelemetry-and-adot
- id: aws-observability-cloudwatch-xray-035
  difficulty: advanced
  tags: [otel, collector, judgment]
  question: |
    What is the trade-off between running the ADOT/OTel Collector as a per-task sidecar
    versus a central gateway collector?
  options:
  - Sidecars are always cheaper to run and cannot fail independently, whereas a central gateway invariably costs more to operate
  - Only the per-task sidecar deployment mode is able to export telemetry to the X-Ray backend; gateways cannot
  - Central gateway collectors can merely forward telemetry and are unable to process, filter, or transform it in flight
  - Sidecar isolates failure and buffers locally but multiplies resource use; a central gateway is efficient
    and centrally configurable but is a shared dependency whose outage drops telemetry fleet-wide
  answer: 3
  explanation: |
    Sidecars give isolation and local buffering at higher aggregate resource cost;
    central gateways are efficient and easy to configure but a shared failure domain.
    Many run both. Both can export to X-Ray and gateways do process/transform.
  ref: concepts.md#opentelemetry-and-adot
- id: aws-observability-cloudwatch-xray-036
  difficulty: expert
  tags: [otel, prometheus, grafana, judgment]
  question: |
    An EKS-heavy org standardized on PromQL and Grafana dashboards. Which observability
    backend fits best, and what's the cost?
  options:
  - CloudWatch only, because it is the AWS default and its Metrics Insights query syntax is fully wire-compatible with PromQL
  - Amazon Managed Service for Prometheus + Managed Grafana (via ADOT) — Prometheus-native querying/dashboards,
    at the cost of extra managed services to operate and pay for versus turnkey CloudWatch
  - X-Ray, because it natively evaluates PromQL expressions against its trace-derived metrics store
  - CloudTrail, because it stores the fleet's time-series metrics and exposes them to Grafana dashboards
  answer: 1
  explanation: |
    A Prometheus/PromQL/Grafana shop is best served by AMP + AMG fed via ADOT, trading
    extra services/cost for a Prometheus-native experience. CloudWatch is turnkey but
    not PromQL-native; X-Ray is tracing (no PromQL); CloudTrail is audit, not metrics.
  ref: concepts.md#opentelemetry-and-adot
- id: aws-observability-cloudwatch-xray-037
  difficulty: beginner
  tags: [cloudtrail, purpose]
  question: |
    What is AWS CloudTrail primarily used for?
  options:
  - Auditing API activity — who called which API, when, from where
  - Real-time operational metrics and dashboards for service health monitoring
  - Distributed tracing that attributes latency across microservice call graphs
  - Storing and indexing raw application log lines for full-text search
  answer: 0
  explanation: |
    CloudTrail records API activity for security, audit, governance and forensics. It
    is not operational metrics (CloudWatch), tracing (X-Ray), or an application log
    store (CloudWatch Logs / S3).
  ref: concepts.md#cloudtrail-for-api-auditing
- id: aws-observability-cloudwatch-xray-038
  difficulty: intermediate
  tags: [cloudtrail, event-types, cost]
  question: |
    Which statement about CloudTrail management vs data events is correct?
  options:
  - Data events (e.g. S3 GetObject, Lambda Invoke) are captured by default and delivered at no additional charge
  - Management events are billed per recorded event, whereas high-volume data events are always included for free
  - Management events (control-plane) are logged by default with one free copy; data events (e.g. S3 GetObject,
    Lambda Invoke) are NOT logged by default and are charged per event
  - Both management and data events are disabled by default and both are delivered with no per-event charge
  answer: 2
  explanation: |
    Management events are on by default with one free copy; high-volume data events
    (object-level S3, Lambda invokes, DynamoDB item ops) must be opted into and are
    billed per event — the main CloudTrail cost driver. The other options invert or
    misstate the defaults.
  ref: concepts.md#cloudtrail-for-api-auditing
- id: aws-observability-cloudwatch-xray-039
  difficulty: intermediate
  tags: [cloudtrail, event-history, facts]
  question: |
    Without configuring any trail, how much CloudTrail history can you view for free in
    the console?
  options:
  - The last 7 days of all events, including object-level S3 and Lambda data events
  - The last 15 months of all events, covering both management and data-plane activity
  - Nothing at all — you must first create and configure a trail before any history appears
  - The last 90 days of management events (Event history), excluding data events
  answer: 3
  explanation: |
    Event history gives 90 days of management events at no cost, no setup, but excludes
    data events and isn't customizable. It's not 7 days, not 15 months, and doesn't
    require a trail (a trail is needed for S3 delivery, data events, and longer
    retention).
  ref: concepts.md#cloudtrail-for-api-auditing
- id: aws-observability-cloudwatch-xray-040
  difficulty: advanced
  tags: [cloudtrail, org-trail, judgment]
  question: |
    A company with 200 AWS accounts under Organizations wants centralized, tamper-
    resistant API audit in one place. Best design?
  options:
  - Enable the 90-day Event history in each of the 200 accounts and have auditors open and check them individually
  - Create an organization trail in the management/delegated-admin account that captures all member accounts'
    events into one central S3 bucket
  - Create 200 independent per-account trails and run a nightly job that manually merges all their S3 buckets
  - Rely on cross-account CloudWatch metrics, treating the metric datapoints as the tamper-resistant audit record
  answer: 1
  explanation: |
    An organization trail centralizes all member accounts' events into a single
    S3 bucket with consistent configuration — the standard multi-account audit pattern.
    Per-account Event history doesn't centralize; 200 trails + manual merge is
    error-prone; CloudWatch metrics aren't an audit trail.
  ref: concepts.md#cloudtrail-for-api-auditing
- id: aws-observability-cloudwatch-xray-041
  difficulty: advanced
  tags: [cloudtrail, latency, gotcha]
  question: |
    Why is CloudTrail (delivering management events) a poor choice for immediate,
    real-time detection of a malicious API call?
  options:
  - Management-event delivery is typically within ~15 minutes of the call, so it is not real-time — for
    immediate alerting you'd need other controls
  - CloudTrail only records successful API calls, so a denied malicious call would never generate an event
  - CloudTrail events cannot be delivered to CloudWatch Logs, so metric-filter alarms on them are impossible
  - CloudTrail events are always encrypted with an internal AWS key that consumers are unable to decrypt and read
  answer: 0
  explanation: |
    CloudTrail delivers management events within roughly 15 minutes, so it lags for
    instant detection. It logs failed calls too, can be delivered to CloudWatch Logs
    (enabling metric-filter alarms, though still with that latency), and events are
    readable.
  ref: concepts.md#cloudtrail-for-api-auditing
- id: aws-observability-cloudwatch-xray-042
  difficulty: expert
  tags: [cloudtrail, lake, athena, judgment]
  question: |
    You need multi-year, immutable, SQL-queryable API audit without building your own
    partitioning/schema on S3. Which CloudTrail feature, and what's the trade-off?
  options:
  - S3 + Athena — it is always the cheapest option and needs no schema, partitioning, or query setup at all
  - Event history — it already retains every management and data event immutably for multiple years by default
  - CloudTrail Lake — a managed immutable store with SQL and multi-year retention; turnkey but priced
    per ingestion + scan, versus cheaper-storage S3+Athena where you build the schema/queries yourself
  - Config — it stores the full API audit trail of who called which API and exposes it directly via SQL
  answer: 2
  explanation: |
    CloudTrail Lake is the managed immutable long-retention SQL store, trading higher
    ingestion/scan price for zero plumbing. S3+Athena is cheaper storage but you build
    schema/partitioning; Event history is only 90 days; Config stores resource state,
    not API audit.
  ref: concepts.md#cloudtrail-for-api-auditing
- id: aws-observability-cloudwatch-xray-043
  difficulty: beginner
  tags: [config, cloudtrail, cloudwatch, comparison]
  question: |
    Which service answers "Is this resource compliant right now, and what was its
    configuration last Tuesday?"
  options: [CloudWatch, CloudTrail, X-Ray, AWS Config]
  answer: 3
  explanation: |
    AWS Config tracks resource configuration state over time (configuration timeline)
    and evaluates compliance via rules. CloudWatch is operational health, CloudTrail is
    the API-call audit, and X-Ray is tracing.
  ref: concepts.md#cloudtrail-versus-cloudwatch-versus-config
- id: aws-observability-cloudwatch-xray-044
  difficulty: intermediate
  tags: [config, cloudtrail, distinction]
  question: |
    A security group was changed to allow 0.0.0.0/0 on port 22. Which service tells you
    WHO made the API call, and which tells you the resulting non-compliant STATE?
  options:
  - CloudWatch metrics identify who made the call; X-Ray traces reconstruct the resulting security-group state
  - CloudTrail records the API call (who/when/from where); AWS Config records/evaluates the resulting
    resource state and compliance
  - AWS Config identifies who made the API call; CloudTrail reports the resulting non-compliant resource state
  - Both the caller identity and the resulting compliance state are answered only by querying CloudWatch Logs
  answer: 1
  explanation: |
    CloudTrail logs the ModifySecurityGroup call and identity; Config captures the
    resulting configuration state and flags it non-compliant. The other pairings swap
    the responsibilities or use the wrong services.
  ref: concepts.md#cloudtrail-versus-cloudwatch-versus-config
- id: aws-observability-cloudwatch-xray-045
  difficulty: advanced
  tags: [config, remediation, judgment]
  question: |
    You want to automatically detect and revert public S3 buckets and know who made the
    change. Which combination is most appropriate?
  options:
  - AWS Config rule detects non-compliance → EventBridge → auto-remediation (revert), and CloudTrail identifies
    who made the change
  - A CloudWatch alarm on bucket request metrics only, which both detects the public setting and reverts it
  - An X-Ray trace of the bucket request plus a CloudWatch dashboard to spot and roll back the public access
  - CloudTrail Insights, which detects the unusual API call and then automatically reverts the bucket policy
  answer: 0
  explanation: |
    Config continuously evaluates the bucket's compliance and can drive remediation via
    EventBridge; CloudTrail attributes the change to an identity. CloudWatch metrics
    don't evaluate config compliance; X-Ray is tracing; CloudTrail Insights detects
    unusual API rates but doesn't remediate.
  ref: concepts.md#cloudtrail-versus-cloudwatch-versus-config
- id: aws-observability-cloudwatch-xray-046
  difficulty: intermediate
  tags: [eventbridge, routing]
  question: |
    In an observability workflow, what is EventBridge's core capability?
  options:
  - Storing high-resolution time-series metrics at 1-second granularity for dashboards and alarms
  - Distributed tracing that stitches segments across services into an end-to-end request service map
  - Content-based routing of events (JSON pattern matching) to targets like Lambda, SQS, SNS, Step Functions
  - Long-term archival of raw log events into cheap durable storage for compliance retention
  answer: 2
  explanation: |
    EventBridge is a serverless bus that routes events by content-based rules to many
    targets — the reactive glue for auto-remediation and ChatOps. It doesn't store
    metrics, trace requests, or archive logs.
  ref: concepts.md#eventbridge-for-operational-events
- id: aws-observability-cloudwatch-xray-047
  difficulty: advanced
  tags: [eventbridge, sns, judgment]
  question: |
    For a pure "alarm breached → page on-call" path, why prefer SNS over routing the
    alarm-state change through EventBridge?
  options:
  - EventBridge is unable to receive CloudWatch alarm state-change events, so it cannot start a paging path
  - Only SNS supports content-based filtering of alarm events; EventBridge offers no pattern matching at all
  - EventBridge has no way to deliver notifications to third-party paging tools like PagerDuty or Opsgenie
  - SNS is the lowest-latency simple pub/sub for paging; EventBridge adds content filtering, transformation,
    archive/replay and a schema registry but with slightly higher latency you don't need on a pure paging
    path
  answer: 3
  explanation: |
    For a direct paging path, SNS is the simplest, lowest-latency choice; EventBridge's
    routing/replay/schema features add latency and value only when you must route by
    content or replay. EventBridge can receive alarm events and reach paging tools;
    SNS message filtering exists but is coarser than EventBridge patterns.
  ref: concepts.md#eventbridge-for-operational-events
- id: aws-observability-cloudwatch-xray-048
  difficulty: intermediate
  tags: [dashboards, design]
  question: |
    What is the recommended way to structure an on-call triage dashboard?
  options:
  - List every available metric alphabetically so responders can scan the full inventory during an incident
  - 'Top-down: a few symptom SLIs (availability, latency, error rate — the golden signals) at the top,
    with cause metrics below for drill-down'
  - Show only low-level cause metrics like CPU and memory, since those pinpoint the underlying fault fastest
  - Build one dashboard per individual host so each server''s resource usage can be inspected in isolation
  answer: 1
  explanation: |
    Put user-visible symptom SLIs at the top for fast triage, cause metrics below for
    diagnosis. Alphabetical dumps, cause-only views, and per-host dashboards don't
    surface user impact quickly.
  ref: concepts.md#dashboards-and-cross-account-observability
- id: aws-observability-cloudwatch-xray-049
  difficulty: advanced
  tags: [cross-account, oam, judgment]
  question: |
    An org with dozens of accounts wants one pane of glass for metrics, logs and traces.
    Which AWS mechanism enables this?
  options:
  - 'CloudWatch cross-account observability via Observability Access Manager: source accounts create links
    to a monitoring account''s sink'
  - Copy all metrics, logs, and traces into a single account manually with scheduled cross-account export jobs
  - Enable high-resolution 1-second metrics in every account so a shared dashboard can render them together
  - Use a CloudTrail organization trail to aggregate the fleet''s metrics into one central monitoring view
  answer: 0
  explanation: |
    Observability Access Manager links source accounts to a central monitoring
    account's sink, sharing metrics/logs/traces into one view. Manual copying doesn't
    scale; high-res is unrelated; org trails are for CloudTrail audit, not metrics.
  ref: concepts.md#dashboards-and-cross-account-observability
- id: aws-observability-cloudwatch-xray-050
  difficulty: expert
  tags: [metric-streams, getmetricdata, judgment]
  question: |
    You must continuously export metrics from a large fleet to a third-party analytics
    platform with low latency, without hammering the CloudWatch API. Best approach?
  options:
  - Poll GetMetricData every few seconds across every metric in the fleet and forward each batch to the partner
  - Capture scheduled screenshots of the CloudWatch dashboards and ship the images to the analytics platform
  - Use CloudWatch Metric Streams to push metrics near-real-time to Firehose (→ the partner/S3), avoiding
    API rate limits
  - Request a Service Quotas increase raising the GetMetricData limit to unlimited so tight polling never throttles
  answer: 2
  explanation: |
    Metric Streams push metrics continuously via Firehose to external destinations,
    scaling without hitting GetMetricData limits (500 req/s; ~180k datapoints/s for
    recent data). Polling hits rate limits and lags; screenshots aren't data; the
    GetMetricData quota isn't unlimited.
  ref: concepts.md#dashboards-and-cross-account-observability
- id: aws-observability-cloudwatch-xray-051
  difficulty: intermediate
  tags: [alerting, symptom-vs-cause, principle]
  question: |
    Why do SRE best practices say to "page on symptoms, not causes"?
  options:
  - Cause metrics such as CPU are always cheaper to collect and store than user-facing symptom metrics
  - Symptom signals are inherently easier to drive Auto Scaling policies from than low-level cause metrics
  - Cause metrics cannot be displayed on CloudWatch dashboards, so only symptoms are available to visualize
  - There are infinitely many causes but a bounded set of user-visible symptoms; paging on symptoms catches
    unknown failure modes and stays actionable
  answer: 3
  explanation: |
    Symptom alerts (availability, latency, errors) are robust to unpredicted causes and
    map to real user impact, whereas cause alarms (CPU) both false-page and miss
    failures that don't move that cause. Cost isn't the reason; causes still belong on
    dashboards for diagnosis.
  ref: concepts.md#alerting-design-symptom-versus-cause
- id: aws-observability-cloudwatch-xray-052
  difficulty: advanced
  tags: [alerting, cause-alarm, blind-spot]
  question: |
    What is a concrete downside of paging primarily on a CPU-utilization alarm?
  options:
  - CPU utilization cannot be measured on EC2 instances, so any alarm built on it has no data to evaluate
  - It both false-pages when users are unaffected AND misses user-facing failures that don't move CPU
    (e.g. a downstream dependency returning errors quickly)
  - CPU-utilization alarms are unable to use SNS as an action, so they cannot page on-call at all
  - CPU utilization is actually a user-visible symptom rather than a cause, so it over-reports real impact
  answer: 1
  explanation: |
    A cause alarm like CPU generates noise when users are fine and is blind to failures
    that don't raise CPU — hence page on the user-facing symptom instead. CPU is
    measurable, can use SNS, and is a cause (resource utilization), not a symptom.
  ref: concepts.md#alerting-design-symptom-versus-cause
- id: aws-observability-cloudwatch-xray-053
  difficulty: expert
  tags: [alerting, burn-rate, judgment]
  question: |
    Your single-threshold error-rate alarm either flaps on minor blips or pages too
    slowly on severe events. Which alerting strategy best reconciles sensitivity and
    specificity?
  options:
  - 'Multi-window, multi-burn-rate alerting: a short window/fast-burn condition for severe incidents and
    a long window/slow-burn condition to avoid flapping'
  - A single very high static error-rate threshold that only fires on the most catastrophic outages
  - Disable the error-rate alarm overnight and re-enable it each morning to avoid off-hours flapping
  - Abandon the error-rate signal and alarm only on CPU utilization instead to smooth out the blips
  answer: 0
  explanation: |
    Multi-window multi-burn-rate alerting pages fast on severe error-budget burns while
    a longer window tolerates minor blips — the standard reconciliation of sensitivity
    vs specificity. A single high threshold misses moderate incidents; disabling nights
    creates gaps; CPU is a cause, not the symptom.
  ref: concepts.md#alerting-design-symptom-versus-cause
- id: aws-observability-cloudwatch-xray-054
  difficulty: beginner
  tags: [slo, definitions]
  question: |
    What is an error budget?
  options:
  - The maximum dollar amount your team is permitted to spend on CloudWatch and observability tooling per month
  - The maximum number of CloudWatch alarms and SLO monitors you are allowed to create per service
  - '1 − SLO: the allowed fraction of failures over the SLO window (e.g. 0.1% if the SLO is 99.9%), spent
    on risk and releases'
  - The maximum log retention period allowed before events must be tiered to cheaper long-term storage
  answer: 2
  explanation: |
    Error budget = 1 − SLO, the tolerated failure fraction you can spend on change/risk.
    It is not a monetary budget, an alarm quota, or a retention setting.
  ref: concepts.md#sli-slo-and-error-budgets-on-aws
- id: aws-observability-cloudwatch-xray-055
  difficulty: intermediate
  tags: [slo, application-signals]
  question: |
    Which AWS feature provides first-class SLO tracking (attainment and error-budget
    burn) with auto-instrumentation?
  options:
  - CloudTrail Lake audit queries
  - AWS Config compliance rules
  - X-Ray sampling rule reservoirs
  - CloudWatch Application Signals
  answer: 3
  explanation: |
    CloudWatch Application Signals lets you define SLIs/SLOs and tracks attainment and
    error-budget burn with SLO alarms, correlating metrics/traces/logs. Lake is audit,
    Config is compliance, and sampling rules govern trace capture.
  ref: concepts.md#sli-slo-and-error-budgets-on-aws
- id: aws-observability-cloudwatch-xray-056
  difficulty: advanced
  tags: [slo, sli-source, judgment]
  question: |
    For a correctness-sensitive checkout API, why might an availability SLI built only
    from ALB/API Gateway 2xx rates be insufficient?
  options:
  - ALB and API Gateway publish their request metrics on a fixed 5-minute delay, so an availability SLI built on them always lags real user impact
  - HTTP-status-based SLIs miss semantically-failed 200 responses (a 200 that returned a wrong/empty result),
    so app-level/EMF-derived signals capture true correctness
  - ALB emits no per-request status-code metrics whatsoever, so a 2xx-based availability SLI simply cannot be built from load-balancer telemetry
  - API Gateway exposes no success or error counts, so availability can only ever be inferred indirectly from downstream Lambda duration metrics
  answer: 1
  explanation: |
    A 200 can still be a business failure; gateway status codes miss such semantic
    errors, so correctness-sensitive SLIs need app-level signals (logs/EMF). Gateway
    metrics are real-time and do exist — the gap is semantic, not availability of
    metrics.
  ref: concepts.md#sli-slo-and-error-budgets-on-aws
- id: aws-observability-cloudwatch-xray-057
  difficulty: expert
  tags: [slo, tightness, cost, judgment]
  question: |
    What is the main downside of setting a 99.99% availability SLO instead of 99.9%
    when users can't perceive the difference?
  options:
  - A tiny error budget forces slow, conservative releases and expensive redundancy (e.g. multi-region)
    for imperceptible user benefit
  - There is genuinely no downside at all, so raising the target to 99.99% is always the safer choice with no cost to release velocity
  - CloudWatch metric math cannot compute an availability figure to four-nines precision, so a 99.99% SLO can never actually be tracked
  - Moving to four nines automatically doubles the retention period on every associated CloudWatch log group, sharply inflating storage cost
  answer: 0
  explanation: |
    Over-tight SLOs shrink the error budget, throttling release velocity and demanding
    costly redundancy for no perceptible gain — set SLOs from real user need. CloudWatch
    can measure it; retention is unaffected; tighter is not always better.
  ref: concepts.md#sli-slo-and-error-budgets-on-aws
- id: aws-observability-cloudwatch-xray-058
  difficulty: intermediate
  tags: [tracing, propagation, header]
  question: |
    How do X-Ray segments from API Gateway, Lambda and downstream calls get stitched
    into a single trace?
  options:
  - By correlating segments whose start timestamps fall within the same one-minute bucket on the X-Ray clock
  - By persisting every service's segments into one shared S3 bucket that X-Ray scans to reassemble the trace
  - A trace ID is propagated (e.g. via the X-Amzn-Trace-Id header) so all segments link to the same trace
    and service map
  - By requiring all participating services to publish their segments under one common CloudWatch metric namespace
  answer: 2
  explanation: |
    A propagated trace ID (X-Amzn-Trace-Id) links segments across services into one
    trace and service map. Timestamps, S3 buckets, and metric namespaces do not
    correlate trace segments.
  ref: concepts.md#distributed-tracing-across-lambda-and-microservices
- id: aws-observability-cloudwatch-xray-059
  difficulty: advanced
  tags: [tracing, async, sqs, gotcha]
  question: |
    In a Lambda → SQS → Lambda pipeline, the X-Ray service map fragments at the queue.
    Most likely cause?
  options:
  - SQS strips and permanently deletes any embedded X-Ray trace data as messages pass through the queue
  - X-Ray is fundamentally incapable of instrumenting or tracing AWS Lambda functions in any configuration
  - The propagated trace ID is rotated and reissued every 30 days, breaking the link across the queue boundary
  - The trace context wasn't propagated through the SQS message, so the producer and consumer segments
    don't join
  answer: 3
  explanation: |
    Across async boundaries you must carry the trace context in the message (X-Ray
    propagates through SQS/SNS; with OTel you inject/extract in message attributes) or
    the trace breaks. SQS doesn't delete trace data, X-Ray traces Lambda, and the ID
    doesn't rotate by retention.
  ref: concepts.md#distributed-tracing-across-lambda-and-microservices
- id: aws-observability-cloudwatch-xray-060
  difficulty: advanced
  tags: [tracing, sampling, fan-out, judgment]
  question: |
    Because the sampling decision is made at the trace root and propagated, what is the
    consequence in a fan-out request tree?
  options:
  - Each downstream service re-evaluates the sampling rule independently, so partial half-sampled traces are the common result
  - The whole request tree is either sampled or not; low root sampling can leave a rare failing downstream
    branch untraced, so you boost/force-sample at critical entry points
  - X-Ray automatically disables sampling for any request that fans out to more than one downstream service
  - Only the final service reached in the longest branch of the fan-out chain ever records a sampled segment
  answer: 1
  explanation: |
    A single root decision propagates, giving coherent whole-tree traces but meaning a
    low root sample rate can miss rare failing branches — hence force-sampling errors /
    boosting critical entry points. Services don't decide independently, sampling isn't
    auto-disabled, and it's not last-service-only.
  ref: concepts.md#distributed-tracing-across-lambda-and-microservices
- id: aws-observability-cloudwatch-xray-061
  difficulty: expert
  tags: [tracing, lambda, cold-start]
  question: |
    With X-Ray active tracing on Lambda, how does the trace help you distinguish
    cold-start latency from downstream latency?
  options:
  - Cold starts appear as an Initialization subsegment, so you can see init time separately from downstream-call
    subsegments
  - It cannot help here; cold-start initialization time is entirely invisible to X-Ray and never appears in a trace
  - Cold-start events are emitted only to CloudTrail management logs, so you must correlate them there manually
  - Cold-start latency is silently folded into the first DynamoDB subsegment, so it looks like database time
  answer: 0
  explanation: |
    X-Ray records an Initialization subsegment for cold starts, so init time is
    distinguishable from downstream call time — revealing latency you'd otherwise
    misattribute. It's visible to X-Ray, not CloudTrail, and not merged into a
    downstream subsegment.
  ref: concepts.md#distributed-tracing-across-lambda-and-microservices
- id: aws-observability-cloudwatch-xray-062
  difficulty: intermediate
  tags: [cost, logs, dimensions]
  question: |
    Which is typically the DOMINANT cost of CloudWatch Logs?
  options:
  - Archived storage per GB retained after ingestion
  - The total number of distinct log groups created
  - Ingestion per GB (data ingested into logs)
  - The total number of open log streams per group
  answer: 2
  explanation: |
    Ingestion per GB usually dominates CloudWatch Logs cost, with storage and
    per-GB-scanned Insights queries adding to it. The count of log groups/streams is
    not the primary cost dimension.
  ref: concepts.md#cost-of-observability
- id: aws-observability-cloudwatch-xray-063
  difficulty: advanced
  tags: [cost, estimation, back-of-envelope]
  question: |
    A service does 1,000 req/s and writes a 2 KB structured log per request. Roughly
    how much log data is ingested per day, and why does it matter?
  options:
  - ~2 MB/day (treating the 2 KB as a per-day total) — negligible and safe to ignore
  - ~2 GB/day (counting only one write per minute rather than per second) — trivially cheap
  - ~17 TB/day (multiplying the per-second bytes by requests again) — impossible to store affordably
  - ~170 GB/day (1,000 × 2 KB × 86,400) — a large monthly ingestion bill before storage or Insights scans,
    motivating sampling/tiering/retention
  answer: 3
  explanation: |
    1,000 × 2 KB = 2 MB/s ≈ 172.8 GB/day. That is a significant ingestion cost at
    CloudWatch Logs pricing, which is why teams sample, tier to S3/IA, and set
    retention. The other magnitudes are off by orders of magnitude.
  ref: concepts.md#cost-of-observability
- id: aws-observability-cloudwatch-xray-064
  difficulty: advanced
  tags: [cost, controls, judgment]
  question: |
    Which change reduces observability cost with the LEAST loss of high-value signal?
  options:
  - Stop sampling and tracing failed/error requests entirely to shave X-Ray ingestion cost off the bill
  - Set retention on log groups, tier bulk debug logs to S3/IA, sample happy-path traces, and bound metric
    cardinality — while keeping SLIs, errors and security logs at full fidelity
  - Delete every operational dashboard across all teams to cut the console and query overhead
  - Turn off all CloudWatch alarms overnight and on weekends to avoid off-hours evaluation charges
  answer: 1
  explanation: |
    The senior move economizes on low-value bulk (retention, tiering, sampling
    happy-paths, cardinality caps) while preserving high-value signals (SLIs, errors,
    security logs). Dropping error traces, deleting dashboards, or disabling alarms
    sacrifices exactly the signals you need.
  ref: concepts.md#cost-of-observability
- id: aws-observability-cloudwatch-xray-065
  difficulty: intermediate
  tags: [cost, cloudtrail]
  question: |
    Which CloudTrail configuration is most likely to become the dominant part of a
    large audit bill?
  options:
  - Data events (e.g. S3 object-level and Lambda invoke logging) and CloudTrail Insights, which are high-volume
    and charged
  - Management events, since the single free copy included per account is the biggest recurring line item
  - Viewing the 90-day Event history in the console, which is metered per query against the retained events
  - Simply creating an organization trail, which carries a fixed per-account monthly subscription charge
  answer: 0
  explanation: |
    Data events and Insights are the expensive, high-volume parts; management events
    include one free copy, Event history is free, and creating an org trail itself
    isn't the cost driver (the events it collects can be). Scope data events with
    advanced selectors.
  ref: concepts.md#cost-of-observability
- id: aws-observability-cloudwatch-xray-066
  difficulty: advanced
  tags: [failure-modes, silent-gap, judgment]
  question: |
    Which failure does a threshold alarm with treatMissingData=notBreaching FAIL to
    catch?
  options:
  - A sustained breach that holds well above the threshold across many consecutive evaluation periods
  - A brief transient spike that momentarily crosses the threshold before falling back below it
  - A source that stops emitting the metric entirely — the alarm may sit in INSUFFICIENT_DATA and never
    page (a silent outage)
  - A slow gradual climb that creeps steadily upward until it finally crosses the threshold value
  answer: 2
  explanation: |
    If the source dies and emits no data, notBreaching/missing can leave the alarm
    silent, hiding the outage. It still catches sustained breaches, spikes and gradual
    rises when data is present — the gap is the absence of data, addressed with
    breaching/heartbeat alarms.
  ref: concepts.md#failure-modes-and-resilience-of-the-observability-stack
- id: aws-observability-cloudwatch-xray-067
  difficulty: expert
  tags: [failure-modes, region, synthetics, judgment]
  question: |
    You monitor a service only with in-region CloudWatch alarms. Which failure is your
    design most likely to miss, and how do you close the gap?
  options:
  - A transient CPU spike on one instance; close the gap by switching to 1-second high-resolution metrics
  - A single unusually slow request; close the gap by adding several more per-service triage dashboards
  - A log-group retention misconfiguration; close the gap by moving those groups to the Infrequent Access class
  - A regional impairment that also degrades your in-region monitoring; close it with external synthetics/canaries
    from outside the region and cross-region or central-account alarms
  answer: 3
  explanation: |
    CloudWatch is regional; if the region is impaired your monitoring can be impaired
    too, so external synthetics and cross-region/central monitoring catch "the whole
    region/endpoint is down." The other options address unrelated concerns.
  ref: concepts.md#failure-modes-and-resilience-of-the-observability-stack
- id: aws-observability-cloudwatch-xray-068
  difficulty: intermediate
  tags: [failure-modes, principle]
  question: |
    What is a core reliability principle for a monitoring system?
  options:
  - It should share the same hosts and failure domain as the monitored system so their availability stays consistent
  - It should be more reliable than the thing it monitors and fail loud, not silent
  - It should run only during staffed business hours, since alerts outside those hours cannot be actioned anyway
  - It should uniformly sample every signal at a flat 5% rate to keep monitoring cost low across the fleet
  answer: 1
  explanation: |
    Monitoring must be more reliable than what it watches and must fail loudly (alert on
    data absence) rather than silently. Sharing a failure domain defeats it; business-
    hours-only leaves gaps; blanket 5% sampling can miss critical failures.
  ref: concepts.md#failure-modes-and-resilience-of-the-observability-stack
- id: aws-observability-cloudwatch-xray-069
  difficulty: advanced
  tags: [tradeoffs, service-selection, judgment]
  question: |
    "What exactly did this one failing request do, step by step?" Which combination
    best answers it, given you've sampled traces?
  options:
  - Structured CloudWatch Logs (queried in Insights) pivoted by trace_id, correlated with the X-Ray trace
    if it was sampled
  - The CloudWatch metric alarm state-change history for the service over the incident window
  - A CloudTrail data-event lookup filtered to that request's API calls and caller identity
  - An AWS Config configuration timeline showing how the resource's state changed around that time
  answer: 0
  explanation: |
    Per-request detail lives in structured logs (Insights), correlated by trace_id to
    the X-Ray trace when sampled. Metric alarm history is aggregate; CloudTrail audits
    API calls not app logic; Config tracks resource state, not request behavior.
  ref: concepts.md#trade-offs-and-when-to-use-what
- id: aws-observability-cloudwatch-xray-070
  difficulty: expert
  tags: [tradeoffs, native-vs-thirdparty, judgment]
  question: |
    A cost-sensitive, fully AWS-native team wants tracing with zero infrastructure to
    operate and tight integration, accepting 30-day retention and coarser profiling.
    Best choice?
  options:
  - A third-party APM product requiring a licensed collector agent deployed and maintained on every host
  - A self-hosted Jaeger backend on EC2 whose storage, scaling and upgrades your team must operate
  - AWS X-Ray (optionally instrumented via ADOT/OTel for future portability)
  - CloudTrail data events repurposed as the trace store, correlating segments from the API-call log
  answer: 2
  explanation: |
    X-Ray is integrated, zero-infra and cost-effective, matching AWS-native cost-
    sensitive needs (accepting 30-day retention/coarser profiling); ADOT keeps future
    portability. Third-party APM and self-hosted Jaeger add cost/ops; CloudTrail is
    audit, not tracing.
  ref: concepts.md#trade-offs-and-when-to-use-what
- id: aws-observability-cloudwatch-xray-071
  difficulty: intermediate
  tags: [tradeoffs, pillar-selection]
  question: |
    Which question is best answered by a metric (or metric filter/EMF) rather than a
    log or trace?
  options:
  - The exact request and response payload captured for one specific failed request
  - The step-by-step call path a single request took as it fanned out across services
  - The identity and timestamp of whoever deleted a particular IAM role yesterday
  - A continuously-alarmable, cheap signal like error rate over time
  answer: 3
  explanation: |
    Continuously-alarmable cheap signals are metrics' strength. Per-request payload is
    a log; the cross-service call path is a trace; "who deleted a role" is CloudTrail
    audit.
  ref: concepts.md#trade-offs-and-when-to-use-what
- id: aws-observability-cloudwatch-xray-072
  difficulty: expert
  tags: [tradeoffs, scenario, judgment]
  question: |
    A fintech runs 300 accounts, needs centralized immutable API audit for 7 years,
    real-time SLO alerting per service, and low-cost bulk log retention. Which design
    is most appropriate end-to-end?
  options:
  - Per-account 90-day Event history as the 7-year audit record; page on host CPU utilization for SLOs; keep every log group in CloudWatch on the never-expire default
  - Organization CloudTrail (or CloudTrail Lake) to a central S3 bucket for 7-year immutable audit; CloudWatch
    Application Signals SLOs with symptom/burn-rate alarms per service; short CloudWatch log retention
    with bulk logs tiered to S3/IA
  - X-Ray traces as the immutable audit store; AWS Config rules to track SLO attainment; a DynamoDB table as the primary log archive
  - Single-account CloudTrail with no org aggregation; anomaly-detection alarms on every per-host metric; 7-year retention held entirely in CloudWatch Logs
  answer: 1
  explanation: |
    The correct end-to-end design uses an org trail / CloudTrail Lake for centralized
    long-retention audit, Application Signals SLOs with symptom/burn-rate alarms for
    real-time alerting, and short CloudWatch retention with S3/IA tiering for cheap bulk
    logs. Event history is only 90 days; X-Ray/Config are the wrong tools for audit/SLO;
    7-year CloudWatch retention and never-expire are costly.
  ref: concepts.md#trade-offs-and-when-to-use-what
- id: aws-observability-cloudwatch-xray-073
  difficulty: beginner
  tags: [tradeoffs, distinction]
  question: |
    Which statement best distinguishes monitoring from observability?
  options:
  - Monitoring watches for known/predicted failure modes; observability lets you ask arbitrary questions
    to explain unpredicted failures
  - They are two interchangeable names for exactly the same practice, so any dashboard, alarm, or query built for one is by definition the other
  - Observability is restricted to consuming metrics alone, while monitoring is restricted to logs alone, and neither is ever permitted to use traces
  - Monitoring is by definition a serverless-only capability, whereas observability can only ever be achieved by running dedicated always-on servers
  answer: 0
  explanation: |
    Monitoring targets known failure modes (predefined dashboards/alarms), while
    observability enables exploring unforeseen problems from telemetry. They aren't
    identical, aren't pillar-restricted, and neither is defined by server model.
  ref: concepts.md#three-pillars-of-observability-on-aws
- id: aws-observability-cloudwatch-xray-074
  difficulty: advanced
  tags: [logs-insights, limits, facts]
  question: |
    Which statement about CloudWatch Logs Insights is accurate for capacity planning?
  options:
  - Queries return an unlimited number of rows at no charge, so capacity planning is unnecessary because neither
    result size nor data scanned ever affects the bill
  - Queries always scan every log group in the account by default regardless of the groups you select, so
    narrowing the selection has no effect on the volume of data read
  - You are billed per GB of data scanned per query and results are capped (up to 10,000 rows), so scoping
    time range and log groups controls cost
  - Insights can only ever query the most recent one hour of log events, so any investigation of older data
    must be run against an S3 export instead
  answer: 2
  explanation: |
    Insights bills per GB scanned and caps returned rows (up to 10,000), so narrowing
    the time window and selected log groups is the cost lever. It isn't unlimited/free,
    doesn't force all-account scans, and isn't limited to the last hour.
  ref: concepts.md#logs-insights-metric-filters-and-subscription-filters
- id: aws-observability-cloudwatch-xray-075
  difficulty: intermediate
  tags: [metrics, ec2, detailed-monitoring]
  question: |
    By default, at what interval does EC2 basic monitoring publish metrics, and what
    does detailed monitoring change?
  options:
  - 1-second basic monitoring included free, with detailed monitoring extending the interval out to 1-minute
    metrics for a per-instance fee
  - 1-minute basic monitoring by default, with detailed monitoring dropping the publish interval down to
    high-resolution 10-second metrics for a fee
  - 15-minute basic monitoring by default, with detailed monitoring improving the publish interval to
    5-minute metrics for an additional charge
  - 5 minutes basic (free); detailed monitoring gives 1-minute metrics (paid)
  answer: 3
  explanation: |
    EC2 basic monitoring emits 5-minute metrics for free; enabling detailed monitoring
    gives 1-minute granularity for a fee. Lambda/API Gateway already emit 1-minute
    metrics. The other intervals are incorrect.
  ref: concepts.md#cloudwatch-metrics-resolution-and-namespaces
