topic: Design Social Feed, Twitter, Chat, and Notification System
domain: system-design
topic_slug: design-feed-chat-notification
version: 1
questions:
  - id: design-feed-chat-notification-001
    difficulty: beginner
    tags:
      - estimation
      - read-write-ratio
      - feed
    question: |
      For a Twitter-scale home timeline, which statement about the read/write
      ratio is most accurate and most influences the architecture?
    options:
      - Reads vastly outnumber writes (roughly 100:1), which favors precomputing timelines to make reads
        cheap
      - Writes vastly outnumber reads, so the design must optimize the write path first
      - Reads and writes are roughly equal, so no special optimization is needed
      - Only writes matter because reads are always served from the client cache
    answer: 0
    explanation: |
      Timeline reads dominate writes by roughly 100:1 (users open the app far more
      often than they post), which is exactly why fanout-on-write / precomputed
      timelines are attractive: you pay once on the rare write to make the frequent
      read trivial. The other options invert or ignore this ratio.
    ref: concepts.md#requirements-scale-estimation-and-the-api-surface
  - id: design-feed-chat-notification-002
    difficulty: beginner
    tags:
      - fanout
      - feed
      - fundamentals
    question: |
      In fanout-on-write, what happens when a user posts?
    options:
      - Nothing is precomputed; the post is only assembled into timelines when followers read
      - The post id is inserted into each follower's precomputed timeline at write time
      - The post is broadcast to every user on the platform regardless of follow graph
      - The post is stored only in the author's outbox and never copied anywhere
    answer: 1
    explanation: |
      Fanout-on-write (push) inserts the new post into every follower's materialized
      timeline at post time, so reads become a single list lookup. Option 0 is
      fanout-on-read, option 2 ignores the follow graph, and option 3 describes a
      pull-only store.
    ref: concepts.md#news-feed-fanout-on-write-fanout-on-read-and-hybrid
  - id: design-feed-chat-notification-003
    difficulty: beginner
    tags:
      - websocket
      - chat
      - protocols
    question: |
      Why is a WebSocket (rather than a normal HTTP request/response) the standard
      choice for a chat application?
    options:
      - It automatically gzip-compresses every frame so chat messages use far less bandwidth than plain HTTP
      - It guarantees exactly-once, in-order delivery of every message even across reconnects and dropped packets
      - It provides a persistent, full-duplex channel so the server can push messages to the client without
        the client polling
      - It removes the need for any server-side message storage by buffering the full history in the client socket
    answer: 2
    explanation: |
      Chat needs server push: the recipient must receive a message without asking.
      A WebSocket is a persistent, bidirectional (full-duplex) connection that
      enables this. It does not by itself compress, guarantee exactly-once, or
      remove the need to persist messages.
    ref: concepts.md#chat-connection-management-with-websockets-and-long-polling
  - id: design-feed-chat-notification-004
    difficulty: beginner
    tags:
      - notifications
      - channels
    question: |
      Which set correctly lists common notification delivery channels a
      notification system must support?
    options:
      - Only mobile push via APNs and FCM, because SMS and email are legacy channels nobody relies on anymore
      - Only email, because it is by far the most reliable channel and the only one with guaranteed delivery
      - Only in-app messages shown while the app is open, since external out-of-app channels are never used
      - Mobile push (APNs/FCM), SMS, email, and in-app/WebSocket
    answer: 3
    explanation: |
      A notification system fans out across multiple channels: mobile push (APNs
      for iOS, FCM for Android/web), SMS, email, and in-app/real-time. The other
      options arbitrarily restrict to one channel, which no real system does.
    ref: concepts.md#notification-system-channels-provider-abstraction-and-pipeline
  - id: design-feed-chat-notification-005
    difficulty: beginner
    tags:
      - presence
      - chat
    question: |
      How is online presence ("green dot") typically maintained?
    options:
      - By keeping an in-memory entry with a TTL that periodic client heartbeats refresh
      - By writing every presence change durably to the primary relational database
      - By requiring users to manually click 'I am online' each minute
      - By running a distributed consensus protocol for each user's status
    answer: 0
    explanation: |
      Presence is ephemeral and best-effort: an in-memory (Redis) key with a TTL,
      refreshed by client heartbeats, marks a user online and expires them offline
      even after an ungraceful disconnect. Durable writes or consensus for presence
      are wasteful overkill, and manual toggling is absurd.
    ref: concepts.md#online-presence
  - id: design-feed-chat-notification-006
    difficulty: beginner
    tags:
      - receipts
      - chat
    question: |
      WhatsApp's message states progress in which order?
    options:
      - read (recipient opened) -> delivered (device received) -> sent (server received)
      - delivered (device received) -> sent (server received) -> read (recipient opened)
      - sent (server received) -> delivered (recipient device received) -> read (recipient opened)
      - sent (server received) -> read (recipient opened) -> delivered (device received)
    answer: 2
    explanation: |
      The receipt state machine is sent (server accepted) then delivered (recipient
      device acked) then read (recipient opened the chat). Each transition flows
      back to the sender. The other orderings are not how the checkmarks work.
    ref: concepts.md#delivery-and-read-receipts
  - id: design-feed-chat-notification-007
    difficulty: beginner
    tags:
      - ranking
      - feed
    question: |
      What is the simplest feed ordering, used by Twitter's "Latest" tab and by
      chat?
    options:
      - Machine-learned relevance ranking
      - Random shuffle for variety
      - Alphabetical by author name
      - Reverse-chronological (newest first)
    answer: 3
    explanation: |
      Reverse-chronological ordering (newest first) is the simplest, transparent,
      real-time ordering, used for "Latest" feeds and chat. ML ranking is the more
      complex alternative; random and alphabetical orderings are not used for feeds.
    ref: concepts.md#feed-ranking-chronological-versus-machine-learned-relevance
  - id: design-feed-chat-notification-008
    difficulty: beginner
    tags:
      - dedup
      - notifications
    question: |
      What is the purpose of a deduplication (idempotency) key in a notification
      pipeline?
    options:
      - To encrypt the notification payload end to end so intermediate queue workers cannot read its contents
      - To ensure that even if the same logical notification is triggered or retried multiple times, the
        user receives it once
      - To pick which channel (push vs SMS) is used based on a hash of the user id and current device state
      - To translate the notification into the user's preferred language before it is handed to the provider
    answer: 1
    explanation: |
      A dedup/idempotency key (e.g., hash of userId+eventId+channel) recorded in a
      fast store lets a worker check-and-set before sending, so at-least-once
      pipelines and retries do not spam the user. It is unrelated to encryption,
      channel choice, or localization.
    ref: concepts.md#notification-fanout-deduplication-and-rate-limiting
  - id: design-feed-chat-notification-009
    difficulty: beginner
    tags:
      - feed
      - celebrity
    question: |
      Why does fanout-on-write become a problem for a celebrity with 100M
      followers?
    options:
      - Because timeline reads become impossibly slow for that celebrity's 100M followers on every refresh
      - Because a follow graph cannot represent accounts whose in-degree exceeds a few million edges
      - Because a single post triggers ~100M timeline inserts, a write storm that can overload the fanout
        system
      - Because tweets from an account that large exceed the durable store's per-record size and cannot persist
    answer: 2
    explanation: |
      One celebrity post fans out to ~100M timelines, creating a massive write
      amplification storm that saturates fanout workers and hot shards. Reads
      actually stay fast; the problem is on the write side. The graph and storage
      are not the issue.
    ref: concepts.md#the-celebrity-hot-key-problem
  - id: design-feed-chat-notification-010
    difficulty: beginner
    tags:
      - notifications
      - async
      - providers
    question: |
      Why should a notification service enqueue work rather than call APNs/FCM/
      Twilio synchronously in the request path?
    options:
      - Because the provider's latency and outages would otherwise directly become the caller's latency
        and failures
      - Because third-party providers waive their per-message fees only when requests arrive off the request path
      - Because synchronous HTTP calls cannot serialize the JSON payload format that APNs and FCM require
      - Because queues by themselves guarantee exactly-once delivery all the way to the recipient's device
    answer: 0
    explanation: |
      Calling a third-party provider synchronously couples your request path to
      their latency and availability; an outage or slowdown becomes yours. Enqueue
      and let channel workers handle retries. Queues do not make providers free or
      give exactly-once end-to-end delivery.
    ref: concepts.md#notification-system-channels-provider-abstraction-and-pipeline
  - id: design-feed-chat-notification-011
    difficulty: beginner
    tags:
      - ids
      - ordering
      - chat
    question: |
      What property of Snowflake IDs makes them useful as chat message ids?
    options:
      - They are random version-4 UUIDs with no internal structure, guaranteeing uniqueness by entropy alone
      - They are strictly sequential integers handed out one at a time by a single central counter service
      - They are content hashes of the message body, so identical messages always collapse to the same id
      - They embed a timestamp in the high bits so they are globally unique and chronologically sortable
    answer: 3
    explanation: |
      Snowflake ids put a timestamp in the high bits plus worker id and a counter,
      so they are globally unique and sort chronologically without a central
      counter. They are not random, not centrally sequential, and not content
      hashes.
    ref: concepts.md#message-ordering-and-consistency-in-chat
  - id: design-feed-chat-notification-012
    difficulty: beginner
    tags:
      - pagination
      - feed
    question: |
      Why is cursor-based pagination preferred over offset pagination for a
      mutating feed?
    options:
      - Offset pagination is inherently faster but consumes more server memory as the page number grows
      - Offset pagination duplicates and skips rows when items are inserted or deleted between page loads
      - Cursor pagination allows instant random access to any arbitrary page number without a full scan
      - Cursor pagination works entirely without any defined sort order on the underlying result set
    answer: 1
    explanation: |
      When the feed mutates under the user, offset-based paging shifts rows, causing
      duplicates and gaps. An opaque cursor (last seen id/score) pages relative to a
      fixed point and is stable. Cursors do not give random page access and do
      require a sort order.
    ref: concepts.md#requirements-scale-estimation-and-the-api-surface
  - id: design-feed-chat-notification-013
    difficulty: beginner
    tags:
      - timeline
      - storage
      - feed
    question: |
      Why do materialized home timelines typically store tweet IDs rather than full
      tweet bodies?
    options:
      - To save storage and keep a single source of truth, hydrating full content at read time
      - Because tweet IDs are stored encrypted at rest while bodies must remain plaintext for full-text search
      - Because tweet bodies exceed the maximum value size of the timeline store and cannot be persisted there
      - Because numeric IDs sort correctly in the timeline index while variable-length bodies break the ordering
    answer: 0
    explanation: |
      Storing ids keeps per-user timelines tiny and lets one tweet body be shared
      by all timelines (edit/delete once). You hydrate bodies from a separate store/
      cache at read time. The other options are false.
    ref: concepts.md#timeline-storage-and-feed-caching
  - id: design-feed-chat-notification-014
    difficulty: beginner
    tags:
      - notifications
      - priority
    question: |
      Why should a 2FA/OTP notification and a promotional "people you may know"
      notification be handled differently?
    options:
      - They carry identical urgency, so a single shared queue and rate limit handles both with no distinction
      - The OTP is time-critical and must not be delayed behind bulk promotional traffic, so it needs
        a high-priority lane
      - Promotional "people you may know" pushes are always more urgent than OTPs and should preempt them
      - OTPs should only ever be sent over email because SMS and push channels are considered insecure for codes
    answer: 1
    explanation: |
      Critical/transactional notifications (OTP, security) need a high-priority lane
      with strict latency, separate from bulk promotional traffic that can be
      delayed or shed. Treating them identically risks an OTP stuck behind a promo
      blast. The other options invert or over-constrain this.
    ref: concepts.md#notification-prioritization-and-delivery-guarantees
  - id: design-feed-chat-notification-015
    difficulty: intermediate
    tags:
      - fanout
      - hybrid
      - feed
      - trade-offs
    question: |
      A social platform has a strongly power-law follower distribution: most users
      have a few hundred followers, but a handful have tens of millions. Which feed
      delivery strategy is most appropriate?
    options:
      - Pure fanout-on-write for everyone, to keep all reads uniformly fast
      - Pure fanout-on-read for everyone, to eliminate all write amplification
      - 'Hybrid: fanout-on-write for normal users, and pull-at-read-time (merge) for the celebrity accounts'
      - Store every tweet in a single global list and scan it per read
    answer: 2
    explanation: |
      Power-law graphs are exactly the case for hybrid: push for the bounded common
      case (fast reads) and pull for the celebrity tail (avoid the write storm),
      merging both at read time. Pure push suffers celebrity write storms; pure pull
      makes every normal read expensive; a global scan is absurd at scale.
    ref: concepts.md#news-feed-fanout-on-write-fanout-on-read-and-hybrid
  - id: design-feed-chat-notification-016
    difficulty: intermediate
    tags:
      - fanout-on-read
      - trade-offs
      - feed
    question: |
      What is the PRIMARY trade-off of choosing fanout-on-read over fanout-on-write?
    options:
      - You gain uniformly fast reads but forfeit the ability to store tweets durably in the source of truth
      - You gain much lower storage but reads become impossible to cache at any layer, edge, or client tier
      - You gain exactly-once cross-region delivery but permanently lose chronological ordering of the feed
      - You gain cheap writes and fresh data but pay with expensive, high-variance reads that fan in across
        all followees
    answer: 3
    explanation: |
      Fanout-on-read avoids write amplification and stays fresh, but each read must
      fan in across everyone you follow and merge-sort, giving expensive,
      high-variance reads. It does not affect durability or exactly-once semantics,
      and reads can still be cached (just less effectively).
    ref: concepts.md#news-feed-fanout-on-write-fanout-on-read-and-hybrid
  - id: design-feed-chat-notification-017
    difficulty: intermediate
    tags:
      - celebrity
      - coalescing
      - feed
    question: |
      In a hybrid feed, a celebrity's latest tweet must reach millions of readers
      loading their timelines at once. Which technique turns this from millions of
      writes into a manageable read pattern?
    options:
      - Cache the celebrity's recent tweets once and serve that cached copy to all readers, coalescing
        concurrent identical fetches
      - Insert the tweet into all million follower timelines immediately at write time, before returning the post
      - Disable the celebrity's account during peak traffic hours so no reads for it can arrive at once
      - Require each reader to recompute the tweet from the source store on every load with no caching layer
    answer: 0
    explanation: |
      Not fanning out on write and instead caching the celebrity's recent tweets
      once, then coalescing the many concurrent identical reads into one backend
      fetch, converts a write storm into a single hot read served to many. Option 1
      (inserting into all million timelines) is the storm you are avoiding; the
      others are non-solutions.
    ref: concepts.md#the-celebrity-hot-key-problem
  - id: design-feed-chat-notification-018
    difficulty: intermediate
    tags:
      - timeline
      - storage
      - bounding
    question: |
      Why do systems cap each user's materialized timeline at, say, the most recent
      ~800 entries instead of storing it unbounded?
    options:
      - Because Redis enforces a hard limit of 800 elements per list and rejects inserts beyond that cap
      - Because older tweets beyond the recent window must be permanently deleted to satisfy compliance rules
      - Because ~99% of reads only touch the first page, so bounding the list bounds memory while rare
        deep scrolls fall back to the pull path
      - Because sorted sets silently drop their ordering guarantee once they grow beyond roughly 800 entries
    answer: 2
    explanation: |
      Nearly all reads hit the first page, so keeping only a bounded recent window
      per user bounds total memory (300M users times huge lists would explode),
      with rare deep history served by the pull/DB path. Redis and sorted sets have
      no such hard limit, and the tweets themselves are not deleted.
    ref: concepts.md#timeline-storage-and-feed-caching
  - id: design-feed-chat-notification-019
    difficulty: intermediate
    tags:
      - chat
      - stateful
      - gateway
    question: |
      What is the key architectural difference between a chat connection/gateway
      tier and a normal stateless web tier?
    options:
      - The gateway tier is fully stateless, so any node can be killed or replaced at any moment with no
        impact on active sessions
      - The gateway tier permanently retains the entire message history for every conversation in local RAM
        for fast lookups
      - The gateway tier needs no load balancing because each client connects directly to a single well-known
        node by DNS
      - 'The gateway tier is stateful: it holds long-lived connections and a session registry maps each
        user to the gateway holding their socket'
    answer: 3
    explanation: |
      Connection gateways are stateful: they hold many persistent WebSockets and a
      userId to gatewayId registry lets the chat service route pushes to the right
      node. This complicates deploys/failover. They are not stateless, do not
      permanently store history, and still need load balancing.
    ref: concepts.md#chat-connection-management-with-websockets-and-long-polling
  - id: design-feed-chat-notification-020
    difficulty: intermediate
    tags:
      - ordering
      - chat
      - partitioning
    question: |
      What ordering guarantee does a well-designed chat system actually need, and
      how is it achieved?
    options:
      - Global total order across every conversation on the platform, enforced by routing all sends through
        one central global sequencer
      - Per-conversation ordering, achieved by partitioning a conversation to one ordered log and using
        time-sortable ids
      - No ordering guarantee at all; each client independently sorts whatever messages it happens to receive
        in arbitrary order
      - Ordering strictly by message payload length, always placing the longest messages first regardless of
        send time
    answer: 1
    explanation: |
      Users only need consistent ordering within a conversation, achieved by keeping
      a conversation on one partition/log with Snowflake (time-sortable) ids. Global
      total order needs a central sequencer/consensus, which is an unnecessary
      bottleneck. No-ordering and length-ordering are wrong.
    ref: concepts.md#message-ordering-and-consistency-in-chat
  - id: design-feed-chat-notification-021
    difficulty: intermediate
    tags:
      - presence
      - fanout
      - trade-offs
    question: |
      A user with 1M friends toggles online/offline as their flaky connection
      flaps. Naively broadcasting each change is a fan-out storm. Which mitigation
      is most appropriate?
    options:
      - Broadcast every single heartbeat to all 1M friends immediately, on the theory that maximum update
        frequency yields the most accurate presence
      - Write each presence change durably to the primary relational database and re-query that row on every
        friend's page read
      - Compute presence on demand only for conversations currently on screen, debounce transitions, and
        broadcast only state changes
      - Increase the client heartbeat frequency several-fold so the system detects the connection flapping
        faster and reacts sooner
    answer: 2
    explanation: |
      Pull presence for the visible set, debounce flapping, and only emit real state
      transitions (not every heartbeat) to avoid the storm. Broadcasting every
      heartbeat is the storm; durable writes are wasteful for ephemeral data;
      faster heartbeats worsen the churn.
    ref: concepts.md#online-presence
  - id: design-feed-chat-notification-022
    difficulty: intermediate
    tags:
      - group-chat
      - storage
      - trade-offs
    question: |
      For a large public channel with thousands of members, which message storage
      model is preferred and why?
    options:
      - A shared per-conversation log (one ordered stream all members read), because per-member inbox
        fanout would explode write amplification
      - Fanout-on-write to a per-user inbox for every member, for fast per-user reads
      - Store the message only on the sender's own device and stream it peer-to-peer to each member when
        they request it
      - Broadcast the message to every user account on the entire platform and let non-members silently
        discard what is not for them
    answer: 0
    explanation: |
      A shared conversation log stores each message once and lets all members read
      it, avoiding the write amplification of copying to thousands of inboxes.
      Per-user inbox fanout suits 1:1 and small groups. The other options lose the
      message or broadcast wrongly.
    ref: concepts.md#group-chat-and-the-message-store
  - id: design-feed-chat-notification-023
    difficulty: intermediate
    tags:
      - discord
      - cassandra
      - hot-partition
    question: |
      Discord partitions messages by (channel_id, bucket) where bucket is a static
      time window. What primary problem does the time bucket solve?
    options:
      - It encrypts each time-bucketed partition with its own separate key so a compromise of one bucket
        cannot expose the others
      - It lets messages be stored without any per-message id, since the bucket boundary alone is enough to
        locate and order them
      - It removes the need for replication because each bucket is self-contained and can be rebuilt from the
        channel on demand
      - It bounds partition size so a busy channel's partition does not grow unbounded and become a hot,
        oversized row
    answer: 3
    explanation: |
      Bucketing by a time window bounds each partition's size, preventing a busy
      channel from creating an unbounded, hot partition. It is not about encryption,
      id-less storage, or replication. The cost is that a page may span buckets.
    ref: concepts.md#group-chat-and-the-message-store
  - id: design-feed-chat-notification-024
    difficulty: intermediate
    tags:
      - notifications
      - queues
      - isolation
    question: |
      Why do mature notification systems use a separate queue per channel (push,
      SMS, email) rather than one shared queue?
    options:
      - Because each delivery channel must be implemented in a different programming language and therefore
        needs its own dedicated queue
      - So a slow or throttled provider on one channel does not head-of-line-block the others, and each
        channel scales and retries independently
      - Because a single message queue is physically incapable of holding more than one distinct message
        type or payload schema at a time
      - To guarantee strict exactly-once delivery on every individual channel by isolating each channel's
        acknowledgements
    answer: 1
    explanation: |
      Channels differ wildly in latency, throughput, and reliability; isolating them
      prevents a slow SMS provider from blocking push/email and lets each scale and
      retry on its own policy. A shared queue causes head-of-line blocking. The
      other options are false.
    ref: concepts.md#notification-system-channels-provider-abstraction-and-pipeline
  - id: design-feed-chat-notification-025
    difficulty: intermediate
    tags:
      - notifications
      - rate-limiting
      - trade-offs
    question: |
      A notification system enforces both a per-user rate limit and a per-provider
      rate limit. What is the distinct purpose of the per-user limit?
    options:
      - To protect the user experience and prevent notification fatigue that drives opt-outs
      - To stay within the aggregate APNs/FCM messages-per-second quota and avoid provider-side throttling
        of the whole fleet
      - To reduce database storage costs by capping how many notification rows are persisted per user each
        day
      - To ensure every notification reaches the device exactly once by capping retries at the per-user
        boundary
    answer: 0
    explanation: |
      The per-user limit protects UX (don't spam a user into disabling
      notifications). The per-provider limit is the one that respects APNs/FCM/
      Twilio quotas. They address different failure modes. Neither is about storage
      or exactly-once.
    ref: concepts.md#notification-fanout-deduplication-and-rate-limiting
  - id: design-feed-chat-notification-026
    difficulty: intermediate
    tags:
      - ranking
      - ml
      - two-stage
    question: |
      Modern ML-ranked feeds use a two-stage funnel. What are the two stages, in
      order?
    options:
      - Heavy ranking first (run the full model over every post in the system to score it), then candidate
        generation to filter that ranked set down
      - Candidate generation/retrieval (gather a bounded set from in-network, out-of-network, trending),
        then a heavy ranking model that scores each candidate
      - Payload encryption of every candidate post, then decryption of the winners just before they are
        rendered into the timeline
      - Fanout-on-write to materialize each follower's inbox first, then fanout-on-read to pull the
        remaining posts at request time
    answer: 1
    explanation: |
      Stage 1 retrieves a bounded candidate set (in-network follows, out-of-network
      recommendations via embeddings/ANN, trending); stage 2 runs a heavy ranker on
      those candidates. You cannot rank everything first (too expensive). The other
      options are unrelated.
    ref: concepts.md#feed-ranking-chronological-versus-machine-learned-relevance
  - id: design-feed-chat-notification-027
    difficulty: intermediate
    tags:
      - receipts
      - group-chat
      - scaling
    question: |
      Read receipts in a large group are expensive because they scale O(members)
      per message. Which technique most reduces this traffic?
    options:
      - Emit one separate delivered event and one separate read event for every member on every single
        message, so the sender sees exact per-message status
      - Disable message ids entirely so that receipts have nothing to attach to and therefore stop being
        generated for the group
      - Coalesce receipts into a per-member 'read up to message id X' high-water-mark cursor instead of
        one event per message
      - Store all receipt state only on the sender's device and never propagate it to the members or the
        server at all
    answer: 2
    explanation: |
      Instead of a receipt per message, track a per-member high-water mark ("read up
      to id X"), collapsing many receipts into one cursor update. Sending an event
      per member per message is the expensive pattern being avoided; the other
      options break tracking.
    ref: concepts.md#delivery-and-read-receipts
  - id: design-feed-chat-notification-028
    difficulty: intermediate
    tags:
      - delivery
      - chat
      - semantics
    question: |
      Which delivery semantics does a practical chat system use, and how does it
      avoid showing duplicates?
    options:
      - Exactly-once delivery enforced end to end directly by the network stack, so the application never
        has to think about duplicates
      - At-most-once delivery, simply accepting that some messages are silently lost whenever a connection
        drops mid-send
      - Best-effort delivery with no message ids and no deduplication, relying on users to notice and ignore
        any repeats
      - At-least-once delivery, made safe by client-side deduplication using the unique message id
    answer: 3
    explanation: |
      Exactly-once end-to-end is impractical, so chat uses at-least-once delivery and
      makes it idempotent: clients dedup by unique message id. At-most-once loses
      messages; no-ids/no-dedup shows duplicates. Durability-then-ack plus client
      dedup is the standard.
    ref: concepts.md#message-ordering-and-consistency-in-chat
  - id: design-feed-chat-notification-029
    difficulty: intermediate
    tags:
      - notifications
      - adapter
      - providers
    question: |
      What is the main benefit of a provider-adapter abstraction layer in a
      notification system?
    options:
      - It hides each provider's API, auth, payload format, and error semantics so you can swap or add
        fallback providers without changing business logic
      - It makes notifications free to send by pooling all traffic under one vendor contract with no
        per-message fees
      - It guarantees the underlying provider can never be throttled because the adapter negotiates unlimited
        quota on your behalf
      - It removes the need for any user preference or opt-out management, since the adapter decides channels
        automatically
    answer: 0
    explanation: |
      The adapter isolates provider-specific details, enabling vendor swaps and
      fallback providers (e.g., during an outage) without touching business logic.
      It does not make sending free, prevent throttling, or replace preference
      management.
    ref: concepts.md#notification-system-channels-provider-abstraction-and-pipeline
  - id: design-feed-chat-notification-030
    difficulty: intermediate
    tags:
      - offline
      - delivery
      - real-time
    question: |
      A message is sent to a recipient who is currently offline. What is the correct
      handling?
    options:
      - Drop the message entirely, since the recipient is not currently connected and there is no live
        socket to write it to
      - Keep retrying the WebSocket push in a tight loop forever until the recipient's connection finally
        comes back online
      - Persist it to the recipient's inbox/log and trigger a push notification; deliver it on reconnect
        via their last-seen cursor
      - Send the message to a randomly chosen online user instead and let them forward it to the intended
        recipient later
    answer: 2
    explanation: |
      Offline recipients get the message persisted (store) plus a push notification,
      and it is delivered on reconnect by syncing everything after their last-seen
      cursor. Dropping loses data, infinite WS retries waste resources, and
      redirecting to another user is nonsensical.
    ref: concepts.md#real-time-delivery-infrastructure
  - id: design-feed-chat-notification-031
    difficulty: intermediate
    tags:
      - estimation
      - fanout
      - feed
    question: |
      With ~7,000 tweets/sec average and an average of ~500 followers per poster
      (ignoring the celebrity tail), roughly how many timeline inserts/sec does pure
      fanout-on-write generate?
    options:
      - About 7,000 inserts/sec
      - About 500 inserts/sec
      - About 70 inserts/sec
      - About 3.5 million inserts/sec
    answer: 3
    explanation: |
      7,000 writes/sec times ~500 followers each is ~3.5M timeline inserts/sec. This
      large write amplification is exactly why the celebrity tail must be
      special-cased and why hybrid fanout exists. The other figures ignore the
      multiplication by followers.
    ref: concepts.md#requirements-scale-estimation-and-the-api-surface
  - id: design-feed-chat-notification-032
    difficulty: intermediate
    tags:
      - websocket
      - long-polling
      - trade-offs
    question: |
      A subset of clients sit behind restrictive proxies that break WebSockets.
      What is the standard fallback?
    options:
      - Abandon real-time features entirely for those proxied clients and downgrade them to a manual refresh
        button that reloads the whole page
      - Fall back to long polling (or SSE), which is more widely compatible at the cost of higher latency
        and overhead
      - Force every client on the entire platform to switch to fixed-interval short polling so all clients
        behave identically regardless of proxy
      - Require the affected users to switch to a different ISP or mobile network that does not interfere
        with WebSocket upgrade handshakes
    answer: 1
    explanation: |
      Long polling (or SSE for server-to-client) is the widely-compatible fallback
      when WebSockets are blocked, trading some latency/overhead for reachability.
      You don't abandon real-time, downgrade everyone to short polling, or dictate
      the user's network.
    ref: concepts.md#chat-connection-management-with-websockets-and-long-polling
  - id: design-feed-chat-notification-033
    difficulty: intermediate
    tags:
      - notifications
      - collapsing
      - ux
    question: |
      Beyond exact deduplication, what does notification "collapsing" (APNs
      collapse-id / FCM collapse_key) achieve?
    options:
      - It encrypts notifications at rest
      - It guarantees delivery order across channels
      - It merges many related notifications into one (e.g., '5 people liked your photo'), reducing noise
        and provider load
      - It permanently deletes old notifications from the device
    answer: 2
    explanation: |
      Collapsing groups semantically-related notifications into a single one,
      replacing a pending notification and cutting noise and provider calls. It is
      distinct from exact dedup and unrelated to encryption, ordering, or deletion.
    ref: concepts.md#notification-fanout-deduplication-and-rate-limiting
  - id: design-feed-chat-notification-034
    difficulty: intermediate
    tags:
      - consistency
      - feed
      - cap
    question: |
      What consistency stance is most appropriate for a home feed read path, and
      why?
    options:
      - 'Eventual consistency (AP): a slightly stale feed is acceptable, and availability matters more
        than perfect freshness'
      - 'Strong consistency (CP): block the read until all fanout is confirmed globally'
      - Full linearizability across every user's timeline for every read, so all followers observe a new post
        at the exact same instant
      - A read/write lock that forbids any timeline read while a write or fanout for that user is still in
        flight anywhere in the system
    answer: 0
    explanation: |
      A feed can tolerate slight staleness; what users won't tolerate is a feed
      being down, so you favor availability (AP/eventual). Blocking reads on global
      fanout confirmation or linearizability would tank availability and latency for
      no user benefit.
    ref: concepts.md#trade-offs-and-when-to-use-what
  - id: design-feed-chat-notification-035
    difficulty: intermediate
    tags:
      - real-time
      - session-registry
      - routing
    question: |
      In the real-time delivery layer, what is the role of the session registry
      (userId -> gatewayId)?
    options:
      - It durably stores the complete message history for each user so gateways can replay it on reconnect
      - It ranks each user's home feed by scoring candidate posts before they are pushed to the gateway
      - It generates the globally-unique Snowflake ids that every new message is stamped with at send time
      - It lets a publishing service route a message to the specific gateway holding the recipient's live
        connection
    answer: 3
    explanation: |
      The session registry maps each connected user to the gateway holding their
      socket, so a publish can be routed to the right gateway for delivery. It does
      not store history, rank feeds, or mint ids.
    ref: concepts.md#real-time-delivery-infrastructure
  - id: design-feed-chat-notification-036
    difficulty: intermediate
    tags:
      - notifications
      - retry
      - dlq
    question: |
      A push send fails transiently. What is the standard, safe handling in a
      notification pipeline?
    options:
      - Retry immediately in a tight, unthrottled loop until the provider finally accepts the send, however
        long that takes
      - Retry with exponential backoff and jitter, and route to a dead-letter queue after N failures;
        dedup keys make retries safe
      - Give up permanently on the very first transient failure, on the theory that not retrying is the only
        way to avoid ever double-notifying the user
      - Switch the entire notification system to synchronous provider sends so failures surface in the
        request path and can be handled inline
    answer: 1
    explanation: |
      Exponential backoff with jitter plus a dead-letter queue after repeated
      failures is the standard; dedup keys keep retries from spamming the user.
      Tight-loop retries hammer the provider, giving up loses the notification, and
      going synchronous reintroduces coupling.
    ref: concepts.md#notification-prioritization-and-delivery-guarantees
  - id: design-feed-chat-notification-037
    difficulty: intermediate
    tags:
      - feed
      - ranking
      - placement
      - trade-offs
    question: |
      Even when delivery uses fanout-on-write, where do large feeds usually apply ML
      ranking, and why?
    options:
      - At read time over a bounded candidate set, so ranking uses the freshest features and per-session
        personalization within the latency budget
      - At write time, precomputing a final score for every follower's copy, because it is cheapest per
        read
      - Never on the server; ranked feeds are fundamentally incompatible with fanout-on-write and must fall
        back to plain chronological order
      - On the client device only, where each app locally scores every candidate post with an on-device
        model and no server ever participates
    answer: 0
    explanation: |
      You fan out ids, then rank the top page per request at read time using fresh
      features and session context. Precomputing final scores on write goes stale
      and can't personalize per session. Ranked feeds absolutely can use push
      delivery, and ranking is server-side.
    ref: concepts.md#feed-ranking-chronological-versus-machine-learned-relevance
  - id: design-feed-chat-notification-038
    difficulty: intermediate
    tags:
      - chat
      - store
      - cassandra
      - reads
    question: |
      In an SSTable-based store like Cassandra/ScyllaDB used for messages, which
      statement about the read/write cost is correct and shapes the design?
    options:
      - Writes are more expensive than reads because every write must synchronously rewrite all existing
        SSTables in place, so you minimize writes
      - Reads are more expensive than writes (must merge memtable and multiple SSTables), so hot channels
        can create hot-partition read latency
      - Reads and writes cost exactly the same because both always resolve to a single sequential seek
        against one immutable on-disk file
      - Neither reads nor writes ever touch disk, since the entire keyspace is pinned in RAM and SSTables
        are purely a backup format
    answer: 1
    explanation: |
      In LSM/SSTable stores, writes append cheaply but reads may merge the memtable
      and several SSTables, so reads cost more; heavy concurrent reads on a popular
      channel create hot-partition latency (Discord's exact problem). The other
      options misstate the cost model.
    ref: concepts.md#group-chat-and-the-message-store
  - id: design-feed-chat-notification-039
    difficulty: advanced
    tags:
      - celebrity
      - threshold
      - trade-offs
    question: |
      In a threshold-based hybrid feed, what breaks if the celebrity threshold is
      set too LOW (too many accounts treated as celebrities)?
    options:
      - Write fanout storms return for the largest accounts, because a lower threshold pushes more of the
        biggest accounts back onto the write-fanout path
      - The follow graph becomes internally inconsistent, since reclassifying accounts as celebrities
        silently rewrites the follower edges pointing at them
      - Too many accounts are pulled at read time, so timeline reads must merge many pulled sources and
        read cost/latency climbs
      - Snowflake ids stop sorting chronologically, because the celebrity threshold controls how the
        timestamp bits are packed into each generated id
    answer: 2
    explanation: |
      A too-low threshold classifies too many accounts as pull-only, so a typical
      user's read must merge many pulled sources, raising read cost and latency. A
      too-HIGH threshold is what re-admits write storms. The threshold does not
      affect graph consistency or id ordering.
    ref: concepts.md#the-celebrity-hot-key-problem
  - id: design-feed-chat-notification-040
    difficulty: advanced
    tags:
      - cold-cache
      - timeline
      - failure
      - trade-offs
    question: |
      Home timelines are cached in Redis (source of truth = tweet store + follow
      graph). A cache-cluster failover leaves timelines cold. What is the best
      degradation strategy?
    options:
      - Return empty feeds to every user until the cache cluster naturally refills from organic write
        traffic over the following hours
      - Block all incoming reads behind a global lock until every user's timeline has been fully rebuilt
        from the tweet store and follow graph
      - Permanently switch the entire platform to fanout-on-read for all users, abandoning the precomputed
        timeline design for good
      - Serve reads via the pull path (fetch-and-merge from followees) during warm-up while rebuilding,
        and coalesce rebuild work to avoid a stampede
    answer: 3
    explanation: |
      Because the pull path can reconstruct a timeline from the source of truth, you
      degrade to pull during warm-up and coalesce rebuilds to prevent a stampede,
      keeping the feed available (slower, not down). Empty feeds and blocking reads
      hurt availability; permanently switching abandons the read-optimized design.
    ref: concepts.md#failure-modes-and-graceful-degradation
  - id: design-feed-chat-notification-041
    difficulty: advanced
    tags:
      - gateway
      - deploy
      - thundering-herd
      - trade-offs
    question: |
      Your stateful WebSocket gateway fleet holds 10M live connections and must
      deploy a new version. What is the biggest risk and the right mitigation?
    options:
      - A reconnect thundering herd when connections drop at once; mitigate with connection draining,
        jittered client reconnect, and capacity headroom
      - No meaningful risk at all; simply restart all gateway nodes simultaneously and let every client
        reconnect at once, since modern load balancers absorb the spike transparently
      - Permanent loss of all in-flight message history, mitigated by disabling persistence so the deploy
        has no durable state left to corrupt during the restart
      - Snowflake id collisions across the restarted nodes, mitigated by switching every message id from
        Snowflake to random version-4 UUIDs before deploying
    answer: 0
    explanation: |
      Dropping millions of connections at once triggers a synchronized reconnect
      storm that can overload the fleet and downstream. Graceful draining, jittered
      reconnect backoff, and headroom spread the load. History isn't lost by a
      gateway deploy, and this has nothing to do with id collisions.
    ref: concepts.md#failure-modes-and-graceful-degradation
  - id: design-feed-chat-notification-042
    difficulty: advanced
    tags:
      - notifications
      - priority
      - load-shedding
      - trade-offs
    question: |
      During a product-launch push blast, APNs begins throttling you. You must keep
      OTP/2FA delivery fast. Which design makes this possible?
    options:
      - A single shared queue and one global rate limiter for all notifications, so the launch blast and
        the OTP traffic drain through the exact same first-in-first-out pipe
      - Sending all notifications synchronously in the request path to detect provider failures sooner,
        so the launch blast surfaces its throttling errors before OTPs are affected
      - Separate priority lanes so critical (OTP) traffic is isolated from bulk, and load-shedding sheds
        low-priority notifications first
      - Removing the dedup layer entirely during the launch so more messages can be pushed through the
        provider before its throttling threshold trips
    answer: 2
    explanation: |
      Priority lanes isolate critical OTP delivery from bulk, and shedding
      low-priority traffic first protects the critical lane under provider
      throttling. A single shared queue lets the blast starve OTPs; synchronous
      sends worsen coupling; removing dedup spams users.
    ref: concepts.md#notification-prioritization-and-delivery-guarantees
  - id: design-feed-chat-notification-043
    difficulty: advanced
    tags:
      - ordering
      - clock-skew
      - snowflake
      - trade-offs
    question: |
      Snowflake-based ordering relies on timestamps. Across many id-generating
      workers, what must the design guard against, and why not just use a global
      sequencer?
    options:
      - Nothing at all; NTP keeps every worker's wall clock perfectly synchronized to the nanosecond, and
        a single global sequencer scales trivially to any throughput
      - Only disk failures on the id workers; a global sequencer scales infinitely because id issuance is
        purely in-memory and never contends on anything
      - Only network partitions between workers; timestamps are entirely irrelevant to ordering because
        Snowflake sorts solely on the worker-id bits
      - Clock skew and backward clock jumps (guard by refusing to emit ids that go backwards, coordinating
        worker ids); a global sequencer would be a scalability bottleneck
    answer: 3
    explanation: |
      Snowflake correctness assumes bounded skew and monotonic clocks, so you guard
      against backward jumps and coordinate worker ids. A single global sequencer
      would serialize all id generation into a bottleneck, which is why
      per-conversation ordering with Snowflakes is preferred at scale.
    ref: concepts.md#message-ordering-and-consistency-in-chat
  - id: design-feed-chat-notification-044
    difficulty: advanced
    tags:
      - dedup
      - ttl
      - trade-offs
      - notifications
    question: |
      What is the key trade-off in choosing the TTL for a notification
      deduplication store?
    options:
      - A longer TTL always strictly improves correctness with no downside, since keeping dedup keys around
        longer can only ever prevent more duplicates and never causes any problem
      - Too short a TTL lets delayed retries slip through as duplicates; too long wastes memory and can
        suppress legitimate repeat notifications
      - The TTL length only affects the encryption strength of the dedup keys and has no bearing on how
        duplicates are detected or suppressed
      - The TTL is irrelevant because dedup keys are written permanently and never expire, so retries are
        always caught no matter how much time has passed
    answer: 1
    explanation: |
      The dedup TTL must cover the retry window: too short and a late retry
      duplicates; too long and you pay memory and risk suppressing genuinely repeated
      notifications. It is not free to lengthen, unrelated to encryption, and keys
      are not permanent.
    ref: concepts.md#notification-fanout-deduplication-and-rate-limiting
  - id: design-feed-chat-notification-045
    difficulty: advanced
    tags:
      - hot-partition
      - coalescing
      - chat
      - trade-offs
    question: |
      A single very popular channel creates a hot partition in your message store,
      causing cascading read latency. Which combination of techniques best mitigates
      it, following Discord's approach?
    options:
      - Increase the replication factor for the channel's keyspace and hope the extra replicas cause the
        concurrent quorum reads to spread evenly across more nodes
      - Delete the channel's older messages on a rolling basis to shrink the partition so the hot row stays
        small enough to serve quickly
      - Request coalescing for identical concurrent reads plus consistent-hash routing so requests for
        the same channel hit the same data-service instance
      - Move just that channel's messages to a relational database and rely on row-level locks to serialize
        the concurrent reads against the hot partition
    answer: 2
    explanation: |
      Discord's data services coalesce concurrent identical reads (query the DB once)
      and route by channel id via consistent hashing so the same channel's requests
      land on one instance, enabling coalescing. Higher replication doesn't fix quorum
      hot reads; deleting messages loses data; row locks worsen contention.
    ref: concepts.md#group-chat-and-the-message-store
  - id: design-feed-chat-notification-046
    difficulty: advanced
    tags:
      - feed
      - storage
      - ids-vs-bodies
      - trade-offs
    question: |
      A design proposes storing full tweet bodies (not just ids) inside every
      follower's materialized timeline to skip the hydration lookup. What is the
      most significant downside?
    options:
      - Massive storage duplication, and every edit or delete must fan out again to update all copies
      - Reads become slower overall, because the larger inlined bodies take longer to parse and deserialize
        than a compact list of tweet ids would
      - Chronological ordering is lost, because storing variable-length bodies in the timeline breaks the
        sort key that the id-based index relied on
      - It becomes impossible to apply any ML ranking to the feed, since ranking can only score entries
        that are stored as bare ids rather than full bodies
    answer: 0
    explanation: |
      Denormalizing full bodies into every timeline multiplies storage and turns any
      edit/delete into another fanout to fix all copies, losing the single-source-of-
      truth benefit. It actually removes the hydration hop (a read win), does not
      break ordering, and does not prevent ranking.
    ref: concepts.md#timeline-storage-and-feed-caching
  - id: design-feed-chat-notification-047
    difficulty: advanced
    tags:
      - fanout-worker
      - backlog
      - degradation
      - trade-offs
    question: |
      The fanout-on-write worker queue is badly backed up during a traffic spike,
      so new posts appear late in followers' timelines. Which response best preserves
      feed availability while managing the backlog?
    options:
      - Stop accepting any new posts platform-wide until the fanout queue has fully drained back to zero
        depth, so no further work piles up behind the spike
      - Switch every user on the platform permanently to fanout-on-read, abandoning the precomputed
        timeline design so the backed-up write queue is never used again
      - Drop the entire fanout backlog immediately and start fresh from the next incoming post, accepting
        that the queued posts simply never reach their followers
      - Prioritize fanout to active users, fall back to the pull path for users experiencing lag, and
        alarm on queue depth
    answer: 3
    explanation: |
      You keep the system available by prioritizing active users' fanout, serving
      lagging users via pull, and alerting on depth so the feed is stale, not down.
      Blocking posts hurts writes, a permanent switch abandons the read-optimized
      design, and dropping the backlog loses posts from timelines.
    ref: concepts.md#failure-modes-and-graceful-degradation
  - id: design-feed-chat-notification-048
    difficulty: advanced
    tags:
      - presence
      - consistency
      - trade-offs
    question: |
      Why is it a design mistake to store presence with strong consistency and
      durable writes?
    options:
      - Because data-protection regulations explicitly mandate that online/offline presence be stored only
        under eventual consistency and never under a strongly consistent write path
      - Because presence is high-churn, low-value, and inherently racy; durability/consensus adds cost
        and latency for data that is stale the instant it is written
      - Because durable relational and log-structured stores are technically unable to represent a simple
        boolean online/offline state and would corrupt the value on write
      - Because strong consistency would make presence indicators so precise that users would find the
        constantly-flipping green dot confusing and unusable
    answer: 1
    explanation: |
      Presence changes constantly and is low-stakes; spending durable writes or
      consensus on it wastes resources for data that is immediately stale. Ephemeral
      in-memory state with a TTL is correct. The other options are nonsensical or
      false.
    ref: concepts.md#online-presence
  - id: design-feed-chat-notification-049
    difficulty: advanced
    tags:
      - optimistic-ui
      - ids
      - chat
      - trade-offs
    question: |
      A chat client wants to show the sender's own message instantly, but message
      ids are server-assigned for authoritative ordering. How is this reconciled?
    options:
      - The client optimistically renders the message with a temporary local id, then reconciles to the
        server-assigned id/order when the ack arrives
      - The client freezes the compose box and blocks the entire chat UI until the server ack returns the
        authoritative id, so nothing is rendered before ordering is known
      - The client generates the final authoritative Snowflake id itself and the server unconditionally
        trusts it, skipping any server-side id assignment entirely
      - The message is not shown to the sender at all until the recipient has opened the chat and a read
        receipt has flowed all the way back to the sender's device
    answer: 0
    explanation: |
      Optimistic rendering with a temporary id gives instant feedback; on ack the
      client swaps in the authoritative server id and reorders if needed. Blocking
      the UI hurts UX, letting the client mint the authoritative id undermines
      server ordering, and hiding the sender's own message is wrong.
    ref: concepts.md#message-ordering-and-consistency-in-chat
  - id: design-feed-chat-notification-050
    difficulty: advanced
    tags:
      - notifications
      - escalation
      - channels
      - trade-offs
    question: |
      For a critical alert, the design escalates push -> SMS if the push is not
      acknowledged within T seconds. What must accompany this escalation to avoid a
      new problem?
    options:
      - Nothing extra is needed; receiving both the push and the SMS for the same alert is always fine and
        is even preferable because it maximizes the odds the user sees it
      - Deduplication and an ack window, so the user is not double-notified when both the push and the
        SMS land
      - Disabling the push channel entirely and routing every critical alert straight to SMS, so there is
        only ever one channel that can possibly fire
      - Forcing all users to always receive both the push and the SMS for every alert, so the escalation
        timer can be removed and the behavior is uniform
    answer: 1
    explanation: |
      Channel escalation risks double-delivery (push arrives late after SMS fired),
      so you need a dedup key and an ack window to suppress the redundant channel.
      Ignoring double delivery annoys users and costs SMS money; disabling push or
      forcing both channels defeats the purpose.
    ref: concepts.md#notification-prioritization-and-delivery-guarantees
  - id: design-feed-chat-notification-051
    difficulty: advanced
    tags:
      - vector-db
      - ranking
      - out-of-network
      - modern
    question: |
      Where does a vector database / embeddings + ANN search fit in a modern feed,
      and what does it primarily enable?
    options:
      - It replaces the Cassandra/ScyllaDB message store as the durable home for chat history, indexing
        each message by its embedding instead of by channel and time
      - It generates globally-unique Snowflake ids faster than a monotonic counter by deriving them from
        the nearest-neighbor distance between message embeddings
      - It powers out-of-network candidate retrieval (content/users similar to your interests) during
        the candidate-generation stage, improving discovery and cold-start
      - It is the durable source of truth for the follow-graph edges, storing each follower relationship
        as a vector so adjacency can be queried by similarity search
    answer: 2
    explanation: |
      Embeddings + approximate-nearest-neighbor search retrieve out-of-network
      candidates (relevant content/users you don't follow) in the retrieval stage,
      improving discovery and cold-start. It is not a chat store, id generator, or
      graph store.
    ref: concepts.md#feed-ranking-chronological-versus-machine-learned-relevance
  - id: design-feed-chat-notification-052
    difficulty: advanced
    tags:
      - real-time
      - sharding
      - pubsub
      - trade-offs
    question: |
      Your real-time pub/sub bus for pushing updates to gateways is becoming a
      bottleneck. What is the standard scaling move and its cost?
    options:
      - Keep one central bus and simply add more consumer processes to it; there is no downside, since the
        single bus itself can absorb unlimited publish throughput no matter how many consumers attach
      - Remove the pub/sub bus entirely and have every gateway poll the primary database directly on a
        fixed interval to discover updates destined for its connected users
      - Route all publish traffic through one single elected leader node to preserve a strict global order,
        keeping every update serialized through that one coordinator
      - Shard/partition the bus by userId so load spreads, accepting harder rebalancing and more complex
        cross-shard broadcasts
    answer: 3
    explanation: |
      Sharding the bus by userId spreads load and scales, but rebalancing and
      cross-shard broadcast (e.g., to a huge audience) become harder. A single
      central bus stays a hotspot, DB polling reintroduces load and latency, and a
      single leader is the bottleneck you're removing.
    ref: concepts.md#real-time-delivery-infrastructure
  - id: design-feed-chat-notification-053
    difficulty: advanced
    tags:
      - tombstones
      - cassandra
      - chat
      - trade-offs
    question: |
      Why should a Cassandra/ScyllaDB message store be designed for append-mostly
      workloads, treating edits/deletes carefully?
    options:
      - Because deletes/edits create tombstones/new versions, and many tombstones degrade read performance,
        so an append-heavy model reads far better
      - Because in-place updates and edits are physically impossible in these stores, so an append-mostly
        model is the only workload the engine will accept at all
      - Because appends acquire row-level locks that block concurrent readers, whereas deletes take no
        locks, so an append-heavy design must minimize the appends
      - Because these LSM-based stores cannot persist timestamps, so ordering only works if every row is a
        fresh append and no prior row is ever modified
    answer: 0
    explanation: |
      LSM-based stores handle deletes via tombstones and edits via new versions;
      accumulating tombstones hurts read latency, so an append-mostly design (rare
      edits) reads much better. Updates are possible (just costly), appends don't
      lock rows, and timestamps are supported.
    ref: concepts.md#group-chat-and-the-message-store
  - id: design-feed-chat-notification-054
    difficulty: advanced
    tags:
      - chat
      - delivery
      - durability
      - ordering
      - trade-offs
    question: |
      A chat requirement states: "a message must never be lost, but delivering it
      twice is acceptable if the client hides duplicates." Which design satisfies
      this best?
    options:
      - Ack the sender before the message is persisted anywhere, to minimize send latency, and rely on the
        gateway to write it to durable storage lazily in the background afterwards
      - Use at-most-once delivery so that no duplicate can ever reach the client, accepting that a message
        dropped mid-send during a connection failure is simply never redelivered
      - Persist the message durably before acking the sender, use at-least-once delivery, and dedup by
        message id on the client
      - Store messages only in the connection gateway's local memory for speed, flushing to a durable store
        only once the recipient has come online and acknowledged receipt
    answer: 2
    explanation: |
      Durability-before-ack guarantees no loss; at-least-once plus client dedup by id
      makes duplicate delivery harmless. Acking before persisting risks loss on
      crash; at-most-once can lose messages (violates "never lost"); in-memory-only
      loses data on gateway failure.
    ref: concepts.md#message-ordering-and-consistency-in-chat
  - id: design-feed-chat-notification-055
    difficulty: advanced
    tags:
      - notifications
      - at-least-once
      - idempotency
      - trade-offs
    question: |
      Upstream services trigger notifications at-least-once, and multiple services
      can trigger the same logical alert. What delivery guarantee should the
      notification system target, and how?
    options:
      - Exactly-once end to end, achieved by wrapping every APNs and FCM call in a distributed
        two-phase-commit transaction so no logical notification can ever be sent twice
      - At-most-once, sending each notification a single time with no retries and dropping any that
        might be a duplicate, accepting that genuine alerts are silently lost on transient failure
      - No delivery guarantee at all; emit best-effort and rely on end users to notice and mentally
        ignore whatever duplicate notifications they happen to receive
      - 'At-least-once with idempotency: assign a stable dedup key per logical notification and check-and-set
        before sending so the user is notified once'
    answer: 3
    explanation: |
      Exactly-once across third-party providers you don't control is impractical;
      instead make delivery idempotent with a stable dedup key so at-least-once
      collapses to once-to-the-user. At-most-once risks dropping real alerts, and
      relying on users is not a design.
    ref: concepts.md#notification-prioritization-and-delivery-guarantees
  - id: design-feed-chat-notification-056
    difficulty: advanced
    tags:
      - celebrity-miss
      - hot-key
      - cache
      - trade-offs
    question: |
      A celebrity's cached recent-tweets key expires while 100M users are reading
      their timelines, causing a thundering herd on the message store. Which set of
      mitigations directly addresses this?
    options:
      - Shorten the cache TTL to a few seconds so the hot key refreshes far more often and each reader
        is more likely to hit an already-warm entry
      - Request coalescing on the hot key, longer TTL for hot keys, and probabilistic early refresh before
        expiry
      - Fan the celebrity's tweet out to all 100M follower timelines on write, so the read path never
        needs to touch the message store for that key at all
      - Serve the last-cached copy stale forever and never refresh it again, so the message store is
        never queried for that celebrity key after the first load
    answer: 1
    explanation: |
      Coalescing concurrent misses into one fetch, giving hot keys longer TTLs, and
      refreshing probabilistically before expiry prevent the synchronized stampede.
      Shortening TTL causes more frequent stampedes; write-fanout is the storm you
      avoided; serving stale forever breaks freshness.
    ref: concepts.md#failure-modes-and-graceful-degradation
  - id: design-feed-chat-notification-057
    difficulty: advanced
    tags:
      - ranking
      - chronological
      - trade-offs
    question: |
      A regulator and a subset of users demand transparency about why they see
      content, and the product values trust over marginal engagement. Which feed
      ordering is the better fit, and what is given up?
    options:
      - ML ranking, giving up transparency and predictability in exchange for the higher engagement that
        a personalized relevance model reliably produces
      - Random ordering, on the theory that shuffling posts unpredictably each load maximizes fairness by
        giving every author an equal chance of appearing first
      - Reverse-chronological, giving up some engagement and out-of-network discovery for transparency,
        predictability, and lower infra cost
      - Alphabetical ordering by author handle, chosen because sorting on a fixed key makes the feed fully
        deterministic and trivial for a regulator to audit
    answer: 2
    explanation: |
      Reverse-chronological is transparent and predictable ("newest first"), fitting a
      trust-first mandate, at the cost of engagement and the discovery that ML
      ranking's out-of-network candidates provide. ML sacrifices transparency; random
      and alphabetical are not real feed orderings.
    ref: concepts.md#feed-ranking-chronological-versus-machine-learned-relevance
  - id: design-feed-chat-notification-058
    difficulty: advanced
    tags:
      - group-chat
      - huge-channel
      - fanout
      - trade-offs
    question: |
      A live-event channel has 5 million members online. What is the right delivery
      model for a new message, and why?
    options:
      - Persist once to the shared channel log and have members pull recent messages (fanout-on-read),
        since pushing to millions per message is a fanout storm
      - Push the message to all 5M members' gateways and per-user inboxes immediately via fanout-on-write,
        so every online member's read is a single precomputed lookup
      - Send the message only to the 100 most recently active members and skip everyone else, on the
        assumption that inactive members will never scroll back to read it
      - Store the message solely on the sender's own device and let each of the other members fetch it
        peer-to-peer directly from the sender when they open the channel
    answer: 0
    explanation: |
      For very large channels, writing once to the shared log and letting members
      pull avoids the per-message write storm of pushing to millions. Pushing to all
      5M is the storm; arbitrarily limiting to 100 members drops delivery; P2P from
      the sender doesn't scale or persist.
    ref: concepts.md#group-chat-and-the-message-store
  - id: design-feed-chat-notification-059
    difficulty: advanced
    tags:
      - estimation
      - connections
      - chat
    question: |
      If a tuned connection server holds ~1M persistent WebSocket connections and
      you must serve 50M concurrently-connected users (ignoring redundancy), roughly
      how many connection servers are needed at minimum?
    options:
      - About 5 servers
      - About 500 servers
      - About 5,000 servers
      - About 50 servers
    answer: 3
    explanation: |
      50M / 1M per server = ~50 servers at minimum (before adding redundancy and
      headroom for reconnect storms). The other figures are off by one or more orders
      of magnitude.
    ref: concepts.md#requirements-scale-estimation-and-the-api-surface
  - id: design-feed-chat-notification-060
    difficulty: advanced
    tags:
      - notifications
      - rate-limit
      - drop-vs-delay
      - trade-offs
    question: |
      Under a rate-limit breach, when is it better to DROP notifications versus
      DELAY (queue) them?
    options:
      - Always delay and queue everything regardless of priority; dropping any notification is never
        acceptable, so the queue simply absorbs the entire over-limit burst until it drains
      - Drop/collapse low-priority notifications (protecting UX and providers) but delay high-priority
        ones to preserve their delivery
      - Always drop every notification uniformly the moment the limit is breached, since shedding all
        traffic equally is the only way to fully protect the downstream providers
      - Drop the high-priority notifications and delay the low-priority ones, on the reasoning that
        low-priority traffic is the more valuable and must therefore be preserved
    answer: 1
    explanation: |
      Low-priority over-limit notifications are best dropped or collapsed (they add
      little and risk fatigue), while high-priority ones should be delayed to
      preserve delivery. Always-delay can stale-out and back up; always-drop loses
      critical alerts; the last option inverts priority.
    ref: concepts.md#notification-fanout-deduplication-and-rate-limiting
  - id: design-feed-chat-notification-061
    difficulty: expert
    tags:
      - cell-based
      - edge
      - real-time
      - trade-offs
    question: |
      A global chat product wants lower latency and blast-radius isolation. It
      considers cell-based / edge-deployed gateways with a regional pub/sub. What is
      the primary trade-off of this architecture?
    options:
      - It reduces user-perceived latency and isolates failures per cell, but adds cross-cell/cross-region
        routing and deployment complexity
      - It eliminates all cross-region communication entirely and adds no new complexity, because each
        cell becomes fully self-contained and never needs to talk to any other cell
      - It forces strong global consistency on presence, requiring every cell to agree on each user's
        online/offline state through a synchronous cross-cell consensus round
      - It removes the need for a session registry altogether, since edge cells can locate any recipient's
        live socket purely from the client's source IP address
    answer: 0
    explanation: |
      Edge/cell gateways cut latency and contain failures to a cell, but you pay with
      cross-cell routing (a message between users in different cells must traverse
      cells) and more complex deploys. It doesn't eliminate cross-region traffic,
      force presence consistency, or remove the registry.
    ref: concepts.md#real-time-delivery-infrastructure
  - id: design-feed-chat-notification-062
    difficulty: expert
    tags:
      - hybrid
      - merge
      - read-path
      - trade-offs
    question: |
      In a hybrid feed, the read path merges a user's precomputed push inbox with
      freshly pulled celebrity tweets. What is the subtle correctness/performance
      risk introduced by this merge, and how is it bounded?
    options:
      - The merge always destroys chronological order because interleaving two independently sorted
        sources is mathematically impossible to re-sort, and no known technique can recover it
      - The merge can duplicate a tweet if a borderline account is both pushed and pulled; bound it by
        a clear threshold and dedup by tweet id at merge time
      - The merge demands strong linearizable consistency across every timeline shard, and if any shard
        lags even slightly the entire read returns an empty feed rather than partial results
      - The merge silently restores O(followers) write amplification on the push path, because pulling
        celebrity tweets at read time forces a re-fanout of every earlier post on write
    answer: 1
    explanation: |
      If an account straddles the threshold (or reclassifies), a tweet could appear
      both in the pushed inbox and the pulled set, so you dedup by tweet id during
      merge and keep a crisp threshold. Ordering is preserved via sortable ids, the
      merge needn't be strongly consistent, and it doesn't restore write
      amplification.
    ref: concepts.md#news-feed-fanout-on-write-fanout-on-read-and-hybrid
  - id: design-feed-chat-notification-063
    difficulty: expert
    tags:
      - feature-store
      - streaming
      - ranking
      - modern
      - trade-offs
    question: |
      A feed team wants near-real-time engagement signals (likes, dwell) to
      influence ranking within seconds, without blowing the read latency budget.
      Which architecture fits best?
    options:
      - Recompute all engagement features synchronously inside each feed read request, scanning the raw
        like and dwell logs on the fly so every read reflects the absolute latest signal
      - Store engagement only in the primary OLTP database and run a multi-table JOIN across likes and
        dwell at read time to assemble each post's features on demand
      - Stream engagement events (Kafka/Flink) to update a low-latency feature store, which the read-time
        ranker queries for precomputed features
      - Batch-recompute the full feature set once per day in an offline job and serve yesterday's values
        to the ranker until the next nightly run completes
    answer: 2
    explanation: |
      Streaming engagement into a low-latency feature store lets the read-time ranker
      fetch fresh, precomputed features quickly, meeting both freshness and latency
      goals. Synchronous recompute blows the latency budget, OLTP JOINs at read time
      don't scale, and daily batch is far too stale for second-level signals.
    ref: concepts.md#feed-ranking-chronological-versus-machine-learned-relevance
  - id: design-feed-chat-notification-064
    difficulty: expert
    tags:
      - cdc
      - cqrs
      - fanout
      - modern
      - trade-offs
    question: |
      An event-driven feed design writes tweets to a store and uses change-data-
      capture (CDC) to drive fanout via a log (CQRS-style read models). What is the
      main benefit and the main cost of this pattern versus calling the fanout
      service inline from the write API?
    options:
      - 'Benefit: fully synchronous end-to-end consistency where every follower timeline reflects the
        write the instant the API returns; cost: no downside whatsoever compared to the inline call'
      - 'Benefit: it removes the need to durably store tweets at all because the CDC log becomes the sole
        copy; cost: materially higher read latency on every timeline fetch'
      - 'Benefit: it guarantees exactly-once fanout so no follower ever sees a duplicate insert; cost:
        the log path permanently loses the chronological ordering of posts'
      - 'Benefit: decoupled, replayable, ordered fanout and read models that can be rebuilt from the log;
        cost: added eventual-consistency lag and operational complexity of the streaming pipeline'
    answer: 3
    explanation: |
      CDC + log-driven fanout decouples write from fanout, gives ordered/replayable
      events and rebuildable read models (CQRS), at the cost of eventual-consistency
      lag and running a streaming pipeline. It is not synchronously consistent,
      doesn't remove tweet storage, and the log preserves (not loses) ordering.
    ref: concepts.md#news-feed-fanout-on-write-fanout-on-read-and-hybrid
  - id: design-feed-chat-notification-065
    difficulty: expert
    tags:
      - presence
      - pull-vs-push
      - scale
      - trade-offs
    question: |
      Facebook found presence one of its hardest scaling problems. For a user whose
      friend list is huge and mostly off-screen, which presence strategy scales, and
      what precisely is traded away?
    options:
      - Compute presence only for the subset of friends currently visible/in an open conversation (pull-on-view),
        trading a small amount of staleness for eliminating the O(friends) fan-out storm
      - Push every presence change to all friends the instant it happens; trade nothing away, since a
        larger friend list simply means the push reaches more people with no added cost
      - Persist every presence change durably to disk and re-query that row on each page load; trade
        read latency for the durability of a permanently recorded online/offline history
      - Broadcast presence updates over the same feed fanout pipeline used for posts; trade storage for
        freshness by materializing each status change into every friend's timeline
    answer: 0
    explanation: |
      Pulling presence only for the visible set (open conversations/on-screen
      friends) removes the O(friends) push storm, trading slight staleness for
      scalability. Pushing to all friends is the storm; durable presence wastes
      resources; routing presence through feed fanout is a category error.
    ref: concepts.md#online-presence
  - id: design-feed-chat-notification-066
    difficulty: expert
    tags:
      - group-receipts
      - scale
      - trade-offs
    question: |
      A product must support 100,000-member groups. Per-member read receipts are
      O(members) per message. Which decision is the most defensible at this scale?
    options:
      - Keep full per-member read receipts for every message even in 100,000-member groups; storage is
        cheap enough that the O(members) write and read amplification simply does not matter
      - Compute all per-member receipts synchronously on the sender's own device, having it poll each of
        the 100,000 members for their read state before displaying the aggregate
      - Aggregate or disable per-member receipts for very large groups (e.g., show only counts or nothing),
        because O(members) receipt writes/reads per message do not scale
      - Route every per-member read receipt through the notification system as a high-priority push, so
        the existing notification fanout absorbs the O(members) receipt traffic per message
    answer: 2
    explanation: |
      At 100K members, emitting and storing a receipt per member per message is
      prohibitive, so large groups aggregate (counts) or disable receipts. It is not
      merely a storage question (it's write/read amplification and delivery traffic);
      client-side computation and routing through notifications don't solve the
      fundamental O(members) cost.
    ref: concepts.md#delivery-and-read-receipts
  - id: design-feed-chat-notification-067
    difficulty: expert
    tags:
      - backpressure
      - async
      - feed
      - trade-offs
    question: |
      A subtle danger of moving feed fanout fully async (queue-based) is the loss of
      natural backpressure. What is the specific failure mode and mitigation?
    options:
      - There is no failure mode to worry about, because message queues have effectively infinite
        capacity and will buffer any write burst indefinitely without ever running out of room
      - The queue automatically enforces synchronous backpressure, blocking each writer inline the moment
        consumers fall behind, so producers can never outrun fanout in the first place
      - Async fanout guarantees the reader always sees the very latest tweet immediately, because moving
        fanout off the write path makes the read side strongly consistent by construction
      - You can accept far more writes than you can fan out; the queue silently grows and only surfaces
        via lag, so you must alarm on queue depth and apply backpressure or shed load
    answer: 3
    explanation: |
      Unlike a synchronous 503 that tells clients to slow down, a queue absorbs more
      than consumers can process and only reveals the problem via growing lag; you
      must monitor queue depth and apply explicit backpressure/shedding. Queues are
      not infinite, don't auto-block writers, and async fanout is not instantly
      fresh.
    ref: concepts.md#failure-modes-and-graceful-degradation
  - id: design-feed-chat-notification-068
    difficulty: expert
    tags:
      - multi-device
      - sync
      - chat
      - trade-offs
    question: |
      A chat user has phone, tablet, and web open simultaneously. What is the correct
      model for delivering and syncing messages across all their devices?
    options:
      - Deliver each message only to whichever single device was most recently active and ignore the
        phone, tablet, and web sessions that were not the last one to send or foreground
      - Treat each device as a separate endpoint with its own last-seen cursor; deliver/sync per device
        and reconcile read state across devices via high-water marks
      - Require the user to nominate one primary device up front that receives every message, with the
        other two devices left to display nothing until that primary forwards to them
      - Store no per-device cursor or state at all and instead have each device re-download the entire
        conversation history from scratch every single time the app is opened
    answer: 1
    explanation: |
      Multi-device requires per-device endpoints and cursors so each syncs what it
      missed, with read state reconciled via high-water marks across devices.
      Delivering to one device drops messages on others; forcing a primary device is
      poor UX; re-downloading all history every open is wasteful and doesn't track
      per-device state.
    ref: concepts.md#real-time-delivery-infrastructure
  - id: design-feed-chat-notification-069
    difficulty: expert
    tags:
      - notification-fanout
      - broadcast
      - hot-key
      - trade-offs
    question: |
      A "goal scored" event must notify 50M subscribers within seconds. Which fanout
      design best balances speed, provider limits, and reliability?
    options:
      - One worker iterates through all 50M subscribers sequentially and makes a separate synchronous
        provider call per user, waiting for each response before moving to the next recipient
      - Send all 50M notifications through a single shared provider connection, on the reasoning that one
        serialized pipe preserves a strict global delivery order across every subscriber
      - Fan out from the topic to sharded worker queues by userId, batch provider multicast calls, and
        apply per-provider rate limiting with backpressure
      - Store the notification once and have every one of the 50M users poll the server for it on an
        interval, so the provider is never called and its rate limits are never approached
    answer: 2
    explanation: |
      Sharding the fanout by userId across workers, using provider batch/multicast
      APIs, and rate-limiting per provider with backpressure delivers fast without
      overrunning APNs/FCM. A single synchronous worker is far too slow; one
      connection is a bottleneck; polling defeats the "within seconds" requirement.
    ref: concepts.md#notification-fanout-deduplication-and-rate-limiting
  - id: design-feed-chat-notification-070
    difficulty: expert
    tags:
      - end-to-end
      - celebrity
      - walkthrough
      - trade-offs
    question: |
      Trace what SHOULD happen when a user with 50M followers posts, in a
      well-designed hybrid system. Which sequence is correct?
    options:
      - Recognize the account exceeds the celebrity threshold, skip write-fanout, store the tweet in the
        author's own list/cache, and let followers merge it in at read time from the pulled celebrity
        set
      - Immediately insert the tweet into all 50M follower timelines at write time, then run the ranking
        model separately over each of the 50M materialized copies
      - Reject the post outright and return an error to the author, because 50M followers exceeds the
        maximum fanout capacity the write pipeline is provisioned to handle
      - Fan out synchronously to every follower and hold the author's post request open, blocking the
        response until all 50M timeline inserts have fully completed
    answer: 0
    explanation: |
      Above the threshold you avoid the 50M-insert storm entirely: store the tweet in
      the author's list/cache and let each follower's read merge in the celebrity's
      recent tweets (pulled). Write-fanout to 50M is the storm; rejecting the post is
      wrong; blocking on synchronous fanout would make the author wait indefinitely.
    ref: concepts.md#the-celebrity-hot-key-problem
