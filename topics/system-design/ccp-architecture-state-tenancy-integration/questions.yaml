topic: "Cloud Application Architectures: State, Multi-Tenancy & Integration"
domain: system-design
topic_slug: ccp-architecture-state-tenancy-integration
version: 1
questions:
  - id: ccp-architecture-state-tenancy-integration-001
    difficulty: beginner
    tags: [stateful-component, state, intent]
    question: |
      Which Cloud Computing Pattern addresses "How can application components that are
      scaled out maintain a synchronized internal state?"
    options: ["Stateful Component", "Stateless Component", "Shared Component", "Multi-Component Image"]
    answer: 0
    explanation: |
      The Stateful Component pattern targets scaled-out components that must keep a
      synchronized internal state so every instance presents unified behavior. The
      Stateless Component (its counterpart) instead externalizes state so instances are
      disposable.
    ref: "concepts.md#stateful-component"

  - id: ccp-architecture-state-tenancy-integration-002
    difficulty: beginner
    tags: [stateful-component, replication, solution]
    question: |
      What is the abstract solution mechanism of the Stateful Component pattern?
    options:
      - "Push all session data to an external Storage Offering so instances hold nothing"
      - "Replicate the internal state among all component instances so they behave consistently"
      - "Give each tenant its own dedicated instance so no internal state ever needs to be shared"
      - "Bundle several components into one virtual-server image so a single server can host them all"
    answer: 1
    explanation: |
      The Stateful Component replicates internal state across all instances so they
      present unified behavior. Externalizing all state to a store is the Stateless
      Component approach, not this pattern.
    ref: "concepts.md#stateful-component"

  - id: ccp-architecture-state-tenancy-integration-003
    difficulty: intermediate
    tags: [stateful-component, consistency, trade-offs]
    question: |
      A Stateful Component replicates a small amount of shared state and needs every
      instance to agree before acknowledging a change, accepting higher latency for
      safety. Which consistency model is it choosing?
    options: ["No consistency guarantee", "Eventual Consistency", "Strict Consistency", "Read-your-writes only"]
    answer: 2
    explanation: |
      Requiring all replicas to agree before acknowledging is Strict Consistency
      (synchronous, safer, slower). Eventual Consistency converges asynchronously and
      may read stale. Deep dive: cap-theorem-and-consistency.
    ref: "concepts.md#stateful-component"

  - id: ccp-architecture-state-tenancy-integration-004
    difficulty: intermediate
    tags: [stateful-component, best-practice, scaling]
    question: |
      Why does the Stateful Component pattern recommend keeping the replicated state
      minimal?
    options:
      - "Because replicating state costs bandwidth and coordination, which limits how far the component can scale out"
      - "Because cloud storage is billed strictly per gigabyte and replicated state doubles the bill"
      - "Because tenants are contractually forbidden from sharing large data sets across instances"
      - "Because virtual-server images enforce a fixed 10 GB ceiling on any in-memory state"
    answer: 0
    explanation: |
      Every added byte of replicated state and every tightening of consistency increases
      the coordination cost and caps scale-out. Minimal shared state (e.g., a small
      config) keeps replication tractable; large state should be externalized instead.
    ref: "concepts.md#stateful-component"

  - id: ccp-architecture-state-tenancy-integration-005
    difficulty: intermediate
    tags: [stateful-component, modern, examples]
    question: |
      Which modern technologies are the clearest illustration of the Stateful Component
      pattern's peer state replication?
    options:
      - "ALB, NLB, and Azure Load Balancer distributing traffic across stateless backends"
      - "S3, EBS, and EFS storage offerings holding the externalized session data"
      - "OPA and AWS Lake Formation enforcing centralized policy across component peers"
      - "Hazelcast, Apache Ignite, and Akka Cluster sharding in-memory data grids"
    answer: 3
    explanation: |
      In-memory data grids / clustered actors (Hazelcast, Ignite, Redis Cluster, Akka
      Cluster) replicate state across peer instances — the Stateful Component shape.
      Load balancers and object storage are unrelated mechanisms.
    ref: "concepts.md#stateful-component"

  - id: ccp-architecture-state-tenancy-integration-006
    difficulty: advanced
    tags: [stateful-component, stateless, selection]
    question: |
      Your compute tier must scale elastically to thousands of instances with large
      per-user session data. Which design does the pattern language favor, and why?
    options:
      - "Stateful Component replicating all session data to every instance, so any node can serve any user consistently"
      - "Stateless Component with session state externalized to a Storage Offering, because replicating large state across many instances does not scale"
      - "Dedicated Component per user, giving each user physically isolated compute for their session"
      - "Multi-Component Image bundling the session store into the compute image to raise server utilization"
    answer: 1
    explanation: |
      Large state across many instances makes peer replication (Stateful Component)
      unscalable. The language prefers making the tier stateless and pushing state to a
      shared store; reserve Stateful Component for small hot shared state.
    ref: "concepts.md#stateful-component"

  - id: ccp-architecture-state-tenancy-integration-007
    difficulty: beginner
    tags: [multi-component-image, intent]
    question: |
      Which pattern answers "How can a virtual server provide the functionality of
      multiple application components so it can be used flexibly?"
    options: ["Multi-Component Image", "Shared Component", "Dedicated Component", "Elastic Infrastructure"]
    answer: 0
    explanation: |
      Multi-Component Image bundles several components (optionally with middleware) into
      one virtual-server image so a running server can be repurposed for any of them
      without new provisioning.
    ref: "concepts.md#multi-component-image"

  - id: ccp-architecture-state-tenancy-integration-008
    difficulty: intermediate
    tags: [multi-component-image, problem, utilization]
    question: |
      What problem primarily motivates the Multi-Component Image pattern?
    options:
      - "Mutually distrusting tenants that refuse to share any component instance"
      - "Data residency laws forbidding a full replica of records in a foreign region"
      - "Firewalls blocking all inbound access to a restricted hosting environment"
      - "Hosting only one component per server, which underutilizes the server"
    answer: 3
    explanation: |
      A strict one-component-per-server mapping wastes capacity. Multi-Component Image
      consolidates components onto one image/server to raise utilization and enable
      flexible repurposing.
    ref: "concepts.md#multi-component-image"

  - id: ccp-architecture-state-tenancy-integration-009
    difficulty: intermediate
    tags: [multi-component-image, trade-offs]
    question: |
      What is the main trade-off of packaging multiple components into a single image?
    options:
      - "It weakens data isolation between tenants because they now share one storage volume"
      - "It couples the components' lifecycles, so they cannot be scaled or patched independently and share a larger blast radius"
      - "It forces synchronous replication of state across every co-located component in the image"
      - "It requires routing all traffic through a third-party integration provider to work"
    answer: 1
    explanation: |
      Consolidation raises utilization but couples lifecycle: you can't scale/patch one
      component without the others, and a bad deploy has a larger blast radius. Single-
      purpose images keep components independent.
    ref: "concepts.md#multi-component-image"

  - id: ccp-architecture-state-tenancy-integration-010
    difficulty: intermediate
    tags: [multi-component-image, modern, kubernetes]
    question: |
      Which modern construct is a fair illustration of the Multi-Component Image pattern?
    options:
      - "A Kubernetes multi-container/sidecar Pod or a golden VM image carrying several co-located services"
      - "A one-process-per-container immutable image built for a single dedicated workload"
      - "An EventBridge cross-account event bus relaying messages between separate environments"
      - "PostgreSQL row-level security enforcing per-tenant data separation in one table"
    answer: 0
    explanation: |
      Multi-container Pods/sidecars and fat golden images co-locate multiple components
      in one unit — the Multi-Component Image shape. One-process-per-container is the
      single-purpose counterpoint.
    ref: "concepts.md#multi-component-image"

  - id: ccp-architecture-state-tenancy-integration-011
    difficulty: advanced
    tags: [multi-component-image, selection]
    question: |
      Two components must each scale and be patched independently and must fail without
      taking the other down. Which choice aligns with the pattern language?
    options:
      - "Multi-Component Image bundling both components together to maximize server utilization"
      - "Dedicated Component per tenant so each customer gets a physically isolated deployment"
      - "Stateful Component replication keeping both components' internal state synchronized"
      - "Single-purpose images/containers (one component each), because independent scaling and failure isolation outweigh density"
    answer: 3
    explanation: |
      When independent scaling/patching and failure isolation matter, prefer single-
      purpose images over Multi-Component Image; the latter couples lifecycles and
      enlarges blast radius.
    ref: "concepts.md#multi-component-image"

  - id: ccp-architecture-state-tenancy-integration-012
    difficulty: beginner
    tags: [shared-component, intent, multi-tenancy]
    question: |
      Which pattern answers "How can an application component be shared between multiple
      tenants while still allowing some individual configuration?"
    options: ["Dedicated Component", "Tenant-isolated Component", "Shared Component", "Restricted Data Access Component"]
    answer: 2
    explanation: |
      The Shared Component serves all tenants from one instance with equal functionality
      and only lightweight per-tenant configuration — the cheapest, highest-density point
      on the tenancy dial.
    ref: "concepts.md#shared-component"

  - id: ccp-architecture-state-tenancy-integration-013
    difficulty: intermediate
    tags: [shared-component, isolation, trade-offs]
    question: |
      Which statement best captures the Shared Component's position on the tenancy dial?
    options:
      - "Cheapest and highest density, but weakest isolation (a noisy or hostile tenant can affect others)"
      - "Strongest isolation and highest cost per tenant, since each gets its own instance"
      - "Logical per-tenant isolation with quotas and data separation inside a shared instance"
      - "Physical, per-tenant instances that fully separate every tenant's compute and data"
    answer: 0
    explanation: |
      Shared Component maximizes efficiency and density but offers no performance/data
      isolation, so noisy-neighbor and cross-tenant leakage risks are highest.
    ref: "concepts.md#shared-component"

  - id: ccp-architecture-state-tenancy-integration-014
    difficulty: intermediate
    tags: [shared-component, modern, examples]
    question: |
      Which is the clearest modern illustration of a Shared Component with individual
      configuration?
    options:
      - "A per-tenant database instance provisioned separately for each customer's data"
      - "A dedicated VPC per customer giving every tenant an isolated network boundary"
      - "A single stateless service tier serving all customers, using feature-flag/config services (e.g., LaunchDarkly, AppConfig) for per-tenant behavior"
      - "MirrorMaker 2 bridging two Kafka clusters to relay messages between environments"
    answer: 2
    explanation: |
      One shared instance for all tenants, with configuration supplied by feature-flag or
      config services, is the Shared Component. Per-tenant DBs/VPCs are Dedicated
      Components; MirrorMaker is a Message Mover.
    ref: "concepts.md#shared-component"

  - id: ccp-architecture-state-tenancy-integration-015
    difficulty: advanced
    tags: [shared-component, selection, scenario]
    question: |
      A SaaS offers a stateless formatting utility with identical behavior for every
      customer, no sensitive data, and cost sensitivity is high. Which tenancy pattern
      fits best?
    options:
      - "Dedicated Component"
      - "Tenant-isolated Component"
      - "Shared Component"
      - "Compliant Data Replication"
    answer: 2
    explanation: |
      Uniform functionality, no sensitive data, and cost pressure point straight to the
      Shared Component — one instance for all tenants at the lowest per-tenant cost.
    ref: "concepts.md#shared-component"

  - id: ccp-architecture-state-tenancy-integration-016
    difficulty: beginner
    tags: [tenant-isolated-component, intent]
    question: |
      Which pattern enables sharing a component between tenants while providing isolation
      of performance, data volume, and access privileges?
    options: ["Shared Component", "Multi-Component Image", "Dedicated Component", "Tenant-isolated Component"]
    answer: 3
    explanation: |
      The Tenant-isolated Component shares one instance but builds in access isolation,
      performance isolation, and data separation so each tenant behaves as if alone.
    ref: "concepts.md#tenant-isolated-component"

  - id: ccp-architecture-state-tenancy-integration-017
    difficulty: intermediate
    tags: [tenant-isolated-component, controls, solution]
    question: |
      The Tenant-isolated Component enforces isolation through which three controls?
    options:
      - "Encryption at rest, payload compression, and edge caching of responses"
      - "Access isolation, performance isolation (quotas/throttling), and data separation"
      - "State replication, horizontal sharding, and secondary indexing of tenant data"
      - "Egress filtering, ingress enriching, and recording of transformations applied"
    answer: 1
    explanation: |
      Isolation is built into the component across the stack via controlling tenant
      access, allocating/limiting performance, and separating stored data. Filter/enrich/
      record is the Compliant Data Replication shape.
    ref: "concepts.md#tenant-isolated-component"

  - id: ccp-architecture-state-tenancy-integration-018
    difficulty: intermediate
    tags: [tenant-isolated-component, modern, examples]
    question: |
      Which modern technique best illustrates a Tenant-isolated Component?
    options:
      - "PostgreSQL row-level security or separate schemas per tenant in one instance, plus per-tenant API rate limits"
      - "One shared table with no tenant column, letting every tenant read all rows freely"
      - "A separate database instance per tenant, giving each customer physically isolated storage"
      - "An outbound reverse tunnel exposing a private component through a restricted firewall"
    answer: 0
    explanation: |
      Logical per-tenant isolation within one instance (RLS, per-tenant schemas, per-
      tenant quotas/throttles) is the Tenant-isolated Component. A separate instance per
      tenant is a Dedicated Component.
    ref: "concepts.md#tenant-isolated-component"

  - id: ccp-architecture-state-tenancy-integration-019
    difficulty: advanced
    tags: [tenant-isolated-component, trade-offs, risk]
    question: |
      What is the key risk that distinguishes a Tenant-isolated Component from a
      Dedicated Component?
    options:
      - "It is more costly per tenant than every other option, because each tenant is permanently assigned its own physical server"
      - "Its isolation is only as strong as the enforcing code/config, so a logic bug can leak data across tenants"
      - "It cannot support any per-tenant configuration, forcing every tenant to run with byte-for-byte identical settings and quotas"
      - "It requires routing all tenant traffic through a third-party integration provider before any request can be served"
    answer: 1
    explanation: |
      Because tenants share the instance and isolation is logical, a code or config
      defect can breach it. A Dedicated Component gives physical separation and removes
      that shared-instance risk (at higher cost).
    ref: "concepts.md#tenant-isolated-component"

  - id: ccp-architecture-state-tenancy-integration-020
    difficulty: advanced
    tags: [tenant-isolated-component, selection, scenario]
    question: |
      A B2B SaaS has many mutually distrusting tenants but per-tenant hardware is
      uneconomical, and each tenant expects to feel like the only user. Which pattern
      fits best?
    options:
      - "Shared Component"
      - "Dedicated Component for every tenant"
      - "Integration Provider"
      - "Tenant-isolated Component"
    answer: 3
    explanation: |
      Distrust + the "feel like the only tenant" expectation + cost pressure against
      dedicated hardware is exactly the Tenant-isolated Component's sweet spot: logical
      isolation within a shared instance.
    ref: "concepts.md#tenant-isolated-component"

  - id: ccp-architecture-state-tenancy-integration-021
    difficulty: beginner
    tags: [dedicated-component, intent]
    question: |
      Which pattern answers "How can application components that cannot be shared be
      integrated into a multi-tenant application?"
    options: ["Shared Component", "Tenant-isolated Component", "Dedicated Component", "Application Component Proxy"]
    answer: 2
    explanation: |
      The Dedicated Component provisions the non-shareable component exclusively per
      tenant while the rest of the app keeps using shared/tenant-isolated components.
    ref: "concepts.md#dedicated-component"

  - id: ccp-architecture-state-tenancy-integration-022
    difficulty: intermediate
    tags: [dedicated-component, isolation, cost]
    question: |
      On the tenancy dial, where does the Dedicated Component sit?
    options:
      - "Weakest isolation, cheapest, one shared instance for all tenants"
      - "Logical isolation at middle cost, tenants sharing one guarded instance"
      - "Strongest (physical) isolation, priciest, lowest density"
      - "No isolation at all, highest density, all tenants on one process"
    answer: 2
    explanation: |
      Each tenant gets its own instance — the strongest isolation but the most expensive,
      lowest-density option; cost scales roughly linearly with tenant count.
    ref: "concepts.md#dedicated-component"

  - id: ccp-architecture-state-tenancy-integration-023
    difficulty: intermediate
    tags: [dedicated-component, modern, examples]
    question: |
      Which modern setups illustrate the Dedicated Component pattern?
    options:
      - "A single shared table keyed by a tenant_id column that every tenant's rows live in together"
      - "A feature-flag service toggling per-tenant behavior inside one instance shared by all customers"
      - "A message enricher that re-adds fields stripped during cross-region replication of records"
      - "Per-tenant database instance, per-tenant namespace/cluster, or single-tenant VPC/account per customer"
    answer: 3
    explanation: |
      Per-tenant DB instances, namespaces/clusters, or VPC/account-per-tenant are
      Dedicated Components (silo model). A shared table with tenant_id is a Shared/
      Tenant-isolated approach.
    ref: "concepts.md#dedicated-component"

  - id: ccp-architecture-state-tenancy-integration-024
    difficulty: advanced
    tags: [dedicated-component, selection, mixing]
    question: |
      A regulated enterprise tenant requires its records physically separated, but the
      rest of your tenants are cost-sensitive and share fine. What does the pattern
      language recommend?
    options:
      - "Make the entire application a Dedicated Component per tenant"
      - "Use a Dedicated Component only for the sensitive part, keeping shared/tenant-isolated components for the rest"
      - "Use a Shared Component for everyone and rely on at-rest encryption alone to satisfy the separation requirement"
      - "Replace the whole application with an Integration Provider so a third party owns all tenant data"
    answer: 1
    explanation: |
      Real systems mix the dial per layer: dedicate only the non-shareable/regulated
      component and keep the rest shared or tenant-isolated to preserve density and cost.
    ref: "concepts.md#dedicated-component"

  - id: ccp-architecture-state-tenancy-integration-025
    difficulty: advanced
    tags: [tenancy, siblings, distinction]
    question: |
      Order the three tenancy patterns from weakest/cheapest isolation to
      strongest/priciest.
    options:
      - "Dedicated → Tenant-isolated → Shared"
      - "Tenant-isolated → Shared → Dedicated"
      - "Shared → Tenant-isolated → Dedicated"
      - "Shared → Dedicated → Tenant-isolated"
    answer: 2
    explanation: |
      Shared (one instance for all, weakest isolation, cheapest) → Tenant-isolated
      (logical isolation, middle) → Dedicated (per-tenant instance, physical isolation,
      priciest).
    ref: "concepts.md#dedicated-component"

  - id: ccp-architecture-state-tenancy-integration-026
    difficulty: beginner
    tags: [restricted-data-access-component, intent]
    question: |
      Which pattern answers "How can an application component alter the data it provides
      based on access restrictions imposed by different environments?"
    options:
      - "Restricted Data Access Component"
      - "Compliant Data Replication"
      - "Dedicated Component"
      - "Application Component Proxy"
    answer: 0
    explanation: |
      The Restricted Data Access Component interprets per-element rules and deletes or
      obfuscates disallowed data at request time, adapting the response to the
      environment's restrictions.
    ref: "concepts.md#restricted-data-access-component"

  - id: ccp-architecture-state-tenancy-integration-027
    difficulty: intermediate
    tags: [restricted-data-access-component, solution]
    question: |
      How does a Restricted Data Access Component enforce environment-specific data
      rules?
    options:
      - "By replicating data asynchronously between environments, filtering fields on egress and re-enriching them on ingress"
      - "By provisioning each environment its own dedicated instance so the disallowed data never physically arrives there"
      - "By opening an outbound tunnel from the restricted environment so a proxy can relay only permitted calls inward"
      - "By associating storage rules/privileges with individual data elements and deleting or obfuscating disallowed portions on every access"
    answer: 3
    explanation: |
      It attaches rules to individual data elements and transforms the payload (delete/
      obfuscate) at request time. The filter+enricher replication flow is Compliant Data
      Replication.
    ref: "concepts.md#restricted-data-access-component"

  - id: ccp-architecture-state-tenancy-integration-028
    difficulty: advanced
    tags: [restricted-data-access-component, distinction, authz]
    question: |
      How does a Restricted Data Access Component differ from ordinary authorization?
    options:
      - "It transforms the returned payload (masking/removing fields) per element rather than only permitting or denying the whole request"
      - "It merely allows or denies access to an endpoint as a whole, returning either the complete record or a 403 with nothing in between"
      - "It replicates the full data set to another region on a fixed schedule so distant environments can serve low-latency reads"
      - "It bundles multiple application components into one virtual-server image to raise utilization of the underlying host"
    answer: 0
    explanation: |
      Plain authz permits or denies. The Restricted Data Access Component modifies the
      data itself per element (mask/remove) based on the environment, so the same logical
      data is exposed at different fidelity.
    ref: "concepts.md#restricted-data-access-component"

  - id: ccp-architecture-state-tenancy-integration-029
    difficulty: intermediate
    tags: [restricted-data-access-component, modern]
    question: |
      Which modern capability best illustrates the Restricted Data Access Component?
    options:
      - "Kafka MirrorMaker 2 mirroring topics from a source cluster to a destination cluster in another environment"
      - "A load balancer with sticky sessions pinning each client to the same backend instance for its whole session"
      - "Dynamic data masking / column-level security (e.g., Snowflake masking, BigQuery column-level security, Lake Formation cell filters)"
      - "A golden AMI carrying multiple co-located services so one launched server can be repurposed for any of them"
    answer: 2
    explanation: |
      Dynamic data masking and column/cell-level security transform query results based
      on who/where is asking — the Restricted Data Access Component in practice.
    ref: "concepts.md#restricted-data-access-component"

  - id: ccp-architecture-state-tenancy-integration-030
    difficulty: beginner
    tags: [message-mover, intent, integration]
    question: |
      Which pattern answers "How can message queues of different providers be integrated
      without impact on the application components using them?"
    options: ["Integration Provider", "Application Component Proxy", "Shared Component", "Message Mover"]
    answer: 3
    explanation: |
      The Message Mover receives messages from a source queue and forwards them to a
      queue in another environment, so components keep using their local queues
      unchanged.
    ref: "concepts.md#message-mover"

  - id: ccp-architecture-state-tenancy-integration-031
    difficulty: intermediate
    tags: [message-mover, solution]
    question: |
      What does a Message Mover actually do?
    options:
      - "Duplicates a restricted component's interface in an open environment to form an outbound-connected proxy"
      - "Relays messages by receiving them from one queue and transferring them to a queue in another environment"
      - "Masks or removes fields in a query response per element based on the environment issuing the request"
      - "Hosts shared messaging and shared data as a neutral third-party integration service both parties reach"
    answer: 1
    explanation: |
      A Message Mover bridges brokers/environments by pulling from a source queue and
      forwarding to a destination queue. Interface duplication is the Application
      Component Proxy; hosted middleware is the Integration Provider.
    ref: "concepts.md#message-mover"

  - id: ccp-architecture-state-tenancy-integration-032
    difficulty: intermediate
    tags: [message-mover, modern, examples]
    question: |
      Which of these are clear illustrations of the Message Mover pattern?
    options:
      - "PostgreSQL row-level security and column masking that filter each tenant's view inside one shared instance"
      - "Per-tenant VPCs that give every customer a physically isolated network and compute boundary"
      - "Feature-flag services toggling per-tenant behavior within a single shared application instance"
      - "Kafka MirrorMaker 2, EventBridge cross-region/cross-account buses, or an SQS-to-SQS relay"
    answer: 3
    explanation: |
      MirrorMaker 2, cross-region/account event buses, and queue-to-queue relays copy
      messages between brokers/environments — Message Movers.
    ref: "concepts.md#message-mover"

  - id: ccp-architecture-state-tenancy-integration-033
    difficulty: advanced
    tags: [message-mover, trade-offs, delivery]
    question: |
      What operational concern must a Message Mover handle carefully?
    options:
      - "Delivery semantics and ordering (e.g., at-least-once relaying can produce duplicates) plus being an extra hop and potential bottleneck"
      - "Per-tenant billing and metering, so each customer is charged accurately for the exact number of messages it relays"
      - "Row-level security policies that decide which tenant may read which individual rows of the message payload"
      - "Virtual-server image size limits that cap how many co-located components a single relay image may bundle"
    answer: 0
    explanation: |
      As an extra hop between brokers, a Message Mover adds latency, can be a bottleneck/
      SPOF, and must manage delivery semantics (at-least-once → duplicates) and ordering.
      Deep dive: message-queues-and-async.
    ref: "concepts.md#message-mover"

  - id: ccp-architecture-state-tenancy-integration-034
    difficulty: beginner
    tags: [application-component-proxy, intent]
    question: |
      Which pattern answers "How can an application component be accessed if direct
      access to its hosting environment is restricted?"
    options:
      - "Application Component Proxy"
      - "Message Mover"
      - "Integration Provider"
      - "Restricted Data Access Component"
    answer: 0
    explanation: |
      The Application Component Proxy duplicates the restricted component's interface in
      the unrestricted environment; the restricted side initiates and maintains an
      outbound connection to it.
    ref: "concepts.md#application-component-proxy"

  - id: ccp-architecture-state-tenancy-integration-035
    difficulty: advanced
    tags: [application-component-proxy, solution, firewall]
    question: |
      In the Application Component Proxy pattern, which side initiates the connection,
      and why?
    options:
      - "The unrestricted side, because it has more spare capacity and can open an inbound port through the restricted firewall on demand"
      - "A neutral third-party provider initiates and brokers the connection on behalf of both environments so neither side dials out itself"
      - "Whichever side currently owns the message queue, since the queue's broker is what physically establishes the link between them"
      - "The restricted side initiates and maintains the connection outward, because it may reach the unrestricted environment while no inbound hole is opened on the restricted side"
    answer: 3
    explanation: |
      Since firewalls block inbound to the restricted environment, the restricted side
      establishes and holds an outbound link to the proxy in the open environment, which
      relays calls back in — no inbound port is opened.
    ref: "concepts.md#application-component-proxy"

  - id: ccp-architecture-state-tenancy-integration-036
    difficulty: intermediate
    tags: [application-component-proxy, modern]
    question: |
      Which modern tools illustrate the Application Component Proxy's outbound-established
      access?
    options:
      - "S3 and EFS storage offerings holding the restricted component's externalized session data for any node to read"
      - "AWS Systems Manager Session Manager, Azure Relay/Hybrid Connections, Cloudflare Tunnel, or ngrok/frp reverse tunnels"
      - "LaunchDarkly feature flags toggling per-environment behavior inside a single shared component instance"
      - "Debezium change-data-capture streaming row-level changes out of the restricted database into another region"
    answer: 1
    explanation: |
      Reverse-tunnel / outbound-only connectivity tools (Session Manager, Azure Relay,
      Cloudflare Tunnel, ngrok, frp) expose a private component without opening inbound
      firewall ports — the Application Component Proxy shape.
    ref: "concepts.md#application-component-proxy"

  - id: ccp-architecture-state-tenancy-integration-037
    difficulty: advanced
    tags: [application-component-proxy, selection, scenario]
    question: |
      An on-prem service behind a firewall must be callable from your public cloud
      components, but security forbids opening any inbound port on-prem. Which pattern
      fits?
    options:
      - "Message Mover (bridging calls onto a queue polled from inside the firewall)"
      - "Dedicated Component (a per-tenant instance placed inside the restricted network)"
      - "Application Component Proxy (outbound-established from the restricted side)"
      - "Compliant Data Replication (filtering fields as they cross the firewall)"
    answer: 2
    explanation: |
      Exposing a restricted component with no inbound holes, via an outbound-initiated
      link, is exactly the Application Component Proxy.
    ref: "concepts.md#application-component-proxy"

  - id: ccp-architecture-state-tenancy-integration-038
    difficulty: beginner
    tags: [compliant-data-replication, intent]
    question: |
      Which pattern answers "How can data be replicated between environments if some
      environments may only handle a subset of the data due to laws and corporate
      regulations?"
    options:
      - "Compliant Data Replication"
      - "Restricted Data Access Component"
      - "Message Mover"
      - "Stateful Component"
    answer: 0
    explanation: |
      Compliant Data Replication replicates asynchronously via messaging while filtering
      out disallowed data on egress and enriching updates on ingress, so each environment
      holds only its permitted view.
    ref: "concepts.md#compliant-data-replication"

  - id: ccp-architecture-state-tenancy-integration-039
    difficulty: intermediate
    tags: [compliant-data-replication, solution, filter-enricher]
    question: |
      What is the distinctive filter/enricher mechanism of Compliant Data Replication?
    options:
      - "A load balancer that hashes each write by primary key and fans it out evenly across every environment's replica set"
      - "Duplicating the component's public interface as an outbound-connected proxy so restricted callers reach it without an inbound port"
      - "A message filter deletes/obfuscates disallowed elements as messages leave the trusted environment, and a message enricher re-adds removed data as updates re-enter the secure environment (using recorded transformations)"
      - "Replicating the full record set synchronously to every environment and relying on at-rest encryption to satisfy the regulation"
    answer: 2
    explanation: |
      On egress a filter strips/obfuscates disallowed fields; the transformations are
      recorded; on ingress an enricher restores them so bidirectional updates reconcile.
      That filter+enricher pair is its signature.
    ref: "concepts.md#compliant-data-replication"

  - id: ccp-architecture-state-tenancy-integration-040
    difficulty: advanced
    tags: [compliant-data-replication, distinction, siblings]
    question: |
      How does Compliant Data Replication differ from a Restricted Data Access Component?
    options:
      - "They are the same pattern under two names, one used on-prem and the other in the public cloud"
      - "Compliant Data Replication transforms data at replication time (egress/ingress across environments); the Restricted Data Access Component transforms it at request time within an environment"
      - "Compliant Data Replication merely allows or denies the whole transfer, while the Restricted Data Access Component is the one that masks individual fields"
      - "Compliant Data Replication mandates a neutral third-party integration provider in the path, whereas the Restricted Data Access Component never uses messaging"
    answer: 1
    explanation: |
      Both control what data an environment sees, but Compliant Data Replication acts on
      the replication stream (filter on egress, enrich on ingress), while the Restricted
      Data Access Component transforms responses per request.
    ref: "concepts.md#compliant-data-replication"

  - id: ccp-architecture-state-tenancy-integration-041
    difficulty: intermediate
    tags: [compliant-data-replication, modern]
    question: |
      Which modern pipeline best illustrates Compliant Data Replication?
    options:
      - "Debezium CDC with transforms that mask/drop PII columns on egress, plus egress tokenization reversed by a vault on ingress"
      - "A reverse SSH tunnel that exposes a firewalled database to an external region over one outbound-established connection"
      - "A Kubernetes multi-container Pod that co-locates the database and its replication agent in one image for higher utilization"
      - "A shared feature-flag service toggling which fields each region's read replica is allowed to display at query time"
    answer: 0
    explanation: |
      CDC pipelines that mask/drop sensitive fields on egress and restore them on ingress
      (via a vault/mapping) implement the filter+enricher shape of Compliant Data
      Replication.
    ref: "concepts.md#compliant-data-replication"

  - id: ccp-architecture-state-tenancy-integration-042
    difficulty: advanced
    tags: [compliant-data-replication, selection, residency]
    question: |
      Data residency law forbids storing a full copy of certain fields in a foreign
      region, but you still need low-latency regional reads of the rest. Which pattern
      applies?
    options:
      - "Dedicated Component (a separate full-copy instance provisioned per foreign region)"
      - "Multi-Component Image (bundling the regional cache and app into one server image)"
      - "Tenant-isolated Component (logical per-region partitions inside one global instance)"
      - "Compliant Data Replication"
    answer: 3
    explanation: |
      Replicating a legally permitted subset (filtering restricted fields on egress,
      enriching on ingress) for regional performance is Compliant Data Replication. Deep
      dive on residency: multi-tenancy-and-saas-isolation.
    ref: "concepts.md#compliant-data-replication"

  - id: ccp-architecture-state-tenancy-integration-043
    difficulty: beginner
    tags: [integration-provider, intent]
    question: |
      Which pattern answers "How can components in different environments, possibly across
      different companies, be integrated through a third-party provider?"
    options:
      - "Message Mover"
      - "Application Component Proxy"
      - "Integration Provider"
      - "Shared Component"
    answer: 2
    explanation: |
      The Integration Provider has components communicate through integration components
      (messaging, shared data) offered by a neutral third party that both environments
      may reach.
    ref: "concepts.md#integration-provider"

  - id: ccp-architecture-state-tenancy-integration-044
    difficulty: intermediate
    tags: [integration-provider, solution, modern]
    question: |
      Which of these is the clearest illustration of the Integration Provider pattern?
    options:
      - "A self-hosted queue-to-queue relay you deploy and operate on your own brokers in both environments"
      - "An iPaaS or hosted broker consumed as a service (e.g., MuleSoft Anypoint, Dell Boomi, Azure Logic Apps, Confluent Cloud, EventBridge partner buses)"
      - "PostgreSQL row-level security policies that partition each partner's rows within one shared integration table"
      - "A reverse tunnel from an on-prem service that opens one outbound link so the cloud can call inward"
    answer: 1
    explanation: |
      The Integration Provider is integration-as-a-service from a third party (iPaaS/
      hosted broker). A self-hosted relay is a Message Mover; a reverse tunnel is an
      Application Component Proxy.
    ref: "concepts.md#integration-provider"

  - id: ccp-architecture-state-tenancy-integration-045
    difficulty: advanced
    tags: [integration-provider, trade-offs]
    question: |
      What is the principal trade-off of choosing an Integration Provider?
    options:
      - "It couples every integrated component's lifecycle into one virtual-server image that must be patched together"
      - "It forces synchronous replication of internal state to all component instances before any message is acknowledged"
      - "It places a third party in the data path, introducing trust, compliance, cost, availability-dependency, and lock-in concerns"
      - "It weakens per-tenant data separation by routing all tenants through one shared logical instance"
    answer: 2
    explanation: |
      Offloading integration to a neutral third party removes the need for direct links
      but puts an external party in the data path — with trust, compliance, cost,
      availability, and lock-in implications.
    ref: "concepts.md#integration-provider"

  - id: ccp-architecture-state-tenancy-integration-046
    difficulty: advanced
    tags: [integration-provider, message-mover, distinction]
    question: |
      Two companies cannot open any direct network link and neither wants to operate the
      integration infrastructure. Which pattern fits better than a self-run Message
      Mover?
    options:
      - "Application Component Proxy (each side stands up an outbound-connected proxy for the other)"
      - "Integration Provider (a neutral third party hosts the messaging/shared data)"
      - "Dedicated Component (each company runs a private per-partner instance of the integration)"
      - "Stateful Component (both companies replicate the shared integration state between them)"
    answer: 1
    explanation: |
      When neither party will host the integration and direct links are impossible, a
      neutral third-party Integration Provider fits; a Message Mover assumes you operate
      the relay yourself.
    ref: "concepts.md#integration-provider"

  - id: ccp-architecture-state-tenancy-integration-047
    difficulty: advanced
    tags: [integration, siblings, distinction]
    question: |
      Match the integration need to the pattern: expose ONE restricted component with the
      connection opened outbound from the restricted side.
    options:
      - "Message Mover"
      - "Integration Provider"
      - "Application Component Proxy"
      - "Compliant Data Replication"
    answer: 2
    explanation: |
      Exposing a single restricted component via an outbound-initiated link is the
      Application Component Proxy. Message Mover relays between queues; Integration
      Provider is third-party integration-as-a-service.
    ref: "concepts.md#application-component-proxy"

  - id: ccp-architecture-state-tenancy-integration-048
    difficulty: intermediate
    tags: [integration, siblings, distinction]
    question: |
      Which statement correctly distinguishes the three integration patterns?
    options:
      - "Message Mover = you run a relay between brokers; Application Component Proxy = expose a restricted component via an outbound link; Integration Provider = a third party hosts the messaging/shared data"
      - "All three fundamentally require a neutral third-party provider sitting in the data path between the two environments"
      - "They differ only in which cloud vendor operates them, not in mechanism, so the choice is purely a procurement decision"
      - "Message Mover and Integration Provider both work by duplicating a component's interface as an outbound-connected proxy"
    answer: 0
    explanation: |
      Self-run broker relay (Message Mover), outbound-established exposure of a restricted
      component (Application Component Proxy), and third-party integration-as-a-service
      (Integration Provider) are three distinct mechanisms.
    ref: "concepts.md#integration-provider"

  - id: ccp-architecture-state-tenancy-integration-049
    difficulty: intermediate
    tags: [state, stateful-component, distinction]
    question: |
      Which statement about Stateful vs Stateless Components is correct?
    options:
      - "Stateless Components replicate their internal state across every instance to keep all nodes byte-for-byte identical"
      - "Stateful Components hold and replicate internal state across instances, while Stateless Components externalize state so instances are disposable"
      - "Both patterns forbid using an external Storage Offering and must keep all mutable data in process memory"
      - "Stateful Components are always cheaper to scale out to thousands of nodes than Stateless ones are"
    answer: 1
    explanation: |
      The distinction is where mutable state lives: replicated in the instances (Stateful)
      versus externalized so instances are interchangeable/disposable (Stateless). Large
      state favors the stateless approach for scale.
    ref: "concepts.md#stateful-component"

  - id: ccp-architecture-state-tenancy-integration-050
    difficulty: advanced
    tags: [tenancy, selection, scenario]
    question: |
      A SaaS wants to share most of the stack but must guarantee that one tenant's heavy
      load cannot degrade another's performance, without paying for dedicated hardware
      per tenant. Which pattern is the primary fit?
    options:
      - "Shared Component (one instance for all, relying on autoscaling to absorb any tenant's spikes)"
      - "Dedicated Component (a separate instance per tenant so loads can never collide)"
      - "Tenant-isolated Component"
      - "Integration Provider (a third party throttles each tenant's traffic before it reaches you)"
    answer: 2
    explanation: |
      Guaranteeing performance isolation within a shared instance (via quotas/throttling)
      while avoiding per-tenant hardware is the Tenant-isolated Component. Shared gives no
      isolation; Dedicated pays for per-tenant hardware.
    ref: "concepts.md#tenant-isolated-component"
