topic: "AWS Cloud Design Patterns: Operation and Maintenance"
domain: system-design
topic_slug: aws-cdp-operation-and-maintenance
version: 1
questions:
  - id: aws-cdp-operation-and-maintenance-001
    difficulty: beginner
    tags: [bootstrap, intent, user-data]
    question: |
      In the CDP catalog, which Operation and Maintenance pattern solves
      "automatic acquisition of startup settings" — configuring a server from
      a script the first time it boots?
    options: ["Cloud DI Pattern", "Stack Deployment Pattern", "Bootstrap Pattern", "Server Swapping Pattern"]
    answer: 2
    explanation: |
      The Bootstrap Pattern keeps the AMI thin and generic and has the instance
      fetch current software/config and configure itself at first boot. Its modern
      realization is EC2 user-data + cloud-init in a launch template.
    ref: "concepts.md#bootstrap-pattern"
  - id: aws-cdp-operation-and-maintenance-002
    difficulty: beginner
    tags: [bootstrap, modern-mapping, cloud-init]
    question: |
      The Bootstrap Pattern is realized today on AWS primarily by which mechanism?
    options: ["AWS CloudFormation change sets", "S3 lifecycle policies", "Route 53 weighted routing", "EC2 user-data executed by cloud-init on first boot"]
    answer: 3
    explanation: |
      A user-data script attached to the launch template is run by cloud-init on
      first boot, installing packages and pulling config — exactly the Bootstrap
      intent. CloudFormation is Stack Deployment; Route 53 is Weighted Transition;
      S3 lifecycle is Web Storage Archive.
    ref: "concepts.md#bootstrap-pattern"
  - id: aws-cdp-operation-and-maintenance-003
    difficulty: intermediate
    tags: [bootstrap, golden-ami, trade-offs]
    question: |
      Why do most teams pair a "golden AMI" with a thin bootstrap script rather
      than pulling everything at boot?
    options: ["Because user-data cannot install packages", "Because golden AMIs remove the need for an Auto Scaling group", "Because baking slow, stable layers into the AMI keeps launches fast and consistent while only fast-changing bits are pulled at boot", "Because cloud-init only runs on Windows instances"]
    answer: 2
    explanation: |
      Pure bootstrap (everything at boot) maximizes freshness but slows launch and
      adds a runtime dependency on the repo — bad for scale-out. Baking stable
      layers (OS, agents, runtime) into a golden AMI with Image Builder and pulling
      only volatile bits balances speed and freshness.
    ref: "concepts.md#bootstrap-pattern"
  - id: aws-cdp-operation-and-maintenance-004
    difficulty: intermediate
    type: multi
    tags: [bootstrap, multi, scale-out]
    question: |
      Which statements about the Bootstrap Pattern and its modern AWS form are TRUE?
      Select all that apply.
    options: ["In an Auto Scaling group, every new instance runs the same user-data, so the fleet self-heals to a known state", "Long compile-from-source steps in user-data can become a scale-out bottleneck", "Pulling everything at boot removes any runtime dependency on the config repository", "user-data scripts should be idempotent"]
    answers: [0, 1, 3]
    explanation: |
      ASG instances share the launch template's user-data (self-healing); slow boot
      steps hurt scale-out; and user-data should be idempotent. The false option is
      the third: pulling everything at boot ADDS a runtime dependency on the repo
      being available, it does not remove it.
    ref: "concepts.md#bootstrap-pattern"
  - id: aws-cdp-operation-and-maintenance-005
    difficulty: intermediate
    tags: [cloud-di, intent]
    question: |
      The Cloud DI Pattern addresses "external placement of parts that are
      frequently updated." What is its core idea?
    options: ["Bake the app version and config into the AMI so the image is self-contained", "Keep volatile config/secrets outside the image and inject them at launch, keying which config by tag or name", "Replicate the database to a read replica for scaling", "Archive cold data to Glacier on a schedule"]
    answer: 1
    explanation: |
      Cloud DI (Cloud Dependency Injection) externalizes the frequently-changing
      parts so one generic image is reusable across environments; the specifics are
      injected at launch. Baking them in is the anti-pattern it fixes.
    ref: "concepts.md#cloud-di-pattern"
  - id: aws-cdp-operation-and-maintenance-006
    difficulty: intermediate
    type: multi
    tags: [cloud-di, secrets, modern-mapping, multi]
    question: |
      Which modern AWS services realize the Cloud DI Pattern's "inject config
      externally" intent? Select all that apply.
    options: ["SSM Parameter Store for configuration values", "AWS Secrets Manager for credentials with rotation", "AWS AppConfig for validated, gradually-rolled config and flags", "Amazon Glacier Deep Archive for storing runtime config"]
    answers: [0, 1, 2]
    explanation: |
      Parameter Store (config), Secrets Manager (secrets + rotation), and AppConfig
      (validated feature flags/config) all externalize and inject configuration.
      Glacier Deep Archive is cold object archival, not a config source.
    ref: "concepts.md#cloud-di-pattern"
  - id: aws-cdp-operation-and-maintenance-007
    difficulty: advanced
    tags: [cloud-di, secrets, best-practice]
    question: |
      Following Cloud DI, where should database credentials be injected from,
      rather than baked into the image?
    options: ["Plain instance tags", "The user-data script in clear text", "AWS Secrets Manager, with an instance role scoped to read only that secret", "An S3 bucket with public read access"]
    answer: 2
    explanation: |
      Secrets belong in Secrets Manager (KMS-encrypted, rotatable), read via a
      least-privilege instance role. Tags and user-data are visible/clear-text and
      unsuitable for secrets; a public S3 bucket is a leak.
    ref: "concepts.md#cloud-di-pattern"
  - id: aws-cdp-operation-and-maintenance-008
    difficulty: intermediate
    tags: [stack-deployment, intent, iac]
    question: |
      Which pattern's intent is "creating a template for setting up groups of
      servers" so an entire environment is reproducible?
    options: ["Bootstrap Pattern", "Hybrid Backup Pattern", "Monitoring Integration Pattern", "Stack Deployment Pattern"]
    answer: 3
    explanation: |
      Stack Deployment describes the whole environment (VPC, LB, servers, DB) in one
      declarative template and provisions it consistently — the catalog's tool was
      CloudFormation, today usually authored with the CDK.
    ref: "concepts.md#stack-deployment-pattern"
  - id: aws-cdp-operation-and-maintenance-009
    difficulty: beginner
    tags: [stack-deployment, modern-mapping]
    question: |
      The Stack Deployment Pattern maps most directly to which modern AWS practice?
    options: ["Weighted round-robin DNS", "Manually clicking through the EC2 console for each resource", "Detaching and re-attaching EBS volumes", "Infrastructure as Code with CloudFormation or the AWS CDK"]
    answer: 3
    explanation: |
      Stack Deployment became Infrastructure as Code: version-controlled
      CloudFormation/CDK (or Terraform) templates that provision the whole stack
      reproducibly. It is a CDP pattern that was fully absorbed and remains best
      practice.
    ref: "concepts.md#stack-deployment-pattern"
  - id: aws-cdp-operation-and-maintenance-010
    difficulty: advanced
    type: multi
    tags: [stack-deployment, multi-region, dr, multi]
    question: |
      Which capabilities of modern CloudFormation/CDK support the Stack Deployment
      intent at scale? Select all that apply.
    options: ["Change sets to preview modifications before applying", "StackSets to roll out stacks across many accounts and regions", "Drift detection to find out-of-band resource changes", "Automatically choosing S3 storage classes for archival data"]
    answers: [0, 1, 2]
    explanation: |
      Change sets (preview), StackSets (multi-account/region), and drift detection
      are all IaC features supporting reproducible environments. Choosing S3 storage
      classes is the Web Storage Archive concern (lifecycle policies), not stack
      deployment.
    ref: "concepts.md#stack-deployment-pattern"
  - id: aws-cdp-operation-and-maintenance-011
    difficulty: intermediate
    tags: [stack-deployment, dr]
    question: |
      Why is the Stack Deployment Pattern foundational to disaster recovery?
    options: ["It compresses backups before upload", "It shifts DNS weights automatically after a failure", "A version-controlled template lets you re-create the identical environment in another region on demand", "It rotates database credentials"]
    answer: 2
    explanation: |
      Because the whole environment is declared in a template, DR can re-deploy the
      same stack in a second region, giving reproducible recovery. The other options
      describe backup, Weighted Transition, and secrets rotation.
    ref: "concepts.md#stack-deployment-pattern"
  - id: aws-cdp-operation-and-maintenance-012
    difficulty: intermediate
    tags: [server-swapping, intent]
    question: |
      The Server Swapping Pattern keeps a service recoverable by doing what when an
      instance fails?
    options: ["Rebuilding the server from scratch and restoring data from tape", "Transitioning cold data to Glacier", "Increasing the Route 53 weight on the failed endpoint", "Detaching the data volume from the failed instance and attaching it to a fresh instance"]
    answer: 3
    explanation: |
      Server Swapping keeps state on a separate EBS data volume; on failure the
      volume is detached from the dead instance and attached to a replacement, which
      resumes without a full data restore. The server is disposable, the volume
      portable.
    ref: "concepts.md#server-swapping-pattern"
  - id: aws-cdp-operation-and-maintenance-013
    difficulty: advanced
    type: multi
    tags: [server-swapping, modern-mapping, multi]
    question: |
      Which modern AWS approaches replace or update the classic Server Swapping
      Pattern? Select all that apply.
    options: ["Immutable replace: an ASG terminates the failed instance and launches a fresh one from the launch template", "Externalizing state to EFS or S3 so any instance can access it without a swap", "Re-attaching an ENI or Elastic IP to preserve address/identity", "Enabling S3 Object Lock on the boot volume"]
    answers: [0, 1, 2]
    explanation: |
      Immutable replace via ASG, externalized shared state (EFS/S3), and ENI/EIP
      re-attach for identity are the modern equivalents. S3 Object Lock is WORM
      governance for objects and does not apply to a boot volume.
    ref: "concepts.md#server-swapping-pattern"
  - id: aws-cdp-operation-and-maintenance-014
    difficulty: advanced
    tags: [server-swapping, ebs, gotcha]
    question: |
      What is a key limitation of the classic EBS detach/attach form of Server
      Swapping?
    options: ["EBS volumes cannot store databases", "Detaching a volume deletes its data", "An EBS volume lives in a single AZ, so the swap is confined to that AZ and does not protect against volume loss", "Only Windows instances support volume attach"]
    answer: 2
    explanation: |
      An EBS volume is AZ-scoped, so the replacement instance must be in the same AZ,
      and if the volume itself is lost the data is gone. That is why externalized
      state (EFS/S3/RDS) plus immutable replace is preferred where feasible.
    ref: "concepts.md#server-swapping-pattern"
  - id: aws-cdp-operation-and-maintenance-015
    difficulty: intermediate
    tags: [server-swapping, still-relevant]
    question: |
      When is the classic Server Swapping (keep the EBS data volume, replace the
      compute) still a reasonable choice today?
    options: ["For stateless web servers behind an ALB", "For recovering a single stateful legacy node whose data lives on an EBS volume", "For gradually shifting traffic to a new version", "For archiving logs cheaply"]
    answer: 1
    explanation: |
      Volume swap shines for a single stateful node (e.g., a legacy DB on EBS) you
      want to recover fast without re-copying data. Stateless servers just use
      immutable replace; the other options are Weighted Transition and Web Storage
      Archive.
    ref: "concepts.md#server-swapping-pattern"
  - id: aws-cdp-operation-and-maintenance-016
    difficulty: intermediate
    tags: [monitoring-integration, intent]
    question: |
      The Monitoring Integration Pattern's intent — "centralization of monitoring
      tools" — is best summarized as what?
    options: ["Configuring monitoring manually on each host after launch", "Building monitoring into the deployment so instances auto-register with a central system as they launch", "Storing metrics on a per-instance local disk", "Turning off monitoring for scaled instances to save cost"]
    answer: 1
    explanation: |
      The pattern makes monitoring a first-class part of provisioning: the agent is
      installed at bootstrap/AMI time and instances auto-register centrally, so
      coverage tracks the fleet as it scales.
    ref: "concepts.md#monitoring-integration-pattern"
  - id: aws-cdp-operation-and-maintenance-017
    difficulty: intermediate
    tags: [monitoring-integration, modern-mapping]
    question: |
      Which service is the central system that realizes the Monitoring Integration
      Pattern on AWS today?
    options: ["Amazon CloudWatch", "Amazon Route 53", "AWS Storage Gateway", "Amazon S3 Glacier"]
    answer: 0
    explanation: |
      CloudWatch (agent for metrics/logs, alarms, dashboards, Logs/Metrics Insights)
      is the central monitoring system; the CloudWatch agent is installed at deploy
      time via user-data or SSM. The others are DNS, hybrid backup, and archival.
    ref: "concepts.md#monitoring-integration-pattern"
  - id: aws-cdp-operation-and-maintenance-018
    difficulty: advanced
    type: multi
    tags: [monitoring-integration, iac, multi]
    question: |
      Which practices reflect a modern Monitoring Integration approach on AWS?
      Select all that apply.
    options: ["Install the CloudWatch agent via user-data or SSM Distributor/State Manager", "Define alarms and dashboards as code in the same CloudFormation/CDK stack", "Alarm on symptoms such as latency and error rate, not only host up/down", "Manually add each new instance to the monitoring console after it boots"]
    answers: [0, 1, 2]
    explanation: |
      Agent-at-deploy, alarms/dashboards as code, and symptom-based alarms are the
      modern approach. Manually registering each instance is exactly the fragile,
      drift-prone practice the pattern eliminates.
    ref: "concepts.md#monitoring-integration-pattern"
  - id: aws-cdp-operation-and-maintenance-019
    difficulty: beginner
    tags: [web-storage-archive, intent]
    question: |
      The Web Storage Archive Pattern addresses which problem?
    options: ["Injecting config at launch", "Splitting traffic between versions", "Recovering a failed server's identity", "Archiving large volumes of rarely-accessed data cheaply in internet storage"]
    answer: 3
    explanation: |
      Web Storage Archive moves large, cold datasets off expensive block/DB storage
      into durable, low-cost object storage (S3), treating it as the archive tier.
    ref: "concepts.md#web-storage-archive-pattern"
  - id: aws-cdp-operation-and-maintenance-020
    difficulty: intermediate
    tags: [web-storage-archive, modern-mapping, lifecycle]
    question: |
      Which modern AWS feature most directly realizes the Web Storage Archive Pattern?
    options: ["S3 lifecycle policies transitioning objects to Glacier and Deep Archive as they age", "Route 53 health checks", "EBS Multi-Attach", "CloudFormation change sets"]
    answer: 0
    explanation: |
      S3 lifecycle policies automatically tier aging objects Standard -> IA ->
      Glacier -> Deep Archive (and expire them), which is precisely the archive
      intent. The others are DNS, block storage, and IaC features.
    ref: "concepts.md#web-storage-archive-pattern"
  - id: aws-cdp-operation-and-maintenance-021
    difficulty: advanced
    type: multi
    tags: [web-storage-archive, storage-classes, multi]
    question: |
      Which statements about S3 storage classes for the Web Storage Archive Pattern
      are TRUE? Select all that apply.
    options: ["Glacier Deep Archive is the cheapest tier but has the slowest retrieval", "Colder tiers add retrieval fees and minimum storage duration charges", "S3 Intelligent-Tiering can move objects between access tiers automatically based on usage", "Standard-IA has lower per-GB cost than Deep Archive"]
    answers: [0, 1, 2]
    explanation: |
      Deep Archive is cheapest/slowest; colder tiers add retrieval fees and
      early-delete/minimum-duration charges; Intelligent-Tiering automates tier moves.
      The false option reverses cost: Deep Archive is CHEAPER per GB than Standard-IA.
    ref: "concepts.md#web-storage-archive-pattern"
  - id: aws-cdp-operation-and-maintenance-022
    difficulty: intermediate
    tags: [web-storage-archive, intelligent-tiering]
    question: |
      For a dataset whose access pattern is unpredictable, which S3 option best fits
      the Web Storage Archive intent while avoiding retrieval-fee surprises on tier
      moves?
    options: ["S3 One Zone-IA", "Glacier Flexible Retrieval only", "S3 Intelligent-Tiering", "S3 Standard with no lifecycle rules"]
    answer: 2
    explanation: |
      Intelligent-Tiering automatically shifts objects between access tiers based on
      usage with no retrieval fees for those moves — ideal when the access pattern is
      unknown. Fixed cold tiers risk retrieval fees; plain Standard forgoes savings.
    ref: "concepts.md#web-storage-archive-pattern"
  - id: aws-cdp-operation-and-maintenance-023
    difficulty: intermediate
    tags: [weighted-transition, intent]
    question: |
      The Weighted Transition Pattern enables what?
    options: ["A big-bang instant cutover to a new version", "Gradually shifting a percentage of traffic from an old system to a new one, raising the weight as it proves healthy", "Archiving logs to Glacier", "Injecting secrets at boot"]
    answer: 1
    explanation: |
      Weighted Transition points the service name at both old and new endpoints and
      uses weighted routing to shift traffic gradually (and roll back by lowering the
      weight), avoiding a risky big-bang cutover.
    ref: "concepts.md#weighted-transition-pattern"
  - id: aws-cdp-operation-and-maintenance-024
    difficulty: intermediate
    tags: [weighted-transition, modern-mapping, route53]
    question: |
      The classic "weighted round-robin DNS" mechanism of Weighted Transition maps
      to which AWS feature?
    options: ["Amazon Route 53 weighted routing", "S3 lifecycle transitions", "AWS Backup copy jobs", "EBS snapshots"]
    answer: 0
    explanation: |
      Route 53 weighted routing assigns weights across record sets to split traffic
      at the DNS layer, the direct modern equivalent of weighted round-robin DNS.
      The others are archival, backup, and snapshots.
    ref: "concepts.md#weighted-transition-pattern"
  - id: aws-cdp-operation-and-maintenance-025
    difficulty: advanced
    tags: [weighted-transition, dns-ttl, gotcha]
    question: |
      What is the main drawback of doing Weighted Transition purely at the DNS layer?
    options: ["DNS cannot resolve multiple records", "Weighted DNS requires an on-prem load balancer", "Route 53 does not support health checks", "DNS caching / TTL means clients do not switch promptly, so shifts and rollbacks are slow and coarse"]
    answer: 3
    explanation: |
      Because resolvers and clients cache DNS answers for the TTL, weight changes and
      rollbacks propagate slowly and imprecisely. Request-level shifting (ALB target
      groups, CodeDeploy, Lambda aliases) is faster and finer-grained.
    ref: "concepts.md#weighted-transition-pattern"
  - id: aws-cdp-operation-and-maintenance-026
    difficulty: advanced
    type: multi
    tags: [weighted-transition, canary, multi]
    question: |
      Which modern AWS mechanisms can perform gradual/canary traffic shifting for an
      in-stack version rollout (finer than DNS)? Select all that apply.
    options: ["AWS CodeDeploy blue/green shifting ALB target groups", "Lambda alias weighted routing across function versions", "ALB weighted target groups for request-level splitting", "Glacier Deep Archive retrieval tiers"]
    answers: [0, 1, 2]
    explanation: |
      CodeDeploy (ALB target-group shift), Lambda alias weights, and ALB weighted
      target groups all shift traffic at the request layer without DNS TTL lag.
      Glacier retrieval tiers are unrelated to traffic shifting.
    ref: "concepts.md#weighted-transition-pattern"
  - id: aws-cdp-operation-and-maintenance-027
    difficulty: advanced
    tags: [weighted-transition, still-relevant]
    question: |
      When is DNS-based Weighted Transition (Route 53 weighted routing) still the
      right tool over ALB/CodeDeploy shifting?
    options: ["When splitting requests within a single ALB", "When rotating secrets", "When shifting traffic across endpoints that only share a DNS name — e.g., two regions or two independent stacks", "When choosing an S3 storage class"]
    answer: 2
    explanation: |
      DNS weighting is endpoint-agnostic, so it fits cutovers across separate stacks,
      regions, or clouds that share only a name. For in-stack rollouts behind one
      load balancer, request-level shifting is better.
    ref: "concepts.md#weighted-transition-pattern"
  - id: aws-cdp-operation-and-maintenance-028
    difficulty: beginner
    tags: [hybrid-backup, intent]
    question: |
      The Hybrid Backup Pattern is about what?
    options: ["Backing up on-premises data to cloud storage instead of local disk or tape", "Deploying a whole stack from a template", "Injecting config at launch", "Splitting traffic between two versions"]
    answer: 0
    explanation: |
      Hybrid Backup keeps workloads on-prem but sends backups to durable, low-cost
      cloud storage (S3), replacing tape rotation and off-site vaulting.
    ref: "concepts.md#hybrid-backup-pattern"
  - id: aws-cdp-operation-and-maintenance-029
    difficulty: intermediate
    tags: [hybrid-backup, modern-mapping, storage-gateway]
    question: |
      Which AWS service is the purpose-built bridge for the Hybrid Backup Pattern,
      including a virtual tape library that plugs into existing backup software?
    options: ["AWS Storage Gateway (Tape Gateway)", "Amazon Route 53", "AWS AppConfig", "Amazon EFS"]
    answer: 0
    explanation: |
      Storage Gateway's Tape Gateway (VTL) presents a virtual tape library backed by
      S3/Glacier, a drop-in tape replacement; Volume and File Gateways cover block and
      file. Route 53, AppConfig, and EFS are unrelated to hybrid backup.
    ref: "concepts.md#hybrid-backup-pattern"
  - id: aws-cdp-operation-and-maintenance-030
    difficulty: advanced
    type: multi
    tags: [hybrid-backup, multi, services]
    question: |
      Which AWS services/features support the Hybrid Backup Pattern? Select all that
      apply.
    options: ["AWS Storage Gateway (Tape/Volume/File)", "AWS Backup for centralized schedules and retention policies", "AWS DataSync for fast bulk transfer of file data into S3/EFS/FSx", "Amazon Route 53 weighted routing for backup traffic"]
    answers: [0, 1, 2]
    explanation: |
      Storage Gateway bridges on-prem to S3; AWS Backup centralizes scheduling and
      retention; DataSync moves bulk file data efficiently. Route 53 weighted routing
      is a traffic-shifting tool (Weighted Transition), not a backup mechanism.
    ref: "concepts.md#hybrid-backup-pattern"
  - id: aws-cdp-operation-and-maintenance-031
    difficulty: advanced
    tags: [hybrid-backup, dr, distinction]
    question: |
      Why is Hybrid Backup NOT the same as a full disaster-recovery solution?
    options: ["Because it cannot encrypt data", "Because durable off-site backup still lacks the recovery compute, orchestration, and RTO/RPO targets that DR requires", "Because S3 is not durable enough for backups", "Because backups must always go to tape"]
    answer: 1
    explanation: |
      Hybrid Backup gives durable, off-site copies but recovery still needs standby
      compute, orchestration, and defined RTO/RPO. DR builds on backup with those
      recovery capabilities.
    ref: "concepts.md#hybrid-backup-pattern"
  - id: aws-cdp-operation-and-maintenance-032
    difficulty: intermediate
    tags: [hybrid-backup, connectivity]
    question: |
      Which connectivity options provide a private, bandwidth-stable link for moving
      hybrid backups into AWS?
    options: ["Public S3 REST endpoint only", "Route 53 alias records", "AWS Direct Connect or Site-to-Site VPN", "CloudFront distributions"]
    answer: 2
    explanation: |
      Direct Connect (dedicated) or Site-to-Site VPN provides the private, stable
      link for hybrid backup transfer. CloudFront and Route 53 are edge/DNS services,
      not backup transport.
    ref: "concepts.md#hybrid-backup-pattern"
  - id: aws-cdp-operation-and-maintenance-033
    difficulty: intermediate
    tags: [selection, bootstrap, cloud-di]
    question: |
      A team bakes the OS and agents into an AMI but wants the app's DB endpoint and
      feature flags to change without rebuilding the image. Which pattern captures
      the "keep those volatile parts external and inject them" idea?
    options: ["Bootstrap Pattern", "Cloud DI Pattern", "Stack Deployment Pattern", "Web Storage Archive Pattern"]
    answer: 1
    explanation: |
      Externalizing the frequently-updated parts (endpoint, flags) and injecting them
      at launch is Cloud DI. Bootstrap covers first-boot self-configuration broadly;
      the volatile-parts-external emphasis is specifically Cloud DI.
    ref: "concepts.md#cloud-di-pattern"
  - id: aws-cdp-operation-and-maintenance-034
    difficulty: intermediate
    tags: [selection, monitoring-integration]
    question: |
      New autoscaled instances keep launching without alarms, and terminated ones
      leave stale alarms behind. Which pattern directly addresses this?
    options: ["Weighted Transition Pattern", "Monitoring Integration Pattern", "Server Swapping Pattern", "Hybrid Backup Pattern"]
    answer: 1
    explanation: |
      Monitoring Integration builds monitoring into the deploy so coverage tracks the
      fleet automatically as instances come and go — the fix for drifted, per-host
      manual monitoring.
    ref: "concepts.md#monitoring-integration-pattern"
  - id: aws-cdp-operation-and-maintenance-035
    difficulty: intermediate
    tags: [selection, stack-deployment]
    question: |
      An architect must stand up an identical VPC + ALB + ASG + RDS environment in a
      second region for DR, reproducibly. Which pattern applies?
    options: ["Server Swapping Pattern", "Cloud DI Pattern", "Web Storage Archive Pattern", "Stack Deployment Pattern"]
    answer: 3
    explanation: |
      Describing the whole environment in one IaC template (CloudFormation/CDK) and
      deploying it in another region is Stack Deployment — the basis of reproducible
      DR environments.
    ref: "concepts.md#stack-deployment-pattern"
  - id: aws-cdp-operation-and-maintenance-036
    difficulty: intermediate
    tags: [selection, weighted-transition]
    question: |
      You want to send 5% of production traffic to a new service version, watch error
      rates, then ramp to 100% — with quick rollback. Which pattern is this?
    options: ["Weighted Transition Pattern", "Bootstrap Pattern", "Hybrid Backup Pattern", "Monitoring Integration Pattern"]
    answer: 0
    explanation: |
      Gradual, weight-controlled traffic shift with easy rollback is Weighted
      Transition, realized today by Route 53 weighted routing or (finer) ALB/CodeDeploy/
      Lambda-alias canary shifting.
    ref: "concepts.md#weighted-transition-pattern"
  - id: aws-cdp-operation-and-maintenance-037
    difficulty: intermediate
    tags: [selection, web-storage-archive]
    question: |
      Seven years of audit logs sit on expensive EBS volumes and are almost never
      read but must be retained. Which pattern and service fit best?
    options: ["Server Swapping with EBS Multi-Attach", "Cloud DI with Secrets Manager", "Weighted Transition with Route 53", "Web Storage Archive with S3 lifecycle to Glacier Deep Archive"]
    answer: 3
    explanation: |
      Cold, rarely-read, long-retention data belongs in S3 with lifecycle
      transitions to Glacier Deep Archive — the Web Storage Archive pattern. The
      others address recovery, traffic shifting, and config injection.
    ref: "concepts.md#web-storage-archive-pattern"
  - id: aws-cdp-operation-and-maintenance-038
    difficulty: advanced
    tags: [selection, server-swapping]
    question: |
      A legacy single-node database on an EC2 instance fails, but its data volume is
      intact. You need the fastest recovery without restoring from backup. Which
      classic pattern applies?
    options: ["Web Storage Archive Pattern", "Server Swapping Pattern", "Stack Deployment Pattern", "Weighted Transition Pattern"]
    answer: 1
    explanation: |
      Detach the intact EBS data volume from the failed instance and attach it to a
      fresh one in the same AZ — Server Swapping — which recovers without re-copying
      data.
    ref: "concepts.md#server-swapping-pattern"
  - id: aws-cdp-operation-and-maintenance-039
    difficulty: advanced
    type: multi
    tags: [cross-pattern, iac, multi]
    question: |
      Which Operation and Maintenance patterns are largely "just Infrastructure as
      Code and managed services now" on modern AWS? Select all that apply.
    options: ["Stack Deployment (CloudFormation/CDK)", "Bootstrap (launch templates + user-data/cloud-init)", "Monitoring Integration (CloudWatch agent + alarms as code)", "Server Swapping (still the mainstream default for stateless fleets)"]
    answers: [0, 1, 2]
    explanation: |
      Stack Deployment, Bootstrap, and Monitoring Integration were absorbed into IaC,
      launch templates, and CloudWatch-as-code. Server Swapping is NOT the mainstream
      default for stateless fleets — those use immutable replace with externalized
      state; volume swap persists only for legacy single-node stateful recovery.
    ref: "concepts.md#monitoring-integration-pattern"
  - id: aws-cdp-operation-and-maintenance-040
    difficulty: intermediate
    tags: [bootstrap, cloud-di, distinction]
    question: |
      What best distinguishes the Bootstrap Pattern from the Cloud DI Pattern?
    options: ["Bootstrap is about first-boot self-configuration in general; Cloud DI specifically externalizes the frequently-updated parts and injects them", "They are identical patterns with different names", "Bootstrap injects secrets; Cloud DI installs the OS", "Cloud DI runs only on Windows; Bootstrap only on Linux"]
    answer: 0
    explanation: |
      Bootstrap covers configuring an instance at first boot (thin AMI + pull config).
      Cloud DI narrows in on keeping the volatile parts external and injecting them so
      one image is reusable across environments.
    ref: "concepts.md#cloud-di-pattern"
  - id: aws-cdp-operation-and-maintenance-041
    difficulty: advanced
    tags: [weighted-transition, health-checks]
    question: |
      Which addition makes a Route 53 weighted transition safer by removing an
      unhealthy target automatically?
    options: ["Route 53 health checks associated with the record sets", "S3 Object Lock", "EBS snapshots", "AppConfig deployment strategies"]
    answer: 0
    explanation: |
      Route 53 health checks can detect an unhealthy endpoint and stop routing to it,
      complementing weighted routing during a transition. The others are storage/config
      features unrelated to DNS failover.
    ref: "concepts.md#weighted-transition-pattern"
  - id: aws-cdp-operation-and-maintenance-042
    difficulty: advanced
    tags: [hybrid-backup, restore, gotcha]
    question: |
      In a Hybrid Backup design, what most directly bounds how fast you can restore
      on-prem from the cloud?
    options: ["The number of S3 buckets used", "The AMI size", "Your link bandwidth and the retrieval time of the chosen S3/Glacier tier", "The Route 53 TTL"]
    answer: 2
    explanation: |
      Restore speed is limited by available bandwidth (VPN/Direct Connect/internet)
      and by the retrieval latency of the storage tier (Glacier/Deep Archive can take
      hours). Bucket count, AMI size, and DNS TTL are irrelevant to restore time.
    ref: "concepts.md#hybrid-backup-pattern"
  - id: aws-cdp-operation-and-maintenance-043
    difficulty: intermediate
    tags: [monitoring-integration, tracing]
    question: |
      Beyond metrics and logs in CloudWatch, which AWS service extends Monitoring
      Integration to distributed request tracing?
    options: ["AWS X-Ray", "AWS Storage Gateway", "Amazon Route 53", "AWS DataSync"]
    answer: 0
    explanation: |
      X-Ray provides distributed tracing across services, complementing CloudWatch
      metrics/logs for observability wired in at deploy time. The others are backup,
      DNS, and transfer services.
    ref: "concepts.md#monitoring-integration-pattern"
  - id: aws-cdp-operation-and-maintenance-044
    difficulty: advanced
    type: multi
    tags: [server-swapping, ebs-multi-attach, multi]
    question: |
      Which statements about preserving state/identity when replacing a server on AWS
      are TRUE? Select all that apply.
    options: ["EBS Multi-Attach (io1/io2) can allow clustered access from multiple instances where the workload supports it", "EFS lets any instance mount shared data so no swap is needed", "An Elastic IP or ENI can be re-attached to preserve the address", "An EBS volume can be attached to instances in any AZ simultaneously by default"]
    answers: [0, 1, 2]
    explanation: |
      Multi-Attach (cluster-aware workloads), EFS shared mounts, and ENI/EIP
      re-attach all help. The false claim is the last: an EBS volume is AZ-scoped and
      cannot span AZs; Multi-Attach is within one AZ and requires a cluster-aware
      filesystem.
    ref: "concepts.md#server-swapping-pattern"
  - id: aws-cdp-operation-and-maintenance-045
    difficulty: intermediate
    tags: [cloud-di, twelve-factor]
    question: |
      The Cloud DI Pattern anticipates which widely-cited application principle?
    options: ["Use a single shared credential across all environments", "Always compile code at boot time", "Keep all state on the local disk", "Store config in the environment, not in the built artifact"]
    answer: 3
    explanation: |
      Cloud DI is the twelve-factor "config in the environment" idea: one immutable
      artifact, per-environment behavior injected externally (Parameter Store/Secrets
      Manager/AppConfig, env vars).
    ref: "concepts.md#cloud-di-pattern"
  - id: aws-cdp-operation-and-maintenance-046
    difficulty: advanced
    type: multi
    tags: [web-storage-archive, governance, multi]
    question: |
      Which S3 capabilities help govern archived data under the Web Storage Archive
      Pattern? Select all that apply.
    options: ["S3 Object Lock for WORM (write-once-read-many) retention", "S3 Versioning to retain prior object versions", "S3 Storage Lens for storage visibility and analytics", "Route 53 weighted routing for archive access"]
    answers: [0, 1, 2]
    explanation: |
      Object Lock (WORM), Versioning, and Storage Lens (visibility) all support
      governed archival. Route 53 weighted routing is a traffic-shifting feature
      unrelated to archive governance.
    ref: "concepts.md#web-storage-archive-pattern"
  - id: aws-cdp-operation-and-maintenance-047
    difficulty: beginner
    tags: [stack-deployment, cdk]
    question: |
      Which statement about authoring Stack Deployment templates today is accurate?
    options: ["CloudFormation templates can only be written by hand in JSON", "The AWS CDK lets you author infrastructure in a programming language that synthesizes to CloudFormation", "IaC has been deprecated in favor of console clicks", "Terraform cannot provision AWS resources"]
    answer: 1
    explanation: |
      The CDK compiles real code (TypeScript, Python, etc.) into CloudFormation,
      making complex stacks easier to author. Terraform also provisions AWS; IaC is
      the standard, not deprecated.
    ref: "concepts.md#stack-deployment-pattern"
  - id: aws-cdp-operation-and-maintenance-048
    difficulty: advanced
    type: multi
    tags: [cross-pattern, selection, multi]
    question: |
      Match modern realizations to the correct Operation and Maintenance pattern:
      which of the following pairings are CORRECT? Select all that apply.
    options: ["S3 lifecycle to Deep Archive -> Web Storage Archive Pattern", "Route 53 weighted routing / CodeDeploy canary -> Weighted Transition Pattern", "Storage Gateway + AWS Backup -> Hybrid Backup Pattern", "SSM Parameter Store -> Stack Deployment Pattern"]
    answers: [0, 1, 2]
    explanation: |
      Lifecycle-to-Glacier is Web Storage Archive; weighted routing/canary is Weighted
      Transition; Storage Gateway + AWS Backup is Hybrid Backup. The wrong pairing is
      the last: Parameter Store realizes Cloud DI (config injection), not Stack
      Deployment (which is CloudFormation/CDK).
    ref: "concepts.md#cloud-di-pattern"
