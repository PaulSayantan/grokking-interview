  - id: ccp-composite-hybrid-040
    difficulty: advanced
    tags: [scenario, selection, hybrid-development-environment]
    question: |
      A team wants disposable, scalable environments to run load tests against many
      OS/browser combinations, but keeps production in a hardened private data center.
      Which pattern is this?
    options:
      - "Hybrid Processing (bursting compute components)"
      - "Hybrid Data (relocating the active dataset)"
      - "Hybrid Backup (periodic off-site archival)"
      - "Hybrid Development Environment"
    answer: 3
    explanation: |
      Matching lifecycle stages to environments — elastic, varied, disposable dev/test
      plus hardened static production — is Hybrid Development Environment.
    ref: "concepts.md#hybrid-development-environment"

  - id: ccp-composite-hybrid-041
    difficulty: intermediate
    tags: [hybrid-application-functions, clustering, mechanism]
    question: |
      In Hybrid Application Functions, how are components decided into their
      environments?
    options:
      - "Randomly assigned to whichever environment has spare capacity at deploy time, purely to spread cost evenly across the two halves"
      - "By a rigid rule that forces all UI into the cloud and all data on-prem with no exceptions, ignoring each component's actual workload or trust needs"
      - "Clustered by shared requirements (workload shape, residency, trust), then each cluster placed in the environment that best fits it, with dependencies minimized via async messaging"
      - "By alphabetical order of component name, so the placement is deterministic and reproducible across every redeployment of the application"
    answer: 2
    explanation: |
      Components are grouped by shared requirements and each cluster is placed where it
      fits best; cross-cluster dependencies are minimized and data is exchanged
      asynchronously to preserve loose coupling.
    ref: "concepts.md#hybrid-application-functions"

  - id: ccp-composite-hybrid-042
    difficulty: advanced
    tags: [scenario, distinction, hybrid-user-interface, hybrid-application-functions]
    question: |
      An application has a spiky public UI AND separate compliance rules forcing its
      billing-data component to stay on-prem while other data scales in the cloud, plus
      analytics jobs that burst. A single specialized pattern won't capture all of this.
      Which pattern best frames the overall design?
    options:
      - "Hybrid User Interface alone, since the spiky public UI is the only force that matters and the billing-residency and analytics-burst constraints can be ignored"
      - "Hybrid Backup, because retaining periodic off-site copies of the billing data satisfies the compliance rule and no other split is really needed"
      - "Hybrid Multimedia Web Application, because a public-facing site is involved and its assets should be offloaded to an elastic delivery-optimized environment"
      - "Hybrid Application Functions, coordinating multiple per-cluster placements (with the UI, data, and processing splits as special cases within it)"
    answer: 3
    explanation: |
      When workload and compliance forces cut across UI, data, and processing at once,
      Hybrid Application Functions is the framing pattern; the individual splits are its
      special cases.
    ref: "concepts.md#hybrid-application-functions"

  - id: ccp-composite-hybrid-043
    difficulty: beginner
    tags: [hybrid-processing, related-patterns, cross-ref]
    question: |
      Where is the deep dive for the elasticity/cloud-bursting and load-balancing
