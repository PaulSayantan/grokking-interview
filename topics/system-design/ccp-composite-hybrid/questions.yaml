topic: "Composite Cloud Applications: Hybrid Cloud Architectures"
domain: system-design
topic_slug: ccp-composite-hybrid
version: 1
questions:
  - id: ccp-composite-hybrid-001
    difficulty: beginner
    tags: [hybrid, definition, altitude]
    question: |
      In the Cloud Computing Patterns language, what is a "hybrid" cloud
      composition pattern fundamentally about?
    options:
      - "A per-component placement decision splitting one application across a static (private) and an elastic (public) environment, driven by a specific force"
      - "Using at least two different public cloud vendors for redundancy"
      - "Running everything in the public cloud but keeping backups on a laptop"
      - "Rewriting a monolith into microservices"
    answer: 0
    explanation: |
      A hybrid pattern is not "use two clouds." It is a placement decision per
      component: put the variable/burst/regulated part in the environment that
      fits it (elastic public vs. static private), driven by a specific force
      (workload shape, data volatility, residency, cost, latency, lifecycle).
    ref: "concepts.md#composite-cloud-applications-hybrid-cloud-architectures"

  - id: ccp-composite-hybrid-002
    difficulty: beginner
    tags: [loose-coupling, messaging, glue]
    question: |
      Across nearly every hybrid pattern, what mechanism connects the static and
      elastic halves, and why?
    options:
      - "Asynchronous messaging, to preserve loose coupling so a spike or failure on one side does not synchronously overwhelm the other"
      - "Synchronous RPC, to guarantee strong consistency"
      - "A shared filesystem mounted over the WAN"
      - "A single shared relational database with distributed transactions"
    answer: 0
    explanation: |
      Asynchronous messaging is the recurring glue. It preserves Loose Coupling
      across the environment boundary: spikes and failures are buffered rather
      than propagated synchronously. Deep dive: system-design/message-queues-and-async.
    ref: "concepts.md#composite-cloud-applications-hybrid-cloud-architectures"

  - id: ccp-composite-hybrid-003
    difficulty: beginner
    tags: [hybrid-processing, cloud-bursting, intent]
    question: |
      Which hybrid pattern is the canonical "cloud bursting" pattern — moving
      variable-workload processing components to an elastic cloud while the rest
      stays in a static data center?
    options:
      - "Hybrid Data"
      - "Hybrid Backup"
      - "Hybrid User Interface"
      - "Hybrid Processing"
    answer: 3
    explanation: |
      Hybrid Processing places only the variable-workload processing components
      in the elastic environment and triggers them asynchronously from the static
      side. This is exactly the cloud-bursting idea.
    ref: "concepts.md#hybrid-processing"

  - id: ccp-composite-hybrid-004
    difficulty: intermediate
    tags: [hybrid-processing, hybrid-backend, distinction]
    question: |
      A batch processor sees unpredictable seasonal spikes AND must read
      terabytes of co-located data on every run. Plain Hybrid Processing or
      Hybrid Backend?
    options:
      - "Hybrid Processing, because the workload is variable"
      - "Hybrid User Interface, because batch jobs are user-triggered"
      - "Hybrid Backend, because the burst compute is data-heavy and the data should move with the compute"
      - "Hybrid Backup, because it touches large data"
    answer: 2
    explanation: |
      Hybrid Backend is chosen when the burst processing is data-heavy: move the
      data with the compute into the elastic environment and trigger via a queue.
      Plain Hybrid Processing assumes the processor does NOT need large co-located
      data.
    ref: "concepts.md#hybrid-backend"

  - id: ccp-composite-hybrid-005
    difficulty: intermediate
    tags: [hybrid-data, hybrid-backup, distinction]
    question: |
      What is the key distinction between Hybrid Data and Hybrid Backup?
    options:
      - "Hybrid Data is for compliance only; Hybrid Backup is for performance only"
      - "Hybrid Data moves the active working set (volatile volume or residency); Hybrid Backup moves periodic archival copies for DR and regulatory retention"
      - "They are two names for the same pattern"
      - "Hybrid Data runs in the static environment; Hybrid Backup runs entirely in the static environment too"
    answer: 1
    explanation: |
      Hybrid Data relocates the active dataset (driven by volatile volume or data
      residency). Hybrid Backup replicates periodic archival copies off-site,
      tuned by RPO/RTO and retention law — a DR/compliance concern, not live scaling.
    ref: "concepts.md#hybrid-data"

  - id: ccp-composite-hybrid-006
    difficulty: intermediate
    tags: [hybrid-user-interface, scenario, selection]
    question: |
      A portal's public-facing UI experiences unforecastable spikes during
      marketing campaigns, but the core processing and data are steady. Which
      pattern fits best?
    options:
      - "Hybrid Processing"
      - "Hybrid User Interface"
      - "Hybrid Data"
      - "Hybrid Backup"
    answer: 1
    explanation: |
      Hybrid User Interface deploys the spiky UI tier in the elastic cloud while
      keeping the steady backend static, connecting them asynchronously so UI
      spikes don't reach the backend synchronously.
    ref: "concepts.md#hybrid-user-interface"

  - id: ccp-composite-hybrid-007
    difficulty: beginner
    tags: [hybrid-backup, compliance, dr]
    question: |
      What are the two primary drivers behind the Hybrid Backup pattern?
    options:
      - "Disaster-recovery resiliency/continuity and regulatory archival retention"
      - "Lower latency and higher throughput"
      - "Cheaper development and faster testing"
      - "Global media streaming and CDN offload"
    answer: 0
    explanation: |
      Hybrid Backup targets DR (resiliency and continuity for businesses lacking
      HA infrastructure) and legal/regulatory obligations to archive data and keep
      it accessible for audits, often for years.
    ref: "concepts.md#hybrid-backup"

  - id: ccp-composite-hybrid-008
    difficulty: intermediate
    tags: [hybrid-multimedia, cdn, distinction]
    question: |
      Why is Hybrid Multimedia Web Application NOT simply "put a CDN in front of
      the site"?
    options:
      - "A CDN caches cacheable static assets; this pattern additionally offloads non-cacheable STREAMING media to an elastic delivery-optimized environment that the browser fetches directly"
      - "CDNs cannot serve any static content"
      - "The pattern forbids using a CDN at all"
      - "It is exactly a CDN, just renamed"
    answer: 0
    explanation: |
      Ordinary CDN caching handles cacheable static assets. Hybrid Multimedia Web
      Application specifically offloads non-cacheable streaming media (video/audio)
      to an elastic, delivery-optimized environment; static pages reference it and
      the browser streams directly from there.
    ref: "concepts.md#hybrid-multimedia-web-application"

  - id: ccp-composite-hybrid-009
    difficulty: intermediate
    tags: [hybrid-application-functions, general-case, selection]
    question: |
      Components at every layer (UI, processing, data) have mixed workload AND
      compliance constraints on where they can run, so no single specialized
      hybrid pattern captures the split. Which pattern applies?
    options:
      - "Hybrid Data"
      - "Hybrid Development Environment"
      - "Hybrid Backup"
      - "Hybrid Application Functions"
    answer: 3
    explanation: |
      Hybrid Application Functions is the general case: cluster components by
      shared requirements (workload, residency, trust), place each cluster in the
      best environment, keep them loosely coupled with async messaging, and route
      requests by function via a load balancer.
    ref: "concepts.md#hybrid-application-functions"

  - id: ccp-composite-hybrid-010
    difficulty: intermediate
    tags: [hybrid-development-environment, lifecycle, intent]
    question: |
      Which pattern places application lifecycle STAGES in the environments that
      suit them — e.g. flexible/elastic cloud for dev and test, locked-down static
      environment for production?
    options:
      - "Hybrid Development Environment"
      - "Hybrid Processing"
      - "Hybrid Backend"
      - "Hybrid User Interface"
    answer: 0
    explanation: |
      Hybrid Development Environment matches each lifecycle stage to its needs:
      development wants flexibility, test wants varied systems and large elastic
      pools, production prioritizes security and availability.
    ref: "concepts.md#hybrid-development-environment"

  - id: ccp-composite-hybrid-011
    difficulty: advanced
    tags: [hybrid-backend, data-access-component, mechanism]
    question: |
      In Hybrid Backend, what role does the Data Access Component in the static
      environment play?
    options:
      - "It synchronously proxies every query from the cloud back to on-prem"
      - "It load-balances user HTTP requests across environments"
      - "It encrypts backups before archival"
      - "It ensures required data is placed in cloud storage and messages the elastic components where to find it, staging only what the backend needs"
    answer: 3
    explanation: |
      The Data Access Component stages the required data into cloud storage and
      communicates its location to the elastic processing components via messages;
      data the backend doesn't need stays in stateful components on-prem.
    ref: "concepts.md#hybrid-backend"

  - id: ccp-composite-hybrid-012
    difficulty: intermediate
    tags: [hybrid-processing, statelessness, tradeoff]
    question: |
      For Hybrid Processing to scale horizontally in the elastic environment, what
      property should the migrated processing components have?
    options:
      - "They should be stateless (or externally stateful) so instances can be added and removed freely"
      - "They must hold session state locally for performance"
      - "They must run as a single large instance"
      - "They must share a mutable in-memory cache across nodes"
    answer: 0
    explanation: |
      Elastic scaling of the burst processors requires them to be stateless (or to
      externalize state), so instances can be spun up/down with queue depth without
      losing correctness.
    ref: "concepts.md#hybrid-processing"

  - id: ccp-composite-hybrid-013
    difficulty: intermediate
    tags: [hybrid-data, residency, compliance]
    question: |
      Besides volatile data volume, what is the OTHER driver the Hybrid Data
      pattern addresses?
    options:
      - "Data residency / compliance — sensitive data may be forced to stay in the static/private environment while other data goes to the elastic cloud"
      - "Reducing developer onboarding time"
      - "Improving CDN cache-hit ratios"
      - "Shortening CI pipeline duration"
    answer: 0
    explanation: |
      Hybrid Data has two drivers: volatility of volume (move variable-volume data
      to elastic storage) and residency/compliance (pin sensitive data to the
      private environment while the rest scales in the cloud).
    ref: "concepts.md#hybrid-data"

  - id: ccp-composite-hybrid-014
    difficulty: advanced
    tags: [hybrid-application-functions, special-cases, relationships]
    question: |
      How do Hybrid User Interface, Hybrid Processing, Hybrid Data, and Hybrid
      Backend relate to Hybrid Application Functions?
    options:
      - "They are unrelated patterns from a different pattern language"
      - "They are special cases of Hybrid Application Functions, each dominated by a single force (UI workload, processing workload, data, or data-heavy processing)"
      - "They supersede Hybrid Application Functions, which is deprecated"
      - "They only apply to single-cloud deployments"
    answer: 1
    explanation: |
      Hybrid Application Functions is the general function-by-function split; the
      others are special cases where one force dominates. Prefer the specific
      pattern when a single force clearly drives the split.
    ref: "concepts.md#hybrid-application-functions"

  - id: ccp-composite-hybrid-015
    difficulty: beginner
    tags: [terminology, static-elastic]
    question: |
      In these patterns, what do the terms "static environment" and "elastic
      environment" typically map to?
    options:
      - "Static = frontend, elastic = backend"
      - "Static = private data center / on-premises (fixed capacity); elastic = public cloud (scales on demand)"
      - "Static = production, elastic = disaster-recovery site"
      - "Static = compiled code, elastic = interpreted code"
    answer: 1
    explanation: |
      The static environment is the fixed-capacity private DC / on-prem; the
      elastic environment is the public cloud that scales out and in on demand. A
      hybrid pattern decides which component lives in which.
    ref: "concepts.md#composite-cloud-applications-hybrid-cloud-architectures"

  - id: ccp-composite-hybrid-016
    difficulty: intermediate
    tags: [hybrid-processing, modern-equivalent, cross-cloud]
    question: |
      Which set of modern technologies best illustrates Hybrid Processing / cloud
      bursting in a vendor-neutral way?
    options:
      - "On-prem Kubernetes bursting to EKS/AKS/GKE or serverless (Lambda/Azure Functions/Cloud Functions), with Outposts/Arc/Anthos extending on-prem, triggered via SQS/Service Bus/Pub-Sub"
      - "Only AWS Lambda"
      - "A single monolithic VM in one region"
      - "A CDN edge cache only"
    answer: 0
    explanation: |
      Cloud bursting shows up as extending on-prem compute to elastic cloud/
      serverless across all three major clouds, glued by a managed queue. The
      point is the cross-cloud abstraction, not one product.
    ref: "concepts.md#hybrid-processing"

  - id: ccp-composite-hybrid-017
    difficulty: intermediate
    tags: [hybrid-backup, rpo-rto, tradeoff, cross-ref]
    question: |
      When designing a Hybrid Backup, which knobs primarily govern the design, and
      where is the deep dive?
    options:
      - "RPO/RTO, retention duration, and restore-test discipline; deep dive in reliability-ops/disaster-recovery-rpo-rto-strategies"
      - "Cache TTL and CDN region; deep dive in caching-and-cdn"
      - "Thread-pool size and GC settings; deep dive in java-jvm"
      - "Message ordering guarantees; deep dive in message-queues-and-async"
    answer: 0
    explanation: |
      Hybrid Backup is a DR/archival pattern governed by RPO (acceptable data loss),
      RTO (recovery time), retention, and tested restores. The process depth lives in
      reliability-ops/disaster-recovery-rpo-rto-strategies.
    ref: "concepts.md#hybrid-backup"

  - id: ccp-composite-hybrid-018
    difficulty: advanced
    tags: [hybrid-development-environment, drift, tradeoff]
    question: |
      What is the primary failure mode of the Hybrid Development Environment
      pattern, and how is it mitigated?
    options:
      - "Data loss; mitigated by more backups"
      - "Excessive latency; mitigated by a CDN"
      - "Message duplication; mitigated by idempotency keys"
      - "Environment drift (dev/test diverge from prod in addressing, data, or platform behavior); mitigated by IaC, containers, comparable mock data, and matching addressing"
    answer: 3
    explanation: |
      If addressing, mock data, and platform behavior diverge, "works in test" won't
      hold in prod. Keeping environments equivalent via Infrastructure-as-Code,
      containers, and comparable data is the mitigation.
    ref: "concepts.md#hybrid-development-environment"

  - id: ccp-composite-hybrid-019
    difficulty: intermediate
    tags: [hybrid-user-interface, async-interaction, tradeoff]
    question: |
      What design constraint does placing the UI tier behind an asynchronous
      boundary (Hybrid User Interface) impose?
    options:
      - "The UI must use synchronous, blocking request-response for every action"
      - "The UI must be designed for asynchronous interaction (submit-and-poll or notification), accepting eventual consistency with the backend"
      - "The UI cannot render any dynamic data"
      - "The backend must run in the same process as the UI"
    answer: 1
    explanation: |
      Because the halves communicate asynchronously, the UI must handle
      submit-and-poll / notification flows and eventual consistency with the static
      backend rather than assuming immediate synchronous responses.
    ref: "concepts.md#hybrid-user-interface"

  - id: ccp-composite-hybrid-020
    difficulty: intermediate
    tags: [hybrid-multimedia, modern-equivalent, cross-ref]
    question: |
      A globally accessed, mostly-static marketing site must also stream large
      video libraries with good performance worldwide. Which pattern applies, and
      where is the CDN mechanism deep-dived?
    options:
      - "Hybrid Backup; deep dive in disaster-recovery-rpo-rto-strategies"
      - "Hybrid Processing; deep dive in scalability-and-load-balancing"
      - "Hybrid Development Environment; deep dive in devops-cicd"
      - "Hybrid Multimedia Web Application; deep dive in system-design/caching-and-cdn"
    answer: 3
    explanation: |
      Hybrid Multimedia Web Application serves static content statically and offloads
      the streaming media to an elastic delivery-optimized environment. CDN/edge
      caching mechanics are deep-dived in system-design/caching-and-cdn.
    ref: "concepts.md#hybrid-multimedia-web-application"

  - id: ccp-composite-hybrid-021
    difficulty: advanced
    tags: [hybrid-application-functions, routing, load-balancer]
    question: |
      In Hybrid Application Functions, how are user requests directed to the
      correct environment?
    options:
      - "Users manually pick an environment from a dropdown"
      - "A load balancer transparently routes each request to the appropriate environment based on the function being accessed"
      - "All requests always go to the static environment first"
      - "DNS randomly picks an environment per request"
    answer: 1
    explanation: |
      A load balancer routes transparently by function so users are unaware of the
      split; component clusters are placed by requirement and kept loosely coupled
      via async messaging.
    ref: "concepts.md#hybrid-application-functions"

  - id: ccp-composite-hybrid-022
    difficulty: beginner
    tags: [source, vendor-neutral]
    question: |
      What is the defining characteristic of the Cloud Computing Patterns
      (Fehling et al.) that these hybrid patterns come from?
    options:
      - "They are AWS-specific implementation guides"
      - "They only apply to serverless functions"
      - "They are Kubernetes operator recipes"
      - "They are vendor-neutral, technology-independent abstract patterns applicable across clouds"
    answer: 3
    explanation: |
      The catalogue is a vendor-neutral, technology-independent pattern language.
      Concrete products (AWS/Azure/GCP) are only illustrations of the abstract
      solutions.
    ref: "concepts.md#composite-cloud-applications-hybrid-cloud-architectures"

  - id: ccp-composite-hybrid-023
    difficulty: advanced
    tags: [hybrid-backend, hybrid-processing, egress, tradeoff]
    question: |
      What is the main cost/penalty trade-off that distinguishes when Hybrid
      Backend is preferable to Hybrid Processing?
    options:
      - "Hybrid Backend always uses less memory"
      - "Hybrid Processing cannot use queues"
      - "Hybrid Backend co-locates data with compute to avoid paying per-request data transfer for data-heavy jobs, at the cost of data-staging/egress and coordinating where data lives"
      - "Hybrid Backend eliminates all consistency concerns"
    answer: 2
    explanation: |
      When the burst compute is data-heavy, moving data per request is expensive;
      Hybrid Backend co-locates data with compute. The cost shifts to staging/egress
      and coordinating data placement (the Data Access Component), with eventual
      consistency of the staged copy.
    ref: "concepts.md#hybrid-backend"

  - id: ccp-composite-hybrid-024
    difficulty: intermediate
    tags: [hybrid-data, modern-equivalent, storage]
    question: |
      Which illustration best fits the "move volatile-volume data to elastic
      storage" aspect of Hybrid Data across clouds?
    options:
      - "Volatile/bulk data in elastic object storage (S3 / Azure Blob / Google Cloud Storage) or managed elastic DBs, while sensitive data stays region-locked on-prem"
      - "Pinning all data to a single on-prem RAID array"
      - "Emailing CSV exports nightly"
      - "Caching everything at the CDN edge"
    answer: 0
    explanation: |
      Volatile or bulk data lands in elastic object storage or managed elastic
      databases across the major clouds, while sensitive/regulated data is pinned
      to the private/region-locked environment.
    ref: "concepts.md#hybrid-data"

  - id: ccp-composite-hybrid-025
    difficulty: intermediate
    tags: [hybrid-backup, distinction, hybrid-data]
    question: |
      A regulator requires you to retain immutable copies of transaction records
      for seven years and be able to restore after a site loss, but your live
      system stays on-prem. Which pattern is this?
    options:
      - "Hybrid Data"
      - "Hybrid Backup"
      - "Hybrid Backend"
      - "Hybrid Application Functions"
    answer: 1
    explanation: |
      Retaining periodic immutable copies off-site for audit/DR — not relocating the
      active working set — is Hybrid Backup (e.g. Glacier/Blob Archive/Coldline with
      object-lock/WORM).
    ref: "concepts.md#hybrid-backup"

  - id: ccp-composite-hybrid-026
    difficulty: advanced
    tags: [hybrid-data, consistency, cross-ref]
    question: |
      Splitting an active dataset across static and elastic environments (Hybrid
      Data) most directly raises which concern, deep-dived elsewhere?
    options:
      - "Thread scheduling; deep dive in java-jvm"
      - "CDN cache invalidation; deep dive in caching-and-cdn"
      - "Build reproducibility; deep dive in devops-cicd"
      - "Cross-boundary consistency and latency (often accepting eventual consistency); deep dive in cap-theorem-and-consistency and databases-sql-nosql-sharding-replication"
    answer: 3
    explanation: |
      Distributing the active dataset creates consistency and latency concerns across
      the boundary; teams often accept eventual consistency for the cloud copy. Depth
      is in cap-theorem-and-consistency and databases-sql-nosql-sharding-replication.
    ref: "concepts.md#hybrid-data"

  - id: ccp-composite-hybrid-027
    difficulty: beginner
    tags: [hybrid-multimedia, related-patterns]
    question: |
      Which pattern is most closely related to and complements Hybrid Multimedia
      Web Application for delivering static content globally?
    options:
      - "Hybrid Development Environment"
      - "Hybrid Backup"
      - "Content Distribution Network (CDN)"
      - "Hybrid Processing"
    answer: 2
    explanation: |
      Hybrid Multimedia Web Application is listed with Content Distribution Network,
      Hybrid Application Functions, and Two/Three-Tier Cloud Application. The CDN
      handles cacheable static content; the pattern offloads non-cacheable streaming.
    ref: "concepts.md#hybrid-multimedia-web-application"

  - id: ccp-composite-hybrid-028
    difficulty: advanced
    tags: [hybrid-development-environment, portability, mechanism]
    question: |
      How does the Hybrid Development Environment pattern achieve PORTABILITY of a
      finished application across its environments?
    options:
      - "By forbidding any difference between environments"
      - "By recompiling the app from scratch in production"
      - "By transforming components or ensuring runtime compatibility, plus matching addressing and comparable mock data, while keeping some test-only resources in dev/test"
      - "By running production inside the developer's laptop"
    answer: 2
    explanation: |
      Portability comes from transforming components or ensuring runtime
      compatibility, with equivalent addressing, comparable mock data, and matching
      platform functionality; certain testing resources remain only in dev/test.
    ref: "concepts.md#hybrid-development-environment"

  - id: ccp-composite-hybrid-029
    difficulty: intermediate
    tags: [selection, hybrid-user-interface, hybrid-processing]
    question: |
      Both Hybrid User Interface and Hybrid Processing move a variable-workload tier
      to the elastic cloud. What differentiates them?
    options:
      - "Hybrid User Interface moves the PRESENTATION/UI tier facing spiky users; Hybrid Processing moves the PROCESSING components with variable workload"
      - "One uses queues, the other forbids them"
      - "Hybrid Processing only works for stateful data"
      - "Hybrid User Interface is for backup, Hybrid Processing is for archival"
    answer: 0
    explanation: |
      The difference is WHICH tier holds the variable workload: the UI tier
      (Hybrid User Interface) versus the processing/compute components (Hybrid
      Processing). Both keep the rest static and connect asynchronously.
    ref: "concepts.md#hybrid-user-interface"

  - id: ccp-composite-hybrid-030
    difficulty: intermediate
    tags: [hybrid-backend, modern-equivalent, cross-cloud]
    question: |
      Which modern illustration best matches Hybrid Backend (elastic data-heavy
      processing co-located with data, triggered from on-prem)?
    options:
      - "A CDN edge cache serving thumbnails"
      - "EMR/Spark or AWS Batch reading S3, Synapse/HDInsight over Blob, or Dataproc/BigQuery over GCS, kicked off by SQS/Service Bus/Pub-Sub events"
      - "A single-region monolith with a local disk"
      - "GitHub Codespaces for developers"
    answer: 1
    explanation: |
      Hybrid Backend maps to elastic data-processing engines co-located with their
      data in object storage, triggered by managed queue/event services from the
      static side.
    ref: "concepts.md#hybrid-backend"

  - id: ccp-composite-hybrid-031
    difficulty: advanced
    tags: [hybrid-application-functions, tradeoff, complexity]
    question: |
      Why should you prefer a specialized hybrid pattern over Hybrid Application
      Functions when a single force dominates?
    options:
      - "Specialized patterns are the only ones that allow messaging"
      - "Hybrid Application Functions cannot handle compliance constraints"
      - "Hybrid Application Functions is the most flexible but most complex (routing, distributed consistency, cross-environment observability/security); the specialized patterns are simpler special cases"
      - "The specialized patterns are always cheaper regardless of context"
    answer: 2
    explanation: |
      Hybrid Application Functions carries the full cost of function-by-function
      routing, distributed consistency, and cross-environment security/observability.
      When one force clearly drives the split, the specialized special-case pattern
      is simpler.
    ref: "concepts.md#hybrid-application-functions"

  - id: ccp-composite-hybrid-032
    difficulty: beginner
    tags: [hybrid-development-environment, modern-equivalent]
    question: |
      Which modern practices best embody the Hybrid Development Environment pattern?
    options:
      - "Ephemeral cloud dev/test (preview envs, cloud CI runners, Codespaces/Cloud Workstations) with production locked down, using IaC and containers to keep environments equivalent"
      - "Manually configuring each server by hand and hoping they match"
      - "Running dev, test, and prod as one shared instance"
      - "Streaming video from an elastic origin"
    answer: 0
    explanation: |
      Cheap, disposable elastic dev/test environments with production held in a
      locked-down environment, kept equivalent via Infrastructure-as-Code and
      containers, embody the pattern.
    ref: "concepts.md#hybrid-development-environment"

  - id: ccp-composite-hybrid-033
    difficulty: advanced
    tags: [scenario, selection, hybrid-data, residency]
    question: |
      A healthcare app must keep patient records in-country on private infrastructure
      by law, but its anonymized analytics dataset can grow unpredictably and should
      scale in the public cloud. Which pattern captures this split?
    options:
      - "Hybrid Data"
      - "Hybrid Backup"
      - "Hybrid Multimedia Web Application"
      - "Hybrid Development Environment"
    answer: 0
    explanation: |
      This is Hybrid Data on both drivers: residency pins sensitive records to the
      private environment, while the volatile-volume analytics data moves to elastic
      cloud storage.
    ref: "concepts.md#hybrid-data"

  - id: ccp-composite-hybrid-034
    difficulty: intermediate
    tags: [hybrid-user-interface, modern-equivalent, connectivity]
    question: |
      Which technologies commonly connect the elastic UI tier to the static backend
      in a Hybrid User Interface deployment?
    options:
      - "A public FTP server with anonymous access"
      - "Physically shipping hard drives daily"
      - "A private link such as VPN or AWS Direct Connect / Azure ExpressRoute / GCP Interconnect, plus a queue or API gateway"
      - "A shared spreadsheet"
    answer: 2
    explanation: |
      Elastic frontends connect to the on-prem core over private connectivity (VPN /
      Direct Connect / ExpressRoute / Interconnect) plus async messaging or an API
      gateway, keeping the halves loosely coupled.
    ref: "concepts.md#hybrid-user-interface"

  - id: ccp-composite-hybrid-035
    difficulty: advanced
    tags: [scenario, selection, hybrid-processing]
    question: |
      An insurance firm runs steady policy administration on-prem but must run a
      compute-intensive risk-simulation job that spikes at quarter-end; the job needs
      only small parameter inputs, not bulk data. Which pattern fits best?
    options:
      - "Hybrid Backend, because it is compute-intensive"
      - "Hybrid Processing, because the burst is in compute and it does not need large co-located data"
      - "Hybrid Backup, because it runs at quarter-end"
      - "Hybrid User Interface, because users trigger it"
    answer: 1
    explanation: |
      Bursty compute that does NOT need large co-located data is Hybrid Processing:
      run the risk-simulation processors elastically, triggered by messages, keeping
      the steady admin system static. If it needed bulk data, that would be Hybrid Backend.
    ref: "concepts.md#hybrid-processing"

  - id: ccp-composite-hybrid-036
    difficulty: intermediate
    tags: [hybrid-backup, modern-equivalent, tiering]
    question: |
      Which modern storage features most directly support Hybrid Backup for
      compliant, cost-efficient long-term archival?
    options:
      - "In-memory caches with short TTLs"
      - "GPU instances for training"
      - "Cold/archive tiers with lifecycle policies and WORM/object-lock (S3 Glacier, Azure Blob Archive, GCS Archive; AWS Backup, Azure Backup/Site Recovery)"
      - "Edge PoPs for streaming"
    answer: 2
    explanation: |
      Long-term compliant archival maps to cold/archive storage tiers with lifecycle
      policies and immutable object-lock/WORM, plus managed backup/DR services across
      clouds.
    ref: "concepts.md#hybrid-backup"

  - id: ccp-composite-hybrid-037
    difficulty: advanced
    tags: [scenario, selection, hybrid-multimedia]
    question: |
      A news site's articles (text/images) cache well and are served from its data
      center, but its live-event video streams are heavy and non-cacheable for a
      worldwide audience. Which pattern describes serving the video?
    options:
      - "Hybrid Data"
      - "Hybrid Backup"
      - "Hybrid Multimedia Web Application"
      - "Hybrid Development Environment"
    answer: 2
    explanation: |
      Non-cacheable streaming media served from an elastic delivery-optimized
      environment while static content stays static, with pages referencing the media,
      is Hybrid Multimedia Web Application.
    ref: "concepts.md#hybrid-multimedia-web-application"

  - id: ccp-composite-hybrid-038
    difficulty: beginner
    tags: [hybrid-backend, related-patterns]
    question: |
      Which pattern does Hybrid Backend rely on to trigger the elastic processing
      components from the static environment?
    options:
      - "Content Distribution Network"
      - "Hybrid Backup"
      - "Hybrid Development Environment"
      - "Message-oriented Middleware (a message queue)"
    answer: 3
    explanation: |
      Hybrid Backend triggers elastic processors asynchronously through Message-oriented
      Middleware (queues), which also carries the data-location information from the
      Data Access Component.
    ref: "concepts.md#hybrid-backend"

  - id: ccp-composite-hybrid-039
    difficulty: intermediate
    tags: [cross-ref, boundary, altitude]
    question: |
      At what altitude should this topic treat elasticity, load balancing, and
      messaging delivery guarantees?
    options:
      - "Re-teach every mechanism in full detail here"
      - "Keep pattern-level treatment (intent/solution/trade-off/vocabulary) and cross-reference the deep-dive topics that own those mechanisms"
      - "Ignore them entirely"
      - "Cover them only as AWS product tutorials"
    answer: 1
    explanation: |
      These composition patterns stay at the pattern altitude and cross-reference the
      deep dives (scalability-and-load-balancing, message-queues-and-async, etc.)
      rather than duplicating mechanism detail.
    ref: "concepts.md#composite-cloud-applications-hybrid-cloud-architectures"

  - id: ccp-composite-hybrid-040
    difficulty: advanced
    tags: [scenario, selection, hybrid-development-environment]
    question: |
      A team wants disposable, scalable environments to run load tests against many
      OS/browser combinations, but keeps production in a hardened private data center.
      Which pattern is this?
    options:
      - "Hybrid Processing"
      - "Hybrid Data"
      - "Hybrid Backup"
      - "Hybrid Development Environment"
    answer: 3
    explanation: |
      Matching lifecycle stages to environments — elastic, varied, disposable dev/test
      plus hardened static production — is Hybrid Development Environment.
    ref: "concepts.md#hybrid-development-environment"

  - id: ccp-composite-hybrid-041
    difficulty: intermediate
    tags: [hybrid-application-functions, clustering, mechanism]
    question: |
      In Hybrid Application Functions, how are components decided into their
      environments?
    options:
      - "Randomly, to balance cost"
      - "All UI in cloud, all data on-prem, with no exceptions"
      - "Clustered by shared requirements (workload shape, residency, trust), then each cluster placed in the environment that best fits it, with dependencies minimized via async messaging"
      - "By alphabetical order of component name"
    answer: 2
    explanation: |
      Components are grouped by shared requirements and each cluster is placed where it
      fits best; cross-cluster dependencies are minimized and data is exchanged
      asynchronously to preserve loose coupling.
    ref: "concepts.md#hybrid-application-functions"

  - id: ccp-composite-hybrid-042
    difficulty: advanced
    tags: [scenario, distinction, hybrid-user-interface, hybrid-application-functions]
    question: |
      An application has a spiky public UI AND separate compliance rules forcing its
      billing-data component to stay on-prem while other data scales in the cloud, plus
      analytics jobs that burst. A single specialized pattern won't capture all of this.
      Which pattern best frames the overall design?
    options:
      - "Hybrid User Interface alone"
      - "Hybrid Backup"
      - "Hybrid Multimedia Web Application"
      - "Hybrid Application Functions, coordinating multiple per-cluster placements (with the UI, data, and processing splits as special cases within it)"
    answer: 3
    explanation: |
      When workload and compliance forces cut across UI, data, and processing at once,
      Hybrid Application Functions is the framing pattern; the individual splits are its
      special cases.
    ref: "concepts.md#hybrid-application-functions"

  - id: ccp-composite-hybrid-043
    difficulty: beginner
    tags: [hybrid-processing, related-patterns, cross-ref]
    question: |
      Where is the deep dive for the elasticity/cloud-bursting and load-balancing
      MECHANISMS that Hybrid Processing depends on?
    options:
      - "reliability-ops/disaster-recovery-rpo-rto-strategies"
      - "system-design/scalability-and-load-balancing"
      - "system-design/caching-and-cdn"
      - "devops-cicd"
    answer: 1
    explanation: |
      Bursting/elasticity and load-balancing mechanics are deep-dived in
      system-design/scalability-and-load-balancing; this topic keeps the pattern-level
      treatment.
    ref: "concepts.md#hybrid-processing"

  - id: ccp-composite-hybrid-044
    difficulty: intermediate
    tags: [hybrid-multimedia, mechanism, direct-fetch]
    question: |
      In Hybrid Multimedia Web Application, how does the streaming media reach the
      end user?
    options:
      - "The static data center proxies every byte of video to the user"
      - "The media is emailed as an attachment"
      - "The static pages contain references to the media, and the user's browser typically fetches the stream directly from the elastic environment"
      - "The CDN converts video to text"
    answer: 2
    explanation: |
      Static pages reference the media files hosted in the elastic environment, and the
      browser streams them directly from there, avoiding routing heavy media through the
      static data center.
    ref: "concepts.md#hybrid-multimedia-web-application"

  - id: ccp-composite-hybrid-045
    difficulty: advanced
    tags: [scenario, distinction, hybrid-backend, hybrid-data]
    question: |
      A recommendation engine bursts at peak shopping hours and must scan a large,
      frequently-updated product-embedding dataset each run. The steady catalog stays
      on-prem. Which pattern most precisely fits the recommendation tier?
    options:
      - "Hybrid Data, because a large dataset is involved"
      - "Hybrid Backend, because the burst compute needs large co-located data and is triggered from the static side"
      - "Hybrid Backup, because data is scanned"
      - "Hybrid User Interface, because it affects shoppers"
    answer: 1
    explanation: |
      Burst compute that requires large co-located data, triggered asynchronously from
      the static environment with a Data Access Component staging the data, is precisely
      Hybrid Backend. Hybrid Data alone wouldn't move the compute.
    ref: "concepts.md#hybrid-backend"

  - id: ccp-composite-hybrid-046
    difficulty: intermediate
    tags: [hybrid-application-functions, modern-equivalent, fabric]
    question: |
      Which modern platform capabilities most naturally support Hybrid Application
      Functions' policy-driven, per-component placement across environments?
    options:
      - "A single monolithic VM image"
      - "Only email notifications"
      - "A desktop spreadsheet macro"
      - "Cross-environment fabrics/meshes and global routing (Anthos, Azure Arc, AWS Outposts; CloudFront/Front Door/Global LB + Route 53) that place and route workloads by policy"
    answer: 3
    explanation: |
      Platform fabrics (Anthos/Arc/Outposts) and global routers/gateways let you place
      workloads by policy and route requests by function across on-prem and multi-cloud,
      matching the pattern's per-cluster placement and transparent routing.
    ref: "concepts.md#hybrid-application-functions"

  - id: ccp-composite-hybrid-047
    difficulty: intermediate
    tags: [cross-ref, hybrid, provider-depth]
    question: |
      For provider-specific hybrid connectivity and migration depth (Outposts,
      Direct Connect/VPN, modernization), which topic owns the deep dive?
    options:
      - "system-design/cap-theorem-and-consistency"
      - "system-design/caching-and-cdn"
      - "system-design/aws-migration-modernization"
      - "reliability-ops/disaster-recovery-rpo-rto-strategies"
    answer: 2
    explanation: |
      Provider-specific hybrid and migration depth is owned by
      system-design/aws-migration-modernization; these composition patterns stay
      vendor-neutral and cross-reference it.
    ref: "concepts.md#composite-cloud-applications-hybrid-cloud-architectures"

  - id: ccp-composite-hybrid-048
    difficulty: expert
    tags: [scenario, multi-pattern, synthesis]
    question: |
      A media startup wants: (a) DR copies of its DB retained off-site for compliance,
      (b) global streaming of its video catalog, and (c) burst transcoding jobs that
      read large source files. Which set of patterns most precisely maps to (a), (b), (c)?
    options:
      - "Hybrid Data, Hybrid Processing, Hybrid User Interface"
      - "Hybrid Development Environment, Hybrid Data, Hybrid Processing"
      - "Hybrid User Interface, Hybrid Backup, Hybrid Data"
      - "Hybrid Backup, Hybrid Multimedia Web Application, Hybrid Backend"
    answer: 3
    explanation: |
      (a) Off-site compliant DR archival is Hybrid Backup; (b) global non-cacheable
      video streaming is Hybrid Multimedia Web Application; (c) burst compute that reads
      large co-located source data is Hybrid Backend.
    ref: "concepts.md#hybrid-backend"

  - id: ccp-composite-hybrid-049
    difficulty: beginner
    tags: [driver, method, selection]
    question: |
      What is the recommended first step to pick the right hybrid pattern in an
      interview?
    options:
      - "Pick the newest managed service available"
      - "Always choose Hybrid Application Functions"
      - "Choose whichever cloud vendor is cheapest"
      - "Name the dominant FORCE (burst workload, volatile data volume, residency/compliance, DR/archival, global streaming, lifecycle-stage fit) and let the pattern follow"
    answer: 3
    explanation: |
      Each hybrid pattern is selected by its driving force. Naming the force —
      burst→Processing, volatile volume→Data, residency→Data/App-Functions,
      DR/archival→Backup, streaming→Multimedia, lifecycle→Dev Environment — makes the
      pattern fall out.
    ref: "concepts.md#composite-cloud-applications-hybrid-cloud-architectures"

  - id: ccp-composite-hybrid-050
    difficulty: advanced
    tags: [distinction, hybrid-backup, hybrid-data, hybrid-backend]
    question: |
      Rank these by "how much of the live application actually runs in the elastic
      cloud," from least to most: Hybrid Backup, Hybrid Data, Hybrid Backend.
    options:
      - "Hybrid Backend, Hybrid Data, Hybrid Backup"
      - "Hybrid Data, Hybrid Backup, Hybrid Backend"
      - "Hybrid Backup (only archival copies), Hybrid Data (active dataset), Hybrid Backend (active dataset PLUS the processing that uses it)"
      - "They all place identical amounts in the cloud"
    answer: 2
    explanation: |
      Hybrid Backup only ships periodic copies (no live workload in cloud); Hybrid Data
      relocates the active dataset; Hybrid Backend relocates the active data AND the
      burst processing that consumes it — the largest live footprint of the three.
    ref: "concepts.md#hybrid-backend"
