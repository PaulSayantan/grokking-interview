    options:
      - "reliability-ops/disaster-recovery-rpo-rto-strategies"
      - "system-design/scalability-and-load-balancing"
      - "system-design/caching-and-cdn"
      - "devops-cicd"
    answer: 1
    explanation: |
      Bursting/elasticity and load-balancing mechanics are deep-dived in
