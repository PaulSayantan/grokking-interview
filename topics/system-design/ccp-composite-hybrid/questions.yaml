      - "Keep pattern-level treatment (intent/solution/trade-off/vocabulary) and cross-reference the deep-dive topics that own those mechanisms"
      - "Ignore them entirely, since composition patterns can be described without ever mentioning elasticity, load balancing, or messaging delivery guarantees"
      - "Cover them only as AWS product tutorials, walking through Auto Scaling, ELB, and SQS console screens as the canonical treatment of each mechanism"
    answer: 1
