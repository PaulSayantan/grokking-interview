topic: "Databases: SQL vs NoSQL, Indexing, Sharding and Replication"
domain: system-design
topic_slug: databases-sql-nosql-sharding-replication
version: 1

questions:
  # ---------------- Relational model ----------------
- id: databases-sql-nosql-sharding-replication-001
  difficulty: beginner
  tags: [relational, sql, fundamentals]
  question: |
    What is the defining characteristic of a relational database's query model
    compared to most NoSQL stores?
  options:
  - "You declare what data you want (SQL) and an optimizer picks the access path, with joins across normalized tables"
  - "It stores each record as an opaque binary blob retrievable only by primary key, with no querying by field value"
  - "It treats every column as untyped text and cannot enforce data types, foreign keys, or check constraints"
  - "It always scales writes horizontally across many equal nodes, needing no single primary to coordinate throughput"
  answer: 0
  explanation: |
    Relational DBs offer a declarative query language and a cost-based optimizer
    that chooses join order and index usage; they support joins across normalized
    tables. Blob-by-key is a key-value store; relational DBs enforce types and
    constraints; and a single primary bounds write throughput (not horizontal by
    default).
  ref: "concepts.md#relational-databases-and-the-relational-model"

- id: databases-sql-nosql-sharding-replication-002
  difficulty: beginner
  tags: [relational, wal, durability]
  question: |
    Why do relational engines write changes to a write-ahead log (WAL / redo log)
    before flushing data pages to disk?
  options:
  - "To compress each data page with a dictionary encoder before it is written to storage, saving disk space"
  - "To enable durability and crash recovery: the log is a durable record that can replay committed changes"
  - "To let the engine drop its B+tree indexes because the log already serves every point and range lookup"
  - "To allow the database to skip ACID guarantees and acknowledge writes before they are made durable"
  answer: 1
  explanation: |
    The WAL makes a write durable and recoverable before the (random) page flush
    happens; on crash the engine replays the log. It is not about compression or
    skipping indexes/ACID — in fact the WAL is a core part of the D in ACID.
  ref: "concepts.md#relational-databases-and-the-relational-model"

- id: databases-sql-nosql-sharding-replication-003
  difficulty: intermediate
  tags: [relational, scaling, tradeoffs]
  question: |
    A team says "relational databases don't scale, so we must start on Cassandra."
    What is the most accurate critique of this reasoning?
  options:
  - "Correct: relational engines hit a hard architectural ceiling of a few hundred QPS and cannot be tuned past it"
  - "Cassandra provides full ACID transactions across all rows and partitions out of the box, so it is strictly better"
  - "A single relational primary scales reads via caching/replicas and writes via partitioning far beyond most needs; NoSQL should be chosen for a specific forcing constraint, not preemptively"
  - "Relational databases fundamentally cannot store JSON documents or perform any kind of full-text search on their columns"
  answer: 2
  explanation: |
    Relational primaries scale much further than assumed (caching, read replicas,
    partitioning, and modern Postgres does JSON/FTS/vectors). NoSQL trades away
    joins/transactions/ad-hoc queries; pick it for a concrete constraint (extreme
    write volume, flexible model), not by default. Cassandra does not give
    cross-row ACID by default.
  ref: "concepts.md#relational-databases-and-the-relational-model"

  # ---------------- NoSQL data models ----------------
- id: databases-sql-nosql-sharding-replication-004
  difficulty: beginner
  tags: [nosql, data-models]
  question: |
    Which NoSQL family is the best fit for storing and traversing "friends of
    friends" relationships in a social network?
  options:
  - "Key-value store"
  - "Wide-column store"
  - "Document database"
  - "Graph database"
  answer: 3
  explanation: |
    Graph databases (Neo4j, Neptune) model nodes and edges and make multi-hop
    traversals first-class and efficient. Key-value serves only key lookups;
    wide-column and document stores can hold the data but make traversals awkward
    and expensive.
  ref: "concepts.md#nosql-data-models-document-key-value-wide-column-graph"

- id: databases-sql-nosql-sharding-replication-005
  difficulty: beginner
  tags: [nosql, key-value, use-cases]
  question: |
    For storing user session tokens with sub-millisecond lookups purely by session
    ID, which store type is most appropriate?
  options:
  - "An in-memory key-value store like Redis"
  - "A graph database"
  - "A data warehouse"
  - "A relational database with a complex join schema"
  answer: 0
  explanation: |
    Sessions are accessed by a single key and need very low latency, which is
    exactly the key-value sweet spot (Redis/Memcached). A graph DB or warehouse is
    the wrong model; a heavily-joined relational schema is overkill for a pure
    key lookup.
  ref: "concepts.md#nosql-data-models-document-key-value-wide-column-graph"

- id: databases-sql-nosql-sharding-replication-006
  difficulty: intermediate
  tags: [nosql, wide-column, modeling]
  question: |
    In a wide-column store like Cassandra, what does "design a table per query"
    mean and why is it necessary?
  options:
  - "Cassandra automatically normalizes data into third normal form, so each query is served by its own generated view"
  - "Because Cassandra has no ad-hoc joins and queries must hit the partition key, you model (often denormalized) tables shaped around each access pattern up front"
  - "Each distinct query requires its own separate physical database instance provisioned on dedicated nodes"
  - "It means you must launch a distributed MapReduce job that scans every partition on each individual read"
  answer: 1
  explanation: |
    Wide-column stores restrict efficient queries to the partition/clustering key
    and offer no joins, so you denormalize and create a table matching each query
    pattern (query-first modeling). It is not about separate instances,
    auto-normalization, or MapReduce per read.
  ref: "concepts.md#nosql-data-models-document-key-value-wide-column-graph"

- id: databases-sql-nosql-sharding-replication-007
  difficulty: intermediate
  tags: [nosql, document, tradeoffs]
  question: |
    A product catalog stores each product as a self-contained JSON document with
    nested attributes, read and written as a whole. Which store fits best and what
    is the main trade-off accepted?
  options:
  - "Wide-column (e.g., Cassandra); you accept losing sub-millisecond point lookups and per-row secondary indexes"
  - "Graph database (e.g., Neo4j); you accept much lower write throughput limits in exchange for edge traversals"
  - "Document store (e.g., MongoDB); you accept weaker cross-document joins and multi-document transactions in exchange for flexible schema and whole-aggregate reads"
  - "Pure key-value (e.g., Redis); you accept losing the ability to query or index any nested field inside the value"
  answer: 2
  explanation: |
    A self-contained aggregate read/written as a unit is the document-store sweet
    spot; the classic trade-off is weaker cross-document joins/transactions.
    Key-value can't query nested fields; graph is for relationships; wide-column
    is for massive append-heavy patterns.
  ref: "concepts.md#nosql-data-models-document-key-value-wide-column-graph"

  # ---------------- ACID vs BASE ----------------
- id: databases-sql-nosql-sharding-replication-008
  difficulty: beginner
  tags: [acid, base, consistency]
  question: |
    What does the "I" (Isolation) in ACID guarantee?
  options:
  - "Each table's data is stored on its own physically isolated disk to prevent one table from corrupting another"
  - "Every connected user is given a fully isolated private copy of the entire database that is merged on commit"
  - "The database process is network-isolated in its own subnet so external clients cannot reach it during a write"
  - "Concurrent transactions behave as if they ran in some serial order, not interfering with each other's intermediate state"
  answer: 3
  explanation: |
    Isolation ensures concurrent transactions don't see each other's uncommitted
    intermediate state; the strongest level (serializable) makes them equivalent
    to some serial execution. It is not about physical disks, per-user copies, or
    network isolation.
  ref: "concepts.md#acid-versus-base"

- id: databases-sql-nosql-sharding-replication-009
  difficulty: intermediate
  tags: [acid, base, tradeoffs]
  question: |
    A high-traffic feature tracks how many times posts are viewed, displayed
    approximately on each post. Which consistency model is the appropriate choice
    and why?
  options:
  - "BASE / eventual consistency, because approximate counts tolerate temporary staleness and this avoids the coordination cost that would throttle throughput"
  - "Strict ACID with serializable transactions, because a displayed view count must be exact to the single view at all times"
  - "Two-phase commit across all replicas for every view, so the counter is durably agreed before the page renders"
  - "Synchronous cross-region replication for each increment, ensuring every region shows the identical count instantly"
  answer: 0
  explanation: |
    View counts are a classic BASE fit: approximate/eventually-consistent is fine,
    and avoiding per-write coordination lets it scale cheaply. Serializable
    transactions, 2PC, or sync cross-region replication per view would add huge
    latency and cost for no user-visible benefit.
  ref: "concepts.md#acid-versus-base"

- id: databases-sql-nosql-sharding-replication-010
  difficulty: advanced
  tags: [acid, isolation-levels, anomalies]
  question: |
    Two transactions each read a shared invariant, then update different rows based
    on what they read, and both commit — leaving the invariant violated even though
    neither overwrote the other's row. Which anomaly is this, and which isolation
    level prevents it?
  options:
  - "Dirty read; prevented by Read Committed"
  - "Write skew; prevented by Serializable isolation"
  - "Non-repeatable read; prevented by Repeatable Read"
  - "Lost update; prevented by Read Uncommitted"
  answer: 1
  explanation: |
    This is write skew — each transaction's write is fine in isolation but their
    combination breaks the invariant. Only Serializable isolation prevents it.
    Dirty/non-repeatable reads are different anomalies; Read Uncommitted is the
    weakest level and prevents nothing here.
  ref: "concepts.md#acid-versus-base"

- id: databases-sql-nosql-sharding-replication-011
  difficulty: advanced
  tags: [acid, mvcc, concurrency]
  question: |
    How does MVCC (multi-version concurrency control) let readers avoid blocking
    writers and vice versa?
  options:
  - "It takes an exclusive lock on the entire table for both reads and writes until the transaction commits"
  - "It disables the write-ahead log and durability guarantees to gain speed on high-concurrency workloads"
  - "Writers create new versions of rows while readers see a consistent snapshot of older versions, so reads don't block writes"
  - "It serializes all concurrent transactions onto a single execution thread so no two ever overlap in time"
  answer: 2
  explanation: |
    MVCC keeps multiple row versions: readers see a snapshot as of their start,
    while writers create new versions, so readers and writers don't block each
    other. It does not lock whole tables, disable durability, or single-thread
    transactions.
  ref: "concepts.md#acid-versus-base"

  # ---------------- Normalization vs denormalization ----------------
- id: databases-sql-nosql-sharding-replication-012
  difficulty: beginner
  tags: [normalization, schema]
  question: |
    What is the primary goal of normalizing a relational schema (e.g., to 3NF)?
  options:
  - "To duplicate data across many tables so that read-heavy queries avoid joins and run faster"
  - "To remove all secondary indexes from the schema so that writes never incur index-maintenance cost"
  - "To collapse every entity into a single very wide table so all data lives in one place for scans"
  - "To eliminate redundancy so each fact is stored once, avoiding update anomalies"
  answer: 3
  explanation: |
    Normalization removes redundancy so a fact lives in one place, preventing
    update anomalies and saving storage. Duplicating for read speed is
    denormalization; it is unrelated to removing indexes or single wide tables.
  ref: "concepts.md#normalization-versus-denormalization"

- id: databases-sql-nosql-sharding-replication-013
  difficulty: intermediate
  tags: [denormalization, reads, tradeoffs]
  question: |
    An interviewer notes reads outnumber writes 500:1 on the home feed. You propose
    storing each post with the author's display name embedded rather than joining
    to the users table. What is the key trade-off you are accepting?
  options:
  - "Faster reads (no join) at the cost of update fan-out — if an author renames, you must update the copy in every post"
  - "Reads get slower because of the embedded field, but total storage shrinks since the users table is dropped"
  - "You gain referential integrity automatically, because the embedded name stays foreign-keyed to the users table"
  - "You permanently lose the ability to query or filter posts by their author once the name is embedded inline"
  answer: 0
  explanation: |
    Denormalization (embedding the name) speeds reads by removing the join but
    creates update fan-out and duplication risk when the source value changes. It
    doesn't shrink storage, doesn't add referential integrity, and doesn't prevent
    querying by author.
  ref: "concepts.md#normalization-versus-denormalization"

- id: databases-sql-nosql-sharding-replication-014
  difficulty: advanced
  tags: [denormalization, source-of-truth, cdc]
  question: |
    When you denormalize a read path aggressively, what is the recommended way to
    keep the duplicated data correct without scattering write logic?
  options:
  - "Delete the normalized source once the denormalized copies exist, so writes only ever touch the fast read path"
  - "Keep a normalized system of record and derive denormalized copies (via app logic, materialized views, or CDC) so there is one authoritative place to fix data"
  - "Never update the denormalized copies after the initial load; treat the stale data as permanently acceptable"
  - "Denormalize by turning off all foreign-key and check constraints and relying on the application to stay consistent"
  answer: 1
  explanation: |
    Best practice is to keep a normalized source of truth and derive the
    denormalized read copies (materialized views / CDC / app projections), so
    corrections happen in one place. Deleting the source, never updating copies, or
    abandoning constraints all lead to unrecoverable inconsistency.
  ref: "concepts.md#normalization-versus-denormalization"

  # ---------------- Indexing ----------------
- id: databases-sql-nosql-sharding-replication-015
  difficulty: beginner
  tags: [indexing, btree]
  question: |
    Why are B+tree indexes the default in relational databases rather than hash
    indexes?
  options:
  - "Hash indexes can only key on strings and cannot store integer or numeric columns as their keys"
  - "B+trees are immutable once built and never need to be updated when rows are inserted or deleted"
  - "B+trees support both point lookups and ordered range scans / sorting, whereas hash indexes only do equality lookups"
  - "Hash indexes always require several times more disk space than the equivalent B+tree on the same column"
  answer: 2
  explanation: |
    B+trees keep keys sorted, so they serve equality, range scans, and ordered
    iteration; hash indexes give O(1) equality but no ranges or ordering. Both need
    updating on writes, and the choice isn't about integer storage or a blanket
    disk claim.
  ref: "concepts.md#indexing-and-index-data-structures"

- id: databases-sql-nosql-sharding-replication-016
  difficulty: beginner
  tags: [indexing, writes, tradeoffs]
  question: |
    What is the main cost of adding many indexes to a table?
  options:
  - "Reads that filter on the indexed columns become progressively slower as more indexes are added"
  - "Once several indexes exist the table can no longer be queried directly and needs a rebuild first"
  - "It disables the cost-based query optimizer, forcing every statement to fall back to a sequential scan"
  - "Every insert/update must maintain all relevant indexes, slowing writes and using more storage"
  answer: 3
  explanation: |
    Indexes speed matching reads but each write must update every relevant index,
    so writes slow and storage grows (write amplification). Indexes don't slow the
    reads they serve, don't block querying, and don't disable the optimizer.
  ref: "concepts.md#indexing-and-index-data-structures"

- id: databases-sql-nosql-sharding-replication-017
  difficulty: intermediate
  tags: [indexing, composite, leftmost-prefix]
  question: |
    You have a composite index on (tenant_id, created_at). Which query can it serve
    efficiently by the leftmost-prefix rule?
  options:
  - "WHERE tenant_id = 42 ORDER BY created_at"
  - "WHERE created_at > '2026-01-01' (no tenant_id filter)"
  - "WHERE status = 'active'"
  - "A filter on created_at only, ignoring tenant_id entirely"
  answer: 0
  explanation: |
    A composite index on (a, b) serves filters that start with the leftmost
    column: filtering tenant_id and ordering by created_at uses it fully. Filtering
    only created_at (skipping the leading column) or an unrelated column can't use
    the index efficiently.
  ref: "concepts.md#indexing-and-index-data-structures"

- id: databases-sql-nosql-sharding-replication-018
  difficulty: intermediate
  tags: [indexing, covering-index]
  question: |
    What is a "covering index" and why is it useful?
  options:
  - "An index that spans and covers every column of every table in the entire database schema at once"
  - "An index that includes all columns a query needs, so the query is answered from the index alone without touching the base table"
  - "An index that automatically takes over query traffic and covers for a failed replica during an outage"
  - "A redundant backup copy of an index kept on another node purely for disaster-recovery purposes"
  answer: 1
  explanation: |
    A covering index contains all columns the query reads (filter + select), so the
    engine can satisfy the query index-only, avoiding base-table lookups. It's not
    "every column", not a failover mechanism, and not a backup.
  ref: "concepts.md#indexing-and-index-data-structures"

- id: databases-sql-nosql-sharding-replication-019
  difficulty: advanced
  tags: [indexing, cardinality, selectivity]
  question: |
    Why might indexing a low-cardinality boolean column (e.g., is_deleted) often be
    counterproductive?
  options:
  - "The database engine physically forbids building any index on a boolean-typed column and rejects the CREATE INDEX statement at parse time"
  - "Indexing a boolean column silently corrupts the underlying B+tree pages whenever the stored value flips, forcing a full table rebuild to recover"
  - "The index has low selectivity — it matches a large fraction of rows — so the optimizer often prefers a sequential scan, while the index still slows writes"
  - "Adding the index automatically rewrites the table into third normal form, splitting the boolean into a separate lookup table you must now join"
  answer: 2
  explanation: |
    Low-cardinality columns return many rows per value (low selectivity), so an
    index scan plus row fetches is usually costlier than a sequential scan; you pay
    write overhead for little read benefit. Booleans can be indexed (partial
    indexes can even help), and indexing has nothing to do with corruption or
    normalization.
  ref: "concepts.md#indexing-and-index-data-structures"

- id: databases-sql-nosql-sharding-replication-020
  difficulty: advanced
  tags: [indexing, vector, ann, genai]
  question: |
    For a RAG system doing nearest-neighbor search over millions of text
    embeddings, which index type is appropriate and what is the core trade-off?
  options:
  - "A B+tree keyed on the raw serialized vector bytes, which sorts embeddings lexicographically and returns exact nearest neighbors by ordered range scan"
  - "A hash index over the full vector, which buckets identical embeddings and returns the exact nearest neighbors of any query in constant O(1) time"
  - "A full-text inverted index over the embedding values, since embeddings ultimately derive from text and tokenization ranks the closest matches"
  - "An ANN index such as HNSW or IVF-PQ, trading a small loss of recall for large gains in query speed and (for PQ) memory"
  answer: 3
  explanation: |
    High-dimensional similarity search uses approximate nearest neighbor indexes
    (HNSW, IVF-PQ) that trade a little recall for big speed/memory wins. B+tree and
    hash indexes do exact key comparisons, not distance-based nearest neighbors;
    an inverted index matches tokens, not vector distance.
  ref: "concepts.md#indexing-and-index-data-structures"

  # ---------------- Query optimization ----------------
- id: databases-sql-nosql-sharding-replication-021
  difficulty: intermediate
  tags: [query-optimization, explain]
  question: |
    EXPLAIN ANALYZE on a slow query shows a sequential scan of a 50M-row table for
    a highly selective WHERE predicate. What is the most likely fix?
  options:
  - "Add an index on the filtered column so the optimizer can do an index scan"
  - "Rewrite the query to SELECT * so the planner has every column available to build a faster plan"
  - "Add more read replicas so the 50M-row scan is spread in parallel across the replica pool"
  - "Increase the isolation level to Serializable so the planner is allowed to pick an index scan"
  answer: 0
  explanation: |
    A seq scan for a selective predicate usually means no usable index — adding one
    lets the optimizer do an index scan. SELECT * makes things worse; replicas
    don't change a single query's plan; and higher isolation adds locking overhead
    without fixing the access path.
  ref: "concepts.md#query-optimization-and-execution-plans"

- id: databases-sql-nosql-sharding-replication-022
  difficulty: intermediate
  tags: [query-optimization, n-plus-1]
  question: |
    An API endpoint runs one query to fetch 100 orders, then one query per order to
    fetch its customer — 101 queries total. What is this anti-pattern and the fix?
  options:
  - "It's the write-amplification problem; fix by adding more indexes so each child fetch resolves faster"
  - "It's the N+1 query problem; fix by batching (IN clause) or a single join"
  - "It's replication lag; fix by switching the child reads to synchronous replication so they return fresh"
  - "It's a hot partition; fix by resharding so the 101 queries spread across more shards"
  answer: 1
  explanation: |
    Issuing one query per parent row is the N+1 problem; batch the child fetches
    with an IN clause or use a single join. It isn't write amplification,
    replication lag, or a partition hotspot.
  ref: "concepts.md#query-optimization-and-execution-plans"

- id: databases-sql-nosql-sharding-replication-023
  difficulty: advanced
  tags: [query-optimization, sargability]
  question: |
    Which query change is most likely to make a predicate "sargable" (able to use
    an index on the created_at column)?
  options:
  - "Wrap created_at in additional functions like DATE(EXTRACT(created_at)) so the planner precomputes the value once"
  - "Append ORDER BY RAND() to the query so the engine shuffles rows and lands on the indexed range faster"
  - "Change WHERE DATE(created_at) = '2026-07-15' to WHERE created_at >= '2026-07-15' AND created_at < '2026-07-16'"
  - "Cast created_at to text with created_at::text before comparing so the index compares strings directly"
  answer: 2
  explanation: |
    Applying a function to an indexed column (DATE(created_at)) prevents index use;
    rewriting to a range on the raw column is sargable and uses the index. Adding
    functions/casts or ORDER BY RAND() only hurts.
  ref: "concepts.md#query-optimization-and-execution-plans"

  # ---------------- Storage engines ----------------
- id: databases-sql-nosql-sharding-replication-024
  difficulty: intermediate
  tags: [storage-engine, lsm, btree]
  question: |
    Which statement best contrasts LSM-trees and B-trees?
  options:
  - "LSM-trees mutate their SSTable pages in place on every write, while B-trees only ever append new nodes to the end of the file"
  - "B-trees cannot support ordered range scans because their leaves are unsorted, whereas LSM-trees keep every key globally sorted on disk"
  - "LSM-trees never require compaction because obsolete versions are overwritten immediately as part of each individual write"
  - "LSM-trees buffer writes in memory and flush sequentially (high write throughput); B-trees update pages in place (predictable single-lookup reads)"
  answer: 3
  explanation: |
    LSM-trees append via memtable→SSTable flushes and merge with compaction, giving
    high write throughput; B-trees update in place with a WAL, giving predictable
    single-lookup reads. B-trees do support range scans, and LSM-trees very much
    require compaction.
  ref: "concepts.md#storage-engines-lsm-tree-versus-b-tree"

- id: databases-sql-nosql-sharding-replication-025
  difficulty: intermediate
  tags: [storage-engine, bloom-filter]
  question: |
    What role do bloom filters play in an LSM-tree read path?
  options:
  - "They let a read quickly skip SSTables that definitely do not contain a key, avoiding needless disk I/O (no false negatives, tunable false positives)"
  - "They cache the actual row values for recently written keys in memory so most reads never touch an SSTable at all"
  - "They replace the write-ahead log as the durability mechanism, since the filter itself is persisted and replayed on crash recovery"
  - "They deterministically guarantee that a key exists in an SSTable before the read path bothers to open and scan that file"
  answer: 0
  explanation: |
    A bloom filter is a probabilistic set-membership structure: it can say
    "definitely not present" (no false negatives) so reads skip SSTables lacking
    the key, cutting disk I/O. It has false positives (so it can't guarantee
    presence), doesn't store values, and isn't a WAL replacement.
  ref: "concepts.md#storage-engines-lsm-tree-versus-b-tree"

- id: databases-sql-nosql-sharding-replication-026
  difficulty: advanced
  tags: [storage-engine, workload-fit, tradeoffs]
  question: |
    A time-series metrics platform ingests 1M writes/sec with mostly recent-range
    reads. Which storage engine choice and rationale is best?
  options:
  - "B-tree, because rewriting pages in place minimizes write amplification and is ideal for a sustained append-heavy ingest of 1M writes/sec"
  - "LSM-tree, because sequential append writes give high write throughput and good compression, and bloom filters plus recency keep reads acceptable"
  - "B-tree, because bloom filters are a B-tree-only feature and are required to keep the recent-range reads fast at this volume"
  - "Neither; a workload of 1M timestamped writes per second can only be modeled as nodes and edges in a graph database"
  answer: 1
  explanation: |
    Write-heavy ingest is the LSM sweet spot: sequential appends, high throughput,
    strong compression; reads lean on bloom filters and recency. B-trees do random
    in-place writes (worse for this), bloom filters are an LSM feature, and graph
    DBs are irrelevant to time-series.
  ref: "concepts.md#storage-engines-lsm-tree-versus-b-tree"

- id: databases-sql-nosql-sharding-replication-027
  difficulty: expert
  tags: [storage-engine, amplification, compaction]
  question: |
    Which statement about amplification trade-offs in LSM-trees is correct?
  options:
  - "LSM-trees simultaneously achieve low write amplification and low space amplification because compaction runs for free with no extra I/O cost"
  - "LSM-trees eliminate read amplification entirely because each key is guaranteed to live in exactly one SSTable at any moment"
  - "LSM-trees reduce write random-I/O but compaction introduces write amplification and can cause read-latency spikes; space amplification is higher until compaction reclaims old versions"
  - "Compaction reduces read amplification but has no effect whatsoever on the space consumed by obsolete overwritten row versions"
  answer: 2
  explanation: |
    LSM writes are sequential but compaction rewrites data (write amplification) and
    can spike read latency; old/overwritten versions inflate space until compaction
    reclaims them. A key can exist in multiple SSTables (read amplification exists),
    and compaction reclaims space, so the other options are wrong.
  ref: "concepts.md#storage-engines-lsm-tree-versus-b-tree"

  # ---------------- Sharding ----------------
- id: databases-sql-nosql-sharding-replication-028
  difficulty: beginner
  tags: [sharding, partitioning, fundamentals]
  question: |
    What problem does horizontal sharding primarily solve that read replicas do
    not?
  options:
  - "It scales read throughput by fanning identical read queries out across the shards, which read replicas cannot do"
  - "It removes the need for any secondary indexes because each shard is small enough to scan sequentially on every query"
  - "It guarantees strong global consistency across all data by keeping every shard in lockstep, which replicas cannot"
  - "It scales write throughput and total storage by splitting the dataset across multiple primaries"
  answer: 3
  explanation: |
    Sharding partitions data across multiple primaries, scaling writes and storage;
    read replicas only scale reads (writes still hit one primary). Sharding doesn't
    remove indexes or guarantee global strong consistency — in fact cross-shard
    consistency gets harder.
  ref: "concepts.md#partitioning-and-sharding-strategies"

- id: databases-sql-nosql-sharding-replication-029
  difficulty: intermediate
  tags: [sharding, range, hash, tradeoffs]
  question: |
    What is the main trade-off between range partitioning and hash partitioning?
  options:
  - "Range partitioning always distributes load perfectly evenly but forbids range scans, while hash partitioning creates hotspots yet excels at ordered range scans"
  - "Range preserves ordering for range scans but risks hotspots on skewed/monotonic keys; hash distributes evenly but destroys range-scan locality"
  - "They are identical in every respect and differ only in the name of the configuration flag you set"
  - "Hash partitioning is mathematically limited to distributing data across at most two nodes and cannot scale beyond a pair"
  answer: 1
  explanation: |
    Range keeps keys ordered (great for range scans) but can hotspot on skewed or
    monotonic keys; hashing spreads load evenly but loses range-scan locality. The
    first option reverses the properties; they aren't identical; and hashing scales
    to many nodes.
  ref: "concepts.md#partitioning-and-sharding-strategies"

- id: databases-sql-nosql-sharding-replication-030
  difficulty: intermediate
  tags: [sharding, shard-key, hotspots]
  question: |
    A system shards by an auto-incrementing order ID. Writes concentrate on one
    shard and it becomes a bottleneck. Why, and what is a better key?
  options:
  - "Monotonic keys route all new writes to the last shard (hotspot); use a high-cardinality, evenly-distributed key such as hash(order_id) or a well-distributed business key"
  - "The auto-increment ID is far too random and scatters related writes; switch to a strictly monotonic ingestion timestamp so writes land together and stay ordered"
  - "The configured shard count is too high, which fragments the write path; consolidate down to a single shard so all writes hit one well-tuned primary"
  - "Auto-increment integer IDs are structurally invalid as a primary key on a sharded table, so the engine silently funnels every write to shard zero"
  answer: 0
  explanation: |
    Monotonically increasing keys send every new write to the highest range/shard,
    creating a write hotspot; hashing the ID (or choosing an evenly distributed
    key) spreads writes. A timestamp is also monotonic (worse), reducing to one
    shard defeats sharding, and auto-increment IDs are valid PKs.
  ref: "concepts.md#partitioning-and-sharding-strategies"

- id: databases-sql-nosql-sharding-replication-031
  difficulty: advanced
  tags: [sharding, scatter-gather, shard-key]
  question: |
    Your app shards users by user_id, but a new feature must query "all orders
    placed in the last hour across all users." What is the performance concern?
  options:
  - "None at all; sharding by user_id transparently accelerates every query, including cross-user time-range scans, by parallelizing them"
  - "It becomes a scatter-gather query that must fan out to every shard and merge results, bounded by the slowest shard"
  - "It will automatically route to only one shard, because the router infers the time window maps to a single partition"
  - "It violates ACID isolation guarantees across shards and the engine will refuse to execute the cross-user query"
  answer: 1
  explanation: |
    A query that doesn't include the shard key (user_id) must fan out to all shards
    and merge — scatter-gather — and is limited by the slowest shard. Sharding
    doesn't make cross-shard queries faster, won't hit one shard, and this is a
    performance issue, not an ACID violation.
  ref: "concepts.md#partitioning-and-sharding-strategies"

- id: databases-sql-nosql-sharding-replication-032
  difficulty: advanced
  tags: [sharding, resharding, consistent-hashing]
  question: |
    Why do systems like Cassandra use consistent hashing with virtual nodes instead
    of hash(key) % N for partitioning?
  options:
  - "Because the modulo operation in hash(key) % N is far faster to compute per request once the cluster grows past a few dozen nodes"
  - "Because consistent hashing mathematically guarantees zero replication lag between the replicas that own each key range"
  - "Because changing N in hash(key) % N remaps nearly all keys; consistent hashing moves only ~1/N of keys when a node is added/removed, and vnodes smooth imbalance"
  - "Because the modulo scheme hash(key) % N only works on integer keys and cannot hash arbitrary string partition keys at all"
  answer: 2
  explanation: |
    With modulo hashing, changing the node count reshuffles almost every key;
    consistent hashing limits movement to about 1/N of keys and virtual nodes even
    out load. It's not about raw compute speed, replication lag, or string keys.
  ref: "concepts.md#partitioning-and-sharding-strategies"

- id: databases-sql-nosql-sharding-replication-033
  difficulty: advanced
  tags: [sharding, directory, tradeoffs]
  question: |
    What is the primary trade-off of directory/lookup-based sharding versus pure
    hash-based sharding?
  options:
  - "The directory automatically detects and eliminates every hotspot by continuously reshuffling hot keys to idle shards with no operator involvement"
  - "Directory-based sharding physically cannot rebalance data once the initial mapping is written, so it is strictly less flexible than hashing"
  - "Hash-based sharding secretly maintains a directory of its own internally, so the two approaches are functionally identical in practice"
  - "The directory gives maximum rebalancing flexibility (just edit the map) but adds a lookup hop and becomes a potential bottleneck / single point of failure"
  answer: 3
  explanation: |
    A directory maps keys to shards, so you rebalance by editing the map — very
    flexible — but every request consults it, adding a hop and a potential
    SPOF/bottleneck (usually made HA). It doesn't auto-eliminate hotspots, it can
    rebalance, and hash sharding needs no directory.
  ref: "concepts.md#partitioning-and-sharding-strategies"

- id: databases-sql-nosql-sharding-replication-034
  difficulty: expert
  tags: [sharding, dynamodb, write-sharding]
  question: |
    A DynamoDB table has a partition key "event_type" where one value ("click")
    receives 90% of writes, throttling that partition. Which mitigation directly
    addresses the hot partition?
  options:
  - "Write-shard the hot key by appending a bounded random/computed suffix (e.g., click#0..click#N) to spread writes across partitions, and query all suffixes on read"
  - "Increase the provisioned read capacity units on the table so the throttled partition gains the headroom to absorb the incoming write burst"
  - "Enable strongly consistent reads on the table so writes to the click partition are acknowledged and distributed more evenly"
  - "Switch the table to a graph data model so the click events become edges that DynamoDB spreads automatically across partitions"
  answer: 0
  explanation: |
    A single hot partition key concentrates writes; adding a suffix (write sharding)
    spreads them across many physical partitions, at the cost of gather-on-read.
    Read capacity and consistent reads don't fix a write hotspot, and switching data
    models is unnecessary.
  ref: "concepts.md#partitioning-and-sharding-strategies"

  # ---------------- Replication topologies ----------------
- id: databases-sql-nosql-sharding-replication-035
  difficulty: beginner
  tags: [replication, leader-follower]
  question: |
    In single-leader (leader-follower) replication, where do writes go?
  options:
  - "To any replica the client chooses, and that replica later gossips the change back to the leader for ordering"
  - "Only to the leader, which streams changes to read-only followers"
  - "To all replicas simultaneously in a single fan-out broadcast issued directly by the client on every write"
  - "Writes are rejected entirely because a leader-follower topology is a read-only reporting configuration"
  answer: 1
  explanation: |
    In leader-follower, all writes go to the single leader, which replicates to
    read-only followers. Clients don't write to arbitrary replicas or to all at
    once, and the system does accept writes (at the leader).
  ref: "concepts.md#replication-leader-follower-multi-leader-leaderless"

- id: databases-sql-nosql-sharding-replication-036
  difficulty: intermediate
  tags: [replication, multi-leader, conflicts]
  question: |
    What new problem does multi-leader (master-master) replication introduce that
    single-leader replication does not?
  options:
  - "Read scaling limits, because spreading reads across multiple leaders overwhelms the shared replication stream"
  - "The need for secondary indexes on every table, which single-leader setups can safely omit entirely"
  - "Write conflicts — the same row can be edited on two leaders and must be reconciled (LWW, app merge, CRDTs)"
  - "Durability of committed writes, since a second leader cannot flush its write-ahead log to stable storage"
  answer: 2
  explanation: |
    With multiple leaders accepting writes, the same record can be modified in two
    places concurrently, requiring conflict resolution. Single-leader avoids this
    because there's one write path. Read scaling and durability aren't unique
    new problems, and indexes are unrelated.
  ref: "concepts.md#replication-leader-follower-multi-leader-leaderless"

- id: databases-sql-nosql-sharding-replication-037
  difficulty: advanced
  tags: [replication, leaderless, quorum]
  question: |
    In a leaderless (Dynamo-style) store with N=3 replicas, which quorum
    configuration guarantees a read observes the latest acknowledged write?
  options:
  - "W=1, R=1 (W + R = 2)"
  - "W=1, R=2 (W + R = 3 = N)"
  - "W=3, R=0 (reads skip replicas)"
  - "W=2, R=2 (W + R = 4 > N)"
  answer: 3
  explanation: |
    Overlap requires W + R > N. With N=3, W=2 and R=2 gives 4 > 3, guaranteeing the
    read set intersects the write set. W+R equal to or below N (2 or 3) doesn't
    guarantee overlap, and R=0 reads nothing.
  ref: "concepts.md#replication-leader-follower-multi-leader-leaderless"

- id: databases-sql-nosql-sharding-replication-038
  difficulty: advanced
  tags: [replication, topology-choice, scenario]
  question: |
    A collaborative document editor must let users keep editing offline and sync
    later across regions, converging automatically. Which replication approach fits
    best?
  options:
  - "Multi-leader (or leaderless) replication with conflict resolution such as CRDTs, enabling local writes and eventual convergence"
  - "Single-leader replication with synchronous copies to one nearby region, forcing every offline edit to queue until that leader is reachable again"
  - "A single global primary that every region routes each read and write to, so no device can commit changes while it is offline or partitioned away"
  - "Read-only replicas in each region with writes disabled while offline, syncing edits only once the client reconnects to the primary datacenter"
  answer: 0
  explanation: |
    Offline, multi-region, always-writable editing needs multiple write points and
    automatic convergence — multi-leader/leaderless with CRDTs. A single leader
    (sync or global) can't accept local offline writes across regions, and
    read-only replicas can't take writes at all.
  ref: "concepts.md#replication-leader-follower-multi-leader-leaderless"

- id: databases-sql-nosql-sharding-replication-039
  difficulty: expert
  tags: [replication, failover, split-brain]
  question: |
    During an async single-leader failover, the old leader briefly comes back
    thinking it is still leader while a new leader has been promoted. What is the
    danger and a standard mitigation?
  options:
  - "No danger at all; the two leaders can both keep accepting writes safely because the replication stream automatically interleaves and de-duplicates them"
  - "Split-brain — two leaders accept divergent writes; mitigate with fencing tokens/epochs and quorum-based leader election so the stale leader is rejected"
  - "The only danger is temporarily slower reads while both nodes are up; mitigate simply by adding more read replicas to absorb the extra query load"
  - "The danger is corruption of the B+tree indexes on the promoted node; mitigate by rebuilding every secondary index once the old leader rejoins the cluster"
  answer: 1
  explanation: |
    Two nodes believing they're leader (split-brain) causes divergent, conflicting
    writes and possible data loss. Fencing tokens/epoch numbers plus quorum
    election ensure the stale leader's writes are rejected. It's not a mere read
    slowdown or index issue.
  ref: "concepts.md#replication-leader-follower-multi-leader-leaderless"

  # ---------------- Sync vs async / lag ----------------
- id: databases-sql-nosql-sharding-replication-040
  difficulty: beginner
  tags: [replication, sync, async]
  question: |
    What is the key difference between synchronous and asynchronous replication on
    write acknowledgement?
  options:
  - "Synchronous acks the client immediately and copies later, while asynchronous is the one that blocks the write until every replica confirms the change"
  - "Both modes wait for all replicas to durably confirm before acking; they differ only in the wire protocol used to ship the log records between nodes"
  - "Sync waits for replica(s) to confirm before acking (no data loss, higher latency); async acks immediately and replicates in background (low latency, possible data loss on leader crash)"
  - "Neither mode can ever lose an acknowledged write under any failure, because both persist the change to a quorum of replicas before returning to the client"
  answer: 2
  explanation: |
    Synchronous replication waits for replica confirmation (durable, slower);
    asynchronous acks first and copies later (fast, but a leader crash can lose the
    un-replicated tail). The other options invert or overstate the guarantees.
  ref: "concepts.md#synchronous-versus-asynchronous-replication-and-replication-lag"

- id: databases-sql-nosql-sharding-replication-041
  difficulty: intermediate
  tags: [replication, read-your-writes, lag]
  question: |
    A user updates their profile, is immediately redirected to a page that reads
    from an async replica, and sees the old data. What is happening and a clean fix?
  options:
  - "The database has silently corrupted the profile row; take the primary offline and restore the whole table from last night's backup snapshot to recover it"
  - "A secondary index on the profile table is missing, so the read skips the fresh row; create the index and the redirect will immediately return the updated data"
  - "The profile write never actually committed on the primary; wrap it in an explicit transaction and retry the update until the redirected read finally shows it"
  - "Replication lag: the replica hasn't applied the write yet. Fix with read-your-writes — read from the primary for a short window, or track the write's LSN/version and route accordingly"
  answer: 3
  explanation: |
    The write committed on the primary but the async replica lags, so the read is
    stale. Read-your-writes routing (read the primary briefly, or use version/LSN
    tracking) fixes it. It's not corruption, a missing index, or a failed write.
  ref: "concepts.md#synchronous-versus-asynchronous-replication-and-replication-lag"

- id: databases-sql-nosql-sharding-replication-042
  difficulty: advanced
  tags: [replication, monotonic-reads]
  question: |
    A user refreshes a page twice; the first read hits a fresh replica and the
    second hits a more-lagged replica, so a comment they just saw disappears. Which
    guarantee is violated and how is it typically provided?
  options:
  - "Monotonic reads; provided by pinning a given user's reads to the same replica (so they never go backward in time)"
  - "Read-your-writes consistency; provided by switching the whole read path to synchronous cross-region replication so every replica always holds identical data"
  - "Durability of the comment; provided by adding a write-ahead log on each replica so committed rows survive and can never appear to vanish between reads"
  - "Atomicity of the refresh; provided by wrapping both page reads in a single two-phase-commit transaction so they observe one consistent snapshot"
  answer: 0
  explanation: |
    Seeing data then not seeing it (time going backward) violates monotonic reads;
    pinning a user to one replica (consistent hashing on user id) prevents it.
    That's distinct from read-your-writes, durability, or atomicity.
  ref: "concepts.md#synchronous-versus-asynchronous-replication-and-replication-lag"

- id: databases-sql-nosql-sharding-replication-043
  difficulty: advanced
  tags: [replication, semi-sync, quorum, tradeoffs]
  question: |
    Why do many production systems use semi-synchronous / majority-quorum commit
    instead of fully synchronous replication to all replicas?
  options:
  - "It guarantees literally zero commit latency, because a majority quorum lets the leader ack the write before any replica has received the log record"
  - "Waiting for only a majority (or at least one) bounds data loss while limiting latency to the fastest majority, so a single slow/failed replica doesn't stall all writes"
  - "It deliberately disables durability guarantees to gain speed, acknowledging each write purely from the leader's memory buffer without any replica persistence"
  - "Fully synchronous replication to all replicas is mathematically impossible to implement, so majority quorum is the only correct commit protocol that exists"
  answer: 1
  explanation: |
    Requiring a majority ack (Raft/Paxos style) bounds data loss yet only waits on
    the fastest majority, so one lagging replica can't block commits — unlike
    wait-for-all sync. It doesn't give zero latency, doesn't disable durability, and
    full sync is implementable (just fragile).
  ref: "concepts.md#synchronous-versus-asynchronous-replication-and-replication-lag"

  # ---------------- Read replicas ----------------
- id: databases-sql-nosql-sharding-replication-044
  difficulty: beginner
  tags: [read-replicas, scaling]
  question: |
    What is the primary benefit of adding read replicas to a leader-follower setup?
  options:
  - "It scales write throughput, because each follower can independently accept and commit writes that the primary later merges back into the master copy"
  - "It guarantees every read is perfectly fresh, since followers apply each change synchronously before the primary acknowledges the originating write"
  - "It offloads read queries from the primary, scaling read capacity and isolating reporting/analytics"
  - "It eliminates the need for a primary altogether, letting the pool of read replicas elect one of themselves to serve writes on demand"
  answer: 2
  explanation: |
    Read replicas serve reads, scaling read capacity and isolating heavy analytics
    from the primary. They don't scale writes (still one primary), don't guarantee
    freshness (async lag), and the primary is still required for writes.
  ref: "concepts.md#read-replicas-and-read-scaling"

- id: databases-sql-nosql-sharding-replication-045
  difficulty: intermediate
  tags: [read-replicas, ordering, scaling]
  question: |
    A read-heavy service is close to overloading its primary. Following a sensible
    scaling progression, what should you typically try before adding many read
    replicas?
  options:
  - "Immediately shard the database across many primaries, since splitting the dataset is the cheapest first step for a read-bound primary nearing overload"
  - "Switch to multi-leader replication so several nodes share the read pressure, accepting the write-conflict resolution that this topology introduces"
  - "Rewrite the application in a faster compiled language, on the assumption that the primary's CPU is the true bottleneck behind the read load"
  - "Add caching (e.g., read-through Redis) to absorb hot reads, since it cuts load cheaply before you fan out to replicas"
  answer: 3
  explanation: |
    Caching absorbs hot reads cheaply and is a lower-complexity earlier step than
    spinning up many replicas or sharding. Sharding and multi-leader add far more
    complexity, and language choice is irrelevant to the bottleneck.
  ref: "concepts.md#read-replicas-and-read-scaling"

- id: databases-sql-nosql-sharding-replication-046
  difficulty: advanced
  tags: [read-replicas, replication-lag, failure-mode]
  question: |
    Under a sustained write burst, your read replicas fall further and further
    behind. What failure mode is this and what does it imply for reads?
  options:
  - "Growing replication lag — replicas replaying heavy writes can't keep up, so reads served from them become increasingly stale"
  - "Split-brain between the primary and its replicas; every read becomes unavailable until an operator manually reconciles the diverged copies"
  - "Write amplification on the replicas; the extra rewrites paradoxically make replica reads faster and fresher as the burst continues"
  - "A distributed deadlock on the replication stream; the primary detects it and stops accepting any new writes until the burst subsides"
  answer: 0
  explanation: |
    Heavy write volume can outpace replica apply throughput, so lag grows and
    replica reads get staler. It's not split-brain (that's dual leaders), not write
    amplification's effect, and not a deadlock on the primary.
  ref: "concepts.md#read-replicas-and-read-scaling"

  # ---------------- Distributed txns / 2PC ----------------
- id: databases-sql-nosql-sharding-replication-047
  difficulty: intermediate
  tags: [distributed-transactions, two-phase-commit]
  question: |
    In two-phase commit, what happens in the "prepare" phase?
  options:
  - "Each participant immediately commits its local changes and releases all locks, then reports the finished result back to the coordinator for tallying"
  - "The coordinator asks each participant to vote yes/no and hold locks; only if all vote yes does it then send commit"
  - "The coordinator runs a leader-election round to pick which participant will act as the single authority for the rest of the transaction"
  - "The transaction's data is hashed on the coordinator and partitioned across the participants so each one owns a disjoint slice of the write"
  answer: 1
  explanation: |
    Phase one is prepare/vote: participants durably prepare and hold locks, voting
    yes or no; phase two commits only if all voted yes (else abort). It's not an
    immediate commit, a leader election, or partitioning.
  ref: "concepts.md#distributed-transactions-and-two-phase-commit"

- id: databases-sql-nosql-sharding-replication-048
  difficulty: advanced
  tags: [distributed-transactions, 2pc, blocking]
  question: |
    What is the fundamental availability weakness of classic 2PC?
  options:
  - "It consumes too little network bandwidth between the coordinator and participants, so commits are throttled and cannot use the available link capacity"
  - "It cannot actually guarantee atomicity across participants, so some resources may commit while others abort even when every node votes to commit"
  - "It is blocking: if the coordinator crashes after participants prepare, they hold locks in an uncertain state until it recovers, stalling those resources"
  - "It only works when all participating resources live on a single node, and fails outright the moment the transaction spans more than one machine"
  answer: 2
  explanation: |
    2PC's core flaw is blocking on coordinator failure: prepared participants hold
    locks and can't unilaterally decide, freezing resources until recovery. It does
    guarantee atomicity (that's its point) and is inherently multi-node; bandwidth
    isn't the issue.
  ref: "concepts.md#distributed-transactions-and-two-phase-commit"

- id: databases-sql-nosql-sharding-replication-049
  difficulty: advanced
  tags: [distributed-transactions, saga, tradeoffs]
  question: |
    A cross-service order workflow (payment, inventory, shipping) needs atomic-ish
    behavior without distributed locks. Choosing a saga over 2PC, what do you gain
    and give up?
  options:
  - "Gain full serializable isolation across all three services; give up availability, since the saga must lock every step until the workflow finishes end to end"
  - "Gain strong cross-service consistency and give up nothing, because the saga coordinator commits payment, inventory, and shipping as one atomic unit of work"
  - "Gain single-node simplicity by collapsing the workflow onto one database; give up the ability to undo any step once it has been applied locally"
  - "Gain availability and no distributed locks; give up isolation and strong consistency — you must design idempotent compensating actions and tolerate visible intermediate states"
  answer: 3
  explanation: |
    Sagas run local transactions with compensations, gaining availability and
    avoiding cross-service locks, but they provide only eventual consistency and no
    isolation, so you must handle idempotency, compensation, and intermediate
    visibility. They don't give serializable isolation or free strong consistency.
  ref: "concepts.md#distributed-transactions-and-two-phase-commit"

- id: databases-sql-nosql-sharding-replication-050
  difficulty: expert
  tags: [distributed-transactions, colocation, design]
  question: |
    What is the most robust design principle for minimizing the need for
    distributed transactions in a sharded system?
  options:
  - "Choose the shard key so that data updated together in a transaction colocates on the same shard, turning most transactions into single-shard local transactions"
  - "Always wrap every single write in a two-phase-commit protocol across all shards, so the system is uniformly prepared for any transaction that spans partitions"
  - "Disable transactions entirely and let the application layer reconcile inconsistencies afterward, since cross-shard atomicity is impossible to achieve anyway"
  - "Replicate every shard synchronously to every other shard, so any node already holds all the data a distributed transaction would otherwise need to reach"
  answer: 0
  explanation: |
    If you pick a partition key so related, co-updated data lives on one shard, most
    transactions become single-shard and need no distributed protocol. Blanket 2PC
    is slow/blocking, disabling transactions loses correctness, and cross-shard sync
    replication doesn't solve transactional atomicity.
  ref: "concepts.md#distributed-transactions-and-two-phase-commit"

  # ---------------- CDC ----------------
- id: databases-sql-nosql-sharding-replication-051
  difficulty: intermediate
  tags: [cdc, sync, kafka]
  question: |
    What does Change Data Capture (CDC) do?
  options:
  - "It caches recent query results in memory and serves repeated reads from that cache so downstream systems avoid hitting the primary database directly"
  - "It tails the database's replication log (WAL/binlog/oplog) and streams row-level change events so downstream systems (search, cache, warehouse) stay in sync"
  - "It compresses the database's backup files with block-level deduplication so historical snapshots occupy far less storage in the archive tier"
  - "It automatically partitions the database across new shards as it grows, rebalancing rows so no single node holds a disproportionate share of the data"
  answer: 1
  explanation: |
    CDC reads the DB's commit log and publishes change events (via tools like
    Debezium → Kafka) so derived stores stay current in near-real-time. It is not a
    cache, a backup compressor, or an auto-sharder.
  ref: "concepts.md#change-data-capture-and-keeping-systems-in-sync"

- id: databases-sql-nosql-sharding-replication-052
  difficulty: advanced
  tags: [cdc, dual-write, outbox]
  question: |
    Why is CDC (or the transactional outbox pattern) preferred over having the
    application write to both the database and Kafka directly?
  options:
  - "Dual-writes are always faster and perfectly consistent, because the application can commit to the database and to Kafka inside one shared distributed transaction"
  - "Kafka has no other ingestion path, so an application-level dual-write is the only mechanism capable of delivering change events into a topic at all"
  - "A dual-write is not atomic — a crash between the two writes leaves them inconsistent; CDC/outbox derives events from the committed DB state, keeping one source of truth"
  - "CDC removes the need for a primary database entirely, since the Kafka log itself becomes the durable system of record for all application state"
  answer: 2
  explanation: |
    Writing to the DB and to Kafka separately can't be made atomic; a failure
    between them causes divergence. Outbox (write event in the same DB transaction)
    plus CDC ensures events reflect committed state with one source of truth.
    Dual-writes aren't consistent, and CDC doesn't replace the DB.
  ref: "concepts.md#change-data-capture-and-keeping-systems-in-sync"

- id: databases-sql-nosql-sharding-replication-053
  difficulty: advanced
  tags: [cdc, search-index, scenario]
  question: |
    You must keep an Elasticsearch index in sync with your Postgres system of
    record with minimal coupling and near-real-time freshness. Which approach is
    best?
  options:
  - "Have the application write to Postgres and Elasticsearch in the same request path (dual-write)"
  - "Run a nightly full re-index job that rebuilds the entire Elasticsearch index from Postgres and accept up to 24 hours of staleness between runs"
  - "Query Elasticsearch as the primary system of record and treat Postgres as a downstream read-through cache that is refreshed only on a miss"
  - "Stream Postgres WAL changes via CDC (e.g., Debezium → Kafka) into an indexer that updates Elasticsearch"
  answer: 3
  explanation: |
    CDC from the WAL decouples the systems and gives near-real-time indexing with
    Postgres as the source of truth. Dual-write risks inconsistency, nightly
    re-index is far too stale, and treating Elasticsearch as primary inverts the
    source of truth.
  ref: "concepts.md#change-data-capture-and-keeping-systems-in-sync"

  # ---------------- Polyglot persistence ----------------
- id: databases-sql-nosql-sharding-replication-054
  difficulty: intermediate
  tags: [polyglot-persistence, tradeoffs]
  question: |
    What is the main downside of polyglot persistence (using several specialized
    databases)?
  options:
  - "Operational complexity: more systems to run, monitor, secure, and back up, plus keeping duplicated data consistent across them"
  - "Each specialized store performs its own niche workload worse than a single general-purpose database would, so query latency rises across the board"
  - "It is fundamentally impossible to keep data synchronized across the different stores, so divergence between them can never be detected or corrected"
  - "It reliably costs less than running a single database, because each specialized engine is cheaper to license and needs fewer operational resources"
  answer: 0
  explanation: |
    Polyglot persistence matches each workload to an ideal store but multiplies
    operational burden and cross-store consistency work (via CDC/sagas). Each store
    is better at its niche, sync is possible (just extra work), and it usually costs
    more, not less.
  ref: "concepts.md#polyglot-persistence-and-choosing-the-right-store"

- id: databases-sql-nosql-sharding-replication-055
  difficulty: advanced
  tags: [polyglot-persistence, boring-technology, judgment]
  question: |
    A startup proposes launching with Postgres, MongoDB, Cassandra, Neo4j, Redis,
    and Elasticsearch on day one. What is the strongest principal-engineer critique?
  options:
  - "The real gap is that they forgot to also add a dedicated vector database and a purpose-built time-series store to the stack, both of which are mandatory for any modern application launch alongside these six systems on day one"
  - "Start with one general-purpose store (often Postgres, which does JSON, FTS, geo, and vectors) and add specialized stores only when a concrete access pattern proves a bottleneck; six systems on day one is unjustified operational load"
  - "Postgres is technically incapable of running alongside another database in one deployment, since its connection pooler conflicts with any second engine and must be isolated"
  - "They should consolidate onto Cassandra alone and route every workload — relational joins, transactions, and full-text search — through it, since one wide-column engine covers all patterns"
  answer: 1
  explanation: |
    Each store must be justified by a real access pattern the incumbent can't serve;
    premature polyglot persistence adds enormous ops/on-call cost. Postgres covers
    many needs early. Adding more stores (vector) isn't the fix, Postgres composes
    fine, and Cassandra-for-everything (incl. transactions) is a poor fit.
  ref: "concepts.md#polyglot-persistence-and-choosing-the-right-store"

  # ---------------- Vector DBs ----------------
- id: databases-sql-nosql-sharding-replication-056
  difficulty: intermediate
  tags: [vector-db, genai, rag]
  question: |
    In a RAG pipeline, what is the primary job of a vector database?
  options:
  - "To hold the LLM's model weights and attention layers in a sharded on-disk format so inference can stream them into GPU memory on each request"
  - "To run the embedding model itself, converting raw input text into the dense vectors before any similarity search is performed downstream"
  - "To index embeddings and return the approximate nearest-neighbor vectors to a query embedding, so relevant context can ground the LLM"
  - "To incrementally fine-tune the underlying LLM on every incoming query, folding each retrieved document back into the model's parameters in real time"
  answer: 2
  explanation: |
    A vector DB indexes embeddings and serves ANN similarity search to retrieve
    relevant chunks for grounding. It doesn't store model weights, generate
    embeddings (an embedding model does that), or fine-tune the LLM.
  ref: "concepts.md#vector-databases-and-similarity-search"

- id: databases-sql-nosql-sharding-replication-057
  difficulty: advanced
  tags: [vector-db, pgvector, judgment]
  question: |
    A team already runs Postgres and needs semantic search over a few million
    chunks with metadata filtering. What is a reasonable first choice and why?
  options:
  - "Immediately stand up a dedicated multi-node distributed vector DB cluster with its own replication and sharding, provisioning for maximum scale up front"
  - "Store each vector as a JSON string in a text column and scan the whole table linearly, computing cosine distance in application code on every query"
  - "Adopt a graph database and model each embedding dimension as an edge, since high-dimensional vectors are fundamentally relationship structures between features"
  - "Use pgvector inside the existing Postgres, gaining vector ANN plus SQL metadata filters without operating a new system; move to a dedicated vector DB only at much larger scale"
  answer: 3
  explanation: |
    pgvector adds ANN indexing to Postgres, letting you combine vector search with
    SQL metadata filters and avoid a new system at this scale; escalate to a
    dedicated vector DB later. A full distributed cluster is premature, linear JSON
    scans don't scale, and graphs don't model embeddings.
  ref: "concepts.md#vector-databases-and-similarity-search"

- id: databases-sql-nosql-sharding-replication-058
  difficulty: expert
  tags: [vector-db, hnsw, ivf-pq, tradeoffs]
  question: |
    Comparing HNSW and IVF-PQ ANN indexes, which statement captures the trade-off?
  options:
  - "HNSW offers excellent recall/latency but is memory-hungry; IVF-PQ clusters and compresses vectors (product quantization) to cut memory at some recall/precision cost"
  - "HNSW's navigable-graph layout uses far less memory than IVF-PQ's inverted lists yet returns noticeably worse recall at any comparable query latency"
  - "IVF-PQ returns mathematically exact nearest neighbors because quantization is lossless, whereas HNSW is the only one of the two that is ever approximate"
  - "Both index types must retain every vector at full 32-bit precision on disk and in memory, and neither performs any form of compression or quantization"
  answer: 0
  explanation: |
    HNSW graphs give strong recall and low latency but consume a lot of memory;
    IVF-PQ uses clustering plus product quantization to shrink memory, trading some
    recall/precision. Both are approximate, and PQ specifically compresses vectors,
    so the other options are wrong.
  ref: "concepts.md#vector-databases-and-similarity-search"

  # ---------------- NewSQL ----------------
- id: databases-sql-nosql-sharding-replication-059
  difficulty: intermediate
  tags: [newsql, spanner, cockroachdb]
  question: |
    What problem does NewSQL / distributed SQL (Spanner, CockroachDB) aim to solve?
  options:
  - "Squeezing more single-machine throughput out of one database node by rewriting its storage engine, without any distribution across servers"
  - "Providing SQL and ACID transactions together with horizontal scalability and fault tolerance, avoiding the old 'scale or consistency' choice"
  - "Discarding the SQL query language entirely in favor of a bare key-value get/put API that applications must build joins on top of"
  - "Removing the need for any replication by keeping a single authoritative copy of each row on one node at all times"
  answer: 1
  explanation: |
    NewSQL combines relational SQL + ACID with horizontal scale and HA via consensus
    replication. It's not about single-node speed, isn't key-value-only, and relies
    heavily on replication (consensus groups), not its elimination.
  ref: "concepts.md#newsql-and-distributed-sql-spanner-cockroachdb"

- id: databases-sql-nosql-sharding-replication-060
  difficulty: advanced
  tags: [newsql, raft, consensus]
  question: |
    How do CockroachDB and TiDB replicate each data range to survive node/zone
    failure without losing committed writes?
  options:
  - "Asynchronous single-leader replication that streams the log to followers on a best-effort catch-up basis, acking the client the moment the leader alone persists"
  - "A two-phase commit handshake to one designated backup node, which durably stores a mirror copy and votes before each commit is finalized"
  - "A consensus protocol (Raft) that commits a write once a majority of the replica group has durably accepted it"
  - "A purely client-side quorum where the driver writes to several replicas directly with no coordination or agreement among the server nodes"
  answer: 2
  explanation: |
    Each range is a Raft group; a write commits when a majority persists it, so any
    minority failure loses nothing. Async single-leader can lose the tail, 2PC to
    one backup isn't a consensus quorum, and these systems coordinate on the server
    via Raft.
  ref: "concepts.md#newsql-and-distributed-sql-spanner-cockroachdb"

- id: databases-sql-nosql-sharding-replication-061
  difficulty: expert
  tags: [newsql, spanner, truetime]
  question: |
    How does Google Spanner use TrueTime to provide externally consistent
    (linearizable) global transactions?
  options:
  - "It discards physical clocks altogether and orders transactions solely by counting network round trips between the participating datacenters"
  - "It routes every write worldwide through one central global lock server that serializes them into a single strict order before committing"
  - "It assumes every node's clock is perfectly synchronized to the same instant with exactly zero error, then timestamps commits from that shared clock"
  - "TrueTime (GPS + atomic clocks) exposes a bounded clock-uncertainty interval; Spanner assigns commit timestamps and waits out the uncertainty (commit-wait) so ordering is globally consistent"
  answer: 3
  explanation: |
    TrueTime bounds clock error to an interval ε; Spanner assigns a commit timestamp
    and waits out ε (commit-wait) before releasing locks, guaranteeing globally
    ordered, externally consistent commits. It doesn't ignore clocks, use one global
    lock server, or assume zero clock error (the whole point is bounding it).
  ref: "concepts.md#newsql-and-distributed-sql-spanner-cockroachdb"

- id: databases-sql-nosql-sharding-replication-062
  difficulty: advanced
  tags: [newsql, tradeoffs, judgment]
  question: |
    A multi-region SaaS needs relational data with joins, ACID transactions, and
    survival of a full region outage, growing beyond a single primary. Weighing
    options, which is the best fit and the trade-off you accept?
  options:
  - "Distributed SQL (Spanner/CockroachDB); you accept higher per-transaction latency from consensus and cross-region commits in exchange for scalable ACID and regional fault tolerance"
  - "Sharded MySQL with a hand-rolled two-phase-commit coordinator; you accept that a coordinator crash mid-commit blocks the affected shards until it recovers"
  - "A single large vertically-scaled Postgres instance with read replicas; you accept that a full region outage takes the whole service offline until you restore elsewhere"
  - "Eventually-consistent Cassandra tuned for availability; you accept giving up the cross-partition ACID transactions and relational joins the business requires"
  answer: 0
  explanation: |
    The requirements (SQL, joins, ACID, region survival, beyond one primary) point
    to distributed SQL, whose cost is higher commit latency. Hand-rolled 2PC on
    MySQL is fragile/blocking, a single Postgres can't survive a region loss or
    scale writes, and Cassandra sacrifices the required transactions and joins.
  ref: "concepts.md#newsql-and-distributed-sql-spanner-cockroachdb"

  # ---------------- CAP / PACELC ----------------
- id: databases-sql-nosql-sharding-replication-063
  difficulty: intermediate
  tags: [cap, consistency, availability]
  question: |
    According to CAP, during a network partition a distributed database must
    sacrifice which pair of properties' co-existence?
  options:
  - "Durability and atomicity — a partition forces the engine to abandon one of these two ACID guarantees for the duration"
  - "Consistency and availability — it must choose one during the partition"
  - "Indexing and sharding — during a partition the database can maintain either its indexes or its shard map, but not both"
  - "Latency and throughput — a partition means the system can optimize for fast responses or high request volume, never together"
  answer: 1
  explanation: |
    CAP says under a partition (P) you must choose between consistency (C) and
    availability (A). It's not about durability/atomicity, indexing/sharding, or
    latency/throughput (that's PACELC's else-branch, not the partition case).
  ref: "concepts.md#cap-pacelc-and-the-consistency-availability-latency-tension"

- id: databases-sql-nosql-sharding-replication-064
  difficulty: advanced
  tags: [pacelc, latency, consistency]
  question: |
    What does PACELC add beyond CAP?
  options:
  - "It asserts that network partitions never actually happen in practice, so the whole partition branch of CAP can be safely ignored by designers"
  - "It swaps the consistency dimension out for durability, reframing the whole trade-off as one between durability and availability instead"
  - "It notes that even with no partition (Else), you still trade Latency against Consistency"
  - "It applies only to single-node databases, where the added latency-versus-consistency choice arises from disk flushing rather than the network"
  answer: 2
  explanation: |
    PACELC extends CAP: on Partition choose Availability or Consistency; Else (no
    partition) choose Latency or Consistency. It doesn't claim partitions never
    happen, doesn't swap in durability, and applies to distributed systems.
  ref: "concepts.md#cap-pacelc-and-the-consistency-availability-latency-tension"

- id: databases-sql-nosql-sharding-replication-065
  difficulty: advanced
  tags: [cap, classification, scenario]
  question: |
    A payments ledger must never expose an inconsistent balance, even if that means
    rejecting writes on the minority side of a partition. How is this classified and
    which store fits?
  options:
  - "AP; run Cassandra in eventual-consistency mode so the minority side keeps accepting balance writes and reconciles them after the partition heals"
  - "PA/EL; use DynamoDB with eventually-consistent reads so both partition sides stay writable and the ledger converges once connectivity returns"
  - "It falls outside CAP entirely because a payments ledger is inherently a single-node system and never experiences network partitions"
  - "CP; use a single-leader relational DB or Spanner/CockroachDB that refuses writes on the minority side to preserve consistency"
  answer: 3
  explanation: |
    Prioritizing consistency over availability during a partition is CP; single-
    leader relational or consensus-based distributed SQL fit. AP stores (Cassandra
    eventual, DynamoDB eventual) would serve possibly-stale/divergent data, wrong
    for a ledger; ledgers can absolutely be distributed.
  ref: "concepts.md#cap-pacelc-and-the-consistency-availability-latency-tension"

  # ---------------- Trade-offs / decision guide ----------------
- id: databases-sql-nosql-sharding-replication-066
  difficulty: beginner
  tags: [tradeoffs, scaling-order]
  question: |
    Following a sensible scaling progression for a read-heavy relational workload,
    which sequence is most appropriate?
  options:
  - "Index and tune queries → add caching → add read replicas → denormalize/materialized views → vertically scale → partition → shard only if forced"
  - "Shard the dataset across many primaries first, then add indexes to each shard, and only consider a cache layer afterward if reads are still slow"
  - "Rewrite the service in a faster compiled language, then buy bigger disks for the primary, then immediately shard the database across many nodes"
  - "Enable Serializable isolation on the primary, then switch to multi-leader replication for the reads, then shard once conflicts appear"
  answer: 0
  explanation: |
    The low-risk progression escalates complexity gradually: indexing/tuning,
    caching, read replicas, denormalization, vertical scaling, functional
    partitioning, and only then horizontal sharding. Sharding first, language
    rewrites, or jumping to multi-leader/serializable are premature and costly.
  ref: "concepts.md#trade-offs-and-when-to-use-what"

- id: databases-sql-nosql-sharding-replication-067
  difficulty: intermediate
  tags: [tradeoffs, sharding-vs-replication]
  question: |
    "Sharding scales ___ and replication scales ___." Fill in the blanks.
  options:
  - "read throughput and cache hit rate; write throughput and durability"
  - "writes and storage; reads and availability"
  - "cross-shard consistency and isolation; commit latency and lock contention"
  - "secondary index depth and cardinality; join breadth and foreign keys"
  answer: 1
  explanation: |
    Sharding partitions data across primaries to scale write throughput and
    storage; replication copies data to scale reads and provide availability/HA.
    They're orthogonal and usually combined. The other pairings misattribute what
    each mechanism does.
  ref: "concepts.md#trade-offs-and-when-to-use-what"

- id: databases-sql-nosql-sharding-replication-068
  difficulty: advanced
  tags: [tradeoffs, shard-key, checklist]
  question: |
    Which set of properties describes a GOOD shard key?
  options:
  - "Low cardinality and monotonically increasing, and deliberately unrelated to the query patterns so the router can balance load freely"
  - "A single boolean flag with only two possible values, so the data splits cleanly into exactly two evenly-sized shards"
  - "High cardinality, evenly-distributed access, and aligned with the dominant query so most reads hit a single shard"
  - "The current wall-clock timestamp of each insert, so that all data stays globally ordered by arrival time across the shards"
  answer: 2
  explanation: |
    Good shard keys have high cardinality, even access distribution, and match the
    dominant query so most requests are single-shard. Low-cardinality, monotonic
    (timestamp), boolean, or query-misaligned keys cause hotspots and scatter-gather.
  ref: "concepts.md#partitioning-and-sharding-strategies"

- id: databases-sql-nosql-sharding-replication-069
  difficulty: expert
  tags: [tradeoffs, capacity, estimation]
  question: |
    A service ingests 200M writes/day of ~1KB records. Roughly what average write
    rate and one-year raw storage should you plan for (order of magnitude)?
  options:
  - "~230 writes/s and ~7 GB/year"
  - "~23,000 writes/s and ~730 GB/year"
  - "~2.3 writes/s and ~7 PB/year"
  - "~2,300 writes/s and ~73 TB/year"
  answer: 3
  explanation: |
    200M/86,400s ≈ 2,300 writes/s average (peak higher). Storage: 200M × 1KB =
    ~200 GB/day × 365 ≈ 73 TB/year. That volume clearly exceeds a single node and
    motivates sharding + an LSM/write-optimized store. The other magnitudes are off
    by 10–1000×.
  ref: "concepts.md#trade-offs-and-when-to-use-what"

- id: databases-sql-nosql-sharding-replication-070
  difficulty: expert
  tags: [tradeoffs, feed, denormalization, scenario]
  question: |
    Designing a social home feed at scale (reads ≫ writes), which combination best
    balances read latency and correctness?
  options:
  - "Denormalized precomputed feed (fan-out on write) in a write-optimized/LSM store for fast reads, a normalized source of truth for posts, and CDC to keep derived data in sync — accepting eventual consistency on the feed"
  - "A fully normalized relational schema that joins posts, authors, and the follow graph at read time on every single feed load, enforcing strong serializable consistency on likes and view counts as well"
  - "Store the entire feed as nodes and edges in one graph database and traverse the multi-hop follow graph on every request to assemble each user's timeline fresh, with no precomputation whatsoever"
  - "Serve every feed read with a cross-shard scatter-gather query that fans out to all shards and merges results for maximum freshness on each individual page load, ignoring the read/write ratio"
  answer: 0
  explanation: |
    With reads dominating, denormalize the read path (precomputed feed, LSM store),
    keep a normalized source of truth, and sync via CDC, accepting eventual
    consistency on the feed. Join-per-read doesn't scale, per-request graph
    traversal is costly, and scatter-gather on every read is the slowest option.
  ref: "concepts.md#trade-offs-and-when-to-use-what"

- id: databases-sql-nosql-sharding-replication-071
  difficulty: intermediate
  tags: [acid, nosql, modern]
  question: |
    Why is the classic "SQL = ACID, NoSQL = BASE" dichotomy considered outdated
    today?
  options:
  - "Because every database engine has now converged on eventual consistency, so strong ACID guarantees no longer exist anywhere in the market"
  - "Because modern DynamoDB and MongoDB support transactions, and Spanner/CockroachDB provide ACID at horizontal scale — the line between the camps has blurred"
  - "Because relational SQL engines have quietly dropped their ACID guarantees to compete on write throughput with the NoSQL stores"
  - "Because the BASE model was formally proven mathematically impossible to implement and has been abandoned by every production system"
  answer: 1
  explanation: |
    The dichotomy blurred: several NoSQL stores added transactions and NewSQL gives
    ACID at scale, so consistency is now a tunable design choice rather than a fixed
    camp. Not all DBs are eventual, SQL didn't drop ACID, and BASE is a valid model.
  ref: "concepts.md#acid-versus-base"

- id: databases-sql-nosql-sharding-replication-072
  difficulty: beginner
  tags: [replication, availability, failover]
  question: |
    In a leader-follower setup with asynchronous replication, what happens to writes
    if the leader crashes before a follower is promoted?
  options:
  - "Writes continue seamlessly on all of the followers, each committing independently and reconciling their divergent copies once the leader returns"
  - "Every row in the entire dataset is immediately and permanently lost, since the followers discard their replicated state the instant the leader disconnects"
  - "The system typically becomes read-only for writes until a follower is promoted (failover), and any un-replicated writes may be lost"
  - "The followers automatically begin accepting writes with no election or coordination, silently splitting the cluster into several equal write masters"
  answer: 2
  explanation: |
    With one leader, a crash means no writes until a follower is promoted, and async
    lag means the un-replicated tail can be lost. Followers don't take writes without
    promotion/coordination, and existing replicated data isn't lost.
  ref: "concepts.md#replication-leader-follower-multi-leader-leaderless"

- id: databases-sql-nosql-sharding-replication-073
  difficulty: intermediate
  tags: [geo-partitioning, cell-based, modern]
  question: |
    A global service partitions users into isolated regional "cells," each with its
    own database and stack. What is the primary benefit of this cell-based
    architecture?
  options:
  - "It guarantees strong global consistency across all cells for free, because every cell synchronously mirrors its writes to all other cells"
  - "It removes the need to shard within a cell, since a cell's single database always fits on one node no matter how large the cell grows"
  - "It makes cross-cell joins trivial, because a global query planner transparently stitches rows from every cell together at read time"
  - "It bounds blast radius (a failure or bad deploy affects only one cell) and keeps data close to users, improving latency and fault isolation"
  answer: 3
  explanation: |
    Cell-based / geo-partitioning isolates failures to a single cell and localizes
    data for latency. It doesn't provide free global consistency, doesn't eliminate
    intra-cell sharding, and cross-cell queries remain hard (that's an accepted
    cost).
  ref: "concepts.md#partitioning-and-sharding-strategies"

- id: databases-sql-nosql-sharding-replication-074
  difficulty: expert
  tags: [replication, quorum, availability, tradeoffs]
  question: |
    In a leaderless store with N=3, you set W=3, R=1 to make reads cheap and always
    fresh. What availability problem does this introduce for writes?
  options:
  - "Writes require all 3 replicas to ack, so if any single replica is down or slow, writes fail or stall — sacrificing write availability for read simplicity"
  - "None at all; requiring W=3 actually improves write availability, since spreading each write across all three replicas gives more nodes able to absorb it"
  - "Reads will now return stale data, because setting R=1 lets a read land on a replica that has not yet received the latest acknowledged write"
  - "It causes split-brain between the replicas, since W=3 lets each of the three nodes believe it is the authoritative primary and accept conflicting writes"
  answer: 0
  explanation: |
    W=3 means every write needs all replicas; losing even one blocks writes, hurting
    write availability (though W+R>N gives fresh reads). Reads at R=1 with W=3 are
    fresh, not stale, and this isn't split-brain (a leaderless-quorum config, not
    dual leaders).
  ref: "concepts.md#replication-leader-follower-multi-leader-leaderless"

- id: databases-sql-nosql-sharding-replication-075
  difficulty: intermediate
  tags: [indexing, clustered, secondary]
  question: |
    In InnoDB, a secondary index stores the indexed column(s) plus the primary key,
    not a direct row pointer. What is the consequence for a query using a
    non-covering secondary index?
  options:
  - "The query never touches the primary key index, since the secondary index already stores a direct disk pointer to the full row image"
  - "It performs a second lookup into the clustered (primary key) index to fetch the remaining columns — a 'bookmark lookup', which extra I/O a covering index would avoid"
  - "It cannot return any columns beyond the indexed one, so the engine silently drops all non-indexed fields from the result set"
  - "It automatically rewrites the table into a heap, discarding the clustered primary-key organization so the secondary index can point at raw pages"
  answer: 1
  explanation: |
    A non-covering secondary index yields the PK, then InnoDB looks up the clustered
    index to get the full row (bookmark lookup), adding I/O; a covering index avoids
    the second lookup. It can return other columns (via that lookup) and doesn't
    convert the table to a heap.
  ref: "concepts.md#indexing-and-index-data-structures"

- id: databases-sql-nosql-sharding-replication-076
  difficulty: advanced
  tags: [nosql, cassandra, discord, scenario]
  question: |
    Discord stores trillions of chat messages with enormous write volume and reads
    that are mostly "recent messages in a channel." Which storage approach matches
    this, and why?
  options:
  - "A single-node relational DB with a normalized messages table, relying on vertical scaling and a covering index on channel_id to absorb the trillion-row write volume"
  - "A graph database traversing message relationships per read, modeling each message as a node linked to its channel and author for fast recent-message lookups"
  - "A wide-column LSM store (Cassandra/ScyllaDB) partitioned by channel with messages clustered by time — high write throughput and efficient recent-range reads within a partition"
  - "An in-memory-only key-value store with no durability, keyed by message ID and sized to hold the entire trillion-message history resident in RAM"
  answer: 2
  explanation: |
    Massive writes plus per-channel recent-range reads fit a wide-column LSM store
    partitioned by channel and clustered by time (Discord's actual design). A single
    relational node can't hold trillions of rows, graph traversal doesn't fit
    message reads, and an in-memory-only store loses durability.
  ref: "concepts.md#nosql-data-models-document-key-value-wide-column-graph"

  # ================= ADVANCED + EXPERT BLOCK (senior/staff) =================
  # ---------------- RUM conjecture / amplification ----------------
- id: databases-sql-nosql-sharding-replication-077
  difficulty: advanced
  tags: [rum-conjecture, amplification, storage-engine]
  question: |
    An engineer claims "we should always use LSM because it minimizes read, write,
    AND space overhead at once." Why is this fundamentally wrong?
  options:
  - "The RUM conjecture holds that read, update, and memory (space) overhead cannot all be minimized simultaneously — optimizing two worsens the third; there is no free lunch"
  - "LSM only minimizes read overhead, never write overhead, because every SSTable lookup is served straight from an in-memory index with no disk seek"
  - "LSM cannot be used for durable storage, since its memtable lives only in RAM and no commit log is written ahead of the flush to disk"
  - "Space overhead is irrelevant on modern SSDs, so the claim is moot as long as the working set fits within the drive's advertised capacity"
  answer: 0
  explanation: |
    The RUM conjecture states you cannot minimize read, update, and memory overhead
    all at once — every access method picks a point in that trade-off space. LSM is
    durable and lowers random-write cost but does not escape RUM; space matters
    (compaction, versions), so the sweeping claim is unsound.
  ref: "concepts.md#the-rum-conjecture-and-amplification-in-depth"

- id: databases-sql-nosql-sharding-replication-078
  difficulty: expert
  tags: [lsm, compaction, leveled, size-tiered]
  question: |
    A write-heavy ingest workload is suffering read-latency spikes and disk-usage
    doubling during major compactions under size-tiered compaction (STCS). The team
    is disk-constrained and reads have grown to matter. Which change best rebalances
    the amplification trade-offs, and what is the cost?
  options:
  - "Disable compaction entirely to eliminate all amplification, letting the ever-growing set of SSTables be merged lazily only when a read happens to touch them"
  - "Switch to a B-tree engine, which has zero write amplification because it updates each row in place without ever rewriting a surrounding page or the WAL"
  - "Switch to leveled compaction (LCS): lower read and space amplification (≤1 SSTable per level, ~10% space overhead), at the cost of substantially higher write amplification"
  - "Increase the memtable size so no SSTables are ever flushed, keeping the entire dataset buffered in memory and bypassing compaction for good"
  answer: 2
  explanation: |
    Leveled compaction keeps at most one SSTable per level per key range, cutting
    read and space amplification, but rewrites data across levels so write
    amplification rises — the right dial when reads/space matter more than write
    cost. Disabling compaction breaks reads/space; B-trees still amplify writes
    (page rewrites); an ever-growing memtable risks data loss and huge recovery.
  ref: "concepts.md#the-rum-conjecture-and-amplification-in-depth"

- id: databases-sql-nosql-sharding-replication-079
  difficulty: advanced
  tags: [write-amplification, btree, small-updates]
  question: |
    Why can a B-tree exhibit severe write amplification for a workload of many tiny
    (~100-byte) scattered row updates?
  options:
  - "B-trees never touch disk for small updates, because sub-page changes are absorbed permanently in the buffer pool and flushed only during a manual checkpoint"
  - "Small updates are batched into a single sequential append like an LSM, so a hundred scattered row changes coalesce into one contiguous write to the log"
  - "Each small update dirties and must eventually rewrite an entire page (e.g., 8-16 KB) plus WAL, so a 100-byte change can amplify to kilobytes of writes; random small updates also cause page splits"
  - "The optimizer converts small updates into full-table rewrites, re-serializing every page of the relation to keep the physical row order strictly sorted"
  answer: 2
  explanation: |
    B-trees modify pages in place at page granularity, so a tiny row change forces
    rewriting the whole page (plus WAL), and scattered updates trigger random I/O
    and splits — large write amplification. B-trees do hit disk, do not append
    sequentially like LSM, and do not rewrite whole tables per update.
  ref: "concepts.md#the-rum-conjecture-and-amplification-in-depth"

  # ---------------- MVCC / isolation ----------------
- id: databases-sql-nosql-sharding-replication-080
  difficulty: expert
  tags: [isolation, write-skew, ssi, serializable]
  question: |
    Two doctors are on call. Each runs a transaction: "if at least one OTHER doctor
    is on call, I may go off call," reads that the other is on call, and updates only
    their OWN row to off-call. Under Postgres REPEATABLE READ (snapshot isolation),
    both commit and coverage drops to zero. Why does SI fail here and what fixes it?
  options:
  - "It is a lost update; SI's first-committer-wins rule should have detected the two writes touching the same row and aborted one, so this must be an engine bug"
  - "It is a dirty read; enabling READ COMMITTED fixes it by hiding each transaction's uncommitted off-call update from the other until commit time"
  - "It is write skew: each transaction updates a different row so first-committer-wins never triggers, yet the combination violates the invariant; SERIALIZABLE (SSI) detects the read/write anti-dependency and aborts one"
  - "It is a phantom; adding a unique index on the on-call column fixes it by blocking the second transaction's conflicting row insert"
  answer: 2
  explanation: |
    Write skew: the two transactions read an overlapping set but write disjoint rows,
    so first-committer-wins (which only fires on same-row conflicts) does not help,
    yet the invariant breaks. Only serializable isolation prevents it; Postgres SSI
    tracks rw-antidependencies and aborts one transaction, forcing a retry.
  ref: "concepts.md#mvcc-internals-and-serializable-snapshot-isolation"

- id: databases-sql-nosql-sharding-replication-081
  difficulty: expert
  tags: [mvcc, vacuum, postgres, bloat]
  question: |
    A Postgres table with heavy UPDATE traffic shows table and index bloat and
    degrading scans, despite steady row counts. What MVCC-rooted cause is most
    likely?
  options:
  - "Postgres compresses old row versions with its TOAST codec on every update, and the added compression metadata is what inflates the on-disk table size"
  - "Every secondary index is fully rebuilt from scratch on each write, so steady UPDATE traffic roughly doubles the total index footprint over time"
  - "The write-ahead log is being stored inline inside the table's own heap pages, so each UPDATE permanently appends its redo record next to the row"
  - "Each UPDATE writes a new row version (with xmin/xmax) and leaves dead tuples in the heap; if autovacuum can't keep up (often held back by a long-running transaction), dead versions accumulate as bloat"
  answer: 3
  explanation: |
    Postgres MVCC creates a new tuple version per UPDATE and marks the old one dead;
    VACUUM reclaims dead tuples. A long-running transaction holds back the vacuum
    horizon (dead tuples can't be removed while still potentially visible), so bloat
    grows. It is not compression, per-write index rebuilds, or WAL-in-heap.
  ref: "concepts.md#mvcc-internals-and-serializable-snapshot-isolation"

- id: databases-sql-nosql-sharding-replication-082
  difficulty: advanced
  tags: [isolation, ssi, 2pl, retries]
  question: |
    Compared to two-phase locking (2PL), what is the key operational implication of
    running under Postgres SERIALIZABLE (SSI) for a contended workload?
  options:
  - "SSI is optimistic and takes no read locks, giving higher concurrency, but can abort transactions with serialization failures under contention — the application MUST implement retry loops"
  - "SSI acquires shared read locks on every row a transaction reads, so readers block writers heavily and throughput collapses under contention"
  - "SSI guarantees no transaction is ever aborted, since its dependency tracker resolves every conflict by transparently reordering commits behind the scenes"
  - "SSI silently downgrades each transaction to READ COMMITTED once contention rises, trading its serializability guarantee for throughput without telling the application"
  answer: 0
  explanation: |
    SSI runs optimistically at snapshot isolation while tracking dangerous
    read/write anti-dependencies, aborting a pivot transaction when a
    non-serializable structure is detected. That means false-positive aborts under
    contention, so apps must retry. It does not take read locks, does not guarantee
    no aborts, and does not silently downgrade.
  ref: "concepts.md#mvcc-internals-and-serializable-snapshot-isolation"

- id: databases-sql-nosql-sharding-replication-083
  difficulty: advanced
  tags: [isolation, repeatable-read, mysql, postgres]
  question: |
    An engineer tested a write-conflict scenario on MySQL/InnoDB at REPEATABLE READ,
    saw the "last writer wins" under locking, and assumes Postgres REPEATABLE READ
    behaves identically. Why is this dangerous?
  options:
  - "Postgres has no REPEATABLE READ level at all, so the keyword is silently mapped to READ COMMITTED whenever a client requests it"
  - "Both engines abort on any write conflict identically, raising the exact same serialization-failure error code so application retry logic ports over unchanged"
  - "InnoDB REPEATABLE READ uses gap/next-key locks and lets a locked writer win, whereas Postgres REPEATABLE READ is snapshot isolation and ABORTS the losing writer with a serialization failure — same keyword, different behavior"
  - "Postgres REPEATABLE READ is actually weaker than READ UNCOMMITTED, permitting dirty reads of other transactions' uncommitted rows that MySQL would always hide"
  answer: 2
  explanation: |
    The SQL standard levels are implemented differently: InnoDB RR relies on
    next-key locking (blocking, last-locked-writer wins) while Postgres RR is
    snapshot isolation that raises a serialization failure and aborts the second
    writer. Assuming identical behavior across engines leads to correctness bugs;
    always name the engine.
  ref: "concepts.md#mvcc-internals-and-serializable-snapshot-isolation"

- id: databases-sql-nosql-sharding-replication-084
  difficulty: advanced
  tags: [isolation, phantom, snapshot]
  question: |
    A report transaction runs SELECT COUNT(*) twice with the same predicate and gets
    different results within the same transaction because another transaction
    inserted matching rows in between. Under which isolation level is this "phantom"
    definitely prevented?
  options:
  - "Read Uncommitted, because its dirty-read behavior already forces every range query to re-acquire a fresh predicate lock on each execution"
  - "Read Committed, since taking a brand-new statement-level snapshot on every query is exactly what stops newly inserted rows from appearing"
  - "Serializable (and, for the reader's own snapshot, snapshot isolation)"
  - "Phantoms cannot be prevented at any isolation level, because range predicates fundamentally cannot lock rows that do not yet exist"
  answer: 2
  explanation: |
    Phantom reads (new rows appearing between identical range queries) are prevented
    at Serializable; snapshot isolation also gives the reader a stable snapshot so
    its own repeated counts match. Read Uncommitted and Read Committed permit
    phantoms, and the claim they can't be prevented is false.
  ref: "concepts.md#mvcc-internals-and-serializable-snapshot-isolation"

  # ---------------- Online resharding ----------------
- id: databases-sql-nosql-sharding-replication-085
  difficulty: expert
  tags: [resharding, migration, zero-downtime]
  question: |
    You must move a live, write-serving dataset from sharding by user_id to sharding
    by org_id with zero downtime. Which sequence correctly minimizes the risk of
    lost or divergent writes?
  options:
  - "Take the system offline, copy every row to the new org_id layout, flip the routing config, then bring the service back up once the copy finishes"
  - "Flip all reads to the new org_id topology first, then start copying the existing data over in the background while the new shards serve traffic"
  - "Delete the old user_id shards immediately, then rebuild the full dataset on the new layout by replaying the application's request logs from the start"
  - "Dual-write (or CDC) old→new + backfill history; continuously verify with shadow reads/checksums; canary-cutover reads; then cut over writes and decommission old"
  answer: 3
  explanation: |
    The safe playbook writes to both layouts (or streams via CDC) while backfilling,
    verifies convergence with shadow reads/checksums, canaries the read cutover, then
    cuts writes and retires the old layout. Offline copy means downtime; flipping
    reads before data is present serves misses; deleting first risks unrecoverable
    loss.
  ref: "concepts.md#online-resharding-and-live-data-migration"

- id: databases-sql-nosql-sharding-replication-086
  difficulty: advanced
  tags: [resharding, logical-shards, pre-splitting]
  question: |
    Why do systems like Vitess and MongoDB pre-split into many logical shards (e.g.,
    1024) and pack several onto each physical node, rather than one shard per node?
  options:
  - "Growing capacity becomes reassigning whole logical shards to new nodes — moving only those shards' data — instead of rehashing and moving nearly every key"
  - "It reduces the number of secondary indexes each table needs, because a logical shard can share one global index across all the physical nodes it lands on"
  - "It guarantees strong consistency across shards, since packing several logical shards per node lets them commit within a single local transaction boundary"
  - "It eliminates the need for replication, because spreading many logical shards across nodes already leaves a redundant copy of each key on its neighbors"
  answer: 0
  explanation: |
    Many logical shards decouple the logical partitioning from physical placement:
    scaling out just relocates some logical shards to new nodes, avoiding a global
    rehash/key-movement. It is unrelated to index counts, does not grant cross-shard
    consistency, and does not replace replication.
  ref: "concepts.md#online-resharding-and-live-data-migration"

- id: databases-sql-nosql-sharding-replication-087
  difficulty: expert
  tags: [resharding, cutover, write-safety]
  question: |
    During the final write-cutover of an online migration, the hardest correctness
    risk is in-flight writes being lost or double-applied. Which combination best
    controls this?
  options:
  - "Rely on eventual consistency to reconcile any lost or duplicated writes later, letting anti-entropy repair sweep them up without special cutover handling"
  - "Turn off the write-ahead log during the cutover window to speed it up, then re-enable it once traffic is fully serving from the new layout"
  - "Tail the change log until replication lag on the new layout reaches ~0, use a brief write-freeze on the affected key range during final catch-up, and make writes idempotent/monotonically-versioned so any double-apply is safe"
  - "Cut over all shards simultaneously in one big-bang switch with no verification, trusting that a single atomic flip leaves no window for in-flight writes"
  answer: 2
  explanation: |
    You drain lag to near zero, optionally freeze the small affected key range for
    the final catch-up, and rely on idempotent/versioned writes so replays or
    double-applies are harmless. Hoping eventual consistency fixes lost writes,
    disabling the WAL, or big-bang cutover without verification all invite data loss.
  ref: "concepts.md#online-resharding-and-live-data-migration"

  # ---------------- Hot shards / hot keys ----------------
- id: databases-sql-nosql-sharding-replication-088
  difficulty: advanced
  tags: [hot-shard, detection, heavy-hitter]
  question: |
    Your overall p99 looks healthy but one partition is throttling and pegged while
    others idle. You need to identify the offending keys cheaply from a high-volume
    key stream. Which technique fits best?
  options:
  - "Use heavy-hitter / top-K streaming detection (e.g., a count-min sketch) to approximate the hottest keys with bounded memory in real time"
  - "Store every individual key access in a relational audit table and run a GROUP BY over the full day's rows at midnight to rank the busiest keys"
  - "Raise the transaction isolation level to Serializable so contended access on the hot key surfaces as serialization failures that name the offending key"
  - "Add more shards to the cluster and let the rebalancer spread the load, which automatically reveals which key was hot once it stops throttling"
  answer: 0
  explanation: |
    A count-min sketch / top-K streaming algorithm approximates the hottest keys in
    sublinear memory and real time — ideal for hot-key detection on a firehose.
    Logging every access is expensive and after-the-fact, isolation level is
    irrelevant, and adding shards does not identify which value is hot.
  ref: "concepts.md#hot-shards-and-hot-keys-detection-and-mitigation"

- id: databases-sql-nosql-sharding-replication-089
  difficulty: expert
  tags: [hot-key, feed, fan-out, celebrity]
  question: |
    A feed system uses fan-out-on-write. A celebrity with 100M followers posts, and
    the single post triggers 100M feed writes, stalling the write path. What is the
    standard mitigation?
  options:
  - "Switch the entire system to fan-out-on-read for all users, assembling every timeline by querying each followed account at read time on every single load"
  - "Shard the celebrity's followers table by follower_id and hope the extra partitions balance the 100M feed writes evenly enough to avoid the stall"
  - "Hybrid fan-out: push (fan-out-on-write) for normal users, but pull (fan-out-on-read / merge at read time) for celebrity accounts so their posts don't stampede the write path"
  - "Increase the per-write timeout generously so all 100M follower feed writes are given enough time to eventually complete without being cancelled"
  answer: 2
  explanation: |
    The hybrid model pushes to normal followers' feeds but pulls celebrity posts at
    read time (merging into the feed on load), avoiding the write stampede while
    keeping normal-case reads cheap. Pull-for-everyone makes every feed read
    expensive, resharding followers doesn't remove the fan-out, and longer timeouts
    just prolong the incident.
  ref: "concepts.md#hot-shards-and-hot-keys-detection-and-mitigation"

- id: databases-sql-nosql-sharding-replication-090
  difficulty: advanced
  tags: [hot-key, cache, thundering-herd]
  question: |
    A single hot key is cached, but every time its TTL expires, thousands of
    concurrent requests miss the cache and stampede the database. What is the most
    targeted fix?
  options:
  - "Remove the cache entirely so there are no expiries left to trigger the stampede, and let every request read the hot key straight from the database"
  - "Set the key's TTL to zero so the value is always fetched fresh on each request, guaranteeing no stale window ever exists for the hot key"
  - "Shard the database by the cached value's TTL so that keys expiring together are spread across separate nodes and absorb the miss traffic"
  - "Request coalescing / singleflight so only one request repopulates the cache while others wait, plus jittered/staggered TTLs to avoid synchronized expiry"
  answer: 3
  explanation: |
    The thundering-herd on expiry is solved by coalescing concurrent misses into a
    single backfill (singleflight) and jittering TTLs so keys don't all expire at
    once. Removing the cache or TTL=0 sends all load to the DB, and sharding by TTL
    is nonsensical.
  ref: "concepts.md#hot-shards-and-hot-keys-detection-and-mitigation"

- id: databases-sql-nosql-sharding-replication-091
  difficulty: advanced
  tags: [hot-key, write-sharding, tradeoffs]
  question: |
    Write-sharding a hot key by appending a bounded suffix (key#0..key#N) spreads
    writes across partitions. What cost does this deliberately accept?
  options:
  - "Reads for that logical key must now gather and merge across all N suffixes (read fan-out), trading a write hotspot for read-side scatter"
  - "It permanently corrupts the ordering guarantees of every key in the table, forcing a full rebuild of the partition's clustering index"
  - "It requires abandoning the wide-column model entirely and migrating the whole dataset into a graph database keyed by the new suffix"
  - "It makes every unrelated key in the keyspace slower to read, because the added suffixes enlarge the shared partition index for all rows"
  answer: 0
  explanation: |
    Suffixing spreads the hot key's writes across N partitions but a read for the
    logical key must query all N suffixes and merge — you convert a write hotspot
    into read fan-out. It doesn't corrupt other keys, require a new data model, or
    slow unrelated keys.
  ref: "concepts.md#hot-shards-and-hot-keys-detection-and-mitigation"

  # ---------------- Replication log formats ----------------
- id: databases-sql-nosql-sharding-replication-092
  difficulty: advanced
  tags: [replication, statement-based, non-determinism]
  question: |
    Why can statement-based replication (SBR) silently corrupt a replica, leading
    engines like MySQL to default to row-based or mixed logging?
  options:
  - "The raw SQL text of each statement is too large to ship over the replication network link, so it saturates the primary's outbound bandwidth"
  - "SBR is structurally unable to replicate DELETE statements, so any row removed on the primary silently lingers forever on every replica"
  - "Non-deterministic statements (NOW(), RAND(), UUID(), AUTO_INCREMENT races, some triggers/UDFs) can produce different results on the replica than on the primary, diverging the data"
  - "Row-based replication is always smaller on the wire than statement-based, so engines switch to it purely to shrink the replication stream volume"
  answer: 2
  explanation: |
    SBR re-executes the SQL on the replica, so anything non-deterministic (time,
    random, UUIDs, some triggers/UDFs, ordering of auto-increment) yields divergent
    results — hence ROW/MIXED defaults. SBR is actually compact (not too large), can
    replicate DELETEs, and row-based is often larger for wide updates.
  ref: "concepts.md#replication-log-formats-statement-row-and-wal-shipping"

- id: databases-sql-nosql-sharding-replication-093
  difficulty: expert
  tags: [replication, logical-vs-physical, cdc]
  question: |
    You need to (a) feed a search index and a data warehouse from Postgres,
    selectively for a few tables, and (b) survive a cross-major-version upgrade.
    Which replication mechanism is the right substrate, and why not the other?
  options:
  - "Physical WAL streaming — it can selectively filter individual tables at the byte level and replicates cleanly across arbitrary major-version boundaries"
  - "Statement-based replication, because re-executing the SQL text on a consumer is the only mechanism any CDC tool such as Debezium can subscribe to"
  - "Logical decoding / logical replication — it emits filterable, row-level changes usable by CDC (Debezium) and works across major versions; physical WAL shipping is byte-identical, same-major-version-only, and all-or-nothing"
  - "A nightly pg_dump, because live WAL streaming is fundamentally incapable of delivering any change data into external search or warehouse systems"
  answer: 2
  explanation: |
    Logical decoding produces decoded, per-table, row-level change events — the
    substrate CDC tools consume — and supports cross-version replication (used for
    near-zero-downtime upgrades). Physical WAL shipping is exact bytes, same major
    version, and can't filter tables. SBR isn't a CDC substrate, and pg_dump is a
    batch snapshot, not near-real-time.
  ref: "concepts.md#replication-log-formats-statement-row-and-wal-shipping"

- id: databases-sql-nosql-sharding-replication-094
  difficulty: advanced
  tags: [replication, row-based, volume]
  question: |
    A single UPDATE ... WHERE status='pending' modifies 5 million rows. Under
    row-based replication, what is the effect on the replication stream compared to
    statement-based?
  options:
  - "Row-based ships only the single UPDATE statement text once, so its stream is far smaller than statement-based for this bulk change"
  - "Row-based ships before/after images for all 5M rows, generating a large stream, whereas statement-based would ship just the one statement — the safety of RBR costs volume here"
  - "Both formats ship exactly the same number of bytes here, since the replica must apply the identical 5M-row change either way"
  - "Row-based flatly refuses to replicate any statement touching more than one row, so the primary rejects the bulk UPDATE outright"
  answer: 1
  explanation: |
    RBR logs each changed row's image, so a bulk update becomes millions of row
    events — deterministic and safe but voluminous — while SBR would ship the single
    statement. This is the classic RBR volume trade-off; it does not refuse bulk
    updates.
  ref: "concepts.md#replication-log-formats-statement-row-and-wal-shipping"

  # ---------------- Multi-leader / leaderless conflict resolution ----------------
- id: databases-sql-nosql-sharding-replication-095
  difficulty: expert
  tags: [conflict-resolution, lww, clock-skew]
  question: |
    Cassandra resolves concurrent writes to the same cell with last-write-wins by
    timestamp. Under clock skew across nodes, what is the concrete danger?
  options:
  - "A write that actually happened LATER can be silently discarded if its node's clock is behind, so LWW can lose the newer update with no error"
  - "It deadlocks the entire cluster, because two skewed timestamps on the same cell force every replica to block waiting for clock agreement"
  - "It forces all writes to that cell to become synchronous, since the coordinator must pause to reconcile the divergent node clocks before acking"
  - "It automatically converts the affected cell's data into a CRDT, silently changing the column's type to a conflict-free merge structure"
  answer: 0
  explanation: |
    LWW keeps the highest timestamp; if the node issuing the truly-later write has a
    lagging clock, its (newer) write loses to an older one — silent data loss driven
    by clock skew. It doesn't deadlock, change write mode, or auto-create CRDTs.
  ref: "concepts.md#multi-leader-and-leaderless-conflict-resolution-in-depth"

- id: databases-sql-nosql-sharding-replication-096
  difficulty: expert
  tags: [conflict-resolution, crdt, convergence]
  question: |
    A multi-region collaborative editor needs concurrent edits from different regions
    to merge automatically and always converge to the same state without
    coordination. Which mechanism provides this and what property makes it work?
  options:
  - "Two-phase commit across all regions on every keystroke, so each character is durably agreed by every replica before it appears on screen"
  - "Last-write-wins keyed by each node's wall-clock timestamp, which is guaranteed to preserve every concurrent edit without ever dropping one"
  - "A single global leader that serializes every keystroke into one total order before any region is allowed to display the change locally"
  - "CRDTs — data types whose merge operation is commutative, associative, and idempotent, guaranteeing strong eventual consistency (all replicas converge) without coordination"
  answer: 3
  explanation: |
    CRDTs define merges that are commutative, associative, and idempotent, so
    replicas applying updates in any order/duplication converge to the same
    state — ideal for offline/multi-region collaboration without coordination. 2PC
    per keystroke is impossibly slow, LWW loses concurrent edits, and a global
    leader kills offline/local editing.
  ref: "concepts.md#multi-leader-and-leaderless-conflict-resolution-in-depth"

- id: databases-sql-nosql-sharding-replication-097
  difficulty: advanced
  tags: [conflict-resolution, version-vectors, siblings]
  question: |
    What advantage do version vectors (vector clocks) offer over a single
    last-write-wins timestamp in a leaderless store like Riak?
  options:
  - "They make every write synchronous, blocking each update until all replicas confirm the vector before the client is acknowledged"
  - "They can distinguish causally-ordered writes from truly-concurrent ones, surfacing genuine conflicts as siblings for the application (or user) to merge rather than silently discarding one"
  - "They guarantee zero storage overhead, since the per-replica counters are folded into the existing row timestamp at no extra cost"
  - "They remove the need for replication entirely, because the causal history embedded in each write already durably copies the value everywhere"
  answer: 1
  explanation: |
    Version vectors capture per-replica causality, so the system knows when two
    writes are concurrent (conflict → siblings to merge) versus one superseding the
    other — avoiding LWW's silent loss. They don't make writes synchronous, are not
    free in storage, and don't replace replication.
  ref: "concepts.md#multi-leader-and-leaderless-conflict-resolution-in-depth"

- id: databases-sql-nosql-sharding-replication-098
  difficulty: advanced
  tags: [multi-leader, conflict-avoidance, routing]
  question: |
    An architect argues the cleanest multi-leader design "avoids conflicts rather
    than resolving them." What concrete technique implements conflict avoidance?
  options:
  - "Randomly routing each incoming write to a different leader to spread load evenly, so no single leader becomes a write hotspot for any record"
  - "Routing all writes for a given record to the same 'home' leader (sticky routing by key), so concurrent conflicting writes to that record never arise; fall back to merge only during failover"
  - "Using last-write-wins by timestamp so any conflicting writes are resolved instantly at commit with no sibling versions ever retained"
  - "Disabling replication between the leaders so each one owns an independent copy and their writes can never collide across the topology"
  answer: 1
  explanation: |
    Pinning each record's writes to a home leader (sticky/key-based routing) means
    the same object is never written on two leaders simultaneously, so conflicts are
    avoided by construction; merge is only needed if that leader fails over. Random
    routing maximizes conflicts, LWW is resolution not avoidance, and disabling
    replication breaks the system.
  ref: "concepts.md#multi-leader-and-leaderless-conflict-resolution-in-depth"

  # ---------------- Local vs global secondary indexes ----------------
- id: databases-sql-nosql-sharding-replication-099
  difficulty: expert
  tags: [secondary-index, local, global, dynamodb]
  question: |
    Why are DynamoDB Global Secondary Indexes (GSIs) eventually consistent, while a
    local per-shard secondary index can be strongly consistent?
  options:
  - "GSIs are physically stored on a slower cold-storage tier, so their propagation lag is a disk-speed artifact rather than a partitioning one"
  - "GSIs resolve their index entries with last-write-wins while local indexes commit through a two-phase-commit handshake with the base row"
  - "A GSI is partitioned by the indexed term, so a base-table write must update an index partition on a DIFFERENT node — done asynchronously; a local index lives on the same partition as the row, so it updates transactionally with the write"
  - "Local indexes are held entirely in an in-memory cache while GSIs live only on disk, so the cache miss on a GSI is what makes it lag the base write"
  answer: 2
  explanation: |
    Global (term-partitioned) indexes place the index entry on a partition chosen by
    the indexed value, which is usually a different node than the base row, so the
    update is applied asynchronously → eventual consistency. Local
    (document-partitioned) indexes co-locate with the row and update atomically with
    the write. It's about partitioning topology, not disk speed, LWW, or caching.
  ref: "concepts.md#secondary-indexes-on-partitioned-data-local-versus-global"

- id: databases-sql-nosql-sharding-replication-100
  difficulty: advanced
  tags: [secondary-index, local, scatter-gather]
  question: |
    With document-partitioned (local) secondary indexes, a query filters on the
    indexed attribute but does NOT include the shard key. What is the read-cost
    consequence?
  options:
  - "The query hits exactly one shard, because the local index on the filtered attribute deterministically maps the value to a single partition"
  - "The query cannot run at all and the engine rejects it, since a local secondary index is unusable unless the shard key is also supplied"
  - "The query must scatter-gather across all shards and merge results, since each shard only indexes its own rows — read cost scales with shard count"
  - "The query is served entirely from a single global index partition, which the local index transparently promotes itself into for this access pattern"
  answer: 2
  explanation: |
    Local indexes only cover each shard's own rows, so a query lacking the shard key
    must fan out to every shard, query each local index, and merge — read cost grows
    with the number of shards. Hitting one shard or one global partition describes a
    global/term-partitioned index instead.
  ref: "concepts.md#secondary-indexes-on-partitioned-data-local-versus-global"

- id: databases-sql-nosql-sharding-replication-101
  difficulty: advanced
  tags: [secondary-index, decision, tradeoffs]
  question: |
    You must frequently query a large sharded table by an attribute that is
    independent of the shard key, at high read volume with strict latency. Which
    approach is most appropriate and what trade-off do you accept?
  options:
  - "A local (document-partitioned) index, accepting fast single-shard writes and relying on the query planner to prune down to one shard automatically"
  - "A global (term-partitioned) secondary index or a separate CDC-fed lookup table, hitting one index partition per read at the cost of cross-partition (often async/eventual) index writes"
  - "No index at all; run a scatter-gather across every shard on each read, accepting the fan-out cost as the price of always-fresh strongly-consistent results"
  - "Re-shard the base table by that attribute so this query is single-shard, accepting that every other existing query now scatter-gathers instead"
  answer: 1
  explanation: |
    When reads must query by a non-shard-key attribute at scale/latency, a global
    (term-partitioned) index — or a CDC-maintained lookup table — routes each read
    to one index partition, accepting cross-partition, typically eventually
    consistent index writes. A local index forces scatter-gather reads; no index is
    slower; re-sharding just moves the scatter-gather to other queries.
  ref: "concepts.md#secondary-indexes-on-partitioned-data-local-versus-global"

  # ---------------- NewSQL decision ----------------
- id: databases-sql-nosql-sharding-replication-102
  difficulty: expert
  tags: [newsql, latency, consensus, physics]
  question: |
    A team moves a single-region, moderately-loaded transactional workload that fits
    one Postgres primary onto a strongly-consistent multi-region distributed SQL
    cluster "to be future-proof," and write latency gets much worse. What is the root
    cause?
  options:
  - "Distributed SQL databases run on inherently slower disks, so every write inherits that fixed storage-latency penalty regardless of topology"
  - "The Postgres wire-compatibility layer these clusters expose always halves raw write throughput, adding a constant translation overhead per statement"
  - "Every write now requires a consensus round trip to a majority of replicas (and cross-region commits pay ~80-150ms US-EU RTT), so a workload that never needed multi-region ACID pays a latency tax rooted in the speed of light"
  - "The query optimizer silently disables all secondary indexes whenever the cluster runs in distributed mode, forcing slow full scans on writes"
  answer: 2
  explanation: |
    Distributed SQL commits via consensus (a round trip to a majority), and spanning
    regions adds the physical WAN latency per commit — a real cost you only should
    pay when you need scalable, region-surviving ACID. A workload that fit one
    primary gains nothing and eats the tax. It's not disk speed, a fixed
    compatibility penalty, or disabled indexes.
  ref: "concepts.md#when-newsql-is-the-right-call-and-when-it-is-not"

- id: databases-sql-nosql-sharding-replication-103
  difficulty: advanced
  tags: [newsql, geo-partitioning, follower-reads]
  question: |
    On a distributed SQL database, most transactions are single-region reads/writes,
    but latency is high because operations round-trip to a leaseholder in another
    region. Which built-in features most directly reduce this?
  options:
  - "Disabling consensus on each range and falling back to async single-leader replication so writes ack locally before the cross-region copy"
  - "Switching the whole cluster to READ UNCOMMITTED globally so reads skip the leaseholder and return whatever the nearest replica currently holds"
  - "Geo-partitioning / table localities to pin a row's replicas to the region that uses it, plus follower/bounded-staleness reads to serve local reads without a cross-region consensus round trip"
  - "Adding more secondary indexes on the hot tables so the optimizer can satisfy each cross-region request from an index without the leaseholder hop"
  answer: 2
  explanation: |
    Geo-partitioning places a row's replicas (and leaseholder) in the region that
    reads/writes it, and follower/bounded-staleness reads serve slightly stale data
    locally without the leaseholder round trip — the intended latency mitigations.
    Disabling consensus loses the guarantees, isolation-level changes don't fix
    geography, and more indexes don't reduce cross-region hops.
  ref: "concepts.md#when-newsql-is-the-right-call-and-when-it-is-not"

- id: databases-sql-nosql-sharding-replication-104
  difficulty: expert
  tags: [newsql, benchmarking, contention]
  question: |
    Before adopting distributed SQL, a staff engineer insists on benchmarking the
    "contended path" (many transactions updating a few hot rows), not just the happy
    path. Why is this the crucial test?
  options:
  - "Contended benchmarks are simply easier and cheaper to set up, so they are chosen mainly for convenience rather than for what they reveal about the engine"
  - "A hot, contended single-row write can be SLOWER on distributed SQL than on one Postgres node because every commit is a consensus quorum; the happy path can look fine while the contended path regresses badly"
  - "The happy path always predicts contended performance accurately, so a single uncontended benchmark run is sufficient before committing to the migration"
  - "Contention only matters for read-only workloads, since concurrent readers of the same row are what actually stress the consensus layer under load"
  answer: 1
  explanation: |
    Under contention, each commit's consensus round trip and cross-range coordination
    dominate, so a hot-row workload can regress versus a single node whose commit is
    local — a failure mode invisible in uncontended happy-path benchmarks. Ease of
    running isn't the point, and contention especially hurts writes, not just reads.
  ref: "concepts.md#when-newsql-is-the-right-call-and-when-it-is-not"

- id: databases-sql-nosql-sharding-replication-105
  difficulty: advanced
  tags: [newsql, olap, htap, wrong-fit]
  question: |
    A team wants to run heavy analytical (OLAP) scans and aggregations and is
    considering a distributed OLTP SQL database for it. What is the best guidance?
  options:
  - "Distributed OLTP SQL is optimal for large analytical scans, since its row-oriented storage reads whole rows fastest during wide aggregations; use it"
  - "Large analytical workloads belong on a columnar warehouse (Snowflake/BigQuery/ClickHouse); distributed OLTP SQL is row-oriented for transactions — though some (e.g., TiDB with TiFlash) add a columnar replica for HTAP"
  - "Only a graph database can run analytical workloads, because aggregations are fundamentally traversals over relationships between the rows being scanned"
  - "Analytics must always run directly on the OLTP primary to stay consistent, since any separate warehouse copy would return stale aggregate results"
  answer: 1
  explanation: |
    OLAP scans favor columnar warehouses; distributed OLTP SQL is optimized for
    transactional, row-based access, so using it for heavy analytics is a poor fit
    (unless the engine offers a columnar HTAP replica like TiDB's TiFlash). Graphs
    aren't the analytics answer, and running heavy analytics on the OLTP primary
    harms transactional latency.
  ref: "concepts.md#when-newsql-is-the-right-call-and-when-it-is-not"

- id: databases-sql-nosql-sharding-replication-106
  difficulty: expert
  tags: [newsql, decision, over-engineering]
  question: |
    Which of these scenarios is the STRONGEST justification for adopting distributed
    SQL (Spanner/CockroachDB) rather than a cheaper alternative?
  options:
  - "A single-region app whose entire working set comfortably fits one Postgres primary, with a couple of read replicas already absorbing the read load and no plans to grow past that footprint"
  - "A pure high-throughput key-value workload with no cross-key transactions, no relational joins, and no requirement to survive the loss of an entire region beyond simple replica failover"
  - "A multi-region financial platform needing relational joins, ACID transactions across shards, and continued operation through a full region outage, that has outgrown a single primary"
  - "An analytics workload doing large columnar aggregations and full-table scans over historical data, where query latency on individual transactional row writes is essentially irrelevant to users"
  answer: 2
  explanation: |
    Distributed SQL earns its latency/cost tax exactly when you need relational + ACID
    + joins at horizontal scale AND survival of a region loss beyond a single primary
    — the financial multi-region case. A single Postgres suffices for case 1; NoSQL
    is cheaper for pure KV (case 2); a warehouse fits case 4.
  ref: "concepts.md#when-newsql-is-the-right-call-and-when-it-is-not"

  # ---------------- Cross-cutting advanced scenarios ----------------
- id: databases-sql-nosql-sharding-replication-107
  difficulty: advanced
  tags: [read-your-writes, lsn, routing]
  question: |
    You must guarantee read-your-writes for users while still serving most reads from
    async replicas (to protect the primary). Which mechanism achieves this most
    precisely without forcing all reads to the primary?
  options:
  - "Pin every user permanently to the primary for all of their reads, so the async replicas serve only anonymous or background traffic instead"
  - "Make all replicas fully synchronous so each commit waits for every replica to apply the write before acknowledging the user's original update"
  - "Capture the write's LSN/log position on commit, pass it with the user's subsequent reads, and route to (or wait for) a replica that has applied at least that LSN — otherwise read the primary"
  - "Disable caching entirely so that every read bypasses stale layers and is therefore always fresh enough to reflect the user's own recent write"
  answer: 2
  explanation: |
    LSN/version-aware routing lets a read require a replica caught up to at least the
    user's last write position (or briefly fall back to the primary), giving
    read-your-writes while keeping most reads on replicas. Pinning all reads to the
    primary defeats read scaling, all-synchronous replicas hurt write latency/HA,
    and disabling caching is unrelated.
  ref: "concepts.md#synchronous-versus-asynchronous-replication-and-replication-lag"

- id: databases-sql-nosql-sharding-replication-108
  difficulty: expert
  tags: [quorum, sloppy-quorum, hinted-handoff]
  question: |
    A leaderless store uses a "sloppy quorum" with hinted handoff during a network
    partition. What guarantee does this deliberately weaken, and what is the benefit?
  options:
  - "It strengthens consistency at the cost of availability, refusing writes on the minority side of the partition until the home replicas are reachable again"
  - "It guarantees linearizable reads throughout the partition, since every read is still routed to the key's designated home replicas before returning"
  - "It accepts W writes on ANY reachable healthy nodes (not necessarily the key's home replicas), preserving write availability during a partition, but W+R>N no longer guarantees overlap with the home replicas, so reads can miss recent writes until hints are handed back"
  - "It disables replication entirely until the partition heals, buffering all writes on the coordinator and replaying them once every node is reachable"
  answer: 2
  explanation: |
    A sloppy quorum lets writes land on any reachable nodes (with hints to forward
    later), keeping the system writable during a partition, but because those aren't
    the designated home replicas, the strict W+R>N overlap no longer holds and reads
    may not see the latest write until hinted handoff completes. It trades
    consistency for availability, not the reverse.
  ref: "concepts.md#replication-leader-follower-multi-leader-leaderless"

- id: databases-sql-nosql-sharding-replication-109
  difficulty: advanced
  tags: [consistent-prefix, causality, partitioning]
  question: |
    Across a partitioned/sharded datastore, an observer sees an answer to a question
    before the question itself, because the two writes went to different partitions
    replicating at different speeds. Which guarantee is violated?
  options:
  - "Durability — an acknowledged effect survives a crash but its cause does not, so the newer write is silently rolled back when the two partitions replicate at different speeds"
  - "Consistent prefix reads — causally-ordered writes are observed out of order; it is a known hazard when related writes span independently-replicated partitions"
  - "Atomicity — the question and its answer are meant to commit as one all-or-nothing unit, so observing only one of the two writes across the partitions tears that boundary"
  - "Monotonic writes — a single client's successive writes are applied out of their issued order on the lagging partition, so the answer lands ahead of the question"
  answer: 1
  explanation: |
    Seeing effects before their causes is a consistent-prefix violation, common when
    causally related writes live on different partitions that replicate at different
    rates. Fixes route causally related writes to the same partition or track
    causal dependencies. It is not durability, atomicity, or monotonic-writes.
  ref: "concepts.md#synchronous-versus-asynchronous-replication-and-replication-lag"

- id: databases-sql-nosql-sharding-replication-110
  difficulty: expert
  tags: [quorum, tunable-consistency, estimation]
  question: |
    A Cassandra cluster with RF=3 across 3 racks must survive one rack failing while
    still serving both reads and writes at QUORUM. With QUORUM = majority of RF (=2
    here), what happens when one rack (one replica per key) is down?
  options:
  - "Both reads and writes fail because QUORUM is defined as all RF replicas (3 here), so losing even one rack drops the reachable count below the required threshold"
  - "Only reads succeed, because a QUORUM read needs just 2 replicas while a QUORUM write must be durably acknowledged by all 3 replicas before returning"
  - "Reads and writes at QUORUM still succeed because 2 of 3 replicas remain reachable (2 >= majority of 3), and QUORUM read + QUORUM write satisfy W+R>N (2+2>3), preserving strong consistency"
  - "The cluster automatically drops both reads and writes to consistency level ONE the moment a rack fails, silently abandoning strong consistency until the rack recovers"
  answer: 2
  explanation: |
    QUORUM for RF=3 is 2 replicas. Losing one rack leaves 2 replicas reachable per
    key, so QUORUM reads and writes both still meet their required 2, and W+R = 4 > 3
    = N preserves read-your-writes overlap and strong consistency. It does not need
    all 3, writes aren't stricter than reads here, and it doesn't silently downgrade.
  ref: "concepts.md#replication-leader-follower-multi-leader-leaderless"
