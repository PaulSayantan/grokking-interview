      - "Shield Advanced only functions when keys are stored in a CloudHSM cluster fronting the protected resource"
      - "L7 application floods still require WAF rate-based rules; Shield is not a substitute for WAF at Layer 7"
      - "Shield Advanced disables TLS on protected endpoints so it can inspect the decrypted request payloads"
