    question: |
      A team subscribes to Shield Advanced and assumes it fully handles Layer 7 application
      floods. Why is this assumption risky?
    options:
      - "Shield Advanced blocks all traffic by default"
      - "Shield Advanced only works with CloudHSM"
      - "L7 application floods still require WAF rate-based rules; Shield is not a substitute for WAF at Layer 7"
      - "Shield Advanced disables TLS"
    answer: 2
    explanation: |
      Shield focuses on L3/L4 (with L7 auto-mitigation assistance), but effective L7 flood
