  - id: aws-security-kms-secrets-cognito-waf-062
    difficulty: advanced
    tags: [acm, cloudfront, gotcha]
    question: |
      You attach an ACM certificate to a CloudFront distribution but it doesn't appear as
      selectable. Your origin is in eu-west-1. What's wrong?
    options:
      - "CloudFront cannot use ACM certificates"
      - "CloudFront requires the certificate to be in us-east-1 regardless of origin Region"
      - "You must export the private key first"
      - "The certificate must be a private CA cert"
    answer: 1
    explanation: |
      CloudFront requires the ACM cert in us-east-1 (N. Virginia) no matter where the origin
      is — a classic gotcha. CloudFront does use ACM certs, you can't export a public ACM key,
      and it doesn't need to be a private CA cert.
    ref: "concepts.md#acm-for-tls-certificates"

  - id: aws-security-kms-secrets-cognito-waf-063
    difficulty: advanced
    tags: [acm, private-key, tradeoffs]
    question: |
      A team needs the TLS private key installed on an EC2 instance they manage. Why can't
      they use a standard public ACM certificate, and what should they use?
    options:
      - "Public ACM certs cost too much; use a cheaper public cert"
      - "ACM certs only work in us-east-1; deploy the instance there"
      - "The private key of a public ACM cert cannot be exported; use ACM Private CA (exportable certs) or import a third-party certificate"
      - "They can export it via the KMS Decrypt API"
    answer: 2
    explanation: |
      Public ACM cert private keys stay in AWS and can only be used by integrated services; for
      an on-host key you need ACM Private CA (which issues exportable certs) or an imported
      cert. Public certs are free, region requirement is CloudFront-specific, and KMS Decrypt
      doesn't export ACM keys.
    ref: "concepts.md#acm-for-tls-certificates"

  - id: aws-security-kms-secrets-cognito-waf-064
    difficulty: intermediate
    tags: [acm, validation, renewal]
    question: |
      Which domain-validation method is recommended for ACM certificates to ensure seamless
      automatic renewal?
    options:
      - "Email validation"
      - "Manual re-validation each year"
      - "IP-based validation"
      - "DNS validation (a CNAME record that stays in place)"
    answer: 3
    explanation: |
      DNS (CNAME) validation lets ACM auto-renew as long as the record remains, avoiding manual
      steps. Email validation requires periodic action, manual re-validation defeats automation,
      and IP-based validation isn't an ACM method.
    ref: "concepts.md#acm-for-tls-certificates"

  - id: aws-security-kms-secrets-cognito-waf-065
    difficulty: expert
    tags: [acm-private-ca, cost, mtls]
    question: |
      When is AWS Private CA (ACM Private CA) the right choice despite its ~$400/month per-CA
      cost?
    options:
      - "For internal PKI needs like service-to-service mTLS or issuing private/exportable certs at scale"
      - "For every public website to save money"
      - "To provision free public certificates"
      - "To protect against DDoS attacks"
    answer: 0
    explanation: |
      Private CA suits internal PKI: private certs for internal services, mTLS, and exportable
      certs. Public sites should use free public ACM certs; Private CA isn't for public certs or
      DDoS protection.
    ref: "concepts.md#acm-for-tls-certificates"

  # ---------------- Macie / GuardDuty / Inspector ----------------
  - id: aws-security-kms-secrets-cognito-waf-066
    difficulty: beginner
    tags: [macie, pii, s3]
    question: |
      Which AWS service discovers and classifies sensitive data (PII/PHI) in Amazon S3?
    options:
      - "Amazon GuardDuty"
      - "Amazon Macie"
      - "Amazon Inspector"
      - "AWS WAF"
    answer: 1
    explanation: |
      Macie uses ML/pattern matching to find and classify sensitive data in S3 and flag
      public/unencrypted buckets. GuardDuty detects threats, Inspector finds vulnerabilities,
      and WAF filters HTTP requests.
    ref: "concepts.md#threat-detection-macie-guardduty-and-inspector"

  - id: aws-security-kms-secrets-cognito-waf-067
    difficulty: intermediate
    tags: [guardduty, threat-detection]
    question: |
      Which service continuously analyzes CloudTrail, VPC Flow Logs, and DNS logs to detect
      compromised instances, credential exfiltration, and anomalous API activity?
    options:
      - "Amazon Macie"
      - "Amazon Inspector"
      - "Amazon GuardDuty"
      - "AWS Config"
    answer: 2
    explanation: |
      GuardDuty is the always-on threat-detection service analyzing CloudTrail, VPC Flow Logs,
      and DNS logs (plus add-ons). Macie targets S3 data classification, Inspector targets
      CVEs, and Config tracks resource configuration/compliance.
    ref: "concepts.md#threat-detection-macie-guardduty-and-inspector"

  - id: aws-security-kms-secrets-cognito-waf-068
    difficulty: intermediate
    tags: [inspector, vulnerability]
    question: |
      Which service scans EC2, ECR container images, and Lambda for known CVEs and network
      reachability?
    options:
      - "Amazon Macie"
      - "Amazon GuardDuty"
      - "AWS Shield"
      - "Amazon Inspector"
    answer: 3
    explanation: |
      Inspector is the vulnerability-management service scanning EC2/ECR/Lambda for CVEs and
      reachability. Macie is data classification, GuardDuty is threat detection, and Shield is
      DDoS protection.
    ref: "concepts.md#threat-detection-macie-guardduty-and-inspector"

  - id: aws-security-kms-secrets-cognito-waf-069
    difficulty: advanced
    tags: [detection, complementary, security-hub]
    question: |
      How should Macie, GuardDuty, and Inspector be positioned in a defense-in-depth strategy?
    options:
      - "They are complementary detective controls answering different questions (exposed data / active attack / vulnerable workload), best aggregated in Security Hub with EventBridge auto-remediation"
      - "They are interchangeable; pick one"
      - "They are preventive controls that block attacks inline"
      - "They replace the need for KMS and WAF"
    answer: 0
    explanation: |
      Each answers a distinct question — Macie (exposed sensitive data), GuardDuty (active
      threat), Inspector (vulnerabilities) — and they are detective, not preventive; aggregate
      findings in Security Hub and auto-remediate via EventBridge. They don't block inline or
      replace KMS/WAF.
    ref: "concepts.md#threat-detection-macie-guardduty-and-inspector"

  # ---------------- PII / tokenization ----------------
  - id: aws-security-kms-secrets-cognito-waf-070
    difficulty: advanced
    tags: [tokenization, pci, scope]
    question: |
      Why does tokenizing credit-card numbers (replacing them with tokens backed by a vault)
      reduce PCI-DSS compliance scope more than encrypting them?
    options:
      - "Encryption is not allowed under PCI-DSS"
      - "Downstream systems only ever handle non-sensitive tokens, so they fall out of PCI scope, whereas ciphertext is still the data and every keyholding system stays in scope"
      - "Tokens are faster to compute than ciphertext"
      - "Tokenization requires no storage at all"
    answer: 1
    explanation: |
      Tokenization keeps the real value only in a tightly controlled vault; systems handling
      just tokens are out of scope. Encryption keeps the data (ciphertext) and every keyholder
      in scope. Encryption is allowed, speed isn't the point, and a vault does store the mapping.
    ref: "concepts.md#pii-compliance-and-tokenization"

  - id: aws-security-kms-secrets-cognito-waf-071
    difficulty: expert
    tags: [tokenization, encryption, tradeoffs]
    question: |
      What is a key downside of tokenization compared with server-side encryption?
    options:
      - "Tokenization exposes the plaintext to more systems"
      - "It is reversible without the vault"
      - "It adds a vault dependency (availability and detokenize latency) and only fits well-structured values like cards or SSNs"
      - "It cannot reduce compliance scope"
    answer: 2
    explanation: |
      Tokenization introduces a vault dependency (a new availability/latency concern) and works
      best for structured values. It reduces exposure (fewer systems see plaintext), is not
      reversible without the vault, and does reduce compliance scope — so the other options are
      wrong.
    ref: "concepts.md#pii-compliance-and-tokenization"

  - id: aws-security-kms-secrets-cognito-waf-072
    difficulty: advanced
    tags: [client-side-encryption, field-level, tradeoffs]
    question: |
      A requirement states AWS itself must never be able to see certain field values in
      plaintext, even a service operator. Which approach fits, and what do you give up?
    options:
      - "SSE-KMS with an AWS managed key; you give up nothing"
      - "Enable TLS in transit only"
      - "Tokenize every field with a public token"
      - "Client-side / field-level encryption (e.g., AWS Encryption SDK) before data reaches the store; you give up server-side query/index on those fields"
    answer: 3
    explanation: |
      Client-side/field-level encryption encrypts before data hits the store so AWS never sees
      plaintext, at the cost of losing server-side search/indexing on encrypted fields. SSE-KMS
      lets AWS-managed services decrypt; TLS only protects transit; blanket tokenization has its
      own vault constraints and doesn't map to arbitrary fields.
    ref: "concepts.md#pii-compliance-and-tokenization"

  - id: aws-security-kms-secrets-cognito-waf-073
    difficulty: intermediate
    tags: [data-residency, compliance]
    question: |
      For regulated PII with data-residency requirements, which practice is most appropriate?
    options:
      - "Keep regulated data in-Region, use Region-scoped keys, and avoid cross-border replication unless MRKs and policy explicitly allow it"
      - "Replicate PII across all Regions for durability"
      - "Store PII only in Secrets Manager"
      - "Disable encryption to simplify audits"
    answer: 0
    explanation: |
      Data residency means keeping regulated data in-Region with Region-scoped keys and not
      replicating across borders without explicit MRK/policy allowance. Blanket cross-Region
      replication can violate residency, Secrets Manager isn't a PII datastore, and disabling
      encryption is never appropriate.
    ref: "concepts.md#pii-compliance-and-tokenization"

  # ---------------- Trade-offs / synthesis ----------------
  - id: aws-security-kms-secrets-cognito-waf-074
    difficulty: expert
    tags: [defense-in-depth, layering]
    question: |
      Which ordering best describes a layered defense-in-depth request path for a public,
      data-backed web app?
    options:
      - "KMS at rest only, with everything else optional"
      - "WAF/Shield at the edge → ACM TLS in transit → Cognito/IAM authN+authZ → KMS envelope encryption at rest → Secrets Manager for credentials → GuardDuty/Macie/Inspector detection → CloudTrail audit"
      - "CloudTrail first, then nothing else is needed"
      - "Shield alone provides full application security"
    answer: 1
    explanation: |
      Defense in depth layers independent controls: edge filtering (WAF/Shield), transit
      encryption (ACM), identity (Cognito/IAM), at-rest encryption (KMS), secret management,
      detection (GuardDuty/Macie/Inspector), and audit (CloudTrail). No single control (KMS
      alone, CloudTrail alone, Shield alone) is sufficient.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-security-kms-secrets-cognito-waf-075
    difficulty: expert
    tags: [service-selection, scenario]
    question: |
      A fintech needs: automatic DB credential rotation, per-tenant cryptographic isolation on
      one key, cross-Region DR read access to encrypted data, and edge L7 flood protection.
      Which stack maps correctly?
    options:
      - "Parameter Store for rotation, one AWS owned key, single-Region key, Shield Standard only"
      - "Hardcoded creds, CloudHSM for everything, no cross-Region strategy, GuardDuty for flood protection"
      - "Secrets Manager (alternating-users rotation), a CMK with per-tenant encryption context, multi-Region keys for DR decrypt, and WAF rate-based rules at the edge"
      - "Cognito identity pools for rotation, ACM for encryption context, MRK for DDoS"
    answer: 2
    explanation: |
      Secrets Manager provides managed rotation (alternating-users for zero downtime),
      encryption context enforces per-tenant isolation on one CMK, MRKs allow the DR Region to
      decrypt without a cross-Region call, and WAF rate-based rules handle L7 floods. The other
      stacks misuse services (owned keys can't rotate on demand, Cognito/ACM/GuardDuty don't do
      those jobs).
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-security-kms-secrets-cognito-waf-076
    difficulty: advanced
    tags: [service-selection, cost]
    question: |
      A startup with 50,000 mostly-static configuration parameters and a handful of database
      passwords wants to minimize cost while still auto-rotating the DB passwords. Best design?
    options:
      - "Put all 50,000 values plus the DB passwords in Secrets Manager"
      - "Put everything in CloudHSM"
      - "Store everything in a single Secrets Manager secret to pay for only one secret"
      - "Keep the 50,000 config values in Parameter Store SecureString (free) and put only the DB passwords in Secrets Manager for managed rotation"
    answer: 3
    explanation: |
      Split by need: free Parameter Store SecureString for the many static values, Secrets
      Manager only for the few credentials that benefit from managed rotation. Putting 50,000
      values in Secrets Manager costs ~$20k/year; CloudHSM is irrelevant; cramming everything
      into one secret breaks per-value access control and rotation.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-security-kms-secrets-cognito-waf-077
    difficulty: expert
    tags: [failure-modes, cross-region, single-region-key]
    question: |
      An active-active multi-Region app encrypts data in Region A with a single-Region CMK and
      replicates it to Region B. Region A then suffers a full outage. What failure does this
      design NOT tolerate?
    options:
      - "Region B cannot decrypt the replicated data because the single-Region key material lives only in Region A, which is down"
      - "Region B can still decrypt because keys are global"
      - "Data at rest becomes unencrypted"
      - "The refresh tokens expire"
    answer: 0
    explanation: |
      A single-Region key's material exists only in its Region; with Region A down, Region B
      can't call KMS there to decrypt — the design fails to tolerate a Region A outage. Fix it
      with multi-Region keys. Keys aren't global by default, data doesn't become unencrypted,
      and token expiry is unrelated.
    ref: "concepts.md#key-rotation-and-multi-region-keys"

  - id: aws-security-kms-secrets-cognito-waf-078
    difficulty: intermediate
    tags: [envelope-encryption, direct-encrypt, decision]
    question: |
      For which case is calling KMS Encrypt directly (no envelope encryption) actually
      appropriate?
    options:
      - "Encrypting a 500 MB video file"
      - "Encrypting a small secret under 4 KB with low call volume"
      - "Encrypting a high-throughput stream of millions of records per second"
      - "Encrypting an entire EBS volume"
    answer: 1
    explanation: |
      Direct KMS Encrypt is fine for tiny payloads under the 4 KB limit at low volume. Large
      files (500 MB, EBS volumes) exceed the limit, and high-throughput streams would hammer KMS
      request quotas — all call for envelope encryption / data keys.
    ref: "concepts.md#envelope-encryption-and-data-keys"
