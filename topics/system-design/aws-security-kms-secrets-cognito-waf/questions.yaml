      - "$1 per protected resource per month, no commitment"
      - "Free"
      - "$0.40 per protected resource per month"
    answer: 0
    explanation: |
      Shield Advanced is $3,000/month per organization on a 1-year commitment, plus data
      transfer fees. $1/month is a KMS key; free is Shield Standard; $0.40 is a Secrets Manager
