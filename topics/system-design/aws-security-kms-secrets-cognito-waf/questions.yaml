      - "DDoS cost protection (scaling credits), 24x7 Shield Response Team access, enhanced detection/visibility, and WAF at no extra basic charge on protected resources"
      - "Automatic TLS certificate provisioning and renewal for all CloudFront distributions behind the protected endpoint"
      - "PII and PHI discovery in S3 buckets, flagging objects left public or stored without server-side encryption"
