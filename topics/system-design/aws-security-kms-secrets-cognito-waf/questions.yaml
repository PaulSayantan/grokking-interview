  - id: aws-security-kms-secrets-cognito-waf-060
    difficulty: expert
    tags: [shield-advanced, decision, tradeoffs]
    question: |
      For which workload is subscribing to Shield Advanced most clearly justified?
    options:
      - "A low-traffic internal admin tool behind a VPN"
      - "A static S3 website with no dynamic backend"
      - "A batch job that runs nightly with no public endpoint"
      - "A high-value payments/gaming platform where a DDoS is a business-critical event and cost protection plus 24x7 SRT support are worth ~$36k/year"
    answer: 3
    explanation: |
      Advanced's cost is justified for high-value, high-visibility public targets needing
