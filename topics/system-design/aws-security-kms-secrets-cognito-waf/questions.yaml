      - "Free and always-on for every account, with paid support add-ons available per protected resource"
      - "$0.40 per protected resource per month plus a per-gigabyte charge for inspected attack traffic"
    answer: 0
    explanation: |
      Shield Advanced is $3,000/month per organization on a 1-year commitment, plus data
