topic: "AWS Tenant Isolation Architecture Patterns"
domain: system-design
topic_slug: aws-saas-isolation-patterns
version: 1
questions:
  - id: aws-saas-isolation-patterns-001
    difficulty: beginner
    tags: [isolation-spectrum, bridge, fundamentals]
    question: |
      In the AWS SaaS Factory model, tenant isolation is best described as:
    options:
      - "A spectrum from coarse infrastructure boundaries (account, VPC, subnet) to fine runtime boundaries (IAM, RLS) that you choose per layer"
      - "A binary architectural choice made once at design time: the whole system is either fully siloed or fully pooled"
      - "Purely a networking concern, solved entirely by security groups, NACLs, and route tables set at the VPC boundary"
      - "A concern relevant only to regulated, compliance-bound tenants and safely ignored for every other customer"
    answer: 0
    explanation: |
      Isolation runs along a spectrum and is chosen per layer/service/tier (the bridge model). It is
      not binary, it is not purely a network concern (SG/NACLs are not tenant isolation in a pool), and
      it applies to all multi-tenant systems, not just regulated ones.
    ref: "concepts.md#the-isolation-spectrum-and-the-per-layer-bridge-model"
  - id: aws-saas-isolation-patterns-002
    difficulty: beginner
    tags: [bridge, per-layer]
    question: |
      What does the "bridge" model mean in AWS multi-tenant design?
    options:
      - "Using AWS Transit Gateway as a routing bridge that stitches every tenant VPC into one shared hub network"
      - "A managed site-to-site VPN bridge that tunnels traffic securely between separate tenant AWS accounts"
      - "Picking silo or pool independently per layer, per microservice, and per tier"
      - "A fixed rule that always siloes the compute layer while always pooling the data layer across tenants"
    answer: 2
    explanation: |
      Bridge means mixing silo and pool independently across layers, services, and tiers. The Transit
      Gateway and VPN options are networking distractors; "always silo compute, always pool data" is a
      fixed rule that contradicts the whole point of the bridge model.
    ref: "concepts.md#the-isolation-spectrum-and-the-per-layer-bridge-model"
  - id: aws-saas-isolation-patterns-003
    difficulty: beginner
    tags: [control-plane, application-plane]
    question: |
      Where is tenant isolation actually enforced in the AWS SaaS control-plane/application-plane model?
    options:
      - "In the control plane, the shared layer that manages tenant onboarding, metering, and billing"
      - "In the application plane, which runs the multi-tenant product workload"
      - "In the consolidated billing pipeline, where per-tenant charges are separated and attributed"
      - "In the Organizations management (root) account, where SCP guardrails ultimately gate all access"
    answer: 1
    explanation: |
      The application plane runs the workload and is where isolation and tenant context are applied.
      The control plane onboards/meters/bills tenants and is itself shared/single-tenant; billing and
      the management account are control-plane concerns, not enforcement points.
    ref: "concepts.md#control-plane-versus-application-plane"
  - id: aws-saas-isolation-patterns-004
    difficulty: intermediate
    tags: [control-plane, saas-vs-msp]
    question: |
      A vendor deploys a completely separate AWS account and stack for each customer. What makes this
      "SaaS" rather than a managed-service provider (MSP) model?
    options:
      - "A shared control plane running one product version with unified onboarding, identity, metering, and ops"
      - "Enabling AWS consolidated billing so all per-customer accounts roll up under one payer account"
      - "Using CloudFormation StackSets to deploy the identical per-customer stack across every account automatically"
      - "Tagging every resource in each account with a tenant id for cost allocation and inventory reporting"
    answer: 0
    explanation: |
      Even a fully siloed application plane is SaaS only when wrapped by a shared control plane running
      a single version with unified onboarding/identity/metering/ops. IaC tooling, consolidated billing,
      and tags do not by themselves make it SaaS rather than per-customer managed hosting.
    ref: "concepts.md#control-plane-versus-application-plane"
  - id: aws-saas-isolation-patterns-005
    difficulty: beginner
    tags: [organizations, governance]
    question: |
      Which AWS service organizes tenant accounts into OUs and applies guardrails via Service Control
      Policies?
    options:
      - "Amazon VPC"
      - "AWS RAM"
      - "Amazon Cognito"
      - "AWS Organizations"
    answer: 3
    explanation: |
      AWS Organizations provides OUs, SCPs, and consolidated billing. VPC is networking, RAM shares
      resources across accounts, and Cognito is identity — none organize accounts into OUs with SCPs.
    ref: "concepts.md#governance-model-with-aws-organizations-ous-scps-and-consolidated-billing"
  - id: aws-saas-isolation-patterns-006
    difficulty: intermediate
    tags: [organizations, limits]
    question: |
      A governed multi-account SaaS built on AWS Control Tower plans for 20,000 tenant accounts, citing
      the 50,000 Organizations account limit. What is the most important correction?
    options:
      - "Organizations hard-caps at 5,000 member accounts with no increase possible, so a 20,000-tenant fleet simply cannot exist"
      - "Control Tower supports roughly 10,000 accounts, so the per-service org limit binds long before 50,000"
      - "OUs are capped at 100 per organization, and once you exhaust them the total account count becomes irrelevant"
      - "Consolidated billing silently stops aggregating charges above 1,000 accounts, breaking the payer roll-up"
    answer: 1
    explanation: |
      The real ceiling is the lowest per-service org limit you depend on — Control Tower is about 10,000
      accounts, well below the 50,000 Organizations limit. Organizations does reach 50,000, OUs cap at
      2,000 (not 100), and billing does not fail at 1,000.
    ref: "concepts.md#governance-model-with-aws-organizations-ous-scps-and-consolidated-billing"
  - id: aws-saas-isolation-patterns-007
    difficulty: advanced
    tags: [organizations, onboarding, limits]
    question: |
      A SaaS wants sub-minute self-service onboarding that vends a brand-new AWS account per signup at
      peak rates of hundreds of signups per minute. Why is this design fragile on AWS?
    options:
      - "SCP guardrails cannot be attached fast enough, leaving each freshly vended account briefly ungoverned during signup"
      - "Consolidated billing enrollment injects a mandatory 24-hour propagation delay before each new account can serve traffic"
      - "CreateAccount is rate-limited (~0.1 req/s, burst 3, ~5 concurrent creations), so account vending cannot keep up with rapid self-service onboarding"
      - "IAM Identity Center holds every new account in a pending state until an administrator manually approves it"
    answer: 2
    explanation: |
      Account creation is slow and rate-limited (~0.1 req/s, burst 3, ~5 concurrent), so coarse
      account-per-tenant vending cannot serve high-rate self-service onboarding. SCP attachment, billing
      delays, and IdC approval are not the governing constraint.
    ref: "concepts.md#governance-model-with-aws-organizations-ous-scps-and-consolidated-billing"
  - id: aws-saas-isolation-patterns-008
    difficulty: intermediate
    tags: [organizations, billing, cost]
    question: |
      A candidate claims account-per-tenant under one Organization always loses all volume discounts.
      What nuance corrects this?
    options:
      - "Discounts are irrelevant because AWS contractually requires member accounts to pay full list price individually"
      - "Only the payer (management) account is permitted to purchase Savings Plans, so member-account tenants receive none of the savings"
      - "Volume-tier discounts are scoped to a single VPC, and a multi-account topology structurally precludes ever earning them"
      - "Consolidated billing still pools Savings Plans, Reserved Instances, and volume-tier discounts across the org, even though per-account resources aren't bin-packed"
    answer: 3
    explanation: |
      Consolidated billing pools Savings Plans/RI/volume-tier discounts across the org — you lose
      resource-level bin-packing efficiency, not aggregate purchasing discounts. The other statements
      are false.
    ref: "concepts.md#governance-model-with-aws-organizations-ous-scps-and-consolidated-billing"
  - id: aws-saas-isolation-patterns-009
    difficulty: advanced
    tags: [organizations, scp, failure-mode]
    question: |
      Which is a realistic failure mode specific to the governance model?
    options:
      - "A misconfigured Postgres Row-Level Security policy leaks rows across tenants sharing one pooled table"
      - "An overly broad SCP locks out your own provisioning automation, or a shared-service account (logging/networking) becomes a single dependency every tenant relies on"
      - "A DynamoDB hot partition throttles one large tenant when its partition key exceeds per-partition throughput"
      - "An STS inline session policy silently truncates once it exceeds the 2,048-character hard limit per request"
    answer: 1
    explanation: |
      SCP misconfiguration and shared-service-account single-dependency are governance-specific risks.
      RLS leaks are a data-layer issue, hot partitions are DynamoDB, and the 2,048-char limit is a
      runtime-IAM concern — none are unique to the org governance layer.
    ref: "concepts.md#governance-model-with-aws-organizations-ous-scps-and-consolidated-billing"
  - id: aws-saas-isolation-patterns-010
    difficulty: expert
    tags: [organizations, scp, limits]
    question: |
      Which set of AWS Organizations limits is correct?
    options:
      - "Up to 1,000 accounts, 500 OUs, OU nesting 10 levels, max 50 SCPs per entity"
      - "Unlimited accounts, 1 OU, no nesting, 1 SCP per entity"
      - "Up to 50,000 accounts (raisable), 2,000 OUs, OU nesting 5 levels, max 10 SCPs attached per entity"
      - "Up to 50,000 accounts, 20,000 OUs, unlimited nesting, unlimited SCPs per entity"
    answer: 2
    explanation: |
      Organizations: default 10 accounts raisable to ~50,000, 2,000 OUs, 5-level OU nesting, and a max
      of 10 SCPs attached per entity. The other options misstate these ceilings.
    ref: "concepts.md#governance-model-with-aws-organizations-ous-scps-and-consolidated-billing"
  - id: aws-saas-isolation-patterns-011
    difficulty: beginner
    tags: [account-per-tenant, silo]
    question: |
      Account-per-tenant is best described as which kind of isolation?
    options:
      - "The strongest full-stack silo, one AWS account per tenant"
      - "The weakest and cheapest pooled model, where all tenants share one account and schema"
      - "A runtime IAM scoping technique that narrows a shared role's permissions per request"
      - "A DynamoDB partitioning strategy that keys each tenant's items by a tenant_id prefix"
    answer: 0
    explanation: |
      An AWS account per tenant is the strongest full-stack silo. It is not a pooled/cheap model, not a
      runtime scoping technique, and not a data-partitioning strategy.
    ref: "concepts.md#account-per-tenant-full-silo"
  - id: aws-saas-isolation-patterns-012
    difficulty: beginner
    tags: [account-per-tenant, cost-attribution]
    question: |
      Why is per-tenant cost attribution trivial in the account-per-tenant model?
    options:
      - "The AWS account itself is the cost boundary, so native billing already reports cost per tenant with no tagging"
      - "The dynamodb:LeadingKeys condition meters each tenant's spend and reports it back to billing automatically"
      - "AWS generates and emails a separate itemized invoice per tenant account with no configuration required"
      - "Cost allocation tags are mandatory in this model and AWS auto-applies a tenant tag to every resource"
    answer: 0
    explanation: |
      The account is the cost boundary; native per-account billing attributes cost per tenant without
      tags. There is no automatic per-tenant emailed invoice, LeadingKeys is a data-isolation control,
      and tags are a pooled-model mechanism not needed here.
    ref: "concepts.md#account-per-tenant-full-silo"
  - id: aws-saas-isolation-patterns-013
    difficulty: intermediate
    tags: [account-per-tenant, trade-offs]
    question: |
      Which is the PRIMARY trade-off of account-per-tenant versus a pooled shared-schema model?
    options:
      - "Account-per-tenant onboards faster than pooling but gives up compliance and blast-radius guarantees in exchange"
      - "Account-per-tenant maximizes isolation, blast-radius containment, and cost attribution but sacrifices economies of scale, onboarding speed, and operational leverage"
      - "Pooled shared-schema has the smaller blast radius because one shared table confines any failure to a single row"
      - "There is no meaningful difference between the two once cost allocation tags are applied to every resource"
    answer: 1
    explanation: |
      The core trade is isolation/blast-radius/attribution vs. efficiency/onboarding/ops leverage.
      Account-per-tenant is actually slower to onboard and stronger on compliance, pooled has a larger
      blast radius, and the models differ fundamentally.
    ref: "concepts.md#account-per-tenant-full-silo"
  - id: aws-saas-isolation-patterns-014
    difficulty: intermediate
    tags: [account-per-tenant, provisioning]
    question: |
      Which AWS tooling combination is most appropriate for vending and provisioning per-tenant
      accounts?
    options:
      - "Cognito user pools for tenant sign-up plus API Gateway usage plans to gate each new account's access"
      - "A DynamoDB tenant-map table fronted by RDS Proxy to look up and connect each tenant to its own account"
      - "Route 53 health checks with CloudFront distributions to route and cache traffic to each tenant's new account"
      - "Control Tower Account Factory / AFT for vending, plus CloudFormation StackSets or CDK/Terraform for the per-account stack"
    answer: 3
    explanation: |
      Account Factory/AFT vend accounts and StackSets/CDK/Terraform deploy the per-account stack.
      Cognito/usage plans are identity/throttling, the DynamoDB/RDS Proxy pair is pooled data, and
      Route 53/CloudFront is routing/CDN — none provision accounts.
    ref: "concepts.md#account-per-tenant-full-silo"
  - id: aws-saas-isolation-patterns-015
    difficulty: advanced
    tags: [account-per-tenant, scenario, compliance]
    question: |
      A healthcare SaaS has 15 large enterprise hospital tenants, each requiring HIPAA attestation,
      dedicated encryption boundaries, and per-tenant invoices. Ops maturity is high. Which model fits
      best?
    options:
      - "Pooled EKS namespaces separated by Calico NetworkPolicies, sharing worker nodes across all 15 hospitals"
      - "A single shared DynamoDB table keyed by tenant_id, with LeadingKeys conditions enforcing per-hospital access"
      - "Account-per-tenant under a governance Organization, with a shared control plane running one version"
      - "Subnet-per-tenant inside one shared VPC, isolating each hospital with dedicated NACLs and security groups"
    answer: 2
    explanation: |
      Few, high-value, regulated tenants with high ops maturity and per-tenant billing is the textbook
      account-per-tenant case. Pooled namespaces and a shared table weaken the compliance/blast-radius
      story; subnet-level shares a VPC control plane and is not recommended at this bar.
    ref: "concepts.md#account-per-tenant-full-silo"
  - id: aws-saas-isolation-patterns-016
    difficulty: advanced
    tags: [account-per-tenant, ops, monitoring]
    question: |
      What operational challenge is inherent to account-per-tenant that pooled models avoid?
    options:
      - "Hot partitions on the shared table when one tenant's traffic overwhelms a single physical partition"
      - "STS inline session-policy character limits that cap how many tenants one role can be scoped to"
      - "Decentralized monitoring and deploys — you must aggregate logs/metrics across many accounts and roll changes across N stacks"
      - "CoreDNS service enumeration across namespaces letting one tenant's pods discover another's endpoints"
    answer: 2
    explanation: |
      Silo means decentralized ops: aggregating observability across accounts and deploying to N stacks.
      Hot partitions, session-policy limits, and CoreDNS enumeration are pooled-model issues.
    ref: "concepts.md#account-per-tenant-full-silo"
  - id: aws-saas-isolation-patterns-017
    difficulty: beginner
    tags: [vpc-per-tenant, network]
    question: |
      In the VPC-per-tenant model, what is the isolation boundary?
    options:
      - "The AWS account, with a separate account provisioned and governed for each individual tenant"
      - "The VPC (network boundary), with one VPC per tenant in a single account"
      - "The DynamoDB partition key, with each tenant's items segregated under a tenant_id leading key"
      - "The Kubernetes namespace, with one namespace per tenant carving up a shared EKS cluster"
    answer: 1
    explanation: |
      VPC-per-tenant draws the boundary at the network/VPC within a single account. Account, partition
      key, and namespace are the boundaries of other patterns.
    ref: "concepts.md#vpc-per-tenant-isolation-in-a-single-account"
  - id: aws-saas-isolation-patterns-018
    difficulty: intermediate
    tags: [vpc-per-tenant, limits]
    question: |
      Which AWS limit does a VPC-per-tenant design hit FIRST as tenant count grows?
    options:
      - "The DynamoDB 400 KB item-size limit, exceeded once each tenant's records grow past that ceiling"
      - "Lambda reserved-concurrency quotas, exhausted as each tenant's dedicated functions reserve their slice"
      - "The VPCs-per-Region quota (default 5, raisable to hundreds — not thousands)"
      - "The Cognito app-clients-per-user-pool limit, hit as each tenant registers its own dedicated app client"
    answer: 2
    explanation: |
      VPCs per Region default to 5 and raise only to the hundreds, so that ceiling binds first. Item
      size, Lambda concurrency, and Cognito app clients are unrelated to VPC count.
    ref: "concepts.md#vpc-per-tenant-isolation-in-a-single-account"
  - id: aws-saas-isolation-patterns-019
    difficulty: intermediate
    tags: [vpc-per-tenant, cost, reserved-instances]
    question: |
      Compared with account-per-tenant, why can VPC-per-tenant improve Reserved-Instance and
      Savings-Plan utilization?
    options:
      - "Reservations are cheaper when purchased inside a VPC, because the VPC boundary itself qualifies the instances for a lower per-hour reserved rate"
      - "All tenant VPCs share one account, so reservations live in that account and float across tenants for better utilization"
      - "Each VPC automatically purchases Savings Plans on your behalf whenever a new tenant workload launches inside it"
      - "VPC peering connections come bundled with a built-in reservation discount that lowers the cost of instances on both peered sides"
    answer: 1
    explanation: |
      Single-account, multi-VPC means reservations can be utilized across tenants rather than stranded
      per account. Reservations are not cheaper per VPC, VPCs do not buy Savings Plans, and peering has
      no reservation discount.
    ref: "concepts.md#vpc-per-tenant-isolation-in-a-single-account"
  - id: aws-saas-isolation-patterns-020
    difficulty: advanced
    tags: [vpc-per-tenant, connectivity]
    question: |
      To connect a few hundred tenant VPCs to a shared-services VPC, which approach scales best and
      avoids an N-by-N mesh?
    options:
      - "Full-mesh VPC peering that establishes a dedicated peering connection between every pair of tenant VPCs and the shared-services VPC"
      - "Collapsing all tenants into one shared subnet so a single route table transitively reaches the shared-services VPC for everyone"
      - "Routing tenant-to-shared-services traffic over the public internet with Elastic IPs, relying on TLS to keep each tenant's flows separated"
      - "A Transit Gateway hub (or PrivateLink for service-level exposure) instead of N-by-N peering"
    answer: 3
    explanation: |
      Transit Gateway (or PrivateLink) hubs connectivity and avoids non-transitive peering meshes.
      Full-mesh peering explodes combinatorially, one subnet abandons VPC isolation, and public routing
      is insecure.
    ref: "concepts.md#vpc-per-tenant-isolation-in-a-single-account"
  - id: aws-saas-isolation-patterns-021
    difficulty: expert
    tags: [vpc-per-tenant, cidr, failure-mode]
    question: |
      A VPC-per-tenant deployment created every tenant VPC with the same 10.0.0.0/16 CIDR. What breaks?
    options:
      - "Nothing — identical CIDRs overlap freely because each VPC is a self-contained namespace and AWS silently NATs the ranges apart when they communicate"
      - "Security groups across the tenant VPCs stop accepting new rules once their referenced CIDR blocks collide, forcing you to switch to NACL-only filtering"
      - "VPC peering and Transit Gateway routing become impossible because overlapping CIDRs cannot be routed between VPCs"
      - "DynamoDB begins throttling the affected tenant because overlapping VPC ranges collide with its VPC-endpoint routing table"
    answer: 2
    explanation: |
      Overlapping CIDRs make inter-VPC routing (peering/TGW) impossible — you must allocate
      non-overlapping CIDR space up front. Overlap is not free, SGs are unaffected, and this is a
      networking, not DynamoDB, issue.
    ref: "concepts.md#vpc-per-tenant-isolation-in-a-single-account"
  - id: aws-saas-isolation-patterns-022
    difficulty: expert
    tags: [vpc-per-tenant, limits]
    question: |
      Which VPC quota set is correct (per Region unless noted)?
    options:
      - "5 VPCs (raisable to hundreds), 200 subnets/route-tables/NACLs per VPC, 2,500 SGs/Region, 60 inbound + 60 outbound rules per SG"
      - "50 VPCs (fixed, non-raisable), 20 subnets/route-tables/NACLs per VPC, 100 SGs/Region, 5 inbound + 5 outbound rules per SG"
      - "Unlimited VPCs, exactly 1 subnet and 1 route table per VPC, no nesting, and a hard cap of 1 SG per VPC with unlimited rules"
      - "5 VPCs (non-raisable), 5 subnets/route-tables/NACLs per VPC, 5 SGs total per Region, 5 inbound + 5 outbound rules per SG"
    answer: 0
    explanation: |
      Default 5 VPCs/Region (raisable to hundreds), 200 subnets/route-tables/NACLs per VPC, 2,500
      SGs/Region, 60+60 rules per SG. The others misstate the limits.
    ref: "concepts.md#vpc-per-tenant-isolation-in-a-single-account"
  - id: aws-saas-isolation-patterns-023
    difficulty: beginner
    tags: [subnet-level, not-recommended]
    question: |
      What is AWS's guidance on subnet-per-tenant isolation within a single shared VPC?
    options:
      - "It is the recommended default for large SaaS fleets because one subnet per tenant scales cleanly to thousands of tenants in a single VPC"
      - "It is explicitly not recommended as a preferred model, suitable only for small fixed tenant sets"
      - "It is a mandatory requirement for HIPAA workloads, which cannot be certified unless each tenant sits in its own dedicated subnet"
      - "It provides stronger isolation than account-per-tenant, since subnet NACLs enforce a harder boundary than separate AWS account credentials"
    answer: 1
    explanation: |
      AWS says subnet-level isolation is not a preferred model and fits only small fixed tenant sets.
      It is not the default, not a HIPAA requirement, and weaker than account-per-tenant.
    ref: "concepts.md#subnet-level-isolation-in-a-single-vpc"
  - id: aws-saas-isolation-patterns-024
    difficulty: intermediate
    tags: [subnet-level, nacl, sprawl]
    question: |
      Which drawback most limits subnet-per-tenant isolation as tenant count grows?
    options:
      - "NACL/SG rule sprawl (NACLs cap at 20 rules) plus shared VPC-wide settings (DHCP, routes) that affect ALL tenants"
      - "Each tenant subnet must be provisioned in its own separate AWS account, reintroducing full account-vending overhead per tenant"
      - "VPC peering connections become mandatory between every pair of subnets, so the connectivity mesh explodes as tenants are added"
      - "DynamoDB LeadingKeys conditions silently stop enforcing per-tenant item access once more than a handful of subnets share the VPC"
    answer: 0
    explanation: |
      Rule sprawl and shared VPC-level config that hits all tenants are the killers. No peering is
      needed within one VPC, subnets don't need separate accounts, and DynamoDB is unrelated.
    ref: "concepts.md#subnet-level-isolation-in-a-single-vpc"
  - id: aws-saas-isolation-patterns-025
    difficulty: advanced
    tags: [subnet-level, blast-radius]
    question: |
      Why does subnet-per-tenant have a wider config blast radius than VPC-per-tenant?
    options:
      - "Subnets cannot attach security groups at all, so a config change to one tenant's rules necessarily rewrites the rules for every other tenant"
      - "Subnets are billed as a per-tenant line item, so any pricing change AWS makes to subnets cascades across all tenants at once"
      - "Subnets require a Transit Gateway attachment each, so a single TGW route-table edit simultaneously disrupts every tenant in the VPC"
      - "VPC-wide settings such as the DHCP option set and route propagation are shared, so one change affects every tenant in the VPC"
    answer: 3
    explanation: |
      A single shared VPC control plane (DHCP options, routes, VPC config) means one change impacts all
      tenants. Subnets do use SGs, billing is unrelated, and TGW is not required within one VPC.
    ref: "concepts.md#subnet-level-isolation-in-a-single-vpc"
  - id: aws-saas-isolation-patterns-026
    difficulty: intermediate
    tags: [subnet-level, scenario]
    question: |
      A cost-sensitive startup with exactly 6 fixed internal tenants and no peering appetite wants
      network separation without multiple VPCs. Which model is the pragmatic (if not ideal) fit?
    options:
      - "Subnet-per-tenant in one VPC, accepting the shared-VPC blast radius and rule management"
      - "Cluster-per-tenant EKS, giving each of the 6 internal tenants a dedicated control plane and worker node group"
      - "Account-per-tenant under a governance Organization, vending a separate AWS account for each of the 6 internal tenants"
      - "VPC-per-tenant wired together with a Transit Gateway hub for the 6 tenants, exactly the peering appetite they wanted to avoid"
    answer: 0
    explanation: |
      A small fixed tenant set with no peering appetite is the narrow niche where subnet-level is
      acceptable. Account-per-tenant and cluster-per-tenant are overkill/expensive; VPC-per-tenant with
      TGW reintroduces the connectivity they want to avoid.
    ref: "concepts.md#subnet-level-isolation-in-a-single-vpc"
  - id: aws-saas-isolation-patterns-027
    difficulty: beginner
    tags: [container, eks, pooled]
    question: |
      Container-layer isolation with EKS namespaces is primarily which kind of pattern?
    options:
      - "A full-stack silo, since each namespace provisions its own dedicated control plane, nodes, and network"
      - "A pooled-compute pattern with logical separation via orchestrator constructs"
      - "A network-only isolation model, where the namespace boundary is enforced purely by security groups and route tables"
      - "A billing model, whose sole purpose is to attribute per-tenant infrastructure cost back to each namespace"
    answer: 1
    explanation: |
      A shared cluster with per-tenant namespaces is the main pooled-compute pattern. It is not a full
      silo, not network-only, and not a billing model.
    ref: "concepts.md#container-layer-isolation-with-ecs-and-eks"
  - id: aws-saas-isolation-patterns-028
    difficulty: intermediate
    tags: [eks, namespace, security-boundary]
    question: |
      Why is a Kubernetes namespace NOT a strong security boundary for tenant isolation on EKS?
    options:
      - "Namespaces incur a metered per-tenant surcharge from EKS, so isolating tenants this way is rejected purely on cost grounds"
      - "Namespaces cannot run more than one pod each, forcing every tenant into a single-pod deployment that cannot scale horizontally"
      - "Kubernetes is a single-tenant orchestrator: the cluster is the only strong boundary, namespaces are globally scoped, and pods can talk to each other and enumerate services by default"
      - "Namespaces disable IAM entirely for their pods, so no tenant workload inside a namespace can ever obtain scoped AWS credentials"
    answer: 2
    explanation: |
      The cluster is the only strong boundary; namespaces are globally scoped and pods communicate and
      enumerate CoreDNS by default. Namespaces are free, run many pods, and do not disable IAM.
    ref: "concepts.md#container-layer-isolation-with-ecs-and-eks"
  - id: aws-saas-isolation-patterns-029
    difficulty: intermediate
    tags: [eks, networkpolicy, calico]
    question: |
      By default, pods across tenant namespaces on EKS can communicate. What is required to actually
      restrict cross-namespace traffic?
    options:
      - "Nothing — namespaces block all cross-namespace pod traffic automatically the moment they are created"
      - "Enabling AWS consolidated billing on the organization, which transparently firewalls pods belonging to different tenants"
      - "Provisioning a separate AWS account for each namespace so that account-boundary security groups keep the pods apart"
      - "NetworkPolicies enforced by an engine such as Calico or Cilium (the VPC CNI also supports Kubernetes NetworkPolicies)"
    answer: 3
    explanation: |
      NetworkPolicies require an enforcing CNI (Calico/Cilium, or the VPC CNI). Namespaces do not block
      traffic by default; billing and separate accounts are unrelated.
    ref: "concepts.md#container-layer-isolation-with-ecs-and-eks"
  - id: aws-saas-isolation-patterns-030
    difficulty: advanced
    tags: [eks, node, blast-radius]
    question: |
      What is the blast radius when tenants share worker nodes in a pooled EKS cluster, and how is it
      narrowed?
    options:
      - "Blast radius is strictly per-pod because the container runtime fully isolates each pod's memory and filesystem, so no further hardening is needed"
      - "A node compromise exposes all Secrets/ConfigMaps/volumes and enables lateral movement on that node; narrow it with sole-tenant nodes (affinity + taints/tolerations), Fargate, or microVM sandboxing"
      - "Blast radius is the entire Region because a shared node lets an attacker pivot across every Availability Zone, so only a multi-Region split contains it"
      - "Blast radius is the whole AWS account since pods inherit the node instance profile, so attaching restrictive SCPs to the tenant OU is the only mitigation"
    answer: 1
    explanation: |
      Shared nodes make the blast radius node-level; sole-tenant nodes, Fargate, or Firecracker/Kata
      sandboxing narrow it. It is not per-pod by default, not Region-wide, and not per-account.
    ref: "concepts.md#container-layer-isolation-with-ecs-and-eks"
  - id: aws-saas-isolation-patterns-031
    difficulty: advanced
    tags: [eks, irsa, pod-identity]
    question: |
      How do you give a pod tenant-scoped temporary AWS credentials in a pooled EKS cluster?
    options:
      - "Bake long-lived IAM access keys directly into the container image so every pod ships with the tenant's credentials pre-provisioned"
      - "Attach the shared node instance profile to all pods so each workload inherits the worker node's role and its full permission set"
      - "IRSA (IAM Roles for Service Accounts) or EKS Pod Identity for per-workload temporary credentials"
      - "Store the tenant's credentials in a shared ConfigMap and mount it into each pod so they can read the keys at startup"
    answer: 2
    explanation: |
      IRSA and EKS Pod Identity deliver per-pod temporary credentials. Baked keys, the shared node role,
      and a shared ConfigMap all break per-tenant credential isolation.
    ref: "concepts.md#container-layer-isolation-with-ecs-and-eks"
  - id: aws-saas-isolation-patterns-032
    difficulty: advanced
    tags: [eks, tiering, resourcequota]
    question: |
      A premium tenant must be guaranteed capacity while basic tenants are capped, all in one EKS
      cluster. Which controls implement this tiering?
    options:
      - "Route 53 latency-based routing that steers premium tenants to the closest cluster region to guarantee them capacity"
      - "Per-namespace ResourceQuota/LimitRange plus Pod priority/preemption so premium tenants preempt lower tiers"
      - "DynamoDB adaptive capacity, which automatically redistributes cluster compute toward the premium tenant's hottest workloads"
      - "S3 prefix conditions on the premium tenant's bucket path that reserve cluster CPU and memory for that tenant"
    answer: 1
    explanation: |
      ResourceQuota/LimitRange cap tenants and Pod priority/preemption favor premium. Route 53,
      DynamoDB adaptive capacity, and S3 prefixes are unrelated to EKS compute tiering.
    ref: "concepts.md#container-layer-isolation-with-ecs-and-eks"
  - id: aws-saas-isolation-patterns-033
    difficulty: expert
    tags: [eks, hard-multitenancy, cluster-per-tenant]
    question: |
      When is cluster-per-tenant ("hard multi-tenancy") on EKS justified despite its cost?
    options:
      - "Whenever you have more than 5 tenants, since EKS namespaces are hard-capped at 5 tenants per cluster"
      - "Never — per-tenant namespaces provide an equally strong security boundary in every scenario, so a cluster per tenant is always wasteful"
      - "When tenants require the strongest isolation and you accept per-cluster control-plane cost, no compute sharing, and slower provisioning than namespaces"
      - "Only for stateless workloads, because stateful tenants cannot be split across separate EKS clusters"
    answer: 2
    explanation: |
      Cluster-per-tenant is the strongest EKS isolation but pays a control-plane cost per cluster, loses
      bin-packing, and provisions slower — justified when isolation demands it. It is not tied to a tenant
      count, namespaces are not always enough, and it isn't limited to stateless apps.
    ref: "concepts.md#container-layer-isolation-with-ecs-and-eks"
  - id: aws-saas-isolation-patterns-034
    difficulty: expert
    tags: [eks, admission, sandbox]
    question: |
      Which combination hardens a pooled EKS cluster toward "hard-ish" isolation?
    options:
      - "OPA/Gatekeeper or Kyverno to enforce node affinity/Pod Security, plus Fargate/Firecracker sandboxing and Bottlerocket, with seccomp/AppArmor/SELinux contexts"
      - "Disabling Kubernetes RBAC entirely and relying on subnet NACLs to keep each tenant's pods from reaching another tenant's resources"
      - "Running all tenant workloads as cluster-admin under one shared service account so a single audited identity governs every pod"
      - "Placing every tenant's pods in the default namespace and using pod name prefixes to keep the tenants logically separated"
    answer: 0
    explanation: |
      Admission engines plus pod sandboxing and hardened OS/security contexts move a pool toward hard
      isolation. Disabling RBAC, cluster-admin sharing, and one default namespace all weaken isolation.
    ref: "concepts.md#container-layer-isolation-with-ecs-and-eks"
  - id: aws-saas-isolation-patterns-035
    difficulty: intermediate
    tags: [lambda, serverless, silo-pool]
    question: |
      For 1,000 tenants on Lambda, why is a per-tenant function + per-tenant execution role usually a
      poor choice, and what is the pooled alternative?
    options:
      - "It is fine; Lambda imposes no per-account function or role limits, and you pool simply by deploying every tenant's function into one Region"
      - "It is unwieldy and hits Lambda/IAM limits at scale; the pooled alternative is one shared function that assumes tenant-scoped credentials at runtime"
      - "Per-tenant functions are strictly cheaper because each scales to zero independently, and Lambda offers no pooled multi-tenant option at all"
      - "You must abandon Lambda and run tenants on EC2 instead, because Lambda cannot carry tenant context or assume scoped credentials per request"
    answer: 1
    explanation: |
      Silo-per-function is only viable for a premium tier and hits limits at 1,000 tenants; pooling uses
      one shared function that assumes tenant-scoped credentials at runtime. The other options are wrong.
    ref: "concepts.md#container-layer-isolation-with-ecs-and-eks"
  - id: aws-saas-isolation-patterns-036
    difficulty: beginner
    tags: [data-layer, pool, tenant-id]
    question: |
      Which data-layer sub-model represents the pure pool (best economies of scale, widest shared
      attack surface)?
    options:
      - "A dedicated RDS instance per tenant, giving each tenant its own isolated database engine and storage"
      - "One shared RDS instance that carves out a separate logical database (schema) for each individual tenant"
      - "A dedicated DynamoDB table per tenant, isolating each tenant's items into its own separately provisioned table"
      - "One shared table/schema with a tenant_id discriminator column (e.g., Postgres RLS, DynamoDB partition key = tenant)"
    answer: 3
    explanation: |
      Shared schema with a tenant_id column is the pooled model. Instance-per-tenant, DB-per-tenant, and
      table-per-tenant are more siloed sub-models.
    ref: "concepts.md#data-layer-isolation-on-aws"
  - id: aws-saas-isolation-patterns-037
    difficulty: intermediate
    tags: [dynamodb, hot-partition, limits]
    question: |
      Using tenant_id directly as the DynamoDB partition key risks what failure for a very large
      tenant, and how is it mitigated?
    options:
      - "Item-size overflow past the 400 KB cap once a large tenant's rows accumulate; move the entire dataset into S3 and query it there"
      - "A hot partition (physical partition caps ~3,000 RCU / 1,000 WCU, ~10 GB); mitigate with a tenant-lookup table plus secondary sharding or write-sharding suffixes"
      - "Cross-Region replication lag that leaves the tenant's recent writes stale; enable DynamoDB global tables to keep replicas synchronized"
      - "IAM policy-document overflow as the tenant accrues too many per-item grants; consolidate them under Organizations SCPs to stay in the size limit"
    answer: 1
    explanation: |
      A single tenant partition can exceed per-partition throughput/size caps → hot partition; fix with
      a lookup/sharding table or write-sharding. Item size, replication, and SCPs are unrelated to this
      specific failure.
    ref: "concepts.md#data-layer-isolation-on-aws"
  - id: aws-saas-isolation-patterns-038
    difficulty: advanced
    tags: [dynamodb, leadingkeys, iam]
    question: |
      Which IAM condition enforces item-level tenant isolation in a pooled DynamoDB table?
    options:
      - "s3:prefix scoped to the tenant's object-key prefix so the same policy also covers the table"
      - "aws:SourceVpc pinned to the tenant's dedicated VPC endpoint so only its network reaches the items"
      - "dynamodb:LeadingKeys constrained to the tenant's partition-key value"
      - "sts:ExternalId matched to the tenant identifier so cross-account assume-role grants item access"
    answer: 2
    explanation: |
      dynamodb:LeadingKeys restricts access to items whose partition key matches the tenant. s3:prefix
      is for S3, and SourceVpc/ExternalId do not scope item access.
    ref: "concepts.md#data-layer-isolation-on-aws"
  - id: aws-saas-isolation-patterns-039
    difficulty: advanced
    tags: [rds, rls, postgres]
    question: |
      A team relies on Postgres Row-Level Security for pooled tenant isolation. What key caveat must
      they state in an interview?
    options:
      - "RLS transparently encrypts every row at rest with a per-tenant KMS key, so enabling it removes the need for separate storage encryption"
      - "RLS multiplexes tenant sessions internally, so once policies are active you can drop RDS Proxy and per-tenant connection pooling entirely"
      - "RLS is a DynamoDB-only feature exposed through LeadingKeys, so it does not apply to a pooled Postgres or Aurora table at all"
      - "RLS is application-enforced via a session variable and can be bypassed by a DB superuser or a misconfiguration, so it is not a hard boundary"
    answer: 3
    explanation: |
      RLS depends on correctly setting a session variable and can be bypassed by superusers/misconfig —
      not a hard boundary. It does not encrypt, does not replace pooling, and is a Postgres (not
      DynamoDB) feature.
    ref: "concepts.md#data-layer-isolation-on-aws"
  - id: aws-saas-isolation-patterns-040
    difficulty: intermediate
    tags: [rds, rds-proxy, connections]
    question: |
      In a pooled RDS/Aurora model with many concurrent Lambda invocations per tenant, which service
      addresses connection exhaustion?
    options:
      - "Amazon RDS Proxy for connection pooling"
      - "Amazon Route 53 latency-based records, so each tenant's Lambdas resolve to the closest replica and stop exhausting connections"
      - "AWS RAM shares of the database subnet group, letting many accounts fan connections in without hitting the instance limit"
      - "Amazon Cognito identity pooling, which reuses one authenticated database session across all of the tenant's invocations"
    answer: 0
    explanation: |
      RDS connection limits scale with instance memory; RDS Proxy pools connections. Route 53, RAM, and
      Cognito do not address database connections.
    ref: "concepts.md#data-layer-isolation-on-aws"
  - id: aws-saas-isolation-patterns-041
    difficulty: expert
    tags: [dynamodb, limits, table-per-tenant]
    question: |
      Why does DynamoDB table-per-tenant fail to scale past roughly 10,000 tenants in one account?
    options:
      - "Individual items are capped at 400 KB, and once a tenant's largest record crosses that ceiling its whole table stops accepting writes"
      - "DynamoDB is hard-limited to 100 tables per Region with no increase available, so the fleet exhausts the quota after only 100 tenants"
      - "The tables-per-account quota is 2,500 by default, raisable to about 10,000 — beyond that you must shard across accounts"
      - "Each DynamoDB table must live in its own dedicated VPC, so the per-Region VPC ceiling caps the number of tenant tables long before tables do"
    answer: 2
    explanation: |
      Tables per account default to 2,500, raisable to ~10,000; beyond that table-per-tenant needs
      multi-account. Item size is a different limit, and the other options are false.
    ref: "concepts.md#data-layer-isolation-on-aws"
  - id: aws-saas-isolation-patterns-042
    difficulty: intermediate
    tags: [s3, prefix, isolation]
    question: |
      Which two approaches isolate tenant data in Amazon S3, from silo to pool?
    options:
      - "A DynamoDB table per tenant for the silo versus Postgres Row-Level Security policies for the pooled tier, applied to objects stored in S3"
      - "Bucket-per-tenant (silo) versus prefix-per-tenant with IAM s3:prefix conditions (pool)"
      - "Exactly one S3 object per tenant for the silo versus a single shared bucket per Region that every tenant writes into for the pool"
      - "A Glacier-tier bucket per tenant for the silo versus a Standard-tier bucket per tenant for the pool, separating them purely by storage class"
    answer: 1
    explanation: |
      Bucket-per-tenant is the silo; prefix-per-tenant with s3:prefix conditions (or S3 Access Grants)
      is the pool. The database and storage-class options are not isolation models.
    ref: "concepts.md#data-layer-isolation-on-aws"
  - id: aws-saas-isolation-patterns-043
    difficulty: beginner
    tags: [runtime-iam, pool, enforcement]
    question: |
      In a pooled-compute model, why are security groups and VPC boundaries insufficient for tenant
      isolation?
    options:
      - "Pooled compute runs with a broad role that can touch all tenants' data, so isolation must be narrowed at runtime per request (e.g., via IAM session policies)"
      - "Security groups only enforce their rules inside a full-stack silo and silently stop filtering traffic the moment two tenants share the same subnet"
      - "They are prohibitively expensive to run at multi-tenant scale, so teams disable them and fall back to application-layer checks instead"
      - "VPC network boundaries were deprecated by AWS in favor of PrivateLink, so relying on them for isolation is no longer a supported pattern"
    answer: 0
    explanation: |
      A pool's broad role can reach all tenants; network controls do not scope data access per request,
      so you must narrow at runtime with IAM. Cost, silo-only SGs, and deprecation are wrong.
    ref: "concepts.md#runtime-iam-isolation-token-vending-and-tenant-context"
  - id: aws-saas-isolation-patterns-044
    difficulty: intermediate
    tags: [runtime-iam, tvm, sts]
    question: |
      In the Token Vending Machine pattern, how are tenant-scoped credentials produced?
    options:
      - "By creating a permanent IAM user for every tenant and handing its long-lived access keys to the pooled service at request time"
      - "By storing each tenant's static secret keys in the function's environment variables and selecting the right one per request"
      - "By tagging the EC2 instance with the tenant id so the instance profile automatically narrows to that tenant's resources"
      - "Extract tenant from the JWT, hydrate a policy template, and pass it as an STS AssumeRole inline session policy to get temporary credentials scoped to the intersection of role and session policy"
    answer: 3
    explanation: |
      TVM hydrates a template with the JWT tenant claim and uses an STS session policy for temporary,
      intersection-scoped credentials. Permanent users, env vars, and instance tags do not dynamically
      scope per request.
    ref: "concepts.md#runtime-iam-isolation-token-vending-and-tenant-context"
  - id: aws-saas-isolation-patterns-045
    difficulty: expert
    tags: [runtime-iam, sts, limits]
    question: |
      A dynamic per-tenant STS inline session policy keeps failing once a service handles many resource
      types. Which hard limit is being hit, and what is the fix?
    options:
      - "The 400 KB DynamoDB item limit that the policy exceeds; persist the generated policy document in a DynamoDB item instead of passing it inline"
      - "The 2,048-character inline session-policy limit; split into per-microservice roles so each session policy stays small"
      - "The 10 SCPs-per-entity Organizations limit that the session trips; detach the tenant OU's SCPs so the policy can attach cleanly"
      - "The 5 VPCs-per-Region limit that the scoped credentials collide with; request a quota increase and add more VPCs to relieve it"
    answer: 1
    explanation: |
      Inline STS session policies are capped at 2,048 characters; when a role serves too many contexts,
      split into per-microservice roles. The item limit, SCP limit, and VPC limit are unrelated.
    ref: "concepts.md#runtime-iam-isolation-token-vending-and-tenant-context"
  - id: aws-saas-isolation-patterns-046
    difficulty: advanced
    tags: [runtime-iam, dynamic-policy]
    question: |
      Why does the SaaS Factory recommend dynamically generated tenant policies over per-tenant static
      IAM policies at scale?
    options:
      - "Static per-tenant policies are strictly more secure in every case because they are reviewed once and never regenerated at runtime"
      - "Dynamic policies are produced entirely inside the application and never involve STS, avoiding any dependency on the token service"
      - "Static per-tenant policies hit IAM limits and become unmanageable at scale, whereas dynamic templates are transient and versioned in your own pipeline"
      - "Static IAM policies cannot express condition keys at all, so per-tenant scoping is only ever possible through dynamically generated documents"
    answer: 2
    explanation: |
      Per-tenant static policies hit IAM entity/size limits and are unmanageable at scale; dynamic
      templates avoid that. Static policies are not universally more secure, dynamic policies do use STS,
      and static policies can use conditions.
    ref: "concepts.md#runtime-iam-isolation-token-vending-and-tenant-context"
  - id: aws-saas-isolation-patterns-047
    difficulty: intermediate
    tags: [runtime-iam, conditions]
    question: |
      Which pair of IAM condition expressions correctly scopes a pooled service to one tenant's
      DynamoDB items and S3 objects?
    options:
      - "aws:SourceIp locked to the tenant's IP range and s3:bucket set to the tenant name, matching items and objects by request origin"
      - "sts:RoleSessionName carrying the tenant id and ec2:InstanceId pinned to the tenant, scoping data access by session and host"
      - "dynamodb:LeadingKeys = [tenant] and s3:prefix = [tenant/*]"
      - "kms:ViaService bound to the tenant and rds:DatabaseName set to the tenant, filtering the table and objects through the encryption service"
    answer: 2
    explanation: |
      LeadingKeys scopes DynamoDB items by partition key and s3:prefix scopes S3 objects by tenant
      prefix. The other pairs use conditions that do not achieve per-tenant data scoping.
    ref: "concepts.md#runtime-iam-isolation-token-vending-and-tenant-context"
  - id: aws-saas-isolation-patterns-048
    difficulty: beginner
    tags: [identity, cognito, jwt]
    question: |
      What is "pooled identity" in an AWS SaaS design?
    options:
      - "A dedicated Cognito user pool provisioned per tenant, with the tenant identity implied by which pool the user authenticates against"
      - "One shared Cognito user pool where each user carries a tenant attribute, and the tenant claim is baked into the JWT"
      - "Storing each tenant's end-user passwords as hashed items in a shared DynamoDB table and authenticating against it directly"
      - "Creating a distinct IAM user for every end user of every tenant and authenticating application logins with those credentials"
    answer: 1
    explanation: |
      Pooled identity is one shared user pool with a tenant attribute and the tenant claim in the JWT.
      User-pool-per-tenant is silo identity; the others are not identity strategies.
    ref: "concepts.md#saas-identity-tenant-routing-and-onboarding-automation"
  - id: aws-saas-isolation-patterns-049
    difficulty: intermediate
    tags: [routing, jwt, context]
    question: |
      In a pooled model, how does tenant context typically reach downstream microservices?
    options:
      - "The JWT is inspected at API Gateway/ALB/reverse proxy, a tenant header is injected, and the tenant context propagates on every downstream call"
      - "Each downstream service makes a synchronous call to the billing system to look up which tenant the current request belongs to"
      - "It is inferred from the request's source IP address, mapping each tenant to a fixed range of client addresses"
      - "Tenant context is no longer needed once the request has been authenticated, since authorization already covered isolation"
    answer: 0
    explanation: |
      Tenant context comes from the JWT, is injected as a header, and must propagate on every hop.
      Source IP is unreliable, querying billing is not the pattern, and context is essential for
      isolation/metering.
    ref: "concepts.md#saas-identity-tenant-routing-and-onboarding-automation"
  - id: aws-saas-isolation-patterns-050
    difficulty: advanced
    tags: [routing, silo, route53]
    question: |
      Which routing approach is characteristic of a full-stack SILO (e.g., account- or VPC-per-tenant)?
    options:
      - "A single wildcard endpoint that inspects the JWT tenant claim and dispatches every tenant into one shared multi-tenant backend fleet"
      - "Round-robin DNS spreading all tenants across a single shared pooled fleet, with tenant context resolved only after the request lands"
      - "One ALB target group shared by every tenant, relying on request headers rather than dedicated infrastructure to separate them"
      - "Route 53 subdomain-per-tenant mapping each tenant to its dedicated stack/VPC/ALB"
    answer: 3
    explanation: |
      Silo routing uses subdomain-per-tenant to reach each tenant's dedicated stack. Wildcard JWT
      inspection and shared fleet/target-group are pooled-routing approaches.
    ref: "concepts.md#saas-identity-tenant-routing-and-onboarding-automation"
  - id: aws-saas-isolation-patterns-051
    difficulty: intermediate
    tags: [onboarding, isolation-coarseness]
    question: |
      How does onboarding cost relate to isolation coarseness?
    options:
      - "They are entirely unrelated, since onboarding time depends only on the sign-up UI and never on the isolation model chosen underneath"
      - "Coarser isolation means heavier, slower onboarding (namespace = seconds, VPC = minutes, account = minutes-to-hours plus quota configuration)"
      - "Finer, more pooled isolation is always the slowest to onboard because sharing infrastructure requires reconfiguring it for every new tenant"
      - "Onboarding is effectively instant regardless of model, because AWS pre-provisions accounts, VPCs, and namespaces ahead of demand"
    answer: 1
    explanation: |
      Onboarding cost scales with isolation coarseness: namespaces are fast, VPCs slower, accounts
      slowest. The other statements are unrelated, reversed, or false.
    ref: "concepts.md#saas-identity-tenant-routing-and-onboarding-automation"
  - id: aws-saas-isolation-patterns-052
    difficulty: expert
    tags: [identity, cognito, silo-limits]
    question: |
      A design proposes a dedicated Cognito user pool per tenant for 5,000 tenants. What is the main
      concern?
    options:
      - "Cognito does not issue JWTs, so a per-tenant pool cannot pass a signed tenant claim to downstream services at all"
      - "Cognito pools cannot hold a custom tenant attribute, so identifying the tenant from a token becomes impossible at 5,000 pools"
      - "User-pool-per-tenant (silo identity) is bounded by Cognito user-pool and app-client quotas and management overhead, so it does not scale to thousands cleanly"
      - "Pooled identity is impossible with Cognito, so a per-tenant pool is the only supported way to run multi-tenant authentication"
    answer: 2
    explanation: |
      Silo identity with a pool per tenant runs into Cognito quotas and management overhead at scale;
      pooled identity (one pool, tenant attribute) scales better. Cognito supports JWTs, tenant
      attributes, and pooled identity.
    ref: "concepts.md#saas-identity-tenant-routing-and-onboarding-automation"
  - id: aws-saas-isolation-patterns-053
    difficulty: intermediate
    tags: [throttling, api-gateway, tiering]
    question: |
      Which AWS mechanism provides per-tenant/per-tier rate, burst, and request-quota limits at the API
      edge?
    options:
      - "EKS ResourceQuota objects per namespace, which cap each tenant's API request rate and burst at the cluster edge"
      - "API Gateway usage plans + API keys"
      - "DynamoDB adaptive capacity, which reshapes per-tenant request and burst limits before traffic reaches the API"
      - "S3 Access Grants scoped per tenant prefix, throttling each tenant's request rate and quota at the storage edge"
    answer: 1
    explanation: |
      API Gateway usage plans + API keys give per-client rate/burst/quota. ResourceQuota is for EKS,
      adaptive capacity is DynamoDB, and Access Grants is S3.
    ref: "concepts.md#tier-based-throttling-metering-and-per-tenant-cost-attribution"
  - id: aws-saas-isolation-patterns-054
    difficulty: advanced
    tags: [throttling, lambda, tiering]
    question: |
      To protect premium tenants from a basic tier that could exhaust concurrency in a pooled Lambda
      backend, which control fits best?
    options:
      - "Give every tier unlimited concurrency so no request is ever queued, trusting the basic tier not to consume the shared pool"
      - "Move all tenants behind a single shared API key so usage-plan limits apply uniformly across every tier at once"
      - "Set Lambda reserved concurrency per tier (e.g., Basic capped, Premium unreserved) to cap lower tiers and protect premium"
      - "Disable throttling entirely to reduce 429 errors, letting the basic tier scale freely instead of returning failures"
    answer: 2
    explanation: |
      Reserved concurrency per tier caps lower tiers and shields premium. Unlimited concurrency and
      disabling throttling remove protection; one shared API key prevents per-tier control.
    ref: "concepts.md#tier-based-throttling-metering-and-per-tenant-cost-attribution"
  - id: aws-saas-isolation-patterns-055
    difficulty: advanced
    tags: [cost-attribution, cur, pool]
    question: |
      How do you attribute cost per tenant in a POOLED model where infrastructure is shared?
    options:
      - "Instrument the app to emit tenant-tagged consumption metrics (e.g., CloudWatch EMF), aggregate each tenant's percentage of consumption, and correlate with the Cost and Usage Report (CUR)"
      - "Divide the total monthly bill equally across all active tenants, assuming every tenant consumes an identical share of the shared infrastructure"
      - "Read the per-tenant line item AWS prints on the consolidated invoice, since AWS itemizes shared-resource usage by tenant automatically"
      - "Rely on native per-account billing, treating each tenant's slice of the shared account as if AWS had already split it into distinct sub-accounts"
    answer: 0
    explanation: |
      Pooled cost attribution requires app-level consumption instrumentation correlated with the CUR.
      There is no per-tenant invoice line, equal splitting misrepresents usage, and per-account billing
      applies only to silo.
    ref: "concepts.md#tier-based-throttling-metering-and-per-tenant-cost-attribution"
  - id: aws-saas-isolation-patterns-056
    difficulty: expert
    tags: [cost-attribution, tiering, finding]
    question: |
      After instrumenting per-tenant cost, a SaaS finds its Basic tier (lowest revenue) consumes the
      largest share of infrastructure cost. What does this most likely signal?
    options:
      - "The consumption instrumentation is miscounting shared overhead and should be discarded as unreliable noise"
      - "Broken tiering/throttling/pricing — cost is not tracking revenue, so tier limits or pricing need adjustment"
      - "The Premium tier is clearly unprofitable and should be discontinued to cut the infrastructure it consumes"
      - "All tenants should be migrated to fully siloed accounts so each one's true cost becomes directly visible"
    answer: 1
    explanation: |
      Cost concentrated in the lowest-revenue tier signals broken tiering/throttling/pricing that must
      be corrected so cost tracks revenue. It is a real signal, not noise; discontinuing Premium or
      wholesale siloing do not address the mismatch.
    ref: "concepts.md#tier-based-throttling-metering-and-per-tenant-cost-attribution"
  - id: aws-saas-isolation-patterns-057
    difficulty: intermediate
    tags: [cost-attribution, silo, tags]
    question: |
      Which cost-attribution method fits the SILO model without application instrumentation?
    options:
      - "CloudWatch EMF consumption metrics emitted per request and correlated against the Cost and Usage Report"
      - "DynamoDB LeadingKeys conditions attributing each tenant's item-level spend back to the billing pipeline"
      - "Dividing the total account bill by each tenant's share of the request count for the period"
      - "Native per-account billing (or cost allocation tags on per-tenant resources like VPCs)"
    answer: 3
    explanation: |
      Silo cost attribution uses native per-account billing or cost allocation tags. EMF+CUR is the
      pooled approach, LeadingKeys is isolation not costing, and request-count division is inaccurate.
    ref: "concepts.md#tier-based-throttling-metering-and-per-tenant-cost-attribution"
  - id: aws-saas-isolation-patterns-058
    difficulty: beginner
    tags: [noisy-neighbor, pool]
    question: |
      Noisy-neighbor problems are most acute in which model?
    options:
      - "Account-per-tenant silo, where each tenant's dedicated account still contends for a shared Region capacity pool"
      - "Pooled models where tenants share compute/data capacity"
      - "VPC-per-tenant, because tenant VPCs peered through one Transit Gateway fight over its shared bandwidth"
      - "The governance model, where SCPs applied org-wide throttle every tenant's throughput at once"
    answer: 1
    explanation: |
      Sharing capacity is what creates noisy-neighbor contention, so pooled models are most exposed.
      Silo/VPC-per-tenant give each tenant dedicated capacity, and governance is an org-management layer.
    ref: "concepts.md#noisy-neighbor-mitigation-on-aws"
  - id: aws-saas-isolation-patterns-059
    difficulty: advanced
    tags: [noisy-neighbor, bridge, mitigation]
    question: |
      A single high-volume tenant repeatedly degrades a pooled service despite quotas. What is the
      durable bridge-model response?
    options:
      - "Delete the offending tenant's account and offload their workload onto a neighboring pooled cluster"
      - "Pool the remaining capacity more aggressively so the shared fleet can absorb the tenant's spikes"
      - "Bridge-promote that tenant to a siloed tier (its own VPC or account) while keeping others pooled"
      - "Disable throttling for that tenant so its retries stop amplifying load against the shared service"
    answer: 2
    explanation: |
      The bridge answer is to promote the noisy/high-value tenant to a silo tier while keeping the rest
      pooled. Deleting, pooling harder, and removing throttling all worsen the situation.
    ref: "concepts.md#noisy-neighbor-mitigation-on-aws"
  - id: aws-saas-isolation-patterns-060
    difficulty: intermediate
    tags: [noisy-neighbor, dynamodb]
    question: |
      Which AWS mechanisms specifically mitigate noisy neighbors at the DynamoDB data layer in a pool?
    options:
      - "Adaptive capacity plus write-sharding to spread hot partitions"
      - "Route 53 failover records that reroute a hot tenant's reads to a standby replica table in another Region"
      - "Service Control Policies on the tenant OU that cap how much table throughput each tenant may consume"
      - "Lambda layers packaging a shared client that rate-limits each tenant's calls before they reach the table"
    answer: 0
    explanation: |
      Adaptive capacity and write-sharding spread hot-partition load. Route 53 failover, SCPs, and
      Lambda layers do not address DynamoDB partition contention.
    ref: "concepts.md#noisy-neighbor-mitigation-on-aws"
  - id: aws-saas-isolation-patterns-061
    difficulty: intermediate
    tags: [decision-guide, default]
    question: |
      What is the recommended default posture for a new SaaS on AWS per the decision guide?
    options:
      - "Start pooled (compute + data) for economies of scale, and silo by exception where compliance, contract, or noisy-neighbor risk demands it"
      - "Always vend one dedicated AWS account per tenant so every new customer starts fully isolated by default"
      - "Silo every layer first for maximum safety, then selectively pool services once the tenant base grows large"
      - "Choose subnet-level isolation inside one shared VPC as the baseline for all tenants regardless of scale"
    answer: 0
    explanation: |
      The guide is "start pool, silo by exception." Silo-first, account-per-tenant always, and
      subnet-baseline all contradict the default and its economics.
    ref: "concepts.md#decision-guide"
  - id: aws-saas-isolation-patterns-062
    difficulty: advanced
    tags: [decision-guide, per-service]
    question: |
      A design pools compute and data for the catalog service but silos the data layer (RDS-per-tenant)
      for the billing service. What principle does this illustrate?
    options:
      - "It is an inconsistent design and both services should be unified onto a single isolation model"
      - "Match isolation granularity per microservice and per layer — a bridge design"
      - "All services must silo their data layer once any one service adopts a per-tenant database"
      - "Compute must always be siloed whenever the data layer beneath it is pooled across tenants"
    answer: 1
    explanation: |
      Choosing isolation per service/per layer is exactly the bridge principle, not an inconsistency to
      unify. Neither blanket data silo nor a compute-silo rule applies.
    ref: "concepts.md#decision-guide"
  - id: aws-saas-isolation-patterns-063
    difficulty: advanced
    tags: [decision-guide, tenant-count, scenario]
    question: |
      A B2B SaaS expects to grow from 50 to 3,000 tenants, mostly small, price-sensitive, non-regulated,
      with a few enterprise tenants demanding stronger isolation. Which strategy is most appropriate?
    options:
      - "Account-per-tenant for all 3,000, vending a dedicated governed AWS account to every small tenant"
      - "VPC-per-tenant for all 3,000 packed into one Region behind a shared Transit Gateway hub"
      - "Pooled compute + pooled data with runtime IAM scoping for the majority, bridge-promoting the few enterprise tenants to siloed tiers (own VPC/account)"
      - "Subnet-per-tenant carved out of one shared VPC, giving each of the 3,000 tenants its own subnet"
    answer: 2
    explanation: |
      Thousands of small non-regulated tenants require pooling; the few enterprise tenants get bridge-
      promoted to silo. Account-per-tenant at 3,000 blows past ops/limits, VPC-per-tenant hits the
      per-Region cap, and subnet-per-tenant does not scale.
    ref: "concepts.md#decision-guide"
  - id: aws-saas-isolation-patterns-064
    difficulty: expert
    tags: [decision-guide, ceilings]
    question: |
      Which trio of "real ceilings" should drive the coarse-grained isolation choice as tenant count
      scales?
    options:
      - "Control Tower ~10,000 accounts, VPCs 5-to-hundreds per Region, DynamoDB ~10,000 tables per account"
      - "Organizations capped at 100 accounts, VPCs limited to 2 per Region, DynamoDB 50 tables per account"
      - "IAM allowing only 5 roles per account, S3 1 bucket per account, Lambda 1 function per Region"
      - "Cognito 10 user pools per account, API Gateway 1 stage per API, RDS 1 instance per Region"
    answer: 0
    explanation: |
      The practical ceilings are Control Tower ~10k accounts, VPCs 5-to-hundreds per Region, and
      DynamoDB ~10k tables/account. The other options invent incorrect, far-too-low limits.
    ref: "concepts.md#decision-guide"
  - id: aws-saas-isolation-patterns-065
    difficulty: intermediate
    tags: [comparison, matrix]
    question: |
      Which pattern offers the FASTEST onboarding but the WIDEST blast radius (all tenants) and hardest
      cost attribution?
    options:
      - "Account-per-tenant, where vending a fresh governed account is the quickest path to onboarding a tenant"
      - "VPC-per-tenant, since a new tenant VPC provisions in seconds and shares no surface with other tenants"
      - "Data-layer pool (shared schema, tenant_id / LeadingKeys / RLS)"
      - "The governance model, which onboards fastest because SCP guardrails attach instantly to a new tenant OU"
    answer: 2
    explanation: |
      The pooled data layer onboards fastest, shares the widest attack surface (all tenants), and needs
      instrumentation for cost attribution. Account- and VPC-per-tenant are the opposite; governance is
      coarse.
    ref: "concepts.md#trade-offs-and-when-to-use-what"
  - id: aws-saas-isolation-patterns-066
    difficulty: advanced
    tags: [comparison, matrix, enforcement]
    question: |
      In the master comparison, what is the role of runtime IAM scoping relative to the six patterns?
    options:
      - "It is a seventh, standalone isolation boundary that is strictly stronger than a separate AWS account"
      - "It is the enforcement layer that makes pooled patterns (container and data) actually safe"
      - "It replaces the need for VPCs entirely, since runtime credentials subsume all network-layer isolation"
      - "It only matters for the governance model, scoping the management account's org-wide administrative access"
    answer: 1
    explanation: |
      Runtime IAM scoping is the enforcement layer that makes pooled compute and data safe, not a
      standalone boundary stronger than an account. It complements, not replaces, VPCs and is central to
      pool, not governance.
    ref: "concepts.md#trade-offs-and-when-to-use-what"
  - id: aws-saas-isolation-patterns-067
    difficulty: beginner
    tags: [comparison, cost]
    question: |
      Which pattern has the LOWEST cost efficiency (highest cost) among the six?
    options:
      - "Data-layer pool, where a shared schema still carries the highest per-tenant storage overhead"
      - "Account-per-tenant"
      - "Container namespace, since each per-tenant namespace reserves its own dedicated node capacity"
      - "Subnet-per-tenant, whose per-subnet NAT and gateway charges dominate the total cost at scale"
    answer: 1
    explanation: |
      Account-per-tenant has the highest cost (idle capacity, no bin-packing). Pooled data and container
      namespaces are the most cost-efficient; subnet-per-tenant is cheaper than full account silo.
    ref: "concepts.md#trade-offs-and-when-to-use-what"
  - id: aws-saas-isolation-patterns-068
    difficulty: expert
    tags: [scenario, cross-tenant-leak, judgment]
    question: |
      A pooled service uses SGs and NetworkPolicies to separate tenants but runs every request with one
      broad IAM role over a shared DynamoDB table. Which cross-tenant failure does this design NOT
      prevent?
    options:
      - "Network eavesdropping between pods, which the NetworkPolicies already block at the pod-to-pod layer"
      - "A code path reading another tenant's items, because the broad role is never narrowed per request (no LeadingKeys / session policy)"
      - "A distributed denial-of-service flood arriving from the public internet against the shared endpoint"
      - "A NACL misconfiguration in another subnet that the security-group rules would otherwise contain"
    answer: 1
    explanation: |
      Network controls do not stop application-layer cross-tenant data access; without runtime scoping
      (LeadingKeys / session policy) a bug can read another tenant's items. Eavesdropping, DDoS, and
      NACL issues are not the gap this design leaves at the data layer.
    ref: "concepts.md#runtime-iam-isolation-token-vending-and-tenant-context"
  - id: aws-saas-isolation-patterns-069
    difficulty: expert
    tags: [scenario, cost-estimation, judgment]
    question: |
      A SaaS runs 400 tenants, each idle 90% of the time, and currently silos every tenant with a
      dedicated EKS cluster. Cost is dominated by underutilized nodes and per-cluster control-plane
      fees. Which change most directly improves cost efficiency while preserving reasonable isolation?
    options:
      - "Add more clusters to spread the load, splitting the idle tenants across additional EKS control planes"
      - "Move every tenant to its own dedicated AWS account under a governance Organization for cleaner cost lines"
      - "Consolidate onto shared pooled clusters with namespaces, ResourceQuota/LimitRange, and sole-tenant nodes only for the few tenants that require them"
      - "Give each tenant a dedicated VPC in one Region, replacing the per-cluster fees with per-VPC networking"
    answer: 2
    explanation: |
      Cluster-per-tenant with 90% idle wastes control-plane fees and node capacity; pooling onto shared
      clusters with quotas and selective sole-tenant nodes recovers efficiency while keeping isolation
      where needed. More clusters and account-per-tenant worsen cost; VPC-per-tenant also hits the
      per-Region cap at 400 and does not fix compute utilization.
    ref: "concepts.md#container-layer-isolation-with-ecs-and-eks"
  - id: aws-saas-isolation-patterns-070
    difficulty: advanced
    tags: [scenario, compliance, bridge]
    question: |
      A pooled SaaS signs one enterprise customer whose contract mandates a dedicated database instance
      and network isolation, while all other tenants remain pooled. What is the cleanest AWS approach?
    options:
      - "Re-architect the entire platform to account-per-tenant so the one enterprise contract is satisfied everywhere"
      - "Refuse the isolation requirement outright because the platform is fundamentally pooled and cannot accommodate it"
      - "Give that tenant a tenant_id row in the shared table guarded by a stricter Row-Level Security policy"
      - "Bridge: keep the pooled tiers as-is and provision a siloed tier for that tenant (dedicated RDS instance, own VPC), routed by subdomain, under the same control plane and product version"
    answer: 3
    explanation: |
      The bridge model provisions a siloed tier for the one tenant while others stay pooled, under one
      control plane/version. Re-architecting everything is wasteful, refusing loses the deal, and a
      shared-table row does not meet a dedicated-instance/network-isolation contract.
    ref: "concepts.md#trade-offs-and-when-to-use-what"
  - id: aws-saas-isolation-patterns-071
    difficulty: intermediate
    type: multi
    tags: [governance, organizations, scp, billing]
    question: |
      Which statements about the AWS Organizations governance substrate beneath
      account-per-tenant are correct? Select all that apply.
    options:
      - "Consolidated billing pools Savings Plans, Reserved Instance, and volume-tier discounts across all member accounts in the org"
      - "You can attach at most 10 SCPs to a single entity (an account or an OU)"
      - "RCPs (Resource Control Policies) can be attached to at most 10 entities per policy, matching the SCP cap"
      - "An organization can have multiple roots so you can separate tenant tiers under different root accounts"
    answers: [0, 1]
    explanation: |
      Consolidated billing still pools Savings Plans / RIs / volume-tier discounts across the org even
      though resource-level volume discounts are lost — a nuance many candidates miss. SCPs are capped at
      10 attached per entity (with a 10,240-char document). The RCP claim is wrong: RCPs are capped at
      5 per entity, not 10. And an organization has exactly one root — never more than one.
    ref: "concepts.md#governance-model-with-aws-organizations-ous-scps-and-consolidated-billing"
  - id: aws-saas-isolation-patterns-072
    difficulty: intermediate
    type: multi
    tags: [control-plane, application-plane, saas]
    question: |
      Which statements correctly describe the control plane versus the application
      plane in an AWS SaaS architecture? Select all that apply.
    options:
      - "The control plane onboards, manages, meters, and bills tenants and is itself shared/single-tenant"
      - "Tenant isolation is enforced in the application plane, where tenant context is applied to every request"
      - "The control plane must be re-deployed differently for each application-plane isolation model you choose"
      - "An account-per-tenant deployment stops being SaaS and becomes an MSP model even when wrapped by a shared control plane running one product version"
    answers: [0, 1]
    explanation: |
      The control plane (onboarding, tenant management, identity, metering, billing) is shared/single-tenant,
      and the application plane is where isolation and per-request tenant context live. The third option is
      false: the control plane is identical regardless of the application-plane isolation model. The fourth is
      false: account-per-tenant is still SaaS precisely when a shared control plane runs one product version
      with unified onboarding/metering/ops — dropping that shared plane is what makes it MSP.
    ref: "concepts.md#control-plane-versus-application-plane"
  - id: aws-saas-isolation-patterns-073
    difficulty: advanced
    type: multi
    tags: [eks, containers, soft-multi-tenancy, fargate]
    question: |
      In a pooled EKS cluster shared across tenants, which statements are accurate
      per the EKS best-practices guidance? Select all that apply.
    options:
      - "The cluster — not the namespace — is the only strong security boundary; namespaces + RBAC provide only soft multi-tenancy"
      - "By default pods from different tenants can share a node, so a host compromise can expose Secrets, ConfigMaps, and volumes across tenants"
      - "EKS Fargate runs each pod in its own Firecracker microVM, so pods do not share a kernel"
      - "NetworkPolicies work with no CNI engine on any cluster and by themselves fully isolate tenants"
    answers: [0, 1, 2]
    explanation: |
      Kubernetes is a single-tenant orchestrator: the cluster is the only strong boundary and namespaces give
      only soft multi-tenancy. Pods from different tenants share a node by default, so a host compromise reaches
      that node's Secrets/volumes and enables lateral movement. Fargate places each pod in its own Firecracker
      microVM (VM-strength kernel isolation). The last option is false: NetworkPolicies require an engine
      (Calico/Cilium, or the VPC CNI's support) and, even then, network controls alone are not tenant isolation.
    ref: "concepts.md#container-layer-isolation-with-ecs-and-eks"
  - id: aws-saas-isolation-patterns-074
    difficulty: advanced
    type: multi
    tags: [runtime-iam, tvm, sts, session-policy]
    question: |
      Which statements about token-vending and runtime IAM scoping for pooled
      services are correct? Select all that apply.
    options:
      - "STS returns credentials scoped to the intersection of the pod's (broad) role and the inline session policy"
      - "An inline STS session policy is capped at 2,048 characters (whitespace excluded)"
      - "The tenantId must come from a server-side-validated signed JWT, never a client-supplied X-Tenant-Id header trusted at the app tier"
      - "Caching one shared set of tenant-scoped credentials keyed only by role safely avoids STS throttling"
    answers: [0, 1, 2]
    explanation: |
      The vended credentials are the intersection of the role and the hydrated session policy — that intersection
      is what makes the pool safe. The inline session policy is hard-capped at 2,048 chars (whitespace excluded),
      which forces per-microservice roles. The tenant claim must be a signed, server-side-validated JWT; trusting a
      client X-Tenant-Id header lets a caller vend cross-tenant credentials. The last option is false: you must cache
      keyed by (tenantId, role) — a role-only cache would hand tenant A's request tenant B's credentials.
    ref: "concepts.md#runtime-iam-isolation-token-vending-and-tenant-context"
  - id: aws-saas-isolation-patterns-075
    difficulty: advanced
    type: multi
    tags: [data-layer, dynamodb, rls, hot-partition]
    question: |
      Which statements about data-layer isolation on AWS are correct? Select all
      that apply.
    options:
      - "Using tenant_id as the raw DynamoDB partition key creates hot partitions for large tenants because all their items hash to one physical partition capped near 3,000 RCU"
      - "The IAM dynamodb:LeadingKeys condition enforces pooled item isolation on the partition key"
      - "Postgres Row-Level Security is application-enforced and can be bypassed by a DB superuser or a misconfiguration"
      - "DynamoDB table-per-tenant scales to unlimited tenants because there is no per-account table limit"
    answers: [0, 1, 2]
    explanation: |
      All of A's items share one partition-key value, hash to one physical partition (~3,000 RCU cap), and throttle
      even when the table has spare capacity — fix with write-sharding / a tenant-lookup table. dynamodb:LeadingKeys
      is exactly the condition that enforces pooled item isolation. Postgres RLS is app-enforced and bypassable by a
      superuser or misconfiguration. The last option is false: DynamoDB allows 2,500 tables/account (raisable to
      10,000, then multi-account), so table-per-tenant silo does not scale past ~10k tenants.
    ref: "concepts.md#data-layer-isolation-on-aws"
  - id: aws-saas-isolation-patterns-076
    difficulty: expert
    type: multi
    tags: [vpc-per-tenant, quotas, peering, cost]
    question: |
      A single-account SaaS uses one VPC per tenant. Which statements about this
      model are correct? Select all that apply.
    options:
      - "The VPC-per-Region quota (default 5, raisable to hundreds but not thousands) is the deciding ceiling before you must move to multi-account or pool"
      - "VPC peering is non-transitive, so a Transit Gateway hub is preferred over an N×N tenant-to-shared-services peering mesh"
      - "Because reservations live in one account, VPC-per-tenant gets better Reserved-Instance/Savings-Plan utilization than account-per-tenant silo"
      - "Overlapping tenant CIDRs are acceptable because VPC peering resolves address conflicts automatically"
    answers: [0, 1, 2]
    explanation: |
      The VPC-per-Region ceiling (default 5, raisable to hundreds, not thousands) is the deciding constraint; beyond
      it you move to multi-account or pool. VPC peering is non-transitive, so a Transit Gateway hub (or PrivateLink)
      beats an N×N mesh. Keeping reservations in one account lets RIs/Savings Plans float across tenant VPCs, giving
      better utilization than account-silo. The last option is false: overlapping CIDRs make peering impossible —
      you must allocate non-overlapping CIDR space up front.
    ref: "concepts.md#vpc-per-tenant-isolation-in-a-single-account"
