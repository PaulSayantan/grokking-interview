topic: 'Microservices Depth: DDD, Service Boundaries and Anti-Patterns'
domain: system-design
topic_slug: microservices-ddd-and-boundaries
version: 1
questions:
- id: microservices-ddd-and-boundaries-001
  difficulty: intermediate
  tags:
  - bounded-context
  - ubiquitous-language
  - ddd
  question: |
    In DDD, why does building a single canonical enterprise-wide model of
    "Customer" shared by Sales, Billing, and Support tend to fail?
  options:
  - Each context has different, sometimes contradictory, invariants and meanings for 'Customer', so one
    model becomes a bloated god-object satisfying none of them well
  - Object-oriented languages cannot represent a Customer entity with more than 20 fields without exceeding
    the compiler's per-class heap-allocation limit, so the shared model fails to build
  - Relational databases forbid the same logical entity from appearing in more than one schema, so a shared
    Customer table cannot be joined by the Sales, Billing, and Support databases at once
  - A shared canonical model always delivers better runtime performance through caching but consistently
    drops unit-test coverage below 40%, which is why teams abandon it
  answer: 0
  explanation: |
    A bounded context gives one precise meaning per term. "Customer" in Sales,
    Billing, and Support carries different attributes and invariants; forcing
    one model creates a field-bloated god-object with lots of context-irrelevant
    nulls. The other options invent technical limits that don't exist — the
    problem is semantic/domain, not language or DB capability.
  ref: concepts.md#bounded-contexts-and-ubiquitous-language
- id: microservices-ddd-and-boundaries-002
  difficulty: advanced
  tags:
  - bounded-context
  - microservice
  - granularity
  question: |
    Which statement about the relationship between a bounded context and a
    microservice is the most defensible senior position?
  options:
  - A microservice and a bounded context are always exactly 1:1 by definition, since the DDD specification
    mandates one deployable artifact per context with no permitted exceptions
  - A service should be at most one bounded context; one context may occasionally be several services,
    but a service spanning multiple contexts tends toward a distributed monolith
  - A single service should implement several bounded contexts to reduce the number of deployables, because
    running fewer processes always lowers total infrastructure cost and simplifies the domain model
  - Bounded contexts are irrelevant once you adopt microservices; only aggregates matter, since the network
    boundary automatically enforces every model boundary you would ever need
  answer: 1
  explanation: |
    A bounded context is a logical/model boundary; a service is a deployment
    boundary. The safe heuristic: never span multiple contexts in one service
    (it entangles independent change reasons). Splitting one context into
    several services is rare but possible under scaling pressure. 1:1 is a
    common default, not a definition, and contexts remain the primary boundary
    driver.
  ref: concepts.md#bounded-contexts-and-ubiquitous-language
- id: microservices-ddd-and-boundaries-003
  difficulty: intermediate
  tags:
  - ubiquitous-language
  - ddd
  question: |
    What is the purpose of a "ubiquitous language" within a bounded context?
  options:
  - To ensure all services in the bounded context are written in the same programming language so that
    domain types can be shared directly across process boundaries without any translation
  - To standardize on English as the mandatory spoken and written language across all international teams
    so that domain terminology never has to be translated between offices
  - That code, DB columns, APIs, and domain-expert conversation all use the same terms for the same concepts,
    so the model is a shared communication tool
  - To generate API documentation and OpenAPI specs automatically from database schemas so the domain
    vocabulary stays perfectly synchronized with the persisted column names
  answer: 2
  explanation: |
    Ubiquitous language means one vocabulary shared by code and domain experts
    inside a context: a "dispatched" shipment has a `dispatch()` method and a
    `Dispatched` event, not `updateStatus(3)`. It's about shared meaning, not
    programming languages, spoken languages, or doc generation.
  ref: concepts.md#bounded-contexts-and-ubiquitous-language
- id: microservices-ddd-and-boundaries-004
  difficulty: advanced
  tags:
  - bounded-context
  - duplication
  - coupling
  question: |
    Two bounded contexts each model "Product" with overlapping but different
    fields. A junior engineer proposes extracting a shared `Product` class to
    "stay DRY." What's the strongest senior objection?
  options:
  - DRY as a principle applies only to duplicated functions and procedures, never to data classes, so
    extracting a shared Product class falls entirely outside its scope
  - The shared class would accumulate so many combined fields that it would exceed the JVM's method-size
    limit and compile too slowly to be practical for either team to build
  - Duplication is always a defect under every circumstance, so extracting the single shared Product class
    is unambiguously the correct and most disciplined thing to do here
  - Deliberate duplication of data shape across contexts is the price of decoupling; a shared model reintroduces
    coupling and a coordination bottleneck between the two teams
  answer: 3
  explanation: |
    Across bounded contexts, some duplication of data shape is intentional — it
    keeps the contexts independently evolvable. Collapsing to a shared model
    recouples the teams (any change needs both to agree), which is exactly what
    bounded contexts exist to prevent. DRY is a within-context heuristic, not a
    cross-context mandate.
  ref: concepts.md#bounded-contexts-and-ubiquitous-language
- id: microservices-ddd-and-boundaries-005
  difficulty: advanced
  tags:
  - aggregate
  - consistency-boundary
  - transaction
  question: |
    What is the single most important rule relating aggregates to transactions
    in DDD?
  options:
  - The aggregate boundary is the transaction/consistency boundary — a transaction should create or modify
    one aggregate instance; everything else is eventually consistent
  - One transaction may modify as many aggregates as needed as long as they share a database, because a
    single local ACID transaction can safely span every table hosted on the same instance
  - Aggregates should always be as large as possible to guarantee strong consistency everywhere, so folding
    related entities into one giant root eliminates the need for eventual consistency
  - Aggregates only matter for structuring read queries and never for writes, since write-side invariants
    are better enforced by database triggers and check constraints instead
  answer: 0
  explanation: |
    The aggregate is the unit of consistency: its invariants hold at commit, and
    one transaction should touch one aggregate. Spanning multiple aggregates in
    one ACID transaction effectively fuses them (or, across services, forces a
    distributed transaction). Cross-aggregate updates are handled asynchronously
    via domain events with eventual consistency.
  ref: concepts.md#aggregates-aggregate-roots-and-the-consistency-boundary
- id: microservices-ddd-and-boundaries-006
  difficulty: advanced
  tags:
  - aggregate
  - reference-by-identity
  - design
  question: |
    Vaughn Vernon recommends that one aggregate reference another
    "by identity" (holding the other's ID) rather than by object reference.
    What is the primary benefit?
  options:
  - It prevents accidental large object graphs, keeping the transactional footprint and lock scope small
    and supporting database-per-service boundaries
  - It makes JSON serialization dramatically faster because storing only an integer identifier avoids the
    recursive marshalling of the referenced aggregate's entire nested object tree
  - It allows database foreign-key constraints to span two separate service databases, so referential
    integrity between the aggregates is still enforced by the engine at commit time
  - It guarantees strong, immediate consistency between the two aggregates because the identifier lookup
    is resolved synchronously inside the same transaction on every read
  answer: 0
  explanation: |
    Referencing by ID (an `Order` holds `customerId`, not a `Customer` object)
    stops one aggregate dragging another's whole object graph into the same
    transaction, keeping aggregates small and load/lock scope tight — and it
    maps cleanly to separate ownership/services. It does not create cross-DB
    foreign keys (those don't exist across services) or grant strong consistency.
  ref: concepts.md#aggregates-aggregate-roots-and-the-consistency-boundary
- id: microservices-ddd-and-boundaries-007
  difficulty: expert
  tags:
  - aggregate
  - sizing
  - consistency
  - trade-offs
  question: |
    A stakeholder insists that "order total" and "customer loyalty points"
    must be updated in the same transaction and stay immediately consistent,
    which would fuse two aggregates (and likely two services). What's the best
    senior response?
  options:
  - Immediately merge them into one large aggregate to honor the requirement literally, accepting that
    every order write now also locks the entire loyalty-points row for the same customer
  - Probe whether a few seconds of lag actually violates a business invariant or just feels untidy; usually
    loyalty can be eventually consistent via a domain event, keeping aggregates small
  - Use two-phase commit across the two services so both the order total and loyalty points commit atomically,
    blocking each order until every participant acknowledges the prepare phase
  - Add a distributed lock spanning both services that is acquired for every single order write, serializing
    all concurrent orders for a customer so the two updates appear atomic
  answer: 1
  explanation: |
    The senior move is to challenge the immediacy assumption. True invariants
    belong in one aggregate; things that merely "feel" like they should be
    instant usually tolerate eventual consistency and are better handled with a
    domain event. Merging aggregates creates contention and couples services;
    2PC blocks and hurts availability; distributed locks on every write are a
    scalability disaster.
  ref: concepts.md#aggregates-aggregate-roots-and-the-consistency-boundary
- id: microservices-ddd-and-boundaries-008
  difficulty: advanced
  tags:
  - aggregate
  - concurrency
  - optimistic-locking
  question: |
    Why is optimistic concurrency (a version number on the aggregate root) a
    natural fit for aggregates in a distributed system?
  options:
  - It eliminates the need for any retry logic entirely, because the version number is incremented server-side
    and every concurrent write is silently merged without ever raising a conflict
  - It guarantees that no two users can ever edit the same aggregate at once, since reading the current
    version places an exclusive advisory lock on the root until the writer commits
  - The aggregate is the consistency unit, so a version check on its root detects concurrent modification
    and the loser retries — avoiding pessimistic locks held across the network
  - It makes the aggregate strongly consistent with all other aggregates in the system, because the shared
    version counter is coordinated globally across every root on each write
  answer: 2
  explanation: |
    The aggregate is the unit of change, so a version on its root cleanly
    detects concurrent modification: the losing writer's version is stale and it
    retries. This avoids holding pessimistic locks across a distributed system.
    It doesn't remove retries (it depends on them), doesn't prevent concurrent
    edits (it detects conflicts), and says nothing about other aggregates.
  ref: concepts.md#aggregates-aggregate-roots-and-the-consistency-boundary
- id: microservices-ddd-and-boundaries-009
  difficulty: intermediate
  tags:
  - entity
  - value-object
  - ddd
  question: |
    What is the defining difference between an entity and a value object in DDD?
  options:
  - Entities must always be persisted in a relational SQL store while value objects belong in a NoSQL
    document store, because only SQL engines can generate the surrogate keys entities require
  - Entities are strictly immutable once created while value objects are freely mutable in place, which
    is why you replace an entity but edit a value object field by field
  - Value objects are permitted to carry behavior and methods whereas entities must remain pure data holders
    with getters and setters only, keeping all logic outside the entity
  - An entity has an identity that persists across attribute changes; a value object has no identity and
    is defined entirely by its attributes
  answer: 3
  explanation: |
    `Order #4711` stays the same order as its status changes (identity persists)
    — an entity. `Money(10, USD)` is interchangeable with any other `$10 USD`
    (no identity, structural equality) — a value object. Storage tech is
    irrelevant; value objects are the ones that should be immutable (the
    immutable/mutable pairing in the wrong choice is backwards); both can have
    behavior.
  ref: concepts.md#entities-versus-value-objects
- id: microservices-ddd-and-boundaries-010
  difficulty: advanced
  tags:
  - value-object
  - immutability
  - invariants
  question: |
    Why are value objects usually made immutable, and how does that help
    aggregate design?
  options:
  - Immutability makes value objects noticeably slower to construct, and this added latency conveniently
    throttles incoming requests so the aggregate is never overwhelmed under load
  - Immutable value objects are safe to share/cache and eliminate aliasing bugs, and pushing validation/invariants
    into them keeps entities focused on identity and coordination
  - Immutability of value objects is a hard requirement imposed by every relational and document database,
    which refuse to persist any field that could later be mutated in place
  - It lets value objects be referenced across service boundaries by a shared memory pointer, so two services
    can read the same instance without copying or re-serializing it
  answer: 1
  explanation: |
    Immutable value objects (you replace, not mutate) are safe to share and
    reason about and remove aliasing bugs; embedding validation (a `Money`
    enforcing currency on add, an `EmailAddress` validating on construction)
    shrinks the entity's surface. The other options are false — immutability
    isn't a DB requirement, isn't a throttling mechanism, and cross-service
    references aren't pointers.
  ref: concepts.md#entities-versus-value-objects
- id: microservices-ddd-and-boundaries-011
  difficulty: advanced
  tags:
  - value-object
  - entity
  - modeling-error
  question: |
    What is the typical modeling error when a team gives `Address` a surrogate
    database id and tracks it as a first-class row "to be safe"?
  options:
  - It leaks accidental identity onto something that is really a value object, complicating equality and
    merging and fighting the domain model
  - It improves equality semantics by giving each address a stable primary key and is the recommended best
    practice for any object you intend to persist in a relational table
  - It has no meaningful effect on the domain model at all, since assigning a surrogate identifier is purely
    a storage detail that the domain layer never observes or depends on
  - It makes the address strongly consistent across every service by giving it a globally unique identifier
    that all contexts can join against to guarantee a single shared copy
  answer: 0
  explanation: |
    An address is defined by its attributes (a value object). Giving it a
    surrogate identity and independent lifecycle introduces accidental identity:
    now two structurally-equal addresses are 'different', complicating equality
    and dedup/merge logic. Treating everything as an entity "to be safe with the
    DB" is a common mistake that distorts the model.
  ref: concepts.md#entities-versus-value-objects
- id: microservices-ddd-and-boundaries-012
  difficulty: intermediate
  tags:
  - domain-event
  - naming
  - decoupling
  question: |
    Which best characterizes a domain event?
  options:
  - A synchronous command that tells another service exactly what to do next and blocks the caller until
    that service acknowledges it has carried out the requested action
  - A past-tense fact about something meaningful that happened in the domain (e.g. OrderPlaced), used
    to decouple aggregates/contexts via async reaction
  - A database trigger that fires inside the write transaction to enforce referential integrity between
    tables owned by two different services on every insert or update
  - A future intention that has not yet occurred but is scheduled to happen, letting downstream services
    reserve resources in advance of the actual state change
  answer: 1
  explanation: |
    Domain events are named in past tense (`OrderPlaced`, `PaymentCaptured`) and
    represent facts domain experts care about; consumers react asynchronously,
    decoupling aggregates and contexts. A command (imperative, future-directed)
    is the opposite; they are not DB triggers.
  ref: concepts.md#domain-events
- id: microservices-ddd-and-boundaries-013
  difficulty: expert
  tags:
  - domain-event
  - dual-write
  - outbox
  question: |
    A service commits an aggregate change to its DB and then publishes an event
    to Kafka in a separate step. Occasionally the commit succeeds but the
    publish fails after a crash. What is this problem and its correct fix?
  options:
  - It's the dual-write problem; fix it with a distributed two-phase commit spanning the database and the
    broker so both the state change and the publish commit atomically in one prepared transaction
  - It's a network partition between the service and the broker; fix it by disabling all publish retries
    so a partial failure can never be re-attempted after the crashed process recovers
  - It's the dual-write problem; fix it with a transactional outbox — write the event into an outbox table
    in the same DB transaction and relay it (poll or CDC) to the broker
  - It's a serialization bug in the event payload; fix it by switching the message encoding from Avro to
    plain JSON so the broker can always parse and accept the record
  answer: 2
  explanation: |
    Writing to two systems (DB + broker) non-atomically is the dual-write
    problem. The correct fix is the transactional outbox: the event row is
    written in the same local transaction as the state change, then a relay
    (polling or CDC/Debezium) publishes it at-least-once. 2PC across DB and
    broker is what you're trying to avoid; the issue is atomicity, not encoding.
  ref: concepts.md#domain-events
- id: microservices-ddd-and-boundaries-014
  difficulty: advanced
  tags:
  - domain-event
  - event-carried-state-transfer
  - trade-offs
  question: |
    What does "event-carried state transfer" trade off compared to publishing a
    thin event and having consumers call back for details?
  options:
  - It shrinks each event down to a bare identifier, reducing message size, but pays for it with stronger
    runtime coupling between the producer and its consumers
  - It guarantees exactly-once delivery, because the fuller payload lets the broker deduplicate replays
    automatically at the partition level without consumer help
  - It removes the need for idempotent consumers, since carrying the full state makes reprocessing any
    duplicate event entirely harmless by definition
  - It puts more data in the event (larger events, some duplication) to eliminate the synchronous query
    coupling of callbacks
  answer: 3
  explanation: |
    Event-carried state transfer embeds enough state in the event so consumers
    needn't call back — trading larger events and data duplication for removing
    the synchronous, temporally-coupled callback. It does not change delivery
    guarantees (still at-least-once, so consumers stay idempotent).
  ref: concepts.md#domain-events
- id: microservices-ddd-and-boundaries-015
  difficulty: advanced
  tags:
  - domain-event
  - coupling
  - trade-offs
  question: |
    What is a real downside of heavily using fine-grained domain events across
    service boundaries?
  options:
  - Events force all subscribing services into strong, immediate consistency with the publisher, which
    is undesirable because it silently reintroduces the coupling that events were meant to remove
  - Events are always slower than synchronous calls in every single case, because each hop must be durably
    persisted to the broker's disk and acknowledged before any subscriber can begin processing it
  - Workflow logic gets smeared across many subscribers, so 'what happens when an order is placed?' can
    no longer be read from one call stack, and cross-context event schemas become implicit public contracts
  - Events cannot be versioned once published, so any schema change silently breaks every existing subscriber
    and forces a coordinated redeploy of the entire estate at once
  answer: 2
  explanation: |
    Event-driven decoupling has a cost: the end-to-end behavior is implicit and
    spread across subscribers, making it hard to trace, and cross-context event
    schemas silently become public contracts you must version. Events don't grant
    strong consistency, can be versioned, and aren't universally slower.
  ref: concepts.md#domain-events
- id: microservices-ddd-and-boundaries-016
  difficulty: advanced
  tags:
  - context-mapping
  - conformist
  - acl
  question: |
    You depend on a large third-party upstream whose model is messy but you must
    keep your own model clean. Under Evans' context mapping, which relationship
    fits and why?
  options:
  - Anti-Corruption Layer, because you translate the foreign model into your own at the boundary so it
    never corrupts your domain
  - Shared Kernel, because you should co-own a common model with the vendor and jointly agree on every
    change to the shared types that both of you build against
  - Partnership, because you and the vendor plan releases together and succeed or fail as a single unit,
    coordinating each schema change across both roadmaps
  - Conformist, because keeping your own model clean actually requires adopting the upstream vendor's model
    as-is and mirroring its structure throughout your domain
  answer: 0
  explanation: |
    When an upstream model would corrupt yours and cleanliness matters, you build
    an ACL to translate at the boundary. Conformist means accepting the upstream
    model as-is (the opposite of keeping yours clean). Shared Kernel/Partnership
    imply co-ownership/joint planning you don't have with a big vendor.
  ref: concepts.md#context-mapping-and-integration-patterns
- id: microservices-ddd-and-boundaries-017
  difficulty: expert
  tags:
  - context-mapping
  - shared-kernel
  - trade-offs
  question: |
    Which statement about Shared Kernel is the most accurate senior assessment?
  options:
  - It is the preferred default choice for most integrations because it maximizes code reuse across contexts
    and spares both teams from ever writing duplicate model classes
  - It minimizes duplication but maximizes coupling — any change requires both teams' consent — so it
    should be tiny and reserved for genuinely stable, co-owned concepts
  - It fully decouples the two contexts and lets each team deploy completely independently, since the shared
    library is compiled separately into each service at build time
  - It is functionally identical to an Open Host Service, since both simply expose one team's shared model
    as a stable published protocol for any number of downstream consumers
  answer: 1
  explanation: |
    Shared Kernel shares a small model/code between contexts, minimizing
    duplication but coupling both teams: neither can change the kernel
    unilaterally, so it's a coordination bottleneck. Keep it tiny and stable.
    It's not a decoupling mechanism, not a sensible default, and not the same as
    an Open Host Service (a provider protocol for many consumers).
  ref: concepts.md#context-mapping-and-integration-patterns
- id: microservices-ddd-and-boundaries-018
  difficulty: intermediate
  tags:
  - context-mapping
  - upstream-downstream
  question: |
    In context mapping, "upstream" and "downstream" primarily describe what?
  options:
  - Which service has been allocated more CPU cores and memory, since the more powerful upstream node
    dictates the direction of every call to the smaller downstream one
  - Which service was written first chronologically, since the older upstream component is always the one
    that newer downstream components must adapt themselves to
  - The direction of the dependency and power — upstream changes affect downstream, and downstream strategies
    (Conformist, ACL, Customer-Supplier) manage that dependency
  - The physical network topology between data centers, where the upstream region hosts the primary and
    downstream regions consume replicated traffic across the WAN link
  answer: 2
  explanation: |
    Upstream/downstream capture who depends on whom and who holds the power:
    upstream changes ripple to downstream. Downstream patterns (Conformist, ACL,
    Customer-Supplier) are the ways a downstream context copes. It's not about
    hardware, chronology, or physical topology.
  ref: concepts.md#context-mapping-and-integration-patterns
- id: microservices-ddd-and-boundaries-019
  difficulty: advanced
  tags:
  - acl
  - published-language
  - integration
  question: |
    What is the litmus test that an anti-corruption layer is implemented
    correctly?
  options:
  - The upstream API is called directly from your domain services for speed, with the foreign DTOs imported
    straight into your core entities to skip a translation hop
  - The ACL shares database tables directly with the upstream system, reading its schema in place so both
    sides always see identical rows without any mapping between models
  - The ACL exposes the upstream DTOs unchanged to your domain layer, passing every foreign field straight
    through so your services bind directly to the vendor's exact types
  - Your core domain code has no dependency on upstream types — if you deleted the ACL, only the ACL would
    fail to compile
  answer: 3
  explanation: |
    A correct ACL fully isolates the foreign model: your domain imports none of
    the upstream types; translation happens only inside the ACL (façade +
    adapter + translator). If the upstream types leaked into your domain, or you
    called it directly / passed DTOs through, the ACL would be failing at its one
    job.
  ref: concepts.md#anti-corruption-layer-and-published-language
- id: microservices-ddd-and-boundaries-020
  difficulty: advanced
  tags:
  - published-language
  - provider
  - contract
  question: |
    A "published language" (e.g. a versioned event schema or an industry
    standard like FHIR/ISO 20022) primarily serves what purpose?
  options:
  - It forces all consumers to run the same programming language and runtime as the provider, since a
    published schema can only be deserialized by an identical language binding on both ends
  - It replaces the need for any anti-corruption layers downstream, because a well-published schema is
    already clean enough that consumers can safely bind their core domain straight to it
  - It is only useful inside a single bounded context, acting as a naming convention among that context's
    own modules rather than anything meant to cross a service boundary
  - It is a deliberately designed, versioned interchange schema that decouples a provider's internal model
    from what it exposes to many consumers
  answer: 3
  explanation: |
    A published language is the provider-side complement to an ACL: a documented,
    versioned interchange format that lets many consumers integrate without
    coupling to the provider's internal model. It doesn't dictate runtimes,
    doesn't eliminate downstream ACLs, and exists precisely for cross-context
    integration.
  ref: concepts.md#anti-corruption-layer-and-published-language
- id: microservices-ddd-and-boundaries-021
  difficulty: expert
  tags:
  - acl
  - trade-offs
  - gold-plating
  question: |
    When is building an anti-corruption layer likely NOT worth it?
  options:
  - When the upstream is a tiny, stable model that already matches your language — the ACL would be gold-plating
    adding a hop for no protection
  - When the upstream is a messy legacy monolith you must integrate with long-term, whose tangled model
    would otherwise seep into every consumer that touches it over the coming years
  - When you may swap the upstream vendor in the future and want a single seam where only the translator
    changes, leaving your core domain code entirely untouched during the migration
  - When the upstream model would otherwise leak into your core domain, contaminating your aggregates with
    foreign concepts that your ubiquitous language was carefully designed to keep out
  answer: 0
  explanation: |
    An ACL is real code plus a hop of latency; it pays off when the upstream is
    messy, volatile, or vendor-swappable and would corrupt your model. For a
    tiny, stable, already-aligned upstream, the ACL adds cost without protecting
    anything — that's over-engineering. All the other cases are precisely when an
    ACL is warranted.
  ref: concepts.md#anti-corruption-layer-and-published-language
- id: microservices-ddd-and-boundaries-022
  difficulty: advanced
  tags:
  - granularity
  - ddd
  - boundaries
  question: |
    According to DDD-driven service sizing, which is the strongest signal that a
    service boundary is drawn wrong?
  options:
  - The service has grown past a fixed 10,000-line-of-code ceiling, which DDD treats as the hard upper
    bound above which any bounded context must always be split into two
  - A typical feature routinely requires coordinated changes across three services — changes are not local
    to one service
  - The service persists its state in a relational database rather than a document or key-value store, since
    DDD boundaries are considered valid only when each service owns a NoSQL engine
  - The service exposes more than one public API endpoint, because a correctly-bounded context is expected
    to present exactly a single operation to the rest of the system
  answer: 1
  explanation: |
    Good boundaries make most changes local. If a typical feature requires
    lockstep changes across several services, you've split a bounded context and
    created distributed-monolith coupling. Line count, DB type, and endpoint
    count are not boundary-quality signals.
  ref: concepts.md#mapping-ddd-to-service-granularity
- id: microservices-ddd-and-boundaries-023
  difficulty: advanced
  tags:
  - subdomains
  - core-supporting-generic
  - investment
  question: |
    DDD distinguishes core, supporting, and generic subdomains. How should this
    classification guide microservice investment?
  options:
  - Build everything in-house with equally rich, elaborate models across all three subdomain types, since
    uniform investment is what keeps the overall architecture consistent and easy to reason about
  - Outsource your core, differentiating subdomains to a third-party vendor while building the generic
    ones like auth and email in-house, because commodity capabilities deserve your best engineers
  - Invest rich models and dedicated services in core (differentiating) subdomains; build supporting ones
    simply; buy/adopt generic ones (auth, email, payments) rather than build
  - Generic subdomains such as authentication and email deserve the deepest engineering investment precisely
    because they are used everywhere, so richly modeling them pays off across the whole system
  answer: 2
  explanation: |
    Core subdomains are your differentiator — model them richly and own them.
    Supporting ones are needed but not differentiating — keep them simple.
    Generic ones (auth, payments, email) are best bought/adopted. Building
    everything equally, or lavishing effort on generic subdomains, wastes
    engineering on non-differentiating work.
  ref: concepts.md#mapping-ddd-to-service-granularity
- id: microservices-ddd-and-boundaries-024
  difficulty: expert
  tags:
  - granularity
  - performance
  - purity
  - trade-offs
  question: |
    When might you deliberately violate "pure" DDD context boundaries and
    co-locate two contexts' data or logic?
  options:
  - Never — DDD purity always wins over performance, so context boundaries must be preserved even when
    the resulting cross-service chatter measurably degrades every hot-path request
  - Whenever two contexts happen to share any field name at all, since overlapping attribute names are
    proof that the two models are really one and should always be physically co-located
  - Only when both contexts are owned by the same manager, because reporting-line alignment is the deciding
    factor for whether their data and logic may be merged into one store
  - When two contexts must be queried together on essentially every request and the latency/fan-out of
    keeping them separate outweighs the purity benefit
  answer: 3
  explanation: |
    DDD-aligned boundaries optimize change locality and autonomy, but they can
    conflict with performance boundaries. If two contexts are always fetched
    together on the hot path, co-locating to avoid chatty fan-out can be the right
    engineering trade-off. Purity is a guide, not an absolute; shared field names
    or shared management aren't reasons.
  ref: concepts.md#mapping-ddd-to-service-granularity
- id: microservices-ddd-and-boundaries-025
  difficulty: beginner
  tags:
  - conways-law
  - org
  question: |
    Conway's Law states that:
  options:
  - Organizations produce designs that mirror their own communication structures
  - Systems inevitably get slower as they grow, because every added component increases coordination
    overhead until throughput collapses under its own coupling
  - Every distributed system will eventually fail, since the probability that all independent nodes stay
    healthy at once trends toward zero as the fleet size increases
  - Adding engineers to a late software project makes it even later, because onboarding and communication
    overhead outweigh the extra hands the new people bring
  answer: 0
  explanation: |
    Conway (1968): organizations are constrained to produce designs that copy
    their communication structures. "Adding engineers to a late project makes
    it later" is Brooks's Law; the others are unrelated aphorisms.
  ref: concepts.md#conways-law-and-the-inverse-conway-maneuver
- id: microservices-ddd-and-boundaries-026
  difficulty: advanced
  tags:
  - inverse-conway
  - org-design
  question: |
    What is the "inverse Conway maneuver"?
  options:
  - Deliberately restructuring teams into loosely-coupled, context-aligned units so the desired loosely-coupled
    architecture emerges
  - Ignoring the org chart entirely when designing services, on the assumption that a sufficiently clean
    architecture will override whatever communication structure the organization happens to have
  - Merging all engineering teams into one large group to simplify communication, so that a single unified
    team can produce the cleanly-separated service boundaries the design calls for
  - Rewriting the entire system from scratch on a cutover date to escape Conway's Law, replacing the org-shaped
    architecture with a fresh design untainted by the existing team structure
  answer: 0
  explanation: |
    Since architecture follows org structure, you change the org to get the
    architecture you want: autonomous teams aligned to bounded contexts produce
    loosely-coupled, independently deployable services. Merging teams or ignoring
    the org fights Conway rather than exploiting it.
  ref: concepts.md#conways-law-and-the-inverse-conway-maneuver
- id: microservices-ddd-and-boundaries-027
  difficulty: expert
  tags:
  - inverse-conway
  - risk
  - trade-offs
  question: |
    What is the key risk of aggressively applying the inverse Conway maneuver
    early in an unclear domain?
  options:
  - Reorgs are cheap and fully reversible, so there is no real risk in aligning teams to boundaries early —
    if the guess is wrong you simply swap people back the next sprint at no lasting cost
  - If you guess the boundaries wrong, you've baked a wrong architecture into the org, which is harder
    to change than code
  - It reliably improves end-to-end latency while hurting availability, because context-aligned teams ship
    faster paths at the cost of introducing more independent components that can fail
  - It only works for engineering organizations larger than 100 people, since Conway's Law has no measurable
    effect on the architecture produced by any smaller team
  answer: 1
  explanation: |
    The maneuver is powerful but blunt: reorgs are disruptive, and if the
    boundaries are wrong you've now encoded the wrong architecture into the org
    structure — far harder to undo than refactoring code. Use it when boundaries
    are well understood; keep teams flexible when the domain is unclear.
  ref: concepts.md#conways-law-and-the-inverse-conway-maneuver
- id: microservices-ddd-and-boundaries-028
  difficulty: intermediate
  tags:
  - team-topologies
  - stream-aligned
  - platform
  question: |
    In Team Topologies, what is the role of a platform team relative to
    stream-aligned teams?
  options:
  - To take over all feature coding from stream-aligned teams, centralizing implementation so those teams
    only write requirements while the platform group builds and ships their services for them
  - To act as a temporary embedded coach that upskills a stream-aligned team on new practices and then
    disbands after a few weeks once the capability has been transferred across
  - To provide internal self-service capabilities (CI/CD, observability, paved-road runtime) as a product
    so stream-aligned teams go faster with less cognitive load
  - To own the single most specialized subsystem that requires deep, uncommon expertise, freeing stream-aligned
    teams from having to master that one hard technical area themselves
  answer: 2
  explanation: |
    Platform teams provide self-service internal products that reduce the
    cognitive load of stream-aligned teams. The temporary-coach role is an
    enabling team; the deep-specialist role is a complicated-subsystem team;
    platform teams don't do the stream teams' coding.
  ref: concepts.md#team-topologies
- id: microservices-ddd-and-boundaries-029
  difficulty: advanced
  tags:
  - team-topologies
  - cognitive-load
  question: |
    A stream-aligned team's cognitive load is too high. Which set of responses
    is aligned with Team Topologies?
  options:
  - Tell them to simply work harder and take on more services, on the theory that owning a broader slice
    of the system will build the expertise that eventually brings the cognitive load back down
  - Merge them with three other stream-aligned teams into one large group to share the burden, so the
    combined headcount can absorb the extra load spread across many more people
  - Remove their on-call responsibilities entirely and hand production support to a central ops team, so
    the stream-aligned team can focus purely on building features without operational distraction
  - Shrink the team's scope, extract a complicated-subsystem team, or invest in a platform to abstract
    the load away
  answer: 3
  explanation: |
    Cognitive load is the central metric: when it's too high, reduce scope,
    extract specialist subsystems, or provide platform abstractions. "Work
    harder" ignores the constraint; merging teams increases coordination; a
    central ops team breaks the you-build-it-you-run-it ownership model.
  ref: concepts.md#team-topologies
- id: microservices-ddd-and-boundaries-030
  difficulty: expert
  tags:
  - team-topologies
  - platform
  - anti-pattern
  question: |
    What is the failure mode a platform team must guard against?
  options:
  - Shipping new platform capabilities so quickly that stream-aligned teams cannot keep up with adopting
    them, forcing the platform to deliberately slow its release cadence to stay in step
  - Becoming a bottleneck/ivory tower that builds what it assumes teams need instead of what they ask
    for, rather than treating the platform as a product with adoption metrics
  - Having too few upstream dependencies on other teams, which leaves the platform group under-utilized
    and unable to justify the internal capabilities it has already built
  - Reducing a stream-aligned team's cognitive load so far below zero that the team no longer has enough
    meaningful work to stay engaged with the systems it nominally owns
  answer: 1
  explanation: |
    Platform teams add indirection and can degrade into ivory towers or ticket
    queues, building unused capabilities. The remedy is treating the platform as
    a product: measure real adoption and build what stream-aligned teams actually
    ask for. The other options aren't real failure modes.
  ref: concepts.md#team-topologies
- id: microservices-ddd-and-boundaries-031
  difficulty: advanced
  tags:
  - distributed-monolith
  - detection
  - anti-pattern
  question: |
    Which combination of symptoms most strongly indicates you have built a
    distributed monolith rather than true microservices?
  options:
  - Services must be released together in a coordinated train, share database tables, and a change to
    one service's API routinely forces changes in several others
  - Each service owns its own private database, exposes state only through its API, and can be built and
    deployed independently without waiting on any other service's release
  - Services communicate asynchronously via durable events, process handlers idempotently, and stay available
    to buffer work even when a downstream dependency is temporarily unreachable
  - Services are owned by separate two-pizza teams that each deploy on their own cadence, coordinating only
    through versioned, backward-compatible contracts rather than shared release trains
  answer: 0
  explanation: |
    Lockstep release trains, shared tables, and API changes rippling across
    services are the classic distributed-monolith tells: you pay the network/ops
    tax with none of the independence. The other options describe healthy
    microservices (private data, async decoupling, autonomous team deploys).
  ref: concepts.md#the-distributed-monolith-anti-pattern
- id: microservices-ddd-and-boundaries-032
  difficulty: advanced
  tags:
  - availability-math
  - sync-chain
  - fan-out
  question: |
    A request requires 10 sequential synchronous calls, each to a dependency
    with 99.9% availability (failures independent). Approximately what is the
    end-to-end success probability?
  options:
  - About 99.9%
  - About 99.0%
  - About 90.0%
  - About 99.99%
  answer: 1
  explanation: |
    For N required sequential calls each at availability a, end-to-end success is
    a^N. 0.999^10 ≈ 0.990 ≈ 99.0%. Ten three-nines dependencies chained
    synchronously yield roughly two-nines end-to-end — a big argument against
    long synchronous chains.
  ref: concepts.md#the-distributed-monolith-anti-pattern
- id: microservices-ddd-and-boundaries-033
  difficulty: expert
  tags:
  - tail-latency
  - fan-out
  - tail-at-scale
  question: |
    Per "The Tail at Scale," why does fanning a request out across many services
    make the typical response approach the dependencies' tail latency?
  options:
  - Because the average latency of the fan-out always dominates over the tail, so the slowest few hops
    are statistically washed out by the many fast ones and never affect the typical response
  - Because network bandwidth hard-caps at exactly N concurrent calls, and the resulting queueing delay
    at that ceiling is what pushes every fanned-out request toward the tail
  - Because with N calls the probability that at least one hits its p99 is 1 - 0.99^N, so a request routinely
    experiences a slow hop (≈9.6% at N=10)
  - Because request serialization cost grows as O(N^2) in the number of services, so the marshalling overhead
    alone dominates and drags each fanned-out request out into the tail region
  answer: 2
  explanation: |
    With N calls each having a 1% chance of exceeding p99, the chance at least
    one is slow is 1 - 0.99^N ≈ 9.6% at N=10 — so high fan-out means requests
    routinely include a tail-slow hop, pulling typical latency toward the
    dependencies' tail. This is the core tail-at-scale insight; it's not about
    bandwidth caps or quadratic serialization.
  ref: concepts.md#the-distributed-monolith-anti-pattern
- id: microservices-ddd-and-boundaries-034
  difficulty: advanced
  tags:
  - distributed-monolith
  - remediation
  question: |
    What is the correct framing of the cure for a distributed monolith?
  options:
  - Split the tangled services into even more, finer-grained services, on the theory that smaller pieces
    are inherently more decoupled and the coupling will dissolve as the service count rises
  - Merge everything back into one process permanently and never decompose again, treating any future
    attempt at service boundaries as the root cause of the coupling you experienced
  - Add a distributed two-phase-commit transaction coordinator across the services to keep the shared data
    consistent, so the lockstep writes at least commit atomically across every participant
  - The cure is correct boundaries — private data, async/event integration to break temporal coupling,
    and boundaries that keep changes local; if you can't find decoupling boundaries, that argues for a
    modular monolith
  answer: 3
  explanation: |
    More services doesn't fix coupling; correct boundaries do — database-per-
    service, async integration, and change locality. If no decoupling boundary
    exists, that's evidence the thing should have stayed a modular monolith.
    Adding 2PC deepens the coupling; reflexively merging isn't the general answer.
  ref: concepts.md#the-distributed-monolith-anti-pattern
- id: microservices-ddd-and-boundaries-035
  difficulty: advanced
  tags:
  - granularity
  - nanoservices
  - sizing
  question: |
    Which is the clearest signal that services are TOO fine-grained
    (nanoservices)?
  options:
  - Different parts of the system are forced to scale together even though their loads differ greatly, so
    you over-provision a low-traffic module just to keep a high-traffic one inside the same service healthy
  - The blast radius of a single bad deploy is the entire domain, because one oversized service bundles
    every capability together and a bug in any one of them takes down all the rest at once
  - A single business operation requires synchronously orchestrating many services, and you need distributed
    transactions to keep two of them consistent
  - Multiple unrelated teams constantly contend on the same shared deploy pipeline, serializing their
    releases behind one another because so much functionality lives inside a single deployable unit
  answer: 2
  explanation: |
    Needing to synchronously orchestrate many services for one operation, and
    needing distributed transactions to keep two services consistent, means you
    split a bounded context too finely (they probably belong together). Parts
    that must scale together, a domain-wide blast radius, and teams contending on
    one pipeline are signs a service is too coarse, not too fine.
  ref: concepts.md#right-sizing-services-and-the-granularity-trade-off
- id: microservices-ddd-and-boundaries-036
  difficulty: advanced
  tags:
  - granularity
  - split-vs-merge
  - bias
  question: |
    Why should you bias toward fewer, larger services early and extract later
    rather than start with many fine-grained services?
  options:
  - It is cheaper to split a well-structured module later than to merge wrongly-split services, since
    merging means untangling network contracts and data migrations
  - Larger services always perform better, because keeping every call in-process eliminates network hops
    and therefore guarantees lower latency and higher throughput than any decomposed design
  - Fine-grained services are effectively impossible to monitor, since no tracing or metrics tooling can
    reconstruct a request once it has fanned out across more than a handful of separate processes
  - The number of services must always equal the number of engineers on the team, so you should provision
    exactly one deployable per person and re-split whenever headcount changes
  answer: 0
  explanation: |
    Splitting a clean module (a refactor) is cheaper than merging services you
    split wrong (untangling network contracts, data migrations, deploy coupling).
    Hence "start coarse, extract under proven pressure." Larger isn't always
    faster, fine-grained services are monitorable, and there's no service-count =
    engineer-count rule.
  ref: concepts.md#right-sizing-services-and-the-granularity-trade-off
- id: microservices-ddd-and-boundaries-037
  difficulty: intermediate
  tags:
  - granularity
  - two-pizza
  - conway
  question: |
    Amazon's "two-pizza team" heuristic, viewed through Conway's Law, is best
    described as:
  options:
  - A strict rule that every service must expose exactly six public endpoints, one per team member, to
    remain independently maintainable
  - Sizing the team (and thus, via Conway, the service it owns) rather than sizing the service directly
  - A hard limit capping each service at no more than two backing databases so its complexity stays
    bounded
  - A deployment-frequency target mandating that each team ship its service to production at least once
    every day
  answer: 1
  explanation: |
    The two-pizza team sizes the *team* to keep ownership and cognitive load
    manageable; via Conway, the service naturally follows the team boundary. It's
    not an endpoint count, DB limit, or deploy-frequency rule.
  ref: concepts.md#right-sizing-services-and-the-granularity-trade-off
- id: microservices-ddd-and-boundaries-038
  difficulty: advanced
  tags:
  - data-ownership
  - database-per-service
  - shared-db
  question: |
    Why is "two services sharing database tables" considered the deepest form of
    coupling?
  options:
  - It consumes noticeably more disk space than separate databases, and that storage overhead is what makes
    the arrangement the tightest form of coupling
  - It inevitably causes lock contention and deadlocks on every concurrent write because two services can
    never safely hold row locks on the same table
  - A schema change in one service can silently break the other and forces lockstep deploys, destroying
    independent deployability
  - Tables shared across two services can no longer be indexed, so query performance collapses and the
    services are forced to couple around slow scans
  answer: 2
  explanation: |
    A shared schema means one service's migration can break another with no API
    contract to signal it, forcing coordinated deploys — the essence of a
    distributed monolith. It's about coupling and hidden breakage, not disk usage,
    guaranteed deadlocks, or indexing limits.
  ref: concepts.md#data-ownership-and-database-per-service
- id: microservices-ddd-and-boundaries-039
  difficulty: advanced
  tags:
  - database-per-service
  - discipline
  - enforcement
  question: |
    A team says "we'll share one database but just be disciplined about not
    touching each other's tables." What's the strongest senior critique?
  options:
  - Discipline is entirely sufficient here; a documented wiki policy plus code-review vigilance will reliably
    hold the boundary indefinitely
  - Sharing a single database is actually the officially recommended microservices pattern for teams that
    trust each other and want to reduce operational overhead
  - This only becomes a problem if the shared database happens to be relational; document and key-value
    stores make cross-service table access perfectly safe
  - Discipline erodes over time and coupling creeps back; enforce private data with separate schemas/credentials,
    not a policy document
  answer: 3
  explanation: |
    "Shared DB with good intentions" reliably decays — under deadline pressure
    someone reads another service's table. Enforce ownership mechanically
    (separate schemas, separate credentials, access controls), not with a wiki
    page. Shared DB is an anti-pattern regardless of relational vs not.
  ref: concepts.md#data-ownership-and-database-per-service
- id: microservices-ddd-and-boundaries-040
  difficulty: expert
  tags:
  - database-per-service
  - trade-offs
  - polyglot
  question: |
    Which is an accurate statement of what database-per-service gains and gives
    up?
  options:
  - Gains effortless cross-service JOINs and distributed ACID transactions across every service; gives up
    the ability to deploy any service independently of the others
  - Gains strong global consistency across all services at once; gives up any and all data duplication,
    since each fact now lives in exactly one place
  - Gains nothing whatsoever; database-per-service is purely a cost with no compensating architectural
    benefit over a single shared store
  - Gains independent deploy, polyglot persistence, and fault isolation; gives up cross-service JOINs,
    cross-service ACID transactions, and cross-boundary foreign keys
  answer: 3
  explanation: |
    Private data buys independent deploy, per-service tech choice (polyglot), and
    fault isolation. The price is losing cross-service joins, cross-service ACID
    transactions, and cross-boundary FKs — which is exactly what forces sagas,
    outbox, and read models. The claim that you gain cross-service JOINs/ACID
    inverts reality; global strong consistency is not what you gain either.
  ref: concepts.md#data-ownership-and-database-per-service
- id: microservices-ddd-and-boundaries-041
  difficulty: advanced
  tags:
  - querying
  - api-composition
  - tail-latency
  question: |
    For a query that joins data from three services, when does API composition
    (a gateway calling each service and joining in memory) break down?
  options:
  - When result sets are large or require cross-service paging/sorting/aggregation, and when deep fan-out
    makes tail latency and availability degrade
  - When the result set is small and the caller needs the freshest possible data straight from each owning
    service on every request
  - When only a single service is involved, so the gateway makes exactly one downstream call and performs
    no in-memory join at all
  - When all the participating services already share one physical database and the gateway can push the
    join down into a single SQL statement
  answer: 0
  explanation: |
    API composition is simplest and freshest for small queries over few sources,
    but in-memory joins don't scale to large result sets or cross-service
    paging/sorting/aggregation, and latency is bounded by the slowest call while
    availability degrades multiplicatively. Small/fresh queries are exactly where
    it shines.
  ref: concepts.md#querying-across-services
- id: microservices-ddd-and-boundaries-042
  difficulty: advanced
  tags:
  - querying
  - cqrs
  - read-model
  question: |
    You need a high-volume search page aggregating data from five services. Which
    pattern fits best and what's its main cost?
  options:
  - API composition at the gateway, fanning out to all five services and joining in memory on each request;
    cost is nothing beyond a little eventual consistency
  - A CQRS read model fed by events into a denormalized store (e.g. Elasticsearch); cost is eventual consistency
    (projector lag) plus an extra store to operate
  - Synchronous two-phase commit spanning all five services so the search page always reads a globally
    consistent snapshot; cost is a small amount of extra latency only
  - A single shared database that all five services write into, letting the search page issue one plain
    SQL join; cost is essentially nothing at all
  answer: 1
  explanation: |
    For heavy reads and cross-service aggregation, a CQRS read model built from
    events is the go-to: reads hit one optimized denormalized store. The cost is
    eventual consistency bounded by projector lag plus operating the extra store.
    API composition melts under this fan-out; 2PC/shared DB are wrong for querying
    and reintroduce coupling.
  ref: concepts.md#querying-across-services
- id: microservices-ddd-and-boundaries-043
  difficulty: expert
  tags:
  - querying
  - read-your-writes
  - cqrs
  question: |
    With a CQRS read model, a user updates a record and immediately reloads the
    list but doesn't see their change. What is the disciplined way to handle this
    "read-your-writes" issue?
  options:
  - Make the read model strongly consistent by wrapping the write store and the read store in a two-phase
    commit so every projection updates inside the original write transaction
  - Delete the read model entirely and always query each owning service synchronously on every list load,
    joining their responses in the gateway instead
  - Accept the projector lag and mitigate it — e.g. read from the write side right after a mutation, or
    show optimistic UI — rather than forcing synchronous consistency
  - Increase the projector's batch size so updates are applied in larger chunks and the lag becomes bigger
    but more predictable for the user
  answer: 2
  explanation: |
    The read model is eventually consistent by design (bounded by projector lag).
    You handle read-your-writes by reading the write side immediately after a
    mutation or using optimistic UI — not by bolting on 2PC (defeats CQRS's
    benefits) or discarding the read model. Larger batches make lag worse.
  ref: concepts.md#querying-across-services
- id: microservices-ddd-and-boundaries-044
  difficulty: intermediate
  tags:
  - querying
  - replication
  - data-duplication
  question: |
    When is "data replication/duplication" (a consumer keeping its own copy of a
    few foreign fields, fed by events) the best cross-service query approach?
  options:
  - When you need a fully consistent, real-time join over millions of rows and every field must reflect
    the owning service's very latest committed write
  - When your primary goal is to avoid all storage duplication and keep exactly one authoritative copy
    of every field across the whole estate
  - When the underlying data changes every millisecond and downstream consumers must never observe a value
    that is even slightly stale
  - When a consumer needs just a few foreign fields on its own aggregates and can tolerate slight staleness,
    eliminating the runtime cross-service call
  answer: 3
  explanation: |
    Replicating a few needed fields locally (via events) removes the runtime
    cross-service dependency for those fields, trading some storage duplication
    and staleness for speed and resilience. It's ill-suited to always-fresh,
    never-stale requirements or when you specifically want zero duplication.
  ref: concepts.md#querying-across-services
- id: microservices-ddd-and-boundaries-045
  difficulty: advanced
  tags:
  - temporal-coupling
  - async
  - resilience
  question: |
    What does asynchronous messaging fundamentally do to temporal coupling that
    synchronous request/response does not?
  options:
  - It removes the requirement that producer and consumer both be up and responsive at the same instant;
    the queue absorbs bursts and outages
  - It makes the producer and consumer strongly consistent, since the broker synchronously confirms the
    consumer has applied each message before the producer proceeds
  - It automatically guarantees strictly ordered, exactly-once delivery of every message end to end with
    no deduplication or sequencing work required from either side
  - It eliminates the need to monitor anything, because a durable queue is self-healing and never develops
    backlog, poison messages, or consumer lag
  answer: 0
  explanation: |
    Async messaging breaks temporal coupling: the producer emits and moves on,
    the consumer processes when able, and the queue provides load leveling and
    outage buffering. It does not grant strong consistency, does not
    automatically give ordered exactly-once delivery, and adds the queue itself as
    something to operate/monitor (lag, DLQs).
  ref: concepts.md#synchronous-versus-asynchronous-coupling-and-temporal-coupling
- id: microservices-ddd-and-boundaries-046
  difficulty: expert
  tags:
  - sync-async
  - judgment
  - trade-offs
  question: |
    Which allocation of sync vs async is the soundest default and why?
  options:
  - Async for cross-service state propagation/workflows that tolerate eventual consistency; sync for genuine
    query/read paths where the caller needs an immediate answer
  - Everything synchronous everywhere, because request/response chains are the simplest thing to reason
    about and blocking calls make failures easy to trace
  - Everything asynchronous everywhere, because pushing every interaction through a broker is always strictly
    more resilient than any synchronous call could be
  - Synchronous for all writes and asynchronous for all reads as a blanket rule, regardless of whether
    the interaction is a query or a state propagation
  answer: 0
  explanation: |
    The pragmatic default: use async to propagate state and drive workflows that
    tolerate eventual consistency (breaking temporal coupling), and keep sync for
    request/response reads where the caller needs an answer now. Forcing all-sync
    gives fragile chatty chains; forcing all-async turns a simple read into an
    event-choreography with no easy way to return a result. "Sync writes, async
    reads" is backwards for state propagation.
  ref: concepts.md#synchronous-versus-asynchronous-coupling-and-temporal-coupling
- id: microservices-ddd-and-boundaries-047
  difficulty: expert
  tags:
  - cascading-failure
  - retries
  - jitter
  question: |
    A downstream service slows down and callers retry aggressively, exhausting
    thread/connection pools and cascading the outage upstream. Per the AWS
    Builders' Library, which mitigation set is correct?
  options:
  - Unbounded immediate retries paired with a much larger thread pool, so callers keep hammering the slow
    dependency until it eventually responds
  - Timeouts, bounded retries with exponential backoff plus jitter, circuit breakers, and bulkheads/workload
    isolation
  - Synchronous fallbacks that immediately call a second identical copy of the same struggling dependency
    so the request still completes during the slowdown
  - Removing all client-side timeouts so requests simply wait for the dependency's eventual success instead
    of failing fast and retrying
  answer: 1
  explanation: |
    Cascading failures from sync chains are contained with timeouts, bounded
    retries using exponential backoff plus jitter (to avoid synchronized retry
    storms), circuit breakers, and bulkheads to isolate workloads. Unbounded
    retries and removed timeouts amplify the storm; the Builders' Library
    specifically cautions against fallbacks that add load/complexity in a crisis.
  ref: concepts.md#synchronous-versus-asynchronous-coupling-and-temporal-coupling
- id: microservices-ddd-and-boundaries-048
  difficulty: advanced
  tags:
  - cdc
  - pact
  - testing
  question: |
    What problem does consumer-driven contract testing (e.g. Pact) primarily
    solve for a microservices estate?
  options:
  - It fully replaces every unit test and performance test in the estate, becoming the single test layer
    a service needs before it can ship
  - It guarantees complete end-to-end business correctness across all services, proving the whole workflow
    behaves correctly once each pact passes
  - It removes the need for a shared, world-deploying integration environment by letting each side verify
    a contract in isolation, gating independent deploys
  - It verifies that the provider's database schema is fully normalized to third normal form before the
    provider is allowed to deploy
  answer: 2
  explanation: |
    CDC testing kills the slow, flaky shared-integration-environment bottleneck:
    consumers record expectations (pacts), the provider verifies them in its own
    pipeline, and tools like can-i-deploy gate releases — enabling safe
    independent deployment. It doesn't replace unit/perf tests, doesn't verify
    end-to-end business behavior, and isn't about DB normalization.
  ref: concepts.md#consumer-driven-contract-testing
- id: microservices-ddd-and-boundaries-049
  difficulty: advanced
  tags:
  - cdc
  - coverage
  - limits
  question: |
    Because Pact contracts are consumer-driven, which statement is true?
  options:
  - The provider must guarantee that every single field it exposes, including ones no consumer reads, stays
    byte-for-byte unchanged across all future versions
  - Consumers have no influence over which parts of the API get tested; the provider alone decides the
    contract surface and publishes it downward
  - The contracts additionally verify the provider's performance and latency guarantees, failing the pact
    if a response exceeds an agreed millisecond budget
  - The provider only needs to keep satisfying what real consumers actually use, so it can freely change
    fields no consumer depends on
  answer: 3
  explanation: |
    Consumer-driven means the contract covers exactly the interactions/fields
    real consumers use; the provider can change anything no one depends on. It
    does not force unused fields to be frozen, consumers define the tested
    surface, and CDC does not verify performance.
  ref: concepts.md#consumer-driven-contract-testing
- id: microservices-ddd-and-boundaries-050
  difficulty: expert
  tags:
  - cdc
  - public-api
  - trade-offs
  question: |
    For which situation is consumer-driven contract testing a POOR fit, calling
    for provider-driven schema + versioning instead?
  options:
  - A handful of known internal consumers of an internal API whose teams you can name and reach directly
    to collect their pacts
  - A public API with unknown, unbounded external consumers you cannot enumerate
  - Two teams within the same company integrating over gRPC, each able to contribute and maintain its
    own consumer contract in the shared pipeline
  - An internal event stream with three known subscribers, all owned by teams you can coordinate with to
    gather their expected interactions
  answer: 1
  explanation: |
    CDC assumes you can enumerate consumers to collect their pacts. For a public
    API with unknown external consumers, you can't, so you rely on
    provider-published schemas plus disciplined versioning and tolerant readers.
    The other cases have a knowable, manageable consumer set — ideal for CDC.
  ref: concepts.md#consumer-driven-contract-testing
- id: microservices-ddd-and-boundaries-051
  difficulty: advanced
  tags:
  - versioning
  - backward-compatible
  - evolution
  question: |
    Which change to a JSON API is backward compatible (safe for existing
    consumers), assuming tolerant readers?
  options:
  - Adding a new optional field
  - Renaming an existing field
  - Making a previously optional field required
  - Changing the type of an existing field from string to integer
  answer: 0
  explanation: |
    Additive changes — new optional fields, new endpoints — are backward
    compatible when consumers ignore unknowns. Renaming, tightening
    optional→required, and changing a field's type all break existing consumers
    and are breaking changes requiring a versioning/deprecation strategy.
  ref: concepts.md#schema-and-api-versioning-and-safe-deprecation
- id: microservices-ddd-and-boundaries-052
  difficulty: advanced
  tags:
  - tolerant-reader
  - postel
  - evolution
  question: |
    Why is the "Tolerant Reader" pattern (consumers ignore unknown fields and
    avoid over-validating) so valuable for independent deployability?
  options:
  - It makes payloads meaningfully smaller on the wire, since consumers strip out any fields they don't
    recognize before storing or forwarding the message
  - It lets providers add fields freely without breaking consumers, removing most sources of breakage
    and enabling additive evolution
  - It guarantees exactly-once delivery, because a reader that tolerates unknown fields can silently absorb
    duplicate messages without any deduplication logic
  - It forces consumers and providers to deploy together in lockstep, so a schema change is always rolled
    out to both sides in a single coordinated release
  answer: 1
  explanation: |
    A tolerant reader ignores unknowns and doesn't over-validate, so a provider
    can add fields without breaking anyone — the single practice that removes most
    breakage and underpins additive, independent evolution. It's about
    compatibility, not payload size, delivery semantics, or coupling deploys.
  ref: concepts.md#schema-and-api-versioning-and-safe-deprecation
- id: microservices-ddd-and-boundaries-053
  difficulty: expert
  tags:
  - protobuf
  - avro
  - schema-evolution
  question: |
    Which statement about schema evolution in Protobuf/Avro is correct?
  options:
  - In Protobuf you may freely renumber field tags between versions, since the field name rather than the
    tag number is what identifies each field on the wire
  - Avro requires no schema at read time at all; a reader can decode any Avro record purely from the bytes
    because the field names are embedded inline in the payload
  - Never reuse or renumber Protobuf field tags; in Avro, readers combine writer and reader schemas and
    use defaults for missing fields, and a schema registry enforces compatibility on publish
  - JSON ships with built-in schema-compatibility enforcement equal to Avro's, automatically rejecting
    any producer whose payload would break an existing consumer
  answer: 2
  explanation: |
    Protobuf compatibility hinges on stable field tags — renumbering/reusing them
    corrupts wire compatibility. Avro reads with both writer and reader schemas,
    filling missing fields via defaults, and a schema registry can reject
    incompatible schemas at publish. JSON has no built-in enforcement, which is
    why tolerant readers + CDC tests matter there.
  ref: concepts.md#schema-and-api-versioning-and-safe-deprecation
- id: microservices-ddd-and-boundaries-054
  difficulty: advanced
  tags:
  - deprecation
  - sunset
  - telemetry
  question: |
    What is the safe way to remove a deprecated endpoint in an internal
    microservices estate?
  options:
  - Remove it on a fixed calendar date announced in advance, regardless of whether any services are still
    calling it when that date arrives
  - Remove it immediately without warning and let any consumers that break file bug reports afterward so
    you can discover who still depended on it
  - Never remove anything at all; keep every deprecated endpoint running forever so no consumer can ever
    be broken by a removal
  - Announce and mark deprecated, measure real usage/telemetry to find remaining callers, migrate them,
    and remove only after usage hits zero — running old and new in parallel meanwhile
  answer: 3
  explanation: |
    Safe deprecation is telemetry-driven: deprecate, measure real callers
    (Deprecation/Sunset headers help), migrate them, and remove only once usage is
    zero — running old and new in parallel (expand/contract). Calendar-only removal
    or immediate removal breaks live consumers; never removing lets cruft
    accumulate forever.
  ref: concepts.md#schema-and-api-versioning-and-safe-deprecation
- id: microservices-ddd-and-boundaries-055
  difficulty: advanced
  tags:
  - idempotency
  - at-least-once
  - retries
  question: |
    Why do mutating microservice operations need idempotency in the first place?
  options:
  - Because TCP and modern message brokers already provide exactly-once delivery end to end, and layering
    idempotency on top simply doubles that guarantee for extra safety
  - Because marking an operation idempotent lets the runtime cache its result and skip the database
    round-trip, so repeated calls return faster than the first one did
  - Because networks provide at-least-once delivery — clients retry on timeout and brokers redeliver —
    so the same logical operation can arrive more than once
  - Because relational databases cannot enforce unique constraints across separate connections, so
    application-level idempotency is the only way to prevent duplicate rows
  answer: 2
  explanation: |
    Real networks give at-least-once delivery: timeouts trigger client retries and
    brokers redeliver, so the same logical operation may arrive multiple times.
    Idempotency makes reprocessing safe (same effect as once). Exactly-once
    delivery is generally impossible; idempotency isn't a speed feature, and DBs
    do enforce unique constraints (in fact you use them for dedup).
  ref: concepts.md#idempotency-key-design
- id: microservices-ddd-and-boundaries-056
  difficulty: expert
  tags:
  - idempotency
  - atomicity
  - failure-mode
  question: |
    In an idempotency-key implementation, why must recording the key and
    performing the state change be atomic (same transaction or unique-constraint
    guarded)?
  options:
  - Because if you do the work first and record the key afterward, a crash in between causes the operation
    to execute twice on retry
  - Because writing the key and the state change in one transaction lets the database co-locate them on the
    same page, making the subsequent key lookup measurably faster to serve
  - Because idempotency keys hold sensitive request data and must be encrypted at rest before the state
    change runs, and only a single atomic transaction can enforce that ordering
  - Because the client is expected to generate a fresh idempotency key on every retry attempt, and only an
    atomic write can reconcile those differing keys into one logical operation
  answer: 0
  explanation: |
    If the work commits but the key isn't yet recorded and the process crashes,
    the retry sees no key and re-executes — double execution. Recording the key
    atomically with the state change (or via a unique constraint) closes that
    window. Encryption is irrelevant; a client generating a fresh key per retry is
    itself a bug (see next), not the reason for atomicity.
  ref: concepts.md#idempotency-key-design
- id: microservices-ddd-and-boundaries-057
  difficulty: expert
  tags:
  - idempotency
  - client-bug
  - exactly-once
  question: |
    Which statement about idempotency keys is correct?
  options:
  - The key should be regenerated on every HTTP retry so that each attempt gets a unique value and can never
    collide with a concurrent request from another client
  - The key must identify the logical intent (reused across all retries of that intent); a fresh key per
    retry defeats dedup, and idempotency gives exactly-once *effect*, not exactly-once *delivery*
  - Idempotency keys upgrade the transport to exactly-once delivery over the network, so the broker will
    physically deliver each keyed message to the consumer one time and no more
  - Concurrent duplicate requests carrying the same key need no locking, because the database transparently
    serializes them and silently discards the second write without any unique constraint
  answer: 1
  explanation: |
    The key identifies the logical operation, so all retries of the same intent
    reuse it — generating a new key per retry (the #1 real-world bug) defeats the
    whole mechanism. Idempotency delivers exactly-once *effect* via dedup, not
    exactly-once *delivery* (impossible in general). Concurrent duplicates need a
    unique constraint / lock or both may execute.
  ref: concepts.md#idempotency-key-design
- id: microservices-ddd-and-boundaries-058
  difficulty: advanced
  tags:
  - idempotency
  - natural-idempotency
  - design
  question: |
    Which design avoids needing an idempotency-key dedup store entirely?
  options:
  - POST /orders that inserts a brand-new row with a server-generated id on each call, relying on the
    freshly minted primary key to keep every retry cleanly separated
  - Appending each incoming request as a new entry to an event log, trusting the append-only structure to
    absorb retries without ever storing the same effect twice
  - PUT /orders/{clientGeneratedId} with a deterministic client-supplied resource id, or setting a value
    (natural idempotency)
  - Incrementing a running counter by one on every request, so the accumulated total reflects exactly how
    many times the operation was legitimately invoked
  answer: 2
  explanation: |
    Natural idempotency — a deterministic resource id via PUT, or setting (not
    incrementing) a value — makes repeated requests converge without a dedup store.
    POST that inserts a new row each time, appends, or increments are all
    non-idempotent (each retry changes state), so they'd need an idempotency key.
  ref: concepts.md#idempotency-key-design
- id: microservices-ddd-and-boundaries-059
  difficulty: intermediate
  tags:
  - strangler-fig
  - migration
  question: |
    The strangler fig migration pattern is best described as:
  options:
  - A big-bang rewrite in which the entire replacement system is built in parallel and deployed all at once
    on a single planned cutover date, retiring the old monolith overnight
  - Freezing the monolith so no further changes are ever made to it, then building every new capability as
    a separate greenfield product that never talks back to the frozen system
  - Running two byte-for-byte identical copies of the monolith side by side for redundancy, failing traffic
    over between them so the migration never affects availability
  - Incrementally carving functionality out of a legacy monolith into new services behind a routing façade,
    until the monolith can be retired — without a big-bang rewrite
  answer: 3
  explanation: |
    Strangler fig (Fowler) incrementally routes capabilities from the legacy
    system to new implementations behind a façade/proxy, shrinking the monolith
    piece by piece until it's empty. It is explicitly the alternative to a
    big-bang rewrite, not a freeze or a redundancy scheme.
  ref: concepts.md#the-strangler-fig-migration
- id: microservices-ddd-and-boundaries-060
  difficulty: advanced
  tags:
  - strangler-fig
  - parallel-run
  - risk
  question: |
    During a strangler migration, what does a "parallel run" (dark launch)
    accomplish?
  options:
  - It doubles overall throughput by load-balancing live production traffic evenly across the old and new
    implementations, so each handles half the requests and capacity effectively grows
  - It permanently designates both the old and new systems as co-equal sources of truth, reconciling their
    two datasets on a schedule so neither one is ever considered authoritative
  - It removes the need for an anti-corruption layer, because running the new code beside the old one lets
    the legacy model flow into the new services safely without any translation
  - It sends traffic to both old and new implementations and compares outputs, with the old one authoritative
    until the new earns trust — reducing cutover risk
  answer: 3
  explanation: |
    A parallel run executes both implementations and compares results while the
    old remains authoritative, building confidence before cutover — a risk-
    reduction technique, not a throughput or permanent-dual-truth mechanism. An ACL
    is still needed to keep legacy semantics out of the new services.
  ref: concepts.md#the-strangler-fig-migration
- id: microservices-ddd-and-boundaries-061
  difficulty: expert
  tags:
  - strangler-fig
  - big-bang
  - trade-offs
  question: |
    Why is the strangler fig generally preferred over a big-bang rewrite despite
    running two systems during the transition?
  options:
  - Risk is bounded per increment and reversible (flip a flag back), value ships continuously, and you
    learn the real boundaries incrementally instead of guessing them all up front
  - It reaches the finished target architecture sooner and requires substantially less total code overall,
    because there is no transitional façade or dual-write logic to build and later throw away
  - It avoids any data migration entirely, since new services simply keep reading and writing the legacy
    monolith's original tables straight through until the very end
  - It requires no routing, façade, or state-synchronization plumbing, because each extracted capability
    starts serving live traffic in isolation the moment it is deployed
  answer: 0
  explanation: |
    The strangler's advantage is risk profile: small, reversible increments,
    continuous delivery, and discovering real boundaries as you go — versus
    big-bang rewrites that overrun and often never ship. It's slower to "finish"
    and adds routing/dual-write plumbing and incremental data migration; those are
    accepted costs, not things it avoids.
  ref: concepts.md#the-strangler-fig-migration
- id: microservices-ddd-and-boundaries-062
  difficulty: expert
  tags:
  - 2pc
  - saga
  - distributed-transaction
  question: |
    Why is two-phase commit (2PC) avoided for cross-microservice consistency, and
    what replaces it?
  options:
  - 2PC commits far too fast and floods participating services with prepare messages they cannot keep up
    with, so it is replaced by having each service poll the others for state changes instead
  - '2PC blocks — it holds locks and stalls if the coordinator fails, hurting availability — so it''s
    replaced by sagas: sequences of local transactions with compensating transactions'
  - 2PC is only implementable on NoSQL engines that lack real transactions, so across relational services
    it is replaced by pushing the coordination down into ordinary cross-database SQL joins
  - 2PC provides far too little consistency for autonomous services, so it is replaced by pure eventual
    consistency with no compensating actions and no attempt to ever undo a partial failure
  answer: 1
  explanation: |
    2PC is a blocking protocol: participants hold locks awaiting the coordinator,
    and coordinator failure can stall them indefinitely, degrading availability —
    unacceptable across autonomous services. Sagas replace it with per-service
    local transactions plus compensating transactions for rollback, giving eventual
    consistency and atomicity-by-compensation (not zero compensation).
  ref: concepts.md#saga-and-outbox-for-cross-service-consistency
- id: microservices-ddd-and-boundaries-063
  difficulty: advanced
  tags:
  - saga
  - choreography
  - orchestration
  question: |
    For a complex, many-step order-fulfillment flow requiring clear visibility and
    centralized change, which saga style fits and what's its main risk?
  options:
  - Choreography; its risk is that the central orchestrator coordinating every step gradually swells into
    a god-service that all the other participants must bend around
  - Choreography; there is no meaningful risk at all because event-driven choreography is fully decoupled
    and each step reacts independently with nothing to manage centrally
  - Orchestration; risk is the orchestrator becoming a coupling point / god-service that must be managed
  - Neither saga style suits this; reach for a distributed two-phase commit across the services so the whole
    many-step flow commits atomically as one transaction
  answer: 2
  explanation: |
    Orchestration (a central state machine à la Step Functions/Temporal) makes
    complex, many-step flows explicit and observable and easy to change centrally;
    its risk is that the orchestrator becomes a coupling point and can grow into a
    god-service. Choreography suits simple flows but makes complex ones implicit and
    hard to follow; 2PC is avoided across services.
  ref: concepts.md#saga-and-outbox-for-cross-service-consistency
- id: microservices-ddd-and-boundaries-064
  difficulty: expert
  tags:
  - saga
  - isolation
  - anomalies
  question: |
    Sagas lack isolation, so intermediate states are visible to others. Which is a
    legitimate mitigation for the resulting anomalies?
  options:
  - Wrapping the whole multi-service saga in a single distributed ACID transaction so all intermediate
    states stay invisible until the final step commits everything at once
  - Disabling all concurrent access to every participating service for the duration of the saga, so only
    one saga instance can ever be in flight across the system at a time
  - Relying on the message broker to provide serializable isolation across the participating services, so
    it orders and isolates their database writes the way a single database would
  - Semantic locks (e.g. a PENDING/RESERVED status), commutative updates, reordering so the hard-to-compensate
    step is last, and versioning
  answer: 3
  explanation: |
    Because a saga isn't isolated (dirty/fuzzy reads, lost updates are possible),
    you design around it: semantic locks flag in-progress state, commutative
    updates avoid order-dependence, reordering puts the least-compensatable step
    last, and versioning detects conflicts. You can't wrap a cross-service saga in
    one ACID transaction, globally serializing all access is infeasible, and brokers
    don't provide DB isolation.
  ref: concepts.md#saga-and-outbox-for-cross-service-consistency
- id: microservices-ddd-and-boundaries-065
  difficulty: expert
  tags:
  - outbox
  - cdc
  - delivery-guarantee
  question: |
    Using a transactional outbox relayed via CDC (e.g. Debezium tailing the DB
    log), what delivery guarantee do consumers get, and what does that require of
    them?
  options:
  - At-least-once delivery, so consumers must be idempotent (often via an inbox/dedup)
  - Exactly-once delivery, because the CDC relay reads each committed row from the log precisely one time,
    so consumers can safely be written as non-idempotent handlers
  - At-most-once delivery, so a crash between reading the log and publishing silently drops some events,
    and consumers must tolerate occasional permanent gaps in the stream
  - Strictly ordered exactly-once delivery with no consumer-side handling needed, because the database log
    already sequences every change globally before the relay forwards it
  answer: 0
  explanation: |
    The outbox guarantees "event published iff state committed," and the relay
    publishes at-least-once — so duplicates are possible and consumers must be
    idempotent (an inbox pattern dedups). It is not exactly-once delivery (generally
    impossible) and does not silently drop events (that would be at-most-once).
  ref: concepts.md#saga-and-outbox-for-cross-service-consistency
- id: microservices-ddd-and-boundaries-066
  difficulty: advanced
  tags:
  - modular-monolith
  - when-to-use
  - defaults
  question: |
    For a small team building a system with an unclear domain and moderate scale,
    what is the most defensible default architecture and why?
  options:
  - A well-structured modular monolith, because boundaries are cheap to move via refactor, there's no
    ops tax for many services, and you extract services only under proven pressure
  - Full microservices from day one, so you never have to pay for a painful monolith-to-services migration
    later once the domain and traffic have grown
  - A single deploy built as one large script with no internal module boundaries, keeping the codebase
    maximally simple while the team is still small and the requirements are shifting
  - One separately deployed service per database table, so every entity can scale and evolve on its own
    and the architecture stays maximally flexible from the start
  answer: 0
  explanation: |
    With a small team, unclear domain, and moderate scale, a modular monolith wins:
    boundaries are cheap to change (refactor vs network-contract + data migration),
    there's no per-service ops tax, and you extract services when a specific pressure
    appears. Day-one microservices impose the tax before you know the boundaries;
    the other options are strawmen.
  ref: concepts.md#when-a-modular-monolith-beats-microservices
- id: microservices-ddd-and-boundaries-067
  difficulty: expert
  tags:
  - modular-monolith
  - discipline
  - big-ball-of-mud
  question: |
    What is the essential prerequisite for a modular monolith to retain its
    benefits over time?
  options:
  - Committing to split it into separately deployed microservices within six months, since a modular
    monolith is only ever a temporary staging point on the way to a distributed architecture
  - Enforcing module boundaries mechanically (build-time module systems, architecture tests like ArchUnit,
    separate schemas) so they don't rot into a big ball of mud
  - Keeping the entire codebase in a single file so the whole system stays easy to read top to bottom and
    no one has to navigate between modules to follow a request
  - Sharing one common data store freely across every module to reduce duplication, so any module can read
    and write another's tables directly whenever it needs the data
  answer: 1
  explanation: |
    A modular monolith only pays off if boundaries are enforced mechanically;
    otherwise they decay into a big ball of mud and you get neither clean boundaries
    nor independent deploy. It doesn't require becoming microservices, single-file
    code, or shared data (that would destroy the module boundaries).
  ref: concepts.md#when-a-modular-monolith-beats-microservices
- id: microservices-ddd-and-boundaries-068
  difficulty: intermediate
  tags:
  - modular-monolith
  - segment
  - evidence
  question: |
    Segment famously reverted from ~140 microservices back to a monolith (2018).
    What lesson does this best illustrate?
  options:
  - Microservices are always the wrong architectural choice, and any team that adopts them will eventually
    be forced to consolidate back into a single monolith as Segment did
  - Monoliths fundamentally cannot scale to serious production load, which is precisely why Segment had to
    run so many separate services before reversing course
  - Per-service operational overhead can crush a small team, so the number of services should match organizational
    capacity, not fashion
  - Event-driven and asynchronous systems are inherently unreliable and always fail at scale, so Segment's
    reversion proves messaging between services should be avoided entirely
  answer: 2
  explanation: |
    Segment's reversion shows that the operational tax of many services can
    overwhelm a small team — service count should track organizational capacity and
    real need, not trend-following. It doesn't prove microservices are always wrong,
    that monoliths can't scale, or that event-driven systems fail.
  ref: concepts.md#when-a-modular-monolith-beats-microservices
- id: microservices-ddd-and-boundaries-069
  difficulty: advanced
  tags:
  - operational-tax
  - tracing
  - context-propagation
  question: |
    Why is distributed tracing with context propagation (e.g. W3C Trace Context /
    OpenTelemetry) essential in microservices but largely unneeded in a monolith?
  options:
  - Monoliths never produce runtime errors, so there is nothing to trace, whereas distributed services fail
    constantly and therefore require a dedicated tracing system to catch every fault
  - Distributed tracing exists purely to reduce request latency by revealing slow hops, and a monolith is
    already fast enough end to end that measuring its internal timings serves no purpose
  - Monoliths are architecturally unable to emit application logs, so tracing is the only observability
    mechanism available to them, while services can rely on ordinary logging instead
  - A single request now spans many services, so you must propagate trace IDs to reconstruct 'what happened'
    — something a monolith gave you for free in one stack trace
  answer: 3
  explanation: |
    In microservices a request fans out across services, so you propagate trace
    IDs to stitch the spans back into one story — a capability a monolith provided
    implicitly via a single stack trace/log. Tracing is about observability of
    causality, not solely latency; monoliths do produce errors and logs.
  ref: concepts.md#the-operational-tax
- id: microservices-ddd-and-boundaries-070
  difficulty: expert
  tags:
  - operational-tax
  - decision
  - judgment
  question: |
    Which framing of the microservices decision is the most senior?
  options:
  - Adopt microservices by default because they are the modern industry best practice, and staying on a
    monolith signals an engineering culture that has failed to keep up with the state of the art
  - Adopt microservices when the organizational benefit (independent deploy, team autonomy, fault isolation,
    independent scaling) clearly exceeds the operational tax your org can staff and afford
  - Adopt microservices strictly once your system crosses a fixed threshold of one million active users,
    below which a monolith is correct and above which it can no longer possibly cope
  - Avoid microservices entirely under all circumstances, because the operational tax they impose is never
    recovered no matter how large the organization or how many teams need to deploy independently
  answer: 1
  explanation: |
    The staff-level framing weighs the organizational payoff against a real,
    staffable operational tax (tracing, CI/CD, resilience, on-call for N services,
    more infra/cost). It's neither a fashion choice, a fixed user-count threshold,
    nor a blanket rejection — it's a context-dependent cost/benefit judgment.
  ref: concepts.md#the-operational-tax
- id: microservices-ddd-and-boundaries-071
  difficulty: expert
  tags:
  - operational-tax
  - platform
  - scale
  question: |
    Investing in a platform/paved road to amortize the operational tax is sound
    advice with what important caveat?
  options:
  - The platform itself is an investment that only pays off at sufficient scale; for a small org it's
    unaffordable and the tax is naked — another argument for a modular monolith until you're big enough
  - The platform costs essentially nothing to build and maintain, so any organization should stand one up
    immediately regardless of its size, since there is no downside to having it early
  - A well-built platform removes the operational tax completely rather than just amortizing it, so once
    it exists the per-service overhead of tracing, CI/CD, and on-call effectively disappears
  - A paved-road platform only delivers value if every team standardizes on a single programming language
    and runtime, because it cannot abstract infrastructure for a polyglot fleet of services
  answer: 0
  explanation: |
    A platform amortizes the tax across many teams so they don't each rebuild
    tracing/CI/resilience — but it's a real investment that only pays back at
    scale. Below that scale it's unaffordable and the tax is felt directly,
    reinforcing "modular monolith until you're big enough." It reduces, not
    eliminates, the tax, and isn't gated on language uniformity.
  ref: concepts.md#the-operational-tax
- id: microservices-ddd-and-boundaries-072
  difficulty: advanced
  tags:
  - availability-math
  - decoupling
  - resilience
  question: |
    A 10-hop synchronous chain gives ~99.0% end-to-end availability at 99.9% per
    hop. Which change most directly improves end-to-end availability?
  options:
  - Add more automatic retries at each hop with no backoff, so a hop that fails is immediately re-attempted
    several times and the chain almost always eventually succeeds
  - Reduce the number of required synchronous hops (e.g. via async decoupling, read models, or API composition
    in parallel) so fewer dependencies must all succeed at once
  - Increase the request timeout on every hop toward infinity, so a slow dependency is always waited out
    rather than being counted as a failure against end-to-end availability
  - Route all ten hops through a single shared database that every service reads and writes, so the chain
    depends on one highly available store instead of many separate ones
  answer: 1
  explanation: |
    Since required-sequential availability is a^N, cutting N (fewer synchronous
    required hops — async decoupling, precomputed read models, or parallelizing
    independent calls) is the direct lever. Retries without backoff risk storms,
    infinite timeouts convert failures into hangs, and a shared DB reintroduces
    coupling without improving the availability math.
  ref: concepts.md#the-distributed-monolith-anti-pattern
- id: microservices-ddd-and-boundaries-073
  difficulty: intermediate
  tags:
  - distributed-monolith
  - shared-library
  - coupling
  question: |
    Why is a large shared "domain" library that many services depend on a
    distributed-monolith smell?
  options:
  - A shared library inevitably ships latent defects that every dependent service silently inherits
    on each upgrade
  - A shared library cannot be given its own independent version, so every consumer must pin the
    exact build of the publishing service
  - Bumping it tends to force every dependent service to redeploy, coupling their release cycles even
    though they're separate deployables
  - Linking one shared library into many services consumes far more total runtime memory than
    duplicating the code would
  answer: 2
  explanation: |
    When domain logic lives in a shared library, a change to it forces a coordinated
    redeploy of every consumer — reintroducing the lockstep coupling microservices
    are meant to avoid. It's about release-cycle coupling, not inherent bugginess,
    versioning impossibility, or memory.
  ref: concepts.md#the-distributed-monolith-anti-pattern
- id: microservices-ddd-and-boundaries-074
  difficulty: advanced
  tags:
  - saga
  - compensation
  - semantic-undo
  question: |
    A saga step already sent a confirmation email, and a later step fails. What is
    the correct nature of the compensating action?
  options:
  - Replay the broker's transaction log in reverse to atomically roll back the already-delivered
    confirmation email as if it had never been sent
  - Issue a distributed 2PC transaction against the mail server to delete the confirmation email
    from the recipient's inbox before they read it
  - Do nothing, because sagas have no mechanism to compensate external side effects once a step has
    committed its work
  - A semantic (business) undo — e.g. send a cancellation/apology email — since you cannot un-send the
    email; compensations must also be idempotent
  answer: 3
  explanation: |
    Real-world side effects can't be literally reversed, so saga compensations are
    *semantic* undos (send an apology/cancellation) and must be idempotent (they may
    be retried). You can't un-send an email via a log or 2PC, and sagas absolutely do
    compensate — that's their core mechanism.
  ref: concepts.md#saga-and-outbox-for-cross-service-consistency
