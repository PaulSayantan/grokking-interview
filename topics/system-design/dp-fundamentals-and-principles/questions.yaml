topic: "Design Patterns: Fundamentals & Principles"
domain: system-design
topic_slug: dp-fundamentals-and-principles
version: 1
questions:
  - id: dp-fundamentals-and-principles-001
    difficulty: beginner
    tags: [meta, definition, pattern-vs-algorithm]
    question: |
      Which statement best captures what a design pattern is?
    options:
      - "A fixed step-by-step recipe guaranteed to produce identical steps every run"
      - "A named, reusable blueprint for a recurring design problem that you adapt to context"
      - "A language-specific code snippet you copy and paste unchanged"
      - "A compiler optimization applied automatically to object-oriented code"
    answer: 1
    explanation: |
      A design pattern is a named, reusable description of a solution to a recurring design
      problem — a blueprint you adapt, not copy-paste code. It is defined by name, problem,
      solution, and consequences. An algorithm (option 0) is a fixed recipe; a pattern is
      instantiated differently each time.
    ref: "concepts.md#what-is-a-design-pattern"

  - id: dp-fundamentals-and-principles-002
    difficulty: intermediate
    tags: [meta, pattern-vs-algorithm]
    question: |
      An interviewer asks how a design pattern differs from an algorithm. What is the sharpest
      distinction?
    options:
      - "Algorithms are object-oriented; patterns are procedural"
      - "Patterns are always faster than algorithms at runtime"
      - "An algorithm is a fixed sequence of steps; a pattern is a higher-level structure of collaborating objects realized differently each time"
      - "There is no real difference; the terms are interchangeable"
    answer: 2
    explanation: |
      An algorithm defines concrete computational steps (a deterministic recipe like quicksort).
      A pattern describes how objects are arranged and collaborate to solve a design problem,
      saying nothing about exact steps and yielding different code each time it is applied.
    ref: "concepts.md#what-is-a-design-pattern"

  - id: dp-fundamentals-and-principles-003
    difficulty: beginner
    tags: [history, gof, origins]
    question: |
      Who authored the 1994 book "Design Patterns: Elements of Reusable Object-Oriented Software"
      that catalogued 23 patterns?
    options:
      - "Martin Fowler and Kent Beck"
      - "Christopher Alexander alone"
      - "Robert C. Martin and Barbara Liskov"
      - "Gamma, Helm, Johnson, and Vlissides (the Gang of Four)"
    answer: 3
    explanation: |
      The "Gang of Four" — Erich Gamma, Richard Helm, Ralph Johnson, and John Vlissides — wrote
      the 1994 GoF book cataloguing 23 patterns. The pattern idea itself came from architect
      Christopher Alexander; Fowler (PoEAA) and Martin (SOLID) came later.
    ref: "concepts.md#history--origins"

  - id: dp-fundamentals-and-principles-004
    difficulty: intermediate
    tags: [history, catalogs, scope]
    question: |
      Why is it a category error to cite "Circuit Breaker" as a Gang of Four pattern?
    options:
      - "Circuit Breaker was invented before the GoF book"
      - "Circuit Breaker is a creational pattern, not behavioral"
      - "Circuit Breaker is a cloud/distributed-systems pattern from later catalogs, not one of the 23 GoF OO design patterns"
      - "The GoF book has no patterns dealing with failure"
    answer: 2
    explanation: |
      The 23 GoF patterns are general-purpose OO class/object patterns. Circuit Breaker is a
      distributed/cloud resilience pattern (Azure/Nygard/microservices catalogs) operating at a
      larger scale over networks. Mixing the catalogs signals a scope confusion.
    ref: "concepts.md#history--origins"

  - id: dp-fundamentals-and-principles-005
    difficulty: beginner
    tags: [gof, categories]
    question: |
      The Gang of Four classify their 23 patterns into which three categories by purpose?
    options:
      - "Creational, Structural, Behavioral"
      - "Frontend, Backend, Database"
      - "Simple, Intermediate, Advanced"
      - "Concurrency, Persistence, Distribution"
    answer: 0
    explanation: |
      GoF's primary classification by purpose is Creational (object creation), Structural (object
      composition), and Behavioral (responsibility and communication). Concurrency and persistence
      patterns come from POSA and Fowler's PoEAA, not the GoF categories.
    ref: "concepts.md#the-gof-catalog--3-categories"

  - id: dp-fundamentals-and-principles-006
    difficulty: intermediate
    tags: [gof, categories, classification]
    question: |
      You need to "create families of related objects without naming their concrete classes."
      Which GoF category does this problem fall under?
    options:
      - "Behavioral"
      - "Structural"
      - "Creational"
      - "Concurrency"
    answer: 2
    explanation: |
      Abstracting object creation is the domain of Creational patterns (here, Abstract Factory).
      Structural patterns compose objects; Behavioral patterns govern communication; concurrency
      is not a GoF purpose category.
    ref: "concepts.md#the-gof-catalog--3-categories"

  - id: dp-fundamentals-and-principles-007
    difficulty: advanced
    tags: [gof-template, anatomy, consequences]
    question: |
      In the GoF pattern template, which section captures the trade-offs an interviewer most often
      probes?
    options:
      - "Structure"
      - "Participants"
      - "Known Uses"
      - "Consequences"
    answer: 3
    explanation: |
      "Consequences" documents the pattern's trade-offs (benefits and liabilities) — the part
      interviewers probe most. Structure is the static diagram, Participants are the roles,
      Known Uses are examples. Many junior answers stop at Structure and miss Consequences.
    ref: "concepts.md#anatomy-of-a-pattern-gof-template"

  - id: dp-fundamentals-and-principles-008
    difficulty: advanced
    tags: [gof-template, participants, collaborations]
    question: |
      In the GoF template, what distinguishes "Participants" from "Collaborations"?
    options:
      - "Participants are the roles classes/objects play; Collaborations describe how they interact at runtime to fulfil the intent"
      - "Participants are the runtime interactions; Collaborations are the class names"
      - "They are two names for the same section"
      - "Participants list only interfaces; Collaborations list only concrete classes"
    answer: 0
    explanation: |
      Participants name the roles (e.g. Subject, ConcreteObserver). Collaborations describe the
      dynamic behavior — how those participants interact at runtime to achieve the intent.
      Structure is the static class diagram; the three are complementary, not synonyms.
    ref: "concepts.md#anatomy-of-a-pattern-gof-template"

  - id: dp-fundamentals-and-principles-009
    difficulty: advanced
    tags: [scope, class-vs-object, inheritance, composition]
    question: |
      A Class Adapter uses inheritance while an Object Adapter holds a reference to the adaptee.
      What is the key consequence of this scope difference?
    options:
      - "The Object Adapter is fixed at compile time; the Class Adapter can re-target at runtime"
      - "The Class Adapter can swap the adaptee object at runtime; the Object Adapter cannot"
      - "The Object Adapter can swap the adaptee at runtime (composition); the Class Adapter is fixed at compile time (inheritance)"
      - "There is no behavioral difference; only syntax differs"
    answer: 2
    explanation: |
      Class-scoped patterns rely on inheritance, fixing relationships at compile time. Object-scoped
      patterns use composition/delegation, so the collaborator (adaptee) can be swapped at runtime.
      This is GoF's second classification axis (class vs object scope).
    ref: "concepts.md#two-scoping-axes-class-vs-object-patterns"

  - id: dp-fundamentals-and-principles-010
    difficulty: intermediate
    tags: [abstraction-levels, idiom, architecture]
    question: |
      RAII in C++, the Strategy pattern, and Microservices are examples of, respectively:
    options:
      - "An architectural style, an idiom, and a design pattern"
      - "A language idiom, a design pattern, and an architectural style"
      - "Three design patterns at the same level"
      - "A design pattern, an architectural style, and an idiom"
    answer: 1
    explanation: |
      Abstraction levels: idiom (low, language-specific — RAII), design pattern (mid,
      language-agnostic OO — Strategy), and architectural style (high, system-wide —
      Microservices). Matching the wrong level to a problem is a common mistake.
    ref: "concepts.md#idioms-vs-design-patterns-vs-architectural-styles"

  - id: dp-fundamentals-and-principles-011
    difficulty: intermediate
    tags: [choosing-patterns, refactoring, yagni]
    question: |
      What does "refactor to patterns, don't design from them" advise?
    options:
      - "Introduce a pattern when real duplication or change-pressure appears, not speculatively up front"
      - "Always pick a favorite pattern first, then shape the problem to fit it"
      - "Never use design patterns in production code"
      - "Apply as many patterns as possible from day one to be safe"
    answer: 0
    explanation: |
      Healthy design is problem-first: state the pain, match a pattern's intent, accept the
      trade-off, and introduce the pattern when a real second/third case appears (rule of three).
      Designing pattern-first leads to over-engineering and Golden Hammer.
    ref: "concepts.md#how-to-choose-a-pattern"

  - id: dp-fundamentals-and-principles-012
    difficulty: beginner
    tags: [solid, srp]
    question: |
      The Single Responsibility Principle states that a class should have:
    options:
      - "Only one public method"
      - "No dependencies on other classes"
      - "Exactly one field"
      - "Only one reason to change (be responsible to a single actor)"
    answer: 3
    explanation: |
      SRP says a class should have only one reason to change — it should serve a single actor or
      stakeholder. It is about reasons to change, not literally one method or field.
    ref: "concepts.md#single-responsibility-principle-srp"

  - id: dp-fundamentals-and-principles-013
    difficulty: intermediate
    tags: [solid, srp, isp, vs]
    question: |
      How does SRP differ from the Interface Segregation Principle (ISP)?
    options:
      - "SRP limits a class's reasons to change (server side); ISP keeps clients from depending on methods they don't use (interface side)"
      - "They are identical principles with different names"
      - "SRP applies only to interfaces; ISP applies only to concrete classes"
      - "ISP is about performance; SRP is about security"
    answer: 0
    explanation: |
      Both target cohesion but on different surfaces. SRP constrains a class to one reason to
      change. ISP constrains interfaces so clients aren't forced to depend on methods they don't
      use. Related instinct, different target (class body vs client-facing contract).
    ref: "concepts.md#single-responsibility-principle-srp"

  - id: dp-fundamentals-and-principles-014
    difficulty: intermediate
    tags: [solid, ocp]
    question: |
      An `area()` method uses a growing chain of `if (s instanceof Circle) ... else if (s instanceof
      Rectangle) ...`. Which principle does refactoring to a `Shape` interface with per-shape
      `area()` best satisfy?
    options:
      - "Interface Segregation Principle"
      - "Liskov Substitution Principle"
      - "Open/Closed Principle"
      - "Law of Demeter"
    answer: 2
    explanation: |
      OCP: open for extension, closed for modification. Replacing the type-checking conditional
      with polymorphic `Shape.area()` lets you add a new shape by adding a class, without editing
      the existing method — extension without modification.
    ref: "concepts.md#openclosed-principle-ocp"

  - id: dp-fundamentals-and-principles-015
    difficulty: advanced
    tags: [solid, ocp, yagni, misuse]
    question: |
      What is the main risk of aggressively applying the Open/Closed Principle everywhere?
    options:
      - "It makes code impossible to compile"
      - "Speculative extension points become premature abstraction — indirection for variation that never arrives"
      - "It forces all classes to be final"
      - "It always violates the Liskov Substitution Principle"
    answer: 1
    explanation: |
      OCP is valuable along an axis you know varies. Adding extension seams "to be safe" for
      variation that never comes is premature abstraction (tension with YAGNI): pure indirection
      and maintenance cost with no payoff.
    ref: "concepts.md#openclosed-principle-ocp"

  - id: dp-fundamentals-and-principles-016
    difficulty: intermediate
    tags: [solid, lsp, square-rectangle]
    question: |
      Why does modeling `Square extends Rectangle` classically violate the Liskov Substitution
      Principle?
    options:
      - "Substituting a Square where a Rectangle is expected breaks the contract that width and height can be set independently"
      - "A Square has fewer fields than a Rectangle"
      - "Squares cannot be drawn on screen"
      - "Rectangle is an abstract class and cannot be extended"
    answer: 0
    explanation: |
      LSP requires subtypes to honor the base's contract. Client code expects setWidth/setHeight to
      be independent on a Rectangle; a Square forces them equal, producing wrong results when
      substituted. Behavioral subtyping, not dictionary "is-a," is what matters.
    ref: "concepts.md#liskov-substitution-principle-lsp"

  - id: dp-fundamentals-and-principles-017
    difficulty: advanced
    tags: [solid, lsp, design-by-contract]
    question: |
      Under design-by-contract, a behaviorally-correct subtype must:
    options:
      - "Not strengthen preconditions, not weaken postconditions, and preserve invariants"
      - "Strengthen preconditions and weaken postconditions"
      - "Override every method of the base class"
      - "Add new preconditions to every inherited method"
    answer: 0
    explanation: |
      LSP tied to design-by-contract: a subtype must not demand more (no stronger preconditions),
      must not promise less (no weaker postconditions), and must preserve the base's invariants.
      Otherwise substitution breaks callers written against the base type.
    ref: "concepts.md#liskov-substitution-principle-lsp"

  - id: dp-fundamentals-and-principles-018
    difficulty: intermediate
    tags: [solid, isp]
    question: |
      A `SimplePrinter` implementing a fat `Machine { print(); scan(); fax(); }` interface must
      throw `UnsupportedOperationException` for scan and fax. Which principle does splitting
      `Machine` into `Printer`, `Scanner`, `Fax` satisfy?
    options:
      - "Dependency Inversion Principle"
      - "Single Responsibility Principle"
      - "Interface Segregation Principle"
      - "Open/Closed Principle"
    answer: 2
    explanation: |
      ISP: no client should be forced to depend on methods it doesn't use. Segregating the fat
      interface into role-specific ones removes the "throw UnsupportedOperation" stubs and lets
      each implementer implement only what applies.
    ref: "concepts.md#interface-segregation-principle-isp"

  - id: dp-fundamentals-and-principles-019
    difficulty: beginner
    tags: [solid, dip]
    question: |
      The Dependency Inversion Principle says high-level modules and low-level modules should:
    options:
      - "Both depend on abstractions, not on each other's concrete details"
      - "Be merged into a single class for simplicity"
      - "High-level modules should directly instantiate low-level ones"
      - "Never communicate at all"
    answer: 0
    explanation: |
      DIP: high-level and low-level modules should both depend on abstractions; abstractions should
      not depend on details, details should depend on abstractions. This inverts the usual arrow so
      policy is decoupled from volatile detail and becomes testable/swappable.
    ref: "concepts.md#dependency-inversion-principle-dip"

  - id: dp-fundamentals-and-principles-020
    difficulty: advanced
    tags: [dip, di, ioc, vs]
    question: |
      Which correctly distinguishes DIP, Dependency Injection (DI), and Inversion of Control (IoC)?
    options:
      - "They are three names for the same thing"
      - "DIP is a DI container; DI is a principle; IoC is a design pattern"
      - "DIP is a principle (depend on abstractions); DI is a technique for supplying dependencies; IoC is the broad idea that the framework calls your code"
      - "IoC is a principle; DIP is a container; DI is an algorithm"
    answer: 2
    explanation: |
      DIP is the SOLID principle. DI (constructor/setter/interface injection) is one technique to
      follow it. IoC is the broad "Hollywood principle" that the runtime calls your code; a DI
      container automates DI. You can satisfy DIP with plain constructor injection — no container.
    ref: "concepts.md#dependency-inversion-principle-dip"

  - id: dp-fundamentals-and-principles-021
    difficulty: intermediate
    tags: [dry, abstraction, wet]
    question: |
      Which statement best reflects a mature understanding of DRY?
    options:
      - "Any two lines of code that look alike must always be merged into one function"
      - "DRY means never writing more than one class per file"
      - "DRY targets duplicated knowledge; a wrong abstraction can be worse than duplication, so beware accidental duplication"
      - "DRY only applies to test code"
    answer: 2
    explanation: |
      DRY is about a single authoritative representation of each piece of knowledge — not textual
      similarity. Merging code that only looks alike but represents different, independently
      evolving knowledge (accidental duplication) couples unrelated code; a wrong abstraction is
      worse than duplication. Prefer the rule of three.
    ref: "concepts.md#dry-dont-repeat-yourself"

  - id: dp-fundamentals-and-principles-022
    difficulty: beginner
    tags: [kiss, simplicity]
    question: |
      A config with three known keys is implemented with a reflection-driven, hot-reloading plugin
      engine. Which principle is most clearly violated?
    options:
      - "KISS (Keep It Simple)"
      - "Liskov Substitution Principle"
      - "Interface Segregation Principle"
      - "Law of Demeter"
    answer: 0
    explanation: |
      KISS favors the simplest design that meets actual requirements. A plain record with three
      fields suffices; the elaborate engine adds needless complexity, bug surface, and onboarding
      cost. Reach for the engine only if requirements demand it.
    ref: "concepts.md#kiss-keep-it-simple"

  - id: dp-fundamentals-and-principles-023
    difficulty: intermediate
    tags: [yagni, ocp, tension]
    question: |
      You are asked to export CSV. A teammate wants to build a pluggable Export Strategy for
      CSV/PDF/XML/Parquet "since we might add formats." Which principle argues against doing that
      now?
    options:
      - "YAGNI (You Aren't Gonna Need It)"
      - "Open/Closed Principle"
      - "Dependency Inversion Principle"
      - "Single Responsibility Principle"
    answer: 0
    explanation: |
      YAGNI: implement capability only when actually needed, not when merely foreseen. Ship CSV;
      refactor to Strategy when a second format is really requested. This is the classic YAGNI–OCP
      tension, resolved by evidence (a real second case), not speculation.
    ref: "concepts.md#yagni-you-arent-gonna-need-it"

  - id: dp-fundamentals-and-principles-024
    difficulty: intermediate
    tags: [soc, srp, layers, vs]
    question: |
      How does Separation of Concerns relate to the Single Responsibility Principle?
    options:
      - "They are unrelated principles"
      - "SoC is SRP applied only to interfaces"
      - "SoC is the coarse-grained, module/layer-level version of the same idea SRP expresses at the class level"
      - "SRP applies to distributed systems; SoC applies only to single functions"
    answer: 2
    explanation: |
      Separation of Concerns partitions a system so each part addresses a distinct concern at the
      module/layer level (layered architecture, MVC, hexagonal). SRP is that same instinct applied
      to a single class. SRP is SoC at class granularity.
    ref: "concepts.md#separation-of-concerns"

  - id: dp-fundamentals-and-principles-025
    difficulty: advanced
    tags: [law-of-demeter, fluent, vs]
    question: |
      Why is a builder chain like `builder.a().b().c()` NOT a Law of Demeter violation?
    options:
      - "Because each call returns the same object (this), rather than reaching into different foreign objects' internals"
      - "Because builders are exempt from all design principles"
      - "Because the Law of Demeter only applies to static methods"
      - "Because chaining is always forbidden, so it can't violate a specific rule"
    answer: 0
    explanation: |
      LoD forbids reaching into the internals of distant, foreign objects (train wrecks like
      a.getB().getC().doX()). A fluent builder returns `this` each call, so you keep talking to the
      same friend by design — not a LoD violation.
    ref: "concepts.md#law-of-demeter-principle-of-least-knowledge"

  - id: dp-fundamentals-and-principles-026
    difficulty: intermediate
    tags: [law-of-demeter, tell-dont-ask]
    question: |
      Replacing `order.getCustomer().getWallet().deduct(amount)` with `order.charge(amount)` is an
      application of which principle?
    options:
      - "Open/Closed Principle"
      - "Interface Segregation Principle"
      - "Prototype pattern"
      - "Law of Demeter (talk only to immediate friends; tell, don't ask)"
    answer: 3
    explanation: |
      The Law of Demeter says a method should only talk to immediate friends (its fields,
      parameters, objects it creates, this). Adding `order.charge(amount)` hides the internal
      navigation and reduces coupling — "tell, don't ask."
    ref: "concepts.md#law-of-demeter-principle-of-least-knowledge"

  - id: dp-fundamentals-and-principles-027
    difficulty: intermediate
    tags: [composition-over-inheritance, fragile-base-class]
    question: |
      "Favor composition over inheritance" primarily helps avoid which set of problems?
    options:
      - "Slow compilation and large binaries"
      - "Memory leaks and dangling pointers"
      - "Network latency and packet loss"
      - "Fragile base class, rigid compile-time behavior, and combinatorial subclass explosion"
    answer: 3
    explanation: |
      Deep inheritance is rigid (behavior fixed at compile time), suffers fragile base class (a
      base change breaks subclasses), and explodes into N×M subclasses when behavior varies on
      multiple axes. Composition (has-a, delegation) lets behavior be assembled and swapped at
      runtime — the basis of Strategy/Decorator/Bridge.
    ref: "concepts.md#composition-over-inheritance"

  - id: dp-fundamentals-and-principles-028
    difficulty: intermediate
    tags: [program-to-interface, dip, vs]
    question: |
      "Program to an interface, not an implementation" and DIP are related but distinct. Which
      description is accurate?
    options:
      - "They are the same formal SOLID principle"
      - "Programming to an interface is a practical design guideline; DIP is the formal principle about which layer owns the abstraction and inverting the dependency arrow"
      - "DIP is a coding style; programming to an interface is an architectural style"
      - "Neither has anything to do with substitutability"
    answer: 1
    explanation: |
      Programming to an interface is a practical guideline: declare variables/parameters by
      abstract type so any implementation can be supplied. DIP is the formal principle about
      ownership of abstractions and inverting the policy-to-detail dependency. The former supports
      the latter but they are not identical.
    ref: "concepts.md#program-to-an-interface-not-an-implementation"

  - id: dp-fundamentals-and-principles-029
    difficulty: advanced
    tags: [encapsulate-what-varies, meta-principle, strategy]
    question: |
      "Identify the aspects that vary and separate them from what stays the same" is the
      meta-principle behind which patterns?
    options:
      - "Only Singleton"
      - "Only structural patterns"
      - "Strategy, Factory, Bridge, Observer (they encapsulate a varying algorithm, creation, implementation, or listener set)"
      - "None — it contradicts the GoF patterns"
    answer: 2
    explanation: |
      "Encapsulate what varies" isolates volatile behavior behind a stable interface. It underlies
      Strategy (varying algorithm), Factory (varying creation), Bridge (varying implementation
      dimension), and Observer (varying set of listeners). The risk is guessing the wrong axis.
    ref: "concepts.md#encapsulate-what-varies"

  - id: dp-fundamentals-and-principles-030
    difficulty: intermediate
    tags: [coupling, cohesion]
    question: |
      What is the design goal expressed by "coupling" and "cohesion"?
    options:
      - "High coupling and high cohesion"
      - "Loose coupling and high cohesion"
      - "Zero coupling and zero cohesion"
      - "High coupling and low cohesion"
    answer: 1
    explanation: |
      Aim for loose coupling (low interdependence between modules) and high cohesion (elements
      within a module strongly belong together). Zero coupling is impossible since modules must
      collaborate; the goal is loose, not none.
    ref: "concepts.md#coupling-vs-cohesion"

  - id: dp-fundamentals-and-principles-031
    difficulty: advanced
    tags: [coupling, types]
    question: |
      Ordering coupling from loosest (best) to tightest (worst), which sequence is correct?
    options:
      - "Content, common, control, stamp, data"
      - "Data, control, stamp, content, common"
      - "Common, content, data, stamp, control"
      - "Data, stamp, control, common, content"
    answer: 3
    explanation: |
      Coupling degrees from best to worst: data → stamp → control → common → content. Data coupling
      (passing simple parameters) is loosest; content coupling (one module reaching into another's
      internals) is the tightest and worst.
    ref: "concepts.md#coupling-vs-cohesion"

  - id: dp-fundamentals-and-principles-032
    difficulty: intermediate
    tags: [grasp, information-expert]
    question: |
      To compute an order's total, GRASP's Information Expert says the method should live on:
    options:
      - "A separate UI controller"
      - "The Order class, because it holds the line items (the information needed)"
      - "A global utility class"
      - "The database access layer"
    answer: 1
    explanation: |
      Information Expert assigns a responsibility to the class that has the information needed to
      fulfil it. Order holds the line items, so `total()` belongs on Order — keeping cohesion high
      and coupling low, instead of a service reaching into Order for its data.
    ref: "concepts.md#grasp-principles-larman"

  - id: dp-fundamentals-and-principles-033
    difficulty: advanced
    tags: [grasp, solid, vs, protected-variations]
    question: |
      Which GRASP principle is essentially the general form of OCP / "encapsulate what varies"?
    options:
      - "Creator"
      - "Controller"
      - "Protected Variations"
      - "Information Expert"
    answer: 2
    explanation: |
      Protected Variations wraps predicted points of variation behind a stable interface — the
      general responsibility-assignment principle behind OCP and "encapsulate what varies." GRASP
      answers "where does responsibility go?"; SOLID describes class-design qualities.
    ref: "concepts.md#grasp-principles-larman"

  - id: dp-fundamentals-and-principles-034
    difficulty: beginner
    tags: [anti-pattern, god-object, srp]
    question: |
      A single 4,000-line `ApplicationManager` class handles users, orders, payments, email,
      logging, and config. This is which anti-pattern?
    options:
      - "Golden Hammer"
      - "Spaghetti code"
      - "God Object (Blob)"
      - "Anemic Domain Model"
    answer: 2
    explanation: |
      The God Object (Blob) is one oversized class that knows and does everything, violating SRP
      and cohesion. The fix is to extract cohesive classes (SRP) and assign responsibility via
      GRASP Information Expert.
    ref: "concepts.md#god-object--god-class-blob"

  - id: dp-fundamentals-and-principles-035
    difficulty: intermediate
    tags: [anti-pattern, spaghetti, lasagna]
    question: |
      "Lasagna code" is characterized by, and contrasts with spaghetti code because:
    options:
      - "It has too many rigid layers (over-structuring), the opposite of spaghetti's lack of structure"
      - "It has no structure at all, exactly like spaghetti code"
      - "It refers to duplicated code across files"
      - "It is a synonym for the God Object"
    answer: 0
    explanation: |
      Spaghetti code has no discernible structure (tangled control flow). Lasagna code is the
      opposite failure — too many rigid layers adding pass-through code without value. The healthy
      middle is appropriate, cohesive structure.
    ref: "concepts.md#spaghetti-code"

  - id: dp-fundamentals-and-principles-036
    difficulty: intermediate
    tags: [anti-pattern, golden-hammer]
    question: |
      Forcing every class through a Singleton "for easy access" and modeling every problem as a
      graph because the team just learned graph databases both illustrate:
    options:
      - "The Golden Hammer anti-pattern (over-applying one familiar tool to every problem)"
      - "Correct application of DRY"
      - "The Liskov Substitution Principle"
      - "Proper use of the Strategy pattern"
    answer: 0
    explanation: |
      Golden Hammer is solution-first thinking: over-applying a familiar tool/pattern regardless of
      fit. The cure is problem-first selection (problem → intent → trade-off) and a broad toolkit,
      including the willingness to use no pattern at all.
    ref: "concepts.md#golden-hammer"

  - id: dp-fundamentals-and-principles-037
    difficulty: advanced
    tags: [anti-pattern, speculative-generality, yagni]
    question: |
      An app has exactly one repository and no roadmap for more, yet ships an
      `AbstractRepositoryFactoryProvider` hierarchy. This is best described as:
    options:
      - "Good adherence to the Open/Closed Principle"
      - "The Repository pattern applied correctly"
      - "Premature abstraction / speculative generality (violating YAGNI and KISS)"
      - "A necessary use of Abstract Factory"
    answer: 2
    explanation: |
      Premature abstraction (Fowler's "speculative generality") builds extension points before any
      demonstrated need — an abstract hierarchy with a single subclass. It adds indirection and
      carrying cost with no payoff. Delete it; refactor to a pattern when a real second case appears.
    ref: "concepts.md#premature-abstraction--over-engineering"

  - id: dp-fundamentals-and-principles-038
    difficulty: intermediate
    tags: [anti-pattern, patternitis, cost-of-patterns]
    question: |
      Routing a trivial "Hello World" through a GreetingFactory, GreetingStrategy, GreetingCommand,
      and GreetingObserver best illustrates which anti-pattern, and what is the key lesson?
    options:
      - "DRY violation; the lesson is to duplicate more"
      - "Golden Hammer; the lesson is to always use more frameworks"
      - "God Object; the lesson is to centralize everything"
      - "Pattern overuse (patternitis); the lesson is that patterns cost indirection and are means, not ends"
    answer: 3
    explanation: |
      Patternitis applies patterns for their own sake, piling indirection without removing pain.
      The honest point: every pattern costs indirection, so introduce one only when the flexibility
      it buys is worth that cost now. Fewer well-chosen patterns beat many decorative ones.
    ref: "concepts.md#pattern-overuse-patternitis"

  - id: dp-fundamentals-and-principles-039
    difficulty: advanced
    tags: [anti-pattern, anemic-domain-model, fowler]
    question: |
      Domain objects that hold only data (getters/setters) while all behavior sits in "service"
      classes exemplify which anti-pattern, per Fowler?
    options:
      - "Big Ball of Mud"
      - "Yo-yo problem"
      - "Cargo-cult programming"
      - "Anemic Domain Model"
    answer: 3
    explanation: |
      The Anemic Domain Model (Fowler) has domain objects stripped of behavior, with logic in
      procedural services. The fix is to move behavior onto the domain (Information Expert / rich
      Domain Model). Note: for genuinely simple logic, a Transaction Script style can be legitimate.
    ref: "concepts.md#other-named-anti-patterns"

  - id: dp-fundamentals-and-principles-040
    difficulty: intermediate
    tags: [anti-pattern, circular-dependency, dip]
    question: |
      Package A imports B, and B imports A. What is a standard way to break this circular
      dependency?
    options:
      - "Merge A and B into one giant package"
      - "Introduce an interface/abstraction (apply DIP) so one side depends on an abstraction, breaking the cycle"
      - "Delete both packages"
      - "Add a third package that also imports both"
    answer: 1
    explanation: |
      A circular dependency (A→B→A) is broken by inverting one direction with an interface (DIP),
      introducing a mediator, or otherwise decoupling the cycle. Merging or adding more mutual
      imports worsens coupling.
    ref: "concepts.md#other-named-anti-patterns"

  - id: dp-fundamentals-and-principles-041
    difficulty: beginner
    tags: [creational, catalog, singleton]
    question: |
      Which of the following is one of the five GoF creational patterns?
    options:
      - "Decorator"
      - "Observer"
      - "Abstract Factory"
      - "Mediator"
    answer: 2
    explanation: |
      The GoF creational patterns are Singleton, Factory Method, Abstract Factory, Builder, and
      Prototype. Decorator is structural; Observer and Mediator are behavioral.
    ref: "concepts.md#creational-patterns-map-e1"

  - id: dp-fundamentals-and-principles-042
    difficulty: advanced
    tags: [creational, singleton, monostate, vs]
    question: |
      How does the Monostate pattern differ from a Singleton?
    options:
      - "Monostate allows exactly one instance; Singleton allows many"
      - "They are identical"
      - "Monostate lets many instances exist but they all share the same (static) state; Singleton restricts to one instance with a global access point"
      - "Monostate is a structural pattern; Singleton is behavioral"
    answer: 2
    explanation: |
      Singleton ensures a single instance plus a global access point. Monostate permits many
      instances but backs them all with shared static state, so they behave as one. Both risk
      global-state misuse (hurting testability and coupling).
    ref: "concepts.md#creational-patterns-map-e1"

  - id: dp-fundamentals-and-principles-043
    difficulty: advanced
    tags: [structural, adapter, decorator, proxy, facade, vs]
    question: |
      Four wrapping patterns are compared. Which mapping of intent is correct?
    options:
      - "Adapter simplifies a subsystem; Facade converts an interface; Proxy adds behavior; Decorator controls access"
      - "Adapter converts an interface; Decorator adds behavior (same interface); Proxy controls access (same interface); Facade simplifies a subsystem"
      - "All four have identical intent and differ only in name"
      - "Decorator converts an interface; Proxy simplifies a subsystem; Adapter adds behavior; Facade controls access"
    answer: 1
    explanation: |
      The classic structural-cluster distinction by intent: Adapter changes/converts an interface;
      Decorator adds responsibilities while keeping the interface; Proxy controls access while
      keeping the interface; Facade provides a simplified interface to a complex subsystem.
    ref: "concepts.md#structural-patterns-map-e2"

  - id: dp-fundamentals-and-principles-044
    difficulty: intermediate
    tags: [structural, bridge, adapter, vs]
    question: |
      What is the key intent difference between Bridge and Adapter?
    options:
      - "Bridge is designed up front to let an abstraction and its implementation vary independently; Adapter reconciles interfaces after the fact"
      - "They are identical patterns"
      - "Adapter is creational; Bridge is behavioral"
      - "Bridge can only be used with inheritance; Adapter only with composition"
    answer: 0
    explanation: |
      Bridge is planned in advance to decouple an abstraction from its implementation so both can
      vary independently. Adapter is typically applied after the fact to make an existing,
      incompatible interface work with a client that expects a different one.
    ref: "concepts.md#structural-patterns-map-e2"

  - id: dp-fundamentals-and-principles-045
    difficulty: advanced
    tags: [behavioral, state, strategy, vs]
    question: |
      State and Strategy share almost the same class diagram. What is the true difference in intent?
    options:
      - "State is creational; Strategy is structural"
      - "Strategy objects transition between themselves; State objects never change"
      - "There is no difference; they are the same pattern"
      - "State objects know about and trigger transitions between each other; Strategy objects are independent, interchangeable algorithms selected by the client"
    answer: 3
    explanation: |
      Same structure, different intent. In State, the objects represent states that know about and
      trigger transitions to one another as internal state changes. In Strategy, the algorithms are
      independent and interchangeable, chosen by the client, unaware of one another.
    ref: "concepts.md#behavioral-patterns-map-e3"

  - id: dp-fundamentals-and-principles-046
    difficulty: advanced
    tags: [behavioral, template-method, strategy, vs]
    question: |
      Template Method and Strategy both let you vary a step of an algorithm. How do they differ
      mechanically?
    options:
      - "Template Method uses composition; Strategy uses inheritance"
      - "Template Method varies steps via inheritance (subclass overrides); Strategy varies behavior via composition (interchangeable objects)"
      - "Both use only static methods"
      - "Strategy fixes the algorithm skeleton; Template Method makes algorithms interchangeable"
    answer: 1
    explanation: |
      Template Method fixes an algorithm skeleton in a base class and lets subclasses override
      specific steps (inheritance). Strategy encapsulates interchangeable algorithms as objects
      composed into the context (composition). Same goal, inheritance vs composition.
    ref: "concepts.md#behavioral-patterns-map-e3"

  - id: dp-fundamentals-and-principles-047
    difficulty: intermediate
    tags: [behavioral, command, strategy, vs]
    question: |
      What best distinguishes Command from Strategy?
    options:
      - "Command encapsulates a request/action as an object (enabling queueing, logging, undo); Strategy encapsulates an interchangeable algorithm"
      - "They are identical patterns"
      - "Strategy supports undo; Command does not"
      - "Command is creational; Strategy is structural"
    answer: 0
    explanation: |
      Command turns a request into an object so it can be queued, logged, parameterized, and undone.
      Strategy encapsulates a family of interchangeable algorithms selected by the client. The
      framing differs: action-object vs algorithm-object.
    ref: "concepts.md#behavioral-patterns-map-e3"

  - id: dp-fundamentals-and-principles-048
    difficulty: advanced
    tags: [behavioral, observer, mediator, pubsub, vs]
    question: |
      An interviewer asks how Observer differs from a Publish/Subscribe (message broker) approach.
      Which is the most accurate distinction?
    options:
      - "Observer requires a message broker; Pub/Sub is always in-process"
      - "In Observer the subject notifies its observers directly; in broker-based Pub/Sub publishers and subscribers are decoupled through an intermediary and typically don't know each other"
      - "They are the same; there is no difference"
      - "Observer is a creational pattern; Pub/Sub is structural"
    answer: 1
    explanation: |
      In the GoF Observer, the subject holds references to its observers and notifies them directly.
      Broker-based Pub/Sub inserts an intermediary (message broker/event bus) so publishers and
      subscribers are fully decoupled and usually unaware of each other.
    ref: "concepts.md#behavioral-patterns-map-e3"

  - id: dp-fundamentals-and-principles-049
    difficulty: advanced
    tags: [concurrency, double-checked-locking, gotcha]
    question: |
      What is the well-known gotcha with the Double-Checked Locking concurrency pattern for lazy
      initialization?
    options:
      - "It only works in single-threaded programs"
      - "Without a memory-visibility guarantee (e.g. a `volatile` field), another thread may observe a partially-constructed object"
      - "It always deadlocks"
      - "It requires a database transaction"
    answer: 1
    explanation: |
      Double-Checked Locking reduces locking overhead on lazy init, but without proper
      memory-visibility semantics (marking the field `volatile` in Java, for example) a thread can
      see a partially-initialized instance due to reordering. It is a subtle, easily-broken pattern.
    ref: "concepts.md#concurrency-patterns-map-e4"

  - id: dp-fundamentals-and-principles-050
    difficulty: intermediate
    tags: [concurrency, active-object, thread-pool]
    question: |
      Which concurrency pattern decouples method invocation from method execution by turning each
      call into a request placed on a queue served by its own thread?
    options:
      - "Read-Write Lock"
      - "Immutable Object"
      - "Guarded Suspension"
      - "Active Object"
    answer: 3
    explanation: |
      Active Object decouples invocation from execution: each method call becomes a request on a
      queue that a dedicated thread processes, so callers don't block on the actual work. It is a
      POSA concurrency pattern; deep resilience overlaps live in resilience-tradeoffs-deep-dive.
    ref: "concepts.md#concurrency-patterns-map-e4"

  - id: dp-fundamentals-and-principles-051
    difficulty: advanced
    tags: [enterprise, active-record, data-mapper, vs, poeaa]
    question: |
      In Fowler's PoEAA, what distinguishes Active Record from Data Mapper?
    options:
      - "Active Record uses NoSQL; Data Mapper uses SQL"
      - "In Active Record the domain object knows how to persist itself; with Data Mapper a separate mapper keeps the domain oblivious to the database"
      - "They are the same pattern under different names"
      - "Data Mapper stores objects in memory only; Active Record uses disk"
    answer: 1
    explanation: |
      Active Record combines data and persistence in the domain object itself (it knows how to
      save/load). Data Mapper separates the two: a mapper layer moves data between objects and the
      database, keeping the domain model persistence-ignorant.
    ref: "concepts.md#enterprise--persistence-patterns-map-e5"

  - id: dp-fundamentals-and-principles-052
    difficulty: advanced
    tags: [enterprise, dto, value-object, vs, poeaa]
    question: |
      How do a DTO and a Value Object differ?
    options:
      - "A DTO is a behavior-rich domain entity; a Value Object is a database row"
      - "They are identical concepts"
      - "A DTO is a flat data carrier across a boundary (no behavior); a Value Object is an immutable domain concept with equality by value"
      - "A Value Object always has an identity/ID; a DTO never carries data"
    answer: 2
    explanation: |
      A Data Transfer Object is a flat carrier used to move data across a process/network boundary
      with little or no behavior. A Value Object is an immutable domain concept compared by value
      (e.g. Money), not by identity. Different purposes, often confused.
    ref: "concepts.md#enterprise--persistence-patterns-map-e5"

  - id: dp-fundamentals-and-principles-053
    difficulty: intermediate
    tags: [distributed, boundary, cross-reference]
    question: |
      In this topic family, the Saga, CQRS, and Event Sourcing patterns are catalogued in the
      distributed/cloud map but their deep whiteboard treatment is intentionally located where?
    options:
      - "Inside this fundamentals topic, fully re-taught"
      - "In the dedicated deep-dive topic event-driven-cqrs-saga-cdc (cross-referenced, not duplicated)"
      - "Nowhere; they are not covered anywhere"
      - "Only in the creational patterns family"
    answer: 1
    explanation: |
      The distributed/cloud map here is a directory for completeness. CQRS, Event Sourcing, Saga,
      and CDC are deep-dived in event-driven-cqrs-saga-cdc; resilience patterns in
      resilience-tradeoffs-deep-dive; decomposition in the microservices-* topics. This topic
      cross-references rather than duplicating them.
    ref: "concepts.md#distributed--cloud-patterns-map-e6"

  - id: dp-fundamentals-and-principles-054
    difficulty: intermediate
    tags: [distributed, resilience, cross-reference]
    question: |
      Circuit Breaker, Retry, Bulkhead, and Throttling appear in the cloud pattern map here. For
      their trade-off/scenario deep-dive, which sibling topic should a learner consult?
    options:
      - "dp-creational"
      - "resilience-tradeoffs-deep-dive"
      - "grasp-principles-larman"
      - "the-gof-catalog--3-categories"
    answer: 1
    explanation: |
      These are resilience patterns for partial-failure handling. The fundamentals topic catalogues
      them for completeness but points to resilience-tradeoffs-deep-dive for the deep trade-off and
      scenario treatment, avoiding duplication.
    ref: "concepts.md#distributed--cloud-patterns-map-e6"

  - id: dp-fundamentals-and-principles-055
    difficulty: expert
    tags: [scenario, selection, strategy]
    question: |
      Your checkout code has a spreading `if (provider == "stripe") ... else if (provider ==
      "paypal") ...` after adding a second payment provider, and a third is scheduled this quarter.
      Which principle-and-pattern move is most appropriate now?
    options:
      - "Leave the conditional; adding patterns always over-engineers"
      - "Encapsulate the varying provider behavior behind an interface (encapsulate what varies) and introduce Strategy/Factory — the second real case justifies the seam"
      - "Convert the class into a Singleton for global access"
      - "Merge all providers into one God Object for convenience"
    answer: 1
    explanation: |
      The second concrete case (and a firmly scheduled third) is exactly the evidence that resolves
      the YAGNI–OCP tension: encapsulate what varies (provider behavior) behind an interface and
      introduce Strategy/Factory. This removes real duplication rather than speculating.
    ref: "concepts.md#encapsulate-what-varies"

  - id: dp-fundamentals-and-principles-056
    difficulty: expert
    tags: [scenario, lsp, design]
    question: |
      A `PenguinsBird` subclass throws in its inherited `fly()` method and callers must add
      `if (bird instanceof PenguinsBird)` checks. Which principle is violated, and what is the
      cleaner fix?
    options:
      - "DRY; merge all bird classes into one"
      - "Liskov Substitution Principle; restructure so flightless birds don't inherit a fly() contract they can't honor (e.g. separate Flyable abstraction)"
      - "KISS; delete the Bird hierarchy entirely"
      - "Interface Segregation Principle is satisfied, so nothing needs changing"
    answer: 1
    explanation: |
      Throwing from an inherited method and forcing instanceof checks is a classic LSP violation:
      the subtype cannot honor the base contract. The fix is to model by substitutable behavior —
      e.g. a separate Flyable/Movable abstraction — rather than the dictionary "a penguin is a bird."
    ref: "concepts.md#liskov-substitution-principle-lsp"
