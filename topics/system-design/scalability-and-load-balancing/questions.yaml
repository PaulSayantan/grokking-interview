topic: "Scalability and Load Balancing"
domain: system-design
topic_slug: scalability-and-load-balancing
version: 1
questions:
  - id: scalability-and-load-balancing-001
    difficulty: beginner
    tags: [horizontal-scaling, vertical-scaling, fundamentals]
    question: |
      What is the fundamental difference between horizontal and vertical scaling?
    options:
      - "Horizontal scaling adds more machines to a pool; vertical scaling makes a single machine more powerful"
      - "Horizontal scaling upgrades the CPU/RAM on one node; vertical scaling adds more nodes to a pool"
      - "Horizontal scaling only applies to databases; vertical scaling only applies to app servers"
      - "They are two interchangeable names for the same technique with no practical difference in outcome"
    answer: 0
    explanation: |
      Horizontal scaling (scale out) adds more machines and divides work among them; vertical
      scaling (scale up) makes one machine bigger (more CPU/RAM/disk). Option 1 reverses the
      definitions. Option 2 is false — both apply to any tier. Option 3 is false — they are
      genuinely different strategies with different trade-offs (ceiling, fault tolerance, complexity).
    ref: "concepts.md#horizontal-versus-vertical-scaling"

  - id: scalability-and-load-balancing-002
    difficulty: beginner
    tags: [l4, l7, load-balancer]
    question: |
      A Layer 4 (L4) load balancer makes forwarding decisions based on what information?
    options:
      - "The HTTP URL path, query string, and request headers like Host"
      - "The contents of the HTTP request body, parsed as JSON fields"
      - "Source/destination IP addresses and TCP/UDP ports (the connection tuple)"
      - "Session cookies set by the application to track the user"
    answer: 2
    explanation: |
      An L4 (transport-layer) LB operates on the connection tuple — IPs and ports — without
      reading the application payload. Options 0, 1, and 3 all require parsing HTTP, which is
      what an L7 (application-layer) LB does. L4 can't route on path/headers/cookies precisely
      because it never decrypts or parses the payload.
    ref: "concepts.md#load-balancer-fundamentals-l4-versus-l7"

  - id: scalability-and-load-balancing-003
    difficulty: beginner
    tags: [round-robin, algorithms]
    question: |
      The round robin load balancing algorithm distributes requests how?
    options:
      - "To the backend currently handling the fewest connections"
      - "To the backend with the lowest measured response time"
      - "By hashing the client IP to a fixed backend"
      - "By rotating through backends in order, one after another"
    answer: 3
    explanation: |
      Round robin simply cycles through the backend list in order. Option 0 describes least
      connections, option 1 describes least response time, and option 2 describes IP hash.
      Round robin is simplest but assumes homogeneous backends and roughly equal-cost requests.
    ref: "concepts.md#load-balancing-algorithms"

  - id: scalability-and-load-balancing-004
    difficulty: beginner
    tags: [reverse-proxy, forward-proxy]
    question: |
      What best describes a reverse proxy?
    options:
      - "It sits in front of clients and represents them to the internet"
      - "It sits in front of backend servers and represents them to clients"
      - "It is a database replication mechanism that copies writes to follower nodes"
      - "It is a client-side DNS resolver that caches domain lookups for the browser"
    answer: 1
    explanation: |
      A reverse proxy is the servers' front door: clients connect to it and it forwards to
      backends, hiding which server actually served the request. Option 0 describes a forward
      proxy (client-side egress). Options 2 and 3 are unrelated. Reverse proxies commonly
      handle TLS termination, caching, and load balancing.
    ref: "concepts.md#reverse-proxy-versus-forward-proxy"

  - id: scalability-and-load-balancing-005
    difficulty: beginner
    tags: [stateless, app-tier]
    question: |
      Why is a stateless application tier important for horizontal scaling?
    options:
      - "It allows any request to be served by any node, so nodes can be added or removed freely"
      - "It reduces the amount of RAM each server needs to zero by offloading all memory to disk"
      - "It eliminates the need for a database entirely by keeping all records in local process memory"
      - "It guarantees strong consistency across all replicas automatically without any coordination"
    answer: 0
    explanation: |
      Statelessness means no node holds client-specific data that would be lost if it vanished,
      so any node can serve any request and the fleet can scale/replace nodes freely. Option 1
      is false (servers still use RAM). Option 2 is false — state moves to an external store, it
      doesn't disappear. Option 3 is false — statelessness doesn't provide consistency guarantees.
    ref: "concepts.md#stateless-design-and-scaling-the-app-tier"

  - id: scalability-and-load-balancing-006
    difficulty: beginner
    tags: [health-checks, failover]
    question: |
      What is the primary purpose of a load balancer health check?
    options:
      - "To encrypt traffic between the client and the backend by terminating TLS"
      - "To assign sticky session cookies that pin each client to one backend node"
      - "To compress HTTP responses with gzip before returning them to the client"
      - "To decide which backends are healthy and should receive traffic"
    answer: 3
    explanation: |
      Health checks tell the LB which backends are alive and able to serve, so it can remove
      failing nodes from rotation and add recovered ones back. Options 0, 2, and 1 are other LB
      features (TLS, compression, affinity) but not the purpose of health checks.
    ref: "concepts.md#health-checks-and-failover"

  - id: scalability-and-load-balancing-007
    difficulty: beginner
    tags: [multi-az, availability-zone]
    question: |
      Why do most services deploy across multiple Availability Zones (AZs) within a region?
    options:
      - "To reduce the cost of running the service to near zero by sharing idle hardware"
      - "To comply with data-residency laws that require every region to span multiple countries"
      - "To survive the failure of a single datacenter while keeping low latency between AZs"
      - "Because a single AZ is physically capped at running no more than one server at a time"
    answer: 2
    explanation: |
      AZs are isolated datacenters with independent power/cooling/network but are close together
      (~1-2 ms), so multi-AZ survives a datacenter failure while still allowing fast (often
      synchronous) replication. Option 0 is false (redundancy costs more). Option 1 is about
      multi-region/geography, not multi-AZ. Option 3 is false.
    ref: "concepts.md#multi-az-and-multi-region-architecture"

  - id: scalability-and-load-balancing-008
    difficulty: beginner
    tags: [caching, read-scaling]
    question: |
      Why is caching often the single biggest lever for scaling a read-heavy system?
    options:
      - "It permanently deletes old data from the origin to save space and shrink the working set"
      - "The cheapest request is one you never have to compute — cache hits avoid origin/DB work"
      - "It guarantees every read is perfectly consistent with the database at all times"
      - "It replaces the need for a load balancer by routing requests directly to the origin"
    answer: 1
    explanation: |
      Caching serves precomputed results close to the consumer so the origin/data tier does far
      less work and latency drops. Option 0 misdescribes caching (eviction is not deletion of
      the source). Option 2 is false — caching introduces staleness/consistency trade-offs.
      Option 3 is unrelated.
    ref: "concepts.md#caching-and-cdns-to-reduce-load"

  - id: scalability-and-load-balancing-009
    difficulty: beginner
    tags: [autoscaling, elasticity]
    question: |
      What does target-tracking auto-scaling do?
    options:
      - "Adds/removes instances to keep a chosen metric (e.g., CPU at 60%) near a target"
      - "Runs a fixed number of instances that never changes regardless of the observed metric"
      - "Scales strictly on a fixed clock schedule, ignoring the live value of any metric"
      - "Predicts future load with a machine-learning forecast and provisions ahead of the curve"
    answer: 0
    explanation: |
      Target-tracking keeps a metric at a set point by adjusting capacity up/down. Option 1 is
      static provisioning. Option 2 describes scheduled scaling. Option 3 describes predictive
      scaling. Target-tracking is the most common and simplest reactive policy.
    ref: "concepts.md#auto-scaling-policies"

  - id: scalability-and-load-balancing-010
    difficulty: beginner
    tags: [cell-based, blast-radius]
    question: |
      In a cell-based architecture, what is the main benefit of splitting a service into many
      independent cells?
    options:
      - "It removes the need for any load balancer by letting clients pick a cell directly"
      - "It makes every request strongly consistent across all cells via a global lock manager"
      - "It reduces blast radius — a failure or bad deploy is contained to one cell (a subset of users)"
      - "It eliminates the database entirely by keeping all cell state in shared memory"
    answer: 2
    explanation: |
      Each cell is a self-contained stack serving a subset of customers, so a failure, bad deploy,
      or poison-pill request affects only that cell (~1/K of users). Options 0, 1, and 3 are false
      — cells still need routing, provide isolation not global consistency, and still have data stores.
    ref: "concepts.md#cell-based-architecture"

  - id: scalability-and-load-balancing-011
    difficulty: beginner
    tags: [read-replicas, data-tier]
    question: |
      Read replicas primarily help scale which kind of workload?
    options:
      - "Write-heavy workloads"
      - "Only batch/analytics workloads"
      - "Neither reads nor writes"
      - "Read-heavy workloads"
    answer: 3
    explanation: |
      Read replicas are read-only copies of the primary, so you can route reads to them and scale
      read throughput. They do NOT scale writes (all writes still go to the primary), so option 0
      is wrong; and they help general reads, not only analytics (option 1) nor "neither" (option 2).
    ref: "concepts.md#scaling-the-data-tier"

  - id: scalability-and-load-balancing-012
    difficulty: beginner
    tags: [dns, gslb]
    question: |
      What does DNS-based global load balancing (GSLB) primarily decide?
    options:
      - "Which specific backend process within a single server ultimately handles a given request"
      - "Which region or data center a client connects to, before reaching L4/L7 LBs"
      - "The exact TCP congestion window and retransmit timers negotiated for each connection"
      - "How the database shards its rows across partitions using the chosen shard key"
    answer: 1
    explanation: |
      GSLB via DNS steers clients to a region/data center (by geo, latency, weight, or health)
      before they ever reach the in-region L4/L7 balancers. Option 0 is a job for the in-region
      LB. Options 2 and 3 are unrelated to DNS routing.
    ref: "concepts.md#dns-load-balancing-and-gslb-geo-and-global"

  - id: scalability-and-load-balancing-013
    difficulty: beginner
    tags: [sticky-sessions, affinity]
    question: |
      What is a sticky session (session affinity)?
    options:
      - "Binding a client to a specific backend so all their requests go to the same node"
      - "A session token that never expires and stays valid for the lifetime of the account"
      - "A session stored only in the client's browser local storage, never on the server"
      - "A long-running database transaction that locks all rows until the client disconnects"
    answer: 0
    explanation: |
      Session affinity pins a client to one backend (via a cookie or IP hash) so repeated requests
      hit the same node, useful when that node holds in-memory state. Option 1 confuses affinity
      with expiry. Option 2 describes client-side session storage. Option 3 is unrelated.
    ref: "concepts.md#sticky-sessions-and-session-affinity"

  - id: scalability-and-load-balancing-014
    difficulty: beginner
    tags: [n-plus-one, redundancy]
    question: |
      What does "N+1 redundancy" mean?
    options:
      - "Running exactly one server at all times and rebuilding it from backup when it fails"
      - "Running N servers each pinned at 100% utilization with no spare headroom at peak"
      - "Doubling every server for full duplication so the fleet always has two copies of each"
      - "Running one more unit than the N needed to carry peak load, so losing one still serves peak"
    answer: 3
    explanation: |
      N+1 provisions one spare beyond the N units required at peak, so a single failure still
      leaves N to carry the load. Option 2 describes 2N. Option 1 describes running with no
      headroom (which fails on any loss). Option 0 is trivially non-redundant.
    ref: "concepts.md#n-plus-one-redundancy-and-capacity-planning"

  - id: scalability-and-load-balancing-015
    difficulty: intermediate
    tags: [consistent-hashing, algorithms]
    question: |
      Compared to naive `backend = hash(key) % N`, why is consistent hashing preferred for a
      distributed cache tier?
    options:
      - "It makes every key map to the same single backend for maximum simplicity and cache locality"
      - "It removes the need for the cache entirely by computing results inline on each request"
      - "Adding or removing a node remaps only about 1/N of keys instead of nearly all of them"
      - "It guarantees perfectly even load across all nodes with no additional techniques needed"
    answer: 2
    explanation: |
      With `hash % N`, changing N remaps almost every key, causing a cache stampede against the
      origin. Consistent hashing only moves ~1/N of keys when a node joins/leaves. Option 0 is
      wrong (keys spread across the ring). Option 1 is nonsense. Option 3 is false — you need
      virtual nodes to get even load; plain consistent hashing can be uneven.
    ref: "concepts.md#load-balancing-algorithms"

  - id: scalability-and-load-balancing-016
    difficulty: intermediate
    tags: [least-connections, algorithms, scenario]
    question: |
      Your backends serve requests of wildly varying duration (some connections stay open for
      minutes, others milliseconds), and the fleet is homogeneous. Which LB algorithm best avoids
      overloading a node that happens to accumulate long-lived connections?
    options:
      - "Plain round robin"
      - "Least connections (or power-of-two-choices)"
      - "IP hash"
      - "Weighted round robin based on CPU core count"
    answer: 1
    explanation: |
      Least connections (or P2C) routes to the node with the fewest active connections, adapting
      to uneven request durations. Round robin (option 0) ignores that one node is stuck with many
      long connections. IP hash (option 2) pins clients regardless of load. Weighted RR (option 3)
      helps with heterogeneous hardware, not with variable per-request duration on identical nodes.
    ref: "concepts.md#load-balancing-algorithms"

  - id: scalability-and-load-balancing-017
    difficulty: intermediate
    tags: [l7, routing, scenario]
    question: |
      You need a single domain (api.example.com) to route /users/* to one microservice, /orders/*
      to another, and to run a 5% canary of a new build based on a request header. What do you need?
    options:
      - "An L7 load balancer, because path- and header-based routing requires parsing HTTP"
      - "An L4 load balancer, because it is faster and can still read the path from the TCP header"
      - "DNS round robin only, returning a rotating backend IP per lookup for each path prefix"
      - "A forward proxy on each client, configured to rewrite the URL before the request egresses"
    answer: 0
    explanation: |
      Path-based and header-based routing (and header-driven canary) require reading the HTTP
      request, which only an L7 LB does. An L4 LB (option 1) can't see paths or headers. DNS
      (option 2) can't route by path. A forward proxy (option 3) is client-side egress, not
      server-side routing.
    ref: "concepts.md#load-balancer-fundamentals-l4-versus-l7"

  - id: scalability-and-load-balancing-018
    difficulty: intermediate
    tags: [health-checks, correlated-failure]
    question: |
      Why can overly "deep" health checks (each backend probes a shared downstream DB) cause a
      LARGER outage than the problem they detect?
    options:
      - "Deep checks are slower to run, adding latency directly to every real user request path"
      - "Deep checks consume too much disk space on the LB by logging each probe's full response"
      - "If the shared dependency blips, every backend fails its check at once and the LB removes the entire fleet"
      - "Deep checks require sticky sessions to work, and affinity churn then drops in-flight requests"
    answer: 2
    explanation: |
      A momentary blip in a shared dependency makes all backends fail their deep check
      simultaneously, so the LB ejects the whole fleet -> a self-inflicted 100% outage, even
      though the hosts could still serve cached/degraded responses. Options 0, 1, 3 are not the
      core risk; the danger is correlated fleet-wide ejection.
    ref: "concepts.md#health-checks-and-failover"

  - id: scalability-and-load-balancing-019
    difficulty: intermediate
    tags: [dns, ttl, failover]
    question: |
      You configured a 60-second TTL for DNS failover, but during a regional outage users kept
      hitting the dead region for several minutes. Why?
    options:
      - "DNS failover always completes in exactly the TTL, since every resolver honors that value precisely"
      - "DNS has no failover capability at all, since published A records stay permanently fixed in the zone"
      - "Setting the TTL to 0 fully disables all resolver caching and gives instant, guaranteed failover"
      - "Resolvers and clients cache records beyond the intended TTL, so DNS failover is slow and unreliable"
    answer: 3
    explanation: |
      Many resolvers and client stacks ignore or extend TTLs and cache stale records, so DNS-based
      failover can take far longer than the TTL. That's why fast failover uses Anycast/Global
      Accelerator (network-layer). Option 0 is false (caching adds delay beyond TTL). Option 2 is
      impractical (TTL 0 still isn't honored and floods DNS). Option 1 is false.
    ref: "concepts.md#dns-load-balancing-and-gslb-geo-and-global"

  - id: scalability-and-load-balancing-020
    difficulty: intermediate
    tags: [sticky-sessions, trade-offs, scenario]
    question: |
      What is the PRIMARY trade-off you accept when you enable sticky sessions to keep a user's
      warm in-memory cache on one node?
    options:
      - "Requests become strongly consistent across every node because affinity synchronizes their in-memory state"
      - "Load can become uneven and losing that node loses the user's state, complicating deploys and failover"
      - "You no longer need an external store, since each node keeps the user's full session on local disk"
      - "Latency to the database increases for every request because affinity forces an extra cross-node hop"
    answer: 1
    explanation: |
      Stickiness pins users to nodes, so load skews (whales on one node), a node's death loses
      that user's state, and draining for deploys forces migration. Option 0 is false. Option 2 is
      not guaranteed and misses the point. Option 3 is backwards — affinity often lowers latency
      via warm local state; the cost is elasticity/failover, not DB latency.
    ref: "concepts.md#sticky-sessions-and-session-affinity"

  - id: scalability-and-load-balancing-021
    difficulty: intermediate
    tags: [multi-az, utilization, capacity, quant]
    question: |
      You run across 3 AZs and must survive losing any one AZ at peak. What is the approximate
      maximum steady-state utilization per AZ?
    options:
      - "About 66%"
      - "About 50%"
      - "About 33%"
      - "About 100%"
    answer: 0
    explanation: |
      If one AZ fails, the 2 survivors must carry 100% of peak, so each survivor handles 50%.
      That means each AZ can run at most 50%... but across 3 AZs the aggregate steady-state
      utilization is capped near 66% (2/3 of capacity is usable; one third is redundancy headroom).
      Running near 100% (option 3) would overload survivors on failure.
    ref: "concepts.md#n-plus-one-redundancy-and-capacity-planning"

  - id: scalability-and-load-balancing-022
    difficulty: intermediate
    tags: [autoscaling, queue-depth, scenario]
    question: |
      You run a fleet of async workers that pull jobs off a queue. Job CPU cost varies and jobs can
      queue up during spikes. Which auto-scaling signal best aligns with keeping the backlog under control?
    options:
      - "Average CPU utilization of the workers"
      - "Disk space used on each worker"
      - "Number of DNS queries per second"
      - "Queue depth / backlog per worker"
    answer: 3
    explanation: |
      For async pipelines, backlog (queue depth) per worker directly reflects whether you're
      keeping up, so scaling on it holds latency/throughput SLOs. CPU (option 0) is a weak proxy
      — workers can be idle-waiting or the bottleneck can be elsewhere. Options 2 and 1 are
      unrelated to job throughput.
    ref: "concepts.md#auto-scaling-policies"

  - id: scalability-and-load-balancing-023
    difficulty: intermediate
    tags: [autoscaling, data-tier, failure-mode]
    question: |
      Your app tier autoscales aggressively, but under a traffic spike the whole system still falls
      over. What is the most likely explanation?
    options:
      - "The load balancer exhausted its pool of ephemeral source ports and refused all new connections"
      - "The DNS TTL was set too high, so clients kept resolving to a stale set of scaled-in app nodes"
      - "The new app nodes all pile onto the same shared database, overwhelming the data tier"
      - "The app nodes were stateless, which forced the load balancer to rebuild affinity on every request"
    answer: 2
    explanation: |
      Scaling the app tier without scaling or protecting the data tier just adds clients hammering
      the same DB, which becomes the bottleneck and collapses. Fixes: cache/replicas, connection
      limits/backpressure, sharding. Option 0 is rare/unrelated. Option 1 wouldn't cause a spike
      collapse of the whole system this way. Option 3 (stateless) is desirable, not the cause.
    ref: "concepts.md#scaling-the-data-tier"

  - id: scalability-and-load-balancing-024
    difficulty: intermediate
    tags: [replication-lag, read-your-writes, scenario]
    question: |
      After adding read replicas, users complain that right after they post something they don't
      see it. What is happening and what's the standard fix?
    options:
      - "The primary is down and silently dropping writes; restart it to flush the pending write buffer"
      - "Replication lag — the read hit a replica that hasn't received the write yet; route read-your-writes to the primary or use session consistency"
      - "The cache TTL is too low, so writes expire before the read arrives; raise it to keep entries longer"
      - "The load balancer is using round robin; switch to IP hash so the write and read land on one node"
    answer: 1
    explanation: |
      Replicas are asynchronously updated, so a read right after a write can hit a stale replica.
      The fix is read-your-writes / session consistency (serve that user's reads from the primary
      or a sufficiently-caught-up replica for a window). Options 0, 2, 3 don't address replication
      lag, which is the root cause.
    ref: "concepts.md#scaling-the-data-tier"

  - id: scalability-and-load-balancing-025
    difficulty: intermediate
    tags: [cdn, edge, caching]
    question: |
      What is the main scalability benefit of putting a CDN in front of your origin?
    options:
      - "It serves cacheable content from PoPs near users, offloading the origin and cutting latency"
      - "It shards the origin database automatically by partitioning rows across the edge PoPs nearest each user"
      - "It guarantees strong consistency for all user data by validating every edge copy against the origin per request"
      - "It removes the need for TLS because edge-to-client traffic travels over a private, pre-encrypted backbone"
    answer: 0
    explanation: |
      A CDN caches content at edge locations close to users, so most requests never touch the
      origin and latency drops to tens of milliseconds. Option 1 is false (CDNs don't shard DBs).
      Option 2 is false — edge caching introduces staleness. Option 3 is false (CDNs typically
      terminate TLS at the edge, they don't remove it).
    ref: "concepts.md#caching-and-cdns-to-reduce-load"

  - id: scalability-and-load-balancing-026
    difficulty: intermediate
    tags: [l4, l7, tls, trade-offs]
    question: |
      A team wants true end-to-end TLS encryption from client all the way to the backend (the
      middle box must NOT be able to read the plaintext). Which choice fits, and what do they give up?
    options:
      - "An L7 LB that terminates TLS and re-encrypts to the backend; they give up nothing because plaintext never persists"
      - "A CDN that caches the encrypted bytes at the edge; they give up nothing since the ciphertext is served verbatim"
      - "An L4 LB that passes TLS through; they give up content-based (path/header) routing at the LB"
      - "DNS round robin that rotates backend IPs per lookup; they give up active per-backend health checks"
    answer: 2
    explanation: |
      To keep end-to-end encryption, the LB must NOT terminate TLS — an L4 pass-through forwards
      the encrypted bytes, but then it can't route on path/headers (it can't read them). Option 0
      contradicts the requirement (L7 termination decrypts). Option 1 is nonsense (you can't cache
      opaque encrypted bytes usefully). Option 3 doesn't address TLS.
    ref: "concepts.md#load-balancer-fundamentals-l4-versus-l7"

  - id: scalability-and-load-balancing-027
    difficulty: intermediate
    tags: [sharding, shard-key, hot-shard]
    question: |
      You shard a database by hashing the customer ID. One enormous "whale" tenant generates 40%
      of all traffic. What problem arises and why?
    options:
      - "No problem — hashing the customer ID guarantees perfectly even traffic across every shard"
      - "The primary key space runs out, because one heavy tenant consumes most of the available ID range"
      - "Cross-shard joins become impossible for all tenants once a single tenant dominates the traffic mix"
      - "A hot shard: all of the whale's traffic maps to one shard, overloading it while others idle"
    answer: 3
    explanation: |
      Hashing spreads keys evenly by count, but a single high-traffic key still lands on ONE shard,
      creating a hotspot regardless of hashing. Mitigations: split the hot key, per-tenant limits,
      or move the whale to a dedicated shard. Option 0 is the misconception being tested. Options
      2 and 1 are not the specific issue here.
    ref: "concepts.md#scaling-the-data-tier"

  - id: scalability-and-load-balancing-028
    difficulty: intermediate
    tags: [cell-based, shuffle-sharding]
    question: |
      What does shuffle sharding add on top of plain cell-based partitioning?
    options:
      - "It makes all cells share a single database so tenant data stays globally consistent across cells"
      - "It assigns each customer to a small random combination of cells, so two customers rarely share the exact same set"
      - "It removes the cell router by letting each client compute its own target cell from a static map"
      - "It converts the system to a single global cell that every customer is routed through for simplicity"
    answer: 1
    explanation: |
      Shuffle sharding gives each customer a random subset (e.g., 2 of 8) of cells; since two
      customers rarely share the same combination, a poison-pill customer that degrades their
      cells affects very few others. Option 0 defeats isolation. Options 2 and 3 contradict the
      cellular model.
    ref: "concepts.md#cell-based-architecture"

  - id: scalability-and-load-balancing-029
    difficulty: intermediate
    tags: [anycast, failover]
    question: |
      Why does Anycast provide faster failover than DNS-based failover?
    options:
      - "Anycast reroutes at the network (BGP) layer within seconds, avoiding DNS TTL/resolver caching delays"
      - "Anycast assigns a unique IP per user so failover is instant, since each client owns a dedicated route"
      - "Anycast disables all resolver and client caching everywhere, so no stale record can ever be returned"
      - "Anycast only works inside a single data center, where BGP can reconverge without any wide-area delay"
    answer: 0
    explanation: |
      Anycast announces the same IP from many locations; when one goes away, BGP routes users to
      the next-nearest PoP in seconds, with no dependence on DNS TTL/resolver caching. Option 1 is
      backwards (it's the SAME IP everywhere). Option 2 is false. Option 3 is false — Anycast is a
      global/network-wide technique.
    ref: "concepts.md#dns-load-balancing-and-gslb-geo-and-global"

  - id: scalability-and-load-balancing-030
    difficulty: intermediate
    tags: [cqrs, cdc, data-tier]
    question: |
      What does Change Data Capture (CDC) enable in a modern data architecture?
    options:
      - "It locks the database during every write for strong consistency across all downstream read stores"
      - "It replaces the need for a primary database by becoming the authoritative store of current record state"
      - "It shards the database automatically by tenant, redistributing rows as each tenant's write volume grows"
      - "It streams the database's changelog to keep caches, search indexes, and other stores in sync without dual-writes"
    answer: 3
    explanation: |
      CDC (e.g., Debezium reading the DB transaction log into Kafka) propagates changes to
      downstream read stores/caches/search, avoiding fragile dual-writes in application code.
      Option 0 misdescribes CDC. Option 2 is unrelated. Option 1 is false — CDC feeds FROM the
      primary, it doesn't replace it.
    ref: "concepts.md#scaling-the-data-tier"

  - id: scalability-and-load-balancing-031
    difficulty: intermediate
    tags: [reverse-proxy, forward-proxy, distinction]
    question: |
      A corporate network routes all employee web traffic through a server that filters and caches
      outbound requests before they reach the internet. This is an example of:
    options:
      - "A reverse proxy, which fronts a pool of backend servers and hides them from external clients"
      - "A load balancer, which spreads inbound requests across a fleet of identical backend servers"
      - "A forward proxy"
      - "A CDN edge node, which caches origin content at a location physically close to end users"
    answer: 2
    explanation: |
      A forward proxy sits in front of clients and fetches on their behalf, used for egress
      filtering/caching/access control — exactly this scenario. A reverse proxy (option 0) sits in
      front of servers. Options 1 and 3 are server-side, inbound components.
    ref: "concepts.md#reverse-proxy-versus-forward-proxy"

  - id: scalability-and-load-balancing-032
    difficulty: intermediate
    tags: [power-of-two-choices, algorithms]
    question: |
      Why is "power of two choices" (P2C) load balancing popular in large service meshes over
      global least-connections?
    options:
      - "It always pins traffic to a single node to maximize cache locality and warm-connection reuse"
      - "It approximates least-loaded routing with O(1) state and avoids the herd effect of many balancers all picking the same 'least loaded' node"
      - "It guarantees strictly even load with zero variance across every backend in the mesh at all times"
      - "It requires no health or load information at all, routing purely at random and ignoring backend state"
    answer: 1
    explanation: |
      P2C picks two backends at random and routes to the less loaded of the two — nearly as good as
      global least-connections but with minimal state, and it avoids the thundering-herd problem
      where many independent balancers converge on the same "least loaded" node. Option 0 is wrong.
      Option 2 overstates it. Option 3 is wrong — it does use per-choice load.
    ref: "concepts.md#load-balancing-algorithms"

  - id: scalability-and-load-balancing-033
    difficulty: intermediate
    tags: [autoscaling, cold-start, headroom]
    question: |
      Why do you still need static capacity headroom even with autoscaling enabled?
    options:
      - "New instances take time to boot and warm up, so you need headroom to survive the instant of a spike or failure before replacements are ready"
      - "Autoscaling is not real and never adds capacity; it only rebalances traffic among existing nodes"
      - "Headroom makes the load balancer faster by giving it spare connection slots to pre-open per backend"
      - "Autoscaling only scales down and never up, so headroom is the sole way capacity is ever added"
    answer: 0
    explanation: |
      Autoscaling reacts after load rises and boot/warm-up takes seconds to minutes, so without
      headroom you breach SLO (or drop traffic) during that window and during the instant a node/AZ
      fails. Autoscaling handles sustained recovery; headroom handles the immediate gap. Options 1,
      2, 3 are false.
    ref: "concepts.md#auto-scaling-policies"

  - id: scalability-and-load-balancing-034
    difficulty: intermediate
    tags: [connection-draining, autoscaling, scenario]
    question: |
      During scale-in, users occasionally see failed requests. What mechanism prevents terminating
      a node in the middle of serving requests?
    options:
      - "Increasing the DNS TTL so clients stop resolving to a node before it is terminated"
      - "Switching the LB algorithm to round robin so requests spread evenly off the dying node"
      - "Connection draining / lifecycle hooks that let in-flight requests complete before termination"
      - "Enabling sticky sessions so each user stays pinned to a node that is never scaled in"
    answer: 2
    explanation: |
      Connection draining (a.k.a. deregistration delay / lifecycle hooks) stops sending new
      requests to a node and waits for in-flight ones to finish before terminating it. Options 0,
      1, 3 don't address graceful termination and won't prevent mid-request kills.
    ref: "concepts.md#auto-scaling-policies"

  - id: scalability-and-load-balancing-035
    difficulty: intermediate
    tags: [queue, load-leveling, write-scaling]
    question: |
      Putting a queue (e.g., Kafka/SQS) between producers and a database that can't keep up with
      write spikes achieves what, and at what cost?
    options:
      - "It makes writes strongly consistent and instantly visible at no cost, because the queue commits synchronously"
      - "It eliminates the need for the database entirely by durably retaining every write inside the queue itself"
      - "It shards the database automatically with no downside, spreading writes across partitions as they enqueue"
      - "It levels/smooths write bursts and decouples producers from the DB's sustainable rate, at the cost of added latency and eventual (delayed) processing"
    answer: 3
    explanation: |
      Queue-based load leveling absorbs bursts and lets the DB drain at its sustainable rate,
      trading immediate consistency/visibility for throughput and resilience (writes are processed
      asynchronously). Option 0 is contradictory (queuing adds latency and delays visibility).
      Options 2 and 1 are false.
    ref: "concepts.md#scaling-the-data-tier"

  - id: scalability-and-load-balancing-036
    difficulty: intermediate
    tags: [passive-health-check, outlier-detection]
    question: |
      What is "passive" health checking (outlier detection) as used by proxies like Envoy?
    options:
      - "Sending periodic synthetic probe requests to a dedicated /healthz endpoint on each backend"
      - "Inferring health from real traffic — ejecting a backend that returns repeated 5xx/timeouts"
      - "Checking the backend's free disk space and CPU load over an SSH connection on a fixed interval"
      - "Asking the DNS resolver whether the backend's hostname still resolves to a valid A record"
    answer: 1
    explanation: |
      Passive/outlier detection watches actual responses and temporarily ejects a backend that
      keeps failing on real traffic — cheap and reactive to real problems. Option 0 describes ACTIVE
      health checks. Options 2 and 3 aren't standard health-check mechanisms.
    ref: "concepts.md#health-checks-and-failover"

  - id: scalability-and-load-balancing-037
    difficulty: intermediate
    tags: [multi-region, replication, consistency]
    question: |
      Why is cross-region database replication almost always asynchronous rather than synchronous?
    options:
      - "The speed-of-light latency between regions (50-150+ ms) would be added to every write, which is usually unacceptable"
      - "Synchronous replication across regions is prohibited by data-sovereignty law in most countries and carries heavy fines"
      - "Asynchronous replication is strongly consistent by default, so every region always reflects the latest committed write"
      - "Regions cannot communicate over the network because backbone links between data centers are intentionally kept isolated"
    answer: 0
    explanation: |
      Synchronous cross-region replication would make every write wait for a distant region's
      acknowledgment, adding 50-150+ ms per write — usually unacceptable — so multi-region uses
      async replication and accepts some RPO/eventual consistency. Option 1 is false. Option 2 is
      backwards (async is NOT strongly consistent). Option 3 is false.
    ref: "concepts.md#multi-az-and-multi-region-architecture"

  - id: scalability-and-load-balancing-038
    difficulty: intermediate
    tags: [vertical-scaling, trade-offs, scenario]
    question: |
      A startup's single Postgres instance is at 70% CPU with heavy cross-row transactions. They
      have plenty of headroom to move to a bigger instance type. What's the most pragmatic next step?
    options:
      - "Immediately shard the database across 10 nodes so cross-row transactions can execute in parallel on each partition"
      - "Add a second region for active-active writes to spread the transaction load evenly across both continents"
      - "Rewrite the app to be eventually consistent so transactions no longer need to coordinate across rows at all"
      - "Vertically scale to a larger instance first — it preserves single-node ACID and avoids distributed complexity"
    answer: 3
    explanation: |
      With heavy cross-row transactions and available headroom, scaling up is the simplest step and
      preserves single-node ACID — premature sharding (option 0) is a classic over-engineering trap
      that breaks cross-shard transactions. Options 2 and 1 are massive complexity increases
      unjustified by the current situation.
    ref: "concepts.md#horizontal-versus-vertical-scaling"

  - id: scalability-and-load-balancing-039
    difficulty: intermediate
    tags: [cache-stampede, thundering-herd]
    question: |
      A popular cached item expires and thousands of concurrent requests all miss and hit the DB at
      once. What is this called and a standard mitigation?
    options:
      - "Replication lag; fix by adding more read replicas so the expired key is served from a caught-up follower"
      - "Split brain; mitigate with a quorum vote so only one node is allowed to recompute the expired item"
      - "Cache stampede / thundering herd; mitigate with request coalescing (single-flight) and staggered TTLs"
      - "Hot shard; mitigate with weighted round robin so the expired key's requests spread across shards evenly"
    answer: 2
    explanation: |
      A cache stampede (thundering herd) happens when a hot key expires and many requests
      simultaneously recompute it against the origin. Single-flight/request coalescing (one request
      recomputes while others wait) plus staggered TTLs and pre-warming mitigate it. Options 0, 1,
      3 name different problems.
    ref: "concepts.md#caching-and-cdns-to-reduce-load"

  - id: scalability-and-load-balancing-040
    difficulty: intermediate
    tags: [jwt, session, stateless]
    question: |
      Using signed JWT tokens for auth state (instead of server-side sessions) primarily helps
      scalability how?
    options:
      - "It encrypts the database at rest by storing every user record inside the signed token payload"
      - "The client carries its own auth state, so any stateless node can validate the request without a shared session lookup"
      - "It guarantees tokens can be revoked instantly across the whole fleet the moment a user logs out"
      - "It removes the need for HTTPS because the token's signature already protects the payload in transit"
    answer: 1
    explanation: |
      A signed token lets any node verify the request locally without consulting a shared session
      store, keeping the app tier stateless and easy to scale out. Option 0 is unrelated. Option 2
      is actually a KNOWN weakness of JWTs (revocation is hard). Option 3 is false.
    ref: "concepts.md#stateless-design-and-scaling-the-app-tier"

  - id: scalability-and-load-balancing-041
    difficulty: advanced
    tags: [multi-region, active-active, consistency, scenario]
    question: |
      A global product wants active-active multi-region writes with low local write latency. A user
      writes in region A and immediately reads in region B. Which statement is the honest trade-off?
    options:
      - "Async replication means region B may not have the write yet; you must accept eventual consistency, partition data by region ownership, or handle conflicts"
      - "You can have local low-latency writes AND strong global read-after-write consistency with no downside"
      - "Active-active removes all consistency concerns automatically because each region reconciles writes in real time on every request"
      - "You should just use synchronous global replication; the cross-region latency is negligible and adds no delay to local writes"
    answer: 0
    explanation: |
      Local low-latency writes imply async cross-region replication, so region B can be behind —
      you must accept eventual consistency, partition ownership so each key is written in one region,
      or resolve conflicts (multi-master). Option 1 violates CAP/physics. Option 2 is false. Option
      3 is false — global sync replication adds 50-150+ ms per write.
    ref: "concepts.md#multi-az-and-multi-region-architecture"

  - id: scalability-and-load-balancing-042
    difficulty: advanced
    tags: [cell-based, cell-router, spof]
    question: |
      In a well-designed cell-based architecture, why must the cell router be kept as thin and
      dependency-light as possible?
    options:
      - "Because it stores the authoritative copy of all customer data and must serve every lookup with sub-millisecond latency"
      - "Because thin routers use less disk space, letting the fleet pack more cells onto each physical host to cut cost"
      - "Because it is the one shared component across cells — if it is fragile or depends on the cells' data plane, it becomes a global SPOF that undermines the isolation"
      - "Because it must run the exact same application code as each cell so that routing decisions stay perfectly consistent"
    answer: 2
    explanation: |
      The router is the residual shared component; if it's complex or coupled to the cells' data
      plane, a failure there impacts everyone, defeating the whole point of cellular isolation. So
      it's kept minimal, rarely changed, and independent of the data plane. Option 0 is wrong (the
      router holds no data). Options 1 and 3 miss the reliability reasoning.
    ref: "concepts.md#cell-based-architecture"

  - id: scalability-and-load-balancing-043
    difficulty: advanced
    tags: [multi-region, control-plane, spof, failure-mode]
    question: |
      A company claims to be "fully multi-region" but a single global control plane / DNS / shared
      database still fronts everything. What is the key risk?
    options:
      - "None — deploying across multiple regions always eliminates every single point of failure by definition"
      - "Latency between regions becomes zero once a shared global control plane coordinates all the traffic"
      - "The regions will automatically diverge in data because the shared global database refuses to replicate"
      - "The shared global component remains a single point of failure, so a control-plane issue can cause a global outage despite regional data-plane redundancy"
    answer: 3
    explanation: |
      Data-plane redundancy across regions doesn't help if a shared control plane, DNS, or global DB
      can fail globally — many real outages are control-plane, not data-plane. True regional
      independence requires the shared components to be regionalized or statically stable. Options 0,
      2, 1 are false.
    ref: "concepts.md#multi-az-and-multi-region-architecture"

  - id: scalability-and-load-balancing-044
    difficulty: advanced
    tags: [health-checks, fail-open, thresholds, scenario]
    question: |
      To avoid the "all backends marked unhealthy -> total outage" failure, what is a sound design
      principle for LB health checking?
    options:
      - "Always use the deepest possible checks that probe every downstream dependency, so you catch every failure the instant it appears"
      - "Keep the LB membership check shallow/local, use passive outlier detection for fast eviction, and consider failing open if all targets appear unhealthy"
      - "Set the unhealthy threshold to a single failed probe so the balancer reacts to any hiccup as fast as physically possible"
      - "Disable health checks entirely to avoid false positives, and rely on clients retrying failed requests against other nodes"
    answer: 1
    explanation: |
      The membership decision should be shallow/local (is THIS process serving?), with passive
      outlier detection for real failures, and a fail-open safety valve so a shared-dependency blip
      can't zero out the pool. Option 0 invites correlated fleet-wide ejection. Option 2 causes
      flapping on transient blips. Option 3 removes protection entirely.
    ref: "concepts.md#health-checks-and-failover"

  - id: scalability-and-load-balancing-045
    difficulty: advanced
    tags: [consistent-hashing, bounded-load, hot-key]
    question: |
      Plain consistent hashing with virtual nodes still lets a single hot key overload the node that
      owns it. What technique caps how much any node can exceed the average load?
    options:
      - "Consistent hashing with bounded loads (cap each node at (1+epsilon) x average, spilling over to the next node)"
      - "Round robin over the ring, rotating each key to the next virtual node so the hot key's requests spread out"
      - "Increasing the DNS TTL so resolvers cache the hot key's owning node longer and reduce lookup pressure"
      - "Switching to synchronous replication so the hot key's node shares its load with its replicas on every request"
    answer: 0
    explanation: |
      Consistent hashing with bounded loads (Google, 2017) enforces a per-node cap of ~(1+epsilon)
      times the mean; when a node is full, keys spill to the next node on the ring, bounding hotspots
      while keeping minimal remapping. Options 1, 2, 3 don't address load bounding on a hash ring.
    ref: "concepts.md#load-balancing-algorithms"

  - id: scalability-and-load-balancing-046
    difficulty: advanced
    tags: [l4, l7, architecture, scenario]
    question: |
      A high-scale service places an L4 load balancer at the edge that forwards to a fleet of L7
      Envoy proxies, which then route to microservices. Why combine both layers?
    options:
      - "It is redundant; a single layer would always outperform the combination and cut a network hop of latency"
      - "L4 performs the path-based and header-based routing that an L7 proxy is architecturally unable to do"
      - "L7 proxies cannot terminate TLS, so the L4 layer must decrypt every connection before forwarding it"
      - "L4 gives raw throughput and DDoS resilience and spreads load across the horizontally-scaled (and individually failable) L7 fleet, while L7 provides content routing/retries"
    answer: 3
    explanation: |
      L4 at the edge handles enormous connection volume and DDoS cheaply and distributes across the
      L7 proxy fleet (which is itself scaled out and can lose nodes); L7 then does path/header
      routing, retries, timeouts, and WAF. Option 0 misses that each layer does a different job.
      Options 2 and 1 are factually backwards.
    ref: "concepts.md#load-balancer-fundamentals-l4-versus-l7"

  - id: scalability-and-load-balancing-047
    difficulty: advanced
    tags: [sharding, resharding, scenario]
    question: |
      You sharded by hash and now need to add capacity, but your naive scheme uses `hash(key) % N`.
      What is the operational pain, and what design would have avoided it?
    options:
      - "No pain; adding a shard is free with modulo hashing because keys stay on their original node automatically"
      - "Modulo hashing guarantees efficient range queries, so you can just add read replicas to absorb the new capacity"
      - "Changing N remaps nearly all keys, forcing a massive data migration/rebalance; consistent hashing (or a directory/lookup service) would remap only ~1/N"
      - "You must switch to synchronous cross-region replication before any new shard can safely accept writes"
    answer: 2
    explanation: |
      With `hash % N`, increasing N reshuffles almost every key across shards — a painful,
      stampede-prone migration. Consistent hashing (or a directory/lookup indirection) limits
      movement to ~1/N of keys. Option 0 is the misconception. Options 1 and 3 are irrelevant to the
      rebalancing problem.
    ref: "concepts.md#scaling-the-data-tier"

  - id: scalability-and-load-balancing-048
    difficulty: advanced
    tags: [cqrs, eventual-consistency, trade-offs]
    question: |
      A team introduces CQRS (separate write model + denormalized read views fed asynchronously).
      What is the primary trade-off they must design around?
    options:
      - "The write and read models are always perfectly in sync in real time because the projection runs inside the write transaction"
      - "The read side is eventually consistent with the write side, and they must handle the resulting staleness plus more operational surface"
      - "CQRS removes the need for a database by keeping the entire read model in application process memory"
      - "CQRS makes writes strictly slower than reads by design, since every write must first rebuild all read views"
    answer: 1
    explanation: |
      CQRS lets you scale/shape reads and writes independently, but the read views lag the write
      model (eventual consistency) and there are more systems to operate and reason about. Option 0
      is false (that's the opposite of what async projection gives). Options 2 and 3 mischaracterize
      CQRS.
    ref: "concepts.md#scaling-the-data-tier"

  - id: scalability-and-load-balancing-049
    difficulty: advanced
    tags: [capacity, quant, back-of-envelope]
    question: |
      A service must handle 2,000,000 requests/minute at peak. Each backend safely serves 500
      requests/second. Using N+1 redundancy (survive losing one backend at peak), how many backends
      should you run (approximately)?
    options:
      - "About 68"
      - "About 67"
      - "About 34"
      - "About 100"
    answer: 0
    explanation: |
      2,000,000/min = ~33,333 req/s. At 500 req/s each, N = 33,333/500 = ~66.7 -> 67 backends to
      carry peak. N+1 adds one spare so a failure still leaves 67 -> run 68. Option 1 forgets the +1.
      Option 2 halves the load incorrectly. Option 3 is arbitrary.
    ref: "concepts.md#n-plus-one-redundancy-and-capacity-planning"

  - id: scalability-and-load-balancing-050
    difficulty: advanced
    tags: [dual-write, cdc, failure-mode]
    question: |
      Your application code writes to the primary DB and then also writes to Elasticsearch to keep
      search in sync. Over time search drifts out of sync with the DB. What is the root problem and
      the modern fix?
    options:
      - "The DB is too small to hold the index; scale it up to a larger instance so both writes always land together"
      - "Search indexes are inherently unreliable at scale; remove search and query the primary DB with LIKE filters instead"
      - "Dual writes are not atomic — one can succeed while the other fails; use CDC to stream DB changes to the search index from a single source of truth"
      - "Use round robin between the DB and Elasticsearch so each write alternates and both stores stay balanced over time"
    answer: 2
    explanation: |
      Dual-writing to two systems from app code has no shared transaction, so partial failures cause
      drift. CDC (stream the DB changelog to the index) makes the DB the single source of truth and
      keeps derived stores consistent. Options 0, 1, 3 don't address the atomicity problem.
    ref: "concepts.md#scaling-the-data-tier"

  - id: scalability-and-load-balancing-051
    difficulty: advanced
    tags: [multi-az, static-stability, failover]
    question: |
      "Static stability" for multi-AZ resilience means what?
    options:
      - "The system never changes its configuration once deployed, so its behavior stays fixed and predictable forever"
      - "The load balancer must use a single static IP address that clients hard-code so failover never changes the endpoint"
      - "All AZs must run bit-for-bit identical hardware so that capacity math stays uniform across the region"
      - "The system continues operating correctly during an AZ failure without needing to make control-plane changes (e.g., without launching new capacity that may be unavailable during the event)"
    answer: 3
    explanation: |
      Static stability means surviving a failure using capacity/config already in place, rather than
      relying on control-plane actions (like launching new instances) that may themselves be
      impaired during the event — hence pre-provisioned headroom across AZs. Options 0, 2, 1 are
      unrelated meanings.
    ref: "concepts.md#n-plus-one-redundancy-and-capacity-planning"

  - id: scalability-and-load-balancing-052
    difficulty: advanced
    tags: [range-vs-hash, sharding, trade-offs]
    question: |
      For a time-series workload where most queries are "give me the last hour," what is the trade-off
      between range-based and hash-based sharding on the timestamp?
    options:
      - "Hash sharding supports efficient recent-range queries by keeping consecutive timestamps together, while range sharding scatters them across shards"
      - "Range sharding keeps recent data together for efficient range scans but concentrates all recent writes on one shard (hotspot); hash sharding spreads writes but scatters range queries"
      - "Both perform identically for range queries and writes, so the choice of shard strategy has no effect on time-series"
      - "Neither can shard time-series data, because timestamps are monotonic and cannot be used as a partition key"
    answer: 1
    explanation: |
      Range sharding on time keeps a contiguous window on one shard (great for range scans) but the
      newest range absorbs ALL current writes -> write hotspot. Hash sharding spreads writes evenly
      but a range query must scatter/gather across shards. Option 0 reverses this. Options 2 and 3
      are false.
    ref: "concepts.md#scaling-the-data-tier"

  - id: scalability-and-load-balancing-053
    difficulty: advanced
    tags: [autoscaling, feedback-loop, downstream, scenario]
    question: |
      Why should you cap the maximum size of an app-tier auto-scaling group even if you technically
      can scale higher?
    options:
      - "An unbounded app tier can overwhelm a shared downstream (e.g., the database) — effectively DDoSing your own dependency during a spike"
      - "To save money on the load balancer only, since each registered target adds a fixed hourly billing charge"
      - "Because auto-scaling groups are hard-capped at 10 instances and cannot be configured to launch beyond that limit"
      - "To force sticky sessions, since affinity only works when the group size is fixed and never changes"
    answer: 0
    explanation: |
      Without a max, a runaway scale-out floods a shared downstream (DB, third-party API) with more
      concurrency than it can handle, taking it down. The cap plus backpressure/connection limits
      protects the dependency. Option 1 is minor. Option 2 is false. Option 3 is unrelated.
    ref: "concepts.md#auto-scaling-policies"

  - id: scalability-and-load-balancing-054
    difficulty: advanced
    tags: [cell-based, deployment, blast-radius, scenario]
    question: |
      Requirement: "A bad deploy must never impact more than ~5% of customers." Which design most
      directly satisfies this?
    options:
      - "A single large fleet with a fast rollback script that redeploys the previous build the moment errors are detected"
      - "Sticky sessions with IP hash so each customer stays pinned to one node that receives the new build in isolation"
      - "Vertical scaling of every server so a bad build has fewer, larger hosts to propagate across during a rollout"
      - "A cell-based architecture with ~20+ cells and cell-by-cell (wave) deployments so a bad build is caught in early cells before reaching the rest"
    answer: 3
    explanation: |
      With 20+ cells and wave deploys, a bad build lands in one cell (~5% of customers) and is
      caught before rolling further, bounding blast radius by design. A single fleet (option 0) can
      still take everyone down before rollback completes. Options 2 and 1 don't address blast radius
      of deploys.
    ref: "concepts.md#cell-based-architecture"

  - id: scalability-and-load-balancing-055
    difficulty: advanced
    tags: [least-response-time, metrics, trade-offs]
    question: |
      What is a downside of a "least response time / least load" LB algorithm compared to round robin?
    options:
      - "It is architecturally limited to a maximum of two backend nodes and cannot be configured to route across a larger pool"
      - "It has no notion of backend health at all, forwarding requests to crashed or unresponsive nodes just as readily as to healthy ones"
      - "It depends on live latency/load metrics that add complexity and can be noisy or stale, potentially herding traffic toward a momentarily fast node"
      - "It is only compatible with connectionless UDP traffic and cannot be applied to TCP-based protocols such as HTTP or gRPC"
    answer: 2
    explanation: |
      Least-response-time is the most adaptive but needs live, accurate metrics; noisy/stale signals
      can cause oscillation or herd many balancers onto whatever node looked fastest a moment ago.
      Round robin is dumb but stable. Options 0, 1, 3 are false characterizations.
    ref: "concepts.md#load-balancing-algorithms"

  - id: scalability-and-load-balancing-056
    difficulty: advanced
    tags: [geo-routing, data-residency, failure-mode]
    question: |
      A geo-DNS policy routes European users to the EU region for latency. What subtle correctness
      risk must you check?
    options:
      - "EU users will always get strictly lower latency with no downside, so geo routing can be enabled globally without checking anything else about the target region"
      - "The EU region must actually hold (or be able to reach) that user's data; otherwise 'closest region' serves a region that can't satisfy the request, and data-residency rules may be violated"
      - "Geo routing silently disables all backend health checks, so a region kept in the DNS policy keeps receiving European users even after it has fully failed"
      - "Geo routing mandates synchronous global replication across every region before any user can be routed, adding a cross-region write on each request"
    answer: 1
    explanation: |
      Routing by geography/latency only helps if the target region has the user's data and complies
      with residency rules; otherwise you've optimized latency to a region that must do a slow
      cross-region fetch or violates regulations. Option 0 ignores this. Options 2 and 3 are false.
    ref: "concepts.md#dns-load-balancing-and-gslb-geo-and-global"

  - id: scalability-and-load-balancing-057
    difficulty: advanced
    tags: [websocket, sticky, stateless, scenario]
    question: |
      You must scale a WebSocket service where each connection naturally lives on one node. How do
      you reconcile this with stateless best practices?
    options:
      - "Accept that a connection pins to one node, but keep the recoverable/session state in an external store so a dropped connection can reconnect to any node and resume"
      - "Force every WebSocket connection through one designated node so all session state lives in a single place and reconnects always find it"
      - "Disable WebSockets entirely and fall back to short-interval HTTP polling, since long-lived connections are fundamentally incompatible with stateless design"
      - "Use IP-hash affinity so every user is permanently and irreversibly bound to the same node for the full lifetime of their account"
    answer: 0
    explanation: |
      A single WebSocket inherently lives on one node, but the durable state should live externally
      so a reconnect can land anywhere and resume — you get connection locality without making the
      node the source of truth. Option 1 is a bottleneck/SPOF. Option 2 abandons the requirement.
      Option 3 creates hotspots and still loses state on node death.
    ref: "concepts.md#sticky-sessions-and-session-affinity"

  - id: scalability-and-load-balancing-058
    difficulty: advanced
    tags: [predictive-scaling, scheduled, trade-offs, scenario]
    question: |
      A flash sale starts at exactly noon and traffic 20x within seconds. Reactive target-tracking
      alone leaves users with errors for the first minutes. What is the better approach?
    options:
      - "Lower the target-tracking CPU threshold to 5% permanently so the fleet always runs far below capacity and can absorb any sudden burst"
      - "Rely purely on vertical scaling of one very large box, provisioning enough cores and RAM up front to handle the entire 20x flash-sale peak"
      - "Pre-scale with scheduled/predictive scaling ahead of noon (plus headroom and fast-booting compute), because reactive scaling always lags boot time"
      - "Increase the DNS record TTL so clients cache the endpoint longer and retry less often during the initial burst of flash-sale traffic"
    answer: 2
    explanation: |
      Reactive scaling reacts after load rises and pays boot/warm-up time, so for a known spike you
      pre-provision via scheduled or predictive scaling with headroom and fast-starting compute.
      Option 0 wastes money continuously and still lags booting. Option 1 has a hard ceiling and
      SPOF. Option 3 doesn't add capacity.
    ref: "concepts.md#auto-scaling-policies"

  - id: scalability-and-load-balancing-059
    difficulty: advanced
    tags: [cell-based, hot-tenant, migration, failure-mode]
    question: |
      In a cell-based system partitioned by tenant, one tenant grows to exceed a single cell's
      capacity. What is the genuine operational challenge?
    options:
      - "There is no challenge; adjacent cells automatically merge their capacity on demand so an oversized tenant is absorbed with no operator action"
      - "You must abandon the cellular model and convert the whole system back to a single global cell so the tenant is no longer constrained by cell boundaries"
      - "The cell router transparently shards the oversized tenant's data and traffic across all cells at once, spreading the load with no migration needed"
      - "Rebalancing/migrating that tenant to a larger or dedicated cell is a hard, stateful operation, and skewed partition keys can overflow a cell despite the cellular design"
    answer: 3
    explanation: |
      Cellular designs assume the partition key spreads load reasonably; a whale tenant can overflow
      its cell, and moving a live tenant between cells (state migration) is genuinely hard. You need
      per-cell limits + a migration path. Options 0, 2, 1 misstate how cells work.
    ref: "concepts.md#cell-based-architecture"

  - id: scalability-and-load-balancing-060
    difficulty: advanced
    tags: [throughput-vs-latency, batching, trade-offs]
    question: |
      Batching writes and processing them via a queue increases throughput. What is the inherent
      tension with latency?
    options:
      - "Batching reduces both per-item latency and overall throughput at the same time, so it is a strict loss on every dimension and should be avoided"
      - "Batching/queueing raises throughput and resilience but adds per-item latency and delays visibility, so optimizing for throughput can hurt tail latency"
      - "Latency and throughput are entirely independent quantities, so tuning batch size to raise throughput has no measurable effect on per-item latency"
      - "Batching guarantees strong consistency and instant visibility because every item in a batch commits atomically the moment it is enqueued"
    answer: 1
    explanation: |
      Accumulating items to batch (or buffering in a queue) improves throughput/efficiency but each
      item waits, raising latency and delaying when the effect is visible — a direct
      throughput-vs-latency trade-off. Option 0 is contradictory. Option 2 is false. Option 3 is
      false (queuing implies eventual processing).
    ref: "concepts.md#scaling-the-data-tier"

  - id: scalability-and-load-balancing-061
    difficulty: expert
    tags: [cap, multi-region, partition, scenario]
    question: |
      During a network partition between two regions in an active-active setup that allows local
      writes in both, what conflict does the design MUST have a strategy for when the partition heals?
    options:
      - "Concurrent conflicting writes to the same key in both regions must be reconciled (last-writer-wins, CRDTs, or app-level merge), because during the partition each region accepted writes independently"
      - "No conflict can arise, because a network partition automatically blocks writes in both regions until the link is restored and connectivity resumes"
      - "The load balancer detects the divergence on heal and automatically rolls back one region's writes to the other's state, so no reconciliation logic is needed"
      - "The conflict resolves itself once the DNS record TTL expires and resolvers refresh, at which point the two regions silently converge on one value"
    answer: 0
    explanation: |
      If both regions accept writes to the same key while partitioned, they diverge; on heal you must
      reconcile (LWW loses data, CRDTs merge automatically for certain types, or app-level merge).
      This is the fundamental cost of active-active multi-master. Options 1, 2, 3 are false — nothing
      automatically or magically resolves divergent writes.
    ref: "concepts.md#multi-az-and-multi-region-architecture"

  - id: scalability-and-load-balancing-062
    difficulty: expert
    tags: [maglev, l4, consistent-hashing, connection-affinity]
    question: |
      Google's Maglev (software L4 LB) uses consistent hashing so that when the set of Maglev nodes
      or backends changes, existing TCP connections mostly stay pinned to the same backend. Why does
      this matter for an L4 balancer without per-connection state sharing?
    options:
      - "It allows Maglev to parse HTTP request paths and headers so it can make application-layer routing decisions like a Layer 7 proxy"
      - "It lets Maglev terminate and decrypt TLS at line rate so backends receive plaintext without doing any cryptographic work themselves"
      - "It eliminates the need for the TCP protocol entirely, letting flows be delivered reliably over raw IP packets with no handshake"
      - "Because many Maglev machines independently hash each packet; consistent hashing makes them agree on the same backend for a flow even without shared connection tables, minimizing connection resets when membership changes"
    answer: 3
    explanation: |
      Maglev nodes are stateless-ish and each may see packets of the same flow; consistent hashing
      (with its balancing/minimal-disruption properties) makes independent nodes route a given flow
      to the same backend and limits how many flows break when nodes/backends change — avoiding mass
      connection resets. Options 0, 1 are L7 concerns Maglev doesn't do; option 2 is nonsense.
    ref: "concepts.md#load-balancing-algorithms"

  - id: scalability-and-load-balancing-063
    difficulty: expert
    tags: [health-check, grey-failure, scenario]
    question: |
      A node passes its shallow /healthz check (process up, returns 200) but is actually returning
      errors for real user requests due to a corrupt local cache. What failure class is this and what
      complements the health check to catch it?
    options:
      - "Split brain, where two nodes each believe they are the leader; fix it by adding a majority quorum vote to elect a single authoritative primary"
      - "Replication lag, where a follower trails the primary's writes; fix it by provisioning additional read replicas to spread the query load"
      - "Grey failure — the check tests the wrong thing; complement with passive outlier detection on real traffic and SLO-based alerting so real error rates eject/flag the node"
      - "Thundering herd, where many requests recompute an expired value at once; fix it by adding single-flight request coalescing in front of the cache"
    answer: 2
    explanation: |
      Grey failure is when a node looks healthy to a shallow probe but is failing real requests.
      Passive outlier detection (watching actual 5xx/latency) and SLO-based alerting catch what the
      naive check misses. Options 0, 1, 3 name unrelated problems.
    ref: "concepts.md#health-checks-and-failover"

  - id: scalability-and-load-balancing-064
    difficulty: expert
    tags: [sharding, cross-shard-transaction, saga, trade-offs]
    question: |
      After horizontal sharding, an operation must atomically update rows on two different shards.
      What are your realistic options and their trade-offs?
    options:
      - "Single-node ACID transactions still span both shards transparently with no code changes, because the shard router transparently joins the two nodes into one transaction"
      - "Two-phase commit (strong but slow/blocking and reduces availability) or a saga (eventual consistency with compensating actions, more available but no isolation) — you lose easy cross-shard atomicity"
      - "Just point a round-robin load balancer at the two shards so writes alternate between them and both rows are updated in lockstep"
      - "Add a CDN in front of the shards so the two-shard update is cached at the edge and served atomically to every reader from there"
    answer: 1
    explanation: |
      Sharding breaks single-node ACID across shards, so you choose between 2PC (strong consistency
      but slow, blocking, and it hurts availability if a participant is down) or sagas (eventual
      consistency via compensations, more available but no isolation and more app complexity).
      Option 0 is the misconception being tested. Options 2 and 3 are irrelevant.
    ref: "concepts.md#scaling-the-data-tier"

  - id: scalability-and-load-balancing-065
    difficulty: expert
    tags: [autoscaling, oscillation, control-theory, scenario]
    question: |
      Your target-tracking autoscaler keeps adding and removing instances in a rapid cycle
      (flapping). Which combination of causes and fixes is most accurate?
    options:
      - "Cause: too-tight thresholds plus no cooldown/warm-up, so scale actions overshoot before their effect registers; fix: add cooldown/instance-warmup, widen the target band, and scale on a smoother metric"
      - "Cause: the DNS record TTL is set too high, so scaling decisions lag; fix: lower the DNS TTL so capacity changes propagate to clients faster"
      - "Cause: Layer 7 content routing is adding overhead to each scaling probe; fix: switch the load balancer to Layer 4 so metrics are read more quickly"
      - "Cause: the app tier is stateless and loses context between scale events; fix: enable sticky sessions so the autoscaler tracks each node consistently"
    answer: 0
    explanation: |
      Flapping is a control-loop stability problem: reacting before the previous action's effect is
      measured causes oscillation. Cooldown/warm-up periods, a wider target band (hysteresis), and a
      less noisy metric stabilize it. Options 1, 2, 3 are unrelated to the feedback-loop dynamics.
    ref: "concepts.md#auto-scaling-policies"

  - id: scalability-and-load-balancing-066
    difficulty: expert
    tags: [event-sourcing, cqrs, trade-offs]
    question: |
      A team proposes event sourcing (store the immutable log of events as source of truth, derive
      current state) to scale writes and get an audit trail. What is the most accurate trade-off?
    options:
      - "Querying the current state and evolving event schemas both become trivial, since the latest state is stored directly alongside the immutable event log"
      - "Event sourcing removes the need for any read database entirely, because the raw event log itself answers every current-state query fast enough at scale"
      - "You gain a full audit log and replayability, but reconstructing/querying current state is harder, event schema evolution is tricky, and read models must be projected (eventual consistency)"
      - "Event sourcing guarantees strong global read-after-write consistency, since every reader replays the full event log synchronously before returning"
    answer: 2
    explanation: |
      Event sourcing's strengths (audit, replay, temporal queries) come with harder current-state
      queries (you project into read models, typically eventually consistent) and awkward schema
      evolution of historical events. Option 0 is the opposite of reality. Options 1 and 3 are false.
    ref: "concepts.md#scaling-the-data-tier"

  - id: scalability-and-load-balancing-067
    difficulty: expert
    tags: [capacity, bandwidth, quant, back-of-envelope]
    question: |
      A video service streams to 100,000 concurrent viewers at an average 5 Mbps per stream. What is
      the approximate aggregate egress bandwidth, and what is the standard way to serve it economically?
    options:
      - "~50 Gbps; serve the entire stream from a single beefy origin server with a fast enough network card"
      - "~5 Tbps; the bottleneck is the database, so shard it across many nodes to sustain the streaming load"
      - "~5 Gbps; the volume is small enough that no CDN is needed and the origin can handle it directly"
      - "~500 Gbps; offload to a CDN so edge PoPs serve the bytes near users instead of the origin"
    answer: 3
    explanation: |
      100,000 x 5 Mbps = 500,000 Mbps = ~500 Gbps. Serving that from one origin is infeasible/costly;
      a CDN spreads egress across many edge PoPs near users. Option 0 has the right-ish order but
      wrong math and an infeasible plan. Option 2 is off by 100x. Option 1 is wrong math and a DB
      isn't the bottleneck for streaming bytes.
    ref: "concepts.md#caching-and-cdns-to-reduce-load"

  - id: scalability-and-load-balancing-068
    difficulty: expert
    tags: [anycast, tcp, connection-flap, failure-mode]
    question: |
      What is a known drawback of using Anycast for long-lived TCP/TLS connections?
    options:
      - "Anycast is fundamentally incompatible with TCP and can only carry connectionless UDP datagrams, so it cannot be used for HTTP or TLS at all"
      - "A BGP route change can move a flow to a different PoP mid-connection, breaking the established TCP/TLS session and forcing a reconnect"
      - "Anycast guarantees a connection is permanently pinned to its original PoP for its full lifetime, so routing changes can never disturb an in-flight session"
      - "Anycast requires assigning a distinct, unique IP address to every PoP, which defeats the shared-address purpose that makes Anycast useful"
    answer: 1
    explanation: |
      Because Anycast relies on network routing, a BGP reconvergence can steer packets of an existing
      flow to a different PoP that has no state for that connection, resetting it — so Anycast suits
      short/stateless requests better, or you add mechanisms to handle re-pinning. Option 0 is false
      (Anycast is used with TCP, carefully). Options 2 and 3 are false.
    ref: "concepts.md#dns-load-balancing-and-gslb-geo-and-global"

  - id: scalability-and-load-balancing-069
    difficulty: expert
    tags: [decision, holistic, trade-offs, scenario]
    question: |
      A B2B SaaS has ~2,000 tenants, must guarantee that one tenant's bad behavior or a bad deploy
      can't take down others, needs per-tenant data isolation, and has a modest but growing scale.
      Which architecture best fits, and why is it chosen over the alternatives?
    options:
      - "Cell-based architecture partitioned by tenant with wave deploys, because it bounds blast radius, isolates noisy/whale tenants, and enables safe incremental rollouts — accepting added operational complexity"
      - "One giant shared multi-tenant fleet on a single shared database, because it is the simplest and cheapest option and every tenant runs on the same pooled infrastructure"
      - "Active-active multi-region with multi-master writes, because coordinating global write consistency across regions is what enforces isolation between individual tenants"
      - "Pure vertical scaling of one very large instance, because keeping everything on a single node preserves ACID transactions across all tenant data at once"
    answer: 0
    explanation: |
      The hard requirements (blast-radius containment, tenant isolation, safe deploys) point squarely
      at cells partitioned by tenant with wave deploys; the cost is operational complexity, which is
      justified here. Option 1 fails the isolation/blast-radius requirement. Option 2 solves a
      different problem (geo/DR) and adds conflict complexity without addressing isolation. Option 3
      has a ceiling and a single blast radius for all tenants.
    ref: "concepts.md#trade-offs-and-when-to-use-what-summary"

  - id: scalability-and-load-balancing-070
    difficulty: expert
    tags: [read-replica, quorum, consistency, scenario]
    question: |
      You need read scaling AND read-after-write correctness for a specific critical flow (e.g.,
      showing a just-placed order). Which approach best balances both?
    options:
      - "Route every single read to the primary node so all queries see the latest write, accepting that the replicas now serve no traffic and read scaling is lost"
      - "Convert the whole system to fully synchronous replication so every read blocks until all replicas have acknowledged the write it depends on"
      - "Simply provision many more read replicas, on the assumption that adding enough of them makes asynchronous replication lag shrink to zero"
      - "Route most reads to replicas for scale, but route the critical read-your-writes flow to the primary (or a replica confirmed caught up to the write's position) — a targeted consistency exception"
    answer: 3
    explanation: |
      The pragmatic pattern is bulk reads on replicas (scale) with a targeted consistency exception:
      the specific read-after-write path reads the primary or a replica known to be caught up (e.g.,
      via LSN/position tracking or session consistency). Option 0 throws away scaling. Option 2 is
      false (more replicas don't remove lag). Option 1 sacrifices scale/latency globally for a narrow
      need.
    ref: "concepts.md#scaling-the-data-tier"

  - id: scalability-and-load-balancing-071
    difficulty: intermediate
    tags: [weighted-round-robin, heterogeneous, algorithms]
    question: |
      Your fleet is a mix of old 4-core boxes and new 16-core boxes. Which LB algorithm best matches
      traffic to capacity with minimal state?
    options:
      - "Plain round robin, cycling through every node in equal turns regardless of its core count or capacity"
      - "IP hash, deriving a fixed backend from a hash of each client's source IP address"
      - "Weighted round robin (assign weights proportional to capacity)"
      - "Consistent hashing, mapping each request key onto a hash ring of nodes to minimize remapping"
    answer: 2
    explanation: |
      Weighted round robin sends proportionally more requests to higher-capacity nodes with just a
      static weight per node. Plain RR (option 0) overloads the small boxes by treating all nodes
      equally. IP hash (option 1) and consistent hashing (option 3) are about affinity/key routing,
      not capacity matching.
    ref: "concepts.md#load-balancing-algorithms"

  - id: scalability-and-load-balancing-072
    difficulty: intermediate
    tags: [functional-partitioning, microservices, data-tier]
    question: |
      What is functional partitioning (vertical sharding) of a database?
    options:
      - "Splitting the rows of a single table horizontally across many nodes according to a chosen shard key"
      - "Splitting the schema by domain into separate databases (e.g., a users DB and an orders DB)"
      - "Creating read-only replicas of one database to spread query load across additional copies"
      - "Caching frequently-requested query results in an in-memory store such as Redis or Memcached"
    answer: 1
    explanation: |
      Functional/vertical partitioning separates different tables or domains into distinct databases
      (users vs orders), often aligning with microservice data ownership. Option 0 describes
      horizontal sharding. Option 2 is replication. Option 3 is caching. These are distinct rungs on
      the data-scaling ladder.
    ref: "concepts.md#scaling-the-data-tier"

  - id: scalability-and-load-balancing-073
    difficulty: beginner
    tags: [scale-up-then-out, strategy]
    question: |
      What is a commonly recommended default strategy for scaling early in a system's life?
    options:
      - "Scale up (and use multi-AZ) until it becomes uneconomical or hits a ceiling, while designing the app tier stateless so scaling out later is cheap"
      - "Immediately go multi-region active-active, running synchronous multi-master writes across three continents before you have any real users"
      - "Shard the database on day one, splitting every table across a dozen hash-keyed nodes before the first production workload even arrives"
      - "Never use a load balancer; publish each server's raw IP and let clients pick one at random and reconnect elsewhere whenever a node fails"
    answer: 0
    explanation: |
      The pragmatic default: scale vertically for simplicity while keeping the app tier stateless so
      horizontal scaling is cheap when needed later — avoid premature distribution. Options 1 and 2
      are premature over-engineering. Option 3 abandons basic horizontal scalability.
    ref: "concepts.md#horizontal-versus-vertical-scaling"

  - id: scalability-and-load-balancing-074
    difficulty: advanced
    tags: [weighted-dns, canary, region-migration, scenario]
    question: |
      You want to gradually shift 5%, then 25%, then 100% of traffic to a newly launched region to
      de-risk the migration. Which DNS/GSLB feature fits best?
    options:
      - "Geolocation routing that maps each user to a region purely by their country"
      - "IP hash at the L4 LB, pinning each source IP to one region deterministically"
      - "Weighted routing (assign traffic percentages across endpoints)"
      - "Sticky sessions that bind a user to whichever region served their first request"
    answer: 2
    explanation: |
      Weighted routing lets you assign explicit traffic percentages to endpoints and ramp them,
      ideal for canarying a new region. Geolocation (option 0) routes by user location, not a
      percentage ramp. Options 1 and 3 are in-region/session concerns, not global traffic
      percentage control.
    ref: "concepts.md#dns-load-balancing-and-gslb-geo-and-global"

  - id: scalability-and-load-balancing-075
    difficulty: advanced
    tags: [cgnat, ip-hash, affinity, failure-mode]
    question: |
      You enabled IP-hash session affinity, but a huge number of mobile users behind carrier-grade
      NAT (CGNAT) now clump onto one backend. Why, and what's a better affinity mechanism?
    options:
      - "IP hash is fundamentally broken behind any NAT; disable all session affinity permanently and let every request land wherever load allows"
      - "Switch to plain round robin, which provides per-user affinity by remembering each client's previous backend and rotating them back to it"
      - "The clumping means that one backend is simply misconfigured; restart it and the CGNAT users will redistribute evenly across the fleet again"
      - "Thousands of CGNAT users share a few public IPs, so they all hash to the same backend; use cookie-based (application-layer) affinity instead of IP-based"
    answer: 3
    explanation: |
      IP-hash keys on source IP; behind CGNAT many users share one public IP and thus map to one
      backend, creating a hotspot. Cookie-based affinity keys on a per-user cookie, distributing NAT'd
      users properly. Option 0 overreacts. Option 2 misdiagnoses. Option 1 is wrong — round robin
      provides NO affinity.
    ref: "concepts.md#sticky-sessions-and-session-affinity"
