topic: 'Failure Theory: Metastable Failures, Retry Storms and Load Shedding'
domain: system-design
topic_slug: failure-theory-advanced
version: 1
questions:
  - id: failure-theory-advanced-001
    difficulty: beginner
    tags: [taxonomy, crash, byzantine]
    question: |
      Order the classic failure models from easiest to hardest to tolerate.
    options:
      - Crash ⊂ omission ⊂ timing ⊂ Byzantine
      - Byzantine ⊂ timing ⊂ omission ⊂ crash
      - Omission ⊂ crash ⊂ Byzantine ⊂ timing
      - Timing ⊂ crash ⊂ omission ⊂ Byzantine
    answer: 0
    explanation: |
      The models nest crash ⊂ omission ⊂ timing ⊂ Byzantine: a protocol that tolerates a harder
      (more arbitrary) model tolerates all weaker ones. Byzantine (arbitrary/lying) is the hardest and
      most expensive to mask; crash (fail-stop) is the easiest.
    ref: "concepts.md#failure-taxonomy-crash-omission-timing-byzantine-gray-and-partial"
  - id: failure-theory-advanced-002
    difficulty: intermediate
    tags: [taxonomy, gray-failure, health-check]
    question: |
      Why do heartbeat / self-reported health checks routinely miss gray failures?
    options:
      - Gray failures occur only on the network fabric and never on the hosts themselves, so a host-resident health probe has nothing relevant to observe or report
      - 'Because of differential observability: the failing node can still answer its own health probe while its clients see high latency/errors, so it reports ''healthy'''
      - Because heartbeat packets are encrypted end-to-end and their fixed payload has no field for latency or error data, so a probe can only ever report raw liveness
      - Because gray failures are always preceded by a CPU-saturation alarm that fires seconds before any heartbeat, so the heartbeat itself never needs to carry health data
    answer: 1
    explanation: |
      Gray failure (Huang et al.) is defined by differential observability: the component's own
      view disagrees with its clients' view. A node at 200 ms I/O or 99% CPU still answers a ping, so
      fail-stop detection sees "healthy" while callers see a brownout. The fix is client-side/outlier
      detection based on observed latency and error rate.
    ref: "concepts.md#failure-taxonomy-crash-omission-timing-byzantine-gray-and-partial"
  - id: failure-theory-advanced-003
    difficulty: advanced
    tags: [taxonomy, gray-failure, retry-storm]
    question: |
      In a load-balanced pool, why is a single gray (slow-but-alive) node often more dangerous than
      a fully crashed node?
    options:
      - A crashed node keeps all its client connections open and pinned indefinitely, tying up sockets, while a gray node promptly releases every connection and frees those resources
      - A gray node steadily consumes far more disk and inode capacity than a crashed node, so it fills the volume and is evicted by storage alarms long before any latency shows
      - A gray node stays in rotation, absorbs requests, times them out, and triggers retries — turning one slow host into fleet-wide retry amplification, whereas a crashed node is ejected
      - There is no meaningful difference between the two; both are detected and removed identically by the load balancer's standard TCP-port health checks within one interval
    answer: 2
    explanation: |
      A crashed node fails its port/heartbeat check and is removed, so traffic reroutes cleanly. A gray
      node passes the check, keeps receiving requests, makes them slow/fail, and their retries multiply
      load across the fleet. This is why latency/error-based outlier ejection matters more than liveness
      checks.
    ref: "concepts.md#failure-taxonomy-crash-omission-timing-byzantine-gray-and-partial"
  - id: failure-theory-advanced-004
    difficulty: advanced
    tags: [taxonomy, byzantine, consensus, quorum]
    question: |
      A trusted-datacenter service needs to tolerate f simultaneous node failures using crash-fault-
      tolerant consensus (Raft/Paxos). How many replicas are needed, and how does that compare to
      Byzantine fault tolerance?
    options:
      - f+1 for crash; 2f+1 for Byzantine
      - 3f+1 for both
      - 2f for crash; 2f+1 for Byzantine
      - 2f+1 for crash; 3f+1 for Byzantine
    answer: 3
    explanation: |
      Crash-tolerant consensus needs a majority quorum: 2f+1 replicas to tolerate f crash failures.
      BFT (arbitrary/lying nodes) needs 3f+1 and extra message rounds because it must out-vote nodes that
      actively lie differently to different peers. Most datacenter systems assume crash+omission+timing
      and use checksums/TLS to reduce (not fully handle) Byzantine risk.
    ref: "concepts.md#failure-taxonomy-crash-omission-timing-byzantine-gray-and-partial"
  - id: failure-theory-advanced-005
    difficulty: advanced
    tags: [taxonomy, partial-failure, idempotency]
    question: |
      A client's RPC times out. What can it safely conclude about whether the server processed the
      request, and what does that imply?
    options:
      - The request definitely never reached the server, since a timeout proves the packet was dropped in transit, so it is always completely safe to retry the call blindly
      - The request was definitely fully processed before the timeout fired, so any retry is guaranteed to create a duplicate and therefore retrying must be avoided entirely
      - Nothing definitive — the request may not have arrived, may have been processed but the reply lost, or may still be running; this ambiguity is why retries require idempotency/idempotency keys
      - The timeout proves the server has crashed, so the client should immediately fail over to a Byzantine-fault-tolerant protocol to complete the request safely
    answer: 2
    explanation: |
      A timeout is fundamentally ambiguous (partial failure, Waldo et al.): request lost, processed-but-
      reply-lost, or still in flight. Because you cannot distinguish these, at-least-once delivery plus
      idempotency is the only safe basis for retries; this is also why true exactly-once delivery is
      impossible (you get effectively-once via idempotency).
    ref: "concepts.md#failure-taxonomy-crash-omission-timing-byzantine-gray-and-partial"
  - id: failure-theory-advanced-006
    difficulty: intermediate
    tags: [taxonomy, byzantine, cost]
    question: |
      Why do most internal datacenter services deliberately NOT implement full Byzantine fault
      tolerance?
    options:
      - Inside a trusted environment the cost (3f+1 replicas, extra rounds, complexity) rarely justifies the benefit; checksums/TLS reduce arbitrary-corruption risk cheaply, so crash+omission models suffice
      - Regulatory compliance rules prohibit running Byzantine protocols outside chartered financial institutions, so ordinary internal services are legally barred from deploying them
      - BFT protocols by construction can only mask arbitrary/lying nodes and cannot tolerate simple crash-stop failures, so they are useless for the common crash case
      - BFT requires trusted-execution enclaves and hardware security modules on every replica, which standard datacenter fleets are not provisioned with
    answer: 0
    explanation: |
      BFT tolerates arbitrary/malicious behavior but demands 3f+1 replicas and more message rounds. In a
      trusted datacenter with no adversary, that overhead is usually not worth it; engineers assume
      crash+omission+timing and use checksums/TLS to catch the rare corruption. Full BFT is reserved for
      blockchains and a few critical control planes.
    ref: "concepts.md#failure-taxonomy-crash-omission-timing-byzantine-gray-and-partial"
  - id: failure-theory-advanced-007
    difficulty: expert
    tags: [taxonomy, gray-failure, detection]
    question: |
      You must detect gray failures that self-health-checks miss. Which detection strategy is most
      aligned with the nature of gray failure?
    options:
      - Increase the frequency of the node's own liveness heartbeat so the failing node reports its status many times per second and the gap is caught sooner
      - Add a second independent self-health endpoint on the failing node that runs deeper internal diagnostics and cross-checks the first probe's result
      - Rely solely on CPU-utilization alarms, since a gray failure always drives CPU past its threshold and fires the alarm before clients notice anything
      - Use client-observed signals — per-upstream latency and error-rate outlier detection — and eject the node from the caller's perspective, since gray failure is defined by the caller/component view gap
    answer: 3
    explanation: |
      Gray failure is differential observability: the node's own view says healthy. Only the clients'
      view exposes it, so detection must be client-side/outlier-based (e.g., Envoy outlier ejection on
      observed latency/errors). Faster self-heartbeats or a second self-endpoint still reflect the node's
      own (wrong) view; CPU alarms don't fire for slow-disk or packet-loss gray failures.
    ref: "concepts.md#failure-taxonomy-crash-omission-timing-byzantine-gray-and-partial"
  - id: failure-theory-advanced-008
    difficulty: expert
    tags: [metastable, definition, feedback-loop]
    question: |
      What most precisely distinguishes a metastable failure from an ordinary overload?
    options:
      - Metastable failures only ever occur on chronically under-provisioned systems that lack the capacity headroom needed to absorb any burst above their baseline traffic
      - The bad state persists via a self-reinforcing feedback loop even after the triggering event is gone, so removing the trigger does not recover the system
      - Metastable failures always resolve themselves within a few seconds once the initial triggering spike subsides, requiring no operator intervention to recover
      - Metastable failures are caused exclusively by hardware faults such as failing disks or NICs, whereas ordinary overload is caused only by excess software-level request volume
    answer: 1
    explanation: |
      Bronson et al.'s defining property: a trigger pushes the system past a barrier into a bad
      (metastable) state, and a *sustaining effect* (positive feedback, e.g. retries) holds it there
      even after the trigger disappears. Ordinary overload recovers when load drops; a metastable
      failure needs external intervention (shed load, drain, restart) to escape.
    ref: "concepts.md#metastable-failures-and-feedback-loops"
  - id: failure-theory-advanced-009
    difficulty: expert
    tags: [metastable, capacity, headroom]
    question: |
      Why can a MORE generously provisioned system be MORE susceptible to metastable failure?
    options:
      - Because amplification (e.g. retries) is multiplicative on baseline load, so more normal traffic means a larger absolute surge on the trigger; and headroom hides how close the system runs to an invisible cliff
      - Extra provisioned capacity always fully eliminates the positive feedback loops, because the added headroom absorbs every retry surge before it can sustain itself
      - Larger, more generously provisioned fleets never experience correlated failures, because the extra nodes statistically decorrelate faults across the pool
      - Adding more servers automatically lowers the sustaining threshold beneath the trigger threshold, which by definition makes a metastable state impossible to enter
    answer: 0
    explanation: |
      Bronson's insight: metastability arises when sustaining load < trigger load. Headroom lets the
      system sit happily near an unseen cliff, and because retry/queue amplification multiplies baseline
      traffic, higher normal load produces a bigger absolute amplified surge when the trigger hits.
      Capacity is prevention, not immunity.
    ref: "concepts.md#metastable-failures-and-feedback-loops"
  - id: failure-theory-advanced-010
    difficulty: advanced
    tags: [metastable, retry-storm, remediation]
    question: |
      A service is pinned at 100% CPU with near-zero goodput. Restarting clients and adding hosts have
      not helped. What is the MOST likely dynamic and the correct first move?
    options:
      - A CPU-bound bug introduced by the latest release; roll back the last deploy and wait for the fleet to settle back to normal utilization on its own
      - A metastable retry storm; adding capacity feeds the amplifier, so shed load below the sustaining threshold and curtail retries (open breakers / drain retry budget) to break the feedback loop
      - A DNS-resolution failure causing repeated lookups; flush the DNS caches fleet-wide and lower the resolver TTL so records refresh faster
      - A disk-full condition starving the request path of scratch space; expand the underlying volumes and let the pending requests retry once storage frees up
    answer: 1
    explanation: |
      Pinned CPU + near-zero goodput + no help from capacity is the signature of a metastable failure
      sustained by amplification (usually retries). The loop is self-sustaining, so you must reduce work:
      shed load below the *sustaining* threshold (not just the trigger) and stop the amplification. Adding
      hosts or telling clients to retry pours fuel on the fire.
    ref: "concepts.md#metastable-failures-and-feedback-loops"
  - id: failure-theory-advanced-011
    difficulty: advanced
    tags: [metastable, cache, thundering-herd]
    question: |
      After a cache cluster restart, latency stays catastrophic long after the restart completes. Which
      description best captures the sustaining effect?
    options:
      - The restart physically damaged the cache nodes' memory modules, so the hardware can no longer hold entries and every lookup is forced to miss permanently
      - The restart procedure inadvertently dropped the backing database schema, so every read now errors and the latency reflects failed queries rather than cache behavior
      - All requests miss and stampede the database; the DB is now too slow to serve cache fills, so the cache stays empty and misses continue — an empty-cache feedback loop, not the restart itself
      - The renegotiated TLS handshakes between clients and the restarted cache have become the bottleneck and never manage to complete, so no request reaches the cache at all
    answer: 2
    explanation: |
      This is cache-empty thundering-herd metastability: the trigger (restart) is gone, but the empty
      cache is sustained because the overwhelmed DB can't complete the fills, so misses persist. Breaking
      it requires reducing DB pressure (request coalescing/single-flight fills, shedding, serving stale)
      — not waiting or re-restarting.
    ref: "concepts.md#metastable-failures-and-feedback-loops"
  - id: failure-theory-advanced-012
    difficulty: expert
    tags: [metastable, remediation, threshold]
    question: |
      When breaking a metastable failure by shedding load, why is it critical to get BELOW the sustaining
      threshold rather than just below the original trigger level?
    options:
      - Because the trigger threshold is always numerically higher than the sustaining threshold, so shedding to just under the trigger is by definition already under the sustaining threshold too
      - Because dropping load below the contractual trigger level violates the customer SLA, whereas shedding to the lower sustaining level is the only rate the SLA permits
      - It is not actually critical; any reduction in offered load, even a small one just under the trigger, lets the system recover to healthy goodput immediately
      - Because the feedback loop keeps the system in the bad state at any load above the sustaining threshold; only dropping beneath it lets the queue drain and goodput recover
    answer: 3
    explanation: |
      The defining property is sustaining load < trigger load. Bringing load back to just under the
      trigger still leaves it above the sustaining threshold, so the loop persists. You must push under
      the sustaining threshold so work-in < capacity and the backlog drains — then you can ramp traffic
      back gradually.
    ref: "concepts.md#metastable-failures-and-feedback-loops"
  - id: failure-theory-advanced-013
    difficulty: intermediate
    tags: [metastable, gc, feedback-loop]
    question: |
      Which sequence describes a GC death-spiral metastable failure?
    options:
      - Low load → GC runs rarely → per-request latency steadily drops → offered load falls even further into an ever-quieter steady state
      - GC is disabled entirely → memory leaks accumulate → process hits OOM → supervisor restarts it → system returns cleanly to normal operation
      - Load bump → more allocation → more frequent GC → GC steals CPU → requests slow → queue grows → more live objects retained → even more GC
      - Cache warms and fills → GC pauses stop occurring altogether → sustained throughput doubles above the pre-warm baseline
    answer: 2
    explanation: |
      A GC spiral is a positive feedback loop: rising load increases allocation and GC frequency, GC
      steals CPU from request processing, latency rises, queues deepen, more objects stay live longer,
      which increases heap pressure and GC further. Heap pressure sustains itself even after load
      normalizes.
    ref: "concepts.md#metastable-failures-and-feedback-loops"
  - id: failure-theory-advanced-014
    difficulty: advanced
    tags: [retry-amplification, math, layers]
    question: |
      An edge service, a middle service, and a data service each retry up to 3 attempts on failure.
      During a partial datastore failure, what is the worst-case load multiplication at the datastore?
    options:
      - 27× (3 × 3 × 3)
      - 3× (3 attempts)
      - 9× (3 + 3 + 3)
      - 6× (3 + 3)
    answer: 0
    explanation: |
      Independent retries at each of L layers multiply: r^L = 3^3 = 27×. Each layer re-issues the failing
      call up to 3 times, and those multiply down the stack. This is why the rule is to retry at ONE
      layer only and propagate a deadline / do-not-retry signal downstream.
    ref: "concepts.md#retry-amplification-math-and-retry-budgets"
  - id: failure-theory-advanced-015
    difficulty: advanced
    tags: [retry-amplification, retry-budget, token-bucket]
    question: |
      Why does a token-bucket retry budget bound amplification during a broad outage where a fixed
      "retry N times per request" policy does not?
    options:
      - The token bucket issues its retries at a faster rate than a fixed-N policy, so it clears the underlying dependency outage sooner and never needs to bound volume
      - The token bucket implicitly disables client-side timeouts, so calls simply wait for eventual success and no retries are ever generated to amplify load
      - A fixed 'retry N times' policy never actually re-issues the call in practice, so there is no retry volume for it to bound in the first place
      - The budget caps retries as a fraction of total requests (e.g. 10%); under broad failure the bucket empties and retries stop, so amplification is bounded at ~1 + budget instead of N×
    answer: 3
    explanation: |
      A per-request "N attempts" policy still yields up to N× load when *all* requests fail. A
      token-bucket budget limits retries to a fraction of successful traffic; when failures are broad the
      bucket drains and retries self-disable, capping amplification at roughly 1 + budget (e.g. 1.1×)
      regardless of failure breadth. This is the gRPC/Finagle/Envoy approach.
    ref: "concepts.md#retry-amplification-math-and-retry-budgets"
  - id: failure-theory-advanced-016
    difficulty: intermediate
    tags: [retry-amplification, single-layer]
    question: |
      To minimize retry amplification in a multi-layer call chain, at which layer should retries
      generally be performed?
    options:
      - At every layer in the chain, so each tier can independently recover from a transient fault without depending on any other layer to retry for it
      - At exactly one layer — typically the one nearest the client that can still meet the deadline — with lower layers passing failures through and not independently retrying
      - Only at the deepest data layer nearest the datastore, and never at any higher tier, so retries stay closest to where faults actually originate
      - Retries should be disabled entirely at every layer, since any retry at all risks amplifying load during a correlated dependency outage
    answer: 1
    explanation: |
      Retrying at multiple layers multiplies load (r^L). The standard rule is to retry at one layer only
      (usually the one closest to the client that still has deadline budget) and have lower layers fail
      fast, avoiding the multiplicative blowup while still recovering from transient faults.
    ref: "concepts.md#retry-amplification-math-and-retry-budgets"
  - id: failure-theory-advanced-017
    difficulty: advanced
    tags: [retry-amplification, when-to-retry, correlation]
    question: |
      Retries are appropriate for which class of failure, and harmful for which?
    options:
      - Appropriate for transient, independent, uncorrelated failures; harmful for correlated/overload failures where retrying deepens the overload
      - Appropriate for correlated overload failures, where a second attempt bypasses the saturated path; harmful for transient packet loss, where retrying wastes effort
      - Appropriate for every class of failure equally, provided that jittered exponential backoff is applied to space the attempts out over time
      - Appropriate only for non-idempotent operations, since retrying an idempotent call can never change the observed result anyway
    answer: 0
    explanation: |
      Retries help when the failure is transient and independent (a dropped packet, one bad host) — a
      second try is likely to hit a healthy path. They hurt when the failure is correlated/overload,
      because the dependency is failing *because* it's overloaded, and retrying adds load. Also retries
      require idempotency and must skip non-retryable errors.
    ref: "concepts.md#retry-amplification-math-and-retry-budgets"
  - id: failure-theory-advanced-018
    difficulty: intermediate
    tags: [retry-amplification, non-retryable]
    question: |
      Why should a client NOT retry a 400/404/auth-failure response?
    options:
      - Because 4xx responses are always returned in an encrypted form the client cannot re-sign, so a retried request would be rejected at the transport layer regardless
      - Because such errors are deterministic and will never succeed on retry — retrying only burns retry budget and adds useless load
      - Because retrying a 404 response corrupts the request in flight and induces a Byzantine fault that a crash-tolerant client cannot mask
      - Because 4xx responses are always transient client-side glitches that clear on their own, so waiting is strictly better than issuing another attempt
    answer: 1
    explanation: |
      Client errors (bad request, not found, unauthorized) are deterministic: the same request will fail
      identically. Retrying cannot succeed; it just consumes the retry budget and adds load that should be
      reserved for genuinely transient failures. Only retry retryable (typically transient 5xx/timeout)
      errors.
    ref: "concepts.md#retry-amplification-math-and-retry-budgets"
  - id: failure-theory-advanced-019
    difficulty: expert
    tags: [retry-amplification, budget, backoff]
    question: |
      A team already uses jittered exponential backoff on retries. Why is that alone insufficient to
      prevent a retry storm during a broad dependency outage?
    options:
      - Backoff replaces the need for per-call timeouts, so requests simply wait through each doubling interval and eventually hang indefinitely on a dead dependency instead of failing fast
      - Adding jitter raises the number of retry attempts each request makes, because randomized delays reset the attempt counter, so a jittered policy inherently issues more calls than a fixed one
      - Backoff spreads retries in TIME but does not cap their total VOLUME; if nearly all requests fail, the aggregate retry load still overwhelms the dependency — you also need a budget or breaker
      - Exponential backoff is only valid for idempotent operations, and since most real endpoints are non-idempotent writes, backoff simply cannot be applied broadly enough to stop a storm
    answer: 2
    explanation: |
      Backoff+jitter de-synchronize retries across time so they don't arrive as one spike, but they do
      not limit how many retries occur. Under a broad outage where most requests fail, the summed retry
      volume still amplifies load. Capping volume requires a token-bucket retry budget or a circuit
      breaker; backoff and budget are complementary, not substitutes.
    ref: "concepts.md#retry-amplification-math-and-retry-budgets"
  - id: failure-theory-advanced-020
    difficulty: intermediate
    tags: [backoff, jitter, thundering-herd]
    question: |
      Why is jitter added to exponential backoff?
    options:
      - To make retry timing fully deterministic across the fleet so that on-call engineers can predict the exact instant of each retry wave and debug incidents more easily
      - To raise the maximum retry ceiling, because randomizing the delay grants each client one additional attempt beyond the configured cap before it finally gives up
      - To encrypt the retry payload with a per-attempt random nonce, so that replayed or duplicated retries can be detected and rejected by the receiving server
      - To de-correlate clients in time so they don't all retry at the same instants and re-form synchronized load spikes (thundering herd)
    answer: 3
    explanation: |
      Pure exponential backoff still has all failed clients waiting the same base, 2×base, 4×base — they
      retry in synchronized waves. Jitter randomizes each client's delay so retries spread out and don't
      re-cluster into spikes. It is not about determinism, retry count, or encryption.
    ref: "concepts.md#exponential-backoff-and-jitter"
  - id: failure-theory-advanced-021
    difficulty: advanced
    tags: [backoff, jitter, full-jitter]
    question: |
      In Marc Brooker's AWS analysis, how is "full jitter" computed, and what was its notable result?
    options:
      - sleep = base × 2^attempt with no randomness added; the analysis found this pure-exponential form minimized end-to-end latency variance while keeping retries tightly synchronized
      - sleep = min(cap, base × 2^attempt) plus a fixed 100 ms floor on every attempt; the study reported it eliminated retries entirely once the ceiling was reached
      - sleep = random(0, min(cap, base × 2^attempt)); it produced the fewest total competing calls in the simulations
      - sleep = random(cap, 2×cap) on each attempt; the paper concluded it guaranteed a fixed minimum spacing between every client's successive retry attempts
    answer: 2
    explanation: |
      Full jitter picks a uniformly random wait between 0 and the current exponential ceiling
      min(cap, base·2^attempt). In Brooker's simulations it minimized the total number of competing calls
      and completion time by fully de-synchronizing clients — showing that adding randomness reduces total
      work rather than increasing it.
    ref: "concepts.md#exponential-backoff-and-jitter"
  - id: failure-theory-advanced-022
    difficulty: expert
    tags: [backoff, jitter, decorrelated]
    question: |
      When would you prefer DECORRELATED jitter (sleep = min(cap, random(base, prev_sleep × 3))) over
      full jitter?
    options:
      - When you want backoff to climb quickly and stay well-spread without maintaining a per-attempt counter, deriving each delay from the previous sleep instead of an attempt number
      - When you specifically want every client's retries to fire in perfect synchronization, so the dependency receives one clean predictable wave rather than a smeared-out stream of attempts
      - When a compliance or auditing requirement forbids any randomness in timing, so decorrelated jitter is chosen precisely because it produces a fixed, reproducible delay sequence
      - When the downstream dependency requires exactly-once delivery, since decorrelated jitter is the mechanism that suppresses the duplicate retries that would otherwise break that guarantee
    answer: 0
    explanation: |
      Decorrelated jitter grows each delay from the previous sleep (random between base and 3× last),
      giving strong spread and fast climb without tracking an attempt count. It's handy when you don't
      want to thread an attempt counter through the code and still want increasing, well-spread backoff.
      Both full and decorrelated jitter perform well; the choice is about state/behavior, not correctness.
    ref: "concepts.md#exponential-backoff-and-jitter"
  - id: failure-theory-advanced-023
    difficulty: advanced
    tags: [backoff, deadline, tail-latency]
    question: |
      What is a key downside of exponential backoff for a synchronous, user-facing request, and how is
      it bounded?
    options:
      - It steadily lowers each retry's probability of success as the delay grows; you bound this by disabling retries entirely once the second attempt fails so success can no longer degrade
      - It corrupts the request payload during the wait because buffered bytes decay in the socket, so you bound the damage by attaching a checksum that the server revalidates on arrival
      - It induces Byzantine faults, since a request that arrives after a long backoff looks like a lying replica to the server, so you bound it by running 3f+1 replicas to out-vote the confusion
      - It increases the retried request's tail latency because you deliberately wait; it must be bounded by the request deadline so you never back off past the point where a response can still be delivered
    answer: 3
    explanation: |
      Backoff intentionally waits, adding latency to the retried request — fine for background/async work
      but harmful when a user is blocked and a deadline is ticking. The fix is to clamp backoff to the
      remaining deadline: never sleep past the point where success could still arrive in time.
    ref: "concepts.md#exponential-backoff-and-jitter"
  - id: failure-theory-advanced-024
    difficulty: beginner
    tags: [backoff, no-jitter]
    question: |
      What happens if 10,000 clients use pure exponential backoff with NO jitter after failing
      simultaneously?
    options:
      - They spread out perfectly and never collide, because exponential doubling alone guarantees each of the 10,000 clients lands in its own distinct time slot with no overlap
      - They all wait the same intervals and retry in synchronized waves, preserving the load spikes backoff was meant to smooth
      - They stop retrying entirely after the first backoff interval, since a pure exponential schedule with no jitter caps the total attempts at exactly one per client
      - Each client automatically picks its own random delay, because the standard library inserts implicit jitter whenever more than a few thousand clients share a backoff loop
    answer: 1
    explanation: |
      Without jitter every client waits identical base, 2×base, 4×base intervals, so they retry in lockstep
      — the average rate drops but the synchronized spikes remain. Jitter is what actually de-synchronizes
      them.
    ref: "concepts.md#exponential-backoff-and-jitter"
  - id: failure-theory-advanced-025
    difficulty: intermediate
    tags: [circuit-breaker, states]
    question: |
      In a circuit breaker, what happens in the HALF-OPEN state?
    options:
      - A limited number of trial requests are allowed through; success closes the breaker, any failure re-opens it (often extending the cool-down)
      - All traffic flows through normally and failures are no longer counted, because half-open is the steady-state mode the breaker settles into once a dependency is presumed healthy again
      - The breaker rejects every incoming request permanently and can only be reset by an operator manually clearing the tripped state through an administrative command
      - The breaker duplicates each request to two independent dependencies and returns whichever responds first, using the second copy to probe recovery in the background
    answer: 0
    explanation: |
      HALF-OPEN is the probe state entered after the OPEN cool-down: a limited number of trial requests
      test whether the dependency recovered. If they succeed the breaker closes; if any fail it re-opens.
      Letting the full herd through in half-open would recreate the storm, so probes must be limited.
    ref: "concepts.md#circuit-breakers"
  - id: failure-theory-advanced-026
    difficulty: advanced
    tags: [circuit-breaker, granularity]
    question: |
      Why is a single GLOBAL circuit breaker for an entire service usually a poor design?
    options:
      - Global breakers are architecturally unable to enter the half-open probe state, so once tripped they can never test recovery and must stay open until the process restarts
      - One bad shard/endpoint/instance can trip the global breaker and cut off traffic to the healthy ones; per-dependency or per-instance breakers isolate the failure
      - Global breakers require a Byzantine-consensus round across all callers to update their shared trip state, adding several message rounds of latency to every request
      - Global breakers are hardwired to always fail closed and never actually open, so they pass every request through even when the dependency is completely down
    answer: 1
    explanation: |
      A global breaker couples unrelated failures: a single failing dependency, shard, or gray node trips
      it and blocks the healthy paths too. Per-dependency (Hystrix commands) or per-upstream/per-instance
      (Envoy outlier ejection) breakers eject only the failing part while the rest keeps serving.
    ref: "concepts.md#circuit-breakers"
  - id: failure-theory-advanced-027
    difficulty: advanced
    tags: [circuit-breaker, threshold, rate]
    question: |
      Why should a circuit breaker trip on a failure RATE with a minimum request volume rather than a
      raw failure COUNT?
    options:
      - Raw counts are trivially cheaper to compute than rolling percentages, so tripping on a rate is purely a cosmetic dashboard preference with no real behavioral difference
      - A failure rate cannot be computed without a Byzantine-consensus round to agree on the shared denominator across callers, whereas a raw count needs no coordination at all
      - A raw count like '5 failures' behaves very differently at 10 rps vs 10,000 rps; a rate with a min-volume guard is load-independent and won't flap on a single error at low traffic
      - Raw counts trip far too slowly under high load, because the counter must roll all the way over its 32-bit maximum before the breaker recognizes the threshold has been crossed
    answer: 2
    explanation: |
      A fixed count is load-sensitive: 5 failures is catastrophic at 10 rps but negligible at 10,000 rps.
      Tripping on a failure percentage over a window makes the threshold load-independent, and a
      minimum-request-volume guard prevents a low-traffic breaker from flapping on one stray error.
    ref: "concepts.md#circuit-breakers"
  - id: failure-theory-advanced-028
    difficulty: expert
    tags: [circuit-breaker, concurrency-limiter, tradeoff]
    question: |
      A dependency degrades GRACEFULLY under load (rising latency, partial success) rather than being
      cleanly up/down. Why might an adaptive concurrency limiter be a better fit than a circuit breaker?
    options:
      - Circuit breakers can only be configured once for the whole process and cannot be scoped per endpoint, so they are unable to target the single degrading dependency in the first place
      - Adaptive concurrency limiters require no configuration whatsoever and are mathematically incapable of failing, so they are strictly superior to breakers in every possible situation
      - Circuit breakers unavoidably layer in Byzantine-fault tolerance across replicas, and that extra voting overhead is wasted effort against a dependency that is merely slow rather than lying
      - A breaker is binary (fully on/off) and will either over- or under-shoot on a gracefully degrading dependency, whereas an adaptive limiter continuously finds the safe concurrency and keeps serving what the dependency can handle
    answer: 3
    explanation: |
      A breaker is a coarse binary tool ideal for binary up/down dependencies. For a dependency that
      degrades continuously, a breaker either trips too early (throwing away serviceable capacity) or too
      late; an adaptive concurrency limiter (Netflix concurrency-limits, gradient/TCP-Vegas style)
      continuously converges on the safe in-flight limit and keeps serving at that rate.
    ref: "concepts.md#circuit-breakers"
  - id: failure-theory-advanced-029
    difficulty: advanced
    tags: [circuit-breaker, false-trip, half-open]
    question: |
      Which is a genuine failure mode of circuit breakers that must be tuned against?
    options:
      - By construction they guarantee zero false positives, so a correctly configured breaker mathematically never trips on a dependency that was actually healthy at the time
      - They can only ever be applied to strictly idempotent operations, because tripping mid-flight on a non-idempotent call would leave the dependency in an inconsistent partial state
      - False trips on a brief blip can cut off a dependency that was actually recovering, and an unrestricted half-open probe can re-send the full herd and recreate the storm
      - After the very first successful probe they permanently disable the dependency and route around it forever, requiring a full redeploy to bring that dependency back into rotation
    answer: 2
    explanation: |
      Breakers trade availability for recovery, so they can misfire: too-sensitive thresholds trip on
      transient blips and cut off a healthy/recovering dependency (a self-inflicted outage), and a
      half-open that admits the full herd to "test" recreates the surge. Thresholds must be tuned from
      real p99/error data and half-open must be single-flight/limited.
    ref: "concepts.md#circuit-breakers"
  - id: failure-theory-advanced-030
    difficulty: beginner
    tags: [timeout, purpose]
    question: |
      What is the primary purpose of putting a timeout on every remote call?
    options:
      - To convert an unbounded wait on a hung dependency into a bounded, handleable failure so hung calls can't exhaust your thread/connection pool
      - To speed up healthy requests on the happy path, because a tight deadline lets the scheduler prioritize the timed call ahead of untimed background work on the same thread
      - To guarantee exactly-once processing, since a request that completes before its timeout is provably delivered exactly one time and can never be duplicated by a retry
      - To encrypt the request in transit, because the timeout value is folded into the TLS session key and a call without one would travel unprotected over the wire
    answer: 0
    explanation: |
      A timeout bounds how long you wait; without it, a hung dependency holds threads/connections forever
      and enough hung calls take your own service down. It doesn't speed up healthy calls, provide
      exactly-once semantics (that's idempotency), or encrypt anything.
    ref: "concepts.md#timeouts-and-deadline-propagation"
  - id: failure-theory-advanced-031
    difficulty: advanced
    tags: [timeout, percentile, false-positive]
    question: |
      Why is setting a client timeout exactly at the dependency's p99 usually too aggressive?
    options:
      - The p99 latency of a dependency is fundamentally impossible to measure in production, so any timeout derived from it is guesswork and will always be set incorrectly
      - A p99-based timeout is in fact always far too long rather than too short, because the 99th percentile sits well above the tail and never trims any genuinely slow requests
      - Timeouts should never be derived from measured latency at all; the only sound practice is to hard-code a fixed round number such as one second regardless of the dependency
      - A p99 timeout fails ~1% of otherwise-healthy requests as false positives, and those trigger retries that add self-inflicted load; p99.9/p99.99 plus margin is more typical
    answer: 3
    explanation: |
      By definition ~1% of healthy requests exceed p99, so a p99 timeout aborts them unnecessarily,
      then those get retried — adding load precisely when you don't want it. Setting the timeout at
      p99.9/p99.99 plus margin avoids killing healthy-but-slow requests while still catching true hangs.
    ref: "concepts.md#timeouts-and-deadline-propagation"
  - id: failure-theory-advanced-032
    difficulty: expert
    tags: [timeout, deadline-propagation, wasted-work]
    question: |
      Edge gives a user a 1 s budget and calls A→B→C, each with its own independent 1 s per-hop timeout.
      What problem does this create and how does deadline propagation fix it?
    options:
      - There is no problem at all; independent 1 s per-hop timeouts are provably optimal because giving each hop a full fresh second maximizes the overall chance the request eventually succeeds
      - C may still be working after the edge already gave up (wasted work on a doomed request, which amplifies load); a propagated absolute deadline lets each hop use the REMAINING time and skip work that can't finish in time
      - The independent per-hop timeouts cause Byzantine faults downstream, because each hop reports a different elapsed time, and propagating a single deadline is what forces the hops to agree
      - Propagating a deadline makes each hop wait strictly longer than its own timeout would, which improves the success rate by giving slow dependencies extra grace beyond the user budget
    answer: 1
    explanation: |
      Per-hop timeouts reset the clock at every hop, so downstream hops keep working long after the edge's
      1 s budget expired — wasted, amplifying work. A deadline (absolute now+budget) propagated downstream
      lets each hop compute remaining = deadline−now, cap its timeout to that, and abandon immediately if
      the deadline already passed. gRPC deadlines work this way.
    ref: "concepts.md#timeouts-and-deadline-propagation"
  - id: failure-theory-advanced-033
    difficulty: advanced
    tags: [timeout, too-short, self-inflicted]
    question: |
      What is the self-inflicted failure mode of setting timeouts TOO short?
    options:
      - You abort requests that would have succeeded, then retry them — generating extra load and potentially driving the very overload the short timeout was meant to avoid
      - Threads pile up indefinitely waiting on hung dependencies, because a short timeout never actually fires and the caller's pool slowly exhausts as calls accumulate unbounded
      - The dependency is never given any chance to fail, so it lingers in a half-broken state forever and the supervisor can never restart it to recover cleanly
      - The TLS encryption handshakes between caller and dependency never manage to complete, because a short timeout truncates the negotiation before the session key can be exchanged
    answer: 0
    explanation: |
      Too-short timeouts produce false positives: healthy-but-slightly-slow requests are killed and
      retried, adding load. Under stress this becomes a self-inflicted amplification loop. (Too-long
      timeouts have the opposite failure: threads pile up on hangs and detection is slow.) Both extremes
      are bad; set from data with margin.
    ref: "concepts.md#timeouts-and-deadline-propagation"
  - id: failure-theory-advanced-034
    difficulty: expert
    tags: [timeout, deadline, clock-skew]
    question: |
      Why do frameworks like gRPC propagate a REMAINING DURATION rather than an absolute wall-clock
      timestamp for deadlines?
    options:
      - A remaining duration serializes into far fewer bytes on the wire than an absolute timestamp, so propagating durations measurably shrinks every request header and saves bandwidth at scale
      - Propagating a relative remaining duration avoids clock-skew bugs between hosts; an absolute wall-clock deadline would be misinterpreted if the sender and receiver clocks disagree
      - Absolute wall-clock timestamps simply cannot be represented anywhere in the gRPC wire format, so a relative duration is the only value the protocol is technically able to carry
      - Propagating a duration rather than a timestamp is what enables exactly-once semantics, because the receiver uses the remaining-time value as a dedupe key to discard replayed requests
    answer: 1
    explanation: |
      Hosts don't share a perfectly synchronized clock, so an absolute wall-clock deadline would be
      read differently across skewed clocks. Sending the remaining duration lets each hop apply it against
      its own local clock (deadline = local_now + remaining), sidestepping cross-host clock skew.
    ref: "concepts.md#timeouts-and-deadline-propagation"
  - id: failure-theory-advanced-035
    difficulty: intermediate
    tags: [load-shedding, goodput]
    question: |
      Without load shedding, what typically happens to GOODPUT (useful completed work) as offered load
      passes capacity?
    options:
      - Goodput rises to the capacity level and then plateaus perfectly flat, holding steady at that ceiling no matter how far offered load climbs beyond it
      - Goodput keeps increasing linearly with offered load forever, because each additional request contributes proportional useful work regardless of how saturated the system becomes
      - Goodput collapses toward zero, because resources are spent on requests that will time out anyway (dead work), rather than plateauing
      - Goodput is completely unaffected by offered load, since the amount of useful work a service completes is fixed by its code path and independent of incoming volume
    answer: 2
    explanation: |
      Past capacity, queues grow and latency explodes; requests time out before completing, so the system
      burns resources on work that produces no value and goodput collapses off a cliff rather than
      plateauing. Shedding keeps the system on the plateau by rejecting excess work cheaply and early.
    ref: "concepts.md#load-shedding-and-brownout"
  - id: failure-theory-advanced-036
    difficulty: advanced
    tags: [load-shedding, where, cost]
    question: |
      Where should load be shed, and why?
    options:
      - As deep in the stack as possible, only after the expensive work has already run, so you can confirm from the result that the request genuinely needed serving before deciding to drop it
      - Only inside the database tier, since that is where overload always originates, and shedding anywhere earlier would discard requests the database could still have absorbed
      - It genuinely does not matter where the drop happens, as long as roughly the right total percentage of offered requests is discarded somewhere along the path
      - As early and cheaply as possible — at the load balancer / front door before CPU/DB is spent — and the shed action must cost far less than serving, or the shedder itself becomes the bottleneck
    answer: 3
    explanation: |
      Shedding after you've already spent CPU/DB on a request wastes exactly the resources you're trying
      to protect. Shed at the earliest, cheapest point (front door / LB) and ensure rejection is far
      cheaper than serving; otherwise the shedding path becomes the new bottleneck.
    ref: "concepts.md#load-shedding-and-brownout"
  - id: failure-theory-advanced-037
    difficulty: expert
    tags: [load-shedding, lifo, overload]
    question: |
      Why can switching a request queue from FIFO to LIFO IMPROVE goodput specifically under overload?
    options:
      - LIFO is strictly fairer than FIFO because it services every waiting request in a perfectly balanced round-robin, and that fairness is precisely what raises goodput under overload by guaranteeing no request is ever starved regardless of queue depth
      - LIFO lets the queue release its memory back to the OS on every pop, so under overload its resident footprint effectively drops to zero and the freed memory is what restores goodput once the allocator stops paging
      - Under overload the front of a deep FIFO queue is stale and likely past its deadline, so serving it is wasted work; LIFO serves the freshest requests (most likely still within deadline) and lets stale ones drop, maximizing useful completions
      - LIFO guarantees exactly-once processing under overload because reversing the service order lets the runtime deduplicate any request that was enqueued more than once, and eliminating those duplicates is what recovers goodput
    answer: 2
    explanation: |
      In a deep FIFO queue under overload, the oldest item has waited so long it's probably past deadline;
      completing it yields a response nobody wants. LIFO serves the newest (freshest, likeliest-in-deadline)
      requests and lets the stale bottom drop, raising goodput. The trade-off is unfairness/reordering, so
      it's an adaptive overload-only mode, not the default (FIFO is fair under normal load).
    ref: "concepts.md#load-shedding-and-brownout"
  - id: failure-theory-advanced-038
    difficulty: advanced
    tags: [load-shedding, brownout, priority]
    question: |
      What is "brownout" as an overload-control technique?
    options:
      - Intentionally disabling optional/low-priority features (personalization, recommendations, non-critical writes) to cut load while keeping core functionality alive
      - Randomly dropping a fixed, pre-configured percentage of all incoming requests regardless of their priority or cost, on the assumption that a uniform blind sample is the fairest way to reduce total load
      - Deliberately shutting down the entire service for a fixed cool-down window so the backing database can flush its queues, then bringing everything back online at full capacity once the load spike has fully subsided
      - Automatically doubling the provisioned fleet the moment offered load rises, so that added capacity rather than reduced functionality absorbs the surge and no feature ever has to be turned off
    answer: 0
    explanation: |
      Brownout is priority-based degradation: shed the non-critical work first (recommendations before
      checkout) so the core path keeps serving. It's the product-level expression of prioritized load
      shedding, used by Netflix, Google, and Facebook.
    ref: "concepts.md#load-shedding-and-brownout"
  - id: failure-theory-advanced-039
    difficulty: expert
    tags: [load-shedding, little-law, concurrency]
    question: |
      A service can safely hold L = 200 requests in flight, and each takes W = 100 ms on average. Using
      Little's Law, what admission rate keeps in-flight concurrency at the safe limit?
    options:
      - λ = L × W = 200 × 0.1 s = 20 requests/sec, treating the rate as the product of concurrency and service time
      - λ = W / L = 0.1 s / 200 = 0.0005 requests/sec, dividing the service time by the concurrency limit
      - λ = L + W ≈ 200 + 0.1 ≈ 200 requests/sec, summing the concurrency limit and the per-request service time
      - λ = L / W = 200 / 0.1 s = 2,000 requests/sec
    answer: 3
    explanation: |
      Little's Law: L = λ × W, so λ = L / W = 200 / 0.100 s = 2,000 req/s. Admitting above that pushes
      concurrency past the safe limit and grows queues. Concurrency-limit shedding uses exactly this
      relationship (often with an adaptive limiter that probes L).
    ref: "concepts.md#load-shedding-and-brownout"
  - id: failure-theory-advanced-040
    difficulty: expert
    tags: [load-shedding, deadline-aware]
    question: |
      What is the cheapest and often most effective form of admission control for a queued request whose
      deadline has already passed?
    options:
      - Process it anyway to keep the queue draining smoothly, since completing every admitted item preserves FIFO ordering and a late response is always more useful to the caller than no response at all
      - Drop it WITHOUT processing, because it is dead work — the response can no longer be delivered in time, so serving it only wastes capacity
      - Retry it up to three times with backoff before dropping, on the theory that a request important enough to enqueue deserves several more attempts to beat its already-expired deadline
      - Promote it to the front of the queue ahead of fresher requests, so the oldest work always clears first and the expired item gets served before it can waste any more wall-clock time
    answer: 1
    explanation: |
      A request already past its deadline cannot produce a useful response, so processing it is pure waste.
      Deadline-aware shedding drops such items unprocessed — cheap and highly effective, and it composes
      naturally with deadline propagation.
    ref: "concepts.md#load-shedding-and-brownout"
  - id: failure-theory-advanced-041
    difficulty: advanced
    tags: [load-shedding, retry-budget, package]
    question: |
      A team adds aggressive load shedding but clients immediately retry every 503 with no budget or
      backoff. What is the likely outcome?
    options:
      - The shed requests come right back as retries, so shedding alone doesn't reduce net load — you also need client retry budgets and backoff for shedding to actually relieve the system
      - The system fully recovers on its own, because dropping the excess with a 503 is sufficient in isolation and unbudgeted client retries have no material effect on the net load the service sees
      - Retries stop entirely after a 503, because clients treat a 503 as a permanent client error and by convention will not re-issue a request that was explicitly rejected by the server
      - The database transparently auto-scales to absorb the returning retries, so the retried load lands on freshly provisioned capacity and the shedding at the front door ends up being unnecessary
    answer: 0
    explanation: |
      Shedding only helps if the shed work doesn't immediately return. Clients that retry every 503 with
      no budget/backoff just re-offer the same load, defeating the shedder. Shedding, client-side retry
      budgets, and jittered backoff (plus fast 503 + Retry-After) are a package, not independent options.
    ref: "concepts.md#load-shedding-and-brownout"
  - id: failure-theory-advanced-042
    difficulty: intermediate
    tags: [backpressure, bounded-queue]
    question: |
      Why must every queue in a system be BOUNDED?
    options:
      - Bounded queues are faster to allocate because their backing array is reserved in a single contiguous block up front, and that one-time allocation speedup is the primary reason to bound every queue in a system
      - An unbounded queue under sustained overload grows without limit, so by Little's Law latency grows without limit until OOM; bounding forces a decision (block, drop, or reject) at the boundary
      - Unbounded queues are internally capped at 1,000 items by the runtime anyway, so declaring an explicit bound just documents a limit the collection already enforces on your behalf
      - Bounded queues guarantee exactly-once delivery, because a fixed capacity lets the queue track a slot per message and reject any duplicate that would otherwise occupy a second slot
    answer: 1
    explanation: |
      An unbounded queue is a hidden metastable failure: under sustained overload it grows forever,
      driving latency (W = L/λ) up until memory exhausts and the process crashes. A bound forces an
      explicit choice at the edge — backpressure (block), shed (drop), or reject — all safer than
      pretending capacity is infinite.
    ref: "concepts.md#backpressure-and-flow-control"
  - id: failure-theory-advanced-043
    difficulty: advanced
    tags: [backpressure, credit-based, reactive-streams]
    question: |
      In credit-based flow control (HTTP/2, gRPC, Reactive Streams request(n)), how is producer rate
      governed?
    options:
      - The producer transmits as fast as its link allows and the consumer silently discards whatever overflows its buffer, so the rate is governed after the fact by how much the receiver can absorb rather than by any signal sent back upstream
      - A central coordinator runs a Byzantine-consensus round across producer and consumer to agree on a shared send rate before every window, and that voted-upon rate is what the producer is then permitted to use
      - The consumer grants the producer credits/permits equal to its free buffer space (or requests n items), and the producer may only send up to that amount — demand-driven, non-blocking backpressure
      - The producer throttles itself by inserting a randomized jittered delay between sends, spreading its own output over time so the consumer is never asked to accept more than it can handle in any instant
    answer: 2
    explanation: |
      Credit-based flow control moves the decision to the consumer, which knows its own free capacity: it
      issues credits (HTTP/2 window, RSocket credits) or requests n items (Reactive Streams), and the
      producer never sends more than granted. This is precise, non-blocking backpressure — like TCP's
      receive window.
    ref: "concepts.md#backpressure-and-flow-control"
  - id: failure-theory-advanced-044
    difficulty: expert
    tags: [backpressure, shedding, edge]
    question: |
      "Backpressure internally, shed at the edge." Why can't you simply backpressure the open internet?
    options:
      - Because public internet traffic travels exclusively over connectionless UDP, which carries no receive-window field, so there is no transport-level channel through which a slow-down signal could ever be sent back to the client
      - Because propagating a slow-down signal across separate administrative domains violates peering and transit agreements, so backpressure is contractually prohibited the moment traffic crosses an autonomous-system boundary
      - Because rejecting a request is unconditionally cheaper than admitting and flow-controlling it in every part of the stack, so shedding is simply the universally optimal choice and backpressure is never worth its overhead anywhere
      - Because you can't slow down a producer you don't control (millions of independent internet clients); backpressure requires a controllable producer, so at the uncontrollable edge you must shed instead
    answer: 3
    explanation: |
      Backpressure works by propagating "slow down" to a producer that can comply — an internal pipeline
      stage or a user typing. The open internet is an uncontrollable fan-in of millions of independent
      clients you can't throttle at the source, so the only lever at that boundary is to shed (reject
      fast). Internally, where producers are controllable, backpressure preserves all work.
    ref: "concepts.md#backpressure-and-flow-control"
  - id: failure-theory-advanced-045
    difficulty: advanced
    tags: [backpressure, tradeoff, head-of-line]
    question: |
      What does backpressure preserve, and what does it cost, compared to load shedding?
    options:
      - It drops the excess work exactly as shedding does in order to hold latency flat, and it does so at no cost whatsoever because the propagated slow-down signal is absorbed entirely upstream without affecting any consumer
      - It exists purely to preserve exactly-once semantics, and the only price it charges is reduced throughput — latency and pipeline coupling are entirely unaffected because the slow-down never reaches upstream stages
      - It preserves all work (nothing dropped) at the cost of added latency and coupling — a slow consumer can stall the pipeline (head-of-line blocking) and cyclic producer/consumer graphs can deadlock — whereas shedding preserves latency/goodput by dropping work
      - It has trade-offs identical to load shedding in every respect, so the two are interchangeable and the choice between them comes down purely to which is easier to configure in a given framework
    answer: 2
    explanation: |
      Backpressure keeps every unit of work but propagates the slowdown upstream, so a slow consumer can
      stall the whole pipeline (head-of-line blocking) and cycles can deadlock. Shedding instead drops
      work to protect latency/goodput. Choose based on whether dropping is acceptable and whether the
      producer can actually be slowed.
    ref: "concepts.md#backpressure-and-flow-control"
  - id: failure-theory-advanced-046
    difficulty: advanced
    tags: [cascading-failure, thread-pool]
    question: |
      Describe the classic cascading-failure path when downstream dependency B slows down.
    options:
      - All of service A's threads block calling B → A's thread pool exhausts → A can't serve ANY request (even those not using B) → A's callers see A as down → the failure climbs the stack via the shared thread pool
      - B's slowness is isolated automatically by the runtime, so A's threads waiting on B are transparently parked and returned to the pool, and callers of A never observe any degradation from B being slow
      - A immediately detects B's latency and serves the last cached response for every affected request, so no thread ever blocks on B and A's pool utilization stays completely flat throughout the incident
      - B's slowness actually reduces A's CPU usage because A's threads spend more time idle waiting on B, freeing cycles that let A serve its other endpoints faster and raising A's overall throughput
    answer: 0
    explanation: |
      The shared thread pool couples the healthy and unhealthy paths: threads pile up waiting on slow B,
      the pool exhausts, and A can no longer serve anything — including requests that never touch B. A's
      callers then see A fail, and the failure cascades upward. Bulkheads (per-dependency pools) break this
      coupling.
    ref: "concepts.md#cascading-failures-bulkheads-and-isolation"
  - id: failure-theory-advanced-047
    difficulty: advanced
    tags: [bulkhead, thread-pool, semaphore]
    question: |
      What is the trade-off between thread-pool isolation and semaphore isolation for a bulkhead?
    options:
      - They are identical in every respect, differing only in the name the framework uses for the configuration knob, so the choice between them is purely stylistic and has no effect on behavior under load
      - Semaphore isolation requires a Byzantine-consensus round among callers to hand out permits, whereas thread-pool isolation needs no such coordination, which makes semaphores far more expensive despite using fewer threads
      - Thread-pool isolation consumes no additional memory because it reuses the caller's own stack, while semaphore isolation allocates an unbounded permit table that grows with every in-flight call and eventually exhausts the heap
      - Thread-pool isolation can interrupt/time out a truly stuck call on a separate thread but adds context-switch overhead; semaphore isolation is cheaper (just a concurrency cap, no extra threads) but can't abort a blocked call by switching threads
    answer: 3
    explanation: |
      A separate thread pool per dependency lets you run the call on an isolated thread you can time out
      /interrupt, at the cost of extra threads and context switches. A semaphore just caps concurrent
      calls on the caller's own thread — cheaper, no extra switches — but if the call blocks, the caller's
      thread blocks with it. Hystrix offered both for this reason.
    ref: "concepts.md#cascading-failures-bulkheads-and-isolation"
  - id: failure-theory-advanced-048
    difficulty: expert
    tags: [shuffle-sharding, isolation, blast-radius]
    question: |
      How does shuffle sharding reduce blast radius compared to plain sharding?
    options:
      - It gives every client access to the entire fleet so load is perfectly balanced across all nodes, and this uniform spreading is what shrinks blast radius because no single node ever carries a disproportionate share of any one client's traffic
      - It assigns each client a RANDOM SUBSET of nodes so any two clients rarely share their full set; a poison request or bad client degrades only its few nodes, and the combinatorics make full overlap between two customers very unlikely
      - It replicates every request to all shards and runs a Byzantine-fault-tolerant vote across them, so a poison request is out-voted by the healthy shards and its effect on any single customer is masked
      - It eliminates the need for any isolation at all because every node is identical and stateless, so a failure on one node is definitionally equivalent to a failure on any other and blast radius is irrelevant
    answer: 1
    explanation: |
      Shuffle sharding assigns each customer a random subset (e.g., 2 of N nodes). The number of distinct
      subsets is large, so two customers rarely share their entire set — a poison pill or abusive client
      harms only the few nodes in its shard, and others overlap on at most part of it. AWS Route 53 uses
      this to shrink blast radius dramatically.
    ref: "concepts.md#cascading-failures-bulkheads-and-isolation"
  - id: failure-theory-advanced-049
    difficulty: expert
    tags: [bulkhead, tradeoff, utilization]
    question: |
      What does resource isolation (bulkheads/cells) fundamentally cost, and how can OVER-isolating
      backfire?
    options:
      - It trades utilization for blast-radius containment (reserved idle capacity per partition); too fine-grained, each tiny pool is easier to exhaust and you waste resources, which can REDUCE resilience
      - It costs nothing at all and monotonically increases resilience, so the correct strategy is always to partition as finely as the framework will allow because every additional bulkhead strictly improves fault containment
      - It costs only added latency and never utilization, because the reserved capacity per partition is drawn from otherwise-idle cores, so finer partitioning slows requests but never wastes any provisioned resources
      - It requires exactly-once processing semantics to function, because a bulkhead can only contain a fault if each unit of work is guaranteed to execute in precisely one partition and never be duplicated across pools
    answer: 0
    explanation: |
      Isolation reserves capacity per partition (idle threads per pool, unshared cell capacity), lowering
      utilization — you buy containment with efficiency. But over-partitioning creates many tiny pools
      that individually exhaust easily and waste resources, so the resilience gain reverses. The judgment
      call is choosing the partition dimension that matches how failures actually correlate.
    ref: "concepts.md#cascading-failures-bulkheads-and-isolation"
  - id: failure-theory-advanced-050
    difficulty: intermediate
    tags: [static-stability, control-plane]
    question: |
      What does it mean for a system to be "statically stable"?
    options:
      - It refuses to change its configuration under any circumstances whatsoever, treating every config as permanently frozen at deploy time, and it is that absolute immutability rather than any dependency behavior that defines the property
      - It keeps working in its CURRENT configuration when dependencies fail — the data plane does not need the control plane to keep serving, as long as no changes are required
      - It is addressed exclusively through statically assigned IP addresses rather than DNS, so the stability refers to the fixed network identity of each host rather than to how the service behaves when a dependency is down
      - It scales up automatically the instant any dependency fails, reactively adding capacity through the control plane so that a failure is absorbed by fresh resources brought online on demand
    answer: 1
    explanation: |
      Static stability (AWS Builders' Library) means the data plane survives the control plane being fully
      down, provided no *changes* are needed. It keeps serving from pre-provisioned/last-known-good state
      rather than depending on the more failure-prone control plane in the hot path.
    ref: "concepts.md#static-stability"
  - id: failure-theory-advanced-051
    difficulty: expert
    tags: [static-stability, az-failure, provisioning]
    question: |
      To survive a single AZ failure across 3 AZs using static stability, what is the recommended
      approach and why is it preferred over reactive auto-scaling?
    options:
      - Run each of the three AZs at 100% utilization and rely on auto-scaling to add the missing capacity the moment an AZ drops, trusting that the scale-up completes fast enough to cover the redistributed load before requests start timing out
      - Run only a single AZ so capacity planning stays simple, on the reasoning that one well-provisioned zone is easier to reason about than three and avoids the cost of cross-AZ headroom entirely
      - Pre-provision each AZ so the surviving two can absorb the load (~66% each), because auto-scaling is a control-plane action that may itself be impaired during the failure — exactly when everyone else is also scaling
      - Route all traffic to a standby fallback region and run a Byzantine-consensus vote across regions to confirm the AZ failure before shifting, so the failover is only triggered once a quorum of regions agrees the zone is down
    answer: 2
    explanation: |
      Static stability pre-provisions for failure: with 3 AZs, keep enough headroom (~66% utilization) so
      the surviving 2 handle the load without needing new capacity. Relying on auto-scaling puts a
      control-plane dependency in the recovery path — and control planes are often impaired during the
      very event you need them, while everyone scales at once. You pay for idle capacity to remove that
      fragile dependency.
    ref: "concepts.md#static-stability"
  - id: failure-theory-advanced-052
    difficulty: advanced
    tags: [static-stability, tradeoff, staleness]
    question: |
      What does static stability trade away, and why is the trade usually worth it?
    options:
      - It trades away security to gain availability, because serving from pre-provisioned local state bypasses the control plane's authorization checks, and that widened exposure is why the pattern is rarely judged worth adopting
      - It trades away nothing at all and is strictly superior on every axis, so the pattern should be applied universally with no counterbalancing cost to weigh against the availability it provides
      - It trades away request latency in exchange for stronger consistency only, because pinning the data plane to a fixed configuration forces every read through a slower linearizable path that the control plane would otherwise have optimized
      - It trades cost/efficiency (paying for idle capacity) and freshness (may serve last-known-good, possibly stale, config) for availability — worth it because control planes tend to fail during big correlated events, exactly when you'd otherwise need them
    answer: 3
    explanation: |
      Pre-provisioning means paying for idle capacity, and serving cached/last-known-good config means you
      may serve stale config during a control-plane outage (e.g., a node that should be ejected lingers).
      The bet — validated repeatedly in practice — is that over-provisioning costs far less than a
      correlated outage where the control plane fails right when you need it most.
    ref: "concepts.md#static-stability"
  - id: failure-theory-advanced-053
    difficulty: expert
    tags: [static-stability, principle, critical-path]
    question: |
      Which statement best captures the deepest principle behind static stability?
    options:
      - Always respond to a dependency failure by reactively adding more capacity, since a larger fleet is the surest way to absorb the load shifted by the failed dependency and keep serving through the event
      - Control planes are inherently more reliable than data planes, so recovery logic should be concentrated in the control plane where it is least likely to be affected by the failure it is meant to handle
      - Don't put a fragile dependency in the critical path of recovering from that dependency's failure
      - Freshness of configuration always outweighs raw availability, so a service should prefer to stop serving rather than ever act on a last-known-good config that might have gone stale during an outage
    answer: 2
    explanation: |
      The core idea is to avoid a recovery path that depends on the very thing that failed. If recovering
      from a control-plane outage requires the control plane (to scale, re-route, re-issue config), you
      have a circular fragility. Static stability removes that dependency by pre-provisioning and serving
      from local/last-known-good state.
    ref: "concepts.md#static-stability"
  - id: failure-theory-advanced-054
    difficulty: advanced
    tags: [fallback, danger, correlated-demand]
    question: |
      Per the AWS Builders' Library, why are fallbacks to a secondary live dependency among the most
      dangerous patterns?
    options:
      - The fallback path is rarely exercised (so under-tested/often broken), and when the primary fails ALL traffic shifts to the fallback at once (correlated demand) onto an unsized alternate, producing bimodal behavior and often a second, worse outage
      - They are inherently too slow to be useful, because a secondary dependency always sits on a longer network path than the primary and the added round-trip latency alone makes the fallback unable to meet any realistic request deadline
      - They require a Byzantine-consensus round between the primary and secondary before any request can be served, and that voting overhead on the failover path is what makes the pattern one of the most dangerous
      - They always duplicate every write to both the primary and the secondary, so invoking a fallback inevitably doubles the write load and corrupts state through conflicting concurrent updates
    answer: 0
    explanation: |
      A fallback runs only on failure, so it's under-tested and often itself broken — and it's invoked for
      the first time at scale during your worst incident. When the primary fails, all traffic shifts to
      the fallback simultaneously (correlated demand) onto capacity that was never sized for it, and the
      system now behaves bimodally. This frequently causes a second, larger outage.
    ref: "concepts.md#graceful-degradation-and-the-danger-of-fallbacks"
  - id: failure-theory-advanced-055
    difficulty: expert
    tags: [fallback, safe-vs-dangerous]
    question: |
      Which distinguishes a SAFE fallback from a DANGEROUS one?
    options:
      - A safe fallback is simply whichever path returns a response fastest, so you choose it by benchmarking latency and always routing failures to the lower-p99 dependency regardless of what that path itself depends on
      - A safe fallback is defined by using a reliable transport such as TCP with retransmission, whereas a dangerous one rides connectionless UDP that can silently drop the fallback response mid-incident
      - There is no meaningful difference between them — every fallback carries identical risk because the triggering failure, not the fallback's design, is what determines whether the secondary path survives the incident
      - A safe fallback removes dependencies and has roughly constant cost (serve stale local cache or a static default); a dangerous one ADDS a new, untested, unsized live remote dependency at the worst moment, creating correlated demand
    answer: 3
    explanation: |
      Serving a stale local cache or a static default is safe because it introduces no new dependency and
      has roughly constant cost — no correlated demand on a fragile system. Falling back to another live
      remote dependency is dangerous: it's untested, unsized, and gets slammed by all traffic at once. The
      safe/dangerous line is whether the fallback removes or adds dependencies.
    ref: "concepts.md#graceful-degradation-and-the-danger-of-fallbacks"
  - id: failure-theory-advanced-056
    difficulty: advanced
    tags: [fallback, recommendation, exercise]
    question: |
      If you cannot avoid a fallback path, what does the AWS guidance recommend to make it survivable?
    options:
      - Reserve the fallback strictly for genuine incidents and never send it synthetic traffic, on the theory that only real production failures exercise it authentically enough to keep the path trustworthy
      - Exercise it continuously (run some fraction of production traffic through it always so it's never cold) and size it for 100% of load
      - Keep it completely idle and provisioned at minimal capacity to save cost, then rely on rapid auto-scaling to grow the fallback to full size at the exact moment the primary dependency fails
      - Trigger the fallback at random intervals with jittered timing so its usage stays unpredictable, which spreads any latent bug across many small windows instead of one large failover event
    answer: 1
    explanation: |
      The failure modes of fallbacks stem from being cold (untested) and undersized. So if you must have
      one, continuously route some real traffic through it (so it's always warm and tested) and provision
      it for the full load it would receive when the primary fails. A fallback used only in emergencies is
      a landmine; the preferred design avoids needing one at all (fail/shed instead).
    ref: "concepts.md#graceful-degradation-and-the-danger-of-fallbacks"
  - id: failure-theory-advanced-057
    difficulty: intermediate
    tags: [graceful-degradation, brownout, planning]
    question: |
      What makes graceful degradation "good" rather than accidental?
    options:
      - It is planned, prioritized, and tested in advance — you decide what to drop first (e.g. recommendations before checkout) and practice it via chaos/game days
      - It is triggered only by random chance the instant utilization crosses a fixed threshold, with the runtime picking which features to disable on its own so no advance prioritization or testing is ever required
      - It disables the entire product uniformly the moment any single dependency degrades, taking down critical and optional functionality together because treating every feature equally is considered the fairest response to overload
      - It always fails reads and writes over to a warm secondary database, since the defining trait of good degradation is having a fully redundant live datastore ready to absorb the primary's entire load
    answer: 0
    explanation: |
      Good degradation is a deliberate design: a pre-decided priority order for what functionality to shed
      first, exercised regularly (chaos/game days) so it actually works under stress. It's the
      product-level expression of prioritized load shedding/brownout, not an emergency improvisation.
    ref: "concepts.md#graceful-degradation-and-the-danger-of-fallbacks"
  - id: failure-theory-advanced-058
    difficulty: beginner
    tags: [fallacies, distributed-computing]
    question: |
      The "fallacies of distributed computing" are best described as:
    options:
      - A catalog of low-level performance-tuning tips for high-frequency trading systems, covering kernel-bypass networking and cache-line alignment to shave microseconds off order-execution latency
      - False assumptions (network is reliable, latency is zero, bandwidth is infinite, etc.) that, baked into code, cause many distributed-system outages
      - A fixed list of exactly three canonical ways a relational database can fail — disk corruption, connection exhaustion, and deadlock — used as a checklist during storage-tier design reviews
      - A set of legal and regulatory requirements that public cloud providers must satisfy before they are permitted to offer managed distributed-computing services to enterprise customers
    answer: 1
    explanation: |
      Catalogued at Sun (Deutsch, Gosling, et al.), the fallacies are wrong assumptions engineers
      implicitly make about distributed systems. Each maps to a resilience mechanism (unreliable network →
      retries/timeouts, non-zero latency → deadlines/batching). They are neither tuning tips, a failure
      taxonomy, nor legal rules.
    ref: "concepts.md#the-fallacies-of-distributed-computing"
  - id: failure-theory-advanced-059
    difficulty: intermediate
    tags: [fallacies, mechanism-mapping]
    question: |
      The fallacy "the network is reliable" most directly forces which resilience mechanisms?
    options:
      - Sharding and replication
      - Byzantine consensus and 3f+1 voting
      - Idempotent retries and timeouts
      - LIFO queueing and brownout
    answer: 2
    explanation: |
      Because the network drops packets and links flap, a call may not arrive or its reply may be lost —
      so you need timeouts (bound the wait) and idempotent retries (recover transient loss safely). Each
      fallacy maps to a mechanism; this one maps to timeouts + retries.
    ref: "concepts.md#the-fallacies-of-distributed-computing"
  - id: failure-theory-advanced-060
    difficulty: intermediate
    tags: [fallacies, latency, bandwidth]
    question: |
      Which pairing of fallacy to repairing mechanism is CORRECT?
    options:
      - '''Latency is zero'' → TLS handshakes, zero-trust auth, and mutual certificate pinning'
      - '''The network is secure'' → request deadlines, response batching, and async pipelining'
      - '''Topology never changes'' → end-to-end checksums, CRC validation, and payload size limits'
      - '''Bandwidth is infinite'' → backpressure, flow control, and payload limits'
    answer: 3
    explanation: |
      Assuming infinite bandwidth ignores link saturation, so the repair is flow control/backpressure and
      payload limits. ('Latency is zero' → deadlines/batching/async; 'network is secure' → TLS/authz;
      'topology doesn't change' → service discovery/health-based routing.) Only the bandwidth pairing is
      matched correctly here.
    ref: "concepts.md#the-fallacies-of-distributed-computing"
  - id: failure-theory-advanced-061
    difficulty: advanced
    tags: [tail-latency, fan-out, math]
    question: |
      A request fans out to 100 independent backends and must wait for all of them. Each backend has a
      p99 of 100 ms (1% chance of being "slow"). Roughly what fraction of these fan-out requests will
      touch at least one slow backend?
    options:
      - About 1% (the per-backend slow probability carries over unchanged to the aggregate)
      - About 10% (√100 × 1%, since independent tails combine as the square root of the count)
      - About 63% (1 − 0.99^100)
      - About 100% (with 100 backends at 1% each, a slow one is effectively guaranteed every time)
    answer: 2
    explanation: |
      P(at least one slow) = 1 − P(none slow) = 1 − 0.99^100 ≈ 1 − 0.366 = 0.634 ≈ 63%. This is the core
      lesson of The Tail at Scale: at high fan-out, the tail becomes the common case, so p99 of individual
      backends dominates the p50 of the aggregate request. Mitigations include hedged/tied requests.
    ref: "concepts.md#metastable-failures-and-feedback-loops"
  - id: failure-theory-advanced-062
    difficulty: expert
    tags: [tail-latency, hedged-requests, tradeoff]
    question: |
      "Hedged requests" (send a second copy of a request to another replica if the first is slow) reduce
      tail latency. What is the key trade-off and how is it usually controlled?
    options:
      - They add extra load (duplicate work) to cut the tail; you control it by only hedging after the request exceeds a high percentile (e.g. p95) and/or capping hedges as a small fraction of traffic, so the added load stays bounded
      - They eliminate all tail latency at no extra cost, because the second copy reuses the first request's already-open connection and warmed caches, so no additional backend work is ever performed
      - They require a Byzantine-consensus round among the replicas before either copy runs, so the copies vote on which result is authoritative and that agreement step is what actually cuts the tail
      - They only work correctly when the operation is strictly non-idempotent, since a hedged duplicate of an idempotent call would return an identical result and therefore could never improve latency
    answer: 0
    explanation: |
      Hedging trades a small amount of extra load for a big tail-latency reduction. To keep the extra work
      bounded you defer the hedge until the first attempt passes a high percentile (so only genuinely slow
      requests get hedged) and/or cap hedges to a few percent of traffic. Tied requests go further by
      cancelling the loser. It requires idempotency since two copies may both execute.
    ref: "concepts.md#metastable-failures-and-feedback-loops"
  - id: failure-theory-advanced-063
    difficulty: advanced
    tags: [scenario, judgment, overload]
    question: |
      During an incident, offered load is 1.4× capacity, latency is climbing, and the queue is deepening.
      Which SINGLE action most directly protects goodput without feeding a feedback loop?
    options:
      - Increase all client-side retry counts so more requests eventually succeed, on the reasoning that a saturated dependency clears intermittently and extra attempts will catch those brief windows of availability
      - Raise every timeout uniformly so slow requests have more time to complete, letting the deepening queue drain naturally once each in-flight request is finally given long enough to finish
      - Add a fallback to a secondary database for the overflow traffic, diverting the excess 40% onto a standby datastore so the primary path stays under its capacity ceiling during the spike
      - Shed the excess ~30% of low-priority load at the front door with a fast 503+Retry-After, keeping in-flight work below capacity so the queue drains
    answer: 3
    explanation: |
      At 1.4× capacity the only way to keep goodput up is to reduce work below capacity — shed the excess
      cheaply and early with fast rejection so the queue drains. Raising retries or timeouts adds load and
      dead work (feeding amplification), and a fallback to another live DB creates correlated demand on an
      unsized dependency.
    ref: "concepts.md#load-shedding-and-brownout"
  - id: failure-theory-advanced-064
    difficulty: expert
    tags: [scenario, retry, deadline, judgment]
    question: |
      You inherit a 4-layer call chain where every layer retries 2× with 30 s timeouts and no deadline
      propagation. Which change set most reduces amplification and wasted work while preserving transient-
      fault recovery?
    options:
      - Increase retries to 3× at every layer and add jittered backoff, so each tier independently gets more attempts and the randomized spacing keeps the extra retries from arriving as one synchronized wave
      - Retry at one layer only, add a token-bucket retry budget, propagate an absolute deadline so each hop uses remaining time and skips doomed work, and set per-hop timeouts from p99.9 + margin
      - Remove all timeouts so no request is ever prematurely aborted, letting slow-but-alive hops always run to completion and thereby eliminating the false-positive retries that drive amplification
      - Add a circuit breaker at the top layer but keep the 2× retries at all four layers, relying on the breaker to trip and halt the multiplied load once the aggregate failure rate crosses its threshold
    answer: 1
    explanation: |
      The amplification is 2^4 = 16× from per-layer retries; the 30 s uniform timeouts with no deadline
      cause massive wasted work. The correct fixes: retry at one layer, cap volume with a token-bucket
      budget, propagate a deadline so hops fail fast on expired requests, and set data-driven timeouts.
      Increasing retries or keeping per-layer retries preserves the blowup; removing timeouts reintroduces
      unbounded hangs.
    ref: "concepts.md#timeouts-and-deadline-propagation"
  - id: failure-theory-advanced-065
    difficulty: advanced
    tags: [scenario, cache, thundering-herd, coalescing]
    question: |
      To prevent a cache-miss stampede (thundering herd) from crushing the database when a hot key
      expires, which technique directly addresses the sustaining loop?
    options:
      - 'Request coalescing / single-flight: let only one request recompute the missing key while others wait for that result (optionally serving stale during recomputation)'
      - Increase the database connection pool to unbounded so every concurrent miss gets its own connection and none of the stampeding requests has to wait for a free slot before recomputing the key
      - Have every client independently retry the database with exponential backoff, spacing the concurrent misses over time so the recompute attempts spread out instead of landing on the datastore all at once
      - Disable the cache entirely so there are no misses to stampede, routing every read straight to the database and thereby removing the expiry event that triggers the herd in the first place
    answer: 0
    explanation: |
      A stampede happens because N concurrent misses all hit the DB for the same key. Single-flight
      /request coalescing collapses them into one recompute while the rest await the result (often serving
      the last stale value meanwhile), directly cutting DB load. Unbounded pools and mass retries feed the
      loop; disabling the cache removes the protection entirely.
    ref: "concepts.md#metastable-failures-and-feedback-loops"
  - id: failure-theory-advanced-066
    difficulty: advanced
    tags: [scenario, circuit-breaker, gray-failure]
    question: |
      One instance in a 50-node pool develops a gray failure (200 ms I/O). A per-instance latency-based
      outlier ejector is available. Why is this preferable to a single service-wide circuit breaker here?
    options:
      - Per-instance ejection guarantees exactly-once delivery of each request, so removing the slow node also removes any chance of the duplicate processing that a gray-failing node would otherwise cause
      - The service-wide breaker would eject all 50 nodes and cause a full outage, whereas per-instance ejection removes just the one bad node and keeps the other 49 serving
      - A service-wide circuit breaker can only ever trip on hard error responses and is structurally blind to latency, so it could never react to a slow-but-successful node in the first place
      - Per-instance ejection is driven by a Byzantine-consensus vote across the pool, and that quorum agreement makes its decision to remove the node inherently more reliable than a single breaker's
    answer: 1
    explanation: |
      A gray failure is localized to one node. A service-wide breaker sees elevated aggregate latency and
      may trip, cutting off the whole healthy pool. Per-instance outlier ejection removes only the
      offending node (from the client's latency view — the right lens for gray failure) while the other
      49 keep serving. Granularity is the whole point.
    ref: "concepts.md#circuit-breakers"
  - id: failure-theory-advanced-067
    difficulty: expert
    tags: [scenario, static-stability, fallback, judgment]
    question: |
      A config service is down. Design A keeps serving from each host's last-known-good cached config;
      Design B fails over reads to a rarely-used secondary config service. Which is more resilient and
      why?
    options:
      - Design B, because a live secondary config service always returns fresher data than a cached copy, and freshness is the dominant factor in resilience since a stale config can silently route traffic to a dead host
      - They are equivalent because both designs avoid calling the failed primary, so from a resilience standpoint the choice between a local cache and a live secondary is purely an implementation preference
      - 'Design A, because it is statically stable (no new dependency, roughly constant cost, survives the control-plane outage), while Design B is a dangerous fallback: an untested, unsized secondary hit by all traffic at once'
      - Design B, because a cached config can never be trusted once its source is unreachable, so serving from any local cache during an outage is inherently unsafe and a live secondary is the only correct choice
    answer: 2
    explanation: |
      Serving last-known-good cached config is a safe, statically stable choice: it adds no dependency and
      keeps working while the control plane is down (accepting only staleness). Failing over to a
      rarely-used secondary is the classic dangerous fallback — cold, untested, unsized, and suddenly
      receiving 100% of traffic. Prefer static stability / safe fallback over a live-secondary fallback.
    ref: "concepts.md#static-stability"
  - id: failure-theory-advanced-068
    difficulty: expert
    tags: [scenario, backpressure, kafka, judgment]
    question: |
      A stream processor consumes from a message log (e.g., Kafka) and falls behind because a downstream
      DB slowed. Which response best applies flow-control principles without data loss?
    options:
      - Buffer the incoming records unbounded in the processor's memory until the DB recovers, letting the heap absorb the backlog so no consumer-side slowdown is ever needed to keep pace with the log
      - Drop messages at random from the incoming stream to catch up to the log's head, trading a small amount of data loss for the ability to stay current with the newest records while the DB is slow
      - Spin up a fallback DB and dual-write every record to both datastores, splitting the write load across two backends so the slowed primary no longer bounds how fast the processor can drain the log
      - Let the log act as the buffer and apply consumer-side backpressure (slow the poll / reduce in-flight) so the processor pulls only what it can handle — the durable log preserves all work while the DB recovers
    answer: 3
    explanation: |
      A durable log is a bounded-by-retention buffer that lets you apply pull-based/consumer-side
      backpressure: the processor requests only what it can process, and the log holds the backlog safely
      until the DB recovers — no data loss. Unbounded in-memory buffering risks OOM, random dropping loses
      data unnecessarily, and a fallback DB with dual-writes adds a dangerous untested dependency and
      consistency problems.
    ref: "concepts.md#backpressure-and-flow-control"
  - id: failure-theory-advanced-069
    difficulty: expert
    tags: [scenario, capacity, headroom, metastable]
    question: |
      A team runs a service at 90% CPU utilization "for efficiency" and has good auto-scaling. From a
      metastable-failure standpoint, what is the main risk and the counter?
    options:
      - There is no risk at all; 90% utilization is the optimal operating point and well-tuned auto-scaling absorbs any spike in time, so headroom beyond that is simply wasted spend on idle capacity
      - The only real risk is the incremental cost of the extra capacity used at 90%, which is an acceptable and even desirable trade because higher utilization means you are paying for fewer idle machines
      - At 90% there is almost no headroom to absorb a trigger before amplification (retries/queues) tips the system past the cliff, and reactive auto-scaling may lag or be impaired during the event; keep meaningful headroom and pre-provision for failure rather than relying on just-in-time scaling
      - The service will begin exhibiting Byzantine behavior at sustained high utilization, since a CPU-starved node starts returning arbitrarily corrupted responses, so the fix is to add 3f+1 replicas and vote on results
    answer: 2
    explanation: |
      Running at 90% leaves little room to absorb a spike before the amplification loop pushes past the
      capacity cliff into a metastable state, and reactive scaling takes minutes and can be impaired
      exactly during a correlated event. Headroom is the cheap insurance that keeps the barrier far from
      normal operation; static stability says pre-provision rather than depend on just-in-time scaling.
    ref: "concepts.md#metastable-failures-and-feedback-loops"
  - id: failure-theory-advanced-070
    difficulty: advanced
    tags: [scenario, idempotency, retry, exactly-once]
    question: |
      Why does safely enabling client retries on a payment/write endpoint require idempotency keys, and
      what guarantee does that combination provide?
    options:
      - Because a timeout is ambiguous (the write may have already succeeded), an idempotency key lets the server dedupe duplicate attempts, turning at-least-once delivery + idempotency into effectively-once processing
      - It provides true exactly-once network delivery, because the idempotency key lets the transport layer detect and drop any duplicate packet before it is ever delivered to the payment service
      - Idempotency keys work by encrypting the request payload with a per-attempt token, so a retried write is rejected at decryption time and the duplicate charge is prevented cryptographically
      - Retries are always safe on payment/write endpoints regardless of idempotency, since a timeout reliably indicates the write never committed and the second attempt simply completes the original intent
    answer: 0
    explanation: |
      Partial failure makes a timeout ambiguous, so a blind retry could double-charge. An idempotency key
      lets the server recognize and dedupe the retried write, so at-least-once delivery + server-side
      idempotency yields effectively-once processing. True exactly-once *delivery* is impossible; this is
      the practical equivalent. Retrying non-idempotent writes without keys risks duplicates.
    ref: "concepts.md#retry-amplification-math-and-retry-budgets"
  - id: failure-theory-advanced-071
    difficulty: expert
    tags: [scenario, admission-control, prioritized-queue, judgment]
    question: |
      A multi-tenant API must protect availability of paying (critical) traffic during overload driven by
      a burst of free-tier (non-critical) requests. Which combination best applies overload-control theory?
    options:
      - One global FIFO queue for all tenants combined with uniform random shedding, dropping the same fraction of every tenant's traffic so that no customer is singled out and the burst is smoothed evenly across the fleet
      - Increase timeouts and retry counts for the free-tier traffic to smooth the burst, giving the surge of non-critical requests more time and more attempts so the spike is absorbed rather than rejected outright
      - Fail over all traffic — both paying and free-tier — to a secondary region, shifting the entire load off the overloaded fleet so the burst lands on fresh capacity in the standby region instead
      - Prioritized admission (critical requests admitted first), shed non-critical first (brownout), per-tenant fairness/quotas or shuffle sharding to isolate the noisy tenant, and switch to LIFO/ adaptive queueing under overload — shedding cheaply at the edge
    answer: 3
    explanation: |
      Protecting critical traffic under overload needs prioritized admission control (serve critical
      first), brownout of non-critical work, per-tenant isolation (quotas/shuffle sharding) so one noisy
      tenant can't starve others, and overload-aware queueing (LIFO/adaptive) with cheap edge shedding.
      A global FIFO with uniform shedding ignores priority and lets the burst harm paying users; raising
      retries/timeouts adds load; regional failover is unrelated and risky.
    ref: "concepts.md#load-shedding-and-brownout"
  - id: failure-theory-advanced-072
    difficulty: intermediate
    tags: [circuit-breaker, purpose, fail-fast]
    question: |
      What are the two main benefits a circuit breaker provides when a dependency is clearly failing?
    options:
      - It encrypts each outbound call with TLS and load-balances the requests across healthy replicas, so a failing dependency is both secured on the wire and relieved by having its share of traffic spread elsewhere
      - It lets you fail fast (instead of piling threads on timeouts) AND gives the failing dependency room to recover by stopping the calls hammering it
      - It guarantees exactly-once delivery and strong consistency to the dependency, so no request is duplicated or lost while the breaker is open and state stays coherent throughout the failure
      - It automatically increases client retry counts and disables per-call timeouts, on the basis that more persistent attempts with no early abort give the struggling dependency the best chance to answer
    answer: 1
    explanation: |
      An open breaker rejects immediately, so callers fail fast rather than exhausting thread/connection
      pools waiting on timeouts, and it stops sending load to the struggling dependency so it can recover.
      It converts slow failures into fast ones — it is not about encryption, consistency, or retries.
    ref: "concepts.md#circuit-breakers"
  - id: failure-theory-advanced-073
    difficulty: advanced
    tags: [backpressure, unbounded-queue, little-law, math]
    question: |
      A bounded work queue holds up to L = 500 items and the service processes λ = 1,000 items/sec at
      steady state. By Little's Law, what is the maximum queueing delay a request can experience, and why
      does removing the bound break this guarantee?
    options:
      - 0.5 s max wait (W = L/λ = 500/1000); removing the bound lets L grow without limit, so W grows without limit until OOM
      - 2 s max wait (computed as λ/L = 1000/500); removing the bound has no effect on latency since the dequeue rate stays fixed regardless of queue depth
      - 500 s max wait (reading L = 500 directly as seconds); the bound is irrelevant because wait time depends only on per-item service cost, not depth
      - 0 s wait; a bounded queue never adds latency since items are served the instant they arrive, so the 500-item cap only limits memory use
    answer: 0
    explanation: |
      With a bounded queue, worst-case queueing delay is W = L/λ = 500/1000 = 0.5 s — the bound puts a hard
      ceiling on wait time. Remove the bound and, under sustained overload, L grows unboundedly, so W = L/λ
      grows unboundedly (latency explodes) until memory is exhausted. The bound is what makes latency
      predictable and forces the block/drop/reject decision.
    ref: "concepts.md#backpressure-and-flow-control"
  - id: failure-theory-advanced-074
    difficulty: advanced
    tags: [taxonomy, timing-failure, detection]
    question: |
      A node returns correct results but consistently 500 ms late due to a slow disk. Which failure class
      is this, and why is it especially insidious in a synchronous request path?
    options:
      - Crash failure; the node has effectively fail-stopped, so its heartbeat goes silent within one interval and the load balancer ejects it cleanly before any client observes the added 500 ms of delay
      - Timing (performance) failure; the output is correct so value-based checks pass, yet it blows deadlines and — because it stays 'up' — keeps absorbing traffic and triggering timeouts/retries
      - Byzantine failure; the node is returning arbitrarily corrupted, self-contradictory results that differ from peer to peer, so only a 3f+1 voting quorum with checksums could detect and mask the lie
      - Omission failure; the node is silently dropping every request it receives and returning nothing at all, so a simple response-presence check on the client side flags it immediately
    answer: 1
    explanation: |
      Correct-but-late is the timing/performance failure class. It's insidious because value checks pass
      and liveness checks pass (it's up), so it stays in rotation while blowing deadlines and provoking
      client timeouts and retries — essentially a gray failure. Latency-based outlier ejection, not
      value or liveness checks, is what catches it.
    ref: "concepts.md#failure-taxonomy-crash-omission-timing-byzantine-gray-and-partial"
  - id: failure-theory-advanced-075
    difficulty: intermediate
    tags: [graceful-degradation, load-shedding, relationship]
    question: |
      How do graceful degradation/brownout relate to load shedding?
    options:
      - They are entirely unrelated concepts; graceful degradation is purely a front-end concern about swapping to a lighter UI theme and simpler layouts, whereas load shedding lives only in the network tier
      - Load shedding is a specialized subtype of Byzantine fault tolerance, using a 3f+1 replica vote to decide which incoming requests are malicious and should be rejected under overload
      - Graceful degradation/brownout is the product-level expression of prioritized load shedding — shedding low-value functionality first to keep core functions serving under overload
      - Graceful degradation fully replaces the need for any load shedding, because disabling optional features always frees enough capacity that the core path never has to reject a single request
    answer: 2
    explanation: |
      Brownout/graceful degradation applies load-shedding priorities at the feature level: drop optional,
      low-value work (recommendations, personalization) first so the critical path keeps serving. It's the
      same overload-control principle expressed as product behavior, not a separate or unrelated concept.
    ref: "concepts.md#graceful-degradation-and-the-danger-of-fallbacks"
