      - shared-fate
    question: |
      A service's "backup" store used by its fallback path lives in the same AZ and behind the same network
      path as the primary. During an AZ incident the fallback is useless. This illustrates which principle?
    options:
      - Redundancy/fallback only helps if it fails INDEPENDENTLY of the primary; sharing fate (same AZ, network,
        or dependency) correlates their failures so the fallback dies in the same event
      - Fallbacks should always be kept entirely in-memory, because reading a local heap cache is faster than
        any disk-backed store and guarantees the backup path can respond instantly under load
      - Fallbacks must be strongly consistent with the primary at all times, so a read served from the backup
        path is always byte-for-byte identical to what the primary would have returned for that request
      - The fallback store should be provisioned larger than the primary, since it must absorb the full
        production load the instant the primary fails and therefore needs more headroom than the main path
    answer: 0
    explanation: |
      Independence is the prerequisite for any redundancy/fallback to add value; shared fate (same AZ/network/
      dependency) means both fail together. In-memory storage, strong consistency, and size are not the point.
    ref: concepts.md#why-naive-fallbacks-are-dangerous
  - id: resilience-tradeoffs-deep-dive-103
    difficulty: advanced
    tags:
      - advanced
      - blast-radius
      - shuffle-sharding-math
    question: |
      With 100 workers and each customer assigned a random shard of 5 workers, the number of distinct 5-worker
      combinations is C(100,5) ~ 75 million. What does this buy you versus 20 plain cells?
    options:
      - Nothing meaningful; 20 plain cells and shuffle sharding give mathematically identical isolation, since
        both simply divide the same 100 workers into groups that customers are then assigned to
      - It guarantees that zero customers are ever affected by any single worker failure, because spreading
        each customer across 5 workers means the remaining 4 always fully absorb the lost one's share
      - Combinatorially many virtual shards, so the probability that two customers share their ENTIRE 5-worker
        shard (and thus are hit by the same poison-pill) is ~1 in 75 million - far finer isolation than 1/20
        per plain cell, at only ~5x capacity overhead per customer
      - It requires each customer to be given a fully dedicated set of 5 physical machines that no other
        customer may ever touch, which is what drives the isolation up to roughly 75 million combinations
    answer: 2
    explanation: |
      Shuffle sharding yields C(W,k) virtual shards, so full-overlap collisions are vanishingly rare (~1/75M
      here) - much finer than a plain 1/20 cell split, using only k-worker capacity per customer. It is not
      identical to plain cells, does not eliminate all impact, and does not dedicate machines.
    ref: concepts.md#blast-radius-and-cell-based-architecture
  - id: resilience-tradeoffs-deep-dive-104
    difficulty: advanced
    tags:
      - advanced
      - shuffle-sharding
      - limits
    question: |
      Shuffle sharding provides weak isolation (or none) in which situation?
    options:
      - Whenever the pool grows beyond 10 workers, because the number of possible shard combinations then
        gets too large to track and customers begin colliding on overlapping worker subsets
      - Whenever customers are assigned their shards uniformly at random, since randomness makes overlaps
        unpredictable and removes any guarantee that two customers land on distinct worker sets
      - When each customer is assigned exactly k=1 worker, OR when a single customer's load is large relative to
        a worker's capacity - then a heavy/poison customer can saturate every worker in its shard and overlaps
        become likely, so the combinatorial benefit collapses
      - Whenever the workers are stateless, because without local per-worker state there is nothing to
        isolate between customers and the shard assignment stops providing any fault containment
    answer: 2
    explanation: |
      Shuffle sharding assumes k>=2 and that any one customer is a small fraction of a worker's capacity; with
      k=1 or a whale customer, its shard saturates and overlap protection erodes. Worker count >10, randomness,
      and statelessness are not the limiting factors.
    ref: concepts.md#blast-radius-and-cell-based-architecture
  - id: resilience-tradeoffs-deep-dive-105
    difficulty: advanced
    tags:
      - advanced
      - deadline-propagation
      - retries
      - interaction
    question: |
      A request enters with a 300ms end-to-end deadline. Service A spends 250ms, then calls B which is
      configured to retry 3x with 100ms backoff. What should B do, and what bug does deadline propagation
      prevent?
    options:
      - B should retry all 3 times regardless of the elapsed budget, since each additional attempt strictly
        improves the request's overall success rate no matter how little end-to-end time is left
      - B should reset the deadline to a fresh 300ms for its own downstream call, treating its leg of the
        chain as independent so its retries always get the full budget the original request started with
      - B should see only ~50ms of budget remaining, skip retries that cannot fit, and fail fast - preventing B
        from burning time (and load) on retries for a request A has effectively already abandoned
      - B should ignore the propagated deadline entirely because it owns its own local timeout policy, and a
        downstream service is always free to apply whatever per-call timeout it was independently configured with
    answer: 2
    explanation: |
      With deadline propagation B knows only ~50ms remain and must not launch retries that cannot complete in
      time, avoiding wasted work/load on a doomed request. Blindly retrying, resetting the deadline, or ignoring
      it all defeat the purpose of end-to-end deadlines.
    ref: concepts.md#timeouts-and-deadlines
  - id: resilience-tradeoffs-deep-dive-106
    difficulty: expert
    tags:
      - expert
      - admission-control
      - goodput
      - overload
    question: |
      Under overload, a system that admits every request and lets them all contend tends to complete very
      little useful work, while a system that sheds early completes far more. The precise reason is:
    options:
      - Shedding raises the CPU clock speed of each surviving instance, because rejecting excess work lets the
        processor exit its throttled state and the reclaimed frequency headroom is what lifts goodput
      - Admitting everything spreads finite capacity across too many concurrent requests so most exceed their
        deadline and are wasted (low goodput); shedding early concentrates capacity on a feasible subset so
        admitted requests actually finish in time (high goodput)
      - Shed requests are quietly processed later for free during idle periods, so nothing is truly lost and
        the shed portion of the workload still eventually completes at no additional cost to capacity
      - Admitting every request is required for fairness across clients and, by keeping the intake count high,
        always maximizes the total amount of useful work the system completes under overload
    answer: 1
    explanation: |
      Goodput (useful work completed within deadline) collapses when capacity is divided among more concurrent
      requests than it can finish; early shedding preserves enough per-request capacity for admitted work to
      succeed. Shedding does not change clock speed, shed requests are dropped, and admit-all does not maximize goodput.
    ref: concepts.md#admission-control-and-brownout
  - id: resilience-tradeoffs-deep-dive-107
    difficulty: advanced
    tags:
      - advanced
      - cache-stampede
      - metastable
    question: |
      A popular cache key expires and thousands of concurrent requests all miss and hit the origin database
      simultaneously, overwhelming it. This cache stampede can trigger a metastable state. The best mitigation is:
    options:
      - Remove caching entirely so there are no expiries to stampede on, sending every read straight to the
        origin database and relying on the database alone to absorb the full concurrent request volume
      - Set an infinite TTL on the hot key so it never expires, freezing the cached value in place
        permanently so that no miss can ever occur and no request is ever forced back to the origin
      - Request coalescing / single-flight (only one request recomputes while others wait) plus staggered/jittered
        TTLs so keys do not all expire at once
      - Increase the database connection pool to 100,000 so that every concurrent request on a cache miss can
        open its own dedicated connection and hit the origin in parallel without waiting for a free slot
    answer: 2
    explanation: |
      Single-flight/coalescing ensures only one recompute hits the origin per key, and jittered TTLs desynchronize
      expiries - directly cutting the stampede amplifier. Removing caching or infinite TTL are extremes, and a huge
      pool just lets the stampede crush the DB harder.
    ref: concepts.md#metastable-failures-and-the-feedback-loop
  - id: resilience-tradeoffs-deep-dive-108
    difficulty: expert
    tags:
      - expert
      - circuit-breaker
      - half-open
      - herd
    question: |
      A fleet of 300 instances shares a circuit breaker cooldown of 5s against one recovering dependency. When
      the cooldown elapses, what subtle problem can occur in the HALF-OPEN transition, and how do you mitigate it?
    options:
      - Nothing subtle happens; the half-open state always sends exactly one probe request fleet-wide, because
        the shared 5s cooldown coordinates all 300 instances into electing a single prober between them
      - Many instances exit cooldown near-simultaneously and each sends probe traffic, so the "trickle" becomes a
        synchronized herd that re-overloads the barely-recovered dependency; mitigate with jittered cooldowns and
        strictly limited per-instance probe concurrency
      - The recovering dependency will automatically refuse all half-open probes until it is fully healthy, so
        the breaker cannot re-overload it and the synchronized cooldown expiry poses no real risk at all
      - Half-open must send full production traffic to test recovery, because only the complete live load can
        prove the dependency is truly ready, so a gentle trickle would give a false signal of readiness
    answer: 1
    explanation: |
      Independent local breakers with equal cooldowns re-open the gate together, so aggregate half-open probing
      can spike and re-trip a fragile dependency; jittering cooldowns and capping probe volume keeps the trickle
      genuinely gentle. Half-open is per-instance (not one fleet-wide request) and must be a trickle, not full load.
    ref: concepts.md#circuit-breakers
  - id: resilience-tradeoffs-deep-dive-109
    difficulty: advanced
    tags:
      - advanced
      - backpressure
      - rejection-policy
    question: |
      When a bounded queue in front of a worker pool fills up, the choice of rejection policy matters. For a
      latency-sensitive service where stale requests are worthless, which policy is often best?
    options:
      - Block the producer indefinitely until space frees up, applying backpressure so that no request is ever
        dropped and every caller is eventually served once the workers finally catch up on the backlog
      - Drop-oldest (evict the head) or reject-newest with a fast 503, so you do not spend capacity on requests
        that have already aged past usefulness, and the caller gets an immediate signal to back off
      - Silently grow the queue past its bound "just this once," trading a temporary memory bump for zero
        rejections on the assumption the backlog will fully drain before the heap is ever exhausted
      - Always drop the newest request regardless of the workload, since rejecting the most recent arrival is
        the simplest uniform policy and avoids the bookkeeping of tracking each queued item's age
    answer: 1
    explanation: |
      For latency-sensitive work, evicting stale (oldest) items or fast-rejecting keeps capacity on fresh,
      still-useful requests and signals the caller immediately. Indefinite blocking stalls the producer, exceeding
      the bound defeats the queue, and a blanket drop-newest is not universally correct.
    ref: concepts.md#backpressure-and-flow-control
  - id: resilience-tradeoffs-deep-dive-110
    difficulty: advanced
    tags:
      - advanced
      - gray-failure
      - outlier-detection
    question: |
      Envoy/Istio "outlier detection" ejects a backend from the load-balancing pool based on:
    options:
      - The backend's own self-reported health status only, polled from a /healthz endpoint that each host
        publishes about itself, so a process that believes it is fine is always kept in the pool
      - Statistics the CALLERS observe (consecutive 5xx, error rate, or latency) relative to peers, so a host
        that looks healthy to itself but is gray-failing to clients is temporarily ejected and later probed back in
      - A fixed round-robin schedule that rotates one host out of rotation every few minutes regardless of its
        observed behavior, purely to spread wear evenly across the backend fleet over time
      - The backend's CPU core temperature reported by the host's hardware sensors, ejecting any instance whose
        die runs hotter than a configured thermal threshold to avoid throttling
    answer: 1
    explanation: |
      Outlier detection uses caller-observed error/latency statistics (differential observability) to eject
      hosts that clients find bad even if the host self-reports healthy, then re-admits after a period. It is not
      based on self-reports, a schedule, or hardware temperature.
    ref: concepts.md#gray-failures-and-partial-failure-detection
  - id: resilience-tradeoffs-deep-dive-111
    difficulty: expert
    tags:
      - expert
      - metastable
      - trigger-vs-sustaining
    question: |
      A postmortem lists: (1) a deploy that briefly raised latency, and (2) clients retrying 3x with no budget.
      Correctly separating trigger from sustaining effect is important because:
    options:
      - The trigger and sustaining effect are simply two labels for one identical event, so addressing either
        the deploy or the retries fixes the whole incident and no further distinction is worth drawing
      - The deploy (trigger) was transient and is already gone; the un-budgeted retries (sustaining effect) are
        what keep the system saturated - so fixing only the deploy process will not prevent recurrence, whereas
        adding retry budgets/shedding removes the amplifier
      - Only the trigger matters; sustaining effects are secondary noise, so a thorough rollback and safer deploy
        pipeline is sufficient and the client retry configuration can be left exactly as it is
      - Sustaining effects always dissipate on their own once the trigger clears, because load naturally falls
        back below capacity the instant the originating latency spike from the deploy is resolved
    answer: 1
    explanation: |
      Preventing metastable recurrence means attacking the sustaining amplifier (un-budgeted retries), not just
      the transient trigger (the deploy). The two are distinct, both matter, and the sustaining effect is precisely
      what does NOT disappear when the trigger clears.
    ref: concepts.md#metastable-failures-and-the-feedback-loop
  - id: resilience-tradeoffs-deep-dive-112
    difficulty: advanced
    tags:
      - advanced
      - static-stability
      - multi-region
      - failover
    question: |
      For a multi-region active-passive setup, applying static stability to the failover itself means:
    options:
      - The passive region is kept cold with zero running instances and spun up via control-plane launch APIs
        only at the moment the primary fails, so you pay nothing for standby capacity until it is actually needed
      - The passive region is pre-scaled and already receiving replication so it can take full production load
        immediately, without depending on control-plane actions (bulk instance launches, capacity requests)
        during the incident
      - Failover is triggered manually only and never automatically, so that an on-call engineer must confirm the
        outage and issue the cutover command before any traffic is redirected to the passive region
      - The passive region shares the primary's single database cluster to save cost, reading and writing to the
        same instances so there is no separate copy of the data to keep in sync across the two regions
    answer: 1
    explanation: |
      A statically stable standby is pre-provisioned to full load and continuously replicated, so cutover needs
      no just-in-time control-plane scaling that could fail during the event. A cold region needing launch APIs is
      the fragile pattern; manual-only triggering and a shared DB are separate (and here harmful) choices.
    ref: concepts.md#static-stability
  - id: resilience-tradeoffs-deep-dive-113
    difficulty: expert
    tags:
      - expert
      - admission-control
      - cost-aware
    question: |
      A search service is overloaded. Some requests are cheap point lookups; a few are massive fan-out
      aggregations costing 1000x more. A count-based limiter (N requests/sec) is failing to protect it. The
      better admission policy is:
    options:
      - Lower the request-count limit aggressively until even the massive fan-out aggregations become rare
        enough that the service stops tipping over, accepting that most cheap lookups are throttled too
      - Cost-aware admission that accounts for each request's expected resource cost (e.g. a weighted/token cost
        per query), so a few fan-out queries cannot slip under a count limit and consume all capacity
      - Add more replicas behind the load balancer and keep the existing count-based limiter unchanged, scaling
        horizontally so the extra fan-out work is spread thinner across a larger pool of workers
      - Reject all fan-out aggregation queries permanently at the edge, forcing every client to decompose them
        into cheap point lookups so the count-based limiter is never confronted with an expensive request
    answer: 1
    explanation: |
      When request costs vary by orders of magnitude, admission must be cost-aware (weight by expected work), or
      a few heavy queries pass a count limit and exhaust capacity. Lowering the count limit penalizes cheap
      requests, more replicas defer the problem, and banning aggregations removes a feature unnecessarily.
    ref: concepts.md#admission-control-and-brownout
  - id: resilience-tradeoffs-deep-dive-114
    difficulty: advanced
    tags:
      - advanced
      - naive-fallback
      - observability
    question: |
      Regardless of whether you keep a fallback, one rule is non-negotiable. It is:
    options:
      - A fallback must always return data read from a local cache, since serving a slightly stale copy of the
        last-known-good result is the only acceptable behavior when the primary dependency is unavailable
      - A fallback firing must ALWAYS emit a metric/alarm - a silent fallback masks that the primary is failing
        and lets you degrade permanently without noticing
      - Fallbacks should be disabled entirely in production and enabled only in staging, so that real customer
        traffic never silently takes a degraded path that could hide a genuine primary-dependency outage
      - A fallback must always complete faster than the primary path it replaces, so that engaging it can never
        add latency to the request and callers see an immediate response the moment the primary slows down
    answer: 1
    explanation: |
      Silent fallbacks hide primary failures and cause unnoticed permanent degradation, so a fallback firing must
      always be observable (metric/alarm). Fallbacks need not be cached data, are not universally disabled, and
      need not be faster than the primary.
    ref: concepts.md#why-naive-fallbacks-are-dangerous
  - id: resilience-tradeoffs-deep-dive-115
    difficulty: advanced
    tags:
      - advanced
      - backpressure
      - little-law
      - latency
    question: |
      A queue steadily holds ~2000 items and the worker pool drains ~500 items/sec. By Little's Law, the
      average time an item waits in this queue is about:
    options:
      - 0.25 seconds, computed as throughput divided by queue depth (500 / 2000), giving the fraction of the
        backlog a single worker clears each second, which is the average time any one item spends waiting
      - 4 seconds, and this growing wait is what inflates end-to-end latency and triggers upstream timeouts/retries
        that can drive a metastable loop
      - 2000 seconds, since the wait time simply equals the number of items sitting in the queue and each queued
        item corresponds to one full second of accumulated delay before that item is finally serviced
      - It cannot be estimated without the CPU core count, because Little's Law needs the per-core service rate
        and the number of parallel workers before any average wait time can be derived from the queue depth
    answer: 1
    explanation: |
      Little's Law gives wait = queue_depth / throughput = 2000 / 500 = 4s; that latency inflation is exactly what
      causes upstream timeouts and retry amplification. 0.25s inverts the ratio, 2000s ignores throughput, and CPU
      count is not needed for the queueing estimate.
    ref: concepts.md#backpressure-and-flow-control
  - id: resilience-tradeoffs-deep-dive-116
    difficulty: expert
    tags:
      - expert
      - synthesis
      - scenario
      - metastable
    question: |
      You are asked to harden a service that suffered a metastable outage triggered by a dependency blip and
      sustained by client retries. Which layered set of changes most completely addresses BOTH the trigger
      sensitivity and the sustaining loop?
    options:
      - Only lengthen every client and server timeout and add more instances to the fleet, on the theory that
        extra capacity and a wider deadline window will absorb the blip and let the retries eventually succeed
      - Only add a circuit breaker with a fallback in front of the dependency, trusting that opening the breaker
        during the blip is enough on its own to keep the un-budgeted client retries from re-saturating the system
      - Bound and jitter retries with a retry budget, add a circuit breaker plus safe (tested, sized, observable)
        degradation for the dependency blip, add edge load shedding / adaptive concurrency to cap admitted work,
        and bound internal queues with backpressure - so the trigger is contained AND the amplifying loop is capped
      - Only switch the datastore to strong consistency, so that coordinated reads and writes eliminate the stale
        state that supposedly caused the clients to keep retrying the same request during the original outage
    answer: 2
    explanation: |
      Robustness needs both: contain the trigger (breaker + safe degradation, bounded queues) and cap the
      sustaining amplifier (retry budgets, shedding/adaptive concurrency). Timeouts+capacity alone leave the loop
      intact, a breaker alone ignores retry amplification, and consistency changes are irrelevant to overload.
    ref: concepts.md#metastable-failures-and-the-feedback-loop
