    options:
      - A brief shared-dependency blip can now fail the health check on MANY nodes at once, triggering a
        correlated mass-failover/eviction storm that removes healthy capacity - so deep checks must be scoped
        and liveness separated from readiness
      - Deep checks make gray failures impossible to occur, because probing the real request path on every
        interval guarantees any degradation is caught before a single client is ever affected by it
      - Deep checks reduce overall observability, because exercising the full dependency chain on each probe
        floods the telemetry pipeline and buries the genuine failure signal under routine health-check noise
      - Deep checks always consume less CPU than shallow checks, since reusing the existing real request path
        avoids maintaining a separate lightweight endpoint that would otherwise burn extra cycles per poll
    answer: 0
    explanation: |
      Deep checks that depend on shared downstreams correlate failures: one dependency blip fails many nodes'
      checks simultaneously, evicting healthy capacity in a herd. That is why liveness (is the process up) and
      readiness (can it serve) are separated and deep checks are scoped carefully.
    ref: concepts.md#gray-failures-and-partial-failure-detection
  - id: resilience-tradeoffs-deep-dive-099
