topic: Resilience, Fault Tolerance and Design Trade-offs Deep-Dive
domain: system-design
topic_slug: resilience-tradeoffs-deep-dive
version: 1
questions:
  - id: resilience-tradeoffs-deep-dive-001
    difficulty: beginner
    tags:
      - fallacies
      - distributed-systems
      - fundamentals
    question: |
      Which statement best captures why "the fallacies of distributed computing" matter for resilience design?
    options:
      - They are false assumptions (e.g. the network is reliable, latency is zero) that, when baked into
        code, cause most distributed-system outages
      - They are performance-tuning tips that only apply to high-frequency trading systems
      - They describe the only three ways a database can fail
      - They are legal compliance requirements for cloud providers
    answer: 0
    explanation: |
      The fallacies are wrong assumptions engineers implicitly make; each maps to a resilience pattern
      (unreliable network -> retries/timeouts, non-zero latency -> deadlines, etc.). They are not tuning
      tips, a fixed failure taxonomy, or legal requirements.
    ref: concepts.md#fallacies-of-distributed-computing
  - id: resilience-tradeoffs-deep-dive-002
    difficulty: beginner
    tags:
      - timeouts
      - fundamentals
    question: |
      What is the primary purpose of setting a timeout on a network call?
    options:
      - To make the call return faster on the happy path
      - To convert an unbounded wait on a hung dependency into a bounded, handleable failure
      - To guarantee the request is processed exactly once
      - To encrypt the request in transit
    answer: 1
    explanation: |
      A timeout bounds how long you wait so a hung dependency cannot block your threads forever. It does
      not speed up healthy calls, provide exactly-once semantics (that is idempotency), or provide encryption.
    ref: concepts.md#timeouts-and-deadlines
  - id: resilience-tradeoffs-deep-dive-003
    difficulty: beginner
    tags:
      - retries
      - backoff
      - jitter
    question: |
      Why is jitter added to exponential backoff when retrying?
    options:
      - To make retries deterministic and easy to debug
      - To encrypt the retry payload
      - To de-synchronize clients so they don't all retry at the same instant and create a thundering
        herd
      - To increase the number of retries allowed
    answer: 2
    explanation: |
      Without jitter, all failed clients retry at identical times, creating synchronized load spikes. Jitter
      randomizes the delay to spread retries out. It does not add determinism, encryption, or extra attempts.
    ref: concepts.md#retries-backoff-and-jitter
  - id: resilience-tradeoffs-deep-dive-004
    difficulty: beginner
    tags:
      - idempotency
      - retries
    question: |
      An operation is idempotent if:
    options:
      - It always returns an error on the second call
      - It never touches the database
      - It completes in constant time
      - Performing it multiple times has the same effect as performing it once
    answer: 3
    explanation: |
      Idempotency means repeated execution yields the same result/state as a single execution, which is what
      makes retries of state-changing operations safe. The other options are unrelated properties.
    ref: concepts.md#idempotency-for-safe-retries
  - id: resilience-tradeoffs-deep-dive-005
    difficulty: beginner
    tags:
      - circuit-breaker
      - states
    question: |
      In a circuit breaker, what happens in the OPEN state?
    options:
      - Requests are rejected immediately without calling the failing dependency
      - All requests are passed through normally
      - A single request is allowed through to test recovery
      - The dependency is automatically restarted
    answer: 0
    explanation: |
      OPEN means the breaker has tripped and rejects calls immediately (fail fast) so the sick dependency
      gets no load. Passing all through is CLOSED; a trial request is HALF-OPEN; breakers don't restart deps.
    ref: concepts.md#circuit-breakers
  - id: resilience-tradeoffs-deep-dive-006
    difficulty: beginner
    tags:
      - bulkhead
      - isolation
    question: |
      The bulkhead pattern is named after ship compartments because it:
    options:
      - Encrypts data at rest
      - Partitions resources so a failure in one area cannot consume all resources and sink the whole
        system
      - Compresses network traffic
      - Guarantees strong consistency across replicas
    answer: 1
    explanation: |
      Bulkheads isolate resources (thread/connection pools, instances) so one flooded compartment doesn't
      sink the ship. The other options describe unrelated mechanisms.
    ref: concepts.md#bulkheads-and-isolation
  - id: resilience-tradeoffs-deep-dive-007
    difficulty: beginner
    tags:
      - rate-limiting
      - load-shedding
    question: |
      What is the key difference between rate limiting and load shedding?
    options:
      - They are two names for the same thing
      - Rate limiting only works at the database layer; load shedding only at the CDN
      - Rate limiting is a policy applied to clients (e.g. 100 rps each); load shedding is a reaction
        to the server's own health, dropping work when near collapse
      - Load shedding increases throughput while rate limiting decreases it
    answer: 2
    explanation: |
      Rate limiting enforces a per-client quota; load shedding is the server deliberately dropping (often
      lower-priority) work when it is overloaded to avoid total collapse. They are distinct and complementary.
    ref: concepts.md#rate-limiting-and-load-shedding
  - id: resilience-tradeoffs-deep-dive-008
    difficulty: beginner
    tags:
      - graceful-degradation
      - fallback
    question: |
      Graceful degradation means:
    options:
      - Returning a generic error page whenever any dependency fails
      - Slowing down all requests uniformly
      - Automatically deleting corrupted data
      - Serving a reduced-but-useful experience (e.g. stale cache or hidden optional feature) when a dependency
        fails, instead of failing entirely
    answer: 3
    explanation: |
      Graceful degradation keeps the core experience working with reduced quality/features rather than a
      total failure. It is not a blanket error page, uniform slowdown, or data deletion.
    ref: concepts.md#graceful-degradation-and-fallbacks
  - id: resilience-tradeoffs-deep-dive-009
    difficulty: beginner
    tags:
      - redundancy
      - failover
      - active-passive
    question: |
      In an active-passive redundancy setup:
    options:
      - A primary serves traffic while one or more standbys replicate and wait to be promoted on failure
      - All replicas serve traffic simultaneously
      - There is only ever one copy of the data
      - Writes are randomly distributed across all nodes
    answer: 0
    explanation: |
      Active-passive has one active primary and idle standby(s) that take over on failure (with an RTO gap).
      All-serving is active-active; a single copy is no redundancy; random write distribution is active-active.
    ref: concepts.md#redundancy-and-failover
  - id: resilience-tradeoffs-deep-dive-010
    difficulty: beginner
    tags:
      - blast-radius
      - definitions
    question: |
      "Blast radius" in resilience engineering refers to:
    options:
      - The physical distance between two data centers
      - How much of the system and how many customers a single failure can affect
      - The maximum QPS a service can handle
      - The time it takes to deploy a new version
    answer: 1
    explanation: |
      Blast radius is the scope of impact of a failure. Shrinking it (via cells, shuffle sharding, canaries)
      is a central resilience goal. The other options describe distance, capacity, and deploy time.
    ref: concepts.md#blast-radius-and-cell-based-architecture
  - id: resilience-tradeoffs-deep-dive-011
    difficulty: beginner
    tags:
      - chaos-engineering
      - netflix
    question: |
      Netflix's Chaos Monkey is best described as a tool that:
    options:
      - Automatically writes unit tests
      - Encrypts data in transit
      - Randomly terminates production instances to verify the system tolerates instance failure
      - Load-balances requests across regions
    answer: 2
    explanation: |
      Chaos Monkey randomly kills instances to force teams to build for instance failure. It is not a test
      generator, encryptor, or load balancer.
    ref: concepts.md#chaos-engineering
  - id: resilience-tradeoffs-deep-dive-012
    difficulty: beginner
    tags:
      - cap
      - pacelc
      - framework
    question: |
      According to the CAP theorem, when a network partition occurs, a distributed data store must choose between:
    options:
      - Latency and cost
      - Durability and throughput
      - Encryption and compression
      - Consistency and Availability
    answer: 3
    explanation: |
      During a partition you can preserve consistency or availability, not both. Latency-vs-consistency (the
      non-partition case) is PACELC's contribution. The other pairs are unrelated to CAP.
    ref: concepts.md#consistency-availability-latency-and-cost-as-a-unifying-trade-off-framework
  - id: resilience-tradeoffs-deep-dive-013
    difficulty: beginner
    tags:
      - interview
      - articulation
    question: |
      When articulating a design trade-off in an interview, the strongest habit is to:
    options:
      - State what you gain, what you give up, and the condition under which you'd choose the alternative
      - Always pick the option with the strongest consistency regardless of requirements
      - List as many components as possible without justifying them
      - Avoid mentioning any downsides of your chosen design
    answer: 0
    explanation: |
      Senior signal is naming the gain, the sacrifice, and the crossover point. Blindly maximizing one axis,
      breadth without justification, and hiding downsides are all anti-patterns.
    ref: concepts.md#articulating-trade-offs-in-an-interview
  - id: resilience-tradeoffs-deep-dive-014
    difficulty: intermediate
    tags:
      - fallacies
      - cascading-failure
      - timeouts
    question: |
      A service makes a synchronous call to a dependency with no timeout. The dependency becomes slow (not
      down). What is the most likely failure mode for the calling service?
    options:
      - It returns stale data from cache
      - Its thread/connection pool exhausts as calls pile up waiting, making the healthy caller itself
        unavailable
      - It automatically shards its database
      - It silently drops the requests with no impact
    answer: 1
    explanation: |
      With no timeout, waiting calls consume all threads/connections; the caller becomes unavailable even
      though it is healthy - a classic cascading failure from the "network is reliable / latency is zero"
      fallacies. Caching, sharding, and silent drops are not what happens.
    ref: concepts.md#fallacies-of-distributed-computing
  - id: resilience-tradeoffs-deep-dive-015
    difficulty: intermediate
    tags:
      - timeouts
      - latency-distribution
    question: |
      A dependency has p50=10ms, p99=40ms, p99.9=120ms. You set a client timeout of 100ms. What is the most
      likely consequence?
    options:
      - No healthy request will ever time out
      - All requests slower than the p50 will fail
      - Roughly the slowest ~0.1%+ of otherwise-healthy requests will be failed as timeouts
      - The dependency will automatically get faster
    answer: 2
    explanation: |
      100ms sits between p99 and p99.9, so the slow tail above 100ms (a fraction of a percent, growing toward
      the p99.9 mark) will be spuriously failed. It is not zero (the tail exceeds 100ms), nor everything above p50.
    ref: concepts.md#timeouts-and-deadlines
  - id: resilience-tradeoffs-deep-dive-016
    difficulty: intermediate
    tags:
      - deadlines
      - deadline-propagation
    question: |
      What problem does deadline propagation (passing a shrinking time budget down a call chain) solve that
      per-hop timeouts alone do not?
    options:
      - It encrypts each hop's payload
      - It guarantees exactly-once processing
      - It removes the need for retries entirely
      - It prevents downstream services from doing useless work on a request the upstream caller has already
        abandoned
    answer: 3
    explanation: |
      With deadline propagation, each hop knows the remaining budget and fails fast if it's exhausted, so B/C/D
      don't keep working after A gave up. It is not encryption, exactly-once, or a retry replacement.
    ref: concepts.md#timeouts-and-deadlines
  - id: resilience-tradeoffs-deep-dive-017
    difficulty: intermediate
    tags:
      - retries
      - retry-storm
      - metastable
    question: |
      A dependency briefly fails; every client retries aggressively with no backoff or budget. Even after the
      original trigger clears, the system stays overloaded. This is best described as:
    options:
      - A metastable failure / retry storm, where retries themselves sustain the overload
      - A split-brain condition
      - A quorum loss
      - A cache stampede caused by TTL expiry
    answer: 0
    explanation: |
      Retry amplification keeps load high enough that the system can't recover even after the trigger is gone -
      a metastable failure. Split-brain is dual-primary; quorum loss and cache stampede are different mechanisms.
    ref: concepts.md#retries-backoff-and-jitter
  - id: resilience-tradeoffs-deep-dive-018
    difficulty: intermediate
    tags:
      - retries
      - amplification
      - call-chain
    question: |
      In a call chain A -> B -> C -> D, each layer independently retries a failed call up to 3 times. In the
      worst case, how many calls can reach D for one user request, and what's the mitigation?
    options:
      - 3 calls; add more retries
      - 27 calls; retry at only one layer (e.g. the edge) and use a retry budget
      - 9 calls; increase timeouts
      - 1 call; retries never amplify
    answer: 1
    explanation: |
      Multiplicative amplification gives 3x3x3 = 27 calls to D. The fix is to retry at a single layer and cap
      aggregate retries with a budget, not to add retries or just raise timeouts.
    ref: concepts.md#retries-backoff-and-jitter
  - id: resilience-tradeoffs-deep-dive-019
    difficulty: intermediate
    tags:
      - retries
      - retryable-errors
    question: |
      Which of these responses is generally SAFE to retry automatically?
    options:
      - 400 Bad Request
      - 401 Unauthorized
      - 503 Service Unavailable / connection reset
      - 409 Conflict on a non-idempotent create
    answer: 2
    explanation: |
      503 and connection resets are typically transient and retryable. 400/401 are deterministic client
      errors (retrying won't help), and retrying a non-idempotent 409 create risks duplicates.
    ref: concepts.md#retries-backoff-and-jitter
  - id: resilience-tradeoffs-deep-dive-020
    difficulty: intermediate
    tags:
      - idempotency
      - payments
      - keys
    question: |
      A payments API wants POST /charges to be safe to retry after a network timeout. The standard mechanism is:
    options:
      - Retry only when the moon is full
      - Never allow retries on the charge endpoint
      - Make the client poll GET until the charge appears, then guess
      - Have the client send a unique idempotency key; the server records key->result and returns the
        stored result on duplicates
    answer: 3
    explanation: |
      Client-supplied idempotency keys plus a server-side dedup store (with conditional writes) make retried
      charges execute once - the approach Stripe/PayPal use. Banning retries harms reliability; polling/guessing
      is fragile and racy.
    ref: concepts.md#idempotency-for-safe-retries
  - id: resilience-tradeoffs-deep-dive-021
    difficulty: intermediate
    tags:
      - idempotency
      - exactly-once
      - delivery
    question: |
      Why is "exactly-once delivery" over an unreliable network generally considered impossible, and what is
      the practical alternative?
    options:
      - Because acks can be lost, you settle for at-least-once delivery plus idempotent processing = effectively-once
      - It is possible with a fast enough network; just add more bandwidth
      - You use at-most-once delivery and accept data loss for everything
      - You disable retries so each message is sent once
    answer: 0
    explanation: |
      A lost acknowledgement forces a choice between resend (at-least-once) or not (at-most-once); combining
      at-least-once with idempotent processing yields effectively-once. Bandwidth doesn't solve it, and
      disabling retries just gives at-most-once with loss.
    ref: concepts.md#idempotency-for-safe-retries
  - id: resilience-tradeoffs-deep-dive-022
    difficulty: intermediate
    tags:
      - circuit-breaker
      - half-open
    question: |
      What is the role of the HALF-OPEN state in a circuit breaker?
    options:
      - It permanently blocks all traffic to the dependency
      - It lets a small number of trial requests through to test whether the dependency has recovered
        before fully closing
      - It doubles the request rate to stress-test the dependency
      - It routes traffic to a different data center
    answer: 1
    explanation: |
      HALF-OPEN sends a trickle of probe requests after the cooldown; success closes the breaker, failure
      reopens it. It neither blocks permanently, amplifies load, nor reroutes regions.
    ref: concepts.md#circuit-breakers
  - id: resilience-tradeoffs-deep-dive-023
    difficulty: intermediate
    tags:
      - circuit-breaker
      - retries
      - comparison
    question: |
      How do retries and circuit breakers embody opposite assumptions, and why are both needed?
    options:
      - They make identical assumptions; using one makes the other redundant
      - Retries are for reads only and breakers for writes only
      - Retries assume the fault is transient and re-send; breakers assume it is sustained and stop sending
        - the breaker governs the retries so you don't hammer a dead dependency
      - Breakers replace timeouts entirely
    answer: 2
    explanation: |
      Retries bet on transience; breakers detect sustained failure and cut off retries. Combined, retries handle
      blips while the breaker prevents retry storms during real outages. They are not read/write specific and
      breakers do not replace timeouts.
    ref: concepts.md#circuit-breakers
  - id: resilience-tradeoffs-deep-dive-024
    difficulty: intermediate
    tags:
      - bulkhead
      - thread-pool
    question: |
      Giving each downstream dependency its own bounded thread pool (rather than a shared global pool)
      primarily buys you:
    options:
      - Higher resource utilization
      - Stronger data consistency
      - Lower storage costs
      - 'Fault isolation: a single hung dependency can only exhaust its own pool, not starve calls to
        healthy dependencies'
    answer: 3
    explanation: |
      Per-dependency pools contain a hang to that dependency, protecting the rest. The trade-off is LOWER
      utilization (pools sit partly idle), not higher, and it has nothing to do with consistency or storage.
    ref: concepts.md#bulkheads-and-isolation
  - id: resilience-tradeoffs-deep-dive-025
    difficulty: intermediate
    tags:
      - rate-limiting
      - algorithms
      - token-bucket
    question: |
      Which rate-limiting algorithm naturally allows short bursts up to a configured size while enforcing a
      long-run average rate, and is the common default?
    options:
      - Token bucket
      - Fixed window counter
      - Leaky bucket (constant output)
      - Sliding window log
    answer: 0
    explanation: |
      Token bucket accumulates tokens up to a bucket size (allowing bursts) and refills at rate R (bounding the
      average). Leaky bucket smooths to a constant rate (no bursts), fixed window has boundary-burst issues, and
      sliding window log is accurate but memory-heavy.
    ref: concepts.md#rate-limiting-and-load-shedding
  - id: resilience-tradeoffs-deep-dive-026
    difficulty: intermediate
    tags:
      - load-shedding
      - prioritization
    question: |
      An e-commerce service is at 95% CPU during a spike. Prioritized load shedding would most appropriately:
    options:
      - Drop checkout requests first because they are the most expensive
      - Drop low-value requests (e.g. recommendation widgets) first while continuing to serve high-value
        paths like checkout
      - Reject all requests equally until CPU drops
      - Increase timeouts on every request
    answer: 1
    explanation: |
      The point of prioritized shedding is to sacrifice low-value work to protect revenue-critical paths.
      Dropping checkout defeats the purpose, blanket rejection is a worse outcome, and raising timeouts worsens
      overload.
    ref: concepts.md#rate-limiting-and-load-shedding
  - id: resilience-tradeoffs-deep-dive-027
    difficulty: intermediate
    tags:
      - graceful-degradation
      - fallback-ladder
    question: |
      A product page depends on an inventory service (critical), a reviews service, and a recommendations
      service (both optional). The recommendations service is down. The best degradation strategy is:
    options:
      - Return a 500 for the entire product page
      - Block all writes site-wide until recommendations recover
      - Hide or show default recommendations while rendering the rest of the page normally, and emit a
        metric that the fallback fired
      - Retry recommendations synchronously forever until it responds
    answer: 2
    explanation: |
      Optional features should degrade (hide/default) without failing the critical path, and fallbacks should
      be observable. Failing the whole page, a site-wide write freeze, or infinite synchronous retries all
      violate the isolate-the-critical-path principle.
    ref: concepts.md#graceful-degradation-and-fallbacks
  - id: resilience-tradeoffs-deep-dive-028
    difficulty: intermediate
    tags:
      - failover
      - rto
      - rpo
    question: |
      In active-passive failover, RTO and RPO respectively refer to:
    options:
      - Read throughput and write throughput
      - The number of replicas and the number of regions
      - Request timeout and response timeout
      - How long recovery takes (detection + promotion) and how much recent data may be lost (unreplicated
        writes)
    answer: 3
    explanation: |
      RTO (recovery time objective) is the downtime during failover; RPO (recovery point objective) is the
      acceptable data loss window. They are not throughputs, counts, or timeouts.
    ref: concepts.md#redundancy-and-failover
  - id: resilience-tradeoffs-deep-dive-029
    difficulty: intermediate
    tags:
      - failover
      - split-brain
    question: |
      During a network partition, both a primary and its standby conclude they should be the writer. This
      dangerous condition is called split-brain. It is typically prevented by:
    options:
      - Requiring a quorum / lease / fencing token so only one node can legitimately act as primary
      - Increasing the read timeout
      - Adding more read replicas
      - Compressing replication traffic
    answer: 0
    explanation: |
      Quorum-based election, leases, and fencing tokens ensure a single legitimate writer, preventing dual
      primaries. Timeouts, extra read replicas, and compression do not address split-brain.
    ref: concepts.md#redundancy-and-failover
  - id: resilience-tradeoffs-deep-dive-030
    difficulty: intermediate
    tags:
      - multi-region
      - latency-wall
    question: |
      Why do most multi-region active-active designs avoid synchronous cross-region writes for every request?
    options:
      - Cross-region bandwidth is free but CPU is expensive
      - The speed of light makes cross-region round trips ~30-150ms, so synchronous global writes add
        prohibitive per-write latency
      - Regions cannot replicate data at all
      - DNS does not work across regions
    answer: 1
    explanation: |
      Physical distance imposes tens to 100+ ms per cross-region round trip, so synchronous global writes are
      often unacceptable; designs use async replication or region-partitioned data. Bandwidth cost, inability
      to replicate, and DNS are not the core issue.
    ref: concepts.md#multi-region-architecture-trade-offs
  - id: resilience-tradeoffs-deep-dive-031
    difficulty: intermediate
    tags:
      - cell-based
      - blast-radius
    question: |
      In cell-based architecture, if you run 20 independent cells each serving 1/20 of customers, a
      cell-local failure (bad deploy, poison-pill request, hot key) affects approximately:
    options:
      - 100% of customers
      - 0% of customers, failures are impossible
      - About 5% of customers (those in the affected cell)
      - 50% of customers
    answer: 2
    explanation: |
      A cell-scoped failure is contained to that cell's customers, ~1/20 = 5%. Cells reduce blast radius; they
      don't eliminate failure or affect everyone/half.
    ref: concepts.md#blast-radius-and-cell-based-architecture
  - id: resilience-tradeoffs-deep-dive-032
    difficulty: intermediate
    tags:
      - chaos-engineering
      - method
    question: |
      What is the correct first step of a chaos engineering experiment?
    options:
      - Kill as many production instances as possible with no plan
      - Disable all monitoring so results aren't biased
      - Run it only after a real outage to confirm the cause
      - Define a measurable steady-state metric that represents 'healthy' before injecting any fault
    answer: 3
    explanation: |
      You must define steady state (e.g. orders/sec) so you can tell whether the injected fault broke anything.
      Blind mass-killing, disabling monitoring, and post-outage-only testing all defeat the purpose.
    ref: concepts.md#chaos-engineering
  - id: resilience-tradeoffs-deep-dive-033
    difficulty: intermediate
    tags:
      - pacelc
      - framework
    question: |
      PACELC extends CAP by adding which insight?
    options:
      - Even with no partition (Else), you still trade Latency against Consistency because stronger consistency
        needs more coordination
      - Partition tolerance is optional
      - Availability always beats consistency
      - Cost is the only axis that matters
    answer: 0
    explanation: |
      PACELC says: if Partition -> A or C; Else -> Latency or Consistency. It captures the everyday coordination
      tax that CAP ignores. P is not optional, neither A nor C universally wins, and cost is not the sole axis.
    ref: concepts.md#consistency-availability-latency-and-cost-as-a-unifying-trade-off-framework
  - id: resilience-tradeoffs-deep-dive-034
    difficulty: intermediate
    tags:
      - availability
      - nines
      - cost
    question: |
      Moving a service from 99.9% to 99.99% availability roughly means going from ~8.8 hours/year of
      downtime to ~52 minutes/year. What is the main trade-off this represents?
    options:
      - It's free once you flip a config flag
      - Each additional 'nine' costs roughly exponentially more (more redundancy, automation, multi-AZ/region),
        so you buy it only if the SLA requires it
      - Higher availability always reduces latency
      - It only affects read consistency
    answer: 1
    explanation: |
      Extra nines require progressively more redundancy and automation - cost grows steeply. It is not free,
      does not inherently improve latency, and is not merely a read-consistency concern.
    ref: concepts.md#consistency-availability-latency-and-cost-as-a-unifying-trade-off-framework
  - id: resilience-tradeoffs-deep-dive-035
    difficulty: intermediate
    tags:
      - interview
      - script
      - requirements
    question: |
      Before proposing a resilience design in an interview, the most valuable thing to establish first is:
    options:
      - The programming language you'll use
      - The exact number of microservices
      - 'The concrete constraints and SLA: consistency needs, latency budget, availability target, and
        budget'
      - Which cloud provider's logo to draw
    answer: 2
    explanation: |
      Constraints drive every trade-off; you can't justify choices without the SLA/latency/consistency/budget
      targets. Language, service count, and provider branding are secondary.
    ref: concepts.md#articulating-trade-offs-in-an-interview
  - id: resilience-tradeoffs-deep-dive-036
    difficulty: intermediate
    tags:
      - rate-limiting
      - distributed-counter
    question: |
      Enforcing a globally accurate rate limit across many API-gateway instances typically requires a shared
      counter (e.g. in Redis). What is the core trade-off versus a purely local per-instance limit?
    options:
      - The shared counter is always cheaper and faster
      - Local limits are always more accurate
      - There is no difference in behavior
      - A shared counter gives accuracy but adds a network hop (latency) and a dependency/consistency
        cost; local limits are cheap but leaky (allow more than intended in aggregate)
    answer: 3
    explanation: |
      Global accuracy needs coordination (Redis) -> latency and a dependency; local limits avoid that cost but
      overshoot the aggregate limit. Local is not more accurate, shared is not always cheaper, and the behaviors
      clearly differ.
    ref: concepts.md#rate-limiting-and-load-shedding
  - id: resilience-tradeoffs-deep-dive-037
    difficulty: intermediate
    tags:
      - capacity
      - estimation
      - qps
    question: |
      One instance sustains 500 rps. You must handle 1,000,000 rps at peak and want ~30% headroom for spikes
      and failover. Roughly how many instances do you need?
    options:
      - About 2,600
      - About 200
      - About 2,000
      - About 20,000
    answer: 0
    explanation: |
      1,000,000 / 500 = 2,000 for steady state; adding ~30% headroom gives ~2,600. 2,000 ignores headroom, 200
      is off by 10x, and 20,000 is 10x too high.
    ref: concepts.md#rate-limiting-and-load-shedding
  - id: resilience-tradeoffs-deep-dive-038
    difficulty: advanced
    tags:
      - retries
      - retry-budget
      - overload
    question: |
      Your service already uses exponential backoff with full jitter, yet a dependency's brief outage still
      escalates into a wider outage because retries multiply total load. The single most effective additional
      control is:
    options:
      - Increase the maximum number of retries per request
      - Add a retry budget / token bucket that caps retries as a fraction of overall traffic (e.g. <=10%),
        bounding aggregate retry load
      - Remove jitter to make retries predictable
      - Shorten all timeouts to near zero
    answer: 1
    explanation: |
      Backoff/jitter shape individual clients but don't cap AGGREGATE retry load; a retry budget does exactly
      that and is the storm-proofing control. More retries worsens it, removing jitter re-synchronizes herds,
      and near-zero timeouts cause spurious failures and more retries.
    ref: concepts.md#retries-backoff-and-jitter
  - id: resilience-tradeoffs-deep-dive-039
    difficulty: advanced
    tags:
      - circuit-breaker
      - self-inflicted
      - thresholds
    question: |
      A circuit breaker configured to open when >50% of the last 20 calls fail keeps tripping during brief
      latency blips, causing a self-inflicted partial outage for a dependency that was actually fine. The best
      remediation is:
    options:
      - Remove the circuit breaker entirely
      - Lower the failure threshold to 10% so it opens even faster
      - Tune the sensitivity (larger window / require minimum volume / longer measurement), add a fallback
        behind it, and keep half-open probing gentle
      - Retry indefinitely instead of breaking
    answer: 2
    explanation: |
      Over-eager breakers should be made less twitchy (bigger window, min volume, error-rate thresholds) and
      backed by a fallback so opening isn't catastrophic. Removing it loses cascade protection, a 10% threshold
      makes it MORE eager, and infinite retries reintroduce storms.
    ref: concepts.md#circuit-breakers
  - id: resilience-tradeoffs-deep-dive-040
    difficulty: advanced
    tags:
      - active-active
      - active-passive
      - scenario
    question: |
      You're designing the database for a financial ledger that must guarantee a single source of truth and
      never double-apply a transaction, while a ~30-second failover is acceptable. Which choice best fits, and why?
    options:
      - Multi-master active-active with last-write-wins, because it maximizes write availability
      - Active-active across three regions with eventual consistency, because it has the lowest latency
      - A single instance with no replica, because ledgers must be simple
      - Active-passive with a single writer and synchronous replication to a standby, accepting the RTO
        gap, because single-writer semantics preserve ledger correctness
    answer: 3
    explanation: |
      Ledgers need single-writer, strong-consistency semantics; active-passive provides that and a 30s RTO is
      acceptable. LWW active-active risks lost/conflicting writes, eventual multi-region breaks correctness, and
      a single instance has no redundancy.
    ref: concepts.md#redundancy-and-failover
  - id: resilience-tradeoffs-deep-dive-041
    difficulty: advanced
    tags:
      - multi-region
      - region-partition
      - scenario
    question: |
      A global social app needs low write latency everywhere and must survive a full region loss, but can
      tolerate that a user's data lives in one 'home' region. The most appropriate pattern is:
    options:
      - Active-active with data partitioned by region (users pinned to a home region so writes stay local),
        plus cross-region replication for failover
      - Synchronous quorum writes spanning all regions for every request
      - Single-region multi-AZ only
      - Active-passive with the primary in one region and all users worldwide hitting it synchronously
    answer: 0
    explanation: |
      Region-partitioned active-active keeps writes local (low latency) and strong within the home region while
      surviving region loss via replication. Synchronous global writes pay the latency wall, single-region can't
      survive region loss, and a single global primary gives far users high latency.
    ref: concepts.md#multi-region-architecture-trade-offs
  - id: resilience-tradeoffs-deep-dive-042
    difficulty: advanced
    tags:
      - shuffle-sharding
      - blast-radius
    question: |
      Shuffle sharding (as used by AWS Route 53/ELB) reduces blast radius by:
    options:
      - Assigning every customer to the exact same set of nodes
      - Assigning each customer a random combination (subset) of nodes, so two customers rarely share
        the same full set and a few bad nodes affect few overlapping customers
      - Encrypting each customer's traffic separately
      - Giving each customer a dedicated physical data center
    answer: 1
    explanation: |
      By giving each customer a random subset of nodes, the number of distinct virtual shards grows
      combinatorially, so failures/poison-pills rarely hit the same customer pair - cheap isolation. It is not
      one shared set, encryption, or dedicated data centers.
    ref: concepts.md#blast-radius-and-cell-based-architecture
  - id: resilience-tradeoffs-deep-dive-043
    difficulty: advanced
    tags:
      - cell-based
      - trade-offs
      - utilization
    question: |
      What is the PRIMARY cost you accept when adopting cell-based architecture over a single shared stack?
    options:
      - Weaker encryption
      - Loss of the ability to do canary deploys
      - Operational complexity and lower resource utilization (each cell needs its own headroom; cross-cell
        operations become hard)
      - Inability to scale horizontally
    answer: 2
    explanation: |
      Cells trade complexity and per-cell headroom (lower utilization) plus difficult cross-cell queries for
      blast-radius isolation. They don't weaken encryption, prevent canaries (they enable per-cell rollout), or
      block horizontal scaling.
    ref: concepts.md#blast-radius-and-cell-based-architecture
  - id: resilience-tradeoffs-deep-dive-044
    difficulty: advanced
    tags:
      - chaos-engineering
      - production
      - blast-radius
    question: |
      A team wants to run chaos experiments in production. What best balances value against risk?
    options:
      - Run the largest possible fault injection immediately across 100% of traffic
      - Only ever test in staging because production is too risky
      - Disable alerts during the experiment to avoid noise
      - Start with a minimal blast radius (one instance / small % of traffic), watch steady-state metrics,
        keep an abort switch, and expand only as confidence grows
    answer: 3
    explanation: |
      Controlled, small-blast-radius experiments with an abort switch capture real-world weaknesses at bounded
      risk. Full-blast injection is reckless, staging-only misses real failure modes, and disabling alerts blinds
      you to harm.
    ref: concepts.md#chaos-engineering
  - id: resilience-tradeoffs-deep-dive-045
    difficulty: advanced
    tags:
      - fallback
      - anti-pattern
      - correlated-failure
    question: |
      Marc Brooker (AWS) warns that static fallbacks can be dangerous. What is a key risk of relying on a
      fallback path during a dependency failure?
    options:
      - The fallback path is rarely exercised, may itself be broken/undersized, and can fire in a correlated
        way exactly when everything is stressed - so failures should be observable and the fallback tested
      - Fallbacks always return fresher data than the primary
      - Fallbacks make the happy path slower
      - Fallbacks eliminate the need for timeouts
    answer: 0
    explanation: |
      Cold, untested fallback paths can fail or be overwhelmed precisely under load, and silent fallbacks mask
      problems - so alert on them and test them. Fallbacks are not fresher, don't slow the happy path, and don't
      remove the need for timeouts.
    ref: concepts.md#graceful-degradation-and-fallbacks
  - id: resilience-tradeoffs-deep-dive-046
    difficulty: advanced
    tags:
      - load-shedding
      - adaptive
      - little-law
    question: |
      Instead of shedding at a fixed rps threshold, modern adaptive load shedding (Netflix/Google) reacts to
      measured latency or queue depth. Which principle underpins this?
    options:
      - CAP theorem
      - 'Little''s Law (concurrency = arrival_rate x latency): rising latency implies rising concurrency,
        so admitted concurrency should drop automatically'
      - The end-to-end argument
      - Amdahl's Law
    answer: 1
    explanation: |
      Little's Law links concurrency, arrival rate, and latency; adaptive limiters watch latency/queue depth to
      self-tune admission without magic rps numbers. CAP, the end-to-end argument, and Amdahl's Law are unrelated here.
    ref: concepts.md#rate-limiting-and-load-shedding
  - id: resilience-tradeoffs-deep-dive-047
    difficulty: advanced
    tags:
      - idempotency
      - concurrency
      - conditional-write
    question: |
      Two retries of the same idempotent operation arrive concurrently and both check "has this key been
      processed?" before either writes the result. What technique prevents both from executing the side effect?
    options:
      - Increase the idempotency key TTL
      - Retry more slowly
      - Use an atomic conditional write (e.g. PutItem with attribute_not_exists / INSERT with unique constraint)
        so only one request can claim the key
      - Store the key in a local in-memory map per instance
    answer: 2
    explanation: |
      A check-then-act race is closed by an atomic claim (conditional write / unique constraint) so exactly one
      request wins. TTL and slower retries don't fix the race, and a per-instance map fails across multiple servers.
    ref: concepts.md#idempotency-for-safe-retries
  - id: resilience-tradeoffs-deep-dive-048
    difficulty: advanced
    tags:
      - timeouts
      - bulkhead
      - cascading
    question: |
      A service calls three dependencies from one shared connection pool of 100. Dependency X starts taking
      10s per call (it's degraded, not down). Which combination most directly prevents X from taking down the
      whole service?
    options:
      - Only add more retries to X
      - Increase the shared pool to 1000
      - Add stronger consistency to X's datastore
      - A tight timeout on X plus a bulkhead giving X its own bounded pool, so X's slowness frees threads
        quickly and can't drain the shared pool
    answer: 3
    explanation: |
      Tight timeouts bound how long X ties up a thread, and a bulkhead confines X to its own pool so healthy
      dependencies keep their capacity. More retries worsen load, a bigger shared pool just delays exhaustion,
      and consistency is irrelevant.
    ref: concepts.md#bulkheads-and-isolation
  - id: resilience-tradeoffs-deep-dive-049
    difficulty: advanced
    tags:
      - framework
      - coordination-tax
      - consistency
    question: |
      Why is it fundamentally impossible to have strong global consistency, low global write latency, and
      region-loss survival all at once, cheaply?
    options:
      - Strong consistency requires coordination (round trips among nodes); across regions those round
        trips cost tens to 100+ ms - it's physics (speed of light) plus CAP/FLP, not a tooling gap
      - It's just an engineering limitation that will be solved by faster CPUs
      - Because databases refuse to replicate across regions
      - Because DNS caching prevents it
    answer: 0
    explanation: |
      The coordination tax is inherent: consistency needs agreement, agreement needs round trips, and
      cross-region round trips are bounded by light speed. It's a physical/theoretical limit, not a CPU, DB, or
      DNS issue.
    ref: concepts.md#consistency-availability-latency-and-cost-as-a-unifying-trade-off-framework
  - id: resilience-tradeoffs-deep-dive-050
    difficulty: advanced
    tags:
      - multi-region
      - spanner
      - trade-offs
    question: |
      Google Spanner offers externally-consistent (linearizable) transactions across regions using TrueTime +
      Paxos. In PACELC terms and practically, what is the price you pay?
    options:
      - It sacrifices durability
      - Writes incur cross-region coordination latency (commit-wait / consensus round trips); it is PC/EC
        - it chooses consistency over latency even without partitions
      - It cannot survive a region failure
      - It provides only eventual consistency
    answer: 1
    explanation: |
      Spanner is PC/EC: it pays latency (commit-wait and consensus) to keep strong consistency globally. It does
      not sacrifice durability, does survive region loss, and is strongly (not eventually) consistent.
    ref: concepts.md#multi-region-architecture-trade-offs
  - id: resilience-tradeoffs-deep-dive-051
    difficulty: advanced
    tags:
      - interview
      - over-engineering
      - default
    question: |
      For a new service whose SLA only requires surviving a single-AZ failure with strong consistency, an
      interviewer will be MOST impressed if you:
    options:
      - Immediately propose active-active multi-region with CRDTs for maximum resilience
      - Use a single instance to keep it simple
      - Default to single-region multi-AZ with timeouts, idempotent retries, breakers, and graceful degradation,
        and explicitly say you'd add multi-region only if the SLA demanded region-loss survival
      - Propose Spanner for everything to avoid ever thinking about consistency
    answer: 2
    explanation: |
      Matching the design to the stated SLA (multi-AZ) and naming the crossover for escalating to multi-region
      shows cost-aware judgment. Over-engineering (multi-region/Spanner-everywhere) burns money/complexity, and a
      single instance fails the AZ requirement.
    ref: concepts.md#articulating-trade-offs-in-an-interview
  - id: resilience-tradeoffs-deep-dive-052
    difficulty: advanced
    tags:
      - scenario
      - which-failure-not-tolerated
    question: |
      A stateless API tier runs across 3 AZs in one region behind a load balancer, with a Postgres primary in
      AZ-a and a synchronous standby in AZ-b (auto-failover). Which failure does this design NOT tolerate?
    options:
      - Loss of a single API instance
      - Loss of AZ-a (including the DB primary)
      - A single slow dependency (assuming timeouts are set)
      - A complete region outage
    answer: 3
    explanation: |
      Everything is in one region, so a full region outage takes it down; AZ-a loss is survived via failover,
      instance loss via the LB, and slow deps via timeouts. Region-loss survival requires multi-region.
    ref: concepts.md#multi-region-architecture-trade-offs
  - id: resilience-tradeoffs-deep-dive-053
    difficulty: advanced
    tags:
      - retries
      - idempotency
      - write-path
    question: |
      You propose automatic retries on a write endpoint that debits a wallet. To keep this safe under a
      "success but response lost" scenario, the ESSENTIAL companion is:
    options:
      - An idempotency key so the retried debit is deduplicated to a single effect on the server
      - A bigger connection pool
      - A read replica for the wallet
      - A longer TCP keepalive
    answer: 0
    explanation: |
      If the first debit succeeded but the ack was lost, a naive retry double-debits; an idempotency key makes
      the server treat the retry as the same operation. Pool size, replicas, and keepalive don't prevent
      duplicate effects.
    ref: concepts.md#idempotency-for-safe-retries
  - id: resilience-tradeoffs-deep-dive-054
    difficulty: advanced
    tags:
      - load-shedding
      - retries
      - feedback-loop
    question: |
      When a server sheds load, returning 429 with a Retry-After header is preferable to silently dropping the
      connection because:
    options:
      - 429 responses are cached by the CDN forever
      - 'It closes the loop with client-side retry/backoff logic: well-behaved clients back off for the
        suggested time instead of hammering immediately, reducing retry-driven overload'
      - It guarantees the request will eventually succeed
      - It increases server throughput directly
    answer: 1
    explanation: |
      An explicit 429 + Retry-After tells clients to back off, dampening the retry feedback loop that a silent
      drop would trigger. It is not cached forever, does not guarantee success, and doesn't directly raise throughput.
    ref: concepts.md#rate-limiting-and-load-shedding
  - id: resilience-tradeoffs-deep-dive-055
    difficulty: expert
    tags:
      - metastable
      - control-theory
      - expert
    question: |
      A system enters a metastable failure state: even after the triggering spike ends, it remains overloaded
      because a "sustaining effect" keeps load high. Which set of mechanisms most directly breaks a metastable
      failure loop?
    options:
      - Add more capacity permanently and hope the trigger doesn't recur
      - Increase per-request retry counts so more requests eventually succeed
      - 'Reduce the sustaining feedback: retry budgets, load shedding, circuit breakers, and disabling/limiting
        client retries to let the system drain below the recovery threshold'
      - Lengthen all timeouts so fewer requests are considered failed
    answer: 2
    explanation: |
      Metastable failures persist due to a work-amplifying feedback loop (often retries); breaking it requires
      cutting that amplification (budgets, shedding, breakers) so load falls below the recovery threshold. More
      retries and longer timeouts strengthen the loop; adding capacity doesn't remove the feedback.
    ref: concepts.md#retries-backoff-and-jitter
  - id: resilience-tradeoffs-deep-dive-056
    difficulty: expert
    tags:
      - expert
      - static-stability
      - multi-az
    question: |
      AWS advocates "static stability" for multi-AZ systems. What does it mean and why is it more resilient
      than dynamic reaction?
    options:
      - The system never changes its configuration
      - It relies on autoscaling to instantly replace lost capacity during an AZ outage
      - It uses only static IP addresses
      - The system is pre-provisioned to keep operating with existing resources during a failure WITHOUT
        depending on the control plane to launch new capacity or make changes, because control planes
        are often unavailable exactly during large failures
    answer: 3
    explanation: |
      Static stability means surviving a failure with already-provisioned resources and no control-plane
      dependency, since control planes (launching instances, etc.) are frequently degraded during big events.
      Relying on autoscaling to instantly react is exactly the fragile pattern it warns against; it's not about
      never changing config or static IPs.
    ref: concepts.md#redundancy-and-failover
  - id: resilience-tradeoffs-deep-dive-057
    difficulty: expert
    tags:
      - expert
      - active-active
      - conflict-resolution
      - crdt
    question: |
      In a globally-replicated active-active store using last-write-wins (LWW) for conflict resolution, what
      subtle correctness hazard must you flag, and what is a stronger alternative for certain data types?
    options:
      - LWW can silently drop concurrent writes (and is sensitive to clock skew), so for structures like
        counters/sets a CRDT that merges deterministically without losing updates is safer
      - LWW guarantees no data is ever lost; no hazard exists
      - LWW requires a global lock, making it slow but perfectly correct
      - LWW only works with synchronous replication
    answer: 0
    explanation: |
      LWW resolves conflicts by discarding all-but-one concurrent write and depends on clock accuracy, so it can
      lose updates; CRDTs merge concurrent updates without loss for suitable types. LWW does lose data, needs no
      global lock, and is used precisely in async replication.
    ref: concepts.md#redundancy-and-failover
  - id: resilience-tradeoffs-deep-dive-058
    difficulty: expert
    tags:
      - expert
      - timeouts
      - congestion
      - tail
    question: |
      Setting client timeouts extremely tight (well below p99) during a mild latency increase can paradoxically
      make an overload WORSE. Why?
    options:
      - Tight timeouts reduce CPU usage on the client
      - Requests that would have completed just after the timeout are abandoned and retried, adding fresh
        load while wasting the work already done - amplifying congestion (a form of goodput collapse)
      - Tight timeouts increase the TCP window size
      - Tight timeouts force the server into strong consistency mode
    answer: 1
    explanation: |
      When latency rises, an over-tight timeout kills in-flight requests that were about to finish and triggers
      retries, wasting completed work and adding load - throughput (goodput) collapses. It doesn't meaningfully
      cut client CPU, change TCP windows, or affect consistency.
    ref: concepts.md#timeouts-and-deadlines
  - id: resilience-tradeoffs-deep-dive-059
    difficulty: expert
    tags:
      - expert
      - cell-based
      - poison-pill
      - router
    question: |
      In cell-based architecture, why is the cell router deliberately kept extremely thin and simple, and what
      would violate the design's intent?
    options:
      - Because the router should hold all business logic to reduce cell complexity
      - Because routers cannot be made highly available
      - Because the router is shared across all cells, so any bug or stateful complexity in it becomes
        a system-wide (100% blast radius) failure - putting heavy logic or shared mutable state there
        defeats the isolation
      - Because the router must run inside each cell
    answer: 2
    explanation: |
      The router is the one shared component; keeping it thin/stateless/HA minimizes the chance it becomes a
      system-wide single point of failure. Loading it with logic or shared state reintroduces a 100% blast-radius
      component - the opposite of the goal.
    ref: concepts.md#blast-radius-and-cell-based-architecture
  - id: resilience-tradeoffs-deep-dive-060
    difficulty: expert
    tags:
      - expert
      - chaos-engineering
      - latency-injection
    question: |
      Experienced chaos practitioners say latency injection often reveals more than instance-kill experiments.
      Why?
    options:
      - Latency is easier to inject than killing an instance
      - Killing instances never causes any observable effect
      - Latency injection permanently improves latency afterwards
      - '''Slow'' is harder to detect and handle than ''dead'': hung/slow dependencies quietly exhaust
        pools and defeat naive health checks and missing timeouts, exposing cascading-failure paths that
        clean crashes don''t'
    answer: 3
    explanation: |
      Clean crashes are quickly detected and routed around; partial/slow failures slip past health checks,
      exhaust resources, and cascade - exactly the fragile paths you want to find. It's not about ease of
      injection, and instance kills do have effects.
    ref: concepts.md#chaos-engineering
  - id: resilience-tradeoffs-deep-dive-061
    difficulty: expert
    tags:
      - expert
      - framework
      - goodput
      - overload
    question: |
      Under severe overload, a well-designed system should aim to maximize "goodput" rather than throughput.
      What distinguishes goodput, and which design choice supports it?
    options:
      - Goodput = useful work that actually completes successfully within its deadline; support it by
        shedding excess load early so admitted requests finish, rather than admitting everything and completing
        little
      - Goodput = total requests received; support it by accepting every request
      - Goodput = number of retries performed; support it by retrying more
      - Goodput = bytes transferred; support it by increasing bandwidth
    answer: 0
    explanation: |
      Goodput counts only requests that complete usefully in time; admitting everything under overload leads to
      lots of started-but-failed work (low goodput). Early shedding lets admitted work succeed. Goodput is not raw
      requests, retries, or bytes.
    ref: concepts.md#rate-limiting-and-load-shedding
  - id: resilience-tradeoffs-deep-dive-062
    difficulty: expert
    tags:
      - expert
      - correlated-failure
      - redundancy
    question: |
      Adding redundant replicas increases availability ONLY if failures are largely independent. Which scenario
      shows redundancy failing to help because of correlated failure?
    options:
      - Two replicas on different racks; one rack's power supply dies
      - Three replicas that all run the same buggy deploy or all depend on one shared config service -
        a single bad push or config outage takes down all of them at once
      - Two replicas in different AZs; one AZ loses network
      - Five replicas behind a load balancer; one instance's disk fails
    answer: 1
    explanation: |
      Redundancy assumes independent failure; a shared bad deploy or shared config dependency correlates the
      failures so all replicas die together (why canary/cell rollouts and dependency isolation matter). The other
      cases are genuinely independent faults redundancy handles well.
    ref: concepts.md#redundancy-and-failover
  - id: resilience-tradeoffs-deep-dive-063
    difficulty: expert
    tags:
      - expert
      - interview
      - trade-off-axes
    question: |
      An interviewer asks you to "enumerate every axis you traded" in your design that added synchronous
      cross-region replication. The strongest answer maps the change to:
    options:
      - Only availability, since that's all replication affects
      - Only cost, since replication just means more machines
      - 'Consistency (stronger, if synchronous), availability/region-survival (better), latency (worse:
        +cross-region RTT per write), and cost/complexity (worse: ~2x infra, ops), then names the crossover:
        ''worth it only if the SLA requires surviving region loss'''
      - Only latency, since consistency is unaffected by replication
    answer: 2
    explanation: |
      A complete trade-off answer touches all four axes (consistency, availability, latency, cost/complexity) and
      states the crossover condition. Reducing it to a single axis misses the point of the exercise.
    ref: concepts.md#articulating-trade-offs-in-an-interview
  - id: resilience-tradeoffs-deep-dive-064
    difficulty: expert
    tags:
      - expert
      - idempotency
      - dedup-window
      - storage
    question: |
      Your idempotency-key store keeps keys for 24h. A client, after a 25h network outage, retries a payment
      with the same key. What is the risk and the correct design stance?
    options:
      - No risk; keys are valid forever regardless of TTL
      - The server will crash because expired keys corrupt the database
      - The client should just generate a fresh key and retry, which is always safe
      - The key may have expired, so the server could re-execute the charge as if new; the dedup guarantee
        is only as strong as the retention window, so set TTL >= the maximum plausible retry window (and
        reject/expire clearly at the boundary)
    answer: 3
    explanation: |
      Idempotency guarantees hold only within the retention window; a retry after expiry can double-execute, so
      the TTL must cover the realistic retry horizon. Keys aren't eternal, expiry doesn't corrupt data, and a
      fresh key defeats deduplication (it would look like a new charge).
    ref: concepts.md#idempotency-for-safe-retries
  - id: resilience-tradeoffs-deep-dive-065
    difficulty: expert
    tags:
      - expert
      - circuit-breaker
      - distributed
      - coordination
    question: |
      In a fleet of 500 instances each running its own local circuit breaker against a shared dependency, what
      subtle behavior should you anticipate compared to a single global breaker?
    options:
      - Breakers open independently based on each instance's local sample, so tripping is gradual/uneven
        and one instance may still probe (half-open) and hammer a struggling dependency; you may need
        coordinated or adaptive thresholds and gentle probing to avoid collective probe load
      - All 500 breakers will open at exactly the same microsecond
      - Local breakers make the dependency impossible to overload
      - Local breakers guarantee globally consistent open/closed state
    answer: 0
    explanation: |
      Independent local breakers trip on local samples, giving uneven behavior and a risk that aggregate
      half-open probing still overloads the dependency. They don't synchronize perfectly, don't guarantee the dep
      can't be overloaded, and provide no global consistency.
    ref: concepts.md#circuit-breakers
  - id: resilience-tradeoffs-deep-dive-066
    difficulty: expert
    tags:
      - expert
      - multi-region
      - cost
      - gray-failure
    question: |
      A "gray failure" (partial/degraded, not a clean outage) in a multi-region active-passive setup is
      dangerous because:
    options:
      - It always triggers automatic failover instantly
      - The primary appears healthy to failover automation (passes health checks) while serving degraded/erroring
        traffic to users, so automated failover doesn't fire and humans hesitate - the system stays in
        a bad state longer than a clean outage would
      - Gray failures cannot affect availability
      - It only affects the passive region, which serves no traffic anyway
    answer: 1
    explanation: |
      Gray failures fool health checks so automation won't fail over, yet users suffer - the ambiguity delays
      response versus a clean, detectable outage. They don't trigger instant failover, do affect availability, and
      hit the active primary (which serves users).
    ref: concepts.md#multi-region-architecture-trade-offs
  - id: resilience-tradeoffs-deep-dive-067
    difficulty: expert
    tags:
      - expert
      - framework
      - pacelc
      - classification
    question: |
      In PACELC terms, DynamoDB and Cassandra (default tunable settings favoring availability/low latency) are
      typically classified as, and Spanner as:
    options:
      - DynamoDB/Cassandra = PC/EC; Spanner = PA/EL
      - Both are PA/EL
      - DynamoDB/Cassandra = PA/EL; Spanner = PC/EC
      - Both are PC/EC
    answer: 2
    explanation: |
      Dynamo/Cassandra default to availability during partitions and latency over consistency otherwise (PA/EL);
      Spanner chooses consistency in both cases (PC/EC), paying latency. The reversed and uniform classifications
      are incorrect.
    ref: concepts.md#consistency-availability-latency-and-cost-as-a-unifying-trade-off-framework
  - id: resilience-tradeoffs-deep-dive-068
    difficulty: expert
    tags:
      - expert
      - bulkhead
      - tenant
      - noisy-neighbor
    question: |
      A multi-tenant SaaS finds one large tenant's traffic spikes degrade all tenants. Comparing mitigations,
      which best balances isolation and cost for the majority small tenants while protecting against the noisy
      neighbor?
    options:
      - Give every single tenant a fully dedicated stack
      - Remove all rate limits so tenants self-regulate
      - Route all tenants through one giant shared thread pool for maximum utilization
      - Use shared cells/pools for the many small tenants (with per-tenant rate limits and bulkheads)
        and dedicate isolated capacity only to the few largest/noisiest tenants
    answer: 3
    explanation: |
      Tiered isolation (shared-but-bulkheaded/rate-limited for small tenants, dedicated for the few large ones)
      contains noisy neighbors without the cost of per-tenant stacks. Dedicating everything is prohibitively
      expensive, removing limits invites abuse, and one giant pool is exactly the noisy-neighbor problem.
    ref: concepts.md#bulkheads-and-isolation
  - id: resilience-tradeoffs-deep-dive-069
    difficulty: intermediate
    tags:
      - fallacies
      - topology
      - service-discovery
    question: |
      "Topology doesn't change" is a fallacy of distributed computing. Which practice directly addresses it?
    options:
      - Using service discovery / DNS so clients resolve current endpoints instead of relying on fixed
        hosts
      - Hardcoding server IP addresses in config for speed
      - Disabling health checks to reduce churn
      - Pinning every client to a single instance forever
    answer: 0
    explanation: |
      Topology changes (scaling, replacement, failover), so clients must discover current endpoints dynamically.
      Hardcoded IPs, disabled health checks, and permanent pinning all break when topology shifts.
    ref: concepts.md#fallacies-of-distributed-computing
  - id: resilience-tradeoffs-deep-dive-070
    difficulty: intermediate
    tags:
      - graceful-degradation
      - read-only-mode
    question: |
      During a write-datastore outage, putting the service into "read-only mode" (serve reads, reject/queue
      writes with a friendly message) is an example of graceful degradation because it:
    options:
      - Guarantees no data will ever be inconsistent
      - Preserves the most valuable available functionality (reads) instead of failing entirely, trading
        away new-write capability temporarily
      - Speeds up the write path
      - Eliminates the need for backups
    answer: 1
    explanation: |
      Read-only mode keeps reads working when writes can't, a deliberate trade of write availability for overall
      usefulness. It doesn't guarantee consistency, speed up writes, or replace backups.
    ref: concepts.md#graceful-degradation-and-fallbacks
  - id: resilience-tradeoffs-deep-dive-071
    difficulty: intermediate
    tags:
      - chaos-engineering
      - gameday
      - region
    question: |
      A "GameDay" exercise where a team deliberately evacuates/fails an entire AZ or region while watching
      steady-state metrics is valuable primarily because:
    options:
      - It replaces the need for redundancy
      - It permanently prevents future region outages
      - It validates that failover, capacity, and runbooks actually work under a real large-scale fault
        before a genuine outage forces the issue
      - It is a substitute for monitoring
    answer: 2
    explanation: |
      GameDays prove that failover paths, capacity assumptions, and human procedures hold up under a big
      controlled fault. They don't replace redundancy or monitoring and can't prevent real outages - they prepare
      you for them.
    ref: concepts.md#chaos-engineering
  - id: resilience-tradeoffs-deep-dive-072
    difficulty: advanced
    tags:
      - advanced
      - framework
      - scenario
      - budget
    question: |
      Given constraints: a read-heavy product catalog, 50ms latency budget for global users, eventual
      consistency acceptable (prices update within seconds is fine), and a tight cost budget. Which design best
      fits?
    options:
      - Synchronous cross-region strongly-consistent writes to every replica for correctness
      - Single-region strongly-consistent database with all global users reading cross-region synchronously
      - Active-passive in one region only, with no caching
      - Regional read replicas / CDN-cached catalog with asynchronous replication and short-TTL caches,
        accepting brief staleness for low global read latency and low cost
    answer: 3
    explanation: |
      Read-heavy + eventual-OK + global-low-latency + cost-sensitive points to cached/regional replicas with
      async replication. Synchronous global consistency blows the latency/cost budget, cross-region synchronous
      reads are slow, and single-region-no-cache gives far users high latency.
    ref: concepts.md#trade-offs-and-when-to-use-what
  - id: resilience-tradeoffs-deep-dive-073
    difficulty: advanced
    tags:
      - advanced
      - decision-guide
      - transient-vs-sustained
    question: |
      A dependency alternates between (a) occasional 50ms blips and (b) multi-minute hard outages. The most
      appropriate layered strategy is:
    options:
      - Retries with backoff+jitter+budget for the transient blips, PLUS a circuit breaker with a fallback
        for the sustained outages, so retries stop and degrade gracefully when it's truly down
      - Only retries, because they cover both cases
      - Only a circuit breaker, because retries are never useful
      - Increase timeouts so both cases resolve themselves
    answer: 0
    explanation: |
      Transient blips call for bounded retries; sustained outages call for a breaker + fallback to stop hammering
      and degrade. Retries alone cause storms during hard outages; breaker alone wastes recoverable blips; longer
      timeouts help neither.
    ref: concepts.md#trade-offs-and-when-to-use-what
  - id: resilience-tradeoffs-deep-dive-074
    difficulty: beginner
    tags:
      - beginner
      - decision-guide
      - when-to-use
    question: |
      For a brand-new service whose requirements only demand tolerating a single availability-zone failure, the
      simplest appropriate baseline is:
    options:
      - Multi-region active-active with cells and shuffle sharding on day one
      - Single-region, multi-AZ deployment with timeouts, idempotent retries, circuit breakers, and graceful
        degradation
      - A single instance with a nightly backup
      - Global synchronous replication via Spanner
    answer: 1
    explanation: |
      Multi-AZ in one region with the core resilience primitives meets an AZ-fault requirement at reasonable cost.
      Multi-region/cells/Spanner is over-engineering for that SLA, and a single instance can't survive AZ loss.
    ref: concepts.md#trade-offs-and-when-to-use-what
  - id: resilience-tradeoffs-deep-dive-075
    difficulty: advanced
    tags:
      - advanced
      - canary
      - blast-radius
      - deploy
    question: |
      Canary and wave (cell-by-cell) deployments reduce blast radius in which dimension, and what do they
      protect against?
    options:
      - The storage dimension; they protect against disk failure
      - The consistency dimension; they guarantee linearizability
      - The time dimension; they roll a change to a small slice first so a bad release is caught before
        it reaches all customers
      - The network dimension; they encrypt deploy traffic
    answer: 2
    explanation: |
      Canary/wave rollouts limit how much of the fleet a bad deploy hits at once (time-dimension blast radius),
      catching regressions early. They aren't about disk failure, consistency, or encryption.
    ref: concepts.md#blast-radius-and-cell-based-architecture
  - id: resilience-tradeoffs-deep-dive-076
    difficulty: intermediate
    tags:
      - intermediate
      - fallacies
      - bandwidth
      - backpressure
    question: |
      The fallacy "bandwidth is infinite" is best countered in a high-volume streaming/data pipeline by:
    options:
      - Sending all data uncompressed for simplicity
      - Removing all timeouts so slow transfers complete
      - Assuming the network will always absorb bursts
      - Applying backpressure, pagination/chunking, and compression so producers slow down when consumers
        or the network can't keep up
    answer: 3
    explanation: |
      Finite bandwidth requires flow control: backpressure, pagination, and compression prevent overwhelming the
      link/consumer. Uncompressed floods, removing timeouts, and assuming infinite absorption all embody the fallacy.
    ref: concepts.md#fallacies-of-distributed-computing
  - id: resilience-tradeoffs-deep-dive-077
    difficulty: advanced
    tags:
      - advanced
      - queue-and-defer
      - async
      - degradation
    question: |
      For a non-urgent write (e.g. recording an analytics event or sending a welcome email) when the downstream
      processor is overloaded, a strong resilience choice is to:
    options:
      - Accept the request into a durable queue and process it asynchronously later (with idempotent consumers),
        returning success immediately
      - Block the user request synchronously until the processor recovers
      - Drop the request silently with no record
      - Retry synchronously in a tight loop until it succeeds
    answer: 0
    explanation: |
      Queue-and-defer decouples the user path from a busy processor, trading immediate processing for accepted-now
      durability; idempotent consumers make redelivery safe. Blocking harms UX, silent drops lose data, and tight
      synchronous retries amplify overload.
    ref: concepts.md#graceful-degradation-and-fallbacks
  - id: resilience-tradeoffs-deep-dive-078
    difficulty: expert
    tags:
      - expert
      - over-engineering
      - complexity
      - failure-mode
    question: |
      Why can "adding more resilience mechanisms" itself become a failure mode?
    options:
      - It never can; more resilience is always strictly better
      - Each mechanism (breakers, retries, fallbacks, multi-region, cells) adds moving parts, interactions,
        and steady-state cost/latency; poorly-tuned or interacting mechanisms (e.g. retries feeding a
        storm, an over-eager breaker) can cause outages the system wouldn't otherwise have
      - Because resilience mechanisms are illegal above a certain count
      - Because they only work in staging
    answer: 1
    explanation: |
      Resilience features have real complexity and cost and can interact badly (retry storms, self-inflicted
      breaker outages, buggy fallbacks), so over-engineering reliability can reduce it. It is not always strictly
      better, and the other options are nonsense.
    ref: concepts.md#consistency-availability-latency-and-cost-as-a-unifying-trade-off-framework
  - id: resilience-tradeoffs-deep-dive-079
    difficulty: intermediate
    tags:
      - intermediate
      - secure
      - fallacy
      - tls
    question: |
      The fallacy "the network is secure" implies which resilience/security practice for service-to-service
      calls?
    options:
      - Assume internal traffic never needs encryption or authentication
      - Rely solely on a firewall at the edge
      - Encrypt in transit (TLS/mTLS) and authenticate/authorize calls even inside the perimeter (zero-trust),
        because the network can be observed or compromised
      - Disable authentication between trusted internal services to reduce latency
    answer: 2
    explanation: |
      Because the network isn't inherently secure, modern designs use TLS/mTLS and per-call authn/authz even
      internally (zero-trust). Assuming internal safety, edge-firewall-only, or disabling internal auth all embody
      the fallacy.
    ref: concepts.md#fallacies-of-distributed-computing
  - id: resilience-tradeoffs-deep-dive-080
    difficulty: advanced
    tags:
      - advanced
      - scenario
      - checkout
      - isolate-critical-path
    question: |
      In a checkout flow, the payment provider (critical) shares a thread pool and retry logic with an
      address-validation service (nice-to-have). During a payment-provider slowdown, checkouts hang. The best
      structural fix is:
    options:
      - Add more retries to the payment call so it eventually succeeds
      - Route all checkouts through the address-validation service first
      - Increase the shared pool size to 10,000 threads
      - Isolate the critical payment path with its own bulkhead and tight timeout+deadline, and make address
        validation best-effort (degrade/skip on failure) so a non-critical dependency can never stall
        checkout
    answer: 3
    explanation: |
      Isolating the critical path (bulkhead, timeout, deadline) and making the optional dependency degrade
      protects checkout from unrelated slowness. More retries worsen the slowdown, front-loading address validation
      adds coupling, and a huge shared pool just delays exhaustion without isolation.
    ref: concepts.md#bulkheads-and-isolation
