topic: Resilience, Fault Tolerance and Design Trade-offs Deep-Dive
domain: system-design
topic_slug: resilience-tradeoffs-deep-dive
version: 1
questions:
  - id: resilience-tradeoffs-deep-dive-001
    difficulty: beginner
    tags:
      - fallacies
      - distributed-systems
      - fundamentals
    question: |
      Which statement best captures why "the fallacies of distributed computing" matter for resilience design?
    options:
      - They are false assumptions (e.g. the network is reliable, latency is zero) that, when baked into
        code, cause most distributed-system outages
      - They are performance-tuning tips that only apply to high-frequency trading systems where
        microsecond latency variance dominates throughput
      - They describe the only three ways a database can fail (disk corruption, replication lag,
        and connection-pool exhaustion under peak load)
      - They are legal compliance requirements that cloud providers must satisfy before offering
        managed database and networking services
    answer: 0
    explanation: |
      The fallacies are wrong assumptions engineers implicitly make; each maps to a resilience pattern
      (unreliable network -> retries/timeouts, non-zero latency -> deadlines, etc.). They are not tuning
      tips, a fixed failure taxonomy, or legal requirements.
    ref: concepts.md#fallacies-of-distributed-computing
  - id: resilience-tradeoffs-deep-dive-002
    difficulty: beginner
    tags:
      - timeouts
      - fundamentals
    question: |
      What is the primary purpose of setting a timeout on a network call?
    options:
      - To make the call return faster on the happy path by short-circuiting the network round trip
        once the socket is established
      - To convert an unbounded wait on a hung dependency into a bounded, handleable failure
      - To guarantee the request is processed exactly once by discarding any duplicate that arrives
        after the deadline elapses
      - To encrypt the request in transit by negotiating a TLS session before the timeout window opens
    answer: 1
    explanation: |
      A timeout bounds how long you wait so a hung dependency cannot block your threads forever. It does
      not speed up healthy calls, provide exactly-once semantics (that is idempotency), or provide encryption.
    ref: concepts.md#timeouts-and-deadlines
  - id: resilience-tradeoffs-deep-dive-003
    difficulty: beginner
    tags:
      - retries
      - backoff
      - jitter
    question: |
      Why is jitter added to exponential backoff when retrying?
    options:
      - To make retries deterministic and easy to debug by pinning every attempt to a fixed,
        reproducible delay schedule
      - To encrypt the retry payload by mixing random bytes into the request body before resending
      - To de-synchronize clients so they don't all retry at the same instant and create a thundering
        herd
      - To increase the number of retries allowed by adding extra attempts to the backoff budget on
        each failure
    answer: 2
    explanation: |
      Without jitter, all failed clients retry at identical times, creating synchronized load spikes. Jitter
      randomizes the delay to spread retries out. It does not add determinism, encryption, or extra attempts.
    ref: concepts.md#retries-backoff-and-jitter
  - id: resilience-tradeoffs-deep-dive-004
    difficulty: beginner
    tags:
      - idempotency
      - retries
    question: |
      An operation is idempotent if:
    options:
      - It always returns an error on the second call so the caller can detect that a duplicate
        request was already handled
      - It never touches the database and instead resolves entirely from an in-memory read cache
      - It completes in constant time regardless of payload size because it skips all validation logic
      - Performing it multiple times has the same effect as performing it once
    answer: 3
    explanation: |
      Idempotency means repeated execution yields the same result/state as a single execution, which is what
      makes retries of state-changing operations safe. The other options are unrelated properties.
    ref: concepts.md#idempotency-for-safe-retries
  - id: resilience-tradeoffs-deep-dive-005
    difficulty: beginner
    tags:
      - circuit-breaker
      - states
    question: |
      In a circuit breaker, what happens in the OPEN state?
    options:
      - Requests are rejected immediately without calling the failing dependency
      - All requests are passed through normally while the breaker records the error rate in the background
      - A single request is allowed through on each cycle to test whether the dependency has recovered yet
      - The dependency is automatically restarted by the breaker after a fixed cooldown interval elapses
    answer: 0
    explanation: |
      OPEN means the breaker has tripped and rejects calls immediately (fail fast) so the sick dependency
      gets no load. Passing all through is CLOSED; a trial request is HALF-OPEN; breakers don't restart deps.
    ref: concepts.md#circuit-breakers
  - id: resilience-tradeoffs-deep-dive-006
    difficulty: beginner
    tags:
      - bulkhead
      - isolation
    question: |
      The bulkhead pattern is named after ship compartments because it:
    options:
      - Encrypts data at rest by sealing each compartment's storage volume with a separate key
      - Partitions resources so a failure in one area cannot consume all resources and sink the whole
        system
      - Compresses network traffic between compartments to reduce cross-partition bandwidth pressure
      - Guarantees strong consistency across replicas by fencing each compartment behind its own quorum
    answer: 1
    explanation: |
      Bulkheads isolate resources (thread/connection pools, instances) so one flooded compartment doesn't
      sink the ship. The other options describe unrelated mechanisms.
    ref: concepts.md#bulkheads-and-isolation
  - id: resilience-tradeoffs-deep-dive-007
    difficulty: beginner
    tags:
      - rate-limiting
      - load-shedding
    question: |
      What is the key difference between rate limiting and load shedding?
    options:
      - They are two names for the same mechanism, differing only in which vendor's documentation
        happens to describe it
      - Rate limiting only works at the database layer while load shedding only ever runs at the CDN
        edge, so the two can never be combined
      - Rate limiting is a policy applied to clients (e.g. 100 rps each); load shedding is a reaction
        to the server's own health, dropping work when near collapse
      - Load shedding increases total throughput while rate limiting decreases it, so they pull the
        system in opposite directions
    answer: 2
    explanation: |
      Rate limiting enforces a per-client quota; load shedding is the server deliberately dropping (often
      lower-priority) work when it is overloaded to avoid total collapse. They are distinct and complementary.
    ref: concepts.md#rate-limiting-and-load-shedding
  - id: resilience-tradeoffs-deep-dive-008
    difficulty: beginner
    tags:
      - graceful-degradation
      - fallback
    question: |
      Graceful degradation means:
    options:
      - Returning a generic error page whenever any single dependency in the request path fails to respond
      - Slowing down all incoming requests uniformly so the failing dependency has time to recover on its own
      - Automatically deleting corrupted data and rebuilding it from the most recent healthy backup snapshot
      - Serving a reduced-but-useful experience (e.g. stale cache or hidden optional feature) when a dependency
        fails, instead of failing entirely
    answer: 3
    explanation: |
      Graceful degradation keeps the core experience working with reduced quality/features rather than a
      total failure. It is not a blanket error page, uniform slowdown, or data deletion.
    ref: concepts.md#graceful-degradation-and-fallbacks
  - id: resilience-tradeoffs-deep-dive-009
    difficulty: beginner
    tags:
      - redundancy
      - failover
      - active-passive
    question: |
      In an active-passive redundancy setup:
    options:
      - A primary serves traffic while one or more standbys replicate and wait to be promoted on failure
      - All replicas serve read and write traffic simultaneously with load balanced evenly across them
      - There is only ever one copy of the data, kept on a single node with no replication configured
      - Writes are randomly distributed across all nodes and later reconciled by a background merge job
    answer: 0
    explanation: |
      Active-passive has one active primary and idle standby(s) that take over on failure (with an RTO gap).
      All-serving is active-active; a single copy is no redundancy; random write distribution is active-active.
    ref: concepts.md#redundancy-and-failover
  - id: resilience-tradeoffs-deep-dive-010
    difficulty: beginner
    tags:
      - blast-radius
      - definitions
    question: |
      "Blast radius" in resilience engineering refers to:
    options:
      - The physical distance in kilometers between two data centers used for cross-region replication
      - How much of the system and how many customers a single failure can affect
      - The maximum sustained QPS a single service instance can handle before it begins shedding load
      - The time it takes to deploy a new version of the service across the entire production fleet
    answer: 1
    explanation: |
      Blast radius is the scope of impact of a failure. Shrinking it (via cells, shuffle sharding, canaries)
      is a central resilience goal. The other options describe distance, capacity, and deploy time.
    ref: concepts.md#blast-radius-and-cell-based-architecture
  - id: resilience-tradeoffs-deep-dive-011
    difficulty: beginner
    tags:
      - chaos-engineering
      - netflix
    question: |
      Netflix's Chaos Monkey is best described as a tool that:
    options:
      - Automatically writes unit tests by observing production traffic and generating assertions from it
      - Encrypts data in transit by injecting a TLS proxy in front of every production instance
      - Randomly terminates production instances to verify the system tolerates instance failure
      - Load-balances requests across regions by steering traffic toward the least-loaded availability zone
    answer: 2
    explanation: |
      Chaos Monkey randomly kills instances to force teams to build for instance failure. It is not a test
      generator, encryptor, or load balancer.
    ref: concepts.md#chaos-engineering
  - id: resilience-tradeoffs-deep-dive-012
    difficulty: beginner
    tags:
      - cap
      - pacelc
      - framework
    question: |
      According to the CAP theorem, when a network partition occurs, a distributed data store must choose between:
    options:
      - Latency and cost
      - Durability and throughput
      - Encryption and compression
      - Consistency and Availability
    answer: 3
    explanation: |
      During a partition you can preserve consistency or availability, not both. Latency-vs-consistency (the
      non-partition case) is PACELC's contribution. The other pairs are unrelated to CAP.
    ref: concepts.md#consistency-availability-latency-and-cost-as-a-unifying-trade-off-framework
  - id: resilience-tradeoffs-deep-dive-013
    difficulty: beginner
    tags:
      - interview
      - articulation
    question: |
      When articulating a design trade-off in an interview, the strongest habit is to:
    options:
      - State what you gain, what you give up, and the condition under which you'd choose the alternative
      - Always pick the option with the strongest consistency regardless of the requirements or latency budget
      - List as many components and technologies as possible without justifying why each one is present
      - Avoid mentioning any downsides of your chosen design so the interviewer sees only its strengths
    answer: 0
    explanation: |
      Senior signal is naming the gain, the sacrifice, and the crossover point. Blindly maximizing one axis,
      breadth without justification, and hiding downsides are all anti-patterns.
    ref: concepts.md#articulating-trade-offs-in-an-interview
  - id: resilience-tradeoffs-deep-dive-014
    difficulty: intermediate
    tags:
      - fallacies
      - cascading-failure
      - timeouts
    question: |
      A service makes a synchronous call to a dependency with no timeout. The dependency becomes slow (not
      down). What is the most likely failure mode for the calling service?
    options:
      - It returns stale data from a local cache while the slow dependency continues processing in the background
      - Its thread/connection pool exhausts as calls pile up waiting, making the healthy caller itself
        unavailable
      - It automatically shards its database across more nodes to absorb the extra queued work from the slow call
      - It silently drops the affected requests with no impact on the rest of the caller's workload
    answer: 1
    explanation: |
      With no timeout, waiting calls consume all threads/connections; the caller becomes unavailable even
      though it is healthy - a classic cascading failure from the "network is reliable / latency is zero"
      fallacies. Caching, sharding, and silent drops are not what happens.
    ref: concepts.md#fallacies-of-distributed-computing
  - id: resilience-tradeoffs-deep-dive-015
    difficulty: intermediate
    tags:
      - timeouts
      - latency-distribution
    question: |
      A dependency has p50=10ms, p99=40ms, p99.9=120ms. You set a client timeout of 100ms. What is the most
      likely consequence?
    options:
      - No healthy request will ever time out because the 100ms budget sits comfortably above the p99.9 mark
      - All requests slower than the p50 of 10ms will fail, discarding roughly half of otherwise-healthy traffic
      - Roughly the slowest ~0.1%+ of otherwise-healthy requests will be failed as timeouts
      - The dependency will automatically get faster once the client begins enforcing the tighter 100ms deadline
    answer: 2
    explanation: |
      100ms sits between p99 and p99.9, so the slow tail above 100ms (a fraction of a percent, growing toward
      the p99.9 mark) will be spuriously failed. It is not zero (the tail exceeds 100ms), nor everything above p50.
    ref: concepts.md#timeouts-and-deadlines
  - id: resilience-tradeoffs-deep-dive-016
    difficulty: intermediate
    tags:
      - deadlines
      - deadline-propagation
    question: |
      What problem does deadline propagation (passing a shrinking time budget down a call chain) solve that
      per-hop timeouts alone do not?
    options:
      - It encrypts each hop's payload as the shrinking budget is passed down through the call chain
      - It guarantees exactly-once processing by attaching a dedup token alongside the remaining time budget
      - It removes the need for retries entirely because each hop now fails fast instead of retrying on timeout
      - It prevents downstream services from doing useless work on a request the upstream caller has already
        abandoned
    answer: 3
    explanation: |
      With deadline propagation, each hop knows the remaining budget and fails fast if it's exhausted, so B/C/D
      don't keep working after A gave up. It is not encryption, exactly-once, or a retry replacement.
    ref: concepts.md#timeouts-and-deadlines
  - id: resilience-tradeoffs-deep-dive-017
    difficulty: intermediate
    tags:
      - retries
      - retry-storm
      - metastable
    question: |
      A dependency briefly fails; every client retries aggressively with no backoff or budget. Even after the
      original trigger clears, the system stays overloaded. This is best described as:
    options:
      - A metastable failure / retry storm, where retries themselves sustain the overload
      - A split-brain condition, where two primaries independently accept writes during a network partition
      - A quorum loss, where too few replicas remain reachable for the cluster to acknowledge any write
      - A cache stampede, where a synchronized TTL expiry sends every client to the origin at the same instant
    answer: 0
    explanation: |
      Retry amplification keeps load high enough that the system can't recover even after the trigger is gone -
      a metastable failure. Split-brain is dual-primary; quorum loss and cache stampede are different mechanisms.
    ref: concepts.md#retries-backoff-and-jitter
  - id: resilience-tradeoffs-deep-dive-018
    difficulty: intermediate
    tags:
      - retries
      - amplification
      - call-chain
    question: |
      In a call chain A -> B -> C -> D, each layer independently retries a failed call up to 3 times. In the
      worst case, how many calls can reach D for one user request, and what's the mitigation?
    options:
      - 3 calls; add more retries at each layer so a transient failure is more likely to eventually succeed
      - 27 calls; retry at only one layer (e.g. the edge) and use a retry budget
      - 9 calls; increase per-hop timeouts so slow calls finish before the next layer decides to retry them
      - 1 call; retries never amplify because each layer waits for the one below it to exhaust its attempts
    answer: 1
    explanation: |
      Multiplicative amplification gives 3x3x3 = 27 calls to D. The fix is to retry at a single layer and cap
      aggregate retries with a budget, not to add retries or just raise timeouts.
    ref: concepts.md#retries-backoff-and-jitter
  - id: resilience-tradeoffs-deep-dive-019
    difficulty: intermediate
    tags:
      - retries
      - retryable-errors
    question: |
      Which of these responses is generally SAFE to retry automatically?
    options:
      - 400 Bad Request caused by a malformed request body, which will fail identically on every resend
      - 401 Unauthorized from a rejected credential, which no amount of retrying can turn into a success
      - 503 Service Unavailable / connection reset
      - 409 Conflict on a non-idempotent create
    answer: 2
    explanation: |
      503 and connection resets are typically transient and retryable. 400/401 are deterministic client
      errors (retrying won't help), and retrying a non-idempotent 409 create risks duplicates.
    ref: concepts.md#retries-backoff-and-jitter
  - id: resilience-tradeoffs-deep-dive-020
    difficulty: intermediate
    tags:
      - idempotency
      - payments
      - keys
    question: |
      A payments API wants POST /charges to be safe to retry after a network timeout. The standard mechanism is:
    options:
      - Automatically retry the charge on a fixed 60-second timer, assuming any earlier attempt will
        have fully rolled itself back before the next one fires
      - Never allow retries on the charge endpoint at all, forcing the client to surface every network
        timeout to the end user as a hard payment failure
      - Have the client poll a GET status endpoint until the charge appears, then guess whether to
        resend it based on how long the wait has taken
      - Have the client send a unique idempotency key; the server records key->result and returns the
        stored result on duplicates
    answer: 3
    explanation: |
      Client-supplied idempotency keys plus a server-side dedup store (with conditional writes) make retried
      charges execute once - the approach Stripe/PayPal use. Banning retries harms reliability; polling/guessing
      is fragile and racy.
    ref: concepts.md#idempotency-for-safe-retries
  - id: resilience-tradeoffs-deep-dive-021
    difficulty: intermediate
    tags:
      - idempotency
      - exactly-once
      - delivery
    question: |
      Why is "exactly-once delivery" over an unreliable network generally considered impossible, and what is
      the practical alternative?
    options:
      - Because acks can be lost, you settle for at-least-once delivery plus idempotent processing = effectively-once
      - It is fully achievable once the network is fast enough; just add more bandwidth and a sub-millisecond
        link so acknowledgements can never be lost in flight
      - You adopt at-most-once delivery everywhere and simply accept permanent data loss for any message
        whose acknowledgement happens to go missing
      - You disable retries entirely so each message is transmitted exactly one time, treating a single
        send attempt as a hard guarantee of delivery
    answer: 0
    explanation: |
      A lost acknowledgement forces a choice between resend (at-least-once) or not (at-most-once); combining
      at-least-once with idempotent processing yields effectively-once. Bandwidth doesn't solve it, and
      disabling retries just gives at-most-once with loss.
    ref: concepts.md#idempotency-for-safe-retries
  - id: resilience-tradeoffs-deep-dive-022
    difficulty: intermediate
    tags:
      - circuit-breaker
      - half-open
    question: |
      What is the role of the HALF-OPEN state in a circuit breaker?
    options:
      - It permanently blocks all traffic to the dependency until an operator manually resets the breaker
        after confirming the outage is over
      - It lets a small number of trial requests through to test whether the dependency has recovered
        before fully closing
      - It doubles the request rate to actively stress-test the dependency and confirm it can handle a
        surge before normal traffic is restored
      - It transparently reroutes all traffic to a standby instance of the dependency in a different data
        center while the primary is being probed
    answer: 1
    explanation: |
      HALF-OPEN sends a trickle of probe requests after the cooldown; success closes the breaker, failure
      reopens it. It neither blocks permanently, amplifies load, nor reroutes regions.
    ref: concepts.md#circuit-breakers
  - id: resilience-tradeoffs-deep-dive-023
    difficulty: intermediate
    tags:
      - circuit-breaker
      - retries
      - comparison
    question: |
      How do retries and circuit breakers embody opposite assumptions, and why are both needed?
    options:
      - They make identical assumptions about failure, so deploying one of them makes the other completely
        redundant and safe to remove from the call path
      - Retries are meant only for read operations while circuit breakers are meant only for writes, so the
        two never apply to the same endpoint at once
      - Retries assume the fault is transient and re-send; breakers assume it is sustained and stop sending
        - the breaker governs the retries so you don't hammer a dead dependency
      - Circuit breakers fully replace timeouts, since an open breaker already bounds how long any call to
        the dependency is allowed to wait before returning
    answer: 2
    explanation: |
      Retries bet on transience; breakers detect sustained failure and cut off retries. Combined, retries handle
      blips while the breaker prevents retry storms during real outages. They are not read/write specific and
      breakers do not replace timeouts.
    ref: concepts.md#circuit-breakers
  - id: resilience-tradeoffs-deep-dive-024
    difficulty: intermediate
    tags:
      - bulkhead
      - thread-pool
    question: |
      Giving each downstream dependency its own bounded thread pool (rather than a shared global pool)
      primarily buys you:
    options:
      - Higher overall resource utilization, since each dedicated pool can be packed to capacity without
        leaving idle threads reserved for other dependencies
      - Stronger data consistency, because per-dependency pools serialize writes and prevent concurrent
        updates from interleaving across dependencies
      - Lower storage costs, as bounding the pool per dependency reduces the amount of buffered request
        state the service must hold on disk
      - 'Fault isolation: a single hung dependency can only exhaust its own pool, not starve calls to
        healthy dependencies'
    answer: 3
    explanation: |
      Per-dependency pools contain a hang to that dependency, protecting the rest. The trade-off is LOWER
      utilization (pools sit partly idle), not higher, and it has nothing to do with consistency or storage.
    ref: concepts.md#bulkheads-and-isolation
  - id: resilience-tradeoffs-deep-dive-025
    difficulty: intermediate
    tags:
      - rate-limiting
      - algorithms
      - token-bucket
    question: |
      Which rate-limiting algorithm naturally allows short bursts up to a configured size while enforcing a
      long-run average rate, and is the common default?
    options:
      - Token bucket
      - Fixed window counter
      - Leaky bucket (constant output)
      - Sliding window log
    answer: 0
    explanation: |
      Token bucket accumulates tokens up to a bucket size (allowing bursts) and refills at rate R (bounding the
      average). Leaky bucket smooths to a constant rate (no bursts), fixed window has boundary-burst issues, and
      sliding window log is accurate but memory-heavy.
    ref: concepts.md#rate-limiting-and-load-shedding
  - id: resilience-tradeoffs-deep-dive-026
    difficulty: intermediate
    tags:
      - load-shedding
      - prioritization
    question: |
      An e-commerce service is at 95% CPU during a spike. Prioritized load shedding would most appropriately:
    options:
      - Drop checkout requests first because they are the most CPU-expensive, freeing the largest amount
        of capacity per request rejected during the spike
      - Drop low-value requests (e.g. recommendation widgets) first while continuing to serve high-value
        paths like checkout
      - Reject all incoming requests equally, regardless of value, until CPU drops back under the target
        threshold and the spike has fully subsided
      - Increase the timeout on every request so slow calls are given more time to finish instead of being
        rejected while the CPU is saturated
    answer: 1
    explanation: |
      The point of prioritized shedding is to sacrifice low-value work to protect revenue-critical paths.
      Dropping checkout defeats the purpose, blanket rejection is a worse outcome, and raising timeouts worsens
      overload.
    ref: concepts.md#rate-limiting-and-load-shedding
  - id: resilience-tradeoffs-deep-dive-027
    difficulty: intermediate
    tags:
      - graceful-degradation
      - fallback-ladder
    question: |
      A product page depends on an inventory service (critical), a reviews service, and a recommendations
      service (both optional). The recommendations service is down. The best degradation strategy is:
    options:
      - Return a 500 error for the entire product page whenever recommendations is unreachable, so users
        never see a page that is missing one of its sections
      - Block all writes site-wide until the recommendations service recovers, ensuring no new data is
        stored while any optional dependency is degraded
      - Hide or show default recommendations while rendering the rest of the page normally, and emit a
        metric that the fallback fired
      - Retry the recommendations call synchronously in the request path forever until it finally responds,
        holding the product page open until then
    answer: 2
    explanation: |
      Optional features should degrade (hide/default) without failing the critical path, and fallbacks should
      be observable. Failing the whole page, a site-wide write freeze, or infinite synchronous retries all
      violate the isolate-the-critical-path principle.
    ref: concepts.md#graceful-degradation-and-fallbacks
  - id: resilience-tradeoffs-deep-dive-028
    difficulty: intermediate
    tags:
      - failover
      - rto
      - rpo
    question: |
      In active-passive failover, RTO and RPO respectively refer to:
    options:
      - Read throughput in requests per second and write throughput in requests per second, measured
        separately for the primary and the standby node
      - The number of replicas kept in the cluster and the number of regions those replicas are spread
        across for redundancy purposes
      - The client-side request timeout and the server-side response timeout that together bound how long
        any single failover call is allowed to run
      - How long recovery takes (detection + promotion) and how much recent data may be lost (unreplicated
        writes)
    answer: 3
    explanation: |
      RTO (recovery time objective) is the downtime during failover; RPO (recovery point objective) is the
      acceptable data loss window. They are not throughputs, counts, or timeouts.
    ref: concepts.md#redundancy-and-failover
  - id: resilience-tradeoffs-deep-dive-029
    difficulty: intermediate
    tags:
      - failover
      - split-brain
    question: |
      During a network partition, both a primary and its standby conclude they should be the writer. This
      dangerous condition is called split-brain. It is typically prevented by:
    options:
      - Requiring a quorum / lease / fencing token so only one node can legitimately act as primary
      - Increasing the read timeout so that a node waits longer before concluding the other primary has
        disappeared and promoting itself
      - Adding more read replicas so that there are enough healthy copies to outvote whichever primary
        turns out to be on the wrong side of the partition
      - Compressing the replication traffic between the primary and standby so that state can be exchanged
        fast enough to keep both nodes in agreement
    answer: 0
    explanation: |
      Quorum-based election, leases, and fencing tokens ensure a single legitimate writer, preventing dual
      primaries. Timeouts, extra read replicas, and compression do not address split-brain.
    ref: concepts.md#redundancy-and-failover
  - id: resilience-tradeoffs-deep-dive-030
    difficulty: intermediate
    tags:
      - multi-region
      - latency-wall
    question: |
      Why do most multi-region active-active designs avoid synchronous cross-region writes for every request?
    options:
      - Cross-region bandwidth is effectively free, so the only real cost of synchronous global writes is
        the extra CPU each region burns coordinating them
      - The speed of light makes cross-region round trips ~30-150ms, so synchronous global writes add
        prohibitive per-write latency
      - Regions are physically incapable of replicating data to one another, so a synchronous write can
        never actually reach a second region in the first place
      - DNS resolution does not function across regions, so a synchronous cross-region write can never
        locate the remote endpoint it needs to commit to
    answer: 1
    explanation: |
      Physical distance imposes tens to 100+ ms per cross-region round trip, so synchronous global writes are
      often unacceptable; designs use async replication or region-partitioned data. Bandwidth cost, inability
      to replicate, and DNS are not the core issue.
    ref: concepts.md#multi-region-architecture-trade-offs
  - id: resilience-tradeoffs-deep-dive-031
    difficulty: intermediate
    tags:
      - cell-based
      - blast-radius
    question: |
      In cell-based architecture, if you run 20 independent cells each serving 1/20 of customers, a
      cell-local failure (bad deploy, poison-pill request, hot key) affects approximately:
    options:
      - 100% of customers, because a cell-local fault still propagates through the shared router to every
        other cell in the fleet
      - 0% of customers, because splitting the fleet into 20 independent cells makes cell-local failures
        impossible by construction
      - About 5% of customers (those in the affected cell)
      - 50% of customers, since cells are paired for redundancy and a fault in one always takes its partner
        cell down with it
    answer: 2
    explanation: |
      A cell-scoped failure is contained to that cell's customers, ~1/20 = 5%. Cells reduce blast radius; they
      don't eliminate failure or affect everyone/half.
    ref: concepts.md#blast-radius-and-cell-based-architecture
  - id: resilience-tradeoffs-deep-dive-032
    difficulty: intermediate
    tags:
      - chaos-engineering
      - method
    question: |
      What is the correct first step of a chaos engineering experiment?
    options:
      - Kill as many production instances as possible up front with no plan, on the theory that a bigger
        fault always surfaces more weaknesses than a small one
      - Disable all monitoring and alerting for the duration so the collected results aren't biased by
        operators reacting to dashboards mid-experiment
      - Run the experiment only after a real outage has already occurred, purely to confirm the root cause
        that has since been identified by the responders
      - Define a measurable steady-state metric that represents 'healthy' before injecting any fault
    answer: 3
    explanation: |
      You must define steady state (e.g. orders/sec) so you can tell whether the injected fault broke anything.
      Blind mass-killing, disabling monitoring, and post-outage-only testing all defeat the purpose.
    ref: concepts.md#chaos-engineering
  - id: resilience-tradeoffs-deep-dive-033
    difficulty: intermediate
    tags:
      - pacelc
      - framework
    question: |
      PACELC extends CAP by adding which insight?
    options:
      - Even with no partition (Else), you still trade Latency against Consistency because stronger consistency
        needs more coordination
      - Partition tolerance is an optional property that a distributed store can simply choose to switch off
        whenever it wants to keep both consistency and availability
      - Availability always beats consistency, so a correctly designed system should default to serving stale
        or conflicting data rather than ever rejecting a request
      - Cost is the only axis that ultimately matters, and both consistency and latency reduce to how many
        machines you are willing to pay for
    answer: 0
    explanation: |
      PACELC says: if Partition -> A or C; Else -> Latency or Consistency. It captures the everyday coordination
      tax that CAP ignores. P is not optional, neither A nor C universally wins, and cost is not the sole axis.
    ref: concepts.md#consistency-availability-latency-and-cost-as-a-unifying-trade-off-framework
  - id: resilience-tradeoffs-deep-dive-034
    difficulty: intermediate
    tags:
      - availability
      - nines
      - cost
    question: |
      Moving a service from 99.9% to 99.99% availability roughly means going from ~8.8 hours/year of
      downtime to ~52 minutes/year. What is the main trade-off this represents?
    options:
      - It is essentially free once you flip a single config flag, since the extra nine is just a
        stricter target the platform enforces at no additional infrastructure cost
      - Each additional 'nine' costs roughly exponentially more (more redundancy, automation, multi-AZ/region),
        so you buy it only if the SLA requires it
      - Higher availability always reduces request latency as well, because the same redundancy that adds
        nines automatically shortens every response's round trip
      - It only affects read consistency, changing how fresh reads are while leaving the write path and
        overall uptime of the service untouched
    answer: 1
    explanation: |
      Extra nines require progressively more redundancy and automation - cost grows steeply. It is not free,
      does not inherently improve latency, and is not merely a read-consistency concern.
    ref: concepts.md#consistency-availability-latency-and-cost-as-a-unifying-trade-off-framework
  - id: resilience-tradeoffs-deep-dive-035
    difficulty: intermediate
    tags:
      - interview
      - script
      - requirements
    question: |
      Before proposing a resilience design in an interview, the most valuable thing to establish first is:
    options:
      - The exact programming language and web framework you will use to implement every service in the
        design before any requirements are pinned down
      - The precise number of microservices the architecture will be decomposed into, drawn out fully
        before the constraints are even discussed
      - 'The concrete constraints and SLA: consistency needs, latency budget, availability target, and
        budget'
      - Which cloud provider's logo to draw on the whiteboard so the diagram looks polished to the
        interviewer from the very start
    answer: 2
    explanation: |
      Constraints drive every trade-off; you can't justify choices without the SLA/latency/consistency/budget
      targets. Language, service count, and provider branding are secondary.
    ref: concepts.md#articulating-trade-offs-in-an-interview
  - id: resilience-tradeoffs-deep-dive-036
    difficulty: intermediate
    tags:
      - rate-limiting
      - distributed-counter
    question: |
      Enforcing a globally accurate rate limit across many API-gateway instances typically requires a shared
      counter (e.g. in Redis). What is the core trade-off versus a purely local per-instance limit?
    options:
      - The shared counter is always both cheaper and faster than a local one, because a single central
        tally avoids the duplicated bookkeeping each instance would otherwise maintain
      - Local per-instance limits are always more accurate than a shared counter, since each instance
        counts its own traffic directly without any replication lag or network delay
      - There is no meaningful difference in behavior between the two approaches, so the choice is purely
        an implementation detail with no effect on the enforced limit
      - A shared counter gives accuracy but adds a network hop (latency) and a dependency/consistency
        cost; local limits are cheap but leaky (allow more than intended in aggregate)
    answer: 3
    explanation: |
      Global accuracy needs coordination (Redis) -> latency and a dependency; local limits avoid that cost but
      overshoot the aggregate limit. Local is not more accurate, shared is not always cheaper, and the behaviors
      clearly differ.
    ref: concepts.md#rate-limiting-and-load-shedding
  - id: resilience-tradeoffs-deep-dive-037
    difficulty: intermediate
    tags:
      - capacity
      - estimation
      - qps
    question: |
      One instance sustains 500 rps. You must handle 1,000,000 rps at peak and want ~30% headroom for spikes
      and failover. Roughly how many instances do you need?
    options:
      - About 2,600
      - About 200
      - About 2,000
      - About 20,000
    answer: 0
    explanation: |
      1,000,000 / 500 = 2,000 for steady state; adding ~30% headroom gives ~2,600. 2,000 ignores headroom, 200
      is off by 10x, and 20,000 is 10x too high.
    ref: concepts.md#rate-limiting-and-load-shedding
  - id: resilience-tradeoffs-deep-dive-038
    difficulty: advanced
    tags:
      - retries
      - retry-budget
      - overload
    question: |
      Your service already uses exponential backoff with full jitter, yet a dependency's brief outage still
      escalates into a wider outage because retries multiply total load. The single most effective additional
      control is:
    options:
      - Increase the maximum number of retries per request so a transient failure has more
        chances to eventually land on a healthy backend instance
      - Add a retry budget / token bucket that caps retries as a fraction of overall traffic (e.g. <=10%),
        bounding aggregate retry load
      - Remove jitter so retries fire on a fixed, predictable schedule that is easier to
        reason about and correlate in the dependency's access logs
      - Shorten all timeouts to near zero so failing calls are abandoned instantly and stop
        holding threads while the dependency is briefly unavailable
    answer: 1
    explanation: |
      Backoff/jitter shape individual clients but don't cap AGGREGATE retry load; a retry budget does exactly
      that and is the storm-proofing control. More retries worsens it, removing jitter re-synchronizes herds,
      and near-zero timeouts cause spurious failures and more retries.
    ref: concepts.md#retries-backoff-and-jitter
  - id: resilience-tradeoffs-deep-dive-039
    difficulty: advanced
    tags:
      - circuit-breaker
      - self-inflicted
      - thresholds
    question: |
      A circuit breaker configured to open when >50% of the last 20 calls fail keeps tripping during brief
      latency blips, causing a self-inflicted partial outage for a dependency that was actually fine. The best
      remediation is:
    options:
      - Remove the circuit breaker entirely and route every call straight through, relying on
        per-request timeouts alone to contain any future dependency failure
      - Lower the failure threshold to 10% so the breaker opens even faster and spends less time
        sending calls into a dependency that is showing any sign of latency
      - Tune the sensitivity (larger window / require minimum volume / longer measurement), add a fallback
        behind it, and keep half-open probing gentle
      - Retry indefinitely instead of breaking, so the caller keeps re-issuing the request until
        the dependency's latency blip clears on its own
    answer: 2
    explanation: |
      Over-eager breakers should be made less twitchy (bigger window, min volume, error-rate thresholds) and
      backed by a fallback so opening isn't catastrophic. Removing it loses cascade protection, a 10% threshold
      makes it MORE eager, and infinite retries reintroduce storms.
    ref: concepts.md#circuit-breakers
  - id: resilience-tradeoffs-deep-dive-040
    difficulty: advanced
    tags:
      - active-active
      - active-passive
      - scenario
    question: |
      You're designing the database for a financial ledger that must guarantee a single source of truth and
      never double-apply a transaction, while a ~30-second failover is acceptable. Which choice best fits, and why?
    options:
      - Multi-master active-active with last-write-wins, because it maximizes write availability
      - Active-active across three regions with eventual consistency, because it has the lowest latency
      - A single instance with no replica, because a ledger's correctness is easiest to reason
        about when exactly one node holds the data and nothing can ever diverge
      - Active-passive with a single writer and synchronous replication to a standby, accepting the RTO
        gap, because single-writer semantics preserve ledger correctness
    answer: 3
    explanation: |
      Ledgers need single-writer, strong-consistency semantics; active-passive provides that and a 30s RTO is
      acceptable. LWW active-active risks lost/conflicting writes, eventual multi-region breaks correctness, and
      a single instance has no redundancy.
    ref: concepts.md#redundancy-and-failover
  - id: resilience-tradeoffs-deep-dive-041
    difficulty: advanced
    tags:
      - multi-region
      - region-partition
      - scenario
    question: |
      A global social app needs low write latency everywhere and must survive a full region loss, but can
      tolerate that a user's data lives in one 'home' region. The most appropriate pattern is:
    options:
      - Active-active with data partitioned by region (users pinned to a home region so writes stay local),
        plus cross-region replication for failover
      - Synchronous quorum writes spanning all regions for every request, so each write is
        durable everywhere the instant it is acknowledged to the client
      - Single-region multi-AZ only, keeping every user's writes inside three availability zones
        of one region for the strongest possible in-region durability
      - Active-passive with the primary in one region and all users worldwide hitting it synchronously
    answer: 0
    explanation: |
      Region-partitioned active-active keeps writes local (low latency) and strong within the home region while
      surviving region loss via replication. Synchronous global writes pay the latency wall, single-region can't
      survive region loss, and a single global primary gives far users high latency.
    ref: concepts.md#multi-region-architecture-trade-offs
  - id: resilience-tradeoffs-deep-dive-042
    difficulty: advanced
    tags:
      - shuffle-sharding
      - blast-radius
    question: |
      Shuffle sharding (as used by AWS Route 53/ELB) reduces blast radius by:
    options:
      - Assigning every customer to the exact same set of nodes so that load stays perfectly
        balanced and any node failure is felt identically by the whole customer base
      - Assigning each customer a random combination (subset) of nodes, so two customers rarely share
        the same full set and a few bad nodes affect few overlapping customers
      - Encrypting each customer's traffic separately with its own key so a compromise of one
        tenant's data cannot expose any other tenant's requests
      - Giving each customer a dedicated physical data center so no hardware fault is ever shared
        between two different customers of the service
    answer: 1
    explanation: |
      By giving each customer a random subset of nodes, the number of distinct virtual shards grows
      combinatorially, so failures/poison-pills rarely hit the same customer pair - cheap isolation. It is not
      one shared set, encryption, or dedicated data centers.
    ref: concepts.md#blast-radius-and-cell-based-architecture
  - id: resilience-tradeoffs-deep-dive-043
    difficulty: advanced
    tags:
      - cell-based
      - trade-offs
      - utilization
    question: |
      What is the PRIMARY cost you accept when adopting cell-based architecture over a single shared stack?
    options:
      - Weaker encryption, because splitting the fleet into cells forces you to terminate TLS
        independently in each cell using a shared, lower-grade cipher suite
      - Loss of the ability to do canary deploys, since a cellular fleet must be upgraded all at
        once to keep every cell running an identical software version
      - Operational complexity and lower resource utilization (each cell needs its own headroom; cross-cell
        operations become hard)
      - Inability to scale horizontally, because cells cap the total node count and prevent you
        from adding more capacity once every cell is provisioned
    answer: 2
    explanation: |
      Cells trade complexity and per-cell headroom (lower utilization) plus difficult cross-cell queries for
      blast-radius isolation. They don't weaken encryption, prevent canaries (they enable per-cell rollout), or
      block horizontal scaling.
    ref: concepts.md#blast-radius-and-cell-based-architecture
  - id: resilience-tradeoffs-deep-dive-044
    difficulty: advanced
    tags:
      - chaos-engineering
      - production
      - blast-radius
    question: |
      A team wants to run chaos experiments in production. What best balances value against risk?
    options:
      - Run the largest possible fault injection immediately across 100% of traffic
      - Only ever test in staging because production is too risky, trusting that a lower
        environment reproduces every real traffic pattern and dependency interaction faithfully
      - Disable alerts during the experiment to avoid noise, so the on-call rotation is not paged
        by the faults you are deliberately injecting during the exercise
      - Start with a minimal blast radius (one instance / small % of traffic), watch steady-state metrics,
        keep an abort switch, and expand only as confidence grows
    answer: 3
    explanation: |
      Controlled, small-blast-radius experiments with an abort switch capture real-world weaknesses at bounded
      risk. Full-blast injection is reckless, staging-only misses real failure modes, and disabling alerts blinds
      you to harm.
    ref: concepts.md#chaos-engineering
  - id: resilience-tradeoffs-deep-dive-045
    difficulty: advanced
    tags:
      - fallback
      - anti-pattern
      - correlated-failure
    question: |
      Marc Brooker (AWS) warns that static fallbacks can be dangerous. What is a key risk of relying on a
      fallback path during a dependency failure?
    options:
      - The fallback path is rarely exercised, may itself be broken/undersized, and can fire in a correlated
        way exactly when everything is stressed - so failures should be observable and the fallback tested
      - Fallbacks always return fresher data than the primary, because the backup path reads from
        a separate store that is updated more frequently than the main dependency
      - Fallbacks make the happy path slower, because every successful primary call must first
        check the fallback layer before its result can be returned to the caller
      - Fallbacks eliminate the need for timeouts, since the fallback engages the instant the
        primary shows any latency and bounds the total wait on its own
    answer: 0
    explanation: |
      Cold, untested fallback paths can fail or be overwhelmed precisely under load, and silent fallbacks mask
      problems - so alert on them and test them. Fallbacks are not fresher, don't slow the happy path, and don't
      remove the need for timeouts.
    ref: concepts.md#why-naive-fallbacks-are-dangerous
  - id: resilience-tradeoffs-deep-dive-046
    difficulty: advanced
    tags:
      - load-shedding
      - adaptive
      - little-law
    question: |
      Instead of shedding at a fixed rps threshold, modern adaptive load shedding (Netflix/Google) reacts to
      measured latency or queue depth. Which principle underpins this?
    options:
      - The CAP theorem, which dictates that under load a server must sacrifice consistency to
        keep admitting requests, so shedding is chosen to preserve availability
      - 'Little''s Law (concurrency = arrival_rate x latency): rising latency implies rising concurrency,
        so admitted concurrency should drop automatically'
      - The end-to-end argument, which says congestion control belongs at the application layer,
        so each server must shed load locally rather than relying on the network to do it
      - Amdahl's Law, which bounds the speedup from parallelism and therefore fixes the maximum
        request rate a server can admit before latency starts climbing
    answer: 1
    explanation: |
      Little's Law links concurrency, arrival rate, and latency; adaptive limiters watch latency/queue depth to
      self-tune admission without magic rps numbers. CAP, the end-to-end argument, and Amdahl's Law are unrelated here.
    ref: concepts.md#rate-limiting-and-load-shedding
  - id: resilience-tradeoffs-deep-dive-047
    difficulty: advanced
    tags:
      - idempotency
      - concurrency
      - conditional-write
    question: |
      Two retries of the same idempotent operation arrive concurrently and both check "has this key been
      processed?" before either writes the result. What technique prevents both from executing the side effect?
    options:
      - Increase the idempotency key TTL so the key survives long enough for the second request
        to reliably observe that the first one has already recorded its result
      - Retry more slowly by adding backoff between attempts, so the two concurrent requests are
        spaced far enough apart that one always finishes writing before the other checks
      - Use an atomic conditional write (e.g. PutItem with attribute_not_exists / INSERT with unique constraint)
        so only one request can claim the key
      - Store the key in a local in-memory map per instance and check that map before writing,
        so each server can detect a duplicate it has already handled itself
    answer: 2
    explanation: |
      A check-then-act race is closed by an atomic claim (conditional write / unique constraint) so exactly one
      request wins. TTL and slower retries don't fix the race, and a per-instance map fails across multiple servers.
    ref: concepts.md#idempotency-for-safe-retries
  - id: resilience-tradeoffs-deep-dive-048
    difficulty: advanced
    tags:
      - timeouts
      - bulkhead
      - cascading
    question: |
      A service calls three dependencies from one shared connection pool of 100. Dependency X starts taking
      10s per call (it's degraded, not down). Which combination most directly prevents X from taking down the
      whole service?
    options:
      - Only add more retries to X, so a call that hangs is quickly re-issued to a fresh
        connection that may reach a healthier replica of the degraded dependency
      - Increase the shared pool to 1000 so there are always spare connections available for the
        healthy dependencies even while X is holding many of them open
      - Add stronger consistency to X's datastore so its reads and writes coordinate more tightly
        and the calls that are currently taking 10s return their results sooner
      - A tight timeout on X plus a bulkhead giving X its own bounded pool, so X's slowness frees threads
        quickly and can't drain the shared pool
    answer: 3
    explanation: |
      Tight timeouts bound how long X ties up a thread, and a bulkhead confines X to its own pool so healthy
      dependencies keep their capacity. More retries worsen load, a bigger shared pool just delays exhaustion,
      and consistency is irrelevant.
    ref: concepts.md#bulkheads-and-isolation
  - id: resilience-tradeoffs-deep-dive-049
    difficulty: advanced
    tags:
      - framework
      - coordination-tax
      - consistency
    question: |
      Why is it fundamentally impossible to have strong global consistency, low global write latency, and
      region-loss survival all at once, cheaply?
    options:
      - Strong consistency requires coordination (round trips among nodes); across regions those round
        trips cost tens to 100+ ms - it's physics (speed of light) plus CAP/FLP, not a tooling gap
      - It's just an engineering limitation that will be solved by faster CPUs once processors
        can execute the consistency-coordination protocol quickly enough to hide the round trips
      - Because commercial databases deliberately refuse to replicate across regions, and the
        moment vendors enable that feature all three properties become achievable together
      - Because DNS caching prevents it by serving stale endpoint records that stop writes from
        reaching every region in time to coordinate a consistent commit
    answer: 0
    explanation: |
      The coordination tax is inherent: consistency needs agreement, agreement needs round trips, and
      cross-region round trips are bounded by light speed. It's a physical/theoretical limit, not a CPU, DB, or
      DNS issue.
    ref: concepts.md#consistency-availability-latency-and-cost-as-a-unifying-trade-off-framework
  - id: resilience-tradeoffs-deep-dive-050
    difficulty: advanced
    tags:
      - multi-region
      - spanner
      - trade-offs
    question: |
      Google Spanner offers externally-consistent (linearizable) transactions across regions using TrueTime +
      Paxos. In PACELC terms and practically, what is the price you pay?
    options:
      - It sacrifices durability, keeping committed writes only in volatile memory across the
        Paxos group so a coordinated power event can silently lose acknowledged transactions
      - Writes incur cross-region coordination latency (commit-wait / consensus round trips); it is PC/EC
        - it chooses consistency over latency even without partitions
      - It cannot survive a region failure, because TrueTime pins the leader to a single region
        and a loss of that region halts all transactions until it is manually restored
      - It provides only eventual consistency, exposing readers to stale values for a short
        window after each write until the Paxos replicas converge in the background
    answer: 1
    explanation: |
      Spanner is PC/EC: it pays latency (commit-wait and consensus) to keep strong consistency globally. It does
      not sacrifice durability, does survive region loss, and is strongly (not eventually) consistent.
    ref: concepts.md#multi-region-architecture-trade-offs
  - id: resilience-tradeoffs-deep-dive-051
    difficulty: advanced
    tags:
      - interview
      - over-engineering
      - default
    question: |
      For a new service whose SLA only requires surviving a single-AZ failure with strong consistency, an
      interviewer will be MOST impressed if you:
    options:
      - Immediately propose active-active multi-region with CRDTs for maximum resilience, so the
        service already tolerates a full region loss well beyond anything the SLA asks for
      - Use a single instance to keep it simple, arguing that fewer moving parts means fewer
        things that can fail and that the AZ requirement can be met with quick restarts
      - Default to single-region multi-AZ with timeouts, idempotent retries, breakers, and graceful degradation,
        and explicitly say you'd add multi-region only if the SLA demanded region-loss survival
      - Propose Spanner for everything to avoid ever thinking about consistency, letting a single
        globally-distributed database absorb every requirement no matter how modest the SLA
    answer: 2
    explanation: |
      Matching the design to the stated SLA (multi-AZ) and naming the crossover for escalating to multi-region
      shows cost-aware judgment. Over-engineering (multi-region/Spanner-everywhere) burns money/complexity, and a
      single instance fails the AZ requirement.
    ref: concepts.md#articulating-trade-offs-in-an-interview
  - id: resilience-tradeoffs-deep-dive-052
    difficulty: advanced
    tags:
      - scenario
      - which-failure-not-tolerated
    question: |
      A stateless API tier runs across 3 AZs in one region behind a load balancer, with a Postgres primary in
      AZ-a and a synchronous standby in AZ-b (auto-failover). Which failure does this design NOT tolerate?
    options:
      - Loss of a single API instance
      - Loss of AZ-a (including the DB primary)
      - A single slow dependency (assuming timeouts are set)
      - A complete region outage
    answer: 3
    explanation: |
      Everything is in one region, so a full region outage takes it down; AZ-a loss is survived via failover,
      instance loss via the LB, and slow deps via timeouts. Region-loss survival requires multi-region.
    ref: concepts.md#multi-region-architecture-trade-offs
  - id: resilience-tradeoffs-deep-dive-053
    difficulty: advanced
    tags:
      - retries
      - idempotency
      - write-path
    question: |
      You propose automatic retries on a write endpoint that debits a wallet. To keep this safe under a
      "success but response lost" scenario, the ESSENTIAL companion is:
    options:
      - An idempotency key so the retried debit is deduplicated to a single effect on the server
      - A bigger connection pool so the retried debit can grab a fresh connection instead of
        blocking, ensuring the second attempt reaches the wallet service without waiting
      - A read replica for the wallet so the retry reads the current balance first and skips the
        debit if the funds already appear to have been deducted by the earlier attempt
      - A longer TCP keepalive so the original connection stays open and the acknowledgement can
        still arrive, letting the client avoid issuing the retry in the first place
    answer: 0
    explanation: |
      If the first debit succeeded but the ack was lost, a naive retry double-debits; an idempotency key makes
      the server treat the retry as the same operation. Pool size, replicas, and keepalive don't prevent
      duplicate effects.
    ref: concepts.md#idempotency-for-safe-retries
  - id: resilience-tradeoffs-deep-dive-054
    difficulty: advanced
    tags:
      - load-shedding
      - retries
      - feedback-loop
    question: |
      When a server sheds load, returning 429 with a Retry-After header is preferable to silently dropping the
      connection because:
    options:
      - 429 responses are cached by the CDN forever, so every subsequent client is served the
        rejection from the edge and the origin never sees the retried traffic again
      - 'It closes the loop with client-side retry/backoff logic: well-behaved clients back off for the
        suggested time instead of hammering immediately, reducing retry-driven overload'
      - It guarantees the request will eventually succeed, because the Retry-After header reserves
        a slot for that client so the server is obligated to admit the retry when the delay ends
      - It increases server throughput directly, since returning a 429 costs far less work than
        a full response and that saved capacity is applied straight to admitted requests
    answer: 1
    explanation: |
      An explicit 429 + Retry-After tells clients to back off, dampening the retry feedback loop that a silent
      drop would trigger. It is not cached forever, does not guarantee success, and doesn't directly raise throughput.
    ref: concepts.md#rate-limiting-and-load-shedding
  - id: resilience-tradeoffs-deep-dive-055
    difficulty: expert
    tags:
      - metastable
      - control-theory
      - expert
    question: |
      A system enters a metastable failure state: even after the triggering spike ends, it remains overloaded
      because a "sustaining effect" keeps load high. Which set of mechanisms most directly breaks a metastable
      failure loop?
    options:
      - Permanently over-provision the fleet with far more capacity and simply hope the triggering
        spike never recurs, leaving the retry feedback loop itself completely untouched
      - Increase the per-request retry count from 3 to 10 so more of the failing requests eventually
        land on a healthy backend and succeed on a later attempt
      - 'Reduce the sustaining feedback: retry budgets, load shedding, circuit breakers, and disabling/limiting
        client retries to let the system drain below the recovery threshold'
      - Lengthen every client and server timeout substantially so fewer in-flight requests cross the
        deadline and get counted as failures needing a retry
    answer: 2
    explanation: |
      Metastable failures persist due to a work-amplifying feedback loop (often retries); breaking it requires
      cutting that amplification (budgets, shedding, breakers) so load falls below the recovery threshold. More
      retries and longer timeouts strengthen the loop; adding capacity doesn't remove the feedback.
    ref: concepts.md#retries-backoff-and-jitter
  - id: resilience-tradeoffs-deep-dive-056
    difficulty: expert
    tags:
      - expert
      - static-stability
      - multi-az
    question: |
      AWS advocates "static stability" for multi-AZ systems. What does it mean and why is it more resilient
      than dynamic reaction?
    options:
      - The system's configuration is frozen at launch and never changes, so deployments and scaling
        events are forbidden once it is running in production
      - It relies on autoscaling and the control plane to instantly detect and replace lost capacity
        the moment an AZ outage begins, reacting dynamically to each failure as it happens
      - It uses only statically assigned IP addresses rather than DNS, so endpoints never move and
        clients never have to re-resolve a host during a failure
      - The system is pre-provisioned to keep operating with existing resources during a failure WITHOUT
        depending on the control plane to launch new capacity or make changes, because control planes
        are often unavailable exactly during large failures
    answer: 3
    explanation: |
      Static stability means surviving a failure with already-provisioned resources and no control-plane
      dependency, since control planes (launching instances, etc.) are frequently degraded during big events.
      Relying on autoscaling to instantly react is exactly the fragile pattern it warns against; it's not about
      never changing config or static IPs.
    ref: concepts.md#static-stability
  - id: resilience-tradeoffs-deep-dive-057
    difficulty: expert
    tags:
      - expert
      - active-active
      - conflict-resolution
      - crdt
    question: |
      In a globally-replicated active-active store using last-write-wins (LWW) for conflict resolution, what
      subtle correctness hazard must you flag, and what is a stronger alternative for certain data types?
    options:
      - LWW can silently drop concurrent writes (and is sensitive to clock skew), so for structures like
        counters/sets a CRDT that merges deterministically without losing updates is safer
      - LWW mathematically guarantees that no concurrent update is ever lost, so there is no
        correctness hazard and no need for a specialized merge type at all
      - LWW requires acquiring a single global lock before every write, which makes it slow under
        contention but keeps concurrent updates perfectly correct and conflict-free
      - LWW only works correctly under synchronous replication, so it cannot be used in an
        asynchronously-replicated active-active store without violating its guarantees
    answer: 0
    explanation: |
      LWW resolves conflicts by discarding all-but-one concurrent write and depends on clock accuracy, so it can
      lose updates; CRDTs merge concurrent updates without loss for suitable types. LWW does lose data, needs no
      global lock, and is used precisely in async replication.
    ref: concepts.md#redundancy-and-failover
  - id: resilience-tradeoffs-deep-dive-058
    difficulty: expert
    tags:
      - expert
      - timeouts
      - congestion
      - tail
    question: |
      Setting client timeouts extremely tight (well below p99) during a mild latency increase can paradoxically
      make an overload WORSE. Why?
    options:
      - Tight timeouts sharply reduce CPU usage on the client by cancelling threads sooner, and that
        reclaimed headroom is what relieves the overload on the struggling server
      - Requests that would have completed just after the timeout are abandoned and retried, adding fresh
        load while wasting the work already done - amplifying congestion (a form of goodput collapse)
      - Tight timeouts increase the TCP congestion window, so each surviving connection ships more
        data per round trip and that extra pressure is what tips the server into overload
      - Tight timeouts force the server into a strong-consistency mode where every read blocks on a
        quorum, and that added coordination is what deepens the congestion
    answer: 1
    explanation: |
      When latency rises, an over-tight timeout kills in-flight requests that were about to finish and triggers
      retries, wasting completed work and adding load - throughput (goodput) collapses. It doesn't meaningfully
      cut client CPU, change TCP windows, or affect consistency.
    ref: concepts.md#timeouts-and-deadlines
  - id: resilience-tradeoffs-deep-dive-059
    difficulty: expert
    tags:
      - expert
      - cell-based
      - poison-pill
      - router
    question: |
      In cell-based architecture, why is the cell router deliberately kept extremely thin and simple, and what
      would violate the design's intent?
    options:
      - Because the router should absorb all of the system's business logic and validation so the
        individual cells can stay tiny and hold almost no application code of their own
      - Because routers are inherently impossible to make highly available, so keeping them thin is
        the only way to reduce how often the single shared component goes down
      - Because the router is shared across all cells, so any bug or stateful complexity in it becomes
        a system-wide (100% blast radius) failure - putting heavy logic or shared mutable state there
        defeats the isolation
      - Because the router must be replicated and run as a full copy inside every single cell, and
        keeping it thin is what makes that per-cell duplication affordable
    answer: 2
    explanation: |
      The router is the one shared component; keeping it thin/stateless/HA minimizes the chance it becomes a
      system-wide single point of failure. Loading it with logic or shared state reintroduces a 100% blast-radius
      component - the opposite of the goal.
    ref: concepts.md#blast-radius-and-cell-based-architecture
  - id: resilience-tradeoffs-deep-dive-060
    difficulty: expert
    tags:
      - expert
      - chaos-engineering
      - latency-injection
    question: |
      Experienced chaos practitioners say latency injection often reveals more than instance-kill experiments.
      Why?
    options:
      - Latency is far easier to inject than killing an instance, so teams run these experiments more
        often and that higher cadence is the whole reason they surface more weaknesses
      - Killing an instance never produces any observable effect on a well-built system, so those
        experiments always come back empty and teach the team nothing at all
      - Latency injection permanently lowers the service's steady-state latency afterwards, so the
        experiment doubles as a lasting performance optimization for the whole fleet
      - '''Slow'' is harder to detect and handle than ''dead'': hung/slow dependencies quietly exhaust
        pools and defeat naive health checks and missing timeouts, exposing cascading-failure paths that
        clean crashes don''t'
    answer: 3
    explanation: |
      Clean crashes are quickly detected and routed around; partial/slow failures slip past health checks,
      exhaust resources, and cascade - exactly the fragile paths you want to find. It's not about ease of
      injection, and instance kills do have effects.
    ref: concepts.md#chaos-engineering
  - id: resilience-tradeoffs-deep-dive-061
    difficulty: expert
    tags:
      - expert
      - framework
      - goodput
      - overload
    question: |
      Under severe overload, a well-designed system should aim to maximize "goodput" rather than throughput.
      What distinguishes goodput, and which design choice supports it?
    options:
      - Goodput = useful work that actually completes successfully within its deadline; support it by
        shedding excess load early so admitted requests finish, rather than admitting everything and completing
        little
      - Goodput = the total count of requests received at the edge; support it by admitting every
        arriving request so the intake number stays as high as possible under overload
      - Goodput = the number of retry attempts the system performs; support it by retrying failed
        calls more aggressively so the retry tally keeps climbing during a spike
      - Goodput = the raw bytes transferred over the wire; support it by widening the pipe and adding
        bandwidth so more data moves regardless of whether requests actually finish
    answer: 0
    explanation: |
      Goodput counts only requests that complete usefully in time; admitting everything under overload leads to
      lots of started-but-failed work (low goodput). Early shedding lets admitted work succeed. Goodput is not raw
      requests, retries, or bytes.
    ref: concepts.md#rate-limiting-and-load-shedding
  - id: resilience-tradeoffs-deep-dive-062
    difficulty: expert
    tags:
      - expert
      - correlated-failure
      - redundancy
    question: |
      Adding redundant replicas increases availability ONLY if failures are largely independent. Which scenario
      shows redundancy failing to help because of correlated failure?
    options:
      - Two replicas on physically separate racks with independent power feeds; a single rack's power
        supply dies while the other rack keeps its replica serving traffic normally
      - Three replicas that all run the same buggy deploy or all depend on one shared config service -
        a single bad push or config outage takes down all of them at once
      - Two replicas placed in separate availability zones on isolated network fabrics; one AZ loses
        its network connectivity while the other AZ's replica continues to answer requests
      - Five replicas behind a load balancer on independent hosts; one instance's disk fails and the
        balancer simply routes around it to the four remaining healthy replicas
    answer: 1
    explanation: |
      Redundancy assumes independent failure; a shared bad deploy or shared config dependency correlates the
      failures so all replicas die together (why canary/cell rollouts and dependency isolation matter). The other
      cases are genuinely independent faults redundancy handles well.
    ref: concepts.md#redundancy-and-failover
  - id: resilience-tradeoffs-deep-dive-063
    difficulty: expert
    tags:
      - expert
      - interview
      - trade-off-axes
    question: |
      An interviewer asks you to "enumerate every axis you traded" in your design that added synchronous
      cross-region replication. The strongest answer maps the change to:
    options:
      - Only availability, since synchronous cross-region replication affects nothing but how many
        nines the service can hit and leaves latency, cost, and consistency completely unchanged
      - Only cost, since cross-region replication just means paying for more machines and leaves the
        latency, consistency, and availability of every request exactly as it was before
      - 'Consistency (stronger, if synchronous), availability/region-survival (better), latency (worse:
        +cross-region RTT per write), and cost/complexity (worse: ~2x infra, ops), then names the crossover:
        ''worth it only if the SLA requires surviving region loss'''
      - Only latency, since consistency, availability, and cost are all unaffected by adding
        synchronous cross-region replication and only the per-write round trip gets longer
    answer: 2
    explanation: |
      A complete trade-off answer touches all four axes (consistency, availability, latency, cost/complexity) and
      states the crossover condition. Reducing it to a single axis misses the point of the exercise.
    ref: concepts.md#articulating-trade-offs-in-an-interview
  - id: resilience-tradeoffs-deep-dive-064
    difficulty: expert
    tags:
      - expert
      - idempotency
      - dedup-window
      - storage
    question: |
      Your idempotency-key store keeps keys for 24h. A client, after a 25h network outage, retries a payment
      with the same key. What is the risk and the correct design stance?
    options:
      - There is no risk at all, because idempotency keys remain valid forever and the 24h TTL only
        controls log verbosity, so the retry is always deduplicated no matter how much time has passed
      - The server will crash on the retry, because an expired idempotency key leaves a dangling
        record that corrupts the payments database as soon as the duplicate request arrives
      - The client should simply generate a brand-new idempotency key and retry, which is always the
        safe move because a fresh key can never collide with any earlier attempt's stored result
      - The key may have expired, so the server could re-execute the charge as if new; the dedup guarantee
        is only as strong as the retention window, so set TTL >= the maximum plausible retry window (and
        reject/expire clearly at the boundary)
    answer: 3
    explanation: |
      Idempotency guarantees hold only within the retention window; a retry after expiry can double-execute, so
      the TTL must cover the realistic retry horizon. Keys aren't eternal, expiry doesn't corrupt data, and a
      fresh key defeats deduplication (it would look like a new charge).
    ref: concepts.md#idempotency-for-safe-retries
  - id: resilience-tradeoffs-deep-dive-065
    difficulty: expert
    tags:
      - expert
      - circuit-breaker
      - distributed
      - coordination
    question: |
      In a fleet of 500 instances each running its own local circuit breaker against a shared dependency, what
      subtle behavior should you anticipate compared to a single global breaker?
    options:
      - Breakers open independently based on each instance's local sample, so tripping is gradual/uneven
        and one instance may still probe (half-open) and hammer a struggling dependency; you may need
        coordinated or adaptive thresholds and gentle probing to avoid collective probe load
      - All 500 breakers will trip and open at exactly the same microsecond, because each instance
        observes the identical shared dependency and therefore reaches its failure threshold in lockstep
      - Local per-instance breakers make it structurally impossible to overload the shared dependency,
        since the aggregate probe traffic from 500 half-open breakers can never exceed a safe rate
      - Local breakers guarantee a globally consistent open/closed state across the whole fleet,
        because each instance's decision is automatically replicated to the other 499 in real time
    answer: 0
    explanation: |
      Independent local breakers trip on local samples, giving uneven behavior and a risk that aggregate
      half-open probing still overloads the dependency. They don't synchronize perfectly, don't guarantee the dep
      can't be overloaded, and provide no global consistency.
    ref: concepts.md#circuit-breakers
  - id: resilience-tradeoffs-deep-dive-066
    difficulty: expert
    tags:
      - expert
      - multi-region
      - cost
      - gray-failure
    question: |
      A "gray failure" (partial/degraded, not a clean outage) in a multi-region active-passive setup is
      dangerous because:
    options:
      - It always trips the failover automation instantly, cutting over to the passive region the
        moment any single user request returns an error, so the bad state is resolved automatically
      - The primary appears healthy to failover automation (passes health checks) while serving degraded/erroring
        traffic to users, so automated failover doesn't fire and humans hesitate - the system stays in
        a bad state longer than a clean outage would
      - Gray failures by definition cannot affect availability, since a system that still answers
        health checks is considered fully up and its users therefore experience no degradation
      - It only ever affects the passive standby region, which serves no live traffic anyway, so
        users on the active primary are completely insulated from any gray-failure symptoms
    answer: 1
    explanation: |
      Gray failures fool health checks so automation won't fail over, yet users suffer - the ambiguity delays
      response versus a clean, detectable outage. They don't trigger instant failover, do affect availability, and
      hit the active primary (which serves users).
    ref: concepts.md#multi-region-architecture-trade-offs
  - id: resilience-tradeoffs-deep-dive-067
    difficulty: expert
    tags:
      - expert
      - framework
      - pacelc
      - classification
    question: |
      In PACELC terms, DynamoDB and Cassandra (default tunable settings favoring availability/low latency) are
      typically classified as, and Spanner as:
    options:
      - DynamoDB/Cassandra = PC/EC; Spanner = PA/EL
      - Both are PA/EL
      - DynamoDB/Cassandra = PA/EL; Spanner = PC/EC
      - Both are PC/EC
    answer: 2
    explanation: |
      Dynamo/Cassandra default to availability during partitions and latency over consistency otherwise (PA/EL);
      Spanner chooses consistency in both cases (PC/EC), paying latency. The reversed and uniform classifications
      are incorrect.
    ref: concepts.md#consistency-availability-latency-and-cost-as-a-unifying-trade-off-framework
  - id: resilience-tradeoffs-deep-dive-068
    difficulty: expert
    tags:
      - expert
      - bulkhead
      - tenant
      - noisy-neighbor
    question: |
      A multi-tenant SaaS finds one large tenant's traffic spikes degrade all tenants. Comparing mitigations,
      which best balances isolation and cost for the majority small tenants while protecting against the noisy
      neighbor?
    options:
      - Give every single tenant, including the smallest ones, a fully dedicated and isolated stack so
        that no two tenants ever share any compute, pool, or database capacity whatsoever
      - Remove all per-tenant rate limits entirely and let tenants self-regulate their own traffic,
        trusting each one to voluntarily throttle back whenever it notices the platform slowing down
      - Route all tenants through one giant shared thread pool sized for maximum utilization, so every
        request draws from the same undivided capacity regardless of which tenant issued it
      - Use shared cells/pools for the many small tenants (with per-tenant rate limits and bulkheads)
        and dedicate isolated capacity only to the few largest/noisiest tenants
    answer: 3
    explanation: |
      Tiered isolation (shared-but-bulkheaded/rate-limited for small tenants, dedicated for the few large ones)
      contains noisy neighbors without the cost of per-tenant stacks. Dedicating everything is prohibitively
      expensive, removing limits invites abuse, and one giant pool is exactly the noisy-neighbor problem.
    ref: concepts.md#bulkheads-and-isolation
  - id: resilience-tradeoffs-deep-dive-069
    difficulty: intermediate
    tags:
      - fallacies
      - topology
      - service-discovery
    question: |
      "Topology doesn't change" is a fallacy of distributed computing. Which practice directly addresses it?
    options:
      - Using service discovery / DNS so clients resolve current endpoints instead of relying on fixed
        hosts
      - Hardcoding each server's static IP address directly in client config for speed, so no lookup
        is needed and every client always dials the same fixed host on every request
      - Disabling health checks across the fleet to reduce endpoint churn, so the client's cached list
        of servers stays stable and never has to be refreshed as instances come and go
      - Pinning every client permanently to a single named instance for the lifetime of the process,
        so its target never moves even when that instance is replaced or scaled away
    answer: 0
    explanation: |
      Topology changes (scaling, replacement, failover), so clients must discover current endpoints dynamically.
      Hardcoded IPs, disabled health checks, and permanent pinning all break when topology shifts.
    ref: concepts.md#fallacies-of-distributed-computing
  - id: resilience-tradeoffs-deep-dive-070
    difficulty: intermediate
    tags:
      - graceful-degradation
      - read-only-mode
    question: |
      During a write-datastore outage, putting the service into "read-only mode" (serve reads, reject/queue
      writes with a friendly message) is an example of graceful degradation because it:
    options:
      - Guarantees that no data anywhere in the system can ever become inconsistent, because refusing
        writes mathematically freezes every record into a permanently correct and conflict-free state
      - Preserves the most valuable available functionality (reads) instead of failing entirely, trading
        away new-write capability temporarily
      - Speeds up the write path, because queuing writes behind a friendly message lets them batch
        together and commit far faster once the datastore comes back online
      - Eliminates the need for backups, since serving reads from the surviving replicas already
        preserves a durable copy of every record that a backup would otherwise protect
    answer: 1
    explanation: |
      Read-only mode keeps reads working when writes can't, a deliberate trade of write availability for overall
      usefulness. It doesn't guarantee consistency, speed up writes, or replace backups.
    ref: concepts.md#graceful-degradation-and-fallbacks
  - id: resilience-tradeoffs-deep-dive-071
    difficulty: intermediate
    tags:
      - chaos-engineering
      - gameday
      - region
    question: |
      A "GameDay" exercise where a team deliberately evacuates/fails an entire AZ or region while watching
      steady-state metrics is valuable primarily because:
    options:
      - It fully replaces the need for built-in redundancy, since rehearsing an evacuation proves the
        surviving region alone can shoulder all traffic without any standby capacity held in reserve
      - It permanently prevents future region outages, because deliberately failing a region once
        exercises the hardware in a way that inoculates it against later large-scale failures
      - It validates that failover, capacity, and runbooks actually work under a real large-scale fault
        before a genuine outage forces the issue
      - It serves as a substitute for continuous monitoring, since a periodic GameDay surfaces the same
        degradations that dashboards and alarms would otherwise have to catch in real time
    answer: 2
    explanation: |
      GameDays prove that failover paths, capacity assumptions, and human procedures hold up under a big
      controlled fault. They don't replace redundancy or monitoring and can't prevent real outages - they prepare
      you for them.
    ref: concepts.md#chaos-engineering
  - id: resilience-tradeoffs-deep-dive-072
    difficulty: advanced
    tags:
      - advanced
      - framework
      - scenario
      - budget
    question: |
      Given constraints: a read-heavy product catalog, 50ms latency budget for global users, eventual
      consistency acceptable (prices update within seconds is fine), and a tight cost budget. Which design best
      fits?
    options:
      - Synchronous cross-region strongly-consistent writes to every replica on each request, so the
        whole catalog is linearizable everywhere at the price of a global round trip per update
      - A single-region strongly-consistent database with all global users reading cross-region
        synchronously, so every read pays the full inter-region latency to reach the one home region
      - Active-passive in a single region with no caching layer at all, serving every global read
        straight from the primary so freshness is maximized but far-away users wait on each request
      - Regional read replicas / CDN-cached catalog with asynchronous replication and short-TTL caches,
        accepting brief staleness for low global read latency and low cost
    answer: 3
    explanation: |
      Read-heavy + eventual-OK + global-low-latency + cost-sensitive points to cached/regional replicas with
      async replication. Synchronous global consistency blows the latency/cost budget, cross-region synchronous
      reads are slow, and single-region-no-cache gives far users high latency.
    ref: concepts.md#trade-offs-and-when-to-use-what
  - id: resilience-tradeoffs-deep-dive-073
    difficulty: advanced
    tags:
      - advanced
      - decision-guide
      - transient-vs-sustained
    question: |
      A dependency alternates between (a) occasional 50ms blips and (b) multi-minute hard outages. The most
      appropriate layered strategy is:
    options:
      - Retries with backoff+jitter+budget for the transient blips, PLUS a circuit breaker with a fallback
        for the sustained outages, so retries stop and degrade gracefully when it's truly down
      - Only unbounded retries, because a persistent enough retry loop will eventually ride out both the
        brief 50ms blips and the multi-minute hard outages without any other mechanism
      - Only a circuit breaker that trips on the first error, because retrying any failed call against a
        shared dependency is inherently unsafe and should simply never be attempted
      - Increase every client and server timeout to several minutes so both the brief blips and the hard
        outages fall inside the window and each hung call just waits them out
    answer: 0
    explanation: |
      Transient blips call for bounded retries; sustained outages call for a breaker + fallback to stop hammering
      and degrade. Retries alone cause storms during hard outages; breaker alone wastes recoverable blips; longer
      timeouts help neither.
    ref: concepts.md#trade-offs-and-when-to-use-what
  - id: resilience-tradeoffs-deep-dive-074
    difficulty: beginner
    tags:
      - beginner
      - decision-guide
      - when-to-use
    question: |
      For a brand-new service whose requirements only demand tolerating a single availability-zone failure, the
      simplest appropriate baseline is:
    options:
      - Multi-region active-active with cells and shuffle sharding built out on day one so the service can
        already survive a full region loss the moment it launches
      - Single-region, multi-AZ deployment with timeouts, idempotent retries, circuit breakers, and graceful
        degradation
      - A single instance backed by a nightly snapshot, on the theory that restoring the most recent backup
        after a crash is fast enough to satisfy an availability-zone fault requirement
      - Global synchronous replication via Spanner so every write is linearizable across regions from the
        very first day, regardless of what the actual SLA asks for
    answer: 1
    explanation: |
      Multi-AZ in one region with the core resilience primitives meets an AZ-fault requirement at reasonable cost.
      Multi-region/cells/Spanner is over-engineering for that SLA, and a single instance can't survive AZ loss.
    ref: concepts.md#trade-offs-and-when-to-use-what
  - id: resilience-tradeoffs-deep-dive-075
    difficulty: advanced
    tags:
      - advanced
      - canary
      - blast-radius
      - deploy
    question: |
      Canary and wave (cell-by-cell) deployments reduce blast radius in which dimension, and what do they
      protect against?
    options:
      - The storage dimension; they protect against disk failure by replicating the new binary across
        multiple volumes before any instance begins serving the updated release
      - The consistency dimension; they guarantee linearizability by draining in-flight writes and quiescing
        the cluster before each wave of the rollout begins
      - The time dimension; they roll a change to a small slice first so a bad release is caught before
        it reaches all customers
      - The network dimension; they encrypt deploy traffic by negotiating a fresh mTLS tunnel to every host
        as the artifact is pushed out across the fleet
    answer: 2
    explanation: |
      Canary/wave rollouts limit how much of the fleet a bad deploy hits at once (time-dimension blast radius),
      catching regressions early. They aren't about disk failure, consistency, or encryption.
    ref: concepts.md#blast-radius-and-cell-based-architecture
  - id: resilience-tradeoffs-deep-dive-076
    difficulty: intermediate
    tags:
      - intermediate
      - fallacies
      - bandwidth
      - backpressure
    question: |
      The fallacy "bandwidth is infinite" is best countered in a high-volume streaming/data pipeline by:
    options:
      - Sending every record uncompressed and in full for simplicity, trusting that the link has enough
        spare capacity to carry the raw volume no matter how large each burst grows
      - Removing all transfer timeouts so that even a badly congested link is given unlimited time to finish
        moving each batch instead of ever aborting a slow transfer
      - Assuming the network will always absorb bursts, so producers can fire at their maximum rate and let
        the pipe soak up whatever spikes the consumers happen to fall behind on
      - Applying backpressure, pagination/chunking, and compression so producers slow down when consumers
        or the network can't keep up
    answer: 3
    explanation: |
      Finite bandwidth requires flow control: backpressure, pagination, and compression prevent overwhelming the
      link/consumer. Uncompressed floods, removing timeouts, and assuming infinite absorption all embody the fallacy.
    ref: concepts.md#fallacies-of-distributed-computing
  - id: resilience-tradeoffs-deep-dive-077
    difficulty: advanced
    tags:
      - advanced
      - queue-and-defer
      - async
      - degradation
    question: |
      For a non-urgent write (e.g. recording an analytics event or sending a welcome email) when the downstream
      processor is overloaded, a strong resilience choice is to:
    options:
      - Accept the request into a durable queue and process it asynchronously later (with idempotent consumers),
        returning success immediately
      - Block the user request synchronously in the request thread until the overloaded processor recovers,
        holding the connection open however many minutes that takes
      - Drop the request silently with no record kept anywhere, on the assumption that a single analytics event
        or welcome email is unimportant enough to lose without trace
      - Retry the call synchronously in a tight loop with no delay until it finally succeeds, hammering the
        already-overloaded processor until one of the attempts happens to get through
    answer: 0
    explanation: |
      Queue-and-defer decouples the user path from a busy processor, trading immediate processing for accepted-now
      durability; idempotent consumers make redelivery safe. Blocking harms UX, silent drops lose data, and tight
      synchronous retries amplify overload.
    ref: concepts.md#graceful-degradation-and-fallbacks
  - id: resilience-tradeoffs-deep-dive-078
    difficulty: expert
    tags:
      - expert
      - over-engineering
      - complexity
      - failure-mode
    question: |
      Why can "adding more resilience mechanisms" itself become a failure mode?
    options:
      - It never can; every additional resilience mechanism is strictly additive, so stacking more breakers,
        retries, and fallbacks always lowers the overall failure probability with no downside
      - Each mechanism (breakers, retries, fallbacks, multi-region, cells) adds moving parts, interactions,
        and steady-state cost/latency; poorly-tuned or interacting mechanisms (e.g. retries feeding a
        storm, an over-eager breaker) can cause outages the system wouldn't otherwise have
      - Because compliance frameworks cap the number of resilience mechanisms a service is permitted to run
        at once, and exceeding that count trips an automatic audit failure that takes the system offline
      - Because resilience mechanisms only ever activate in staging environments and are silently disabled in
        production, so adding more of them there is what quietly weakens the live system
    answer: 1
    explanation: |
      Resilience features have real complexity and cost and can interact badly (retry storms, self-inflicted
      breaker outages, buggy fallbacks), so over-engineering reliability can reduce it. It is not always strictly
      better, and the other options are nonsense.
    ref: concepts.md#consistency-availability-latency-and-cost-as-a-unifying-trade-off-framework
  - id: resilience-tradeoffs-deep-dive-079
    difficulty: intermediate
    tags:
      - intermediate
      - secure
      - fallacy
      - tls
    question: |
      The fallacy "the network is secure" implies which resilience/security practice for service-to-service
      calls?
    options:
      - Assume internal traffic never needs encryption or authentication because anything behind the corporate
        firewall is already on a trusted network that no attacker could ever observe or tamper with
      - Rely solely on a single hardened firewall at the network edge, treating everything that gets past that
        one perimeter boundary as fully trusted and exempt from any further checks
      - Encrypt in transit (TLS/mTLS) and authenticate/authorize calls even inside the perimeter (zero-trust),
        because the network can be observed or compromised
      - Disable authentication between trusted internal services to reduce latency, on the reasoning that
        skipping the mutual handshake shaves round trips off every east-west service-to-service call
    answer: 2
    explanation: |
      Because the network isn't inherently secure, modern designs use TLS/mTLS and per-call authn/authz even
      internally (zero-trust). Assuming internal safety, edge-firewall-only, or disabling internal auth all embody
      the fallacy.
    ref: concepts.md#fallacies-of-distributed-computing
  - id: resilience-tradeoffs-deep-dive-080
    difficulty: advanced
    tags:
      - advanced
      - scenario
      - checkout
      - isolate-critical-path
    question: |
      In a checkout flow, the payment provider (critical) shares a thread pool and retry logic with an
      address-validation service (nice-to-have). During a payment-provider slowdown, checkouts hang. The best
      structural fix is:
    options:
      - Add more retries to the payment call so it eventually succeeds, on the theory that re-issuing the
        request enough times will push one attempt through the provider's slowdown
      - Route all checkouts through the address-validation service first so the nice-to-have dependency runs
        before payment, expecting that ordering to somehow relieve the payment provider's slowness
      - Increase the shared pool size to 10,000 threads so there are always spare threads for the healthy
        calls even while the slow payment calls hold a growing number of them open
      - Isolate the critical payment path with its own bulkhead and tight timeout+deadline, and make address
        validation best-effort (degrade/skip on failure) so a non-critical dependency can never stall
        checkout
    answer: 3
    explanation: |
      Isolating the critical path (bulkhead, timeout, deadline) and making the optional dependency degrade
      protects checkout from unrelated slowness. More retries worsen the slowdown, front-loading address validation
      adds coupling, and a huge shared pool just delays exhaustion without isolation.
    ref: concepts.md#bulkheads-and-isolation
  - id: resilience-tradeoffs-deep-dive-081
    difficulty: advanced
    tags:
      - advanced
      - metastable
      - feedback-loop
    question: |
      A service was healthy, absorbed a 90-second traffic spike, and the spike ended 20 minutes ago - yet it
      remains saturated and is dropping requests. Engineers keep saying "it should recover on its own." What is
      the most accurate diagnosis and first action?
    options:
      - 'It is a metastable failure: the trigger (spike) is gone but a sustaining effect (usually retries) keeps
        offered load above capacity, so it will NOT self-heal; shed load and cap retries to force load below capacity'
      - It is a slow memory leak that accumulated during the spike; restart every process to reclaim the heap
        and the saturation will clear on its own once the fresh instances warm up
      - It is a DNS caching problem where stale resolver entries keep routing to overwhelmed hosts; flush the
        resolver everywhere and traffic will redistribute back to healthy capacity
      - It is normal post-spike warm-up as caches and JIT re-optimize; wait another 20 minutes and it will
        recover without any operator intervention
    answer: 0
    explanation: |
      The defining property of a metastable failure is that removing the trigger does not remove the
      self-sustaining feedback loop, so it will not recover unaided; you must cut the amplifier (shed load,
      budget/disable retries). A leak, DNS caching, or "just wait" all misread the loop.
    ref: concepts.md#metastable-failures-and-the-feedback-loop
  - id: resilience-tradeoffs-deep-dive-082
    difficulty: advanced
    tags:
      - advanced
      - metastable
      - capacity
    question: |
      During a confirmed metastable overload driven by client retries, an engineer proposes doubling the
      fleet size to break out of it. Why is this often ineffective on its own?
    options:
      - Adding capacity always fixes overload instantly, because doubling the fleet halves the load on every
        instance regardless of how the offered traffic is being generated
      - New instances are structurally unable to register with the load balancer while an incident is active,
        so the doubled fleet simply never begins receiving any of the traffic
      - Doubling the fleet size violates the CAP theorem, since scaling out during a partition forces the
        cluster to give up either consistency or availability as a direct consequence
      - With the amplifying feedback loop intact, the added capacity is consumed by the same amplified work
        (more retries, more re-queued requests), so goodput stays low until the sustaining effect is cut
    answer: 3
    explanation: |
      Capacity helps only once the feedback loop is broken; otherwise the extra capacity is absorbed by
      amplified work and the system stays metastable. LB registration, CAP, and "always fixes it" are wrong.
    ref: concepts.md#metastable-failures-and-the-feedback-loop
  - id: resilience-tradeoffs-deep-dive-083
    difficulty: expert
    tags:
      - expert
      - metastable
      - hysteresis
    question: |
      Why must you drive offered load WELL BELOW the original capacity (not just back to the knee of the
      throughput curve) to recover from a metastable state?
    options:
      - Because the load balancer needs a fixed settling period to rebalance existing connections across the
        fleet, and it will only redistribute traffic once offered load drops under the old capacity
      - Because TCP slow-start resets every surviving connection to its minimum congestion window, so the
        aggregate throughput cannot climb back until load first falls well beneath the original capacity
      - Because CPUs thermally throttle after sustained saturation and must idle below the prior load level
        for a cool-down interval before their clocks restore full processing capacity
      - 'Because of hysteresis: the amplified in-flight work (retry backlog, deep queues) must first drain, so
        the system only re-stabilizes at a lower load point than where it tipped over'
    answer: 3
    explanation: |
      Metastable systems exhibit hysteresis - the recovery threshold is lower than the failure threshold
      because accumulated amplified work must drain before goodput recovers. LB rebalancing, CPU thermal
      throttling, and slow-start are not the mechanism.
    ref: concepts.md#metastable-failures-and-the-feedback-loop
  - id: resilience-tradeoffs-deep-dive-084
    difficulty: expert
    tags:
      - expert
      - retries
      - jitter-variants
    question: |
      Comparing jitter strategies for retry backoff, which statement is correct?
    options:
      - "Decorrelated jitter computes the next sleep from the previous sleep (random(base, prev*3), capped),
        giving self-adapting spread, while full jitter picks random(0, min(cap, base*2^n)) from the attempt
        number - both far outperform no-jitter, which synchronizes herds"
      - No jitter is preferred because a fixed, deterministic backoff schedule naturally spreads retries apart,
        and the identical delays across clients keep the attempts from ever colliding on the dependency
      - Equal jitter removes the delay floor entirely and retries immediately on every attempt, so it collapses
        to a zero-backoff hot loop that hammers the dependency harder than any other strategy
      - Full jitter and no jitter produce identical load patterns under contention, because randomizing the
        sleep window has no effect once many clients are all backing off from the same failure at once
    answer: 0
    explanation: |
      Decorrelated jitter keys off the previous sleep; full jitter keys off the attempt exponent; both beat
      no-jitter, which creates synchronized herds. Equal jitter keeps a floor (t/2) plus spread, and full vs no
      jitter are very different under contention.
    ref: concepts.md#metastable-failures-and-the-feedback-loop
  - id: resilience-tradeoffs-deep-dive-085
    difficulty: advanced
    tags:
      - advanced
      - retries
      - budget-math
    question: |
      In a 4-hop call chain where every hop retries up to 3x, worst-case fan-out at the deepest service is
      3^4 = 81 calls. A retry budget capping retries at 10% of traffic bounds aggregate amplification to about:
    options:
      - 81x, because a retry budget only reshapes the timing of retries and leaves the multiplicative
        worst-case fan-out at the deepest service completely unchanged
      - 8.1x, since a 10% budget applied at each of the four hops compounds down the chain to roughly one
        order of magnitude below the uncapped per-request worst case
      - 1.1x of baseline traffic, because the budget caps AGGREGATE retries regardless of chain depth
      - 0x, because enabling a retry budget forbids all retries once any hop reports a single failure
    answer: 2
    explanation: |
      A retry budget limits total retries as a fraction of traffic (here +10%), so aggregate load is ~1.1x
      baseline independent of how deep the chain is - which is exactly why budgets beat per-request caps.
      81x/8.1x describe uncapped multiplicative fan-out; budgets do not forbid all retries.
    ref: concepts.md#retries-backoff-and-jitter
  - id: resilience-tradeoffs-deep-dive-086
    difficulty: advanced
    tags:
      - advanced
      - backpressure
      - unbounded-queue
    question: |
      A team puts an UNBOUNDED in-memory queue between a fast ingestion tier and a slower processing tier "so
      we never reject a producer." Under sustained overload, what is the most likely outcome?
    options:
      - The queue self-limits because heap memory is elastic and the runtime transparently spills older
        entries to disk once RAM fills, so depth naturally plateaus at a safe ceiling
      - Consumers automatically speed up to match the producer, because a deeper backlog signals the
        processing tier to scale its throughput up until the arrival and drain rates equalize
      - Throughput increases linearly with queue depth, since a larger buffer keeps every worker continuously
        fed and eliminates the idle gaps that would otherwise cap the processing rate
      - The queue depth grows without bound, inflating latency (Little's Law) and eventually OOM-killing the
        process; the deep queue also causes upstream timeouts and retries, feeding a metastable loop
    answer: 3
    explanation: |
      An unbounded queue converts overload into unbounded memory growth (OOM) and rising latency, which triggers
      upstream timeouts/retries - a classic path into metastable failure. Memory is not elastic, deeper queues do
      not raise throughput, and consumers do not magically speed up.
    ref: concepts.md#backpressure-and-flow-control
  - id: resilience-tradeoffs-deep-dive-087
    difficulty: advanced
    tags:
      - advanced
      - backpressure
      - credit-based
    question: |
      Credit-based flow control (as used by HTTP/2, gRPC, and Reactive Streams) works by:
    options:
      - The producer sending as fast as it possibly can while the consumer simply drops any messages that
        overflow its receive buffer, relying on higher-layer retransmission to recover the losses
      - Randomly delaying each individual message by a jittered interval before transmission, so the aggregate
        send rate is smeared out over time and no instantaneous burst ever reaches the consumer
      - The producer literally paying the consumer a per-message fee through an internal billing system, so
        cost pressure discourages it from sending more traffic than the consumer wants to accept
      - The consumer granting the producer a bounded number of credits (permits to send N messages/bytes); the
        producer may only send while it holds credits, and the consumer replenishes them as it drains
    answer: 3
    explanation: |
      Credit-based flow control has the receiver advertise how much it can accept (credits/window); the sender
      never exceeds outstanding credits, so buffers stay bounded and there is no head-of-line bloat. It is not
      drop-on-overflow, billing, or random delay.
    ref: concepts.md#backpressure-and-flow-control
  - id: resilience-tradeoffs-deep-dive-088
    difficulty: expert
    tags:
      - expert
      - backpressure
      - load-shedding
      - boundary
    question: |
      When should you propagate backpressure upstream versus shed load, and why can't backpressure alone
      protect an internet-facing service?
    options:
      - Always shed and never propagate backpressure, because modern queue-free architectures have made
        flow-control signaling obsolete and dropping excess work is the only technique still worth using
      - Always propagate backpressure and never shed, because shedding discards requests and losing any work
        is unacceptable no matter where in the system the overload originates
      - Backpressure between cooperating internal stages (lossless, preserves work); shed at the untrusted edge
        because you cannot force arbitrary internet clients to slow down - you can only drop or 429 them
      - Backpressure and load shedding are the same underlying mechanism with two different names, so the
        choice between them is purely a matter of which term a given vendor's documentation happens to use
    answer: 2
    explanation: |
      Backpressure requires a cooperating producer that will slow down; internal stages can, but the open
      internet cannot be compelled to, so the edge must shed/429. They are complementary, not identical, and
      neither is universally correct.
    ref: concepts.md#backpressure-and-flow-control
  - id: resilience-tradeoffs-deep-dive-089
    difficulty: advanced
    tags:
