        flapping at a single hard timeout boundary
      - Because a simple binary up/down detector is computationally impossible to implement in a large
        distributed cluster, so a probabilistic suspicion score is the only workable alternative
      - Because phi-accrual detectors are mathematically guaranteed to never produce a false positive, so a
        node they flag as down is always genuinely unreachable and can be evicted with total confidence
      - Because phi-accrual encrypts the heartbeat channel between peers, so gossiped liveness information
