      - Static stability only works within a single availability zone, because coordinating pre-provisioned
        headroom across multiple zones would reintroduce the very control-plane dependency it avoids
    answer: 2
    explanation: |
      Static stability trades cost/utilization (idle headroom) for control-plane independence during failures.
      It does not sacrifice durability, mandate strong consistency, or restrict you to one AZ.
    ref: concepts.md#static-stability
  - id: resilience-tradeoffs-deep-dive-096
