      - The fundamental difference between logs and metrics as telemetry types, where logs capture
        discrete events and metrics capture aggregated numeric time series over intervals
    answer: 0
    explanation: |
      A gray failure exists when the component's self-view (healthy) diverges from the clients' experienced view
      (degraded); this differential is why health-check-driven automation fails to fire. It is not about tools,
      sampling rates, or telemetry formats.
    ref: concepts.md#gray-failures-and-partial-failure-detection
  - id: resilience-tradeoffs-deep-dive-097
