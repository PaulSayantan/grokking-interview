    answer: 0
    explanation: |
      Cold fallback paths are untested and undersized, and they activate en masse exactly during the primary's
      failure, so they can break or collapse under the correlated load - bimodal behavior. Fallbacks are not
      fresher, do not slow the happy path, and the risk is not confined to single-region systems.
