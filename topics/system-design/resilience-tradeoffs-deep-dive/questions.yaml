      is:
    options:
      - Increase the health-check frequency on /healthz so the shallow endpoint is polled far more often
        and any GC-thrashing node is detected and evicted sooner by the load balancer
      - Remove health checks entirely so all nodes are treated equally and the load balancer simply spreads
        traffic evenly, letting the GC-thrashing node absorb its fair share regardless
      - Use deeper/real-path health signals AND client-side outlier detection so callers route around a host
        they observe to be slow/erroring even though its shallow check passes
      - Trust the shallow /healthz check and add more nodes to the pool so the extra capacity dilutes the
        share of traffic that lands on the GC-thrashing instance
    answer: 2
    explanation: |
      Shallow checks miss gray failures; combining deeper health signals with client-observed outlier detection
      lets the fleet eject a host that callers find bad regardless of its self-report. More frequent shallow checks
      still pass, removing checks is worse, and adding nodes ignores the misrouting.
    ref: concepts.md#gray-failures-and-partial-failure-detection
  - id: resilience-tradeoffs-deep-dive-098
