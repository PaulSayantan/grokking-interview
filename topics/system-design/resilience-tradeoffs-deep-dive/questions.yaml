    answer: 0
    explanation: |
      The guidance is to strengthen the single primary path (fewer untested code paths, no bimodal behavior)
      rather than bolt on cold fallbacks; any retained fallback must be continuously exercised and full-size.
      Stacking fallbacks, silencing alarms, and sharing the failing datastore all worsen reliability.
    ref: concepts.md#why-naive-fallbacks-are-dangerous
  - id: resilience-tradeoffs-deep-dive-102
    difficulty: expert
    tags:
