      - criticality
    question: |
      Google's load-management approach tags each request with a criticality level (e.g. CRITICAL_PLUS,
      CRITICAL, SHEDDABLE_PLUS, SHEDDABLE). Under overload, the primary benefit of this scheme is:
    options:
      - It lets the server shed the lowest-criticality requests first while preserving the highest-value
        traffic, and lets that criticality propagate consistently through the call graph
      - It encrypts high-criticality requests with a stronger cipher suite than low-criticality ones, so the
        most important traffic is also the best protected in transit as it flows through the system
      - It guarantees that every tagged request eventually succeeds, because the criticality label reserves a
        capacity slot that the admission controller is obligated to honor even under sustained overload
      - It replaces the need for capacity planning, since tagging requests by criticality lets the server
        right-size itself dynamically and removes any requirement to provision for peak demand ahead of time
    answer: 0
    explanation: |
      Criticality tags let admission control drop SHEDDABLE work first and keep CRITICAL work flowing, and the
      tag propagates so downstream services make consistent decisions. It is not about encryption, does not
      guarantee success, and does not replace capacity planning.
    ref: concepts.md#admission-control-and-brownout
  - id: resilience-tradeoffs-deep-dive-090
    difficulty: advanced
    tags:
      - advanced
      - admission-control
      - adaptive-concurrency
    question: |
      Netflix-style adaptive concurrency limiters avoid configuring a fixed request-per-second threshold by:
    options:
      - Letting operators manually retune the concurrency limit by hand during every incident, so a human
        picks a fresh number each time load shifts rather than fixing one threshold in advance
      - Setting the concurrency limit permanently equal to the number of CPU cores on the instance, on the
        assumption that one in-flight request per core is always the throughput-maximizing ceiling
      - Disabling limits entirely and trusting each client to voluntarily cap its own concurrency, so the
        server never has to compute a threshold because callers self-regulate their offered load
      - Using a control loop (AIMD/gradient, conceptually TCP-congestion-like) that watches measured latency to
        converge on the concurrency that maximizes goodput, shrinking the limit as latency rises
    answer: 3
    explanation: |
      Adaptive limiters treat latency as the congestion signal and continuously adjust the concurrency limit
      like TCP adjusts its window, avoiding brittle magic numbers. Manual tuning, core-count, and no-limit are
      all inferior or nonfunctional under dynamic load.
    ref: concepts.md#admission-control-and-brownout
  - id: resilience-tradeoffs-deep-dive-091
    difficulty: expert
    tags:
      - expert
      - admission-control
      - lifo
      - goodput
    question: |
      Under severe overload with requests carrying deadlines, why can serving newest-first (LIFO) yield higher
      goodput than FIFO?
    options:
      - LIFO uses far less memory than FIFO because a stack fits in a fixed-size array while a FIFO
        queue needs a linked structure that grows unbounded under sustained load
      - FIFO ordering cannot be implemented efficiently on modern multi-core hardware because a strict
        head pointer forces a global lock that serializes every enqueue and dequeue
      - LIFO guarantees perfect fairness across all clients because serving the most recently arrived
        request first means every client eventually receives an identical share of capacity over time
      - Old queued requests have often already breached their deadline (the client gave up/retried), so
        finishing them wastes capacity; serving the freshest requests spends capacity on work still likely to
        be useful
    answer: 3
    explanation: |
      In a deep queue, the oldest items are the most likely to have already timed out client-side, so FIFO burns
      capacity completing doomed work; LIFO serves requests still within their deadline, raising goodput. It is
      not about memory, fairness (LIFO is actually less fair), or hardware.
    ref: concepts.md#admission-control-and-brownout
  - id: resilience-tradeoffs-deep-dive-092
