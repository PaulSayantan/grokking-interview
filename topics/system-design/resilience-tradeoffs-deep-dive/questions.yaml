      - Reducing the number of active data-center power feeds during peak hours to save on electricity
        cost, accepting that fewer racks stay energized under load
      - Randomly returning hard errors to a fixed percentage of users during overload so that the surviving
        fraction always receives the complete, full-fidelity experience
      - Under load pressure, dimming the service by shedding OPTIONAL work (personalization, recommendations,
        fidelity) via a control loop so the essential service stays available for everyone
    answer: 3
    explanation: |
      Brownout is the graceful analogue of a blackout: keep essential functionality lit while dimming optional
      work as a controlled knob. It is not a full shutdown, random errors, or a literal power reduction.
    ref: concepts.md#admission-control-and-brownout
  - id: resilience-tradeoffs-deep-dive-093
    difficulty: expert
    tags:
      - expert
      - static-stability
      - control-plane
    question: |
      You run 3 AZs and want to survive losing one. Design A pre-provisions each AZ to 150% so survivors absorb
      the lost AZ's load with no scaling action. Design B runs at 100% and relies on autoscaling to launch
      replacements during the outage. Why is Design A "statically stable" and generally more resilient?
    options:
      - Design A is cheaper in steady state because running each AZ at 150% packs more useful work onto
        every provisioned instance and leaves no idle capacity to pay for
      - Design A eliminates the need for health checks entirely, since pre-provisioning survivor capacity
        guarantees every remaining instance is healthy and reachable by definition
      - Design B is the statically stable one because autoscaling reacts automatically and needs no human
        operator, so its recovery path is fully self-contained during an outage
      - Design A survives using only already-provisioned resources and needs no control-plane action, whereas
        Design B's recovery depends on the control plane (launch APIs) that is frequently degraded during exactly
        the large-scale events you are trying to survive
    answer: 3
    explanation: |
      Static stability means recovering with resources you already hold and no control-plane dependency; control
      planes are often impaired during big failures, so Design B's launch-on-demand recovery can fail when needed
      most. Design A costs MORE in steady state (idle headroom), and it still needs health checks.
    ref: concepts.md#static-stability
  - id: resilience-tradeoffs-deep-dive-094
    difficulty: expert
    tags:
      - expert
      - static-stability
      - data-plane
      - config
    question: |
      Applying static stability to configuration/routing, the recommended pattern when the config or discovery
      service becomes unavailable is to:
    options:
      - Immediately fail all in-flight requests as soon as fresh config cannot be fetched, so the service
        never risks serving traffic against a configuration that might now be stale
      - Block startup of every instance until the config or discovery service is reachable again, ensuring
        no node ever begins serving without first confirming it holds the very latest configuration
      - Fall back to a set of hardcoded IP addresses compiled into the binary at build time, so the data
        path can still route to backends even while the discovery service is unreachable
      - Keep serving the last-known-good cached config and continue operating, rather than making the data path
        fail because it cannot reach the control plane to refresh
    answer: 3
    explanation: |
      Static stability keeps the data plane independent of the control plane: cache last-good config and keep
      serving if the config service is down, rather than failing on a refresh miss. Failing all requests, hardcoded
      IPs, and blocking startup all reintroduce a control-plane dependency on the data/recovery path.
    ref: concepts.md#static-stability
  - id: resilience-tradeoffs-deep-dive-095
    difficulty: advanced
