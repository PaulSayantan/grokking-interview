    answer: 0
    explanation: |
      Phi-accrual produces a graduated suspicion value tuned to network variance, which handles the gray zone far
      better than a brittle single-timeout binary that flaps or misses. Binary detectors are trivially
      implementable, phi-accrual is not false-positive-free, and it has nothing to do with encryption.
    ref: concepts.md#gray-failures-and-partial-failure-detection
