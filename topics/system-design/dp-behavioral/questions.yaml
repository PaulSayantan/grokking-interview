topic: "Behavioral Design Patterns"
domain: system-design
topic_slug: dp-behavioral
version: 1
questions:
  - id: dp-behavioral-001
    difficulty: beginner
    tags: [fundamentals, behavioral, definition]
    question: |
      What do behavioral design patterns primarily concern themselves with?
    options:
      - How objects are instantiated and by whom, hiding the concrete constructor used
      - How classes and objects are composed into larger structures
      - How objects interact, communicate, and distribute responsibility at runtime
      - How to guarantee a single shared instance with global access
    answer: 2
    explanation: |
      Behavioral patterns deal with the assignment of responsibilities between
      objects and the flow of control and communication among them. Instantiation
      is creational; composition/wiring is structural; single-instance is Singleton.
    ref: concepts.md#behavioral-patterns-at-a-glance
  - id: dp-behavioral-002
    difficulty: beginner
    tags: [gof, count, completeness]
    question: |
      How many behavioral patterns did the Gang of Four define, and which is
      sometimes dropped by popular catalogs?
    options:
      - Eleven patterns; Interpreter is sometimes dropped
      - Ten patterns; Visitor is sometimes dropped
      - Seven patterns; Mediator is sometimes dropped
      - Twelve patterns; Specification is sometimes dropped
    answer: 0
    explanation: |
      GoF defines eleven behavioral patterns. Some catalogs (e.g. refactoring.guru)
      show only ten because they omit Interpreter, which is nonetheless a genuine
      GoF behavioral pattern.
    ref: concepts.md#behavioral-patterns-at-a-glance
  - id: dp-behavioral-003
    difficulty: intermediate
    tags: [inheritance, composition, classification]
    question: |
      Which two behavioral patterns encode behavior primarily via a class
      hierarchy (inheritance) rather than object composition/delegation?
    options:
      - Strategy and State
      - Observer and Mediator
      - Command and Memento
      - Template Method and Interpreter
    answer: 3
    explanation: |
      Template Method varies steps via subclass overrides, and Interpreter encodes
      grammar rules as a class hierarchy — both lean on inheritance. Most other
      behavioral patterns favor composition/delegation.
    ref: concepts.md#behavioral-patterns-at-a-glance
  - id: dp-behavioral-004
    difficulty: beginner
    tags: [chain-of-responsibility, intent]
    question: |
      Which pattern passes a request along a line of handlers until one of them
      handles it, so the sender need not know which object will respond?
    options:
      - Command
      - Chain of Responsibility
      - Mediator
      - Observer
    answer: 1
    explanation: |
      Chain of Responsibility decouples sender from receiver by giving several
      objects a chance to handle the request as it travels the chain.
    ref: concepts.md#chain-of-responsibility
  - id: dp-behavioral-005
    difficulty: intermediate
    tags: [chain-of-responsibility, trade-offs, gotcha]
    question: |
      What is the most important risk of the Chain of Responsibility pattern?
    options:
      - Every handler always runs, causing duplicate processing
      - A request may reach the end of the chain unhandled (receipt is not guaranteed)
      - It forces the sender to hold a direct reference to every handler
      - The chain is fixed at compile time and cannot be reordered or extended at runtime
    answer: 1
    explanation: |
      Because a handler may pass the request along and no handler is obligated to
      act, a request can fall off the end unhandled unless there is a terminal or
      default handler.
    ref: concepts.md#chain-of-responsibility
  - id: dp-behavioral-006
    difficulty: advanced
    tags: [chain-of-responsibility, decorator, vs]
    question: |
      Chain of Responsibility and Decorator both form linked chains of wrappers.
      What is the key behavioral difference?
    options:
      - Decorator stops at the first wrapper that acts; CoR always runs all wrappers
      - Both always run every element; they are functionally identical
      - CoR is built purely with class inheritance while Decorator relies only on object composition
      - CoR typically stops at the handler that acts; Decorator always runs every wrapper and adds behavior
    answer: 3
    explanation: |
      CoR is about selecting a handler and usually stops once one acts. Decorator
      always executes every wrapper, layering added behavior around a delegate.
    ref: concepts.md#chain-of-responsibility
  - id: dp-behavioral-007
    difficulty: beginner
    tags: [command, intent]
    question: |
      Which pattern encapsulates a request as an object so it can be queued,
      logged, parameterized, and undone?
    options:
      - Command
      - Strategy
      - Template Method
      - Visitor
    answer: 0
    explanation: |
      Command reifies a request as an object with an execute() (and often undo())
      method, enabling queuing, logging, macros, and undo/redo.
    ref: concepts.md#command
  - id: dp-behavioral-008
    difficulty: intermediate
    tags: [command, roles, invoker]
    question: |
      In the Command pattern, what is the role of the Invoker?
    options:
      - It performs the real work requested by the command
      - It captures the receiver's internal state for later restore
      - It holds and triggers commands via execute() without knowing what they do
      - It defines the family of interchangeable algorithms the command chooses between
    answer: 2
    explanation: |
      The Invoker (button, menu, scheduler, queue) triggers execute() without
      knowing the concrete command or its receiver. The Receiver does the actual work.
    ref: concepts.md#command
  - id: dp-behavioral-009
    difficulty: advanced
    tags: [command, strategy, vs]
    question: |
      What best distinguishes Command from Strategy?
    options:
      - Command reifies a request/action (with receiver, often undoable); Strategy reifies an interchangeable algorithm
      - Command reifies an interchangeable algorithm; Strategy reifies a request with a receiver
      - Both reify a stateless algorithm identically; only the interface method names differ
      - Command varies steps via subclassing; Strategy dispatches requests down a chain of handlers
    answer: 0
    explanation: |
      A Command bundles a receiver plus arguments and often supports undo (it is a
      reified action you store/replay). A Strategy is an interchangeable algorithm
      the context swaps to change how a step is computed.
    ref: concepts.md#command
  - id: dp-behavioral-010
    difficulty: beginner
    tags: [interpreter, intent, grammar]
    question: |
      Which pattern defines a representation for a simple language's grammar plus
      an interpreter that evaluates sentences of it?
    options:
      - Iterator
      - Composite
      - Interpreter
      - State
    answer: 2
    explanation: |
      Interpreter represents each grammar rule as a class (terminal and nonterminal
      expressions) and evaluates sentences by walking the resulting AST.
    ref: concepts.md#interpreter
  - id: dp-behavioral-011
    difficulty: advanced
    tags: [interpreter, trade-offs, gotcha]
    question: |
      What is the main drawback of the Interpreter pattern that pushes teams toward
      a parser generator for real languages?
    options:
      - It cannot represent recursive grammar rules or self-referential productions
      - Class explosion and poor performance/maintainability as the grammar grows
      - It requires multiple inheritance, which many host languages forbid outright
      - It can only evaluate purely numeric expressions, never string or boolean logic
    answer: 1
    explanation: |
      One class per grammar rule leads to class explosion and poor performance for
      complex grammars, so tools like ANTLR/yacc are preferred beyond simple languages.
    ref: concepts.md#interpreter
  - id: dp-behavioral-012
    difficulty: advanced
    tags: [interpreter, composite, vs]
    question: |
      How does Interpreter relate to the Composite pattern?
    options:
      - They are unrelated; Interpreter never forms a tree
      - Composite is a special case of Interpreter for numeric grammars
      - Interpreter replaces Composite by flattening the tree into a list
      - Interpreter's AST is itself a Composite tree, with an added interpret(context) operation
    answer: 3
    explanation: |
      The abstract syntax tree of expression objects is a Composite structure;
      Interpreter adds the domain operation interpret(context) on top of it.
    ref: concepts.md#interpreter
  - id: dp-behavioral-013
    difficulty: beginner
    tags: [iterator, intent]
    question: |
      Which pattern accesses elements of an aggregate sequentially without exposing
      its underlying representation?
    options:
      - Visitor
      - Mediator
      - Observer
      - Iterator
    answer: 3
    explanation: |
      Iterator provides sequential access to an aggregate's elements while hiding
      whether it is backed by an array, list, tree, or hash table.
    ref: concepts.md#iterator
  - id: dp-behavioral-014
    difficulty: intermediate
    tags: [iterator, internal-external]
    question: |
      What distinguishes an external (active) iterator from an internal (passive) one?
    options:
      - External iterators are always faster and inherently thread-safe by design
      - With an external iterator the client drives the loop; with an internal one the collection drives the walk given a function
      - Internal iterators expose the underlying representation; external ones do not
      - External iterators can only traverse contiguous arrays, never linked or tree structures
    answer: 1
    explanation: |
      External iterators let the client call hasNext()/next() and control the loop;
      internal iterators (e.g. forEach/map) take a function and the collection drives
      the traversal.
    ref: concepts.md#iterator
  - id: dp-behavioral-015
    difficulty: advanced
    tags: [iterator, visitor, vs]
    question: |
      What is the core difference between Iterator and Visitor?
    options:
      - Iterator applies type-specific operations per element; Visitor just walks elements in order
      - They are the same pattern under different names, standardized by the Gang of Four
      - Iterator traverses one collection element-by-element; Visitor applies type-specific operations across a heterogeneous structure
      - Visitor can only be applied to flat arrays, while Iterator works exclusively on tree structures
    answer: 2
    explanation: |
      Iterator is about traversal of one collection; Visitor is about applying
      different operations depending on each element's type — often using an
      iterator to walk the structure.
    ref: concepts.md#iterator
  - id: dp-behavioral-016
    difficulty: beginner
    tags: [mediator, intent]
    question: |
      Which pattern centralizes complex many-to-many communication between objects
      into one coordinator so colleagues don't refer to each other directly?
    options:
      - Mediator
      - Observer
      - Facade
      - Chain of Responsibility
    answer: 0
    explanation: |
      Mediator encapsulates how a set of colleague objects interact, converting a
      many-to-many web into a one-to-many hub-and-spoke.
    ref: concepts.md#mediator
  - id: dp-behavioral-017
    difficulty: intermediate
    tags: [mediator, trade-offs, god-object]
    question: |
      What is the main risk of the Mediator pattern?
    options:
      - It tightly couples every colleague directly to every other colleague in the group
      - It cannot coordinate more than two colleague objects at a time
      - The mediator can grow into a god object concentrating all the complexity
      - It only works with synchronous, single-threaded, in-process colleague objects
    answer: 2
    explanation: |
      By centralizing interaction logic, the mediator can become an omniscient god
      object that is hard to maintain — the complexity it removed from colleagues
      accumulates in one place.
    ref: concepts.md#mediator
  - id: dp-behavioral-018
    difficulty: advanced
    tags: [mediator, observer, vs]
    question: |
      How does Mediator differ from Observer?
    options:
      - Mediator is a one-directional broadcast; Observer is a bidirectional coordination hub
      - They are behaviorally identical; Mediator is merely the newer GoF name for Observer
      - Observer always requires a message broker while Mediator communicates by direct calls
      - Mediator is a bidirectional coordination hub with specific rules; Observer is a one-directional subject-to-subscribers broadcast
    answer: 3
    explanation: |
      A Mediator coordinates known peers bidirectionally with specific interaction
      rules; Observer only broadcasts one-directionally from subject to subscribers
      (mediators are often implemented using Observer).
    ref: concepts.md#mediator
  - id: dp-behavioral-019
    difficulty: beginner
    tags: [memento, intent]
    question: |
      Which pattern captures and externalizes an object's internal state so it can
      be restored later, without violating encapsulation?
    options:
      - Memento
      - Command
      - Prototype
      - State
    answer: 0
    explanation: |
      Memento snapshots an originator's state into an opaque token so it can be
      restored later, while keeping the originator's internals encapsulated.
    ref: concepts.md#memento
  - id: dp-behavioral-020
    difficulty: intermediate
    tags: [memento, roles, caretaker]
    question: |
      In the Memento pattern, what is the caretaker's responsibility?
    options:
      - It reads and modifies the memento's internal fields directly, mutating the saved snapshot in place
      - It holds mementos (e.g. on an undo stack) but treats them as opaque black boxes
      - It creates the memento and later restores the originator's state from it during an undo
      - It defines the grammar for the saved state and validates each field before it is persisted
    answer: 1
    explanation: |
      The caretaker stores mementos but never inspects them; only the originator can
      read a memento's contents (wide interface to originator, narrow to everyone else).
    ref: concepts.md#memento
  - id: dp-behavioral-021
    difficulty: advanced
    tags: [memento, command, vs, undo]
    question: |
      For implementing undo, how do Memento and Command differ?
    options:
      - Memento stores the state to roll back to; Command stores the operation to reverse
      - Memento stores the operation to reverse; Command stores the state to restore
      - Both capture full state snapshots only and can never record an operation to reverse
      - Neither Memento nor Command can support undo without an external transaction log
    answer: 0
    explanation: |
      Memento captures state to restore; Command captures the operation to reverse.
      Command is cheaper when the inverse is easy to compute; Memento is simpler when
      it is not. They are often combined.
    ref: concepts.md#memento
  - id: dp-behavioral-022
    difficulty: beginner
    tags: [observer, intent]
    question: |
      Which pattern defines a one-to-many dependency so that when one object changes
      state, all its dependents are notified automatically?
    options:
      - Strategy
      - Observer
      - Iterator
      - Interpreter
    answer: 1
    explanation: |
      Observer keeps dependents (observers) in sync with a subject: on a state change
      the subject notifies every registered observer.
    ref: concepts.md#observer
  - id: dp-behavioral-023
    difficulty: intermediate
    tags: [observer, push-pull]
    question: |
      What is the difference between the "push" and "pull" models of Observer?
    options:
      - Push and pull are two names for the exact same synchronous in-process notification model
      - Pull requires a message broker to buffer updates, whereas push delivers them with no intermediary
      - Push means observers register with the subject, while pull means they unregister once done
      - Push sends the changed data in the notification; pull sends only "something changed" and observers query the subject
    answer: 3
    explanation: |
      In push, the subject includes the changed data in update(); in pull, the
      subject signals a change and each observer queries the subject for what it needs.
    ref: concepts.md#observer
  - id: dp-behavioral-024
    difficulty: advanced
    tags: [observer, trade-offs, memory-leak]
    question: |
      Which problem is a well-known hazard of the Observer pattern?
    options:
      - Requests falling off the end of a chain unhandled
      - Class explosion from one class per grammar rule
      - Lapsed-listener memory leaks from observers that never unsubscribe
      - Inability to add new operations without editing element classes
    answer: 2
    explanation: |
      Observers that forget to unsubscribe keep the subject (and themselves) alive —
      the lapsed-listener leak. Update cascades and unspecified notification order are
      other Observer hazards.
    ref: concepts.md#observer
  - id: dp-behavioral-025
    difficulty: beginner
    tags: [state, intent]
    question: |
      Which pattern lets an object alter its behavior when its internal state
      changes, so it appears to change its class?
    options:
      - Strategy
      - Template Method
      - Memento
      - State
    answer: 3
    explanation: |
      State extracts each state into its own class; the context delegates to the
      current state object, so behavior changes as the state changes.
    ref: concepts.md#state
  - id: dp-behavioral-026
    difficulty: intermediate
    tags: [state, conditionals, benefit]
    question: |
      What code smell does the State pattern most directly eliminate?
    options:
      - Deeply nested inheritance hierarchies that fan out into many fragile subclasses
      - Excessive use of mutable global variables shared across unrelated modules
      - Large multi-branch conditionals (switch/if-else) on a status field, duplicated across methods
      - Tight coupling between a subject and the many observers that listen to it
    answer: 2
    explanation: |
      State replaces sprawling state-dependent conditionals with polymorphism — the
      current state object is the behavior, and each state lives in its own class.
    ref: concepts.md#state
  - id: dp-behavioral-027
    difficulty: expert
    tags: [state, strategy, vs, probe]
    question: |
      State and Strategy share almost identical UML. What is the real difference?
    options:
      - State is stateless and client-chosen; Strategy transitions itself between algorithms
      - State transitions itself between states (state-aware); Strategy is a client-chosen, stateless, interchangeable algorithm with no transitions
      - State relies purely on class inheritance, while Strategy dispatches through a central message broker
      - There is no real difference; the two names are fully interchangeable in every catalog
    answer: 1
    explanation: |
      In State the object transitions itself between states and states are aware of
      transitions; in Strategy the client injects a stateless algorithm and strategies
      never switch to one another.
    ref: concepts.md#state
  - id: dp-behavioral-028
    difficulty: beginner
    tags: [strategy, intent]
    question: |
      Which pattern defines a family of interchangeable algorithms, encapsulates
      each, and makes them swappable at runtime?
    options:
      - Strategy
      - Command
      - Visitor
      - Observer
    answer: 0
    explanation: |
      Strategy encapsulates each algorithm behind a common interface so the context
      can delegate to whichever concrete strategy the client injects.
    ref: concepts.md#strategy
  - id: dp-behavioral-029
    difficulty: intermediate
    tags: [strategy, trade-offs]
    question: |
      What is a genuine downside of the Strategy pattern?
    options:
      - Algorithms are frozen once injected and can never be swapped again for the context's lifetime
      - The client must know the available strategies to choose one, and there is added indirection/objects
      - It always requires multiple inheritance, which most mainstream host languages forbid outright
      - It couples every concrete algorithm directly to every other algorithm in the same family
    answer: 1
    explanation: |
      The client is responsible for selecting and injecting the right strategy, and
      the pattern adds objects and indirection — over-engineering for a single trivial
      algorithm.
    ref: concepts.md#strategy
  - id: dp-behavioral-030
    difficulty: intermediate
    tags: [strategy, library, comparator]
    question: |
      Which Java API is a canonical example of the Strategy pattern?
    options:
      - java.util.Comparator passed to Collections.sort
      - java.lang.Runnable
      - java.util.Iterator
      - java.io.InputStream
    answer: 0
    explanation: |
      A Comparator is an interchangeable ordering algorithm injected into
      Collections.sort — a textbook Strategy. Runnable is Command, Iterator is
      Iterator, InputStream is Template Method.
    ref: concepts.md#strategy
  - id: dp-behavioral-031
    difficulty: beginner
    tags: [template-method, intent]
    question: |
      Which pattern defines the skeleton of an algorithm in a base method and defers
      specific steps to subclasses?
    options:
      - Strategy
      - State
      - Template Method
      - Mediator
    answer: 2
    explanation: |
      Template Method fixes the invariant algorithm structure in a base method and
      lets subclasses redefine specific primitive steps without changing the structure.
    ref: concepts.md#template-method
  - id: dp-behavioral-032
    difficulty: intermediate
    tags: [template-method, hollywood]
    question: |
      The Template Method pattern is an expression of which principle?
    options:
      - The Single Instance Principle, which mandates exactly one shared object per class
      - The Law of Demeter, which limits each unit to talking only to its immediate collaborators
      - The Open Broker Principle, which routes every subclass call through a central dispatcher
      - The Hollywood Principle — "don't call us, we'll call you"
    answer: 3
    explanation: |
      The base class controls the flow and calls down into subclass steps (inverted
      control), which is the Hollywood Principle: "don't call us, we'll call you."
    ref: concepts.md#template-method
  - id: dp-behavioral-033
    difficulty: advanced
    tags: [template-method, strategy, vs]
    question: |
      What is the core difference between Template Method and Strategy?
    options:
      - Template Method swaps the whole algorithm at runtime; Strategy fixes steps at compile time
      - They are effectively identical except that Strategy is the older, original GoF formulation
      - Template Method uses inheritance to vary steps (compile-time); Strategy uses composition to swap the whole algorithm (runtime)
      - Template Method requires a central message broker to invoke its steps, whereas Strategy does not
    answer: 2
    explanation: |
      Template Method varies individual steps via subclassing (bound at compile time);
      Strategy swaps the entire algorithm via composition/delegation (bound at runtime).
    ref: concepts.md#template-method
  - id: dp-behavioral-034
    difficulty: advanced
    tags: [template-method, factory-method, vs]
    question: |
      How does Factory Method relate to Template Method?
    options:
      - Factory Method is entirely unrelated to Template Method and shares none of its structure
      - Factory Method is itself a specialization of Template Method whose overridable step is "create an object"
      - Template Method is instead a specialization of Factory Method dedicated to varying algorithms
      - Both are structural patterns concerned with how classes are composed into larger structures
    answer: 1
    explanation: |
      Factory Method is a Template Method whose deferred step is object creation —
      subclasses override the creation step within a fixed algorithm skeleton.
    ref: concepts.md#template-method
  - id: dp-behavioral-035
    difficulty: beginner
    tags: [visitor, intent]
    question: |
      Which pattern lets you add new operations to an object structure without
      changing the element classes?
    options:
      - Visitor
      - Iterator
      - Composite
      - Strategy
    answer: 0
    explanation: |
      Visitor represents an operation to perform on the elements of an object
      structure; new operations are added as new visitor classes, leaving the element
      classes untouched.
    ref: concepts.md#visitor
  - id: dp-behavioral-036
    difficulty: expert
    tags: [visitor, double-dispatch, probe]
    question: |
      How does the Visitor pattern achieve double dispatch?
    options:
      - By using a single visit method with a giant switch statement branching on the element's runtime type
      - By registering every visitor with a central broker that inspects types and routes each call
      - By relying on compile-time operator overloading resolved statically from the declared types
      - element.accept(visitor) dispatches on element type, then visitor.visit(this) dispatches on visitor type
    answer: 3
    explanation: |
      The operation is selected by both runtime types: accept() dispatches on the
      element's type, and the visit() overload it calls dispatches on the visitor's
      type — double dispatch.
    ref: concepts.md#visitor
  - id: dp-behavioral-037
    difficulty: expert
    tags: [visitor, expression-problem, trade-offs]
    question: |
      Which statement captures Visitor's key trade-off (the Expression Problem)?
    options:
      - Adding a new element type is easy, but adding a new operation is hard
      - Both new operations and new element types are equally easy to add, so Visitor imposes no asymmetry
      - Neither new operations nor new element types can be added once the object structure has been defined
      - Adding a new operation is easy (new visitor), but adding a new element type is hard (every visitor must change)
    answer: 3
    explanation: |
      Visitor flips the usual OO trade-off: operations become easy to add (a new
      visitor) while new element types are hard (every existing visitor needs a new
      visit overload).
    ref: concepts.md#visitor
  - id: dp-behavioral-038
    difficulty: advanced
    tags: [visitor, trade-offs, encapsulation]
    question: |
      Besides the difficulty of adding element types, what is another common
      criticism of the Visitor pattern?
    options:
      - Visitors often need access to element internals, breaching encapsulation
      - It cannot accumulate state across a traversal of the structure
      - It can only visit a single element and never an entire structure
      - It requires every element in the structure to be fully immutable
    answer: 0
    explanation: |
      To do useful work, visitors frequently need access to element internals, which
      can force elements to expose more than they otherwise would. The accept()
      plumbing is also boilerplate.
    ref: concepts.md#visitor
  - id: dp-behavioral-039
    difficulty: beginner
    tags: [null-object, intent]
    question: |
      Which pattern provides a do-nothing object with neutral behavior instead of a
      null reference?
    options:
      - Special Case
      - Null Object
      - Memento
      - Proxy
    answer: 1
    explanation: |
      Null Object returns an object implementing the expected interface whose methods
      are safe no-ops or neutral defaults, so callers avoid null checks.
    ref: concepts.md#null-object
  - id: dp-behavioral-040
    difficulty: intermediate
    tags: [null-object, trade-offs, gotcha]
    question: |
      What is the main danger of using a Null Object?
    options:
      - It always throws a NullPointerException on the first method call
      - It forces every caller to keep adding explicit null checks
      - It can silently hide real errors that should have failed loudly
      - It cannot implement the interface its callers actually expect
    answer: 2
    explanation: |
      Because the null object silently does nothing, a bug that should surface as a
      loud failure can be swallowed — it is the wrong choice when absence must be
      handled explicitly.
    ref: concepts.md#null-object
  - id: dp-behavioral-041
    difficulty: advanced
    tags: [null-object, special-case, vs]
    question: |
      How does Null Object relate to Fowler's Special Case pattern?
    options:
      - Null Object is the specific Special Case whose behavior is "nothing"; Special Case is the broader pattern that may return meaningful defaults
      - They are entirely unrelated patterns that share no conceptual overlap and were introduced by different authors for different problems
      - Special Case is the narrow do-nothing variant of Null Object, while Null Object is the broader family that returns meaningful defaults
      - Special Case only applies to rows returned from a relational database query and never to in-memory domain objects
    answer: 0
    explanation: |
      Special Case is the general pattern of a subclass for a particular case (e.g.
      UnknownCustomer) that may supply meaningful defaults; Null Object is the special
      case whose behavior is simply no-op.
    ref: concepts.md#null-object
  - id: dp-behavioral-042
    difficulty: intermediate
    tags: [publish-subscribe, intent]
    question: |
      Which pattern inserts a broker/event channel between event producers and
      consumers so neither knows the other?
    options:
      - Observer
      - Mediator
      - Chain of Responsibility
      - Publish/Subscribe (Event Aggregator)
    answer: 3
    explanation: |
      Publish/Subscribe decouples publishers from subscribers via an intermediary
      channel/broker, enabling spatial, temporal, and synchronization decoupling.
    ref: concepts.md#publishsubscribe-event-aggregator
  - id: dp-behavioral-043
    difficulty: expert
    tags: [publish-subscribe, observer, vs, probe]
    question: |
      What is the canonical difference between Observer and Publish/Subscribe?
    options:
      - Observer routes updates through a message broker, while Pub/Sub subscribers hold direct references to each publisher
      - They are identical in every respect; both are just alternate GoF names for the same subject-and-observer mechanism
      - Observer holds direct references and notifies synchronously in-process; Pub/Sub inserts a broker enabling async, cross-process, decoupled fan-out
      - Observer notifications are always asynchronous and cross-process, whereas Pub/Sub delivery is strictly synchronous and in-process
    answer: 2
    explanation: |
      In Observer the subject directly references and synchronously notifies its
      observers; in Pub/Sub a broker/channel sits between anonymous publishers and
      subscribers, allowing async and cross-process delivery.
    ref: concepts.md#publishsubscribe-event-aggregator
  - id: dp-behavioral-044
    difficulty: advanced
    tags: [publish-subscribe, trade-offs]
    question: |
      Which is a genuine downside of Publish/Subscribe compared to a direct Observer?
    options:
      - It tightly couples producers directly to their consumers, defeating the decoupling a direct Observer already provides
      - Loss of end-to-end visibility and harder debugging; delivery/ordering guarantees depend on the broker
      - It structurally cannot fan a single event out to more than one subscriber at a time
      - It only works within a single thread and cannot deliver events across process or machine boundaries
    answer: 1
    explanation: |
      Full decoupling costs visibility: it is hard to see who consumes what, ordering
      and delivery semantics depend on the broker, and the broker is infrastructure
      that can be a bottleneck or SPOF.
    ref: concepts.md#publishsubscribe-event-aggregator
  - id: dp-behavioral-045
    difficulty: intermediate
    tags: [specification, intent]
    question: |
      Which pattern encapsulates a business rule as a predicate object that can be
      combined with and/or/not and reused?
    options:
      - Strategy
      - Specification
      - Interpreter
      - Command
    answer: 1
    explanation: |
      Specification wraps a rule as an object with isSatisfiedBy(candidate) and
      composes rules via and/or/not, reusing the same predicate for validation,
      selection, and query building.
    ref: concepts.md#specification
  - id: dp-behavioral-046
    difficulty: advanced
    tags: [specification, strategy, vs]
    question: |
      How does Specification differ from Strategy?
    options:
      - Specification performs an algorithm to compute a result, while Strategy merely answers a composable boolean question
      - They are the same pattern under two different names, both wrapping an interchangeable rule behind one interface
      - Specification answers a boolean "does X satisfy this rule?"; Strategy performs an algorithm and computes a result
      - Specification must be built with class inheritance, whereas Strategy can only be wired through a central message broker
    answer: 2
    explanation: |
      A Specification answers a boolean question and is composable via and/or/not; a
      Strategy performs an algorithm to compute a result.
    ref: concepts.md#specification
  - id: dp-behavioral-047
    difficulty: intermediate
    tags: [scenario, strategy, which-pattern]
    question: |
      You must support several pluggable compression algorithms chosen by the client
      at runtime, with no transitions between them and no undo. Which pattern fits best?
    options:
      - State
      - Command
      - Memento
      - Strategy
    answer: 3
    explanation: |
      Interchangeable, client-selected, stateless algorithms with no self-transition
      and no undo/queue point squarely at Strategy (State transitions itself; Command
      reifies an undoable request).
    ref: concepts.md#strategy
  - id: dp-behavioral-048
    difficulty: advanced
    tags: [scenario, state, which-pattern]
    question: |
      An order object behaves differently when Pending, Paid, Shipped, or Delivered,
      and it moves itself between these based on events. Which pattern fits best?
    options:
      - State, because behavior depends on an internal mode and the object transitions itself
      - Strategy, because the four behaviors are client-injected interchangeable algorithms with no self-transitions
      - Template Method, because the processing steps are fixed and only individual steps vary by subclass
      - Observer, because the order's dependents must be notified automatically whenever its status changes
    answer: 0
    explanation: |
      Behavior varies by internal mode and the object drives its own transitions —
      the defining traits of State. Strategy has no self-transitions.
    ref: concepts.md#state
  - id: dp-behavioral-049
    difficulty: advanced
    tags: [scenario, template-method, which-pattern]
    question: |
      Several data-import jobs share the exact same steps (open, read, transform,
      write, close) but differ only in how they parse. Which pattern fits best?
    options:
      - Strategy
      - Visitor
      - Template Method
      - Chain of Responsibility
    answer: 2
    explanation: |
      A fixed algorithm skeleton with a few varying steps supplied by subclasses is
      the definition of Template Method.
    ref: concepts.md#template-method
  - id: dp-behavioral-050
    difficulty: advanced
    tags: [scenario, visitor, which-pattern]
    question: |
      You have a stable AST of node types and keep needing new operations (evaluate,
      type-check, pretty-print) without editing the node classes. Which pattern fits?
    options:
      - Visitor
      - Iterator
      - Interpreter
      - Mediator
    answer: 0
    explanation: |
      A stable element hierarchy plus frequently-added operations is the ideal case
      for Visitor, which adds each operation as a new visitor via double dispatch.
    ref: concepts.md#visitor
  - id: dp-behavioral-051
    difficulty: intermediate
    tags: [scenario, command, which-pattern]
    question: |
      You need to queue user actions, log them for replay after a crash, and support
      undo. Which pattern is the natural fit?
    options:
      - Strategy
      - Command
      - Observer
      - Specification
    answer: 1
    explanation: |
      Reifying each action as an object with execute()/undo() enables queuing,
      logging/replay, and undo — the Command pattern.
    ref: concepts.md#command
  - id: dp-behavioral-052
    difficulty: expert
    tags: [at-a-glance, axis-of-change, comparison]
    question: |
      Using the "what varies?" lens, which mapping is correct?
    options:
      - Strategy varies how a collection is traversed, while Iterator varies which interchangeable algorithm the context runs
      - Observer varies the algorithm a context executes, while State varies the request object that gets passed around
      - Command varies who talks to whom in a colleague web, while Mediator varies the request that is encapsulated as an object
      - Template Method varies individual steps of a fixed algorithm; Visitor varies the operations over a stable structure
    answer: 3
    explanation: |
      Template Method isolates varying steps of a fixed skeleton; Visitor isolates
      the operations applied to a stable object structure. That axis-of-change lens
      is the fastest way to choose a behavioral pattern.
    ref: concepts.md#behavioral-patterns-at-a-glance
  - id: dp-behavioral-053
    difficulty: advanced
    tags: [probes, observer, mediator, pubsub]
    question: |
      Which trio correctly characterizes the communication topology of Observer,
      Mediator, and Publish/Subscribe?
    options:
      - Observer = broker-mediated routing; Mediator = one-way broadcast; Pub/Sub = bidirectional coordination hub
      - All three are fully decoupled brokers routing events between anonymous producers and consumers
      - Observer and Mediator both deliver asynchronously across processes, while Pub/Sub is strictly synchronous
      - Observer = one-directional broadcast; Mediator = bidirectional coordination hub; Pub/Sub = decoupled broker
    answer: 3
    explanation: |
      Observer broadcasts one-directionally from a subject; Mediator coordinates known
      peers bidirectionally with rules; Pub/Sub routes events through a broker between
      anonymous producers and consumers.
    ref: concepts.md#canonical-interview-probes
  - id: dp-behavioral-054
    difficulty: expert
    tags: [probes, strategy, state, template-method]
    question: |
      In the Strategy vs. State vs. Template Method comparison, which pattern binds
      its behavior choice at compile time via inheritance?
    options:
      - Strategy
      - Template Method
      - State
      - None of them use inheritance
    answer: 1
    explanation: |
      Template Method uses inheritance and fixes the step choices at compile time.
      Strategy and State both use composition/delegation bound at runtime.
    ref: concepts.md#canonical-interview-probes
  - id: dp-behavioral-055
    difficulty: intermediate
    tags: [cross-reference, concurrency, boundary]
    question: |
      According to this topic's cross-reference note, where are concurrency
      behavioral patterns like Guarded Suspension, Balking, and Reactor covered?
    options:
      - In the dedicated dp-concurrency topic (POSA2)
      - Inline in this behavioral topic, in full detail
      - In the dp-creational topic, grouped with object construction
      - They are not covered anywhere in the repository
    answer: 0
    explanation: |
      Guarded Suspension, Balking, Reactor, and Event Loop are covered in the
      dedicated dp-concurrency topic; this behavioral topic cross-references it rather
      than duplicating that treatment.
    ref: concepts.md#cross-reference-note-distributed--concurrency-contexts
  - id: dp-behavioral-056
    difficulty: advanced
    tags: [interpreter, library, real-world]
    question: |
      Which real-world example best illustrates the Interpreter pattern?
    options:
      - java.util.Comparator injected into Collections.sort to define a custom ordering
      - java.lang.Runnable submitted to a fixed-size ExecutorService thread pool
      - Regular-expression engines and expression/SQL evaluators (e.g. SpEL, java.util.regex)
      - java.util.Iterator walking a list one element at a time via hasNext/next
    answer: 2
    explanation: |
      Regex engines, SQL/expression evaluators, and Spring Expression Language parse
      a grammar and evaluate sentences of it — classic Interpreter territory.
    ref: concepts.md#interpreter
