topic: 'Cloud Application Architectures: Components & Coupling'
domain: system-design
topic_slug: ccp-architecture-components-coupling
version: 1
questions:
- id: ccp-architecture-components-coupling-001
  difficulty: beginner
  tags:
  - loose-coupling
  - broker
  - intent
  question: |
    In the Cloud Computing Patterns catalogue, which pattern's intent is to minimize
    dependencies between distributed applications and between the components within one
    application?
  options:
  - Distributed Application
  - Stateless Component
  - Loose Coupling
  - Data Access Component
  answer: 2
  explanation: |
    Loose Coupling addresses "How can dependencies between distributed applications and
    between the components within them be minimized?" It does so by routing communication
    through an intermediary/broker that hides partners' assumptions about each other.
  ref: concepts.md#loose-coupling
- id: ccp-architecture-components-coupling-002
  difficulty: beginner
  tags:
  - loose-coupling
  - broker
  - solution
  question: |
    What is the core mechanism of the Loose Coupling pattern?
  options:
  - Replicating every component across every availability zone and region so single node failures are masked
  - Routing communication through an intermediary that encapsulates the assumptions partners would otherwise
    make about each other
  - Storing all application and session state in one shared relational database that every component reads and writes
  - Bundling the consume, process, and write steps into one distributed transaction so partners commit or roll back together
  answer: 1
  explanation: |
    Loose Coupling inserts a broker/intermediary between communication partners. The broker
    encapsulates assumptions about location, platform, timing (availability), and data format,
    so each side can scale, evolve, and recover independently.
  ref: concepts.md#loose-coupling
- id: ccp-architecture-components-coupling-003
  difficulty: intermediate
  tags:
  - loose-coupling
  - modern-equivalent
  - cross-cloud
  question: |
    Which set of technologies are the modern, cross-cloud realizations of the Loose Coupling
    broker between components?
  options:
  - ALB, Azure Load Balancer, and GCP Load Balancer
  - DynamoDB, Cosmos DB, and Cloud Spanner
  - CloudFront, Azure CDN, and Cloud CDN
  - SQS/SNS, Azure Service Bus, Google Pub/Sub, and Kafka
  answer: 3
  explanation: |
    Loose Coupling is most often realized with asynchronous messaging intermediaries: message
    brokers/queues and event buses. Load balancers, databases, and CDNs are not the coupling
    broker between application components.
  ref: concepts.md#loose-coupling
- id: ccp-architecture-components-coupling-004
  difficulty: intermediate
  tags:
  - loose-coupling
  - trade-offs
  question: |
    A team introduces a message broker between two components that in fact form a single
    atomic transactional unit (both must commit or neither). What is the main downside of
    loosely coupling them anyway?
  options:
  - It introduces asynchrony and eventual consistency where an atomic, immediate commit was actually required
  - The broker encrypts the channel so throughput rises but the transaction becomes vulnerable to replay attacks
  - It forces both components to become stateful and pin their session data to a single fixed instance
  - It prevents horizontal scaling of either component because the queue serializes all traffic onto one consumer
  answer: 0
  explanation: |
    Loose Coupling adds latency and eventual consistency. If two components are truly one
    transactional unit, brokering them breaks the atomicity you need. Loose coupling is for
    independently evolvable/scalable parts, not for splitting a single transaction.
  ref: concepts.md#loose-coupling
- id: ccp-architecture-components-coupling-005
  difficulty: beginner
  tags:
  - distributed-application
  - intent
  question: |
    Which pattern answers "How can application functionality be decomposed to be handled by
    separate application components?"
  options:
  - Loose Coupling
  - Processing Component
  - Distributed Application
  - Stateless Component
  answer: 2
  explanation: |
    Distributed Application is the umbrella pattern: split functionality into independent
    components (logical decomposition) grouped into tiers (physical grouping) to exploit the
    scale-out, redundant nature of cloud environments.
  ref: concepts.md#distributed-application
- id: ccp-architecture-components-coupling-006
  difficulty: intermediate
  tags:
  - distributed-application
  - decomposition-styles
  question: |
    The Distributed Application pattern describes three decomposition styles. Which one is
    data-centric, with each "filter" transforming input to output and filters interconnected
    by "pipes" (messaging)?
  options:
  - Layer-based decomposition
  - Process-based decomposition
  - Tier-based decomposition
  - Pipes-and-filters-based decomposition
  answer: 3
  explanation: |
    Pipes-and-filters targets data-centric processing: each filter performs a function on input
    to produce output, and filters are connected by pipes (messaging). Layer-based uses logical
    layers; process-based organizes around business processes.
  ref: concepts.md#distributed-application
- id: ccp-architecture-components-coupling-007
  difficulty: intermediate
  tags:
  - distributed-application
  - tier-vs-layer
  question: |
    In the Distributed Application pattern, how do a "layer" and a "tier" differ?
  options:
  - A layer is a logical responsibility grouping; a tier is a physical deployment grouping (server/cluster)
  - A layer is a physical server grouping; a tier is a logical responsibility grouping
  - They are synonyms used interchangeably in the book, both meaning a physical cluster of redundant servers
  - A layer is always stateless while a tier is always stateful, which is why tiers cannot be scaled out
  answer: 0
  explanation: |
    A layer is a logical grouping of responsibility (e.g. presentation/business/data); a tier is
    a physical deployment grouping such as a server or cluster. Multiple layers may share one
    tier, and one layer may be spread across tiers.
  ref: concepts.md#distributed-application
- id: ccp-architecture-components-coupling-008
  difficulty: advanced
  tags:
  - distributed-application
  - environment-based-availability
  question: |
    Distributed Application is especially motivated by which cloud availability characteristic?
  options:
  - Providers guarantee the availability of each individual IT resource, so single nodes never fail
  - Providers guarantee availability of the whole environment, not of any single IT resource (Environment-based
    Availability)
  - Providers guarantee strict linearizable consistency across all storage tiers, so components never read stale data
  - Providers guarantee zero network latency between components, so remote calls behave exactly like local method calls
  answer: 1
  explanation: |
    Cloud offerings typically guarantee availability of the environment as a whole rather than
    any single resource (Environment-based Availability). Applications must therefore be
    decomposed and spread across many, possibly redundant resources.
  ref: concepts.md#distributed-application
- id: ccp-architecture-components-coupling-009
  difficulty: beginner
  tags:
  - stateless-component
  - intent
  - elasticity
  question: |
    Which pattern's intent is "How can the elasticity and robustness of an application component
    be increased?"
  options:
  - User Interface Component
  - Batch Processing Component
  - Data Abstractor
  - Stateless Component
  answer: 3
  explanation: |
    Stateless Component increases elasticity and robustness by removing internal state, making
    instances interchangeable so they can be added, removed, or replaced without data loss.
  ref: concepts.md#stateless-component
- id: ccp-architecture-components-coupling-010
  difficulty: beginner
  tags:
  - stateless-component
  - solution
  - state-externalization
  question: |
    According to the Stateless Component pattern, where should a component's state live?
  options:
  - Pinned in the instance's local memory for fast access
  - Externally in storage offerings, or passed in with each request
  - In the load balancer's routing table, keyed by client IP so requests return to the same instance
  - Only inside the message broker, which persists each session as a durable queue per user
  answer: 1
  explanation: |
    The pattern keeps components free of internal state: state and configuration are stored
    externally (storage offerings) or provided with every request. This makes instances
    interchangeable and easy to scale/recover.
  ref: concepts.md#stateless-component
- id: ccp-architecture-components-coupling-011
  difficulty: intermediate
  tags:
  - stateless-component
  - why-scaling
  question: |
    Why is statelessness described as the key enabler of horizontal elasticity?
  options:
  - Stateless components use measurably less CPU per request because they skip a session-lookup step on every call
  - Stateless components never need external storage since all their data is derived on the fly from request headers
  - Stateless instances are interchangeable, so any instance can serve any request and instances can be
    added/removed/replaced with no data loss or session drain
  - Stateless components automatically deduplicate messages by hashing each payload before it reaches the handler
  answer: 2
  explanation: |
    Because no session/application state is trapped in an instance, instances become
    interchangeable. A load balancer or elastic queue can freely distribute work, and failed
    instances can be replaced without losing state.
  ref: concepts.md#stateless-component
- id: ccp-architecture-components-coupling-012
  difficulty: intermediate
  tags:
  - stateless-component
  - modern-equivalent
  question: |
    Which practice is a modern realization of the Stateless Component pattern?
  options:
  - Keeping session state in JWT/cookie tokens or an external store (Redis/DynamoDB) so app instances
    hold no session state
  - Storing session data in server-side memory and pinning each user to one instance via sticky-session cookies
  - Running a single large vertically-scaled instance so all session state stays resident in one process's heap
  - Bundling the queue read and delete into one transaction so session updates commit atomically with the message
  answer: 0
  explanation: |
    12-factor "stateless processes", JWT/cookie session tokens, and external session stores
    (Redis/ElastiCache, DynamoDB) all push state out of the instance. Sticky sessions are the
    opposite (they bind state to an instance).
  ref: concepts.md#stateless-component
- id: ccp-architecture-components-coupling-013
  difficulty: advanced
  tags:
  - stateless-component
  - stateful-component
  - trade-offs
  question: |
    A workload maintains large in-memory game state per session that cannot practically be
    externalized on every request. Which is the most honest pattern-level guidance?
  options:
  - Force it stateless regardless, accepting a full external-storage round-trip on every keystroke to keep instances interchangeable
  - It is inherently stateful; deliberately confine and replicate state as a Stateful Component rather
    than pretending it is stateless
  - Use a Data Abstractor to hide the state behind approximate values so consumers never see the exact game position
  - Use a Batch Processing Component to defer all state writes until off-peak hours when capacity is cheapest
  answer: 1
  explanation: |
    Statelessness is preferred but not always feasible. For inherently stateful workloads the
    pattern language offers the Stateful Component: confine and replicate state deliberately
    rather than forcing an impractical externalization.
  ref: concepts.md#stateless-component
- id: ccp-architecture-components-coupling-014
  difficulty: beginner
  tags:
  - user-interface-component
  - intent
  question: |
    Which pattern covers a component "accessed interactively by humans while being configurable
    and decoupled from the rest of the application"?
  options:
  - Processing Component
  - Data Access Component
  - User Interface Component
  - Idempotent Processor
  answer: 2
  explanation: |
    The User Interface Component handles synchronous, human-driven interaction while staying
    stateless and decoupled from the back end.
  ref: concepts.md#user-interface-component
- id: ccp-architecture-components-coupling-015
  difficulty: intermediate
  tags:
  - user-interface-component
  - sync-to-async
  question: |
    How does a User Interface Component support loose coupling with the rest of the application?
  options:
  - By calling back-end components synchronously and blocking each request thread until every downstream reply arrives
  - By storing all business logic in the browser so the back end is reduced to a thin static file server
  - By sharing a single database transaction with the processing tier so both commit their writes together
  - By translating the user's synchronous interactions into asynchronous messaging with the rest of the
    application
  answer: 3
  explanation: |
    The UI component acts as an intermediary that converts synchronous human interactions into
    asynchronous messages to the back end, keeping the UI decoupled and independently scalable.
  ref: concepts.md#user-interface-component
- id: ccp-architecture-components-coupling-016
  difficulty: intermediate
  tags:
  - user-interface-component
  - scaling
  question: |
    What drives the scaling of a User Interface Component, and how?
  options:
  - The volume of incoming synchronous requests, fronted by an Elastic Load Balancer
  - Queue depth, adding instances via an Elastic Queue as the backlog of pending messages grows
  - The number of rows in the database, scaling up as the persisted data set grows past size thresholds
  - A fixed nightly schedule that provisions a preset instance count regardless of live traffic
  answer: 0
  explanation: |
    Because UI traffic is synchronous and human-driven, the UI component scales on incoming
    request volume behind an Elastic Load Balancer. (Contrast the Processing Component, which
    scales on queue depth via an Elastic Queue.)
  ref: concepts.md#user-interface-component
- id: ccp-architecture-components-coupling-017
  difficulty: advanced
  tags:
  - user-interface-component
  - stateless
  - session
  question: |
    To keep a User Interface Component stateless, where does the pattern say session state
    should be kept?
  options:
  - In sticky server-side sessions bound to each UI instance and kept alive by IP-based load-balancer affinity
  - In the Elastic Queue as per-message metadata, so each queued request carries the whole session with it
  - Attached to requests, stored on the user's device, or held in external storage
  - In the Data Abstractor's approximation cache, which keeps a fuzzy copy of each user's session for fast reads
  answer: 2
  explanation: |
    Statelessness is preserved by attaching session state to requests, storing it on the user's
    device (cookies/local storage), or externalizing it. That keeps UI instances interchangeable
    behind the load balancer.
  ref: concepts.md#user-interface-component
- id: ccp-architecture-components-coupling-018
  difficulty: beginner
  tags:
  - processing-component
  - intent
  question: |
    Which pattern's intent is scaling processing out elastically among distributed resources
    while remaining configurable regarding the functions it supports?
  options:
  - Batch Processing Component
  - Data Access Component
  - Transaction-based Processor
  - Processing Component
  answer: 3
  explanation: |
    The Processing Component divides processing into discrete, independently scalable function
    blocks, each built stateless and configurable to meet different customers' requirements.
  ref: concepts.md#processing-component
- id: ccp-architecture-components-coupling-019
  difficulty: intermediate
  tags:
  - processing-component
  - elastic-queue
  - scaling
  question: |
    In the Processing Component pattern, what mechanism manages elastic scaling of the
    processing instances?
  options:
  - An Elastic Queue reacting to queue depth
  - An Elastic Load Balancer reacting to synchronous request rate
  - A cron schedule that fires at preset clock times
  - A distributed transaction coordinator committing each batch
  answer: 0
  explanation: |
    A Processing Component is called asynchronously and scaled by an Elastic Queue: the number
    of instances tracks the number of queued requests. Load-balancer-driven scaling is the
    UI Component's model.
  ref: concepts.md#processing-component
- id: ccp-architecture-components-coupling-020
  difficulty: advanced
  tags:
  - processing-component
  - user-interface-component
  - distinction
  question: |
    What is the cleanest distinction between how a User Interface Component and a Processing
    Component scale?
  options:
  - UI scales on asynchronous queue depth via an Elastic Queue; Processing scales on synchronous request
    rate behind a load balancer
  - UI scales on synchronous request rate via a load balancer; Processing scales on asynchronous queue
    depth via an Elastic Queue
  - The UI Component is inherently stateful and instance-pinned; the Processing Component is stateless
  - The UI Component relies on distributed transactions; the Processing Component relies on timeouts
  answer: 1
  explanation: |
    Both are stateless, but their scaling triggers differ: the UI faces synchronous traffic and
    scales behind a load balancer, while the Processing Component consumes asynchronous work and
    scales on queue depth via an Elastic Queue.
  ref: concepts.md#processing-component
- id: ccp-architecture-components-coupling-021
  difficulty: intermediate
  tags:
  - processing-component
  - modern-equivalent
  question: |
    Which modern setup best illustrates the Processing Component pattern?
  options:
  - A web front-end behind an Application Load Balancer
  - A CDN edge cache serving static assets
  - A relational database with read replicas
  - Queue-triggered workers (e.g. Lambda/Functions on SQS/Service-Bus/Pub-Sub, or Kubernetes workers scaled
    by KEDA on queue length)
  answer: 3
  explanation: |
    Queue-triggered, independently scalable, stateless workers are the modern Processing
    Component: serverless functions on queue triggers, or container workers auto-scaled on
    queue depth (e.g. KEDA).
  ref: concepts.md#processing-component
- id: ccp-architecture-components-coupling-022
  difficulty: beginner
  tags:
  - batch-processing-component
  - intent
  question: |
    Which pattern answers "How can asynchronous processing requests be delayed so they are
    handled when conditions for their processing are optimal?"
  options:
  - Processing Component
  - Batch Processing Component
  - Timeout-based Message Processor
  - Data Abstractor
  answer: 1
  explanation: |
    The Batch Processing Component accepts requests as they arrive but holds them until timing
    is favorable, then spins up to drain the accumulated work.
  ref: concepts.md#batch-processing-component
- id: ccp-architecture-components-coupling-023
  difficulty: intermediate
  tags:
  - batch-processing-component
  - solution
  - max-delay
  question: |
    In the Batch Processing Component pattern, when does the system finally process a request
    even under sub-optimal conditions?
  options:
  - Only when the request cannot be delayed any longer
  - Immediately upon arrival, since the pattern only reorders requests but never delays their execution
  - Only once the backing database reports zero active connections and an idle CPU for a full minute
  - Never under sub-optimal conditions; requests that miss the optimal window are silently discarded
  answer: 0
  explanation: |
    The component defers work based on accumulated request count, environmental factors, and
    configurable rules, but processes under less-than-ideal conditions once a request cannot be
    delayed any longer, so it is not held indefinitely.
  ref: concepts.md#batch-processing-component
- id: ccp-architecture-components-coupling-024
  difficulty: intermediate
  tags:
  - batch-processing-component
  - trade-offs
  - selection
  question: |
    A media platform needs to transcode uploaded videos. Cost matters more than immediacy, and
    transcoding can wait for cheap capacity. Which pattern fits best?
  options:
  - User Interface Component
  - Data Abstractor
  - Batch Processing Component
  - Transaction-based Processor
  answer: 2
  explanation: |
    Non-urgent, bulk, cost-sensitive work that can trade latency for efficiency is the classic
    Batch Processing Component use case (e.g. running on cheap/spot capacity or accumulation
    triggers).
  ref: concepts.md#batch-processing-component
- id: ccp-architecture-components-coupling-025
  difficulty: advanced
  tags:
  - batch-processing-component
  - processing-component
  - distinction
  question: |
    What primarily distinguishes a Batch Processing Component from an ordinary Processing
    Component?
  options:
  - The Batch Processing Component deliberately delays work to optimize conditions/cost, whereas the Processing
    Component aims to process requests promptly
  - The Batch Processing Component is inherently stateful and instance-pinned, whereas the Processing Component is stateless
  - The Batch Processing Component scales behind a load balancer, whereas the Processing Component is fed by a queue
  - The Batch Processing Component guarantees exactly-once delivery, whereas the Processing Component is only at-least-once
  answer: 0
  explanation: |
    Both are async, queue-fed, stateless workers. The difference is timing intent: batch
    deliberately delays for optimal/cheap conditions, trading latency for efficiency, while a
    normal Processing Component targets prompt handling.
  ref: concepts.md#batch-processing-component
- id: ccp-architecture-components-coupling-026
  difficulty: beginner
  tags:
  - data-access-component
  - intent
  question: |
    Which pattern hides and isolates the complexity of data storage (access protocols and
    consistency) behind a single consistent interface?
  options:
  - Data Abstractor
  - Data Access Component
  - Stateless Component
  - Loose Coupling
  answer: 1
  explanation: |
    The Data Access Component consolidates and coordinates all data manipulation, presenting one
    consistent interface and isolating other components from storage-specific quirks.
  ref: concepts.md#data-access-component
- id: ccp-architecture-components-coupling-027
  difficulty: intermediate
  tags:
  - data-access-component
  - solution
  - isolation
  question: |
    If the underlying storage offering is swapped for a different one, what does the Data Access
    Component pattern promise?
  options:
  - Every component that reads data must be rewritten to match the new storage protocol and its query dialect
  - The whole application must abandon strong consistency and switch to an eventually consistent access model
  - Every message already handled must be re-fetched and reprocessed to reconcile against the new store
  - Only the Data Access Component changes; the rest of the application is shielded
  answer: 3
  explanation: |
    Because all data manipulation is funneled through one component, a storage swap or interface
    change affects only that component. Other components, coding to its stable interface, are
    unaffected.
  ref: concepts.md#data-access-component
- id: ccp-architecture-components-coupling-028
  difficulty: intermediate
  tags:
  - data-access-component
  - modern-equivalent
  question: |
    Which modern construct most directly embodies the Data Access Component pattern?
  options:
  - A CDN edge node that caches storage responses close to the client for lower read latency
  - An Elastic Load Balancer that spreads data queries evenly across the storage tier's replicas
  - A Repository/DAO layer or data-access module encapsulating all storage interaction
  - A JWT token that carries the caller's data-access scopes signed by the storage service
  answer: 2
  explanation: |
    The Repository/DAO pattern, or a dedicated data-access module/service, centralizes storage
    interaction behind one interface, matching the Data Access Component. (See dp-enterprise-application
    for Repository/DAO depth.)
  ref: concepts.md#data-access-component
- id: ccp-architecture-components-coupling-029
  difficulty: advanced
  tags:
  - data-access-component
  - restricted
  - variant
  question: |
    A variant of the Data Access Component additionally enforces authorization/access policy on
    data. What is it called?
  options:
  - Data Abstractor
  - Restricted Data Access Component
  - Provider Adapter
  - Idempotent Processor
  answer: 1
  explanation: |
    The Restricted Data Access Component extends the Data Access Component by additionally
    enforcing access-control/authorization policy on the data it coordinates.
  ref: concepts.md#data-access-component
- id: ccp-architecture-components-coupling-030
  difficulty: beginner
  tags:
  - data-abstractor
  - intent
  - eventual-consistency
  question: |
    Which pattern presents eventually consistent data so that possible inconsistencies are
    hidden from other components and users?
  options:
  - Data Access Component
  - Transaction-based Processor
  - Data Abstractor
  - Stateless Component
  answer: 2
  explanation: |
    The Data Abstractor changes how data is represented (approximations, trends) so that
    eventually consistent values are acceptable and inconsistencies are hidden.
  ref: concepts.md#data-abstractor
- id: ccp-architecture-components-coupling-031
  difficulty: intermediate
  tags:
  - data-abstractor
  - solution
  - presentation
  question: |
    How does the Data Abstractor hide the fact that the exact consistent value is momentarily
    unknown?
  options:
  - By presenting approximate or generalized values such as progress bars, traffic lights, or increase/decrease
    trends
  - By blocking every read until a quorum confirms the value has become strongly consistent everywhere
  - By synchronously replicating the data to every region first so all reads return an identical exact value
  - By deduplicating incoming messages so each update is applied once and the exact value is always current
  answer: 0
  explanation: |
    Rather than exact figures, the Data Abstractor conveys data via approximations and
    tendencies (progress bars, traffic lights, up/down trends), which stay meaningful even when
    the precise value is not yet consistent.
  ref: concepts.md#data-abstractor
- id: ccp-architecture-components-coupling-032
  difficulty: advanced
  tags:
  - data-abstractor
  - trade-offs
  - why
  question: |
    Why does the Data Abstractor exist instead of just having each component enforce strong
    consistency on eventually consistent storage?
  options:
  - Because strong consistency is forbidden by cloud providers' service contracts and durability guarantees
  - Because eventually consistent reads are always faster than strong reads regardless of the access pattern
  - Because the Data Abstractor deduplicates redundant messages far more cheaply than a consistency layer could
  - Because forcing components to enforce consistency themselves can void the performance and availability
    benefits that eventual consistency provided
  answer: 3
  explanation: |
    The pattern's key insight: if components reinforce consistency on top of eventually
    consistent storage, they sacrifice the very performance/availability gains eventual
    consistency offered. The Data Abstractor instead adapts the presentation.
  ref: concepts.md#data-abstractor
- id: ccp-architecture-components-coupling-033
  difficulty: advanced
  tags:
  - data-abstractor
  - when-not-to-use
  question: |
    For which requirement is the Data Abstractor the wrong choice?
  options:
  - Displaying an approximate follower count on a profile page
  - Rendering an exact, up-to-the-moment bank balance at the point of settlement
  - Showing a 'trending up' indicator for article popularity
  - Showing a fuzzy 'delivery arriving soon' progress bar
  answer: 1
  explanation: |
    The Data Abstractor works only where approximate presentation is acceptable. A precise,
    up-to-the-moment settlement balance is a strict-consistency requirement and cannot be
    abstracted away. Deep dive: cap-theorem-and-consistency.
  ref: concepts.md#data-abstractor
- id: ccp-architecture-components-coupling-034
  difficulty: beginner
  tags:
  - idempotent-processor
  - intent
  question: |
    Which pattern lets a component "cope with message duplicates or data inconsistencies that
    could lead to duplicate function execution"?
  options:
  - Idempotent Processor
  - Transaction-based Processor
  - Timeout-based Message Processor
  - Batch Processing Component
  answer: 0
  explanation: |
    The Idempotent Processor handles duplicate messages (from at-least-once delivery) and stale
    reads (from eventual consistency) so that repeated execution does not corrupt results.
  ref: concepts.md#idempotent-processor
- id: ccp-architecture-components-coupling-035
  difficulty: intermediate
  tags:
  - idempotent-processor
  - two-approaches
  question: |
    The Idempotent Processor offers two approaches to make repeated work harmless. Which pair is
    correct?
  options:
  - Sharding the workload across partitions and replicating each shard to standby nodes
  - Load balancing requests across workers and caching prior results to skip repeated computation
  - Deduplication (detect and discard duplicates) OR idempotent semantics (safe to re-execute)
  - Wrapping each message in a distributed transaction and enforcing a strict acknowledgement timeout
  answer: 2
  explanation: |
    Either detect and filter out duplicate messages/inconsistent data (deduplication), or design
    operations with idempotent semantics so re-execution yields the same result and is harmless.
  ref: concepts.md#idempotent-processor
- id: ccp-architecture-components-coupling-036
  difficulty: intermediate
  tags:
  - idempotent-processor
  - at-least-once
  question: |
    Message-oriented middleware guarantees at-least-once delivery. What does this imply for the
    consumer?
  options:
  - Messages will never be duplicated, so the consumer needs no dedup or idempotency handling at all
  - The consumer must enlist in a distributed XA transaction with the broker to receive each message safely
  - The consumer must acknowledge every message before it begins processing to avoid redelivery
  - The consumer must be idempotent, because the same message can be delivered more than once
  answer: 3
  explanation: |
    At-least-once means duplicates can occur. The classic guidance is that consumers must be
    idempotent (via dedup or idempotent operations) rather than assuming exactly-once delivery.
  ref: concepts.md#idempotent-processor
- id: ccp-architecture-components-coupling-037
  difficulty: advanced
  tags:
  - idempotent-processor
  - modern-equivalent
  - idempotency-key
  question: |
    Which modern technique is a direct realization of the Idempotent Processor?
  options:
  - Sticky load-balancer sessions that pin each client to one worker so every retry lands on the same instance
  - A CDN cache-control header that sets a max-age TTL so duplicate requests are served straight from the edge cache
  - An idempotency key plus a conditional write (e.g. DynamoDB attribute_not_exists) or a dedup table
    of processed message IDs
  - A read replica for reporting that serves analytics queries so the primary is shielded from duplicate read load
  answer: 2
  explanation: |
    Idempotency keys (Stripe-style), conditional/optimistic writes, and processed-ID dedup tables
    all make re-delivery harmless, exactly the Idempotent Processor mechanism.
  ref: concepts.md#idempotent-processor
- id: ccp-architecture-components-coupling-038
  difficulty: advanced
  tags:
  - idempotent-processor
  - eventual-consistency
  - source
  question: |
    Besides duplicate messages, what second source of duplicate function execution does the
    Idempotent Processor address?
  options:
  - Load balancer misconfiguration that forwards each incoming request to two backend targets simultaneously
  - A cron job firing twice because two schedulers share an overlapping trigger window and both dispatch it
  - A user double-clicking a submit button so the browser transmits the identical form request twice in a row
  - Eventual consistency in storage causing a component to read stale data and reprocess a change that
    was already handled
  answer: 3
  explanation: |
    The pattern explicitly covers eventual consistency: a component may read stale data (a change
    already processed is not yet visible) and reprocess it. Idempotency/dedup guards against this
    as well as message duplicates.
  ref: concepts.md#idempotent-processor
- id: ccp-architecture-components-coupling-039
  difficulty: beginner
  tags:
  - transaction-based-processor
  - intent
  question: |
    Which pattern guarantees that every received message is processed successfully and any
    modified data is reliably persisted, by extending the transaction over the processing work?
  options:
  - Timeout-based Message Processor
  - Transaction-based Processor
  - Idempotent Processor
  - Batch Processing Component
  answer: 1
  explanation: |
    The Transaction-based Processor widens the transactional boundary beyond read-and-delete to
    include processing and the resulting data write, so consumption and processing commit or roll
    back together.
  ref: concepts.md#transaction-based-processor
- id: ccp-architecture-components-coupling-040
  difficulty: intermediate
  tags:
  - transaction-based-processor
  - delivery-vs-processing
  question: |
    Why is Transaction-based Delivery alone insufficient, motivating the Transaction-based
    Processor?
  options:
  - Because delivery success only guarantees the message was received, not that it was successfully processed
    and its data persisted
  - Because delivery latency always exceeds processing time, so acknowledgements arrive after the data is written
  - Because delivery invariably produces exactly two copies of every message that the receiver must reconcile later
  - Because delivery cannot proceed at all without a load balancer sitting between the broker and every consumer
  answer: 0
  explanation: |
    Transaction-based Delivery makes read+delete atomic, guaranteeing receipt, but if the
    receiver crashes mid-work the message is already gone and data may be half-written. The
    processor extends the transaction to cover processing itself.
  ref: concepts.md#transaction-based-processor
- id: ccp-architecture-components-coupling-041
  difficulty: advanced
  tags:
  - transaction-based-processor
  - rollback
  question: |
    In a Transaction-based Processor, what happens if processing fails partway through?
  options:
  - The message is deleted from the queue and the half-finished partial data write is committed and kept
  - The transaction rolls back, the message stays in the queue for reprocessing, and data remains consistent
  - The message is sent to the UI Component so a partial-failure notice can be shown to the waiting end user
  - The processor acknowledges the message anyway and simply records an error line in the application log
  answer: 1
  explanation: |
    Consume, process, and write share one transactional context. On failure everything rolls
    back: the message remains in the queue for another attempt and no partial data change
    persists.
  ref: concepts.md#transaction-based-processor
- id: ccp-architecture-components-coupling-042
  difficulty: advanced
  tags:
  - transaction-based-processor
  - outbox
  - modern-equivalent
  question: |
    When a cloud broker cannot join the database's transaction, which modern technique is the
    common substitute that preserves the Transaction-based Processor's guarantee?
  options:
  - Sticky sessions that bind each producer to one broker node so events commit strictly in call order
  - A larger visibility timeout that keeps the message locked long enough for the database commit to finish first
  - A read-through cache that fronts the database so every write and its event publication stay in lockstep
  - The transactional outbox pattern (write the event to an outbox table in the same DB transaction, publish
    separately)
  answer: 3
  explanation: |
    Since distributed transactions across heterogeneous cloud services are often impractical, the
    transactional outbox writes the message/event atomically with the data change, then relays it,
    approximating transactional processing. Deep dive: event-driven-cqrs-saga-cdc.
  ref: concepts.md#transaction-based-processor
- id: ccp-architecture-components-coupling-043
  difficulty: beginner
  tags:
  - timeout-based-message-processor
  - intent
  - at-least-once
  question: |
    Which pattern guarantees that all messages handled by the application are processed
    at-least-once, by delaying acknowledgement until after processing?
  options:
  - Timeout-based Message Processor
  - Transaction-based Processor
  - Idempotent Processor
  - Data Access Component
  answer: 0
  explanation: |
    The Timeout-based Message Processor withholds acknowledgement until processing succeeds,
    using message locking (visibility timeout) so an unacknowledged message reappears for another
    client, guaranteeing at-least-once processing.
  ref: concepts.md#timeout-based-message-processor
- id: ccp-architecture-components-coupling-044
  difficulty: intermediate
  tags:
  - timeout-based-message-processor
  - visibility-timeout
  question: |
    In the Timeout-based Message Processor, what happens if the processing client fails to
    acknowledge before the visibility timeout expires?
  options:
  - The message is permanently deleted from the queue on expiry and treated as successfully processed
  - The transaction rolls back the data write and the broker discards the locked message as unrecoverable
  - The message reappears in the middleware and becomes available for another client to process
  - The message is routed to the UI Component so the originating user can be prompted to resubmit it
  answer: 2
  explanation: |
    On retrieval the message is locked (made invisible) for a timeout. If no ack arrives before
    expiry (crash/stall), the message reappears for another client, ensuring it is not lost.
  ref: concepts.md#timeout-based-message-processor
- id: ccp-architecture-components-coupling-045
  difficulty: advanced
  tags:
  - timeout-based-message-processor
  - idempotency
  - pairing
  question: |
    Why must a Timeout-based Message Processor typically be paired with an Idempotent Processor?
  options:
  - Because the visibility timeout mechanism upgrades delivery to exactly-once, removing any chance of a duplicate
  - Because the load balancer in front of the queue duplicates every message across two workers by design
  - Because the Data Abstractor layer mandates idempotent consumers before it will expose approximate values
  - Because a slow worker can exceed the timeout, causing the message to reappear and be processed more
    than once (at-least-once, not exactly-once)
  answer: 3
  explanation: |
    The timeout mechanism guarantees at-least-once, not exactly-once: a slow but successful worker
    may exceed the timeout, so the message reappears and gets reprocessed. Idempotency makes that
    reprocessing harmless.
  ref: concepts.md#timeout-based-message-processor
- id: ccp-architecture-components-coupling-046
  difficulty: advanced
  tags:
  - timeout-based-message-processor
  - transaction-based-processor
  - distinction
  question: |
    What is the key trade-off between the Timeout-based Message Processor and the
    Transaction-based Processor?
  options:
  - Timeout-based works with plain cloud queues (visibility timeout + delayed ack) but yields at-least-once;
    transaction-based gives exactly-once processing but needs transactional/coordinated resources
  - Timeout-based needs full XA distributed transactions across broker and DB; transaction-based needs only a plain queue
  - Timeout-based must run as a stateful instance-pinned worker; transaction-based is inherently stateless and interchangeable
  - They are identical in their delivery guarantees and only the name differs between the two catalogue entries
  answer: 0
  explanation: |
    Timeout-based relies only on a visibility timeout and delayed ack, so it works with commodity
    queues but is at-least-once (pair with idempotency). Transaction-based shares a transaction
    across consume+process+write for exactly-once processing, but needs resources that can
    participate in a transaction (or the outbox as a substitute).
  ref: concepts.md#timeout-based-message-processor
- id: ccp-architecture-components-coupling-047
  difficulty: intermediate
  tags:
  - timeout-based-message-processor
  - modern-equivalent
  question: |
    Which real cloud consumer behavior directly matches the Timeout-based Message Processor?
  options:
  - A CDN edge node caching a static object for a fixed TTL and revalidating it against the origin on expiry
  - A load balancer round-robining incoming requests evenly across a pool of identical stateless workers
  - An SQS consumer that receives a message (hidden by visibility timeout), processes it, then calls DeleteMessage
    only on success
  - A read replica lagging behind the primary and serving slightly stale rows to offload reporting queries
  answer: 2
  explanation: |
    SQS visibility timeout + delete-on-success, Azure Service Bus peek-lock + complete, and
    Pub/Sub ack-deadline + ack() are all textbook Timeout-based Message Processors: the message
    returns if not acknowledged in time.
  ref: concepts.md#timeout-based-message-processor
- id: ccp-architecture-components-coupling-048
  difficulty: advanced
  tags:
  - selection
  - scenario
  - cross-pattern
  question: |
    An order-processing worker consumes from a plain cloud queue with at-least-once delivery,
    cannot enlist the queue and database in a shared transaction, and must never double-charge a
    customer. Which combination is the pragmatic cloud-native choice?
  options:
  - Transaction-based Processor spanning the queue and the database in one shared XA distributed transaction
  - Timeout-based Message Processor (delayed ack) plus Idempotent Processor (idempotency key / conditional
    write)
  - Batch Processing Component that defers all incoming orders to a nightly window when capacity is cheapest
  - Data Abstractor that presents an approximate, eventually-consistent view of each customer's charge amount
  answer: 1
  explanation: |
    With commodity queues and no shared transaction, use the Timeout-based Message Processor for
    at-least-once processing and make the consumer idempotent (idempotency key / conditional
    write) so retried/duplicate deliveries never double-charge. This is the standard cloud
    pattern.
  ref: concepts.md#idempotent-processor
- id: ccp-architecture-components-coupling-049
  difficulty: intermediate
  tags:
  - selection
  - scenario
  - stateless
  question: |
    A checkout service keeps user sessions in local instance memory, so autoscaling causes
    logouts when instances are added or removed. Which pattern should be applied first?
  options:
  - Data Abstractor to present each user's session as an approximate, eventually-consistent value
  - Stateless Component (externalize session state)
  - Batch Processing Component to defer session writes to an off-peak window and replay them later
  - Transaction-based Processor to commit each session update atomically with the message consumption
  answer: 1
  explanation: |
    Local in-memory sessions defeat elasticity. Applying the Stateless Component pattern, moving
    session state to an external store or request-attached token, makes instances interchangeable
    so autoscaling no longer logs users out.
  ref: concepts.md#stateless-component
- id: ccp-architecture-components-coupling-050
  difficulty: beginner
  tags:
  - distributed-application
  - loose-coupling
  - foundations
  question: |
    Which two patterns together form the foundation of decomposing a cloud application into
    independently scalable, independently evolvable components?
  options:
  - Distributed Application (independent components in tiers) and Loose Coupling (broker between components)
  - Data Abstractor (approximate presentation) and Idempotent Processor (safe re-execution of duplicates)
  - Batch Processing Component (deferred bulk work) and Timeout-based Message Processor (delayed acknowledgement)
  - User Interface Component (synchronous human interaction) and Data Access Component (unified storage interface)
  answer: 0
  explanation: |
    Distributed Application decomposes functionality into independent components/tiers; Loose
    Coupling puts a broker between them so they can scale, evolve, and fail independently. The
    other pairs are more specialized component/processing patterns built on this foundation.
  ref: concepts.md#distributed-application
