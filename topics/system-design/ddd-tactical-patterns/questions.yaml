topic: "Domain-Driven Design: Tactical Patterns"
domain: system-design
topic_slug: ddd-tactical-patterns
version: 1
questions:
  - id: ddd-tactical-patterns-001
    difficulty: beginner
    tags: [entity, identity, fundamentals]
    question: |
      What primarily defines an entity in Domain-Driven Design?
    options:
      - "A continuous identity that persists across changes to its attributes"
      - "The exact set of its current attribute values"
      - "That it is immutable once created"
      - "That it has no behavior, only data"
    answer: 0
    explanation: |
      An entity is defined by a thread of continuity and identity, not by its
      attributes. The same entity remains itself even as its attributes change over
      its lifecycle; two entities with identical attributes are still distinct if
      their identities differ.
    ref: "concepts.md#entities-identity-and-lifecycle"

  - id: ddd-tactical-patterns-002
    difficulty: beginner
    tags: [entity, equality]
    question: |
      How should equality (equals/hashCode) be implemented for a DDD entity?
    options:
      - "By comparing every field"
      - "By reference identity of the JVM object"
      - "Entities should never override equals"
      - "By comparing the identity (id) only"
    answer: 3
    explanation: |
      Entities compare by identity: two entity instances are equal iff they share the
      same id, regardless of other fields. hashCode must derive from the id so the
      object's identity is stable even as its mutable state changes.
    ref: "concepts.md#entities-identity-and-lifecycle"

  - id: ddd-tactical-patterns-003
    difficulty: beginner
    tags: [value-object, immutability]
    question: |
      Which is the best example of a value object?
    options:
      - "A Customer with a customer number"
      - "A BankAccount with an account id"
      - "Money(amount, currency)"
      - "An Order that changes status over time"
    answer: 2
    explanation: |
      Money is defined entirely by its attributes (amount and currency), is immutable,
      and is compared by value — any Money(10, USD) is interchangeable with another.
      Customer, BankAccount, and Order all have identity and a lifecycle, making them
      entities.
    ref: "concepts.md#value-objects-immutable-equality-by-value"

  - id: ddd-tactical-patterns-004
    difficulty: beginner
    tags: [value-object, equality]
    question: |
      How are two value objects compared for equality?
    options:
      - "By an assigned identity"
      - "By creation timestamp"
      - "By all of their attribute values"
      - "By memory address"
    answer: 2
    explanation: |
      Value objects have no identity; they are equal when all their attributes are
      equal. This is why one instance can be freely substituted for another with the
      same values.
    ref: "concepts.md#value-objects-immutable-equality-by-value"

  - id: ddd-tactical-patterns-005
    difficulty: intermediate
    tags: [value-object, immutability, design]
    question: |
      A value object like Money is immutable. How do you model an operation such as
      adding two amounts?
    options:
      - "Mutate the existing instance's internal amount field"
      - "Add a setAmount method used only by the service layer"
      - "Store the running total in a shared static field"
      - "Return a new Money instance representing the result"
    answer: 3
    explanation: |
      Immutable value objects never mutate; operations return a new instance
      (money.plus(other) yields a new Money). This makes them thread-safe, freely
      shareable, and free of aliasing bugs.
    ref: "concepts.md#value-objects-immutable-equality-by-value"

  - id: ddd-tactical-patterns-006
    difficulty: intermediate
    tags: [value-object, invariants]
    question: |
      Why is modeling an email address as an EmailAddress value object (rather than a
      raw String) valuable in a rich domain model?
    options:
      - "Validation is centralized in the type, so every EmailAddress in the system is already valid"
      - "Strings cannot be stored in a database"
      - "It makes the object mutable so it can be corrected in place"
      - "It gives the email an identity for tracking"
    answer: 0
    explanation: |
      A value object validates its invariants in the constructor, so an EmailAddress
      cannot exist in an invalid form. This centralizes a rule that would otherwise be
      duplicated and lets a large amount of domain logic live naturally in the type.
    ref: "concepts.md#value-objects-immutable-equality-by-value"

  - id: ddd-tactical-patterns-007
    difficulty: beginner
    tags: [aggregate, aggregate-root, fundamentals]
    question: |
      In an aggregate, what is the role of the aggregate root?
    options:
      - "It is the only object outside code may reference, and it guards the aggregate's invariants"
      - "It is a database table that stores all child rows"
      - "It is a service that loads the aggregate from disk"
      - "It is the smallest value object in the cluster"
    answer: 0
    explanation: |
      The aggregate root is the single entry point: external references go only to the
      root, and it enforces the invariants of the whole cluster so interior objects
      cannot be put into an invalid state from outside.
    ref: "concepts.md#aggregate-and-aggregate-root"

  - id: ddd-tactical-patterns-008
    difficulty: intermediate
    tags: [aggregate, encapsulation]
    question: |
      Order is an aggregate root containing OrderLine entities. Which access pattern is
      correct?
    options:
      - "External code fetches an OrderLine directly from an OrderLineRepository and edits it"
      - "External code holds a direct reference to an OrderLine and mutates it"
      - "External code references the Order root and modifies lines only through the root's methods"
      - "OrderLine is a separate aggregate root with its own transactions"
    answer: 2
    explanation: |
      Outside references go only to the root. Callers change interior members (order
      lines) exclusively through the root's behavior, which lets the root keep the
      whole aggregate's invariants intact. Interior entities are not directly
      referenced or given their own repository.
    ref: "concepts.md#aggregate-and-aggregate-root"

  - id: ddd-tactical-patterns-009
    difficulty: intermediate
    tags: [aggregate, consistency-boundary]
    question: |
      What does it mean to say an aggregate is a "consistency boundary"?
    options:
      - "Everything outside it is kept strongly consistent, everything inside eventually consistent"
      - "It defines which UI components can render the data"
      - "It is only about how objects are laid out in memory"
      - "Everything inside it is kept immediately consistent within one transaction; outside it is eventually consistent"
    answer: 3
    explanation: |
      The aggregate boundary marks what must be strongly/immediately consistent in a
      single transaction (its interior) versus what may lag (other aggregates,
      reconciled via events). It is fundamentally a decision about consistency, not a
      grouping of "related" objects.
    ref: "concepts.md#aggregate-as-a-consistency-boundary--one-transaction-per-aggregate"

  - id: ddd-tactical-patterns-010
    difficulty: intermediate
    tags: [aggregate, transactions, scalability]
    question: |
      Vernon's rule of thumb is to modify how many aggregate instances per transaction?
    options:
      - "As many as are related in the domain"
      - "Exactly one"
      - "All aggregates touched by the use case"
      - "Two — the root and its parent"
    answer: 1
    explanation: |
      The guideline is to modify only one aggregate instance per transaction. If a use
      case must change more than one aggregate, update one and let the others react in
      separate transactions via domain events (eventual consistency).
    ref: "concepts.md#aggregate-as-a-consistency-boundary--one-transaction-per-aggregate"

  - id: ddd-tactical-patterns-011
    difficulty: advanced
    tags: [aggregate, transactions, scalability]
    question: |
      Which is NOT a reason for the "one aggregate per transaction" guideline?
    options:
      - "Short single-aggregate transactions reduce lock contention and deadlock risk"
      - "Aggregates are the natural unit for sharding and splitting into services"
      - "It forces you to decide what must be atomic vs eventually consistent"
      - "It guarantees the database never needs indexes"
    answer: 3
    explanation: |
      The rule is motivated by contention/locking, distribution (sharding/service
      splits), and clarifying which invariants must be atomic. It has nothing to do
      with database indexing, which remains necessary regardless.
    ref: "concepts.md#aggregate-as-a-consistency-boundary--one-transaction-per-aggregate"

  - id: ddd-tactical-patterns-012
    difficulty: advanced
    tags: [aggregate, domain-events, eventual-consistency, scenario]
    question: |
      A placeOrder operation must both create an Order and decrement Inventory, which
      are separate aggregates. What is the DDD-aligned approach?
    options:
      - "Wrap both aggregate changes in a single ACID transaction"
      - "Merge Order and Inventory into one large aggregate"
      - "Save the Order in one transaction and reserve inventory in a separate transaction, coordinated by a domain event"
      - "Have the Order hold a direct object reference to Inventory and update it inline"
    answer: 2
    explanation: |
      Because Order and Inventory are separate aggregates, you modify one per
      transaction. Order is saved and raises OrderSubmitted; a handler reserves
      inventory in a second transaction. This gives eventual consistency and lets the
      aggregates live in different shards/services later.
    ref: "concepts.md#aggregate-as-a-consistency-boundary--one-transaction-per-aggregate"

  - id: ddd-tactical-patterns-013
    difficulty: intermediate
    tags: [aggregate, references, id]
    question: |
      How should an Order aggregate refer to the Customer it belongs to?
    options:
      - "Store the CustomerId (identity) and load the Customer through its own repository if needed"
      - "Hold a direct Customer object reference for easy navigation"
      - "Embed a full copy of the Customer inside the Order"
      - "Make Customer an interior entity of the Order aggregate"
    answer: 0
    explanation: |
      Other aggregates are referenced by identity, not by object. Storing CustomerId
      keeps the Order small and independently loadable, prevents accidentally loading
      and mutating a second aggregate in the same transaction, and works across shards
      or services.
    ref: "concepts.md#reference-other-aggregates-by-identity-not-by-object"

  - id: ddd-tactical-patterns-014
    difficulty: advanced
    tags: [aggregate, references, orm, jpa]
    question: |
      In JPA, what does the "reference other aggregates by id" rule usually translate
      to?
    options:
      - "Modeling the link as a @ManyToOne association to the other aggregate root"
      - "Using a bidirectional @OneToMany with cascade = ALL"
      - "Eagerly fetching the other aggregate on every load"
      - "Storing the other aggregate's id as a plain field rather than a mapped association"
    answer: 3
    explanation: |
      Direct associations between aggregate roots invite navigation that loads and
      mutates a second aggregate in one transaction and can pull in large object
      graphs. Storing the other aggregate's id as a simple field keeps the boundary
      honest and aggregates independently loadable.
    ref: "concepts.md#reference-other-aggregates-by-identity-not-by-object"

  - id: ddd-tactical-patterns-015
    difficulty: intermediate
    tags: [aggregate, references]
    question: |
      Within its own boundary, how may an aggregate root reference its interior
      entities and value objects?
    options:
      - "Only by id, exactly like external aggregates"
      - "By direct object reference"
      - "It may not reference them at all"
      - "Only through a separate repository"
    answer: 1
    explanation: |
      By-id referencing applies to OTHER aggregates. Inside its own boundary, the root
      holds direct object references to its interior entities and value objects, since
      they load and save together as one unit.
    ref: "concepts.md#reference-other-aggregates-by-identity-not-by-object"

  - id: ddd-tactical-patterns-016
    difficulty: advanced
    tags: [aggregate, small-aggregates, design, scenario]
    question: |
      A team models Customer as an aggregate that holds a collection of ALL that
      customer's Orders. What problem does this most likely cause?
    options:
      - "It is ideal because Customer and Orders are related"
      - "It makes value objects mutable"
      - "Every order edit loads and locks the entire customer graph, causing contention and unbounded growth"
      - "It prevents the Customer from having an identity"
    answer: 2
    explanation: |
      A giant aggregate with an unbounded collection loads a huge graph for any change
      and serializes all order edits behind a lock on the customer. Prefer small
      aggregates: each Order should be its own aggregate referencing customerId.
    ref: "concepts.md#designing-small-aggregates"

  - id: ddd-tactical-patterns-017
    difficulty: intermediate
    tags: [aggregate, small-aggregates, design]
    question: |
      What is the key question to ask when deciding what belongs inside a single
      aggregate?
    options:
      - "Which objects are related in the real world?"
      - "Which objects share a database table?"
      - "Which objects the UI displays together?"
      - "What truly must be consistent within a single transaction?"
    answer: 3
    explanation: |
      Aggregate boundaries are about transactional consistency. Only things that must
      be immediately consistent together belong in one aggregate; mere real-world
      relationships (Customer has Orders) do not justify combining them.
    ref: "concepts.md#designing-small-aggregates"

  - id: ddd-tactical-patterns-018
    difficulty: intermediate
    tags: [aggregate, small-aggregates, smells]
    question: |
      Which is a sign that an aggregate is too big?
    options:
      - "It contains an unbounded collection edited by unrelated use cases"
      - "It enforces a single invariant across a few closely related fields"
      - "It has an identity and a lifecycle"
      - "It references other aggregates by id"
    answer: 0
    explanation: |
      Unbounded collections and fields edited by unrelated use cases (that never need
      each other's data) signal the aggregate is too coarse and should be split. The
      other options describe normal, healthy aggregate characteristics.
    ref: "concepts.md#designing-small-aggregates"

  - id: ddd-tactical-patterns-019
    difficulty: beginner
    tags: [invariants, aggregate]
    question: |
      Where should an aggregate's invariants (business rules that must always hold) be
      enforced?
    options:
      - "In the application service that orchestrates the use case"
      - "Inside the aggregate root, at the point of mutation"
      - "In the database via check constraints only"
      - "In the UI validation layer"
    answer: 1
    explanation: |
      Invariants are enforced inside the aggregate root at the moment of change, so the
      aggregate can never be persisted in an invalid state. Rules that span children
      belong on the root because only it sees all children.
    ref: "concepts.md#invariants-enforced-inside-the-aggregate"

  - id: ddd-tactical-patterns-020
    difficulty: intermediate
    tags: [invariants, encapsulation, design]
    question: |
      Why do rich aggregates expose intention-revealing methods (e.g. order.submit())
      instead of public setters?
    options:
      - "Setters are slower at runtime"
      - "Because setters cannot be serialized"
      - "To make the object immutable"
      - "So callers cannot bypass the rules and leave the object invalid"
    answer: 3
    explanation: |
      Public setters let any caller mutate state directly and skip invariant checks.
      Intention-revealing methods validate rules before changing state, so illegal
      states cannot be reached and the object is never saved invalid.
    ref: "concepts.md#invariants-enforced-inside-the-aggregate"

  - id: ddd-tactical-patterns-021
    difficulty: advanced
    tags: [invariants, fail-fast, scenario]
    question: |
      In an account.withdraw(amount) method that enforces an overdraft limit, when
      should the balance field actually be updated?
    options:
      - "Before checking the limit, then rolled back if invalid"
      - "By the calling service after the method returns"
      - "Only after verifying the resulting balance still satisfies the invariant"
      - "Never — balance is immutable"
    answer: 2
    explanation: |
      The method should fail fast: compute the prospective new balance, check the
      invariant, and only assign the field if the operation is valid. This ensures the
      aggregate is never left in an invalid intermediate state.
    ref: "concepts.md#invariants-enforced-inside-the-aggregate"

  - id: ddd-tactical-patterns-022
    difficulty: beginner
    tags: [domain-events, fundamentals]
    question: |
      How should a domain event typically be named?
    options:
      - "As something that already happened, in the past tense (OrderSubmitted)"
      - "As a command in the imperative (SubmitOrder)"
      - "As a database table name (orders)"
      - "As a getter (getOrderStatus)"
    answer: 0
    explanation: |
      A domain event records something that has happened in the domain and is named in
      the past tense — OrderSubmitted, PaymentCaptured. This distinguishes it from a
      command (a request to do something).
    ref: "concepts.md#domain-events"

  - id: ddd-tactical-patterns-023
    difficulty: intermediate
    tags: [domain-events, decoupling]
    question: |
      What is a primary purpose of domain events in tactical DDD?
    options:
      - "To replace the database entirely"
      - "To let one aggregate directly mutate another aggregate synchronously"
      - "To store UI state between requests"
      - "To decouple aggregates so cross-aggregate work happens in separate transactions (eventual consistency)"
    answer: 3
    explanation: |
      Domain events let an aggregate announce a fact without directly calling another
      aggregate. Handlers react in separate transactions, which is exactly how the
      one-transaction-per-aggregate rule achieves cross-aggregate eventual consistency.
    ref: "concepts.md#domain-events"

  - id: ddd-tactical-patterns-024
    difficulty: advanced
    tags: [domain-events, reliability, outbox]
    question: |
      Merely recording a domain event in memory during a transaction does NOT guarantee
      it is delivered if the process crashes after commit. Which pattern is commonly
      used to publish events reliably?
    options:
      - "Two-phase commit across the app and message broker for every event"
      - "The transactional outbox pattern"
      - "Firing the event before the transaction begins"
      - "Storing events only in the UI layer"
    answer: 1
    explanation: |
      The transactional outbox writes the event and the state change in the same
      database transaction, then a relay asynchronously publishes it — guaranteeing
      at-least-once delivery without distributed transactions. (Details live in the
      event-driven-cqrs-saga-cdc topic.)
    ref: "concepts.md#domain-events"

  - id: ddd-tactical-patterns-025
    difficulty: advanced
    tags: [domain-events, integration-events]
    question: |
      What is the key difference between an internal domain event and an integration
      event?
    options:
      - "Integration events are mutable; domain events are not"
      - "There is no difference; the terms are synonyms"
      - "A domain event is internal to one bounded context and free to change; an integration event is a stable, versioned contract published to other contexts"
      - "Domain events are always larger in byte size"
    answer: 2
    explanation: |
      Internal domain events use rich in-context vocabulary and can evolve freely.
      Integration events crossing bounded-context boundaries are effectively a public
      API and must be treated as a stable, versioned contract.
    ref: "concepts.md#domain-events"

  - id: ddd-tactical-patterns-026
    difficulty: beginner
    tags: [repository, fundamentals]
    question: |
      What illusion does a repository provide?
    options:
      - "An in-memory collection of all aggregate roots of a type, hiding the persistence mechanism"
      - "That the network is always available"
      - "That every query is free"
      - "That value objects have identity"
    answer: 0
    explanation: |
      A repository gives the illusion of an in-memory collection: you add roots and
      find them by id or query as if it were a Set, while the repository translates
      that to SQL, document fetches, etc. It hides persistence details from the domain.
    ref: "concepts.md#repositories-the-collection-illusion-one-per-aggregate"

  - id: ddd-tactical-patterns-027
    difficulty: intermediate
    tags: [repository, aggregate, granularity]
    question: |
      At what granularity should repositories be defined?
    options:
      - "One repository per database table"
      - "One repository per interior entity"
      - "One global repository for the whole application"
      - "One repository per aggregate root"
    answer: 3
    explanation: |
      There is one repository per aggregate root (OrderRepository, CustomerRepository).
      Creating a repository for an interior entity (e.g. OrderLineRepository) is a smell;
      you load the whole aggregate and navigate to its members.
    ref: "concepts.md#repositories-the-collection-illusion-one-per-aggregate"

  - id: ddd-tactical-patterns-028
    difficulty: advanced
    tags: [repository, layering, dependency-inversion]
    question: |
      Following DDD layering, where should the repository interface and its
      implementation live?
    options:
      - "Both in the infrastructure layer"
      - "Interface in the domain layer (a port); implementation in infrastructure"
      - "Both in the application layer"
      - "Interface in the UI; implementation in the domain"
    answer: 1
    explanation: |
      The repository interface belongs to the domain layer, phrased in domain terms,
      while the concrete persistence implementation lives in infrastructure. This is
      dependency inversion: the domain declares the port and infrastructure adapts to it.
    ref: "concepts.md#repositories-the-collection-illusion-one-per-aggregate"

  - id: ddd-tactical-patterns-029
    difficulty: intermediate
    tags: [repository, dao, comparison]
    question: |
      How does a repository differ from a classic DAO?
    options:
      - "A repository is row/CRUD-oriented; a DAO is aggregate-oriented"
      - "They are identical concepts"
      - "A repository is aggregate-oriented and speaks the ubiquitous language; a DAO is table/CRUD-oriented"
      - "A DAO can only be used with NoSQL databases"
    answer: 2
    explanation: |
      A repository presents a collection of domain aggregates in the ubiquitous
      language (one per root), while a DAO is oriented around tables/rows and CRUD
      operations. (The fuller Repository vs DAO vs Data Mapper comparison is in the
      dp-enterprise-application topic.)
    ref: "concepts.md#repositories-the-collection-illusion-one-per-aggregate"

  - id: ddd-tactical-patterns-030
    difficulty: intermediate
    tags: [factory, creation]
    question: |
      When is a factory most appropriate in tactical DDD?
    options:
      - "When creating an aggregate or complex object is non-trivial and must enforce invariants or assemble a valid graph atomically"
      - "For every object, even trivial ones, to avoid using constructors"
      - "Only for finding existing objects in the database"
      - "To hold business rules that operate across many aggregates"
    answer: 0
    explanation: |
      A factory encapsulates non-trivial creation — enforcing invariants at birth,
      assembling a valid object graph, or hiding the concrete type. Trivial creation
      can use a plain constructor; finding existing objects is a repository's job.
    ref: "concepts.md#factories"

  - id: ddd-tactical-patterns-031
    difficulty: intermediate
    tags: [factory, repository, comparison]
    question: |
      How do factories and repositories relate in Evans' model?
    options:
      - "A factory finds existing objects; a repository creates new ones"
      - "They are the same thing"
      - "A repository validates invariants; a factory persists to the database"
      - "A factory creates new objects; a repository finds existing ones (and reconstitutes them on load)"
    answer: 3
    explanation: |
      A factory makes new objects; a repository finds existing ones. Internally a
      repository often uses factory-like logic to reconstitute an aggregate from
      storage, but conceptually creation and retrieval are distinct responsibilities.
    ref: "concepts.md#factories"

  - id: ddd-tactical-patterns-032
    difficulty: beginner
    tags: [domain-service, application-service, layering]
    question: |
      In which layer does an application service live, and what does it primarily do?
    options:
      - "Domain layer; it holds the core business rules"
      - "Application layer; it orchestrates a use case (load, invoke domain behavior, save, dispatch) with no business rules"
      - "Infrastructure layer; it maps objects to tables"
      - "UI layer; it renders views"
    answer: 1
    explanation: |
      An application service sits in the application layer and is kept thin: it opens a
      transaction, loads aggregates, invokes domain behavior, saves, and dispatches
      events. Per Evans it holds no business rules — those belong in the domain.
    ref: "concepts.md#domain-services-vs-application-services"

  - id: ddd-tactical-patterns-033
    difficulty: intermediate
    tags: [domain-service, when-to-use]
    question: |
      When should behavior be modeled as a domain service rather than placed on an
      entity or value object?
    options:
      - "When the behavior is a domain concept that spans several aggregates or has no natural single-aggregate owner"
      - "Whenever an entity would otherwise have any method at all"
      - "When you want to store transaction and repository logic"
      - "Only for reading data, never for domain logic"
    answer: 0
    explanation: |
      A domain service holds genuine domain logic that does not fit naturally on one
      aggregate — for example a funds transfer between two accounts or a pure pricing
      calculation. It is not a home for orchestration/transaction logic (that is the
      application service).
    ref: "concepts.md#domain-services-vs-application-services"

  - id: ddd-tactical-patterns-034
    difficulty: advanced
    tags: [domain-service, application-service, comparison, scenario]
    question: |
      A "transfer funds between two accounts" operation must debit one Account
      aggregate and credit another. Which describes the cleanest split of
      responsibilities?
    options:
      - "Put the debit/credit rules and the transaction/repository handling all in one application service"
      - "Put all logic on a public setter of Account"
      - "Model both accounts as one aggregate and do it in a single method"
      - "A domain service expresses the transfer rules over the two accounts; an application service handles loading, the transaction, and dispatching events"
    answer: 3
    explanation: |
      The transfer is a domain concept spanning two aggregates, so a domain service
      captures the rules. The application service stays thin: load the accounts, run
      the transfer, coordinate the transaction(s), and dispatch events. Business rules
      stay out of the application service.
    ref: "concepts.md#domain-services-vs-application-services"

  - id: ddd-tactical-patterns-035
    difficulty: advanced
    tags: [domain-service, anemic-model, smells]
    question: |
      What is the main risk of overusing services in a DDD codebase?
    options:
      - "Services are slower than entities at runtime"
      - "It makes value objects mutable"
      - "Business rules drift out of aggregates into services, leading to an anemic domain model"
      - "It prevents the use of repositories"
    answer: 2
    explanation: |
      A domain service is for logic with no single aggregate home. If rules that belong
      on an entity keep landing in services, the objects become data bags and you slide
      into the anemic domain model anti-pattern.
    ref: "concepts.md#domain-services-vs-application-services"

  - id: ddd-tactical-patterns-036
    difficulty: beginner
    tags: [anemic-model, anti-pattern]
    question: |
      What characterizes an anemic domain model?
    options:
      - "Domain objects that are little more than getters/setters, with all logic in separate services"
      - "Objects rich with behavior that enforce their own invariants"
      - "A model with no classes at all"
      - "A model that uses only value objects"
    answer: 0
    explanation: |
      The anemic domain model has objects named after domain concepts but nearly no
      behavior — bags of getters and setters — with all business logic living in service
      classes. It looks OO but is procedural.
    ref: "concepts.md#anemic-domain-model-vs-rich-domain-model"

  - id: ddd-tactical-patterns-037
    difficulty: intermediate
    tags: [anemic-model, rich-model, fowler]
    question: |
      According to Fowler, why is the anemic domain model an anti-pattern for a complex
      domain?
    options:
      - "It uses too much memory"
      - "You pay the cost of a domain model (e.g. O/R mapping) without gaining its benefit of organizing logic with the data"
      - "It cannot compile in statically typed languages"
      - "It requires a NoSQL database"
    answer: 1
    explanation: |
      Fowler notes the anemic model contradicts OO by splitting data from behavior. You
      still pay the cost of building and mapping a domain model but forfeit its main
      benefit — rules organized around the data they govern — effectively a Transaction
      Script in disguise.
    ref: "concepts.md#anemic-domain-model-vs-rich-domain-model"

  - id: ddd-tactical-patterns-038
    difficulty: intermediate
    tags: [rich-model, behavior]
    question: |
      Which method signature best reflects a rich domain model?
    options:
      - "order.setStatus(2)"
      - "orderService.updateOrderStatus(order, 2)"
      - "order.getStatus() then external logic sets it"
      - "order.submit()"
    answer: 3
    explanation: |
      A rich model puts behavior with the data and speaks the ubiquitous language:
      order.submit() encapsulates the rules of submitting. setStatus(2) and external
      status manipulation are anemic — the rule lives outside the object.
    ref: "concepts.md#anemic-domain-model-vs-rich-domain-model"

  - id: ddd-tactical-patterns-039
    difficulty: advanced
    tags: [anemic-model, layering, nuance]
    question: |
      Which statement about the anemic model is accurate?
    options:
      - "Separating persistence and presentation from the domain is itself the anemic anti-pattern"
      - "The anti-pattern is stripping behavior out of domain objects, NOT the act of layering; proper layering is good"
      - "An anemic model is always wrong, even for trivial CRUD apps"
      - "A rich model must put persistence code inside the entity"
    answer: 1
    explanation: |
      Proper layering (separating persistence and presentation) is good practice. The
      anti-pattern is hollowing out the domain objects. And for trivial CRUD, an
      anemic-ish/Transaction Script approach is acceptable — the label bites when the
      domain is complex.
    ref: "concepts.md#anemic-domain-model-vs-rich-domain-model"

  - id: ddd-tactical-patterns-040
    difficulty: beginner
    tags: [ubiquitous-language, fundamentals]
    question: |
      What is the ubiquitous language in DDD?
    options:
      - "A shared, rigorous vocabulary used by developers and domain experts, reflected directly in the code"
      - "A programming language designed specifically for DDD"
      - "The SQL dialect used by the database"
      - "The set of HTTP status codes returned by the API"
    answer: 0
    explanation: |
      The ubiquitous language is the shared, precise vocabulary of a bounded context,
      used by both developers and domain experts and appearing literally in class,
      method, and event names — closing the translation gap between business and code.
    ref: "concepts.md#ubiquitous-language-in-code"

  - id: ddd-tactical-patterns-041
    difficulty: intermediate
    tags: [ubiquitous-language, smells]
    question: |
      Which is a smell that the ubiquitous language is NOT present in the code?
    options:
      - "Classes named OrderSubmitted, CreditLimitExceeded, FulfillmentService"
      - "A method named account.withdraw(amount)"
      - "Generic names like Manager, Processor, Data, and setStatus(int)"
      - "An event named PaymentCaptured"
    answer: 2
    explanation: |
      Generic names (Manager, Processor, Data, Info) and primitive state manipulation
      like setStatus(int) indicate the domain vocabulary has not made it into the code.
      The other options are examples of the ubiquitous language expressed in code.
    ref: "concepts.md#ubiquitous-language-in-code"

  - id: ddd-tactical-patterns-042
    difficulty: advanced
    tags: [ubiquitous-language, bounded-context]
    question: |
      The word "account" means different things in the billing context and the identity
      context. What does this illustrate about the ubiquitous language?
    options:
      - "The ubiquitous language must be globally unique across the whole company"
      - "The ubiquitous language is scoped to a single bounded context, not global"
      - "Terms should always be renamed to avoid any overlap"
      - "It means the model is broken and must be merged"
    answer: 1
    explanation: |
      The ubiquitous language is ubiquitous WITHIN a bounded context, not across the
      entire organization. The same term legitimately carries different meanings in
      different contexts — a strategic-DDD concern covered in
      microservices-ddd-and-boundaries.
    ref: "concepts.md#ubiquitous-language-in-code"

  - id: ddd-tactical-patterns-043
    difficulty: beginner
    tags: [when-to-use, crud, over-engineering]
    question: |
      For which kind of application is full tactical DDD most likely to be overkill?
    options:
      - "A core banking system with complex, evolving rules"
      - "A logistics platform with many invariants"
      - "An insurance underwriting engine"
      - "A simple CRUD app that is essentially forms over data with trivial validation"
    answer: 3
    explanation: |
      DDD's rich modeling pays back when business complexity is high. For a
      forms-over-data CRUD app, a Transaction Script or Active Record approach is
      simpler and appropriate; imposing aggregates, factories, and domain services adds
      ceremony with no payoff.
    ref: "concepts.md#when-tactical-ddd-is-worth-it-and-when-its-overkill"

  - id: ddd-tactical-patterns-044
    difficulty: intermediate
    tags: [when-to-use, complexity]
    question: |
      What condition most strongly justifies investing in tactical DDD?
    options:
      - "The team wants to try a new architecture style"
      - "The domain has genuinely complex, evolving business rules and invariants where getting them wrong is expensive"
      - "The project is a short-lived throwaway prototype"
      - "The application only moves rows between tables"
    answer: 1
    explanation: |
      Evans is explicit that DDD targets domains with significant business complexity.
      Complex, evolving rules with high stakes are exactly where a rich model repays its
      cost. Prototypes and simple table-shuffling do not warrant it.
    ref: "concepts.md#when-tactical-ddd-is-worth-it-and-when-its-overkill"

  - id: ddd-tactical-patterns-045
    difficulty: advanced
    tags: [when-to-use, subdomains, strategic, scenario]
    question: |
      A senior engineer is asked "should we use DDD for this whole system?" What is the
      most mature answer?
    options:
      - "Yes — apply full tactical DDD uniformly to every table and module"
      - "No — DDD never scales to real systems"
      - "Apply tactical DDD to the core subdomain where complexity lives, and keep supporting/generic subdomains simple (CRUD or off-the-shelf)"
      - "Only use DDD if the team already knows it"
    answer: 2
    explanation: |
      The mature answer distinguishes subdomains: invest tactical DDD in the core domain
      where complexity and competitive value concentrate, and keep supporting/generic
      subdomains simple. Applying full DDD uniformly to every table is a classic
      over-engineering mistake. (Choosing core subdomains is strategic DDD.)
    ref: "concepts.md#when-tactical-ddd-is-worth-it-and-when-its-overkill"

  - id: ddd-tactical-patterns-046
    difficulty: intermediate
    tags: [entity, identity, generation]
    question: |
      Why is it often preferred to generate an entity's id (e.g. a UUID) before
      persistence rather than relying on a database-assigned key?
    options:
      - "The object is valid and referenceable the moment it exists, without a DB round-trip"
      - "Database keys are always slower to read"
      - "UUIDs are the only legal identity type in DDD"
      - "It makes the entity immutable"
    answer: 0
    explanation: |
      Generating the id up front means the entity is fully formed and can be referenced
      (e.g. by domain events or other aggregates) immediately, without waiting for a
      database insert to assign a surrogate key.
    ref: "concepts.md#entities-identity-and-lifecycle"

  - id: ddd-tactical-patterns-047
    difficulty: intermediate
    tags: [value-object, entity, decision]
    question: |
      Which question best helps decide whether something should be an entity or a value
      object?
    options:
      - "Does it have more than three fields?"
      - "Is it stored in a relational database?"
      - "Do I care WHICH specific one it is, or only WHAT it is?"
      - "Does it appear in the UI?"
    answer: 2
    explanation: |
      If you care only about WHAT it is (interchangeable, compared by value), it is a
      value object; if you must track WHICH specific one it is over time (identity and
      lifecycle), it is an entity. When in doubt, prefer a value object.
    ref: "concepts.md#value-objects-immutable-equality-by-value"

  - id: ddd-tactical-patterns-048
    difficulty: advanced
    tags: [invariants, aggregate, consistency, scenario]
    question: |
      Which invariant genuinely MUST be enforced inside a single aggregate transaction,
      rather than eventually?
    options:
      - "A customer's lifetime spend total across all orders"
      - "An order's total must equal the sum of its line items"
      - "A global count of all orders placed today"
      - "A recommendation score computed from browsing history"
    answer: 1
    explanation: |
      "Order total equals the sum of its lines" spans only the Order aggregate and must
      be atomically true, so it belongs inside that aggregate. Lifetime spend, global
      counts, and recommendation scores can tolerate lag and are best computed
      eventually from events.
    ref: "concepts.md#invariants-enforced-inside-the-aggregate"
