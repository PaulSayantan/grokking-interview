topic: "Message Queues, Streaming and Asynchronous Processing"
domain: system-design
topic_slug: message-queues-and-async
version: 1
questions:
  - id: message-queues-and-async-001
    difficulty: beginner
    tags: [async, decoupling, fundamentals]
    question: |
      What is the single most common reason to introduce a message queue between
      a producer and a slow downstream consumer?
    options:
      - "To buffer bursts of load so the consumer can drain work at its sustainable rate (load leveling)"
      - "To reduce the total number of servers needed for the workload down to essentially zero"
      - "To guarantee that messages are delivered exactly once and never duplicated"
      - "To make the producer's request faster than a direct in-memory function call"
    answer: 0
    explanation: |
      Load leveling (buffering spikes) is the canonical reason for a queue: the
      queue absorbs a burst and the consumer processes at its own pace. It does
      not eliminate servers, does not guarantee no duplicates (most queues are
      at-least-once), and adds latency versus a direct call rather than removing it.
    ref: "concepts.md#why-asynchronous-messaging-and-when-it-hurts"
  - id: message-queues-and-async-002
    difficulty: beginner
    tags: [sync-vs-async, latency]
    question: |
      A user clicks "Show price" and must see the number before continuing. Which
      approach is most appropriate?
    options:
      - "Publish a request to a queue and poll a reply queue"
      - "Write an event to Kafka and let a consumer email the price later"
      - "A synchronous request/response call"
      - "Fire-and-forget the request and show a stale cached number always"
    answer: 2
    explanation: |
      When the user needs the result immediately to proceed, synchronous RPC is
      correct. Wrapping it in a queue only adds latency and complexity to fake a
      request/response. Async/log-based options defer the answer, which the user
      cannot wait for here.
    ref: "concepts.md#why-asynchronous-messaging-and-when-it-hurts"
  - id: message-queues-and-async-003
    difficulty: beginner
    tags: [queue, pub-sub, models]
    question: |
      In a point-to-point work queue with multiple competing workers, how many
      workers process a given message?
    options:
      - "Every worker in the pool processes its own copy of every message"
      - "None; messages are only stored on disk for later replay"
      - "A random number between one and the total worker count"
      - "Exactly one worker processes it, then it is removed after acknowledgment"
    answer: 3
    explanation: |
      A work queue delivers each message to exactly one competing consumer and
      deletes it on ack. "Every worker gets every message" describes pub/sub;
      replay-without-delete describes a log. There is no random duplication by design.
    ref: "concepts.md#queue-vs-pub-sub-vs-log-based-streaming"
  - id: message-queues-and-async-004
    difficulty: beginner
    tags: [pub-sub, fan-out]
    question: |
      What best describes the publish-subscribe delivery model?
    options:
      - "Each message is delivered to exactly one subscriber and deleted"
      - "Each message is delivered to every subscriber, each getting its own copy"
      - "Messages are stored on the broker forever and never delivered"
      - "Only the single fastest subscriber receives each message"
    answer: 1
    explanation: |
      Pub/sub broadcasts each message to all subscribers. One-subscriber-then-delete
      is a queue. Neither "stored forever, never delivered" nor "fastest wins"
      describes pub/sub.
    ref: "concepts.md#queue-vs-pub-sub-vs-log-based-streaming"
  - id: message-queues-and-async-005
    difficulty: beginner
    tags: [log, replay, offsets]
    question: |
      What distinguishes a log-based streaming system (like Kafka) from a
      traditional queue?
    options:
      - "Messages are retained after consumption and consumers track their own offset, enabling replay"
      - "It deletes each message immediately after a single consumer has read it"
      - "It cannot support more than one independent consumer reading a topic"
      - "It guarantees strict global total ordering across all of a topic's partitions"
    answer: 0
    explanation: |
      A log retains messages (by time/size) and lets consumers rewind via offsets,
      enabling replay and multiple independent consumer groups. It does not delete
      on read, supports many consumers, and only guarantees ordering within a
      partition, not globally.
    ref: "concepts.md#queue-vs-pub-sub-vs-log-based-streaming"
  - id: message-queues-and-async-006
    difficulty: beginner
    tags: [delivery-semantics]
    question: |
      "At-least-once" delivery means:
    options:
      - "Messages may be lost but are never duplicated"
      - "Each message is delivered exactly one time with no coordination"
      - "Messages are never lost but may be delivered more than once"
      - "Messages are silently dropped and delivered zero times"
    answer: 2
    explanation: |
      At-least-once guarantees no loss but permits duplicates (retry after a lost
      ack). "May be lost, never duplicated" is at-most-once. Exactly-once requires
      coordination and is not free. Zero delivery is not a semantic.
    ref: "concepts.md#delivery-semantics-at-most-once-at-least-once-exactly-once"
  - id: message-queues-and-async-007
    difficulty: beginner
    tags: [idempotency]
    question: |
      An operation is idempotent when:
    options:
      - "It can only ever be physically executed one single time"
      - "It requires acquiring a distributed lock in order to run"
      - "It always increments a shared counter on every call"
      - "Applying it multiple times yields the same result as applying it once"
    answer: 3
    explanation: |
      Idempotency means repeated application has the same effect as a single
      application, which is what makes duplicate delivery harmless. "balance =
      balance + 10" is the classic non-idempotent counterexample.
    ref: "concepts.md#idempotency-and-deduplication"
  - id: message-queues-and-async-008
    difficulty: beginner
    tags: [dlq, retries]
    question: |
      What is the primary purpose of a Dead Letter Queue (DLQ)?
    options:
      - "To speed up processing of normal messages by routing them onto a faster parallel track"
      - "To hold messages that repeatedly failed processing so they stop blocking the main flow and can be inspected"
      - "To store the most recent successfully processed messages so they can be cached for reads"
      - "To guarantee exactly-once delivery by keeping a backup copy of every message published"
    answer: 1
    explanation: |
      A DLQ isolates poison messages after retries are exhausted, keeping healthy
      traffic flowing and preserving failures for inspection/redrive. It does not
      speed up normal processing, cache successes, or provide exactly-once.
    ref: "concepts.md#dead-letter-queues-retries-and-poison-messages"
  - id: message-queues-and-async-009
    difficulty: beginner
    tags: [consumer-lag, offsets]
    question: |
      Consumer lag in a Kafka-style system is best defined as:
    options:
      - "The difference between the latest produced offset and the consumer's last committed offset"
      - "The network round-trip latency between the consumer and the broker"
      - "The total number of partitions configured on the topic being read"
      - "The total amount of disk space the broker uses for the topic"
    answer: 0
    explanation: |
      Lag measures how far behind a consumer is: latest offset minus committed
      offset. It is the key health metric for a streaming consumer, distinct from
      RTT, partition count, or disk usage.
    ref: "concepts.md#consumer-groups-offsets-backpressure-and-consumer-lag"
  - id: message-queues-and-async-010
    difficulty: beginner
    tags: [partitioning, ordering]
    question: |
      In Kafka, ordering is guaranteed:
    options:
      - "Globally across all partitions of a topic"
      - "Never, under any circumstance"
      - "Only within a single partition"
      - "Only across different topics"
    answer: 2
    explanation: |
      Kafka guarantees order only within a partition. Messages with the same key
      hash to the same partition and stay ordered relative to each other; there is
      no global cross-partition order.
    ref: "concepts.md#ordering-and-partitioning"
  - id: message-queues-and-async-011
    difficulty: beginner
    tags: [batch-vs-stream]
    question: |
      Compared to batch processing, stream processing generally offers:
    options:
      - "Guaranteed cheaper cost per record"
      - "Higher latency and lower throughput always"
      - "No need to handle state or windowing"
      - "Lower latency but more complexity per record"
    answer: 3
    explanation: |
      Streaming trades higher per-record complexity (windowing, late data, state)
      for low latency. Batch is typically cheaper per record and simpler to
      reprocess. Streaming very much requires state and windowing management.
    ref: "concepts.md#batch-vs-stream-processing"
  - id: message-queues-and-async-012
    difficulty: beginner
    tags: [sns, sqs, fan-out]
    question: |
      A common AWS pattern for durable fan-out of one event to several independent
      consumers is:
    options:
      - "A single SQS queue read by all consumers simultaneously"
      - "SNS topic publishing to multiple SQS queues, one per consumer"
      - "Writing the event to a file on one EC2 instance"
      - "A synchronous HTTP call to each consumer in a loop from the producer"
    answer: 1
    explanation: |
      SNS to multiple SQS queues gives durable, decoupled fan-out where each queue
      is drained independently. A single SQS queue delivers each message once
      (competing consumers), a local file is not durable/distributed, and a sync
      loop couples the producer to every consumer's availability.
    ref: "concepts.md#fan-out-patterns"
  - id: message-queues-and-async-013
    difficulty: beginner
    tags: [outbox, dual-write]
    question: |
      The transactional outbox pattern solves which problem?
    options:
      - "The dual-write problem: atomically updating the DB and publishing an event"
      - "The problem of a slow consumer steadily falling behind the producer's rate"
      - "Encrypting message payloads while they travel between the broker and consumer"
      - "Balancing partition load evenly across all of the brokers in the cluster"
    answer: 0
    explanation: |
      The outbox pattern addresses the dual-write problem by writing the event into
      an outbox table in the same DB transaction as the business data, so both
      commit atomically. It is unrelated to consumer speed, encryption, or load
      balancing.
    ref: "concepts.md#the-outbox-pattern-and-change-data-capture"
  - id: message-queues-and-async-014
    difficulty: beginner
    tags: [rabbitmq, kafka]
    question: |
      Which broker is best known for flexible message routing, per-message
      priorities, and per-message TTL at modest scale?
    options:
      - "Apache Kafka"
      - "AWS Kinesis"
      - "RabbitMQ"
      - "HDFS"
    answer: 2
    explanation: |
      RabbitMQ's exchanges provide rich routing, priority queues, and per-message
      TTL. Kafka and Kinesis are log-based streams without native per-message
      priorities; HDFS is a filesystem, not a broker.
    ref: "concepts.md#kafka-vs-rabbitmq-vs-sqs-sns-vs-pulsar"
  - id: message-queues-and-async-015
    difficulty: intermediate
    tags: [delivery-semantics, offsets]
    question: |
      A consumer commits its offset BEFORE processing each message. If it crashes
      mid-processing, what delivery semantic results?
    options:
      - "Exactly-once (the broker replays the in-flight message on recovery)"
      - "At-least-once (the crashed message is always redelivered after restart)"
      - "No delivery guarantee is affected by commit timing"
      - "At-most-once (the in-flight message can be skipped/lost)"
    answer: 3
    explanation: |
      Committing before processing means a crash advances past an unprocessed
      message, so it is skipped: at-most-once. Committing after processing gives
      at-least-once (reprocess on crash). Commit timing directly determines the
      semantic.
    ref: "concepts.md#consumer-groups-offsets-backpressure-and-consumer-lag"
  - id: message-queues-and-async-016
    difficulty: intermediate
    tags: [idempotency, exactly-once]
    question: |
      You use at-least-once delivery for a payment charge. What is the standard way
      to prevent double-charging on redelivery?
    options:
      - "Increase the visibility timeout to a very large value so an in-flight charge is never redelivered while still processing"
      - "Use an idempotency key and record it in the same DB transaction as the charge, rejecting duplicates via a unique constraint"
      - "Switch the queue to at-most-once delivery so a charge is never retried and can therefore never happen twice"
      - "Add more consumers so each message is picked up and fully processed before any redelivery timer can fire"
    answer: 1
    explanation: |
      The correct pattern is an idempotency key persisted atomically with the
      effect, so a replay is rejected by the unique constraint. A larger visibility
      timeout only delays redelivery; at-most-once risks losing charges entirely;
      more consumers does not prevent duplicates.
    ref: "concepts.md#how-exactly-once-is-really-achieved"
  - id: message-queues-and-async-017
    difficulty: intermediate
    tags: [kafka, exactly-once, scope]
    question: |
      Kafka advertises "exactly-once semantics." What is the correct scope of that
      guarantee?
    options:
      - "Only within Kafka (Kafka-to-Kafka), via idempotent producer plus transactions; external sinks need their own idempotency"
      - "End-to-end across any external database or third-party API the consumer happens to write to"
      - "It applies only when producers are configured with acks=0 for maximum throughput"
      - "It eliminates the need for consumer-side idempotency or deduplication in every case, external or not"
    answer: 0
    explanation: |
      Kafka EOS holds for Kafka-to-Kafka pipelines (idempotent producer +
      transactions + read_committed). It cannot make an external DB or API
      atomic; those sinks still need idempotency. acks=0 is at-most-once, the
      opposite of EOS.
    ref: "concepts.md#how-exactly-once-is-really-achieved"
  - id: message-queues-and-async-018
    difficulty: intermediate
    tags: [partitioning, parallelism]
    question: |
      In a Kafka consumer group, what caps the maximum consumer parallelism for a
      topic?
    options:
      - "The number of brokers in the cluster, since each broker serves exactly one consumer"
      - "The replication factor, because each replica feeds its own dedicated consumer instance"
      - "The number of partitions (a partition is consumed by at most one consumer in the group)"
      - "The number of topics the consumer group happens to be subscribed to at once"
    answer: 2
    explanation: |
      Each partition is assigned to at most one consumer within a group, so
      parallelism is capped by partition count; extra consumers sit idle. Broker
      count, replication factor, and topic count do not set this ceiling.
    ref: "concepts.md#consumer-groups-offsets-backpressure-and-consumer-lag"
  - id: message-queues-and-async-019
    difficulty: intermediate
    tags: [retries, backoff]
    question: |
      For transient downstream failures, the recommended retry strategy is:
    options:
      - "Tight immediate retries in a loop, resending as fast as the CPU allows"
      - "Never retry at all; push every failed message straight to the DLQ"
      - "Retry forever in an unbounded loop with a fixed 1ms delay between attempts"
      - "Exponential backoff with jitter and a capped number of attempts"
    answer: 3
    explanation: |
      Exponential backoff with jitter avoids thundering-herd synchronization and,
      with a retry cap, prevents infinite loops. Tight/fixed rapid retries hammer
      the downstream during an outage; never retrying wastes recoverable transient
      failures.
    ref: "concepts.md#dead-letter-queues-retries-and-poison-messages"
  - id: message-queues-and-async-020
    difficulty: intermediate
    tags: [sqs, fifo, throughput]
    question: |
      A team needs strict ordering and exactly-once processing on AWS but only ~200
      messages/sec. Which is the most appropriate and cost-effective choice?
    options:
      - "SQS Standard queue"
      - "SQS FIFO queue"
      - "A self-managed Kafka cluster with 100 partitions"
      - "SNS fan-out with no queue"
    answer: 1
    explanation: |
      SQS FIFO gives strict ordering (per message group) and exactly-once
      processing within its 5-minute dedup window, and 300 ops/sec easily covers
      200/sec. Standard is best-effort order with duplicates; standing up Kafka is
      over-engineering here; SNS alone is pub/sub without ordering guarantees.
    ref: "concepts.md#kafka-vs-rabbitmq-vs-sqs-sns-vs-pulsar"
  - id: message-queues-and-async-021
    difficulty: intermediate
    tags: [outbox, cdc, debezium]
    question: |
      In the outbox pattern, what is the modern, low-latency way to move rows from
      the outbox table to the broker without polling?
    options:
      - "Change Data Capture (e.g., Debezium tailing the DB transaction log) streaming changes to Kafka"
      - "A cron job that truncates the entire outbox table once every hour"
      - "Two-phase commit coordinating the DB and Kafka atomically on every single write"
      - "Having the application publish directly to Kafka before committing the DB"
    answer: 0
    explanation: |
      CDC via Debezium tails the WAL/binlog and streams outbox rows with low
      latency and no polling. A truncating cron loses data; 2PC is slow and
      fragile; publishing before commit reintroduces the exact dual-write
      inconsistency the outbox avoids.
    ref: "concepts.md#the-outbox-pattern-and-change-data-capture"
  - id: message-queues-and-async-022
    difficulty: intermediate
    tags: [ordering, hot-partition]
    question: |
      You partition an event stream by user_id, but one celebrity account produces
      100x the traffic of anyone else. What is the primary problem and a reasonable
      fix?
    options:
      - "No problem; consistent hashing guarantees perfectly even distribution regardless of key skew"
      - "Global ordering is lost; fix it by collapsing the topic down to one partition for everyone"
      - "A hot partition bottleneck; mitigate with a composite/salted key or a dedicated stream for the whale"
      - "Duplicates increase sharply; fix it by disabling the idempotent producer entirely"
    answer: 2
    explanation: |
      Key skew makes the celebrity's partition a bottleneck while others idle.
      Composite/salted keys or isolating whales spreads load. Hashing does not fix
      skew; collapsing to one partition kills parallelism; and this is a throughput,
      not a duplication, issue.
    ref: "concepts.md#ordering-and-partitioning"
  - id: message-queues-and-async-023
    difficulty: intermediate
    tags: [batch-vs-stream, architecture]
    question: |
      The Kappa architecture differs from the Lambda architecture in that it:
    options:
      - "Runs separate batch and speed layers with duplicated logic"
      - "Supports only scheduled daily batch jobs and never processes real-time events"
      - "Removes the need for any durable message log by processing purely in memory"
      - "Uses a single streaming layer and reprocesses by replaying the log"
    answer: 3
    explanation: |
      Kappa uses one streaming codebase and replays the retained log for
      reprocessing, avoiding Lambda's dual batch+speed layers and duplicated logic.
      It relies on a log for replay and is not batch-only.
    ref: "concepts.md#batch-vs-stream-processing"
  - id: message-queues-and-async-024
    difficulty: intermediate
    tags: [backpressure, push-pull]
    question: |
      Why does a slow consumer in Kafka generally not crash the system, whereas a
      slow consumer in a naive push-based broker can?
    options:
      - "Kafka has effectively infinite memory, so it buffers any consumer's backlog in RAM without limit"
      - "Kafka is pull-based: a slow consumer just accumulates lag in the durable log rather than being flooded with pushed messages"
      - "Kafka automatically deletes unread messages faster than they arrive, so no backlog can ever build up"
      - "Push-based brokers never actually deliver messages, so a slow consumer simply has nothing to receive"
    answer: 1
    explanation: |
      Kafka consumers pull at their own pace, so slowness shows up as lag against
      the durable log. A naive push broker can overwhelm a slow consumer unless it
      uses prefetch/credit limits. Kafka does not have infinite memory nor delete
      unread data early.
    ref: "concepts.md#consumer-groups-offsets-backpressure-and-consumer-lag"
  - id: message-queues-and-async-025
    difficulty: intermediate
    tags: [dlq, poison-message, head-of-line]
    question: |
      A single malformed message sits at the head of an ordered partition and
      throws on every attempt. What is the immediate consequence if you have no
      DLQ or retry-topic?
    options:
      - "Head-of-line blocking: everything behind it stalls"
      - "The message is silently dropped and processing continues"
      - "The partition automatically splits itself into two halves"
      - "Every other partition in the topic also stops"
    answer: 0
    explanation: |
      Without DLQ/retry handling, a poison message at the head of an ordered
      partition blocks all messages behind it (head-of-line blocking). It is not
      silently dropped, partitions do not auto-split, and other partitions are
      unaffected.
    ref: "concepts.md#dead-letter-queues-retries-and-poison-messages"
  - id: message-queues-and-async-026
    difficulty: intermediate
    tags: [kafka, transactions, config]
    question: |
      Which combination is required for Kafka's consume-process-produce
      exactly-once loop?
    options:
      - "acks=0 on the producer combined with enable.auto.commit=true on the consumer"
      - "A single partition per topic together with producer retries fully disabled"
      - "transactional.id set, offsets committed via sendOffsetsToTransaction, and consumers reading with isolation.level=read_committed"
      - "Disabling the idempotent producer entirely to reduce transactional overhead"
    answer: 2
    explanation: |
      EOS in the consume-process-produce loop needs a transactional producer that
      commits consumer offsets inside the transaction, and consumers reading only
      committed records. acks=0 is lossy, single-partition is unrelated, and
      disabling idempotence breaks the guarantee.
    ref: "concepts.md#how-exactly-once-is-really-achieved"
  - id: message-queues-and-async-027
    difficulty: intermediate
    tags: [feed, fan-out]
    question: |
      In a social feed, "fan-out on write" (push) has which primary drawback?
    options:
      - "Reads become extremely expensive because every timeline is recomputed on each view"
      - "It requires gathering and merging all of a user's followees at read time"
      - "It is structurally incapable of delivering a post to more than one follower"
      - "A user with tens of millions of followers causes a massive write storm on each post"
    answer: 3
    explanation: |
      Fan-out on write pre-computes inboxes, making reads cheap but causing a write
      storm for celebrities. Expensive reads and reading followees at read time
      describe fan-out on read (pull). Hybrid designs mix both to handle whales.
    ref: "concepts.md#fan-out-patterns"
  - id: message-queues-and-async-028
    difficulty: intermediate
    tags: [dedup, storage]
    question: |
      You use a Redis SETNX with TTL as a dedup store for at-least-once processing.
      What is the key correctness risk of the TTL?
    options:
      - "Redis is unable to persist keys at all, so the dedup store loses every entry immediately"
      - "If a duplicate arrives after the TTL expires, it will not be detected as a duplicate"
      - "The presence of a TTL turns every underlying operation into a non-idempotent one"
      - "A TTL on the dedup key guarantees exactly-once processing end-to-end across all systems"
    answer: 1
    explanation: |
      A too-short TTL lets late duplicates slip through undetected, while a too-long
      TTL grows storage. It is a correctness-vs-cost tuning trade-off. Redis can
      store keys, TTL does not change idempotency of the underlying op, and no TTL
      gives end-to-end exactly-once.
    ref: "concepts.md#idempotency-and-deduplication"
  - id: message-queues-and-async-029
    difficulty: intermediate
    tags: [rebalance, poll-timeout]
    question: |
      Your Kafka consumers keep triggering rebalances even though none are crashing.
      Processing each batch takes longer than max.poll.interval.ms. What is
      happening?
    options:
      - "The broker considers the consumer dead because it did not call poll() in time, causing repeated rebalances (livelock)"
      - "The broker ran out of disk, forcing the group to reassign partitions"
      - "The replication factor is set too high for the number of brokers available"
      - "The topic has too few partitions to satisfy the consumer count"
    answer: 0
    explanation: |
      Exceeding max.poll.interval.ms makes the group coordinator evict the consumer
      as dead, triggering a rebalance loop even though the consumer is alive but
      slow. Fix by processing faster, reducing max.poll.records, or raising the
      interval. Disk, RF, and partition count are not the cause here.
    ref: "concepts.md#consumer-groups-offsets-backpressure-and-consumer-lag"
  - id: message-queues-and-async-030
    difficulty: intermediate
    tags: [estimation, partitions]
    question: |
      Peak write bandwidth is ~90 MB/s and you plan each Kafka partition to
      sustain ~10 MB/s. Ignoring other factors, roughly how many partitions do you
      need at minimum for throughput, and why round up?
    options:
      - "About 3; round up to leave spare capacity for the replication factor"
      - "Exactly 90; you provision precisely one partition for each MB/s of bandwidth"
      - "About 9; round up for headroom, consumer parallelism, and growth"
      - "Just 1; partition count has no bearing on a topic's total throughput"
    answer: 2
    explanation: |
      90 / 10 = 9 partitions minimum for throughput; you round up (e.g., to 16-32)
      for headroom, consumer parallelism, and future growth since repartitioning
      later breaks key ordering. Partitions absolutely affect throughput and
      parallelism.
    ref: "concepts.md#capacity-estimation-and-back-of-envelope"
  - id: message-queues-and-async-031
    difficulty: intermediate
    tags: [pulsar, architecture]
    question: |
      What architectural feature most distinguishes Apache Pulsar from Kafka?
    options:
      - "Pulsar has no concept of topics and instead routes purely by consumer name"
      - "Pulsar supports only a single tenant per cluster, with no multi-tenancy at all"
      - "Pulsar cannot retain messages after consumption, deleting each one on first read"
      - "Pulsar separates serving (stateless brokers) from storage (Apache BookKeeper), enabling independent scaling"
    answer: 3
    explanation: |
      Pulsar's compute/storage separation (brokers + BookKeeper) lets you scale
      serving and storage independently and aids multi-tenancy and geo-replication.
      It has topics, retains messages, and is explicitly multi-tenant.
    ref: "concepts.md#kafka-vs-rabbitmq-vs-sqs-sns-vs-pulsar"
  - id: message-queues-and-async-032
    difficulty: intermediate
    tags: [sqs, retention, replay]
    question: |
      A requirement states "we must be able to re-run analytics over the last 30
      days of raw events at any time." Why is SQS a poor fit and what fits better?
    options:
      - "SQS is far too expensive at this volume; switch to RabbitMQ classic queues instead"
      - "SQS deletes messages after consumption and retains at most 14 days, so it cannot replay 30 days; a log like Kafka/Kinesis with long retention fits"
      - "SQS provides no ordering whatsoever, making analytics impossible; use an SNS topic instead"
      - "SQS cannot sustain 30 days of throughput; store everything in a single Postgres table instead"
    answer: 1
    explanation: |
      SQS deletes on consumption and caps retention at 14 days, so it cannot replay
      30 days of history. A retained, replayable log (Kafka/Kinesis, ideally with
      tiered storage) is the right tool. RabbitMQ classic queues also lack long
      replay; SNS is pub/sub without retention.
    ref: "concepts.md#queue-vs-pub-sub-vs-log-based-streaming"
  - id: message-queues-and-async-033
    difficulty: intermediate
    tags: [ordering, retries]
    question: |
      With strict per-key ordering required, message A (key K) fails and is retried
      via a background retry topic while message B (key K) proceeds on the main
      topic. What have you sacrificed?
    options:
      - "Strict ordering for key K, because B was processed before the retried A"
      - "Nothing at all; per-key ordering is preserved automatically by the retry topic"
      - "The durability of message B, which can now be silently lost during the retry"
      - "The ability to use consumer groups on the main topic going forward"
    answer: 0
    explanation: |
      Non-blocking retries keep throughput but reorder the failed message relative
      to its siblings, breaking strict per-key order. This is the core
      throughput-vs-ordering trade-off; durability and consumer groups are
      unaffected.
    ref: "concepts.md#dead-letter-queues-retries-and-poison-messages"
  - id: message-queues-and-async-034
    difficulty: intermediate
    tags: [async, consistency]
    question: |
      After moving order confirmation to an async pipeline, users complain they
      don't immediately see their order in "My Orders." What consistency reality are
      you facing, and a valid fix?
    options:
      - "Strong consistency broke permanently, so you must revert every async pipeline"
      - "The queue silently lost the message; adding more partitions will bring it back"
      - "Eventual consistency from async propagation; read-your-writes from the write path (or write synchronously) until the event propagates"
      - "It is purely a caching bug that has nothing to do with the async change"
    answer: 2
    explanation: |
      Async propagation makes reads eventually consistent. A common fix is to serve
      the user's own recent write from the write path (read-your-writes) or do that
      specific write synchronously. Nothing was lost, and it is inherent to async,
      not merely a cache bug.
    ref: "concepts.md#trade-offs-and-when-to-use-what"
  - id: message-queues-and-async-035
    difficulty: intermediate
    tags: [rabbitmq, backpressure, prefetch]
    question: |
      In RabbitMQ (push-based), which mechanism bounds how many unacknowledged
      messages a consumer holds, providing backpressure?
    options:
      - "The configured partition count on the queue's backing topic"
      - "The topic retention time that governs how long messages are stored"
      - "The replication factor applied across the broker cluster"
      - "Consumer prefetch (basic.qos) combined with manual acks"
    answer: 3
    explanation: |
      RabbitMQ uses prefetch (basic.qos) plus acknowledgments to limit in-flight
      messages per consumer, the classic push-based backpressure knob. Partitions,
      replication factor, and retention are Kafka-style concepts not used this way
      in RabbitMQ.
    ref: "concepts.md#consumer-groups-offsets-backpressure-and-consumer-lag"
  - id: message-queues-and-async-036
    difficulty: intermediate
    tags: [idempotent-producer, kafka]
    question: |
      Kafka's idempotent producer (enable.idempotence=true) primarily prevents which
      kind of duplicate?
    options:
      - "Duplicates caused by a consumer reprocessing the same message twice after a crash"
      - "Duplicates on a partition caused by producer retries after a lost ack, using PID + sequence numbers"
      - "Duplicates arising when the same event is mirrored across different Kafka clusters"
      - "Duplicate rows written into an external database by the downstream consumer"
    answer: 1
    explanation: |
      The idempotent producer dedupes retried sends on a partition within a producer
      session via producer ID and monotonic sequence numbers. It does not address
      consumer-side reprocessing, cross-cluster dupes, or external DB writes.
    ref: "concepts.md#how-exactly-once-is-really-achieved"
  - id: message-queues-and-async-037
    difficulty: intermediate
    tags: [inbox, dedup]
    question: |
      The "inbox pattern" on the consumer side does what?
    options:
      - "Records processed message IDs so redelivered messages are recognized and skipped"
      - "Batches outgoing email notifications into a single digest to cut down SMTP calls"
      - "Encrypts stored message payloads at rest using a per-topic AES-256 data key"
      - "Replaces topic partitions with one globally ordered stream to simplify scaling"
    answer: 0
    explanation: |
      The inbox pattern persists processed message IDs to deduplicate redeliveries,
      the consumer-side mirror of the outbox. It is unrelated to email batching,
      encryption, or partitioning.
    ref: "concepts.md#the-outbox-pattern-and-change-data-capture"
  - id: message-queues-and-async-038
    difficulty: intermediate
    tags: [batch-vs-stream, use-case]
    question: |
      Which workload is the clearest fit for stream processing over batch?
    options:
      - "A daily revenue report emailed each morning"
      - "Monthly data warehouse reconciliation"
      - "Real-time fraud detection that must block a transaction within seconds"
      - "Recomputing a machine-learning model over a full historical dataset overnight"
    answer: 2
    explanation: |
      Fraud detection's value decays in seconds, demanding streaming. Daily reports,
      monthly reconciliation, and overnight model training are naturally batch (high
      throughput, latency-tolerant), where streaming would add cost and complexity
      for no benefit.
    ref: "concepts.md#batch-vs-stream-processing"
  - id: message-queues-and-async-039
    difficulty: advanced
    tags: [exactly-once, distributed-systems]
    question: |
      What is the most accurate statement about true end-to-end exactly-once
      delivery across heterogeneous systems?
    options:
      - "It is trivially achieved by flipping a single delivery.guarantee=exactly_once flag on the broker for the whole cluster"
      - "It is fully guaranteed end-to-end as long as producers never retry and every ack is treated as final"
      - "It is only impossible when the transport is UDP; any TCP-based pipeline gets end-to-end exactly-once for free"
      - "It is generally impossible to guarantee end-to-end; in practice you combine at-least-once delivery with idempotent, deduplicating consumers ('effectively-once')"
    answer: 3
    explanation: |
      Because a producer can never be certain a message was processed when acks are
      lost (a two-generals-style problem), true end-to-end exactly-once is
      unachievable across arbitrary systems. Practitioners get effectively-once via
      at-least-once + idempotency + dedup. No flag, transport, or no-retry rule
      changes this fundamental limit.
    ref: "concepts.md#delivery-semantics-at-most-once-at-least-once-exactly-once"
  - id: message-queues-and-async-040
    difficulty: advanced
    tags: [ordering, retries, in-flight]
    question: |
      To preserve ordering while allowing producer retries on a partition, modern
      Kafka permits max.in.flight.requests.per.connection up to 5 as long as which
      condition holds?
    options:
      - "acks is set to 0 so the producer never waits for a broker acknowledgment and thus cannot reorder on retry"
      - "The idempotent producer is enabled, so per-partition sequence numbers let the broker reject any out-of-order or duplicate batch (forcing an in-order retry), preserving order despite multiple in-flight requests"
      - "The topic is created with exactly one partition, which serializes all writes so in-flight count no longer matters"
      - "Consumers use enable.auto.commit=true, letting the broker reorder producer batches safely on the consumer's behalf"
    answer: 1
    explanation: |
      With the idempotent producer enabled, Kafka can keep up to 5 in-flight
      requests and still guarantee ordering: per-partition sequence numbers let the
      broker detect and reject a duplicate or out-of-order batch, so the producer
      retries it in the correct position rather than writing it out of order.
      Without idempotence you would need max.in.flight=1. acks=0, single partition,
      and auto-commit are irrelevant to this guarantee.
    ref: "concepts.md#ordering-and-partitioning"
  - id: message-queues-and-async-041
    difficulty: advanced
    tags: [outbox, atomicity, effect]
    question: |
      In a DIY effectively-once consumer, why must the dedup-marker insert and the
      business state change happen in the SAME database transaction?
    options:
      - "So a crash after applying the effect but before marking cannot cause a double-apply on redelivery, since the unique constraint rejects the replay"
      - "To reduce the number of open database connections by reusing one pooled connection for both writes"
      - "To make the queue drain faster by committing the offset and the ledger row in a single network round-trip"
      - "Because the broker's transactional protocol mandates that all consumer-side writes share one transaction"
    answer: 0
    explanation: |
      If the effect and dedup marker are in separate transactions, a crash between
      them lets a redelivery re-apply the effect (or mark without applying). Bundling
      them makes the operation atomic: on replay the unique constraint blocks the
      duplicate. It is about correctness, not connection count or broker rules.
    ref: "concepts.md#how-exactly-once-is-really-achieved"
  - id: message-queues-and-async-042
    difficulty: advanced
    tags: [scenario, broker-choice]
    question: |
      You are designing a payments event backbone: high throughput, must replay
      months of events for audit/reprocessing, strict per-account ordering, and you
      run mostly self-managed on-prem. Which choice best fits and why?
    options:
      - "SQS Standard, because its nearly unlimited throughput and 14-day retention cover both audit replay and per-account ordering needs"
      - "RabbitMQ classic queues, because they offer the highest throughput of any broker and stream months of history for on-prem audits"
      - "Kafka, because it gives per-partition (per-account) ordering, long replay via retention/tiered storage, and high throughput"
      - "SNS alone, because pub/sub topics guarantee strict per-subscriber ordering and durably retain events for later reprocessing"
    answer: 2
    explanation: |
      Kafka provides per-key ordering via partitions, replay via retention/tiered
      storage, and very high throughput, matching all requirements. SQS Standard
      lacks replay and strict ordering; RabbitMQ does not lead on throughput and
      lacks native long replay; SNS is pub/sub without ordering guarantees.
    ref: "concepts.md#kafka-vs-rabbitmq-vs-sqs-sns-vs-pulsar"
  - id: message-queues-and-async-043
    difficulty: advanced
    tags: [scenario, broker-choice]
    question: |
      Requirements: complex content-based routing to many queues, per-message
      priority, per-message TTL, request/reply RPC, and peak ~40k msgs/sec. Which
      broker is the best primary fit?
    options:
      - "Kafka, because partition keys handle content-based routing and consumer groups implement per-message priority natively"
      - "S3, because object tags let you prioritize retrieval and lifecycle rules act as a per-object TTL for routing"
      - "Kinesis, because each shard can be assigned a priority class and enhanced fan-out provides request/reply RPC"
      - "RabbitMQ, because exchanges provide flexible routing, priority queues, TTL, and RPC at this scale"
    answer: 3
    explanation: |
      RabbitMQ is purpose-built for rich routing, priority queues, per-message TTL,
      and RPC, and 40k/sec is within its range. Kafka lacks native priorities and
      per-message TTL; Kinesis shards don't do per-message priority; S3 is object
      storage, not a broker.
    ref: "concepts.md#kafka-vs-rabbitmq-vs-sqs-sns-vs-pulsar"
  - id: message-queues-and-async-044
    difficulty: advanced
    tags: [repartition, ordering]
    question: |
      Increasing a Kafka topic's partition count from 8 to 16 to add parallelism
      has which important side effect?
    options:
      - "It automatically preserves ordering for all existing keys by migrating each key's backlog to its new partition first"
      - "hash(key) % partitions changes, so keys remap to different partitions and per-key ordering across the change is broken"
      - "It deletes all existing data on the topic because the log segments must be rebuilt for the new partition layout"
      - "It reduces the replication factor proportionally, since replicas are redistributed across the larger partition set"
    answer: 1
    explanation: |
      Because partition assignment is hash(key) % numPartitions, adding partitions
      remaps keys and breaks per-key ordering across the transition. This is why you
      size partitions for peak up front. It does not delete data or change
      replication factor, and it does not preserve ordering.
    ref: "concepts.md#ordering-and-partitioning"
  - id: message-queues-and-async-045
    difficulty: advanced
    tags: [exactly-once, cost, tradeoff]
    question: |
      Why might a high-throughput team deliberately choose at-least-once +
      idempotency over Kafka transactional exactly-once, even for important data?
    options:
      - "Transactions add coordination overhead and latency and only apply within Kafka; at-least-once + idempotency is cheaper, works across external systems, and is equally correct in effect"
      - "At-least-once delivery is the only mechanism that can avoid message loss, since every other semantic silently drops data under failure"
      - "Exactly-once transactions periodically abort and roll back committed offsets, causing permanent data loss over time"
      - "Idempotency is impossible to implement in high-throughput systems because dedup lookups cannot keep up with the ingest rate"
    answer: 0
    explanation: |
      Kafka transactions cost throughput/latency and only cover the Kafka boundary,
      whereas at-least-once + idempotent, deduplicating consumers achieves the same
      end-state cheaply and across heterogeneous sinks. At-least-once is not the
      only loss-avoidance mechanism, EOS does not lose data, and idempotency scales
      fine.
    ref: "concepts.md#how-exactly-once-is-really-achieved"
  - id: message-queues-and-async-046
    difficulty: advanced
    tags: [dual-write, 2pc, tradeoff]
    question: |
      Why is the transactional outbox generally preferred over an XA/2PC
      distributed transaction spanning the database and Kafka?
    options:
      - "2PC is faster and simpler in every case because the coordinator resolves both participants in a single blocking round"
      - "Outbox guarantees true exactly-once delivery end-to-end without any consumer-side deduplication being required"
      - "2PC has blocking failure modes (a coordinator crash can lock resources) and poor broker support; outbox needs only a local transaction plus at-least-once publishing"
      - "Kafka natively supports XA distributed transactions with all major relational databases out of the box"
    answer: 2
    explanation: |
      2PC blocks on coordinator failure and is poorly supported by brokers like
      Kafka. The outbox restricts atomicity to one local DB transaction and relies
      on at-least-once publishing plus consumer dedup, which is far more operable.
      Outbox is at-least-once, not exactly-once, and Kafka does not offer broad XA
      support.
    ref: "concepts.md#the-outbox-pattern-and-change-data-capture"
  - id: message-queues-and-async-047
    difficulty: advanced
    tags: [consumer-lag, diagnosis]
    question: |
      Consumer lag is steadily climbing and approaching the topic's retention limit.
      Which action does NOT help and could make things worse?
    options:
      - "Scaling consumers out up to the partition count"
      - "Increasing per-consumer throughput via batching and async I/O"
      - "Adding partitions and rebalancing to raise the parallelism ceiling"
      - "Adding more consumers beyond the partition count"
    answer: 3
    explanation: |
      Beyond the partition count, extra consumers sit idle (a partition maps to one
      consumer per group) and only add rebalance churn. Scaling up to partition
      count, batching/async I/O, and adding partitions all genuinely raise
      throughput or the parallelism ceiling.
    ref: "concepts.md#consumer-groups-offsets-backpressure-and-consumer-lag"
  - id: message-queues-and-async-048
    difficulty: advanced
    tags: [watermark, event-time]
    question: |
      In stream processing, a watermark primarily controls:
    options:
      - "Which TLS cipher suite encrypts records as they travel between the broker and the stream processor"
      - "How long the system waits for late/out-of-order events before finalizing a window: a trade-off between completeness and latency"
      - "How many partitions a topic is split into, computed from the configured watermark interval"
      - "Which consumer group is assigned ownership of a given partition during a rebalance"
    answer: 1
    explanation: |
      Watermarks decide how long to wait for stragglers before closing an event-time
      window, trading result completeness against latency. They are unrelated to
      encryption, partition count, or consumer-group ownership.
    ref: "concepts.md#batch-vs-stream-processing"
  - id: message-queues-and-async-049
    difficulty: advanced
    tags: [fan-out, hybrid, feed]
    question: |
      Twitter/Instagram-style feeds often use a hybrid fan-out. What is the core
      reasoning?
    options:
      - "Push (fan-out on write) for normal users keeps reads cheap, while pull (fan-out on read) for celebrities avoids write storms; results are merged at read time"
      - "Pure push and pure pull have identical cost profiles, so the hybrid is chosen only for code-simplicity reasons"
      - "Hybrid means writing every post into a single shared global inbox that all users then read from directly"
      - "Hybrid eliminates the need for any timeline caching because merged results are always recomputed from source"
    answer: 0
    explanation: |
      Hybrid uses push for the many normal users (cheap reads) and pull for the few
      celebrities (avoids the write storm), merging at read time. Push and pull have
      opposite cost profiles, hybrid is not a single global inbox, and caching is
      still used.
    ref: "concepts.md#fan-out-patterns"
  - id: message-queues-and-async-050
    difficulty: advanced
    tags: [estimation, storage]
    question: |
      5 billion events/day at 500 bytes each with replication factor 3, retained 7
      days. Roughly how much on-disk storage is that, and what feature makes long
      retention economical?
    options:
      - "~2.5 GB total across the week; replication and retention add negligible overhead so no special storage feature is needed"
      - "~500 MB; log compaction plus gzip compression shrinks the raw events enough that ordinary local broker disks suffice"
      - "~52 TB (2.5 TB/day raw x 3 RF x 7 days); tiered storage to object storage (S3) makes long retention economical"
      - "~7 PB once replicated and retained; only aggressive cross-broker sharding of each partition can hold a dataset that large"
    answer: 2
    explanation: |
      5e9 x 500 B = 2.5 TB/day raw; x3 replication x7 days ~= 52 TB. Tiered storage
      offloads old segments to cheap object storage, making months of retention
      affordable. The other magnitudes are off by orders of magnitude.
    ref: "concepts.md#capacity-estimation-and-back-of-envelope"
  - id: message-queues-and-async-051
    difficulty: advanced
    tags: [retry-storm, resilience]
    question: |
      During a downstream outage, aggressive uncapped retries across many consumers
      create which failure mode, and what mitigates it?
    options:
      - "Exactly-once violations across the group; mitigate by disabling the idempotent producer so retries stop duplicating writes"
      - "Head-of-line blocking on the partition; mitigate by deleting the DLQ so poison messages are no longer held back"
      - "Consumer lag collapsing to zero and starving workers; mitigate by adding more partitions to create backlog"
      - "A retry storm that amplifies load; mitigate with capped attempts, backoff+jitter, and circuit breakers"
    answer: 3
    explanation: |
      Uncapped retries pile extra load onto an already-failing downstream (a retry
      storm). Capping attempts, backoff with jitter, and circuit breakers stop the
      amplification. The other options misdiagnose the failure or prescribe harmful
      fixes.
    ref: "concepts.md#dead-letter-queues-retries-and-poison-messages"
  - id: message-queues-and-async-052
    difficulty: advanced
    tags: [cdc, use-cases]
    question: |
      Beyond the outbox relay, Change Data Capture (CDC) is commonly used to:
    options:
      - "Encrypt the database at rest by streaming each row through a key-management service before it is persisted to disk"
      - "Turn a database into a stream of change events for cache invalidation, search-index sync, replicas, and data-lake ingestion"
      - "Replace the need for primary keys by deriving a synthetic row identity from the transaction-log offset of each change"
      - "Guarantee synchronous strong consistency across services by blocking each write until every downstream replica confirms"
    answer: 1
    explanation: |
      CDC streams row-level changes from the DB log, powering cache invalidation,
      search sync, replication, and lake ingestion. It is not an encryption tool,
      does not remove primary keys, and yields eventual (not synchronous strong)
      consistency downstream.
    ref: "concepts.md#the-outbox-pattern-and-change-data-capture"
  - id: message-queues-and-async-053
    difficulty: advanced
    tags: [at-most-once, tradeoff]
    question: |
      For a firehose of metrics samples where an occasional lost data point is
      acceptable but you want minimal overhead, which delivery semantic is the
      rational choice?
    options:
      - "At-most-once, accepting rare loss to avoid retry cost and duplicates"
      - "Exactly-once via broker transactions on every sample, to be maximally safe"
      - "At-least-once backed by a large dedup table recording every sample's key"
      - "Synchronous two-phase commit per sample for durable acknowledgment"
    answer: 0
    explanation: |
      For high-volume, low-value telemetry, at-most-once is rational: it avoids
      retry overhead and duplicates, and a dropped sample is inconsequential.
      Exactly-once/2PC adds needless coordination cost, and at-least-once + dedup
      adds storage/latency for no real benefit here.
    ref: "concepts.md#delivery-semantics-at-most-once-at-least-once-exactly-once"
  - id: message-queues-and-async-054
    difficulty: advanced
    tags: [dlq, operations]
    question: |
      Which practice turns a DLQ from a safety net into a silent data-loss bug?
    options:
      - "Alarming when DLQ depth exceeds zero and redriving messages after the root cause is fixed"
      - "Preserving the original message payload and headers so failures can be inspected and replayed"
      - "Never monitoring the DLQ, so messages accumulate unnoticed and are eventually purged"
      - "Capping the number of main-queue retries before a message is moved to dead-lettering"
    answer: 2
    explanation: |
      An unmonitored DLQ hides failed messages until they expire, becoming silent
      data loss. Alarming on depth, redriving after root-cause fixes, preserving
      payloads, and capping retries are all correct DLQ hygiene.
    ref: "concepts.md#dead-letter-queues-retries-and-poison-messages"
  - id: message-queues-and-async-055
    difficulty: advanced
    tags: [scenario, sync-vs-async]
    question: |
      A checkout flow currently makes synchronous calls to inventory, email, and
      analytics before returning to the user, causing high tail latency and cascading
      failures when email is slow. What is the best redesign?
    options:
      - "Keep every call synchronous but wrap the email service in a tight retry loop with a longer timeout, so a slow provider cannot stall the checkout"
      - "Cache the email service's SMTP responses in Redis so repeat sends return instantly and the checkout call no longer waits on the mail provider"
      - "Move inventory reservation onto the async queue as well, so the checkout returns immediately and nothing at all blocks the user's confirmation"
      - "Return after committing the order and the essential inventory reservation, then emit an event so email/analytics run asynchronously off a queue"
    answer: 3
    explanation: |
      Only work the user must wait for (order commit, inventory reservation) should
      stay synchronous; non-essential side effects (email, analytics) belong on an
      async queue, removing them from the latency/failure path. Adding email retries
      keeps the coupling; making inventory async could oversell; caching an email
      send is nonsensical.
    ref: "concepts.md#why-asynchronous-messaging-and-when-it-hurts"
  - id: message-queues-and-async-056
    difficulty: advanced
    tags: [auto-commit, data-loss]
    question: |
      A team uses Kafka with enable.auto.commit=true (every 5s) and processes each
      record with a slow external call. Occasionally records seem to vanish
      unprocessed. What is the likely cause?
    options:
      - "The broker is applying retention and deleting records early, before the slow consumer has had a chance to fetch and process them"
      - "Auto-commit advanced the offset for polled records before the slow processing finished; a crash then skipped them (silent loss)"
      - "The replication factor is set too low, so a follower broker drops records the leader had already handed to the consumer"
      - "Two consumers in the group are being assigned the same partition and processing each record twice, corrupting the offset"
    answer: 1
    explanation: |
      Auto-commit can commit offsets for records that have been polled but not yet
      fully processed; a crash then resumes past them, silently losing work. The fix
      is manual commit after processing. It is not early broker deletion, replication
      factor, or double-processing.
    ref: "concepts.md#consumer-groups-offsets-backpressure-and-consumer-lag"
  - id: message-queues-and-async-057
    difficulty: advanced
    tags: [bloom-filter, dedup, tradeoff]
    question: |
      You consider a Bloom filter as a space-efficient dedup store for an enormous
      key space. What is the specific risk you must accept?
    options:
      - "False positives can mark a genuinely new message as already-seen, dropping it; acceptable only if a rare skip is tolerable"
      - "False negatives are common, so an already-seen key routinely reports as new and every duplicate is reprocessed"
      - "It consumes more memory than a full hash set once the key space grows large, defeating the space savings"
      - "It cannot answer membership queries at all and can only estimate the total cardinality of the key stream"
    answer: 0
    explanation: |
      Bloom filters have false positives (never false negatives), so a new message
      could be wrongly judged a duplicate and skipped. That is acceptable only when a
      rare drop is tolerable. It saves memory versus a full set and does answer
      membership queries.
    ref: "concepts.md#idempotency-and-deduplication"
  - id: message-queues-and-async-058
    difficulty: advanced
    tags: [ordering, global, design-smell]
    question: |
      A candidate proposes strict global total ordering for all events in a
      high-throughput system by using a single partition. What is the correct
      critique?
    options:
      - "It is the ideal design and should always be the default choice whenever any ordering matters, at any scale"
      - "Global total ordering is fundamentally impossible even with a single partition, so the proposal cannot ever work"
      - "A single partition serializes everything, capping throughput and parallelism; prefer per-entity ordering plus version numbers for conflict detection"
      - "A single partition automatically increases consumer parallelism because the whole group can read it concurrently"
    answer: 2
    explanation: |
      One partition gives global order but serializes all traffic, destroying
      parallelism and throughput, usually a design smell. Order per business key and
      use version numbers for conflict detection instead. Global order is possible
      with one partition but at a steep cost; it does not add parallelism.
    ref: "concepts.md#ordering-and-partitioning"
  - id: message-queues-and-async-059
    difficulty: advanced
    tags: [pulsar, subscription-modes]
    question: |
      Which Pulsar subscription mode makes a topic behave like a shared work queue
      (competing consumers, per-message ack)?
    options:
      - "Exclusive"
      - "Read-only"
      - "Failover"
      - "Shared"
    answer: 3
    explanation: |
      Pulsar's Shared subscription distributes messages across multiple consumers
      round-robin with per-message ack, i.e., queue-like semantics. Exclusive and
      Failover give single-active-consumer streaming semantics; "Read-only" is not a
      Pulsar subscription mode.
    ref: "concepts.md#kafka-vs-rabbitmq-vs-sqs-sns-vs-pulsar"
  - id: message-queues-and-async-060
    difficulty: advanced
    tags: [scenario, batch-vs-stream, cost]
    question: |
      Leadership wants "real-time" dashboards, but the business only reviews the
      numbers once a day and the streaming pipeline would cost 5x an hourly batch
      job. What is the principled recommendation?
    options:
      - "Always choose streaming here; real-time pipelines are strictly better and future-proof the dashboard for any later need"
      - "Use batch (hourly/daily) since the value does not decay in seconds; streaming adds cost and complexity with no business benefit here"
      - "Use streaming but aggressively downsample the event stream to a fraction of records, cutting the 5x cost back down to batch levels"
      - "Use a single-partition Kafka topic to force strict global ordering, which is what makes the daily dashboard numbers trustworthy"
    answer: 1
    explanation: |
      If results are consumed daily, batch is cheaper and simpler and meets the need;
      streaming's low latency buys nothing when value does not decay fast. Streaming
      is not universally better, downsampling does not fix the mismatch, and
      single-partition ordering is irrelevant.
    ref: "concepts.md#batch-vs-stream-processing"
  - id: message-queues-and-async-061
    difficulty: expert
    tags: [kafka, transactions, isolation]
    question: |
      A downstream consumer of a transactional Kafka producer occasionally sees
      records that later get rolled back, causing incorrect state. What configuration
      fixes this and what is the cost?
    options:
      - "Set isolation.level=read_committed so aborted/uncommitted records are filtered, at the cost of some added latency (waiting for commit markers)"
      - "Set isolation.level=read_uncommitted; it is faster and just as safe because the broker never surfaces records that will later abort"
      - "Disable the transactional.id on the producer so batches commit individually and no multi-record rollback can ever occur"
      - "Increase max.poll.records so the consumer fetches larger batches and automatically skips past any records that were aborted"
    answer: 0
    explanation: |
      read_committed makes consumers skip uncommitted/aborted records, fixing the
      dirty read, but adds latency because the consumer waits for transaction commit
      markers (LSO). read_uncommitted is exactly the buggy behavior; removing
      transactional.id or bumping max.poll.records does not filter aborts.
    ref: "concepts.md#how-exactly-once-is-really-achieved"
  - id: message-queues-and-async-062
    difficulty: expert
    tags: [outbox, ordering, cross-aggregate]
    question: |
      Using CDC on an outbox table gives per-row atomic publishing, but a reviewer
      asks about ordering guarantees. What is the accurate caveat?
    options:
      - "CDC guarantees global total ordering across all aggregates automatically, because it tails the single serialized database transaction log"
      - "Outbox eliminates all ordering concerns, since rows are published in strict primary-key order regardless of which aggregate wrote them"
      - "Ordering across different aggregates/keys needs care; you get ordering per key/partition, so events for unrelated aggregates may interleave and cross-aggregate causal order is not guaranteed by default"
      - "CDC reverses the order of all events, emitting the most recent change first because it reads the transaction log backward from the tail"
    answer: 2
    explanation: |
      Outbox+CDC preserves order within a key/partition, but events across different
      aggregates can interleave and cross-aggregate causal ordering is not
      guaranteed without extra design (e.g., partitioning by a shared key or
      sequence). CDC neither guarantees global order nor reverses events, and outbox
      does not remove ordering concerns.
    ref: "concepts.md#the-outbox-pattern-and-change-data-capture"
  - id: message-queues-and-async-063
    difficulty: expert
    tags: [exactly-once, sink, idempotent-sink]
    question: |
      A Kafka Streams job with processing.guarantee=exactly_once_v2 writes results to
      an external Elasticsearch index. A user claims the whole pipeline is now
      exactly-once end-to-end. What is the precise correction?
    options:
      - "Correct; exactly_once_v2 extends the Kafka transaction to enroll the Elasticsearch write, so the index update commits or aborts atomically with the offsets"
      - "You must disable EOS before writing to Elasticsearch, because the transactional producer refuses to flush records to any non-Kafka external sink"
      - "Elasticsearch enlists as a transactional participant with Kafka via a two-phase commit connector, so the end-to-end claim holds as stated"
      - "The EOS guarantee stops at Kafka's boundary; the Elasticsearch write is a separate side effect that must be made idempotent (e.g., deterministic document IDs / upserts) to avoid duplicates"
    answer: 3
    explanation: |
      Kafka EOS is bounded by Kafka; an external sink like Elasticsearch is not part
      of the transaction, so the write must be idempotent (deterministic IDs /
      upserts) to be effectively-once. Elasticsearch is not transactional with Kafka,
      and disabling EOS is unnecessary and counterproductive.
    ref: "concepts.md#how-exactly-once-is-really-achieved"
  - id: message-queues-and-async-064
    difficulty: expert
    tags: [rebalance, static-membership, cooperative]
    question: |
      Frequent consumer restarts cause "stop-the-world" rebalances that pause the
      whole group. Which pair of modern Kafka features most directly reduces this
      disruption?
    options:
      - "Setting acks=all with a larger batch.size, so durable batched writes let restarting consumers rejoin without triggering a group rebalance"
      - "Static group membership (group.instance.id) and cooperative (incremental) rebalancing"
      - "A higher replication factor plus more brokers, spreading partitions so a single consumer restart no longer forces the whole group to pause"
      - "read_committed isolation combined with transactions, which lets the coordinator skip reassignment for consumers that only read committed records"
    answer: 1
    explanation: |
      Static membership avoids reassigning partitions on brief restarts, and
      cooperative/incremental rebalancing revokes only affected partitions instead of
      all of them, cutting stop-the-world pauses. Producer acks/batching, replication,
      and isolation level do not address rebalance disruption.
    ref: "concepts.md#consumer-groups-offsets-backpressure-and-consumer-lag"
  - id: message-queues-and-async-065
    difficulty: expert
    tags: [scenario, ordering, poison, tradeoff]
    question: |
      In a strictly ordered per-account payment stream, a single message for account
      A is a genuine poison message (will never succeed). You cannot skip it without
      violating order for account A, but blocking stalls the partition, which also
      carries other accounts. What is the most defensible resolution?
    options:
      - "Park the entire key/account A (e.g., route its subsequent messages to a per-key holding area or a dedicated retry stream) and alert, so other accounts on the partition keep flowing while A's order is preserved for later reconciliation"
      - "Silently drop the poison message and commit past it so the partition keeps flowing, since throughput matters more than one stuck account"
      - "Increase max.in.flight.requests so the consumer can skip ahead of the poison message and process later records on the same partition first"
      - "Delete and recreate the partition to clear the poison message, then let the producer replay account A's traffic into the fresh partition"
    answer: 0
    explanation: |
      The correct approach isolates account A (park its key / route to a dedicated
      area) and alerts, preserving A's ordering for reconciliation while other
      accounts progress. Silent dropping loses a payment, in-flight tuning does not
      let you skip within a partition safely, and deleting the partition destroys data
      and ordering for everyone.
    ref: "concepts.md#dead-letter-queues-retries-and-poison-messages"
  - id: message-queues-and-async-066
    difficulty: expert
    tags: [zombie, fencing, transactions]
    question: |
      In Kafka transactions, why does the transactional.id enable "zombie fencing,"
      and what problem does it solve?
    options:
      - "It groups messages under a shared id so the broker can compress them together into one segment and save disk on the transaction log"
      - "It derives an encryption key from the id and encrypts the transaction log so a zombie producer cannot read committed offsets"
      - "Each transactional.id maps to a producer epoch; when a new producer instance initializes, it bumps the epoch and fences out an older 'zombie' instance whose writes/commits are then rejected, preventing duplicate or conflicting transactional writes after a hung/restarted producer"
      - "It lets multiple producer instances share one partition and write concurrently by relaxing the per-partition ordering guarantee for that id"
    answer: 2
    explanation: |
      A stable transactional.id ties to a monotonically increasing epoch; a
      re-initialized producer bumps the epoch so a stale/zombie predecessor is
      fenced (its writes rejected), preventing duplicate transactional writes. It has
      nothing to do with compression, encryption, or removing ordering.
    ref: "concepts.md#how-exactly-once-is-really-achieved"
  - id: message-queues-and-async-067
    difficulty: expert
    tags: [scenario, cost, at-scale]
    question: |
      At 500k messages/sec sustained, a team debates SQS (per-request pricing, zero
      ops) vs self-managed Kafka. What is the most accurate trade-off framing?
    options:
      - "SQS is always cheaper at any scale because being fully managed removes servers, and per-request pricing only ever falls as monthly volume grows"
      - "There is essentially no cost difference between the two at this scale, so the team should just pick whichever product their org already has support for"
      - "Kafka is always both cheaper and simpler than SQS, since running your own brokers avoids per-message fees and needs no ongoing operational effort"
      - "SQS minimizes ops and is great to start, but per-request cost and lack of replay can make it expensive and limiting at very high sustained volume; Kafka (or MSK) amortizes cost via batching/log storage and adds replay, at the price of operational burden"
    answer: 3
    explanation: |
      The real trade-off is ops-simplicity/pay-per-use (SQS) versus
      cost-amortization + replay at high sustained volume (Kafka/MSK) with more ops
      burden. Neither is universally cheaper; managed convenience and per-request cost
      cut opposite ways at scale, and the choice is driven by constraints, not
      branding.
    ref: "concepts.md#kafka-vs-rabbitmq-vs-sqs-sns-vs-pulsar"
  - id: message-queues-and-async-068
    difficulty: expert
    tags: [saga, distributed-transaction, async]
    question: |
      A multi-service booking (flight + hotel + car) cannot use a distributed ACID
      transaction. Using async messaging, which pattern maintains consistency and
      what is its key property?
    options:
      - "A synchronous two-phase-commit coordinator spanning all three services, holding locks on each until every participant votes to commit the booking together"
      - "A Saga: a sequence of local transactions coordinated via events/messages, with compensating transactions to undo prior steps on failure; it provides atomicity-like outcomes with eventual consistency, not isolation"
      - "A single shared database table that all three services lock for the entire duration of the booking, so the whole reservation commits or rolls back as one row"
      - "Ignore partial failures entirely, since moving the steps onto async messaging makes any individual booking step effectively impossible to fail"
    answer: 1
    explanation: |
      A Saga chains local transactions via messages, using compensations to roll back
      completed steps on failure, achieving an all-or-nothing business outcome under
      eventual consistency (no global isolation). 2PC and a shared lock defeat the
      purpose of loose coupling, and failures are certainly still possible in async.
    ref: "concepts.md#the-outbox-pattern-and-change-data-capture"
  - id: message-queues-and-async-069
    difficulty: expert
    tags: [ordering, dedup, version]
    question: |
      With at-least-once delivery AND possible reordering, you must apply the LATEST
      state per entity correctly. Which single technique handles both duplicates and
      out-of-order updates?
    options:
      - "Conditional writes using a monotonically increasing version/sequence number: reject any update whose version is not newer than the stored one"
      - "A larger visibility timeout on the queue, so an in-flight update is never redelivered until the previous one has fully committed the entity"
      - "Round-robin partition assignment across consumers, so each update for an entity is spread evenly and cannot arrive out of order"
      - "Increasing the consumer count to match the partitions, so every update is applied fast enough that reordering never has time to occur"
    answer: 0
    explanation: |
      A version/sequence check (compare-and-set, reject non-newer) makes a replayed
      duplicate a no-op AND discards a stale out-of-order update, solving both at
      once. Visibility timeout, partition strategy, and consumer count address
      neither reordering nor dedup semantics.
    ref: "concepts.md#idempotency-and-deduplication"
  - id: message-queues-and-async-070
    difficulty: expert
    tags: [tiered-storage, kraft, modern]
    question: |
      Which statement about modern Kafka (3.x+) operational features is accurate?
    options:
      - "KRaft mode adds a second, standby ZooKeeper ensemble alongside the first for extra metadata redundancy and faster controller failover"
      - "Tiered storage requires deleting all data older than 24 hours from the cluster before cold segments can be moved to the object-storage tier"
      - "KRaft replaces ZooKeeper by storing cluster metadata in an internal Raft quorum, and tiered storage offloads older log segments to object storage so retention can grow cheaply without large local disks"
      - "KRaft eliminates partitions entirely, replacing them with a single Raft-managed log that all consumers in every group read from directly"
    answer: 2
    explanation: |
      KRaft removes ZooKeeper by keeping metadata in a Raft-based quorum, and tiered
      storage moves cold segments to object storage for cheap long retention. KRaft
      does not add ZooKeeper, tiered storage extends (not shortens) retention, and
      partitions remain fundamental.
    ref: "concepts.md#kafka-vs-rabbitmq-vs-sqs-sns-vs-pulsar"
  - id: message-queues-and-async-071
    difficulty: expert
    tags: [scenario, exactly-once, external-effect]
    question: |
      A consumer must (1) charge a card via an external payment API and (2) update a
      local ledger, under at-least-once delivery. The payment API has its own
      idempotency-key support. What is the most robust design?
    options:
      - "Charge the card first, then update the local ledger in a separate step with no idempotency key, relying on crashes between the two being rare enough to ignore"
      - "Disable consumer retries entirely so a failed message is never redelivered, guaranteeing the external charge can physically execute only one single time"
      - "Wrap the external payment API call inside a Kafka transaction so the charge commits or aborts atomically with the offsets, making it exactly-once end-to-end"
      - "Send a stable idempotency key (derived from the message/business ID) to the payment API so retries do not double-charge, and record the charge result plus a dedup marker in the same local ledger transaction"
    answer: 3
    explanation: |
      Pushing the idempotency key to the payment API prevents double charges on
      retry, and bundling the ledger update with a dedup marker in one local
      transaction makes local state effectively-once. Kafka transactions cannot cover
      an external API; disabling retries risks losing charges; and an unguarded
      two-step design double-charges on replay.
    ref: "concepts.md#how-exactly-once-is-really-achieved"
  - id: message-queues-and-async-072
    difficulty: expert
    tags: [scenario, backpressure, oom]
    question: |
      A Kafka consumer reads fast but writes to a slow database; under load it OOMs.
      Investigation shows it buffers polled records in memory awaiting DB writes.
      What is the correct fix?
    options:
      - "Increase max.poll.records so it fetches even more per poll, letting the consumer batch larger DB writes and clear its in-memory buffer faster"
      - "Apply downstream backpressure: pause partition consumption (or reduce fetch/max.poll.records) so the consumer only pulls what the DB can absorb, keeping the backlog in the durable log instead of memory"
      - "Add more partitions to the topic so the buffered records are spread across additional consumer threads and no single heap holds them all"
      - "Switch the upstream producer to acks=0 so records are written faster, easing the pressure that is filling the slow consumer's memory buffer"
    answer: 1
    explanation: |
      The consumer must propagate backpressure from the slow DB by pausing/limiting
      fetches so unprocessed data stays in Kafka's durable log, not memory. Fetching
      more worsens the OOM, extra partitions do not fix an in-memory buffer, and
      producer acks are unrelated to the consumer's memory pressure.
    ref: "concepts.md#consumer-groups-offsets-backpressure-and-consumer-lag"
  - id: message-queues-and-async-073
    difficulty: intermediate
    tags: [sqs, in-flight, limits]
    question: |
      Which is a real, notable SQS limit a designer should account for?
    options:
      - "Maximum message size is 256 KB and retention is at most 14 days; larger payloads use the Extended Client Library with S3"
      - "Maximum message size is 1 GB, with retention configurable up to 90 days and no separate library needed for large payloads"
      - "Messages are retained forever by default and are only deleted once every consumer in the account has explicitly acknowledged them"
      - "FIFO queues offer unlimited throughput with no configuration, automatically scaling ordering guarantees to any producer rate"
    answer: 0
    explanation: |
      SQS caps messages at 256 KB and retention at 14 days, with the Extended Client
      Library (S3-backed) for larger payloads. Messages are not retained forever, and
      FIFO throughput is bounded (300/s, 3,000 batched, up to 70k/s high-throughput
      mode).
    ref: "concepts.md#capacity-estimation-and-back-of-envelope"
  - id: message-queues-and-async-074
    difficulty: intermediate
    tags: [pub-sub, durable-subscription]
    question: |
      In classic pub/sub, why might a subscriber that was offline miss messages, and
      how is this addressed?
    options:
      - "Pub/sub always retains everything on the broker indefinitely, so subscribers can never miss messages regardless of how long they stay offline"
      - "Increase the broker's per-message size limit so larger payloads can be buffered on disk while a subscriber is temporarily disconnected"
      - "Transient pub/sub is fire-and-forget; attach a durable per-subscriber queue (e.g., SNS to SQS) so messages are held while the subscriber is down"
      - "Switch the producer to at-most-once delivery, which forces the broker to persist a replay copy for each offline subscriber"
    answer: 2
    explanation: |
      Classic pub/sub delivery is often transient, so an offline subscriber misses
      messages unless a durable subscription/queue buffers them (SNS to SQS being the
      canonical fix). Retention is not automatic in transient pub/sub; message size
      and producer semantics are unrelated.
    ref: "concepts.md#queue-vs-pub-sub-vs-log-based-streaming"
  - id: message-queues-and-async-075
    difficulty: advanced
    tags: [scenario, model-choice]
    question: |
      One order event must feed: (a) a search indexer, (b) a fraud stream processor
      that needs to replay 30 days after a rule change, and (c) an email sender that
      needs each message once. Which architecture best serves all three?
    options:
      - "A single SQS queue shared by all three consumers, where each consumer competes for messages and rewinds to an older position whenever fraud needs to replay 30 days"
      - "An SNS topic with no durable subscribers, relying on the broker's in-memory buffer to re-deliver the last 30 days whenever the fraud processor reconnects"
      - "Three synchronous HTTP calls from the order service, buffering 30 days of history in the caller so the fraud step can replay after a rule change"
      - "Publish to a retained log (Kafka): each consumer group reads independently; fraud can replay from an earlier offset; email uses its own group for once-processing with idempotency"
    answer: 3
    explanation: |
      A retained log gives independent consumer groups, replay for the fraud
      processor after a rule change, and per-group consumption (email once, with
      idempotency). A shared SQS queue would let one consumer delete a message before
      others read it and cannot replay; sync HTTP couples everything; SNS without
      durable subscribers loses messages and cannot replay.
    ref: "concepts.md#queue-vs-pub-sub-vs-log-based-streaming"
  - id: message-queues-and-async-076
    difficulty: intermediate
    tags: [tradeoff, decision]
    question: |
      What is the best one-line summary of the fundamental bet every async
      messaging design makes?
    options:
      - "Async is always superior to synchronous calls because it strictly improves latency, consistency, and correctness at the same time"
      - "Decoupling and buffering are worth the added latency, eventual consistency, and duplicate/ordering handling"
      - "Queues remove the need to think about failure, since the broker transparently retries and reconciles every error for you"
      - "Exactly-once is free once you add a broker, so idempotency and dedup logic become unnecessary in every design"
    answer: 1
    explanation: |
      The core trade-off is that you accept latency, eventual consistency, and
      duplicate/ordering handling in exchange for decoupling and buffering. Async is
      not universally superior, queues add failure modes rather than removing them,
      and exactly-once is never free.
    ref: "concepts.md#trade-offs-and-when-to-use-what"
  - id: message-queues-and-async-077
    difficulty: advanced
    tags: [retry-amplification, resilience, call-graph]
    question: |
      A logical request traverses 3 async hops, and each hop independently retries
      up to 3 times on failure. During a partial downstream brownout, roughly how
      much can offered load amplify at the deepest layer, and what is the core
      lesson?
    options:
      - "About 3x; retries add linearly across hops, so the deepest layer only ever sees the sum of each hop's attempts"
      - "Up to 27x (3^3); retries multiply through the call graph, so you should retry at only one layer and use a retry budget"
      - "No amplification at all; the queues sit between hops and fully absorb every retry so downstream load stays flat"
      - "About 6x; each hop simply doubles the offered load, so three hops yield roughly two times three attempts"
    answer: 1
    explanation: |
      Retries multiply multiplicatively through a call graph: 3 hops x 3 attempts =
      up to 3^3 = 27 downstream attempts per logical request. The lesson is to retry
      at a single layer and bound total retry load with a budget, not to retry at
      every hop. Amplification is multiplicative, not linear or doubling, and the
      queue does not neutralize it.
    ref: "concepts.md#retry-amplification-retry-budgets-and-metastable-failures"
  - id: message-queues-and-async-078
    difficulty: expert
    tags: [metastable-failure, retries, outage]
    question: |
      After a brief latency blip, your async pipeline stays saturated and unhealthy
      even though the original trigger is long gone; load never subsides on its own.
      What is happening and what actually recovers it?
    options:
      - "A metastable failure: a retry/work-amplification feedback loop sustains overload after the trigger clears; recovery requires breaking the loop (shed load, drop retries, drain, or restart), not waiting"
      - "Normal eventual consistency working as intended; the backlog will fully self-heal on its own if you simply wait longer for propagation to catch up"
      - "A hardware fault in the broker's storage layer; replace the disks and the amplifying load will subside once I/O latency returns to normal"
      - "A schema mismatch introduced by a recent deploy; roll back the producer and the saturated pipeline will drain back to healthy on its own"
    answer: 0
    explanation: |
      This is the classic metastable failure: a self-sustaining feedback loop
      (usually retries) keeps the system in a bad stable state after the trigger is
      gone. It does not self-heal by waiting; you must break the loop by shedding
      load, dropping retries, draining, or restarting. It is not a disk or schema
      issue, and waiting does not help.
    ref: "concepts.md#retry-amplification-retry-budgets-and-metastable-failures"
  - id: message-queues-and-async-079
    difficulty: advanced
    tags: [retry-budget, load-shedding]
    question: |
      Why is a "retry budget" (cap retries at, say, 10% of total traffic) often
      preferred over a fixed per-request retry count in a large async system?
    options:
      - "It guarantees exactly-once delivery by ensuring no message is ever retried beyond the budgeted fraction of traffic"
      - "It removes the need for idempotency because capping aggregate retries makes any single duplicate delivery structurally impossible"
      - "It bounds total extra load from retries to a small multiplier during an outage, whereas fixed per-request retries can amplify load unboundedly exactly when the system is weakest"
      - "It makes individual requests faster by letting the budgeted retries run in parallel across the consumer pool"
    answer: 2
    explanation: |
      A retry budget clamps aggregate retry load to a bounded fraction of traffic, so
      an outage cannot trigger a 10x-27x amplification the way fixed per-request
      retries can. It does not provide exactly-once, remove the need for idempotency,
      or speed up a single request; it protects the system as a whole.
    ref: "concepts.md#retry-amplification-retry-budgets-and-metastable-failures"
  - id: message-queues-and-async-080
    difficulty: advanced
    tags: [retries, idempotency, error-classification]
    question: |
      Which errors are safe and sensible to retry automatically in an async
      consumer, and which should NOT be retried?
    options:
      - "Retry everything indiscriminately, including deterministic validation errors, so that no message is ever lost regardless of why it failed"
      - "Retry only the deterministic 400/validation errors and skip transient timeouts, since a validation failure is the kind most likely to succeed on a second attempt"
      - "Never retry anything under any circumstance; always dead-letter every failed message immediately even for a one-off network timeout"
      - "Retry transient, retryable errors (timeouts, 503, 429) on idempotent operations; do NOT retry deterministic errors like a 400/validation failure, which will fail identically forever (a poison message)"
    answer: 3
    explanation: |
      Retries help only for transient/retryable failures on idempotent work; a
      deterministic validation error (400) will fail every time and should go to a
      DLQ, not a retry loop. Retrying everything wastes resources and can double
      side effects; never-retry throws away recoverable blips; and it is the transient
      errors, not the deterministic ones, that are worth retrying.
    ref: "concepts.md#retry-amplification-retry-budgets-and-metastable-failures"
  - id: message-queues-and-async-081
    difficulty: expert
    tags: [rebalance, timeouts, kafka]
    question: |
      A Kafka consumer heartbeats fine (background thread) but occasionally takes 6
      minutes to process a batch, and the group keeps rebalancing. Which timeout is
      being violated and what is the targeted fix?
    options:
      - "session.timeout.ms is being missed because the slow batch blocks heartbeats; fix by lowering heartbeat.interval.ms so heartbeats fire more often"
      - "max.poll.interval.ms is exceeded, so the coordinator evicts the consumer as stuck; fix by lowering max.poll.records or raising max.poll.interval.ms so batches finish in time"
      - "request.timeout.ms is exceeded on the fetch call during the long batch; fix by increasing the topic's replication factor for more durable reads"
      - "connections.max.idle.ms closes the coordinator socket mid-batch; fix by adding more brokers so the connection is rebalanced before it idles out"
    answer: 1
    explanation: |
      Since KIP-62 heartbeats run on a background thread, so a slow batch does not
      miss heartbeats or trip session.timeout.ms; instead it exceeds
      max.poll.interval.ms (the max gap between poll calls), so the coordinator evicts
      the consumer as stuck. Fix by shrinking batches (max.poll.records) or raising
      the poll interval. The other timeouts and remedies are unrelated.
    ref: "concepts.md#rebalance-protocols-storms-and-mitigation"
  - id: message-queues-and-async-082
    difficulty: advanced
    tags: [rebalance, cooperative, static-membership]
    question: |
      During rolling deploys, your consumer group suffers long stop-the-world pauses
      as each pod restarts. Which combination most directly minimizes disruption?
    options:
      - "Eager rebalancing plus a higher replication factor, so partitions are reassigned all at once but land on well-replicated brokers during each pod restart"
      - "Cooperative (incremental) rebalancing plus static membership (group.instance.id), so only moved partitions are revoked and brief restarts reclaim partitions without a full rebalance"
      - "acks=all on the producer plus a larger batch.size, so durable batched writes let restarting consumers rejoin without a group-wide pause"
      - "read_committed isolation combined with transactions, so the coordinator can skip reassigning partitions for consumers that only read committed records"
    answer: 1
    explanation: |
      Cooperative/incremental rebalancing revokes only the partitions that must move
      (not all of them), and static membership lets a pod that rejoins within
      session.timeout.ms reclaim its partitions with no rebalance at all -- exactly
      what smooths rolling deploys. Eager rebalancing is the stop-the-world default
      you want to avoid; producer/isolation settings do not affect rebalance
      disruption.
    ref: "concepts.md#rebalance-protocols-storms-and-mitigation"
  - id: message-queues-and-async-083
    difficulty: expert
    tags: [static-membership, failover, tradeoff]
    question: |
      Static group membership smooths restarts, but what is its important downside if
      a static member truly crashes and does not come back?
    options:
      - "It permanently corrupts the consumer offsets for the crashed member, forcing the whole group to reset to the earliest position and reprocess everything"
      - "Its partitions stay unassigned and idle (unconsumed) until session.timeout.ms expires, delaying failover"
      - "It forces the topic to discard all retained data for the affected partitions once the static member fails to check in on schedule"
      - "It silently disables cooperative rebalancing across the entire cluster, reverting every consumer group back to eager stop-the-world rebalancing"
    answer: 1
    explanation: |
      Static membership deliberately avoids rebalancing on brief absences, so a
      genuinely dead member's partitions are not reassigned until session.timeout.ms
      elapses -- delaying failover. That is the trade-off against smoother restarts:
      it does not corrupt offsets, lose data, or disable cooperative rebalancing.
    ref: "concepts.md#rebalance-protocols-storms-and-mitigation"
  - id: message-queues-and-async-084
    difficulty: advanced
    tags: [log-vs-queue, ack-model]
    question: |
      What is the deepest structural difference between a log (Kafka) and a queue
      (SQS/RabbitMQ) that explains most of their behavioral contrasts?
    options:
      - "The log simply uses more disk than the queue, and this larger storage footprint is what explains their different redelivery and priority behavior"
      - "The queue is always faster than the log for every workload, and that raw latency gap is the root cause of all their behavioral contrasts"
      - "The log tracks a single monotonic committed offset (cursor) per partition, while the queue tracks per-message acknowledgment, so redelivery, selective ack, TTL, and priority behave differently"
      - "The log fundamentally cannot have more than one consumer per topic, whereas the queue can, and that consumer-count limit drives their contrasts"
    answer: 2
    explanation: |
      The per-message-ack (queue) versus monotonic-offset-cursor (log) distinction is
      the root cause: it dictates redelivery granularity, whether you can ack out of
      order, native per-message TTL/priority, and head-of-line behavior. Disk usage,
      raw speed, and consumer count are downstream or incorrect framings.
    ref: "concepts.md#the-log-versus-queue-distinction-at-depth"
  - id: message-queues-and-async-085
    difficulty: advanced
    tags: [log-vs-queue, redelivery]
    question: |
      In a Kafka partition, you process offset 4 successfully but offset 3 (earlier)
      failed. Why can't you simply "ack 4 and leave 3 for later" like a queue would?
    options:
      - "Because a committed offset is monotonic: committing offset 4 implies 0-4 are done, so you cannot durably mark 4 complete while 3 is outstanding"
      - "Because Kafka automatically deletes offset 3 the moment a later offset is committed, so there is nothing left to reprocess for the failed record"
      - "Because a failed offset like 3 is automatically relocated to a different partition for retry, so it is no longer available on the original partition"
      - "You can do exactly this; Kafka natively supports per-message selective acknowledgment, letting you ack 4 and leave 3 pending just like a queue"
    answer: 0
    explanation: |
      A log tracks one monotonic committed offset per partition, so committing 4
      asserts everything through 4 is handled -- there is no per-message selective
      ack. Redelivery means rewinding the cursor and reprocessing the tail. Kafka
      does not auto-delete or relocate a single offset, and it has no native
      per-message selective ack.
    ref: "concepts.md#the-log-versus-queue-distinction-at-depth"
  - id: message-queues-and-async-086
    difficulty: advanced
    tags: [log-vs-queue, anti-pattern]
    question: |
      A team uses a single Kafka topic as a general task queue for independent,
      unordered jobs, and complains that one slow/poison job stalls everything and
      they can't prioritize urgent tasks. What is the correct diagnosis?
    options:
      - "Kafka is simply broken for this use case; the head-of-line stalls are a genuine defect, so they should file a bug and wait for an upstream fix"
      - "They need a higher replication factor; adding more replicas per partition is what unblocks stuck jobs and enables per-message priorities on the topic"
      - "Using a log as a task queue is an anti-pattern here: they lose per-message ack, priorities, and isolated redelivery, and a poison record causes head-of-line blocking in its partition; a queue (SQS/RabbitMQ) fits unordered independent tasks better"
      - "They should reduce the topic down to a single partition, which serializes the jobs and lets a poison record be skipped without blocking the others"
    answer: 2
    explanation: |
      For independent, unordered, individually-retryable/prioritizable tasks, a queue
      with per-message ack is the right tool; a log gives coarse offset redelivery,
      no native priority, and per-partition head-of-line blocking. It is a tool-fit
      problem, not a Kafka bug, replication issue, or a reason to collapse to one
      partition (which worsens it).
    ref: "concepts.md#the-log-versus-queue-distinction-at-depth"
  - id: message-queues-and-async-087
    difficulty: advanced
    tags: [littles-law, sizing, estimation]
    question: |
      Messages arrive at 2,000/sec and each spends on average 0.25 sec in the system
      (processing plus wait). By Little's Law, what is the expected steady-state
      number of in-flight messages, and what does it inform?
    options:
      - "8,000 (2000 divided by 0.25); this in-flight count is what you use to set the topic's replication factor for durability"
      - "500 (L = lambda x W = 2000 x 0.25); it informs in-flight/visibility limits and buffer sizing"
      - "2,000; the in-flight count always equals the arrival rate exactly, independent of how long each message dwells in the system"
      - "0.25; the number of in-flight messages is simply the per-message processing time, since arrival rate does not affect concurrency"
    answer: 1
    explanation: |
      Little's Law gives L = lambda x W = 2000 x 0.25 = 500 in-flight messages, which
      informs how many concurrent in-flight messages, visibility-timeout sizing, and
      buffer depth to provision. It is not the arrival rate, the service time, or a
      replication setting.
    ref: "concepts.md#capacity-estimation-and-back-of-envelope"
  - id: message-queues-and-async-088
    difficulty: expert
    tags: [utilization, queueing-theory, latency]
    question: |
      A consumer pool runs at 95% utilization (rho = 0.95) and latency is terrible;
      management asks why a small traffic increase caused a huge latency jump. What
      is the precise explanation?
    options:
      - "Latency is completely independent of utilization in a queueing system, so a jump this large can only be an application bug rather than a load effect"
      - "Queueing delay grows roughly as 1/(1-rho), so near rho=1 latency explodes non-linearly; running at 95% leaves almost no headroom, so a small lambda increase causes a large wait increase"
      - "The broker ran out of available partitions at 95% utilization, and the resulting partition-exhaustion is what caused the sudden latency jump"
      - "Higher utilization always lowers latency by keeping CPU caches and connection pools warm, so 95% should have made this pool faster, not slower"
    answer: 1
    explanation: |
      In queueing theory, waiting time scales like 1/(1-rho), so as utilization
      approaches 1 the queueing delay blows up non-linearly -- at 95% there is almost
      no slack, so a small arrival-rate bump produces a large latency jump. Latency is
      very much utilization-dependent; it is not a partition count issue, and high
      utilization increases, not decreases, queueing delay.
    ref: "concepts.md#capacity-estimation-and-back-of-envelope"
  - id: message-queues-and-async-089
    difficulty: expert
    tags: [littles-law, backlog, capacity]
    question: |
      Your queue depth is growing steadily over hours (dL/dt > 0), not just during
      bursts. What does this indicate and which "fix" is futile?
    options:
      - "It indicates sustained arrival rate exceeds total consumer service rate (lambda > c*mu); increasing the buffer/queue size is futile -- you must add capacity or shed load"
      - "It indicates a duplicate-detection bug inflating the backlog with phantom copies; disable idempotency so the queue depth reflects real work and drains"
      - "It indicates retention is configured too long, so old messages linger and inflate depth; shorten retention and the backlog will drain faster on its own"
      - "It indicates per-key ordering is broken across partitions; collapse the topic to a single partition so the consumer can finally keep pace with arrivals"
    answer: 0
    explanation: |
      A steadily growing backlog means arrivals persistently outstrip service
      capacity; no buffer size can absorb a sustained deficit -- only more consumers/
      capacity or load shedding will. Buffers absorb bursts, not sustained overload.
      Disabling idempotency, shortening retention, or single-partitioning do not add
      throughput and can cause loss.
    ref: "concepts.md#capacity-estimation-and-back-of-envelope"
  - id: message-queues-and-async-090
    difficulty: advanced
    tags: [schema-evolution, compatibility]
    question: |
      You want to deploy new consumer code before updating producers, and the new
      consumers must read messages still being written in the old format. Which
      schema compatibility mode enables this?
    options:
      - "Forward compatibility, where old consumers read data written under the new schema, so you must always upgrade every producer before touching any consumer"
      - "No compatibility checking at all, letting the registry accept any schema change and trusting each consumer to cope with whatever format it happens to receive"
      - "Backward compatibility (new consumer can read data written by the old producer), so you can upgrade consumers first"
      - "Byte-for-byte identical schemas only, requiring producers and consumers to be redeployed together in lockstep for every single field change"
    answer: 2
    explanation: |
      Backward compatibility means a new consumer can read data produced under the old
      schema, which is precisely what lets you roll out consumers before producers.
      Forward compatibility is the opposite direction (upgrade producers first); no
      checks is unsafe; requiring identical schemas prevents evolution entirely.
    ref: "concepts.md#schema-evolution-and-message-contracts"
  - id: message-queues-and-async-091
    difficulty: expert
    tags: [schema-evolution, replay, retention]
    question: |
      Why does long log retention (Kafka) make schema compatibility a harder,
      longer-lived requirement than in a transient queue?
    options:
      - "Because retention encrypts old messages at rest with a per-segment key, so a replaying consumer must fetch and rotate the historical decryption keys before it can read them"
      - "Because a consumer replaying old offsets must still decode messages written under older schema versions, so you cannot rely on upgrading producers and consumers simultaneously"
      - "Because retention automatically rewrites old messages into the newest registered schema version during log compaction, so replays only ever see the current format"
      - "Because Kafka rejects any message whose schema is older than the current registry version, forcing producers to re-emit historical events before a consumer can replay them"
    answer: 1
    explanation: |
      Retained data means a replay reads historical messages in their original schema
      versions, so consumers must handle old schemas for as long as data is retained
      -- you can't just do a simultaneous flip. Retention does not encrypt, auto-
      upgrade, or reject old-schema messages; it obliges long-lived compatibility.
    ref: "concepts.md#schema-evolution-and-message-contracts"
  - id: message-queues-and-async-092
    difficulty: advanced
    tags: [schema-registry, poison-message]
    question: |
      How does enforcing schema compatibility via a schema registry help prevent
      poison messages, compared to publishing ad-hoc JSON?
    options:
      - "It transparently compresses every message with Snappy so undersized or malformed payloads are padded to a valid frame and therefore never fail deserialization"
      - "It rejects an incompatible schema at publish time (fail fast at the producer) instead of letting malformed data poison every consumer at read time"
      - "It guarantees exactly-once delivery by assigning each validated schema a transactional ID the broker uses to deduplicate every message written under it"
      - "It removes the need for consumers to deserialize anything by delivering messages as fully materialized native objects resolved from the registered schema on the broker side"
    answer: 1
    explanation: |
      A registry validates the producer's schema against the compatibility policy and
      rejects incompatible writes up front, so the failure surfaces at the producer
      rather than as a read-time poison message across all consumers. It is not about
      compression, exactly-once, or skipping deserialization.
    ref: "concepts.md#schema-evolution-and-message-contracts"
  - id: message-queues-and-async-093
    difficulty: advanced
    tags: [async-hurts, observability, tracing]
    question: |
      A stakeholder asks why the team invested heavily in distributed tracing and
      correlation IDs after moving to async messaging. What is the strongest
      justification?
    options:
      - "Tracing makes messages deliver faster because the injected trace headers let brokers route each span-tagged message down a lower-latency priority path to its consumer"
      - "Async replaces a synchronous stack trace with a causal chain spread across producers, brokers, and consumers over time; without propagated correlation/trace IDs, 'where is my message and why didn't it process?' is nearly unanswerable"
      - "Tracing guarantees exactly-once processing because the unique trace ID on each span lets the consumer detect and discard any message it has already recorded as seen"
      - "Correlation IDs eliminate the need for a DLQ because a failed message can be re-fetched by its correlation ID and re-driven inline rather than being parked for inspection"
    answer: 1
    explanation: |
      Async destroys the single synchronous stack trace, scattering causality across
      components and time; correlation/trace IDs and distributed tracing are what make
      debugging feasible -- a real, mandatory cost of async. Tracing does not speed
      delivery, provide exactly-once, or replace a DLQ.
    ref: "concepts.md#when-async-messaging-hurts-deeper-failure-modes"
  - id: message-queues-and-async-094
    difficulty: advanced
    tags: [async-hurts, backpressure, overload]
    question: |
      Compared with a synchronous API returning 503/429 under overload, what is the
      subtle danger of a queue silently absorbing the same overload?
    options:
      - "The queue makes the producer faster by acking writes at the broker before processing, which is always good because the client's request latency drops to near zero"
      - "There is no natural backpressure signal to the client: you can ingest far more than you can process, discovering it only via lag alarms -- and the backlog may exceed retention (data loss) or take hours to drain"
      - "The queue automatically rejects excess load like a 429 once a configured depth threshold is crossed, pushing the same backpressure signal back to the client as a synchronous API would"
      - "Nothing; queues eliminate overload entirely because the broker elastically scales its buffer to match any arrival rate, so the consumer is never actually overwhelmed"
    answer: 1
    explanation: |
      A synchronous 503/429 immediately tells the client to slow down; a queue quietly
      buffers, so overload is hidden until lag alarms fire, by which point the backlog
      can exceed retention (losing data) or take a long time to drain. Queues do not
      auto-shed load by default and do not eliminate overload.
    ref: "concepts.md#when-async-messaging-hurts-deeper-failure-modes"
  - id: message-queues-and-async-095
    difficulty: expert
    tags: [async-hurts, sync-vs-async, judgment]
    question: |
      A CRUD endpoint does one small, strongly-consistent, low-latency
      request/response and a team proposes routing it through a message broker "for
      scalability." What is the most defensible senior critique?
    options:
      - "Agree; async is always more scalable because routing every request through a broker lets you add consumers independently and horizontally scale the endpoint without limit"
      - "For a simple, low-latency, strongly-consistent request/response, async adds a hop, eventual consistency, ordering/dedup work, and debugging cost for no benefit; a synchronous call plus a database is simpler, faster, and easier to operate -- don't pay the async tax without a reason"
      - "Route it through async for scalability and also keep the synchronous path for safety, running both in parallel so the fastest of the two responses is returned to the caller"
      - "Only async can provide durability here because a broker persists and replicates the request to disk, whereas a synchronous call plus a database cannot survive a crash mid-request"
    answer: 1
    explanation: |
      Async is justified by deferrable work, spiky load, or fan-out/decoupling -- none
      of which apply to a simple consistent request/response. Adding a broker there
      buys latency, eventual consistency, and operational/debugging burden for nothing.
      Blanket 'async is more scalable' is wrong, dual paths add complexity, and a DB
      provides durability without a broker.
    ref: "concepts.md#when-async-messaging-hurts-deeper-failure-modes"
  - id: message-queues-and-async-096
    difficulty: advanced
    tags: [visibility-timeout, sqs, redelivery]
    question: |
      An SQS consumer sometimes takes longer to process a message than the queue's
      visibility timeout. What failure results, and what are the two standard fixes?
    options:
      - "The message is permanently lost the moment the timeout elapses, and the only fix is to shorten the visibility timeout so it expires before the consumer can stall on it"
      - "Nothing happens; SQS silently extends the timeout and waits indefinitely for the in-flight consumer to finish, so no other consumer can ever pick the message up"
      - "The message becomes visible again and is redelivered/processed concurrently (a duplicate); fix by extending the visibility timeout to exceed p99 processing time, or heartbeat via ChangeMessageVisibility while working"
      - "The queue automatically converts to FIFO mode on the slow message so redelivery is serialized behind it, guaranteeing the original consumer finishes before any duplicate runs"
    answer: 2
    explanation: |
      If processing outlasts the visibility timeout, SQS makes the message visible
      again and another consumer picks it up, causing duplicate processing. The fixes
      are to set the timeout above p99 processing time or to extend it dynamically with
      ChangeMessageVisibility (a heartbeat). The message is not lost, SQS does not wait
      forever, and it does not switch to FIFO.
    ref: "concepts.md#delivery-semantics-at-most-once-at-least-once-exactly-once"
  - id: message-queues-and-async-097
    difficulty: expert
    tags: [ordering, key-design, causal]
    question: |
      Two related events -- OrderCreated (aggregate: order) and PaymentAuthorized
      (aggregate: payment) -- must be applied in causal order downstream, but they are
      partitioned by their own aggregate IDs, so they can interleave. What is the
      cleanest design fix?
    options:
      - "Increase the number of partitions so ordering is guaranteed, since more partitions give each aggregate its own dedicated lane and the consumer merges them back in commit order"
      - "Partition both event types by a shared correlation key (e.g., order_id) so causally related events land in the same partition and preserve order, or attach a sequence/version the consumer enforces"
      - "Use a single global partition for the entire system so every event is totally ordered, accepting the throughput ceiling as the price of guaranteed cross-aggregate causal ordering"
      - "Disable retries so events never reorder, because without retries each event is written exactly once in arrival order and can no longer be shuffled relative to its causal predecessor"
    answer: 1
    explanation: |
      Ordering holds only within a partition, so causally related events must share a
      partition key (e.g., both keyed by order_id) -- or carry a sequence/version the
      consumer enforces. More partitions worsens interleaving; one global partition
      kills throughput; disabling retries does not create cross-aggregate ordering.
    ref: "concepts.md#ordering-and-partitioning"
  - id: message-queues-and-async-098
    difficulty: advanced
    tags: [consumer-lag, diagnosis, scenario]
    question: |
      Consumer lag suddenly spikes. Producer rate is unchanged, consumers are not
      crashing, and CPU is low, but you observe frequent partition reassignments in
      the logs. What is the most likely root cause to investigate first?
    options:
      - "A rebalancing storm pausing consumption (e.g., slow polls exceeding max.poll.interval.ms or flapping membership), so the group spends time paused rather than processing"
      - "The topic's replication factor silently dropped, so followers stopped serving reads and the consumers are stalling while the leader rebuilds the missing in-sync replicas"
      - "The producer secretly doubled its publish rate behind a batching layer, so the offered load quietly outgrew consumer capacity even though the reported producer rate looks unchanged"
      - "Disk is full on the consumer host, so committed offsets can no longer be flushed locally and each record is silently reprocessed, inflating apparent lag against the topic"
    answer: 0
    explanation: |
      Frequent reassignments plus stalled progress despite healthy CPU and steady
      producer rate points to a rebalancing storm: the group keeps pausing to
      rebalance instead of consuming. Investigate poll-interval violations or flapping
      membership. The clues explicitly rule out a producer spike, and RF/disk would
      present differently.
    ref: "concepts.md#rebalance-protocols-storms-and-mitigation"
  - id: message-queues-and-async-099
    difficulty: expert
    tags: [exactly-once, dedup-window, tradeoff]
    question: |
      A dedup store uses a time-bounded window (e.g., SQS FIFO's 5-minute dedup, or a
      Redis TTL). A duplicate can arrive after the window if a redelivery is delayed
      by a long outage. What is the correct way to reason about this?
    options:
      - "The window guarantees exactly-once regardless of delay, because the broker persists each dedup key permanently once seen and only garbage-collects it after confirming no redelivery can occur"
      - "Time-windowed dedup is best-effort: any duplicate delayed beyond the window slips through, so for strict correctness use a durable business-key uniqueness constraint (unbounded) rather than a TTL/window"
      - "Duplicates after the window are impossible in practice, since a broker never holds an unacknowledged message longer than the dedup window before permanently discarding it"
      - "Extending the window to 1 second fixes it, because a shorter dedup interval forces redeliveries to arrive sooner and therefore always fall inside the detection window"
    answer: 1
    explanation: |
      Window/TTL-based dedup only catches duplicates that recur within the window; a
      redelivery delayed past it (e.g., after a long outage or DLQ redrive) is not
      recognized. For strict correctness, use a durable unique constraint on the
      business key with no time bound. The window does not guarantee exactly-once, late
      duplicates are real, and shrinking the window makes it worse.
    ref: "concepts.md#idempotency-and-deduplication"
  - id: message-queues-and-async-100
    difficulty: advanced
    tags: [dlq, redrive, ordering, operations]
    question: |
      After fixing a bug, you redrive 10,000 messages from a DLQ back into the main
      topic. What second-order effect must you plan for?
    options:
      - "Redrive is instantaneous and free of side effects, because the broker moves the 10,000 messages back atomically in their original positions without adding any load to live consumers"
      - "The redriven messages re-enter out of their original order and mixed with live traffic, so consumers must be idempotent and tolerate reordering; a redrive surge can also spike lag/load, so throttle it"
      - "Redrive guarantees the messages process in original order, since the DLQ preserves their initial offsets and re-injects them ahead of any live traffic on the main topic"
      - "Redrive deletes the main topic's live messages, because re-injecting the DLQ backlog overwrites the current head of the partition and purges anything published during the outage"
    answer: 1
    explanation: |
      Redriven messages rejoin later and interleaved with current traffic, so ordering
      relative to their original position is lost and consumers must be idempotent; the
      sudden volume can also spike lag, so throttle the redrive. It is neither
      instantaneous/side-effect-free, order-preserving, nor destructive to live
      messages.
    ref: "concepts.md#dead-letter-queues-retries-and-poison-messages"
  - id: message-queues-and-async-101
    difficulty: expert
    tags: [transactions, throughput, tradeoff, kafka]
    question: |
      A Kafka pipeline switches from at-least-once to transactional exactly_once_v2
      and throughput drops noticeably. Which explanation and mitigation are most
      accurate?
    options:
      - "Transactions add coordinator round-trips and commit-marker overhead, and read_committed consumers wait for commit markers; mitigate by batching more work per transaction (fewer, larger commits) to amortize the cost"
      - "EOS should increase throughput because transactional batching coalesces writes, so the observed drop must be an unrelated network bug rather than a cost of transactions"
      - "Reduce throughput loss by committing a transaction after every single record, so each commit stays tiny and the coordinator overhead per message is minimized"
      - "Disable the idempotent producer to speed transactions up, since dropping the per-partition sequence-number bookkeeping removes the main overhead slowing the transactional path"
    answer: 0
    explanation: |
      Transactions incur coordinator interactions and commit markers, and
      read_committed consumers await those markers, all of which cost throughput; you
      amortize it by doing more records per transaction (fewer, larger commits). EOS
      does not increase throughput, per-record commits maximize overhead, and
      disabling idempotence breaks EOS entirely.
    ref: "concepts.md#how-exactly-once-is-really-achieved"
  - id: message-queues-and-async-102
    difficulty: advanced
    tags: [poison-message, validation, dlq]
    question: |
      A consumer keeps retrying a message that fails a deterministic schema/validation
      check, wasting resources and never succeeding. What is the correct handling?
    options:
      - "Retry it forever with no cap; a deterministic validation failure may eventually pass once transient broker or network conditions around the consumer settle down"
      - "Recognize it as a non-retryable poison message and route it straight to the DLQ (skip retries) with an alert, since retrying a deterministic failure cannot help"
      - "Increase the retry backoff to several hours between attempts, so the same deterministic validation check is re-run far less often and eventually clears itself"
      - "Silently drop the failing message and commit past it to keep throughput high, treating a single malformed record as acceptable collateral for overall pipeline speed"
    answer: 1
    explanation: |
      A deterministic validation failure will never succeed on retry, so it should be
      dead-lettered immediately (no retry loop) and alerted for inspection. Retrying
      forever or with huge backoff just wastes resources; silently dropping loses data
      and hides the defect.
    ref: "concepts.md#retry-amplification-retry-budgets-and-metastable-failures"
  - id: message-queues-and-async-103
    difficulty: expert
    tags: [scenario, log-vs-queue, poison]
    question: |
      Why do Kafka deployments need explicit retry-topic/DLQ patterns to handle a
      poison message, whereas an SQS queue can often dead-letter one bad message with
      almost no ceremony?
    options:
      - "Because Kafka has no durability guarantees, so a poison record must be explicitly copied to a retry topic before it is lost, whereas SQS persists every message safely by default"
      - "Because SQS always delivers messages in strict global order while Kafka never orders anything, so only Kafka can have a message stuck blocking those behind it"
      - "Because Kafka's offset cursor advances monotonically and a bad record in an ordered partition blocks the tail (head-of-line blocking), so you must actively move it aside; SQS tracks per-message state and a maxReceiveCount naturally dead-letters just that message"
      - "Because Kafka cannot have more than one consumer group per topic, a poison record blocks the only reader, while SQS lets extra consumers route around the bad message"
    answer: 2
    explanation: |
      Kafka's single monotonic offset means a stuck record in an ordered partition
      blocks everything behind it unless you explicitly park it (retry topic / DLT),
      while SQS's per-message ack and maxReceiveCount isolate and dead-letter a single
      message automatically. It is about the ack model, not durability, universal
      ordering, or consumer-group limits.
    ref: "concepts.md#the-log-versus-queue-distinction-at-depth"
  - id: message-queues-and-async-104
    difficulty: advanced
    tags: [circuit-breaker, retries, resilience]
    question: |
      How does a circuit breaker complement retry backoff to prevent a metastable
      outage when a downstream is hard-down?
    options:
      - "It shrinks the backoff interval and retries faster to push through the outage, forcing enough requests at the downstream that it is compelled to recover under the sustained load"
      - "It trips open after a failure threshold and fails fast (stops sending), giving the downstream time to recover and halting the retry feedback loop, then half-opens to test recovery"
      - "It guarantees the downstream never fails by holding a warm standby connection open and transparently failing every call over to a healthy replica before an error can surface"
      - "It converts the queue to at-most-once delivery while open, dropping any message that would have been retried so the downstream is never asked to process it twice"
    answer: 1
    explanation: |
      A circuit breaker opens on sustained failures and fails fast, cutting the load
      the retry loop would otherwise pile onto a down service and breaking the
      amplification/metastable loop, then probes for recovery via half-open. It does
      not speed retries, prevent failures, or change delivery semantics.
    ref: "concepts.md#retry-amplification-retry-budgets-and-metastable-failures"
  - id: message-queues-and-async-105
    difficulty: expert
    tags: [scenario, sizing, littles-law, capacity]
    question: |
      You must process 4,000 msg/s and each message takes 50 ms of consumer work
      (single-threaded per consumer). Roughly how many consumer threads/instances do
      you need at minimum, and what safety factor should you add?
    options:
      - "About 200 concurrent workers (4000 x 0.05); add headroom (e.g., 30-50%) so utilization stays below 1 and queueing delay does not blow up"
      - "About 4,000 workers, one per message per second, since each arriving message needs its own dedicated thread held open for the full second it is counted in the arrival rate"
      - "About 20 workers (4000 divided by the 50 ms budget as a rate); latency does not depend on concurrency, so no headroom or safety factor is needed above that count"
      - "Exactly 1 worker; batching the 50 ms tasks into large groups makes concurrency irrelevant because a single thread can amortize all 4,000 messages per second into one pass"
    answer: 0
    explanation: |
      By Little's Law the required concurrency is lambda x W = 4000 x 0.05 = 200 busy
      workers just to keep up; you provision above that (headroom) so utilization stays
      under 1, because queueing delay explodes as rho approaches 1. 4,000 and 20 are
      arithmetic errors, and a single worker cannot sustain 4,000 msg/s at 50 ms each.
    ref: "concepts.md#capacity-estimation-and-back-of-envelope"
  - id: message-queues-and-async-106
    difficulty: advanced
    tags: [schema-evolution, field-rules]
    question: |
      Which schema change is safe under typical backward-compatibility rules for an
      evolving event, and which is dangerous?
    options:
      - "Safe: reusing a retired field's tag number for a new unrelated field, since the registry remaps the old tag to the new definition and readers transparently pick up the new meaning"
      - "Safe: adding a new optional field with a default value; Dangerous: removing a required field or reusing a field tag/number for a new meaning"
      - "Safe: removing a required field that has no default value, because old readers simply skip the absent field and continue decoding the rest of the record without error"
      - "Dangerous: adding any new field at all, even an optional one with a default, because introducing a field number the old reader has never seen aborts its deserialization"
    answer: 1
    explanation: |
      Adding a new optional field with a default is the canonical safe evolution;
      removing a required field or repurposing an existing tag/number corrupts decoding
      for readers on the other version. Reusing tags is dangerous (not safe), removing
      required fields breaks readers, and adding optional fields is precisely what is
      allowed.
    ref: "concepts.md#schema-evolution-and-message-contracts"
  - id: message-queues-and-async-107
    difficulty: expert
    tags: [scenario, exactly-once, external-effect, email]
    question: |
      An at-least-once consumer sends order-confirmation emails; occasional duplicate
      emails annoy users, but sending has no natural transactional idempotency key
      from the provider. What is the most pragmatic design?
    options:
      - "Switch to at-most-once so emails are never duplicated, accepting that some confirmations are never sent"
      - "Use Kafka transactions to enroll the SMTP send in the consumer's transaction, so the email delivery commits or aborts atomically with the offsets and is exactly-once end-to-end"
      - "Maintain a dedup marker keyed by a stable business tuple (e.g., order_id + template) written atomically before/with the send attempt, so a redelivery skips the send; accept that a crash in the tiny window between send and marker may rarely duplicate"
      - "Retry the email send aggressively on any failure to ensure delivery, ignoring duplicates on the assumption that users tolerate extra confirmations better than a missing one"
    answer: 2
    explanation: |
      Since email is a non-transactional external side effect, you approximate
      effectively-once with a durable dedup marker on a stable business key,
      acknowledging a small unavoidable window where a crash between send and marker
      can duplicate. At-most-once risks never sending; Kafka transactions cannot cover
      SMTP; aggressive retries maximize duplicates.
    ref: "concepts.md#idempotency-and-deduplication"
  - id: message-queues-and-async-108
    difficulty: advanced
    tags: [async-hurts, deferred-failure, dlq]
    question: |
      "Async hides failure rather than removing it." Which scenario best illustrates
      this senior-level point?
    options:
      - "A synchronous call returns a 500 immediately to the user, so the failure is deferred and hidden until someone later inspects the aggregated error dashboards for the endpoint"
      - "A message fails, exhausts retries, and lands in a DLQ that no one monitors, so the business impact surfaces days later as missing data instead of a loud, immediate error at request time"
      - "A consumer processes a message successfully on the first try, which hides the failure because the successful path masks the errors that other messages are silently accumulating"
      - "A producer validates input before publishing, which defers the failure by pushing malformed records downstream where they surface only much later as a silent processing gap"
    answer: 1
    explanation: |
      Async trades an immediate, local, loud failure for a deferred, distributed,
      easily-ignored one -- the unmonitored DLQ that turns into silent data loss is the
      textbook illustration. A synchronous 500, a successful process, and pre-publish
      validation are not examples of hidden/deferred failure.
    ref: "concepts.md#when-async-messaging-hurts-deeper-failure-modes"
  - id: message-queues-and-async-109
    difficulty: expert
    tags: [scenario, rebalance, autoscaling]
    question: |
      An autoscaler adds and removes Kafka consumers aggressively based on CPU, and
      overall throughput gets WORSE under load. What is the likely mechanism and the
      fix?
    options:
      - "More consumers always help, so the autoscaler is behaving correctly; keep adding instances well past the partition count and each extra consumer will still claim a share of the load and push net throughput steadily higher under pressure"
      - "Each scale event triggers a rebalance that pauses the group, so flapping membership spends more time rebalancing than consuming; fix with cooperative rebalancing, static membership, stabilization windows/cooldowns, and scaling on lag rather than twitchy CPU"
      - "The brokers are simply undersized for the offered load, so the fix is to keep adding partitions at a steady rate throughout the spike, giving the autoscaled consumers more lanes and eliminating the rebalance-driven throughput loss"
      - "Throughput here is fundamentally capped by the topic's replication factor, so lowering it frees broker bandwidth and lets the aggressive autoscaling translate directly into higher net consumption under load"
    answer: 1
    explanation: |
      Frequent membership changes cause repeated rebalances that pause consumption, so
      aggressive autoscaling can reduce net throughput. Stabilize it with cooperative
      rebalancing, static membership, scaling cooldowns/stabilization windows, and a
      lag-based (not jumpy CPU) metric. Adding consumers beyond partitions or changing
      RF does not address rebalance thrash.
    ref: "concepts.md#rebalance-protocols-storms-and-mitigation"
  - id: message-queues-and-async-110
    difficulty: advanced
    tags: [log-vs-queue, fan-out, replay]
    question: |
      A requirement changes mid-project: besides the existing consumer, you must add
      two brand-new consumers that each need the full history of past events. If you
      originally built on a point-to-point queue, why is this painful, and what would
      a log have given you?
    options:
      - "A point-to-point queue handles this natively; because the broker keeps every acknowledged message in a per-consumer archive, each new consumer simply attaches and is automatically backfilled with the full history, so nothing about the design needs to change"
      - "In a queue, messages are deleted on ack so past events are gone and each new independent consumer needs its own duplicated queue fed going forward; a log retains history and lets each new consumer group read from the earliest offset, getting the full backlog for free"
      - "A log can only ever have a single consumer bound to a partition at once, so adding two more history-reading consumers would actually be worse on a log than on the point-to-point queue you already built"
      - "You must abandon messaging entirely and switch to synchronous request/response calls, since only a direct call can replay the complete event history to each of the two brand-new consumers on demand"
    answer: 1
    explanation: |
      A queue deletes acked messages, so historical events are unrecoverable and each
      new independent consumer needs a separately-fed queue with no backfill; a
      retained log lets any new consumer group start at the earliest offset and replay
      the entire history. Logs support many consumer groups, and synchronous calls are
      irrelevant to the need.
    ref: "concepts.md#the-log-versus-queue-distinction-at-depth"
