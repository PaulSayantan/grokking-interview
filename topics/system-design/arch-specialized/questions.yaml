  - id: arch-specialized-034
    difficulty: beginner
    tags: [interpreter, problem-fit, dsl]
    question: |
      What problem does the Interpreter/Virtual-Machine architectural style solve?
    options:
      - "Serving read load by fanning queries out to asynchronous replicas that trail the write source"
      - "Defining and changing system behavior without recompiling/redeploying the host, by shipping an engine that interprets a language/DSL/bytecode"
      - "Removing the central broker bottleneck by making every node act as both client and server"
      - "Assembling opportunistic partial results from many specialists under a reasoning scheduler"
    answer: 1
    explanation: |
      The style encodes logic as a language/DSL/bytecode and ships an engine that interprets
      it at runtime — rules engines, scripting, workflow engines, language VMs — so behavior
      changes without recompiling the host.
    ref: "concepts.md#interpreter-virtual-machine"

  - id: arch-specialized-035
    difficulty: intermediate
    tags: [interpreter, components, pipeline]
    question: |
      What is the typical component flow in an Interpreter/VM architecture?
    options:
      - "Client proxy marshals the call → central broker routes it → server proxy unmarshals → server executes"
      - "Primary accepts the write → streams the change log → replicas apply it and serve reads"
      - "Source/DSL → parser → AST/bytecode → interpreter/VM engine → runtime effects"
      - "Coordinator splits the job into shards → dispatches to identical workers → aggregates results"
    answer: 2
    explanation: |
      Source program text is parsed to an AST/bytecode, which the interpreter/VM engine walks
      and executes against the host runtime to produce effects.
    ref: "concepts.md#interpreter-virtual-machine"

  - id: arch-specialized-036
    difficulty: advanced
    tags: [interpreter, trade-offs, ilities]
    question: |
      Which -ilities does the Interpreter/VM style optimize and sacrifice?
    options:
