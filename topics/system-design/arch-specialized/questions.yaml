      differ from just using a message queue?
    options:
      - "Message queue; it provides synchronous request/reply with runtime relocation by default, so no separate broker indirection is ever required"
      - "RPC-Broker; it provides location-transparent request/response with a reply path, whereas a message queue is fire-and-forget async pub-sub (deep dive: message-queues-and-async)"
      - "Blackboard; the heterogeneous services act as specialist Knowledge Sources writing replies into a shared hypothesis space by logical name"
      - "Primary-Replica; the callee services act as read replicas that the caller reaches by logical name with request/reply semantics at runtime"
