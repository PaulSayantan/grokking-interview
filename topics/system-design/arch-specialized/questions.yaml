topic: "Specialized Architectures (Blackboard, Primary-Replica, Broker)"
domain: system-design
topic_slug: arch-specialized
version: 1
questions:
  - id: arch-specialized-001
    difficulty: beginner
    tags: [altitude, architecture-vs-design-pattern, fundamentals]
    question: |
      In this reference, how do "architectural styles" (arch-*) differ in altitude from
      GoF "design patterns" (dp-*)?
    options:
      - "Architectural styles describe the whole-system structure/deployment; design patterns describe object collaboration inside one component"
      - "They are the same thing at different scales of the same class diagram, so the arch- and dp- prefixes are only a naming convention"
      - "Design patterns describe deployment topology and network boundaries; architectural styles describe only class relationships within a module"
      - "Architectural styles only apply to database systems; design patterns only apply to user-interface rendering code"
    answer: 0
    explanation: |
      arch-* is the system altitude — top-level components, how they are distributed, how
      they communicate — which dominates the -ilities. dp-* (GoF) is the object altitude:
      class/object collaboration within a single component.
    ref: "concepts.md#architectural-styles-vs-object-level-design-patterns"

  - id: arch-specialized-002
    difficulty: beginner
    tags: [blackboard, problem-fit, ai]
    question: |
      What core problem characteristic makes the Blackboard style appropriate?
    options:
      - "The workload is embarrassingly parallel and fully deterministic, so it can be split into identical independent shards and aggregated"
      - "Reads vastly outnumber writes on a single database, so read fan-out to replicas is the dominant scaling concern"
      - "There is no known deterministic algorithm; a solution must be assembled opportunistically from many specialists"
      - "Clients must call servers without knowing their location, transport, or platform, requiring a mediating indirection layer"
    answer: 2
    explanation: |
      Blackboard (origin: Hearsay-II speech recognition) fits ill-defined domains where no
      step-by-step algorithm exists and partial contributions from diverse Knowledge Sources
      must be combined opportunistically.
    ref: "concepts.md#blackboard"

  - id: arch-specialized-003
    difficulty: intermediate
    tags: [blackboard, components, control]
    question: |
      Which component distinguishes a Blackboard architecture from a passive shared data store?
    options:
      - "The marshalling proxy that serializes calls and hides the physical location of each specialist"
      - "The active control/scheduler component that opportunistically selects which Knowledge Source runs next"
      - "The read replica that asynchronously copies the shared state to absorb query fan-out"
      - "The client-side stub that forwards each request to a mediating broker for routing"
    answer: 1
    explanation: |
      A Blackboard adds an active control component (scheduler) that inspects state and
      heuristically decides which Knowledge Source fires next. Without it you just have a
      shared repository.
    ref: "concepts.md#blackboard"

  - id: arch-specialized-004
    difficulty: intermediate
    tags: [blackboard, communication, knowledge-sources]
    question: |
      How do Knowledge Sources in a Blackboard system communicate with each other?
    options:
      - "By direct RPC calls between Knowledge Sources using a shared interface registry"
      - "Through a central message broker that routes request/reply pairs between specialists"
      - "They do not share any state at all; each produces a complete final answer fully independently"
      - "Only indirectly, by reading from and writing to the shared blackboard"
    answer: 3
    explanation: |
      Knowledge Sources never call each other. They observe the blackboard, fire when their
      trigger condition matches, and write improved hypotheses back — communication is only
      through the shared blackboard.
    ref: "concepts.md#blackboard"

  - id: arch-specialized-005
    difficulty: advanced
    tags: [blackboard, trade-offs, ilities]
    question: |
      Which -ility does Blackboard optimize, and which does it most clearly sacrifice?
    options:
      - "Optimizes performance; sacrifices extensibility"
      - "Optimizes extensibility/flexibility; sacrifices testability and predictability"
      - "Optimizes strong consistency; sacrifices availability"
      - "Optimizes deployability; sacrifices interoperability"
    answer: 1
    explanation: |
      Adding/removing specialist Knowledge Sources is easy (extensibility), but the heuristic,
      non-deterministic control loop is hard to test, debug, and prove convergent —
      predictability and testability suffer.
    ref: "concepts.md#blackboard"

  - id: arch-specialized-006
    difficulty: advanced
    tags: [blackboard, when-to-avoid]
    question: |
      When is Blackboard a poor architectural choice?
    options:
      - "A problem with a known deterministic algorithm and hard real-time deadlines requiring reproducibility"
      - "Sensor-fusion systems combining noisy, uncertain inputs from many heterogeneous detectors into one estimate"
      - "Speech and handwriting recognition where partial phoneme and stroke hypotheses must be refined incrementally"
      - "Symbolic AI planning with many heuristic specialists cooperating to explore a large ambiguous solution space"
    answer: 0
    explanation: |
      Blackboard's non-deterministic control loop and lack of convergence guarantees make it
      wrong for deterministic problems, hard real-time deadlines, or anything needing
      reproducibility/auditability.
    ref: "concepts.md#blackboard"

  - id: arch-specialized-007
    difficulty: beginner
    tags: [primary-replica, problem-fit, replication]
    question: |
      What problem does the Primary-Replica style primarily address?
    options:
      - "Scaling write throughput linearly by accepting concurrent writes across many independent equal authorities"
      - "Running behavior defined as an interpreted DSL so rules change at runtime without recompiling the host"
      - "Combining opportunistic partial results from many specialists into a single assembled solution"
      - "Scaling read load and adding redundancy while keeping one authoritative write source"
    answer: 3
    explanation: |
      Primary-Replica scales reads (fan-out to replicas) and adds failover redundancy while
      one primary remains the single authoritative source of writes — avoiding write
      conflicts.
    ref: "concepts.md#primary-replica"

  - id: arch-specialized-008
    difficulty: intermediate
    tags: [primary-replica, consistency, replication-lag]
    question: |
      A read served by an asynchronous replica returns data slightly older than the latest
      write to the primary. What is this called and why does it happen?
    options:
      - "Split-brain, because two promoted primaries independently accepted conflicting writes after a partition"
      - "Cold start, because the replica just booted and its buffer pool has not yet warmed with hot pages"
      - "Replication lag, because the replica has not yet applied the primary's latest changes"
      - "Straggler latency, because a worker node was slow to return its shard of the aggregation"
    answer: 2
    explanation: |
      Under asynchronous replication the primary does not wait for replicas to apply changes,
      so replicas trail the primary — replication lag — producing stale/eventually-consistent
      reads.
    ref: "concepts.md#primary-replica"

  - id: arch-specialized-009
    difficulty: intermediate
    tags: [primary-replica, terminology, inclusive-language]
    question: |
      "Leader-follower" and the deprecated "master-slave" both refer to which style?
    options:
      - "Broker, the location-transparent request/response mediation style between components"
      - "Peer-to-Peer, where symmetric nodes act as both client and server with no privileged node"
      - "Blackboard, where specialist Knowledge Sources refine shared hypotheses under a scheduler"
      - "Primary-Replica"
    answer: 3
    explanation: |
      Primary-Replica (aka leader-follower) is the style historically and now-deprecatedly
      called master-slave. Use Primary-Replica.
    ref: "concepts.md#primary-replica"

  - id: arch-specialized-010
    difficulty: advanced
    tags: [primary-replica, sync-async, durability]
    question: |
      Choosing synchronous over asynchronous replication for Primary-Replica primarily trades
      what for what?
    options:
      - "Lower read latency on replicas in exchange for permanently weaker write consistency"
      - "Higher write latency for stronger durability / fresher replicas"
      - "More independent write authorities in exchange for automatic conflict resolution"
      - "Lower operational cost in exchange for substantially higher replica memory usage"
    answer: 1
    explanation: |
      Synchronous replication makes the primary wait for replica acknowledgement — stronger
      durability and up-to-date replicas at the cost of higher write latency. Async is faster
      but risks losing recent writes on failover.
    ref: "concepts.md#primary-replica"

  - id: arch-specialized-011
    difficulty: advanced
    tags: [primary-replica, write-scaling, sharding]
    question: |
      Primary-Replica does not scale writes. What is the standard way to scale write
      throughput while keeping single-writer semantics per partition?
    options:
      - "Shard the dataset across multiple primaries, each optionally with its own replicas"
      - "Add more read replicas so the single primary can offload its incoming write traffic to them"
      - "Switch every read to the primary so replicas are freed up to absorb the write load instead"
      - "Convert all replicas into blackboards so a scheduler can distribute writes opportunistically"
    answer: 0
    explanation: |
      Replication copies the same data for read scale/HA; to scale writes you shard —
      partition the dataset across multiple primaries, often each with its own replica set.
    ref: "concepts.md#primary-replica"

  - id: arch-specialized-012
    difficulty: advanced
    tags: [primary-replica, failover, split-brain]
    question: |
      During Primary-Replica failover, why must the old primary be "fenced" before promoting a
      replica?
    options:
      - "To reduce replication lag so the promoted replica serves fully fresh reads immediately"
      - "To warm the buffer-pool cache on the new primary before it begins accepting client writes"
      - "To prevent split-brain, where two nodes both accept writes and diverge"
      - "To rebalance the DHT key ranges across the surviving nodes after the topology change"
    answer: 2
    explanation: |
      If the old primary is not fenced and comes back thinking it is still authoritative, both
      it and the promoted replica accept writes — split-brain — causing divergent, conflicting
      data.
    ref: "concepts.md#primary-replica"

  - id: arch-specialized-013
    difficulty: intermediate
    tags: [primary-replica, multi-primary, differs-from]
    question: |
      How does Multi-Primary (leaderless) differ from Primary-Replica?
    options:
      - "Multi-Primary has exactly one write authority and therefore never encounters write conflicts to reconcile"
      - "Multi-Primary cannot serve reads at all and exists purely to fan writes out to downstream followers"
      - "Multi-Primary accepts writes on many nodes for write availability but must resolve write conflicts"
      - "They are identical styles; the two names are fully interchangeable labels for one topology"
    answer: 2
    explanation: |
      Primary-Replica has one write authority (no conflicts). Multi-Primary/leaderless accepts
      writes on many nodes for availability but must reconcile conflicts (LWW, CRDTs, quorums).
    ref: "concepts.md#primary-replica"

  - id: arch-specialized-014
    difficulty: intermediate
    tags: [primary-replica, deep-dive, cross-reference]
    question: |
      For replication internals — sync/async/semi-sync, quorum reads/writes, sharding, and
      failover mechanics — which deep-dive topic does arch-specialized point to?
    options:
      - "message-queues-and-async"
      - "event-driven-cqrs-saga-cdc"
      - "caching-and-cdn"
      - "databases-sql-nosql-sharding-replication"
    answer: 3
    explanation: |
      The style overview points to databases-sql-nosql-sharding-replication for the
      replication/sharding internals rather than duplicating them.
    ref: "concepts.md#primary-replica"

  - id: arch-specialized-015
    difficulty: beginner
    tags: [broker, problem-fit, location-transparency]
    question: |
      What problem does the Broker style solve?
    options:
      - "Combining partial hypotheses opportunistically from specialists under a reasoning scheduler"
      - "Letting distributed components invoke each other without hard-coding location, transport, or platform"
      - "Splitting a large deterministic workload across identical stateless workers and aggregating results"
      - "Serving stale, eventually-consistent reads from asynchronous replicas that trail the write source"
    answer: 1
    explanation: |
      Broker provides location transparency and decoupling: clients call servers through a
      mediating broker without knowing their address, transport, or platform, so services can
      move/scale at runtime.
    ref: "concepts.md#broker"

  - id: arch-specialized-016
    difficulty: intermediate
    tags: [broker, components, proxies]
    question: |
      In the classic (POSA) Broker style, what is the role of the client-side proxy (stub) and
      server-side proxy (skeleton)?
    options:
      - "They marshal/unmarshal requests and hide the remote call so neither side knows the other's physical location"
      - "They elect a new primary during failover and fence the old one to prevent split-brain writes"
      - "They store the shared blackboard hypotheses and notify Knowledge Sources when triggers match"
      - "They partition the workload into independent shards and dispatch them to identical stateless workers"
    answer: 0
    explanation: |
      The client proxy marshals the local call into a transport-neutral message; the broker
      routes it; the server proxy unmarshals and invokes the server. Proxies provide the
      location transparency.
    ref: "concepts.md#broker"

  - id: arch-specialized-017
    difficulty: intermediate
    tags: [broker, lineage, middleware]
    question: |
      Which technologies are in the lineage of the RPC-broker style?
    options:
      - "CORBA, Java RMI, DCOM, and modern gRPC/service registries"
      - "HTML, CSS, and JavaScript rendering engines running inside the browser presentation layer"
      - "MapReduce and Hadoop batch processing frameworks partitioning compute across worker nodes"
      - "The TCP, UDP, and IP transport and network protocols that move raw packets between hosts"
    answer: 0
    explanation: |
      The request/response location-transparent Broker lineage runs through CORBA, RMI, DCOM
      to modern gRPC and service-registry-driven RPC.
    ref: "concepts.md#broker"

  - id: arch-specialized-018
    difficulty: advanced
    tags: [broker, trade-offs, spof]
    question: |
      What is the primary structural risk of a Broker architecture?
    options:
      - "It cannot support heterogeneous platforms, forcing every client and server onto one identical runtime"
      - "It requires all components to run co-located in a single process, ruling out any distribution at all"
      - "It makes services impossible to relocate at runtime because their addresses are hard-coded into callers"
      - "The broker is a central bottleneck and single point of failure that adds latency"
    answer: 3
    explanation: |
      Centralizing mediation means the broker can bottleneck throughput and is a SPOF (usually
      mitigated by clustering); it also adds latency and operational complexity.
    ref: "concepts.md#broker"

  - id: arch-specialized-019
    difficulty: advanced
    tags: [broker, pub-sub, differs-from]
    question: |
      How does the POSA request/response Broker differ from a Publish-Subscribe event bus?
    options:
      - "Broker is fire-and-forget with no reply path, while publish-subscribe always guarantees a synchronous reply routed back to each publisher"
      - "They are identical mechanisms with the same routing topology, differing only in the wire serialization format each uses on the network"
      - "Broker is request/response 'many-to-one-to-many' routing with a reply path; pub-sub is fire-and-forget 'many-to-many' event fan-out with no reply"
      - "Publish-subscribe requires client stubs and server skeletons to marshal every call, whereas a Broker never uses any proxy indirection at all"
    answer: 2
    explanation: |
      The RPC Broker routes a request to a server and routes the reply/exception back.
      Pub-sub fans events out to many subscribers with no reply expectation.
    ref: "concepts.md#broker"

  - id: arch-specialized-020
    difficulty: advanced
    tags: [broker, api-gateway, service-mesh, differs-from]
    question: |
      Which statement correctly separates Broker, API Gateway, and Service Mesh?
    options:
      - "All three are the same central hub component under different marketing names, so choosing among them is purely a vendor-branding decision"
      - "Broker mediates internal service-to-service calls; API Gateway routes north-south edge traffic; Service Mesh pushes cross-cutting concerns into per-instance sidecars (no central hub)"
      - "API Gateway mediates internal service-to-service RPC; Broker only ever runs at the network edge; Service Mesh replicates persistent data across nodes"
      - "Service Mesh is a single central broker process that all traffic flows through, while a Broker is deployed as a per-instance sidecar beside each service"
    answer: 1
    explanation: |
      Broker = internal location-transparent mediation; API Gateway = edge/north-south client
      routing; Service Mesh = the same concerns distributed into sidecars with no central hub.
    ref: "concepts.md#broker"

  - id: arch-specialized-021
    difficulty: intermediate
    tags: [broker, message-broker, deep-dive]
    question: |
      The message-broker form (RabbitMQ, MQTT, Kafka — queues and pub-sub) is which deep-dive
      topic in this library?
    options:
      - "databases-sql-nosql-sharding-replication"
      - "message-queues-and-async"
      - "aws-serverless-lambda-stepfunctions"
      - "dp-enterprise-application"
    answer: 1
    explanation: |
      arch-specialized treats the RPC-broker form and points to message-queues-and-async for
      the async message-broker/queue/pub-sub form.
    ref: "concepts.md#broker"

  - id: arch-specialized-022
    difficulty: expert
    tags: [broker, gof, altitude]
    question: |
      A candidate answers a "Broker architecture" question by describing the GoF Mediator
      pattern's class collaboration. Why is that an altitude mistake?
    options:
      - "Mediator is a database replication strategy for keeping replicas synchronized, not a design pattern that appears anywhere in the GoF catalog"
      - "There is no meaningful altitude difference here, so describing the Mediator's class collaboration answers the Broker architecture question completely"
      - "The Broker architectural style is a whole-system distribution/communication style; the GoF Mediator/Proxy are object-level collaborations inside one process"
      - "Broker operates purely at the object level inside a single process, while the GoF Mediator is a whole-system distribution and deployment style"
    answer: 2
    explanation: |
      Broker (POSA) is a system-altitude style for distributed, location-transparent
      communication. GoF Mediator/Proxy operate at the object altitude within a single
      process — a different question.
    ref: "concepts.md#broker"

  - id: arch-specialized-023
    difficulty: beginner
    tags: [peer-to-peer, problem-fit, spof]
    question: |
      What is the defining goal of a Peer-to-Peer architecture?
    options:
      - "Eliminate the central-server bottleneck/SPOF by making every node both client and server"
      - "Keep one authoritative write node with several read replicas trailing it for read scaling and failover"
      - "Interpret a domain-specific language at runtime so behavior changes without recompiling the host"
      - "Route all calls through a central broker that hides each server's location and transport details"
    answer: 0
    explanation: |
      P2P removes the privileged central node — every symmetric peer acts as both client and
      server, so the system scales and self-heals as nodes join/leave.
    ref: "concepts.md#peer-to-peer"

  - id: arch-specialized-024
    difficulty: intermediate
    tags: [peer-to-peer, discovery, dht-gossip]
    question: |
      How do peers in a Peer-to-Peer system typically locate resources and track membership?
    options:
      - "A central registry owned by the primary node that every peer must query to locate resources"
      - "The client-side stub marshals each lookup and forwards it to a central broker for routing"
      - "A control scheduler assigns each lookup to the Knowledge Source whose trigger condition fires"
      - "Distributed Hash Tables / consistent hashing for lookup and gossip for membership"
    answer: 3
    explanation: |
      Structured P2P uses DHTs/consistent hashing for resource lookup and gossip protocols for
      membership/state dissemination; consensus is used where global agreement is needed.
    ref: "concepts.md#peer-to-peer"

  - id: arch-specialized-025
    difficulty: advanced
    tags: [peer-to-peer, trade-offs, ilities]
    question: |
      Which pair correctly states what P2P optimizes and what it sacrifices?
    options:
      - "Optimizes strong linearizable consistency + auditability; sacrifices availability + elastic scale"
      - "Optimizes testability + deterministic debugging; sacrifices extensibility + runtime flexibility"
      - "Optimizes write latency + single-writer ordering; sacrifices read latency + fan-out throughput"
      - "Optimizes scalability + availability (no SPOF); sacrifices consistency + manageability"
    answer: 3
    explanation: |
      P2P gains elastic scale and no-SPOF availability, but strong consistency, discovery,
      trust/security, and operability become hard.
    ref: "concepts.md#peer-to-peer"

  - id: arch-specialized-026
    difficulty: intermediate
    tags: [peer-to-peer, differs-from, primary-replica]
    question: |
      What most clearly distinguishes Peer-to-Peer from Primary-Replica and Client-Server?
    options:
      - "P2P has no privileged authoritative node — every peer is equal"
      - "P2P designates one privileged authoritative node while Primary-Replica and Client-Server are fully symmetric"
      - "P2P can only accept writes and is architecturally incapable of ever serving any read traffic to peers"
      - "P2P always relies on a central coordinator that hands out work units to every subordinate peer"
    answer: 0
    explanation: |
      Primary-Replica and Client-Server have a privileged authoritative node. In P2P every
      peer is functionally identical with no privileged node.
    ref: "concepts.md#peer-to-peer"

  - id: arch-specialized-027
    difficulty: advanced
    tags: [peer-to-peer, deep-dive, cross-reference]
    question: |
      For consensus internals and for DHT/consistent-hashing mechanics, which topics does
