      Consensus lives in consensus-clocks-and-time; DHT/consistent-hashing mechanics live in
      rate-limiting-and-consistent-hashing.
    ref: "concepts.md#peer-to-peer"

  - id: arch-specialized-028
    difficulty: beginner
    tags: [master-worker, problem-fit, parallelism]
    question: |
      What workload shape is Master-Worker designed for?
    options:
      - "A non-algorithmic perception problem with no deterministic solution, solved by opportunistic specialist reasoning"
      - "A large, deterministic workload that can be partitioned and computed in parallel with fault isolation"
      - "A read-heavy database needing failover redundancy and read fan-out across asynchronous replicas"
      - "Location-transparent RPC between heterogeneous platforms that must call each other by logical name"
    answer: 1
    explanation: |
      Master-Worker splits a large deterministic workload into independent sub-tasks run by
      identical workers, then aggregates — MapReduce, render farms, parallel search.
    ref: "concepts.md#master-worker"

  - id: arch-specialized-029
    difficulty: intermediate
    tags: [master-worker, coordinator, fault-isolation]
    question: |
      A single sub-task in a Master-Worker job fails. What is the natural recovery?
    options:
      - "Restart the entire job from scratch, discarding every sub-task result that has already completed"
      - "Promote one of the read replicas to primary and replay the write log to recover the lost work"
      - "Re-dispatch just that failed sub-task to another worker (fault isolation)"
      - "Fire a new Knowledge Source whose trigger condition matches the failed shard's partial state"
    answer: 2
    explanation: |
      Because sub-tasks are independent and workers are stateless, the coordinator re-dispatches
      only the failed shard — fault isolation without redoing the whole job.
    ref: "concepts.md#master-worker"

  - id: arch-specialized-030
    difficulty: advanced
    tags: [master-worker, stragglers, tail-latency]
    question: |
      What most commonly dominates the tail latency of a Master-Worker job?
    options:
      - "Cold starts of the interpreter engine as it parses the job's DSL before each sub-task runs"
      - "Stragglers — the slowest worker/sub-task holding up aggregation"
      - "Replication lag on read replicas that trail the primary's latest committed writes"
      - "Broker marshalling overhead serializing every sub-task call through the central mediation hub"
    answer: 1
    explanation: |
      The job cannot finish until the slowest sub-task returns, so stragglers dominate tail
      latency (often mitigated with speculative/backup task execution).
    ref: "concepts.md#master-worker"

  - id: arch-specialized-031
    difficulty: advanced
    tags: [master-worker, correctness, constraints]
    question: |
      Master-Worker's correctness depends on which property of its sub-tasks?
    options:
      - "They must communicate frequently with each other to exchange intermediate partial results"
      - "They must all run co-located on the same physical host to share a common memory address space"
      - "They must share a single piece of mutable global state that every worker updates concurrently"
      - "They must be independent and deterministic"
    answer: 3
    explanation: |
      Workers do not talk to each other; correctness and safe retries require independent,
      deterministic sub-tasks. Tightly-coupled computations do not fit.
    ref: "concepts.md#master-worker"

  - id: arch-specialized-032
    difficulty: intermediate
    tags: [master-worker, primary-replica, differs-from]
    question: |
      How does Master-Worker differ from Primary-Replica?
    options:
      - "Master-Worker partitions compute; Primary-Replica replicates the same data for reads/HA"
      - "Master-Worker replicates the same data for read fan-out; Primary-Replica partitions compute across parallel workers"
      - "They are the same underlying style with two interchangeable names for one identical topology"
      - "Master-Worker runs with no coordinator at all; Primary-Replica accepts writes on many equal primaries"
    answer: 0
    explanation: |
      Master-Worker is about parallel compute partitioning; Primary-Replica is about copying
      data for read scaling and availability — different problems.
    ref: "concepts.md#master-worker"

