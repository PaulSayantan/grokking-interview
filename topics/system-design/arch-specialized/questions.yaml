      - "Optimizes read scalability via replica fan-out; sacrifices write scalability behind a single primary"
      - "Optimizes strong consistency + durable ordering; sacrifices availability under network partitions"
      - "Optimizes flexibility/portability; sacrifices performance and toolability"
    answer: 3
    explanation: |
