      Primary-Replica?
    options:
      - "Multi-Primary / leaderless Peer-to-Peer, because it accepts writes on many nodes for availability; Primary-Replica has a single write authority and cannot offer local low-latency writes everywhere"
      - "Primary-Replica, because a single global primary transparently scales write throughput across every region while its replicas absorb any remaining write load"
      - "Broker, because hiding each node's physical location behind a mediating broker is what lets every region accept fast local low-latency writes on its own"
