topic: Observability, Monitoring and Site Reliability
domain: system-design
topic_slug: observability-monitoring-reliability
version: 1
questions:
- id: observability-monitoring-reliability-001
  difficulty: beginner
  tags:
  - observability
  - monitoring
  - definitions
  question: |
    What best distinguishes observability from traditional monitoring?
  options:
  - Monitoring answers pre-defined known-unknowns via dashboards/alerts, while observability lets you
    answer novel unknown-unknowns without shipping new code
  - Monitoring is only for databases while observability is only for microservices
  - Observability replaces the need for any dashboards or alerts
  - Monitoring is always more expensive than observability
  answer: 0
  explanation: |
    Monitoring targets questions you anticipated (is CPU>80%?); observability provides
    rich, high-cardinality telemetry so you can ask questions you did not anticipate.
    (1) is a false scope split, (2) is wrong because you still alert on cheap metrics,
    (3) inverts the cost reality (high-cardinality data is often pricier).
  ref: concepts.md#monitoring-versus-observability
- id: observability-monitoring-reliability-002
  difficulty: beginner
  tags:
  - three-pillars
  - metrics
  - logs
  - traces
  question: |
    In the canonical debugging workflow, what role does each of the three pillars play?
  options:
  - Logs page you, metrics localize, traces give root cause
  - Metrics tell you THAT something is wrong (alert), traces tell you WHERE, logs tell you WHY
  - Traces page you, logs localize, metrics give root cause
  - All three do exactly the same thing and are interchangeable
  answer: 1
  explanation: |
    Cheap aggregate metrics detect and page; traces localize the failing service/hop;
    logs (joined by trace_id) give the exact root cause. The others scramble the roles;
    the pillars are complementary, not interchangeable (3).
  ref: concepts.md#the-three-pillars-metrics-logs-and-traces
- id: observability-monitoring-reliability-003
  difficulty: beginner
  tags:
  - metrics
  - types
  - counter
  - gauge
  question: |
    Which statement correctly pairs a metric type with its meaning?
  options:
  - A counter can freely increase and decrease and is read as an absolute value
  - A gauge is monotonically increasing and you query its rate
  - A counter is monotonically increasing and you typically query its rate(); a gauge goes up and down
  - A histogram stores a single scalar with no distribution information
  answer: 2
  explanation: |
    Counters only go up (query rate()); gauges fluctuate (queue depth, memory). (0) and
    (1) swap the definitions. (3) is wrong: a histogram stores bucketed observations to
    compute percentiles.
  ref: concepts.md#metrics-counters-gauges-histograms-and-cardinality
- id: observability-monitoring-reliability-004
  difficulty: beginner
  tags:
  - logs
  - structured-logging
  question: |
    Why is structured (JSON/key-value) logging preferred over free-text logging at scale?
  options:
  - It uses less disk than any other format in all cases
  - It guarantees logs contain no PII
  - It removes the need for a log store entirely
  - It makes logs machine-parseable, queryable, and correlatable instead of requiring brittle regex/grep
  answer: 3
  explanation: |
    Structured logs can be filtered/aggregated by field and joined by trace_id. Structure
    is usually MORE verbose, not smaller (0); you still need a store (2); and it does not
    by itself prevent PII leakage (1) - that needs redaction.
  ref: concepts.md#structured-logging-and-correlation-ids
- id: observability-monitoring-reliability-005
  difficulty: beginner
  tags:
  - tracing
  - spans
  question: |
    In distributed tracing, what is a span?
  options:
  - One unit of work (an operation) within a trace, with a start time, duration, attributes, and parent
    span id
  - A single numeric metric sample
  - The full log file for a service
  - A dashboard panel in Grafana
  answer: 0
  explanation: |
    A trace is a tree of spans; each span is one operation (HTTP handler, DB query, RPC)
    with timing and a parent link. The others describe a metric, a log, and a UI element.
  ref: concepts.md#distributed-tracing-and-opentelemetry
- id: observability-monitoring-reliability-006
  difficulty: beginner
  tags:
  - sli-slo-sla
  - definitions
  question: |
    What is the key test that distinguishes an SLA from an SLO?
  options:
  - An SLA is measured in milliseconds and an SLO in percentages
  - An SLA has explicit consequences (e.g., financial penalties) for missing the target; an SLO is an
    internal target with no contractual penalty
  - An SLO is always stricter and public; an SLA is internal
  - There is no difference; the terms are synonyms
  answer: 1
  explanation: |
    Ask 'what happens if we miss it?' - if money/consequences change hands, it is an SLA.
    An SLO is the internal target. Units (0) do not define them; internal SLOs are usually
    STRICTER than public SLAs, so (2) inverts the relationship, and (3) is wrong because the
    terms are not synonyms.
  ref: concepts.md#sli-slo-sla-and-error-budgets
- id: observability-monitoring-reliability-007
  difficulty: beginner
  tags:
  - red-method
  - golden-signals
  question: |
    What do the three letters in the RED method stand for?
  options:
  - Reliability, Efficiency, Durability
  - Requests, Endpoints, Deployments
  - Rate, Errors, Duration
  - Retry, Escalate, Deploy
  answer: 2
  explanation: |
    RED = Rate (requests/sec), Errors (failed requests), Duration (latency distribution) -
    the request-driven, user-facing view of a service. The others are invented expansions.
  ref: concepts.md#red-use-and-the-four-golden-signals
- id: observability-monitoring-reliability-008
  difficulty: beginner
  tags:
  - use-method
  - resources
  question: |
    The USE method tells you to check which three things for every resource?
  options:
  - Uptime, Speed, Errors
  - Users, Sessions, Events
  - Usage, Scale, Efficiency
  - Utilization, Saturation, Errors
  answer: 3
  explanation: |
    USE = Utilization, Saturation, Errors, applied per resource (CPU, disk, network,
    pools) - the machine/inside-out view. The others are not the USE method.
  ref: concepts.md#red-use-and-the-four-golden-signals
- id: observability-monitoring-reliability-009
  difficulty: beginner
  tags:
  - health-checks
  - kubernetes
  - probes
  question: |
    In Kubernetes, what does a failed LIVENESS probe cause?
  options:
  - The container is restarted
  - The pod is permanently deleted and never recreated
  - The instance is removed from the load balancer but keeps running
  - Nothing; liveness probes are informational only
  answer: 0
  explanation: |
    A failed liveness probe restarts the container (it assumes the process is wedged). A
    failed READINESS probe (2) removes it from the LB without killing it. (1) and (3) are
    incorrect probe semantics.
  ref: concepts.md#health-checks-and-probes
- id: observability-monitoring-reliability-010
  difficulty: beginner
  tags:
  - postmortems
  - culture
  question: |
    What is the core principle of a blameless postmortem?
  options:
  - Identify which individual made the mistake so they can be disciplined
  - Analyze systemic and contributing factors rather than blaming individuals, so people share information
    and the org learns
  - Skip writing anything down to save time
  - Only executives are allowed to write them
  answer: 1
  explanation: |
    Blameless focuses on the system (why did the guardrail/alert/CI not catch it?), not
    the person, because blame drives information underground. (0) is the opposite; (2)
    and (3) contradict the practice.
  ref: concepts.md#blameless-postmortems
- id: observability-monitoring-reliability-011
  difficulty: beginner
  tags:
  - chaos-engineering
  - resilience
  question: |
    What is the fundamental idea behind chaos engineering?
  options:
  - Randomly deleting production data to test backups
  - Running load tests to find the maximum throughput
  - Injecting controlled failures to validate that resilience mechanisms (failover, timeouts, redundancy)
    actually work before a real outage tests them
  - Disabling all monitoring to see if anyone notices
  answer: 2
  explanation: |
    Chaos engineering deliberately injects faults (kill instances, add latency, fail a
    dependency) with a hypothesis and small blast radius to validate resilience. (0) is
    reckless and not the goal; (1) is load testing; (3) is the opposite of good practice.
  ref: concepts.md#chaos-engineering
- id: observability-monitoring-reliability-012
  difficulty: beginner
  tags:
  - alerting
  - http
  - status
  question: |
    An alert should generally be defined so that when it fires it means:
  options:
  - A dashboard color changed
  - A deploy completed successfully
  - A log line was written
  - A human needs to take action now
  answer: 3
  explanation: |
    A page/alert must be actionable and urgent; anything else is noise that causes alert
    fatigue. The other options are routine events, not paging conditions.
  ref: concepts.md#alerting-symptom-versus-cause-and-burn-rate-alerts
- id: observability-monitoring-reliability-013
  difficulty: beginner
  tags:
  - error-budget
  - sli-slo-sla
  question: |
    If a service has a 99.9% availability SLO, what is its error budget?
  options:
  - 0.1% of requests/time may fail (about 43 minutes per 30-day month)
  - 0.01% of requests/time may fail
  - 1% of requests/time may fail
  - There is no error budget with an SLO
  answer: 0
  explanation: |
    Error budget = 1 - SLO = 1 - 0.999 = 0.1%, roughly 43m12s over a 30-day month. (1) is
    99.99%, (2) is 99%, and (3) is wrong - the budget is exactly what an SLO defines.
  ref: concepts.md#sli-slo-sla-and-error-budgets
- id: observability-monitoring-reliability-014
  difficulty: beginner
  tags:
  - prometheus
  - metrics-stack
  question: |
    Prometheus primarily collects metrics using which model?
  options:
  - Targets push every sample to Prometheus over gRPC
  - It pulls (scrapes) metrics from targets' HTTP /metrics endpoints
  - It reads metrics directly from application log files
  - It uses SNMP traps exclusively
  answer: 1
  explanation: |
    Prometheus is pull-based: it scrapes /metrics endpoints on a schedule, which gives
    free liveness detection. Push (0) is StatsD/OTLP/Pushgateway style. (2) and (3) are
    not how Prometheus works.
  ref: concepts.md#prometheus-grafana-and-the-metrics-stack
- id: observability-monitoring-reliability-015
  difficulty: intermediate
  tags:
  - cardinality
  - metrics
  - cost
  question: |
    An engineer adds `user_id` as a label to a Prometheus metric to debug per-user issues,
    and Prometheus starts OOMing. What is the root cause and the best fix?
  options:
  - The scrape interval is too long; shorten it
  - Prometheus needs more disk; add storage volume
  - High-cardinality label (millions of user_ids) exploded the number of stored time series; remove the
    unbounded label and put user_id in traces/logs instead
  - The metric type should be a summary instead of a counter
  answer: 2
  explanation: |
    Each unique label-value combination is a separate time series; an unbounded label like
    user_id creates millions of series and OOMs the TSDB. The fix is to keep labels
    low-cardinality and push per-user identity into logs/traces. Scrape interval (0) and
    disk (1) do not address series explosion; metric type (3) is irrelevant to cardinality.
  ref: concepts.md#metrics-counters-gauges-histograms-and-cardinality
- id: observability-monitoring-reliability-016
  difficulty: intermediate
  tags:
  - metrics
  - histogram
  - summary
  - percentiles
  question: |
    You need p99 latency aggregated ACROSS many service replicas and want to change which
    percentile you view at query time. Which should you use and why?
  options:
  - Prometheus summaries, because client-computed quantiles are cheaper to store
  - A plain counter of requests, because rate() gives latency
  - A gauge of the last request's latency, because it is real-time
  - Prometheus histograms, because bucket counts are additive across instances and you compute quantiles
    at query time
  answer: 3
  explanation: |
    Histograms store additive buckets, so you can aggregate across replicas and compute any
    quantile with histogram_quantile() at query time. Summaries (0) compute quantiles
    client-side and are NOT aggregatable (you cannot average percentiles). A gauge (2)
    loses distribution; a counter (1) does not measure latency.
  ref: concepts.md#metrics-counters-gauges-histograms-and-cardinality
- id: observability-monitoring-reliability-017
  difficulty: intermediate
  tags:
  - percentiles
  - tail-latency
  question: |
    Why do experienced engineers alert on p99/p99.9 latency rather than the average?
  options:
  - A low average can hide a long tail (e.g., 1% of requests at 2s); and in a page built from many backend
    calls, tail latency is hit on nearly every render (tail amplification)
  - Averages are harder to compute than percentiles
  - Percentiles use less storage than averages
  - Averages are not supported by Prometheus
  answer: 0
  explanation: |
    The mean masks tail behavior; with fan-out, a p99 backend latency is experienced on
    almost every composite request. Averages are actually cheaper/simpler to compute (1,2
    wrong) and are fully supported (3 wrong).
  ref: concepts.md#metrics-counters-gauges-histograms-and-cardinality
- id: observability-monitoring-reliability-018
  difficulty: intermediate
  tags:
  - correlation-id
  - tracing
  - logs
  question: |
    A single user action fans out across 30 microservices. What single practice most
    enables you to gather ALL logs for that one request across all services?
  options:
  - Increasing the log level to DEBUG everywhere
  - Propagating a correlation/trace ID (e.g., W3C traceparent) generated at the edge through every downstream
    call and logging it as a structured field
  - Storing all logs in a single Elasticsearch index
  - Synchronizing clocks with NTP
  answer: 1
  explanation: |
    A propagated trace_id lets you join logs from all 30 services for one request and jump
    between logs and traces. DEBUG everywhere (0) just adds noise; one index (2) does not
    correlate records; NTP (3) helps timeline ordering but does not join them.
  ref: concepts.md#structured-logging-and-correlation-ids
- id: observability-monitoring-reliability-019
  difficulty: intermediate
  tags:
  - opentelemetry
  - collector
  - lock-in
  question: |
    What is the primary architectural benefit of the OpenTelemetry Collector?
  options:
  - It stores traces and metrics permanently so you do not need a backend
  - It replaces the need for correlation IDs
  - It is a vendor-neutral pipeline (receivers -> processors -> exporters) that decouples app instrumentation
    from backends, so you can filter/sample/redact/route and swap vendors without changing app code
  - It only works with Jaeger
  answer: 2
  explanation: |
    The Collector centralizes processing (batching, filtering, tail-sampling, redaction,
    fan-out) and decouples apps from vendors. It is not a long-term store (0), does not
    replace trace IDs (1), and is backend-agnostic (3).
  ref: concepts.md#distributed-tracing-and-opentelemetry
- id: observability-monitoring-reliability-020
  difficulty: intermediate
  tags:
  - sampling
  - head-based
  - tail-based
  question: |
    Your team must guarantee that EVERY trace that contains an error is stored, at 2M
    spans/sec. Which sampling approach is required and what is its main cost?
  options:
  - Head-based probabilistic sampling; its cost is broken traces
  - Head-based sampling at 100%; it is stateless and free
  - No sampling at all; store everything with no downside
  - Tail-based sampling; it can keep all error/slow traces because it decides after the trace completes,
    but requires stateful buffering of in-flight spans (memory + reassembly across nodes)
  answer: 3
  explanation: |
    Only tail sampling can key on the completed trace's outcome (error/latency), so it can
    keep all errors - at the cost of stateful buffering. Head sampling (0,1) decides before
    the outcome is known, so it cannot guarantee errors are kept. Storing everything (2) is
    exactly what is infeasible at 2M spans/sec.
  ref: concepts.md#sampling-head-based-versus-tail-based
- id: observability-monitoring-reliability-021
  difficulty: intermediate
  tags:
  - sampling
  - head-based
  question: |
    Why does head-based probabilistic sampling (hashing the trace id) never produce broken
    (partial) traces?
  options:
  - Because the keep/drop decision is deterministic on the trace id, so every service in the trace makes
    the same decision - either all spans are kept or none
  - Because it buffers the whole trace before deciding
  - Because it only samples errors
  - Because it runs exclusively in the Collector
  answer: 0
  explanation: |
    Hashing the trace id gives every participating service the same deterministic decision,
    so the whole trace is kept or dropped consistently. Buffering (1) describes tail
    sampling; head sampling cannot key on errors (2); and it can run anywhere, including in
    the SDK (3).
  ref: concepts.md#sampling-head-based-versus-tail-based
- id: observability-monitoring-reliability-022
  difficulty: intermediate
  tags:
  - alerting
  - symptom
  - cause
  question: |
    Which alert should PAGE a human, following symptom-based alerting best practice?
  options:
  - CPU utilization on one node exceeded 90% for 2 minutes
  - The user-facing checkout error ratio (SLI) is burning the error budget fast
  - A single pod restarted once
  - Disk usage crossed 70% on a host
  answer: 1
  explanation: |
    Page on symptoms users feel (SLO/error-budget burn). High CPU (0), a pod restart (2),
    and disk 70% (3) are causes that may be totally harmless if users are unaffected - keep
    them on dashboards/tickets, not pages, to avoid alert fatigue.
  ref: concepts.md#alerting-symptom-versus-cause-and-burn-rate-alerts
- id: observability-monitoring-reliability-023
  difficulty: intermediate
  tags:
  - health-checks
  - cascading-failure
  question: |
    A shared database blipped for 10 seconds. Every service instance's readiness probe did
    a deep DB check, so all instances were simultaneously pulled from the load balancer and
    the whole service went down - and stayed down after the DB recovered because nothing
    was in rotation. What is the design lesson?
  options:
  - Make the liveness probe check the database too
  - Increase the probe timeout to 10 minutes
  - Deep dependency checks in readiness can cause correlated fleet-wide removal; readiness should reflect
    THIS instance's ability, keep liveness shallow/local, and avoid letting a shared dependency fail all
    instances at once
  - Remove all health checks so instances stay in rotation
  answer: 2
  explanation: |
    Deep readiness checks turned a minor DB blip into a total outage via correlated failure.
    Keep liveness shallow/local and design readiness so a shared-dependency blip does not
    remove the entire fleet (fail-open / load-shed). Adding the DB to liveness (0) makes it
    worse (restart loops); a 10-min timeout (1) delays reaction badly; removing checks (3)
    loses all routing safety.
  ref: concepts.md#health-checks-and-probes
- id: observability-monitoring-reliability-024
  difficulty: intermediate
  tags:
  - incident-management
  - ics
  question: |
    During a large SEV1, why separate the Incident Commander role from the engineers fixing
    the problem?
  options:
  - So the commander can take credit for the fix
  - To reduce the number of people who need to be paged to one
  - Because engineers are not allowed to talk during incidents
  - So one person coordinates decisions/comms while responders focus on fixing - a single person doing
    both causes the incident to spiral
  answer: 3
  explanation: |
    The IC coordinates, decides, and delegates while ops leads fix and a comms lead updates
    stakeholders; conflating roles is how incidents lose coordination. (0) is not the point,
    (1) is false (you often need MORE responders), and (1)/(2) misstate the model.
  ref: concepts.md#on-call-and-incident-management
- id: observability-monitoring-reliability-025
  difficulty: intermediate
  tags:
  - chaos-engineering
  - blast-radius
  question: |
    What must be TRUE before you responsibly run chaos experiments in production?
  options:
  - You have good observability and baseline resilience, a defined steady-state hypothesis, a small blast
    radius, and an automatic abort condition
  - You have disabled monitoring so results are not biased
  - You run them at peak traffic with maximum blast radius for realism
  - You have removed all redundancy to see raw behavior
  answer: 0
  explanation: |
    Chaos validates resilience; you need observability to detect/abort, a steady-state
    hypothesis, minimal blast radius, and a kill switch. Disabling monitoring (1), max blast
    at peak (2), and removing redundancy (3) turn an experiment into a self-inflicted outage.
  ref: concepts.md#chaos-engineering
- id: observability-monitoring-reliability-026
  difficulty: intermediate
  tags:
  - capacity-planning
  - littles-law
  - estimation
  question: |
    A service handles 10,000 requests/sec with an average latency of 50 ms. Using Little's
    Law, roughly how many requests are in flight concurrently (drives thread/connection
    pool sizing)?
  options:
  - 50 concurrent requests
  - 500 concurrent requests
  - 5,000 concurrent requests
  - 10,000 concurrent requests
  answer: 1
  explanation: |
    Little's Law: L = lambda x W = 10,000/s x 0.05 s = 500 concurrent requests. (0), (2),
    and (3) misapply the formula.
  ref: concepts.md#capacity-planning-and-back-of-envelope-estimation
- id: observability-monitoring-reliability-027
  difficulty: intermediate
  tags:
  - capacity-planning
  - headroom
  - redundancy
  question: |
    You run a service across 3 availability zones and must survive losing an entire AZ while
    still serving peak load. What is the maximum steady-state utilization per AZ, and what
    is the trade-off?
  options:
  - ~100% per AZ; there is no trade-off
  - ~90% per AZ; failover is instant and free
  - ~66% per AZ, so the two surviving AZs can absorb the load - the trade-off is you pay for ~50% more
    capacity than peak strictly needs (the cost of resilience)
  - ~33% per AZ, which is the only safe number regardless of AZ count
  answer: 2
  explanation: |
    To lose 1 of 3 AZs and still serve peak, each AZ runs at <= ~66% so the remaining two
    cover it - extra capacity is the price of surviving an AZ failure. 100%/90% (0,3) leave
    no failover headroom; 33% (3) is over-conservative and depends on AZ count, not fixed.
  ref: concepts.md#capacity-planning-and-back-of-envelope-estimation
- id: observability-monitoring-reliability-028
  difficulty: intermediate
  tags:
  - logs
  - cost
  - storage
  - estimation
  question: |
    You emit 50,000 log events/sec, each ~1 KB, retained 30 days with 3x replication.
    Roughly how much raw storage is that per month, and what does it motivate?
  options:
  - ~4 TB; keep everything forever
  - ~3 PB; the only fix is to stop logging entirely
  - ~40 GB; storage cost is negligible
  - ~388 TB; it motivates log sampling (keep all errors, sample successes) and tiered retention
  answer: 3
  explanation: |
    1KB x 50,000/s x 86,400 x 30 x 3 ~= 388 TB/month raw - large enough to dominate the
    bill, which is exactly why you sample logs and tier retention. (0) and (2) are orders of
    magnitude off; (1) both overstates and prescribes an unusable 'fix'.
  ref: concepts.md#capacity-planning-and-back-of-envelope-estimation
- id: observability-monitoring-reliability-029
  difficulty: intermediate
  tags:
  - prometheus
  - scaling
  - thanos
  question: |
    A single Prometheus instance cannot meet your needs for 13-month retention, HA, and a
    global query view across many clusters. Which is the appropriate direction?
  options:
  - Adopt a horizontally scalable layer like Thanos, Cortex, Grafana Mimir, or VictoriaMetrics for long-term
    object-storage retention, dedup, and global query - accepting added operational complexity
  - Just add more RAM to the single Prometheus forever
  - Switch entirely to logging and drop metrics
  - Run 50 independent Prometheus servers with no aggregation and query each by hand
  answer: 0
  explanation: |
    Thanos/Cortex/Mimir/VictoriaMetrics add long-term retention, HA, dedup, and global
    query at the cost of operational complexity. Vertical scaling (1) has hard limits and no
    HA; dropping metrics (2) is not a solution; 50 unaggregated servers (3) is
    operationally unusable.
  ref: concepts.md#prometheus-grafana-and-the-metrics-stack
- id: observability-monitoring-reliability-030
  difficulty: intermediate
  tags:
  - push-pull
  - metrics
  - serverless
  question: |
    You must collect metrics from a fleet of short-lived AWS Lambda functions. Why is a
    pull-based Prometheus scrape a poor fit, and what is preferred?
  options:
  - Pull is fine; just scrape each Lambda every 100ms
  - Ephemeral functions may finish before a scrape and have no stable endpoint to scrape; prefer a push
    model (OTLP/StatsD/Pushgateway) suited to short-lived workloads
  - Lambda cannot emit metrics at all
  - You should switch Lambda to a StatefulSet so Prometheus can scrape it
  answer: 1
  explanation: |
    Pull requires a long-lived, discoverable target; Lambdas are ephemeral and may exit
    before being scraped, so push (OTLP/StatsD/Pushgateway) fits. (0) cannot work for
    functions that already exited; (2) is false; (3) misunderstands Lambda (it is not a k8s
    workload).
  ref: concepts.md#prometheus-grafana-and-the-metrics-stack
- id: observability-monitoring-reliability-031
  difficulty: intermediate
  tags:
  - red-use
  - batch
  - streaming
  question: |
    Why is the RED method a poor fit for a Kafka stream-processing consumer, and what should
    you measure instead?
  options:
  - RED works perfectly for consumers; measure request rate and duration
  - You should measure only CPU utilization and nothing else
  - A stream consumer has no discrete 'requests', so RED's rate/errors/duration do not map cleanly; measure
    consumer/partition lag, throughput, and apply USE to the worker resources
  - Streaming systems cannot be monitored
  answer: 2
  explanation: |
    RED is request-driven; queue/stream workers lack per-request semantics, so the key
    signals are consumer lag, throughput, and USE on the workers. (0) forces a bad fit; (1)
    is too narrow; (3) is false.
  ref: concepts.md#red-use-and-the-four-golden-signals
- id: observability-monitoring-reliability-032
  difficulty: intermediate
  tags:
  - error-budget
  - velocity
  question: |
    What is the primary purpose of an error budget in the reliability-vs-velocity trade-off?
  options:
  - To justify making the system 100% reliable
  - To replace SLOs entirely
  - To measure how many engineers are on call
  - 'To act as a data-driven policy: while budget remains, ship features fast; when it is exhausted, freeze
    risky launches and invest in reliability'
  answer: 3
  explanation: |
    The error budget (1 - SLO) is the shared, data-driven bridge between product velocity
    and reliability. 100% reliability (0) is neither achievable nor the goal; it is unrelated
    to on-call headcount (2); and it is derived FROM the SLO, not a replacement (1).
  ref: concepts.md#sli-slo-sla-and-error-budgets
- id: observability-monitoring-reliability-033
  difficulty: intermediate
  tags:
  - logs
  - elasticsearch
  - loki
  - cost
  question: |
    Your log bill is dominated by storage/compute cost and you mostly filter by a few labels
    (service, level) rather than full-text search. Which store fits and why?
  options:
  - Grafana Loki, because it indexes only labels and brute-forces the body, giving much cheaper storage
    when you mainly filter by labels
  - Elasticsearch, because it indexes every field for fast arbitrary search
  - A single relational table with a text column
  - Prometheus, because it is designed to store log bodies
  answer: 0
  explanation: |
    Loki indexes only labels (cheap) and is ideal when you filter by labels and cost
    dominates. Elasticsearch (1) is faster for arbitrary full-text search but far pricier - the
    opposite of your constraint. A relational table (2) does not scale for logs; Prometheus
    (3) stores metrics, not log bodies.
  ref: concepts.md#structured-logging-and-correlation-ids
- id: observability-monitoring-reliability-034
  difficulty: intermediate
  tags:
  - exemplars
  - sampling
  - metrics-traces
  question: |
    Even with aggressive trace sampling, how can an on-call engineer jump from a p99 latency
    spike on a metric straight to a concrete slow trace?
  options:
  - By storing 100% of traces, which sampling was meant to avoid
  - By using exemplars - links attached to a metric histogram bucket that point to a representative kept
    trace id
  - By grepping all logs for the word 'slow'
  - By increasing the scrape interval
  answer: 1
  explanation: |
    Exemplars attach a sample trace id to a metric bucket (e.g., the p99 bucket), so alerts
    link to a real trace even under sampling. Storing everything (0) defeats sampling;
    grepping (2) and scrape interval (3) do not connect metrics to traces.
  ref: concepts.md#sampling-head-based-versus-tail-based
- id: observability-monitoring-reliability-035
  difficulty: intermediate
  tags:
  - nines
  - availability
  - estimation
  question: |
    Approximately how much downtime per 30-day month does a 99.99% (four nines) SLO permit?
  options:
  - ~43 minutes
  - ~26 seconds
  - ~4.3 minutes
  - ~7 hours
  answer: 2
  explanation: |
    99.99% -> 0.01% of ~43,200 min/month ~= 4.3 minutes. ~43 min (0) is three nines, ~26 s
    (1) is five nines, and ~7 h (3) is two nines.
  ref: concepts.md#sli-slo-sla-and-error-budgets
- id: observability-monitoring-reliability-036
  difficulty: intermediate
  tags:
  - observability
  - wide-events
  - cardinality
  question: |
    Charity Majors-style observability advocates prefer 'wide events' with many attributes
    over many narrow pre-aggregated metrics. What is the core trade-off?
  options:
  - Wide events are always cheaper and have no downside
  - Wide events remove the need for alerting
  - Pre-aggregated metrics can answer any future question wide events can
  - Wide high-cardinality events let you ask unanticipated questions and slice arbitrarily after the fact,
    but cost more to store/index than cheap pre-aggregated counters
  answer: 3
  explanation: |
    Wide events preserve dimensionality so you can debug unknown-unknowns, at higher
    storage/index cost. They are not free (0); pre-aggregated metrics cannot answer
    questions whose dimensions were not kept (2); and you still need alerting (1).
  ref: concepts.md#monitoring-versus-observability
- id: observability-monitoring-reliability-037
  difficulty: intermediate
  tags:
  - on-call
  - burnout
  - page-load
  question: |
    Google's SRE guidance caps on-call load at roughly two incidents per shift. What is the
    main reason?
  options:
  - So responders have enough time to handle each incident well (investigate, mitigate, and write a proper
    postmortem) and to prevent burnout
  - To reduce the cloud bill
  - Because pagers can only hold two alerts
  - To ensure engineers never sleep
  answer: 0
  explanation: |
    Capping incidents per shift preserves quality of response and sustainability. It is not
    about cost (1) or a pager limit (2), and the goal is the opposite of sleep deprivation
    (3).
  ref: concepts.md#on-call-and-incident-management
- id: observability-monitoring-reliability-038
  difficulty: intermediate
  tags:
  - trace-context
  - propagation
  - w3c
  question: |
    Which is the modern, vendor-portable standard for propagating trace context across HTTP
    service boundaries?
  options:
  - The B3 headers, which are the current W3C recommendation
  - The W3C Trace Context standard (traceparent / tracestate headers)
  - A custom X-Request-ID with no standard format
  - The Prometheus exposition format
  answer: 1
  explanation: |
    W3C Trace Context (traceparent/tracestate) is the modern portable standard; B3 (0) is
    the older Zipkin format, not the W3C recommendation. A custom header (2) is not portable,
    and the Prometheus format (3) is for metrics scraping.
  ref: concepts.md#distributed-tracing-and-opentelemetry
- id: observability-monitoring-reliability-039
  difficulty: intermediate
  tags:
  - golden-signals
  - saturation
  question: |
    The Four Golden Signals add which signal to RED, and what does it capture?
  options:
  - Durability - how long data survives
  - Cost - the dollar spend of the service
  - Saturation - how 'full' the service/resource is (e.g., usage vs quota), a leading indicator of imminent
    problems
  - Security - the number of auth failures
  answer: 2
  explanation: |
    Four Golden Signals = Latency, Traffic, Errors, plus Saturation (fullness), which warns
    before you hit limits. Durability (0), cost (1), and security (3) are not the fourth
    golden signal.
  ref: concepts.md#red-use-and-the-four-golden-signals
- id: observability-monitoring-reliability-040
  difficulty: advanced
  tags:
  - alerting
  - burn-rate
  - multi-window
  question: |
    For a 99.9% SLO, why is a multi-window multi-burn-rate alert (e.g., 14.4x over 1h AND
    still burning over 5m) preferred over a static 'error rate > 1%' threshold?
  options:
  - It requires fewer parameters to configure
  - It guarantees you will never be paged
  - It removes the need for an SLO
  - 'It balances precision, recall, detection time, and reset time: fast pages for severe budget burns,
    slower tickets for gentle burns, and the short window confirms the burn is still active (killing false
    positives and giving fast reset)'
  answer: 3
  explanation: |
    Multi-window multi-burn-rate alerts page fast on severe burns, ticket on slow burns, and
    use the short window to confirm active burning - balancing the four alerting properties.
    They have MORE parameters, not fewer (0); they depend on the SLO (2); and they do page
    when appropriate (1).
  ref: concepts.md#alerting-symptom-versus-cause-and-burn-rate-alerts
- id: observability-monitoring-reliability-041
  difficulty: advanced
  tags:
  - alerting
  - burn-rate
  - fatigue
  question: |
    With a naive per-minute 'error ratio over threshold' page, the SRE Workbook notes you
    could receive up to 144 pages a day and still meet the SLO. What does this illustrate?
  options:
  - That naive thresholds produce alert fatigue (huge false-positive volume) while a burn-rate approach
    fires only on events consuming a significant fraction of the budget
  - That static thresholds are the most precise alerting method
  - That you should lower the SLO to 100%
  - That paging should be done every minute for safety
  answer: 0
  explanation: |
    144 harmless pages/day is pure fatigue; burn-rate alerting fires only when a meaningful
    share of the budget is consumed. Static thresholds are the LEAST precise here (1);
    lowering to 100% (2) is impossible; per-minute paging (3) is the fatigue problem itself.
  ref: concepts.md#alerting-symptom-versus-cause-and-burn-rate-alerts
- id: observability-monitoring-reliability-042
  difficulty: advanced
  tags:
  - sli-slo-sla
  - over-achievement
  question: |
    Google deliberately injects planned downtime into its Chubby lock service even when it
    is exceeding its SLO. Why?
  options:
  - To save money on servers
  - Because chronically over-achieving an SLO makes users depend on the ACTUAL (higher) reliability, creating
    hidden fragile dependencies; planned outages flush out those unreasonable dependencies
  - To test the pager rotation
  - Because Chubby has no SLO
  answer: 1
  explanation: |
    Over-achievement creates a false sense of security: users couple to real performance,
    not the stated SLO. Planned downtime breaks those dependencies and enforces the
    contracted reliability. It is not about cost (0), pager testing (2), and Chubby does have
    an SLO (3).
  ref: concepts.md#sli-slo-sla-and-error-budgets
- id: observability-monitoring-reliability-043
  difficulty: advanced
  tags:
  - slo-design
  - target-setting
  question: |
    Your service currently runs at 99.995% availability by luck. A junior engineer proposes
    setting the SLO to 99.995%. What is the best objection?
  options:
  - The SLO should always be 100%
  - SLOs should be as tight as physically possible to impress customers
  - Do not set SLO targets based on current best-case performance - it locks you into heroic effort and
    leaves no error budget; derive the target from what users actually need and keep a safety margin
  - You should copy a competitor's SLO exactly
  answer: 2
  explanation: |
    Basing the target on lucky current performance is a classic anti-pattern: it removes
    slack and forces heroics. Derive from user needs, keep margin, start loose. 100% (0) is
    unachievable; tightest-possible (1) burns the team; copying a competitor (3) ignores your
    users' actual needs.
  ref: concepts.md#sli-slo-sla-and-error-budgets
- id: observability-monitoring-reliability-044
  difficulty: advanced
  tags:
  - nines
  - dependency
  - diminishing-returns
  question: |
    Product wants your backend at 99.999% (five nines), but the average client's mobile
    network is only ~99.9% available. What is the strongest reasoning?
  options:
  - Build five nines anyway; more reliability is always better
  - The client network is irrelevant to backend SLO decisions
  - Lower the backend to match the client at exactly 99.9% and stop measuring
  - Five nines on the backend is largely invisible when the client path is 99.9%; the extra nines cost
    exponentially more (multi-region, redundancy, heroics) for reliability users cannot perceive - set
    the SLO to what is perceptible and cost-justified
  answer: 3
  explanation: |
    End-to-end reliability is bounded by the weakest link; spending exponentially for
    invisible nines is waste. Always-more (0) ignores cost/perceptibility; blindly matching
    and not measuring (2) is sloppy; and the client path is very relevant (1).
  ref: concepts.md#sli-slo-sla-and-error-budgets
- id: observability-monitoring-reliability-045
  difficulty: advanced
  tags:
  - cost
  - cardinality
  - build-vs-buy
  question: |
    A startup on a managed observability vendor sees the bill explode as it scales, driven
    by per-active-series billing. Which analysis is most accurate?
  options:
  - Per-series billing punishes cardinality, so managed cost grows steeply with scale; self-hosting (e.g.,
    OTel + ClickHouse-backed stores) flips the curve - higher ops effort but far cheaper per GB at large
    volume - which is why many orgs migrate once the bill dominates
  - Managed vendors are always cheaper than self-hosting at every scale
  - The only fix is to stop collecting metrics
  - Cardinality has no effect on managed pricing
  answer: 0
  explanation: |
    Managed is cheap to start and painful at scale because per-series billing penalizes
    cardinality; self-hosting is the opposite cost curve. (1) is false at scale; (2) throws
    away observability; (3) is exactly wrong - cardinality is a primary cost driver.
  ref: concepts.md#cardinality-and-the-cost-of-observability
- id: observability-monitoring-reliability-046
  difficulty: advanced
  tags:
  - sampling
  - pipeline
  - combined
  question: |
    At very high span volume, why do teams often combine head sampling AND tail sampling in
    the same pipeline?
  options:
  - Because tail sampling alone produces broken traces
  - Head-sample early to protect the telemetry pipeline (and Collector) from being overloaded by raw volume,
    then tail-sample to guarantee all error/slow traces survive
  - Because head sampling keeps all errors and tail sampling keeps none
  - To double the storage cost intentionally
  answer: 1
  explanation: |
    Head sampling cheaply sheds bulk volume up front (protecting the pipeline), and tail
    sampling downstream ensures the rare interesting traces (errors/slow) are retained. Tail
    alone does not inherently break traces (0); the error-keeping roles are reversed in (2);
    and the goal is to reduce, not increase, cost (3).
  ref: concepts.md#sampling-head-based-versus-tail-based
- id: observability-monitoring-reliability-047
  difficulty: advanced
  tags:
  - health-checks
  - liveness
  - cascading
  question: |
    Why is it dangerous to make a Kubernetes LIVENESS probe depend on a downstream service
    with a tight timeout?
  options:
  - It has no effect; liveness probes ignore downstreams
  - It makes the pods start faster
  - If the downstream slows or blips, every instance's liveness probe fails and Kubernetes restart-loops
    the entire fleet, amplifying a minor downstream issue into a full self-inflicted outage
  - It automatically scales the deployment up
  answer: 2
  explanation: |
    Liveness failure restarts containers; coupling it to a downstream turns a downstream
    slowdown into fleet-wide restart loops. Keep liveness shallow/local and put dependency
    awareness in readiness. (0), (1), and (3) are all incorrect effects.
  ref: concepts.md#health-checks-and-probes
- id: observability-monitoring-reliability-048
  difficulty: advanced
  tags:
  - postmortems
  - root-cause
  question: |
    Mature reliability orgs reject 'the single root cause' framing for complex outages. Why?
  options:
  - Because finding any cause is impossible
  - Because only the person who triggered it matters
  - Because postmortems should not investigate causes at all
  - Because complex outages arise from multiple contributing factors and latent conditions; fixing only
    the trigger leaves the underlying conditions in place to cause a recurrence
  answer: 3
  explanation: |
    Complex failures are multi-factor; a single 'root cause' obscures latent conditions that
    remain. Causes are investigable (0 wrong); postmortems exist to find them (2 wrong); and
    focusing on the person is blameful, not systemic (1 wrong).
  ref: concepts.md#blameless-postmortems
- id: observability-monitoring-reliability-049
  difficulty: advanced
  tags:
  - automation
  - incident-response
  - mttr
  question: |
    When should you automate remediation (e.g., auto-rollback, auto-drain a host) vs keep a
    human in the loop?
  options:
  - Automate safe, well-understood mitigations (rollback a bad deploy, drain a bad host) to cut MTTR,
    but keep humans for ambiguous situations, because automation acting on a false signal can itself cause
    an outage or mask a real bug
  - Automate everything; humans only slow things down
  - Never automate; all remediation must be manual
  - Automate only during business hours regardless of the action
  answer: 0
  explanation: |
    Automation slashes MTTR for deterministic, safe mitigations but can amplify a false
    signal into a new outage, so ambiguous cases need humans. 'Automate everything' (1) is
    reckless; 'never automate' (2) forfeits MTTR gains; time-of-day (3) is not the right axis.
  ref: concepts.md#on-call-and-incident-management
- id: observability-monitoring-reliability-050
  difficulty: advanced
  tags:
  - chaos-engineering
  - prod-vs-staging
  question: |
    What is the strongest argument for running chaos experiments in production rather than
    only in staging, and how do you manage the risk?
  options:
  - Production has no risk, so just run everything there
  - Production has real traffic, data, and dependencies that surface emergent failures staging never reproduces;
    manage risk with tiny blast radius, feature-flag kill switches, off-peak timing, and strong observability
    to detect/abort
  - Staging always perfectly mirrors production, so prod chaos is pointless
  - Chaos should never be run in production under any circumstances
  answer: 1
  explanation: |
    Only production exposes real emergent behavior; you contain the risk with small blast
    radius, kill switches, timing, and observability. (0) ignores real risk; (2) is false
    (staging is lower fidelity); (3) is overly absolute and forfeits the main benefit.
  ref: concepts.md#chaos-engineering
- id: observability-monitoring-reliability-051
  difficulty: advanced
  tags:
  - capacity-planning
  - queueing
  - utilization
  question: |
    Why do experienced engineers target ~50-70% steady-state CPU utilization rather than
    pushing toward 90-100%?
  options:
  - Because CPUs physically cannot exceed 70%
  - Because cloud providers bill more above 70% utilization
  - 'Because queueing delay grows non-linearly as utilization approaches 100% (M/M/1: latency ~ 1/(1-utilization)),
    so latency explodes near saturation and there is no headroom for bursts or failover'
  - Because 70% is a legal requirement
  answer: 2
  explanation: |
    Near 100% utilization, queue length and latency blow up (M/M/1), and there is no room to
    absorb spikes or a failed instance. CPUs can exceed 70% (0); it is not a billing (1) or
    legal (3) rule.
  ref: concepts.md#capacity-planning-and-back-of-envelope-estimation
- id: observability-monitoring-reliability-052
  difficulty: advanced
  tags:
  - autoscaling
  - over-provisioning
  question: |
    Your service faces sudden 10x traffic spikes with no warning. What is the best capacity
    strategy and its trade-off?
  options:
  - Pure reactive autoscaling with a cold start, because it is the cheapest
  - Disable autoscaling and rely on retries to smooth the spike
  - Static provisioning at exactly average load to minimize cost
  - Keep a warm over-provisioned baseline plus burst autoscaling (and pre-scale for known events), because
    autoscaling lag (minutes to warm) cannot absorb a sudden spike alone - you trade some idle cost for
    spike survivability
  answer: 3
  explanation: |
    Autoscaling has warm-up lag, so sudden spikes need a warm baseline plus burst scaling
    and pre-scaling; the trade-off is paying for some idle headroom. Pure reactive scaling
    (0) drops requests during warm-up; provisioning to average (2) is under-capacity;
    retries (1) amplify load during a spike (retry storm).
  ref: concepts.md#capacity-planning-and-back-of-envelope-estimation
- id: observability-monitoring-reliability-053
  difficulty: advanced
  tags:
  - cost
  - fidelity
  - mttr
  question: |
    What is the central tension in deciding how much observability to collect?
  options:
  - 'Fidelity vs cost: more dimensions/retention/traces lower MTTR by enabling deep debugging, but cost
    more; under-instrumenting is also expensive because you go blind during incidents and MTTR explodes'
  - There is no tension; always collect the maximum
  - Only cost matters; MTTR is irrelevant
  - Only MTTR matters; cost is irrelevant
  answer: 0
  explanation: |
    Both over- and under-instrumenting are costly: over-collecting burns cash on unused
    data, under-collecting blinds you and inflates MTTR (itself expensive). Extremes (1,2,3)
    ignore one side of the trade-off.
  ref: concepts.md#cardinality-and-the-cost-of-observability
- id: observability-monitoring-reliability-054
  difficulty: advanced
  tags:
  - ebpf
  - auto-instrumentation
  - modern
  question: |
    eBPF-based observability (Pixie, Cilium/Hubble, Beyla) auto-generates RED metrics and
    traces with no code changes. What is its main limitation vs manual instrumentation?
  options:
  - It cannot observe network traffic
  - It sees only what is visible at the kernel/syscall layer and cannot capture app-level business context/attributes
    that manual spans add; it is also kernel-version dependent and needs privileged access
  - It requires rewriting every service in Rust
  - It permanently replaces the need for any manual instrumentation
  answer: 1
  explanation: |
    eBPF gives zero-code baseline coverage but lacks business semantics (a manual span can
    tag cart_size, tenant_tier), is kernel-dependent, and needs privileges. It excels at
    network/syscall visibility (0 wrong), requires no rewrite (2), and complements rather
    than replaces manual spans (3).
  ref: concepts.md#modern-patterns-otel-pipelines-ebpf-and-ai-observability
- id: observability-monitoring-reliability-055
  difficulty: advanced
  tags:
  - ai-observability
  - llm
  - genai
  question: |
    You are adding observability to a RAG/LLM feature. Which set of signals is most
    appropriate, and what is the key trade-off?
  options:
  - Only CPU and memory, because LLMs are just compute
  - Only request count, because RED covers everything an LLM needs
  - Token usage/cost per request, time-to-first-token/streaming latency, retrieval quality, eval/quality
    scores, and prompt/response capture - but capturing full prompts/responses is a cost and PII/privacy
    risk, so sample and redact
  - Nothing new is needed; existing HTTP metrics fully describe LLM behavior
  answer: 2
  explanation: |
    GenAI apps need token/cost, TTFT, retrieval quality, and eval scores, plus prompt capture
    - with sampling/redaction because full capture is a cost and PII bomb. CPU/memory (0),
    RED alone (1), and HTTP metrics (3) miss token cost, quality, and retrieval signals.
  ref: concepts.md#modern-patterns-otel-pipelines-ebpf-and-ai-observability
- id: observability-monitoring-reliability-056
  difficulty: advanced
  tags:
  - cell-based
  - blast-radius
  - modern
  question: |
    In a cell-based (partitioned, isolated stacks) architecture, why must telemetry be
    tagged per cell?
  options:
  - To reduce the total number of metrics
  - To make traces shorter
  - Because cells cannot emit metrics otherwise
  - So you can see per-cell health, run per-cell canaries, and confirm blast-radius isolation - because
    aggregate-only dashboards would hide a single sick cell among healthy ones
  answer: 3
  explanation: |
    Per-cell tagging preserves the visibility that cell-based isolation is meant to give -
    spotting one bad cell and doing per-cell canaries. Aggregation would mask the sick cell.
    It does not reduce metric count (0), cells can emit metrics regardless (2), and it does
    not shorten traces (1).
  ref: concepts.md#modern-patterns-otel-pipelines-ebpf-and-ai-observability
- id: observability-monitoring-reliability-057
  difficulty: advanced
  tags:
  - tiered-retention
  - downsampling
  - cost
  question: |
    To retain metrics for 13 months affordably while keeping recent data high-resolution,
    what technique is standard?
  options:
  - 'Tiered retention with downsampling: keep raw high-resolution samples for days on fast storage, roll
    up to 5m/1h aggregates for months, and move older data to cheap object storage'
  - Store every raw sample at full resolution forever on SSD
  - Delete all metrics older than one day
  - Convert all metrics to logs
  answer: 0
  explanation: |
    Downsampling + tiered storage (hot SSD for recent raw, cheap object storage for
    downsampled history) balances resolution and cost. Full raw forever (1) is prohibitively
    expensive; deleting after a day (2) loses long-term trends; converting to logs (3) is
    more expensive and loses aggregatability.
  ref: concepts.md#cardinality-and-the-cost-of-observability
- id: observability-monitoring-reliability-058
  difficulty: advanced
  tags:
  - aggregation
  - wide-events
  - trade-off
  question: |
    What do you permanently lose by pre-aggregating telemetry into metrics at the edge
    rather than keeping raw wide events?
  options:
  - Nothing; pre-aggregated metrics can reconstruct any raw detail
  - The ability to ask new questions along dimensions you did not pre-aggregate on - pre-aggregation is
    cheap and fast for known questions but destroys per-event detail
  - The ability to alert on the metric
  - The ability to store the data cheaply
  answer: 1
  explanation: |
    Pre-aggregation collapses dimensions, so you cannot later slice by an attribute you
    dropped; it is cheaper and great for known questions but sacrifices flexibility. It
    cannot reconstruct raw detail (0), still supports alerting (2), and is actually the
    cheaper option (3).
  ref: concepts.md#cardinality-and-the-cost-of-observability
- id: observability-monitoring-reliability-059
  difficulty: advanced
  tags:
  - otel
  - lock-in
  - strategy
  question: |
    A company wants freedom to switch observability backends later without re-instrumenting
    every service. What is the recommended modern approach?
  options:
  - Instrument with a single proprietary vendor agent everywhere for simplicity
  - Write custom instrumentation tightly coupled to each backend's API
  - Instrument with OpenTelemetry (SDK + Collector) and export via OTLP, so app code is decoupled from
    the backend and vendors can be swapped by reconfiguring exporters
  - Avoid instrumentation and rely on the vendor to infer everything
  answer: 2
  explanation: |
    OTel is vendor-neutral: instrument once, route via the Collector, swap backends by
    changing exporters. A proprietary agent (0) and backend-coupled custom code (1) create
    lock-in; relying on inference (3) yields poor coverage.
  ref: concepts.md#modern-patterns-otel-pipelines-ebpf-and-ai-observability
- id: observability-monitoring-reliability-060
  difficulty: expert
  tags:
  - scenario
  - tracing
  - sampling
  - cost
  question: |
    A payments platform does 500k req/s, each fanning to ~15 services (~7.5M spans/s). SREs
    must debug rare (0.05%) intermittent failures with full traces, keep p99-slow traces,
    and cap the observability budget. Which design is best?
  options:
  - Store 100% of traces in Elasticsearch for maximum fidelity
  - Head-sample 100% (keep all) but retain for only 1 hour
  - Turn off tracing and rely solely on metrics and logs
  - Head-sample ~1% probabilistically to protect the pipeline, run tail-sampling in the Collector to keep
    100% of error and p99-slow traces, emit exemplars from p99 metric buckets, and use tiered retention
  answer: 3
  explanation: |
    The winning design combines head sampling (protect pipeline/cost), tail sampling (keep
    all rare errors and slow traces - which uniform head sampling would miss), exemplars
    (jump from metrics to a kept trace), and tiered retention. Storing 100% (0) blows the
    budget at 7.5M spans/s; 100% head sampling with 1h retention (1) is costly AND loses
    history; dropping tracing (2) forfeits the cross-service latency attribution the task
    requires.
  ref: concepts.md#sampling-head-based-versus-tail-based
- id: observability-monitoring-reliability-061
  difficulty: expert
  tags:
  - scenario
  - slo
  - alerting
  - judgment
  question: |
    A checkout service has a 99.9% success SLO over 28 days. On-call is drowning in pages
    from a 'error rate > 0.5% for 1 minute' rule, yet a slow multi-hour degradation once
    silently ate the whole budget. What is the best redesign?
  options:
  - 'Replace the static rule with multi-window multi-burn-rate SLO alerts: page at 14.4x burn (1h/5m)
    and 6x burn (6h/30m) for fast/severe burns, and open a ticket at 1x burn (3d/6h) for slow burns -
    alerting on the user-facing success SLI'
  - Lower the SLO to 99% so alerts fire less often
  - Page on CPU and memory instead of error rate
  - Remove all alerting and rely on customer complaints
  answer: 0
  explanation: |
    Multi-window multi-burn-rate fixes BOTH failures: it stops the noisy per-minute pages
    (needs a significant budget burn to fire) AND catches slow burns via the 3-day/1x ticket
    window. Lowering the SLO (1) hurts users; CPU/memory (2) are cause metrics that miss the
    user symptom; removing alerting (3) is negligent.
  ref: concepts.md#alerting-symptom-versus-cause-and-burn-rate-alerts
- id: observability-monitoring-reliability-062
  difficulty: expert
  tags:
  - scenario
  - health-checks
  - cascading
  - judgment
  question: |
    A regional cache cluster hiccups for 8 seconds. Every API instance runs a deep readiness
    check that pings the cache, so all instances are pulled from the LB at once; the region
    goes hard-down and does not recover on its own. Which combination of fixes is best?
  options:
  - Add the cache ping to the liveness probe so bad instances restart faster
  - Make readiness reflect only this instance's local health (not the shared cache), have the app fail-open
    / degrade gracefully when the cache is down, and use load-shedding for overload rather than deep dependency
    checks - so a shared-dependency blip cannot remove the whole fleet
  - Increase the readiness timeout to 60 seconds and keep the deep check
  - Disable readiness probes entirely so instances never leave rotation
  answer: 1
  explanation: |
    The outage is a correlated-failure trap from deep readiness checks on a shared
    dependency. The fix is local readiness + graceful degradation + load-shedding so one
    cache blip cannot pull the entire fleet. Cache-in-liveness (0) causes restart storms; a
    60s timeout (2) just delays the same failure and slows real detection; disabling
    readiness (3) loses all routing safety, including for genuinely broken instances.
  ref: concepts.md#health-checks-and-probes
- id: observability-monitoring-reliability-063
  difficulty: expert
  tags:
  - scenario
  - cardinality
  - metrics
  - judgment
  question: |
    A new release adds labels `customer_id` (2M values), `session_id` (unbounded), and
    `region` (4 values) to a request-latency histogram with 12 buckets. Prometheus memory
    spikes and queries time out. What is the correct remediation while preserving debugging
    power?
  options:
  - Keep all labels but buy a bigger Prometheus instance
  - Delete the histogram and use a single average-latency gauge
  - Keep only bounded labels (region, endpoint template, status) on the histogram; move customer_id and
    session_id into traces/logs (indexed differently and joined by trace_id) where high-cardinality identifiers
    belong
  - Convert customer_id to a summary metric per customer
  answer: 2
  explanation: |
    Series count = product of label cardinalities x buckets; customer_id and session_id are
    unbounded and must not be metric labels - put them in traces/logs. Bigger hardware (0)
    only delays the explosion; a single average gauge (1) loses the distribution and all
    slicing; per-customer summaries (3) reintroduce the same cardinality blow-up.
  ref: concepts.md#metrics-counters-gauges-histograms-and-cardinality
- id: observability-monitoring-reliability-064
  difficulty: expert
  tags:
  - scenario
  - three-pillars
  - mttr
  - judgment
  question: |
    p99 checkout latency jumps from 200ms to 1.2s. You have metrics, traces (tail-sampled to
    keep slow traces), and structured logs with trace_ids. What is the most efficient
    investigation order?
  options:
  - Grep all service logs for 'slow' first, then look at metrics
  - Immediately roll back the last deploy across all services without diagnosis
  - Restart every service and see if it helps, then check dashboards
  - Read the metric alert to confirm the symptom and scope, use an exemplar/tail-sampled slow trace to
    localize the slow span/service, then pivot to that span's logs (via trace_id) to find the root cause
  answer: 3
  explanation: |
    The efficient path uses each pillar for its strength: metric confirms/scopes, trace
    localizes the slow hop, logs (joined by trace_id) give the root cause - minimizing MTTR.
    Grepping first (0) is a needle-in-haystack with no localization; blind restarts (2) and
    blanket rollback (1) act without diagnosis and can worsen or mask the issue.
  ref: concepts.md#the-three-pillars-metrics-logs-and-traces
- id: observability-monitoring-reliability-065
  difficulty: expert
  tags:
  - scenario
  - capacity
  - estimation
  - judgment
  question: |
    A service must serve a peak of 60,000 req/s at p99 < 100ms across 3 AZs, surviving the
    loss of one AZ. Each instance safely handles ~2,000 req/s at target latency. Roughly how
    many instances should you provision, and why?
  options:
  - 'About 45 instances: you need ~30 for peak, but to survive losing one of three AZs the two survivors
    must carry peak, so run ~15 per AZ (45 total) so any two AZs (~30 instances) cover 60,000 req/s'
  - 30 instances (60,000 / 2,000), sized exactly to peak with no failover headroom
  - 10 instances, relying on autoscaling to cover the rest instantly
  - 90 instances, one per 666 req/s, to be safe
  answer: 0
  explanation: |
    Peak needs 30 instances, but surviving an AZ loss means the 2 remaining AZs must handle
    peak: 30 instances / 2 AZs = 15 per AZ x 3 AZs = 45 total. (1) has zero failover
    headroom; (2) is under-provisioned and autoscaling has warm-up lag; (3) doubles cost
    beyond the N+1-AZ requirement.
  ref: concepts.md#capacity-planning-and-back-of-envelope-estimation
- id: observability-monitoring-reliability-066
  difficulty: expert
  tags:
  - scenario
  - build-vs-buy
  - cost
  - judgment
  question: |
    A hyperscale product ingests 50 TB/day of logs and 40M active metric series; the managed
    vendor bill now exceeds the compute bill and grows with cardinality. Leadership wants to
    cut cost without going blind. Which strategy is most defensible?
  options:
  - Stay fully on the managed vendor; observability cost is unavoidable
  - Instrument with OpenTelemetry, run a Collector to drop unused metrics, enforce label cardinality budgets,
    dynamically sample logs (keep all errors, sample successes), tail-sample traces, and self-host a ClickHouse-backed
    store with tiered retention - trading higher ops effort for far lower per-GB cost at this scale
  - Delete all logs and keep only metrics to save money
  - Cut retention to 24 hours for everything and keep the vendor
  answer: 1
  explanation: |
    At hyperscale where the bill dominates, OTel + Collector-side dropping/sampling +
    cardinality budgets + self-hosted columnar storage with tiered retention flips the cost
    curve while keeping errors and key signals. Staying fully managed (0) ignores the
    dominating bill; deleting logs (2) blinds forensics; a blanket 24h retention (3) loses
    trend/history and does not fix the cardinality cost driver.
  ref: concepts.md#cardinality-and-the-cost-of-observability
- id: observability-monitoring-reliability-067
  difficulty: expert
  tags:
  - scenario
  - error-budget
  - policy
  - judgment
  question: |
    Two weeks into a 28-day window, a service has already consumed 95% of its error budget
    due to a rough launch. Product wants to ship three more risky features this week. What is
    the best error-budget-policy-driven decision?
  options:
  - Ship all three features; SLOs are just suggestions
  - Immediately raise the SLO to 99.99% so there is more budget
  - 'Invoke the error-budget policy: freeze risky launches, shift engineering to reliability/hardening
    until the budget recovers, and allow only low-risk changes - because continuing to burn a nearly-exhausted
    budget risks breaching the SLO/SLA'
  - Ignore the budget but add more dashboards
  answer: 2
  explanation: |
    The error budget is a policy tool: near-exhaustion triggers a freeze on risky changes and
    a pivot to reliability - the data-driven mechanism balancing velocity and reliability.
    Shipping anyway (0) likely breaches the SLO; raising the SLO (1) is gaming the metric and
    makes reliability worse; dashboards (3) do not stop the burn.
  ref: concepts.md#sli-slo-sla-and-error-budgets
- id: observability-monitoring-reliability-068
  difficulty: expert
  tags:
  - scenario
  - tail-sampling
  - distributed
  - correctness
  question: |
    You deploy tail sampling across a horizontally scaled Collector fleet and start seeing
    incomplete traces (some spans missing) for the SAME trace. What is the most likely cause
    and fix?
  options:
  - The SDKs are broken; reinstall them
  - The traces are too short; increase span duration
  - Head sampling is enabled; disable all sampling
  - Spans of one trace are being routed to different Collector instances, so no single instance sees the
    whole trace to make the tail decision; fix by consistently routing all spans of a trace id to the
    same Collector (e.g., a load-balancing exporter that hashes on trace id)
  answer: 3
  explanation: |
    Tail sampling is stateful and needs all spans of a trace on one instance; without
    trace-id-consistent routing, spans scatter and traces come out partial. The fix is a
    load-balancing exporter/gateway that hashes on trace id. It is not an SDK bug (0), not
    caused by head sampling (2), and unrelated to span duration (1).
  ref: concepts.md#sampling-head-based-versus-tail-based
- id: observability-monitoring-reliability-069
  difficulty: expert
  tags:
  - scenario
  - chaos
  - dependency
  - judgment
  question: |
    You want to verify that your service degrades gracefully when a non-critical
    recommendations dependency fails. Which chaos experiment design is safest and most
    informative?
  options:
  - Define steady state (checkout success rate within normal band), hypothesize it holds if recommendations
    fail, inject latency/failure to that dependency for a small percentage of traffic off-peak with an
    automatic abort if checkout success drops, and observe whether fallbacks/timeouts engage
  - Kill the recommendations service in production at peak with no abort condition to get realistic load
  - Delete the recommendations database to simulate failure
  - Disable monitoring during the test so results are unbiased
  answer: 0
  explanation: |
    A sound experiment has a steady-state hypothesis, small blast radius, off-peak timing,
    and an automatic abort, validating that timeouts/fallbacks engage. No-abort at peak (1)
    risks a real outage; deleting the DB (2) is destructive and untargeted; disabling
    monitoring (3) removes the ability to detect harm and abort.
  ref: concepts.md#chaos-engineering
- id: observability-monitoring-reliability-070
  difficulty: expert
  tags:
  - scenario
  - sli-definition
  - judgment
  question: |
    You are defining the availability SLI for a user-facing API. Which definition is the
    most robust and best practice?
  options:
  - Average server CPU utilization staying below 80%
  - The ratio of good events to valid events - e.g., fraction of well-formed requests that return non-5xx
    within the latency threshold - measured as close to the user as feasible, expressed as good/total
  - The number of servers that are powered on
  - Whether the on-call engineer reports the service felt healthy
  answer: 1
  explanation: |
    A good SLI is a good/valid-events ratio reflecting user experience (success + within
    latency), measured near the user. CPU (0) is a cause metric, not user experience;
    counting powered-on servers (2) and subjective on-call feeling (3) do not measure what
    users actually receive.
  ref: concepts.md#sli-slo-sla-and-error-budgets
- id: observability-monitoring-reliability-071
  difficulty: beginner
  tags:
  - tracing
  - jaeger
  - zipkin
  - tempo
  question: |
    Which statement about trace backends is correct?
  options:
  - Zipkin is the newest CNCF-standard backend with adaptive sampling
  - Jaeger cannot display span trees
  - Grafana Tempo stores traces cheaply in object storage and relies on trace-id lookup (from logs/metrics/exemplars)
    rather than heavy indexing
  - All trace backends require you to store 100% of traces
  answer: 2
  explanation: |
    Tempo is cost-optimized: object-storage backing with trace-id lookup instead of heavy
    indexing, so you find traces via exemplars/logs. Zipkin is the oldest/simplest, not the
    newest CNCF standard (0); Jaeger does show span trees (1); sampling means backends do not
    require 100% storage (3).
  ref: concepts.md#distributed-tracing-and-opentelemetry
- id: observability-monitoring-reliability-072
  difficulty: intermediate
  tags:
  - mttr
  - mttd
  - metrics
  question: |
    Observability investments primarily improve which incident metrics?
  options:
  - Only MTBF (mean time between failures)
  - The service's list price
  - Only the number of alerts fired
  - MTTD (detection) and MTTR (resolution/recovery) - you detect faster and diagnose/fix faster
  answer: 3
  explanation: |
    Good telemetry shortens time to detect (alerts fire on symptoms) and time to resolve
    (traces/logs speed diagnosis). MTBF (0) is more about design/redundancy; alert count (2)
    and pricing (1) are not the point of observability.
  ref: concepts.md#on-call-and-incident-management
- id: observability-monitoring-reliability-073
  difficulty: intermediate
  tags:
  - logs
  - sampling
  - dynamic
  question: |
    A common dynamic log-sampling policy at high volume is:
  options:
  - Keep 100% of errors/exceptions but sample only a small percentage (e.g., 1%) of successful requests
  - Keep 100% of successes and drop all errors to save space
  - Randomly drop 50% of everything including errors
  - Keep only DEBUG logs and discard ERROR logs
  answer: 0
  explanation: |
    Errors are rare and diagnostically valuable, so keep them all; successes are voluminous
    and redundant, so sample them. Dropping errors (1), dropping errors randomly (2), or
    keeping DEBUG over ERROR (3) all discard the most useful signal.
  ref: concepts.md#structured-logging-and-correlation-ids
- id: observability-monitoring-reliability-074
  difficulty: advanced
  tags:
  - baggage
  - propagation
  - opentelemetry
  question: |
    What is OpenTelemetry 'baggage' and a caution when using it?
  options:
  - 'It is the trace storage backend; caution: it is expensive'
  - 'It is arbitrary key-value context propagated alongside the trace (e.g., tenant_id) so downstream
    services can tag their telemetry; caution: it travels in headers to every hop, so avoid large or sensitive
    values'
  - It is the metric histogram bucket configuration
  - It is the log retention policy
  answer: 1
  explanation: |
    Baggage carries contextual key-values across service boundaries with the trace, useful
    for tagging (tenant, experiment). Because it propagates in headers everywhere, keep it
    small and free of sensitive data. It is not a backend (0), bucket config (2), or
    retention policy (3).
  ref: concepts.md#distributed-tracing-and-opentelemetry
- id: observability-monitoring-reliability-075
  difficulty: advanced
  tags:
  - readiness
  - startup-probe
  - kubernetes
  question: |
    A slow-booting JVM service is being killed by Kubernetes before it finishes starting.
    Which probe fixes this without weakening liveness for normal operation?
  options:
  - Remove the liveness probe permanently
  - Set the liveness timeout to several hours
  - Add a startup probe that gates liveness/readiness until the app has finished booting, so slow starts
    are not misread as a wedged process
  - Make the readiness probe always return healthy
  answer: 2
  explanation: |
    The startup probe exists exactly for slow starters: it holds off liveness/readiness until
    boot completes, then normal (tight) liveness resumes. Removing liveness (0) loses wedge
    detection; a multi-hour liveness timeout (1) makes real hangs invisible; always-healthy
    readiness (3) routes traffic to a not-ready instance.
  ref: concepts.md#health-checks-and-probes
