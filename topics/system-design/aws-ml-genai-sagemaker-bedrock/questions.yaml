topic: "ML and GenAI System Design on AWS: SageMaker, Bedrock and RAG"
domain: system-design
topic_slug: aws-ml-genai-sagemaker-bedrock
version: 1

questions:
  # ---------------- ML lifecycle ----------------
  - id: aws-ml-genai-sagemaker-bedrock-001
    difficulty: beginner
    tags: [ml-lifecycle, s3, data]
    question: |
      In a typical SageMaker ML pipeline, what is the durable source of truth for
      raw training data and where trained model artifacts are stored?
    options:
      - "Amazon S3"
      - "Amazon EFS mounted on the training instance"
      - "The instance store of the training instance"
      - "Amazon DynamoDB"
    answer: 0
    explanation: |
      S3 is the durable (11 nines) backing store for datasets and model artifacts, with
      strong read-after-write consistency. EFS/instance store are ephemeral working
      volumes; DynamoDB is a KV store, not a data lake for large ML datasets.
    ref: "concepts.md#ml-lifecycle-on-aws"

  - id: aws-ml-genai-sagemaker-bedrock-002
    difficulty: intermediate
    tags: [ml-lifecycle, spot, cost]
    question: |
      A team runs long, interruption-tolerant training jobs and wants to cut cost.
      What is the correct way to use SageMaker Managed Spot Training?
    options:
      - "Use Spot only for real-time inference endpoints to save on serving cost"
      - "Disable checkpointing so the job restarts faster after interruption"
      - "Enable Managed Spot Training with periodic checkpointing to S3 so interrupted jobs resume"
      - "Use Spot capacity to back the online Feature Store so its low-latency reads cost less"
    answer: 2
    explanation: |
      Managed Spot can save up to ~90% but instances can be reclaimed; checkpointing to S3
      lets the job resume rather than restart from scratch. Spot is a training-capacity
      option, not for endpoints or Feature Store; disabling checkpoints loses progress.
    ref: "concepts.md#ml-lifecycle-on-aws"

  - id: aws-ml-genai-sagemaker-bedrock-003
    difficulty: advanced
    tags: [ml-lifecycle, self-managed, trade-offs]
    question: |
      An organization already runs a mature Kubernetes platform team and needs custom
      schedulers and non-standard GPU topologies for training. What is the strongest
      argument for self-managing training on EKS instead of SageMaker Training?
    options:
      - "SageMaker can only run inference and cannot execute distributed deep-learning training jobs at all"
      - "EKS always costs strictly less than SageMaker Training for every conceivable workload and scale"
      - "SageMaker training instances are CPU-only and provide no GPU acceleration for model training"
      - "Maximum control over cluster, scheduler, and hardware topology, reusing existing platform tooling"
    answer: 3
    explanation: |
      Self-managing wins when you have platform expertise and specialized needs that
      SageMaker's managed abstractions constrain. SageMaker fully supports GPU/distributed
      training; EKS is not universally cheaper (you pay in ops burden); the real trade-off
      is control vs undifferentiated heavy lifting.
    ref: "concepts.md#ml-lifecycle-on-aws"

  # ---------------- Inference modes ----------------
  - id: aws-ml-genai-sagemaker-bedrock-004
    difficulty: beginner
    tags: [inference-modes, real-time, limits]
    question: |
      What is the maximum request payload size and invocation timeout for a SageMaker
      real-time endpoint?
    options:
      - "6 MB payload, 60 second timeout"
      - "1 GB payload, 1 hour timeout"
      - "400 KB payload, 29 second timeout"
      - "100 MB payload, 15 minute timeout"
    answer: 0
    explanation: |
      Real-time endpoints cap payloads at 6 MB with a 60 s invocation timeout — synchronous
      and latency-oriented. 1 GB / 1 hour are the Asynchronous Inference limits; 400 KB is a
      DynamoDB item; 29 s is API Gateway's integration timeout.
    ref: "concepts.md#sagemaker-inference-modes"

  - id: aws-ml-genai-sagemaker-bedrock-005
    difficulty: intermediate
    tags: [inference-modes, async, large-payload]
    question: |
      You must run inference on documents up to 500 MB that each take ~10 minutes to
      process, with results available within an hour. Which SageMaker inference mode fits?
    options:
      - "Real-time endpoint with autoscaling"
      - "Serverless Inference with Provisioned Concurrency"
      - "Asynchronous Inference"
      - "Multi-Model Endpoint"
    answer: 2
    explanation: |
      Async Inference supports payloads up to 1 GB and processing up to 1 hour, queues
      requests, writes results to S3, and scales to zero. Real-time (6 MB / 60 s) and
      serverless (≤ 4 MB, no GPU) would fail on size and duration; MME addresses model count,
      not payload/duration.
    ref: "concepts.md#sagemaker-inference-modes"

  - id: aws-ml-genai-sagemaker-bedrock-006
    difficulty: intermediate
    tags: [inference-modes, serverless, idle-cost]
    question: |
      A CPU-based model receives sporadic traffic with long idle gaps and can tolerate
      occasional cold starts. Which mode minimizes cost while auto-scaling to zero?
    options:
      - "Real-time endpoint with a minimum of one instance"
      - "Batch Transform on a schedule"
      - "A dedicated GPU real-time endpoint"
      - "Serverless Inference"
    answer: 3
    explanation: |
      Serverless Inference scales to zero between bursts (pay per use) and suits CPU models
      that tolerate cold starts. Real-time keeps ≥ 1 instance running (idle cost). Batch is
      offline bulk, not request/response. A GPU endpoint is both unnecessary and costly here.
    ref: "concepts.md#sagemaker-inference-modes"

  - id: aws-ml-genai-sagemaker-bedrock-007
    difficulty: advanced
    tags: [inference-modes, serverless, limits, gpu]
    question: |
      Which statement about SageMaker Serverless Inference limits is correct?
    options:
      - "It supports GPU-backed instances with up to 8 accelerators attached per serverless endpoint"
      - "Memory ranges 1024–6144 MB, no GPU, max 200 concurrency per endpoint, 5 GB ephemeral disk"
      - "It supports request payloads as large as 1 GB with processing windows extending up to 1 full hour"
      - "There is no per-endpoint concurrency cap; only account-level billing applies"
    answer: 1
    explanation: |
      Serverless memory is 1024–6144 MB (no GPU), max concurrency per endpoint is 200, with
      5 GB ephemeral disk and a 10 GB max image. GPUs and MME/VPC/data-capture are excluded.
      1 GB / 1 hour is Async. There IS a per-endpoint concurrency cap (200) plus per-region
      account concurrency (1000, or 500 in some regions).
    ref: "concepts.md#sagemaker-inference-modes"

  - id: aws-ml-genai-sagemaker-bedrock-008
    difficulty: advanced
    tags: [inference-modes, api-gateway, timeout, trade-offs]
    question: |
      A synchronous public API (API Gateway → Lambda → SageMaker) sometimes needs 40+
      seconds of model compute. Requests intermittently fail. What is the root cause and
      best fix?
    options:
      - "API Gateway's 29 s integration timeout is exceeded; move to an async pattern (Async Inference or a job + polling)"
      - "S3 eventual consistency; switch to strongly consistent reads"
      - "The real-time endpoint payload limit of 400 KB is exceeded; compress the payload"
      - "DynamoDB throttling on the session table; raise the write capacity units to clear it"
    answer: 0
    explanation: |
      API Gateway enforces a 29 s integration timeout, so 40 s synchronous calls fail. The
      fix is an asynchronous pattern (SageMaker Async Inference with S3+SNS, or submit-a-job
      then poll). S3 is strongly consistent; the real-time payload limit is 6 MB not 400 KB;
      DynamoDB is not in this path.
    ref: "concepts.md#sagemaker-inference-modes"

  - id: aws-ml-genai-sagemaker-bedrock-009
    difficulty: intermediate
    tags: [inference-modes, batch, offline]
    question: |
      You must score an entire 500 GB dataset in S3 once per night with no need for an
      always-on endpoint. Which is most cost-effective?
    options:
      - "Keep a real-time endpoint warm and loop requests through it"
      - "Serverless Inference invoked in a tight loop"
      - "SageMaker Batch Transform"
      - "A Bedrock provisioned-throughput model"
    answer: 2
    explanation: |
      Batch Transform spins up a transient fleet to score an S3 dataset and shuts down —
      cheapest for offline bulk. A standing real-time endpoint or looping serverless calls
      wastes money and hits per-request overhead; Bedrock is for foundation-model generation,
      not scoring your custom model on a dataset.
    ref: "concepts.md#sagemaker-inference-modes"

  - id: aws-ml-genai-sagemaker-bedrock-010
    difficulty: expert
    tags: [inference-modes, async, autoscaling, cold-start]
    question: |
      On which metric does SageMaker Asynchronous Inference autoscaling (including
      scale-to-zero) primarily key, and what is the main latency consequence?
    options:
      - "SageMakerVariantInvocationsPerInstance; no cold start ever occurs"
      - "CPUUtilization; scaling is instantaneous with no penalty"
      - "GPUMemoryUtilization; requests are dropped when scaled to zero"
      - "ApproximateBacklogSizePerInstance; the first request after scaling from zero pays a warm-up penalty"
    answer: 3
    explanation: |
      Async scales on backlog (ApproximateBacklogSizePerInstance) and can go to zero when the
      queue drains; the trade-off is a warm-up penalty on the first request after scale-from-
      zero. Real-time scales on InvocationsPerInstance. Requests aren't dropped at zero — they
      queue in S3 and trigger scale-up.
    ref: "concepts.md#sagemaker-inference-modes"

  # ---------------- MME / MCE ----------------
  - id: aws-ml-genai-sagemaker-bedrock-011
    difficulty: beginner
    tags: [mme, cost, many-models]
    question: |
      What problem do SageMaker Multi-Model Endpoints (MME) primarily solve?
    options:
      - "Cost-effectively hosting many models on shared infrastructure instead of one endpoint each"
      - "Serving one single very large model whose weights exceed the memory of a single GPU"
      - "Guaranteeing consistently zero cold-start latency for every hosted model on every call"
      - "Running distributed, data-parallel training jobs spread across multiple AWS regions"
    answer: 0
    explanation: |
      MME packs many models onto a shared fleet/container, dynamically loading them from S3
      on demand — far cheaper than one endpoint per rarely-used model. Very large single
      models need tensor/pipeline parallelism, not MME; MME explicitly accepts occasional
      cold starts; it's a serving, not training, feature.
    ref: "concepts.md#multi-model-and-multi-container-endpoints"

  - id: aws-ml-genai-sagemaker-bedrock-012
    difficulty: advanced
    tags: [mme, memory, cold-start, s3]
    question: |
      How does a Multi-Model Endpoint manage models under memory pressure?
    options:
      - "It rejects invocations for any model that was not explicitly preloaded into memory at endpoint creation time"
      - "It eagerly replicates a full copy of every registered model onto every instance in the fleet at all times"
      - "It dynamically loads a model on first invocation and unloads least-recently-used models, keeping them on disk for fast reload"
      - "It keeps all models resident only in GPU memory and never spills or caches any of them to instance disk"
    answer: 2
    explanation: |
      MME loads models from S3 on first invocation, caches them, and evicts LRU models under
      memory pressure — evicted models remain on the instance disk (fast reload; only re-
      downloaded from S3 if disk fills). Models aren't preloaded at creation, aren't
      replicated everywhere, and disk caching is central to reducing cold starts.
    ref: "concepts.md#multi-model-and-multi-container-endpoints"

  - id: aws-ml-genai-sagemaker-bedrock-013
    difficulty: advanced
    tags: [mme, trade-offs, dedicated-endpoint]
    question: |
      You host 800 per-tenant models on an MME. Two tenants have very high, latency-
      sensitive TPS while the rest are sparse. What is the best design?
    options:
      - "Move all 800 per-tenant models onto their own individually dedicated single-model endpoints"
      - "Switch the entire fleet, including the two hot tenants, over to CPU-based Serverless Inference"
      - "Increase the MME instance count until the two hot tenants stop experiencing any eviction cold starts"
      - "Keep sparse models on the MME, but give the two high-TPS latency-sensitive models dedicated endpoints"
    answer: 3
    explanation: |
      MME shines for many similar-sized, intermittently-used models; models with high TPS or
      strict latency deserve dedicated endpoints so they don't contend for shared memory or
      suffer eviction cold starts. 800 dedicated endpoints is wasteful; serverless has no GPU
      and its own cold starts; just scaling out MME doesn't eliminate eviction contention.
    ref: "concepts.md#multi-model-and-multi-container-endpoints"

  - id: aws-ml-genai-sagemaker-bedrock-014
    difficulty: intermediate
    tags: [mce, inference-pipeline]
    question: |
      What is a SageMaker inference pipeline (via multi-container endpoints) best used for?
    options:
      - "Running preprocessing, model, and postprocessing as chained containers in one endpoint with container-to-container hops"
      - "Serving thousands of independent, unrelated models on shared capacity with LRU memory eviction"
      - "Guaranteeing exactly-once request-processing semantics across multiple AWS regions transparently"
      - "Automatically fine-tuning and updating the deployed model's weights on every incoming request"
    answer: 0
    explanation: |
      An inference pipeline chains containers (e.g., feature transform → model → post-process)
      inside one endpoint, avoiding external network hops. MME (not MCE) is the many-models
      case; the others are unrelated to inference pipelines.
    ref: "concepts.md#multi-model-and-multi-container-endpoints"

  # ---------------- Feature Store / Pipelines ----------------
  - id: aws-ml-genai-sagemaker-bedrock-015
    difficulty: intermediate
    tags: [feature-store, skew, online-offline]
    question: |
      What core problem does SageMaker Feature Store's online + offline design address?
    options:
      - "Encrypting trained model artifacts at rest in S3 using customer-managed KMS keys"
      - "Automatically selecting the most cost-effective GPU instance type for each training job"
      - "Training/serving skew, by ensuring the same feature values are available for low-latency inference and for training"
      - "Load balancing inference traffic evenly across a fleet of real-time model endpoints"
    answer: 2
    explanation: |
      Feature Store's online store (low-latency reads for inference) and offline store (S3
      for training) keep feature computation consistent, avoiding training/serving skew and
      supporting point-in-time-correct joins. The other options are unrelated to feature
      management.
    ref: "concepts.md#sagemaker-feature-store-and-pipelines"

  - id: aws-ml-genai-sagemaker-bedrock-016
    difficulty: advanced
    tags: [feature-store, point-in-time, leakage]
    question: |
      Why does Feature Store record event time and support point-in-time joins for building
      training datasets?
    options:
      - "To reduce offline S3 storage cost by compressing older feature values into columnar Parquet"
      - "To increase the online store's read throughput and lower per-request feature lookup latency"
      - "To enable automatic cross-region replication of the offline feature store for disaster recovery"
      - "To prevent label leakage by joining only feature values that existed at or before each label's timestamp"
    answer: 3
    explanation: |
      Point-in-time-correct joins ensure a training row uses only feature values available at
      that moment, preventing leakage of future information (which inflates offline metrics
      and fails in production). It is not primarily about storage cost, throughput, or
      replication.
    ref: "concepts.md#sagemaker-feature-store-and-pipelines"

  - id: aws-ml-genai-sagemaker-bedrock-017
    difficulty: intermediate
    tags: [pipelines, model-registry, mlops]
    question: |
      In an MLOps setup on SageMaker, what role does the Model Registry play?
    options:
      - "It stores the raw, unprocessed training datasets used to build each model version"
      - "It versions trained models with approval status, gating which version gets deployed"
      - "It runs the approximate-nearest-neighbor vector search that powers semantic retrieval"
      - "It provides the low-latency online feature store queried during real-time inference"
    answer: 1
    explanation: |
      Model Registry versions model artifacts and tracks approval status so pipelines/
      EventBridge can gate deployment. Raw data lives in S3; vector search is OpenSearch/
      pgvector; the online store is Feature Store.
    ref: "concepts.md#sagemaker-feature-store-and-pipelines"

  # ---------------- Bedrock FMs ----------------
  - id: aws-ml-genai-sagemaker-bedrock-018
    difficulty: beginner
    tags: [bedrock, managed, foundation-models]
    question: |
      What is Amazon Bedrock at its core?
    options:
      - "A serverless API to access foundation models (Anthropic, Meta, Amazon, etc.) without managing infrastructure"
      - "A managed Kubernetes service for hosting and orchestrating your own self-supplied model containers"
      - "A managed vector database that stores embeddings and serves approximate-nearest-neighbor queries"
      - "A distributed training cluster manager that provisions and schedules multi-GPU training jobs"
    answer: 0
    explanation: |
      Bedrock is a fully managed, serverless API to third-party and Amazon foundation models
      — no GPUs or weights to host. It is not Kubernetes (that's EKS), not a vector DB
      (OpenSearch/pgvector), and not a training cluster.
    ref: "concepts.md#amazon-bedrock-foundation-models"

  - id: aws-ml-genai-sagemaker-bedrock-019
    difficulty: intermediate
    tags: [bedrock, converse-api, portability]
    question: |
      Why would a team standardize on Bedrock's Converse API rather than model-specific
      InvokeModel bodies?
    options:
      - "Converse is the only Bedrock API offering streaming, since InvokeModel returns one full completion"
      - "Converse switches billing to a flat per-request fee, bypassing token-based pricing entirely"
      - "Converse gives a unified multi-turn/tool-use schema across models, so swapping models needs minimal code change"
      - "Converse applies built-in fact-checking that guarantees zero hallucinations in every response"
    answer: 2
    explanation: |
      Converse provides a consistent request/response schema (messages, tool use) across
      Bedrock models, easing model portability. Both APIs support streaming variants; neither
      changes billing or eliminates hallucination.
    ref: "concepts.md#amazon-bedrock-foundation-models"

  - id: aws-ml-genai-sagemaker-bedrock-020
    difficulty: advanced
    tags: [bedrock, self-host, trade-offs, cost]
    question: |
      An interviewer asks when self-hosting an open model (e.g., Llama on SageMaker LMI/EKS)
      beats calling Bedrock. What is the most defensible answer?
    options:
      - "Always — self-hosting undercuts Bedrock on cost in every scenario regardless of utilization or scale"
      - "When traffic is spiky and unpredictable, since idle GPUs then cost less than per-token Bedrock pricing"
      - "When you want zero operational responsibility for GPUs, patching, and capacity planning at all"
      - "When you have sustained, high, predictable token volume you can keep a GPU fleet saturated, or need full model control / private weights"
    answer: 3
    explanation: |
      Self-hosting pays off at sustained high utilization (per-token markup avoided) and when
      you need model control/private weights, accepting GPU ops and scarcity. Spiky/unknown
      load and zero-ops goals favor Bedrock's elasticity and managed infra.
    ref: "concepts.md#amazon-bedrock-foundation-models"

  - id: aws-ml-genai-sagemaker-bedrock-021
    difficulty: intermediate
    tags: [bedrock, data-governance, compliance]
    question: |
      A regulated enterprise needs foundation-model access while keeping data in its AWS
      account and integrating with IAM, KMS, and CloudTrail. Which is the strongest fit?
    options:
      - "Amazon Bedrock, optionally via PrivateLink, with IAM/KMS/CloudTrail integration"
      - "Call a public third-party LLM API over the internet, relying on its vendor SOC 2 report for compliance"
      - "Host the model on a public EC2 instance with a public IP, secured only by a restrictive security group"
      - "Email batched prompts to a managed inference service and receive completions back asynchronously"
    answer: 0
    explanation: |
      Bedrock keeps data within your account, supports PrivateLink (no internet egress), and
      integrates with IAM/KMS/CloudTrail; it doesn't use your prompts to train base models.
      A public external API or public EC2 undermines the governance requirements.
    ref: "concepts.md#amazon-bedrock-foundation-models"

  # ---------------- Provisioned vs on-demand ----------------
  - id: aws-ml-genai-sagemaker-bedrock-022
    difficulty: beginner
    tags: [bedrock, provisioned-throughput, model-units]
    question: |
      What does a Bedrock Provisioned Throughput purchase measure capacity in?
    options:
      - "vCPUs, each allocating a fixed slice of CPU cores dedicated to running the model"
      - "GPU-hours, billed by the accelerator-hours the underlying model host consumes"
      - "Model Units (MUs), each guaranteeing a fixed input/output tokens-per-minute for a model"
      - "Requests per second per shard, with capacity partitioned across index shards"
    answer: 2
    explanation: |
      Provisioned Throughput is bought in Model Units, each delivering a fixed input and
      output tokens-per-minute for a specific model, billed hourly. vCPUs/GPU-hours/shards
      are the wrong abstractions for Bedrock.
    ref: "concepts.md#bedrock-provisioned-versus-on-demand-throughput"

  - id: aws-ml-genai-sagemaker-bedrock-023
    difficulty: intermediate
    tags: [bedrock, on-demand, throttling]
    question: |
      On-demand Bedrock traffic starts returning HTTP 429 errors as load grows. What is
      happening and the appropriate first response?
    options:
      - "The knowledge-base vector store has hit its index capacity; delete old embeddings to free room"
      - "The S3 bucket backing the model is throttling GET requests; enable Transfer Acceleration to fix it"
      - "The model has exhausted its parameter budget under load; fine-tune it to restore serving headroom"
      - "Per-account requests/tokens-per-minute quotas are exceeded; apply exponential backoff and consider cross-region inference or a fallback model"
    answer: 3
    explanation: |
      On-demand has per-account RPM/TPM quotas; exceeding them throttles (429). Handle with
      backoff and spread load via cross-region inference profiles or a fallback model, and/or
      buy Provisioned Throughput for guaranteed capacity. The other options misdiagnose the
      throttle.
    ref: "concepts.md#bedrock-provisioned-versus-on-demand-throughput"

  - id: aws-ml-genai-sagemaker-bedrock-024
    difficulty: advanced
    tags: [bedrock, provisioned-throughput, trade-offs, cost]
    question: |
      A workload has steady, high, predictable token volume with a strict latency SLA. Which
      Bedrock capacity choice is most appropriate and what is the key downside?
    options:
      - "Provisioned Throughput; downside is you pay hourly regardless of usage, so over-provisioning wastes money"
      - "On-demand; downside is none, because per-token pricing always matches provisioned-latency guarantees exactly"
      - "Serverless Inference on SageMaker; downside is occasional cold starts on the first request after idle scale-down"
      - "Batch Transform; downside is high latency because requests queue behind the offline scoring fleet"
    answer: 0
    explanation: |
      Predictable high volume + SLA favors Provisioned Throughput (guaranteed TPM, consistent
      latency), but it bills hourly until deleted — over-provisioning wastes money, under-
      provisioning throttles. On-demand can throttle and gives no latency guarantee; the other
      two aren't Bedrock capacity modes for this need.
    ref: "concepts.md#bedrock-provisioned-versus-on-demand-throughput"

  - id: aws-ml-genai-sagemaker-bedrock-025
    difficulty: expert
    tags: [bedrock, custom-model, provisioned-throughput]
    question: |
      You fine-tuned a model on Bedrock. How can you serve it for inference?
    options:
      - "Only via on-demand throughput, exactly like base models, with pure per-token pay-as-you-go pricing"
      - "By exporting its weights and deploying them to a SageMaker Serverless endpoint automatically"
      - "Only via Provisioned Throughput — custom models require purchased throughput to serve"
      - "It cannot be served at all; Bedrock fine-tuning produces evaluation metrics but no deployable model"
    answer: 2
    explanation: |
      Custom/fine-tuned Bedrock models can only be served through Provisioned Throughput —
      there is no on-demand option for them. This mandatory throughput cost is a major factor
      in the fine-tune-vs-RAG economics.
    ref: "concepts.md#bedrock-provisioned-versus-on-demand-throughput"

  - id: aws-ml-genai-sagemaker-bedrock-026
    difficulty: intermediate
    tags: [bedrock, provisioned-throughput, commitment]
    question: |
      Which set of commitment terms does Bedrock Provisioned Throughput offer, and how does
      commitment affect price?
    options:
      - "1 day, 1 week, or 1 year; shorter commitment terms carry a cheaper hourly rate"
      - "A single fixed 6-month term only, always billed at one flat non-negotiable price"
      - "Pay-per-token consumption only; Provisioned Throughput offers no commitment terms at all"
      - "No commitment, 1 month, or 6 months; longer commitment lowers the hourly price"
    answer: 3
    explanation: |
      Terms are no-commitment, 1 month, or 6 months; longer commitments earn a lower hourly
      rate. No-commitment can be deleted anytime; committed terms bill until the term ends.
      Pay-per-token is the separate on-demand model.
    ref: "concepts.md#bedrock-provisioned-versus-on-demand-throughput"

  # ---------------- RAG end to end ----------------
  - id: aws-ml-genai-sagemaker-bedrock-027
    difficulty: beginner
    tags: [rag, grounding, fundamentals]
    question: |
      What is the primary purpose of Retrieval-Augmented Generation (RAG)?
    options:
      - "To accelerate the model's training loop by pre-fetching batches from a retrieval index during gradient descent"
      - "To ground an LLM's answers in your (often private/fresh) data by retrieving relevant context into the prompt"
      - "To reduce the number of GPUs needed for training by offloading layers to a retrieval cache"
      - "To compress the model weights by replacing rarely-used parameters with retrieved lookup entries"
    answer: 1
    explanation: |
      RAG retrieves relevant chunks and injects them as context so the model answers from
      your data — fixing stale knowledge and reducing hallucination without retraining. It is
      not a training-speed, hardware, or compression technique.
    ref: "concepts.md#rag-on-aws-end-to-end"

  - id: aws-ml-genai-sagemaker-bedrock-028
    difficulty: intermediate
    tags: [rag, knowledge-bases, managed]
    question: |
      A team wants managed document Q&A with citations over S3 documents and minimal
      plumbing. Which AWS service fits best?
    options:
      - "Amazon Bedrock Knowledge Bases with RetrieveAndGenerate"
      - "Build a custom LangChain app on Lambda wiring embeddings and a vector DB by hand"
      - "SageMaker Batch Transform run nightly to score all documents into an answer table"
      - "Amazon DynamoDB with a GSI on document text and a contains-filter scan per query"
    answer: 0
    explanation: |
      Bedrock Knowledge Bases handles chunking, embedding, vector storage, retrieval, and
      returns grounded answers with citations — fastest managed RAG path. Custom LangChain is
      valid but more work; Batch Transform and DynamoDB GSIs are not semantic retrieval.
    ref: "concepts.md#rag-on-aws-end-to-end"

  - id: aws-ml-genai-sagemaker-bedrock-029
    difficulty: advanced
    tags: [rag, custom, knowledge-bases, trade-offs]
    question: |
      When is a custom RAG pipeline (your own chunking, retrieval, re-ranking) justified over
      Bedrock Knowledge Bases?
    options:
      - "When you want the least possible engineering effort and the fastest managed path to production"
      - "When you never need citations and the fully managed retrieval defaults already meet every requirement"
      - "When you need bespoke chunking, multi-stage retrieval, hybrid ranking, or a store/logic Knowledge Bases doesn't support"
      - "When your corpus is very small, so any managed or hand-built retrieval performs identically well"
    answer: 2
    explanation: |
      Managed KB trades control for convenience; a custom pipeline is justified when you need
      knobs KB doesn't expose (custom chunking, multi-stage/hybrid retrieval, unsupported
      stores). Minimal effort and small corpora argue FOR the managed KB.
    ref: "concepts.md#rag-on-aws-end-to-end"

  - id: aws-ml-genai-sagemaker-bedrock-030
    difficulty: intermediate
    tags: [rag, latency, tokens, cost]
    question: |
      What is a real cost/latency downside of RAG compared with a plain LLM call?
    options:
      - "It requires a short GPU training run to re-index the retriever on every single query"
      - "It permanently changes the base model weights each time a new document is retrieved"
      - "It disables token streaming because the full context must be assembled before generation"
      - "Retrieval adds latency, and injected context increases input tokens (more cost per call)"
    answer: 3
    explanation: |
      RAG adds a retrieval step (latency) and stuffs retrieved chunks into the prompt,
      increasing input tokens and thus cost. It doesn't retrain the model per query, doesn't
      modify weights, and is compatible with streaming.
    ref: "concepts.md#rag-on-aws-end-to-end"

  # ---------------- Embeddings / chunking ----------------
  - id: aws-ml-genai-sagemaker-bedrock-031
    difficulty: beginner
    tags: [embeddings, consistency]
    question: |
      In a RAG system, which rule about embeddings must hold?
    options:
      - "Queries and documents must be embedded with the same model, and dimensions must match the index"
      - "Queries and documents can use different embedding models as long as their output dimensions differ"
      - "Document embeddings must be regenerated from scratch on every incoming query for correctness"
      - "Higher embedding dimensions always improve retrieval accuracy regardless of storage or latency cost"
    answer: 0
    explanation: |
      Query and document embeddings must come from the same model and match the index's
      dimensionality — you can't mix models/dims in one index. Document embeddings are
      precomputed at ingest, not per query; higher dims cost more storage/latency and aren't
      unconditionally better.
    ref: "concepts.md#embeddings-and-chunking"

  - id: aws-ml-genai-sagemaker-bedrock-032
    difficulty: advanced
    tags: [embeddings, dimensions, trade-offs, cost]
    question: |
      Some embedding models (e.g., Titan Text Embeddings v2) support choosing a smaller output
      dimension. What is the trade-off?
    options:
      - "Smaller dimensions always improve retrieval accuracy by discarding noisy, low-signal vector components"
      - "Smaller dimensions require re-training the base LLM to align it with the shortened embedding space"
      - "Smaller dimensions reduce storage and speed up search at a small accuracy cost"
      - "Embedding dimension has no measurable effect on either vector storage size or ANN search latency"
    answer: 2
    explanation: |
      Reducing embedding dimensions (e.g., 1024→512/256) cuts vector storage and speeds ANN
      search, trading a little retrieval accuracy — a valid cost lever at scale. It doesn't
      improve accuracy, and dimension clearly affects storage/latency.
    ref: "concepts.md#embeddings-and-chunking"

  - id: aws-ml-genai-sagemaker-bedrock-033
    difficulty: intermediate
    tags: [chunking, trade-offs, retrieval]
    question: |
      What is the core trade-off in choosing chunk size for RAG?
    options:
      - "Larger chunks always retrieve faster because fewer vectors need to be scanned per query"
      - "Chunk size only affects vector storage footprint and never influences retrieval or answer quality"
      - "Chunk size must exactly equal the generation model's context window for retrieval to work"
      - "Small chunks improve retrieval precision but fragment context; large chunks preserve context but dilute relevance and waste context-window tokens"
    answer: 3
    explanation: |
      Small chunks are precise but can fragment meaning and require retrieving many; large
      chunks preserve context but dilute relevance and consume more context tokens. It's a
      precision-vs-completeness trade-off — not just storage, and not tied to the context
      window size.
    ref: "concepts.md#embeddings-and-chunking"

  - id: aws-ml-genai-sagemaker-bedrock-034
    difficulty: advanced
    tags: [chunking, overlap, semantic]
    question: |
      Why use overlapping windows or semantic/recursive chunking instead of naive fixed-size
      splitting?
    options:
      - "To avoid cutting related content across boundaries so a relevant answer isn't split between two chunks"
      - "To reduce the embedding model's per-token invocation cost all the way down to zero"
      - "To guarantee exactly one chunk per document regardless of how long that document is"
      - "To eliminate the need for a vector store by embedding structure directly into the raw text"
    answer: 0
    explanation: |
      Overlap and structure-aware splitting keep related text together so retrieval doesn't
      miss context split across a hard boundary — at the cost of some storage duplication.
      They don't zero-out embedding cost, force one chunk per doc, or remove the vector store.
    ref: "concepts.md#embeddings-and-chunking"

  # ---------------- Vector stores ----------------
  - id: aws-ml-genai-sagemaker-bedrock-035
    difficulty: intermediate
    tags: [vector-store, opensearch, pgvector, trade-offs]
    question: |
      You need large-scale vector search AND hybrid keyword+semantic ranking with rich
      metadata filters. Which AWS option is the strongest fit?
    options:
      - "Aurora PostgreSQL with the pgvector extension for similarity queries"
      - "Amazon DynamoDB with a global secondary index over a metadata attribute"
      - "Amazon OpenSearch Service with k-NN (HNSW) plus BM25 hybrid search"
      - "Amazon S3 Select running SQL predicates over stored embedding files"
    answer: 2
    explanation: |
      OpenSearch combines vector k-NN with BM25 keyword scoring (hybrid) and rich filtering at
      scale — the classic large-scale RAG store. pgvector fits when vectors co-locate with
      relational data at moderate scale; DynamoDB/S3 Select aren't ANN engines.
    ref: "concepts.md#vector-store-options-on-aws"

  - id: aws-ml-genai-sagemaker-bedrock-036
    difficulty: advanced
    tags: [vector-store, pgvector, trade-offs]
    question: |
      When is Aurora PostgreSQL with pgvector the better vector-store choice over a dedicated
      search engine?
    options:
      - "When you have billions of vectors and need the absolute lowest possible ANN query latency"
      - "When you need no transactional consistency guarantees at all and tolerate arbitrary read staleness"
      - "When you want to avoid running any database and query embeddings straight from object storage"
      - "When vectors must be joined with existing relational data transactionally at moderate scale, avoiding a new system"
    answer: 3
    explanation: |
      pgvector wins when embeddings live alongside relational data you already query — one
      transactional database, no new system — at moderate scale. At billions of vectors with
      strict latency, dedicated engines pull ahead. The other options misstate its strengths.
    ref: "concepts.md#vector-store-options-on-aws"

  - id: aws-ml-genai-sagemaker-bedrock-037
    difficulty: advanced
    tags: [vector-store, kendra, acl, trade-offs]
    question: |
      An enterprise needs turnkey document search with prebuilt connectors and document-level
      access control (users only see permitted results). Which service is the natural fit,
      and what's the trade-off?
    options:
      - "OpenSearch; trade-off is it offers no metadata filtering or hybrid keyword ranking"
      - "Amazon Kendra; trade-off is higher cost and less control over ANN internals"
      - "DynamoDB; trade-off is it lacks durability and silently loses data on node failure"
      - "S3 Select; trade-off is it lacks semantic search and only runs SQL over raw files"
    answer: 1
    explanation: |
      Kendra provides managed intelligent search with connectors and document-level ACLs —
      ideal for permissions-aware enterprise retrieval — but costs more and hides the ANN
      internals. OpenSearch does support filtering; DynamoDB is durable; S3 Select is the
      wrong tool entirely.
    ref: "concepts.md#vector-store-options-on-aws"

  - id: aws-ml-genai-sagemaker-bedrock-038
    difficulty: expert
    tags: [vector-store, opensearch-serverless, cost, trade-offs]
    question: |
      A RAG workload has steady, high query volume 24/7. When comparing OpenSearch Serverless
      to a provisioned OpenSearch cluster, which statement is most accurate?
    options:
      - "Serverless removes cluster sizing and suits spiky load, but OCU-hour billing can exceed a right-sized provisioned cluster at steady high load"
      - "Serverless is always strictly cheaper than provisioned regardless of query volume or load pattern"
      - "Provisioned clusters cannot run k-NN vector search and are limited to BM25 keyword queries"
      - "Serverless offers strong read consistency while provisioned clusters only support eventual reads"
    answer: 0
    explanation: |
      Serverless (OCU-billed) is great for spiky ingest/query and removes sizing, but at
      steady high load a right-sized provisioned cluster can be cheaper. Provisioned clusters
      absolutely support k-NN; the consistency claim is fabricated.
    ref: "concepts.md#vector-store-options-on-aws"

  # ---------------- ANN indexes ----------------
  - id: aws-ml-genai-sagemaker-bedrock-039
    difficulty: intermediate
    tags: [ann, hnsw, ivf, memory]
    question: |
      What is the primary trade-off between HNSW and IVF (IVFFlat/IVFPQ) ANN indexes?
    options:
      - "IVF is always both more accurate and lower-latency than HNSW at every corpus size"
      - "HNSW needs no tuning parameters at all, while IVF can only be built on GPU hardware"
      - "HNSW gives high recall/low latency but uses more memory; IVF/PQ uses less memory/builds faster but recall depends on nprobe"
      - "They are functionally identical indexes and the two names are fully interchangeable"
    answer: 2
    explanation: |
      HNSW (graph) offers excellent recall/latency but is memory-hungry (graph in RAM); IVF
      partitions into clusters, using less memory and building faster, with recall governed by
      nprobe (and PQ compressing vectors at an accuracy cost). They are not interchangeable.
    ref: "concepts.md#ann-indexes-and-retrieval"

  - id: aws-ml-genai-sagemaker-bedrock-040
    difficulty: advanced
    tags: [ann, recall, latency, tuning]
    question: |
      Raising ef_search (HNSW) or nprobe (IVF) and increasing k has what effect?
    options:
      - "Improves recall for free, with zero added latency and no impact on generation cost"
      - "Reduces recall while simultaneously lowering query latency and per-request token cost"
      - "Has no measurable effect on either retrieval recall or query latency whatsoever"
      - "Improves recall but increases latency and, via more retrieved tokens, generation cost"
    answer: 3
    explanation: |
      Higher ef_search/nprobe/k search more of the index (better recall) but cost more latency,
      and larger k feeds more chunks into the prompt (more tokens/cost). Recall improvements
      are never free — tune against an eval set.
    ref: "concepts.md#ann-indexes-and-retrieval"

  - id: aws-ml-genai-sagemaker-bedrock-041
    difficulty: expert
    tags: [ann, hnsw, ivf, corpus-scale, trade-offs]
    question: |
      A corpus of 2 billion vectors must run on RAM-constrained, cost-sensitive infrastructure.
      Which ANN approach is most appropriate and why?
    options:
      - "IVF with product quantization (IVFPQ), because it compresses vectors and lowers memory at some recall cost"
      - "HNSW, because its graph structure minimizes RAM usage even for billions of vectors"
      - "Exact brute-force cosine search, because it is the fastest option at billion-vector scale"
      - "No index at all; scan the raw embedding objects in S3 sequentially on every query"
    answer: 0
    explanation: |
      At billions of vectors under RAM/cost pressure, IVFPQ compresses vectors to fit memory,
      trading some recall — the right lever. HNSW is memory-hungry (opposite of the need);
      brute-force is infeasible at 2B; scanning S3 per query is absurd.
    ref: "concepts.md#ann-indexes-and-retrieval"

  - id: aws-ml-genai-sagemaker-bedrock-042
    difficulty: intermediate
    tags: [ann, hybrid-search, retrieval]
    question: |
      Why add hybrid search (BM25 keyword + vector) rather than pure semantic vector search?
    options:
      - "To eliminate the need for embeddings and run purely on keyword matching"
      - "To automatically reduce the stored vector dimension and shrink the index size"
      - "To catch exact terms, IDs, and rare tokens that embeddings alone often miss"
      - "To disable metadata filtering so every query scans the full corpus"
    answer: 2
    explanation: |
      Hybrid search fuses keyword matching (great for exact terms, codes, IDs, rare words)
      with semantic similarity, improving recall for queries embeddings handle poorly. It
      doesn't remove embeddings, change dimensions, or disable filtering.
    ref: "concepts.md#ann-indexes-and-retrieval"

  # ---------------- Re-ranking / grounding ----------------
  - id: aws-ml-genai-sagemaker-bedrock-043
    difficulty: advanced
    tags: [re-ranking, precision, cost, trade-offs]
    question: |
      What is the benefit of re-ranking retrieved candidates with a cross-encoder (e.g., Cohere
      Rerank on Bedrock) versus simply passing more chunks (larger k) to the LLM?
    options:
      - "Re-ranking removes the need for a vector store by scoring the full corpus per query"
      - "Re-ranking is always free and adds no extra latency or model calls to the request path"
      - "Larger k always beats re-ranking on answer quality because more context is strictly better"
      - "Re-ranking yields higher precision with fewer, better chunks — reducing input tokens (cost/latency) and distraction"
    answer: 3
    explanation: |
      Re-ranking re-scores top-N with a query-aware cross-encoder and selects the best few,
      raising precision while cutting the token count sent to the LLM. It still needs the
      vector store, and it adds an extra model call (latency/cost), so skip it when ANN
      precision is already high.
    ref: "concepts.md#re-ranking-and-grounding"

  - id: aws-ml-genai-sagemaker-bedrock-044
    difficulty: intermediate
    tags: [grounding, citations, hallucination]
    question: |
      What does "grounding" mean in a RAG answer, and how is it commonly enforced on AWS?
    options:
      - "Answers must be traceable to retrieved text; enforced via citations and Bedrock Guardrails contextual grounding checks"
      - "Running the model on-premises in your own datacenter; enforced by strict VPC network isolation"
      - "Lowering the sampling temperature to zero for every call; enforced automatically by the tokenizer"
      - "Storing every generated answer in an S3 bucket; enforced by a restrictive bucket access policy"
    answer: 0
    explanation: |
      Grounding means the answer is supported by retrieved context, enforced via citation of
      source chunks and, on AWS, Guardrails contextual grounding/relevance checks that flag
      unsupported answers. The other options confuse grounding with unrelated mechanisms.
    ref: "concepts.md#re-ranking-and-grounding"

  - id: aws-ml-genai-sagemaker-bedrock-045
    difficulty: expert
    tags: [grounding, retrieval, trade-offs]
    question: |
      After enabling strict grounding checks, your assistant now frequently replies "I don't
      know" for questions the docs actually cover. What is the best first fix?
    options:
      - "Loosen the grounding threshold immediately and accept the resulting increase in hallucination"
      - "Increase the model sampling temperature so it answers more freely from parametric memory"
      - "Improve retrieval (chunking, hybrid search, re-ranking) so the correct context is actually retrieved before relaxing grounding"
      - "Switch to a larger, more capable base model with no other change to the retrieval stage"
    answer: 2
    explanation: |
      Strict grounding surfaces retrieval failures: if the right chunk isn't retrieved, the
      model correctly refuses. Fix retrieval first (chunking/hybrid/re-rank) rather than
      loosening grounding (which invites hallucination) or blindly raising temperature/model
      size.
    ref: "concepts.md#re-ranking-and-grounding"

  # ---------------- Serving at scale / GPUs / batching ----------------
  - id: aws-ml-genai-sagemaker-bedrock-046
    difficulty: intermediate
    tags: [serving, inferentia, trainium, cost]
    question: |
      For cost-optimized LLM inference on AWS custom silicon, which accelerator is designed
      for inference?
    options:
      - "AWS Trainium (Trn1)"
      - "Amazon Glacier"
      - "AWS Graviton for GPUs"
      - "AWS Inferentia2 (Inf2)"
    answer: 3
    explanation: |
      Inferentia2 (Inf2) targets cost-effective inference; Trainium (Trn1) targets training.
      "Inferentia for inference, Trainium for training." Glacier is cold storage; Graviton is
      an Arm CPU, not a GPU.
    ref: "concepts.md#inference-serving-at-scale-gpus-and-batching"

  - id: aws-ml-genai-sagemaker-bedrock-047
    difficulty: advanced
    tags: [serving, continuous-batching, throughput, latency]
    question: |
      Why does continuous (in-flight) batching in servers like vLLM/TGI/SageMaker LMI improve
      LLM serving over static batching?
    options:
      - "It disables the KV cache entirely to free up GPU memory for a few more requests"
      - "It merges many requests into GPU forward passes and adds/evicts sequences as they finish, greatly raising GPU utilization/throughput"
      - "It guarantees that each incoming request runs on its own separate dedicated GPU device"
      - "It eliminates the added latency cost of larger batch sizes entirely, at every batch depth"
    answer: 1
    explanation: |
      Continuous batching dynamically packs in-flight sequences into forward passes, keeping
      the GPU busy for far higher throughput than static batching. It relies on (not disables)
      the KV cache, shares GPUs across requests, and still incurs some latency at large batch.
    ref: "concepts.md#inference-serving-at-scale-gpus-and-batching"

  - id: aws-ml-genai-sagemaker-bedrock-048
    difficulty: advanced
    tags: [serving, batch-size, latency, throughput, trade-offs]
    question: |
      What is the fundamental trade-off of increasing inference batch size on a GPU?
    options:
      - "Higher throughput (lower cost per token) but higher per-request latency"
      - "It lowers throughput and per-request latency at the same time, giving up on both fronts"
      - "It only affects training-time batching and has no bearing on inference-time serving"
      - "It reduces both per-token cost and per-request latency together with no downside at all"
    answer: 0
    explanation: |
      Bigger batches amortize GPU work across more requests (higher throughput, cheaper per
      token) but individual requests wait longer (higher latency). Latency-critical paths use
      small batches; offline/batch jobs maximize batch size.
    ref: "concepts.md#inference-serving-at-scale-gpus-and-batching"

  - id: aws-ml-genai-sagemaker-bedrock-049
    difficulty: expert
    tags: [serving, gpu-selection, quantization, sizing]
    question: |
      A 70B-parameter model must be served but only smaller/fewer GPUs are affordable. Which
      technique most directly lets it fit and run faster with a small accuracy cost?
    options:
      - "Increase the embedding dimension so each token carries more information per pass"
      - "Switch the 70B model to CPU-only serverless inference to sidestep GPU memory limits"
      - "Quantization (e.g., INT8/FP8/AWQ/GPTQ) to shrink the model, optionally with tensor parallelism"
      - "Raise the API Gateway integration timeout so the oversized model has longer to respond"
    answer: 2
    explanation: |
      Quantization shrinks weights to fit smaller/fewer GPUs and speeds inference at a small
      accuracy cost, combined with tensor parallelism to shard across GPUs. Embedding dimension
      is unrelated to LLM serving; CPU serverless can't host a 70B model; timeouts don't affect
      fit.
    ref: "concepts.md#inference-serving-at-scale-gpus-and-batching"

  - id: aws-ml-genai-sagemaker-bedrock-050
    difficulty: intermediate
    tags: [serving, gpu-selection, cost]
    question: |
      Which is a sound GPU-selection principle for inference cost efficiency?
    options:
      - "Always provision the largest available GPU (an H100) for every model regardless of its size"
      - "GPU choice never affects serving cost and influences only the request latency profile"
      - "CPU instances are always cheaper than GPUs for large LLM inference at any traffic level"
      - "Match model size to instance — don't waste an H100 on a 7B model, and don't force a 70B model onto a single small GPU"
    answer: 3
    explanation: |
      Right-sizing the accelerator to the model avoids both waste (huge GPU, tiny model) and
      failure (giant model on an undersized GPU). GPU choice affects both cost and feasibility;
      CPUs are usually too slow for large LLMs.
    ref: "concepts.md#inference-serving-at-scale-gpus-and-batching"

  # ---------------- KV cache / streaming / latency ----------------
  - id: aws-ml-genai-sagemaker-bedrock-051
    difficulty: advanced
    tags: [latency, ttft, output-tokens]
    question: |
      For an LLM, total latency ≈ TTFT + (output_tokens × inter-token latency). Which lever
      most reduces total generation latency?
    options:
      - "Reducing the number of output tokens the model must generate"
      - "Increasing the retriever's embedding dimension to sharpen the retrieved context"
      - "Adding more retrieved chunks to the prompt so the model has richer grounding"
      - "Disabling the KV cache so the GPU stores fewer intermediate attention tensors"
    answer: 0
    explanation: |
      Output tokens are generated serially, so shortening the output is the biggest latency
      lever. Larger prompts (more chunks) raise TTFT and cost; disabling the KV cache would
      slow generation drastically; embedding dimension is unrelated to generation latency.
    ref: "concepts.md#kv-cache-streaming-and-latency-metrics"

  - id: aws-ml-genai-sagemaker-bedrock-052
    difficulty: expert
    tags: [kv-cache, memory, concurrency]
    question: |
      Why is the KV cache often the binding constraint on how many concurrent LLM requests fit
      on a GPU?
    options:
      - "It stores a full duplicate copy of the model weights, which are large, for each request"
      - "It is persisted to instance disk and its throughput is capped by the volume's IOPS limit"
      - "It grows with context length × batch size, consuming GPU memory that limits concurrency"
      - "It requires a separate dedicated GPU device to be allocated per concurrent request"
    answer: 2
    explanation: |
      The KV cache holds attention keys/values for processed tokens; its footprint scales with
      context length and concurrent sequences, so it eats GPU memory and caps concurrency. It
      doesn't store weights, isn't on disk, and is shared, not per-GPU-per-request.
    ref: "concepts.md#kv-cache-streaming-and-latency-metrics"

  - id: aws-ml-genai-sagemaker-bedrock-053
    difficulty: intermediate
    tags: [streaming, ttft, ux]
    question: |
      Why use Bedrock's ConverseStream (streaming) for a chat application?
    options:
      - "It reduces the total number of tokens the model generates for a given prompt"
      - "It guarantees the answer is fully grounded in the retrieved source documents"
      - "It removes the need to apply guardrails since streamed output is pre-validated"
      - "It returns tokens as generated so users see output at time-to-first-token, improving perceived latency"
    answer: 3
    explanation: |
      Streaming surfaces tokens as they're produced, so the user sees text at TTFT instead of
      waiting for the full response — a big perceived-latency win. It doesn't change total
      tokens, grounding, or the need for guardrails (which get harder to apply mid-stream).
    ref: "concepts.md#kv-cache-streaming-and-latency-metrics"

  - id: aws-ml-genai-sagemaker-bedrock-054
    difficulty: advanced
    tags: [streaming, api-gateway, architecture, trade-offs]
    question: |
      A non-streaming long generation behind API Gateway sometimes takes 35 s and fails. Which
      is the most appropriate architectural change?
    options:
      - "Stream tokens (Lambda response streaming / WebSocket) so first bytes arrive well within the 29 s API Gateway integration timeout"
      - "Raise the SageMaker real-time endpoint payload limit to 1 GB to accommodate the response"
      - "Move the model to a serverless inference endpoint so it scales to zero between requests"
      - "Increase the DynamoDB read capacity units on the session table backing the request"
    answer: 0
    explanation: |
      API Gateway's 29 s integration timeout kills long synchronous responses; streaming (or
      WebSocket/response streaming) delivers first bytes early and avoids the single long
      blocking call. Payload limits, serverless mode, and DynamoDB capacity don't address the
      timeout.
    ref: "concepts.md#kv-cache-streaming-and-latency-metrics"

  # ---------------- Caching ----------------
  - id: aws-ml-genai-sagemaker-bedrock-055
    difficulty: intermediate
    tags: [caching, semantic-cache, trade-offs]
    question: |
      What is the main risk of a semantic cache (embedding-similarity-based) versus an exact
      prompt cache?
    options:
      - "It cannot store any responses at all, so every query must still hit the full model"
      - "It requires a dedicated Provisioned Throughput commitment before any lookup works"
      - "A query that looks similar but is subtly different may return a wrong cached answer"
      - "It always increases total token cost because each lookup re-sends the entire prompt"
    answer: 2
    explanation: |
      Semantic caches match paraphrases (more hits, cheaper/faster) but a too-loose similarity
      threshold can serve a wrong answer for a query that merely resembles a past one. It does
      store responses, doesn't require Provisioned Throughput, and reduces (not increases) cost
      on hits.
    ref: "concepts.md#prompt-and-semantic-caching"

  - id: aws-ml-genai-sagemaker-bedrock-056
    difficulty: advanced
    tags: [caching, prompt-cache, prefix, cost]
    question: |
      Bedrock prompt caching of a large static prefix (system prompt, few-shot examples, reused
      context) helps most when:
    options:
      - "Every request has a completely unique prompt with no shared prefix or reusable context whatsoever"
      - "You want to increase the number of output tokens the model generates for each individual response"
      - "You need stronger contextual grounding checks that verify each answer against retrieved source text"
      - "A long prefix is reused across many calls (e.g., chat or agents), cutting TTFT and input-token cost"
    answer: 3
    explanation: |
      Prefix caching avoids reprocessing a large shared prefix each call, reducing TTFT and
      input-token cost — valuable in chat/agent loops with a stable prefix. With fully unique
      prompts there's nothing to reuse; it doesn't affect output length or grounding.
    ref: "concepts.md#prompt-and-semantic-caching"

  - id: aws-ml-genai-sagemaker-bedrock-057
    difficulty: expert
    tags: [caching, semantic-cache, correctness]
    question: |
      Which type of response should you NOT serve from a semantic cache?
    options:
      - "A generic factual definition that rarely changes and is identical for every requesting user"
      - "A personalized or time-sensitive answer (e.g., account balance, today's price)"
      - "A cached FAQ answer for a common question that returns the same text regardless of who asks"
      - "A static product description whose wording is fixed and shared identically across all customers"
    answer: 1
    explanation: |
      Personalized or time-sensitive answers must not be semantic-cached — similarity matching
      could return another user's or a stale answer. Generic, static, non-personalized content
      is safe to cache.
    ref: "concepts.md#prompt-and-semantic-caching"

  # ---------------- Guardrails ----------------
  - id: aws-ml-genai-sagemaker-bedrock-058
    difficulty: intermediate
    tags: [guardrails, safety, pii]
    question: |
      Which capabilities do Amazon Bedrock Guardrails provide?
    options:
      - "Input/output policies: denied topics, content filters, PII detection/redaction, and contextual grounding checks"
      - "Only output content filtering applied after generation, with no inspection of the incoming user prompt"
      - "Automatic fine-tuning of the base model's weights on flagged requests to make it safer over time"
      - "Vector index management, handling embedding storage and approximate-nearest-neighbor retrieval tuning"
    answer: 0
    explanation: |
      Guardrails apply to both input and output: denied topics, content filters, PII
      detection/redaction, word filters, and contextual grounding/relevance checks — and are
      model-agnostic (ApplyGuardrail). They don't fine-tune models or manage vector indexes.
    ref: "concepts.md#guardrails-and-hallucination-mitigation"

  - id: aws-ml-genai-sagemaker-bedrock-059
    difficulty: advanced
    tags: [guardrails, latency, false-positives, trade-offs]
    question: |
      What is a realistic downside of applying strict Bedrock Guardrails to every request?
    options:
      - "They make the model fully deterministic, forcing identical output for every repeated prompt"
      - "They increase the base model's maximum context window size to fit the extra policy instructions"
      - "They add latency and cost per request and can produce false positives that block legitimate content"
      - "They remove the need for a vector store by validating answers directly against the source documents"
    answer: 2
    explanation: |
      Guardrails add per-request checks (latency + cost) and, if thresholds are strict, may
      block legitimate content (false positives) — a safety-vs-UX tuning problem. They don't
      change determinism, context window, or retrieval architecture.
    ref: "concepts.md#guardrails-and-hallucination-mitigation"

  - id: aws-ml-genai-sagemaker-bedrock-060
    difficulty: intermediate
    tags: [guardrails, hallucination, mitigation]
    question: |
      Which combination best reduces factual hallucination in a RAG assistant?
    options:
      - "High sampling temperature with no citations, letting the model answer freely from memory"
      - "Removing retrieval entirely and relying only on the base model's pretrained parametric knowledge"
      - "Only increasing the model size to a larger variant while leaving prompting and retrieval unchanged"
      - "Strong grounding with citations, lower temperature for factual tasks, and 'say I don't know' instructions"
    answer: 3
    explanation: |
      Grounding + citations, lower temperature, and explicit refusal instructions together cut
      hallucination. High temperature/no citations and dropping retrieval increase it; a bigger
      model alone doesn't ground answers in your data.
    ref: "concepts.md#guardrails-and-hallucination-mitigation"

  # ---------------- Fine-tune vs RAG vs prompt ----------------
  - id: aws-ml-genai-sagemaker-bedrock-061
    difficulty: intermediate
    tags: [fine-tuning, rag, prompt-engineering]
    question: |
      Which statement best captures what each adaptation approach teaches a model?
    options:
      - "Prompt engineering shapes in-context response; RAG injects facts/knowledge; fine-tuning teaches behavior/style/format"
      - "Prompt engineering permanently changes weights; RAG changes weights too; fine-tuning injects live external data"
      - "All three techniques do fundamentally the same thing and differ only in how fast they execute"
      - "RAG teaches long-term behavior and tone; fine-tuning provides fresh, always-current knowledge with citations"
    answer: 0
    explanation: |
      Prompt engineering steers in-context behavior; RAG injects facts (updatable via the
      index, with citations); fine-tuning teaches behavior/format/tone by changing weights.
      RAG doesn't change weights and fine-tuning doesn't provide fresh, cited knowledge — those
      are swapped in the wrong distractors.
    ref: "concepts.md#fine-tuning-versus-rag-versus-prompt-engineering"

  - id: aws-ml-genai-sagemaker-bedrock-062
    difficulty: advanced
    tags: [rag, fine-tuning, freshness, trade-offs]
    question: |
      Knowledge that changes daily must be reflected in answers with source citations. RAG or
      fine-tuning, and why?
    options:
      - "Fine-tuning, because it bakes the latest daily facts into the weights instantly with no retraining lag"
      - "Fine-tuning, because RAG has no mechanism to attach source citations to any generated answer"
      - "RAG, because you update the index (not the model) for freshness and it can cite sources"
      - "Neither approach works; only careful prompt engineering can keep pace with data that changes daily"
    answer: 2
    explanation: |
      RAG handles frequently-changing knowledge by updating the vector index and can return
      citations — no retraining. Fine-tuning bakes facts into weights (stale until retrained)
      and doesn't cite sources; prompt engineering alone can't scale to a large corpus.
    ref: "concepts.md#fine-tuning-versus-rag-versus-prompt-engineering"

  - id: aws-ml-genai-sagemaker-bedrock-063
    difficulty: advanced
    tags: [fine-tuning, behavior, latency, trade-offs]
    question: |
      When is fine-tuning the right choice over RAG/prompting despite its cost?
    options:
      - "When knowledge changes hourly and every answer must cite the exact source document it came from"
      - "When you want zero training cost and no standing serving spend to adapt the model at all"
      - "When the corpus is enormous and dynamic, growing and shifting faster than any index refresh"
      - "When you need consistent behavior/format/tone or to shorten prompts (bake behavior in) and quality can't be met by prompting/RAG"
    answer: 3
    explanation: |
      Fine-tuning excels at consistent behavior/style/format and can shorten prompts (fewer
      tokens → lower per-call latency/cost). Rapidly-changing, citable knowledge and dynamic
      corpora favor RAG; fine-tuning always has training cost (and on Bedrock mandatory
      Provisioned Throughput).
    ref: "concepts.md#fine-tuning-versus-rag-versus-prompt-engineering"

  - id: aws-ml-genai-sagemaker-bedrock-064
    difficulty: expert
    tags: [fine-tuning, cost, provisioned-throughput, economics]
    question: |
      Why does fine-tuning on Bedrock often only pay off at scale?
    options:
      - "Because you pay training cost plus mandatory Provisioned Throughput (hourly) to serve the custom model, so low volume can't amortize it"
      - "Because fine-tuned models are served completely for free once the initial training job finishes"
      - "Because fine-tuning requires provisioning a dedicated AWS region reserved for your custom model"
      - "Because RAG is always strictly more accurate than fine-tuning on every possible task and dataset"
    answer: 0
    explanation: |
      A custom Bedrock model must be served via Provisioned Throughput (billed hourly), on top
      of training cost — so low-volume use can't amortize the standing spend. Fine-tuned serving
      is not free; region dedication isn't required; RAG vs fine-tune accuracy is task-dependent.
    ref: "concepts.md#fine-tuning-versus-rag-versus-prompt-engineering"

  - id: aws-ml-genai-sagemaker-bedrock-065
    difficulty: intermediate
    tags: [fine-tuning, lora, peft]
    question: |
      What is the advantage of parameter-efficient fine-tuning (LoRA/QLoRA) on SageMaker?
    options:
      - "It retrains every one of the model's full weights each run to squeeze out maximum possible quality"
      - "It removes the need for any labeled training data by learning purely from the base model itself"
      - "It tunes a small set of adapter parameters, dramatically cutting training cost/memory vs full fine-tuning"
      - "It converts the model into a searchable vector index that answers queries by nearest-neighbor lookup"
    answer: 2
    explanation: |
      LoRA/QLoRA update small low-rank adapters instead of all weights, slashing GPU memory and
      training cost while retaining most of the benefit. It still needs training data and does
      not full-tune or turn a model into an index.
    ref: "concepts.md#fine-tuning-versus-rag-versus-prompt-engineering"

  # ---------------- Agents ----------------
  - id: aws-ml-genai-sagemaker-bedrock-066
    difficulty: intermediate
    tags: [agents, tool-use, action-groups]
    question: |
      What does a Bedrock Agent add beyond a plain LLM call?
    options:
      - "It only summarizes text faster than a plain call by pre-tokenizing the prompt on dedicated hardware"
      - "It replaces the need for a vector store in all cases by memorizing retrieved documents into its context"
      - "It guarantees fully deterministic outputs, returning byte-identical responses for any repeated request"
      - "It orchestrates reasoning plus tool/API calls (action groups via Lambda/OpenAPI), Knowledge Bases, and guardrails to complete multi-step tasks"
    answer: 3
    explanation: |
      Agents let the model act: reason, call action groups (Lambda/OpenAPI), query attached
      Knowledge Bases, apply guardrails, and iterate over steps. They don't just summarize,
      don't universally remove vector stores, and are non-deterministic.
    ref: "concepts.md#bedrock-agents-and-tool-use"

  - id: aws-ml-genai-sagemaker-bedrock-067
    difficulty: advanced
    tags: [agents, step-functions, trade-offs, determinism]
    question: |
      A workflow follows a fixed, known sequence of steps every time and must be reliable and
      cheap. Should you use a Bedrock Agent or Step Functions, and why?
    options:
      - "Bedrock Agent, because agents are always cheaper than any hand-coded deterministic orchestration"
      - "Step Functions, because a deterministic orchestration is cheaper, faster, and more testable for a fixed path"
      - "Bedrock Agent, because even a fixed deterministic workflow needs an LLM reasoning in the loop each step"
      - "Neither option fits; just use a single monolithic LLM call to handle the entire fixed sequence at once"
    answer: 1
    explanation: |
      A fixed workflow is best served by deterministic Step Functions — cheaper, faster,
      testable, no LLM round-trips. Agents fit variable, open-ended paths but add non-
      determinism, latency, and cost, and can loop/err — overkill for a known sequence.
    ref: "concepts.md#bedrock-agents-and-tool-use"

  - id: aws-ml-genai-sagemaker-bedrock-068
    difficulty: expert
    tags: [agents, latency, reliability, trade-offs]
    question: |
      What are the primary risks of relying on a Bedrock Agent for a customer-facing,
      latency-sensitive path?
    options:
      - "Non-determinism, higher latency from multiple LLM round-trips, harder testing, and possible loops/errors"
      - "Guaranteed lower latency and fully deterministic behavior on every customer-facing request path"
      - "It cannot call any external tools or APIs, so it is limited to reasoning over its own context alone"
      - "It forces you to purchase Bedrock Provisioned Throughput before the agent can serve any traffic"
    answer: 0
    explanation: |
      Agents make several LLM calls (higher, variable latency), behave non-deterministically,
      are harder to test, and can loop or misfire — risky on tight latency SLAs. They can call
      tools, don't guarantee low latency, and don't inherently force Provisioned Throughput.
    ref: "concepts.md#bedrock-agents-and-tool-use"

  # ---------------- Cost / capacity ----------------
  - id: aws-ml-genai-sagemaker-bedrock-069
    difficulty: intermediate
    tags: [cost, tokens, estimation]
    question: |
      For GenAI cost estimation, per-request cost is best approximated by:
    options:
      - "Number of GPUs × hours consumed, billed identically regardless of how many tokens the request uses"
      - "A single flat per-request fee that stays the same no matter how long the prompt or completion is"
      - "(input_tokens × input_price) + (output_tokens × output_price)"
      - "Vector count × embedding dimension, the same formula used to size the retrieval index storage"
    answer: 2
    explanation: |
      On-demand FM cost scales with input and output tokens at their respective prices; output
      tokens are typically pricier and serial. GPU-hours describe self-hosted capacity, not
      per-token billing; there's no flat per-request fee; vector×dim is storage sizing.
    ref: "concepts.md#cost-and-latency-trade-offs-and-capacity-estimation"

  - id: aws-ml-genai-sagemaker-bedrock-070
    difficulty: expert
    tags: [cost, capacity, vector-store, sizing]
    question: |
      Roughly how much raw storage do 100 million 768-dimensional float32 embeddings require
      (before index overhead)?
    options:
      - "About 3 GB"
      - "About 30 TB"
      - "About 300 KB"
      - "About 307 GB"
    answer: 3
    explanation: |
      100M × 768 × 4 bytes ≈ 307 GB raw, before HNSW/IVF index overhead (which must largely fit
      in RAM for HNSW) — so plan sharding. The other magnitudes are off by orders of magnitude.
    ref: "concepts.md#cost-and-latency-trade-offs-and-capacity-estimation"

  - id: aws-ml-genai-sagemaker-bedrock-071
    difficulty: advanced
    tags: [cost, levers, optimization]
    question: |
      Which is generally the highest-impact, lowest-risk lever to reduce GenAI serving cost?
    options:
      - "Shorten output length and cache reusable prefixes/answers before touching hardware or throughput commitments"
      - "Immediately buy the largest 6-month Provisioned Throughput commitment to lock in a lower hourly rate"
      - "Increase k and retrieve more chunks per query so the model has richer context to draw its answer from"
      - "Fine-tune the model onto a larger base variant to bake in behavior and reduce the per-call token count"
    answer: 0
    explanation: |
      Since cost scales with tokens, shortening outputs and caching reusable prefixes/answers
      cut cost with little risk. Big provisioned commitments risk over-provisioning; larger k
      raises token cost; fine-tuning adds cost, not savings.
    ref: "concepts.md#cost-and-latency-trade-offs-and-capacity-estimation"

  - id: aws-ml-genai-sagemaker-bedrock-072
    difficulty: advanced
    tags: [capacity, classic-ml, sizing]
    question: |
      For a classic real-time model at 2,000 peak QPS where each instance sustains ~250 QPS,
      roughly how many instances (before headroom) are needed?
    options:
      - "About 2, since a single instance can absorb bursts and you only need a small standby replica"
      - "About 40, dividing peak QPS by an assumed sustainable rate of roughly 50 QPS per instance"
      - "About 8, plus autoscaling headroom for spikes and scale-out lag"
      - "About 200, provisioning one instance per every 10 QPS of measured peak traffic for safety"
    answer: 2
    explanation: |
      2000 ÷ 250 = 8 instances, plus headroom for burst and autoscaling lag. Real-time keeps a
      minimum fleet (≥ 1) running 24/7; the other figures misapply the arithmetic.
    ref: "concepts.md#cost-and-latency-trade-offs-and-capacity-estimation"

  # ---------------- Cross-cutting trade-offs / failure ----------------
  - id: aws-ml-genai-sagemaker-bedrock-073
    difficulty: advanced
    tags: [resilience, multi-region, failure-modes]
    question: |
      For regional resilience of a Bedrock-backed application, which approach is most
      appropriate?
    options:
      - "Rely on a single region because Bedrock and SageMaker endpoints are globally replicated and fail over automatically"
      - "Store all prompts in one S3 bucket in one region with no cross-region replication or backup snapshots enabled"
      - "Use a single provisioned Model Unit in one region and rely on Bedrock to fail it over to another region automatically"
      - "Run active-active across regions using cross-region inference profiles and replicate the vector store and S3 data"
    answer: 3
    explanation: |
      Bedrock and SageMaker endpoints are regional (multi-AZ within a region). For region-level
      resilience, run active-active with cross-region inference profiles and replicate S3 +
      vector store. A single region/bucket/MU has no automatic cross-region failover.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-ml-genai-sagemaker-bedrock-074
    difficulty: expert
    tags: [scenario, chatbot, service-selection, trade-offs]
    question: |
      Design a support chatbot over 10M internal docs, <2 s TTFT, citations required, tight
      budget, small team, spiky traffic. Which design is most appropriate?
    options:
      - "Bedrock Knowledge Bases (or custom RAG) over an OpenSearch/pgvector store, Bedrock on-demand with streaming, re-ranking to few chunks, Guardrails grounding, prompt caching"
      - "Fine-tune a large model on all 10M docs and serve it via Provisioned Throughput, retraining nightly so answers stay current with citations"
      - "Self-host a 70B model on a 24/7 provisioned GPU fleet with no retrieval, relying on the model's parametric memory to answer from the 10M docs"
      - "Batch Transform the 10M documents nightly into a precomputed answer table and email or queue responses to users asynchronously"
    answer: 0
    explanation: |
      RAG (managed KB or custom) gives fresh, cited answers without retraining; Bedrock on-
      demand suits spiky traffic and a small team; streaming hits <2 s TTFT; re-ranking + prompt
      caching control cost/latency; Guardrails enforce grounding. Fine-tuning 10M docs is costly
      and can't cite; a 24/7 70B fleet is expensive and ungrounded; batch is not interactive.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-ml-genai-sagemaker-bedrock-075
    difficulty: expert
    tags: [scenario, inference-modes, dual-architecture]
    question: |
      You must (a) score 500 GB of images nightly AND (b) serve 5 MB requests at <200 ms p99.
      Which two-architecture answer is correct?
    options:
      - "Use one autoscaling real-time endpoint for both workloads, looping the nightly 500 GB batch through it during off-peak hours"
      - "Serverless Inference for both the nightly 500 GB batch and the <200 ms p99 online path, relying on scale-to-zero for cost savings"
      - "Batch Transform for the nightly 500 GB scoring; a provisioned real-time (likely GPU) endpoint with autoscaling for the <200 ms p99 online path"
      - "Async Inference for the <200 ms p99 online path and a warm real-time endpoint for the nightly 500 GB batch scoring job"
    answer: 2
    explanation: |
      Offline bulk scoring is textbook Batch Transform (no standing endpoint); the strict p99
      online path needs a warm real-time endpoint (GPU if the model demands). One endpoint can't
      optimally serve both; serverless can't guarantee <200 ms p99 (cold starts, no GPU); async
      is for large/long jobs, not <200 ms online.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-ml-genai-sagemaker-bedrock-076
    difficulty: advanced
    tags: [failure-modes, cold-start, mitigation]
    question: |
      A latency-critical serverless/MME/async path suffers scale-from-zero cold starts. What is
      the standard mitigation?
    options:
      - "Increase the endpoint's maximum request payload size limit so larger batches absorb the cold-start delay"
      - "Switch the model's S3 artifact reads to eventual consistency so the container loads its weights faster on startup"
      - "Reduce the embedding dimension so the model container is smaller and initializes more quickly from cold"
      - "Use Provisioned Concurrency (serverless) or keep-warm/dedicated capacity to eliminate scale-from-zero latency for hot paths"
    answer: 3
    explanation: |
      Cold starts on scale-from-zero are mitigated by Provisioned Concurrency (serverless) or
      keeping capacity warm/dedicated for latency-critical traffic — trading idle cost for
      predictable latency. The other options are unrelated to cold starts.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-ml-genai-sagemaker-bedrock-077
    difficulty: intermediate
    tags: [failure-modes, retrieval, monitoring]
    question: |
      Users report the RAG assistant sometimes fabricates answers. Where should you look first
      and what should you monitor?
    options:
      - "The GPU driver version on the serving fleet; monitor CPU temperature and clock throttling on each instance"
      - "The retrieval stage (chunking, hybrid search, re-ranking) and grounding scores; a retrieval miss forces the model to guess"
      - "The S3 bucket policy on the document store; monitor GET request counts and 403 access-denied errors per hour"
      - "The API Gateway integration timeout on the chat route; monitor only the 4xx client-error rate for the endpoint"
    answer: 1
    explanation: |
      Fabrication usually traces to retrieval failing to surface the right context; inspect
      chunking/hybrid/re-ranking and monitor grounding/relevance scores. GPU drivers, bucket
      policy, and API Gateway timeouts don't cause hallucination.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-ml-genai-sagemaker-bedrock-078
    difficulty: beginner
    tags: [trade-offs, service-selection]
    question: |
      Which statement best summarizes the Bedrock-vs-SageMaker default choice for GenAI?
    options:
      - "Start on Bedrock (managed, per-token, elastic); consider self-hosting on SageMaker only for full model control, private weights, or clearly cheaper economics at sustained high volume"
      - "Always self-host on SageMaker for any GenAI use case, since managed per-token APIs are strictly more expensive at every scale"
      - "Bedrock is exclusively for training foundation models, while SageMaker is exclusively for serving inference from them"
      - "They are functionally interchangeable, offering identical cost, control, and operational overhead for any workload"
    answer: 0
    explanation: |
      Bedrock is the fast, elastic, managed default; self-hosting on SageMaker/EKS is justified
      by control/private-weights needs or economics at sustained high utilization. Bedrock isn't
      training-only, and the two differ sharply in control and cost profile.
    ref: "concepts.md#trade-offs-and-when-to-use-what"
