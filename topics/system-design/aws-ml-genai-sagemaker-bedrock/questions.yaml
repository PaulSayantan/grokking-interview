questions:
  # ---------------- ML lifecycle ----------------
  - id: aws-ml-genai-sagemaker-bedrock-001
    difficulty: beginner
    tags: [ml-lifecycle, s3, data]
    question: |
      In a typical SageMaker ML pipeline, what is the durable source of truth for
      raw training data and where trained model artifacts are stored?
    options:
      - "Amazon S3"
      - "Amazon EFS mounted on the training instance"
      - "The instance store of the training instance"
      - "Amazon DynamoDB"
    answer: 0
    explanation: |
      S3 is the durable (11 nines) backing store for datasets and model artifacts, with
      strong read-after-write consistency. EFS/instance store are ephemeral working
      volumes; DynamoDB is a KV store, not a data lake for large ML datasets.
    ref: "concepts.md#ml-lifecycle-on-aws"

  - id: aws-ml-genai-sagemaker-bedrock-002
    difficulty: intermediate
    tags: [ml-lifecycle, spot, cost]
    question: |
      A team runs long, interruption-tolerant training jobs and wants to cut cost.
      What is the correct way to use SageMaker Managed Spot Training?
    options:
      - "Use Spot only for real-time inference endpoints to save on serving cost"
      - "Disable checkpointing so the job restarts faster after interruption"
      - "Enable Managed Spot Training with periodic checkpointing to S3 so interrupted jobs resume"
      - "Use Spot for the online Feature Store to reduce read cost"
    answer: 2
    explanation: |
      Managed Spot can save up to ~90% but instances can be reclaimed; checkpointing to S3
      lets the job resume rather than restart from scratch. Spot is a training-capacity
      option, not for endpoints or Feature Store; disabling checkpoints loses progress.
    ref: "concepts.md#ml-lifecycle-on-aws"

  - id: aws-ml-genai-sagemaker-bedrock-003
    difficulty: advanced
    tags: [ml-lifecycle, self-managed, trade-offs]
    question: |
      An organization already runs a mature Kubernetes platform team and needs custom
      schedulers and non-standard GPU topologies for training. What is the strongest
      argument for self-managing training on EKS instead of SageMaker Training?
    options:
      - "SageMaker cannot train deep learning models at all"
      - "EKS always costs less than SageMaker for every workload"
      - "SageMaker does not support GPUs for training"
      - "Maximum control over cluster, scheduler, and hardware topology, reusing existing platform tooling"
    answer: 3
    explanation: |
      Self-managing wins when you have platform expertise and specialized needs that
      SageMaker's managed abstractions constrain. SageMaker fully supports GPU/distributed
      training; EKS is not universally cheaper (you pay in ops burden); the real trade-off
      is control vs undifferentiated heavy lifting.
    ref: "concepts.md#ml-lifecycle-on-aws"

  # ---------------- Inference modes ----------------
  - id: aws-ml-genai-sagemaker-bedrock-004
    difficulty: beginner
    tags: [inference-modes, real-time, limits]
    question: |
      What is the maximum request payload size and invocation timeout for a SageMaker
      real-time endpoint?
    options:
      - "6 MB payload, 60 second timeout"
      - "1 GB payload, 1 hour timeout"
      - "400 KB payload, 29 second timeout"
      - "100 MB payload, 15 minute timeout"
    answer: 0
    explanation: |
      Real-time endpoints cap payloads at 6 MB with a 60 s invocation timeout — synchronous
      and latency-oriented. 1 GB / 1 hour are the Asynchronous Inference limits; 400 KB is a
      DynamoDB item; 29 s is API Gateway's integration timeout.
    ref: "concepts.md#sagemaker-inference-modes"

  - id: aws-ml-genai-sagemaker-bedrock-005
    difficulty: intermediate
    tags: [inference-modes, async, large-payload]
    question: |
      You must run inference on documents up to 500 MB that each take ~10 minutes to
      process, with results available within an hour. Which SageMaker inference mode fits?
    options:
      - "Real-time endpoint with autoscaling"
      - "Serverless Inference with Provisioned Concurrency"
      - "Asynchronous Inference"
      - "Multi-Model Endpoint"
    answer: 2
    explanation: |
      Async Inference supports payloads up to 1 GB and processing up to 1 hour, queues
      requests, writes results to S3, and scales to zero. Real-time (6 MB / 60 s) and
      serverless (≤ 4 MB, no GPU) would fail on size and duration; MME addresses model count,
      not payload/duration.
    ref: "concepts.md#sagemaker-inference-modes"

  - id: aws-ml-genai-sagemaker-bedrock-006
    difficulty: intermediate
    tags: [inference-modes, serverless, idle-cost]
    question: |
      A CPU-based model receives sporadic traffic with long idle gaps and can tolerate
      occasional cold starts. Which mode minimizes cost while auto-scaling to zero?
    options:
      - "Real-time endpoint with a minimum of one instance"
      - "Batch Transform on a schedule"
      - "A dedicated GPU real-time endpoint"
      - "Serverless Inference"
    answer: 3
    explanation: |
      Serverless Inference scales to zero between bursts (pay per use) and suits CPU models
      that tolerate cold starts. Real-time keeps ≥ 1 instance running (idle cost). Batch is
      offline bulk, not request/response. A GPU endpoint is both unnecessary and costly here.
    ref: "concepts.md#sagemaker-inference-modes"

  - id: aws-ml-genai-sagemaker-bedrock-007
    difficulty: advanced
    tags: [inference-modes, serverless, limits, gpu]
    question: |
      Which statement about SageMaker Serverless Inference limits is correct?
    options:
      - "It supports GPU instances up to 8 GPUs per endpoint"
      - "Memory ranges 1024–6144 MB, no GPU, max 200 concurrency per endpoint, 5 GB ephemeral disk"
      - "It supports payloads up to 1 GB and processing up to 1 hour"
      - "There is no per-endpoint concurrency cap; only account-level billing applies"
    answer: 1
    explanation: |
      Serverless memory is 1024–6144 MB (no GPU), max concurrency per endpoint is 200, with
      5 GB ephemeral disk and a 10 GB max image. GPUs and MME/VPC/data-capture are excluded.
      1 GB / 1 hour is Async. There IS a per-endpoint concurrency cap (200) plus per-region
      account concurrency (1000, or 500 in some regions).
    ref: "concepts.md#sagemaker-inference-modes"

  - id: aws-ml-genai-sagemaker-bedrock-008
    difficulty: advanced
    tags: [inference-modes, api-gateway, timeout, trade-offs]
    question: |
      A synchronous public API (API Gateway → Lambda → SageMaker) sometimes needs 40+
      seconds of model compute. Requests intermittently fail. What is the root cause and
      best fix?
    options:
      - "API Gateway's 29 s integration timeout is exceeded; move to an async pattern (Async Inference or a job + polling)"
      - "S3 eventual consistency; switch to strongly consistent reads"
      - "The real-time endpoint payload limit of 400 KB is exceeded; compress the payload"
      - "DynamoDB throttling; raise the WCU"
    answer: 0
    explanation: |
      API Gateway enforces a 29 s integration timeout, so 40 s synchronous calls fail. The
      fix is an asynchronous pattern (SageMaker Async Inference with S3+SNS, or submit-a-job
      then poll). S3 is strongly consistent; the real-time payload limit is 6 MB not 400 KB;
      DynamoDB is not in this path.
    ref: "concepts.md#sagemaker-inference-modes"

  - id: aws-ml-genai-sagemaker-bedrock-009
    difficulty: intermediate
    tags: [inference-modes, batch, offline]
    question: |
      You must score an entire 500 GB dataset in S3 once per night with no need for an
      always-on endpoint. Which is most cost-effective?
    options:
      - "Keep a real-time endpoint warm and loop requests through it"
      - "Serverless Inference invoked in a tight loop"
      - "SageMaker Batch Transform"
      - "A Bedrock provisioned-throughput model"
    answer: 2
    explanation: |
      Batch Transform spins up a transient fleet to score an S3 dataset and shuts down —
      cheapest for offline bulk. A standing real-time endpoint or looping serverless calls
      wastes money and hits per-request overhead; Bedrock is for foundation-model generation,
      not scoring your custom model on a dataset.
    ref: "concepts.md#sagemaker-inference-modes"

  - id: aws-ml-genai-sagemaker-bedrock-010
    difficulty: expert
    tags: [inference-modes, async, autoscaling, cold-start]
    question: |
      On which metric does SageMaker Asynchronous Inference autoscaling (including
      scale-to-zero) primarily key, and what is the main latency consequence?
    options:
      - "SageMakerVariantInvocationsPerInstance; no cold start ever occurs"
      - "CPUUtilization; scaling is instantaneous with no penalty"
      - "GPUMemoryUtilization; requests are dropped when scaled to zero"
      - "ApproximateBacklogSizePerInstance; the first request after scaling from zero pays a warm-up penalty"
    answer: 3
    explanation: |
      Async scales on backlog (ApproximateBacklogSizePerInstance) and can go to zero when the
      queue drains; the trade-off is a warm-up penalty on the first request after scale-from-
      zero. Real-time scales on InvocationsPerInstance. Requests aren't dropped at zero — they
      queue in S3 and trigger scale-up.
    ref: "concepts.md#sagemaker-inference-modes"

  # ---------------- MME / MCE ----------------
  - id: aws-ml-genai-sagemaker-bedrock-011
    difficulty: beginner
    tags: [mme, cost, many-models]
    question: |
      What problem do SageMaker Multi-Model Endpoints (MME) primarily solve?
    options:
      - "Cost-effectively hosting many models on shared infrastructure instead of one endpoint each"
      - "Serving a single very large model that exceeds one GPU's memory"
      - "Guaranteeing zero cold starts for every model"
      - "Running distributed training across regions"
    answer: 0
    explanation: |
      MME packs many models onto a shared fleet/container, dynamically loading them from S3
      on demand — far cheaper than one endpoint per rarely-used model. Very large single
      models need tensor/pipeline parallelism, not MME; MME explicitly accepts occasional
      cold starts; it's a serving, not training, feature.
    ref: "concepts.md#multi-model-and-multi-container-endpoints"

  - id: aws-ml-genai-sagemaker-bedrock-012
    difficulty: advanced
    tags: [mme, memory, cold-start, s3]
    question: |
      How does a Multi-Model Endpoint manage models under memory pressure?
    options:
      - "It rejects invocations for any model not preloaded at endpoint creation"
      - "It replicates every model to every instance at all times"
      - "It dynamically loads a model on first invocation and unloads least-recently-used models, keeping them on disk for fast reload"
      - "It stores all models only in GPU memory and never on disk"
    answer: 2
    explanation: |
      MME loads models from S3 on first invocation, caches them, and evicts LRU models under
      memory pressure — evicted models remain on the instance disk (fast reload; only re-
      downloaded from S3 if disk fills). Models aren't preloaded at creation, aren't
      replicated everywhere, and disk caching is central to reducing cold starts.
    ref: "concepts.md#multi-model-and-multi-container-endpoints"

  - id: aws-ml-genai-sagemaker-bedrock-013
    difficulty: advanced
    tags: [mme, trade-offs, dedicated-endpoint]
    question: |
      You host 800 per-tenant models on an MME. Two tenants have very high, latency-
      sensitive TPS while the rest are sparse. What is the best design?
    options:
      - "Move all 800 models to individual dedicated endpoints"
      - "Switch the entire fleet to Serverless Inference"
      - "Increase MME instance count until the hot tenants stop having cold starts"
      - "Keep sparse models on the MME, but give the two high-TPS latency-sensitive models dedicated endpoints"
    answer: 3
    explanation: |
      MME shines for many similar-sized, intermittently-used models; models with high TPS or
      strict latency deserve dedicated endpoints so they don't contend for shared memory or
      suffer eviction cold starts. 800 dedicated endpoints is wasteful; serverless has no GPU
      and its own cold starts; just scaling out MME doesn't eliminate eviction contention.
    ref: "concepts.md#multi-model-and-multi-container-endpoints"

  - id: aws-ml-genai-sagemaker-bedrock-014
    difficulty: intermediate
    tags: [mce, inference-pipeline]
    question: |
      What is a SageMaker inference pipeline (via multi-container endpoints) best used for?
    options:
      - "Running preprocessing, model, and postprocessing as chained containers in one endpoint with container-to-container hops"
      - "Serving thousands of independent models with LRU eviction"
      - "Guaranteeing exactly-once semantics across regions"
      - "Automatically fine-tuning a model on each request"
    answer: 0
    explanation: |
      An inference pipeline chains containers (e.g., feature transform → model → post-process)
      inside one endpoint, avoiding external network hops. MME (not MCE) is the many-models
      case; the others are unrelated to inference pipelines.
    ref: "concepts.md#multi-model-and-multi-container-endpoints"

  # ---------------- Feature Store / Pipelines ----------------
  - id: aws-ml-genai-sagemaker-bedrock-015
    difficulty: intermediate
    tags: [feature-store, skew, online-offline]
    question: |
      What core problem does SageMaker Feature Store's online + offline design address?
    options:
      - "Encrypting model artifacts at rest"
      - "Automatically choosing GPU instance types"
      - "Training/serving skew, by ensuring the same feature values are available for low-latency inference and for training"
      - "Load balancing across endpoints"
    answer: 2
    explanation: |
      Feature Store's online store (low-latency reads for inference) and offline store (S3
      for training) keep feature computation consistent, avoiding training/serving skew and
      supporting point-in-time-correct joins. The other options are unrelated to feature
      management.
    ref: "concepts.md#sagemaker-feature-store-and-pipelines"

  - id: aws-ml-genai-sagemaker-bedrock-016
    difficulty: advanced
    tags: [feature-store, point-in-time, leakage]
    question: |
      Why does Feature Store record event time and support point-in-time joins for building
      training datasets?
    options:
      - "To reduce S3 storage cost"
      - "To increase online read throughput"
      - "To enable cross-region replication"
      - "To prevent label leakage by joining only feature values that existed at or before each label's timestamp"
    answer: 3
    explanation: |
      Point-in-time-correct joins ensure a training row uses only feature values available at
      that moment, preventing leakage of future information (which inflates offline metrics
      and fails in production). It is not primarily about storage cost, throughput, or
      replication.
    ref: "concepts.md#sagemaker-feature-store-and-pipelines"

  - id: aws-ml-genai-sagemaker-bedrock-017
    difficulty: intermediate
    tags: [pipelines, model-registry, mlops]
    question: |
      In an MLOps setup on SageMaker, what role does the Model Registry play?
    options:
      - "It stores raw training data"
      - "It versions trained models with approval status, gating which version gets deployed"
      - "It runs the ANN vector search"
      - "It provides the online feature store"
    answer: 1
    explanation: |
      Model Registry versions model artifacts and tracks approval status so pipelines/
      EventBridge can gate deployment. Raw data lives in S3; vector search is OpenSearch/
      pgvector; the online store is Feature Store.
    ref: "concepts.md#sagemaker-feature-store-and-pipelines"

  # ---------------- Bedrock FMs ----------------
  - id: aws-ml-genai-sagemaker-bedrock-018
    difficulty: beginner
    tags: [bedrock, managed, foundation-models]
    question: |
      What is Amazon Bedrock at its core?
    options:
      - "A serverless API to access foundation models (Anthropic, Meta, Amazon, etc.) without managing infrastructure"
      - "A managed Kubernetes service for hosting your own models"
      - "A vector database for embeddings"
      - "A distributed training cluster manager"
    answer: 0
    explanation: |
      Bedrock is a fully managed, serverless API to third-party and Amazon foundation models
      — no GPUs or weights to host. It is not Kubernetes (that's EKS), not a vector DB
      (OpenSearch/pgvector), and not a training cluster.
    ref: "concepts.md#amazon-bedrock-foundation-models"

  - id: aws-ml-genai-sagemaker-bedrock-019
    difficulty: intermediate
    tags: [bedrock, converse-api, portability]
    question: |
      Why would a team standardize on Bedrock's Converse API rather than model-specific
      InvokeModel bodies?
    options:
      - "Converse is the only API that supports streaming"
      - "Converse bypasses all token-based billing"
      - "Converse gives a unified multi-turn/tool-use schema across models, so swapping models needs minimal code change"
      - "Converse guarantees zero hallucinations"
    answer: 2
    explanation: |
      Converse provides a consistent request/response schema (messages, tool use) across
      Bedrock models, easing model portability. Both APIs support streaming variants; neither
      changes billing or eliminates hallucination.
    ref: "concepts.md#amazon-bedrock-foundation-models"

  - id: aws-ml-genai-sagemaker-bedrock-020
    difficulty: advanced
    tags: [bedrock, self-host, trade-offs, cost]
    question: |
      An interviewer asks when self-hosting an open model (e.g., Llama on SageMaker LMI/EKS)
      beats calling Bedrock. What is the most defensible answer?
    options:
      - "Always — self-hosting is cheaper in every scenario"
      - "When traffic is spiky and unpredictable"
      - "When you want zero operational responsibility for GPUs"
      - "When you have sustained, high, predictable token volume you can keep a GPU fleet saturated, or need full model control / private weights"
    answer: 3
    explanation: |
      Self-hosting pays off at sustained high utilization (per-token markup avoided) and when
      you need model control/private weights, accepting GPU ops and scarcity. Spiky/unknown
      load and zero-ops goals favor Bedrock's elasticity and managed infra.
    ref: "concepts.md#amazon-bedrock-foundation-models"

  - id: aws-ml-genai-sagemaker-bedrock-021
    difficulty: intermediate
    tags: [bedrock, data-governance, compliance]
    question: |
      A regulated enterprise needs foundation-model access while keeping data in its AWS
      account and integrating with IAM, KMS, and CloudTrail. Which is the strongest fit?
    options:
      - "Amazon Bedrock, optionally via PrivateLink, with IAM/KMS/CloudTrail integration"
      - "Call a public third-party LLM API over the internet"
      - "Host the model on a public EC2 instance with a public IP"
      - "Email prompts to a managed service"
    answer: 0
    explanation: |
      Bedrock keeps data within your account, supports PrivateLink (no internet egress), and
      integrates with IAM/KMS/CloudTrail; it doesn't use your prompts to train base models.
      A public external API or public EC2 undermines the governance requirements.
    ref: "concepts.md#amazon-bedrock-foundation-models"

  # ---------------- Provisioned vs on-demand ----------------
  - id: aws-ml-genai-sagemaker-bedrock-022
    difficulty: beginner
    tags: [bedrock, provisioned-throughput, model-units]
    question: |
      What does a Bedrock Provisioned Throughput purchase measure capacity in?
    options:
      - "vCPUs"
      - "GPU-hours"
      - "Model Units (MUs), each guaranteeing a fixed input/output tokens-per-minute for a model"
      - "Requests per second per shard"
    answer: 2
    explanation: |
      Provisioned Throughput is bought in Model Units, each delivering a fixed input and
      output tokens-per-minute for a specific model, billed hourly. vCPUs/GPU-hours/shards
      are the wrong abstractions for Bedrock.
    ref: "concepts.md#bedrock-provisioned-versus-on-demand-throughput"

  - id: aws-ml-genai-sagemaker-bedrock-023
    difficulty: intermediate
    tags: [bedrock, on-demand, throttling]
    question: |
      On-demand Bedrock traffic starts returning HTTP 429 errors as load grows. What is
      happening and the appropriate first response?
    options:
      - "The vector store is full; delete embeddings"
      - "The S3 bucket is throttling; enable Transfer Acceleration"
      - "The model has run out of parameters; fine-tune it"
      - "Per-account requests/tokens-per-minute quotas are exceeded; apply exponential backoff and consider cross-region inference or a fallback model"
    answer: 3
    explanation: |
      On-demand has per-account RPM/TPM quotas; exceeding them throttles (429). Handle with
      backoff and spread load via cross-region inference profiles or a fallback model, and/or
      buy Provisioned Throughput for guaranteed capacity. The other options misdiagnose the
      throttle.
    ref: "concepts.md#bedrock-provisioned-versus-on-demand-throughput"

  - id: aws-ml-genai-sagemaker-bedrock-024
    difficulty: advanced
    tags: [bedrock, provisioned-throughput, trade-offs, cost]
    question: |
      A workload has steady, high, predictable token volume with a strict latency SLA. Which
      Bedrock capacity choice is most appropriate and what is the key downside?
    options:
      - "Provisioned Throughput; downside is you pay hourly regardless of usage, so over-provisioning wastes money"
      - "On-demand; downside is nothing, it always matches provisioned latency"
      - "Serverless Inference on SageMaker; downside is cold starts"
      - "Batch Transform; downside is high latency"
    answer: 0
    explanation: |
      Predictable high volume + SLA favors Provisioned Throughput (guaranteed TPM, consistent
      latency), but it bills hourly until deleted — over-provisioning wastes money, under-
      provisioning throttles. On-demand can throttle and gives no latency guarantee; the other
      two aren't Bedrock capacity modes for this need.
    ref: "concepts.md#bedrock-provisioned-versus-on-demand-throughput"

  - id: aws-ml-genai-sagemaker-bedrock-025
    difficulty: expert
    tags: [bedrock, custom-model, provisioned-throughput]
    question: |
      You fine-tuned a model on Bedrock. How can you serve it for inference?
    options:
      - "Only via on-demand throughput, same as base models"
      - "By deploying it to a SageMaker Serverless endpoint automatically"
      - "Only via Provisioned Throughput — custom models require purchased throughput to serve"
      - "It cannot be served; fine-tuning is evaluation-only"
    answer: 2
    explanation: |
      Custom/fine-tuned Bedrock models can only be served through Provisioned Throughput —
      there is no on-demand option for them. This mandatory throughput cost is a major factor
      in the fine-tune-vs-RAG economics.
    ref: "concepts.md#bedrock-provisioned-versus-on-demand-throughput"

  - id: aws-ml-genai-sagemaker-bedrock-026
    difficulty: intermediate
    tags: [bedrock, provisioned-throughput, commitment]
    question: |
      Which set of commitment terms does Bedrock Provisioned Throughput offer, and how does
      commitment affect price?
    options:
      - "1 day, 1 week, 1 year; shorter commitment is cheaper"
      - "Only 6 months, at a fixed price"
      - "Pay-per-token only; there are no commitment terms"
      - "No commitment, 1 month, or 6 months; longer commitment lowers the hourly price"
    answer: 3
    explanation: |
      Terms are no-commitment, 1 month, or 6 months; longer commitments earn a lower hourly
      rate. No-commitment can be deleted anytime; committed terms bill until the term ends.
      Pay-per-token is the separate on-demand model.
    ref: "concepts.md#bedrock-provisioned-versus-on-demand-throughput"

  # ---------------- RAG end to end ----------------
  - id: aws-ml-genai-sagemaker-bedrock-027
    difficulty: beginner
    tags: [rag, grounding, fundamentals]
    question: |
      What is the primary purpose of Retrieval-Augmented Generation (RAG)?
    options:
      - "To train the model faster"
      - "To ground an LLM's answers in your (often private/fresh) data by retrieving relevant context into the prompt"
      - "To reduce the number of GPUs needed for training"
      - "To compress the model weights"
    answer: 1
    explanation: |
      RAG retrieves relevant chunks and injects them as context so the model answers from
      your data — fixing stale knowledge and reducing hallucination without retraining. It is
      not a training-speed, hardware, or compression technique.
    ref: "concepts.md#rag-on-aws-end-to-end"

  - id: aws-ml-genai-sagemaker-bedrock-028
    difficulty: intermediate
    tags: [rag, knowledge-bases, managed]
    question: |
      A team wants managed document Q&A with citations over S3 documents and minimal
      plumbing. Which AWS service fits best?
    options:
      - "Amazon Bedrock Knowledge Bases with RetrieveAndGenerate"
      - "Build a custom LangChain app on Lambda wiring embeddings and a vector DB by hand"
      - "SageMaker Batch Transform"
      - "Amazon DynamoDB with a GSI on document text"
    answer: 0
    explanation: |
      Bedrock Knowledge Bases handles chunking, embedding, vector storage, retrieval, and
      returns grounded answers with citations — fastest managed RAG path. Custom LangChain is
      valid but more work; Batch Transform and DynamoDB GSIs are not semantic retrieval.
    ref: "concepts.md#rag-on-aws-end-to-end"

  - id: aws-ml-genai-sagemaker-bedrock-029
    difficulty: advanced
    tags: [rag, custom, knowledge-bases, trade-offs]
    question: |
      When is a custom RAG pipeline (your own chunking, retrieval, re-ranking) justified over
      Bedrock Knowledge Bases?
    options:
      - "When you want the least possible engineering effort"
      - "When you never need citations"
      - "When you need bespoke chunking, multi-stage retrieval, hybrid ranking, or a store/logic Knowledge Bases doesn't support"
      - "When your corpus is very small"
    answer: 2
    explanation: |
      Managed KB trades control for convenience; a custom pipeline is justified when you need
      knobs KB doesn't expose (custom chunking, multi-stage/hybrid retrieval, unsupported
      stores). Minimal effort and small corpora argue FOR the managed KB.
    ref: "concepts.md#rag-on-aws-end-to-end"

  - id: aws-ml-genai-sagemaker-bedrock-030
    difficulty: intermediate
    tags: [rag, latency, tokens, cost]
    question: |
      What is a real cost/latency downside of RAG compared with a plain LLM call?
    options:
      - "It requires GPU training on every query"
      - "It permanently changes the model weights"
      - "It disables streaming"
      - "Retrieval adds latency, and injected context increases input tokens (more cost per call)"
    answer: 3
    explanation: |
      RAG adds a retrieval step (latency) and stuffs retrieved chunks into the prompt,
      increasing input tokens and thus cost. It doesn't retrain the model per query, doesn't
      modify weights, and is compatible with streaming.
    ref: "concepts.md#rag-on-aws-end-to-end"

  # ---------------- Embeddings / chunking ----------------
  - id: aws-ml-genai-sagemaker-bedrock-031
    difficulty: beginner
    tags: [embeddings, consistency]
    question: |
      In a RAG system, which rule about embeddings must hold?
    options:
      - "Queries and documents must be embedded with the same model, and dimensions must match the index"
      - "Queries and documents can use different embedding models as long as dimensions differ"
      - "Embeddings must be regenerated on every query"
      - "Higher dimensions always improve retrieval regardless of cost"
    answer: 0
    explanation: |
      Query and document embeddings must come from the same model and match the index's
      dimensionality — you can't mix models/dims in one index. Document embeddings are
      precomputed at ingest, not per query; higher dims cost more storage/latency and aren't
      unconditionally better.
    ref: "concepts.md#embeddings-and-chunking"

  - id: aws-ml-genai-sagemaker-bedrock-032
    difficulty: advanced
    tags: [embeddings, dimensions, trade-offs, cost]
    question: |
      Some embedding models (e.g., Titan Text Embeddings v2) support choosing a smaller output
      dimension. What is the trade-off?
    options:
      - "Smaller dimensions always improve accuracy"
      - "Smaller dimensions require re-training the LLM"
      - "Smaller dimensions reduce storage and speed up search at a small accuracy cost"
      - "Dimension has no effect on storage or latency"
    answer: 2
    explanation: |
      Reducing embedding dimensions (e.g., 1024→512/256) cuts vector storage and speeds ANN
      search, trading a little retrieval accuracy — a valid cost lever at scale. It doesn't
      improve accuracy, and dimension clearly affects storage/latency.
    ref: "concepts.md#embeddings-and-chunking"

  - id: aws-ml-genai-sagemaker-bedrock-033
    difficulty: intermediate
    tags: [chunking, trade-offs, retrieval]
    question: |
      What is the core trade-off in choosing chunk size for RAG?
    options:
      - "Larger chunks always retrieve faster"
      - "Chunk size only affects storage, never quality"
      - "Chunk size must equal the model's context window"
      - "Small chunks improve retrieval precision but fragment context; large chunks preserve context but dilute relevance and waste context-window tokens"
    answer: 3
    explanation: |
      Small chunks are precise but can fragment meaning and require retrieving many; large
      chunks preserve context but dilute relevance and consume more context tokens. It's a
      precision-vs-completeness trade-off — not just storage, and not tied to the context
      window size.
    ref: "concepts.md#embeddings-and-chunking"

  - id: aws-ml-genai-sagemaker-bedrock-034
    difficulty: advanced
    tags: [chunking, overlap, semantic]
    question: |
      Why use overlapping windows or semantic/recursive chunking instead of naive fixed-size
      splitting?
    options:
      - "To avoid cutting related content across boundaries so a relevant answer isn't split between two chunks"
      - "To reduce embedding model cost to zero"
      - "To guarantee exactly one chunk per document"
      - "To eliminate the need for a vector store"
    answer: 0
    explanation: |
      Overlap and structure-aware splitting keep related text together so retrieval doesn't
      miss context split across a hard boundary — at the cost of some storage duplication.
      They don't zero-out embedding cost, force one chunk per doc, or remove the vector store.
    ref: "concepts.md#embeddings-and-chunking"

  # ---------------- Vector stores ----------------
  - id: aws-ml-genai-sagemaker-bedrock-035
    difficulty: intermediate
    tags: [vector-store, opensearch, pgvector, trade-offs]
    question: |
      You need large-scale vector search AND hybrid keyword+semantic ranking with rich
      metadata filters. Which AWS option is the strongest fit?
    options:
      - "Aurora PostgreSQL with pgvector"
      - "Amazon DynamoDB with a GSI"
      - "Amazon OpenSearch Service with k-NN (HNSW) plus BM25 hybrid search"
      - "Amazon S3 Select"
    answer: 2
    explanation: |
      OpenSearch combines vector k-NN with BM25 keyword scoring (hybrid) and rich filtering at
      scale — the classic large-scale RAG store. pgvector fits when vectors co-locate with
      relational data at moderate scale; DynamoDB/S3 Select aren't ANN engines.
    ref: "concepts.md#vector-store-options-on-aws"

  - id: aws-ml-genai-sagemaker-bedrock-036
    difficulty: advanced
    tags: [vector-store, pgvector, trade-offs]
    question: |
      When is Aurora PostgreSQL with pgvector the better vector-store choice over a dedicated
      search engine?
    options:
      - "When you have billions of vectors and need the absolute lowest ANN latency"
      - "When you need no consistency guarantees at all"
      - "When you want to avoid using any database"
      - "When vectors must be joined with existing relational data transactionally at moderate scale, avoiding a new system"
    answer: 3
    explanation: |
      pgvector wins when embeddings live alongside relational data you already query — one
      transactional database, no new system — at moderate scale. At billions of vectors with
      strict latency, dedicated engines pull ahead. The other options misstate its strengths.
    ref: "concepts.md#vector-store-options-on-aws"

  - id: aws-ml-genai-sagemaker-bedrock-037
    difficulty: advanced
    tags: [vector-store, kendra, acl, trade-offs]
    question: |
      An enterprise needs turnkey document search with prebuilt connectors and document-level
      access control (users only see permitted results). Which service is the natural fit,
      and what's the trade-off?
    options:
      - "OpenSearch; trade-off is no filtering support"
      - "Amazon Kendra; trade-off is higher cost and less control over ANN internals"
      - "DynamoDB; trade-off is lack of durability"
      - "S3 Select; trade-off is no semantic search"
    answer: 1
    explanation: |
      Kendra provides managed intelligent search with connectors and document-level ACLs —
      ideal for permissions-aware enterprise retrieval — but costs more and hides the ANN
      internals. OpenSearch does support filtering; DynamoDB is durable; S3 Select is the
      wrong tool entirely.
    ref: "concepts.md#vector-store-options-on-aws"

  - id: aws-ml-genai-sagemaker-bedrock-038
