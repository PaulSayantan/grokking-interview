topic: "Data-Flow & Event-Driven Architectures"
domain: system-design
topic_slug: arch-dataflow-event
version: 1
questions:
  - id: arch-dataflow-event-001
    difficulty: beginner
    tags: [altitude, design-patterns, styles]
    question: |
      How do the "Architectural Patterns" (arch-*) styles differ in altitude from
      the GoF "Design Patterns" (dp-*) group?
    options:
      - "arch-* styles structure a whole application/deployment; dp-* patterns structure classes and objects within a process"
      - "arch-* patterns predate the 1994 GoF catalog, while dp-* patterns were only formalized later"
      - "arch-* patterns apply only to microservices; dp-* apply only to monoliths"
      - "There is no real difference; both terms describe the same reusable solutions at the same altitude"
    answer: 0
    explanation: |
      Architectural styles operate at the system level (how the whole app is structured
      and deployed); design patterns operate at the object level (how classes/objects
      collaborate in one process). That altitude difference is why Pipe-and-Filter is not
      Chain of Responsibility and Pub/Sub is not Observer.
    ref: "concepts.md#data-flow--event-driven-architectures"

  - id: arch-dataflow-event-002
    difficulty: beginner
    tags: [pipe-and-filter, definition]
    question: |
      In the Pipe-and-Filter style, what does a filter know about the filters
      surrounding it?
    options:
      - "It knows the full pipeline topology so it can reroute data"
      - "It knows only its immediate predecessor and pulls records directly from that upstream filter"
      - "Nothing — it knows only the shape of the data on its input and output pipes"
      - "It shares a block of mutable global state with all the other filters to stay coordinated"
    answer: 2
    explanation: |
      A filter is deliberately ignorant of its neighbours; it only understands its input
      and output data shapes. That ignorance is what makes filters reusable and the
      pipeline reconfigurable.
    ref: "concepts.md#pipe-and-filter"

  - id: arch-dataflow-event-003
    difficulty: intermediate
    tags: [pipe-and-filter, chain-of-responsibility, altitude]
    question: |
      A candidate says "Pipe-and-Filter is just the Chain of Responsibility pattern."
      Why is that wrong?
    options:
      - "Chain of Responsibility passes one request until a handler claims it and stops; Pipe-and-Filter is a system data-flow style where every stage transforms and forwards data"
      - "They are identical patterns; both simply pass a single unit of work through an ordered series of independent handlers, so the candidate is correct"
      - "Pipe-and-Filter can only be implemented with Unix shell pipes and cannot be expressed in a general-purpose programming language"
      - "Chain of Responsibility requires a central mediator object that inspects each request and dispatches it to the correct handler in the chain"
    answer: 0
    explanation: |
      Different altitudes. CoR is an in-process object pattern where one handler handles
      a request and the chain stops; Pipe-and-Filter is a system-level data-flow style
      where each stage transforms the data and passes it along the whole pipe.
    ref: "concepts.md#pipe-and-filter"

  - id: arch-dataflow-event-004
    difficulty: intermediate
    tags: [pipe-and-filter, ilities]
    question: |
      Which architecture characteristics does Pipe-and-Filter optimize most?
    options:
      - "Sub-millisecond interactive latency and shared transactional state"
      - "Strong global consistency and shared transactional state across every stage"
      - "Composability, reusability, and testability of independent stages"
      - "Central workflow control and end-to-end error handling"
    answer: 2
    explanation: |
      Pipe-and-Filter shines at modularity — each filter is independently testable and
      recombinable into new pipelines. It is a poor fit for low-latency interactive work
      or shared state, and error handling that spans the whole pipe is a known weakness.
    ref: "concepts.md#pipe-and-filter"

  - id: arch-dataflow-event-005
    difficulty: intermediate
    tags: [batch-sequential, pipe-and-filter, contrast]
    question: |
      What is the defining difference between Batch Sequential and Pipe-and-Filter?
    options:
      - "Batch Sequential passes the entire dataset with a hard barrier between steps; Pipe-and-Filter streams records so stages overlap in time"
      - "Pipe-and-Filter can only run on mainframe batch schedulers and cannot be deployed on commodity Linux servers"
      - "Batch Sequential has no notion of separate processing steps and instead runs the entire program as one indivisible operation"
      - "Pipe-and-Filter cannot run its stages concurrently because each filter must block until the previous one finishes entirely"
    answer: 0
    explanation: |
      Both are data-flow styles, but Batch Sequential completes each step fully and hands
      the whole output to the next (a barrier, no overlap), whereas Pipe-and-Filter
      streams data incrementally so stages run concurrently.
    ref: "concepts.md#batch-sequential"

  - id: arch-dataflow-event-006
    difficulty: beginner
    tags: [batch-sequential, latency]
    question: |
      Why does Batch Sequential tend to have high end-to-end latency?
    options:
      - "Because each step must fully complete before the next can start — no concurrency and a whole-dataset barrier"
      - "Because it always ships data between steps over slow cross-region network calls that dominate the total runtime"
      - "Because it recomputes every intermediate result continuously in a tight loop rather than caching finished output"
      - "Because it requires exactly-once delivery, and the coordination overhead for that guarantee dominates end-to-end time"
    answer: 0
    explanation: |
      Batch Sequential runs each program to completion and materializes the full output
      before the next step begins. There is zero overlap between steps, so total latency
      is the sum of all stages and resources sit idle waiting.
    ref: "concepts.md#batch-sequential"

  - id: arch-dataflow-event-007
    difficulty: beginner
    tags: [batch-processing, use-case]
    question: |
      Which workload is the best fit for a Batch Processing Architecture?
    options:
      - "Real-time fraud detection scoring each card transaction within tens of milliseconds"
      - "A live operations dashboard that must refresh its metrics every single second"
      - "A nightly billing run over a large bounded dataset where hours-old data is acceptable"
      - "A chat application that must deliver each message to recipients instantly"
    answer: 2
    explanation: |
      Batch processing excels at large bounded datasets on a schedule when freshness is
      not critical — billing, ETL, reporting. Real-time and interactive needs call for
      stream processing or event-driven styles.
    ref: "concepts.md#batch-processing-architecture"

  - id: arch-dataflow-event-008
    difficulty: intermediate
    tags: [batch-processing, ilities, tradeoffs]
    question: |
      What is the primary trade-off you accept when choosing Batch Processing?
    options:
      - "High throughput and cost-efficiency in exchange for high latency / stale results"
      - "Low latency on every request in exchange for a sharply reduced overall throughput ceiling"
      - "Strong global consistency across all records in exchange for markedly weaker durability guarantees"
      - "Operational simplicity in exchange for hard exactly-once processing semantics on every record"
    answer: 0
    explanation: |
      Batch amortizes overhead over huge volumes for excellent throughput per dollar, but
      results are only as fresh as the last run — you trade freshness for efficiency.
    ref: "concepts.md#batch-processing-architecture"

  - id: arch-dataflow-event-009
    difficulty: intermediate
    tags: [batch-processing, stream-processing, contrast]
    question: |
      The clearest axis separating Batch Processing from Stream Processing is:
    options:
      - "SQL relational storage vs. NoSQL document storage"
      - "Cloud-hosted deployment vs. on-premises data-center deployment"
      - "Synchronous request APIs vs. asynchronous callback APIs"
      - "Bounded + scheduled data vs. unbounded + continuous data"
    answer: 3
    explanation: |
      Batch processes a finite dataset on a schedule; stream processes a never-ending
      flow continuously with low latency. Lambda and Kappa exist to reconcile the two.
    ref: "concepts.md#batch-processing-architecture"

  - id: arch-dataflow-event-010
    difficulty: advanced
    tags: [stream-processing, windowing, watermarks]
    question: |
      Which set of concerns is intrinsic to Stream Processing but not to Batch
      Processing?
    options:
      - "Windowing, event-time vs. processing-time, watermarks for late/out-of-order data"
      - "Choosing a primary key, indexes, and a normalized table schema up front"
      - "Selecting a REST versus gRPC transport for the ingestion endpoint"
      - "Deciding between vertical scale-up and horizontal scale-out of the cluster"
    answer: 0
    explanation: |
      Because the input is unbounded, stream processors must reason about windows,
      event-time vs. processing-time, watermarks for late/out-of-order data, durable
      operator state, and exactly-once — none of which arise for a bounded batch job.
    ref: "concepts.md#stream-processing-architecture"

  - id: arch-dataflow-event-011
    difficulty: intermediate
    tags: [stream-processing, ilities]
    question: |
      A team needs sub-second freshness on an unbounded event flow for live anomaly
      detection. Which style fits, and what cost do they accept?
    options:
      - "Batch Processing; they accept multi-hour latency because results only refresh on each scheduled run"
      - "Batch Sequential; they accept zero concurrency because each step blocks on the previous stage's full output"
      - "Stream Processing; they accept the complexity of windowing, watermarks, and exactly-once"
      - "Pipe-and-Filter; they accept loss of the audit trail as records are discarded after each filter stage"
    answer: 2
    explanation: |
      Stream processing delivers low latency on unbounded data, but at the cost of
      genuine complexity: windowing, out-of-order/late data, large durable state, and
      hard exactly-once semantics.
    ref: "concepts.md#stream-processing-architecture"

  - id: arch-dataflow-event-012
    difficulty: intermediate
    tags: [stream-processing, eda, contrast]
    question: |
      How does Stream Processing differ in intent from Event-Driven Architecture?
    options:
      - "They are the same thing, just marketed under two different vendor names for the same technology"
      - "Stream Processing is strictly synchronous request/response, whereas EDA always runs as scheduled batch jobs"
      - "EDA cannot use a message broker and instead requires direct point-to-point calls between services"
      - "Stream Processing computes over an event flow (transform/aggregate/detect); EDA is about services reacting to events to trigger business actions"
    answer: 3
    explanation: |
      Related plumbing, different intent: stream processing is about computing results
      over a flow, while EDA is about decoupled services reacting to events to drive
      business behavior.
    ref: "concepts.md#stream-processing-architecture"

  - id: arch-dataflow-event-013
    difficulty: advanced
    tags: [lambda-architecture, layers]
    question: |
      In the Lambda Architecture, what is the role of the serving layer?
    options:
      - "It indexes both batch views and real-time views, and a query merges them for completeness plus freshness"
      - "It stores the immutable master dataset as the single append-only source of truth for the whole system"
      - "It runs only the speed layer's approximate real-time computations and ignores the batch views entirely"
      - "It replays the append-only log from the beginning to reprocess all historical data on demand"
    answer: 0
    explanation: |
      Lambda has a batch layer (accurate, stale), a speed layer (fresh, approximate), and
      a serving layer that indexes both; queries merge the batch view with the real-time
      view to get completeness and freshness together.
    ref: "concepts.md#lambda-architecture"

  - id: arch-dataflow-event-014
    difficulty: advanced
    tags: [lambda-architecture, tradeoffs, maintainability]
    question: |
      What is the most-cited downside of the Lambda Architecture?
    options:
      - "It cannot produce fresh results because the speed layer only ever serves stale precomputed batch views"
      - "It has no way to correct historical errors once the immutable master dataset has been written once"
      - "It maintains two code paths (batch and speed) implementing the same logic, doubling complexity and reconciliation cost"
      - "It requires a single-node deployment and therefore cannot scale horizontally across a cluster"
    answer: 2
    explanation: |
      Lambda's dual batch + speed layers implement the same logic in different frameworks,
      producing duplicated logic, double the bugs, and reconciliation pain — the very
      problem Kappa was proposed to solve.
    ref: "concepts.md#lambda-architecture"

  - id: arch-dataflow-event-015
    difficulty: advanced
    tags: [kappa-architecture, replay]
    question: |
      In the Kappa Architecture, how is historical reprocessing (e.g., a logic bug fix)
      performed?
    options:
      - "Run a separate nightly batch job over a data warehouse to recompute the corrected historical views"
      - "Manually edit the affected past events in place within the log and let downstream views refresh"
      - "Restore the system from a database backup and recompute the corrected results with SQL queries"
      - "Replay the immutable, long-retention log from the beginning through a new stream job into a new output, then cut over"
    answer: 3
    explanation: |
      Kappa removes the batch layer entirely; reprocessing is 'just replay' — you re-run
      the log through a new version of the stream job to build a new view and cut over,
      using the same code for live and historical processing.
    ref: "concepts.md#kappa-architecture"

  - id: arch-dataflow-event-016
    difficulty: advanced
    tags: [kappa-architecture, lambda-architecture, contrast]
    question: |
      What does Kappa remove relative to Lambda, and what does it require in return?
    options:
      - "It removes the speed layer; it requires a nightly batch job to recompute all real-time approximations"
      - "It removes the batch layer (single codebase); it requires a durable, long-retention, replayable log"
      - "It removes the serving layer; it requires a relational warehouse to index and merge the query views"
      - "It removes event ordering guarantees; it requires exactly-once delivery to reconcile out-of-order records"
    answer: 1
    explanation: |
      Kappa deletes the separate batch layer so there is one stream codebase, but this
      demands a long-retention replayable log (and can make large reprocessing slow and
      is weaker for heavy ad-hoc OLAP analytics).
    ref: "concepts.md#kappa-architecture"

  - id: arch-dataflow-event-017
    difficulty: expert
    tags: [kappa-architecture, event-sourcing, contrast]
    question: |
      Both Kappa and Event Sourcing revolve around replaying an immutable log. How do
      they differ?
    options:
      - "They are identical concepts under different names"
      - "Kappa is a data-processing pipeline style (recompute analytics views); Event Sourcing is an application state-persistence pattern (rebuild an aggregate's state)"
      - "Event Sourcing forbids snapshots; Kappa requires them"
      - "Kappa is synchronous; Event Sourcing is asynchronous"
    answer: 1
    explanation: |
      Same 'replay the log' intuition at different altitudes: Kappa recomputes analytics
      views from an event stream (pipeline), while Event Sourcing rebuilds an aggregate's
      current state by folding its domain events (persistence).
    ref: "concepts.md#kappa-architecture"

  - id: arch-dataflow-event-018
    difficulty: intermediate
    tags: [eda, broker-topology, definition]
    question: |
      In the broker topology of Event-Driven Architecture, how is a multi-step workflow
      coordinated?
    options:
      - "A central mediator component sequences every step and tracks the workflow's state end to end"
      - "There is no central coordinator; each processor consumes an event, does work, and publishes a new event that others may react to — the flow emerges"
      - "A relational database enforces the ordering of steps through foreign-key constraints between tables"
      - "A synchronous API gateway invokes each downstream service in a fixed, predetermined order"
    answer: 1
    explanation: |
      Broker topology has no orchestrator. Processors form a chain reaction through a
      lightweight broker; the end-to-end flow emerges from who subscribes to what, which
      maximizes scalability and extensibility.
    ref: "concepts.md#event-driven-architecture-broker-topology"

  - id: arch-dataflow-event-019
    difficulty: advanced
    tags: [eda, broker-topology, tradeoffs]
    question: |
      What is the main weakness of the EDA broker topology?
    options:
      - "No central control of a multi-step workflow, making monitoring, restart, and error handling across the chain hard"
      - "It cannot scale horizontally, because the broker forces every event through a single ordered partition on one node"
      - "It tightly couples every producer to every consumer through direct point-to-point wiring that breaks when either side moves"
      - "It cannot add new consumers without redeploying producers, since each producer hard-codes its downstream subscriber list"
    answer: 0
    explanation: |
      The broker topology's strength (no coordinator, high extensibility) is also its
      weakness: there is no single place that knows the whole workflow, so overall
      progress, restart, and coordinated error handling are hard.
    ref: "concepts.md#event-driven-architecture-broker-topology"

  - id: arch-dataflow-event-020
    difficulty: intermediate
    tags: [eda, mediator-topology, definition]
    question: |
      What does the event mediator hold in the mediator topology of EDA?
    options:
      - "The persistent state of every downstream database, so processors never keep any local state of their own"
      - "Only a static routing table with no workflow logic, simply mapping each event type to a fixed destination queue"
      - "The workflow knowledge — it sequences processing events, tracks state, and handles failures/retries"
      - "Nothing; it just forwards each event unchanged to the next subscriber without inspecting or sequencing it"
    answer: 2
    explanation: |
      The mediator knows the required steps of the workflow, dispatches events in order,
      tracks state, and handles errors/restart. Processors stay simple and just do one
      task when asked. AWS Step Functions and an ESB are concrete mediators.
    ref: "concepts.md#event-driven-architecture-mediator-topology"

  - id: arch-dataflow-event-021
    difficulty: advanced
    tags: [eda, mediator-topology, tradeoffs, ilities]
    question: |
      A complex order-fulfillment workflow needs centralized error handling, restart,
      and end-to-end visibility. Which EDA topology fits, and what do you give up?
    options:
      - "Broker topology; you give up scalability because the coordinator-free chain cannot fan work out across many nodes"
      - "Broker topology; you accept eventual consistency and lose any centralized restart or error-handling capability"
      - "Neither; EDA cannot support multi-step workflows, so you must fall back to a synchronous orchestration service"
      - "Mediator topology; you accept the mediator as a coupling point / potential bottleneck and less dynamic extensibility"
    answer: 3
    explanation: |
      Mediator topology gives central control, ordering, error handling, and
      observability — at the cost of a coupling point / potential SPOF and reduced
      dynamic extensibility (adding a step means changing the mediator).
    ref: "concepts.md#event-driven-architecture-mediator-topology"

  - id: arch-dataflow-event-022
    difficulty: intermediate
    tags: [eda, mediator-topology, gof-mediator, altitude]
    question: |
      How does the EDA "mediator topology" relate to the GoF Mediator design pattern?
    options:
      - "They are the same pattern at the same altitude, just named differently by the enterprise-integration and object-oriented communities"
      - "Different altitudes: the EDA mediator coordinates a distributed multi-service workflow; the GoF Mediator mediates object interactions within one process"
      - "The GoF Mediator is a database replication technique that keeps object caches consistent across nodes in a cluster"
      - "The EDA mediator only applies to monoliths, whereas the GoF Mediator is reserved for distributed microservice deployments"
    answer: 1
    explanation: |
      Same intuition (a coordinator), very different altitude. The EDA mediator topology
      orchestrates a distributed workflow; the GoF Mediator (dp-behavioral) reduces
      coupling among collaborating objects inside a single process.
    ref: "concepts.md#event-driven-architecture-mediator-topology"

  - id: arch-dataflow-event-023
    difficulty: beginner
    tags: [pub-sub, decoupling]
    question: |
      What two kinds of decoupling does the Publish-Subscribe style provide between a
      publisher and its subscribers?
    options:
      - "Schema decoupling (they share no data format) and transport decoupling (either side may switch network protocols freely)"
      - "Location decoupling (neither knows the other's address) and temporal decoupling (a durable broker lets consumers be offline and catch up)"
      - "CPU decoupling and memory decoupling, so the publisher and subscriber never contend for the same processor or heap space"
      - "Read decoupling and write decoupling, separating the query path from the command path across the broker boundary"
    answer: 1
    explanation: |
      Publishers and subscribers never reference each other (location decoupling), and a
      durable broker holds messages so consumers can be offline and catch up later
      (temporal decoupling), plus one message can fan out to many subscribers.
    ref: "concepts.md#publish-subscribe-and-broker"

  - id: arch-dataflow-event-024
    difficulty: intermediate
    tags: [pub-sub, point-to-point, contrast]
    question: |
      How does Publish-Subscribe differ from a point-to-point message queue?
    options:
      - "Pub/Sub delivers each message to exactly one consumer chosen by the broker, while a point-to-point queue broadcasts every message to all listeners"
      - "Pub/Sub fans a message out to all interested subscribers; a point-to-point queue delivers each message to exactly one of the competing consumers"
      - "They are identical, differing only in the vendor terminology used to describe the very same fan-out delivery mechanism"
      - "Point-to-point requires a dedicated broker, while pub/sub connects publishers straight to subscribers with no intermediary"
    answer: 1
    explanation: |
      Pub/Sub broadcasts to N subscribers (fan-out); point-to-point queues distribute work
      so each message goes to exactly one competing consumer.
    ref: "concepts.md#publish-subscribe-and-broker"

  - id: arch-dataflow-event-025
    difficulty: intermediate
    tags: [pub-sub, observer, altitude]
    question: |
      Why is the Publish-Subscribe style not the same as the GoF Observer pattern?
    options:
      - "Observer is in-process object notification with direct references and synchronous calls; Pub/Sub is out-of-process, brokered, and asynchronous with no direct reference"
      - "Observer is faster in all cases because it notifies listeners with direct in-memory calls rather than routing through any queue"
      - "Pub/Sub cannot have more than one subscriber per topic, so a message can never fan out to multiple independent consumers"
      - "Observer requires a message broker to relay notifications between the subject and its registered observers across processes"
    answer: 0
    explanation: |
      Different altitudes: Observer (dp-behavioral) notifies observers via direct object
      references synchronously in one process; Pub/Sub decouples producers and consumers
      across processes through a broker, asynchronously, with no direct reference.
    ref: "concepts.md#publish-subscribe-and-broker"

  - id: arch-dataflow-event-026
    difficulty: intermediate
    tags: [cqrs, definition]
    question: |
      What does CQRS separate?
    options:
      - "The network layer from the storage layer, so transport concerns are handled independently of how records are persisted"
      - "The frontend user interface from the backend service tier, splitting presentation code away from business logic"
      - "The command side (writes, invariants, write model) from the query side (reads served by query-shaped read models/projections)"
      - "Synchronous request/response calls from asynchronous fire-and-forget calls at the API boundary of the service"
    answer: 2
    explanation: |
      Command Query Responsibility Segregation splits writes (command side, enforcing
      invariants) from reads (query side, served by denormalized projections), letting
      each use its own schema/store and scale independently.
    ref: "concepts.md#cqrs"

  - id: arch-dataflow-event-027
    difficulty: advanced
    tags: [cqrs, consistency, tradeoffs]
    question: |
      What consistency characteristic must you accept with a typical CQRS deployment?
    options:
      - "Strong global consistency with zero replication lag between the write model and every read projection"
      - "Read-your-writes on every query with no extra work, because the read model updates within the same transaction"
      - "Linearizability across all projections for free, since the broker applies each event in a single global order"
      - "Eventual consistency between the write side and the asynchronously-updated read side"
    answer: 3
    explanation: |
      Because the read model is usually updated asynchronously from the write side (often
      via events), there is eventual consistency: a write may not be immediately visible
      to reads.
    ref: "concepts.md#cqrs"

  - id: arch-dataflow-event-028
    difficulty: advanced
    tags: [cqrs, read-replicas, contrast]
    question: |
      How does CQRS differ from simply adding read replicas of your database?
    options:
      - "Read replicas serve the same schema for read scaling; CQRS uses a different, query-shaped read model on the read side"
      - "CQRS cannot scale reads at all and only ever improves write throughput by isolating the command path"
      - "Read replicas require event sourcing to stay synchronized, whereas CQRS avoids any log-based replication"
      - "They are the same technique, differing only in whether the copies live on the same host or a separate node"
    answer: 0
    explanation: |
      Read replicas replicate the same schema for read scaling. CQRS goes further: the
      read side has a different, denormalized, query-optimized model, independently
      designed and scaled.
    ref: "concepts.md#cqrs"

  - id: arch-dataflow-event-029
    difficulty: intermediate
    tags: [cqrs, event-sourcing, orthogonality]
    question: |
      Which statement about CQRS and Event Sourcing is correct?
    options:
      - "CQRS requires Event Sourcing, because the read model can only be rebuilt by replaying a persisted event log"
      - "Event Sourcing requires CQRS, since an append-only event store cannot answer any query without a separate read side"
      - "They are orthogonal — CQRS separates read/write models, Event Sourcing changes how state is stored — and merely compose well"
      - "They are two names for the same pattern, both describing the separation of commands from queries over an event log"
    answer: 2
    explanation: |
      They are independent. CQRS is about separating read and write models; Event Sourcing
      is about persisting events instead of current state. They pair nicely but neither
      requires the other.
    ref: "concepts.md#cqrs"

  - id: arch-dataflow-event-030
    difficulty: intermediate
    tags: [event-sourcing, definition]
    question: |
      In Event Sourcing, how is an aggregate's current state obtained?
    options:
      - "By reading a single current-state row and mutating it in place, discarding the prior value on every write"
      - "By folding (replaying) its immutable, append-only sequence of events, often accelerated by snapshots"
      - "By querying a read replica that holds the latest materialized copy of the aggregate's current fields"
      - "By running a nightly batch job that recomputes and caches each aggregate's current state from source tables"
    answer: 1
    explanation: |
      Event Sourcing stores an append-only log of events; current state is a left fold
      over those events (replay from the start), with periodic snapshots to keep replay
      fast.
    ref: "concepts.md#event-sourcing"

  - id: arch-dataflow-event-031
    difficulty: beginner
    tags: [event-sourcing, motivation]
    question: |
      What core problem does Event Sourcing solve that in-place state mutation does not?
    options:
      - "It preserves full history — audit trail, temporal queries (state at any past time), and replay to rebuild state or new views"
      - "It reduces disk usage by storing only the latest delta and compacting away all superseded records"
      - "It removes the need for any database, since the in-memory event fold is the sole system of record"
      - "It guarantees strong consistency on all reads by serializing every query behind the write log"
    answer: 0
    explanation: |
      Storing only current state destroys history. Event Sourcing keeps every event, so
      you get an audit trail, can reconstruct past state, and can replay the log to build
      new projections or fix bugs.
    ref: "concepts.md#event-sourcing"

  - id: arch-dataflow-event-032
    difficulty: advanced
    tags: [event-sourcing, tradeoffs, schema-evolution]
    question: |
      Which of these is a genuine downside of Event Sourcing?
    options:
      - "It cannot support auditing, because appending new events overwrites the trail of what previously happened"
      - "It forbids asynchronous processing, forcing every event to be handled synchronously in the write path"
      - "Current-state queries need projections/snapshots and event/schema evolution is hard because old events are immutable (needing versioning/upcasting)"
      - "It cannot be combined with CQRS, since the two patterns place conflicting demands on the read model"
    answer: 2
    explanation: |
      You can't simply SELECT current state — you need projections/snapshots — and because
      historical events are immutable, evolving the event schema requires versioning and
      upcasting. Storage and conceptual overhead are higher too.
    ref: "concepts.md#event-sourcing"

  - id: arch-dataflow-event-033
    difficulty: advanced
    tags: [event-sourcing, cdc, contrast]
    question: |
      How does Event Sourcing differ from Change Data Capture (CDC)?
    options:
      - "CDC makes events the primary source of truth by design, while Event Sourcing merely taps a database's transaction log after the fact"
      - "They are identical mechanisms, both emitting a change stream directly from an append-only application event store"
      - "CDC cannot produce a stream of changes and can only take periodic full snapshots of the source tables"
      - "Event Sourcing makes events the primary source of truth by design; CDC derives an event stream from a database's existing transaction log after the fact"
    answer: 3
    explanation: |
      Event Sourcing is intentional: events are the system of record. CDC is an
      integration afterthought that taps a database's transaction log to emit change
      events. Deep dive: event-driven-cqrs-saga-cdc.
    ref: "concepts.md#event-sourcing"

  - id: arch-dataflow-event-034
    difficulty: intermediate
    tags: [choreography, orchestration, saga]
    question: |
      In a Saga, what distinguishes choreography from orchestration?
    options:
      - "Choreography uses a central conductor to issue commands, while orchestration relies purely on services reacting to events"
      - "Choreography has no central brain — each service reacts to events and emits its own; orchestration has a central orchestrator issuing commands and handling compensation"
      - "They differ only in programming language, with choreography written in one runtime and orchestration in another"
      - "Orchestration cannot handle failures or compensation and must abort the whole saga on any single step error"
    answer: 1
    explanation: |
      Choreographed sagas are driven by services reacting to events (loose coupling, no
      SPOF, emergent flow); orchestrated sagas use a central conductor that commands each
      step and coordinates compensation (visible, controllable, but a coupling point).
    ref: "concepts.md#choreography-vs-orchestration"

  - id: arch-dataflow-event-035
    difficulty: advanced
    tags: [choreography, tradeoffs]
    question: |
      What is the main drawback of a choreographed (event-reaction) workflow?
    options:
      - "It creates a single point of failure at the shared conductor that sequences every step of the workflow"
      - "The end-to-end flow is emergent and hard to trace/monitor, with risk of cyclic event dependencies"
      - "It tightly couples all services to a central conductor that must be redeployed whenever a step changes"
      - "It cannot scale, because every reacting service must process events strictly one at a time in lockstep"
    answer: 1
    explanation: |
      Choreography maximizes decoupling but the overall flow is emergent — no single place
      describes 'what happens next' — making it hard to trace, monitor, and reason about,
      with cyclic-dependency risk.
    ref: "concepts.md#choreography-vs-orchestration"

  - id: arch-dataflow-event-036
    difficulty: intermediate
    tags: [choreography, orchestration, eda, mapping]
    question: |
      The choreography-vs-orchestration axis maps onto which EDA distinction?
    options:
      - "CQRS vs. Event Sourcing (separating read/write models against persisting state as events)"
      - "Broker topology (≈ choreography) vs. Mediator topology (≈ orchestration)"
      - "Batch processing vs. stream processing (bounded scheduled jobs against unbounded continuous flows)"
      - "Lambda vs. Kappa (dual batch-and-speed layers against a single replayable stream codebase)"
    answer: 1
    explanation: |
      It is the same tension: choreography ≈ the coordinator-free broker topology;
      orchestration ≈ the central-mediator topology.
    ref: "concepts.md#choreography-vs-orchestration"

  - id: arch-dataflow-event-037
    difficulty: intermediate
    tags: [reactive, manifesto]
    question: |
      Per the Reactive Manifesto, which property is the *means* that delivers the other
      three (responsive, resilient, elastic)?
    options:
      - "Message-driven (asynchronous, non-blocking message passing)"
      - "Strongly consistent (a single global lock serializes all component state)"
      - "Stateless (components keep no local state and reload it on every request)"
      - "Schema-on-read (each message's structure is interpreted lazily at read time)"
    answer: 0
    explanation: |
      Message-driven is the backbone: asynchronous, non-blocking message passing decouples
      components in time, space, and failure, which is what enables responsiveness,
      resilience, and elasticity.
    ref: "concepts.md#reactive-architecture"

  - id: arch-dataflow-event-038
    difficulty: advanced
    tags: [reactive, backpressure]
    question: |
      What problem does backpressure (as in Reactive Streams) solve?
    options:
      - "It encrypts each message in transit using a per-topic session key negotiated at subscribe time"
      - "It guarantees exactly-once delivery by having the broker deduplicate every message via a sequence number"
      - "It lets a consumer signal demand so a fast producer doesn't overwhelm a slow consumer, preventing overload collapse"
      - "It replaces the need for a message broker by letting producers push straight to consumer sockets"
    answer: 2
    explanation: |
      Backpressure allows consumers to communicate how much they can handle so producers
      slow down, bounding resource use and preventing the system from collapsing under a
      fast producer / slow consumer mismatch.
    ref: "concepts.md#reactive-architecture"

  - id: arch-dataflow-event-039
    difficulty: advanced
    tags: [reactive, eda, contrast]
    question: |
      How is Reactive Architecture distinct from Event-Driven Architecture?
    options:
      - "They are identical, just two vendor labels for the same message-passing technology"
      - "Reactive forbids asynchronous messaging and mandates blocking synchronous calls everywhere"
      - "EDA cannot be resilient because event brokers offer no failure isolation between components"
      - "EDA is about the event topology (who emits/reacts to events); Reactive is the set of -ilities and message-driven discipline used to build responsive systems"
    answer: 3
    explanation: |
      They overlap (both async, message-driven) but answer different questions: EDA
      describes the event topology; Reactive describes the responsive/resilient/elastic
      -ilities delivered via non-blocking message passing and backpressure.
    ref: "concepts.md#reactive-architecture"

  - id: arch-dataflow-event-040
    difficulty: intermediate
    tags: [reactive, actor-model, adjacent]
    question: |
      How does the Actor model relate to Reactive Architecture?
    options:
      - "The Actor model is a concurrency model that is one common way to implement a reactive system"
      - "They are the same thing, since every actor framework is by definition a reactive platform"
      - "The Actor model is a pipe-and-filter data-flow style that has nothing to do with message passing"
      - "Reactive Architecture forbids actors and requires shared-memory threads coordinated by locks"
    answer: 0
    explanation: |
      Actors (Akka/Erlang) are a concrete concurrency model — message-passing, isolated
      state — that is a common implementation substrate for reactive systems, but it sits
      at a different altitude, adjacent rather than equal.
    ref: "concepts.md#reactive-architecture"

  - id: arch-dataflow-event-041
    difficulty: intermediate
    tags: [cep, definition]
    question: |
      What does a Complex Event Processing (CEP) engine primarily do?
    options:
      - "Store an aggregate's current state and mutate that single row in place on every update"
      - "Batch-load a data warehouse each night and rebuild all reporting tables from the source system"
      - "Replicate data to a Primary-Replica pair and route reads to the replicas for horizontal scaling"
      - "Continuously evaluate rules/pattern queries over sliding windows to detect higher-level situations and emit derived events"
    answer: 3
    explanation: |
      A CEP engine ingests high-volume streams and continuously evaluates temporal/
      sequential/aggregate/correlation rules across windows, emitting derived higher-level
      events (e.g., 'FraudSuspected') when a pattern matches.
    ref: "concepts.md#complex-event-processing-cep"

  - id: arch-dataflow-event-042
    difficulty: advanced
    tags: [cep, stream-processing, contrast]
    question: |
      How does CEP differ from general Stream Processing?
    options:
      - "CEP runs only as scheduled batch jobs, while stream processing is the only real-time option"
      - "Stream processing is general transformation/aggregation; CEP specializes in pattern/correlation detection (sequences, temporal rules) and emitting inferred situations"
      - "CEP cannot be built on a stream processor and must run inside the source database engine"
      - "They are identical, differing only in the query language each one exposes to users"
    answer: 1
    explanation: |
      CEP is a specialization focused on detecting patterns and correlations across many
      events and inferring situations, and is often built on top of a general stream
      processor.
    ref: "concepts.md#complex-event-processing-cep"

  - id: arch-dataflow-event-043
    difficulty: expert
    tags: [scenario, fraud, cep, stream-processing]
    question: |
      Requirement: "3 failed logins from 2 different countries within 60 seconds should
      raise a fraud alert." Which style most directly targets this?
    options:
      - "Batch Processing Architecture"
      - "Pipe-and-Filter"
      - "Complex Event Processing (CEP)"
      - "CQRS"
    answer: 2
    explanation: |
      Detecting a higher-level situation from a temporal correlation of many low-level
      events in real time is the defining CEP use case (fraud/anomaly detection).
    ref: "concepts.md#complex-event-processing-cep"

  - id: arch-dataflow-event-044
    difficulty: expert
    tags: [scenario, cqrs, ilities]
    question: |
      A system has a huge read/write asymmetry: complex reporting queries dominate while
      writes must enforce strict invariants. Which style fits, and its main cost?
    options:
      - "Batch Sequential; cost is zero concurrency because each step blocks on the previous stage's full output"
      - "Pipe-and-Filter; cost is loss of the audit trail as records are discarded after passing each filter"
      - "Kappa; cost is a dual code path that duplicates the reporting logic across batch and speed layers"
      - "CQRS; cost is eventual consistency between the write and read sides plus more moving parts"
    answer: 3
    explanation: |
      CQRS lets the write model enforce invariants and the read model be shaped/scaled for
      the reporting load independently — at the cost of eventual consistency between sides
      and added operational complexity (projectors, multiple stores).
    ref: "concepts.md#cqrs"

  - id: arch-dataflow-event-045
    difficulty: expert
    tags: [scenario, eda, broker, extensibility]
    question: |
      New teams keep needing to react to "OrderPlaced" without changing the order
      service, and there is no need for centralized workflow error handling. Which style
      best fits?
    options:
      - "EDA mediator topology, with a central conductor sequencing every reactor's step"
      - "EDA broker topology / Publish-Subscribe, so new reactors subscribe without touching producers"
      - "Batch Processing, collecting orders and fanning them out to reactors on a nightly schedule"
      - "Orchestrated saga, wiring each new reactor into the orchestrator's compensation logic"
    answer: 1
    explanation: |
      Maximal extensibility with no central coordinator is exactly the broker topology /
      pub-sub sweet spot: add a new consumer by subscribing, no producer changes. A
      mediator/orchestrator would add needless coupling here.
    ref: "concepts.md#event-driven-architecture-broker-topology"

  - id: arch-dataflow-event-046
    difficulty: advanced
    tags: [pub-sub, tradeoffs, operability]
    question: |
      Which is a real downside of a Publish-Subscribe / Broker style?
    options:
      - "Producers must know every consumer's network address and reconnect when any of them moves"
      - "It cannot fan out to multiple subscribers, delivering each message to just one listener"
      - "Consumers must always be online, because the broker drops any message with no live subscriber"
      - "Harder delivery/ordering guarantees and debugging across the async boundary, plus the broker becomes critical shared infrastructure"
    answer: 3
    explanation: |
      The decoupling that pub/sub buys comes with weaker delivery/ordering guarantees
      (duplicates, out-of-order), no call stack for debugging, and a broker that becomes
      critical infrastructure to secure, scale, and keep available.
    ref: "concepts.md#publish-subscribe-and-broker"

  - id: arch-dataflow-event-047
    difficulty: expert
    tags: [scenario, lambda-vs-kappa, decision]
    question: |
      A team already ingests everything into a long-retention Kafka log and their stream
      logic can also satisfy historical needs via replay. They want to avoid maintaining
      duplicate batch and speed logic. Which architecture should they choose?
    options:
      - "Lambda Architecture"
      - "Kappa Architecture"
      - "Batch Sequential"
      - "Pipe-and-Filter"
    answer: 1
    explanation: |
      Kappa fits: a single stream codebase with reprocessing via log replay removes
      Lambda's dual code paths. Lambda would be preferred mainly when heavy ad-hoc
      historical/OLAP analytics dominate.
    ref: "concepts.md#kappa-architecture"

  - id: arch-dataflow-event-048
    difficulty: expert
    tags: [ilities, mapping, review]
    question: |
      Match the style to the -ility it most optimizes: which pairing is CORRECT?
    options:
      - "Batch Processing → sub-second latency"
      - "EDA broker topology → centralized workflow control"
      - "Pipe-and-Filter → strong global consistency"
      - "Event Sourcing → auditability/reconstructability"
    answer: 3
    explanation: |
      Event Sourcing optimizes auditability and reconstructability (full history, replay).
      Batch optimizes throughput not latency; broker topology optimizes extensibility not
      central control; Pipe-and-Filter optimizes modularity not global consistency.
    ref: "concepts.md#event-sourcing"

  - id: arch-dataflow-event-049
    difficulty: intermediate
    tags: [pattern-vs-style, taxonomy]
    question: |
      Which of the following is best described as a *whole-application style* rather than
      a composable pattern used inside a larger style?
    options:
      - "CQRS"
      - "Publish-Subscribe"
      - "Lambda Architecture"
      - "Event Sourcing"
    answer: 2
    explanation: |
      Lambda (like Batch/Stream Processing and Kappa) is a whole-application
      data-processing architecture. CQRS, Pub/Sub, and Event Sourcing are commonly
      composable patterns dropped inside a larger style.
    ref: "concepts.md#lambda-architecture"

  - id: arch-dataflow-event-050
    difficulty: intermediate
    tags: [esb, mediator, integration]
    question: |
      Where does an Enterprise Service Bus (ESB) / integration hub fit among these
      styles?
    options:
      - "It is a distinct data-flow style unrelated to EDA, closer to batch pipeline processing"
      - "It is a form of Event Sourcing that persists every routed message as an immutable event log"
      - "It is a concrete instance of the mediator topology (a central coordinator with workflow logic)"
      - "It is the same as a point-to-point queue that delivers each message to exactly one endpoint"
    answer: 2
    explanation: |
      An ESB is a central coordinator that holds routing/workflow logic — i.e., an
      instance of the mediator topology (and a place where 'smart pipe, dumb endpoints'
      over-centralization can become an anti-pattern).
    ref: "concepts.md#event-driven-architecture-mediator-topology"

  - id: arch-dataflow-event-051
    difficulty: intermediate
    tags: [primary-replica, cqrs, contrast]
    question: |
      A Primary-Replica setup scales reads by adding replicas. Why is that not the
      same as CQRS?
    options:
      - "Replicas serve a different query-shaped model, while CQRS just copies the identical write schema"
      - "CQRS cannot scale reads at all and only isolates the command path to speed up writes"
      - "They are identical techniques, differing only in whether the copies sit on the same host"
      - "Replicas serve the same schema for read scaling; CQRS introduces a distinct, query-optimized read model that can differ from the write model"
    answer: 3
    explanation: |
      Read replicas replicate the identical schema to spread read load; CQRS deliberately
      uses a different, denormalized read model, independently designed and scaled from
      the write side.
    ref: "concepts.md#cqrs"

  - id: arch-dataflow-event-052
    difficulty: advanced
    tags: [scenario, reactive, concurrency]
    question: |
      An API gateway must sustain tens of thousands of long-lived, I/O-bound connections
      under bursty load with few threads. Which style is the natural fit?
    options:
      - "Batch Sequential, buffering connections and processing them step by step on a schedule"
      - "Event Sourcing, persisting each connection's activity as an append-only log of events"
      - "Lambda Architecture, splitting connection handling across a batch and a speed layer"
      - "Reactive Architecture (non-blocking, message-driven, backpressured)"
    answer: 3
    explanation: |
      Reactive's non-blocking I/O lets a handful of threads service many connections, with
      backpressure and failure isolation providing resilience/elasticity under bursts —
      exactly a gateway/streaming-API profile.
    ref: "concepts.md#reactive-architecture"
