topic: 'Serverless Architecture: Lambda, Step Functions and Event-Driven Design'
domain: system-design
topic_slug: aws-serverless-lambda-stepfunctions
version: 1
questions:
- id: aws-serverless-lambda-stepfunctions-001
  difficulty: beginner
  tags:
  - serverless-first
  - fundamentals
  question: |
    What does "scale to zero" mean as a core benefit of a serverless-first
    architecture on AWS?
  options:
  - When there is no traffic you provision no capacity and pay effectively nothing for compute
  - The service automatically deletes your code when unused to reclaim storage
  - The maximum concurrency is capped at zero until you raise a support ticket
  - Requests are dropped to zero latency by caching everything at the edge
  answer: 0
  explanation: |
    Scale-to-zero means idle workloads incur (near) zero compute cost because no
    servers run when there is no work. It is a defining serverless advantage.
    The others describe deletion, quotas, and caching, which are unrelated.
  ref: 'concepts.md#serverless-first-architecture-and-when-it-wins-or-loses'
- id: aws-serverless-lambda-stepfunctions-002
  difficulty: beginner
  tags:
  - lambda
  - limits
  question: |
    What is the maximum execution timeout for a single AWS Lambda invocation?
  options:
  - 5 minutes
  - 1 hour
  - 15 minutes
  - There is no limit
  answer: 2
  explanation: |
    Lambda has a hard 15-minute (900 s) timeout. Work that legitimately needs
    longer must move to Fargate/ECS/Batch or be broken into steps (often
    orchestrated by Step Functions). 5 minutes is the Step Functions Express
    limit, not Lambda's.
  ref: 'concepts.md#lambda-execution-model-cold-starts-and-mitigation'
- id: aws-serverless-lambda-stepfunctions-003
  difficulty: beginner
  tags:
  - lambda
  - cold-start
  question: |
    What is a Lambda "cold start"?
  options:
  - The first request after a deployment, which always fails before the new code is validated
  - A function that has exhausted its reserved concurrency pool and is being throttled
  - An invocation billed at a higher per-request rate because the runtime was idle
  - An invocation that must first initialize a new execution environment before running your handler
  answer: 3
  explanation: |
    A cold start is any invocation that pays the INIT phase (start runtime, load
    code, run static init) because no warm environment is available. It is not a
    failure, a concurrency error, or a pricing tier.
  ref: 'concepts.md#lambda-execution-model-cold-starts-and-mitigation'
- id: aws-serverless-lambda-stepfunctions-004
  difficulty: beginner
  tags:
  - api-gateway
  - timeout
  question: |
    What is the classic default integration timeout for Amazon API Gateway that
    serverless APIs are traditionally designed around?
  options:
  - 3 seconds
  - 29 seconds
  - 10 seconds
  - 5 minutes
  answer: 1
  explanation: |
    API Gateway's well-known integration timeout is 29 seconds; longer requests
    must be made asynchronous. (REST APIs can now raise this via quota increase,
    but 29 s is the value interviewers expect you to design around.)
  ref: 'concepts.md#lambda-triggers-and-event-sources-poll-versus-push'
- id: aws-serverless-lambda-stepfunctions-005
  difficulty: beginner
  tags:
  - messaging
  - sns
  - fan-out
  question: |
    Which AWS service is a publish/subscribe service designed to fan a single
    message out to many subscribers?
  options:
  - Amazon SNS
  - Amazon SQS
  - Amazon Kinesis Data Streams
  - AWS Step Functions
  answer: 0
  explanation: |
    SNS is pub/sub push: one publish fans out to many subscribers (SQS, Lambda,
    HTTP, email). SQS is a queue consumed by one logical consumer, Kinesis is an
    ordered stream, and Step Functions is workflow orchestration.
  ref: 'concepts.md#fan-out-fan-in-and-messaging-service-selection'
- id: aws-serverless-lambda-stepfunctions-006
  difficulty: beginner
  tags:
  - dynamodb
  - limits
  question: |
    What is the maximum size of a single item in Amazon DynamoDB?
  options:
  - 64 KB
  - 256 KB
  - 400 KB
  - 1 MB
  answer: 2
  explanation: |
    A DynamoDB item is capped at 400 KB. Larger blobs should be stored in S3 with
    a pointer in the item (claim-check). 256 KB is the SQS/SNS/EventBridge message
    limit, and 1 MB is the Kinesis record limit.
  ref: 'concepts.md#serverless-data-stores-dynamodb-and-aurora-serverless'
- id: aws-serverless-lambda-stepfunctions-007
  difficulty: beginner
  tags:
  - step-functions
  - fundamentals
  question: |
    What is AWS Step Functions primarily used for?
  options:
  - Storing large binary objects durably across multiple Availability Zones with versioning
  - Caching database reads at microsecond latency to shield the backing store from load
  - Routing HTTP requests to the nearest edge location to minimize round-trip latency
  - Orchestrating multiple steps into a managed state-machine workflow with built-in retry and error handling
  answer: 3
  explanation: |
    Step Functions is a managed workflow/state-machine service that coordinates
    steps (Lambda, SDK integrations, etc.) with declarative retry, catch, parallel,
    and map. The others describe S3, DAX, and CloudFront/edge respectively.
  ref: 'concepts.md#step-functions-standard-versus-express-and-orchestration'
- id: aws-serverless-lambda-stepfunctions-008
  difficulty: beginner
  tags:
  - messaging
  - sqs
  - dlq
  question: |
    What is a dead-letter queue (DLQ) used for in serverless messaging?
  options:
  - To store messages that have been successfully processed so they can be replayed for audit
  - To capture messages or events that repeatedly fail processing so they can be inspected later
  - To increase the throughput of the main queue by offloading a portion of the polling work
  - To deliver messages in strict FIFO order once the main queue drops its ordering guarantee
  answer: 1
  explanation: |
    A DLQ isolates poison/failed messages after retries are exhausted so the main
    pipeline is not blocked and failures can be investigated/replayed. It is not
    for successes, throughput, or ordering.
  ref: 'concepts.md#error-handling-retries-dlq-and-idempotency'
- id: aws-serverless-lambda-stepfunctions-009
  difficulty: beginner
  tags:
  - lambda
  - concurrency
  question: |
    In Lambda, "concurrency" measures which of the following?
  options:
  - The number of invocations executing at the same instant
  - The number of requests per second the function receives
  - The total number of invocations per month
  - The memory allocated to each invocation
  answer: 0
  explanation: |
    Concurrency is the number of in-flight executions at a moment, not a rate.
    By Little's Law it approximates request_rate x average_duration. RPS and
    monthly totals are rates/volumes; memory is a separate setting.
  ref: 'concepts.md#concurrency-and-scaling-reserved-versus-provisioned-concurrency'
- id: aws-serverless-lambda-stepfunctions-010
  difficulty: beginner
  tags:
  - messaging
  - limits
  question: |
    What is the maximum message size for Amazon SQS and Amazon SNS?
  options:
  - 64 KB
  - 1 MB
  - 256 KB
  - 10 MB
  answer: 2
  explanation: |
    SQS and SNS messages are limited to 256 KB. For larger payloads use the
    Extended Client library to store the body in S3 and pass a reference
    (claim-check pattern). 1 MB is the Kinesis record limit.
  ref: 'concepts.md#fan-out-fan-in-and-messaging-service-selection'
- id: aws-serverless-lambda-stepfunctions-011
  difficulty: beginner
  tags:
  - observability
  - cloudwatch
  question: |
    Which service provides distributed tracing across multiple Lambda functions
    and AWS services to follow a single request end to end?
  options:
  - Amazon S3
  - AWS Config
  - Amazon Athena
  - AWS X-Ray
  answer: 3
  explanation: |
    X-Ray provides distributed tracing and service maps, essential when a request
    fans across many short-lived functions. S3 is storage, Config tracks resource
    configuration, and Athena queries data in S3.
  ref: 'concepts.md#observability-cost-and-other-trade-offs-at-scale'
- id: aws-serverless-lambda-stepfunctions-012
  difficulty: beginner
  tags:
  - lambda
  - memory
  question: |
    In Lambda, how is CPU power allocated to a function?
  options:
  - You configure vCPUs directly and independently of memory
  - CPU scales proportionally with the memory you allocate
  - Every function always gets exactly one vCPU
  - CPU is fixed at 0.25 vCPU and cannot change
  answer: 1
  explanation: |
    Lambda allocates CPU proportionally to memory; more memory means more CPU
    (up to ~6 vCPUs at 10 GB). You cannot set vCPUs directly. This is why
    increasing memory can make a function finish faster and sometimes cheaper.
  ref: 'concepts.md#lambda-execution-model-cold-starts-and-mitigation'
- id: aws-serverless-lambda-stepfunctions-013
  difficulty: beginner
  tags:
  - serverless-first
  - when-to-use
  question: |
    Which workload is the strongest natural fit for a serverless-first approach?
  options:
  - A nightly batch job and a spiky, low-baseline event-driven pipeline
  - A steady 20,000 requests/second API running 24/7 at constant load
  - A workload requiring a 2-hour single execution
  - A latency-critical service needing custom kernel tuning and GPUs
  answer: 0
  explanation: |
    Spiky, low-baseline, event-driven and batch/cron workloads are the serverless
    sweet spot (pay-per-use, scale to zero). Steady very-high throughput often
    favors containers on cost; 2-hour jobs exceed the 15-min cap; kernel/GPU
    control is a poor Lambda fit.
  ref: 'concepts.md#serverless-first-architecture-and-when-it-wins-or-loses'
- id: aws-serverless-lambda-stepfunctions-014
  difficulty: beginner
  tags:
  - lambda
  - ephemeral-storage
  question: |
    What is the default size of Lambda's /tmp ephemeral storage, and what is its
    maximum configurable size?
  options:
  - Default 128 MB, max 512 MB
  - Default 1 GB, max 1 GB
  - Default 512 MB, max 10,240 MB (10 GB)
  - Default 10 GB, max 10 GB (not configurable)
  answer: 2
  explanation: |
    /tmp defaults to 512 MB and can be increased up to 10 GB. This matters for
    functions that download and process large files locally. The other values are
    incorrect defaults or ranges.
  ref: 'concepts.md#lambda-execution-model-cold-starts-and-mitigation'
- id: aws-serverless-lambda-stepfunctions-015
  difficulty: intermediate
  tags:
  - lambda
  - invocation-types
  - retries
  question: |
    A Lambda is invoked asynchronously by Amazon S3 events. The function throws an
    error on a particular event. What does Lambda do by default?
  options:
  - Immediately sends the event to a DLQ with no retries, since S3 triggers bypass the retry queue
  - Returns the error synchronously to S3, which then retries the original PUT operation up to five times
  - Silently drops the event with no retry and no DLQ, logging only a metric to CloudWatch
  - Retries the invocation (up to 2 more times) with backoff, then routes to a DLQ or on-failure destination
  answer: 3
  explanation: |
    For asynchronous invocation Lambda retries twice (3 attempts total) with
    delays, then sends the event to a configured on-failure destination or DLQ.
    S3 does not receive a synchronous error, and events are not dropped silently
    when a DLQ/destination is configured.
  ref: 'concepts.md#error-handling-retries-dlq-and-idempotency'
- id: aws-serverless-lambda-stepfunctions-016
  difficulty: intermediate
  tags:
  - lambda
  - little-law
  - concurrency
  question: |
    An API serves 500 requests/second and each Lambda invocation averages 100 ms.
    Approximately how much concurrency does this require, and is the default
    1,000-per-region account limit sufficient?
  options:
  - About 5,000 concurrent; exceeds the default limit
  - About 50 concurrent; well within the default limit
  - About 500 concurrent; exactly at the default limit
  - About 5 concurrent; trivially within the default limit
  answer: 1
  explanation: |
    By Little's Law concurrency = rate x duration = 500/s x 0.1 s = 50 concurrent
    executions, comfortably under the default 1,000. Multiplying rate by seconds
    is the key skill; the other options misapply the formula.
  ref: 'concepts.md#concurrency-and-scaling-reserved-versus-provisioned-concurrency'
- id: aws-serverless-lambda-stepfunctions-017
  difficulty: intermediate
  tags:
  - concurrency
  - reserved
  - provisioned
  question: |
    What is the PRIMARY difference between reserved concurrency and provisioned
    concurrency in Lambda?
  options:
  - Reserved concurrency caps/guarantees the maximum concurrent executions; provisioned concurrency pre-initializes
    environments to eliminate cold starts
  - Reserved concurrency pre-warms environments to remove cold starts; provisioned concurrency only caps
    the maximum
  - They are two names for the same feature, differing only in the AWS console labels used
  - Reserved concurrency is billed hourly for the reserved slice; provisioned concurrency is always free
  answer: 0
  explanation: |
    Reserved concurrency partitions the account pool to cap and guarantee a
    function's max concurrency (free). Provisioned concurrency keeps environments
    warm to remove cold starts (paid, always-on). The roles are commonly reversed
    in distractors.
  ref: 'concepts.md#concurrency-and-scaling-reserved-versus-provisioned-concurrency'
- id: aws-serverless-lambda-stepfunctions-018
  difficulty: intermediate
  tags:
  - step-functions
  - standard
  - express
  question: |
    Which statement correctly distinguishes Step Functions Standard from Express
    workflows?
  options:
  - Standard runs up to 5 minutes and is priced per request; Express runs up to 1 year and is priced per
    state transition
  - Both run up to 1 year with identical execution guarantees; only the per-transition pricing differs
  - Standard runs up to 1 year with exactly-once execution priced per state transition; Express runs up
    to 5 minutes with at-least-once execution priced per request and duration
  - Express supports human-approval task tokens that stay open for months; Standard does not support them
  answer: 2
  explanation: |
    Standard: up to 1 year, exactly-once, durable full history, per-transition
    pricing. Express: up to 5 minutes, at-least-once, per-request+duration pricing,
    very high start rate. The other options swap these properties.
  ref: 'concepts.md#step-functions-standard-versus-express-and-orchestration'
- id: aws-serverless-lambda-stepfunctions-019
  difficulty: intermediate
  tags:
  - kinesis
  - limits
  - throughput
  question: |
    What is the ingest capacity of a single Amazon Kinesis Data Streams shard?
  options:
  - 10 MB/s or 10,000 records/s in, and 10 MB/s out
  - 256 KB/s or 300 records/s in, and 1 MB/s out
  - Unlimited, since Kinesis auto-scales shards transparently
  - 1 MB/s or 1,000 records/s in, and 2 MB/s out
  answer: 3
  explanation: |
    Each shard ingests up to 1 MB/s or 1,000 records/s and emits up to 2 MB/s
    (shared across standard consumers). You scale by adding shards. The other
    numbers are incorrect, and on-demand mode auto-scales but per-shard limits
    still frame the model.
  ref: 'concepts.md#fan-out-fan-in-and-messaging-service-selection'
- id: aws-serverless-lambda-stepfunctions-020
  difficulty: intermediate
  tags:
  - sqs
  - fifo
  - limits
  question: |
    What is the throughput ceiling of an SQS FIFO queue (without high-throughput
    mode), and how can it be raised?
  options:
  - 3,000 messages/s, raised only by filing an AWS support ticket
  - 300 messages/s (transactions), raised to 3,000/s with batching
  - Unlimited throughput, exactly the same as an SQS Standard queue
  - 100 messages/s, raised simply by attaching more consumers
  answer: 1
  explanation: |
    SQS FIFO supports 300 messages/s per action, or 3,000/s with batching (10 per
    batch). This ceiling is a classic design trap when you need both ordering and
    high throughput. Standard queues are effectively unlimited; consumers do not
    raise the FIFO cap.
  ref: 'concepts.md#fan-out-fan-in-and-messaging-service-selection'
- id: aws-serverless-lambda-stepfunctions-021
  difficulty: intermediate
  tags:
  - fan-out
  - sns
  - sqs
  - pattern
  question: |
    You must deliver each OrderCreated event to five independent downstream
    services, each with its own retry, buffering, and DLQ, so one slow consumer
    never drops events for the others. Which pattern is best?
  options:
  - Publish to an SNS topic with five SQS subscriptions (one queue per consumer), each with its own DLQ
  - Publish to a single shared SQS queue that all five services poll and compete for messages on
  - Write each event to one Kinesis shard and have all five services read it from the same iterator
  - Invoke all five downstream Lambdas synchronously in a sequential loop from the producer function
  answer: 0
  explanation: |
    SNS-to-SQS fan-out gives each consumer an independent durable buffer with its
    own retry/DLQ and back-pressure. A shared SQS queue is single-consumer;
    Kinesis works but adds shard management and shared read throughput; synchronous
    looping couples the producer to all consumers and loses durability.
  ref: 'concepts.md#fan-out-fan-in-and-messaging-service-selection'
- id: aws-serverless-lambda-stepfunctions-022
  difficulty: intermediate
  tags:
  - lambda
  - poll-vs-push
  - event-source-mapping
  question: |
    Which event source uses a Lambda event source mapping (poll model) rather than
    pushing events to the Invoke API?
  options:
  - Amazon SNS
  - Amazon EventBridge
  - Amazon SQS
  - Amazon S3 events
  answer: 2
  explanation: |
    SQS (and Kinesis, DynamoDB Streams, MSK/Kafka, MQ) are poll-based: the Lambda
    service polls them via an event source mapping and invokes synchronously in
    batches. SNS, EventBridge, and S3 push events asynchronously to Lambda.
  ref: 'concepts.md#lambda-triggers-and-event-sources-poll-versus-push'
- id: aws-serverless-lambda-stepfunctions-023
  difficulty: intermediate
  tags:
  - dynamodb
  - hot-partition
  - limits
  question: |
    A DynamoDB table has plenty of provisioned capacity overall, but writes to one
    specific partition key are being throttled. What is the most likely cause?
  options:
  - The item stored under that key exceeds the 400 KB maximum, so every write to it is rejected
  - The table is running in eventually consistent read mode, which silently rate-limits writes
  - Global tables are replicating those writes back to the same key and colliding with local writes
  - 'A hot partition: a single partition can absorb only about 1,000 WCU (and 3,000 RCU), regardless of
    table-level capacity'
  answer: 3
  explanation: |
    A single physical partition caps at ~3,000 RCU and 1,000 WCU; concentrating
    traffic on one key creates a hot partition and throttling even when table
    capacity is high. Design high-cardinality keys. Item size, read consistency,
    and global tables are unrelated to this symptom.
  ref: 'concepts.md#serverless-data-stores-dynamodb-and-aurora-serverless'
- id: aws-serverless-lambda-stepfunctions-024
  difficulty: intermediate
  tags:
  - idempotency
  - at-least-once
  question: |
    Why is idempotency essential when processing messages from SQS or events from
    SNS/EventBridge?
  options:
  - Because these services guarantee exactly-once delivery, so retries never happen
  - Because they provide at-least-once delivery, so the same message can be delivered and processed more
    than once
  - Because these services deliver every message in strict global total order, so replays reorder work
  - Because message payloads are capped at 256 KB, forcing handlers to re-run on any oversized event
  answer: 1
  explanation: |
    These services are at-least-once: duplicates can and do occur (retries,
    redeliveries). Handlers must be idempotent (dedup keys, conditional writes) so
    reprocessing is harmless. They do not guarantee exactly-once or global
    ordering; the 256 KB limit is unrelated to idempotency.
  ref: 'concepts.md#error-handling-retries-dlq-and-idempotency'
- id: aws-serverless-lambda-stepfunctions-025
  difficulty: intermediate
  tags:
  - step-functions
  - task-token
  - human-approval
  question: |
    You need a workflow to pause until a human approves an order, potentially days
    later, then continue. Which Step Functions capability fits, and which workflow
    type is appropriate?
  options:
  - Standard workflow using the .waitForTaskToken pattern to pause until an external callback resumes
    it
  - Express workflow with a Wait state configured for several days until the approver responds
  - Any workflow type driving a Lambda that sleeps in a loop until the approval finally arrives
  - Express workflow using activity worker polling that keeps the task open for a week of waiting
  answer: 0
  explanation: |
    The callback/task-token pattern (.waitForTaskToken) pauses execution until an
    external system or human calls SendTaskSuccess/Failure. It requires a Standard
    workflow because Express is capped at 5 minutes. A sleeping Lambda would blow
    the 15-min limit and waste money.
  ref: 'concepts.md#step-functions-standard-versus-express-and-orchestration'
- id: aws-serverless-lambda-stepfunctions-026
  difficulty: intermediate
  tags:
  - lambda
  - vpc
  - connections
  - rds
  question: |
    A Lambda function scales to 800 concurrent executions and each opens a
    connection to an Aurora PostgreSQL database, exhausting its connections. What
    is the recommended fix that avoids rearchitecting the database?
  options:
  - Move the Aurora database into the same VPC subnet as Lambda so connections open faster
  - Increase the Lambda timeout to the full 15 minutes so connections have longer to be released
  - Put RDS Proxy in front of the database to pool and multiplex connections (or use the Data API)
  - Switch the database reads to eventually consistent so fewer connections are held open at once
  answer: 2
  explanation: |
    RDS Proxy pools and multiplexes connections so thousands of Lambdas share a
    small pool; the Data API is another connectionless option. Subnet placement,
    timeouts, and read consistency do not address connection exhaustion.
  ref: 'concepts.md#serverless-data-stores-dynamodb-and-aurora-serverless'
- id: aws-serverless-lambda-stepfunctions-027
  difficulty: intermediate
  tags:
  - sqs
  - partial-batch
  - error-handling
  question: |
    A Lambda reads batches of 10 messages from SQS. One message in a batch fails
    but the other nine succeed. How do you avoid reprocessing the nine that
    already succeeded?
  options:
  - Set the event source mapping batch size to 1 so a failure never affects other messages
  - Move the source to a FIFO queue so failed messages are automatically isolated from the rest
  - Increase the queue's visibility timeout so successful messages are not redelivered on failure
  - Enable partial batch response (ReportBatchItemFailures) and return only the failed message IDs
  answer: 3
  explanation: |
    Partial batch response lets the function report only failed message IDs so
    just those return to the queue; the rest are deleted. Batch size 1 works but
    destroys batching efficiency. FIFO and visibility timeout do not solve partial
    failures.
  ref: 'concepts.md#error-handling-retries-dlq-and-idempotency'
- id: aws-serverless-lambda-stepfunctions-028
  difficulty: intermediate
  tags:
  - messaging
  - sqs
  - kinesis
  - selection
  question: |
    For a work queue where tasks are independent, order does not matter, and a
    single consumer group processes them with automatic scaling and DLQ support,
    which service is the simplest, best fit?
  options:
  - Amazon Kinesis Data Streams
  - Amazon SQS Standard
  - Amazon SNS
  - DynamoDB Streams
  answer: 1
  explanation: |
    SQS Standard is purpose-built as a decoupling work queue: nearly unlimited
    throughput, DLQ via redrive, scales pollers, no ordering needed. Kinesis adds
    shard management and ordering you do not need; SNS is pub/sub, not a work
    queue; DynamoDB Streams is for table change capture.
  ref: 'concepts.md#fan-out-fan-in-and-messaging-service-selection'
- id: aws-serverless-lambda-stepfunctions-029
  difficulty: intermediate
  tags:
  - cost
  - step-functions
  - standard
  - express
  question: |
    You will run 50 million short, high-volume, idempotent workflows per day.
    Which Step Functions choice minimizes cost, and why?
  options:
  - Express, because it is priced per request and duration (GB-s), which is far cheaper for high-volume
    short executions
  - Standard, because its per-state-transition pricing is always the cheapest option at very high volume
  - Standard, because Express workflows are hard-capped at 5 seconds and cannot run these jobs at all
  - Either one works; the two workflow types are priced identically so cost is not a deciding factor
  answer: 0
  explanation: |
    Standard charges per state transition, so millions of multi-state executions
    explode in cost. Express charges per request plus duration, which is dramatically
    cheaper for high-volume short workflows. Express's limit is 5 minutes, not 5
    seconds; pricing is not identical.
  ref: 'concepts.md#step-functions-standard-versus-express-and-orchestration'
- id: aws-serverless-lambda-stepfunctions-030
  difficulty: intermediate
  tags:
  - lambda
  - payload
  - limits
  question: |
    What are the request/response payload limits for synchronous versus
    asynchronous Lambda invocation?
  options:
  - 256 KB synchronous, 6 MB asynchronous
  - 1 MB for both
  - 6 MB synchronous, 256 KB asynchronous
  - 10 MB synchronous, 10 MB asynchronous
  answer: 2
  explanation: |
    Synchronous invocation allows 6 MB (combined request+response); asynchronous
    (event) invocation is capped at 256 KB. Exceeding these forces you to use S3
    references. The other values are incorrect.
  ref: 'concepts.md#lambda-triggers-and-event-sources-poll-versus-push'
- id: aws-serverless-lambda-stepfunctions-031
  difficulty: intermediate
  tags:
  - saga
  - choreography
  - orchestration
  question: |
    What is the defining trade-off between choreography and orchestration for
    implementing a saga?
  options:
  - Choreography centralizes control and visibility; orchestration scatters logic across services
  - Only orchestration can implement compensating transactions; choreography has no way to undo a step
  - Choreography guarantees exactly-once delivery of every event, whereas orchestration cannot promise it
  - Choreography is loosely coupled but makes the overall flow hard to see; orchestration centralizes
    visibility and compensation but adds a coordinator
  answer: 3
  explanation: |
    Choreography (events) is loosely coupled and easy to extend but the flow is
    emergent and hard to observe. Orchestration (Step Functions) centralizes state,
    visibility, and compensation at the cost of a coordinator. Both can compensate;
    neither inherently guarantees exactly-once.
  ref: 'concepts.md#choreography-versus-orchestration-and-the-saga-pattern'
- id: aws-serverless-lambda-stepfunctions-032
  difficulty: intermediate
  tags:
  - dynamodb
  - capacity
  - cost
  question: |
    A new feature has unpredictable, spiky traffic and you cannot forecast
    DynamoDB capacity. Which capacity mode is the safest default, and what is the
    trade-off?
  options:
  - Provisioned with no auto scaling; it is the cheapest mode but throttles hard the moment traffic spikes
  - On-demand; scales instantly to traffic with no capacity planning, at a higher per-request price than
    well-tuned provisioned
  - On-demand; it is unconditionally cheaper than provisioned capacity at every scale and traffic pattern
  - Provisioned pinned at maximum capacity around the clock to avoid throttling, whatever the idle cost
  answer: 1
  explanation: |
    On-demand absorbs unpredictable spikes with zero capacity planning but costs
    more per request than well-utilized provisioned+auto-scaling. It is not always
    cheaper; for steady predictable load provisioned wins. Fixed provisioned
    throttles on spikes.
  ref: 'concepts.md#serverless-data-stores-dynamodb-and-aurora-serverless'
- id: aws-serverless-lambda-stepfunctions-033
  difficulty: intermediate
  tags:
  - observability
  - iterator-age
  - streams
  question: |
    Which CloudWatch metric most directly tells you a Lambda consumer is falling
    behind on a Kinesis or DynamoDB stream?
  options:
  - IteratorAge
  - Invocations
  - Throttles
  - ConcurrentExecutions
  answer: 0
  explanation: |
    IteratorAge measures how old the last processed record is; a rising IteratorAge
    means the consumer is not keeping up with the stream. Invocations, Throttles,
    and ConcurrentExecutions are useful but do not directly indicate stream lag.
  ref: 'concepts.md#observability-cost-and-other-trade-offs-at-scale'
- id: aws-serverless-lambda-stepfunctions-034
  difficulty: intermediate
  tags:
  - eventbridge
  - pipes
  - pattern
  question: |
    You currently have a "glue" Lambda that reads from an SQS queue, filters
    messages, lightly enriches them, and forwards them to a Step Functions
    workflow. Which modern AWS feature can often replace that Lambda entirely?
  options:
  - SNS message filtering with per-subscription filter policies applied before forwarding to the target
  - Kinesis Enhanced Fan-Out giving the workflow a dedicated 2 MB/s push stream from the source queue
  - EventBridge Pipes (source, optional filter and enrichment, target)
  - DynamoDB Accelerator (DAX) as an in-line caching layer that filters and enriches messages in transit
  answer: 2
  explanation: |
    EventBridge Pipes connects a source to a target with built-in filtering and
    enrichment, removing point-to-point glue code (less code, less cost). SNS
    filtering only filters pub/sub subscriptions; EFO and DAX are unrelated.
  ref: 'concepts.md#lambda-triggers-and-event-sources-poll-versus-push'
- id: aws-serverless-lambda-stepfunctions-035
  difficulty: intermediate
  tags:
  - lambda
  - cold-start
  - java
  - snapstart
  question: |
    A Java Lambda has multi-second cold starts hurting p99 latency. Which
    mitigation reduces cold starts at no additional per-invocation runtime charge
    by restoring from a pre-initialized snapshot?
  options:
  - Provisioned concurrency, keeping a fixed pool of environments pre-warmed and billed around the clock
  - Increasing the function timeout so the slow initialization has more headroom to finish each time
  - Switching to asynchronous invocation so callers no longer wait through the initialization phase
  - Lambda SnapStart
  answer: 3
  explanation: |
    SnapStart snapshots an initialized environment and restores from it, cutting
    Java cold starts substantially without an extra runtime charge (caveat:
    re-init uniqueness/connections). Provisioned concurrency also works but adds
    always-on cost; timeout and async invocation do not fix cold starts.
  ref: 'concepts.md#lambda-execution-model-cold-starts-and-mitigation'
- id: aws-serverless-lambda-stepfunctions-036
  difficulty: intermediate
  tags:
  - cost
  - lambda
  - estimation
  question: |
    A Lambda uses 512 MB, runs 200 ms per invocation, and is called 100 million
    times per month. Roughly how many GB-seconds of compute does this consume
    (ignoring per-request charges)?
  options:
  - 1 million GB-s
  - 10 million GB-s
  - 100 million GB-s
  - 20,000 GB-s
  answer: 1
  explanation: |
    GB-s = invocations x seconds x GB = 100,000,000 x 0.2 x 0.5 = 10,000,000 GB-s.
    This kind of back-of-envelope drives the serverless-vs-containers cost
    comparison. The other options misapply the arithmetic.
  ref: 'concepts.md#observability-cost-and-other-trade-offs-at-scale'
- id: aws-serverless-lambda-stepfunctions-037
  difficulty: intermediate
  tags:
  - step-functions
  - distributed-map
  - fan-out
  question: |
    You must process millions of objects in an S3 bucket with high parallelism
    inside a Step Functions workflow. Which construct is designed for this?
  options:
  - A Distributed Map state (scales to ~10,000 parallel child executions and iterates over large datasets)
  - A Parallel state with a fixed, statically defined number of branches known at design time
  - A single Lambda with a for-loop that iterates over every S3 object sequentially in one invocation
  - A Wait state that repeatedly polls S3 on a timer until every object has been processed
  answer: 0
  explanation: |
    Distributed Map scales to about 10,000 parallel child executions and can
    iterate over millions of S3 objects, purpose-built for large-scale fan-out.
    Parallel has fixed branches; a single Lambda loop hits the 15-min cap; Wait
    does nothing useful here.
  ref: 'concepts.md#step-functions-standard-versus-express-and-orchestration'
- id: aws-serverless-lambda-stepfunctions-038
  difficulty: intermediate
  tags:
  - lambda
  - package
  - container
  question: |
    What is the maximum size of a Lambda deployment package as a container image
    versus a zip (unzipped)?
  options:
  - Both the container image and the zip package share a single 250 MB unzipped ceiling
  - Container image up to 512 MB; zip up to 50 MB whether zipped or unzipped on disk
  - Container image up to 10 GB; zip up to 250 MB unzipped
  - There is no enforced size limit for either format, only your ECR or S3 storage quota
  answer: 2
  explanation: |
    Container images can be up to 10 GB, while zip packages are limited to 50 MB
    zipped / 250 MB unzipped. Container image support is a common way to ship large
    dependencies (e.g., ML libraries). The other options are incorrect.
  ref: 'concepts.md#lambda-execution-model-cold-starts-and-mitigation'
- id: aws-serverless-lambda-stepfunctions-039
  difficulty: advanced
  tags:
  - kinesis
  - error-handling
  - head-of-line
  question: |
    A Lambda consumes an ordered Kinesis stream. One record consistently fails.
    Without special configuration, what happens, and which settings mitigate it?
  options:
  - The offending record is skipped automatically after the first failure and processing continues, with no configuration needed
  - The whole stream halts across every shard at once, and the only remedy is to double the shard count to route around it
  - The record is routed to a dead-letter queue automatically after exactly 3 failed attempts, just like async invocation
  - The shard is blocked by head-of-line retries until the record expires; mitigate with BisectBatchOnFunctionError,
    MaximumRetryAttempts, MaximumRecordAgeInSeconds, and an on-failure destination
  answer: 3
  explanation: |
    Stream sources retry a failing batch in order, blocking that shard (head-of-line
    blocking) until success or record expiry. You mitigate with batch bisection, a
    retry cap, a record-age cap, and an on-failure destination for failed batch
    metadata. Records are not auto-skipped or auto-DLQ'd by default.
  ref: 'concepts.md#error-handling-retries-dlq-and-idempotency'
- id: aws-serverless-lambda-stepfunctions-040
  difficulty: advanced
  tags:
  - concurrency
  - reserved
  - downstream-protection
  question: |
    Two Lambdas share an account. One (a report generator) can burst to thousands
    of concurrent executions and overwhelms a fragile third-party API, and it also
    starves your customer-facing function of concurrency. What is the best fix?
  options:
  - Add provisioned concurrency to the report generator so its pre-warmed environments absorb the burst without touching the shared pool
  - Set reserved concurrency on the report generator to cap it and protect both the downstream API and
    the shared pool
  - Increase the account-wide concurrency limit via a quota increase so both functions always have headroom during bursts
  - Switch the report generator to synchronous invocation so callers naturally throttle the burst back to a safe rate
  answer: 1
  explanation: |
    Reserved concurrency both caps the report generator (protecting the fragile
    downstream) and carves out/limits its slice so it cannot starve other functions.
    Provisioned concurrency removes cold starts, not overwhelm; raising the limit
    does not cap the offender; invocation type does not bound concurrency.
  ref: 'concepts.md#concurrency-and-scaling-reserved-versus-provisioned-concurrency'
- id: aws-serverless-lambda-stepfunctions-041
  difficulty: advanced
  tags:
  - which-limit-first
  - scaling
  question: |
    A synchronous API on API Gateway plus Lambda plus a single-shard Kinesis
    producer is expected to handle a sudden 5,000 requests/second burst, each
    Lambda call writing one 500 KB record to the Kinesis shard. Which limit does
    this design hit FIRST?
  options:
  - The single Kinesis shard write limit (1 MB/s or 1,000 records/s)
  - The Lambda 15-minute execution timeout, tripped because each write blocks the handler for minutes
  - The DynamoDB 400 KB item limit, since each 500 KB record is rejected as an oversized write
  - The API Gateway 29-second integration timeout at the front of the synchronous request path
  answer: 0
  explanation: |
    One shard accepts only 1 MB/s or 1,000 records/s; 5,000 records/s of 500 KB
    each far exceeds both dimensions, so the shard throttles first. The 15-min
    timeout, DynamoDB item size, and 29 s API timeout are not the binding
    constraint for short writes at this rate.
  ref: 'concepts.md#fan-out-fan-in-and-messaging-service-selection'
- id: aws-serverless-lambda-stepfunctions-042
  difficulty: advanced
  tags:
  - dynamodb
  - global-tables
  - consistency
  question: |
    You deploy DynamoDB global tables across two Regions for active-active writes.
    What consistency model must the application tolerate, and what is the conflict
    resolution?
  options:
  - Strong consistency across Regions enforced by distributed locking on every replicated write
  - Linearizable writes serialized through a single elected primary Region before fan-out
  - Eventual consistency across Regions with last-writer-wins conflict resolution
  - No conflicts are ever possible because each key's writes are physically partitioned by Region
  answer: 2
  explanation: |
    Global tables replicate asynchronously: cross-Region reads are eventually
    consistent and concurrent conflicting writes resolve last-writer-wins. There is
    no cross-Region strong consistency or single-primary serialization, and
    conflicting writes to the same key absolutely can occur.
  ref: 'concepts.md#serverless-data-stores-dynamodb-and-aurora-serverless'
- id: aws-serverless-lambda-stepfunctions-043
  difficulty: advanced
  tags:
  - cost
  - serverless-vs-containers
  - break-even
  question: |
    A backend runs at a steady 3,000 requests/second, 24/7, with each request
    taking 300 ms of CPU. The team debates Lambda vs a Fargate/ECS fleet. What is
    the strongest cost argument here?
  options:
  - Lambda is always cheaper here because you pay only for what you use and never for idle capacity
  - Fargate scales to zero more aggressively than Lambda, so it is strictly cheaper at this steady load
  - Cost is effectively identical between the two; only cold-start latency behavior differs at this scale
  - At steady, high, near-100%-utilization load the per-invocation GB-s cost of Lambda tends to exceed
    an equivalently sized always-on container fleet, so containers likely win on cost
  answer: 3
  explanation: |
    Lambda shines at spiky/low-baseline load; at steady high utilization the
    always-on pricing of containers usually beats per-invocation GB-s. Lambda is not
    always cheaper, Fargate does not scale to zero better than Lambda, and cost is
    not identical.
  ref: 'concepts.md#serverless-first-architecture-and-when-it-wins-or-loses'
- id: aws-serverless-lambda-stepfunctions-044
  difficulty: advanced
  tags:
  - step-functions
  - saga
  - compensation
  question: |
    In an orchestrated saga (Step Functions Standard) for ReserveInventory ->
    ChargePayment -> CreateShipment, ChargePayment fails after inventory was
    reserved. What is the correct design to keep the system consistent?
  options:
  - Retry ChargePayment forever with exponential backoff until the payment provider eventually accepts it
  - Use a Catch on ChargePayment that transitions to a ReleaseInventory compensation state, undoing the
    prior local transaction
  - Roll back all three steps atomically using a distributed two-phase commit coordinated by Step Functions
  - Ignore the failure and let the reserved inventory reconcile itself since the order is eventually consistent
  answer: 1
  explanation: |
    Sagas have no 2PC; each step provides a compensating action. On payment failure
    you run ReleaseInventory to undo the reservation. Infinite retries stall the
    workflow, 2PC is not available across these services, and ignoring the failure
    leaves inventory wrongly reserved.
  ref: 'concepts.md#choreography-versus-orchestration-and-the-saga-pattern'
- id: aws-serverless-lambda-stepfunctions-045
  difficulty: advanced
  tags:
  - lambda
  - burst-scaling
  - throttling
  question: |
    A function normally idle suddenly receives a huge spike requiring 6,000
    concurrent executions instantly. Assuming a sufficiently high account limit,
    what governs how fast Lambda can add capacity, and what happens meanwhile?
  options:
  - Lambda scales at up to ~1,000 new environments per 10 seconds per function; excess invocations are
    throttled (429) or, for async/poll sources, retried/buffered while it ramps
  - Lambda instantly provides unlimited concurrency with no ramp, spinning up all 6,000 environments at once
  - Lambda refuses every invocation with a hard error until provisioned concurrency is explicitly configured first
  - The account concurrency limit is temporarily ignored during a burst so the spike can be served immediately
  answer: 0
  explanation: |
    Lambda ramps at roughly 1,000 new environments per 10 seconds per function;
    demand above the current ceiling is throttled for sync callers and retried or
    buffered for async/poll sources. It is neither instant-unlimited nor a hard
    refusal, and account limits still apply.
  ref: 'concepts.md#concurrency-and-scaling-reserved-versus-provisioned-concurrency'
- id: aws-serverless-lambda-stepfunctions-046
  difficulty: advanced
  tags:
  - idempotency
  - dynamodb
  - powertools
  question: |
    To make an at-least-once Lambda handler idempotent, which approach is the most
    robust and idiomatic on AWS?
  options:
  - Rely on SQS FIFO's built-in 5-minute content-based deduplication to cover every duplicate case indefinitely
  - Set the Lambda event source mapping's retry count to zero so duplicate invocations can never be generated
  - Store an idempotency key (event/message/business id) in DynamoDB with a conditional write and TTL,
    so duplicate invocations are detected and short-circuited
  - Use eventually consistent reads so that concurrent duplicate writes converge and cancel each other out
  answer: 2
  explanation: |
    Recording an idempotency key in DynamoDB via conditional write (as Lambda
    Powertools does) reliably detects and skips duplicates across long windows.
    FIFO dedup only covers a 5-minute window; disabling retries does not prevent
    redeliveries from the source; eventual consistency does not deduplicate.
  ref: 'concepts.md#error-handling-retries-dlq-and-idempotency'
- id: aws-serverless-lambda-stepfunctions-047
  difficulty: advanced
  tags:
  - messaging
  - kinesis
  - enhanced-fan-out
  question: |
    Three independent consumers each need the full throughput of a Kinesis stream
    without competing for the shared 2 MB/s egress. Which feature provides each
    consumer a dedicated 2 MB/s per shard via push?
  options:
  - Standard shared-throughput consumers polling the same 2 MB/s shard egress with GetRecords
  - SNS subscription filtering, giving each consumer its own filtered copy of the shard's records
  - DynamoDB Streams fronting the Kinesis stream to hand each consumer a private change feed
  - Enhanced Fan-Out (dedicated 2 MB/s per consumer per shard)
  answer: 3
  explanation: |
    Enhanced Fan-Out gives each registered consumer a dedicated 2 MB/s per shard
    with push (HTTP/2), eliminating contention among consumers. Standard consumers
    share the 2 MB/s; SNS filtering and DynamoDB Streams are unrelated Kinesis
    egress mechanisms.
  ref: 'concepts.md#fan-out-fan-in-and-messaging-service-selection'
- id: aws-serverless-lambda-stepfunctions-048
  difficulty: advanced
  tags:
  - aurora-serverless
  - scaling
  - trade-offs
  question: |
    A relational, ACID workload with joins has long idle periods punctuated by
    bursts. The team wants to minimize idle cost but keep SQL. What is the best
    option and its key caveat?
  options:
  - DynamoDB single-table design; it supports arbitrary multi-table joins and ad-hoc SQL relational queries
  - Aurora Serverless v2 that scales ACUs with load (and can scale to zero), with the caveat that scaling/resume
    is not instantaneous, adding latency on wake
  - Aurora provisioned at a large fixed instance size, kept running around the clock to avoid any scaling delay
  - Kinesis Data Analytics for the SQL, running the relational OLTP queries directly against the streaming input
  answer: 1
  explanation: |
    Aurora Serverless v2 keeps SQL/ACID/joins while scaling ACUs (and can auto-pause
    to zero), minimizing idle cost; the trade-off is non-instant scale/resume
    latency. DynamoDB does not do arbitrary joins, a large fixed instance defeats
    the idle-cost goal, and Kinesis Data Analytics is stream processing, not an OLTP DB.
  ref: 'concepts.md#serverless-data-stores-dynamodb-and-aurora-serverless'
- id: aws-serverless-lambda-stepfunctions-049
  difficulty: advanced
  tags:
  - lambda
  - statelessness
  - warm-reuse
  question: |
    Which statement about Lambda statelessness and execution-environment reuse is
    correct?
  options:
  - Warm environments may reuse init-scope objects (DB clients, cached config) across invocations, but
    you must not rely on in-memory state for correctness because environments are ephemeral and not sticky
  - You can safely store user session state in memory because the same environment always handles the
    same user
  - Each invocation always gets a brand-new, freshly initialized environment, so warm reuse of clients or cached config is never possible
  - Provisioned concurrency makes environments permanent and stateful, so in-memory data persists reliably across every future invocation
  answer: 0
  explanation: |
    Warm reuse lets you cache clients/config in init scope for performance, but
    environments are ephemeral and not routed per-user, so correctness must never
    depend on in-memory state. Environments are reused (not always new), and
    provisioned concurrency pre-warms but does not make them permanently stateful.
  ref: 'concepts.md#observability-cost-and-other-trade-offs-at-scale'
- id: aws-serverless-lambda-stepfunctions-050
  difficulty: advanced
  tags:
  - sns
  - eventbridge
  - selection
  question: |
    You need content-based routing of events to different targets by rules, a
    schema registry, and the ability to archive and replay events, integrating
    with several SaaS sources. Which service fits best, and what is the trade-off
    vs SNS?
  options:
  - SNS, because its subscription filter policies provide the same rule-based routing, schema registry, and archive/replay as EventBridge
  - SQS, because consumers can subscribe to a queue with content filters that route each message to a different target
  - EventBridge, which adds rule-based routing, schema registry, and archive/replay, at the cost of slightly
    higher latency and lower raw throughput than SNS
  - Kinesis, because it is the only AWS messaging service capable of archiving and replaying past events on demand
  answer: 2
  explanation: |
    EventBridge provides content-based routing, schema registry, SaaS sources, and
    archive/replay; SNS is higher-throughput/lower-latency pub/sub without rule
    routing or replay. SQS does not route by content, and Kinesis is not the only
    replay option (EventBridge archive replays too).
  ref: 'concepts.md#fan-out-fan-in-and-messaging-service-selection'
- id: aws-serverless-lambda-stepfunctions-051
  difficulty: advanced
  tags:
  - step-functions
  - express
  - at-least-once
  question: |
    Your team moves a high-volume pipeline to Step Functions Express and starts
    seeing occasional duplicate side effects. What is the root cause and the fix?
  options:
  - Express guarantees exactly-once execution, so the duplicate side effects must be caused by a bug elsewhere in the pipeline
  - Express workflows perform no retries of any state, so a step can never run twice and this symptom is impossible
  - Switch every state to a Wait state so executions are serialized end to end and duplicates are squeezed out
  - Express is at-least-once, so steps can run more than once; make the steps idempotent
  answer: 3
  explanation: |
    Express workflows are at-least-once (unlike Standard's exactly-once), so a step
    may execute more than once and produce duplicate side effects; the fix is
    idempotent steps. Express does retry, and Wait states do not address duplicate
    execution semantics.
  ref: 'concepts.md#step-functions-standard-versus-express-and-orchestration'
- id: aws-serverless-lambda-stepfunctions-052
  difficulty: advanced
  tags:
  - resilience
  - region
  - multi-region
  question: |
    Which failure does a standard single-Region serverless application (Lambda +
    DynamoDB + API Gateway) NOT automatically tolerate?
  options:
  - Failure of a single Availability Zone within the Region hosting the application
  - Failure of an entire AWS Region
  - A single Lambda execution environment crashing partway through one invocation
  - A transient throttle on one invocation during a brief concurrency spike
  answer: 1
  explanation: |
    Lambda auto-spreads across AZs and retries individual environment failures, so
    AZ loss, a single environment crash, and transient throttles are handled within
    a Region. A full Region outage is not tolerated without explicit multi-Region
    design (global tables, Route 53 failover, replicated buses).
  ref: 'concepts.md#observability-cost-and-other-trade-offs-at-scale'
- id: aws-serverless-lambda-stepfunctions-053
  difficulty: advanced
  tags:
  - sqs
  - back-pressure
  - downstream-protection
  question: |
    A downstream legacy system can process only 50 transactions/second, but your
    Lambda producers can burst far higher. Which design best absorbs bursts without
    overwhelming the downstream?
  options:
  - Buffer with an SQS queue and consume with a Lambda whose event source mapping maximum concurrency
    (or reserved concurrency) is capped to match the downstream's 50 TPS
  - Invoke the downstream synchronously from each producer Lambda
  - Use SNS to push directly to the downstream as fast as possible
  - Write everything to a single Kinesis shard and let it throttle
  answer: 0
  explanation: |
    An SQS buffer plus a consumer with capped concurrency smooths bursts to match
    the downstream's rate (shock absorber). Synchronous calls and SNS push propagate
    the burst; a single Kinesis shard throttles at 1 MB/s or 1,000 rec/s and loses
    the controlled-drain property.
  ref: 'concepts.md#error-handling-retries-dlq-and-idempotency'
- id: aws-serverless-lambda-stepfunctions-054
  difficulty: advanced
  tags:
  - lambda
  - provisioned-concurrency
  - cost
  question: |
    An endpoint needs consistently low p99 with no cold starts, but traffic follows
    a strong daily pattern (busy 9-5, idle overnight). What is the most cost-aware
    way to use provisioned concurrency?
  options:
  - Set a single high fixed provisioned concurrency value and leave it running 24/7 to guarantee warmth at all times
  - Use reserved concurrency instead of provisioned, since reserving a slice of the pool also keeps environments pre-warmed
  - Use Application Auto Scaling to schedule provisioned concurrency up during business hours and down
    overnight
  - Disable provisioned concurrency entirely and rely on Lambda's on-demand burst scaling to meet the daytime p99 target
  answer: 2
  explanation: |
    Scheduling provisioned concurrency with Application Auto Scaling matches
    pre-warmed capacity to the daily pattern, avoiding paying for idle overnight
    warmth. A fixed 24/7 setting wastes money at night; reserved concurrency does
    not remove cold starts; burst scaling leaves cold-start latency.
  ref: 'concepts.md#lambda-execution-model-cold-starts-and-mitigation'
- id: aws-serverless-lambda-stepfunctions-055
  difficulty: advanced
  tags:
  - cost
  - step-functions
  - chatty
  question: |
    A Step Functions Standard workflow with 12 states runs 20 million times per
    month and costs are surprisingly high. What is the most likely driver and a
    reasonable remedy?
  options:
  - Lambda GB-s from the 12 functions dominates the bill; migrate those Lambdas onto an always-on EC2 fleet
    to cut compute cost
  - S3 storage of retained execution history dominates the charge; delete old executions and shorten the
    history retention window
  - API Gateway per-request charges dominate at 20M calls; add an API Gateway cache to collapse repeat
    requests and lower cost
  - Per-state-transition pricing (12 x 20M = 240M transitions); move short high-volume workflows to Express
    or reduce state count
  answer: 3
  explanation: |
    Standard charges per state transition, so 12 states x 20M executions is ~240M
    transitions — the dominant cost. Express (priced by duration) or fewer states
    fixes it. The other options misattribute the cost to unrelated services.
  ref: 'concepts.md#step-functions-standard-versus-express-and-orchestration'
- id: aws-serverless-lambda-stepfunctions-056
  difficulty: advanced
  tags:
  - vpc
  - cold-start
  - nat
  question: |
    Which statement about running Lambda inside a VPC is currently accurate?
  options:
  - VPC Lambdas still incur a multi-second ENI-attach penalty on every single cold start, since a fresh
    elastic network interface is provisioned per invocation
  - Since the Hyperplane ENI improvements, VPC cold-start penalties are largely eliminated, but internet-bound
    VPC Lambdas still incur NAT Gateway data-processing charges
  - VPC Lambdas cannot reach the public internet under any circumstances, because the VPC boundary hard-blocks
    all outbound routes including NAT Gateways and VPC endpoints
  - VPC configuration removes the need for security groups, because the subnet's network ACLs alone fully
    govern all inbound and outbound Lambda traffic
  answer: 1
  explanation: |
    The old per-cold-start ENI penalty was largely removed by shared Hyperplane
    ENIs. VPC Lambdas can reach the internet via a NAT Gateway (which adds data
    charges) or VPC endpoints. Security groups still apply.
  ref: 'concepts.md#observability-cost-and-other-trade-offs-at-scale'
- id: aws-serverless-lambda-stepfunctions-057
  difficulty: advanced
  tags:
  - dynamodb
  - streams
  - cdc
  - materialized-view
  question: |
    You need to maintain a search index and an aggregate table whenever items
    change in a DynamoDB table, with ordered per-item change capture. Which
    approach is idiomatic?
  options:
  - Enable DynamoDB Streams and trigger a Lambda (or EventBridge Pipe) that projects changes to the index
    and aggregates, processing records ordered per partition key
  - Poll the entire table every second with a scheduled Lambda, diff results against the last snapshot, and
    project any detected differences to the index and aggregates
  - Publish every write from the application layer to an SNS topic, and have subscribers rebuild the search
    index and aggregate table from those published messages
  - Enable global tables and read from the second Region's replica to reconstruct item-level changes and
    project them into the index and aggregates
  answer: 0
  explanation: |
    DynamoDB Streams captures item-level changes in order per key and drives CDC to
    derived stores via Lambda/Pipes. Polling is wasteful and racy; app-layer SNS
    misses out-of-band writes; global tables replicate data, not a change feed for
    projections.
  ref: 'concepts.md#serverless-data-stores-dynamodb-and-aurora-serverless'
- id: aws-serverless-lambda-stepfunctions-058
  difficulty: advanced
  tags:
  - choreography
  - orchestration
  - hybrid
  question: |
    A large system has many bounded contexts, each with complex internal
    multi-step transactions, that also react to each other's domain events. What is
    the most pragmatic coordination design?
  options:
  - Pure event choreography everywhere, both within and between every bounded context, to maximize decoupling
    and eliminate any central coordinator
  - Pure orchestration with one central Step Functions machine controlling all contexts and driving every
    internal multi-step transaction from a single state machine
  - 'Hybrid: orchestrate the complex transaction inside each bounded context (Step Functions) and choreograph
    between contexts via events (EventBridge)'
  - Synchronous request/response calls between all contexts for every interaction, chaining each internal
    step and cross-context reaction into one blocking request path
  answer: 2
  explanation: |
    Real systems mix styles: orchestrate complex, auditable transactions within a
    context and choreograph loosely between contexts. Pure choreography obscures
    complex flows; a single central orchestrator becomes a coupling monolith;
    synchronous coupling loses resilience and independence.
  ref: 'concepts.md#choreography-versus-orchestration-and-the-saga-pattern'
- id: aws-serverless-lambda-stepfunctions-059
  difficulty: advanced
  tags:
  - lambda
  - destinations
  - async
  question: |
    For asynchronous Lambda invocations, why might you prefer an on-failure
    destination over a traditional DLQ?
  options:
  - Destinations are cheaper because they stream the event straight to the target and never persist any data
    at rest, so you avoid all queue storage charges
  - DLQs are deprecated and no longer supported for async invocations, so destinations are the only remaining
    on-failure mechanism AWS accepts
  - Destinations guarantee exactly-once delivery of the failed event to the target, whereas a DLQ can deliver
    the same failed event more than once
  - Destinations capture full invocation context (request, response, error) and support more targets (SQS,
    SNS, Lambda, EventBridge), including on-success routing
  answer: 3
  explanation: |
    Lambda destinations record richer context and can route both success and
    failure to SQS/SNS/Lambda/EventBridge, unlike a DLQ that only receives the raw
    failed event. DLQs still work (not deprecated), destinations are not free of
    storage, and neither guarantees exactly-once.
  ref: 'concepts.md#error-handling-retries-dlq-and-idempotency'
- id: aws-serverless-lambda-stepfunctions-060
  difficulty: advanced
  tags:
  - api-gateway
  - async
  - long-running
  question: |
    A client calls an API that kicks off work taking about 3 minutes. The
    synchronous path fails at the API Gateway timeout. What is the cleanest
    serverless redesign?
  options:
  - Raise the Lambda timeout to the full 15 minutes and keep the call synchronous, so the handler has room
    to finish the 3-minute job before responding
  - Return 202 immediately (API Gateway starts a Step Functions/SQS-backed async job), then let the client
    poll a status endpoint or receive a callback/webhook
  - Increase the client's HTTP read timeout to 3 minutes so it waits long enough for the synchronous call
    to return the completed result
  - Move the API off Lambda onto a single large EC2 instance so the request thread can block for the full
    3 minutes without hitting a gateway limit
  answer: 1
  explanation: |
    Long work must go asynchronous: accept the request (202), start a Step
    Functions execution or enqueue work, and expose status polling or a callback.
    Raising the Lambda timeout does not bypass the 29 s API timeout, client
    timeouts do not help, and moving to EC2 abandons the pattern unnecessarily.
  ref: 'concepts.md#lambda-triggers-and-event-sources-poll-versus-push'
- id: aws-serverless-lambda-stepfunctions-061
  difficulty: expert
  tags:
  - idempotency
  - exactly-once
  - distributed
  question: |
    An interviewer asks: "Can you achieve true end-to-end exactly-once processing
    with SQS + Lambda?" What is the most precise answer?
  options:
  - No true exactly-once delivery exists in a distributed at-least-once system; you achieve exactly-once
    *effect* by combining at-least-once delivery with idempotent processing (e.g., a dedup key in DynamoDB)
  - Yes, SQS Standard guarantees exactly-once delivery natively, so a Lambda consumer never sees the same
    message twice and no extra deduplication is required
  - Yes, by disabling retries on the event source mapping the message is delivered exactly one time, since
    the source can no longer redeliver it after a failure
  - Only SQS FIFO with high-throughput mode gives exactly-once processing across unlimited time windows,
    deduplicating every message no matter how far apart the duplicates arrive
  answer: 0
  explanation: |
    Distributed messaging is at-least-once; exactly-once *effect* comes from
    idempotent processing on top of at-least-once delivery. SQS Standard is not
    exactly-once, disabling retries does not prevent source redeliveries, and FIFO
    dedup covers only a 5-minute window, not unlimited.
  ref: 'concepts.md#error-handling-retries-dlq-and-idempotency'
- id: aws-serverless-lambda-stepfunctions-062
  difficulty: expert
  tags:
  - concurrency
  - provisioned
  - reserved
  - interaction
  question: |
    A function has reserved concurrency of 100 and provisioned concurrency of 40.
    Traffic drives 120 concurrent requests. What happens?
  options:
  - All 120 run concurrently; reserved concurrency is only an advisory hint that Lambda ignores whenever
    live demand exceeds the reserved value
  - Only 40 run on the provisioned environments; every request above the provisioned-concurrency value is
    rejected outright, and the reserved cap of 100 is never reached
  - 40 run on pre-warmed environments (no cold start), 60 more run as cold-started spillover up to the
    reserved cap of 100, and the remaining 20 are throttled
  - All 120 run warm because provisioned concurrency auto-scales instantly to match demand, spinning up
    80 extra pre-initialized environments on the fly
  answer: 2
  explanation: |
    Provisioned concurrency (40) serves the first 40 warm; up to the reserved cap
    (100) the next 60 run as on-demand cold starts; requests beyond 100 are
    throttled. Reserved concurrency is a hard cap (not advisory), spillover above
    provisioned is allowed up to reserved, and provisioned does not auto-scale
    instantly to arbitrary demand.
  ref: 'concepts.md#concurrency-and-scaling-reserved-versus-provisioned-concurrency'
- id: aws-serverless-lambda-stepfunctions-063
  difficulty: expert
  tags:
  - ordering
  - fifo
  - throughput
  - design
  question: |
    A payments pipeline requires strict per-account ordering AND must sustain
    100,000 messages/second aggregate. A single SQS FIFO queue caps at 3,000/s with
    batching. What is the best design?
  options:
  - Use a single SQS FIFO queue and accept the 3,000/s throughput ceiling, since strict ordering makes
    horizontal scaling impossible for this pipeline
  - Use SQS Standard for its unlimited throughput and re-sort messages by timestamp in the consumer to
    reconstruct strict per-account ordering after delivery
  - Use SNS, which delivers messages to each subscription in strict publish order, giving per-account
    ordering at unlimited fan-out throughput
  - Partition by account into many message-group IDs across FIFO queues (or use Kinesis with account as
    the partition key so ordering is per shard), scaling horizontally while preserving per-account order
  answer: 3
  explanation: |
    Ordering is only needed per account, so shard by account: many FIFO message
    groups (throughput scales with group count) or Kinesis partitioned by account
    (ordering per shard) sustains high aggregate throughput while keeping per-account
    order. A single FIFO queue caps out; Standard cannot guarantee order;
    SNS does not order by subscription.
  ref: 'concepts.md#fan-out-fan-in-and-messaging-service-selection'
- id: aws-serverless-lambda-stepfunctions-064
  difficulty: expert
  tags:
  - step-functions
  - sync-express
  - api
  question: |
    Inside a single synchronous API request (must return within seconds), you want
    to orchestrate 4 short steps with built-in retry/catch and get the result
    inline. Which is the best fit?
  options:
  - Step Functions Standard invoked with StartExecution, then repeatedly poll DescribeExecution from the
    request handler until the workflow finishes and return its output
  - Step Functions Express in Synchronous mode (StartSyncExecution), which runs the workflow and returns
    the result inline within the request
  - A single monolithic Lambda with hand-written try/catch and manual retry loops wrapping all four steps
    to reproduce the orchestration inline
  - SQS with four chained queues, one per step, draining the final queue's output back to the caller within
    the synchronous request
  answer: 1
  explanation: |
    Synchronous Express (StartSyncExecution) runs a short workflow and returns the
    result inline, ideal within a request needing orchestration semantics. Standard
    is async (poll/callback), a monolithic Lambda loses declarative retry/catch and
    visibility, and chained queues make it asynchronous.
  ref: 'concepts.md#step-functions-standard-versus-express-and-orchestration'
- id: aws-serverless-lambda-stepfunctions-065
  difficulty: expert
  tags:
  - cost
  - provisioned-concurrency
  - break-even
  question: |
    A latency-critical function would need provisioned concurrency of 500 kept warm
    24/7 to meet p99, and it runs at near-constant high load. What should a senior
    engineer conclude?
  options:
  - Keeping 500 environments warm 24/7 at constant high load erodes serverless cost advantages, so a container
    fleet (ECS/EKS/Fargate) may be simpler and cheaper — evaluate the break-even
  - Provisioned concurrency at 500 is always the right serverless choice here, because pre-warmed environments
    are the only way any architecture can meet a strict p99 target
  - Switch to reserved concurrency instead, which keeps the same 500 environments pre-warmed at no extra
    charge and therefore meets the p99 target for free
  - Use SnapStart on this Node.js function to make its cold starts disappear entirely, removing the need
    for any provisioned concurrency at all
  answer: 0
  explanation: |
    Large always-on provisioned concurrency at steady high load is effectively an
    always-on fleet with per-invocation pricing on top; containers often win.
    Provisioned concurrency is not always right, reserved concurrency is not warm,
    and SnapStart targets Java/select runtimes (and does not make Node cold starts
    "disappear entirely").
  ref: 'concepts.md#serverless-first-architecture-and-when-it-wins-or-loses'
- id: aws-serverless-lambda-stepfunctions-066
  difficulty: expert
  tags:
  - kinesis
  - parallelization-factor
  - ordering
  question: |
    You raise the Kinesis event source mapping's ParallelizationFactor above 1 to
    increase per-shard Lambda concurrency. What must you understand about ordering?
  options:
  - Ordering is lost entirely across the whole stream, because concurrent batches interleave records from
    every partition key without regard to arrival order
  - ParallelizationFactor has no effect on Lambda concurrency; it only changes the batch window and the
    number of records fetched per GetRecords call
  - Lambda still processes records in order per partition key within a shard, but you now have multiple
    concurrent batches per shard (up to the factor), each handling a distinct set of partition keys
  - It automatically doubles the number of shards in the stream to create the extra concurrent processors,
    raising the stream's ingest capacity in lockstep
  answer: 2
  explanation: |
    ParallelizationFactor (up to 10) allows multiple concurrent Lambda invocations
    per shard while preserving order per partition key (each concurrent processor
    owns a subset of keys). It does not destroy per-key order, is not a no-op, and
    does not change shard count.
  ref: 'concepts.md#lambda-triggers-and-event-sources-poll-versus-push'
- id: aws-serverless-lambda-stepfunctions-067
  difficulty: expert
  tags:
  - vendor-lock-in
  - architecture
  - trade-offs
  question: |
    A CTO worries that heavy use of Step Functions ASL, DynamoDB, and EventBridge
    creates vendor lock-in. What is the most balanced senior perspective?
  options:
  - Avoid all managed services and self-host every component on EC2 to stay fully portable, accepting the
    extra operational burden as the correct price of zero lock-in
  - Lock-in is irrelevant because AWS never changes pricing or deprecates APIs, so a proprietary-service
    architecture carries no long-term switching risk at all
  - Kubernetes eliminates cloud lock-in entirely and at no added cost, so porting the whole stack onto it
    removes any dependence on AWS-specific services
  - Some lock-in is the price of the managed value; mitigate by isolating business logic (hexagonal/ports-and-adapters)
    behind interfaces, using IaC, and consciously choosing where proprietary depth is worth it
  answer: 3
  explanation: |
    The mature view accepts intentional lock-in for value and reduces switching cost
    by isolating domain logic from provider-specific handlers and using IaC.
    Self-hosting everything sacrifices the benefits, lock-in is not irrelevant, and
    Kubernetes carries its own operational cost and does not remove all coupling.
  ref: 'concepts.md#observability-cost-and-other-trade-offs-at-scale'
- id: aws-serverless-lambda-stepfunctions-068
  difficulty: expert
  tags:
  - which-limit-first
  - dynamodb
  - concurrency
  question: |
    A viral event drives 20,000 requests/second to a Lambda that does a single
    strongly consistent read of one popular DynamoDB item (the same partition key).
    Which limit is hit FIRST?
  options:
  - The Lambda 15-minute execution timeout, tripped because 20,000 concurrent reads queue behind one another
    and each handler blocks for minutes waiting its turn
  - The DynamoDB single-partition read ceiling (~3,000 RCU), causing a hot-partition throttle on that
    key
  - The 6 MB synchronous invocation payload limit, exceeded because the single popular item's response body
    is duplicated across all 20,000 concurrent reads
  - The SQS 256 KB message limit, hit because each strongly consistent read is internally buffered through
    an SQS queue before the item is returned
  answer: 1
  explanation: |
    All reads hit one partition key; a single partition serves ~3,000 RCU (strongly
    consistent reads cost more per read), so 20,000 rps to one key throttles on the
    hot partition long before other limits. Timeout, payload, and SQS limits are
    irrelevant to this read pattern.
  ref: 'concepts.md#serverless-data-stores-dynamodb-and-aurora-serverless'
- id: aws-serverless-lambda-stepfunctions-069
  difficulty: expert
  tags:
  - observability
  - distributed-tracing
  - correlation
  question: |
    A single user request fans across API Gateway, three Lambdas, an SQS queue, and
    a Step Functions workflow, and something is intermittently slow. Why is
    observability harder here and what is the essential practice?
  options:
  - There is no single host or process; you need distributed tracing (X-Ray) plus propagated correlation
    IDs and structured logging so one request can be reconstructed across many short-lived, distributed
    components
  - It is not actually harder; SSH into the single host handling the request and tail its logs exactly as
    you would debug a slow monolith
  - Just increase every Lambda's memory allocation, which raises log verbosity and clarifies where the
    intermittent slowness is occurring across components
  - Disable retries on all the components so each request produces exactly one linear trace, keeping the
    end-to-end picture simple enough to read by hand
  answer: 0
  explanation: |
    Serverless has no long-lived host to inspect and work is fragmented across
    many ephemeral components, so you must stitch a request together with
    distributed tracing and correlation IDs. Monolith-style log tailing does not
    apply, memory does not clarify traces, and disabling retries harms reliability.
  ref: 'concepts.md#observability-cost-and-other-trade-offs-at-scale'
- id: aws-serverless-lambda-stepfunctions-070
  difficulty: expert
  tags:
  - memory-tuning
  - cost
  - performance
  question: |
    Counterintuitively, increasing a CPU-bound Lambda's memory from 512 MB to
    1,024 MB sometimes REDUCES total cost. Why?
  options:
  - Because Lambda applies a per-GB-second volume discount at higher memory tiers, so the 1,024 MB rate is
    billed at a lower unit price than the 512 MB rate
  - Because configuring 1,024 MB or more waives Lambda's per-request charge, and it is those per-request
    fees rather than duration that dominate this function's bill
  - Because more memory grants more CPU, so the function finishes in roughly half the time; GB-s (memory
    x duration) can stay flat or drop while latency improves
  - Because raising the memory setting automatically relocates the function to a cheaper AWS Region with
    lower GB-second rates for the same workload
  answer: 2
  explanation: |
    CPU scales with memory, so a CPU-bound function may run about twice as fast at
    double memory; since cost is memory x duration, GB-s can hold steady or fall
    while latency drops (validate with Lambda Power Tuning). There is no memory-tier
    discount, no per-request waiver, and no Region change.
  ref: 'concepts.md#lambda-execution-model-cold-starts-and-mitigation'
- id: aws-serverless-lambda-stepfunctions-071
  difficulty: expert
  tags:
  - when-serverless-loses
  - throughput
  - design-judgment
  question: |
    Which scenario is the WEAKEST fit for Lambda and most clearly argues for
    containers or EC2 instead?
  options:
  - A cron job that runs for just 30 seconds once an hour and sits completely idle the rest of the time,
    making a long-lived container mostly wasted capacity
  - A latency-tolerant image-thumbnail pipeline triggered by sporadic, bursty S3 uploads that would leave
    an always-on fleet idle between batches
  - An event-driven notification fan-out with spiky, low-baseline traffic that scales to zero between spikes
    and would strand a provisioned container most of the day
  - A CPU-heavy service at steady 90% utilization all day that also holds a large in-memory model loaded
    once and reused across requests
  answer: 3
  explanation: |
    Steady high utilization (per-invocation pricing loses to always-on) combined
    with a large in-memory model (statelessness/reload cost fights you) is the
    classic anti-serverless case, favoring long-lived containers/EC2. The cron job,
    sporadic S3 pipeline, and spiky fan-out are ideal serverless fits.
  ref: 'concepts.md#trade-offs-and-when-to-use-what'
- id: aws-serverless-lambda-stepfunctions-072
  difficulty: expert
  tags:
  - saga
  - choreography
  - failure-visibility
  question: |
    Your team implemented an order saga via pure event choreography across six
    services. In production, a subset of orders get "stuck" in inconsistent states
    and no one can tell where. Which trade-off did the team underweight, and what
    is a reasonable remediation?
  options:
  - They underweighted event throughput; the orders stall because the shared stream is saturated, so add
    more Kinesis shards to clear the backlog and unstick them
  - They underweighted the poor end-to-end visibility of choreography; introduce an orchestrator (Step
    Functions) for the transaction so state, compensation, and stuck steps are observable in one place
  - They underweighted event payload size; the stuck orders carry events above the 256 KB limit, so compress
    each event under 256 KB to let the saga complete
  - They underweighted cold-start latency; slow function starts time out mid-saga, so add provisioned
    concurrency to keep every step warm and prevent the stuck states
  answer: 1
  explanation: |
    Choreography's emergent flow makes failures hard to locate and compensations
    scattered; introducing orchestration centralizes state, compensation, and
    visibility, directly addressing "stuck, invisible" transactions. Throughput,
    payload size, and cold starts do not explain lost end-to-end visibility.
  ref: 'concepts.md#choreography-versus-orchestration-and-the-saga-pattern'
