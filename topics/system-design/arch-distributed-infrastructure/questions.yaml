topic: "Distributed & Infrastructure Architectures"
domain: system-design
topic_slug: arch-distributed-infrastructure
version: 1
questions:
  - id: arch-distributed-infrastructure-001
    difficulty: beginner
    tags: [altitude, design-patterns, styles]
    question: |
      What distinguishes a system-level architectural *style* (e.g.
      microservices) from an object-level design pattern (e.g. Repository)?
    options:
      - "Styles structure the whole system's deployment topology; design patterns structure objects inside one deployable unit"
      - "Design patterns apply only inside monoliths, while architectural styles apply exclusively to microservice deployments"
      - "Architectural styles are tied to one specific programming language, whereas design patterns are entirely language-agnostic"
      - "There is no real difference between them; the two terms are fully interchangeable and describe the same concept"
    answer: 0
    explanation: |
      They live at different altitudes. An architectural style is about how the
      whole application is partitioned across processes/nodes and deployed; a
      design pattern (GoF/enterprise) structures classes/objects inside a single
      deployable. A microservice can internally use Repository, Factory, etc.
    ref: "concepts.md#common-follow-up-questions"

  - id: arch-distributed-infrastructure-002
    difficulty: beginner
    tags: [client-server, n-tier, tiers]
    question: |
      In a classic 3-tier web deployment, what are the three tiers?
    options:
      - "Caching layer, message queue, and database"
      - "Producer, message broker, and consumer"
      - "Frontend, backend, and CDN edge network"
      - "Client, application/business logic, and data"
    answer: 3
    explanation: |
      3-tier separates presentation (client), application/business logic (app
      server), and data (database) across process/host boundaries. The other
      lists mix in optional components or describe messaging topologies.
    ref: "concepts.md#client-server-and-n-tier"

  - id: arch-distributed-infrastructure-003
    difficulty: intermediate
    tags: [client-server, layering, altitude]
    question: |
      Why is "N-tier deployment" not the same as "layered logical architecture"?
    options:
      - "Layered architecture is a cloud-only concept that cannot be applied to on-premises single-host deployments"
      - "N-tier deployment can only be achieved by first adopting microservices, whereas layered architecture cannot"
      - "N-tier describes physical process/host boundaries, while layers are logical code organization that can all run in one process"
      - "They are identical concepts, so the terms tier and layer are exact synonyms used interchangeably"
    answer: 2
    explanation: |
      Tiers are physical deployment boundaries; layers (presentation/business/
      persistence) are logical code organization. A layered monolith can run on
      one host — one tier, several layers.
    ref: "concepts.md#client-server-and-n-tier"

  - id: arch-distributed-infrastructure-004
    difficulty: beginner
    tags: [client-server, thin-client, thick-client]
    question: |
      Compared to a thick client, a thin client (e.g. a browser app):
    options:
      - "Pushes more computation to the server and relies more on the network"
      - "Does more of its computation locally and therefore needs less network"
      - "Runs fully offline and cannot connect to a backend server at all"
      - "Removes the need for a separate data tier by storing all state itself"
    answer: 0
    explanation: |
      A thin client offloads compute to the server (more network traffic, easier
      central control/updates); a thick client does local compute (less network,
      richer offline, harder to update).
    ref: "concepts.md#client-server-and-n-tier"

  - id: arch-distributed-infrastructure-005
    difficulty: intermediate
    tags: [client-server, single-point-of-failure, scalability]
    question: |
      What is the primary architectural weakness of a pure client-server style?
    options:
      - "Clients are fundamentally unable to cache any data locally between requests"
      - "It is architecturally incompatible with relational databases and requires NoSQL"
      - "The central server/data tier is a scaling bottleneck and single point of failure"
      - "It structurally forbids adding more clients through horizontal scaling"
    answer: 2
    explanation: |
      The authoritative central tier becomes the bottleneck and SPOF; a busy
      server throttles all clients. That is exactly the pain that P2P and
      partitioned styles set out to remove.
    ref: "concepts.md#client-server-and-n-tier"

  - id: arch-distributed-infrastructure-006
    difficulty: beginner
    tags: [p2p, topology]
    question: |
      In a peer-to-peer (P2P) architecture, each node:
    options:
      - "Acts strictly as a client, only ever requesting resources from others"
      - "Acts strictly as a server, only ever responding to requests from others"
      - "Acts as both client and server (a servent)"
      - "Must route all of its traffic through a single central broker intermediary"
    answer: 2
    explanation: |
      Every peer is simultaneously client and server, with no central authority —
      the inverse of client-server. Routing through a central intermediary would
      be the Broker style, not P2P.
    ref: "concepts.md#peer-to-peer-p2p"

  - id: arch-distributed-infrastructure-007
    difficulty: advanced
    tags: [p2p, dht, lookup]
    question: |
      A structured P2P network built on a DHT (e.g. Chord or Kademlia) primarily
      improves which property over an unstructured (Gnutella-style) network?
    options:
      - "Content lookup: O(log N) hops with a correctness guarantee instead of flooding"
      - "Stronger cross-peer transactional consistency with ACID guarantees on every write"
      - "Automatic elimination of NAT-traversal problems for peers behind home routers"
      - "Guaranteed protection against Sybil attacks by capping each peer's identities"
    answer: 0
    explanation: |
      DHTs give efficient, guaranteed key lookup (typically O(log N) hops), unlike
      unstructured flooding/random-walk searches that may miss rare items. They do
      not by themselves solve consistency, NAT, or Sybil resistance.
    ref: "concepts.md#peer-to-peer-p2p"

  - id: arch-distributed-infrastructure-008
    difficulty: intermediate
    tags: [p2p, trade-offs, consistency]
    question: |
      Which is a fundamental challenge inherent to P2P architectures?
    options:
      - "Hitting vertical scaling ceilings on one oversized central server"
      - "Excessive reliance on a central enterprise service bus for all routing"
      - "A structural inability to share files or content between participants"
      - "Consistency, discovery, and trust/security with no central authority"
    answer: 3
    explanation: |
      Removing the central authority buys scalability and resilience but makes
      consistency, peer discovery, and trust/security genuinely hard. Vertical
      ceilings and ESB reliance are properties of centralized styles.
    ref: "concepts.md#peer-to-peer-p2p"

  - id: arch-distributed-infrastructure-009
    difficulty: beginner
    tags: [microservices, independent-deployability]
    question: |
      What is the single defining property of a microservices architecture?
    options:
      - "Every service must be written in a different programming language from its peers"
      - "All services read from and write to one shared central database"
      - "Services are independently deployable"
      - "Services communicate only by routing through a central enterprise service bus"
    answer: 2
    explanation: |
      Independent deployability is the defining trait, enabled by
      database-per-service. Language heterogeneity is possible but not required;
      sharing a DB or routing through an ESB works against independence.
    ref: "concepts.md#microservices"

  - id: arch-distributed-infrastructure-010
    difficulty: intermediate
    tags: [microservices, database-per-service, distributed-monolith]
    question: |
      Several "microservices" all read and write the same shared database. What
      have you most likely built?
    options:
      - "A well-designed event-driven system with fully decoupled consumers"
      - "A space-based architecture backed by a replicated in-memory data grid"
      - "A distributed monolith"
      - "A service mesh managing all traffic through injected sidecar proxies"
    answer: 2
    explanation: |
      Sharing a database couples services so they must change/deploy in lock-step
      — the distributed monolith: microservices' operational cost with none of the
      independence benefit.
    ref: "concepts.md#microservices"

  - id: arch-distributed-infrastructure-011
    difficulty: intermediate
    tags: [microservices, cross-reference]
    question: |
      For deep coverage of bounded contexts and how to choose service boundaries,
      which topic should you consult?
    options:
      - "caching-and-cdn"
      - "aws-serverless-lambda-stepfunctions"
      - "consensus-clocks-and-time"
      - "microservices-ddd-and-boundaries"
    answer: 3
    explanation: |
      Boundary-setting via DDD (bounded contexts, aggregates) is the deep-dive
      topic microservices-ddd-and-boundaries. This arch topic only gives the
      style-level overview and points there.
    ref: "concepts.md#microservices"

  - id: arch-distributed-infrastructure-012
    difficulty: advanced
    tags: [microservices, soa, comparison]
    question: |
      "Smart endpoints, dumb pipes" most directly contrasts microservices with
      which style?
    options:
      - "Peer-to-peer, with its fully symmetric servent nodes and no coordinator"
      - "Space-based architecture, with its replicated in-memory processing units"
      - "Service-Oriented Architecture (SOA) with its smart ESB"
      - "Classic client-server, with a thin client talking to a central server tier"
    answer: 2
    explanation: |
      Microservices keep logic in the services and use lightweight ("dumb") pipes,
      versus SOA's "smart pipe" ESB that centralizes routing, transformation, and
      orchestration.
    ref: "concepts.md#microservices"

  - id: arch-distributed-infrastructure-013
    difficulty: intermediate
    tags: [microservices, ilities, trade-offs]
    question: |
      Adopting microservices most directly optimizes which characteristic, at the
      cost of which other?
    options:
      - "Optimizes deployability/scalability; costs operational simplicity and cross-service consistency"
      - "Optimizes strong cross-service consistency, at the direct cost of horizontal scalability"
      - "Optimizes end-to-end low latency, at the direct cost of independent deployability"
      - "Optimizes overall operational simplicity, at the direct cost of per-team autonomy"
    answer: 0
    explanation: |
      Microservices buy independent deployability and per-service scaling, paying
      with heavy operational complexity (network, observability, CI/CD) and
      eventual consistency across services.
    ref: "concepts.md#microservices"

  - id: arch-distributed-infrastructure-014
    difficulty: intermediate
    tags: [soa, esb]
    question: |
      What is the central mediating component of a classic SOA?
    options:
      - "A sidecar proxy deployed alongside each service instance"
      - "A distributed hash table spread across symmetric peer nodes"
      - "An in-memory data grid replicating state across processing units"
      - "An Enterprise Service Bus (ESB)"
    answer: 3
    explanation: |
      The ESB provides routing, transformation, protocol bridging, and
      orchestration between coarse-grained enterprise services. Sidecars belong to
      service mesh, DHTs to P2P, data grids to space-based.
    ref: "concepts.md#service-oriented-architecture-soa"

  - id: arch-distributed-infrastructure-015
    difficulty: advanced
    tags: [soa, coupling, canonical-model]
    question: |
      Which SOA characteristic most contributes to tight coupling and slow
      change compared to microservices?
    options:
      - "Database-per-service isolation with no shared schema between services"
      - "Ephemeral scale-to-zero functions billed per individual invocation"
      - "Sidecar proxies deployed on every node to handle L7 traffic"
      - "A shared canonical data model plus a centralized ESB"
    answer: 3
    explanation: |
      A shared canonical model couples services to one schema, and the ESB
      centralizes logic — both make independent change hard. Database-per-service,
      sidecars, and scale-to-zero belong to other styles.
    ref: "concepts.md#service-oriented-architecture-soa"

  - id: arch-distributed-infrastructure-016
    difficulty: intermediate
    tags: [soa, when-to-use]
    question: |
      SOA is the best fit primarily when you need to:
    options:
      - "Integrate many pre-existing heterogeneous enterprise systems under central governance"
      - "Run small stateless functions that are billed per invocation and scale to zero when idle"
      - "Contain fault blast radius by partitioning the whole stack across independent cells"
      - "Serve extreme, spiky concurrent load by keeping the working set in replicated in-memory data"
    answer: 0
    explanation: |
      SOA shines at enterprise-wide reuse and integration of heterogeneous systems
      behind standard contracts with central governance. The other options
      describe serverless, cell-based, and space-based respectively.
    ref: "concepts.md#service-oriented-architecture-soa"

  - id: arch-distributed-infrastructure-017
    difficulty: beginner
    tags: [serverless, faas, definition]
    question: |
      A FaaS (Functions-as-a-Service) function is best described as:
    options:
      - "A long-running stateful process that you provision, scale, and patch yourself"
      - "A central bus that routes and transforms enterprise messages between services"
      - "A stateless, event-triggered, ephemeral function run on managed infrastructure"
      - "A browser-side UI fragment owned and independently deployed by one team"
    answer: 2
    explanation: |
      FaaS runs small, stateless, event-triggered, ephemeral functions on managed
      infra with automatic scaling (including scale-to-zero). The other options
      describe VMs, an ESB, and micro-frontends.
    ref: "concepts.md#serverless-and-faas"

  - id: arch-distributed-infrastructure-018
    difficulty: intermediate
    tags: [serverless, cold-start, trade-offs]
    question: |
      Which is a well-known drawback of serverless/FaaS?
    options:
      - "It is fundamentally unable to scale automatically in response to load"
      - "It always costs more than continuously idle VMs even at very low utilization"
      - "Cold-start latency, execution-time/state limits, and vendor lock-in"
      - "It requires you to manually patch and harden the underlying host OS yourself"
    answer: 2
    explanation: |
      Serverless removes infra ops and scales automatically, but you accept cold
      starts, time/memory limits, forced external state, and proprietary trigger
      lock-in. It is typically cheaper at low/spiky utilization.
    ref: "concepts.md#serverless-and-faas"

  - id: arch-distributed-infrastructure-019
    difficulty: advanced
    tags: [serverless, workload-fit]
    question: |
      For which workload is serverless/FaaS the LEAST cost-effective choice?
    options:
      - "Bursty webhook processing with long idle periods"
      - "Sporadic image-thumbnail generation on upload"
      - "Scheduled nightly ETL batch jobs that idle for the rest of the day"
      - "A steady, high-throughput, latency-sensitive service running 24/7"
    answer: 3
    explanation: |
      Steady high-throughput low-latency traffic keeps functions warm anyway, so
      always-on VMs/containers are often cheaper and avoid cold starts. The other
      workloads are spiky/idle — serverless's sweet spot.
    ref: "concepts.md#serverless-and-faas"

  - id: arch-distributed-infrastructure-020
    difficulty: intermediate
    tags: [serverless, cross-reference]
    question: |
      For the vendor-specific execution model and orchestration of serverless,
      which deep-dive topic does this style point to?
    options:
      - "message-queues-and-async"
      - "databases-sql-nosql-sharding-replication"
      - "aws-serverless-lambda-stepfunctions"
      - "resilience-tradeoffs-deep-dive"
    answer: 2
    explanation: |
      The Lambda execution model and Step Functions orchestration are covered in
      aws-serverless-lambda-stepfunctions; this style gives the vendor-agnostic
      overview and cross-references it.
    ref: "concepts.md#serverless-and-faas"

  - id: arch-distributed-infrastructure-021
    difficulty: intermediate
    tags: [space-based, in-memory-grid]
    question: |
      What is the defining move of a space-based architecture?
    options:
      - "Routing every request through a central message broker that queues and forwards it asynchronously"
      - "Deploying a sidecar proxy next to each service to transparently handle all inter-service traffic"
      - "Splitting the browser UI into independently deployed fragments owned by separate frontend teams"
      - "Removing the central database from the request path using replicated in-memory data"
    answer: 3
    explanation: |
      Space-based keeps the working set in replicated in-memory grids across
      processing units and persists asynchronously, so the database stops being the
      bottleneck under extreme spiky load.
    ref: "concepts.md#space-based-architecture"

  - id: arch-distributed-infrastructure-022
    difficulty: advanced
    tags: [space-based, middleware, grids]
    question: |
      In space-based architecture, which of the four middleware "grids" is
      responsible for replicating in-memory data across processing units?
    options:
      - "The data grid"
      - "The messaging grid"
      - "The deployment grid"
      - "The processing grid"
    answer: 0
    explanation: |
      The data grid replicates in-memory state (the heart of the style). The
      messaging grid routes requests, the processing grid coordinates multi-PU
      requests, and the deployment grid starts/stops PUs for elasticity.
    ref: "concepts.md#space-based-architecture"

  - id: arch-distributed-infrastructure-023
    difficulty: advanced
    tags: [space-based, trade-offs, durability]
    question: |
      What is the key risk of space-based architecture's asynchronous
      write-behind to the backing database?
    options:
      - "Every request synchronously blocks on a durable disk write before returning to the caller"
      - "Potential data loss if grid nodes fail before persistence, plus eventual consistency"
      - "The in-memory grid caps out at a single processing unit and cannot scale horizontally"
      - "It mandates strong ACID transactions across every processing unit on each write"
    answer: 1
    explanation: |
      Because persistence is asynchronous, data held only in memory can be lost if
      nodes fail before write-behind completes, and readers may see eventually
      consistent state. That is the price of removing the DB from the hot path.
    ref: "concepts.md#space-based-architecture"

  - id: arch-distributed-infrastructure-024
    difficulty: intermediate
    tags: [space-based, workload-fit]
    question: |
      Space-based architecture is most appropriate for which scenario?
    options:
      - "A financial ledger requiring strong per-write durability with synchronous commit to disk"
      - "Extreme, unpredictable, high-volume concurrent load (e.g. ticketing, bidding)"
      - "A small internal CRUD admin tool with a handful of users and light, predictable traffic"
      - "Integrating many legacy mainframe systems under central enterprise governance and contracts"
    answer: 1
    explanation: |
      Its near-linear elastic scale and in-memory speed target extreme concurrent
      spiky workloads. Strong-durability ledgers, tiny apps, and enterprise
      integration are poor fits (space-based, respectively too risky/overkill/wrong
      style).
    ref: "concepts.md#space-based-architecture"

  - id: arch-distributed-infrastructure-025
    difficulty: beginner
    tags: [broker, decoupling]
    question: |
      The Broker architectural style primarily provides:
    options:
      - "Synchronous request/response with the lowest possible latency and no intermediary hops"
      - "Strong ACID transactions spanning every producer and consumer in a single distributed commit"
      - "Elimination of any central infrastructure by having peers address each other directly"
      - "Decoupling of senders and receivers in location and time via an intermediary"
    answer: 3
    explanation: |
      A broker is a central intermediary that decouples producers from consumers in
      both location (no direct addressing) and time (consumers can be offline). It
      is asynchronous, not lowest-latency synchronous.
    ref: "concepts.md#broker-architecture"

  - id: arch-distributed-infrastructure-026
    difficulty: intermediate
    tags: [broker, spof, trade-offs]
    question: |
      A recognized downside of the Broker style is that the broker can become:
    options:
      - "A single point of failure/bottleneck and a source of harder end-to-end tracing"
      - "A thick client that pushes heavy compute and rendering onto the end-user's local machine"
      - "A shared canonical data model that every enterprise service must conform its schema to"
      - "A sidecar proxy co-deployed with each service to intercept its inbound and outbound calls"
    answer: 0
    explanation: |
      Concentrating messaging in the broker risks a SPOF/bottleneck (mitigated by
      clustering) and makes end-to-end tracing harder because flow is indirect. The
      other options belong to unrelated styles.
    ref: "concepts.md#broker-architecture"

  - id: arch-distributed-infrastructure-027
    difficulty: intermediate
    tags: [broker, cross-reference]
    question: |
      Delivery semantics (at-least-once vs exactly-once), ordering, and DLQs for
      the Broker style are deep-dived in which topic?
    options:
      - "dp-distributed-cloud"
      - "message-queues-and-async"
      - "micro-frontends"
      - "aws-caching-elasticache-dax"
    answer: 1
    explanation: |
      message-queues-and-async covers queues vs pub/sub, delivery guarantees,
      ordering, dead-letter queues, and backpressure. The Broker style here gives
      the topology-level overview and points there.
    ref: "concepts.md#broker-architecture"

  - id: arch-distributed-infrastructure-028
    difficulty: advanced
    tags: [event-driven, topologies, choreography, orchestration]
    question: |
      In Event-Driven Architecture, the broker topology and mediator topology
      differ mainly in that:
    options:
      - "Broker topology mandates HTTP/REST transport, whereas mediator topology mandates binary gRPC calls"
      - "Broker topology is leaderless choreography; mediator topology centrally orchestrates a known workflow"
      - "Broker topology processes events synchronously in-line, whereas mediator topology is fully asynchronous"
      - "Broker topology forbids emitting events at all, whereas mediator topology requires an event on every step"
    answer: 1
    explanation: |
      Broker topology = choreography (no central coordinator, most decoupled,
      harder to trace); mediator topology = orchestration (a central mediator
      drives a known multi-step workflow, easier error handling but a coupling
      point).
    ref: "concepts.md#event-driven-architecture-eda"

  - id: arch-distributed-infrastructure-029
    difficulty: intermediate
    tags: [event-driven, trade-offs, observability]
    question: |
      What do you most notably give up when adopting a heavily event-driven
      architecture?
    options:
      - "The ability to add new consumers without redeploying the event producer each time"
      - "A single, readable end-to-end control flow (making tracing/debugging harder)"
      - "Horizontal scalability, since event consumers can no longer be replicated across nodes"
      - "Asynchronous processing, forcing every event to be handled in a blocking synchronous call"
    answer: 1
    explanation: |
      EDA maximizes decoupling and scalability but replaces one control flow with
      "what reacts to what," so debugging spans many hops and you inherit eventual
      consistency and ordering concerns.
    ref: "concepts.md#event-driven-architecture-eda"

  - id: arch-distributed-infrastructure-030
    difficulty: intermediate
    tags: [event-driven, cross-reference, cqrs, saga]
    question: |
      CQRS, Event Sourcing, Saga, and CDC are deep-dived in which topic rather
      than duplicated in this style overview?
    options:
      - "event-driven-cqrs-saga-cdc"
      - "consensus-clocks-and-time"
      - "caching-and-cdn"
      - "aws-resilience-multiregion-dr"
    answer: 0
    explanation: |
      event-driven-cqrs-saga-cdc covers CQRS, Event Sourcing, Saga (choreography vs
      orchestration), and Change Data Capture. This topic gives the EDA style
      overview and cross-references it.
    ref: "concepts.md#event-driven-architecture-eda"

  - id: arch-distributed-infrastructure-031
    difficulty: advanced
    tags: [broker, event-driven, comparison]
    question: |
      How are the Broker style and Event-Driven Architecture related?
    options:
      - "They are entirely unrelated, since EDA is strictly synchronous request/response messaging"
      - "Broker is the messaging topology/plumbing; EDA is the broader interaction style that can be built on a broker"
      - "EDA is merely a subtype of classic client-server with a thin client and central server tier"
      - "Broker fully replaces EDA as a competing style and the two cannot coexist in one system"
    answer: 1
    explanation: |
      A broker is the intermediary that routes messages; EDA is the broader
      interaction style organized around events. EDA's broker topology uses a
      broker as plumbing; its mediator topology orchestrates.
    ref: "concepts.md#event-driven-architecture-eda"

  - id: arch-distributed-infrastructure-032
    difficulty: intermediate
    tags: [cell-based, blast-radius, bulkhead]
    question: |
      The primary goal of a cell-based architecture is to:
    options:
      - "Minimize request latency by keeping the entire working set in a replicated in-memory grid"
      - "Contain blast radius so a failure affects only one self-contained cell"
      - "Centralize all cross-service routing and orchestration logic in a single enterprise service bus"
      - "Remove the need for any routing layer by letting clients address backend nodes directly"
    answer: 1
    explanation: |
      Cell-based partitions the whole stack into independent, self-contained cells
      each serving a traffic shard, applying the bulkhead principle at fleet scale
      to bound the blast radius of any fault.
    ref: "concepts.md#cell-based-architecture"

  - id: arch-distributed-infrastructure-033
    difficulty: advanced
    tags: [cell-based, sharding, comparison]
    question: |
      How does cell-based architecture differ from ordinary data sharding?
    options:
      - "Sharding partitions data for scale; cell-based partitions the whole stack for fault isolation"
      - "They are identical concepts and the two terms are used interchangeably in practice"
      - "Cell-based partitions only the database layer, whereas sharding partitions only the compute layer"
      - "Sharding requires a service mesh with sidecar proxies to route keys, while cell-based does not"
    answer: 0
    explanation: |
      Sharding splits data to scale it; cell-based replicates the entire topology
      per partition primarily to isolate failure (bounded blast radius), with scale
      as a secondary benefit.
    ref: "concepts.md#cell-based-architecture"

  - id: arch-distributed-infrastructure-034
    difficulty: advanced
    tags: [cell-based, trade-offs, router]
    question: |
      What is a key cost/risk of a cell-based architecture?
    options:
      - "It structurally rules out canary deployments because every cell must upgrade simultaneously"
      - "Routing-layer complexity plus per-cell capacity duplication overhead"
      - "It eliminates fault isolation by funneling all cells through one shared failure domain"
      - "It forces every service across all cells to read and write one shared central database"
    answer: 1
    explanation: |
      You pay in routing/mapping-layer complexity (which must itself be highly
      available or become the SPOF) and duplicated per-cell capacity. In return you
      gain strong fault isolation and safe per-cell (canary) deploys.
    ref: "concepts.md#cell-based-architecture"

  - id: arch-distributed-infrastructure-035
    difficulty: intermediate
    tags: [cell-based, cross-reference]
    question: |
      Blast-radius/bulkhead containment for cell-based designs is expanded in
      which topics?
    options:
      - "dp-enterprise-application and dp-creational"
      - "resilience-tradeoffs-deep-dive and aws-resilience-multiregion-dr"
      - "micro-frontends and service-mesh"
      - "probabilistic-data-structures and caching-and-cdn"
    answer: 1
    explanation: |
      Bulkhead/blast-radius concepts are deep-dived in resilience-tradeoffs-deep-dive
      and aws-resilience-multiregion-dr (cell-based, zonal/regional isolation).
    ref: "concepts.md#cell-based-architecture"

  - id: arch-distributed-infrastructure-036
    difficulty: beginner
    tags: [service-mesh, sidecar]
    question: |
      A service mesh moves which concerns out of application code into
      infrastructure?
    options:
      - "Core business logic and domain data modeling that each service owns internally"
      - "Browser-side UI rendering and component styling handled by the frontend layer"
      - "Cross-cutting network concerns: mTLS, retries, timeouts, load balancing, telemetry"
      - "Database schema migrations and versioning of the persistence layer at deploy time"
    answer: 2
    explanation: |
      A mesh uses sidecar proxies (data plane) plus a control plane to provide
      uniform mTLS, retries/circuit-breaking, load balancing, traffic shifting, and
      observability for service-to-service traffic — without editing app code.
    ref: "concepts.md#service-mesh"

  - id: arch-distributed-infrastructure-037
    difficulty: intermediate
    tags: [service-mesh, trade-offs, latency]
    question: |
      What is the main cost of introducing a service mesh?
    options:
      - "It strips out all distributed tracing and metrics, forcing each team to bolt on its own observability tooling"
      - "A sidecar proxy per instance adds latency and CPU/memory overhead, plus control-plane operational complexity"
      - "It mandates rewriting every service in one common language before the sidecars will proxy any traffic"
      - "It actively blocks mutual TLS, leaving all service-to-service calls as unencrypted plaintext on the network"
    answer: 1
    explanation: |
      Each call traverses a proxy hop (latency + resource cost), and you must
      operate a control plane. In exchange you get uniform L7 security and
      observability across polyglot services.
    ref: "concepts.md#service-mesh"

  - id: arch-distributed-infrastructure-038
    difficulty: advanced
    tags: [service-mesh, api-gateway, comparison]
    question: |
      How does a service mesh differ from an API gateway?
    options:
      - "A gateway handles east-west service-to-service traffic, while a mesh handles the north-south client-to-system edge traffic"
      - "A gateway handles north-south (client to system) edge traffic; a mesh handles east-west (service to service) internal traffic"
      - "They are precisely the same component, just marketed under two different vendor names for one proxy"
      - "A mesh works exclusively with serverless functions and cannot proxy traffic for long-running containers"
    answer: 1
    explanation: |
      API gateway = north-south edge traffic (client to system); service mesh =
      east-west internal traffic (service to service). They are complementary and
      often used together.
    ref: "concepts.md#service-mesh"

  - id: arch-distributed-infrastructure-039
    difficulty: intermediate
    tags: [service-mesh, cross-reference, sidecar, ambassador]
    question: |
      The Sidecar and Ambassador building blocks a service mesh relies on are
      covered as object/deployment-level patterns in which topic?
    options:
      - "dp-distributed-cloud"
      - "message-queues-and-async"
      - "databases-sql-nosql-sharding-replication"
      - "genai-llm-system-design"
    answer: 0
    explanation: |
      Sidecar and Ambassador are cloud design patterns deep-dived in
      dp-distributed-cloud. The service mesh is the fleet-wide infrastructure style
      built from those patterns.
    ref: "concepts.md#service-mesh"

  - id: arch-distributed-infrastructure-040
    difficulty: beginner
    tags: [micro-frontends, ui]
    question: |
      Micro-frontends apply which idea to the browser/UI?
    options:
      - "Consolidating every screen into one shared frontend monolith released by a single central UI team"
      - "Removing the browser client tier entirely so that all rendering happens purely on the server side"
      - "Routing every UI interaction event through a central enterprise service bus before it reaches the backend"
      - "Extending microservice-style independent deployment to pieces of the UI owned by different teams"
    answer: 3
    explanation: |
      Micro-frontends are the browser-side analog of microservices: independently
      developed/deployed UI fragments (often vertical slices) composed by a shell
      app, so multiple teams ship UI independently.
    ref: "concepts.md#micro-frontends"

  - id: arch-distributed-infrastructure-041
    difficulty: intermediate
    tags: [micro-frontends, trade-offs, performance]
    question: |
      A notable downside of micro-frontends is:
    options:
      - "They make each UI fragment impossible to deploy without redeploying the entire shell application"
      - "Bundle duplication (multiple framework copies) and UX/consistency governance overhead"
      - "They require every UI fragment to read and write through one single shared backend database"
      - "They eliminate team autonomy by forcing every fragment onto one central mandated release train"
    answer: 1
    explanation: |
      Independent fragments can ship duplicate framework bundles (payload/perf cost)
      and drift in look-and-feel without a shared design system, plus runtime
      integration complexity. Team autonomy is the benefit, not the cost.
    ref: "concepts.md#micro-frontends"

  - id: arch-distributed-infrastructure-042
    difficulty: intermediate
    tags: [micro-frontends, when-to-avoid]
    question: |
      When are micro-frontends usually NOT worth it?
    options:
      - "When many teams contend on one large frontend and UI releases are the bottleneck"
      - "When a single small UI team owns the whole app (a modular SPA is simpler)"
      - "When you want to incrementally migrate a frontend monolith"
      - "When teams need to choose frameworks independently"
    answer: 1
    explanation: |
      For a single small team, a modular SPA is simpler and avoids bundle
      duplication and integration complexity. The other cases are exactly when
      micro-frontends pay off.
    ref: "concepts.md#micro-frontends"

  - id: arch-distributed-infrastructure-043
    difficulty: intermediate
    tags: [distributed-monolith, anti-pattern]
    question: |
      Why is the "distributed monolith" considered the worst outcome of a
      microservices attempt?
    options:
      - "It delivers noticeably better runtime performance than a plain monolith while still trailing true microservices"
      - "You pay the full operational/network tax of microservices while keeping lock-step, shared-database coupling"
      - "It is structurally incapable of being deployed to any public cloud and must run only on-premises"
      - "It structurally forbids the use of any messaging or asynchronous communication between services"
    answer: 1
    explanation: |
      A distributed monolith combines the costs of both worlds: microservices'
      operational and network overhead plus a monolith's tight coupling (lock-step
      deploys, shared DB) — costs of both, benefits of neither.
    ref: "concepts.md#styles-mentioned-in-passing"

  - id: arch-distributed-infrastructure-044
    difficulty: intermediate
    tags: [primary-replica, leader-follower, inclusive-language]
    question: |
      In a primary-replica compute topology, the primary node's role is to:
    options:
      - "Serve only read traffic while every incoming write is forwarded to the replica nodes"
      - "Act as a purely stateless function that holds no data and simply proxies each request"
      - "Coordinate/accept writes, while replicas scale reads and provide failover"
      - "Route and load-balance all client traffic exactly like an edge API gateway would"
    answer: 2
    explanation: |
      The primary accepts writes and coordinates; replicas scale reads and stand by
      for failover. (This is the topology historically called master-slave; the
      inclusive term primary-replica is used everywhere.)
    ref: "concepts.md#styles-mentioned-in-passing"

  - id: arch-distributed-infrastructure-045
    difficulty: intermediate
    tags: [grid-computing, shared-nothing, cross-reference]
    question: |
      The shared-nothing principle behind grid/cluster (MapReduce-style)
      computing most directly underpins which other technique?
    options:
      - "Sidecar proxy injection for service meshes"
      - "Database sharding and big-data processing"
      - "Cold-start latency tuning in FaaS platforms"
      - "Canonical shared data models in classic SOA"
    answer: 1
    explanation: |
      Shared-nothing — independent nodes with no shared state — underpins horizontal
      sharding (databases-sql-nosql-sharding-replication) and big-data pipelines
      (design-web-crawler-data-processing, analytics/EMR).
    ref: "concepts.md#styles-mentioned-in-passing"

  - id: arch-distributed-infrastructure-046
    difficulty: beginner
    tags: [edge-computing, latency]
    question: |
      Edge/fog computing primarily aims to:
    options:
      - "Centralize all compute into one single cloud region for easier central management"
      - "Push compute/data closer to users/devices to cut latency and backhaul"
      - "Replace every backing database with replicated in-memory data grids"
      - "Eliminate the need for any control plane by fully centralizing all coordination"
    answer: 1
    explanation: |
      Edge/fog moves compute and data nearer to users/devices, reducing latency and
      backhaul traffic. Deep dives: aws-iot-edge-computing and CDN edge in
      caching-and-cdn.
    ref: "concepts.md#styles-mentioned-in-passing"

  - id: arch-distributed-infrastructure-047
    difficulty: advanced
    tags: [comparison-matrix, coupling, scalability]
    question: |
      On the comparison matrix, which style is characterized by "no central
      coupling (symmetric nodes)" but "weak/eventual consistency"?
    options:
      - "Client-server"
      - "SOA"
      - "Peer-to-peer"
      - "Service mesh"
    answer: 2
    explanation: |
      P2P has symmetric nodes and no central coupling, scaling with participants,
      but pays in weak/eventual consistency and coordination difficulty. Client-server
      is tightly coupled; SOA is coupled via shared model+bus.
    ref: "concepts.md#comparison-matrix"

  - id: arch-distributed-infrastructure-048
    difficulty: advanced
    tags: [scenario, event-driven, selection]
    question: |
      A retailer wants many independent teams to react to an "Order Placed" fact
      (inventory, payments, notifications, analytics) and add new reactions later
      without touching the producer. Which style fits best?
    options:
      - "Client-server 3-tier"
      - "Space-based architecture"
      - "Peer-to-peer DHT"
      - "Event-driven architecture"
    answer: 3
    explanation: |
      Emitting an event that multiple independent consumers react to — with new
      consumers added later without changing the producer — is the core value of
      EDA. The others don't provide that decoupled fan-out reaction model.
    ref: "concepts.md#event-driven-architecture-eda"

  - id: arch-distributed-infrastructure-049
    difficulty: advanced
    tags: [scenario, cell-based, selection]
    question: |
      A mission-critical multi-tenant SaaS must guarantee that a poison request or
      overload from one set of tenants cannot take down the whole fleet. Which
      style most directly addresses this?
    options:
      - "Micro-frontends"
      - "Serverless/FaaS"
      - "Cell-based architecture"
      - "Client-server"
    answer: 2
    explanation: |
      Bounding correlated failure to a fraction of tenants is exactly the
      blast-radius containment (bulkhead) that cell-based architecture provides via
      independent self-contained cells behind a router.
    ref: "concepts.md#cell-based-architecture"

  - id: arch-distributed-infrastructure-050
    difficulty: advanced
    tags: [scenario, service-mesh, selection]
    question: |
      A large polyglot microservice fleet needs consistent mutual TLS, retries,
      and distributed tracing without rewriting each service in every language.
      Which style is designed for this?
    options:
      - "Service mesh"
      - "Space-based architecture"
      - "SOA with an ESB"
      - "Micro-frontends"
    answer: 0
    explanation: |
      A service mesh injects sidecar proxies to provide uniform mTLS, retries, and
      telemetry across languages via a control plane — no per-service, per-language
      code changes. An ESB centralizes app-level integration, not transparent L7
      transport concerns.
    ref: "concepts.md#service-mesh"

  - id: arch-distributed-infrastructure-051
    difficulty: intermediate
    tags: [scenario, client-server, selection]
    question: |
      A small team is building an internal line-of-business web app with modest
      traffic and strong consistency needs. Which style is the sensible default?
    options:
      - "Peer-to-peer, with symmetric servent nodes and no central coordinator"
      - "A client-server / 3-tier deployment (likely a modular monolith app tier)"
      - "Cell-based architecture, partitioning the whole fleet into isolated cells"
      - "Space-based architecture built on a replicated in-memory data grid"
    answer: 1
    explanation: |
      For modest scale and strong consistency with a small team, a straightforward
      client-server 3-tier deployment is simplest and cheapest. The other styles add
      complexity that this workload does not justify.
    ref: "concepts.md#client-server-and-n-tier"

  - id: arch-distributed-infrastructure-052
    difficulty: advanced
    tags: [ilities, comparison, selection]
    question: |
      Which style most directly optimizes availability/fault-isolation as its
      primary characteristic (rather than raw scalability or low latency)?
    options:
      - "Space-based architecture"
      - "Cell-based architecture"
      - "Serverless/FaaS"
      - "Peer-to-peer"
    answer: 1
    explanation: |
      Cell-based is chosen primarily for availability and fault isolation (bounded
      blast radius). Space-based optimizes scalability/performance, serverless
      optimizes elasticity/cost, and P2P optimizes scale-with-peers.
    ref: "concepts.md#comparison-matrix"

  - id: arch-distributed-infrastructure-053
    difficulty: expert
    tags: [soa, microservices, distributed-monolith, comparison]
    question: |
      An "SOA-style" system uses fine-grained services but forces them to share a
      canonical database schema and deploy together every release. Architecturally,
      this is best labeled:
    options:
      - "A textbook microservices architecture with fully independent per-service databases"
      - "A space-based architecture backed by a replicated in-memory data grid"
      - "A pure peer-to-peer system of symmetric nodes with no central authority"
      - "A distributed monolith (fine services with lock-step, shared-data coupling)"
    answer: 3
    explanation: |
      Fine-grained services that nonetheless share data and deploy in lock-step have
      the operational cost of microservices with monolithic coupling — the
      distributed monolith anti-pattern, usually caused by poor boundaries.
    ref: "concepts.md#styles-mentioned-in-passing"

  - id: arch-distributed-infrastructure-054
    difficulty: expert
    tags: [serverless, event-driven, comparison]
    question: |
      Which statement most accurately relates serverless/FaaS to event-driven
      architecture?
    options:
      - "They are exact synonyms describing precisely the same thing, so the runtime model and the interaction style are fully interchangeable terms"
      - "Serverless is a runtime/deployment model that is often event-triggered; EDA is the broader interaction style, and functions are one way to implement event consumers"
      - "EDA can only ever be built using serverless functions, so an event-driven system is impossible without a FaaS platform"
      - "Serverless functions structurally forbid event triggers and can only be invoked by a direct synchronous HTTP request"
    answer: 1
    explanation: |
      Serverless is about how/where code runs (ephemeral functions on managed infra,
      often event-triggered); EDA is the broader style of communicating via events.
      Functions are one common way to implement EDA consumers, but neither implies
      the other.
    ref: "concepts.md#serverless-and-faas"

  - id: arch-distributed-infrastructure-055
    difficulty: expert
    tags: [p2p, cross-reference, consensus]
    question: |
      A blockchain applies P2P plus consensus so a leaderless network agrees on an
      append-only ledger. For the consensus mechanics (leader election, ordering,
      logical clocks), which topic is the deep dive?
    options:
      - "consensus-clocks-and-time"
      - "caching-and-cdn"
      - "micro-frontends"
      - "dp-enterprise-application"
    answer: 0
    explanation: |
      Consensus algorithms, leader election, and logical/physical clocks are
      deep-dived in consensus-clocks-and-time. The P2P style here only notes the
      blockchain linkage and points there.
    ref: "concepts.md#peer-to-peer-p2p"
