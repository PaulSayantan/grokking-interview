topic: Migration and Modernization Strategies on AWS
domain: system-design
topic_slug: aws-migration-modernization
version: 1
questions:
- id: aws-migration-modernization-001
  difficulty: beginner
  tags:
  - 7-rs
  - rehost
  - fundamentals
  question: |
    Which of the 7 Rs describes moving an application to EC2 "as-is" with no
    code changes, prioritizing speed of migration over cloud-native benefits?
  options:
  - Rehost (lift-and-shift)
  - Refactor
  - Repurchase
  - Retire
  answer: 0
  explanation: |
    Rehost = lift-and-shift: move as-is to EC2, no code change, fastest exit and
    lowest project risk but least cloud-native benefit. Refactor is a rewrite;
    repurchase is switching to a SaaS/COTS product; retire is shutting it off.
  ref: "concepts.md#the-7-rs-retire-retain-rehost-relocate-repurchase-replatform-refactor"
- id: aws-migration-modernization-002
  difficulty: beginner
  tags:
  - 7-rs
  - retire
  question: |
    During discovery you find roughly 15% of servers have no active users or are
    redundant. Which R applies, and why is it usually addressed first?
  options:
  - Retain — leave them for a later wave
  - Retire — turning them off is the cheapest win and shrinks the migration
  - Refactor — rewrite them for the cloud
  - Relocate — move them at the hypervisor level
  answer: 1
  explanation: |
    Retire (turn it off) is the cheapest win: it removes cost and shrinks the
    scope of everything downstream. Retaining defers value; refactoring/relocating
    dead apps wastes money migrating things nobody uses.
  ref: "concepts.md#the-7-rs-retire-retain-rehost-relocate-repurchase-replatform-refactor"
- id: aws-migration-modernization-003
  difficulty: beginner
  tags:
  - 7-rs
  - replatform
  question: |
    Moving a self-managed MySQL database off an EC2/VM onto Amazon RDS to offload
    patching and backups, without changing the application's core architecture,
    is an example of which R?
  options:
  - Rehost
  - Refactor
  - Replatform (lift-tinker-and-shift)
  - Repurchase
  answer: 2
  explanation: |
    Replatform makes a few targeted optimizations (self-managed DB → managed RDS)
    for modest effort and real ops savings, without a core rewrite. Rehost would
    keep MySQL on an EC2 instance you still manage; refactor is a redesign;
    repurchase is buying a different product.
  ref: "concepts.md#the-7-rs-retire-retain-rehost-relocate-repurchase-replatform-refactor"
- id: aws-migration-modernization-004
  difficulty: beginner
  tags:
  - 7-rs
  - repurchase
  question: |
    A company decides to stop running its self-hosted email/collaboration server
    and adopt a SaaS product instead. Which R is this?
  options:
  - Replatform
  - Relocate
  - Retain
  - Repurchase (drop-and-shop)
  answer: 3
  explanation: |
    Repurchase means replacing the app with a different product, typically SaaS/COTS,
    offloading undifferentiated heavy lifting. Replatform/relocate keep the same
    software; retain leaves it in place.
  ref: "concepts.md#the-7-rs-retire-retain-rehost-relocate-repurchase-replatform-refactor"
- id: aws-migration-modernization-005
  difficulty: intermediate
  tags:
  - 7-rs
  - retain
  - judgment
  question: |
    Which situation is the STRONGEST justification for the "Retain" (revisit) strategy
    rather than migrating an application now?
  options:
  - The application is a simple stateless web tier that scales easily
  - The application is the most-used system in the company
  - A regulatory hold, an imminent end-of-life, or an unready deep dependency makes moving it now high-risk
    or wasteful
  - The team wants to learn serverless
  answer: 2
  explanation: |
    Retain is for apps you deliberately leave for now: regulatory constraints,
    imminent EOL (don't spend migrating something about to be retired), a recent
    hardware investment, or an unready dependency. A simple stateless tier is an
    easy early rehost, not a retain candidate.
  ref: "concepts.md#the-7-rs-retire-retain-rehost-relocate-repurchase-replatform-refactor"
- id: aws-migration-modernization-006
  difficulty: intermediate
  tags:
  - 7-rs
  - relocate
  - vmware
  question: |
    "Relocate" as a migration strategy most specifically refers to:
  options:
  - Rewriting the application as microservices
  - Moving workloads at the hypervisor/container level (e.g. VMware Cloud on AWS) without changing the
    OS or application
  - Replacing the app with SaaS
  - Copying data to S3 with DataSync
  answer: 1
  explanation: |
    Relocate moves at the infrastructure level — e.g. VMware vSphere workloads to
    VMware Cloud on AWS, or containers to a managed container service — with no OS
    or app change, preserving existing operational tooling. It's distinct from
    rehost (onto native EC2) and refactor.
  ref: "concepts.md#the-7-rs-retire-retain-rehost-relocate-repurchase-replatform-refactor"
- id: aws-migration-modernization-007
  difficulty: intermediate
  tags:
  - 7-rs
  - judgment
  - portfolio
  question: |
    A 1,500-server portfolio must exit its data center in 8 months. Leadership asks
    whether to refactor everything to serverless during the move. What is the best
    response?
  options:
  - No — rehost the bulk (MGN) to hit the deadline, retire dead apps, and refactor only a strategic minority
    later
  - Yes — refactor all apps to Lambda to maximize cloud benefit before cutover
  - Retain everything and renew the data-center lease
  - Repurchase every application as SaaS
  answer: 0
  explanation: |
    Refactoring the whole estate is the highest-cost, highest-risk, longest path and
    would blow an 8-month deadline. The pragmatic answer: retire dead apps, rehost the
    bulk fast with MGN in waves, and refactor a strategic minority afterward
    ("migrate first, modernize later").
  ref: "concepts.md#the-7-rs-retire-retain-rehost-relocate-repurchase-replatform-refactor"
- id: aws-migration-modernization-008
  difficulty: advanced
  tags:
  - 7-rs
  - refactor
  - trade-offs
  question: |
    What is the PRIMARY trade-off that makes "Refactor / re-architect" appropriate for
    only a minority of a portfolio rather than the default?
  options:
  - Refactoring cannot use managed services
  - Refactored apps cannot be deployed to AWS
  - It always increases downtime during cutover more than any other R
  - It has the highest cost, longest timeline, and highest risk, even though it yields the greatest long-term
    agility and cloud-native benefits
  answer: 3
  explanation: |
    Refactor delivers the most (independent scaling, pay-per-use, deployment velocity)
    but costs the most in time, money, and risk. You reserve it for high-value apps
    where agility justifies the investment; applying it estate-wide is the classic
    budget/deadline killer.
  ref: "concepts.md#the-7-rs-retire-retain-rehost-relocate-repurchase-replatform-refactor"
- id: aws-migration-modernization-009
  difficulty: advanced
  tags:
  - 7-rs
  - judgment
  - cost
  question: |
    An Oracle database runs on an over-provisioned physical server on-prem. The team
    has 6 months and modest Oracle-to-open-source skills. Which R best balances effort,
    risk, and ops savings for THIS component?
  options:
  - Refactor the schema and app to Aurora PostgreSQL immediately across all apps
  - Replatform to Amazon RDS for Oracle to shed patching/backup toil with minimal app change, deferring
    the heterogeneous conversion
  - Retire the database
  - Rehost Oracle onto a same-size EC2 instance and stop there
  answer: 1
  explanation: |
    Replatform to RDS for Oracle removes undifferentiated ops (patching, backups, HA)
    with little app change and low risk, and lets you right-size. A full heterogeneous
    refactor to PostgreSQL is high-risk given limited skills and time; a bare rehost
    keeps all the self-management toil.
  ref: "concepts.md#the-7-rs-retire-retain-rehost-relocate-repurchase-replatform-refactor"
- id: aws-migration-modernization-010
  difficulty: beginner
  tags:
  - journey
  - phases
  question: |
    In AWS's migration model, which phase involves building the landing zone
    (multi-account foundation), forming a Cloud Center of Excellence, and running a
    small pilot wave before scaling?
  options:
  - Assess
  - Migrate and Modernize
  - Mobilize
  - Retire
  answer: 2
  explanation: |
    Mobilize builds the operational and organizational foundation — landing zone via
    Control Tower/Organizations, migration factory runbooks, a CCoE, skills, and a
    pilot wave. Assess is the earlier TCO/readiness/discovery phase; execution happens
    in Migrate and Modernize.
  ref: "concepts.md#the-migration-journey-mobilize-migrate-modernize"
- id: aws-migration-modernization-011
  difficulty: intermediate
  tags:
  - journey
  - judgment
  question: |
    "Migrate first, modernize later" is most defensible when:
  options:
  - There is a hard deadline (lease expiry, acquisition, licensing cliff) and you need off the old estate
    before optimizing
  - The application is strategic and the team has plenty of schedule slack
  - You have unlimited budget and want the best long-term architecture immediately
  - The application will be retired next month
  answer: 0
  explanation: |
    Migrate-first is the pragmatic path under a hard deadline: rehost to get off the
    old estate, then modernize with breathing room. Modernize-during pays off only for
    strategic apps with slack. If it's about to be retired, don't migrate at all.
  ref: "concepts.md#the-migration-journey-mobilize-migrate-modernize"
- id: aws-migration-modernization-012
  difficulty: beginner
  tags:
  - discovery
  - tooling
  question: |
    Which service discovers on-prem servers, their utilization, and — importantly —
    the network dependencies between them, to help plan migration waves?
  options:
  - AWS Migration Hub Strategy Recommendations
  - AWS Database Migration Service
  - AWS Transfer Family
  - AWS Application Discovery Service
  answer: 3
  explanation: |
    Application Discovery Service (agent-based or agentless collector) captures
    configuration, performance, and inter-server dependencies, which drives dependency
    maps and wave planning. Migration Hub aggregates/tracks; DMS moves databases;
    Transfer Family is a protocol front-end.
  ref: "concepts.md#assessing-and-prioritizing-discovery-portfolio-analysis-and-tco"
- id: aws-migration-modernization-013
  difficulty: beginner
  tags:
  - migration-hub
  - tracking
  question: |
    What is the primary role of AWS Migration Hub in a large migration?
  options:
  - It provides a single pane of glass to track discovery and migration status across tools and Regions
  - It performs block-level replication of servers
  - It converts database schemas
  - It provisions Direct Connect links
  answer: 0
  explanation: |
    Migration Hub is the tracking/aggregation console across tools like MGN and DMS and
    across Regions, and (via Strategy Recommendations) can suggest an R per app. It
    doesn't itself replicate servers or convert schemas.
  ref: "concepts.md#assessing-and-prioritizing-discovery-portfolio-analysis-and-tco"
- id: aws-migration-modernization-014
  difficulty: intermediate
  tags:
  - tco
  - cost
  - trade-offs
  question: |
    An executive claims "moving to AWS will immediately cut our costs." Which is the
    most accurate nuance for a raw lift-and-shift?
  options:
  - Correct — EC2 is always cheaper than on-prem hardware
  - A naive same-size, 24/7 rehost can cost MORE than on-prem until you right-size, adopt auto scaling,
    and buy Savings Plans/Reserved Instances
  - Cloud cost is irrelevant because ingress is free
  - Costs only drop after moving to a different Region
  answer: 1
  explanation: |
    Cloud savings come from right-sizing, turning off idle capacity, elasticity, and
    commitment discounts — not from the raw lift itself. A same-size 24/7 rehost can be
    more expensive until you optimize; hence a post-migration cost-optimization phase.
  ref: "concepts.md#assessing-and-prioritizing-discovery-portfolio-analysis-and-tco"
- id: aws-migration-modernization-015
  difficulty: intermediate
  tags:
  - tco
  - business-case
  question: |
    Which tool is purpose-built to construct the migration business case / TCO model
    (current-state cost baseline vs projected right-sized AWS run cost)?
  options:
  - AWS DataSync
  - AWS Schema Conversion Tool
  - AWS Migration Evaluator
  - AWS Storage Gateway
  answer: 2
  explanation: |
    Migration Evaluator (formerly TSO Logic) builds the TCO business case, including
    right-sizing and projected AWS costs against the current baseline. DataSync moves
    files, SCT converts schemas, Storage Gateway is hybrid storage.
  ref: "concepts.md#assessing-and-prioritizing-discovery-portfolio-analysis-and-tco"
- id: aws-migration-modernization-016
  difficulty: advanced
  tags:
  - wave-planning
  - dependencies
  - trade-offs
  question: |
    Why should tightly-coupled, chatty applications be kept in the SAME migration wave
    rather than split across waves?
  options:
  - To reduce the number of MGN agents required
  - AWS forbids partial migrations of an application
  - It guarantees zero downtime automatically
  - Splitting them leaves one component on-prem and one in AWS, adding WAN latency to every call and incurring
    data-transfer egress charges
  answer: 3
  explanation: |
    A chatty dependency split across the WAN pays network latency per call and egress
    charges, and is fragile during the transition. Keeping coupled components in one
    wave (and one environment) avoids that — a direct consequence of data gravity.
  ref: "concepts.md#assessing-and-prioritizing-discovery-portfolio-analysis-and-tco"
- id: aws-migration-modernization-017
  difficulty: advanced
  tags:
  - wave-planning
  - risk
  - judgment
  question: |
    What is the best rationale for sequencing low-risk, low-dependency applications in
    the earliest migration waves?
  options:
  - They generate the most revenue
  - They are the only apps eligible for MGN
  - They build team confidence and prove the migration-factory runbooks before you tackle complex, high-value
    systems
  - AWS charges less to migrate them first
  answer: 2
  explanation: |
    Early low-risk waves de-risk the program: they validate tooling, runbooks, and the
    landing zone, and build organizational muscle before the crown jewels. Revenue and
    eligibility are not the drivers.
  ref: "concepts.md#assessing-and-prioritizing-discovery-portfolio-analysis-and-tco"
- id: aws-migration-modernization-018
  difficulty: beginner
  tags:
  - mgn
  - rehost
  - tooling
  question: |
    Which AWS service is the current, recommended primary tool for large-scale
    lift-and-shift (rehost) migrations of servers to EC2?
  options:
  - AWS Server Migration Service (SMS)
  - AWS Application Migration Service (MGN)
  - AWS Database Migration Service (DMS)
  - AWS CloudEndure Disaster Recovery
  answer: 1
  explanation: |
    MGN (Application Migration Service) is the primary rehost tool; it succeeded
    CloudEndure Migration and the older SMS. DMS is for databases; CloudEndure DR is a
    DR product, not the general migration recommendation.
  ref: "concepts.md#rehost-with-application-migration-service-mgn"
- id: aws-migration-modernization-019
  difficulty: intermediate
  tags:
  - mgn
  - replication
  - downtime
  question: |
    How does MGN keep cutover downtime short for a rehosted server?
  options:
  - A lightweight agent performs continuous, block-level replication into a low-cost staging area, so
    cutover only needs to launch and validate a production instance from the latest state
  - It requires a full offline copy each time you cut over
  - It converts the server to a Lambda function
  - It ships the disks on a Snowball device
  answer: 0
  explanation: |
    MGN continuously replicates disk blocks into a staging area, keeping the target
    near-synced. Cutover is just launching a production instance from the latest
    replicated state plus validation — seconds-to-minutes RPO and a short RTO.
  ref: "concepts.md#rehost-with-application-migration-service-mgn"
- id: aws-migration-modernization-020
  difficulty: intermediate
  tags:
  - mgn
  - testing
  - cutover
  question: |
    Which MGN capability most directly de-risks a cutover?
  options:
  - Automatic schema conversion
  - Petabyte offline transfer
  - Serverless auto-scaling of the source
  - Launching non-disruptive test instances from replicated data before the real cutover, without impacting
    the source
  answer: 3
  explanation: |
    MGN lets you launch test instances anytime from the replicated data to rehearse and
    validate without touching the running source, so cutover is proven in advance.
    Schema conversion and offline transfer are other tools' jobs.
  ref: "concepts.md#rehost-with-application-migration-service-mgn"
- id: aws-migration-modernization-021
  difficulty: advanced
  tags:
  - mgn
  - trade-offs
  question: |
    What is the PRIMARY trade-off of using MGN for a mass rehost?
  options:
  - It requires rewriting every application to be cloud-native
  - It gives the fastest, lowest-risk migration but you inherit the source's architecture and inefficiencies
    (e.g. paying EC2 for a VM that might belong in a container or managed DB)
  - It cannot migrate Windows servers
  - It always incurs hours of downtime per server
  answer: 1
  explanation: |
    MGN's speed comes from moving the workload as-is, so you carry over the source's
    OS and architectural inefficiencies. The correct pattern is rehost now, then
    replatform/refactor to realize deeper cloud benefits.
  ref: "concepts.md#rehost-with-application-migration-service-mgn"
- id: aws-migration-modernization-022
  difficulty: advanced
  tags:
  - mgn
  - post-launch
  - replatform
  question: |
    How can MGN act as a bridge from rehost toward replatform?
  options:
  - By automatically sharding the database
  - By converting EC2 to Fargate automatically
  - Through post-launch actions that inject light modernization, such as installing the SSM/CloudWatch
    agent on the migrated instance
  - By provisioning a Direct Connect link
  answer: 2
  explanation: |
    MGN post-launch actions run automation on newly launched instances (e.g. install
    management agents, run scripts), enabling light modernization during the rehost.
    It does not auto-shard databases or convert compute types.
  ref: "concepts.md#rehost-with-application-migration-service-mgn"
- id: aws-migration-modernization-023
  difficulty: beginner
  tags:
  - dms
  - database
  question: |
    AWS Database Migration Service (DMS) is designed primarily to:
  options:
  - Migrate databases to AWS with minimal downtime
  - Convert application source code to microservices
  - Physically ship storage arrays to AWS
  - Manage IAM roles for databases
  answer: 0
  explanation: |
    DMS migrates databases (homogeneous or heterogeneous) with minimal downtime via
    full load and/or ongoing CDC replication. Code refactoring, offline shipping, and
    IAM are unrelated.
  ref: "concepts.md#database-migration-dms-and-the-schema-conversion-tool"
- id: aws-migration-modernization-024
  difficulty: intermediate
  tags:
  - dms
  - cdc
  - downtime
  question: |
    What role does DMS Change Data Capture (CDC) play in a low-downtime database
    migration?
  options:
  - It converts stored procedures to a new dialect
  - It compresses the database for offline shipping
  - It provisions the target replication instance automatically
  - It reads the source transaction log and streams ongoing changes to the target, keeping it near-synced
    so cutover happens in a tiny window when lag is ~0
  answer: 3
  explanation: |
    CDC tails the redo/binlog and continuously applies changes to the target after the
    full load, so the source stays live and you cut over when replication lag approaches
    zero. Schema/stored-proc conversion is SCT's job.
  ref: "concepts.md#database-migration-dms-and-the-schema-conversion-tool"
- id: aws-migration-modernization-025
  difficulty: intermediate
  tags:
  - sct
  - heterogeneous
  - schema
  question: |
    When is the AWS Schema Conversion Tool (SCT / DMS Schema Conversion) required in a
    migration?
  options:
  - For heterogeneous migrations (e.g. Oracle to Aurora PostgreSQL) where schema, stored procedures, and
    code must be converted between engines
  - For every migration, including MySQL to MySQL
  - Only for migrating files to S3
  - Only when using Snowball
  answer: 0
  explanation: |
    SCT is for heterogeneous engine changes, converting schema and code to the target
    dialect and reporting what it couldn't auto-convert. Homogeneous moves (same engine)
    need no schema conversion.
  ref: "concepts.md#database-migration-dms-and-the-schema-conversion-tool"
- id: aws-migration-modernization-026
  difficulty: intermediate
  tags:
  - dms
  - task-types
  question: |
    Which DMS task type is correct for "copy all existing data, then keep replicating
    ongoing changes until cutover"?
  options:
  - Full load only
  - Full load plus CDC
  - CDC only
  - Schema-only
  answer: 1
  explanation: |
    Full load + CDC bulk-copies existing rows and then applies ongoing changes via CDC,
    the standard low-downtime pattern. Full-load-only stops after the bulk copy; CDC-only
    assumes the target is already seeded.
  ref: "concepts.md#database-migration-dms-and-the-schema-conversion-tool"
- id: aws-migration-modernization-027
  difficulty: advanced
  tags:
  - dms
  - sct
  - trade-offs
  - gotchas
  question: |
    A heterogeneous Oracle-to-Aurora-PostgreSQL migration is behind schedule. SCT
    reports it converted 85% of the schema automatically. What is the most likely
    cause of the remaining effort?
  options:
  - DMS cannot copy table rows
  - Aurora PostgreSQL does not support foreign keys
  - Proprietary PL/SQL, triggers, and vendor-specific features must be hand-ported because auto-conversion
    is rarely 100%
  - CDC cannot run on Oracle sources
  answer: 2
  explanation: |
    SCT handles the bulk of schema but the proprietary tail (PL/SQL packages, triggers,
    vendor features) typically needs manual porting — the "% auto-converted is never
    100%" gotcha. Budget engineering time for it. DMS copies rows fine and Aurora PG
    supports FKs.
  ref: "concepts.md#database-migration-dms-and-the-schema-conversion-tool"
- id: aws-migration-modernization-028
  difficulty: advanced
  tags:
  - dms
  - homogeneous
  - alternatives
  question: |
    For a straightforward same-engine MySQL-to-Amazon-RDS-MySQL migration with an
    acceptable maintenance window, which is often the simplest, cheapest approach?
  options:
  - SCT full schema conversion followed by refactoring
  - Snowmobile
  - Storage Gateway Tape mode
  - Native tooling (e.g. mysqldump/restore, snapshot, or read-replica-then-promote), reserving DMS+CDC
    for when ongoing low-downtime replication is truly needed
  answer: 3
  explanation: |
    Homogeneous moves with a tolerable window are often simpler and cheaper with native
    tools; DMS+CDC shines for low-downtime or heterogeneous cases. SCT isn't needed for
    same-engine; Snowmobile/Tape Gateway are unrelated.
  ref: "concepts.md#database-migration-dms-and-the-schema-conversion-tool"
- id: aws-migration-modernization-029
  difficulty: expert
  tags:
  - dms
  - cdc
  - source-load
  - gotchas
  question: |
    Which is a real operational consideration when enabling DMS CDC against a busy
    production source database?
  options:
  - CDC requires the source to be offline
  - CDC replaces the need to pre-create the target schema
  - CDC adds load by reading the redo/binlog and requires transaction logging to be enabled with adequate
    retention on the source
  - CDC guarantees exactly-once delivery with no configuration
  answer: 2
  explanation: |
    CDC tails the source's transaction logs, so the source must have logging enabled
    with retention long enough to cover replication lag, and it adds read/IO load. It
    does not require the source offline, does not create the target schema, and needs
    careful handling for edge cases.
  ref: "concepts.md#database-migration-dms-and-the-schema-conversion-tool"
- id: aws-migration-modernization-030
  difficulty: expert
  tags:
  - babelfish
  - sct
  - app-rewrite
  question: |
    To reduce application rewrite when migrating a SQL Server workload to Aurora
    PostgreSQL, which AWS capability lets the app keep speaking the T-SQL / TDS
    protocol against Aurora?
  options:
  - DMS Serverless
  - Babelfish for Aurora PostgreSQL
  - AWS DataSync
  - Storage Gateway Volume mode
  answer: 1
  explanation: |
    Babelfish adds a T-SQL/TDS-compatible endpoint to Aurora PostgreSQL, so many SQL
    Server apps run with minimal code change, cutting the refactor cost of the app tier.
    The others don't address protocol/dialect compatibility.
  ref: "concepts.md#database-migration-dms-and-the-schema-conversion-tool"
- id: aws-migration-modernization-031
  difficulty: beginner
  tags:
  - datasync
  - transfer
  question: |
    AWS DataSync is best described as:
  options:
  - A managed online service for transferring and syncing file/object data (NFS, SMB, HDFS, S3, EFS, FSx)
    with built-in verification and incremental logic
  - An offline, ship-a-device data transfer method
  - A database schema converter
  - A managed SFTP endpoint for partners
  answer: 0
  explanation: |
    DataSync is a managed online transfer service across NFS/SMB/HDFS/S3/EFS/FSx with
    parallelism, integrity verification, and incremental copies. Offline shipping is the
    Snow Family; SFTP-for-partners is Transfer Family.
  ref: "concepts.md#bulk-data-transfer-datasync-snow-family-and-transfer-family"
- id: aws-migration-modernization-032
  difficulty: beginner
  tags:
  - snowball
  - offline
  question: |
    When is AWS Snowball Edge the appropriate choice over transferring data online?
  options:
  - When you need an ongoing SFTP feed from a partner
  - When you need to convert a database schema
  - Whenever you migrate any amount of data
  - When the dataset is large enough that the available network bandwidth cannot move it within the required
    window
  answer: 3
  explanation: |
    Snowball Edge is for when `data_size / bandwidth` exceeds your time window — ship the
    device instead of saturating the link for days. It's not for ongoing feeds or schema
    conversion, and it's overkill for small datasets.
  ref: "concepts.md#bulk-data-transfer-datasync-snow-family-and-transfer-family"
- id: aws-migration-modernization-033
  difficulty: intermediate
  tags:
  - transfer-family
  - distractor
  question: |
    A team proposes AWS Transfer Family to perform a one-time 300 TB bulk migration of
    files into S3. Why is this the wrong tool?
  options:
  - Transfer Family only supports databases
  - Transfer Family is a managed protocol front-end (SFTP/FTPS/FTP/AS2) for ongoing, standardized file
    exchange — not a bulk one-time migration engine
  - Transfer Family cannot write to S3
  - Transfer Family requires a Snowball device
  answer: 1
  explanation: |
    Transfer Family provides managed SFTP/FTPS/FTP/AS2 endpoints for recurring partner
    exchange into S3/EFS; it isn't optimized for one-time bulk migration. For 300 TB
    you'd use Snowball (offline) and/or DataSync (online), based on the bandwidth math.
  ref: "concepts.md#bulk-data-transfer-datasync-snow-family-and-transfer-family"
- id: aws-migration-modernization-034
  difficulty: intermediate
  tags:
  - bandwidth-math
  - estimation
  question: |
    Roughly how long to move 10 TB over a 100 Mbps link at ~80% usable throughput?
  options:
  - About 2 hours
  - About 3 hours
  - About 12 days
  - About 90 minutes
  answer: 2
  explanation: |
    10 TB = ~80 Tb; at ~80 Mbps usable that's ~1,000,000 s ≈ ~11-12 days. This is the
    canonical "the wire is too slow → consider Snowball" estimate interviewers expect
    you to do on the spot.
  ref: "concepts.md#bulk-data-transfer-datasync-snow-family-and-transfer-family"
- id: aws-migration-modernization-035
  difficulty: advanced
  tags:
  - seed-and-sync
  - snowball
  - datasync
  - trade-offs
  question: |
    For a petabyte-scale dataset that keeps changing, which combined approach minimizes
    total time-to-migrate while keeping data current?
  options:
  - Snowball-seed the bulk offline, then use DataSync (or DMS CDC for databases) to sync the delta accumulated
    during shipping, then cut over
  - Transfer everything online with DataSync over the internet only
  - Snowmobile only, with no follow-up sync
  - Ship a Snowball and never reconcile changes
  answer: 0
  explanation: |
    The seed-then-sync pattern moves the massive baseline offline (Snow) and reconciles
    the changes that accrued during shipping via an online delta sync, so the network
    never carries the whole dataset and the target ends up current. Online-only would be
    too slow; seed-only leaves you stale.
  ref: "concepts.md#bulk-data-transfer-datasync-snow-family-and-transfer-family"
- id: aws-migration-modernization-036
  difficulty: advanced
  tags:
  - datasync
  - alternatives
  - trade-offs
  question: |
    Compared to rolling your own `aws s3 cp`/rsync scripts on a cron, what does DataSync
    primarily buy you for a real migration?
  options:
  - Lower per-GB storage cost in S3
  - Automatic schema conversion
  - Offline device shipping
  - A managed, parallelized transfer with built-in integrity verification, incremental sync, scheduling,
    and reporting — less to build and operate
  answer: 3
  explanation: |
    DataSync removes the undifferentiated work of parallelizing, verifying, retrying,
    and scheduling transfers. Roll-your-own is only cheaper for trivial one-off copies.
    It doesn't change S3 storage pricing, convert schemas, or ship devices.
  ref: "concepts.md#bulk-data-transfer-datasync-snow-family-and-transfer-family"
- id: aws-migration-modernization-037
  difficulty: expert
  tags:
  - bandwidth-math
  - direct-connect
  - estimation
  question: |
    You must move 500 TB. A 10 Gbps Direct Connect link is usable at ~70%. Approximately
    how long is pure transfer, and what does that imply?
  options:
  - ~6-7 days saturating the link the whole time, which would starve production — parallel Snowball Edge
    devices are likely faster and safer
  - ~1 hour — just use the internet
  - ~30 minutes — no special handling needed
  - ~90 days — migration is impossible
  answer: 0
  explanation: |
    500 TB = 4e15 bits; at ~7 Gbps that's ~570,000 s ≈ ~6.6 days at full saturation,
    which blocks other traffic on the link. Multiple Snowball Edge devices in parallel
    often beat that and don't starve production — a classic trade-off computation.
  ref: "concepts.md#bulk-data-transfer-datasync-snow-family-and-transfer-family"
- id: aws-migration-modernization-038
  difficulty: beginner
  tags:
  - downtime
  - cutover
  question: |
    A "big-bang" cutover means:
  options:
  - Running old and new systems in parallel indefinitely
  - Stopping the source, copying everything, then starting on AWS — so downtime equals the full copy time
  - Continuously replicating with a tiny cutover window
  - Migrating one tenant at a time
  answer: 1
  explanation: |
    Big-bang stops the source, copies, and restarts on AWS; downtime = full copy time.
    It's simple but only acceptable for small/non-critical systems or generous windows.
    Parallel-run and trickle are lower-downtime alternatives.
  ref: "concepts.md#minimizing-downtime-cdc-replication-and-cutover-strategies"
- id: aws-migration-modernization-039
  difficulty: intermediate
  tags:
  - dns
  - route53
  - cutover
  question: |
    Why should you LOWER the Route 53 record TTL well before a cutover?
  options:
  - To reduce S3 storage cost
  - To enable CDC on the database
  - So clients pick up the new endpoint quickly (and you can roll back fast) instead of caching the old
    IP for a long TTL
  - To increase Direct Connect bandwidth
  answer: 2
  explanation: |
    A low TTL set before cutover means resolvers re-query soon, so traffic shifts (and
    rollback) happen quickly. A high TTL leaves clients pinned to the old endpoint,
    extending outage/rollback time. TTL has nothing to do with S3, CDC, or DX bandwidth.
  ref: "concepts.md#minimizing-downtime-cdc-replication-and-cutover-strategies"
- id: aws-migration-modernization-040
  difficulty: intermediate
  tags:
  - rollback
  - cutover
  - risk
  question: |
    What is the single most important safeguard around the point of cutover?
  options:
  - Deleting the source immediately to save cost
  - Raising the DNS TTL to 24 hours
  - Turning off monitoring during cutover
  - A tested rollback plan — keep the source live and re-syncable until you have validated the target
    in production
  answer: 3
  explanation: |
    Cutover is the riskiest moment; you must be able to reverse it until confidence is
    high, so keep the source live/re-syncable (and validate data via reconciliation).
    Deleting the source early, raising TTL, or dropping monitoring all increase risk.
  ref: "concepts.md#minimizing-downtime-cdc-replication-and-cutover-strategies"
- id: aws-migration-modernization-041
  difficulty: advanced
  tags:
  - parallel-run
  - trade-offs
  - downtime
  question: |
    A trickle / parallel-run cutover (old and new running together, users migrated in
    batches) offers the lowest downtime. What is its PRIMARY cost?
  options:
  - It requires Snowball devices
  - It cannot use Route 53
  - 'High complexity: data reconciliation, idempotency, dual-write, and split-brain risk while both systems
    run'
  - It always loses more data than a big-bang
  answer: 2
  explanation: |
    Parallel-run minimizes downtime and risk of a bad flip but adds significant
    complexity — keeping two systems consistent, handling dual-writes idempotently, and
    avoiding split-brain. You only pay this for systems whose RTO/RPO demands it.
  ref: "concepts.md#minimizing-downtime-cdc-replication-and-cutover-strategies"
- id: aws-migration-modernization-042
  difficulty: advanced
  tags:
  - reconciliation
  - dms
  - validation
  question: |
    Before declaring a low-downtime database cutover successful, what should you do to
    confirm data integrity?
  options:
  - Assume DMS is always perfect and skip validation
  - Run data validation (row counts / checksums, e.g. DMS data validation) between source and target
  - Delete the source and check nothing broke
  - Increase the DNS TTL
  answer: 1
  explanation: |
    Reconciliation via row counts/checksums (DMS offers built-in data validation) proves
    the target matches the source before cutover is final. Skipping validation or
    deleting the source first is exactly how silent data loss slips through.
  ref: "concepts.md#minimizing-downtime-cdc-replication-and-cutover-strategies"
- id: aws-migration-modernization-043
  difficulty: expert
  tags:
  - downtime
  - rto-rpo
  - judgment
  question: |
    A nightly batch reporting system can tolerate a multi-hour maintenance window and
    several hours of RPO. What is the appropriate cutover strategy, and why?
  options:
  - A simple big-bang (or full-load) cutover during the window — gold-plating it with a zero-downtime
    parallel run adds cost and complexity for no business benefit
  - A full bi-directional parallel run with dual writes for zero downtime
  - Snowmobile shipment
  - Continuous CDC with sub-second cutover regardless of cost
  answer: 0
  explanation: |
    Match the technique to the business RTO/RPO. With a generous window and loose RPO, a
    big-bang/full-load cutover is simplest and cheapest; a parallel run would add
    needless complexity and cost. Over-engineering downtime is a real anti-pattern.
  ref: "concepts.md#minimizing-downtime-cdc-replication-and-cutover-strategies"
- id: aws-migration-modernization-044
  difficulty: beginner
  tags:
  - strangler-fig
  - monolith
  question: |
    The strangler-fig pattern breaks a monolith into services by:
  options:
  - Rewriting the entire system and switching over in one weekend
  - Copying the monolith to EC2 unchanged
  - Sharding the database across Regions
  - Placing a facade/proxy in front, incrementally peeling off capabilities into new services and re-routing
    to them, until the monolith is empty and can be retired
  answer: 3
  explanation: |
    Strangler-fig incrementally routes traffic (via a facade like API Gateway/ALB) to
    new services as you carve out capabilities, shrinking the monolith over time. It's
    the low-risk alternative to a big-bang rewrite.
  ref: "concepts.md#the-strangler-fig-pattern-incrementally-decomposing-a-monolith"
- id: aws-migration-modernization-045
  difficulty: intermediate
  tags:
  - strangler-fig
  - facade
  - routing
  question: |
    Which AWS components are commonly used as the "facade/proxy" that routes between the
    monolith and newly extracted services in a strangler-fig migration?
  options:
  - Amazon Snowball and Snowmobile
  - Amazon API Gateway or an ALB with path-based routing (or a reverse proxy)
  - AWS SCT and DMS
  - AWS Outposts and Local Zones
  answer: 1
  explanation: |
    The facade is a routing layer — API Gateway, an ALB with path/host rules, or a
    reverse proxy — sending legacy paths to the monolith and migrated paths to new
    services. The other options are data transfer, DB migration, and hybrid-hardware
    tools.
  ref: "concepts.md#the-strangler-fig-pattern-incrementally-decomposing-a-monolith"
- id: aws-migration-modernization-046
  difficulty: intermediate
  tags:
  - strangler-fig
  - risk
  - reversibility
  question: |
    Why is the strangler-fig approach considered lower-risk than a big-bang rewrite?
  options:
  - It requires no testing
  - It eliminates the shared database problem automatically
  - Each extracted slice is small, independently deployable, and reversible — you can route back to the
    monolith if a new service misbehaves
  - It avoids any network calls
  answer: 2
  explanation: |
    Incremental, reversible slices let you validate and roll back per capability instead
    of betting everything on one cutover. It does NOT magically solve data decomposition
    (the hard part) or remove network hops.
  ref: "concepts.md#the-strangler-fig-pattern-incrementally-decomposing-a-monolith"
- id: aws-migration-modernization-047
  difficulty: advanced
  tags:
  - strangler-fig
  - data
  - cdc
  - trade-offs
  question: |
    In a strangler-fig decomposition, what is usually the HARDEST part, and how is it
    commonly handled during transition?
  options:
  - 'Decomposing the shared database: introduce bounded-context data ownership, use CDC (e.g. DMS/Kinesis)
    to keep the new service''s store in sync during transition, and accept eventual consistency where
    you had transactions'
  - Deploying containers — solved by using EKS
  - Choosing a load balancer — solved by using NLB
  - Writing the facade routing rules
  answer: 0
  explanation: |
    Code extraction is comparatively easy; splitting the single shared database is the
    real challenge — assigning data ownership per bounded context, syncing via CDC during
    the transition, and giving up cross-service ACID transactions for eventual
    consistency.
  ref: "concepts.md#the-strangler-fig-pattern-incrementally-decomposing-a-monolith"
- id: aws-migration-modernization-048
  difficulty: advanced
  tags:
  - strangler-fig
  - boundaries
  - distributed-monolith
  question: |
    A team splits a monolith along technical layers rather than business capabilities,
    and the resulting services make many synchronous calls to each other per request.
    What anti-pattern have they created?
  options:
  - A cell-based architecture
  - A serverless-first architecture
  - A properly bounded microservice mesh
  - A distributed monolith — worse latency and tighter coupling than the original, because service boundaries
    were drawn wrong
  answer: 3
  explanation: |
    Poorly-chosen boundaries turn in-process calls into chatty network hops with shared
    coupling — a distributed monolith that has all the drawbacks of microservices and
    none of the benefits. Boundaries should follow business/bounded contexts.
  ref: "concepts.md#the-strangler-fig-pattern-incrementally-decomposing-a-monolith"
- id: aws-migration-modernization-049
  difficulty: advanced
  tags:
  - strangler-fig
  - judgment
  - when-not
  question: |
    For which application is the strangler-fig pattern LEAST worth the overhead?
  options:
  - A small application scheduled to be retired within a few months
  - A large, actively developed monolith blocking business velocity
  - A complex system with many independently scaling components
  - A monolith with a tangled shared database that hinders team autonomy
  answer: 0
  explanation: |
    For small or soon-to-be-retired apps, the transitional overhead (facade, dual
    maintenance, data sync) isn't justified — just rehost or retire. Strangler-fig pays
    off for large, evolving monoliths that need decomposition.
  ref: "concepts.md#the-strangler-fig-pattern-incrementally-decomposing-a-monolith"
- id: aws-migration-modernization-050
  difficulty: expert
  tags:
  - strangler-fig
  - dual-maintenance
  - trade-offs
  question: |
    Which cost is inherent to the (often lengthy) transition period of a strangler-fig
    migration?
  options:
  - You cannot deploy any code during the transition
  - You must run and secure BOTH the shrinking monolith and the new services simultaneously (dual maintenance)
  - The monolith must be rewritten in a single language
  - All data must live in DynamoDB
  answer: 1
  explanation: |
    During the transition you operate two systems — patching, securing, monitoring, and
    paying for both — until the monolith is fully strangled. That ongoing dual-run cost
    is the price of incremental, low-risk decomposition.
  ref: "concepts.md#the-strangler-fig-pattern-incrementally-decomposing-a-monolith"
- id: aws-migration-modernization-051
  difficulty: beginner
  tags:
  - containers
  - fargate
  - eks
  question: |
    When containerizing extracted services, which choice minimizes cluster operational
    overhead by removing node management entirely?
  options:
  - Amazon EKS with self-managed EC2 nodes
  - Running Kubernetes on EC2 yourself
  - Amazon ECS on AWS Fargate
  - Amazon EC2 with a custom orchestrator
  answer: 2
  explanation: |
    ECS on Fargate is serverless containers — no nodes to manage, pay per task. EKS
    (especially with self-managed nodes) gives Kubernetes portability but more ops.
    Self-run Kubernetes/EC2 is the most operational overhead.
  ref: "concepts.md#refactoring-to-microservices-and-serverless"
- id: aws-migration-modernization-052
  difficulty: intermediate
  tags:
  - lambda
  - limits
  question: |
    A batch job needs to run for 45 minutes per execution. Why is AWS Lambda the wrong
    compute for it as-is?
  options:
  - Lambda has no internet access
  - Lambda cannot read from S3
  - Lambda cannot be triggered by events
  - Lambda has a hard maximum timeout of 15 minutes, so a 45-minute job must run on Fargate/Batch/EC2
    (or be decomposed)
  answer: 3
  explanation: |
    Lambda's max timeout is 15 minutes; a 45-minute job exceeds it and belongs on
    Fargate, AWS Batch, or EC2 (or must be broken into chunks). The other statements are
    false.
  ref: "concepts.md#refactoring-to-microservices-and-serverless"
- id: aws-migration-modernization-053
  difficulty: intermediate
  tags:
  - api-gateway
  - limits
  - async
  question: |
    A refactored endpoint sometimes needs 60 seconds to produce a response behind API
    Gateway. What is the correct design change?
  options:
  - Increase the API Gateway integration timeout to 60 seconds
  - Add more Lambda memory
  - Make the operation asynchronous (return 202 and poll, or push results via WebSockets/AppSync subscriptions)
    because API Gateway's integration timeout is 29 seconds
  - Switch to an NLB with a 60-second timeout
  answer: 2
  explanation: |
    API Gateway's maximum integration timeout is 29 seconds, so a 60-second synchronous
    call can't fit. The right pattern is async: accept the request, return 202, and
    deliver results by polling or push. Tuning memory or timeout won't get past the
    29 s cap.
  ref: "concepts.md#refactoring-to-microservices-and-serverless"
- id: aws-migration-modernization-054
  difficulty: intermediate
  tags:
  - serverless
  - glue
  - event-driven
  question: |
    Which set of services is the typical serverless "glue" for decoupling refactored
    microservices in an event-driven design?
  options:
  - Direct Connect, VPN, and Transit Gateway
  - SQS, SNS, and EventBridge
  - Snowball, DataSync, and Transfer Family
  - SCT, DMS, and Migration Hub
  answer: 1
  explanation: |
    SQS (queues), SNS (fan-out pub/sub), and EventBridge (event bus/routing) are the
    canonical async decoupling primitives. The others are networking, data-transfer, and
    migration-tracking tools, not application decoupling glue.
  ref: "concepts.md#refactoring-to-microservices-and-serverless"
- id: aws-migration-modernization-055
  difficulty: advanced
  tags:
  - serverless
  - cost
  - trade-offs
  - judgment
  question: |
    A service runs at very high, steady, 24/7 throughput. Why might refactoring it to a
    large always-on Lambda fleet be a poor cost decision?
  options:
  - At sustained high, constant load, per-invocation pricing can exceed the cost of reserved/steady containers
    or EC2 with Savings Plans; serverless wins on spiky/scale-to-zero workloads, not flat 24/7 ones
  - Lambda cannot handle high throughput at all
  - Lambda always requires a VPC which doubles cost
  - Lambda cannot be monitored
  answer: 0
  explanation: |
    Serverless shines for spiky/event-driven and scale-to-zero workloads. For steady,
    high, always-on throughput, provisioned containers/EC2 with commitment discounts can
    be cheaper — a cost inversion. Refactor for the right reasons, not fashion.
  ref: "concepts.md#refactoring-to-microservices-and-serverless"
- id: aws-migration-modernization-056
  difficulty: advanced
  tags:
  - dynamodb
  - limits
  - modeling
  question: |
    When refactoring a monolith's data layer onto DynamoDB, which limit most directly
    forces you to model around access patterns rather than entities to avoid a hot
    partition?
  options:
  - The 400 KB item size limit
  - The 15-minute Lambda timeout
  - The 29-second API Gateway timeout
  - The per-partition ceiling of roughly 3000 RCU / 1000 WCU
  answer: 3
  explanation: |
    A single partition tops out around 3000 RCU / 1000 WCU; concentrating traffic on one
    partition key creates a hot partition and throttling. That's why you design keys
    around access patterns to spread load. The 400 KB item limit matters but isn't the
    hot-partition driver.
  ref: "concepts.md#refactoring-to-microservices-and-serverless"
- id: aws-migration-modernization-057
  difficulty: expert
  tags:
  - sqs
  - fifo
  - limits
  - trade-offs
  question: |
    A refactored order pipeline needs strict ordering and exactly-once processing at
    high volume. What trade-off must you weigh with SQS FIFO?
  options:
  - FIFO has unlimited throughput identical to Standard
  - FIFO caps at 300 TPS (3000 with batching) per default limits, trading throughput for ordering/dedup,
    whereas Standard queues offer effectively unlimited throughput but at-least-once delivery and best-effort
    ordering
  - FIFO cannot guarantee ordering
  - Standard queues guarantee exactly-once delivery
  answer: 1
  explanation: |
    FIFO gives ordering and dedup but is throughput-limited (300 TPS, 3000 with
    batching); Standard scales effectively without limit but is at-least-once with
    best-effort ordering. If volume exceeds FIFO limits you shard by message group or
    redesign — ordering is not free.
  ref: "concepts.md#refactoring-to-microservices-and-serverless"
- id: aws-migration-modernization-058
  difficulty: expert
  tags:
  - fargate
  - eks
  - trade-offs
  - judgment
  question: |
    A team wants Kubernetes API compatibility and a multi-cloud portability story, and
    has platform engineers to run it. Between ECS-on-Fargate and EKS, which fits and
    what is the trade-off?
  options:
  - ECS on Fargate — because it is Kubernetes-compatible
  - Neither can run containers
  - EKS — it provides the Kubernetes API and ecosystem/portability, at the cost of more operational complexity
    than Fargate's near-zero cluster ops
  - EKS — because it is always cheaper than Fargate
  answer: 2
  explanation: |
    EKS gives the Kubernetes API, tooling ecosystem, and cross-environment portability,
    which fits a multi-cloud goal, but you take on more ops than Fargate. ECS/Fargate is
    not Kubernetes-compatible, and EKS isn't inherently cheaper.
  ref: "concepts.md#refactoring-to-microservices-and-serverless"
- id: aws-migration-modernization-059
  difficulty: expert
  tags:
  - lambda
  - limits
  - ephemeral
  question: |
    Which combination of AWS Lambda limits is correct?
  options:
  - 15-minute timeout, up to 10 GB memory, up to 10 GB ephemeral /tmp
  - 5-minute timeout, 3 GB memory, 512 MB /tmp
  - 60-minute timeout, 128 GB memory, unlimited /tmp
  - 29-second timeout, 1 GB memory, 1 GB /tmp
  answer: 0
  explanation: |
    Lambda: max 15-minute timeout, up to 10 GB memory (CPU scales with memory), and up
    to 10 GB configurable ephemeral /tmp. The 29 s figure is API Gateway's integration
    timeout, not Lambda's.
  ref: "concepts.md#refactoring-to-microservices-and-serverless"
- id: aws-migration-modernization-060
  difficulty: beginner
  tags:
  - direct-connect
  - hybrid
  question: |
    AWS Direct Connect provides:
  options:
  - A managed database migration path
  - Offline device-based data transfer
  - A serverless compute layer
  - A dedicated private network link from your data center to AWS with consistent bandwidth and more predictable
    latency than the public internet
  answer: 3
  explanation: |
    Direct Connect is a dedicated private link (1/10/100 Gbps) giving consistent
    throughput, predictable latency, and lower egress rates than the internet. It's not
    a DB migration tool, offline transfer, or compute.
  ref: "concepts.md#hybrid-architectures-direct-connect-storage-gateway-and-outposts"
- id: aws-migration-modernization-061
  difficulty: beginner
  tags:
  - storage-gateway
  - hybrid
  question: |
    Which Storage Gateway mode presents cloud object storage to on-prem apps via NFS/SMB,
    backing files into Amazon S3?
  options:
  - File Gateway
  - Tape Gateway
  - Volume Gateway
  - Transit Gateway
  answer: 0
  explanation: |
    File Gateway exposes NFS/SMB file shares backed by S3 with local caching. Volume
    Gateway is iSCSI block; Tape Gateway is a virtual tape library to S3/Glacier; Transit
    Gateway is a networking hub (not part of Storage Gateway).
  ref: "concepts.md#hybrid-architectures-direct-connect-storage-gateway-and-outposts"
- id: aws-migration-modernization-062
  difficulty: intermediate
  tags:
  - outposts
  - latency
  - residency
  question: |
    Which requirement most justifies AWS Outposts over migrating a workload fully into a
    Region?
  options:
  - You want the cheapest, most elastic compute possible
  - The workload needs single-digit-millisecond latency to on-prem systems, or has strict local data-residency/processing
    needs, with a consistent AWS operating model on-prem
  - You want to avoid buying or committing to any hardware
  - You need to run a one-time bulk data transfer
  answer: 1
  explanation: |
    Outposts places AWS-managed hardware in your data center for low-latency-to-on-prem,
    residency, or a consistent hybrid model — but you commit to physical capacity (losing
    elasticity) and depend on the service link. If you want cheapest/most-elastic or no
    hardware commitment, use a Region.
  ref: "concepts.md#hybrid-architectures-direct-connect-storage-gateway-and-outposts"
- id: aws-migration-modernization-063
  difficulty: intermediate
  tags:
  - tape-gateway
  - hybrid
  - use-case
  question: |
    An enterprise wants to eliminate its physical tape library and backup infrastructure
    while keeping its existing backup software workflows. Which fits best?
  options:
  - Volume Gateway
  - AWS Outposts
  - Tape Gateway (Virtual Tape Library) backing S3/Glacier
  - Direct Connect
  answer: 2
  explanation: |
    Tape Gateway presents a virtual tape library so existing backup software keeps
    working, while data lands in S3/Glacier — retiring physical tapes. Volume Gateway is
    block storage; Outposts and DX don't replace tape workflows.
  ref: "concepts.md#hybrid-architectures-direct-connect-storage-gateway-and-outposts"
- id: aws-migration-modernization-064
  difficulty: advanced
  tags:
  - direct-connect
  - vpn
  - trade-offs
  question: |
    For sustained, high-throughput hybrid connectivity during a long migration, what is
    the key trade-off of Direct Connect versus a Site-to-Site VPN?
  options:
  - VPN offers more predictable latency and higher throughput than DX
  - DX and VPN are functionally identical
  - VPN cannot be used as a backup for DX
  - DX gives consistent bandwidth, predictable latency, and lower egress rates but takes weeks to provision;
    VPN is up in minutes and cheap but rides the public internet with variable latency and a per-tunnel
    throughput ceiling
  answer: 3
  explanation: |
    DX wins on consistency, latency predictability, and egress cost but has weeks of
    lead time; VPN is fast/cheap to stand up but is internet-based with variable latency
    and ~1.25 Gbps per tunnel. VPN is a good stopgap or DX backup, not the sustained
    bulk path.
  ref: "concepts.md#hybrid-architectures-direct-connect-storage-gateway-and-outposts"
- id: aws-migration-modernization-065
  difficulty: advanced
  tags:
  - direct-connect
  - resilience
  - trade-offs
  question: |
    A team provisions a single Direct Connect connection as the sole path for a critical
    hybrid workload. What resilience gap exists and how is it commonly addressed?
  options:
  - None — a single DX connection is fully redundant
  - DX cannot fail, so no backup is needed
  - A single DX is a single point of failure; use two DX connections (ideally at different locations)
    and/or a Site-to-Site VPN backup over the internet
  - Add a Snowball device as the backup path
  answer: 2
  explanation: |
    One DX connection/location is a SPOF. Best practice is multiple DX connections across
    locations and/or a VPN backup for failover. Snowball is offline transfer, not a
    connectivity failover.
  ref: "concepts.md#hybrid-architectures-direct-connect-storage-gateway-and-outposts"
- id: aws-migration-modernization-066
  difficulty: expert
  tags:
  - outposts
  - local-zones
  - wavelength
  - trade-offs
  question: |
    A workload needs low latency to END USERS in a metro area but has no requirement to
    run inside your own data center or own hardware. Which is the most appropriate choice?
  options:
  - AWS Outposts in your data center
  - AWS Local Zones (or Wavelength for 5G/mobile edge), which place AWS-owned infrastructure near users
    without you owning hardware
  - A single centralized Region far from users
  - Storage Gateway Volume mode
  answer: 1
  explanation: |
    Local Zones (and Wavelength for 5G edge) put AWS-managed compute close to users
    without on-prem hardware, ideal for user-latency needs. Outposts is for on-prem
    latency/residency with owned hardware; a distant single Region hurts latency; Storage
    Gateway is unrelated.
  ref: "concepts.md#hybrid-architectures-direct-connect-storage-gateway-and-outposts"
- id: aws-migration-modernization-067
  difficulty: expert
  tags:
  - hybrid
  - trade-offs
  - judgment
  question: |
    What is the strategic risk of allowing a "temporary" hybrid architecture to persist
    indefinitely after a stalled migration?
  options:
  - Running two operating models long-term is expensive and complex, so long-lived hybrid should be a
    deliberate choice (latency/residency/investment), not an accident of a stalled migration
  - It always improves security
  - Hybrid architectures cannot use Direct Connect
  - AWS automatically deletes on-prem workloads after 90 days
  answer: 0
  explanation: |
    Hybrid is valuable for workloads that genuinely can't move, but sustaining two
    operating models is costly and complex. Long-lived hybrid should be intentional, not
    the residue of a migration that lost momentum.
  ref: "concepts.md#hybrid-architectures-direct-connect-storage-gateway-and-outposts"
- id: aws-migration-modernization-068
  difficulty: beginner
  tags:
  - data-gravity
  - egress
  - cost
  question: |
    Regarding AWS data-transfer pricing that shapes migration and end-state design,
    which statement is generally true?
  options:
  - Egress out of AWS is free; ingress costs money
  - All data transfer in and out is free
  - Only Snowball transfers incur data charges
  - Ingress into AWS is generally free, while egress out of AWS costs money per GB (and cross-Region/inter-AZ
    transfer also costs)
  answer: 3
  explanation: |
    Ingress to AWS is generally free; egress out (and cross-Region/inter-AZ) is charged
    per GB. This asymmetry drives you to avoid ping-ponging data across the WAN and to
    cache at the edge. The other options misstate the pricing model.
  ref: "concepts.md#data-gravity-and-network-trade-offs"
- id: aws-migration-modernization-069
  difficulty: intermediate
  tags:
  - data-gravity
  - coupling
  - latency
  question: |
    "Data gravity" implies which practical guidance during migration sequencing?
  options:
  - Always move the database last and independently, even from its app
  - Avoid repeatedly moving large datasets across the WAN — keep tightly-coupled compute and data together
    to prevent per-call latency and egress cost blowups
  - Data can be moved freely with no cost or latency impact
  - Compute should always run in a different Region from its data
  answer: 1
  explanation: |
    Large datasets are costly/slow to move and pull compute toward them; splitting a
    chatty app from its data across the WAN adds latency to every call and egress
    charges. Keep coupled components together and avoid repeated cross-WAN movement.
  ref: "concepts.md#data-gravity-and-network-trade-offs"
- id: aws-migration-modernization-070
  difficulty: advanced
  tags:
  - data-gravity
  - sequencing
  - cdc
  question: |
    Because of data gravity and dependency ordering, when should database replication
    typically START relative to the application cutover?
  options:
  - After the app is fully cut over, to avoid load
  - Exactly at the moment of cutover
  - Early — begin CDC replication so the target data store is warm and near-synced by the time you cut
    the application over
  - Never; databases should be big-banged only
  answer: 2
  explanation: |
    You start DB replication (e.g. DMS CDC) early so the store is warm and lag is minimal
    at cutover — the data must be replicating first even though the app depends on it.
    Waiting until cutover forces a long copy and extends downtime.
  ref: "concepts.md#data-gravity-and-network-trade-offs"
- id: aws-migration-modernization-071
  difficulty: expert
  tags:
  - data-gravity
  - seed-sync
  - snowball
  - judgment
  question: |
    A Snowball shipment of a large, actively-written dataset takes a week in transit. On
    arrival, the team discovers the post-import delta sync is itself a major effort. What
    failure mode is this, and how is it avoided?
  options:
  - The delta grew so large during shipping that the follow-up sync is a mini-migration; mitigate by minimizing
    writes during transit, shipping sooner, or using multiple devices/continuous CDC to keep the delta
    bounded
  - It's a schema conversion failure; use SCT
  - It's a Direct Connect misconfiguration; add a VPN
  - It's unavoidable and means Snowball should never be used
  answer: 0
  explanation: |
    For high-churn data, the change delta accumulated during the days-long shipment can
    balloon into its own migration. You bound it by reducing writes during transit,
    shortening the seed-to-sync gap, or running continuous CDC so the catch-up stays
    small — not by abandoning offline transfer.
  ref: "concepts.md#data-gravity-and-network-trade-offs"
- id: aws-migration-modernization-072
  difficulty: intermediate
  tags:
  - trade-offs
  - mgn
  - relocate
  question: |
    A large VMware estate must leave the data center quickly, and the team wants to keep
    its existing VMware operational tooling for now. Which strategy fits, and what is the
    trade-off versus MGN rehost?
  options:
  - Refactor everything to serverless — it's fastest
  - Repurchase every workload as SaaS
  - Retain everything on-prem indefinitely
  - Relocate to VMware Cloud on AWS to preserve VMware ops, trading away near-term cloud-native benefits
    that a native-EC2 rehost (MGN) would start to unlock
  answer: 3
  explanation: |
    Relocate (VMware Cloud on AWS) preserves the VMware operating model and exits the DC
    fast, but delays moving toward native services. MGN rehost puts you on native EC2 (a
    better modernization on-ramp) but changes the ops model. Choose based on tooling
    inertia vs modernization urgency.
  ref: "concepts.md#trade-offs-and-when-to-use-what"
- id: aws-migration-modernization-073
  difficulty: advanced
  tags:
  - trade-offs
  - cost
  - right-sizing
  - judgment
  question: |
    Post-rehost, a company's AWS bill is higher than its old on-prem spend. Which sequence
    of actions best addresses this WITHOUT a full refactor?
  options:
  - Right-size instances, schedule dev/test to shut down off-hours, enable auto scaling, and commit to
    Savings Plans/Reserved Instances; then selectively replatform
  - Immediately refactor all apps to serverless
  - Move everything back on-prem
  - Raise DNS TTLs and delete backups to cut cost
  answer: 0
  explanation: |
    A naive rehost is often over-provisioned and on-demand 24/7. FinOps levers —
    right-sizing, scheduling non-prod, auto scaling, and commitment discounts — recover
    most savings without a costly refactor; selective replatforming comes next. Refactor
    everything or move back are extreme and unnecessary.
  ref: "concepts.md#trade-offs-and-when-to-use-what"
- id: aws-migration-modernization-074
  difficulty: advanced
  tags:
  - trade-offs
  - failure-modes
  question: |
    Which of the following is a recognized migration FAILURE MODE to guard against?
  options:
  - Using Route 53 with a low TTL before cutover
  - A cutover with no rollback plan while DNS TTL is still high, turning a bad flip into an extended outage
  - Retiring dead applications during discovery
  - Keeping tightly-coupled components in the same wave
  answer: 1
  explanation: |
    No rollback plus a high TTL means clients stay pinned to a failing new endpoint with
    no fast reversal — an extended outage. The other three are best practices, not
    failure modes.
  ref: "concepts.md#trade-offs-and-when-to-use-what"
- id: aws-migration-modernization-075
  difficulty: expert
  tags:
  - trade-offs
  - end-to-end
  - judgment
  question: |
    A 40 TB Oracle OLTP database must move to Aurora PostgreSQL with under 30 minutes of
    downtime. Which end-to-end plan best satisfies the constraints?
  options:
  - Export with Data Pump, ship on Snowball, import, and cut over in one big-bang
  - Rehost Oracle onto EC2 with MGN and leave it there
  - Use SCT/DMS Schema Conversion for schema and code, run DMS full-load + CDC to keep the target synced,
    validate data, cut over with a low-TTL Route 53 flip while keeping the source re-syncable for rollback,
    and hand-port un-converted PL/SQL
  - Use DataSync to copy the Oracle data files directly into Aurora
  answer: 2
  explanation: |
    Heterogeneous + tight downtime demands SCT for schema/code conversion, DMS full-load
    then CDC to reach ~0 lag, data validation, and a fast low-TTL DNS cutover with
    rollback via a re-syncable source, plus manual PL/SQL porting. Snowball big-bang blows
    the downtime budget; MGN doesn't change engines; DataSync can't load Oracle files into
    Aurora.
  ref: "concepts.md#trade-offs-and-when-to-use-what"
- id: aws-migration-modernization-076
  difficulty: expert
  tags:
  - trade-offs
  - offline
  - deadline
  - judgment
  question: |
    500 TB of on-prem files must be in S3 within 3 weeks; the site has a 200 Mbps
    internet link and no Direct Connect. Which plan is most appropriate?
  options:
  - Upload everything over the 200 Mbps link with DataSync — it will finish in time
  - Use AWS Transfer Family to SFTP the 500 TB
  - Provision Direct Connect and transfer online within the 3 weeks
  - Order Snowball Edge devices to seed the bulk into S3 offline, then use DataSync for the delta accrued
    during shipping, and validate — because the wire math shows the internet link cannot make the deadline
  answer: 3
  explanation: |
    At ~200 Mbps, 500 TB would take many months online — far beyond 3 weeks — so offline
    Snowball seeding plus a DataSync delta sync is the fit. Transfer Family isn't a bulk
    tool, and Direct Connect provisioning alone typically exceeds the 3-week window.
  ref: "concepts.md#trade-offs-and-when-to-use-what"
- id: aws-migration-modernization-077
  difficulty: intermediate
  tags:
  - trade-offs
  - modernize-vs-rehost
  - judgment
  question: |
    Which factor most strongly argues for MODERNIZING (refactor/replatform) a specific
    application rather than just rehosting it?
  options:
  - The application is stable, rarely changes, and will be retired soon
  - There is a hard data-center-exit deadline in a few weeks
  - The application is strategic, is blocking business velocity, and would benefit materially from elastic
    scale or managed-service ops — and the team has capacity to absorb the change
  - The team has no cloud experience and no schedule slack
  answer: 2
  explanation: |
    Modernize when the app is high-value, its current form limits agility/scale, and the
    org can absorb the risk/effort. Stable-and-soon-to-retire, tight deadlines, and low
    maturity all point toward rehost-first (or retain).
  ref: "concepts.md#trade-offs-and-when-to-use-what"
- id: aws-migration-modernization-078
  difficulty: advanced
  tags:
  - trade-offs
  - strangler-fig
  - big-bang
  question: |
    For decomposing a large, business-critical monolith, why is the strangler-fig pattern
    almost always preferred over a big-bang rewrite-and-switch?
  options:
  - Big-bang rewrites are cheaper and lower-risk
  - Strangler-fig is incremental, testable per slice, and reversible, whereas big-bang rewrites concentrate
    enormous risk into a single switchover and are where projects commonly fail
  - Big-bang rewrites require no new services
  - Strangler-fig avoids ever touching the database
  answer: 1
  explanation: |
    Incremental, reversible decomposition spreads and contains risk; big-bang rewrites
    bet everything on one cutover with a long no-value period and high failure rate.
    Strangler-fig still must tackle the database — it just does so gradually.
  ref: "concepts.md#trade-offs-and-when-to-use-what"