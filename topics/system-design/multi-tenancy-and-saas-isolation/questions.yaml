topic: "Multi-Tenancy & SaaS Isolation"
domain: system-design
topic_slug: multi-tenancy-and-saas-isolation
version: 1
questions:
  - id: multi-tenancy-and-saas-isolation-001
    difficulty: beginner
    tags: [fundamentals, definition]
    question: |
      In SaaS architecture, what does the term "tenant" most precisely refer to?
    options:
      - "A customer whose data and configuration must be kept separate from every other customer's"
      - "A dedicated physical server rack allocated exclusively to the application"
      - "A single microservice instance running within the application's fleet"
      - "A reusable database connection pool shared by the application's worker threads"
    answer: 0
    explanation: |
      A tenant is the unit of isolation and billing — typically a customer organization
      (B2B) or an individual/family (B2C) — whose data must be logically or physically
      separated from other tenants. It is not a server, service, or connection pool.
    ref: "concepts.md#what-multi-tenancy-is-and-why-it-matters"

  - id: multi-tenancy-and-saas-isolation-002
    difficulty: beginner
    tags: [fundamentals, cost]
    question: |
      What is the PRIMARY economic motivation for building a multi-tenant SaaS system
      instead of dedicating a full stack to each customer?
    options:
      - "It eliminates the need for authentication because tenants implicitly trust each other"
      - "It guarantees stronger data isolation than dedicated stacks"
      - "It amortizes shared infrastructure and operations across many tenants"
      - "It removes the need for a database by keeping all tenant state purely in memory"
    answer: 2
    explanation: |
      Sharing infrastructure spreads cost and operational effort (one deploy, one patch
      cycle) across all tenants, which is what makes SaaS economical at scale. Dedicated
      stacks actually give STRONGER isolation, and multi-tenancy still needs auth and a DB.
    ref: "concepts.md#what-multi-tenancy-is-and-why-it-matters"

  - id: multi-tenancy-and-saas-isolation-003
    difficulty: beginner
    tags: [isolation-spectrum, models]
    question: |
      Which multi-tenancy model provides the STRONGEST isolation but the highest cost per
      tenant and the hardest operations at scale?
    options:
      - "Pool"
      - "Bridge"
      - "Silo"
      - "Shared schema"
    answer: 2
    explanation: |
      Silo gives each tenant a dedicated stack/database — nothing tenant-bearing is shared —
      so isolation is strongest, but you pay for idle capacity per tenant and must operate a
      fleet of stacks. Pool and shared schema are the cheap/dense end; bridge is in between.
    ref: "concepts.md#the-isolation-spectrum-silo-pool-and-bridge"

  - id: multi-tenancy-and-saas-isolation-004
    difficulty: beginner
    tags: [isolation-spectrum, pool]
    question: |
      In the POOL model, how is one tenant's data typically distinguished from another's?
    options:
      - "By a dedicated database instance provisioned for each tenant"
      - "By a separate isolated network VPC allocated per tenant"
      - "By a separate Kubernetes cluster running for each tenant"
      - "By a tenant_id (discriminator) column on shared tables"
    answer: 3
    explanation: |
      Pool shares everything, including one database; rows are tagged with a tenant_id
      discriminator column and every query must filter on it. Dedicated DBs, VPCs, or
      clusters are silo/bridge techniques, not pool.
    ref: "concepts.md#the-pool-model"

  - id: multi-tenancy-and-saas-isolation-005
    difficulty: intermediate
    tags: [isolation-spectrum, spectrum]
    question: |
      An interviewer says "isolation is a spectrum, not a binary." What is the practical
      implication for your design?
    options:
      - "You must pick one model (silo, pool, or bridge) for the entire stack"
      - "You can choose a different isolation point per layer (e.g., pooled compute, siloed data)"
      - "Isolation should always be maximized to the strongest possible level regardless of cost"
      - "Isolation is only ever relevant at the network layer, so compute and data can be ignored"
    answer: 1
    explanation: |
      Because isolation is a continuum, you choose a point per layer: compute, network, and
      data can each sit at a different level. A very common design is pooled compute with
      per-tenant (siloed/bridged) data. You do not have to apply one model everywhere.
    ref: "concepts.md#the-isolation-spectrum-silo-pool-and-bridge"

  - id: multi-tenancy-and-saas-isolation-006
    difficulty: intermediate
    tags: [pool, blast-radius]
    question: |
      Which pair of risks is MOST characteristic of the pool (shared-everything) model?
    options:
      - "High per-tenant cost and poor tenant density"
      - "Slow onboarding and complex fleet patching"
      - "Impossible horizontal scaling and no code sharing"
      - "Noisy-neighbor interference and large blast radius"
    answer: 3
    explanation: |
      Pooling shares compute and one database, so one tenant's heavy load degrades everyone
      (noisy neighbor) and a bad migration or shared-table lock affects all tenants (large
      blast radius). Pool is actually cheap, dense, fast to onboard, and easy to scale — the
      opposite of the other options.
    ref: "concepts.md#the-pool-model"

  - id: multi-tenancy-and-saas-isolation-007
    difficulty: intermediate
    tags: [silo, operations]
    question: |
      Why does the silo model become operationally painful as the number of tenants grows
      into the hundreds or thousands?
    options:
      - "Because you must patch, deploy, monitor, and migrate a growing fleet of separate stacks"
      - "Because a single tenant_id integer column overflows once you exceed a few hundred tenants"
      - "Because row-level security policies stop working above 100 tenants"
      - "Because shared caches cannot be keyed per tenant once the fleet grows past a hundred entries"
    answer: 0
    explanation: |
      Silo gives each tenant its own stack, so operations (patching, deploys, monitoring,
      schema migrations, fleet-wide fixes) fan out across every stack. That operational
      sprawl — not any column limit or RLS limit — is what makes silo hard at scale.
    ref: "concepts.md#the-silo-model"

  - id: multi-tenancy-and-saas-isolation-008
    difficulty: beginner
    tags: [bridge, hybrid]
    question: |
      What is the canonical bridge (hybrid) architecture?
    options:
      - "A dedicated compute stack and database for every tenant"
      - "A single shared table with all tenants' rows and no tenant_id"
      - "A shared application tier plus a per-tenant database or schema"
      - "One database shared by all tenants with no application tier"
    answer: 2
    explanation: |
      The classic bridge shares the expensive-to-operate application/compute tier while
      giving each tenant its own database or schema — isolating the data layer while keeping
      one codebase. Fully dedicated everything is silo; one shared table is pool.
    ref: "concepts.md#the-bridge-model"

  - id: multi-tenancy-and-saas-isolation-009
    difficulty: intermediate
    tags: [bridge, trade-offs]
    question: |
      A team picks the bridge model (shared app + per-tenant database) mainly to isolate the
      data tier. Which operational challenge should they most anticipate?
    options:
      - "The application can no longer share a single codebase"
      - "Schema migrations and connection pooling must fan out across many databases"
      - "They can no longer derive tenant context from the auth token"
      - "Row-level security becomes mandatory in every database"
    answer: 1
    explanation: |
      With per-tenant databases, every schema migration must run across all databases (with
      partial-failure handling) and many databases pressure connection pools. The codebase
      stays shared (that is the point of bridge), tenant context still comes from the token,
      and RLS is optional when data is already physically separated.
    ref: "concepts.md#the-bridge-model"

  - id: multi-tenancy-and-saas-isolation-010
    difficulty: intermediate
    tags: [database, shared-schema]
    question: |
      Which database isolation approach offers the HIGHEST tenant density (most tenants per
      database) and the simplest single migration?
    options:
      - "Database-per-tenant, giving each tenant its own physically separate database"
      - "Schema-per-tenant, giving each tenant a dedicated schema inside one database"
      - "Shared database, shared schema with a tenant_id column"
      - "One dedicated physical server provisioned for every individual tenant"
    answer: 2
    explanation: |
      Shared-schema puts all tenants in the same tables discriminated by tenant_id: maximum
      density, and one migration updates all tenants at once. Schema-per-tenant and
      database-per-tenant reduce density and require running migrations per schema/DB.
    ref: "concepts.md#database-isolation-shared-schema-vs-schema-per-tenant-vs-db-per-tenant"

  - id: multi-tenancy-and-saas-isolation-011
    difficulty: intermediate
    tags: [database, backup, residency]
    question: |
      Why does database-per-tenant make per-tenant backup/restore and data residency
      dramatically easier than shared-schema?
    options:
      - "Because each tenant's data lives in a separate physical database that can be backed up, restored, or placed by region independently"
      - "Because tenant_id columns are automatically encrypted at rest and can be restored on their own"
      - "Because a shared-schema database engine forbids taking scoped point-in-time backups"
      - "Because per-tenant databases require no schema migrations once they are provisioned"
    answer: 0
    explanation: |
      With a physically separate database per tenant, you can back up, restore, encrypt, or
      locate each tenant's data on its own — including in a required region. In shared-schema
      the data is intermingled, so per-tenant restore/residency require careful scoped
      operations. (Per-tenant DBs still need migrations — run per DB.)
    ref: "concepts.md#database-isolation-shared-schema-vs-schema-per-tenant-vs-db-per-tenant"

  - id: multi-tenancy-and-saas-isolation-012
    difficulty: advanced
    tags: [database, mapping]
    question: |
      How do the three DB isolation approaches map onto the silo/pool/bridge spectrum?
    options:
      - "shared-schema ≈ silo, schema-per-tenant ≈ pool, db-per-tenant ≈ bridge"
      - "shared-schema ≈ pool, schema-per-tenant ≈ bridge, db-per-tenant ≈ silo"
      - "all three map to pool because they share the DB engine"
      - "db-per-tenant ≈ pool because it uses the same query language"
    answer: 1
    explanation: |
      Shared-schema (one table, tenant_id) is the pooled extreme; db-per-tenant (physically
      separate DB) is the siloed extreme at the data tier; schema-per-tenant sits in between,
      like bridge.
    ref: "concepts.md#database-isolation-shared-schema-vs-schema-per-tenant-vs-db-per-tenant"

  - id: multi-tenancy-and-saas-isolation-013
    difficulty: beginner
    tags: [security, data-leak]
    question: |
      What is widely considered the single most catastrophic failure mode in a shared
      (pooled) SaaS system?
    options:
      - "A slightly higher monthly cloud bill than the capacity forecast predicted"
      - "A cross-tenant data leak — one tenant seeing another tenant's data"
      - "A single cache miss on a cold start adding latency to one request"
      - "A minor UI theming inconsistency between two tenant dashboards"
    answer: 1
    explanation: |
      A cross-tenant data leak (broken object-level authorization) is the number-one SaaS
      security failure: it breaks the fundamental promise of the product and can be
      unrecoverable for the business. The other options are minor by comparison.
    ref: "concepts.md#enforcing-tenant-isolation-and-the-cross-tenant-data-leak-bug"

  - id: multi-tenancy-and-saas-isolation-014
    difficulty: intermediate
    tags: [security, tenant-context]
    question: |
      Where should the tenant_id used to scope every query come from?
    options:
      - "The server-derived authenticated principal (e.g., a JWT claim or session)"
      - "A tenant_id field in the request body or query string sent by the client"
      - "A random value freshly generated for each incoming request"
      - "The client's source IP address as seen by the load balancer"
    answer: 0
    explanation: |
      Tenant context must be derived server-side from the authenticated token/session, never
      from a client-supplied parameter. A client that can name its own tenant can name
      someone else's — the classic path to a cross-tenant leak. IP and random values are
      unrelated to tenancy.
    ref: "concepts.md#enforcing-tenant-isolation-and-the-cross-tenant-data-leak-bug"

  - id: multi-tenancy-and-saas-isolation-015
    difficulty: intermediate
    tags: [security, idor, bola]
    question: |
      A pooled API exposes `GET /invoice/{id}` and simply does `repo.findById(id)`. Why is
      this a security bug?
    options:
      - "It is slow because it fetches by id without consulting a read-through cache"
      - "It violates REST naming conventions by putting the id in the path segment"
      - "It cannot be load-balanced because findById pins the request to one node"
      - "It returns any tenant's invoice by id, ignoring who owns it (broken object-level authorization)"
    answer: 3
    explanation: |
      Trusting a client-supplied object id without checking it belongs to the caller's tenant
      is a BOLA/IDOR flaw: any authenticated user can enumerate ids and read other tenants'
      invoices. The fix is to scope by tenant, e.g., findByIdAndTenantId(id, ctx.tenantId()).
    ref: "concepts.md#enforcing-tenant-isolation-and-the-cross-tenant-data-leak-bug"

  - id: multi-tenancy-and-saas-isolation-016
    difficulty: advanced
    tags: [security, defense-in-depth]
    question: |
      Which technique reduces cross-tenant leaks by ensuring the tenant filter is applied
      WITHOUT relying on developers hand-writing `WHERE tenant_id = ?` on every query?
    options:
      - "Adding more mandatory code-review checklist items that reviewers must sign off on"
      - "Increasing the database connection-pool size so queries never wait for a connection"
      - "Centralized automatic scoping via an ORM filter/interceptor or repository base class"
      - "Renaming the tenant_id column to something shorter so it is easier to type each time"
    answer: 2
    explanation: |
      Injecting the tenant predicate centrally (ORM filter, query interceptor, repository base
      class) makes scoping automatic so a forgotten manual filter can't cause a leak.
      Checklists help but rely on humans; pool size and column names are irrelevant.
    ref: "concepts.md#enforcing-tenant-isolation-and-the-cross-tenant-data-leak-bug"

  - id: multi-tenancy-and-saas-isolation-017
    difficulty: intermediate
    tags: [caching, data-leak]
    question: |
      In a pooled system, a shared response cache is keyed only by the resource id (not the
      tenant). What is the danger?
    options:
      - "Tenant A may receive a cached response that actually belongs to tenant B"
      - "Higher memory usage only, because entries are duplicated once per requesting tenant"
      - "The cache will refuse to store any entries whose key omits the tenant discriminator"
      - "Cache eviction becomes impossible because the id-only key can never be invalidated"
    answer: 0
    explanation: |
      If the tenant id is not part of the cache key, a cached entry populated for one tenant
      can be served to another — a cross-tenant leak via the cache. Tenant-aware caches must
      include tenant_id in every key.
    ref: "concepts.md#enforcing-tenant-isolation-and-the-cross-tenant-data-leak-bug"

  - id: multi-tenancy-and-saas-isolation-018
    difficulty: advanced
    tags: [rls, postgres]
    question: |
      What is the primary value of database Row-Level Security (RLS) for tenant isolation?
    options:
      - "It removes the need for authentication entirely by trusting the database session identity"
      - "It automatically shards data across regions based on each tenant's residency requirement"
      - "It transparently compresses each tenant's rows to save storage on the shared tables"
      - "It enforces the tenant predicate in the database engine for every query, as a backstop even if application code forgets it"
    answer: 3
    explanation: |
      RLS pushes the tenant filter into the engine so it applies to every query regardless of
      what the app wrote — turning "every developer must remember" into "the DB guarantees
      it." It is a defense-in-depth backstop, not a replacement for authentication or scoping.
    ref: "concepts.md#row-level-security-rls-as-a-backstop"

  - id: multi-tenancy-and-saas-isolation-019
    difficulty: advanced
    tags: [rls, connection-pooling, gotcha]
    question: |
      You enable Postgres RLS and set the tenant with `SET app.current_tenant = '42'` on a
      pooled connection. What subtle bug can this introduce?
    options:
      - "RLS policies stop being evaluated once the connection has served 42 requests and must be re-armed"
      - "A connection returned to the pool without resetting the variable can serve the next request under the wrong tenant"
      - "The tenant_id column must be dropped from the table before session variables can take effect"
      - "Indexes on the tenant_id column are silently ignored by the planner whenever a session variable is set"
    answer: 1
    explanation: |
      Session-level SET persists on the connection; if it is returned to the pool without
      reset, the next request reusing that connection inherits the stale tenant — a leak. Use
      SET LOCAL inside a transaction or reset on checkout.
    ref: "concepts.md#row-level-security-rls-as-a-backstop"

  - id: multi-tenancy-and-saas-isolation-020
    difficulty: advanced
    tags: [rls, gotcha, roles]
    question: |
      Which condition can cause Postgres RLS policies to be silently BYPASSED, defeating your
      isolation backstop?
    options:
      - "The tenant_id column is indexed with a B-tree instead of a hash index on the shared table"
      - "The policy predicate references current_setting() rather than a hard-coded literal tenant value"
      - "The app connects as a superuser or the table owner without FORCE ROW LEVEL SECURITY (or the role has BYPASSRLS)"
      - "The table has more than one RLS policy attached, which Postgres resolves by ANDing them together"
    answer: 2
    explanation: |
      Table owners and superusers bypass RLS unless FORCE ROW LEVEL SECURITY is set, and roles
      with BYPASSRLS ignore policies entirely. Connecting with such a role silently defeats
      RLS. Indexing, current_setting(), and multiple policies do not bypass it.
    ref: "concepts.md#row-level-security-rls-as-a-backstop"

  - id: multi-tenancy-and-saas-isolation-021
    difficulty: intermediate
    tags: [authorization, isolation]
    question: |
      How does tenant isolation differ from authorization (RBAC)?
    options:
      - "They are the same mechanism, with isolation simply being the name RBAC takes on once it is enforced at the data layer"
      - "RBAC decides what actions a principal may perform; isolation guarantees the principal can only ever touch its own tenant's resources"
      - "Isolation controls which roles a user is assigned, while RBAC is what actually enforces the boundary between tenants"
      - "Isolation only ever applies to network traffic between services, while RBAC only governs access to files on disk"
    answer: 1
    explanation: |
      Authorization/RBAC governs which actions are allowed within a tenant; isolation enforces
      the tenant boundary itself. You can be correctly authorized ("admin may read all
      invoices") and still leak data if "all invoices" isn't scoped to your tenant.
    ref: "concepts.md#isolation-is-not-the-same-as-authentication-or-authorization"

  - id: multi-tenancy-and-saas-isolation-022
    difficulty: advanced
    tags: [authorization, scenario]
    question: |
      A developer argues "we have solid authentication and RBAC, so tenant isolation is
      already handled." Why is this reasoning flawed?
    options:
      - "A correctly authenticated and authorized action can still return the wrong tenant's data if the query omits the tenant scope"
      - "Authentication and RBAC are optional in SaaS once tenant isolation has been proven correct at the data layer"
      - "The RBAC policy engine automatically appends the tenant_id predicate to every query it authorizes at runtime"
      - "Authentication of the principal inherently guarantees that the tenant's data satisfies its residency requirements"
    answer: 0
    explanation: |
      AuthN proves who you are and RBAC proves you may perform an action, but neither
      guarantees the data you touch is confined to your tenant. Isolation is a data-plane
      property enforced by scoping/RLS/IAM below the feature logic — it is complementary, not
      implied by RBAC.
    ref: "concepts.md#isolation-is-not-the-same-as-authentication-or-authorization"

  - id: multi-tenancy-and-saas-isolation-023
    difficulty: advanced
    tags: [aws, iam, isolation]
    question: |
      In AWS-style architectures, how is tenant isolation often enforced at the
      infrastructure layer even if application code has a bug?
    options:
      - "By disabling IAM entirely and letting the application layer be the sole arbiter of every tenant boundary"
      - "By issuing a single shared root credential to all tenants and relying on the app to segment their access"
      - "By concatenating all tenants' records into one large shared S3 object partitioned by an internal offset"
      - "By dynamically scoping IAM credentials/session tags (e.g., DynamoDB leading-key or S3 prefix conditions) to the tenant"
    answer: 3
    explanation: |
      Tenant context can be baked into scoped-down IAM credentials so the infrastructure
      itself refuses cross-tenant access — e.g., DynamoDB leading-key conditions or S3 prefix
      conditions tied to the tenant. This backstops application bugs. Shared root credentials
      or a single shared object would destroy isolation.
    ref: "concepts.md#isolation-is-not-the-same-as-authentication-or-authorization"

  - id: multi-tenancy-and-saas-isolation-024
    difficulty: beginner
    tags: [noisy-neighbor, definition]
    question: |
      What is the "noisy neighbor" problem in a pooled multi-tenant system?
    options:
      - "Two tenants independently choosing the same username, forcing a global uniqueness collision on signup"
      - "One tenant's heavy load degrading performance/availability for other tenants sharing the resources"
      - "A tenant leaving negative public reviews that lower the product's ranking for other prospective tenants"
      - "Tenants located in different time zones sending their peak traffic during each other's off-hours"
    answer: 1
    explanation: |
      Because pooled tenants share CPU, connections, IOPS, and queues, a single tenant's
      runaway job, retry storm, or huge report can consume shared capacity and degrade
      everyone else. That interference is the noisy-neighbor problem.
    ref: "concepts.md#noisy-neighbors-and-per-tenant-quotas--rate-limits"

  - id: multi-tenancy-and-saas-isolation-025
    difficulty: intermediate
    tags: [noisy-neighbor, rate-limiting]
    question: |
      Why is a single GLOBAL rate limit insufficient to stop a noisy neighbor?
    options:
      - "A single tenant can consume the entire global budget, starving the others"
      - "Global limits are always configured too high because the total is sized for aggregate peak traffic"
      - "Global limits cannot be implemented in Redis because its counters lack the atomicity needed for fairness"
      - "Global limits only ever apply to read requests and silently ignore all writes and background jobs"
    answer: 0
    explanation: |
      A global limit bounds total traffic but does nothing to ensure fairness between
      tenants — one tenant can use up the whole allowance. Limits must be keyed by tenant_id
      so no single tenant can dominate the shared pool.
    ref: "concepts.md#noisy-neighbors-and-per-tenant-quotas--rate-limits"

  - id: multi-tenancy-and-saas-isolation-026
    difficulty: advanced
    tags: [noisy-neighbor, bulkhead]
    question: |
      Which technique isolates failure by giving each tenant tier its own connection/thread
      pool so one tenant's saturation cannot exhaust a shared resource?
    options:
      - "Sharding by hash"
      - "Bulkheading"
      - "Eventual consistency"
      - "Content delivery caching"
    answer: 1
    explanation: |
      Bulkheading partitions resources (separate connection pools, thread pools, or queues per
      tenant/tier) so saturation is contained — like watertight compartments in a ship.
      Sharding distributes data, and the other options address unrelated concerns.
    ref: "concepts.md#noisy-neighbors-and-per-tenant-quotas--rate-limits"

  - id: multi-tenancy-and-saas-isolation-027
    difficulty: intermediate
    tags: [noisy-neighbor, big-tenant]
    question: |
      A single enormous tenant repeatedly saturates a shared pooled database and dominates a
      partition. Which mitigation is a common "escape valve"?
    options:
      - "Automatically delete the heavy tenant's oldest data until its footprint stops dominating the partition"
      - "Disable the indexes on the shared table so the database spends less effort serving the heavy tenant"
      - "Ask all of the other tenants to voluntarily reduce their usage during the heavy tenant's peak hours"
      - "Promote the heavy tenant to its own silo/shard so it no longer competes with others"
    answer: 3
    explanation: |
      The standard fix for the "big tenant" skew is to move that tenant onto dedicated
      infrastructure (its own shard or silo) so it stops affecting the pool. Deleting data,
      dropping indexes, or asking others to cut usage are not viable.
    ref: "concepts.md#noisy-neighbors-and-per-tenant-quotas--rate-limits"

  - id: multi-tenancy-and-saas-isolation-028
    difficulty: intermediate
    tags: [onboarding, models]
    question: |
      Why is tenant onboarding typically near-instant in the pool model but slower in
      silo/bridge?
    options:
      - "Pool requires a manual DBA to review and approve a schema change for every single new tenant"
      - "Silo assigns one shared tenant_id to all tenants, so each new signup must wait for it to be reissued"
      - "Pool only needs to allocate a tenant_id/insert a row, whereas silo/bridge must provision new infrastructure (DB/schema/stack)"
      - "Bridge cannot onboard tenants at all once its shared application tier has already been deployed"
    answer: 2
    explanation: |
      In pool, onboarding is just allocating a tenant identifier and seeding config — no infra
      to stand up — enabling instant self-service. Silo/bridge must provision databases,
      schemas, or stacks (ideally via infrastructure-as-code), which takes minutes and needs
      idempotent, retryable automation.
    ref: "concepts.md#tenant-onboarding-and-offboarding"

  - id: multi-tenancy-and-saas-isolation-029
    difficulty: advanced
    tags: [offboarding, deletion, compliance]
    question: |
      Why is provable, complete data deletion during offboarding EASIER in db-per-tenant /
      schema-per-tenant than in a pooled shared schema?
    options:
      - "You can simply drop the tenant's database/schema, a stronger guarantee than scoped DELETEs scattered across many shared tables, caches, and indexes"
      - "Pooled shared schemas physically forbid row deletion, so offboarding cannot remove any of the tenant's data at all"
      - "Pooled tenant data is exempt from GDPR erasure obligations because it is intermingled with other tenants' rows"
      - "Dedicated schemas automatically expire and purge themselves shortly after a tenant is marked as offboarded"
    answer: 0
    explanation: |
      Dropping a tenant's dedicated database or schema is a clean, verifiable deletion. In a
      pooled schema you must run scoped deletes across every table plus caches, search
      indexes, and backups — harder to prove complete. GDPR erasure applies regardless.
    ref: "concepts.md#tenant-onboarding-and-offboarding"

  - id: multi-tenancy-and-saas-isolation-030
    difficulty: intermediate
    tags: [residency, compliance]
    question: |
      A European customer requires that all their data stay within the EU. Which approach
      most directly satisfies this per-tenant data-residency requirement?
    options:
      - "Store all tenants in one global shared table in the US and hope no one notices"
      - "Map the tenant to an EU-region deployment/shard so their database physically resides in the EU"
      - "Encrypt the data with an EU-based key while storing it in the US"
      - "Rely on RBAC rules to block any request originating from outside the EU while data stays in the US"
    answer: 1
    explanation: |
      Residency is about where data physically lives, so you route the tenant to a
      region-specific deployment/shard whose storage is in the EU. Encryption or RBAC does not
      change the physical location, and a single US table clearly violates residency.
    ref: "concepts.md#data-residency-per-tenant"

  - id: multi-tenancy-and-saas-isolation-031
    difficulty: advanced
    tags: [residency, downstream]
    question: |
      When enforcing per-tenant data residency, which commonly-overlooked components must ALSO
      respect the residency constraint?
    options:
      - "Only the primary transactional database, since replicas and derived stores inherit its region automatically"
      - "Backups, caches, search indexes, logs, and analytics pipelines"
      - "Only the load balancer, because it is the single component that decides which region a request lands in"
      - "Only the CI/CD pipeline, as build artifacts are the sole place tenant data leaves the primary region"
    answer: 1
    explanation: |
      Everything downstream of the primary store inherits residency: backups, caches, search
      indexes, logs, and analytics all hold or move tenant data and must stay in-region.
      Overlooking them is a frequent compliance gap. Load balancers and CI/CD are not the data
      residency surface.
    ref: "concepts.md#data-residency-per-tenant"

  - id: multi-tenancy-and-saas-isolation-032
    difficulty: intermediate
    tags: [customization, config]
    question: |
      What is the recommended way to deliver per-tenant customization (features, limits,
      branding) without forking the codebase?
    options:
      - "Add `if (tenant == \"BigCorp\")` branches throughout the code"
      - "Maintain a separate long-lived git branch per tenant and cherry-pick shared fixes into each one"
      - "Drive customization from a per-tenant configuration/feature-flag store the app reads at runtime"
      - "Hard-code each tenant's theme and limits into the binary and ship a fresh build for every change"
    answer: 2
    explanation: |
      Per-tenant config and feature flags let one codebase behave differently per tenant,
      resolved at runtime. Tenant-specific code branches, per-tenant branches, or hard-coded
      themes rot, don't scale, and create hidden behavior — explicit anti-patterns.
    ref: "concepts.md#per-tenant-customization-and-configuration"

  - id: multi-tenancy-and-saas-isolation-033
    difficulty: advanced
    tags: [customization, custom-fields]
    question: |
      A tenant wants to add custom fields to a shared entity without a schema migration. Which
      technique is commonly used, and what is its main trade-off?
    options:
      - "A JSONB/EAV extension column — flexible, but trades queryability and strong typing"
      - "Creating a brand-new physical table for each custom field a tenant requests — instant, free, and zero-migration"
      - "Storing each tenant's custom fields inside the load balancer's routing configuration and reading them per request"
      - "Renaming existing shared columns on the fly per request so they carry the current tenant's custom field meaning"
    answer: 0
    explanation: |
      A JSONB column or EAV pattern lets tenants add fields without altering the schema, at the
      cost of weaker typing, harder indexing, and more complex queries. The other options are
      not real customization mechanisms.
    ref: "concepts.md#per-tenant-customization-and-configuration"

  - id: multi-tenancy-and-saas-isolation-034
    difficulty: intermediate
    tags: [tiered-tenants, vertical-partitioning]
    question: |
      A SaaS company wants to offer stronger isolation to enterprise customers without
      rebuilding the whole product. Which pattern fits best?
    options:
      - "Move every tenant, including free-tier signups, into individual silos so all customers get identical isolation"
      - "Delete the free tier entirely so that only paying enterprise customers remain in the shared pooled system"
      - "Store enterprise tenants in a deliberately slower database so their heavy queries cannot affect other tiers"
      - "Vertically partition: keep most tenants pooled, and give premium/enterprise tenants dedicated (silo) deployments, routing via a tenant→deployment map"
    answer: 3
    explanation: |
      Vertical partitioning mixes models by tier: the bulk of tenants stay pooled (cheap) while
      high-value/compliance tenants get siloed deployments they pay a premium for. A
      tenant→deployment mapping routes each request. Siloing everyone defeats the cost model.
    ref: "concepts.md#tiered-tenants-mixing-models-by-tier"

  - id: multi-tenancy-and-saas-isolation-035
    difficulty: intermediate
    tags: [tiered-tenants, codebase]
    question: |
      When you support both pooled and siloed tenants simultaneously (tiered isolation), what
      must the codebase and routing layer be able to do?
    options:
      - "Assume every tenant is pooled and reject any request whose tenant turns out to live in a dedicated silo"
      - "Ship a completely separate application build per tier with no shared code so pooled and siloed paths never mix"
      - "Resolve each tenant to its correct deployment (pooled or siloed) via a tenant directory and handle both at runtime"
      - "Disable authentication for siloed tenants since their dedicated infrastructure already guarantees isolation"
    answer: 2
    explanation: |
      With mixed models, the app must look up each tenant's deployment/shard/tier in the tenant
      directory and route accordingly, supporting both pooled and siloed paths from one
      codebase. Assuming all-pooled, forking the app, or disabling auth are all wrong.
    ref: "concepts.md#tiered-tenants-mixing-models-by-tier"

  - id: multi-tenancy-and-saas-isolation-036
    difficulty: intermediate
    tags: [routing, tenant-identification]
    question: |
      Which mechanism for identifying the tenant on an incoming request is the MOST resistant
      to client spoofing?
    options:
      - "A tenant claim inside the authenticated JWT/token"
      - "A tenant_id query-string parameter appended by the client to each request URL it sends"
      - "An X-Tenant-Id header set by the client and trusted verbatim by the gateway on every call"
      - "The client's browser user-agent string, parsed to infer which tenant the caller belongs to"
    answer: 0
    explanation: |
      A tenant claim carried in the signed, authenticated token cannot be forged by the client,
      making it the most robust source of truth. Client-supplied query params, client-set
      headers, and user-agent strings can all be spoofed.
    ref: "concepts.md#tenant-routing-and-context-propagation"

  - id: multi-tenancy-and-saas-isolation-037
    difficulty: advanced
    tags: [routing, context-propagation, gotcha]
    question: |
      A background job runs with NO tenant in its context. What is the safest behavior for the
      data-access layer?
    options:
      - "Default to a reserved tenant_id of 0 and serve the query under that fallback system tenant"
      - "Perform an unscoped full-table scan across all tenants and let the caller filter the rows it wanted"
      - "Pick a random tenant from the directory and run the query within that tenant's scope"
      - "Fail hard — treat missing tenant context as an error rather than silently querying all tenants"
    answer: 3
    explanation: |
      A dropped/absent tenant context is a classic leak vector: an unscoped query returns all
      tenants' data. The access layer should make "no tenant in context" a hard failure, never
      a silent full scan, a default tenant, or a random pick.
    ref: "concepts.md#tenant-routing-and-context-propagation"

  - id: multi-tenancy-and-saas-isolation-038
    difficulty: intermediate
    tags: [routing, tenant-directory]
    question: |
      What role does the "tenant directory" (tenant→deployment/shard/region mapping) play, and
      why is it usually cached?
    options:
      - "It stores each tenant's hashed passwords and API secrets, and it is cached so the login flow can validate credentials faster"
      - "It is the authority for where each tenant's resources live, and it sits on the request hot path so it is cached aggressively"
      - "It is a monthly billing report aggregating each tenant's usage, cached so finance can regenerate invoices without re-querying"
      - "It is consulted only during the application build step to bake tenant routing tables into the deployed artifact ahead of time"
    answer: 1
    explanation: |
      The tenant directory resolves each tenant to its shard/DB/region/tier and is consulted on
      nearly every request, so it is cached for performance and must be updated atomically
      during onboarding/migration. It is not a password store, billing report, or build-time
      artifact.
    ref: "concepts.md#tenant-routing-and-context-propagation"

  - id: multi-tenancy-and-saas-isolation-039
    difficulty: intermediate
    tags: [observability, tenant-context]
    question: |
      Why should tenant_id be emitted in structured logs and metrics across the system?
    options:
      - "To reduce overall log volume by letting the pipeline discard entries that lack a tenant tag"
      - "Because the logging framework refuses to write any structured entry that is missing a tenant field"
      - "To enable per-tenant observability, debugging, and cost attribution"
      - "To automatically encrypt each log line at rest using a key derived from the tenant identifier"
    answer: 2
    explanation: |
      Tagging logs/metrics with tenant_id lets you trace issues, measure per-tenant behavior,
      detect noisy neighbors, and attribute cost/usage per tenant. It does not reduce volume,
      isn't required to write logs, and doesn't encrypt anything.
    ref: "concepts.md#tenant-routing-and-context-propagation"

  - id: multi-tenancy-and-saas-isolation-040
    difficulty: advanced
    tags: [migration, pool-to-silo, scenario]
    question: |
      What is a sound sequence for migrating a growing tenant from a pooled deployment to its
      own silo?
    options:
      - "Provision the silo, export/replay (or dual-write) the tenant's data, verify, flip the tenant→deployment mapping, then decommission the pooled rows"
      - "Delete the pooled rows first to free capacity, then provision the silo and wait for the tenant to notice the data is gone"
      - "Change the tenant_id value in the shared tables to the silo's id and rely on routing to follow it automatically"
      - "Ask the tenant to re-enter all of their historical data manually into the new silo once it is provisioned"
    answer: 0
    explanation: |
      Safe migration provisions the target, copies data (export/replay or dual-write),
      verifies parity, atomically flips routing to the silo, and only then removes the old
      pooled data. Deleting first, merely renaming tenant_id, or manual re-entry all risk data
      loss or downtime.
    ref: "concepts.md#tiered-tenants-mixing-models-by-tier"

  - id: multi-tenancy-and-saas-isolation-041
    difficulty: beginner
    tags: [fundamentals, blast-radius]
    question: |
      Which statement about "blast radius" in multi-tenancy is correct?
    options:
      - "Silo has the largest blast radius precisely because it shares nothing, so any single failure cascades to every tenant"
      - "Pool has a larger blast radius than silo because one bad deploy or shared-table problem can affect all tenants at once"
      - "Blast radius is unrelated to the tenancy model and depends only on how many availability zones the fleet spans"
      - "Bridge always has zero blast radius because its per-tenant databases make every failure fully contained to one tenant"
    answer: 1
    explanation: |
      Because pool shares infrastructure, a single failure (bad migration, shared-table lock,
      bad deploy) can take down every tenant — a large blast radius. Silo confines a failure to
      one tenant. Bridge is in between, not zero.
    ref: "concepts.md#the-pool-model"

  - id: multi-tenancy-and-saas-isolation-042
    difficulty: intermediate
    tags: [silo, compliance, tiers]
    question: |
      For which type of tenant is the silo model MOST often justified despite its cost?
    options:
      - "Free-trial users evaluating the product who have not yet committed to a paid subscription plan"
      - "Tenants with the least data, since their tiny footprint makes a dedicated stack cheap to run"
      - "Highly regulated or premium enterprise tenants requiring strong isolation, dedicated performance, or residency"
      - "Tenants who only ever make read requests and therefore place no write load on the shared database"
    answer: 2
    explanation: |
      Silo's cost is justified for regulated/enterprise tenants who need strong isolation,
      predictable performance, compliance, or data residency — and who pay a premium for it.
      Free-trial and low-data tenants belong in the pool.
    ref: "concepts.md#the-silo-model"

  - id: multi-tenancy-and-saas-isolation-043
    difficulty: advanced
    tags: [scenario, model-selection]
    question: |
      A startup expects to onboard hundreds of thousands of small self-service customers with
      thin margins and wants instant signup. Which tenancy model is the best default?
    options:
      - "Silo — a dedicated application stack and database provisioned for each individual customer at signup"
      - "Pool (shared everything with tenant_id), backed by strong automatic scoping and RLS"
      - "Db-per-tenant, giving every one of the hundreds of thousands of customers its own physical database"
      - "A separate Kubernetes cluster spun up per customer so each signup gets fully isolated compute"
    answer: 1
    explanation: |
      High-volume, low-margin, self-service SaaS needs the density, low cost, and instant
      onboarding of the pool model, protected by automatic query scoping and RLS. Silo/
      db-per-tenant/cluster-per-tenant would be economically and operationally impossible at
      that scale.
    ref: "concepts.md#the-pool-model"

  - id: multi-tenancy-and-saas-isolation-044
    difficulty: advanced
    tags: [scenario, bridge, trade-offs]
    question: |
      A B2B SaaS has ~500 mid-size customers, moderate compliance needs, and wants strong data
      isolation plus per-tenant backup while keeping one codebase and shared compute. Which
      model best fits?
    options:
      - "Pure pool with a single shared schema discriminated only by a tenant_id column across all 500 customers"
      - "Full silo with a dedicated stack and a separately maintained codebase forked per tenant"
      - "A single shared table with no tenant_id, distinguishing customers by the order in which rows were inserted"
      - "Bridge: shared application tier with a database (or schema) per tenant"
    answer: 3
    explanation: |
      Bridge gives near-silo data isolation and easy per-tenant backup while sharing the app
      tier and codebase — ideal for a few hundred customers with moderate compliance needs.
      Pure pool is weaker on isolation/backup; full silo with separate codebases is
      unnecessarily expensive; no tenant_id is a leak waiting to happen.
    ref: "concepts.md#the-bridge-model"

  - id: multi-tenancy-and-saas-isolation-045
    difficulty: intermediate
    tags: [testing, security]
    question: |
      Which automated test most directly guards against cross-tenant data leaks in a pooled
      system?
    options:
      - "Authenticate as tenant A, attempt to read tenant B's object ids, and assert the response is 403/404"
      - "A load test measuring sustained requests per second against the shared API under peak concurrency"
      - "A test that checks the homepage renders correctly and all of its navigation links resolve"
      - "A test that verifies structured log lines are formatted as valid JSON with the expected fields"
    answer: 0
    explanation: |
      A cross-tenant access test — acting as one tenant and asserting you cannot read another
      tenant's resources — directly exercises the isolation boundary and catches missing
      scoping. Load, homepage, and log-format tests do not validate isolation.
    ref: "concepts.md#enforcing-tenant-isolation-and-the-cross-tenant-data-leak-bug"
