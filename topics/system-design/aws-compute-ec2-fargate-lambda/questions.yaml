topic: "AWS Compute: EC2, Containers, Fargate and Lambda Trade-offs"
domain: system-design
topic_slug: aws-compute-ec2-fargate-lambda
version: 1
questions:
  - id: aws-compute-ec2-fargate-lambda-001
    difficulty: beginner
    tags: [compute-spectrum, fundamentals]
    question: |
      Ordering AWS compute from "you manage the most" to "you manage the least",
      which sequence is correct?
    options:
      - "EC2 → ECS/EKS on EC2 → Fargate → Lambda"
      - "Lambda → Fargate → ECS/EKS on EC2 → EC2"
      - "Fargate → EC2 → Lambda → ECS/EKS on EC2"
      - "ECS/EKS on EC2 → EC2 → Lambda → Fargate"
    answer: 0
    explanation: |
      EC2 gives you full OS/host control (most to manage), containers on EC2 add an
      orchestrator but you still own nodes, Fargate hands the host to AWS, and Lambda
      removes servers entirely (least to manage). The other orderings scramble this
      spectrum. As you move right you trade control and steady-state unit-cost
      efficiency for elasticity and lower operational burden.
    ref: "concepts.md#the-compute-spectrum-from-ec2-to-lambda"

  - id: aws-compute-ec2-fargate-lambda-002
    difficulty: beginner
    tags: [lambda, limits]
    question: |
      What is the maximum execution time for a single AWS Lambda invocation?
    options:
      - "5 minutes"
      - "15 minutes"
      - "60 minutes"
      - "Unlimited as long as it stays warm"
    answer: 1
    explanation: |
      Lambda's hard timeout is 900 seconds (15 minutes). This is a hard limit you
      cannot raise. Work that can exceed 15 minutes belongs on Fargate/ECS, AWS Batch,
      or must be chunked/orchestrated with Step Functions. "Unlimited while warm" is
      wrong — warmth affects cold starts, not the per-invocation duration cap.
    ref: "concepts.md#lambda-limits-invocation-models-and-event-sources"

  - id: aws-compute-ec2-fargate-lambda-003
    difficulty: beginner
    tags: [lambda, memory, limits]
    question: |
      What is the maximum amount of memory you can allocate to a single Lambda function?
    options:
      - "3,008 MB"
      - "512 MB"
      - "10,240 MB (10 GB)"
      - "120 GB"
    answer: 2
    explanation: |
      Lambda memory ranges 128 MB to 10,240 MB (10 GB) in 1 MB increments; CPU scales
      with memory. 3,008 MB was an older cap that has since been raised. 512 MB is the
      minimum /tmp size, not the memory cap. 120 GB is the Fargate task memory maximum,
      not Lambda.
    ref: "concepts.md#lambda-execution-model-concurrency-and-cold-starts"

  - id: aws-compute-ec2-fargate-lambda-004
    difficulty: beginner
    tags: [fargate, containers]
    question: |
      What best describes AWS Fargate?
    options:
      - "A managed Kubernetes control plane billed per cluster-hour that also patches your worker nodes"
      - "A function-as-a-service runtime limited to 15 minutes per invocation and billed per GB-second"
      - "A purchasing option that gives up to 90% discount on EC2 in exchange for interruptibility"
      - "A serverless compute engine for containers where AWS manages the underlying host, and you pay per task vCPU and memory"
    answer: 3
    explanation: |
      Fargate runs your ECS/EKS containers without you managing EC2 instances — AWS
      owns the host/kernel and you pay per running task's vCPU+memory. The k8s control
      plane description is EKS; the 90%-discount interruptible option is Spot; the
      15-minute FaaS runtime is Lambda.
    ref: "concepts.md#fargate-versus-ec2-launch-type-for-containers"

  - id: aws-compute-ec2-fargate-lambda-005
    difficulty: beginner
    tags: [ec2, purchasing, spot]
    question: |
      Which EC2 purchasing option offers the largest discount but can be reclaimed by
      AWS with a two-minute notice?
    options:
      - "Spot Instances"
      - "On-Demand"
      - "Reserved Instances"
      - "Compute Savings Plans"
    answer: 0
    explanation: |
      Spot sells spare capacity at up to ~90% off but AWS can reclaim it with a
      2-minute interruption notice. Reserved Instances and Savings Plans give discounts
      for a commitment but are not interruptible. On-Demand is the full-price,
      no-commitment baseline.
    ref: "concepts.md#ec2-purchasing-options-and-cost-trade-offs"

  - id: aws-compute-ec2-fargate-lambda-006
    difficulty: beginner
    tags: [ec2, instance-families]
    question: |
      Which EC2 instance family is optimized for memory-intensive workloads such as
      in-memory caches and large databases?
    options:
      - "C family (compute-optimized)"
      - "R family (memory-optimized)"
      - "T family (burstable)"
      - "P family (GPU)"
    answer: 1
    explanation: |
      The R family (r6i, r7g, etc.) has a high memory-to-vCPU ratio (~1:8) for
      in-memory caches, databases, and analytics. C is compute-optimized, T is
      burstable/general low-cost, and P is GPU/accelerated for ML and graphics.
    ref: "concepts.md#ec2-instance-families-and-sizing"

  - id: aws-compute-ec2-fargate-lambda-007
    difficulty: beginner
    tags: [autoscaling, asg]
    question: |
      What is the primary purpose of an EC2 Auto Scaling Group (ASG)?
    options:
      - "To store and version container images so ECS and EKS tasks can pull them at launch"
      - "To provide a managed Kubernetes control plane with a per-cluster hourly fee"
      - "To maintain a desired number of healthy instances across AZs and scale that count on demand"
      - "To pre-warm Lambda execution environments ahead of predictable traffic spikes"
    answer: 2
    explanation: |
      An ASG maintains a desired instance count across Availability Zones, replaces
      unhealthy instances, and scales the count via policies. Image storage is ECR;
      managed Kubernetes is EKS; pre-warming Lambda environments is provisioned
      concurrency.
    ref: "concepts.md#auto-scaling-groups-and-launch-templates"

  - id: aws-compute-ec2-fargate-lambda-008
    difficulty: beginner
    tags: [lambda, cold-start]
    question: |
      What is a Lambda "cold start"?
    options:
      - "The delay while an EC2 instance boots and passes health checks in an ASG"
      - "The time Lambda takes to reclaim and tear down an idle warm environment"
      - "A throttling error returned to the caller when the concurrency limit is exhausted"
      - "The latency of initializing a new execution environment before running the handler"
    answer: 3
    explanation: |
      A cold start is the INIT latency paid when Lambda spins up a fresh execution
      environment (download code, start runtime, run init code) before the first
      handler invocation. Warm environments skip it. Throttling produces a 429, not a
      cold start, and EC2 boot time is an ASG concern, not Lambda.
    ref: "concepts.md#lambda-execution-model-concurrency-and-cold-starts"

  - id: aws-compute-ec2-fargate-lambda-009
    difficulty: beginner
    tags: [ecs, eks]
    question: |
      What is a key difference between Amazon ECS and Amazon EKS?
    options:
      - "EKS is managed Kubernetes with a per-cluster control-plane fee; ECS is AWS's native orchestrator with no control-plane charge"
      - "ECS runs only on Fargate while EKS runs only on the EC2 launch type, and neither can be mixed"
      - "ECS cannot integrate with Application Load Balancers and requires a Classic Load Balancer instead"
      - "EKS cannot run containers directly and only schedules full virtual machines onto its nodes"
    answer: 0
    explanation: |
      EKS is managed Kubernetes (portable, big ecosystem) with a per-cluster
      control-plane fee (~$0.10/hr); ECS is AWS's native, simpler orchestrator with no
      control-plane charge. Both can run on EC2 or Fargate, both integrate with ALB,
      and both run containers.
    ref: "concepts.md#containers-on-aws-with-ecs-and-eks"

  - id: aws-compute-ec2-fargate-lambda-010
    difficulty: beginner
    tags: [lambda, scale-to-zero, cost]
    question: |
      A defining cost advantage of Lambda over an always-on EC2 instance is that Lambda:
    options:
      - "Is always cheaper than EC2 regardless of load or utilization level"
      - "Has zero cost when there are no invocations (scales to zero)"
      - "Never experiences latency spikes because environments stay permanently warm"
      - "Can run GPU-accelerated workloads at no additional charge beyond memory"
    answer: 1
    explanation: |
      Lambda bills per request + GB-second of actual execution and costs nothing when
      idle (scales to zero), which is ideal for spiky/low-average load. It is NOT
      always cheaper — at steady high load reserved EC2/Fargate wins. Lambda has cold
      starts (latency spikes) and no GPU support.
    ref: "concepts.md#cost-and-operational-burden-trade-offs"

  - id: aws-compute-ec2-fargate-lambda-011
    difficulty: beginner
    tags: [graviton, cost]
    question: |
      What is the main benefit of choosing AWS Graviton (arm64) instances such as m7g
      or c7g?
    options:
      - "They uniquely support Windows Server workloads that x86 instances are unable to run"
      - "They guarantee zero cold starts by keeping the ARM runtime resident between requests"
      - "They typically offer better price/performance (often ~20% cheaper) for compatible workloads"
      - "They are the only instance type that AWS permits inside an Auto Scaling Group"
    answer: 2
    explanation: |
      Graviton ARM CPUs usually deliver better price/performance (often ~20% cheaper,
      ~40% better price/perf) for software that runs on ARM. The trade-off is needing
      ARM-compatible builds. They don't uniquely enable Windows, don't affect cold
      starts, and any instance type can go in an ASG.
    ref: "concepts.md#ec2-instance-families-and-sizing"

  - id: aws-compute-ec2-fargate-lambda-012
    difficulty: beginner
    tags: [launch-template, autoscaling]
    question: |
      In modern EC2 Auto Scaling, what does a launch template define?
    options:
      - "The CloudWatch scaling metric thresholds and cooldown periods for the group only"
      - "The Lambda concurrency reservation that guarantees the group a slice of capacity"
      - "The DNS routing and weighted failover rules that Route 53 applies to the fleet"
      - "The versioned instance recipe: AMI, instance type(s), security groups, IAM profile, user-data, and mixed-instances options"
    answer: 3
    explanation: |
      A launch template is the versioned recipe for instances the ASG launches (AMI,
      instance types, key pair, security groups, user-data, IAM instance profile,
      mixed-instances policy). Scaling thresholds are scaling policies; DNS is Route 53;
      concurrency reservation is a Lambda setting.
    ref: "concepts.md#auto-scaling-groups-and-launch-templates"

  - id: aws-compute-ec2-fargate-lambda-013
    difficulty: beginner
    tags: [lambda, payload, limits]
    question: |
      What is the synchronous invocation payload limit for AWS Lambda (request and
      response)?
    options:
      - "6 MB"
      - "1 MB"
      - "256 KB"
      - "10 GB"
    answer: 0
    explanation: |
      Synchronous invocations are limited to 6 MB for request and 6 MB for response
      (response streaming allows up to 200 MB). Asynchronous invocations are capped at
      1 MB. 10 GB is the container image / memory-adjacent limit, not payload. For
      large blobs use the claim-check pattern via S3.
    ref: "concepts.md#lambda-limits-invocation-models-and-event-sources"

  - id: aws-compute-ec2-fargate-lambda-014
    difficulty: beginner
    tags: [serverless, anti-pattern]
    question: |
      Which workload is the clearest anti-pattern for AWS Lambda?
    options:
      - "A rarely-invoked image-thumbnail generator triggered by S3 uploads"
      - "A GPU-based machine-learning training job that runs for two hours"
      - "A lightweight webhook handler with unpredictable spiky traffic"
      - "A cron-style cleanup task that runs for 30 seconds nightly"
    answer: 1
    explanation: |
      A 2-hour GPU training job violates two Lambda constraints at once: the 15-minute
      timeout and the lack of GPU support — use EC2/ECS GPU instances or Batch. The
      other three (spiky, event-driven, short) are textbook Lambda fits.
    ref: "concepts.md#when-serverless-is-the-wrong-choice"

  - id: aws-compute-ec2-fargate-lambda-015
    difficulty: intermediate
    tags: [ec2, purchasing, savings-plans]
    question: |
      A team wants a large steady-state discount but keeps changing instance families
      and regions as they optimize, and also uses some Fargate and Lambda. Which
      commitment best fits?
    options:
      - "Standard Reserved Instances locked to one family and region for a one-year term"
      - "Spot Instances only, accepting two-minute reclamation notices to chase the deepest discount"
      - "Compute Savings Plans committing to a dollars-per-hour of compute spend"
      - "On-Demand only, to keep maximum flexibility while forgoing any commitment discount"
    answer: 2
    explanation: |
      Compute Savings Plans commit to $/hour of compute and apply automatically across
      EC2 families, regions, Fargate, and Lambda — ideal when the mix keeps changing.
      Standard RIs are rigid (locked family/region). Spot is interruptible, not a
      steady-baseline discount. On-Demand gives flexibility but no discount.
    ref: "concepts.md#ec2-purchasing-options-and-cost-trade-offs"

  - id: aws-compute-ec2-fargate-lambda-016
    difficulty: intermediate
    tags: [lambda, concurrency]
    question: |
      A Lambda function receives 500 simultaneous requests, each taking 2 seconds. How
      many execution environments (concurrency) does Lambda need?
    options:
      - "1 — one environment multiplexes all requests"
      - "2 — one per second of duration"
      - "50 — Lambda batches 10 requests per environment"
      - "500 — each environment serves exactly one request at a time"
    answer: 3
    explanation: |
      Each Lambda execution environment handles exactly one request at a time, so 500
      concurrent requests require 500 concurrent environments. There is no per-environment
      multiplexing or batching of synchronous invocations. If this exceeds your
      concurrency limit you get throttled (429).
    ref: "concepts.md#lambda-execution-model-concurrency-and-cold-starts"

  - id: aws-compute-ec2-fargate-lambda-017
    difficulty: intermediate
    tags: [lambda, provisioned-concurrency, trade-off]
    question: |
      What is the primary trade-off of enabling Lambda provisioned concurrency?
    options:
      - "It removes cold starts but reintroduces idle cost because you pay for warm environments whether used or not"
      - "It doubles the maximum function timeout from 15 to 30 minutes for warmed environments"
      - "It allows GPU access at the cost of higher per-GB-second memory charges"
      - "It removes the 6 MB payload limit but slows down invocations"
    answer: 0
    explanation: |
      Provisioned concurrency keeps N environments pre-initialized so those requests
      never hit a cold start — but you pay for that warm capacity regardless of use,
      eroding the "scale to zero" benefit. It does not change the timeout, GPU support,
      or payload limits.
    ref: "concepts.md#lambda-execution-model-concurrency-and-cold-starts"

  - id: aws-compute-ec2-fargate-lambda-018
    difficulty: intermediate
    tags: [fargate, ec2-launch-type, trade-off]
    question: |
      A startup runs a dozen small, bursty microservices as containers and has a
      two-person ops team that wants to avoid patching and bin-packing hosts. EC2
      launch type or Fargate?
    options:
      - "EC2 launch type, because it is always cheaper"
      - "Fargate, to eliminate node management and right-size per task"
      - "EC2 launch type with Spot only, to minimize cost"
      - "Neither — they must use raw EC2 without containers"
    answer: 1
    explanation: |
      Fargate removes host patching and bin-packing and lets you right-size each task —
      ideal for a small team with many bursty services. EC2 launch type is cheaper only
      at steady high density and adds node-management burden. Spot-only would risk
      interruptions for services that may not tolerate them.
    ref: "concepts.md#fargate-versus-ec2-launch-type-for-containers"

  - id: aws-compute-ec2-fargate-lambda-019
    difficulty: intermediate
    tags: [ec2, t-family, burstable]
    question: |
      A service runs steadily at ~80% CPU on a t3 (burstable) instance and users report
      periodic slowdowns. What is the most likely cause and fix?
    options:
      - "The instance ran out of memory and is swapping to disk; move to an R family memory-optimized instance"
      - "The Auto Scaling Group is misconfigured and flapping; disable Auto Scaling to stabilize the fleet"
      - "CPU credits are being exhausted, throttling to baseline; move to an M or C instance (or enable T-unlimited)"
      - "Repeated cold starts on the instance; enable provisioned concurrency to keep it warm"
    answer: 2
    explanation: |
      T-family instances accrue CPU credits when idle and spend them under load; a
      sustained ~80% CPU exhausts credits and throttles the instance to its baseline
      (e.g. 20–40% of a vCPU), causing periodic slowdowns. Move to a non-burstable M/C
      instance or enable T-unlimited. Memory, ASG, and cold starts are unrelated here.
    ref: "concepts.md#ec2-instance-families-and-sizing"

  - id: aws-compute-ec2-fargate-lambda-020
    difficulty: intermediate
    tags: [lambda, cost, memory-tuning]
    question: |
      Counterintuitively, increasing a CPU-bound Lambda's memory from 512 MB to 1,792 MB
      can *reduce* its cost. Why?
    options:
      - "Higher memory tiers qualify for an automatic volume discount on the per-request charge"
      - "The synchronous payload limit rises with memory, letting you batch and reduce the number of invocations"
      - "Lambda waives the init-phase (cold-start) billing entirely once memory exceeds 1 GB"
      - "CPU is allocated proportionally to memory, so the function finishes faster and total GB-seconds drop"
    answer: 3
    explanation: |
      Lambda allocates CPU in proportion to memory (≈1 vCPU at 1,769 MB). A CPU-bound
      function with more CPU finishes faster, so the duration drops enough that
      GB-seconds (memory × time) — and thus cost — decrease despite the higher memory
      setting. There is no request volume discount, cold-start waiver, or payload effect.
    ref: "concepts.md#lambda-execution-model-concurrency-and-cold-starts"

  - id: aws-compute-ec2-fargate-lambda-021
    difficulty: intermediate
    tags: [lambda, api-gateway, timeout]
    question: |
      You put a Lambda behind Amazon API Gateway (REST) for a synchronous request. What
      is the effective maximum time the client can wait for a response?
    options:
      - "29 seconds — API Gateway's integration timeout caps it"
      - "900 seconds — the client waits the full Lambda timeout end to end"
      - "6 seconds — the wait is capped to match the 6 MB payload limit"
      - "300 seconds — the default ALB idle timeout governs the request"
    answer: 0
    explanation: |
      API Gateway enforces a 29-second integration timeout, so even though Lambda can
      run 15 minutes, a request/response path through API Gateway can't wait that long.
      Long tasks should be made asynchronous (return a job id, process in the
      background). The 6 s and 300 s figures are unrelated.
    ref: "concepts.md#lambda-limits-invocation-models-and-event-sources"

  - id: aws-compute-ec2-fargate-lambda-022
    difficulty: intermediate
    tags: [lambda, async, retry, dlq]
    question: |
      For an asynchronous (event) Lambda invocation that keeps failing, what does
      Lambda do by default?
    options:
      - "Returns the error synchronously to the caller for it to retry"
      - "Retries twice, then sends the event to a dead-letter queue or on-failure destination if configured"
      - "Retries indefinitely with exponential backoff until the event eventually succeeds"
      - "Discards the event immediately on the first failure without any retry attempt"
    answer: 1
    explanation: |
      Async invocations are queued by Lambda; on failure it retries twice (three
      attempts total) with backoff, then routes the event to a configured DLQ or
      on-failure destination. It does not return errors to the caller (that's the sync
      model), retry forever, or drop on first failure.
    ref: "concepts.md#lambda-limits-invocation-models-and-event-sources"

  - id: aws-compute-ec2-fargate-lambda-023
    difficulty: intermediate
    tags: [spot, batch, design]
    question: |
      Which workload is the BEST fit for EC2 Spot Instances?
    options:
      - "The primary node of a stateful relational database"
      - "A payment-processing API with a strict 99.99% availability SLA on a single instance"
      - "A fault-tolerant, checkpointable batch rendering job that can be retried"
      - "A stateful in-memory session store with no replication"
    answer: 2
    explanation: |
      Spot suits stateless, fault-tolerant, checkpointable, retry-safe work like batch
      rendering — a 2-minute reclamation notice is tolerable there. A stateful DB
      primary, a single-instance high-SLA payment API, and an unreplicated session store
      would all suffer data loss or outage on interruption.
    ref: "concepts.md#ec2-purchasing-options-and-cost-trade-offs"

  - id: aws-compute-ec2-fargate-lambda-024
    difficulty: intermediate
    tags: [autoscaling, scaling-policy]
    question: |
      For a web tier whose traffic varies smoothly through the day, which ASG scaling
      policy is the simplest good default?
    options:
      - "Manual scaling adjusted by an on-call engineer"
      - "No scaling; over-provision for peak permanently"
      - "Scheduled scaling only, based on a fixed clock"
      - "Target tracking on average CPU or ALBRequestCountPerTarget"
    answer: 3
    explanation: |
      Target tracking keeps a chosen metric (avg CPU, or requests-per-target) at a set
      value and is the recommended simple default for variable load. Manual scaling
      doesn't react automatically, scheduled-only ignores unexpected variation, and
      permanent over-provisioning wastes money.
    ref: "concepts.md#auto-scaling-groups-and-launch-templates"

  - id: aws-compute-ec2-fargate-lambda-025
    difficulty: intermediate
    tags: [ecs, eks, decision]
    question: |
      A green-field, AWS-only team with no Kubernetes experience wants to run containers
      with minimal operational overhead. Which orchestrator is the better default?
    options:
      - "ECS, for lower operational overhead and no control-plane fee"
      - "EKS, for its cross-cloud portability and the broad Kubernetes tooling ecosystem"
      - "Self-managed Kubernetes on raw EC2, wiring up the control plane and nodes by hand"
      - "Neither container orchestrator; they should build everything on Lambda functions instead"
    answer: 0
    explanation: |
      For an AWS-only shop with no k8s requirement, ECS gives the lowest ops overhead,
      deep AWS integration, and no control-plane fee. EKS adds Kubernetes complexity and
      a per-cluster charge, justified mainly by portability or existing k8s tooling.
      Self-managed k8s is the highest burden.
    ref: "concepts.md#containers-on-aws-with-ecs-and-eks"

  - id: aws-compute-ec2-fargate-lambda-026
    difficulty: intermediate
    tags: [fargate, gpu, limits]
    question: |
      A container needs a GPU for real-time inference. Can it run on Fargate?
    options:
      - "Yes, Fargate offers dedicated GPU task sizes with up to 4 attached NVIDIA GPUs"
      - "No — Fargate has no GPU support; use ECS/EKS on GPU EC2 instances"
      - "Yes, but only when provisioned concurrency is enabled to reserve the GPU"
      - "Only if the container image is smaller than the 10 GB Fargate image ceiling"
    answer: 1
    explanation: |
      Fargate does not support GPUs. GPU containers must run on the EC2 launch type
      using GPU instance families (P/G) via ECS or EKS. Provisioned concurrency is a
      Lambda feature, and image size limits are unrelated to GPU availability.
    ref: "concepts.md#fargate-versus-ec2-launch-type-for-containers"

  - id: aws-compute-ec2-fargate-lambda-027
    difficulty: intermediate
    tags: [lambda, event-source, sqs]
    question: |
      A Lambda scaling to thousands of concurrent executions is overwhelming a small
      RDS database with connections. Which combination best mitigates this?
    options:
      - "Increase the Lambda timeout to the full 15 minutes so connections are held longer"
      - "Switch the function to a larger memory size so each environment opens fewer connections"
      - "Use RDS Proxy for connection pooling and set reserved concurrency to cap the function"
      - "Move the database to a much bigger RDS instance class and change nothing else"
    answer: 2
    explanation: |
      RDS Proxy pools and reuses DB connections so a fanned-out Lambda fleet doesn't
      open a connection storm, and reserved concurrency caps how many environments (and
      thus connections) can exist. Raising timeout or memory doesn't reduce connection
      count; a bigger DB alone still gets flooded and costs more.
    ref: "concepts.md#failure-modes-and-how-designs-degrade"

  - id: aws-compute-ec2-fargate-lambda-028
    difficulty: intermediate
    tags: [cost, crossover, decision]
    question: |
      A stateless API runs at a steady ~70% CPU utilization 24×7, all year. From a pure
      cost standpoint, which is generally most economical?
    options:
      - "Lambda with provisioned concurrency sized to the steady 70% load"
      - "A Spot-only fleet with no On-Demand baseline, chasing the deepest discount"
      - "On-Demand EC2 with no commitment, keeping full flexibility year-round"
      - "Right-sized EC2/Fargate purchased with a Compute Savings Plan"
    answer: 3
    explanation: |
      At steady high utilization the flat committed rate of reserved EC2/Fargate
      (Savings Plans) beats per-invocation Lambda pricing — this is the cost crossover.
      Lambda (even provisioned) and On-Demand cost more here; a Spot-only fleet risks
      interruption for a persistent production API.
    ref: "concepts.md#cost-and-operational-burden-trade-offs"

  - id: aws-compute-ec2-fargate-lambda-029
    difficulty: intermediate
    tags: [lambda, tmp, ephemeral]
    question: |
      What is the configurable range of Lambda's /tmp (ephemeral) storage?
    options:
      - "512 MB to 10,240 MB (10 GB)"
      - "Fixed at 512 MB, not configurable"
      - "20 GB to 200 GB"
      - "128 MB to 3,008 MB"
    answer: 0
    explanation: |
      Lambda /tmp is configurable from 512 MB up to 10,240 MB (10 GB). It used to be
      fixed at 512 MB, which is now just the minimum. The 20–200 GB range is Fargate
      ephemeral storage, and 128–3,008 MB describes an old memory range.
    ref: "concepts.md#lambda-limits-invocation-models-and-event-sources"

  - id: aws-compute-ec2-fargate-lambda-030
    difficulty: intermediate
    tags: [fargate, resources, limits]
    question: |
      What are the approximate maximum vCPU and memory for a single Fargate task?
    options:
      - "4 vCPU and 30 GB"
      - "16 vCPU and 120 GB"
      - "96 vCPU and 768 GB"
      - "1 vCPU and 10 GB"
    answer: 1
    explanation: |
      A Fargate task scales up to 16 vCPU and 120 GB of memory (with constrained
      CPU/memory pairings). 4 vCPU/30 GB is a mid-tier combo, 96 vCPU/768 GB describes
      large EC2 instances, and 1 vCPU/10 GB is roughly Lambda's ceiling, not Fargate's.
    ref: "concepts.md#fargate-versus-ec2-launch-type-for-containers"

  - id: aws-compute-ec2-fargate-lambda-031
    difficulty: intermediate
    tags: [spot, diversification, design]
    question: |
      What is the recommended way to reduce the risk that Spot capacity reclamation
      drains your entire fleet at once?
    options:
      - "Standardize on one large instance type within a single AZ for predictable consistency"
      - "Disable Auto Scaling so reclaimed instances are never replaced and the fleet stays fixed"
      - "Diversify across many instance types and AZs (mixed instances / capacity-optimized) and keep an On-Demand baseline"
      - "Run everything on the single newest instance generation to get the freshest capacity pool"
    answer: 2
    explanation: |
      Diversifying across many instance types and AZs (mixed-instances policy,
      capacity-optimized allocation) plus an On-Demand/Savings-Plan baseline prevents
      one Spot pool's reclamation from draining the fleet. A single type/AZ concentrates
      risk; disabling scaling doesn't help; one generation still concentrates one pool.
    ref: "concepts.md#ec2-purchasing-options-and-cost-trade-offs"

  - id: aws-compute-ec2-fargate-lambda-032
    difficulty: intermediate
    tags: [lambda, package-size, container]
    question: |
      What is the maximum size of a Lambda function packaged as a container image?
    options:
      - "50 MB"
      - "250 MB"
      - "512 MB"
      - "10 GB"
    answer: 3
    explanation: |
      Container-image Lambda functions can be up to 10 GB (uncompressed). The zip
      deployment package is 50 MB zipped / 250 MB unzipped (including layers). This is
      why very large dependency sets (ML models, big runtimes) use the container image
      format rather than zip.
    ref: "concepts.md#lambda-limits-invocation-models-and-event-sources"

  - id: aws-compute-ec2-fargate-lambda-033
    difficulty: intermediate
    tags: [ops-burden, tco, decision]
    question: |
      Why might a slightly more expensive serverless option be the cheaper *total* choice
      for a small team?
    options:
      - "Because total cost of ownership includes operational labor and time-to-market, which serverless reduces by removing patching, scaling, and capacity planning"
      - "Because serverless functions incur no AWS usage bill of any kind whatsoever"
      - "Because AWS automatically refunds the price difference versus an equivalent EC2 fleet"
      - "Because serverless always delivers strictly higher throughput than provisioned servers"
    answer: 0
    explanation: |
      TCO is the bill PLUS engineering labor PLUS opportunity cost of time-to-market.
      Serverless removes patching, scaling tuning, and capacity planning, so the
      engineering time saved can outweigh a higher compute bill. There is no zero-bill,
      refund, or guaranteed-throughput mechanism.
    ref: "concepts.md#cost-and-operational-burden-trade-offs"

  - id: aws-compute-ec2-fargate-lambda-034
    difficulty: intermediate
    tags: [azaz, resilience, asg]
    question: |
      An ASG spans three AZs with just enough capacity to serve peak. One AZ fails. Why
      might users still see a brownout?
    options:
      - "Auto Scaling Groups are unable to launch any replacement instances once an AZ has failed"
      - "Without per-AZ headroom (N+1), the surviving AZs lack spare capacity and scaling to replace the lost third takes tens of seconds to minutes"
      - "Route 53 automatically halts all inbound traffic to the service for the duration of an AZ failure"
      - "Lambda concurrency limits are exhausted by the failover and block the ASG from serving"
    answer: 1
    explanation: |
      If capacity is sized to exactly peak with no per-AZ headroom, losing an AZ removes
      ~1/3 of capacity, and relaunching replacements takes instance boot + warmup time,
      causing a temporary brownout. Design for N+1 across AZs. ASGs do relaunch, Route 53
      doesn't halt traffic, and Lambda limits are irrelevant here.
    ref: "concepts.md#failure-modes-and-how-designs-degrade"

  - id: aws-compute-ec2-fargate-lambda-035
    difficulty: intermediate
    tags: [lambda, claim-check, payload]
    question: |
      A workflow needs to pass a 50 MB file between steps that invoke Lambda
      synchronously. What is the right pattern?
    options:
      - "Base64-encode the entire file inline into the synchronous invocation payload"
      - "Raise the synchronous request payload limit from 6 MB to 100 MB via a Service Quotas request"
      - "Use the claim-check pattern: store the file in S3 and pass the object pointer in the payload"
      - "Split the file into six separate 6 MB synchronous payloads and reassemble downstream"
    answer: 2
    explanation: |
      The synchronous payload cap is 6 MB and cannot be raised, so a 50 MB file must use
      the claim-check pattern — put the blob in S3 and pass a reference. Base64 makes it
      larger, the limit isn't adjustable, and splitting adds fragile complexity for no
      benefit.
    ref: "concepts.md#lambda-limits-invocation-models-and-event-sources"

  - id: aws-compute-ec2-fargate-lambda-036
    difficulty: intermediate
    tags: [fargate-spot, cost, containers]
    question: |
      Which statement about Fargate Spot is correct?
    options:
      - "It provides GPU access to containers that regular Fargate cannot offer"
      - "It guarantees that running tasks are never interrupted or reclaimed by AWS"
      - "It works exclusively with EKS clusters and is unavailable on ECS"
      - "It offers a discount (up to ~70%) for interruption-tolerant tasks but tasks can be reclaimed"
    answer: 3
    explanation: |
      Fargate Spot gives up to ~70% off for interruption-tolerant workloads, but like
      EC2 Spot the tasks can be reclaimed. It is not interruption-proof, works with ECS,
      and does not add GPU support (Fargate has none).
    ref: "concepts.md#fargate-versus-ec2-launch-type-for-containers"

  - id: aws-compute-ec2-fargate-lambda-037
    difficulty: intermediate
    tags: [lambda, reserved-concurrency]
    question: |
      What does setting reserved concurrency on a Lambda function do?
    options:
      - "Guarantees that function a slice of account concurrency AND caps it at that value"
      - "Keeps a pool of execution environments pre-warmed so requests skip cold starts"
      - "Extends the function's per-invocation timeout ceiling past the 15-minute cap"
      - "Automatically provisions an RDS Proxy pool in front of the function's database"
    answer: 0
    explanation: |
      Reserved concurrency carves out a guaranteed portion of the account's concurrency
      for a function and simultaneously caps the function at that number — useful to
      protect a critical function or to protect a fragile downstream from overload.
      Pre-warming is provisioned concurrency; it doesn't change timeouts or set up RDS
      Proxy.
    ref: "concepts.md#lambda-execution-model-concurrency-and-cold-starts"

  - id: aws-compute-ec2-fargate-lambda-038
    difficulty: intermediate
    tags: [decision, long-running]
    question: |
      An ETL job processes large files and typically runs 20–40 minutes. Which compute
      choice is appropriate?
    options:
      - "Lambda at maximum memory so the extra CPU squeezes the job under the 15-minute cap"
      - "A Fargate task or AWS Batch job (optionally orchestrated by Step Functions)"
      - "API Gateway fronting a synchronous Lambda that streams the file back to the caller"
      - "A single burstable t3.micro instance relying on accrued CPU credits for the run"
    answer: 1
    explanation: |
      A 20–40 minute job exceeds Lambda's 15-minute hard cap, so use a Fargate/ECS task
      or AWS Batch (Step Functions can orchestrate/chunk). More Lambda memory can't beat
      the timeout for a genuinely long job; API Gateway adds a 29 s cap; a t3.micro would
      throttle on sustained CPU.
    ref: "concepts.md#when-serverless-is-the-wrong-choice"

  - id: aws-compute-ec2-fargate-lambda-039
    difficulty: intermediate
    tags: [queue-based-load-leveling, pattern]
    question: |
      A synchronous endpoint sees sudden 100x traffic spikes that overwhelm downstream
      processing. Which pattern smooths this best?
    options:
      - "Vertically scale the downstream to its theoretical 100x peak and keep it there permanently"
      - "Remove the load balancer so requests hit the downstream directly and shave a network hop"
      - "Queue-based load leveling: place SQS between producer and consumer so consumers process at a safe steady rate"
      - "Switch clients to tight synchronous retries with no backoff to push failed calls through faster"
    answer: 2
    explanation: |
      Putting a queue (SQS) between producer and consumer decouples them and lets the
      consumer drain at a safe, steady rate, absorbing spikes — queue-based load
      leveling. Permanent peak provisioning wastes money, removing the LB hurts
      distribution, and retries without backoff amplify overload.
    ref: "concepts.md#failure-modes-and-how-designs-degrade"

  - id: aws-compute-ec2-fargate-lambda-040
    difficulty: intermediate
    tags: [lambda, cost-estimation]
    question: |
      A function at 128 MB runs 100 ms average and is invoked 50 million times/month.
      Roughly how many GB-seconds of compute does it consume monthly?
    options:
      - "About 50,000,000 GB-seconds"
      - "About 5,000,000 GB-seconds"
      - "About 6,250 GB-seconds"
      - "About 625,000 GB-seconds"
    answer: 3
    explanation: |
      GB-seconds = invocations × duration(s) × memory(GB) = 50,000,000 × 0.1 ×
      (128/1024 = 0.125) = 625,000 GB-seconds. This is a few dollars of compute plus the
      per-request charge — the kind of back-of-envelope estimate interviewers expect.
    ref: "concepts.md#cost-and-operational-burden-trade-offs"

  - id: aws-compute-ec2-fargate-lambda-041
    difficulty: advanced
    tags: [lambda, scaling-rate, burst]
    question: |
      Under the current Lambda scaling model, what is the per-function burst limit for
      spinning up new execution environments?
    options:
      - "Up to 1,000 new execution environments every 10 seconds, per function"
      - "A single shared account-level burst pool of 500–3,000 environments depending on Region"
      - "Unlimited instant scaling with no rate limit, bounded only by the account concurrency cap"
      - "Exactly 100 new environments per minute, per function, ramping linearly after that"
    answer: 0
    explanation: |
      The modern model allows each function to scale by up to 1,000 new execution
      environments every 10 seconds, independent of other functions — replacing the old
      shared account-level burst pool (500–3,000/region). It is neither unlimited/instant
      nor as slow as 100/minute.
    ref: "concepts.md#lambda-execution-model-concurrency-and-cold-starts"

  - id: aws-compute-ec2-fargate-lambda-042
    difficulty: advanced
    tags: [lambda, vpc, cold-start]
    question: |
      A senior candidate is asked about VPC-attached Lambda cold starts. Which statement
      is most accurate today?
    options:
      - "VPC attachment still adds ~10 seconds of per-environment ENI provisioning to every cold start"
      - "The historical multi-second ENI penalty was largely eliminated by the Hyperplane shared-ENI improvement in 2019"
      - "VPC-attached Lambdas skip the INIT phase entirely and therefore cannot have cold starts at all"
      - "VPC attachment lifts the 15-minute timeout so functions in a VPC can run indefinitely"
    answer: 1
    explanation: |
      Before 2019, attaching a Lambda to a VPC created an ENI per environment, adding
      seconds of cold-start latency. The Hyperplane shared-ENI architecture largely
      removed that penalty — it's now a classic "gotcha" that's mostly historical. VPC
      Lambdas still have ordinary cold starts and the same 15-minute cap.
    ref: "concepts.md#lambda-execution-model-concurrency-and-cold-starts"

  - id: aws-compute-ec2-fargate-lambda-043
    difficulty: advanced
    tags: [lambda, kinesis, poison-pill]
    question: |
      A Lambda consumes a Kinesis Data Stream via event source mapping. One malformed
      record keeps failing. What happens and how do you handle it?
    options:
      - "Kinesis silently drops the failing record after the first attempt and moves on to the next"
      - "Lambda automatically reshards the stream to route the bad record onto an isolated shard"
      - "The batch retries and can block that shard until the record expires; configure bisect-on-error, max-retry-age, and an on-failure destination"
      - "The record is fanned out to every other shard so a healthy consumer can reprocess it"
    answer: 2
    explanation: |
      Kinesis/DynamoDB Streams preserve per-shard order, so a poison-pill batch retries
      and can block the shard until the record expires. Mitigate with bisect-on-error
      (split the batch to isolate the bad record), a max retry age, and an on-failure
      destination/DLQ. Kinesis doesn't silently drop, auto-reshard, or fan the record to
      other shards.
    ref: "concepts.md#lambda-limits-invocation-models-and-event-sources"

  - id: aws-compute-ec2-fargate-lambda-044
    difficulty: advanced
    tags: [lambda, snapstart, java, cold-start]
    question: |
      A Java Lambda has multi-second cold starts hurting p99 latency, but the team wants
      to avoid paying for always-warm capacity. Which mitigation fits best?
    options:
      - "Provisioned concurrency sized to the whole expected peak so no request cold-starts"
      - "Move the workload to a burstable t3 EC2 instance and keep the JVM resident between requests"
      - "Rewrite the function to run a full 15 minutes so the one-time cold start is amortized away"
      - "Lambda SnapStart, which snapshots the initialized VM and restores it to cut init latency without paying for idle warm capacity"
    answer: 3
    explanation: |
      SnapStart snapshots the initialized (post-INIT) execution environment and restores
      from it, dramatically reducing Java cold-start latency without the ongoing idle
      cost of provisioned concurrency. Full provisioned concurrency solves cold starts
      but reintroduces idle cost; artificially lengthening runtime and moving to EC2 miss
      the point.
    ref: "concepts.md#lambda-execution-model-concurrency-and-cold-starts"

  - id: aws-compute-ec2-fargate-lambda-045
    difficulty: advanced
    tags: [cell-based, blast-radius, resilience]
    question: |
      To limit blast radius so a single bad tenant or partial failure can't take down all
      customers, which architectural pattern applies?
    options:
      - "Cell-based architecture: partition into independent cells, each a full stack serving a subset of customers"
      - "Run one giant shared multi-tenant instance for efficiency and route all customers through it"
      - "Disable Auto Scaling to keep the fleet static so a bad tenant cannot trigger a scale event"
      - "Use a single global database with no partitioning so every tenant reads a consistent view"
    answer: 0
    explanation: |
      Cell-based architecture partitions the system into independent cells, each a
      complete stack serving a slice of customers, so a failure or poison tenant is
      contained to one cell. A single giant instance or global unpartitioned database
      maximizes blast radius; disabling scaling doesn't isolate failures.
    ref: "concepts.md#failure-modes-and-how-designs-degrade"

  - id: aws-compute-ec2-fargate-lambda-046
    difficulty: advanced
    tags: [fargate, ec2, cost, density]
    question: |
      A batch platform runs thousands of containers at sustained high utilization. It is
      currently on Fargate and the bill is high. What is the strongest cost lever?
    options:
      - "Move the containers to Lambda so per-invocation pricing replaces the per-task Fargate charge"
      - "Move to the ECS/EKS EC2 launch type with dense bin-packing plus Spot and Savings Plans"
      - "Increase each Fargate task's memory allocation so tasks finish faster and free capacity sooner"
      - "Add an API Gateway in front of the batch workers to cache responses and cut compute time"
    answer: 1
    explanation: |
      At sustained high utilization, EC2-launch-type containers let you densely pack many
      containers per instance and buy that capacity cheaply with Spot (for
      interruption-tolerant batch) and Savings Plans — materially cheaper than
      per-task Fargate. Lambda is worse at steady high load, bigger tasks don't cut unit
      cost, and API Gateway caching is irrelevant to batch compute cost.
    ref: "concepts.md#fargate-versus-ec2-launch-type-for-containers"

  - id: aws-compute-ec2-fargate-lambda-047
    difficulty: advanced
    tags: [autoscaling, warm-pool, predictive]
    question: |
      An ASG-backed service faces sharp, predictable morning spikes, but instance boot +
      app warmup takes ~3 minutes, causing brownouts at the spike. Which options
      directly address the launch lag?
    options:
      - "Reduce the health check grace period to zero so new instances start serving immediately"
      - "Switch the scaling policy from target tracking to manual and add capacity by hand each morning"
      - "Use warm pools (pre-initialized stopped instances) and/or predictive scaling to pre-provision ahead of the spike"
      - "Lower the desired capacity to save money and let target tracking backfill during the spike"
    answer: 2
    explanation: |
      Warm pools keep pre-initialized (stopped/hibernated) instances that start in
      seconds, and predictive scaling forecasts the recurring spike to pre-provision
      capacity before it hits — both attack the boot+warmup lag. Zeroing the grace period
      risks killing healthy instances; manual scaling and lower capacity don't solve lag.
    ref: "concepts.md#auto-scaling-groups-and-launch-templates"

  - id: aws-compute-ec2-fargate-lambda-048
    difficulty: advanced
    tags: [lambda, throttle, failure-mode]
    question: |
      A synchronous Lambda behind an ALB hits its concurrency limit during a spike. What
      does the client experience, and what is the cleanest mitigation?
    options:
      - "Requests queue in the ALB indefinitely until capacity frees up; just add more function memory"
      - "The ALB silently drops the excess connections with no error code returned to the client"
      - "Lambda automatically upgrades the overflow invocations to Fargate tasks to absorb the spike"
      - "Requests are throttled with 429 TooManyRequests; raise the concurrency limit and/or buffer spikes behind SQS to smooth to a safe rate"
    answer: 3
    explanation: |
      Synchronous invocations over the concurrency limit are throttled with 429
      TooManyRequests. Fixes: request a higher concurrency limit and/or decouple with an
      SQS buffer so spikes are absorbed and drained at a safe rate. Sync requests don't
      queue indefinitely, Lambda doesn't morph into Fargate, and the throttle is an
      explicit error, not a silent drop.
    ref: "concepts.md#failure-modes-and-how-designs-degrade"

  - id: aws-compute-ec2-fargate-lambda-049
    difficulty: advanced
    tags: [decision, latency, tail]
    question: |
      A trading-adjacent service needs the tightest possible, jitter-free p99 latency on a
      hot path. Which compute choice is most defensible and why?
    options:
      - "A hot, pinned EC2/container fleet, because it avoids cold-start jitter and keeps state and connections warm for the lowest tail latency"
      - "Lambda, because it scales to zero and therefore removes all queuing delay on the hot path"
      - "Fargate Spot, because the deep cost savings free budget to over-provision away the tail"
      - "Lambda with 1 MB asynchronous payloads to keep each invocation small and consistently fast"
    answer: 0
    explanation: |
      For the tightest, most predictable p99 you want always-hot, pinned compute
      (EC2/containers) with warm caches and persistent connections — no cold-start jitter.
      Lambda (even provisioned) adds variability and can't beat a hot instance on the
      tail; Fargate Spot trades availability for cost; async payloads are irrelevant to a
      low-latency sync path.
    ref: "concepts.md#when-serverless-is-the-wrong-choice"

  - id: aws-compute-ec2-fargate-lambda-050
    difficulty: advanced
    tags: [ri, savings-plans, trade-off]
    question: |
      What is the key trade-off between Standard Reserved Instances and Compute Savings
      Plans?
    options:
      - "Savings Plans are always both cheaper and more flexible than RIs, with no downside on either axis"
      - "Standard RIs can be slightly cheaper but are rigid (locked family/region/size); Compute Savings Plans give more flexibility across families/regions/Fargate/Lambda for a hair less discount"
      - "Reserved Instances discounts apply to Lambda and Fargate usage, whereas Compute Savings Plans cover only EC2"
      - "Reserved Instances are interruptible with a two-minute notice, while Compute Savings Plans guarantee capacity"
    answer: 1
    explanation: |
      Standard RIs can edge out Savings Plans on raw discount but lock you to attributes
      and are only partly resellable; Compute Savings Plans automatically flex across
      EC2 families, regions, Fargate, and Lambda for slightly less peak discount.
      Savings Plans aren't strictly cheaper, RIs are the ones tied to EC2 attributes, and
      neither commitment is interruptible (that's Spot).
    ref: "concepts.md#ec2-purchasing-options-and-cost-trade-offs"

  - id: aws-compute-ec2-fargate-lambda-051
    difficulty: advanced
    tags: [lambda, connections, stateful]
    question: |
      Why are chatty, connection-heavy, stateful workloads a poor fit for Lambda even when
      each request is short?
    options:
      - "Lambda cannot make outbound network calls, so persistent client sessions are impossible"
      - "Lambda bills a per-TCP-connection surcharge that makes connection-heavy workloads expensive"
      - "Each execution environment is isolated with no shared durable local state and opens its own connections, so scaling causes connection storms and lost affinity"
      - "Lambda only supports HTTP request/response and cannot speak raw database wire protocols"
    answer: 2
    explanation: |
      Lambda environments are ephemeral and isolated: no shared durable local state, and
      each opens its own downstream connections, so scaling to thousands causes connection
      storms and no session affinity — containers fit better (or use RDS Proxy). Lambda
      can make outbound calls, speaks any protocol, and doesn't bill per TCP connection.
    ref: "concepts.md#when-serverless-is-the-wrong-choice"

  - id: aws-compute-ec2-fargate-lambda-052
    difficulty: advanced
    tags: [blended-fleet, cost, availability]
    question: |
      For a stateless web tier, which fleet composition is the canonical cost-optimal yet
      resilient design?
    options:
      - "100% Spot across many instance types to minimize cost while relying on rapid replacement"
      - "A single large Reserved Instance in one AZ, sized to peak for a predictable flat monthly rate"
      - "100% On-Demand spread across AZs for maximum reliability and zero commitment risk"
      - "Savings-Plan/On-Demand baseline for the floor + On-Demand burst + Spot for fault-tolerant surplus, diversified across AZs"
    answer: 3
    explanation: |
      The canonical pattern covers the always-needed floor with committed/On-Demand
      capacity, bursts on On-Demand, and adds cheap Spot for fault-tolerant surplus —
      diversified across AZs and instance types. 100% Spot risks mass reclamation, 100%
      On-Demand overpays, and one RI in one AZ has no resilience.
    ref: "concepts.md#ec2-purchasing-options-and-cost-trade-offs"

  - id: aws-compute-ec2-fargate-lambda-053
    difficulty: advanced
    tags: [multi-region, failure, resilience]
    question: |
      A team claims their single-region ASG + Fargate + Lambda design is "highly
      available and disaster-proof." Which failure does this design NOT tolerate by
      itself?
    options:
      - "A full AWS Region outage"
      - "The loss of a single Availability Zone"
      - "An individual EC2 instance failing"
      - "A single Fargate task crashing"
    answer: 0
    explanation: |
      Multi-AZ designs survive AZ loss, instance failures, and task crashes, but nothing
      single-region survives a full Region outage by itself — that requires multi-region
      active-active or active-passive with data replication and Route 53 failover, an
      explicit and costly choice. The other three are handled within a Region.
    ref: "concepts.md#failure-modes-and-how-designs-degrade"

  - id: aws-compute-ec2-fargate-lambda-054
    difficulty: advanced
    tags: [fargate, cold-task, latency]
    question: |
      Compared to the EC2 launch type with spare capacity, why can a Fargate task have
      higher start latency?
    options:
      - "Fargate tasks must boot a full Windows Server OS on every launch before the container starts"
      - "Fargate must provision an isolated micro-VM and pull the image on demand, whereas an EC2 node with warm capacity can start a container almost immediately"
      - "Fargate always runs tasks on reclaimable Spot capacity, so launches wait for a free Spot pool"
      - "Fargate tasks are hard-limited to 0.25 vCPU, so they queue behind a shared scheduler at launch"
    answer: 1
    explanation: |
      Fargate provisions a dedicated micro-VM and pulls the image per task launch, adding
      startup latency; an EC2 node that already has capacity and a cached image can start
      a container quickly. Fargate isn't Windows-only or Spot-only, and it supports up to
      16 vCPU, not just 0.25.
    ref: "concepts.md#fargate-versus-ec2-launch-type-for-containers"

  - id: aws-compute-ec2-fargate-lambda-055
    difficulty: advanced
    tags: [lambda, provisioned-concurrency, autoscaling]
    question: |
      To handle a predictable daily traffic curve while minimizing cold starts AND idle
      cost on Lambda, what is the best approach?
    options:
      - "Set a single fixed high provisioned concurrency value for all 24 hours of every day"
      - "Disable provisioned concurrency entirely and just absorb all cold starts at the daily peak"
      - "Use Application Auto Scaling to schedule/scale provisioned concurrency to track the daily curve"
      - "Rely only on reserved concurrency, expecting it to pre-warm environments for the curve"
    answer: 2
    explanation: |
      Application Auto Scaling can schedule and scale provisioned concurrency up and down
      to follow the known daily curve — warm when needed, cheaper off-peak. A fixed high
      value wastes money off-peak, disabling it reintroduces cold-start tail latency, and
      reserved concurrency caps/guarantees count but doesn't pre-warm environments.
    ref: "concepts.md#lambda-execution-model-concurrency-and-cold-starts"

  - id: aws-compute-ec2-fargate-lambda-056
    difficulty: advanced
    tags: [decision, memory-footprint, limits]
    question: |
      A service needs ~40 GB of RAM resident and long-lived processes. Which compute
      options remain viable?
    options:
      - "Lambda, after filing a Service Quotas request to raise its memory ceiling above 10 GB"
      - "Only API Gateway with response caching enabled to hold the working set in memory"
      - "Only Lambda, using its 10 GB /tmp ephemeral disk as if it were resident RAM"
      - "EC2 (R/X family) or a large Fargate task/ECS-on-EC2 — not Lambda, which caps at 10 GB"
    answer: 3
    explanation: |
      40 GB resident exceeds Lambda's 10 GB memory cap, so Lambda is out. Memory-optimized
      EC2 (R/X) or a large Fargate task (up to 120 GB) / ECS-on-EC2 fit. Lambda memory
      cannot be raised past 10 GB, /tmp is disk not RAM, and API Gateway is not compute.
    ref: "concepts.md#when-serverless-is-the-wrong-choice"

  - id: aws-compute-ec2-fargate-lambda-057
    difficulty: advanced
    tags: [ecs, eks, portability, trade-off]
    question: |
      A company wants to reuse Kubernetes operators, Helm charts, and multi-cloud skills.
      Which orchestrator, and what is the accepted cost?
    options:
      - "EKS, accepting more operational complexity and a per-cluster control-plane fee in exchange for the Kubernetes ecosystem and portability"
      - "ECS, accepting AWS-proprietary lock-in and rewriting the Helm charts as ECS task definitions for lower cost"
      - "Lambda, accepting the 15-minute execution cap and repackaging the operators as short-lived functions"
      - "Raw EC2, accepting no orchestration layer and wiring the Kubernetes control plane together by hand"
    answer: 0
    explanation: |
      EKS gives the Kubernetes API, operators, Helm, and portable/multi-cloud skills — at
      the cost of more moving parts and a per-cluster control-plane charge. ECS is simpler
      but AWS-proprietary (no k8s ecosystem), Lambda isn't an orchestrator, and raw EC2
      gives no orchestration.
    ref: "concepts.md#containers-on-aws-with-ecs-and-eks"

  - id: aws-compute-ec2-fargate-lambda-058
    difficulty: advanced
    tags: [lambda, event-source, ordering]
    question: |
      Which invocation/event-source characteristic is TRUE for Lambda?
    options:
      - "SQS standard event source mapping guarantees strict global ordering across all messages"
      - "Kinesis and DynamoDB Streams preserve per-shard ordering, and Lambda processes them in batches"
      - "Synchronous invocations are automatically retried twice by Lambda before surfacing an error"
      - "Asynchronous invocations block the calling client until the function run finishes and returns"
    answer: 1
    explanation: |
      Kinesis and DynamoDB Streams maintain order per shard and Lambda polls/processes
      them in batches. SQS standard is not globally ordered; Lambda does NOT auto-retry
      synchronous invocations (the caller owns retries) — that's the async model; and
      async returns immediately without blocking the caller.
    ref: "concepts.md#lambda-limits-invocation-models-and-event-sources"

  - id: aws-compute-ec2-fargate-lambda-059
    difficulty: advanced
    tags: [cost, crossover, judgment]
    question: |
      Which statement about the Lambda-vs-reserved-compute cost crossover is most accurate?
    options:
      - "There is no crossover at all; Lambda's per-invocation pricing stays cheaper than reserved compute at every utilization level"
      - "Reserved compute is cheaper at every level, including near-zero traffic, because committed rates always undercut per-request billing"
      - "Below some utilization Lambda (zero idle cost) is cheaper; above it, flat-rate reserved EC2/Fargate wins because per-invocation pricing scales linearly with no volume floor benefit"
      - "The crossover point is set purely by the AWS Region's price list and is entirely independent of utilization"
    answer: 2
    explanation: |
      Lambda's per-use pricing is ~zero when idle and rises linearly with load, while
      reserved EC2/Fargate is a flat committed rate. So below a utilization threshold
      Lambda wins (no idle cost), and above it reserved wins (flat rate amortized over
      high usage). Neither dominates everywhere, and the crossover is driven by
      utilization, not just Region.
    ref: "concepts.md#cost-and-operational-burden-trade-offs"

  - id: aws-compute-ec2-fargate-lambda-060
    difficulty: advanced
    tags: [lambda, cpu, memory, vcpu]
    question: |
      At what memory setting does a Lambda function get the equivalent of roughly one full
      vCPU?
    options:
      - "128 MB"
      - "512 MB"
      - "10,240 MB"
      - "1,769 MB"
    answer: 3
    explanation: |
      Lambda allocates CPU proportionally to memory, and at 1,769 MB a function has the
      equivalent of one full vCPU (scaling up to ~6 vCPU near 10 GB). 128 MB is the
      minimum with a fraction of a vCPU, and 10,240 MB is the max memory (multiple vCPUs).
    ref: "concepts.md#lambda-execution-model-concurrency-and-cold-starts"

  - id: aws-compute-ec2-fargate-lambda-061
    difficulty: expert
    tags: [lambda, firecracker, internals]
    question: |
      Lambda (and Fargate) isolate each execution environment/task using which
      virtualization technology?
    options:
      - "Firecracker microVMs, which give VM-level isolation with fast, lightweight boot"
      - "Docker containers sharing the host kernel with only cgroups isolation"
      - "Full hardware-virtualized Windows VMs per invocation"
      - "chroot jails on a shared multi-tenant OS"
    answer: 0
    explanation: |
      AWS uses Firecracker microVMs to give each Lambda environment (and Fargate task)
      strong VM-level isolation with very fast, lightweight boot — critical for
      multi-tenant safety at serverless scale. It is not mere shared-kernel containers,
      not heavyweight full VMs per invoke, and not chroot jails.
    ref: "concepts.md#the-compute-spectrum-from-ec2-to-lambda"

  - id: aws-compute-ec2-fargate-lambda-062
    difficulty: expert
    tags: [lambda, concurrency, downstream-protection]
    question: |
      You have 20 Lambda functions sharing a 1,000 account concurrency limit. One
      non-critical batch function occasionally bursts and starves a critical API function
      of concurrency. What is the most precise fix?
    options:
      - "Raise the account concurrency limit to 10,000 and hope the batch function's bursts no longer starve the API"
      - "Set reserved concurrency on the batch function to cap it, and/or reserve concurrency for the critical API function to guarantee its slice"
      - "Enable provisioned concurrency on the batch function so its pre-warmed pool stops draining the shared limit"
      - "Move the critical API function to a larger memory size so it wins the race for the shared concurrency pool"
    answer: 1
    explanation: |
      Reserved concurrency both caps a function and guarantees a slice: cap the noisy
      batch function so it can't consume the whole pool, and/or reserve a guaranteed slice
      for the critical API. Raising the account limit doesn't stop one function from
      hogging it; provisioned concurrency pre-warms but doesn't cap; memory size is
      irrelevant to concurrency contention.
    ref: "concepts.md#lambda-execution-model-concurrency-and-cold-starts"

  - id: aws-compute-ec2-fargate-lambda-063
    difficulty: expert
    tags: [static-stability, resilience, design]
    question: |
      Following the Builders' Library principle of static stability, how should a
      well-designed multi-AZ EC2 system behave when the control plane (e.g. the ability to
      launch new instances) is impaired during an AZ event?
    options:
      - "It should scale down to conserve resources and wait until the impaired control plane fully recovers"
      - "It should automatically fail the whole workload over to Lambda functions during the AZ event"
      - "It should continue serving with already-provisioned, pre-scaled capacity in the surviving AZs without depending on launching new instances"
      - "It should route all incoming traffic into the impaired AZ so that AZ drains its backlog faster"
    answer: 2
    explanation: |
      Static stability means the system keeps working using capacity it already has,
      without needing control-plane actions (like launching new instances) during the
      event — so you pre-provision N+1 headroom across AZs. Scaling down, magically failing
      to Lambda, or routing into the impaired AZ all violate the principle.
    ref: "concepts.md#failure-modes-and-how-designs-degrade"

  - id: aws-compute-ec2-fargate-lambda-064
    difficulty: expert
    tags: [decision, mixed, judgment]
    question: |
      A video platform must: (a) transcode uploads (5–40 min, CPU-heavy, bursty), (b) serve
      a low-latency metadata API (steady), and (c) run occasional GPU ML tagging. Which
      compute mapping is most appropriate?
    options:
      - "Everything on Lambda for simplicity, chunking the long transcode across many chained invocations"
      - "Transcode on Lambda, metadata API on Lambda, and GPU tagging on Lambda with maximum memory for CPU"
      - "Everything co-located on a single large On-Demand EC2 instance sized for the combined peak load"
      - "Transcode on Fargate/AWS Batch (with Spot for cost), metadata API on reserved EC2/Fargate, GPU tagging on ECS/EKS on GPU EC2 instances"
    answer: 3
    explanation: |
      Match each workload to its constraints: transcoding can exceed 15 min and is
      bursty/fault-tolerant → Fargate/Batch with Spot; a steady low-latency API → reserved
      EC2/Fargate; GPU ML → GPU EC2 via ECS/EKS (no GPU on Lambda/Fargate). Lambda can't do
      the >15 min transcode or GPU work; one big instance has no elasticity or isolation.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-compute-ec2-fargate-lambda-065
    difficulty: expert
    tags: [lambda, sqs, batching, throughput]
    question: |
      A Lambda consumes from SQS via event source mapping. Downstream can only handle 200
      writes/sec but the queue backs up and Lambda scales aggressively, overwhelming it.
      Which controls best throttle throughput without dropping messages?
    options:
      - "Set maximum concurrency on the SQS event source mapping and/or reserved concurrency, and tune batch size/window to bound the effective write rate"
      - "Increase the message visibility timeout to its maximum so redeliveries stop and the downstream stops being overwhelmed"
      - "Delete and recreate the SQS queue to reset the backlog and let Lambda start draining from empty"
      - "Switch the standard queue to a FIFO queue and rely on its ordering to throttle the consumer rate"
    answer: 0
    explanation: |
      The SQS event source mapping's maximum-concurrency setting (plus function reserved
      concurrency and batch size/window tuning) bounds how fast Lambda drains the queue,
      protecting the 200/sec downstream while messages wait safely in SQS. Infinite
      visibility timeout, recreating the queue, or merely switching to FIFO don't rate-limit
      the consumer.
    ref: "concepts.md#failure-modes-and-how-designs-degrade"

  - id: aws-compute-ec2-fargate-lambda-066
    difficulty: expert
    tags: [cost, estimation, fargate-vs-lambda]
    question: |
      A workload receives a steady 20 requests/sec, each taking ~200 ms of CPU. An
      engineer must choose between Lambda and a small always-on container. Which reasoning
      is soundest?
    options:
      - "Lambda always wins here because it scales to zero, so its per-invocation cost is guaranteed lowest at any steady load"
      - "At a steady 20 rps × 0.2 s ≈ 4 concurrent units of work continuously, a single right-sized always-on container may be cheaper than paying per-invocation for ~1.7M invokes/day — compare both before deciding"
      - "The always-on container always wins regardless of the traffic pattern, so no cost estimate is needed"
      - "The two options cost exactly the same at this load, so the engineer should just pick by personal preference"
    answer: 1
    explanation: |
      Steady 20 rps × 0.2 s ≈ 4 units of concurrent work around the clock — that constant
      load can often sit on one small always-on container more cheaply than ~1.7M daily
      per-invocation Lambda charges. The point is to estimate both; neither "always wins,"
      and costs aren't identical.
    ref: "concepts.md#cost-and-operational-burden-trade-offs"

  - id: aws-compute-ec2-fargate-lambda-067
    difficulty: expert
    tags: [lambda, response-streaming, limits]
    question: |
      A Lambda must return a large generated payload (tens of MB) to a client with low
      time-to-first-byte. Which capability and limit apply?
    options:
      - "A standard buffered synchronous response, which is hard-capped at 6 MB total for the whole payload"
      - "An asynchronous (event) invocation, which returns the generated payload to the client but is capped at 1 MB"
      - "Lambda response streaming, which streams the first 6 MB uncapped then ~2 MB/s, up to a 200 MB response"
      - "No mechanism can exceed 6 MB, so you must chunk the payload into many separate synchronous calls"
    answer: 2
    explanation: |
      Lambda response streaming lets a function stream results (better TTFB) with the first
      6 MB uncapped and the remainder at ~2 MB/s, up to a 200 MB streamed response — beyond
      the 6 MB standard buffered response. Async is 1 MB and doesn't return to a client;
      chunking is unnecessary given streaming exists.
    ref: "concepts.md#lambda-limits-invocation-models-and-event-sources"

  - id: aws-compute-ec2-fargate-lambda-068
    difficulty: expert
    tags: [fargate, ephemeral-storage, limits]
    question: |
      A Fargate task processes files needing ~100 GB of scratch space on local disk. What
      is true about Fargate ephemeral storage?
    options:
      - "Fargate is fixed at exactly 20 GB of ephemeral storage per task and that allocation cannot be changed"
      - "Fargate ephemeral storage maxes out at 10 GB per task, the same ceiling as Lambda's /tmp directory"
      - "Fargate provides no local disk at all, so you must mount an EFS file system for any scratch space"
      - "Fargate ephemeral storage defaults to 20 GB and is configurable up to 200 GB (platform 1.4.0+), so 100 GB is supported"
    answer: 3
    explanation: |
      Fargate ephemeral storage defaults to 20 GB and is configurable up to 200 GB on
      platform 1.4.0+, so 100 GB scratch works. It is not fixed at 20 GB, does have local
      storage (EFS is optional for shared/persistent data), and its cap is 200 GB, far
      above Lambda's 10 GB /tmp.
    ref: "concepts.md#fargate-versus-ec2-launch-type-for-containers"

  - id: aws-compute-ec2-fargate-lambda-069
    difficulty: expert
    tags: [decision, matrix, judgment]
    question: |
      Which pairing of workload → best compute choice is INCORRECT?
    options:
      - "GPU-based real-time inference → Fargate (serverless containers)"
      - "Steady 24×7 CPU-bound service needing lowest unit cost → reserved EC2/Fargate with Savings Plans"
      - "Unpredictable, spiky, event-driven glue logic → Lambda"
      - "Bursty containerized microservices with a tiny ops team → Fargate"
    answer: 0
    explanation: |
      GPU inference cannot run on Fargate (no GPU) — it belongs on GPU EC2 via ECS/EKS, so
      that pairing is incorrect. The other three are correct: Lambda for spiky glue,
      reserved EC2/Fargate for steady cost-critical load, and Fargate for bursty
      microservices with a small team.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-compute-ec2-fargate-lambda-070
    difficulty: expert
    tags: [autoscaling, target-tracking, limits]
    question: |
      A design uses ASG target tracking on CPU at 50% for a service whose bottleneck is
      actually downstream I/O latency, not CPU. What is the likely failure mode?
    options:
      - "The ASG will scale perfectly because CPU always correlates with load"
      - "CPU may stay low while latency degrades, so the ASG under-scales; track a load-correlated metric like ALBRequestCountPerTarget or a custom latency/queue-depth metric instead"
      - "Target tracking is impossible on I/O-bound services"
      - "The ASG will scale to the maximum instantly and stay there"
    answer: 1
    explanation: |
      If CPU isn't the bottleneck, it can stay under target while requests pile up and
      latency degrades, so a CPU-based target-tracking policy under-scales. Track a metric
      correlated with actual load — requests-per-target or a custom latency/queue-depth
      metric. Target tracking works on I/O-bound services if you pick the right metric; it
      won't magically scale correctly on the wrong one.
    ref: "concepts.md#auto-scaling-groups-and-launch-templates"
