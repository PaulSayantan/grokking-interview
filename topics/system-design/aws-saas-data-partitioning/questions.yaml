  # ---------------- Cross-tenant leak / defense in depth ----------------
  - id: aws-saas-data-partitioning-061
    difficulty: beginner
    tags: [cross-tenant-leak, severity]
    question: |
      How does AWS characterize a cross-tenant data leak for a SaaS business?
    options:
      - "A significant and potentially unrecoverable event — the most important failure to prevent"
      - "A minor performance issue that mildly slows the affected tenants until the shared cache is cleared"
      - "A routine billing inconvenience that is corrected by reconciling the cost allocation tags at month end"
      - "An acceptable trade-off you knowingly make in exchange for the density and cost savings of pooling"
    answer: 0
    explanation: |
      AWS says crossing the tenant boundary in any form is significant and
      potentially unrecoverable for a SaaS business — treated as the number-one
      thing to prevent, never an acceptable trade-off.
    ref: "concepts.md#the-catastrophic-failure-cross-tenant-data-leak-and-defense-in-depth"

  - id: aws-saas-data-partitioning-062
    difficulty: advanced
    tags: [cross-tenant-leak, cache-key]
    question: |
      A pooled service enforces isolation with both Postgres RLS and IAM
      LeadingKeys, yet still occasionally serves Tenant A's data to Tenant B.
      Which leak vector is MOST likely, given RLS/IAM are correct?
    options:
      - "A missing WHERE clause on a pooled query, which the enabled RLS policy would already filter and prevent"
      - "The 400 KB DynamoDB item-size limit being exceeded, spilling one tenant's overflow bytes into another's item"
      - "An unscoped Scan across the whole table, which the IAM explicit Deny on Scan would already block"
      - "A cache key that omits the tenant id, so a cached result for A is served to B — the cache sits above the RLS/IAM enforcement plane"
    answer: 3
    explanation: |
      A tenant-agnostic cache key leaks across tenants precisely because the cache
      is outside the DB/API enforcement layer that RLS and LeadingKeys protect.
      RLS/IAM would catch the missing WHERE and the Scan; the item limit is
      unrelated.
    ref: "concepts.md#the-catastrophic-failure-cross-tenant-data-leak-and-defense-in-depth"

  - id: aws-saas-data-partitioning-063
    difficulty: advanced
    tags: [cross-tenant-leak, trust]
    question: |
      Which practice creates a leak by trusting untrusted input?
    options:
      - "Deriving the tenant id server-side from a cryptographically validated JWT before using it to scope any query"
      - "Passing the tenant id as an STS session tag matched by a PrincipalTag condition in the scoped access policy"
      - "Taking the tenant id directly from a client-supplied request body or an unvalidated claim and using it to scope queries"
      - "Enabling row-level security on every table that holds tenant data so the database backstops the tenant filter"
    answer: 2
    explanation: |
      Trusting a client-supplied/unvalidated tenant id lets an attacker request
      another tenant's data. The safe pattern derives tenant id server-side from a
      validated token; session tags and RLS are correct controls.
    ref: "concepts.md#the-catastrophic-failure-cross-tenant-data-leak-and-defense-in-depth"

  - id: aws-saas-data-partitioning-064
    difficulty: expert
    tags: [defense-in-depth, layers]
    question: |
      Which set of layers best describes AWS's defense-in-depth model against
      cross-tenant leaks?
    options:
      - "A single, carefully written IAM policy on the pooled role is sufficient to stop every cross-tenant access path"
      - "Identity (server-derived JWT context) + credential (per-request STS scoped creds/session tags) + infrastructure fail-closed (IAM LeadingKeys/Null/Deny Scan or RLS) + application (tenant filters and tenant-aware cache keys) + detective (CloudTrail/CloudWatch anomalies)"
      - "Encryption of data at rest combined with TLS in transit, which together seal off any cross-tenant read path"
      - "Network isolation via a dedicated VPC boundary, which by itself keeps each tenant's data unreachable from others"
    answer: 1
    explanation: |
      Defense in depth combines identity, credential, infrastructure-enforcement,
      application, and detective layers so no single bug is fatal. One IAM policy,
      encryption alone, or network isolation alone is insufficient.
    ref: "concepts.md#the-catastrophic-failure-cross-tenant-data-leak-and-defense-in-depth"

  - id: aws-saas-data-partitioning-065
    difficulty: intermediate
    tags: [cross-tenant-leak, checklist]
    question: |
      Which of the following is NOT prevented by DynamoDB dynamodb:LeadingKeys
      alone?
    options:
      - "A Query on a GSI keyed on a non-tenant attribute that spans all tenants"
      - "A base-table Query whose partition key is set to another tenant's leading-key value"
      - "A GetItem that targets an item under another tenant's partition-key value directly"
      - "A PutItem that attempts to write an item under another tenant's partition-key value"
    answer: 0
    explanation: |
      LeadingKeys scopes base-table partition-key operations (GetItem/Query/PutItem)
      but not a GSI keyed on a non-tenant attribute, which reads across tenants —
      hence you must scope or deny the GSI.
    ref: "concepts.md#the-catastrophic-failure-cross-tenant-data-leak-and-defense-in-depth"

  # ---------------- Noisy neighbor ----------------
  - id: aws-saas-data-partitioning-066
    difficulty: intermediate
    tags: [noisy-neighbor, rds]
    question: |
      At the data tier on RDS/Aurora, what are the two classic noisy-neighbor
      failure modes and their mitigations?
    options:
      - "Oversized items and unscoped table Scans; mitigate by write-sharding the tenant's rows across suffixes"
      - "Runaway GSI read cost and the per-table LSI count limit; mitigate by switching the table to on-demand capacity mode"
      - "Shared connection-pool exhaustion (instance-class cap) and one tenant's heavy query starving CPU/IO; mitigate with RDS Proxy, read replicas, per-tenant query throttling, or promoting the whale to a silo instance"
      - "Cognito request throttling and oversized JWT claims; mitigate by registering additional per-tenant app clients"
    answer: 2
    explanation: |
      On RDS the noisy-neighbor issues are connection exhaustion and resource
      starvation from heavy queries; RDS Proxy, replicas, throttling, or siloing the
      whale address them. The other options mix in DynamoDB/Cognito concerns.
    ref: "concepts.md#noisy-neighbor-at-the-data-tier"

