topic: "AWS SaaS Data Partitioning and Isolation"
domain: system-design
topic_slug: aws-saas-data-partitioning
version: 1

questions:
  # ---------------- Partitioning is not isolation ----------------
  - id: aws-saas-data-partitioning-001
    difficulty: beginner
    tags: [partitioning-vs-isolation, fundamentals]
    question: |
      In the AWS SaaS vocabulary, what is the difference between data
      "partitioning" and tenant "isolation"?
    options:
      - "Partitioning is how/where each tenant's data is stored; isolation is the actively enforced mechanism that prevents cross-tenant access"
      - "They are synonyms; both simply mean giving each tenant its own dedicated database instance with no shared tables"
      - "Partitioning is an encryption technique applied per tenant; isolation is a VPC-level networking boundary between tenants"
      - "Isolation is purely about physical storage layout, while partitioning is the runtime access-control check on each query"
    answer: 0
    explanation: |
      Partitioning buckets data by tenant (rows, tables, schemas, DBs, accounts).
      Isolation is a separate, actively enforced, fail-closed control (IAM
      condition, RLS policy, scoped credential). The distractors either reverse the
      two terms, conflate them as synonyms, or invent meanings.
    ref: "concepts.md#partitioning-is-not-isolation"

  - id: aws-saas-data-partitioning-002
    difficulty: beginner
    tags: [partitioning-vs-isolation, leak]
    question: |
      A team stores every tenant's rows in one shared table with a `tenant_id`
      column and relies only on the application adding `WHERE tenant_id = ?`. Why
      does AWS say this provides partitioning but NOT isolation?
    options:
      - "Because the shared table is not encrypted at rest with a per-tenant KMS key, so any read returns plaintext rows"
      - "Because DynamoDB does not support a tenant_id attribute as a non-key column, forcing an unsafe shared layout"
      - "Because a single forgotten or buggy filter clause exposes all tenants' data; nothing enforces the boundary if the app is wrong"
      - "Because the shared table cannot be backed up or restored per tenant, so one tenant's data surfaces in another's restore"
    answer: 2
    explanation: |
      The boundary is just a value in a column, enforced only by application code.
      One missing/incorrect filter leaks data — nothing fails closed. Encryption
      and backups are unrelated to the isolation guarantee.
    ref: "concepts.md#partitioning-is-not-isolation"

  - id: aws-saas-data-partitioning-003
    difficulty: intermediate
    tags: [iam, dynamodb, rds, enforcement]
    question: |
      Why can IAM enforce item-level tenant isolation on DynamoDB but NOT
      row-level isolation on RDS/Aurora?
    options:
      - "DynamoDB is a newer service and simply happens to have deeper IAM integration by coincidence, while RDS predates fine-grained IAM row controls"
      - "RDS runs inside a private VPC and is inherently more secure, so it does not need IAM to enforce which rows a tenant can read or write"
      - "IAM can enforce row-level access on RDS only if you turn on IAM database authentication, which maps each individual row to an IAM principal"
      - "The only path to DynamoDB is the AWS API, so IAM sees every request; RDS uses SQL over a driver AWS doesn't own, so IAM sees only control-plane actions, not queries or rows"
    answer: 3
    explanation: |
      This asymmetry drives the whole topic. DynamoDB access is always an API call
      IAM can constrain (LeadingKeys); RDS row access happens inside SQL over
      JDBC/ODBC that IAM cannot inspect, so row isolation must come from the engine
      (Postgres RLS). IAM DB auth only controls who can connect, not which rows.
    ref: "concepts.md#partitioning-is-not-isolation"

  - id: aws-saas-data-partitioning-004
    difficulty: advanced
    tags: [partitioning-vs-isolation, design-coupling]
    question: |
      AWS states "how you isolate influences how you partition." Which concrete
      example best illustrates this coupling?
    options:
      - "If you want IAM to enforce DynamoDB isolation, the tenant id must be the partition (leading) key, which forces a specific data layout"
      - "If you store tenant data in S3 you are always forced to use a separate bucket per tenant, never a shared key prefix layout"
      - "If you pick Aurora you cannot add a tenant_id discriminator column, so pooling many tenants on Aurora is technically impossible"
      - "If you want the lowest possible cost you are required to silo every tenant onto dedicated infrastructure to avoid noisy neighbors"
    answer: 0
    explanation: |
      The enforcement mechanism (LeadingKeys) requires tenant id to be the leading
      key, so the isolation choice dictates the partition layout. The other options
      are false or reversed trade-offs.
    ref: "concepts.md#partitioning-is-not-isolation"

  # ---------------- Control plane vs application plane ----------------
  - id: aws-saas-data-partitioning-005
    difficulty: beginner
    tags: [control-plane, application-plane]
    question: |
      In the AWS SaaS control-plane vs application-plane model, which statement is
      correct about the control plane?
    options:
      - "It is where all tenant isolation and RLS enforcement happens"
      - "It is deployed as a separate, fully isolated copy per tenant so that each tenant gets its own onboarding and metering stack"
      - "It is global and NOT itself multi-tenant; it manages tenants (onboarding, identity, metering) but its own services don't apply tenant isolation"
      - "It is only the customer-facing admin web UI and dashboard, with no backend onboarding, identity, or metering responsibilities"
    answer: 2
    explanation: |
      The control plane manages tenants globally (onboarding, identity, tiering,
      metering, aggregated metrics) and legitimately sees all tenants, so it is not
      tenant-isolated. Isolation lives in the application plane.
    ref: "concepts.md#control-plane-versus-application-plane"

  - id: aws-saas-data-partitioning-006
    difficulty: intermediate
    tags: [control-plane, tenant-map, metadata]
    question: |
      A DynamoDB table maps `tenant_id -> {db endpoint, schema, shard suffixes,
      KMS key arn, tier}` and is read on every request. Where does this belong and
      what is it?
    options:
      - "In the application plane; the table holds the tenant's own business records and is queried as the primary data store"
      - "In the control plane; it is the tenant-to-resource map used to resolve where a tenant's data lives"
      - "It should be deleted for security reasons, since caching endpoints and KMS ARNs in one table is itself a cross-tenant leak"
      - "In the network plane; it is a VPC routing table that steers each tenant's requests to the correct subnet and endpoint"
    answer: 1
    explanation: |
      This is the tenant→resource map, a control-plane artifact realizing the
      "single instance + separate databases via a tenant map" sub-model. It stores
      metadata about where data lives, not the tenant data itself.
    ref: "concepts.md#control-plane-versus-application-plane"

  - id: aws-saas-data-partitioning-007
    difficulty: advanced
    tags: [control-plane, provisioning]
    question: |
      Where does tenant onboarding/provisioning sit relative to the two planes?
    options:
      - "Purely in the control plane, fully isolated from application resources, which it never touches or creates directly"
      - "Purely in the application plane, with no control-plane involvement, so onboarding runs entirely inside each tenant's own runtime"
      - "It is a formally defined separate third plane, called the provisioning plane, that AWS documents alongside control and application planes"
      - "It straddles the boundary: onboarding logic (control plane) reaches into the application plane to create per-tenant resources; AWS places the provisioning machinery in the application plane"
    answer: 3
    explanation: |
      Provisioning is a boundary-straddling activity: the control plane triggers
      it, but it creates application-plane resources, and AWS places the machinery
      in the application plane. There is no formal third plane.
    ref: "concepts.md#control-plane-versus-application-plane"

  # ---------------- Four sub-models ----------------
  - id: aws-saas-data-partitioning-008
    difficulty: beginner
    tags: [sub-models, taxonomy]
    question: |
      Which list correctly names AWS's four data-layer isolation sub-models from
      most to least isolated?
    options:
      - "Pool (shared schema + tenant_id), bridge-schemas, bridge-databases, silo — running from least to most isolated"
      - "Bridge with separate databases, silo, pool, and a fourth 'hybrid' model that mixes silo and pool per tenant"
      - "Silo (instance per tenant), bridge-databases, bridge-schemas, pool (shared schema + tenant_id)"
      - "Account-per-tenant, VPC-per-tenant, subnet-per-tenant, container-per-tenant — the four infrastructure isolation tiers"
    answer: 2
    explanation: |
      AWS's four data-tier sub-models, most→least isolated, are silo, bridge with
      separate databases, bridge with separate schemas, and pool (shared schema).
      One distractor lists the Nagarro infrastructure spectrum (account/VPC/subnet/
      container per tenant), not the data-tier sub-models; another reverses the
      order.
    ref: "concepts.md#the-four-data-layer-isolation-sub-models"

  - id: aws-saas-data-partitioning-009
    difficulty: intermediate
    tags: [sub-models, onboarding]
    question: |
      Ranked by new-tenant onboarding agility (fastest first), how do the
      sub-models compare?
    options:
      - "Pool fastest (insert a row), then bridge (create a schema/DB), then silo slowest (provision an instance/cluster)"
      - "All three onboard at essentially the same speed because provisioning is automated by the control plane in every model"
      - "Silo fastest (a dedicated instance is pre-warmed per tenant), then bridge in the middle, then pool slowest"
      - "Bridge-databases fastest (create one database), silo second (attach a spare instance), pool slowest (rebuild the shared schema)"
    answer: 0
    explanation: |
      Pool onboards fastest (a row), bridge is moderate (create DB or schema), silo
      is slowest (provision infrastructure and per-tenant limits). This is a
      verbatim axis of AWS's decision matrix.
    ref: "concepts.md#the-four-data-layer-isolation-sub-models"

  - id: aws-saas-data-partitioning-010
    difficulty: advanced
    tags: [sub-models, cross-tenant-query]
    question: |
      A SaaS needs to run cross-tenant analytics/admin queries that aggregate over
      all tenants in one PostgreSQL data store. Which sub-model does AWS's matrix
      specifically prefer, and why?
    options:
      - "Silo — a federated query engine can fan out to each tenant's dedicated instance and merge the aggregated results"
      - "Pool only, because cross-tenant aggregation is technically impossible in any model that keeps tenants in separate schemas"
      - "Bridge with separate databases — PostgreSQL cross-database joins run natively and need no dblink or FDW setup"
      - "Bridge with separate schemas — all schemas live in one database, so a privileged role can query across them"
    answer: 3
    explanation: |
      Schema-per-tenant keeps all tenants in one database, so a privileged
      analytics role can cross-reference schemas. DB-per-tenant requires
      dblink/FDW; silo scatters data across instances. Pool works too but the
      matrix specifically calls out schemas as preferred for cross-referencing.
    ref: "concepts.md#the-four-data-layer-isolation-sub-models"

  - id: aws-saas-data-partitioning-011
    difficulty: intermediate
    tags: [sub-models, blast-radius]
    question: |
      Which sub-model has the smallest blast radius for a data-tier failure, and
      which has the largest?
    options:
      - "Pool smallest (per-row isolation contains failures); silo largest (a shared cluster fails for everyone at once)"
      - "Silo smallest (failure confined to one tenant); pool largest (all tenants share one failure domain)"
      - "Bridge-schemas smallest (schemas fail independently); bridge-databases largest (all databases crash together)"
      - "They all have an identical blast radius because AWS replicates every model across three Availability Zones"
    answer: 1
    explanation: |
      Silo confines a failure to one tenant's dedicated resource; pool's shared
      table/instance is a single failure domain hitting everyone ("all or
      nothing"). Bridge sits mostly with pool.
    ref: "concepts.md#the-four-data-layer-isolation-sub-models"

  # ---------------- Silo ----------------
  - id: aws-saas-data-partitioning-012
    difficulty: beginner
    tags: [silo, dynamodb]
    question: |
      DynamoDB has no "database instance" concept. How is a silo model realized on
      DynamoDB?
    options:
      - "By automatically creating a separate AWS account per tenant and placing that tenant's tables inside it"
      - "By enabling a dedicated 'silo mode' table flag that reserves the table's throughput to a single tenant"
      - "By tenant-id-prefixed table names (e.g. tenant42_Orders) plus a per-tenant IAM policy scoped to those tables"
      - "By pinning each tenant's table to a separate AWS Region so the Regional boundary enforces isolation"
    answer: 2
    explanation: |
      Silo on DynamoDB = dedicated, tenant-prefixed tables plus IAM scoping. There
      is no silo flag; per-account or per-Region are heavier isolation choices,
      not the standard DynamoDB silo.
    ref: "concepts.md#silo-model-full-instance-isolation"

  - id: aws-saas-data-partitioning-013
    difficulty: intermediate
    tags: [silo, trade-offs, scale]
    question: |
      What is the PRIMARY reason a pure silo (instance/table per tenant) model
      fails to scale to thousands of tenants?
    options:
      - "AWS account and per-resource limits/quotas plus heavyweight onboarding and fragmented operations cap practical scale"
      - "DynamoDB and RDS are simply too slow to serve thousands of tenants from any dedicated instance at acceptable latency"
      - "Silos cannot be encrypted at rest, so security review blocks them well before thousands of tenants are reached"
      - "IAM roles and policies cannot be attached to per-tenant silo resources, leaving them unauthenticated at scale"
    answer: 0
    explanation: |
      Silo runs into resource/account quotas, table proliferation, slow onboarding
      automation, and decentralized monitoring. It's fine for ~20 tenants but
      breaks at ~1,000. The other options are false.
    ref: "concepts.md#silo-model-full-instance-isolation"

  - id: aws-saas-data-partitioning-014
    difficulty: advanced
    tags: [silo, compute, credentials]
    question: |
      Why can a pure silo deployment use the compute's own instance profile/role
      directly, whereas a pool deployment cannot?
    options:
      - "Pool compute always runs on Lambda, and Lambda functions cannot be assigned an execution role of their own"
      - "Pool compute relies exclusively on resource-based policies attached to each table instead of any IAM role on the compute"
      - "Silo compute needs no IAM permissions at all because a dedicated instance is unreachable from other tenants by default"
      - "In silo the role only ever touches one tenant's dedicated resource, so the role itself is the boundary; in pool the compute serves all tenants so its role can touch all data and must be narrowed per request"
    answer: 3
    explanation: |
      Silo's static role maps 1:1 to a tenant, so it is a natural boundary. Pooled
      compute serves everyone, so its broad role must be narrowed at runtime via
      scoped credentials. The other options are incorrect.
    ref: "concepts.md#silo-model-full-instance-isolation"

  - id: aws-saas-data-partitioning-015
    difficulty: expert
    tags: [silo, bridge, dynamodb, iam]
    question: |
      On DynamoDB, AWS notes the silo/bridge line is "very blurry" and a bridge is
      often a silo minus the per-table IAM constraints. What does AWS recommend
      about those constraints in a bridge, and why?
    options:
      - "Drop the per-table IAM constraints to reduce policy management overhead, since prefixed table names already separate tenants"
      - "IAM constraints are only ever needed in the pool model, never in bridge, because bridge tables are physically distinct"
      - "Keep the IAM constraints even in bridge, because dropping them converts a partitioning boundary into a potential cross-tenant leak"
      - "Replace the per-table IAM constraints with VPC endpoint policies that restrict which subnet each tenant connects from"
    answer: 2
    explanation: |
      AWS advises keeping the per-table IAM constraints in bridge; without them the
      separation is mere partitioning with no enforced isolation, reintroducing
      leak risk. Reducing policy management is exactly the temptation to resist.
    ref: "concepts.md#silo-model-full-instance-isolation"

  # ---------------- Bridge - databases ----------------
  - id: aws-saas-data-partitioning-016
    difficulty: intermediate
    tags: [bridge-databases, tenant-map]
    question: |
      In the "single instance + separate databases via a tenant map" sub-model,
      what is the role of the metadata store (e.g. DynamoDB)?
    options:
      - "It stores the actual tenant business records, acting as the primary data store the application queries directly"
      - "It maps tenant_id to the database name (and credentials/secret) so the data-access layer connects to the right database per request"
      - "It caches query results across tenants to speed up shared reads without hitting the databases each time"
      - "It enforces row-level security by rewriting each query with a tenant predicate before it reaches the database"
    answer: 1
    explanation: |
      The tenant map resolves which database (and credentials) a tenant uses; the
      DAL looks it up per request and connects. It does not hold tenant data or
      enforce RLS.
    ref: "concepts.md#bridge-model-separate-databases-via-a-tenant-map"

  - id: aws-saas-data-partitioning-017
    difficulty: advanced
    tags: [bridge-databases, postgres, autovacuum]
    question: |
      A team runs hundreds of tenant databases in one PostgreSQL instance
      (DB-per-tenant bridge) and sees high steady background resource consumption.
      Which mechanism most directly explains this?
    options:
      - "PostgreSQL starts an autovacuum worker per database after autovacuum_naptime, so hundreds of databases mean high background vacuum load"
      - "PostgreSQL RLS policies being evaluated on every row of every tenant database on each read and write"
      - "The DynamoDB tenant-map lookup performed on every incoming request before the connection is opened"
      - "The TLS handshake overhead incurred each time the data-access layer opens a fresh per-tenant connection"
    answer: 0
    explanation: |
      Autovacuum operates per database; many databases multiply background workers
      and resource use. RLS isn't used in DB-per-tenant, and the map lookup/TLS are
      not steady background CPU/IO of this kind.
    ref: "concepts.md#bridge-model-separate-databases-via-a-tenant-map"

  - id: aws-saas-data-partitioning-018
    difficulty: advanced
    tags: [bridge-databases, connections, trade-offs]
    question: |
      What is the main connection-pooling drawback of DB-per-tenant on a single
      instance?
    options:
      - "DynamoDB per-table connection limits apply and cap how many tenant databases can be open at once"
      - "Connections to separate tenant databases cannot use TLS, forcing plaintext pooling across the instance"
      - "You need essentially a pool per database and the total connection count is capped by the DB instance class across all tenants"
      - "You can only ever hold one active connection total to the entire instance, serialized across every tenant"
    answer: 2
    explanation: |
      Each database effectively needs its own pool, and the instance class caps
      total connections shared across all tenants, so many tenants strain the
      ceiling. The other options are false.
    ref: "concepts.md#bridge-model-separate-databases-via-a-tenant-map"

  # ---------------- Bridge - schemas ----------------
  - id: aws-saas-data-partitioning-019
    difficulty: intermediate
    tags: [bridge-schemas, postgres]
    question: |
      How does the schema-per-tenant model select the active tenant's data on each
      request in PostgreSQL?
    options:
      - "By switching to a different AWS account per tenant so the account boundary selects that tenant's data"
      - "By opening a fresh connection to a differently named DynamoDB table for the tenant on each request"
      - "By appending a WHERE tenant_id = ? predicate to every query against the one shared table"
      - "By setting the active schema per session, e.g. SET search_path / SET SCHEMA (or SET ROLE to a tenant role)"
    answer: 3
    explanation: |
      Schema-per-tenant uses session-level schema selection (SET search_path /
      SET SCHEMA / SET ROLE). A tenant_id filter is the pool model; the others are
      unrelated.
    ref: "concepts.md#bridge-model-separate-schemas-per-tenant"

  - id: aws-saas-data-partitioning-020
    difficulty: advanced
    tags: [bridge-schemas, rds-proxy, pinning]
    question: |
      Why does schema-per-tenant interact badly with RDS Proxy?
    options:
      - "SET SCHEMA / SET ROLE cause session pinning, so the connection can no longer be multiplexed across tenants, defeating the proxy's benefit"
      - "RDS Proxy does not support PostgreSQL engines, so a schema-per-tenant Postgres database cannot sit behind it"
      - "RDS Proxy applies a distinct at-rest encryption scheme per schema, corrupting search_path metadata on switch"
      - "Schema selection requires IAM database authentication, which RDS Proxy blocks for any SET SCHEMA session"
    answer: 0
    explanation: |
      Session-altering statements pin the connection to one client, disabling
      multiplexing — the core value of RDS Proxy. The other options are false.
    ref: "concepts.md#bridge-model-separate-schemas-per-tenant"

  - id: aws-saas-data-partitioning-021
    difficulty: expert
    tags: [bridge-schemas, migrations, ops]
    question: |
      An operations reviewer flags schema-per-tenant at 5,000 tenants. Which
      operational cost is MOST specific to this model (versus pool)?
    options:
      - "Rotating a distinct KMS encryption key for each of the thousands of tenant schemas on schedule"
      - "The 400 KB per-item size limit forcing large tenant records to be split across multiple schemas"
      - "Schema sprawl straining the catalog and every DDL migration running N times (once per schema)"
      - "Cross-Region replication lag as each tenant schema is streamed to a standby Region independently"
    answer: 2
    explanation: |
      With thousands of schemas, migrations execute per schema and the catalog
      grows large — a cost pool avoids (one shared schema, one migration). The
      400 KB limit is DynamoDB; the others aren't schema-specific.
    ref: "concepts.md#bridge-model-separate-schemas-per-tenant"

  # ---------------- Pool ----------------
  - id: aws-saas-data-partitioning-022
    difficulty: beginner
    tags: [pool, discriminator]
    question: |
      In the pool (shared-schema) model, what is the tenant boundary made of?
    options:
      - "A dedicated VPC per tenant whose network boundary keeps each tenant's shared-schema rows apart"
      - "A value in a discriminator column (tenant_id) in shared tables, rather than a physical resource boundary"
      - "A separate KMS encryption key applied to every individual row so decryption gates tenant access"
      - "A separate DynamoDB-backed account per tenant that physically houses that tenant's shared tables"
    answer: 1
    explanation: |
      Pool co-mingles all tenants in shared tables; the boundary is a tenant_id
      value, which is why an active enforcement mechanism (RLS/IAM) is mandatory.
    ref: "concepts.md#pool-model-shared-schema-with-a-tenant-discriminator"

  - id: aws-saas-data-partitioning-023
    difficulty: intermediate
    tags: [pool, trade-offs]
    question: |
      What is the PRIMARY trade-off of the pool model versus silo?
    options:
      - "Pool has stronger compliance alignment than silo but pays for it with a much higher per-tenant cost"
      - "Pool is architecturally capped at 100 tenants before the shared schema must be split into silos"
      - "Pool is always slower to query because every statement scans across all co-mingled tenants' rows"
      - "Pool maximizes cost efficiency, density, agility, and centralized ops, but has the weakest boundary (largest blast radius, hardest cost attribution, needs active isolation enforcement)"
    answer: 3
    explanation: |
      Pool trades isolation strength for economies of scale and agility; it
      requires RLS/LeadingKeys and instrumentation, and shares one blast radius.
      Compliance alignment is stronger in silo, not pool.
    ref: "concepts.md#pool-model-shared-schema-with-a-tenant-discriminator"

  - id: aws-saas-data-partitioning-024
    difficulty: advanced
    tags: [pool, enforcement, safety]
    question: |
      Why does AWS insist that a shared-schema pool is only safe with an active
      isolation mechanism like RLS or LeadingKeys, rather than app-layer filtering
      alone?
    options:
      - "Because app-layer filtering adds parsing latency that RLS avoids by pushing the filter into the planner"
      - "Because RLS improves query performance by pre-indexing each tenant's rows into a dedicated segment"
      - "Because with app-only filtering, a single forgotten filter is a breach; RLS/IAM makes the database or API refuse cross-tenant reads even when the app forgets"
      - "Because AWS bills app-layer filtering at a higher request rate than database-enforced RLS predicates"
    answer: 2
    explanation: |
      The point of RLS/LeadingKeys is a fail-safe backstop that catches
      application bugs. App-only filtering has no backstop — one bug leaks. Perf
      and pricing are irrelevant here.
    ref: "concepts.md#pool-model-shared-schema-with-a-tenant-discriminator"

  # ---------------- DynamoDB leading keys ----------------
  - id: aws-saas-data-partitioning-025
    difficulty: beginner
    tags: [dynamodb, leading-keys]
    question: |
      To enforce pooled tenant isolation on DynamoDB via IAM, what must the tenant
      id be in the table design?
    options:
      - "The partition key (the leading key), so dynamodb:LeadingKeys conditions can scope access"
      - "A regular non-key attribute that IAM inspects on each item to decide tenant access"
      - "The sort key of a global secondary index that LeadingKeys evaluates during a scoped Query"
      - "An item-level resource tag that IAM condition keys read to constrain per-tenant reads"
    answer: 0
    explanation: |
      dynamodb:LeadingKeys constrains access based on the partition key value, so
      tenant id must BE the partition key. As a non-key attribute or GSI sort key,
      IAM cannot scope by it.
    ref: "concepts.md#dynamodb-pooled-partitioning-and-leading-keys"

  - id: aws-saas-data-partitioning-026
    difficulty: intermediate
    tags: [dynamodb, scan, leak]
    question: |
      With a dynamodb:LeadingKeys condition scoping Query/GetItem/PutItem to a
      tenant, which additional IAM statement is essential to prevent a cross-tenant
      read, and why?
    options:
      - "Nothing else is needed; the LeadingKeys condition already constrains every table operation uniformly"
      - "An Allow on dynamodb:DescribeTable so the role can read the key schema before each scoped query"
      - "A Deny on dynamodb:GetItem to force all reads through the LeadingKeys-scoped Query path instead"
      - "An explicit Deny on dynamodb:Scan, because Scan bypasses the partition key and can read the whole table"
    answer: 3
    explanation: |
      Scan does not respect the partition-key scoping that LeadingKeys relies on,
      so an unrestricted Scan reads across tenants. You must explicitly Deny Scan.
      Denying GetItem would break normal reads.
    ref: "concepts.md#dynamodb-pooled-partitioning-and-leading-keys"

  - id: aws-saas-data-partitioning-027
    difficulty: advanced
    tags: [dynamodb, leading-keys, sharding]
    question: |
      With a sharded scheme where partition keys look like `tenant42-3`, which IAM
      condition operator scopes a role to just tenant42's shards?
    options:
      - "StringEquals with the bare value tenant42, relying on exact-match on the full partition key"
      - "ForAllValues:StringLike with value tenant42-* (matching the prefixed/sharded keys)"
      - "NumericLessThan on the numeric shard suffix to keep the role below tenant42's highest shard id"
      - "DateGreaterThan on the item's created-at timestamp to scope the role to tenant42's recent shards"
    answer: 1
    explanation: |
      Sharded keys share a tenant prefix, so StringLike with tenant42-* matches all
      of that tenant's shard partition keys. StringEquals with a bare tenant id
      would not match the suffixed keys.
    ref: "concepts.md#dynamodb-pooled-partitioning-and-leading-keys"

  # ---------------- DynamoDB hot tenants / sharding ----------------
  - id: aws-saas-data-partitioning-028
    difficulty: intermediate
    tags: [dynamodb, hot-partition, limits]
    question: |
      What is the per-physical-partition throughput ceiling on DynamoDB that makes
      a whale tenant a "hot partition" problem?
    options:
      - "1,000 RCU and 3,000 WCU per partition (with the read and write ceilings swapped)"
      - "40,000 RCU and 40,000 WCU per partition, matching the default per-table account ceiling"
      - "3,000 RCU and 1,000 WCU (strongly consistent) per partition"
      - "There is no per-partition limit because DynamoDB repartitions hot keys automatically without a cap"
    answer: 2
    explanation: |
      A single physical partition caps at 3,000 RCU / 1,000 WCU (SC; ~6,000 EC
      reads). Mapping tenant_id straight to the partition key means a whale hits
      this and throttles neighbors. Beware the distractor that swaps the RCU/WCU
      numbers (1,000 RCU / 3,000 WCU is wrong).
    ref: "concepts.md#dynamodb-hot-tenants-and-write-sharding"

  - id: aws-saas-data-partitioning-029
    difficulty: intermediate
    tags: [dynamodb, adaptive-capacity, burst]
    question: |
      What do DynamoDB adaptive capacity and burst capacity do for a hot tenant,
      and what do they NOT do?
    options:
      - "Adaptive capacity isolates hot items (up to the partition max) and burst retains up to 300s of unused capacity, but neither removes the hard per-partition ceiling"
      - "They remove the per-partition ceiling entirely by promoting the hot key to its own dedicated partition"
      - "They automatically write-shard the tenant's data across suffixes and fan out reads on your behalf"
      - "They silently convert the table from provisioned to on-demand capacity mode when a tenant runs hot"
    answer: 0
    explanation: |
      Adaptive capacity reallocates toward hot items and burst smooths spikes (up
      to 300s), but the 3,000/1,000 per-partition ceiling remains — they don't
      shard or change capacity mode.
    ref: "concepts.md#dynamodb-hot-tenants-and-write-sharding"

  - id: aws-saas-data-partitioning-030
    difficulty: advanced
    tags: [dynamodb, write-sharding, reads]
    question: |
      After write-sharding a whale tenant across suffixes `tenant42-1..N`, what
      must reads do, and where is the shard count stored?
    options:
      - "Reads hit a single partition and the shard count is hardcoded as a constant compiled into the app"
      - "Reads query a GSI keyed on tenant_id and pull the current shard count from a GSI projected attribute"
      - "Reads issue a full-table Scan and merge everything client-side, so no shard mapping needs to be stored"
      - "Reads fan out / parallel-query across all suffixes and merge results; the shard mapping (ShardCount, ShardSize, ShardId[]) is stored in the tenant lookup table"
    answer: 3
    explanation: |
      Sharding spreads writes but forces reads to query every suffix in parallel
      and merge. The shard metadata lives in the tenant lookup table so the app
      knows how many suffixes exist. Scan would be a leak and a full-table read.
    ref: "concepts.md#dynamodb-hot-tenants-and-write-sharding"

  - id: aws-saas-data-partitioning-031
    difficulty: expert
    tags: [dynamodb, sharding, leading-keys]
    question: |
      With write-sharding, the real tenant_id may never appear as a bare attribute
      — it's embedded in the ShardID like `tenant42-3`. How does isolation still
      hold under IAM?
    options:
      - "It doesn't; embedding the tenant id in the shard suffix breaks IAM isolation entirely"
      - "You must abandon IAM and switch to PostgreSQL row-level security to keep the shards isolated"
      - "The StringLike dynamodb:LeadingKeys condition on tenant42-* still scopes access to the tenant's sharded partition keys"
      - "You must add a tenant_id GSI and scope the condition to that index to restore isolation"
    answer: 2
    explanation: |
      Because the shard suffixes share the tenant prefix, a StringLike LeadingKeys
      condition on tenant42-* still enforces isolation on the partition key. No RLS
      or extra GSI is needed (and a GSI would risk a new leak path).
    ref: "concepts.md#dynamodb-hot-tenants-and-write-sharding"

  - id: aws-saas-data-partitioning-032
    difficulty: advanced
    tags: [dynamodb, noisy-neighbor, whale]
    question: |
      A single tenant on a pooled DynamoDB table is causing
      ProvisionedThroughputExceededException for co-located tenants. Which options
      are legitimate mitigations? (Choose the BEST single answer.)
    options:
      - "Request a Service Quotas increase to raise the 400 KB item-size limit for the hot tenant's items"
      - "Write-shard the hot tenant, switch to on-demand mode, or promote the whale to its own silo table with dedicated capacity"
      - "Delete the noisy tenant's data so the co-located tenants regain the partition's throughput"
      - "Disable adaptive capacity on the table so DynamoDB stops rebalancing toward the hot partition"
    answer: 1
    explanation: |
      Write sharding, on-demand, or promoting to a silo table all address the hot
      partition. The item-size limit is fixed; deleting data isn't a design fix;
      disabling adaptive capacity makes it worse.
    ref: "concepts.md#dynamodb-hot-tenants-and-write-sharding"

  # ---------------- DynamoDB item collections / GSI ----------------
  - id: aws-saas-data-partitioning-033
    difficulty: beginner
    tags: [dynamodb, limits, item-size]
    question: |
      What is the maximum size of a single DynamoDB item?
    options:
      - "400 KB"
      - "1 MB"
      - "10 GB"
      - "64 KB"
    answer: 0
    explanation: |
      An item is capped at 400 KB. 1 MB is a Query/Scan page; 10 GB is the LSI
      item-collection limit per partition key; 64 KB is not a DynamoDB limit.
    ref: "concepts.md#dynamodb-item-collections-gsis-and-cross-tenant-leaks"

  - id: aws-saas-data-partitioning-034
    difficulty: advanced
    tags: [dynamodb, lsi, item-collection]
    question: |
      A large tenant on a pooled DynamoDB table (tenant_id is the partition key)
      starts getting write failures around 10 GB of data. Which limit is being
      hit, and what is the precondition?
    options:
      - "The 400 KB per-item size limit, which applies to every table regardless of any secondary index"
      - "The 20-GSI-per-table limit, hit once a tenant accumulates enough attributes to need many indexes"
      - "The 10 GB item-collection limit, which applies only when the table has a Local Secondary Index (LSI)"
      - "The 300-second burst-capacity limit expiring, which starts rejecting the tenant's sustained writes"
    answer: 2
    explanation: |
      With an LSI present, all items sharing a partition key (one tenant here) are
      capped at 10 GB total; exceeding it fails writes. Without an LSI there is no
      such collection cap. The other limits are unrelated.
    ref: "concepts.md#dynamodb-item-collections-gsis-and-cross-tenant-leaks"

  - id: aws-saas-data-partitioning-035
    difficulty: expert
    tags: [dynamodb, gsi, leak]
    question: |
      A pooled DynamoDB table enforces isolation with dynamodb:LeadingKeys on
      tenant_id (the base-table partition key). An engineer adds a GSI partitioned
      on `email` to support login lookups. What is the isolation consequence?
    options:
      - "None; the LeadingKeys condition automatically propagates to and scopes any GSI on the base table"
      - "DynamoDB rejects the index because GSIs cannot be partitioned on a non-key attribute like email"
      - "The GSI transparently inherits the base table's row-level security, keeping login lookups scoped"
      - "The GSI is 'global' — a Query on it spans all partitions across the base table, creating an un-scoped cross-tenant read path"
    answer: 3
    explanation: |
      LeadingKeys scopes the BASE table's partition key only. A GSI keyed on a
      non-tenant attribute is queryable across all tenants — a classic leak.
      Defenses: keep tenant_id in the GSI key, or Deny queries on that index.
    ref: "concepts.md#dynamodb-item-collections-gsis-and-cross-tenant-leaks"

  - id: aws-saas-data-partitioning-036
    difficulty: intermediate
    tags: [dynamodb, limits, indexes]
    question: |
      What are the default per-table index limits on DynamoDB?
    options:
      - "20 GSIs (default) and 5 LSIs"
      - "5 GSIs and 20 LSIs (the two ceilings swapped from their real values)"
      - "Unlimited GSIs and LSIs, since DynamoDB adds index partitions on demand with no cap"
      - "1 GSI and 1 LSI per table, forcing careful index reuse across every access pattern"
    answer: 0
    explanation: |
      Default is 20 GSIs and 5 LSIs per table. LSIs share the base table's
      throughput; GSIs have their own. The distractor that says 5 GSIs and 20 LSIs
      swaps the two numbers.
    ref: "concepts.md#dynamodb-item-collections-gsis-and-cross-tenant-leaks"

  - id: aws-saas-data-partitioning-037
    difficulty: expert
    tags: [dynamodb, gsi, defenses]
    question: |
      Which is a valid defense against an unscoped-GSI cross-tenant leak in a
      pooled DynamoDB design?
    options:
      - "Increase the GSI's provisioned read and write capacity units so scoped queries never throttle across co-located tenants"
      - "Enable point-in-time recovery on the base table so any cross-tenant read can be rolled back within the 35-day window"
      - "Keep tenant_id as the GSI partition key, include tenant id in the GSI key schema, or explicitly Deny query actions on that index"
      - "Move the GSI into a separate Region via global-table replication so the cross-Region boundary keeps each tenant's index entries apart"
    answer: 2
    explanation: |
      The leak is about scoping, so the fix is to make tenant id part of the GSI
      key or deny querying it. Throughput, PITR, and cross-Region moves don't
      address who can read across tenants.
    ref: "concepts.md#dynamodb-item-collections-gsis-and-cross-tenant-leaks"

  # ---------------- RDS/Aurora RLS ----------------
  - id: aws-saas-data-partitioning-038
    difficulty: beginner
    tags: [rls, postgres, pool]
    question: |
      For the pool model on PostgreSQL, what does AWS Prescriptive Guidance say is
      required to enforce tenant isolation?
    options:
      - "IAM policies with dynamodb:LeadingKeys"
      - "PostgreSQL Row-Level Security (RLS)"
      - "A separate VPC per tenant"
      - "Nothing beyond a tenant_id column"
    answer: 1
    explanation: |
      RLS is required for pooled PostgreSQL because IAM can't filter rows.
      LeadingKeys is DynamoDB-only; a tenant_id column alone is just partitioning.
    ref: "concepts.md#rds-and-aurora-pooled-isolation-with-postgresql-row-level-security"

  - id: aws-saas-data-partitioning-039
    difficulty: intermediate
    tags: [rls, session-variable]
    question: |
      Which RLS binding method does AWS prefer for scalable multi-tenant SaaS on
      PostgreSQL?
    options:
      - "Compare the tenant column to the current PostgreSQL user (a DB user per tenant)"
      - "Use a BEFORE-SELECT trigger that rewrites every incoming query to append the tenant predicate before the planner sees it"
      - "Hardcode each tenant's id as a literal inside a separate per-tenant policy compiled at deploy time"
      - "Compare the tenant column to a runtime session variable the app sets per request, e.g. current_setting('app.current_tenant')"
    answer: 3
    explanation: |
      The session-variable method scales because it doesn't need a DB user per
      tenant; the app sets app.current_tenant from JWT context each request. A user
      per tenant doesn't scale; the others aren't AWS's pattern.
    ref: "concepts.md#rds-and-aurora-pooled-isolation-with-postgresql-row-level-security"

  - id: aws-saas-data-partitioning-040
    difficulty: advanced
    tags: [rls, bypass, superuser]
    question: |
      An audit finds that the SaaS app connects to PostgreSQL as the table owner.
      Why is this an isolation risk even though RLS is enabled on every tenant
      table?
    options:
      - "Table owners can only read rows they inserted themselves, so an owner connection can never see another tenant's data"
      - "RLS policies are silently disabled whenever the client connects without TLS, so a plaintext owner connection skips them"
      - "The table owner (and superusers / BYPASSRLS roles) bypass RLS by default; you must use FORCE ROW LEVEL SECURITY and connect as a non-owner, non-superuser role"
      - "Owners are automatically scoped to the tenant named in their PostgreSQL role, so ownership itself enforces the boundary"
    answer: 2
    explanation: |
      RLS does not apply to the table owner/superuser/BYPASSRLS roles unless FORCE
      ROW LEVEL SECURITY is set; connecting as owner silently bypasses isolation.
      The app must use a restricted role.
    ref: "concepts.md#rds-and-aurora-pooled-isolation-with-postgresql-row-level-security"

  - id: aws-saas-data-partitioning-041
    difficulty: advanced
    tags: [rls, session-reuse, leak]
    question: |
      Using the session-variable RLS method with a shared connection pool, what
      subtle bug reintroduces a cross-tenant leak?
    options:
      - "Reusing a pooled connection for a new request without resetting app.current_tenant, so the new tenant's queries run with the previous tenant's context"
      - "Enabling RLS on so many tables that the planner drops the tenant predicate on the least-recently-used ones"
      - "Using a UUID rather than an integer for tenant_id, which overflows the session variable and matches the wrong tenant"
      - "Adding a WITH CHECK clause to the policy, which re-evaluates reads against another tenant's rows on write"
    answer: 0
    explanation: |
      If the session variable isn't reset per request, a reused connection serves
      the prior tenant's data. Enabling RLS broadly and WITH CHECK are good
      practices; UUID is fine.
    ref: "concepts.md#rds-and-aurora-pooled-isolation-with-postgresql-row-level-security"

  - id: aws-saas-data-partitioning-042
    difficulty: expert
    tags: [rls, policy, sql]
    question: |
      In the canonical AWS RLS policy `CREATE POLICY ... USING (tenant_id =
      current_setting('app.current_tenant')::UUID)`, what does the USING clause
      cover, and how are writes handled?
    options:
      - "USING covers only DELETE and SELECT; INSERT and UPDATE run unprotected unless you disable RLS"
      - "USING validates writes against the predicate; reads are unfiltered until you add a matching FOR SELECT policy"
      - "USING is ignored by the planner unless you also attach a row-rewrite trigger that re-applies the predicate"
      - "USING filters reads and implies a matching WITH CHECK for writes, so inserts/updates must also satisfy the tenant predicate"
    answer: 3
    explanation: |
      USING filters which rows are visible/affected for reads and implies WITH
      CHECK enforcement on writes, so a tenant can't insert/update rows for another
      tenant. The other options misstate RLS semantics.
    ref: "concepts.md#rds-and-aurora-pooled-isolation-with-postgresql-row-level-security"

  - id: aws-saas-data-partitioning-043
    difficulty: intermediate
    tags: [rls, coverage, leak]
    question: |
      Why does AWS say to enable RLS on EVERY table containing tenant data?
    options:
      - "Because RLS improves query performance by pruning non-tenant rows before the index scan on every table"
      - "Because a single table where you forgot to ENABLE RLS is a silent cross-tenant leak"
      - "Because PostgreSQL requires RLS on every table before logical replication can stream the tenant rows"
      - "Because RLS reduces storage cost by compressing each tenant's rows into a separate on-disk segment"
    answer: 1
    explanation: |
      RLS is per table; any tenant-data table without it is fully readable across
      tenants — a silent leak. It's a correctness/isolation requirement, not a
      perf, replication, or cost feature.
    ref: "concepts.md#rds-and-aurora-pooled-isolation-with-postgresql-row-level-security"

  # ---------------- RDS Proxy ----------------
  - id: aws-saas-data-partitioning-044
    difficulty: intermediate
    tags: [rds-proxy, connections]
    question: |
      In a pooled RDS/Aurora data model, what problem does RDS Proxy primarily
      solve?
    options:
      - "It enforces row-level security by injecting the tenant predicate into each query as it passes through the proxy"
      - "It encrypts data at rest by re-wrapping each tenant's rows with a per-connection KMS data key at the proxy layer"
      - "It multiplexes and queues database connections to prevent connection exhaustion, since the max connection count is capped by the DB instance class"
      - "It shards tenants across Regions by routing each connection to the nearest replica based on the tenant's home Region"
    answer: 2
    explanation: |
      RDS Proxy pools/multiplexes connections to avoid exhausting the instance
      class's connection ceiling under many tenants. It doesn't do RLS, encryption
      at rest, or cross-Region sharding.
    ref: "concepts.md#connection-pooling-with-rds-proxy"

  - id: aws-saas-data-partitioning-045
    difficulty: advanced
    tags: [rds-proxy, pinning, tension]
    question: |
      What is the design tension between per-request `SET app.current_tenant`
      (RLS) and RDS Proxy?
    options:
      - "Session-level SET statements cause RDS Proxy session pinning, which disables multiplexing and undercuts the proxy's efficiency"
      - "SET statements are not supported by PostgreSQL, so the app must instead pass the tenant id as a bind parameter on every call"
      - "RDS Proxy silently resets all RLS policies to their default USING clause each time a pooled connection is borrowed"
      - "RDS Proxy requires exactly one dedicated database connection per tenant by design, so multiplexing never applies to RLS"
    answer: 0
    explanation: |
      Setting session variables pins the connection, so it can't be reused across
      tenants — the exact tension between RLS session state and proxy
      multiplexing. Mitigations include minimizing pinning or direct scoped
      connections.
    ref: "concepts.md#connection-pooling-with-rds-proxy"

  - id: aws-saas-data-partitioning-046
    difficulty: expert
    tags: [rds-proxy, mitigation]
    question: |
      Given session pinning defeats RDS Proxy multiplexing for a pooled RLS design,
      which mitigation does AWS documentation describe as a last resort?
    options:
      - "Disable RLS entirely and re-add per-tenant WHERE clauses in the application data-access layer"
      - "Use one shared session variable set to a wildcard tenant so every pooled connection matches all rows"
      - "Move all tenants to DynamoDB, where LeadingKeys replaces the pinned RLS session state"
      - "Drop the client-side connection pool and make direct, scoped connections per request"
    answer: 3
    explanation: |
      When pinning is unavoidable, one documented mitigation is to forgo the shared
      client pool and use direct per-request scoped connections. Disabling RLS or
      sharing one tenant variable would break isolation.
    ref: "concepts.md#connection-pooling-with-rds-proxy"

  # ---------------- S3 ----------------
  - id: aws-saas-data-partitioning-047
    difficulty: beginner
    tags: [s3, prefix, pool]
    question: |
      How is the pool model implemented for tenant data on Amazon S3?
    options:
      - "One dedicated bucket per tenant, isolated by the bucket boundary and a distinct bucket policy each"
      - "One aggregated object per tenant that holds all of that tenant's data regardless of total size"
      - "One shared bucket with a per-tenant key prefix (s3://bucket/${tenantId}/...) scoped by IAM/session policies using s3:prefix and resource ARNs"
      - "A DynamoDB table that stores the objects inline as item attributes instead of using S3 at all"
    answer: 2
    explanation: |
      Prefix-per-tenant in one bucket, isolated with s3:prefix conditions and
      resource ARNs via STS scoped policies, is the S3 pool pattern.
      Bucket-per-tenant is the silo variant.
    ref: "concepts.md#s3-tenant-data-prefix-per-tenant-versus-bucket-per-tenant"

  - id: aws-saas-data-partitioning-048
    difficulty: intermediate
    tags: [s3, bucket-per-tenant, limits]
    question: |
      What is the constraint on a bucket-per-tenant (S3 silo) design at very large
      tenant counts?
    options:
      - "S3 buckets cannot have IAM or bucket policies, so per-tenant buckets cannot be access-scoped at all"
      - "Buckets cannot be encrypted at rest once tenant counts exceed the default account quota"
      - "There is a bounded per-account bucket ceiling (default 10,000, raisable to ~1,000,000) plus heavy per-bucket provisioning/monitoring overhead, so prefix-per-tenant is usually preferred at massive scale"
      - "Objects stored in different buckets cannot be listed together in a single paginated request"
    answer: 2
    explanation: |
      The default general-purpose-bucket quota is now 10,000 per account (raisable
      to ~1,000,000 via Service Quotas), so bucket-per-tenant stretches to many
      thousands of tenants — but it is still a hard per-account ceiling and each
      bucket adds provisioning/monitoring/lifecycle overhead, so prefix-per-tenant
      is preferred at very large or fast-churning scale. Buckets do support IAM
      policies and encryption; the other options are false.
    ref: "concepts.md#s3-tenant-data-prefix-per-tenant-versus-bucket-per-tenant"

  - id: aws-saas-data-partitioning-049
    difficulty: advanced
    tags: [s3, performance, prefix]
    question: |
      How does prefix-per-tenant on S3 interact with S3 request-rate scaling?
    options:
      - "It helps: S3 scales per prefix (~3,500 write and ~5,500 read requests/sec per prefix), so multiple tenant prefixes increase aggregate throughput"
      - "It hurts throughput because every prefix in a bucket shares one account-wide request-rate limit"
      - "It has no effect on throughput because S3 request-rate limits are enforced per bucket, not per prefix"
      - "It forces all tenant requests into a single index partition, serializing them behind one hot prefix"
    answer: 0
    explanation: |
      S3 request-rate limits are per prefix, so spreading tenants across prefixes
      raises aggregate throughput — a rare case where the isolation layout also
      aids performance.
    ref: "concepts.md#s3-tenant-data-prefix-per-tenant-versus-bucket-per-tenant"

  - id: aws-saas-data-partitioning-050
    difficulty: intermediate
    tags: [s3, access-grants]
    question: |
      Which newer S3 primitive offers a managed alternative to hand-rolled
      prefix-scoped IAM policies for mapping tenants/identities to data?
    options:
      - "S3 Intelligent-Tiering, which moves each tenant's prefix between access tiers to scope who can read it"
      - "S3 Transfer Acceleration, which routes each tenant through an edge endpoint that also enforces prefix access"
      - "S3 Access Grants (maps identities/tenants to prefix-scoped access, integrates with an IdP)"
      - "S3 Object Lock, which pins a retention policy per tenant prefix and grants access to matching identities"
    answer: 2
    explanation: |
      S3 Access Grants maps identities to prefix-scoped permissions and integrates
      with an IdP. Transfer Acceleration, Intelligent-Tiering, and Object Lock
      address speed, cost, and immutability, not tenant access mapping.
    ref: "concepts.md#s3-tenant-data-prefix-per-tenant-versus-bucket-per-tenant"

  # ---------------- Scoped credentials / dynamic policy ----------------
  - id: aws-saas-data-partitioning-051
    difficulty: intermediate
    tags: [scoped-credentials, pooled-compute]
    question: |
      Why must pooled compute (a Lambda/container serving all tenants) acquire
      tenant-scoped credentials at runtime rather than relying on its execution
      role?
    options:
      - "Because a Lambda function cannot be assigned an execution role, so it must fetch credentials from STS at startup"
      - "Because IAM execution roles expire every 60 seconds and must be re-vended before each tenant request"
      - "Because runtime STS credentials are billed at a lower rate than a static execution role's API calls"
      - "Because the pooled compute's role can, by construction, touch all tenants' data, so scope must be narrowed per request to the current tenant"
    answer: 3
    explanation: |
      A pooled role is broad by necessity; without per-request narrowing, a bug
      could touch any tenant. So you acquire fresh scoped credentials before
      touching data. The other reasons are false.
    ref: "concepts.md#enforcing-isolation-with-scoped-credentials-and-dynamic-policies"

  - id: aws-saas-data-partitioning-052
    difficulty: advanced
    tags: [dynamic-policy, token-vending-machine]
    question: |
      Why does AWS recommend the dynamic policy ("token vending machine") approach
      over pre-creating one IAM role/policy per tenant?
    options:
      - "Pre-created per-tenant IAM entities hit IAM entity-count limits at scale; a policy template hydrated at runtime and passed as an inline session policy to sts:AssumeRole scales without those limits"
      - "Pre-created per-tenant roles are inherently less secure because static roles cannot carry any tenant-scoping condition keys"
      - "Dynamic policies avoid STS entirely by signing each request with the compute's own execution-role credentials instead"
      - "Pre-created per-tenant roles cannot use IAM condition keys, so they cannot restrict access to a single tenant's data"
    answer: 0
    explanation: |
      Thousands of tenants would exhaust IAM entity limits. The template + inline
      session policy approach keeps policies in your versioned pipeline and scales.
      Both approaches can use conditions; dynamic policies still use STS.
    ref: "concepts.md#enforcing-isolation-with-scoped-credentials-and-dynamic-policies"

  - id: aws-saas-data-partitioning-053
    difficulty: advanced
    tags: [abac, session-tags, fail-closed]
    question: |
      In the ABAC/session-tag isolation pattern, which two details make it fail
      closed and leak-resistant?
    options:
      - "Enabling S3 object versioning and MFA delete so a leaked write can be rolled back before another tenant reads it"
      - "Reading the tenant id from a client-supplied header and matching it against a wildcard resource ARN in the policy"
      - "Deriving tenantId server-side and passing it as an STS session tag matched by ${aws:PrincipalTag/tenantId}, PLUS a Null condition (missing tag = deny) and an explicit Deny on Scan"
      - "Granting dynamodb:* on all tables and relying on the application layer to filter each query by tenant"
    answer: 2
    explanation: |
      Server-derived tenantId as a session tag, a Null condition that denies when
      the tag is missing, and a Deny on Scan together fail closed. Trusting a
      client claim or granting broad actions is the opposite of leak-resistant.
    ref: "concepts.md#enforcing-isolation-with-scoped-credentials-and-dynamic-policies"

  - id: aws-saas-data-partitioning-054
    difficulty: expert
    tags: [null-condition, fail-closed]
    question: |
      What does the `"Null": {"aws:PrincipalTag/tenantId": "false"}` condition
      achieve in a tenant-scoping IAM policy?
    options:
      - "It allows access only when the tenant tag is absent, so untagged internal requests are permitted while tagged ones are blocked"
      - "It denies access when the tenant tag is missing, so a request without tenant context reads nothing instead of everything (fail closed)"
      - "It nullifies the tenant id in the CloudTrail record so audit logs never expose which tenant a request touched"
      - "It sets the tenant id to a default fallback value whenever the session tag is not supplied by the caller"
    answer: 1
    explanation: |
      The Null condition requires the tenant tag to be present ("false" means the
      key must NOT be null) for the Allow to apply, so a missing tag fails closed to
      no access. It doesn't allow absence or set defaults.
    ref: "concepts.md#enforcing-isolation-with-scoped-credentials-and-dynamic-policies"

  - id: aws-saas-data-partitioning-055
    difficulty: expert
    tags: [scoped-credentials, isolation-manager]
    question: |
      What is the operating convention of the runtime "isolation manager" pattern?
    options:
      - "Cache one broad, all-tenant credential at pod startup and reuse it across every tenant for the pod's whole lifetime"
      - "Use the compute's own instance-profile role directly for every tenant to skip the extra credential-vending round trip"
      - "Read the tenant id straight from the request URL path and trust it as-is, skipping any server-side validation step"
      - "Always acquire fresh tenant-scoped temporary credentials before accessing any tenant resource, and use only those"
    answer: 3
    explanation: |
      The convention is to always fetch fresh scoped credentials per request and
      use only those to touch data. Reusing a broad credential or the instance
      profile directly defeats pooled isolation; unvalidated tenant ids are unsafe.
    ref: "concepts.md#enforcing-isolation-with-scoped-credentials-and-dynamic-policies"

