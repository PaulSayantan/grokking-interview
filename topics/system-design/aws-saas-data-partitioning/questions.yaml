      - "Alarm only when the total account cost doubles month over month, treating the aggregated bill as the single signal for noisy-neighbor detection"
      - "Alarm when a tenant's consumption exceeds roughly 3x its own historical baseline, catching abnormal usage before it forces scaling that raises everyone's bill"
      - "Alarm only at the end of each billing cycle, once the finalized cost allocation report reveals which tenant consumed the most that month"
