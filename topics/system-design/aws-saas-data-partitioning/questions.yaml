    options:
      - "Pool, because the app must add RLS/scoped-credential integration, per-request tenant context, and tenant-aware cache keys everywhere the boundary is only a column value"
      - "Silo, because the application code itself must be rewritten to route every query, cache lookup, and credential fetch to the current tenant's dedicated instance"
      - "Bridge-databases, because every read and write path in the application must be refactored to reconcile the tenant map against per-request row-level filters"
      - "All four models impose an identical tenant-aware refactor cost, since isolation is enforced entirely in the data tier regardless of the model chosen"
    answer: 0
    explanation: |
      Pool pushes isolation into the app/data layer: session variables, scoped
      creds, tenant-aware caching. Silo's cost is provisioning automation, not app
      refactor; bridge-db's map lookup is lighter than pervasive tenant-aware code.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-saas-data-partitioning-082
    difficulty: expert
    tags: [trade-offs, mixed-portfolio, tiering]
    question: |
      A SaaS has three large regulated enterprises and 40,000 small tenants. Which
      architecture best balances the portfolio?
    options:
      - "Silo all 40,003 tenants for maximum isolation, giving even the 40,000 small tenants a dedicated instance so the regulated enterprises and the long tail share nothing"
      - "Pool all 40,003 tenants for maximum efficiency, placing the three regulated enterprises in the same shared schema as the 40,000 small tenants to cut cost"
      - "Bridge/tiered: silo the three regulated enterprises, pool the 40,000 small tenants, and route by the tier claim in the JWT"
      - "Give every one of the 40,003 tenants its own dedicated AWS account, using the account boundary as the isolation mechanism for the entire portfolio"
    answer: 2
    explanation: |
      The realistic ISV answer is tiered/bridge: silo the few that need it, pool the
      long tail, route by JWT tier. Siloing everyone hits limits/cost; pooling
      everyone fails the regulated tenants; account-per-tenant doesn't scale.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-saas-data-partitioning-083
    difficulty: intermediate
    tags: [trade-offs, cross-query]
    question: |
      Two SaaS teams both use PostgreSQL. Team A never queries across tenants; Team
      B runs frequent cross-tenant analytics. Which bridge variant suits each?
    options:
      - "A: schema-per-tenant so cross-queries are easy; B: database-per-tenant so its frequent cross-tenant analytics run natively across separate databases"
      - "Both teams should abandon bridge and move to silo instances, one dedicated PostgreSQL cluster per tenant, regardless of their cross-query needs"
      - "Both teams should use the pool model only, co-mingling every tenant in one shared schema no matter how often they query across tenants"
      - "A: database-per-tenant (strong isolation, no cross-query needed); B: schema-per-tenant (one DB, easy cross-tenant queries)"
    answer: 3
    explanation: |
      No cross-query → database-per-tenant maximizes isolation; frequent
      cross-query → schema-per-tenant keeps everyone in one DB for easy aggregation.
      This is straight from the matrix's use-case column.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  # ---------------- AWS limits ----------------
  - id: aws-saas-data-partitioning-084
    difficulty: intermediate
    tags: [limits, organizations, silo]
    question: |
      Which AWS limit does a naive "account-per-tenant" silo design run into
      first as it scales?
    options:
      - "AWS Organizations account limits (default 10, raisable) and Control Tower's 1,000 accounts per OU"
      - "The DynamoDB 400 KB item-size limit, which each tenant's dedicated account hits once its records grow past a single item"
      - "The S3 per-prefix request rate ceiling, which throttles once every tenant account routes its traffic through one shared bucket prefix"
      - "The Lambda reserved-concurrency quota, which is exhausted as each per-tenant account reserves its own slice of function concurrency"
    answer: 0
    explanation: |
      Account-per-tenant is bounded by Organizations account quotas and Control
      Tower's 1,000-accounts-per-OU (10,000 per landing zone). Item size, S3 rate,
      and Lambda concurrency aren't the account-scaling constraint.
    ref: "concepts.md#aws-service-limits-that-constrain-these-designs"

  - id: aws-saas-data-partitioning-085
    difficulty: advanced
    tags: [limits, vpc, subnet]
    question: |
      A design gives each tenant its own VPC in one Region (Nagarro pattern 3).
      Which limit caps this first, and what's the default?
    options:
      - "Subnets per VPC, default 200 (raisable via Service Quotas), hit first because each tenant VPC needs many subnets"
      - "Security groups per VPC, default 2,500 (raisable via Service Quotas), exhausted first as per-tenant rules accumulate"
      - "VPCs per Region, default 5 (raisable via Service Quotas)"
      - "Route tables per VPC, default 200 (raisable via Service Quotas), reached first as each tenant VPC adds its own tables"
    answer: 2
    explanation: |
      VPC-per-tenant is capped by the per-Region VPC quota (default 5, raisable).
      The 200-subnets limit caps the subnet-per-tenant pattern instead; the others
      aren't the first ceiling here.
    ref: "concepts.md#aws-service-limits-that-constrain-these-designs"

  - id: aws-saas-data-partitioning-086
    difficulty: intermediate
    tags: [limits, organizations, ou]
    question: |
      In the AWS Organizations governance model for tenant grouping, what are the
      relevant ceilings?
    options:
      - "100 OUs per organization and a maximum nesting depth of 2 levels below the organization root"
      - "2,000 OUs per organization and OU nesting depth of 5 levels"
      - "Unlimited OUs and unlimited nesting depth, since Organizations imposes no ceiling on the tenant hierarchy"
      - "5 OUs per organization and a maximum nesting depth of 10 levels below the root"
    answer: 1
    explanation: |
      Organizations allows up to 2,000 OUs with nesting up to 5 levels — the
      ceilings for a governance/OU tenant hierarchy. The other values are wrong.
    ref: "concepts.md#aws-service-limits-that-constrain-these-designs"

  - id: aws-saas-data-partitioning-087
    difficulty: advanced
    tags: [limits, eventbridge, silo]
    question: |
      A team wants a dedicated EventBridge bus per tenant. Which limits constrain
      this bus-per-tenant silo?
    options:
      - "Unlimited event buses per account with no constraint, since EventBridge provisions a new bus on demand for every tenant"
      - "Exactly 1 event bus per Region, forcing every tenant to share the single Regional bus regardless of account"
      - "5 event buses per account per Region (not adjustable), capping a bus-per-tenant design at five tenants"
      - "100 event buses per account per Region (default, raisable) and 300 rules per event bus (default, raisable)"
    answer: 3
    explanation: |
      EventBridge defaults to 100 event buses per account per Region and 300 rules
      per event bus (both raisable via Service Quotas), bounding a bus-per-tenant
      design. The other numbers are incorrect.
    ref: "concepts.md#aws-service-limits-that-constrain-these-designs"

  - id: aws-saas-data-partitioning-088
    difficulty: expert
    tags: [limits, control-tower, silo]
    question: |
      An enterprise SaaS standardizes on Control Tower for account-per-tenant
      governance. Which non-adjustable limit is most likely to bite, and what's the
      escape hatch?
    options:
      - "5 accounts per landing zone (not adjustable); there is no escape hatch, so account-per-tenant caps at five tenants total"
      - "10 accounts per OU; raise it via a Service Quotas request once you approach the ceiling for a given OU"
      - "1,000 accounts per OU (not adjustable); mitigate by spreading tenants across multiple OUs (up to 10,000 accounts per landing zone)"
      - "There is no per-OU account limit, so a single OU can hold every tenant account without any governance ceiling"
    answer: 2
    explanation: |
      Control Tower's 1,000-accounts-per-OU is not adjustable; you distribute
      tenants across OUs toward the ~10,000-per-landing-zone ceiling. The other
      figures are wrong.
    ref: "concepts.md#aws-service-limits-that-constrain-these-designs"

  - id: aws-saas-data-partitioning-089
    difficulty: beginner
    tags: [limits, dynamodb, throughput]
    question: |
      What is DynamoDB's per-partition write throughput ceiling?
    options:
      - "1,000 WCU"
      - "3,000 WCU"
      - "40,000 WCU"
      - "100 WCU"
    answer: 0
    explanation: |
      A single physical partition tops out at 1,000 WCU (and 3,000 RCU strongly
      consistent). This ceiling drives write sharding for hot tenants.
    ref: "concepts.md#aws-service-limits-that-constrain-these-designs"

  # ---------------- Extra cross-cutting / estimation ----------------
  - id: aws-saas-data-partitioning-090
    difficulty: expert
    tags: [estimation, cost, break-even]
    question: |
      A pooled tenant consumes an estimated $180/month of shared infrastructure
      (attributed via cost allocation tags). A dedicated silo footprint for that
      tenant would cost $120/month. Applying the break-even model, what should you
      do?
    options:
      - "Keep them in pool because the pool model is always cheaper per tenant, so the $180 attributed share must be a tagging error rather than a real cost"
      - "Do nothing, because attributed cost is never a valid migration signal and the break-even model applies only to compliance or whale-driven moves"
      - "Delete the tenant's data to reclaim the $180 of shared infrastructure, since a tenant costing more than a dedicated footprint is no longer profitable"
      - "Offer/migrate them to silo, because their pooled cost share ($180) exceeds the dedicated cost ($120), and silo also improves their isolation"
    answer: 3
    explanation: |
      When pooled cost share exceeds dedicated cost, the break-even model says silo
      is cheaper AND more isolated — migrate. Pool is not always cheaper, and cost
      is a legitimate migration trigger.
    ref: "concepts.md#per-tenant-cost-attribution-and-metering"

  - id: aws-saas-data-partitioning-091
    difficulty: expert
    tags: [dynamodb, capacity, estimation]
    question: |
      A whale tenant needs sustained 4,000 WCU on a pooled table where tenant_id is
      the partition key. Given the per-partition ceiling, what is the minimum
      viable design change?
    options:
      - "Rely on DynamoDB adaptive capacity alone to push the single partition past 4,000 WCU, since it silently lifts the per-partition ceiling for a sustained hot key"
      - "Write-shard the tenant across at least 4 partition-key suffixes (since 1,000 WCU/partition), storing the shard map in the tenant lookup table and fanning out reads"
      - "Raise the 400 KB item-size limit via a Service Quotas request so each write carries more data and fewer write units are consumed per operation overall"
      - "Add several local secondary indexes so writes are spread across the extra index partitions and thereby bypass the per-partition write-capacity cap"
    answer: 1
    explanation: |
      4,000 WCU exceeds the 1,000 WCU/partition ceiling, so you need >=4 shard
      suffixes to spread the load. Adaptive capacity can't exceed the hard ceiling;
      item size and LSIs are irrelevant to write throughput distribution.
    ref: "concepts.md#dynamodb-hot-tenants-and-write-sharding"

  - id: aws-saas-data-partitioning-092
    difficulty: advanced
    tags: [verified-permissions, authorization]
    question: |
      For fine-grained authorization in multi-tenant SaaS, what is the trade-off
      between an Amazon Verified Permissions per-tenant policy store and a shared
      multi-tenant policy store?
    options:
      - "A per-tenant policy store is always the wrong choice because Verified Permissions caps you at one policy store per account, so it cannot scale past a single tenant"
      - "A shared multi-tenant policy store automatically encrypts each tenant's policies under a distinct per-tenant KMS key, so it needs no further isolation controls"
      - "Per-tenant policy store gives silo-like isolation (recommended when tenants need unique policies); a shared store pools policies but RBAC/role-mapping data must NOT live in the shared store, to preserve isolation"
      - "There is no isolation difference between them because Verified Permissions evaluates every policy inside a single global engine that ignores which store a policy came from"
    answer: 2
    explanation: |
      Per-tenant policy stores isolate policy logic (good for unique per-tenant
      policies); a shared store pools but requires keeping role-mapping data out of
      it to avoid cross-tenant exposure. The other options are false.
    ref: "concepts.md#enforcing-isolation-with-scoped-credentials-and-dynamic-policies"

  - id: aws-saas-data-partitioning-093
    difficulty: intermediate
    tags: [other-stores, breadth]
    question: |
      Which enforcement mechanism is correctly paired with its data store for
      pooled multi-tenancy?
    options:
      - "OpenSearch: custom routing + Document-Level Security (DLS); Neptune: named graph per tenant; Redshift: Datashares"
      - "OpenSearch: dynamodb:LeadingKeys conditions scope each tenant's index shards, the same IAM mechanism DynamoDB uses on the partition key"
      - "Redshift: a PostgreSQL RLS session variable set per request, since Redshift shares the Postgres engine and evaluates the same USING predicates"
      - "Neptune: S3 prefix policies that scope each tenant's named graph to a per-tenant key prefix enforced by s3:prefix conditions"
    answer: 0
    explanation: |
      Pooled isolation maps to DLS+custom routing on OpenSearch, named graphs on
      Neptune, and Datashares on Redshift. The other pairings misapply mechanisms
      across stores.
    ref: "concepts.md#silo-model-full-instance-isolation"

  - id: aws-saas-data-partitioning-094
    difficulty: advanced
    tags: [neptune, leak, breadth]
    question: |
      On a pooled Amazon Neptune (RDF) graph using a named graph per tenant, what
      is the specific cross-tenant leak vector?
    options:
      - "Storing more than the per-graph limit of triples, which spills the overflow into a neighboring tenant's named graph and exposes it on read"
      - "Enabling IAM database authentication, which grants every connected principal read access across all named graphs regardless of the query"
      - "Using SPARQL instead of Gremlin, because the SPARQL endpoint ignores named-graph boundaries while the Gremlin traversal engine enforces them"
      - "A query that omits the named graph spans ALL tenants' data, so the app must always scope every query to the tenant's named graph"
    answer: 3
    explanation: |
      In Neptune RDF, a query without a named-graph scope reads across all tenants —
      analogous to a forgotten WHERE or an unscoped Scan. The app must always scope
      to the tenant graph. The other options aren't leak vectors.
    ref: "concepts.md#silo-model-full-instance-isolation"

  - id: aws-saas-data-partitioning-095
    difficulty: beginner
    tags: [sub-models, cost]
    question: |
      Which data-tier sub-model offers the BEST economies of scale (lowest cost per
      tenant at high tenant counts)?
    options:
      - "Silo (instance per tenant)"
      - "Bridge-databases"
      - "Pool (shared schema + tenant_id)"
      - "VPC per tenant"
    answer: 2
    explanation: |
      Pool shares one fleet across all tenants, giving the best density and lowest
      per-tenant cost. Silo and per-tenant-VPC designs carry idle capacity and
      per-tenant overhead.
    ref: "concepts.md#the-four-data-layer-isolation-sub-models"

  - id: aws-saas-data-partitioning-096
    difficulty: intermediate
    tags: [enforcement, mapping, summary]
    question: |
      Match the store to its canonical pooled-isolation enforcement mechanism.
    options:
      - "DynamoDB -> PostgreSQL RLS on each item; RDS/Aurora -> dynamodb:LeadingKeys on the primary key; S3 -> per-tenant named graphs scoped by prefix"
      - "DynamoDB -> dynamodb:LeadingKeys (+ Deny Scan); RDS/Aurora -> PostgreSQL RLS session variable; S3 -> prefix + scoped session policy / Access Grants"
      - "DynamoDB -> S3 key-prefix policies; RDS/Aurora -> Redshift-style Datashares between tenants; S3 -> PostgreSQL row-level security on each object"
      - "All three stores -> a single IAM policy performing row-level filtering, since IAM can inspect and filter individual rows returned by any AWS data store"
    answer: 1
    explanation: |
      The correct mapping is LeadingKeys (DynamoDB), RLS (RDS/Aurora), and
      prefix/scoped policy or Access Grants (S3). IAM cannot row-filter RDS, so
      "all three -> IAM row filtering" is wrong; the other distractors swap
      mechanisms across stores.
    ref: "concepts.md#enforcing-isolation-with-scoped-credentials-and-dynamic-policies"
