  - id: aws-saas-data-partitioning-062
    difficulty: advanced
    tags: [cross-tenant-leak, cache-key]
    question: |
      A pooled service enforces isolation with both Postgres RLS and IAM
      LeadingKeys, yet still occasionally serves Tenant A's data to Tenant B.
      Which leak vector is MOST likely, given RLS/IAM are correct?
    options:
      - "A missing WHERE clause (RLS would prevent it)"
      - "The 400 KB item limit"
      - "An unscoped Scan (IAM Deny would prevent it)"
      - "A cache key that omits the tenant id, so a cached result for A is served to B — the cache sits above the RLS/IAM enforcement plane"
    answer: 3
    explanation: |
      A tenant-agnostic cache key leaks across tenants precisely because the cache
      is outside the DB/API enforcement layer that RLS and LeadingKeys protect.
      RLS/IAM would catch the missing WHERE and the Scan; the item limit is
      unrelated.
    ref: "concepts.md#the-catastrophic-failure-cross-tenant-data-leak-and-defense-in-depth"

  - id: aws-saas-data-partitioning-063
    difficulty: advanced
    tags: [cross-tenant-leak, trust]
    question: |
      Which practice creates a leak by trusting untrusted input?
    options:
      - "Deriving tenant id server-side from a validated JWT"
      - "Using an STS session tag for tenant id"
      - "Taking the tenant id directly from a client-supplied request body or an unvalidated claim and using it to scope queries"
      - "Enabling RLS on all tables"
    answer: 2
    explanation: |
      Trusting a client-supplied/unvalidated tenant id lets an attacker request
      another tenant's data. The safe pattern derives tenant id server-side from a
      validated token; session tags and RLS are correct controls.
    ref: "concepts.md#the-catastrophic-failure-cross-tenant-data-leak-and-defense-in-depth"

  - id: aws-saas-data-partitioning-064
    difficulty: expert
    tags: [defense-in-depth, layers]
    question: |
      Which set of layers best describes AWS's defense-in-depth model against
      cross-tenant leaks?
    options:
      - "A single strong IAM policy is sufficient"
      - "Identity (server-derived JWT context) + credential (per-request STS scoped creds/session tags) + infrastructure fail-closed (IAM LeadingKeys/Null/Deny Scan or RLS) + application (tenant filters and tenant-aware cache keys) + detective (CloudTrail/CloudWatch anomalies)"
      - "Encryption at rest plus TLS in transit only"
      - "Network isolation via VPC only"
    answer: 1
    explanation: |
      Defense in depth combines identity, credential, infrastructure-enforcement,
      application, and detective layers so no single bug is fatal. One IAM policy,
      encryption alone, or network isolation alone is insufficient.
    ref: "concepts.md#the-catastrophic-failure-cross-tenant-data-leak-and-defense-in-depth"

  - id: aws-saas-data-partitioning-065
    difficulty: intermediate
    tags: [cross-tenant-leak, checklist]
    question: |
      Which of the following is NOT prevented by DynamoDB dynamodb:LeadingKeys
      alone?
    options:
      - "A Query on a GSI keyed on a non-tenant attribute that spans all tenants"
      - "A Query scoped to another tenant"
      - "A GetItem for another tenant's partition key"
      - "A PutItem writing to another tenant's partition key"
    answer: 0
    explanation: |
      LeadingKeys scopes base-table partition-key operations (GetItem/Query/PutItem)
      but not a GSI keyed on a non-tenant attribute, which reads across tenants —
      hence you must scope or deny the GSI.
    ref: "concepts.md#the-catastrophic-failure-cross-tenant-data-leak-and-defense-in-depth"

  # ---------------- Noisy neighbor ----------------
  - id: aws-saas-data-partitioning-066
    difficulty: intermediate
    tags: [noisy-neighbor, rds]
    question: |
      At the data tier on RDS/Aurora, what are the two classic noisy-neighbor
      failure modes and their mitigations?
    options:
      - "Item size and Scan; mitigate with sharding"
      - "GSI cost and LSI limits; mitigate with on-demand mode"
      - "Shared connection-pool exhaustion (instance-class cap) and one tenant's heavy query starving CPU/IO; mitigate with RDS Proxy, read replicas, per-tenant query throttling, or promoting the whale to a silo instance"
      - "Cognito throttling and JWT size; mitigate with more app clients"
    answer: 2
    explanation: |
      On RDS the noisy-neighbor issues are connection exhaustion and resource
      starvation from heavy queries; RDS Proxy, replicas, throttling, or siloing the
      whale address them. The other options mix in DynamoDB/Cognito concerns.
    ref: "concepts.md#noisy-neighbor-at-the-data-tier"

  - id: aws-saas-data-partitioning-067
    difficulty: advanced
    tags: [noisy-neighbor, tiering, throttling]
    question: |
      SaaS Lens PERF-3 frames performance as a tier differentiator. Which tools
      implement tier-based throttling to protect premium tenants?
    options:
      - "S3 bucket policies only"
      - "CloudFront cache invalidation"
      - "KMS key rotation"
      - "API Gateway usage plans (rate/burst/quota per tier), Lambda reserved concurrency per tier, and EKS ResourceQuotas/LimitRanges per namespace with dedicated nodes for premium"
    answer: 3
    explanation: |
      Tiered throttling uses API Gateway usage plans, Lambda reserved concurrency,
      and EKS resource quotas/dedicated nodes. The other options don't implement
      per-tier throttling.
    ref: "concepts.md#noisy-neighbor-at-the-data-tier"

  - id: aws-saas-data-partitioning-068
    difficulty: intermediate
    tags: [noisy-neighbor, tiering, business]
    question: |
      Why might a SaaS deliberately cap a lower-tier tenant's throughput even when
      it has spare capacity to serve them?
    options:
      - "Because performance is a deliberate tier differentiator: capping lower tiers aligns cost with revenue and protects premium tenants"
      - "To reduce AWS bills only"
      - "Because AWS forbids serving lower tiers faster"
      - "Because lower tiers cannot use HTTPS"
    answer: 0
    explanation: |
      PERF-3 treats performance as something you sell by tier; deliberately capping
      lower tiers protects premium experience and aligns cost with revenue. It's a
      business/design choice, not an AWS restriction.
    ref: "concepts.md#noisy-neighbor-at-the-data-tier"

  # ---------------- KMS ----------------
  - id: aws-saas-data-partitioning-069
    difficulty: intermediate
    tags: [kms, encryption, crypto-shredding]
    question: |
      What is the main isolation/compliance benefit of a KMS key-per-tenant, and
      its main cost?
    options:
      - "It makes queries faster; the cost is more storage"
      - "It removes the need for RLS; the cost is nothing"
      - "Strongest crypto isolation and 'crypto-shredding' (delete the tenant's key to make its data unreadable, e.g. for GDPR); the cost is KMS key quotas, per-key cost, and management overhead scaling with tenant count"
      - "It enables cross-tenant analytics; the cost is latency"
    answer: 2
    explanation: |
      Key-per-tenant gives crypto isolation and crypto-shredding for erasure, but
      costs KMS quota, per-key fees, and management overhead per tenant. It doesn't
      replace RLS or speed up queries.
    ref: "concepts.md#per-tenant-encryption-with-kms"

  - id: aws-saas-data-partitioning-070
    difficulty: advanced
    tags: [kms, encryption-context, shared-key]
    question: |
      When using a single shared KMS key across tenants, how do you retain
      auditable, tenant-scoped cryptographic operations?
    options:
      - "By storing the tenant id in the plaintext"
      - "By carrying the tenant id in the KMS encryption context, enabling tenant-scoped grants and CloudTrail attribution (but you lose crypto-shredding)"
      - "By rotating the key per request"
      - "By creating a GSI on the ciphertext"
    answer: 1
    explanation: |
      Encryption context binds tenant id to each operation for auditable,
      grant-scoped use with a shared key, though you can't crypto-shred one tenant.
      The other options are nonsensical or unsafe.
    ref: "concepts.md#per-tenant-encryption-with-kms"

  - id: aws-saas-data-partitioning-071
    difficulty: advanced
    tags: [kms, bridge, tiering]
    question: |
      What KMS pattern commonly matches a tiered SaaS portfolio?
    options:
      - "One key for the entire account, no exceptions"
      - "No encryption for lower tiers"
      - "A new key per API request"
      - "Key-per-tenant for premium/regulated tenants and a shared key for the pooled tail, with the tenant-to-key mapping in the control-plane metadata store"
    answer: 3
    explanation: |
      Mirroring the silo/pool tiering, premium/regulated tenants get dedicated keys
      (crypto-shredding, isolation) while the tail shares a key; the mapping lives
      in control-plane metadata. Per-request keys and unencrypted tiers are wrong.
    ref: "concepts.md#per-tenant-encryption-with-kms"

  # ---------------- Backup / restore / export ----------------
  - id: aws-saas-data-partitioning-072
    difficulty: intermediate
    tags: [backup, restore, silo-vs-pool]
    question: |
      Why is per-tenant backup/restore trivial in silo but hard in pool?
    options:
      - "Pool has no backups"
      - "Silo backups are automatic and pool backups are manual only"
      - "Silo can snapshot the tenant's dedicated instance/table and restore in place; in pool a full snapshot mixes all tenants, so per-tenant restore needs export + filter by tenant id"
      - "Pool cannot be encrypted so it cannot be backed up"
    answer: 2
    explanation: |
      Silo resources map 1:1 to a tenant, so a snapshot/restore is per tenant. Pool
      shares one table, so restoring one tenant requires export and filtering
      rather than an in-place restore. The other options are false.
    ref: "concepts.md#backup-restore-and-export-per-tenant"

  - id: aws-saas-data-partitioning-073
    difficulty: advanced
    tags: [restore, pitr, pool]
    question: |
      Why is a point-in-time restore (PITR) of the whole pooled table a poor way to
      fix a single tenant's corrupted data?
    options:
      - "Restoring the whole table to a past point would roll back ALL tenants, not just the affected one; you instead export + filter that tenant or reimport its rows"
      - "PITR is not supported on shared tables"
      - "PITR only works in silo"
      - "PITR deletes the table permanently"
    answer: 0
    explanation: |
      A whole-table PITR reverts every tenant's data, which is unacceptable
      collateral damage. Per-tenant recovery needs targeted export/filter/reimport.
      PITR is supported and non-destructive; it's just too coarse here.
    ref: "concepts.md#backup-restore-and-export-per-tenant"

  - id: aws-saas-data-partitioning-074
    difficulty: expert
    tags: [gdpr, delete, pool]
    question: |
      How do you honor a GDPR "delete this one tenant" request in a shared pooled
      table?
    options:
      - "Drop the entire table"
      - "Rename the tenant_id column"
      - "Restore the table to before the tenant onboarded"
      - "A filtered delete of that tenant's rows (or crypto-shred if you used a key-per-tenant), not dropping a resource"
    answer: 3
    explanation: |
      In pool you delete the tenant's rows by filter, or crypto-shred if each
      tenant has its own KMS key. Dropping the table or a coarse restore harms all
      tenants; renaming a column does nothing.
    ref: "concepts.md#backup-restore-and-export-per-tenant"

  # ---------------- Cost attribution / metering ----------------
  - id: aws-saas-data-partitioning-075
    difficulty: intermediate
    tags: [cost, attribution, tags]
    question: |
      What tools does AWS recommend for per-tenant cost attribution in a pooled
      model where resources aren't 1:1 with tenants?
    options:
      - "There is no way to attribute pooled cost per tenant"
      - "Instrument tenant-tagged usage/metrics and use cost allocation tags, the AWS Cost & Usage Report (CUR), and Cost Explorer grouped by tenant tag"
      - "Only per-account billing works"
      - "Use CloudFront logs exclusively"
    answer: 1
    explanation: |
      Pool requires instrumentation: emit tenant-tagged usage and use cost
      allocation tags + CUR + Cost Explorer to attribute cost. Per-account billing
      is the silo answer; pooled cost is attributable with these tools.
    ref: "concepts.md#per-tenant-cost-attribution-and-metering"

  - id: aws-saas-data-partitioning-076
    difficulty: advanced
    tags: [cost, noisy-neighbor, detection]
    question: |
      A common heuristic ties noisy-neighbor detection to cost. What is it?
    options:
      - "Alarm when a tenant uses more than the account average"
      - "Alarm when total account cost doubles month over month"
      - "Alarm when a tenant's consumption exceeds roughly 3x its own historical baseline, catching abnormal usage before it forces scaling that raises everyone's bill"
      - "Alarm only at end of billing cycle"
    answer: 2
    explanation: |
      The AWS-referenced heuristic alarms at ~3x a tenant's historical baseline to
      catch abnormal usage early. Account averages/totals or end-of-cycle checks are
      too coarse or too late.
    ref: "concepts.md#per-tenant-cost-attribution-and-metering"

  - id: aws-saas-data-partitioning-077
    difficulty: expert
    tags: [cost, break-even, migration]
    question: |
      What is the data-driven trigger for moving a tenant from pool to silo?
    options:
      - "A break-even model: when the tenant's pooled share of cost exceeds what a dedicated (silo) resource would cost, offer them silo (also on a compliance/whale trigger)"
      - "When the tenant complains once"
      - "After exactly 12 months in pool"
      - "When the tenant's data exceeds 400 KB"
    answer: 0
    explanation: |
      The break-even model compares pooled cost share vs dedicated cost; crossing it
      (or a compliance/whale requirement) justifies siloing. Time-based rules or the
      400 KB item limit aren't the trigger.
    ref: "concepts.md#per-tenant-cost-attribution-and-metering"

  - id: aws-saas-data-partitioning-078
    difficulty: intermediate
    tags: [metering, marketplace]
    question: |
      Which AWS mechanism supports per-tenant usage tags for billing, and what are
      its limits?
    options:
      - "AWS Budgets, unlimited tags"
      - "AWS Config rules, 10 tags"
      - "CloudWatch Logs Insights, no limits"
      - "AWS Marketplace Metering UsageAllocations, which supports per-tenant tags with limits like 5 tags, 2,500 allocation cardinality, and 1 MB per request"
    answer: 3
    explanation: |
      Marketplace Metering UsageAllocations carries per-tenant tags with documented
      limits (5 tags, 2,500 cardinality, 1 MB request). The other services don't
      provide this metering/allocation capability.
    ref: "concepts.md#per-tenant-cost-attribution-and-metering"

  # ---------------- Trade-offs / when to use what ----------------
  - id: aws-saas-data-partitioning-079
    difficulty: advanced
    tags: [trade-offs, scenario, compliance]
    question: |
      A healthcare SaaS has 30 hospital customers, each contractually requiring "no
      shared infrastructure" and per-customer audit boundaries. Which data-tier
      model fits best and why?
    options:
      - "Pool with RLS, because it's cheapest"
      - "Bridge-schemas, because you can cross-query hospitals"
      - "Silo (dedicated instance/table per tenant), accepting higher cost, slower onboarding, and limited scale, because contractual/compliance isolation outweighs efficiency at this tenant count"
      - "Account-per-tenant is impossible, so use a single shared table"
    answer: 2
    explanation: |
      Contractual no-shared-infra + compliance at only 30 tenants is the classic
      silo case; cost/agility are secondary. Pool fails the requirement;
      cross-querying hospitals is undesirable here.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-saas-data-partitioning-080
    difficulty: advanced
    tags: [trade-offs, scenario, scale]
    question: |
      A freemium B2C SaaS expects 500,000 tenants, each with a few MB of data, and
      cost/agility are paramount. Which model and enforcement fit best?
    options:
      - "Silo per tenant with dedicated RDS instances"
      - "Pool (shared schema + tenant_id), enforced with dynamodb:LeadingKeys (DynamoDB) or PostgreSQL RLS, for best density, cost, and onboarding speed"
      - "Bridge-databases, one database per tenant"
      - "VPC per tenant"
    answer: 1
    explanation: |
      At 500k small tenants, silo/bridge/VPC-per-tenant all blow past resource
      limits and cost. Pool with RLS/LeadingKeys is the only model that scales
      cheaply — the canonical high-density answer.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-saas-data-partitioning-081
    difficulty: expert
    tags: [trade-offs, refactor-cost]
    question: |
      Which model imposes the HIGHEST "tenant-aware application refactor" cost, and
      why?
    options:
      - "Pool, because the app must add RLS/scoped-credential integration, per-request tenant context, and tenant-aware cache keys everywhere the boundary is only a column value"
      - "Silo, because you must write per-tenant provisioning"
      - "Bridge-databases, because of the tenant map"
      - "All models have identical refactor cost"
    answer: 0
    explanation: |
      Pool pushes isolation into the app/data layer: session variables, scoped
      creds, tenant-aware caching. Silo's cost is provisioning automation, not app
      refactor; bridge-db's map lookup is lighter than pervasive tenant-aware code.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-saas-data-partitioning-082
    difficulty: expert
    tags: [trade-offs, mixed-portfolio, tiering]
    question: |
      A SaaS has three large regulated enterprises and 40,000 small tenants. Which
      architecture best balances the portfolio?
    options:
      - "Silo all 40,003 tenants for maximum isolation"
      - "Pool all 40,003 tenants for maximum efficiency"
      - "Bridge/tiered: silo the three regulated enterprises, pool the 40,000 small tenants, and route by the tier claim in the JWT"
      - "Give every tenant its own AWS account"
    answer: 2
    explanation: |
      The realistic ISV answer is tiered/bridge: silo the few that need it, pool the
      long tail, route by JWT tier. Siloing everyone hits limits/cost; pooling
      everyone fails the regulated tenants; account-per-tenant doesn't scale.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-saas-data-partitioning-083
    difficulty: intermediate
    tags: [trade-offs, cross-query]
    question: |
      Two SaaS teams both use PostgreSQL. Team A never queries across tenants; Team
