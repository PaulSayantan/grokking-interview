      - "By embedding the tenant id as a path segment in the URL and parsing it out of the route on each incoming request"
      - "By injecting custom claims (tenant id, tier, often policy-store id/role) into the Cognito JWT during registration/onboarding"
      - "By performing a fresh lookup against a central tenant database on every single service hop to re-resolve the context"
    answer: 2
    explanation: |
