      - "Instrument tenant-tagged usage/metrics and use cost allocation tags, the AWS Cost & Usage Report (CUR), and Cost Explorer grouped by tenant tag"
      - "Only strict per-account billing works, so pooled cost must first be split by moving each tenant into its own linked AWS account before it can be measured"
