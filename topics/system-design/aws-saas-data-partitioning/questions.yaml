      - "It encrypts the entire request payload end to end so no downstream microservice can read the tenant's data in transit"
      - "It removes the need for any authentication at downstream hops because the bearer token itself is treated as implicit trust"
      - "It stores the tenant's full business records inside the token so each service can serve reads directly from the JWT"
    answer: 0
    explanation: |
