topic: "Distributed & Cloud Design Patterns"
domain: system-design
topic_slug: dp-distributed-cloud
version: 1
questions:
  - id: dp-distributed-cloud-001
    difficulty: beginner
    tags: [fallacies, distributed-computing, fundamentals]
    question: |
      Which set of assumptions do the "fallacies of distributed computing" describe,
      and why do they matter for this pattern catalog?
    options:
      - "False assumptions about the network (reliable, zero-latency, secure, stable topology) that each map to a resilience/integration pattern"
      - "Rules for how to shard a relational database evenly by primary-key ranges across a fixed set of nodes"
      - "Guidelines for choosing a programming language and runtime based on team familiarity and library support"
      - "Assumptions that hold true in every cloud environment, so the catalog's patterns can safely ignore them"
    answer: 0
    explanation: |
      The eight fallacies (Deutsch et al.) are false assumptions engineers keep baking in —
      the network is reliable, latency is zero, bandwidth is infinite, the network is secure,
      topology is stable, one admin, zero transport cost, homogeneous network. Each maps to a
      family of patterns (retries/timeouts, caching, security brokers, discovery), which is
      why the catalog is grounded in them.
    ref: "concepts.md#why-these-patterns-exist--the-fallacies-of-distributed-computing"

  - id: dp-distributed-cloud-002
    difficulty: beginner
    tags: [circuit-breaker, resilience, state-machine]
    question: |
      A service keeps calling a dependency that is down, piling up slow timeouts on every
      request and threatening to take the whole service down. Which pattern stops calling the
      failing dependency and fails fast until it recovers?
    options:
      - "Bulkhead"
      - "Circuit Breaker"
      - "Cache-Aside"
      - "Retry with backoff"
    answer: 1
    explanation: |
      The Circuit Breaker trips open after a failure threshold and fails fast (no downstream
      call) while open, then uses a half-open trial to test recovery. Retry keeps trying (the
      opposite), a bulkhead isolates pools, and cache-aside is a read path.
    ref: "concepts.md#circuit-breaker"

  - id: dp-distributed-cloud-003
    difficulty: intermediate
    tags: [circuit-breaker, retry, comparison]
    question: |
      What is the key distinction between the Retry pattern and the Circuit Breaker pattern?
    options:
      - "Retry works only for idempotent read queries while a circuit breaker guards only non-idempotent write operations"
      - "A circuit breaker re-attempts a failed call far more aggressively and frequently than the retry pattern does"
      - "Retry keeps re-attempting a call (for transient blips) while a circuit breaker stops calling a downed dependency (for sustained failure)"
      - "They are strict alternatives; combining them in one call path is considered an anti-pattern you must avoid"
    answer: 2
    explanation: |
      Retry handles the individual transient fault by trying again; the breaker handles the
      sustained outage by stopping calls to give the dependency room to recover. They are
      complementary — retry inside, breaker around — not alternatives.
    ref: "concepts.md#circuit-breaker"

  - id: dp-distributed-cloud-004
    difficulty: intermediate
    tags: [retry, backoff, jitter, thundering-herd]
    question: |
      Why is random jitter added to exponential backoff in the Retry pattern?
    options:
      - "To guarantee exactly-once delivery by attaching a unique random nonce to every retried request"
      - "To make non-idempotent write operations safe to retry by scrambling the order they are applied in"
      - "To deliberately make retries slower on average so the client library appears less aggressive to operators"
      - "To de-synchronize many clients that failed at the same instant, avoiding a thundering-herd retry storm"
    answer: 3
    explanation: |
      Without jitter, all clients that failed simultaneously retry simultaneously, re-killing
      the recovering service (thundering herd / retry storm). Jitter randomizes the delays so
      load spreads out. It does not make non-idempotent ops safe — that needs idempotency keys.
    ref: "concepts.md#retry-with-backoff-and-jitter"

  - id: dp-distributed-cloud-005
    difficulty: intermediate
    tags: [timeout, resilience, thread-pool]
    question: |
      A dependency is slow (not down) and callers block waiting on it, exhausting their thread
      pools until the healthy caller becomes unavailable. Which primitive most directly prevents
      this by bounding the wait?
    options:
      - "Timeout"
      - "Materialized View"
      - "Leader Election"
      - "Publish-Subscribe"
    answer: 0
    explanation: |
      A Timeout converts an unbounded wait on a hung dependency into a bounded failure, freeing
      the thread/connection. It is the foundational resilience primitive; a slow dependency
      without timeouts is the classic cause of resource-exhaustion cascades.
    ref: "concepts.md#timeout"

  - id: dp-distributed-cloud-006
    difficulty: advanced
    tags: [timeout, deadline-propagation]
    question: |
      In deadline propagation (as used by gRPC), what happens as a request flows through
      multiple hops?
    options:
      - "Each hop discards the inherited deadline and resets the timeout to its own locally configured default value"
      - "The entry service sets an absolute deadline and each hop passes the remaining budget downstream, so no hop works on an already-abandoned request"
      - "Only the final hop in the chain enforces a timeout, and all intermediate hops wait indefinitely for it"
      - "Deadlines are honored only for external client calls and are silently ignored for all internal service-to-service calls"
    answer: 1
    explanation: |
      With deadline propagation the entry service sets an absolute deadline (now + N ms) and
      passes the remaining budget to each downstream hop. This prevents wasted work where the
      caller already gave up but downstream services keep processing a doomed request.
    ref: "concepts.md#timeout"

  - id: dp-distributed-cloud-007
    difficulty: intermediate
    tags: [bulkhead, isolation, thread-pool]
    question: |
      An API calls payments, search, and recommendations from one shared thread pool. When
      recommendations hangs, all threads are consumed and payments also fails. Which pattern
      isolates each dependency into its own pool to contain the damage?
    options:
      - "Retry"
      - "Sharding"
      - "Bulkhead"
      - "Gateway Aggregation"
    answer: 2
    explanation: |
      The Bulkhead partitions resources (separate thread/connection pools per dependency) so a
      saturated dependency only exhausts its own compartment. It limits blast radius; a breaker
      would instead stop the call once it detects failure.
    ref: "concepts.md#bulkhead"

  - id: dp-distributed-cloud-008
    difficulty: advanced
    tags: [bulkhead, compute-consolidation, tension]
    question: |
      Which pair of patterns represents a direct design tension between isolation and efficiency?
    options:
      - "CQRS vs Event Sourcing, since one segregates read and write models and the other logs every change"
      - "Sidecar vs Ambassador, since both co-locate a companion proxy process next to the application container"
      - "Retry vs Timeout, since one re-attempts a failed call and the other bounds how long a single call waits"
      - "Bulkhead vs Compute Resource Consolidation"
    answer: 3
    explanation: |
      Bulkhead separates work into isolated pools for safety (blast-radius containment), while
      Compute Resource Consolidation packs work together onto shared compute for cost/utilization.
      They pull in opposite directions; the choice depends on optimizing for safety vs cost.
    ref: "concepts.md#compute-resource-consolidation"

  - id: dp-distributed-cloud-009
    difficulty: intermediate
    tags: [rate-limiting, throttling, load-leveling, comparison]
    question: |
      How does Rate Limiting/Throttling differ from Queue-Based Load Leveling when handling
      excess load?
    options:
      - "Rate limiting rejects or delays excess at ingress; load leveling buffers the excess in a queue to be processed later"
      - "Rate limiting always buffers excess in a queue, while load leveling always rejects it with a 429 at ingress"
      - "Load leveling applies only to read traffic, while rate limiting applies only to writes that mutate state"
      - "They are identical patterns with two different names and can be used interchangeably in any design"
    answer: 0
    explanation: |
      Throttling/rate limiting caps consumption and rejects (429) or delays excess at the door.
      Queue-Based Load Leveling instead absorbs the burst in a queue so it can be processed at a
      steady rate later. One sheds load, the other smooths it.
    ref: "concepts.md#rate-limiting-and-throttling"

  - id: dp-distributed-cloud-010
    difficulty: advanced
    tags: [rate-limiting, distributed-state]
    question: |
      What is the main added complexity when implementing rate limiting across a fleet of
      service instances rather than on a single node?
    options:
      - "It becomes impossible to reject any request because no single node can see the whole fleet's traffic"
      - "Enforcing one global limit requires shared state (e.g., a Redis counter), adding latency and a dependency; per-node limits are inaccurate"
      - "You must switch every backing datastore to fully synchronous replication of all data across nodes"
      - "Rate limiting stops working entirely once the service scales beyond a single node behind the balancer"
    answer: 1
    explanation: |
      Distributed rate limiting needs shared state so all nodes count against one limit; a
      central store (Redis) adds latency and a dependency, while independent per-node counters
      let the effective global limit drift to N times the intended value.
    ref: "concepts.md#rate-limiting-and-throttling"

  - id: dp-distributed-cloud-011
    difficulty: intermediate
    tags: [fallback, graceful-degradation, cache-aside, comparison]
    question: |
      A product page returns cached "popular products" when the personalized recommendations
      service is down, instead of showing an error. Which pattern is this, and how does it
      differ from Cache-Aside?
    options:
      - "Gatekeeper; it validates and sanitizes the request at a hardened broker before any data is touched"
      - "Cache-Aside; serving the cached list on failure is exactly the normal read path with no difference"
      - "Fallback / graceful degradation; it is a failure-path substitute, whereas Cache-Aside is the normal read path"
      - "Materialized View; it precomputes the personalized recommendations into a denormalized projection ahead of time"
    answer: 2
    explanation: |
      Serving a safe alternative on the failure path is the Fallback pattern (graceful
      degradation). Cache-Aside populates the cache during normal reads; the fallback is only
      taken when the primary fails. A firing fallback should be alerted on since it can mask outages.
    ref: "concepts.md#fallback-and-graceful-degradation"

  - id: dp-distributed-cloud-012
    difficulty: intermediate
    tags: [compensating-transaction, saga, consistency]
    question: |
      In an eventually-consistent multi-step operation across services, step 4 fails after steps
      1-3 already committed. Since there is no distributed rollback, what mechanism undoes the
      prior work?
    options:
      - "Restarting all participating services so they reload their last-known-good state from disk and discard the work"
      - "A database savepoint that rolls the earlier committed steps back to a marker set at the start of the operation"
      - "A two-phase commit rollback coordinated by a global transaction manager spanning all the services involved"
      - "Compensating transactions that semantically reverse each completed step"
    answer: 3
    explanation: |
      With no distributed ACID rollback, each completed step needs a compensating transaction
      (refund a charge, release a reservation) run in reverse to restore a business-consistent
      state. This is the rollback mechanism a Saga invokes on failure.
    ref: "concepts.md#compensating-transaction"

  - id: dp-distributed-cloud-013
    difficulty: intermediate
    tags: [health-endpoint, liveness, readiness]
    question: |
      What is the difference between a liveness check and a readiness check in Health Endpoint
      Monitoring?
    options:
      - "Liveness = is the process alive (restart if not); readiness = can it serve traffic now (stop routing but keep running if not)"
      - "Liveness quietly pulls the instance out of the load balancer rotation, while readiness restarts the process"
      - "Readiness runs only once at deploy time to gate the release, and liveness never runs after the pod has started"
      - "They are the same check reported under two different names, so configuring either one alone is sufficient"
    answer: 0
    explanation: |
      A failing liveness probe means the process is broken and should be restarted; a failing
      readiness probe means the instance can't serve right now (e.g., warming up) so it should
      be removed from rotation but not restarted. Confusing them causes restart loops.
    ref: "concepts.md#health-endpoint-monitoring"

  - id: dp-distributed-cloud-014
    difficulty: advanced
    tags: [health-endpoint, deep-check, cascade]
    question: |
      Why can a "deep" health check that probes every downstream dependency be dangerous?
    options:
      - "It is always faster than a shallow check because it caches every downstream dependency's status locally"
      - "A shared dependency failing can mark the entire fleet unhealthy at once, and the checks themselves add load — causing a cascade"
      - "Deep checks cannot return standard HTTP status codes and must signal health only through raw TCP resets"
      - "It permanently prevents the load balancer from ever removing an unhealthy instance from the rotation"
    answer: 1
    explanation: |
      Deep checks that probe a shared dependency (e.g., a common DB) will fail across the whole
      fleet simultaneously when that dependency blips, taking everything out of rotation, and
      the probing load can itself cause problems. Readiness should not hinge on non-critical downstreams.
    ref: "concepts.md#health-endpoint-monitoring"

  - id: dp-distributed-cloud-015
    difficulty: advanced
    tags: [scheduler-agent-supervisor, saga, recovery]
    question: |
      How does the Scheduler Agent Supervisor pattern differ in emphasis from a basic Saga
      orchestrator?
    options:
      - "It forbids compensating actions entirely and instead relies on manual operator intervention to undo failed steps"
      - "It removes the need for any state store by keeping the entire workflow progress in the coordinator's memory"
      - "It emphasizes a dedicated supervisor that detects and remediates (retries/compensates) failed remote steps, not just forward flow"
      - "It only works for single-service transactions confined to one database and cannot span remote service calls"
    answer: 2
    explanation: |
      The Scheduler arranges steps and records state, Agents execute remote actions, and the
      Supervisor monitors for stuck/failed steps and drives remediation. The emphasis is failure
      detection and recovery of remote work, overlapping heavily with Saga orchestration.
    ref: "concepts.md#scheduler-agent-supervisor"

  - id: dp-distributed-cloud-016
    difficulty: intermediate
    tags: [queue-based-load-leveling, spiky-load, competing-consumers, comparison]
    question: |
      Image uploads arrive in bursts of thousands but a resizer can only sustain 200/s. Putting
      a queue between them so the resizer works at its own rate is which pattern, and how does it
      relate to Competing Consumers?
    options:
      - "Competing Consumers alone; the queue between the burst and the resizer plays no load-smoothing role here"
      - "Priority Queue; it reorders the images by file size so the largest uploads are always resized first"
      - "Claim-Check; it stores each image externally and passes only a reference through the queue to the resizer"
      - "Queue-Based Load Leveling; adding more workers to the same queue (Competing Consumers) then scales throughput — they are usually combined"
    answer: 3
    explanation: |
      A queue between bursty producers and a fixed-rate service is Queue-Based Load Leveling; it
      smooths load over time. Competing Consumers (multiple workers on the same queue) scales the
      processing throughput. They complement each other.
    ref: "concepts.md#queue-based-load-leveling"

  - id: dp-distributed-cloud-017
    difficulty: intermediate
    tags: [sidecar, cross-cutting, service-mesh]
    question: |
      A service mesh runs an Envoy proxy container next to each app container in the same pod to
      provide mTLS, retries, and telemetry without changing app code. Which pattern is this?
    options:
      - "Sidecar"
      - "Adapter"
      - "Bulkhead"
      - "Gateway Offloading"
    answer: 0
    explanation: |
      Deploying supporting functionality as a co-located companion process/container sharing the
      app's lifecycle is the Sidecar pattern. It provides platform capabilities language-
      agnostically without touching the app.
    ref: "concepts.md#sidecar"

  - id: dp-distributed-cloud-018
    difficulty: advanced
    tags: [sidecar, ambassador, proxy, decorator, gof, comparison]
    question: |
      How do the Sidecar/Ambassador patterns differ from the GoF Proxy and Decorator patterns?
    options:
      - "They are the same four patterns, just rebranded with cloud-native marketing terminology by vendors"
      - "Sidecar/Ambassador compose behavior out-of-process across a network boundary; Proxy/Decorator wrap behavior in-process within one program"
      - "The GoF Proxy and Decorator patterns require a Kubernetes pod and a container runtime to be usable"
      - "Sidecar and Ambassador can only ever be applied in front of relational databases, never other services"
    answer: 1
    explanation: |
      GoF Proxy/Decorator wrap or stand in for an object in-process. Sidecar and Ambassador
      achieve similar composition but as separate co-located processes reached over the network,
      making them language-agnostic and independently deployable.
    ref: "concepts.md#sidecar"

  - id: dp-distributed-cloud-019
    difficulty: intermediate
    tags: [ambassador, sidecar, outbound-proxy, comparison]
    question: |
      What specifically distinguishes the Ambassador pattern from the general Sidecar pattern?
    options:
      - "Ambassador is a server-side reverse proxy that only intercepts inbound requests before they reach the app"
      - "Ambassador runs on a dedicated remote host in another availability zone, reached over the WAN rather than localhost"
      - "Ambassador is a client-side proxy sidecar specialized for outbound network concerns (retry, TLS, routing)"
      - "Ambassador is a centralized server-side edge gateway shared by all services for inbound routing"
    answer: 2
    explanation: |
      An Ambassador is a Sidecar specialized for the outbound path — a client-side proxy the app
      talks to over localhost that handles retries, TLS, and routing for outgoing calls. Sidecar
      is the general pattern; Ambassador is a subset. A gateway, by contrast, is a shared server-side edge.
    ref: "concepts.md#ambassador"

  - id: dp-distributed-cloud-020
    difficulty: advanced
    tags: [anti-corruption-layer, adapter, gof, ddd, comparison]
    question: |
      A new ordering service reads customers from a legacy mainframe and translates cryptic
      status codes into a clean domain model at the boundary. This is an Anti-Corruption Layer.
      How does it differ from a GoF Adapter?
    options:
      - "There is no difference; the two names describe the exact same class-level translation construct"
      - "The Adapter is only for legacy systems; the ACL only for new systems"
      - "The ACL matches a single method signature; the Adapter protects an entire domain model"
      - "The ACL protects a bounded context's model/semantics (often a whole subsystem); a GoF Adapter matches interfaces at the class level"
    answer: 3
    explanation: |
      An ACL is a DDD strategic boundary that keeps a foreign model from corrupting your domain —
      it can be a substantial translation subsystem. A GoF Adapter is a narrower, class-level
      interface conversion. Both translate, but at very different scopes.
    ref: "concepts.md#anti-corruption-layer-acl"

  - id: dp-distributed-cloud-021
    difficulty: intermediate
    tags: [adapter, anti-corruption-layer, comparison]
    question: |
      A monitoring platform expects Prometheus format but a legacy service emits StatsD, so a
      component converts one to the other. Which pattern is this, and how does it differ from an
      Anti-Corruption Layer?
    options:
      - "Adapter; it does interface/format conversion, whereas an ACL protects a domain model's semantics"
      - "Anti-Corruption Layer; converting a metrics format is exactly the domain-model protection an ACL provides"
      - "Messaging Bridge; it consumes from one message broker and republishes to another incompatible one"
      - "Sidecar; it runs as a co-located companion container in the same pod as the emitting service"
    answer: 0
    explanation: |
      Converting one service's interface/protocol/format into what a consumer expects is the
      Adapter pattern. An ACL is about protecting your domain model's semantics at a bounded-
      context boundary — a deeper concern than interface conversion.
    ref: "concepts.md#adapter"

  - id: dp-distributed-cloud-022
    difficulty: intermediate
    tags: [messaging-bridge, adapter, integration, comparison]
    question: |
      Messages must flow between an on-prem IBM MQ broker and a cloud pub/sub system that speak
      different protocols. Which pattern consumes from one, translates, and republishes to the other?
    options:
      - "Gateway Routing"
      - "Messaging Bridge"
      - "Claim-Check"
      - "Adapter"
    answer: 1
    explanation: |
      A Messaging Bridge connects two otherwise-incompatible messaging systems by consuming,
      translating, and republishing between them. It differs from an Adapter (which matches an
      interface for a consumer) by connecting two messaging infrastructures to each other.
    ref: "concepts.md#messaging-bridge"

  - id: dp-distributed-cloud-023
    difficulty: advanced
    tags: [deployment-stamps, sharding, geodes, comparison]
    question: |
      A SaaS deploys multiple independent copies of the entire app + data tier, each serving a
      subset of tenants, scaling by adding copies. This is Deployment Stamps. How does it differ
      from Sharding?
    options:
      - "Sharding replicates the entire application and data tier as a unit; stamps merely split one large table by key range"
      - "Stamps apply only to caching layers and cannot include a compute or persistence tier in the copied unit"
      - "A stamp replicates the whole app + data as a unit; sharding partitions a single data store by key"
      - "They are identical; both terms describe copying the full stack per tenant with no difference in granularity"
    answer: 2
    explanation: |
      Deployment Stamps (cells/scale-units) replicate the full stack as an isolated unit and
      scale by unit while containing blast radius. Sharding partitions one data store across
      nodes by a shard key. Different granularity: whole-stack unit vs single-store partition.
    ref: "concepts.md#deployment-stamps"

  - id: dp-distributed-cloud-024
    difficulty: advanced
    tags: [geodes, deployment-stamps, geo-distribution, comparison]
    question: |
      What most distinguishes the Geodes pattern from Deployment Stamps?
    options:
      - "Geodes are strictly read-only replicas and must forward every write to a single primary region"
      - "Stamps mandate multi-master replication across regions, whereas geodes run in one region with no replication"
      - "Geodes are confined to a single region, while stamps are inherently spread globally across many regions"
      - "Geodes are geo-distributed active-active nodes where any node serves any request (read/write everywhere); stamps are isolated units where a tenant is pinned to one"
    answer: 3
    explanation: |
      Geodes ("geographical nodes") are deployed active-active across regions so any node can
      serve any request, backed by a globally replicated store (with hard conflict resolution).
      Deployment Stamps are isolated scale units; a given tenant lives in exactly one stamp.
    ref: "concepts.md#geodes"

  - id: dp-distributed-cloud-025
    difficulty: intermediate
    tags: [static-content-hosting, cdn, gateway-offloading, comparison]
    question: |
      Serving images and JS directly from object storage fronted by a CDN, so the app tier never
      handles them, is which pattern?
    options:
      - "Static Content Hosting"
      - "Cache-Aside"
      - "Valet Key"
      - "Gateway Offloading"
    answer: 0
    explanation: |
      Static Content Hosting serves static assets from storage/CDN edges rather than the app
      tier, offloading compute and reducing latency. Gateway Offloading moves cross-cutting
      concerns (TLS, auth) to the gateway — a different offload location and purpose.
    ref: "concepts.md#static-content-hosting"

  - id: dp-distributed-cloud-026
    difficulty: intermediate
    tags: [strangler-fig, migration, facade]
    question: |
      A team modernizes a monolith by placing a router in front and migrating functionality slice
      by slice to new services until the monolith is empty. Which pattern is this?
    options:
      - "Deployment Stamps"
      - "Strangler Fig"
      - "Anti-Corruption Layer"
      - "Bulkhead"
    answer: 1
    explanation: |
      Strangler Fig incrementally replaces a legacy system behind a façade/router, routing each
      migrated slice to the new implementation until nothing routes to the legacy and it is
      retired. An ACL is often used alongside it but is the model-protection layer, not the migration strategy.
    ref: "concepts.md#strangler-fig"

  - id: dp-distributed-cloud-027
    difficulty: advanced
    tags: [strangler-fig, risk, forever-strangle]
    question: |
      What is a common risk of the Strangler Fig migration approach?
    options:
      - "It only works for greenfield systems and cannot be applied to an existing monolith already in production"
      - "It mandates a single big-bang cutover of all functionality at once, with no way to roll a slice back"
      - "The façade/routing must run for the entire (often long) migration, and the hardest slices may never migrate — a stalled 'forever strangle'"
      - "It cannot deliver any value to users until the migration reaches 100% completion of every last slice"
    answer: 2
    explanation: |
      Strangler Fig delivers value incrementally and allows per-slice rollback, but the
      façade/routing layer must operate throughout the migration and there is a real risk the
      last, hardest pieces never move, leaving both systems running indefinitely.
    ref: "concepts.md#strangler-fig"

  - id: dp-distributed-cloud-028
    difficulty: intermediate
    tags: [gateway-aggregation, round-trips, mobile]
    question: |
      A mobile home screen needs profile, orders, and recommendations. Instead of three round-
      trips, one gateway endpoint calls all three backends and returns a single composed response.
      Which pattern is this?
    options:
      - "Scatter-Gather"
      - "BFF"
      - "Gateway Routing"
      - "Gateway Aggregation"
    answer: 3
    explanation: |
      Gateway Aggregation collapses multiple client round-trips into one by fanning out to
      several backends and composing their responses. Routing only dispatches one request to one
      backend; scatter-gather sends the same request to many peers.
    ref: "concepts.md#gateway-aggregation"

  - id: dp-distributed-cloud-029
    difficulty: advanced
    tags: [gateway-aggregation, latency-coupling]
    question: |
      What is the main downside of Gateway Aggregation regarding latency?
    options:
      - "The gateway becomes a latency-coupling point — the slowest backend gates the entire composed response"
      - "It is architecturally unable to fan out to backends in parallel and must call each one strictly in sequence"
      - "It permanently removes the ability to cache any of the composed responses at the edge or in the client"
      - "It always increases the number of client round-trips compared to the client calling each backend itself"
    answer: 0
    explanation: |
      Because the gateway waits for all backends to compose the response, the slowest one gates
      the whole reply, and the gateway grows complex and coupled to backends. Calling in parallel
      helps but the tail is still bound by the slowest responder.
    ref: "concepts.md#gateway-aggregation"

  - id: dp-distributed-cloud-030
    difficulty: intermediate
    tags: [gateway-offloading, cross-cutting, sidecar, comparison]
    question: |
      Terminating TLS, validating JWTs, and gzipping responses once at the gateway for all
      services is Gateway Offloading. How does it differ from doing this via a Sidecar/Ambassador?
    options:
      - "Sidecars are limited to offloading database queries and cannot terminate TLS or validate tokens"
      - "Offloading centralizes concerns at one shared edge (a potential SPOF); sidecar/ambassador put them per-instance alongside each app"
      - "They are identical; the gateway and the sidecar terminate TLS in exactly the same network location"
      - "Gateway Offloading compiles the cross-cutting logic directly into each application process at build time"
    answer: 1
    explanation: |
      Gateway Offloading centralizes cross-cutting concerns at the shared edge — consistent but a
      SPOF/coupling point. Sidecar/Ambassador implement the same concerns per-instance next to
      each app, avoiding a shared SPOF at the cost of more copies.
    ref: "concepts.md#gateway-offloading"

  - id: dp-distributed-cloud-031
    difficulty: intermediate
    tags: [gateway-routing, layer-7, load-balancer, comparison]
    question: |
      Routing "/orders/*" to one backend and "/users/*" to another through a single endpoint,
      changeable via config without touching clients, is Gateway Routing. How does it differ from
      an L4 load balancer?
    options:
      - "Gateway Routing is fundamentally incapable of supporting canary or blue-green deployment strategies"
      - "Gateway Routing operates at layer 4 by IP and port, while an L4 load balancer inspects HTTP paths at layer 7"
      - "Gateway Routing is application-layer (path/host/header) routing; an L4 load balancer balances by IP/port without understanding HTTP"
      - "They are identical; both dispatch requests using the same layer-7 path and header inspection logic"
    answer: 2
    explanation: |
      Gateway Routing dispatches at layer 7 based on path, host, or header, enabling versioning
      and canary/blue-green without client changes. An L4 load balancer distributes by IP/port
      and does not inspect HTTP semantics.
    ref: "concepts.md#gateway-routing"

  - id: dp-distributed-cloud-032
    difficulty: intermediate
    tags: [bff, api-gateway, comparison]
    question: |
      A mobile app gets compact payloads from a mobile-specific gateway while the web app gets
      richer payloads from a web-specific gateway, each owned by its frontend team. Which pattern
      is this, and how does it differ from a general API Gateway?
    options:
      - "Gateway Aggregation; its sole job is merging several backend responses into one composed reply"
      - "Gatekeeper; it is a hardened broker focused purely on validating and sanitizing inbound requests"
      - "API Gateway; a BFF is simply a renamed general-purpose gateway with no behavioral difference at all"
      - "Backends for Frontends; it is one gateway per client type, versus a single general-purpose gateway serving all clients"
    answer: 3
    explanation: |
      Backends for Frontends (BFF) provides a dedicated gateway per client type, each tailored to
      that client's needs and owned by its team. A general API Gateway is a single entry point for
      all clients, which forces compromises when clients differ materially.
    ref: "concepts.md#backends-for-frontends-bff"

  - id: dp-distributed-cloud-033
    difficulty: advanced
    tags: [gatekeeper, security, valet-key, comparison]
    question: |
      A hardened broker in a DMZ validates and sanitizes all requests, holds no storage
      credentials itself, and forwards clean requests to a trusted host that accesses the data.
      Which pattern is this, and how does it differ from an API Gateway?
    options:
      - "Gatekeeper; it focuses on security isolation and privilege separation, whereas an API Gateway focuses on routing/aggregation"
      - "BFF; it is a client-specific backend tailored to one frontend type such as mobile or web"
      - "Ambassador; it is a client-side sidecar proxy the app talks to over localhost for outbound calls"
      - "Valet Key; it hands the client a scoped, time-limited token for direct access to one resource"
    answer: 0
    explanation: |
      The Gatekeeper is a hardened broker that validates/sanitizes requests and holds no secrets,
      forwarding to a trusted host — minimizing attack surface. An API Gateway is about
      routing/aggregation. A compromised gatekeeper doesn't hand over the storage credentials.
    ref: "concepts.md#gatekeeper"

  - id: dp-distributed-cloud-034
    difficulty: intermediate
    tags: [valet-key, presigned-url, gatekeeper, comparison]
    question: |
      To upload a large video, a client receives a time-limited, PUT-only pre-signed URL scoped
      to one object and uploads directly to storage, keeping the app out of the data path. Which
      pattern is this?
    options:
      - "Gatekeeper"
      - "Valet Key"
      - "Federated Identity"
      - "Claim-Check"
    answer: 1
    explanation: |
      The Valet Key pattern issues a scoped, time-limited token (e.g., a pre-signed URL) that
      grants direct client access to a specific resource, removing the app from the data path.
      Unlike a Gatekeeper (which mediates every request), the valet key gives direct scoped access.
    ref: "concepts.md#valet-key"

  - id: dp-distributed-cloud-035
    difficulty: advanced
    tags: [valet-key, security, revocation]
    question: |
      What is a notable security trade-off of the Valet Key pattern?
    options:
      - "It only works for read-only downloads and can never grant a client permission to upload objects"
      - "It forces the application to proxy every byte of the transfer, keeping it on the high-bandwidth data path"
      - "Tokens can leak or be over-scoped and are hard to revoke before they expire"
      - "It offers no way to restrict which operations the holder may perform on the target resource"
    answer: 2
    explanation: |
      Because a valet key grants direct access until expiry, a leaked or over-broad token is
      dangerous and typically cannot be revoked early — so short TTLs and tight scoping are
      essential. The upside is removing the app from the high-bandwidth data path.
    ref: "concepts.md#valet-key"

  - id: dp-distributed-cloud-036
    difficulty: intermediate
    tags: [federated-identity, sso, oidc]
    question: |
      An app lets users "Sign in with Google" by redirecting to an external IdP that
      authenticates them and returns a signed token, so the app never sees the password. Which
      pattern is this?
    options:
      - "Valet Key"
      - "External Configuration Store"
      - "Gatekeeper"
      - "Federated Identity"
    answer: 3
    explanation: |
      Federated Identity delegates authentication to a trusted external IdP via OIDC/SAML; the
      app trusts the tokens the IdP issues. Its chief risk is that an IdP outage becomes an auth
      outage for everyone relying on it.
    ref: "concepts.md#federated-identity"

  - id: dp-distributed-cloud-037
    difficulty: intermediate
    tags: [external-configuration-store, config, spof]
    question: |
      Feature flags and connection strings live in a central store that instances read at
      runtime, so changes take effect without a redeploy. Which pattern is this, and what is its
      main risk?
    options:
      - "External Configuration Store; the store becomes a runtime dependency/SPOF and needs secret handling"
      - "Service Registry; it tracks live service endpoints so callers can discover instances, not application configuration values"
      - "Sidecar; it runs a companion proxy per pod for cross-cutting concerns like mTLS and telemetry, not centralized configuration"
      - "Materialized View; it precomputes a denormalized read projection of query results rather than externalizing runtime config"
    answer: 0
    explanation: |
      The External Configuration Store externalizes config from the deployment artifact into a
      central store read at runtime. It enables change-without-redeploy but becomes a runtime
      dependency/SPOF (mitigate with local caching) and requires careful secret handling.
    ref: "concepts.md#external-configuration-store"

  - id: dp-distributed-cloud-038
    difficulty: intermediate
    tags: [saga, 2pc, consistency, comparison]
    question: |
      How does a Saga achieve cross-service data consistency differently from a two-phase commit
      (2PC) distributed transaction?
    options:
      - "A Saga holds a single global lock across every participating service from the first step until the final commit, blocking all others"
      - "A Saga uses a sequence of local transactions with compensations and is eventually consistent (no distributed lock); 2PC is atomic but blocking and scales poorly"
      - "They are the same underlying mechanism with two different names, so either term can be used interchangeably in any design"
      - "A Saga requires all participating services to share one physical database instance so a single transaction can span them atomically"
    answer: 1
    explanation: |
      A Saga strings together local transactions and compensates on failure, giving eventual
      consistency without a distributed lock — but no isolation (intermediate states are visible).
      2PC provides atomicity but blocks participants and doesn't scale, which is why Sagas are
      preferred in microservices.
    ref: "concepts.md#saga"

  - id: dp-distributed-cloud-039
    difficulty: advanced
    tags: [saga, isolation, dirty-reads]
    question: |
      What consistency property does a Saga notably lack, requiring extra countermeasures?
    options:
      - "The ability to compensate a failed step by running a reverse business action to undo prior work"
      - "Durability — once a saga step commits, its local transaction result is not guaranteed to survive a crash"
      - "Isolation — intermediate states are visible (dirty reads), so you need semantic locks or commutative updates"
      - "Atomicity of each individual local transaction, since a single step's own commit can be left half-applied on failure"
    answer: 2
    explanation: |
      A Saga's local transactions commit independently, so partial results are visible before the
      whole saga finishes — it lacks isolation (the "I" in ACID). You design around it with
      semantic locks, commutative updates, or by re-reading state, and use compensations to undo on failure.
    ref: "concepts.md#saga"

  - id: dp-distributed-cloud-040
    difficulty: intermediate
    tags: [cqrs, read-model, write-model, materialized-view, comparison]
    question: |
      An app writes orders through a rich domain model into normalized SQL, while a projector
      builds a denormalized "order history" view in Elasticsearch that the read API queries.
      Which pattern separates these read and write models?
    options:
      - "Sharding"
      - "API Composition"
      - "Event Sourcing"
      - "CQRS"
    answer: 3
    explanation: |
      CQRS (Command Query Responsibility Segregation) separates the write model from the read
      model, often into distinct stores, letting each scale and be optimized independently — at
      the cost of eventual consistency between them. A materialized view is a mechanism it often uses.
    ref: "concepts.md#cqrs-command-query-responsibility-segregation"

  - id: dp-distributed-cloud-041
    difficulty: advanced
    tags: [event-sourcing, cdc, comparison]
    question: |
      How does Event Sourcing differ from deriving events via Change Data Capture (CDC) from a
      database's transaction log?
    options:
      - "In Event Sourcing, events ARE the source of truth (state is rebuilt by replay); CDC derives events after the fact from a DB that stores current state"
      - "CDC persists the event log as the authoritative source of truth, while Event Sourcing merely tails a database's write-ahead log to derive changes"
      - "Event Sourcing cannot rebuild current state from its stored events and must always keep a separate mutable table of the latest values"
      - "They are identical techniques that both tail a transaction log, so the two terms describe exactly the same implementation"
    answer: 0
    explanation: |
      Event Sourcing persists an append-only log of events as the authoritative state and rebuilds
      current state by replay. CDC instead tails the transaction log of a store that holds current
      state to derive change events. Source-of-truth-is-events vs derive-events-from-a-DB.
    ref: "concepts.md#event-sourcing"

  - id: dp-distributed-cloud-042
    difficulty: advanced
    tags: [event-sourcing, versioning, snapshots]
    question: |
      Which is a genuine trade-off of Event Sourcing?
    options:
      - "It discards all history of changes once current state is computed, leaving no way to reconstruct earlier states"
      - "Replay cost grows over time (needing snapshots) and event schema/versioning is hard because old events are immutable forever"
      - "It cannot support audit trails because the append-only log deliberately overwrites prior events as state advances"
      - "It requires a single shared database across all services so every event stream can be replayed from one central log"
    answer: 1
    explanation: |
      Event Sourcing gives a complete audit trail and temporal queries, but replaying long streams
      is costly (mitigated by snapshots), and evolving event schemas is hard since historical
      events are immutable and must remain replayable. Read models are also eventually consistent.
    ref: "concepts.md#event-sourcing"

  - id: dp-distributed-cloud-043
    difficulty: advanced
    tags: [transactional-outbox, dual-write, idempotent-consumer]
    question: |
      A service must update its DB and publish an event, but doing them separately risks the DB
      committing while the publish fails. Which pattern writes the change and the message in one
      local transaction and has a relay publish later?
    options:
      - "Claim-Check"
      - "Two-phase commit"
      - "Transactional Outbox"
      - "Publish-Subscribe"
    answer: 2
    explanation: |
      The Transactional Outbox writes the domain change and an outbox row in one local
      transaction (atomic), then a relay (polling publisher or CDC log-tailing) publishes the
      message. Delivery is at-least-once, so consumers must be idempotent. It avoids a distributed transaction.
    ref: "concepts.md#transactional-outbox"

  - id: dp-distributed-cloud-044
    difficulty: advanced
    tags: [transactional-outbox, polling-publisher, cdc, mechanisms]
    question: |
      Which two mechanisms are commonly used to implement the relay in the Transactional Outbox
      pattern?
    options:
      - "Circuit Breaker (trip on failures) and Bulkhead (isolate the relay's thread pool from the rest of the service)"
      - "Leader Election (one relay owns publishing) and Consistent Hashing (spread outbox rows across relay nodes by key)"
      - "Two-Phase Commit (atomically commit DB and broker together) and Sagas (compensate the outbox row if the publish fails)"
      - "Polling Publisher (poll the outbox table) and Transaction Log Tailing / CDC (tail the DB log)"
    answer: 3
    explanation: |
      The outbox relay is realized either by a Polling Publisher that periodically reads unsent
      rows, or by Transaction Log Tailing (CDC) that streams changes from the database log. CDC
      avoids polling latency/load; both mark rows as sent after publishing.
    ref: "concepts.md#transactional-outbox"

  - id: dp-distributed-cloud-045
    difficulty: advanced
    tags: [idempotent-consumer, inbox, outbox, comparison]
    question: |
      Message delivery is at-least-once, so a consumer may receive the same message twice. Which
      pattern records processed message ids to deduplicate, and how does it relate to the
      Transactional Outbox?
    options:
      - "Idempotent Consumer (Inbox); it is the mirror image of the Outbox — reliable/dedup receive vs reliable send"
      - "Circuit Breaker; it trips open after repeated failures to stop calling a downed dependency, not to deduplicate received messages"
      - "Priority Queue; it drains higher-importance messages first for SLA tiering, which does nothing to suppress duplicate deliveries"
      - "Materialized View; it precomputes a denormalized read projection for fast queries, unrelated to deduplicating consumed messages"
    answer: 0
    explanation: |
      The Idempotent Consumer (Inbox) pattern records each processed message id (ideally in the
      same transaction as the effect) and skips duplicates. It is the receive-side mirror of the
      Transactional Outbox's reliable send; together they give exactly-once effect over at-least-once delivery.
    ref: "concepts.md#idempotent-consumer-inbox"

  - id: dp-distributed-cloud-046
    difficulty: advanced
    tags: [event-carried-state-transfer, claim-check, coupling, comparison]
    question: |
      Instead of thin "CustomerUpdated(id=42)" notifications that force consumers to call back,
      events carry the full customer fields so consumers keep local replicas. Which pattern is
      this, and how does it contrast with Claim-Check?
    options:
      - "Claim-Check; it embeds the full customer fields directly in the event exactly as Claim-Check is defined to do, so there is no contrast"
      - "Event-Carried State Transfer; it puts state IN the event, whereas Claim-Check removes a large payload and passes only a reference"
      - "Publish-Subscribe; it broadcasts thin pointer notifications to all subscribers, which is the opposite of carrying full state in the event"
      - "Cache-Aside; it lazily loads each customer record from the store into a cache on a read miss rather than shipping state in events"
    answer: 1
    explanation: |
      Event-Carried State Transfer sends "fat" events with enough state that consumers avoid
      callbacks and stay autonomous (at the cost of duplication/staleness). Claim-Check does the
      opposite — it keeps big payloads out of the message, passing a reference to fetch on demand.
    ref: "concepts.md#event-carried-state-transfer"

  - id: dp-distributed-cloud-047
    difficulty: intermediate
    tags: [cache-aside, caching, comparison]
    question: |
      In Cache-Aside, on a read miss the application loads from the store, populates the cache,
      and returns; on write it updates the store and invalidates the cache. How does this differ
      from read-through/write-through caching?
    options:
      - "Cache-Aside never invalidates on write and instead relies solely on a fixed TTL to eventually expire every stale entry"
      - "Cache-Aside is cache-managed (the library loads and writes the store) while read-through/write-through are orchestrated by your application code"
      - "Cache-Aside is app-managed (your code orchestrates it); read-through/write-through are cache-managed (the cache library loads/writes the store)"
      - "There is no difference between them; the terms are interchangeable labels for one identical caching strategy"
    answer: 2
    explanation: |
      In Cache-Aside the application code orchestrates cache reads/populates/invalidations. In
      read-through/write-through/write-behind, the caching layer itself loads from and writes to
      the backing store. Cache-Aside's risks include a staleness window and cache stampede on hot keys.
    ref: "concepts.md#cache-aside"

  - id: dp-distributed-cloud-048
    difficulty: intermediate
    tags: [materialized-view, cqrs, index-table, comparison]
    question: |
      A "sales by region per day" dashboard reads a precomputed, denormalized projection instead
      of running heavy joins at query time. Which pattern is this, and how does it relate to a
      CQRS read model?
    options:
      - "Sharding; it partitions the sales data by region key across nodes rather than precomputing a denormalized dashboard projection"
      - "API Composition; it calls each owning service and joins their results in memory at query time instead of reading a stored projection"
      - "Index Table; it stores only secondary lookup keys pointing back to records, not the full precomputed aggregate the dashboard reads"
      - "Materialized View; it is the mechanism, while a CQRS read model is the architecture that often uses one"
    answer: 3
    explanation: |
      A Materialized View precomputes and stores a query-optimized projection, trading storage and
      staleness for fast reads. It is the mechanism; CQRS is the broader architecture that
      frequently maintains materialized read models. An index table, by contrast, holds only lookup keys.
    ref: "concepts.md#materialized-view"

  - id: dp-distributed-cloud-049
    difficulty: advanced
    tags: [index-table, materialized-view, comparison]
    question: |
      Orders are stored by orderId but frequently queried by customerId in a store lacking
      secondary indexes, so you maintain a customerId -> [orderId] table. Which pattern is this,
      and how does it differ from a Materialized View?
    options:
      - "Index Table; it holds lookup keys pointing to records, whereas a Materialized View holds a full computed projection"
      - "Sharding; it partitions the orders across database nodes by customerId so each shard owns a disjoint slice of customers"
      - "Cache-Aside; it lazily caches whole order records keyed by customerId on a read miss rather than maintaining a persistent index"
      - "Materialized View; a customerId to orderId lookup table is a full precomputed projection, so there is no difference between them"
    answer: 0
    explanation: |
      An Index Table builds secondary indexes (lookup keys → primary keys) for stores without
      native secondary indexes. A Materialized View stores the full computed answer/projection.
      The index gives you a pointer to fetch by; the view gives you the answer directly.
    ref: "concepts.md#index-table"

  - id: dp-distributed-cloud-050
    difficulty: advanced
    tags: [sharding, consistent-hashing, comparison]
    question: |
      A team uses hash(userId) % N to spread users across database nodes. How does Consistent
      Hashing improve on this naive modulo sharding when the node count changes?
    options:
      - "Consistent hashing avoids sharding entirely by replicating the full dataset onto every node so no key ever needs to move"
      - "With modulo, changing N remaps almost every key; consistent hashing maps nodes and keys on a ring so only ~K/N keys move when a node is added/removed"
      - "Consistent hashing guarantees a perfectly even key distribution with zero extra effort, so virtual nodes and rebalancing are never needed"
      - "Modulo hashing moves the fewest keys when N changes, while consistent hashing reshuffles nearly every key across all the nodes"
    answer: 1
    explanation: |
      Naive modulo sharding reshuffles nearly all keys when N changes (mass cache misses / data
      movement). Consistent hashing places nodes and keys on a ring so adding/removing a node only
      moves the keys between it and its neighbor. Virtual nodes are needed to smooth distribution.
    ref: "concepts.md#sharding"

  - id: dp-distributed-cloud-051
    difficulty: advanced
    tags: [consistent-hashing, virtual-nodes]
    question: |
      Why are virtual nodes used in Consistent Hashing?
    options:
      - "To reduce the total number of physical nodes required by packing several logical shards onto one machine"
      - "To eliminate the need for data replication by giving every physical node a complete copy of the ring's keys"
      - "To smooth out uneven key distribution by placing each physical node at many points on the ring"
      - "To guarantee strong consistency of writes by forcing every replica to acknowledge before the write returns"
    answer: 2
    explanation: |
      Placing each physical node at many ring positions (virtual nodes) evens out the arcs of the
      ring each node owns, avoiding lopsided load. Consistent hashing still needs replication
      separately for high availability — placement is not durability.
    ref: "concepts.md#consistent-hashing"

  - id: dp-distributed-cloud-052
    difficulty: advanced
    tags: [api-composition, cqrs, database-per-service, comparison]
    question: |
      With database-per-service and no shared DB, a query needs data from Order, Customer, and
      Shipping services, so a composer calls each and joins results in memory. Which pattern is
      this, and how does it differ from CQRS?
    options:
      - "Sharding; it partitions the combined result across database nodes by a shard key rather than gathering data from three separate services"
      - "Saga; it coordinates a sequence of write transactions with compensations across services, which is a write-path concern, not a read query"
      - "CQRS; querying each service and joining in memory is identical to maintaining a precomputed read model, so there is no difference"
      - "API Composition; it joins at query time with no maintained replica, whereas CQRS maintains a precomputed read model"
    answer: 3
    explanation: |
      API Composition queries each owning service and joins the results in memory — simple and
      always live, but in-memory joins are inefficient at scale and availability is the product of
      all sources. CQRS instead maintains a precomputed read model, better for high-volume/large joins.
    ref: "concepts.md#api-composition"

  - id: dp-distributed-cloud-053
    difficulty: intermediate
    tags: [database-per-service, shared-database, microservices, comparison]
    question: |
      In the Database-per-Service pattern, why can't you simply do a cross-service SQL JOIN, and
      what is the core trade-off versus a Shared Database?
    options:
      - "Each service privately owns its store (no direct cross-service access), so you use Saga/CQRS/events instead; the trade-off is autonomy/isolation vs simplicity/easy joins"
      - "Shared databases are always the recommended microservices default because one schema keeps every service's data perfectly consistent"
      - "Database-per-service forbids using events entirely, so services must communicate only through synchronous request-response API calls"
      - "You can run a normal cross-service SQL JOIN with no restriction, since every service transparently sees the others' underlying tables"
    answer: 0
    explanation: |
      Database-per-Service gives each service a private store accessed only via its API/events,
      enabling independent deployment and fault isolation. The cost is no cross-service ACID joins
      — you use Saga, CQRS, and events. A Shared Database is simpler but couples services through the schema.
    ref: "concepts.md#database-per-service"

  - id: dp-distributed-cloud-054
    difficulty: intermediate
    tags: [competing-consumers, publish-subscribe, comparison]
    question: |
      Multiple worker instances read from the same queue, and the broker delivers each message to
      exactly one worker so throughput scales with worker count. Which pattern is this, and how
      does it differ from Publish-Subscribe?
    options:
      - "Publish-Subscribe; it delivers an independent copy of every message to all subscribers, which is broadcast fan-out rather than one-of-N work sharing"
      - "Competing Consumers; each message goes to one of N consumers (work-sharing), whereas Pub-Sub delivers a copy to all subscribers (broadcast)"
      - "Priority Queue; it drains higher-importance messages ahead of lower ones for SLA tiering, not distributing one message to exactly one of many workers"
      - "Sequential Convoy; it partitions messages by key to preserve in-order processing within a group rather than sharing load across competing workers"
    answer: 1
    explanation: |
      Competing Consumers share the workload — one message is handled by exactly one of several
      consumers, scaling throughput and tolerating crashes via redelivery (needs idempotency).
      Publish-Subscribe instead broadcasts each message to every subscriber.
    ref: "concepts.md#competing-consumers"

  - id: dp-distributed-cloud-055
    difficulty: intermediate
    tags: [publish-subscribe, decoupling, fan-out]
    question: |
      An OrderPlaced event is published to a topic and independently received by email,
      analytics, inventory, and search subscribers; adding a loyalty subscriber requires no
      publisher change. Which pattern enables this decoupled fan-out?
    options:
      - "Asynchronous Request-Reply"
      - "Competing Consumers"
      - "Publish-Subscribe"
      - "Scatter-Gather"
    answer: 2
    explanation: |
      Publish-Subscribe lets a publisher broadcast events to any number of independent subscribers
      without knowing who they are, so consumers can be added/removed freely. The trade-off is no
      default delivery/ordering guarantees and fan-out/lag management at scale.
    ref: "concepts.md#publish-subscribe"

  - id: dp-distributed-cloud-056
    difficulty: intermediate
    tags: [claim-check, large-payload, messaging]
    question: |
      A pipeline stores a 50 MB PDF in object storage and publishes only a message containing the
      id and storage URL; the consumer fetches the payload when needed. Which pattern is this?
    options:
      - "Cache-Aside"
      - "Valet Key"
      - "Event-Carried State Transfer"
      - "Claim-Check"
    answer: 3
    explanation: |
      Claim-Check stores a large payload externally and passes only a reference (the claim)
      through the message bus, keeping messages small. It is the inverse of Event-Carried State
      Transfer, which puts the state directly into the event.
    ref: "concepts.md#claim-check"

  - id: dp-distributed-cloud-057
    difficulty: intermediate
    tags: [priority-queue, starvation, sequential-convoy, comparison]
    question: |
      A support system uses high/normal/low queues drained in priority order so paid-tier tickets
      jump ahead. Which pattern is this, and what is its main risk?
    options:
      - "Priority Queue; low-priority work can be starved if high-priority never drains"
      - "Sequential Convoy; every message is processed in strict global arrival order across all consumers"
      - "Competing Consumers; the broker guarantees every message is delivered in strict order to workers"
      - "Claim-Check; large tickets are stored externally so the queue only carries a lightweight reference"
    answer: 0
    explanation: |
      The Priority Queue ensures higher-priority messages are processed first (supporting SLAs and
      tiering), but risks starving low-priority work unless you add aging or reserved capacity.
      It reorders by importance, unlike a convoy (ordering within a group) or plain FIFO.
    ref: "concepts.md#priority-queue"

  - id: dp-distributed-cloud-058
    difficulty: advanced
    tags: [pipes-and-filters, chain-of-responsibility, gof, comparison]
    question: |
      A "Validate -> Enrich -> Transform -> Persist" pipeline of independent stages connected by
      queues is Pipes and Filters. How does it differ from the GoF Chain of Responsibility?
    options:
      - "They are identical patterns with two names, so either term describes the exact same staged-processing construct"
      - "In Pipes and Filters every stage transforms the data as it flows through all stages; in Chain of Responsibility handlers pass a request along until one handler handles it and stops"
      - "Chain of Responsibility lets you scale each handler independently behind its own queue, whereas Pipes and Filters cannot be scaled per stage"
      - "Pipes and Filters is architecturally limited to exactly two stages, a single producer feeding one downstream consumer"
    answer: 1
    explanation: |
      Pipes and Filters streams data through a series of transforming stages, each doing one thing
      and composable/independently scalable. Chain of Responsibility passes a request down a chain
      of handlers until one handles it — a routing-to-a-single-handler intent, not a transform pipeline.
    ref: "concepts.md#pipes-and-filters"

  - id: dp-distributed-cloud-059
    difficulty: advanced
    tags: [scatter-gather, gateway-aggregation, comparison]
    question: |
      A travel site sends the same "quote" request to 10 airline APIs in parallel and returns the
      cheapest received before a timeout. Which pattern is this, and how does it differ from
      Gateway Aggregation?
    options:
      - "API Composition; it joins distinct backend results in memory and by definition never bounds the wait with a timeout"
      - "Gateway Aggregation; sending the same request to many identical peers is exactly what aggregation does, so there is no difference"
      - "Scatter-Gather; it broadcasts the SAME request to many peers and aggregates, whereas Gateway Aggregation composes DISTINCT calls to different backends"
      - "Publish-Subscribe; it broadcasts the quote request fire-and-forget to subscribers and never waits to collect any replies"
    answer: 2
    explanation: |
      Scatter-Gather fans out the same request to many recipients and aggregates responses
      (best/merged/first), bounded by the slowest responder or a timeout with partial results.
      Gateway Aggregation composes several different backend calls into one response instead.
    ref: "concepts.md#scatter-gather"

  - id: dp-distributed-cloud-060
    difficulty: intermediate
    tags: [choreography, orchestration, saga, comparison]
    question: |
      In a Saga, services react to each other's events with no central coordinator directing the
      flow. Which coordination style is this, and what is its main downside versus orchestration?
    options:
      - "Choreography; its main downside is that it funnels every step through one central coordinator bottleneck"
      - "Orchestration; because services react only to each other's events it maximizes decoupling and removes any controller"
      - "Orchestration; its defining trait here is a single visible controller directing every step of the flow"
      - "Choreography; the end-to-end flow is emergent and hard to trace, with no single place showing the whole process"
    answer: 3
    explanation: |
      Choreography is decentralized event-reaction with no orchestrator — maximally decoupled and
      with no central SPOF, but the overall process is emergent and hard to trace/debug.
      Orchestration uses a central coordinator that is easier to see/control but is a coupling point.
    ref: "concepts.md#choreography"

  - id: dp-distributed-cloud-061
    difficulty: intermediate
    tags: [async-request-reply, long-running, polling]
    question: |
      A "generate report" API returns 202 Accepted with a status URL, processes the work
      asynchronously, and lets the client poll until the result is ready. Which pattern is this?
    options:
      - "Asynchronous Request-Reply"
      - "Scatter-Gather"
      - "Queue-Based Load Leveling"
      - "Publish-Subscribe"
    answer: 0
    explanation: |
      Asynchronous Request-Reply handles long-running work by returning a status/handle
      immediately (e.g., 202 + status URL) and letting the client poll or receive a callback.
      Unlike Pub-Sub (fire-and-forget), it provides a correlated response for the requester.
    ref: "concepts.md#asynchronous-request-reply"

  - id: dp-distributed-cloud-062
    difficulty: advanced
    tags: [sequential-convoy, competing-consumers, ordering, comparison]
    question: |
      You must process all events for one order in order, but different orders can be processed in
      parallel — solved by keying events by orderId so each order maps to one partition. Which
      pattern is this, and how does it differ from plain Competing Consumers?
    options:
      - "Competing Consumers; the broker automatically preserves per-order arrival ordering even as it shares work across workers"
      - "Sequential Convoy; it guarantees in-order processing within a group while parallelizing across groups, whereas Competing Consumers process in parallel with no ordering"
      - "Priority Queue; it keys events by orderId to drain the most important orders ahead of the rest by tier"
      - "Publish-Subscribe; it broadcasts each order event to all subscribers, which inherently keeps every order's events ordered"
    answer: 1
    explanation: |
      Sequential Convoy partitions messages by key so each group is processed in order while
      different groups run concurrently. Plain Competing Consumers maximize throughput but give no
      ordering. The trade-off is that a hot key serializes and becomes a bottleneck.
    ref: "concepts.md#sequential-convoy"

  - id: dp-distributed-cloud-063
    difficulty: advanced
    tags: [leader-election, distributed-lock, split-brain, comparison]
    question: |
      Three scheduler replicas must ensure exactly one runs the cron jobs; they acquire a lease in
      etcd and the winner leads, with standbys taking over if its lease expires. Which pattern is
      this, and how does it differ from a Distributed Lock?
    options:
      - "Bulkhead; it isolates each scheduler into its own resource pool so one crash cannot exhaust the others"
      - "Distributed Lock; acquiring an etcd lease to lead the cron jobs is exactly a distributed lock, so there is no difference"
      - "Leader Election; it establishes ongoing leadership over time (renewed lease), whereas a distributed lock provides single mutual-exclusion for one operation"
      - "Consistent Hashing; it places the schedulers on a hash ring so cron jobs are partitioned evenly among them"
    answer: 2
    explanation: |
      Leader Election picks a single owner for exclusive, ongoing responsibility with clean
      failover, built on a consensus/lease mechanism; its risks are split-brain (needs fencing
      tokens) and failover latency. A distributed lock is a shorter-lived mutual-exclusion for one operation.
    ref: "concepts.md#leader-election"

  - id: dp-distributed-cloud-064
    difficulty: intermediate
    tags: [service-registry, discovery, client-side, server-side]
    question: |
      In a dynamic environment, instances register with Consul/Eureka and heartbeat, and callers
      query the registry to find healthy instances. Which pattern is this, and what is a key risk?
    options:
      - "Leader Election; the instances register in Consul to elect one coordinator that owns all incoming traffic"
      - "Gateway Routing; instances register their paths so a layer-7 gateway can dispatch each request by URL"
      - "External Configuration Store; the registry simply holds shared settings and feature flags the instances read at runtime"
      - "Service Registry & Discovery; the registry is a critical dependency (SPOF) that can serve stale data"
    answer: 3
    explanation: |
      Service Registry & Discovery tracks live instance locations (client-side or server-side
      discovery; self- or third-party registration) so callers find instances dynamically. The
      registry is a critical dependency and can be stale (dead instance still listed or live one missing).
    ref: "concepts.md#service-registry-and-discovery"

  - id: dp-distributed-cloud-065
    difficulty: advanced
    tags: [resilience-quartet, circuit-breaker, timeout, bulkhead, retry]
    question: |
      Which statement best captures how Retry, Timeout, Circuit Breaker, and Bulkhead relate?
    options:
      - "They compose: Retry handles transient blips, Timeout bounds a single call, Circuit Breaker stops calling a downed dependency, and Bulkhead isolates resource pools"
      - "They are four interchangeable names for one mechanism that each fail a call fast at a different network layer"
      - "Only the Circuit Breaker is still needed today; retries, timeouts, and bulkheads are legacy techniques it fully replaces"
      - "They are mutually exclusive and conflict at runtime, so a resilient service must pick exactly one of the four"
    answer: 0
    explanation: |
      The resilience quartet is complementary, not competing: timeouts bound individual calls,
      retries absorb transient failures, circuit breakers cut off a sustained-failing dependency,
      and bulkheads isolate resource pools to contain blast radius. Real systems use them together.
    ref: "concepts.md#bulkhead"

  - id: dp-distributed-cloud-066
    difficulty: beginner
    tags: [problem-solving, interview-technique]
    question: |
      When an interviewer names a design pattern, what is almost always their first probe?
    options:
      - "The exact UML class diagram from the GoF book, drawn from memory with every association labeled"
      - "What problem the pattern solves — the specific pain or smell it removes"
      - "Which programming language and framework implements the pattern most idiomatically and efficiently"
      - "The year the pattern was first published and which author of the catalog originally coined it"
    answer: 1
    explanation: |
      The strongest signal is leading with the problem the pattern solves in plain language before
      the mechanism. Every pattern in this catalog opens with a "Problem it solves" line for
      exactly this reason — interviewers probe motivation first, structure second.
    ref: "concepts.md#why-these-patterns-exist--the-fallacies-of-distributed-computing"

  - id: dp-distributed-cloud-067
    difficulty: intermediate
    tags: [api-gateway, bff, edge, routing]
    question: |
      A team exposes 30 fine-grained microservices. Clients currently call each service
      directly, must know every address, and each service re-implements TLS and auth. Which
      pattern introduces a single front door that routes, secures, and can aggregate for all
      clients — and how does it differ from a BFF?
    options:
      - "Ambassador; it is an outbound client-side proxy and functionally identical to a BFF front door"
      - "Sidecar; the single front door is really a per-instance sidecar, and a BFF is just that sidecar per client"
      - "API Gateway; a BFF instead gives each client type its own tailored gateway"
      - "Service Registry; the front door tracks live endpoints, and a BFF is one such registry per client type"
    answer: 2
    explanation: |
      An API Gateway is one general-purpose edge that routes, offloads cross-cutting concerns,
      and can aggregate for all clients. A BFF specializes that idea per client type (mobile,
      web), giving each its own tailored backend rather than one shared gateway.
    ref: "concepts.md#api-gateway"

  - id: dp-distributed-cloud-068
    difficulty: advanced
    tags: [outbox, polling-publisher, log-tailing, cdc]
    question: |
      You use the Transactional Outbox and must move committed outbox rows to Kafka with
      minimal latency and no periodic query load. Which relay mechanism fits, and what is its
      main cost compared to polling?
    options:
      - "Transaction Log Tailing (CDC); it is DB-specific and operationally more complex than polling"
      - "Polling Publisher; querying the outbox on a fixed interval eliminates all query load and gives the lowest possible latency"
      - "Two-phase commit across DB and broker; it commits the row and the Kafka publish atomically so no relay process is needed"
      - "Scatter-Gather; it fans each committed outbox row out to all consumers in parallel and returns the first acknowledgement"
    answer: 0
    explanation: |
      Log tailing (CDC, e.g. Debezium reading the WAL/binlog) publishes committed outbox rows
      with low latency and no polling load, but it is database-specific and operationally more
      complex/fragile than a simple Polling Publisher that periodically queries the outbox table.
    ref: "concepts.md#polling-publisher-and-transaction-log-tailing"

  - id: dp-distributed-cloud-069
    difficulty: advanced
    tags: [command-side-replica, api-composition, events, write-path]
    question: |
      An Order service must check a customer's credit on every write, but a synchronous call to
      the Customer service couples availability and adds latency to the write path. Which pattern
      keeps a local, event-updated copy for local validation, and how does it differ from API
      Composition?
    options:
      - "Materialized View; it precomputes a denormalized read projection and is functionally the same as API Composition"
      - "Command-side Replica; API Composition instead queries the owner remotely at request time"
      - "Cache-Aside; it lazily caches credit results on a miss, whereas API Composition writes through to the owning service"
      - "Event Sourcing; it stores credit checks as an append-only log that API Composition replays on the read side"
    answer: 1
    explanation: |
      A Command-side Replica keeps a read-only local copy of another service's data, maintained
      by subscribing to its events, so the write path validates locally without a synchronous
      call. API Composition instead queries the owning service remotely at request time; the
      replica trades eventual-consistency staleness for write-path autonomy.
    ref: "concepts.md#command-side-replica"

  - id: dp-distributed-cloud-070
    difficulty: intermediate
    tags: [process-manager, orchestration, choreography, saga]
    question: |
      A multi-step order workflow has branching and compensation logic that is currently
      scattered across services with no single place showing the whole flow. Which pattern
      centralizes the process state and decides the next step, and what is its main downside
      versus choreography?
    options:
      - "Choreography; it centralizes the whole workflow in one component, and its downside is that it couples everything too tightly"
      - "Publish-Subscribe; it centralizes the branching logic on a topic, and its downside is that it loses message ordering across steps"
      - "Pipes and Filters; it centralizes the flow into staged filters, and its downside is the per-stage serialization and queue overhead"
      - "Process Manager (orchestrator); its downside is it becomes a coupling point / potential god component"
    answer: 3
    explanation: |
      A Process Manager (orchestration variant of Saga) is a persistent state machine that tracks
      each process instance and decides the next command, making the flow explicit and observable.
      The trade-off versus choreography's decentralized event reactions is that the orchestrator
      is a coupling point that can grow into a complex god component and must persist its state.
    ref: "concepts.md#process-manager-orchestrator"
