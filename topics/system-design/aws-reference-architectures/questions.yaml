  - Roll back the captured payment by opening a distributed two-phase-commit transaction spanning the payment,
    inventory, and order services so all three abort atomically together
  answer: 0
  explanation: |
    Sagas maintain consistency by running compensating actions for already-completed steps -
    refund payment, release inventory - and reporting the failure. Infinite retries can wedge the
    flow (1); leaving money captured with no order is incorrect (2); there is no 2PC across these
    services, which is exactly why sagas exist (3).
