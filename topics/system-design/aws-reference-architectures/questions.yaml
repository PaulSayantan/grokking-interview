  - Redshift for everything because it is a warehouse, loading even the rare weekly ad-hoc scans of the raw lake into a provisioned cluster that runs continuously
  - EMR Spark for everything because it is the most flexible engine, running the interactive high-concurrency BI dashboard as Spark SQL jobs on a long-lived cluster
  answer: 1
  explanation: |
