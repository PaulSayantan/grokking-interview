  - tradeoff
  question: |
    What is the trade-off of using Kinesis Data Firehose to land streaming data in S3 versus a
    custom Lambda consumer writing to S3?
  options:
  - Firehose delivers records to S3 in real time with zero buffering latency, whereas a custom Lambda consumer always introduces several minutes of unavoidable delay before any object appears
  - A Lambda function has no IAM permission model capable of writing objects to S3, so Firehose is strictly mandatory whenever streaming records must be landed in a bucket for later querying
  - Firehose is zero-ops with buffering and format conversion (e.g., to Parquet) but adds up to roughly
