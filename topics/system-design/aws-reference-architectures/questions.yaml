  options:
  - SNS is incapable of delivering mobile push notifications at all, so Amazon Pinpoint is the only service that can reach APNs or FCM devices
  - Pinpoint is fundamentally a message queue that consumers pull from, while SNS is a managed database used to store notification history
  - SNS is simple, low-cost pub/sub with mobile push (APNs/FCM); Pinpoint adds user segments, campaigns,
    analytics, and multi-channel (push/SMS/email) at more setup cost
  - They are literally the same underlying service exposed under two brand names, differing only in the pricing tier you select at signup
  answer: 2
  explanation: |
    SNS handles simple pub/sub and mobile push cheaply; Pinpoint layers on segmentation, campaigns,
    analytics, and multi-channel messaging with more configuration. SNS does deliver mobile push
    (0); neither is a queue/database in that sense (1); they are distinct services (3).
  ref: 'concepts.md#real-time-chat-and-notifications'
- id: aws-reference-architectures-035
  difficulty: intermediate
  tags:
  - containers
