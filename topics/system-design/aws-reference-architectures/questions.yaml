  options:
  - Execute compensating transactions in reverse (e.g., refund the payment and release the reserved inventory)
    so the system returns to a consistent state, and surface the failure to the user
  - Retry the failing create-order step in a tight loop forever until it eventually succeeds, holding the
    already-captured payment and reserved inventory in place the entire time
  - Leave the payment captured and the inventory reserved, and have an operator create the missing order
