  options:
  - 8 shards
  - 1 shard
  - 2 shards
  - 80 shards
  answer: 0
  explanation: |
    Each shard ingests up to 1 MB/s, so 8 MB/s needs at least 8 shards (also check the 1000 rec/s
    limit per shard). One or two shards cannot carry 8 MB/s (1,2); 80 is 10x more than needed (3).
  ref: 'concepts.md#service-limits-and-quotas-that-shape-designs'
- id: aws-reference-architectures-039
  difficulty: intermediate
  tags:
  - claim-check
  - sqs
  - s3
  question: |
    A workflow must pass 5 MB payloads through SQS, but SQS messages are capped at 256 KB. What is
    the idiomatic pattern?
  options:
  - 'Claim-check: store the large payload in S3 and pass only a pointer (object key) through SQS; the
    consumer fetches it from S3'
  - Compress the 5 MB payload down under the 256 KB cap with gzip no matter what, since SQS transparently rejects anything larger and compression always achieves that ratio
  - Switch the transport from SQS to SNS instead, since SNS imposes no message-size limit and can carry a full 5 MB payload directly through to each subscriber
  - Split the 5 MB payload into 20 separate ordered SQS messages and have the consumer buffer and reassemble every part once all of them have arrived
  answer: 0
  explanation: |
    The claim-check pattern puts the big payload in S3 and passes a reference through the message,
    dodging the 256 KB cap. Compression may not always fit (1); SNS shares similar limits (2);
    splitting/reassembling is fragile and ordering-sensitive (3).
  ref: 'concepts.md#failure-modes-and-resilience'
- id: aws-reference-architectures-040
  difficulty: intermediate
  tags:
  - streaming
  - protection
  - signed-urls
  question: |
    How do you enforce that only entitled users can fetch premium video segments from CloudFront?
  options:
  - Make the S3 bucket publicly readable and rely on long, hard-to-guess object key names so that only users who somehow learn the exact URL can fetch a segment
  - Use CloudFront signed URLs or signed cookies (and DRM for premium content) so only authorized, time-limited
    requests are served
  - Put every video segment behind an API Gateway endpoint with a 29-second integration timeout that authenticates each request before proxying the bytes from the origin
  - Encrypt the bucket with SSE-KMS so each segment is decrypted only for entitled viewers, since KMS ties every object read to the requesting viewer's key permissions
  answer: 1
  explanation: |
    Signed URLs/cookies gate access with time-limited, authorized tokens; DRM adds content
    protection. Public buckets with obscure URLs are insecure (0); routing video through API GW is
    wrong (timeout, cost) (2); SSE-KMS encrypts at rest but does not authorize viewers fetching via
    CloudFront (3).
  ref: 'concepts.md#video-streaming-platform-netflix-style'
- id: aws-reference-architectures-041
  difficulty: advanced
  tags:
  - url-shortener
  - key-generation
  - hot-partition
  - tradeoff
  question: |
    For generating short codes at scale, compare a monotonic counter (Base62) versus random keys.
    What is the key trade-off?
  options:
  - Counters are collision-free and, because each increment lands on a fresh partition, are perfectly evenly distributed; random keys collide on essentially every generation attempt
  - Random keys are inherently shorter than counter-based codes for the same total code space, because randomness packs more distinct values into fewer Base62 characters
  - A monotonic counter gives compact sequential codes but can create a hot write partition unless sharded;
    random keys spread writes but require a conditional PutItem (attribute_not_exists) to detect and retry
    collisions
  - Counters require a dedicated GPU to compute each sequential Base62 encoding at scale, while random keys can be generated for free on any CPU with no special hardware
  answer: 2
  explanation: |
    Counters produce compact, ordered codes but concentrate writes (hot partition) unless
    sharded; random keys distribute writes but need a conditional write to guard against
    collisions. Random keys can collide (0), are not inherently shorter (1), and neither needs a
    GPU (3).
  ref: 'concepts.md#url-shortener-on-aws'
- id: aws-reference-architectures-042
  difficulty: advanced
  tags:
  - dynamodb
  - consistency
  - gsi
  - tradeoff
  question: |
    A design reads immediately from a DynamoDB Global Secondary Index right after writing the base
    item and occasionally sees stale/missing results. What is the correct explanation and fix?
  options:
  - GSIs are updated asynchronously and are eventually consistent (you cannot request strongly consistent
    reads on a GSI); design for eventual consistency or read the base table by primary key when you need
    strong consistency
  - GSIs are always strongly consistent and reflect base-table writes instantly, so the stale results must be a bug somewhere else in the application read path
  - Toggle the "strongly consistent reads" option on the GSI in the DynamoDB console so index queries immediately return the latest committed base-item values
  - Increase the GSI's per-item projection size limit from 400 KB to 1 MB so the index has room to store and immediately surface the freshly written attributes
  answer: 0
  explanation: |
    GSIs are maintained asynchronously and only support eventually consistent reads - a brief lag
    after a base write is expected. You cannot make a GSI strongly consistent (1,2); for strong
    reads use the base table's primary key. Item size cap is unrelated (3).
  ref: 'concepts.md#service-limits-and-quotas-that-shape-designs'
- id: aws-reference-architectures-043
  difficulty: advanced
  tags:
  - ecommerce
  - idempotency
  - exactly-once
  question: |
    SQS is at-least-once, so a payment-charge message may be delivered more than once. How do you
    prevent double-charging?
  options:
  - Switch the payment-charge transport from SQS to SNS, which delivers each published message to its subscriber exactly once and therefore eliminates any duplicate charge
  - Use an idempotency key per payment request and a conditional write (DynamoDB attribute_not_exists
    / transaction) so a retried message is recognized and not charged again
  - Increase the SQS visibility timeout to its 12-hour maximum so the message stays hidden long enough that a redelivery and second charge can never occur
  - Rely on the downstream payment provider to detect and silently ignore any duplicate charge requests, since card processors always deduplicate identical transactions automatically
  answer: 1
  explanation: |
    Idempotency keys plus a conditional/transactional write make repeated deliveries no-ops - the
    canonical exactly-once-effect pattern on at-least-once transport. SNS is not exactly-once (0);
    a long visibility timeout does not eliminate redelivery/duplicates and can delay recovery (2);
    assuming the provider dedupes is unsafe (3).
  ref: 'concepts.md#e-commerce-and-order-systems-with-sagas'
- id: aws-reference-architectures-044
  difficulty: advanced
  tags:
  - ecommerce
  - inventory
  - hot-partition
  - flash-sale
  question: |
    During a flash sale, one popular SKU's inventory row/partition becomes a contention hotspot.
    Which combination best addresses it?
  options:
  - Just add more read replicas so the extra copies of the inventory row absorb the flash-sale contention and spread the decrement load across nodes
  - Use conditional atomic decrements, and either write-shard the counter (split the SKU's stock across
    N sub-keys and aggregate) or front the sale with a reservation queue to serialize/limit demand
  - Move the hot SKU's inventory record to an S3 object and decrement the stock count by overwriting that object on each purchase during the sale
  - Disable multi-AZ replication for the table to reduce per-write latency, so the single hot inventory row commits faster and clears the contention backlog
  answer: 1
  explanation: |
    Hot-key write contention is solved by atomic conditional decrements plus write-sharding the
    counter and/or a reservation queue to throttle and serialize demand. Read replicas do not help
    write contention (0); S3 is not for atomic counters (2); disabling multi-AZ harms durability
    and does not fix contention (3).
  ref: 'concepts.md#e-commerce-and-order-systems-with-sagas'
- id: aws-reference-architectures-045
  difficulty: advanced
  tags:
  - chat
  - scale
  - websocket
  - iot
  - tradeoff
  question: |
    You must support tens of millions of always-connected devices with pub/sub topics and the
    lowest per-connection cost. Which option is most appropriate and why?
  options:
  - AWS IoT Core (MQTT), which is purpose-built for very large numbers of persistent device connections
    and topic-based pub/sub, versus paying WebSocket per-connection-minute and message costs at that scale
  - API Gateway WebSocket API, because it is the sole managed real-time option AWS offers and its flat per-connection pricing is the cheapest at tens of millions of devices
  - Amazon SQS with each device long-polling its own dedicated queue, so millions of persistent connections become cheap periodic pulls instead of held-open sockets
  - Amazon CloudFront with WebSocket caching at the edge, so each device's persistent topic subscription is served and fanned out from the nearest cached edge location
  answer: 0
  explanation: |
    At the scale of millions of always-on devices with pub/sub topics, IoT Core (MQTT) is
    purpose-built and cost-effective. API Gateway WebSocket is fine for app chat but pricier at
    device scale (1); SQS polling per device is not a real-time push fabric (2); CloudFront does
    not cache WebSockets (3).
  ref: 'concepts.md#real-time-chat-and-notifications'
- id: aws-reference-architectures-046
  difficulty: advanced
  tags:
  - analytics
  - athena
  - redshift
  - emr
  - tradeoff
  question: |
    A team runs a few large ad-hoc SQL queries per week over S3, plus a high-concurrency BI
