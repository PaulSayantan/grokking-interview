  options:
  - Athena for everything to stay fully serverless, letting the constant high-concurrency BI dashboard and the weekly ad-hoc queries both run as per-scan queries over the raw lake
  - Athena for the infrequent ad-hoc queries over the raw lake (pay per scan), and Redshift for the constant
