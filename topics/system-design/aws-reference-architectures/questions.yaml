- id: aws-reference-architectures-060
  difficulty: advanced
  tags:
  - resilience
  - retries
  - jitter
  question: |
    A dependency briefly fails and thousands of clients retry simultaneously, deepening the outage.
    Which technique from the Builders' Library prevents this retry storm?
  options:
  - Fixed 1-second retries on every client so they all recover in lockstep, deliberately synchronizing the retry wave so the dependency clears its backlog as fast as possible
  - Exponential backoff with jitter (randomized, increasing delays) plus circuit breakers to spread retries
    over time and stop hammering a struggling dependency
  - Unlimited immediate retries with no delay until the call finally succeeds, keeping constant pressure on the dependency so it is forced back into service sooner
  - Disabling retries entirely and permanently failing every request the instant a dependency returns an error, even for a brief transient blip
  answer: 1
  explanation: |
    Exponential backoff with jitter randomizes and spaces retries so clients do not synchronize
    into a thundering herd; circuit breakers stop calls to a failing dependency. Fixed or
    immediate retries synchronize load and worsen the outage (0,2); disabling retries hurts
    normal transient recovery (3).
  ref: 'concepts.md#failure-modes-and-resilience'
