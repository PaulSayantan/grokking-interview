topic: 'End-to-End AWS Reference Architectures: Designing Real Systems'
domain: system-design
topic_slug: aws-reference-architectures
version: 1
questions:
- id: aws-reference-architectures-001
  difficulty: beginner
  tags:
  - requirements
  - method
  - estimation
  question: |
    In an AWS system-design interview, what should you do BEFORE naming any services?
  options:
  - Draw the VPC subnet layout across three Availability Zones, placing NAT gateways and route tables before you even understand the workload
  - Translate requirements into numbers (QPS, read/write split, latency budget, durability, consistency)
    and identify the forcing constraints
  - Pick DynamoDB up front because it scales infinitely and therefore removes any need to reason about the workload's access patterns
  - Estimate the monthly bill to the nearest dollar so that cost figure can anchor every downstream service choice you make
  answer: 1
  explanation: |
    The strong method is requirements -> numbers -> constraints -> data model -> compute ->
    integration -> cross-cutting concerns. Jumping to a service (2) or a VPC layout (0) before
    understanding the workload is the classic failure mode. Precise costing (3) comes later and
    depends on the design.
  ref: 'concepts.md#reasoning-from-requirements-to-an-aws-design'
- id: aws-reference-architectures-002
  difficulty: beginner
  tags:
  - serverless
  - defaults
  question: |
    Why is a "serverless-first" posture a reasonable default for most greenfield interview prompts?
  options:
  - Serverless is always cheaper than any container fleet at any scale, because per-request billing beats a fleet's hourly cost under every possible traffic pattern
  - Lambda has no execution time or memory limits, so one invocation can run for hours on many gigabytes of RAM with no architectural change
  - Serverless services are the only ones that are multi-AZ, so any container or EC2 design is inherently single-AZ and less available
  - It minimizes operational burden and scales to zero, letting you focus on the design and then justify
    moving off it when a constraint (duration, throughput, latency, control) demands
  answer: 3
  explanation: |
    Serverless-first minimizes ops and scales to zero, a sensible default you then refine.
    It is NOT always cheapest (at high steady throughput a fleet wins) (0), Lambda has hard
    limits (15 min / 10 GB) (1), and many non-serverless services are multi-AZ too (2).
  ref: 'concepts.md#reasoning-from-requirements-to-an-aws-design'
- id: aws-reference-architectures-003
  difficulty: beginner
  tags:
  - url-shortener
  - dynamodb
  question: |
    For a URL shortener's short-code -> long-URL mapping served at very high read rates with
    pure key lookups, which store is the most appropriate default?
  options:
  - Amazon Aurora with read replicas
  - Amazon S3 with one object per code
  - Amazon OpenSearch
  - Amazon DynamoDB
  answer: 3
  explanation: |
    Pure key lookups with no joins at massive scale is DynamoDB's sweet spot (single-digit-ms,
    horizontal scale, low ops). Aurora adds connection/scaling pain for no benefit (0); S3 is
    for blobs not high-TPS point reads of tiny records (1); OpenSearch is a search engine, not a
    system of record (2).
  ref: 'concepts.md#url-shortener-on-aws'
- id: aws-reference-architectures-004
  difficulty: beginner
  tags:
  - url-shortener
  - redirect
  - caching
  question: |
    Why put CloudFront in front of the URL shortener's redirect endpoint?
  options:
  - It transcodes the redirect response into multiple formats so each client device receives the redirect encoding best suited to it
  - It provides strong consistency for DynamoDB reads by coordinating the edge cache with the table's replicas on every single lookup
  - It caches cacheable redirects at the edge so most repeat clicks never reach your origin, cutting latency
    and origin load
  - It is required for DynamoDB to be multi-AZ, since without CloudFront in front the table would run in only one Availability Zone
  answer: 2
  explanation: |
    CloudFront caches at the edge; a cacheable (301) redirect served from the edge skips your
    API/Lambda/DynamoDB entirely. It does not transcode redirects (0), has nothing to do with
    DynamoDB consistency (1), and DynamoDB is multi-AZ on its own (3).
  ref: 'concepts.md#url-shortener-on-aws'
- id: aws-reference-architectures-005
  difficulty: beginner
  tags:
  - upload
  - s3
  - presigned
  question: |
    Why do image/video upload designs hand the client an S3 presigned URL instead of routing
    bytes through API Gateway and Lambda?
  options:
  - Presigned URLs encrypt the file automatically with the client's password, deriving a per-upload key so bytes are protected with no bucket configuration
  - S3 cannot receive uploads any other way, so a presigned URL is the sole supported mechanism for getting object bytes into a bucket
  - API Gateway and Lambda payload limits (10 MB / 6 MB) make them unsuitable for large files, and direct-to-S3
    upload keeps big bytes off your compute path
  - It makes the upload synchronous so the client blocks and waits for all server-side processing to finish before the PUT is acknowledged
  answer: 2
  explanation: |
    Presigned URLs let the client PUT directly to S3, bypassing API Gateway's 10 MB and Lambda's
    6 MB sync payload caps. It does not add password encryption (0), S3 accepts many upload paths
    (1), and the whole point is to decouple, not to block the client on processing (3).
  ref: 'concepts.md#image-and-video-upload-and-processing'
- id: aws-reference-architectures-006
  difficulty: beginner
  tags:
  - streaming
  - cloudfront
  - cost
  question: |
    In a Netflix-style VOD design, why should you never serve video segments directly from S3
    to viewers?
  options:
  - S3 cannot store video files, since it only accepts text and image object types under a strict per-bucket media policy
  - S3 objects expire after 24 hours by default, so video segments would be deleted long before most viewers ever request them
  - S3 does not support the HLS format, so segmented adaptive-bitrate video simply cannot be stored as objects in a bucket
  - You would pay full egress per view, overload the origin, and add latency; CloudFront caches segments
    at the edge for millions of viewers
  answer: 3
  explanation: |
    Video is extremely cache-friendly; CloudFront serves the same segments to millions from the
    edge, protecting the origin and slashing egress cost/latency. S3 stores any object including
    HLS segments and objects do not auto-expire (0,1,2).
  ref: 'concepts.md#video-streaming-platform-netflix-style'
- id: aws-reference-architectures-007
  difficulty: beginner
  tags:
  - chat
  - websocket
  question: |
    Which AWS service most directly provides managed, serverless bi-directional WebSocket
    connections for a chat app without running connection servers?
  options:
  - API Gateway WebSocket API
  - Amazon Simple Queue Service
  - Amazon CloudFront edge cache
  - AWS Step Functions workflows
  answer: 0
  explanation: |
    API Gateway WebSocket APIs manage persistent connections and give you a connectionId to push
    with postToConnection, with no servers to run. SQS is a queue (1), CloudFront is a CDN (2),
    Step Functions is workflow orchestration (3).
  ref: 'concepts.md#real-time-chat-and-notifications'
- id: aws-reference-architectures-008
  difficulty: beginner
  tags:
  - analytics
  - athena
  - s3
  question: |
    In an S3 data lake, which service lets you run ad-hoc SQL directly over files with no
    cluster to manage, billed by data scanned?
  options:
  - Amazon EMR
  - Amazon RDS
  - Amazon Athena
  - AWS Glue crawler
  answer: 2
  explanation: |
    Athena is serverless SQL over S3, priced per TB scanned. EMR requires provisioning
    Spark/Hadoop clusters (0), RDS is a relational DB not a lake query engine (1), and a Glue
    crawler catalogs schema rather than answering queries (3).
  ref: 'concepts.md#analytics-pipeline'
- id: aws-reference-architectures-009
  difficulty: beginner
  tags:
  - messaging
  - sqs
  - sns
  question: |
    What is the core difference between SQS and SNS?
  options:
  - SQS is a pub/sub broadcast service that pushes to every subscriber; SNS is a point-to-point queue consumers pull work from
  - SQS is a queue consumers pull work from; SNS is pub/sub that pushes each message to all subscribers
  - They are functionally identical; SNS is simply the newer marketing name for the same underlying SQS queue service
  - SQS is only for strict FIFO ordering of events; SNS is used exclusively for streaming video segments to viewers
  answer: 1
  explanation: |
    SQS is a durable queue that decouples producers/consumers (pull); SNS is pub/sub that
    fans a message out to all subscribers (push). Option 0 reverses them, they are not the same
    (2), and neither is a video service (3).
  ref: 'concepts.md#trade-offs-and-when-to-use-what'
- id: aws-reference-architectures-010
  difficulty: beginner
  tags:
  - resilience
  - multi-az
  question: |
    What is the baseline resilience posture assumed for a well-architected AWS design?
  options:
  - Single-AZ to minimize cost, adding additional Availability Zones only reactively after your first outage
  - Multi-region active-active for every workload regardless of its RTO/RPO or actual availability requirements
  - One large EC2 instance sized for peak load, vertically scaled so a single powerful host absorbs all traffic
  - Multi-AZ by default (DynamoDB, S3, Aurora Multi-AZ, load balancers and Auto Scaling spread across
    AZs)
  answer: 3
  explanation: |
    Multi-AZ is table stakes and mostly free architecturally. Single-AZ is a needless SPOF (0);
    multi-region active-active is expensive and complex, justified only by strict RTO/RPO (1);
    one big instance is a SPOF and does not scale (2).
  ref: 'concepts.md#failure-modes-and-resilience'
- id: aws-reference-architectures-011
  difficulty: beginner
  tags:
  - s3
  - consistency
  question: |
    What is S3's read-after-write consistency behavior for object operations today?
  options:
  - Eventually consistent for all reads, with possible stale reads for seconds
  - Strong only within a single AZ; cross-AZ reads stay eventually consistent
  - Strong only if you explicitly enable a paid consistency add-on feature on the bucket
  - Strongly consistent read-after-write for GET/PUT/LIST since December 2020
  answer: 3
  explanation: |
    Since Dec 2020, S3 provides strong read-after-write consistency for all operations, no add-on
    needed. The old eventual-consistency caveat (0) no longer applies, and consistency is not
    AZ-scoped or a paid feature (1,2).
  ref: 'concepts.md#service-limits-and-quotas-that-shape-designs'
- id: aws-reference-architectures-012
  difficulty: beginner
  tags:
  - lambda
  - limits
  question: |
    What is the maximum execution duration of a single AWS Lambda invocation?
  options:
  - 15 minutes
  - 30 seconds
  - 5 minutes
  - 1 hour
  answer: 0
  explanation: |
    Lambda caps a single invocation at 15 minutes. Beyond that you use Fargate, Step Functions,
    Batch, or a job service like MediaConvert. 30 s and 5 min are other services' limits (API
    Gateway timeout, Step Functions Express) (1,2); there is no 1-hour Lambda (3).
  ref: 'concepts.md#service-limits-and-quotas-that-shape-designs'
- id: aws-reference-architectures-013
  difficulty: beginner
  tags:
  - dynamodb
  - limits
  question: |
    What is the maximum size of a single DynamoDB item?
  options:
  - 64 KB
  - 1 MB
  - 16 MB
  - 400 KB
  answer: 3
  explanation: |
    A DynamoDB item is capped at 400 KB including attribute names and values. Larger blobs go to
    S3 with a pointer stored in the item. 1 MB is the Kinesis record / DynamoDB query-page size,
    not the item cap (1).
  ref: 'concepts.md#service-limits-and-quotas-that-shape-designs'
- id: aws-reference-architectures-014
  difficulty: beginner
  tags:
  - video
  - mediaconvert
  question: |
    Which AWS service is purpose-built to transcode uploaded VOD files into adaptive-bitrate
    HLS/DASH renditions?
  options:
  - AWS Lambda with FFmpeg
  - Amazon CloudFront
  - AWS Elemental MediaConvert
  - Amazon Kinesis Video Streams
  answer: 2
  explanation: |
    MediaConvert is the file-based transcoding service producing ABR HLS/DASH, handling long
    files and many codecs. Lambda+FFmpeg cannot transcode a long 4K film within 15 min / memory
    limits (0); CloudFront delivers, it does not transcode (1); Kinesis Video is for ingesting
    live device streams (3).
  ref: 'concepts.md#image-and-video-upload-and-processing'
- id: aws-reference-architectures-015
  difficulty: intermediate
  tags:
  - url-shortener
  - redirect
  - tradeoff
  question: |
    A URL shortener team wants edge-cached redirects for lowest latency but also wants per-click
    analytics. What is the fundamental trade-off between using 301 vs 302?
  options:
  - 301 and 302 behave identically for caching purposes, so the choice between them is purely cosmetic and has no effect on analytics or latency
  - 302 responses are cached forever by browsers and CDNs while 301 responses are never cached, so 302 gives the best possible edge latency
  - 301 is aggressively cached by browsers/CDNs (great latency, but repeat clicks skip your origin so
    you lose per-click counts); 302 is not cached, so every click reaches your origin for analytics but
    costs latency and invocations
  - Only 200 OK responses can ever be cached by a CDN, so neither 301 nor 302 redirects can be edge-cached and both always hit the origin
  answer: 2
  explanation: |
    301 (permanent) is cached aggressively so repeat clicks bypass your origin, losing analytics;
    302 forces every click to origin so you can log it but pays latency/compute each time. Option
    2 reverses them, they are not identical (0), and redirects are cacheable unlike the claim in
    3.
  ref: 'concepts.md#url-shortener-on-aws'
- id: aws-reference-architectures-016
  difficulty: intermediate
  tags:
  - url-shortener
  - hot-partition
  question: |
    A single shortened link goes viral and reads spike enormously on one DynamoDB partition key.
    What is the BEST first mitigation?
  options:
  - Increase the provisioned WCU on the table so the hot partition has more capacity to absorb the surge
  - Split the long URL into two DynamoDB items so the read load is divided across two separate partitions
  - Serve the hot key from a cache layer (CloudFront edge and/or DAX) so most reads never hit the partition
  - Switch the table from DynamoDB to Aurora, which handles a single hot key better through its buffer pool
  answer: 2
  explanation: |
    A hot READ partition is best solved with caching (CloudFront at the edge, DAX for sub-ms
    DynamoDB caching) so the partition sees a fraction of traffic. More WCU addresses writes not
    reads (0); splitting the item does nothing for read concentration (1); Aurora would be worse
    for a hot key (3).
  ref: 'concepts.md#url-shortener-on-aws'
- id: aws-reference-architectures-017
  difficulty: intermediate
  tags:
  - upload
  - s3-events
  - sqs
  - eventbridge
  question: |
    An image-processing pipeline faces huge, bursty upload spikes and you want durable buffering,
    retries, and a dead-letter path before Lambda processes each object. Which S3-event target
    fits best?
  options:
  - S3 -> SNS -> email
  - S3 -> SQS -> Lambda
  - S3 -> Lambda directly with no buffer
  - S3 -> CloudFront
  answer: 1
  explanation: |
    Routing S3 events into SQS gives durable buffering, backpressure, per-message retries, and a
    DLQ, smoothing bursts before Lambda. Direct S3->Lambda (2) can blow Lambda concurrency during
    spikes; SNS->email is a notification not a work buffer (0); CloudFront is delivery (3).
  ref: 'concepts.md#image-and-video-upload-and-processing'
- id: aws-reference-architectures-018
  difficulty: intermediate
  tags:
  - upload
  - lambda
  - mediaconvert
  - tradeoff
  question: |
    You process both small user thumbnails and full 2-hour 4K movie transcodes. What is the right
    split?
  options:
  - Use Lambda for thumbnails/short clips and MediaConvert for the long 4K transcodes that exceed Lambda's
    time/memory limits
  - Use Lambda for everything to keep the pipeline serverless and simple, even the long 2-hour 4K transcodes
  - Use MediaConvert for everything, including tiny thumbnails, so one managed service handles every job
  - Use EC2 with a self-managed FFmpeg install for both workloads to maximize low-level control over encodes
  answer: 0
  explanation: |
    Lambda is fast/cheap for images and short clips but a 2-hour 4K transcode exceeds its 15-min /
    10 GB limits; MediaConvert is built for long file-based transcode. All-Lambda fails on big
    files (1); MediaConvert for tiny thumbnails is overkill/slower to trigger (2); EC2+FFmpeg adds
    ops for no benefit over the managed split (3).
  ref: 'concepts.md#image-and-video-upload-and-processing'
- id: aws-reference-architectures-019
  difficulty: intermediate
  tags:
  - streaming
  - abr
  question: |
    How does adaptive bitrate streaming (ABR) improve the viewer experience?
  options:
  - MediaConvert produces multiple renditions plus a manifest; the player measures bandwidth and switches
    rendition per small segment, so startup is fast and playback adapts to network changes
  - It stores the entire movie as a single fixed high-bitrate file that the player must download in full before playback can begin, so the quality never changes mid-stream
  - It relies on UDP multicast pushed directly from an S3 bucket to every connected viewer at once, sending one identical bitrate to the whole audience in lockstep
  - It performs on-the-fly per-viewer transcoding inside each CloudFront edge location, generating a custom bitrate for every individual request as it arrives at the CDN
  answer: 0
  explanation: |
    ABR pre-encodes several renditions and segments; the player picks per-segment based on
    measured bandwidth, enabling fast start and smooth adaptation. It does not require full
    download (1), S3 is not multicast (2), and CloudFront caches pre-made segments rather than
    transcoding per viewer (3).
  ref: 'concepts.md#video-streaming-platform-netflix-style'
- id: aws-reference-architectures-020
  difficulty: intermediate
  tags:
  - streaming
  - origin-shield
  - tradeoff
  question: |
    What does enabling CloudFront Origin Shield buy a large VOD catalog, and what is the cost?
  options:
  - It applies end-to-end encryption to every video segment as it leaves the origin, and the cost is the extra CPU spent decrypting each segment on the viewer's player device
  - It adds a centralized mid-tier cache that collapses origin requests and raises cache-hit ratio for
    long-tail content; cost is a small added latency/fee on shielded requests
  - It removes the need to pre-encode a rendition ladder by serving one master file, and the cost is much higher origin storage since a single large mezzanine copy is kept
  - It automatically converts HLS packages into DASH on the fly at the edge for every client, and the cost is per-stream format-conversion licensing fees charged by AWS
  answer: 1
  explanation: |
    Origin Shield is a mid-tier cache in front of the origin that collapses requests from many
    edge locations, improving hit ratio for long-tail catalogs at the price of a small extra
    latency/cost per shielded fetch. It is not an encryption, ladder, or format-conversion feature
    (0,2,3).
  ref: 'concepts.md#video-streaming-platform-netflix-style'
- id: aws-reference-architectures-021
  difficulty: intermediate
  tags:
  - chat
  - dynamodb
  - ttl
  question: |
    In a WebSocket chat app, why store connectionIds in a DynamoDB table with a TTL?
  options:
  - TTL transparently encrypts each stored connectionId at rest and re-encrypts it on every push, so the WebSocket channel itself is secured by the table's expiry setting
  - Setting a DynamoDB TTL on the connection record guarantees that every message pushed to that connection is delivered exactly once with no duplicates or drops
  - It maps users to active connections for pushing messages, and TTL auto-expires stale entries left
    by dropped connections
  - A TTL-enabled connections table is a hard prerequisite that API Gateway WebSocket APIs check on connect, refusing to establish any socket unless such a table exists
  answer: 2
  explanation: |
    You need a registry from user/room to connectionId to push with postToConnection; TTL cleans
    up stale connections (idle timeout 10 min, max 2 h). TTL is not encryption (0), not a delivery
    guarantee (1), and not strictly required by the WebSocket API (3).
  ref: 'concepts.md#real-time-chat-and-notifications'
- id: aws-reference-architectures-022
  difficulty: intermediate
  tags:
  - chat
  - websocket
  - limits
  question: |
    An API Gateway WebSocket connection has a 10-minute idle timeout and a 2-hour maximum
    duration. What must the design account for?
  options:
  - Nothing at all; once the handshake completes an API Gateway WebSocket connection is held open indefinitely by the service and never dropped for idleness or age
  - Clients must send periodic keepalives and transparently reconnect (re-registering their connectionId)
    because connections will be dropped
  - You must route all traffic through an SQS FIFO queue, which resets the idle timer and keeps each WebSocket connection alive indefinitely
  - You must disable the API's multi-AZ deployment, since spreading the endpoint across Availability Zones is what forces the 10-minute idle disconnect
  answer: 1
  explanation: |
    Because connections drop on idle (10 min) or after 2 h max, clients need keepalives and
    reconnect-and-reregister logic; the connectionId changes on reconnect. Connections are not
    permanent (0), SQS/FIFO and multi-AZ toggling are unrelated (2,3).
  ref: 'concepts.md#real-time-chat-and-notifications'
- id: aws-reference-architectures-023
  difficulty: intermediate
  tags:
  - ecommerce
  - saga
  - step-functions
  question: |
    Why use the saga pattern for a checkout that spans inventory, payment, and order services
    instead of a distributed ACID transaction?
  options:
  - Because DynamoDB has no transaction support whatsoever, leaving a saga's compensating steps as the only way to coordinate any multi-item write
  - Because a saga's chain of local transactions always completes faster than any single ACID transaction, so latency alone dictates the choice
  - Because you cannot hold a two-phase-commit lock across independent services/data stores; a saga runs
    local transactions each with a compensating action to undo on failure
  - Because third-party payment providers mandate XA two-phase-commit transactions, so the saga exists purely to satisfy that external protocol requirement
  answer: 2
  explanation: |
    Distributed 2PC across heterogeneous services is impractical/unavailable; a saga sequences
    local transactions with compensations (release inventory, refund) to preserve consistency.
    DynamoDB does support transactions within its scope (0); sagas are about correctness across
    services, not raw speed (1); external payment APIs are not XA (3).
  ref: 'concepts.md#e-commerce-and-order-systems-with-sagas'
- id: aws-reference-architectures-024
  difficulty: intermediate
  tags:
  - ecommerce
  - orchestration
  - choreography
  - tradeoff
  question: |
    What is the trade-off between Step Functions (orchestration) and EventBridge-driven
    choreography for a checkout saga?
  options:
  - Orchestration is always the inferior choice because centralizing state in one state machine inevitably creates a single point of failure that choreography structurally avoids
  - Choreography inherently guarantees exactly-once event delivery across all services, whereas Step Functions orchestration can only ever offer at-least-once semantics
  - They are fully interchangeable with identical operational characteristics, so the decision is arbitrary and has no effect on debuggability or coupling
  - Orchestration gives a central state machine with visible flow, built-in retries/timeouts and easy
    compensations (good for complex multi-step checkout); choreography is loosely coupled with no coordinator
    but the flow is emergent and harder to debug
  answer: 3
  explanation: |
    Orchestration centralizes and makes the multi-step transaction observable with managed
    retries/compensations; choreography decouples services but the end-to-end flow is emergent and
    harder to trace. Neither is universally worse (0), delivery semantics are not the distinction
    (1), and they are not interchangeable (2).
  ref: 'concepts.md#e-commerce-and-order-systems-with-sagas'
- id: aws-reference-architectures-025
  difficulty: intermediate
  tags:
  - ecommerce
  - aurora
  - dynamodb
  - tradeoff
  question: |
    For the authoritative order/ledger table in an e-commerce system, which choice and rationale
    is strongest?
  options:
  - DynamoDB, because it is the single AWS store that offers real durability guarantees for financial records and no other option can persist orders safely
  - S3, because orders are ultimately just serialized blobs and object storage is the cheapest place to keep an authoritative ledger
  - ElastiCache, because every order lookup must complete in sub-millisecond time and only an in-memory store can serve as the system of record
  - Aurora, when you need rich relational queries, multi-row ACID, and financial reporting and the team
    knows SQL, accepting its connection and write-scaling ceiling
  answer: 3
  explanation: |
    Orders often land on a relational store for ACID integrity, joins, and reporting - Aurora fits,
    with the caveat of connection limits and vertical write scaling. DynamoDB is also durable and
    valid for key access but the rationale in 0 is wrong; S3 and ElastiCache are inappropriate as a
    system of record for orders (1,2).
  ref: 'concepts.md#e-commerce-and-order-systems-with-sagas'
- id: aws-reference-architectures-026
  difficulty: intermediate
  tags:
  - feed
  - fan-out
  - tradeoff
  question: |
    In a social feed, what is the trade-off between fan-out-on-write (push) and fan-out-on-read
    (pull)?
  options:
  - Push precomputes each follower's timeline so reads are cheap but a high-follower post causes massive
    write amplification; pull stores posts once (cheap writes) but reads must gather and merge from everyone
    you follow (expensive reads)
  - Push makes reads expensive because each timeline must be merged on the fly, while pull makes writes expensive because every post is copied to all followers
  - They both optimize reads and writes equally with no downside, so the two fan-out models are effectively the same design with no meaningful trade-off
  - Pull is always the correct choice because reading from every followed account at query time scales infinitely with no read-side cost at any follower count
  answer: 0
  explanation: |
    Push optimizes the dominant read at the cost of write amplification (a celebrity fan-out);
    pull optimizes writes at the cost of read-time merge. Option 1 reverses the costs; neither is
    free (2); real systems use a hybrid, not pull-only (3).
  ref: 'concepts.md#social-feed-with-fan-out'
- id: aws-reference-architectures-027
  difficulty: intermediate
  tags:
  - feed
  - celebrity
  - hybrid
  question: |
    A social platform has both normal users and celebrities with tens of millions of followers.
    What is the standard fan-out approach?
  options:
  - Fan-out-on-write for absolutely everyone, cheerfully accepting tens of millions of timeline writes per celebrity post as a normal and sustainable steady-state cost
  - Fan-out-on-read for everyone, including normal users, to keep writes cheap even though it forces an expensive multi-account merge on every single timeline read
  - Store every post only in ElastiCache and never persist it to DynamoDB, relying on in-memory replication alone to keep timelines durable across node failures
  - 'Hybrid: push for normal users, but for high-fan-out accounts skip the push and have followers pull
    those posts at read time, merging them into the pushed timeline'
  answer: 3
  explanation: |
    The canonical answer is a hybrid: push for typical users, pull-and-merge for celebrities to
    avoid write amplification. All-push melts down on celebrity posts (0); all-pull makes every
    read expensive (1); cache-only loses durability (2).
  ref: 'concepts.md#social-feed-with-fan-out'
- id: aws-reference-architectures-028
  difficulty: intermediate
  tags:
  - analytics
  - kinesis
  - sqs
  - tradeoff
  question: |
    Why choose Kinesis Data Streams over SQS for an analytics ingestion layer that feeds both a
    real-time dashboard and a batch pipeline?
  options:
  - SQS has a lower per-message price, so it is always the better analytics ingestion choice regardless of ordering, replay, or multi-consumer needs
  - SQS supports far higher per-partition throughput than a Kinesis shard, so a single queue outperforms any shard for a real-time dashboard feed
  - Kinesis cannot integrate with S3 at all, so any pipeline that must land raw events in a data lake is forced to use SQS instead
  - Kinesis provides ordered, replayable records that multiple independent consumers can read from the
    same stream, whereas SQS is a work queue where a consumed message is removed and cannot be replayed
    by multiple consumers
  answer: 3
  explanation: |
    Kinesis is a stream: ordered per shard, replayable (up to 365 days), and multiple consumers
    can independently read it - ideal when the same events feed real-time and batch. SQS removes a
    message once processed, so it is not a multi-consumer replayable stream (0,1); Kinesis
    integrates with S3 via Firehose (2).
  ref: 'concepts.md#analytics-pipeline'
- id: aws-reference-architectures-029
  difficulty: intermediate
  tags:
  - analytics
  - parquet
  - cost
  question: |
    Why store data-lake files as partitioned Parquet rather than raw JSON for Athena/Redshift
    Spectrum queries?
  options:
  - Parquet files are stored uncompressed by design, which keeps their layout simple and lets Athena skip any decompression step during a scan
  - Columnar, compressed, partitioned Parquet drastically reduces the bytes scanned per query, cutting
    Athena cost and speeding queries; raw JSON forces full scans and is expensive at scale
  - Athena can only query JSON natively, so Parquet files are useful purely as a compact archival format that must be converted back before querying
  - Storing data as Parquet removes any need for a Glue Data Catalog, because the column schema is embedded and Athena discovers tables automatically at query time
  answer: 1
  explanation: |
    Athena bills per TB scanned; columnar+compressed+partitioned Parquet lets it read only needed
    columns/partitions, saving money and time. Parquet is compressible (0), Athena supports many
    formats including Parquet (2), and you still catalog schema in Glue (3).
  ref: 'concepts.md#analytics-pipeline'
- id: aws-reference-architectures-030
  difficulty: intermediate
  tags:
  - api-gateway
  - async
  - limits
  question: |
    A synchronous API call could take up to several minutes to complete server-side. Given API
    Gateway's 29-second integration timeout, what is the correct pattern?
  options:
  - Increase the Lambda function timeout to the full 15 minutes so the synchronous API call simply waits and returns the response once processing finishes
  - Return 202 Accepted with a job id immediately, process asynchronously (SQS/Step Functions), and notify
    via WebSocket/SNS or let the client poll for status
  - Split the work into 29-second chunks and stream each partial result back over the same open HTTP request so the integration timeout is never exceeded
  - Hand the client an S3 presigned URL for the request so the long-running processing runs against S3 instead and bypasses the API Gateway timeout entirely
  answer: 1
  explanation: |
    Any operation that can exceed 29 s must go async: acknowledge with 202 + job id, process in the
    background, and notify or poll. Raising the Lambda timeout does not extend API Gateway's 29 s
    integration cap (0); chunking a single request does not evade it (2); presigned URLs solve
    payload size, not long-running processing (3).
  ref: 'concepts.md#service-limits-and-quotas-that-shape-designs'
- id: aws-reference-architectures-031
  difficulty: intermediate
  tags:
  - sqs
  - fifo
  - limits
  - tradeoff
  question: |
    You need strict per-account ordering and no duplicate processing for a ledger. What must you
    weigh when choosing SQS FIFO?
  options:
  - FIFO gives ordering and dedup within a group but is capped at 300 TPS (3000 with batching of 10);
    use it only where per-entity ordering truly matters, and consider partitioning by message group
  - FIFO queues scale to unlimited throughput just like Standard queues, so ordering comes for free with no per-second cap and no design trade-off to weigh
  - FIFO queues preserve ordering but perform no deduplication at all, so you must build your own duplicate-detection layer on top of the ledger consumer
  - FIFO queues run in only a single Availability Zone, so choosing FIFO for a ledger sacrifices the multi-AZ durability that Standard queues provide
  answer: 0
  explanation: |
    SQS FIFO provides ordering + exactly-once-processing within the dedup window but is throughput-
    limited (300 TPS, 3000 batched), so reserve it for cases that genuinely need ordering. It is
    not unlimited (1), it does dedupe (2), and SQS is a regional multi-AZ service (3).
  ref: 'concepts.md#e-commerce-and-order-systems-with-sagas'
- id: aws-reference-architectures-032
  difficulty: intermediate
  tags:
  - compute
  - lambda
  - fargate
  - tradeoff
  question: |
    A workload runs at a constant 50,000 requests/second all day. What is the right way to reason
    about Lambda vs a Fargate/EC2 fleet?
  options:
  - Always use Lambda, since per-request billing makes it the cheapest option at every scale including sustained 50,000-requests-per-second traffic all day
  - Always use EC2, because Lambda's concurrency ceiling makes it fundamentally incapable of serving anything approaching 50,000 requests per second
  - The total cost of the two options is effectively identical at this scale, so the decision comes down to personal or team preference rather than economics
  - Compare per-request Lambda cost (GB-seconds + per-invoke) against a fleet's hourly cost at high utilization;
    at sustained high throughput a right-sized container/EC2 fleet is often cheaper, while Lambda still
    wins for spiky/low-duty-cycle traffic
  answer: 3
  explanation: |
    The crossover is real: Lambda excels for spiky/scale-to-zero load but at constant high
    throughput a well-utilized fleet is usually cheaper per request. Lambda is not universally
    cheapest (0), it can handle high rps with concurrency (1), and costs are not identical (2).
  ref: 'concepts.md#cost-estimation-and-back-of-envelope'
- id: aws-reference-architectures-033
  difficulty: intermediate
  tags:
  - dynamodb
  - capacity
  - cost
  - tradeoff
  question: |
    When is DynamoDB on-demand capacity the better choice over provisioned + auto scaling?
  options:
  - For steady, highly predictable traffic where you want the lowest possible per-request cost, since on-demand always undercuts provisioned capacity for constant load
  - For unpredictable, spiky, or brand-new workloads where you cannot forecast capacity and want to avoid
    throttling without capacity planning
  - Only when the table's total stored data is smaller than 400 KB, since on-demand mode is restricted to tables below that size threshold
  - On-demand capacity is always cheaper than provisioned capacity for any workload, so it should simply be the default for every DynamoDB table
  answer: 1
  explanation: |
    On-demand suits spiky/unpredictable/new workloads (pay per request, no planning). For steady,
    predictable traffic, provisioned + auto scaling (or reserved capacity) is much cheaper (0), so
    on-demand is not always cheaper (3); 400 KB is the item cap, unrelated to capacity mode (2).
  ref: 'concepts.md#cost-estimation-and-back-of-envelope'
- id: aws-reference-architectures-034
  difficulty: intermediate
  tags:
  - chat
