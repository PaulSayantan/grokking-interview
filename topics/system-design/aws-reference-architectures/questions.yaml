- id: aws-reference-architectures-069
  difficulty: expert
  tags:
  - analytics
  - backpressure
  - enhanced-fan-out
  question: |
    Five independent consumers each need the full Kinesis stream in near real time, but they are
    hitting the shared 2 MB/s per-shard egress limit and adding read latency. What is the fix?
  options:
  - Add more shards even though ingest throughput is already fine, then spread the five consumers across
    the extra shards so each reads from fewer of them
  - Switch all five consumers off Kinesis entirely and have them long-poll a shared SQS queue instead, so
    the per-shard read limit no longer applies to any of them
  - Use Kinesis enhanced fan-out (EFO), giving each registered consumer its own dedicated 2 MB/s per shard
