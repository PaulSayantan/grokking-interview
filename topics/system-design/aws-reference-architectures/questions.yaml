  - Reduce the stream's retention period so older records are dropped sooner, freeing up per-shard read
    bandwidth for the five live consumers
  answer: 2
  explanation: |
    Enhanced fan-out gives each consumer a dedicated 2 MB/s-per-shard pipe (push over HTTP/2),
    eliminating the shared-read contention among multiple consumers. Adding shards for read-only
    contention is wasteful and does not grant per-consumer bandwidth the way EFO does (0); SQS is
    not a multi-consumer replayable stream (1); retention does not affect read throughput (3).
  ref: 'concepts.md#analytics-pipeline'
- id: aws-reference-architectures-070
