  - Fargate is unable to run containers at all and only schedules plain functions, so EKS is the sole option for actually deploying containerized microservices
  - EKS is the fully serverless, node-free option while Fargate always requires you to provision, patch, and manage a fleet of underlying EC2 servers yourself
  - The two are functionally identical in every respect except that EKS is strictly cheaper than Fargate for all workloads at all scales
  answer: 0
  explanation: |
    Fargate abstracts away nodes (no cluster ops, per-task cost); EKS brings k8s power/portability
    but you operate more. Fargate does run containers (1); Fargate is the more serverless option,
    not EKS (2); they are not identical (3).
  ref: 'concepts.md#e-commerce-and-order-systems-with-sagas'
- id: aws-reference-architectures-036
  difficulty: intermediate
  tags:
  - messaging
  - sns-sqs
  - fan-out
  question: |
    Why is the "SNS -> multiple SQS queues" fan-out pattern common instead of SNS delivering
    directly to each consumer?
  options:
  - Each subscriber gets its own durable SQS queue for buffering, independent retry, and DLQ handling,
    so a slow or failed consumer does not lose messages or block others
  - It is required because SNS cannot have more than one subscriber
  - SQS is faster than SNS at broadcasting
  - It converts messages to FIFO automatically
  answer: 0
  explanation: |
    SNS->SQS gives each consumer a durable buffer with independent retries/DLQ and backpressure,
    decoupling consumer speed/availability. SNS supports many subscribers (1); the benefit is
    durability/decoupling, not broadcast speed (2); it does not auto-convert to FIFO (3).
  ref: 'concepts.md#trade-offs-and-when-to-use-what'
- id: aws-reference-architectures-037
  difficulty: intermediate
  tags:
  - resilience
  - dlq
  question: |
    Why attach a dead-letter queue (DLQ) and a max-receive limit to an SQS-driven Lambda consumer?
  options:
  - To roughly double effective throughput by having each SQS message delivered and processed twice in parallel, since duplicate work spreads load across more consumers
  - To guarantee exactly-once delivery by having the DLQ deduplicate every message and acknowledge each one back to the source queue exactly a single time
  - So a poison message that repeatedly fails is moved aside after N attempts instead of endlessly redriving
    and wedging the consumer
  - Because an SQS queue cannot be created or receive any messages at all unless a dead-letter queue and a max-receive count are configured on it first
  answer: 2
  explanation: |
    A DLQ + max-receive count isolates poison messages so one bad message does not loop forever
    and block the queue; you inspect/replay them later. It is not about doubling throughput (0) or
    exactly-once (1), and DLQs are optional (3).
  ref: 'concepts.md#failure-modes-and-resilience'
- id: aws-reference-architectures-038
  difficulty: intermediate
  tags:
  - kinesis
  - shard
  - limits
  question: |
    A Kinesis Data Streams producer needs 8 MB/s of ingest. How many shards at minimum, given a
