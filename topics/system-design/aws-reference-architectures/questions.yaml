    option best fits and what is the residual concern?
  options:
  - Aurora provisioned at peak instance size around the clock so the flash-sale spikes are always covered;
    the residual concern is nil because a fixed peak cluster has nothing left to tune
  - DynamoDB on-demand for the order table, on the reasoning that relational integrity and multi-row ACID
    guarantees simply do not matter for order data and can be dropped entirely
  - Add read replicas alone and route the flash-sale surge to them, since the extra replicas absorb the
    write spikes and take pressure off the primary writer
  - Aurora Serverless v2, which scales capacity up/down with load to avoid paying for peak all day; residual
    concern is that connection limits and single-writer vertical write scaling still cap write throughput,
    so extreme write spikes may need queueing/sharding
  answer: 3
  explanation: |
    Aurora Serverless v2 scales with demand, avoiding paying for peak all day while keeping SQL/ACID;
    but writes still funnel through a single writer with connection limits, so extreme write spikes
    may need buffering/sharding. Peak-provisioned 24/7 wastes money (0); dropping relational
    integrity is a wrong trade for orders (1); read replicas do not absorb writes (2).
  ref: 'concepts.md#e-commerce-and-order-systems-with-sagas'
- id: aws-reference-architectures-073
  difficulty: advanced
  tags:
  - upload
  - eventbridge
  - sns
  - sqs
  - tradeoff
  question: |
    When should an image pipeline route S3 events through EventBridge rather than S3->SQS or
    S3->SNS?
  options:
  - When your only requirement is to send a single email notification to one operator on each upload, and you specifically want EventBridge to own the SMTP delivery and retry of that one message
  - When you need rich content-based filtering and routing of events to many heterogeneous targets (multiple
    Lambdas, Step Functions, cross-account, SaaS) with schema/rules, beyond simple buffering or basic
    pub/sub
  - When you need the absolute lowest possible per-message price with no routing or filtering logic at all, because EventBridge undercuts both SQS and SNS on raw per-event cost for high-volume image pipelines
  - When you must guarantee strict total ordering of every image-processing event, because EventBridge preserves per-bucket FIFO ordering across all matched rules while SQS and SNS cannot
  answer: 1
  explanation: |
    EventBridge shines for content-based routing/filtering to many targets with rules and schemas
    (including cross-account/SaaS). Emailing one person suits SNS (0); pure low-cost buffering suits
    SQS (2); strict ordering is not EventBridge's purpose (3).
  ref: 'concepts.md#image-and-video-upload-and-processing'
- id: aws-reference-architectures-074
  difficulty: advanced
  tags:
  - security
  - presigned
  - kms
  - upload
  question: |
    For the direct-to-S3 upload flow, which security measures are appropriate without breaking the
    presigned-URL pattern?
  options:
  - Make the bucket fully public-read and grant s3:GetObject to everyone, so CloudFront can serve derivatives directly without an Origin Access Control or any bucket policy to maintain
  - Scope presigned URLs to a specific key, method, and short expiry; enable SSE-KMS on the bucket; and
    serve reads through CloudFront with Origin Access Control (OAC) so the bucket stays private
  - Embed a long-lived IAM access key and secret with s3:PutObject in the shipped mobile client, so each device signs its own uploads directly and you never have to run a presigning endpoint
  - Disable bucket encryption entirely so the KMS encrypt step is skipped on every PUT, shaving latency off the direct-to-S3 upload for large image files
  answer: 1
  explanation: |
    Tightly scoped, short-lived presigned URLs + SSE-KMS + CloudFront OAC to a private bucket is the
    secure pattern. Public buckets and embedded long-lived credentials are serious risks (0,2);
    disabling encryption trades security for negligible latency (3).
  ref: 'concepts.md#image-and-video-upload-and-processing'
- id: aws-reference-architectures-075
  difficulty: beginner
  tags:
  - streaming
  - hls
  - dash
  - tradeoff
  question: |
    Why do many VOD pipelines produce both HLS and DASH from a single MediaConvert job?
  options:
  - HLS and DASH are byte-for-byte the same packaging format and differ only in the file extension, so emitting both from one job is a pure naming convenience with no compatibility benefit at all
  - HLS is favored on Apple/iOS/Safari while DASH offers broad/Android/DRM flexibility, so producing both
    maximizes device compatibility from one transcode
  - DASH can only be used for live streaming and HLS only for VOD, so a VOD pipeline is required to emit HLS and a DASH rendition would simply be ignored by every player
  - Producing both HLS and DASH from one job halves the storage cost, because MediaConvert deduplicates the shared video segments and keeps only a single copy referenced by both manifests
  answer: 1
  explanation: |
    HLS suits Apple ecosystems; DASH is broadly used (Android, flexible DRM), so emitting both from
    one job maximizes compatibility. They are distinct formats (0), both work for VOD (2), and
    producing two formats increases, not halves, storage (3).
  ref: 'concepts.md#video-streaming-platform-netflix-style'
- id: aws-reference-architectures-076
  difficulty: beginner
  tags:
  - analytics
  - firehose
  question: |
    What is the simplest, zero-administration way to continuously load streaming records into S3
    with buffering and optional format conversion?
  options:
  - Amazon Kinesis Data Firehose
  - Amazon Athena
  - Amazon EMR
  - AWS Step Functions
  answer: 0
  explanation: |
    Firehose is the fully managed delivery stream that buffers and writes to S3 (and Redshift/
    OpenSearch), with format conversion to Parquet. Athena queries data (1), EMR is big-data
    compute (2), and Step Functions orchestrates workflows (3) - none is a managed S3 loader.
  ref: 'concepts.md#analytics-pipeline'
- id: aws-reference-architectures-077
  difficulty: intermediate
  tags:
  - feed
  - cache-aside
  - elasticache
  question: |
    Which caching strategy is typically used for hot social-feed timelines backed by DynamoDB?
  options:
  - Write-around, where every write skips the cache and goes straight to DynamoDB and reads are never cached, so hot timelines re-read from the table on every single request with no memory layer
  - Write-through only, synchronously caching the result of every write regardless of read demand, so even timelines that are never read again occupy Redis memory alongside the genuinely hot ones
  - No caching at all; serve every timeline read directly from DynamoDB each time, accepting its single-digit-millisecond latency on the hottest feeds rather than fronting them with any in-memory tier
  - 'Cache-aside (lazy loading): read from ElastiCache; on a miss, load from DynamoDB and populate the
    cache, so hot timelines serve from memory'
  answer: 3
  explanation: |
    Cache-aside serves hot timelines from Redis and lazily fills on misses from DynamoDB, matching
    the read-heavy access. Write-around (0) skips caching reads; caching every write (1) wastes
    memory on cold data; no cache (2) fails the sub-ms latency goal.
  ref: 'concepts.md#social-feed-with-fan-out'
- id: aws-reference-architectures-078
  difficulty: intermediate
  tags:
  - compute
  - lambda
  - cold-start
  - tradeoff
  question: |
    A latency-sensitive API on Lambda suffers occasional cold-start spikes on a JVM runtime. What
    is a reasonable mitigation and its trade-off?
  options:
  - Do nothing, because JVM cold starts on Lambda are a fundamental platform limit that no configuration, runtime tuning, or capacity setting can ever reduce, so the latency spikes must simply be accepted
  - Increase the API Gateway integration timeout to its 29-second maximum, which absorbs the cold-start delay into the allowed window so the initialization time stops showing up as a client-visible latency spike
  - Switch the trigger to an SQS FIFO queue in front of the function, because FIFO's ordered polling keeps the execution environment continuously warm and thereby removes the JVM initialization penalty
  - Use provisioned concurrency (pre-warmed execution environments) to eliminate cold starts for that
    many concurrent instances, at the cost of paying for the provisioned capacity even when idle
  answer: 3
  explanation: |
    Provisioned concurrency keeps environments warm to remove cold starts, trading always-on cost.
    Cold starts are mitigable (0); a longer API timeout does not remove the latency spike (1); SQS
    FIFO does not warm functions (2).
  ref: 'concepts.md#reasoning-from-requirements-to-an-aws-design'
- id: aws-reference-architectures-079
  difficulty: intermediate
  tags:
  - chat
  - ordering
  - dynamodb
  question: |
    How do you keep messages ordered within a single conversation in a DynamoDB-backed chat store?
  options:
  - Use a randomly generated UUID as the sort key for each message, relying on DynamoDB to internally order UUIDs chronologically within the partition so a query returns the conversation in send order
  - Store every message of the conversation inside one DynamoDB item as an appended list attribute, so a single GetItem returns the whole thread already in the order the elements were appended
  - Rely on Amazon SNS to reorder the messages on delivery, since its fan-out layer timestamps and re-sequences each published message so subscribers always receive a conversation in strict chronological order
  - Use PK = conversationId and SK = timestamp/sequence, so items are stored sorted within the conversation
    partition and a query returns them in order
  answer: 3
  explanation: |
    A composite key (PK=conversationId, SK=timestamp/sequence) keeps items sorted within the
    partition, so range queries return ordered messages. A random UUID SK loses ordering (0); one
    item hits the 400 KB cap (1); SNS does not reorder (2).
  ref: 'concepts.md#real-time-chat-and-notifications'
- id: aws-reference-architectures-080
  difficulty: intermediate
  tags:
  - url-shortener
  - analytics
  - async
  question: |
    Why send click-analytics events to Firehose/Kinesis -> S3 -> Athena rather than writing them
    synchronously in the redirect path?
  options:
  - Because Athena serves individual point reads faster than DynamoDB, so routing each click through S3 and querying it with Athena returns the single long-URL lookup with lower latency than a direct table read
  - Because DynamoDB is structurally unable to store click-analytics records, so the events must be streamed out to S3 where Athena can query them as the only durable home for that data
  - To keep the redirect path fast and available - analytics is processed asynchronously so a slow or
    failed analytics pipeline never adds latency to or blocks user redirects
  - Because HTTP 301 permanent redirects can only be generated after Athena has logged the corresponding click event, so the analytics query must run inline before each redirect is returned
  answer: 2
  explanation: |
    Decoupling analytics asynchronously protects the latency-critical, availability-critical
    redirect path. It is not about Athena's point-read speed (0), DynamoDB can store clicks (1), and
    redirects do not require Athena (3).
  ref: 'concepts.md#url-shortener-on-aws'
