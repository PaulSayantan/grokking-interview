  question: |
    You adopt DynamoDB Global Tables for active-active multi-region writes. What consistency
    reality must the design handle?
  options:
  - Cross-region replication is asynchronous (eventual), and concurrent writes to the same item in different
    regions are resolved last-writer-wins, so the app must tolerate replication lag and potential lost
    concurrent updates
  - Global Tables provide synchronous strong consistency across every region, so a read in any region always reflects the latest write and no conflict-handling logic is ever needed
  - Writes are silently blocked in all regions except a single designated primary, so the design is effectively active-passive and concurrent cross-region writes cannot occur
  - Global Tables replicate items between regions by routing every write through an internal SQS FIFO queue, which you must provision and manage for cross-region delivery
  answer: 0
  explanation: |
