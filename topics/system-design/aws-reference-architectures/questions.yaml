  answer: 0
  explanation: |
    Matching access frequency to storage class via lifecycle rules (Standard -> IA/Intelligent-
    Tiering -> Glacier tiers) minimizes cost while meeting retention. All-Standard wastes money on
    cold data (1); day-one Deep Archive breaks the heavy 30-day query need (retrieval latency/cost)
    (2); deleting violates the 7-year compliance requirement (3).
  ref: 'concepts.md#cost-estimation-and-back-of-envelope'
- id: aws-reference-architectures-071
