- id: aws-reference-architectures-063
  difficulty: expert
  tags:
  - kinesis
  - hot-shard
  - partition-key
  question: |
    A Kinesis stream is provisioned for the aggregate throughput, yet one shard is throttling
    (ProvisionedThroughputExceeded) while others sit idle. What is the root cause and fix?
  options:
  - The stream has too many registered consumers competing for reads; remove several of them so the remaining consumers stop overloading that one shard
  - A skewed partition key routes most records to one shard (hot shard); choose a higher-cardinality/evenly-distributed
    partition key (or use enhanced fan-out for consumer-side limits) so records spread across shards
  - The Kinesis retention window is set too long, so old records pile up on that shard; shorten retention to free the shard's ingest capacity
  - The individual records exceed the 400 KB per-record ceiling and are being rejected on that shard; compress each record below 400 KB to clear the throttling
  answer: 1
  explanation: |
    A hot shard comes from a low-cardinality/skewed partition key concentrating records on one
    shard; fix the key to distribute evenly. Consumer count and retention do not cause ingest hot
    shards (0,2); the Kinesis record limit is 1 MB not 400 KB (3).
