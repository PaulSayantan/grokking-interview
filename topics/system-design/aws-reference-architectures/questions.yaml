  ref: 'concepts.md#analytics-pipeline'
- id: aws-reference-architectures-048
  difficulty: advanced
  tags:
  - resilience
  - multi-region
  - rto-rpo
  - tradeoff
  question: |
    A payments service requires an RTO of minutes and near-zero RPO across a full region outage.
    Which strategy fits and what is the cost?
  options:
  - Backup and restore across regions, which is the cheapest option and still meets a minutes-level RTO because restoring snapshots into a fresh region completes almost instantly
  - Pilot light, which keeps a minimal core running in a second region and therefore delivers near-zero RPO with essentially no added standing infrastructure cost
  - Active-active or warm standby using DynamoDB Global Tables / Aurora Global Database with Route 53
    failover, accepting higher cost and the complexity of cross-region replication and conflict resolution
  - Single-region with multi-AZ, which already survives a full region loss because the standby Availability Zones sit far enough apart to absorb the entire region's failure
  answer: 2
  explanation: |
    Minutes RTO / near-zero RPO across a region loss requires warm standby or active-active with
    cross-region data replication (Global Tables/Global DB) and Route 53 failover - more cost and
    complexity (conflict resolution). Backup-restore is hours-level (0); pilot light is not
    zero-RPO/free (1); multi-AZ does not survive a full region outage (3).
  ref: 'concepts.md#failure-modes-and-resilience'
- id: aws-reference-architectures-049
  difficulty: advanced
  tags:
  - resilience
  - cell-based
  - shuffle-sharding
  question: |
    What problem does a cell-based (with shuffle-sharding) architecture primarily solve?
  options:
  - It eliminates the need for multi-AZ deployment, because partitioning users into independent cells already spreads them across Availability Zones and provides equivalent redundancy
  - It guarantees strong consistency across all cells by keeping every cell's data synchronously replicated to the others so any cell can serve an up-to-date read
  - It contains blast radius by partitioning users into independent cells so a failure or poison workload
    affects only a small fraction of customers, not everyone
  - It reduces storage cost by deduplicating data across cells, since each cell stores only the unique records and references shared blocks held once in a common pool
  answer: 2
  explanation: |
    Cell-based architecture plus shuffle-sharding isolates failures to a small subset of users
    (blast-radius containment), a core Builders' Library resilience pattern. It does not replace
    multi-AZ (0), is unrelated to global consistency (1), and is not a storage-dedup technique (3).
  ref: 'concepts.md#failure-modes-and-resilience'
- id: aws-reference-architectures-050
  difficulty: advanced
  tags:
  - streaming
  - cost
  - egress
  question: |
    For a global video-streaming service, which lever most reduces cost, and why?
  options:
  - Raising the CloudFront cache-hit ratio and right-sizing the rendition ladder, because internet egress
    dominates streaming cost and cache hits/appropriate bitrates cut the bytes shipped from origin
  - Switching the control-plane Lambda functions from 512 MB to 256 MB, since halving their memory allocation is where the bulk of a streaming service's monthly bill is actually spent
  - Moving the small catalog metadata table in DynamoDB from on-demand to provisioned capacity, because catalog-table RCUs dominate the cost of delivering video globally
  - Using SQS FIFO instead of Standard queues for the transcode ingest jobs, since the per-message queuing charge is the single largest line item for a streaming platform
  answer: 0
  explanation: |
    Egress is the dominant streaming cost, so higher cache-hit ratio (fewer origin fetches, more
    edge serving) and a sensible rendition ladder (don't ship 4K to phones) are the biggest
    savings. Control-plane compute/DB/queue tweaks (1,2,3) are negligible against egress.
  ref: 'concepts.md#cost-estimation-and-back-of-envelope'
- id: aws-reference-architectures-051
  difficulty: advanced
  tags:
  - step-functions
  - express
  - standard
  - tradeoff
  question: |
    You must run a very high volume of short-lived workflows (millions/day, each a few seconds).
    Which Step Functions type fits and why?
  options:
  - Express workflows, which are optimized for high-volume, short-duration (up to 5 minutes) executions
    with at-least-once semantics and lower cost per run
  - Standard workflows, because their support for executions lasting up to one year and exactly-once semantics is what high-volume, few-second workflows fundamentally require
  - Neither type fits; instead run all the steps inside a single long-lived Lambda function with an internal loop, since that scales to millions of short executions per day more cheaply
  - Standard workflows, because Express workflows cannot be triggered by events such as API calls or EventBridge rules and can only be started manually from the console
  answer: 0
  explanation: |
    Express workflows target high-volume, short (<=5 min) executions with at-least-once semantics
    and cheaper high-throughput pricing. Standard suits long-running (up to 1 year) exactly-once
    sagas with full history - overkill/pricey for millions of tiny runs (1,3); a Lambda loop loses
    orchestration benefits (2).
  ref: 'concepts.md#service-limits-and-quotas-that-shape-designs'
- id: aws-reference-architectures-052
  difficulty: advanced
  tags:
  - dynamodb
  - dax
  - elasticache
  - tradeoff
  question: |
    A read-heavy service on DynamoDB needs sub-millisecond reads on hot keys. When is DAX the
    right cache versus ElastiCache?
  options:
  - ElastiCache is always the better choice because it is more general-purpose, and its Redis engine delivers lower DynamoDB read latency than DAX while needing no code changes
  - DAX is a general-purpose cache that transparently fronts any data store (RDS, Aurora, OpenSearch, arbitrary APIs), so it fully replaces ElastiCache for every caching need
  - DAX only works as a write-through cache in front of Aurora and RDS, not DynamoDB, so a DynamoDB-backed service must reach for ElastiCache instead
  - DAX is a DynamoDB-specific, API-compatible write-through/read cache requiring minimal app changes;
    choose ElastiCache when you need a general-purpose cache (arbitrary data, pub/sub, sorted sets) or
    caching in front of non-DynamoDB sources
  answer: 3
  explanation: |
    DAX is purpose-built for DynamoDB (API-compatible, minimal code change), ideal for
    microsecond DynamoDB reads; ElastiCache is general-purpose (any data, Redis structures/pub-sub)
    or for non-DynamoDB sources. DAX is DynamoDB-only, not a universal cache (0,1,2).
  ref: 'concepts.md#trade-offs-and-when-to-use-what'
- id: aws-reference-architectures-053
  difficulty: advanced
  tags:
  - dynamodb
  - consistency
  - cost
  question: |
    What is the trade-off of requesting strongly consistent reads on a DynamoDB base table versus
    eventually consistent reads?
  options:
  - Strongly consistent reads are both cheaper and faster, consuming half the RCUs of eventual reads while being served from the nearest replica for the lowest possible latency
  - Eventually consistent reads cost about 2x the RCUs of strong reads but in exchange are guaranteed to never return stale data because they poll every replica before answering
  - Strongly consistent reads cost about 2x the RCU, are served from the leader (slightly higher latency
    and no cross-AZ read scaling), while eventually consistent reads are cheaper and lower-latency but
    may briefly return stale data
  - There is no cost or latency difference between the two read modes; they consume identical RCUs and the only thing that differs is the durability of the underlying stored data
  answer: 2
  explanation: |
    Strong reads consume ~2x RCU and hit the leader replica (higher latency, less read spreading);
    eventual reads are cheaper/faster but can be briefly stale. Option 0 reverses the economics, 2
    misstates eventual reads, and 3 denies the real cost/latency difference.
  ref: 'concepts.md#trade-offs-and-when-to-use-what'
- id: aws-reference-architectures-054
  difficulty: advanced
  tags:
  - feed
  - kinesis
  - sqs
  - ordering
  - tradeoff
  question: |
    For the async fan-out of a social feed that also feeds a ranking/analytics pipeline and needs
    ordered, replayable events with multiple consumers, which is the better backbone?
  options:
  - SQS Standard, because its near-unlimited throughput also preserves strict event ordering and lets several independent consumers each replay the same messages from the queue
  - Kinesis Data Streams, which offers per-shard ordering, replay, and multiple independent consumers
    reading the same events (fan-out + analytics), sized by shard count
  - SQS FIFO, because any ordering requirement forces FIFO regardless of throughput, and its message groups also let multiple consumers independently replay the ordered history
  - SNS alone, since its pub/sub fan-out replaces the need for a stream and inherently provides ordered, replayable delivery that each subscriber can re-read on demand
  answer: 1
  explanation: |
    When you need ordering, replay, and multiple consumers off the same events, Kinesis is the fit
    (size by shards; enhanced fan-out gives each consumer 2 MB/s). SQS Standard lacks
    ordering/replay/multi-consumer replay (0); SQS FIFO's 300 TPS cap may not carry feed volume (2);
    SNS pub/sub is not a replayable ordered stream (3).
  ref: 'concepts.md#social-feed-with-fan-out'
- id: aws-reference-architectures-055
  difficulty: advanced
  tags:
  - lambda
  - concurrency
  - limits
  question: |
    A downstream relational database can only handle 200 concurrent connections, but a spike drives
    thousands of concurrent Lambda invocations that each open a connection. What is the correct
    mitigation?
  options:
  - Raise the Lambda memory allocation to shorten each invocation's duration, on the theory that faster functions release their database connections before the pool is ever exhausted
  - Immediately migrate the relational database to DynamoDB, since a NoSQL store has no fixed connection ceiling and therefore removes the constraint entirely with no other change
  - Increase the API Gateway integration timeout to its 29-second maximum so slow requests wait rather than piling up new database connections during the traffic spike
  - Set reserved concurrency on the Lambda (and/or use RDS Proxy to pool connections) so the number of
    simultaneous DB connections stays within the database's limit
  answer: 3
  explanation: |
    Reserved concurrency caps simultaneous Lambdas, and RDS Proxy pools/reuses connections,
    protecting a connection-limited database. More memory shortens duration but does not cap
    connections (0); swapping databases is a heavy overreaction (1); the API timeout is unrelated
    (2).
  ref: 'concepts.md#service-limits-and-quotas-that-shape-designs'
