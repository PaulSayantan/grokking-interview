    rare ad-hoc scans (2); EMR is overkill for SQL BI (3).
  ref: 'concepts.md#analytics-pipeline'
- id: aws-reference-architectures-047
  difficulty: advanced
  tags:
  - analytics
  - kinesis
  - msk
  - tradeoff
  question: |
    When would you choose Amazon MSK (managed Kafka) over Kinesis Data Streams for ingestion?
  options:
  - When you want the least operational overhead and shard-based simplicity, since MSK is fully serverless with no brokers to size while Kinesis forces you to run your own cluster
  - When you need the ability to replay past records from the log, a capability that only MSK provides while Kinesis discards each record the moment it is read
  - When you need the Kafka ecosystem/compatibility (Connect, existing Kafka apps), very high throughput,
