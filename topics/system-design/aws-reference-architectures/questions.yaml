topic: 'End-to-End AWS Reference Architectures: Designing Real Systems'
domain: system-design
topic_slug: aws-reference-architectures
version: 1
questions:
- id: aws-reference-architectures-001
  difficulty: beginner
  tags:
  - requirements
  - method
  - estimation
  question: |
    In an AWS system-design interview, what should you do BEFORE naming any services?
  options:
  - Draw the VPC subnet layout across three Availability Zones
  - Translate requirements into numbers (QPS, read/write split, latency budget, durability, consistency)
    and identify the forcing constraints
  - Pick DynamoDB because it scales infinitely
  - Estimate the monthly bill to the nearest dollar
  answer: 1
  explanation: |
    The strong method is requirements -> numbers -> constraints -> data model -> compute ->
    integration -> cross-cutting concerns. Jumping to a service (2) or a VPC layout (0) before
    understanding the workload is the classic failure mode. Precise costing (3) comes later and
    depends on the design.
  ref: 'concepts.md#reasoning-from-requirements-to-an-aws-design'
- id: aws-reference-architectures-002
  difficulty: beginner
  tags:
  - serverless
  - defaults
  question: |
    Why is a "serverless-first" posture a reasonable default for most greenfield interview prompts?
  options:
  - Serverless is always cheaper than any container fleet at any scale
  - Lambda has no execution time or memory limits
  - Serverless services are the only ones that are multi-AZ
  - It minimizes operational burden and scales to zero, letting you focus on the design and then justify
    moving off it when a constraint (duration, throughput, latency, control) demands
  answer: 3
  explanation: |
    Serverless-first minimizes ops and scales to zero, a sensible default you then refine.
    It is NOT always cheapest (at high steady throughput a fleet wins) (0), Lambda has hard
    limits (15 min / 10 GB) (1), and many non-serverless services are multi-AZ too (2).
  ref: 'concepts.md#reasoning-from-requirements-to-an-aws-design'
- id: aws-reference-architectures-003
  difficulty: beginner
  tags:
  - url-shortener
  - dynamodb
  question: |
    For a URL shortener's short-code -> long-URL mapping served at very high read rates with
    pure key lookups, which store is the most appropriate default?
  options:
  - Amazon Aurora with read replicas
  - Amazon S3 with one object per code
  - Amazon OpenSearch
  - Amazon DynamoDB
  answer: 3
  explanation: |
    Pure key lookups with no joins at massive scale is DynamoDB's sweet spot (single-digit-ms,
    horizontal scale, low ops). Aurora adds connection/scaling pain for no benefit (0); S3 is
    for blobs not high-TPS point reads of tiny records (1); OpenSearch is a search engine, not a
    system of record (2).
  ref: 'concepts.md#url-shortener-on-aws'
- id: aws-reference-architectures-004
  difficulty: beginner
  tags:
  - url-shortener
  - redirect
  - caching
  question: |
    Why put CloudFront in front of the URL shortener's redirect endpoint?
  options:
  - It transcodes the redirect response into multiple formats
  - It provides strong consistency for DynamoDB reads
  - It caches cacheable redirects at the edge so most repeat clicks never reach your origin, cutting latency
    and origin load
  - It is required for DynamoDB to be multi-AZ
  answer: 2
  explanation: |
    CloudFront caches at the edge; a cacheable (301) redirect served from the edge skips your
    API/Lambda/DynamoDB entirely. It does not transcode redirects (0), has nothing to do with
    DynamoDB consistency (1), and DynamoDB is multi-AZ on its own (3).
  ref: 'concepts.md#url-shortener-on-aws'
- id: aws-reference-architectures-005
  difficulty: beginner
  tags:
  - upload
  - s3
  - presigned
  question: |
    Why do image/video upload designs hand the client an S3 presigned URL instead of routing
    bytes through API Gateway and Lambda?
  options:
  - Presigned URLs encrypt the file automatically with the client's password
  - S3 cannot receive uploads any other way
  - API Gateway and Lambda payload limits (10 MB / 6 MB) make them unsuitable for large files, and direct-to-S3
    upload keeps big bytes off your compute path
  - It makes the upload synchronous so the client waits for processing
  answer: 2
  explanation: |
    Presigned URLs let the client PUT directly to S3, bypassing API Gateway's 10 MB and Lambda's
    6 MB sync payload caps. It does not add password encryption (0), S3 accepts many upload paths
    (1), and the whole point is to decouple, not to block the client on processing (3).
  ref: 'concepts.md#image-and-video-upload-and-processing'
- id: aws-reference-architectures-006
  difficulty: beginner
  tags:
  - streaming
  - cloudfront
  - cost
  question: |
    In a Netflix-style VOD design, why should you never serve video segments directly from S3
    to viewers?
  options:
  - S3 cannot store video files
  - S3 objects expire after 24 hours
  - S3 does not support the HLS format
  - You would pay full egress per view, overload the origin, and add latency; CloudFront caches segments
    at the edge for millions of viewers
  answer: 3
  explanation: |
    Video is extremely cache-friendly; CloudFront serves the same segments to millions from the
    edge, protecting the origin and slashing egress cost/latency. S3 stores any object including
    HLS segments and objects do not auto-expire (0,1,2).
  ref: 'concepts.md#video-streaming-platform-netflix-style'
- id: aws-reference-architectures-007
  difficulty: beginner
  tags:
  - chat
  - websocket
  question: |
    Which AWS service most directly provides managed, serverless bi-directional WebSocket
    connections for a chat app without running connection servers?
  options:
  - API Gateway WebSocket API
  - Amazon SQS
  - Amazon CloudFront
  - AWS Step Functions
  answer: 0
  explanation: |
    API Gateway WebSocket APIs manage persistent connections and give you a connectionId to push
    with postToConnection, with no servers to run. SQS is a queue (1), CloudFront is a CDN (2),
    Step Functions is workflow orchestration (3).
  ref: 'concepts.md#real-time-chat-and-notifications'
- id: aws-reference-architectures-008
  difficulty: beginner
  tags:
  - analytics
  - athena
  - s3
  question: |
    In an S3 data lake, which service lets you run ad-hoc SQL directly over files with no
    cluster to manage, billed by data scanned?
  options:
  - Amazon EMR
  - Amazon RDS
  - Amazon Athena
  - AWS Glue crawler
  answer: 2
  explanation: |
    Athena is serverless SQL over S3, priced per TB scanned. EMR requires provisioning
    Spark/Hadoop clusters (0), RDS is a relational DB not a lake query engine (1), and a Glue
    crawler catalogs schema rather than answering queries (3).
  ref: 'concepts.md#analytics-pipeline'
- id: aws-reference-architectures-009
  difficulty: beginner
  tags:
  - messaging
  - sqs
  - sns
  question: |
    What is the core difference between SQS and SNS?
  options:
  - SQS is a pub/sub broadcast service; SNS is a point-to-point queue
  - SQS is a queue consumers pull work from; SNS is pub/sub that pushes each message to all subscribers
  - They are identical; SNS is just the newer name for SQS
  - SQS is only for FIFO ordering; SNS is only for streaming video
  answer: 1
  explanation: |
    SQS is a durable queue that decouples producers/consumers (pull); SNS is pub/sub that
    fans a message out to all subscribers (push). Option 0 reverses them, they are not the same
    (2), and neither is a video service (3).
  ref: 'concepts.md#trade-offs-and-when-to-use-what'
- id: aws-reference-architectures-010
  difficulty: beginner
  tags:
  - resilience
  - multi-az
  question: |
    What is the baseline resilience posture assumed for a well-architected AWS design?
  options:
  - Single-AZ to minimize cost, adding AZs only after an outage
  - Multi-region active-active for every workload regardless of RTO/RPO
  - One large EC2 instance sized for peak
  - Multi-AZ by default (DynamoDB, S3, Aurora Multi-AZ, load balancers and Auto Scaling spread across
    AZs)
  answer: 3
  explanation: |
    Multi-AZ is table stakes and mostly free architecturally. Single-AZ is a needless SPOF (0);
    multi-region active-active is expensive and complex, justified only by strict RTO/RPO (1);
    one big instance is a SPOF and does not scale (2).
  ref: 'concepts.md#failure-modes-and-resilience'
- id: aws-reference-architectures-011
  difficulty: beginner
  tags:
  - s3
  - consistency
  question: |
    What is S3's read-after-write consistency behavior for object operations today?
  options:
  - Eventually consistent for all reads, with possible stale reads for seconds
  - Strong only within a single AZ
  - Strong only if you enable a paid consistency add-on
  - Strongly consistent read-after-write for GET/PUT/LIST since December 2020
  answer: 3
  explanation: |
    Since Dec 2020, S3 provides strong read-after-write consistency for all operations, no add-on
    needed. The old eventual-consistency caveat (0) no longer applies, and consistency is not
    AZ-scoped or a paid feature (1,2).
  ref: 'concepts.md#service-limits-and-quotas-that-shape-designs'
- id: aws-reference-architectures-012
  difficulty: beginner
  tags:
  - lambda
  - limits
  question: |
    What is the maximum execution duration of a single AWS Lambda invocation?
  options:
  - 15 minutes
  - 30 seconds
  - 5 minutes
  - 1 hour
  answer: 0
  explanation: |
    Lambda caps a single invocation at 15 minutes. Beyond that you use Fargate, Step Functions,
    Batch, or a job service like MediaConvert. 30 s and 5 min are other services' limits (API
    Gateway timeout, Step Functions Express) (1,2); there is no 1-hour Lambda (3).
  ref: 'concepts.md#service-limits-and-quotas-that-shape-designs'
- id: aws-reference-architectures-013
  difficulty: beginner
  tags:
  - dynamodb
  - limits
  question: |
    What is the maximum size of a single DynamoDB item?
  options:
  - 64 KB
  - 1 MB
  - 16 MB
  - 400 KB
  answer: 3
  explanation: |
    A DynamoDB item is capped at 400 KB including attribute names and values. Larger blobs go to
    S3 with a pointer stored in the item. 1 MB is the Kinesis record / DynamoDB query-page size,
    not the item cap (1).
  ref: 'concepts.md#service-limits-and-quotas-that-shape-designs'
- id: aws-reference-architectures-014
  difficulty: beginner
  tags:
  - video
  - mediaconvert
  question: |
    Which AWS service is purpose-built to transcode uploaded VOD files into adaptive-bitrate
    HLS/DASH renditions?
  options:
  - AWS Lambda with FFmpeg
  - Amazon CloudFront
  - AWS Elemental MediaConvert
  - Amazon Kinesis Video Streams
  answer: 2
  explanation: |
    MediaConvert is the file-based transcoding service producing ABR HLS/DASH, handling long
    files and many codecs. Lambda+FFmpeg cannot transcode a long 4K film within 15 min / memory
    limits (0); CloudFront delivers, it does not transcode (1); Kinesis Video is for ingesting
    live device streams (3).
  ref: 'concepts.md#image-and-video-upload-and-processing'
- id: aws-reference-architectures-015
  difficulty: intermediate
  tags:
  - url-shortener
  - redirect
  - tradeoff
  question: |
    A URL shortener team wants edge-cached redirects for lowest latency but also wants per-click
    analytics. What is the fundamental trade-off between using 301 vs 302?
  options:
  - 301 and 302 behave identically for caching; the choice is cosmetic
  - 302 is cached forever while 301 is never cached
  - 301 is aggressively cached by browsers/CDNs (great latency, but repeat clicks skip your origin so
    you lose per-click counts); 302 is not cached, so every click reaches your origin for analytics but
    costs latency and invocations
  - Only 200 responses can be cached, so neither works
  answer: 2
  explanation: |
    301 (permanent) is cached aggressively so repeat clicks bypass your origin, losing analytics;
    302 forces every click to origin so you can log it but pays latency/compute each time. Option
    2 reverses them, they are not identical (0), and redirects are cacheable unlike the claim in
    3.
  ref: 'concepts.md#url-shortener-on-aws'
- id: aws-reference-architectures-016
  difficulty: intermediate
  tags:
  - url-shortener
  - hot-partition
  question: |
    A single shortened link goes viral and reads spike enormously on one DynamoDB partition key.
    What is the BEST first mitigation?
  options:
  - Increase provisioned WCU on the table
  - Split the long URL into two DynamoDB items
  - Serve the hot key from a cache layer (CloudFront edge and/or DAX) so most reads never hit the partition
  - Switch the table from DynamoDB to Aurora
  answer: 2
  explanation: |
    A hot READ partition is best solved with caching (CloudFront at the edge, DAX for sub-ms
    DynamoDB caching) so the partition sees a fraction of traffic. More WCU addresses writes not
    reads (0); splitting the item does nothing for read concentration (1); Aurora would be worse
    for a hot key (3).
  ref: 'concepts.md#url-shortener-on-aws'
- id: aws-reference-architectures-017
  difficulty: intermediate
  tags:
  - upload
  - s3-events
  - sqs
  - eventbridge
  question: |
    An image-processing pipeline faces huge, bursty upload spikes and you want durable buffering,
    retries, and a dead-letter path before Lambda processes each object. Which S3-event target
    fits best?
  options:
  - S3 -> SNS -> email
  - S3 -> SQS -> Lambda
  - S3 -> Lambda directly with no buffer
  - S3 -> CloudFront
  answer: 1
  explanation: |
    Routing S3 events into SQS gives durable buffering, backpressure, per-message retries, and a
    DLQ, smoothing bursts before Lambda. Direct S3->Lambda (2) can blow Lambda concurrency during
    spikes; SNS->email is a notification not a work buffer (0); CloudFront is delivery (3).
  ref: 'concepts.md#image-and-video-upload-and-processing'
- id: aws-reference-architectures-018
  difficulty: intermediate
  tags:
  - upload
  - lambda
  - mediaconvert
  - tradeoff
  question: |
    You process both small user thumbnails and full 2-hour 4K movie transcodes. What is the right
    split?
  options:
  - Use Lambda for thumbnails/short clips and MediaConvert for the long 4K transcodes that exceed Lambda's
    time/memory limits
  - Use Lambda for everything to keep it serverless and simple
  - Use MediaConvert for everything including thumbnails
  - Use EC2 with FFmpeg for both to maximize control
  answer: 0
  explanation: |
    Lambda is fast/cheap for images and short clips but a 2-hour 4K transcode exceeds its 15-min /
    10 GB limits; MediaConvert is built for long file-based transcode. All-Lambda fails on big
    files (1); MediaConvert for tiny thumbnails is overkill/slower to trigger (2); EC2+FFmpeg adds
    ops for no benefit over the managed split (3).
  ref: 'concepts.md#image-and-video-upload-and-processing'
- id: aws-reference-architectures-019
  difficulty: intermediate
  tags:
  - streaming
  - abr
  question: |
    How does adaptive bitrate streaming (ABR) improve the viewer experience?
  options:
  - MediaConvert produces multiple renditions plus a manifest; the player measures bandwidth and switches
    rendition per small segment, so startup is fast and playback adapts to network changes
  - It stores the whole movie in a single high-bitrate file the player downloads fully first
  - It uses UDP multicast from S3 to all viewers simultaneously
  - It transcodes on the fly per viewer inside CloudFront
  answer: 0
  explanation: |
    ABR pre-encodes several renditions and segments; the player picks per-segment based on
    measured bandwidth, enabling fast start and smooth adaptation. It does not require full
    download (1), S3 is not multicast (2), and CloudFront caches pre-made segments rather than
    transcoding per viewer (3).
  ref: 'concepts.md#video-streaming-platform-netflix-style'
- id: aws-reference-architectures-020
  difficulty: intermediate
  tags:
  - streaming
  - origin-shield
  - tradeoff
  question: |
    What does enabling CloudFront Origin Shield buy a large VOD catalog, and what is the cost?
  options:
  - It encrypts segments end-to-end; cost is CPU on the player
  - It adds a centralized mid-tier cache that collapses origin requests and raises cache-hit ratio for
    long-tail content; cost is a small added latency/fee on shielded requests
  - It removes the need for a rendition ladder; cost is higher storage
  - It converts HLS to DASH automatically; cost is licensing
  answer: 1
  explanation: |
    Origin Shield is a mid-tier cache in front of the origin that collapses requests from many
    edge locations, improving hit ratio for long-tail catalogs at the price of a small extra
    latency/cost per shielded fetch. It is not an encryption, ladder, or format-conversion feature
    (0,2,3).
  ref: 'concepts.md#video-streaming-platform-netflix-style'
- id: aws-reference-architectures-021
  difficulty: intermediate
  tags:
  - chat
  - dynamodb
  - ttl
  question: |
    In a WebSocket chat app, why store connectionIds in a DynamoDB table with a TTL?
  options:
  - TTL encrypts the connection
  - DynamoDB TTL guarantees messages are delivered exactly once
  - It maps users to active connections for pushing messages, and TTL auto-expires stale entries left
    by dropped connections
  - It is required to make API Gateway WebSocket work
  answer: 2
  explanation: |
    You need a registry from user/room to connectionId to push with postToConnection; TTL cleans
    up stale connections (idle timeout 10 min, max 2 h). TTL is not encryption (0), not a delivery
    guarantee (1), and not strictly required by the WebSocket API (3).
  ref: 'concepts.md#real-time-chat-and-notifications'
- id: aws-reference-architectures-022
  difficulty: intermediate
  tags:
  - chat
  - websocket
  - limits
  question: |
    An API Gateway WebSocket connection has a 10-minute idle timeout and a 2-hour maximum
    duration. What must the design account for?
  options:
  - Nothing; connections last forever once established
  - Clients must send periodic keepalives and transparently reconnect (re-registering their connectionId)
    because connections will be dropped
  - You must switch to SQS FIFO to keep connections alive
  - You must disable multi-AZ to keep the connection stable
  answer: 1
  explanation: |
    Because connections drop on idle (10 min) or after 2 h max, clients need keepalives and
    reconnect-and-reregister logic; the connectionId changes on reconnect. Connections are not
    permanent (0), SQS/FIFO and multi-AZ toggling are unrelated (2,3).
  ref: 'concepts.md#real-time-chat-and-notifications'
- id: aws-reference-architectures-023
  difficulty: intermediate
  tags:
  - ecommerce
  - saga
  - step-functions
  question: |
    Why use the saga pattern for a checkout that spans inventory, payment, and order services
    instead of a distributed ACID transaction?
  options:
  - Because DynamoDB does not support any transactions
  - Because sagas are always faster than any single transaction
  - Because you cannot hold a two-phase-commit lock across independent services/data stores; a saga runs
    local transactions each with a compensating action to undo on failure
  - Because payment providers require XA transactions
  answer: 2
  explanation: |
    Distributed 2PC across heterogeneous services is impractical/unavailable; a saga sequences
    local transactions with compensations (release inventory, refund) to preserve consistency.
    DynamoDB does support transactions within its scope (0); sagas are about correctness across
    services, not raw speed (1); external payment APIs are not XA (3).
  ref: 'concepts.md#e-commerce-and-order-systems-with-sagas'
- id: aws-reference-architectures-024
  difficulty: intermediate
  tags:
  - ecommerce
  - orchestration
  - choreography
  - tradeoff
  question: |
    What is the trade-off between Step Functions (orchestration) and EventBridge-driven
    choreography for a checkout saga?
  options:
  - Orchestration is always worse because it centralizes state
  - Choreography guarantees exactly-once delivery while orchestration does not
  - They are interchangeable with identical operational characteristics
  - Orchestration gives a central state machine with visible flow, built-in retries/timeouts and easy
    compensations (good for complex multi-step checkout); choreography is loosely coupled with no coordinator
    but the flow is emergent and harder to debug
  answer: 3
  explanation: |
    Orchestration centralizes and makes the multi-step transaction observable with managed
    retries/compensations; choreography decouples services but the end-to-end flow is emergent and
    harder to trace. Neither is universally worse (0), delivery semantics are not the distinction
    (1), and they are not interchangeable (2).
  ref: 'concepts.md#e-commerce-and-order-systems-with-sagas'
- id: aws-reference-architectures-025
  difficulty: intermediate
  tags:
  - ecommerce
  - aurora
  - dynamodb
  - tradeoff
  question: |
    For the authoritative order/ledger table in an e-commerce system, which choice and rationale
    is strongest?
  options:
  - DynamoDB, because it is the only store that is durable
  - S3, because orders are just blobs
  - ElastiCache, because orders must be read in sub-ms
  - Aurora, when you need rich relational queries, multi-row ACID, and financial reporting and the team
    knows SQL, accepting its connection and write-scaling ceiling
  answer: 3
  explanation: |
    Orders often land on a relational store for ACID integrity, joins, and reporting - Aurora fits,
    with the caveat of connection limits and vertical write scaling. DynamoDB is also durable and
    valid for key access but the rationale in 0 is wrong; S3 and ElastiCache are inappropriate as a
    system of record for orders (1,2).
  ref: 'concepts.md#e-commerce-and-order-systems-with-sagas'
- id: aws-reference-architectures-026
  difficulty: intermediate
  tags:
  - feed
  - fan-out
  - tradeoff
  question: |
    In a social feed, what is the trade-off between fan-out-on-write (push) and fan-out-on-read
    (pull)?
  options:
  - Push precomputes each follower's timeline so reads are cheap but a high-follower post causes massive
    write amplification; pull stores posts once (cheap writes) but reads must gather and merge from everyone
    you follow (expensive reads)
  - Push makes reads expensive; pull makes writes expensive
  - They both optimize reads and writes equally with no downside
  - Pull is always used because it scales infinitely
  answer: 0
  explanation: |
    Push optimizes the dominant read at the cost of write amplification (a celebrity fan-out);
    pull optimizes writes at the cost of read-time merge. Option 1 reverses the costs; neither is
    free (2); real systems use a hybrid, not pull-only (3).
  ref: 'concepts.md#social-feed-with-fan-out'
- id: aws-reference-architectures-027
  difficulty: intermediate
  tags:
  - feed
  - celebrity
  - hybrid
  question: |
    A social platform has both normal users and celebrities with tens of millions of followers.
    What is the standard fan-out approach?
  options:
  - Fan-out-on-write for everyone, accepting tens of millions of writes per celebrity post
  - Fan-out-on-read for everyone to keep writes cheap
  - Store every post in ElastiCache only and never persist to DynamoDB
  - 'Hybrid: push for normal users, but for high-fan-out accounts skip the push and have followers pull
    those posts at read time, merging them into the pushed timeline'
  answer: 3
  explanation: |
    The canonical answer is a hybrid: push for typical users, pull-and-merge for celebrities to
    avoid write amplification. All-push melts down on celebrity posts (0); all-pull makes every
    read expensive (1); cache-only loses durability (2).
  ref: 'concepts.md#social-feed-with-fan-out'
- id: aws-reference-architectures-028
  difficulty: intermediate
  tags:
  - analytics
  - kinesis
  - sqs
  - tradeoff
  question: |
    Why choose Kinesis Data Streams over SQS for an analytics ingestion layer that feeds both a
    real-time dashboard and a batch pipeline?
  options:
  - SQS is cheaper so it is always the better analytics choice
  - SQS supports higher per-partition throughput than Kinesis
  - Kinesis cannot integrate with S3
  - Kinesis provides ordered, replayable records that multiple independent consumers can read from the
    same stream, whereas SQS is a work queue where a consumed message is removed and cannot be replayed
    by multiple consumers
  answer: 3
  explanation: |
    Kinesis is a stream: ordered per shard, replayable (up to 365 days), and multiple consumers
    can independently read it - ideal when the same events feed real-time and batch. SQS removes a
    message once processed, so it is not a multi-consumer replayable stream (0,1); Kinesis
    integrates with S3 via Firehose (2).
  ref: 'concepts.md#analytics-pipeline'
- id: aws-reference-architectures-029
  difficulty: intermediate
  tags:
  - analytics
  - parquet
  - cost
  question: |
    Why store data-lake files as partitioned Parquet rather than raw JSON for Athena/Redshift
    Spectrum queries?
  options:
  - Parquet files cannot be compressed, keeping them simple
  - Columnar, compressed, partitioned Parquet drastically reduces the bytes scanned per query, cutting
    Athena cost and speeding queries; raw JSON forces full scans and is expensive at scale
  - Athena only supports JSON, so Parquet is for archival
  - Parquet removes the need for a Glue Data Catalog
  answer: 1
  explanation: |
    Athena bills per TB scanned; columnar+compressed+partitioned Parquet lets it read only needed
    columns/partitions, saving money and time. Parquet is compressible (0), Athena supports many
    formats including Parquet (2), and you still catalog schema in Glue (3).
  ref: 'concepts.md#analytics-pipeline'
- id: aws-reference-architectures-030
  difficulty: intermediate
  tags:
  - api-gateway
  - async
  - limits
  question: |
    A synchronous API call could take up to several minutes to complete server-side. Given API
    Gateway's 29-second integration timeout, what is the correct pattern?
  options:
  - Increase the Lambda timeout to 15 minutes so the API returns when it finishes
  - Return 202 Accepted with a job id immediately, process asynchronously (SQS/Step Functions), and notify
    via WebSocket/SNS or let the client poll for status
  - Split the response into 29-second chunks streamed back over the same request
  - Use S3 presigned URLs to bypass the timeout
  answer: 1
  explanation: |
    Any operation that can exceed 29 s must go async: acknowledge with 202 + job id, process in the
    background, and notify or poll. Raising the Lambda timeout does not extend API Gateway's 29 s
    integration cap (0); chunking a single request does not evade it (2); presigned URLs solve
    payload size, not long-running processing (3).
  ref: 'concepts.md#service-limits-and-quotas-that-shape-designs'
- id: aws-reference-architectures-031
  difficulty: intermediate
  tags:
  - sqs
  - fifo
  - limits
  - tradeoff
  question: |
    You need strict per-account ordering and no duplicate processing for a ledger. What must you
    weigh when choosing SQS FIFO?
  options:
  - FIFO gives ordering and dedup within a group but is capped at 300 TPS (3000 with batching of 10);
    use it only where per-entity ordering truly matters, and consider partitioning by message group
  - FIFO has unlimited throughput, so there is no downside
  - FIFO cannot deduplicate messages
  - FIFO is only available in a single AZ
  answer: 0
  explanation: |
    SQS FIFO provides ordering + exactly-once-processing within the dedup window but is throughput-
    limited (300 TPS, 3000 batched), so reserve it for cases that genuinely need ordering. It is
    not unlimited (1), it does dedupe (2), and SQS is a regional multi-AZ service (3).
  ref: 'concepts.md#e-commerce-and-order-systems-with-sagas'
- id: aws-reference-architectures-032
  difficulty: intermediate
  tags:
  - compute
  - lambda
  - fargate
  - tradeoff
  question: |
    A workload runs at a constant 50,000 requests/second all day. What is the right way to reason
    about Lambda vs a Fargate/EC2 fleet?
  options:
  - Always use Lambda; it is cheapest at any scale
  - Always use EC2; Lambda cannot handle 50k rps
  - Cost is identical, so pick by personal preference
  - Compare per-request Lambda cost (GB-seconds + per-invoke) against a fleet's hourly cost at high utilization;
    at sustained high throughput a right-sized container/EC2 fleet is often cheaper, while Lambda still
    wins for spiky/low-duty-cycle traffic
  answer: 3
  explanation: |
    The crossover is real: Lambda excels for spiky/scale-to-zero load but at constant high
    throughput a well-utilized fleet is usually cheaper per request. Lambda is not universally
    cheapest (0), it can handle high rps with concurrency (1), and costs are not identical (2).
  ref: 'concepts.md#cost-estimation-and-back-of-envelope'
- id: aws-reference-architectures-033
  difficulty: intermediate
  tags:
  - dynamodb
  - capacity
  - cost
  - tradeoff
  question: |
    When is DynamoDB on-demand capacity the better choice over provisioned + auto scaling?
  options:
  - For steady, highly predictable traffic where you want the lowest possible cost
  - For unpredictable, spiky, or brand-new workloads where you cannot forecast capacity and want to avoid
    throttling without capacity planning
  - Only when the table is smaller than 400 KB
  - On-demand is always cheaper than provisioned
  answer: 1
  explanation: |
    On-demand suits spiky/unpredictable/new workloads (pay per request, no planning). For steady,
    predictable traffic, provisioned + auto scaling (or reserved capacity) is much cheaper (0), so
    on-demand is not always cheaper (3); 400 KB is the item cap, unrelated to capacity mode (2).
  ref: 'concepts.md#cost-estimation-and-back-of-envelope'
- id: aws-reference-architectures-034
  difficulty: intermediate
  tags:
  - chat
  - notifications
  - sns
  - pinpoint
  - tradeoff
  question: |
    For pushing notifications to offline mobile users, what distinguishes Amazon SNS from Amazon
    Pinpoint?
  options:
  - SNS cannot deliver mobile push; only Pinpoint can
  - Pinpoint is a queue and SNS is a database
  - SNS is simple, low-cost pub/sub with mobile push (APNs/FCM); Pinpoint adds user segments, campaigns,
    analytics, and multi-channel (push/SMS/email) at more setup cost
  - They are the same service with different pricing
  answer: 2
  explanation: |
    SNS handles simple pub/sub and mobile push cheaply; Pinpoint layers on segmentation, campaigns,
    analytics, and multi-channel messaging with more configuration. SNS does deliver mobile push
    (0); neither is a queue/database in that sense (1); they are distinct services (3).
  ref: 'concepts.md#real-time-chat-and-notifications'
- id: aws-reference-architectures-035
  difficulty: intermediate
  tags:
  - containers
  - ecs
  - eks
  - tradeoff
  question: |
    What is the primary trade-off between running microservices on ECS with Fargate versus EKS?
  options:
  - Fargate removes node management with per-task billing and is fastest to ship; EKS gives the Kubernetes
    ecosystem, portability, and fine control at the cost of more operational overhead
  - Fargate cannot run containers; EKS is the only option
  - EKS is serverless and Fargate requires managing servers
  - They are identical except EKS is cheaper in all cases
  answer: 0
  explanation: |
    Fargate abstracts away nodes (no cluster ops, per-task cost); EKS brings k8s power/portability
    but you operate more. Fargate does run containers (1); Fargate is the more serverless option,
    not EKS (2); they are not identical (3).
  ref: 'concepts.md#e-commerce-and-order-systems-with-sagas'
- id: aws-reference-architectures-036
  difficulty: intermediate
  tags:
  - messaging
  - sns-sqs
  - fan-out
  question: |
    Why is the "SNS -> multiple SQS queues" fan-out pattern common instead of SNS delivering
    directly to each consumer?
  options:
  - Each subscriber gets its own durable SQS queue for buffering, independent retry, and DLQ handling,
    so a slow or failed consumer does not lose messages or block others
  - It is required because SNS cannot have more than one subscriber
  - SQS is faster than SNS at broadcasting
  - It converts messages to FIFO automatically
  answer: 0
  explanation: |
    SNS->SQS gives each consumer a durable buffer with independent retries/DLQ and backpressure,
    decoupling consumer speed/availability. SNS supports many subscribers (1); the benefit is
    durability/decoupling, not broadcast speed (2); it does not auto-convert to FIFO (3).
  ref: 'concepts.md#trade-offs-and-when-to-use-what'
- id: aws-reference-architectures-037
  difficulty: intermediate
  tags:
  - resilience
  - dlq
  question: |
    Why attach a dead-letter queue (DLQ) and a max-receive limit to an SQS-driven Lambda consumer?
  options:
  - To increase throughput by processing messages twice
  - To guarantee exactly-once delivery
  - So a poison message that repeatedly fails is moved aside after N attempts instead of endlessly redriving
    and wedging the consumer
  - Because SQS requires a DLQ to function
  answer: 2
  explanation: |
    A DLQ + max-receive count isolates poison messages so one bad message does not loop forever
    and block the queue; you inspect/replay them later. It is not about doubling throughput (0) or
    exactly-once (1), and DLQs are optional (3).
  ref: 'concepts.md#failure-modes-and-resilience'
- id: aws-reference-architectures-038
  difficulty: intermediate
  tags:
  - kinesis
  - shard
  - limits
  question: |
    A Kinesis Data Streams producer needs 8 MB/s of ingest. How many shards at minimum, given a
    shard ingests 1 MB/s or 1000 records/s?
  options:
  - 8 shards
  - 1 shard
  - 2 shards
  - 80 shards
  answer: 0
  explanation: |
    Each shard ingests up to 1 MB/s, so 8 MB/s needs at least 8 shards (also check the 1000 rec/s
    limit per shard). One or two shards cannot carry 8 MB/s (1,2); 80 is 10x more than needed (3).
  ref: 'concepts.md#service-limits-and-quotas-that-shape-designs'
- id: aws-reference-architectures-039
  difficulty: intermediate
  tags:
  - claim-check
  - sqs
  - s3
  question: |
    A workflow must pass 5 MB payloads through SQS, but SQS messages are capped at 256 KB. What is
    the idiomatic pattern?
  options:
  - 'Claim-check: store the large payload in S3 and pass only a pointer (object key) through SQS; the
    consumer fetches it from S3'
  - Compress the payload to under 256 KB no matter what
  - Switch to SNS which has no size limit
  - Split into 20 separate SQS messages and reassemble
  answer: 0
  explanation: |
    The claim-check pattern puts the big payload in S3 and passes a reference through the message,
    dodging the 256 KB cap. Compression may not always fit (1); SNS shares similar limits (2);
    splitting/reassembling is fragile and ordering-sensitive (3).
  ref: 'concepts.md#failure-modes-and-resilience'
- id: aws-reference-architectures-040
  difficulty: intermediate
  tags:
  - streaming
  - protection
  - signed-urls
  question: |
    How do you enforce that only entitled users can fetch premium video segments from CloudFront?
  options:
  - Make the S3 bucket public and rely on obscure URLs
  - Use CloudFront signed URLs or signed cookies (and DRM for premium content) so only authorized, time-limited
    requests are served
  - Put the videos behind an API Gateway with a 29-second timeout
  - Encrypt the bucket with SSE-KMS, which blocks unauthorized viewers
  answer: 1
  explanation: |
    Signed URLs/cookies gate access with time-limited, authorized tokens; DRM adds content
    protection. Public buckets with obscure URLs are insecure (0); routing video through API GW is
    wrong (timeout, cost) (2); SSE-KMS encrypts at rest but does not authorize viewers fetching via
    CloudFront (3).
  ref: 'concepts.md#video-streaming-platform-netflix-style'
- id: aws-reference-architectures-041
  difficulty: advanced
  tags:
  - url-shortener
  - key-generation
  - hot-partition
  - tradeoff
  question: |
    For generating short codes at scale, compare a monotonic counter (Base62) versus random keys.
    What is the key trade-off?
  options:
  - Counters are collision-free and evenly distributed; random keys always collide
  - Random keys are shorter than counter-based codes for the same space
  - A monotonic counter gives compact sequential codes but can create a hot write partition unless sharded;
    random keys spread writes but require a conditional PutItem (attribute_not_exists) to detect and retry
    collisions
  - Counters require a GPU while random keys are free
  answer: 2
  explanation: |
    Counters produce compact, ordered codes but concentrate writes (hot partition) unless
    sharded; random keys distribute writes but need a conditional write to guard against
    collisions. Random keys can collide (0), are not inherently shorter (1), and neither needs a
    GPU (3).
  ref: 'concepts.md#url-shortener-on-aws'
- id: aws-reference-architectures-042
  difficulty: advanced
  tags:
  - dynamodb
  - consistency
  - gsi
  - tradeoff
  question: |
    A design reads immediately from a DynamoDB Global Secondary Index right after writing the base
    item and occasionally sees stale/missing results. What is the correct explanation and fix?
  options:
  - GSIs are updated asynchronously and are eventually consistent (you cannot request strongly consistent
    reads on a GSI); design for eventual consistency or read the base table by primary key when you need
    strong consistency
  - GSIs are strongly consistent; the bug must be elsewhere
  - Enable strong consistency on the GSI in the console
  - Increase the GSI's item size limit to 1 MB
  answer: 0
  explanation: |
    GSIs are maintained asynchronously and only support eventually consistent reads - a brief lag
    after a base write is expected. You cannot make a GSI strongly consistent (1,2); for strong
    reads use the base table's primary key. Item size cap is unrelated (3).
  ref: 'concepts.md#service-limits-and-quotas-that-shape-designs'
- id: aws-reference-architectures-043
  difficulty: advanced
  tags:
  - ecommerce
  - idempotency
  - exactly-once
  question: |
    SQS is at-least-once, so a payment-charge message may be delivered more than once. How do you
    prevent double-charging?
  options:
  - Switch to SNS, which delivers exactly once
  - Use an idempotency key per payment request and a conditional write (DynamoDB attribute_not_exists
    / transaction) so a retried message is recognized and not charged again
  - Increase the visibility timeout to 12 hours so retries never happen
  - Rely on the payment provider to silently ignore duplicates
  answer: 1
  explanation: |
    Idempotency keys plus a conditional/transactional write make repeated deliveries no-ops - the
    canonical exactly-once-effect pattern on at-least-once transport. SNS is not exactly-once (0);
    a long visibility timeout does not eliminate redelivery/duplicates and can delay recovery (2);
    assuming the provider dedupes is unsafe (3).
  ref: 'concepts.md#e-commerce-and-order-systems-with-sagas'
- id: aws-reference-architectures-044
  difficulty: advanced
  tags:
  - ecommerce
  - inventory
  - hot-partition
  - flash-sale
  question: |
    During a flash sale, one popular SKU's inventory row/partition becomes a contention hotspot.
    Which combination best addresses it?
  options:
  - Just add more read replicas
  - Use conditional atomic decrements, and either write-shard the counter (split the SKU's stock across
    N sub-keys and aggregate) or front the sale with a reservation queue to serialize/limit demand
  - Move the SKU to S3
  - Disable multi-AZ to reduce write latency
  answer: 1
  explanation: |
    Hot-key write contention is solved by atomic conditional decrements plus write-sharding the
    counter and/or a reservation queue to throttle and serialize demand. Read replicas do not help
    write contention (0); S3 is not for atomic counters (2); disabling multi-AZ harms durability
    and does not fix contention (3).
  ref: 'concepts.md#e-commerce-and-order-systems-with-sagas'
- id: aws-reference-architectures-045
  difficulty: advanced
  tags:
  - chat
  - scale
  - websocket
  - iot
  - tradeoff
  question: |
    You must support tens of millions of always-connected devices with pub/sub topics and the
    lowest per-connection cost. Which option is most appropriate and why?
  options:
  - AWS IoT Core (MQTT), which is purpose-built for very large numbers of persistent device connections
    and topic-based pub/sub, versus paying WebSocket per-connection-minute and message costs at that scale
  - API Gateway WebSocket API, because it is the only managed real-time option
  - Amazon SQS long polling from each device
  - Amazon CloudFront with WebSocket caching
  answer: 0
  explanation: |
    At the scale of millions of always-on devices with pub/sub topics, IoT Core (MQTT) is
    purpose-built and cost-effective. API Gateway WebSocket is fine for app chat but pricier at
    device scale (1); SQS polling per device is not a real-time push fabric (2); CloudFront does
    not cache WebSockets (3).
  ref: 'concepts.md#real-time-chat-and-notifications'
- id: aws-reference-architectures-046
  difficulty: advanced
  tags:
  - analytics
  - athena
  - redshift
  - emr
  - tradeoff
  question: |
    A team runs a few large ad-hoc SQL queries per week over S3, plus a high-concurrency BI
    dashboard hit constantly with complex joins. What is the strongest architecture?
  options:
  - Athena for everything to stay serverless
  - Athena for the infrequent ad-hoc queries over the raw lake (pay per scan), and Redshift for the constant
    high-concurrency BI/joins on a curated serving layer
  - Redshift for everything because it is a warehouse
  - EMR Spark for everything because it is the most flexible
  answer: 1
  explanation: |
    Athena fits infrequent ad-hoc queries (no cluster, pay per scan); Redshift fits constant,
    high-concurrency BI with complex joins where a provisioned/serverless MPP warehouse amortizes
    well. All-Athena gets costly under constant heavy load (0); all-Redshift wastes a cluster on
    rare ad-hoc scans (2); EMR is overkill for SQL BI (3).
  ref: 'concepts.md#analytics-pipeline'
- id: aws-reference-architectures-047
  difficulty: advanced
  tags:
  - analytics
  - kinesis
  - msk
  - tradeoff
  question: |
    When would you choose Amazon MSK (managed Kafka) over Kinesis Data Streams for ingestion?
  options:
  - When you want the least operational overhead and shard-based simplicity
  - When you need replay, which only MSK supports
  - When you need the Kafka ecosystem/compatibility (Connect, existing Kafka apps), very high throughput,
    or long retention beyond what Kinesis offers, accepting more configuration/ops responsibility
  - When you must integrate with S3, which Kinesis cannot do
  answer: 2
  explanation: |
    MSK wins when you need Kafka compatibility/ecosystem, higher throughput, or longer retention,
    at the price of more ops. Kinesis is the lower-ops shard-based option (0); both support replay
    (1); Kinesis integrates with S3 via Firehose (3).
  ref: 'concepts.md#analytics-pipeline'
- id: aws-reference-architectures-048
  difficulty: advanced
  tags:
  - resilience
  - multi-region
  - rto-rpo
  - tradeoff
  question: |
    A payments service requires an RTO of minutes and near-zero RPO across a full region outage.
    Which strategy fits and what is the cost?
  options:
  - Backup and restore, which is cheapest and meets minutes-level RTO
  - Pilot light, which gives zero RPO with no added cost
  - Active-active or warm standby using DynamoDB Global Tables / Aurora Global Database with Route 53
    failover, accepting higher cost and the complexity of cross-region replication and conflict resolution
  - Single-region with multi-AZ, which already survives region loss
  answer: 2
  explanation: |
    Minutes RTO / near-zero RPO across a region loss requires warm standby or active-active with
    cross-region data replication (Global Tables/Global DB) and Route 53 failover - more cost and
    complexity (conflict resolution). Backup-restore is hours-level (0); pilot light is not
    zero-RPO/free (1); multi-AZ does not survive a full region outage (3).
  ref: 'concepts.md#failure-modes-and-resilience'
- id: aws-reference-architectures-049
  difficulty: advanced
  tags:
  - resilience
  - cell-based
  - shuffle-sharding
  question: |
    What problem does a cell-based (with shuffle-sharding) architecture primarily solve?
  options:
  - It eliminates the need for multi-AZ deployment
  - It guarantees strong consistency across all cells
  - It contains blast radius by partitioning users into independent cells so a failure or poison workload
    affects only a small fraction of customers, not everyone
  - It reduces storage cost by deduplicating data across cells
  answer: 2
  explanation: |
    Cell-based architecture plus shuffle-sharding isolates failures to a small subset of users
    (blast-radius containment), a core Builders' Library resilience pattern. It does not replace
    multi-AZ (0), is unrelated to global consistency (1), and is not a storage-dedup technique (3).
  ref: 'concepts.md#failure-modes-and-resilience'
- id: aws-reference-architectures-050
  difficulty: advanced
  tags:
  - streaming
  - cost
  - egress
  question: |
    For a global video-streaming service, which lever most reduces cost, and why?
  options:
  - Raising the CloudFront cache-hit ratio and right-sizing the rendition ladder, because internet egress
    dominates streaming cost and cache hits/appropriate bitrates cut the bytes shipped from origin
  - Switching Lambda memory from 512 MB to 256 MB on the control plane
  - Moving DynamoDB from on-demand to provisioned for the catalog table
  - Using SQS FIFO instead of Standard for the ingest jobs
  answer: 0
  explanation: |
    Egress is the dominant streaming cost, so higher cache-hit ratio (fewer origin fetches, more
    edge serving) and a sensible rendition ladder (don't ship 4K to phones) are the biggest
    savings. Control-plane compute/DB/queue tweaks (1,2,3) are negligible against egress.
  ref: 'concepts.md#cost-estimation-and-back-of-envelope'
- id: aws-reference-architectures-051
  difficulty: advanced
  tags:
  - step-functions
  - express
  - standard
  - tradeoff
  question: |
    You must run a very high volume of short-lived workflows (millions/day, each a few seconds).
    Which Step Functions type fits and why?
  options:
  - Express workflows, which are optimized for high-volume, short-duration (up to 5 minutes) executions
    with at-least-once semantics and lower cost per run
  - Standard workflows, because they support up to one year and exactly-once execution
  - Neither; use a single Lambda with a loop
  - Standard workflows, because Express cannot be triggered by events
  answer: 0
  explanation: |
    Express workflows target high-volume, short (<=5 min) executions with at-least-once semantics
    and cheaper high-throughput pricing. Standard suits long-running (up to 1 year) exactly-once
    sagas with full history - overkill/pricey for millions of tiny runs (1,3); a Lambda loop loses
    orchestration benefits (2).
  ref: 'concepts.md#service-limits-and-quotas-that-shape-designs'
- id: aws-reference-architectures-052
  difficulty: advanced
  tags:
  - dynamodb
  - dax
  - elasticache
  - tradeoff
  question: |
    A read-heavy service on DynamoDB needs sub-millisecond reads on hot keys. When is DAX the
    right cache versus ElastiCache?
  options:
  - ElastiCache is always better because it is more general
  - DAX caches any data store, so it replaces ElastiCache entirely
  - DAX only works with Aurora, not DynamoDB
  - DAX is a DynamoDB-specific, API-compatible write-through/read cache requiring minimal app changes;
    choose ElastiCache when you need a general-purpose cache (arbitrary data, pub/sub, sorted sets) or
    caching in front of non-DynamoDB sources
  answer: 3
  explanation: |
    DAX is purpose-built for DynamoDB (API-compatible, minimal code change), ideal for
    microsecond DynamoDB reads; ElastiCache is general-purpose (any data, Redis structures/pub-sub)
    or for non-DynamoDB sources. DAX is DynamoDB-only, not a universal cache (0,1,2).
  ref: 'concepts.md#trade-offs-and-when-to-use-what'
- id: aws-reference-architectures-053
  difficulty: advanced
  tags:
  - dynamodb
  - consistency
  - cost
  question: |
    What is the trade-off of requesting strongly consistent reads on a DynamoDB base table versus
    eventually consistent reads?
  options:
  - Strongly consistent reads are cheaper and faster
  - Eventually consistent reads cost 2x more but never return stale data
  - Strongly consistent reads cost about 2x the RCU, are served from the leader (slightly higher latency
    and no cross-AZ read scaling), while eventually consistent reads are cheaper and lower-latency but
    may briefly return stale data
  - There is no cost or latency difference; only durability differs
  answer: 2
  explanation: |
    Strong reads consume ~2x RCU and hit the leader replica (higher latency, less read spreading);
    eventual reads are cheaper/faster but can be briefly stale. Option 0 reverses the economics, 2
    misstates eventual reads, and 3 denies the real cost/latency difference.
  ref: 'concepts.md#trade-offs-and-when-to-use-what'
- id: aws-reference-architectures-054
  difficulty: advanced
  tags:
  - feed
  - kinesis
  - sqs
  - ordering
  - tradeoff
  question: |
    For the async fan-out of a social feed that also feeds a ranking/analytics pipeline and needs
    ordered, replayable events with multiple consumers, which is the better backbone?
  options:
  - SQS Standard, because it has the highest throughput
  - Kinesis Data Streams, which offers per-shard ordering, replay, and multiple independent consumers
    reading the same events (fan-out + analytics), sized by shard count
  - SQS FIFO, because ordering means you must use FIFO regardless of throughput
  - SNS alone, since pub/sub replaces the need for a stream
  answer: 1
  explanation: |
    When you need ordering, replay, and multiple consumers off the same events, Kinesis is the fit
    (size by shards; enhanced fan-out gives each consumer 2 MB/s). SQS Standard lacks
    ordering/replay/multi-consumer replay (0); SQS FIFO's 300 TPS cap may not carry feed volume (2);
    SNS pub/sub is not a replayable ordered stream (3).
  ref: 'concepts.md#social-feed-with-fan-out'
- id: aws-reference-architectures-055
  difficulty: advanced
  tags:
  - lambda
  - concurrency
  - limits
  question: |
    A downstream relational database can only handle 200 concurrent connections, but a spike drives
    thousands of concurrent Lambda invocations that each open a connection. What is the correct
    mitigation?
  options:
  - Raise the Lambda memory to reduce duration
  - Switch the database to DynamoDB immediately
  - Increase the API Gateway timeout to 29 seconds
  - Set reserved concurrency on the Lambda (and/or use RDS Proxy to pool connections) so the number of
    simultaneous DB connections stays within the database's limit
  answer: 3
  explanation: |
    Reserved concurrency caps simultaneous Lambdas, and RDS Proxy pools/reuses connections,
    protecting a connection-limited database. More memory shortens duration but does not cap
    connections (0); swapping databases is a heavy overreaction (1); the API timeout is unrelated
    (2).
  ref: 'concepts.md#service-limits-and-quotas-that-shape-designs'
- id: aws-reference-architectures-056
  difficulty: advanced
  tags:
  - upload
  - s3
  - multipart
  - limits
  question: |
    A user needs to upload a 200 GB video file to S3. Which fact drives the upload design?
  options:
  - S3 objects cannot exceed 5 GB, so the file must be split into separate objects
  - Files over 100 GB must go to Glacier directly
  - API Gateway must proxy the upload in 10 MB chunks
  - A single PUT is limited to 5 GB and objects can be up to 5 TB, so you must use multipart upload (parts
    uploaded in parallel, then completed) - ideally via a presigned/accelerated flow
  answer: 3
  explanation: |
    Single PUT caps at 5 GB while an object can reach 5 TB, so a 200 GB file requires multipart
    upload (parallel parts + complete), typically presigned and possibly Transfer Acceleration.
    Objects can far exceed 5 GB (0), there is no 100 GB Glacier rule (1), and routing through API
    Gateway is wrong for large files (2).
  ref: 'concepts.md#image-and-video-upload-and-processing'
- id: aws-reference-architectures-057
  difficulty: advanced
  tags:
  - analytics
  - firehose
  - latency
  - tradeoff
  question: |
    What is the trade-off of using Kinesis Data Firehose to land streaming data in S3 versus a
    custom Lambda consumer writing to S3?
  options:
  - Firehose is real-time with zero latency; Lambda always adds minutes of delay
  - Lambda cannot write to S3, so Firehose is mandatory
  - Firehose is zero-ops with buffering and format conversion (e.g., to Parquet) but adds up to roughly
    60 s of buffering latency; a Lambda consumer gives lower latency and full control but you must handle
    batching, retries, and file sizing yourself
  - Firehose supports replay while Lambda consumers cannot read Kinesis
  answer: 2
  explanation: |
    Firehose trades a bit of buffering latency (up to ~60 s) for zero-admin delivery with format
    conversion; a custom Lambda consumer lowers latency and adds control but shifts batching/retry/
    file-sizing work to you. Firehose is not zero-latency (0), Lambda can write to and read from
    Kinesis (1,3).
  ref: 'concepts.md#analytics-pipeline'
- id: aws-reference-architectures-058
  difficulty: advanced
  tags:
  - ecommerce
  - search
  - opensearch
  - dynamodb
  question: |
    The product catalog needs both fast key lookups by productId and rich full-text/faceted search
    (typo tolerance, filters). What is the idiomatic split?
  options:
  - Put everything in OpenSearch and use it as the system of record
  - Use Aurora with LIKE queries for search
  - Keep the authoritative catalog in DynamoDB for key access and stream changes into OpenSearch for full-text
    and faceted search, treating OpenSearch as a derived index
  - Use S3 Select to power the search box
  answer: 2
  explanation: |
    DynamoDB is the system of record for key access; OpenSearch is a derived search index kept in
    sync via streams. OpenSearch is not a durable system of record (0); SQL LIKE does not scale for
    full-text/faceted search (1); S3 Select is not a search engine (3).
  ref: 'concepts.md#e-commerce-and-order-systems-with-sagas'
- id: aws-reference-architectures-059
  difficulty: advanced
  tags:
  - chat
  - appsync
  - websocket
  - tradeoff
  question: |
    An app is already built on GraphQL and needs managed real-time updates with built-in
    authorization. Which real-time option is most natural?
  options:
  - AWS AppSync GraphQL subscriptions, which provide managed real-time push over the existing GraphQL
    schema with integrated authorization
  - API Gateway WebSocket API with custom auth wiring
  - A self-managed WebSocket fleet on EKS
  - Amazon SQS with GraphQL polling
  answer: 0
  explanation: |
    AppSync subscriptions deliver managed real-time over an existing GraphQL API with built-in
    auth - the natural fit for a GraphQL app. Raw WebSocket APIs work but require more custom
    plumbing (1); a self-managed fleet adds ops for no benefit here (2); SQS polling is not a
    GraphQL real-time mechanism (3).
  ref: 'concepts.md#real-time-chat-and-notifications'
- id: aws-reference-architectures-060
  difficulty: advanced
  tags:
  - resilience
  - retries
  - jitter
  question: |
    A dependency briefly fails and thousands of clients retry simultaneously, deepening the outage.
    Which technique from the Builders' Library prevents this retry storm?
  options:
  - Fixed 1-second retries so all clients recover quickly together
  - Exponential backoff with jitter (randomized, increasing delays) plus circuit breakers to spread retries
    over time and stop hammering a struggling dependency
  - Unlimited immediate retries until success
  - Disabling retries entirely and failing every request permanently
  answer: 1
  explanation: |
    Exponential backoff with jitter randomizes and spaces retries so clients do not synchronize
    into a thundering herd; circuit breakers stop calls to a failing dependency. Fixed or
    immediate retries synchronize load and worsen the outage (0,2); disabling retries hurts
    normal transient recovery (3).
  ref: 'concepts.md#failure-modes-and-resilience'
- id: aws-reference-architectures-061
  difficulty: expert
  tags:
  - url-shortener
  - estimation
  - capacity
  question: |
    A URL shortener serves 100M DAU x 10 redirects/day. Roughly what average and peak read rate
    should you plan for, and what does that imply?
  options:
  - About 1,000 rps average and 2,000 peak; a single small DynamoDB partition suffices with no cache
  - About 11.6k rps average and ~60k peak (with a 5x factor); the read path must be dominated by edge/DAX
    caching so DynamoDB sees only a fraction, and writes (~12 rps) are trivial
  - About 1M rps average; you need dedicated EC2 GPU fleets for redirects
  - About 116 rps average; provisioned WCU is the binding constraint
  answer: 1
  explanation: |
    1B reads/day / 86,400 ~ 11.6k rps average; a 5x peak ~ 58-60k rps. That forces a cache-first
    read path (CloudFront/DAX) so DynamoDB handles a fraction; writes (~1M/day ~ 12 rps) are
    trivial, so WCU is not the constraint. The other magnitudes are off by orders (0,2,3).
  ref: 'concepts.md#cost-estimation-and-back-of-envelope'
- id: aws-reference-architectures-062
  difficulty: expert
  tags:
  - multi-region
  - dynamodb
  - global-tables
  - consistency
  - tradeoff
  question: |
    You adopt DynamoDB Global Tables for active-active multi-region writes. What consistency
    reality must the design handle?
  options:
  - Cross-region replication is asynchronous (eventual), and concurrent writes to the same item in different
    regions are resolved last-writer-wins, so the app must tolerate replication lag and potential lost
    concurrent updates
  - Global Tables provide strong consistency across regions, so no conflict handling is needed
  - Writes are blocked in all but one region to preserve consistency
  - Global Tables require SQS FIFO to replicate
  answer: 0
  explanation: |
    Global Tables replicate asynchronously with last-writer-wins conflict resolution, so you must
    design for replication lag and possible lost concurrent updates. They are not cross-region
    strongly consistent (1), all regions accept writes (active-active) (2), and replication is
    built-in, not via SQS (3).
  ref: 'concepts.md#failure-modes-and-resilience'
- id: aws-reference-architectures-063
  difficulty: expert
  tags:
  - kinesis
  - hot-shard
  - partition-key
  question: |
    A Kinesis stream is provisioned for the aggregate throughput, yet one shard is throttling
    (ProvisionedThroughputExceeded) while others sit idle. What is the root cause and fix?
  options:
  - The stream has too many consumers; remove some
  - A skewed partition key routes most records to one shard (hot shard); choose a higher-cardinality/evenly-distributed
    partition key (or use enhanced fan-out for consumer-side limits) so records spread across shards
  - Kinesis retention is too long; shorten it
  - The records exceed 400 KB; compress them
  answer: 1
  explanation: |
    A hot shard comes from a low-cardinality/skewed partition key concentrating records on one
    shard; fix the key to distribute evenly. Consumer count and retention do not cause ingest hot
    shards (0,2); the Kinesis record limit is 1 MB not 400 KB (3).
  ref: 'concepts.md#service-limits-and-quotas-that-shape-designs'
- id: aws-reference-architectures-064
  difficulty: expert
  tags:
  - ecommerce
  - saga
  - compensation
  - correctness
  question: |
    In an orchestrated checkout saga, payment succeeds but the subsequent create-order step fails
    permanently. What must the saga do to stay correct?
  options:
  - Execute compensating transactions in reverse (e.g., refund the payment and release the reserved inventory)
    so the system returns to a consistent state, and surface the failure to the user
  - Retry create-order forever until it succeeds
  - Leave the payment captured and create the order manually later without releasing inventory
  - Roll back the payment via a distributed two-phase commit
  answer: 0
  explanation: |
    Sagas maintain consistency by running compensating actions for already-completed steps -
    refund payment, release inventory - and reporting the failure. Infinite retries can wedge the
    flow (1); leaving money captured with no order is incorrect (2); there is no 2PC across these
    services, which is exactly why sagas exist (3).
  ref: 'concepts.md#e-commerce-and-order-systems-with-sagas'
- id: aws-reference-architectures-065
  difficulty: expert
  tags:
  - tradeoff
  - service-selection
  - judgment
  question: |
    Requirements: unpredictable spiky traffic, key-value access, single-digit-ms reads, minimal
    ops, must scale to zero when idle, and occasional 8-minute background jobs. Which design is
    MOST appropriate?
  options:
  - API Gateway + Lambda + DynamoDB on-demand for the request path, with the 8-minute jobs also on Lambda
    (within the 15-min limit), giving scale-to-zero, low ops, and single-digit-ms key access
  - EKS cluster running 24/7 with a self-managed Cassandra ring and a cron pod for background jobs
  - EC2 Auto Scaling group fronted by an ALB with a self-managed MySQL primary/replica
  - Fargate service running continuously with Aurora provisioned at peak capacity
  answer: 0
  explanation: |
    Spiky, key-value, sub-10ms, scale-to-zero, low-ops, and 8-min jobs (< 15 min) all point to
    serverless: API GW + Lambda + DynamoDB on-demand, background work on Lambda. EKS+Cassandra
    and EC2+MySQL add heavy ops and never scale to zero (1,2); always-on Fargate + peak-provisioned
    Aurora wastes money on spiky/idle traffic (3).
  ref: 'concepts.md#reasoning-from-requirements-to-an-aws-design'
- id: aws-reference-architectures-066
  difficulty: expert
  tags:
  - tradeoff
  - limits
  - failure-first
  question: |
    A serverless design uses API Gateway REST -> Lambda -> Aurora. Product wants a
    "generate full annual report" button that scans millions of rows and takes 3-8 minutes. Which
    limit does the current design hit FIRST, and what is the right change?
  options:
  - Lambda's 15-minute limit; nothing needs to change
  - API Gateway's 29-second integration timeout; make report generation asynchronous (202 + job id, run
    on Step Functions/Lambda, deliver via S3 presigned link or notification)
  - DynamoDB's 400 KB item limit; split the report
  - S3's 5 TB object limit; use multipart
  answer: 1
  explanation: |
    A 3-8 minute synchronous call breaches API Gateway's 29-second integration timeout long before
    Lambda's 15-min limit, so it must go async (202 + background job + delivered result). Lambda's
    limit is not the binding one here (0); there is no DynamoDB in this path and 400 KB/5 TB are
    irrelevant (2,3).
  ref: 'concepts.md#service-limits-and-quotas-that-shape-designs'
- id: aws-reference-architectures-067
  difficulty: expert
  tags:
  - streaming
  - live
  - medialive
  - mediapackage
  question: |
    You must add LIVE streaming (not VOD) with DVR and DRM to the platform. Which service chain is
    correct?
  options:
  - S3 -> MediaConvert -> CloudFront, the same as VOD
  - Kinesis Video Streams -> Athena -> CloudFront
  - IoT Core -> Lambda -> S3 -> CloudFront
  - Encoder -> AWS Elemental MediaLive (live encode) -> MediaPackage (just-in-time packaging, DVR, DRM)
    -> CloudFront
  answer: 3
  explanation: |
    Live streaming uses MediaLive to encode the live feed and MediaPackage to package/originate it
    (DVR windows, DRM), fronted by CloudFront. MediaConvert is file-based VOD transcode, not live
    (0); Kinesis Video/Athena and IoT chains are not live-video delivery pipelines (1,2).
  ref: 'concepts.md#video-streaming-platform-netflix-style'
- id: aws-reference-architectures-068
  difficulty: expert
  tags:
  - feed
  - timeline
  - dynamodb
  - elasticache
  - judgment
  question: |
    Timeline reads must be sub-millisecond and dominate traffic, but timelines must survive a cache
    node failure without data loss. Which layering is correct?
  options:
  - Store timelines only in ElastiCache for sub-ms reads; rebuild from posts if a node dies
  - Store timelines only in DynamoDB and accept its single-digit-ms latency as sub-ms
  - Store timelines in S3 and serve via CloudFront
  - Keep durable timelines in DynamoDB and use ElastiCache (Redis) as a cache-aside hot layer for sub-ms
    reads; a cache node loss only causes cache misses that repopulate from DynamoDB
  answer: 3
  explanation: |
    Durability in DynamoDB + a Redis cache-aside layer gives sub-ms hot reads while a node loss just
    causes misses that reload from DynamoDB - no data loss. Cache-only risks loss and costly rebuilds
    (0); DynamoDB alone is single-digit-ms, not sub-ms (1); S3/CloudFront is wrong for per-user
    dynamic timelines (2).
  ref: 'concepts.md#social-feed-with-fan-out'
- id: aws-reference-architectures-069
  difficulty: expert
  tags:
  - analytics
  - backpressure
  - enhanced-fan-out
  question: |
    Five independent consumers each need the full Kinesis stream in near real time, but they are
    hitting the shared 2 MB/s per-shard egress limit and adding read latency. What is the fix?
  options:
  - Add more shards even though ingest is fine, then split consumers across them
  - Switch all consumers to poll SQS instead
  - Use Kinesis enhanced fan-out (EFO), giving each registered consumer its own dedicated 2 MB/s per shard
    via a push (HTTP/2) API, removing contention on the shared read throughput
  - Reduce retention to free up read bandwidth
  answer: 2
  explanation: |
    Enhanced fan-out gives each consumer a dedicated 2 MB/s-per-shard pipe (push over HTTP/2),
    eliminating the shared-read contention among multiple consumers. Adding shards for read-only
    contention is wasteful and does not grant per-consumer bandwidth the way EFO does (0); SQS is
    not a multi-consumer replayable stream (1); retention does not affect read throughput (3).
  ref: 'concepts.md#analytics-pipeline'
- id: aws-reference-architectures-070
  difficulty: expert
  tags:
  - cost
  - s3
  - storage-classes
  - lifecycle
  question: |
    Raw analytics logs land in S3, are queried heavily for 30 days, occasionally for 90 days, and
    almost never after a year but must be retained 7 years for compliance. What is the most
    cost-effective lifecycle?
  options:
  - 'Lifecycle: Standard for ~30 days, transition to Standard-IA (or Intelligent-Tiering) for the occasional
    90-day window, then to Glacier Flexible/Deep Archive for long-term compliance retention'
  - Keep everything in S3 Standard for 7 years for simplicity
  - Move everything to Glacier Deep Archive on day one to minimize storage cost
  - Delete after 90 days and regenerate from source if audited
  answer: 0
  explanation: |
    Matching access frequency to storage class via lifecycle rules (Standard -> IA/Intelligent-
    Tiering -> Glacier tiers) minimizes cost while meeting retention. All-Standard wastes money on
    cold data (1); day-one Deep Archive breaks the heavy 30-day query need (retrieval latency/cost)
    (2); deleting violates the 7-year compliance requirement (3).
  ref: 'concepts.md#cost-estimation-and-back-of-envelope'
- id: aws-reference-architectures-071
  difficulty: expert
  tags:
  - tradeoff
  - eventbridge
  - sqs
  - kinesis
  - judgment
  question: |
    A system must (a) route domain events to different microservices based on event content, (b)
    durably buffer work for a slow batch processor, and (c) feed an ordered, replayable analytics
    stream with multiple consumers. Which mapping is correct?
  options:
  - SQS for (a), Kinesis for (b), EventBridge for (c)
  - Kinesis for all three since it is the most powerful
  - EventBridge for (a) content-based routing, SQS for (b) durable buffered work, Kinesis (or MSK) for
    (c) ordered replayable multi-consumer stream
  - SNS for all three since it fans out
  answer: 2
  explanation: |
    EventBridge does content-based routing to many targets; SQS durably buffers work with retries/
    DLQ; Kinesis/MSK provides ordered, replayable, multi-consumer streaming. Option 0 misassigns
    each; one service for everything ignores their distinct strengths (1,3).
  ref: 'concepts.md#trade-offs-and-when-to-use-what'
- id: aws-reference-architectures-072
  difficulty: expert
  tags:
  - ecommerce
  - aurora
  - serverless-v2
  - scaling
  - tradeoff
  question: |
    An order service on Aurora sees traffic that is quiet most of the day with sharp, unpredictable
    flash-sale spikes, and the team wants relational integrity without over-provisioning. Which
    option best fits and what is the residual concern?
  options:
  - 'Aurora provisioned at peak size 24/7; concern: none'
  - DynamoDB on-demand, because relational integrity does not matter for orders
  - Read replicas alone, which absorb write spikes
  - Aurora Serverless v2, which scales capacity up/down with load to avoid paying for peak all day; residual
    concern is that connection limits and single-writer vertical write scaling still cap write throughput,
    so extreme write spikes may need queueing/sharding
  answer: 3
  explanation: |
    Aurora Serverless v2 scales with demand, avoiding paying for peak all day while keeping SQL/ACID;
    but writes still funnel through a single writer with connection limits, so extreme write spikes
    may need buffering/sharding. Peak-provisioned 24/7 wastes money (0); dropping relational
    integrity is a wrong trade for orders (1); read replicas do not absorb writes (2).
  ref: 'concepts.md#e-commerce-and-order-systems-with-sagas'
- id: aws-reference-architectures-073
  difficulty: advanced
  tags:
  - upload
  - eventbridge
  - sns
  - sqs
  - tradeoff
  question: |
    When should an image pipeline route S3 events through EventBridge rather than S3->SQS or
    S3->SNS?
  options:
  - When you only need to email one person on upload
  - When you need rich content-based filtering and routing of events to many heterogeneous targets (multiple
    Lambdas, Step Functions, cross-account, SaaS) with schema/rules, beyond simple buffering or basic
    pub/sub
  - When you need the absolute lowest per-message cost with no routing
  - When you must guarantee strict ordering of image processing
  answer: 1
  explanation: |
    EventBridge shines for content-based routing/filtering to many targets with rules and schemas
    (including cross-account/SaaS). Emailing one person suits SNS (0); pure low-cost buffering suits
    SQS (2); strict ordering is not EventBridge's purpose (3).
  ref: 'concepts.md#image-and-video-upload-and-processing'
- id: aws-reference-architectures-074
  difficulty: advanced
  tags:
  - security
  - presigned
  - kms
  - upload
  question: |
    For the direct-to-S3 upload flow, which security measures are appropriate without breaking the
    presigned-URL pattern?
  options:
  - Make the bucket public-read so CloudFront can serve derivatives
  - Scope presigned URLs to a specific key, method, and short expiry; enable SSE-KMS on the bucket; and
    serve reads through CloudFront with Origin Access Control (OAC) so the bucket stays private
  - Embed long-lived AWS access keys in the mobile client
  - Disable bucket encryption to reduce upload latency
  answer: 1
  explanation: |
    Tightly scoped, short-lived presigned URLs + SSE-KMS + CloudFront OAC to a private bucket is the
    secure pattern. Public buckets and embedded long-lived credentials are serious risks (0,2);
    disabling encryption trades security for negligible latency (3).
  ref: 'concepts.md#image-and-video-upload-and-processing'
- id: aws-reference-architectures-075
  difficulty: beginner
  tags:
  - streaming
  - hls
  - dash
  - tradeoff
  question: |
    Why do many VOD pipelines produce both HLS and DASH from a single MediaConvert job?
  options:
  - HLS and DASH are the same format with different file extensions
  - HLS is favored on Apple/iOS/Safari while DASH offers broad/Android/DRM flexibility, so producing both
    maximizes device compatibility from one transcode
  - DASH is only for live and HLS only for VOD
  - Producing both halves the storage cost
  answer: 1
  explanation: |
    HLS suits Apple ecosystems; DASH is broadly used (Android, flexible DRM), so emitting both from
    one job maximizes compatibility. They are distinct formats (0), both work for VOD (2), and
    producing two formats increases, not halves, storage (3).
  ref: 'concepts.md#video-streaming-platform-netflix-style'
- id: aws-reference-architectures-076
  difficulty: beginner
  tags:
  - analytics
  - firehose
  question: |
    What is the simplest, zero-administration way to continuously load streaming records into S3
    with buffering and optional format conversion?
  options:
  - Amazon Kinesis Data Firehose
  - Amazon Athena
  - Amazon EMR
  - AWS Step Functions
  answer: 0
  explanation: |
    Firehose is the fully managed delivery stream that buffers and writes to S3 (and Redshift/
    OpenSearch), with format conversion to Parquet. Athena queries data (1), EMR is big-data
    compute (2), and Step Functions orchestrates workflows (3) - none is a managed S3 loader.
  ref: 'concepts.md#analytics-pipeline'
- id: aws-reference-architectures-077
  difficulty: intermediate
  tags:
  - feed
  - cache-aside
  - elasticache
  question: |
    Which caching strategy is typically used for hot social-feed timelines backed by DynamoDB?
  options:
  - Write-around with no cache on reads
  - Write-through only, caching every write regardless of read demand
  - No caching; read every timeline from DynamoDB each time
  - 'Cache-aside (lazy loading): read from ElastiCache; on a miss, load from DynamoDB and populate the
    cache, so hot timelines serve from memory'
  answer: 3
  explanation: |
    Cache-aside serves hot timelines from Redis and lazily fills on misses from DynamoDB, matching
    the read-heavy access. Write-around (0) skips caching reads; caching every write (1) wastes
    memory on cold data; no cache (2) fails the sub-ms latency goal.
  ref: 'concepts.md#social-feed-with-fan-out'
- id: aws-reference-architectures-078
  difficulty: intermediate
  tags:
  - compute
  - lambda
  - cold-start
  - tradeoff
  question: |
    A latency-sensitive API on Lambda suffers occasional cold-start spikes on a JVM runtime. What
    is a reasonable mitigation and its trade-off?
  options:
  - Do nothing; cold starts are unavoidable and unfixable
  - Increase the API Gateway timeout to hide the cold start
  - Switch to SQS FIFO to warm the function
  - Use provisioned concurrency (pre-warmed execution environments) to eliminate cold starts for that
    many concurrent instances, at the cost of paying for the provisioned capacity even when idle
  answer: 3
  explanation: |
    Provisioned concurrency keeps environments warm to remove cold starts, trading always-on cost.
    Cold starts are mitigable (0); a longer API timeout does not remove the latency spike (1); SQS
    FIFO does not warm functions (2).
  ref: 'concepts.md#reasoning-from-requirements-to-an-aws-design'
- id: aws-reference-architectures-079
  difficulty: intermediate
  tags:
  - chat
  - ordering
  - dynamodb
  question: |
    How do you keep messages ordered within a single conversation in a DynamoDB-backed chat store?
  options:
  - Use a random UUID as the sort key
  - Store all messages in one item as a list
  - Rely on SNS to reorder messages on delivery
  - Use PK = conversationId and SK = timestamp/sequence, so items are stored sorted within the conversation
    partition and a query returns them in order
  answer: 3
  explanation: |
    A composite key (PK=conversationId, SK=timestamp/sequence) keeps items sorted within the
    partition, so range queries return ordered messages. A random UUID SK loses ordering (0); one
    item hits the 400 KB cap (1); SNS does not reorder (2).
  ref: 'concepts.md#real-time-chat-and-notifications'
- id: aws-reference-architectures-080
  difficulty: intermediate
  tags:
  - url-shortener
  - analytics
  - async
  question: |
    Why send click-analytics events to Firehose/Kinesis -> S3 -> Athena rather than writing them
    synchronously in the redirect path?
  options:
  - Because Athena is faster than DynamoDB for point reads
  - Because DynamoDB cannot store click data
  - To keep the redirect path fast and available - analytics is processed asynchronously so a slow or
    failed analytics pipeline never adds latency to or blocks user redirects
  - Because 301 redirects require Athena
  answer: 2
  explanation: |
    Decoupling analytics asynchronously protects the latency-critical, availability-critical
    redirect path. It is not about Athena's point-read speed (0), DynamoDB can store clicks (1), and
    redirects do not require Athena (3).
  ref: 'concepts.md#url-shortener-on-aws'
