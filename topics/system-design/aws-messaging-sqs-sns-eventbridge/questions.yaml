topic: "AWS Messaging: SQS, SNS and EventBridge"
domain: system-design
topic_slug: aws-messaging-sqs-sns-eventbridge
version: 1
questions:
  - id: aws-messaging-sqs-sns-eventbridge-001
    difficulty: beginner
    tags: [sqs, fundamentals, queue-vs-pubsub]
    question: |
      Which statement best captures the core difference between Amazon SQS and
      Amazon SNS?
    options:
      - "SQS is a pull-based queue for point-to-point work; SNS is a push-based pub/sub topic that fans a message out to many subscribers"
      - "SQS is push-based and SNS is pull-based"
      - "SQS guarantees exactly-once delivery while SNS guarantees ordering"
      - "SQS and SNS are the same service with different pricing tiers"
    answer: 0
    explanation: |
      SQS is a durable queue that consumers poll (pull); a message is normally
      processed by one consumer group. SNS is publish/subscribe: one publish is
      pushed to many subscribers. The other options invert the push/pull model or
      overstate delivery guarantees (both are at-least-once by default).
    ref: "concepts.md#sqs-standard-versus-fifo-queues"

  - id: aws-messaging-sqs-sns-eventbridge-002
    difficulty: beginner
    tags: [sqs, delivery-semantics]
    question: |
      What delivery guarantee does an SQS Standard queue provide?
    options:
      - "At-least-once delivery with best-effort ordering (duplicates possible)"
      - "Exactly-once, strictly ordered delivery"
      - "At-most-once delivery (messages may be silently dropped)"
      - "Exactly-once delivery within a 5-minute window"
    answer: 0
    explanation: |
      Standard queues are at-least-once with best-effort ordering, so consumers
      must be idempotent and cannot assume order. Exactly-once processing (within a
      5-min dedup window) is a FIFO feature. At-most-once/silent drops are not the
      SQS model — messages persist until acknowledged or retention expires.
    ref: "concepts.md#sqs-standard-versus-fifo-queues"

  - id: aws-messaging-sqs-sns-eventbridge-003
    difficulty: beginner
    tags: [sqs, visibility-timeout]
    question: |
      What is the default SQS visibility timeout?
    options:
      - "0 seconds"
      - "5 minutes"
      - "30 seconds"
      - "12 hours"
    answer: 2
    explanation: |
      The default visibility timeout is 30 seconds (configurable 0 s to 12 h).
      12 hours is the maximum, not the default; 0 s and 5 min are valid values but
      not the default.
    ref: "concepts.md#visibility-timeout-polling-and-message-lifecycle"

  - id: aws-messaging-sqs-sns-eventbridge-004
    difficulty: beginner
    tags: [sqs, size-limit]
    question: |
      What is the maximum size of a single SQS message (body plus attributes)?
    options:
      - "64 KB"
      - "2 GB"
      - "1 MB"
      - "256 KB"
    answer: 3
    explanation: |
      SQS (and SNS) messages max out at 256 KB. For larger payloads you use the SQS
      Extended Client / claim-check pattern, storing the blob in S3 (up to 2 GB) and
      sending a pointer. 2 GB is the extended-client ceiling, not the raw message
      limit.
    ref: "concepts.md#message-retention-delays-and-large-payloads"

  - id: aws-messaging-sqs-sns-eventbridge-005
    difficulty: beginner
    tags: [sqs, retention]
    question: |
      What is the default and maximum message retention period for an SQS queue?
    options:
      - "Default 4 days, maximum 14 days"
      - "Default 1 hour, maximum 24 hours"
      - "Default 7 days, maximum 30 days"
      - "Default 14 days, maximum 365 days"
    answer: 0
    explanation: |
      SQS retention defaults to 4 days and is configurable from 60 seconds to a
      maximum of 14 days. 365 days is a Kinesis figure. This retention bounds how
      long a down consumer can be offline before messages are deleted.
    ref: "concepts.md#message-retention-delays-and-large-payloads"

  - id: aws-messaging-sqs-sns-eventbridge-006
    difficulty: beginner
    tags: [sns, fan-out, subscribers]
    question: |
      Which of the following is NOT a native SNS subscription (delivery) target?
    options:
      - "SQS queue"
      - "Lambda function"
      - "HTTP/S endpoint"
      - "A relational database table via direct SQL insert"
    answer: 3
    explanation: |
      SNS delivers to SQS, Lambda, HTTP/S, email, SMS, mobile push, and Kinesis
      Data Firehose. It cannot write directly to a database table via SQL — you'd
      subscribe a Lambda that performs the write. The other three are first-class
      SNS targets.
    ref: "concepts.md#sns-pub-sub-and-the-sns-plus-sqs-fan-out-pattern"

  - id: aws-messaging-sqs-sns-eventbridge-007
    difficulty: beginner
    tags: [sqs, long-polling]
    question: |
      Why is long polling generally preferred over short polling in SQS?
    options:
      - "It guarantees strict message ordering"
      - "It increases the maximum message size to 1 MB"
      - "It reduces empty responses and cost by waiting (up to 20 s) and querying all servers"
      - "It automatically deletes messages after receipt"
    answer: 2
    explanation: |
      Long polling waits up to 20 seconds and queries all SQS servers, so it returns
      as soon as a message exists and avoids the wasteful empty responses of short
      polling (which samples a subset of servers). It has nothing to do with ordering,
      size limits, or auto-delete.
    ref: "concepts.md#visibility-timeout-polling-and-message-lifecycle"

  - id: aws-messaging-sqs-sns-eventbridge-008
    difficulty: beginner
    tags: [dlq, poison-message]
    question: |
      What is the primary purpose of a dead-letter queue (DLQ) in SQS?
    options:
      - "To store messages that exceed 256 KB"
      - "To increase queue throughput"
      - "To provide encrypted storage for sensitive messages"
      - "To capture messages that repeatedly fail processing so they stop blocking healthy traffic"
    answer: 3
    explanation: |
      A DLQ, via a redrive policy with maxReceiveCount, captures poison messages
      after N failed receives so they no longer redeliver forever and block the
      queue. It is not about payload size, encryption, or throughput.
    ref: "concepts.md#dead-letter-queues-redrive-and-poison-messages"

  - id: aws-messaging-sqs-sns-eventbridge-009
    difficulty: beginner
    tags: [eventbridge, fundamentals]
    question: |
      In Amazon EventBridge, what does a "rule" do?
    options:
      - "It stores events durably for 14 days"
      - "It matches events by an event pattern and forwards matching events to targets"
      - "It defines the IAM permissions of a Lambda function"
      - "It sets the visibility timeout for a queue"
    answer: 1
    explanation: |
      An EventBridge rule matches events on a bus using an event pattern (content
      matching) and routes matches to up to 5 targets. It is not storage (archive
      does that), not IAM, and unrelated to SQS visibility timeout.
    ref: "concepts.md#eventbridge-event-bus-rules-and-content-based-routing"

  - id: aws-messaging-sqs-sns-eventbridge-010
    difficulty: beginner
    tags: [sqs, delay]
    question: |
      What is the maximum delay you can set on an SQS delay queue or message timer?
    options:
      - "15 minutes"
      - "30 seconds"
      - "1 hour"
      - "12 hours"
    answer: 0
    explanation: |
      SQS delays (delay queue or per-message timer) max out at 15 minutes. For longer
      scheduling you need Step Functions wait, EventBridge Scheduler, or DynamoDB TTL.
      12 hours is the visibility-timeout max, not the delay max.
    ref: "concepts.md#message-retention-delays-and-large-payloads"

  - id: aws-messaging-sqs-sns-eventbridge-011
    difficulty: beginner
    tags: [sqs, ack, lifecycle]
    question: |
      After a consumer successfully processes an SQS message, what must it do to
      prevent redelivery?
    options:
      - "Call ChangeMessageVisibility with 0"
      - "Nothing — SQS auto-deletes on receive"
      - "Call DeleteMessage to acknowledge it"
      - "Publish an acknowledgment to SNS"
    answer: 2
    explanation: |
      SQS uses explicit acknowledgment: the consumer must call DeleteMessage. If it
      doesn't within the visibility timeout, the message reappears and is redelivered.
      SQS does not auto-delete on receive (that would risk losing work on a crash).
    ref: "concepts.md#visibility-timeout-polling-and-message-lifecycle"

  - id: aws-messaging-sqs-sns-eventbridge-012
    difficulty: beginner
    tags: [sns-sqs, fan-out]
    question: |
      In the classic SNS + SQS fan-out pattern, why does each consumer get its own
      SQS queue subscribed to the topic rather than reading the topic directly?
    options:
      - "To reduce the SNS publish cost to zero"
      - "To enforce strict global ordering across all consumers"
      - "Because SNS cannot deliver to more than one subscriber"
      - "To give each consumer durable buffering, failure isolation, and independent scaling"
    answer: 3
    explanation: |
      Interposing a queue per consumer gives durable storage, per-consumer buffering,
      isolated backlogs/DLQs, and independent scaling and retention. SNS can deliver
      to many subscribers, delivery isn't free of all cost, and this pattern does not
      provide global ordering.
    ref: "concepts.md#sns-pub-sub-and-the-sns-plus-sqs-fan-out-pattern"

  - id: aws-messaging-sqs-sns-eventbridge-013
    difficulty: beginner
    tags: [eventbridge, scheduler]
    question: |
      Which service is purpose-built to invoke targets on cron/rate schedules or at a
      specific future time, scaling to millions of schedules?
    options:
      - "EventBridge Scheduler"
      - "SQS delay queues"
      - "SNS FIFO topics"
      - "SQS message timers"
    answer: 0
    explanation: |
      EventBridge Scheduler is the dedicated serverless scheduler (cron/rate/one-time,
      time zones, millions of schedules). SQS delay/timers cap at 15 minutes and are
      not schedulers; SNS FIFO is about ordered fan-out.
    ref: "concepts.md#eventbridge-scheduler-pipes-archive-and-replay"

  - id: aws-messaging-sqs-sns-eventbridge-014
    difficulty: beginner
    tags: [kinesis, replay]
    question: |
      Compared with SQS, which capability do Kinesis Data Streams and Kafka provide
      that a standard SQS queue does not?
    options:
      - "Automatic consumer scaling"
      - "Guaranteed sub-millisecond latency"
      - "Replay of past records and multiple independent consumers reading the same data"
      - "Payloads larger than 256 KB without S3"
    answer: 2
    explanation: |
      Logs (Kinesis/Kafka) retain records and let many independent consumers read at
      their own offsets and replay history; SQS deletes on ack, so a consumed message
      is gone and there's one competing-consumer group. The other options aren't
      distinguishing features.
    ref: "concepts.md#sqs-versus-kinesis-versus-kafka-for-the-same-problem"

  - id: aws-messaging-sqs-sns-eventbridge-015
    difficulty: intermediate
    tags: [sqs, fifo, throughput]
    question: |
      A team needs strict per-customer ordering and enables an SQS FIFO queue. Without
      high-throughput mode, what is the approximate throughput ceiling?
    options:
      - "300 messages/second, or 3,000/second with batching (10 per batch)"
      - "Unlimited, same as Standard queues"
      - "1,000 records/second per shard"
      - "50 messages/second"
    answer: 0
    explanation: |
      Base FIFO is limited to 300 messages/sec per action, or 3,000/sec with batching
      (10 messages per API call). High-throughput FIFO mode raises this into the
      thousands but requires spreading load across many message groups. "Unlimited" is
      Standard; 1,000 rec/s/shard is Kinesis.
    ref: "concepts.md#sqs-standard-versus-fifo-queues"

  - id: aws-messaging-sqs-sns-eventbridge-016
    difficulty: intermediate
    tags: [sqs, fifo, message-groups]
    question: |
      In an SQS FIFO queue, what does the MessageGroupId control?
    options:
      - "The encryption key used for the message"
      - "Which DLQ the message is routed to"
      - "The visibility timeout for that message"
      - "The partition within which ordering is guaranteed; different groups are processed in parallel and independently"
    answer: 3
    explanation: |
      MessageGroupId partitions a FIFO queue: order is guaranteed within a group and
      groups are processed in parallel. Choosing a high-cardinality group key (e.g.
      customerId) preserves per-entity order while retaining parallelism. It is not an
      encryption, timeout, or DLQ selector.
    ref: "concepts.md#sqs-standard-versus-fifo-queues"

  - id: aws-messaging-sqs-sns-eventbridge-017
    difficulty: intermediate
    tags: [sqs, visibility-timeout, duplicates]
    question: |
      A consumer's p99 processing time is 45 seconds but the queue's visibility
      timeout is left at the 30-second default. What is the most likely consequence?
    options:
      - "Messages will be permanently lost after 30 seconds"
      - "The same message becomes visible and is picked up by a second consumer while the first is still processing, causing duplicate work"
      - "The queue will automatically switch to FIFO"
      - "SQS will reject all SendMessage calls"
    answer: 1
    explanation: |
      If processing exceeds the visibility timeout, SQS makes the message visible
      again and another consumer receives it, so it gets processed twice. Fix by
      setting the timeout above p99 or by heartbeating with ChangeMessageVisibility.
      Messages aren't lost (retention still applies) and the queue type can't change.
    ref: "concepts.md#visibility-timeout-polling-and-message-lifecycle"

  - id: aws-messaging-sqs-sns-eventbridge-018
    difficulty: intermediate
    tags: [dlq, redrive, max-receive-count]
    question: |
      You set maxReceiveCount = 2 on a queue whose downstream dependency occasionally
      has brief 3-5 second blips. What is the likely undesirable effect?
    options:
      - "Transient failures during a blip will send otherwise-good messages to the DLQ prematurely"
      - "Poison messages will never reach the DLQ"
      - "The DLQ will exceed the 256 KB message limit"
      - "Ordering guarantees will be violated"
    answer: 0
    explanation: |
      A very low maxReceiveCount DLQs messages that would have succeeded on a slightly
      later retry, turning transient blips into false poison. Set maxReceiveCount high
      enough (typically 3-5) to ride out transient failures but low enough to catch
      genuine poison. It doesn't affect size limits or ordering.
    ref: "concepts.md#dead-letter-queues-redrive-and-poison-messages"

  - id: aws-messaging-sqs-sns-eventbridge-019
    difficulty: intermediate
    tags: [sqs, large-payload, s3]
    question: |
      A service must send 5 MB image payloads through SQS. What is the recommended
      approach?
    options:
      - "Base64-encode the image into the message body"
      - "Split the image across 20 separate SQS messages and reassemble"
      - "Use the SQS Extended Client / claim-check pattern: store the blob in S3 and send an S3 reference in the message"
      - "Switch to a FIFO queue, which allows 5 MB messages"
    answer: 2
    explanation: |
      The Extended Client stores the payload in S3 (up to 2 GB) and sends only a
      pointer, transparently fetched by the consumer. Base64 or any inline approach
      hits the 256 KB limit; splitting is fragile; FIFO has the same 256 KB limit.
    ref: "concepts.md#message-retention-delays-and-large-payloads"

  - id: aws-messaging-sqs-sns-eventbridge-020
    difficulty: intermediate
    tags: [sns, filtering]
    question: |
      You want an SNS subscriber to receive only messages where eventType is
      "OrderPlaced" and amount > 100, without the consumer filtering. What feature
      achieves this?
    options:
      - "SQS visibility timeout"
      - "An SQS redrive policy"
      - "A FIFO topic with message groups"
      - "An SNS subscription filter policy"
    answer: 3
    explanation: |
      SNS subscription filter policies (on attributes or, if enabled, the body) let
      SNS evaluate a JSON policy and deliver only matching messages, avoiding wasted
      deliveries. Visibility timeouts, FIFO groups, and redrive policies do not do
      content filtering.
    ref: "concepts.md#sns-standard-versus-fifo-topics-and-message-filtering"

  - id: aws-messaging-sqs-sns-eventbridge-021
    difficulty: intermediate
    tags: [eventbridge, event-pattern]
    question: |
      Which capability is a distinguishing strength of EventBridge event patterns
      over SNS filter policies?
    options:
      - "Richer content-based matching (numeric ranges, prefix/suffix, anything-but, $or, wildcards) plus input transformation"
      - "Lower delivery latency"
      - "Guaranteed exactly-once delivery"
      - "Higher raw fan-out throughput than SNS"
    answer: 0
    explanation: |
      EventBridge event patterns are richer than SNS filter policies (ranges, prefix,
      anything-but, $or, wildcards) and support input transformation. SNS actually
      wins on latency and raw fan-out throughput; neither offers true exactly-once.
    ref: "concepts.md#eventbridge-event-bus-rules-and-content-based-routing"

  - id: aws-messaging-sqs-sns-eventbridge-022
    difficulty: intermediate
    tags: [sns-vs-eventbridge, selection]
    question: |
      A SaaS vendor (e.g. a monitoring provider) wants to push events directly into
      your AWS event-driven architecture. Which service natively supports this?
    options:
      - "SNS via partner topics"
      - "SQS via cross-account queues"
      - "EventBridge via partner (SaaS) event buses"
      - "Kinesis via enhanced fan-out"
    answer: 2
    explanation: |
      EventBridge partner event sources deliver SaaS events onto a dedicated bus — an
      integration SNS and SQS lack. SNS has no "partner topics," cross-account SQS is
      about your own producers, and Kinesis enhanced fan-out is a consumer feature.
    ref: "concepts.md#eventbridge-event-bus-rules-and-content-based-routing"

  - id: aws-messaging-sqs-sns-eventbridge-023
    difficulty: intermediate
    tags: [idempotency, exactly-once]
    question: |
      Given that Standard SQS, SNS, and EventBridge are all at-least-once, what is the
      single most important consumer-side practice?
    options:
      - "Increase the visibility timeout to 12 hours"
      - "Disable retries entirely"
      - "Always use FIFO queues"
      - "Make processing idempotent (e.g. dedup table keyed on message id, conditional writes, natural-key upserts)"
    answer: 3
    explanation: |
      Because duplicates are expected, consumers must be idempotent — dedup tables,
      conditional/versioned writes, or natural-key upserts. Long timeouts don't
      prevent duplicates, FIFO only dedups within a 5-min window for identical ids,
      and disabling retries loses work.
    ref: "concepts.md#idempotency-exactly-once-and-ordering-across-the-stack"

  - id: aws-messaging-sqs-sns-eventbridge-024
    difficulty: intermediate
    tags: [sqs-vs-kinesis, hot-shard]
    question: |
      A design ingests a real-time clickstream into Kinesis Data Streams. What limit
      is most likely to bite first?
    options:
      - "The 256 KB message size limit"
      - "The per-shard ingest limit of 1 MB/s or 1,000 records/s, especially with a hot partition key"
      - "The 14-day retention maximum"
      - "The 120,000 in-flight message limit"
    answer: 1
    explanation: |
      Each Kinesis shard accepts only 1 MB/s or 1,000 records/s in (2 MB/s out); a hot
      partition key overloads one shard (ProvisionedThroughputExceeded). In-flight
      limits are SQS concepts; Kinesis retention goes to 365 days, not 14.
    ref: "concepts.md#sqs-versus-kinesis-versus-kafka-for-the-same-problem"

  - id: aws-messaging-sqs-sns-eventbridge-025
    difficulty: intermediate
    tags: [sqs, in-flight]
    question: |
      What is the approximate maximum number of in-flight (received but not yet
      deleted) messages for a Standard SQS queue?
    options:
      - "1,000"
      - "20,000"
      - "120,000"
      - "Unlimited"
    answer: 2
    explanation: |
      A Standard queue allows up to ~120,000 in-flight messages; FIFO allows ~20,000.
      Exceeding it signals consumers are too slow or the visibility timeout is too
      long. Standard throughput is near-unlimited, but in-flight count is capped.
    ref: "concepts.md#failure-modes-quotas-and-cost-estimation"

  - id: aws-messaging-sqs-sns-eventbridge-026
    difficulty: intermediate
    tags: [eventbridge, archive-replay]
    question: |
      Which EventBridge feature lets you retain events and later reprocess them (e.g.
      after fixing a consumer bug)?
    options:
      - "Archive and replay"
      - "Schema registry"
      - "Input transformer"
      - "Partner event sources"
    answer: 0
    explanation: |
      EventBridge archive stores events and replay re-emits them to matching
      rules/targets — useful for event sourcing, reprocessing, and seeding new
      consumers. SNS has no equivalent. Schema registry, input transformer, and
      partner sources solve different problems.
    ref: "concepts.md#eventbridge-scheduler-pipes-archive-and-replay"

  - id: aws-messaging-sqs-sns-eventbridge-027
    difficulty: intermediate
    tags: [sns, durability, subscription-dlq]
    question: |
      An HTTP subscriber to an SNS topic is down for an hour, longer than the SNS
      retry window. Without extra configuration, what happens to its messages?
    options:
      - "They are stored in SNS for 14 days"
      - "They are automatically routed to a FIFO topic"
      - "They are lost unless a subscription DLQ (redrive policy) is configured"
      - "They are held until the subscriber returns, indefinitely"
    answer: 2
    explanation: |
      SNS itself does not durably store messages; once delivery retries are exhausted,
      messages are dropped unless a subscription DLQ captures them. This is why the
      SNS→SQS pattern (durable buffering) is preferred when consumers may be down.
    ref: "concepts.md#sns-pub-sub-and-the-sns-plus-sqs-fan-out-pattern"

  - id: aws-messaging-sqs-sns-eventbridge-028
    difficulty: intermediate
    tags: [lambda, sqs, partial-batch]
    question: |
      A Lambda consumes SQS in batches of 10. One record in a batch fails while the
      other 9 succeed. What is the best way to avoid reprocessing the 9 good records?
    options:
      - "Set the batch size to 1"
      - "Switch the queue to FIFO"
      - "Increase the visibility timeout to 12 hours"
      - "Use ReportBatchItemFailures (partial batch response) so only the failed record returns to the queue"
    answer: 3
    explanation: |
      ReportBatchItemFailures lets the function return only the failed message ids, so
      the 9 successful records are deleted and only the failure is retried. Batch size
      1 works but destroys batching efficiency; the other options don't address the
      partial-failure problem.
    ref: "concepts.md#dead-letter-queues-redrive-and-poison-messages"

  - id: aws-messaging-sqs-sns-eventbridge-029
    difficulty: intermediate
    tags: [sns, fifo-topic, constraints]
    question: |
      What is a key delivery constraint of an SNS FIFO topic?
    options:
      - "It can only deliver to SQS FIFO queues"
      - "It can deliver to email and SMS but not SQS"
      - "It has unlimited throughput"
      - "It does not support message deduplication"
    answer: 0
    explanation: |
      SNS FIFO topics preserve ordering/dedup and deliver to SQS FIFO queues (with
      subscriber-type constraints). Throughput is capped like SQS FIFO (300/3,000
      batched), and dedup via MessageDeduplicationId is a core FIFO feature.
    ref: "concepts.md#sns-standard-versus-fifo-topics-and-message-filtering"

  - id: aws-messaging-sqs-sns-eventbridge-030
    difficulty: intermediate
    tags: [eventbridge, pipes]
    question: |
      What problem does EventBridge Pipes primarily solve?
    options:
      - "Point-to-point source→filter→enrich→target integration without writing glue Lambda code"
      - "Encrypting events at rest"
      - "Scheduling millions of cron jobs"
      - "Fanning a single publish to 10 million subscribers"
    answer: 0
    explanation: |
      Pipes connect a source (SQS, Kinesis, DynamoDB Streams, MSK/Kafka) to a target
      with optional filtering and enrichment, replacing hand-written shovel Lambdas.
      Scheduling is EventBridge Scheduler; massive fan-out is SNS; encryption is a
      separate concern.
    ref: "concepts.md#eventbridge-scheduler-pipes-archive-and-replay"

  - id: aws-messaging-sqs-sns-eventbridge-031
    difficulty: intermediate
    tags: [cost, batching]
    question: |
      A workload sends 1 billion SQS messages/month. What is the single biggest lever
      to reduce request cost?
    options:
      - "Switching to FIFO queues"
      - "Increasing the visibility timeout"
      - "Batching up to 10 messages per API call to cut request count ~10x"
      - "Enabling server-side encryption"
    answer: 2
    explanation: |
      SQS bills per request; batching 10 messages per SendMessage/Receive/Delete call
      reduces request count ~10x, roughly a 10x cost cut. FIFO is more expensive per
      request, and timeouts/encryption don't change request count.
    ref: "concepts.md#failure-modes-quotas-and-cost-estimation"

  - id: aws-messaging-sqs-sns-eventbridge-032
    difficulty: intermediate
    tags: [sns-vs-eventbridge, latency]
    question: |
      A pricing service must fan out an event to many subscribers with the lowest
      possible latency (tens of milliseconds), simple attribute-based filtering, and
      maximum throughput. Which service fits best?
    options:
      - "EventBridge, because of its schema registry"
      - "Kinesis, because of enhanced fan-out"
      - "SQS FIFO, because ordering guarantees latency"
      - "SNS, because it offers lower latency and higher raw fan-out throughput than EventBridge"
    answer: 3
    explanation: |
      SNS delivers in tens of ms with very high fan-out throughput and supports
      attribute filter policies — ideal here. EventBridge adds ~0.5 s latency and
      routing intelligence you don't need; FIFO caps throughput; Kinesis is a stream,
      not low-latency pub/sub.
    ref: "concepts.md#sns-versus-eventbridge-when-to-use-which"

  - id: aws-messaging-sqs-sns-eventbridge-033
    difficulty: intermediate
    tags: [sqs, heartbeat, visibility]
    question: |
      A job's processing time varies from 10 seconds to 8 minutes. Rather than set one
      large static visibility timeout, what is the better technique?
    options:
      - "Set visibility timeout to 12 hours for safety"
      - "Call ChangeMessageVisibility periodically to extend the lease (heartbeat) as processing continues"
      - "Use short polling"
      - "Move to a FIFO queue"
    answer: 1
    explanation: |
      Heartbeating with ChangeMessageVisibility extends the lease only as long as work
      continues, so a crash triggers reasonably fast redelivery while long jobs aren't
      prematurely redelivered. A blanket 12 h timeout delays recovery from crashes;
      polling mode and FIFO are unrelated.
    ref: "concepts.md#visibility-timeout-polling-and-message-lifecycle"

  - id: aws-messaging-sqs-sns-eventbridge-034
    difficulty: intermediate
    tags: [dlq, retention]
    question: |
      Best practice for DLQ retention relative to the source queue is to make the DLQ
      retention what, compared with the source?
    options:
      - "Longer than the source, so failed messages aren't deleted before you investigate"
      - "Shorter than the source, to save cost"
      - "Exactly equal to the source"
      - "Always the 60-second minimum"
    answer: 0
    explanation: |
      The DLQ should retain messages longer than the source (e.g. source 4 days, DLQ
      14 days) so failures survive long enough to be inspected and redriven. A shorter
      or minimal DLQ retention risks losing the very failures you need to debug.
    ref: "concepts.md#dead-letter-queues-redrive-and-poison-messages"

  - id: aws-messaging-sqs-sns-eventbridge-035
    difficulty: intermediate
    tags: [sqs, monitoring]
    question: |
      Which CloudWatch signal most directly indicates that a queue's consumers are not
      keeping up and work is accumulating?
    options:
      - "NumberOfMessagesSent"
      - "SentMessageSize"
      - "ApproximateNumberOfMessagesVisible (queue depth) growing over time"
      - "ApproximateAgeOfOldestMessage always 0"
    answer: 2
    explanation: |
      A rising ApproximateNumberOfMessagesVisible (and ApproximateAgeOfOldestMessage)
      shows a growing backlog — consumers falling behind. Messages sent and message
      size don't reveal backlog; an age of 0 would mean the queue is being drained
      promptly.
    ref: "concepts.md#failure-modes-quotas-and-cost-estimation"

  - id: aws-messaging-sqs-sns-eventbridge-036
    difficulty: advanced
    tags: [scenario, ordering, fifo, throughput]
    question: |
      You must process account-ledger events with strict per-account ordering at a
      sustained 40,000 events/second across millions of accounts, and duplicate
      processing corrupts balances. Which design is most appropriate?
    options:
      - "Standard SQS with idempotent consumers, ignoring order"
      - "SNS Standard topic fanning out to Lambda"
      - "A single SQS FIFO queue in base mode (300/3,000 msg/s)"
      - "SQS FIFO in high-throughput mode with MessageGroupId = accountId, spreading load across many message groups"
    answer: 3
    explanation: |
      Per-account ordering plus dedup requires FIFO; 40k/s exceeds base FIFO
      (300/3,000), so high-throughput FIFO with a high-cardinality MessageGroupId
      (accountId) is needed to parallelize across groups while ordering per account.
      Standard ignores order; base FIFO can't hit 40k; SNS Standard gives neither
      order nor dedup.
    ref: "concepts.md#sqs-standard-versus-fifo-queues"

  - id: aws-messaging-sqs-sns-eventbridge-037
    difficulty: advanced
    tags: [scenario, fan-out, isolation]
    question: |
      An OrderPlaced event must feed fulfillment (must never lose an order),
      analytics (can lag), search-index (can lag), and fraud-check (fast, idempotent
      Lambda). Which architecture best balances durability and isolation?
    options:
      - "SNS (or EventBridge) fan-out to a dedicated SQS queue per durable consumer (fulfillment, analytics, search) plus a direct Lambda for fraud, each with its own DLQ"
      - "Subscribe all four consumers directly to one SNS topic with no queues"
      - "One shared SQS queue that all four consumers poll"
      - "A single Lambda that synchronously calls all four systems"
    answer: 0
    explanation: |
      A queue per durable consumer gives independent buffering, retention, and DLQs so
      a slow analytics consumer can't affect fulfillment; the fast idempotent fraud
      check can subscribe Lambda directly. Direct-to-SNS risks loss if a consumer is
      down; a shared queue means competing consumers steal each other's messages; a
      synchronous fan-in couples availability.
    ref: "concepts.md#sns-pub-sub-and-the-sns-plus-sqs-fan-out-pattern"

  - id: aws-messaging-sqs-sns-eventbridge-038
    difficulty: advanced
    tags: [scenario, eventbridge-vs-sns, routing]
    question: |
      A large enterprise has 30 microservices emitting 60 event types, several SaaS
      integrations, and needs schema governance plus the ability to replay events
      after bugs. Which is the best backbone?
    options:
      - "A set of SNS topics, one per event type, with filter policies"
      - "A single SQS queue that all services share"
      - "EventBridge custom bus with rules/event patterns, schema registry, partner buses, and archive/replay"
      - "Kinesis Data Streams with one shard per service"
    answer: 2
    explanation: |
      This is EventBridge's sweet spot: content-based routing across many event types,
      SaaS partner buses, schema registry for governance, and archive/replay for
      reprocessing. Dozens of SNS topics become unmanageable and lack replay/registry;
      a shared queue can't route; Kinesis is a stream, not a routing bus.
    ref: "concepts.md#sns-versus-eventbridge-when-to-use-which"

  - id: aws-messaging-sqs-sns-eventbridge-039
    difficulty: advanced
    tags: [scenario, sqs-vs-kinesis, multi-consumer]
    question: |
      Three independent teams (real-time dashboard, ML feature pipeline, cold archive)
      must each read the entire event feed at their own pace, with per-user ordering
      and the ability to replay the last 7 days. Which primitive fits best?
    options:
      - "One SQS Standard queue that all three teams poll"
      - "An SNS topic with three Lambda subscribers"
      - "Three separate SQS FIFO queues populated by triple-writing from the producer"
      - "Kinesis Data Streams with partition key = userId and 7-day retention, each team an independent consumer"
    answer: 3
    explanation: |
      Multiple independent readers of the same data + per-key ordering + replay is a
      log, i.e. Kinesis (partition key userId gives per-user order; retention enables
      replay). A shared SQS queue means competing consumers (each message goes to one
      team); triple-writing FIFO is brittle and loses replay; SNS→Lambda has no replay.
    ref: "concepts.md#sqs-versus-kinesis-versus-kafka-for-the-same-problem"

  - id: aws-messaging-sqs-sns-eventbridge-040
    difficulty: advanced
    tags: [scenario, poison-message, backlog]
    question: |
      A poison message sits at the head of an SQS FIFO message group. What is the most
      accurate description of the impact and mitigation?
    options:
      - "Only that one message is delayed; the rest of the group proceeds normally"
      - "The entire message group is blocked (head-of-line blocking) until the message succeeds or is moved to a DLQ via maxReceiveCount"
      - "The whole queue including other groups is blocked permanently"
      - "SQS automatically skips it after 30 seconds"
    answer: 1
    explanation: |
      FIFO preserves order within a group, so a stuck head-of-line message blocks its
      whole group until it succeeds or maxReceiveCount routes it to a DLQ; other groups
      keep flowing. It doesn't block the entire queue, and SQS never silently skips.
    ref: "concepts.md#dead-letter-queues-redrive-and-poison-messages"

  - id: aws-messaging-sqs-sns-eventbridge-041
    difficulty: advanced
    tags: [scenario, scheduler, tradeoff]
    question: |
      You must fire millions of independent per-user reminders at arbitrary future
      times (up to weeks away). Which approach is best and why?
    options:
      - "EventBridge Scheduler one-time schedules, which scale to millions and support arbitrary future times"
      - "SQS delay queues, setting each message's delay to the reminder time"
      - "A Step Functions state machine per reminder with a long wait state"
      - "A cron Lambda that scans a table every second"
    answer: 0
    explanation: |
      EventBridge Scheduler is purpose-built for millions of one-time/recurring
      schedules at arbitrary times. SQS delay caps at 15 minutes; a Step Functions
      execution per reminder is costly at millions of scale (per-transition billing,
      1-year max); a 1-second scan is inefficient and hard to scale precisely.
    ref: "concepts.md#eventbridge-scheduler-pipes-archive-and-replay"

  - id: aws-messaging-sqs-sns-eventbridge-042
    difficulty: advanced
    tags: [scenario, idempotency, dedup]
    question: |
      Your consumers read a Standard SQS queue and write to DynamoDB. Duplicates
      occasionally cause double-counting. Which is the most robust fix?
    options:
      - "Increase maxReceiveCount so retries never DLQ"
      - "Switch to short polling to reduce duplicates"
      - "Use a conditional DynamoDB write keyed on a business/message id (with TTL) so a duplicate is a no-op"
      - "Rely on SQS to deduplicate Standard queue messages automatically"
    answer: 2
    explanation: |
      A conditional put keyed on the message/business id (idempotency key with TTL)
      makes reprocessing a no-op — the correct at-least-once mitigation. maxReceiveCount
      and polling mode don't affect duplicates; Standard SQS does not deduplicate (only
      FIFO does, within a 5-min window).
    ref: "concepts.md#idempotency-exactly-once-and-ordering-across-the-stack"

  - id: aws-messaging-sqs-sns-eventbridge-043
    difficulty: advanced
    tags: [scenario, ordering, commutativity]
    question: |
      A system currently uses FIFO purely to preserve order, but the throughput
      ceiling is a problem. The operations are counter increments. What is the best
      alternative?
    options:
      - "Split into more FIFO queues arbitrarily"
      - "Increase the visibility timeout"
      - "Add more consumers to the FIFO queue"
      - "Move to Standard SQS and make the operations commutative/idempotent (e.g. atomic increments), so order no longer matters"
    answer: 3
    explanation: |
      Counter increments are commutative; making operations commutative/idempotent lets
      you drop ordering requirements and use unlimited-throughput Standard SQS. Adding
      FIFO queues or consumers doesn't lift the per-group ordering ceiling, and timeout
      changes are irrelevant.
    ref: "concepts.md#idempotency-exactly-once-and-ordering-across-the-stack"

  - id: aws-messaging-sqs-sns-eventbridge-044
    difficulty: advanced
    tags: [failure-modes, region]
    question: |
      Which failure does a single-region SQS/SNS/EventBridge design NOT automatically
      tolerate?
    options:
      - "A full AWS Region outage"
      - "Loss of a single Availability Zone"
      - "A single consumer host crashing"
      - "A brief network blip between producer and the service"
    answer: 0
    explanation: |
      SQS/SNS/EventBridge are regional, multi-AZ managed services that transparently
      survive AZ loss, host crashes, and transient blips (retention/redelivery). A full
      region outage requires explicit cross-region design (global endpoints,
      cross-region buses, per-region active-active).
    ref: "concepts.md#failure-modes-quotas-and-cost-estimation"

  - id: aws-messaging-sqs-sns-eventbridge-045
    difficulty: advanced
    tags: [scenario, sns-vs-eventbridge, cost]
    question: |
      A high-volume system publishes 500 million events/month that simply need to be
      delivered to 3 SQS queues with basic attribute filtering. Cost matters. Which is
      the more cost-effective choice and why?
    options:
      - "EventBridge, at ~$1.00 per million custom events"
      - "Kinesis with 3 enhanced fan-out consumers"
      - "SNS, at ~$0.50 per million publishes with free SQS delivery, using filter policies"
      - "SQS FIFO to guarantee order"
    answer: 2
    explanation: |
      SNS (~$0.50/M publishes, free SQS delivery, attribute filter policies) is about
      half the per-event cost of EventBridge (~$1.00/M) and meets the simple
      routing/fan-out need. EventBridge's routing intelligence isn't needed here;
      Kinesis and FIFO add cost/complexity for no requirement.
    ref: "concepts.md#sns-versus-eventbridge-when-to-use-which"

  - id: aws-messaging-sqs-sns-eventbridge-046
    difficulty: advanced
    tags: [scenario, backlog, recovery]
    question: |
      After an outage, an SQS queue has a 20-million-message backlog and the oldest
      message is 3 days old (retention is 4 days). What is the most important risk to
      manage?
    options:
      - "The queue will run out of storage space"
      - "SNS will stop publishing"
      - "The visibility timeout will reset all messages"
      - "Messages older than the 4-day retention will be deleted before consumers can drain them, causing data loss"
    answer: 3
    explanation: |
      The binding risk is retention: messages approaching 4 days will be permanently
      deleted before the backlog drains, losing data. Mitigations: scale consumers hard,
      or temporarily raise retention. SQS has no fixed storage cap, and visibility
      timeout doesn't reset ages.
    ref: "concepts.md#message-retention-delays-and-large-payloads"

  - id: aws-messaging-sqs-sns-eventbridge-047
    difficulty: advanced
    tags: [scenario, eventbridge-vs-sns, ordering]
    question: |
      A team wants to use EventBridge as its event backbone but also requires strict
      ordering of events per aggregate. What is the accurate trade-off to surface?
    options:
      - "EventBridge guarantees per-source ordering out of the box"
      - "EventBridge does not guarantee ordering; if strict per-aggregate order is required you need FIFO (SQS/SNS FIFO) or a log with a partition key"
      - "EventBridge ordering can be enabled with a FIFO bus flag"
      - "Ordering is guaranteed if you use fewer than 5 targets"
    answer: 1
    explanation: |
      EventBridge is at-least-once and unordered — there is no FIFO bus. Strict
      per-aggregate ordering requires FIFO queues/topics (per message group) or a
      partitioned log (Kinesis/Kafka). Target count is irrelevant to ordering.
    ref: "concepts.md#sns-versus-eventbridge-when-to-use-which"

  - id: aws-messaging-sqs-sns-eventbridge-048
    difficulty: advanced
    tags: [scenario, retry, backoff]
    question: |
      Before relying on a DLQ, what is the better first line of defense against purely
      transient downstream failures in an SQS consumer?
    options:
      - "Bounded in-consumer retries with exponential backoff and jitter, plus visibility extension, so transient errors recover without DLQing"
      - "Set maxReceiveCount to 1"
      - "Disable the DLQ entirely"
      - "Publish failures back to SNS"
    answer: 0
    explanation: |
      Bounded retries with exponential backoff and jitter (extending visibility while
      retrying) recover transient failures without treating them as poison. The DLQ is
      the backstop for genuine poison. maxReceiveCount=1 DLQs everything on first
      failure; disabling the DLQ loses poison messages.
    ref: "concepts.md#dead-letter-queues-redrive-and-poison-messages"

  - id: aws-messaging-sqs-sns-eventbridge-049
    difficulty: advanced
    tags: [scenario, fifo, dedup-window]
    question: |
      A FIFO producer retries a SendMessage after a network timeout, using the same
      MessageDeduplicationId, 90 seconds after the original. What happens?
    options:
      - "A duplicate message is delivered because dedup only covers 5 seconds"
      - "The queue is switched to Standard mode"
      - "The duplicate is accepted by the API but not delivered again, because it is within the 5-minute dedup window"
      - "The original message is deleted and replaced"
    answer: 2
    explanation: |
      FIFO deduplication suppresses messages with a repeated MessageDeduplicationId
      within a 5-minute window, so a 90-second retry is deduped (accepted, not
      redelivered). Beyond 5 minutes the same id would be treated as new — which is why
      exactly-once is only within that window.
    ref: "concepts.md#idempotency-exactly-once-and-ordering-across-the-stack"

  - id: aws-messaging-sqs-sns-eventbridge-050
    difficulty: advanced
    tags: [scenario, claim-check, failure-mode]
    question: |
      Using the S3 claim-check pattern with SQS, what new failure mode must the design
      account for?
    options:
      - "SQS messages will exceed 256 KB"
      - "SNS can no longer subscribe to the queue"
      - "FIFO ordering will break"
      - "The S3 object could be deleted (e.g. by a lifecycle rule) before the consumer reads the pointer, so the consumer must handle a missing object"
    answer: 3
    explanation: |
      With claim-check, the payload lives in S3 and only a pointer is in the queue; if
      the object is deleted before consumption (lifecycle/TTL mismatch), the consumer
      gets a dangling reference and must handle it. The pattern specifically avoids the
      256 KB issue and doesn't affect ordering or SNS subscriptions.
    ref: "concepts.md#message-retention-delays-and-large-payloads"

  - id: aws-messaging-sqs-sns-eventbridge-051
    difficulty: advanced
    tags: [scenario, sqs-vs-kafka, ops]
    question: |
      A team needs Kafka-style semantics (consumer groups, compaction, exactly-once
      within the cluster, Connect ecosystem) but wants minimal operational burden on
      AWS. What is the most appropriate choice?
    options:
      - "Amazon MSK (ideally MSK Serverless) to get Kafka semantics with reduced ops burden"
      - "Self-managed Kafka on EC2"
      - "SQS Standard with idempotent consumers"
      - "SNS FIFO topics"
    answer: 0
    explanation: |
      MSK provides managed Kafka; MSK Serverless further reduces the ops burden of
      brokers/partitions while keeping the Kafka ecosystem. Self-managed Kafka on EC2 is
      the highest ops burden; SQS/SNS don't provide Kafka semantics like compaction,
      consumer-group offsets, or Connect.
    ref: "concepts.md#sqs-versus-kinesis-versus-kafka-for-the-same-problem"

  - id: aws-messaging-sqs-sns-eventbridge-052
    difficulty: advanced
    tags: [scenario, sns-eventbridge, coexist]
    question: |
      An architecture uses EventBridge at the front door for routing and governance but
      also needs the absolute lowest-latency, highest-throughput fan-out for one hot
      event to thousands of subscribers. What is a sound pattern?
    options:
      - "Force everything through EventBridge to keep one tool"
      - "Replace EventBridge entirely with SNS"
      - "Let EventBridge route the hot event to an SNS topic that performs the high-throughput low-latency fan-out (the services coexist)"
      - "Use a single SQS queue for the fan-out"
    answer: 2
    explanation: |
      EventBridge and SNS coexist: use EventBridge for routing/governance and hand the
      latency/throughput-critical fan-out to SNS (an EventBridge target). Forcing
      everything through one service ignores their different strengths; a single SQS
      queue can't fan out to thousands of independent subscribers.
    ref: "concepts.md#sns-versus-eventbridge-when-to-use-which"

  - id: aws-messaging-sqs-sns-eventbridge-053
    difficulty: advanced
    tags: [scenario, eventbridge, targets]
    question: |
      A single EventBridge rule must deliver a matched event to 12 different targets.
      Given the 5-targets-per-rule limit, what is the correct approach?
    options:
      - "It is impossible; EventBridge caps total targets per bus at 5"
      - "Switch the bus to FIFO mode to raise the limit"
      - "Increase the message size to fit all 12 target ARNs"
      - "Create multiple rules with the same event pattern (each up to 5 targets), or fan out via SNS as one target"
    answer: 3
    explanation: |
      The 5-target limit is per rule, not per bus; you add more rules with the same
      pattern, or route to an SNS topic that fans out further. The limit isn't about
      message size, and there is no FIFO EventBridge bus.
    ref: "concepts.md#eventbridge-event-bus-rules-and-content-based-routing"

  - id: aws-messaging-sqs-sns-eventbridge-054
    difficulty: advanced
    tags: [scenario, throttling, eventbridge]
    question: |
      A burst of PutEvents traffic to a custom EventBridge bus starts returning
      ThrottlingException. What are the correct responses?
    options:
      - "There is nothing to do; EventBridge has no quotas"
      - "Batch PutEvents, apply retry with exponential backoff and jitter, and request a quota increase for the region"
      - "Switch every event to 256 KB to slow the producer"
      - "Move to SQS FIFO, which has higher throughput than EventBridge"
    answer: 1
    explanation: |
      PutEvents has per-region quotas (raisable). The fix is batching, backoff+jitter on
      retries, and a quota-increase request. EventBridge does have quotas; inflating
      message size hurts; and SQS FIFO's 300/3,000 ceiling is lower, not higher.
    ref: "concepts.md#failure-modes-quotas-and-cost-estimation"

  - id: aws-messaging-sqs-sns-eventbridge-055
    difficulty: advanced
    tags: [scenario, sqs, decoupling, tradeoff]
    question: |
      What is the PRIMARY trade-off of introducing an SQS queue between a synchronous
      request path and its processing, for a user waiting on a result?
    options:
      - "You gain decoupling and load-leveling but add end-to-end latency and now need a callback/polling/websocket to return the result"
      - "You lose durability of the request"
      - "You gain exactly-once delivery automatically"
      - "You reduce the number of servers to zero"
    answer: 0
    explanation: |
      Async decoupling buys buffering and independent scaling but adds latency and
      forces a mechanism (polling, websocket, callback) to return results to a waiting
      user. Durability actually improves; exactly-once is not automatic; servers aren't
      eliminated.
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-messaging-sqs-sns-eventbridge-056
    difficulty: advanced
    tags: [scenario, sns-sqs, redrive]
    question: |
      In an SNS→SQS fan-out, one consumer's SQS queue accumulates a large backlog while
      the others are healthy. What is the architectural benefit being demonstrated?
    options:
      - "Global ordering across consumers"
      - "Automatic exactly-once delivery"
      - "Failure/backlog isolation: each consumer's own queue absorbs its own slowness without affecting the others"
      - "Reduced SNS publish cost"
    answer: 2
    explanation: |
      Per-consumer queues isolate backlogs and failures — a slow consumer builds its own
      depth without touching the others' throughput. That isolation is the main reason
      to interpose SQS rather than subscribe consumers directly to SNS. It provides
      neither global ordering nor exactly-once.
    ref: "concepts.md#sns-pub-sub-and-the-sns-plus-sqs-fan-out-pattern"

  - id: aws-messaging-sqs-sns-eventbridge-057
    difficulty: advanced
    tags: [scenario, dynamodb-streams, pipes]
    question: |
      You need to react to every DynamoDB item change by filtering certain events and
      enriching them before sending to a downstream API, with no custom shovel code.
      Which is the cleanest fit?
    options:
      - "Subscribe an SNS topic to the DynamoDB table"
      - "Put a FIFO queue in front of DynamoDB"
      - "Poll the table every second with a Lambda"
      - "EventBridge Pipes with the DynamoDB Stream as source, a filter, an enrichment step, and the API as target"
    answer: 3
    explanation: |
      EventBridge Pipes natively consumes DynamoDB Streams and offers built-in
      filter+enrich→target, eliminating glue Lambda. SNS can't subscribe to a table;
      polling is inefficient; a queue in front of DynamoDB doesn't capture changes.
    ref: "concepts.md#eventbridge-scheduler-pipes-archive-and-replay"

  - id: aws-messaging-sqs-sns-eventbridge-058
    difficulty: advanced
    tags: [scenario, fifo-vs-standard, tradeoff]
    question: |
      What do you fundamentally give up by choosing SQS FIFO over Standard, beyond the
      throughput ceiling?
    options:
      - "The absence of head-of-line blocking — a stuck message in a group serializes and blocks that group"
      - "Durability of messages"
      - "The ability to use DLQs"
      - "Server-side encryption"
    answer: 0
    explanation: |
      FIFO's ordering introduces head-of-line blocking within a message group: a slow or
      poison message stalls everything behind it in that group. Standard has no such
      blocking. FIFO retains durability, DLQs (FIFO DLQ), and encryption.
    ref: "concepts.md#sqs-standard-versus-fifo-queues"

  - id: aws-messaging-sqs-sns-eventbridge-059
    difficulty: advanced
    tags: [scenario, cost-estimation]
    question: |
      You process 2 billion SQS messages/month, batching 10 per request. Roughly what
      is the SQS request cost at ~$0.40 per million requests (ignoring the free tier)?
    options:
      - "About $8/month"
      - "About $80/month (200M requests)"
      - "About $800/month"
      - "About $8,000/month"
    answer: 1
    explanation: |
      Batching 10 messages per request turns 2B messages into 200M requests. At
      $0.40 per million requests that is 200M / 1M = 200 units × $0.40 = ~$80/month.
      The $8 figure is the common off-by-10x error; $800/$8,000 ignore batching.
      Batching is the biggest cost lever for SQS.
    ref: "concepts.md#failure-modes-quotas-and-cost-estimation"

  - id: aws-messaging-sqs-sns-eventbridge-060
    difficulty: advanced
    tags: [scenario, sns-fifo, ordered-fanout]
    question: |
      You need ordered fan-out: the same ordered stream of events delivered in order to
      several independent consumers. Which combination works?
    options:
      - "SNS Standard topic → SQS Standard queues"
      - "EventBridge bus → SQS Standard queues"
      - "SNS FIFO topic → SQS FIFO queues, using MessageGroupId for ordering"
      - "A single SQS FIFO queue with multiple competing consumers"
    answer: 2
    explanation: |
      Ordered fan-out requires SNS FIFO topics delivering to SQS FIFO queues, preserving
      order per message group across each subscriber. Standard SNS/EventBridge don't
      order; a single FIFO queue with competing consumers isn't fan-out (each message
      goes to one consumer).
    ref: "concepts.md#sns-standard-versus-fifo-topics-and-message-filtering"

  - id: aws-messaging-sqs-sns-eventbridge-061
    difficulty: expert
    tags: [expert, high-throughput-fifo, hot-group]
    question: |
      A high-throughput FIFO queue is provisioned, but observed throughput is far below
      expectation and one MessageGroupId dominates traffic. What is the root cause?
    options:
      - "High-throughput mode is disabled by default and cannot be enabled"
      - "The visibility timeout is throttling sends"
      - "FIFO queues cannot exceed 300 msg/s under any configuration"
      - "Throughput in FIFO scales by parallelism across message groups; a single hot group is still serialized, so a skewed group key caps effective throughput"
    answer: 3
    explanation: |
      High-throughput FIFO achieves scale by parallelizing across many message groups;
      per-group ordering means one hot group is serialized regardless of mode — the
      classic hot-key problem. The fix is a higher-cardinality, better-distributed group
      key. HT mode is enableable, and it does exceed 300/s.
    ref: "concepts.md#sqs-standard-versus-fifo-queues"

  - id: aws-messaging-sqs-sns-eventbridge-062
    difficulty: expert
    tags: [expert, exactly-once, semantics]
    question: |
      A senior engineer claims their pipeline achieves true end-to-end exactly-once
      using SQS FIFO. What is the most precise correction?
    options:
      - "FIFO does provide end-to-end exactly-once with no caveats"
      - "FIFO gives exactly-once processing only within a 5-minute dedup window for identical dedup ids; reprocessing/redrive later can recur, so consumers should still be idempotent for true end-to-end guarantees"
      - "Only Standard queues can be exactly-once"
      - "Exactly-once requires enabling server-side encryption"
    answer: 1
    explanation: |
      FIFO dedup is bounded to a 5-minute window and identical dedup ids; replays,
      redrives, or downstream retries hours later can still duplicate. True end-to-end
      exactly-once is achieved by idempotent consumers, not by FIFO alone. Standard has
      no dedup; encryption is unrelated.
    ref: "concepts.md#idempotency-exactly-once-and-ordering-across-the-stack"

  - id: aws-messaging-sqs-sns-eventbridge-063
    difficulty: expert
    tags: [expert, ordering, partition-key-design]
    question: |
      For Kinesis with per-user ordering, what is the subtle risk of choosing userId as
      the partition key when a few power users generate most traffic?
    options:
      - "Those users' records hash to the same shard, creating a hot shard that hits the 1 MB/s or 1,000 rec/s limit while other shards idle"
      - "Ordering will be lost for those users"
      - "Kinesis will automatically merge all shards"
      - "The partition key changes the message size limit"
    answer: 0
    explanation: |
      Per-key ordering forces all of a key's records onto one shard; skewed keys create
      a hot shard hitting per-shard limits (ProvisionedThroughputExceeded) while others
      idle. Ordering isn't lost, Kinesis doesn't auto-merge, and partition key doesn't
      change size limits. This mirrors the FIFO hot-group and DynamoDB hot-partition
      problems.
    ref: "concepts.md#sqs-versus-kinesis-versus-kafka-for-the-same-problem"

  - id: aws-messaging-sqs-sns-eventbridge-064
    difficulty: expert
    tags: [expert, multi-region, dr]
    question: |
      A payments system on EventBridge must survive a full-region outage. Which design
      is most appropriate?
    options:
      - "Rely on EventBridge multi-AZ resilience, which covers regional failure"
      - "Increase the archive retention period"
      - "Use EventBridge global endpoints with event replication to a secondary region (or per-region buses in an active-active design) plus idempotent consumers"
      - "Switch the bus to FIFO mode"
    answer: 2
    explanation: |
      Regional services survive AZ loss but not a full region outage; cross-region
      resilience needs global endpoints/event replication or per-region active-active
      buses, with idempotent consumers to handle cross-region duplicates. Multi-AZ
      doesn't cover regional failure; archive/FIFO don't address DR.
    ref: "concepts.md#failure-modes-quotas-and-cost-estimation"

  - id: aws-messaging-sqs-sns-eventbridge-065
    difficulty: expert
    tags: [expert, sqs, in-flight, backpressure]
    question: |
      A Standard queue starts returning errors when your consumer fleet tries to receive
      more messages, and metrics show ~120,000 messages in flight. What is happening and
      the correct fix?
    options:
      - "The queue is out of storage; delete old messages"
      - "The 256 KB limit is being exceeded"
      - "SQS has silently switched to FIFO"
      - "You've hit the ~120,000 in-flight limit because consumers hold messages too long; speed up processing or lower the visibility timeout so messages are deleted or released sooner"
    answer: 3
    explanation: |
      The ~120k in-flight cap for Standard queues is reached when too many messages are
      received-but-undeleted, usually due to slow processing or overly long visibility
      timeouts. Fix by speeding consumers or tightening visibility so messages ack or
      release faster. It's not a storage, type-switch, or size issue.
    ref: "concepts.md#failure-modes-quotas-and-cost-estimation"

  - id: aws-messaging-sqs-sns-eventbridge-066
    difficulty: expert
    tags: [expert, eventbridge-vs-sns, decision]
    question: |
      Give the single strongest reason to choose SNS over EventBridge for a fan-out, and
      the single strongest reason to choose EventBridge over SNS.
    options:
      - "SNS for lowest latency and highest raw fan-out throughput (and lower per-message cost); EventBridge for rich content-based routing/governance, SaaS sources, and archive/replay"
      - "SNS for schema registry; EventBridge for lowest latency"
      - "SNS for replay; EventBridge for SMS delivery"
      - "They are interchangeable with no meaningful differences"
    answer: 0
    explanation: |
      SNS's edge is latency, fan-out throughput, and cost; EventBridge's edge is routing
      intelligence, schema governance, SaaS integration, and archive/replay. The
      "schema registry / lowest latency" distractor swaps their strengths; the
      "SNS for replay / EventBridge for SMS" distractor assigns features to the wrong
      service (SNS does SMS, EventBridge does replay); and they are not interchangeable.
    ref: "concepts.md#sns-versus-eventbridge-when-to-use-which"

  - id: aws-messaging-sqs-sns-eventbridge-067
    difficulty: expert
    tags: [expert, ordering, saga]
    question: |
      In an event-driven saga, step B must never process before step A for a given
      order, but different orders are independent, and volume is high. What is the most
      scalable correct design?
    options:
      - "One global FIFO queue for all orders"
      - "Standard SQS and hope order is preserved"
      - "FIFO with MessageGroupId = orderId (per-order ordering, cross-order parallelism), or per-order sequencing via a log partitioned on orderId"
      - "SNS Standard fan-out with retries"
    answer: 2
    explanation: |
      Per-order ordering with cross-order parallelism is exactly what MessageGroupId =
      orderId (FIFO) or a log partitioned on orderId provides. A single global FIFO group
      serializes everything and won't scale; Standard SQS/SNS can reorder, breaking the
      A-before-B invariant.
    ref: "concepts.md#idempotency-exactly-once-and-ordering-across-the-stack"

  - id: aws-messaging-sqs-sns-eventbridge-068
    difficulty: expert
    tags: [expert, sqs-vs-eventbridge, capacity]
    question: |
      An interviewer asks: "You picked SQS Standard for a work queue. Which limit or
      property forces you to reconsider the design as scale grows?" Which answer is
      strongest?
    options:
      - "The near-unlimited throughput will eventually run out"
      - "SQS Standard requires manual shard management"
      - "SQS Standard cannot use DLQs at scale"
      - "The 256 KB payload limit (needing claim-check for large items) and the ~120k in-flight ceiling if consumers can't keep up — plus lack of ordering/replay if requirements change"
    answer: 3
    explanation: |
      The real design pressures on Standard SQS are payload size (256 KB → claim-check),
      the in-flight ceiling under slow consumers, and the absence of ordering/replay if
      requirements evolve toward a log. Throughput is effectively unlimited, DLQs work at
      any scale, and there are no shards to manage (that's Kinesis).
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-messaging-sqs-sns-eventbridge-069
    difficulty: expert
    tags: [expert, eventbridge, replay-granularity]
    question: |
      What is an accurate limitation of EventBridge replay compared with a Kafka/Kinesis
      consumer replaying from an offset?
    options:
      - "EventBridge replay is faster and finer-grained than offset seeks"
      - "EventBridge replays archived events to matching rules/targets over a time range, which is coarser than a per-consumer offset seek into an ordered log"
      - "EventBridge cannot replay events at all"
      - "Replay requires switching the bus to FIFO"
    answer: 1
    explanation: |
      EventBridge archive/replay re-emits events over a time window to matching
      rules/targets — powerful but coarse compared with a log consumer seeking to a
      precise offset and resuming ordered consumption. It can replay (so option 2 is
      wrong) and doesn't need FIFO.
    ref: "concepts.md#eventbridge-scheduler-pipes-archive-and-replay"

  - id: aws-messaging-sqs-sns-eventbridge-070
    difficulty: expert
    tags: [expert, decision-tree, selection]
    question: |
      Which sequence best reflects a senior engineer's default decision order when
      choosing an AWS messaging primitive?
    options:
      - "Default to the simplest primitive (usually SQS Standard + idempotency); escalate to FIFO for ordering, SNS for fan-out, EventBridge for routing/governance/replay, Kinesis/Kafka for multi-reader ordered replayable streams"
      - "Always start with Kafka for maximum flexibility, then simplify"
      - "Always use EventBridge because it is the newest service"
      - "Choose based solely on which service is cheapest per message"
    answer: 0
    explanation: |
      The senior move is to default to the simplest option that meets the constraint
      (SQS Standard + idempotency) and escalate only when a specific requirement
      demands it (ordering→FIFO, fan-out→SNS, routing/governance/replay→EventBridge,
      multi-reader ordered replay→Kinesis/Kafka). Starting with Kafka or picking by
      novelty/price alone ignores fit.
    ref: "concepts.md#trade-offs-and-when-to-use-what"
