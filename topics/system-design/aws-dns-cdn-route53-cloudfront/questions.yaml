topic: "Edge, DNS and CDN: Route 53, CloudFront and Global Accelerator"
domain: system-design
topic_slug: aws-dns-cdn-route53-cloudfront
version: 1
questions:
  - id: aws-dns-cdn-route53-cloudfront-001
    difficulty: beginner
    tags: [route53, dns, fundamentals]
    question: |
      In AWS's edge stack, what is the primary role of Amazon Route 53?
    options:
      - "It is an authoritative DNS service that resolves domain names to IP addresses (or AWS resources)"
      - "It caches HTTP and HTTPS responses at edge locations close to users to cut latency"
      - "It provides two static anycast IP addresses that route traffic over the AWS backbone"
      - "It terminates TLS at the edge and runs Lambda functions per request"
    answer: 0
    explanation: |
      Route 53 is a managed, highly available authoritative DNS service — it answers
      name-resolution queries for your hosted zones. Caching HTTP is CloudFront (B);
      static anycast IPs over the backbone are Global Accelerator (C); edge TLS +
      Lambda is CloudFront/Lambda@Edge (D). Route 53 is control-plane for names and
      does not sit in the request data path once the client has the IP.
    ref: "concepts.md#route-53-authoritative-dns-hosted-zones-and-record-types"

  - id: aws-dns-cdn-route53-cloudfront-002
    difficulty: beginner
    tags: [cloudfront, cdn, fundamentals]
    question: |
      What kind of traffic can Amazon CloudFront accelerate and cache?
    options:
      - "Any TCP or UDP protocol, including game and VoIP traffic"
      - "HTTP and HTTPS content only"
      - "Only static files stored in Amazon S3"
      - "Only DNS queries"
    answer: 1
    explanation: |
      CloudFront is an HTTP/HTTPS CDN — it understands web semantics and caches
      cacheable responses. It cannot handle arbitrary TCP/UDP (that's Global
      Accelerator, A). It supports many origin types, not just S3 (C), and it is not a
      DNS service (D).
    ref: "concepts.md#cloudfront-cdn-caching-origins-and-cache-behaviors"

  - id: aws-dns-cdn-route53-cloudfront-003
    difficulty: beginner
    tags: [global-accelerator, anycast, fundamentals]
    question: |
      What does AWS Global Accelerator provide as its client-facing entry point?
    options:
      - "A DNS name like d123.cloudfront.net"
      - "A private VPC endpoint reachable only inside a VPC"
      - "Two static anycast IPv4 addresses (optionally IPv6)"
      - "A rotating set of IPs that changes every few minutes"
    answer: 2
    explanation: |
      Global Accelerator gives you two static anycast IP addresses that you can
      hardcode/allowlist; traffic enters the nearest edge and rides the AWS backbone.
      CloudFront exposes a DNS name (A), not static IPs. It is internet-facing, not
      VPC-only (B), and the IPs are static, not rotating (D).
    ref: "concepts.md#aws-global-accelerator-anycast-static-ips-at-the-network-layer"

  - id: aws-dns-cdn-route53-cloudfront-004
    difficulty: beginner
    tags: [route53, records, alias]
    question: |
      Why can't you use a CNAME record at the zone apex (e.g. example.com itself),
      and what does AWS provide instead?
    options:
      - "CNAMEs are deprecated by RFC 8482; use an MX record at the apex instead"
      - "You must buy and register a separate second domain to use at the zone apex"
      - "The apex only supports TXT records, so you point a TXT-based alias at the target"
      - "A CNAME can't coexist with the apex SOA/NS records; use a Route 53 Alias record instead"
    answer: 3
    explanation: |
      DNS rules forbid a CNAME at the apex because it can't coexist with the required
      SOA and NS records there. Route 53's Alias record solves this: it works at the
      apex, resolves internally to AWS resources (CloudFront, ALB, S3, GA), and
      charges nothing for those alias queries. MX/TXT are unrelated record types.
    ref: "concepts.md#route-53-authoritative-dns-hosted-zones-and-record-types"

  - id: aws-dns-cdn-route53-cloudfront-005
    difficulty: beginner
    tags: [route53, routing-policies]
    question: |
      Which Route 53 routing policy routes each user to the AWS Region that gives them
      the lowest network latency?
    options:
      - "Latency-based routing"
      - "Weighted routing"
      - "Geolocation routing"
      - "Simple routing"
    answer: 0
    explanation: |
      Latency-based routing (LBR) sends users to the Region with the lowest
      AWS-measured network latency. Geolocation routes by physical location for
      compliance/localization (C), weighted splits by proportion (B), and simple has
      no logic (D).
    ref: "concepts.md#route-53-routing-policies-choosing-among-them"

  - id: aws-dns-cdn-route53-cloudfront-006
    difficulty: beginner
    tags: [cloudfront, cache-hit]
    question: |
      When CloudFront serves a request from a "cache hit," what happens?
    options:
      - "The PoP fetches a fresh copy from the origin every time"
      - "The nearest edge location returns the stored object without contacting the origin"
      - "Route 53 returns a cached DNS answer for the object's hostname from a nearby resolver"
      - "Global Accelerator forwards the packet to the origin over the backbone"
    answer: 1
    explanation: |
      A cache hit means the edge PoP already has a valid copy and serves it directly,
      avoiding the origin round trip — the whole point of a CDN. Fetching every time
      (A) is a miss/uncacheable. (C) and (D) confuse CloudFront with DNS or GA.
    ref: "concepts.md#cloudfront-cdn-caching-origins-and-cache-behaviors"

  - id: aws-dns-cdn-route53-cloudfront-007
    difficulty: beginner
    tags: [route53, health-checks, failover]
    question: |
      What is the purpose of a Route 53 health check paired with failover routing?
    options:
      - "To extend resolver-side caching of DNS answers so records are looked up far less often"
      - "To compress large DNS response payloads down under the 512-byte UDP limit"
      - "To stop returning an endpoint's record when the endpoint is unhealthy and return the standby instead"
      - "To encrypt the traffic flowing between the client and the origin end to end"
    answer: 2
    explanation: |
      Health checks let Route 53 detect an unhealthy primary and switch to returning
      the secondary (active-passive failover). They don't affect caching (A),
      compression (B), or encryption (D).
    ref: "concepts.md#route-53-health-checks-and-dns-failover-for-dr"

  - id: aws-dns-cdn-route53-cloudfront-008
    difficulty: beginner
    tags: [cloudfront, security, s3, oac]
    question: |
      What is Origin Access Control (OAC) used for with CloudFront and S3?
    options:
      - "To make the S3 bucket publicly readable so anyone can fetch objects directly over the internet"
      - "To resolve the S3 bucket's regional endpoint name in DNS to a set of IP addresses"
      - "To route raw TCP traffic from the CloudFront edge to backend EC2 instances"
      - "To keep the S3 bucket private so only the CloudFront distribution can read it"
    answer: 3
    explanation: |
      OAC restricts an S3 origin so only the CloudFront distribution (via SigV4-signed
      requests) can read it, keeping the bucket private and preventing users from
      bypassing the CDN. It is not about public access (A), TCP routing (C), or DNS
      (B). OAC replaces the legacy OAI.
    ref: "concepts.md#securing-cloudfront-signed-urls-signed-cookies-and-oac"

  - id: aws-dns-cdn-route53-cloudfront-009
    difficulty: beginner
    tags: [global-accelerator, cloudfront, comparison]
    question: |
      What is the most fundamental difference between CloudFront and Global
      Accelerator?
    options:
      - "CloudFront caches HTTP content; Global Accelerator does not cache and works for any TCP/UDP"
      - "CloudFront is strictly cheaper than Global Accelerator in every conceivable traffic scenario"
      - "Global Accelerator only works inside a single AWS Region and cannot span multiple Regions"
      - "CloudFront provides static IP addresses while Global Accelerator provides a DNS name"
    answer: 0
    explanation: |
      CloudFront is an HTTP caching CDN; Global Accelerator is a non-caching L4
      accelerator for any TCP/UDP that provides static anycast IPs. It is not always
      cheaper (B), GA is multi-region (C), and the IP-vs-DNS mapping is reversed (D:
      GA gives static IPs, CloudFront gives a DNS name).
    ref: "concepts.md#global-accelerator-versus-cloudfront-the-key-trade-off"

  - id: aws-dns-cdn-route53-cloudfront-010
    difficulty: beginner
    tags: [shield, ddos, edge]
    question: |
      Which AWS DDoS protection is automatic and free for CloudFront, Global
      Accelerator, and Route 53?
    options:
      - "AWS Shield Advanced"
      - "AWS Shield Standard"
      - "AWS WAF managed rules"
      - "Amazon GuardDuty"
    answer: 1
    explanation: |
      Shield Standard is always-on, free L3/L4 DDoS protection built into the edge
      services. Shield Advanced is the paid tier (A). WAF is L7 filtering you attach
      and pay for (C), and GuardDuty is threat detection, not DDoS mitigation (D).
    ref: "concepts.md#edge-security-aws-shield-waf-and-ddos-protection"

  - id: aws-dns-cdn-route53-cloudfront-011
    difficulty: beginner
    tags: [route53, multivalue, health-checks]
    question: |
      A multivalue answer routing policy returns up to how many records, and what does
      it add over simple routing with multiple IPs?
    options:
      - "Exactly 2 records, always the same order"
      - "Up to 100 records, with no health checking"
      - "Up to 8 records, each independently health-checked"
      - "Unlimited records, sorted by latency"
    answer: 2
    explanation: |
      Multivalue answer returns up to 8 healthy records chosen at random, and crucially
      each record is independently health-checked so dead endpoints are omitted —
      unlike simple routing which returns all IPs including dead ones. The other counts
      and behaviors are wrong.
    ref: "concepts.md#route-53-routing-policies-choosing-among-them"

  - id: aws-dns-cdn-route53-cloudfront-012
    difficulty: beginner
    tags: [cloudfront, tls, certificates]
    question: |
      To use a custom ACM certificate with a CloudFront distribution, in which Region
      must the certificate be requested?
    options:
      - "The Region closest to your origin"
      - "eu-west-1 (Ireland)"
      - "Any Region — CloudFront replicates it automatically"
      - "us-east-1 (N. Virginia)"
    answer: 3
    explanation: |
      CloudFront requires the ACM certificate to live in us-east-1 regardless of where
      your origin or users are, because CloudFront is a global service managed from
      that Region. The other options are incorrect.
    ref: "concepts.md#cloudfront-cdn-caching-origins-and-cache-behaviors"

  - id: aws-dns-cdn-route53-cloudfront-013
    difficulty: beginner
    tags: [route53, hosted-zones]
    question: |
      What distinguishes a Route 53 private hosted zone from a public hosted zone?
    options:
      - "A private hosted zone answers queries only from associated VPCs; a public one answers from the internet"
      - "A private hosted zone is billed at a lower monthly rate but cannot use any health checks"
      - "A private hosted zone supports only TXT records, while a public zone supports the full set"
      - "There is no functional difference; the public/private label is purely cosmetic naming"
    answer: 0
    explanation: |
      A private hosted zone is associated with one or more VPCs and resolves only
      inside them (internal/split-horizon DNS), while a public hosted zone answers
      internet queries. The other statements are fabricated.
    ref: "concepts.md#route-53-authoritative-dns-hosted-zones-and-record-types"

  - id: aws-dns-cdn-route53-cloudfront-014
    difficulty: beginner
    tags: [cloudfront, edge-compute]
    question: |
      Which two edge-compute options does CloudFront offer to run code in the request
      lifecycle?
    options:
      - "Step Functions and EventBridge"
      - "CloudFront Functions and Lambda@Edge"
      - "AWS Batch and Fargate"
      - "Route 53 Resolver and NAT Gateway"
    answer: 1
    explanation: |
      CloudFront Functions (lightweight JS, viewer events, sub-ms) and Lambda@Edge
      (Node/Python, all four event types, up to 30 s) are the two edge-compute
      options. The other services are unrelated to CloudFront's request path.
    ref: "concepts.md#edge-compute-cloudfront-functions-and-lambdaedge"

  - id: aws-dns-cdn-route53-cloudfront-015
    difficulty: intermediate
    tags: [route53, geolocation, latency, compliance]
    question: |
      A company must serve European users exclusively from its Frankfurt (eu-central-1)
      stack for GDPR data-residency, while serving everyone else from us-east-1. Which
      Route 53 routing policy fits, and why not latency-based?
    options:
      - "Latency-based routing, because Frankfurt will always be lowest-latency for EU users"
      - "Weighted routing, splitting traffic 50/50 between the Frankfurt and us-east-1 Regions"
      - "Geolocation routing, because the requirement is about the user's location/compliance, not raw latency"
      - "Simple routing that returns both Region IPs and lets the client pick one at random"
    answer: 2
    explanation: |
      The requirement is location/compliance-based, so geolocation is correct — it
      routes by the user's country/continent regardless of latency. Latency-based (A)
      optimizes speed and could send an EU user elsewhere if latency were lower,
      violating residency. Weighted (B) ignores location; simple (D) has no geo logic.
      Remember to configure a default record for unknown locations.
    ref: "concepts.md#route-53-routing-policies-choosing-among-them"

  - id: aws-dns-cdn-route53-cloudfront-016
    difficulty: intermediate
    tags: [route53, ttl, failover]
    question: |
      With a 60-second TTL and 10-second "fast" health checks, why might real-world
      Route 53 DNS failover still take several minutes?
    options:
      - "Route 53 health checks only run once per hour, so a failed endpoint is detected slowly"
      - "DNS failover requires an operator to manually restart the origin before the standby takes over"
      - "Alias records disable automatic failover entirely, forcing a manual record edit each time"
      - "Recursive resolvers and clients often cache answers beyond the TTL, and detection plus TTL expiry add up"
    answer: 3
    explanation: |
      Failover time = detection latency + TTL expiry + downstream caching. Many
      resolvers/clients ignore or exceed low TTLs (some cache indefinitely), so
      failover realistically takes minutes. Health checks run on 10/30 s intervals, not
      hourly (A); Alias supports failover (C); no manual restart is needed (B). This is
      why Global Accelerator's data-plane failover is used when seconds matter.
    ref: "concepts.md#route-53-health-checks-and-dns-failover-for-dr"

  - id: aws-dns-cdn-route53-cloudfront-017
    difficulty: intermediate
    tags: [cloudfront, cache-key, hit-ratio]
    question: |
      An engineer reports CloudFront's cache hit ratio is near 0%. Which configuration
      is the most likely cause?
    options:
      - "The cache policy forwards all query strings, headers, and cookies into the cache key"
      - "The distribution negotiates HTTP/3 over QUIC with viewers instead of HTTP/2"
      - "Objects are served with fingerprinted (versioned) filenames that change every deploy"
      - "Origin Shield is enabled as a centralized regional caching tier in front of the origin"
    answer: 0
    explanation: |
      Including all query strings/headers/cookies in the cache key fragments the cache
      so almost every request is unique — few hits. HTTP/3 (B) is unrelated to hit
      ratio; versioned filenames (C) actually help; Origin Shield (D) improves offload,
      not hurts it. Fix: minimize the cache key and forward-without-keying via an origin
      request policy, or normalize with a CloudFront Function.
    ref: "concepts.md#cloudfront-cache-keys-ttls-and-invalidation"

  - id: aws-dns-cdn-route53-cloudfront-018
    difficulty: intermediate
    tags: [cloudfront, invalidation, versioning, deploys]
    question: |
      For a web app that deploys its JS/CSS bundles many times per day, what is the
      preferred cache-busting strategy on CloudFront?
    options:
      - "Submit a wildcard /* invalidation on every deploy to purge all cached bundles"
      - "Use fingerprinted (versioned) filenames so each deploy produces new URLs"
      - "Set all cache behaviors' TTLs to 0 so no object is ever cached at the edge"
      - "Disable the CloudFront distribution during each deploy and re-enable it afterward"
    answer: 1
    explanation: |
      Versioned/fingerprinted filenames (app.abc123.js) mean each deploy is a new URL,
      so you never invalidate, hit ratio stays high, and rollback is trivial. Wildcard
      invalidations (A) are slow, incur per-path cost beyond the 1,000/month free tier,
      and cause origin herds. TTL 0 (C) defeats the CDN; disabling CloudFront (D) is
      absurd. Reserve invalidation for emergencies.
    ref: "concepts.md#cloudfront-cache-keys-ttls-and-invalidation"

  - id: aws-dns-cdn-route53-cloudfront-019
    difficulty: intermediate
    tags: [global-accelerator, protocol, use-case]
    question: |
      A multiplayer game backend uses UDP and needs the lowest possible global latency
      plus fast failover between Regions. Which AWS edge service is the right front
      door?
    options:
      - "CloudFront, because it caches the live game state at edge PoPs and relays UDP over its backbone"
      - "Route 53 latency-based routing alone over the public internet, relying on client DNS re-resolution"
      - "Global Accelerator, because it handles UDP over the AWS backbone with ~30 s data-plane failover"
      - "API Gateway with a WebSocket API, since it tunnels raw UDP packets per player at low latency"
    answer: 2
    explanation: |
      Global Accelerator handles any TCP/UDP, routes over the backbone for low
      latency/jitter, and fails over in the data plane (~30 s) without DNS changes —
      ideal for UDP gaming. CloudFront is HTTP-only and doesn't cache mutable game state
      (A). Route 53 alone uses the public internet and slow DNS failover (B). API
      Gateway WebSockets are TCP/HTTP-based, not raw UDP (D).
    ref: "concepts.md#aws-global-accelerator-anycast-static-ips-at-the-network-layer"

  - id: aws-dns-cdn-route53-cloudfront-020
    difficulty: intermediate
    tags: [cloudfront, edge-compute, functions, lambda-edge]
    question: |
      You must validate a signed JWT on every viewer request with sub-millisecond
      overhead and no external calls, at millions of requests per second. Which edge
      option fits best?
    options:
      - "Lambda@Edge on origin-request"
      - "API Gateway Lambda authorizer at the origin"
      - "An ALB with a Lambda authorizer"
      - "A CloudFront Function on viewer-request"
    answer: 3
    explanation: |
      CloudFront Functions run at viewer-request in sub-milliseconds, scale to millions
      rps, and are cheap — perfect for lightweight JWT/HMAC checks needing no network
      access. Lambda@Edge (A) is heavier (ms, ~10k rps/Region) and overkill here.
      ALB/API Gateway authorizers (C, B) run at the origin, adding round-trip latency
      and load — the opposite of edge validation.
    ref: "concepts.md#edge-compute-cloudfront-functions-and-lambdaedge"

  - id: aws-dns-cdn-route53-cloudfront-021
    difficulty: intermediate
    tags: [cloudfront, signed-urls, signed-cookies]
    question: |
      A video platform serves HLS streams where each session fetches hundreds of
      segment files under a common path. How should it restrict access most
      efficiently?
    options:
      - "Signed cookies that grant access to all files matching the path pattern"
      - "A separate signed URL generated and re-signed on demand for every individual segment file the player fetches"
      - "Make the S3 bucket fully public and rely on the segment filenames being long and hard to guess"
      - "Provision and rotate a dedicated CloudFront distribution for each individual viewer session"
    answer: 0
    explanation: |
      Signed cookies grant access to many files matching a pattern without signing each
      URL — ideal for HLS/DASH where a player requests many segments. Per-file signed
      URLs (B) would mean signing hundreds of URLs per session. Public buckets (C) have
      no access control; per-user distributions (D) are absurd. Signed URLs are best
      when it's a single file or the client can't hold cookies.
    ref: "concepts.md#securing-cloudfront-signed-urls-signed-cookies-and-oac"

  - id: aws-dns-cdn-route53-cloudfront-022
    difficulty: intermediate
    tags: [cloudfront, origin-shield, thundering-herd]
    question: |
      What specific problem does CloudFront Origin Shield primarily address?
    options:
      - "It transparently encrypts cached objects at rest in the origin S3 bucket using an AWS-managed KMS key"
      - "It adds a centralized caching layer so many PoP/regional-cache misses collapse into a single origin fetch"
      - "It provides two static anycast IP addresses that clients use to reach the origin directly"
      - "It replaces the need for Route 53 health checks by probing the origin from every edge PoP"
    answer: 1
    explanation: |
      Origin Shield is an extra centralized cache tier that funnels all misses through
      one Region and collapses concurrent requests, so the origin sees at most one fetch
      per object even under a thundering herd across many PoPs. It is not about
      encryption (A), static IPs (C), or DNS health (D).
    ref: "concepts.md#origin-shield-and-multi-tier-caching"

  - id: aws-dns-cdn-route53-cloudfront-023
    difficulty: intermediate
    tags: [route53, weighted, canary, deploys]
    question: |
      You want to send 1% of production traffic to a new backend stack as a canary,
      then gradually ramp. Which Route 53 mechanism, and what is its main limitation?
    options:
      - "Failover routing with a 1% weight on the standby; limitation: it only supports a primary and one secondary record"
      - "Geolocation routing scoped to a test region; limitation: it requires you to supply client IP CIDR-to-location maps"
      - "Weighted routing with weights like 99/1; limitation: shifts are coarse and TTL-bound, not instant"
      - "Multivalue answer with one canary record; limitation: it caps at 8 health-checked records and picks randomly"
    answer: 2
    explanation: |
      Weighted routing splits traffic by integer weights (99/1 for a 1% canary), and
      weight 0 disables a record. Its limitation is that DNS shifts are coarse and
      subject to TTL/resolver caching, so they're not instant or precise — an ALB
      weighted target group is better for fine, immediate splits. The other policies
      don't do proportional splitting.
    ref: "concepts.md#route-53-routing-policies-choosing-among-them"

  - id: aws-dns-cdn-route53-cloudfront-024
    difficulty: intermediate
    tags: [cloudfront, origin-groups, failover]
    question: |
      Which CloudFront feature provides HA at the CDN layer by failing over to a
      secondary origin on specific error status codes, without any DNS change?
    options:
      - "Cache behaviors"
      - "Field-level encryption"
      - "Response headers policy"
      - "Origin groups"
    answer: 3
    explanation: |
      An origin group pairs a primary and failover origin; CloudFront retries the
      secondary on configured status codes (e.g. 500/502/503/504), giving CDN-level
      failover independent of Route 53/DNS. Cache behaviors map paths to origins (A),
      response headers policy sets headers (C), and field-level encryption protects
      POSTed fields (B) — none provide origin failover.
    ref: "concepts.md#cloudfront-cdn-caching-origins-and-cache-behaviors"

  - id: aws-dns-cdn-route53-cloudfront-025
    difficulty: intermediate
    tags: [waf, cloudfront, security, edge]
    question: |
      Why is attaching AWS WAF to a CloudFront distribution generally preferable to
      attaching it only at the origin ALB?
    options:
      - "It filters malicious L7 traffic at the edge before it reaches and consumes origin capacity"
      - "WAF web-ACL and per-request pricing is always strictly lower on CloudFront than on an ALB in every case"
      - "WAF simply cannot be attached to an Application Load Balancer at all, only to CloudFront distributions"
      - "It transparently converts inbound HTTP requests into UDP datagrams at the edge for extra speed"
    answer: 0
    explanation: |
      Filtering at the CloudFront edge blocks bad requests far from the origin,
      protecting origin capacity and keeping attack traffic off your regional resources.
      Pricing isn't uniformly cheaper (B); WAF can attach to ALB too (C); and WAF does
      not change protocols (D).
    ref: "concepts.md#edge-security-aws-shield-waf-and-ddos-protection"

  - id: aws-dns-cdn-route53-cloudfront-026
    difficulty: intermediate
    tags: [route53, alias, cname, cost]
    question: |
      When the target of a DNS record is an AWS resource (CloudFront, ALB, S3 website),
      why prefer a Route 53 Alias record over a CNAME?
    options:
      - "CNAME lookups against AWS-resource targets are metered and billed at roughly 10x the per-query rate of Alias records"
      - "Alias works at the zone apex, resolves internally with no extra lookup, is free for AWS-resource queries, and tracks changing target IPs"
      - "CNAME records are technically incapable of pointing at any AWS resource endpoint such as CloudFront or an ALB"
      - "Alias records automatically force HTTPS on the client by rejecting any plaintext HTTP resolution attempt"
    answer: 1
    explanation: |
      Alias records work at the apex (CNAMEs can't), resolve internally without an extra
      DNS round trip, incur no query charge for AWS-resource targets, and automatically
      follow the target's changing IPs. CNAMEs can point to AWS names (C is wrong) and
      the pricing/forcing-HTTPS claims (A, D) are fabricated.
    ref: "concepts.md#route-53-authoritative-dns-hosted-zones-and-record-types"

  - id: aws-dns-cdn-route53-cloudfront-027
    difficulty: intermediate
    tags: [cloudfront, cost, egress, s3]
    question: |
      At scale, why can putting CloudFront in front of an S3 bucket be *cheaper* than
      serving directly from S3, not just faster?
    options:
      - "S3 storage charges are waived entirely for any bucket once it is attached as a CloudFront origin"
      - "CloudFront waives all per-request (HTTP/HTTPS) charges whenever the origin is an Amazon S3 bucket"
      - "Data transfer from AWS origins (like S3) into CloudFront is free, and cache hits avoid origin requests entirely"
      - "S3 automatically doubles its per-GB egress price when objects are fetched directly without a CDN in front"
    answer: 2
    explanation: |
      Origin fetch traffic from S3 to CloudFront is not charged, and a high hit ratio
      means most requests never touch S3 at all — so you pay CloudFront egress but save
      S3 egress and requests, often netting cheaper at scale. Storage isn't free (A),
      CloudFront still charges per request (B), and S3 doesn't "double" its price (D).
    ref: "concepts.md#designing-low-latency-global-delivery-putting-it-together"

  - id: aws-dns-cdn-route53-cloudfront-028
    difficulty: intermediate
    tags: [global-accelerator, endpoints, traffic-dials]
    question: |
      In Global Accelerator, what does a per-endpoint-group "traffic dial" control?
    options:
      - "The TLS cipher suite and minimum protocol version negotiated at the accelerator's edge listeners"
      - "The cache expiry (TTL) applied to objects the accelerator caches at each edge location before revalidating"
      - "The DNS TTL that resolvers apply to the accelerator's static anycast IP records before re-querying"
      - "The percentage of traffic directed to that Region's endpoint group (for gradual cutover/blast-radius control)"
    answer: 3
    explanation: |
      A traffic dial caps the percentage of traffic an endpoint group (Region) receives,
      enabling gradual cutovers and blast-radius control; endpoint weights split within a
      group. GA doesn't cache (B) or expose a DNS TTL as a dial (C), and dials are not
      about TLS ciphers (A).
    ref: "concepts.md#aws-global-accelerator-anycast-static-ips-at-the-network-layer"

  - id: aws-dns-cdn-route53-cloudfront-029
    difficulty: intermediate
    tags: [cloudfront, http3, protocols]
    question: |
      Which set of modern protocol features does CloudFront support at the edge?
    options:
      - "HTTP/2, HTTP/3 (QUIC), TLS 1.3, and Brotli/Gzip compression"
      - "Only HTTP/1.1 with mandatory TLS 1.0 and no response compression of any kind"
      - "Legacy file and mail protocols such as FTP, FTPS, and SMTP relaying at the edge"
      - "Raw UDP game protocols and arbitrary custom TCP ports tunneled through the edge"
    answer: 0
    explanation: |
      CloudFront supports HTTP/2, HTTP/3 over QUIC, TLS 1.3, and edge compression
      (Brotli/Gzip). It is HTTP-focused, so FTP/SMTP (C) and raw UDP (D) are out of
      scope, and it is far beyond HTTP/1.1-only (B).
    ref: "concepts.md#cloudfront-cdn-caching-origins-and-cache-behaviors"

  - id: aws-dns-cdn-route53-cloudfront-030
    difficulty: intermediate
    tags: [route53, health-checks, cloudwatch]
    question: |
      You need Route 53 failover based on DynamoDB throttling metrics for a resource
      that isn't directly reachable by an HTTP probe. Which health-check type do you
      use?
    options:
      - "Endpoint (HTTP/TCP) health check"
      - "CloudWatch alarm health check"
      - "Calculated health check with string matching"
      - "Route 53 cannot do this"
    answer: 1
    explanation: |
      A CloudWatch alarm health check ties Route 53 health to an alarm's state — the
      only way to health-check something not directly reachable, like DynamoDB
      throttling or queue depth. Endpoint checks (A) need a reachable target; calculated
      checks (C) combine other checks; and Route 53 clearly can do this via CloudWatch
      alarms (D).
    ref: "concepts.md#route-53-health-checks-and-dns-failover-for-dr"

  - id: aws-dns-cdn-route53-cloudfront-031
    difficulty: intermediate
    tags: [cloudfront, cache-policy, origin-request-policy]
    question: |
      Why did CloudFront split cache policies from origin request policies?
    options:
      - "To deliberately double the number of origin API calls so responses stay fresher for every viewer"
      - "Because standalone cache policies are now deprecated and being replaced by origin request policies"
      - "To let you forward a value (e.g. the Authorization header) to the origin without including it in the cache key"
      - "Because origin request policies transparently encrypt the cached objects at rest in the edge storage"
    answer: 2
    explanation: |
      The split lets you forward headers/cookies/query strings to the origin (origin
      request policy) without keying the cache on them (cache policy) — e.g. forward
      Authorization so the origin can authorize, but don't fragment the cache by it.
      Cache policies aren't deprecated (B), it reduces not doubles overhead (A), and
      neither policy is about encryption at rest (D).
    ref: "concepts.md#cloudfront-cache-keys-ttls-and-invalidation"

  - id: aws-dns-cdn-route53-cloudfront-032
    difficulty: intermediate
    tags: [global-accelerator, static-ip, http]
    question: |
      A partner's corporate firewall requires you to give them a fixed set of IP
      addresses to allowlist, but your application is standard HTTPS behind an ALB.
      What is the cleanest AWS solution?
    options:
      - "Give them the CloudFront distribution's DNS name and have their firewall resolve and allowlist whatever IPs it returns"
      - "Ask them to allowlist the entire published AWS public IP range for your Region so every backend IP is covered"
      - "Assign a fixed Elastic IP directly to the Application Load Balancer and hand that single address to the partner"
      - "Put Global Accelerator in front of the ALB and share GA's two static anycast IPs"
    answer: 3
    explanation: |
      GA provides two static anycast IPs you can hand to the partner while fronting the
      HTTPS ALB — the standard "static IP + HTTP" pattern. CloudFront exposes only a DNS
      name with changing IPs (A); ALBs can't take a fixed Elastic IP (C, that's NLB);
      allowlisting all of AWS (B) defeats the purpose.
    ref: "concepts.md#global-accelerator-versus-cloudfront-the-key-trade-off"

  - id: aws-dns-cdn-route53-cloudfront-033
    difficulty: intermediate
    tags: [cloudfront, ttl, cache-control]
    question: |
      For a CloudFront behavior, how do the origin's Cache-Control headers interact with
      the behavior's Min/Default/Max TTL settings?
    options:
      - "The origin's Cache-Control/Expires typically governs, but clamped within the behavior's Min and Max TTL"
      - "The origin's Cache-Control and Expires headers are always ignored entirely in favor of the behavior's Min TTL"
      - "Only the behavior's Default TTL ever applies and the origin's caching headers never influence the duration"
      - "The behavior's Max TTL always overrides every origin header, forcing objects to be cached indefinitely"
    answer: 0
    explanation: |
      The origin's Cache-Control/Expires usually determines caching duration, but
      CloudFront clamps it between the configured Min and Max TTL; Default TTL applies
      only when the origin sends no caching directives. Origin headers are not ignored
      (B, C), and Max TTL bounds but doesn't force infinite caching (D).
    ref: "concepts.md#cloudfront-cache-keys-ttls-and-invalidation"

  - id: aws-dns-cdn-route53-cloudfront-034
    difficulty: intermediate
    tags: [dr, patterns, route53]
    question: |
      Which DR pattern keeps a minimal core running in a second Region, scales it up on
      failure, and uses DNS failover — trading a low standby cost for a tens-of-minutes
      RTO?
    options:
      - "Active-active multi-region"
      - "Pilot light"
      - "Backup and restore"
      - "Origin Shield"
    answer: 1
    explanation: |
      Pilot light keeps a minimal core (e.g. replicated data, dormant infra) that you
      scale up and then fail over to via DNS — low standby cost, tens-of-minutes RTO.
      Active-active (A) is fastest but priciest; backup and restore (C) is cheapest but
      hours-long RTO; Origin Shield (D) is a caching feature, not a DR pattern.
    ref: "concepts.md#route-53-health-checks-and-dns-failover-for-dr"

  - id: aws-dns-cdn-route53-cloudfront-035
    difficulty: intermediate
    tags: [cloudfront, s3, static-website]
    question: |
      When must you use the S3 *static website endpoint* as a CloudFront origin instead
      of the S3 REST endpoint with OAC?
    options:
      - "Only when the S3 bucket happens to reside in the us-east-1 Region where CloudFront is managed"
      - "Always, because Origin Access Control does not work with CloudFront when the origin is any S3 bucket"
      - "When you need S3 website features like index/error documents and redirect rules"
      - "Whenever you want the bucket to remain fully private and unreachable except through the distribution"
    answer: 2
    explanation: |
      The S3 website endpoint is needed for website behaviors (index/error documents,
      redirect rules), but it is HTTP-only and public. For private buckets you use the
      REST endpoint with OAC (which is the recommended default), so OAC clearly works
      (B) and keeps the bucket private (D). Region (A) is irrelevant to this choice.
    ref: "concepts.md#cloudfront-cdn-caching-origins-and-cache-behaviors"

  - id: aws-dns-cdn-route53-cloudfront-036
    difficulty: intermediate
    tags: [global-accelerator, cloudfront, redundant]
    question: |
      For a purely cacheable HTTP website already served by CloudFront, what is usually
      true about adding Global Accelerator in front "for extra speed"?
    options:
      - "It significantly improves the cache hit ratio by adding a second shared caching tier ahead of the PoPs"
      - "It replaces the need for Route 53 by resolving the distribution's hostname from its own anycast IPs"
      - "It is required for HTTPS to work end to end because CloudFront alone cannot terminate TLS at the edge"
      - "It adds little benefit and extra cost, since CloudFront already anycasts and uses the backbone"
    answer: 3
    explanation: |
      CloudFront already uses anycast edges and the AWS backbone and caches content, so
      GA adds little for a pure cacheable-HTTP workload while adding fixed + data
      -transfer-premium cost. GA doesn't cache, so it can't improve hit ratio (A); it's
      not required for HTTPS (C); and it isn't a DNS service replacing Route 53 (B).
    ref: "concepts.md#global-accelerator-versus-cloudfront-the-key-trade-off"

  - id: aws-dns-cdn-route53-cloudfront-037
    difficulty: intermediate
    tags: [route53, sla, availability]
    question: |
      What availability SLA does AWS publish for Route 53's authoritative
      query-answering, and why is that notable?
    options:
      - "100%, because DNS is the front door to everything and must not fail"
      - "99.9%, the three-nines figure most standard AWS services publish"
      - "99.99%, the same four-nines figure Amazon S3 publishes for objects"
      - "There is no SLA at all; DNS answering is purely best-effort"
    answer: 0
    explanation: |
      Route 53 offers a 100% availability SLA for answering DNS queries — the strongest
      AWS commitment — because if name resolution fails, nothing downstream is
      reachable. The other percentages/claims are incorrect.
    ref: "concepts.md#route-53-authoritative-dns-hosted-zones-and-record-types"

  - id: aws-dns-cdn-route53-cloudfront-038
    difficulty: advanced
    tags: [global-accelerator, failover, availability, route53]
    question: |
      A payment API over TCP must fail over between Regions in under a minute without
      relying on client DNS behavior. Compare the options and pick the best.
    options:
      - "Route 53 failover with a 30 s TTL, accepting that some clients cache longer"
      - "Global Accelerator with health checks, which reroutes in the data plane (~30 s) using the same static IPs, independent of DNS"
      - "CloudFront with a short cache TTL, which detects the dead Region on a cache miss and reconnects TCP clients to the standby"
      - "A weighted routing policy split 50/50 across Regions, relying on resolvers to stop handing out the failed Region's weight"
    answer: 1
    explanation: |
      GA fails over inside the data plane in ~30 s while clients keep hitting the same
      two static IPs — no DNS change or TTL/resolver caching involved, meeting the
      sub-minute, DNS-independent requirement. Route 53 failover (A) is bounded by
      resolver/client caching that ignores low TTLs. CloudFront (C) is HTTP-caching, not
      relevant to a TCP payment path's failover. Weighted (D) doesn't remove a failed
      Region promptly and is still DNS-bound.
    ref: "concepts.md#global-accelerator-versus-cloudfront-the-key-trade-off"

  - id: aws-dns-cdn-route53-cloudfront-039
    difficulty: advanced
    tags: [edge-compute, lambda-edge, functions, limits]
    question: |
      You need to rewrite the origin request path, call an external metadata service,
      and use a 20 MB library, all before fetching from the origin. Which edge option
      is viable and why?
    options:
      - "CloudFront Function on viewer-request, because it's fastest and can stream the 20 MB library in from S3 on demand"
      - "CloudFront Function on viewer-response, since response-phase functions are granted outbound network access to metadata services"
      - "Lambda@Edge on origin-request, because it allows network access, larger code (up to 50 MB), and higher memory"
      - "Neither is viable at the edge; this logic must run entirely at the origin behind the load balancer"
    answer: 2
    explanation: |
      Lambda@Edge (origin-request) supports network access, file system access, request
      body access, code/libraries up to 50 MB, and up to 10 GB memory — required here.
      CloudFront Functions (A, B) have no network access, a 10 KB code limit, 2 MB
      memory, and only run on viewer events, so they can't call a service or hold a
      20 MB library. Running at the origin (D) is possible but the question is about
      edge; Lambda@Edge is the viable edge option.
    ref: "concepts.md#edge-compute-cloudfront-functions-and-lambdaedge"

  - id: aws-dns-cdn-route53-cloudfront-040
    difficulty: advanced
    tags: [cloudfront, cache-key, normalization, functions]
    question: |
      Marketing appends unique tracking query strings (utm_*) to every URL, tanking
      CloudFront's hit ratio, but the origin needs to log them. What's the best fix?
    options:
      - "Forward all query strings into the cache key so every distinct utm_* combination is cached correctly and independently"
      - "Schedule a wildcard /* invalidation every hour to flush the fragmented tracking-parameter entries out of the cache"
      - "Set the behavior's Max TTL to 0 so objects are never cached and the utm_* variation stops mattering"
      - "Use a CloudFront Function on viewer-request to normalize/strip utm_* from the cache key, while an origin request policy still forwards them to the origin"
    answer: 3
    explanation: |
      Normalize the cache key (strip utm_* via a CloudFront Function) so cache lookups
      ignore tracking params — restoring hit ratio — while an origin request policy
      still forwards the full query string so the origin can log it. Forwarding utm_*
      into the key (A) is exactly what fragments the cache; disabling caching (C) or
      hourly invalidation (B) defeat the CDN.
    ref: "concepts.md#cloudfront-cache-keys-ttls-and-invalidation"

  - id: aws-dns-cdn-route53-cloudfront-041
    difficulty: advanced
    tags: [route53, geoproximity, geolocation, traffic-flow]
    question: |
      You want to gradually shift more traffic from an over-loaded us-west-2 stack to
      us-east-1 by expanding us-east-1's geographic catchment. Which Route 53 feature
      does exactly this?
    options:
      - "Geoproximity routing with a positive bias on us-east-1 (via Traffic Flow)"
      - "Geolocation routing with country buckets, gradually reassigning individual countries from us-west-2 to us-east-1"
      - "Latency-based routing, which will steadily send more users to us-east-1 as us-west-2 slows under load"
      - "Multivalue answer routing, weighting the us-east-1 record so it appears more often in the returned set"
    answer: 0
    explanation: |
      Geoproximity routing lets you adjust a bias that expands or shrinks a resource's
      catchment area, continuously shifting traffic geographically — configured via
      Route 53 Traffic Flow. Geolocation (B) uses discrete country/state buckets with no
      shifting knob; latency-based (C) optimizes latency, not geographic offload;
      multivalue (D) is health-aware random spreading, not geo-shifting.
    ref: "concepts.md#route-53-routing-policies-choosing-among-them"

  - id: aws-dns-cdn-route53-cloudfront-042
    difficulty: advanced
    tags: [cloudfront, origin-shield, cost, tradeoff]
    question: |
      When is enabling Origin Shield likely NOT worth the extra cost?
    options:
      - "When you have many origins and a low aggregate hit ratio, so extra collapsing of scattered misses meaningfully offloads the origin"
      - "When your object catalog is small and hot, so the base PoP + regional-edge-cache tiers already collapse most origin traffic"
      - "When you serve live video from a fragile origin that benefits from request collapsing during large synchronized viewer spikes"
      - "When you want to pin origin fetches to one Region for compliance and reduce cross-Region calls to a sensitive backend"
    answer: 1
    explanation: |
      For a small, hot catalog the two default cache tiers already collapse most
      requests, so Origin Shield's extra hop and per-request cost buy little. The other
      cases (many origins/low hit ratio, live video/fragile origin, pinning fetches to
      one Region) are exactly when Origin Shield pays off.
    ref: "concepts.md#origin-shield-and-multi-tier-caching"

  - id: aws-dns-cdn-route53-cloudfront-043
    difficulty: advanced
    tags: [design, multi-region, active-active, latency]
    question: |
      Design goal: multi-region active-active web app, lowest latency per user, and
      sub-minute RTO if a Region fails. Which combination is most appropriate?
    options:
      - "Single-region CloudFront only, no DNS logic, relying on the CDN's global PoPs to mask a full Region outage"
      - "Route 53 simple routing to one Region with a backup script that manually rewrites the record when someone notices the outage"
      - "CloudFront for the web tier, with Route 53 latency-based routing plus health checks (or GA) steering to the healthy nearest Region, and origin groups for CDN-level failover"
      - "Global Accelerator alone with no caching and no DNS"
    answer: 2
    explanation: |
      Active-active needs a way to send each user to the nearest healthy Region
      (latency-based routing + health checks, or GA for faster data-plane failover),
      CloudFront to cache/accelerate the web tier, and origin groups for CDN-level
      failover — layering the services. Single-region (A) and simple routing (B) can't
      meet multi-region low-latency + fast RTO. GA alone (D) drops caching and the DNS
      naming layer a web app still benefits from.
    ref: "concepts.md#designing-low-latency-global-delivery-putting-it-together"

  - id: aws-dns-cdn-route53-cloudfront-044
    difficulty: advanced
    tags: [cloudfront, dynamic, backbone, latency]
    question: |
      For a completely dynamic, non-cacheable API, what is the main reason CloudFront
      still reduces end-to-end latency?
    options:
      - "It caches the dynamic responses anyway by fingerprinting the request body so repeat callers get an instant edge hit"
      - "It transparently converts the HTTPS API to UDP at the edge to shave the per-request TCP handshake overhead"
      - "It compresses and pre-resolves the DNS lookup at the PoP so the client skips name resolution on later calls"
      - "It terminates TCP/TLS at a nearby PoP and reuses a warm pooled connection to the origin over the AWS backbone, cutting setup RTTs and jitter"
    answer: 3
    explanation: |
      Even with zero caching, terminating the handshake at a near PoP and riding a warm
      backbone connection to the origin saves the multiple setup round trips to a
      distant origin and reduces jitter/packet loss. It does not cache non-cacheable
      responses (A), doesn't touch DNS lookups (C), and doesn't change protocol (B).
    ref: "concepts.md#edge-networking-mental-model-pops-anycast-and-the-aws-backbone"

  - id: aws-dns-cdn-route53-cloudfront-045
    difficulty: advanced
    tags: [security, oac, oai, sse-kms]
    question: |
      Your S3 objects are encrypted with SSE-KMS and served via CloudFront. Which
      access mechanism must you use, and why not the legacy alternative?
    options:
      - "Origin Access Control (OAC), because it uses SigV4 and supports SSE-KMS-encrypted objects (which OAI does not)"
      - "Origin Access Identity (OAI), the legacy mechanism, which fully supports SSE-KMS objects across all Regions"
      - "A public bucket policy that grants s3:GetObject to everyone and lets CloudFront decrypt KMS objects on the client's behalf"
      - "Signed cookies only, which authorize the CloudFront distribution to decrypt the SSE-KMS objects before caching them"
    answer: 0
    explanation: |
      OAC issues SigV4-signed requests and supports SSE-KMS-encrypted objects, all
      Regions, and dynamic methods — the current best practice. Legacy OAI does not
      support SSE-KMS, so (B) is wrong. A public bucket (C) removes access control, and
      signed cookies (D) restrict viewers but don't authorize CloudFront to read a
      private KMS-encrypted bucket.
    ref: "concepts.md#securing-cloudfront-signed-urls-signed-cookies-and-oac"

  - id: aws-dns-cdn-route53-cloudfront-046
    difficulty: advanced
    tags: [global-accelerator, cost, tradeoff]
    question: |
      What is the primary cost trade-off of adopting Global Accelerator over plain
      internet routing to a regional ALB?
    options:
      - "GA is always free, with its edge fleet and backbone usage bundled into standard AWS data-transfer rates"
      - "You pay a fixed hourly charge per accelerator plus a per-GB data-transfer-premium on top of standard transfer"
      - "GA eliminates all data transfer charges by routing every byte over the internal AWS backbone at no cost"
      - "GA charges only for DNS queries against its static anycast IP records, with the accelerator itself being free"
    answer: 1
    explanation: |
      GA adds a fixed hourly accelerator fee and a data-transfer-premium (DTP) per GB on
      top of normal transfer — so its latency/failover benefits come at a real premium.
      It is not free (A), doesn't eliminate transfer charges (C), and doesn't serve or
      bill DNS queries (D).
    ref: "concepts.md#aws-global-accelerator-anycast-static-ips-at-the-network-layer"

  - id: aws-dns-cdn-route53-cloudfront-047
    difficulty: advanced
    tags: [route53, latency-based, gotcha]
    question: |
      A team enabled latency-based routing but users complain of inconsistent Region
      selection during a partial network event. What is the correct understanding of
      LBR here?
    options:
      - "LBR routes purely by great-circle geographic distance between client and Region, so live network events can't affect its choices"
      - "LBR is deterministic and never changes once the latency table is first computed at zone-creation time"
      - "LBR uses AWS-measured network latency data that can change with network conditions, so the 'fastest' Region can shift; pair it with health checks to avoid routing to a degraded Region"
      - "LBR requires you to upload client CIDR-to-endpoint maps, just like IP-based routing does, before it can measure latency"
    answer: 2
    explanation: |
      LBR chooses by AWS's measured network latency, which is dynamic — during network
      events the lowest-latency Region can change, causing shifts; combining LBR with
      health checks prevents routing to a degraded/unhealthy Region. It is not
      distance-based (A), not static (B), and doesn't need CIDR maps (D — that's
      IP-based routing).
    ref: "concepts.md#route-53-routing-policies-choosing-among-them"

  - id: aws-dns-cdn-route53-cloudfront-048
    difficulty: advanced
    tags: [cloudfront, stale-while-revalidate, resilience]
    question: |
      How can CloudFront keep serving users when the origin briefly errors or is slow to
      revalidate, improving resilience cheaply?
    options:
      - "By enabling Origin Access Control so the edge can keep reading objects even while the origin is returning errors"
      - "By lowering the behavior's TTL to 0 so the edge always has the freshest copy ready when the origin misbehaves"
      - "By switching the viewer connections to UDP so requests survive the brief origin slowdown without retransmits"
      - "By honoring stale-while-revalidate / stale-if-error Cache-Control directives so the edge serves stale content while refreshing or on origin error"
    answer: 3
    explanation: |
      stale-while-revalidate lets the edge serve slightly stale content while
      asynchronously refreshing, and stale-if-error serves stale content when the origin
      errors — cheap resilience and better tail latency. OAC (A) is about S3 access; UDP
      (C) is irrelevant; TTL 0 (B) would increase, not reduce, origin dependence.
    ref: "concepts.md#cloudfront-cache-keys-ttls-and-invalidation"

  - id: aws-dns-cdn-route53-cloudfront-049
    difficulty: advanced
    tags: [design, s3, spa, versioning, tradeoff]
    question: |
      For a single-page-app frontend on S3 + CloudFront, which configuration maximizes
      hit ratio and makes deploys/rollbacks safe?
    options:
      - "Long TTL on fingerprinted asset files (never invalidated) and a short/no-cache setting on index.html so new deploys are picked up"
      - "Short TTL on every file plus a wildcard /* invalidation on each deploy so viewers are guaranteed to see the newest bundle"
      - "Forward all request cookies into the cache key so each visitor gets a personalized, per-session copy of the SPA shell"
      - "Serve the app directly from the public S3 static website endpoint without CloudFront to eliminate the CDN caching layer entirely"
    answer: 0
    explanation: |
      Fingerprinted assets get long TTLs (immutable, near-100% hit ratio, no
      invalidation, trivial rollback), while the small index.html uses a short/no-cache
      TTL so clients fetch the new manifest promptly. Short-TTL-everything + wildcard
      invalidation (B) wrecks hit ratio and cost; forwarding all cookies (C) fragments
      the cache; skipping CloudFront (D) loses caching, TLS, and WAF.
    ref: "concepts.md#designing-low-latency-global-delivery-putting-it-together"

  - id: aws-dns-cdn-route53-cloudfront-050
    difficulty: advanced
    tags: [edge-compute, keyvaluestore, functions]
    question: |
      A CloudFront Function must look up a large, frequently-updated redirect map
      without adding a network call. What AWS feature enables this?
    options:
      - "A DynamoDB direct read issued from the function over CloudFront's edge-to-Region network path"
      - "CloudFront KeyValueStore, a low-latency key-value store readable from CloudFront Functions"
      - "Lambda@Edge environment variables shared into the CloudFront Function's runtime at deploy time"
      - "An S3 GetObject call from the function to fetch the redirect map object on each invocation"
    answer: 1
    explanation: |
      CloudFront KeyValueStore gives Functions a low-latency, updatable key-value lookup
      (feature flags, redirect maps) with no network call — exactly this use case.
      CloudFront Functions have no network access, so DynamoDB (A) and S3 (D) reads are
      impossible from them; Lambda@Edge env vars (C) are a different runtime and not the
      mechanism for a Function.
    ref: "concepts.md#edge-compute-cloudfront-functions-and-lambdaedge"

  - id: aws-dns-cdn-route53-cloudfront-051
    difficulty: advanced
    tags: [route53, failover, alias, evaluate-target-health]
    question: |
      With an Alias record pointing to an ALB, what does enabling "Evaluate Target
      Health" accomplish?
    options:
      - "It caches the ALB's HTTP responses at the Route 53 edge resolvers to speed up repeat requests"
      - "It forces the ALB to adopt static anycast IPs so the Alias record can point at fixed addresses"
      - "It makes the Alias record's health follow the target ALB's own health, so Route 53 stops returning it when the target is unhealthy"
      - "It disables all other endpoint and calculated health checks configured elsewhere in the account"
    answer: 2
    explanation: |
      Evaluate Target Health propagates the ALB/target's own health into the Alias
      record, so Route 53 automatically stops returning an unhealthy target without you
      wiring a separate endpoint health check. It has nothing to do with caching (A),
      static IPs (B), or disabling account-wide health checks (D).
    ref: "concepts.md#route-53-health-checks-and-dns-failover-for-dr"

  - id: aws-dns-cdn-route53-cloudfront-052
    difficulty: advanced
    tags: [cloudfront, field-level-encryption, security]
    question: |
      A form POSTs a credit-card number and you want the CDN and app tiers to never see
      it in plaintext, only a downstream service with the private key. Which CloudFront
      feature fits?
    options:
      - "Signed URLs, which encrypt the credit-card field inside the request path before it reaches the CDN"
      - "Geo-restriction, which blocks the plaintext field from leaving the viewer's own country to the edge"
      - "Origin Shield, which encrypts the POST body at the centralized cache tier before forwarding it"
      - "Field-level encryption, which encrypts specified POST fields at the edge with a public key"
    answer: 3
    explanation: |
      Field-level encryption encrypts specific POSTed fields at the edge using a public
      key so only the holder of the matching private key downstream can decrypt them —
      the CDN and intermediate tiers never see plaintext. Signed URLs (A) control access
      to files, Origin Shield (C) is caching, and geo-restriction (B) blocks by country.
    ref: "concepts.md#securing-cloudfront-signed-urls-signed-cookies-and-oac"

  - id: aws-dns-cdn-route53-cloudfront-053
    difficulty: advanced
    tags: [global-accelerator, custom-routing, gaming]
    question: |
      A game needs to deterministically map a given player to one specific EC2
      instance/port among thousands, while still getting anycast + backbone benefits.
      What does Global Accelerator offer?
    options:
      - "Custom routing accelerators, which map clients to specific EC2 instance/port destinations deterministically"
      - "A standard accelerator, which hashes each player to a random instance within the chosen endpoint group"
      - "CloudFront Lambda@Edge routing, selecting the target EC2 instance and port on the origin-request event"
      - "Route 53 multivalue answer, returning the specific instance's IP so the player always reconnects to it"
    answer: 0
    explanation: |
      Custom routing accelerators deterministically direct a client to a chosen EC2
      instance and port (multiplayer sessions, media rooms) while keeping GA's edge/
      backbone advantages. Standard accelerators (B) balance to endpoint groups, not a
      specific instance/port; CloudFront/Lambda@Edge (C) is HTTP; multivalue (D) is
      random DNS spreading.
    ref: "concepts.md#aws-global-accelerator-anycast-static-ips-at-the-network-layer"

  - id: aws-dns-cdn-route53-cloudfront-054
    difficulty: advanced
    tags: [edge-security, shield-advanced, cost]
    question: |
      When is AWS Shield Advanced (roughly $3,000/month + fees) justified over the free
      Shield Standard?
    options:
      - "For every small hobby website, since the enhanced detection and response tier is recommended for all traffic levels"
      - "For high-value, attack-prone properties needing enhanced detection, DDoS cost-protection credits, the Shield Response Team, and WAF included"
      - "Only when the protected application uses UDP, because Standard covers just TCP-based flood attacks"
      - "Never; Shield Standard already includes cost-protection credits and the response team at no charge"
    answer: 1
    explanation: |
      Shield Advanced makes sense for high-value, frequently-targeted applications where
      you want enhanced detection, cost-protection credits for attack-driven scaling,
      SRT access, and bundled WAF — its cost is only justified there, not for hobby sites
      (A). It's not UDP-specific (C), and Standard does not cover the advanced
      capabilities (D).
    ref: "concepts.md#edge-security-aws-shield-waf-and-ddos-protection"

  - id: aws-dns-cdn-route53-cloudfront-055
    difficulty: advanced
    tags: [route53, ip-based-routing, isp]
    question: |
      An operator knows specific ISP/corporate IP CIDR ranges and wants to steer those
      clients to particular endpoints. Which Route 53 policy is designed for this?
    options:
      - "Geolocation routing that maps discrete country and state buckets"
      - "Latency-based routing to the lowest AWS-measured latency Region"
      - "IP-based routing, where you supply a CIDR-to-location map"
      - "Weighted routing that splits by integer per-record weights"
    answer: 2
    explanation: |
      IP-based routing lets you supply CIDR blocks mapped to endpoints, routing by the
      client's source IP range — useful for ISP-aware or known corporate-range routing.
      Geolocation (A) uses country/state, not arbitrary CIDRs; latency (B) and weighted
      (D) ignore source IP ranges.
    ref: "concepts.md#route-53-routing-policies-choosing-among-them"

  - id: aws-dns-cdn-route53-cloudfront-056
    difficulty: advanced
    tags: [cloudfront, alb, waf, origin-hiding]
    question: |
      Even for a dynamic, uncacheable API behind an ALB, why do teams still put
      CloudFront (or GA) in front?
    options:
      - "To cache the fully dynamic, uncacheable API responses at the edge so repeat callers get instant hits"
      - "Because an Application Load Balancer cannot terminate TLS, so HTTPS must be handled out at the edge"
      - "To downgrade viewer HTTPS connections to plaintext HTTP at the edge, trimming TLS overhead for speed"
      - "To hide the origin IP, add Shield/WAF at the edge, use the backbone, and keep attack traffic off regional capacity"
    answer: 3
    explanation: |
      Fronting the origin with an edge service hides the origin, adds Shield and edge
      WAF, uses the backbone for lower jitter, and keeps attack traffic away from
      regional capacity — the "edge as security perimeter" argument, valid even without
      caching. It doesn't cache uncacheable data (A), doesn't downgrade TLS (C), and
      ALBs do serve HTTPS (B).
    ref: "concepts.md#edge-security-aws-shield-waf-and-ddos-protection"

  - id: aws-dns-cdn-route53-cloudfront-057
    difficulty: advanced
    tags: [cloudfront, invalidation, cost, limits]
    question: |
      What is true about CloudFront invalidation pricing and behavior that makes it a
      poor routine deploy mechanism?
    options:
      - "The first 1,000 invalidation paths per month are free, then you pay per path; wildcard invalidations are slow and cause origin herds"
      - "Invalidations propagate instantly across all edge PoPs and are always free, with no monthly path cap at all"
      - "Invalidations are only processed during a fixed weekly Tuesday maintenance window enforced by AWS"
      - "Each invalidation also permanently deletes the underlying object from the origin S3 bucket"
    answer: 0
    explanation: |
      Only the first 1,000 paths/month are free; beyond that each path is billed, and
      wildcard invalidations propagate slowly (seconds–minutes) and can trigger origin
      fetch herds — hence versioned filenames are preferred for routine deploys.
      Invalidations aren't instant/free (B) and don't touch S3 objects (D); the
      "Tuesdays" claim (C) is nonsense.
    ref: "concepts.md#cloudfront-cache-keys-ttls-and-invalidation"

  - id: aws-dns-cdn-route53-cloudfront-058
    difficulty: advanced
    tags: [design, capacity, hit-ratio, estimation]
    question: |
      A site serves 20,000 requests/sec globally through CloudFront with a measured 95%
      cache hit ratio. Roughly what request rate should you size the origin for
      (ignoring bursts)?
    options:
      - "20,000 req/s — the origin must absorb every viewer request"
      - "About 1,000 req/s — only the ~5% of misses reach the origin"
      - "0 req/s — CloudFront never once contacts the origin"
      - "40,000 req/s — CloudFront doubles the request load"
    answer: 1
    explanation: |
      With a 95% hit ratio only ~5% of 20,000 = ~1,000 req/s reach the origin, so you
      size the origin for the miss traffic (plus headroom for bursts/cold cache), not
      peak viewer rps. The origin does see misses (not 0, C), doesn't see everything (A),
      and CloudFront doesn't amplify load (D). Request collapsing/Origin Shield can
      reduce origin load further.
    ref: "concepts.md#designing-low-latency-global-delivery-putting-it-together"

  - id: aws-dns-cdn-route53-cloudfront-059
    difficulty: advanced
    tags: [cloudfront, functions-vs-lambda-edge, triggers]
    question: |
      Which statement about event-trigger support is correct for CloudFront edge
      compute?
    options:
      - "CloudFront Functions can run on origin-request and origin-response events, just like Lambda@Edge does"
      - "Lambda@Edge is restricted to the viewer-request and viewer-response events only, never the origin-side triggers"
      - "CloudFront Functions run only on viewer-request and viewer-response; Lambda@Edge supports all four (including origin-request/response)"
      - "Both CloudFront Functions and Lambda@Edge run on all four event types with completely identical capabilities"
    answer: 2
    explanation: |
      CloudFront Functions are limited to viewer-request and viewer-response, while
      Lambda@Edge supports all four trigger points including origin-request and
      origin-response (needed for dynamic origin selection, body access, etc.). (A) and (D)
      overstate Functions' triggers, and (B) understates Lambda@Edge's.
    ref: "concepts.md#edge-compute-cloudfront-functions-and-lambdaedge"

  - id: aws-dns-cdn-route53-cloudfront-060
    difficulty: expert
    tags: [route53, failover, split-brain, active-active]
    question: |
      An active-active multi-region system uses Route 53 latency routing with health
      checks. During a network partition, health checkers in different locations
      disagree about a Region's health. What is the realistic consequence and mitigation?
    options:
      - "Route 53's checker fleet guarantees a single globally consistent view of Region health, so a partition changes nothing and every resolver returns the identical answer"
      - "Failover happens instantaneously and identically across every resolver worldwide the moment any single checker observes a fault"
      - "The entire hosted zone is taken offline and stops answering all queries until the network partition has fully healed"
      - "Different resolvers may get different answers transiently (partial routing inconsistency); mitigate with a health-check threshold/quorum, conservative failover, and idempotent/replicated backends that tolerate a Region being served briefly"
    answer: 3
    explanation: |
      Route 53 health decisions come from a distributed checker fleet; during a
      partition results can be inconsistent, so some clients keep hitting a Region others
      avoid. You mitigate with health-check thresholds/quorum, conservative failover, and
      backends designed to tolerate it (idempotency, cross-region replication) rather
      than assuming global consistency (A, B). The zone doesn't go offline (C).
    ref: "concepts.md#route-53-health-checks-and-dns-failover-for-dr"

  - id: aws-dns-cdn-route53-cloudfront-061
    difficulty: expert
    tags: [global-accelerator, client-ip, nlb, alb]
    question: |
      A security team requires the origin to see the true client IP for logging/WAF, and
      you front an NLB with Global Accelerator. What must you consider?
    options:
      - "Enable client IP preservation on the GA endpoint (supported for ALB/EC2 endpoints), being aware of security-group/route implications, or extract it from proxy-protocol/X-Forwarded-For as appropriate"
      - "GA always overwrites the source with its own edge IP, so the true client address is permanently unrecoverable at the origin"
      - "The true client IP is only ever visible when fronting with CloudFront's X-Forwarded-For, and Global Accelerator can never expose it"
      - "You must disable Global Accelerator's endpoint health checks entirely, since they overwrite the preserved client IP field"
    answer: 0
    explanation: |
      GA supports client IP preservation for ALB/EC2 endpoints (with associated
      security-group and routing considerations); otherwise the origin sees GA's IPs and
      you rely on proxy protocol / X-Forwarded-For where applicable. GA does not always
      strip the IP (B), client IP isn't CloudFront-exclusive (C), and disabling health
      checks (D) has nothing to do with it.
    ref: "concepts.md#aws-global-accelerator-anycast-static-ips-at-the-network-layer"

  - id: aws-dns-cdn-route53-cloudfront-062
    difficulty: expert
    tags: [cloudfront, negative-caching, error-handling]
    question: |
      During an origin outage, CloudFront starts caching 5xx errors and serving them to
      everyone, extending the outage's blast radius. What is the correct design response?
    options:
      - "Increase the behavior's Max TTL so the 5xx responses are cached even longer and fewer requests reach the origin"
      - "Configure short error-caching (custom error min TTL) and use stale-if-error / origin groups so the edge serves last-good content or fails over instead of pinning fresh errors"
      - "Disable the CloudFront distribution entirely for the duration of every origin outage so viewers connect straight to the origin"
      - "Forward all viewer cookies into the cache key so each request bypasses the cached error and re-fetches from the origin"
    answer: 1
    explanation: |
      CloudFront caches error responses too; keep the error-caching (min) TTL short and
      lean on stale-if-error (serve last-good) and origin groups (fail over) so a
      transient origin error isn't pinned and broadcast. Longer Max TTL (A) worsens it;
      disabling CloudFront (C) removes protection; forwarding all cookies (D) destroys
      hit ratio without fixing error caching.
    ref: "concepts.md#cloudfront-cache-keys-ttls-and-invalidation"

  - id: aws-dns-cdn-route53-cloudfront-063
    difficulty: expert
    tags: [design, global-accelerator, cloudfront, combined]
    question: |
      A global platform has (1) a cacheable web/media tier over HTTPS and (2) a
      real-time UDP telemetry ingestion tier that partners must allowlist by IP. What is
      the best edge design?
    options:
      - "Put both the web/media tier and the UDP telemetry tier behind a single shared CloudFront distribution"
      - "Put both tiers behind one Global Accelerator, giving up CloudFront caching and edge compute for the web tier"
      - "CloudFront for the HTTPS web/media tier and a separate Global Accelerator (static IPs) for the UDP telemetry tier, with Route 53 naming both"
      - "Use Route 53 latency routing only, over the public internet, for both tiers, with no CloudFront or GA at all"
    answer: 2
    explanation: |
      The two tiers have different needs: cacheable HTTPS suits CloudFront; UDP + static
      -IP allowlisting suits Global Accelerator — so use both, named via Route 53. A
      single CloudFront (A) can't do UDP; a single GA (B) gives up caching/edge compute
      for the web tier; Route 53-only over public internet (D) forgoes backbone/edge
      benefits and can't offer static IPs the way GA does.
    ref: "concepts.md#designing-low-latency-global-delivery-putting-it-together"

  - id: aws-dns-cdn-route53-cloudfront-064
    difficulty: expert
    tags: [route53, dns, delegation, ns]
    question: |
      After creating a public hosted zone for example.com, users still can't resolve it
      from the internet. What is the most likely root cause?
    options:
      - "A public hosted zone cannot answer any queries until a CloudFront distribution is attached as its front door"
      - "Route 53 public hosted zones can only ever resolve for clients inside an associated VPC, never the open internet"
      - "You must enable Global Accelerator and point its static anycast IPs at the zone before the internet can resolve it"
      - "The domain's registrar is not delegating to the four Route 53 name servers (NS/delegation set) assigned to the hosted zone"
    answer: 3
    explanation: |
      A public hosted zone only becomes authoritative once the registrar's NS records
      point to the four Route 53 name servers in the zone's delegation set; without that
      delegation, the internet never asks Route 53. CloudFront/GA (A, C) are unrelated to
      delegation, and public zones do resolve from the internet, not just a VPC (D —
      that's private zones).
    ref: "concepts.md#route-53-authoritative-dns-hosted-zones-and-record-types"

  - id: aws-dns-cdn-route53-cloudfront-065
    difficulty: expert
    tags: [cloudfront, tls, sni, dedicated-ip]
    question: |
      A legacy client base cannot do SNI (Server Name Indication) but must reach your
      custom domain over HTTPS on CloudFront. What is the trade-off you face?
    options:
      - "You can use CloudFront's dedicated-IP custom SSL (extra monthly cost) to serve HTTPS to non-SNI clients, versus the default free SNI-based SSL"
      - "SNI is strictly mandatory on CloudFront, and no configuration will serve HTTPS to a non-SNI client"
      - "You must migrate the site to Global Accelerator, since only its static anycast IPs serve HTTPS without SNI"
      - "You must disable HTTPS and serve plaintext HTTP to the legacy non-SNI clients while keeping HTTPS elsewhere"
    answer: 0
    explanation: |
      CloudFront's default SNI custom SSL is free but requires SNI-capable clients; for
      legacy non-SNI clients you can pay for dedicated-IP custom SSL — a cost trade-off
      for broader client compatibility. SNI isn't strictly mandatory (B), GA doesn't
      solve TLS SNI for a web app (C), and disabling HTTPS (D) is unacceptable.
    ref: "concepts.md#cloudfront-cdn-caching-origins-and-cache-behaviors"

  - id: aws-dns-cdn-route53-cloudfront-066
    difficulty: expert
    tags: [design, latency-vs-availability, tradeoff]
    question: |
      You must choose the failover mechanism for a global TCP API. Rank the trade-off
      among Route 53 failover, CloudFront origin groups, and Global Accelerator.
    options:
      - "All three mechanisms fail over in essentially the same amount of time, so the choice is purely about cost"
      - "Route 53 failover is cheapest but slowest (TTL/resolver-bound, minutes); CloudFront origin groups fail over at the CDN layer for HTTP without DNS; Global Accelerator gives ~30 s data-plane failover for any TCP/UDP at a premium"
      - "Global Accelerator is by far the slowest option, since its reroute is bounded by DNS TTL and resolver caching"
      - "CloudFront origin groups fail over transparently for arbitrary UDP and raw TCP protocols, not just for HTTP"
    answer: 1
    explanation: |
      The spectrum: Route 53 failover is cheapest but slowest and DNS-bound; CloudFront
      origin groups fail over at the CDN layer (HTTP only) without DNS; GA offers the
      fastest (~30 s) data-plane failover for any TCP/UDP but at a cost premium. They do
      not fail over equally (A), GA is fastest not slowest (C), and origin groups are
      HTTP-only (D).
    ref: "concepts.md#trade-offs-and-when-to-use-what"

  - id: aws-dns-cdn-route53-cloudfront-067
    difficulty: expert
    tags: [edge-compute, blast-radius, deploy]
    question: |
      What is a key operational risk of pushing significant business logic into
      Lambda@Edge or CloudFront Functions versus keeping it at the origin?
    options:
      - "Edge function code cannot be logged or monitored at all, so failures stay invisible to operators"
      - "Edge functions execute in only a single Region, so any defect is contained to that one location's traffic"
      - "A bad edge deploy propagates globally and affects all traffic, with slower rollback and harder debugging than a single-region origin deploy"
      - "Edge functions substantially increase origin load, because every invocation triggers an extra origin fetch"
    answer: 2
    explanation: |
      Edge code executes across the global fleet, so a defect has a global blast radius,
      rolls back more slowly, and is harder to debug than a contained origin deploy —
      hence keep edge logic minimal and stateless. Edge functions are logged/monitored
      (A), run globally not single-Region (B), and reduce rather than increase origin
      load (D).
    ref: "concepts.md#edge-compute-cloudfront-functions-and-lambdaedge"

  - id: aws-dns-cdn-route53-cloudfront-068
    difficulty: expert
    tags: [route53, weighted, alb, precision, tradeoff]
    question: |
      For a precise, instant 0.5% canary within a single Region, why is an ALB weighted
      target group usually better than Route 53 weighted records?
    options:
      - "Route 53 is entirely incapable of weighted routing, so any traffic split must be done on the ALB itself"
      - "Route 53 weighted routing is billed per individual request, while ALB weighted target groups are entirely free"
      - "ALB weighted target groups apply their split globally across every Region simultaneously, unlike DNS weighting"
      - "DNS weighting is coarse and TTL/resolver-cache-bound (slow, imprecise), whereas ALB splits per-request instantly and precisely, but only within one Region"
    answer: 3
    explanation: |
      ALB weighted target groups split traffic per-request, so a 0.5% share is exact and
      takes effect immediately; Route 53 weighting is DNS-level, coarse, and bounded by
      TTL/resolver caching. Route 53 can do weighted routing (A), ALB weighting is
      single-Region not global (C), and the billing claim (B) isn't the deciding factor.
    ref: "concepts.md#route-53-routing-policies-choosing-among-them"

  - id: aws-dns-cdn-route53-cloudfront-069
    difficulty: expert
    tags: [cloudfront, geo-restriction, waf, layered]
    question: |
      You must block a country entirely at the CDN AND apply nuanced L7 rules (rate
      limits, bot control) for allowed regions. What is the correct layering?
    options:
      - "Use CloudFront geo-restriction (or WAF geo-match) to block the country plus AWS WAF managed/rate-based rules for the nuanced L7 policies at the edge"
      - "Use only CloudFront geo-restriction to handle both the country block and all the nuanced L7 rate-limit and bot rules"
      - "Use Route 53 geolocation routing to send the blocked country to a null endpoint and rely on it for the L7 rules too"
      - "Use Global Accelerator's L4 packet filtering to drop the blocked country's packets and enforce the nuanced L7 rules"
    answer: 0
    explanation: |
      Geo-restriction/WAF geo-match handles the blanket country block, while WAF
      managed and rate-based rules provide the nuanced L7 controls — layered at the
      CloudFront edge. Geo-restriction alone (B) can't do rate limits/bot control; Route
      53 geolocation (C) can be bypassed by anyone who resolves the endpoint directly and
      isn't a security control; GA (D) is L4 and not a country-blocking web control.
    ref: "concepts.md#edge-security-aws-shield-waf-and-ddos-protection"

  - id: aws-dns-cdn-route53-cloudfront-070
    difficulty: expert
    tags: [design, cell-based, multi-region, edge]
    question: |
      A team wants a cell-based, blast-radius-limited multi-region architecture where a
      bad cell can be drained quickly at the edge. Which combination best supports rapid,
      controlled draining?
    options:
      - "Route 53 simple routing pointing at a single record, letting clients retry when a cell happens to be unhealthy"
      - "Route 53 weighted/geoproximity (or GA traffic dials) to shift traffic away from a cell, plus health checks to auto-drain unhealthy cells and CloudFront/GA to front them"
      - "A single global Application Load Balancer fronting every cell, with no DNS-level routing or draining logic at all"
      - "Only client-side retries and backoff, with no server-side routing control to drain a specific bad cell"
    answer: 1
    explanation: |
      Cell-based designs need a routing control knob to drain a cell: Route 53
      weighted/geoproximity or GA traffic dials shift traffic away, health checks
      auto-drain unhealthy cells, and CloudFront/GA front them for edge benefits. Simple
      routing (A) and a single global ALB (C) offer no per-cell draining; client retries
      alone (D) don't control routing.
    ref: "concepts.md#designing-low-latency-global-delivery-putting-it-together"

  - id: aws-dns-cdn-route53-cloudfront-071
    difficulty: intermediate
    tags: [cloudfront, regional-edge-cache, tiers]
    question: |
      Between the viewer-facing PoP and the origin, what intermediate CloudFront tier
      helps improve hit ratio for less-popular objects before Origin Shield?
    options:
      - "The Route 53 resolver cache that stores recent DNS answers"
      - "A NAT gateway placed on the path between the edge PoP and origin"
      - "The regional edge cache, a larger cache tier that many PoPs share"
      - "An S3 Transfer Acceleration endpoint fronting the origin bucket"
    answer: 2
    explanation: |
      CloudFront has regional edge caches — larger caches that sit between the many
      edge PoPs and the origin, catching long-tail objects and improving hit ratio
      before requests reach the (optional) Origin Shield and then the origin. NAT
      gateways (B), Route 53 (A), and S3 Transfer Acceleration (D) are unrelated tiers.
    ref: "concepts.md#origin-shield-and-multi-tier-caching"

  - id: aws-dns-cdn-route53-cloudfront-072
    difficulty: intermediate
    tags: [global-accelerator, backbone, jitter]
    question: |
      Beyond static IPs, what is the core performance mechanism by which Global
      Accelerator improves latency for a distant TCP client?
    options:
      - "It caches the TCP payloads at the nearest edge PoP so repeat requests skip reaching the endpoint"
      - "It transparently downgrades the client's TCP connection to UDP at the edge to avoid handshake round trips"
      - "It compresses all packets in transit across the AWS backbone to reduce the bytes sent to the endpoint"
      - "The client connects to the nearest anycast edge, and traffic then rides the AWS backbone to the endpoint, reducing internet hops, jitter, and packet loss"
    answer: 3
    explanation: |
      GA gets the client onto the AWS backbone at the nearest edge, so most of the path
      avoids the congested public internet — lowering latency, jitter, and loss. GA does
      not cache payloads (A), does not compress packets (C), and does not change the
      client's protocol (B).
    ref: "concepts.md#aws-global-accelerator-anycast-static-ips-at-the-network-layer"

  - id: aws-dns-cdn-route53-cloudfront-073
    difficulty: beginner
    tags: [route53, ttl, tradeoff]
    question: |
      What is the trade-off of setting a very low DNS TTL (e.g. 30 seconds) on a record?
    options:
      - "Faster change/failover propagation, but more DNS queries (higher cost/load) and some resolvers may ignore very low TTLs"
      - "Slower failover, because a low TTL makes resolvers cache the record for longer, though it guarantees a perfect cache-hit ratio at every downstream resolver"
      - "It transparently encrypts every DNS response with DNSSEC signatures, which Route 53 only enables once the record's TTL drops below 60 seconds"
      - "It has no effect on failover speed, since Route 53 failover is driven purely by health-check intervals and completely ignores the record's configured TTL value"
    answer: 0
    explanation: |
      Low TTLs speed up propagation and failover but increase query volume (cost/load),
      and many resolvers clamp or ignore very low TTLs. High TTLs are cheaper and more
      resilient but slow to change. It doesn't encrypt anything (C) and definitely
      affects failover speed (B, D).
    ref: "concepts.md#route-53-authoritative-dns-hosted-zones-and-record-types"

  - id: aws-dns-cdn-route53-cloudfront-074
    difficulty: beginner
    tags: [edge, latency, fundamentals]
    question: |
      Roughly, why does serving from a nearby edge PoP beat going to a distant origin
      Region for connection setup?
    options:
      - "Distant origin Regions are configured to refuse inbound HTTPS from far-away clients, so the edge PoP has to proxy the handshake locally on their behalf"
      - "TLS and TCP setup take round trips; doing them against a ~10 ms PoP instead of a ~150 ms origin saves hundreds of milliseconds before the first byte"
      - "Edge PoPs run a proprietary faster variant of the TCP protocol that origin Regions cannot use, eliminating the three-way handshake entirely for nearby clients"
      - "Origin Regions can only serve one client connection at a time, so the nearby edge PoP fans out and multiplexes many waiting clients onto that single origin socket"
    answer: 1
    explanation: |
      Connection/TLS setup costs multiple round trips; against a near PoP each RTT is
      ~10 ms versus ~150 ms to a distant origin, saving hundreds of ms before content
      flows — then the edge reuses a warm backbone connection to the origin. The other
      options are false.
    ref: "concepts.md#edge-networking-mental-model-pops-anycast-and-the-aws-backbone"
