topic: "Cloud Offerings: Storage, Data & Communication"
domain: system-design
topic_slug: ccp-offerings-storage-data-communication
version: 1
questions:
- id: ccp-offerings-storage-data-communication-001
  difficulty: beginner
  tags: [block-storage, intent, storage-offerings]
  question: |
    Which Cloud Computing Pattern answers the intent "How can central storage be
    accessed as a local drive by servers and hosted applications?"
  options:
  - "Block Storage"
  - "Key-Value Storage"
  - "Relational Database"
  - "Blob Storage"
  answer: 0
  explanation: |
    Block Storage presents centralized, network-attached storage to a server as if it
    were a locally attached hard disk (a "block device"), so the OS mounts it through
    the local file system. Blob Storage is for whole objects fetched by key, not a
    mountable disk.
  ref: "concepts.md#block-storage"

- id: ccp-offerings-storage-data-communication-002
  difficulty: beginner
  tags: [blob-storage, intent, storage-offerings]
  question: |
    A team needs to store user-uploaded videos and virtual server images and fetch
    each whole object over the network by a unique name. Which pattern fits?
  options:
  - "Message-oriented Middleware"
  - "Block Storage"
  - "Relational Database"
  - "Blob Storage"
  answer: 3
  explanation: |
    Blob Storage stores large binary objects in a directory-like hierarchy, each with
    a unique identifier (key), retrieved as whole objects over the network. That is
    exactly the media/server-image use case.
  ref: "concepts.md#blob-storage"

- id: ccp-offerings-storage-data-communication-003
  difficulty: intermediate
  tags: [block-storage, blob-storage, selection]
  question: |
    You must run a relational database engine that expects a mountable POSIX file
    system with low-latency random-access writes and fsync. Which storage offering
    pattern is the right backing store?
  options:
  - "Key-Value Storage, because it scales out"
  - "Message-oriented Middleware, because it buffers writes"
  - "Blob Storage, because it is elastic and durable"
  - "Block Storage, because it appears to the OS as a local disk"
  answer: 3
  explanation: |
    A database engine needs a mountable file system with random-access, low-latency
    block operations. Block Storage provides exactly that (EBS/Azure Disk/Persistent
    Disk). Blob Storage only offers whole-object get/put and cannot be mounted as a
    disk for a running database.
  ref: "concepts.md#block-storage"

- id: ccp-offerings-storage-data-communication-004
  difficulty: intermediate
  tags: [blob-storage, modern-equivalent]
  question: |
    Which set of managed services are the modern realization of the Blob Storage
    pattern across clouds?
  options:
  - "Amazon RDS, Azure SQL Database, Google Cloud SQL"
  - "Amazon SQS, Azure Service Bus, Google Pub/Sub"
  - "Amazon EBS, Azure Managed Disks, Google Persistent Disk"
  - "Amazon S3, Azure Blob Storage, Google Cloud Storage"
  answer: 3
  explanation: |
    S3, Azure Blob Storage, and GCS are object stores — the Blob Storage pattern. EBS
    and friends are Block Storage; RDS is Relational Database; SQS is Message-oriented
    Middleware.
  ref: "concepts.md#blob-storage"

- id: ccp-offerings-storage-data-communication-005
  difficulty: beginner
  tags: [relational-database, intent]
  question: |
    Which pattern's intent is "How can data elements be stored so that relationships
    among them are captured and expressive queries are enabled to retrieve required
    information effectively?"
  options:
  - "Relational Database"
  - "Blob Storage"
  - "Eventual Consistency"
  - "Key-Value Storage"
  answer: 0
  explanation: |
    The Relational Database pattern organizes data into tables with foreign-key
    relationships validated during data manipulation, enabling expressive (SQL)
    queries. Key-Value Storage deliberately sacrifices query expressiveness.
  ref: "concepts.md#relational-database"

- id: ccp-offerings-storage-data-communication-006
  difficulty: intermediate
  tags: [key-value-storage, intent, scale-out]
  question: |
    The Key-Value Storage pattern deliberately sacrifices one property to gain another.
    Which trade-off does it make?
  options:
  - "It sacrifices query expressiveness to gain scale-out and a flexible structure"
  - "It sacrifices availability to gain strict consistency"
  - "It sacrifices scale-out to gain referential integrity"
  - "It sacrifices durability to gain lower cost"
  answer: 0
  explanation: |
    Key-Value Storage stores (key, value) pairs with little or no schema. It gives up
    rich, cross-table querying so that a lookup targets a single key and can be routed
    to one node — enabling horizontal scale-out and a flexible, adjustable structure.
  ref: "concepts.md#key-value-storage"

- id: ccp-offerings-storage-data-communication-007
  difficulty: intermediate
  tags: [relational-database, key-value-storage, selection]
  question: |
    A shopping-cart service needs extreme write throughput, an evolving record shape,
    and access dominated by lookups on a single user/session id — with no joins.
    Which pattern best fits?
  options:
  - "Key-Value Storage"
  - "Block Storage"
  - "Relational Database"
  - "Blob Storage"
  answer: 0
  explanation: |
    Single-key access, high write throughput, flexible schema, and no joins are the
    signature of Key-Value Storage (DynamoDB, Cosmos DB, Bigtable). A Relational
    Database would fight you on scale-out and rigid schema here.
  ref: "concepts.md#key-value-storage"

- id: ccp-offerings-storage-data-communication-008
  difficulty: intermediate
  tags: [relational-database, selection, integrity]
  question: |
    An accounting system must enforce that every invoice line references a real
    product and support ad-hoc joins and multi-row ACID transactions. Which pattern is
    the natural choice?
  options:
  - "Eventual Consistency"
  - "Key-Value Storage"
  - "Blob Storage"
  - "Relational Database"
  answer: 3
  explanation: |
    Enforced foreign-key integrity, joins, and multi-row ACID transactions are exactly
    what the Relational Database pattern provides. Key-Value Storage pushes integrity
    into the application and offers no joins.
  ref: "concepts.md#relational-database"

- id: ccp-offerings-storage-data-communication-009
  difficulty: beginner
  tags: [strict-consistency, intent, consistency]
  question: |
    Which pattern's intent is "How can data be distributed among replicas to increase
    availability while ensuring data consistency at all times?"
  options:
  - "Eventual Consistency"
  - "Strict Consistency"
  - "At-least-once Delivery"
  - "Key-Value Storage"
  answer: 1
  explanation: |
    Strict Consistency replicates data but guarantees that every read sees the latest
    write "at all times" via overlapping read/write quorums. Eventual Consistency
    relaxes that "at all times" requirement.
  ref: "concepts.md#strict-consistency"

- id: ccp-offerings-storage-data-communication-010
  difficulty: advanced
  tags: [strict-consistency, quorum]
  question: |
    In the Strict Consistency pattern with n replicas, r read replicas, and w write
    replicas, which relationship guarantees a read always sees the latest write?
  options:
  - "r = w = 1"
  - "r + w < n"
  - "r + w = n"
  - "r + w > n"
  answer: 3
  explanation: |
    Strict Consistency requires the read and write quorums to overlap by at least one
    replica, which holds when r + w > n. That overlap guarantees any read set contains
    a replica from the most recent write set.
  ref: "concepts.md#strict-consistency"

- id: ccp-offerings-storage-data-communication-011
  difficulty: beginner
  tags: [eventual-consistency, intent, consistency]
  question: |
    Which pattern relaxes consistency so that fewer replicas are touched on reads and
    writes, with updates propagated asynchronously so replicas converge over time?
  options:
  - "Strict Consistency"
  - "Eventual Consistency"
  - "Transaction-based Delivery"
  - "Relational Database"
  answer: 1
  explanation: |
    Eventual Consistency touches fewer replicas (the quorum overlap is not satisfied)
    and lets changes propagate asynchronously. Replicas may be briefly stale but
    converge in the absence of new writes.
  ref: "concepts.md#eventual-consistency"

- id: ccp-offerings-storage-data-communication-012
  difficulty: intermediate
  tags: [strict-consistency, eventual-consistency, selection]
  question: |
    A global product-catalog read path prioritizes low latency and availability, and
    can tolerate a few seconds of staleness after an edit. Which consistency pattern
    fits best?
  options:
  - "Strict Consistency"
  - "Eventual Consistency"
  - "Transaction-based Delivery"
  - "Exactly-once Delivery"
  answer: 1
  explanation: |
    Tolerating brief staleness in exchange for low latency and high availability is
    the Eventual Consistency trade-off. Strict Consistency would add coordination
    latency and reduce availability under partitions.
  ref: "concepts.md#eventual-consistency"

- id: ccp-offerings-storage-data-communication-013
  difficulty: advanced
  tags: [strict-consistency, eventual-consistency, selection]
  question: |
    An inventory counter must never oversell the last unit; a read must reflect the
    most recent decrement. Which consistency pattern should back it?
  options:
  - "Timeout-based Delivery"
  - "Blob Storage"
  - "Eventual Consistency"
  - "Strict Consistency"
  answer: 3
  explanation: |
    Correctness on every read (no stale count) is the Strict Consistency use case —
    overlapping quorums so a read sees the latest write. Eventual Consistency could let
    a stale read oversell.
  ref: "concepts.md#strict-consistency"

- id: ccp-offerings-storage-data-communication-014
  difficulty: intermediate
  tags: [eventual-consistency, modern-equivalent]
  question: |
    Which of the following is the clearest real-world example of the Eventual
    Consistency pattern?
  options:
  - "A single-node PostgreSQL transaction"
  - "An etcd quorum write"
  - "A DynamoDB strongly consistent read"
  - "DNS propagation and CDN edge caches converging after an update"
  answer: 3
  explanation: |
    DNS and CDN edge caches let replicas serve slightly stale data and converge over
    time — textbook Eventual Consistency. Strongly consistent DynamoDB reads, a
    single-node transaction, and etcd quorum writes all provide strict/strong
    consistency.
  ref: "concepts.md#eventual-consistency"

- id: ccp-offerings-storage-data-communication-015
  difficulty: intermediate
  tags: [virtual-networking, intent, isolation]
  question: |
    Which pattern answers "How can network connectivity between cloud-hosted IT
    resources be set up dynamically and on-demand?" while isolating tenants on shared
    physical hardware?
  options:
  - "Message-oriented Middleware"
  - "Hypervisor"
  - "Virtual Networking"
  - "Block Storage"
  answer: 2
  explanation: |
    Virtual Networking virtualizes NICs, switches, routers, and firewalls so tenants
    configure isolated networks on-demand over shared physical hardware. The
    Hypervisor virtualizes compute, not the network topology.
  ref: "concepts.md#virtual-networking"

- id: ccp-offerings-storage-data-communication-016
  difficulty: advanced
  tags: [virtual-networking, isolation]
  question: |
    Two tenants each configure the private CIDR range 10.0.1.0/24 in their own cloud
    networks without any collision. Which pattern makes this possible?
  options:
  - "Strict Consistency"
  - "Virtual Networking"
  - "Blob Storage"
  - "Elastic Load Balancer"
  answer: 1
  explanation: |
    Virtual Networking overlays isolate each tenant's address space in software over
    shared physical hardware, so identical private CIDR ranges never collide across
    tenants.
  ref: "concepts.md#virtual-networking"

- id: ccp-offerings-storage-data-communication-017
  difficulty: intermediate
  tags: [virtual-networking, modern-equivalent]
  question: |
    Which services are the modern realization of the Virtual Networking pattern?
  options:
  - "SQS, Service Bus, Pub/Sub"
  - "RDS, Azure SQL, Cloud SQL"
  - "S3, Azure Blob Storage, GCS"
  - "AWS VPC, Azure Virtual Network, Google VPC"
  answer: 3
  explanation: |
    AWS VPC, Azure VNet, and Google VPC (plus overlay/CNI plugins like Calico/Cilium)
    are the Virtual Networking pattern: on-demand, isolated, software-defined networks
    over shared hardware.
  ref: "concepts.md#virtual-networking"

- id: ccp-offerings-storage-data-communication-018
  difficulty: beginner
  tags: [message-oriented-middleware, intent, messaging]
  question: |
    Which pattern's intent is "How can communication partners exchange data
    asynchronously with one another?"
  options:
  - "Relational Database"
  - "Message-oriented Middleware"
  - "Transaction-based Delivery"
  - "Virtual Networking"
  answer: 1
  explanation: |
    Message-oriented Middleware is the async broker that decouples partners in time,
    space, and format, handling addressing, availability of partners, and format
    transformation. The delivery patterns describe guarantees *within* it.
  ref: "concepts.md#message-oriented-middleware"

- id: ccp-offerings-storage-data-communication-019
  difficulty: intermediate
  tags: [message-oriented-middleware, decoupling]
  question: |
    Message-oriented Middleware decouples communication partners along which
    dimensions?
  options:
  - "In time, space (addressing), and message format"
  - "Only in message format"
  - "In consistency and durability only"
  - "Only in time (they can run at different moments)"
  answer: 0
  explanation: |
    The middleware handles addressing, availability of communication partners, and
    format transformation — decoupling partners in time (need not be up together),
    space (need not know each other's address), and format.
  ref: "concepts.md#message-oriented-middleware"

- id: ccp-offerings-storage-data-communication-020
  difficulty: intermediate
  tags: [message-oriented-middleware, modern-equivalent]
  question: |
    Which set of technologies are modern realizations of Message-oriented Middleware?
  options:
  - "SQS/SNS, Azure Service Bus, Google Pub/Sub, Kafka"
  - "RDS, Azure SQL, Cloud SQL"
  - "EBS, Azure Disk, Persistent Disk"
  - "S3, Azure Blob, GCS"
  answer: 0
  explanation: |
    SQS/SNS, Service Bus, Pub/Sub, and Kafka are Message-oriented Middleware. The other
    options are block storage, blob storage, and relational databases respectively.
  ref: "concepts.md#message-oriented-middleware"

- id: ccp-offerings-storage-data-communication-021
  difficulty: beginner
  tags: [exactly-once-delivery, intent, delivery]
  question: |
    Which delivery pattern answers "How can it be assured that a message is delivered
    exactly once to a receiver?"
  options:
  - "At-least-once Delivery"
  - "Exactly-once Delivery"
  - "Timeout-based Delivery"
  - "Transaction-based Delivery"
  answer: 1
  explanation: |
    Exactly-once Delivery tags each message with a unique identifier so the messaging
    system can detect and discard duplicates, ensuring only one copy reaches the
    receiver.
  ref: "concepts.md#exactly-once-delivery"

- id: ccp-offerings-storage-data-communication-022
  difficulty: intermediate
  tags: [exactly-once-delivery, dedup, mechanism]
  question: |
    In the Exactly-once Delivery pattern, what mechanism actually prevents a receiver
    from processing the same message twice?
  options:
  - "Synchronous acknowledgements with retransmission"
  - "A distributed ACID transaction across broker and consumer"
  - "A unique message identifier used to detect and filter duplicates"
  - "A visibility timeout that hides the message after reading"
  answer: 2
  explanation: |
    Each message gets a unique identifier at creation; the messaging system uses it to
    filter duplicates automatically. Exactly-once is essentially at-least-once plus
    deduplication. Visibility timeouts and ACID transactions are different delivery
    patterns.
  ref: "concepts.md#exactly-once-delivery"

- id: ccp-offerings-storage-data-communication-023
  difficulty: advanced
  tags: [exactly-once-delivery, idempotency, tradeoffs]
  question: |
    Why do most production systems implement "at-least-once delivery plus an idempotent
    consumer" instead of true end-to-end Exactly-once Delivery?
  options:
  - "Because at-least-once never produces duplicates"
  - "Because at-least-once guarantees ordering and exactly-once does not"
  - "Because exactly-once transport is costly (dedup windows, coordination) and idempotency yields the same exactly-once effect more cheaply"
  - "Because idempotent consumers cannot process duplicates"
  answer: 2
  explanation: |
    True end-to-end exactly-once transport requires the broker to maintain dedup state
    and often extra coordination, hurting throughput and availability. An idempotent
    consumer makes duplicates harmless, achieving the exactly-once *effect* at lower
    cost — so at-least-once + idempotency is the common choice.
  ref: "concepts.md#exactly-once-delivery"

- id: ccp-offerings-storage-data-communication-024
  difficulty: beginner
  tags: [at-least-once-delivery, intent, delivery]
  question: |
    In At-least-once Delivery, how does the sender/broker guarantee a message is
    received?
  options:
  - "It marks the message invisible until acknowledged"
  - "It assigns each message a unique id and filters duplicates"
  - "It waits for an acknowledgement and retransmits if none arrives in time"
  - "It reads the message under an ACID transaction"
  answer: 2
  explanation: |
    At-least-once Delivery relies on acknowledgement plus retransmission: if no ack
    arrives within the expected window, the message is resent. A lost ack can cause a
    duplicate, which is acceptable in this pattern's target scenarios.
  ref: "concepts.md#at-least-once-delivery"

- id: ccp-offerings-storage-data-communication-025
  difficulty: intermediate
  tags: [at-least-once-delivery, idempotency]
  question: |
    At-least-once Delivery may deliver duplicates. Which companion pattern makes those
    duplicates harmless on the consumer side?
  options:
  - "Strict Consistency"
  - "Virtual Networking"
  - "Blob Storage"
  - "Idempotent Processor"
  answer: 3
  explanation: |
    An Idempotent Processor can process repeated copies of the same message without
    changing the outcome, so the duplicates that at-least-once (and timeout-based)
    delivery can produce become safe.
  ref: "concepts.md#at-least-once-delivery"

- id: ccp-offerings-storage-data-communication-026
  difficulty: advanced
  tags: [at-least-once-delivery, duplicates, mechanism]
  question: |
    Under At-least-once Delivery, what specific failure most commonly causes a
    duplicate delivery even though the message was processed correctly?
  options:
  - "The acknowledgement is lost, so the sender retransmits an already-processed message"
  - "The visibility timeout is set too long"
  - "The read transaction rolls back"
  - "The message itself is lost in transit"
  answer: 0
  explanation: |
    If the message is processed but its *ack* is lost, the sender never learns of
    success and retransmits — producing a duplicate. This is why at-least-once needs
    idempotent consumers.
  ref: "concepts.md#at-least-once-delivery"

- id: ccp-offerings-storage-data-communication-027
  difficulty: beginner
  tags: [transaction-based-delivery, intent, delivery]
  question: |
    Which delivery pattern's intent is "How can it be ensured that messages are deleted
    from a queue only if they have been received successfully?"
  options:
  - "Transaction-based Delivery"
  - "Exactly-once Delivery"
  - "At-least-once Delivery"
  - "Timeout-based Delivery"
  answer: 0
  explanation: |
    Transaction-based Delivery binds reading and deleting a message into a single ACID
    transaction: commit removes the message, rollback leaves it in the queue.
    Timeout-based Delivery achieves a similar safety property without a transaction.
  ref: "concepts.md#transaction-based-delivery"

- id: ccp-offerings-storage-data-communication-028
  difficulty: intermediate
  tags: [transaction-based-delivery, acid, mechanism]
  question: |
    In Transaction-based Delivery, what happens to a message if the consuming client's
    transaction rolls back?
  options:
  - "The message becomes invisible for the visibility timeout"
  - "The message is permanently deleted"
  - "The message remains in the queue for another attempt"
  - "The message is duplicated to a dead-letter queue immediately"
  answer: 2
  explanation: |
    Because read-and-delete are one atomic unit, a rollback un-does the delete: the
    message stays available in the queue for a retry. Only a commit removes it.
  ref: "concepts.md#transaction-based-delivery"

- id: ccp-offerings-storage-data-communication-029
  difficulty: advanced
  tags: [transaction-based-delivery, selection, tradeoffs]
  question: |
    A consumer must write to a relational database and consume a message as a single
    all-or-nothing unit, and a transactional resource manager (XA) is available. Which
    delivery pattern fits best?
  options:
  - "At-least-once Delivery"
  - "Transaction-based Delivery"
  - "Eventual Consistency"
  - "Timeout-based Delivery"
  answer: 1
  explanation: |
    Joining the message consumption and the database write into one ACID/XA
    transaction so both commit or both roll back is exactly Transaction-based Delivery.
    Timeout-based delivery gives at-least-once but not atomic coupling with the DB
    write.
  ref: "concepts.md#transaction-based-delivery"

- id: ccp-offerings-storage-data-communication-030
  difficulty: beginner
  tags: [timeout-based-delivery, intent, delivery]
  question: |
    Which delivery pattern retains a message but marks it invisible for a bounded
    window, redelivering it if no acknowledgement arrives before the timeout?
  options:
  - "Exactly-once Delivery"
  - "Timeout-based Delivery"
  - "Strict Consistency"
  - "Transaction-based Delivery"
  answer: 1
  explanation: |
    Timeout-based Delivery hides a read message for a visibility timeout. If the
    consumer acks in time the message is deleted; if the timeout elapses, the message
    becomes visible again and is redelivered — at-least-once without a transaction.
  ref: "concepts.md#timeout-based-delivery"

- id: ccp-offerings-storage-data-communication-031
  difficulty: intermediate
  tags: [timeout-based-delivery, sqs, modern-equivalent]
  question: |
    Amazon SQS's visibility timeout is the canonical real-world example of which
    delivery pattern?
  options:
  - "Exactly-once Delivery"
  - "Transaction-based Delivery"
  - "Timeout-based Delivery"
  - "Strict Consistency"
  answer: 2
  explanation: |
    SQS hides a received message for the visibility timeout and redelivers it if the
    consumer does not delete (ack) it in time — the Timeout-based Delivery pattern,
    giving at-least-once semantics without XA.
  ref: "concepts.md#timeout-based-delivery"

- id: ccp-offerings-storage-data-communication-032
  difficulty: advanced
  tags: [timeout-based-delivery, tuning, tradeoffs]
  question: |
    With Timeout-based Delivery, what is the risk of setting the visibility timeout too
    short for the actual processing time?
  options:
  - "A slow-but-alive consumer exceeds the timeout, so the message is redelivered and processed twice"
  - "The queue will refuse new messages"
  - "The consumer will never receive the message"
  - "Messages will be lost permanently"
  answer: 0
  explanation: |
    If a consumer is still working when the timeout expires, the message reappears and
    another consumer picks it up — a duplicate. Too long, and recovery after a real
    crash is delayed. This is why idempotent consumers are still needed.
  ref: "concepts.md#timeout-based-delivery"

- id: ccp-offerings-storage-data-communication-033
  difficulty: advanced
  tags: [timeout-based-delivery, transaction-based-delivery, distinction]
  question: |
    Both Timeout-based and Transaction-based Delivery avoid losing a message if a
    consumer crashes mid-processing. What is the key distinction?
  options:
  - "They are identical; the names are interchangeable"
  - "Timeout-based needs a distributed ACID transaction; Transaction-based does not"
  - "Transaction-based binds read-and-delete in an ACID transaction; Timeout-based uses a visibility timeout and needs no transaction"
  - "Timeout-based guarantees exactly-once; Transaction-based guarantees at-most-once"
  answer: 2
  explanation: |
    Transaction-based Delivery uses an ACID/XA transaction so read-and-delete commit or
    roll back together. Timeout-based Delivery achieves the same no-loss property more
    cheaply via a visibility timeout and redelivery, but only gives at-least-once (so
    duplicates are possible).
  ref: "concepts.md#transaction-based-delivery"

- id: ccp-offerings-storage-data-communication-034
  difficulty: intermediate
  tags: [delivery, distinction, exactly-once-delivery, at-least-once-delivery]
  question: |
    Which statement best captures the relationship between Exactly-once and
    At-least-once Delivery?
  options:
  - "They provide identical guarantees"
  - "Exactly-once = at-least-once minus acknowledgements"
  - "Exactly-once = at-least-once plus duplicate detection via unique message ids"
  - "At-least-once = exactly-once plus a visibility timeout"
  answer: 2
  explanation: |
    Exactly-once builds on at-least-once (ack + retransmit ensures arrival) and adds
    deduplication by unique message id to discard the resulting duplicates — hence
    "exactly once."
  ref: "concepts.md#exactly-once-delivery"

- id: ccp-offerings-storage-data-communication-035
  difficulty: intermediate
  tags: [block-storage, blob-storage, distinction]
  question: |
    Which statement correctly distinguishes Block Storage from Blob Storage?
  options:
  - "Block Storage appears as a mountable local disk to one server; Blob Storage stores whole objects fetched by key over the network by many clients"
  - "Both are mountable file systems with identical semantics"
  - "Blob Storage supports random-access byte writes; Block Storage does not"
  - "Block Storage stores whole objects by key; Blob Storage is a mountable disk"
  answer: 0
  explanation: |
    Block Storage is a network-attached disk mounted (usually) by one server for
    random-access, POSIX-style I/O. Blob Storage stores whole objects addressed by key,
    fetched over the network concurrently by many clients — not a mountable disk.
  ref: "concepts.md#block-storage"

- id: ccp-offerings-storage-data-communication-036
  difficulty: advanced
  tags: [message-oriented-middleware, delivery, mapping]
  question: |
    The four delivery patterns (Exactly-once, At-least-once, Transaction-based,
    Timeout-based) are best understood as what, relative to Message-oriented
    Middleware?
  options:
  - "The different delivery guarantees the middleware can provide between partners"
  - "Consistency models for replicated storage"
  - "Network virtualization techniques"
  - "Alternative storage offerings that replace the broker"
  answer: 0
  explanation: |
    Message-oriented Middleware moves messages asynchronously; the four delivery
    patterns describe the *guarantees* (and mechanisms) for how those messages are
    delivered — they are the related patterns of the middleware, not storage or
    networking patterns.
  ref: "concepts.md#message-oriented-middleware"

- id: ccp-offerings-storage-data-communication-037
  difficulty: intermediate
  tags: [at-least-once-delivery, selection, sqs]
  question: |
    A team uses SQS standard queues and designs consumers to dedupe on a business key
    via conditional writes. Which delivery guarantee are they relying on, made safe by
    idempotency?
  options:
  - "At-least-once Delivery with an idempotent consumer"
  - "Transaction-based Delivery"
  - "Strict Consistency"
  - "Exactly-once Delivery from the broker"
  answer: 0
  explanation: |
    SQS standard queues provide at-least-once delivery (duplicates possible). Making
    the consumer idempotent (dedupe on a business key / conditional writes) yields the
    exactly-once *effect* without exactly-once transport.
  ref: "concepts.md#at-least-once-delivery"

- id: ccp-offerings-storage-data-communication-038
  difficulty: advanced
  tags: [exactly-once-delivery, modern-equivalent]
  question: |
    Which mechanism is a real-world approximation of Exactly-once Delivery via
    broker-side deduplication?
  options:
  - "DNS caching"
  - "SQS standard queues"
  - "SQS FIFO queues with content-based deduplication, or Azure Service Bus duplicate detection"
  - "S3 cross-region replication"
  answer: 2
  explanation: |
    SQS FIFO content-based dedup and Azure Service Bus duplicate detection filter
    duplicates within a bounded window using message ids — the Exactly-once Delivery
    mechanism. SQS standard queues are at-least-once.
  ref: "concepts.md#exactly-once-delivery"

- id: ccp-offerings-storage-data-communication-039
  difficulty: beginner
  tags: [relational-database, modern-equivalent]
  question: |
    Which set of services realizes the Relational Database pattern across clouds?
  options:
  - "DynamoDB, Cosmos DB, Bigtable"
  - "Amazon RDS/Aurora, Azure SQL Database, Google Cloud SQL"
  - "S3, Azure Blob, GCS"
  - "SQS, Service Bus, Pub/Sub"
  answer: 1
  explanation: |
    RDS/Aurora, Azure SQL Database, and Cloud SQL are managed relational databases.
    DynamoDB/Cosmos/Bigtable are Key-Value/wide-column stores.
  ref: "concepts.md#relational-database"

- id: ccp-offerings-storage-data-communication-040
  difficulty: intermediate
  tags: [key-value-storage, modern-equivalent]
  question: |
    Which services are canonical realizations of the Key-Value Storage pattern?
  options:
  - "Amazon DynamoDB, Azure Cosmos DB, Google Bigtable"
  - "Amazon EBS, Azure Disk, Persistent Disk"
  - "S3, Azure Blob, GCS"
  - "Amazon RDS, Azure SQL, Cloud SQL"
  answer: 0
  explanation: |
    DynamoDB, Cosmos DB, and Bigtable are key-value / wide-column stores that scale out
    with flexible schemas — the Key-Value Storage pattern.
  ref: "concepts.md#key-value-storage"

- id: ccp-offerings-storage-data-communication-041
  difficulty: advanced
  tags: [strict-consistency, eventual-consistency, cap]
  question: |
    At the storage-offering level, Strict vs Eventual Consistency is fundamentally a
    trade-off purchased with what?
  options:
  - "Network bandwidth only"
  - "Storage durability"
  - "Coordination (round trips / replicas that must agree), which costs latency and availability"
  - "Message ordering guarantees"
  answer: 2
  explanation: |
    Stronger consistency requires more coordination — overlapping quorums, more round
    trips — which costs latency and, under partition, availability. Eventual
    Consistency buys speed and availability by relaxing that coordination. (Deep CAP
    derivation lives in cap-theorem-and-consistency.)
  ref: "concepts.md#strict-consistency"

- id: ccp-offerings-storage-data-communication-042
  difficulty: intermediate
  tags: [blob-storage, tradeoffs, distinction]
  question: |
    Why can you NOT run a transactional relational database directly on Blob Storage?
  options:
  - "Blob Storage enforces a rigid relational schema"
  - "Blob Storage is not durable enough"
  - "Blob Storage offers only whole-object get/put with no mountable, random-access disk semantics"
  - "Blob Storage cannot store large files"
  answer: 2
  explanation: |
    A database needs random-access block I/O on a mountable file system (Block
    Storage). Blob Storage exposes only object-granularity operations (get/put whole
    objects by key), which cannot back a running database engine's file system.
  ref: "concepts.md#blob-storage"

- id: ccp-offerings-storage-data-communication-043
  difficulty: advanced
  tags: [timeout-based-delivery, idempotency, selection]
  question: |
    A team wants at-least-once queue processing that survives consumer crashes but does
    NOT want the cost of distributed transactions. What combination should they use?
  options:
  - "Strict Consistency with synchronous replicas"
  - "Transaction-based Delivery with XA across broker and database"
  - "Exactly-once Delivery only, no consumer changes"
  - "Timeout-based Delivery (visibility timeout + redelivery) with idempotent consumers"
  answer: 3
  explanation: |
    Timeout-based Delivery gives at-least-once with crash recovery and no XA. Because a
    slow consumer can still cause a duplicate, pairing it with idempotent consumers is
    the standard, scalable combination (the SQS model).
  ref: "concepts.md#timeout-based-delivery"

- id: ccp-offerings-storage-data-communication-044
  difficulty: intermediate
  tags: [key-value-storage, map-reduce, related]
  question: |
    The Key-Value Storage pattern lists which pattern as a natural companion for batch
    analysis over its stored values?
  options:
  - "Block Storage"
  - "Map-Reduce"
  - "Virtual Networking"
  - "Transaction-based Delivery"
  answer: 1
  explanation: |
    Because key-value stores hold large, schema-light data spread across many nodes,
    Map-Reduce is the companion pattern for parallel batch processing over the values.
  ref: "concepts.md#key-value-storage"

- id: ccp-offerings-storage-data-communication-045
  difficulty: advanced
  tags: [delivery, selection, exactly-once-delivery]
  question: |
    A payment gateway must never charge a card twice, and the consumer cannot easily be
    made idempotent. Which delivery guarantee should be prioritized?
  options:
  - "At-least-once Delivery, accepting duplicates"
  - "Exactly-once Delivery (dedup by unique message id)"
  - "Eventual Consistency"
  - "Timeout-based Delivery without dedup"
  answer: 1
  explanation: |
    When duplicates are genuinely unsafe and the consumer cannot be made idempotent,
    you need Exactly-once Delivery, which detects and discards duplicates via unique
    message ids. (If the consumer *could* be idempotent, at-least-once + idempotency
    would be cheaper.)
  ref: "concepts.md#exactly-once-delivery"

- id: ccp-offerings-storage-data-communication-046
  difficulty: beginner
  tags: [block-storage, modern-equivalent]
  question: |
    Which services are modern realizations of the Block Storage pattern?
  options:
  - "DynamoDB, Cosmos DB, Bigtable"
  - "S3, Azure Blob, GCS"
  - "Amazon EBS, Azure Managed Disks, Google Persistent Disk"
  - "SQS, Service Bus, Pub/Sub"
  answer: 2
  explanation: |
    EBS, Azure Managed Disks, and Persistent Disk present network-attached storage as
    mountable local disks — the Block Storage pattern. The others are blob, messaging,
    and key-value offerings.
  ref: "concepts.md#block-storage"

- id: ccp-offerings-storage-data-communication-047
  difficulty: advanced
  tags: [strict-consistency, quorum, mechanism]
  question: |
    A Strict Consistency store has n=5 replicas. Which (r, w) pair FAILS to guarantee
    that reads always see the latest write?
  options:
  - "r=3, w=3"
  - "r=2, w=4"
  - "r=4, w=2"
  - "r=1, w=3"
  answer: 3
  explanation: |
    The rule is r + w > n. With n=5: 3+3=6 (ok), 2+4=6 (ok), 4+2=6 (ok), and 1+3=4
    which is NOT > 5 (fails). The failing pair is r=1, w=3 (4 is not greater than 5), so
    its read and write quorums may not overlap and a read can miss the latest write.
  ref: "concepts.md#strict-consistency"

- id: ccp-offerings-storage-data-communication-048
  difficulty: intermediate
  tags: [message-oriented-middleware, tradeoffs]
  question: |
    Compared to a direct synchronous RPC between two components, what is the primary
    benefit of introducing Message-oriented Middleware?
  options:
  - "It provides strict consistency for replicated storage"
  - "It guarantees lower end-to-end latency than a direct call"
  - "It loosely couples partners so a slow or offline receiver does not block the sender"
  - "It removes the need to think about delivery guarantees"
  answer: 2
  explanation: |
    The middleware buffers and routes messages so the sender is not blocked by a slow
    or offline receiver (load leveling + temporal decoupling). It does NOT reduce
    latency versus a direct call, and it actually *forces* you to reason about delivery
    guarantees.
  ref: "concepts.md#message-oriented-middleware"

- id: ccp-offerings-storage-data-communication-049
  difficulty: intermediate
  tags: [blob-storage, key, mechanism]
  question: |
    In the Blob Storage pattern, how is each stored file identified for retrieval?
  options:
  - "By a SQL primary key validated against other tables"
  - "By a unique identifier derived from its position in the folder hierarchy plus its filename"
  - "By a block address on a mounted disk"
  - "By a message id assigned by the broker"
  answer: 1
  explanation: |
    Blob Storage arranges files in a directory-like hierarchy and identifies each by a
    unique key built from its path plus filename; the application passes that key to
    the elastic store to fetch the object.
  ref: "concepts.md#blob-storage"

- id: ccp-offerings-storage-data-communication-050
  difficulty: advanced
  tags: [virtual-networking, related, elastic-infrastructure]
  question: |
    Which pattern does Virtual Networking most directly build upon, since virtualized
    network resources connect components running on virtualized compute?
  options:
  - "Elastic Infrastructure (and the Hypervisor)"
  - "Relational Database"
  - "Exactly-once Delivery"
  - "Message-oriented Middleware"
  answer: 0
  explanation: |
    Virtual Networking connects resources on Elastic Infrastructures/Platforms; it is
    related to Elastic Infrastructure and the Hypervisor, which virtualize the compute
    side. Messaging, databases, and delivery patterns are unrelated to network
    virtualization.
  ref: "concepts.md#virtual-networking"

- id: ccp-offerings-storage-data-communication-051
  difficulty: intermediate
  tags: [transaction-based-delivery, exactly-once-delivery, related]
  question: |
    The book lists Transaction-based Delivery as related to which delivery pattern,
    because a transactional receive can help avoid processing duplicates?
  options:
  - "Eventual Consistency"
  - "Timeout-based Delivery"
  - "Exactly-once Delivery"
  - "At-least-once Delivery"
  answer: 2
  explanation: |
    Transaction-based Delivery is related to Exactly-once Delivery: consuming a message
    under one committed transaction, combined with dedup, supports once-only
    processing.
  ref: "concepts.md#transaction-based-delivery"

- id: ccp-offerings-storage-data-communication-052
  difficulty: beginner
  tags: [eventual-consistency, dynamodb, modern-equivalent]
  question: |
    DynamoDB's default "eventually consistent read" (which may return slightly stale
    data for lower latency) is an example of which pattern?
  options:
  - "Transaction-based Delivery"
  - "Block Storage"
  - "Strict Consistency"
  - "Eventual Consistency"
  answer: 3
  explanation: |
    An eventually consistent read may not reflect the most recent write but is faster
    and more available — the Eventual Consistency pattern. A strongly consistent read
    would be Strict Consistency.
  ref: "concepts.md#eventual-consistency"

- id: ccp-offerings-storage-data-communication-053
  difficulty: advanced
  tags: [delivery, distinction, timeout-based-delivery, at-least-once-delivery]
  question: |
    How does Timeout-based Delivery differ from plain At-least-once Delivery in
    preventing two clients from processing the same message concurrently?
  options:
  - "It does not prevent concurrency at all"
  - "While a message is invisible during its timeout, no other client can read it, preventing concurrent duplicate processing"
  - "It uses an ACID transaction to lock the message"
  - "It assigns a unique id that blocks other reads"
  answer: 1
  explanation: |
    In Timeout-based Delivery the read message is marked invisible for the timeout, so
    other clients cannot pick it up concurrently. Plain at-least-once (ack/retransmit)
    does not inherently hide the in-flight message from other readers.
  ref: "concepts.md#timeout-based-delivery"

- id: ccp-offerings-storage-data-communication-054
  difficulty: intermediate
  tags: [storage-offerings, selection, distinction]
  question: |
    Match the need to the right storage pattern: "durable, cheap, effectively
    unbounded store for whole objects served to many clients over HTTP, no queries or
    transactions needed."
  options:
  - "Key-Value Storage"
  - "Block Storage"
  - "Relational Database"
  - "Blob Storage"
  answer: 3
  explanation: |
    Whole-object, write-once/read-many, HTTP-served, no query/transaction needs, cheap
    and effectively unbounded is the Blob Storage profile (S3/GCS/Azure Blob).
  ref: "concepts.md#blob-storage"

- id: ccp-offerings-storage-data-communication-055
  difficulty: advanced
  tags: [relational-database, key-value-storage, scale-out, tradeoffs]
  question: |
    Why does enforcing a Relational Database's cross-table integrity make scale-out
    harder than in a Key-Value store?
  options:
  - "Relational databases cannot be replicated at all"
  - "Validating foreign-key relationships and joins requires coordinated access across data that may be partitioned, demanding expensive high-performance connectivity"
  - "Key-value stores enforce stricter schemas"
  - "Relational databases only support a single row per table"
  answer: 1
  explanation: |
    Maintaining referential integrity and answering joins requires reaching related
    data that would otherwise be spread across nodes — costly coordination that limits
    partitioning. Key-Value Storage sidesteps this by dropping cross-record integrity
    and query breadth, so a lookup hits one node.
  ref: "concepts.md#key-value-storage"

- id: ccp-offerings-storage-data-communication-056
  difficulty: intermediate
  tags: [delivery, at-least-once-delivery, tradeoffs, selection]
  question: |
    For most high-throughput systems where duplicate processing can be made harmless,
    which delivery guarantee is the pragmatic default?
  options:
  - "Transaction-based Delivery"
  - "Strict Consistency"
  - "Exactly-once Delivery"
  - "At-least-once Delivery"
  answer: 3
  explanation: |
    At-least-once Delivery is cheap, high-throughput, and loses no messages; its only
    cost is duplicates, which idempotent consumers absorb. It is the pragmatic default
    when duplicates can be tolerated/deduped.
  ref: "concepts.md#at-least-once-delivery"

- id: ccp-offerings-storage-data-communication-057
  difficulty: advanced
  tags: [block-storage, blob-storage, selection, distinction]
  question: |
    A workload needs a volume that a single VM mounts, formats, and uses for a
    write-ahead log with fsync durability, and that can be detached and reattached to a
    replacement VM after a failure. Which pattern and why?
  options:
  - "Block Storage, because it is a network-attached, mountable disk that survives the VM and can be reattached"
  - "Key-Value Storage, because it scales out"
  - "Relational Database, because it supports transactions"
  - "Blob Storage, because objects are durable"
  answer: 0
  explanation: |
    A mountable, formattable, fsync-capable volume that outlives the VM and can be
    reattached is Block Storage (network-attached disk). Blob Storage cannot be mounted
    as a disk for a write-ahead log.
  ref: "concepts.md#block-storage"
