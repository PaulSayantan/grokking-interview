topic: Distributed Coordination, Locking and Collaborative Editing
domain: system-design
topic_slug: design-coordination-locking-collaboration
version: 1
questions:
- id: design-coordination-locking-collaboration-001
  difficulty: beginner
  tags: [fundamentals, failure-detection]
  question: |
    In a distributed system, why is coordination fundamentally harder than on a single machine?
  options:
  - "You cannot reliably distinguish a crashed node from a slow or partitioned node"
  - "Distributed CPUs run at lower clock speeds than a single machine's cores"
  - "Distributed systems can hold far less total data than one large machine"
  - "Network cables are physically unreliable and break during nearly every request"
  answer: 0
  explanation: |
    The core difficulty is that a dead node, a slow node, and a partitioned node all look identical
    from the outside — you only observe the absence of a timely response. CPU speed and storage
    capacity are unrelated; "cables always break" is an overstatement — occasional failures, not
    constant ones, are the issue.
  ref: concepts.md#why-coordination-is-hard
- id: design-coordination-locking-collaboration-002
  difficulty: beginner
  tags: [process-pause, gc]
  question: |
    Why is a stop-the-world garbage-collection pause so dangerous for a process holding a
    distributed lock with a TTL?
  options:
  - "GC pauses overwrite and corrupt the lock's serialized value in the Redis keyspace"
  - "GC pauses accelerate the network stack, causing the lock's TTL to expire ahead of schedule"
  - "The process can freeze past the lock's expiry, so the lock is reassigned, yet the process wakes still
    believing it holds the lock"
  - "GC activity blocks the acquire command so the client can never obtain the lock at all"
  answer: 2
  explanation: |
    A pause can exceed the TTL; the lock service reassigns the lock, but the paused client resumes
    unaware that time passed and acts as though it still holds it — two holders. GC does not corrupt
    Redis state, does not speed up the network, and does not block acquisition.
  ref: concepts.md#why-coordination-is-hard
- id: design-coordination-locking-collaboration-003
  difficulty: beginner
  tags: [clocks]
  question: |
    Why should you avoid comparing wall-clock timestamps from two different machines to order events?
  options:
  - "Timestamps consume too much storage to compare efficiently across nodes"
  - "Timestamps from different machines are always recorded in conflicting time zones"
  - "A machine cannot reliably read the value of its own hardware clock"
  - "Clocks drift and can jump backward (e.g., NTP corrections), so cross-machine ordering is unreliable"
  answer: 3
  explanation: |
    Wall clocks drift between nodes and can step backward due to NTP correction or leap seconds, so
    comparing them across machines gives unreliable ordering. Storage size, time zones (a display
    concern), and reading the local clock are not the issue.
  ref: concepts.md#why-coordination-is-hard
- id: design-coordination-locking-collaboration-004
  difficulty: beginner
  tags: [locks, ttl]
  question: |
    Why does a distributed lock stored as a single key almost always need a TTL (expiry)?
  options:
  - "To make the acquire operation complete faster by pre-reserving the key's expiry slot"
  - "So a client that crashes while holding the lock does not deadlock the resource forever"
  - "To reduce the on-disk storage size of the key by capping how long its value persists"
  - "Because the Redis protocol mandates an explicit TTL on every key that is ever written"
  answer: 1
  explanation: |
    Without a TTL, a crash while holding the lock leaves it held forever — a permanent deadlock. The
    TTL guarantees eventual release. It does not affect acquire speed or storage meaningfully, and
    Redis does not require TTLs on keys.
  ref: concepts.md#distributed-locks-and-their-failure-modes
- id: design-coordination-locking-collaboration-005
  difficulty: beginner
  tags: [locks, ownership]
  question: |
    Why should a client store a unique owner token in the lock value and only delete the lock if the
    value still matches (typically via a Lua script)?
  options:
  - "So a client cannot accidentally delete a lock that has expired and been re-acquired by someone else"
  - "To compress the lock key's value into a smaller stored footprint"
  - "To let several clients share and hold the same lock concurrently by matching tokens"
  - "Because Redis refuses to delete a key unless its stored value is supplied for verification"
  answer: 0
  explanation: |
    The owner check ensures a slow client only releases its own lock, not one that has since expired
    and been handed to another client. It is not about compression, it does not enable shared holding,
    and Redis can delete keys freely.
  ref: concepts.md#distributed-locks-and-their-failure-modes
- id: design-coordination-locking-collaboration-006
  difficulty: beginner
  tags: [zookeeper, etcd, coordination-service]
  question: |
    What is a coordination service like ZooKeeper or etcd primarily designed to store?
  options:
  - "High-volume primary application data such as user profiles, orders, and transactional records"
  - "Large media files and binary blobs like images, video, and archived document attachments"
  - "Low-volume, high-value metadata such as configuration, membership, leases, and locks — with strong
    consistency"
  - "High-throughput analytics event streams ingested continuously at millions of events per second"
  answer: 2
  explanation: |
    These are strongly consistent stores for small, critical metadata (config, membership, leader
    leases). Every write is a quorum round trip, so they are the wrong place for high-volume
    application data, blobs, or high-QPS event streams.
  ref: concepts.md#zookeeper-etcd-and-consul-as-coordination-services
- id: design-coordination-locking-collaboration-007
  difficulty: beginner
  tags: [leader-election]
  question: |
    What problem does leader election solve?
  options:
  - "Encrypting all traffic exchanged between the nodes of the cluster"
  - "Getting all nodes to agree on exactly one node to be 'in charge' of some responsibility"
  - "Compressing the replication log to reduce the storage each node must keep"
  - "Balancing CPU and request load evenly across every node in the cluster"
  answer: 1
  explanation: |
    Leader election picks one node (and gets the cluster to agree on it) to serialize decisions and
    avoid conflicts. It is not about encryption, log compression, or general CPU load balancing.
  ref: concepts.md#leader-election
- id: design-coordination-locking-collaboration-008
  difficulty: beginner
  tags: [crdt, collaboration]
  question: |
    What is the defining property of a CRDT (Conflict-free Replicated Data Type)?
  options:
  - "It relies on a central authoritative server to arbitrate and resolve every concurrent conflict"
  - "It compresses text and structured data more tightly than any other known data structure"
  - "It guarantees the automatically merged result always matches the users' original human intent"
  - "Concurrent updates on different replicas merge automatically and deterministically, converging to
    the same state regardless of order"
  answer: 3
  explanation: |
    A CRDT's structure guarantees convergence to an identical state independent of the order updates
    arrive, without a coordinator. It does not require a central server, is not a compression scheme,
    and notably guarantees convergence — not that the result matches user intent.
  ref: concepts.md#collaborative-editing-with-crdts
- id: design-coordination-locking-collaboration-009
  difficulty: beginner
  tags: [ot, collaboration]
  question: |
    In Operational Transformation (OT), what does the "transformation" step actually do?
  options:
  - "Adjusts a concurrent operation's parameters (e.g., position) so it still applies correctly after
    the document has changed underneath it"
  - "Encrypts each operation with a session key before it is sent across the network to peers"
  - "Compresses the whole document into a smaller binary form before storing or transmitting it"
  - "Converts the plain-text document into an equivalent conflict-free replicated data type"
  answer: 0
  explanation: |
    OT transforms concurrent operations against each other — e.g., shifting an insert's position to
    account for another insert — so they converge. It is not encryption, compression, or CRDT
    conversion.
  ref: concepts.md#collaborative-editing-with-operational-transformation
- id: design-coordination-locking-collaboration-010
  difficulty: beginner
  tags: [presence]
  question: |
    Which best describes the nature of "presence" data (live cursors, typing indicators) in a
    collaborative app?
  options:
  - "Durable and audit-grade, so it must be persisted forever under strong linearizable consistency"
  - "Semantically identical to the document state and should therefore share the same durable storage"
  - "Ephemeral, high-frequency, and disposable — stale presence data is worthless"
  - "Rarely updated and low frequency, changing only a handful of times over an editing session"
  answer: 2
  explanation: |
    Presence changes many times a second and is worthless once stale, so it is ephemeral, lossy, and
    rides a separate cheap channel. It is not durable, not the same as document state, and definitely
    not low-frequency.
  ref: concepts.md#presence-and-awareness
- id: design-coordination-locking-collaboration-011
  difficulty: beginner
  tags: [fencing-token]
  question: |
    What is a fencing token?
  options:
  - "A random UUID minted per acquisition that uniquely identifies the current lock owner"
  - "An encryption key used to sign and protect the lock-acquisition traffic in transit"
  - "A wall-clock timestamp stamped onto each write to record when the holder acquired the lock"
  - "A monotonically increasing number issued on each lock grant that the protected resource uses to reject
    stale writers"
  answer: 3
  explanation: |
    A fencing token is monotonic; the resource records the highest token seen and rejects lower ones,
    fencing off stale holders. A random UUID has no ordering (Redlock's flaw), it is not an encryption
    key, and a wall-clock timestamp is not monotonic across machines.
  ref: concepts.md#fencing-tokens-and-idempotency
- id: design-coordination-locking-collaboration-012
  difficulty: beginner
  tags: [consensus]
  question: |
    In a Raft or ZooKeeper cluster of 2f+1 nodes, how many nodes must be available to commit a write?
  options:
  - "All 2f+1 nodes"
  - "A majority (f+1 nodes)"
  - "Just one node"
  - "Exactly f nodes"
  answer: 1
  explanation: |
    Consensus commits require a majority quorum (f+1 of 2f+1), which tolerates f failures. Requiring
    all nodes would make any single failure fatal; a single node gives no fault tolerance; f nodes is
    a minority and cannot commit safely.
  ref: concepts.md#consensus-as-the-foundation
- id: design-coordination-locking-collaboration-013
  difficulty: intermediate
  tags: [redlock, criticism, fencing-token]
  question: |
    Kleppmann's central argument is that even a perfect distributed lock cannot guarantee correctness
    by itself. What does he say is required in addition?
  options:
  - "A fencing token that the protected resource checks and uses to reject stale writers"
  - "A longer TTL on the lock so the holder is far less likely to lose it mid-operation"
  - "More Redis replicas in the quorum to make the majority acquisition harder to spoof"
  - "Faster, lower-latency network hardware to shrink the window in which a pause could occur"
  answer: 0
  explanation: |
    Because a client can go stale (pause race), the resource itself must reject out-of-order writers
    via a monotonic fencing token. A longer TTL, more replicas, or faster hardware never eliminates
    the pause race — they only change its probability.
  ref: concepts.md#redlock-and-its-criticisms
- id: design-coordination-locking-collaboration-014
  difficulty: intermediate
  tags: [redlock, fencing-token]
  question: |
    Why does Kleppmann argue Redlock specifically cannot provide fencing tokens?
  options:
  - "Redlock uses too few master nodes to compute a reliable monotonic sequence number"
  - "Redis cannot store integer values, only opaque strings, so counters are impossible"
  - "Redlock's lock identifier is a random value with no monotonic ordering, and generating a monotonic
    token would itself require consensus that Redlock lacks"
  - "Redlock deletes the token on release, so no persistent counter survives across acquisitions"
  answer: 2
  explanation: |
    A fencing token must be monotonic; Redlock issues random UUIDs, and producing a truly monotonic
    counter across independent masters would need consensus Redlock does not implement. Node count,
    integer storage, and release behavior are not the reason.
  ref: concepts.md#redlock-and-its-criticisms
- id: design-coordination-locking-collaboration-015
  difficulty: intermediate
  tags: [safety, liveness]
  question: |
    Kleppmann notes that Redlock differs from well-designed asynchronous consensus algorithms in a
    key way. What is it?
  options:
  - "Redlock's liveness depends on timing, exactly like every well-designed consensus algorithm, so this is fine"
  - "Redlock makes no timing assumptions whatsoever and is fully correct in a purely asynchronous model"
  - "Redlock guarantees both safety and liveness unconditionally regardless of network or clock behavior"
  - "Redlock's safety itself depends on timing assumptions, so bad timing produces wrong decisions, not
    merely slow ones"
  answer: 3
  explanation: |
    Good async algorithms keep safety regardless of timing and only sacrifice liveness under bad
    timing. Redlock's *safety* depends on bounded delay/pauses/clock error, so timing violations cause
    incorrect (two-holder) outcomes. It does have timing assumptions and does not guarantee both
    properties unconditionally.
  ref: concepts.md#redlock-and-its-criticisms
- id: design-coordination-locking-collaboration-016
  difficulty: intermediate
  tags: [efficiency-vs-correctness]
  question: |
    Kleppmann distinguishes "efficiency" locks from "correctness" locks. For a purely EFFICIENCY lock
    (occasional duplicate work is merely wasteful, never harmful), what does he recommend?
  options:
  - "Always use full Redlock across five independent masters for maximum acquisition safety"
  - "Use a single Redis instance with SET NX PX and document that the lock is approximate"
  - "Use ZooKeeper with monotonic fencing tokens enforced at the protected resource"
  - "Do not use any lock at all; simply allow the duplicate work to happen every time"
  answer: 1
  explanation: |
    For efficiency, the five-node Redlock overhead is unjustified; a single Redis SET NX PX is
    sufficient and should be documented as approximate. ZooKeeper+fencing is for correctness locks;
    "never lock" ignores that reducing duplicate work still has value.
  ref: concepts.md#redlock-and-its-criticisms
- id: design-coordination-locking-collaboration-017
  difficulty: intermediate
  tags: [zookeeper, lock-recipe, thundering-herd]
  question: |
    In the standard ZooKeeper lock recipe using ephemeral sequential nodes, why does each waiter watch
    only the node immediately before it rather than watching the lock holder directly?
  options:
  - "To avoid a thundering herd — otherwise every waiter wakes and stampedes when the lock is released"
  - "Because ZooKeeper enforces a hard limit of one active watch per client session at any time"
  - "Because the immediately preceding node is the one that holds and hands off the fencing token"
  - "To make the lock non-blocking so that a waiter returns immediately instead of queueing"
  answer: 0
  explanation: |
    Watching only your predecessor means only the next-in-line wakes on release, avoiding a herd of
    all waiters retrying at once. ZooKeeper supports many watches; the predecessor does not hold your
    token; the lock is still blocking.
  ref: concepts.md#zookeeper-etcd-and-consul-as-coordination-services
- id: design-coordination-locking-collaboration-018
  difficulty: intermediate
  tags: [zookeeper, ephemeral-node]
  question: |
    What is the purpose of a ZooKeeper "ephemeral" node in a locking or leader-election recipe?
  options:
  - "It stores large binary payloads more efficiently than a regular persistent znode does"
  - "It never expires and thus guarantees the creating client permanent ownership of the node"
  - "It is automatically deleted when the client's session heartbeats stop, so lock/leadership is released
    on crash"
  - "It replicates its data to a larger quorum of nodes than an ordinary persistent node would"
  answer: 2
  explanation: |
    Ephemeral nodes are tied to a session and vanish when heartbeats cease, which is exactly how
    crash-triggered release works. They are not for large data, they are the opposite of permanent,
    and they do not change replication.
  ref: concepts.md#zookeeper-etcd-and-consul-as-coordination-services
- id: design-coordination-locking-collaboration-019
  difficulty: intermediate
  tags: [etcd, fencing-token]
  question: |
    In etcd, which mechanism naturally serves as a fencing token for a write guarded by a key?
  options:
  - "The key's remaining TTL in seconds, since the writer holding the longest-lived lease is treated as newest"
  - "The key's mod_revision, used with a compare-and-swap transaction on write"
  - "The lease's randomly generated 64-bit ID, which each new grant re-randomizes to identify the current owner"
  - "The client's source IP address, hashed into a numeric rank so that higher addresses win any contested write"
  answer: 1
  explanation: |
    etcd's MVCC assigns a monotonically increasing mod_revision; a txn conditioned on it enforces
    ordering, acting as a fencing token. A TTL is a duration, the lease ID is not monotonic in the
    right sense for the resource, and an IP is meaningless as a token.
  ref: concepts.md#zookeeper-etcd-and-consul-as-coordination-services
- id: design-coordination-locking-collaboration-020
  difficulty: intermediate
  tags: [consul, service-discovery]
  question: |
    When would Consul be the most natural choice among ZooKeeper, etcd, and Consul?
  options:
  - "When you need to store many terabytes of primary application data with low per-object retrieval latency"
  - "When you need the highest possible sustained write QPS, on the order of millions of key updates per second"
  - "When you want to avoid any consensus protocol entirely and rely purely on gossip for all consistency"
  - "When service discovery plus health checking plus a KV store are the primary needs, ideally with built-in
    DNS"
  answer: 3
  explanation: |
    Consul's first-class service catalog, health checks, and DNS make it the pick when discovery is
    central. It is not a bulk data store, not a high-QPS write engine, and it still uses Raft
    consensus.
  ref: concepts.md#zookeeper-etcd-and-consul-as-coordination-services
- id: design-coordination-locking-collaboration-021
  difficulty: intermediate
  tags: [leader-election, epoch, split-brain]
  question: |
    A newly elected leader carries a monotonically increasing term/epoch number, and followers reject
    messages from older terms. What problem does this primarily prevent?
  options:
  - "A deposed but unaware 'zombie' leader (e.g., one that was partitioned) from continuing to issue commands"
  - "Network encryption handshake failures that would let an attacker forge command messages between cluster peers"
  - "Slow disk writes on followers that would otherwise fall behind and get force-promoted ahead of the real leader"
  - "Clients from reading stale data by forcing every follower to serve reads only after a full log catch-up"
  answer: 0
  explanation: |
    The epoch fences a stale leader: its old-term messages are rejected, preventing split-brain
    damage. It is the leader analog of a fencing token — unrelated to encryption, disk speed, or read
    staleness directly.
  ref: concepts.md#leader-election
- id: design-coordination-locking-collaboration-022
  difficulty: intermediate
  tags: [leader-election, flapping, timeouts]
  question: |
    Your leader-elected service keeps rapidly re-electing leaders ("flapping") under a jittery network,
    halting progress each time. What is the most appropriate mitigation?
  options:
  - "Reduce the cluster to a single node so no election is ever needed, giving one permanent uncontested leader"
  - "Remove the majority-quorum requirement so a lone candidate can declare itself leader and elect far faster"
  - "Use longer, randomized election timeouts with back-off to reduce spurious elections and simultaneous
    candidacies"
  - "Switch to synchronized wall-clock timestamps so the node with the earliest boot time deterministically wins"
  answer: 2
  explanation: |
    Longer randomized timeouts prevent premature elections and reduce split votes, stabilizing
    leadership. A single node destroys fault tolerance; dropping the quorum invites split-brain;
    wall-clock ordering is unreliable across machines.
  ref: concepts.md#leader-election
- id: design-coordination-locking-collaboration-023
  difficulty: intermediate
  tags: [safety-vs-liveness, partition]
  question: |
    For a correctness-critical distributed lock, during a network partition which property should the
    design sacrifice, and why?
  options:
  - "Sacrifice safety, because a stalled system is unacceptable and a brief window of two lock holders is easy to repair"
  - "Sacrifice both equally, splitting the partition window so each property is only ever half-violated at any moment"
  - "Neither can be sacrificed; a correctly designed quorum lock preserves both safety and liveness through any partition"
  - "Sacrifice liveness (block/timeout), because a corrupted system is often unrecoverable while a stalled
    one is recoverable"
  answer: 3
  explanation: |
    Correct systems keep safety unconditional and let liveness degrade under partition, since data
    corruption is far worse than a temporary stall. Sacrificing safety risks two holders; both cannot
    be preserved under partition (that is the fundamental tension).
  ref: concepts.md#distributed-mutual-exclusion-trade-offs-safety-versus-liveness
- id: design-coordination-locking-collaboration-024
  difficulty: intermediate
  tags: [optimistic-concurrency, contention]
  question: |
    Under LOW write contention on independent items, why is optimistic concurrency (version/CAS check
    on commit) often preferable to pessimistic locking?
  options:
  - "It guarantees no two writers ever conflict by silently serializing their commits behind the scenes"
  - "It avoids holding-cost and lock management, and conflicts are rare so retries are cheap"
  - "It scales worse than pessimistic locking but is considerably simpler to reason about under any load"
  - "It requires a dedicated consensus service to arbitrate every version check before a commit is allowed"
  answer: 1
  explanation: |
    With rare conflicts, optimistic concurrency avoids lock overhead and deadlock while retries almost
    never fire. It does not guarantee no conflicts (it detects and retries them), it scales better not
    worse, and it needs no consensus service.
  ref: concepts.md#distributed-mutual-exclusion-trade-offs-safety-versus-liveness
- id: design-coordination-locking-collaboration-025
  difficulty: intermediate
  tags: [consensus, raft]
  question: |
    In Raft, when is a log entry considered "committed"?
  options:
  - "Once a majority of nodes have persisted it, after which it is applied to the state machine in log
    order"
  - "As soon as the leader appends it to its own local log, before any follower has received the entry"
  - "When any single follower acknowledges it, since one confirmation is enough to prove durable replication"
  - "After every follower without exception acknowledges it, guaranteeing full-cluster durability on each write"
  answer: 0
  explanation: |
    Commit requires majority persistence; committed entries are then applied in order via
    state-machine replication. Leader-only append is not durable enough, a single follower is not a
    majority, and requiring all followers would sacrifice availability.
  ref: concepts.md#consensus-as-the-foundation
- id: design-coordination-locking-collaboration-026
  difficulty: intermediate
  tags: [ot-vs-crdt, offline]
  question: |
    A team is building an offline-first, peer-to-peer note app where users may edit disconnected for
    days and sync later. Which approach fits best and why?
  options:
  - "Operational Transformation, because its central server can queue and re-order operations after devices reconnect"
  - "A single distributed lock per note to serialize edits, handing each device an exclusive turn to write offline"
  - "CRDTs, because they guarantee convergence without a central coordinator and handle long divergence
    well"
  - "Last-writer-wins on the whole document by wall-clock time, keeping only the most recently saved device's copy"
  answer: 2
  explanation: |
    CRDTs converge without a coordinator and tolerate long offline divergence — exactly this use case.
    OT's central-server dependence fights offline P2P; a per-note lock destroys concurrency and
    offline editing; whole-document LWW loses most concurrent edits.
  ref: concepts.md#operational-transformation-versus-crdts-deep-trade-offs
- id: design-coordination-locking-collaboration-027
  difficulty: intermediate
  tags: [ot, google-docs, bandwidth]
  question: |
    Why has Google Docs historically favored Operational Transformation over CRDTs for large text
    documents?
  options:
  - "OT requires no server at all, simplifying deployment down to pure peer-to-peer edit exchange between browsers"
  - "OT guarantees the merged result matches every user's editing intent perfectly under all concurrent orderings"
  - "CRDTs are mathematically unable to represent ordered text, only unordered sets and counters"
  - "OT operations are compact on the wire and in storage, avoiding CRDTs' per-character id and tombstone
    overhead, and Docs already has a central server to order ops"
  answer: 3
  explanation: |
    OT ops are tiny (position + char) and Docs' central server makes transformation tractable, sidestepping
    CRDT metadata bloat. OT does rely on a server, it does not perfectly preserve intent, and CRDTs can
    certainly represent text.
  ref: concepts.md#operational-transformation-versus-crdts-deep-trade-offs
- id: design-coordination-locking-collaboration-028
  difficulty: intermediate
  tags: [figma, hybrid, collaboration]
  question: |
    Figma's multiplayer engine uses neither pure OT nor pure CRDT. What best characterizes their
    approach?
  options:
  - "Fully decentralized CRDTs with no server, syncing edits directly peer-to-peer between every connected client"
  - "A central server as source of truth with CRDT-inspired last-writer-wins per property, since the server
    can define event order"
  - "Operational Transformation with per-character transform functions applied client-side against each keystroke"
  - "A single global lock on the whole file that hands one editor exclusive write access at any given moment"
  answer: 1
  explanation: |
    Figma keeps a server as central authority and does last-writer-wins on each object property, so it
    drops both OT's transform complexity and pure CRDTs' decentralization overhead. It is not
    serverless, not classic OT, and not a global lock.
  ref: concepts.md#operational-transformation-versus-crdts-deep-trade-offs
- id: design-coordination-locking-collaboration-029
  difficulty: intermediate
  tags: [crdt, tombstones]
  question: |
    In a sequence CRDT for text, why are deletions typically represented as "tombstones" rather than
    truly removing the element?
  options:
  - "So concurrent operations that reference the deleted element still resolve consistently across replicas"
  - "To save memory by shrinking the document's stored footprint each time an element is removed"
  - "To make the on-screen text render faster by reducing the number of live elements the layout engine walks"
  - "Because CRDTs are structurally incapable of ever removing data once it has been inserted into the sequence"
  answer: 0
  explanation: |
    Tombstones keep the element's identity so concurrent edits referencing it converge correctly.
    Tombstones actually cost memory (they accumulate and need GC), do not speed rendering, and CRDTs
    can logically delete — they just mark rather than physically remove immediately.
  ref: concepts.md#collaborative-editing-with-crdts
- id: design-coordination-locking-collaboration-030
  difficulty: intermediate
  tags: [presence, separation]
  question: |
    Why is it a best practice to carry presence data (cursors, typing) on a separate channel from the
    durable document state?
  options:
  - "Presence needs stronger linearizable consistency than the document, so it must ride a higher-guarantee path"
  - "The durable document channel is restricted to large batched writes and cannot carry small frequent messages"
  - "Presence is high-frequency and lossy-tolerant, so mixing it with the durable/convergent document
    path would waste the expensive path's budget on disposable data"
  - "Presence must be stored forever for compliance auditing, so it needs its own long-term retention pipeline"
  answer: 2
  explanation: |
    Presence is fast, disposable, and can be lost; the document path is durable and convergent. Coupling
    them forces the costly path to carry junk load. Presence needs *weaker* consistency, and it is not
    retained for audit.
  ref: concepts.md#presence-and-awareness
- id: design-coordination-locking-collaboration-031
  difficulty: intermediate
  tags: [when-not-to-lock, idempotency]
  question: |
    You need to guarantee an order-processing job never has a harmful double-effect even if requests
    are retried or a stale worker wakes up. Which approach most directly removes the need for a
    cluster-wide lock?
  options:
  - "A longer lock TTL so the holder keeps the lock across the entire job and no stale worker can wake in time"
  - "Idempotency keys plus a dedup store, so a repeated operation becomes a no-op"
  - "More Redis replicas in the lock quorum so a majority acquisition becomes far harder for a stale worker to fake"
  - "A faster, lower-latency network between workers that shrinks the window in which a duplicate could slip through"
  answer: 1
  explanation: |
    Idempotency makes retries and stale actors harmless without mutual exclusion — the operation
    simply no-ops on a seen key. A longer TTL still has the pause race, more replicas do not add
    idempotency, and network speed is irrelevant to correctness here.
  ref: concepts.md#when-a-lock-is-the-wrong-tool
- id: design-coordination-locking-collaboration-032
  difficulty: intermediate
  tags: [when-not-to-lock, partitioning]
  question: |
    Instead of serializing all writes to entity X with a distributed lock, you route all operations for
    a given key to a single owner (e.g., a Kafka partition or an actor). What is the main advantage?
  options:
  - "It requires a dedicated consensus service to route each key deterministically to its single owning worker"
  - "It guarantees a single global total ordering across all keys, not merely ordering within each individual key"
  - "It eliminates the need for any backing storage because the owning actor holds all state purely in memory"
  - "You get per-key ordering for free with no cross-key contention, and it scales horizontally by key"
  answer: 3
  explanation: |
    Single-writer-per-key gives ordering without a lock and scales out because independent keys never
    contend. It does not need consensus, does not give *global* ordering (only per-key), and still
    needs storage. Hot keys remain a risk.
  ref: concepts.md#when-a-lock-is-the-wrong-tool
- id: design-coordination-locking-collaboration-033
  difficulty: intermediate
  tags: [coordination-service, cluster-size]
  question: |
    Why are ZooKeeper/etcd clusters typically sized at an odd number (3 or 5) of voting members?
  options:
  - "An odd count avoids ties in majority voting and maximizes fault tolerance per node (3 tolerates 1
    failure, 5 tolerates 2)"
  - "Odd numbers use measurably less memory per voter because the quorum bitmap packs more efficiently"
  - "Even-sized voting ensembles are explicitly forbidden by the Raft specification and will refuse to start"
  - "Odd numbers make each committed write faster than an even count by shortening the replication fan-out path"
  answer: 0
  explanation: |
    Odd sizes avoid split votes and give the best fault-tolerance-per-node ratio; a 4th node adds cost
    without improving tolerance over 3. Even numbers are technically allowed but wasteful, and writes
    actually get slower with more voters, not faster.
  ref: concepts.md#zookeeper-etcd-and-consul-as-coordination-services
- id: design-coordination-locking-collaboration-034
  difficulty: advanced
  tags: [scenario, correctness-lock, fencing]
  question: |
    A payments service must ensure only one worker settles a given transaction, and a double-settle
    moves real money. Workers run on VMs that occasionally suffer multi-second GC pauses. Which design
    is correct AND robust?
  options:
  - "Redlock across 5 Redis masters with a 30s TTL; whoever holds the majority of masters settles the transaction"
  - "A single Redis SET NX PX with an auto-renewing watchdog thread that extends the lease while work proceeds"
  - "A consensus-backed lock (etcd/ZooKeeper) that issues a monotonic fencing token, and the ledger rejects
    any settle carrying a token lower than the highest it has seen"
  - "No lock at all; let every worker settle freely and reconcile any duplicate settlements in a nightly batch job"
  answer: 2
  explanation: |
    Only fencing enforced at the ledger survives the pause race for a correctness lock. Redlock issues
    no fencing token; a watchdog thread pauses along with the process; nightly reconciliation cannot
    un-move money already sent. The token check at the resource is the load-bearing part.
  ref: concepts.md#fencing-tokens-and-idempotency
- id: design-coordination-locking-collaboration-035
  difficulty: advanced
  tags: [scenario, ttl, tradeoff]
  question: |
    You must pick a TTL for a lease-based lock. Work usually takes 5s but can occasionally take 25s
    during a GC pause. What is the fundamental trade-off you cannot escape by tuning the TTL alone?
  options:
  - "A short TTL guarantees both fast crash recovery and safety, since expiry always fires only after work completes"
  - "A long TTL eliminates the pause race entirely because a 25s pause can never exceed a generously sized lease"
  - "TTL length has no effect on safety and influences only performance, so any value you pick is equally correct"
  - "A short TTL recovers fast from crashes but risks stealing the lock from a slow-but-alive holder;
    a long TTL is safe against pauses but stalls long after real crashes — no TTL is both safe and fast"
  answer: 3
  explanation: |
    The TTL dilemma is real: short = fast recovery but steal risk; long = pause-safe but slow crash
    recovery. No single value is both, which is precisely why fencing tokens exist. A long TTL only
    reduces (never eliminates) the pause race, and TTL length clearly affects safety.
  ref: concepts.md#distributed-locks-and-their-failure-modes
- id: design-coordination-locking-collaboration-036
  difficulty: advanced
  tags: [scenario, redlock, antirez]
  question: |
    In a debate about Redlock, which statement most fairly captures antirez's rebuttal to Kleppmann?
  options:
  - "Redlock provides perfect monotonic fencing tokens out of the box, so no resource-side token check is ever needed"
  - "Fencing tokens are largely orthogonal — if a resource can check a monotonic token you often need
    no strong lock at all — and Redlock's timing model is reasonable for many real deployments"
  - "Redlock is fully safe because stop-the-world GC pauses effectively never occur in well-tuned production JVMs"
  - "Consensus-based locks are provably immune to delayed or reordered messages, a guarantee Redlock alone lacks"
  answer: 1
  explanation: |
    antirez argues fencing is orthogonal (a token-checking resource reduces the need for a strong
    lock) and that Redlock's synchrony assumptions are acceptable for many systems. Redlock does not
    ship fencing tokens, GC pauses do happen, and delayed messages also challenge consensus locks — so
    the other options misstate his position.
  ref: concepts.md#redlock-and-its-criticisms
- id: design-coordination-locking-collaboration-037
  difficulty: advanced
  tags: [scenario, leader-election, split-brain]
  question: |
    During a partition, node A (old leader) is isolated with a minority, and the majority elects node B
    as leader (higher term). A keeps accepting writes locally, believing it still leads. How does a
    correctly designed system prevent A's writes from corrupting state?
  options:
  - "A cannot commit without a majority quorum, and downstream systems reject A's stale-term (lower epoch)
    messages, so A's uncommitted writes never take effect"
  - "A's local clock detects the elevated round-trip latency to its peers, infers the partition on its own, and makes A step down before committing"
  - "The system waits for the partition to heal and then merges A's and B's divergent writes using last-writer-wins by wall-clock timestamp"
  - "A retains authority because it was the original leader, so the cluster keeps applying A's writes and discards B's until A rejoins"
  answer: 0
  explanation: |
    A is on the minority side, so it cannot achieve quorum to commit, and epoch/term checks cause
    followers/downstream to reject its stale-term messages. Clocks do not reliably detect partitions,
    blind LWW merge would corrupt, and seniority confers no authority.
  ref: concepts.md#leader-election
- id: design-coordination-locking-collaboration-038
  difficulty: advanced
  tags: [scenario, consensus, latency, geo]
  question: |
    A team wants linearizable, fault-tolerant writes but is placing the Raft quorum across three
    continents to "be global." Writes are now painfully slow. What is the correct explanation and
    remedy?
  options:
  - "Raft's commit path has a latency bug in cross-region mode; switching to Multi-Paxos removes the WAN round trip and restores fast writes"
  - "Add several more voting nodes to the quorum so the leader can reach a majority from nearby replicas and commit before the distant ones reply"
  - "Every committed write costs at least one round trip to a majority; a globe-spanning quorum pays WAN
    latency per write — keep the quorum within one region and relax consistency or replicate asynchronously
    across regions"
  - "Reads are the true bottleneck here; adding a read-through cache in each region will absorb the load and bring the slow write latency back down"
  answer: 2
  explanation: |
    Linearizable fault-tolerant writes have an irreducible cost of a majority round trip; spanning
    continents makes that a WAN RTT. Paxos has the same floor, more nodes make writes slower, and read
    caching does not help write latency. Co-locate the quorum and relax cross-region consistency.
  ref: concepts.md#consensus-as-the-foundation
- id: design-coordination-locking-collaboration-039
  difficulty: advanced
  tags: [scenario, crdt, convergence, intent]
  question: |
    Two users concurrently type overlapping text into a CRDT-backed editor and the merged result,
    while identical on all replicas, reads as garbled interleaved characters. What is the correct
    characterization?
  options:
  - "The CRDT implementation is broken, because a correct CRDT would leave the replicas holding visibly different final states here"
  - "This outcome proves that Operational Transformation, given the same two concurrent edits, would have produced the identical garbled interleaving"
  - "The accumulated deletion tombstones corrupted the sequence and reshuffled the surviving characters into the wrong order"
  - "CRDTs guarantee convergence (all replicas agree) but not intent preservation, so a consistent-yet-garbled
    interleaving is possible and must be handled at the editor/algorithm level"
  answer: 3
  explanation: |
    Convergence means all replicas reach the same state, not that the state matches human intent;
    interleaving is a known intent-preservation gap. Replicas do agree (so not broken), OT with server
    context often handles intent better, and tombstones are about deletions, not this.
  ref: concepts.md#collaborative-editing-with-crdts
- id: design-coordination-locking-collaboration-040
  difficulty: advanced
  tags: [scenario, when-not-to-lock, judgment]
  question: |
    A candidate proposes a distributed lock to ensure a nightly report job runs on exactly one node in
    a fleet. Which critique-and-alternative is the strongest senior response?
  options:
  - "A distributed lock is always an acceptable fit for this; the design is sound as proposed, so approve it and ship it as-is"
  - "This is really a singleton-role problem: use leader election (a scoped lease with epoch fencing)
    so exactly one node runs it, which is purpose-built and fences a zombie leader — a bare lock lacks
    that structure"
  - "Use Redlock across 5 independent Redis masters so a majority acquisition guarantees exactly one node runs the nightly cron"
  - "Run the report job on every node in the fleet and then deduplicate the redundant outputs afterward using a distributed lock"
  answer: 1
  explanation: |
    "Run this on exactly one node" is leader election, which provides the epoch fencing and role
    semantics a bare lock lacks. Blindly shipping a lock ignores the pause race and better tools;
    Redlock is overkill and unfenced; running everywhere then locking is contradictory.
  ref: concepts.md#when-a-lock-is-the-wrong-tool
- id: design-coordination-locking-collaboration-041
  difficulty: advanced
  tags: [scenario, coordination-service, availability]
  question: |
    Your etcd cluster loses network connectivity such that only a minority of members can talk to each
    other. What behavior should you EXPECT, and is it a bug?
  options:
  - "The minority side stops serving writes and linearizable reads to preserve safety; this is by-design
    CP behavior, not a bug"
  - "The minority side keeps accepting writes and merges them back in on heal; this is correct AP behavior and the intended design"
  - "The whole cluster keeps serving reads and writes on both sides of the split because etcd is an AP store that favors availability"
  - "etcd silently splits into two independent clusters that each elect their own leader and continue committing writes separately"
  answer: 0
  explanation: |
    etcd is CP: the minority cannot form a quorum, so it refuses writes/linearizable reads to avoid
    split-brain — expected behavior. It is not AP, does not keep serving on the minority, and does not
    split into two live clusters (that would be the split-brain it prevents).
  ref: concepts.md#zookeeper-etcd-and-consul-as-coordination-services
- id: design-coordination-locking-collaboration-042
  difficulty: advanced
  tags: [scenario, ot-vs-crdt, judgment]
  question: |
    You are choosing collaboration tech for a design tool whose document is a tree of objects with
    properties (not primarily text), served from a central cloud backend to mostly-online users. Which
    choice is most appropriate?
  options:
  - "Pure decentralized CRDTs with no central authority, to allow arbitrary peer-to-peer sync directly between the mostly-online clients"
  - "Character-level Operational Transformation designed for plain text, applying transform functions to each keystroke against the object tree"
  - "A server-authoritative model with last-writer-wins per property (Figma-style), dropping both OT transform
    complexity and pure-CRDT decentralization overhead because the server can define event order"
  - "A global lock on the file so only one editor at a time"
  answer: 2
  explanation: |
    For an object-graph with a central server, server-authoritative per-property LWW (Figma's model)
    is leanest and correct. Pure CRDTs add unneeded decentralization overhead, text OT does not fit an
    object tree, and a global lock kills multiplayer.
  ref: concepts.md#operational-transformation-versus-crdts-deep-trade-offs
- id: design-coordination-locking-collaboration-043
  difficulty: advanced
  tags: [scenario, presence, capacity]
  question: |
    A collaborative doc room has 50 active users; each broadcasts cursor updates at 10 Hz at ~50 bytes.
    Cursor fan-out is the dominant cost. Which mitigation set is most appropriate for scaling to rooms
    of thousands?
  options:
  - "Persist every single cursor frame durably to disk and replicate each one through the consensus log so no cursor movement is ever lost"
  - "Coalesce/throttle updates (e.g., cap at 20-30 Hz, drop intermediate frames) and fan out via a pub/sub
    broker or regional edge relays, treating presence as lossy"
  - "Route all presence traffic through the same durable, consensus-ordered document write path so cursors stay perfectly consistent with edits"
  - "Increase the distributed-lock TTL on the document so cursor updates are batched under one holder and the fan-out cost drops"
  answer: 1
  explanation: |
    Presence fan-out grows with room size; throttling/coalescing plus edge pub/sub keeps it cheap, and
    loss is acceptable. Durable+consensus persistence of cursors is absurdly expensive, sharing the
    document write path wastes its budget, and lock TTLs are unrelated to presence.
  ref: concepts.md#presence-and-awareness
- id: design-coordination-locking-collaboration-044
  difficulty: advanced
  tags: [scenario, optimistic-vs-pessimistic, contention]
  question: |
    A hot inventory row is updated by many concurrent writers, and each retry involves an expensive
    recomputation. Optimistic concurrency is causing a storm of retries and wasted work. What is the
    most appropriate change?
  options:
  - "Keep the optimistic concurrency scheme unchanged, because CAS retries are always cheap and the recomputation cost is irrelevant to throughput"
  - "Remove all concurrency control from the hot row and simply accept the lost updates, since inventory drift can be reconciled later anyway"
  - "Shard the single hot inventory row across 100 independent keys, which eliminates the shared-quantity semantic constraint entirely"
  - "Switch to pessimistic locking on that hot row, because under high contention with expensive retries,
    serializing writers avoids repeated wasted work"
  answer: 3
  explanation: |
    Under high contention with costly retries, optimistic concurrency thrashes; pessimistic locking
    serializes and avoids the wasted recomputation. Retries are not always cheap here, dropping control
    loses updates, and you usually cannot shard a single semantic quantity without breaking its
    invariant.
  ref: concepts.md#distributed-mutual-exclusion-trade-offs-safety-versus-liveness
- id: design-coordination-locking-collaboration-045
  difficulty: advanced
  tags: [scenario, idempotent-fencing]
  question: |
    To make a write path robust against BOTH a stale (paused) actor AND duplicate retries, what
    combination does the material recommend?
  options:
  - "A fencing token to reject stale (out-of-order) writers, plus an idempotency key so a retried write
    is deduped to a no-op"
  - "A fencing token alone at the resource, which by itself both rejects stale writers and collapses duplicate retries into a single effect"
  - "An idempotency key alone at the resource, which by itself both dedupes retries and rejects a stale paused writer carrying an old token"
  - "A longer lock TTL combined with more Redis replicas in the quorum, which together close both the stale-actor and duplicate-retry gaps"
  answer: 0
  explanation: |
    Fencing handles ordering/mutual exclusion (stale actor); idempotency handles duplicates (retries).
    Each alone leaves a gap: fencing does not dedupe retries, and idempotency alone does not reject an
    out-of-order stale writer with a fresh key. TTL+replicas addresses neither directly.
  ref: concepts.md#fencing-tokens-and-idempotency
- id: design-coordination-locking-collaboration-046
  difficulty: advanced
  tags: [scenario, fencing, resource-participation]
  question: |
    You want fencing-token protection, but your storage backend is a dumb blob store with no
    conditional-write or comparison capability. What is the correct conclusion?
  options:
  - "Fencing works anyway because the monotonic token travels attached to each write, and its mere presence in the payload fences out stale holders"
  - "Blob stores automatically enforce fencing internally, silently comparing tokens on every PUT and rejecting any write carrying a lower one"
  - "Fencing is impossible here because the protected resource cannot check/reject stale tokens; you must
    either add a resource that can enforce ordering or accept a weaker guarantee"
  - "You can enforce fencing purely in the client, having each client compare its own token against the last one it saw before writing to the blob store"
  answer: 2
  explanation: |
    Fencing requires the *resource* to record the max token and reject lower ones; a store with no
    conditional write cannot do that, so fencing cannot be enforced there. Attaching a token the store
    ignores does nothing, and a client cannot fence itself (the whole point is the client may be
    stale).
  ref: concepts.md#fencing-tokens-and-idempotency
- id: design-coordination-locking-collaboration-047
  difficulty: advanced
  tags: [consensus, flp, partial-synchrony]
  question: |
    How do practical consensus systems (Raft/ZAB) escape the FLP impossibility result, which says no
    deterministic async consensus can guarantee termination with one faulty node?
  options:
  - "They contain a formal proof that the FLP result is mistaken, so deterministic asynchronous consensus can in fact always guarantee termination"
  - "They run on faster CPUs and low-latency NICs that make the network genuinely synchronous, so the asynchronous FLP model no longer applies"
  - "They abandon the safety guarantee (allowing two conflicting values to commit) in exchange for always guaranteeing that the protocol terminates"
  - "They add partial-synchrony assumptions (timeouts and failure detectors), trading guaranteed termination
    for 'terminates when the network behaves,' which is why liveness (not safety) degrades under bad conditions"
  answer: 3
  explanation: |
    FLP holds in the pure async model; real systems add timeouts/failure detectors (partial synchrony)
    so they terminate when timing is reasonable — sacrificing guaranteed liveness, never safety. They
    do not disprove FLP, hardware cannot make a network truly synchronous, and they keep safety.
  ref: concepts.md#consensus-as-the-foundation
- id: design-coordination-locking-collaboration-048
  difficulty: advanced
  tags: [scenario, single-leader, throughput]
  question: |
    A single-leader design gives you a clean serialization point and easy strong consistency, but your
    write throughput has plateaued and failovers cause seconds of unavailability. Which statement best
    frames the trade-off you are hitting?
  options:
  - "A single-leader design has no inherent downsides, so the throughput plateau and the failover gap must both be implementation bugs to fix"
  - "A single leader is an inherent throughput ceiling (all writes funnel through one node) and introduces
    a failover gap during re-election; scaling further means partitioning writes or moving to a leaderless
    model, accepting weaker ordering"
  - "Adding more read replicas behind the leader will raise write throughput, because offloaded reads free the leader to accept more writes"
  - "Switching to a different consensus protocol (e.g., Paxos or ZAB) removes the single-writer ceiling and lets writes scale linearly"
  answer: 1
  explanation: |
    Funneling all writes through one leader is a structural ceiling, and re-election creates a
    failover gap — both inherent, not bugs. Read replicas do not raise write throughput, and no
    consensus protocol removes the single-writer ceiling; you must partition or go leaderless (trading
    global ordering).
  ref: concepts.md#leader-election
- id: design-coordination-locking-collaboration-049
  difficulty: advanced
  tags: [scenario, mutual-exclusion, granularity]
  question: |
    Under heavy contention across MANY independent items, you must choose lock granularity. What is the
    correct trade-off reasoning?
  options:
  - "Use fine-grained per-item locks for high concurrency, accepting more locks to manage and strict lock-ordering
    rules to avoid deadlock; a coarse lock would serialize independent work into a hotspot"
  - "Use a single coarse lock over everything, since it is the simplest to reason about and per-item concurrency does not actually matter under load"
  - "Fine-grained per-item locks inevitably deadlock no matter how you order acquisitions, so you must never use them in a contended system"
  - "Lock granularity has no measurable effect on concurrency, so choose whichever is easiest to code and expect identical throughput either way"
  answer: 0
  explanation: |
    Independent items under contention benefit from fine-grained locks (concurrency), at the cost of
    more locks and disciplined ordering to prevent deadlock. A coarse lock creates a hotspot;
    fine-grained locks do not *always* deadlock (ordering prevents it); granularity clearly affects
    concurrency.
  ref: concepts.md#distributed-mutual-exclusion-trade-offs-safety-versus-liveness
- id: design-coordination-locking-collaboration-050
  difficulty: expert
  tags: [scenario, redlock, clock-jump]
  question: |
    Redis expiry relies on gettimeofday rather than a monotonic clock. In a Redlock deployment, how can
    this specifically break the majority-based safety argument?
  options:
  - "It cannot break the argument, because gettimeofday returns wall-clock time that is guaranteed monotonic and never steps backward on a master"
  - "It can only affect the lock-release path and never acquisition, so the majority-based safety argument at acquire time is entirely unaffected"
  - "An NTP step or manual clock change on one or more masters can expire keys early or late, so the set
    of masters that 'still hold' the lock no longer reflects reality, letting two clients believe they
    hold a majority"
  - "Clock jumps only shift when keys expire, which makes Redlock acquire and release faster while leaving its majority safety guarantee fully intact"
  answer: 2
  explanation: |
    Wall-clock jumps desynchronize key expiry across masters, undermining the majority reasoning and
    permitting two simultaneous majority-holders. Wall-clock time is not monotonic, the effect is not
    limited to release, and it degrades safety, not just speed.
  ref: concepts.md#redlock-and-its-criticisms
- id: design-coordination-locking-collaboration-051
  difficulty: expert
  tags: [scenario, exactly-once, judgment]
  question: |
    Design a distributed scheduler that must trigger each job "exactly once" across a fleet even under
    pauses and partitions. Which architecture is the most defensible?
  options:
  - "A single Redis lock per job with a short TTL, where whichever node grabs the lock first fires the job and the TTL prevents any second firing"
  - "Every node in the fleet independently fires every job on schedule, and a nightly batch job afterward detects and removes the duplicate triggers"
  - "Redlock acquired across 5 independent Redis masters per job, trusting the majority acquisition and TTL together to prevent any double firing"
  - "Leader election (consensus-backed lease with epoch) to designate one trigger node, PLUS idempotent
    job execution keyed by job-run-id so any accidental double-trigger is deduped downstream — because
    true exactly-once triggering is impossible, you make double-triggers harmless"
  answer: 3
  explanation: |
    Exactly-once *delivery/triggering* is impossible under partitions, so the robust design is
    at-least-once triggering (via a fenced leader) made effectively-once by idempotent, keyed
    execution. A bare Redis lock or Redlock has the pause race with no fencing; nightly dedup cannot
    undo side effects already emitted.
  ref: concepts.md#when-a-lock-is-the-wrong-tool
- id: design-coordination-locking-collaboration-052
  difficulty: expert
  tags: [scenario, safety-liveness, ttl-fencing]
  question: |
    A TTL guarantees a crashed holder's lock is eventually released. Precisely which property does the
    TTL provide, which does it endanger, and how is that restored?
  options:
  - "The TTL provides safety and endangers liveness, and the lost liveness is restored simply by configuring progressively longer TTL values"
  - "TTL provides liveness (eventual release even if a holder dies) but endangers safety (the pause race
    can create two holders); safety is restored by fencing tokens enforced at the resource, not by tuning
    the TTL"
  - "The TTL provides both safety and liveness at once with no downside, guaranteeing eventual release while making two simultaneous holders impossible"
  - "The TTL only affects performance (how quickly a lock frees up) and has no bearing on the correctness properties of safety or liveness at all"
  answer: 1
  explanation: |
    A TTL is a liveness mechanism (guarantees progress/release) that trades away safety via the pause
    race; only fencing at the resource restores safety without giving up that liveness. It is not a
    safety mechanism, it is not free of downside, and it clearly affects correctness.
  ref: concepts.md#distributed-mutual-exclusion-trade-offs-safety-versus-liveness
- id: design-coordination-locking-collaboration-053
  difficulty: expert
  tags: [scenario, crdt-overhead, gc]
  question: |
    An Automerge/Yjs-style CRDT document that has seen millions of edits (many deletions) is growing
    far beyond its visible content size and slowing sync. What is the correct diagnosis and mitigation?
  options:
  - "Accumulated tombstones and per-element ids inflate the structure; mitigate with garbage collection
    of tombstones, compaction, and columnar/binary encoding (as modern CRDT libraries do)"
  - "A CRDT document can never grow beyond its visible content size, so the reported growth is impossible and must be a measurement or reporting error"
  - "Switch to storing the whole document as one giant lock-protected blob, serializing every edit behind a distributed lock to stop the growth"
  - "The runaway growth is resolved by increasing the distributed-lock TTL on the document so the structure compacts itself on each release"
  answer: 0
  explanation: |
    CRDT metadata (tombstones + ids) is exactly what bloats over long histories; GC/compaction and
    efficient encoding are the known mitigations. Growth beyond visible content is precisely the
    classic CRDT cost, a lock-protected blob abandons collaboration, and TTLs are unrelated.
  ref: concepts.md#collaborative-editing-with-crdts
- id: design-coordination-locking-collaboration-054
  difficulty: expert
  tags: [scenario, kraft, operational]
  question: |
    Kafka is moving from an external ZooKeeper ensemble to KRaft (embedded Raft). What is the primary
    architectural motivation and its trade-off?
  options:
  - "KRaft converts Kafka's metadata plane into an AP system, so the controller keeps accepting metadata writes on both sides during a partition"
  - "KRaft eliminates the need for any consensus at all, letting brokers agree on metadata through simple gossip instead of a replicated log"
  - "Embedding Raft removes a separately-operated coordination dependency (fewer moving parts, simpler
    ops, faster metadata propagation), at the cost of folding consensus responsibilities into the broker/controller
    quorum itself"
  - "KRaft lets Kafka store and update its cluster metadata without any quorum, since the embedded controller writes it locally on a single node"
  answer: 2
  explanation: |
    KRaft's motivation is removing the external ZooKeeper operational burden and speeding metadata
    handling by embedding Raft; consensus still exists (now in the controller quorum). It does not make
    Kafka AP, does not remove consensus, and still needs a quorum for metadata.
  ref: concepts.md#zookeeper-etcd-and-consul-as-coordination-services
- id: design-coordination-locking-collaboration-055
  difficulty: expert
  tags: [scenario, ot-correctness]
  question: |
    A team hand-rolls Operational Transformation for a rich editor (text + tables + images) and keeps
    hitting divergence bugs. Which explanation best matches the known literature?
  options:
  - "OT is mathematically impossible: no set of transformation functions can ever make two concurrent replicas converge, so any editor that appears to work is silently masking divergence"
  - "Writing correct transformation functions for all operation pairs is notoriously error-prone (several
    published OT algorithms were later proven incorrect), and complexity explodes with rich content —
    hence server-ordered variants or CRDTs are often preferred"
  - "The divergence always originates in the network transport dropping or reordering packets, never in the transformation functions, which are provably correct by construction for any operation pair"
  - "Tables and images simply cannot be collaboratively edited by any known technique, so the divergence is inherent and the only fix is to lock those regions to a single editor at a time"
  answer: 1
  explanation: |
    OT's correctness burden lives in the transform functions, which are famously hard and have had
    published errors; rich content multiplies operation-pair combinations. OT can converge (so not
    impossible), the bug is in transforms not the network, and rich content is editable with proper
    designs.
  ref: concepts.md#collaborative-editing-with-operational-transformation
- id: design-coordination-locking-collaboration-056
  difficulty: expert
  tags: [scenario, consensus, quorum-loss]
  question: |
    A 5-node etcd cluster spans three racks (2/2/1). A rack failure takes down 2 nodes; later a second
    rack (2 nodes) partitions away. How many nodes remain able to serve writes, and what happens?
  options:
  - "3 nodes remain reachable across the surviving racks, so a majority is still intact and writes continue normally with no interruption to linearizable reads"
  - "The lone surviving node detects it is the last member standing and promotes itself to leader, continuing to serve writes so the cluster stays available"
  - "etcd automatically shrinks its configured quorum size down to 1 to match the surviving node count, letting that node keep committing writes on its own"
  - "Only 1 node remains reachable in its partition, which is below the majority of 3, so writes and linearizable
    reads halt until quorum is restored — safety preserved over availability"
  answer: 3
  explanation: |
    Majority of 5 is 3; after losing 2 and then partitioning off 2 more, the surviving side has 1 node,
    below quorum, so it must stop serving writes/linearizable reads. A lone node self-promoting or the
    cluster auto-shrinking quorum would risk split-brain and is not how correct consensus behaves.
  ref: concepts.md#consensus-as-the-foundation
- id: design-coordination-locking-collaboration-057
  difficulty: expert
  tags: [scenario, lock-vs-alternative, judgment]
  question: |
    A senior reviewer says "any time you reach for a distributed lock, first ask whether you can design
    it away." Which set of alternatives correctly maps to common lock use cases?
  options:
  - "Dedup/'process once' -> idempotency keys; 'serialize writes to a key' -> partition by key/single-writer;
    'prevent lost updates' -> optimistic concurrency (CAS); 'one node runs it' -> leader election; 'merge
    concurrent edits' -> CRDT/OT"
  - "Every one of these use cases must remain a distributed lock; the mapping is a false premise because none of them has any correct non-lock alternative in practice"
  - "Every case above should be standardized on Redlock across five masters for uniformity, since a single lock abstraction is easier to operate than five different primitives"
  - "Rate limiting must always be built on a distributed lock to be correct, because only mutual exclusion can keep a shared request budget from being overspent under concurrency"
  answer: 0
  explanation: |
    Each classic lock use case has a purpose-built, usually cheaper and more robust alternative, which
    is the senior instinct. Locks are not the only option, Redlock-for-everything ignores fit and the
    pause race, and rate limiting should use counters/token buckets (locks needlessly serialize).
  ref: concepts.md#when-a-lock-is-the-wrong-tool
- id: design-coordination-locking-collaboration-058
  difficulty: expert
  tags: [scenario, presence-vs-state, consistency]
  question: |
    In a large collaborative app, engineers propose routing live cursor presence through the same Raft
    log that orders document mutations "for consistency." Why is this the wrong call?
  options:
  - "Presence actually demands even stronger consistency than document edits, so a single Raft log is too weak and cursors ought to ride a separate, higher-guarantee linearizable channel"
  - "A Raft replicated log physically cannot carry messages as small as a cursor position, so presence has to be padded and batched before it can be committed to the log at all"
  - "Presence is high-frequency and disposable; pushing it through a consensus log wastes the expensive
    linearizable path on data that is lossy-tolerant and worthless when stale, and would throttle real
    document throughput"
  - "It is correct and in fact the standard industry approach, because ordering cursors in the same log as edits is the only way to keep a remote cursor from ever appearing at a stale position"
  answer: 2
  explanation: |
    Presence tolerates loss and eventual/LWW semantics; consensus-ordering it wastes the costly path
    and starves real writes. Presence needs *weaker*, not stronger, consistency; Raft can carry small
    messages; and this is explicitly not the standard approach.
  ref: concepts.md#presence-and-awareness
- id: design-coordination-locking-collaboration-059
  difficulty: intermediate
  tags: [consul, discovery, comparison]
  question: |
    Which pairing of coordination service to its most distinctive strength is correct?
  options:
  - "etcd -> a first-class native service catalog with built-in DNS-based discovery and health checking as its single most distinctive signature strength"
  - "ZooKeeper -> a flat key-value namespace with time-bound leases as its signature model, exactly the design that made it the default store inside Kubernetes"
  - "Consul -> the hierarchical tree/znode data model with ephemeral sequential nodes, the design popularized by the Hadoop and Kafka ecosystems"
  - "etcd -> Kubernetes-native flat KV with MVCC revisions and gRPC; ZooKeeper -> hierarchical znodes
    with mature Hadoop/Kafka-era recipes; Consul -> built-in service discovery and health checks"
  answer: 3
  explanation: |
    etcd is K8s-native flat KV/MVCC, ZooKeeper is the hierarchical-znode/recipes veteran, and Consul
    leads on service discovery/health checks. The other options swap these signatures (service catalog
    is Consul's, znodes are ZooKeeper's, leases/flat-KV are etcd's).
  ref: concepts.md#zookeeper-etcd-and-consul-as-coordination-services
- id: design-coordination-locking-collaboration-060
  difficulty: intermediate
  tags: [leader-election, mechanism]
  question: |
    What is the most common production mechanism for leader election in modern systems?
  options:
  - "The classic Bully algorithm run over UDP broadcast, where the highest-id node that answers a ping is declared leader by every peer independently"
  - "Racing to create an ephemeral (or lowest sequential) node in a consensus-backed service like ZooKeeper/etcd,
    or electing via a consensus protocol's own leader (Raft term)"
  - "Whichever node happens to own the numerically highest IP address on the subnet, a choice each node computes independently with no messages exchanged between peers"
  - "A random node freshly picked by the client on each individual request, so leadership rotates continuously and no single node stays in charge for long"
  answer: 1
  explanation: |
    Production election typically leans on a consensus-backed service (ephemeral/sequential node) or
    the consensus protocol's built-in leader, getting correctness for free. Bully/highest-IP schemes
    assume reliable failure detection and are rarely used; client-random picking gives no agreement.
  ref: concepts.md#leader-election
- id: design-coordination-locking-collaboration-061
  difficulty: intermediate
  tags: [consensus, protocols, comparison]
  question: |
    Which statement about Paxos, Raft, and ZAB is accurate?
  options:
  - "Raft was explicitly designed for understandability with explicit leader election and log matching,
    and is now the default in etcd, Consul, and CockroachDB; ZAB is ZooKeeper's protocol"
  - "Paxos is by far the easiest of the three to understand and implement, which is why it dominates new systems while Raft and ZAB have faded into legacy use"
  - "Both Raft and Paxos deliberately avoid electing any leader at all, agreeing on every value through fully symmetric peer-to-peer voting rounds instead"
  - "ZAB is the consensus protocol used by etcd and by the Kubernetes control plane, having replaced Raft in those systems for its stronger ordering guarantees"
  answer: 0
  explanation: |
    Raft's design goal was understandability and it now backs etcd/Consul/CockroachDB; ZAB is
    ZooKeeper's. Paxos is famously hard (not easy), Multi-Paxos and Raft both use a leader, and etcd
    uses Raft (not ZAB).
  ref: concepts.md#consensus-as-the-foundation
- id: design-coordination-locking-collaboration-062
  difficulty: intermediate
  tags: [mutual-exclusion, classic-algorithms]
  question: |
    In a central-coordinator mutual-exclusion scheme (request/grant/release), what is the main
    drawback despite its simplicity and low message count?
  options:
  - "It requires tightly synchronized monotonic clocks on every node, and a few milliseconds of skew silently breaks grant ordering"
  - "It cannot prevent two clients holding the critical section at once even when no node has failed, since grant and release can race"
  - "The coordinator is a single point of failure — if it dies, no one can acquire or release the critical
    section until it recovers"
  - "It needs a full majority quorum round trip for every single entry into the critical section, so latency climbs steeply as the cluster grows"
  answer: 2
  explanation: |
    The central coordinator is simple and cheap (3 messages/entry) but is a SPOF whose failure halts
    all mutual exclusion. It does not require synced clocks, does correctly enforce one holder in the
    no-failure case, and needs no quorum.
  ref: concepts.md#distributed-mutual-exclusion-trade-offs-safety-versus-liveness
- id: design-coordination-locking-collaboration-063
  difficulty: beginner
  tags: [consensus, quorum]
  question: |
    A cluster of 5 nodes uses majority quorum consensus. How many node failures can it tolerate while
    still committing writes?
  options:
  - "4"
  - "3"
  - "0"
  - "2"
  answer: 3
  explanation: |
    With 2f+1 = 5, f = 2 failures tolerated (a majority of 3 must remain). Tolerating 4 would leave
    only 1 (a minority); tolerating 3 leaves 2 (also a minority); 0 would be a single node, not a
    5-node quorum.
  ref: concepts.md#consensus-as-the-foundation
- id: design-coordination-locking-collaboration-064
  difficulty: beginner
  tags: [locks, redis, primitive]
  question: |
    Which Redis command pattern is the standard primitive for acquiring a simple single-instance lock?
  options:
  - "INCR lock:key, then read the counter to enter"
  - "SET lock:key <owner-token> NX PX <ttl-ms>"
  - "GET lock:key, acquiring only if the reply is empty"
  - "EXPIRE lock:key <ttl> after a plain SET"
  answer: 1
  explanation: |
    SET with NX (only if absent) and PX (millisecond TTL) atomically acquires the lock and sets expiry
    with an owner token. INCR/GET/EXPIRE alone do not atomically acquire-with-owner-and-TTL, which is
    what a safe simple lock needs.
  ref: concepts.md#distributed-locks-and-their-failure-modes
- id: design-coordination-locking-collaboration-065
  difficulty: beginner
  tags: [crdt, examples]
  question: |
    Which of these is a real system or library built on CRDTs?
  options:
  - "Yjs (and Automerge), used for local-first collaborative editing"
  - "Google Docs' original text engine, a canonical CRDT implementation"
  - "The Bully leader-election algorithm, a CRDT that converges by voting"
  - "Redis SET NX, the CRDT primitive for merging concurrent counters"
  answer: 0
  explanation: |
    Yjs and Automerge are CRDT libraries powering many collaborative editors. Google Docs uses OT (not
    CRDT), Bully is a leader-election algorithm, and SET NX is a locking primitive — none are CRDTs.
  ref: concepts.md#collaborative-editing-with-crdts
- id: design-coordination-locking-collaboration-066
  difficulty: beginner
  tags: [ot, central-server]
  question: |
    Why does classic Operational Transformation (as in Google Docs) usually rely on a central server?
  options:
  - "To encrypt all edits with a per-session key on the server before they are relayed to the other collaborators"
  - "Because browser clients are technically incapable of opening any direct connection to one another, forcing every edit through a relay"
  - "The server serializes operations into a single order and transforms/relays them, which makes OT far
    simpler than fully decentralized transformation"
  - "To transparently convert the document into a CRDT on the server so that transformation functions are no longer needed at all"
  answer: 2
  explanation: |
    A central server gives a single authoritative operation order and does the transform/relay,
    greatly simplifying OT. It is not about encryption, clients technically could connect (OT just
    works better centrally), and it does not turn the doc into a CRDT.
  ref: concepts.md#collaborative-editing-with-operational-transformation
- id: design-coordination-locking-collaboration-067
  difficulty: intermediate
  tags: [safety, liveness, definitions]
  question: |
    For a distributed lock, which correctly maps the safety and liveness properties?
  options:
  - "Safety = every requester is eventually granted the lock; Liveness = two clients never hold the lock at the same instant"
  - "Safety = never two holders at once; Liveness = a requester eventually acquires it (no deadlock/starvation)"
  - "Safety and liveness are two names for the same single property of a lock"
  - "Safety means the lock's acquire latency stays low; liveness means its throughput stays high"
  answer: 1
  explanation: |
    Safety is "nothing bad happens" (never two holders); liveness is "something good eventually
    happens" (eventual acquisition). The swapped-definition choice reverses them, they are distinct
    properties, and neither equals raw latency/throughput.
  ref: concepts.md#distributed-mutual-exclusion-trade-offs-safety-versus-liveness
- id: design-coordination-locking-collaboration-068
  difficulty: advanced
  tags: [scenario, redlock-vs-single-redis, judgment]
  question: |
    A team currently uses Redlock (5 masters) purely to reduce duplicate execution of a cheap,
    idempotent background task where an occasional double-run is harmless. What is the best
    recommendation?
  options:
  - "Keep Redlock exactly as is, because adding independent masters to the acquisition quorum always strictly increases the safety of the lock"
  - "Upgrade to a ZooKeeper-backed lock issuing monotonic fencing tokens enforced at the resource, giving this background task correctness-grade mutual exclusion"
  - "Expand the Redlock quorum from five masters to seven so that a larger majority is required, buying additional safety margin for the task"
  - "Downgrade to a single Redis SET NX PX (or drop the lock and rely on the task's idempotency), because
    for an efficiency-only lock the 5-node overhead is unjustified"
  answer: 3
  explanation: |
    For an efficiency lock over an idempotent task, Redlock's overhead buys nothing meaningful; a
    single Redis lock (or leaning on idempotency) is appropriate. More masters do not add correctness
    value here, and ZooKeeper+fencing is correctness-grade overkill for a harmless double-run.
  ref: concepts.md#redlock-and-its-criticisms
- id: design-coordination-locking-collaboration-069
  difficulty: advanced
  tags: [scenario, watchdog, pause-race]
  question: |
    A library (e.g., Redisson-style) auto-renews the lock TTL via a background "watchdog" thread while
    work proceeds. Does this eliminate the pause-race correctness problem?
  options:
  - "No — a stop-the-world pause freezes the watchdog thread too, so the lease can still expire and be
    reassigned while the paused process later resumes believing it holds the lock; fencing is still required
    for correctness"
  - "Yes — continuous TTL auto-renewal keeps the lease alive for as long as work runs, which fully closes the pause race and makes the lock correct"
  - "Yes, because the watchdog executes inside the OS kernel scheduler rather than the JVM, so it keeps renewing the lease even while application threads are frozen"
  - "No, but only because of the extra network encryption overhead on each renewal packet, which is easily removed by disabling TLS on the lock connection"
  answer: 0
  explanation: |
    A watchdog improves the TTL dilemma but pauses along with the whole process during a
    stop-the-world event, so the pause race persists; correctness still needs fencing at the resource.
    The watchdog is an application thread (not immune in the kernel), and encryption is irrelevant.
  ref: concepts.md#distributed-locks-and-their-failure-modes
- id: design-coordination-locking-collaboration-070
  difficulty: advanced
  tags: [scenario, crdt-families, tradeoff]
  question: |
    You are choosing between a state-based (CvRDT) and operation-based (CmRDT) CRDT for syncing over a
    constrained mobile network. What is the key trade-off?
  options:
  - "State-based CRDTs are always smaller on the wire, since shipping the full merged state compresses better than sending each individual operation separately"
  - "Operation-based CRDTs need no delivery guarantees at all, because each operation is self-describing and converges correctly no matter the order or how many times it arrives"
  - "State-based has simple merge math but ships full/large state (heavy on the wire); operation-based
    ships lighter operations but requires reliable, causal delivery of those operations"
  - "They are identical in every practical respect, so the state-based versus operation-based distinction has no bearing on bandwidth or delivery requirements over a mobile link"
  answer: 2
  explanation: |
    CvRDT merges are mathematically simple but transmit bulky state; CmRDT sends compact ops but
    depends on reliable causal delivery. State-based is generally *heavier* on the wire, op-based does
    need delivery guarantees, and they are not identical.
  ref: concepts.md#collaborative-editing-with-crdts
- id: design-coordination-locking-collaboration-071
  difficulty: expert
  tags: [scenario, coordination-cost, hot-path]
  question: |
    An architect wants to add a consensus-backed lock on the hottest write path of a 100k-QPS service
    "to be safe." What is the strongest objection?
  options:
  - "Consensus-backed locks are simply not safe enough for a hot write path, so the real fix is to add more replicas to the quorum until the safety margin is acceptable"
  - "Consensus locks add essentially no latency to a request, so the only real objection is the dollar cost of running the extra coordination nodes"
  - "The lock will be perfectly fine; 100k QPS routed through a single consensus leader is a trivial, well-within-budget load for any modern coordination system"
  - "Each lock acquisition is a quorum round trip (often cross-AZ, tens of ms) and serializes through
    a leader, so it would cap throughput and add latency to the hottest path — coordination belongs on
    low-volume metadata, not the hot path; redesign via partitioning or idempotency instead"
  answer: 3
  explanation: |
    Consensus coordination costs a quorum RTT and a leader bottleneck — fatal on a 100k-QPS hot path;
    it is meant for low-volume high-value metadata. The objection is not about safety, consensus is not
    latency-free, and 100k QPS through a single quorum leader is not trivial.
  ref: concepts.md#consensus-as-the-foundation
- id: design-coordination-locking-collaboration-072
  difficulty: expert
  tags: [scenario, comparison-table, decision]
  question: |
    Match the requirement to the best coordination choice: (a) mostly-online SaaS editing large plain
    text with minimal bandwidth; (b) offline-first multi-device note sync; (c) a structured object-graph
    design tool with a central backend.
  options:
  - "(a) CRDT for bandwidth, (b) OT with a relay, (c) a global lock on the file"
  - "(a) OT, (b) CRDT, (c) server-authoritative last-writer-wins per property (Figma-style)"
  - "(a) global lock, (b) OT over a relay, (c) fully decentralized peer-to-peer CRDTs"
  - "(a) CRDT for large text, (b) CRDT offline sync, (c) a character-level OT engine"
  answer: 1
  explanation: |
    Large-text online SaaS favors OT's compactness + server ordering; offline-first multi-device favors
    CRDTs' coordinator-free convergence; a central object-graph tool favors server-authoritative
    per-property LWW. The other mappings misassign these based on the trade-off analysis.
  ref: concepts.md#operational-transformation-versus-crdts-deep-trade-offs
- id: design-coordination-locking-collaboration-073
  difficulty: intermediate
  tags: [fencing, resource-check]
  question: |
    With fencing tokens in place, what must the protected resource do on each write to actually enforce
    safety?
  options:
  - "Record the highest token it has accepted and reject any write carrying a lower token"
  - "Accept every incoming write regardless of the token value, trusting the lock service to have already kept stale holders out"
  - "Persist the token alongside each write purely for auditing, but never compare values when deciding whether to apply the write"
  - "Mint a fresh random token on each write and store that instead of checking the caller's supplied token"
  answer: 0
  explanation: |
    The resource enforces ordering by tracking the max accepted token and rejecting lower ones, fencing
    stale writers. Accepting everything or ignoring the token defeats fencing, and the resource must
    *check* the lock service's monotonic token, not mint its own random one.
  ref: concepts.md#fencing-tokens-and-idempotency
- id: design-coordination-locking-collaboration-074
  difficulty: advanced
  tags: [scenario, split-brain-lock, independent-stores]
  question: |
    Two data centers each run an independent Redis for locking, and the app "acquires" a resource lock
    in whichever DC it can reach during a partition. What correctness problem does this create?
  options:
  - "None; two independent Redis instances always coordinate their grants automatically, so at most one client ever holds the lock"
  - "Only a performance problem — the extra cross-DC round trips add latency, but the mutual-exclusion guarantee itself stays intact"
  - "Split-brain locking — during a partition, one client can hold the lock in DC-A while another holds
    it in DC-B, so two holders act simultaneously; the locks share no single source of truth"
  - "The two stores will both refuse to grant during the partition, causing a temporary deadlock but never allowing a double-holder"
  answer: 2
  explanation: |
    Independent per-DC lock stores have no shared agreement, so a partition lets both DCs grant the same
    lock — classic split-brain with two holders. This is a correctness problem (not just performance),
    and the locks do grant (that is the danger), not deadlock.
  ref: concepts.md#distributed-locks-and-their-failure-modes
- id: design-coordination-locking-collaboration-075
  difficulty: expert
  tags: [scenario, irreducible-cost, judgment]
  question: |
    Which statement about the "irreducible costs" of coordination is correct to assert in an interview?
  options:
  - "With a cleverly pipelined algorithm, linearizable fault-tolerant writes can commit locally and beat the one-quorum-round-trip floor entirely"
  - "A single leader has no inherent throughput ceiling as long as you offload reads to replicas, since that frees the leader to accept unlimited writes"
  - "TTL-based locks become fully correctness-safe once the TTL is provisioned longer than any possible stop-the-world pause, closing the two-holder race"
  - "Any linearizable fault-tolerant write costs at least one quorum round trip; any TTL lock has the
    pause race and needs fencing for correctness; any single leader is a throughput ceiling; and a CP
    service is unavailable for writes on the minority side of a partition — by design"
  answer: 3
  explanation: |
    These are the fundamental, unavoidable costs: quorum RTT for linearizable writes, the pause race
    for TTL locks (needing fencing), the single-leader ceiling, and CP minority unavailability. You
    cannot beat the quorum RTT, sharding reads does not lift the write ceiling, and no TTL length makes
    a bare lock correctness-safe.
  ref: concepts.md#trade-offs-and-when-to-use-what
- id: design-coordination-locking-collaboration-076
  difficulty: intermediate
  tags: [when-not-to-lock, rate-limiting]
  question: |
    Why is a distributed lock a poor tool for implementing a rate limiter or quota?
  options:
  - "Locks acquire far too quickly for rate limiting, so requests slip through before the limiter can meter them against the budget"
  - "A lock serializes access (one holder at a time), whereas rate limiting needs concurrent counting;
    a shared counter / token bucket is the right primitive and does not force serialization"
  - "Rate limiting fundamentally requires a full consensus round per request, a guarantee that lock primitives are structurally unable to provide"
  - "Locks can only store an owner token, never a numeric count, so they cannot track a request budget at all"
  answer: 1
  explanation: |
    Rate limiting is about counting concurrent requests against a budget, not mutual exclusion; a lock
    needlessly serializes and creates a bottleneck, while a token bucket/atomic counter fits naturally.
    Locks are not "too fast," rate limiting does not require consensus, and storage of numbers is not
    the issue.
  ref: concepts.md#when-a-lock-is-the-wrong-tool
