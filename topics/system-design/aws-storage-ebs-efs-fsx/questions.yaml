topic: 'Block and File Storage: EBS, EFS and FSx Trade-offs'
domain: system-design
topic_slug: aws-storage-ebs-efs-fsx
version: 1
questions:
  - id: aws-storage-ebs-efs-fsx-001
    difficulty: beginner
    tags:
      - primitives
      - block
      - file
      - object
    question: |
      Which storage primitive does each service implement?
    options:
      - EBS = block, EFS/FSx = file, S3 = object
      - EBS = object, EFS = block, S3 = file
      - EBS = file, EFS = object, S3 = block
      - All three are object stores with different APIs
    answer: 0
    explanation: |
      EBS is network-attached block storage (a raw disk you format/mount);
      EFS and the FSx family are managed file systems (NFS/SMB, shared POSIX/
      Windows semantics); S3 is object storage (key→blob over HTTP). Matching
      the primitive to the access pattern is the core storage-selection skill.
    ref: "concepts.md#block-file-and-object-storage-picking-the-right-primitive"
  - id: aws-storage-ebs-efs-fsx-002
    difficulty: beginner
    tags:
      - ebs
      - single-az
      - attachment
    question: |
      An EBS volume created in us-east-1a can be attached to an EC2 instance
      running in which Availability Zone(s)?
    options:
      - Any AZ in the same Region
      - Any AZ in any Region
      - Only us-east-1a (the same AZ as the volume)
      - us-east-1a and one adjacent AZ for HA
    answer: 2
    explanation: |
      EBS volumes are single-AZ resources; a volume attaches only to an
      instance in the same AZ. To move data across AZs you snapshot (snapshots
      are Regional, stored in S3) and restore in the target AZ. This single-AZ
      scope is the number-one EBS gotcha for HA design.
    ref: "concepts.md#amazon-ebs-architecture-and-how-volumes-attach"
  - id: aws-storage-ebs-efs-fsx-003
    difficulty: beginner
    tags:
      - efs
      - nfs
      - multi-az
    question: |
      What kind of storage is Amazon EFS?
    options:
      - A single-AZ block device for one EC2 instance
      - An object store accessed over an HTTP REST API
      - A managed SMB/Windows file share with Active Directory integration
      - A managed, elastic NFS file system that many clients can mount concurrently
    answer: 3
    explanation: |
      EFS is a fully managed elastic NFS (v4.x) file system with POSIX
      semantics that thousands of Linux clients (EC2, ECS/EKS, Lambda,
      on-prem) can mount at once. Block for one instance is EBS; object over
      HTTP is S3; managed SMB+AD is FSx for Windows File Server.
    ref: "concepts.md#amazon-efs-elastic-multi-az-nfs-file-storage"
  - id: aws-storage-ebs-efs-fsx-004
    difficulty: beginner
    tags:
      - s3
      - durability
    question: |
      Amazon S3 Standard is designed for how many nines of durability?
    options:
      - 99.9% (three nines)
      - 99.999999999% (eleven nines)
      - 99.99% (four nines)
      - 100% — data can never be lost
    answer: 1
    explanation: |
      S3 is designed for 11 nines (99.999999999%) of durability, storing data
      redundantly across at least three AZs in a Region. No service offers
      literal 100% durability. This extreme durability plus low per-GB cost is
      why S3 is the default for durable blobs — but it is not mountable.
    ref: "concepts.md#durability-and-availability-across-storage-services"
  - id: aws-storage-ebs-efs-fsx-005
    difficulty: beginner
    tags:
      - ebs
      - volume-types
      - gp3
    question: |
      Which EBS volume type is the recommended modern general-purpose default
      for most boot and application volumes?
    options:
      - gp3
      - gp2
      - sc1
      - standard (magnetic)
    answer: 0
    explanation: |
      gp3 is the current general-purpose SSD default: it decouples IOPS and
      throughput from capacity (3,000 IOPS + 125 MiB/s baseline free) and is
      typically ~20% cheaper than gp2 for equivalent performance. gp2 is the
      older generation; sc1/magnetic are cold HDD types unsuited to general use.
    ref: "concepts.md#ebs-volume-types-gp3-io2-block-express-st1-sc1"
  - id: aws-storage-ebs-efs-fsx-006
    difficulty: beginner
    tags:
      - fsx
      - windows
      - smb
    question: |
      A team is lifting-and-shifting a Windows application that needs SMB file
      shares with Active Directory authentication and NTFS ACLs. Which service
      fits best?
    options:
      - Amazon EFS
      - Amazon FSx for Lustre
      - Amazon FSx for Windows File Server
      - Amazon EBS io2 with Multi-Attach
    answer: 2
    explanation: |
      FSx for Windows File Server is the turnkey managed SMB + NTFS + Active
      Directory option. EFS is Linux/NFS only. FSx for Lustre is a Linux HPC
      parallel filesystem. EBS Multi-Attach is raw shared block, not an SMB
      file share.
    ref: "concepts.md#amazon-fsx-for-windows-file-server"
  - id: aws-storage-ebs-efs-fsx-007
    difficulty: beginner
    tags:
      - instance-store
      - ephemeral
    question: |
      What happens to data on an EC2 instance store (ephemeral) volume when the
      instance is stopped or terminated?
    options:
      - It is automatically snapshotted to S3
      - It persists and can be reattached to another instance
      - It is replicated to another AZ
      - It is lost
    answer: 3
    explanation: |
      Instance store is physically attached NVMe on the host and is ephemeral:
      data is lost on stop, terminate, or host failure (it survives a reboot).
      It cannot be snapshotted or detached. That is why durable data belongs on
      EBS, and instance store is only for scratch or cluster-replicated stores.
    ref: "concepts.md#instance-store-versus-ebs-for-databases"
  - id: aws-storage-ebs-efs-fsx-008
    difficulty: beginner
    tags:
      - efs
      - elastic
      - throughput
    question: |
      Which EFS throughput mode is the recommended default that auto-scales and
      requires no capacity provisioning?
    options:
      - Bursting
      - Elastic
      - Provisioned
      - Max I/O
    answer: 1
    explanation: |
      Elastic throughput is the recommended default: it scales automatically
      with workload, has no burst credits, and you pay per GB read/written.
      Bursting scales with stored size (credit-based); Provisioned is a fixed
      level you pay for; Max I/O is a legacy performance mode, not a throughput
      mode.
    ref: "concepts.md#efs-throughput-modes-and-performance-modes"
  - id: aws-storage-ebs-efs-fsx-009
    difficulty: beginner
    tags:
      - ebs
      - snapshots
      - backup
    question: |
      Where are EBS snapshots stored and at what scope?
    options:
      - In Amazon S3 (AWS-managed), at Region scope
      - On the same EBS volume, at AZ scope
      - On instance store, at host scope
      - In DynamoDB, at global scope
    answer: 0
    explanation: |
      EBS snapshots are incremental, point-in-time backups stored in
      Amazon S3 in an AWS-managed bucket, at the Region level — so they survive
      an AZ failure and can be copied cross-Region for DR. Storing a backup on
      the same volume would defeat the purpose.
    ref: "concepts.md#ebs-snapshots-backup-and-encryption"
  - id: aws-storage-ebs-efs-fsx-010
    difficulty: beginner
    tags:
      - fsx
      - lustre
      - hpc
    question: |
      Amazon FSx for Lustre is primarily designed for which class of workloads?
    options:
      - Windows SMB home directories
      - Serving static website assets over HTTP
      - High-performance computing and ML training needing very high throughput
      - Relational database transaction logs on a single instance
    answer: 2
    explanation: |
      FSx for Lustre is a managed parallel filesystem for HPC, ML training,
      genomics, and media processing, delivering sub-ms latency, hundreds of
      GB/s to TB/s throughput, and millions of IOPS, with native S3 linkage.
      Windows shares → FSx for Windows; static web assets → S3/CloudFront; a
      single-instance DB → EBS.
    ref: "concepts.md#amazon-fsx-for-lustre-and-hpc"
  - id: aws-storage-ebs-efs-fsx-011
    difficulty: beginner
    tags:
      - migration
      - datasync
    question: |
      Which service is purpose-built for online bulk data transfer and
      recurring sync between on-prem NFS/SMB and AWS storage (S3/EFS/FSx)?
    options:
      - AWS Storage Gateway
      - AWS Snowball only
      - Amazon CloudFront
      - AWS DataSync
    answer: 3
    explanation: |
      AWS DataSync is the managed online transfer/sync service (handles
      incremental sync, integrity checks, scheduling, parallelism). Storage
      Gateway provides ongoing hybrid local access, Snowball is offline
      physical transfer, and CloudFront is a CDN, not a migration tool.
    ref: "concepts.md#data-migration-datasync-storage-gateway-and-snow"
  - id: aws-storage-ebs-efs-fsx-012
    difficulty: beginner
    tags:
      - efs
      - storage-classes
      - cost
    question: |
      Which EFS storage classes are intended for colder, less frequently
      accessed data at lower per-GB cost?
    options:
      - Standard and Elastic
      - Infrequent Access (IA) and Archive
      - General Purpose and Max I/O
      - One Zone and Regional
    answer: 1
    explanation: |
      EFS Infrequent Access (IA) and Archive are lower-cost classes for colder
      data (tens-of-ms latency + a retrieval charge). Standard is the hot SSD
      class. Elastic is a throughput mode; General Purpose/Max I/O are
      performance modes; One Zone/Regional describe AZ scope — not cost tiers.
    ref: "concepts.md#efs-storage-classes-lifecycle-and-cost"
  - id: aws-storage-ebs-efs-fsx-013
    difficulty: beginner
    tags:
      - ebs
      - hdd
      - st1
    question: |
      Which EBS volume type is optimized for large, sequential, throughput-heavy
      workloads at low cost, but poor at small random I/O?
    options:
      - st1 (Throughput Optimized HDD)
      - io2 Block Express
      - gp3
      - io1
    answer: 0
    explanation: |
      st1 is a throughput-optimized HDD type ideal for big sequential streaming
      (log processing, big-data scans) with a low per-GB cost, but its IOPS
      ceiling is only ~500, so it is unsuitable for random/transactional I/O.
      io2/gp3/io1 are SSD types for IOPS-heavy work.
    ref: "concepts.md#ebs-volume-types-gp3-io2-block-express-st1-sc1"
  - id: aws-storage-ebs-efs-fsx-014
    difficulty: beginner
    tags:
      - ebs
      - encryption
      - kms
    question: |
      EBS encryption at rest is implemented using which AWS service for key
      management?
    options:
      - AWS Secrets Manager
      - AWS IAM
      - AWS KMS
      - Amazon Macie
    answer: 2
    explanation: |
      EBS encryption uses AWS KMS-managed keys (AES-256). You enable it per
      volume at creation (or account-wide via "encryption by default").
      Secrets Manager stores secrets, IAM handles access policy, and Macie
      classifies sensitive data — none of them manage EBS volume encryption
      keys.
    ref: "concepts.md#ebs-snapshots-backup-and-encryption"
  - id: aws-storage-ebs-efs-fsx-015
    difficulty: intermediate
    tags:
      - gp3
      - gp2
      - provisioning
    question: |
      What is the primary advantage of gp3 over gp2?
    options:
      - gp3 spans multiple AZs automatically while gp2 is single-AZ
      - gp3 offers 99.999% durability like io2
      - gp3 supports Multi-Attach and NVMe reservations
      - gp3 decouples provisioned IOPS/throughput from volume size, so you don't over-buy capacity to
        get IOPS
    answer: 3
    explanation: |
      With gp2 you effectively bought IOPS by buying capacity (3 IOPS/GiB), so
      a 10,000-IOPS need forced a ~3.3 TiB volume. gp3 decouples IOPS and
      throughput as independent dials from the 1 GiB–64 TiB capacity. Both are
      single-AZ; gp3 is 99.8–99.9% durable (not io2's 99.999%); and Multi-Attach
      is an io1/io2 feature, not gp3.
    ref: "concepts.md#ebs-volume-types-gp3-io2-block-express-st1-sc1"
  - id: aws-storage-ebs-efs-fsx-016
    difficulty: intermediate
    tags:
      - multi-attach
      - clustering
      - correctness
    question: |
      You enable EBS Multi-Attach on an io2 volume and mount it read-write with
      xfs on two EC2 instances. What is the likely outcome?
    options:
      - It works fine; EBS coordinates writes across instances
      - Data corruption, because xfs is not a cluster-aware filesystem and Multi-Attach shares the raw
        block device
      - The second mount is silently rejected by EBS
      - Performance doubles due to parallel writes
    answer: 1
    explanation: |
      Multi-Attach shares the raw block device to up to 16 instances; it does
      NOT coordinate writes. Mounting a non-cluster-aware filesystem (xfs/ext4)
      read-write from two hosts corrupts data. You must use a cluster-aware
      filesystem (GFS2/OCFS2) or an app with its own fencing. If you want a
      shared filesystem, use EFS/FSx instead.
    ref: "concepts.md#ebs-multi-attach-and-clustered-workloads"
  - id: aws-storage-ebs-efs-fsx-017
    difficulty: intermediate
    tags:
      - multi-attach
      - limits
    question: |
      Which statement about EBS Multi-Attach is correct?
    options:
      - It supports up to 16 Nitro instances in the same AZ, only on io1/io2
      - It supports gp3 volumes across multiple Regions
      - It gives you a POSIX filesystem automatically, like EFS
      - It allows cross-AZ attachment for high availability
    answer: 0
    explanation: |
      Multi-Attach is limited to io1/io2 volumes, up to 16 Nitro instances, all
      in the same AZ. It provides raw shared block access (no filesystem, no
      cross-AZ), so it neither gives POSIX semantics like EFS nor cross-AZ HA.
      gp3 and HDD types do not support Multi-Attach.
    ref: "concepts.md#ebs-multi-attach-and-clustered-workloads"
  - id: aws-storage-ebs-efs-fsx-018
    difficulty: intermediate
    tags:
      - efs
      - latency
      - database
    question: |
      Why is putting a latency-critical single-instance transactional database's
      data files on EFS generally a poor choice compared with EBS?
    options:
      - EFS cannot store more than 1 TB
      - EFS does not support POSIX file locking
      - EFS per-operation latency (~1 ms) is far higher than local block (µs–sub-ms), hurting a latency-sensitive
        DB
      - EFS is single-AZ and would not survive a failure
    answer: 2
    explanation: |
      EFS is a network filesystem with ~1 ms read / ~2.7 ms write first-byte
      latency — fine for shared files, but far above EBS block latency for a
      hot single-instance DB. EFS scales to petabytes (not 1 TB), supports file
      locking, and Regional EFS is multi-AZ. The disqualifier here is latency.
    ref: "concepts.md#amazon-efs-elastic-multi-az-nfs-file-storage"
  - id: aws-storage-ebs-efs-fsx-019
    difficulty: intermediate
    tags:
      - scenario
      - eks
      - shared-storage
    question: |
      300 EKS pods spread across three AZs must all read and write the SAME
      dataset with POSIX semantics. Which storage design is most appropriate?
    options:
      - A single EBS io2 volume with Multi-Attach shared to all pods
      - One gp3 volume per pod, kept in sync with a cron job
      - Store the data in S3 and have each pod GET/PUT objects with no code changes
      - Amazon EFS (Regional) mounted via the EFS CSI driver
    answer: 3
    explanation: |
      EFS Regional is a shared multi-AZ POSIX filesystem that thousands of pods
      can mount concurrently via the CSI driver — the right primitive. EBS
      Multi-Attach caps at 16 instances and is single-AZ. Per-pod volumes + cron
      sync is fragile and not shared. S3 isn't a POSIX mount and "no code
      changes" is false for object access.
    ref: "concepts.md#amazon-efs-elastic-multi-az-nfs-file-storage"
  - id: aws-storage-ebs-efs-fsx-020
    difficulty: intermediate
    tags:
      - efs
      - bursting
      - throughput
      - gotcha
    question: |
      A small (50 GiB) EFS file system on Bursting throughput serves a spiky,
      throughput-heavy workload and mysteriously slows down after a while. Why?
    options:
      - EFS automatically throttles file systems under 100 GiB
      - Bursting baseline scales with size (50 KiBps/GiB); once burst credits drain, a tiny FS is throttled
        to a low baseline
      - The General Purpose performance mode caps throughput at 1 MiBps
      - IA lifecycle moved the files to Archive
    answer: 1
    explanation: |
      Bursting throughput is proportional to stored size (50 KiBps/GiB
      baseline, bursting to 100 MiBps/TiB via credits). A small hot FS burns
      credits quickly and then falls to a very low baseline — the classic EFS
      performance incident. Switching to Elastic or Provisioned throughput
      fixes it. Monitor BurstCreditBalance.
    ref: "concepts.md#efs-throughput-modes-and-performance-modes"
  - id: aws-storage-ebs-efs-fsx-021
    difficulty: intermediate
    tags:
      - fsx
      - ontap
      - multi-protocol
    question: |
      An enterprise wants the SAME data accessible over NFS (Linux), SMB
      (Windows), and iSCSI, plus deduplication and SnapMirror replication from
      an existing on-prem NetApp. Which service fits?
    options:
      - Amazon FSx for NetApp ONTAP
      - Amazon EFS
      - Amazon FSx for OpenZFS
      - Amazon S3 with multi-protocol access points
    answer: 0
    explanation: |
      FSx for NetApp ONTAP is the multi-protocol (NFS/SMB/iSCSI) service with
      dedup/compression, snapshots, FlexClone, and SnapMirror — the natural
      target for migrating a NetApp estate. EFS is NFS-only, OpenZFS is
      NFS-only, and S3 does not offer NFS/SMB/iSCSI multi-protocol file access.
    ref: "concepts.md#amazon-fsx-for-netapp-ontap"
  - id: aws-storage-ebs-efs-fsx-022
    difficulty: intermediate
    tags:
      - instance-store
      - distributed-db
      - replication
    question: |
      For which use is instance store an acceptable choice for a database-like
      system?
    options:
      - A single-node PostgreSQL that is the system of record
      - A boot volume that must survive stop/start
      - A distributed store like Cassandra/ScyllaDB with replication factor ≥ 3
      - Any workload, because instance store can be snapshotted
    answer: 2
    explanation: |
      Instance store is safe when the CLUSTER provides durability: with
      Cassandra/Scylla (RF≥3), a node's ephemeral data loss is repaired from
      replicas. A single-node system of record would lose data on host failure.
      Boot volumes must persist across stop/start (use EBS), and instance store
      cannot be snapshotted.
    ref: "concepts.md#instance-store-versus-ebs-for-databases"
  - id: aws-storage-ebs-efs-fsx-023
    difficulty: intermediate
    tags:
      - snapshots
      - incremental
      - cost
    question: |
      EBS snapshots are described as "incremental." What does this mean for
      deleting an older snapshot in a chain?
    options:
      - Deleting an older snapshot corrupts all newer snapshots
      - You must restore snapshots in creation order
      - Only the most recent snapshot can ever be restored
      - Each snapshot stays independently restorable; deleting an old one does not break newer ones
    answer: 3
    explanation: |
      Incremental means only changed blocks are stored per snapshot, but AWS
      manages block references so each snapshot remains independently
      restorable — deleting an old snapshot re-parents needed blocks and does
      not break newer ones. You can restore any snapshot directly, in any order.
    ref: "concepts.md#ebs-snapshots-backup-and-encryption"
  - id: aws-storage-ebs-efs-fsx-024
    difficulty: intermediate
    tags:
      - fsx
      - lustre
      - s3-integration
    question: |
      What is the canonical pattern for using FSx for Lustre with a large
      dataset that lives in S3?
    options:
      - Copy the entire S3 bucket to EBS first, then to Lustre
      - Link the Lustre FS to the S3 bucket; objects appear as files (lazy-loaded), compute runs on Lustre,
        results export back to S3
      - Mount S3 directly as an NFS share and skip Lustre
      - Use Lustre only for data that never touches S3
    answer: 1
    explanation: |
      FSx for Lustre links to an S3 data repository: object listings are
      imported at creation and data is lazy-loaded on first access; results are
      written back via data repository tasks. Durable/cheap data stays in S3;
      Lustre is the fast scratch compute layer. S3 is not natively an NFS mount.
    ref: "concepts.md#amazon-fsx-for-lustre-and-hpc"
  - id: aws-storage-ebs-efs-fsx-025
    difficulty: intermediate
    tags:
      - storage-gateway
      - hybrid
    question: |
      An on-prem application must keep serving from a LOCAL low-latency endpoint
      while its data is progressively backed by AWS cloud storage. Which service
      is designed for this hybrid access?
    options:
      - AWS Storage Gateway
      - AWS DataSync
      - AWS Snowmobile
      - Amazon EFS mounted over the public internet
    answer: 0
    explanation: |
      Storage Gateway (File/Volume/Tape) is the hybrid appliance giving on-prem
      apps a local cache/endpoint (NFS/SMB/iSCSI/VTL) backed by S3/EBS/Glacier.
      DataSync is a one-shot/scheduled bulk mover (not a persistent local
      endpoint), Snowmobile is offline exabyte transport, and mounting EFS over
      the internet is not the hybrid-cache pattern.
    ref: "concepts.md#data-migration-datasync-storage-gateway-and-snow"
  - id: aws-storage-ebs-efs-fsx-026
    difficulty: intermediate
    tags:
      - durability
      - availability
      - ebs
    question: |
      Which statement best captures the difference between EBS durability and
      availability during an AZ outage?
    options:
      - EBS is multi-AZ, so an AZ outage has no effect
      - EBS automatically fails the volume over to another AZ
      - The volume is durable within its AZ but becomes unreachable if that AZ fails; AZ-level HA must
        come from a layer above EBS
      - An AZ outage permanently destroys the volume's data
    answer: 2
    explanation: |
      EBS replicates within a single AZ (durable against drive failure) but is
      not multi-AZ; an AZ outage makes the volume unreachable. HA must come
      from replicating data above EBS (Multi-AZ RDS, app replication) or
      restoring a snapshot in another AZ. The data isn't destroyed — it's just
      offline until the AZ recovers or you restore.
    ref: "concepts.md#durability-and-availability-across-storage-services"
  - id: aws-storage-ebs-efs-fsx-027
    difficulty: intermediate
    tags:
      - efs
      - one-zone
      - cost
    question: |
      What is the main trade-off of choosing EFS One Zone over EFS Regional?
    options:
      - One Zone is faster but far more expensive
      - One Zone supports SMB while Regional supports only NFS
      - One Zone has 11 nines durability while Regional has 99.9%
      - One Zone is cheaper but stores data in a single AZ, so an AZ loss means downtime
    answer: 3
    explanation: |
      One Zone stores data in a single AZ at lower cost, but sacrifices the
      multi-AZ resilience of Regional — an AZ failure means downtime (recover
      via AWS Backup). Both are NFS. The choice is a cost-vs-blast-radius
      trade-off, not a protocol or durability-nines difference of that kind.
    ref: "concepts.md#amazon-efs-elastic-multi-az-nfs-file-storage"
  - id: aws-storage-ebs-efs-fsx-028
    difficulty: intermediate
    tags:
      - fsx
      - openzfs
      - nfs
    question: |
      A Linux team wants fast, low-latency NFS with ZFS-style instant clones and
      snapshots for dev/test, without needing SMB, iSCSI, or SnapMirror. Which
      service is the best-fit, lower-complexity choice?
    options:
      - FSx for NetApp ONTAP
      - FSx for OpenZFS
      - FSx for Windows File Server
      - EFS with Provisioned throughput
    answer: 1
    explanation: |
      FSx for OpenZFS gives fast NFS with ZFS snapshots, instant zero-copy
      clones, and compression — simpler and cheaper than ONTAP when you don't
      need multi-protocol/SnapMirror. ONTAP is overkill here, FSx for Windows is
      SMB-centric, and EFS lacks ZFS-style instant clones (though it is more
      elastic).
    ref: "concepts.md#amazon-fsx-for-openzfs"
  - id: aws-storage-ebs-efs-fsx-029
    difficulty: intermediate
    tags:
      - latency
      - ballpark
      - comparison
    question: |
      Order these by typical first-byte latency, lowest to highest.
    options:
      - EBS io2 Block Express < EFS Standard < S3 Standard
      - S3 Standard < EFS Standard < EBS io2 Block Express
      - EFS Standard < EBS io2 Block Express < S3 Standard
      - S3 Standard < EBS io2 Block Express < EFS Standard
    answer: 0
    explanation: |
      Block is fastest: io2 Block Express is <500 µs. EFS Standard is ~1 ms
      read (network filesystem). S3 Standard is tens of ms first byte, offset by
      massive parallelism. So block < file < object for per-request latency.
    ref: "concepts.md#latency-throughput-and-iops-ballparks"
  - id: aws-storage-ebs-efs-fsx-030
    difficulty: intermediate
    tags:
      - cost-model
      - billing-dimensions
    question: |
      Which billing statement is correct?
    options:
      - EBS bills only for bytes you actually write, like EFS
      - EFS requires you to pre-provision capacity like EBS
      - EBS bills for provisioned GB-month (allocated, not used) plus provisioned IOPS/throughput above
        baseline
      - S3 bills per provisioned GB whether or not objects exist
    answer: 2
    explanation: |
      EBS charges for provisioned capacity (GB-month) whether or not it is full,
      plus provisioned IOPS/throughput above baseline and snapshot storage. EFS
      is elastic and bills for bytes actually stored (no capacity provisioning).
      S3 bills for stored GB + requests, not provisioned capacity.
    ref: "concepts.md#cost-models-and-back-of-envelope-estimation"
  - id: aws-storage-ebs-efs-fsx-031
    difficulty: intermediate
    tags:
      - efs
      - performance-mode
      - general-purpose
    question: |
      Which EFS performance mode does AWS now recommend for essentially all file
      systems, and why?
    options:
      - Max I/O, because it has the lowest per-operation latency
      - Bursting, because it scales with size
      - Elastic, because it is a performance mode
      - General Purpose, because it has the lowest per-operation latency
    answer: 3
    explanation: |
      General Purpose is the default and recommended performance mode: lowest
      per-operation latency. Max I/O is a legacy mode with HIGHER per-op latency
      (for extreme parallel throughput) and isn't supported with One Zone or
      Elastic. Bursting/Elastic are throughput modes, not performance modes.
    ref: "concepts.md#efs-throughput-modes-and-performance-modes"
  - id: aws-storage-ebs-efs-fsx-032
    difficulty: intermediate
    tags:
      - migration
      - snow
      - bandwidth
    question: |
      You must move 600 TB from a remote site with a slow, unreliable internet
      link before a tight deadline. Which option is usually most appropriate?
    options:
      - AWS DataSync over the public internet
      - AWS Snow Family (offline physical device)
      - S3 Cross-Region Replication
      - Increase EFS throughput and copy directly
    answer: 1
    explanation: |
      When data-size ÷ available-bandwidth exceeds the deadline, offline
      physical transfer (Snow Family) beats the wire. DataSync is bounded by the
      slow link. S3 CRR replicates between existing S3 buckets (data must
      already be in S3). EFS throughput doesn't fix a slow WAN uplink.
    ref: "concepts.md#data-migration-datasync-storage-gateway-and-snow"
  - id: aws-storage-ebs-efs-fsx-033
    difficulty: intermediate
    tags:
      - ebs
      - gp2
      - burst-credits
      - gotcha
    question: |
      A small gp2 database volume performs well initially, then degrades badly
      under sustained load. What is the root cause and best fix?
    options:
      - gp2 burst credits drained, dropping it to a low baseline (3 IOPS/GiB); move to gp3 with provisioned
        IOPS
      - The volume is full; enlarge it
      - EBS throttles all volumes older than 24 hours
      - The snapshot chain is too long; delete old snapshots
    answer: 0
    explanation: |
      Small gp2 volumes get a burst bucket to 3,000 IOPS funded by I/O credits.
      Under sustained load credits deplete and performance falls to the 3
      IOPS/GiB baseline. gp3 provides flat provisioned IOPS with no credit
      cliff, so migrating to gp3 (and setting IOPS) is the fix.
    ref: "concepts.md#ebs-iops-and-throughput-provisioning-and-burst-behavior"
  - id: aws-storage-ebs-efs-fsx-034
    difficulty: intermediate
    tags:
      - fsx
      - windows
      - multi-az
      - ha
    question: |
      For an FSx for Windows File Server workload that must survive an AZ
      failure with automatic failover, what deployment should you choose, and
      what is the trade-off?
    options:
      - Single-AZ, because Multi-AZ is not supported
      - EFS instead, because FSx has no HA option
      - Multi-AZ, which keeps a standby in a second AZ with automatic failover but costs roughly 2× Single-AZ
      - Instance store on Windows for lowest latency
    answer: 2
    explanation: |
      FSx for Windows Multi-AZ maintains a standby file server in a second AZ
      with automatic failover; the trade-off is roughly double the cost of
      Single-AZ. Single-AZ has no cross-AZ resilience. EFS is NFS/Linux (not the
      Windows/SMB fit), and instance store is ephemeral.
    ref: "concepts.md#amazon-fsx-for-windows-file-server"
  - id: aws-storage-ebs-efs-fsx-035
    difficulty: advanced
    tags:
      - io2
      - durability
      - database
      - scenario
    question: |
      A tier-1 relational database needs ~200,000 sustained IOPS at <500 µs
      latency and the strongest single-volume durability AWS offers. Which
      volume type, and what secondary check matters most?
    options:
      - gp3 at max IOPS; check the snapshot schedule
      - st1 HDD; check the burst baseline
      - Instance store; check that it is encrypted
      - io2 Block Express; also verify the instance's EBS bandwidth can sustain the throughput
    answer: 3
    explanation: |
      io2 Block Express delivers up to 256,000 IOPS, sub-500 µs latency, and
      99.999% durability — the right choice. But the practical ceiling is often
      the INSTANCE's aggregate EBS bandwidth, so you must size a Nitro instance
      that can sustain the throughput. gp3 tops out at 80,000 IOPS with lower
      durability (99.8-99.9%); st1 can't do random IOPS; instance store isn't
      durable.
    ref: "concepts.md#instance-store-versus-ebs-for-databases"
  - id: aws-storage-ebs-efs-fsx-036
    difficulty: advanced
    tags:
      - ebs
      - instance-bandwidth
      - throughput-ceiling
    question: |
      You provision an io2 Block Express volume for 4,000 MiB/s but only observe
      ~1,200 MiB/s from your application. What is the MOST likely explanation?
    options:
      - io2 Block Express cannot exceed 1,200 MiB/s
      - The EC2 instance's aggregate EBS-optimized bandwidth (or a non-Nitro instance) is the bottleneck,
        not the volume
      - The volume must be re-created to apply throughput
      - Snapshots are consuming the throughput
    answer: 1
    explanation: |
      A volume's provisioned throughput is only reachable if the instance can
      drive it: each instance has a finite EBS-optimized bandwidth, and only
      Nitro instances reach the highest ceilings. The real limiter is frequently
      the instance, not the volume. This "the volume can do X but I only get Y"
      pattern is a classic senior-level catch.
    ref: "concepts.md#ebs-iops-and-throughput-provisioning-and-burst-behavior"
  - id: aws-storage-ebs-efs-fsx-037
    difficulty: advanced
    tags:
      - scenario
      - cost
      - efs
      - tiering
    question: |
      10 TB must be shared read-write by 300 Linux containers; only ~10% is hot.
      Which design best balances shared-POSIX access with cost?
    options:
      - 'EFS Regional with Elastic throughput and lifecycle tiering: hot data on Standard, cold on IA/Archive'
      - Store all 10 TB on EBS io2 and share via Multi-Attach
      - Give each container its own gp3 volume and rsync between them
      - Put all 10 TB in S3 Standard and mount it as a filesystem with no changes
    answer: 0
    explanation: |
      EFS provides the shared multi-AZ POSIX access 300 containers need; Elastic
      throughput avoids burst-credit cliffs, and lifecycle tiering keeps the ~1
      TB hot on Standard while the ~9 TB cold moves to cheaper IA/Archive —
      controlling EFS's high per-GB cost. EBS Multi-Attach caps at 16 hosts /
      single AZ; per-container volumes aren't shared; S3 isn't a POSIX mount.
    ref: "concepts.md#cost-models-and-back-of-envelope-estimation"
  - id: aws-storage-ebs-efs-fsx-038
    difficulty: advanced
    tags:
      - fsx
      - lustre
      - scratch
      - persistent
      - durability
    question: |
      An ML pipeline reads a 40 TB dataset (source of truth in S3), runs
      transient training jobs, then discards the working set. Which FSx for
      Lustre deployment type minimizes cost while accepting the right risk?
    options:
      - Persistent, because scratch cannot link to S3
      - Persistent, because scratch cannot exceed 1 TB
      - Scratch, because data is not replicated and S3 remains the durable source of truth for a transient
        job
      - Neither; use EFS Provisioned throughput
    answer: 2
    explanation: |
      Scratch file systems are non-replicated, highest-performance-per-dollar,
      and ideal for transient processing where S3 holds the durable copy — if a
      server fails you re-import from S3. Persistent adds in-AZ replication and
      cost you don't need for a throwaway working set. Both link to S3 and scale
      well beyond 1 TB. EFS is far slower for HPC-class throughput.
    ref: "concepts.md#amazon-fsx-for-lustre-and-hpc"
  - id: aws-storage-ebs-efs-fsx-039
    difficulty: advanced
    tags:
      - encryption
      - snapshot
      - workflow
    question: |
      You have an existing UNencrypted EBS volume and must make it encrypted.
      What is the correct procedure?
    options:
      - Toggle encryption on the live volume in place
      - Detach and reattach the volume to enable encryption
      - Encryption cannot be added; you must recreate the data manually
      - Snapshot the volume, copy the snapshot with encryption enabled, then create a new volume from
        the encrypted snapshot
    answer: 3
    explanation: |
      EBS encryption is set at volume creation and cannot be toggled in place on
      an existing unencrypted volume. The supported path is snapshot → copy the
      snapshot with a KMS key (encrypted copy) → create a new volume from that
      encrypted snapshot. There is no in-place toggle or detach/reattach trick.
    ref: "concepts.md#ebs-snapshots-backup-and-encryption"
  - id: aws-storage-ebs-efs-fsx-040
    difficulty: advanced
    tags:
      - fsr
      - restore
      - latency
      - rto
    question: |
      After restoring a large EBS volume from a snapshot, initial reads are
      slow. What causes this, and what feature removes the penalty?
    options:
      - The volume is fragmented; run defrag; use gp2
      - Blocks are lazily loaded from S3 on first access; Fast Snapshot Restore pre-warms the volume (for
        a fee)
      - Snapshots always corrupt on restore; enable versioning
      - The volume needs a reboot to reach full speed
    answer: 1
    explanation: |
      A restored volume lazily hydrates blocks from S3 on first access, so cold
      reads are slow until warmed. Fast Snapshot Restore (FSR) pre-initializes
      the volume to remove that first-access latency, at a per-snapshot,
      per-AZ cost — enable only where fast RTO matters.
    ref: "concepts.md#ebs-snapshots-backup-and-encryption"
  - id: aws-storage-ebs-efs-fsx-041
    difficulty: advanced
    tags:
      - failure-modes
      - az
      - design
    question: |
      Which architecture does NOT tolerate a single-AZ failure without data
      unavailability?
    options:
      - A self-managed database on a single gp3 EBS volume in one AZ with no replica
      - EFS Regional mounted by instances in three AZs
      - S3-backed application reading objects
      - FSx for Windows deployed Multi-AZ
    answer: 0
    explanation: |
      A single gp3 volume lives in one AZ; if that AZ fails, the DB is
      unavailable until the AZ recovers or a snapshot is restored elsewhere —
      there is no cross-AZ copy. EFS Regional, S3, and FSx Multi-AZ all span
      multiple AZs and ride through a single-AZ failure.
    ref: "concepts.md#failure-modes-and-how-designs-degrade"
  - id: aws-storage-ebs-efs-fsx-042
    difficulty: advanced
    tags:
      - efs
      - iops
      - small-files
      - metadata
    question: |
      A workload does huge numbers of small-file metadata operations on EFS and
      hits a throughput/IOPS wall sooner than raw byte volume would suggest.
      Why?
    options:
      - EFS charges double for metadata operations
      - EFS blocks files smaller than 4 KB
      - Every NFS request is metered as at least 4 KB of throughput, so metadata-heavy small-I/O storms
        consume the IOPS/throughput budget quickly
      - Metadata operations bypass the throughput accounting entirely
    answer: 2
    explanation: |
      EFS meters each NFS request as at least 4 KB of throughput (or its actual
      size, whichever is larger). Metadata-intensive small-file workloads
      therefore burn the throughput/IOPS budget faster than the byte count
      implies, and can hit General Purpose IOPS limits (watch PercentIOLimit).
      It does not double-charge metadata or block small files.
    ref: "concepts.md#efs-throughput-modes-and-performance-modes"
  - id: aws-storage-ebs-efs-fsx-043
    difficulty: advanced
    tags:
      - ontap
      - flexclone
      - dev-test
    question: |
      A team needs to spin up dozens of full-size test copies of a 5 TB dataset
      instantly without paying 5 TB per copy. Which capability best serves this?
    options:
      - EBS snapshots restored to new volumes
      - S3 Cross-Region Replication
      - EFS lifecycle transition to IA
      - FSx for NetApp ONTAP FlexClone (instant zero-copy clones)
    answer: 3
    explanation: |
      FlexClone (ONTAP) creates instant, space-efficient zero-copy clones that
      only consume space for changed blocks — ideal for many test copies of a
      large dataset. EBS snapshot-restore materializes a full volume (and
      hydrates lazily). CRR is object replication; EFS IA is a cost tier, not a
      cloning feature. (FSx for OpenZFS also offers instant clones.)
    ref: "concepts.md#amazon-fsx-for-netapp-ontap"
  - id: aws-storage-ebs-efs-fsx-044
    difficulty: advanced
    tags:
      - primitive-selection
      - judgment
    question: |
      What is the guiding principle when selecting a storage primitive for a new
      workload?
    options:
      - Always default to S3 because it is cheapest
      - Pick the lowest-level primitive that still satisfies the access pattern, then scope durability
        and tier cost
      - Always use a file service so any client can mount it
      - Choose whichever service the team used last time
    answer: 1
    explanation: |
      The discipline is to pick the lowest-level primitive that satisfies the
      access pattern (block for single-owner low-latency, file for shared POSIX/
      SMB, object for durable blobs), then scope durability to the needed blast
      radius and tier storage classes for cost. Defaulting to one primitive
      ignores latency/mount/edit constraints.
    ref: "concepts.md#block-file-and-object-storage-picking-the-right-primitive"
  - id: aws-storage-ebs-efs-fsx-045
    difficulty: advanced
    tags:
      - io2
      - durability
      - backup
      - ransomware
    question: |
      io2 Block Express offers 99.999% durability. Does that eliminate the need
      for backups?
    options:
      - No; durability protects against device failure, not accidental deletion, corruption, ransomware,
        or Region loss — you still need snapshots/AWS Backup/cross-Region copies
      - Yes; 99.999% durability means data can't be lost, so backups are redundant
      - Yes, as long as the volume is encrypted
      - No, but only because io2 is single-AZ; io2 Block Express is multi-AZ and needs no backup
    answer: 0
    explanation: |
      High durability addresses hardware failure probability, not logical
      threats: an operator delete, filesystem corruption, ransomware, or a
      Region-wide event still destroy or block your data. Backups (snapshots,
      AWS Backup, cross-Region copies) address those. io2 Block Express is still
      single-AZ, and encryption doesn't provide backup either.
    ref: "concepts.md#durability-and-availability-across-storage-services"
  - id: aws-storage-ebs-efs-fsx-046
    difficulty: advanced
    tags:
      - scenario
      - kafka
      - st1
      - cost
    question: |
      A Kafka cluster stores large sequential log segments and is throughput-
      bound, not IOPS-bound; the team wants to minimize storage cost. Which EBS
      choice is most appropriate?
    options:
      - io2 Block Express for maximum IOPS
      - sc1, because it is the cheapest for any workload
      - st1 (Throughput Optimized HDD), which is cheap per GB and fast for large sequential I/O
      - gp2 small volumes relying on burst credits
    answer: 2
    explanation: |
      Kafka's sequential, throughput-oriented access matches st1 (HDD),
      cheap per GB and strong on large sequential I/O (up to 500 MiB/s). io2 is
      overkill (and costly) for a non-random workload. sc1 is for cold/rarely
      accessed data (lower throughput). Small gp2 volumes would hit burst-credit
      cliffs under sustained load.
    ref: "concepts.md#ebs-volume-types-gp3-io2-block-express-st1-sc1"
  - id: aws-storage-ebs-efs-fsx-047
    difficulty: advanced
    tags:
      - efs
      - elastic
      - ceilings
      - throughput
    question: |
      Which statement about EFS Elastic throughput ceilings (Regional, General
      Purpose) is most accurate?
    options:
      - It is hard-capped at 500 MiBps regardless of Region
      - It provides unlimited throughput with no Region-based limits
      - It is slower than Bursting for spiky workloads
      - It can reach roughly 20–60 GiBps read / 1–5 GiBps write aggregate, with default read IOPS in the
        hundreds of thousands, Region-dependent
    answer: 3
    explanation: |
      Regional Elastic throughput scales to roughly 20–60 GiBps read and 1–5
      GiBps write aggregate (Region-dependent), with default limits like 250,000
      read IOPS for frequently accessed data and 50,000 write IOPS (increasable).
      It is designed for spiky workloads and is generally the best choice for
      them, not slower than Bursting.
    ref: "concepts.md#efs-throughput-modes-and-performance-modes"
  - id: aws-storage-ebs-efs-fsx-048
    difficulty: advanced
    tags:
      - migration
      - storage-gateway
      - volume-gateway
    question: |
      Which Storage Gateway type presents iSCSI block volumes to on-prem apps
      and backs them with EBS snapshots in AWS?
    options:
      - File Gateway
      - Volume Gateway
      - Tape Gateway
      - DataSync Gateway
    answer: 1
    explanation: |
      Volume Gateway exposes iSCSI block volumes (cached or stored modes) to
      on-prem apps and stores point-in-time backups as EBS snapshots. File
      Gateway presents NFS/SMB backed by S3; Tape Gateway is a virtual tape
      library to S3/Glacier; "DataSync Gateway" is not a Storage Gateway type.
    ref: "concepts.md#data-migration-datasync-storage-gateway-and-snow"
  - id: aws-storage-ebs-efs-fsx-049
    difficulty: advanced
    tags:
      - ebs
      - snapshot
      - dr
      - cross-region
    question: |
      What primarily determines the RPO of a DR strategy built on cross-Region
      EBS snapshot copies?
    options:
      - The frequency at which snapshots are taken and copied to the DR Region
      - The io2 durability figure
      - The size of the boot volume
      - Whether the volume is encrypted
    answer: 0
    explanation: |
      RPO (max acceptable data loss) equals the gap between recoverable points —
      i.e. how often you snapshot and copy cross-Region. More frequent snapshots
      = smaller RPO (and more cost). Durability, volume size, and encryption do
      not set the recovery-point granularity.
    ref: "concepts.md#failure-modes-and-how-designs-degrade"
  - id: aws-storage-ebs-efs-fsx-050
    difficulty: advanced
    tags:
      - comparison
      - efs-vs-fsx
      - selection
    question: |
      Given identical shared-file needs, which single factor most cleanly
      decides EFS vs FSx for Windows vs FSx for Lustre?
    options:
      - Which one is cheapest per GB regardless of workload
      - Whichever supports the largest single file
      - 'The required protocol/OS and performance class: Linux/NFS elastic → EFS; Windows/SMB/AD → FSx
        for Windows; HPC/ML extreme throughput → FSx for Lustre'
      - Only the durability figure
    answer: 2
    explanation: |
      The clean discriminator is protocol/OS + performance class: EFS for
      elastic Linux/NFS shared files, FSx for Windows for SMB+AD+NTFS, FSx for
      Lustre for HPC/ML throughput. Per-GB price, max file size, and durability
      are secondary once the protocol/performance fit is fixed.
    ref: "concepts.md#trade-offs-and-when-to-use-what"
  - id: aws-storage-ebs-efs-fsx-051
    difficulty: advanced
    tags:
      - efs
      - ia
      - retrieval
      - gotcha
    question: |
      When is moving data to EFS IA/Archive via lifecycle a BAD idea despite the
      lower per-GB storage price?
    options:
      - When the data is never accessed again
      - When the file system is Regional
      - When Elastic throughput is enabled
      - When 'cold' files are actually re-read in bursts, so repeated retrieval fees and higher latency
        outweigh the storage savings
    answer: 3
    explanation: |
      IA/Archive add per-access retrieval charges and tens-of-ms latency. If
      files marked cold are periodically re-read in bursts, you pay retrieval
      repeatedly and suffer latency — potentially costing more than keeping them
      on Standard. Tiering pays off only for genuinely rarely accessed data.
    ref: "concepts.md#efs-storage-classes-lifecycle-and-cost"
  - id: aws-storage-ebs-efs-fsx-052
    difficulty: advanced
    tags:
      - multi-attach
      - fencing
      - nvme
    question: |
      Which feature lets io2 Block Express provide proper I/O fencing for
      clustered applications sharing a Multi-Attach volume?
    options:
      - Fast Snapshot Restore
      - NVMe reservations
      - EFS Access Points
      - S3 Object Lock
    answer: 1
    explanation: |
      io2 Block Express supports NVMe reservations, which clustered software
      uses to fence I/O so only the intended node writes — critical to avoid
      corruption on a shared Multi-Attach volume. FSR is a restore accelerator,
      EFS Access Points are POSIX entry points, and Object Lock is an S3 WORM
      feature.
    ref: "concepts.md#ebs-multi-attach-and-clustered-workloads"
  - id: aws-storage-ebs-efs-fsx-053
    difficulty: advanced
    tags:
      - ebs
      - hdd-burst
      - st1
      - sc1
    question: |
      Which statement about st1/sc1 HDD burst behavior is correct?
    options:
      - 'Throughput scales with provisioned size: st1 baseline ~40 MiB/s per TiB bursting to 250 MiB/s
        per TiB; sc1 lower'
      - HDD volumes have a fixed throughput independent of size
      - HDD volumes use the same 3 IOPS/GiB model as gp2
      - sc1 bursts higher than st1 because it is colder
    answer: 0
    explanation: |
      HDD throughput scales with size and uses a credit-based burst: st1 ~40
      MiB/s per TiB baseline, bursting to 250 MiB/s per TiB; sc1 is lower (~12
      baseline, ~80 burst per TiB). gp2's 3 IOPS/GiB is an SSD IOPS model, not
      HDD throughput, and st1 (hotter) bursts higher than sc1.
    ref: "concepts.md#ebs-iops-and-throughput-provisioning-and-burst-behavior"
  - id: aws-storage-ebs-efs-fsx-054
    difficulty: advanced
    tags:
      - scenario
      - sharepoint
      - ontap
      - tiering
    question: |
      An enterprise migrating a large on-prem NetApp NAS wants to cut cloud
      storage cost via dedup/compression and automatically tier cold data to a
      cheaper capacity pool, while keeping SnapMirror replication. Best fit?
    options:
      - EFS with lifecycle to Archive
      - FSx for Windows File Server Single-AZ
      - FSx for NetApp ONTAP (dedup/compression + capacity-pool tiering + SnapMirror)
      - S3 Intelligent-Tiering
    answer: 2
    explanation: |
      ONTAP is uniquely the option that preserves NetApp features — inline dedup/
      compression, automatic tiering of cold data to a lower-cost capacity pool,
      and SnapMirror for replication/migration. EFS/S3 lack SnapMirror and
      NetApp semantics; FSx for Windows is SMB/NTFS without these NetApp
      economics.
    ref: "concepts.md#amazon-fsx-for-netapp-ontap"
  - id: aws-storage-ebs-efs-fsx-055
    difficulty: expert
    tags:
      - ebs
      - io2
      - ratio
      - provisioning-limit
    question: |
      You provision a 100 GiB io2 Block Express volume and try to set 150,000
      IOPS. What primarily constrains whether this is allowed?
    options:
      - Nothing; any IOPS value is allowed on any size
      - gp3's 3 IOPS/GiB rule
      - The instance store size
      - The per-GiB IOPS ratio cap (io2 Block Express allows up to 1,000 IOPS/GiB), so 100 GiB caps at
        ~100,000 IOPS
    answer: 3
    explanation: |
      io2 Block Express enforces a maximum IOPS-to-size ratio (up to 1,000
      IOPS/GiB); a 100 GiB volume therefore tops out around 100,000 IOPS, so
      150,000 requires a larger volume. gp3's 3 IOPS/GiB is a different model,
      and instance store is unrelated to EBS provisioning.
    ref: "concepts.md#ebs-iops-and-throughput-provisioning-and-burst-behavior"
  - id: aws-storage-ebs-efs-fsx-056
    difficulty: expert
    tags:
      - efs
      - per-client
      - single-thread
      - ceiling
    question: |
      A single-threaded legacy Linux app on EFS can't exceed a few hundred
      MiBps despite the file system's multi-GiBps aggregate ceiling. What is the
      key reason and mitigation?
    options:
      - EFS caps every file system at 500 MiBps; nothing can be done
      - Per-client throughput limits (e.g. ~1,500 MiBps with the v2 client, less on older clients) and
        single-threaded/single-connection I/O bound it; parallelize across threads/clients or upgrade
        the EFS client
      - The app must switch to Provisioned throughput to go faster on one thread
      - Only Max I/O mode raises per-client throughput
    answer: 1
    explanation: |
      EFS aggregate throughput assumes many parallel clients/threads; a single
      thread over a single connection hits per-client limits (up to ~1,500 MiBps
      with the newer EFS client, lower on old clients) and can't tap the full
      aggregate. Fixes: parallelize I/O across threads/mount targets/clients and
      use the current EFS client. Throughput mode doesn't lift the per-client
      concurrency limit.
    ref: "concepts.md#latency-throughput-and-iops-ballparks"
  - id: aws-storage-ebs-efs-fsx-057
    difficulty: expert
    tags:
      - instance-store
      - io2
      - tradeoff
      - evolution
    question: |
      Historically some databases demanded instance store for latency/IOPS. Why
      can many now run on io2 Block Express instead, and what do they regain?
    options:
      - io2 Block Express delivers sub-500 µs latency and up to 256,000 IOPS, closing much of the gap
        while keeping persistence, snapshots, and 99.999% durability
      - io2 is cheaper than instance store, so there is no trade-off
      - Instance store now persists across termination, making the choice moot
      - io2 volumes are multi-AZ, unlike instance store
    answer: 0
    explanation: |
      io2 Block Express narrowed the performance gap (sub-500 µs, up to 256k
      IOPS) so many workloads that once needed the raw speed of instance store
      can use io2 and keep persistence, snapshots, and 99.999% durability. io2
      is not cheaper than ephemeral local NVMe, instance store is still
      ephemeral, and io2 remains single-AZ.
    ref: "concepts.md#instance-store-versus-ebs-for-databases"
  - id: aws-storage-ebs-efs-fsx-058
    difficulty: expert
    tags:
      - lustre
      - throughput-tiers
      - provisioning
    question: |
      For FSx for Lustre persistent SSD file systems, how is baseline throughput
      capacity primarily provisioned?
    options:
      - A single fixed rate for all file systems
      - By burst credits identical to EFS Bursting
      - As a selected per-unit-storage throughput tier (e.g. MB/s per TiB), so total throughput scales
        with provisioned storage and the chosen tier
      - Only by the number of attached EC2 instances
    answer: 2
    explanation: |
      FSx for Lustre persistent file systems provision baseline throughput as a
      per-TiB tier (e.g. selectable MB/s per TiB), so aggregate throughput
      scales with both the storage size and the chosen tier — letting you tune
      the price/performance for HPC. It isn't a single fixed rate, EFS-style
      burst credits, or a function of instance count.
    ref: "concepts.md#amazon-fsx-for-lustre-and-hpc"
  - id: aws-storage-ebs-efs-fsx-059
    difficulty: expert
    tags:
      - efs
      - provisioned
      - restriction
      - gotcha
    question: |
      After switching an EFS file system to Provisioned throughput (or raising
      the provisioned amount), which action is restricted for 24 hours?
    options:
      - Mounting the file system from new clients
      - Reading data from the file system
      - Creating access points
      - Decreasing the provisioned amount or switching to Elastic/Bursting
    answer: 3
    explanation: |
      EFS imposes a 24-hour cooldown after switching to Provisioned throughput or
      increasing the provisioned amount: you cannot decrease the amount or switch
      to Elastic/Bursting during that window. Mounting, reading, and creating
      access points are unaffected. This matters when tuning throughput reactively.
    ref: "concepts.md#efs-throughput-modes-and-performance-modes"
  - id: aws-storage-ebs-efs-fsx-060
    difficulty: expert
    tags:
      - durability
      - afr
      - comparison
    question: |
      Which durability comparison is correct?
    options:
      - gp3 and io2 have identical durability
      - io2/io2 Block Express target 99.999% (0.001% AFR), roughly two orders of magnitude better than
        gp3/gp2/st1/sc1 at 99.8–99.9% (0.1–0.2% AFR)
      - st1 is more durable than io2 because HDDs are simpler
      - gp3 offers 11 nines like S3
    answer: 1
    explanation: |
      io2 and io2 Block Express are designed for 99.999% durability (0.001%
      annual failure rate), about 100× better AFR than gp3/gp2/st1/sc1, which
      sit at 99.8–99.9% (0.1–0.2% AFR). st1 is not more durable than io2, and no
      EBS type reaches S3's 11 nines.
    ref: "concepts.md#durability-and-availability-across-storage-services"
  - id: aws-storage-ebs-efs-fsx-061
    difficulty: expert
    tags:
      - scenario
      - oracle-rac
      - multi-attach
      - tradeoff
    question: |
      A legacy clustered application expects SAN-style shared LUNs with two
      nodes writing concurrently in one AZ. What is the PRIMARY trade-off of
      using io2 Multi-Attach instead of migrating to a managed file service?
    options:
      - You gain raw shared block for the clustered app but accept single-AZ blast radius, a 16-node cap,
        and full responsibility for write coordination/fencing
      - Multi-Attach is cheaper and simpler with no downsides
      - Multi-Attach automatically gives cross-AZ HA
      - Multi-Attach provides a POSIX filesystem so no clustering software is needed
    answer: 0
    explanation: |
      Multi-Attach satisfies the app's shared-LUN expectation, but the cost is
      single-AZ only, max 16 instances, and you must run cluster-aware
      software/fencing (NVMe reservations) to avoid corruption — EBS does not
      coordinate writes or provide a filesystem, and it gives no cross-AZ HA.
      That's why a managed file service is usually preferred when feasible.
    ref: "concepts.md#ebs-multi-attach-and-clustered-workloads"
  - id: aws-storage-ebs-efs-fsx-062
    difficulty: expert
    tags:
      - efs
      - burst-credits
      - math
      - estimation
    question: |
      An EFS file system on Bursting has 100 GiB in Standard, giving a baseline
      of ~5 MiBps. Over 24 hours of inactivity it accrues ~432,000 MiB of
      credit. Roughly how long can it then sustain 100 MiBps?
    options:
      - About 12 hours
      - About 5 minutes
      - About 72 minutes
      - About 24 hours
    answer: 2
    explanation: |
      432,000 MiB ÷ 100 MiBps = 4,320 s ≈ 72 minutes. This illustrates why a
      small Bursting file system with a sustained heavy workload throttles: it
      can burst only briefly before credits drain to the low baseline. Elastic
      or Provisioned throughput avoids the credit math entirely.
    ref: "concepts.md#efs-throughput-modes-and-performance-modes"
  - id: aws-storage-ebs-efs-fsx-063
    difficulty: expert
    tags:
      - scenario
      - sagemaker
      - lustre-vs-efs
      - cost
    question: |
      Repeated ML training jobs must read a 50 TB dataset (durable copy in S3)
      at hundreds of GB/s with sub-ms latency, iterating many times. Which is
      the most cost-effective high-performance design?
    options:
      - Mount the S3 bucket via EFS and raise Provisioned throughput to hundreds of GB/s
      - Copy the 50 TB onto a single io2 Block Express volume attached to one training instance
      - Use S3 Standard directly with 3,500 GETs/s per prefix and no caching
      - FSx for Lustre linked to the S3 bucket as the fast scratch/persistent layer, keeping the durable
        copy in S3
    answer: 3
    explanation: |
      FSx for Lustre is purpose-built for HPC/ML throughput (100s of GB/s,
      sub-ms) and links natively to S3, avoiding repeated full downloads across
      iterative jobs while S3 stays the cheap durable source of truth. EFS can't
      reach hundreds of GB/s at that cost/latency, a single io2 volume caps at 4
      GiB/s and one instance, and raw S3 GETs are latency-bound for tight
      training loops.
    ref: "concepts.md#amazon-fsx-for-lustre-and-hpc"
  - id: aws-storage-ebs-efs-fsx-064
    difficulty: expert
    tags:
      - primitive
      - s3
      - why-not
      - semantics
    question: |
      Why can't you simply run a relational database or a POSIX file-locking app
      directly on S3, despite its 11-nines durability and low cost?
    options:
      - S3 has a 5 GB total capacity limit
      - 'S3 is object storage: no block-device mount, no in-place edits (whole-object replace), and tens-of-ms
        latency — wrong semantics for random block I/O and POSIX locking'
      - S3 is single-AZ and not durable enough
      - S3 does not support encryption
    answer: 1
    explanation: |
      S3 is an object store addressed by key over HTTP — you replace whole
      objects rather than editing bytes in place, there is no filesystem mount
      or POSIX locking, and first-byte latency is tens of ms. Databases need
      low-latency random block I/O; POSIX apps need locking/mount semantics.
      S3 is effectively unlimited, multi-AZ, 11-nines durable, and encryptable —
      it's the semantics, not capacity/durability, that disqualify it.
    ref: "concepts.md#block-file-and-object-storage-picking-the-right-primitive"
  - id: aws-storage-ebs-efs-fsx-065
    difficulty: expert
    tags:
      - migration
      - tradeoff
      - datasync-vs-gateway-vs-snow
    question: |
      What is the correct primary discriminator among DataSync, Storage Gateway,
      and Snow Family for a migration?
    options:
      - Whether you need a one-time/scheduled ONLINE bulk sync (DataSync), ONGOING hybrid local access
        (Storage Gateway), or OFFLINE transfer because bandwidth-vs-deadline math fails (Snow)
      - Cost alone — always pick the cheapest listed price
      - Which service supports the largest single file
      - Whether the source is Linux or Windows
    answer: 0
    explanation: |
      The clean discriminator is the transfer/access model: DataSync for online
      bulk/scheduled sync bounded by link bandwidth; Storage Gateway for
      continued on-prem local access with a cache during/after migration; Snow
      when data-size ÷ bandwidth exceeds the deadline (offline is faster). Price,
      max file size, and source OS are secondary.
    ref: "concepts.md#data-migration-datasync-storage-gateway-and-snow"
  - id: aws-storage-ebs-efs-fsx-066
    difficulty: expert
    tags:
      - ebs
      - direct-apis
      - recycle-bin
      - protection
    question: |
      Which pair of EBS features respectively (a) let backup tools read snapshot
      blocks WITHOUT restoring a volume, and (b) protect snapshots/volumes from
      accidental deletion?
    options:
      - Fast Snapshot Restore and Multi-Attach
      - KMS encryption and Access Points
      - EBS direct APIs and Recycle Bin
      - Volume Gateway and SnapMirror
    answer: 2
    explanation: |
      EBS direct APIs (e.g. ListSnapshotBlocks/GetSnapshotBlock) let tools read
      snapshot data without a full restore, enabling efficient incremental
      backup. Recycle Bin retains deleted snapshots/AMIs for a retention period
      to recover from accidental deletion. FSR accelerates restores,
      Multi-Attach shares volumes, and the others are unrelated services/features.
    ref: "concepts.md#ebs-snapshots-backup-and-encryption"
  - id: aws-storage-ebs-efs-fsx-067
    difficulty: intermediate
    tags:
      - efs
      - access-points
      - mount-targets
    question: |
      What do EFS mount targets and access points provide, respectively?
    options:
      - Mount targets encrypt data; access points compress it
      - Both are billing constructs with no functional role
      - Mount targets are cross-Region replicas; access points are snapshots
      - Mount targets are the per-AZ network endpoints (ENIs) to reach the file system; access points
        enforce an application-specific POSIX user and root directory
    answer: 3
    explanation: |
      A mount target is an ENI in a subnet/AZ that clients use to mount the file
      system (one per AZ). An access point enforces a POSIX identity (uid/gid)
      and a root directory, isolating applications sharing one file system. They
      are not encryption/compression, billing-only, replicas, or snapshots.
    ref: "concepts.md#amazon-efs-elastic-multi-az-nfs-file-storage"
  - id: aws-storage-ebs-efs-fsx-068
    difficulty: intermediate
    tags:
      - s3
      - consistency
    question: |
      What is the current S3 read-after-write consistency model for object
      operations?
    options:
      - Eventually consistent for all operations
      - Strong read-after-write consistency for PUTs and deletes of objects (since December 2020)
      - Strong consistency only within a single AZ
      - Consistency must be enabled per bucket
    answer: 1
    explanation: |
      Since December 2020, S3 provides strong read-after-write consistency
      automatically for all object PUTs and deletes across all Regions, at no
      extra cost and with no configuration. The old eventual-consistency caveats
      for overwrite/delete no longer apply — a useful fact when comparing S3 to
      file/block stores for correctness-sensitive designs.
    ref: "concepts.md#block-file-and-object-storage-picking-the-right-primitive"
  - id: aws-storage-ebs-efs-fsx-069
    difficulty: advanced
    tags:
      - backup
      - aws-backup
      - ops-burden
    question: |
      Rather than hand-rolling Lambda + EventBridge to schedule EBS/EFS/FSx
      backups with cross-Region and cross-account copies, which service
      centralizes this with policies?
    options:
      - AWS Backup
      - AWS Config
      - AWS Systems Manager
      - Amazon CloudWatch
    answer: 0
    explanation: |
      AWS Backup centrally automates policy-based backups (with lifecycle,
      cross-Region and cross-account copy) across EBS, EFS, FSx, RDS, DynamoDB,
      and more — lower ops burden than custom Lambda/EventBridge. Config tracks
      resource compliance, Systems Manager manages instances/automation, and
      CloudWatch is monitoring — none is the managed backup service.
    ref: "concepts.md#ebs-snapshots-backup-and-encryption"
  - id: aws-storage-ebs-efs-fsx-070
    difficulty: advanced
    tags:
      - scenario
      - wordpress
      - efs
      - tradeoff
    question: |
      A horizontally scaled WordPress fleet across multiple AZs needs shared
      wp-content media writable by all app servers. Which design is best and why?
    options:
      - Store media on each server's local gp3 volume and hope for consistency
      - EBS Multi-Attach across all servers in every AZ
      - EFS Regional mounted by all app servers, so media is shared and consistent across AZs (accept
        ~1 ms file latency)
      - FSx for Lustre scratch for the media
    answer: 2
    explanation: |
      EFS Regional gives all app servers a consistent shared POSIX mount across
      AZs — the standard pattern for shared CMS media — accepting network-file
      latency (~1 ms). Local volumes diverge per server. Multi-Attach is
      single-AZ and caps at 16 (and isn't a filesystem). Lustre scratch is
      ephemeral HPC storage, wrong for durable web media.
    ref: "concepts.md#amazon-efs-elastic-multi-az-nfs-file-storage"
  - id: aws-storage-ebs-efs-fsx-071
    difficulty: beginner
    tags:
      - efs
      - regional
      - one-zone
    question: |
      An EFS Regional file system stores data where, for high availability?
    options:
      - In a single AZ only
      - Across multiple Regions automatically
      - On the client's local disk
      - Redundantly across multiple Availability Zones in the Region
    answer: 3
    explanation: |
      EFS Regional file systems store data redundantly across multiple AZs, so
      they survive an AZ failure. One Zone keeps data in a single AZ (cheaper,
      less resilient). EFS is not cross-Region by default (use replication), and
      data is not stored on client disks.
    ref: "concepts.md#amazon-efs-elastic-multi-az-nfs-file-storage"
  - id: aws-storage-ebs-efs-fsx-072
    difficulty: expert
    tags:
      - io2-block-express
      - latency
      - spec
    question: |
      What average latency is io2 Block Express designed to deliver for 16 KiB
      I/O operations?
    options:
      - About 1 millisecond
      - Under 500 microseconds
      - About 2.7 milliseconds
      - Tens of milliseconds
    answer: 1
    explanation: |
      io2 Block Express is designed for average latency under 500 microseconds
      for 16 KiB I/O — sub-millisecond block performance for demanding databases.
      ~1 ms / ~2.7 ms are EFS Standard read/write ballparks; tens of ms is S3
      first-byte territory.
    ref: "concepts.md#latency-throughput-and-iops-ballparks"
  - id: aws-storage-ebs-efs-fsx-073
    difficulty: advanced
    tags:
      - scenario
      - boot-volume
      - gp3
      - cost
    question: |
      For a fleet of stateless web servers whose boot volumes need modest,
      predictable I/O at the lowest steady cost, which choice is best?
    options:
      - gp3 boot volumes at the free baseline (3,000 IOPS / 125 MiB/s), avoiding gp2 burst-credit surprises
      - io2 Block Express boot volumes for durability
      - st1 HDD boot volumes to save money
      - Instance store so boot is fastest
    answer: 0
    explanation: |
      gp3 gives a flat 3,000 IOPS / 125 MiB/s baseline free, is cheaper than gp2,
      and avoids gp2's burst-credit cliff — ideal for modest, predictable boot
      I/O at low cost. io2 is overkill/costly for a boot volume; st1/sc1 HDD
      can't be boot volumes; instance store is ephemeral and can't reliably back
      a boot volume across stop/start.
    ref: "concepts.md#ebs-volume-types-gp3-io2-block-express-st1-sc1"
  - id: aws-storage-ebs-efs-fsx-074
    difficulty: intermediate
    tags:
      - fsx
      - lustre
      - scratch
      - durability
      - tradeoff
    question: |
      What is the defining trade-off of an FSx for Lustre SCRATCH file system
      versus a PERSISTENT one?
    options:
      - Scratch is more durable but slower
      - Scratch supports S3 linkage but persistent does not
      - Scratch is non-replicated (data lost on server failure) and cheapest-per-performance; persistent
        replicates within an AZ and auto-replaces failed servers
      - Persistent is single-threaded while scratch is parallel
    answer: 2
    explanation: |
      Scratch trades durability for cost/performance: no replication, data lost
      if a server fails — fine for transient jobs with S3 as source of truth.
      Persistent replicates within an AZ and auto-replaces failed servers for
      longer-lived, throughput-focused workloads. Both link to S3 and are
      parallel filesystems.
    ref: "concepts.md#amazon-fsx-for-lustre-and-hpc"
  - id: aws-storage-ebs-efs-fsx-075
    difficulty: expert
    tags:
      - scenario
      - throttling
      - diagnosis
      - judgment
    question: |
      Across a design review, which observation most strongly indicates a
      storage-side performance cliff rather than an application bug?
    options:
      - Latency is uniformly high from the first request onward
      - CPU utilization on the app tier is at 100%
      - Requests fail with HTTP 400 validation errors
      - Performance is fine initially, then degrades sharply after minutes/hours of sustained load (burst
        credits on gp2 or EFS Bursting draining to baseline)
    answer: 3
    explanation: |
      The signature of a burst-credit cliff (gp2 I/O credits or EFS Bursting
      credits) is good performance that suddenly drops to a low baseline after
      sustained load drains credits. Uniformly high latency, pegged app CPU, and
      400 errors point elsewhere (design, compute, or client bugs). Recognizing
      this pattern and moving to gp3/io2 or EFS Elastic is the fix.
    ref: "concepts.md#failure-modes-and-how-designs-degrade"
