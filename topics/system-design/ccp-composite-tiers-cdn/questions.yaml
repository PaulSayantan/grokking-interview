topic: "Composite Cloud Applications: Tiers & CDN"
domain: system-design
topic_slug: ccp-composite-tiers-cdn
version: 1
questions:
  - id: ccp-composite-tiers-cdn-001
    difficulty: beginner
    tags:
    - two-tier
    - intent
    - pattern-selection
    question: |
      Which composite pattern separates a single stateless tier holding both presentation and
      business logic from a separate data-handling tier so the two scale independently?
    options:
    - Content Distribution Network
    - Three-Tier Cloud Application
    - Hybrid Data
    - Two-Tier Cloud Application
    answer: 3
    explanation: |
      The Two-Tier Cloud Application bundles presentation + business logic into one stateless
      application tier over a separate data tier, so the easy-to-scale logic scales apart from the
      hard-to-scale data.
    ref: concepts.md#two-tier-cloud-application

  - id: ccp-composite-tiers-cdn-002
    difficulty: beginner
    tags:
    - three-tier
    - intent
    - pattern-selection
    question: |
      An architect wants presentation logic, business logic, and data handling each in its own
      independently scalable tier. Which pattern is that?
    options:
    - Two-Tier Cloud Application
    - Content Distribution Network
    - Three-Tier Cloud Application
    - Stateless Component
    answer: 2
    explanation: |
      The Three-Tier Cloud Application decomposes into presentation, business-logic, and data
      tiers, each scaled independently to match its own workload.
    ref: concepts.md#three-tier-cloud-application

  - id: ccp-composite-tiers-cdn-003
    difficulty: beginner
    tags:
    - cdn
    - intent
    - pattern-selection
    question: |
      Which pattern ensures timely access for a globally distributed user group by placing
      content replicas near users?
    options:
    - Content Distribution Network
    - Three-Tier Cloud Application
    - Eventual Consistency
    - Elastic Load Balancer
    answer: 0
    explanation: |
      The Content Distribution Network establishes replicas of content in many physical locations
      and routes each user to a nearby copy, minimizing latency for a global audience.
    ref: concepts.md#content-distribution-network

  - id: ccp-composite-tiers-cdn-004
    difficulty: beginner
    tags:
    - two-tier
    - intent
    question: |
      What is the guiding "How can…?" question behind the Two-Tier Cloud Application?
    options:
    - How can application functionality be separated from data handling so the two scale independently?
    - How can content be delivered quickly to a global audience?
    - How can three tiers each be scaled on their own?
    - How can session state be shared across instances?
    answer: 0
    explanation: |
      The pattern's intent is separating application functionality from data handling so the
      stateless logic and the harder-to-scale data tier scale independently.
    ref: concepts.md#two-tier-cloud-application

  - id: ccp-composite-tiers-cdn-005
    difficulty: intermediate
    tags:
    - two-tier
    - state
    - stateless-component
    question: |
      In a Two-Tier Cloud Application, where does application/session state live?
    options:
    - In the stateless application tier, replicated across instances
    - In the load balancer's memory
    - It is discarded on every request
    - In the data tier (and/or a shared cache), so the application tier stays stateless
    answer: 3
    explanation: |
      The application tier must be a Stateless Component so instances are interchangeable and
      elastic. All state is externalized to the data tier (or a shared cache).
    ref: concepts.md#two-tier-cloud-application

  - id: ccp-composite-tiers-cdn-006
    difficulty: intermediate
    tags:
    - scaling
    - data-tier
    - distinction
    question: |
      Both tier patterns deliberately isolate the data tier. Why?
    options:
    - The data tier is the cheapest to run
    - Data must always be on-premises
    - The provider forbids co-locating data with logic
    - Data handling is stateful and must stay consistent, so it is the hard-to-scale tier
    answer: 3
    explanation: |
      Stateful data must be coordinated/kept consistent across instances, so it does not clone
      like stateless logic. Isolating it lets the stateless tiers scale freely around it.
    ref: concepts.md#three-tier-cloud-application

  - id: ccp-composite-tiers-cdn-007
    difficulty: intermediate
    tags:
    - three-tier
    - workload
    - pattern-selection
    question: |
      A team finds their compute-heavy processing is accessed far less often than their UI, and
      one coarse tier forces them to over-provision. Which pattern directly addresses this?
    options:
    - Two-Tier Cloud Application
    - Three-Tier Cloud Application
    - Content Distribution Network
    - Strict Consistency
    answer: 1
    explanation: |
      When components have divergent workloads, coarse tiers cannot align instance counts to
      demand. Three-Tier splits presentation and business logic so each scales to its own load.
    ref: concepts.md#three-tier-cloud-application

  - id: ccp-composite-tiers-cdn-008
    difficulty: intermediate
    tags:
    - three-tier
    - component-patterns
    - mapping
    question: |
      In the Three-Tier Cloud Application, the business-logic tier is typically built from which
      component patterns?
    options:
    - Stateful Component + User Interface Component
    - Storage Offering + Elastic Load Balancer
    - Stateless Component + Processing Component
    - User Interface Component + Data Access Component
    answer: 2
    explanation: |
      The business-logic tier combines the Stateless Component (so it scales by cloning) with the
      Processing Component (the heavy computation). The UI Component belongs to the presentation tier.
    ref: concepts.md#three-tier-cloud-application

  - id: ccp-composite-tiers-cdn-009
    difficulty: intermediate
    tags:
    - three-tier
    - component-patterns
    - mapping
    question: |
      Which component patterns make up the presentation tier in a Three-Tier Cloud Application?
    options:
    - Stateless Component + User Interface Component
    - Processing Component + Storage Offering
    - Stateful Component + Processing Component
    - Elastic Queue + Data Access Component
    answer: 0
    explanation: |
      The presentation tier is a load balancer plus an application component built from the
      Stateless Component and User Interface Component patterns.
    ref: concepts.md#three-tier-cloud-application

  - id: ccp-composite-tiers-cdn-010
    difficulty: beginner
    tags:
    - cdn
    - intent
    question: |
      What core problem does the Content Distribution Network pattern solve?
    options:
    - Keeping business logic separate from presentation
    - Coordinating state across stateful instances
    - Large content served from one central location is too slow for globally dispersed users
    - Choosing between relational and key-value storage
    answer: 2
    explanation: |
      Serving large multimedia/static content from a single data center is unfeasible for a global
      audience; the CDN replicates content to edge sites near users to cut latency and origin load.
    ref: concepts.md#content-distribution-network

  - id: ccp-composite-tiers-cdn-011
    difficulty: intermediate
    tags:
    - cdn
    - updates
    - consistency
    question: |
      In the Content Distribution Network pattern, how are the many edge replicas kept correct?
    options:
    - Each edge is edited independently by nearby users
    - Replicas never change once created
    - Users vote on the canonical version
    - Replicas are updated from a central (origin) location
    answer: 3
    explanation: |
      Distribution is decentralized but authorship is centralized: replicas are updated from a
      central origin, which is why the CDN must pick a consistency model for propagation.
    ref: concepts.md#content-distribution-network

  - id: ccp-composite-tiers-cdn-012
    difficulty: advanced
    tags:
    - cdn
    - consistency
    - sibling-distinction
    question: |
      A CDN uses TTL expiry so edges may briefly serve slightly stale objects but propagation is
      cheap and fast. Which consistency model is that?
    options:
    - Eventual Consistency
    - Strict Consistency
    - Causal Consistency
    - Linearizability
    answer: 0
    explanation: |
      TTL-based lazy propagation with a bounded staleness window is Eventual Consistency — the
      common CDN default. Strict Consistency would invalidate everywhere before serving new content.
    ref: concepts.md#content-distribution-network

  - id: ccp-composite-tiers-cdn-013
    difficulty: advanced
    tags:
    - cdn
    - consistency
    - sibling-distinction
    question: |
      A CDN must guarantee users never receive an outdated object, invalidating all edges before
      the new version is served. Which consistency model does that describe?
    options:
    - Eventual Consistency
    - Strict Consistency
    - Read-your-writes only
    - Best-effort caching
    answer: 1
    explanation: |
      Guaranteeing no stale reads by invalidating everywhere before serving is Strict Consistency,
      at the cost of coordination latency. Eventual Consistency accepts a bounded stale window.
    ref: concepts.md#content-distribution-network

  - id: ccp-composite-tiers-cdn-014
    difficulty: intermediate
    tags:
    - two-tier
    - modern-equivalent
    question: |
      Which deployment best illustrates a modern Two-Tier Cloud Application?
    options:
    - A CDN in front of a static bucket only
    - Two separately scaled compute fleets (UI and workers) plus a database
    - A message broker fanning out to consumers
    - An autoscaling app service (presentation + logic) behind a load balancer, talking to a managed database
    answer: 3
    explanation: |
      Two-tier = one combined stateless application tier (presentation + logic) behind an LB over
      a managed data store, e.g. Fargate/App Service/Cloud Run + RDS/Cosmos/Cloud SQL.
    ref: concepts.md#two-tier-cloud-application

  - id: ccp-composite-tiers-cdn-015
    difficulty: intermediate
    tags:
    - three-tier
    - modern-equivalent
    question: |
      Which describes a modern Three-Tier Cloud Application?
    options:
    - A UI/API service and a separately deployed worker fleet, decoupled by a queue, over managed data stores
    - A single Lambda plus a database
    - A CDN edge running all business logic
    - One monolith with an embedded database
    answer: 0
    explanation: |
      Three-tier separates presentation (UI/API service) from business logic (worker fleet), often
      decoupled by a queue, over a distinct data tier — each scaled independently.
    ref: concepts.md#three-tier-cloud-application

  - id: ccp-composite-tiers-cdn-016
    difficulty: intermediate
    tags:
    - cdn
    - modern-equivalent
    question: |
      Which set are all modern realizations of the Content Distribution Network pattern?
    options:
    - RDS, DynamoDB, Cosmos DB, Cloud SQL
    - SQS, Kafka, Service Bus, Pub/Sub
    - ALB, NLB, Azure Load Balancer, Cloud Load Balancing
    - CloudFront, Akamai, Fastly, Cloudflare, Azure Front Door, Cloud CDN
    answer: 3
    explanation: |
      CDNs like CloudFront, Akamai, Fastly, Cloudflare, Azure Front Door/CDN, and Google Cloud CDN
      realize the pattern. The other lists are storage, messaging, and load-balancer offerings.
    ref: concepts.md#content-distribution-network

  - id: ccp-composite-tiers-cdn-017
    difficulty: advanced
    tags:
    - two-tier
    - three-tier
    - distinction
    - trade-off
    question: |
      Presentation and business logic in an app have very similar traffic curves and there is no
      benefit to scaling them apart. Which composition is the better fit, and why?
    options:
    - Two-Tier, because bundling logic + presentation is simpler with one fewer hop when their workloads
      track each other
    - Three-Tier, because more tiers always scale better
    - Content Distribution Network, because it replaces both tiers
    - Hybrid Data, because data must be split
    answer: 0
    explanation: |
      When UI and logic workloads track each other, splitting them adds hops and moving parts for
      no scaling benefit. Two-Tier is the simpler correct choice; graduate to three when they diverge.
    ref: concepts.md#two-tier-cloud-application

  - id: ccp-composite-tiers-cdn-018
    difficulty: advanced
    tags:
    - three-tier
    - decoupling
    - scaling
    question: |
      Why is a load balancer or an elastic queue often placed between the presentation and
      business-logic tiers in a Three-Tier application?
    options:
    - To decouple the tiers so each scales independently and bursts are absorbed without dropping work
    - To store session state for the tiers
    - To make the business tier stateful
    - To replace the data tier
    answer: 0
    explanation: |
      A balancer/queue between the tiers decouples them, letting each scale to its own workload and
      buffering bursts so requests are not lost when the logic tier is temporarily saturated.
    ref: concepts.md#three-tier-cloud-application

  - id: ccp-composite-tiers-cdn-019
    difficulty: intermediate
    tags:
    - cdn
    - composition
    - distinction
    question: |
      How does a Content Distribution Network relate to a two- or three-tier application?
    options:
    - It replaces the application and data tiers entirely
    - It fronts the tiered app, serving static/streamed content at the edge while dynamic requests fall
      through
    - It is the data tier of every cloud app
    - It is a stateful business-logic tier
    answer: 1
    explanation: |
      A CDN is a composition choice that sits in front of the tiers, absorbing cacheable/streamed
      traffic near users; dynamic requests still reach the application and data tiers.
    ref: concepts.md#content-distribution-network

  - id: ccp-composite-tiers-cdn-020
    difficulty: advanced
    tags:
    - cdn
    - when-not-to-use
    - trade-off
    question: |
      For which workload does a Content Distribution Network add the LEAST value?
    options:
    - Highly dynamic, per-user, uncacheable API responses for a single-region audience
    - Large streamed video to a global audience
    - Static site assets and images
    - Large downloadable installers distributed worldwide
    answer: 0
    explanation: |
      CDNs shine for large cacheable/streamed content to dispersed users. Highly dynamic,
      per-user, uncacheable responses to a single region gain little (beyond edge TLS/routing).
    ref: concepts.md#content-distribution-network

  - id: ccp-composite-tiers-cdn-021
    difficulty: intermediate
    tags:
    - two-tier
    - stateless-component
    - scaling
    question: |
      What makes the application tier of a Two-Tier Cloud Application easy to scale out?
    options:
    - It caches everything on local disk
    - It is stateless, so instances are interchangeable and can be cloned or removed freely
    - It never talks to a database
    - It runs on a single large instance
    answer: 1
    explanation: |
      Statelessness means any instance can serve any request, so the elastic control loop can add
      or remove identical instances behind the load balancer without state migration.
    ref: concepts.md#two-tier-cloud-application

  - id: ccp-composite-tiers-cdn-022
    difficulty: advanced
    tags:
    - three-tier
    - state
    - gotcha
    question: |
      What happens if you make the business-logic tier of a Three-Tier app stateful?
    options:
    - Nothing changes; it scales the same
    - It becomes cheaper to run
    - It reintroduces cross-instance coordination and caps horizontal scaling
    - The data tier can be removed
    answer: 2
    explanation: |
      A stateful logic tier must coordinate state across instances, which is exactly the hard-to-scale
      problem the pattern isolates in the data tier — capping the tier's elasticity.
    ref: concepts.md#three-tier-cloud-application

  - id: ccp-composite-tiers-cdn-023
    difficulty: beginner
    tags:
    - three-tier
    - intent
    question: |
      What is the guiding question of the Three-Tier Cloud Application pattern?
    options:
    - How can content be replicated near users?
    - How can presentation, business logic, and data handling be decomposed into tiers scaled independently?
    - How can two functions share one deployable?
    - How can strict consistency be guaranteed?
    answer: 1
    explanation: |
      The pattern asks how to decompose presentation logic, business logic, and data handling into
      separate, independently scalable tiers.
    ref: concepts.md#three-tier-cloud-application

  - id: ccp-composite-tiers-cdn-024
    difficulty: advanced
    tags:
    - cdn
    - immutable
    - cache-busting
    question: |
      How do teams commonly avoid CDN cache-invalidation pain for static assets while still
      shipping updates?
    options:
    - Disable caching entirely
    - Use versioned/fingerprinted URLs so each asset version is immutable and simply cached forever
    - Serve everything from the origin
    - Switch the data tier to strict consistency
    answer: 1
    explanation: |
      Fingerprinted (content-hashed) URLs make each asset version immutable, so edges can cache it
      indefinitely and a new deploy just references new URLs — sidestepping invalidation.
    ref: concepts.md#content-distribution-network

  - id: ccp-composite-tiers-cdn-025
    difficulty: intermediate
    tags:
    - data-tier
    - storage-offering
    - mapping
    question: |
      In both tier patterns the data tier is realized by which building block?
    options:
    - Elastic Load Balancer
    - User Interface Component
    - One or several Storage Offerings (relational, blob, key-value)
    - Processing Component
    answer: 2
    explanation: |
      The data tier handles persistent state through one or more Storage Offerings, typically
      provider-managed, and is the hard-to-scale tier.
    ref: concepts.md#two-tier-cloud-application

  - id: ccp-composite-tiers-cdn-026
    difficulty: advanced
    tags:
    - three-tier
    - independent-scaling
    - scenario
    question: |
      During a marketing event, UI traffic spikes 5x but the underlying computation per request is
      unchanged. In a well-designed Three-Tier app, what scales?
    options:
    - Mainly the presentation tier scales out; the business-logic and data tiers stay near baseline
    - All three tiers scale up equally
    - Only the data tier scales
    - Nothing, tiers cannot scale independently
    answer: 0
    explanation: |
      Independent scaling means the presentation tier grows with UI traffic while the logic and
      data tiers, whose load did not change proportionally, stay near baseline.
    ref: concepts.md#three-tier-cloud-application

  - id: ccp-composite-tiers-cdn-027
    difficulty: intermediate
    tags:
    - elasticity
    - control-loop
    - cross-ref
    question: |
      Which mechanism grows and shrinks a stateless tier's instance count to match workload?
    options:
    - An Elastic Load Balancer plus an Elasticity Manager control loop
    - A CDN origin shield
    - A strict-consistency lock
    - A Storage Offering
    answer: 0
    explanation: |
      Each stateless tier is fronted by an Elastic Load Balancer and driven by an Elasticity
      Manager loop that adds/removes instances. Deep dive: system-design/scalability-and-load-balancing.
    ref: concepts.md#two-tier-cloud-application

  - id: ccp-composite-tiers-cdn-028
    difficulty: advanced
    tags:
    - two-tier
    - trade-off
    - coupling
    question: |
      What is the main downside of the Two-Tier composition when presentation and logic workloads
      later diverge?
    options:
    - The data tier disappears
    - It can no longer use a load balancer
    - It must abandon statelessness
    - UI-bound and compute-bound spikes are coupled, forcing over-provisioning of the whole tier
    answer: 3
    explanation: |
      Bundling presentation and logic couples their scaling; if one dimension peaks you must
      over-provision the combined tier. That divergence is the trigger to move to Three-Tier.
    ref: concepts.md#two-tier-cloud-application

  - id: ccp-composite-tiers-cdn-029
    difficulty: intermediate
    tags:
    - cdn
    - topology-awareness
    question: |
      "Topology awareness" in the Content Distribution Network pattern means what?
    options:
    - The database schema is denormalized
    - Business logic is aware of the UI layout
    - Replicas are chosen at random
    - The network layout is factored in so each user is routed to a network-close replica
    answer: 3
    explanation: |
      The CDN accounts for the distribution network's topology so each user is served from a
      geographically/network-close replica, minimizing latency.
    ref: concepts.md#content-distribution-network

  - id: ccp-composite-tiers-cdn-030
    difficulty: advanced
    tags:
    - three-tier
    - microservices
    - cross-ref
    question: |
      How does the Three-Tier Cloud Application relate to a microservices architecture?
    options:
    - They are unrelated
    - Three-tier is the coarse case of independently scaled tiers; microservices push the same idea to many
      fine-grained services
    - Microservices forbid separate data handling
    - Three-tier requires exactly one microservice per tier
    answer: 1
    explanation: |
      Both align instance count to per-component workload. Three-tier is the coarse-grained version;
      microservices generalize it to many separately deployable/scaled services.
    ref: concepts.md#three-tier-cloud-application

  - id: ccp-composite-tiers-cdn-031
    difficulty: beginner
    tags:
    - cdn
    - is-it-a-tier
    question: |
      Is a Content Distribution Network one of the application's tiers?
    options:
    - Yes, it is the presentation tier
    - Yes, it replaces the data tier
    - Yes, it is the business-logic tier
    - No, it is a composition that fronts the tiered application to serve edge content
    answer: 3
    explanation: |
      A CDN is not a tier; it fronts the tiered app, offloading static/streamed content at the edge
      while dynamic requests still reach the app and data tiers.
    ref: concepts.md#content-distribution-network

  - id: ccp-composite-tiers-cdn-032
    difficulty: advanced
    tags:
    - scenario
    - pattern-selection
    - cdn
    - three-tier
    question: |
      A global video platform has bursty UI traffic, heavy transcoding jobs run at different
      times, and huge streamed media to worldwide viewers. Which combination best fits?
    options:
    - Two-Tier only
    - Content Distribution Network only
    - Three-Tier Cloud Application (independent presentation/logic/data tiers) fronted by a Content Distribution
      Network
    - A single stateless tier with no data tier
    answer: 2
    explanation: |
      Divergent UI vs transcoding workloads call for Three-Tier's independent scaling; the global
      streamed media calls for a CDN fronting it. The patterns compose.
    ref: concepts.md#three-tier-cloud-application

  - id: ccp-composite-tiers-cdn-033
    difficulty: intermediate
    tags:
    - two-tier
    - distributed-application
    - foundation
    question: |
      Both tier patterns build on which more fundamental idea?
    options:
    - A monolith deployed as one process
    - A Distributed Application decomposed into components so functions can scale on their own
    - A CDN edge network
    - Strict consistency across all data
    answer: 1
    explanation: |
      Tier patterns refine the Distributed Application idea: decompose into components, then group
      them into tiers so stateless functions scale apart from the stateful data tier.
    ref: concepts.md#two-tier-cloud-application

  - id: ccp-composite-tiers-cdn-034
    difficulty: advanced
    tags:
    - cdn
    - consistency
    - trade-off
    - scenario
    question: |
      A CDN serves breaking-news article bodies that are edited frequently and must never show an
      old version to any reader. Which consistency approach fits, and at what cost?
    options:
    - Eventual Consistency, with no cost
    - No caching is possible at all
    - Random replica selection
    - Strict Consistency, invalidating all edges before serving updates, at the cost of extra coordination
      latency
    answer: 3
    explanation: |
      A no-stale-reads requirement needs Strict Consistency (invalidate everywhere before serving),
      which adds coordination latency compared with the cheaper Eventual (TTL) default.
    ref: concepts.md#content-distribution-network

  - id: ccp-composite-tiers-cdn-035
    difficulty: intermediate
    tags:
    - three-tier
    - data-tier
    - gotcha
    question: |
      A candidate claims "in three-tier, the data tier scales just like the other two." What is
      wrong with this?
    options:
    - Nothing, it is correct
    - The data tier is actually stateless
    - The data tier is stateful and must stay consistent, so it is the hard-to-scale tier the pattern isolates
    - The data tier is the load balancer
    answer: 2
    explanation: |
      The data tier is stateful and consistency-bound; it does not clone like the stateless tiers.
      Both tier patterns exist precisely to isolate it so the stateless tiers scale freely.
    ref: concepts.md#three-tier-cloud-application

  - id: ccp-composite-tiers-cdn-036
    difficulty: advanced
    tags:
    - cdn
    - edge-compute
    - modern-equivalent
    question: |
      Modern CDNs push light dynamic logic to the replica sites. Which are examples of this
      edge-compute extension?
    options:
    - Lambda@Edge / CloudFront Functions, Cloudflare Workers, Fastly Compute
    - RDS read replicas and Aurora
    - SQS and EventBridge
    - Azure SQL and Cosmos DB
    answer: 0
    explanation: |
      Edge-compute layers such as Lambda@Edge/CloudFront Functions, Cloudflare Workers, and Fastly
      Compute run light logic at CDN PoPs. The others are storage or messaging services.
    ref: concepts.md#content-distribution-network

  - id: ccp-composite-tiers-cdn-037
    difficulty: intermediate
    tags:
    - state
    - session-store
    - three-tier
    question: |
      Where should session state be kept in a Three-Tier app so any presentation instance can
      serve any request?
    options:
    - Sticky in-memory on each presentation instance
    - In the load balancer
    - In the data tier or a shared distributed cache/session store
    - In the CDN edge cache
    answer: 2
    explanation: |
      Externalizing session state to the data tier or a shared cache keeps the presentation tier
      stateless, so requests can be served by any instance and the tier stays elastic.
    ref: concepts.md#three-tier-cloud-application

  - id: ccp-composite-tiers-cdn-038
    difficulty: beginner
    tags:
    - two-tier
    - structure
    question: |
      In a Two-Tier Cloud Application, which two responsibilities are bundled into the single
      application tier?
    options:
    - Data storage and load balancing
    - Presentation and business logic
    - Caching and consistency
    - Edge replication and DNS
    answer: 1
    explanation: |
      The two-tier application tier bundles presentation and business logic into one stateless
      tier; only data handling is split out into the separate data tier.
    ref: concepts.md#two-tier-cloud-application

  - id: ccp-composite-tiers-cdn-039
    difficulty: advanced
    tags:
    - pattern-selection
    - two-tier
    - three-tier
    - scenario
    question: |
      A small internal CRUD tool has modest, uniform traffic and a tiny team that wants one
      deployable. Which composition is most appropriate?
    options:
    - Three-Tier, for maximum independent scaling
    - A global CDN as the primary architecture
    - Two-Tier, because uniform workload and simplicity favor one combined stateless tier over a data store
    - A stateful multi-tier mesh
    answer: 2
    explanation: |
      With uniform, modest workload and a desire for simplicity, Two-Tier (one combined tier over a
      managed store) is the right call; Three-Tier's extra hop/parts buy nothing here.
    ref: concepts.md#two-tier-cloud-application

  - id: ccp-composite-tiers-cdn-040
    difficulty: intermediate
    tags:
    - cdn
    - origin
    - offload
    question: |
      A primary benefit of placing a CDN in front of a tiered application is that it does what to
      the application and data tiers?
    options:
    - Forces them to become stateful
    - Removes the need for a database
    - Offloads static/streamed traffic at the edge so they mostly handle dynamic requests
    - Merges them into one tier
    answer: 2
    explanation: |
      By serving cacheable/streamed content from edge replicas, the CDN reduces origin load so the
      app and data tiers handle mainly dynamic requests, improving latency and cost.
    ref: concepts.md#content-distribution-network

  - id: ccp-composite-tiers-cdn-041
    difficulty: advanced
    tags:
    - three-tier
    - distinction
    - sibling
    question: |
      What single change turns a Two-Tier Cloud Application into a Three-Tier one?
    options:
    - Adding a CDN in front
    - Splitting the combined application tier into separate presentation and business-logic tiers scaled
      independently
    - Making the data tier stateless
    - Removing the load balancer
    answer: 1
    explanation: |
      Three-Tier separates the presentation tier from the business-logic tier so each scales to its
      own workload; the data tier was already separate in both patterns.
    ref: concepts.md#three-tier-cloud-application

  - id: ccp-composite-tiers-cdn-042
    difficulty: intermediate
    tags:
    - cdn
    - related-patterns
    question: |
      Which patterns does the Content Distribution Network most directly relate to for keeping its
      replicas correct?
    options:
    - Stateless Component and Processing Component
    - Two-Tier and Three-Tier only
    - Strict Consistency and Eventual Consistency
    - Elastic Load Balancer and Elasticity Manager
    answer: 2
    explanation: |
      Because replicas are updated from a central origin, the CDN relates to Strict Consistency and
      Eventual Consistency — the two models for propagating those updates.
    ref: concepts.md#content-distribution-network

  - id: ccp-composite-tiers-cdn-043
    difficulty: expert
    tags:
    - scenario
    - composition
    - trade-off
    question: |
      An e-commerce site has spiky checkout logic (compute), steady catalog browsing (UI), a
      transactional database, and product images served worldwide. A junior proposes Two-Tier
      with a CDN. What is the strongest objection?
    options:
    - CDNs cannot serve images
    - Two-Tier couples checkout compute and browsing UI into one tier, so their divergent spikes force over-provisioning;
      Three-Tier would scale them apart
    - Two-Tier has no data tier
    - A CDN makes the database stateful
    answer: 1
    explanation: |
      Checkout (compute) and browsing (UI) have divergent workloads; bundling them in one tier
      wastes capacity. Three-Tier separates them for independent scaling, still fronted by the CDN.
    ref: concepts.md#three-tier-cloud-application

