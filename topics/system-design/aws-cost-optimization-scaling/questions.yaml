    ref: "concepts.md#the-cost-performance-availability-and-operational-effort-trade-off-framework"

  - id: aws-cost-optimization-scaling-069
    difficulty: expert
    tags: [s3, glacier, retrieval-cost, judgment]
    question: |
      An analytics team archived 500 TB to Glacier Deep Archive to cut storage cost, but now
