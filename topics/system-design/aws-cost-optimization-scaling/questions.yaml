      - "Deep Archive actually carries a higher per-GB storage rate than S3 Standard, so archiving 500 TB there raised the baseline storage bill rather than lowering it"
      - "Deep Archive rejects any object larger than 128 KB, so the analytics dataset's large files were silently truncated when the lifecycle rule moved them"
      - "Deep Archive keeps only a single-AZ copy of each object, so the 500 TB dataset is not durably stored and could be lost in one facility failure"
    answer: 0
    explanation: |
