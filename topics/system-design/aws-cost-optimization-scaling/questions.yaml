  - id: aws-cost-optimization-scaling-070
    difficulty: expert
    tags: [purchasing, savings-plans, coverage, judgment]
    question: |
      Your steady-state compute is fairly stable but you plan to refactor several EC2 services
      into Fargate and Lambda over the next year. Which purchasing choice preserves your
      discount through that migration?
    options:
      - "EC2 Instance Savings Plans locked to the current instance family, trusting that the committed discount will follow the workload once it moves onto Fargate and Lambda"
      - "Standard Reserved Instances for the specific current instance types, since their committed pricing automatically extends to cover the Fargate and Lambda usage after the refactor"
      - "Compute Savings Plans, because their discount applies across EC2 (any family/Region), Fargate, and Lambda, so it follows the workload as you refactor"
      - "No commitment at all until the refactor is fully done, running everything On-Demand for the year on the assumption that uncommitted pricing is the cheapest way to stay flexible"
    answer: 2
    explanation: |
      Compute Savings Plans float across EC2/Fargate/Lambda, so the discount survives a
      refactor from EC2 to containers/functions. (A) EC2 Instance SPs and (B) Standard RIs lock
      to instance family/type and would strand as you migrate off them. (D) forgoing any
      commitment during a year of stable spend leaves savings unclaimed.
    ref: "concepts.md#purchasing-models-on-demand-reserved-savings-plans-and-spot"

  - id: aws-cost-optimization-scaling-071
    difficulty: advanced
    tags: [pricing-dimensions, service-selection]
    question: |
      When selecting a service to minimize cost, what is the core heuristic regarding pricing
      dimensions?
    options:
      - "Always pick the service advertising the lowest per-hour instance price, since the hourly rate reliably dominates the total bill across every workload shape"
      - "Pick whichever service was launched most recently, on the reasoning that AWS prices newer services below older ones to drive adoption"
      - "Pick the service that exposes the fewest total pricing dimensions, since a simpler bill with fewer line items is inherently the cheaper option"
      - "Pick the service whose DOMINANT pricing dimension aligns with your CHEAPEST usage axis (e.g., request-priced services for spiky low-volume, storage-priced for cold bulk data)"
    answer: 3
    explanation: |
      Cost efficiency comes from matching the service's dominant billing dimension (requests,
      GB-s, GB stored, GB scanned, transfer) to how your workload actually consumes — e.g.,
      request-priced serverless for spiky low volume. (A) per-hour ignores the other dimensions.
      (C), (B) are arbitrary and not cost-driven.
    ref: "concepts.md#pricing-dimensions-per-service-and-the-hidden-cost-of-data-transfer"

  - id: aws-cost-optimization-scaling-072
    difficulty: advanced
    tags: [gateway-vs-interface-endpoint, cost]
    question: |
      What is the key cost distinction between S3/DynamoDB Gateway VPC endpoints and Interface
      (PrivateLink) VPC endpoints?
    options:
      - "Both endpoint types are always completely free of hourly and per-GB charges, so cost never factors into choosing between a Gateway and an Interface endpoint"
      - "Gateway endpoints (S3, DynamoDB only) have no hourly or per-GB charge; Interface endpoints have an hourly + per-GB charge (still typically cheaper than NAT for that AWS-service traffic)"
      - "Interface (PrivateLink) endpoints are the free option, while Gateway endpoints for S3 and DynamoDB bill a per-GB data-processing charge on everything routed through them"
      - "Gateway endpoints still require an underlying NAT Gateway to function, so they only reduce the per-GB rate on S3/DynamoDB traffic rather than removing the NAT charge"
    answer: 1
    explanation: |
      Gateway endpoints (only S3 and DynamoDB) are free; Interface/PrivateLink endpoints cost
      an hourly rate plus per-GB but are usually cheaper than routing that AWS-service traffic
      through NAT. (A) is false — interface endpoints cost money. (C) reverses it. (D) Gateway
      endpoints replace NAT for S3/DynamoDB, they don't require it.
    ref: "concepts.md#nat-gateway-and-data-transfer-cost-traps"

  - id: aws-cost-optimization-scaling-073
    difficulty: beginner
    tags: [payment-options, savings-plans]
    question: |
      For Reserved Instances and Savings Plans, which payment option yields the DEEPEST
      discount?
    options:
      - "All Upfront"
      - "Partial Upfront"
      - "No Upfront"
      - "Monthly billing has the deepest discount"
    answer: 0
    explanation: |
      All Upfront gives the deepest discount (you pay everything at commitment time), then
      Partial Upfront, then No Upfront (smallest discount, no capital outlay). The trade is
      capital-outlay/flexibility vs discount depth. (D) is not a distinct option and isn't the
      deepest.
    ref: "concepts.md#purchasing-models-on-demand-reserved-savings-plans-and-spot"

  - id: aws-cost-optimization-scaling-074
    difficulty: beginner
    tags: [well-architected, cost-pillar]
    question: |
      Which is a core practice of the AWS Well-Architected Cost Optimization pillar?
    options:
      - "Provision every workload for its maximum possible peak capacity at all times"
      - "Avoid measuring or reporting costs so engineering teams stay focused"
      - "Adopt a consumption model — pay only for the resources you use and scale with demand"
      - "Always self-manage every database and queue on raw EC2 to cut costs"
    answer: 2
    explanation: |
      The Cost Optimization pillar emphasizes a consumption model (pay-per-use, scale with
      demand), plus FinOps, measuring efficiency, stopping undifferentiated heavy lifting, and
      attributing spend. (A) over-provisioning is the waste the pillar fights. (B) contradicts
      "measure efficiency." (D) contradicts "use managed services."
    ref: "concepts.md#the-cost-performance-availability-and-operational-effort-trade-off-framework"
