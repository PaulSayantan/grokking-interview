topic: "Cost Optimization and Scaling Trade-offs on AWS"
domain: system-design
topic_slug: aws-cost-optimization-scaling
version: 1
questions:
  - id: aws-cost-optimization-scaling-001
    difficulty: beginner
    tags: [pricing-dimensions, data-transfer]
    question: |
      Which direction of data transfer is generally FREE on AWS?
    options:
      - "Data transfer inbound to AWS from the internet (ingress)"
      - "Internet egress (data leaving AWS to the public internet)"
      - "Cross-Region replication between two AWS Regions"
      - "Cross-AZ traffic between instances in the same Region"
    answer: 0
    explanation: |
      Inbound data transfer TO AWS is free — AWS wants you to bring data in. Internet egress
      (B) is the expensive dimension (~$0.09/GB first tier). Cross-Region (C) and cross-AZ
      (D) both incur per-GB charges. This asymmetry is why egress is the "hidden cost."
    ref: "concepts.md#pricing-dimensions-per-service-and-the-hidden-cost-of-data-transfer"

  - id: aws-cost-optimization-scaling-002
    difficulty: beginner
    tags: [purchasing, spot]
    question: |
      What is the defining characteristic of EC2 Spot Instances?
    options:
      - "They require a fixed 1- or 3-year upfront commitment to unlock the discount tier"
      - "They guarantee dedicated reserved capacity that AWS is contractually barred from ever reclaiming"
      - "They offer the deepest discount (up to ~90%) but AWS can reclaim them with a 2-minute notice"
      - "They are always cheaper than Reserved Instances and carry no interruption or availability downside"
    answer: 2
    explanation: |
      Spot uses spare capacity at up to ~90% off but can be interrupted with a 2-minute
      warning. (A) describes Savings Plans/RIs, not Spot (Spot needs no commitment). (B) is
      the opposite of reality. (D) ignores the interruption risk — Spot is only "free lunch"
      for fault-tolerant workloads.
    ref: "concepts.md#purchasing-models-on-demand-reserved-savings-plans-and-spot"

  - id: aws-cost-optimization-scaling-003
    difficulty: beginner
    tags: [serverless, scale-to-zero]
    question: |
      What does "scale to zero" mean for a serverless service like AWS Lambda, and why does
      it matter for cost?
    options:
      - "The service places a hard cap that guarantees your monthly compute bill stays at zero dollars"
      - "It permanently reserves zero baseline capacity, so the function is prevented from ever scaling up"
      - "It automatically deletes the deployed function package from AWS after each and every invocation"
      - "When there is no traffic there are no running instances and you pay nothing for compute"
    answer: 3
    explanation: |
      Scale-to-zero means idle = no provisioned capacity = no compute charge; you pay only
      per request + GB-second when work actually happens. (A) is wrong (you still pay for
      usage). (C) confuses scaling with deletion. (B) misreads it — Lambda scales up on demand.
    ref: "concepts.md#serverless-pay-per-use-versus-provisioned-economics-and-the-crossover-point"

  - id: aws-cost-optimization-scaling-004
    difficulty: beginner
    tags: [s3, storage-classes]
    question: |
      Which S3 storage class is the best default when the access pattern is UNKNOWN or
      changing, because it automatically moves objects between tiers with no retrieval fees?
    options:
      - "S3 Glacier Deep Archive"
      - "S3 Intelligent-Tiering"
      - "S3 One Zone-IA"
      - "S3 Standard-IA"
    answer: 1
    explanation: |
      Intelligent-Tiering auto-tiers objects based on access with no retrieval fees, for a
      small monitoring charge — ideal for unknown/changing patterns. Deep Archive (A) is for
      known long-term cold data with hours of retrieval latency. One Zone-IA (C) is single-AZ
      for re-creatable data. Standard-IA (D) is a fixed class with retrieval fees, best when
      you KNOW access is infrequent.
    ref: "concepts.md#s3-storage-classes-and-lifecycle-policies-for-cost"

  - id: aws-cost-optimization-scaling-005
    difficulty: beginner
    tags: [graviton, price-performance]
    question: |
      What is the primary reason to choose AWS Graviton (ARM-based) instances?
    options:
      - "They offer better price-performance (commonly cited up to ~40%) than comparable x86 instances"
      - "They provide stronger built-in data durability and redundancy than comparable x86 instances"
      - "They are the only EC2 instance family that is eligible to be covered by Compute Savings Plans"
      - "They eliminate the need for auto scaling by absorbing traffic bursts within a single node"
    answer: 0
    explanation: |
      Graviton delivers better price-performance and energy efficiency for a wide range of
      workloads. Durability (B) is a storage property unrelated to CPU architecture. (C) is
      false — Savings Plans cover x86 too. (D) is unrelated. The main caveat is arm64 builds.
    ref: "concepts.md#graviton-and-arm-for-price-performance"

  - id: aws-cost-optimization-scaling-006
    difficulty: beginner
    tags: [finops, tagging]
    question: |
      Why are cost allocation tags important for FinOps?
    options:
      - "They encrypt billing and usage data at rest in the Cost and Usage Report bucket"
      - "They automatically apply a per-tag volume discount that lowers the price of every tagged resource"
      - "They let you attribute spend to teams, products, and environments so cost is owned and visible"
      - "They are a mandatory prerequisite that must be attached before any AWS resource can be launched"
    answer: 2
    explanation: |
      Tags map spend to owners so you know where money goes and who is accountable — you
      can't optimize what you can't attribute. They don't encrypt (A), don't discount (B),
      and are not mandatory to launch resources (D). Untagged spend is unattributable spend.
    ref: "concepts.md#tagging-cost-allocation-and-finops"

  - id: aws-cost-optimization-scaling-007
    difficulty: beginner
    tags: [dynamodb, capacity-modes]
    question: |
      In DynamoDB, what is the key cost difference between On-Demand and Provisioned capacity
      modes?
    options:
      - "There is no cost difference between the two modes; they differ only in single-digit-millisecond read latency"
      - "On-Demand is always strictly cheaper than Provisioned at every scale, from idle tables up to sustained peak load"
      - "Provisioned mode bills purely per request served, while On-Demand mode bills purely per GB of data stored"
      - "On-Demand bills per request and scales to zero; Provisioned bills for reserved capacity per hour whether used or not"
    answer: 3
    explanation: |
      On-demand = pay per request, no idle cost; provisioned = pay for RCUs/WCUs reserved
      hourly. (B) is false — provisioned is much cheaper per request at steady high load.
      (C) reverses the models. (A) is false; the cost profiles differ sharply.
    ref: "concepts.md#dynamodb-on-demand-versus-provisioned-capacity-cost"

  - id: aws-cost-optimization-scaling-008
    difficulty: beginner
    tags: [caching, cost]
    question: |
      How does a high cache hit ratio reduce AWS cost?
    options:
      - "It increases the total number of database reads because every hit must first re-warm the cache from origin"
      - "Each cache hit avoids downstream work (DB reads, origin compute, egress) you would otherwise pay for"
      - "It automatically converts your On-Demand instances into discounted Reserved Instances once the cache warms"
      - "It removes the need to pay for the cache nodes themselves once the hit ratio climbs high enough"
    answer: 1
    explanation: |
      A hit serves the response without touching the (more expensive) backend — fewer DB
      reads/RCUs, less origin compute, and via CloudFront cheaper egress. (A) is backwards.
      (C) is unrelated. (D) is false — you still pay for cache nodes; the win is only real at
      high hit ratio.
    ref: "concepts.md#caching-to-reduce-cost-and-load"

  - id: aws-cost-optimization-scaling-009
    difficulty: beginner
    tags: [right-sizing, waste]
    question: |
      What is the single most common source of wasted AWS spend that right-sizing targets?
    options:
      - "Over-provisioned, under-utilized resources (e.g., large instances running at low utilization)"
      - "Paying per-GB charges for inbound data ingress transferred into AWS from the public internet"
      - "Choosing fully managed services instead of cheaper self-managed equivalents on raw EC2"
      - "Enabling server-side encryption on EBS volumes and S3 buckets across the fleet"
    answer: 0
    explanation: |
      Over-provisioned, under-utilized resources (oversized instances, unattached EBS,
      over-provisioned DynamoDB) are the classic waste. Ingress (B) is free. Managed services
      (C) reduce ops effort, not waste per se. Encryption (D) is essentially free and
      unrelated to right-sizing.
    ref: "concepts.md#right-sizing-and-auto-scaling-to-match-demand"

  - id: aws-cost-optimization-scaling-010
    difficulty: beginner
    tags: [nat-gateway, endpoints]
    question: |
      Which change eliminates NAT Gateway data-processing charges for private-subnet traffic
      to Amazon S3 and DynamoDB?
    options:
      - "Add a second NAT Gateway in another AZ"
      - "Move the instances to a public subnet with public IPs"
      - "Use a Gateway VPC endpoint for S3 and DynamoDB (free, bypasses NAT)"
      - "Increase the NAT Gateway bandwidth allocation"
    answer: 2
    explanation: |
      Gateway VPC endpoints for S3 and DynamoDB are free and route traffic privately without
      NAT — the #1 easy win. Adding NAT capacity (A, D) increases cost. Public subnets (B)
      create security exposure and still incur egress. Only Gateway endpoints remove the NAT
      data-processing charge for these two services.
    ref: "concepts.md#nat-gateway-and-data-transfer-cost-traps"

  - id: aws-cost-optimization-scaling-011
    difficulty: beginner
    tags: [framework, trade-offs]
    question: |
      In a system-design interview, what is the best framing for a cost-optimization
      recommendation?
    options:
      - "Always choose the absolute cheapest option regardless of requirements"
      - "Whatever minimizes the number of AWS services used"
      - "The most managed option, since managed always means cheapest"
      - "The cheapest design that still meets the stated SLO/constraints, naming what you trade away"
    answer: 3
    explanation: |
      Good cost reasoning is "cheapest design that meets the binding constraint," and you
      state what you give up (freshness, resilience, flexibility). (A) ignores SLOs. (C) is
      false — managed often costs more per unit at scale. (B) is arbitrary; fewer services
      isn't inherently cheaper.
    ref: "concepts.md#the-cost-performance-availability-and-operational-effort-trade-off-framework"

  - id: aws-cost-optimization-scaling-012
    difficulty: beginner
    tags: [budgets, cost-management]
    question: |
      Which AWS tool sends an alert when your spend crosses a threshold you define and can
      even trigger an automated action?
    options:
      - "AWS Trusted Advisor"
      - "AWS Budgets"
      - "AWS Config"
      - "Amazon CloudWatch Logs"
    answer: 1
    explanation: |
      AWS Budgets sets spend/usage thresholds with alerts and budget actions. Trusted Advisor
      (A) gives best-practice checks, not budget alerts. Config (C) tracks resource
      configuration/compliance. CloudWatch Logs (D) stores logs. Budgets is the threshold-alert
      tool.
    ref: "concepts.md#tagging-cost-allocation-and-finops"

  - id: aws-cost-optimization-scaling-013
    difficulty: beginner
    tags: [savings-plans, purchasing]
    question: |
      Compute Savings Plans can apply their discount to which combination of compute?
    options:
      - "EC2, Fargate, and Lambda"
      - "EC2 instance usage only, excluding all Fargate and Lambda compute"
      - "Lambda function invocations only, not EC2 or Fargate container usage"
      - "RDS database instances and DynamoDB provisioned capacity"
    answer: 0
    explanation: |
      Compute Savings Plans are the most flexible: they cover EC2 (any family/size/Region/
      OS/tenancy) plus Fargate and Lambda, so you can refactor across them without losing the
      discount. (B) and (C) are too narrow. (D) — RDS/DynamoDB have their own reserved-capacity
      instruments, not Compute Savings Plans.
    ref: "concepts.md#purchasing-models-on-demand-reserved-savings-plans-and-spot"

  - id: aws-cost-optimization-scaling-014
    difficulty: intermediate
    tags: [data-transfer, cloudfront]
    question: |
      A media service currently egresses 100 TB/month directly from its origin to end users
      on the internet at roughly $0.09/GB. Which change most reduces the transfer bill while
      also reducing origin load?
    options:
      - "Move the origin to a One Zone-IA S3 bucket, whose lower per-GB storage price also reduces the egress rate"
      - "Increase the origin instance size so it can push bytes faster and thereby lower the per-GB internet egress price"
      - "Front the origin with CloudFront so most requests are served from edge caches at cheaper egress rates and origin offload"
      - "Enable cross-Region replication of the content to a second Region so users pull from the nearer, cheaper copy"
    answer: 2
    explanation: |
      CloudFront serves cache hits from the edge at cheaper per-GB egress AND offloads origin
      compute/requests — cutting both transfer and load. (A) reduces storage, not the ~$9k
      transfer cost. (B) doesn't change per-GB egress price. (D) adds cross-Region transfer
      cost, making it worse.
    ref: "concepts.md#pricing-dimensions-per-service-and-the-hidden-cost-of-data-transfer"

  - id: aws-cost-optimization-scaling-015
    difficulty: intermediate
    tags: [serverless, crossover, provisioned]
    question: |
      An API receives sustained ~24/7 traffic near constant high RPS with predictable load.
      Which compute choice is most likely the CHEAPEST per request, all else equal?
    options:
      - "AWS Lambda with provisioned concurrency for every expected concurrent request"
      - "Lambda on-demand with no reserved capacity, relying purely on per-invocation billing at high RPS"
      - "DynamoDB on-demand capacity fronting the requests as the primary compute layer for the API"
      - "A right-sized Graviton container/EC2 fleet covered by a Compute Savings Plan"
    answer: 3
    explanation: |
      At sustained high utilization you are past the serverless/provisioned crossover: an
      always-on right-sized Graviton fleet under a Savings Plan beats per-invocation pricing.
      (A) provisioned concurrency charges for idle warm capacity AND per-request — expensive
      at constant high load. (C) is a database, not a compute choice. (B) per-invocation cost
      exceeds amortized instance cost at constant high RPS.
    ref: "concepts.md#serverless-pay-per-use-versus-provisioned-economics-and-the-crossover-point"

  - id: aws-cost-optimization-scaling-016
    difficulty: intermediate
    tags: [lambda, limits]
    question: |
      Which of these is a real AWS Lambda limit that can force an architecture change?
    options:
      - "Maximum memory of 128 MB per function, which cannot be raised for any runtime"
      - "Maximum execution timeout of 15 minutes per invocation"
      - "Maximum of 100 concurrent executions per account with no way to increase it"
      - "Functions cannot exceed 1 GB of ephemeral /tmp storage"
    answer: 1
    explanation: |
      Lambda's hard 15-minute timeout means long jobs must move to Fargate/Step Functions/
      Batch. (A) is wrong — memory goes up to 10 GB. (C) is wrong — default concurrency is
      1,000 and is raisable. (D) is wrong — ephemeral /tmp can be up to 10 GB.
    ref: "concepts.md#serverless-pay-per-use-versus-provisioned-economics-and-the-crossover-point"

  - id: aws-cost-optimization-scaling-017
    difficulty: intermediate
    tags: [spot, batch, purchasing]
    question: |
      Which workload is the BEST fit for EC2 Spot Instances?
    options:
      - "A stateless, checkpointable batch/video-transcoding job that can tolerate node loss"
      - "The primary node of a relational database holding the only copy of data"
      - "A stateful leader election coordinator that cannot tolerate restarts"
      - "A payment-processing API with a strict 99.99% availability SLA and no retries"
    answer: 0
    explanation: |
      Spot fits fault-tolerant, stateless, checkpointable work — a lost node just reruns.
      (B), (C) hold critical state or leadership that a 2-minute reclaim would corrupt or
      disrupt. (D) can't risk interruption for a strict availability SLA. Diversify instance
      types and combine with On-Demand for the rest.
    ref: "concepts.md#purchasing-models-on-demand-reserved-savings-plans-and-spot"

  - id: aws-cost-optimization-scaling-018
    difficulty: intermediate
    tags: [dynamodb, hot-partition, limits]
    question: |
      A DynamoDB table is provisioned with 20,000 WCU table-wide but throttles writes even
      though total consumption is well under 20,000. What is the most likely cause?
    options:
      - "The average item size exceeds the 400 KB limit, so every write is silently rejected and retried"
      - "On-demand mode is transparently active and is silently capping the table below its provisioned ceiling"
      - "A low-cardinality partition key concentrates writes on one partition, exceeding the ~1,000 WCU per-partition limit"
      - "The table has too many Global Secondary Indexes, and their combined WCU consumption throttles the base table"
    answer: 2
    explanation: |
      A single partition tops out around ~1,000 WCU (and ~3,000 RCU); a hot key concentrates
      load there and throttles regardless of table-wide capacity. (A) 400 KB is a per-item
      write-rejection, not general throttling. (B) the table is provisioned, not on-demand.
      (D) GSIs add cost but don't cause this specific hot-partition throttle. Fix: higher-
      cardinality/write-sharded key.
    ref: "concepts.md#dynamodb-on-demand-versus-provisioned-capacity-cost"

  - id: aws-cost-optimization-scaling-019
    difficulty: intermediate
    tags: [s3, small-objects, cost-trap]
    question: |
      You have hundreds of millions of ~5 KB objects that are rarely read. Why might moving
      them to S3 Standard-IA or Glacier NOT save money — and could cost MORE?
    options:
      - "IA and Glacier classes carry a higher per-GB storage rate than Standard, so any move to them raises the monthly bill for these objects"
      - "Standard-IA is engineered for extra 11-nines durability beyond Standard, and that added redundancy is what makes it cost more here"
      - "S3 lifecycle rules silently refuse to transition any object under 128 KB, so the tiny objects never actually move to the cheaper class"
      - "IA/Glacier bill a per-object minimum billable size (128 KB) plus metadata overhead, so tiny objects are billed far above their real size"
    answer: 3
    explanation: |
      IA classes bill a 128 KB per-object minimum and Glacier adds ~40 KB metadata/object;
      a 5 KB object gets billed as ~128 KB+, so millions of tiny objects can cost more than
      in Standard. (A) is false — per-GB is cheaper. (C) is false. (B) durability isn't the
      driver. Aggregate small objects before archiving.
    ref: "concepts.md#s3-storage-classes-and-lifecycle-policies-for-cost"

  - id: aws-cost-optimization-scaling-020
    difficulty: intermediate
    tags: [savings-plans, reserved-instances]
    question: |
      Why does AWS generally recommend Savings Plans over Standard Reserved Instances for new
      commitments?
    options:
      - "Savings Plans always deliver a strictly deeper maximum discount than any Reserved Instance, beating even 3-year All-Upfront RIs in every single scenario"
      - "Savings Plans commit to a dollar-per-hour spend, so the discount floats automatically across instance families, sizes, Regions, and (for Compute SP) even Fargate/Lambda"
      - "Reserved Instances are capped at 1-year terms only, so a team wanting a 3-year commitment is forced onto Savings Plans by default"
      - "Savings Plans impose no term commitment whatsoever and can be cancelled at any time, unlike the rigid multi-year lock-in of Reserved Instances"
    answer: 1
    explanation: |
      Savings Plans commit to $/hour rather than specific instances, so the discount applies
      automatically to whatever qualifying compute you run — much more flexible than RIs.
      (A) EC2 Instance Savings Plans and Standard RIs reach similar max (~72%); it's not
      "larger in every case." (C) is false. (D) is false — SPs do require a 1/3-year commitment.
    ref: "concepts.md#purchasing-models-on-demand-reserved-savings-plans-and-spot"

  - id: aws-cost-optimization-scaling-021
    difficulty: intermediate
    tags: [ebs, right-sizing]
    question: |
      A fleet uses gp2 EBS volumes sized far larger than needed purely to get more baseline
      IOPS. What is the most cost-effective right-sizing move?
    options:
      - "Migrate to gp3, which decouples IOPS/throughput from size (3,000 IOPS / 125 MB/s baseline) and is ~20% cheaper"
      - "Switch to io2 Block Express and provision the maximum 256,000 IOPS, since that guarantees the lowest cost per delivered IOPS at any volume size"
      - "Move the block data to an S3 One Zone-IA bucket, whose lower per-GB price also delivers the baseline IOPS the volumes were oversized to obtain"
      - "Double each volume's size to guarantee generous IOPS headroom, since gp2's baseline scales with capacity and larger volumes cost less per IOPS"
    answer: 0
    explanation: |
      gp3 decouples performance from capacity and is ~20% cheaper than gp2, so you stop
      over-sizing just for IOPS. (B) io2 is for very high-IOPS needs and costs more. (C) S3
      is object storage, not a block-volume replacement. (D) doubling size is the exact waste
      you're trying to remove.
    ref: "concepts.md#right-sizing-and-auto-scaling-to-match-demand"

  - id: aws-cost-optimization-scaling-022
    difficulty: intermediate
    tags: [dynamodb, capacity-modes, crossover]
    question: |
      A DynamoDB table has steady, predictable, high-volume traffic that keeps utilization
      comfortably high most of the day. Which mode minimizes cost?
    options:
      - "On-demand mode, because it never throttles and its per-request rate is the cheapest available option at any sustained level of steady utilization"
      - "On-demand mode with a DAX cluster in front, since the cache makes the per-request premium irrelevant even under constant high-volume traffic"
      - "Provisioned with auto scaling, ideally plus reserved capacity for the committed baseline"
      - "Provisioned with capacity permanently fixed at the single-minute observed peak, so the table is always ready and never spends time scaling up"
    answer: 2
    explanation: |
      Steady high utilization favors provisioned (far cheaper per request than on-demand),
      with auto scaling to track demand and reserved capacity for the baseline discount. (A)
      on-demand costs ~6-7× more per request at steady load. (B) DAX helps reads but doesn't
      change the base mode economics here. (D) provisioning for peak wastes capacity in troughs.
    ref: "concepts.md#dynamodb-on-demand-versus-provisioned-capacity-cost"

  - id: aws-cost-optimization-scaling-023
    difficulty: intermediate
    tags: [auto-scaling, predictive]
    question: |
      A workload has a sharp, predictable morning traffic ramp, and reactive CPU-based
      scaling always lags — the SLO is breached during the first minutes of the ramp. What
      is the best fix?
    options:
      - "Permanently lower the target-tracking CPU threshold to 20% so the group always runs with enough spare headroom to absorb the morning ramp instantly"
      - "Disable all scale-out cool-down periods so the group can add instances continuously the moment CPU rises, eliminating the lag at the ramp"
      - "Switch to one much larger single instance with auto scaling turned off, since a big enough box can absorb the morning ramp on its own"
      - "Use predictive scaling (and/or scheduled scaling) to pre-warm capacity ahead of the known ramp"
    answer: 3
    explanation: |
      Predictive/scheduled scaling forecasts the recurring pattern and adds capacity BEFORE
      the ramp, eliminating the reactive lag. (A) permanently low threshold wastes money all
      day. (C) a single big instance loses HA and still can't handle growth. (B) removing
      cool-downs causes thrashing and doesn't solve the lag on a sudden ramp.
    ref: "concepts.md#right-sizing-and-auto-scaling-to-match-demand"

  - id: aws-cost-optimization-scaling-024
    difficulty: intermediate
    tags: [nat-gateway, ha, cost]
    question: |
      What is the trade-off between running one NAT Gateway for a whole VPC versus one NAT
      Gateway per Availability Zone?
    options:
      - "One NAT per AZ is always cheaper overall because each gateway processes less data per hour, and NAT hourly charges scale down as you add more gateways"
      - "One shared NAT is cheaper (fewer hourly charges) but a single AZ failure and cross-AZ transfer charges are the cost; one NAT per AZ is more resilient and avoids cross-AZ NAT traffic"
      - "There is no difference in resilience or cost between the two layouts; the only distinction is a cosmetic one in how the console renders the topology"
      - "A single NAT Gateway automatically fails over to a standby gateway in the other AZs at no extra hourly or per-GB cost, so one is always sufficient"
    answer: 1
    explanation: |
      One shared NAT saves hourly charges but creates an AZ single point of failure and makes
      other AZs' egress cross-AZ (extra per-GB). NAT-per-AZ is resilient and keeps traffic
      in-AZ but costs more hourly. (A) is backwards. (C) trivializes a real resilience trade.
      (D) is false — a NAT GW is AZ-scoped and does not auto-failover across AZs.
    ref: "concepts.md#nat-gateway-and-data-transfer-cost-traps"

  - id: aws-cost-optimization-scaling-025
    difficulty: intermediate
    tags: [caching, trade-offs, consistency]
    question: |
      What is the fundamental trade-off you accept when you add a cache to cut cost and
      latency?
    options:
      - "You may serve stale data (reduced freshness/consistency) and add a component with its own failure modes"
      - "You permanently lose durability of the underlying source-of-truth data, because the cache becomes the authoritative store once it is populated"
      - "You can no longer scale the backing database horizontally, since a cache in front locks the schema to a single-node topology"
      - "You are forced to switch the underlying database into eventual-consistency mode permanently, giving up all strongly consistent reads system-wide"
    answer: 0
    explanation: |
      Caching trades freshness/consistency (possibly stale reads) and adds operational
      surface (stampedes, invalidation) for cost and latency wins. (B) the source of truth's
      durability is unchanged. (C) is unrelated. (D) the DB's consistency model isn't forced
      to change by adding a cache.
    ref: "concepts.md#caching-to-reduce-cost-and-load"

  - id: aws-cost-optimization-scaling-026
    difficulty: intermediate
    tags: [graviton, migration, arm64]
    question: |
      What is the main practical caveat when migrating a service to Graviton instances?
    options:
      - "Graviton instances cannot be launched inside a VPC and must run in EC2-Classic networking, which most modern accounts no longer support"
      - "Graviton is not supported by any managed AWS service, so RDS, ElastiCache, and Lambda all fall back to x86 when you select it"
      - "Native/compiled code and some third-party binaries must be built for arm64 (multi-arch images)"
      - "Compute Savings Plans and Reserved Instances do not apply to Graviton instances, so migrating forfeits any existing commitment discount"
    answer: 2
    explanation: |
      Graviton is arm64, so compiled code, native modules, and rare third-party agents need
      arm64 builds; multi-arch container images make this straightforward. (A) is false. (B)
      is false — RDS, ElastiCache, Lambda, etc. offer Graviton. (D) is false — Compute Savings
      Plans cover Graviton, and you can stack the savings.
    ref: "concepts.md#graviton-and-arm-for-price-performance"

  - id: aws-cost-optimization-scaling-027
    difficulty: intermediate
    tags: [athena, gb-scanned]
    question: |
      Amazon Athena bills roughly $5 per TB of data scanned. Which change reduces Athena cost
      the MOST for repeated analytical queries over a large dataset?
    options:
      - "Store the data as uncompressed CSV so queries parse faster, since Athena bills on wall-clock query time rather than on bytes scanned"
      - "Move the S3 bucket to One Zone-IA, whose lower per-GB storage price also proportionally reduces the per-TB-scanned rate Athena charges"
      - "Run every query with SELECT * so Athena caches and reuses the full result set across subsequent queries, cutting repeat scan cost"
      - "Store data in a columnar, compressed, partitioned format (e.g., Parquet) so queries scan far less data"
    answer: 3
    explanation: |
      Columnar + compressed + partitioned (Parquet) means Athena scans only needed columns/
      partitions, cutting TB-scanned dramatically. (A) uncompressed CSV scans more, costing
      more. (C) SELECT * scans everything — the opposite. (B) storage class doesn't change
      bytes scanned by Athena.
    ref: "concepts.md#pricing-dimensions-per-service-and-the-hidden-cost-of-data-transfer"

  - id: aws-cost-optimization-scaling-028
    difficulty: intermediate
    tags: [s3, lifecycle, cost-trap]
    question: |
      Which often-forgotten S3 lifecycle setting stops orphaned storage from silently
      accumulating cost?
    options:
      - "Enabling server-side encryption by default, which compacts stored objects and reclaims the space consumed by unused metadata over time"
      - "Expiring incomplete multipart uploads and expiring noncurrent object versions"
      - "Turning on Requester Pays so that orphaned objects are automatically expired once no requester is willing to pay to retrieve them"
      - "Enabling Transfer Acceleration, which routes stale objects through edge locations and purges them from the origin bucket on a schedule"
    answer: 1
    explanation: |
      Incomplete multipart upload parts and old (noncurrent) versions accumulate invisibly;
      lifecycle rules to expire them reclaim that cost. (A) encryption doesn't reduce storage.
      (C) Requester Pays shifts who pays, not total waste. (D) Transfer Acceleration speeds
      uploads at extra cost — unrelated.
    ref: "concepts.md#s3-storage-classes-and-lifecycle-policies-for-cost"

  - id: aws-cost-optimization-scaling-029
    difficulty: intermediate
    tags: [finops, cost-explorer, cur]
    question: |
      Which AWS tool gives the MOST granular (hourly, per-resource) billing data suitable for
      building custom FinOps dashboards in Athena/QuickSight?
    options:
      - "The Cost and Usage Report (CUR) delivered to S3"
      - "AWS Cost Explorer, which streams the same hourly, per-resource line items directly into Athena and QuickSight without any S3 export step"
      - "AWS Budgets, whose per-resource hourly breakdown is the finest-grained billing feed AWS exposes for custom dashboards"
      - "AWS Trusted Advisor, which emits raw hourly per-resource cost records suitable for building bespoke FinOps dashboards"
    answer: 0
    explanation: |
      The CUR is the most granular billing dataset (hourly, per-resource, per-tag) landed in
      S3 for querying. Cost Explorer (B) is great for interactive visualization but less
      granular/customizable. Budgets (C) is for thresholds/alerts. Trusted Advisor (D) is
      best-practice checks.
    ref: "concepts.md#tagging-cost-allocation-and-finops"

  - id: aws-cost-optimization-scaling-030
    difficulty: intermediate
    tags: [framework, availability, cost]
    question: |
      A stakeholder asks why the multi-AZ version of a stateful service costs noticeably more
      than single-AZ. What is the accurate explanation?
    options:
      - "Multi-AZ deployments run on a faster, premium-priced CPU generation that AWS reserves exclusively for high-availability configurations"
      - "Multi-AZ automatically adds a fixed per-hour compliance and certification surcharge on top of the underlying resource cost"
      - "Multi-AZ roughly duplicates the footprint and adds inter-AZ replication/transfer, buying independent-failure-domain resilience with money and some write latency"
      - "Multi-AZ can only be purchased through Reserved Instances, whose committed pricing is inherently more expensive than the On-Demand single-AZ rate"
    answer: 2
    explanation: |
      Multi-AZ duplicates capacity across independent failure domains and adds cross-AZ
      replication traffic and a little write latency — you buy resilience with cost. (A)
      hardware isn't the driver. (B) there's no compliance surcharge. (D) is false — purchasing
      model is independent of AZ layout.
    ref: "concepts.md#the-cost-performance-availability-and-operational-effort-trade-off-framework"

  - id: aws-cost-optimization-scaling-031
    difficulty: intermediate
    tags: [lambda, right-sizing, memory]
    question: |
      Counterintuitively, increasing a Lambda function's memory setting sometimes REDUCES its
      cost. Why?
    options:
      - "Raising the memory setting reduces the fixed per-request invocation price that Lambda charges, so more memory means cheaper requests"
      - "Allocating more than a threshold of memory disables the per-invocation request charge entirely, leaving only the duration cost"
      - "AWS applies an automatic volume discount to any Lambda function configured above 1 GB of memory, lowering its per-ms rate"
      - "Memory scales vCPU, so a CPU-bound function may finish much faster, reducing total GB-seconds despite the higher per-ms rate"
    answer: 3
    explanation: |
      Lambda allocates CPU proportional to memory; a CPU-bound function at higher memory
      finishes faster, and fewer milliseconds can outweigh the higher per-ms rate — net lower
      GB-seconds. (A) request price is fixed per invoke. (C) no such tier discount. (B) the
      request charge always applies. Tune with Lambda Power Tuning.
    ref: "concepts.md#right-sizing-and-auto-scaling-to-match-demand"

  - id: aws-cost-optimization-scaling-032
    difficulty: intermediate
    tags: [caching, dax, dynamodb]
    question: |
      A read-heavy DynamoDB table serves 10,000 read RPS with high key locality. Adding a
      cache that absorbs ~90% of reads primarily helps cost by:
    options:
      - "Raising the DynamoDB item-size limit above 400 KB, so each cached read can return a larger payload and fewer total reads are needed"
      - "Cutting consumed read capacity (RCUs) roughly 10×, so you provision far less DynamoDB read capacity"
      - "Automatically converting the underlying table from provisioned to on-demand capacity mode once the cache absorbs the bulk of reads"
      - "Eliminating all cross-AZ data-transfer charges between the application tier and the DynamoDB table by serving reads locally"
    answer: 1
    explanation: |
      A 90% hit ratio means the DB sees ~1,000 RPS instead of 10,000 — ~10× fewer RCUs and a
      smaller/cheaper capacity footprint (DAX is purpose-built for this). (A) caching doesn't
      change item-size limits. (C) it doesn't change capacity mode. (D) it may reduce some
      traffic but doesn't "eliminate" cross-AZ charges.
    ref: "concepts.md#caching-to-reduce-cost-and-load"

  - id: aws-cost-optimization-scaling-033
    difficulty: intermediate
    tags: [purchasing, portfolio]
    question: |
      A workload has a steady 24/7 baseline PLUS a fault-tolerant nightly batch job PLUS
      occasional unpredictable spikes. What is the most cost-effective purchasing mix?
    options:
      - "Savings Plans/RIs for the steady baseline, Spot for the fault-tolerant batch, and On-Demand for the unpredictable spillover"
      - "On-Demand pricing for every component including the steady 24/7 baseline, to keep maximum flexibility and avoid any commitment"
      - "Spot Instances for every component including the steady baseline, since Spot always offers the deepest discount regardless of workload type"
      - "3-year All-Upfront Reserved Instances sized to the peak spike, so the single largest burst is always covered by committed capacity"
    answer: 0
    explanation: |
      Match instrument to usage shape: commit the predictable baseline (Savings Plans/RIs),
      run interruptible batch on Spot, absorb spikes with On-Demand. (B) leaves baseline
      savings on the table. (C) Spot can't safely run the always-on baseline. (D) buying RIs
      to peak strands capacity during troughs.
    ref: "concepts.md#purchasing-models-on-demand-reserved-savings-plans-and-spot"

  - id: aws-cost-optimization-scaling-034
    difficulty: intermediate
    tags: [s3, one-zone-ia, durability]
    question: |
      S3 One Zone-IA is ~20% cheaper than Standard-IA. What must be true for it to be an
      appropriate choice?
    options:
      - "The data must be encrypted with a customer-managed KMS key, since One Zone-IA only unlocks its lower price for CMK-protected objects"
      - "The objects must each be smaller than 128 KB, because One Zone-IA is optimized specifically for large numbers of tiny files"
      - "The data must be re-creatable or a secondary copy, because it lives in a single AZ and is lost if that AZ is destroyed"
      - "The bucket must be created in the us-east-1 Region, as One Zone-IA pricing is only offered in that single primary Region"
    answer: 2
    explanation: |
      One Zone-IA stores data in a single AZ; if that AZ is lost, so is the data — so it fits
      only re-creatable/derived/secondary data. (A) encryption is unrelated. (B) small objects
      are actually a cost trap in IA, not a requirement. (D) Region is irrelevant to the
      single-AZ durability trade.
    ref: "concepts.md#s3-storage-classes-and-lifecycle-policies-for-cost"

  - id: aws-cost-optimization-scaling-035
    difficulty: intermediate
    tags: [serverless, ops-effort, trade-offs]
    question: |
      Even PAST the pure-dollar crossover where provisioned compute is cheaper, why do many
      teams stay on serverless (Lambda/Fargate)?
    options:
      - "Serverless remains strictly cheaper per request than provisioned compute at every utilization level, so the crossover is only theoretical"
      - "Serverless platforms provide fundamentally stronger data durability guarantees than the storage backing a provisioned fleet"
      - "Provisioned EC2 or container fleets are architecturally incapable of achieving multi-AZ high availability the way serverless does"
      - "They pay a compute premium to eliminate capacity planning, patching, and scaling toil (operational effort)"
    answer: 3
    explanation: |
      The trade isn't only dollars — serverless removes undifferentiated heavy lifting
      (capacity planning, patching, autoscaling, built-in AZ redundancy), so teams accept a
      compute premium to save ops effort. (A) is false past the crossover. (C) provisioned can
      absolutely be HA. (B) durability isn't the differentiator here.
    ref: "concepts.md#serverless-pay-per-use-versus-provisioned-economics-and-the-crossover-point"

  - id: aws-cost-optimization-scaling-036
    difficulty: intermediate
    tags: [organizations, consolidated-billing]
    question: |
      In an AWS Organization with consolidated billing, how do Savings Plans and volume
      discounts behave across member accounts?
    options:
      - "Each account must buy its own commitments; nothing is shared"
      - "Commitments and volume tiering are pooled/shared across the org, so a Savings Plan bought in one account can cover usage in others"
      - "Consolidated billing disables all discounts"
      - "Discounts apply only to the management (payer) account"
    answer: 1
    explanation: |
      Consolidated billing aggregates usage so Savings Plans/RIs and tiered volume discounts
      are shared across the organization — unused commitment in one account floats to others.
      (A), (D) are false. (C) is the opposite of the benefit.
    ref: "concepts.md#tagging-cost-allocation-and-finops"

  - id: aws-cost-optimization-scaling-037
    difficulty: intermediate
    tags: [nat-gateway, privatelink]
    question: |
      A private-subnet service makes heavy API calls to another AWS service and is racking up
      NAT Gateway data-processing charges. What is the appropriate mitigation for AWS-service
      traffic that isn't S3/DynamoDB?
    options:
      - "Use an Interface (PrivateLink) VPC endpoint for the supported AWS service to bypass NAT (weighing its hourly + per-GB cost, usually cheaper than NAT for that traffic)"
      - "Move the instances to a public subnet with public IPv4 addresses, eliminating the NAT data-processing charge — the recommended pattern for private backend services"
      - "Delete the NAT Gateway entirely and let the private instances reach the AWS service directly over the default VPC route, which incurs no data-processing fee"
      - "Route the AWS-service traffic through a NAT Gateway in a second Region, where per-GB data-processing rates are lower, to cut the charge"
    answer: 0
    explanation: |
      Interface (PrivateLink) endpoints keep AWS-service traffic off NAT; they have their own
      hourly + per-GB cost but are typically cheaper than NAT data-processing for that traffic
      (do the math). Gateway endpoints only cover S3/DynamoDB. (B) creates exposure. (C)
      breaks other egress. (D) adds cross-Region cost.
    ref: "concepts.md#nat-gateway-and-data-transfer-cost-traps"

  - id: aws-cost-optimization-scaling-038
    difficulty: intermediate
    tags: [compute-optimizer, right-sizing]
    question: |
      Which AWS service provides ML-driven right-sizing recommendations across EC2, EBS,
      Lambda memory, and Fargate?
    options:
      - "Amazon Inspector"
      - "AWS CloudTrail"
      - "AWS Compute Optimizer"
      - "AWS Systems Manager Patch Manager"
    answer: 2
    explanation: |
      Compute Optimizer analyzes utilization and recommends right-sized instances/volumes/
      Lambda memory. CloudTrail (B) records API calls. Inspector (A) scans for security
      vulnerabilities. Patch Manager (D) manages patching. Only Compute Optimizer targets
      right-sizing.
    ref: "concepts.md#right-sizing-and-auto-scaling-to-match-demand"

  - id: aws-cost-optimization-scaling-039
    difficulty: intermediate
    tags: [dynamodb, on-demand, spiky]
    question: |
      A brand-new feature will launch with completely unknown, likely spiky traffic. Which
      DynamoDB capacity choice is the most operationally safe starting point?
    options:
      - "Provisioned mode with RCUs/WCUs set to a guessed peak, then left fixed so the table is always ready for whatever the launch turns out to need"
      - "On-demand mode combined with reserved capacity purchased upfront, so you get elastic scaling and the committed-baseline discount at the same time"
      - "Provisioned mode with auto scaling disabled, giving you a stable, predictable hourly bill that is unaffected by however spiky the real traffic becomes"
      - "On-demand mode, so it scales automatically and you never throttle from under-provisioning"
    answer: 3
    explanation: |
      With unknown/spiky load, on-demand avoids both throttling (under-provisioning) and
      waste (over-provisioning) while you learn the pattern; later switch to provisioned once
      predictable. (A), (C) risk throttling or waste from a bad guess. (B) reserved capacity
      applies to provisioned mode, not on-demand.
    ref: "concepts.md#dynamodb-on-demand-versus-provisioned-capacity-cost"

  - id: aws-cost-optimization-scaling-040
    difficulty: intermediate
    tags: [anomaly-detection, finops]
    question: |
      Which tool would catch a misconfigured job that suddenly triples daily spend, BEFORE
      the monthly invoice arrives?
    options:
      - "AWS Certificate Manager"
      - "AWS Cost Anomaly Detection"
      - "Amazon Macie"
      - "AWS Resource Access Manager"
    answer: 1
    explanation: |
      Cost Anomaly Detection uses ML to alert on unusual spend spikes in near-real-time,
      catching runaway costs early. ACM (A) manages TLS certs. Macie (C) discovers sensitive
      data. RAM (D) shares resources across accounts. Only Anomaly Detection targets spend
      spikes.
    ref: "concepts.md#tagging-cost-allocation-and-finops"

  - id: aws-cost-optimization-scaling-041
    difficulty: intermediate
    tags: [aurora-serverless, provisioned]
    question: |
      For which database workload is Aurora Serverless v2 typically the better cost choice
      over provisioned Aurora?
    options:
      - "A database with variable, intermittent, or unpredictable load where capacity should scale up and down with demand"
      - "A database with steady, constant, high utilization around the clock, since Serverless v2 bills a lower per-ACU rate than the equivalent always-on provisioned instance"
      - "Any workload at all, since Aurora Serverless v2 is engineered to be strictly cheaper than provisioned Aurora at every utilization level and scale"
      - "A workload that must never scale its capacity, because Serverless v2 pins ACUs to a fixed floor and charges less than a comparably sized provisioned instance"
    answer: 0
    explanation: |
      Aurora Serverless v2 scales capacity (ACUs) with demand — best for variable/intermittent
      load. (B) a steadily busy DB is cheaper on provisioned Aurora (+ RIs). (A) is correct.
      (C) is false — serverless isn't universally cheaper. (D) mischaracterizes the use case.
    ref: "concepts.md#serverless-pay-per-use-versus-provisioned-economics-and-the-crossover-point"

  - id: aws-cost-optimization-scaling-042
    difficulty: intermediate
    tags: [multi-account, governance]
    question: |
      Beyond tagging, what is a cleaner way for a large org to enforce hard cost and
      blast-radius boundaries per team/environment while still pooling discounts?
    options:
      - "Put everything in one shared account and rely purely on cost allocation tags, since tags alone create hard, unbreachable spending and blast-radius boundaries between teams"
      - "Give every engineer root credentials to one shared account so they can self-serve, then reconcile each team's spend from CloudTrail records after the fact"
      - "Use separate AWS accounts per team/environment via Organizations/Control Tower, with consolidated billing pooling Savings Plans/volume discounts"
      - "Disable consolidated billing so each account is invoiced separately, which is the only way to keep per-team costs isolated while still sharing Savings Plan discounts"
    answer: 2
    explanation: |
      Multi-account (Organizations/Control Tower) gives hard cost + blast-radius boundaries
      per team/env, while consolidated billing still shares discounts. (A) tag-only attribution
      is weaker at large scale. (B) is a security anti-pattern. (D) disabling consolidated
      billing loses the shared-discount benefit.
    ref: "concepts.md#tagging-cost-allocation-and-finops"

  - id: aws-cost-optimization-scaling-043
    difficulty: advanced
    tags: [crossover, estimation, lambda]
    question: |
      A workload sees ~30M requests/day but they arrive almost entirely within a 3-hour daily
      window; the rest of the day is near-idle. On pure cost, which is likely best?
    options:
      - "A fixed, always-on right-sized EC2 fleet under a 3-year Savings Plan sized to the peak"
      - "A single large instance running continuously all day, since one big box sized to the 3-hour peak amortizes cheaper than many small nodes"
      - "Provisioned DynamoDB set to the peak throughput 24/7 as the compute layer, so the busy window is always covered without any scaling delay"
      - "Serverless (Lambda) or Fargate that scales out during the 3-hour spike and scales to (near) zero the other 21 hours"
    answer: 3
    explanation: |
      With a low duty cycle (busy ~3/24 hours), an always-on fleet sized to peak sits idle
      most of the day — scale-to-zero serverless (or Fargate scaling in/out) avoids paying for
      21 idle hours. (A), (B) pay for idle 21 hours. (C) is a DB, not the compute choice, and
      peak-24/7 provisioning wastes capacity. Duty cycle, not total volume, drives the crossover.
    ref: "concepts.md#serverless-pay-per-use-versus-provisioned-economics-and-the-crossover-point"

  - id: aws-cost-optimization-scaling-044
    difficulty: advanced
    tags: [spot, interruption, design]
    question: |
      You want to run a large stateless web tier mostly on Spot to cut cost, but must survive
      Spot reclamation without user-visible impact. Which design is most robust?
    options:
      - "Run 100% of the tier on a single Spot instance type in one AZ to maximize the discount, since concentrating on one pool gives AWS the strongest incentive to keep that capacity available"
      - "Use an EC2 Auto Scaling group / EC2 Fleet mixing Spot across many instance types and AZs with a capacity-optimized strategy, plus an On-Demand baseline, and handle the 2-minute interruption notice by draining connections"
      - "Run entirely on Spot with no On-Demand baseline and no instance-type diversification, relying on client-side retries alone to paper over any reclamation events"
      - "Convert the entire web tier to 3-year All-Upfront Reserved Instances, since committed capacity is contractually protected from the Spot reclamation you are worried about"
    answer: 1
    explanation: |
      Diversifying Spot across many types/AZs with capacity-optimized allocation minimizes
      correlated interruption, an On-Demand baseline guarantees floor capacity, and honoring
      the 2-minute notice (connection draining) avoids user impact. (A) concentrates
      interruption risk. (C) risks simultaneous reclaim of the whole tier. (D) discards the
      Spot savings you wanted.
    ref: "concepts.md#purchasing-models-on-demand-reserved-savings-plans-and-spot"

  - id: aws-cost-optimization-scaling-045
    difficulty: advanced
    tags: [data-transfer, architecture, cross-az]
    question: |
      A chatty microservice mesh spread evenly across 3 AZs shows a surprisingly large
      cross-AZ data-transfer bill. Which mitigation is appropriate WITHOUT sacrificing
      availability for the stateful tier?
    options:
      - "Use topology/zone-aware routing so stateless request paths prefer same-AZ endpoints where the SLO allows, while keeping stateful/critical tiers AZ-redundant"
      - "Collapse all services, including the stateful tier, into a single Availability Zone so every hop becomes free intra-AZ traffic with no measurable resilience impact"
      - "Route all inter-service traffic through a shared NAT Gateway, whose per-GB data-processing rate is lower than the cross-AZ transfer rate the mesh is paying today"
      - "Replicate every service into a second Region and load-balance across both, so requests stay within whichever Region is nearest and cross-AZ charges disappear"
    answer: 0
    explanation: |
      Zone-aware routing keeps stateless chatter in-AZ (cheaper) while preserving AZ
      redundancy for stateful tiers — the balanced answer. (B) single-AZ destroys resilience.
      (C) NAT adds per-GB processing cost, not savings. (D) cross-Region adds far more transfer
      cost, worsening the problem.
    ref: "concepts.md#nat-gateway-and-data-transfer-cost-traps"

  - id: aws-cost-optimization-scaling-046
    difficulty: advanced
    tags: [savings-plans, over-commit, forecast-risk]
    question: |
      What is the PRIMARY risk of buying a 3-year All-Upfront Compute Savings Plan sized to
      100% of a currently-large but uncertain workload?
    options:
      - "Any usage above the committed $/hour is automatically forced onto Spot capacity, exposing that overage to sudden 2-minute reclamation interruptions"
      - "The negotiated discount percentage automatically decreases each year of the 3-year term, so the effective savings erode steadily as the commitment ages"
      - "If the workload shrinks or migrates off qualifying compute, you have stranded commitment you paid for but can't fully use"
      - "Committing to a Savings Plan revokes your ability to launch On-Demand instances, so any burst beyond the covered capacity simply fails to launch"
    answer: 2
    explanation: |
      Over-committing to a $/hour spend you may not sustain leaves stranded cost during
      troughs or after a migration — hence targeting ~70-80% of steady-state. (A) overage
      simply bills On-Demand, not Spot. (B) the discount rate is fixed for the term. (D) you
      can still run On-Demand freely.
    ref: "concepts.md#purchasing-models-on-demand-reserved-savings-plans-and-spot"

  - id: aws-cost-optimization-scaling-047
    difficulty: advanced
    tags: [dynamodb, write-sharding, hot-partition]
    question: |
      A DynamoDB table keyed by `date` (one item stream per day) throttles hard during peak
      hours despite ample table-wide capacity. What is the correct fix?
    options:
      - "Switch the table to on-demand capacity mode, which removes all per-partition throughput limits and lets a single hot key absorb unlimited writes"
      - "Add several more Global Secondary Indexes so the day's writes are automatically fanned out and balanced across the extra index partitions"
      - "Raise the per-item size limit above 400 KB so each day's item can hold more data and the table stops throttling during the peak window"
      - "Introduce write sharding / a higher-cardinality partition key (e.g., date#shardId) to spread writes across many partitions"
    answer: 3
    explanation: |
      A `date` key concentrates all of a day's writes on one partition, hitting the ~1,000
      WCU / ~3,000 RCU per-partition ceiling. Adding a shard suffix spreads load across
      partitions. (A) on-demand still has per-partition limits and a cold-table ramp. (C) the
      400 KB limit isn't the issue. (B) GSIs add cost and their own hot-partition risk.
    ref: "concepts.md#dynamodb-on-demand-versus-provisioned-capacity-cost"

  - id: aws-cost-optimization-scaling-048
    difficulty: advanced
    tags: [caching, stampede, failure-mode]
    question: |
      After adding an ElastiCache layer to shrink your database, you notice that when many
      keys expire simultaneously the database briefly gets slammed. What is this and how do
      you mitigate it?
    options:
      - "A DynamoDB hot partition; fix it by raising the per-item size limit so each cached entry holds more data and fewer keys need to expire at once"
      - "A cache stampede / thundering herd; mitigate with jittered TTLs, request coalescing, and soft-TTL background refresh"
      - "A cross-AZ data-transfer spike triggered by the cache; fix it by consolidating the cache and database into one Availability Zone to eliminate the inter-AZ hop"
      - "A NAT Gateway saturation event on the cache subnet; fix it by provisioning a larger NAT Gateway with more data-processing bandwidth"
    answer: 1
    explanation: |
      Simultaneous expiry (or cold cache) causes many requests to miss and hit the DB at once
      — a stampede. Jittered TTLs, request coalescing/single-flight, and soft-TTL refresh
      smooth it. (A) is a DynamoDB partition concept, not this. (C), (D) misdiagnose the
      cache-behavior problem.
    ref: "concepts.md#caching-to-reduce-cost-and-load"

  - id: aws-cost-optimization-scaling-049
    difficulty: advanced
    tags: [provisioned-concurrency, lambda, cost]
    question: |
      A latency-sensitive Lambda uses provisioned concurrency to eliminate cold starts. How
      does this change its position on the cost trade-off surface?
    options:
      - "It shifts Lambda toward provisioned economics: you now pay for warm capacity whether or not it is invoked, so it only pays off at sustained utilization"
      - "It keeps Lambda fully pay-per-use with no idle charges, because the pre-warmed execution environments are billed only at the moment a request actually invokes them"
      - "It makes Lambda strictly cheaper per request than any provisioned EC2 or Fargate option, since the reserved warm units are billed at a deeply discounted committed-capacity rate"
      - "It removes the per-request invocation charge entirely, leaving only the memory-duration cost for functions configured with provisioned concurrency"
    answer: 0
    explanation: |
      Provisioned concurrency charges for kept-warm capacity (idle included), moving Lambda
      off pure scale-to-zero toward provisioned economics — worthwhile mainly at sustained
      utilization or strict latency needs. (B) is false — you pay for idle warm units. (C) is
      overstated. (D) the per-request charge still applies.
    ref: "concepts.md#serverless-pay-per-use-versus-provisioned-economics-and-the-crossover-point"

  - id: aws-cost-optimization-scaling-050
    difficulty: advanced
    tags: [scaling, metric-selection, failure-mode]
    question: |
      A latency-driven service auto scales on average CPU, but under bursts the p99 latency
      blows past the SLO while CPU is still moderate, so scaling triggers too late. What is
      the best remedy?
    options:
      - "Disable auto scaling and pin the instance count at the average-CPU level, so capacity never fluctuates and the p99 latency stabilizes during bursts"
      - "Raise the target-tracking CPU threshold to 90% so the group tolerates more load per node and therefore reacts to the burst sooner than it does today"
      - "Scale on a leading saturation signal such as request rate, queue depth, or concurrency instead of (or in addition to) lagging CPU"
      - "Switch to a larger instance family while keeping the same average-CPU scaling metric, since bigger nodes will clear the p99 latency spikes on their own"
    answer: 2
    explanation: |
      CPU can lag the true saturation point for latency-bound workloads; scaling on a leading
      signal (RPS, queue depth, in-flight concurrency) reacts before the SLO breaks. (B) a
      higher CPU target scales LATER, worsening it. (A) fixed-at-average can't handle bursts.
      (D) same lagging metric = same late trigger.
    ref: "concepts.md#right-sizing-and-auto-scaling-to-match-demand"

  - id: aws-cost-optimization-scaling-051
    difficulty: advanced
    tags: [s3, lifecycle, early-deletion]
    question: |
      A pipeline writes objects that are frequently overwritten/deleted within a week. A
      lifecycle rule transitions them to Standard-IA after creation to "save money." What
      goes wrong?
    options:
      - "Standard-IA provides only single-AZ durability, so frequently overwritten pipeline data risks silent loss whenever an Availability Zone is impaired"
      - "Standard-IA objects cannot be read with millisecond latency and require a multi-minute restore step, which stalls the pipeline's rapid overwrite cycle"
      - "Lifecycle rules are prohibited from transitioning any object younger than 90 days, so the rule silently fails and the objects never actually move to IA"
      - "Objects deleted before the 30-day minimum still incur the full 30-day minimum-duration charge, so churny data costs MORE in IA than in Standard"
    answer: 3
    explanation: |
      Standard-IA has a 30-day minimum storage duration; deleting churny objects sooner still
      bills 30 days plus retrieval fees — more expensive than leaving them in Standard. (A)
      IA durability matches Standard. (C) is false. (B) is false — IA offers millisecond
      access. Don't tier churny/short-lived data.
    ref: "concepts.md#s3-storage-classes-and-lifecycle-policies-for-cost"

  - id: aws-cost-optimization-scaling-052
    difficulty: advanced
    tags: [framework, judgment, latency-slo]
    question: |
      A trading dashboard has a hard requirement: p99 read latency < 10 ms and zero data
      loss. The team proposes One Zone-IA storage and heavy Glacier tiering "to save money."
      What is the correct principled response?
    options:
      - "Accept the proposal as-is; cost should always be the deciding factor, and the sub-10 ms latency and zero-data-loss targets can be relaxed to capture the storage savings"
      - "Reject those cost moves for this data: the binding constraints (sub-10 ms latency, zero data loss) override cost, so use low-latency multi-AZ storage/caching and only tier genuinely cold, loss-tolerant data"
      - "Move the entire dataset to Glacier Deep Archive to maximize savings, then rely on expedited retrievals to still serve the sub-10 ms p99 read requirement on demand"
      - "Run the database primary on Spot Instances to cut compute cost, accepting the occasional 2-minute reclamation as a fair trade for the hard zero-data-loss requirement"
    answer: 1
    explanation: |
      When latency/durability are the binding constraints, you explicitly trade cost for them
      — Glacier's minutes-to-hours retrieval and One Zone's single-AZ loss risk violate the
      requirements. Only cold, loss-tolerant data should be tiered. (A), (C) ignore the SLO.
      (D) Spot on a stateful primary risks data loss — the opposite of "zero data loss."
    ref: "concepts.md#the-cost-performance-availability-and-operational-effort-trade-off-framework"

  - id: aws-cost-optimization-scaling-053
    difficulty: advanced
    tags: [graviton, java, judgment]
    question: |
      A team runs a JVM microservice on x86 m5 instances under a Compute Savings Plan. They
      ask how to cut cost further with minimal risk. What is the strongest recommendation?
    options:
      - "Migrate to Graviton (e.g., m7g/m8g arm64) — JVM workloads run well on arm64 for better price-performance, and the Compute Savings Plan discount still applies"
      - "Move the entire service to Spot Instances only, accepting the frequent 2-minute reclamation interruptions as an acceptable trade for the deepest possible discount"
      - "Drop the existing Compute Savings Plan and run everything On-Demand to stay flexible, since uncommitted On-Demand pricing is what unlocks the largest long-term savings"
      - "Switch the fleet to On-Demand pricing to avoid any commitment, because paying the standard hourly rate with no upfront lock-in is the lowest-risk way to reduce cost"
    answer: 0
    explanation: |
      JIT/interpreted runtimes like the JVM run great on Graviton; migrating to arm64 gives
      better price-performance and Compute Savings Plans cover Graviton, so savings compound
      with low risk. (B) Spot adds interruption risk to a service tier. (C), (D) dropping the
      commitment raises cost, the opposite of the goal.
    ref: "concepts.md#graviton-and-arm-for-price-performance"

  - id: aws-cost-optimization-scaling-054
    difficulty: advanced
    tags: [dynamodb, crossover, estimation]
    question: |
      A team is deciding between DynamoDB on-demand and provisioned for a table whose traffic
      is steady and would keep provisioned capacity around 60-70% utilized most hours. Which
      statement best guides the choice?
    options:
      - "On-demand is cheaper here because it never wastes capacity, and at 60-70% utilization its per-request rate undercuts provisioned once you account for the RCUs/WCUs left idle in the troughs"
      - "The choice is identical in cost at every utilization level, since AWS internally converges on-demand and provisioned pricing to the same effective per-request rate for steady tables"
      - "At sustained utilization comfortably above ~50-60%, provisioned + auto scaling is cheaper per request than on-demand's ~6-7× per-request premium, so choose provisioned"
      - "Provisioned mode is only ever cheaper below roughly 10% utilization; above that thin sliver on-demand's elastic billing always wins, so this 60-70% table should stay on-demand"
    answer: 2
    explanation: |
      On-demand's per-request rate runs roughly 6-7× provisioned; once sustained utilization
      is comfortably above ~50-60%, provisioned (with auto scaling to trim troughs) wins. (A)
      ignores on-demand's per-request premium at steady load. (B) is false. (D) inverts the
      relationship.
    ref: "concepts.md#dynamodb-on-demand-versus-provisioned-capacity-cost"

  - id: aws-cost-optimization-scaling-055
    difficulty: advanced
    tags: [data-transfer, gateway-endpoint, estimation]
    question: |
      Private-subnet ETL instances read 50 TB/month from S3 via a NAT Gateway. Approximately
      what recurring cost class disappears by switching to an S3 Gateway VPC endpoint?
    options:
      - "The S3 storage charges for the 50 TB, since Gateway endpoints move objects into a cheaper per-GB storage tier automatically"
      - "The EC2 instance-hour charges for the ETL fleet, since endpoint-routed reads no longer keep the instances metered while transferring"
      - "The S3 request (GET) charges on those reads, which a Gateway endpoint waives because privately routed requests are not metered"
      - "The NAT Gateway per-GB data-processing charge on that 50 TB (~$0.045/GB, i.e., thousands of dollars/month) — Gateway endpoints are free"
    answer: 3
    explanation: |
      Routing S3 traffic through NAT incurs ~$0.045/GB processing; 50 TB ≈ 50,000 GB ×
      $0.045 ≈ $2,250/month that vanishes with a free Gateway endpoint. (A) storage is
      unchanged. (C) S3 GET request charges still apply. (B) instance hours are unrelated to
      the NAT path.
    ref: "concepts.md#nat-gateway-and-data-transfer-cost-traps"

  - id: aws-cost-optimization-scaling-056
    difficulty: advanced
    tags: [intelligent-tiering, small-objects]
    question: |
      A data lake stores a mix of large objects with unpredictable access AND huge numbers of
      objects smaller than 128 KB. What is the nuance when choosing S3 Intelligent-Tiering?
    options:
      - "Intelligent-Tiering waives every storage, monitoring, and per-object charge, so it is unconditionally free for objects of any size in the lake"
      - "Objects under 128 KB are always billed at frequent-access rates and are not monitored/auto-tiered, so Intelligent-Tiering saves nothing on those tiny objects (and adds a monitoring fee to eligible ones)"
      - "Intelligent-Tiering layers a Standard-IA-style per-GB retrieval fee on top of monitoring, so each read of a tiered object costs extra to fetch"
      - "Intelligent-Tiering stores all objects in a single Availability Zone, so it trades the usual multi-AZ durability for its lower monitoring price"
    answer: 1
    explanation: |
      Intelligent-Tiering doesn't tier or monitor sub-128 KB objects (they stay at
      frequent-access rates), so it won't help those tiny objects; it's ideal for larger
      objects with unknown access. (A) it has a per-object monitoring fee. (C) it has no
      retrieval fees — a key advantage. (D) it spans ≥3 AZs.
    ref: "concepts.md#s3-storage-classes-and-lifecycle-policies-for-cost"

  - id: aws-cost-optimization-scaling-057
    difficulty: advanced
    tags: [karpenter, eks, spot, scaling]
    question: |
      For an EKS cluster running many stateless, interruptible batch pods, which node-scaling
      approach best minimizes cost?
    options:
      - "Karpenter provisioning right-sized nodes, preferring Spot with instance-type diversification and consolidating underutilized nodes"
      - "A fixed set of large On-Demand nodes statically sized to the observed peak and left running at that count around the clock"
      - "The Kubernetes Horizontal Pod Autoscaler alone with no node autoscaler, trusting it to add cluster capacity as batch pods queue up"
      - "One giant On-Demand node dedicated per pod, each locked under a 3-year Reserved Instance to guarantee the node is always available"
    answer: 0
    explanation: |
      Karpenter picks the cheapest right-sized instance types, favors Spot with diversification
      for interruptible pods, and bin-packs/consolidates to remove waste. (B) fixed peak nodes
      waste money off-peak. (C) HPA scales pods but not nodes — pods go Pending without a node
      autoscaler. (D) one-node-per-pod on RIs is wasteful and inflexible.
    ref: "concepts.md#right-sizing-and-auto-scaling-to-match-demand"

  - id: aws-cost-optimization-scaling-058
    difficulty: advanced
    tags: [tagging, governance, enforcement]
    question: |
      Leadership wants guaranteed cost attribution across 40 teams, but engineers keep
      launching untagged resources. Which combination best enforces attribution?
    options:
      - "Publish a wiki page asking teams politely to tag resources, and trust each of the 40 teams to self-police compliance during their own sprint reviews"
      - "Turn off Cost Explorer for member accounts so the untagged-spend gaps stop showing up in dashboards and no longer alarm leadership"
      - "Use AWS Organizations Tag Policies (and SCPs) to require/standardize tags, activate cost allocation tags in Billing, and audit gaps with Tag Editor/Config rules"
      - "Rely solely on the Cost and Usage Report and let its per-line-item detail retroactively reconstruct owners for resources that launched with no tags"
    answer: 2
    explanation: |
      Enforcement needs Tag Policies/SCPs to standardize and require tags, activation of those
      tags for billing, and auditing (Tag Editor/Config) to find gaps. (A) is unenforced. (B)
      hides the problem. (D) the CUR only reports what's tagged — without enforcement, untagged
      spend stays unattributable.
    ref: "concepts.md#tagging-cost-allocation-and-finops"

  - id: aws-cost-optimization-scaling-059
    difficulty: advanced
    tags: [egress, architecture, judgment]
    question: |
      A partner integration currently pulls 200 TB/month of processed data OUT of your AWS
      account to their on-prem systems, dominating your bill via internet egress. Which idea
      most directly attacks the root cost driver?
    options:
      - "Move the source S3 bucket to Glacier Deep Archive, whose lower per-GB storage rate also proportionally cuts the per-GB egress price on the 200 TB pulled out"
      - "Enable S3 Transfer Acceleration on the bucket, so the edge-optimized upload path lowers the per-GB internet egress rate the partner is charged on the outbound pull"
      - "Upsize the EC2 instances that generate the data, so a faster origin pushes the 200 TB out more efficiently and thereby reduces the internet egress bill"
      - "Reduce what must leave AWS (aggregate/compress/filter server-side), and evaluate delivery paths with lower egress economics (e.g., CloudFront, or having the partner pull within AWS) rather than raw internet egress"
    answer: 3
    explanation: |
      The dominant cost is egress volume, so the leverage is reducing bytes that leave
      (compression/filtering/aggregation) and using cheaper delivery paths. (A) changes storage
      cost, not the 200 TB egress. (C) doesn't reduce egress. (B) Transfer Acceleration speeds
      transfers at EXTRA cost — it doesn't cut egress.
    ref: "concepts.md#pricing-dimensions-per-service-and-the-hidden-cost-of-data-transfer"

  - id: aws-cost-optimization-scaling-060
    difficulty: advanced
    tags: [finops, operating-model]
    question: |
      In the FinOps "Inform, Optimize, Operate" model, what does the OPERATE phase primarily
      add beyond one-time optimization?
    options:
      - "A single annual audit by the finance team that reconciles the year's spend and files a report, with no ongoing engineering involvement between audits"
      - "Making cost continuous and owned — baking cost signals into CI/CD, alerting, and architecture reviews so it stays optimized over time"
      - "Deleting all cost allocation tags once the initial optimization is done, so the monthly billing view is simpler and easier for finance to read"
      - "Buying the maximum possible Savings Plan commitment upfront regardless of actual usage, so future workloads are always fully covered by the discount"
    answer: 1
    explanation: |
      Operate embeds cost into everyday engineering (CI/CD, alerts, arch reviews) so
