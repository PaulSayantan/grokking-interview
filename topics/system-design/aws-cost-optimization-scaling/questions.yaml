    ref: "concepts.md#tagging-cost-allocation-and-finops"

  - id: aws-cost-optimization-scaling-061
    difficulty: expert
    tags: [crossover, estimation, judgment]
    question: |
      You must choose between (a) Lambda at 512 MB averaging 200 ms/request and (b) a
      Graviton Fargate service under a Savings Plan, for a workload growing from 2M req/day
      (bursty) toward 80M req/day (steady 24/7) over a year. What is the most defensible plan?
    options:
      - "Start on Lambda while volume is low/bursty (scale-to-zero wins), monitor duty cycle and unit cost, and migrate to Graviton Fargate + Savings Plan once sustained utilization crosses the point where always-on beats per-invocation"
      - "Commit to a 3-year Graviton Fargate Savings Plan now, sized to the projected 80M req/day steady state, to lock the lowest unit cost from day one"
      - "Stay on Lambda permanently even after the load becomes steady 24/7, because per-invocation serverless billing always undercuts an always-on fleet at any volume"
      - "Run both the Lambda and the Graviton Fargate stacks at full scale in parallel for the whole year, using each as a hot standby to hedge the crossover risk"
    answer: 0
    explanation: |
      Early, low/bursty volume favors scale-to-zero Lambda; as load becomes steady 24/7, the
      always-on Graviton fleet under a Savings Plan wins — migrate at the crossover, driven by
      measured duty cycle/unit cost. (B) committing before sustained load risks stranded
      commitment. (C) ignores the crossover at high steady RPS. (D) running both at full scale
      doubles cost.
    ref: "concepts.md#serverless-pay-per-use-versus-provisioned-economics-and-the-crossover-point"

  - id: aws-cost-optimization-scaling-062
    difficulty: expert
    tags: [multi-region, cost, availability, judgment]
    question: |
      A product currently runs multi-AZ in one Region. A VP wants active-active multi-Region
      "for resilience." From a cost/complexity trade-off view, when is this justified?
    options:
      - "Always — adding more Regions strictly improves availability and latency, so active-active multi-Region is the right default for any production product"
      - "Never — a single Availability Zone already provides enough facility-independence that multi-Region resilience is never a justifiable expense"
      - "Only when a single-Region-with-multi-AZ design genuinely cannot meet the resilience/latency requirement, because multi-Region can 2-3× cost and adds replication lag, split-brain, and failover complexity"
      - "Whenever the team wants broader exposure to more AWS services, since operating in extra Regions unlocks capabilities unavailable in a single Region"
    answer: 2
    explanation: |
      Multi-Region buys DR/global-latency but roughly 2-3× the cost plus replication lag,
      split-brain risk, and hard failover — reach for it only when multi-AZ truly can't meet
      the requirement (e.g., Region-level DR mandate, global low latency). (A) ignores cost/
      complexity. (B) single-AZ has no facility-failure resilience. (D) is not a valid driver.
    ref: "concepts.md#the-cost-performance-availability-and-operational-effort-trade-off-framework"

  - id: aws-cost-optimization-scaling-063
    difficulty: expert
    tags: [spot, savings-plans, interaction]
    question: |
      True or false and why: "Buying a large Compute Savings Plan makes running Spot Instances
      pointless because the Savings Plan already covers all compute."
    options:
      - "True — Savings Plans and Spot are mutually exclusive purchasing modes, and enrolling any account in a Compute Savings Plan disables its ability to launch Spot capacity"
      - "False — but only because Spot ends up more expensive than Savings-Plan-covered On-Demand once the reclamation overhead and retry cost are folded into its effective per-hour rate"
      - "True — every hour of Spot usage is drawn against and steadily exhausts the committed $/hour of the Savings Plan, so a large Plan leaves no room for Spot to add value"
      - "False — Savings Plans apply committed $/hour to the highest-rate eligible On-Demand usage; Spot is separately discounted spare capacity, so Spot workloads still cost less and don't consume the Plan's commitment"
    answer: 3
    explanation: |
      Savings Plans discount On-Demand usage up to the committed $/hour; Spot is a separate,
      even deeper discount on spare capacity and isn't covered/consumed by the Plan. So Spot
      for fault-tolerant work still saves money alongside a Savings Plan. (A), (C) are false.
      (B) reverses the economics — Spot is cheaper, not more expensive.
    ref: "concepts.md#purchasing-models-on-demand-reserved-savings-plans-and-spot"

  - id: aws-cost-optimization-scaling-064
    difficulty: expert
    tags: [dynamodb, on-demand, cold-start, launch]
    question: |
      A DynamoDB table in on-demand mode is expected to receive a massive instantaneous spike
      at a product launch (from near-idle). What limitation must you plan around?
    options:
      - "On-demand tables are capped at 400 KB of total stored data, so a launch spike that writes more than that ceiling is rejected until you switch modes"
      - "On-demand can throttle a huge instantaneous spike from a cold table because it ramps relative to prior peak; pre-warm the table (or use provisioned with pre-set high capacity) before launch"
      - "On-demand mode disables Global Secondary Indexes, so a launch that relies on GSI query paths must first be migrated to provisioned capacity"
      - "On-demand tables can never be switched to provisioned mode once created, locking you into per-request pricing through the entire launch spike"
    answer: 1
    explanation: |
      On-demand scales quickly but ramps relative to previous peak; a cold table hit by a
      sudden huge spike can throttle, so pre-warm (drive traffic up gradually) or provision
      high capacity for the launch. (A) 400 KB is a per-item limit. (C) is false. (D) is false
      — you can switch modes (with frequency limits).
    ref: "concepts.md#dynamodb-on-demand-versus-provisioned-capacity-cost"

  - id: aws-cost-optimization-scaling-065
    difficulty: expert
    tags: [caching, when-not-to, judgment]
    question: |
      For which scenario is adding a cache LEAST likely to reduce cost, and possibly pure
      overhead?
    options:
      - "A write-heavy, low-read-reuse workload where each item is read at most once (near-zero hit ratio) and data must be strongly consistent"
      - "A read-heavy product catalog with high key locality, where the same popular items are fetched over and over and tolerate slightly stale reads"
      - "A hot API endpoint serving the same top-100 responses to millions of users, where a tiny working set absorbs the overwhelming majority of traffic"
      - "Repeated identical DynamoDB reads of a small, rarely-changing set of items, where a high hit ratio would sharply cut consumed read-capacity units"
    answer: 0
    explanation: |
      With near-zero re-read (no hit ratio) and a strong-consistency requirement, a cache adds
      cost/complexity and staleness risk for no offload benefit. (B), (C), (D) all have high
      reuse/locality where a cache yields large downstream savings. Cache only where hit ratio
      is high and staleness is tolerable.
    ref: "concepts.md#caching-to-reduce-cost-and-load"

  - id: aws-cost-optimization-scaling-066
    difficulty: expert
    tags: [right-sizing, scale-in, failure-mode]
    question: |
      An aggressive scale-in policy trimmed the fleet to save money, but a sudden traffic
      burst then caused elevated errors for several minutes while new capacity booted. What
      does this illustrate, and what is the balanced fix?
    options:
      - "It proves auto scaling should be disabled entirely; the safe fix is to pin the group at fixed peak capacity so a burst never has to wait on new instances booting"
      - "It proves the instances are too small; the fix is to always run the largest available instance type so a single node can absorb any sudden burst on its own"
      - "It illustrates scaling lag (boot/warm-up time): keep a modest warm headroom or minimum capacity, use predictive scaling for known patterns, and tune scale-in cool-downs so cost savings don't blow the SLO during bursts"
      - "It illustrates a NAT Gateway data-processing bottleneck on the subnet, which the burst saturated; the fix is to provision a larger NAT Gateway with more bandwidth"
    answer: 2
    explanation: |
      Scale-in saves money but new capacity has boot/warm-up lag; the balance is warm headroom/
      minimum capacity plus predictive scaling and sane cool-downs — trading a little cost for
      burst safety. (A) fixed peak wastes money and overreacts. (B) bigger instances don't fix
      the lag pattern. (D) misdiagnoses the cause.
    ref: "concepts.md#right-sizing-and-auto-scaling-to-match-demand"

  - id: aws-cost-optimization-scaling-067
    difficulty: expert
    tags: [data-transfer, kinesis, architecture]
    question: |
      A streaming pipeline (producers → Kinesis/MSK → consumers) spread across 3 AZs shows
      large inter-AZ transfer costs, and the team wants to cut cost without losing throughput
      or resilience. Which reasoning is soundest?
    options:
      - "Collapse producers, brokers, and consumers into a single AZ so every hop becomes free intra-AZ traffic, treating the lost cross-AZ redundancy as an acceptable cost trade"
      - "Replace Kinesis/MSK with a single-AZ self-managed queue running on one large instance, since removing the managed multi-AZ tier eliminates the inter-AZ transfer entirely"
      - "Route all inter-broker and consumer stream traffic through a shared NAT Gateway, whose per-GB data-processing rate is lower than the cross-AZ transfer rate being paid today"
      - "Analyze the topology: brokers must stay multi-AZ for durability/resilience, but you can reduce cross-AZ hops where safe (co-locate high-volume consumers with their partitions/shards, batch/compress records) — accepting that some cross-AZ cost is the price of a resilient streaming tier"
    answer: 3
    explanation: |
      The durable streaming tier must remain multi-AZ; you cut cost by co-locating heavy
      consumers with their shards/partitions, batching/compressing, and accepting the residual
      cross-AZ cost as the price of resilience. (A) single-AZ kills durability. (C) NAT adds
      per-GB cost, not savings. (B) single-AZ single-instance destroys resilience and throughput.
    ref: "concepts.md#nat-gateway-and-data-transfer-cost-traps"

