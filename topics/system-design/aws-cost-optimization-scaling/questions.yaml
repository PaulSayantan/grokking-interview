      - "Favor managed services: the higher per-unit cost buys away patching, backups, failover, and scaling toil that a tiny team cannot afford to staff — operational effort is a real cost, and Well-Architected says stop doing undifferentiated heavy lifting"
      - "It makes no real difference for this team; the compute cost and the operational effort are independent concerns that shouldn't be weighed against each other"
      - "Always self-manage on EC2, because managed services like RDS, MSK, and ElastiCache cannot be configured for multi-AZ high availability the way a hand-built cluster can"
    answer: 1
    explanation: |
      For a tiny team, engineering time is the scarcest resource; managed services trade a
      compute premium for eliminated ops toil (patching/backup/failover/scaling), aligning with
