topic: "Enterprise & Application Architecture Patterns"
domain: system-design
topic_slug: dp-enterprise-application
version: 1
questions:
  - id: dp-enterprise-application-001
    difficulty: beginner
    tags: [domain-logic, transaction-script]
    question: |
      A small billing feature organizes each use case as a single procedure that
      reads input, runs a few branching rules, calls the database, and returns a
      result — with no rich object graph. Which pattern is this?
    options:
      - "Domain Model"
      - "Service Layer"
      - "Table Module"
      - "Transaction Script"
    answer: 3
    explanation: |
      Transaction Script organizes business logic as one procedure per
      request/use-case. It is simple to start with but duplicates logic and rots
      as complexity grows. A Domain Model would be a web of behaviour-rich objects.
    ref: "concepts.md#transaction-script"
  - id: dp-enterprise-application-002
    difficulty: intermediate
    tags: [domain-logic, domain-model, anemic]
    question: |
      A team built an object graph of Orders, Customers and Products, but every
      object is only getters/setters and ALL behaviour lives in service classes.
      What anti-pattern is this, and what is the problem with it?
    options:
      - "Anemic Domain Model — you pay the mapping cost of a Domain Model but get none of its benefits"
      - "Transaction Script — each use case is a standalone procedure that duplicates business logic"
      - "Table Module — one class handles all rows of a table via a shared record set"
      - "Active Record — each object maps to one row and knows how to persist itself"
    answer: 0
    explanation: |
      The Anemic Domain Model is the failure mode where the domain objects hold data
      but no behaviour (pushed into services). You incur the object/ORM mapping cost
      of a Domain Model while getting Transaction-Script-style procedural logic.
    ref: "concepts.md#domain-model"
  - id: dp-enterprise-application-003
    difficulty: intermediate
    tags: [domain-logic, table-module, record-set]
    question: |
      On a record-set-centric platform, a single OrderModule class handles the
      business logic for ALL rows of the Orders table (no object per row). Which
      pattern is this?
    options:
      - "Domain Model"
      - "Repository"
      - "Table Module"
      - "Row Data Gateway"
    answer: 2
    explanation: |
      Table Module is one class handling the logic for all rows of a table, backed
      by a Record Set. Unlike a Domain Model it has no per-instance identity —
      you pass an id into methods that operate on the record set.
    ref: "concepts.md#table-module"
  - id: dp-enterprise-application-004
    difficulty: intermediate
    tags: [service-layer, boundary, transactions]
    question: |
      Several clients (web UI, a batch job, a remote API) must all run "place order"
      with the same transaction boundary and security checks. Which pattern defines
      that coarse-grained application boundary?
    options:
      - "Remote Facade"
      - "Domain Service"
      - "Service Layer"
      - "Front Controller"
    answer: 2
    explanation: |
      A Service Layer defines an application's boundary as coarse-grained operations
      (use cases) that open transactions, enforce security, and orchestrate domain
      objects. The business rules themselves should still live in the Domain Model.
    ref: "concepts.md#service-layer"
  - id: dp-enterprise-application-005
    difficulty: advanced
    tags: [service-layer, domain-service, application-service]
    question: |
      Where should a cross-entity BUSINESS RULE (not orchestration) live — a funds
      transfer that debits one account and credits another?
    options:
      - "In the Service/Application Layer, because any rule spanning two entities belongs to orchestration"
      - "In a Front Controller that receives the request and applies the transfer rule before dispatching"
      - "In a DTO that carries both accounts and computes the debit/credit as it is serialized"
      - "In a Domain Service, with the debit/credit rules still on the Account entity"
    answer: 3
    explanation: |
      A Domain Service holds cross-entity domain logic that has no natural home on a
      single entity, while the debit/credit rules stay on Account. The Application/
      Service Layer handles use-case orchestration (transactions, security), not the
      rules. Putting all rules in the service layer creates an anemic domain.
    ref: "concepts.md#service-layer-vs-domain-model-vs-application-service"
  - id: dp-enterprise-application-006
    difficulty: beginner
    tags: [data-source, table-data-gateway]
    question: |
      One object holds all the SQL for a whole table and its finder methods return
      generic record sets (not domain objects). Which pattern is this?
    options:
      - "Row Data Gateway"
      - "Data Mapper"
      - "Table Data Gateway"
      - "Active Record"
    answer: 2
    explanation: |
      Table Data Gateway puts all the SQL for one table behind a single gateway whose
      methods return record sets. Row Data Gateway, by contrast, is one object per row.
    ref: "concepts.md#table-data-gateway"
  - id: dp-enterprise-application-007
    difficulty: intermediate
    tags: [data-source, row-data-gateway, active-record]
    question: |
      An object mirrors exactly one database row with insert()/update()/delete() but
      deliberately contains NO business logic. Which pattern is it, and what would it
      become if you added domain behaviour to it?
    options:
      - "Row Data Gateway; it would become an Active Record if you added domain logic"
      - "Active Record; it would become a Data Mapper if you added domain logic"
      - "Data Mapper; it would become a Repository if you added domain logic"
      - "Table Data Gateway; it would become a Table Module if you added domain logic"
    answer: 0
    explanation: |
      Row Data Gateway is a per-row object holding pure persistence and no domain
      logic. It has the same shape as Active Record; adding domain behaviour to it is
      exactly what turns it into an Active Record.
    ref: "concepts.md#row-data-gateway"
  - id: dp-enterprise-application-008
    difficulty: intermediate
    tags: [data-source, active-record]
    question: |
      In code you see `user = User.find(42); user.email = "x@y"; user.save()`, and the
      User class maps 1:1 to a table and carries both data and persistence. Which
      pattern is this?
    options:
      - "Data Mapper"
      - "Repository"
      - "Active Record"
      - "Unit of Work"
    answer: 2
    explanation: |
      Active Record is a domain object that wraps a single row and knows how to
      persist itself (save/find). It is fast for CRUD but couples the domain to the
      schema and is hard to unit-test without a database.
    ref: "concepts.md#active-record"
  - id: dp-enterprise-application-009
    difficulty: advanced
    tags: [data-source, active-record, data-mapper]
    question: |
      What is the core difference between Active Record and Data Mapper?
    options:
      - "Active Record returns generic record sets, while Data Mapper always returns fully hydrated domain objects"
      - "Active Record is only usable for many-to-many links, while Data Mapper is restricted to one-to-many relationships"
      - "Active Record's object persists itself (coupled to schema); Data Mapper uses a separate mapper so the domain object is persistence-ignorant"
      - "Active Record requires a full-blown ORM to function, whereas Data Mapper is always hand-written and never uses one"
    answer: 2
    explanation: |
      The canonical distinction: Active Record's object knows how to persist itself
      (tight coupling to the schema, hard to test without a DB), whereas Data Mapper
      keeps a separate mapper so the domain object has no persistence code and can
      evolve independently of the schema.
    ref: "concepts.md#active-record-vs-data-mapper-vs-repository"
  - id: dp-enterprise-application-010
    difficulty: intermediate
    tags: [data-source, data-mapper]
    question: |
      You want a Domain Model whose objects have ZERO database code so the domain and
      schema can evolve independently and the domain is trivially unit-testable. Which
      pattern moves data between objects and the DB without either knowing?
    options:
      - "Active Record"
      - "Table Module"
      - "Data Mapper"
      - "Transaction Script"
    answer: 2
    explanation: |
      Data Mapper is a separate mapping layer that moves data between persistence-
      ignorant domain objects and the database. It is the most decoupled and testable
      approach and is usually delivered by an ORM.
    ref: "concepts.md#data-mapper"
  - id: dp-enterprise-application-011
    difficulty: advanced
    tags: [data-source, repository, dao]
    question: |
      What most precisely distinguishes a Repository from a DAO?
    options:
      - "A Repository is faster because it always caches aggregates in memory, while a DAO bypasses caching and hits the database on every call"
      - "A Repository interface exposes only read/query methods, whereas a DAO is the only one of the two permitted to perform writes"
      - "A Repository is a domain-collection abstraction over aggregates (ubiquitous language); a DAO is a persistence-technology/data-source abstraction, typically per-table CRUD"
      - "A DAO is one of the 23 GoF patterns, while a Repository comes from the Gang of Four's later structural-patterns catalog"
    answer: 2
    explanation: |
      A Repository presents a collection-like, domain-facing abstraction over
      aggregates and speaks the ubiquitous language; a DAO abstracts a data source /
      persistence technology and is usually per-table CRUD. DAO is a Core J2EE pattern,
      not GoF. A Repository that is just save/find per table has degenerated into a DAO.
    ref: "concepts.md#repository-vs-dao"
  - id: dp-enterprise-application-012
    difficulty: intermediate
    tags: [data-source, repository, specification]
    question: |
      Domain code calls `orderRepository.matching(new OverdueSpecification())` and gets
      fully-formed Order objects back, with no SQL visible. Which pattern is the
      repository providing?
    options:
      - "A collection-like interface for a type of aggregate, hiding persistence mechanics"
      - "A per-row gateway that returns raw record sets for the data grid to iterate over"
      - "A remote facade that batches fine-grained calls to reduce network round-trips"
      - "A unit of work that tracks dirty objects and flushes them atomically on commit"
    answer: 0
    explanation: |
      Repository mediates between the domain and mapping layers behind a collection-
      like interface for domain objects (aggregates). It lets domain code query in
      domain terms (often via a Specification) without touching SQL.
    ref: "concepts.md#repository"
  - id: dp-enterprise-application-013
    difficulty: intermediate
    tags: [data-source, dao, origin]
    question: |
      Which statement about the Data Access Object (DAO) pattern is correct?
    options:
      - "It is one of the original 23 Gang of Four design patterns from the structural category"
      - "It originates in Fowler's PoEAA as an object-relational structural pattern"
      - "It is a Core J2EE pattern that hides all access to a data source behind an interface"
      - "It is a DDD tactical building block that enforces aggregate invariants"
    answer: 2
    explanation: |
      DAO comes from Sun's Core J2EE Patterns (not GoF, not PoEAA, not DDD). It
      encapsulates all access to a data source behind an interface so the persistence
      technology can change without affecting callers.
    ref: "concepts.md#dao-data-access-object"
  - id: dp-enterprise-application-014
    difficulty: intermediate
    tags: [orm-behavioral, unit-of-work]
    question: |
      You add one object, modify another, and delete a third during one business
      transaction, then call commit() once to flush all three atomically in the right
      order with version checks. Which pattern coordinates this?
    options:
      - "Identity Map"
      - "Query Object"
      - "Lazy Load"
      - "Unit of Work"
    answer: 3
    explanation: |
      Unit of Work tracks the objects touched in a business transaction (new/dirty/
      removed sets) and coordinates a single, correctly-ordered atomic write with
      optimistic-lock checks. JPA's EntityManager is a Unit of Work.
    ref: "concepts.md#unit-of-work"
  - id: dp-enterprise-application-015
    difficulty: advanced
    tags: [orm-behavioral, identity-map]
    question: |
      Loading the same row twice in one session yielded two different in-memory objects,
      so an edit to one was invisible to the other. Which pattern prevents this by
      guaranteeing exactly one object per identity within the session?
    options:
      - "Lazy Load"
      - "Coarse-Grained Lock"
      - "Identity Map"
      - "Serialized LOB"
    answer: 2
    explanation: |
      Identity Map keeps a map of loaded objects keyed by identity so each row is
      loaded only once per session — a correctness/identity guarantee, not primarily a
      performance cache. It avoids double-load and inconsistent in-memory updates.
    ref: "concepts.md#identity-map"
  - id: dp-enterprise-application-016
    difficulty: advanced
    tags: [orm-behavioral, lazy-load, n-plus-1]
    question: |
      Iterating over 100 customers and touching each customer.getOrders() issued 101
      SQL queries. What is this problem, and which pattern's misuse caused it?
    options:
      - "The N+1 select problem, caused by Lazy Load over a collection"
      - "Cache stampede, caused by Identity Map"
      - "Lock contention, caused by Coarse-Grained Lock"
      - "Impedance mismatch, caused by Serialized LOB"
    answer: 0
    explanation: |
      Lazy Load defers fetching until first access; iterating over N parents each
      lazily loading a collection causes 1 + N queries (the N+1 problem). Fix with
      eager loading / JOIN FETCH or batch loading. Lazy Load also breaks across
      session boundaries.
    ref: "concepts.md#lazy-load"
  - id: dp-enterprise-application-017
    difficulty: beginner
    tags: [orm-structural, identity-field]
    question: |
      To keep an in-memory object and its database row in correspondence, you store the
      row's primary key inside the object. Which pattern is this?
    options:
      - "Foreign Key Mapping"
      - "Embedded Value"
      - "Identity Map"
      - "Identity Field"
    answer: 3
    explanation: |
      Identity Field stores the database primary key in the object so the mapper can
      match object to row. Keys can be surrogate (meaningless) or natural; surrogate
      keys avoid churn when business attributes change.
    ref: "concepts.md#identity-field"
  - id: dp-enterprise-application-018
    difficulty: intermediate
    tags: [orm-structural, foreign-key-mapping]
    question: |
      An object reference `order.customer` is persisted by storing the customer's id in
      a customer_id column on the orders table. Which pattern is this?
    options:
      - "Association Table Mapping"
      - "Embedded Value"
      - "Foreign Key Mapping"
      - "Dependent Mapping"
    answer: 2
    explanation: |
      Foreign Key Mapping maps a single-valued object reference to a foreign-key column.
      Many-to-many associations, which cannot use a single FK, require Association Table
      Mapping instead.
    ref: "concepts.md#foreign-key-mapping"
  - id: dp-enterprise-application-019
    difficulty: intermediate
    tags: [orm-structural, association-table-mapping]
    question: |
      Students and Courses have a many-to-many relationship. Which mapping pattern
      correctly represents it in a relational schema?
    options:
      - "Foreign Key Mapping — put a course_id on the student row"
      - "Association Table Mapping — a link table with student_id and course_id"
      - "Embedded Value — embed courses as columns on the student"
      - "Serialized LOB — store the course list as a blob on the student"
    answer: 1
    explanation: |
      A many-to-many association cannot be stored as a single FK on either side.
      Association Table Mapping uses a separate link table with one row per pair
      (student_id, course_id).
    ref: "concepts.md#association-table-mapping"
  - id: dp-enterprise-application-020
    difficulty: advanced
    tags: [orm-structural, dependent-mapping, aggregate]
    question: |
      LineItems have no independent identity or lifecycle — they exist only within an
      Order and are never queried alone. Which pattern lets the Order's mapper handle
      their persistence, and what DDD concept does it align with?
    options:
      - "Dependent Mapping; it aligns with the DDD Aggregate"
      - "Association Table Mapping; it aligns with the DDD Entity"
      - "Serialized LOB; it aligns with the DDD Value Object"
      - "Identity Field; it aligns with the DDD Repository"
    answer: 0
    explanation: |
      Dependent Mapping has the owner's mapper manage a child that has no independent
      identity; there is no separate child mapper and the child can't be loaded alone.
      This maps neatly onto a DDD Aggregate (owner controls the child's lifecycle).
    ref: "concepts.md#dependent-mapping"
  - id: dp-enterprise-application-021
    difficulty: advanced
    tags: [orm-structural, embedded-value, serialized-lob]
    question: |
      A small Address value object should be stored as street/city/zip COLUMNS on the
      owner's table so you can still query by city. Which pattern fits, and which one
      would you AVOID if you need to query the inner fields?
    options:
      - "Use Serialized LOB; avoid Embedded Value (its blob stays queryable)"
      - "Use Dependent Mapping; avoid Identity Field (Address needs a table)"
      - "Use Association Table Mapping; avoid Foreign Key Mapping"
      - "Use Embedded Value; avoid Serialized LOB (its blob is opaque to SQL)"
    answer: 3
    explanation: |
      Embedded Value maps the value object's fields into the owner's columns, keeping
      each field queryable. Serialized LOB stores the whole graph as one opaque blob,
      so you cannot easily query or index its inner fields — the wrong choice here.
    ref: "concepts.md#embedded-value"
  - id: dp-enterprise-application-022
    difficulty: intermediate
    tags: [orm-structural, serialized-lob]
    question: |
      A rarely-queried category tree is stored as a single JSON CLOB column. Which
      pattern is this, and what is its main drawback?
    options:
      - "Embedded Value; each tree node explodes into far too many owner columns"
      - "Serialized LOB; the blob is opaque to SQL and causes schema-migration pain"
      - "Association Table Mapping; it needs a self-referencing parent-child link table"
      - "Metadata Mapping; the mapping annotations make the tree hard to debug at runtime"
    answer: 1
    explanation: |
      Serialized LOB saves a graph of objects as one serialized blob/CLOB. It is simple
      for self-contained, rarely-queried graphs but is opaque to SQL (can't filter/index
      inner fields) and creates versioning/migration pain as the serialized shape evolves.
    ref: "concepts.md#serialized-lob"
  - id: dp-enterprise-application-023
    difficulty: advanced
    tags: [orm-structural, inheritance-mapping]
    question: |
      You map a class hierarchy to ONE table with a discriminator column, leaving
      subclass-specific columns NULL for other types. Which inheritance-mapping strategy
      is this, and what is its main downside?
    options:
      - "Class Table Inheritance; one shared row plus a per-subclass table joined on every load"
      - "Concrete Table Inheritance; a separate full table per concrete subclass with no discriminator"
      - "Single Table Inheritance; it wastes space with many NULLs and weakens NOT-NULL constraints"
      - "Serialized LOB; each subclass instance is stored as one opaque blob column keyed by type"
    answer: 2
    explanation: |
      Single Table Inheritance uses one table for the whole hierarchy with a type
      discriminator. It avoids joins and supports easy polymorphic queries but wastes
      space (many NULLs), makes the table wide, and weakens NOT-NULL constraints.
    ref: "concepts.md#inheritance-mappers-single-table-class-table-concrete-table"
  - id: dp-enterprise-application-024
    difficulty: advanced
    tags: [orm-structural, inheritance-mapping]
    question: |
      Which inheritance-mapping strategy makes a polymorphic query across the whole
      hierarchy hardest (requiring a UNION of tables) because there is no shared base
      table?
    options:
      - "Concrete Table Inheritance (one table per concrete class)"
      - "Single Table Inheritance (a full UNION across every subclass row)"
      - "Class Table Inheritance (each subclass table sits alone with no base)"
      - "Embedded Value (subclass fields inlined as columns with no base table)"
    answer: 0
    explanation: |
      Concrete Table Inheritance stores one table per concrete class with all inherited
      columns and no shared base table, so a query across the whole hierarchy must UNION
      the tables. It avoids joins but duplicates columns and complicates polymorphic
      queries and key management.
    ref: "concepts.md#inheritance-mappers-single-table-class-table-concrete-table"
  - id: dp-enterprise-application-025
    difficulty: intermediate
    tags: [metadata-mapping, orm]
    question: |
      JPA annotations like @Entity, @Column and @ManyToOne describe how classes map to
      tables, and the ORM engine reads them at runtime to build queries and hydrate
      objects. Which pattern is this?
    options:
      - "Query Object"
      - "Separated Interface"
      - "Data Mapper"
      - "Metadata Mapping"
    answer: 3
    explanation: |
      Metadata Mapping holds O/R mapping details as metadata (annotations/config/
      conventions) that a generic engine interprets, instead of hand-written mapper code.
      It powers mainstream ORMs but adds "magic"/indirection that can be harder to debug.
    ref: "concepts.md#metadata-mapping"
  - id: dp-enterprise-application-026
    difficulty: advanced
    tags: [query-object, specification]
    question: |
      Using the JPA Criteria API or QueryDSL you build a query as an object in domain
      terms and the framework translates it to SQL. Which pattern is this, and how does
      it differ from a Specification?
    options:
      - "Query Object; a Specification is a composable in-memory business predicate (isSatisfiedBy), while a Query Object represents a database query"
      - "Specification; a Query Object is only ever used to hold form-input validation rules"
      - "Data Mapper; a Specification is the layer that maps domain objects onto database rows"
      - "Metadata Mapping; a Specification is the annotation set the ORM reads to build queries"
    answer: 0
    explanation: |
      A Query Object represents a database query built in domain terms and translated to
      SQL. A Specification encapsulates a composable boolean business rule that can run
      in memory (isSatisfiedBy) and be translated into a Query Object for DB execution.
    ref: "concepts.md#query-object"
  - id: dp-enterprise-application-027
    difficulty: beginner
    tags: [ddd, value-object]
    question: |
      Money(10,"USD") is immutable, compared by its attribute values, and "adding" to it
      returns a new instance. Which DDD building block is this?
    options:
      - "Entity"
      - "Value Object"
      - "Aggregate Root"
      - "Data Transfer Object"
    answer: 1
    explanation: |
      A Value Object has no identity, is immutable, and is compared by value; "mutating"
      returns a new instance. Money is the canonical example. An Entity, by contrast, is
      compared by identity and is mutable over its lifecycle.
    ref: "concepts.md#value-object"
  - id: dp-enterprise-application-028
    difficulty: intermediate
    tags: [ddd, entity, value-object]
    question: |
      Customer #42 is "the same customer" whether named Sam today or Samuel tomorrow;
      equality is by id, not attributes. Which building block is this, and how does it
      differ from a Value Object?
    options:
      - "Entity — equality by identity (a tracked thing); a Value Object is equality by value (interchangeable)"
      - "Value Object — equality by value; an Entity is equality by attributes"
      - "DTO — a flat carrier; an Entity has behaviour"
      - "Aggregate Root — a consistency boundary; a Value Object is a lock"
    answer: 0
    explanation: |
      An Entity has a distinct thread-of-continuity identity, so equality is by id and it
      persists through attribute changes. A Value Object is compared by value and is
      interchangeable/immutable.
    ref: "concepts.md#entity"
  - id: dp-enterprise-application-029
    difficulty: advanced
    tags: [ddd, aggregate, consistency-boundary]
    question: |
      You never modify LineItems directly — all changes go through order.addLine(...),
      which enforces the order's invariants, and other aggregates reference the order
      only by id. Which pattern is this, and what does it define?
    options:
      - "Repository; it defines a data-access boundary"
      - "Unit of Work; it defines a change-tracking boundary"
      - "Service Layer; it defines a use-case boundary"
      - "Aggregate & Aggregate Root; it defines a consistency/transaction boundary accessed through one root"
    answer: 3
    explanation: |
      An Aggregate is a cluster of entities/VOs treated as one consistency unit,
      accessed only through its root, which enforces all invariants. It is the unit of
      transactional consistency; cross-aggregate references use identity, and boundary
      sizing trades contention against invariant enforcement.
    ref: "concepts.md#aggregate--aggregate-root"
  - id: dp-enterprise-application-030
    difficulty: intermediate
    tags: [ddd, domain-service, anemic]
    question: |
      What is the main risk of overusing Domain Services?
    options:
      - "They make every query slower by forcing extra cross-aggregate joins at read time"
      - "They drain behaviour out of entities and lead to an Anemic Domain Model"
      - "They force the persistence layer to fall back on Serialized LOB storage everywhere"
      - "They silently break the Identity Map's one-object-per-row correctness guarantee"
    answer: 1
    explanation: |
      A Domain Service is for stateless domain logic that has no natural home on a single
      entity/VO. Overusing them pulls behaviour out of entities, hollowing the domain
      into an Anemic Domain Model. Use them only when the operation genuinely spans
      objects.
    ref: "concepts.md#domain-service"
  - id: dp-enterprise-application-031
    difficulty: intermediate
    tags: [ddd, factory, creation]
    question: |
      Creating an Order aggregate requires wiring several collaborators and enforcing
      invariants so it is valid from birth. Which pattern encapsulates that complex
      creation/reconstitution?
    options:
      - "Factory"
      - "Repository"
      - "Assembler"
      - "Layer Supertype"
    answer: 0
    explanation: |
      A Factory (in the DDD sense) encapsulates complex creation and reconstitution of
      aggregates so every object is born valid, hiding construction detail. The GoF
      Abstract Factory/Builder (families of products, step-by-step build) are covered in
      the GoF topics.
    ref: "concepts.md#factory"
  - id: dp-enterprise-application-032
    difficulty: advanced
    tags: [ddd, domain-event, command]
    question: |
      What best distinguishes a Domain Event from a Command?
    options:
      - "A Command is an immutable record of the past, while a Domain Event is a mutable object edited after it is published"
      - "A Domain Event is an imperative request that may be rejected, while a Command is an immutable past fact that already occurred"
      - "A Domain Event is an immutable fact that already happened (can't be rejected); a Command is an imperative request to do something (can be rejected)"
      - "They are exactly the same construct under two interchangeable names, differing only in the team's vocabulary"
    answer: 2
    explanation: |
      A Domain Event captures something that already happened as an immutable object
      (OrderPlaced) — it cannot be rejected. A Command is an imperative request to do
      something and may be rejected. Event-driven infrastructure is covered in the
      sibling distributed/cloud topics.
    ref: "concepts.md#domain-event"
  - id: dp-enterprise-application-033
    difficulty: advanced
    tags: [ddd, specification]
    question: |
      A "customer is delinquent" rule is needed for validation, for selecting records,
      AND for building queries — and you want to compose it with and/or/not. Which
      pattern encapsulates it as a reusable, combinable predicate?
    options:
      - "Query Object"
      - "Domain Event"
      - "Strategy"
      - "Specification"
    answer: 3
    explanation: |
      Specification encapsulates a business rule as a reusable, combinable object
      (isSatisfiedBy, and/or/not). It centralizes the rule so it doesn't drift across
      validation, selection, and construction. A Query Object represents a DB query;
      Strategy swaps an algorithm rather than a boolean rule.
    ref: "concepts.md#specification"
  - id: dp-enterprise-application-034
    difficulty: intermediate
    tags: [distribution, dto, round-trips]
    question: |
      An API returns OrderSummaryDto{orderId, customerName, total, lineCount} — a flat,
      behaviour-less object carrying just what one call needs — so the client makes one
      round-trip instead of walking a remote object graph. Which pattern is this?
    options:
      - "Value Object"
      - "Data Transfer Object (DTO)"
      - "Remote Facade"
      - "Entity"
    answer: 1
    explanation: |
      A DTO is a flat, behaviour-less object that carries data across a process/tier
      boundary in one call to cut round-trips. It has no domain behaviour or invariants,
      unlike a Value Object or Entity.
    ref: "concepts.md#data-transfer-object-dto"
  - id: dp-enterprise-application-035
    difficulty: advanced
    tags: [distribution, dto, value-object, entity]
    question: |
      Which correctly contrasts a DTO, a Value Object, and an Entity?
    options:
      - "All three are immutable and compared by value, differing only in which layer they happen to live in"
      - "Entity = identity + lifecycle; Value Object = no identity, immutable, behaviour-rich (value equality); DTO = no identity, no behaviour, a flat cross-boundary carrier"
      - "DTO = identity and lifecycle; Value Object = a tracked lifecycle; Entity = a flat behaviour-less cross-boundary carrier"
      - "A DTO is just a Value Object that lives in the domain layer and carries the same invariants"
    answer: 1
    explanation: |
      An Entity has identity and a lifecycle (equality by id). A Value Object has no
      identity, is immutable, and is behaviour-rich (equality by value). A DTO has no
      identity and no behaviour — it is a dumb, flat carrier shaped for crossing a
      boundary, not a domain concept.
    ref: "concepts.md#dto-vs-value-object-vs-entity"
  - id: dp-enterprise-application-036
    difficulty: intermediate
    tags: [distribution, assembler, mapper]
    question: |
      To avoid hand-copying fields across controllers, one object owns the two-way
      translation between Order domain objects and OrderDto (think MapStruct/AutoMapper).
      Which pattern is this, and how does it differ from a Data Mapper?
    options:
      - "Assembler; it maps object-to-DTO, whereas a Data Mapper maps object-to-database-row"
      - "Data Mapper; it maps object-to-row, whereas an Assembler maps row-to-column"
      - "Remote Facade; it reduces round-trips, whereas a Data Mapper caches"
      - "Repository; it stores aggregates, whereas a Data Mapper stores DTOs"
    answer: 0
    explanation: |
      An Assembler (DTO Assembler/Mapper) centralizes translation between domain objects
      and DTOs. A Data Mapper translates between domain objects and database rows.
      MapStruct/AutoMapper are real-world assemblers.
    ref: "concepts.md#assembler--mapper-dto-assembler"
  - id: dp-enterprise-application-037
    difficulty: advanced
    tags: [distribution, remote-facade, service-layer]
    question: |
      A remote client kept making a dozen fine-grained getter calls over the network.
      You add getOrderDetails(id) that gathers everything server-side and returns one
      DTO. Which pattern is this, and how does it differ from a Service Layer?
    options:
      - "Remote Facade; it exists to cut network round-trips (chattiness), while a Service Layer defines a transaction/use-case boundary even in-process"
      - "Service Layer; it exists purely to hold the business rules, while a Remote Facade is where all transaction and locking logic must live"
      - "Gateway; it wraps an external third-party system, while a Service Layer merely opens and closes the database connection per call"
      - "Front Controller; it dispatches every incoming request, while a Service Layer is responsible for rendering the final view templates"
    answer: 0
    explanation: |
      A Remote Facade is a coarse-grained facade over fine-grained objects purely to
      reduce network round-trips, and it holds no business logic. A Service Layer defines
      an application/transaction boundary even in-process (and may itself be exposed via a
      Remote Facade).
    ref: "concepts.md#remote-facade"
  - id: dp-enterprise-application-038
    difficulty: beginner
    tags: [presentation, mvc]
    question: |
      In a web framework a Controller handles the request, updates the Model (domain +
      logic), then selects a View to render. Which pattern is this?
    options:
      - "Model-View-Presenter"
      - "Model-View-ViewModel"
      - "Model-View-Controller"
      - "Model-View-Update"
    answer: 2
    explanation: |
      Model-View-Controller separates the domain/model, the view (rendering), and the
      controller (input handling / view selection). "MVC" is heavily overloaded — the web
      per-request variant differs from classic Smalltalk MVC's observer-based model.
    ref: "concepts.md#model-view-controller-mvc"
  - id: dp-enterprise-application-039
    difficulty: advanced
    tags: [presentation, mvp, passive-view]
    question: |
      A Presenter reads inputs from a dumb View interface, runs presentation logic, and
      calls back like view.showError(...) — the view has no direct model access. This
      MVP variant, where the view is completely dumb, is called:
    options:
      - "Supervising Controller"
      - "Two-Step View"
      - "Front Controller"
      - "Passive View"
    answer: 3
    explanation: |
      MVP has two variants: Passive View (the view is completely dumb; the presenter sets
      every value and reads every input — maximum testability) and Supervising Controller
      (the view does simple binding itself, presenter handles complex logic).
    ref: "concepts.md#model-view-presenter-mvp"
  - id: dp-enterprise-application-040
    difficulty: advanced
    tags: [presentation, mvvm, data-binding]
    question: |
      A ViewModel exposes bindable properties and commands, and the View synchronizes
      with them automatically via two-way data binding (WPF/XAML, Vue). Which pattern is
      this, and what is Fowler's framework-agnostic name for it?
    options:
      - "MVP; Fowler calls it Passive View"
      - "MVU; Fowler calls it The Elm Architecture"
      - "MVVM; Fowler calls it Presentation Model"
      - "MVC; Fowler calls it Front Controller"
    answer: 2
    explanation: |
      Model-View-ViewModel exposes bindable state/commands that the view syncs via data
      binding. Fowler's framework-agnostic name for the same idea is Presentation Model.
      MVVM's costs are needing a binding framework and ViewModel bloat.
    ref: "concepts.md#model-view-viewmodel-mvvm--presentation-model"
  - id: dp-enterprise-application-041
    difficulty: advanced
    tags: [presentation, mvu, elm]
    question: |
      Redux, Elm, and SwiftUI use a strictly unidirectional loop over immutable state:
      state -> view -> message -> update -> new state (no two-way binding, no shared
      mutable state). Which pattern is this?
    options:
      - "Model-View-ViewModel (the two-way binding loop popularized by Redux)"
      - "Model-View-Update (The Elm Architecture)"
      - "Model-View-Presenter (the passive-view loop over immutable state)"
      - "Application Controller (the unidirectional state-reducer used by SwiftUI)"
    answer: 1
    explanation: |
      Model-View-Update (MVU / The Elm Architecture) uses a unidirectional loop over a
      single immutable state, rendered by a pure view that emits messages consumed by a
      pure update function returning new state. It is predictable/debuggable but verbose
      for large state.
    ref: "concepts.md#model-view-update-mvu--the-elm-architecture"
  - id: dp-enterprise-application-042
    difficulty: advanced
    tags: [presentation, mvc, mvp, mvvm, mvu]
    question: |
      Which correctly summarizes the mechanic that most distinguishes MVVM from MVU?
    options:
      - "MVVM uses two-way data binding (view <-> view-model); MVU uses a unidirectional loop over immutable state"
      - "MVVM enforces a unidirectional loop over immutable state, whereas MVU relies on two-way binding to a mutable view-model"
      - "MVVM discards the view entirely and binds straight to the model, whereas MVU discards the model and keeps only a view"
      - "MVVM can only run on the server behind a template engine, whereas MVU can only run inside a client-side browser runtime"
    answer: 0
    explanation: |
      MVVM relies on two-way data binding between the view and a mutable view-model, while
      MVU enforces a unidirectional loop over a single immutable state (state -> view ->
      message -> update -> new state). The progression MVC -> MVP -> MVVM -> MVU trades
      mutable two-way sync for immutable one-way flow.
    ref: "concepts.md#mvc-vs-mvp-vs-mvvm-vs-mvu"
  - id: dp-enterprise-application-043
    difficulty: intermediate
    tags: [presentation, front-controller, page-controller]
    question: |
      All web requests funnel through a single handler (Spring's DispatcherServlet) that
      does auth/logging, then dispatches to a command. Which pattern is this, and what is
      the alternative that uses one controller per page?
    options:
      - "Page Controller; the alternative is Front Controller"
      - "Template View; the alternative is Transform View"
      - "Application Controller; the alternative is Two-Step View"
      - "Front Controller; the alternative is Page Controller"
    answer: 3
    explanation: |
      Front Controller funnels all requests through a single entry point that handles
      cross-cutting concerns then dispatches. Page Controller instead uses one controller
      per page/action, which duplicates cross-cutting logic across pages.
    ref: "concepts.md#front-controller"
  - id: dp-enterprise-application-044
    difficulty: intermediate
    tags: [presentation, page-controller]
    question: |
      On a small site, each page (/order/new, /order/confirm) has its own dedicated
      controller handling that page's request. Which pattern is this, and what is its
      main downside?
    options:
      - "Front Controller; every request funnels through one shared handler that becomes a single choke point"
      - "Page Controller; cross-cutting logic (auth, setup) gets duplicated across pages"
      - "Application Controller; it centralizes screen-flow navigation as an explicit state machine per page"
      - "Transform View; it renders each page element-by-element and struggles with complex visual layouts"
    answer: 1
    explanation: |
      Page Controller uses one controller object per page/action — simple and self-
      contained, but it duplicates cross-cutting concerns (auth, common setup) across
      pages, which is exactly what a Front Controller centralizes.
    ref: "concepts.md#page-controller"
  - id: dp-enterprise-application-045
    difficulty: advanced
    tags: [presentation, application-controller, flow]
    question: |
      A multi-step checkout wizard needs centralized "which screen comes next?" logic
      (cart -> address -> payment-or-saved-card -> review) modelled as a state machine.
      Which pattern owns that navigation/flow?
    options:
      - "Front Controller (the single dispatch entry point)"
      - "Application Controller"
      - "Page Controller (one controller object per wizard step)"
      - "Template View (markup-with-holes driving the flow)"
    answer: 1
    explanation: |
      Application Controller centralizes screen navigation and application flow (what
      screen/logic comes next), often as an explicit state machine. It is worth the extra
      abstraction only for complex flows/wizards. A Front Controller merely dispatches a
      request; the Application Controller decides what happens next.
    ref: "concepts.md#application-controller"
  - id: dp-enterprise-application-046
    difficulty: intermediate
    tags: [presentation, template-view, transform-view]
    question: |
      One rendering approach embeds markers into HTML markup (JSP/Thymeleaf/Handlebars);
      another walks the domain data element-by-element producing output (classically
      XSLT). Which names match?
    options:
      - "Markers-in-markup = Transform View; element-by-element = Template View"
      - "Markers-in-markup = Front Controller; element-by-element = Page Controller"
      - "Both are Two-Step View, which first builds a logical page and then renders it to markup"
      - "Markers-in-markup = Template View; element-by-element = Transform View"
    answer: 3
    explanation: |
      Template View renders by embedding markers in the page markup (markup-with-holes).
      Transform View transforms domain data into output element-by-element (e.g. XSLT).
      Template View risks logic creep into templates; Transform View is harder for complex
      visual layouts.
    ref: "concepts.md#template-view"
  - id: dp-enterprise-application-047
    difficulty: advanced
    tags: [presentation, two-step-view]
    question: |
      To render many pages with a consistent look and to multiple formats (HTML + PDF),
      you first build a format-agnostic logical page, then render it to a concrete format.
      Which pattern is this?
    options:
      - "Template View"
      - "Transform View"
      - "Two-Step View"
      - "Application Controller"
    answer: 2
    explanation: |
      Two-Step View builds a logical presentation structure in step one (format-agnostic),
      then renders it to a concrete format in step two — so a site-wide look change or a
      new output format touches only step two. It is overkill for a single-format site.
    ref: "concepts.md#two-step-view"
  - id: dp-enterprise-application-048
    difficulty: intermediate
    tags: [base, gateway, facade, adapter]
    question: |
      You wrap a verbose third-party payment SDK behind your own clean charge(card,
      amount) interface that you can also stub in tests. Which pattern is this, and how
      does it differ from a GoF Facade?
    options:
      - "Gateway; it wraps an EXTERNAL/foreign system with an interface you define, whereas a Facade simplifies your OWN subsystem"
      - "Facade; it wraps an EXTERNAL/foreign system with an interface you define, whereas a Gateway only simplifies your OWN subsystem"
      - "Adapter; it converts one existing interface into a different expected one, which is exactly and only what a Gateway does"
      - "Mapper; it mediates invisibly between two mutually-unaware subsystems, which is precisely the role a Gateway plays too"
    answer: 0
    explanation: |
      A Gateway wraps an external/foreign system behind a domain-friendly interface you
      define, and is a natural stub point for tests. A GoF Facade simplifies your own
      subsystem's existing interface. Adapter converts an existing interface's shape;
      Mapper mediates between two mutually-unaware subsystems.
    ref: "concepts.md#gateway"
  - id: dp-enterprise-application-049
    difficulty: advanced
    tags: [base, mapper, gateway]
    question: |
      Which statement best captures the difference between a Mapper and a Gateway?
    options:
      - "A Mapper is a one-sided client-facing wrapper the caller depends on directly, while a Gateway sits invisibly between two mutually-unaware subsystems"
      - "A Mapper can only translate between rows in relational databases, while a Gateway can only be used to wrap asynchronous message queues"
      - "They are identical constructs and the two names are fully interchangeable in every enterprise-application context"
      - "A Gateway is a client-facing wrapper the caller depends on; a Mapper sits between two subsystems that are both unaware of it"
    answer: 3
    explanation: |
      A Gateway is a one-sided, client-facing wrapper the caller knows about. A Mapper is
      a two-sided mediator between two subsystems that are both unaware of it (Data Mapper
      between domain and DB is the canonical specialization).
    ref: "concepts.md#mapper"
  - id: dp-enterprise-application-050
    difficulty: intermediate
    tags: [base, layer-supertype]
    question: |
      Every entity extends an AbstractEntity that provides id, equals/hashCode-by-id, and
      createdAt, so shared features aren't copied everywhere. Which pattern is this?
    options:
      - "Separated Interface"
      - "Layer Supertype"
      - "Registry"
      - "Plugin"
    answer: 1
    explanation: |
      Layer Supertype is a common superclass for all types in a layer that holds shared
      features. Its downside is inheritance coupling (everything binds to the base, and
      single-inheritance languages "spend" their base class).
    ref: "concepts.md#layer-supertype"
  - id: dp-enterprise-application-051
    difficulty: advanced
    tags: [base, separated-interface, dependency-inversion]
    question: |
      The domain package declares `interface PaymentGateway`, and an infrastructure
      package provides StripePaymentGateway, so the domain never imports Stripe. Which
      pattern is this, and what principle/architecture does it underpin?
    options:
      - "Registry; it underpins the Singleton pattern by providing one global lookup point per service"
      - "Plugin; it underpins Metadata Mapping by loading the Stripe adapter from a config file at runtime"
      - "Layer Supertype; it underpins classic inheritance by making the domain extend a shared gateway base class"
      - "Separated Interface; it underpins Dependency Inversion / Hexagonal (Ports-and-Adapters)"
    answer: 3
    explanation: |
      Separated Interface puts the interface in a different package from its
      implementation so the dependency direction is broken/inverted — the domain depends
      only on the interface. This underpins Dependency Inversion and Hexagonal /
      Ports-and-Adapters architecture; wiring is done via DI/Plugin.
    ref: "concepts.md#separated-interface"
  - id: dp-enterprise-application-052
    difficulty: advanced
    tags: [base, registry, singleton, di]
    question: |
      Which statement best contrasts a Registry, a Singleton, and Dependency Injection?
    options:
      - "A Registry guarantees exactly one instance; a Singleton is merely a lookup point for shared services; and DI is just an in-memory object cache"
      - "A Registry is a well-known lookup point for shared services; a Singleton guarantees exactly one instance; DI inverts lookup by pushing dependencies in (more testable, generally preferred)"
      - "All three are identical global-state patterns with no meaningful differences whatsoever in lookup mechanics, instance count, or resulting testability"
      - "A Singleton is fully testable by design because of its convenient global access point, whereas both a Registry and Dependency Injection actively defeat unit testing"
    answer: 1
    explanation: |
      A Registry is a well-known place to find shared services (about lookup); a Singleton
      guarantees a single instance (about instance count). Both risk global/hidden state.
      Dependency Injection inverts the lookup — dependencies are pushed in — making
      dependencies explicit and testable, so it is generally preferred over Registry/
      Service Locator.
    ref: "concepts.md#registry-vs-singleton-vs-service-locator--di"
  - id: dp-enterprise-application-053
    difficulty: intermediate
    tags: [base, money, value-object]
    question: |
      To avoid float rounding errors and silent currency mixing, you model amounts as an
      immutable amount+currency object with safe arithmetic and an allocate() that splits
      without losing pennies (JSR-354, Joda-Money). Which pattern is this — and what more
      general pattern is it an example of?
    options:
      - "Special Case; a kind of Null Object standing in for an absent amount"
      - "Record Set; a kind of Table Module holding one currency row per amount"
      - "DTO; a kind of Entity that carries the amount across a tier boundary"
      - "Money; the canonical Value Object exemplar"
    answer: 3
    explanation: |
      Money represents monetary amounts as amount + currency with safe arithmetic,
      rounding, and allocation, forbidding cross-currency operations. It is the textbook
      example of a Value Object (immutable, value equality).
    ref: "concepts.md#money"
  - id: dp-enterprise-application-054
    difficulty: advanced
    tags: [base, null-object, special-case]
    question: |
      Instead of returning null and forcing null checks, a method returns a NullLogger
      whose log() does nothing, so callers invoke it unconditionally. Which pattern is
      this, and what more general pattern is it a specialization of?
    options:
      - "Special Case; a specialization of Null Object"
      - "Null Object; a specialization of Special Case"
      - "Gateway; a specialization of the Adapter pattern for logging"
      - "Service Stub; a specialization of the Mock test-double pattern"
    answer: 1
    explanation: |
      Null Object is a do-nothing object with neutral behaviour standing in for
      absent/null, eliminating null checks (but risking hiding real errors by silently
      doing nothing). It is a specialization of Special Case, which handles any particular
      case polymorphically.
    ref: "concepts.md#null-object"
  - id: dp-enterprise-application-055
    difficulty: intermediate
    tags: [base, special-case]
    question: |
      Customer.forId(x) returns an UnknownCustomer subclass whose billingPlan() returns
      the basic plan and name() returns "Occasional Customer", so callers never branch on
      the edge case. Which pattern is this?
    options:
      - "Null Object only"
      - "Special Case"
      - "Layer Supertype"
      - "Factory"
    answer: 1
    explanation: |
      Special Case is a subclass providing polymorphic behaviour for a particular case,
      used in place of the normal object (and in place of null/flags). Null Object is the
      specific "absent" flavour; here the special case carries meaningful default
      behaviour, so it is the broader Special Case pattern.
    ref: "concepts.md#special-case"
  - id: dp-enterprise-application-056
    difficulty: intermediate
    tags: [base, plugin, separated-interface]
    question: |
      A config file names idGenerator=OracleSequenceIdGenerator, and a factory reads that
      config to instantiate and link the class at configuration time (not compile time).
      Which pattern is this?
    options:
      - "Plugin"
      - "Registry"
      - "Layer Supertype"
      - "Metadata Mapping"
    answer: 0
    explanation: |
      Plugin links classes chosen at configuration time rather than compile time, via a
      central factory reading config and a Separated Interface. Swapping implementations
      (e.g. test vs prod) becomes a config change, at the cost of runtime-not-compile-time
      errors.
    ref: "concepts.md#plugin"
  - id: dp-enterprise-application-057
    difficulty: intermediate
    tags: [base, service-stub, test-double]
    question: |
      In tests you inject a StubTaxService that always returns 10% instead of calling the
      real, slow tax API. Which pattern is this, and what is its main risk?
    options:
      - "Service Stub; the stub can drift from the real service's behaviour (green tests, broken prod)"
      - "Gateway; wrapping each external call risks proliferating thin, redundant one-method wrappers"
      - "Registry; relying on it introduces hidden global state that quietly hurts testability"
      - "Remote Facade; it can duplicate the domain API and add a coarse-grained network round-trip"
    answer: 0
    explanation: |
      Service Stub replaces a problematic/slow external service with a controllable test
      stand-in (behind a Gateway/Separated Interface). Its main risk is drift: the stub
      can diverge from the real service, so tests pass while production breaks — hence
      you still need integration tests.
    ref: "concepts.md#service-stub-mock--fake-service"
  - id: dp-enterprise-application-058
    difficulty: intermediate
    tags: [base, record-set, table-module]
    question: |
      A findAll() call returns an in-memory tabular structure of rows and columns
      (like a ResultSet or .NET DataSet) that a data grid binds to directly. Which
      pattern is this, and which domain-logic pattern does it naturally pair with?
    options:
      - "Data Mapper; pairs with Domain Model"
      - "DTO; pairs with Remote Facade"
      - "Identity Map; pairs with Unit of Work"
      - "Record Set; pairs with Table Module"
    answer: 3
    explanation: |
      Record Set is an in-memory tabular representation of query results. It is not
      object-oriented (no identity/behaviour) and pairs with Table Module (which operates
      on it) and Table Data Gateway (which returns it).
    ref: "concepts.md#record-set"
  - id: dp-enterprise-application-059
    difficulty: advanced
    tags: [session-state, scaling, stateless]
    question: |
      For a horizontally-scaled web app you want any server to serve any request (best
      failover), accepting extra per-request bandwidth and needing to sign/encrypt the
      data. Which session-state option is this?
    options:
      - "Server Session State"
      - "Database Session State"
      - "Client Session State"
      - "Coarse-Grained Lock"
    answer: 2
    explanation: |
      Client Session State keeps session data on the client (cookie/JWT/hidden fields),
      making the server fully stateless — best for scaling/failover — at the cost of
      per-request bandwidth, size limits, and tamper/security concerns (must sign/encrypt).
      Server Session State ties a user to a server; Database Session State adds DB load.
    ref: "concepts.md#session-state-client-server-database"
  - id: dp-enterprise-application-060
    difficulty: advanced
    tags: [offline-concurrency, optimistic-lock, lost-update]
    question: |
      Two users load order v5 and edit for minutes. Using a version column, the first
      save succeeds (now v6); the second runs UPDATE ... WHERE version=5, affects 0 rows,
      and is told to reload. Which pattern is this, and when is it the right choice?
    options:
      - "Pessimistic Offline Lock; best when conflicts are rare and the version column is unavailable"
      - "Optimistic Offline Lock; best when conflicts are rare (no locks held, high concurrency)"
      - "Coarse-Grained Lock; best when conflicts are frequent and each user edits one row at a time"
      - "Implicit Lock; best when redo is very expensive and developers keep forgetting to lock"
    answer: 1
    explanation: |
      Optimistic Offline Lock detects conflicts at commit via a version check, assuming
      conflicts are rare. It holds no locks between requests (high concurrency, no
      deadlocks) but wastes the loser's work on conflict — so it fits low-contention cases
      (the default in ORMs, e.g. JPA @Version).
    ref: "concepts.md#optimistic-offline-lock"
  - id: dp-enterprise-application-061
    difficulty: advanced
    tags: [offline-concurrency, pessimistic-lock]
    question: |
      Conflicts are frequent and redoing lost work is very expensive, so a user must
      acquire a lock BEFORE editing and others are blocked until release. Which pattern
      is this, and what are its main risks?
    options:
      - "Optimistic Offline Lock; risk of wasted work when the commit-time version check fails"
      - "Two-Step View; risk of indirection between the logical page and its rendered format"
      - "Identity Map; risk of stale reads because the per-session map is never invalidated"
      - "Pessimistic Offline Lock; risk of deadlocks, stale locks, and reduced concurrency"
    answer: 3
    explanation: |
      Pessimistic Offline Lock prevents conflicts by acquiring a lock before editing.
      It avoids wasted work but reduces concurrency and risks deadlocks and stale locks
      (a user who walks away holding a lock) — hence you need lock timeouts/admin release.
    ref: "concepts.md#pessimistic-offline-lock"
  - id: dp-enterprise-application-062
    difficulty: advanced
    tags: [offline-concurrency, coarse-grained-lock, aggregate]
    question: |
      To avoid inconsistency, you lock a whole related cluster (an Order and its
      LineItems) with a single lock on the root/one shared version. Which pattern is
      this, and what DDD concept is its natural scope?
    options:
      - "Implicit Lock; its natural scope is the Service Layer use-case boundary"
      - "Coarse-Grained Lock; its natural scope is the DDD Aggregate (the root)"
      - "Optimistic Offline Lock; its scope is a single row guarded by a version column"
      - "Identity Map; its scope is the session's one-object-per-row registry"
    answer: 1
    explanation: |
      Coarse-Grained Lock locks a group of related objects with one lock — typically a
      DDD Aggregate, with the aggregate root as the natural lock scope. It simplifies
      locking and keeps the group consistent but increases contention.
    ref: "concepts.md#coarse-grained-lock"
  - id: dp-enterprise-application-063
    difficulty: advanced
    tags: [offline-concurrency, implicit-lock]
    question: |
      To stop developers from ever forgetting to acquire an offline lock, the base
      mapper/framework acquires it automatically on every load-for-edit. Which pattern is
      this, and what is its main drawback?
    options:
      - "Implicit Lock; hidden behaviour makes it harder to debug and reason about"
      - "Pessimistic Offline Lock; acquiring locks up front regularly causes deadlocks between editors"
      - "Plugin; it needs configuration wiring that surfaces missing implementations only at runtime"
      - "Layer Supertype; it couples every load-for-edit to a shared inheritance base class"
    answer: 0
    explanation: |
      Implicit Lock acquires offline locks in framework/base code so application
      developers can't forget, giving a consistent locking policy. The cost is hidden
      behaviour — harder to debug and reason about — and less per-case control. It
      complements Optimistic/Pessimistic Offline Lock by making them reliable.
    ref: "concepts.md#implicit-lock"
  - id: dp-enterprise-application-064
    difficulty: intermediate
    tags: [domain-logic, decision, complexity]
    question: |
      As business logic grows richer and more interconnected, which statement about the
      Transaction-Script-vs-Domain-Model trade-off is most accurate?
    options:
      - "Transaction Script's effort stays perfectly flat while the Domain Model's grows without any upper bound"
      - "Domain Model is always the cheaper choice, even for trivial single-table CRUD with no real rules"
      - "Both approaches scale identically with complexity, so you should always default to Transaction Script"
      - "Transaction Script's effort grows faster (super-linearly) with complexity, while Domain Model has a higher start-up cost but scales far better"
    answer: 3
    explanation: |
      Fowler's rule of thumb: Transaction Script is cheap to start but its effort grows
      faster than linearly as complexity rises (duplication, tangled procedures), whereas
      the Domain Model has a higher initial cost (needs O/R mapping) but scales far better
      for rich logic. The crossover justifies the Domain Model once logic is genuinely rich.
    ref: "concepts.md#domain-model-vs-transaction-script-vs-table-module"
  - id: dp-enterprise-application-065
    difficulty: expert
    tags: [orm-behavioral, identity-map, cache]
    question: |
      Why is it inaccurate to call an Identity Map "just a cache"?
    options:
      - "Because it never stores loaded objects in memory at all, delegating every lookup back to the database"
      - "Because it exists primarily for identity/correctness (one object per row within a session) rather than for performance, and typically has no eviction policy within its session scope"
      - "Because a cache is what guarantees one object per identity, while an Identity Map instead permits many copies of the same row"
      - "Because an Identity Map is shared globally across every session and thread rather than scoped to one"
    answer: 1
    explanation: |
      An Identity Map's purpose is correctness — guaranteeing exactly one in-memory object
      per database identity within a session, preventing double-load and inconsistent
      updates. A performance cache exists to speed up access and may hold many copies with
      eviction. The Identity Map's session scope is what limits staleness/memory concerns.
    ref: "concepts.md#identity-map"
  - id: dp-enterprise-application-066
    difficulty: advanced
    tags: [presentation, transform-view, xslt]
    question: |
      An XSLT stylesheet walks an <order> XML document element-by-element and emits an
      HTML table, with a template rule per element type — rendering driven by the data
      structure rather than a page-shaped template. Which pattern is this?
    options:
      - "Transform View"
      - "Template View"
      - "Two-Step View"
      - "Front Controller"
    answer: 0
    explanation: |
      Transform View transforms domain data into output one element at a time (classically
      via XSLT), driven by the data structure. Template View, by contrast, is markup-with-
      holes (page-shaped). Transform View cleanly separates data and rendering but is harder
      for complex visual layouts.
    ref: "concepts.md#transform-view"
  - id: dp-enterprise-application-067
    difficulty: intermediate
    tags: [base, registry, global-state]
    question: |
      Objects across the app call Registry.customerRepository() to find a shared service
      instead of receiving it via their constructor. Which pattern is this, and what is its
      main drawback?
    options:
      - "Separated Interface; splitting the lookup across extra packages adds indirection and wiring overhead"
      - "Layer Supertype; making every caller extend a shared base to reach the service couples via inheritance"
      - "Plugin; resolving the service from config means a bad binding surfaces only at runtime, not compile time"
      - "Registry; it is essentially global state, which hurts testability and complicates threading"
    answer: 3
    explanation: |
      Registry is a well-known object other objects use to find common services/objects.
      Because it is essentially global state, it hides dependencies (hurting testability)
      and complicates threading (needing careful per-thread/session scoping). Dependency
      Injection, which pushes dependencies in, is usually preferred.
    ref: "concepts.md#registry"
