topic: "Networking and Communication Protocols"
domain: system-design
topic_slug: networking-and-protocols
version: 1
questions:
  - id: networking-and-protocols-001
    difficulty: beginner
    tags: [osi, layering, fundamentals]
    question: |
      An L7 load balancer can route a request based on its URL path (e.g., /api vs /images),
      but an L4 load balancer cannot. What is the fundamental reason?
    options:
      - "L4 operates at the transport layer and only sees IP addresses and ports, not the HTTP application data"
      - "L4 devices are always slower, so they intentionally skip parsing the URL path to conserve CPU cycles"
      - "L7 load balancers operate purely over UDP while L4 balancers are restricted to TCP connections only"
      - "URL path routing is a proprietary feature that only a few premium load-balancer vendors license out"
    answer: 0
    explanation: |
      Layer determines visibility. An L4 LB works at the transport layer (IP:port, TCP/UDP
      connections) and never parses application data, so it cannot see the HTTP path. An L7 LB
      terminates the connection and parses HTTP, so it can route on path/host/header/cookie.
      Speed (option 1) is a consequence, not the cause; protocol choice (2) and licensing (3)
      are wrong.
    ref: "concepts.md#osi-and-tcp-and-ip-layering-model"
  - id: networking-and-protocols-002
    difficulty: beginner
    tags: [tcp, udp, transport]
    question: |
      Which statement about TCP versus UDP is correct?
    options:
      - "UDP guarantees strictly ordered, sequenced delivery of every datagram but makes no reliability promise"
      - "TCP uses a smaller fixed 8-byte header and skips connection setup, sending its data immediately"
      - "TCP provides reliable, ordered delivery with congestion control; UDP is best-effort with no ordering or built-in congestion control"
      - "UDP performs a 3-way SYN/SYN-ACK/ACK handshake to establish a session before sending any data"
    answer: 2
    explanation: |
      TCP is connection-oriented with reliability, ordering, flow control, and congestion
      control; UDP is connectionless best-effort with an 8-byte header and no guarantees. Option
      0 reverses UDP's properties, option 1 describes UDP not TCP, and option 3 (handshake) is TCP.
    ref: "concepts.md#tcp-versus-udp"
  - id: networking-and-protocols-003
    difficulty: beginner
    tags: [udp, real-time, media]
    question: |
      For a live voice-over-IP call, why is UDP typically preferred over TCP?
    options:
      - "UDP transparently encrypts every audio packet in transit while TCP sends the same media as plaintext"
      - "UDP guarantees that every single audio packet arrives intact and in order, which is critical for clear voice"
      - "A slightly dropped or late audio packet is better discarded than delivered late; UDP avoids TCP's retransmit-and-reorder delays"
      - "TCP is fundamentally incapable of carrying real-time audio payloads of any kind over the network"
    answer: 2
    explanation: |
      In real-time media, freshness beats completeness: a retransmitted packet arriving 300 ms
      late is useless, and TCP's in-order guarantee causes head-of-line blocking. UDP lets you
      drop and move on. UDP does not encrypt automatically (0), does not guarantee delivery (1),
      and TCP can technically carry audio (3) — just with worse latency behavior.
    ref: "concepts.md#tcp-versus-udp"
  - id: networking-and-protocols-004
    difficulty: beginner
    tags: [http, rest, status-codes]
    question: |
      A client sends a request with an invalid, malformed body. Which HTTP status code family
      is most appropriate?
    options:
      - "2xx, because the server received the request"
      - "3xx, to redirect the client to fix it"
      - "4xx, because the error is on the client side"
      - "5xx, because the server must handle it"
    answer: 2
    explanation: |
      4xx codes indicate client-side errors (e.g., 400 Bad Request). 2xx means success, 3xx means
      redirect, and 5xx means the server failed. A malformed request is the client's fault, so 4xx
      (specifically 400) is correct — and importantly, clients should not blindly retry 4xx.
    ref: "concepts.md#rest-semantics-and-status-codes"
  - id: networking-and-protocols-005
    difficulty: beginner
    tags: [dns, resolution]
    question: |
      What does a DNS A record provide?
    options:
      - "The mail server for a domain"
      - "An IPv4 address for a hostname"
      - "An alias pointing one hostname to another"
      - "An IPv6 address for a hostname"
    answer: 1
    explanation: |
      An A record maps a hostname to an IPv4 address. AAAA is for IPv6, CNAME is an alias, and MX
      is for mail servers. This is basic DNS record vocabulary.
    ref: "concepts.md#dns-resolution"
  - id: networking-and-protocols-006
    difficulty: beginner
    tags: [real-time, sse, websockets]
    question: |
      You need to stream server-generated tokens (like an LLM response) to a browser in one
      direction only, over normal HTTP infrastructure, with automatic reconnection. Which is the
      simplest fit?
    options:
      - "Server-Sent Events (SSE)"
      - "WebSockets"
      - "Short polling every 100 ms"
      - "A webhook"
    answer: 0
    explanation: |
      SSE is a one-way (server to client) stream over a long-lived HTTP response with built-in
      auto-reconnect and event IDs — ideal for LLM token streaming. WebSockets add unneeded
      bidirectional complexity and statefulness; short polling wastes requests and adds latency;
      webhooks are server-to-server, not for browser UIs.
    ref: "concepts.md#real-time-delivery-websockets-sse-long-polling-and-webhooks"
  - id: networking-and-protocols-007
    difficulty: beginner
    tags: [keep-alive, connection-pooling]
    question: |
      What is the primary benefit of HTTP keep-alive (persistent connections)?
    options:
      - "It transparently encrypts the connection at the transport layer without needing a TLS certificate"
      - "It guarantees that all queued requests on the connection are processed fully in parallel by the server"
      - "It reuses an existing TCP (and TLS) connection for multiple requests, avoiding repeated handshake costs"
      - "It automatically compresses all response bodies with gzip before they are sent to the client"
    answer: 2
    explanation: |
      Keep-alive amortizes the expensive TCP + TLS handshakes across many sequential requests on
      the same connection, cutting latency and CPU. It does not provide encryption (0), does not
      itself parallelize requests (1 — that's HTTP/2 multiplexing), and does not compress bodies (3).
    ref: "concepts.md#connection-pooling-and-keep-alive"
  - id: networking-and-protocols-008
    difficulty: beginner
    tags: [cdn, edge, caching]
    question: |
      What is the main reason to put a CDN in front of static assets?
    options:
      - "To make the origin database queries execute faster by caching their result sets at the edge"
      - "To serve content from a PoP physically close to the user, reducing latency and offloading the origin"
      - "To transparently encrypt all static assets at rest inside the origin object storage bucket"
      - "To automatically convert bulky JSON responses into compact protobuf on the fly for clients"
    answer: 1
    explanation: |
      CDNs cache content at edge PoPs near users; a cache hit is served in ~10-30 ms instead of a
      cross-continent ~150 ms round trip, and it offloads the origin. It does not speed up DB
      queries, encrypt data at rest, or transcode formats.
    ref: "concepts.md#cdn-and-edge-compute"
  - id: networking-and-protocols-009
    difficulty: beginner
    tags: [latency, numbers, estimation]
    question: |
      Roughly how long is a round trip between California and the Netherlands?
    options:
      - "~0.5 ms"
      - "~150 ms"
      - "~15 ms"
      - "~1500 ms"
    answer: 1
    explanation: |
      A cross-continent round trip is about 150 ms, bounded by the speed of light. A same-datacenter
      round trip is ~0.5 ms. This is why minimizing WAN round trips (caching, CDN, colocation) is
      such a big lever.
    ref: "concepts.md#latency-budgets-and-capacity-estimation"
  - id: networking-and-protocols-010
    difficulty: beginner
    tags: [timeouts, resilience]
    question: |
      Why should every network call have a timeout?
    options:
      - "Without a timeout, a slow or hung dependency can exhaust threads/connections and take down the caller too"
      - "Timeouts make each response arrive faster by prioritizing the request ahead of others in the queue"
      - "Timeouts are strictly mandated by the HTTP/1.1 specification as a required header on all requests"
      - "Timeouts encrypt the outgoing request payload so intermediaries cannot read it in transit"
    answer: 0
    explanation: |
      A missing timeout means a slow dependency can tie up all your threads/connections, cascading
      the failure. Timeouts free resources. They do not speed up responses (1), are not mandated by
      HTTP (2), and have nothing to do with encryption (3).
    ref: "concepts.md#timeouts-retries-with-backoff-and-jitter-and-circuit-breaking"
  - id: networking-and-protocols-011
    difficulty: beginner
    tags: [http, methods, idempotency]
    question: |
      Which HTTP method is NOT guaranteed to be idempotent?
    options:
      - "GET"
      - "POST"
      - "DELETE"
      - "PUT"
    answer: 1
    explanation: |
      POST is neither safe nor idempotent — sending it twice can create two resources or double a
      charge. GET is safe and idempotent; PUT and DELETE are idempotent (repeating them yields the
      same end state). This distinction drives whether retries are safe.
    ref: "concepts.md#idempotency-and-safe-methods"
  - id: networking-and-protocols-012
    difficulty: beginner
    tags: [grpc, protobuf]
    question: |
      What serialization format does gRPC use by default, and over what transport?
    options:
      - "Human-readable JSON documents sent over plain HTTP/1.1 connections"
      - "Verbose XML envelopes carried directly over raw TCP sockets"
      - "Protocol Buffers (binary) over HTTP/2"
      - "Binary Protocol Buffers sent over connectionless UDP datagrams"
    answer: 2
    explanation: |
      gRPC uses Protocol Buffers (compact binary) over HTTP/2, which gives multiplexing and
      streaming. JSON/HTTP-1.1 (0) is REST; XML/TCP (1) is dated SOAP-style; gRPC does not run on
      raw UDP (3).
    ref: "concepts.md#grpc-and-protocol-buffers"
  - id: networking-and-protocols-013
    difficulty: beginner
    tags: [load-balancing, algorithms]
    question: |
      Which load-balancing algorithm sends each new request to the backend currently handling the
      fewest active connections?
    options:
      - "Round robin"
      - "Least connections"
      - "IP hash"
      - "Random"
    answer: 1
    explanation: |
      Least-connections routes to the backend with the fewest in-flight connections, which adapts
      to uneven request durations better than round robin (fixed rotation), IP hash (affinity), or
      random.
    ref: "concepts.md#load-balancing-at-l4-and-l7"
  - id: networking-and-protocols-014
    difficulty: beginner
    tags: [tls, https]
    question: |
      What three guarantees does TLS provide for an HTTPS connection?
    options:
      - "Confidentiality (encryption), integrity (tamper detection), and authentication (server identity)"
      - "Payload compression, edge response caching, and path-based request routing to backends"
      - "Cross-region load balancing, automatic request retries, and health-checked failover"
      - "Request idempotency, strict in-order delivery, and guaranteed at-least-once delivery"
    answer: 0
    explanation: |
      TLS provides confidentiality, integrity, and authentication. The other options list unrelated
      networking concerns (caching/routing, resilience, delivery semantics).
    ref: "concepts.md#tls-handshake-and-mtls"
  - id: networking-and-protocols-015
    difficulty: intermediate
    tags: [http2, http3, hol-blocking]
    question: |
      On a mobile network with noticeable packet loss, why can HTTP/2 sometimes perform WORSE
      than HTTP/1.1 with its multiple parallel connections?
    options:
      - "HTTP/2 drops the header-compression scheme entirely, so larger uncompressed headers inflate every payload"
      - "HTTP/2 mandates opening a brand-new TCP connection for each individual request it sends"
      - "HTTP/2 multiplexes all streams over one TCP connection, so a single lost TCP segment causes head-of-line blocking that stalls every stream"
      - "HTTP/2 turns off persistent keep-alive connections by default, forcing costly reconnects"
    answer: 2
    explanation: |
      HTTP/2 puts all streams on one TCP connection; because TCP guarantees in-order bytes, one lost
      segment blocks every stream (TCP-level HOL blocking). HTTP/1.1's ~6 independent connections
      isolate loss to one connection. HTTP/2 does have HPACK compression (0), reuses one connection
      not per-request (1), and uses persistent connections (3). This is exactly why HTTP/3/QUIC exists.
    ref: "concepts.md#http-evolution-http-11-http-2-and-http-3-with-quic"
  - id: networking-and-protocols-016
    difficulty: intermediate
    tags: [http3, quic, connection-migration]
    question: |
      A user's phone switches from Wi-Fi to cellular mid-download, changing its IP address. Why
      does an HTTP/3 (QUIC) connection survive this when a TCP-based HTTP/2 connection would break?
    options:
      - "QUIC silently re-runs the full TCP three-way handshake on the new IP to restore the session"
      - "HTTP/2 also seamlessly survives client IP changes, so there is no practical difference between them"
      - "QUIC buffers every in-flight packet on the server until the client's new IP address becomes stable"
      - "QUIC identifies a connection by a Connection ID rather than the IP/port 4-tuple, so an IP change does not drop it"
    answer: 3
    explanation: |
      QUIC uses a Connection ID independent of the 4-tuple, enabling connection migration across
      network changes — a big mobile win. TCP connections are keyed by the 4-tuple, so an IP change
      breaks them. QUIC runs over UDP (no TCP handshake, ruling out 0); buffering (2) is not the
      mechanism; and HTTP/2 does not survive IP changes (1).
    ref: "concepts.md#http-evolution-http-11-http-2-and-http-3-with-quic"
  - id: networking-and-protocols-017
    difficulty: intermediate
    tags: [tls, tls13, handshake]
    question: |
      How many round trips does a full TLS 1.3 handshake take for a NEW connection, and what does
      0-RTT resumption enable?
    options:
      - "1 RTT full; 0-RTT lets the client send application data with its first flight on resumption"
      - "2 RTT full; 0-RTT lets the client send application data with its first flight on resumption"
      - "3 RTT full; 0-RTT eliminates the certificate entirely"
      - "0 RTT full; there is no such thing as resumption"
    answer: 0
    explanation: |
      TLS 1.3 cut the full handshake to 1 RTT (vs 2 in TLS 1.2). With a pre-shared key from a prior
      session, 0-RTT lets the client send data in its very first flight. 0-RTT does not remove the
      certificate (2) and resumption definitely exists (3).
    ref: "concepts.md#tls-handshake-and-mtls"
  - id: networking-and-protocols-018
    difficulty: intermediate
    tags: [tls, 0-rtt, security, idempotency]
    question: |
      Why should TLS 1.3 0-RTT (early data) only be used for idempotent requests like GET?
    options:
      - "0-RTT early data is transmitted entirely in plaintext with no encryption applied to it"
      - "0-RTT is constrained by the TLS protocol itself to carry only HTTP GET requests"
      - "0-RTT early data is vulnerable to replay attacks, so re-executing a non-idempotent write (e.g., a payment) could duplicate it"
      - "0-RTT turns off the server-certificate authentication step during the resumed handshake"
    answer: 2
    explanation: |
      0-RTT early data can be replayed by an attacker, so it must only carry operations that are
      safe to execute more than once (idempotent, like GET). It is still encrypted (0), is not
      protocol-limited to GET (1), and does not disable server auth (3).
    ref: "concepts.md#tls-handshake-and-mtls"
  - id: networking-and-protocols-019
    difficulty: intermediate
    tags: [mtls, zero-trust, service-mesh]
    question: |
      In a zero-trust microservice architecture, what does mTLS add over ordinary TLS?
    options:
      - "It transparently compresses service-to-service payloads with gzip, reducing bandwidth as a built-in part of the handshake"
      - "It automatically translates REST/JSON calls into binary gRPC on the wire so that mismatched services can interoperate"
      - "It removes the need for any certificates by deriving a shared symmetric session key purely from each service's IP identity"
      - "The client also presents a certificate, so both sides are cryptographically authenticated — service identity no longer relies on trusting the network"
    answer: 3
    explanation: |
      Ordinary TLS authenticates only the server; mTLS also authenticates the client via a client
      certificate, giving mutual, network-independent identity — the basis of zero-trust service
      meshes. It is not about compression (0), still needs certs (2), and does not translate
      protocols (1).
    ref: "concepts.md#tls-handshake-and-mtls"
  - id: networking-and-protocols-020
    difficulty: intermediate
    tags: [dns, ttl, failover]
    question: |
      During a regional failover you point a hostname at a new IP, but many clients keep hitting
      the dead IP for several minutes. What is the most likely cause?
    options:
      - "A high DNS TTL caused resolvers and clients to keep serving the cached, now-stale IP until it expired"
      - "The A record was configured as a CNAME, so resolvers followed the alias back to the original dead IP"
      - "TLS certificates on the new endpoint expired during failover, forcing clients to fall back to the old IP"
      - "The load balancer silently switched from L7 to L4 mode, dropping the health checks that would have rerouted clients"
    answer: 0
    explanation: |
      DNS is cached per TTL; a high TTL means changes propagate slowly, so clients keep the stale IP
      until cache expiry. Low TTL + anycast/health-checked failover reacts faster. The other options
      do not explain clients caching a dead IP.
    ref: "concepts.md#dns-resolution"
  - id: networking-and-protocols-021
    difficulty: intermediate
    tags: [dns, anycast, routing]
    question: |
      How does anycast help a global DNS service like 1.1.1.1 or a CDN?
    options:
      - "It encrypts every DNS query end to end using DNSSEC so no resolver in the path can read the requested name"
      - "It guarantees that one single authoritative server in a central region answers every query worldwide for consistency"
      - "The same IP is announced from many locations via BGP, so clients are routed to the nearest instance and load/DDoS is spread"
      - "It automatically raises each record's TTL to several hours so resolvers cache longer and query volume drops"
    answer: 2
    explanation: |
      Anycast advertises one IP from many PoPs; BGP routes each client to the topologically nearest
      one, giving low latency and DDoS absorption. It is not about encryption (0), is the opposite of
      a single server (1), and does not change TTLs (3).
    ref: "concepts.md#dns-resolution"
  - id: networking-and-protocols-022
    difficulty: intermediate
    tags: [rest, status-codes, retries]
    question: |
      A client library must decide which HTTP responses to retry automatically. Which set is the
      most appropriate to retry (with backoff)?
    options:
      - "400 Bad Request, 401 Unauthorized, 404 Not Found"
      - "301 Moved Permanently, 403 Forbidden, 422 Unprocessable"
      - "200 OK, 201 Created, 204 No Content"
      - "429 Too Many Requests, 503 Service Unavailable, 504 Gateway Timeout (and network timeouts)"
    answer: 3
    explanation: |
      Retry transient conditions: 429 (honor Retry-After), 503, 504, and network timeouts. Do not
      retry deterministic 4xx like 400/401/403/404/422 — the request itself is wrong and retrying
      wastes capacity. 2xx are successes; 3xx are redirects, not retries.
    ref: "concepts.md#rest-semantics-and-status-codes"
  - id: networking-and-protocols-023
    difficulty: intermediate
    tags: [idempotency, retries, payments]
    question: |
      A POST /charge times out, but you do not know whether the server processed it. What is the
      standard way to make a retry safe against double-charging?
    options:
      - "Send an Idempotency-Key; the server stores key→result and returns the stored result on any retry with the same key instead of re-executing"
      - "Switch the endpoint from POST to GET so the transport layer treats it as idempotent and coalesces the duplicate charge"
      - "Retry immediately and as fast as possible until you finally get a 200, since only a confirmed success stops the loop"
      - "Wrap the call in a much longer client timeout so the connection never times out and no retry is ever issued"
    answer: 0
    explanation: |
      Idempotency keys make retries safe: the server records key→result atomically and returns the
      prior result for duplicate keys, executing the side effect only once. GET cannot carry a charge
      (1), fast retries make things worse (2), and a longer timeout does not solve duplication (3).
    ref: "concepts.md#idempotency-and-safe-methods"
  - id: networking-and-protocols-024
    difficulty: intermediate
    tags: [real-time, websockets, chat]
    question: |
      For a bidirectional chat app where clients send messages, typing indicators, and presence,
      and the server pushes messages back, which real-time transport is the best base?
    options:
      - "Server-Sent Events, because they auto-reconnect and can carry the client's typed messages back upstream on the same channel"
      - "Short polling every second, because it is the simplest to build and delivers presence updates with negligible latency"
      - "WebSockets, because they provide a persistent full-duplex channel for low-overhead bidirectional messaging"
      - "Webhooks, because they push events straight into the browser and keep a persistent duplex link open per user"
    answer: 2
    explanation: |
      Chat needs full-duplex (client to server and server to client), which WebSockets provide.
      SSE is server-to-client only (0); short polling adds latency and waste (1); webhooks are
      server-to-server integration, not browser interaction (3).
    ref: "concepts.md#real-time-delivery-websockets-sse-long-polling-and-webhooks"
  - id: networking-and-protocols-025
    difficulty: intermediate
    tags: [webhooks, idempotency, integration]
    question: |
      When you build a webhook RECEIVER (e.g., for Stripe events), which two properties are most
      important?
    options:
      - "It must continuously poll the sender over UDP for events, since webhooks push only after the receiver requests them"
      - "It must use gRPC bidirectional streaming and reject any duplicate TCP connection so an event is never processed twice"
      - "It must respond with a 3xx redirect and cache the raw payload in a CDN so retries are absorbed at the edge for free"
      - "It must verify the signature and be idempotent, because webhooks are retried and can arrive more than once"
    answer: 3
    explanation: |
      Webhook deliveries retry on failure, so duplicates happen; the receiver must verify the
      signature (authenticity) and process idempotently (dedupe by event ID). Polling/UDP (0),
      3xx/CDN caching (2), and gRPC streaming (1) are not the point.
    ref: "concepts.md#real-time-delivery-websockets-sse-long-polling-and-webhooks"
  - id: networking-and-protocols-026
    difficulty: intermediate
    tags: [grpc, rest, api-design]
    question: |
      You are choosing between gRPC and REST/JSON for a brand-new PUBLIC API consumed by many
      third-party developers and browsers. Which is generally the better default and why?
    options:
      - "REST/JSON, because it is universal, human-debuggable, browser-native, and cacheable — worth the overhead for public consumers"
      - "gRPC, because binary protobuf is smaller on the wire, which matters most for a broad public audience on varied networks"
      - "gRPC, because every modern browser now speaks HTTP/2 gRPC natively and third-party developers need no extra proxy or SDK"
      - "It does not matter which you pick; REST and gRPC are functionally interchangeable for any public third-party audience"
    answer: 0
    explanation: |
      Public APIs favor REST/JSON for universality, debuggability (curl), native browser support,
      and HTTP caching. gRPC needs a proxy for browsers (gRPC-Web) and is harder to debug; its
      wire-size wins (1) matter more for internal traffic. Browsers do not support gRPC natively (2),
      and the choice does matter (3).
    ref: "concepts.md#grpc-and-protocol-buffers"
  - id: networking-and-protocols-027
    difficulty: intermediate
    tags: [connection-pooling, little-law, databases]
    question: |
      Your service handles 10,000 QPS and each request holds a DB connection for ~50 ms. Using
      Little's Law, roughly how many concurrent DB connections do you need?
    options:
      - "~50"
      - "~10,000"
      - "~500"
      - "~200,000"
    answer: 2
    explanation: |
      Concurrency = arrival_rate × latency = 10,000/s × 0.05 s = 500 concurrent connections. This is
      why pools are sized by concurrency (not peak QPS) and why proxies like PgBouncer let thousands
      of app instances share a small pool of real DB connections.
    ref: "concepts.md#connection-pooling-and-keep-alive"
  - id: networking-and-protocols-028
    difficulty: intermediate
    tags: [load-balancing, l4, l7, architecture]
    question: |
      Which scenario specifically REQUIRES an L7 load balancer rather than an L4 one?
    options:
      - "Balancing raw TCP connections to a database cluster"
      - "Routing /api/* to one service and /static/* to another, plus header-based canary releases"
      - "Forwarding UDP game traffic to backend servers"
      - "Maximizing packet-forwarding throughput with minimal CPU"
    answer: 1
    explanation: |
      Path- and header-based routing and canaries require parsing HTTP, which only an L7 LB does.
      Raw TCP, UDP, and maximum throughput/low CPU are exactly the L4 use cases where
      application-layer visibility is unnecessary.
    ref: "concepts.md#load-balancing-at-l4-and-l7"
  - id: networking-and-protocols-029
    difficulty: intermediate
    tags: [cdn, caching, invalidation]
    question: |
      Which cache-invalidation strategy avoids the "stale content served until TTL expiry" problem
      entirely and needs no explicit purge?
    options:
      - "Versioned/fingerprinted URLs (e.g., app.abc123.js) so a new deploy produces a new URL and thus a new cache object"
      - "Setting a very long max-age so the object lives long enough that stale versions naturally never appear"
      - "Disabling caching completely so every request goes to the origin and thus can never serve a stale object"
      - "Using a CNAME instead of an A record so the CDN resolves the freshest origin copy on each lookup"
    answer: 0
    explanation: |
      Versioned URLs make each deploy a brand-new object with a new key, so old caches are never
      stale for the new asset and no purge is needed — the standard best practice. Long max-age (1)
      worsens staleness; disabling caching (2) defeats the CDN; DNS record type (3) is irrelevant.
    ref: "concepts.md#cdn-and-edge-compute"
  - id: networking-and-protocols-030
    difficulty: intermediate
    tags: [retries, backoff, jitter, resilience]
    question: |
      Why is exponential backoff WITHOUT jitter still dangerous during a widespread outage?
    options:
      - "Backoff without jitter consumes too much client memory because each pending retry buffers its full request payload"
      - "Jitter is only needed for idempotent GET requests; write methods like POST already randomize their own retry timing"
      - "Thousands of clients back off on the same schedule and retry in synchronized waves, creating thundering-herd spikes"
      - "Backoff without jitter violates the TCP specification's mandatory exponential-timer rules and is rejected by the kernel"
    answer: 2
    explanation: |
      Fixed exponential delays cause clients to retry in lockstep, producing synchronized load
      spikes that can re-crash a recovering service. Adding randomness (jitter), e.g., AWS full
      jitter, spreads retries out. Memory (0), method type (1), and TCP spec (3) are not the issue.
    ref: "concepts.md#timeouts-retries-with-backoff-and-jitter-and-circuit-breaking"
  - id: networking-and-protocols-031
    difficulty: intermediate
    tags: [circuit-breaker, resilience]
    question: |
      What does a circuit breaker in the OPEN state do, and why?
    options:
      - "It retries the dependency as fast as possible on every request to force it to recover as quickly as it can"
      - "It permanently disables the dependency for the process lifetime and requires a full redeploy to route to it again"
      - "It queues every incoming request in an unbounded buffer and replays them all the instant the dependency returns"
      - "It fails fast without calling the dependency for a cooldown period, shedding load so the sick dependency can recover and freeing the caller's resources"
    answer: 3
    explanation: |
      An open breaker fails fast (or serves a fallback) instead of calling the failing dependency,
      protecting the caller's threads and giving the dependency room to recover; it later goes
      half-open to test recovery. Fast retries (0) amplify load; queuing (2) ties up resources;
      it is not permanent (1).
    ref: "concepts.md#timeouts-retries-with-backoff-and-jitter-and-circuit-breaking"
  - id: networking-and-protocols-032
    difficulty: intermediate
    tags: [estimation, qps]
    question: |
      Approximately what average QPS does 100 million requests per day correspond to?
    options:
      - "~12 QPS"
      - "~1,160 QPS"
      - "~115 QPS"
      - "~11,600 QPS"
    answer: 1
    explanation: |
      100,000,000 / 86,400 s ≈ 1,157 ≈ ~1,160 QPS average (peak is often 2-5×). A handy anchor:
      1 M/day ≈ 12 QPS, so 100 M/day ≈ 100 × 12 ≈ 1,200 QPS.
    ref: "concepts.md#latency-budgets-and-capacity-estimation"
  - id: networking-and-protocols-033
    difficulty: intermediate
    tags: [modern, event-driven, idempotency]
    question: |
      Most message brokers (Kafka, SQS) provide at-least-once delivery. What does this force
      consumers to be?
    options:
      - "Idempotent, so that processing a duplicate message does not double-apply the effect"
      - "Stateless and synchronous, so the broker can guarantee each message is handed off exactly once per consumer"
      - "Written in the same language as the producer, so the serialized message frames are byte-compatible on both ends"
      - "Connected to the broker over UDP for speed, since at-least-once delivery relies on connectionless datagram fan-out"
    answer: 0
    explanation: |
      At-least-once means duplicates are possible, so consumers must dedupe / process idempotently
      (e.g., by unique message ID) to achieve exactly-once effect. Statelessness (1), language (2),
      and transport (3) are unrelated.
    ref: "concepts.md#modern-patterns-event-driven-streaming-and-service-mesh"
  - id: networking-and-protocols-034
    difficulty: intermediate
    tags: [modern, cdc, streaming]
    question: |
      What problem does Change Data Capture (CDC) with a tool like Debezium primarily solve?
    options:
      - "It encrypts the database at rest by streaming the changelog through a key-management layer before commit"
      - "It replaces the need for a load balancer by routing read traffic directly from the changelog to each replica"
      - "It streams the database's changelog (e.g., the WAL) to other systems, syncing caches/search indexes/data lakes without unreliable dual writes"
      - "It compresses TCP packets between services by batching row changes into a single framed segment on the wire"
    answer: 2
    explanation: |
      CDC reads the DB commit log and emits change events, letting downstream systems stay in sync
      without dual-writing (which risks inconsistency if one write fails). It is not encryption (0),
      load balancing (1), or packet compression (3).
    ref: "concepts.md#modern-patterns-event-driven-streaming-and-service-mesh"
  - id: networking-and-protocols-035
    difficulty: intermediate
    tags: [service-mesh, sidecar, mtls]
    question: |
      In a service mesh (Istio/Linkerd), where do retries, timeouts, mTLS, and circuit breaking
      typically execute?
    options:
      - "Inside each service's business-logic code, hand-written per endpoint by the team that owns that service"
      - "In the database layer, where stored procedures enforce timeouts, retries, and mTLS for every inbound query"
      - "Only in the central API gateway, which applies mTLS and retries once at the edge for all east-west traffic"
      - "In a sidecar proxy (e.g., Envoy) deployed alongside each service, pulling these concerns out of app code"
    answer: 3
    explanation: |
      A mesh moves cross-cutting networking (mTLS, retries, timeouts, breaking, observability) into a
      per-pod sidecar proxy, keeping app code clean and policy uniform across languages. The cost is
      an extra proxy hop and operational complexity. It is not in business logic (0), gateway-only
      (3 handles north-south), or the DB (1).
    ref: "concepts.md#modern-patterns-event-driven-streaming-and-service-mesh"
  - id: networking-and-protocols-036
    difficulty: intermediate
    tags: [http, rest, status-codes]
    question: |
      A service accepts a long-running job and will process it asynchronously. Which status code
      best communicates "received, not yet complete"?
    options:
      - "200 OK"
      - "201 Created"
      - "202 Accepted"
      - "204 No Content"
    answer: 2
    explanation: |
      202 Accepted means the request was accepted for processing but is not complete — ideal for
      async jobs (often with a status URL). 200 implies a completed result, 201 means a resource was
      created now, and 204 means success with no body.
    ref: "concepts.md#rest-semantics-and-status-codes"
  - id: networking-and-protocols-037
    difficulty: intermediate
    tags: [connection-pooling, idle-timeout, failure-modes]
    question: |
      Clients intermittently get "connection reset" errors when reusing pooled connections. The
      most common root cause is:
    options:
      - "The server/LB idle timeout is shorter than the client's, so the client reuses a socket the server already closed"
      - "The client connection pool is sized too small, so under load it constantly evicts and rebuilds sockets that then reset"
      - "TLS 1.3 is enabled, and its 0-RTT early-data mode silently invalidates any connection that is later reused from the pool"
      - "The database server has excess free buffer-pool memory, so its planner keeps recycling pooled sockets in the middle of a query"
    answer: 0
    explanation: |
      A classic mismatch: if the server or LB reaps idle connections before the client does, the
      client picks a dead socket from the pool and gets a reset. Fix by making the client idle
      timeout shorter than the server keep-alive timeout. Pool size (1), TLS version (2), and DB
      memory (3) are not the cause.
    ref: "concepts.md#connection-pooling-and-keep-alive"
  - id: networking-and-protocols-038
    difficulty: intermediate
    tags: [grpc, streaming, rpc-types]
    question: |
      Which capability does gRPC over HTTP/2 offer that plain REST/JSON does not provide natively?
    options:
      - "Human-readable, self-describing text payloads that any developer can inspect directly with curl or a browser"
      - "Native in-browser support with no proxy, since every modern browser speaks the gRPC-over-HTTP/2 framing directly"
      - "First-class bidirectional streaming (client and server stream over one call)"
      - "Transparent HTTP response caching out of the box, honoring Cache-Control and ETag headers at intermediary proxies"
    answer: 2
    explanation: |
      gRPC's four call types include full bidirectional streaming, native to HTTP/2. REST is
      request/response and needs SSE/chunked workarounds. Human-readable payloads (0), native browser
      support (1), and HTTP caching (3) are strengths of REST, not gRPC.
    ref: "concepts.md#grpc-and-protocol-buffers"
  - id: networking-and-protocols-039
    difficulty: advanced
    tags: [http3, quic, tradeoffs]
    question: |
      Your service runs entirely inside a low-loss, high-bandwidth datacenter LAN between
      microservices. A teammate proposes migrating all internal traffic from HTTP/2 to HTTP/3
      "for performance." What is the best critique?
    options:
      - "HTTP/3 is strictly worse than HTTP/2 in every dimension and should never be deployed for any production workload"
      - "HTTP/3 depends on a TCP transport underneath, and datacenter LAN fabrics are UDP-only, so the handshake cannot complete"
      - "HTTP/3 is structurally incompatible with gRPC's protobuf framing, so migrating the internal RPC traffic is impossible"
      - "QUIC's main advantages (loss-tolerant per-stream delivery, connection migration) matter most on lossy/mobile networks; on a clean LAN the gain is small while QUIC costs more CPU (user-space) and has less mature tooling"
    answer: 3
    explanation: |
      QUIC shines against packet loss and network changes; a clean LAN sees little loss and no IP
      migration, so the benefit is marginal while you pay higher per-byte CPU (user-space QUIC) and
      weaker observability. HTTP/3 is not universally worse (0), can carry gRPC (3), and runs over
      UDP not TCP (1).
    ref: "concepts.md#http-evolution-http-11-http-2-and-http-3-with-quic"
  - id: networking-and-protocols-040
    difficulty: advanced
    tags: [tail-latency, fan-out, hedging]
    question: |
      A request fans out to 100 independent backend calls in parallel and waits for all to return.
      Each backend has p99 = 50 ms. Roughly what happens to the overall request latency, and what
      mitigates it?
    options:
      - "Overall latency is dominated by the tail — with 100 calls it's very likely at least one hits its p99, so the request is frequently ~50 ms+; hedged requests, tighter dependency p99s, and timeouts mitigate the tail-at-scale effect"
      - "Overall latency stays right around 50 ms because independent parallel calls all return together, so nothing needs mitigation"
      - "Overall latency becomes 100 × 50 ms = 5 s, since the runtime quietly serializes fan-out calls onto one worker thread"
      - "Overall latency actually drops below 50 ms because averaging across 100 parallel samples cancels out each call's tail"
    answer: 0
    explanation: |
      With large fan-out, the slowest of many parallel calls sets the latency (tail at scale): the
      probability that at least one call hits its p99 grows with fan-out, so the request routinely
      pays the tail. Hedged requests, tighter downstream tails, and timeouts help. Calls are parallel
      not serial (2), and parallelism does not average away the max (3), so it is not a free ~50 ms (1).
    ref: "concepts.md#latency-budgets-and-capacity-estimation"
  - id: networking-and-protocols-041
    difficulty: advanced
    tags: [retries, load-amplification, retry-budget]
    question: |
      During a partial outage, a service with 3 automatic retries per call makes the outage worse.
      Besides adding backoff+jitter, what modern guard most directly prevents this retry
      amplification?
    options:
      - "Increase the per-call retry count from 3 to 10 so that requests keep trying and eventually push through the outage"
      - "Remove all client timeouts so that in-flight requests simply wait patiently for the dependency to come back online"
      - "A retry budget (token bucket) that only allows retries if they stay under a small percentage of total traffic, plus circuit breakers"
      - "Switch the affected calls from TCP to UDP to shave connection overhead and let more retries fit in the same window"
    answer: 2
    explanation: |
      Retry budgets cap retries as a fraction of traffic (e.g., <10%), preventing 3× amplification
      when everything is failing; combined with circuit breakers they stop the death spiral. More
      retries (0) and removing timeouts (1) amplify the problem; transport choice (3) is irrelevant.
    ref: "concepts.md#timeouts-retries-with-backoff-and-jitter-and-circuit-breaking"
  - id: networking-and-protocols-042
    difficulty: advanced
    tags: [tls, termination, tradeoffs, security]
    question: |
      A payments platform must keep traffic encrypted end to end for compliance, including inside
      its own network. Which TLS termination design best fits, and what is the trade-off?
    options:
      - "Terminate TLS at the CDN/edge and send plaintext to origins — lowest CPU, but traffic is unencrypted internally"
      - "Route all internal service traffic over UDP to skip the TLS handshake entirely, relying on datagram framing for privacy"
      - "Disable TLS on internal hops since the VPC is private and trusted, and lean on network ACLs and security groups for protection"
      - "Terminate at the edge then re-encrypt to origins (or use mTLS service-to-service) — encrypted everywhere at the cost of extra CPU and handshake latency"
    answer: 3
    explanation: |
      For end-to-end confidentiality (PCI/HIPAA-grade), you re-encrypt from the edge to origins
      and/or use mTLS internally, paying extra CPU and latency. Edge termination with plaintext
      internal (0) and disabling TLS on a "trusted" network (2) violate the requirement; UDP (1)
      does not provide encryption.
    ref: "concepts.md#tls-handshake-and-mtls"
  - id: networking-and-protocols-043
    difficulty: advanced
    tags: [websockets, scale, pub-sub, architecture]
    question: |
      You must support 10 million concurrent WebSocket connections for a chat product across many
      connection servers. When user A sends a message to user B (connected to a different server),
      how should the architecture deliver it?
    options:
      - "Route messages through a pub/sub backplane (e.g., Redis/Kafka) plus a presence registry, so any server can publish and the server holding B's connection delivers it"
      - "Have every connection server maintain a persistent direct TCP link to every other connection server in a full mesh topology"
      - "Broadcast every outbound message to all 10 million connected clients and rely on each client to filter out the ones not addressed to it"
      - "Persist each message as a DNS TXT record so the recipient's server can resolve and fetch it on the next lookup"
    answer: 0
    explanation: |
      At scale you decouple connection servers with a pub/sub backplane and a presence/registry so
      messages find the server owning the recipient's socket — the pattern Discord/Slack use. A full
      mesh (1) does not scale, broadcasting to everyone (2) is wasteful and leaks data, and DNS (3)
      is absurd for messaging.
    ref: "concepts.md#real-time-delivery-websockets-sse-long-polling-and-webhooks"
  - id: networking-and-protocols-044
    difficulty: advanced
    tags: [grpc, load-balancing, http2, connections]
    question: |
      A team puts a connection-level (L4) load balancer in front of gRPC services and notices load
      is badly imbalanced across backends. Why, and what fixes it?
    options:
      - "gRPC calls are fully stateless at the connection level, so backend imbalance is impossible and the dashboard metrics must be miscounting"
      - "gRPC mandates a UDP transport underneath, so the fix is to reconfigure the load balancer into UDP passthrough mode"
      - "gRPC uses long-lived HTTP/2 connections that pin to one backend, so connection-level balancing sends all a client's requests to one server; use request-level (L7) balancing, client-side LB, or a service mesh"
      - "The fix is to disable HTTP/2 stream multiplexing so each RPC opens its own short-lived connection that the L4 balancer can spread"
    answer: 2
    explanation: |
      HTTP/2/gRPC multiplex many requests over one long-lived connection, so an L4 (per-connection)
      LB pins all those requests to a single backend, causing imbalance. Request-level L7 balancing,
      client-side LB, or a mesh distributes per-request. gRPC is not stateless-at-connection (0),
      does not need UDP (1), and disabling multiplexing (3) sacrifices its main benefit.
    ref: "concepts.md#load-balancing-at-l4-and-l7"
  - id: networking-and-protocols-045
    difficulty: advanced
    tags: [sse, websockets, tradeoffs, judgment]
    question: |
      For a live stock-price dashboard (server pushes frequent updates, client rarely sends
      anything), a team is debating SSE vs WebSockets. Which reasoning is soundest?
    options:
      - "Use WebSockets because a full-duplex channel is always the better choice, even when the client almost never sends data upstream"
      - "Use webhooks so the exchange's servers can push each price tick straight into the browser over a persistent duplex link"
      - "Use long polling, because reopening a fresh request after every tick is the most scalable option for high-frequency updates"
      - "Use SSE: the flow is essentially one-way server-to-client, so SSE reuses HTTP infra/auth, gives auto-reconnect and event IDs, and avoids the stateful-connection and sticky-routing complexity of WebSockets"
    answer: 3
    explanation: |
      A push-mostly, one-way feed is the textbook SSE case — simpler than WebSockets, HTTP-native,
      with auto-reconnect. WebSockets add unneeded bidirectional/stateful complexity (0); long polling
      is a fallback, not the most scalable (2); webhooks are server-to-server, not browser push (1).
    ref: "concepts.md#real-time-delivery-websockets-sse-long-polling-and-webhooks"
  - id: networking-and-protocols-046
    difficulty: advanced
    tags: [estimation, bandwidth, capacity]
    question: |
      A service serves 10,000 QPS with an average response of 20 KB. Approximately what egress
      bandwidth is required (ignoring overhead and fan-out)?
    options:
      - "~200 MB/s (~1.6 Gbps)"
      - "~200 KB/s (~1.6 Mbps), taking the 20 KB as the per-second total rather than per request"
      - "~20 MB/s (~160 Mbps), dividing the response size by the request rate instead of multiplying"
      - "~20 Gbps (~2.5 GB/s), multiplying by 8 bits twice when converting bytes to bits"
    answer: 0
    explanation: |
      10,000/s × 20 KB = 200,000 KB/s = 200 MB/s ≈ 1.6 Gbps (×8 bits/byte). This kind of quick
      bandwidth math sizes NICs, LB capacity, and CDN offload decisions.
    ref: "concepts.md#latency-budgets-and-capacity-estimation"
  - id: networking-and-protocols-047
    difficulty: advanced
    tags: [circuit-breaker, bulkhead, resilience, judgment]
    question: |
      One downstream dependency becomes slow (not down). Requests to it pile up and eventually your
      whole service becomes unresponsive, even for endpoints that do not use that dependency. What
      combination best prevents this?
    options:
      - "Only add more automatic retries to the slow dependency so that eventually one of the attempts returns before the caller stalls"
      - "Increase the shared global thread pool size indefinitely so there are always spare threads for the endpoints that are still healthy"
      - "Aggressive timeouts + a circuit breaker on that dependency + bulkheads (isolated thread/connection pools) so its slowness cannot consume all shared resources"
      - "Remove the timeouts on that dependency so its in-flight requests can finish naturally once it eventually recovers on its own"
    answer: 2
    explanation: |
      The failure is resource exhaustion from a slow dependency spilling into shared pools. Timeouts
      cap wait, a circuit breaker sheds load from the sick dependency, and bulkheads isolate its pool
      so unrelated endpoints stay healthy. Retries (0) and no timeouts (3) worsen it; unbounded
      threads (1) just delays collapse.
    ref: "concepts.md#timeouts-retries-with-backoff-and-jitter-and-circuit-breaking"
  - id: networking-and-protocols-048
    difficulty: advanced
    tags: [modern, sync-async, event-driven, judgment]
    question: |
      An order service must trigger inventory, shipping, email, and analytics on each order. Traffic
      is spiky and downstreams occasionally go down. Which communication style is most appropriate
      and what do you give up?
    options:
      - "Synchronous chained REST calls to all four downstreams inline, so the user gets one immediate confirmation covering every step at once"
      - "Have the order service poll each of the four downstreams once per second to check whether they are ready to accept the new order"
      - "Wrap all five services in one giant distributed database transaction so the whole order commits or rolls back with strong consistency"
      - "Publish an OrderPlaced event to a broker; consumers react asynchronously — you gain decoupling, spike absorption, and resilience, but accept eventual consistency and must make consumers idempotent"
    answer: 3
    explanation: |
      Event-driven fan-out decouples producers/consumers, buffers spikes, and survives downstream
      outages (events wait in the log); the trade-off is eventual consistency and idempotent
      consumers. Synchronous chains (0) couple availability and latency; a cross-service transaction
      (2) is a distributed-transaction anti-pattern; polling (1) is wasteful and still coupled.
    ref: "concepts.md#modern-patterns-event-driven-streaming-and-service-mesh"
  - id: networking-and-protocols-049
    difficulty: advanced
    tags: [dns, load-balancing, tradeoffs, judgment]
    question: |
      A team wants near-instant traffic failover between regions. They rely solely on DNS with a
      300-second TTL for load balancing. What is the primary limitation and better approach?
    options:
      - "DNS-based routing is coarse and slow because clients/resolvers cache to the TTL — you cannot yank traffic instantly; use anycast + low TTL and/or move failover to an L4/L7 LB or health-checked global traffic manager"
      - "DNS-based routing is perfectly fine here; a 300-second TTL propagates fast enough to count as effectively instant regional failover"
      - "Raise the TTL to a full hour so that resolvers refresh the record more often and therefore pick up the failover change faster"
      - "Convert all the A records to CNAME aliases, which lets resolvers bypass their caches and switch endpoints the moment one fails"
    answer: 0
    explanation: |
      DNS changes propagate only as fast as caches expire (the TTL), so DNS alone cannot fail over
      instantly. Anycast, low TTLs, health-checked traffic managers, and LB-level failover react
      faster. 300 s is not instant (1), a longer TTL is worse (2), and CNAME type (3) does not fix
      caching.
    ref: "concepts.md#dns-resolution"
  - id: networking-and-protocols-050
    difficulty: advanced
    tags: [http2, http3, congestion-control]
    question: |
      Cloudflare found HTTP/3 beat HTTP/2 on small-object TTFB but HTTP/2 sometimes edged ahead on
      large transfers. What largely explains the large-transfer result?
    options:
      - "HTTP/3 caps any single object transfer at 1 MB, so large files get chunked into slower separate QUIC streams"
      - "HTTP/2 has zero head-of-line blocking on large files because TCP reassembles the whole object before delivering it"
      - "Throughput depends heavily on the congestion-control algorithm (implementation detail, not the HTTP version); a well-tuned controller like BBR on HTTP/2 can outperform a less-tuned one on HTTP/3"
      - "HTTP/3 always turns congestion control off for bulk transfers, so it saturates the link and then loses to retransmits"
    answer: 2
    explanation: |
      The spec does not fix the congestion controller; Cloudflare's HTTP/2 ran BBR while HTTP/3 ran
      CUBIC/New Reno, so bulk throughput differences reflected the controller, not the protocol.
      HTTP/3 handles large files fine (0), HTTP/2 still has TCP HOL blocking (1), and QUIC does not
      disable congestion control (3).
    ref: "concepts.md#http-evolution-http-11-http-2-and-http-3-with-quic"
  - id: networking-and-protocols-051
    difficulty: advanced
    tags: [idempotency, concurrency, correctness]
    question: |
      Two retries with the SAME idempotency key arrive concurrently at two servers before the first
      finishes. Without extra care, what can go wrong, and what prevents it?
    options:
      - "Nothing goes wrong; idempotency keys are inherently race-free because the server compares them atomically at the network layer"
      - "The shared key expires the instant the first server touches it, which forces the second request to run as a fresh execution"
      - "The second request always overwrites the first server's stored result, and that last-write-wins behavior is exactly what is correct"
      - "Both may pass the 'key not seen' check and execute the side effect twice; prevent it by making the check-and-record atomic (unique constraint / conditional write / lock)"
    answer: 3
    explanation: |
      A naive read-then-write on the key has a race: both requests can see "not seen" and both
      execute. You need atomicity — a unique constraint, conditional/compare-and-set write, or lock —
      so exactly one wins. Keys are not automatically race-free (0), overwriting is not correct (2),
      and expiry (1) is unrelated to the concurrency bug.
    ref: "concepts.md#idempotency-and-safe-methods"
  - id: networking-and-protocols-052
    difficulty: advanced
    tags: [cdn, edge-compute, tradeoffs]
    question: |
      Which workload is the BEST fit for edge compute (Cloudflare Workers / Lambda@Edge) rather
      than the origin?
    options:
      - "Lightweight per-request logic like auth-token validation, A/B test assignment, header rewriting, and geo-routing that benefits from running close to the user without an origin round trip"
      - "A heavy nightly batch job that joins several large multi-gigabyte database tables and aggregates the results into a report"
      - "Long-running stateful transactions that hold open connections to a relational database and coordinate multi-step commits"
      - "Training a machine-learning model over a large dataset, which needs sustained GPU time and tens of gigabytes of memory"
    answer: 0
    explanation: |
      Edge runtimes are constrained (limited CPU/memory/time, no full DB) and excel at lightweight,
      latency-sensitive request manipulation near users. Heavy joins (1), stateful DB transactions
      (2), and model training (3) need origin/backend resources the edge cannot provide.
    ref: "concepts.md#cdn-and-edge-compute"
  - id: networking-and-protocols-053
    difficulty: advanced
    tags: [modern, genai, rag, latency]
    question: |
      In a RAG (retrieval-augmented generation) request path — app → embedding model → vector DB
      (ANN) → LLM, streaming tokens back — where does the latency budget usually concentrate, and
      what is the right UX/architecture response?
    options:
      - "In DNS resolution between the hops; pin long TTLs and cache the DNS answers aggressively to collapse the request path"
      - "Entirely in the vector DB's ANN lookup; drop the vector store from the path and let the LLM answer from its weights alone"
      - "In LLM inference (100s of ms to seconds); stream tokens to the client via SSE, and cache embeddings/prompt-response pairs to cut repeat cost"
      - "In the repeated TLS handshakes between services; disable TLS on the internal RAG hops so tokens flow back with less setup cost"
    answer: 2
    explanation: |
      Model inference dominates RAG latency, so you stream partial tokens (SSE) for perceived speed
      and cache embeddings/responses to avoid recomputation. DNS (0) and TLS (3) are negligible here
      (and disabling TLS is unsafe); the vector DB is essential to retrieval, not the bottleneck to
      remove (1).
    ref: "concepts.md#modern-patterns-event-driven-streaming-and-service-mesh"
  - id: networking-and-protocols-054
    difficulty: advanced
    tags: [latency, deadlines, propagation]
    question: |
      Why is propagating a deadline (rather than just setting an independent timeout at each hop)
      important in a multi-hop request chain?
    options:
      - "It reduces the total number of TCP connections opened, because each hop can reuse the caller's socket once the deadline is shared"
      - "It guarantees strong consistency across the services in the chain, since every hop commits its work within the same time budget"
      - "It encrypts each hop of the chain separately, using the propagated deadline value as the per-hop session key for the payload"
      - "It ensures downstream services do not keep working on a request whose caller has already given up, wasting resources on doomed work"
    answer: 3
    explanation: |
      Deadline propagation (e.g., gRPC deadlines / context) passes the remaining time budget down the
      chain so each hop knows when the overall request has expired and can stop early, avoiding wasted
      work on requests the client already abandoned. It is unrelated to connection count (0),
      encryption (2), or consistency (1).
    ref: "concepts.md#timeouts-retries-with-backoff-and-jitter-and-circuit-breaking"
  - id: networking-and-protocols-055
    difficulty: advanced
    tags: [sticky-sessions, load-balancing, tradeoffs]
    question: |
      A team enables cookie-based sticky sessions on their L7 LB to support in-memory user sessions.
      What is the main downside and the better long-term design?
    options:
      - "Stickiness uneven-loads backends and complicates failover (a node's death loses its sessions); prefer stateless backends + a shared session store (Redis) so any node can serve any request"
      - "Stickiness spreads load perfectly evenly across every backend and survives node failure with zero session loss, so it has no real downside"
      - "Cookie-based stickiness only works on an L4 load balancer, so enabling it forces you to abandon L7 path and header routing entirely"
      - "Stickiness pins each session to a backend by rewriting the connection onto UDP, since cookies cannot be tracked over stateful TCP streams"
    answer: 0
    explanation: |
      Sticky sessions pin users to nodes, causing load imbalance and losing sessions on node failure.
      Externalizing session state (shared store) lets the LB route to any stateless node, improving
      balance and resilience. Stickiness has real downsides (1), does not require L4 (2), and has
      nothing to do with UDP (3).
    ref: "concepts.md#load-balancing-at-l4-and-l7"
  - id: networking-and-protocols-056
    difficulty: advanced
    tags: [protobuf, schema-evolution, grpc]
    question: |
      Which rule is essential for backward/forward-compatible Protocol Buffers schema evolution?
    options:
      - "Rename fields freely between releases; protobuf serializes each field by its declared name, so the wire format tracks names rather than tag numbers"
      - "Always renumber every field's tag sequentially on each release for cleanliness, since decoders re-derive the mapping from the freshly published schema"
      - "Never change or reuse a field's tag number; add new fields with new tags and treat old tags as reserved"
      - "Store and rely on field declaration order rather than tag numbers, because protobuf is a positional format that reads columns left-to-right like CSV"
    answer: 2
    explanation: |
      Protobuf encodes by field tag number, so compatibility depends on keeping tags stable — add new
      fields with new tags, reserve removed ones, and never reuse/renumber. Names are irrelevant on
      the wire (0), renumbering breaks old readers (1), and protobuf is tag-based, not positional (3).
    ref: "concepts.md#grpc-and-protocol-buffers"
  - id: networking-and-protocols-057
    difficulty: advanced
    tags: [backpressure, streaming, modern]
    question: |
      In a streaming pipeline, a fast producer overwhelms a slower consumer. What is the correct
      mechanism to handle this without dropping data or running out of memory?
    options:
      - "Increase the consumer's processing timeout so each slow message is granted more time, which lets the consumer drain the growing backlog"
      - "Disable message acknowledgements entirely so the broker stops waiting on the consumer and pushes records through at the producer's full rate"
      - "Swap the Kafka transport for DNS-based delivery, encoding each record as a TXT lookup so the resolver layer paces the producer for you"
      - "Backpressure: use pull-based consumption / bounded buffers / reactive streams so the consumer signals the producer to slow down"
    answer: 3
    explanation: |
      Backpressure — the streaming analog of TCP flow control — lets a slow consumer signal "slow
      down" via pull-based consumption and bounded queues, preventing OOM and data loss. Timeouts
      (0) do not regulate flow, DNS (2) is irrelevant, and disabling acks (1) risks data loss.
    ref: "concepts.md#modern-patterns-event-driven-streaming-and-service-mesh"
  - id: networking-and-protocols-058
    difficulty: advanced
    tags: [tcp, congestion, throughput, latency]
    question: |
      Why does TCP's reliable, in-order delivery specifically HURT tail latency, whereas UDP does
      not have this problem?
    options:
      - "A lost TCP segment forces the receiver to hold all later-arriving bytes until the gap is retransmitted and filled (head-of-line blocking), spiking latency; UDP delivers whatever arrives"
      - "TCP's 20-byte header versus UDP's 8-byte header adds a fixed per-segment parsing cost that consistently inflates every request's tail latency"
      - "UDP detects a dropped datagram and retransmits it far faster than TCP does, so its recovery path is what drives the tail-latency spike instead"
      - "TCP has no congestion-control mechanism, so it floods the link with unpaced segments and the resulting buffer overflows are what spike tail latency"
    answer: 0
    explanation: |
      In-order delivery means one lost segment blocks delivery of everything after it until the
      retransmit arrives — a latency spike (HOL blocking). UDP has no ordering guarantee, so it hands
      up whatever arrives. Header size (1) is negligible, UDP does not retransmit at all (2), and TCP
      does use congestion control (3).
    ref: "concepts.md#tcp-versus-udp"
  - id: networking-and-protocols-059
    difficulty: expert
    tags: [http3, quic, deployment, tradeoffs]
    question: |
      A global consumer app with many mobile users on flaky networks wants to adopt HTTP/3 but
      worries about middleboxes. Which deployment stance is most defensible?
    options:
      - "Force HTTP/3 only and drop HTTP/2 entirely, since QUIC is strictly superior and every middlebox on modern mobile carriers now forwards UDP without interference"
      - "Serve HTTP/3 only to desktop clients and pin every mobile user to HTTP/2, because QUIC's user-space stack is too heavy for phone CPUs to run reliably"
      - "Advertise HTTP/3 via Alt-Svc but keep HTTP/2 (over TCP) as a fallback, because some networks block/throttle UDP; clients upgrade opportunistically and degrade gracefully"
      - "Tunnel QUIC frames inside a TCP connection to avoid UDP entirely, keeping QUIC's loss-tolerant streams while sidestepping any middlebox that filters datagrams"
    answer: 2
    explanation: |
      Real deployments advertise HTTP/3 (Alt-Svc) while retaining HTTP/2 over TCP as a fallback,
      because UDP is sometimes blocked/throttled by middleboxes; clients opportunistically upgrade
      and fall back safely. Dropping HTTP/2 (0) breaks those users; mobile is exactly where QUIC
      helps most (1); tunneling QUIC in TCP (3) reintroduces TCP HOL blocking, defeating the purpose.
    ref: "concepts.md#http-evolution-http-11-http-2-and-http-3-with-quic"
  - id: networking-and-protocols-060
    difficulty: expert
    tags: [exactly-once, delivery, idempotency, modern]
    question: |
      A staff engineer says "we achieve exactly-once semantics." What is the most accurate way to
      characterize what is actually achievable in a distributed messaging system?
    options:
      - "True exactly-once network delivery is trivially available; just enable the broker's exactly-once flag and the acknowledgement protocol handles duplicates for you at the wire level"
      - "Exactly-once delivery is achieved by switching the transport from TCP to UDP, whose connectionless datagrams cannot be duplicated by retransmission the way TCP segments are"
      - "At-most-once is the only truly safe delivery mode and should always be preferred, since silently dropping a message is never as damaging as risking a duplicate"
      - "Exactly-once DELIVERY over an unreliable network is generally impossible; what you achieve is at-least-once delivery plus idempotent processing (dedup by ID), yielding exactly-once EFFECT"
    answer: 3
    explanation: |
      You cannot guarantee exactly-once delivery over lossy networks (acks can be lost); the practical
      pattern is at-least-once delivery + idempotent consumers, giving exactly-once effect. It is not
      a flag (0), at-most-once drops data (2), and transport choice (1) is irrelevant to this.
    ref: "concepts.md#idempotency-and-safe-methods"
  - id: networking-and-protocols-061
    difficulty: expert
    tags: [cell-based, blast-radius, architecture, judgment]
    question: |
      To limit blast radius, a team adopts a cell-based architecture (many isolated cells each
      serving a slice of users, with a thin routing layer). From a networking standpoint, what is
      the key benefit and the main new challenge?
    options:
      - "Benefit: a failure (or poison request) is contained to one cell instead of the whole fleet; challenge: the cell-router/mapping layer must correctly and consistently route each request to its cell and stay highly available"
      - "Benefit: each cell can now scale without any per-cell capacity ceiling; challenge: there are no new operational trade-offs to manage once cells are in place"
      - "Benefit: isolated cells eliminate the need for load balancers inside each cell; challenge: DNS resolution can be switched off entirely since routing is now cell-local"
      - "Benefit: partitioning users into cells guarantees strong globally-consistent reads across the fleet; challenge: the extra intra-cell mTLS handshakes raise total TLS CPU cost"
    answer: 0
    explanation: |
      Cell-based (a.k.a. cellular) architecture isolates failures to a single cell, shrinking blast
      radius; the new dependency is a correct, highly available routing/mapping layer that sends each
      user to the right cell. It does not grant unlimited single-cell scale (1), still needs LBs/DNS
      (2), and does not itself provide global strong consistency (3).
    ref: "concepts.md#modern-patterns-event-driven-streaming-and-service-mesh"
  - id: networking-and-protocols-062
    difficulty: expert
    tags: [hedging, tail-latency, tradeoffs]
    question: |
      To cut p99 latency, a team sends a hedged (duplicate) request to a second replica if the first
      has not responded within, say, the p95 latency. What is the key trade-off and how is it bounded?
    options:
      - "Hedging adds no measurable cost, so the best practice is to duplicate every single request to a second replica immediately rather than waiting on any percentile threshold"
      - "Hedged requests only function over UDP-based transports, because duplicating a request across replicas requires the connectionless datagram fan-out that TCP cannot provide"
      - "Hedging trades extra load for lower tail latency; issuing the hedge only after p95 (not immediately) and cancelling the loser bounds the extra traffic to a small percentage while still cutting the tail"
      - "Hedging guarantees the request can never fail, because sending it to a second replica removes every remaining single point of failure from the call path"
    answer: 2
    explanation: |
      Hedged requests reduce tail latency at the cost of extra load; issuing the second request only
      after a high percentile (p95) and cancelling the slower one keeps the added traffic small (a
      few percent). Immediate duplication of everything (0) doubles load; hedging is transport-
      agnostic (1) and does not guarantee success (3).
    ref: "concepts.md#latency-budgets-and-capacity-estimation"
  - id: networking-and-protocols-063
    difficulty: expert
    tags: [service-mesh, tradeoffs, judgment]
    question: |
      A company with 6 services and a small team is considering adopting a full service mesh
      (Istio) for mTLS, retries, and observability. What is the most balanced recommendation?
    options:
      - "Adopt the full Istio mesh immediately, since every distributed system regardless of size needs a sidecar per pod to get mTLS and retries working correctly"
      - "Collapse all 6 services back into a single monolith so there is no service-to-service networking left to secure, retry, or observe in the first place"
      - "Never adopt a service mesh under any circumstances, because the sidecar proxy hop always negates any resilience or security benefit at any organization scale"
      - "At this scale the sidecar's per-hop latency/memory and operational complexity likely outweigh the benefits; use libraries (resilience4j, mTLS via a gateway/library) now and revisit a mesh as the service count and polyglot needs grow"
    answer: 3
    explanation: |
      A mesh pays off with many polyglot services needing uniform security/resilience/observability;
      for a handful of services the operational cost and per-pod proxy overhead usually aren't worth
      it — libraries suffice, and you can adopt a mesh later. Blanket "always" (0) or "never" (2) are
      wrong, and rewriting to a monolith (1) is an unrelated overreaction.
    ref: "concepts.md#modern-patterns-event-driven-streaming-and-service-mesh"
  - id: networking-and-protocols-064
    difficulty: expert
    tags: [tls, mtls, rotation, operations]
    question: |
      In a mesh doing mTLS with short-lived (e.g., hourly) certificates for every workload, what is
      the biggest operational trade-off compared to long-lived certs, and why is short-lived often
      still preferred?
    options:
      - "Short-lived certs require robust automated issuance/rotation (a control plane like SPIFFE/SPIRE); the ongoing rotation load is the cost, but they drastically shrink the window an exposed key is useful and largely remove revocation/CRL problems"
      - "Short-lived certs are inherently less secure because their frequent reissuance widens the window for a man-in-the-middle to slip in a forged cert, so they should be avoided"
      - "Short-lived certs eliminate the need for any certificate authority, since each workload can self-sign its own hourly cert and peers trust it by convention"
      - "Short-lived certs force all workload traffic onto UDP, because the rapid rotation cadence cannot be completed inside a long-lived TCP connection's lifetime"
    answer: 0
    explanation: |
      Short-lived certs demand automated issuance/rotation infrastructure (the operational cost) but
      limit exposure if a key leaks and sidestep revocation/CRL complexity (they just expire fast) —
      why zero-trust systems favor them. They are more, not less, secure (1), still need a CA (2), and
      have nothing to do with UDP (3).
    ref: "concepts.md#tls-handshake-and-mtls"
  - id: networking-and-protocols-065
    difficulty: expert
    tags: [cdn, consistency, failure-modes, judgment]
    question: |
      A global site aggressively caches pages at the CDN with a 24-hour TTL. A deploy ships a
      critical bug into a cached page. What failure results, and which design would have limited it?
    options:
      - "No failure occurs; modern CDNs run automated correctness checks on cached pages and refresh any object that returns an error before users see it"
      - "Only the single PoP nearest the deploy origin is affected, because CDNs isolate each deployment to one region and never propagate a new artifact globally"
      - "The buggy page is served worldwide for up to 24 hours; mitigate with fast/automated purge, shorter TTLs plus stale-while-revalidate, and versioned URLs so a new deploy uses new cache keys"
      - "The only real risk here is an origin outage; edge caching can serve a stale copy but by design can never serve a page carrying a freshly-shipped bug"
    answer: 2
    explanation: |
      Aggressive caching + long TTL means a bad artifact is globally sticky until purge/expiry. Fast
      purge, shorter TTLs with stale-while-revalidate, and versioned URLs limit exposure. CDNs do not
      detect bugs (0), caching is global not single-region (1), and stale bugs absolutely can be
      served (3).
    ref: "concepts.md#cdn-and-edge-compute"
  - id: networking-and-protocols-066
    difficulty: expert
    tags: [thundering-herd, connection-pooling, cold-start, judgment]
    question: |
      Right after a rolling deploy, newly started instances briefly return errors and downstream
      latency spikes as connection pools fill. Which mitigation set best addresses this cold-pool
      thundering herd?
    options:
      - "Deploy every instance simultaneously in one big bang so the cold-pool phase happens once and passes quickly, rather than dragging out across a rolling window"
      - "Set an infinite request timeout on the new instances so early requests simply wait for the pools to fill and always eventually succeed instead of erroring"
      - "Remove connection pooling entirely so there are no cold pools left to warm, letting each request open its own fresh connection on demand instead"
      - "Warm pools before taking traffic, ramp traffic gradually (slow-start on the LB), and add jittered connection establishment so instances do not all handshake simultaneously"
    answer: 3
    explanation: |
      Cold pools cause a burst of simultaneous handshakes; warming pools, LB slow-start ramping, and
      jittered connection setup smooth the spike. Deploying everything at once (0) maximizes the herd,
      removing pooling (2) reintroduces per-request handshake cost, and infinite timeouts (1) mask
      symptoms while exhausting resources.
    ref: "concepts.md#connection-pooling-and-keep-alive"
  - id: networking-and-protocols-067
    difficulty: expert
    tags: [rest, grpc, graphql, judgment]
    question: |
      A mobile app suffers from over-fetching and under-fetching (N+1 round trips) against a REST
      API with fixed responses. Leadership asks whether to move to gRPC or GraphQL. What is the
      sharpest analysis?
    options:
      - "GraphQL lets clients request exactly the fields/graph they need in one round trip (killing over/under-fetch), at the cost of harder HTTP caching and server-side query-complexity/N+1 risks; gRPC mainly cuts payload/latency and adds typing/streaming but does not give clients flexible field selection"
      - "gRPC fully solves over- and under-fetching because its binary protobuf payloads let the client pick exactly which fields to decode, collapsing the N+1 round trips on their own"
      - "Neither protocol helps with over- or under-fetching; the only real fix is provisioning a larger CDN so the redundant REST round trips are absorbed at the edge"
      - "GraphQL is strictly superior to both REST and gRPC across every dimension — caching, payload size, typing, and streaming — so it is always the right migration target"
    answer: 0
    explanation: |
      The stated problem is field/shape flexibility and round-trip count, which GraphQL targets
      directly (client-specified queries, one round trip), trading away easy HTTP caching and adding
      resolver/N+1 and query-cost concerns. gRPC optimizes payload size, typing, and streaming but
      does not offer client-driven field selection (1). A CDN doesn't fix dynamic per-user fetching
      (2), and no option is universally best (3).
    ref: "concepts.md#grpc-and-protocol-buffers"
  - id: networking-and-protocols-068
    difficulty: expert
    tags: [latency-budget, critical-path, judgment]
    question: |
      You have a strict p99 budget of 200 ms for an API that must make three downstream calls. Two
      are independent (each p99 ~60 ms); the third (p99 ~50 ms) needs the result of the first. How
      should you structure the calls to fit the budget?
    options:
      - "Make all three calls strictly one after another (60 + 60 + 50 = 170 ms), since serial execution is the only ordering that reliably keeps the total under the 200 ms p99 budget"
      - "Run the two independent calls one after another and issue the dependent call first, so its result is ready and cached by the time the independent calls need it"
      - "Issue the two independent calls in parallel; run the dependent call after the one it needs — critical path ≈ 60 (first) + 50 (dependent) = 110 ms, comfortably under budget, while the other 60 ms call overlaps"
      - "Combine all three downstream calls into a single query against the shared database, collapsing three services into one hop so the whole path costs one 50 ms lookup"
    answer: 2
    explanation: |
      The budget is set by the critical path, not the sum. Parallelize the independent calls; the
      dependent call must follow its prerequisite, so the path is ~first(60) + dependent(50) = 110 ms,
      with the other 60 ms call overlapping. Full serialization (0) wastes time, running the dependent
      first (1) is impossible (it needs the first's result), and merging into one DB call (3) ignores
      that these are distinct services.
    ref: "concepts.md#latency-budgets-and-capacity-estimation"
  - id: networking-and-protocols-069
    difficulty: expert
    tags: [udp, congestion, fairness, quic]
    question: |
      A team builds a custom UDP-based protocol for low latency and skips implementing congestion
      control "to keep it simple." Why is this dangerous, and what do mature UDP-based protocols
      (like QUIC) do?
    options:
      - "It is perfectly fine; a UDP protocol never needs congestion control because routers already pace every datagram flow fairly at the hardware level for you"
      - "The only real risk is slightly higher CPU usage on the sender, since skipping the congestion window just means a few extra packets are formed per second"
      - "UDP automatically inherits TCP's congestion control from the shared IP layer beneath it, so a custom UDP protocol is paced by the kernel just as a TCP flow would be"
      - "Without congestion control the protocol can flood links, cause congestion collapse, and starve well-behaved TCP flows; QUIC implements congestion control (CUBIC/BBR) in user space to be a good network citizen"
    answer: 3
    explanation: |
      UDP has no built-in congestion control, so a naive high-rate sender can overwhelm links and
      unfairly crowd out TCP, risking congestion collapse. Responsible UDP protocols (QUIC) implement
      congestion control themselves. UDP does not inherit TCP's (2), it is not fine to skip (0), and
      the risk is far more than CPU (1).
    ref: "concepts.md#tcp-versus-udp"
  - id: networking-and-protocols-070
    difficulty: expert
    tags: [dns, security, doh, tradeoffs]
    question: |
      An enterprise mandates DNS-based content filtering, but employees' browsers start using DNS
      over HTTPS (DoH) to a public resolver. What is the core tension?
    options:
      - "DoH encrypts DNS queries to an external resolver, improving privacy but bypassing the enterprise's on-network DNS filtering/visibility; the org must provide its own DoH endpoint or policy to regain control"
      - "DoH resolves names so much faster than plain DNS that queries complete before the enterprise filter's inspection step can run, which is what breaks the filtering"
      - "DoH rewrites every A record into an IPv6 AAAA record, and the enterprise filter only inspects IPv4 lookups, so the hostnames become invisible to it"
      - "DoH turns off all resolver-side caching, and because the filtering policy is applied only on cache hits, the resolver can no longer enforce any of its rules"
    answer: 0
    explanation: |
      DoH tunnels DNS inside HTTPS to a chosen resolver, giving privacy but circumventing the
      enterprise resolver used for filtering/visibility — so the org loses control unless it runs its
      own DoH endpoint or enforces policy. It is about encryption/bypass, not speed (1), record types
      (2), or caching (3).
    ref: "concepts.md#dns-resolution"
  - id: networking-and-protocols-071
    difficulty: intermediate
    tags: [http, caching, status-codes]
    question: |
      A browser sends a conditional GET with If-None-Match and the resource is unchanged. What does
      the server return, and why is it useful?
    options:
      - "200 OK with the full body every time, since a conditional GET always re-sends the complete resource so the client is guaranteed the freshest copy"
      - "304 Not Modified with no body, letting the client reuse its cached copy and saving bandwidth"
      - "404 Not Found, because once a resource has already been delivered the server treats a repeat request for it as pointing at a resource that no longer exists"
      - "429 Too Many Requests, because repeatedly revalidating the same unchanged resource is treated as abusive polling and is rate-limited by the server"
    answer: 1
    explanation: |
      When the ETag matches, the server returns 304 Not Modified with an empty body; the client reuses
      its cache, saving bandwidth and time. Returning 200 with the full body defeats the purpose, and
      404/429 are unrelated to cache validation.
    ref: "concepts.md#rest-semantics-and-status-codes"
  - id: networking-and-protocols-072
    difficulty: intermediate
    tags: [tcp, handshake, latency]
    question: |
      For a brand-new HTTPS connection using TCP + TLS 1.3 (no resumption), roughly how many round
      trips are spent before the first application byte can be sent (excluding DNS)?
    options:
      - "0 RTT (TCP and TLS 1.3 both fold into the very first packet on a new connection)"
      - "1 RTT (the TCP and TLS 1.3 handshakes are combined into a single shared round trip)"
      - "2 RTT (1 for TCP handshake + 1 for TLS 1.3)"
      - "4 RTT (1 for TCP handshake + 3 for the full TLS 1.3 certificate exchange)"
    answer: 2
    explanation: |
      TCP's 3-way handshake costs ~1 RTT and TLS 1.3's full handshake costs ~1 RTT, so ~2 RTT before
      application data (DNS excluded). Resumption/0-RTT can cut the TLS portion. This is why QUIC
      (which fuses transport + TLS into 1 RTT, 0 on resume) reduces setup latency.
    ref: "concepts.md#tcp-versus-udp"
  - id: networking-and-protocols-073
    difficulty: beginner
    tags: [modern, api-gateway]
    question: |
      What is the primary role of an API gateway at the edge of a microservice system?
    options:
      - "To serve as the system's primary transactional datastore, persisting every service's records and running the main application queries"
      - "To intercept and replace every internal east-west service-to-service call so that no microservice ever communicates with another directly"
      - "To host and execute the platform's machine-learning inference models, scoring each incoming request in-line before it reaches a service"
      - "A single north-south entry point handling concerns like authentication, rate limiting, routing, and protocol translation for incoming client traffic"
    answer: 3
    explanation: |
      An API gateway is the north-south front door: authn/z, rate limiting, routing, aggregation, and
      protocol translation. It does not store the DB (0), run models (2), or replace east-west calls
      (1 — that's the service mesh's domain).
    ref: "concepts.md#modern-patterns-event-driven-streaming-and-service-mesh"
  - id: networking-and-protocols-074
    difficulty: advanced
    tags: [rest, patch, idempotency, api-design]
    question: |
      Why is PATCH generally NOT guaranteed to be idempotent, whereas PUT is?
    options:
      - "PUT replaces the resource with a full representation (same result each time), while PATCH can describe a relative change (e.g., 'increment by 1') that yields different results when repeated"
      - "PATCH always creates a brand-new resource on each call, so sending the identical request twice reliably produces two separate resources with different server-assigned IDs"
      - "PATCH is defined as a safe, read-only method that merely retrieves the current representation of a resource and never mutates any server-side state when it is repeated"
      - "PUT is an inherently unsafe, non-idempotent write, whereas PATCH is classified as a safe method, so only PATCH can be retried freely without ever causing any side effects"
    answer: 0
    explanation: |
      PUT sends a full replacement, so applying it repeatedly lands the same state (idempotent). PATCH
      applies a partial/possibly relative modification, which can differ when repeated (e.g.,
      increment), so it is not guaranteed idempotent. PATCH is not create-only (1) or read-only (2),
      and neither is 'safe' (3).
    ref: "concepts.md#idempotency-and-safe-methods"
  - id: networking-and-protocols-075
    difficulty: advanced
    tags: [load-balancing, consistent-hashing, cache-affinity]
    question: |
      A caching tier needs requests for the same key to hit the same backend to maximize cache hit
      rate, while minimizing reshuffling when a node is added or removed. Which technique fits best?
    options:
      - "Round robin, sending each request to the next backend in a fixed rotation regardless of the requested key"
      - "Random selection, dispatching each request to an arbitrary backend picked uniformly at random per call"
      - "Consistent hashing (hash ring), so only a small fraction of keys remap when nodes change"
      - "Least connections, routing each request to whichever backend currently holds the fewest active connections"
    answer: 2
    explanation: |
      Consistent hashing maps keys to backends on a ring so adding/removing a node only remaps ~1/N of
      keys, preserving most cache affinity — ideal for sharded caches. Round robin (0), random (1), and
      least connections (3) ignore key affinity and would scatter/reshuffle cache lookups.
    ref: "concepts.md#load-balancing-at-l4-and-l7"
