topic: 'Containers on AWS: ECS vs EKS, Fargate and Orchestration'
domain: system-design
topic_slug: aws-containers-ecs-eks
version: 1
questions:
- id: aws-containers-ecs-eks-001
  difficulty: beginner
  tags:
  - orchestration
  - ecs
  - fundamentals
  question: |
    In Amazon ECS, what is the role of a "task definition"?
  options:
  - An immutable, versioned recipe describing containers, CPU/memory, ports, env, secrets, logging, and the task
    IAM role
  - A running instance of one or more containers scheduled together on a host
  - The logical grouping of tasks and the capacity they run on
  - The component that keeps N copies of a task running and registers them with a load balancer
  answer: 0
  explanation: |
    A task definition is the immutable, revisioned blueprint (like a pod spec). A
    running instance of containers is a "task"; the logical grouping plus capacity is
    a "cluster"; the component that keeps N replicas healthy behind a load balancer is
    a "service".
  ref: concepts.md#ecs-core-concepts-task-definitions-services-clusters
- id: aws-containers-ecs-eks-002
  difficulty: beginner
  tags:
  - eks
  - control-plane
  - cost
  question: |
    What does Amazon EKS manage for you out of the box, and what is the standard
    control-plane price?
  options:
  - The worker nodes only; the control plane is free
  - Both control plane and all worker nodes at no charge
  - The Kubernetes control plane (API server + etcd across 3 AZs) at $0.10 per cluster per hour
  - Nothing; EKS is just an AMI you install Kubernetes on
  answer: 2
  explanation: |
    EKS runs a highly available managed control plane (API server and etcd across 3
    AZs) for $0.10/cluster/hour (~$73/mo). You still bring the data plane (nodes)
    unless using Fargate/Auto Mode. EKS does not manage your worker nodes for free by
    default, and it is not merely an AMI — that would be self-managed Kubernetes.
  ref: concepts.md#eks-managed-kubernetes-core-concepts
- id: aws-containers-ecs-eks-003
  difficulty: beginner
  tags:
  - fargate
  - compute
  - fundamentals
  question: |
    What is the defining characteristic of AWS Fargate compared to the EC2 launch
    type?
  options:
  - It gives you SSH access to tune the underlying host kernel
  - It is always cheaper than EC2 for every workload
  - It only runs Windows containers
  - 'It is serverless: AWS runs each task/pod in a right-sized micro-VM so you never manage hosts'
  answer: 3
  explanation: |
    Fargate is serverless container compute — no hosts to patch, scale, or bin-pack;
    each task runs in its own micro-VM. You do NOT get host/SSH access. It is not
    universally cheaper — steady high-utilization EC2 with Spot/Savings Plans often
    wins. It runs Linux and Windows, ARM64 and x86, not Windows only.
  ref: concepts.md#fargate-vs-ec2-capacity-trade-offs
- id: aws-containers-ecs-eks-004
  difficulty: beginner
  tags:
  - ecr
  - registry
  - fundamentals
  question: |
    What is Amazon ECR primarily used for?
  options:
  - A managed Kubernetes control plane
  - A managed OCI/Docker container image registry with IAM-based auth
  - A service mesh for east-west traffic
  - A load balancer for container tasks
  answer: 1
  explanation: |
    ECR is a managed private/public container image registry (images stored in S3,
    auth via IAM). The managed Kubernetes control plane is EKS; east-west mesh is App
    Mesh/Service Connect; load balancing is ALB/NLB.
  ref: concepts.md#ecr-the-container-image-registry
- id: aws-containers-ecs-eks-005
  difficulty: beginner
  tags:
  - networking
  - awsvpc
  - ecs
  question: |
    Which network mode does AWS Fargate always use for ECS tasks?
  options:
  - bridge
  - host
  - none
  - awsvpc (each task gets its own ENI and VPC IP)
  answer: 3
  explanation: |
    Fargate tasks always use awsvpc mode, giving each task its own ENI, private IP,
    and security group. bridge, host, and none are only options on the EC2 launch
    type.
  ref: concepts.md#task-networking-awsvpc-mode-and-eni-limits
- id: aws-containers-ecs-eks-006
  difficulty: beginner
  tags:
  - load-balancer
  - alb
  - nlb
  question: |
    Which load balancer operates at Layer 7 (HTTP) and supports path/host-based
    routing, gRPC, and WAF integration?
  options:
  - Network Load Balancer (NLB)
  - Classic Load Balancer only
  - Application Load Balancer (ALB)
  - Gateway Load Balancer
  answer: 2
  explanation: |
    ALB is the L7 (HTTP/HTTPS/gRPC) balancer with content-based routing and WAF. NLB
    is L4 (TCP/UDP/TLS) for extreme performance and static IPs; Gateway Load Balancer
    is for inline appliances, not app routing; Classic is legacy.
  ref: concepts.md#load-balancer-integration-alb-and-nlb-target-groups
- id: aws-containers-ecs-eks-007
  difficulty: beginner
  tags:
  - ecs
  - service
  - scaling
  question: |
    In ECS, which construct keeps a desired number of tasks running and replaces
    unhealthy ones?
  options:
  - Service
  - Task definition
  - Cluster
  - Capacity provider
  answer: 0
  explanation: |
    An ECS service maintains the desired task count, replaces failed tasks, and
    manages LB registration and rolling deploys — analogous to a K8s Deployment. A
    task definition is the recipe; a cluster is the grouping/capacity boundary; a
    capacity provider governs the underlying host scaling.
  ref: concepts.md#ecs-core-concepts-task-definitions-services-clusters
- id: aws-containers-ecs-eks-008
  difficulty: beginner
  tags:
  - eks
  - portability
  - ecosystem
  question: |
    What is a primary reason a team would choose EKS over ECS?
  options:
  - It has no control-plane cost
  - It provides a conformant Kubernetes API for the ecosystem (Helm, operators, CRDs) and portability across clouds
  - It requires no knowledge of Kubernetes
  - It is the only option that supports Fargate
  answer: 1
  explanation: |
    EKS's appeal is the standard Kubernetes API, its huge ecosystem, and multi-cloud
    portability. It DOES cost $0.10/cluster/hr and DOES require Kubernetes knowledge.
    Both ECS and EKS support Fargate, so exclusivity is false.
  ref: concepts.md#ecs-vs-eks-vs-self-managed-trade-offs
- id: aws-containers-ecs-eks-009
  difficulty: beginner
  tags:
  - iam
  - security
  - task-role
  question: |
    How should a container running on ECS obtain permission to read one specific
    DynamoDB table?
  options:
  - Bake long-lived AWS access keys into the container image
  - Use the EC2 instance profile of the host so all tasks share it
  - Assign a least-privilege ECS task role scoped to that table
  - Disable IAM and open the table publicly
  answer: 2
  explanation: |
    The ECS task role (or IRSA/Pod Identity on EKS) gives the app a scoped, temporary
    identity — least privilege per service. Baking static keys is a credential-leak
    risk; the host instance role over-grants to every task; opening the table
    publicly is a security disaster.
  ref: concepts.md#security-iam-roles-for-tasks-and-isolation
- id: aws-containers-ecs-eks-010
  difficulty: beginner
  tags:
  - availability
  - multi-az
  - resilience
  question: |
    What is the recommended baseline for surviving an Availability Zone failure in a
    container service?
  options:
  - Run all tasks in a single AZ to minimize cross-AZ cost
  - Run everything in one large task
  - Rely solely on the region failing over automatically
  - Spread tasks/nodes across at least 3 AZs with headroom so losing one AZ costs ~1/3 capacity, not an outage
  answer: 3
  explanation: |
    Spreading across >=3 AZs with headroom (static stability) means an AZ loss is a
    capacity dent, not an outage. A single AZ is a single point of failure; one big
    task has no redundancy; regions don't auto-fail-over for you without a
    multi-region design.
  ref: concepts.md#blast-radius-multi-tenant-clusters-and-cell-based-design
- id: aws-containers-ecs-eks-011
  difficulty: beginner
  tags:
  - cost
  - control-plane
  - ecs
  - eks
  question: |
    Which statement about container control-plane costs is correct?
  options:
  - The ECS control plane is free; the EKS control plane costs $0.10/cluster/hour
  - Both ECS and EKS control planes cost $0.10/cluster/hour
  - The EKS control plane is free; ECS charges per cluster
  - Both are free
  answer: 0
  explanation: |
    ECS has no control-plane charge; you pay only for compute. EKS charges
    $0.10/cluster/hour for the managed control plane (plus +$0.50/hr on extended
    support versions). The other options misstate which service charges.
  ref: concepts.md#cost-reasoning-and-capacity-estimation
- id: aws-containers-ecs-eks-012
  difficulty: beginner
  tags:
  - service-discovery
  - cloud-map
  question: |
    What problem does AWS Cloud Map / ECS service discovery solve?
  options:
  - It builds container images from source
  - It replaces IAM for authentication
  - It lets services find each other despite tasks being ephemeral with changing IPs
  - It stores container logs
  answer: 2
  explanation: |
    Cloud Map registers task IPs so consumers can resolve a stable name via DNS or API
    even as tasks come and go. It is not a build tool, an auth system, or a logging
    store.
  ref: concepts.md#service-discovery-with-cloud-map-and-ecs-service-connect
- id: aws-containers-ecs-eks-013
  difficulty: beginner
  tags:
  - karpenter
  - eks
  - scaling
  question: |
    In modern EKS clusters, what does Karpenter do?
  options:
  - Scales the number of pods based on CPU
  - Terminates the cluster control plane when idle
  - Builds and pushes container images
  - Provisions right-sized EC2 nodes directly in response to unschedulable pods and consolidates underused nodes
  answer: 3
  explanation: |
    Karpenter is a group-less node autoscaler: it watches unschedulable pods and
    launches best-fit EC2 instances in seconds, then consolidates to cut cost. Scaling
    pods on CPU is the HPA. It does not manage the control plane or build images.
  ref: concepts.md#scaling-eks-cluster-autoscaler-karpenter-and-auto-mode
- id: aws-containers-ecs-eks-014
  difficulty: beginner
  tags:
  - fargate
  - sizing
  - limits
  question: |
    What is the maximum vCPU and memory a single AWS Fargate task can be configured
    with?
  options:
  - 4 vCPU and 30 GB
  - 16 vCPU and 120 GB
  - 8 vCPU and 60 GB
  - 64 vCPU and 512 GB
  answer: 1
  explanation: |
    Fargate scales up to 16 vCPU and 120 GB of memory (in valid CPU/memory
    combinations). 4/30 and 8/60 are valid points but not the max; 64/512 exceeds
    Fargate and would require EC2 capacity.
  ref: concepts.md#fargate-vs-ec2-capacity-trade-offs
- id: aws-containers-ecs-eks-015
  difficulty: intermediate
  tags:
  - fargate
  - ec2
  - cost
  - trade-offs
  question: |
    A batch platform runs a steady, 24/7 workload at ~75% CPU utilization on a large,
    homogeneous fleet and is very cost-sensitive; the team has strong ops maturity.
    Which compute choice is most appropriate and why?
  options:
  - EC2 capacity (Spot for interruptible work + Savings Plans for the baseline), bin-packed for high utilization,
    because steady high-util workloads are materially cheaper on EC2
  - ECS on Fargate, because it removes host management even though it costs more per vCPU
  - Fargate Spot only, ignoring interruptions, because it is the cheapest sticker price
  - Self-managed Kubernetes on EC2, to get maximum control
  answer: 0
  explanation: |
    Steady, high-utilization, cost-critical workloads with an ops-mature team are the
    textbook case for EC2 capacity with Spot + Savings Plans and good bin-packing.
    Fargate's per-vCPU premium hurts at steady high util. Relying on Spot alone
    without handling interruptions risks lost work. Self-managed Kubernetes adds ops
    burden with no benefit over EKS/ECS here.
  ref: concepts.md#fargate-vs-ec2-capacity-trade-offs
- id: aws-containers-ecs-eks-016
  difficulty: intermediate
  tags:
  - networking
  - eni
  - ecs
  - limits
  question: |
    Your ECS-on-EC2 cluster in awsvpc mode stops placing new tasks even though the
    instances report plenty of free CPU and memory. What is the most likely cause?
  options:
  - The instances have run out of available ENIs, since awsvpc gives each task its own ENI
  - The task definitions are too large to fit in etcd
  - The ALB target group is full
  - The EKS control plane is throttling the ECS scheduler
  answer: 0
  explanation: |
    In awsvpc mode each task consumes an ENI, and each instance type caps ENIs, so you
    can exhaust ENIs long before CPU/memory. Fix: enable awsvpcTrunking (ENI trunking)
    or use larger/more instances. ECS doesn't use etcd; target groups don't cap task
    placement; EKS is unrelated to ECS scheduling.
  ref: concepts.md#task-networking-awsvpc-mode-and-eni-limits
- id: aws-containers-ecs-eks-017
  difficulty: intermediate
  tags:
  - eks
  - vpc-cni
  - ip-exhaustion
  question: |
    At scale your EKS cluster fails to schedule pods because the VPC subnets have run
    out of IP addresses. What is the root cause and a standard mitigation?
  options:
  - CoreDNS is misconfigured; restart it
  - The control plane ran out of etcd storage; upgrade the cluster
  - The VPC CNI assigns real VPC IPs to every pod, exhausting subnet IP space; use prefix delegation and/or secondary
    CIDRs
  - Karpenter is disabled; enable it to free IPs
  answer: 2
  explanation: |
    The Amazon VPC CNI gives each pod a routable VPC IP, so large clusters exhaust
    subnet address space. Prefix delegation (assigning /28 prefixes per ENI), larger
    subnets, or secondary CIDRs pack more pods. DNS, etcd storage, and Karpenter do
    not cause or fix IP exhaustion.
  ref: concepts.md#task-networking-awsvpc-mode-and-eni-limits
- id: aws-containers-ecs-eks-018
  difficulty: intermediate
  tags:
  - scaling
  - ecs
  - capacity-provider
  question: |
    On ECS with the EC2 launch type, tasks are stuck in PROVISIONING during a traffic
    spike. Service auto scaling raised the desired count, but tasks can't place. What
    is missing?
  options:
  - Nothing; PROVISIONING is a terminal healthy state
  - A larger ALB
  - A second AWS account
  - Cluster capacity — you need a capacity provider with managed scaling (or a bigger ASG) to add hosts for the
    new tasks
  answer: 3
  explanation: |
    Service auto scaling scales tasks, but on EC2 you also need hosts to place them
    on. A capacity provider with managed scaling grows the underlying ASG toward a
    target capacity %. Without host headroom, tasks stay PROVISIONING. This two-layer
    problem vanishes on Fargate (no host layer). A bigger ALB or another account does
    not add compute capacity.
  ref: concepts.md#scaling-ecs-service-auto-scaling-and-capacity-providers
- id: aws-containers-ecs-eks-019
  difficulty: intermediate
  tags:
  - service-mesh
  - app-mesh
  - deprecation
  question: |
    You are designing a new ECS-based system in 2026 and consider AWS App Mesh for
    east-west connectivity, retries, and telemetry. What is the correct guidance?
  options:
  - Adopt App Mesh; it is the strategic AWS mesh for new builds
  - Avoid App Mesh (it reaches end of support Sept 30, 2026) and use Amazon ECS Service Connect for east-west connectivity/telemetry
  - Use App Mesh but only for north-south traffic
  - Mesh is mandatory for any ECS service, so App Mesh is required
  answer: 1
  explanation: |
    AWS App Mesh reaches end of support on 2026-09-30; AWS's guidance is to migrate to
    ECS Service Connect (or a K8s mesh). New ECS designs should use Service Connect,
    not App Mesh. A mesh is optional and often overkill for a few services, so it is
    not mandatory.
  ref: concepts.md#service-mesh-app-mesh-service-connect-and-alternatives
- id: aws-containers-ecs-eks-020
  difficulty: intermediate
  tags:
  - load-balancer
  - nlb
  - static-ip
  - grpc
  question: |
    A partner integration requires a static IP allowlist and raw TCP (not HTTP) with
    the lowest possible latency and huge connection counts. Which load balancer fits,
    and what is the trade-off?
  options:
  - ALB — you gain L7 routing but it has no static IP and adds HTTP-parsing latency
  - Classic Load Balancer, because it is the simplest
  - Gateway Load Balancer, because it is fastest for app traffic
  - NLB — you gain a static IP per AZ, L4 low latency, and massive scale, but lose L7 content routing/WAF
  answer: 3
  explanation: |
    NLB (L4) provides static IPs (EIP per AZ), ultra-low latency, and enormous scale —
    exactly the constraints — at the cost of no L7/content routing or WAF. ALB has no
    static IP and parses HTTP; Classic is legacy; Gateway Load Balancer is for inline
    appliances, not app traffic.
  ref: concepts.md#load-balancer-integration-alb-and-nlb-target-groups
- id: aws-containers-ecs-eks-021
  difficulty: intermediate
  tags:
  - ecs
  - eks
  - decision
  - ops
  question: |
    A 4-person startup with no Kubernetes experience wants to ship a handful of HTTP
    microservices on AWS with minimal operational overhead and no plans for
    multi-cloud. What is the best fit?
  options:
  - EKS with self-managed nodes and Istio, for future-proofing
  - Self-managed Kubernetes on EC2 for maximum control
  - ECS on Fargate behind an ALB, because it is the fastest low-ops path for AWS-native containers
  - EKS with Karpenter and a full service mesh from day one
  answer: 2
  explanation: |
    For a small AWS-native team wanting minimal ops and no portability need, ECS on
    Fargate + ALB is the canonical answer. EKS + Istio, self-managed Kubernetes, and
    EKS + mesh from day one all pile on Kubernetes/mesh complexity that a 4-person
    team with no K8s skills doesn't need yet.
  ref: concepts.md#ecs-vs-eks-vs-self-managed-trade-offs
- id: aws-containers-ecs-eks-022
  difficulty: intermediate
  tags:
  - eks
  - iam
  - irsa
  question: |
    What is the recommended way to grant a specific pod on EKS least-privilege access
    to AWS APIs?
  options:
  - Use IRSA (IAM Roles for Service Accounts) or EKS Pod Identity to bind an IAM role to the pod's service account
  - Attach the permissions to the node's EC2 instance role
  - Store IAM keys in a ConfigMap
  - Give the whole cluster admin credentials
  answer: 0
  explanation: |
    IRSA / EKS Pod Identity map an IAM role to a Kubernetes service account, giving
    per-pod least privilege. The node instance role over-grants to every pod;
    ConfigMaps are not secret and keys shouldn't live there; cluster-wide admin is the
    opposite of least privilege.
  ref: concepts.md#security-iam-roles-for-tasks-and-isolation
- id: aws-containers-ecs-eks-023
  difficulty: intermediate
  tags:
  - ecr
  - supply-chain
  - immutable-tags
  question: |
    Why enable immutable tags on an ECR repository for production images?
  options:
  - To make images pull faster
  - To prevent a tag from being overwritten, ensuring reproducible deploys and safer rollbacks / supply-chain integrity
  - To automatically scan images for CVEs
  - To reduce cross-region replication cost
  answer: 1
  explanation: |
    Immutable tags stop a tag (e.g., v1.2.3) from being re-pushed to different content,
    so a given tag always means the same image — essential for reproducible deploys
    and trustworthy rollbacks. Scanning is a separate feature; immutability doesn't
    affect pull speed or replication cost.
  ref: concepts.md#ecr-the-container-image-registry
- id: aws-containers-ecs-eks-024
  difficulty: intermediate
  tags:
  - service-discovery
  - dns
  - failover
  question: |
    What is the main drawback of pure DNS-based service discovery (Cloud Map DNS
    records) for failover, and how does ECS Service Connect improve on it?
  options:
  - DNS is too fast; Service Connect slows it down for safety
  - DNS can't resolve private IPs; Service Connect uses public IPs
  - DNS TTL/caching makes failover slow and offers no L7 controls; Service Connect adds a proxy with client-side
    LB, retries, fast endpoint updates, and telemetry
  - There is no difference; both are identical
  answer: 2
  explanation: |
    Clients cache DNS per TTL, so removing an unhealthy endpoint isn't instant, and
    plain DNS gives no retries/traffic control. Service Connect injects a managed proxy
    that does client-side load balancing, retries, and quick endpoint updates plus rich
    metrics. DNS can resolve private IPs, and the two approaches are not identical.
  ref: concepts.md#service-discovery-with-cloud-map-and-ecs-service-connect
- id: aws-containers-ecs-eks-025
  difficulty: intermediate
  tags:
  - fargate
  - isolation
  - multi-tenant
  question: |
    A SaaS platform must run untrusted, per-tenant workloads with strong isolation and
    minimal ops. Which approach gives the strongest isolation by default?
  options:
  - Pack all tenants as containers on shared EC2 hosts, relying on namespaces
  - Use a single privileged container per tenant
  - Give each tenant root on a shared host
  - Run each tenant's tasks/pods on Fargate, since each gets its own micro-VM (kernel-level isolation)
  answer: 3
  explanation: |
    Fargate isolates each task/pod in its own micro-VM, providing kernel-level
    separation ideal for untrusted multi-tenant work — with no host to manage. Shared
    hosts with namespaces share a kernel; privileged containers and shared root weaken
    isolation dramatically.
  ref: concepts.md#security-iam-roles-for-tasks-and-isolation
- id: aws-containers-ecs-eks-026
  difficulty: intermediate
  tags:
  - scaling
  - metrics
  - target-tracking
  question: |
    For a latency-sensitive web tier, which service auto scaling metric usually reacts
    better than average CPU utilization?
  options:
  - ALB RequestCountPerTarget (target tracking on requests per task)
  - Number of ECR repositories
  - etcd object count
  - Number of ENIs attached
  answer: 0
  explanation: |
    Request-based target tracking (ALBRequestCountPerTarget) scales with actual load
    and tends to respond faster and more smoothly than CPU for web tiers, where CPU
    can lag or plateau. The other metrics are unrelated to request-driven scaling.
  ref: concepts.md#scaling-ecs-service-auto-scaling-and-capacity-providers
- id: aws-containers-ecs-eks-027
  difficulty: intermediate
  tags:
  - eks
  - auto-mode
  - ops
  question: |
    What does EKS Auto Mode manage on your behalf that standard EKS does not?
  options:
  - It writes your application code
  - It removes the need for a VPC
  - 'It manages the data-plane: compute via built-in Karpenter, plus networking, load balancing, DNS, and storage,
    using immutable Bottlerocket nodes'
  - It makes the control plane free
  answer: 2
  explanation: |
    EKS Auto Mode extends AWS management to the data plane — built-in Karpenter compute
    autoscaling, pod/service networking, ELB integration, DNS, and block storage — on
    immutable Bottlerocket AMIs with a 21-day node lifetime. You still own the VPC and
    app; the control plane still costs $0.10/hr; it doesn't write code.
  ref: concepts.md#scaling-eks-cluster-autoscaler-karpenter-and-auto-mode
- id: aws-containers-ecs-eks-028
  difficulty: intermediate
  tags:
  - ecr
  - docker-hub
  - throttling
  question: |
    During a large scale-out your tasks fail to start because upstream Docker Hub
    pulls are being rate-limited. What ECR feature directly mitigates this?
  options:
  - ECR lifecycle policies
  - ECR immutable tags
  - Cross-account replication of your own repos
  - ECR pull-through cache (caches upstream images so nodes pull from ECR, avoiding Docker Hub rate limits)
  answer: 3
  explanation: |
    Pull-through cache mirrors and caches upstream registry images in ECR so mass
    scale-outs pull from ECR instead of hitting Docker Hub's rate limits. Lifecycle
    policies manage retention; immutable tags prevent overwrite; replication copies
    your own repos, not upstream ones.
  ref: concepts.md#ecr-the-container-image-registry
- id: aws-containers-ecs-eks-029
  difficulty: intermediate
  tags:
  - cost
  - cross-az
  - networking
  question: |
    Two chatty microservices exchange large volumes of east-west traffic and your AWS
    bill has an unexpectedly high data-transfer line item. What is the likely cause
    and a mitigation?
  options:
  - Control-plane charges; switch from EKS to ECS
  - Cross-AZ data transfer between tasks in different AZs is billed; use topology-aware routing / co-locate communicating
    tasks to reduce cross-AZ hops
  - ECR storage; delete images
  - IAM API calls; cache credentials
  answer: 1
  explanation: |
    Cross-AZ traffic is charged, and chatty east-west services spread across AZs rack
    it up. Topology-aware routing / co-location cuts cross-AZ hops (while still keeping
    multi-AZ for resilience — balance cost vs availability). It's not a control-plane,
    ECR storage, or IAM cost.
  ref: concepts.md#cost-reasoning-and-capacity-estimation
- id: aws-containers-ecs-eks-030
  difficulty: intermediate
  tags:
  - deploy
  - safety
  - circuit-breaker
  question: |
    Which mechanisms make ECS container deployments safe against a bad release?
  options:
  - Rolling deploys with minimumHealthyPercent, the ECS deployment circuit breaker (auto-rollback), and blue/green
    via CodeDeploy with weighted target groups for canary
  - Deleting the previous task definition immediately
  - Setting desired count to 0 during deploy
  - Disabling health checks so tasks are never replaced
  answer: 0
  explanation: |
    Safe deploys combine rolling updates that keep a minimum healthy fraction, the
    deployment circuit breaker to auto-rollback on failed health checks, and blue/green
    with weighted target groups for canary traffic shifting. Deleting old revisions
    removes your rollback target; zeroing desired count causes an outage; disabling
    health checks hides failures.
  ref: concepts.md#failure-modes-and-how-the-design-degrades
- id: aws-containers-ecs-eks-031
  difficulty: intermediate
  tags:
  - fargate
  - ephemeral-storage
  - limits
  question: |
    What is the default and maximum ephemeral storage for a Fargate task (platform
    1.4.0+)?
  options:
  - 20 GB default, 200 GB max
  - 5 GB default, 50 GB max
  - 100 GB default, 1 TB max
  - No ephemeral storage; you must attach EBS
  answer: 0
  explanation: |
    Fargate provides 20 GB of ephemeral storage by default, configurable up to 200 GB
    on platform version 1.4.0+. The other figures are incorrect; Fargate does provide
    ephemeral storage (though EBS volume attach is also now supported).
  ref: concepts.md#fargate-vs-ec2-capacity-trade-offs
- id: aws-containers-ecs-eks-032
  difficulty: intermediate
  tags:
  - eks
  - load-balancer-controller
  - ingress
  question: |
    On EKS, what does the AWS Load Balancer Controller provision from a Kubernetes
    Ingress resource, and what does it provision from a Service of type LoadBalancer?
  options:
  - An NLB from Ingress, and an ALB from Service
  - A Classic LB from both
  - An ALB from Ingress, and an NLB from Service type=LoadBalancer
  - Nothing; you must create LBs manually in the console
  answer: 2
  explanation: |
    The AWS Load Balancer Controller creates an ALB (L7) for an Ingress and an NLB (L4)
    for a Service of type LoadBalancer, and in IP-target mode routes directly to pod
    IPs. Swapping them is wrong; Classic LB is legacy; manual creation is what the
    controller automates away.
  ref: concepts.md#load-balancer-integration-alb-and-nlb-target-groups
- id: aws-containers-ecs-eks-033
  difficulty: intermediate
  tags:
  - eks
  - upgrades
  - extended-support
  - cost
  question: |
    Your team is slow to upgrade Kubernetes and a cluster is now on a version past
    standard support. What is the cost consequence on EKS?
  options:
  - Nothing changes; support is unlimited at $0.10/hr
  - The cluster is deleted automatically
  - You must migrate to ECS
  - Extended support kicks in, raising the control-plane price to about $0.60/cluster/hour ($0.10 + $0.50)
  answer: 3
  explanation: |
    EKS standard support lasts ~14 months per version; afterwards extended support adds
    +$0.50/cluster/hour (total ~$0.60/hr) for roughly 12 more months. Clusters aren't
    auto-deleted and you aren't forced to ECS; the price is not unlimited at the base
    rate.
  ref: concepts.md#eks-managed-kubernetes-core-concepts
- id: aws-containers-ecs-eks-034
  difficulty: intermediate
  tags:
  - capacity-provider
  - fargate-spot
  - cost
  question: |
    You want a guaranteed baseline of tasks plus cheap burst capacity that tolerates
    interruption. Which ECS approach fits?
  options:
  - Run everything on Fargate Spot to minimize cost
  - 'Use a capacity provider strategy: a base count on FARGATE (on-demand) plus additional weighted capacity on
    FARGATE_SPOT'
  - Run everything on on-demand Fargate for simplicity
  - Disable auto scaling and over-provision
  answer: 1
  explanation: |
    A capacity provider strategy with a base on FARGATE and weighted overflow on
    FARGATE_SPOT gives a reliable baseline plus discounted, interruptible burst.
    All-Spot risks the baseline; all on-demand is costlier; over-provisioning wastes
    money.
  ref: concepts.md#scaling-ecs-service-auto-scaling-and-capacity-providers
- id: aws-containers-ecs-eks-035
  difficulty: intermediate
  tags:
  - multi-tenant
  - blast-radius
  - clusters
  question: |
    What is the fundamental trade-off between one large shared EKS cluster and many
    smaller clusters (per team/tenant)?
  options:
  - Shared clusters are always more reliable
  - Many clusters are always cheaper
  - There is no difference in blast radius
  - One shared cluster is cheaper and easier to operate but has a larger blast radius; many clusters isolate failures
    but multiply control-plane cost and upgrade/ops effort
  answer: 3
  explanation: |
    Sharing one cluster saves control-plane cost and centralizes ops but a bad
    change/noisy neighbor/API-server overload can hit everyone. Splitting into many
    clusters shrinks blast radius at the cost of N control planes ($0.10/hr each), N
    upgrades, and N add-on sets. The other options ignore this cost-vs-isolation
    tension.
  ref: concepts.md#blast-radius-multi-tenant-clusters-and-cell-based-design
- id: aws-containers-ecs-eks-036
  difficulty: intermediate
  tags:
  - ecs
  - execution-role
  - task-role
  question: |
    What is the difference between the ECS task execution role and the ECS task role?
  options:
  - They are the same thing with two names
  - The task role pulls images; the execution role is for the app
  - The execution role lets the agent/Fargate pull ECR images, fetch secrets, and write logs (infra); the task role
    is the identity the application assumes to call AWS APIs
  - Both are only used at build time
  answer: 2
  explanation: |
    The execution role is infrastructure-level (image pull, secrets injection, log
    writing) used by the agent/Fargate; the task role is the app's runtime identity for
    its own AWS calls. They are distinct, not swapped, and used at runtime not build
    time.
  ref: concepts.md#security-iam-roles-for-tasks-and-isolation
- id: aws-containers-ecs-eks-037
  difficulty: intermediate
  tags:
  - ecr
  - scanning
  - inspector
  question: |
    Which ECR feature provides continuous CVE scanning of both OS and language
    packages after images are pushed?
  options:
  - Enhanced scanning powered by Amazon Inspector (continuous, OS + language packages)
  - Basic scanning only, run once on push
  - Lifecycle policies
  - Pull-through cache
  answer: 0
  explanation: |
    Enhanced scanning integrates Amazon Inspector for continuous scanning across OS and
    application dependencies. Basic scanning is a single scan on push; lifecycle
    policies manage retention; pull-through cache mirrors upstream images.
  ref: concepts.md#ecr-the-container-image-registry
- id: aws-containers-ecs-eks-038
  difficulty: intermediate
  tags:
  - eks
  - fargate
  - limitations
  question: |
    Which limitation is specific to running pods on EKS with Fargate?
  options:
  - You can bin-pack many pods per node to save cost
  - One pod per micro-VM (no bin-packing), no DaemonSets (sidecars must be in-pod), no privileged containers, and
    no hostNetwork/hostPort
  - It supports GPUs natively
  - It requires no VPC networking
  answer: 1
  explanation: |
    EKS-on-Fargate runs one pod per node/micro-VM, so no bin-packing, no DaemonSets
    (put sidecars in the pod), no privileged mode, and no hostNetwork/hostPort. There's
    no bin-packing and no GPU support, and it still uses awsvpc networking.
  ref: concepts.md#fargate-vs-ec2-capacity-trade-offs
- id: aws-containers-ecs-eks-039
  difficulty: intermediate
  tags:
  - lock-in
  - portability
  - trade-offs
  question: |
    A stakeholder claims "choosing EKS eliminates AWS lock-in entirely." What is the
    most accurate response?
  options:
  - Correct — Kubernetes means zero AWS lock-in
  - EKS has more lock-in than ECS
  - EKS reduces orchestration lock-in via a conformant K8s API, but you still depend on AWS integrations (ALB controller,
    IRSA, VPC CNI, EBS/EFS CSI), so lock-in is reduced, not eliminated
  - Lock-in is irrelevant to service choice
  answer: 2
  explanation: |
    Kubernetes portability is real for workload specs, but production EKS leans on
    AWS-specific integrations, so migration still has cost. The honest answer is
    "reduced, not eliminated." Claiming zero lock-in overstates portability; ECS is
    generally more AWS-specific than EKS; and lock-in is a real design factor.
  ref: concepts.md#ecs-vs-eks-vs-self-managed-trade-offs
- id: aws-containers-ecs-eks-040
  difficulty: intermediate
  tags:
  - spot
  - interruption
  - resilience
  question: |
    What is the key constraint when running production workloads on Fargate Spot or
    EC2 Spot?
  options:
  - Spot instances never get reclaimed
  - Spot is more expensive than on-demand
  - Spot only works in a single AZ
  - Capacity can be reclaimed on ~2 minutes notice, so only interruptible/replicated workloads should run on Spot;
    keep an on-demand base for critical capacity
  answer: 3
  explanation: |
    Spot capacity is interruptible (~2-minute notice), so it suits fault-tolerant,
    replicated, or restartable work, with an on-demand baseline for must-run capacity.
    It can be reclaimed, it's cheaper not pricier, and it works across AZs.
  ref: concepts.md#failure-modes-and-how-the-design-degrades
- id: aws-containers-ecs-eks-041
  difficulty: advanced
  tags:
  - scaling
  - karpenter
  - cluster-autoscaler
  - trade-offs
  question: |
    A workload is highly heterogeneous (varied CPU/memory/GPU shapes) and spiky, and
    you want fast scale-out and aggressive cost consolidation with Spot
    diversification. Which node-scaling choice is best and why?
  options:
  - Karpenter, because it provisions right-sized nodes directly from EC2 (any type/size/AZ/Spot) in seconds and
    consolidates underused nodes, unlike ASG-bound Cluster Autoscaler
  - Cluster Autoscaler, because ASG-bound scaling is always faster
  - Manual node management, to guarantee control
  - EKS Fargate for every pod, to avoid node scaling entirely
  answer: 0
  explanation: |
    Karpenter is group-less: it picks best-fit instances across many types/AZs
    (including Spot) for pending pods and consolidates for cost — ideal for
    heterogeneous/spiky loads. Cluster Autoscaler is bound to predefined ASGs and
    slower/coarser. Manual management doesn't scale; per-pod Fargate removes
    bin-packing and can cost more for this profile.
  ref: concepts.md#scaling-eks-cluster-autoscaler-karpenter-and-auto-mode
- id: aws-containers-ecs-eks-042
  difficulty: advanced
  tags:
  - cell-based
  - blast-radius
  - deploy
  question: |
    To bound blast radius for a large multi-tenant platform and enable safe rollouts,
    which architectural pattern is most appropriate?
  options:
  - One giant cluster with a single global deployment for efficiency
  - Deploy to all cells simultaneously to reduce deploy time
  - 'Cell-based architecture: independent cells (each a full stack), route each customer/shard to one cell, and
    deploy cell-by-cell (waves) so a bad release hits one cell first'
  - Disable health checks to speed up rollout
  answer: 2
  explanation: |
    Cell-based design partitions load into independent full-stack cells; a failure or
    bad deploy is contained to one cell, and wave (cell-by-cell) deployments catch
    regressions before wide promotion. A single global deploy or all-at-once maximizes
    blast radius; disabling health checks hides failures.
  ref: concepts.md#blast-radius-multi-tenant-clusters-and-cell-based-design
- id: aws-containers-ecs-eks-043
  difficulty: advanced
  tags:
  - static-stability
  - az-failure
  - resilience
  question: |
    What does "static stability using Availability Zones" mean for a container fleet,
    and why does it matter during an AZ failure?
  options:
  - Run at exactly 100% utilization so no capacity is wasted
  - Keep all capacity in the cheapest single AZ
  - Rely on Karpenter to launch new nodes only after the AZ fails
  - Pre-provision enough capacity across AZs so that when one AZ fails you survive on the remaining AZs WITHOUT
    depending on a control-plane scale-up during the event
  answer: 3
  explanation: |
    Static stability means you don't depend on reactive scaling (which may itself be
    impaired) during a failure — you pre-provision headroom so surviving AZs absorb the
    load immediately. Running at 100% leaves no headroom; single-AZ is an SPOF;
    depending on post-failure scale-up is the fragility static stability avoids.
  ref: concepts.md#failure-modes-and-how-the-design-degrades
- id: aws-containers-ecs-eks-044
  difficulty: advanced
  tags:
  - mesh
  - sidecar
  - trade-offs
  question: |
    A team with only 5 services wants mTLS and retries and is considering deploying a
    full service mesh (Envoy sidecars) everywhere. What is the strongest trade-off
    argument to weigh?
  options:
  - A mesh has no overhead, so always deploy it
  - A mesh adds a sidecar proxy per task/pod (extra CPU/memory + a network hop + latency) and significant operational
    complexity; for a handful of services, ALB + Service Connect/Cloud Map is usually the better fit
  - A mesh is required for any TLS
  - Meshes reduce latency compared to direct calls
  answer: 1
  explanation: |
    A mesh delivers uniform L7 mTLS/retries/telemetry but costs a sidecar per workload
    (CPU/memory + hop + latency) and real ops complexity — often overkill at 5
    services, where ALB + Service Connect/Cloud Map suffices. Meshes add overhead
    rather than removing it, and TLS does not require a mesh.
  ref: concepts.md#service-mesh-app-mesh-service-connect-and-alternatives
- id: aws-containers-ecs-eks-045
  difficulty: advanced
  tags:
  - prefix-delegation
  - vpc-cni
  - capacity
  question: |
    An EKS node type supports a limited number of ENIs and IPs-per-ENI, capping max
    pods per node and burning subnet IPs. Which VPC CNI feature packs far more pods per
    node while conserving addressing complexity?
  options:
  - 'Prefix delegation: assign /28 IP prefixes to ENIs so each ENI backs many more pod IPs'
  - Disabling the VPC CNI entirely
  - Switching every pod to hostNetwork
  - Reducing the cluster to a single node
  answer: 0
  explanation: |
    Prefix delegation assigns /28 prefixes to ENIs, dramatically raising the
    max-pods-per-node ceiling from the default ENI x IP math. Disabling the CNI breaks
    pod networking; hostNetwork collapses isolation and port space; shrinking the
    cluster doesn't address density.
  ref: concepts.md#task-networking-awsvpc-mode-and-eni-limits
- id: aws-containers-ecs-eks-046
  difficulty: advanced
  tags:
  - fargate
  - cold-start
  - latency
  - trade-offs
  question: |
    A bursty, latency-sensitive service scales from 2 to 50 tasks in seconds during
    spikes and users notice slow first responses on new tasks. What is the most likely
    Fargate-related cause and a mitigation?
  options:
  - Fargate cold start (micro-VM boot + image pull) adds startup latency on new tasks; mitigate with smaller images,
    image caching, pre-warming/over-provisioning headroom, or predictive/scheduled scaling
  - The ALB is the bottleneck; remove it
  - IAM throttling; delete the task role
  - etcd compaction on the ECS control plane
  answer: 0
  explanation: |
    New Fargate tasks pay a cold-start cost (VM boot + pulling the image) that warm EC2
    hosts avoid. Slim images, caching, warm headroom, and predictive/scheduled scaling
    reduce it. The ALB isn't the cause; ECS has no etcd; removing the task role breaks
    the app, not latency.
  ref: concepts.md#fargate-vs-ec2-capacity-trade-offs
- id: aws-containers-ecs-eks-047
  difficulty: advanced
  tags:
  - gpu
  - ec2
  - fargate
  - ml
  question: |
    An ML inference service needs NVIDIA GPUs and a DaemonSet-style node monitoring
    agent. Which compute is appropriate and why?
  options:
  - Fargate, because it supports GPUs and DaemonSets
  - Lambda, because it's serverless
  - EC2 capacity (GPU instance families) under ECS or EKS, because Fargate does not offer GPUs, privileged host
    access, or DaemonSets
  - Any option works equally well
  answer: 2
  explanation: |
    Fargate has no GPU support and no DaemonSets/host-level agents, so GPU inference
    with a node agent requires EC2 GPU instances (with Karpenter/managed node groups on
    EKS, or the EC2 launch type on ECS). Fargate can't do it; Lambda has no GPUs and
    has time/size limits; the requirements make the choice non-trivial.
  ref: concepts.md#fargate-vs-ec2-capacity-trade-offs
- id: aws-containers-ecs-eks-048
  difficulty: advanced
  tags:
  - cost
  - tco
  - ops
  - estimation
  question: |
    When comparing Fargate vs EC2 total cost of ownership for a design review, which
    factor do candidates most often omit that changes the conclusion?
  options:
  - The color of the AWS console
  - The number of AZs, which has no cost impact
  - Whether the images are public or private
  - Operational cost (engineer time for patching, scaling, bin-packing, Spot handling) — including it can make Fargate
    cheaper overall for small teams / spiky loads even at a higher per-vCPU rate
  answer: 3
  explanation: |
    TCO isn't just the AWS sticker price — engineer time to run EC2 capacity is real,
    so Fargate can win overall for small teams or spiky loads despite a higher per-vCPU
    price. Console color is irrelevant; AZs do affect cost (cross-AZ transfer); image
    visibility is a minor factor here.
  ref: concepts.md#cost-reasoning-and-capacity-estimation
- id: aws-containers-ecs-eks-049
  difficulty: advanced
  tags:
  - eni-trunking
  - density
  - ecs
  question: |
    To increase the number of awsvpc-mode tasks you can pack onto each ECS EC2
    instance, which account setting should you enable?
  options:
  - Turn off awsvpc mode and use host mode for everything
  - awsvpcTrunking (ENI trunking), which attaches a trunk ENI to multiply tasks-per-instance on supported types
  - Increase the ALB idle timeout
  - Enable cross-region replication in ECR
  answer: 1
  explanation: |
    ENI trunking (awsvpcTrunking) adds a trunk interface so supported instance types
    run many more awsvpc tasks, raising density without abandoning per-task ENIs.
    Switching to host mode loses per-task SGs and risks port conflicts; ALB timeout and
    ECR replication are unrelated to task density.
  ref: concepts.md#task-networking-awsvpc-mode-and-eni-limits
- id: aws-containers-ecs-eks-050
  difficulty: advanced
  tags:
  - region-failure
  - multi-region
  - dr
  question: |
    Which failure does a well-architected single-region, multi-AZ ECS/EKS design NOT
    tolerate, and what is required to handle it?
  options:
  - A single task crash — nothing more is needed
  - An AZ outage — you need to move to a single AZ
  - A single container OOM — you need a new region
  - A full AWS Region outage — you need a multi-region design (active/active or warm standby) with ECR cross-region
    replication, replicated data, and Route 53 failover/latency routing
  answer: 3
  explanation: |
    Multi-AZ survives task, host, and AZ failures but not a whole-region outage; that
    requires multi-region architecture (image replication, data replication, DNS
    failover). Task crashes and OOM are handled by the scheduler; an AZ outage is
    handled by multi-AZ, not by collapsing to one AZ.
  ref: concepts.md#failure-modes-and-how-the-design-degrades
- id: aws-containers-ecs-eks-051
  difficulty: advanced
  tags:
  - service-connect
  - telemetry
  - resilience
  question: |
    Compared to putting an ALB between every pair of internal services, what does ECS
    Service Connect give you for east-west traffic, and at what cost?
  options:
  - Nothing different; it is identical to an ALB
  - It eliminates all network latency
  - A logical service namespace with client-side load balancing, retries, and rich telemetry via a managed proxy
    sidecar — avoiding an ALB hop/cost per pair — at the cost of a sidecar's CPU/memory and a small latency hop
  - It removes the need for IAM
  answer: 2
  explanation: |
    Service Connect provides managed east-west connectivity (naming, client-side LB,
    retries, metrics) without an ALB between every service, trading in a sidecar
    proxy's resource overhead and a small hop. It's not identical to an ALB, can't
    remove latency, and doesn't replace IAM.
  ref: concepts.md#service-discovery-with-cloud-map-and-ecs-service-connect
- id: aws-containers-ecs-eks-052
  difficulty: advanced
  tags:
  - eks
  - api-server
  - blast-radius
  - scale
  question: |
    On a very large shared EKS cluster, teams report intermittent slow kubectl and
    controller errors as object counts and controllers grow. What is the systemic risk
    and mitigation?
  options:
  - The API server / etcd can become a bottleneck under too many objects/controllers (a shared blast radius); mitigate
    by splitting workloads across clusters, limiting objects/watchers, and applying resource quotas
  - The ALB is undersized; add more listeners
  - ECR is throttling; delete images
  - Fargate is required for all pods
  answer: 0
  explanation: |
    A single shared control plane can be overwhelmed by object/controller sprawl,
    impacting everyone (large blast radius). Splitting into multiple clusters, curbing
    watchers/objects, and quotas help. It's a control-plane concern, not an ALB, ECR,
    or Fargate issue.
  ref: concepts.md#blast-radius-multi-tenant-clusters-and-cell-based-design
- id: aws-containers-ecs-eks-053
  difficulty: advanced
  tags:
  - ecr
  - replication
  - multi-region
  - trade-offs
  question: |
    You deploy the same service to us-east-1 and eu-west-1 and want fast, resilient
    image pulls in both. What is the correct ECR approach and its trade-off?
  options:
  - Pull all images cross-region from a single us-east-1 repo, accepting the latency
  - Enable ECR cross-region replication so each region has a local copy — faster pulls and regional resilience —
    at the cost of extra storage and slight replication lag on new pushes
  - Store images in a single S3 bucket and pull with the CLI
  - Rebuild images independently in each region every deploy
  answer: 1
  explanation: |
    Cross-region replication gives each region a local repo copy for low-latency,
    resilient pulls, costing extra storage and a small propagation lag after a push.
    Cross-region pulls from one repo add latency and a regional SPOF; raw S3 loses
    registry features; rebuilding per region risks drift and wastes effort.
  ref: concepts.md#ecr-the-container-image-registry
- id: aws-containers-ecs-eks-054
  difficulty: advanced
  tags:
  - keda
  - event-driven
  - scaling
  question: |
    An EKS worker service should scale on the depth of an SQS queue rather than CPU.
    Which component enables this event-driven pod autoscaling?
  options:
  - Cluster Autoscaler alone
  - The AWS Load Balancer Controller
  - KEDA (Kubernetes Event-Driven Autoscaling), which drives the HPA from external metrics like queue depth
  - ECR lifecycle policies
  answer: 2
  explanation: |
    KEDA scales pods on external event sources (e.g., SQS queue length), feeding the
    HPA — far better than CPU for queue workers. Cluster Autoscaler scales nodes, not
    pods on queue depth; the LB controller and ECR policies are unrelated to
    event-driven scaling.
  ref: concepts.md#scaling-eks-cluster-autoscaler-karpenter-and-auto-mode
- id: aws-containers-ecs-eks-055
  difficulty: advanced
  tags:
  - nlb
  - ip-target
  - kube-proxy
  - performance
  question: |
    Why might you configure the AWS Load Balancer Controller to use IP-target mode
    (targeting pod IPs) for an NLB instead of instance/NodePort mode?
  options:
  - It requires more network hops
  - It only works with Classic Load Balancers
  - It disables health checks
  - IP-target mode routes traffic straight to pod IPs, bypassing the extra NodePort/kube-proxy hop, reducing latency
    and avoiding uneven load from node-level balancing
  answer: 3
  explanation: |
    IP-target mode sends traffic directly to pod IPs, removing the NodePort/kube-proxy
    indirection and its extra hop and load-distribution quirks. It reduces rather than
    increases hops, works with ALB/NLB not Classic, and doesn't disable health checks.
  ref: concepts.md#load-balancer-integration-alb-and-nlb-target-groups
- id: aws-containers-ecs-eks-056
  difficulty: advanced
  tags:
  - vpc-lattice
  - cross-account
  - mesh-alternative
  question: |
    You need to connect services across multiple VPCs and accounts spanning ECS, EKS,
    Lambda, and EC2, with auth and observability, but you want to avoid running per-pod
    sidecars. Which AWS option fits?
  options:
  - Amazon VPC Lattice, an application networking layer that connects services across VPCs/accounts and compute
    types with auth and observability, without per-pod sidecars
  - AWS App Mesh, doubling down on sidecars
  - A single giant ALB shared by all accounts
  - Classic Load Balancer peering
  answer: 0
  explanation: |
    VPC Lattice provides cross-VPC/cross-account service networking with auth and
    telemetry and no per-pod sidecar. App Mesh is sidecar-based and sunsetting; a shared
    ALB doesn't provide cross-account service identity/networking cleanly; Classic LB
    peering isn't a thing.
  ref: concepts.md#service-mesh-app-mesh-service-connect-and-alternatives
- id: aws-containers-ecs-eks-057
  difficulty: advanced
  tags:
  - migration
  - app-mesh
  - service-connect
  question: |
    An existing ECS platform runs on AWS App Mesh today. Given the end-of-support date,
    what is the recommended migration target and rationale?
  options:
  - Do nothing; App Mesh will be supported indefinitely
  - Migrate to Classic Load Balancers
  - Migrate east-west traffic to Amazon ECS Service Connect (AWS's recommended successor), because App Mesh support
    ends 2026-09-30 and console/resources become inaccessible after that
  - Rewrite everything on Lambda
  answer: 2
  explanation: |
    AWS explicitly guides App Mesh users to migrate to ECS Service Connect, since App
    Mesh reaches end of support on 2026-09-30 (console/resources become inaccessible
    afterward). Doing nothing risks a broken mesh; Classic LBs aren't a mesh; a Lambda
    rewrite is unrelated overkill.
  ref: concepts.md#service-mesh-app-mesh-service-connect-and-alternatives
- id: aws-containers-ecs-eks-058
  difficulty: advanced
  tags:
  - scaling
  - two-layer
  - fargate-vs-ec2
  question: |
    Why is autoscaling "simpler" on Fargate than on ECS/EKS with EC2 capacity?
  options:
  - Fargate does not autoscale at all
  - EC2 has no scaling controls
  - Fargate uses a single node for everything
  - Fargate collapses two scaling problems (scale tasks/pods AND scale hosts) into one (just scale tasks/pods),
    since there is no host layer to manage — but you lose bin-packing
  answer: 3
  explanation: |
    With Fargate there's no host tier, so you only scale tasks/pods — no capacity
    provider/ASG/Karpenter tuning — at the cost of no bin-packing. Fargate does
    autoscale; EC2 has rich scaling controls; Fargate isn't one shared node.
  ref: concepts.md#scaling-ecs-service-auto-scaling-and-capacity-providers
- id: aws-containers-ecs-eks-059
  difficulty: advanced
  tags:
  - graviton
  - arm64
  - cost
  - fargate
  question: |
    A cost-conscious team wants better price-performance for a CPU-bound stateless
    service on Fargate. Which lever should they pull first, and what is the caveat?
  options:
  - Switch to Windows containers for efficiency
  - Use ARM64 (Graviton) via the task runtimePlatform for better price-performance, with the caveat that all images/dependencies
    must support arm64
  - Request 64 vCPU tasks
  - Disable the task role to save CPU
  answer: 1
  explanation: |
    Graviton/ARM64 on Fargate typically improves price-performance for many workloads;
    the caveat is you must build multi-arch images and ensure all dependencies support
    arm64. Windows is heavier not cheaper; 64 vCPU exceeds Fargate's 16-vCPU max;
    disabling the task role breaks AWS access, not CPU.
  ref: concepts.md#fargate-vs-ec2-capacity-trade-offs
- id: aws-containers-ecs-eks-060
  difficulty: advanced
  tags:
  - privatelink
  - vpc-endpoint
  - nat
  - cost
  question: |
    Fargate tasks in private subnets pull images from ECR and the design currently
    routes that traffic through a NAT gateway, incurring per-GB processing charges.
    What is a better approach?
  options:
  - Add VPC (PrivateLink) endpoints for ECR (api and dkr) and S3 (gateway endpoint) so image pulls stay on the AWS
    network, avoiding NAT data-processing cost
  - Move tasks to public subnets with public IPs
  - Disable image scanning to reduce pulls
  - Switch to a Classic Load Balancer
  answer: 0
  explanation: |
    VPC endpoints for ECR (api + dkr) plus an S3 gateway endpoint let private tasks pull
    images without traversing a NAT gateway, cutting NAT data-processing costs and
    improving security. Public subnets increase exposure; scanning is unrelated to pull
    routing; a Classic LB is irrelevant.
  ref: concepts.md#cost-reasoning-and-capacity-estimation
- id: aws-containers-ecs-eks-061
  difficulty: advanced
  tags:
  - deploy
  - blue-green
  - canary
  - codedeploy
  question: |
    You want to shift 5% of production traffic to a new ECS revision, observe metrics,
    then ramp to 100%, with instant rollback if error rates spike. Which mechanism
    supports this?
  options:
  - Blue/green deployment via CodeDeploy with two target groups and weighted traffic shifting (canary), enabling
    fast rollback by shifting back to the old target group
  - Rolling update with minimumHealthyPercent only
  - Setting desired count to 0 then back to N
  - Deleting the old task definition before deploying
  answer: 0
  explanation: |
    CodeDeploy blue/green with two target groups shifts a weighted canary slice, lets
    you validate, then ramps — and rollback is just shifting traffic back to the stable
    target group. A rolling update doesn't do weighted canary the same way; zeroing
    count causes an outage; deleting the old definition removes your rollback target.
  ref: concepts.md#failure-modes-and-how-the-design-degrades
- id: aws-containers-ecs-eks-062
  difficulty: advanced
  tags:
  - eks
  - auto-mode
  - node-lifetime
  - trade-offs
  question: |
    A security-conscious team likes that EKS Auto Mode uses immutable nodes with a
    21-day maximum lifetime and no SSH/SSM access. What is the main trade-off they
    accept?
  options:
  - Nodes never get patched
  - The control plane becomes free
  - They give up low-level node control (no SSH, AWS-chosen AMIs/lifecycle) and pay an Auto Mode management fee
    on top of EC2, in exchange for AWS running the data plane
  - They can no longer use Kubernetes-compatible tools
  answer: 2
  explanation: |
    Auto Mode trades hands-off, secure, frequently-recycled nodes for reduced low-level
    control (no SSH, AWS-managed AMIs and 21-day recycling) plus a management fee over
    EC2 costs. Nodes ARE patched/recycled; the control plane still costs $0.10/hr; you
    keep Kubernetes-compatible tooling.
  ref: concepts.md#scaling-eks-cluster-autoscaler-karpenter-and-auto-mode
- id: aws-containers-ecs-eks-063
  difficulty: advanced
  tags:
  - estimation
  - capacity
  - fargate
  question: |
    A service needs 20 tasks each requesting 1 vCPU and 2 GB, running continuously.
    Roughly what vCPU-hours and GB-hours per day does Fargate bill (ignoring
    cold-start)?
  options:
  - 20 vCPU-hours and 40 GB-hours per day
  - 24 vCPU-hours and 48 GB-hours per day
  - It is free because Fargate has no compute charge
  - 480 vCPU-hours and 960 GB-hours per day (20 vCPU x 24h; 40 GB x 24h)
  answer: 3
  explanation: |
    20 tasks x 1 vCPU = 20 vCPU continuously → 20 x 24 = 480 vCPU-hours/day; 20 x 2 = 40
    GB → 40 x 24 = 960 GB-hours/day. Fargate bills per vCPU-second and GB-second. The
    other figures drop the 24-hour multiplier, and Fargate is not free.
  ref: concepts.md#cost-reasoning-and-capacity-estimation
- id: aws-containers-ecs-eks-064
  difficulty: advanced
  tags:
  - ecs
  - deployment-circuit-breaker
  - safety
  question: |
    What does the ECS deployment circuit breaker do?
  options:
  - It throttles inbound requests when a service is overloaded
  - It automatically detects a failing deployment (tasks that can't reach a healthy/steady state) and rolls the
    service back to the last known-good task set
  - It opens the security group during deploys
  - It breaks the connection to the ALB during scaling
  answer: 1
  explanation: |
    The deployment circuit breaker watches a rollout; if new tasks repeatedly fail to
    stabilize, it fails the deployment and (optionally) auto-rolls back to the previous
    stable version. It is not a request rate limiter, a security-group action, or an LB
    disconnect.
  ref: concepts.md#failure-modes-and-how-the-design-degrades
- id: aws-containers-ecs-eks-065
  difficulty: advanced
  tags:
  - eks
  - network-policy
  - isolation
  question: |
    To restrict which pods can talk to which on EKS (defense in depth beyond security
    groups), what should you use?
  options:
  - ECR lifecycle policies
  - ALB path rules
  - Task placement constraints
  - Kubernetes NetworkPolicies (enforced by the VPC CNI network policy engine or Calico)
  answer: 3
  explanation: |
    NetworkPolicies define allowed pod-to-pod/namespace traffic and are enforced by the
    VPC CNI's network policy feature or Calico. ECR policies govern images; ALB path
    rules are north-south routing; task placement constraints are an ECS scheduling
    concept, not pod-level segmentation.
  ref: concepts.md#security-iam-roles-for-tasks-and-isolation
- id: aws-containers-ecs-eks-066
  difficulty: expert
  tags:
  - ecs
  - eks
  - judgment
  - portability
  - ecosystem
  question: |
    A platform team runs 200+ microservices, has deep Kubernetes expertise, relies on
    Helm charts and operators (e.g., an operator-based database), and wants the option
    to burst to another cloud. Leadership pushes ECS to "reduce ops." What is the most
    defensible recommendation?
  options:
  - Migrate everything to ECS to cut ops cost, rewriting all operator functionality by hand
  - Move to self-managed Kubernetes for maximum control
  - Stay on EKS (add Karpenter, or Auto Mode to reduce data-plane ops); the ecosystem dependence (operators/Helm),
    scale, existing K8s expertise, and portability requirement outweigh ECS's lower base ops
  - Split half the services to ECS and half to EKS to hedge
  answer: 2
  explanation: |
    Operators/CRDs, 200+ services, K8s skills, and a portability requirement are exactly
    what EKS is for; Karpenter/Auto Mode addresses the ops concern without abandoning
    the ecosystem. Rewriting operators for ECS is huge undifferentiated work;
    self-managed adds ops with no upside; splitting doubles the operating model for no
    clear benefit.
  ref: concepts.md#ecs-vs-eks-vs-self-managed-trade-offs
- id: aws-containers-ecs-eks-067
  difficulty: expert
  tags:
  - scaling
  - hpa
  - karpenter
  - interaction
  question: |
    On EKS with HPA and Karpenter, during a sudden spike pods go Pending and stay
    unscheduled for a while before capacity appears. Which explanation and tuning is
    most accurate?
  options:
  - HPA increases pod replicas, which then sit Pending until Karpenter observes them and provisions right-sized
    nodes; total latency = HPA reaction + Karpenter provisioning + node/kubelet ready + image pull. Mitigate with
    warm headroom (over-provisioning/low-priority pause pods), faster metrics, and slimmer images
  - HPA scales nodes and Karpenter scales pods; swap their roles
  - The control plane must be resized; contact AWS
  - Karpenter cannot use Spot, so it is always slow
  answer: 0
  explanation: |
    HPA scales replicas; new pods are Pending until Karpenter provisions nodes and they
    become Ready and pull images — a multi-stage latency chain. Warm headroom (pause
    pods), faster metric scraping, and small images cut the gap. HPA/Karpenter roles
    aren't swapped; the control plane isn't the issue; Karpenter does support Spot.
  ref: concepts.md#scaling-eks-cluster-autoscaler-karpenter-and-auto-mode
- id: aws-containers-ecs-eks-068
  difficulty: expert
  tags:
  - limits
  - quotas
  - fargate
  - judgment
  question: |
    A design plans to launch 10,000 concurrent Fargate tasks in one region during a
    flash event. Which limit is MOST likely to bite first, and what is the right
    action?
  options:
  - The 400 KB task-definition size limit; shrink the JSON
  - Regional Fargate service quotas (e.g., concurrent running task / vCPU limits) and transient capacity errors;
    request quota increases ahead of time and implement retry with backoff for capacity errors
  - The ALB 29-second timeout; raise it to 5 minutes
  - The EKS control-plane cost; switch to ECS
  answer: 1
  explanation: |
    At 10k concurrent tasks you hit regional Fargate service quotas and can see
    transient capacity errors, so pre-request quota increases and use backoff/retry.
    Task-def size is unrelated to concurrency; the ALB timeout isn't a launch-count
    limit and can't be raised to 5 min; control-plane cost doesn't block launches.
  ref: concepts.md#failure-modes-and-how-the-design-degrades
- id: aws-containers-ecs-eks-069
  difficulty: expert
  tags:
  - multi-tenant
  - isolation
  - cost
  - judgment
  question: |
    A regulated multi-tenant platform must guarantee that a compromise or noisy
    neighbor in one tenant cannot affect others, while keeping cost reasonable. Which
    design best balances isolation and cost?
  options:
  - One shared cluster, one namespace per tenant, no quotas — cheapest
  - Give every tenant cluster-admin to reduce support tickets
  - Per-tenant isolation via cells (or dedicated node groups/clusters) with Fargate for untrusted workloads, resource
    quotas, NetworkPolicies, and per-tenant IAM — accepting higher cost for strong blast-radius containment and
    compliance
  - Run all tenants in a single privileged pod for density
  answer: 2
  explanation: |
    Regulated strong-isolation needs argue for cell/tenant separation, Fargate micro-VM
    isolation for untrusted work, quotas, NetworkPolicies, and per-tenant IAM — trading
    cost for compliance and small blast radius. A shared namespace with no quotas leaks
    noisy-neighbor/security risk; cluster-admin for all and a single privileged pod are
    severe security anti-patterns.
  ref: concepts.md#blast-radius-multi-tenant-clusters-and-cell-based-design
- id: aws-containers-ecs-eks-070
  difficulty: expert
  tags:
  - primary-tradeoff
  - ecs
  - eks
  - judgment
  question: |
    What is the PRIMARY trade-off a team accepts when choosing ECS over EKS for a new
    AWS-native platform?
  options:
  - Higher control-plane cost in exchange for portability
  - Worse AWS integration in exchange for cheaper compute
  - Mandatory service mesh in exchange for simpler networking
  - Lower operational burden and a smaller learning surface (no K8s to operate) in exchange for the Kubernetes ecosystem
    (operators/Helm/CRDs) and multi-cloud portability
  answer: 3
  explanation: |
    ECS's core trade-off vs EKS is simplicity and low ops (and no control-plane fee) at
    the price of the Kubernetes ecosystem and portability. ECS is cheaper on control
    plane not costlier; ECS has excellent AWS integration; neither mandates a mesh.
  ref: concepts.md#trade-offs-and-when-to-use-what
- id: aws-containers-ecs-eks-071
  difficulty: expert
  tags:
  - failure
  - degradation
  - judgment
  question: |
    An ECS service runs 30 tasks spread across 3 AZs behind an ALB, with service auto
    scaling and static-stability headroom. One AZ suffers a full outage. How should the
    system degrade if designed well, and what would BREAK the graceful degradation?
  options:
  - It should lose ~1/3 of tasks; the ALB stops routing to the dead AZ and remaining AZs absorb load thanks to pre-provisioned
    headroom. Graceful degradation breaks if you lacked headroom or depended on a control-plane scale-up during
    the event
  - It should fail entirely; nothing can survive an AZ loss
  - It should automatically fail over to another region with no configuration
  - It should scale down to save cost during the outage
  answer: 0
  explanation: |
    Multi-AZ + static stability means an AZ loss drops ~1/3 of capacity while the ALB
    routes only to healthy targets and pre-provisioned headroom absorbs the rest — no
    dependence on reactive scaling mid-failure. It doesn't fail entirely, won't cross
    regions without setup, and shouldn't scale down under load.
  ref: concepts.md#failure-modes-and-how-the-design-degrades
- id: aws-containers-ecs-eks-072
  difficulty: expert
  tags:
  - cost
  - spot
  - savings-plan
  - judgment
  question: |
    For a large EKS platform mixing steady baseline and spiky/interruptible batch,
    which cost strategy is most defensible?
  options:
  - All on-demand EC2, for simplicity
  - All Spot for everything, including critical baseline
  - Cover the steady baseline with Compute Savings Plans / Reserved capacity and run spiky, interruptible batch
    on diversified Spot (via Karpenter), keeping an on-demand fallback for must-run capacity
  - All Fargate on-demand, ignoring EC2 discounts
  answer: 2
  explanation: |
    The mature pattern is Savings Plans/RIs for the predictable baseline plus
    diversified Spot (Karpenter picks across pools) for interruptible batch, with an
    on-demand safety net. All on-demand and all Fargate on-demand forgo big discounts;
    all-Spot including baseline risks reclaiming critical capacity.
  ref: concepts.md#cost-reasoning-and-capacity-estimation
- id: aws-containers-ecs-eks-073
  difficulty: expert
  tags:
  - self-managed
  - anti-pattern
  - judgment
  question: |
    When is running self-managed Kubernetes on EC2 (kubeadm/kOps) genuinely justified
    over EKS?
  options:
  - Almost always, because it is cheaper
  - Whenever you want the Kubernetes API
  - Whenever you need autoscaling
  - Rarely — only for hard requirements like a custom scheduler, bleeding-edge/unsupported K8s versions, air-gapped
    constraints, or control EKS cannot provide; otherwise it is undifferentiated heavy lifting
  answer: 3
  explanation: |
    Self-managing the control plane (etcd, API server, upgrades, HA) is heavy
    undifferentiated work; it's justified only by specific hard requirements EKS can't
    meet. It's not generally cheaper once ops time is counted; EKS already gives the
    Kubernetes API and autoscaling via Karpenter/CA.
  ref: concepts.md#ecs-vs-eks-vs-self-managed-trade-offs
- id: aws-containers-ecs-eks-074
  difficulty: expert
  tags:
  - networking
  - awsvpc
  - security-group
  - judgment
  question: |
    A compliance requirement mandates a distinct security group per microservice and
    per-workload VPC Flow Log visibility. Which container networking choice satisfies
    this natively, and what is the design cost?
  options:
  - bridge mode on shared hosts, since it is simplest
  - awsvpc mode / VPC CNI (each task/pod gets its own ENI, IP, and security group and appears in VPC Flow Logs)
    — at the cost of ENI/IP planning (trunking / prefix delegation to sustain density)
  - host mode, to share the host's security group
  - none mode, to disable networking
  answer: 1
  explanation: |
    awsvpc/VPC CNI gives each workload its own ENI, IP, and security group with per-task
    flow-log visibility — exactly the compliance need — but you must plan ENIs/IPs
    (trunking, prefix delegation) to keep density. bridge and host modes share the
    host's SG and can't provide per-task SGs; none disables networking.
  ref: concepts.md#task-networking-awsvpc-mode-and-eni-limits
- id: aws-containers-ecs-eks-075
  difficulty: expert
  tags:
  - hybrid
  - eks-anywhere
  - outposts
  - judgment
  question: |
    A company needs to run Kubernetes workloads on-premises (data-residency) with a
    consistent operating model to their AWS clusters. Which option aligns best?
  options:
  - EKS with hybrid options (EKS Anywhere on-prem / EKS on Outposts) to keep a consistent Kubernetes operating model
    across cloud and on-prem, accepting added complexity and that on-prem lacks the fully managed AWS control plane
  - ECS, because it runs anywhere
  - Self-managed Kubernetes only, with no AWS tie-in
  - Fargate on-premises
  answer: 0
  explanation: |
    EKS's hybrid story (EKS Anywhere, Outposts) preserves a consistent Kubernetes
    operating model across on-prem and AWS for data-residency needs, at the cost of more
    complexity and a different management/support model on-prem. ECS isn't a general
    on-prem K8s solution; pure self-managed drops AWS consistency; Fargate is not
    available on-prem.
  ref: concepts.md#ecs-vs-eks-vs-self-managed-trade-offs
