topic: Security, Authentication and Data Protection
domain: system-design
topic_slug: security-authentication-data-protection
version: 1
questions:
- id: security-authentication-data-protection-001
  difficulty: beginner
  tags:
  - authn
  - authz
  - basics
  question: |
    What is the core difference between authentication and authorization?
  options:
  - Authentication proves who the user is; authorization decides what the user may do
  - They are two names for the same identity check performed once at login
  - Authentication applies to services while authorization applies only to humans
  - Authentication decides what a user may do; authorization proves who the user is
  answer: 0
  explanation: |
    AuthN proves identity ("who are you?"); authZ decides permissions ("what may you
    do?"). Option 3 reverses them. Option 1 is wrong: they are distinct stages (authN
    once, authZ on each action). Option 2 invents a human/service distinction that does
    not exist — both apply to any principal.
  ref: concepts.md#authentication-versus-authorization
- id: security-authentication-data-protection-002
  difficulty: beginner
  tags:
  - authn
  - http
  - status-codes
  question: |
    A request arrives with a missing or invalid credential. Which HTTP status best
    represents this, and what does it actually mean?
  options:
  - 302 Found — redirect the user to log in again
  - 403 Forbidden — the user is authenticated but not permitted
  - 401 Unauthorized — despite the name, it signals the request is unauthenticated
  - 400 Bad Request — the credential format was malformed
  answer: 2
  explanation: |
    401 (confusingly named) means unauthenticated: identity is missing or invalid. 403
    means authenticated but not allowed (1). 400 is a generic malformed request (3), and
    302 is a redirect, not the semantic status for a failed credential (0).
  ref: concepts.md#authentication-versus-authorization
- id: security-authentication-data-protection-003
  difficulty: beginner
  tags:
  - sessions
  - tokens
  - basics
  question: |
    What fundamentally distinguishes a server-side session from a self-contained JWT?
  options:
  - A session is encrypted while a JWT is always sent in plaintext with no protection
  - A JWT requires a database lookup on every request while a session never does
  - Sessions work only for mobile apps and JWTs only for web browsers
  - A session stores state server-side and hands the client an opaque ID; a JWT carries signed state the
    client holds
  answer: 3
  explanation: |
    Sessions keep state on the server (client holds an opaque handle); a JWT is signed
    state the client carries, verifiable without a lookup. Option 1 reverses reality
    (sessions need the lookup). Option 0 is wrong — a JWT is signed (integrity), not
    necessarily encrypted, and sessions are not inherently encrypted. Option 2 is
    fabricated.
  ref: concepts.md#sessions-versus-tokens
- id: security-authentication-data-protection-004
  difficulty: beginner
  tags:
  - jwt
  - structure
  question: |
    Which statement about a standard signed JWT is correct?
  options:
  - Its payload is signed but not encrypted, so anyone holding the token can read the claims
  - It cannot contain an expiry, so tokens live forever
  - It is validated only by calling the issuing server's introspection endpoint
  - Its payload is encrypted, so clients cannot read the claims
  answer: 0
  explanation: |
    A standard JWT (JWS) is base64-encoded and signed for integrity, NOT encrypted —
    claims are readable by anyone (use JWE to hide them). Option 3 is the common
    misconception. Option 1 is false (the exp claim exists). Option 2 describes opaque
    tokens; a JWT is verified locally via signature.
  ref: concepts.md#jwt-structure-signing-and-pitfalls
- id: security-authentication-data-protection-005
  difficulty: beginner
  tags:
  - password-hashing
  - basics
  question: |
    Why should passwords be stored using bcrypt or Argon2id rather than SHA-256?
  options:
  - SHA-256 output is too long to store efficiently in a database
  - bcrypt and Argon2id are deliberately slow and salted, making large-scale cracking impractical
  - SHA-256 cannot be salted, whereas bcrypt automatically encrypts the password
  - bcrypt and Argon2id are reversible, so you can recover a forgotten password
  answer: 1
  explanation: |
    Password hashes must be slow (and salted) so attackers cannot try billions/sec on a
    dump; bcrypt/Argon2id are designed for this. SHA-256 is fast → wrong for passwords.
    Option 2 is false (you can salt SHA, and hashing is not encryption). Option 3 is
    dangerously wrong — password hashes are one-way, not reversible.
  ref: concepts.md#password-hashing-and-credential-storage
- id: security-authentication-data-protection-006
  difficulty: beginner
  tags:
  - encryption
  - transit
  - tls
  question: |
    What does "encryption in transit" primarily protect against?
  options:
  - A user forgetting their password
  - Theft of backup disks from a data center
  - Eavesdropping and tampering of data as it travels over a network
  - A compromised application server reading its own database
  answer: 2
  explanation: |
    Encryption in transit (TLS) protects data moving over the network from interception
    and modification. Option 1 is encryption at rest. Option 3 is not solved by transit
    encryption (the app legitimately holds the plaintext). Option 0 is unrelated.
  ref: concepts.md#encryption-in-transit
- id: security-authentication-data-protection-007
  difficulty: beginner
  tags:
  - mfa
  - basics
  question: |
    Multi-factor authentication combines factors from different categories. Which set
    correctly lists the three canonical categories?
  options:
  - A username, a password, and an email address
  - A firewall, a VPN, and a WAF
  - Encryption, hashing, and tokenization
  - Something you know, something you have, something you are
  answer: 3
  explanation: |
    MFA factors are knowledge (password), possession (phone/security key), and
    inherence (biometric). Option 0 lists three knowledge-type items (not multi-factor).
    Options 1 and 2 are network/data controls, not authentication factors.
  ref: concepts.md#multi-factor-authentication
- id: security-authentication-data-protection-008
  difficulty: beginner
  tags:
  - secrets
  - basics
  question: |
    Where should application secrets like database passwords be kept?
  options:
  - In client-side JavaScript so the browser can connect directly to the database
  - Hardcoded in source code so they are always available at build time
  - In a secrets manager (e.g., Vault, AWS Secrets Manager), fetched at runtime via an authenticated identity
  - In a public README so the whole team can find them quickly
  answer: 2
  explanation: |
    Secrets belong in a secrets manager with IAM-controlled access, rotation, and
    audit. Hardcoding (1) leaks via the repo/images; a README (3) is public exposure;
    client-side (0) exposes secrets to every user. Only option 2 follows least-privilege
    and rotation practices.
  ref: concepts.md#secrets-management
- id: security-authentication-data-protection-009
  difficulty: beginner
  tags:
  - owasp
  - injection
  question: |
    What is the most effective root-cause defense against SQL injection?
  options:
  - Using parameterized queries / prepared statements so input is never interpreted as SQL
  - Renaming database tables to unpredictable names
  - Blocking the word SELECT at the load balancer
  - Hiding database error messages from users
  answer: 0
  explanation: |
    Parameterized queries separate code from data so user input can never be executed
    as SQL — the durable fix. Hiding errors (3) is defense in depth, not a fix.
    Renaming tables (1) is security by obscurity. Keyword blocking (2) is brittle and
    bypassable. Only option 0 addresses the root cause.
  ref: concepts.md#owasp-top-10-and-common-vulnerabilities
- id: security-authentication-data-protection-010
  difficulty: beginner
  tags:
  - oauth
  - oidc
  - basics
  question: |
    What does OpenID Connect (OIDC) add on top of OAuth 2.0?
  options:
  - It removes the need for an authorization server
  - It converts all access tokens into opaque tokens automatically
  - It replaces TLS with a proprietary encryption scheme
  - It adds an ID token and standardized identity claims, turning delegated authorization into authentication
  answer: 3
  explanation: |
    OAuth 2.0 is delegated authorization; OIDC layers authentication on top by adding an
    ID token (a JWT describing the user) — this powers "Sign in with Google". Option 2
    is invented, option 0 is false (OIDC still uses the auth server), and option 1 is
    unrelated to OIDC's purpose.
  ref: concepts.md#oauth-20-and-openid-connect-flows
- id: security-authentication-data-protection-011
  difficulty: beginner
  tags:
  - rbac
  - basics
  question: |
    In Role-Based Access Control (RBAC), permissions are granted based on what?
  options:
  - The roles assigned to a user (e.g., admin, editor), which bundle permissions
  - The relationship graph between users and individual objects
  - The user's IP address reputation score
  - Runtime attributes like the user's location and the time of day
  answer: 0
  explanation: |
    RBAC assigns permissions to roles and roles to users. Option 3 describes ABAC,
    option 1 describes ReBAC (Zanzibar-style), and option 2 is a network-reputation
    signal, not an access-control model.
  ref: concepts.md#rbac-versus-abac-and-modern-authorization
- id: security-authentication-data-protection-012
  difficulty: beginner
  tags:
  - zero-trust
  - basics
  question: |
    What is the central principle of a zero-trust architecture?
  options:
  - Encrypt the perimeter firewall and allow free movement behind it
  - Anything inside the corporate network perimeter is automatically trusted
  - Never trust, always verify — authenticate and authorize every request regardless of network location
  - Trust is established once at VPN login and never re-checked
  answer: 2
  explanation: |
    Zero trust removes implicit network trust: every request is verified regardless of
    origin. Options 0, 1, and 3 all describe the castle-and-moat/perimeter model that
    zero trust explicitly rejects because a single breach allows lateral movement.
  ref: concepts.md#zero-trust-and-defense-in-depth
- id: security-authentication-data-protection-013
  difficulty: beginner
  tags:
  - api-keys
  - mtls
  question: |
    What is a defining property of mutual TLS (mTLS) compared to ordinary TLS?
  options:
  - It disables encryption to improve performance
  - It replaces certificates with shared API keys
  - Only the server presents a certificate; the client stays anonymous
  - Both client and server present and validate X.509 certificates, so each proves identity
  answer: 3
  explanation: |
    In mTLS both parties present certificates, so the client is authenticated too (not
    just the server). Option 2 is ordinary one-way TLS. Option 0 is false (mTLS still
    encrypts). Option 1 describes API keys, a different mechanism.
  ref: concepts.md#api-keys-and-mutual-tls
- id: security-authentication-data-protection-014
  difficulty: beginner
  tags:
  - pii
  - tokenization
  question: |
    How does tokenization protect sensitive data like a credit-card number?
  options:
  - It replaces the value with a meaningless token, keeping the real value in a separate secured vault
  - It hashes the value with SHA-256 so it can be searched quickly
  - It encrypts the value with a key stored next to the data
  - It compresses the data so it takes less space
  answer: 0
  explanation: |
    Tokenization swaps sensitive data for a token with no mathematical relationship to
    the original, which lives in a separate, hardened vault — a breach of the app store
    yields useless tokens. Option 3 is compression. Option 1 is hashing. Option 2 is
    encryption (reversible with a co-located key), which is a different trade-off.
  ref: concepts.md#pii-gdpr-tokenization-and-data-residency
- id: security-authentication-data-protection-015
  difficulty: intermediate
  tags:
  - sessions
  - tokens
  - revocation
  - trade-offs
  question: |
    A banking app must be able to instantly terminate a compromised user's access from
    an admin console ("log this user out everywhere, now"). Which session strategy best
    fits, and why?
  options:
  - Long-lived stateless JWTs, because they scale horizontally without a shared store
  - Server-side sessions (opaque IDs backed by Redis), because deleting the record revokes access immediately
  - Long-lived JWTs with roles embedded, because fewer lookups reduce latency
  - Client-stored JWTs in localStorage, because the client controls its own logout
  answer: 1
  explanation: |
    Instant, central revocation is the defining strength of server-side sessions —
    delete the row and the next request fails. Stateless JWTs (0, 2) remain valid until
    expiry, defeating "log out now". localStorage JWTs (3) are both unrevocable and
    XSS-exposed. The requirement (real-time revocation) drives the choice despite the
    per-request lookup cost.
  ref: concepts.md#sessions-versus-tokens
- id: security-authentication-data-protection-016
  difficulty: intermediate
  tags:
  - jwt
  - sessions
  - microservices
  - trade-offs
  question: |
    A microservices platform wants each service to validate a caller's identity without
    a network call to a central auth database on every request. What is the PRIMARY
    trade-off it accepts by using self-contained JWTs?
  options:
  - Loss of confidentiality because JWTs cannot be sent over TLS
  - Higher per-request latency because every service must query a shared store
  - Weak revocation — a token stays valid until it expires unless extra machinery (denylist/short TTL)
    is added
  - Inability to horizontally scale the services
  answer: 2
  explanation: |
    Stateless JWTs give fast, local, offline verification (great for microservices) but
    the cost is weak revocation — a stolen token is valid until exp unless you add a
    denylist or keep TTLs short. Option 1 is backwards (JWTs avoid the lookup). Option 3
    is false (statelessness aids scaling). Option 0 is wrong — JWTs are sent over TLS
    normally.
  ref: concepts.md#sessions-versus-tokens
- id: security-authentication-data-protection-017
  difficulty: intermediate
  tags:
  - refresh-tokens
  - rotation
  - best-practice
  question: |
    What does refresh-token rotation with reuse detection accomplish?
  options:
  - It stores the refresh token in the JWT payload so no server state is needed
  - It encrypts the access token so it cannot be read by the client
  - It makes access tokens live longer so users refresh less often
  - Each refresh mints a new refresh token and invalidates the old one; presenting an already-used token
    signals theft and revokes the family
  answer: 3
  explanation: |
    Rotation issues a fresh refresh token on each use and invalidates the prior one; if
    a consumed token reappears, it indicates theft, so the whole token family is
    revoked. Option 2 misstates the goal. Option 0 is false — rotation requires
    server-side state. Option 1 confuses this with token encryption.
  ref: concepts.md#refresh-tokens-rotation-and-revocation
- id: security-authentication-data-protection-018
  difficulty: intermediate
  tags:
  - oauth
  - pkce
  - flows
  question: |
    Why is PKCE recommended for the OAuth 2.0 Authorization Code flow, even for
    single-page and mobile apps?
  options:
  - It removes the need for the app to talk to the authorization server
  - It lets the app skip the token-exchange step entirely
  - It binds the authorization code to a secret verifier, so an attacker who intercepts the redirect code
    cannot redeem it
  - It encrypts the ID token so the browser cannot read it
  answer: 2
  explanation: |
    PKCE ties the code to a client-generated code_verifier; an attacker who steals the
    redirect code lacks the verifier and cannot exchange it for tokens — critical for
    public clients that cannot keep a secret. Option 1 is false (the exchange still
    happens). Options 3 and 0 misdescribe PKCE entirely.
  ref: concepts.md#oauth-20-and-openid-connect-flows
- id: security-authentication-data-protection-019
  difficulty: intermediate
  tags:
  - oauth
  - client-credentials
  - m2m
  question: |
    A nightly backend job must call an internal API with no user present. Which OAuth
    2.0 flow is appropriate?
  options:
  - Client Credentials flow, where the service authenticates as itself with a client ID and secret
  - Implicit flow
  - Resource Owner Password Credentials flow
  - Authorization Code flow with PKCE
  answer: 0
  explanation: |
    Client Credentials is the machine-to-machine flow — no user, the service
    authenticates as itself. Auth Code + PKCE (3) is for user-present flows. Implicit
    (1) is deprecated and user-facing. ROPC (2) collects a user password and is
    deprecated; both are wrong for a headless job.
  ref: concepts.md#oauth-20-and-openid-connect-flows
- id: security-authentication-data-protection-020
  difficulty: intermediate
  tags:
  - encryption-at-rest
  - envelope
  - kms
  question: |
    In envelope encryption, why is data encrypted with a per-object data key (DEK) that
    is itself encrypted by a key-encryption key (KEK) held in a KMS?
  options:
  - So each object can be decrypted without any key at all
  - So the DEK and KEK are the same value, simplifying management
  - So the KEK can be shipped to the client for local decryption
  - So the KEK never leaves the KMS and rotating it means re-encrypting only small DEKs, not all the data
  answer: 3
  explanation: |
    Envelope encryption keeps the KEK inside the KMS/HSM and encrypts data locally with
    DEKs; rotating the KEK only re-encrypts the small DEKs, not petabytes of data.
    Option 2 defeats the point (KEK must stay in KMS). Option 0 is nonsense. Option 1
    collapses the two layers, losing the benefit.
  ref: concepts.md#encryption-at-rest-and-envelope-encryption
- id: security-authentication-data-protection-021
  difficulty: intermediate
  tags:
  - password-hashing
  - salt
  - pepper
  question: |
    What is the purpose of a per-user salt in password hashing?
  options:
  - To ensure identical passwords hash differently and to defeat precomputed rainbow tables
  - To encrypt the password so it can be recovered later
  - To replace the need for a work factor
  - To slow down the hash function proportionally to the number of users
  answer: 0
  explanation: |
    A unique salt per user makes equal passwords produce different hashes and renders
    precomputed rainbow tables useless. Option 3 confuses salt with work factor. Option
    1 is wrong (hashing is one-way). Option 2 is wrong — salt and work factor are
    complementary, not substitutes.
  ref: concepts.md#password-hashing-and-credential-storage
- id: security-authentication-data-protection-022
  difficulty: intermediate
  tags:
  - rbac
  - abac
  - trade-offs
  question: |
    An enterprise SaaS keeps adding tenants, regions, and one-off exceptions, and now
    has thousands of nearly identical roles. What is this problem called, and what model
    typically addresses it?
  options:
  - Key sprawl; consolidate to a single encryption key
  - Session fixation; rotate session IDs on login
  - Role explosion; move context-dependent rules to attribute-based access control (ABAC)
  - Token bloat; switch from JWT to opaque tokens
  answer: 2
  explanation: |
    Proliferating near-duplicate roles is "role explosion", and ABAC (policies over
    attributes like tenant/region/time) collapses many roles into a few rules. Option 3
    is a JWT sizing issue, option 0 is a key-management concept, and option 1 is an
    authentication vulnerability — none address role explosion.
  ref: concepts.md#rbac-versus-abac-and-modern-authorization
- id: security-authentication-data-protection-023
  difficulty: intermediate
  tags:
  - tls
  - forward-secrecy
  question: |
    Why does forward secrecy (ephemeral key exchange in TLS 1.3) matter?
  options:
  - It allows 0-RTT resumption for all request types safely
  - It removes the need for certificates
  - It lets the server reuse one key forever to save CPU
  - If the server's long-term private key is later compromised, previously captured traffic still cannot
    be decrypted
  answer: 3
  explanation: |
    Forward secrecy uses per-session ephemeral keys, so a future private-key compromise
    does not retroactively decrypt recorded traffic. Option 2 is the opposite of
    ephemeral keys. Option 0 is false — 0-RTT resumption is only safe for idempotent
    requests, not all types. Option 1 is false — certificates still authenticate the server.
  ref: concepts.md#encryption-in-transit
- id: security-authentication-data-protection-024
  difficulty: intermediate
  tags:
  - owasp
  - idor
  - access-control
  question: |
    A user changes the URL from /orders/123 to /orders/124 and sees another customer's
    order. Which OWASP category is this, and what is the fix?
  options:
  - Broken access control (IDOR); authorize every object access server-side against the requesting principal
  - Injection; use parameterized queries
  - Security misconfiguration; hide the order ID in the URL
  - Cryptographic failure; enable TLS on the endpoint
  answer: 0
  explanation: |
    This is Insecure Direct Object Reference, a Broken Access Control issue; the fix is
    to verify on the server that the principal owns/may access the object, never
    trusting the client ID. TLS (3) does not stop it, injection (1) is unrelated, and
    hiding the ID (2) is security by obscurity, not a real fix.
  ref: concepts.md#owasp-top-10-and-common-vulnerabilities
- id: security-authentication-data-protection-025
  difficulty: intermediate
  tags:
  - rate-limiting
  - credential-stuffing
  - security
  question: |
    What layered controls best defend a login endpoint against credential-stuffing
    attacks?
  options:
  - A single global rate limit across all users combined with longer password hashes
  - Per-IP and per-account rate limits, MFA, breached-password checks, and CAPTCHA/backoff on repeated
    failures
  - Disabling rate limiting so legitimate users are never blocked
  - Storing passwords with a faster hash so logins are quicker
  answer: 1
  explanation: |
    Credential stuffing is best met with defense in depth: layered rate limits
    (per-IP + per-account), MFA, checks against known-breached passwords, and
    CAPTCHA/backoff. A single global limit (0) is too coarse. Options 2 and 3 weaken
    security (no limiting, faster hashes make cracking easier).
  ref: concepts.md#rate-limiting-waf-and-ddos-defense
- id: security-authentication-data-protection-026
  difficulty: intermediate
  tags:
  - gdpr
  - crypto-shredding
  - pii
  question: |
    A user invokes their GDPR right to erasure, but their personal data exists in
    immutable append-only event logs and WORM backups that cannot be rewritten. What
    technique makes compliance feasible?
  options:
  - Moving the data to a different region
  - Physically deleting every backup tape in the company
  - Crypto-shredding — encrypt each user's data with a per-user key and delete the key to render the data
    unrecoverable
  - Marking the records as deleted with a boolean flag
  answer: 2
  explanation: |
    Crypto-shredding stores per-user data under a per-user key; deleting the key makes
    the ciphertext unrecoverable, satisfying erasure even in immutable stores. Option 1
    is impractical and destroys other users' data. Option 3 (soft delete) leaves data
    recoverable. Option 0 (residency) does not delete anything.
  ref: concepts.md#pii-gdpr-tokenization-and-data-residency
- id: security-authentication-data-protection-027
  difficulty: intermediate
  tags:
  - mfa
  - phishing
  - webauthn
  question: |
    Which MFA method is phishing-resistant, and why?
  options:
  - TOTP authenticator apps, because codes change every 30 seconds
  - Email magic links, because email is encrypted end to end
  - SMS one-time codes, because carriers verify the phone number
  - WebAuthn/FIDO2 security keys, because the credential is bound to the site origin and won't sign for
    a look-alike domain
  answer: 3
  explanation: |
    WebAuthn/FIDO2 uses origin-bound public-key challenge-response, so a phishing site on
    a different domain cannot obtain a valid signature. SMS (2) is phishable and
    SIM-swappable; TOTP (0) can be relayed in real time by a phishing proxy; email links
    (1) are also phishable and email is not reliably E2E encrypted.
  ref: concepts.md#multi-factor-authentication
- id: security-authentication-data-protection-028
  difficulty: intermediate
  tags:
  - waf
  - defense-in-depth
  - trade-offs
  question: |
    Your team discovers a vulnerable dependency and can deploy a WAF rule today but the
    code fix will take a week. What is the correct framing of the WAF's role?
  options:
  - The WAF should be disabled since it may cause false positives
  - The WAF is a permanent replacement for fixing the code
  - The WAF is a defense-in-depth layer / stopgap that buys time, but the durable fix belongs in the code
  - The WAF makes the code fix unnecessary because attacks are now blocked forever
  answer: 2
  explanation: |
    A WAF is a mitigating layer that can block known attack patterns quickly (great as a
    stopgap), but it is not a substitute for the root-cause code fix — defense in depth,
    not defense instead of. Options 1 and 3 over-trust the WAF; option 0 discards a
    useful layer (false positives are managed by monitor-then-enforce).
  ref: concepts.md#owasp-top-10-and-common-vulnerabilities
- id: security-authentication-data-protection-029
  difficulty: intermediate
  tags:
  - api-keys
  - trade-offs
  question: |
    What is the main downside of API keys as a service-authentication mechanism at
    scale?
  options:
  - They are long-lived shared secrets with coarse identity that leak easily (into Git/logs) and lack
    built-in expiry
  - They require a full PKI with certificate rotation
  - They cannot be transmitted over HTTPS
  - They are too computationally expensive to verify
  answer: 0
  explanation: |
    API keys are simple bearer secrets: easy to leak, coarse, and without native expiry,
    making them hard to manage safely at scale (mitigate with hashing, scoping,
    rotation, prefixing). Option 3 is false (verification is cheap). Option 1 describes
    mTLS, not keys. Option 2 is false — keys are sent over HTTPS.
  ref: concepts.md#api-keys-and-mutual-tls
- id: security-authentication-data-protection-030
  difficulty: intermediate
  tags:
  - secrets
  - dynamic
  - trade-offs
  question: |
    What advantage do dynamic secrets (e.g., Vault-generated short-lived DB credentials)
    offer over static long-lived credentials?
  options:
  - They can be safely committed to source control
  - They remove the need for any identity to fetch them
  - They never expire, so applications never need to reconnect
  - They shrink the leak window to minutes because credentials are generated per request and auto-expire
  answer: 3
  explanation: |
    Dynamic secrets are short-lived and auto-expiring, so a leaked credential is useful
    only briefly — a much smaller blast radius than a static, open-ended secret. Option
    2 is the opposite of dynamic. Option 0 is never acceptable. Option 1 is false — you
    still need a workload identity to request them.
  ref: concepts.md#secrets-management
- id: security-authentication-data-protection-031
  difficulty: intermediate
  tags:
  - jwt
  - cookies
  - xss
  - csrf
  question: |
    To protect a browser-based app's tokens from theft via XSS while still defending
    against CSRF, what is a sound approach?
  options:
  - Store the token in an HttpOnly, Secure, SameSite cookie so JavaScript cannot read it, and add CSRF
    defense
  - Put the token in a URL query parameter for every request
  - Store the token in a non-HttpOnly cookie so JavaScript can attach it manually
  - Store the JWT in localStorage and rely on the framework to block XSS
  answer: 0
  explanation: |
    HttpOnly prevents JS (and thus XSS) from reading the token; Secure/SameSite plus an
    anti-CSRF token or SameSite=lax/strict addresses CSRF. localStorage (3) is
    XSS-readable. URL params (1) leak into logs/history. A non-HttpOnly cookie (2)
    reintroduces XSS exposure.
  ref: concepts.md#sessions-versus-tokens
- id: security-authentication-data-protection-032
  difficulty: intermediate
  tags:
  - encryption
  - at-rest
  - transit
  - defense-in-depth
  question: |
    A candidate says "we use TLS, so we don't need encryption at rest." What is the flaw
    in that reasoning?
  options:
  - At-rest encryption makes TLS unnecessary
  - TLS and at-rest encryption both protect the same threat, so it is redundant to have both
  - TLS protects data in motion; at-rest encryption protects stored data (stolen disks/backups), a different
    threat — you need both (defense in depth)
  - TLS already encrypts the database files on disk
  answer: 2
  explanation: |
    They address different threats: TLS guards data crossing the network; at-rest
    encryption guards stored media/backups. Defense in depth requires both. Option 1
    wrongly equates them, option 3 falsely claims TLS encrypts disk files, and option 0
    inverts the same mistake.
  ref: concepts.md#encryption-at-rest-and-envelope-encryption
- id: security-authentication-data-protection-033
  difficulty: intermediate
  tags:
  - oauth
  - opaque
  - introspection
  - trade-offs
  question: |
    A resource server can validate access tokens either as JWTs (local signature check)
    or as opaque tokens via an introspection call. What does choosing opaque tokens buy
    you, and at what cost?
  options:
  - Offline validation with no auth-server dependency; cost is weaker security
  - Encrypted claims; cost is higher CPU on the client
  - Faster validation with no revocation; cost is larger tokens
  - Real-time revocation and central control; cost is a network hop per request (mitigated by short-TTL
    caching, which reopens a small revocation window)
  answer: 3
  explanation: |
    Opaque tokens are validated by asking the auth server (/introspect), giving
    immediate revocation and central audit at the cost of a per-request hop; caching
    results reduces latency but partially reopens the revocation window. Option 2 and 0
    describe JWTs (local, fast, weak revocation). Option 1 confuses this with JWE.
  ref: concepts.md#oauth-20-and-openid-connect-flows
- id: security-authentication-data-protection-034
  difficulty: intermediate
  tags:
  - zero-trust
  - mtls
  - service-mesh
  question: |
    In a zero-trust microservices deployment, how do two internal services commonly
    establish mutual trust with manageable operations?
  options:
  - A service mesh issues short-lived certificates (e.g., SPIFFE identities) and rotates them, enabling
    automatic mTLS between services
  - They share one long-lived API key hardcoded in both images
  - They rely on IP allowlists at the firewall only
  - They trust each other because they are in the same VPC
  answer: 0
  explanation: |
    Zero trust rejects implicit VPC trust; a service mesh (Istio/Linkerd) auto-issues
    and rotates short-lived workload certificates so services mutually authenticate via
    mTLS without manual PKI toil. Option 3 is the perimeter model ZT rejects. Options 1
    and 2 are static/coarse and violate least privilege and zero trust.
  ref: concepts.md#zero-trust-and-defense-in-depth
- id: security-authentication-data-protection-035
  difficulty: intermediate
  tags:
  - tokenization
  - pci
  - trade-offs
  question: |
    Why do payment platforms favor tokenization over encryption for stored card
    numbers?
  options:
  - Tokenization is faster to compute than any cipher
  - Tokens have no mathematical link to the card, so a breach of app systems yields nothing and PCI-DSS
    scope shrinks dramatically
  - Tokenization lets any service reverse a token without the vault
  - Encryption is illegal for payment data
  answer: 1
  explanation: |
    Tokens are meaningless references stored alongside data, with the real value locked
    in a separate vault; systems handling only tokens fall out of PCI scope and a breach
    exposes nothing useful. Option 0 misstates the reason. Option 2 is false (only the
    vault detokenizes). Option 3 is fabricated.
  ref: concepts.md#pii-gdpr-tokenization-and-data-residency
- id: security-authentication-data-protection-036
  difficulty: advanced
  tags:
  - jwt
  - algorithm-confusion
  - security
  question: |
    An attacker takes a service's public RSA key, sets a JWT header to alg=HS256, and
    signs the token using that public key as the HMAC secret. Which vulnerability is
    this, and what is the fix?
  options:
  - Cross-site scripting; encode all output
  - Replay attack; add a nonce to every token
  - Algorithm confusion (RS256 to HS256); the verifier must pin the expected algorithm rather than trusting
    the token's alg header
  - Session fixation; regenerate the session ID
  answer: 2
  explanation: |
    If a verifier keys off the token's alg header, it may treat the public key as an HMAC
    secret and accept a forged HS256 token — classic algorithm-confusion. The fix is to
    only accept the algorithm you expect (e.g., RS256), never letting the token dictate
    it. The other options are unrelated attack classes.
  ref: concepts.md#jwt-structure-signing-and-pitfalls
- id: security-authentication-data-protection-037
  difficulty: advanced
  tags:
  - jwt
  - hs256
  - rs256
  - blast-radius
  - trade-offs
  question: |
    Dozens of microservices need to verify access tokens, and some verification happens
    in partner-operated services. Comparing HS256 (shared secret) vs RS256/ES256
    (asymmetric), which choice minimizes blast radius and why?
  options:
  - HS256, because HMAC is faster and speed reduces blast radius
  - It makes no difference; both expose the same key material to verifiers
  - HS256, because a single shared secret is simplest to distribute
  - RS256/ES256, because verifiers hold only the public key and cannot mint tokens, so a compromised verifier
    cannot forge identities
  answer: 3
  explanation: |
    With asymmetric signing, only the issuer holds the private (signing) key; verifiers
    have the public key and cannot forge tokens, so a compromised or partner verifier
    cannot mint identities. HS256 (2, 0) forces every verifier to hold the secret — any
    one leak lets an attacker mint tokens. Option 1 is false — the key material differs.
  ref: concepts.md#jwt-structure-signing-and-pitfalls
- id: security-authentication-data-protection-038
  difficulty: advanced
  tags:
  - refresh-tokens
  - lifetime
  - trade-offs
  - capacity
  question: |
    You must choose an access-token lifetime. Very short tokens (5 min) improve security
    but increase refresh traffic; long tokens reduce load but are effectively
    unrevocable. For a high-value fintech API with a hard revocation requirement but
    also 50k req/s, which combination is most defensible?
  options:
  - No tokens at all; re-authenticate with username/password on every request
  - 24-hour access tokens with no refresh, to eliminate refresh load
  - Short-lived access JWTs (~15 min) plus stateful, revocable refresh tokens with rotation, accepting
    extra refresh traffic on the auth service
  - Permanent tokens stored in a denylist checked on every request
  answer: 2
  explanation: |
    The standard modern compromise: short access JWTs bound the exposure of a leak,
    while a stateful, rotating refresh token provides revocation on the cold path — you
    pay some refresh traffic but meet both revocation and scale goals. Option 1 sacrifices
    revocation. Option 3 re-creates sessions on the hot path (a huge denylist per
    request). Option 0 is absurd for 50k req/s and exposes credentials constantly.
  ref: concepts.md#refresh-tokens-rotation-and-revocation
- id: security-authentication-data-protection-039
  difficulty: advanced
  tags:
  - rebac
  - zanzibar
  - consistency
  - trade-offs
  question: |
    A collaboration product needs "who can access this document?" decisions that respect
    nested folder sharing at billions-of-ACLs scale with <10 ms p95. Which authorization
    approach fits, and what hard problem must it solve?
  options:
  - A Zanzibar-style relationship-based system (ReBAC); it must solve consistency (e.g., zookies) to avoid
    the 'new enemy' problem
  - ABAC evaluated in the client to avoid server latency
  - Static per-user allowlists stored in each service's config file
  - RBAC with a few global roles; no consistency concerns arise
  answer: 0
  explanation: |
    Nested sharing at massive scale is exactly Google Zanzibar's domain (ReBAC over a
    relationship graph), and it must provide consistency tokens ("zookies") so a revoked
    permission isn't bypassed via stale reads — the "new enemy" problem. RBAC (3) can't
    express per-object nested sharing well; client-side ABAC (1) is insecure; static
    config allowlists (2) don't scale or stay fresh.
  ref: concepts.md#rbac-versus-abac-and-modern-authorization
- id: security-authentication-data-protection-040
  difficulty: advanced
  tags:
  - encryption
  - app-level
  - storage-level
  - trade-offs
  question: |
    You must defend a customer PII column against a compromised database (not just
    stolen disks) and support GDPR crypto-shredding per user, but the column is only ever
    read by user ID, never range-queried. Which approach fits best?
  options:
  - No encryption; rely on database access controls
  - Hash the PII with SHA-256 so it cannot be decrypted
  - Transparent storage-level (disk) encryption only, because it is simplest
  - Application-level encryption with per-tenant/per-user DEKs, accepting the loss of range/search queries
    on that column
  answer: 3
  explanation: |
    App-level encryption protects even against a compromised DB and enables per-user keys
    for crypto-shredding; since the column is only fetched by ID, losing range/search on
    it is acceptable. Disk encryption (2) only defends physical theft, not a compromised
    app/DB. Option 0 ignores the compromise threat. Hashing (1) is one-way — you could
    never read the PII back.
  ref: concepts.md#encryption-at-rest-and-envelope-encryption
- id: security-authentication-data-protection-041
  difficulty: advanced
  tags:
  - argon2
  - work-factor
  - capacity
  - trade-offs
  question: |
    Your login service uses Argon2id tuned to 250 ms and 512 MB memory per hash. During
    a login spike of 2,000 logins/sec, what is the risk and the correct mitigation?
  options:
  - Memory/CPU exhaustion — 2,000 concurrent hashes at 512 MB could need ~1 TB RAM; tune parameters and
    rate-limit/queue logins to bound concurrency
  - The hashes become reversible under load
  - Salts collide under high concurrency, so switch to unsalted hashing
  - No risk; hashing cost is independent of request volume
  answer: 0
  explanation: |
    Memory-hard hashing multiplies resource use by concurrency: 2,000 x 512 MB is
    ~1 TB, which can exhaust the auth tier and cause a self-inflicted DoS. Mitigate by
    tuning parameters to your hardware and rate-limiting/queueing logins to cap
    concurrency. Option 3 ignores concurrency, option 1 is false (load doesn't reverse
    hashes), and option 2 is dangerous nonsense.
  ref: concepts.md#password-hashing-and-credential-storage
- id: security-authentication-data-protection-042
  difficulty: advanced
  tags:
  - ssrf
  - cloud-metadata
  - owasp
  question: |
    An image-fetching feature lets users supply a URL that the server retrieves. An
    attacker submits http://169.254.169.254/latest/meta-data/ and exfiltrates cloud
    credentials. What is the vulnerability and the key mitigation?
  options:
  - XSS; encode the response body
  - CSRF; add a SameSite cookie
  - SSRF (Server-Side Request Forgery); validate/allowlist destinations and block link-local/metadata
    addresses
  - SQL injection; use prepared statements
  answer: 2
  explanation: |
    This is SSRF: the server is coerced into fetching an internal URL, here the cloud
    instance-metadata endpoint (the Capital One breach pattern). Mitigate with strict
    allowlisting of outbound destinations and blocking link-local ranges like
    169.254.169.254. The other options address unrelated vulnerability classes.
  ref: concepts.md#owasp-top-10-and-common-vulnerabilities
- id: security-authentication-data-protection-043
  difficulty: advanced
  tags:
  - data-residency
  - cell-based
  - trade-offs
  question: |
    A global app must keep EU users' regulated data in the EU while serving users
    worldwide. What is the PRIMARY architectural trade-off of enforcing data residency
    via regional isolation?
  options:
  - It has no effect on architecture, only on legal paperwork
  - It eliminates the need for encryption because data never leaves the region
  - It improves cross-region analytics and simplifies a single global user table
  - It satisfies sovereignty and improves blast-radius isolation, but breaks global single-table designs,
    complicates traveling users, and raises cost via duplicated regional infra
  answer: 3
  explanation: |
    Regionalizing data (a cell-based/regionalized approach) meets residency rules and
    isolates failures, but you give up a simple global data model, must handle users who
    cross regions, pay for duplicate infra per region, and complicate global analytics.
    Option 2 is backwards. Option 0 understates the deep architectural impact. Option 1
    is false — residency and encryption are orthogonal.
  ref: concepts.md#pii-gdpr-tokenization-and-data-residency
- id: security-authentication-data-protection-044
  difficulty: advanced
  tags:
  - authz
  - fail-closed
  - availability
  - trade-offs
  question: |
    Your central authorization service becomes a hot-path dependency and occasionally
    has brief outages. For a system handling sensitive financial data, should authZ fail
    open or fail closed, and what is the consequence?
  options:
  - Fail closed, denying requests during an authZ outage — this protects data at the cost of availability,
    which is the right trade-off for sensitive financial data
  - It does not matter because outages are rare
  - Fail open, because financial systems prioritize availability over correctness
  - Fail open, to preserve availability, accepting the risk of unauthorized access during outages
  answer: 0
  explanation: |
    For sensitive data, failing closed (deny when you cannot verify) prevents
    unauthorized access, trading availability for security — the correct default for
    financial data. Failing open (3, 2) risks unauthorized access, unacceptable here.
    Option 1 dismisses a decision that must be deliberate. Mitigate the availability hit
    with caching/replication, not by failing open.
  ref: concepts.md#zero-trust-and-defense-in-depth
- id: security-authentication-data-protection-045
  difficulty: advanced
  tags:
  - mtls
  - oauth
  - m2m
  - trade-offs
  question: |
    Comparing mTLS and OAuth client-credentials bearer tokens for internet-facing
    machine-to-machine auth, what is a key security advantage of mTLS?
  options:
  - mTLS requires no key management, unlike bearer tokens
  - mTLS binds identity to the transport with a private key that never travels, so there is no bearer
    token to steal and replay
  - mTLS is always simpler to operate for public clients
  - Bearer tokens cannot be transmitted over TLS
  answer: 1
  explanation: |
    In mTLS, identity is proven by possession of a private key that never leaves the
    client, so unlike a bearer token there is nothing transmitted that an attacker can
    capture and replay. Option 0 is false (mTLS needs heavy PKI). Option 2 is false —
    mTLS is harder for public clients. Option 3 is false. The strongest posture combines
    both (mTLS-bound tokens, RFC 8705).
  ref: concepts.md#api-keys-and-mutual-tls
- id: security-authentication-data-protection-046
  difficulty: advanced
  tags:
  - kms
  - hsm
  - compliance
  - trade-offs
  question: |
    A regulated workload requires that the cloud provider can never access your key
    material, meeting FIPS 140 single-tenant custody. What is the trade-off of choosing a
    dedicated HSM (e.g., CloudHSM) over managed KMS?
  options:
  - Managed KMS gives you sole custody automatically
  - The HSM is cheaper and lower-maintenance than managed KMS
  - You gain sole custody and stricter compliance, but pay much higher cost and operational burden than
    managed KMS
  - There is no difference in custody between HSM and managed KMS
  answer: 2
  explanation: |
    A dedicated HSM gives you exclusive custody (provider never sees the key) and meets
    strict FIPS requirements, but at significantly higher cost and operational effort
    than managed KMS. Option 1 inverts the cost. Options 3 and 0 misstate custody —
    managed KMS is provider-operated and does not give the same single-tenant custody.
  ref: concepts.md#encryption-at-rest-and-envelope-encryption
- id: security-authentication-data-protection-047
  difficulty: advanced
  tags:
  - tls-termination
  - edge
  - trade-offs
  - zero-trust
  question: |
    A design terminates TLS at the CDN/load balancer and sends plaintext to origin
    inside the VPC. From a zero-trust standpoint, what is the trade-off?
  options:
  - It violates TLS and will not function
  - It provides end-to-end encryption automatically
  - It is strictly better because it removes all cryptographic overhead everywhere
  - Edge termination is cheaper and enables L7 routing/WAF inspection, but leaves an internal plaintext
    hop that zero trust would close via re-encryption/mTLS to origin
  answer: 3
  explanation: |
    Terminating at the edge offloads crypto and enables inspection/routing, but the
    internal hop is plaintext — acceptable under perimeter trust, but zero trust wants
    that hop encrypted too (re-encrypt or mTLS to origin) at added CPU/ops cost. Option 2
    ignores the internal exposure, option 0 is false (it works fine), and option 1 is
    the opposite of what happens.
  ref: concepts.md#encryption-in-transit
- id: security-authentication-data-protection-048
  difficulty: advanced
  tags:
  - secrets
  - bootstrapping
  - workload-identity
  question: |
    To avoid the "secret to get secrets" bootstrapping problem when an app must fetch
    credentials from a secrets manager, what is the correct pattern?
  options:
  - Have each app generate its own random secret at startup and trust it
  - Bake a master secret into the container image so the app can authenticate to Vault
  - Use platform-provided workload identity (instance role, K8s service account, IRSA/SPIFFE) so the app
    proves identity without a pre-shared secret
  - Store the bootstrap secret in a public config map
  answer: 2
  explanation: |
    The bootstrapping problem is solved with platform-issued workload identity — the
    runtime attests the workload's identity (instance role, K8s SA, IRSA, SPIFFE) so no
    pre-shared secret is needed. Baking a master secret (1) or public config (3) just
    moves the leak; a self-generated secret (0) is not trusted by the secrets manager.
  ref: concepts.md#secrets-management
- id: security-authentication-data-protection-049
  difficulty: advanced
  tags:
  - defense-in-depth
  - cost
  - judgment
  - trade-offs
  question: |
    A staff engineer argues for applying every security control (mTLS everywhere,
    per-field encryption, full ABAC, HSM) to an internal low-sensitivity analytics
    dashboard. What is the best critique?
  options:
  - Each layer adds latency, cost, and operational surface; security is risk management, so controls should
    be matched to the data's sensitivity and threat model
  - The dashboard needs no security controls at all since it is internal
  - Only encryption at rest matters; everything else is unnecessary
  - Security is maximalism; more controls are always better regardless of context
  answer: 0
  explanation: |
    Defense in depth is about matching controls to risk, not applying everything
    everywhere — each layer costs latency, money, and operational complexity and can add
    false positives. Option 3 treats security as maximalism (wrong). Option 1 goes to the
    opposite extreme (internal is not trust-free under zero trust). Option 2 arbitrarily
    picks one control.
  ref: concepts.md#zero-trust-and-defense-in-depth
- id: security-authentication-data-protection-050
  difficulty: advanced
  tags:
  - oauth
  - aud
  - iss
  - token-validation
  question: |
    A JWT access token minted for Service A is replayed against Service B, which accepts
    it. What validation was most likely missing?
  options:
  - The token was not base64-decoded
  - The token lacked an exp claim
  - The signature was not checked
  - The audience (aud) and/or issuer (iss) claims were not validated against the expected values
  answer: 3
  explanation: |
    Accepting a token intended for another service points to missing audience/issuer
    validation — each service must verify the token's aud matches itself and iss is the
    trusted issuer. If the signature were invalid (2) it wouldn't verify at all;
    base64-decoding (0) is mechanical; a missing exp (1) is a separate lifetime issue,
    not why B accepted A's token.
  ref: concepts.md#jwt-structure-signing-and-pitfalls
- id: security-authentication-data-protection-051
  difficulty: advanced
  tags:
  - key-granularity
  - crypto-shredding
  - trade-offs
  question: |
    You are deciding between one KEK for all tenants versus per-tenant DEKs. What does
    per-tenant key granularity buy you, and what does it cost?
  options:
  - It enables per-tenant crypto-shredding and limits blast radius, but multiplies key-management overhead
    and KMS cost
  - It makes encryption faster by reusing the same key everywhere
  - It removes the need for a KMS entirely
  - It simplifies operations with fewer keys and lets one compromise expose everything
  answer: 0
  explanation: |
    Per-tenant keys let you crypto-shred a single tenant's data and contain the blast
    radius of a key compromise, but you now manage far more keys and pay more KMS calls.
    Option 3 describes the single-key approach's downside as if it were an upside. Option
    1 confuses granularity with reuse. Option 2 is false — you still need a KMS.
  ref: concepts.md#encryption-at-rest-and-envelope-encryption
- id: security-authentication-data-protection-052
  difficulty: advanced
  tags:
  - ddos
  - edge
  - origin
  - trade-offs
  question: |
    For volumetric DDoS defense, what is the trade-off between filtering at the CDN/edge
    versus at the origin?
  options:
  - There is no difference in cost or effectiveness between the two
  - Edge filtering sees more application context than the origin
  - Edge/anycast scrubbing sheds attack traffic cheaply before it reaches your compute, but sees less
    app context; origin filtering is precise but the flood already arrived
  - Origin filtering is always cheaper because there is no edge to pay for
  answer: 2
  explanation: |
    Edge/anycast scrubbing absorbs and drops floods near the source, protecting origin
    capacity cheaply, but has less application context; origin-level rules are precise but
    only act after traffic has consumed your resources. Option 1 is backwards (origin has
    more context). Option 3 ignores the compute cost of absorbing floods at origin.
    Option 0 is false.
  ref: concepts.md#rate-limiting-waf-and-ddos-defense
- id: security-authentication-data-protection-053
  difficulty: expert
  tags:
  - zanzibar
  - consistency
  - new-enemy
  - expert
  question: |
    In a Zanzibar-style authorization system, what is the "new enemy" problem that
    consistency tokens (zookies) prevent?
  options:
  - Two administrators editing the same role simultaneously
  - An attacker enumerating user IDs to discover valid accounts
  - A brand-new attacker joining the system with elevated privileges by default
  - A stale read allowing access after a permission was revoked, or content added under an old ACL being
    exposed — an ordering/consistency violation between ACL changes and content
  answer: 3
  explanation: |
    The "new enemy" problem is a consistency hazard: e.g., you revoke Bob's access then
    add sensitive content, but a stale replica still evaluates the old ACL and leaks it —
    or content is protected by an ACL that hasn't propagated. Zookies pin a snapshot so
    checks reflect the correct ordering. The other options describe unrelated concerns.
  ref: concepts.md#rbac-versus-abac-and-modern-authorization
- id: security-authentication-data-protection-054
  difficulty: expert
  tags:
  - tls
  - 0-rtt
  - replay
  - expert
  question: |
    TLS 1.3's 0-RTT resumption reduces handshake latency but carries a specific risk.
    What is it, and what is the correct usage constraint?
  options:
  - 0-RTT early data is replayable by an attacker, so it should only be used for idempotent requests,
    not state-changing operations
  - It leaks the server's private key; disable it entirely
  - It breaks forward secrecy for all sessions
  - It weakens the cipher suite; only use it with AES-128
  answer: 0
  explanation: |
    0-RTT early data can be captured and replayed because the server has no fresh
    handshake nonce yet, so it must be limited to idempotent operations (e.g., GETs), not
    state-changing requests like payments. Option 3 is unrelated to cipher strength.
    Option 1 is false. Option 2 is false — 0-RTT does not destroy forward secrecy of the
    main session.
  ref: concepts.md#encryption-in-transit
- id: security-authentication-data-protection-055
  difficulty: expert
  tags:
  - jwt
  - key-rotation
  - jwks
  - expert
  question: |
    Your asymmetric JWT signing key must be rotated regularly with zero downtime for
    verifiers. What mechanism enables verifiers to validate tokens signed by either the
    old or new key during the overlap?
  options:
  - Embedding the full private key in each token
  - Publishing multiple public keys at a JWKS endpoint keyed by 'kid', so verifiers select the correct
    key per token during the overlap window
  - Switching all tokens to HS256 during rotation
  - Disabling signature verification until rotation completes
  answer: 1
  explanation: |
    A JWKS endpoint publishes the set of valid public keys, each identified by a 'kid';
    tokens carry the 'kid' in their header so verifiers pick the matching key, allowing
    old and new keys to coexist during rotation. Option 0 is catastrophic (never ship
    private keys). Options 2 and 3 abandon security during the very window that needs it.
  ref: concepts.md#jwt-structure-signing-and-pitfalls
- id: security-authentication-data-protection-056
  difficulty: expert
  tags:
  - oauth
  - token-binding
  - dpop
  - expert
  question: |
    To defend against stolen-bearer-token replay in a public API without full mTLS, a
    modern approach cryptographically binds the token to a client-held key so a stolen
    token alone is useless. Which class of mechanism is this?
  options:
  - Rotating the API's TLS certificate more frequently
  - Storing the token in localStorage with a long expiry
  - Sender-constrained / proof-of-possession tokens (e.g., DPoP or mTLS-bound tokens per RFC 8705), where
    the client proves possession of a private key per request
  - Increasing the token size so it is harder to copy
  answer: 2
  explanation: |
    Sender-constrained tokens (DPoP, or mTLS-bound tokens under RFC 8705) tie the token
    to a key the client must prove possession of on each call, so a captured bearer token
    is useless without the key. Option 1 worsens exposure. Option 3 (size) does nothing.
    Option 0 (cert rotation) does not bind the token to the client.
  ref: concepts.md#oauth-20-and-openid-connect-flows
- id: security-authentication-data-protection-057
  difficulty: expert
  tags:
  - gdpr
  - backups
  - immutable
  - trade-offs
  - expert
  question: |
    A regulator asks whether crypto-shredding truly satisfies the right to erasure given
    that ciphertext still physically exists in immutable backups. What is the correct,
    nuanced position?
  options:
  - You must physically overwrite every backup, so crypto-shredding is never used
  - Ciphertext is not personal data, so no action is ever required
  - Crypto-shredding fails compliance because the bytes still exist
  - Destroying the only key renders the data permanently unrecoverable, which regulators generally accept
    as effective erasure for immutable/backup stores where physical deletion is infeasible
  answer: 3
  explanation: |
    Crypto-shredding is widely accepted as effective erasure when physical deletion is
    infeasible (append-only logs, WORM backups): with the sole key destroyed, the data is
    irrecoverable. Option 2 ignores this accepted practice. Option 0 overstates the
    requirement. Option 1 is legally wrong — recoverable ciphertext of personal data is
    still personal data, which is precisely why the key must be destroyed.
  ref: concepts.md#pii-gdpr-tokenization-and-data-residency
- id: security-authentication-data-protection-058
  difficulty: expert
  tags:
  - tokenization
  - vault
  - spof
  - trade-offs
  - expert
  question: |
    Tokenization minimizes breach blast radius, but what is the PRIMARY architectural
    liability it introduces, and how is it addressed?
  options:
  - It eliminates the need for access control on the vault
  - It slows encryption; address by using a faster cipher
  - The token vault becomes a centralized, high-value bottleneck/SPOF that must be made highly available
    and low-latency, and is itself the crown-jewel target to defend
  - Tokens become guessable; address by making them shorter
  answer: 2
  explanation: |
    Because detokenization requires the vault, the vault is a central bottleneck, a
    single point of failure, and the most valuable attack target — so it must be HA,
    low-latency, and heavily protected. Option 1 misframes tokenization as encryption.
    Option 3 is wrong (tokens are random, not guessable). Option 0 is the opposite — the
    vault needs the strongest access control.
  ref: concepts.md#pii-gdpr-tokenization-and-data-residency
- id: security-authentication-data-protection-059
  difficulty: expert
  tags:
  - genai
  - rag
  - prompt-injection
  - modern
  - expert
  question: |
    A RAG-based GenAI assistant retrieves documents and lets an LLM call internal tools.
    An attacker plants instructions inside a retrieved document that make the model
    exfiltrate data via a tool call. What is this attack, and what is the primary
    mitigation?
  options:
  - Indirect prompt injection; apply least-privilege tool scopes, treat retrieved content as untrusted,
    and add output/action guardrails rather than trusting the model to self-police
  - Cross-site scripting; encode the model's HTML output
  - A DDoS attack; add rate limiting to the LLM endpoint
  - SQL injection; use prepared statements in the vector database
  answer: 0
  explanation: |
    Malicious instructions embedded in retrieved content are indirect prompt injection;
    because you cannot fully trust the model to ignore them, the durable defenses are
    least-privilege tool permissions, treating retrieved data as untrusted input, and
    enforcing action guardrails/human approval — defense in depth around the model.
    SQLi (3), XSS (1), and DDoS (2) are different classes and do not address the
    injection vector.
  ref: concepts.md#owasp-top-10-and-common-vulnerabilities
- id: security-authentication-data-protection-060
  difficulty: expert
  tags:
  - session
  - jwt
  - hybrid
  - revocation
  - trade-offs
  - expert
  question: |
    A large social platform wants stateless JWT verification on the hot path but must
    still support "log out all devices" and near-real-time ban enforcement. Which design
    best balances these?
  options:
  - Server-side sessions with a synchronous DB read on every one of billions of requests
  - Storing every issued JWT in a relational database and querying it per request
  - Pure long-lived JWTs with no server state, accepting that bans take days to apply
  - Short-lived access JWTs plus a per-user token_version (or lightweight denylist cache) that verifiers
    check, so bumping the version invalidates all outstanding tokens within the access-token TTL
  answer: 3
  explanation: |
    A per-user token_version embedded in the JWT (or a small cached denylist) lets
    verifiers reject tokens whose version is stale; bumping it logs out all devices, and
    with short TTLs the effect is near-real-time — keeping the hot path mostly stateless.
    Option 2 sacrifices timely bans. Options 0 and 1 reintroduce a per-request datastore
    read at billions-of-requests scale, defeating the statelessness goal.
  ref: concepts.md#refresh-tokens-rotation-and-revocation
- id: security-authentication-data-protection-061
  difficulty: expert
  tags:
  - abac
  - policy-engine
  - latency
  - trade-offs
  - expert
  question: |
    You must enforce complex, context-dependent ABAC policies with sub-millisecond
    overhead and high availability, even if the central policy service is briefly
    unreachable. What deployment pattern fits, and what is its main challenge?
  options:
  - Distribute policies to an embedded engine / sidecar (e.g., OPA) so decisions are local and available;
    the main challenge is policy and data distribution/freshness (avoiding stale decisions)
  - Evaluate policies in the client to remove all server latency
  - Hardcode the policies into each service's binary and redeploy on every change
  - Call a central policy service synchronously on every request; challenge is nothing, it is always available
  answer: 0
  explanation: |
    An embedded/sidecar policy engine (OPA) evaluates decisions locally for low latency
    and availability even during central-service blips; the hard part is distributing
    updated policies and the data they need while bounding staleness. A synchronous
    central call (3) adds a hop and an availability dependency. Client-side eval (1) is
    insecure. Hardcoding (2) makes every policy change a deploy.
  ref: concepts.md#rbac-versus-abac-and-modern-authorization
- id: security-authentication-data-protection-062
  difficulty: expert
  tags:
  - mfa
  - mfa-fatigue
  - number-matching
  - expert
  question: |
    After a breach, investigators find the attacker had a valid password and spammed
    push approvals until the user tapped "approve". What is this technique, and which
    control specifically defeats it?
  options:
  - Phishing; add a CAPTCHA to the login form
  - SIM swapping; port the number back to the user
  - MFA fatigue (push bombing); require number-matching so the user must enter a code shown by the app,
    not just tap approve
  - Credential stuffing; rotate the user's password
  answer: 2
  explanation: |
    Spamming push prompts to wear the user down is MFA fatigue / push bombing; plain
    one-tap push is fatigable, but number-matching forces the user to type a code
    displayed by the legitimate app, breaking blind approvals. SIM swap (1) and
    credential stuffing (3) are different attacks; a CAPTCHA (0) does not stop push
    bombing of an already-authenticated password.
  ref: concepts.md#multi-factor-authentication
- id: security-authentication-data-protection-063
  difficulty: intermediate
  tags:
  - oauth
  - implicit
  - deprecated
  question: |
    Why is the OAuth 2.0 Implicit flow deprecated in favor of Authorization Code with
    PKCE?
  options:
  - Implicit required a client secret that SPAs could not store
  - Implicit only worked with opaque tokens
  - Implicit flow was too slow because of the extra token-exchange request
  - Implicit returned tokens directly in the URL fragment (leaking via history/referrer) and could not
    authenticate the client, whereas Auth Code + PKCE avoids exposing tokens in URLs
  answer: 3
  explanation: |
    Implicit delivered access tokens in the redirect URL fragment, exposing them to
    browser history, referrer headers, and logs, with no client authentication; Auth
    Code + PKCE keeps tokens out of URLs and binds the code to a verifier. Option 2 is
    backwards (Implicit had fewer steps but was less safe). Options 0 and 1 misstate the
    mechanics.
  ref: concepts.md#oauth-20-and-openid-connect-flows
- id: security-authentication-data-protection-064
  difficulty: intermediate
  tags:
  - abac
  - aws-iam
  question: |
    AWS IAM policies can allow access only when conditions like the request's source IP,
    resource tags, or whether MFA was used are met. Which access-control model does this
    most closely represent?
  options:
  - ABAC, because decisions depend on attributes of the subject, resource, and environment
  - ReBAC, because it uses a relationship graph
  - No model; IAM is purely authentication
  - RBAC, because it uses named roles
  answer: 0
  explanation: |
    Conditioning access on attributes (source IP, tags, MFA state, time) is
    attribute-based access control. IAM does use roles, but the conditional policy
    evaluation is fundamentally ABAC. It is not relationship-graph-based (1), and IAM
    clearly does authorization, not just authN (2).
  ref: concepts.md#rbac-versus-abac-and-modern-authorization
- id: security-authentication-data-protection-065
  difficulty: intermediate
  tags:
  - owasp
  - csrf
  - cookies
  question: |
    Which combination best mitigates Cross-Site Request Forgery (CSRF) for a
    cookie-authenticated web app?
  options:
  - Storing the session token in localStorage
  - SameSite cookie attributes plus anti-CSRF tokens (double-submit or synchronizer tokens)
  - Hashing all form inputs with bcrypt
  - Disabling HTTPS to simplify cookie handling
  answer: 1
  explanation: |
    CSRF exploits the browser auto-sending cookies on cross-site requests; SameSite
    (lax/strict) plus anti-CSRF tokens prevents forged requests from being honored.
    localStorage (0) trades CSRF for XSS risk and isn't the standard cookie mitigation;
    bcrypt (2) is for passwords; disabling HTTPS (3) is strictly harmful.
  ref: concepts.md#owasp-top-10-and-common-vulnerabilities
- id: security-authentication-data-protection-066
  difficulty: intermediate
  tags:
  - api-keys
  - storage
  - best-practice
  question: |
    How should API keys be stored and issued to minimize breach impact?
  options:
  - Reused across all customers to simplify management
  - Stored in plaintext so support staff can read them back to users
  - Hashed at rest (like passwords), scoped, prefixed for secret-scanning, and rotatable
  - Embedded in client-side code so the browser can call the API directly
  answer: 2
  explanation: |
    Treat API keys like passwords: store only a hash, scope them to least privilege,
    prefix them so scanners can catch leaks, and support rotation. Plaintext storage (1)
    means a DB dump leaks all keys; client-side embedding (3) exposes them to every user;
    key reuse (0) makes one leak compromise everyone.
  ref: concepts.md#api-keys-and-mutual-tls
- id: security-authentication-data-protection-067
  difficulty: advanced
  tags:
  - rate-limiting
  - strictness
  - false-positives
  - trade-offs
  question: |
    What is the core tension when tuning the strictness of a login rate limiter?
  options:
  - Rate limits have no effect on security, only on cost
  - The only correct setting is no limit, to avoid ever blocking a user
  - Stricter limits improve both security and legitimate-user experience simultaneously
  - Tight limits stop brute-force/stuffing but cause false rejections of legitimate bursts; loose limits
    reduce false rejections but let attacks through — so you layer per-IP, per-account, and global limits
  answer: 3
  explanation: |
    Rate limiting trades protection against false rejections: too tight blocks real
    users; too loose lets attacks through. The mature answer is layered limits (per-IP,
    per-account, global) plus backoff/CAPTCHA. Option 2 ignores the false-rejection cost,
    option 0 denies the security value, and option 1 removes a critical control.
  ref: concepts.md#rate-limiting-waf-and-ddos-defense
- id: security-authentication-data-protection-068
  difficulty: advanced
  tags:
  - encryption
  - searchable
  - queryability
  - trade-offs
  question: |
    A team wants to encrypt a customer email column at the application layer but still
    run equality lookups (find user by email). What is the realistic trade-off?
  options:
  - Encryption at the storage layer would also break equality queries
  - Application-layer encryption transparently supports range and equality queries with no changes
  - Encrypting the column breaks native indexing; to support equality lookups you typically store a separate
    deterministic hash/HMAC of the email for matching, accepting some information leakage and no range
    queries
  - You must switch to SHA-256 and give up decrypting the email
  answer: 2
  explanation: |
    App-layer encryption randomizes ciphertext, breaking indexes; a common workaround is
    a deterministic keyed hash (HMAC) of the email stored alongside for equality
    matching, which leaks equality/frequency and still doesn't allow range queries.
    Option 1 is false. Option 3 gives up reading the email entirely (sometimes fine, but
    not if you must display it). Option 0 is false — storage/disk encryption is
    transparent to queries.
  ref: concepts.md#encryption-at-rest-and-envelope-encryption
- id: security-authentication-data-protection-069
  difficulty: beginner
  tags:
  - defense-in-depth
  - basics
  question: |
    What does "defense in depth" mean?
  options:
  - Layering multiple independent controls so that a single control's failure is not catastrophic
  - Encrypting data twice with the same key
  - Placing all security logic inside the database
  - Relying on one very strong control (like a firewall) to stop all attacks
  answer: 0
  explanation: |
    Defense in depth layers independent controls (edge, network, identity, app, data,
    audit) so one failure doesn't breach everything. Option 3 is single-point reliance
    (the opposite). Option 1 is redundant encryption, not layered defense. Option 2
    centralizes rather than layers.
  ref: concepts.md#zero-trust-and-defense-in-depth
- id: security-authentication-data-protection-070
  difficulty: beginner
  tags:
  - least-privilege
  - basics
  question: |
    What is the principle of least privilege?
  options:
  - Give privileges based on seniority in the company
  - Remove all permissions so no one can do anything
  - Grant every user admin rights to avoid access-denied errors
  - Grant each principal only the minimum permissions needed to do its job, reducing blast radius if it
    is compromised
  answer: 3
  explanation: |
    Least privilege grants the minimum necessary access so a compromised account or
    service can do limited damage. Option 2 maximizes blast radius. Option 0 bases access
    on rank rather than need. Option 1 is unusable and not the principle.
  ref: concepts.md#authentication-versus-authorization
- id: security-authentication-data-protection-071
  difficulty: advanced
  tags:
  - oauth
  - oidc
  - availability
  - idp
  - trade-offs
  question: |
    Adopting OIDC via a third-party identity provider standardizes discovery, JWKS key
    rotation, and claims. What is the main systemic trade-off?
  options:
  - You gain interoperability and offload auth complexity, but take a hard availability and security dependency
    on the IdP (an IdP outage or compromise affects all logins)
  - OIDC makes tokens impossible to revoke under any circumstances
  - OIDC forces you to store user passwords yourself
  - OIDC removes the need for TLS, reducing cost
  answer: 0
  explanation: |
    OIDC's standardization is a big interoperability win, but centralizing on an IdP
    means its availability and security become yours — an outage blocks logins and a
    compromise is systemic. Option 3 is false (TLS still required). Option 1 overstates
    revocation limits. Option 2 is backwards — a key benefit is not handling passwords
    yourself.
  ref: concepts.md#oauth-20-and-openid-connect-flows
- id: security-authentication-data-protection-072
  difficulty: intermediate
  tags:
  - passkeys
  - webauthn
  - credential-storage
  question: |
    With passkeys / WebAuthn, what is stored on the server, and why is this safer than
    password storage?
  options:
  - The raw challenge-response secret shared with the client
  - The user's private key, encrypted with the server's KEK
  - Only the user's public key; the private key never leaves the device, so a server breach reveals nothing
    crackable and the scheme is phishing-resistant
  - A bcrypt hash of the biometric fingerprint
  answer: 2
  explanation: |
    WebAuthn stores only the public key server-side; the private key stays on the user's
    device (often in secure hardware), so a database breach yields nothing usable, and
    origin binding makes it phishing-resistant. Option 1 is wrong — the server never
    holds the private key. Options 3 and 0 misdescribe the model (no biometric or shared
    secret is stored).
  ref: concepts.md#password-hashing-and-credential-storage
- id: security-authentication-data-protection-073
  difficulty: advanced
  tags:
  - capacity
  - estimation
  - sessions
  - redis
  question: |
    You run server-side sessions for 100M active users. Each session record is ~200
    bytes and you need it in a fast store for a per-request lookup. Roughly how much
    memory does the session store need, and what does this imply?
  options:
  - ~2 TB — so sessions are infeasible and JWTs are mandatory
  - ~200 GB — requiring a large sharded database purely for sessions
  - ~2 GB — trivially small, so sessions have no scaling concern at all
  - ~20 GB — modest and fits in a small Redis cluster, so the real cost of sessions is the per-request
    lookup latency and running an HA store, not raw storage
  answer: 3
  explanation: |
    100M x 200 B = 20 GB, which fits comfortably in a small Redis cluster; storage is
    cheap. The real trade-off with sessions is the per-request lookup on the hot path and
    operating a highly available store — not raw capacity. Option 2 undercounts, options
    0 and 1 wildly overcount and draw the wrong conclusion.
  ref: concepts.md#sessions-versus-tokens
- id: security-authentication-data-protection-074
  difficulty: expert
  tags:
  - supply-chain
  - integrity
  - owasp
  - expert
  question: |
    A build pipeline pulls an unpinned third-party dependency that is later compromised
    upstream, injecting malicious code into your production artifact. Which OWASP
    category is this, and what controls address it?
  options:
  - Software and data integrity failures; pin/verify dependency versions and checksums, use signed artifacts
    (e.g., Sigstore) and an SBOM, and verify integrity in CI/CD
  - Cryptographic failure; enable TLS on the package registry
  - Injection; use parameterized queries in the build script
  - Broken access control; add RBAC to the repo
  answer: 0
  explanation: |
    Trusting unverified, unpinned dependencies is a Software and Data Integrity Failure
    (supply-chain risk, log4shell/SolarWinds class); defenses include version pinning,
    checksum/signature verification, signed artifacts, and SBOMs verified in CI/CD.
    RBAC (3), TLS (1), and parameterized queries (2) address different risks and do not
    stop a compromised upstream package.
  ref: concepts.md#owasp-top-10-and-common-vulnerabilities
- id: security-authentication-data-protection-075
  difficulty: intermediate
  tags:
  - authz
  - centralized
  - distributed
  - trade-offs
  question: |
    A design centralizes all authorization decisions in one policy service that every
    request must consult. Compared to authorizing locally within each service, what is
    the key trade-off?
  options:
  - There is no difference; both perform identically under all conditions
  - Centralizing gives consistency and auditability but adds a network hop and an availability dependency
    on the hot path
  - Centralizing removes all latency because one service is faster than many
  - Local authorization is always insecure and should never be used
  answer: 1
  explanation: |
    A central policy service yields consistent, auditable decisions but injects a hop and
    a hot-path availability dependency (mitigate with caching/sidecars). Option 2 is
    false — a central call adds latency, not removes it. Option 3 is wrong (local authZ,
    close to the data, is common and valid). Option 0 ignores real trade-offs.
  ref: concepts.md#authentication-versus-authorization
