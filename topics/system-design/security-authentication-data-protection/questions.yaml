  - expert
  question: |
    A RAG-based GenAI assistant retrieves documents and lets an LLM call internal tools.
    An attacker plants instructions inside a retrieved document that make the model
    exfiltrate data via a tool call. What is this attack, and what is the primary
    mitigation?
  options:
  - Indirect prompt injection; apply least-privilege tool scopes, treat retrieved content as untrusted,
    and add output/action guardrails rather than trusting the model to self-police
  - Cross-site scripting; HTML-encode the model's rendered output so the retrieved instructions cannot
    execute as script in the calling user's browser session
  - A distributed denial-of-service attack; add aggressive rate limiting to the LLM endpoint so the
    malicious document cannot be retrieved often enough to cause harm
  - SQL injection; use parameterized prepared statements in the vector database so the planted text
    cannot be interpreted as executable query commands
  answer: 0
  explanation: |
    Malicious instructions embedded in retrieved content are indirect prompt injection;
    because you cannot fully trust the model to ignore them, the durable defenses are
    least-privilege tool permissions, treating retrieved data as untrusted input, and
    enforcing action guardrails/human approval — defense in depth around the model.
    SQLi (3), XSS (1), and DDoS (2) are different classes and do not address the
    injection vector.
  ref: concepts.md#owasp-top-10-and-common-vulnerabilities
- id: security-authentication-data-protection-060
  difficulty: expert
  tags:
  - session
  - jwt
  - hybrid
  - revocation
  - trade-offs
  - expert
  question: |
    A large social platform wants stateless JWT verification on the hot path but must
    still support "log out all devices" and near-real-time ban enforcement. Which design
    best balances these?
  options:
  - Server-side sessions with a synchronous datastore read on every one of billions of hot-path requests,
    treating the session record as the single source of truth for bans
  - Storing every issued JWT in a sharded relational database and querying its revocation status on each
    request, so the hot path always reflects the newest ban state
  - Pure long-lived JWTs with no server state at all, accepting that device logouts and bans only take
    effect once the tokens naturally expire days later
  - Short-lived access JWTs plus a per-user token_version (or lightweight denylist cache) that verifiers
    check, so bumping the version invalidates all outstanding tokens within the access-token TTL
  answer: 3
  explanation: |
    A per-user token_version embedded in the JWT (or a small cached denylist) lets
    verifiers reject tokens whose version is stale; bumping it logs out all devices, and
    with short TTLs the effect is near-real-time — keeping the hot path mostly stateless.
    Option 2 sacrifices timely bans. Options 0 and 1 reintroduce a per-request datastore
    read at billions-of-requests scale, defeating the statelessness goal.
  ref: concepts.md#refresh-tokens-rotation-and-revocation
- id: security-authentication-data-protection-061
  difficulty: expert
  tags:
  - abac
  - policy-engine
  - latency
  - trade-offs
  - expert
  question: |
    You must enforce complex, context-dependent ABAC policies with sub-millisecond
    overhead and high availability, even if the central policy service is briefly
    unreachable. What deployment pattern fits, and what is its main challenge?
  options:
  - Distribute policies to an embedded engine / sidecar (e.g., OPA) so decisions are local and available;
    the main challenge is policy and data distribution/freshness (avoiding stale decisions)
  - Evaluate the ABAC policies entirely in the browser or mobile client so no server-side latency is added
    at all; the main challenge is merely shipping the rule bundle to each device
  - Hardcode the compiled policies directly into each service's binary and redeploy the whole fleet on
    every rule change; the main challenge is just keeping deploys frequent enough
  - Call a central policy service synchronously on every request; there is no real challenge because a
    replicated central service is effectively always available and adds negligible latency
  answer: 0
  explanation: |
    An embedded/sidecar policy engine (OPA) evaluates decisions locally for low latency
    and availability even during central-service blips; the hard part is distributing
    updated policies and the data they need while bounding staleness. A synchronous
    central call (3) adds a hop and an availability dependency. Client-side eval (1) is
    insecure. Hardcoding (2) makes every policy change a deploy.
  ref: concepts.md#rbac-versus-abac-and-modern-authorization
- id: security-authentication-data-protection-062
  difficulty: expert
  tags:
  - mfa
  - mfa-fatigue
  - number-matching
  - expert
  question: |
    After a breach, investigators find the attacker had a valid password and spammed
    push approvals until the user tapped "approve". What is this technique, and which
    control specifically defeats it?
  options:
  - Credential phishing; add a CAPTCHA challenge to the login form so automated approval spam cannot be
    submitted faster than a human could react
  - SIM swapping; work with the mobile carrier to port the hijacked phone number back to the legitimate
    user so the attacker loses the second factor
  - MFA fatigue (push bombing); require number-matching so the user must enter a code shown by the app,
    not just tap approve
  - Credential stuffing; force an immediate rotation of the user's password so the reused breached
    credential the attacker holds stops working
  answer: 2
  explanation: |
    Spamming push prompts to wear the user down is MFA fatigue / push bombing; plain
    one-tap push is fatigable, but number-matching forces the user to type a code
    displayed by the legitimate app, breaking blind approvals. SIM swap (1) and
    credential stuffing (3) are different attacks; a CAPTCHA (0) does not stop push
    bombing of an already-authenticated password.
  ref: concepts.md#multi-factor-authentication
- id: security-authentication-data-protection-063
  difficulty: intermediate
  tags:
  - oauth
  - implicit
  - deprecated
  question: |
    Why is the OAuth 2.0 Implicit flow deprecated in favor of Authorization Code with
    PKCE?
  options:
  - Implicit mandated a confidential client secret baked into the page that single-page apps had no
    secure way to store, so it was retired for public browser clients
  - Implicit was restricted to opaque reference tokens only and could never carry self-contained JWT
    access tokens, which modern SPAs and APIs now require
  - Implicit flow was simply too slow in practice because of the extra back-channel token-exchange
    round trip it required before the app could call any API
  - Implicit returned tokens directly in the URL fragment (leaking via history/referrer) and could not
    authenticate the client, whereas Auth Code + PKCE avoids exposing tokens in URLs
  answer: 3
  explanation: |
    Implicit delivered access tokens in the redirect URL fragment, exposing them to
    browser history, referrer headers, and logs, with no client authentication; Auth
    Code + PKCE keeps tokens out of URLs and binds the code to a verifier. Option 2 is
    backwards (Implicit had fewer steps but was less safe). Options 0 and 1 misstate the
    mechanics.
  ref: concepts.md#oauth-20-and-openid-connect-flows
- id: security-authentication-data-protection-064
  difficulty: intermediate
  tags:
  - abac
  - aws-iam
  question: |
    AWS IAM policies can allow access only when conditions like the request's source IP,
    resource tags, or whether MFA was used are met. Which access-control model does this
    most closely represent?
  options:
  - ABAC, because decisions depend on attributes of the subject, resource, and environment
  - ReBAC, because each condition is resolved by walking a relationship graph that links the caller to
    the specific resource through ownership edges
  - No access-control model at all; IAM condition keys are purely an authentication mechanism that only
    confirms the caller's identity, never what they may do
  - RBAC, because the whole decision reduces to the named IAM role attached to the principal, with the
    conditions acting only as labels on that role
  answer: 0
  explanation: |
    Conditioning access on attributes (source IP, tags, MFA state, time) is
    attribute-based access control. IAM does use roles, but the conditional policy
    evaluation is fundamentally ABAC. It is not relationship-graph-based (1), and IAM
    clearly does authorization, not just authN (2).
  ref: concepts.md#rbac-versus-abac-and-modern-authorization
- id: security-authentication-data-protection-065
  difficulty: intermediate
  tags:
  - owasp
  - csrf
  - cookies
  question: |
    Which combination best mitigates Cross-Site Request Forgery (CSRF) for a
    cookie-authenticated web app?
  options:
  - Storing the session token in browser localStorage so it is not auto-sent on cross-site requests
  - SameSite cookie attributes plus anti-CSRF tokens (double-submit or synchronizer tokens)
  - Hashing every submitted form field with bcrypt so forged cross-site values are rejected
  - Disabling HTTPS to simplify cookie handling and drop the cross-origin request protections
  answer: 1
  explanation: |
    CSRF exploits the browser auto-sending cookies on cross-site requests; SameSite
    (lax/strict) plus anti-CSRF tokens prevents forged requests from being honored.
    localStorage (0) trades CSRF for XSS risk and isn't the standard cookie mitigation;
    bcrypt (2) is for passwords; disabling HTTPS (3) is strictly harmful.
  ref: concepts.md#owasp-top-10-and-common-vulnerabilities
- id: security-authentication-data-protection-066
  difficulty: intermediate
  tags:
  - api-keys
  - storage
  - best-practice
  question: |
    How should API keys be stored and issued to minimize breach impact?
  options:
  - Reused as one shared key across all customers so key management and rotation stay centralized
  - Stored in plaintext in the database so support staff can read them back to users on request
  - Hashed at rest (like passwords), scoped, prefixed for secret-scanning, and rotatable
  - Embedded directly in client-side JavaScript so the browser can call the API without a proxy
  answer: 2
  explanation: |
    Treat API keys like passwords: store only a hash, scope them to least privilege,
    prefix them so scanners can catch leaks, and support rotation. Plaintext storage (1)
    means a DB dump leaks all keys; client-side embedding (3) exposes them to every user;
    key reuse (0) makes one leak compromise everyone.
  ref: concepts.md#api-keys-and-mutual-tls
- id: security-authentication-data-protection-067
  difficulty: advanced
  tags:
  - rate-limiting
  - strictness
  - false-positives
  - trade-offs
  question: |
    What is the core tension when tuning the strictness of a login rate limiter?
  options:
  - Login rate limits have no bearing on security whatsoever and only affect infrastructure cost, so
    tuning strictness is purely a capacity-planning exercise with no attacker-facing consequence
  - The only correct setting is to impose no limit at all, so that a legitimate user is never blocked,
    with brute-force and stuffing attacks handled entirely by downstream password hashing instead
  - Making the limits stricter simultaneously improves security and the legitimate-user experience, so
    there is no real tension and the tightest possible threshold is always the correct choice
  - Tight limits stop brute-force/stuffing but cause false rejections of legitimate bursts; loose limits
    reduce false rejections but let attacks through — so you layer per-IP, per-account, and global limits
  answer: 3
  explanation: |
    Rate limiting trades protection against false rejections: too tight blocks real
    users; too loose lets attacks through. The mature answer is layered limits (per-IP,
    per-account, global) plus backoff/CAPTCHA. Option 2 ignores the false-rejection cost,
    option 0 denies the security value, and option 1 removes a critical control.
  ref: concepts.md#rate-limiting-waf-and-ddos-defense
- id: security-authentication-data-protection-068
  difficulty: advanced
  tags:
  - encryption
  - searchable
  - queryability
  - trade-offs
  question: |
    A team wants to encrypt a customer email column at the application layer but still
    run equality lookups (find user by email). What is the realistic trade-off?
  options:
  - Transparent storage-layer (disk/TDE) encryption would also break equality queries on the column,
    since the database can no longer index the encrypted pages it decrypts on read
  - Application-layer encryption transparently preserves both range and equality queries with no schema
    changes, because the database engine indexes the plaintext before encrypting it to disk
  - Encrypting the column breaks native indexing; to support equality lookups you typically store a separate
    deterministic hash/HMAC of the email for matching, accepting some information leakage and no range
    queries
  - You must switch the column to a one-way SHA-256 digest and permanently give up ever decrypting or
    displaying the original email address back to the user
  answer: 2
  explanation: |
    App-layer encryption randomizes ciphertext, breaking indexes; a common workaround is
    a deterministic keyed hash (HMAC) of the email stored alongside for equality
    matching, which leaks equality/frequency and still doesn't allow range queries.
    Option 1 is false. Option 3 gives up reading the email entirely (sometimes fine, but
    not if you must display it). Option 0 is false — storage/disk encryption is
    transparent to queries.
  ref: concepts.md#encryption-at-rest-and-envelope-encryption
- id: security-authentication-data-protection-069
  difficulty: beginner
  tags:
  - defense-in-depth
  - basics
  question: |
    What does "defense in depth" mean?
  options:
  - Layering multiple independent controls so that a single control's failure is not catastrophic
  - Encrypting the same data twice in a row with the same key to double the effective cipher strength
  - Consolidating all of the system's security logic inside the database so it lives in one hardened place
  - Relying on one very strong perimeter control, like a firewall, to single-handedly stop every attack
  answer: 0
  explanation: |
    Defense in depth layers independent controls (edge, network, identity, app, data,
    audit) so one failure doesn't breach everything. Option 3 is single-point reliance
    (the opposite). Option 1 is redundant encryption, not layered defense. Option 2
    centralizes rather than layers.
  ref: concepts.md#zero-trust-and-defense-in-depth
- id: security-authentication-data-protection-070
  difficulty: beginner
  tags:
  - least-privilege
  - basics
  question: |
    What is the principle of least privilege?
  options:
  - Grant privileges strictly according to each person's seniority and title in the company org chart
  - Remove all permissions from every principal so that no one and no service can perform any action at all
  - Grant every user and service full admin rights up front so that access-denied errors never occur
  - Grant each principal only the minimum permissions needed to do its job, reducing blast radius if it
    is compromised
  answer: 3
  explanation: |
    Least privilege grants the minimum necessary access so a compromised account or
    service can do limited damage. Option 2 maximizes blast radius. Option 0 bases access
    on rank rather than need. Option 1 is unusable and not the principle.
  ref: concepts.md#authentication-versus-authorization
- id: security-authentication-data-protection-071
  difficulty: advanced
  tags:
  - oauth
  - oidc
  - availability
  - idp
  - trade-offs
  question: |
    Adopting OIDC via a third-party identity provider standardizes discovery, JWKS key
    rotation, and claims. What is the main systemic trade-off?
  options:
  - You gain interoperability and offload auth complexity, but take a hard availability and security dependency
    on the IdP (an IdP outage or compromise affects all logins)
  - OIDC makes the access and ID tokens it issues fundamentally impossible to revoke under any
    circumstances, so a stolen token stays valid until it expires
  - OIDC forces your application to collect and store every user's password directly in your own database
    rather than delegating credential handling to the provider
  - OIDC removes the need for TLS on the login path, reducing certificate and bandwidth cost across the
    whole authentication flow
  answer: 0
  explanation: |
    OIDC's standardization is a big interoperability win, but centralizing on an IdP
    means its availability and security become yours — an outage blocks logins and a
    compromise is systemic. Option 3 is false (TLS still required). Option 1 overstates
    revocation limits. Option 2 is backwards — a key benefit is not handling passwords
    yourself.
  ref: concepts.md#oauth-20-and-openid-connect-flows
- id: security-authentication-data-protection-072
  difficulty: intermediate
  tags:
  - passkeys
  - webauthn
  - credential-storage
  question: |
    With passkeys / WebAuthn, what is stored on the server, and why is this safer than
    password storage?
  options:
  - The raw shared challenge-response secret negotiated with the client at registration, which both sides
    keep so either can regenerate the signature later
  - The user's private key, encrypted at rest with the server's key-encryption key so it can be decrypted
    only inside the server's HSM when a login arrives
  - Only the user's public key; the private key never leaves the device, so a server breach reveals nothing
    crackable and the scheme is phishing-resistant
  - A bcrypt hash of the user's enrolled biometric fingerprint template, salted per user so the raw
    biometric can never be recovered from the stored record
  answer: 2
  explanation: |
    WebAuthn stores only the public key server-side; the private key stays on the user's
    device (often in secure hardware), so a database breach yields nothing usable, and
    origin binding makes it phishing-resistant. Option 1 is wrong — the server never
    holds the private key. Options 3 and 0 misdescribe the model (no biometric or shared
    secret is stored).
  ref: concepts.md#password-hashing-and-credential-storage
- id: security-authentication-data-protection-073
  difficulty: advanced
  tags:
  - capacity
  - estimation
  - sessions
  - redis
  question: |
    You run server-side sessions for 100M active users. Each session record is ~200
    bytes and you need it in a fast store for a per-request lookup. Roughly how much
    memory does the session store need, and what does this imply?
  options:
  - ~2 TB — so per-request lookups thrash memory, sessions become infeasible at this scale, and moving
    to stateless JWTs is mandatory
  - ~200 GB — since replication and index overhead roughly multiply each record, requiring a large sharded
    database dedicated purely to sessions
  - ~2 GB — trivially small once records are compressed on write, so sessions carry no per-request or
    scaling concern at all at this user count
  - ~20 GB — modest and fits in a small Redis cluster, so the real cost of sessions is the per-request
    lookup latency and running an HA store, not raw storage
  answer: 3
  explanation: |
    100M x 200 B = 20 GB, which fits comfortably in a small Redis cluster; storage is
    cheap. The real trade-off with sessions is the per-request lookup on the hot path and
    operating a highly available store — not raw capacity. Option 2 undercounts, options
    0 and 1 wildly overcount and draw the wrong conclusion.
  ref: concepts.md#sessions-versus-tokens
- id: security-authentication-data-protection-074
  difficulty: expert
  tags:
  - supply-chain
  - integrity
  - owasp
  - expert
  question: |
    A build pipeline pulls an unpinned third-party dependency that is later compromised
    upstream, injecting malicious code into your production artifact. Which OWASP
    category is this, and what controls address it?
  options:
  - Software and data integrity failures; pin/verify dependency versions and checksums, use signed artifacts
    (e.g., Sigstore) and an SBOM, and verify integrity in CI/CD
  - Cryptographic failure; enable TLS on the package registry and rotate its signing certificate so the
    compromised dependency can no longer be served over an untrusted channel
  - Injection; use parameterized queries and prepared statements in the build script so the malicious
    package contents cannot be interpreted as executable commands during the build
  - Broken access control; add RBAC to the source repository and require reviewer approval so an outside
    attacker cannot push the compromised dependency into the pipeline
  answer: 0
  explanation: |
    Trusting unverified, unpinned dependencies is a Software and Data Integrity Failure
    (supply-chain risk, log4shell/SolarWinds class); defenses include version pinning,
    checksum/signature verification, signed artifacts, and SBOMs verified in CI/CD.
    RBAC (3), TLS (1), and parameterized queries (2) address different risks and do not
    stop a compromised upstream package.
  ref: concepts.md#owasp-top-10-and-common-vulnerabilities
- id: security-authentication-data-protection-075
  difficulty: intermediate
  tags:
  - authz
  - centralized
  - distributed
  - trade-offs
  question: |
    A design centralizes all authorization decisions in one policy service that every
    request must consult. Compared to authorizing locally within each service, what is
    the key trade-off?
  options:
  - There is no meaningful difference; both approaches perform identically under all load conditions because
    the authorization check itself is the same regardless of where it runs
  - Centralizing gives consistency and auditability but adds a network hop and an availability dependency
    on the hot path
  - Centralizing removes all latency from the request path because a single dedicated policy service is
    inherently faster than repeating the check inside many separate services
  - Local authorization embedded in each service is always inherently insecure and should never be used,
    since only a central service can enforce policy correctly
  answer: 1
  explanation: |
    A central policy service yields consistent, auditable decisions but injects a hop and
    a hot-path availability dependency (mitigate with caching/sidecars). Option 2 is
    false — a central call adds latency, not removes it. Option 3 is wrong (local authZ,
    close to the data, is common and valid). Option 0 ignores real trade-offs.
  ref: concepts.md#authentication-versus-authorization
