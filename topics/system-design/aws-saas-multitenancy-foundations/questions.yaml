topic: "AWS SaaS and Multi-Tenancy Foundations"
domain: system-design
topic_slug: aws-saas-multitenancy-foundations
version: 1
questions:
  # ---------------- What multi-tenancy means on AWS and why SaaS ----------------
- id: aws-saas-multitenancy-foundations-001
  difficulty: beginner
  tags: [saas, definitions, tenant]
  question: |
    In AWS SaaS terminology, what is a "tenant"?
  options:
  - "Any customer you sign up to use your service, typically represented by a tenant administrator and that tenant's users"
  - "A single dedicated physical EC2 host, launched in dedicated-tenancy mode, that runs exactly one customer's workload"
  - "A member AWS account that AWS Organizations vends through Account Factory for internal billing separation"
  - "A dedicated VPC subnet, with its own route table and NACL, carved out for a single workload's networking"
  answer: 0
  explanation: |
    A tenant is the fundamental SaaS construct: any customer signed up to use the service, usually
    onboarded via a tenant administrator who then adds that tenant's users. It is a logical/business
    construct, not a specific piece of infrastructure — a tenant may map to an account, a VPC, a row,
    or nothing physical at all. The other options confuse a tenant with an isolation mechanism.
  ref: "concepts.md#what-multi-tenancy-means-on-aws-and-why-saas"

- id: aws-saas-multitenancy-foundations-002
  difficulty: beginner
  tags: [saas, unified-operation, managed-service]
  question: |
    What behaviour most fundamentally distinguishes true SaaS from a "managed-service model"?
  options:
  - "SaaS always runs on serverless compute such as Lambda and Fargate, while managed services are always deployed on customer-owned EC2 fleets"
  - "SaaS mandates a single shared database with a tenant_id column, while managed services always provision one isolated database per customer"
  - "Unified operation — one deployment, one version, and one operational pane apply to all tenants at once"
  - "SaaS by definition never grants any individual tenant dedicated resources, compute, or storage of any kind"
  answer: 2
  explanation: |
    The defining SaaS behaviour is unified operation: shipping one update applies it to all tenants
    from one deployment, one version, one ops view. A managed-service model gives each customer its
    own onboarding, patching, and operations, which does not scale operationally. Silo deployments and
    dedicated resources are still SaaS as long as identity/onboarding/ops stay shared, so the other
    options are false.
  ref: "concepts.md#what-multi-tenancy-means-on-aws-and-why-saas"

- id: aws-saas-multitenancy-foundations-003
  difficulty: beginner
  tags: [saas, economics, trade-offs]
  question: |
    Which is NOT one of the primary reasons providers choose multi-tenancy?
  options:
  - "Cost efficiency and economies of scale from a shared fleet"
  - "Operational leverage — one version to patch and one deploy pipeline"
  - "Agility and faster onboarding — a new tenant is ideally a database row"
  - "Guaranteed elimination of any cross-tenant data-leak risk"
  answer: 3
  explanation: |
    Multi-tenancy buys cost efficiency, operational leverage, and agility, but its price is exactly
    isolation risk (a bug/breach can cross tenant boundaries) and noisy neighbors. It does not
    eliminate cross-tenant leak risk; it increases it, which is why you must buy back isolation to the
    level compliance and blast-radius requirements demand.
  ref: "concepts.md#what-multi-tenancy-means-on-aws-and-why-saas"

- id: aws-saas-multitenancy-foundations-004
  difficulty: intermediate
  tags: [saas, silo, definitions]
  question: |
    A vendor deploys a fully dedicated application stack per customer but keeps a single shared
    identity system, one onboarding flow, and one operational dashboard across all customers. Is this
    SaaS?
  options:
  - "No — any dedicated per-customer stack is by definition a managed service"
  - "Yes — a fully siloed deployment is still SaaS as long as identity, onboarding, and operations stay shared"
  - "No — SaaS requires that every tenant share one physical database, so a dedicated stack disqualifies it"
  - "Only if each dedicated stack runs entirely on serverless compute such as Lambda, Fargate, and DynamoDB"
  answer: 1
  explanation: |
    "SaaS but siloed" is still SaaS. Silo is a deployment choice about the application plane, not a
    departure from SaaS. What makes it a managed service is when each customer gets its own
    onboarding, version, and ops. Here identity/onboarding/ops are shared, so unified operation holds.
    Sharing a database or using serverless is irrelevant to the SaaS-vs-managed distinction.
  ref: "concepts.md#what-multi-tenancy-means-on-aws-and-why-saas"

  # ---------------- The isolation spectrum from silo to pool ----------------
- id: aws-saas-multitenancy-foundations-005
  difficulty: beginner
  tags: [isolation-spectrum, silo, pool]
  question: |
    On the AWS tenant-isolation spectrum, which pairing correctly describes the two extremes?
  options:
  - "Account-per-tenant = strongest isolation and highest cost; shared table with tenant_id column = weakest and cheapest"
  - "Shared table with tenant_id column = strongest isolation; account-per-tenant = weakest"
  - "VPC-per-tenant = strongest isolation on the whole spectrum; subnet-per-tenant = the weakest boundary of all"
  - "Both extremes provide functionally identical isolation strength, differing only in monthly infrastructure cost"
  answer: 0
  explanation: |
    Isolation is a spectrum: a dedicated AWS account per tenant is the strongest boundary and highest
    cost; a single shared table with a tenant_id column is the cheapest and weakest boundary (app logic
    only). VPC and subnet models sit in between. Isolation is not binary, so the "identical isolation"
    option is wrong.
  ref: "concepts.md#the-isolation-spectrum-from-silo-to-pool"

- id: aws-saas-multitenancy-foundations-006
  difficulty: intermediate
  tags: [isolation-spectrum, complexity, trade-offs]
  question: |
    How does the *shape* of complexity change as you move from the silo end to the pool end of the
    isolation spectrum?
  options:
  - "It stays purely operational at both ends — running many stacks in silo and running one shared fleet in pool are equally ops-bound"
  - "Silo complexity is code-correctness (careful tenant scoping); pool complexity is operational (managing many stacks, quotas, and deploys)"
  - "Silo complexity is operational (managing many stacks, quotas, deploys); pool complexity is code correctness (one tenant-scoping bug leaks everyone)"
  - "Complexity disappears entirely in the pool model because everything is shared and there is only one stack to operate"
  answer: 2
  explanation: |
    Silo pushes complexity into operations: a fleet of stacks, quota pressure, many deploys. Pool
    pushes complexity into code correctness: one flaw in the tenant-scoping logic can leak every
    tenant's data. Neither end is free of complexity; the burden simply changes shape, which is why the
    other options are wrong.
  ref: "concepts.md#the-isolation-spectrum-from-silo-to-pool"

- id: aws-saas-multitenancy-foundations-007
  difficulty: intermediate
  tags: [isolation-spectrum, data-layer, sub-models]
  question: |
    The anchor article's data-layer isolation pattern has four sub-models. Which list matches them?
  options:
  - "Account-per-tenant, VPC-per-tenant, subnet-per-tenant, container-per-tenant"
  - "Silo, pool, bridge, and cell — the four named deployment tiers of the SaaS Lens isolation model"
  - "Read replica per tenant, write primary per tenant, ElastiCache node per tenant, and SQS queue per tenant"
  - "Instance-per-tenant; one instance with separate databases via a tenant-map store; separate tables/schemas per tenant; shared schema with a tenant_id column"
  answer: 3
  explanation: |
    The data-layer sub-models run: (a) full instance isolation per tenant, (b) one instance with
    separate databases resolved by a tenant-map store, (c) separate tables/schemas per tenant, and
    (d) shared schema plus a tenant_id column (pool). The other options describe compute/network
    patterns or naming that belong to different layers of the spectrum.
  ref: "concepts.md#the-isolation-spectrum-from-silo-to-pool"

- id: aws-saas-multitenancy-foundations-008
  difficulty: advanced
  tags: [isolation-spectrum, subnet, vpc, trade-offs]
  question: |
    A team proposes subnet-level isolation (one subnet set per tenant in a single VPC) so each tenant
    can have "independent networking." What is the key limitation they are overlooking?
  options:
  - "Subnets cannot have security groups or NACLs attached, so a subnet boundary provides no traffic isolation whatsoever"
  - "VPC-wide settings such as the DHCP option set are shared across all subnets, so a change affects every tenant — subnets do not grant independent VPC configuration"
  - "Subnets each carry their own NAT gateway and are therefore more expensive to run than a full VPC-per-tenant"
  - "Subnet isolation offers strictly stronger isolation than account-per-tenant because subnets are smaller units"
  answer: 1
  explanation: |
    Subnet-per-tenant shares VPC-wide settings (DHCP option sets and other configuration) across all
    subnets, so those cannot be varied per tenant and a change hits everyone; NACL/SG management also
    gets tedious. Truly independent networking requires VPC-per-tenant or account-per-tenant. Subnets do
    support SG/NACL boundaries (so "no isolation" is false), and they are cheaper — not stronger — than
    a full account boundary.
  ref: "concepts.md#the-isolation-spectrum-from-silo-to-pool"

  # ---------------- Silo, pool, and bridge models ----------------
- id: aws-saas-multitenancy-foundations-009
  difficulty: beginner
  tags: [silo, pool, bridge, saas-lens]
  question: |
    In SaaS Lens vocabulary, what is the "bridge" model?
  options:
  - "A mixed mode where some microservices are siloed and some are pooled, chosen per service and per tier"
  - "A dedicated networking appliance, backed by Transit Gateway, that connects every tenant's VPC into one mesh"
  - "A model where every tenant shares exactly one pooled database but is always given its own dedicated compute"
  - "The temporary transitional state a system passes through before all of its tenants become fully pooled"
  answer: 0
  explanation: |
    Bridge is the realistic middle: mixed mode where a service's regulatory profile and noisy-neighbor
    sensitivity push it toward silo while agility, uniform access, and cost push it toward pool. It is
    a per-service/per-tier design decision, not a networking appliance, a single fixed layout, or a
    temporary phase.
  ref: "concepts.md#silo-pool-and-bridge-models"

- id: aws-saas-multitenancy-foundations-010
  difficulty: intermediate
  tags: [pod, cell, bridge, blast-radius]
  question: |
    What does a "pod" (cell) deployment give you in a bridge architecture?
  options:
  - "Global isolation in which every single tenant is provisioned its own dedicated AWS account and VPC"
  - "A way to share one unpartitioned database across every tenant, with no tenant_id key or scoping at all"
  - "A self-contained stack serving a bounded set of tenants — pooled within a pod, siloed across pods — which caps blast radius and maps cleanly to tiering"
  - "Automatic elimination of every noisy-neighbor effect for all tenants co-located inside the same pod"
  answer: 2
  explanation: |
    A pod/cell is pooled within the cell and siloed across cells, so a bad deploy or breach hits only
    that cell's tenants — bounding blast radius — and premium tenants can be placed in smaller/dedicated
    pods. It is not account-per-tenant, not an unpartitioned shared DB, and it does not remove
    noisy-neighbor effects among the tenants sharing the pod.
  ref: "concepts.md#silo-pool-and-bridge-models"

- id: aws-saas-multitenancy-foundations-011
  difficulty: advanced
  tags: [silo, pool, bridge, interview]
  question: |
    An interviewer asks "silo or pool?" for a broad multi-tenant SaaS design. What is the strongest
    opening move?
  options:
  - "Pick pool globally for every layer because a fully shared fleet is always the cheapest possible option"
  - "Pick silo globally for every layer because dedicated per-tenant stacks are always the safest possible option"
  - "Say the answer depends only on the programming language and web framework the team has chosen to build on"
  - "Answer 'neither globally — bridge': decompose the system by layer and tier, then justify each layer's silo/pool choice with its own trade-off"
  answer: 3
  explanation: |
    There is no one-size-fits-all SaaS architecture. The senior signal is to decompose each service by
    its multi-tenant load and isolation profile, then assign silo/pool per layer and per tier, naming
    the trade-off each time. Committing globally to pool or silo is the wrong instinct, and language
    choice is irrelevant to the isolation model.
  ref: "concepts.md#silo-pool-and-bridge-models"

- id: aws-saas-multitenancy-foundations-012
  difficulty: intermediate
  tags: [silo, cost-attribution, blast-radius]
  question: |
    Which statement about the pure silo model is correct?
  options:
  - "Per-tenant cost attribution is hard (usage is commingled) and the blast radius of any failure spans all tenants"
  - "Per-tenant cost attribution is trivial and blast radius is one tenant, but cost and operational overhead scale with tenant count"
  - "It offers the cheapest infrastructure footprint of any model because resources are shared across every tenant"
  - "It requires enforcing every tenant boundary purely in application software, such as an appended tenant_id filter"
  answer: 1
  explanation: |
    Silo gives dedicated resources: cost attribution is trivial (tag the stack/account), blast radius
    is a single tenant, and isolation is enforced by infrastructure — but cost and ops overhead grow
    with the number of tenants. Hard cost attribution, all-tenant blast radius, cheapest infra, and
    software-enforced isolation are all characteristics of the pool model instead.
  ref: "concepts.md#silo-pool-and-bridge-models"

  # ---------------- Tenant isolation is not authN/authZ ----------------
- id: aws-saas-multitenancy-foundations-013
  difficulty: intermediate
  tags: [isolation, authn, authz, misconception]
  question: |
    Why is it wrong to assume a request is tenant-isolated simply because the user is authenticated and
    authorized?
  options:
  - "Authentication proves who the user is and authorization decides what actions they may take, but neither inherently blocks reaching another tenant's resources — isolation is a separate constraint"
  - "Authentication tokens expire after a fixed TTL, so any tenant isolation they provide is only temporary anyway"
  - "Authorization already rewrites and scopes every database query to the caller's correct tenant fully automatically"
  - "Isolation and authentication are the same underlying mechanism in AWS, both handled entirely by IAM policies"
  answer: 0
  explanation: |
    Per the Tenant Isolation whitepaper, a fully authenticated and authorized user can still reach
    another tenant's resources; isolation is applied separately from authN/authZ. AuthN answers "who,"
    authZ answers "what actions," and isolation answers "which tenant's resources are reachable at all."
    Authorization does not automatically tenant-scope queries, and token expiry is unrelated.
  ref: "concepts.md#tenant-isolation-is-not-authentication-or-authorization"

- id: aws-saas-multitenancy-foundations-014
  difficulty: advanced
  tags: [isolation, where-clause, correctness]
  question: |
    A team enforces tenancy by having application code append `WHERE tenant_id = ?` on every query.
    Why does the SaaS Lens consider this NOT real tenant isolation?
  options:
  - "Because SQL WHERE clauses on a tenant_id column are far too slow to evaluate once the table grows large"
  - "Because tenant_id columns are explicitly disallowed by relational databases and rejected by the query planner"
  - "Because it is a convention that one forgotten line breaks; real isolation pushes the boundary into a layer the request cannot escape (STS-scoped creds, LeadingKeys, RLS, or a separate account/VPC)"
  - "Because it requires calling a separate user→tenant lookup service on the hot path of every single query"
  answer: 2
  explanation: |
    A code-appended filter is a developer convention: a single missing clause causes a cross-tenant
    leak — described as a significant, potentially unrecoverable event. Real isolation lives in a layer
    the request cannot bypass (STS-scoped temporary credentials, dynamodb:LeadingKeys, Postgres RLS, or
    an account/VPC boundary). The concern is correctness, not WHERE-clause performance or column
    legality.
  ref: "concepts.md#tenant-isolation-is-not-authentication-or-authorization"

- id: aws-saas-multitenancy-foundations-015
  difficulty: intermediate
  tags: [isolation, definitions, layering]
  question: |
    Which best captures the distinct role of "tenant isolation" relative to authentication and
    authorization?
  options:
  - "It proves who the user is by validating their credentials against the configured identity provider"
  - "It decides which application actions, roles, and permissions an already-identified user is allowed to perform"
  - "It issues and signs the JWT access token during the login handshake with the identity provider"
  - "It constrains which tenant's resources are reachable at all, enforced for every user of a tenant independently of the app's authZ logic"
  answer: 3
  explanation: |
    Tenant isolation constrains which tenant's resources can be touched at all, applied uniformly to
    every user of a tenant and independent of the application's authorization logic. Proving identity is
    authentication, deciding permitted actions is authorization, and issuing JWTs is an identity-provider
    function.
  ref: "concepts.md#tenant-isolation-is-not-authentication-or-authorization"

  # ---------------- Isolation enforcement mechanisms on AWS ----------------
- id: aws-saas-multitenancy-foundations-016
  difficulty: intermediate
  tags: [dynamodb, leading-keys, iam, enforcement]
  question: |
    What does the `dynamodb:LeadingKeys` IAM condition do in a pooled DynamoDB table?
  options:
  - "Encrypts each tenant's items at rest under a separate per-tenant KMS customer-managed key for isolation"
  - "Restricts access to items whose partition key begins with the caller's tenant ID, enforced by the DynamoDB service rather than the application"
  - "Automatically shards a hot tenant's writes across multiple physical partitions to relieve throttling"
  - "Creates and provisions a separate dedicated table per tenant on demand as new tenants onboard"
  answer: 1
  explanation: |
    dynamodb:LeadingKeys is an IAM condition that limits a principal to items whose partition key
    begins with that caller's tenant ID; the DynamoDB service enforces it, so the app physically cannot
    touch other tenants' items. It is not encryption, not automatic sharding, and does not create tables.
  ref: "concepts.md#isolation-enforcement-mechanisms-on-aws"

- id: aws-saas-multitenancy-foundations-017
  difficulty: advanced
  tags: [abac, session-tags, sts, iam]
  question: |
    Why does ABAC with STS session tags (passing `TenantID` and referencing
    `${aws:PrincipalTag/TenantID}` in the policy condition) scale better than generating a distinct IAM
    policy per tenant?
  options:
  - "Because one policy parameterized by the tenant tag serves all tenants, avoiding per-tenant policy proliferation (which otherwise hits IAM limits and management burden)"
  - "Because passing session tags removes the need to call STS AssumeRole entirely, saving a hop per request"
  - "Because STS session tags are unlimited per session, letting you encode arbitrarily many tenant attributes"
  - "Because ABAC disables the upstream authentication checks, trusting the principal tag as proof of identity"
  answer: 0
  explanation: |
    With ABAC, a single policy references the caller's TenantID principal tag in its Condition, so it
    scales to all tenants without creating a policy per tenant — avoiding policy proliferation and IAM
    limits. AssumeRole is still used (the tag is passed on it), session tags are limited (50 per
    session), and authentication is unaffected.
  ref: "concepts.md#isolation-enforcement-mechanisms-on-aws"

- id: aws-saas-multitenancy-foundations-018
  difficulty: advanced
  tags: [session-tags, sts, limits]
  question: |
    A design encodes many tenant-related attributes as STS session tags on each AssumeRole call. Which
    hard limit should you keep in mind?
  options:
  - "10 session tags per session"
  - "300 session tags per session"
  - "50 session tags per session"
  - "There is no limit on session tags"
  answer: 2
  explanation: |
    STS allows a maximum of 50 session tags per session, so you cannot pack unlimited tenant metadata
    into tags — pushing you toward a compact tenant context (tenant ID + tier) with the rest resolved
    elsewhere. The other values are incorrect.
  ref: "concepts.md#isolation-enforcement-mechanisms-on-aws"

- id: aws-saas-multitenancy-foundations-019
  difficulty: expert
  tags: [sts, dynamodb, enforcement, flow]
  question: |
    In the canonical pooled-data isolation flow, the application service calls STS AssumeRole with a
    TenantID session tag before touching DynamoDB. Why perform the data operation with those returned
    temporary credentials rather than the service's own broad role?
  options:
  - "To shave STS round-trip latency off the request path by caching one broad role's credentials for reuse"
  - "Because short-lived temporary credentials are billed at a lower per-request rate than a standing IAM role"
  - "Because DynamoDB rejects long-lived IAM role credentials and accepts only STS-issued temporary tokens"
  - "So the credentials are physically scoped (via LeadingKeys / PrincipalTag conditions) to one tenant's items, making other tenants' data unreachable even if application code is buggy"
  answer: 3
  explanation: |
    Using per-request scoped temporary credentials moves the tenant boundary out of application code
    and into the credential itself: LeadingKeys/PrincipalTag conditions make other tenants' items
    unreachable regardless of application bugs. It adds STS latency (not reduces it), DynamoDB accepts
    the service's role fine, and there is no per-call pricing difference of the sort described.
  ref: "concepts.md#isolation-enforcement-mechanisms-on-aws"

- id: aws-saas-multitenancy-foundations-020
  difficulty: intermediate
  tags: [eks, irsa, rbac, enforcement]
  question: |
    Which mechanism provides per-namespace / per-tenant IAM scoping for tenant workloads on EKS?
  options:
  - "The dynamodb:LeadingKeys IAM condition, applied per Kubernetes namespace to scope pod IAM access"
  - "Kubernetes RBAC combined with IRSA (IAM Roles for Service Accounts)"
  - "Postgres Row-Level Security policies bound to each tenant namespace's service account"
  - "API Gateway usage plans mapped one-per-namespace to grant tenant-scoped IAM roles"
  answer: 1
  explanation: |
    On EKS, Kubernetes RBAC plus IRSA maps service accounts to IAM roles, giving per-namespace/
    per-tenant AWS access scoping. LeadingKeys is DynamoDB-specific, RLS is a relational-database
    mechanism, and usage plans throttle API traffic — none of them provide EKS service-account IAM
    scoping.
  ref: "concepts.md#isolation-enforcement-mechanisms-on-aws"

- id: aws-saas-multitenancy-foundations-021
  difficulty: beginner
  tags: [enforcement, coarse-grained, fine-grained]
  question: |
    Which set of mechanisms is "coarse-grained" (silo-oriented) tenant isolation on AWS?
  options:
  - "A separate AWS account, VPC, subnet, or security-group/NACL boundary"
  - "STS-scoped temporary credentials, dynamodb:LeadingKeys conditions, and Postgres Row-Level Security"
  - "ABAC session tags and IRSA service-account role mappings applied at the pool infrastructure boundary"
  - "Cognito custom claims plus per-request JWT signature validation acting as the account-level boundary"
  answer: 0
  explanation: |
    Coarse-grained isolation uses infrastructure boundaries — a separate account, VPC, subnet, or
    SG/NACL — which are strong and easy to reason about but expensive and quota-limited. STS-scoped
    creds, LeadingKeys, RLS, ABAC, and IRSA are the fine-grained (pool-oriented) mechanisms; Cognito
    claims are identity, not isolation enforcement.
  ref: "concepts.md#isolation-enforcement-mechanisms-on-aws"

  # ---------------- Control plane versus application plane ----------------
- id: aws-saas-multitenancy-foundations-022
  difficulty: intermediate
  tags: [control-plane, application-plane, architecture]
  question: |
    Which responsibilities belong to the SaaS control plane rather than the application plane?
  options:
  - "The multi-tenant business features tenants actually use, such as the workload's core domain APIs and screens"
  - "The per-request tenant-scoped data queries that read and write each tenant's rows in the shared store"
  - "Onboarding/provisioning, the tenant registry, identity, metering, billing, tiering, and admin/ops dashboards"
  - "The silo/pool isolation choice made independently for each workload microservice at deploy time"
  answer: 2
  explanation: |
    The control plane is tenant-agnostic and always shared: it runs the business of SaaS —
    onboarding/provisioning, tenant registry, identity, metering, billing, tiering, and operational
    dashboards. The application plane is where the multi-tenant workload runs and where silo/pool/bridge
    and tenant-scoped queries live.
  ref: "concepts.md#control-plane-versus-application-plane"

- id: aws-saas-multitenancy-foundations-023
  difficulty: advanced
  tags: [control-plane, silo, uniform-operation]
  question: |
    Why is the control plane described as "always shared" even in a design where every tenant's
    application plane is fully siloed?
  options:
  - "Because AWS Organizations enforces a hard limit of exactly one control-plane account per organization root"
  - "Because the control plane must be co-located in the same VPC as every tenant's application plane to route requests"
  - "Because siloed tenants are technically barred from provisioning their own dedicated databases or stacks"
  - "Because onboarding, identity, metering, billing, and operations are what create one uniform operational experience — the thing that makes it SaaS rather than N managed installs"
  answer: 3
  explanation: |
    The shared control plane is precisely what lets you offer a siloed enterprise tenant and a pooled
    SMB tenant through one uniform operational experience — unified operation, the SaaS-defining
    property. It is not an Organizations constraint, does not forbid per-tenant databases, and has no
    VPC-colocation requirement.
  ref: "concepts.md#control-plane-versus-application-plane"

- id: aws-saas-multitenancy-foundations-024
  difficulty: intermediate
  tags: [control-plane, tenant-context, flow]
  question: |
    Where does the tenant context (TenantId) originate, and where does it flow?
  options:
  - "It originates in the application database's tenant table and flows upward to seed the control plane"
  - "It originates in the control plane at onboarding and flows into the application plane to drive isolation, routing, metering, and logging"
  - "It is generated fresh on each request by an API Gateway authorizer with no persistent backing store"
  - "It originates in the CloudFront edge cache and is stamped onto responses on the return path"
  answer: 1
  explanation: |
    Tenant context originates in the control plane at onboarding (when the tenant record is created)
    and flows into the application plane to drive isolation, routing, metering, and logging. It is not
    born in the database, invented per request without a source, or created at the CDN edge.
  ref: "concepts.md#control-plane-versus-application-plane"

- id: aws-saas-multitenancy-foundations-025
  difficulty: intermediate
  tags: [control-plane, reference-architectures, sbt]
  question: |
    Which AWS assets ship reference implementations of the control-plane/application-plane split?
  options:
  - "The SaaS Builder Toolkit (SBT) and the EKS SaaS / serverless SaaS reference architectures"
  - "AWS Config conformance packs and AWS Trusted Advisor's multi-tenancy checks"
  - "Amazon Inspector's tenant-isolation scanner and Amazon Macie's per-tenant classifiers"
  - "AWS Batch job queues and AWS Glue workflows wired as the control-plane provisioner"
  answer: 0
  explanation: |
    AWS provides the SaaS Builder Toolkit (SBT) and the EKS SaaS and serverless SaaS reference
    architectures as implementations of the control/application-plane model. The other services address
    configuration compliance, vulnerability scanning, data classification, or batch/ETL — not the SaaS
    plane split.
  ref: "concepts.md#control-plane-versus-application-plane"

  # ---------------- SaaS identity and tenant context with Cognito ----------------
- id: aws-saas-multitenancy-foundations-026
  difficulty: intermediate
  tags: [cognito, jwt, pre-token-generation]
  question: |
    In the Cognito-based SaaS identity flow, how is the `custom:tenantId` claim injected into a user's
    JWT?
  options:
  - "By manually editing each user's decoded token payload in a post-login callback handler"
  - "By packing the tenantId into the JWT's cryptographic signature segment during signing"
  - "Via a Pre-Token-Generation Lambda trigger that adds custom claims during token issuance"
  - "By having an API Gateway authorizer rewrite and re-sign the token on the response path"
  answer: 2
  explanation: |
    A Pre-Token-Generation Lambda trigger injects custom claims like custom:tenantId and tier into the
    token as Cognito issues it. Tokens cannot be hand-edited, the signature is not a claim store, and
    API Gateway validates/extracts the claim rather than rewriting the token.
  ref: "concepts.md#saas-identity-and-tenant-context-with-cognito"

- id: aws-saas-multitenancy-foundations-027
  difficulty: advanced
  tags: [saas-identity, design-principle, bottleneck]
  question: |
    The design principle "bind user identity to tenant identity" says tenant context must be a
    first-class construct resolvable without calling another service. What problem does a separate
    user→tenant lookup service introduce?
  options:
  - "It inflates the JWT past Cognito's token-size limit by appending the resolved tenant record to claims"
  - "It forces every tenant onto a dedicated silo stack because the lookup cannot resolve pooled tenants"
  - "It blocks the use of API Gateway Lambda authorizers, which cannot call an external lookup service"
  - "It can undermine security and creates bottlenecks (an extra dependency in the hot path for every request)"
  answer: 3
  explanation: |
    A standalone user→tenant lookup service is called out as something that can undermine security and
    create bottlenecks, which is why the tenant binding should ride inside the token as a first-class
    claim. It is unrelated to token-size limits, does not block authorizers, and does not force a silo
    model.
  ref: "concepts.md#saas-identity-and-tenant-context-with-cognito"

- id: aws-saas-multitenancy-foundations-028
  difficulty: advanced
  tags: [cognito, quotas, noisy-neighbor, identity]
  question: |
    In a single pooled Cognito user pool, one tenant experiences a login spike that consumes the
    Region/account `UserAuthentication` request-rate quota (~120 RPS). What is this an example of?
  options:
  - "A hot DynamoDB partition, where the tenant's login writes concentrate on one physical partition key"
  - "A noisy neighbor at the identity layer, because the request-rate quota is per-Region/per-account and shared across all tenants in the pool"
  - "A blast-radius event whose impact stays contained to that one spiking tenant's own users"
  - "An IAM policy-size violation triggered by the login surge exceeding the managed policy character limit"
  answer: 1
  explanation: |
    Cognito request-rate quotas such as UserAuthentication (~120 RPS) are per-Region, per-account, and
    shared across all tenants in a pooled user pool, so one tenant's auth spike throttles others — a
    noisy neighbor at the identity layer. It is not a DynamoDB partition issue, is not isolated to one
    tenant, and has nothing to do with IAM policy size.
  ref: "concepts.md#saas-identity-and-tenant-context-with-cognito"

- id: aws-saas-multitenancy-foundations-029
  difficulty: expert
  tags: [cognito, custom-domains, quota, vanity-domain]
  question: |
    A B2B product wants to give each of ~2,000 enterprise tenants a unique vanity login domain backed
    by Cognito. Which non-adjustable quota makes this infeasible with custom domains alone?
  options:
  - "4 custom domains per Region (non-adjustable)"
  - "50 custom attributes per user pool"
  - "1,000 user pools per Region"
  - "300 identity providers per user pool"
  answer: 0
  explanation: |
    Cognito allows only 4 custom domains per Region and this quota is non-adjustable, so it is a hard
    wall against giving thousands of tenants vanity login domains. The user-pool count is high enough
    per Region, custom attributes cap tenant metadata (not domains), and the IdP-per-pool limit governs
    federation, not domains.
  ref: "concepts.md#saas-identity-and-tenant-context-with-cognito"

- id: aws-saas-multitenancy-foundations-030
  difficulty: intermediate
  tags: [cognito, pooled-identity, siloed-identity, bridge]
  question: |
    An enterprise tenant requires its own SAML/OIDC federation and branding, while thousands of Basic
    tenants do not. Which identity strategy fits best?
  options:
  - "Pooled identity for everyone in one shared user pool, encoding both tenant and tier as custom claims for all tiers alike"
  - "Siloed identity with a dedicated user pool for every tenant regardless of tier, including all the Basic-tier customers"
  - "Bridge identity: a shared pooled user pool for Basic tier, with dedicated user pools only for enterprise tenants that need their own IdP federation"
  - "Skip Cognito entirely and provision an IAM user per tenant, federating enterprise SAML through IAM directly"
  answer: 2
  explanation: |
    Bridge identity matches the requirement: pool the many Basic tenants for cost, and provision
    dedicated user pools only for the enterprise tenants needing per-tenant SAML/OIDC and branding.
    Pooling everyone can't give per-tenant federation; siloing everyone burns user-pool quota and ops
    needlessly; IAM users are not an end-user identity mechanism for SaaS customers.
  ref: "concepts.md#saas-identity-and-tenant-context-with-cognito"

- id: aws-saas-multitenancy-foundations-031
  difficulty: expert
  tags: [cognito, custom-attributes, quota, tenant-metadata]
  question: |
    A team plans to encode a growing set of tenant metadata fields as Cognito custom attributes on the
    user pool. Which non-adjustable limit constrains this approach?
  options:
  - "120 RPS UserAuthentication rate"
  - "100 groups a user can belong to"
  - "40,000,000 users per user pool"
  - "50 custom attributes per user pool"
  answer: 3
  explanation: |
    Cognito caps custom attributes at 50 per user pool and this is non-adjustable, so it limits how
    much tenant metadata you can encode as attributes — push richer metadata to a tenant registry.
    Group membership limits, the users-per-pool ceiling, and the auth request-rate quota are unrelated
    to attribute count.
  ref: "concepts.md#saas-identity-and-tenant-context-with-cognito"

- id: aws-saas-multitenancy-foundations-032
  difficulty: beginner
  tags: [saas-identity, definitions, jwt]
  question: |
    What is the "SaaS identity"?
  options:
  - "The AWS account ID that owns the SaaS application and pays for its shared infrastructure"
  - "The binding of a user to a tenant, carried in a token that holds both the user identity and the tenant identity"
  - "A dedicated IAM role the SaaS operations team assumes to administer all tenant workloads"
  - "The CloudFront distribution ID that fronts the login page and caches its static assets"
  answer: 1
  explanation: |
    SaaS identity is the binding of a user to a tenant: on authentication the IdP issues a token
    carrying both the user identity and the tenant identity, which then flows into every microservice
    for tenant-aware logging, metering, and isolation. It is not an account ID, an ops IAM role, or a
    CloudFront distribution.
  ref: "concepts.md#saas-identity-and-tenant-context-with-cognito"

  # ---------------- Compute isolation on AWS ----------------
- id: aws-saas-multitenancy-foundations-033
  difficulty: intermediate
  tags: [lambda, concurrency, noisy-neighbor, serverless]
  question: |
    In a serverless SaaS on shared Lambda functions, which account-level constraint can let a runaway
    tenant starve others, and what mitigates it?
  options:
  - "The account-level Lambda concurrency limit shared across all tenants, mitigated by reserved concurrency per tenant/tier"
  - "The 400 KB item-size limit, mitigated by compression"
  - "The 5 VPCs-per-Region limit, mitigated by adding subnets"
  - "The 50 session-tags limit, mitigated by fewer tags"
  answer: 0
  explanation: |
    Lambda concurrency is an account-level limit shared across all tenants, so a runaway tenant can
    consume it and starve others; reserved (or provisioned) concurrency per tenant/tier carves out
    protected capacity. The 400 KB limit is DynamoDB item size, VPC/subnet limits are networking, and
    the 50-tag limit is an STS constraint — none is the compute-starvation lever here.
  ref: "concepts.md#compute-isolation-on-aws"

- id: aws-saas-multitenancy-foundations-034
  difficulty: advanced
  tags: [eks, attack-surface, container-escape, hardening]
  question: |
    Why do shared EKS worker nodes widen the attack surface in a pooled multi-tenant cluster, and how
    do you harden it for premium tiers?
  options:
  - "They don't — Kubernetes namespaces are a hardware-enforced security boundary equivalent to separate AWS accounts"
  - "The only risk is CPU contention between co-scheduled pods, fully solved by cluster autoscaling and resource requests"
  - "Container escape and cross-namespace traffic are real risks on shared nodes; harden with IRSA, NetworkPolicies, policy engines (Kyverno/OPA), and node-level isolation (dedicated node groups or Fargate) for premium tiers"
  - "Shared nodes are perfectly safe as long as you consolidate every tenant onto one large, heavily-provisioned node"
  answer: 2
  explanation: |
    Namespaces are a logical boundary, not an account-strength one: on shared nodes, container escape
    and cross-namespace traffic are genuine risks. Hardening layers include IRSA, NetworkPolicies,
    policy engines like Kyverno/OPA, and node-level isolation via dedicated node groups or Fargate for
    premium tiers. Autoscaling addresses capacity, not the escape/traffic attack surface.
  ref: "concepts.md#compute-isolation-on-aws"

- id: aws-saas-multitenancy-foundations-035
  difficulty: intermediate
  tags: [compute, silo, pool, trade-offs]
  question: |
    Which describes the core trade-off between silo compute and pool compute?
  options:
  - "Silo compute gives the best fleet utilization by packing tenants tightly, while pool compute leaves idle per-tenant capacity reserved and unused"
  - "Pool compute eliminates the need for tenant-scoped credentials because the shared runtime already isolates each tenant's data"
  - "Both models deliver identical utilization and isolation strength, differing only in how their dashboards are labelled"
  - "Silo compute gives strong isolation and per-tenant scaling/cost but idle capacity and a large fleet; pool compute gives best utilization but noisy-neighbor and blast-radius exposure"
  answer: 3
  explanation: |
    Silo compute (dedicated ASG/ECS service/EKS node group or per-tenant Lambda) gives strong isolation
    and per-tenant scaling but idle capacity per tenant and a large operational fleet. Pool compute
    (shared tasks/deployments/Lambda) maximizes utilization but exposes you to noisy neighbors and
    blast radius — and it still needs STS-scoped credentials for data-layer isolation.
  ref: "concepts.md#compute-isolation-on-aws"

- id: aws-saas-multitenancy-foundations-036
  difficulty: advanced
  tags: [eks, namespace, silo, pool]
  question: |
    On EKS, what is the difference between namespace-per-tenant and a shared namespace for tenants?
  options:
  - "Namespace-per-tenant is the pool model, while a single shared namespace across tenants is the silo model"
  - "Namespace-per-tenant is silo-ish (RBAC + NetworkPolicies + ResourceQuotas per tenant); a shared namespace is the pool model"
  - "Both layouts are identical in isolation strength because namespaces are purely a naming convenience"
  - "A shared namespace automatically schedules each tenant's pods onto its own dedicated worker nodes"
  answer: 1
  explanation: |
    Namespace-per-tenant is the silo-leaning option, adding per-tenant RBAC, NetworkPolicies, and
    ResourceQuotas; a shared namespace is the pool model. They are not equal in isolation, and a shared
    namespace does not allocate dedicated nodes per tenant — node isolation is a separate, additional
    hardening step.
  ref: "concepts.md#compute-isolation-on-aws"

  # ---------------- Network isolation and VPC quotas ----------------
- id: aws-saas-multitenancy-foundations-037
  difficulty: intermediate
  tags: [vpc, quota, silo, interview]
  question: |
    A team wants VPC-per-tenant for 500 tenants in one Region. Which default quota blocks the naive
    approach first?
  options:
  - "5 VPCs per Region"
  - "200 subnets per VPC"
  - "2,500 security groups per Region"
  - "200 route tables per VPC"
  answer: 0
  explanation: |
    The default VPCs-per-Region quota is 5, so VPC-per-tenant collapses immediately for 500 tenants;
    even raised, it also raises Internet Gateways per Region and carries heavy operational overhead. The
    subnet, SG, and route-table quotas are per-VPC or much larger and are not the first wall for
    VPC-per-tenant.
  ref: "concepts.md#network-isolation-and-vpc-quotas"

- id: aws-saas-multitenancy-foundations-038
  difficulty: advanced
  tags: [vpc, quota, subnet, trade-offs, silo]
  question: |
    A regulated tenant demands its own DHCP options, an independent CIDR range, and fully separate
    VPC-wide network configuration. Given the default 5-VPCs-per-Region quota, what is the right call?
  options:
  - "Use subnet-per-tenant, since each subnet can be given its own DHCP option set and CIDR block that override the parent VPC's settings for fully independent networking"
  - "Refuse the requirement, because the 5-VPCs-per-Region limit is a hard, non-adjustable ceiling that AWS Support will not raise under any circumstances"
  - "Use VPC-per-tenant — raising the adjustable VPC quota or spreading tenants across accounts — because only a separate VPC (or account) grants independent VPC-wide settings; subnets share them"
  - "Put the tenant in the shared VPC and rely on security groups plus a dedicated route table to deliver fully independent DHCP, CIDR, and VPC-wide configuration"
  answer: 2
  explanation: |
    VPC-wide settings (DHCP option set, CIDR) are shared across every subnet, so subnet-per-tenant cannot
    satisfy "independent networking" — that needs VPC-per-tenant or account-per-tenant. The 5-VPCs-per-
    Region quota is adjustable (not a hard ceiling), so you raise it or shard across accounts rather than
    refuse. Security groups filter traffic but do not provide independent VPC-wide configuration.
  ref: "concepts.md#network-isolation-and-vpc-quotas"

- id: aws-saas-multitenancy-foundations-039
  difficulty: expert
  tags: [security-group, eni, rules, quota-math]
  question: |
    For security groups, AWS enforces that (rules per SG) × (SGs per ENI) cannot exceed a limit. What is
    that ceiling?
  options:
  - "60"
  - "200"
  - "2,500"
  - "1,000"
  answer: 3
  explanation: |
    The product of rules-per-security-group and security-groups-per-ENI cannot exceed 1,000. Sixty is
    the default inbound/outbound rules per SG, 200 is subnets/NACLs/route-tables per VPC, and 2,500 is
    security groups per Region — none of which is the rules×SGs ceiling.
  ref: "concepts.md#network-isolation-and-vpc-quotas"

- id: aws-saas-multitenancy-foundations-040
  difficulty: intermediate
  tags: [network, silo, pool]
  question: |
    In a pool network model on AWS, where does tenant separation primarily live?
  options:
  - "At the network layer, by giving each tenant its own dedicated VPC peered into a shared transit hub"
  - "Above the network layer, in the data and identity layers, on one shared VPC"
  - "At the DHCP option set level, with a distinct option set applied per tenant subnet to segment traffic"
  - "In per-tenant Internet Gateways, one attached to each tenant's subnet to isolate egress paths"
  answer: 1
  explanation: |
    Pool networking uses one shared VPC and pushes tenant separation above the network layer — into
    data and identity isolation. VPC-per-tenant is the silo model, DHCP option sets are shared and not a
    per-tenant boundary, and per-tenant IGWs are not how pool separation is achieved.
  ref: "concepts.md#network-isolation-and-vpc-quotas"

- id: aws-saas-multitenancy-foundations-041
  difficulty: advanced
  tags: [nacl, rules, quota, subnet]
  question: |
    The anchor article calls out "tedious NACL management" for subnet-level isolation. Which concrete
    NACL constraint quantifies this pain?
  options:
  - "The default rules per NACL is 20 (max 40 inbound / 40 outbound), and NACLs per VPC default to 200"
  - "NACLs are hard-capped at 5 per VPC and this quota is non-adjustable, forcing tenants to share one ACL"
  - "NACLs support an unlimited number of rules but each subnet may be associated with only one NACL at a time"
  - "NACLs cannot be attached to subnets at all and must instead be applied to individual elastic network interfaces"
  answer: 0
  explanation: |
    Each NACL defaults to 20 rules (max 40 inbound and 40 outbound), with 200 NACLs per VPC — a tight
    rule budget that makes per-tenant subnet ACL management tedious at scale. NACLs are not limited to 5
    per VPC, do not allow unlimited rules, and are indeed attached to subnets.
  ref: "concepts.md#network-isolation-and-vpc-quotas"

  # ---------------- Data isolation strategies and quotas ----------------
- id: aws-saas-multitenancy-foundations-042
  difficulty: advanced
  tags: [dynamodb, hot-partition, noisy-neighbor, throughput]
  question: |
    A pooled DynamoDB table provisions 40,000 RCU at the table level, yet one tenant whose items all
    share the `TENANT#<id>` prefix gets throttled. Why?
  options:
  - "Because the account-level DynamoDB throughput ceiling of 40,000 RCU per Region has been exceeded by this table's provisioning"
  - "Because an individual DynamoDB table cannot be provisioned above 400 RCU regardless of how many partitions it holds"
  - "Because per physical partition throughput caps around ~3,000 RCU / 1,000 WCU, so concentrating a hot tenant on one partition throttles regardless of table-level provisioning"
  - "Because a single table is limited to 20 global secondary indexes and the tenant's reads are saturating those indexes"
  answer: 2
  explanation: |
    A single physical partition tops out around 3,000 RCU / 1,000 WCU; if a hot tenant's key prefix
    concentrates traffic on one partition, it throttles even with high table-level provisioning
    (adaptive capacity and burst only partially help). It is a partition-key design problem, not an
    account-limit, a nonexistent 400-RCU cap, or a GSI count issue.
  ref: "concepts.md#data-isolation-strategies-and-quotas"

- id: aws-saas-multitenancy-foundations-043
  difficulty: advanced
  tags: [dynamodb, tables-per-region, silo, quota]
  question: |
    A team runs table-per-tenant (silo) in DynamoDB and expects 15,000 tenants in one Region. What
    constraint do they hit, and what is the implication?
  options:
  - "The 400 KB item-size limit blocks them at 15,000 tenants, so they must compress each tenant's items to fit"
  - "There is no table-count limit in DynamoDB, so 15,000 tables per Region provisions with no constraint at all"
  - "The 20-GSI-per-table limit blocks them, so they must drop secondary indexes from every tenant table"
  - "Tables per Region default 2,500, raisable to ~10,000; beyond 10,000 tables they need multiple accounts"
  answer: 3
  explanation: |
    DynamoDB tables per Region default to 2,500 and can be raised to about 10,000; a table-per-tenant
    silo for 15,000 tenants exceeds even the raised ceiling, so you must shard across multiple accounts.
    Item size and GSI limits are unrelated to tenant table density, and there is indeed a table-count
    limit.
  ref: "concepts.md#data-isolation-strategies-and-quotas"

- id: aws-saas-multitenancy-foundations-044
  difficulty: intermediate
  tags: [dynamodb, s3, pool, prefix]
  question: |
    What is the pool-model approach for isolating tenant data in DynamoDB and S3, respectively?
  options:
  - "A dedicated table per tenant in DynamoDB and a dedicated bucket per tenant in S3, provisioned at onboarding"
  - "One shared table with partition keys prefixed TENANT#<id># guarded by dynamodb:LeadingKeys; one shared bucket with a per-tenant prefix plus an IAM policy scoped to that prefix"
  - "A separate AWS account per tenant holding that tenant's dedicated DynamoDB table and S3 bucket in isolation"
  - "Postgres-style Row-Level Security policies applied to both the DynamoDB table and the S3 bucket to filter by tenant"
  answer: 1
  explanation: |
    Pool DynamoDB uses one shared table with tenant-prefixed partition keys enforced by LeadingKeys;
    pool S3 uses one shared bucket with per-tenant object-key prefixes and IAM policies scoped to those
    prefixes. Table/bucket-per-tenant and account-per-tenant are silo approaches, and RLS is a
    relational-database feature — DynamoDB and S3 do not use RLS.
  ref: "concepts.md#data-isolation-strategies-and-quotas"

- id: aws-saas-multitenancy-foundations-045
  difficulty: advanced
  tags: [rds, connections, rds-proxy, pool]
  question: |
    In a pooled RDS/Aurora design with many tenants sharing one instance, connection exhaustion becomes
    a risk because max_connections scales with instance size. What is the recommended mitigation?
  options:
  - "Use RDS Proxy for connection pooling/multiplexing"
  - "Give each tenant its own database instance"
  - "Disable Row-Level Security to free connections"
  - "Switch to DynamoDB LeadingKeys"
  answer: 0
  explanation: |
    RDS Proxy pools and multiplexes connections, letting many tenants share a bounded connection budget
    without exhausting max_connections. Instance-per-tenant is a silo escape that abandons the pool
    economics, disabling RLS would break isolation and doesn't add connections, and LeadingKeys is a
    DynamoDB feature irrelevant to RDS connections.
  ref: "concepts.md#data-isolation-strategies-and-quotas"

- id: aws-saas-multitenancy-foundations-046
  difficulty: intermediate
  tags: [rls, postgres, pool, enforcement]
  question: |
    For a shared-schema pooled relational store on Aurora PostgreSQL, which mechanism enforces
    row-level tenant isolation inside the database?
  options:
  - "The dynamodb:LeadingKeys IAM condition, applied to the Aurora table to filter rows by tenant partition key"
  - "API Gateway usage plans, which scope each tenant's SQL result set to its own rows before returning them"
  - "Postgres Row-Level Security (RLS), where the database filters rows by tenant_id from a session variable"
  - "STS session tags carrying the TenantID, which Aurora reads to restrict each connection to that tenant's rows"
  answer: 2
  explanation: |
    Postgres RLS makes the database itself filter rows by tenant_id based on a session variable, so the
    boundary is enforced below the application. LeadingKeys is DynamoDB-specific, usage plans throttle
    API traffic, and STS session tags scope AWS API credentials — none enforces relational row filtering.
  ref: "concepts.md#data-isolation-strategies-and-quotas"

- id: aws-saas-multitenancy-foundations-047
  difficulty: expert
  tags: [dynamodb, hot-tenant, mitigation, trade-offs]
  question: |
    A single pooled DynamoDB table has one extremely hot tenant repeatedly throttling on a partition.
    Which combination best addresses it, and what is the strongest structural fix?
  options:
  - "Only raise the table-level provisioned throughput to 40,000 RCU; adaptive capacity then always resolves any single-partition hot spot"
  - "Enable Postgres Row-Level Security policies on the DynamoDB table so the service filters the hot tenant's items automatically"
  - "Add more global secondary indexes to the table so the hot tenant's read traffic is spread evenly across the extra indexes"
  - "On-demand mode, write sharding, and better key design mitigate it; the strongest structural fix is moving the hot tenant to a silo (dedicated) table, which removes the shared-partition ceiling"
  answer: 3
  explanation: |
    A hot-tenant problem is a partition-key design problem: on-demand mode, write sharding, and good key
    design mitigate it, but the definitive fix is silo-ing the hot tenant into its own table so it no
    longer competes on a shared physical partition. Raising table throughput does not fix a single-
    partition hot spot, GSIs don't relieve base-table partition heat, and DynamoDB has no RLS.
  ref: "concepts.md#data-isolation-strategies-and-quotas"

- id: aws-saas-multitenancy-foundations-048
  difficulty: intermediate
  tags: [data-layer, tenant-map, bridge, schema]
  question: |
    Which describes the "single instance + separate databases/schemas" (bridge) data model on AWS?
  options:
  - "One shared table carrying a tenant_id column, with Postgres Row-Level Security filtering every query by tenant"
  - "DB-per-tenant or schema-per-tenant on one Aurora cluster, with a tenant-map/metadata store (e.g., DynamoDB) resolving tenant → DB/schema"
  - "A fully dedicated Aurora cluster provisioned per tenant, each with its own writer and reader endpoints"
  - "One S3 bucket provisioned per tenant, with the relational data exported and stored as per-tenant objects"
  answer: 1
  explanation: |
    This bridge model keeps one cluster but gives each tenant its own database or schema, using a
    tenant-map/metadata store (often DynamoDB) to resolve tenant → DB/schema at request time. Shared
    table + RLS is pure pool, a cluster per tenant is full instance silo, and bucket-per-tenant is an S3
    silo pattern.
  ref: "concepts.md#data-isolation-strategies-and-quotas"

- id: aws-saas-multitenancy-foundations-049
  difficulty: beginner
  tags: [dynamodb, item-size, limits]
  question: |
    What is the maximum size of a single DynamoDB item?
  options:
  - "400 KB"
  - "256 KB"
  - "64 KB"
  - "1 MB"
  answer: 0
  explanation: |
    A DynamoDB item is capped at 400 KB. This can matter in pooled designs where tenant data is packed
    into single items. The other values are incorrect.
  ref: "concepts.md#data-isolation-strategies-and-quotas"

  # ---------------- Tenant tiers, throttling, metering, and cost attribution ----------------
- id: aws-saas-multitenancy-foundations-050
  difficulty: intermediate
  tags: [api-gateway, usage-plan, throttling, tiers]
  question: |
    An API Gateway Usage Plan lets you set which three controls for per-client (per-tenant/tier)
    throttling?
  options:
  - "CPU shares, memory ceiling, and disk IOPS quotas applied to the backend integration per tenant"
  - "Minimum TLS version, allowed cipher suite, and the client certificate presented on each request"
  - "rate (steady-state RPS), burst (token-bucket size), and quota (requests per day/week/month)"
  - "Minimum replica count, maximum replica count, and the target CPU utilization for autoscaling"
  answer: 2
  explanation: |
    A Usage Plan sets rate (token-bucket refill / steady-state RPS), burst (bucket size / max
    concurrent burst), and quota (requests per day/week/month), attached via API keys per tier or
    tenant. The other options describe compute resources, TLS settings, or autoscaling parameters — not
    usage-plan controls.
  ref: "concepts.md#tenant-tiers-throttling-metering-and-cost-attribution"

- id: aws-saas-multitenancy-foundations-051
  difficulty: expert
  tags: [cost-attribution, dynamodb, pool, metering, interview]
  question: |
    How do you attribute cost per tenant for a single shared DynamoDB table used by all tenants?
  options:
  - "Apply cost allocation tags (user:TenantId) to the shared table and query the CUR by tenant, and AWS splits the table's cost across those tag values"
  - "Move the shared table into a dedicated linked account per tenant and read each tenant's spend directly from consolidated billing"
  - "Enable Split Cost Allocation Data on the table, which itemizes each shared DynamoDB table's RCU/WCU cost per tenant automatically"
  - "Cost allocation tags cannot split a single shared resource; meter consumed RCU/WCU per TenantId at the application level and allocate proportionally"
  answer: 3
  explanation: |
    For truly shared infrastructure like one DynamoDB table, cost allocation tags fail entirely because
    the resource cannot be split by tag — you must meter consumed RCU/WCU per TenantId in the
    application and allocate proportionally. Split Cost Allocation Data is for container (pod-level)
    cost, and moving to a dedicated account converts it into a silo rather than attributing the shared
    table.
  ref: "concepts.md#tenant-tiers-throttling-metering-and-cost-attribution"

- id: aws-saas-multitenancy-foundations-052
  difficulty: intermediate
  tags: [metering, cloudwatch-emf, tenant-id]
  question: |
    What is a recommended AWS mechanism for emitting tenant-tagged usage metrics for metering and
    billing?
  options:
  - "Write per-tenant metrics to a plain text log file on each EC2 host and parse them nightly for billing"
  - "CloudWatch Embedded Metric Format (EMF) with a TenantId dimension, or Kinesis/Firehose aggregation into DynamoDB/Timestream"
  - "Encode the usage counters into each user's JWT claims and tally them at the CloudFront edge on response"
  - "Use IAM Access Analyzer reports, reading per-tenant API-call counts from its generated findings export"
  answer: 1
  explanation: |
    Tenant-level usage is captured by emitting tenant-tagged metrics — CloudWatch EMF with a TenantId
    dimension, or streaming via Kinesis/Firehose into DynamoDB/Timestream for aggregation — then feeding
    the billing system. Text files, JWT-embedded metrics, and IAM Access Analyzer are not metering
    pipelines.
  ref: "concepts.md#tenant-tiers-throttling-metering-and-cost-attribution"

- id: aws-saas-multitenancy-foundations-053
  difficulty: advanced
  tags: [cost-allocation-tags, cur, activation, pool]
  question: |
    A team activates cost allocation tags (user:TenantId) for pooled resources. Which fact about these
    tags is correct?
  options:
  - "They are not retroactive, take roughly 24 hours to appear, and are queried in the Cost and Usage Report (e.g., column resource_tags_user_tenant_id) via Athena"
  - "They apply retroactively to all past usage the moment they are activated, back-filling every prior billing period"
  - "They automatically split a shared NAT gateway's per-tenant cost by inspecting the TenantId tag on each flow"
  - "Tag keys are treated as case-insensitive in the CUR, so TenantId and tenantid resolve to the same column"
  answer: 0
  explanation: |
    Activated cost allocation tags are not retroactive, take about 24 hours to appear, and surface in
    the CUR (e.g., resource_tags_user_tenant_id) for Athena queries. They cannot split truly shared
    infrastructure like a NAT gateway (that needs app-level metering), and CUR tag keys are
    case-sensitive, so TenantId must be applied consistently.
  ref: "concepts.md#tenant-tiers-throttling-metering-and-cost-attribution"

- id: aws-saas-multitenancy-foundations-054
  difficulty: intermediate
  tags: [api-gateway, throttling, 429]
  question: |
    A tenant exceeds its API Gateway usage-plan rate. What response do requests receive, and how
    "hard" are these limits?
  options:
  - "HTTP 500 Internal Server Error; the usage-plan limits are hard ceilings enforced exactly to the request"
  - "HTTP 403 Forbidden; the usage-plan limits apply per individual user rather than per tenant or tier"
  - "HTTP 429 Too Many Requests; the throttle values are best-effort targets, not hard ceilings"
  - "HTTP 200 with a Retry-After header; API Gateway queues the excess requests instead of throttling them"
  answer: 2
  explanation: |
    Throttled API Gateway requests receive HTTP 429 Too Many Requests, and the configured throttle
    values are best-effort targets rather than exact hard ceilings. It is not a 500/403, and requests
    are genuinely rejected rather than returning 200.
  ref: "concepts.md#tenant-tiers-throttling-metering-and-cost-attribution"

- id: aws-saas-multitenancy-foundations-055
  difficulty: advanced
  tags: [cost-attribution, containers, split-cost-allocation]
  question: |
    For a pooled containerized workload where you want per-pod (and thus closer to per-tenant) cost
    visibility, which AWS feature helps?
  options:
  - "Use API Gateway usage plans to attribute each pod's cost per tenant"
  - "Turn on VPC Flow Logs to itemize each pod's compute cost per tenant"
  - "Enable DynamoDB adaptive capacity to attribute per-pod container cost"
  - "Enable Split Cost Allocation Data in the Cost and Usage Report for pod-level cost"
  answer: 3
  explanation: |
    Split Cost Allocation Data in the CUR itemizes container costs at pod level, giving finer-grained
    attribution for pooled container workloads. Flow Logs address network traffic, adaptive capacity
    addresses DynamoDB hot partitions, and usage plans throttle APIs — none provides pod-level cost data.
  ref: "concepts.md#tenant-tiers-throttling-metering-and-cost-attribution"

- id: aws-saas-multitenancy-foundations-056
  difficulty: beginner
  tags: [tiers, bridge, isolation-mapping]
  question: |
    How do tenant tiers (Basic/Standard/Premium) commonly map to isolation, and why do they matter?
  options:
  - "All tiers — Basic, Standard, and Premium — must be fully siloed into dedicated stacks so no tenant ever shares infrastructure"
  - "Pool for Basic and silo (or dedicated pods/nodes) for Premium; tiers are the primary lever behind the bridge model and influence cost, ops, and reliability"
  - "Tiers only affect the monthly price a tenant pays and never influence the isolation model or data architecture behind them"
  - "Premium tenants are always fully pooled onto the shared fleet to save cost, while only Basic tenants receive dedicated stacks"
  answer: 1
  explanation: |
    Tiers are market segments with different price/experience that influence cost, operations, and
    reliability; they commonly map pool for Basic and silo (or dedicated pods/nodes) for Premium,
    making them the primary driver of the bridge model. They are not all-silo, do affect architecture,
    and Premium is the tier most likely to be siloed, not pooled.
  ref: "concepts.md#tenant-tiers-throttling-metering-and-cost-attribution"

- id: aws-saas-multitenancy-foundations-057
  difficulty: expert
  tags: [api-gateway, throttle-layers, precedence]
  question: |
    API Gateway throttling stacks four layers. Which ordering (broadest to most specific) is correct?
  options:
  - "AWS Regional (fixed) → per-account per-Region → per-API/stage/method → per-client via Usage Plans and API keys"
  - "Per-client usage plan → per-API/stage/method → per-account per-Region → AWS Regional limit"
  - "Per-API/stage/method → AWS Regional (fixed) → per-client via API keys → per-account per-Region"
  - "Per-account per-Region → AWS Regional (fixed) → per-client via API keys → per-API/stage/method"
  answer: 0
  explanation: |
    The stack runs from broadest to narrowest: AWS Regional (fixed) → per-account per-Region →
    per-API/stage/method → per-client via Usage Plans and API keys. The per-client usage plan is the
    most specific lever for per-tenant throttling and noisy-neighbor containment at the edge, so it sits
    at the narrow end, not the broad end.
  ref: "concepts.md#tenant-tiers-throttling-metering-and-cost-attribution"

  # ---------------- AWS Organizations governance model ----------------
- id: aws-saas-multitenancy-foundations-058
  difficulty: intermediate
  tags: [organizations, accounts, quota, onboarding]
  question: |
    Which statement about AWS Organizations account quotas is correct for an account-per-tenant silo?
  options:
  - "Accounts per organization are fixed at 10 and cannot be raised by an AWS Support request"
  - "There is no limit on accounts per organization; you can add tenant accounts indefinitely"
  - "Accounts per organization default to 10 but are adjustable up to 50,000 (qualification-based)"
  - "Accounts per organization max out at a hard ceiling of 2,000 and cannot be increased"
  answer: 2
  explanation: |
    An organization defaults to 10 accounts, adjustable up to 50,000 subject to qualification — the wall
    that account-per-tenant silo must plan against. It is not fixed at 10, not unlimited, and 2,000 is
    the OUs-per-organization limit, not the account limit.
  ref: "concepts.md#aws-organizations-governance-model"

- id: aws-saas-multitenancy-foundations-059
  difficulty: advanced
  tags: [organizations, create-account, onboarding-automation, throughput]
  question: |
    Why does the low CreateAccount throughput (about 5 concurrent creations, ~0.1 RPS) matter for SaaS
    onboarding automation that provisions an account per tenant?
  options:
  - "It permanently prevents closing or deleting a tenant account once the organization has created it"
  - "It only affects the monthly billing roll-up and has no bearing on how fast tenant accounts provision"
  - "It forces every tenant to share one common account, since new accounts cannot be created for silos"
  - "You cannot spin up thousands of accounts quickly, so high-volume account-per-tenant onboarding is throughput-constrained — use Control Tower / Account Factory to automate it"
  answer: 3
  explanation: |
    Because account creation is capped at ~5 concurrent and ~0.1 RPS, you cannot rapidly provision
    thousands of tenant accounts, which throttles high-volume silo onboarding; Control Tower / Account
    Factory automate the process (up to 10,000 accounts). It does not block deletion, force shared
    accounts, or affect only billing.
  ref: "concepts.md#aws-organizations-governance-model"

- id: aws-saas-multitenancy-foundations-060
  difficulty: advanced
  tags: [organizations, consolidated-billing, volume-discounts, silo]
  question: |
    The anchor article claims account-per-tenant "loses volume discounts." How does AWS Organizations
    rebut this when accounts are consolidated?
  options:
  - "It doesn't — each siloed account is billed in isolation and always forfeits any volume discount"
  - "Consolidated billing aggregates usage across siloed accounts, preserving volume discounts"
  - "Each siloed account must separately negotiate its own private pricing with AWS to earn a discount"
  - "Volume discounts only apply to serverless services like Lambda, never to per-tenant siloed accounts"
  answer: 1
  explanation: |
    Consolidated billing rolls up usage across all accounts in the organization, so volume/tiered
    discounts are preserved even with account-per-tenant silos — rebutting the claim when consolidated.
    Siloed accounts do not inherently lose discounts, per-account private pricing is not required, and
    discounts are not limited to serverless.
  ref: "concepts.md#aws-organizations-governance-model"

- id: aws-saas-multitenancy-foundations-061
  difficulty: expert
  tags: [organizations, scp, quota]
  question: |
    Which AWS Organizations SCP-related limit is stated correctly?
  options:
  - "You can attach a maximum of 10 SCPs per entity (root/OU/account), and the SCP document size limit is 10,240 characters"
  - "You can attach up to 50 SCPs directly to any single entity (root/OU/account) before hitting the cap"
  - "SCPs have no document-size limit, so a single policy can be arbitrarily long with unlimited statements"
  - "OUs can be nested up to 100 levels deep beneath the organization root before the hierarchy is capped"
  answer: 0
  explanation: |
    A maximum of 10 SCPs can be attached directly to any single entity (root/OU/account), and an SCP
    document is capped at 10,240 characters; OU nesting is limited to 5 levels under one root. The
    50-per-entity, 100-level, and no-size-limit options are all incorrect.
  ref: "concepts.md#aws-organizations-governance-model"

- id: aws-saas-multitenancy-foundations-062
  difficulty: intermediate
  tags: [control-tower, account-factory, automation]
  question: |
    Which service is used to automate the account-per-tenant silo at scale?
  options:
  - "AWS Systems Manager Parameter Store, provisioning a governed account per tenant from stored config"
  - "AWS CloudTrail, which vends and governs a new tenant account each time it logs an onboarding event"
  - "AWS Control Tower / Account Factory (up to 10,000 accounts)"
  - "Amazon EventBridge Scheduler, which creates a governed AWS account per tenant on a recurring schedule"
  answer: 2
  explanation: |
    AWS Control Tower and its Account Factory automate provisioning of the account-per-tenant silo (up
    to 10,000 accounts) with guardrails. CloudTrail records API activity, Parameter Store holds config,
    and EventBridge Scheduler triggers events — none of them provisions governed accounts.
  ref: "concepts.md#aws-organizations-governance-model"

  # ---------------- Tenant lifecycle onboard provision operate offboard ----------------
- id: aws-saas-multitenancy-foundations-063
  difficulty: intermediate
  tags: [lifecycle, onboarding, saas-lens]
  question: |
    What is the SaaS Lens principle for tenant onboarding?
  options:
  - "Onboard each tenant manually through a bespoke, human-driven checklist to guarantee quality per customer"
  - "Onboarding should follow a different, custom-built flow for every tenant to maximize per-customer flexibility"
  - "Require every tenant to bring and provision their own AWS account before they can be onboarded to the service"
  - "Onboard tenants through a single, automated, repeatable process"
  answer: 3
  explanation: |
    The SaaS Lens principle is to onboard tenants through a single, automated, repeatable process,
    orchestrated by the control plane. Manual, per-tenant-divergent onboarding, or requiring tenants to
    bring their own account, contradicts the unified, automated model.
  ref: "concepts.md#tenant-lifecycle-onboard-provision-operate-offboard"

- id: aws-saas-multitenancy-foundations-064
  difficulty: advanced
  tags: [lifecycle, provision, silo, pool, onboarding-speed]
  question: |
    How does provisioning time typically differ between silo and pool onboarding?
  options:
  - "Both silo and pool take a few seconds because AWS provisions stacks, accounts, and registry rows instantly"
  - "Silo provisioning (CloudFormation/CDK stack, a new Control Tower account, or a new pod) takes minutes to hours under quota pressure; pool provisioning is a registry insert plus tier config in seconds"
  - "Pool provisioning is the slower path because the entire shared fleet must be rebuilt for each new tenant"
  - "Silo is the faster path because a dedicated per-tenant stack has far less configuration to apply than pool"
  answer: 1
  explanation: |
    Silo onboarding provisions real infrastructure — a stack, a governed account, or a pod — taking
    minutes to hours and pressing against quotas; pool onboarding just registers the tenant and applies
    tier config in seconds. Pool is the fast path, not the slow one, and silo is heavier, not lighter.
  ref: "concepts.md#tenant-lifecycle-onboard-provision-operate-offboard"

- id: aws-saas-multitenancy-foundations-065
  difficulty: advanced
  tags: [lifecycle, offboard, gdpr, silo, pool]
  question: |
    For GDPR right-to-erasure at offboarding, why is silo easier than pool?
  options:
  - "In silo you drop the whole account/database; in pool you must delete every row by tenant_id across shared tables, which is error-prone and slow"
  - "Silo inherently stores far less tenant data than pool, so there is simply less to erase at offboarding"
  - "Pool automatically deletes all of a tenant's data across every shared table the moment it is offboarded"
  - "GDPR right-to-erasure does not apply to data that is stored in a pooled, shared multi-tenant table"
  answer: 0
  explanation: |
    Data deletion is a compliance requirement, and silo makes it trivial — drop the account or database.
    Pool requires deleting every row keyed by tenant_id across shared tables, which is error-prone and
    slow. Silo does not inherently store less, pool does not auto-delete, and GDPR applies regardless of
    model.
  ref: "concepts.md#tenant-lifecycle-onboard-provision-operate-offboard"

- id: aws-saas-multitenancy-foundations-066
  difficulty: intermediate
  tags: [lifecycle, operate, monitoring]
  question: |
    What does the "operate" phase of the tenant lifecycle involve?
  options:
  - "Only detecting and shutting down idle tenants to reclaim their unused shared compute capacity"
  - "Provisioning the tenant's stacks, accounts, and shared registry entry for the very first time"
  - "Tenant-aware logging/metrics/dashboards, per-tenant SLA and noisy-neighbor monitoring, and metering that feeds billing"
  - "Exporting a departing tenant's data and then deleting every record of it from the shared store"
  answer: 2
  explanation: |
    Operate is the steady-state phase: tenant-aware logging, metrics, and dashboards, per-tenant SLA and
    noisy-neighbor monitoring, and metering flowing into billing. First-time infra provisioning is the
    provision phase, and data export/delete is offboard.
  ref: "concepts.md#tenant-lifecycle-onboard-provision-operate-offboard"

- id: aws-saas-multitenancy-foundations-067
  difficulty: expert
  tags: [lifecycle, onboarding-cost, b2c, trade-offs]
  question: |
    A B2C-flavored SaaS signs up thousands of tenants per day. Why is silo onboarding a poor fit, and
    what is the takeaway?
  options:
  - "Silo onboarding is cheap and near-instant, so it scales fine to thousands of new tenants per day"
  - "Onboarding cost is irrelevant to the isolation choice and never factors into silo-versus-pool at all"
  - "Pool onboarding cannot handle high sign-up volume, so silo is the only model that fits thousands/day"
  - "Silo onboarding is heavy (provision stacks/accounts, quota pressure, minutes-to-hours), so a product onboarding thousands/day cannot afford it — onboarding cost itself is a first-class trade-off favoring pool for high-volume tenants"
  answer: 3
  explanation: |
    Silo onboarding provisions stacks/accounts under quota pressure and takes minutes to hours, so a
    high-volume B2C signup rate cannot absorb it; pool's seconds-long registry insert is the fit.
    Onboarding cost is a first-class trade-off, not irrelevant, and pool is precisely the model built for
    high signup volume.
  ref: "concepts.md#tenant-lifecycle-onboard-provision-operate-offboard"

  # ---------------- Noisy neighbors and blast radius ----------------
- id: aws-saas-multitenancy-foundations-068
  difficulty: beginner
  tags: [noisy-neighbor, blast-radius, definitions]
  question: |
    What is the difference between a "noisy neighbor" and "blast radius"?
  options:
  - "They are the same concept under two different names, both measuring how many tenants a failure hits"
  - "Noisy neighbor is when one tenant's load on shared resources degrades another's experience; blast radius is how many tenants a single failure, bug, or breach can affect"
  - "Noisy neighbor is a cross-tenant security breach, while blast radius is an unexpected per-tenant billing anomaly"
  - "Noisy neighbor applies only to the silo model, while blast radius is a concern exclusive to the pool model"
  answer: 1
  explanation: |
    A noisy neighbor is a performance/contention problem — one tenant degrading another via shared
    resources. Blast radius measures how many tenants one failure/bug/breach can hit. They are distinct
    concepts, neither is inherently a breach or billing anomaly, and both are considerations across
    models (though pool amplifies them).
  ref: "concepts.md#noisy-neighbors-and-blast-radius"

- id: aws-saas-multitenancy-foundations-069
  difficulty: advanced
  tags: [noisy-neighbor, mitigations, aws]
  question: |
    Which set are all valid AWS noisy-neighbor mitigations?
  options:
  - "Per-tenant/tier API Gateway usage-plan throttling, Lambda reserved/provisioned concurrency, DynamoDB on-demand + good key design, RDS Proxy, and shuffle-sharding / pod isolation"
  - "Disabling Row-Level Security, removing all usage plans, and concentrating every tenant onto one giant DynamoDB partition"
  - "Increasing DynamoDB item size, removing the tenant-scoping IAM conditions, and merging all tenants into one shared Lambda function"
  - "Turning off per-tenant metering and stripping cost allocation tags from all shared pooled resources"
  answer: 0
  explanation: |
    Valid mitigations include per-tenant/tier usage-plan throttling, Lambda reserved/provisioned
    concurrency, DynamoDB on-demand plus good partition-key design, RDS Proxy for connection pooling,
    and shuffle-sharding/pod (cell) isolation — plus moving noisy/premium tenants to a silo. The other
    options describe changes that worsen contention or are unrelated to it.
  ref: "concepts.md#noisy-neighbors-and-blast-radius"

- id: aws-saas-multitenancy-foundations-070
  difficulty: intermediate
  tags: [blast-radius, models, pods]
  question: |
    How does blast radius compare across account-per-tenant, full pool, and pods/cells?
  options:
  - "All three models have identical blast radius because the isolation choice does not affect failure scope"
  - "Full pool has the smallest blast radius since a shared fleet confines any single failure to one tenant"
  - "Account-per-tenant contains a failure/compromise to one tenant; full pool lets one bug or breach hit all tenants; pods/cells are the middle ground (one cell's tenants)"
  - "Account-per-tenant has the largest blast radius, exposing every tenant in the organization to one failure"
  answer: 2
  explanation: |
    Account-per-tenant contains impact to a single tenant (smallest blast radius); full pool exposes all
    tenants to one bug/breach (largest); pods/cells bound impact to one cell's tenants (middle ground).
    The reversed and identical options misstate this ordering.
  ref: "concepts.md#noisy-neighbors-and-blast-radius"

- id: aws-saas-multitenancy-foundations-071
  difficulty: intermediate
  tags: [noisy-neighbor, aws-risks]
  question: |
    Which is a recognized AWS-specific noisy-neighbor risk in pooled multi-tenant designs?
  options:
  - "S3 bucket naming collisions when many tenants share one pooled bucket with per-tenant key prefixes"
  - "CloudFront cache invalidation cost accruing when one tenant repeatedly purges the shared distribution"
  - "Route 53 hosted-zone record limits being exhausted as pooled tenants each add vanity DNS entries"
  - "A DynamoDB hot partition hitting the ~3,000 RCU / 1,000 WCU per-partition ceiling"
  answer: 3
  explanation: |
    A DynamoDB hot partition against the ~3,000 RCU / 1,000 WCU per-partition ceiling is a classic pooled
    noisy-neighbor risk, alongside Lambda concurrency exhaustion, RDS connection/CPU contention, and
    pooled Cognito/API Gateway rate quotas. Bucket naming, hosted-zone limits, and invalidation cost are
    not the noisy-neighbor mechanisms listed.
  ref: "concepts.md#noisy-neighbors-and-blast-radius"

- id: aws-saas-multitenancy-foundations-072
  difficulty: advanced
  tags: [shuffle-sharding, cells, blast-radius, cheapest]
  question: |
    An interviewer asks for the cheapest way to bound blast radius without going to full silo. What is
    the best answer?
  options:
  - "Give every tenant its own dedicated AWS account so any failure is confined to a single tenant"
  - "Use pods/cells (and shuffle-sharding): pool within a cell, silo across cells, capping a failure or breach to one cell's tenants"
  - "Increase the shared DynamoDB table's provisioned throughput globally to absorb any tenant's failure"
  - "Move all tenants into a single large Lambda function so one failure is contained to that function"
  answer: 1
  explanation: |
    Pods/cells (with shuffle-sharding) pool within a cell and silo across cells, bounding any failure or
    breach to one cell's tenants without the cost of full per-tenant silo. Account-per-tenant is full
    silo (expensive), raising table throughput doesn't bound blast radius, and one big Lambda increases
    shared exposure.
  ref: "concepts.md#noisy-neighbors-and-blast-radius"

  # ---------------- B2B versus B2C tenancy ----------------
- id: aws-saas-multitenancy-foundations-073
  difficulty: beginner
  tags: [b2b, b2c, tenant-definition]
  question: |
    In a B2B SaaS, what does a "tenant" typically map to?
  options:
  - "A company/organization (few, large, high-value), with a tenant admin managing many end-users"
  - "A single end-user consumer, one individual person signing in with a personal login and no organization above them"
  - "An AWS Availability Zone, an isolated data-center location within a Region that a tenant's workload is pinned to"
  - "A CloudFront edge location, the point-of-presence cache node that serves a tenant's static assets to nearby users"
  answer: 0
  explanation: |
    In B2B, a tenant is a company/organization — relatively few, large, and high-value — with a tenant
    admin managing many end-users, which makes silo/bridge affordable and drives strong isolation,
    per-tenant SLA/compliance, and federation. A single consumer is the B2C shape; AZs and edge locations
    are infrastructure, not tenants.
  ref: "concepts.md#b2b-versus-b2c-tenancy"

- id: aws-saas-multitenancy-foundations-074
  difficulty: advanced
  tags: [b2c, scale, cognito, pool]
  question: |
    Why does B2C SaaS tend to pool everywhere, and what becomes the dominant constraint?
  options:
  - "Because each B2C consumer demands its own per-tenant SAML/OIDC federation and branding, making regulatory compliance the single dominant design constraint"
  - "Because B2C mandates a dedicated AWS account provisioned per individual end-user, so account-quota headroom is the dominant constraint"
  - "Because the tenant boundary is fuzzy (often the whole app) with millions of consumers, so pooling for economics is natural and scale (e.g., Cognito 40M users/pool, RPS quotas) is the dominant constraint"
  - "Because B2C serves only a handful of users per app, so infrastructure cost is negligible and never drives the isolation model"
  answer: 2
  explanation: |
    In B2C the tenant boundary is often the whole app with millions of consumer users, so pooling wins on
    economics and scale becomes dominant — Cognito's 40M users/pool and RPS quotas, for example. B2C
    does not need per-tenant SAML, cannot afford account-per-user, and is defined by high user counts, so
    cost is far from irrelevant.
  ref: "concepts.md#b2b-versus-b2c-tenancy"

- id: aws-saas-multitenancy-foundations-075
  difficulty: intermediate
  tags: [b2b, b2c, design-approach]
  question: |
    Why should you establish B2B-vs-B2C and tenant count first in a SaaS design answer?
  options:
  - "Because the tenant model dictates which programming language and web framework the application must be built on"
  - "Because Cognito user pools are available only to B2C products and are technically unsupported for any B2B tenancy"
  - "Because AWS applies a separate published price list to B2B versus B2C accounts, so the model changes the per-request bill"
  - "Because the tenant definition sets tenant count, isolation feasibility, identity strategy, and cost model — answering without it is a red flag"
  answer: 3
  explanation: |
    The tenant definition drives everything downstream — tenant count, whether silo/bridge is feasible,
    the identity strategy, and the cost model — so pinning down B2B-vs-B2C and tenant count first is the
    senior move, and skipping it is a red flag. It has nothing to do with language choice, billing
    differences, or Cognito eligibility.
  ref: "concepts.md#b2b-versus-b2c-tenancy"

  # ---------------- Trade-offs and when to use what ----------------
- id: aws-saas-multitenancy-foundations-076
  difficulty: advanced
  tags: [trade-offs, when-to-silo]
  question: |
    Which scenario most strongly argues for a silo model?
  options:
  - "Thousands of thin-margin SMB tenants with uniform workloads, where per-tenant infrastructure would erase the product's economics"
  - "A few high-value B2B tenants needing strict regulatory isolation, data residency, per-tenant SLA, and blast-radius intolerance"
  - "A B2C app with millions of consumers where per-user cost dominates and workloads are largely uniform across the base"
  - "An early prototype optimizing purely for the lowest possible monthly infrastructure spend while validating the idea"
  answer: 1
  explanation: |
    Silo fits strict compliance/regulatory isolation, data residency, per-tenant SLA, few high-value B2B
    tenants, premium differentiation, blast-radius intolerance, and easy per-tenant cost/offboarding.
    Thin-margin SMBs, cost-dominant B2C at scale, and lowest-cost prototypes all point to pool instead.
  ref: "concepts.md#trade-offs-and-when-to-use-what"

- id: aws-saas-multitenancy-foundations-077
  difficulty: advanced
  tags: [trade-offs, bridge, default]
  question: |
    Which is a canonical example of the "bridge is the realistic default" pattern?
  options:
  - "Pool compute plus siloed data for a regulated microservice; pool everything for Basic tier but silo data (or use dedicated pods) for Premium; pooled identity with dedicated user pools only for enterprise-federation tenants"
  - "Silo absolutely every layer for every tenant, giving each customer its own account, VPC, database, and stack regardless of tier"
  - "Pool absolutely every layer for every tenant, including regulated data, onto one shared fleet and one shared table with a tenant_id column"
  - "Place all tenants in one AWS account behind one shared table with a tenant_id column, applying the identical layout to every tier"
  answer: 0
  explanation: |
    Bridge mixes per layer and per tier: e.g., pooled compute with siloed data for a regulated service,
    pool for Basic but silo data/dedicated pods for Premium, and pooled identity with dedicated pools
    only for enterprise-federation tenants. Siloing or pooling absolutely everything ignores the
    per-layer/per-tier reasoning that defines bridge.
  ref: "concepts.md#trade-offs-and-when-to-use-what"

- id: aws-saas-multitenancy-foundations-078
  difficulty: expert
  tags: [trade-offs, three-way-tension]
  question: |
    What is the central three-way tension every isolation decision moves along?
  options:
  - "Latency, throughput, and durability — the three storage-performance dimensions that every isolation decision is said to balance against each other"
  - "Read consistency, write consistency, and availability — the replication-tuning knobs that supposedly govern each silo-versus-pool choice"
  - "Isolation strength, cost/efficiency, and operational complexity — buying more isolation spends money and/or ops burden, and buying efficiency spends isolation"
  - "Region, Availability Zone, and edge location — the three placement layers that each isolation decision is claimed to move a tenant along"
  answer: 2
  explanation: |
    Every decision trades along isolation strength vs cost/efficiency vs operational complexity: there is
    no free lunch, so more isolation costs money/ops and more efficiency spends isolation — decided per
    layer, per service, and per tier. The other triples describe unrelated performance or infrastructure
    dimensions.
  ref: "concepts.md#trade-offs-and-when-to-use-what"

- id: aws-saas-multitenancy-foundations-079
  difficulty: expert
  tags: [trade-offs, quota-walls, interview]
  question: |
    Which list correctly names "quota walls that force architecture" in AWS multi-tenancy?
  options:
  - "Route 53 records (10,000), ACM certificates (2,500), WAF rules (1,500), CloudWatch alarms (5,000)"
  - "Lambda memory (10 GB), S3 object size (5 TB), EBS volume size (16 TB), CloudFront distributions (200)"
  - "SQS message size (256 KB), SNS topics (100,000), Kinesis shards (500), Step Functions state limit"
  - "VPCs per Region (5), DynamoDB tables per Region (2,500 → 10,000), Organizations accounts (10 → 50,000), Cognito custom domains per Region (4, non-adjustable), subnets per VPC (200)"
  answer: 3
  explanation: |
    The architecture-forcing walls for tenancy are VPCs per Region (5), DynamoDB tables per Region
    (2,500 → 10,000), Organizations accounts (10 → 50,000), Cognito custom domains per Region (4,
    non-adjustable), and subnets per VPC (200). The other lists are real service limits but not the ones
    that shape the silo/pool/bridge decision.
  ref: "concepts.md#trade-offs-and-when-to-use-what"

- id: aws-saas-multitenancy-foundations-080
  difficulty: advanced
  tags: [trade-offs, interview-sequence]
  question: |
    What is the recommended sequence for a complete senior answer to an open-ended SaaS multi-tenancy
    design question?
  options:
  - "Commit to a fully pooled fleet up front, optimize only for the lowest monthly cost, and stop there without discussing isolation or tiers"
  - "Establish B2B-vs-B2C and tenant count; clarify compliance/residency/SLA/tiers; decompose the stack and assign silo/pool per layer and tier naming each trade-off; call out the first-limiting AWS quota and noisy-neighbor mitigation; describe the shared control plane and tenant-context flow"
  - "Open by drawing the relational database schema and enumerating every table, column, and index before any tenancy discussion"
  - "List every candidate AWS service alphabetically and pick whichever one carries the cheapest published per-request price"
  answer: 1
  explanation: |
    The senior sequence is: (1) B2B or B2C and how many tenants; (2) compliance/data-residency/SLA/tiers;
    (3) decompose and assign silo/pool per layer and tier with trade-offs; (4) name the AWS quota that
    bites first and the noisy-neighbor mitigation; (5) describe the shared control plane and tenant-
    context flow. Jumping to pool, schema enumeration, or an alphabetical service list skips the
    trade-off reasoning that signals seniority.
  ref: "concepts.md#trade-offs-and-when-to-use-what"

- id: aws-saas-multitenancy-foundations-081
  difficulty: intermediate
  tags: [trade-offs, when-to-pool]
  question: |
    Which combination of conditions most argues for a pool model?
  options:
  - "Many tenants, cost/scale dominant, agility matters, uniform workloads, and thin margins (B2C or SMB B2B)"
  - "A few high-value tenants with strict data-residency mandates, per-tenant SLAs, and low tolerance for shared-fleet blast radius"
  - "A single heavily regulated tenant requiring its own dedicated VPC and AWS account for hard network and billing isolation"
  - "A hard requirement for trivial per-tenant offboarding by dropping a dedicated database or account to satisfy right-to-erasure"
  answer: 0
  explanation: |
    Pool wins when there are many tenants, cost/scale dominates, agility matters, workloads are uniform,
    and margins are thin — typical of B2C or SMB B2B. Few high-value regulated tenants, per-tenant SLA,
    dedicated VPC/account needs, and trivial drop-the-database offboarding all favor silo instead.
  ref: "concepts.md#trade-offs-and-when-to-use-what"
