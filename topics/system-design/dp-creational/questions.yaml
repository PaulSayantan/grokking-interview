topic: "Creational Design Patterns"
domain: system-design
topic_slug: dp-creational
version: 1
questions:
  - id: dp-creational-001
    difficulty: beginner
    tags: [creational, fundamentals]
    question: |
      What do creational design patterns fundamentally abstract or control?
    options: ["How objects are created, composed, and represented", "How objects communicate at runtime via events", "How classes are grouped into modules and packages", "How algorithms are selected and swapped at runtime"]
    answer: 0
    explanation: |
      GoF define creational patterns as abstracting the instantiation process:
      they make a system independent of how its objects are created, composed,
      and represented. Runtime communication is behavioral; algorithm selection
      (Strategy) is behavioral; module grouping is not a pattern concern.
    ref: "concepts.md#factory-family-disambiguation"

  - id: dp-creational-002
    difficulty: beginner
    tags: [singleton, intent]
    question: |
      Which statement best captures the intent of the Singleton pattern?
    options: ["Create families of related objects without naming concrete classes", "Ensure a class has exactly one instance and provide a global access point to it", "Copy an existing instance instead of constructing a new one", "Assemble a complex object step by step under a director's control"]
    answer: 1
    explanation: |
      Singleton's GoF intent is exactly one instance plus a global access point.
      Families of objects is Abstract Factory; copying is Prototype; step-by-step
      assembly is Builder.
    ref: "concepts.md#singleton"

  - id: dp-creational-003
    difficulty: intermediate
    tags: [singleton, thread-safety, double-checked-locking]
    question: |
      In a double-checked locking Singleton in Java, why must the instance field
      be declared `volatile`?
    options: ["To make the field's current value visible to attached debuggers and agents", "To allow the field to be written from several unrelated classes at once", "To prevent a thread from seeing a non-null but not-fully-constructed instance due to reordering", "To make the getInstance() accessor implicitly synchronized on the monitor"]
    answer: 2
    explanation: |
      Without volatile, the write that publishes the reference can be reordered
      before the constructor finishes, so another thread may read a non-null
      reference to a partially constructed object. volatile establishes the
      happens-before ordering (fixed by the JSR-133 memory model in Java 5+).
    ref: "concepts.md#singleton"

  - id: dp-creational-004
    difficulty: advanced
    tags: [singleton, enum, effective-java]
    question: |
      According to Effective Java, why is a single-element enum often the best
      way to implement a Singleton?
    options: ["It is the fastest to initialize under high contention", "It allows multiple instances to be created lazily", "It avoids relying on any static fields or eager initialization", "It is serialization-safe and reflection-safe without extra code"]
    answer: 3
    explanation: |
      A single-element enum gives serialization safety and reflection safety for
      free: the JVM forbids reflective enum instantiation and handles enum
      deserialization without creating new instances. Performance is not the
      motivation, and it does use a static instance.
    ref: "concepts.md#singleton"

  - id: dp-creational-005
    difficulty: advanced
    tags: [singleton, holder-idiom, lazy]
    question: |
      The initialization-on-demand holder idiom achieves lazy, thread-safe
      Singleton initialization primarily by relying on what mechanism?
    options: ["The JVM's guaranteed thread-safe lazy class initialization", "A synchronized block guarding every single field access", "A volatile double-checked lock checked on first access", "An explicit ReentrantLock held for the object's lifetime"]
    answer: 0
    explanation: |
      The nested holder class is not initialized until first referenced, and the
      JVM guarantees class initialization is thread-safe and happens exactly once.
      That gives laziness and safety with no synchronized/volatile in your code.
    ref: "concepts.md#singleton"

  - id: dp-creational-006
    difficulty: intermediate
    tags: [singleton, anti-pattern, testability]
    question: |
      Why is Singleton frequently criticized as an anti-pattern in modern design?
    options: ["It cannot be implemented in a thread-safe way without a lock", "It introduces global mutable state and hidden dependencies that harm testability", "It always leaks memory over time as instances are never freed", "It requires reflection to construct its one private instance"]
    answer: 1
    explanation: |
      The core objection is that a class calling X.getInstance() hides that
      dependency from its API, and the shared global mutable state makes code hard
      to mock and reason about. It can be thread-safe and need not leak memory.
    ref: "concepts.md#singleton"

  - id: dp-creational-007
    difficulty: intermediate
    tags: [singleton, di, modern-practice]
    question: |
      In systems using a DI container, what typically replaces a hand-rolled
      Singleton when you need a single shared instance?
    options: ["A public static mutable field holding the shared reference", "A thread-local variable storing one instance per thread", "A new instance per request cached in the session", "A container-managed 'singleton scope' bean injected where needed"]
    answer: 3
    explanation: |
      DI containers manage a single ("singleton-scoped") instance and inject it,
      giving you one instance without the static global access point and hidden
      coupling of a hand-rolled Singleton.
    ref: "concepts.md#singleton"

  - id: dp-creational-008
    difficulty: beginner
    tags: [factory-method, intent]
    question: |
      What is the defining idea of the Factory Method pattern?
    options: ["A static method with a switch that returns a chosen concrete type", "Reuse a bounded pool of pre-created objects lent out and reclaimed", "Define a creation interface but let subclasses decide which class to instantiate", "Copy a prototypical instance rather than calling a constructor"]
    answer: 2
    explanation: |
      Factory Method defers instantiation to subclasses: the base declares an
      overridable creation hook and subclasses choose the concrete product. A
      static switch is the (non-GoF) Simple Factory idiom.
    ref: "concepts.md#factory-method"

  - id: dp-creational-009
    difficulty: intermediate
    tags: [factory-method, ocp, trade-offs]
    question: |
      What is the main downside of using Factory Method to vary a product?
    options: ["It forces a parallel Creator subclass hierarchy, risking class explosion", "It cannot return the created objects through a shared interface", "It requires the produced product type to be strictly immutable", "It tightly couples every call site to the concrete product class"]
    answer: 0
    explanation: |
      To vary one product you must add a Creator subclass, so you maintain a
      parallel hierarchy of creators — potential class explosion. It actually
      removes concrete coupling and returns products through an interface.
    ref: "concepts.md#factory-method"

  - id: dp-creational-010
    difficulty: intermediate
    tags: [factory-method, template-method, comparison]
    question: |
      How does Factory Method relate to the Template Method pattern?
    options: ["They are unrelated patterns; one is creational and the other is structural", "Template Method is a narrower specialization of the Factory Method pattern", "They are simply two interchangeable names for one identical pattern", "Factory Method is a specialization of Template Method whose overridable step creates an object"]
    answer: 3
    explanation: |
      Factory Method is essentially a Template Method in which the deferred,
      subclass-overridden step is responsible for creating an object. Template
      Method is behavioral, not structural.
    ref: "concepts.md#factory-method"

  - id: dp-creational-011
    difficulty: beginner
    tags: [abstract-factory, intent]
    question: |
      Abstract Factory is best described as a pattern that provides an interface
      for creating what?
    options: ["A single product whose concrete class an overriding subclass picks", "One complex object assembled step by step under a director", "Families of related or dependent objects without specifying concrete classes", "New objects produced by cloning a pre-configured prototype"]
    answer: 2
    explanation: |
      Abstract Factory creates families of related/dependent objects without
      naming their concrete classes, guaranteeing the products are compatible.
    ref: "concepts.md#abstract-factory"

  - id: dp-creational-012
    difficulty: advanced
    tags: [abstract-factory, ocp, trade-offs]
    question: |
      What is the well-known rigidity of Abstract Factory when requirements change?
    options: ["Adding a new product TYPE forces changes to the factory interface and all implementations", "Adding a new product family requires rewriting every existing client class", "It cannot guarantee that returned products all belong to one family", "It cannot be implemented internally by delegating to Factory Methods"]
    answer: 0
    explanation: |
      Abstract Factory makes adding a new family easy but adding a new product
      type (a new create() method) hard: you must change the interface and every
      concrete factory. Its whole point is guaranteeing same-family products.
    ref: "concepts.md#abstract-factory"

  - id: dp-creational-013
    difficulty: intermediate
    tags: [abstract-factory, consistency, when-to-use]
    question: |
      Which scenario is the strongest fit for Abstract Factory?
    options: ["You need one object whose exact concrete class a subclass will decide", "You need to reuse expensive database connections from a bounded pool", "You need to build one object configured with many optional parameters", "You must ensure a set of widgets always come from one consistent look-and-feel family"]
    answer: 3
    explanation: |
      Enforcing that all products belong to one consistent family (e.g., a GUI
      look-and-feel) is Abstract Factory's sweet spot. The other cases point to
      Factory Method, Object Pool, and Builder respectively.
    ref: "concepts.md#abstract-factory"

  - id: dp-creational-014
    difficulty: intermediate
    tags: [abstract-factory, factory-method, comparison]
    question: |
      A key difference between Abstract Factory and Factory Method is that:
    options: ["Abstract Factory relies on inheritance while Factory Method relies on composition", "Factory Method returns its products only after a multi-step assembly process", "Abstract Factory creates families via composition; a Factory Method creates one product via inheritance", "Abstract Factory cannot hide the concrete product classes it returns from clients"]
    answer: 2
    explanation: |
      Abstract Factory is composition-based and produces families of related
      products; Factory Method is inheritance-based and produces a single product.
      Abstract Factories are often implemented internally with Factory Methods.
    ref: "concepts.md#abstract-factory"

  - id: dp-creational-015
    difficulty: beginner
    tags: [builder, intent, telescoping-constructor]
    question: |
      Which problem is the Builder pattern most directly designed to solve?
    options: ["Constructing an object that has many (often optional) parameters or multi-step assembly", "Ensuring exactly one instance of a class exists behind a global access point", "Choosing which concrete family of related objects to instantiate together", "Reusing expensive pooled objects instead of recreating them each time"]
    answer: 0
    explanation: |
      Builder solves the telescoping-constructor / many-optional-parameter
      problem and enables step-by-step assembly with validation and immutability.
    ref: "concepts.md#builder"

  - id: dp-creational-016
    difficulty: intermediate
    tags: [builder, immutability, validation]
    question: |
      Which benefit does a Builder provide that a no-arg constructor plus setters
      does not?
    options: ["It makes the resulting class a globally accessible Singleton", "It removes the need for writing any object construction logic", "It guarantees the finished object is created lazily on first use", "It lets the finished object be immutable and validated in one build() step"]
    answer: 3
    explanation: |
      With setters the object is mutable and can exist half-built; a Builder
      collects configuration then produces an immutable, validated object in
      build(). It does not make the class a Singleton or force laziness.
    ref: "concepts.md#builder"

  - id: dp-creational-017
    difficulty: advanced
    tags: [builder, director, fluent-idiom]
    question: |
      What distinguishes the classic GoF Builder (with a Director) from the fluent
      builder idiom popularized by Effective Java?
    options: ["The fluent idiom is fundamentally incapable of ever producing genuinely immutable objects once construction finishes", "The classic GoF form is not actually a genuine, catalogued design pattern despite what most references seem to claim", "The GoF form uses a Director to encapsulate a reusable construction sequence; the fluent idiom usually drops it and chains setters", "They are completely identical in structure, participants, and underlying design intent in essentially every respect"]
    answer: 2
    explanation: |
      In the full GoF form a Director drives a reusable construction sequence and
      can build different representations; the fluent idiom typically omits the
      Director and just chains configuration methods returning this.
    ref: "concepts.md#builder"

  - id: dp-creational-018
    difficulty: intermediate
    tags: [builder, abstract-factory, comparison]
    question: |
      How does Builder differ from Abstract Factory?
    options: ["Builder assembles one complex object step by step and returns it at the end; Abstract Factory returns products immediately and deals in families", "Builder returns its finished product immediately, whereas Abstract Factory only returns its products after a long step-by-step assembly", "Builder can only ever produce a single primitive scalar value and is fundamentally incapable of assembling a composed object graph", "Abstract Factory always relies on a dedicated Director object to sequence, drive, and validate all of its creation steps"]
    answer: 0
    explanation: |
      Builder emphasizes step-by-step assembly of one complex product returned at
      the end; Abstract Factory returns products right away and focuses on
      creating consistent families.
    ref: "concepts.md#builder"

  - id: dp-creational-019
    difficulty: beginner
    tags: [prototype, intent, clone]
    question: |
      The Prototype pattern creates new objects by:
    options: ["Calling a constructor with all required parameters", "Looking the object up in a global registry by name only", "Assembling the object from parts step by step under a separate Director", "Copying (cloning) an existing prototypical instance"]
    answer: 3
    explanation: |
      Prototype creates objects by cloning an existing instance rather than
      instantiating a class directly — useful when construction is costly or the
      concrete type is unknown at runtime.
    ref: "concepts.md#prototype"

  - id: dp-creational-020
    difficulty: intermediate
    tags: [prototype, shallow-copy, deep-copy]
    question: |
      What is the danger of a shallow copy when implementing Prototype?
    options: ["It eagerly duplicates the entire nested object graph, wasting large amounts of memory on every clone", "It always throws CloneNotSupportedException unless every referenced field is itself declared Cloneable", "The copy and original share references to nested mutable objects, so a change through one affects the other", "It silently fails to copy any primitive fields, leaving them at their default zero values"]
    answer: 2
    explanation: |
      A shallow copy duplicates the top object but shares its referenced objects.
      Mutating a shared nested object through one copy leaks into the other — a
      classic Prototype bug. Deep copy avoids this by recursively duplicating.
    ref: "concepts.md#prototype"

  - id: dp-creational-021
    difficulty: advanced
    tags: [prototype, cloneable, effective-java]
    question: |
      Why does Effective Java recommend copy constructors or copy factories over
      Java's Cloneable/clone()?
    options: ["Cloneable is broken: clone() is protected, does a shallow copy, bypasses constructors, and has awkward semantics", "clone() is measurably slower than a copy constructor across every mainstream JVM implementation", "Copy constructors and copy factories are the only mechanism capable of performing a true deep copy", "clone() cannot be overridden or invoked polymorphically through a supertype reference"]
    answer: 0
    explanation: |
      The Cloneable mechanism is widely considered a broken design: clone() is
      protected, performs a shallow field copy, bypasses constructors, and throws
      on non-Cloneable classes. Copy constructors/factories are explicit and safe.
    ref: "concepts.md#prototype"

  - id: dp-creational-022
    difficulty: intermediate
    tags: [prototype, object-pool, comparison]
    question: |
      What is the key difference between Prototype and Object Pool?
    options: ["Prototype reuses existing instances; Object Pool copies new ones", "Both patterns always produce fully immutable objects that can be shared freely", "Object Pool is a formally catalogued GoF pattern, whereas Prototype is not one", "Prototype copies to make new objects; Object Pool reuses and lends existing objects"]
    answer: 3
    explanation: |
      Prototype creates NEW objects by copying; an Object Pool reuses EXISTING
      objects by lending and reclaiming them. (Prototype is GoF; Object Pool is a
      recognized non-GoF creational pattern.)
    ref: "concepts.md#prototype"

  - id: dp-creational-023
    difficulty: advanced
    tags: [prototype, deep-copy, serialization]
    question: |
      Which technique is a simple (if slow) way to produce a deep copy of an
      object graph?
    options: ["Assigning the reference to a new variable", "Calling Object.clone() exactly once on the root object", "Serializing the object and immediately deserializing it", "Wrapping it in an unmodifiable collection"]
    answer: 2
    explanation: |
      Serializing then deserializing recreates the whole graph independently,
      giving a deep copy. It is simple but slow and requires everything to be
      serializable. Reference assignment and clone() do not deep-copy.
    ref: "concepts.md#prototype"

  - id: dp-creational-024
    difficulty: beginner
    tags: [simple-factory, static-factory, idiom]
    question: |
      Which statement about the Simple Factory / Static Factory Method is correct?
    options: ["They are idioms, not GoF patterns, that centralize creation and can provide named creation methods", "They are formally catalogued GoF creational patterns with their own named participants", "They require a parallel Creator subclass hierarchy mirroring each product type", "They always construct and return a brand-new distinct instance on every single call"]
    answer: 0
    explanation: |
      Simple Factory and Static Factory Method are common idioms, not GoF
      patterns. They centralize creation and (for static factories) give named
      creation methods that may even cache/return existing instances.
    ref: "concepts.md#simple-factory--static-factory-method"

  - id: dp-creational-025
    difficulty: intermediate
    tags: [simple-factory, ocp, trade-offs]
    question: |
      Why does a Simple Factory that uses a switch on a type code violate the
      Open/Closed Principle?
    options: ["Because it returns its created objects through a shared common interface type", "Because it relies on a single static method rather than an instance method", "Because it caches and hands back previously created instances between calls", "Because adding a new type means editing the factory's switch rather than extending it"]
    answer: 3
    explanation: |
      Every new type requires modifying the existing switch/if logic, so the
      factory is not closed to modification. Factory Method (polymorphic) or
      Abstract Factory scale better for open type sets.
    ref: "concepts.md#simple-factory--static-factory-method"

  - id: dp-creational-026
    difficulty: intermediate
    tags: [static-factory, effective-java, examples]
    question: |
      Which of these is a real-world example of a Static Factory Method?
    options: ["Integer.valueOf(42)", "new ArrayList<>()", "System.out.println()", "Thread.sleep(1000)"]
    answer: 0
    explanation: |
      Integer.valueOf() is a static factory method: a named static method used
      instead of a constructor that may return a cached instance. The others are
      a constructor call and instance/side-effect methods.
    ref: "concepts.md#simple-factory--static-factory-method"

  - id: dp-creational-027
    difficulty: advanced
    tags: [simple-factory, factory-method, comparison]
    question: |
      What is the single most important difference between a Simple Factory and a
      GoF Factory Method?
    options: ["Simple Factory returns whole families of related products, while Factory Method returns just one", "Factory Method is fundamentally unable to hide the concrete product classes it instantiates", "Simple Factory is a static, non-polymorphic method; Factory Method is an overridable hook that subclasses specialize", "Simple Factory requires a dedicated Director object to sequence its creation steps"]
    answer: 2
    explanation: |
      A Simple Factory is typically a static method with a switch (no
      polymorphism); Factory Method is an overridable instance hook so subclasses
      choose the product, which makes it OCP-friendly.
    ref: "concepts.md#simple-factory--static-factory-method"

  - id: dp-creational-028
    difficulty: beginner
    tags: [object-pool, intent]
    question: |
      What problem does the Object Pool pattern address?
    options: ["Guaranteeing a single globally accessible instance behind one shared access point", "Choosing among several families of related, mutually compatible objects", "Copying pre-configured prototypical instances to produce new ones", "Reusing expensive-to-create objects instead of creating and destroying them per use"]
    answer: 3
    explanation: |
      Object Pool reuses a bounded set of expensive-to-create objects (connections,
      threads, buffers) by lending and reclaiming them, amortizing creation cost
      and bounding resource usage.
    ref: "concepts.md#object-pool"

  - id: dp-creational-029
    difficulty: intermediate
    tags: [object-pool, state-reset, pitfalls]
    question: |
      Which failure mode is specifically introduced by using an Object Pool?
    options: ["A borrowed object returned without resetting its state can corrupt the next borrower", "Pooled objects can never be reclaimed by the garbage collector while alive", "The pool guarantees every object it lends out is fully immutable", "The pool serializes all access and prevents any concurrent borrowing"]
    answer: 0
    explanation: |
      Because instances are reused, the pool must reset object state on return; a
      dirty (unreset) object leaks state into the next borrower. Pools also risk
      leaks and starvation. They deal with mutable, reusable objects.
    ref: "concepts.md#object-pool"

  - id: dp-creational-030
    difficulty: advanced
    tags: [object-pool, premature-optimization, gc]
    question: |
      Why is Object Pool often considered a premature optimization for ordinary
      cheap objects on modern JVMs?
    options: ["Modern JVMs are fundamentally incapable of pooling ordinary short-lived heap objects at all", "Object pools inevitably and always end up causing unbounded memory leaks over an application's lifetime", "Generational GCs make short-lived allocation cheap, so pooling adds reset/leak/starvation complexity for little gain", "Cheap short-lived objects can never have their internal state cleanly reset for safe reuse"]
    answer: 2
    explanation: |
      For cheap objects, allocation plus generational GC is very fast, so a pool
      can be slower and adds bug surface (state reset, leaks, starvation). Pool
      only when creation is genuinely expensive or the resource is scarce.
    ref: "concepts.md#object-pool"

  - id: dp-creational-031
    difficulty: advanced
    tags: [object-pool, flyweight, comparison]
    question: |
      How does Object Pool differ from the Flyweight pattern?
    options: ["They are ultimately the very same underlying pattern published under two different names", "Flyweight lends out exclusively-owned instances, while Object Pool shares immutable intrinsic state", "Object Pool is fundamentally a structural pattern, whereas Flyweight is a creational one", "Object Pool lends mutable, exclusively-owned instances; Flyweight shares immutable intrinsic state across many objects"]
    answer: 3
    explanation: |
      A pool hands out a mutable instance to one borrower at a time (exclusive
      use); Flyweight (structural) shares immutable intrinsic state simultaneously
      across many logical objects to save memory.
    ref: "concepts.md#object-pool"

  - id: dp-creational-032
    difficulty: beginner
    tags: [dependency-injection, ioc, intent]
    question: |
      What is the core idea of Dependency Injection?
    options: ["An object's dependencies are supplied from the outside rather than created or looked up by the object itself", "An object constructs all of its own collaborators internally using the new operator", "An object actively fetches its collaborators from a shared global service registry", "An object shares a single copy of its state across every instance of the class"]
    answer: 0
    explanation: |
      DI supplies (injects) a component's collaborators from outside — via
      constructor, setter, or field — instead of the component constructing or
      locating them. Fetching from a registry is Service Locator, not DI.
    ref: "concepts.md#dependency-injection-di--inversion-of-control-ioc"

  - id: dp-creational-033
    difficulty: intermediate
    tags: [dependency-injection, ioc, distinction]
    question: |
      What is the correct relationship between DI and IoC?
    options: ["DI and IoC are exact synonyms referring to one identical principle", "IoC is merely one narrow specialized form of Dependency Injection", "DI is one form of IoC — specifically inverting dependency construction", "They are entirely unrelated and independent design concepts"]
    answer: 2
    explanation: |
      IoC is the broad principle that a framework calls your code (callbacks,
      template methods). DI is one specific form of IoC that inverts who
      constructs an object's dependencies. Fowler coined DI to name that narrower idea.
    ref: "concepts.md#dependency-injection-di--inversion-of-control-ioc"

  - id: dp-creational-034
    difficulty: intermediate
    tags: [dependency-injection, constructor-injection, testability]
    question: |
      Why is constructor injection generally preferred over field injection?
    options: ["It measurably reduces object construction time during application startup", "It conveniently hides a class's dependencies away from its public API surface", "It entirely removes any need to define or program against separate interfaces", "It makes dependencies explicit and required, allows final/immutable fields, and is easy to test"]
    answer: 3
    explanation: |
      Constructor injection makes required dependencies explicit in the signature,
      lets fields be final, guarantees a valid object, and is trivially testable
      by passing test doubles. Field injection hides deps and complicates testing.
    ref: "concepts.md#dependency-injection-di--inversion-of-control-ioc"

  - id: dp-creational-035
    difficulty: advanced
    tags: [dependency-injection, service-locator, comparison]
    question: |
      In Fowler's canonical comparison, how does DI differ from a Service Locator?
    options: ["With DI the dependency is pushed in; with Service Locator the client pulls it from a registry", "DI pulls dependencies from a registry; Service Locator pushes them in", "They are functionally identical and their names differ only by which framework you use", "Service Locator makes dependencies explicit, while DI hides them"]
    answer: 0
    explanation: |
      DI pushes (injects) dependencies into the client; a Service Locator has the
      client pull dependencies from a global registry. Fowler favors DI because it
      keeps dependencies explicit and avoids a hidden global locator.
    ref: "concepts.md#dependency-injection-di--inversion-of-control-ioc"

  - id: dp-creational-036
    difficulty: intermediate
    tags: [dependency-injection, trade-offs, runtime]
    question: |
      Which is a genuine downside of heavy DI-container use?
    options: ["It renders essentially all of the application's code fundamentally untestable", "It forces every managed class to be scoped and behave as a Singleton", "Framework indirection can obscure the object graph and defer wiring errors to runtime", "It actively prevents the definition and use of abstraction interfaces"]
    answer: 2
    explanation: |
      DI decouples usage from construction but the container's indirection can
      hide the real object graph, and wiring mistakes may surface only at runtime
      rather than compile time. It actually improves testability.
    ref: "concepts.md#dependency-injection-di--inversion-of-control-ioc"

  - id: dp-creational-037
    difficulty: beginner
    tags: [multiton, intent]
    question: |
      Multiton generalizes Singleton by ensuring:
    options: ["Zero instances exist until a global flag enables the class", "A brand-new distinct instance returned on every call", "One single instance shared across all processes", "One instance per key, globally accessible via a keyed lookup"]
    answer: 3
    explanation: |
      Multiton keeps a map of named instances: one instance per key, returned via
      getInstance(key). Singleton is one total; Multiton is one per key.
    ref: "concepts.md#multiton"

  - id: dp-creational-038
    difficulty: intermediate
    tags: [multiton, memory-leak, trade-offs]
    question: |
      Beyond inheriting Singleton's downsides, what additional risk does Multiton
      introduce?
    options: ["Its instance map can grow unbounded and become a memory leak if keys are never evicted", "Its keyed map fundamentally cannot be made thread-safe without a single global lock", "It always returns null for an unrecognized key rather than lazily creating one", "It silently duplicates and returns two distinct instances for the very same key"]
    answer: 0
    explanation: |
      Multiton's backing map can grow without bound when keys (especially
      user-supplied ones) are never evicted, causing a memory leak — on top of the
      usual global-state/testability problems it shares with Singleton.
    ref: "concepts.md#multiton"

  - id: dp-creational-039
    difficulty: intermediate
    tags: [multiton, singleton, registry, comparison]
    question: |
      Which comparison is accurate?
    options: ["Singleton keeps one instance per key while Multiton keeps just one total", "Multiton and Registry are entirely unrelated to keyed instance lookup", "Multiton is essentially a self-populating Registry with lazy per-key creation", "A Registry, by contrast, guarantees exactly one instance total across the app"]
    answer: 2
    explanation: |
      A Multiton is effectively a Registry (Fowler) that lazily creates one
      instance per key on first request. Singleton is one total; Multiton is one
      per key.
    ref: "concepts.md#multiton"

  - id: dp-creational-040
    difficulty: beginner
    tags: [lazy-initialization, intent]
    question: |
      Lazy Initialization defers what, and until when?
    options: ["Destroying an object until the program is about to exit", "Creating an object or computing a value until the first time it is actually needed", "Spawning worker threads until the application begins its shutdown sequence", "Resolving method dispatch until the compiler's final linking phase"]
    answer: 1
    explanation: |
      Lazy Initialization delays creating an object or computing a value until
      first use, then caches it for later calls — saving upfront cost for things
      that may never be needed.
    ref: "concepts.md#lazy-initialization"

  - id: dp-creational-041
    difficulty: intermediate
    tags: [lazy-initialization, thread-safety, hazards]
    question: |
      What is the principal hazard of naive lazy initialization in concurrent code?
    options: ["It is fundamentally unable to cache the value once it is created", "It always deadlocks the first two threads that race on first access", "It permanently prevents the deferred value from ever being created at all", "Two threads can both see the uninitialized state and double-initialize (or see a partially built object)"]
    answer: 3
    explanation: |
      On first access, concurrent threads can both observe null and each create
      the object, or observe a half-built object. This is why lazy init needs
      synchronization, DCL with volatile, or the holder idiom.
    ref: "concepts.md#lazy-initialization"

  - id: dp-creational-042
    difficulty: advanced
    tags: [lazy-initialization, virtual-proxy, comparison]
    question: |
      How does a Virtual Proxy relate to Lazy Initialization?
    options: ["A Virtual Proxy is a placeholder object that lazily loads the real subject on first use", "A Virtual Proxy eagerly loads all of the subject's data the moment it is constructed", "They are completely unrelated patterns from different GoF categories", "Lazy Initialization is the structural pattern while Virtual Proxy is the creational one"]
    answer: 0
    explanation: |
      A Virtual Proxy (structural) packages lazy initialization as a stand-in
      object that creates/loads the real subject the first time it is actually
      accessed.
    ref: "concepts.md#lazy-initialization"

  - id: dp-creational-043
    difficulty: advanced
    tags: [lazy-initialization, orm, n-plus-one]
    question: |
      Which is a classic misuse of lazy loading in data-access code?
    options: ["Caching the computed result in a field after the first successful load", "Eagerly loading the entire object graph up front in a single join query", "Triggering surprise N+1 queries when iterating over lazily-loaded associations", "Wrapping the value in a Supplier that memoizes it on first invocation"]
    answer: 2
    explanation: |
      Lazy-loaded ORM associations can fire one query per element while iterating
      (the N+1 problem), a well-known performance trap. Fowler's Lazy Load (PoEAA)
      names this data-access family.
    ref: "concepts.md#lazy-initialization"

  - id: dp-creational-044
    difficulty: intermediate
    tags: [factory-family, disambiguation, comparison]
    question: |
      Along the "inheritance vs composition" axis, which pairing is correct?
    options: ["Factory Method varies products via composition, while Abstract Factory relies on inheritance", "Both patterns work exclusively through static methods and use no polymorphism at all", "Builder varies its result via inheritance, while Factory Method works purely by composition", "Factory Method uses inheritance (override a hook); Abstract Factory uses composition (hold a factory object)"]
    answer: 3
    explanation: |
      Factory Method varies the product by subclassing/overriding a hook
      (inheritance); Abstract Factory varies the family by holding a factory
      object (composition). This axis is a frequent interview probe.
    ref: "concepts.md#factory-family-disambiguation"

  - id: dp-creational-045
    difficulty: intermediate
    tags: [factory-family, disambiguation, when-returned]
    question: |
      On the "when is the product returned" axis, which pattern differs from the
      others?
    options: ["Builder returns the product only after multi-step assembly", "Simple Factory hands the finished product back immediately on the call", "Factory Method hands the finished product back immediately on the call", "Abstract Factory hands the finished product back immediately on the call"]
    answer: 0
    explanation: |
      Simple Factory, Factory Method, and Abstract Factory all return the product
      immediately. Builder returns it at the end of an incremental assembly
      process — the distinguishing trait on this axis.
    ref: "concepts.md#factory-family-disambiguation"

  - id: dp-creational-046
    difficulty: advanced
    tags: [scenario, prototype, selection]
    question: |
      A game must spawn thousands of enemies that are all copies of a few
      pre-configured templates, and constructing one from scratch is expensive.
      Which pattern fits best?
    options: ["Singleton", "Prototype", "Builder", "Abstract Factory"]
    answer: 1
    explanation: |
      Cloning pre-configured template instances to cheaply produce many similar
      objects is Prototype. A prototype registry holds the templates and clients
      clone them.
    ref: "concepts.md#prototype"

  - id: dp-creational-047
    difficulty: advanced
    tags: [scenario, builder, selection]
    question: |
      You need to construct an HTTP request object that has one required URL and a
      dozen optional settings (headers, timeout, method, body), and you want the
      result to be immutable. Which pattern fits best?
    options: ["Object Pool", "Multiton", "Builder", "Factory Method"]
    answer: 2
    explanation: |
      Many optional parameters plus immutability is the textbook case for Builder;
      it avoids a telescoping constructor and validates in build(). This is why
      HttpRequest.newBuilder() exists.
    ref: "concepts.md#builder"

  - id: dp-creational-048
    difficulty: advanced
    tags: [scenario, object-pool, selection]
    question: |
      Opening a database connection costs tens of milliseconds and you must cap
      concurrent connections. Which pattern most directly addresses this?
    options: ["Prototype", "Abstract Factory", "Lazy Initialization", "Object Pool"]
    answer: 3
    explanation: |
      Expensive-to-create resources plus a hard cap on how many exist is the
      Object Pool use case (e.g., HikariCP). Clients borrow and return
      connections instead of opening one per query.
    ref: "concepts.md#object-pool"

  - id: dp-creational-049
    difficulty: intermediate
    tags: [scenario, abstract-factory, selection]
    question: |
      Your app must render UI consistently for either a Windows or macOS theme,
      and you must never mix a Windows button with a macOS checkbox. Which pattern
      fits best?
    options: ["Abstract Factory", "Prototype", "Singleton", "Object Pool"]
    answer: 0
    explanation: |
      Creating a whole family of related widgets that must be mutually consistent,
      chosen at startup, is the canonical Abstract Factory scenario (a per-platform
      GUIFactory).
    ref: "concepts.md#abstract-factory"

  - id: dp-creational-050
    difficulty: intermediate
    tags: [scenario, dependency-injection, testability]
    question: |
      A service directly does `new StripeGateway()` inside its constructor, making
      it impossible to substitute a fake in tests. Which approach removes this coupling?
    options: ["Turn StripeGateway into a global Singleton fetched via getInstance()", "Clone a prepared StripeGateway prototype instance for each test run", "Inject the PaymentGateway dependency from outside (constructor injection)", "Wrap the concrete StripeGateway inside a bounded Object Pool of connections"]
    answer: 2
    explanation: |
      Injecting the dependency (ideally via the constructor) against an interface
      lets you pass a real gateway in production and a fake in tests, removing the
      hard-wired concrete coupling. This is Dependency Injection.
    ref: "concepts.md#dependency-injection-di--inversion-of-control-ioc"

  - id: dp-creational-051
    difficulty: advanced
    tags: [singleton, monostate, comparison]
    question: |
      How does the Monostate (Borg) idiom differ from a classic Singleton?
    options: ["Monostate forbids more than one instance from existing", "Monostate is a keyed registry of instances", "Monostate requires an enum implementation", "Monostate allows many instances that all share the same static state, behaving singleton-like through instance semantics"]
    answer: 3
    explanation: |
      Singleton restricts creation to one object; Monostate/Borg lets you create
      many instances, but they all share static state so they behave as one. A
      keyed registry would be Multiton.
    ref: "concepts.md#factory-family-disambiguation"

  - id: dp-creational-052
    difficulty: advanced
    tags: [singleton, serialization, reflection, pitfalls]
    question: |
      Which trio of mechanisms can break a hand-rolled (non-enum) Singleton by
      producing a second instance?
    options: ["Garbage collection, JIT, and boxing", "Reflection, serialization, and cloning", "Autoboxing, generics, and varargs", "Streams, lambdas, and method references"]
    answer: 1
    explanation: |
      Reflection can invoke the private constructor, deserialization can create a
      new instance unless readResolve() is implemented, and clone() can copy it.
      The enum Singleton is immune to all three.
    ref: "concepts.md#singleton"

  - id: dp-creational-053
    difficulty: beginner
    tags: [factory-method, jdk, real-world]
    question: |
      Which JDK method is a classic example of a Factory Method returning a
      product through an interface?
    options: ["Collection.iterator()", "System.currentTimeMillis()", "Math.max()", "String.length()"]
    answer: 0
    explanation: |
      Collection.iterator() lets each concrete collection return its own Iterator
      implementation while callers program to the Iterator interface — a Factory
      Method in the JDK.
    ref: "concepts.md#factory-method"

  - id: dp-creational-054
    difficulty: advanced
    tags: [factory-family, disambiguation, ocp]
    question: |
      Across the factory family, which statement about Open/Closed adherence is correct?
    options: ["Simple Factory is the most OCP-friendly of the whole group because its switch is trivial to grow", "Abstract Factory is equally easy to extend along every axis, including adding brand-new product types", "Factory Method is OCP-friendly (add a subclass), while a Simple Factory requires editing its switch", "Builder inherently violates the Open/Closed Principle by its very construction design"]
    answer: 2
    explanation: |
      Factory Method lets you add products by adding a subclass (closed to
      modification); a Simple Factory requires editing the existing switch.
      Abstract Factory is easy to extend with new families but hard for new
      product types.
    ref: "concepts.md#factory-family-disambiguation"

  - id: dp-creational-055
    difficulty: intermediate
    tags: [creational, boundary, cross-reference]
    question: |
      In this library, where are distributed/cloud "creational-flavored"
      provisioning patterns and their scenario deep-dives covered?
    options: ["Fully documented inline within this topic's Singleton section, since provisioning is treated as a Singleton variant", "Deliberately left out of the entire library because cloud provisioning is considered outside design-pattern scope", "Listed only as external links in this topic's References section, with no dedicated scenario walkthroughs", "In dp-distributed-cloud and deep-dive topics like event-driven-cqrs-saga-cdc, cross-referenced rather than duplicated here"]
    answer: 3
    explanation: |
      This OO-first topic cross-references dp-distributed-cloud and the existing
