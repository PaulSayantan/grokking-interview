topic: "AWS Cloud Design Patterns: Static Content Delivery and Data Upload"
domain: system-design
topic_slug: aws-cdp-static-content-and-upload
version: 1
questions:
  - id: aws-cdp-static-content-and-upload-001
    difficulty: beginner
    tags: [web-storage, s3, intent]
    question: |
      A single web server is saturating its network pipe serving large video and ZIP
      downloads. Which CDP pattern directly addresses this by moving the large objects
      off the web server?
    options: ["Direct Object Upload", "Write Proxy", "Web Storage", "Storage Index"]
    answer: 2
    explanation: |
      Web Storage relocates large static files from the web server's disk into object
      storage (S3) and delivers them from there, removing the server's network/disk
      bottleneck. Write Proxy and Direct Object Upload concern *uploads*; Storage Index is
      about querying object metadata.
    ref: "concepts.md#web-storage"

  - id: aws-cdp-static-content-and-upload-002
    difficulty: intermediate
    tags: [web-storage, security, modern]
    question: |
      The 2012 catalog's Web Storage implementation says to "set the objects to public."
      Why is this discouraged today, and what is the modern replacement?
    options:
      - "Public buckets are a leading data-leak risk; keep Block Public Access ON and serve via CloudFront with Origin Access Control"
      - "Public objects cost more; use S3 Intelligent-Tiering instead"
      - "Public objects can't be versioned; enable bucket versioning instead"
      - "Public access disables durability; enable Cross-Region Replication instead"
    answer: 0
    explanation: |
      Publicly readable buckets/objects are a top cause of S3 data leaks. Modern practice
      keeps Block Public Access enabled and fronts the private bucket with CloudFront +
      OAC, so only the distribution can read the origin. Cost, versioning, and durability
      are unrelated to the public/private choice.
    ref: "concepts.md#web-storage"

  - id: aws-cdp-static-content-and-upload-003
    difficulty: beginner
    tags: [direct-hosting, s3, static-site]
    question: |
      Which CDP pattern hosts an entire static website — HTML, CSS, and JS — directly out
      of S3 with no web servers to manage?
    options: ["Web Storage", "Cache Distribution", "Direct Hosting", "Direct Object Upload"]
    answer: 2
    explanation: |
      Direct Hosting uses S3 itself as the web tier, serving HTML/CSS/JS (not just media).
      Web Storage only offloads large files while a web server still serves the pages;
      Cache Distribution is about edge caching; Direct Object Upload is an upload pattern.
    ref: "concepts.md#direct-hosting"

  - id: aws-cdp-static-content-and-upload-004
    difficulty: intermediate
    tags: [direct-hosting, cloudfront, tls, modern]
    question: |
      You are hosting an SPA with Direct Hosting. Why put CloudFront in front of the S3
      origin rather than serving from the S3 website endpoint alone?
    options:
      - "S3 cannot store JavaScript files, so CloudFront is required to serve them"
      - "CloudFront is the only way to enable S3 versioning"
      - "S3 static hosting has a hard limit of 100 objects per bucket"
      - "The S3 website endpoint is HTTP-only; CloudFront adds TLS/HTTPS, a global cache, HTTP/2-3, and a proper custom domain"
    answer: 3
    explanation: |
      The S3 static website endpoint serves HTTP only and has no edge cache. CloudFront
      adds HTTPS via ACM, global edge caching, modern protocols, and a correctly handled
      custom domain (Route 53 alias). The other options are fabricated limits.
    ref: "concepts.md#direct-hosting"

  - id: aws-cdp-static-content-and-upload-005
    difficulty: advanced
    tags: [direct-hosting, spa, routing, modern]
    question: |
      With an S3 + CloudFront static SPA, deep links like /dashboard/settings return 403/404
      because no such object exists. What is the modern AWS way to make client-side routing
      work?
    options:
      - "Enable S3 Transfer Acceleration on the bucket"
      - "Use a CloudFront Function or custom error responses to rewrite 403/404 to /index.html"
      - "Switch the bucket to public-read so all paths resolve"
      - "Add a Route 53 wildcard record for every route"
    answer: 1
    explanation: |
      SPA client-side routing needs unknown paths to fall back to index.html. CloudFront
      Functions (or custom error responses mapping 403/404 → /index.html with 200) do this
      at the edge. Transfer Acceleration is for uploads; public-read is a security
      anti-pattern; Route 53 records don't map object paths.
    ref: "concepts.md#direct-hosting"

  - id: aws-cdp-static-content-and-upload-006
    difficulty: beginner
    tags: [private-distribution, intent]
    question: |
      Which CDP pattern delivers S3 content to only specific, authorized users using
      time-limited signed URLs?
    options: ["Cache Distribution", "Private Distribution", "Web Storage", "Rename Distribution"]
    answer: 1
    explanation: |
      Private Distribution issues time-limited (and optionally IP-restricted) signed URLs so
      only authorized users can download, while the bytes still stream directly from S3.
      The others are public-delivery, offload, or cache-busting patterns.
    ref: "concepts.md#private-distribution"

  - id: aws-cdp-static-content-and-upload-007
    difficulty: intermediate
    tags: [private-distribution, presigned-url, cloudfront]
    question: |
      You need to authorize a *set* of cacheable objects (all the segments of one gated
      video) through the CDN without signing each URL individually. Which mechanism fits
      best?
    options:
      - "S3 presigned URL per object"
      - "A public bucket policy"
      - "CloudFront signed cookies"
      - "S3 Block Public Access exception list"
    answer: 2
    explanation: |
      CloudFront signed cookies authorize access to a group of objects (e.g., a whole
      video's segments) without minting a URL per object, and keep edge caching. A
      presigned S3 URL covers one object and bypasses the CDN; public policies and
      "exception lists" don't provide per-user gating.
    ref: "concepts.md#private-distribution"

  - id: aws-cdp-static-content-and-upload-008
    difficulty: advanced
    tags: [private-distribution, tradeoffs, cloudfront, multi]
    type: multi
    question: |
      Which statements about S3 presigned URLs versus CloudFront signed URLs/cookies are
      TRUE? Select all that apply.
    options:
      - "Presigned S3 URLs are the best choice for high-volume cacheable content served through the CDN"
      - "S3 presigned URLs bypass the CDN, so the origin bears every request with no edge caching"
      - "CloudFront signed cookies can authorize a set of objects without signing each URL"
      - "CloudFront signed URLs/cookies keep edge caching and TLS while restricting access"
    answers: [1, 2, 3]
    explanation: |
      Presigned S3 URLs hit the origin directly (no edge cache) — good for one-off per-user
      objects, not high-volume cacheable content, so the claim that they are best for
      high-volume cacheable CDN content is false. CloudFront
      signed cookies cover object sets, and CloudFront signing preserves the edge cache and
      TLS.
    ref: "concepts.md#private-distribution"

  - id: aws-cdp-static-content-and-upload-009
    difficulty: intermediate
    tags: [private-distribution, classic, egress]
    question: |
      In the classic Private Distribution pattern, why is it significant that the actual
      download still happens directly from S3 rather than through an EC2 instance?
    options:
      - "It lets the EC2 instance cache the file for faster repeat downloads"
      - "It allows the file to be encrypted only at that moment"
      - "The download inherits S3's scalability and resilience; the app server isn't in the byte path"
      - "It bypasses the need for any authentication"
    answer: 2
    explanation: |
      The app authenticates the user and mints a signed URL, but the bytes flow straight
      from S3, so downloads scale with S3 and don't load the app tier. The point is
      offloading the byte path, not caching, encryption timing, or skipping auth.
    ref: "concepts.md#private-distribution"

  - id: aws-cdp-static-content-and-upload-010
    difficulty: beginner
    tags: [cache-distribution, cdn, intent]
    question: |
      Users in Tokyo suffer ~200 ms latency fetching content from a single US-East origin.
      Which CDP pattern places cached copies near users worldwide?
    options: ["Rename Distribution", "Cache Distribution", "Write Proxy", "Storage Index"]
    answer: 1
    explanation: |
      Cache Distribution caches content at edge locations (CloudFront) around the world so
      users are served from a nearby edge, cutting latency and offloading the origin. Rename
      Distribution is cache-busting; the other two are upload/index patterns.
    ref: "concepts.md#cache-distribution"

  - id: aws-cdp-static-content-and-upload-011
    difficulty: intermediate
    tags: [cache-distribution, cloudfront, origins, multi]
    type: multi
    question: |
      Per the CDP catalog and modern CloudFront, which can serve as the origin for a Cache
      Distribution? Select all that apply.
    options:
      - "A DynamoDB table queried directly as an origin"
      - "An S3 bucket"
      - "A custom origin such as an EC2 web server"
      - "An on-premises / external hosting server reachable over the internet"
    answers: [1, 2, 3]
    explanation: |
      CloudFront can front an S3 origin or any custom HTTP origin, including EC2 and even
      on-premises/external servers. DynamoDB is not a CloudFront origin — you'd put an API
      (API Gateway/ALB/Lambda) in front of it, which then acts as the custom origin.
    ref: "concepts.md#cache-distribution"

  - id: aws-cdp-static-content-and-upload-012
    difficulty: intermediate
    tags: [cache-distribution, staleness, ttl]
    question: |
      What is the key caution the catalog raises about Cache Distribution?
    options:
      - "CloudFront cannot serve HTTPS content"
      - "Edge caches serve stale content until the TTL expires, so origin updates don't propagate instantly"
      - "Each edge location must be provisioned manually per region"
      - "S3 cannot be used as an origin"
    answer: 1
    explanation: |
      Edges cache based on TTL, so updating the origin doesn't immediately update the
      edges — you manage this with cache-busting (Rename Distribution) or invalidations.
      CloudFront does serve HTTPS, provisions edges automatically, and supports S3 origins.
    ref: "concepts.md#cache-distribution"

  - id: aws-cdp-static-content-and-upload-013
    difficulty: beginner
    tags: [rename-distribution, cache-busting, intent]
    question: |
      Which CDP pattern pushes an updated file to users immediately by giving the new
      version a different URL, instead of waiting for the edge cache TTL to expire?
    options: ["Cache Distribution", "Private Distribution", "Rename Distribution", "Web Storage"]
    answer: 2
    explanation: |
      Rename Distribution exploits the fact that the CDN keys its cache on URL: a new
      filename is treated as a brand-new object and fetched immediately. Cache Distribution
      creates the staleness problem; the others are unrelated.
    ref: "concepts.md#rename-distribution"

  - id: aws-cdp-static-content-and-upload-014
    difficulty: advanced
    tags: [rename-distribution, invalidation, tradeoffs]
    question: |
      For routine deploys of a static site behind CloudFront, why are versioned/hashed
      filenames (Rename Distribution) generally preferred over CloudFront invalidations?
    options:
      - "Invalidations permanently delete the object from the origin"
      - "Invalidations only work for objects smaller than 1 MB"
      - "Versioned filenames disable edge caching, forcing fresh fetches"
      - "Versioned filenames are effectively free and instant, let old/new coexist for safe rollback, and avoid origin stampedes"
    answer: 3
    explanation: |
      Content-hashed filenames are free, take effect immediately, and let versions coexist
      (safe rollbacks, no thundering herd). Invalidations cost money past the free tier and
      can stampede the origin. Invalidations don't delete origin objects or have a 1 MB
      limit, and versioned names still cache (immutably).
    ref: "concepts.md#rename-distribution"

  - id: aws-cdp-static-content-and-upload-015
    difficulty: intermediate
    tags: [rename-distribution, base-content, ttl]
    question: |
      In Rename Distribution, why must the "base" document (e.g., the HTML that references
      the versioned asset URLs) have a short TTL or be served from the origin?
    options:
      - "Because S3 charges more for cached HTML"
      - "So clients quickly pick up the references to the new asset URLs rather than caching old references"
      - "Because HTML files cannot be stored in S3"
      - "So the base document can be encrypted at the edge"
    answer: 1
    explanation: |
      The whole scheme fails if the base document that points at the new URLs is itself
      cached for a long time — clients would keep seeing the old references. So the entry
      document is short-TTL while the fingerprinted assets are long-lived/immutable.
    ref: "concepts.md#rename-distribution"

  - id: aws-cdp-static-content-and-upload-016
    difficulty: advanced
    tags: [rename-distribution, modern, cache-control, multi]
    type: multi
    question: |
      Which practices correctly implement the modern equivalent of Rename Distribution?
      Select all that apply.
    options:
      - "Fingerprint asset filenames (e.g., app.9f3c1a.js) via the build tool"
      - "Set every object, including index.html, to a one-year immutable TTL"
      - "Serve fingerprinted assets with Cache-Control: max-age=31536000, immutable"
      - "Keep index.html on a short TTL so it references the current hashed names"
    answers: [0, 2, 3]
    explanation: |
      Build tools hash asset names; those immutable assets get a long/immutable
      Cache-Control, while the small entry HTML stays short-TTL so new hashed references
      propagate quickly. Making index.html one-year immutable would defeat the whole
      approach.
    ref: "concepts.md#rename-distribution"

  - id: aws-cdp-static-content-and-upload-017
    difficulty: beginner
    tags: [write-proxy, upload, intent]
    question: |
      Which CDP pattern accelerates uploading large data to S3 by first sending it to an
      in-region server over a faster-than-HTTP transport, which then forwards to S3?
    options: ["Direct Object Upload", "Write Proxy", "Storage Index", "Private Distribution"]
    answer: 1
    explanation: |
      Write Proxy interposes an in-region "upload server" that receives data over an
      accelerated protocol (e.g., UDP-based) and forwards it to S3 over the fast AWS
      backbone. Direct Object Upload does the opposite (client → S3 directly, no proxy).
    ref: "concepts.md#write-proxy"

  - id: aws-cdp-static-content-and-upload-018
    difficulty: intermediate
    tags: [write-proxy, classic, protocols]
    question: |
      In the classic Write Proxy pattern, why is HTTP replaced with a protocol like
      TsunamiUDP or Aspera on the client-to-upload-server leg?
    options:
      - "Because S3 rejects HTTP uploads entirely"
      - "Because UDP guarantees stronger durability than HTTP"
      - "To overcome slow single-stream HTTP throughput over long, high-latency links"
      - "To avoid paying S3 request charges"
    answer: 2
    explanation: |
      S3 writes over HTTP are relatively slow, and long-haul, lossy links make it worse.
      UDP-based accelerators fill the pipe better over high-latency paths. S3 does accept
      HTTP(S), UDP doesn't add durability, and the choice isn't about request pricing.
    ref: "concepts.md#write-proxy"

  - id: aws-cdp-static-content-and-upload-019
    difficulty: advanced
    tags: [write-proxy, modern, transfer-acceleration, multi]
    type: multi
    question: |
      Which modern AWS capabilities have largely absorbed the classic Write Proxy pattern?
      Select all that apply.
    options:
      - "S3 Transfer Acceleration"
      - "Amazon SimpleDB for faster writes"
      - "S3 multipart upload with parallel parts"
      - "AWS DataSync for bulk/recurring transfers"
    answers: [0, 2, 3]
    explanation: |
      Transfer Acceleration routes uploads over the CloudFront edge/AWS backbone; multipart
      parallelizes and resumes large uploads; DataSync handles bulk transfer. SimpleDB is a
      deprecated datastore, unrelated to upload acceleration.
    ref: "concepts.md#write-proxy"

  - id: aws-cdp-static-content-and-upload-020
    difficulty: advanced
    tags: [write-proxy, still-relevant, transfer-family]
    question: |
      When might a Write-Proxy-style upload server still be justified on AWS today?
    options:
      - "For every S3 upload, since direct uploads are not supported"
      - "Only when uploading from the same region as the bucket"
      - "Whenever files are larger than 5 GB, which S3 cannot accept otherwise"
      - "When you need a specialized transport (e.g., licensed Aspera FASP) or must terminate a legacy protocol AWS-native S3 APIs can't speak"
    answer: 3
    explanation: |
      A proxy survives for niche transports like Aspera FASP or legacy protocol
      termination (though AWS Transfer Family now offers managed SFTP/FTPS fronting S3).
      Direct uploads are fully supported, S3 handles far larger objects via multipart, and
      same-region uploads don't need a proxy.
    ref: "concepts.md#write-proxy"

  - id: aws-cdp-static-content-and-upload-021
    difficulty: beginner
    tags: [storage-index, metadata, intent]
    question: |
      Which CDP pattern makes large volumes of S3 objects searchable by storing their
      metadata in a fast queryable datastore that points back at the objects?
    options: ["Write Proxy", "Storage Index", "Cache Distribution", "Direct Hosting"]
    answer: 1
    explanation: |
      Storage Index keeps object metadata (key, size, timestamp, owner…) in a fast KVS/DB
      that indexes and points at the S3 objects, so you query the index and then fetch the
      bytes. The others don't provide search over object storage.
    ref: "concepts.md#storage-index"

  - id: aws-cdp-static-content-and-upload-022
    difficulty: intermediate
    tags: [storage-index, classic, s3-limits]
    question: |
      What limitation of S3 motivates the Storage Index pattern?
    options:
      - "S3 has no rich, high-speed query/search — 'all objects for user X' or a date range is painful"
      - "S3 cannot store objects larger than 1 GB"
      - "S3 objects are automatically deleted after 30 days"
      - "S3 does not replicate data across datacenters"
    answer: 0
    explanation: |
      S3 is durable storage, not a database: it lacks fast rich queries, so attribute/range
      searches over keys are slow. Storage Index adds a queryable metadata layer. The other
      options are false (no 1 GB cap, no auto-expiry, S3 is highly durable/replicated).
    ref: "concepts.md#storage-index"

  - id: aws-cdp-static-content-and-upload-023
    difficulty: intermediate
    tags: [storage-index, modern, dynamodb]
    question: |
      The 2012 catalog names SimpleDB or DynamoDB for the Storage Index. What is the modern
      recommendation?
    options:
      - "Use SimpleDB, which is now the recommended default"
      - "Store metadata as extra copies of the object in S3"
      - "Use DynamoDB (or RDS/Aurora for rich SQL); SimpleDB is obsolete"
      - "Skip the index and rely on S3 LIST for all queries"
    answer: 2
    explanation: |
      DynamoDB is the modern high-scale key/attribute store for the index; RDS/Aurora when
      you need SQL/joins; OpenSearch for full-text. SimpleDB is deprecated. Duplicating in
      S3 or relying on LIST doesn't give fast, rich queries.
    ref: "concepts.md#storage-index"

  - id: aws-cdp-static-content-and-upload-024
    difficulty: advanced
    tags: [storage-index, consistency, events]
    question: |
      The catalog warns the index and S3 can drift. What is the modern, event-driven way to
      keep the Storage Index in sync as objects change?
    options:
      - "Poll the entire bucket with LIST every minute and rebuild the index"
      - "Turn off S3 versioning so metadata can't change"
      - "Store the index inside each object's body"
      - "Trigger a Lambda from S3 Event Notifications (or EventBridge) on ObjectCreated/ObjectRemoved to update the index"
    answer: 3
    explanation: |
      S3 event notifications → Lambda/EventBridge update the index reactively on
      create/delete, replacing brittle app-side dual writes. Full-bucket polling doesn't
      scale, disabling versioning is irrelevant, and embedding the index in objects defeats
      the purpose.
    ref: "concepts.md#storage-index"

  - id: aws-cdp-static-content-and-upload-025
    difficulty: advanced
    tags: [storage-index, modern, query, multi]
    type: multi
    question: |
      In a modern Storage Index architecture, which AWS services are reasonable choices for
      the queryable layer over S3 objects? Select all that apply.
    options:
      - "DynamoDB for high-scale key/attribute lookups"
      - "Amazon SES for indexing object metadata"
      - "Amazon OpenSearch for full-text / faceted search over metadata"
      - "RDS/Aurora when rich SQL or joins are needed"
    answers: [0, 2, 3]
    explanation: |
      DynamoDB, OpenSearch, and RDS/Aurora all serve as the queryable metadata layer
      depending on access patterns. SES is an email-sending service and has nothing to do
      with indexing.
    ref: "concepts.md#storage-index"

  - id: aws-cdp-static-content-and-upload-026
    difficulty: beginner
    tags: [direct-object-upload, intent]
    question: |
      Which CDP pattern has clients upload files straight to S3, bypassing the app/EC2
      tier so it never becomes a network bottleneck?
    options: ["Write Proxy", "Direct Object Upload", "Storage Index", "Cache Distribution"]
    answer: 1
    explanation: |
      Direct Object Upload sends bytes directly from the client to S3 (originally via a
      signed HTML POST form), keeping the app tier out of the byte path. Write Proxy is the
      opposite — it routes uploads through a proxy server.
    ref: "concepts.md#direct-object-upload"

  - id: aws-cdp-static-content-and-upload-027
    difficulty: intermediate
    tags: [direct-object-upload, presigned, modern]
    question: |
      What is the modern AWS realization of Direct Object Upload's "signed HTML form"?
    options:
      - "A public bucket that anyone can PUT to"
      - "S3 Transfer Acceleration configured on the app server"
      - "A backend (e.g., API Gateway + Lambda) that mints a scoped presigned PUT URL or presigned POST, and the client uploads directly to S3"
      - "A CloudFront signed cookie for uploads"
    answer: 2
    explanation: |
      The modern pattern authenticates the user server-side and returns a presigned PUT URL
      or presigned POST scoped to a key/size/type; the client then uploads straight to S3. A
      public writable bucket is dangerous; Transfer Acceleration is orthogonal; signed
      cookies are for read distribution.
    ref: "concepts.md#direct-object-upload"

  - id: aws-cdp-static-content-and-upload-028
    difficulty: advanced
    tags: [direct-object-upload, security, presigned, multi]
    type: multi
    question: |
      When issuing a presigned upload grant for Direct Object Upload, which constraints
      should you scope to avoid an open write hole? Select all that apply.
    options:
      - "The client's browser vendor and version"
      - "A specific key or key prefix"
      - "A maximum object size"
      - "A short expiry time"
    answers: [1, 2, 3]
    explanation: |
      Scope the presigned grant by key/prefix, max size, allowed content-type, and short
      expiry so it can't be abused. Browser vendor/version is neither enforceable via a
      presigned policy nor a meaningful security control.
    ref: "concepts.md#direct-object-upload"

  - id: aws-cdp-static-content-and-upload-029
    difficulty: intermediate
    tags: [direct-object-upload, completion, events]
    question: |
      The classic Direct Object Upload used an S3 redirect to a success URL to signal
      completion. What replaces that redirect in modern designs?
    options:
      - "Polling the EC2 upload server for a status flag"
      - "S3 Event Notifications → Lambda/EventBridge triggering post-processing"
      - "A CloudFront invalidation on the uploaded key"
      - "A DynamoDB stream on the client device"
    answer: 1
    explanation: |
      Completion is detected via S3 Event Notifications to Lambda/EventBridge, which then
      records metadata, transcodes, validates, etc. Polling a server reintroduces the
      bottleneck; invalidations are a CDN concept; DynamoDB streams don't run on clients.
    ref: "concepts.md#direct-object-upload"

  - id: aws-cdp-static-content-and-upload-030
    difficulty: advanced
    tags: [direct-object-upload, tradeoffs, validation]
    question: |
      A downside of Direct Object Upload compared to routing uploads through your app tier
      is that you cannot inspect or transform the payload in-flight. How is this handled?
    options:
      - "You must abandon direct upload and proxy all bytes through EC2"
      - "Validation is impossible, so you accept unvalidated data"
      - "Run validation, virus-scan, or transcoding after upload, triggered by the S3 object-created event"
      - "Use CloudFront to scan the file at the edge before it reaches S3"
    answer: 2
    explanation: |
      Because bytes go straight to S3, you validate/scan/transcode *after* the object lands,
      driven by the ObjectCreated event → Lambda/Step Functions. You don't have to give up
      direct upload, validation is very possible (just post-hoc), and CloudFront doesn't
      scan uploads to S3.
    ref: "concepts.md#direct-object-upload"

  - id: aws-cdp-static-content-and-upload-031
    difficulty: intermediate
    tags: [selection, static-content, multi]
    type: multi
    question: |
      Which CDP patterns are essentially variations of "store objects in S3 and serve them
      through S3/CloudFront"? Select all that apply.
    options: ["Web Storage", "Write Proxy", "Direct Hosting", "Cache Distribution"]
    answers: [0, 2, 3]
    explanation: |
      Web Storage (offload large files to S3), Direct Hosting (serve the whole static site
      from S3), and Cache Distribution (edge-cache via CloudFront) form the static-content
      trio. Write Proxy is an *upload*-acceleration pattern, not static delivery.
    ref: "concepts.md#cache-distribution"

  - id: aws-cdp-static-content-and-upload-032
    difficulty: intermediate
    tags: [selection, scenario]
    question: |
      A photo-sharing app wants users to upload huge images without the web tier proxying
      the bytes, AND wants to later search uploads by user and date. Which pair of patterns
      applies?
    options:
      - "Cache Distribution + Rename Distribution"
      - "Direct Object Upload + Storage Index"
      - "Write Proxy + Private Distribution"
      - "Web Storage + Direct Hosting"
    answer: 1
    explanation: |
      Direct Object Upload gets bytes straight to S3 without the app tier proxying, and
      Storage Index provides the queryable metadata (user, date) over those objects. The
      other pairs address caching/cache-busting, upload-proxying, or static hosting.
    ref: "concepts.md#storage-index"

  - id: aws-cdp-static-content-and-upload-033
    difficulty: advanced
    tags: [selection, scenario, private-distribution]
    question: |
      You sell downloadable PDFs. Each buyer should get a link that works for 15 minutes and
      only for the object they purchased, streamed directly from S3. Which pattern and
      mechanism fit best?
    options:
      - "Cache Distribution with a long TTL"
      - "Direct Hosting with a public bucket"
      - "Private Distribution using a short-expiry S3 presigned URL per object"
      - "Rename Distribution with versioned filenames"
    answer: 2
    explanation: |
      Private Distribution with a per-object, short-expiry presigned URL gives time-limited,
      object-scoped access straight from S3 — ideal for one-off per-user downloads. Caching,
      public hosting, and cache-busting don't provide per-user authorization.
    ref: "concepts.md#private-distribution"

  - id: aws-cdp-static-content-and-upload-034
    difficulty: intermediate
    tags: [classic-vs-modern, cache-distribution]
    question: |
      "The Cache Distribution pattern is realized on AWS today by ___." Which fills the
      blank most accurately?
    options:
      - "ElastiCache in front of the origin"
      - "S3 Cross-Region Replication"
      - "Amazon CloudFront edge caching, with refinements like OAC, cache policies, and HTTP/3"
      - "A fleet of EC2 caching proxies you manage per region"
    answer: 2
    explanation: |
      Cache Distribution maps to CloudFront (a managed global CDN) with modern refinements.
      ElastiCache is an in-memory DB cache (different pattern), CRR replicates buckets (not
      edge caching), and managing per-region EC2 proxies is exactly what CloudFront spares
      you.
    ref: "concepts.md#cache-distribution"

  - id: aws-cdp-static-content-and-upload-035
    difficulty: intermediate
    tags: [classic-vs-modern, direct-hosting]
    question: |
      Which modern topology best expresses Direct Hosting done "the right way" today?
    options:
      - "Public S3 website endpoint over HTTP, no CDN"
      - "An Auto Scaling group of EC2 web servers serving static files"
      - "Lambda serving each HTML file per request"
      - "S3 (private, Block Public Access ON) as origin + CloudFront + OAC + Route 53 alias + ACM cert"
    answer: 3
    explanation: |
      The modern default is a private S3 origin fronted by CloudFront with OAC, HTTPS via
      ACM, and a Route 53 alias. The public HTTP endpoint is the dated execution; EC2/Lambda
      to serve static files reintroduces servers the pattern exists to remove.
    ref: "concepts.md#direct-hosting"

  - id: aws-cdp-static-content-and-upload-036
    difficulty: beginner
    tags: [storage-index, split, concept]
    question: |
      Storage Index is the canonical "___" split.
    options:
      - "compute in Lambda, storage in EBS"
      - "metadata in the database, blob in S3"
      - "reads on replicas, writes on the primary"
      - "cache at the edge, origin at the center"
    answer: 1
    explanation: |
      Storage Index embodies "metadata in the DB, blob (payload) in S3" — the DB is queried
      to find objects; S3 stores the bytes. The other phrases describe compute/storage,
      read-replica, and CDN patterns.
    ref: "concepts.md#storage-index"

  - id: aws-cdp-static-content-and-upload-037
    difficulty: advanced
    tags: [private-distribution, oac, security]
    question: |
      When using CloudFront signed URLs/cookies for Private Distribution, how do you ensure
      users can't bypass CloudFront and hit the S3 object directly?
    options:
      - "Make the object public but obfuscate its key"
      - "Rely on the object being large enough to deter direct access"
      - "Keep the bucket private and grant read only to the CloudFront distribution via Origin Access Control (OAC)"
      - "Enable S3 Transfer Acceleration"
    answer: 2
    explanation: |
      OAC lets only the CloudFront distribution read the private bucket, so the signed-URL
      gate can't be bypassed by hitting S3 directly. Obfuscation and "large file" are not
      security controls; Transfer Acceleration is an upload feature.
    ref: "concepts.md#private-distribution"

  - id: aws-cdp-static-content-and-upload-038
    difficulty: intermediate
    tags: [direct-object-upload, cors, browser]
    question: |
      For a browser to upload directly to an S3 bucket on a different origin (Direct Object
      Upload), what must be configured on the bucket?
    options: ["A CloudFront invalidation", "A read replica", "CORS configuration", "A VPC endpoint"]
    answer: 2
    explanation: |
      Cross-origin browser uploads require a CORS configuration on the bucket allowing the
      web app's origin and methods. Invalidations are CDN cache ops, read replicas are a DB
      concept, and a VPC endpoint is for private network routing, not browser CORS.
    ref: "concepts.md#direct-object-upload"

  - id: aws-cdp-static-content-and-upload-039
    difficulty: advanced
    tags: [write-proxy, multipart, modern]
    question: |
      The catalog mentions dividing a file into parts written in parallel to speed S3
      writes. What is this called, and is it still the modern approach?
    options:
      - "Sharding write — now deprecated"
      - "Rename distribution — replaced by invalidations"
      - "Read replica fan-out — still current"
      - "Multipart upload — yes, it's the built-in modern way to speed and resume large uploads"
    answer: 3
    explanation: |
      Splitting a large object into parallel parts is S3 multipart upload, which remains the
      standard mechanism for fast, resumable large uploads (with presigned part URLs for
      direct client uploads). The other terms are unrelated patterns.
    ref: "concepts.md#write-proxy"

  - id: aws-cdp-static-content-and-upload-040
    difficulty: intermediate
    tags: [cache-distribution, rename-distribution, relationship]
    question: |
      How do Cache Distribution and Rename Distribution relate?
    options:
      - "They are the same pattern under two names"
      - "Rename Distribution solves the staleness problem introduced by Cache Distribution's TTL-based edge caching"
      - "Cache Distribution is only for uploads; Rename Distribution is only for downloads"
      - "Rename Distribution must be used before Cache Distribution can work"
    answer: 1
    explanation: |
      Cache Distribution introduces edge staleness (updates wait for TTL); Rename
      Distribution addresses it by changing the URL so the edge fetches fresh content
      immediately. They're distinct, complementary patterns, both about download delivery.
    ref: "concepts.md#rename-distribution"

  - id: aws-cdp-static-content-and-upload-041
    difficulty: beginner
    tags: [web-storage, durability]
    question: |
      Per the catalog, one Web Storage benefit is that S3 keeps copies across multiple
      datacenters. What property does this give?
    options: ["Low write latency", "Server-side scripting", "High durability", "Cheaper compute"]
    answer: 2
    explanation: |
      Storing across multiple datacenters yields high durability (S3 is designed for
      11 nines). It doesn't inherently lower write latency, S3 can't run server-side
      scripts, and it isn't a compute service.
    ref: "concepts.md#web-storage"

  - id: aws-cdp-static-content-and-upload-042
    difficulty: intermediate
    tags: [direct-hosting, dynamic, modern]
    question: |
      The catalog notes S3 can't run server-side programs, and suggested JSONP for
      cross-origin data. How do you handle dynamic needs in a modern Direct Hosting setup?
    options:
      - "Enable server-side scripting on the S3 bucket"
      - "Switch the whole site back to an EC2 fleet"
      - "Use JSONP, which is still the recommended approach"
      - "Use API Gateway + Lambda (or CloudFront Functions / Lambda@Edge) for dynamic parts and CORS for cross-origin fetches"
    answer: 3
    explanation: |
      Dynamic behavior is added via API Gateway + Lambda or edge functions, and CORS
      replaces the old JSONP workaround for cross-origin fetches. S3 still can't run
      server-side code, but you don't need to abandon static hosting or use JSONP.
    ref: "concepts.md#direct-hosting"

  - id: aws-cdp-static-content-and-upload-043
    difficulty: advanced
    tags: [selection, scenario, rename-distribution]
    question: |
      Your team deploys a static site behind CloudFront several times a day and wants users
      to get new assets instantly, cheaply, with easy rollback. What should you do?
    options:
      - "Issue a wildcard CloudFront invalidation on every deploy"
      - "Ship content-hashed asset filenames with long immutable TTLs and a short-TTL index.html (Rename Distribution)"
      - "Set all TTLs to zero to disable caching"
      - "Serve assets from a public S3 website endpoint without a CDN"
    answer: 1
    explanation: |
      Fingerprinted filenames give instant, free updates, coexisting versions (rollback),
      and no origin stampede — the modern Rename Distribution. Wildcard invalidations are
      slow/costly and stampede the origin; zero TTL kills caching benefits; dropping the CDN
      loses edge performance.
    ref: "concepts.md#rename-distribution"

  - id: aws-cdp-static-content-and-upload-044
    difficulty: intermediate
    tags: [classic-vs-modern, private-distribution]
    question: |
      "Private Distribution is realized today by ___." Which best completes this?
    options:
      - "S3 presigned URLs (single object) or CloudFront signed URLs/cookies (through the CDN)"
      - "IAM users created per customer"
      - "A public bucket with a hard-to-guess prefix"
      - "Route 53 private hosted zones"
    answer: 0
    explanation: |
      Private Distribution maps to S3 presigned URLs for one-off objects and CloudFront
      signed URLs/cookies for CDN-served private content. Per-customer IAM users don't
      scale, obscurity isn't security, and private hosted zones are a DNS feature.
    ref: "concepts.md#private-distribution"

  - id: aws-cdp-static-content-and-upload-045
    difficulty: advanced
    tags: [selection, scenario, write-proxy, transfer-acceleration]
    question: |
      A media company uploads multi-gigabyte files from offices worldwide into a single
      us-east-1 bucket and wants faster uploads without building an upload-server fleet.
      What is the best first move?
    options:
      - "Build EC2 upload servers with TsunamiUDP in every region"
      - "Store files in DynamoDB instead of S3"
      - "Enable S3 Transfer Acceleration and use multipart upload"
      - "Serve the bucket through CloudFront"
    answer: 2
    explanation: |
      S3 Transfer Acceleration plus multipart upload is the managed replacement for the
      classic Write Proxy and needs no servers. EC2 upload fleets are exactly what you're
      avoiding; DynamoDB isn't for large blobs; CloudFront accelerates downloads, not
      uploads.
    ref: "concepts.md#write-proxy"

  - id: aws-cdp-static-content-and-upload-046
    difficulty: intermediate
    tags: [storage-index, source-of-truth, multi]
    type: multi
    question: |
      Which are sound practices for keeping a Storage Index consistent with S3? Select all
      that apply.
    options:
      - "Drive index updates from S3 event notifications rather than only app-side dual writes"
      - "Delete the S3 object whenever the index row is missing, to force consistency"
      - "Run periodic reconciliation jobs to detect drift"
      - "Treat S3 as the source of truth for whether an object exists"
    answers: [0, 2, 3]
    explanation: |
      Event-driven updates, reconciliation, and treating S3 as the existence source of
      truth all keep the index honest. Deleting S3 objects because an index row is missing
      would destroy real data over an index bug — the index is the derived copy, not S3.
    ref: "concepts.md#storage-index"

  - id: aws-cdp-static-content-and-upload-047
    difficulty: advanced
    tags: [direct-object-upload, write-proxy, contrast]
    question: |
      What is the fundamental architectural difference between Write Proxy and Direct
      Object Upload?
    options:
      - "Write Proxy is for downloads; Direct Object Upload is for uploads"
      - "Write Proxy routes bytes through an intermediary server before S3; Direct Object Upload sends bytes from the client straight to S3"
      - "Write Proxy uses CloudFront; Direct Object Upload uses Route 53"
      - "They are identical except Direct Object Upload requires FTP"
    answer: 1
    explanation: |
      Both are upload patterns, but Write Proxy interposes an upload server (to accelerate
      or mediate the transfer) while Direct Object Upload removes the server from the byte
      path entirely (client → S3). The CDN/DNS and FTP claims are wrong.
    ref: "concepts.md#direct-object-upload"

  - id: aws-cdp-static-content-and-upload-048
    difficulty: intermediate
    tags: [web-storage, direct-hosting, contrast]
    question: |
      What distinguishes Web Storage from Direct Hosting?
    options:
      - "Web Storage offloads large files to S3 while a web server still serves pages; Direct Hosting serves the entire site (including HTML) from S3"
      - "Web Storage serves HTML from S3; Direct Hosting only serves images"
      - "Web Storage requires CloudFront; Direct Hosting forbids it"
      - "They are the same pattern"
    answer: 0
    explanation: |
      Web Storage moves large static objects to S3 but a web server still generates/serves
      the pages; Direct Hosting eliminates the web server by serving the whole static site
      (HTML/CSS/JS) from S3. Neither mandates or forbids CloudFront by definition.
    ref: "concepts.md#direct-hosting"

  - id: aws-cdp-static-content-and-upload-049
    difficulty: advanced
    tags: [rename-distribution, invalidation, cost, multi]
    type: multi
    question: |
      Which statements about CloudFront invalidations (vs. renaming) are TRUE? Select all
      that apply.
    options:
      - "The first ~1,000 invalidation paths per month are free, then billed per path"
      - "Wildcard invalidations can be slow to propagate and stampede the origin"
      - "Invalidations let old and new versions coexist for instant rollback"
      - "Invalidations mutate content served at a fixed URL in place"
    answers: [0, 1, 3]
    explanation: |
      Invalidations are free up to a monthly threshold then billed per path, propagate
      slowly for wildcards (risking origin stampede), and operate on a fixed URL in place.
      Coexisting versions/instant rollback is a property of *renaming* (versioned keys), not
      invalidations.
    ref: "concepts.md#rename-distribution"

  - id: aws-cdp-static-content-and-upload-050
    difficulty: beginner
    tags: [direct-object-upload, benefit]
    question: |
      Per the catalog, a key benefit of Direct Object Upload is that it eliminates the labor
      and cost of what?
    options:
      - "Buying a CloudFront distribution"
      - "Preparing and running a dedicated EC2 instance for uploads"
      - "Creating DNS records"
      - "Encrypting objects at rest"
    answer: 1
    explanation: |
      By uploading directly to S3, you avoid provisioning/operating an EC2 upload server and
      you inherit S3's scalability for ingest. It doesn't relate to CloudFront cost, DNS, or
      at-rest encryption (which S3 does regardless).
    ref: "concepts.md#direct-object-upload"

  - id: aws-cdp-static-content-and-upload-051
    difficulty: advanced
    tags: [selection, static-vs-upload, multi]
    type: multi
    question: |
      Which of the following are patterns from the CDP "Upload to the cloud" category?
      Select all that apply.
    options: ["Cache Distribution", "Write Proxy", "Storage Index", "Direct Object Upload"]
    answers: [1, 2, 3]
    explanation: |
      Write Proxy, Storage Index, and Direct Object Upload are the three "Upload to the
      cloud" patterns. Cache Distribution belongs to the "Handle static content" category.
    ref: "concepts.md#write-proxy"

  - id: aws-cdp-static-content-and-upload-052
    difficulty: intermediate
    tags: [cache-distribution, staleness, mechanism]
    question: |
      Why does simply updating a file at the origin NOT immediately change what edge users
      receive under Cache Distribution?
    options:
      - "The origin file is read-only once cached"
      - "Edges keep serving the cached copy until its TTL expires"
      - "CloudFront requires a redeploy of the distribution for any change"
      - "S3 blocks overwrites of cached objects"
    answer: 1
    explanation: |
      Edge caches honor the object's TTL; until it expires (or you invalidate/rename), edges
      serve the old copy. Origin files aren't read-only, no distribution redeploy is needed,
      and S3 allows overwrites.
    ref: "concepts.md#cache-distribution"

  - id: aws-cdp-static-content-and-upload-053
    difficulty: advanced
    tags: [direct-object-upload, multipart, presigned, modern, multi]
    type: multi
    question: |
      For a browser-based Direct Object Upload of large files to S3, which are appropriate
      modern building blocks? Select all that apply.
    options:
      - "A backend endpoint that mints scoped presigned URLs"
      - "S3 multipart upload with presigned part URLs"
      - "Routing every byte through an EC2 upload proxy for validation"
      - "An S3 CORS configuration on the bucket"
    answers: [0, 1, 3]
    explanation: |
      A presigned-URL minting endpoint, multipart with presigned part URLs, and bucket CORS
      are the standard direct-upload stack. Routing every byte through an EC2 proxy is the
      Write Proxy approach that Direct Object Upload specifically avoids; validation is done
      post-upload via events instead.
    ref: "concepts.md#direct-object-upload"

  - id: aws-cdp-static-content-and-upload-054
    difficulty: beginner
    tags: [private-distribution, expiry]
    question: |
      A caution of the classic Private Distribution pattern is that a signed URL can stop
      working even while the user's session is still valid. Why?
    options:
      - "The user's IAM role is deleted automatically"
      - "The S3 object is moved to Glacier"
      - "The URL's own expiry time elapses independently of the login session"
      - "CloudFront rotates its domain name"
    answer: 2
    explanation: |
      The signed URL has its own time-to-live; once it expires the download fails even if
      the user is still authenticated. The catalog explicitly notes this. The other options
      are not how signed-URL expiry works.
    ref: "concepts.md#private-distribution"

  - id: aws-cdp-static-content-and-upload-055
    difficulty: intermediate
    tags: [web-storage, sync, benefit]
    question: |
      Besides reducing web-server network load, what other problem does Web Storage solve
      compared with copying large files onto many web servers?
    options:
      - "It eliminates the need to keep multiple copies of the files in sync across servers"
      - "It automatically transcodes video files"
      - "It provides SQL query access to the files"
      - "It signs every request for authentication"
    answer: 0
    explanation: |
      Centralizing objects in S3 removes the cost and effort of duplicating and
      synchronizing large files across a server fleet. It doesn't transcode, provide SQL, or
      inherently authenticate requests.
    ref: "concepts.md#web-storage"
