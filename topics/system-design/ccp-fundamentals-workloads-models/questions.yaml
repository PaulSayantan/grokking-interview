topic: 'Cloud Computing Fundamentals: Workloads & Service/Deployment Models'
domain: system-design
topic_slug: ccp-fundamentals-workloads-models
version: 1
questions:
  - id: ccp-fundamentals-workloads-models-001
    difficulty: beginner
    tags: [workload, static-workload, intent]
    question: |
      An internal reporting tool serves a fixed user base with a nearly flat CPU and request
      profile that stays within narrow bounds all year. Which workload pattern describes it?
    options: ["Unpredictable Workload", "Continuously Changing Workload", "Periodic Workload", "Static Workload"]
    answer: 3
    explanation: |
      A more-or-less flat utilization profile that stays within certain boundaries over time is the
      Static Workload. Because demand does not vary, the application benefits little from elastic
      pay-per-use pricing.
    ref: "concepts.md#static-workload"
  - id: ccp-fundamentals-workloads-models-002
    difficulty: intermediate
    tags: [static-workload, elasticity, cost]
    question: |
      Why does the Static Workload pattern say an application gains little from an elastic,
      pay-per-use cloud?
    options: ["Because static workloads cannot run on virtualized hardware", "Because the number of required resources is essentially constant, so there is no peak-to-average gap to harvest", "Because pay-per-use pricing is always more expensive than on-demand pricing", "Because elasticity only works for stateless applications"]
    answer: 1
    explanation: |
      Elasticity pays off by releasing resources when demand dips below peak. A flat curve has almost
      no gap between average and peak, so reserved or owned capacity sized to the constant demand is
      usually cheaper than paying an on-demand elastic premium.
    ref: "concepts.md#static-workload"
  - id: ccp-fundamentals-workloads-models-003
    difficulty: beginner
    tags: [periodic-workload, intent]
    question: |
      Payroll processing spikes on the last day of every month and is idle otherwise. Which workload
      pattern is this?
    options: ["Periodic Workload", "Unpredictable Workload", "Static Workload", "Once-in-a-lifetime Workload"]
    answer: 0
    explanation: |
      A utilization that peaks at recurring, well-defined intervals (monthly, weekly, daily) is the
      Periodic Workload. Monthly paychecks are one of the book's canonical examples.
    ref: "concepts.md#periodic-workload"
  - id: ccp-fundamentals-workloads-models-004
    difficulty: intermediate
    tags: [periodic-workload, scaling, cost]
    question: |
      What is the primary source of savings the Periodic Workload pattern targets?
    options: ["Compressing network traffic during peaks", "Running peaks on reserved instances bought years in advance", "Decommissioning resources during the non-peak periods between predictable peaks", "Using cheaper storage for archived data"]
    answer: 2
    explanation: |
      Because the peaks are predictable, you provision for the peak only during the peak and shut the
      resources down the rest of the time. The savings come precisely from decommissioning resources
      during non-peak times.
    ref: "concepts.md#periodic-workload"
  - id: ccp-fundamentals-workloads-models-005
    difficulty: intermediate
    tags: [periodic-workload, scheduled-scaling, modern]
    question: |
      Because a Periodic Workload's peaks are calendar-predictable, which scaling approach fits best?
    options: ["Reactive metric-based autoscaling triggered only after CPU crosses a threshold", "Scheduled scaling that pre-warms capacity ahead of the known peak time", "Manual one-off provisioning that is never torn down", "Static reserved capacity sized to the peak, kept running permanently"]
    answer: 1
    explanation: |
      Predictable timing lets you schedule capacity to come online before the spike (AWS scheduled
      actions, Azure schedule profiles, GCP scheduled autoscaling), avoiding the cold-start lag of
      purely reactive scaling and the waste of running peak capacity 24x7.
    ref: "concepts.md#periodic-workload"
  - id: ccp-fundamentals-workloads-models-006
    difficulty: intermediate
    tags: [once-in-a-lifetime-workload, intent]
    question: |
      A company plans a single one-day product launch expected to draw a huge, one-time traffic
      spike on a known date, after which traffic returns to its normal flat baseline. Which workload
      pattern is this?
    options: ["Periodic Workload", "Continuously Changing Workload", "Once-in-a-lifetime Workload", "Unpredictable Workload"]
    answer: 2
    explanation: |
      A single isolated peak within an otherwise static profile, whose timing is known in advance
      because it correlates to a specific event, is the Once-in-a-lifetime Workload — a special case
      of the Periodic Workload where the recurring peak recurs exactly once.
    ref: "concepts.md#once-in-a-lifetime-workload"
  - id: ccp-fundamentals-workloads-models-007
    difficulty: advanced
    tags: [once-in-a-lifetime-workload, provisioning]
    question: |
      Why does the Once-in-a-lifetime Workload pattern say provisioning and decommissioning can
      "often be realized as a manual task"?
    options: ["Because manual provisioning is always cheaper than automated provisioning", "Because the workload is unpredictable and cannot be automated", "Because clouds do not offer automation for single events", "Because the peak timing is known in advance and happens only once, so building automated scaling machinery is unnecessary overhead"]
    answer: 3
    explanation: |
      The event's timing is known and it happens a single time. Investing in reactive/automated
      autoscaling policies is overkill for a one-off, so acquiring the extra resources for the event
      and releasing them afterward can be a manual (or one-time IaC-driven) task.
    ref: "concepts.md#once-in-a-lifetime-workload"
  - id: ccp-fundamentals-workloads-models-008
    difficulty: advanced
    tags: [once-in-a-lifetime-workload, periodic-workload, distinction]
    question: |
      What distinguishes a Once-in-a-lifetime Workload from a Periodic Workload?
    options: ["Once-in-a-lifetime has a single non-repeating peak; Periodic peaks recur at intervals", "Once-in-a-lifetime requires reactive autoscaling; Periodic requires manual scaling", "Once-in-a-lifetime workloads are always larger in magnitude than periodic ones", "Once-in-a-lifetime peaks are unpredictable; Periodic peaks are predictable"]
    answer: 0
    explanation: |
      Both have predictable peaks. The difference is repetition: a Periodic Workload's peak recurs at
      regular intervals (worth automating with schedules), whereas the Once-in-a-lifetime peak occurs
      exactly once, so manual provisioning suffices.
    ref: "concepts.md#once-in-a-lifetime-workload"
  - id: ccp-fundamentals-workloads-models-009
    difficulty: beginner
    tags: [unpredictable-workload, intent]
    question: |
      A news site's traffic occasionally explodes with no warning when a story goes viral, then
      falls back, with no discernible schedule or trend. Which workload pattern is this?
    options: ["Periodic Workload", "Unpredictable Workload", "Static Workload", "Once-in-a-lifetime Workload"]
    answer: 1
    explanation: |
      Random, unforeseeable utilization with no calendar and no trend is the Unpredictable Workload.
      The book frames it as a generalization of the Periodic Workload: it requires elasticity but the
      peaks are not predictable.
    ref: "concepts.md#unpredictable-workload"
  - id: ccp-fundamentals-workloads-models-010
    difficulty: intermediate
    tags: [unpredictable-workload, autoscaling, solution]
    question: |
      What is the core of the Unpredictable Workload solution?
    options: ["Automate provisioning and decommissioning so resource count tracks live workload in near-real-time", "Buy reserved capacity sized to the highest historical peak and keep it running", "Manually scale the fleet when an engineer notices load rising", "Provision peak capacity in advance from a calendar schedule"]
    answer: 0
    explanation: |
      You cannot schedule for demand you cannot predict, so the resource count must be automated to
      align to the changing workload as it happens — reactive, metric-driven autoscaling (target
      tracking, queue-depth scaling, serverless concurrency).
    ref: "concepts.md#unpredictable-workload"
  - id: ccp-fundamentals-workloads-models-011
    difficulty: advanced
    tags: [unpredictable-workload, reaction-lag, tradeoff]
    question: |
      Reactive autoscaling for an Unpredictable Workload has a well-known drawback. What is it, and a
      common mitigation?
    options: ["It requires predicting demand a month ahead; mitigate with a calendar", "It only works for stateful services; mitigate by adding a database", "It cannot scale down; mitigate by rebooting nodes nightly", "It reacts only after load rises, causing brief under-provisioning; mitigate with headroom or an elastic queue to absorb the transient"]
    answer: 3
    explanation: |
      Reactive scaling responds after metrics cross a threshold, so warm-up/cold-start time can leave
      the system briefly under-provisioned during a sudden burst. Buffering with capacity headroom or
      a queue that levels the load absorbs the transient while new capacity spins up.
    ref: "concepts.md#unpredictable-workload"
  - id: ccp-fundamentals-workloads-models-012
    difficulty: beginner
    tags: [continuously-changing-workload, intent]
    question: |
      A successful startup sees steady month-over-month growth in users and resource demand with no
      return to baseline. Which workload pattern best fits?
    options: ["Periodic Workload", "Unpredictable Workload", "Continuously Changing Workload", "Static Workload"]
    answer: 2
    explanation: |
      A long-term monotonic trend of growth (or decline) in utilization is the Continuously Changing
      Workload. Unlike a spike that returns to baseline, the change is sustained over a long horizon.
    ref: "concepts.md#continuously-changing-workload"
  - id: ccp-fundamentals-workloads-models-013
    difficulty: intermediate
    tags: [continuously-changing-workload, solution]
    question: |
      What does the Continuously Changing Workload solution prescribe?
    options: ["Ignore the trend since it will eventually reverse", "Provision only during predictable calendar peaks", "Keep a fixed reserved fleet and never adjust it", "Provision or decommission resources at the same rate the workload changes"]
    answer: 3
    explanation: |
      The pattern exploits elasticity to add or remove resources at the same rate the workload trends,
      continuously right-sizing capacity so you neither run out of headroom during growth nor pay for
      idle capacity during decline.
    ref: "concepts.md#continuously-changing-workload"
  - id: ccp-fundamentals-workloads-models-014
    difficulty: advanced
    tags: [continuously-changing-workload, unpredictable-workload, distinction]
    question: |
      How does a Continuously Changing Workload differ from an Unpredictable Workload, and why does
      it matter for planning?
    options: ["Continuously Changing workloads never need elasticity", "There is no difference; both are random", "The trend direction is known and sustained, so you can plan procurement and progressively commit reserved capacity rather than only reacting", "Continuously Changing peaks are calendar-scheduled, unlike unpredictable ones"]
    answer: 2
    explanation: |
      Both need elasticity, but a continuous trend has a known, sustained direction. That lets you
      plan ahead — e.g. progressively buy reserved/committed capacity as growth proves out — whereas
      an unpredictable workload can only be handled reactively.
    ref: "concepts.md#continuously-changing-workload"
  - id: ccp-fundamentals-workloads-models-015
    difficulty: intermediate
    tags: [workload, distinction, static-workload]
    question: |
      Across the five workload patterns, which single factor most determines whether elastic
      pay-per-use hosting saves money?
    options: ["The size of the peak-to-average utilization gap (and how predictable it is)", "Whether the application is stateful or stateless", "The number of distinct microservices deployed", "The programming language of the application"]
    answer: 0
    explanation: |
      Elasticity harvests savings from the gap between peak and average demand. A large, variable gap
      (Periodic, Unpredictable, Continuously Changing) benefits greatly; a flat curve (Static) has
      almost no gap and benefits least.
    ref: "concepts.md#workload-patterns-overview"
  - id: ccp-fundamentals-workloads-models-016
    difficulty: advanced
    tags: [periodic-workload, unpredictable-workload, scenario]
    question: |
      An online store's traffic reliably surges every year on a fixed sale date, but is otherwise
      subject to random viral spikes throughout the year. How should you classify the two behaviors?
    options: ["Both are Once-in-a-lifetime Workloads", "The fixed annual sale surge is Periodic; the random spikes are Unpredictable", "Both are Static Workloads", "The fixed sale is Unpredictable; the viral spikes are Periodic"]
    answer: 1
    explanation: |
      A recurring, calendar-known peak (the annual sale) is a Periodic Workload; the random,
      unforeseeable spikes are an Unpredictable Workload. Real systems often overlay multiple workload
      shapes, and each is handled differently (scheduled vs reactive scaling).
    ref: "concepts.md#periodic-workload"
  - id: ccp-fundamentals-workloads-models-017
    difficulty: beginner
    tags: [iaas, service-model, intent]
    question: |
      A provider offers on-demand virtual servers, block storage, and virtual networks through a
      self-service interface, leaving the operating system and application entirely to the customer.
      Which service model is this?
    options: ["Platform as a Service (PaaS)", "Software as a Service (SaaS)", "Infrastructure as a Service (IaaS)", "Community Cloud"]
    answer: 2
    explanation: |
      Offering physical and virtual hardware (compute, storage, networking) provisioned and
      decommissioned quickly via self-service, with the customer managing everything above the
      hardware, is Infrastructure as a Service.
    ref: "concepts.md#infrastructure-as-a-service-iaas"
  - id: ccp-fundamentals-workloads-models-018
    difficulty: intermediate
    tags: [iaas, responsibility-split]
    question: |
      Under the IaaS model, which layers does the customer typically manage?
    options: ["The operating system, middleware, runtime, and application on top of provider hardware", "Only the physical facilities and networking hardware", "Nothing; the provider manages the whole stack", "Only configuration and their own data"]
    answer: 0
    explanation: |
      In IaaS the provider supplies and multiplexes the hardware (compute, storage, network) via
      virtualization; the customer manages everything above it — OS, middleware, runtime, and the app.
    ref: "concepts.md#infrastructure-as-a-service-iaas"
  - id: ccp-fundamentals-workloads-models-019
    difficulty: beginner
    tags: [paas, service-model, intent]
    question: |
      A team deploys only its application code onto a provider-managed runtime; the provider handles
      the OS, middleware, scaling, and failure resiliency. Which service model is this?
    options: ["Infrastructure as a Service (IaaS)", "Platform as a Service (PaaS)", "Software as a Service (SaaS)", "Private Cloud"]
    answer: 1
    explanation: |
      Platform as a Service delivers a managed execution environment (managed OS and middleware) and
      handles operational concerns like elastic scaling and failure resiliency, so the customer
      deploys only application code and data.
    ref: "concepts.md#platform-as-a-service-paas"
  - id: ccp-fundamentals-workloads-models-020
    difficulty: intermediate
    tags: [paas, problem, efficiency]
    question: |
      What inefficiency does the PaaS pattern specifically address relative to raw IaaS?
    options: ["Storage being too expensive for large datasets", "Networks being oversubscribed during peaks", "Applications running too slowly on virtual hardware", "Many customers each installing the same OS and middleware, causing redundant installations and inefficient cloud use"]
    answer: 3
    explanation: |
      If every customer provisions IaaS VMs and installs the same OS + middleware stack, you get many
      redundant installations and inefficient use of the cloud. PaaS provides one managed, shared
      execution environment instead, and operates it for everyone.
    ref: "concepts.md#platform-as-a-service-paas"
  - id: ccp-fundamentals-workloads-models-021
    difficulty: intermediate
    tags: [paas, iaas, distinction, modern]
    question: |
      Which pairing correctly maps a modern offering to its service model?
    options: ["All managed services are IaaS regardless of layer", "AWS EC2 with EBS is PaaS; Google App Engine is IaaS", "Azure App Service and Google Cloud Run are PaaS; AWS EC2 VMs are IaaS", "Salesforce is IaaS; AWS EC2 is SaaS"]
    answer: 2
    explanation: |
      Managed application-runtime platforms (Azure App Service, Cloud Run, Elastic Beanstalk, App
      Engine) are PaaS; raw virtual machines and block storage (EC2 + EBS, Azure VMs, GCE) are IaaS.
    ref: "concepts.md#platform-as-a-service-paas"
  - id: ccp-fundamentals-workloads-models-022
    difficulty: beginner
    tags: [saas, service-model, intent]
    question: |
      A company uses a complete CRM application entirely through its browser, installing and operating
      nothing. Which service model is this?
    options: ["Hybrid Cloud", "Infrastructure as a Service (IaaS)", "Platform as a Service (PaaS)", "Software as a Service (SaaS)"]
    answer: 3
    explanation: |
      Software as a Service offers a complete, finished application used on-demand via a self-service
      interface (usually a browser or API). The provider manages the entire stack; the customer
      manages only configuration and its own data.
    ref: "concepts.md#software-as-a-service-saas"
  - id: ccp-fundamentals-workloads-models-023
    difficulty: intermediate
    tags: [saas, problem, commodity]
    question: |
      Which situation does the SaaS pattern say it best addresses?
    options: ["Smaller enterprises lacking resources or expertise to build software, and commodity applications used across many companies", "Workloads requiring custom kernel modules and specialized hardware", "Applications that must never store any customer data", "Deep low-level tuning of the operating system kernel"]
    answer: 0
    explanation: |
      SaaS fits commodity capabilities (office suites, email, CRM, collaboration) and organizations
      without the resources or expertise to build and operate custom software — everyone re-building
      or self-hosting these commodities would be wasteful.
    ref: "concepts.md#software-as-a-service-saas"
  - id: ccp-fundamentals-workloads-models-024
    difficulty: intermediate
    tags: [service-model, responsibility-split, distinction]
    question: |
      Which statement correctly orders responsibility across IaaS, PaaS, and SaaS?
    options: ["SaaS gives the customer the most low-level control of the three", "As you move IaaS to PaaS to SaaS, the provider manages more layers and you manage fewer", "As you move IaaS to PaaS to SaaS, you manage more layers and the provider fewer", "All three models split responsibility identically"]
    answer: 1
    explanation: |
      IaaS to PaaS to SaaS is a progression where the provider absorbs more of the stack
      (hardware, then OS/middleware/scaling, then the whole application), trading your control for
      reduced operational burden.
    ref: "concepts.md#service-models-overview"
  - id: ccp-fundamentals-workloads-models-025
    difficulty: advanced
    tags: [service-model, tradeoff, scenario]
    question: |
      A startup wants to ship a custom web app fast, avoid patching servers, and let the platform
      handle scaling and resiliency — accepting some constraints on supported runtimes. Which service
      model best fits, and what is the main trade-off?
    options: ["IaaS; trade-off is that you must operate the OS yourself", "PaaS; trade-off is less low-level control and potential platform lock-in", "SaaS; trade-off is you cannot deploy your own application code", "Private Cloud; trade-off is high capex"]
    answer: 1
    explanation: |
      PaaS lets the team deploy only app code while the provider handles OS, scaling, and resiliency.
      The cost is reduced control and possible lock-in/runtime constraints — which the scenario
      explicitly accepts. Note SaaS would not let them deploy their own custom app.
    ref: "concepts.md#platform-as-a-service-paas"
  - id: ccp-fundamentals-workloads-models-026
    difficulty: advanced
    tags: [saas, paas, distinction]
    question: |
      What is the key distinction between PaaS and SaaS regarding whose application runs?
    options: ["PaaS delivers a finished app; SaaS hosts the customer's custom code", "Both host only the provider's application", "Both require the customer to manage the operating system", "PaaS hosts the customer's custom application; SaaS delivers the provider's finished application"]
    answer: 3
    explanation: |
      PaaS provides an execution environment for the customer's own custom applications, while SaaS
      delivers the provider's complete application that the customer merely uses and configures.
    ref: "concepts.md#software-as-a-service-saas"
  - id: ccp-fundamentals-workloads-models-027
    difficulty: beginner
    tags: [public-cloud, deployment-model, intent]
    question: |
      A provider serves cloud resources to a large, open group of unrelated customers over the
      internet, sharing infrastructure to lower per-customer cost. Which deployment model is this?
    options: ["Private Cloud", "Community Cloud", "Public Cloud", "Hybrid Cloud"]
    answer: 2
    explanation: |
      Delivering the cloud properties to a large customer group by sharing infrastructure across many
      tenants is the Public Cloud. Pooling many customers leverages economies of scale.
    ref: "concepts.md#public-cloud"
  - id: ccp-fundamentals-workloads-models-028
    difficulty: intermediate
    tags: [public-cloud, economies-of-scale]
    question: |
      Why does sharing infrastructure across many customers make Public Cloud economically efficient?
    options: ["Because one customer's peak often coincides with another's low period, smoothing aggregate demand and improving resource utilization", "Because public clouds never experience peaks", "Because customers are forbidden from scaling elastically", "Because each customer is billed a flat annual fee regardless of use"]
    answer: 0
    explanation: |
      Economies of scale come from statistical multiplexing: with many tenants, one customer's peak
      tends to coincide with others' troughs, so aggregate demand is smoother and pooled resources are
      used more efficiently — lowering per-customer cost.
    ref: "concepts.md#public-cloud"
  - id: ccp-fundamentals-workloads-models-029
    difficulty: beginner
    tags: [private-cloud, deployment-model, intent]
    question: |
      A bank requires a cloud environment accessible only by its own employees and applications to
      satisfy strict privacy and regulatory constraints. Which deployment model is this?
    options: ["Hybrid Cloud", "Public Cloud", "Community Cloud", "Private Cloud"]
    answer: 3
    explanation: |
      Delivering cloud properties in an environment with high privacy, security, and trust
      requirements, accessible only by a single company, is the Private Cloud.
    ref: "concepts.md#private-cloud"
  - id: ccp-fundamentals-workloads-models-030
    difficulty: advanced
    tags: [private-cloud, virtual-private-cloud, realizations]
    question: |
      The Private Cloud pattern describes several ways to realize it. Which is the "virtual Private
      Cloud" realization?
    options: ["A public provider dedicating an isolated portion of its infrastructure to a single customer", "Several companies pooling resources into a shared environment", "Running the cloud entirely in the company's own on-premises data center", "An external provider hosting infrastructure exclusively for one company (outsourced Private Cloud)"]
    answer: 0
    explanation: |
      A virtual Private Cloud is an isolated slice of a public provider's infrastructure dedicated to
      one customer (e.g. a VPC/VNet). The own-datacenter and outsourced options are the other two
      realizations; option 3 describes a Community Cloud.
    ref: "concepts.md#private-cloud"
  - id: ccp-fundamentals-workloads-models-031
    difficulty: intermediate
    tags: [private-cloud, public-cloud, tradeoff]
    question: |
      What does choosing a Private Cloud over a Public Cloud primarily trade away?
    options: ["Support for elastic scaling entirely", "Control and privacy over the environment", "Much of the economies of scale, often with more capex and operational load", "The ability to run any operating system"]
    answer: 2
    explanation: |
      Private Cloud maximizes control and privacy but gives up much of the multi-tenant economies of
      scale a Public Cloud enjoys, and often carries higher capex/operational burden.
    ref: "concepts.md#private-cloud"
  - id: ccp-fundamentals-workloads-models-032
    difficulty: beginner
    tags: [community-cloud, deployment-model, intent]
    question: |
      Several hospitals that contractually trust each other want a shared, controlled cloud
      environment for joint patient-research data, closed to the general public. Which deployment
      model fits?
    options: ["Private Cloud", "Community Cloud", "Hybrid Cloud", "Public Cloud"]
    answer: 1
    explanation: |
      Delivering cloud properties exclusively to a defined group of customers forming a community of
      trust, in a controlled environment accessible only by that community, is the Community Cloud.
    ref: "concepts.md#community-cloud"
  - id: ccp-fundamentals-workloads-models-033
    difficulty: advanced
    tags: [community-cloud, public-cloud, private-cloud, spectrum]
    question: |
      On the "who may share" spectrum, where does Community Cloud sit and what does it balance?
    options: ["It is unrelated to the sharing spectrum", "Between Public (anyone) and Private (one org); it balances shared cost across the group against a restricted trust boundary", "Below Private Cloud; it is accessible by only one company", "Above Public Cloud; it is open to absolutely anyone"]
    answer: 1
    explanation: |
      Community Cloud sits between Public (open to anyone) and Private (one company): a defined trust
      group shares it, so the cost is spread across partners while the trust boundary stays
      restricted — cheaper than each running a Private Cloud, more controlled than Public.
    ref: "concepts.md#community-cloud"
  - id: ccp-fundamentals-workloads-models-034
    difficulty: intermediate
    tags: [community-cloud, modern]
    question: |
      Which modern offering best illustrates the Community Cloud pattern?
    options: ["A public marketplace SaaS product open to anyone", "A personal AWS account created with a credit card", "AWS GovCloud or Azure Government, serving a defined group of government/regulated customers", "A single company's on-premises VMware cluster"]
    answer: 2
    explanation: |
      Government and regulated community clouds (AWS GovCloud, Azure Government, Google Assured
      Workloads) and industry consortium clouds serve a bounded trust group with common requirements,
      which is exactly the Community Cloud pattern.
    ref: "concepts.md#community-cloud"
  - id: ccp-fundamentals-workloads-models-035
    difficulty: beginner
    tags: [hybrid-cloud, deployment-model, intent]
    question: |
      An enterprise keeps regulated data in a Private Cloud, bursts elastic peaks to a Public Cloud,
      and still runs legacy systems in a static data center — all interconnected. Which deployment
      model is this?
    options: ["Hybrid Cloud", "Public Cloud", "Community Cloud", "Private Cloud"]
    answer: 0
    explanation: |
      Integrating Private, Public, and Community Clouds plus static data centers into one
      interconnected hosting environment, placing each application where it fits best, is the Hybrid
      Cloud.
    ref: "concepts.md#hybrid-cloud"
  - id: ccp-fundamentals-workloads-models-036
    difficulty: intermediate
    tags: [hybrid-cloud, problem]
    question: |
      What problem does the Hybrid Cloud pattern address?
    options: ["The need to eliminate all on-premises hardware immediately", "The desire to use only a single public cloud provider", "A single application that must run on exactly one server", "A business with many applications whose versatile requirements make different deployment models suitable for different apps"]
    answer: 3
    explanation: |
      Businesses run many applications with versatile requirements, so no single deployment model
      suits all of them. Hybrid Cloud integrates multiple environments so each app can be placed where
      it fits best while staying interconnected.
    ref: "concepts.md#hybrid-cloud"
  - id: ccp-fundamentals-workloads-models-037
    difficulty: advanced
    tags: [hybrid-cloud, misconception]
    question: |
      A candidate says "we have some VMs on-prem and some in a public cloud with no connection between
      them — that's Hybrid Cloud." Why is this not quite right?
    options: ["Hybrid Cloud requires at least three public providers", "The defining feature of Hybrid Cloud is integration of the environments into one interconnected fabric with best-fit placement, not merely using two disconnected environments", "Hybrid Cloud forbids using any on-premises hardware", "Hybrid Cloud must include a Community Cloud"]
    answer: 1
    explanation: |
      Hybrid Cloud is the composition and integration of environments (Private, Public, Community,
      static data centers) into one connected hosting environment — enabling patterns like cloud
      bursting. Two silos with no interconnection is not the pattern.
    ref: "concepts.md#hybrid-cloud"
  - id: ccp-fundamentals-workloads-models-038
    difficulty: intermediate
    tags: [hybrid-cloud, tradeoff]
    question: |
      What is the principal cost of adopting a Hybrid Cloud?
    options: ["You are locked into a single provider forever", "You cannot host any sensitive data", "You lose all ability to scale elastically", "Integration complexity: consistent identity, networking, security, and data governance across heterogeneous environments"]
    answer: 3
    explanation: |
      Hybrid's benefit is best-fit placement per application and a migration bridge for legacy, but
      the price is the complexity of integrating heterogeneous environments with consistent identity,
      networking, security, and data governance.
    ref: "concepts.md#hybrid-cloud"
  - id: ccp-fundamentals-workloads-models-039
    difficulty: advanced
    tags: [deployment-model, scenario, selection]
    question: |
      A regulated firm must keep customer PII in an environment closed to outsiders, but wants to run
      its public marketing website with maximum elasticity and lowest cost. What is the best overall
      deployment approach?
    options: ["Put everything in a single Public Cloud", "Put everything in a single Private Cloud", "Use a Hybrid Cloud: Private Cloud for the PII workload, Public Cloud for the elastic website, integrated together", "Use a Community Cloud shared with unrelated companies"]
    answer: 2
    explanation: |
      Different apps have different requirements: PII demands the privacy of a Private Cloud, the
      marketing site wants Public Cloud elasticity/cost. Integrating both is the Hybrid Cloud, which
      lets each workload sit where it best fits.
    ref: "concepts.md#hybrid-cloud"
  - id: ccp-fundamentals-workloads-models-040
    difficulty: intermediate
    tags: [iaas, workload, relationship]
    question: |
      The IaaS pattern is described as especially relevant to which workloads?
    options: ["Variable workloads such as Periodic (recurring peaks) and Once-in-a-lifetime (a single dramatic spike) that need flexible provisioning", "Workloads that never change and never scale", "Only SaaS-delivered commodity applications", "Only Static Workloads with flat demand"]
    answer: 0
    explanation: |
      IaaS provides hardware that can be provisioned and decommissioned quickly, which is exactly what
      variable workloads (Periodic, Once-in-a-lifetime, and other elastic workloads) need. A purely
      Static Workload benefits least from elasticity.
    ref: "concepts.md#infrastructure-as-a-service-iaas"
  - id: ccp-fundamentals-workloads-models-041
    difficulty: advanced
    tags: [service-model, deployment-model, orthogonality]
    question: |
      How do the service models (IaaS/PaaS/SaaS) relate to the deployment models (Public/Private/
      Community/Hybrid)?
    options: ["Service models only exist in Public Clouds", "Deployment models only apply to SaaS", "They are the same taxonomy under different names", "They are largely orthogonal axes: a service model can be delivered in any deployment model (e.g. PaaS in a Private Cloud, IaaS in a Public Cloud)"]
    answer: 3
    explanation: |
      Service models describe how much of the stack the provider manages; deployment models describe
      who may share the cloud and where it lives. They are largely orthogonal — you can, for example,
      run PaaS in a Private Cloud or IaaS in a Public Cloud.
    ref: "concepts.md#deployment-models-overview"
  - id: ccp-fundamentals-workloads-models-042
    difficulty: intermediate
    tags: [deployment-model, cloud-properties]
    question: |
      All four deployment-model patterns aim to deliver the same five essential cloud properties. Which
      set is correct?
    options: ["On-demand self-service, broad network access, resource pooling, rapid elasticity, and measured (pay-per-use) service", "Redundancy, monitoring, logging, alerting, and backup", "CPU, memory, storage, network, and GPU", "Encryption, compression, replication, sharding, and caching"]
    answer: 0
    explanation: |
      The deployment patterns' intent questions all reference the same NIST-aligned cloud properties:
      on-demand self-service, broad network access, resource pooling, rapid elasticity, and
      measured/pay-per-use service — differing only in the audience they serve.
    ref: "concepts.md#deployment-models-overview"
  - id: ccp-fundamentals-workloads-models-043
    difficulty: advanced
    tags: [static-workload, scenario, cost]
    question: |
      An interviewer asks: "When would you advise a client that moving to on-demand elastic cloud
      pricing would NOT save money?" Which answer best applies the workload patterns?
    options: ["When the workload is Unpredictable", "When the workload is a Static Workload with a flat curve and no peak-to-average gap, so reserved or owned capacity is usually cheaper", "When the workload is Continuously Changing", "When the workload is Periodic"]
    answer: 1
    explanation: |
      A Static Workload's flat curve gives elasticity almost nothing to harvest, so paying an
      on-demand premium is wasteful; reserved/committed or owned capacity sized to the steady demand
      is typically cheaper.
    ref: "concepts.md#static-workload"
  - id: ccp-fundamentals-workloads-models-044
    difficulty: intermediate
    tags: [unpredictable-workload, modern, queue]
    question: |
      Which modern mechanism most directly embodies handling an Unpredictable Workload by letting
      resource count track live demand?
    options: ["A manually edited capacity spreadsheet", "A fixed-size reserved-instance fleet bought annually", "Target-tracking/step autoscaling or serverless per-request concurrency scaling on live metrics", "A nightly cron job that resizes the fleet once per day"]
    answer: 2
    explanation: |
      Unpredictable demand requires automation that reacts to live signals: target-tracking/step
      scaling, queue-depth scaling, or serverless concurrency that scales per request — all align
      resource count to workload in near-real-time.
    ref: "concepts.md#unpredictable-workload"
  - id: ccp-fundamentals-workloads-models-045
    difficulty: advanced
    tags: [continuously-changing-workload, modern, planning]
    question: |
      For a Continuously Changing Workload trending steadily upward, which combination best matches
      the pattern's guidance?
    options: ["A single fixed reserved fleet sized to today's demand, left unchanged", "Manual one-off provisioning for a single event", "Only reactive autoscaling, never any capacity commitment", "Predictive scaling plus continuous right-sizing, and progressively committing reserved capacity as the growth trend proves out"]
    answer: 3
    explanation: |
      Because the trend direction is known and sustained, you can both track it (predictive scaling,
      right-sizing recommendations) and plan ahead by progressively buying reserved/committed capacity
      as growth is confirmed — rather than only reacting.
    ref: "concepts.md#continuously-changing-workload"
  - id: ccp-fundamentals-workloads-models-046
    difficulty: intermediate
    tags: [saas, tradeoff]
    question: |
      What is the principal trade-off of choosing SaaS for a capability?
    options: ["You must operate the OS and middleware yourself", "Least control and customization, plus data-residency and vendor-dependence concerns, in exchange for zero infrastructure/operations burden", "You must write and deploy the application code", "It cannot be accessed over a network"]
    answer: 1
    explanation: |
      SaaS gives the fastest time-to-value and no infra/ops burden, but the customer has the least
      control and customization and must weigh data-residency and vendor-dependence risks. It suits
      commodity capabilities where a bespoke build adds no differentiation.
    ref: "concepts.md#software-as-a-service-saas"
  - id: ccp-fundamentals-workloads-models-047
    difficulty: advanced
    tags: [iaas, tradeoff, scenario]
    question: |
      A team must lift-and-shift a legacy application that needs a specific kernel version and
      low-level network control, and is willing to own OS patching and scaling. Which service model
      fits and why?
    options: ["SaaS, because it removes all operational burden", "PaaS, because the platform constraints match the legacy app", "IaaS, because it gives maximum control (any OS, low-level networking) at the cost of maximum operational responsibility", "Community Cloud, because the app is shared"]
    answer: 2
    explanation: |
      IaaS provides raw hardware and the freedom to run any OS and configure low-level networking,
      which lift-and-shift of a constrained legacy app needs. The trade-off — owning OS patching and
      scaling — is explicitly accepted here. PaaS/SaaS would impose platform constraints.
    ref: "concepts.md#infrastructure-as-a-service-iaas"
  - id: ccp-fundamentals-workloads-models-048
    difficulty: beginner
    tags: [deployment-model, sharing-spectrum]
    question: |
      Ordering the three "pure" deployment models by how widely the cloud may be shared, from most
      open to most restricted, gives which sequence?
    options: ["Public, Community, Private", "Community, Public, Private", "Public, Private, Community", "Private, Community, Public"]
    answer: 0
    explanation: |
      By "who may share": Public (open to anyone) is most open, Community (a defined trust group) is in
      the middle, and Private (a single organization) is most restricted. Hybrid is not on this line —
      it composes the others.
    ref: "concepts.md#deployment-models-overview"
  - id: ccp-fundamentals-workloads-models-049
    difficulty: advanced
    tags: [workload, scenario, selection]
    question: |
      A ticketing platform expects one enormous, pre-announced on-sale moment for a stadium tour,
      with a known date and time, and normal flat traffic before and after. Which workload pattern is
      it, and what provisioning approach does the pattern endorse?
    options: ["Continuously Changing Workload; commit reserved capacity for long-term growth", "Static Workload; no extra capacity is needed", "Unpredictable Workload; fully automated reactive autoscaling is mandatory", "Once-in-a-lifetime Workload; because timing is known and it happens once, a manual or one-time IaC-driven provisioning of the surge capacity is sufficient"]
    answer: 3
    explanation: |
      A single pre-announced peak over an otherwise flat profile is the Once-in-a-lifetime Workload.
      Because the timing is known and non-repeating, provisioning the surge capacity as a manual or
      one-off (IaC-driven) task and releasing it afterward is sufficient — no need for standing
      autoscaling machinery.
    ref: "concepts.md#once-in-a-lifetime-workload"
  - id: ccp-fundamentals-workloads-models-050
    difficulty: advanced
    tags: [community-cloud, private-cloud, distinction, scenario]
    question: |
      Two competing banks and a regulator want to share a fraud-detection data set in a controlled
      environment none of them individually owns, closed to the public. Which pattern fits, and why
      not Private Cloud?
    options: ["Hybrid Cloud; because two environments are involved", "Public Cloud; because it is cheapest", "Community Cloud; the trust boundary spans a defined multi-organization group, whereas a Private Cloud is scoped to a single company", "Private Cloud; because the data is sensitive"]
    answer: 2
    explanation: |
      Multiple organizations forming a community of trust sharing sensitive data in a controlled,
      access-restricted environment is the Community Cloud. A Private Cloud is accessible only by a
      single company's employees and applications, so it cannot span the multi-party trust group.
    ref: "concepts.md#community-cloud"
  - id: ccp-fundamentals-workloads-models-051
    difficulty: intermediate
    tags: [periodic-workload, once-in-a-lifetime-workload, continuously-changing-workload, distinction]
    question: |
      Which statement correctly contrasts three variable workload patterns?
    options: ["Periodic peaks recur at intervals; Once-in-a-lifetime peaks once; Continuously Changing trends monotonically without returning to baseline", "All three are random and unpredictable", "Periodic never returns to baseline; Continuously Changing repeats on a schedule", "Once-in-a-lifetime trends steadily upward forever"]
    answer: 0
    explanation: |
      Periodic = repeating scheduled peaks that return to baseline; Once-in-a-lifetime = a single
      non-repeating peak; Continuously Changing = a sustained monotonic trend (growth or decline) that
      does not return to baseline. Distinguishing them drives the right scaling strategy.
    ref: "concepts.md#continuously-changing-workload"
  - id: ccp-fundamentals-workloads-models-052
    difficulty: intermediate
    tags: [public-cloud, private-cloud, modern]
    question: |
      Which mapping of modern realizations to deployment models is correct?
    options: ["The public regions of AWS/Azure/GCP are Private Clouds; AWS Outposts is a Public Cloud", "The public regions of AWS/Azure/GCP are Public Clouds; on-prem VMware/OpenStack or dedicated single-tenant offerings realize Private Cloud", "AWS GovCloud is a Public Cloud open to anyone", "A single-company on-prem data center is a Community Cloud"]
    answer: 1
    explanation: |
      Public provider regions anyone can self-serve are Public Clouds; on-prem private stacks
      (VMware/OpenStack) and dedicated single-tenant offerings (Dedicated Hosts/Outposts, Azure Stack,
      sole-tenant nodes) or an isolated VPC realize the Private Cloud.
    ref: "concepts.md#public-cloud"
  - id: ccp-fundamentals-workloads-models-053
    difficulty: expert
    tags: [workload, service-model, integration, scenario]
    question: |
      A SaaS vendor hosts a multi-tenant app whose aggregate traffic grows steadily year over year
      while also spiking randomly during marketing events. From the vendor's engineering standpoint,
      which combination of patterns most accurately describes what they must handle?
    options: ["Only Static Workload on a Private Cloud", "A Continuously Changing Workload (long-term growth) overlaid with an Unpredictable Workload (random spikes), delivering SaaS typically on Public-Cloud IaaS/PaaS", "A Periodic Workload on a Community Cloud delivered as IaaS only", "A Once-in-a-lifetime Workload delivered as PaaS on a Private Cloud"]
    answer: 1
    explanation: |
      The sustained year-over-year growth is a Continuously Changing Workload; the random marketing
      spikes are an Unpredictable Workload — real systems overlay shapes. The vendor delivers SaaS to
      customers, itself typically built on Public-Cloud IaaS/PaaS. This shows how workload, service,
      and deployment patterns compose.
    ref: "concepts.md#workload-patterns-overview"
  - id: ccp-fundamentals-workloads-models-054
    difficulty: intermediate
    tags: [paas, tradeoff, lock-in]
    question: |
      Compared with IaaS, what does PaaS gain and give up?
    options: ["Gains the ability to run the provider's finished application; gives up its own code", "Gains nothing; it is identical to IaaS", "Gains low-level OS control; gives up elasticity", "Gains reduced operational burden (no OS patching, provider-handled scaling/resiliency); gives up low-level control and risks platform lock-in"]
    answer: 3
    explanation: |
      PaaS sheds operational burden — the provider manages the OS/middleware and handles scaling and
      resiliency — letting teams focus on app code. The trade-off is reduced low-level control and
      potential lock-in and runtime constraints.
    ref: "concepts.md#platform-as-a-service-paas"
  - id: ccp-fundamentals-workloads-models-055
    difficulty: advanced
    tags: [hybrid-cloud, cloud-bursting, modern]
    question: |
      "Cloud bursting" — running steady baseline load in a private environment and overflowing peaks
      to a public cloud — is a concrete realization of which pattern?
    options: ["Hybrid Cloud", "Static Workload", "Community Cloud", "Software as a Service"]
    answer: 0
    explanation: |
      Cloud bursting integrates a private environment (for baseline/sensitive load) with a public
      cloud (for elastic peaks) into one interconnected fabric — precisely the Hybrid Cloud pattern,
      which places each portion of the workload where it fits best.
    ref: "concepts.md#hybrid-cloud"
