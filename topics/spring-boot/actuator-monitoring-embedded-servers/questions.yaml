topic: "Actuator, Monitoring & Embedded Servers"
domain: spring-boot
topic_slug: actuator-monitoring-embedded-servers
version: 1
questions:
  - id: actuator-monitoring-embedded-servers-001
    difficulty: beginner
    tags: [actuator, setup]
    question: |
      What is the primary purpose of the Spring Boot Actuator module?
    options:
      - "To add production-ready features such as health checks, metrics, and management endpoints"
      - "To replace the embedded servlet container with an external application server"
      - "To compile the application ahead-of-time into a native image"
      - "To generate REST controllers automatically from JPA entities"
    answer: 0
    explanation: |
      spring-boot-starter-actuator adds production-ready observability and management features
      (health, metrics, info, loggers, thread dumps, etc.) exposed over HTTP or JMX with minimal code.
    ref: "concepts.md#actuator-purpose-and-setup"

  - id: actuator-monitoring-embedded-servers-002
    difficulty: beginner
    tags: [actuator, dependency]
    question: |
      Which dependency do you add to enable Actuator?
    options:
      - "spring-boot-starter-web"
      - "spring-boot-starter-actuator"
      - "spring-boot-starter-management"
      - "micrometer-core"
    answer: 1
    explanation: |
      The starter is spring-boot-starter-actuator. Micrometer is pulled in transitively for metrics,
      but the actuator features themselves come from the actuator starter.
    ref: "concepts.md#actuator-purpose-and-setup"

  - id: actuator-monitoring-embedded-servers-003
    difficulty: beginner
    tags: [endpoints, base-path]
    question: |
      By default, under what base path are Actuator HTTP endpoints exposed?
    options:
      - "/management"
      - "/admin"
      - "/actuator"
      - "/monitor"
    answer: 2
    explanation: |
      Endpoints default to the /actuator base path (e.g. /actuator/health). It is configurable via
      management.endpoints.web.base-path.
    ref: "concepts.md#key-endpoints-overview"

  - id: actuator-monitoring-embedded-servers-004
    difficulty: beginner
    tags: [endpoints, health, exposure]
    question: |
      In Spring Boot 3.x, which Actuator endpoint is exposed over HTTP by default (without extra config)?
    options:
      - "/actuator/metrics"
      - "/actuator/env"
      - "/actuator/beans"
      - "/actuator/health"
    answer: 3
    explanation: |
      Only health is web-exposed by default. All other endpoints must be added to
      management.endpoints.web.exposure.include.
    ref: "concepts.md#key-endpoints-overview"

  - id: actuator-monitoring-embedded-servers-005
    difficulty: intermediate
    tags: [endpoints, metrics, prometheus]
    question: |
      A developer configures Prometheus to scrape /actuator/metrics and gets JSON with a list of names
      instead of Prometheus text format. What is the correct explanation and fix?
    options:
      - "/actuator/metrics returns Micrometer's JSON navigation view; Prometheus must scrape /actuator/prometheus (with micrometer-registry-prometheus on the classpath)"
      - "The metrics endpoint must be enabled with management.endpoint.metrics.prometheus=true"
      - "You must switch the meter registry to the JMX registry to get Prometheus output"
      - "Prometheus format is only produced by /actuator/metrics when Accept: text/plain is sent; add that header"
    answer: 0
    explanation: |
      /actuator/metrics is a JSON navigation endpoint (names, then /metrics/{name} to drill in).
      Prometheus scrapes the separate /actuator/prometheus endpoint, which appears only when
      micrometer-registry-prometheus is present.
    ref: "concepts.md#key-endpoints-overview"

  - id: actuator-monitoring-embedded-servers-006
    difficulty: beginner
    tags: [endpoints, shutdown]
    question: |
      Which statement about the /actuator/shutdown endpoint is correct?
    options:
      - "It is enabled and web-exposed by default"
      - "It is disabled by default and must be explicitly enabled and exposed"
      - "It performs graceful request draining automatically on every deploy"
      - "It is a GET endpoint that returns the shutdown schedule"
    answer: 1
    explanation: |
      shutdown is disabled by default. You must set management.endpoint.shutdown.enabled=true AND expose
      it. It is a POST (write) operation and is rarely enabled in production.
    ref: "concepts.md#exposing-and-securing-endpoints"

  - id: actuator-monitoring-embedded-servers-007
    difficulty: intermediate
    tags: [health, show-details]
    question: |
      With default settings, /actuator/health only shows the aggregate status. Which property makes it
      always show per-component details?
    options:
      - "management.endpoints.health.verbose=true"
      - "management.endpoint.health.details=true"
      - "management.endpoint.health.show-details=always"
      - "management.health.show=full"
    answer: 2
    explanation: |
      management.endpoint.health.show-details accepts never | when-authorized | always. The default is
      never. Setting it to always reveals component details to everyone.
    ref: "concepts.md#health-endpoint-and-health-details"

  - id: actuator-monitoring-embedded-servers-008
    difficulty: advanced
    tags: [health, status-aggregation]
    question: |
      Given indicators reporting UP, UP, and OUT_OF_SERVICE, what overall status does the default
      StatusAggregator report and what HTTP status maps to it?
    options:
      - "UNKNOWN, mapped to HTTP 200"
      - "DOWN, mapped to HTTP 500"
      - "UP, mapped to HTTP 200"
      - "OUT_OF_SERVICE, mapped to HTTP 503"
    answer: 3
    explanation: |
      Default severity order is DOWN > OUT_OF_SERVICE > UP > UNKNOWN, so the worst (OUT_OF_SERVICE) wins.
      The default HttpCodeStatusMapper maps both DOWN and OUT_OF_SERVICE to HTTP 503.
    ref: "concepts.md#health-endpoint-and-health-details"

  - id: actuator-monitoring-embedded-servers-009
    difficulty: intermediate
    tags: [health, custom-indicator]
    question: |
      You register a @Component named DownstreamHealthIndicator implementing HealthIndicator. Under what
      key does it appear in /actuator/health components?
    options:
      - "downstream"
      - "health.downstream"
      - "DownstreamHealthIndicator"
      - "downstreamHealthIndicator"
    answer: 0
    explanation: |
      The component key is the bean name with the HealthIndicator suffix removed and first letter
      lowercased, i.e. "downstream".
    ref: "concepts.md#custom-health-indicators"

  - id: actuator-monitoring-embedded-servers-010
    difficulty: intermediate
    tags: [health, reactive]
    question: |
      In a reactive (WebFlux) application, which interface should a custom health check implement to
      remain non-blocking?
    options:
      - "HealthIndicator returning Health"
      - "ReactiveHealthIndicator returning Mono<Health>"
      - "AsyncHealthContributor returning Future<Health>"
      - "FluxHealthIndicator returning Flux<Health>"
    answer: 1
    explanation: |
      ReactiveHealthIndicator.health() returns Mono<Health>, keeping the check non-blocking on the event
      loop. Regular HealthIndicator would block a reactor thread.
    ref: "concepts.md#custom-health-indicators"

  - id: actuator-monitoring-embedded-servers-011
    difficulty: advanced
    tags: [health, defaults]
    question: |
      What does setting management.health.defaults.enabled=false do?
    options:
      - "Forces the overall status to always be UP"
      - "Disables the /health endpoint entirely"
      - "Disables all auto-configured health indicators (you keep only ones you define)"
      - "Hides health details from unauthenticated users"
    answer: 2
    explanation: |
      It turns off Spring Boot's auto-configured indicators (db, diskSpace, redis, etc.). The endpoint
      still works; only default contributors are disabled. Individual ones can be toggled via
      management.health.<name>.enabled.
    ref: "concepts.md#custom-health-indicators"

  - id: actuator-monitoring-embedded-servers-012
    difficulty: beginner
    tags: [probes, kubernetes]
    question: |
      Which two Kubernetes probe concepts does Spring Boot map to availability state?
    options:
      - "warmup and cooldown"
      - "ping and echo"
      - "startup and shutdown"
      - "liveness and readiness"
    answer: 3
    explanation: |
      Liveness (should the pod be restarted?) maps to LivenessState, and readiness (can it receive
      traffic?) maps to ReadinessState, exposed at /actuator/health/liveness and /readiness.
    ref: "concepts.md#liveness-and-readiness-probes"

  - id: actuator-monitoring-embedded-servers-013
    difficulty: advanced
    tags: [probes, best-practice]
    question: |
      Why should a liveness probe generally NOT check external dependencies like the database?
    options:
      - "Because a transient DB outage would then mark the app BROKEN and cause Kubernetes to restart pods, which does not fix an external outage"
      - "Because the database check belongs only in the /info endpoint"
      - "Because liveness probes run before the Spring context is initialized"
      - "Because liveness probes cannot make network calls in Kubernetes"
    answer: 0
    explanation: |
      Liveness failure triggers a pod restart. If liveness depended on the DB, a DB outage would restart
      the whole fleet without fixing anything. Readiness (which stops traffic) is where external checks belong.
    ref: "concepts.md#liveness-and-readiness-probes"

  - id: actuator-monitoring-embedded-servers-014
    difficulty: intermediate
    tags: [probes, enable]
    question: |
      Besides auto-detection on Kubernetes, which property explicitly enables the liveness/readiness probe
      health groups?
    options:
      - "management.health.k8s.enabled=true"
      - "management.endpoint.health.probes.enabled=true"
      - "management.kubernetes.probes=true"
      - "spring.probes.enabled=true"
    answer: 1
    explanation: |
      management.endpoint.health.probes.enabled=true forces the liveness and readiness groups on even when
      not running on Kubernetes.
    ref: "concepts.md#liveness-and-readiness-probes"

  - id: actuator-monitoring-embedded-servers-015
    difficulty: advanced
    tags: [probes, availability]
    question: |
      How do you programmatically flip an app to refuse traffic (readiness) at runtime?
    options:
      - "Throw a HealthCheckException from a controller"
      - "Call ApplicationContext.stop()"
      - "Publish an AvailabilityChangeEvent with ReadinessState.REFUSING_TRAFFIC"
      - "Set the system property readiness.state=refusing"
    answer: 2
    explanation: |
      AvailabilityChangeEvent.publish(publisher, this, ReadinessState.REFUSING_TRAFFIC) updates readiness,
      causing /actuator/health/readiness to report OUT_OF_SERVICE so the load balancer drains the pod.
    ref: "concepts.md#liveness-and-readiness-probes"

  - id: actuator-monitoring-embedded-servers-016
    difficulty: beginner
    tags: [exposure, config]
    question: |
      Which property exposes all Actuator endpoints over HTTP (not recommended for production)?
    options:
      - "management.endpoints.enabled=all"
      - "management.expose.all=true"
      - "actuator.endpoints=open"
      - "management.endpoints.web.exposure.include=*"
    answer: 3
    explanation: |
      Setting management.endpoints.web.exposure.include=* exposes every endpoint. This is fine in dev but a
      security risk in production.
    ref: "concepts.md#exposing-and-securing-endpoints"

  - id: actuator-monitoring-embedded-servers-017
    difficulty: intermediate
    tags: [exposure, include-exclude]
    question: |
      If include=* and exclude=env,beans are both set, what happens to the env endpoint?
    options:
      - "It is NOT exposed because exclude takes precedence over include"
      - "Configuration is invalid and startup fails"
      - "It is exposed only over JMX but not HTTP"
      - "It is exposed because include=* takes priority"
    answer: 0
    explanation: |
      exclude always wins over include. So env and beans are hidden while everything else is exposed.
    ref: "concepts.md#exposing-and-securing-endpoints"

  - id: actuator-monitoring-embedded-servers-018
    difficulty: intermediate
    tags: [management-port, security]
    question: |
      Which property runs Actuator endpoints on a different network port from the main application?
    options:
      - "management.endpoints.web.base-path=9090"
      - "management.server.port=9090"
      - "server.actuator.port=9090"
      - "management.web.port=9090"
    answer: 1
    explanation: |
      management.server.port assigns a separate port to the management server. Combined with
      management.server.address you can bind it to loopback only, a common hardening technique.
    ref: "concepts.md#exposing-and-securing-endpoints"

  - id: actuator-monitoring-embedded-servers-019
    difficulty: advanced
    tags: [security, spring-security]
    question: |
      Using Spring Security, which construct matches ALL actuator endpoints regardless of the configured
      base path?
    options:
      - "SecurityMatcher.actuator()"
      - "requestMatchers(\"/actuator/**\")"
      - "EndpointRequest.toAnyEndpoint()"
      - "AntPathRequestMatcher.antMatcher(\"/manage/*\")"
    answer: 2
    explanation: |
      EndpointRequest.toAnyEndpoint() is base-path-aware, so it keeps matching even if you change
      management.endpoints.web.base-path. A hardcoded /actuator/** would break if the base path changes.
    ref: "concepts.md#exposing-and-securing-endpoints"

  - id: actuator-monitoring-embedded-servers-020
    difficulty: advanced
    tags: [security, sanitization]
    question: |
      In Spring Boot 3.x, how are sensitive values (passwords, keys, tokens) handled in /actuator/env and
      /actuator/configprops by default, and how is masking controlled?
    options:
      - "The whole endpoint is disabled if any secret is detected"
      - "Values are hashed with SHA-256 before being returned"
      - "They are shown in full; there is no masking mechanism"
      - "Keys matching sensitive patterns are sanitized (masked); show-values (never|always|when-authorized) controls visibility"
    answer: 3
    explanation: |
      In Spring Boot 3.x all values are fully sanitized (masked as ******) by default because show-values
      defaults to never. management.endpoint.env.show-values / configprops.show-values
      (never | always | when-authorized) controls whether real values are shown; even then, keys matching
      sensitive patterns (password, secret, key, token, credentials, etc.) stay masked.
    ref: "concepts.md#exposing-and-securing-endpoints"

  - id: actuator-monitoring-embedded-servers-021
    difficulty: beginner
    tags: [endpoints, beans-mappings]
    question: |
      Which endpoint lists every @RequestMapping path and its conditions (methods, produces/consumes),
      useful for debugging why a URL returns 404?
    options:
      - "/actuator/mappings"
      - "/actuator/conditions"
      - "/actuator/routes"
      - "/actuator/beans"
    answer: 0
    explanation: |
      /actuator/mappings lists all request mappings (MVC handlers, filters, servlets, actuator endpoints)
      with their matching conditions.
    ref: "concepts.md#info-env-beans-mappings"

  - id: actuator-monitoring-embedded-servers-022
    difficulty: intermediate
    tags: [info, contributors]
    question: |
      In Spring Boot 3.x, why might info.* properties not appear in /actuator/info even though they are
      set in application.properties?
    options:
      - "The info endpoint is disabled by default"
      - "The env InfoContributor is disabled by default; set management.info.env.enabled=true"
      - "info.* keys are always sanitized"
      - "The /info endpoint only reads from git.properties"
    answer: 1
    explanation: |
      In Boot 2.6+/3.x the env info contributor is disabled by default. Enable it with
      management.info.env.enabled=true to surface arbitrary info.* properties.
    ref: "concepts.md#info-env-beans-mappings"

  - id: actuator-monitoring-embedded-servers-023
    difficulty: intermediate
    tags: [env, property-sources]
    question: |
      What does /actuator/env primarily display?
    options:
      - "The JVM system properties merged into a single flat map with no ordering"
      - "Only OS environment variables"
      - "The Environment's PropertySources in precedence order (args, env vars, application.properties, etc.)"
      - "The contents of application.yml verbatim only"
    answer: 2
    explanation: |
      /env shows all PropertySources in resolution order so you can see which source a property came from
      and its effective value (sensitive values sanitized).
    ref: "concepts.md#info-env-beans-mappings"

  - id: actuator-monitoring-embedded-servers-024
    difficulty: intermediate
    tags: [loggers, runtime]
    question: |
      How do you change the log level of com.myapp.service to DEBUG at runtime without a restart?
    options:
      - "PUT /actuator/env with logging.level.com.myapp.service=DEBUG"
      - "It is impossible without restarting the JVM"
      - "GET /actuator/loggers/com.myapp.service?level=DEBUG"
      - "POST /actuator/loggers/com.myapp.service with body {\"configuredLevel\":\"DEBUG\"}"
    answer: 3
    explanation: |
      POST to /actuator/loggers/{name} with a JSON body {"configuredLevel":"DEBUG"} changes the level live.
      Posting configuredLevel: null resets it to inherit from the parent logger.
    ref: "concepts.md#loggers-runtime-log-level"

  - id: actuator-monitoring-embedded-servers-025
    difficulty: advanced
    tags: [loggers, reset]
    question: |
      What is the effect of POSTing {"configuredLevel": null} to /actuator/loggers/com.myapp?
    options:
      - "It resets the logger to inherit its effective level from its parent"
      - "It throws a 400 Bad Request"
      - "It sets the logger to TRACE"
      - "It disables the logger entirely (OFF)"
    answer: 0
    explanation: |
      A null configuredLevel clears any explicit level so the logger again inherits from its parent
      (ultimately root). It is not the same as OFF.
    ref: "concepts.md#loggers-runtime-log-level"

  - id: actuator-monitoring-embedded-servers-026
    difficulty: intermediate
    tags: [threaddump, heapdump]
    question: |
      Which statement about /actuator/threaddump and /actuator/heapdump is correct?
    options:
      - "threaddump returns a binary hprof file; heapdump returns JSON"
      - "threaddump returns thread state (JSON, or jstack-style with Accept: text/plain); heapdump streams a binary hprof file"
      - "Both endpoints are exposed publicly by default"
      - "heapdump only works with the G1 garbage collector"
    answer: 1
    explanation: |
      /threaddump gives a thread dump (JSON by default; text/plain gives jstack style). /heapdump streams a
      binary hprof file for offline analysis. Both are sensitive and must be secured.
    ref: "concepts.md#threaddump-and-heapdump"

  - id: actuator-monitoring-embedded-servers-027
    difficulty: beginner
    tags: [micrometer, facade]
    question: |
      What role does Micrometer play in a Spring Boot application?
    options:
      - "It is the health-check aggregation engine"
      - "It is the embedded web server"
      - "It is a vendor-neutral metrics facade that ships metrics to backends via MeterRegistry implementations"
      - "It is the distributed tracing collector"
    answer: 2
    explanation: |
      Micrometer is 'SLF4J for metrics' - you instrument against its API, and a MeterRegistry
      implementation (Prometheus, Datadog, CloudWatch, etc.) exports to a specific backend.
    ref: "concepts.md#micrometer-and-meter-registries"

  - id: actuator-monitoring-embedded-servers-028
    difficulty: intermediate
    tags: [micrometer, meter-types]
    question: |
      Which Micrometer meter type is appropriate for a value that can increase AND decrease, such as the
      current number of items in a queue?
    options:
      - "DistributionSummary"
      - "Counter"
      - "Timer"
      - "Gauge"
    answer: 3
    explanation: |
      A Gauge samples an instantaneous value that can go up or down. Counter is monotonically increasing;
      Timer measures durations; DistributionSummary measures distributions of non-time values.
    ref: "concepts.md#micrometer-and-meter-registries"

  - id: actuator-monitoring-embedded-servers-029
    difficulty: advanced
    tags: [micrometer, cardinality]
    question: |
      A developer adds the customer's user ID as a tag on the http.server.requests timer. What is the main
      risk?
    options:
      - "High cardinality: a separate time series per user can explode memory in the registry and backend"
      - "Micrometer will refuse to register more than 100 tags"
      - "The tag will be automatically sanitized and dropped"
      - "The metric name will collide with JVM metrics"
    answer: 0
    explanation: |
      Dimensional metrics create one time series per unique tag combination. Unbounded values like user IDs
      or raw URLs cause cardinality explosion and can OOM the registry/backend. Use bounded values (URI
      templates, status codes).
    ref: "concepts.md#micrometer-and-meter-registries"

  - id: actuator-monitoring-embedded-servers-030
    difficulty: advanced
    tags: [micrometer, common-tags]
    question: |
      What is the idiomatic way to add a common tag (e.g. application name) to every metric?
    options:
      - "Add the tag manually at each meter registration site"
      - "Define a MeterRegistryCustomizer<MeterRegistry> bean that calls config().commonTags(...)"
      - "Set management.metrics.tags.application in a controller"
      - "Override the MeterRegistry bean entirely"
    answer: 1
    explanation: |
      A MeterRegistryCustomizer<MeterRegistry> bean applying registry.config().commonTags(...) adds the tags
      to all meters published by that registry.
    ref: "concepts.md#micrometer-and-meter-registries"

  - id: actuator-monitoring-embedded-servers-031
    difficulty: intermediate
    tags: [micrometer, composite]
    question: |
      When multiple MeterRegistry beans are present, how does Micrometer publish a single meter?
    options:
      - "Each meter must be registered against each registry manually"
      - "It picks one registry at random"
      - "They are combined into a CompositeMeterRegistry and the meter is published to all of them"
      - "Only the primary registry receives the meter"
    answer: 2
    explanation: |
      Spring Boot wires the registries into a CompositeMeterRegistry, so a meter registered once is
      published to every underlying registry.
    ref: "concepts.md#micrometer-and-meter-registries"

  - id: actuator-monitoring-embedded-servers-032
    difficulty: beginner
    tags: [prometheus, scrape]
    question: |
      Prometheus is best described as which type of monitoring system?
    options:
      - "A log aggregation system"
      - "A distributed tracing backend"
      - "A push-based system where apps send metrics to it directly"
      - "A pull-based system that scrapes an HTTP metrics endpoint on a schedule"
    answer: 3
    explanation: |
      Prometheus is pull-based: it periodically scrapes /actuator/prometheus. Short-lived jobs that can't be
      scraped use the Pushgateway instead.
    ref: "concepts.md#prometheus-and-grafana"

  - id: actuator-monitoring-embedded-servers-033
    difficulty: intermediate
    tags: [prometheus, naming]
    question: |
      A Micrometer meter named http.server.requests appears in the Prometheus endpoint as what?
    options:
      - "http_server_requests_seconds (snake_case with base-unit suffix), tags become labels"
      - "HTTP_SERVER_REQUESTS in uppercase"
      - "httpServerRequests in camelCase"
      - "http.server.requests exactly as-is"
    answer: 0
    explanation: |
      The Prometheus registry converts dot names to snake_case and appends the base unit (e.g. _seconds for
      timers). Micrometer tags become Prometheus labels.
    ref: "concepts.md#prometheus-and-grafana"

  - id: actuator-monitoring-embedded-servers-034
    difficulty: advanced
    tags: [prometheus, histogram]
    question: |
      Why is percentiles-histogram preferred over client-side pre-computed percentiles when aggregating
      latency across many instances in Grafana?
    options:
      - "Pre-computed percentiles use less memory"
      - "Histogram buckets can be aggregated across instances (e.g. via histogram_quantile()), while pre-computed percentiles cannot be meaningfully averaged"
      - "Prometheus rejects any metric that lacks pre-computed percentiles"
      - "Histograms are the only format Grafana can render"
    answer: 1
    explanation: |
      Percentiles computed per-instance cannot be averaged to get a fleet-wide percentile. Exporting
      histogram buckets lets Prometheus compute quantiles across instances with histogram_quantile().
    ref: "concepts.md#prometheus-and-grafana"

  - id: actuator-monitoring-embedded-servers-035
    difficulty: intermediate
    tags: [custom-metrics, counter]
    question: |
      What is the correct way to create a custom counter in a service?
    options:
      - "Extend AbstractCounter and register it as a @Bean"
      - "new Counter(\"orders.placed\")"
      - "Inject MeterRegistry and use Counter.builder(\"orders.placed\").register(registry) or registry.counter(...)"
      - "Annotate the field with @Metric"
    answer: 2
    explanation: |
      Counters are created through the registry: Counter.builder(name).tag(...).register(registry) or
      registry.counter(name, tags). The registry caches meters by name+tags so repeated calls are idempotent.
    ref: "concepts.md#custom-metrics"

  - id: actuator-monitoring-embedded-servers-036
    difficulty: advanced
    tags: [custom-metrics, gauge, nan]
    question: |
      A gauge registered with Gauge.builder("queue.size", queue, Queue::size) reports NaN after some time.
      What is the most likely cause?
    options:
      - "Gauges cannot measure collection sizes"
      - "The registry was never flushed"
      - "The queue size exceeded Integer.MAX_VALUE"
      - "Micrometer holds a weak reference to the gauged object; it was garbage-collected because no strong reference was retained"
    answer: 3
    explanation: |
      Micrometer keeps a weak reference to the measured object to avoid memory leaks. If nothing else holds a
      strong reference, the object is GC'd and the gauge reports NaN. Retain a strong reference.
    ref: "concepts.md#custom-metrics"

  - id: actuator-monitoring-embedded-servers-037
    difficulty: intermediate
    tags: [custom-metrics, annotations]
    question: |
      To use the @Timed annotation on a method and have it produce a timer metric, what else is required?
    options:
      - "A TimedAspect bean must be registered (AOP proxying enabled)"
      - "The method must be static"
      - "The class must implement MeterBinder"
      - "Nothing; @Timed works out of the box on any bean"
    answer: 0
    explanation: |
      @Timed relies on a TimedAspect (an AOP aspect). You register a TimedAspect bean; similarly @Counted
      needs a CountedAspect. Without the aspect, the annotation is ignored.
    ref: "concepts.md#custom-metrics"

  - id: actuator-monitoring-embedded-servers-038
    difficulty: beginner
    tags: [embedded, default]
    question: |
      Which embedded servlet container does spring-boot-starter-web use by default?
    options:
      - "Undertow"
      - "Tomcat"
      - "Netty"
      - "Jetty"
    answer: 1
    explanation: |
      Tomcat is the default embedded container for the servlet-stack starter (spring-boot-starter-web).
    ref: "concepts.md#embedded-servers-tomcat-jetty-undertow"

  - id: actuator-monitoring-embedded-servers-039
    difficulty: intermediate
    tags: [embedded, switching]
    question: |
      What is the correct way to switch from Tomcat to Undertow?
    options:
      - "Undertow cannot be used with Spring Boot 3"
      - "Set server.container=undertow in application.properties"
      - "Exclude spring-boot-starter-tomcat from spring-boot-starter-web and add spring-boot-starter-undertow"
      - "Add @EnableUndertow to the main class"
    answer: 2
    explanation: |
      You exclude the Tomcat starter and add the Undertow (or Jetty) starter. Spring Boot then
      auto-configures the corresponding ServletWebServerFactory.
    ref: "concepts.md#embedded-servers-tomcat-jetty-undertow"

  - id: actuator-monitoring-embedded-servers-040
    difficulty: intermediate
    tags: [embedded, webflux, netty]
    question: |
      For a reactive application built with spring-boot-starter-webflux, which server runs by default?
    options:
      - "Undertow"
      - "Jetty"
      - "Tomcat"
      - "Netty (Reactor Netty)"
    answer: 3
    explanation: |
      WebFlux defaults to Reactor Netty, an event-loop, non-blocking server. Tomcat/Jetty/Undertow can also
      run WebFlux on their non-blocking connectors, but Netty is the default.
    ref: "concepts.md#embedded-servers-tomcat-jetty-undertow"

  - id: actuator-monitoring-embedded-servers-041
    difficulty: advanced
    tags: [embedded, port]
    question: |
      What is the effect of setting server.port=0?
    options:
      - "Binds to a random free (ephemeral) port, discoverable via @LocalServerPort"
      - "Binds to port 80"
      - "Causes a startup failure"
      - "Disables HTTP entirely"
    answer: 0
    explanation: |
      server.port=0 tells the container to pick an ephemeral port, handy for tests. Inject the actual port
      with @LocalServerPort. (server.port=-1 disables HTTP.)
    ref: "concepts.md#embedded-servers-tomcat-jetty-undertow"

  - id: actuator-monitoring-embedded-servers-042
    difficulty: advanced
    tags: [embedded, customization]
    question: |
      Which interface lets you programmatically customize the embedded Tomcat factory (e.g. connectors,
      thread pools)?
    options:
      - "TomcatConfigurer"
      - "WebServerFactoryCustomizer<TomcatServletWebServerFactory>"
      - "EmbeddedServletContainerCustomizer (Boot 3)"
      - "ServletContainerInitializer"
    answer: 1
    explanation: |
      Implement WebServerFactoryCustomizer<TomcatServletWebServerFactory> (or the Jetty/Undertow variant) as
      a bean. The old EmbeddedServletContainerCustomizer name was from Boot 1.x.
    ref: "concepts.md#embedded-servers-tomcat-jetty-undertow"

  - id: actuator-monitoring-embedded-servers-043
    difficulty: advanced
    tags: [startup, context]
    question: |
      When spring-boot-starter-web is present, which application context type does SpringApplication create,
      and when does the embedded server bind its port?
    options:
      - "ClassPathXmlApplicationContext; the port binds in the main() method"
      - "GenericApplicationContext; the port binds after ApplicationReadyEvent"
      - "ServletWebServerApplicationContext; the port binds during refresh() in onRefresh()/createWebServer()"
      - "ReactiveWebServerApplicationContext; the port binds before bean definitions load"
    answer: 2
    explanation: |
      Boot creates an AnnotationConfigServletWebServerApplicationContext whose onRefresh() calls
      createWebServer(), which uses the ServletWebServerFactory to create and start (bind) the embedded
      server during context refresh.
    ref: "concepts.md#embedded-tomcat-startup-flow"

  - id: actuator-monitoring-embedded-servers-044
    difficulty: advanced
    tags: [startup, servlet-registration]
    question: |
      In an embedded Spring Boot app there is no web.xml. How is the DispatcherServlet registered and mapped?
    options:
      - "By scanning for @WebServlet annotations only"
      - "It is registered manually in the main method"
      - "Via a web.xml generated at build time"
      - "Via DispatcherServletAutoConfiguration plus a ServletRegistrationBean, mapped to / by default"
    answer: 3
    explanation: |
      Auto-configuration registers the DispatcherServlet via a ServletRegistrationBean (a
      ServletContextInitializer), mapped to / by default. ServletContextInitializer beans replace web.xml.
    ref: "concepts.md#embedded-tomcat-startup-flow"

  - id: actuator-monitoring-embedded-servers-045
    difficulty: intermediate
    tags: [war, deployment]
    question: |
      To deploy a Spring Boot app as a WAR to an external servlet container, what must you do?
    options:
      - "Extend SpringBootServletInitializer and set packaging to war"
      - "Add @EnableWar to the main class"
      - "Remove spring-boot-starter-web"
      - "Nothing; the fat JAR works in any container"
    answer: 0
    explanation: |
      For traditional WAR deployment, the main class extends SpringBootServletInitializer (overriding
      configure) and the build produces a war. The external container starts, not the embedded server.
    ref: "concepts.md#embedded-tomcat-startup-flow"

  - id: actuator-monitoring-embedded-servers-046
    difficulty: beginner
    tags: [graceful-shutdown, config]
    question: |
      Which property enables graceful shutdown so in-flight requests can finish before the server stops?
    options:
      - "server.stop=drain"
      - "server.shutdown=graceful"
      - "spring.graceful=true"
      - "management.shutdown.graceful=true"
    answer: 1
    explanation: |
      server.shutdown=graceful (default is immediate) enables graceful shutdown. The grace period is set via
      spring.lifecycle.timeout-per-shutdown-phase.
    ref: "concepts.md#graceful-shutdown"

  - id: actuator-monitoring-embedded-servers-047
    difficulty: intermediate
    tags: [graceful-shutdown, timeout]
    question: |
      Which property configures how long graceful shutdown waits for active requests to complete?
    options:
      - "server.tomcat.shutdown-wait"
      - "server.shutdown.timeout"
      - "spring.lifecycle.timeout-per-shutdown-phase"
      - "management.endpoint.shutdown.timeout"
    answer: 2
    explanation: |
      spring.lifecycle.timeout-per-shutdown-phase (default 30s) bounds how long Boot waits for in-flight
      requests before proceeding to close the context.
    ref: "concepts.md#graceful-shutdown"

  - id: actuator-monitoring-embedded-servers-048
    difficulty: advanced
    tags: [graceful-shutdown, kubernetes]
    question: |
      In Kubernetes, graceful shutdown appears to be cut short and requests are dropped. Which is the most
      likely root cause?
    options:
      - "Graceful shutdown requires the /actuator/shutdown endpoint to be enabled"
      - "Readiness must be manually flipped in code or shutdown won't drain"
      - "server.shutdown=graceful only works on Tomcat"
      - "terminationGracePeriodSeconds is shorter than the app's shutdown timeout, or the pod receives SIGKILL instead of SIGTERM"
    answer: 3
    explanation: |
      Graceful drain needs SIGTERM and a K8s terminationGracePeriodSeconds larger than the shutdown timeout.
      If the grace period is too short, K8s sends SIGKILL and in-flight requests are dropped. Readiness is
      flipped automatically by Boot at shutdown start.
    ref: "concepts.md#graceful-shutdown"

  - id: actuator-monitoring-embedded-servers-049
    difficulty: intermediate
    tags: [tracing, sleuth, micrometer-tracing]
    question: |
      In Spring Boot 3.x, what replaces Spring Cloud Sleuth for distributed tracing?
    options:
      - "Micrometer Tracing with a bridge (Brave or OpenTelemetry)"
      - "The javax.tracing API"
      - "Zipkin's native Spring integration only"
      - "Spring Cloud Sleuth is still the recommended library"
    answer: 0
    explanation: |
      Sleuth was removed in Boot 3. Its successor is Micrometer Tracing, a facade you pair with exactly one
      bridge: micrometer-tracing-bridge-brave or micrometer-tracing-bridge-otel.
    ref: "concepts.md#distributed-tracing-micrometer-tracing-opentelemetry-zipkinjaeger"

  - id: actuator-monitoring-embedded-servers-050
    difficulty: advanced
    tags: [tracing, sampling]
    question: |
      A team complains that only about 10% of their requests show up as traces in Zipkin. What is the most
      likely reason?
    options:
      - "Zipkin drops 90% of spans by default"
      - "The default tracing sampling probability is 0.1 (10%); set management.tracing.sampling.probability=1.0"
      - "Two tracing bridges are on the classpath"
      - "The traceId header is being stripped by the load balancer"
    answer: 1
    explanation: |
      Micrometer Tracing samples 10% (probability 0.1) by default. Setting
      management.tracing.sampling.probability=1.0 captures all requests (useful in dev/low-traffic).
    ref: "concepts.md#distributed-tracing-micrometer-tracing-opentelemetry-zipkinjaeger"

  - id: actuator-monitoring-embedded-servers-051
    difficulty: advanced
    tags: [tracing, observation-api]
    question: |
      In Spring Boot 3, which single API unifies metrics and tracing so one instrumentation point produces
      both a timer and a span?
    options:
      - "Spring Cloud Sleuth's Tracer"
      - "The Actuator HealthContributor API"
      - "The Micrometer Observation API"
      - "The javax.management API"
    answer: 2
    explanation: |
      The Micrometer Observation API unifies metrics and tracing: an Observation can emit both a timer metric
      and a span. @Observed (with ObservedAspect) or ObservationRegistry create observations.
    ref: "concepts.md#distributed-tracing-micrometer-tracing-opentelemetry-zipkinjaeger"

  - id: actuator-monitoring-embedded-servers-052
    difficulty: advanced
    tags: [tracing, propagation]
    question: |
      Which HTTP header does OpenTelemetry use by default to propagate trace context between services?
    options:
      - "X-Correlation-Id"
      - "X-Request-Id"
      - "X-B3-TraceId"
      - "traceparent (W3C Trace Context)"
    answer: 3
    explanation: |
      OpenTelemetry defaults to the W3C Trace Context 'traceparent' header. Brave/Zipkin default to B3
      headers (X-B3-TraceId, etc.). Both can be configured to interoperate.
    ref: "concepts.md#distributed-tracing-micrometer-tracing-opentelemetry-zipkinjaeger"

  - id: actuator-monitoring-embedded-servers-053
    difficulty: intermediate
    tags: [mdc, correlation]
    question: |
      With Micrometer Tracing enabled in Boot 3, how do traceId and spanId appear in each log line?
    options:
      - "Boot automatically populates them in the MDC and includes %X{traceId} / %X{spanId} in the default log pattern"
      - "They are only visible in the /actuator/trace endpoint"
      - "They are appended as query parameters to log messages"
      - "You must manually call MDC.put for each request"
    answer: 0
    explanation: |
      Boot auto-populates MDC with traceId and spanId, and the default logging pattern includes them
      (e.g. [app,%X{traceId},%X{spanId}]), letting you jump between logs and traces.
    ref: "concepts.md#mdc-and-correlation-ids"

  - id: actuator-monitoring-embedded-servers-054
    difficulty: advanced
    tags: [mdc, thread-safety]
    question: |
      When manually adding a correlation ID to the MDC in a servlet Filter, why is a finally block with
      MDC.remove/clear essential?
    options:
      - "Because MDC is not thread-safe and needs synchronization"
      - "Because threads are pooled/reused; a stale value could leak onto the next request served by that thread"
      - "Because MDC entries are persisted to disk otherwise"
      - "Because the logging system requires an explicit flush"
    answer: 1
    explanation: |
      MDC is ThreadLocal-backed. Servlet threads are pooled, so if you do not clear the value, the next
      request handled by that thread inherits the stale correlation ID. Always clear in finally.
    ref: "concepts.md#mdc-and-correlation-ids"

  - id: actuator-monitoring-embedded-servers-055
    difficulty: beginner
    tags: [logging, slf4j, logback]
    question: |
      What is the default logging implementation in Spring Boot, and what is SLF4J's role?
    options:
      - "Logback is a facade; SLF4J is the implementation"
      - "Log4j2 is the default; SLF4J is the appender"
      - "Logback is the default implementation; SLF4J is the facade (API) you code against"
      - "java.util.logging is the default; SLF4J is a config file format"
    answer: 2
    explanation: |
      Spring Boot uses Logback by default (via spring-boot-starter-logging). SLF4J is the facade/API; the
      backend (Logback) does the actual logging.
    ref: "concepts.md#logging-slf4j-logback-log4j2"

  - id: actuator-monitoring-embedded-servers-056
    difficulty: intermediate
    tags: [logging, config-file]
    question: |
      Why should you name a Logback config logback-spring.xml rather than logback.xml in a Spring Boot app?
    options:
      - "logback.xml only works with Log4j2"
      - "There is no functional difference; it is purely convention"
      - "logback.xml is ignored by Spring Boot entirely"
      - "logback-spring.xml is processed by Spring, enabling <springProfile> and <springProperty>; logback.xml is loaded too early for those extensions"
    answer: 3
    explanation: |
      The -spring variant lets Spring apply its extensions like <springProfile> and <springProperty>. Plain
      logback.xml is picked up directly by Logback too early in the lifecycle for Spring processing.
    ref: "concepts.md#logging-slf4j-logback-log4j2"

  - id: actuator-monitoring-embedded-servers-057
    difficulty: intermediate
    tags: [logging, log4j2, switching]
    question: |
      What is required to switch Spring Boot from Logback to Log4j2?
    options:
      - "Exclude spring-boot-starter-logging and add spring-boot-starter-log4j2"
      - "Add @EnableLog4j2 to the main application class"
      - "Nothing; Log4j2 is used automatically if present"
      - "Set logging.provider=log4j2"
    answer: 0
    explanation: |
      Exclude the default logging starter (which brings Logback) wherever it is pulled in, then add
      spring-boot-starter-log4j2. Config file convention becomes log4j2-spring.xml.
    ref: "concepts.md#logging-slf4j-logback-log4j2"

  - id: actuator-monitoring-embedded-servers-058
    difficulty: advanced
    tags: [logging, log4shell, security]
    question: |
      The Log4Shell (CVE-2021-44228) remote code execution vulnerability affected which component?
    options:
      - "Logback's core"
      - "Log4j2 (versions up to 2.14, via JNDI lookups); fixed in 2.17+"
      - "The Actuator loggers endpoint"
      - "SLF4J's API"
    answer: 1
    explanation: |
      Log4Shell was a JNDI-lookup RCE in Log4j2 (<= 2.14.x), fixed in 2.17+. Logback and SLF4J were not
      affected - a common interview trivia trap.
    ref: "concepts.md#logging-slf4j-logback-log4j2"

  - id: actuator-monitoring-embedded-servers-059
    difficulty: intermediate
    tags: [health, groups]
    question: |
      You configure management.endpoint.health.group.custom.include=db,diskSpace. At what URL is this group
      reachable?
    options:
      - "/actuator/health?group=custom"
      - "/actuator/custom"
      - "/actuator/health/custom"
      - "/actuator/group/custom"
    answer: 2
    explanation: |
      A health group named 'custom' is exposed at /actuator/health/custom. Groups are also the mechanism
      behind the liveness and readiness sub-endpoints.
    ref: "concepts.md#health-endpoint-and-health-details"

  - id: actuator-monitoring-embedded-servers-060
    difficulty: advanced
    tags: [endpoints, operations]
    question: |
      In a custom Actuator endpoint, which annotation maps an operation to an HTTP GET, and what does
      returning null from it produce?
    options:
      - "@GetOperation; returning null produces HTTP 204"
      - "@ReadOperation; returning null produces HTTP 500"
      - "@WriteOperation; returns HTTP 200 with empty body"
      - "@ReadOperation; returning null produces an HTTP 404"
    answer: 3
    explanation: |
      @ReadOperation maps to GET. If it returns null, Actuator responds with HTTP 404 Not Found.
      @WriteOperation maps to POST and @DeleteOperation to DELETE.
    ref: "concepts.md#actuator-purpose-and-setup"

  - id: actuator-monitoring-embedded-servers-061
    difficulty: expert
    tags: [endpoints, operations, status-codes]
    question: |
      A custom @WriteOperation (mapped to POST) completes successfully but returns void (no value). A
      separate @ReadOperation (GET) returns null. What HTTP status does each produce?
    options:
      - "The write returns 204 No Content; the read returns 404 Not Found"
      - "Both return 200 OK with an empty body"
      - "The write returns 404 Not Found; the read returns 204 No Content"
      - "The write returns 200 OK; the read returns 500 Internal Server Error"
    answer: 0
    explanation: |
      The status semantics are asymmetric: a @ReadOperation returning null yields 404, while a
      @WriteOperation/@DeleteOperation returning null/void yields 204 No Content (a successful write with no
      body). Returning a value from either yields 200. A missing required parameter yields 400.
    ref: "concepts.md#actuator-purpose-and-setup"

  - id: actuator-monitoring-embedded-servers-062
    difficulty: expert
    tags: [endpoints, caching]
    question: |
      A developer writes a custom parameter-less @ReadOperation that queries a live counter, but repeated
      HTTP calls within a few seconds return the exact same value even though the counter is changing. A
      second endpoint that takes a @Selector path parameter always returns fresh values. What explains this?
    options:
      - "Actuator serializes read operations, so concurrent calls share one invocation's result"
      - "The @Selector parameter disables Spring's HTTP response compression, which was corrupting the counter"
      - "Actuator automatically caches responses of parameter-less read operations (per management.endpoint.<id>.cache.time-to-live); parameterized operations are never cached"
      - "The JVM JIT is constant-folding the counter read in the parameter-less method"
    answer: 2
    explanation: |
      Actuator caches responses to read operations that take no parameters, controlled by
      management.endpoint.<id>.cache.time-to-live. Operations with a @Selector or query parameter are
      excluded from this cache, which is why the parameterized endpoint stays fresh.
    ref: "concepts.md#actuator-purpose-and-setup"

  - id: actuator-monitoring-embedded-servers-063
    difficulty: advanced
    tags: [endpoints, access, exposure]
    question: |
      Since Spring Boot 3.4, what is the difference in effect between management.endpoint.beans.access=none
      and adding beans to management.endpoints.web.exposure.exclude?
    options:
      - "They are exact synonyms; both merely hide the endpoint from HTTP"
      - "access=none removes the endpoint bean from the application context entirely, while exposure exclude keeps the bean (and JMX/other tech) but hides it from that exposure technology"
      - "exposure.exclude removes the bean from the context; access=none only affects JMX"
      - "access=none only applies to write operations, so GET on /beans still works"
    answer: 1
    explanation: |
      access=none (which replaced enabled=false) removes the endpoint from the context altogether — a
      stronger effect. Exposure include/exclude only controls which technology (HTTP/JMX) an otherwise
      available endpoint is reachable over, leaving the bean present.
    ref: "concepts.md#key-endpoints-overview"

  - id: actuator-monitoring-embedded-servers-064
    difficulty: expert
    tags: [endpoints, access, max-permitted]
    question: |
      Configuration sets management.endpoints.access.default=unrestricted, management.endpoint.loggers.access=unrestricted,
      and management.endpoints.access.max-permitted=read-only. What access does the loggers endpoint
      effectively have?
    options:
      - "unrestricted, because the per-endpoint setting is most specific and wins"
      - "read-only, because max-permitted is an application-wide ceiling that overrides both the default and per-endpoint access"
      - "none, because conflicting access levels cause the endpoint to be disabled"
      - "unrestricted for GET and none for POST, resolved independently per HTTP method"
    answer: 1
    explanation: |
      management.endpoints.access.max-permitted is a global ceiling that takes precedence over both the
      default and any individual endpoint access. Even though loggers requests unrestricted, the ceiling
      caps it at read-only, so POSTs to change levels would be rejected.
    ref: "concepts.md#key-endpoints-overview"

  - id: actuator-monitoring-embedded-servers-065
    difficulty: advanced
    tags: [endpoints, cors]
    question: |
      A browser-based dashboard hosted at https://ops.example.com makes an XHR to /actuator/health on the
      app's origin and the request is blocked by CORS, even though /actuator/health returns 200 when hit
      directly. What is the correct fix?
    options:
      - "Set management.endpoints.web.exposure.include=* — CORS is a side effect of endpoints not being exposed"
      - "Actuator ignores CORS; the fix must be a reverse-proxy rewrite"
      - "Enable Spring MVC global CORS with @CrossOrigin on the health controller"
      - "Actuator CORS is disabled until configured; set management.endpoints.web.cors.allowed-origins=https://ops.example.com (plus allowed-methods)"
    answer: 3
    explanation: |
      Actuator has its own CORS configuration, disabled by default. It is enabled only once
      management.endpoints.web.cors.allowed-origins is set. @CrossOrigin on a controller does not apply to
      actuator endpoints, which are not regular @Controller beans.
    ref: "concepts.md#key-endpoints-overview"

  - id: actuator-monitoring-embedded-servers-066
    difficulty: expert
    tags: [health, caching, performance]
    question: |
      Under sustained load, /actuator/health occasionally takes 5+ seconds and the Kubernetes readiness
      probe times out, briefly removing healthy pods from the Service. Investigation shows a custom
      HealthIndicator calling a downstream over HTTP with no explicit timeout. Which explanation and fix pair
      is most accurate?
    options:
      - "Health indicators run serially on the request thread; a slow/blocking indicator stalls the whole /health response. Add a tight timeout in the indicator (and/or move the check out of the readiness group)"
      - "The health cache is disabled by default, causing recomputation on every scrape; enabling it fixes the timeout with no other change"
      - "Kubernetes probes bypass the aggregator and call each indicator in parallel, so timeouts are impossible from a single slow indicator"
      - "The indicator runs on a dedicated scheduler, so its latency cannot affect the HTTP response time"
    answer: 0
    explanation: |
      By default all indicators are invoked serially on the request-handling thread, so one blocking check
      dominates /health latency and can cascade into probe timeouts. The fix is bounding the check
      (timeouts), caching, or excluding it from the readiness group so external latency doesn't pull pods.
    ref: "concepts.md#health-endpoint-and-health-details"

  - id: actuator-monitoring-embedded-servers-067
    difficulty: expert
    tags: [health, custom-status, aggregation]
    question: |
      A team introduces a custom health status "FROZEN" via Health.status("FROZEN") in an indicator. They
      observe /actuator/health returns overall status FROZEN with HTTP 200 even though they intended it to
      signal a serious problem. Why, and what makes it map to 503?
    options:
      - "Custom statuses are illegal and silently coerced to UP; rename it to DOWN"
      - "The status is unknown to the default StatusAggregator ordering and the default HttpCodeStatusMapper only maps DOWN/OUT_OF_SERVICE to 503; register a StatusAggregator order and an HttpCodeStatusMapper (or status.http-mapping) for FROZEN"
      - "HTTP code is fixed at 200 for any status other than DOWN and cannot be changed"
      - "You must set management.endpoint.health.show-details=always before custom statuses affect the HTTP code"
    answer: 1
    explanation: |
      Only known statuses have a defined severity and HTTP mapping. A custom status won't influence the
      overall result or code unless you configure the StatusAggregator ordering
      (management.endpoint.health.status.order) and an HttpCodeStatusMapper /
      management.endpoint.health.status.http-mapping entry for it.
    ref: "concepts.md#health-endpoint-and-health-details"

  - id: actuator-monitoring-embedded-servers-068
    difficulty: advanced
    tags: [health, groups, additional-path]
    question: |
      The management server runs on a separate, firewalled port (management.server.port=9090) that the
      Kubernetes kubelet cannot reach, but probes must hit the app port 8080. Which configuration exposes the
      readiness group on the main application port?
    options:
      - "management.endpoint.health.group.readiness.additional-path=server:/readyz"
      - "management.server.port=8080 (there is no other way)"
      - "management.endpoint.health.group.readiness.port=8080"
      - "server.additional-health-path=/readyz"
    answer: 0
    explanation: |
      additional-path with the 'server:' prefix exposes a health group on the main server port (e.g.
      /readyz on 8080) in addition to the management port. This is the standard pattern when the management
      port is isolated from the probe caller.
    ref: "concepts.md#health-endpoint-and-health-details"

  - id: actuator-monitoring-embedded-servers-069
    difficulty: expert
    tags: [health, custom-indicator, bean-name]
    question: |
      A health group is configured with management.endpoint.health.group.critical.include=paymentsCheck, but
      the group is always UP and never reflects the payments check. The indicator is declared as
      @Bean("paymentGatewayHealthIndicator") PaymentGatewayHealthIndicator paymentGatewayHealthIndicator(){...}.
      What is wrong?
    options:
      - "Health groups cannot reference custom indicators, only auto-configured ones"
      - "The component key is derived from the bean name (suffix stripped) → 'paymentGateway', not 'paymentsCheck'; the include references a non-existent key, which is silently ignored"
      - "@Bean-declared indicators are excluded from groups; only @Component works"
      - "The group needs management.endpoint.health.group.critical.show-components=always to include members"
    answer: 1
    explanation: |
      The component key comes from the bean name with the HealthIndicator/Contributor suffix removed and
      first letter lowercased — here 'paymentGateway'. An include that names a key that doesn't exist is
      silently ignored (not an error), so the group contains nothing and defaults to UP.
    ref: "concepts.md#custom-health-indicators"

  - id: actuator-monitoring-embedded-servers-070
    difficulty: advanced
    tags: [health, detail-leakage, security]
    question: |
      A publicly reachable /actuator/health has show-details=always. A DB outage causes the response to
      include a details entry with the full JDBC exception, revealing the internal hostname and schema. What
      is the accurate root cause?
    options:
      - "Health.down(ex) and AbstractHealthIndicator include the exception class and message in details, which are then shown because show-details=always"
      - "Spring Boot always redacts exceptions; the leak must come from a reverse proxy"
      - "This only happens with reactive indicators; servlet indicators never expose exceptions"
      - "The /env endpoint, not /health, is leaking the exception via property sources"
    answer: 0
    explanation: |
      Health.down(ex) records the exception type and message in the health details. With show-details=always
      on a public endpoint, that internal information is exposed. Restrict details (when-authorized/never)
      or sanitize what you put into the builder.
    ref: "concepts.md#custom-health-indicators"

  - id: actuator-monitoring-embedded-servers-071
    difficulty: expert
    tags: [probes, startup, kubernetes]
    question: |
      A Spring Boot app has a long, variable warm-up (cache priming, JIT). With only liveness and readiness
      probes configured, Kubernetes sometimes restarts the pod mid-startup before it ever becomes ready. What
      is the idiomatic Kubernetes/Spring Boot remedy?
    options:
      - "Add a Kubernetes startupProbe (commonly pointed at the readiness group or a dedicated health group) so the liveness/readiness checks are deferred until startup succeeds, preventing premature restarts of slow-starting apps"
      - "Set the liveness probe's initialDelaySeconds to 0 so it never fires early"
      - "Move the db indicator into the liveness group so startup waits for the database"
      - "Set management.endpoint.health.probes.enabled=false so probes only run after ApplicationReadyEvent"
    answer: 0
    explanation: |
      A slow-booting app can trip the liveness probe before initialization finishes, causing restart loops.
      Kubernetes' startupProbe holds off the liveness and readiness checks until startup succeeds; it is
      commonly aimed at the readiness health group or a dedicated group. It exists precisely to cover
      slow-starting apps and is separate from liveness/readiness.
    ref: "concepts.md#liveness-and-readiness-probes"

  - id: actuator-monitoring-embedded-servers-072
    difficulty: expert
    tags: [probes, http-codes]
    question: |
      What HTTP status does /actuator/health/readiness return when the application's ReadinessState is
      REFUSING_TRAFFIC, and why does this matter during graceful shutdown?
    options:
      - "200, because the endpoint itself is still up; Kubernetes inspects the JSON body instead"
      - "503, so the kubelet marks the probe as failed and stops routing traffic even before the endpoints slice update propagates"
      - "204, indicating no readiness information is available yet"
      - "500, which Kubernetes treats as a transient error and retries without removing the pod"
    answer: 1
    explanation: |
      REFUSING_TRAFFIC maps to 503 on the readiness endpoint. Since Boot flips readiness to REFUSING_TRAFFIC
      at shutdown start, the failing probe causes the kubelet to stop sending traffic promptly, complementing
      the slower Endpoints/EndpointSlice propagation.
    ref: "concepts.md#liveness-and-readiness-probes"

  - id: actuator-monitoring-embedded-servers-073
    difficulty: advanced
    tags: [probes, self-healing, availability]
    question: |
      A service publishes AvailabilityChangeEvent(REFUSING_TRAFFIC) when a downstream is unavailable, and
      later publishes ACCEPTING_TRAFFIC when it recovers. Is this a valid pattern, and what is the key
      difference from doing the same with LivenessState.BROKEN?
    options:
      - "Both are invalid; availability state is read-only and set only by the framework"
      - "Valid for readiness (the pod re-enters the LB after recovery, no restart); with liveness BROKEN, Kubernetes restarts the pod, so in-app recovery is moot — reserve BROKEN for unrecoverable states"
      - "Valid only for liveness; readiness cannot be changed programmatically"
      - "Both trigger a pod restart, so there is no practical difference"
    answer: 1
    explanation: |
      Readiness can legitimately toggle at runtime, letting the pod self-heal back into rotation without
      restart. Liveness BROKEN triggers a Kubernetes restart, after which in-process recovery is irrelevant —
      so reserve BROKEN for genuinely unrecoverable conditions.
    ref: "concepts.md#liveness-and-readiness-probes"

  - id: actuator-monitoring-embedded-servers-074
    difficulty: expert
    tags: [security, management-port, context]
    question: |
      With management.server.port=9091 (different from server.port=8080), a servlet Filter registered as a
      @Bean unexpectedly does NOT run for requests to /actuator/* on 9091, and a SecurityFilterChain only
      protects the app port. What is the underlying reason?
    options:
      - "Filters cannot run on any actuator endpoint regardless of port configuration"
      - "A separate management port runs actuator in a distinct child WebServerApplicationContext with its own connector; filters/chains bound to the main context do not automatically apply there"
      - "Filters only run on POST requests, and actuator scrapes use GET"
      - "The management port disables the servlet container and uses raw sockets"
    answer: 1
    explanation: |
      A distinct management port creates a separate child context with its own web server. Filters and
      security chains registered against the main application context don't apply to it; you must configure
      the management context (and @LocalManagementPort is used in tests to find its port).
    ref: "concepts.md#exposing-and-securing-endpoints"

  - id: actuator-monitoring-embedded-servers-075
    difficulty: advanced
    tags: [security, endpoint-request, ordering]
    question: |
      An app defines two SecurityFilterChain beans: one using EndpointRequest.toAnyEndpoint() requiring role
      ACTUATOR, and a catch-all one permitting all requests. Actuator endpoints end up publicly accessible.
      What is the most likely cause?
    options:
      - "EndpointRequest.toAnyEndpoint() is broken when Spring Security is present"
      - "The catch-all chain is ordered before the actuator chain, so it matches actuator requests first; the actuator chain must have a lower @Order to win"
      - "You must use requestMatchers(\"/actuator/**\") — EndpointRequest does not work with multiple chains"
      - "permitAll() on any chain globally disables authentication for the whole application"
    answer: 1
    explanation: |
      With multiple SecurityFilterChains, the first chain whose securityMatcher matches a request handles it.
      If the permissive catch-all is ordered first, it captures actuator requests. Give the actuator chain a
      lower @Order so it is evaluated before the catch-all.
    ref: "concepts.md#exposing-and-securing-endpoints"

  - id: actuator-monitoring-embedded-servers-076
    difficulty: expert
    tags: [env, write, security]
    question: |
      Even though /actuator/env masks sensitive values, why is enabling POST /actuator/env
      (management.endpoint.env.post.enabled=true) on a reachable actuator a notable risk beyond information
      disclosure?
    options:
      - "It lets a caller inject properties into a high-precedence MapPropertySource at runtime, a write foothold that can alter application behavior"
      - "It permanently rewrites application.properties on disk"
      - "It disables sanitization for all future GET /env responses"
      - "It exposes the heap dump as a side effect"
    answer: 0
    explanation: |
      The POST write operation adds/overrides properties in a runtime MapPropertySource near the top of
      precedence, which can change behavior (feature flags, endpoints, credentials sources). This is why env
      should be read-only by default and any write access gated behind strong auth.
    ref: "concepts.md#exposing-and-securing-endpoints"

  - id: actuator-monitoring-embedded-servers-077
    difficulty: advanced
    tags: [loggers, access, write]
    question: |
      A team exposes the loggers endpoint (it appears in the discovery page and GET works), but
      POST /actuator/loggers/com.acme with {"configuredLevel":"DEBUG"} is rejected. access is left at the
      default and management.endpoints.access.default=read-only was set globally. What is happening?
    options:
      - "Changing log levels requires a restart; runtime changes are impossible"
      - "Exposure enables the endpoint but write operations need unrestricted access; read-only access permits GET but rejects the POST"
      - "The body is malformed; configuredLevel must be an integer"
      - "The loggers endpoint only accepts PUT, not POST"
    answer: 1
    explanation: |
      Exposure controls reachability by technology; access controls read vs write. The POST is a write
      operation, so with read-only access it is rejected. You need unrestricted access (for that endpoint or
      the default) to change levels at runtime.
    ref: "concepts.md#loggers-runtime-log-level"

  - id: actuator-monitoring-embedded-servers-078
    difficulty: advanced
    tags: [loggers, configured-effective]
    question: |
      GET /actuator/loggers/com.acme.OrderService returns {"configuredLevel": null, "effectiveLevel":
      "INFO"}. What does this mean?
    options:
      - "The logger is disabled (OFF)"
      - "No explicit level is set on this logger; it inherits INFO from an ancestor (ultimately ROOT). effectiveLevel is the resolved level after inheritance"
      - "configuredLevel null indicates a configuration error"
      - "The logger will log nothing until configuredLevel is set"
    answer: 1
    explanation: |
      configuredLevel is the level explicitly set on that logger (null = none set); effectiveLevel is what it
      resolves to via inheritance from parents. A null configured with INFO effective simply means it
      inherits INFO from an ancestor.
    ref: "concepts.md#loggers-runtime-log-level"

  - id: actuator-monitoring-embedded-servers-079
    difficulty: expert
    tags: [micrometer, global-registry, meter-filter]
    question: |
      A developer instruments code with io.micrometer.core.instrument.Metrics.globalRegistry.counter(...).
      The counter appears in some backends but is missing the application common tags and never shows up in
      /actuator/prometheus. What is the root cause?
    options:
      - "The Prometheus endpoint only shows Timers, not Counters"
      - "Metrics.globalRegistry is a separate static registry, not Spring's managed MeterRegistry; it doesn't receive Boot's MeterFilters, common tags, or the Prometheus registry. Inject the MeterRegistry instead"
      - "Common tags are applied only to Gauges, so Counters never carry them"
      - "globalRegistry requires management.metrics.export.global=true to be scraped"
    answer: 1
    explanation: |
      The static Metrics.globalRegistry is distinct from the Spring-managed MeterRegistry. Boot binds its
      MeterFilters, common tags, and backend registries (Prometheus) to the managed registry only. Always
      instrument through the injected MeterRegistry.
    ref: "concepts.md#micrometer-and-meter-registries"

  - id: actuator-monitoring-embedded-servers-080
    difficulty: expert
    tags: [micrometer, http-server-requests, uri-tag]
    question: |
      For an incoming request to GET /orders/42 that matches @GetMapping("/orders/{id}"), what value does the
      'uri' tag of http.server.requests carry, and what would the tag be for a request to a path that matches
      no handler (404)?
    options:
      - "/orders/{id} for the matched request; NOT_FOUND for the unmatched 404"
      - "/orders/42 for the matched request; /orders/{id} for the 404"
      - "/orders/42 for both, since Micrometer uses the raw path"
      - "UNKNOWN for the matched request; root for the 404"
    answer: 0
    explanation: |
      The uri tag uses the route template before substitution (/orders/{id}), which bounds cardinality.
      Unmatched paths (404) are tagged NOT_FOUND, redirects REDIRECTION, the app root 'root', and
      unresolvable templates UNKNOWN.
    ref: "concepts.md#micrometer-and-meter-registries"

  - id: actuator-monitoring-embedded-servers-081
    difficulty: expert
    tags: [micrometer, cardinality, max-uri-tags]
    question: |
      An endpoint accidentally tags http.server.requests with raw paths, and after some time metrics for new
      URIs stop appearing while a WARN is logged. Which mechanism caused this, and what is the correct fix?
    options:
      - "Prometheus rejected the scrape; restart Prometheus"
      - "The registry ran out of heap and disabled itself; increase -Xmx only"
      - "management.metrics.web.server.max-uri-tags (default 100) was exceeded, installing a deny MeterFilter that drops further http.server.requests meters; fix the missing URI template rather than just raising the limit"
      - "Micrometer rotates URIs hourly; wait for the next window"
    answer: 2
    explanation: |
      Once max-uri-tags is exceeded, Micrometer installs a deny filter and drops further meters for that name
      with a WARN. The real fix is eliminating the unbounded (raw-path) tag by using URI templates; merely
      raising the limit just postpones the cardinality problem.
    ref: "concepts.md#micrometer-and-meter-registries"

  - id: actuator-monitoring-embedded-servers-082
    difficulty: advanced
    tags: [micrometer, meter-filter, order]
    question: |
      Which statement about MeterFilter beans in Spring Boot is correct?
    options:
      - "MeterFilters only affect the JMX registry"
      - "MeterFilters must be registered manually via registry.config().meterFilter() in every registry"
      - "A MeterFilter can rename a meter but cannot deny it"
      - "All MeterFilter beans are auto-applied to the Spring-managed MeterRegistry; they run in order and the first accept/deny decision for a meter wins"
    answer: 3
    explanation: |
      Boot binds all MeterFilter beans to the managed registry. Filters process in registration order; the
      first accept/deny decision applies. They can deny, accept, rename tags, map IDs, and cap tag
      cardinality (maximumAllowableTags).
    ref: "concepts.md#micrometer-and-meter-registries"

  - id: actuator-monitoring-embedded-servers-083
    difficulty: expert
    tags: [prometheus, pushgateway, short-lived]
    question: |
      A short-lived batch/CronJob process instruments Micrometer counters and timers, but its metrics never
      appear in Prometheus because the process exits long before the next scrape interval. What is the
      standard way to get these metrics into Prometheus, and what is the key caveat?
    options:
      - "Push the metrics to the Prometheus Pushgateway before the job exits; the caveat is that the Pushgateway holds the last pushed value indefinitely (it does not expire), so you must delete/overwrite stale groups to avoid stale series"
      - "Reduce management.prometheus.metrics.export.step to 1s so the pull happens before exit"
      - "Prometheus automatically retries scraping exited pods, so no change is needed"
      - "Switch the job to a Gauge-only registry, which Prometheus scrapes on shutdown"
    answer: 0
    explanation: |
      Pull-based Prometheus can't scrape a process that has already exited. The Pushgateway is the intended
      bridge for short-lived/batch jobs: the job pushes before exiting. The caveat is that the Pushgateway
      persists the last pushed value and does not expire it, so stale metrics linger until the group is
      deleted or overwritten — it is not meant for long-lived service metrics.
    ref: "concepts.md#prometheus-and-grafana"

  - id: actuator-monitoring-embedded-servers-084
    difficulty: expert
    tags: [prometheus, slo, buckets]
    question: |
      management.metrics.distribution.slo.http.server.requests=100ms,250ms is set (with
      percentiles-histogram). What do these SLO values produce on the Prometheus side?
    options:
      - "They set alert thresholds in Prometheus automatically"
      - "They drop any request slower than 250ms from the metric"
      - "They add explicit cumulative histogram buckets at those boundaries (le=\"0.1\", le=\"0.25\"), so you can compute the fraction of requests under each threshold"
      - "They pre-compute p100 and p250 percentiles"
    answer: 2
    explanation: |
      Each SLO value adds a specific cumulative histogram bucket boundary (le). This lets PromQL compute the
      proportion of observations under a threshold precisely, complementing the auto-generated
      percentiles-histogram buckets.
    ref: "concepts.md#prometheus-and-grafana"

  - id: actuator-monitoring-embedded-servers-085
    difficulty: advanced
    tags: [prometheus, exemplars, tracing]
    question: |
      Exemplars (trace IDs attached to histogram buckets) are configured, and a tracer is present, but
      Prometheus never stores any exemplars for the app's metrics. Which requirement is most likely missing?
    options:
      - "The metrics must be scraped with the OpenMetrics format (Accept: application/openmetrics-text) and Prometheus must have exemplar storage enabled; plain text exposition drops exemplars"
      - "Exemplars require switching from the Prometheus registry to the OTLP registry"
      - "Exemplars only work with Counters, not Timers"
      - "management.tracing.sampling.probability must be 0.0 to record exemplars"
    answer: 0
    explanation: |
      Exemplars are carried only in the OpenMetrics exposition format and require Prometheus exemplar storage
      to be enabled. If the scrape negotiates plain Prometheus text, the exemplars are dropped even though the
      timers carry them.
    ref: "concepts.md#prometheus-and-grafana"

  - id: actuator-monitoring-embedded-servers-086
    difficulty: expert
    tags: [custom-metrics, timer, long-task]
    question: |
      A nightly batch job runs for ~40 minutes. Operators want a metric showing how long the CURRENTLY
      RUNNING job has been executing (to alert if it hangs), not just the duration recorded after it
      finishes. Which approach is correct?
    options:
      - "A regular Timer with record(); read its max() during the run"
      - "A Gauge bound to System.currentTimeMillis()"
      - "A Counter incremented every second by a scheduler"
      - "A LongTaskTimer (e.g. @Timed(longTask=true) with a distinct metric name), which reports the duration of in-flight executions"
    answer: 3
    explanation: |
      A normal Timer only records duration upon completion, so it can't show an in-progress run. A
      LongTaskTimer measures active/in-flight tasks and their current running durations — exactly the
      hang-detection use case. Note @Timed(longTask=true) requires a metric name different from any short
      task timer on the same method.
    ref: "concepts.md#custom-metrics"

  - id: actuator-monitoring-embedded-servers-087
    difficulty: expert
    tags: [custom-metrics, gauge, thread-safety]
    question: |
      A Gauge is registered with a sampling lambda that performs a synchronous HTTP call to fetch a value.
      Under Prometheus scraping, scrapes intermittently time out. What are the two key facts being violated?
    options:
      - "The gauge function is invoked by the registry's publishing/scrape thread and must be fast and non-blocking; doing I/O in it stalls the scrape. Also Micrometer holds only a weak reference to the gauged object"
      - "Gauges cannot use lambdas; and Prometheus does not support Gauges"
      - "Gauges must be volatile; and the scrape thread requires synchronization on the registry"
      - "The gauge should be a Counter; and Counters are never scraped synchronously"
    answer: 0
    explanation: |
      The gauge's value function runs on the registry's publish/scrape path, so blocking I/O inside it stalls
      the scrape. Gauge functions must be cheap and non-blocking (sample a cached/in-memory value). Separately,
      Micrometer weakly references the measured object, so a strong reference must be retained.
    ref: "concepts.md#custom-metrics"

  - id: actuator-monitoring-embedded-servers-088
    difficulty: expert
    tags: [custom-metrics, timed, aop, self-invocation]
    question: |
      A @Service has a public @Timed method report() that internally calls a second @Timed method compute()
      via this.compute(). A TimedAspect bean is registered. The timer for report() records correctly but
      compute()'s timer never records. Why?
    options:
      - "compute() must be annotated @Counted, not @Timed"
      - "Two @Timed methods in one class are not allowed; only one is instrumented"
      - "Self-invocation (this.compute()) bypasses the Spring AOP proxy, so the @Timed advice on compute() never fires — the same limitation as @Transactional/@Async"
      - "TimedAspect only instruments controllers, not services"
    answer: 2
    explanation: |
      @Timed relies on Spring AOP proxying. A call through 'this' does not go through the proxy, so advice on
      the internally-invoked method is skipped — identical to the well-known @Transactional/@Async
      self-invocation limitation.
    ref: "concepts.md#custom-metrics"

  - id: actuator-monitoring-embedded-servers-089
    difficulty: advanced
    tags: [custom-metrics, timer, tags]
    question: |
      A developer wants to tag a checkout Timer by outcome (success/failure). They build the Timer once in
      the constructor with a fixed tag, then try to change the tag per call. What is the correct pattern?
    options:
      - "Mutate the Timer's tag field before each record() call"
      - "Tags cannot vary at runtime; use separate metric names per outcome"
      - "Register a new Timer object per request with a unique tag; the registry deduplicates automatically by object identity"
      - "Use Timer.start(registry) then sample.stop(Timer.builder(name).tag(\"outcome\", outcome).register(registry)) so the outcome tag is resolved after the operation; the registry caches one series per unique name+tags"
    answer: 3
    explanation: |
      Use a Timer.Sample (start) and stop it against a Timer whose tags (including outcome) are resolved after
      the call. registry.timer/Timer.builder(...).register(...) is idempotent per name+tag set, so this reuses
      one series per outcome value rather than creating unbounded meters.
    ref: "concepts.md#custom-metrics"

  - id: actuator-monitoring-embedded-servers-090
    difficulty: expert
    tags: [embedded, tomcat, threads, saturation]
    question: |
      A Tomcat-based service (default server.tomcat.threads.max=200) starts returning slowly and eventually
      refusing connections during a downstream slowdown, yet /actuator/health still reports UP. What is the
      most accurate description of the failure mode?
    options:
      - "All 200 worker threads are blocked on slow downstream calls; new connections queue in max-connections then the accept-count backlog and are eventually refused. Health stays UP because the pool being saturated isn't a 'down' condition — add timeouts/bulkheads"
      - "Tomcat crashed; health should have reported DOWN"
      - "The JVM ran out of file descriptors, unrelated to the thread pool"
      - "server.port=0 caused ephemeral port exhaustion"
    answer: 0
    explanation: |
      Thread-pool saturation from slow blocking calls causes requests to queue (max-connections) then hit the
      OS accept-count backlog and get refused, while health has no signal that the pool is exhausted. The fix
      is bounding downstream calls (timeouts), bulkheads, and tuning the pool — not health checks.
    ref: "concepts.md#embedded-servers-tomcat-jetty-undertow"

  - id: actuator-monitoring-embedded-servers-091
    difficulty: expert
    tags: [embedded, virtual-threads, loom]
    question: |
      A team enables spring.threads.virtual.enabled=true on Java 21 to improve throughput of a blocking-IO
      service, but sees little improvement and observes carrier threads being blocked. What is the most likely
      cause?
    options:
      - "Virtual threads require Undertow; Tomcat ignores the flag"
      - "Virtual threads cap concurrency at 200 like the platform pool"
      - "synchronized blocks around blocking I/O pin the carrier thread (pre-JDK 24), preventing the scheduler from unmounting the virtual thread — replace synchronized with ReentrantLock"
      - "The flag only affects @Scheduled tasks, not request handling"
    answer: 2
    explanation: |
      A virtual thread that blocks inside a synchronized block pins its carrier (on JDKs before pinning was
      lifted), so the carrier can't run other virtual threads and scalability suffers. Using ReentrantLock
      (or java.util.concurrent locks) around blocking sections avoids pinning.
    ref: "concepts.md#embedded-servers-tomcat-jetty-undertow"

  - id: actuator-monitoring-embedded-servers-092
    difficulty: advanced
    tags: [embedded, port, local-server-port]
    question: |
      In an integration test annotated @SpringBootTest(webEnvironment = RANDOM_PORT), how do you obtain the
      actual bound HTTP port, and why won't reading server.port from the Environment work?
    options:
      - "@Value(\"${server.port}\") returns the real port; the Environment always holds it"
      - "RANDOM_PORT always binds 8080, so hardcode it"
      - "Call ServerSocket.getLocalPort() on a new socket to discover it"
      - "Inject @LocalServerPort int port (or read from WebServerInitializedEvent); server.port in the Environment is 0 because that's the configured value, not the ephemeral bound port"
    answer: 3
    explanation: |
      With a random port, the configured value is 0; the OS assigns the real port at bind time. Read it via
      @LocalServerPort (or WebServerInitializedEvent.getWebServer().getPort()), not the Environment which still
      reflects the configured 0.
    ref: "concepts.md#embedded-servers-tomcat-jetty-undertow"

  - id: actuator-monitoring-embedded-servers-093
    difficulty: expert
    tags: [startup, lifecycle, port-binding]
    question: |
      Precisely when does embedded Tomcat begin listening on its port, and when does ApplicationReadyEvent
      fire relative to that?
    options:
      - "The connector is created and started (listening) during context refresh in onRefresh()/createWebServer(), before refresh completes; ApplicationReadyEvent fires later, after refresh and all runners complete — so the port can be briefly bound even if a late bean fails"
      - "Tomcat binds only after ApplicationReadyEvent; the port is closed during the entire refresh"
      - "Binding happens in the main() method before SpringApplication.run() is called"
      - "The port binds during ConfigurableApplicationContext construction, before any bean definitions load"
    answer: 0
    explanation: |
      onRefresh() calls createWebServer(), and Tomcat starts its connector (binds/listens) at that point,
      before refresh finishes. ApplicationReadyEvent fires after refresh completes and CommandLineRunner/
      ApplicationRunner beans run. Hence a failure late in refresh can leave a briefly-bound-then-released port.
    ref: "concepts.md#embedded-tomcat-startup-flow"

  - id: actuator-monitoring-embedded-servers-094
    difficulty: expert
    tags: [startup, filter-registration, double-registration]
    question: |
      A custom servlet Filter is declared as a @Bean AND also wrapped in a FilterRegistrationBean. Users
      report the filter's logic runs twice per request. What is the cause and the idiomatic fix?
    options:
      - "Filters always run twice in Boot; this is expected"
      - "The DispatcherServlet invokes filters once per dispatch type; disable ASYNC dispatch"
      - "Boot auto-registers any Filter @Bean AND the FilterRegistrationBean also registers it → double registration. Fix by setting the plain @Bean registration disabled (FilterRegistrationBean.setEnabled(false) on an auto-registration) or by not exposing the Filter as a standalone bean, registering it only via FilterRegistrationBean"
      - "Two Tomcat connectors are running; remove one"
    answer: 2
    explanation: |
      Spring Boot auto-registers Filter beans with the servlet container; if you also add a
      FilterRegistrationBean for the same instance, it's registered twice. Register it exactly once — via
      FilterRegistrationBean while preventing the automatic bean registration (or don't expose the Filter as a
      bean directly).
    ref: "concepts.md#embedded-tomcat-startup-flow"

  - id: actuator-monitoring-embedded-servers-095
    difficulty: expert
    tags: [graceful-shutdown, lifecycle, ordering]
    question: |
      With server.shutdown=graceful, in what order do the web server draining and @PreDestroy/DisposableBean
      callbacks occur during context close, and how does spring.lifecycle.timeout-per-shutdown-phase apply?
    options:
      - "@PreDestroy runs first to close resources, then the web server drains in-flight requests"
      - "The timeout applies once to the whole shutdown, not per phase, and beans are destroyed before requests drain"
      - "Both happen simultaneously with no ordering guarantee"
      - "The web server's SmartLifecycle (high phase) stops first — refusing new connections and waiting up to the per-phase timeout for in-flight requests — and only then do lower-phase beans stop and @PreDestroy/DisposableBean run"
    answer: 3
    explanation: |
      SmartLifecycle beans stop in reverse phase order; the web server lifecycle sits at a high phase and
      stops first, draining in-flight requests within timeout-per-shutdown-phase (applied per phase). Only
      afterward do lower-phase beans and @PreDestroy/DisposableBean run — so pools are torn down after
      requests finish.
    ref: "concepts.md#graceful-shutdown"

  - id: actuator-monitoring-embedded-servers-096
    difficulty: expert
    tags: [graceful-shutdown, kubernetes, race]
    question: |
      Even with server.shutdown=graceful and readiness flipping to REFUSING_TRAFFIC on SIGTERM, a small
      number of requests still hit a terminating pod and fail. What Kubernetes-level mechanism addresses this
      race?
    options:
      - "Set terminationGracePeriodSeconds=0 to terminate instantly"
      - "There is no fix; graceful shutdown fully eliminates the race"
      - "Add a preStop hook (e.g. sleep 5-10s) so the pod keeps serving while Endpoints/EndpointSlice removal propagates to kube-proxy/ingress, and ensure terminationGracePeriodSeconds exceeds preStop sleep + shutdown timeout"
      - "Increase management.tracing.sampling.probability so failed requests are traced away"
    answer: 2
    explanation: |
      SIGTERM and Endpoints removal happen concurrently, and endpoint removal propagates asynchronously, so a
      pod can briefly receive traffic after it began refusing. A preStop sleep keeps it serving during
      propagation; the grace period must accommodate the sleep plus the app's drain timeout.
    ref: "concepts.md#graceful-shutdown"

  - id: actuator-monitoring-embedded-servers-097
    difficulty: expert
    tags: [graceful-shutdown, async, scope]
    question: |
      A service relies on server.shutdown=graceful and expects it to also drain an in-progress Kafka/JMS
      message listener and @Async tasks before exit. On shutdown, those are cut off mid-work. Why?
    options:
      - "Graceful shutdown drains only HTTP request handling; it does not wait for @Async tasks, @Scheduled jobs, or message-listener containers unless each is separately configured (e.g. executor await-termination, listener container shutdown timeout)"
      - "Kafka/JMS listeners are HTTP endpoints, so they should have drained — this indicates a bug in Boot"
      - "server.shutdown=graceful only applies to Netty, not to listener containers"
      - "The listeners drain only if management.endpoint.shutdown.enabled=true"
    answer: 0
    explanation: |
      Graceful shutdown covers the web server's in-flight HTTP requests. Background work — @Async/executors,
      @Scheduled, and messaging listener containers — has its own lifecycle and must be configured to await
      termination on shutdown; otherwise it's interrupted when the context closes.
    ref: "concepts.md#graceful-shutdown"

  - id: actuator-monitoring-embedded-servers-098
    difficulty: expert
    tags: [tracing, bridges, classpath]
    question: |
      After adding a dependency for a new feature, an app that previously traced correctly now fails to start
      (or produces erratic tracing). The classpath now contains both micrometer-tracing-bridge-brave and
      micrometer-tracing-bridge-otel. What is the rule being violated?
    options:
      - "Exactly one tracing bridge must be present; having both produces conflicting Tracer/auto-configuration. Remove one bridge"
      - "Both bridges are required; the failure is unrelated"
      - "The bridges must be listed in a specific order in the POM"
      - "You must add a third bridge to arbitrate between them"
    answer: 0
    explanation: |
      Micrometer Tracing requires exactly one bridge (Brave OR OTel). Both on the classpath yields competing
      Tracer beans/auto-configuration and breaks tracing. Exclude the unintended bridge (often pulled in
      transitively).
    ref: "concepts.md#distributed-tracing-micrometer-tracing-opentelemetry-zipkinjaeger"

  - id: actuator-monitoring-embedded-servers-099
    difficulty: expert
    tags: [tracing, propagation, interop]
    question: |
      Service A (Brave bridge, default B3 propagation) calls Service B (OTel bridge, default W3C traceparent).
      Traces appear as two disconnected traces instead of one. What is the cause and fix?
    options:
      - "OTel cannot receive traces from Brave under any configuration"
      - "The sampling probability differs; set both to 1.0 to join the traces"
      - "The propagation formats differ (B3 vs W3C traceparent); B's incoming header isn't recognized so it starts a new trace. Align management.tracing.propagation.type on both services (or enable multi-format propagation)"
      - "Zipkin and Jaeger cannot share a trace ID space, so the split is unavoidable"
    answer: 2
    explanation: |
      Context propagation must use a compatible header format across the boundary. Brave defaults to B3, OTel
      to W3C traceparent; if B doesn't understand A's header it begins a fresh trace. Configure a shared
      propagation type (or enable both formats) so the context carries across.
    ref: "concepts.md#distributed-tracing-micrometer-tracing-opentelemetry-zipkinjaeger"

  - id: actuator-monitoring-embedded-servers-100
    difficulty: expert
    tags: [tracing, sampling, head-based]
    question: |
      A downstream team says they receive far fewer traces than the volume of calls the upstream makes to
      them, and they cannot increase trace capture no matter how they configure their own sampler. Why?
    options:
      - "Their exporter is misconfigured; sampling is per-span and set downstream"
      - "The traceId header is being stripped, so each service samples independently"
      - "Traces are randomly dropped by Zipkin regardless of sampling"
      - "Sampling is head-based: the root service decides sampling and propagates the decision via the sampled flag; downstream services honor it, so they cannot capture more than the upstream sampled"
    answer: 3
    explanation: |
      With head-based sampling, the sampling decision is made once at the trace root and propagated
      (sampled flag). Downstream services respect that decision and thus cannot record more traces than the
      upstream sampled. To capture more, raise the sampling at the edge/root.
    ref: "concepts.md#distributed-tracing-micrometer-tracing-opentelemetry-zipkinjaeger"

  - id: actuator-monitoring-embedded-servers-101
    difficulty: advanced
    tags: [tracing, observation, metrics-vs-span]
    question: |
      With the Observation API, if a request is NOT sampled for tracing, what happens to the metric side of
      the observation (e.g. the timer)?
    options:
      - "The timer metric is still recorded; sampling only affects whether the span is exported, not the metric"
      - "The metric is also dropped, since sampling controls the entire observation"
      - "The metric is recorded but with a 'sampled=false' tag that Prometheus rejects"
      - "Both metric and span are buffered until a sampled request flushes them"
    answer: 0
    explanation: |
      An Observation drives both a metric and a span via separate handlers. Sampling governs span export only;
      the timer/metric is recorded regardless of the sampling decision.
    ref: "concepts.md#distributed-tracing-micrometer-tracing-opentelemetry-zipkinjaeger"

  - id: actuator-monitoring-embedded-servers-102
    difficulty: expert
    tags: [mdc, reactive, context-propagation]
    question: |
      In a WebFlux app, code calls MDC.put("orderId", id) at the start of a handler, then logs inside a
      .flatMap() several operators later — but the log line's MDC is empty. What is the correct Boot 3
      approach?
    options:
      - "Call MDC.put again inside every operator; it's the only way"
      - "Switch the whole app to blocking MVC; MDC cannot work with WebFlux"
      - "ThreadLocal-backed MDC doesn't survive event-loop thread hops; store the value in the Reactor Context, register a ThreadLocalAccessor, and enable Hooks.enableAutomaticContextPropagation() (Micrometer context-propagation) so ThreadLocals are restored per operator"
      - "Set logging.mdc.reactive=true and Boot handles it with no code changes"
    answer: 2
    explanation: |
      Reactive pipelines hop threads, so ThreadLocal MDC set once is lost. The framework-supported solution is
      Micrometer context-propagation: keep the value in the Reactor Context, provide a ThreadLocalAccessor,
      and enable automatic context propagation so ThreadLocals (MDC) are restored around each operator.
    ref: "concepts.md#mdc-and-correlation-ids"

  - id: actuator-monitoring-embedded-servers-103
    difficulty: advanced
    tags: [mdc, async, task-decorator]
    question: |
      A correlation ID set in the request thread's MDC is missing from logs emitted by an @Async method. What
      is the standard fix for a ThreadPoolTaskExecutor?
    options:
      - "Make the MDC map static so all threads share it"
      - "Increase the executor's core pool size so the same thread is reused"
      - "Annotate the async method with @Transactional to propagate context"
      - "Register a TaskDecorator that snapshots the submitting thread's MDC (MDC.getCopyOfContextMap()) and restores it in the worker, clearing it in finally"
    answer: 3
    explanation: |
      @Async runs on a pooled worker with its own (empty/stale) MDC. A TaskDecorator captures the caller's MDC
      at submit time and installs it around the task's run(), removing it afterward to avoid leaking onto the
      pooled thread.
    ref: "concepts.md#mdc-and-correlation-ids"

  - id: actuator-monitoring-embedded-servers-104
    difficulty: advanced
    tags: [logging, initialization, timing]
    question: |
      Why can a plain logback.xml NOT use <springProfile> or <springProperty>, while logback-spring.xml can?
    options:
      - "The LoggingSystem is initialized very early (on ApplicationEnvironmentPreparedEvent) before the context refreshes; plain logback.xml is loaded directly by Logback before Spring can process its extensions, whereas logback-spring.xml is deferred to Spring's initializer"
      - "logback.xml is XML-schema-validated and rejects unknown tags, but logback-spring.xml isn't"
      - "logback.xml only supports Log4j2 syntax"
      - "There is no real difference; both support the Spring tags"
    answer: 0
    explanation: |
      Logging is configured extremely early, before the ApplicationContext exists. A plain logback.xml is
      picked up by Logback's own initialization at that point, too early for Spring's <springProfile>/
      <springProperty> extensions; the -spring variant is handled by Spring's LoggingSystem initializer which
      can apply them.
    ref: "concepts.md#logging-slf4j-logback-log4j2"

  - id: actuator-monitoring-embedded-servers-105
    difficulty: expert
    tags: [logging, async-appender, loss]
    question: |
      A service uses Logback AsyncAppender for performance. During a traffic spike, INFO/DEBUG logs go
      missing, and after a kill -9 the last second of logs is absent entirely. What two behaviors explain
      this?
    options:
      - "Logback rate-limits by default at 100 logs/sec; and kill -9 flushes buffers"
      - "The console appender was disabled; and kill -9 triggers a graceful flush hook"
      - "AsyncAppender drops lower-level events when its queue passes the discardingThreshold (80% full by default) to avoid blocking; and its in-memory queue is not flushed on a hard kill, so buffered events are lost. Set discardingThreshold=0/neverBlock and keep critical logs synchronous"
      - "SLF4J deduplicates identical messages; and async logging persists to disk on crash"
    answer: 2
    explanation: |
      AsyncAppender discards events below WARN once the queue reaches its discardingThreshold (default ~80%
      full) to keep app threads unblocked, and its queue lives in memory so a hard kill loses buffered events.
      Set discardingThreshold=0 / neverBlock=true, or keep audit/critical logs on a synchronous appender.
    ref: "concepts.md#logging-slf4j-logback-log4j2"

  - id: actuator-monitoring-embedded-servers-106
    difficulty: intermediate
    tags: [logging, structured]
    question: |
      In Spring Boot 3.4+, how do you enable built-in structured (JSON) console logging in the Elastic Common
      Schema format without adding logstash-logback-encoder?
    options:
      - "logging.structured.format.console=ecs"
      - "logging.json.enabled=true"
      - "spring.logging.format=json"
      - "management.logging.structured=elastic"
    answer: 0
    explanation: |
      Spring Boot 3.4 added built-in structured logging: logging.structured.format.console (and .file) accepts
      ecs, logstash, or gelf. Earlier versions relied on logstash-logback-encoder.
    ref: "concepts.md#logging-slf4j-logback-log4j2"

  - id: actuator-monitoring-embedded-servers-107
    difficulty: intermediate
    tags: [info, contributors, build-info]
    question: |
      /actuator/info shows git details but no 'build' section when run from the IDE, even though it appears in
      CI-built artifacts. What is the most likely reason?
    options:
      - "The build InfoContributor requires META-INF/build-info.properties, generated by the build plugin's build-info goal; running from the IDE without that goal leaves it absent (no error)"
      - "The info endpoint is disabled in the IDE profile"
      - "Build info is always sanitized and hidden"
      - "git.properties and build-info.properties are mutually exclusive"
    answer: 0
    explanation: |
      The build contributor reads META-INF/build-info.properties produced by the Maven/Gradle plugin's
      build-info goal/task. An IDE run that skips that goal simply has no file, so the contributor emits
      nothing — no error, just a missing section.
    ref: "concepts.md#info-env-beans-mappings"

  - id: actuator-monitoring-embedded-servers-108
    difficulty: advanced
    tags: [env, precedence, debugging]
    question: |
      A property my.timeout is set to 30 in application.yml but the app behaves as if it were 5. Which
      actuator query most directly reveals why, and what concept underlies the answer?
    options:
      - "GET /actuator/beans; bean scope determines property values"
      - "GET /actuator/mappings; request mappings expose property overrides"
      - "GET /actuator/configprops; only @ConfigurationProperties values are resolvable"
      - "GET /actuator/env/my.timeout, which shows the resolved value and every property source contributing it — a higher-precedence source (e.g. an OS env var MY_TIMEOUT) overrides the yaml via relaxed binding"
    answer: 3
    explanation: |
      /env/{name} shows the effective value and all sources defining it, exposing precedence. A
      higher-precedence source (like an environment variable, matched via relaxed binding MY_TIMEOUT) can
      override the yaml value — exactly the kind of override this endpoint is designed to diagnose.
    ref: "concepts.md#info-env-beans-mappings"

  - id: actuator-monitoring-embedded-servers-109
    difficulty: advanced
    tags: [endpoints, selector, all-remaining]
    question: |
      You are writing a custom @WebEndpoint and want a read operation that captures an arbitrary,
      variable-length remainder of the path (like /actuator/files/a/b/c). Which parameter declaration is
      correct?
    options:
      - "@Selector(Match=ALL_REMAINING) on the last parameter, typed conversion-compatible with String[]"
      - "A single @Selector String path parameter captures the entire remainder automatically"
      - "A @RequestParam String[] segments parameter"
      - "@PathVariable Map<String,String> on the operation method"
    answer: 0
    explanation: |
      To capture all remaining path elements, annotate the last operation parameter with
      @Selector(Match=ALL_REMAINING) and make it a type convertible from String[]. A plain @Selector captures
      a single path segment only.
    ref: "concepts.md#actuator-purpose-and-setup"

  - id: actuator-monitoring-embedded-servers-110
    difficulty: advanced
    tags: [prometheus, registry, cumulative]
    question: |
      A developer notices a Micrometer Counter in /actuator/prometheus keeps growing and never resets between
      scrapes, and worries it's a bug. Meanwhile a colleague using a step-based SaaS registry sees per-interval
      values. What is the correct understanding?
    options:
      - "The Prometheus registry is cumulative (monotonic, resetting only on JVM restart) by design; Prometheus computes rates via rate()/increase(). Step-based registries publish per-interval deltas instead — different models, both correct"
      - "The counter is leaking; call counter.reset() each scrape"
      - "Prometheus counters must be reset manually via a MeterFilter"
      - "The SaaS registry is buggy; all registries are cumulative"
    answer: 0
    explanation: |
      Prometheus scraping expects monotonic cumulative counters and derives rates with rate()/increase();
      values only reset on JVM restart (which Prometheus's counter-reset detection handles). Step registries
      publish deltas per step. Neither is a bug — they're different export models.
    ref: "concepts.md#prometheus-and-grafana"

  - id: actuator-monitoring-embedded-servers-111
    difficulty: intermediate
    tags: [endpoints, discovery-page]
    question: |
      What happens to the Actuator discovery page (the JSON links document normally at /actuator) if you set
      management.endpoints.web.base-path=/ ?
    options:
      - "It moves to /actuator regardless of base path"
      - "It throws a startup error about ambiguous mappings"
      - "It is disabled to avoid clashing with application request mappings at the root"
      - "It is served at /discovery instead"
    answer: 2
    explanation: |
      The discovery page normally sits at the base path root and moves with a custom management context path.
      When the base path is '/', Boot disables the discovery page to prevent it from clashing with other
      root-level application mappings.
    ref: "concepts.md#key-endpoints-overview"

  - id: actuator-monitoring-embedded-servers-112
    difficulty: expert
    tags: [threaddump, diagnostics, virtual-threads]
    question: |
      A request appears hung. You capture /actuator/threaddump. Which statement is the most accurate about
      what you can and cannot diagnose from it, especially under virtual threads?
    options:
      - "A thread dump reliably lists every virtual thread with full stacks, identical to platform threads"
      - "The thread dump pauses the JVM for its entire duration like a heap dump"
      - "Thread dumps can only be read as binary hprof and must be analyzed in Eclipse MAT"
      - "It shows platform thread states (BLOCKED/WAITING with lock/monitor info, useful for deadlock/starvation), but the standard JMX-based thread dump does NOT enumerate the potentially huge number of virtual threads the way it does platform threads — diagnosing pinned/blocked virtual threads may need other tooling"
    answer: 3
    explanation: |
      /threaddump gives platform thread states with lock/monitor details, ideal for deadlock and starvation
      analysis. It does not enumerate the vast set of virtual threads the same way platform threads are listed,
      so pinned/blocked virtual-thread diagnosis often needs additional tooling. (hprof is /heapdump, not
      threaddump.)
    ref: "concepts.md#threaddump-and-heapdump"

  - id: actuator-monitoring-embedded-servers-113
    difficulty: advanced
    tags: [heapdump, security, operations]
    question: |
      Which combination of statements about /actuator/heapdump is correct?
    options:
      - "It streams a binary hprof containing the entire heap (including secrets), can pause/stress the JVM while produced, and must be secured; it is not for routine scraping"
      - "It returns JSON summarizing object counts and is safe to expose publicly"
      - "It requires the G1 collector and is disabled under ZGC"
      - "It is enabled and unrestricted by default like /health"
    answer: 0
    explanation: |
      /heapdump streams a binary hprof of the full heap — which includes any in-memory secrets — and producing
      it is expensive (can pause/stress the JVM). It is sensitive, must be secured, and (with shutdown) is one
      of the endpoints not unrestricted by default.
    ref: "concepts.md#threaddump-and-heapdump"

  - id: actuator-monitoring-embedded-servers-114
    difficulty: advanced
    tags: [micrometer, binder, meter-binder]
    question: |
      You want to expose a metric derived from a third-party library object (e.g. an internal cache's stats)
      so it registers against the managed registry and picks up common tags. What is the idiomatic mechanism?
    options:
      - "Subclass MeterRegistry and override register()"
      - "Call Metrics.globalRegistry.gauge(...) from a @PostConstruct"
      - "Implement MeterBinder and register it as a @Bean; Boot binds it to the MeterRegistry (so it inherits MeterFilters/common tags)"
      - "Annotate the third-party class with @Timed"
    answer: 2
    explanation: |
      A MeterBinder bean is bound by Boot to the managed MeterRegistry, so its meters get the common tags and
      MeterFilters. This is how JVM/system/library binders are integrated, and the right hook for third-party
      objects you can't annotate.
    ref: "concepts.md#custom-metrics"

  - id: actuator-monitoring-embedded-servers-115
    difficulty: intermediate
    tags: [tracing, observation, observed]
    question: |
      To have @Observed on a method actually create observations (metric + span), what must be present, and
      what limitation does it share with @Timed?
    options:
      - "Nothing extra; @Observed always works, and it advises private methods too"
      - "management.observations.enabled=true only; proxying is irrelevant"
      - "A dedicated ObservationServlet must be mapped; it works on final methods"
      - "An ObservedAspect bean (AOP) must be registered; like @Timed, it does not fire on self-invocation because the call must go through the proxy"
    answer: 3
    explanation: |
      @Observed requires an ObservedAspect bean to weave the advice. Being AOP-based, it shares @Timed's
      self-invocation limitation — an internal this.method() call bypasses the proxy and produces no
      observation.
    ref: "concepts.md#distributed-tracing-micrometer-tracing-opentelemetry-zipkinjaeger"
